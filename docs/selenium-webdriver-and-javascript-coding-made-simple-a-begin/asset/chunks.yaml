    In this example, we use the WebDriverWait class to wait for an element (By.id("visibleElement"))
    to be visible on the web page. If the element is not visible within the specified
    timeout (10 seconds), a TimeoutException will be thrown, and the catch block will
    handle it.


    ## 13.3 Generating Reports in Selenium WebDriver


    Generating reports in Selenium WebDriver is essential for tracking test execution
    results and identifying issues. There are several reporting libraries available
    that help create detailed reports with screenshots, logs, and test execution statuses.


    One popular reporting library is ExtentReports, which offers rich features for
    creating interactive and comprehensive HTML reports.


    ### 13.3.1 Setting Up ExtentReports


    To use ExtentReports, first, we need to download the ExtentReports JAR file and
    add it to our test project. We can find the latest version of ExtentReports on
    the Maven Central Repository or its official GitHub page.


    After adding the JAR file, we need to set up ExtentReports in our test project.


    Example:


    ```java


    import com.aventstack.extentreports.ExtentReports;


    import com.aventstack.extentreports.ExtentTest;


    import com.aventstack.extentreports.reporter.ExtentHtmlReporter;


    public class ReportSetup {


    public static ExtentReports extent;


    public static ExtentTest test;


    public static void setup() {


    // Specify the location of the report


    ExtentHtmlReporter htmlReporter = new ExtentHtmlReporter("test-output/report.html");


    // Create an ExtentReports object


    extent = new ExtentReports();


    // Attach the HTML report to ExtentReports


    extent.attachReporter(htmlReporter);


    // Additional configurations (optional)


    extent.setSystemInfo("OS", "Windows 10");


    extent.setSystemInfo("Browser", "Chrome");


    }


    }


    ```


    In this example, we set up ExtentReports by creating an ExtentHtmlReporter to
    define the location and format of the report. We then create an ExtentReports
    object and attach the HTML reporter to it. Additional system information can be
    added to the report using the `setSystemInfo()` method.


    ### 13.3.2 Generating Test Reports


    Once ExtentReports is set up, we can use it to generate test reports at different
    stages of test execution, such as test initialization, test success, or test failure.


    Example:


    ```java


    import org.openqa.selenium.By;


    import org.openqa.selenium.WebDriver;


    import org.openqa.selenium.WebElement;


    import org.openqa.selenium.chrome.ChromeDriver;


    public class TestExecutionExample {


    public static void main(String[] args) {


    // Set up ExtentReports


    ReportSetup.setup();


    // Create ChromeDriver instance


    WebDriver driver = new ChromeDriver();


    // Start the test


    ReportSetup.test = ReportSetup.extent.createTest("Test Scenario 1", "Verify Login
    Functionality");


    try {


    // Navigate to the website


    driver.get("https://www.example.com");


    // Find and interact with web elements


    WebElement usernameField = driver.findElement(By.id("username"));


    WebElement passwordField = driver.findElement(By.id("password"));


    WebElement loginButton = driver.findElement(By.id("loginBtn"));


    usernameField.sendKeys("user123");


    passwordField.sendKeys("pass456");


    loginButton.click();


    // Log a test pass


    ReportSetup.test.pass("Login successful");


    } catch (Exception e) {


    // Log a test fail with the exception message


    ReportSetup.test.fail("Test failed: " + e.getMessage());


    }


    // Close the browser and end the test


    driver.quit();


    ReportSetup.extent.flush();


    }


    }


    ```


    In this example, we execute a test scenario for verifying login functionality.
    We use ExtentReports to create a test instance and log test pass or fail status
    based on the test execution result. At the end of the test, we close the browser
    and call `extent.flush()` to generate the HTML report.


    ## 13.4 Conclusion


    Handling exceptions and generating reports are crucial aspects of Selenium WebDriver
    test automation. By gracefully handling exceptions, we can improve the stability
    and reliability of our tests. Additionally, generating comprehensive reports helps
    us track test execution results and identify issues efficiently.


    In this chapter, we explored handling common exceptions in Selenium WebDriver
    and using try-catch blocks to handle them gracefully. We also set up and used
    ExtentReports to generate detailed test reports with status, screenshots, and
    system information.


    # # Chapter 14: Integration with Continuous Integration (CI) Tools


    In Chapter 13, we discussed handling exceptions and generating reports in Selenium
    WebDriver to improve the stability and reliability of test automation. However,
    as test suites become more extensive and frequent, executing tests manually becomes
    impractical. To address this challenge, Continuous Integration (CI) tools come
    into play. In this chapter, we will explore integrating Selenium WebDriver tests
    with CI tools to automate test execution and enable better collaboration among
    team members.


    ## 14.1 Understanding Continuous Integration (CI)


    Continuous Integration is a software development practice that involves automatically
    building, testing, and deploying code changes to a shared repository multiple
    times a day. The primary goal of CI is to detect integration issues early in the
    development cycle and ensure that code changes do not break existing functionality.
    CI helps improve software quality, reduce manual efforts, and streamline the development
    process.


    ## 14.2 Benefits of CI Integration with Selenium WebDriver


    Integrating Selenium WebDriver tests with CI tools brings numerous advantages:


    1\. **Automated Test Execution**: CI tools automatically trigger test execution
    whenever new code changes are committed to the repository, ensuring that tests
    are run regularly and consistently.


    2\. **Early Bug Detection**: With frequent test execution, CI tools quickly identify
    integration issues and bugs, allowing developers to address them promptly.


    3\. **Improved Collaboration**: CI facilitates collaboration among developers,
    testers, and other stakeholders by providing clear visibility into test results
    and code changes.


    4\. **Test Result Reporting**: CI tools generate detailed test reports and metrics,
    giving insights into test execution status, test coverage, and trends over time.


    5\. **Parallel Test Execution**: Many CI tools support parallel test execution,
    which reduces test execution time and improves overall efficiency.


    ## 14.3 Integrating Selenium WebDriver with CI Tools


    Integrating Selenium WebDriver tests with CI tools involves a series of steps:


    ### 14.3.1 Step 1: Setting Up CI Tool


    Choose a CI tool that fits your project''s requirements. Some popular CI tools
    include Jenkins, GitLab CI/CD, Travis CI, and CircleCI. Install and configure
    the CI tool on the build server or cloud environment.


