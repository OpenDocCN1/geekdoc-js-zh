    ```python

    # Locate the button by its ID

    submit_button = driver.find_element_by_id("submit-button")

    # Click the button

    submit_button.click()

    ```


    ## 3.3 Checkboxes and Radio Buttons


    Checkboxes and radio buttons are input elements that allow users to make selections
    from multiple options. In Selenium WebDriver, we interact with checkboxes and
    radio buttons using the `click()` method.


