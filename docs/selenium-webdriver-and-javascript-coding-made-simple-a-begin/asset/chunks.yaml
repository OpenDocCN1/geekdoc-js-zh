    # Chapter 6: JavaScript Objects


    In Chapter 5, we explored JavaScript arrays, which allowed us to store and manipulate
    collections of elements. Now, let''s dive into JavaScript objects, another fundamental
    concept in the language. Objects enable us to represent complex data structures
    and organize related data into key-value pairs.


    ### 6.1 Introduction to Objects


    In JavaScript, an object is a composite data type that allows us to store and
    manipulate data in a structured way. Objects are collections of properties, where
    each property consists of a key and a value. The key serves as the identifier
    for accessing the corresponding value. Objects are often used to represent real-world
    entities, such as a person, a car, or a book.


    ### 6.2 Creating Objects


    There are multiple ways to create objects in JavaScript. One common approach is
    using object literals, where we define the properties and their values within
    curly braces `{}`. Here''s an example:


    ```javascript

    var person = {

    name: "John Doe",

    age: 30,

    profession: "Web Developer"

    };

    ```


    In this example, we create an object called `person` with three properties: `name`,
    `age`, and `profession`. The property names are specified as keys, followed by
    a colon `:`, and their corresponding values.


    Another way to create objects is by using the `new` keyword and the `Object()`
    constructor. Here''s an example:


    ```javascript

    var car = new Object();

    car.make = "Toyota";

    car.model = "Camry";

    car.year = 2022;

    ```


    In this example, we create an object called `car` using the `Object()` constructor
    and assign properties to it using dot notation.


    ### 6.3 Accessing Object Properties


    We can access the properties of an object using dot notation or bracket notation.
    Dot notation involves using the object name followed by a dot `.` and the property
    name. Here''s an example:


    ```javascript

    console.log(person.name);      // Output: "John Doe"

    console.log(car.make);          // Output: "Toyota"

    ```


    In this example, we access the `name` property of the `person` object and the
    `make` property of the `car` object using dot notation.


    Bracket notation involves using square brackets `[]` and specifying the property
    name as a string. Here''s an example:


    ```javascript

    console.log(person[''age'']);    // Output: 30

    console.log(car[''year'']);      // Output: 2022

    ```


    In this example, we access the `age` property of the `person` object and the `year`
    property of the `car` object using bracket notation.


    ### 6.4 Modifying Object Properties


    Objects in JavaScript are mutable, meaning we can modify their properties after
    they are created. We can reassign the value of a property using either dot notation
    or bracket notation. Here''s an example:


    ```javascript

    person.age = 35;

    car[''year''] = 2023;

    ```


    In this example, we modify the `age` property of the `person` object and the `year`
    property of the `car` object.


    ### 6.5 Adding and Removing Object Properties


    We can add new properties to an object by simply assigning a value to a previously
    non-existent property. Similarly, we can remove properties using the `delete`
    keyword. Here''s an example:


    ```javascript

    person.gender = "Male";

    delete car.model;

    ```


    In this example, we add the `gender` property to the `person` object and remove
    the `model` property from the `car` object.


    ### 6.6 Object Methods


    In addition to properties, objects in JavaScript can also contain methods. Methods
    are functions that are associated with an object and can be invoked using dot
    notation.


    Methods in JavaScript are functions that are associated with objects and can perform
    actions or calculations using the object''s properties. Let''s look at an example:


    ```javascript

    var calculator = {

    add: function (a, b) {

    return a + b;

    },

    subtract: function (a, b) {

    return a - b;

    }

    };

    console.log(calculator.add(5, 3));      // Output: 8

    console.log(calculator.subtract(10, 4)); // Output: 6

    ```


    In this example, we create an object called `calculator` with two methods: `add`
    and `subtract`. These methods can be invoked using dot notation, followed by parentheses
    `()`, passing the required arguments.


    ### 6.7 Object Iteration


    We can iterate over the properties of an object using various techniques. One
    common approach is using a `for...in` loop, which allows us to iterate over the
    enumerable properties of an object. Here''s an example:


    ```javascript

    for (var key in person) {

    console.log(key + ": " + person[key]);

    }

