    In this example, we have annotated the test methods with groups (`login` and `registration`).
    You can then execute specific groups of tests using the TestNG XML suite or command-line
    parameters.


    ### 7.4.2 TestNG Parameters


    TestNG allows you to pass parameters to test methods using the `@Parameters` annotation.
    This feature is useful when you want to run the same test method with different
