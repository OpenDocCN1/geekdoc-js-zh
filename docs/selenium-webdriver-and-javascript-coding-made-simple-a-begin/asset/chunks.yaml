    # # Chapter 10: Handling Browser Cookies and Pop-ups


    In Chapter 9, we learned about Cross-Browser Testing with Selenium WebDriver,
    ensuring web applications'' compatibility across different browsers. In this chapter,
    we will focus on two important aspects of web application testing: handling browser
    cookies and pop-ups. Managing cookies is essential for maintaining user sessions
    and personalization, while handling pop-ups allows us to interact with various
    website elements and handle unexpected alerts.


    ## 10.1 Understanding Browser Cookies


    Cookies are small pieces of data stored on the client-side by the web browser.
    They are commonly used for session management, user authentication, and remembering
    user preferences on websites. When a user visits a website, the server sends cookies
    to the browser, which stores them locally. In subsequent requests to the same
    website, the browser sends back these cookies, allowing the server to identify
    the user and maintain their session.


    ### 10.1.1 Retrieving Cookies with Selenium WebDriver


    In Selenium WebDriver, we can handle cookies to manage user sessions during test
    execution. To retrieve cookies from the current browser session, Selenium provides
    the `getCookies()` method. This method returns a set of `Cookie` objects, representing
    each cookie set by the website.


    Example:


    ```java


    import org.openqa.selenium.Cookie;


    import org.openqa.selenium.WebDriver;


    import org.openqa.selenium.chrome.ChromeDriver;


    public class CookieHandlingExample {


    public static void main(String[] args) {


    // Set the path to ChromeDriver executable


    System.setProperty("webdriver.chrome.driver", "path/to/chromedriver");


    // Create ChromeDriver instance


    WebDriver driver = new ChromeDriver();


    // Navigate to the website


    driver.get("https://www.example.com");


    // Get all cookies


    Set<Cookie> cookies = driver.manage().getCookies();


    // Print each cookie''s name and value


    for (Cookie cookie : cookies) {


    System.out.println("Cookie Name: " + cookie.getName());


    System.out.println("Cookie Value: " + cookie.getValue());


    }


    // Close the browser


    driver.quit();


    }


    }


    ```


    In this example, we use `getCookies()` to retrieve all cookies set by the website
    and print their names and values.


    ### 10.1.2 Adding Cookies with Selenium WebDriver


    We can also add custom cookies to the browser session using the `addCookie()`
    method.


    Example:


    ```java


    import org.openqa.selenium.Cookie;


    import org.openqa.selenium.WebDriver;


    import org.openqa.selenium.chrome.ChromeDriver;


    public class CookieHandlingExample {


    public static void main(String[] args) {


    // Set the path to ChromeDriver executable


    System.setProperty("webdriver.chrome.driver", "path/to/chromedriver");


    // Create ChromeDriver instance


    WebDriver driver = new ChromeDriver();


    // Navigate to the website


    driver.get("https://www.example.com");


    // Create a new cookie


    Cookie customCookie = new Cookie("username", "john_doe");


    // Add the cookie to the browser session


    driver.manage().addCookie(customCookie);


    // Close the browser


    driver.quit();


    }


    }


    ```


    In this example, we create a custom cookie with the name "username" and value
    "john_doe" and add it to the browser session using `addCookie()`.


    ### 10.1.3 Deleting Cookies with Selenium WebDriver


    To delete cookies from the browser session, we can use the `deleteCookie()` or
    `deleteAllCookies()` methods.


    Example:


    ```java


    import org.openqa.selenium.WebDriver;


    import org.openqa.selenium.chrome.ChromeDriver;


    public class CookieHandlingExample {


    public static void main(String[] args) {


    // Set the path to ChromeDriver executable


    System.setProperty("webdriver.chrome.driver", "path/to/chromedriver");


    // Create ChromeDriver instance


    WebDriver driver = new ChromeDriver();


    // Navigate to the website


    driver.get("https://www.example.com");


    // Delete a specific cookie by name


    driver.manage().deleteCookieNamed("username");


    // Delete all cookies from the browser session


    driver.manage().deleteAllCookies();


    // Close the browser


    driver.quit();


    }


    }


    ```


    In this example, we delete a specific cookie with the name "username" using `deleteCookieNamed()`.
    We can also use `deleteAllCookies()` to remove all cookies from the browser session.


    ## 10.2 Handling Browser Pop-ups


    Browser pop-ups, also known as alerts or dialogs, are commonly used to display
    important messages or gather user input. Selenium WebDriver allows us to interact
    with these pop-ups during test execution.


    ### 10.2.1 Handling Alert Pop-ups with Selenium WebDriver


    Alert pop-ups are used to display messages and prompt the user for a response.
    We can handle alert pop-ups using the `Alert` interface provided by Selenium WebDriver.


    Example:


    ```java


    import org.openqa.selenium.Alert;


    import org.openqa.selenium.WebDriver;


    import org.openqa.selenium.chrome.ChromeDriver;


    public class AlertHandlingExample {


    public static void main(String[] args) {


    // Set the path to ChromeDriver executable


    System.setProperty("webdriver.chrome.driver", "path/to/chromedriver");


    // Create ChromeDriver instance


    WebDriver driver = new ChromeDriver();


    // Navigate to the website


    driver.get("https://www.example.com");


    // Click a button that triggers an alert pop-up


    driver.findElement(By.id("alertButton")).click();


    // Switch to the alert pop-up


    Alert alert = driver.switchTo().alert();


    // Get the text of the alert message


    String alertMessage = alert.getText();


    System.out.println("Alert Message: " + alertMessage);


    // Accept the alert (click OK button)


    alert.accept();


    // Close the browser


    driver.quit();


    }


    }


