    desired radio button.


    ## 3.4 Dropdowns


    Dropdowns, also known as select elements, allow users to choose an option from
    a list. Handling dropdowns in Selenium WebDriver involves using the `Select` class
    from the `webdriver.support.ui` module to interact with the dropdown options.


    Example:


    Suppose we have a dropdown for selecting a country:


    ```html

    <select id="country-dropdown">

    <option value="USA">United States</option>

    <option value="UK">United Kingdom</option>

    <option value="Canada">Canada</option>

    </select>

    ```


    To automate selecting "United States" from the dropdown, we can use the following
    Selenium WebDriver code:


    ```python

    from selenium.webdriver.support.ui import Select

    # Locate the dropdown by its ID

    country_dropdown = driver.find_element_by_id("country-dropdown")

    # Create a Select object to interact with the dropdown

    select = Select(country_dropdown)

    # Select "United States" by visible text

    select.select_by_visible_text("United States")

    ```


    You can also select an option by value or index using `select_by_value()` or `select_by_index()`.


