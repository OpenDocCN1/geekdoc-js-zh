  raw: 'Actually learning Java is fairly simple, because there are just 50 different
    keywords within the language. However, there is an library that contain thousands
    of different classes. In addition to this, there is a far greater number of methods
    for use in programs. The contents of a library is what gives Java a range of different
    functions. Without a library, Java would not be able to have its functionality,
    so it is as integral to Java as the language itself. The library of classes is
    known as the Java API. You are not limited to just one library either. There are
    many options, and they have a range of purposes. Suppose that wanted to create
    a certain genre of game, for example. You could probably find a special library
    that was created to make that task easier. In this way, you can basically acquire
    a customized environment to work in, so you don’t have to build everything from
    the ground, up.


    Before you start to panic, understand that there is no need to learn the Java
    API entirely. Programmers typically only learn smaller parts of it in entirety.
    If someone needs to use some classes that they are not comfortable with, it is
    easy to look up  more details about them.


    ## Object Orientation


    Inherently, Java is an object-oriented language. Programs made using it will be
    comprised of objects. These are elements of programs that are representative of
    abstract concepts, or real objects.


    Here are the two fundamental characteristics of an object:


    ● An object has its own behavior. This means that it is capable of carrying out
    specific tasks, which are known as methods. For example, if an object is representing
    a vehicle within an application, its methods might include include starting, driving,
    stopping, and crashing. Sometimes a method just allows the user access to the
    data of the object, such as its title.


    ● They also have their own state, which is basically data. For example, if an
    object is representing a book, it might have data about the author, title, and
    publisher of that book.


    ## Classes


    A class is related closely to objects, since they are the coding that is written
    to make an object. Classes describe the methods and data that define the behavior
    and state of an object. When a program is run, the objects are created through
    the use of a class.


    Imagine that you were making an application for dealing with a payroll. The employees
    of the business would need to be represented by objects. In order to make these
    objects, you would need to create a class for defining the method and data for
    making every employee an object. You might choose to title this class “Employees”.
    While the name of your class isn’t going to show up to users who run the payroll
    application, it will be very helpful for you in the coding process.


    # Getting Started


    There are several different ways to get what you need to start programming with
    Java. You are going to need these three basic things:


    ● The Java API


    ● A Java Compiler


    ● A virtual machine for Java


    You can simply download them from the [Oracle](http://www.oracle.com/)[’](http://www.oracle.com/)[s
    website](http://www.oracle.com/), the company that acquired Sun Microsystems.
    They have two different downloads for you two choose from:


    ● The software development kit (SDK). This contains the three tools that you need.
    You can use this to program Java applications. Make sure to get the version that
    is compatible with your computer and operating system.


    ● The Java runtime environment (JRE). This only contains a virtual machine, and
    an application programming language. However, for the purposes of learning Java,
    this will not be enough. The JRE is only good for running Java applications, but
    does not include an actual compiler.


    Alternatively, you can choose to get with as part of a commercial package. There
    are many to choose from, including Borland JBuilder and Visual J++. For now, while
    you are getting started with Java, it is recommended that you just get the Java
    runtime environment from Oracle.


    Even if you do decide to use third-party Java development tools, you should use
    Oracle’s Java runtime environment as well. This is great way to make sure that
    your programs are as compatible as possible


    ## Using a Dedicated IDE


    These allow you to create code, but they offer many great features that make working
    with Java easy, although they can work with other programming languages. If you
    would like to, you can simply use a text editor. However, a dedicated IDE will
    make the job of learning much easier, so that’s what this book will use for learning
    purposes.


    ## Netbeans


    There are many of these to choose from. Some will cost you money to buy, but there
    are also some great free choices. For the purposes of this book, you should download
    [NetBeans IDE](http://www.netbeans.com), which is an open-source, free piece of
    software. Make sure that you download a version of Netbeans that is compatible
    with your operating system. Complete the installation process, and then you will
    be ready to get started with your very first piece of Java coding.


    For the instructions contained in this book, you will need to download and install
    the NetBeans IDE.


    Later, once you are more comfortable with programming in Java, you might want
    to find something else to use, but that is really a personal choice.


    ## Using a Text Editor


    Computer programs are created using code, and that is made up of text, in its
    raw form. It stands to reason that to write and edit pieces of code (which is
    text), you will need a text editor. You are probably familiar with word processors,
    which can also create text. However, those are great for making formatted text,
    including letters, reports, books, etc. You will need to work with plain, unformatted
    text, so something like Word will not be acceptable. 


    There are a lot of text editors for writing your code, including one that you
    have probably used already, called Notepad, which comes with Windows. These are
    small and often free, although there are some commercial text editors that cost
    money to buy.


    While you can use a very basic text editor like Notepad, it will be much easier
    to use something with more features. A text editor that is made specifically for
    coding will be most useful for programming. Here are some good features to look
    for in a text editor:


    ● Highlighting of syntax in you code.


    ● Shortcuts to making running and compiling your programs easier.


    ● Helpful completion of codes.


    ● Previews of your programs.


    ● Many other useful functions to make your work easier.


    While it is considered a little more “old school” these days, many programmers
    still use a simple text editor. It allows them to work with a range of different
    programming languages, without swapping the software that they are using. As mentioned
    above, however, you should use the Netbeans IDE while starting out.


    # Learning the Lingo (Acronyms)


    Before you can start to understand the Java programming language, you should get
    familiar with the following acronyms. You will come across them while learning
    about Java, so it helps to get an overview right away. Don’t worry about trying
    to memorize them all just yet, as it take some time. Yes, some of these terms
    are somewhat general for computers, but they are important for a programmer to
    learn. That is why they are good to become familiar with as you start to learn
    Java.


    ## CPU - Central Processing Unit


    You probably already know this one. It is the “brains” of a computer system. It
    contains the arithmetic logic unit, the control unit, and the temporary storage,
    known as the RAM (Random Access Memory).


    ## CRT - Cathode Ray Tube


    This is the part of a monitor that uses  an electron beam to excite phosphor dots.
    CRT will often be used to refer to a computer monitor (screen).


    ## ALU - Arithmetic Logic Unit


    This is the part of the CPU that processes mathematical equations.


    ## LAN - Local Area Network'
