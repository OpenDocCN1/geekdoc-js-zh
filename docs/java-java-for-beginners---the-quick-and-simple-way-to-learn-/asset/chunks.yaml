- fmt: "\nThis is actually a series of connected computers, that can share their storage\
    \ space and installed programs. This is unlike the Internet, because it is local.\
    \ LANs are often set up within business buildings, schools, and even in people’s\
    \ homes.\n\n## IDE - Integrated Development Environment\nThis is an environment\
    \ for creating and compiling all necessary coding components, from a single program.\n\
    \n## DOS - Disk Operating System\nThis was the first computer operating system\
    \ that was used by a wide amount of people. It was created by Microsoft, for IBM.\
    \ It manages any type of data on a computer, by dealing with storage devices.\
    \ The “disk” part of the name comes from the fact that many storage devices contain\
    \ spinning disks.\n\n## OOP - Object Oriented Programming\nThis is a popular feature\
    \ of Java. It involves using reusable, small parts in order to create a larger\
    \ piece of software.\n\n## ROM - Read Only Memory\nThis is memory on a system\
    \ that is “hardwired”, so that it can’t be altered. It contains information that\
    \ allows the system to work, even without an operating system installed.\n\n##\
    \ RAM - Random Access Memory\nUnlike normal memory, which can be used for storage,\
    \ RAM is temporary. You can think of it as a computer’s short-term memory, used\
    \ for performing tasks. This is lost after the computer shuts down.\n\n# Basics\
    \ of Programming Languages\nNow that you are a bit more comfortable with the core\
    \ elements of Java, take a look at programming language basics.\n\n## Variables\n\
    You already know that the state of any object is stored in a field. You with find\
    \ that both variables and fields are used in Java. However, they can both appear\
    \ to be the same, for people who are new to programming. It is important to accept\
    \ that they are different, and that you should treat them as such.\n\nVariables\
    \ are an essential part of any programming language, and Java is no different.\
    \ A variable is basically a storage location, a symbolic name that is associated\
    \ with that location, and then a specific amount of information (called a value).\
    \ That is a fairly technical way to think of variables, but it helps to look at\
    \ the proper terms from the beginning.\n\nHere is an easier way to think of variables:\
    \ they are a way for storing information, so it can be used later. To access that\
    \ information, a specific name is used. As an example, imagine that a website\
    \ asks for your name. A text box would appear, requesting that you enter your\
    \ name. That box would be representing variable. The person who owns the website\
    \ might have named that box `username`, and that would be the symbolic name. As\
    \ for the name that you entered, that would be a value. Wherever this information\
    \ is stored, would be the storage location.\n\n## Variable Types\nNow that you\
    \ know what a variable is, you can learn about the different types. Simply knowing\
    \ that something is a variable is not enough for Java. It also needs to know what\
    \ kind of information you want to store with your variables.\n\nHere are some\
    \ important types of variables:\n\n- Integer. This is just a number that does\
    \ not contain any decimal places. For example, `5`, `10`, `50`, and even `-5`,\
    \ `-10`, etc. If you were to try to use an integer to store any numbers that did\
    \ have decimals, it would result in an error with your application. So, integers\
    \ are variables that can only store whole numbers.\n\n- String. This is used for\
    \ data that contains a string of characters. Java will just store this type of\
    \ data as it is entered, without worrying about the meaning, or real-world value.\
    \ For example, if you added the Strings `1` and `5` together, you wouldn’t get\
    \ `6`. You would end up with `15`, because Java will simply string the two variables\
    \ together.\n\nThis book will not go too deeply into types of variables. For now,\
    \ it is more important that you understand what a variable is used for, and that\
    \ there are different types available.\n\n## Control Structures\nA control structure\
    \ is any chunk of code that looks at variables, analyzes them, and then chooses\
    \ what to do, based on the elements of the variables.\n\nA simpler explanation\
    \ is that a computer looks at each line of an applications code, when it is run.\
    \ It begins from the top, and goes down to the bottom, generally moving from the\
    \ left to the right. This is done in the same way that someone would read a book,\
    \ and it is called code flow.\n\nWhile the computer is moving through the code,\
    \ it might come to certain areas where it needs to make a choice. Applications\
    \ don’t usually just run in a linear way, like a book would. They often jump around\
    \ as different things happen, like objects interacting together. The computer\
    \ cannot actually make these choices by itself, so it needs a strict set of rules\
    \ to tell it what to do. These decisions are called control structure.\n\nWithin\
    \ that control structure, the computer will make certain decisions based on the\
    \ state of your variables. You have looked at states earlier in this book. So,\
    \ now you can see how objects can affect the way that the computer reacts while\
    \ running different codes. If you were running a car racing game, and the state\
    \ of your car object indicated that it had crashed into a wall, the computer would\
    \ cause your car to crash. It does get much more complex than this, but it’s a\
    \ good example for now.\n\n## Syntax\nThis word has already been used in this\
    \ book, but you have likely already heard it before. It has its own definition\
    \ in regards to languages that people speak and write. However, it is a little\
    \ different for programming. A programming language’s syntax is basically the\
    \ rules that define how different symbols work, and what they do when used together\
    \ in certain ways.\n\nJava uses symbols like brackets, curly brackets, variables,\
    \ and different things. You can think of syntax kind of like the grammar rules\
    \ that a programming language follows. You need to use certain symbols, in certain\
    \ ways, and then position things properly. If you fail to use proper syntax, Java\
    \ will not be able to understand what you are trying to do.\n\nUsing correct syntax\
    \ is something that you should learn early on. Always make sure that you enter\
    \ coding correctly, and check that your syntax is right.\n\n## Data Structures\n\
    In the world of computer programming, data structures are a way to organize and\
    \ store data within a computer. It is done in a way that allows a computer to\
    \ use efficiently. It is possible to simply store data in a big bunch, and it\
    \ would be possible for a computer to use it. However, if it is not done efficiently,\
    \ you will probably end up with a very unstable application.\n\nA big part of\
    \ computer programming is trying to create code that is efficient, so that it\
    \ works well. Doing this can also make the code easier for people to upgrade and\
    \ maintain. In turn, it can be easier to keep improving an application, creating\
    \ additional features, or fixing problems.\n\n## Arithmetic Operators\nJava has\
    \ five basic arithmetic operators. These are:\n\n- Addition +\n- Subtraction -\n\
    - Division /\n- Multiplication *\n- Modulo %\n\nYou will probably recognize these\
    \ from your days of math classes in school. To get an idea of what you can use\
    \ them for in Java, take a look at these examples, which use operators named `op1`\
    \ and `op2`:\n\n| Use | If true, will return |\n| :--- | :--- |\n| `op1 + op2`\
    \ | `op1` plus `op2` |\n| `op1 - op2` | `op1` minus `op2` |\n| `op1 / op2` | `op1`\
    \ divided by `op2` |\n| `op1 * op2` | `op1` times `op2` |\n| `op1 % op2` | divides\
    \ `op1` by `op2` to find the remainder |\n\n# Your First Application: Hello World\n\
    ```java\npublic class HelloWorld {\n    public static void main(String[] args)\
    \ {\n        System.out.println(\"Hello,!\");\n    }\n}\n```\n"
