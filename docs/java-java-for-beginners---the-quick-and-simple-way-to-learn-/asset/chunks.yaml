    Now that you know what a variable is, you can learn about the different types.
    Simply knowing that something is a variable is not enough for Java. It also needs
    to know what kind of information you want to store with your variables.


    Here are some important types of variables:


    ● Integer. This is just a number that does not contain any decimal places. For
    example, 5, 10, 50, and even -5, -10, etc. If you were to try to use an integer
    to store any numbers that did have decimals, it would result in an error with
    your application. So, integers are variables that can only store whole numbers.


    ● String. This is used for data that contains a string of characters. Java will
    just store this type of data as it is entered, without worrying about the meaning,
    or real-world value. For example, if you added the Strings 1 and 5 together, you
    wouldn’t get 6\. You would end up with 15, because Java will simply string the
    two variables together.


    This book will not go too deeply into types of variables. For now, it is more
    important that you understand what a variable is used for, and that there are
    different types available.


    ## Control Structures


    A control structure is any chunk of code that looks at variables, analyzes them,
    and then chooses what to do, based on the elements of the variables.


    A simpler explanation is that a computer looks at each line of an applications
    code, when it is run. It begins from the top, and goes down to the bottom, generally
    moving from the left to the right. This is done in the same way that someone would
    read a book, and it is called code flow.


    While the computer is moving through the code, it might come to certain areas
    where it needs to make a choice. Applications don’t usually just run in a linear
    way, like a book would. They often jump around as different things happen, like
    objects interacting together. The computer cannot actually make these choices
    by itself, so it needs a strict set of rules to tell it what to do. These decisions
    are called control structure.


    Within that control structure, the computer will make certain decisions based
    on the state of your variables. You have looked at states earlier in this book.
    So, now you can see how objects can affect the way that the computer reacts while
    running different codes. If you were running a car racing game, and the state
    of your car object indicated that it had crashed into a wall, the computer would
    cause your car to crash. It does get much more complex than this, but it’s a good
    example for now.


    ## Syntax


    This word has already been used in this book, but you have likely already heard
    it before. It has its own definition in regards to languages that people speak
    and write. However, it is a little different for programming. A programming language’s
    syntax is basically the rules that define how different symbols work, and what
    they do when used together in certain ways.


    Java uses symbols like brackets, curly brackets, variables, and different things.
    You can think of syntax kind of like the grammar rules that a programming language
    follows. You need to use certain symbols, in certain ways, and then position things
    properly. If you fail to use proper syntax, Java will not be able to understand
    what you are trying to do. This will lead to errors when you run your applications.


    Using correct syntax is something that you should learn early on. Always make
    sure that you enter coding correctly, and check that your syntax is right.


    ## Data Structures


    In the world of computer programming, data structures are a way to organize and
    store data within a computer. It is done in a way that allows a computer to use
    it efficiently. It is possible to simply store data in a big bunch, and it would
    be possible for a computer to use it. There are many different ways to code things,
    and to store data. However, if it is not done efficiently, you will probably end
    up with a very unstable application. It might be extremely slow, or it might not
    work properly all of the time.


    A big part of computer programming is trying to create code that is efficient,
    so that it works well. Doing this can also make the code easier for people to
    upgrade and maintain. In turn, it can be easier to keep improving an application,
    creating additional features, or fixing problems.


    ## Arithmetic Operators


    Java has five basic arithmetic operators. These are:


    ● Addition +


    ● Subtraction -


    ● Division /


    ● Multiplication *


    ● Modulo %


    You will probably recognize these from your days of of math classes in school.
    To get an idea of what you can use them for in Java, take a look at these examples,
    which use operators named op1 and op2:


    | Use | If true, will return |


    | op1 + op2 | op1 plus op2 |


    | op1 - op2 | op1 minus op2 |


    | op1 / op2 | op1 divided by op2 |


    | op1 * op2 | op1 times op2 |


    | op1 % op2 | divides op1 by op2 to find the remainder |


