    ## 引言


    如果你对编程有一点兴趣，你可能听说过 Java。


    ## 这本书将将教你什么？


    如果你对编程感兴趣，你可能听说过 Java。事实上，它是为了各种目的而设计的语言。在开始之前，你可能需要了解一些基础。


    ## Java 简史


    Java 最初创建于 1991 年。在 Sun Microsystems 工作时 James Gosling 和他的团队创建了 Java。它最初是为各种家用电器设计的。在
    1995 年，Netscape 发布了其版本的浏览器，该浏览器能够运行 Java。


    在花了一些时间思考一个合适的名称来取代 `Oak` 后，他们发现已经有语言叫这个名字。由于 `java` 是流行饮料的另一种说法，这给了他们一个新名字的想法。2010
    年，Sun Microsystems 被一家名为 Oracle 的软件公司收购。从那时，他们继续开发 Java 及相关产品。


    ## Java 的流行程度


    Java 如此流行的原因之一是它非常流行。基本上，它是世界上最常用的编程语言之一。许多程序员在职业生涯的某个阶段都有过 Java 的经验。如果你正在考虑学习编程，但不知道先学哪种语言，Java
    是一个推荐的选择。


    由于 Java 目前非常流行，对于那些依赖自由职业程序员和顾问的人来说，它是一个很棒的选择。未来寻找可以帮助维护代码的人将非常容易。这消除了对创建未来可访问代码的担忧。这种普及性对许多人都有吸引力，特别是对于那些外包编程业务的人。


    除了流行之外，Java 也很棒，因为它易于使用。这意味着它可以为各种不同的操作系统和平台创建程序。Java 在系统的服务器端占据主导地位。


    看看 Java 可以做的某些事情，以及为什么它是一个很棒的编程语言：


    ## 平台无关性


    这是 Java 如此流行的关键原因。平台无关性是指它在不同计算机上运行的能力。如果你有一个可以运行适当 `JRE`（Java 运行环境）的系统，它就能运行
    Java 应用程序。这包括 Windows、Mac、Linux、Unix、大型主机，甚至是许多移动设备。


    ## Java API


