  trans: "\n这实际上是一系列连接的计算机，它们可以共享存储空间和安装的程序。这与互联网不同，因为它是本地的。局域网（LAN）通常建立在办公大楼、学校，甚至人们的家中。\n\
    \n## IDE - 集成开发环境\n这是一个用于从单个程序创建并编译所有必要代码组件的环境。\n\n## DOS - 磁盘操作系统\n这是首个被大量用户使用的计算机操作系统。它由微软公司为\
    \ IBM 开发。它通过处理存储设备来管理计算机上的任何类型数据。名称中的“磁盘”部分是因为许多存储设备包含旋转磁盘。\n\n## OOP - 面向对象程序编程\n\
    这是 Java 的一个流行特性。它涉及使用可重用的小部分来创建一个更大的软件整体。\n\n## ROM - 只读存储器\n这是系统上是“硬连线”的内存，因此无法被更改。它包含了允许系统在没有安装操作系统的情况下也能运行的信息。\n\
    \n## RAM - 随机访问存储器\n与用于存储的普通内存不同，RAM 是暂性的。你可以将其想象成计算机的内存，用于执行任务。在计算机关闭后，这些将会丢失。\n\
    \n# 编程语言基础\n现在你已经对 Java 的核心元素稍微熟悉了一些，请看一眼编程语言基础。\n\n## 变量\n你已经知道任何对象的状态都存储在字段（field）中。你会发现\
    \ Java 中既使用变量也使用字段。然而，对于编程初学者来说，它们看起来可能是一样的的。重要的是要接受它们是不同的，并且你应该像那样对待它们。\n\n变量是任何编程语言中必不可少的一部分，Java\
    \ 也不例外。变量基本上是一个存储位置，一个与该位置关联的符号名称，以及特定数量的信息（称为值）。这是一种对变量的相当有技术性的思考方式，但从一开始就观察正确的术语是有帮助的。\n\
    \n这里有一种更容易理解变量的方法：它们是存储信息的一种方式，以便以后使用。为了访问这些信息，会使用特定的名称。例如，想象一个网站要求你输入姓名。会出现一个文本框，要求你输入名字。那个框就代表变量。拥有该网站的人可能将那个框命名为\
    \ `username`，这就是符号名称。至于你输入的那个名称，它就是一个值。无论这些信息存储在何处，那里就是存储位置。\n\n## 变量类型\n现在你知道什么是变量了，你可以学习不同的类型。对于\
    \ Java 来说，仅仅知道某物是一个变量是不够的。它还需要知道你想用你的变量存储什么类型的信息。\n\n这里是一些重要的变量类型：\n\n- 整数（Integer）。这只是一个不包含任何小数的数字。例如，`5`、`10`、`50`\
    \ 甚至 `-5`、`-10` 等。如果你尝试使用整数来存储任何带有小数的数字，会导致你的应用程序报错。因此，整数是只能存储整数的变量。\n\n- 字符串（String）。这用于包含字符字符串的数据。Java\
    \ 将直接按照输入的方式存储这种类型的数据，而无需担心其含义或现实世界的价值。例如，如果你将字符串 `1` 和 `5` 相加，你不会得到 `6`。你会得到\
    \ `15`，因为 Java 将简单地将两个变量拼接在一起。\n\n这本书将不会深入探讨变量类型。现在，更重要的是理解变量是用来做什么的，以及有不同的类型可供。\n\
    \n## 控制结构\n控制结构是任何查看变量、分析它们，然后根据变量的元素选择执行操作的代码块。\n\n更简单的解释是，计算机在运行时会查看应用程序代码的每一行。它从顶部开始，向下移动，通常从左向右移动。这与人阅读书的方式相同，被称为代码流。\n\
    \n当计算机在代码中移动时，它可能会遇到某些需要做出的区域。应用程序通常不像书籍那样线性运行。它们经常随着不同事件的发生而跳跃，例如对象之间的相互作用。计算机实际上无法自己做出这些选择，因此它需要一套严格的规则来告诉它做什么。这些决策被称为控制结构。\n\
    \n在控制结构内部，计算机将根据你变量的状态做出某些决定。你之前在书中已经看过了状态。所以，现在你可以看到对象如何影响计算机在运行不同代码时的反应方式。如果你正在运行一个赛车游戏，而你的汽车对象的状态显示它已经撞上了墙，计算机就会导致你的汽车撞毁。情况比这要复杂得多，但目前这是一个很好的例子。\n\
    \n## 语法（Syntax）\n这个词在书中已经出现过，但你可能已经听过它了。在人们说话和书写的语言方面，它有自己的定义。然而，对于编程来说，它有一点不同。编程语言的语法基本上是定义不同符号如何工作的规则，以及它们在以特定方式一起使用时会做什么。\n\
    \nJava 使用括号、大括号、变量和不同的符号。你可以将语法想象成编程语言遵循的语法规则。你需要使用某些符号，以特定的方式，并妥善地放置内容。如果你没有使用正确的语法，Java\
    \ 将无法理解你想做什么。\n\n使用正确的语法是你应该尽早学习的。始终确保你的语法是正确的。\n\n## 数据结构\n在编程世界中，数据结构是在计算机内部组织和存储数据的方式。它是以允许计算机高效使用的方式进行的。可以将数据简单存储在一个堆中，这样计算机就可以使用。然而，如果做得不高效，你可能会得到一个非常不稳定的应用程序。\n\
    \n编程的很大一部分是尝试创建高效的代码，以便其运行良好。这还可以让代码更容易升级和维护。反过来也可以更容易改进应用程序、创建新功能或修复问题。\n\n##\
    \ 算术运算符\nJava 有五个基本的算术运算符。这些是：\n\n- 加 +\n- 减 -\n- 除 /\n- 乘 *\n- 取模 %\n\n你可能在过去在学校的数学课上就认识这些了。为了了解\
    \ Java 中可以用它们做什么，请看这些示例，它们使用了名为 `op1` 和 `op2` 的运算符：\n\n| 使用 | 如果为真，将返回 |\n| :---\
    \ | :--- |\n| `op1 + op2` | `op1` 加上 `op2` |\n| `op1 - op2` | `op1` 减去 `op2` |\n\
    | `op1 / op2` | `op1` 除以 `op2` |\n| `op1 * op2` | `op1` 乘以 `op2` |\n| `op1 % op2`\
    \ | `op1` 除以 `op2` 以找到余数 |\n\n# 你的第一个应用程序：Hello World\n```java\npublic class HelloWorld\
    \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Hello,!\");\n    }\n}\n```\n\n"
- fmt: "\nOnce you have installed the software detailed in the previous chapter, it\
    \ is time to start coding a very simple application. Remember that you will need\
    \ the `Netbeans` IDE, which you were instructed to download as well. At first,\
    \ you might not understand everything that you do, but just complete the steps,\
    \ exactly as they are detailed. The understanding will come later, but everyone\
    \ has to start somewhere.\n\nYou will be making a type of application that is\
    \ commonly made by people as they first begin to learn programming. That makes\
    \ it a perfect first piece of code to create. It is called “Hello World”, and\
    \ is extremely simple. This might sound overly basic, but the application simply\
    \ displays “Hello Word!” It certainly is not anything complicated, or even particularly\
    \ useful by itself. However, it is a great way to get a grip on some of the most\
    \ basic parts of coding in Java.\n\n## Making Your IDE Project\n\nBy making an\
    \ IDE project, you are creating the environment in which to build your application.\
    \ One of the benefits of using and IDE like `Netbeans`, is that it avoids issues\
    \ with configuration. If you were to create you code in a text editor, it might\
    \ be easier to run into some problems.\n\nTo create your IDE project, follow these\
    \ steps:\n\n- Start up the `Netbeans` IDE that you downloaded.\n- Click on `File`\
    \ > `New Project`. The `New Project` wizard will open.\n- Click on the `Java`\
    \ category to expand it, and then choose `Java Application` and click `Next`.\n\
    - The `Name` and `Location` section will open:\n    - Enter “Hello World App”\
    \ as the Project Name.\n    - Enter `helloworldapp.HeloWorldApp` in the `Create\
    \ Main Class` area.\n- Click `Finish`.\n\nYou have just created your first project,\
    \ and you will not be able to see several windows, including:\n\n- The `Navigator`\
    \ window, where you will be able to easily navigate around between the parts of\
    \ different classes.\n- The `Source Editor` window, where you will be able to\
    \ see the file of the new project you just made, `HelloWorldApp.java`.\n- The\
    \ `Projects` window, with the hierarchal layout of every component of your project.\
    \ This includes the `libraries` needed for your code, source files, etc.\n\nThere\
    \ is a chance that you will need to add the version of the `JDK` that you have.\
    \ This would be due to having a new version that is not already listed with `Netbeans`,\
    \ but it’s not likely.\n\n- Click on `Tools`.\n- Go to `Java Platform` and select\
    \ it.\n- You will be able to see listings with the number of the `JDK`, and easily\
    \ be able to tell if yours is already listed.\n\nNext you are going to add some\
    \ code to the Generated Source File. As you were creating your project in the\
    \ `New Project` wizard, you left the check box titled `Create Main Class`. This\
    \ lead the IDE to make a skeleton class automatically.\n\nIn the source editor,\
    \ find the following line:\n\n```java\n// TODO code application logic here\n```\n\
    \nYou will need to replace that line with the following one:\n\n```java\nSystem.out.println(\"\
    Hellow World!\"); // Display string.\n```\n\nThe next step will show you how to\
    \ add notes to your codes. When you add notes, they will not be considered part\
    \ of the actual coding. They are for you to read only.\n\nFind the following four\
    \ lines:\n\n```java\n/**\n*\n* @author\n*/\n```\n\nReplace them with the following\
    \ four lines:\n\n```java\n/**\n* This app simply prints “Hello World!”\n*\n*/\n\
    ```\n\nWhen you are writing your code, be very careful to type exactly the right\
    \ things. Be sure that you use the right case as well, because the Java launcher\
    \ and compiler and both case-sensitive.\n\nFor example, when you chose the name\
    \ `HelloWorldApp`, it is different to typing `helloworldapp`.\n\nNext, you will\
    \ save your new app. Click on `File` > `Save`.\n\n## Compile Your Source as a\
    \ .class File\n\nYou will now run your very first application. In `Netbeans` main\
    \ menu, click `Run` > `Build Project (Hello World App)`.\n\nThe output window\
    \ will not show you the built code beneath the source editor. You should be able\
    \ to see “Hello World!” printed. More importantly, however, you should see the\
    \ words “BUILD SUCCESSFUL”. If so, you have just made your first successful application.\n\
    \nWhat if you see the words “BUILD FAILED”? Your code likely has some sort of\
    \ syntax error. Don’t worry, because dealing with such errors is easier to do\
    \ with a dedicated IDE, like `Netbeans`. Errors will be displayed in your Output\
    \ widow, and they will be displayed as hyperlinks. If you want to find out an\
    \ error’s source, double click on its hyperlink. This will make it easy for you\
    \ to change the error. After that, you can run your project again, and see if\
    \ you solved the problem.\n\nIn the navigation window, you click on the `Files`\
    \ tab, then expand `Hello World App` > `build` > `classes` > `helloworldapp`.\
    \ This is the class file that was generated for your project.\n\nOnce you have\
    \ built the project, and seen that there are no issues with it, you can officially\
    \ run it. The the main menu, click `Run` > `Run Main Project`.\n\nThe program\
    \ will print the text “Hello World!” in your Output window, as well as some other\
    \ build script output.\n\nYou just ran your first program. Congratulations!\n\n\
    ## How Hello World! Works\n\nYou should understand what the Hello World! application\
    \ did, but might be eager to find out how it works. Take a look at that code that\
    \ you used again:\n\n```java\nclass HelloWorldApp {\n    System.out.println(\"\
    Hello World!\"); // Display string.\n}\n```\n\nThere are three basic components\
    \ that make up your application, which are:\n\n- Your `HelloWorldAppp` class.\n\
    - Your comments in the source code.\n- Your `main` method.\n\nThese explanations\
    \ will give you a beginning understanding of your code. However, it might take\
    \ some time before you really know what it is about.\n\n### Your HelloWorldApp\
    \ Class\n\nLook at the line that says:\n\n```java\nclass HelloWorld App{\n```\n\
    \nThis creates a class definition, telling the code which class to use for the\
    \ following code. The curly brackets that follow will then surround the code you\
    \ want for that class. This can get quite a lot more complicated, but you only\
    \ need to learn the basics for now.\n\n### Comments in the Source Code\n\nTake\
    \ a look at the text that was written after the `//` in your code. That is a comment,\
    \ which the compiler will have ignored completely. You might feel that you don’t\
    \ need to add comments in your codes, since you already know why you did certain\
    \ things. Keep in mind that many codes become extremely long and complicated.\
    \ It is easy to become lost, or forget why you did certain things, so creating\
    \ comments is always important. They are also helpful when other programmers need\
    \ to work with code that you create, so they can easily find way around, and understand\
    \ everything.\n\nThere are three different types of comments, and they each work\
    \ a little differently:\n\n`/** your documentation */`\n\nThe compiler will ignore\
    \ everything between the `/**` and `*/` but the comment will be considered a “doc\
    \ comment”. This is short for documentation comment. All doc comments can be compiled\
    \ with an automated tool later, making it easy to create a reference document.\n\
    \n`// text`\n\nEverything on the line after the `//` will be ignored by the compiler.\n\
    \n`/* your comment */`\n\nWhen you use this type of comment, everything within\
    \ the `/*` and `*/` will be ignored by your compiler.\n\n### Your Main Method\n\
    \nFinally, take a look at the line that actually tells your application what your\
    \ `HelloWorldApp` class does:\n\n```java\nSystem.out.println(\"Hello World!\"\
    );\n```\n\nThe `System` class comes from Java’s fundamental library. It simply\
    \ tells it to print “Hello World!” as standard output. This is why, when you run\
    \ your application, it prints these words on the screen.\n\n# More Definitions\n\
    \n## Objects\n"
