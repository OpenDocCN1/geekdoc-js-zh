  \n```java\n/**\n* 提供简单列表的类。\n* List 会自动调整大小。用于演示\n* Java 类中各种* 设计和实现细节。\n*\n* @author\
  \ scott\n*/\npublic class GenericList{\n    // 默认大小的类常量\n    private static final\
  \ int DEFAULT_CAP = 10;\n    // 实例变量\n    // iValues 存储列表的元素，\n    // 可能有额外的容量\n\
  \    private Object[] iValues;\n    private int iSize;\n    /**\n    * 默认添加方法。向此列表末尾添加\
  \ x。\n    * 列表的大小增加 1。\n    * @param x 要添加到此列表末尾的值。\n    */\n    public void add(Object\
  \ x){\n        insert(iSize, x);\n    }\n    public Object get(int pos){\n     \
  \   return iValues[pos];\n    }\n    /**\n    * 在位置 pos 插入 obj。\n    * post: get(pos)\
  \ = x, size() = 旧 size() + 1\n    * @param pos 0 <= pos <= size()\n    * @param\
  \ obj 要添加的元素。\n    */\n    public void insert(int pos, Object obj){\n        ensureCapcity();\n\
  \        for(int i = iSize; i > pos; i--){\n            iValues[i] = iValues[i -\
  \ 1];\n        }\n        iValues[pos] = obj;\n        iSize++;\n    }\n    public\
  \ Object remove(int pos){\n        Object removedValue = iValues[pos];\n       \
  \ for(int i = pos; i < iSize - 1; i++)\n            iValues[i] = iValues[i + 1];\n\
  \        iValues[iSize - 1] = null;\n        iSize--;\n        return removedValue;\n\
  \    }\n    private void ensureCapcity(){\n        // 是否有额外的可用容量？\n        // 如果没有，则调整大小\n\
  \        if(iSize == iValues.length)\n            resize();\n    }\n    public int\
  \ size(){\n        return iSize;\n    }\n    // 按因子 2 调整内部容器\n    private void resize()\
  \ {\n        Object[] temp = new Object[iValues.length * 2];\n        System.arraycopy(iValues,\
  \ 0, temp, 0, iValues.length);\n        iValues = temp;\n    }\n    /**\n    * 返回此列表的字符串版本。包含大小和\
  \    * 元素。\n    */\n    public String toString(){\n        // 可以使用 StringBuffer\
