  md: "# Coding Challenges for Section Three\n\nBy now you should be serving more\
    \ style than Paris Fashion Week, so why not have a go at these challenges?\nDon't\
    \ forget, you can visit [cgpbooks.co.uk/biscuit](http://cgpbooks.co.uk/biscuit)\
    \ to download [example code](http://example.com) for each challenge.\n\n# Challenge\
    \ 1 — Example\n\nA [tour guide company](http://tour-guide) wants you to design\
    \ a web page for them. One of the stops on their tour is the [Eiffel Tower](http://eiffel-tower)\
    \ in Paris.\n\n> Don't forget — the example code on these pages doesn't show the\
    \ full standard structure (see p.9).\n\nThe page should have the following features:\n\
    \n+   - A [light grey background](http://light-grey).\n- A [photo](http://photo)\
    \ of the Eiffel Tower in the [centre](http://centre), [200 pixels](http://200px)\
    \ in [height](http://height).\n- The text \"[Eiffel Tower, Paris](http://eiffel-tower-paris)\"\
    \ [underneath](http://underneath) the image, in a [serif font](http://serif-font).\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_29_0.png)\n\n# SOLUTION\n\nPlan: Find\
    \ a photo of the Eiffel Tower and save it in the same folder as the .html file,\
    \ then use CSS to style the background, font and set the positioning.\n\n① Set\
    \ the background-colour property to LightGrey in the <body> tag, so it applies\
    \ to the whole page.\n\n② Set the font-family property to a serif font, and include\
    \ the generic serif family in case a web browser can't use your chosen font.\n\
    \n③ Use the text-align property to position everything in the centre of the page.\n\
    \n```\n<body style=\"background-color: LightGrey;\">\n    <p style=\"font-family:\
    \ 'Times New Roman', serif; text-align: center;\">\n        <img src=\"eiffel-tower.jpg\"\
    \ height=\"200\"\n             alt=\"A photo of the Eiffel Tower, Paris\">\n \
    \       <br> Eiffel Tower, Paris\n    </p>\n</body>\n```\n\n④ Use an <img> tag\
    \ and set the src attribute to the file name of the photo, and the height attribute\
    \ to 200 (pixels).\n\n⑤ Use a line break so the text goes underneath the image.\n\
    \n# Challenge 2\n\nYou have been [urgently hired](http://hired) by a [kickboxing\
    \ club](http://kickboxing) after their last web developer quit without notice.\
    \ They want you to complete an [unfinished web page](http://unfinished).\n\nYou\
    \ should:\n\n+   - Fix it — so the [errors are removed](http://errors).\n- Improve\
    \ it — so it's [more accessible](http://accessible).\n\nThe code below is your\
    \ [starting point](http://starting-point). On the right is a [mock up](http://mock-up)\
    \ of what the page is [supposed to look like](http://supposed-to-look-like).\n\
    \n```\n<body style=\"font: Arial;\n            color: Green;\n            background-color:\
    \ HotPink;\">\n    <p>Kiana's Kickboxing</p>\n    <img src=\"kickboxer\" height=\"\
    20\">\n    <p>Come by for a free drop-in:</p>\n    <p>Tuesday 4pm to 7pm</p>\n\
    </body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_29_1.png)\n\n> You don't\
    \ need to match these colours and fonts exactly."
