  md: "# # Quick Reference Guide\n\n# ## Basic web page structure\n\nTells the browser\
    \ you're using HTML (no closing tag).\n\n```\n<!DOCTYPE html>\n<html>\n  <head>\n\
    \    <title>...</title>\n    <style>\n      body {\n        color: LightBlue;\n\
    \      }\n    </style>\n  </head>\n  <body>\n    <p id=\"message\">....</p>\n\
    \    <script>\n      ...\n    </script>\n  </body>\n</html>\n```\n\n<title> tags\
    \ are used to add the page title, shown in the browser tab.\n\nThe <head> contains\
    \ info about the web page, but no content.\n\nInternal CSS goes between <style>\
    \ tags.\nA CSS property for the body element.\nThe property's value.\n\nThe <body>\
    \ contains the content that can be seen or used on the page.\n\nAn attribute (set\
    \ inside a tag).\nThe attribute's value.\n\nJavaScript code goes between <script>\
    \ tags.\n\n# ## Key HTML tags\n\nThere are lots of tags used to mark up all sorts\
    \ of stuff in HTML — here are the main ones used in this book.\n\n| Tag(s) | Description\
    \ | Example(s) |\n| :--- | :--- | :--- |\n| <h1> to <h6> | Used for headings —\
    \ <h1> is the largest, <h6> is the smallest. | <h1>The biggest heading</h1>\n\
    <h2>Getting smaller...</h2> |\n| <p> | Used to create a new paragraph. | <p>Hello\
    \ there.</p> |\n| <b>, <i> and <u> | Used to format text with bold, italics and\
    \ underline. | <b>Don't forget</b> <i>the</i>\n<u>closing tags.</u> |\n| <ul>\
    \ | Creates an unordered list (bullet points). | <ul>\n  <li>1st prize.</li>\n\
    \  <li>2nd prize.</li>\n  <li>3rd prize.</li>\n</ul> |\n| <ol> | Creates an ordered\
    \ list (a sequence, e.g. 1, 2, 3). | <ol>\n  <li>1st prize.</li>\n  <li>2nd prize.</li>\n\
    \  <li>3rd prize.</li>\n</ol> |\n| <li> | Adds items in an ordered or unordered\
    \ list. | <li>1st prize.</li> |\n| <img> | Adds an image — its src attribute tells\
    \ the browser where the file for the image is located. More attributes: alt, width\
    \ and height. | <img src=\"images/Biscuit.jpg\"\nalt=\"honey badger\" height=\"\
    200\"> |\n| <a> | Adds a hyperlink using the href attribute. | <a href=\"index.html\"\
    >Home</a> |\n| <link> | Used in the <head> to connect an external style sheet\
    \ or add an icon (favicon). | <link rel=\"stylesheet\"\nhref=\"styles.css\"> |\n\
    | <div> | Used to group blocks of related content together for organisation and\
    \ styling. | <div id=\"main-content\">...</div> |\n| <button> | Adds a clickable\
    \ button to the page — often used to call a JavaScript function. | <button type=\"\
    button\">What do?\n</button> |\n| <input> | Creates an input field. Often used\
    \ inside a <form> and paired with a <label> tag. | <label for=\"name\">Name:</label>\n\
    <input type=\"text\" id=\"name\"> |"
