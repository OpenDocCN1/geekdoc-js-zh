  - "[PAGE 48]\n\n# # Classes and IDs\n\n> ### Learning Objectives\n\nPin-pointing\
    \ particular elements is necessary if you want to style them from a style sheet\
    \ — the boffins at HTML HQ invented classes and IDs for this purpose.\n\n* Be\
    \ able to use both **classes** and **IDs** to **style** your web pages.\n* Understand\
    \ the **difference** between **classes** and **IDs**.\n\n# # Classes are **named\
    \ collections** of elements\n\n1) So far, your **style sheets** have had a **limitation**\
    \ — e.g. the code on the right styles `<p>` **elements**, but it styles **every\
    \ one** of them in **the same way**.\n2) You don't always want **every paragraph**\
    \ looking the same, so in order to style just **some of them**, you need to use\
    \ a **class**.\n\n```\np {\n    font-size: 150%;\n    color: Blue;\n}\n```\n\n\
    # # **EXAMPLE**\n\nYou can style all elements in the same class in one go.\n\n\
    In the style sheet:\n\nInstead of writing a tag (like 'p'), write a full stop\
    \ followed by the class name — you choose it yourself.\n\n```\n.question {\n \
    \   font-size: 150%;\n    color: Blue;\n}\n```\n\n> **COMMON PROBLEMS**\n\nClass\
    \ names can't contain spaces, so it's common practice to use lowercase words joined\
    \ with hyphens if a single word isn't descriptive enough.\n\nIn the `<body>`:\n\
    \nTo assign your class to an element, add the class attribute to its tag and set\
    \ its value to your class name (without a full stop).\n\n```\n<p>Knock knock...</p>\n\
    <p class=\"question\">Who's there?</p>\n<p>HTML...</p>\n<p class=\"question\"\
    >HTML who?</p>\n<p>HTMLMAO!</p>\n```\n\nKnock knock...\n**Who's there?**\nHTML...\n\
    **HTML who?**\nHTMLMAO!\n\n> Only these paragraphs are **styled**, as they're\
    \ in the **question** class.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_48_0.png)\n\
    \n# # Classes can contain **different types** of elements\n\nIn the example above,\
    \ **only** `<p>` **elements belonged to the** question **class**, but a class\
    \ can actually include **any type of element** whatsoever.\n\n```\n<h1 class=\"\
    question\">Feeling blue?</h1>\n<p class=\"question\">Like to laugh?</p>\n<p>Join\
    \ us at Joke club - Mondays 12am-1am, by the bins.</p>\n```\n\n**Feeling blue?**\n\
    **Like to laugh?**\nJoin us at Joke club - Mondays 12am-1am, by the bins.\n\n\
    > Both the **heading** and this **paragraph** are styled using the **question**\
    \ class.\nThe heading is **bold** as that's a part of the **default style** for\
    \ `<h1>` tags which **isn't** **changed** in the style rules for the **question**\
    \ class.\n\n# # Elements can **belong** to **multiple classes**\n\n+   * You can\
    \ have **as many classes** in your style sheet **as you need** — here's another.\n\
    * You can put an element into **more than one** class — just write the class names\
    \ **separated by spaces**.\n\n```\n.important { text-decoration: underline; }\n\
    ```\n\n```\n<p class=\"question important\">Can you bring cake?</p>\n```\n\n**Can\
    \ you bring cake?**\n\nA space. **Both** question **and** important styles are\
    \ applied."
  - "[PAGE 49]\n\n# # Classes and IDs\n\n# ## IDs are unique to one element\n\nIDs\
    \ are **similar to** classes, but used with a **single element** only.\n\n```\n\
    In the style sheet:\n#gold-medal {\n    background-color: Gold;\n    width: 200px;\n\
    }\n```\n\nIDs are used for more than just styling. For really long web pages,\
    \ you can add them to the end of hyperlinks, for example, `'index.html#eggs'`,\
    \ and a web browser will automatically scroll down the page to the place where\
    \ the element with the eggs ID is found.\n\nIf you give multiple elements the\
    \ same ID, you may not see any issues right away, but it'll cause problems once\
    \ you start using JavaScript — so stick to one element per ID.\n\nTo **assign\
    \ your ID** to an **element**, add the **id attribute** and set its **value**\
    \ to your **ID name** (without the hash).\n\n```\nIn the `<body>`:\n<h1>Tourney\
    \ Results</h1>\n<ol>\n    <li id=\"gold-medal\">Sir Slaysalot</li>\n    <li>Biscuit\
    \ 'Honey' Badger</li>\n    <li>Bill Shoesbury</li>\n</ol>\n```\n\n+   ### Tourney\
    \ Results\n1. **Sir Slaysalot**\n2. Biscuit 'Honey' Badger\n3. Bill Shoesbury.\n\
    \nYou can't list multiples IDs like you can with classes. But every element can\
    \ have both an ID and one or more classes.\n\n**Q1** Extend the example above\
    \ to add silver and bronze medal IDs, with appropriate styles, to the second and\
    \ third list items.\n\n# ## Classes and IDs are great for styling `<div>`s\n\n\
    **EXAMPLE** Styling `<div>`s with classes and IDs.\nfact is a class, so more facts\
    \ with the same style can be added to this page in their own `<div>` later.\n\n\
    ```\n.fact {\n    background-color: Beige;\n    color: Green;\n}\n#fact-of-the-day\
    \ {\n    background-color: Green;\n    color: Beige;\n}\n#fact-of-the-day h3 {\n\
    \    color: Gold;\n}\nWriting the ID **before** `h3` means `color: Gold;` only\
    \ applies to `<h3>` elements that are **inside the element** with **that ID**.\n\
    ```\n\n```\n<div class=\"fact\">\n    <h3>Cone you believe it?</h3>\n    <p>The\
    \ most popular ice cream flavour is vanilla!</p>\n</div>\nfact-of-the-day is an\
    \ ID, so it should only be used with one element.\n<div id=\"fact-of-the-day\"\
    >\n    <h3>It's snow joke...</h3>\n    <p>The UK's coldest ever day was -27.2\
    \ °C.</p>\n</div>\n```\n\nCone you believe it?\nThe most popular ice cream flavour\
    \ is vanilla!\nIt's snow joke...\nThe UK's coldest ever day was -27.2 °C.\n\n\
    **Q2** Modify the example above to add a `<div>` that surrounds both `<div>`s.\
    \ Style it to change the font for both facts at the same time.\n\n**Q3** Restyle\
    \ the example on p.44 using a style sheet with an ID for each of the four divisions.\n\
    \n## IDig your style — you're a class act...\nA tag can belong to a class and\
    \ have an ID at the same time — in this case, if the class and ID both try to\
    \ style a particular property in different ways, then the ID's style will be the\
    \ one used. ID deal."
  - "[PAGE 50]\n\n# Margins and Padding\n\nLearning Objectives: These next couple\
    \ of pages are all about the empty space that separates the bits and pieces on\
    \ a web page. Without it, elements would be bumping together like dodgems.\n\n\
    +   - Learn about margins and how to change them.\n- Learn about padding and how\
    \ to change it.\n\n# Margins are the spaces around an element\n\n+   1) Every\
    \ HTML element has a margin — it's the empty space that surrounds it.\n2) For\
    \ example, a paragraph of text, marked up by <p> tags, is usually displayed with\
    \ margins above and below that are roughly the size of single line of text.\n\
    3) Margins are outside an element's borders — making borders visible can help\
    \ you see where all the margins are.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_50_0.png)\n\
    \n> Have a look back at p.19 for a recap on the border-style property.\n\n```\n\
    .box { border-style: solid; }\n```\n\n```\n<body class=\"box\">\n  <h1 class=\"\
    box\">Dessert Menu</h1>\n  <p class=\"box\">Chocolate Pudding</p>\n  <p class=\"\
    box\">\n    \"It tasted better coming back up.\"\n  </p>\n</body>\n```\n\n> Border\
    \ styles are properties that have to be added to each element individually — they\
    \ won't be inherited from styles applied to <body>.\n\n# You can resize margins\n\
    \n+   - Changing the size of margins is one way you can control the position of\
    \ elements.\n- There are margins on all four sides of an element: top (above),\
    \ right, bottom (below) and left.\n- They each have CSS properties: margin-top,\
    \ margin-right, margin-bottom and margin-left.\n\n```\n#choc-pud {\n  background-color:\
    \ Chocolate;\n  margin-bottom: 0px;\n}\n#choc-pud-review {\n  background-color:\
    \ Khaki;\n  margin-top: 0px;\n  margin-left: 30px;\n}\n```\n\n```\n<p id=\"choc-pud\"\
    \ class=\"box\">\nChocolate Pudding\n</p>\n<p id=\"choc-pud-review\" class=\"\
    box\">\n\"It tasted better coming back up.\"\n</p>\n```\n\n> The gap between the\
    \ elements is removed by setting the margin below one element and above the other\
    \ to 0 pixels.\n\n> 30 pixels of space is added to the left-hand side, moving\
    \ the paragraph to the right.\n\n+   - If you want to set all four margins to\
    \ the same size, you can use the margin property — e.g. margin: 0px; removes all\
    \ margins."
  - "[PAGE 51]\n\n# # Margins and Padding\n\n# ## Padding is the space inside an element\n\
    \n+   1) **Padding** is similar to margins, but it's the <span style=\"color:\
    \ #ff00ff\">space inside</span> an element's <span style=\"color: #ff00ff\">borders</span>.\n\
    2) Most elements have <span style=\"color: #ff00ff\">no padding</span> by default,\
    \ so you have to <span style=\"color: #ff00ff\">add it</span> to see the effect.\n\
    3) **Use the** padding <span style=\"color: #ff00ff\">property</span> to do this\
    \ — there's also -top, -right, -bottom **and** -left variants.\n\n**EXAMPLE**\
    \ Continuing the previous example by adding padding to make things look more spacious.\n\
    \n```\n#choc-pud {\n  background-color: Chocolate;\n  margin-bottom: 0px;\n  padding:\
    \ 10px;\n}\n#choc-pud-review {\n  background-color: Khaki;\n  margin-top: 0px;\n\
    \  margin-left: 30px;\n  padding-left: 20px;\n}\n```\n\n```\n<p id=\"choc-pud\"\
    \ class=\"box\">Chocolate Pudding</p>\n<p id=\"choc-pud-review\" class=\"box\"\
    >\"It tasted better coming back up.\"</p>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_51_0.png)\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_51_1.png)\n\nThis text now has <span\
    \ style=\"color: #ff00ff\">padding around it</span> on <span style=\"color: #ff00ff\"\
    >all sides</span>.\n\nThere's <span style=\"color: #ff00ff\">padding</span> on\
    \ the <span style=\"color: #ff00ff\">left-hand side</span> of this text, but <span\
    \ style=\"color: #ff00ff\">none</span> on the <span style=\"color: #ff00ff\">top\
    \ and bottom</span>.\n\n> **GOING FURTHER** You can give multiple values for padding\
    \ and margin at once. E.g. giving four values (separated by spaces) will set them\
    \ in the order top, right, bottom, left.\n\n> There's also no padding on the right,\
    \ but unless you set the width, the paragraph will still fill the whole page.\n\
    \n# ## auto will distribute margins for you\n\nYou can <span style=\"color: #00aa00\"\
    >reposition most elements</span> relative to the web page by setting certain <span\
    \ style=\"color: #00aa00\">margin properties</span> to 'auto' — **this value tells\
    \ CSS to** <span style=\"color: #00aa00\">calculate the size</span> **for you.**\n\
    \n> This is a better way to align an image when it isn't within a block of text\
    \ — instead of using the text-align property like on p.24.\n\n```\n#choc-pud-image\
    \ {\n  margin-left: auto;\n  margin-right: auto;\n  display: block;\n}\n```\n\n\
    ```\n<img src=\"choc-pud.jpg\" id=\"choc-pud-image\">\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_51_2.png)\n\
    \n> The **auto** property lets web pages look consistent on different devices\
    \ — even if they have different screen sizes.\n\nTo <span style=\"color: #00aa00\"\
    >change the margins</span> of an <span style=\"color: #00aa00\">image</span>,\
    \ set the <span style=\"color: #00aa00\">display property</span> to 'block'.\n\
    \nIf both <span style=\"color: #00aa00\">left and right</span> margins are set\
    \ to 'auto', then they'll be the <span style=\"color: #00aa00\">same size</span>\
    \ — half of the space available. This <span style=\"color: #00aa00\">positions</span>\
    \ the element <span style=\"color: #00aa00\">centrally</span>.\n\n```\n#choc-pud-image\
    \ {\n  margin-left: auto;\n  margin-right: 0px;\n  display: block;\n}\n```\n\n\
    ```\n<img src=\"choc-pud.jpg\" id=\"choc-pud-image\">\n```\n\nA <span style=\"\
    color: #00aa00\">margin</span> set to auto will <span style=\"color: #00aa00\"\
    >fill the space</span> if the opposite margin is <span style=\"color: #00aa00\"\
    >zero</span> — this positions the element on <span style=\"color: #00aa00\">one\
    \ side</span> of the page.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_51_3.png)\n\
    \nThe <span style=\"color: #00aa00\">right</span> margin is <span style=\"color:\
    \ #00aa00\">zero</span>, so the image ends up on the <span style=\"color: #00aa00\"\
    >right-hand side</span>.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_51_4.png)\n\
    \n**Oh it's <u>p</u>adding, with an a — sorry, I've got pudding for brains...**\n\
    Remember, margins are outside the border and padding is inside the border. Quite\
    \ often the border is invisible, but you can temporarily set a border-style if\
    \ you need to see where it is."
- md: "## Advanced Positioning\n\n**Learning Objectives**\nHere's your last bit of\
    \ CSS for this book. I know, it's been a wild ride, and I'm sad it's ending too,\
    \ but I've saved some of the best for last.\n\n- Be able to position images alongside\
    \ text using float.\n- Be able to position elements alongside each other using\
    \ display: flex.\n\n## float can position images alongside text\n\nYou've seen\
    \ a few ways to position images, but none quite so fancy as this.\n\n```css\n\
    /* CSS */\n.story {\n  width: 300px;\n}\n.illustration {\n  float: right;\n  margin-left:\
    \ 10px;\n}\n```\n\n```html\n<!-- HTML -->\n<div class=\"story\">\n  <img class=\"\
    illustration\" src=\"rock-stack.jpg\" width=\"200\" alt=\"A photo of a stack of\
    \ rocks\">\n  <p>When life gives you rocks, balance them one atop ...</p>\n</div>\n\
    ```\n\n```text\n/* Result */\n\"When life gives you rocks, balance them one atop\
    \ the other.\" That's what my grandpa used to say. Before his rock stack toppled.\
    \ He gave up stacking rocks after that, and took up stone skipping instead.\n\
    ```\n\n## display: flex positions content horizontally\n\n`<div>` blocks normally\
    \ stack vertically, but it's easy to put them side by side instead.\n\n```css\n\
    /* CSS */\n#stories {\n  display: flex;\n}\n.story {\n  width: 300px;\n  margin:\
    \ 20px;\n  padding: 5px;\n  border-style: solid;\n}\n.story h1 {\n  text-align:\
    \ center;\n}\n.illustration {\n  float: right;\n  margin-left: 10px;\n}\n```\n\
    \n```html\n<!-- HTML -->\n<div id=\"stories\">\n  <div class=\"story\">\n    <h1>Grandpa's\
    \ Rocks</h1>\n    <img class=\"illustration\" ...>\n    <p>When life gives you\
    \ rocks, ...</p>\n  </div>\n  <!-- Second div not shown but same structure -->\n\
    </div>\n```\n\n```text\n/* Result */\n[Card 1: Grandpa's Rocks]\n\"When life gives\
    \ you rocks, balance them one atop the other.\" That's what my grandpa used to\
    \ say. Before his rock stack toppled. He gave up stacking rocks after that, and\
    \ took up stone skipping instead.\n\n[Card 2: Grandpa's Stones]\nHe'd be out there\
    \ for hours, hurling stones into the setting sun. Until one day he turned around\
    \ and said to me, \"I bet I could make some nice jewellery if I polish these pebbles\"\
    . He never skipped another stone again.\n```\n\n## If you really want to show\
    \ off, you can flex your `<a>`s too...\n\nAs well as `float: right;` you've also\
    \ got `float: left;` which does what you might expect. These properties are just\
