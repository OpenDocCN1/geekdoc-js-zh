  md: "# # Worked Challenges\n\n# ## Worked Challenge 2 — Village Hall\n\nA village\
    \ hall has two exciting events coming up: a 'Tech Expo' where local companies\
    \ come to show off their newest gadgets, and a 'Book Fest' where famous authors\
    \ are coming in to give talks.\n\nCreate two web pages that can be used to promote\
    \ these events. You need to make sure:\n\n* Styling across the two pages is professional\
    \ and accessible.\n* There is consistent styling across both the pages.\n* There\
    \ is an image on each page.\n* There are links between the pages.\n\n# ### SOLUTION\n\
    \nPlan: Create an external style sheet for the styles that will be consistent\
    \ across each page. Then create an HTML file for each page, add the appropriate\
    \ information, images and links, and apply the styles.\n\n```\ntech-expo.html:\n\
    <head>\n    <title>Tech Expo</title>\n    <link rel=\"stylesheet\" href=\"styles.css\"\
    >\n</head>\n\n<body>\n    <h2><u>Come to the Tech Expo!</u></h2>\n    <div class=\"\
    info\">\n        <p>Try the newest gadgets in the hall soon.</p>\n        <p>There\
    \ will also be a <a href=\"book-fest.html\">Book Fest</a>.</p>\n    </div>\n\n\
    \    <div class=\"photo-frame\">\n        <img src=\"tablet.jpg\" width=\"200\"\
    \ alt=\"Tablet with wireless keyboard\">\n    </div>\n</body>\n```\n\n```\nstyles.css:\n\
    body {\n    font-family: Arial, sans-serif;\n    background-color: AliceBlue;\n\
    }\n.info {\n    color: DarkGreen;\n    font-family: Garamond, serif;\n}\n.photo-frame\
    \ {\n    border-style: double;\n    width: 200px;\n    padding: 6px;\n    background-color:\
    \ Beige;\n}\n```\n\n② The external style sheet uses two classes (.info and .photo-frame)\
    \ to style the relevant divisions of the web page.\n\n① Add the <link> to connect\
    \ to the style sheet.\n\n③ Use classes with <div>s to add styling to different\
    \ parts of your page.\n\n④ Add the HTML file name for internal links, using a\
    \ relative file path.\n\n⑤ Make sure you link to the same external style sheet\
    \ in the <head>, so that this page is styled the same as tech-expo.html.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_82_0.png)\n\
    \n```\nbook-fest.html (<body> only):\n<h2><u>Come to the Book Fest!</u></h2>\n\
    <div class=\"info\">\n    <p>Talks from famous authors in the hall soon.</p>\n\
    \    <p>There will also be a <a href=\"tech-expo.html\">Tech Expo</a>.</p>\n</div>\n\
    \n<div class=\"photo-frame\">\n    <img src=\"books.jpg\" alt=\"Books on a shelf\"\
    \ width=\"200\">\n</div>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_82_1.png)\n\
    \n⑥ Add alt text to improve accessibility."
