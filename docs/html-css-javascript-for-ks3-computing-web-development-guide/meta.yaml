  md: '# Coding Challenges for Section Seven


    Hopefully your pages are now popping off — just don''t spam the user with 1000
    alerts or they''ll think they''ve got a virus. Have a go at these challenges,
    then head over to cgpbooks.co.uk/biscuit to get the example code.


    # Challenge 1 — Example


    Create a web page that uses **alerts** and **prompts** to help the user create
    a ''knock knock'' joke.


    +   - Start with an **alert** with the **message** "Knock knock...".

    - Then a **prompt** with the **question** "Who''s there?" to get a **response**.

    - Then a **prompt** with the **comeback** "___ who?" to get the **punchline**.

    - The user should then see the **whole joke laid out** on the web page.


    > Fill in the blank with the user''s response.


    > See p.45 for an example joke, and how you might style it.


    ```

    **Plan:** Create a template for the joke in HTML, then use a script to fill it
    in based on the answers to the prompts.

    ```


    ```

    <p>Knock knock...</p>

    <p>Who''s there?</p>

    <p id="response"></p>

    <p id="comeback"></p>

    <p id="punchline"></p>

    ```


    ```

    <script>

    alert("Knock knock...");

    let responseText = prompt("Who''s there?");

    let comebackText = responseText + " who?";

    let punchlineText = prompt(comebackText);


    let response = document.getElementById("response");

    let comeback = document.getElementById("comeback");

    let punchline = document.getElementById("punchline");


    response.innerHTML = responseText;

    comeback.innerHTML = comebackText;

    punchline.innerHTML = punchlineText;

    </script>

    ```


    > 1. The HTML is simple. The first two lines of the joke can be filled in from
    the start. The other lines are left empty, but given IDs so they can be changed
    by the script. You might also add class attributes to style the page, (not shown
    here).


    > 2. Use prompt() to ask the user to input their parts of the joke — store each
    input in a variable.


    > 3. .getElementById() is used to access each element using their ID.


    > 4. Finally, .innerHTML is used to fill in the text on the page.


    # Challenge 2


