  md: "# External CSS\n\n# CSS has priority rules\n\n1) When you use external CSS,\
    \ you can still use inline and internal CSS on your page.\n2) If a property is\
    \ set in more than one place, there are rules about which value is used.\n\n+\
    \   - If a property is set in both inline CSS and a style sheet, the inline style\
    \ will take priority.\n\n```\n<head>\n    <link rel=\"stylesheet\" href=\"styles.css\"\
    >\n</head>\n<body>\n    <h1 style=\"text-decoration: none;\">CSS Workshop</h1>\n\
    \    <p>It's a 24-hour coding extravaganza.</p>\n    <p><a href=\"signup.html\"\
    >Sign up here</a>.</p>\n</body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_43_0.png)\n\
    \n+   - If a property is set in both internal and external CSS, then whichever\
    \ of the <link> or <style> tags is used second will take priority.\n\n```\n<head>\n\
    \    <link rel=\"stylesheet\" href=\"styles.css\">\n    <style>\n        h1 {\
    \ text-decoration: line-through; }\n    </style>\n</head>\n<body>\n    <h1>CSS\
    \ Workshop</h1>\n    <p>Sorry, due to bug-ridden code, the event has been cancelled.</p>\n\
    </body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_43_1.png)\n\n# <link>\
    \ can add icons to your web pages\n\n+   - The <link> tag can also be used to\
    \ add icons to your web pages.\n- These are the small images that are shown next\
    \ to the title on a browser tab — these are sometimes called 'favicons' as they're\
    \ shown in favourites (or bookmarks) lists too.\n\n# EXAMPLE\n\nMaking your web\
    \ pages iconic.\n\n```\n<head>\n    <title>CSS Workshop</title>\n    <link rel=\"\
    icon\" href=\"icon.png\">\n</head>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_43_2.png)\n\
    \n> Wash your style sheets at 60 degrees to get rid of code bugs...\n\nTo recap:\
    \ inline CSS is for small bits of style unique to one element, internal CSS is\
    \ for styles that only apply to a single page, and external CSS is for styles\
    \ that apply to multiple pages — simple."
  merge: -1
