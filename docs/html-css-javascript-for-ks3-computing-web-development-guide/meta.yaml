    \ — 高级 JavaScript\n\n- 数字与布尔值\n- 使用随机数\n- 输入字段与表单\n- 更多输入字段\n- 练习题\n- 响应事件\n-\
    \ 显示与隐藏元素\n- 日期与时间\n- 定时代码\n- 练习题\n- 第八部分编码挑战\n\n## 第九部分 — 综合挑战\n\n- 详解挑战\n- 独立挑战\n\
    - 快速参考指南\n- 术语表\n- 答案\n- 索引\n\n本书包含以 **视频解答** 和 **附加文件** 形式呈现的数字附加内容——只需扫描此二维码即可访问。**附加文件**\
    \ 包括你在书中看到的示例代码、作为问题和挑战示例答案的代码文件，以及一些便捷的 .txt 文件。你还会在一些编码挑战旁找到一个 **二维码**，可以直接跳转到其\
