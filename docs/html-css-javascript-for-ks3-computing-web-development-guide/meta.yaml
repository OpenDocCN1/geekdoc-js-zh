  - "[PAGE 74]\n\n# Responding to Events\n\nChanging an input field is also an event\n\
    \n+   1. Every `<input>` element has an `oninput` event that occurs whenever the\
    \ input is changed in some way.\n2. For example, whenever a character is inserted,\
    \ changed or deleted in a text (or password) input field, the `oninput` event\
    \ happens.\n3. This can be used to update a web page live in response to a user\
    \ typing.\n\nYou can use the `oninput` attribute to give live feedback to the\
    \ user.\n\nThe user must enter a review that is no more than 20 characters in\
    \ length.\n\nThis number changes as they type to tell them how many characters\
    \ they've left to use.\n\nThe user is warned if they've used too many characters\
    \ — shame...\n\nThe HTML:\n\n```\n<h2>20-Character Review</h2>\n<form>\n  <label\
    \ for=\"review\">Review:</label>\n  <input type=\"text\" id=\"review\" oninput=\"\
    checkInput()\">\n  <p id=\"message\">You've 20 characters left.</p>\n</form>\n\
    <script> ... </script>\n```\n\nWhenever the input field changes, the `checkInput()`\
    \ function will be called.\nThe input field starts off empty, so the initial text\
    \ is an appropriate message.\n\nThe JavaScript:\n\n```\nfunction checkInput()\
    \ {\n  let review = document.getElementById(\"review\");\n  let message = document.getElementById(\"\
    message\");\n  let charsUsed = review.value.length;\n  if (charsUsed > 20) {\n\
    \    message.innerHTML = \"You're over the 20-character limit.\";\n  } else {\n\
    \    let charsLeft = 20 - charsUsed;\n    message.innerHTML = \"You've \" + charsLeft\
    \ + \" characters left.\";\n  }\n}\n```\n\nreview.value is the inputted string.\n\
    Adding .length reads the length of the string — in other words, the number of\
    \ characters used.\n\nIf more than 20 characters are used, the user is warned.\n\
    \nIf 20 or fewer characters are used, the number left to use is calculated and\
    \ the message is updated.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_74_0.png)\n\
    \nQ2 Modify the example so that the text in the input field is red whenever the\
    \ user is over the 20 character limit.\n\nHint: the CSS color property affects\
    \ text in `<input>` fields.\n\nTake a look at the code for the colour picker (see\
    \ p.38) in the downloadable content for Section 5. It uses an input field of the\
    \ type color and updates the hex code on the page using the `oninput` event.\n\
    \nThe best advice I ca\n\nThe `oninput` event depends on the type of input. For\
    \ radio buttons and checkboxes, it happens whenever they're checked or unchecked.\
    \ For a `color` type input, it's when a colour is picked."
  - "[PAGE 75]\n\n72\n\n# Showing and Hiding Elements\n\n> **Learning Objectives**\n\
    You've seen the display property flexing its muscles already on p.49, but it's\
    \ got another trick up its sleeve — it can also make things disappear.\n* Be able\
    \ to use the CSS display property to show and hide elements.\n\n# display can\
    \ make elements disappear\n\nThe CSS display property changes how a web browser\
    \ lays out an element.\n* display: block; gives the element a box-like container\
    \ — this is the default for many elements — headings, paragraphs, <div>s, etc.\n\
    * display: none; tells the web browser not to display the element at all — it's\
    \ simply ignored. This is quite handy for making dynamic web pages.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_75_0.png)\n\
    \n**EXAMPLE**\nThe display property makes it easy to swap the content that's shown\
    \ on a web page.\n\nThe HTML:\n\nThe CSS:\n\n```\n<div id=\"main\">\n  <p>Which\
    \ are better?</p>\n  <img src=\"dog-vs-cat.jpg\" height=\"200\"><br>\n  <button\
    \ type=\"button\" onclick=\"chooseDogs()\">Dogs</button>\n  or\n  <button type=\"\
    button\" onclick=\"chooseCats()\">Cats</button>\n</div>\n<div id=\"dogs\">\n \
    \ <p>You know it.</p>\n  <img src=\"dog.jpg\" height=\"200\">\n</div>\n<div id=\"\
    cats\">\n  <p>Ah, someone of culture.</p>\n  <img src=\"cat.jpg\" height=\"200\"\
    >\n</div>\n```\n\n> There are three <div>s on this page but only one will be seen\
    \ at a time.\n\nEach <div> has an ID so that they can be individually styled and\
    \ modified by the script.\ndisplay: none; in the CSS causes both the 'dogs' and\
    \ 'cats' <div>s to be initially unseen on the web page.\n\n```\n#dogs {\n  display:\
    \ none;\n}\n#cats {\n  display: none;\n}\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_75_1.png)\n\
    \nThe JavaScript:\n\nThese variables are set at the top of the script so both\
    \ functions can use them.\n\n```\nlet main = document.getElementById(\"main\"\
    );\nlet dogs = document.getElementById(\"dogs\");\nlet cats = document.getElementById(\"\
    cats\");\n\nfunction chooseDogs() {\n  dogs.style.display = \"block\";\n  main.style.display\
    \ = \"none\";\n}\n\nfunction chooseCats() {\n  cats.style.display = \"block\"\
    ;\n  main.style.display = \"none\";\n}\n```\n\nWhen the page first loads, only\
    \ the 'main' <div> is seen.\nWhen either button is clicked, the page dynamically\
    \ changes to show the corresponding <div>'s content.\n\nSetting display to block\
    \ means the content is shown and setting it to none means it isn't shown.\n\n\
    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_75_2.png)\n\n> Q1 Add a 'Choose again'\
    \ button to both the 'cats' and 'dogs' <div>s that can be used to reset the web\
    \ page.\n\n> If only display: none; could make my homework disappear...\nThere\
    \ are all sorts of techniques for creating dynamically changing pages, and often\
    \ different ways to get the same results. There isn't always a right or wrong\
    \ way — if it works, it works.\n\nSection Eight — Advanced JavaScript"
  - '[PAGE 76]


    # # Date and Time


    Learning Objectives

    I''ll make this quick, as I''ve a date with a bowl of ice cream — JavaScript has
    functions that tell you the current date and time.

    - Be able to use Date() to get the current date and time.


    # ## Date() tells you the current date...


    1) Usually, you won''t know exactly when your code will be used.

    2) JavaScript has functions to get the current date — you can use these on your
    website, so it''ll always be up to date for any user who visits it.


    Don''t forget to include new Date().


    ```

    let now = new Date();

    console.log(now.getMonth() + 1); // 7

    ```


    The ''current date'' is the date when the code is run, not when it''s written.

    This stores information about the current date in the variable now.

    The date info is retrieved using functions like getMonth().

    getMonth() gives January as 0, February as 1, etc. So you need to add 1 to get
    the usual calendar number — e.g. 7, if you ran this code in July.


    3) There are other useful date functions:

    - getDay() tells you the day of the week as a number from 0 to 6. (0 = Sunday,
    1 = Monday, 2 = Tuesday, etc.)

    - getDate() tells you the day of the month as a number from 1 to 31.

    - getFullYear() tells you the year as a four-digit number.


    Q1

    Create a web page that displays the current date in the form day/month/year, e.g.
    14/5/2089.


    # ## ...and the current time too


    - It''s not just the calendar date that''s available from Date() — it also includes
    the current time.


    ```

    <p>The time is <b id="time"></b>.</p>

    <script>

    let now = new Date();

    let time = document.getElementById("time");

    time.innerHTML = now.getHours() + ":" + now.getMinutes();

    </script>

    ```


    Time is given in the 24-hour clock.

    Remember, this code isn''t inside a function, so it will run immediately when
    the web page is viewed.

    This <b> tag is left empty — the script will fill it in.

    Date() captures the time at the moment this line of code is run on the web page.


    The time is 13:25.

    getHours() tells you the hour in the 24-hour clock (0-23).

    getMinutes() tells you the number of minutes past the hour (0-59).


    - You can also use getSeconds() to get the number of seconds past the minute.


    Q2

    Create a web page that changes to a spooky theme during ''witching hour'' (00:00-00:59
    in the 24-hour clock) — e.g. by changing colour and displaying a creepy image.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_76_0.png)


    # ## It must be ditching hour — that bowl of ice cream stood me up...


    When you use new Date() inside a function, the time info isn''t stored until the
    function is actually run and gets to that line of code. If the function is called
    again, the time is updated.'
  - "[PAGE 77]\n\n# Timing Code\n\n**Learning Objectives**\nGood timing isn't just\
    \ for comedy, many programs need it too — from stopwatches to games. Here's the\
    \ stopwatch. The games are your final challenge in Section 9.\n* Be able to use\
    \ `setInterval()` to start a timer and `clearInterval()` to stop a timer.\n* Be\
    \ able to use `Date()` to calculate time differences.\n\n# setInterval() starts\
    \ a timer\n\n+   1) You've seen how to respond to events that happen based on\
    \ user actions (p.70-71), but sometimes you want something to happen at a certain\
    \ time.\n2) The `setInterval()` function can be used to start a timer which waits\
    \ a given amount of time (in milliseconds) before calling another function.\n\
    3) The timer will call the function repeatedly — waiting the same amount of time\
    \ between each call.\n4) This continues forever until the `clearInterval()` function\
    \ is used to stop the timer (or until the user closes the web page).\n\n**KEY\
    \ TERMS**\nA millisecond is one thousandth of a second. This means that 1000 milliseconds\
    \ = 1 second, 2000 milliseconds = 2 seconds, and so on.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_77_0.png)\n\
    \n**EXAMPLE**\n`setInterval()` needs to be given a function and a time.\n* This\
    \ is the name of the function that will be called.\n* This is the time delay before\
    \ and between each function call.\n\n```\nlet timer = setInterval(delayedHello,\
    \ 5000);\n\nfunction delayedHello() {\n  alert(\"Well timed!\");\n  clearInterval(timer);\n\
    }\n```\n\nStore the timer as a variable — this lets you stop the timer by calling\
    \ `clearInterval()` with the name of your variable in brackets.\n\n**GOING FURTHER**\n\
    A new timer is created every time `setInterval()` is called. You can store multiple\
    \ timers in different variables, if you want to use more than one timer on the\
    \ same web page.\n\nWhen the page is opened, you'll see nothing for 5 seconds,\
    \ then `delayedHello()` will be called and the alert will pop up.\n\nThis page\
    \ says\nWell timed!\n[OK]\n\n# A timer can be used to create a stopwatch\n\nHere's\
    \ how to create a simple stopwatch using a timer — starting with the HTML:\n**EXAMPLE**\n\
    The stopwatch will have two buttons — one to start it and one to stop it.\nThe\
    \ counter will begin at 0 seconds and count up when the 'Start' button is clicked.\n\
    \n```\n<div id=\"stopwatch\">\n  <div id=\"seconds-display\">0 s</div>\n  <button\
    \ type=\"button\" id=\"start-button\" onclick=\"startWatch()\">Start</button>\n\
    \  <button type=\"button\" id=\"stop-button\" onclick=\"stopWatch()\" disabled>Stop</button>\n\
    </div>\n```\n\nThe onclick attribute of each button is set to call a corresponding\
    \ function.\n\nThe elements are given IDs so they can be accessed by JavaScript\
    \ (see the next page) and styled with CSS.\n\nThe disabled attribute is present\
    \ here (see p.68), so that the 'Stop' button can't initially be clicked.\n\n0\
    \ s\nStart   Stop\n\n**This example is continued on the next page...**\n\nSection\
    \ Eight — Advanced JavaScript"
