  - "[PAGE 26]\n\n# # Changing Fonts\n\nLearning Objectives\nA font can make all the\
    \ difference to how something looks. Totally Real Bank would look a bit fishy,\
    \ but Totally Real Bank? Now that's a legit business — sign me up.\n- Understand\
    \ what a font family is.\n- Be able to use the font-family property to change\
    \ the font of text.\n- Be able to use the font-size property to change the size\
    \ of text.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_26_0.png)\n\n# ## font-family\
    \ determines how text looks\n\n1) A font is a particular design of the letters,\
    \ numbers and symbols that make up text.\n2) A font family is a group of similar\
    \ fonts — they often include regular, bold and italic variations of the same font.\n\
    E.g. the 'Times New Roman' family includes: regular, bold and italic.\n3) CSS\
    \ also groups fonts into generic families, including:\n- Serif — for more traditional\
    \ looking text (e.g. Times New Roman).\n- Sans-serif — for clean and simple looking\
    \ text (e.g. Arial).\n4) You can use the font-family property to say which font(s)\
    \ you want text to be displayed in.\n\nOther generic font families include: cursive\
    \ (e.g. for handwriting), monospace (e.g. for code) and fantasy (for other stuff...)\n\
    \nA serif is a small flick (line) attached to a letter.\n\nEXAMPLE\nHow to use\
    \ the font-family property.\nList one or more font families (separated by commas)\
    \ in your order of preference.\nInclude a generic family in case a web browser\
    \ can't display your other choices.\nIf a web browser couldn't use Arial here,\
    \ it would pick another font from the sans-serif family, like Helvetica.\n\n```\n\
    <body style=\"font-family: Arial, sans-serif;\">\n  <h1>New Font, New Me</h1>\n\
    \  <p>This is looking <i>better</i> already.</p>\n  <p style=\"font-family: 'Times\
    \ New Roman', serif;\">Serifs drool,</p>\n  <p>Sans-serifs rule.</p>\n</body>\n\
    ```\n\nPut in quotes around font names containing spaces.\n\n**New Font, New Me**\n\
    This is looking better already.\nSerifs drool,\nSans-serifs rule.\n\n5) CSS can\
    \ make text bold and italic without using <b> or <i> tags.\n\n```\n<p style=\"\
    font-weight: bold;\">Bold</p>\n<p style=\"font-style: italic;\">Italic</p>\n```\n\
    \nYou can set the value of these properties to normal to remove bold or italics\
    \ from elements that have them set as default.\n\n**Bold**\n*Italic*\n\n# ## Use\
    \ font-size to make text bigger and smaller\n\nEXAMPLE\nTwo ways to represent\
    \ size are by percentage or by number of pixels (px).\nA percentage value means\
    \ the text will be at that percentage bigger or smaller than usual.\nA value in\
    \ pixels means the text will be displayed at exactly that size.\n\nThe default\
    \ font size in web browsers is usually 16px.\n\n```\n<p>Domain names for sale</p>\n\
    <p style=\"font-size: 200%;\">Now just 50p</p>\n<p style=\"font-size: 8px;\">Sponsored\
    \ Ad</p>\n```\n\nDomain names for sale\nNow just 50p\nSponsored Ad\n\n> Inaccessible\
    \ web design principle #1: pick a font that's a pain in the backside to read...\n\
    If your web browser isn't showing the correct font, then check commas and quotations\
    \ marks (they're easy to get wrong), and check spelling too — Ariel is my great-aunt's\
    \ name, not a font."
  - "[PAGE 27]\n\n# Alignment and Size\n\nTwo topics for the price of one here — don't\
    \ say I never did anything for you. This page covers the basics of how to get\
    \ stuff where you want it on a page.\n\n+   - Be able to use the text-align property\
    \ to realign text.\n- Be able to use the width property to resize elements.\n\n\
    # Improve layout by aligning\n\n+   - The text-align property changes the horizontal\
    \ position of blocks of text.\n- The three main values it can have are left (the\
    \ default), right and center.\n\n```\n<h1 style=\"text-align: center;\">\n  Pencil\
    \ Weekly\n</h1>\n<p style=\"text-align: right;\">\n  The right way to write. <br>\n\
    \  <img src=\"pencil.jpg\">\n</p>\n<p>Your source of pencil news.</p>\n```\n\n\
    There are lots of ways to position text and images with CSS. The example above\
    \ shows the simplest method — see Section 6 for more advanced positioning.\n\n\
    # Resize elements using width\n\n+   1) Elements, like headings and paragraphs,\
    \ normally fill the width of the available space.\n2) You can change this behaviour\
    \ by setting their width property.\n3) Use a percentage value if you want a width\
    \ that's proportional to the available space.\n\n```\n<p style=\"width: 50%;\"\
    >The HB pencil performs well under extreme conditions.</p>\n```\n\n+   4) Use\
    \ a value in pixels if you want to set an exact width.\n\n```\n<p style=\"width:\
    \ 100px;\">\nThe HB pencil performs well under extreme conditions.\n</p>\n```\n\
    \n+   5) Beware — this CSS width property is different to the HTML width attribute\
    \ that you saw for the <img> tag on p.15. That attribute can only have pixel values\
    \ and most elements can't use it.\n\n# CSS — Color Center Spelt Strangely...\n\
    \nGetting things where you want them on a web page can be a bit of a headache.\
    \ It can be helpful to add a border just to see where the edges of your element\
    \ are — you can always remove it later."
