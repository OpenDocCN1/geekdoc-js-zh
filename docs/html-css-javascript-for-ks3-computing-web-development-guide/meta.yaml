  md: "# # Timing Code\n\n**EXAMPLE** You only need to define three simple functions\
    \ to get the stopwatch to work.\n\nThese variables will be needed later — they're\
    \ set here so they're available to use in any of the functions below.\n\n```\n\
    let timer = 0;\nlet seconds = 0;\n\nlet secondsDisplay = document.getElementById(\"\
    seconds-display\");\nlet startButton = document.getElementById(\"start-button\"\
    );\nlet stopButton = document.getElementById(\"stop-button\");\n```\n\nThis variable\
    \ will keep track of how many seconds have gone by after the timer has started.\n\
    \nThe main purpose of startWatch() is to create and start a timer — it's run when\
    \ the 'Start' button is clicked.\n\n```\nfunction startWatch() {\n    timer =\
    \ setInterval(updateWatch, 1000);\n    \n    startButton.disabled = true;\n  \
    \  stopButton.disabled = false;\n}\n```\n\nA timer is set up to call updateWatch()\
    \ once every second (1000 milliseconds).\n\nThe 'Start' button is disabled. The\
    \ 'Stop' button is enabled.\n\nstopWatch() stops the timer when the 'Stop' button\
    \ is clicked.\n\n```\nfunction stopWatch() {\n    clearInterval(timer);\n    \n\
    \    startButton.disabled = false;\n    stopButton.disabled = true;\n}\n```\n\n\
    The stored timer is stopped.\n\nAlternating which button is disabled ensures that\
    \ the user can't call the functions in the wrong order.\n\nThe 'Start' button\
    \ is enabled. The 'Stop' button is disabled.\n\nOnce the stopwatch has been started,\
    \ updateWatch() will be called every second — it's responsible for keeping count\
    \ and updating the display.\n\n```\nfunction updateWatch() {\n    seconds = seconds\
    \ + 1;\n    secondsDisplay.innerHTML = seconds + \" s\";\n}\n```\n\nThe second\
    \ counter is increased by 1 and the display is updated.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_78_0.png)\n\
    \nInitially the 'Start' button is enabled. As soon as 'Start' is clicked, it's\
    \ disabled and the 'Stop' button is enabled. The displayed number increases by\
    \ 1 each second. When 'Stop' has been clicked, the display stays fixed.\n\nQ1\
    \ Style the stopwatch, e.g.\n\nQ2 Combine the 'Start' and 'Stop' buttons into\
    \ a single button that alternates between the two functions and changes appearance\
    \ depending on whether the stopwatch is running.\n\nQ3 Add a reset button which,\
    \ when clicked, sets the seconds variable and display back to 0.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_78_1.png)\n\
    \n# # You can find time differences using Date()\n\n**You can use Date() to calculate\
    \ how much time passed between two things happening — this is better than using\
    \ a timer to count every second when, for example, you don't need to display the\
    \ seconds in between.**\n\n```\nlet startTime = new Date();\n\nlet endTime = new\
    \ Date();\nlet timeTaken = endTime - startTime\n```\n\nStore the time at the point\
    \ you want to start measuring it.\n\nStore the time again when you want to stop\
    \ measuring it.\n\nThis calculation tells you how many milliseconds have passed\
    \ between the two times.\n\n# # setInterval(checkSocialMedia, 5000)...\n\nTiming\
    \ code is tricky — the program flow can take a while to get your head around.\
    \ Start with the basic stopwatch example and add bits to it — with a bit of practice\
    \ you'll soon get the hang of it."
