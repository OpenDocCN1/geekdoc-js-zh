  md: "# # Classes and IDs\n\n> ### Learning Objectives\n\nPin-pointing particular\
    \ elements is necessary if you want to style them from a style sheet — the boffins\
    \ at HTML HQ invented classes and IDs for this purpose.\n\n* Be able to use both\
    \ **classes** and **IDs** to **style** your web pages.\n* Understand the **difference**\
    \ between **classes** and **IDs**.\n\n# # Classes are **named collections** of\
    \ elements\n\n1) So far, your **style sheets** have had a **limitation** — e.g.\
    \ the code on the right styles `<p>` **elements**, but it styles **every one**\
    \ of them in **the same way**.\n2) You don't always want **every paragraph** looking\
    \ the same, so in order to style just **some of them**, you need to use a **class**.\n\
    \n```\np {\n    font-size: 150%;\n    color: Blue;\n}\n```\n\n# # **EXAMPLE**\n\
    \nYou can style all elements in the same class in one go.\n\nIn the style sheet:\n\
    \nInstead of writing a tag (like 'p'), write a full stop followed by the class\
    \ name — you choose it yourself.\n\n```\n.question {\n    font-size: 150%;\n \
    \   color: Blue;\n}\n```\n\n> **COMMON PROBLEMS**\n\nClass names can't contain\
    \ spaces, so it's common practice to use lowercase words joined with hyphens if\
    \ a single word isn't descriptive enough.\n\nIn the `<body>`:\n\nTo assign your\
    \ class to an element, add the class attribute to its tag and set its value to\
    \ your class name (without a full stop).\n\n```\n<p>Knock knock...</p>\n<p class=\"\
    question\">Who's there?</p>\n<p>HTML...</p>\n<p class=\"question\">HTML who?</p>\n\
    <p>HTMLMAO!</p>\n```\n\nKnock knock...\n**Who's there?**\nHTML...\n**HTML who?**\n\
    HTMLMAO!\n\n> Only these paragraphs are **styled**, as they're in the **question**\
    \ class.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_48_0.png)\n\n# # Classes\
    \ can contain **different types** of elements\n\nIn the example above, **only**\
    \ `<p>` **elements belonged to the** question **class**, but a class can actually\
    \ include **any type of element** whatsoever.\n\n```\n<h1 class=\"question\">Feeling\
    \ blue?</h1>\n<p class=\"question\">Like to laugh?</p>\n<p>Join us at Joke club\
    \ - Mondays 12am-1am, by the bins.</p>\n```\n\n**Feeling blue?**\n**Like to laugh?**\n\
    Join us at Joke club - Mondays 12am-1am, by the bins.\n\n> Both the **heading**\
    \ and this **paragraph** are styled using the **question** class.\nThe heading\
    \ is **bold** as that's a part of the **default style** for `<h1>` tags which\
    \ **isn't** **changed** in the style rules for the **question** class.\n\n# #\
    \ Elements can **belong** to **multiple classes**\n\n+   * You can have **as many\
    \ classes** in your style sheet **as you need** — here's another.\n* You can put\
    \ an element into **more than one** class — just write the class names **separated\
    \ by spaces**.\n\n```\n.important { text-decoration: underline; }\n```\n\n```\n\
    <p class=\"question important\">Can you bring cake?</p>\n```\n\n**Can you bring\
    \ cake?**\n\nA space. **Both** question **and** important styles are applied."
  merge: -1
