  md: "# # Developing for the Web\n\n# ## Code editors have useful features\n\n1)\
    \ Text editors like Notepad or TextEdit will be absolutely fine for this book,\
    \ but they're pretty basic as far as features go.\n2) Code editors are advanced\
    \ text editors that have features to help you:\n   * They can add colours to highlight\
    \ code — making it easier to read.\n   * Some have auto-complete which predicts\
    \ what code you're typing.\n   * They may do auto-formatting and even error correction\
    \ too.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_9_0.png)\n\n# ## Some are desktop\
    \ apps...\n\n* The video solutions for some of the upcoming Coding Challenges\
    \ show Notepad++, which is a free code editor available for Windows®.\n* Some\
    \ code editors are available on Windows®, macOS and Linux®, e.g. Visual Studio\
    \ Code and Brackets (both free) and Sublime Text (free to try).\n* Every editor\
    \ will look a bit different, as they use different fonts and colours, but they\
    \ all let you write web pages in the same coding languages.\n\nThere are lots\
    \ of phone apps that let you write code too — many of the web apps listed here\
    \ work on both desktop and mobile.\n\n# ## ...and some are web apps\n\n* There\
    \ are also web apps that let you write code in your web browser.\n* Some popular\
    \ browser-based editors are w3schools.com, jsfiddle.net and replit.com.\n* The\
    \ benefit of these is that they often show the code and resulting web page side\
    \ by side.\n* However, they don't always make it easy to save or load code, so\
    \ sticking to a desktop program can be better for larger projects.\n\n# ## Getting\
    \ websites onto the Web isn't easy\n\n1) Web pages saved on your computer aren't\
    \ actually on the Web — its only you who has access to them.\n2) Making a website\
    \ that's available across the Internet involves a few steps:\n   * Buying a domain\
    \ name.\n   * Renting space on a web server from a web hosting company.\n   *\
    \ Connecting your domain name to the web server.\n   * Uploading your code files\
    \ to the web server.\n3) This all costs money, but isn't necessary when you're\
    \ starting out.\n4) Free web hosting services are available, but there are downsides\
    \ to using them — e.g. you may get unwanted ads appearing on your website.\n\n\
    You won't need to put anything on the Web to work through this book — everything\
    \ can be done on your computer.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_9_1.png)\n\
    \n> > **Hey, check out my site! It's C:\\Users\\Beckaaa\\rad_site.html...**\n\
    > When you save a change to a web page in your text editor, you don't need to\
    \ close and reopen your web browser to see it — most browsers have a button (and\
    \ shortcut key) to reload the page.\n\nSection One — About the Web"
