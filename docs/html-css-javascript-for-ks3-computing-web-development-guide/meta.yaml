  md: '# Coding Challenges for Section Five


    I can see you''re ready for more Challenges, so here you go — three of my finest.
    Smash the lot, then see just how well you did by visiting cgpbooks.co.uk/biscuit
    to download example code for each challenge.


    # Challenge 1 — Example


    A hyperlink needs to be created with the following design:


    +   - It says "Click me!" in a non-underlined, white, Arial font with a size of
    20px.

    - Normally, its background is ''Blue''.

    - Once visited, its background becomes ''Purple''.

    - When hovered over, its background turns a lighter blue (your choice).


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_46_0.png)


    # Challenge 2


    Create a website that allows a school to showcase the clubs they are running.


    There should be a navigation bar with links to separate web pages for each of
    the following clubs, and back to the home page too.


    +   - Code Club — room F.1.3, run by Ms Key-Bordia.

    - Dance Club — room M.2.7, run by Mr Maca and Ms Rena.

    - Basketball Club — in the sports hall, led by Coach Dunk.


    Each club''s page should display its room, the teacher(s) running it, a relevant
    image, and they should be uniquely styled.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_46_1.png)


    # Challenge 3


    Create a website for a simple quiz.


    +   - The home page should have at least two multiple choice questions — like
    the examples on the right.

    - When the user clicks an answer, they should be taken to one of two pages that
    says whether they are right or wrong. Both of these pages should link back to
    the home page.

    - The site is meant to be used by people sharing a computer, so to avoid giving
    away the correct answers, you should style visited and unvisited links identically.

    - An external style sheet should be used to make sure all three pages use the
    same fonts.


