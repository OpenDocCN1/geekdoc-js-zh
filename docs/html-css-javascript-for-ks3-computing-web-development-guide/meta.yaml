  md: "# Independent Challenges\n\nRight, you're on your own now*. Have a go at creating\
    \ these web pages using what you've learnt. The first couple of challenges cover\
    \ content from **Sections 2-6**, but feel free to stick in any of the more advanced\
    \ web dev tricks you know to get your pages looking slick. *Full example solutions\
    \ are still provided at cgpbooks.co.uk/biscuit\n\n# Challenge 1 — Environmental\
    \ Awareness\n\nYour school wants you to create a **single web page** that can\
    \ be used to provide **environmental advice** to incoming **Year 7s**. Your page\
    \ should contain the following **features**:\n\n+   - Three types of **HTML headings**.\n\
    - Two types of **HTML lists**.\n- Styling that fits the **theme** of environmental\
    \ awareness, using **internal CSS** and at least one example of **inline CSS**.\n\
    - At least **two images**, which are saved in a **folder** called 'images'.\n\
    - An appropriate **icon** (favicon).\n\n> Flick back to p.40 for a reminder about\
    \ adding icons to your web pages.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_83_0.png)\n\
    \n# Challenge 2 — Fan Pages\n\nA start-up company called 'Fandomz' is creating\
    \ a website that **showcases different bands**. They want you to **design the\
    \ website** with pages for their **first two featured bands**:\n\n**FUNKY WAV3**\
    \ are an **indie band** from Banff, Canada. Their music is **fast-paced**, **energetic**\
    \ and **positive**. They are well-known in North America, and are starting to\
    \ **broaden their fanbase** globally.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_83_1.png)\n\
    \n> Video Solution\nRemember, you can also find all video solutions at cgpbooks.co.uk/biscuit\n\
