  md: "# Colour Codes\n\nLearning Objectives\n\nWith over a hundred colour names to\
    \ choose from, you'd think that'd be plenty. But no, it never is. Here's what\
    \ to do when 'MintCream' just isn't minty enough.\n\n* Learn how [hex codes](hex%20codes)\
    \ can represent [different colours](different%20colours).\n* Understand how to\
    \ [find a hex code](find%20a%20hex%20code) for a given colour.\n\n# Every colour\
    \ has a hex code\n\n1) As you saw on p.20, there are loads of [named colours](named%20colours)\
    \ you can use [on the Web](on%20the%20Web). For example, '[Indigo](Indigo)' is\
    \ this [dark purplish blue](dark%20purplish%20blue).\n\n2) Every colour has a\
    \ corresponding [hex colour code](hex%20colour%20code) that you can use instead\
    \ of writing a name — e.g. the [code for Indigo](code%20for%20Indigo) is #4B0082.\n\
    \nHex (short for hexadecimal) is a number system that uses 16 digits — the numerals\
    \ 0-9 and then the letters A-F.\n\n+   Q1 Use CSS to find which colour name matches\
    \ the following colour codes.\n\na) #0000FF\nBlue, Green or Yellow?\n\nb) #808080\n\
    Brown, Beige or Grey?\n\nc) #FFA500\nLime, Orange or Pink?\n\nEXAMPLE There's\
    \ not much to using colour codes really.\n\n```\n<head>\n  <style>\n    h1 { color:\
    \ Indigo; }\n    p { color: #4B0082; }\n  </style>\n</head>\n<body>\n  <h1>Indigo\
    \ Fansite</h1>\n  <p>Let's go indigo!</p>\n</body>\n```\n\nYou can use a [colour\
    \ code](colour%20code) instead of a [colour name](colour%20name) for any CSS property\
    \ where you need to [set a colour](set%20a%20colour).\n\nIndigo Fansite\nLet's\
    \ go indigo!\n\nThe <h1> and <p> text have the [same colour](same%20colour).\n\
    \nHex codes for the named colours are listed in ColourCodes.txt in the downloadable\
    \ files for this section.\n\n# Use a colour picker to find a hex code\n\n+   *\
    \ Hex codes are needed because [not all colours have names](not%20all%20colours%20have%20names).\n\
    * Even for [named colours](named%20colours), you sometimes want a [lighter](lighter)\
    \ or [darker shade](darker%20shade).\n* You can use a tool like a [colour picker](colour%20picker)\
    \ to help you find a [hex code](hex%20code) for the [exact colour](exact%20colour)\
    \ you want to use.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_41_0.png)\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_41_1.png)\n\
    \nThe code files for this section contain a colour picker app — just open 'ColourPicker.html'\
    \ in your web browser to use it. It may look a bit different depending on what\
    \ device you're using. You can also search e.g. \"CSS colour picker\" online to\
    \ find more advanced colour pickers.\n\nHex colour codes are based on a simple\
    \ system: the first two digits represent Red, the middle two represent Green,\
    \ and the last two represent Blue. E.g. Indigo has the code #4B0082 — meaning\
    \ it's a mix of Red (4B) and Blue (82), but no Green (00). By changing these values\
    \ you can alter the colour.\n\nYou can click here to switch the display to show\
    \ [hex code](hex%20code).\n\n+   Q2 Use a colour picker to find the hex codes\
    \ for the following colours:\n\na) Black\nb) White\nc) Red\n\nAnyone going to\
    \ #IndigoCon this year? #IndiGoing #4B0082...\n\nWith so many colours available\
    \ it can be tempting to use loads of them, but many well-designed websites use\
    \ just a few colours that work well together — tastes vary, so do what speaks\
    \ to you."
  merge: -1
