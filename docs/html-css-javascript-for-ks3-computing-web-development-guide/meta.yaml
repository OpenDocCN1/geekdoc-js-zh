  md: '# Alerts and Buttons


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_56_0.png)


    *ALERT* This page contains information about using buttons and displaying messages
    — it will self-destruct in 10....9....8.... Oh wait, we''re not doing timers until
    p.74.


    +   - Be able to use alert() to display a message to the user.

    - Be able to use the <button> tag to mark up buttons.

    - Be able to make buttons that display alerts when clicked.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_56_1.png)


    # alert() pops up a message


    1) A big downside of console.log() is that the user likely won''t be looking at
    the console, so won''t see the outputted message.

    2) The alert() command is an easy way to display a message directly to the user.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_56_2.png)


    # Buttons can control when alerts happen


    - The <button> tag marks up a clickable button:


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_56_3.png)


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_56_4.png)


    Set the type attribute to button to ensure you get a basic button. It won''t do
    anything when clicked until you add a JavaScript command.


    You can apply CSS styles to buttons and the text on them — e.g. background-color,
    font-family, etc. You can even use <img> to put an image on a button.


    - To make a button do something, you can set its onclick attribute.


    EXAMPLE onclick means ''do this thing when the user clicks the button''.


    ```

    <button type="button" onclick="alert(''Ouch, not so hard'')">Click me!</button>

    ```


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_56_5.png)


    The onclick attribute of <button> contains JavaScript code — no <script> tags
    needed. When the button is clicked, the onclick code is run and the alert pops
    up.


    COMMON PROBLEMS When you''ve got quotes inside other quotes, they can''t be the
    same type. The onclick attribute is using double quotes around the JavaScript
    code, so you can''t also use double quotes around the alert() message.


    To solve this problem, you could use single quotes in the alert() like the example
    above.


    ```

    <button type="button" onclick="alert("Eh??")">Click me!</button>

    ```


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_56_6.png)


    The console shows an error message when you get code wrong, with the line number
    in the .html file that the error is on.


    # <button onclick="runAI()">Make Perfect Web Page</button>


    Alerts are a quick and simple way to show a message — useful while you''re getting
    started. They can be annoying though, so use them sparingly. You''ll see a friendlier
    way of outputting on p.58.'
