  md: "# Selection\n\nYou might want content on your web page to change differently\
    \ depending on what the user inputs. If you want to learn how to do this, read\
    \ on. Else, this'll go over your head.\n\n+   - Understand the purpose of selection.\n\
    - Be able to use if, else and else if statements.\n\n# Selection is used to make\
    \ decisions\n\n+   1) In JavaScript, if statements are used to perform selection.\n\
    2) They're often followed by an else statement.\n\nSelection in programming is\
    \ when code is written that will only do something based on a condition.\n\nYou\
    \ can use selection to respond to user input in different ways.\n\nMake sure you\
    \ use the right brackets — () surrounds the condition, {} surrounds the code that\
    \ will be run if the condition is met.\n\n```\n<p>I like pizza.</p>\n<button type=\"\
    button\" onclick=\"getFavTopping()\">Me too</button>\n<p id=\"reaction\"></p>\n\
    <script>\nfunction getFavTopping() {\n  let topping = prompt(\"What's your favourite\
    \ topping?\");\n  let reaction = document.getElementById(\"reaction\");\n  if\
    \ (topping.toLowerCase() == \"pepperoni\") {\n    reaction.innerHTML = \"That's\
    \ my favourite too!\";\n  }\n  else {\n    reaction.innerHTML = \"Mmm, good choice.\"\
    ;\n  }\n}\n</script>\n```\n\n== checks if two values are equal — see p.64 for\
    \ more about operators like this.\n\nThe <p> tag is left empty for the script\
    \ to fill in.\n\nThis function will run when the button is clicked.\n\nPut the\
    \ condition (what you're checking for) in the brackets after if — in this case,\
    \ you're checking if the user's favourite topping is pepperoni.\n\nThis takes\
    \ the value of the variable and makes it all lower case, so the check will be\
    \ true even if the user types e.g. \"Pepperoni\".\n\nThis is the code that will\
    \ run only if the check is true.\n\nAn else statement is optional. It will only\
    \ run when the if condition is false — in this case, when the user answers with\
    \ any topping other than pepperoni.\n\nI like pizza.\nMe too\n\nI like pizza.\n\
    Me too\n\nI like pizza.\nMe too\nThat's my favourite too.\n\nI like pizza.\nMe\
    \ too\nMmm, good choice.\n\nThis will be shown if the user inputs a topping other\
    \ than pepperoni.\n\nThis will be shown if the user inputs \"pepperoni\".\n\n\
    # Use else if to add more checks\n\nIf you want to check for another condition,\
    \ you can add an else if statement between if and else.\n\n```\nif ...\nelse if\
    \ (topping.toLowerCase() == \"pineapple\") {\n  reaction.innerHTML = \"That's\
    \ criminal!\";\n}\nelse ...\n```\n\nThe else if condition will only be checked\
    \ when the if condition is false.\n\nMe too\n\nThat's criminal!\n\nThis will be\
    \ shown if the user chooses pineapple.\n\nQ1 Add a second else if statement to\
    \ this code to give a different response when the user inputs \"spiders\".\n\n\
    You can add as many else if statements as you want.\n\n\"I'm a natural at selection\"\
    \ — Charles Darwin (probably...)\nSelection can take a bit of getting used to.\
    \ Try creating a similar web page to the one above, and make your own responses\
    \ to certain inputs using if, else and else if. Practice makes perfect.\n\nSection\
    \ Seven — JavaScript Basics"
  merge: -1
