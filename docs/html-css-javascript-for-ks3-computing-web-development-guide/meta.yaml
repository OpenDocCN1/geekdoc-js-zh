  md: "# Advanced Positioning\n\n**Learning Objectives**\nHere's your last bit of\
    \ CSS for this book. I know, it's been a wild ride, and I'm sad it's ending too,\
    \ but I've saved some of the best for last.\n\n* Be able to position images alongside\
    \ text using float.\n* Be able to position elements alongside each other using\
    \ display: flex.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_52_0.png)\n\n# float\
    \ can position images alongside text\n\nYou've seen a few ways to position images,\
    \ but none quite so fancy as this.\n\n```\n/* CSS */\n.story {\n  width: 300px;\n\
    }\n.illustration {\n  float: right;\n  margin-left: 10px;\n}\n\n/* HTML */\n<div\
    \ class=\"story\">\n  <img class=\"illustration\" src=\"rock-stack.jpg\" width=\"\
    200\" alt=\"A photo of a stack of rocks\">\n  <p>When life gives you rocks, balance\
    \ them one atop ...</p>\n</div>\n\n/* Result */\n\"When life gives you rocks,\
    \ balance them one atop the other.\" That's what my grandpa used to say. Before\
    \ his rock stack toppled. He gave up stacking rocks after that, and took up stone\
    \ skipping instead.\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_52_1.png)\n\
    \n# display: flex positions content horizontally\n\n&lt;div&gt; blocks normally\
    \ stack vertically, but it's easy to put them side by side instead.\n\n```\n/*\
    \ CSS */\n#stories {\n  display: flex;\n}\n.story {\n  width: 300px;\n  margin:\
    \ 20px;\n  padding: 5px;\n  border-style: solid;\n}\n.story h1 {\n  text-align:\
    \ center;\n}\n.illustration {\n  float: right;\n  margin-left: 10px;\n}\n\n/*\
    \ HTML */\n<div id=\"stories\">\n  <div class=\"story\">\n    <h1>Grandpa's Rocks</h1>\n\
    \    <img class=\"illustration\" ...>\n    <p>When life gives you rocks, ...</p>\n\
    \  </div>\n  <!-- Second div not shown but same structure -->\n</div>\n\n/* Result\
    \ */\n[Card 1: Grandpa's Rocks]\n\"When life gives you rocks, balance them one\
    \ atop the other.\" That's what my grandpa used to say. Before his rock stack\
    \ toppled. He gave up stacking rocks after that, and took up stone skipping instead.\n\
    \n[Card 2: Grandpa's Stones]\nHe'd be out there for hours, hurling stones into\
    \ the setting sun. Until one day he turned around and said to me, \"I bet I could\
    \ make some nice jewellery if I polish these pebbles\". He never skipped another\
    \ stone again.\n```\n\n# If you really want to show off, you can flex your <a><b>s\
    \ too...\n\nAs well as float: right; you've also got float: left; which does what\
    \ you might expect. These properties are just the tip of the iceberg when it comes\
    \ to positioning, but that's all for now.\n\nSection Six — Advanced HTML & CSS"
  merge: -1
