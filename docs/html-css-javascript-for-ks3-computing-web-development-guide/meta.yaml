    # Coding Challenges for Section Seven


    Hopefully your pages are now popping off — just don''t spam the user with 1000
    alerts or they''ll think they''ve got a virus. Have a go at these challenges,
    then head over to cgpbooks.co.uk/biscuit to get the example code.


    # Challenge 1 — Example


    Create a web page that uses **alerts** and **prompts** to help the user create
    a ''knock knock'' joke.


    +   - Start with an **alert** with the **message** "Knock knock...".

    - Then a **prompt** with the **question** "Who''s there?" to get a **response**.

    - Then a **prompt** with the **comeback** "___ who?" to get the **punchline**.

    - The user should then see the **whole joke laid out** on the web page.


    > Fill in the blank with the user''s response.


    > See p.45 for an example joke, and how you might style it.


    ```

    **Plan:** Create a template for the joke in HTML, then use a script to fill it
    in based on the answers to the prompts.

    ```


    ```

    <p>Knock knock...</p>

    <p>Who''s there?</p>

    <p id="response"></p>

    <p id="comeback"></p>

    <p id="punchline"></p>

    ```


    ```

    <script>

    alert("Knock knock...");

    let responseText = prompt("Who''s there?");

    let comebackText = responseText + " who?";

    let punchlineText = prompt(comebackText);


    let response = document.getElementById("response");

    let comeback = document.getElementById("comeback");

    let punchline = document.getElementById("punchline");


    response.innerHTML = responseText;

    comeback.innerHTML = comebackText;

    punchline.innerHTML = punchlineText;

    </script>

    ```


    > 1. The HTML is simple. The first two lines of the joke can be filled in from
    the start. The other lines are left empty, but given IDs so they can be changed
    by the script. You might also add class attributes to style the page, (not shown
    here).


    > 2. Use prompt() to ask the user to input their parts of the joke — store each
    input in a variable.


    > 3. .getElementById() is used to access each element using their ID.


    > 4. Finally, .innerHTML is used to fill in the text on the page.


    # Challenge 2


    Create a web page that can be **styled** in **two different ways** — a **light
    mode** and a **dark mode**, like the example on the right.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_66_0.png)


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_66_1.png)


    There should be a **button** for each mode that **changes** your page to the appropriate
    styles each time it''s **clicked**.


    You can **create your own** page or use the **example page** provided in the **downloadable
    files** for this section.


    # Challenge 3


    A coffee shop, **Java''s Crypt**, has asked you to make a web page for their **customers**
    to **rate their experience**.


    > Don''t forget to make your page look good using CSS.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_66_2.png)


    The page should:


    +   - Ask the user to enter a **star rating** from **0 to 3** using a **prompt**.

    - Use **selection** to display their **rating** (0, 1, 2 or 3) as that **number
    of gold stars**, and follow it with a **related message**.

    - Show an appropriate **alert** if they enter an **invalid rating**.


    The **downloadable files** for this section contain images for a **gold star**
    and a **transparent star** that you can use.'
- md: "## Section Eight — Advanced JavaScript\n\n## Numbers and Booleans\n\n**Learning\
    \ Objectives**\nAs you've seen, JavaScript can handle strings well — but it ain't\
    \ a one-trick pony, it's an all-singing, all-dancing programming language that\
    \ can handle other data types too.\n\n- Be able to use the common arithmetic and\
    \ comparison operators.\n- Be able to use functions to convert between numbers\
    \ and strings.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_67_0.png)\n\n## Arithmetic\
    \ operators work on numbers\n\n1) JavaScript has a single numerical data type,\
    \ called Number, which is used for both integers (whole numbers) and decimal numbers.\n\
    2) The usual arithmetic operators can be used.\n3) If you need to convert a decimal\
    \ number to an integer, you can use these functions:\n   - Math.round() rounds\
    \ to the nearest integer.\n   - Math.floor() rounds down to the nearest integer.\n\
    \n| Operator | Meaning | Example | Output |\n| :--- | :--- | :--- | :--- |\n|\
    \ + | Addition | console.log(5 + 8); | 13 |\n| - | Subtraction | console.log(9\
    \ - 2); | 7 |\n| * | Multiplication | console.log(4 * 3); | 12 |\n| / | Division\
    \ | console.log(6 / 2); | 3 |\n\n```\nconsole.log(Math.round(5.7)); // 6\nconsole.log(Math.floor(5.7));\
    \ // 5\n```\n\n## Boolean values are true or false\n\n1) Alongside strings and\
    \ numbers, JavaScript also has a Boolean data type.\n2) There's only two possible\
    \ Boolean values — true and false.\n3) Comparison operators do what they sound\
    \ like — they compare two values, giving a Boolean result.\n\n| Operator | Meaning\
    \ | Example | Output |\n| :--- | :--- | :--- | :--- |\n| == | Equal to | console.log(\"\
    A\" == \"a\") | false |\n| != | Not equal to | console.log(7 != 9) | true |\n\
    | < | Less than | console.log(3 < 3) | false |\n| <= | Less than or equal to |\
    \ console.log(3 <= 3) | true |\n| > | Greater than | console.log(3 > 3) | false\
    \ |\n| >= | Greater than or equal to | console.log(3 >= 3) | true |\n\n## Strings\
    \ can be converted to numbers\n\n- Values returned by prompt(), or taken from\
    \ elements using .innerHTML, are strings.\n- JavaScript will automatically convert\
    \ strings to numbers if you use them with some operators (e.g. -, *, /), but not\
    \ with the + operator — which will join the strings together instead (see p.54).\n\
    - If you want to do arithmetic, it's best to convert values to numbers first,\
    \ using e.g. parseInt().\n\n```\nlet input = prompt(\"How many laps can you swim?\"\
    );\nlet oldTotal = parseInt(input);\nlet newTotal = oldTotal + 1;\nalert(\"Pfft,\
    \ I can do \" + newTotal + \"!\");\n\n// parseInt() converts the inputted string\
    \ to an integer.\n// As an integer, oldTotal can be used in addition.\n```\n\n\
    - You can also use parseFloat() which converts strings to decimal numbers, and\
    \ if needed, you can add .toString() after a variable to convert it back to a\
    \ string, e.g. newTotal.toString().\n\n**Numbers are a false god — I've converted\
    \ to Booleanism...**\nIf a string isn't a valid number, then parseInt() and parseFloat()\
    \ will return a special value called NaN (short for 'Not a Number'). Any arithmetic\
    \ you try to do with NaN will result in NaN.\n\n## Using Random Numbers\n\nLightSaltySeaweed.\
    \ No, I've not eaten too much cheese again — I'm trying to name the colour I just\
    \ randomly generated, so I'm throwing out words to see what sticks.\n\n- Be able\
    \ to generate random numbers and random colours using JavaScript.\n\n## JavaScript\
    \ can generate random numbers...\n\n- JavaScript has a simple command to generate\
    \ a random decimal number.\n\n```\nlet randomNumber = Math.random();\nconsole.log(randomNumber);\n\
    // 0.29304736087241623\n```\n\nMath.random() generates a random decimal number\
    \ between 0 and 1 (including 0, but not 1).\n\n- With a bit of maths, you can\
    \ use this to get a random whole number too.\n- This formula gives a random whole\
    \ number in the range from a up to b (including both) where a and b are any two\
    \ whole numbers.\n\n```\nMath.floor(Math.random() * n) + a;\n```\n\n- The smallest\
    \ possible number.\n- n = (b - a) + 1. This how many whole numbers are in the\
    \ range (i.e. the number of possible outcomes).\n- This rounds down so you end\
    \ up with a whole number.\n\n**EXAMPLE** Generating a whole number from 1 to 5\
    \ (including both 1 and 5).\n\nThere are (5 - 1) + 1 = 5 whole numbers in the\
    \ range from 1 to 5.\n\n```\nlet oneToFive = Math.floor(Math.random() * 5) + 1;\n\
    console.log(oneToFive);\n```\n\n- The smallest number in the range is 1.\n\n|\
    \ 5 | 3 | 1 | 4 | 4 |\n\nThe output could be any number from 1 to 5.\n\n**Q1**\
    \ Create a web page that asks the user to guess a random number from 10 to 40.\
    \ Give an appropriate message in response to their answer.\n\n## ...and random\
    \ colours too\n\n1) Colour names (see p.20) and hex codes (see p.38) aren't the\
    \ only way to choose colours in CSS. You can also choose a colour by giving separate\
    \ red, green and blue components using rgb().\n2) The values represent how much\
    \ red, green and blue (in that order) are used to make up the final colour — they\
    \ range from 0 to 255. The bigger the number, the more of that colour is used.\n\
    \n```\ncolor: Indigo;\ncolor: #4B0082;\ncolor: rgb(75, 0, 130);\n```\n\nThree\
    \ ways of specifying the same colour in CSS.\n\nIndigo is made from a bit of red,\
    \ no green, and lots of blue.\n\n**EXAMPLE** You can use Math functions with rgb()\
    \ to generate random colours.\n\nThe value of each colour component is randomly\
    \ generated — there are 256 possible values for each and the smallest is 0.\n\n\
    ```\nlet r = Math.floor(Math.random() * 256);\nlet g = Math.floor(Math.random()\
    \ * 256);\nlet b = Math.floor(Math.random() * 256);\nlet colour = \"rgb(\" + r\
    \ + \", \" + g + \", \" + b + \")\";\nlet body = document.getElementById(\"body\"\
    );\nbody.style.backgroundColor = colour;\n```\n\nThe strings are joined together\
    \ (see p.54) to create an rgb() colour value, for example \"rgb(89, 212, 8)\"\
    , which is then assigned as the background colour of the <body>.\n\nThis colour\
    \ is rgb(89, 212, 8) — it's just one of over 16 million possible outcomes.\n\n\
    <body> is given the body ID for this to work.\n\n**Yeah, I can see why they went\
    \ with rgb() and not roygibv()...**\n\nRed, green and blue are the primary colours\
    \ of light — they mix together to create other colours. Computer monitors, mobile\
    \ phone screens, etc., display images by using pixels of these 3 colours.\n\n\
    ## Input Fields and Forms\n\nWhat's that? You want to know about a cool alternative\
    \ to prompts? No problem, just fill out this form and you'll get your info-pack\
    \ in the mail within 90 days.\n\n- Understand how input fields are different to\
    \ prompts.\n- Be able to use <input>, <label> and <form> tags to mark up forms.\n\
    - Be able to use JavaScript to handle data in forms.\n\n## Input fields allow\
    \ users to enter data\n\n1) Prompts are an easy way to get user input (see p.55),\
    \ but they pop up in boxes that are separate to your web page and they can't be\
    \ styled.\n2) Input fields are another way of getting user input — they're a bit\
    \ trickier to code, but they're part of your web page and can be styled to match\
    \ it.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_69_0.png)\n\n```\nThe <input>\
    \ tag creates an input field.\nName: <input type=\"text\">\nThis makes a single-line\
    \ box that the user can type into.\n```\n\nThere are all sorts of type values\
    \ you can set for <input>. For example, radio for multiple choice options, checkbox\
    \ for yes/no inputs (see p.68), password for hidden inputs (see below), color\
    \ for a colour picker (see p.38) and date which brings up a calendar.\n\n## Use\
    \ labels for accessibility\n\nTo correctly pair-up these elements, give the <input>\
    \ tag an id and assign it to the for attribute of the <label>.\n\n1) In the example\
    \ above, the text \"Name:\" told the user what they should type into the input\
    \ field. It's best practice to mark this up using the <label> tag.\n2) This doesn't\
    \ change how things look, but it has a couple of neat benefits:\n   - In most\
    \ browsers, a user can click or tap the label to place their cursor in the input\
    \ field.\n   - Screen readers (see p.18) will read aloud the label when the input\
    \ field is used.\n\n```\n<label for=\"name\">Name:</label>\n<input type=\"text\"\
    \ id=\"name\">\n```\n\n## Forms consist of multiple input fields\n\nForms are\
    \ typically made up of a collection of input fields, labels and buttons — you'll\
    \ have seen them all over the Web, e.g. whenever you sign up or log in to a website.\n\
    \n```\n<form>\n  <label for=\"name\">Name:</label>\n  <input type=\"text\" id=\"\
    name\">\n  <br>\n  <label for=\"code\">Secret Code:</label>\n  <input type=\"\
    password\" id=\"code\">\n  <br>\n  <button type=\"button\">Enter</button>\n</form>\n\
    ```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_69_1.png)\n\nSection Eight — Advanced\
    \ JavaScript"
  mdcn: "\n## 第八节 — 高级 JavaScript\n\n## 数字与布尔值\n\n**学习目标**\n正如你所见，JavaScript 能很好地处理字符串——但它并非单项冠军，而是一门全能的编程语言，同样能处理其他数据类型。\n\
    \n- 能够使用常见的算术和比较运算符。\n- 能够使用函数在数字和字符串之间转换。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_67_0.png)\n\
    \n## 算术运算符作用于数字\n\n1) JavaScript 有单一的数字数据类型，称为 Number，它既用于整数（whole numbers）也用于小数。\n\
    2) 可以使用通常的算术运算符。\n3) 如果你需要将小数转换为整数，可以使用这些函数：\n   - Math.round() 四舍五入到最接近的整数。\n\
    \   - Math.floor() 向下取整到最接近的整数。\n\n| 运算符 | 含义 | 示例 | 输出 |\n| :--- | :--- | :---\
    \ | :--- |\n| + | 加法 | console.log(5 + 8); | 13 |\n| - | 减法 | console.log(9 -\
    \ 2); | 7 |\n| * | 乘法 | console.log(4 * 3); | 12 |\n| / | 除法 | console.log(6 /\
    \ 2); | 3 |\n\n```\nconsole.log(Math.round(5.7)); // 6\nconsole.log(Math.floor(5.7));\
    \ // 5\n```\n\n## 布尔值为真或假\n\n1) 除了字符串和数字，JavaScript 还有布尔数据类型。\n2) 布尔值只有两种可能——真（true）和假（false）。\n\
    3) 毗较运算符顾名思义——它们比较两个值，返回一个布尔结果。\n\n| 运算符 | 含义 | 示例 | 输出 |\n| :--- | :--- | :---\
    \ | :--- |\n| == | 等于 | console.log(\"A\" == \"a\") | false |\n| != | 不等于 | console.log(7\
    \ != 9) | true |\n| < | 小于 | console.log(3 < 3) | false |\n| <= | 小于或等于 | console.log(3\
    \ <= 3) | true |\n| > | 大于 | console.log(3 > 3) | false |\n| >= | 大于或等于 | console.log(3\
    \ >= 3) | true |\n\n## 字符串可以转换为数字\n\n- 由 prompt() 返回的值，或使用 .innerHTML 从元素获取的值，都是字符串。\n\
    - 如果将它们与某些运算符（如 -, *, /）一起使用，JavaScript 会自动将字符串转换为数字，但不会对 + 运算符这样做——后者会将字符串连接在一起（见第\
    \ 54 页）。\n- 如果你想进行算术运算，最好先使用例如 parseInt() 将值转换为数字。\n\n```\nlet input = prompt(\"\
    How many laps can you swim?\");\nlet oldTotal = parseInt(input);\nlet newTotal\
    \ = oldTotal + 1;\nalert(\"Pfft, I can do \" + newTotal + \"!\");\n\n// parseInt()\
    \ 将输入的字符串转换为整数。\n// 作为整数，oldTotal 可用于加法。\n```\n\n- 你也可以使用 parseFloat() 将字符串转换为小数，并且如果需要，可以在变量后添加\
    \ .toString() 将其转换回字符串，例如 newTotal.toString()。\n\n**数字是虚假的偶像——我已经皈依布尔教...**\n\
    如果字符串不是有效的数字，那么 parseInt() 和 parseFloat() 会返回一个名为 NaN（'Not a Number' 的缩写）的特殊值。任何你尝试对\
    \ NaN 进行的算术运算结果都将是 NaN。\n\n## 使用随机数\n\nLightSaltySeaweed。不，我没有再吃太多奶酪——我是在尝试命名我刚刚随机生成的颜色，所以我正在抛出词语看看哪个合适。\n\
    \n- 能够使用 JavaScript 生成随机数和随机颜色。\n\n## JavaScript 可以生成随机数...\n\n- JavaScript 有一个简单的命令来生成随机小数。\n\
    \n```\nlet randomNumber = Math.random();\nconsole.log(randomNumber);\n// 0.29304736087241623\n\
    ```\n\nMath.random() 生成一个介于 0 和 1 之间（包括 0，但不包括 1）的随机小数。\n\n- 稍加数学运算，你也可以用它来获取随机整数。\n\
    - 这个公式给出一个从 a 到 b（包括两端）范围内的随机整数，其中 a 和 b 是任意两个整数。\n\n```\nMath.floor(Math.random()\
    \ * n) + a;\n```\n\n- a 是可能的最小数字。\n- n = (b - a) + 1。这是范围内的整数总数（即可能结果的数量）。\n-\
    \ 这会向下取整，因此你最终得到一个整数。\n\n**示例** 生成一个从 1 到 5（包括 1 和 5）的整数。\n\n从 1 到 5 的范围内有 (5\
