  md: "# Functions\n\n+   Ah, functions... No, I don't mean fancy social events. I'm\
    \ talking JavaScript functions. You've used a few already, e.g. alert() and prompt(),\
    \ but here's how to make your own.\n\n- Understand what a function is and how\
    \ to define one yourself.\n- Understand how to call a function and what this does.\n\
    \n# You can create your own functions\n\nFunctions that you want to create need\
    \ to be defined somewhere in your code — this means they're given a name and some\
    \ code that performs their task.\n\nA function is a named block of code that does\
    \ a particular task.\n\n```\nA function definition starts with the word function.\n\
    function sayHello() {\n    console.log(\"Hello\");\n}\nYou need to give the function\
    \ a name, followed by round brackets, ().\nThe code inside the curly braces {}\
    \ is what the function does. Here, it just outputs \"Hello\" into the console.\n\
    ```\n\n# Functions are used by being called\n\n+   1) If you looked at the console\
    \ for the example above, you'd see nothing — this is because the function has\
    \ only been defined.\n2) To run it, you need to 'call' it.\n3) You can call a\
    \ function as many times as you want, without having to repeat its original code.\n\
    \nCalling a function is when you write its name to run its code.\n\n```\nContinuing\
    \ the example above to call the function.\nsayHello();\nconsole.log(\"Again?\"\
    );\nsayHello();\n\nHello\nAgain?\nHello\nThe console shows the output from the\
    \ function.\n```\n\n# You can use buttons to call your functions\n\n```\nJust\
    \ like alert() and prompt(), you can call your own functions with <button>s.\n\
    \n<p>Have you seen updog?</p>\n<button onclick=\"updog()\">What's updog?</button>\n\
    <script>\n    function updog() {\n        alert(\"Not much, what's up with you?\"\
    );\n    }\n</script>\n\nHave you seen updog?\nWhat's updog?\nThis page says\n\
    Not much, what's up with you?\n[OK]\n```\n\nFor the web pages in this book, we've\
    \ placed the <script> tags last in the code, just before the final </body> tag\
    \ — it doesn't matter in this example, but it'll avoid problems later on.\n\n\
    > The JavaScript police called — they want their function back...\nFunctions can\
    \ save you loads of time when developing your code — if you had to rewrite what\
    \ a function did each time you used it, your code would go on and on and on and\
    \ on and on and..."
