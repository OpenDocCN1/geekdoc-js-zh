    [了解如何样式化链接。]\n\n### alt 为 `<img>` 提供替代文本\n\n*   `alt` 属性可以添加到 `<img>` 标签中，为图片提供文本描述。\n\
    *   如果图片因任何原因无法加载，此替代文本将被显示。\n*   屏幕阅读器也会使用它——它们帮助视障人士理解图片内容。\n\n```html\n<img\
