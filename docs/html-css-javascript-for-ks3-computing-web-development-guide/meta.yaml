    \n选择一个合适的文件夹来保存你的项目。\n仅为这个网站准备的项目文件夹。\n仅为这个网站的图片准备的文件夹。\n每个网页对应一个HTML文件（'index'\
    \ 是首页）。\n根据你的设置和操作系统，你的文件夹结构可能看起来会有所不同。\n\nQ2 列出三个可以改进这个项目文件组织的地方。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_31_1.png)\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_31_2.png)\n\n### 文件夹？不，我更喜欢揉成一团...\n\
    \n随着你进行更多的网页开发，良好的文件组织会带来回报。在开发过程中保存项目的副本也是明智之举，这样如果出了什么问题，你可以回退到旧版本以恢复它。\n\n\
    ## 外部超链接\n\n超链接非常适合在网页或网站之间跳转——有点像科幻电影中的传送。别急着把我传送上去，斯科蒂，我还在写内...\n\n-   理解什么是超链接。\n\
    -   能够使用 `<a>` 标签标记指向外部网页的链接。\n\n### 超链接带你去其他地方\n\n1.   超链接（或简称“链接”）是你点击后可以从一个网页跳转到另一个网页的东西。\n\
    \n    -   内部超链接可以带你到同一网站上的其他网页（见下一页）。\n    -   外部超链接会带你到一个完全不同的网站。\n\nQ1 举出两个外部超链接使用的例子：\n\
    a) google.com\nb) wikipedia.org\n\n2.  如果没有这些不同网站之间的链接，就不会有“网络”。\n\n### 使用 `<a>`\
    \ 和 `href` 添加超链接\n\n-   `<a>` 标签在HTML中标记一个超链接。\n-   `href` 属性与 `<a>` 标签一起使用，告诉网页浏览器你希望链接指向哪里。\n\
    -   无论你把什么放在 `<a>` 和 `</a>` 标签之间，它都会在网页上变成一个可点击的链接。\n\n`<a>` 标签中的 'a' 代表 'anchor'（锚点）。\n\
    \n```\n<body style=\"font-family: Arial, sans-serif;\">\n  <p>This book has LOTS\
