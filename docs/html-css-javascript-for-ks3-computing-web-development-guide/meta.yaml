    # # Independent Challenges


    Challenge 3 onwards will require some JavaScript to get the pages working properly.
    They''re a bit trickier than the first couple of Challenges, so be sure to flick
    back through Sections 7 and 8 if you need any help.


    # ## Challenge 3 — Design a Birthday Card


    Create a web page that lets the user **design** a birthday card. The **customisable
    options** should include:


    +   - The **background colour**. Let the user choose these by inputting a colour
    name.

    - The **colour** of the **text**.

    - The **size** of the **text**. This should be **validated** so that it''s between
    **20 and 50 pixels** only.

    - The **font** (allow the user to pick from **three**).

    - How the **text** is **aligned** (left, centre, or right).

    - The **content** of the card (e.g. a "To" line, a birthday message, and a sign-off
    line).


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_84_0.png)


    These options should be **controlled** through an **input form**, with different
    **input fields** for each of the **styling properties** and **lines of text**
    within the card. Your page should show an **example** of what the card will look
    like, which **changes** when the user **applies** their choices.


    # ## Challenge 4 — Time Until


    Create a web page that **calculates** and shows **how long** there is to go (in
    months and days) until the **following events**:

    - The **new year**.

    - The user''s next **birthday** (the user should be able to enter this in).


    You should **display** these as boxes across the screen, as shown below.


    The calendar is complicated, so to simplify this challenge, you can do rough calculations
    by assuming each month has 31 days.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_84_1.png)


    You can choose the **colours** and **styles** yourself.


    Hint: consider how the calculation might differ when the user''s birthday month
    is before the current month, and when their birthday day is before the current
    day (which will also have an effect on the month).


    # ## Challenge 5 — Randomised Maths Quiz


    Create a web page to **prepare students** for the regional **mental maths quiz-off**.
    Before writing any code, you can **pick one** of + - / or * to use for the **whole
    quiz**.


    Your page should use a **form** that asks the user to set the question **difficulty**
    — the options should be, e.g. **easy** numbers (from 1 to 10), **medium** numbers
    (from 10 to 100), or **hard** numbers (from 100 to 1000).


    The page should then show a **single maths operation** that uses **random numbers**
    in the user''s **selected range** — they''ll need another **form** to enter their
    **answer**.


    If the user gets this question **right**, their **score** should **increase by
    one**, and **another question** should be shown. If the user gets a question **wrong**,
    the quiz should **end** and their **final score** should be **displayed**.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_84_2.png)


