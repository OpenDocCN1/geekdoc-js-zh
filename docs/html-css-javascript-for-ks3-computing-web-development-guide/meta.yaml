  md: "# Changing CSS Properties\n\nLearning Objectives\nOnto styling now and, yep,\
    \ you guessed it, you can also use JavaScript to change the values of CSS properties\
    \ — \"is there anything this stuff can't do?\" I hear you cry...\n- Understand\
    \ how to change the styling of a web page using JavaScript.\n- Be able to use\
    \ .style to change the CSS properties of elements.\n\n# JavaScript can change\
    \ CSS property values\n\n+   1) Changing styling works similarly to changing text\
    \ and HTML attributes.\n2) First, set an ID for the element you want to change\
    \ the style of, and use document.getElementById() to access it.\n3) Then change\
    \ the property using .style as shown below.\n\nCommon Problem: JavaScript uses\
    \ CSS properties in lowerCamelCase (see p.54), so you need to write e.g. fontFamily\
    \ instead of font-family like you would in CSS.\n\nEXAMPLE: Changing the font\
    \ colour and background colour at the press of a button.\n\n```\n<div id=\"content\"\
    >\n  <h1>Something here?</h1>\n  <img src=\"images/ftephen.png\" width=\"200\"\
    >\n  <p style=\"color: White;\">Ftephen says hi.</p>\n</div>\n<button type=\"\
    button\" onclick=\"changeColor()\">Reveal</button>\n<script>\n  function changeColor()\
    \ {\n    let content = document.getElementById(\"content\");\n    content.style.backgroundColor\
    \ = \"Black\";\n    content.style.color = \"White\";\n  }\n</script>\n```\n\n\
    Unlike previous examples, this ID is applied to a <div>, which contains three\
    \ tags.\nTwo CSS style properties have been changed: the background-color and\
    \ the color (which changes the colour of the text).\nbackground-color has been\
    \ converted into lowerCamelCase for JavaScript to understand it.\nWhen the button\
    \ is clicked, the background colour for the whole <div> changes to black, revealing\
    \ the image and the message...\n...and the font colour changes to white so the\
    \ heading can be read on a black background.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_64_0.png)\n\
    \nOriginally, the image is white with a transparent background, and the <p> tag\
    \ has been styled white, so they can't be seen on a white background.\nThe <body>\
    \ background colour is usually white to begin with, but you may need to set that\
    \ too.\n\nQ1 How would each of these CSS properties be written in JavaScript?\n\
    a) margin-right b) height c) text-align\n\nQ2 Extend the example above so that\
    \ when the button is clicked, the font family changes and more padding is added\
    \ on the left-hand side.\n\nAre skinny jeans back in style? I can't keep up with\
    \ changes...\nYou've only seen a tiny bit of JavaScript at this point, but you\
    \ can already start to make some really fancy pages by combining it with all the\
    \ HTML and CSS that you learned in earlier sections."
