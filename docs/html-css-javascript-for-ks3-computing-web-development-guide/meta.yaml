  md: "# What is the Web?\n\n> **Learning Objectives**\nDrum roll, please. It's time\
    \ for the main event. The thing you are actually going to be developing for —\
    \ the one, the only, the definitely-not-spider-infested... THE WEB.\n\n* Understand\
    \ what the Web is.\n* Learn about how web browsers work.\n* Learn about how search\
    \ engines work.\n\n# Linked web pages make the Web what it is\n\n+   1) The World\
    \ Wide Web (WWW), usually called 'the Web', is the collection of websites that\
    \ can be accessed over the Internet.\n2) Websites are made up of lots of web pages\
    \ that are connected to each other, and often to web pages on other websites too.\n\
    3) It's these connections, called hyperlinks (or just links), that give it the\
    \ structure of a web.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_7_0.png)\n\n\
    # Web browsers convert code into web pages\n\n+   * A web browser is a piece of\
    \ software used to access the web.\n* The most common web browsers include: Google\
    \ Chrome™ browser, Microsoft Edge, Mozilla Firefox and Safari web browser.\n*\
    \ When you enter a URL (see p.3) in a web browser, it will contact a web server\
    \ to request the web page you want to view.\n* The web server will send back the\
    \ web page in code form, and the web browser will convert the code into what you\
    \ see.\n* The coding language used as the foundation for web pages is HTML, but\
    \ it's often used with other languages too, like CSS and JavaScript™. You'll learn\
    \ all about these languages as you work through this book.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_7_1.png)\n\
    \n# Search engines see code as well as content\n\n+   1) Search engines keep track\
    \ of a huge number of web pages, and let you search them based on the text or\
    \ images they contain.\n2) When developing for the web, you need to think about\
    \ how your code looks to search engines if you want your web pages to be found\
    \ in search results.\n3) Search engines rank web pages based on lots of factors,\
    \ including:\n   * How relevant the content is.\n   * How many other websites\
    \ link to it.\n   * How accessible it is — e.g. fast to load, mobile-friendly.\n\
    \   * How often it's chosen in search results.\n   * How up-to-date the content\
    \ is.\n4) You can write code that helps search engines understand the content\
    \ on your web pages. For example, you can add a text description to an image to\
    \ help a search engine know what it is — see p.18 for more about this.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_7_2.png)\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_7_3.png)\n\n> **Well, well, well, if\
    \ it isn't the World Wide Web......**\nThe Web is only one part of the Internet\
    \ — they ain't the same. The Internet includes other things like email, file sharing\
    \ and online games, which aren't always accessed through a web browser.\n\nSection\
    \ One — About the Web"
  merge: -1
