  md: "# External Hyperlinks\n\nHyperlinks are great for jumping between web pages\
    \ or sites — kind of like getting teleported in a sci-fi movie. Don't beam me\
    \ up yet, Scotty, I'm still writing the intr...\n\n+   - Understand what a hyperlink\
    \ is.\n- Be able to use <a> tags to mark up links to external web pages.\n\n#\
    \ Hyperlinks take you to other places\n\n1) A hyperlink (or just 'link') is something\
    \ you can click on to take you from one web page to another.\n\n+   - An internal\
    \ hyperlink can take you to other web pages on the same website (see next page).\n\
    - An external hyperlink will take you to a different website altogether.\n\nQ1\
    \ Give two examples of how external hyperlinks are used on:\na) google.com\nb)\
    \ wikipedia.org\n\n2) There wouldn't be a 'Web' without these links between different\
    \ sites.\n\n# Use <a> and href to add hyperlinks\n\n+   - The <a> tag marks up\
    \ a hyperlink in HTML.\n- The href attribute is used with the <a> tag to tell\
    \ the web browser where you want the link to go.\n- Whatever you put between the\
    \ <a> and </a> tags will become a clickable link on the web page.\n\nThe 'a' in\
    \ the <a> tag stands for 'anchor'.\n\n```\n<body style=\"font-family: Arial, sans-serif;\"\
    >\n  <p>This book has LOTS of code files.</p>\n  <p>\n    <a href=\"https://www.cgpbooks.co.uk/biscuit\"\
    >\n      Download them here</a>.\n  </p>\n  <p>Or click this button:</p>\n  <a\
    \ href=\"https://www.cgpbooks.co.uk/biscuit\">\n    <img src=\"download.png\"\
    \ width=\"150\"></a>\n</body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_32_0.png)\n\
    \nSet the href attribute to the URL you want to link to — make sure this goes\
    \ in quotes.\n\nAdd the text that you want to be clickable — and don't forget\
    \ the closing </a> tag.\n\nTo turn an image into a hyperlink, do the same thing,\
    \ but put the image (see p.14) between the <a> and </a> tags instead.\n\nYou need\
    \ to put in the full URL into the href, including the https:// part, otherwise\
    \ this link won't work.\n\nSee p.3 for a recap on URLs.\n\nThis book has LOTS\
    \ of code files.\n\nDownload them here.\n\nOr click this button:\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_32_1.png)\n\
    \nHyperlinks are styled blue and underlined by default — clicking them takes you\
    \ to the URL.\n\nClicking this button will take you to the URL too.\n\nA button\
    \ is a graphical element a user can click to perform some action. You can find\
    \ images to use as buttons, make them yourself in a graphics program, or use the\
    \ built-in <button> tag (see p.53).\n\n# You href to check out these new tags\
    \ — they're <a>mazing...\n\nSearch engines use web crawlers to track where the\
    \ hyperlinks on pages are linking to. The more links there are to a page, the\
    \ more important the search engine may think that page is. Neat.\n\nSection Four\
    \ — Creating Multi-Page Websites"
  merge: -1
