    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_30_3.png)\n\n## 第四节 — 创建多页网站\n\n###\
    \ 组织文件\n\n在开始编码之前，让我们谈谈组织。不，我不是指整理房间，而是文件管理——这对开发多页网站很有用。\n\n-   理解合理的文件命名方式。\n\
    -   理解使用文件夹组织项目的合理方式。\n\n### 保持文件命名一致\n\n1.  有一些命名规则对网页开发者很有用：\n    -   使用描述性名称，以便一眼就能理解（例如\
    \ surfing-cat.jpg 比 image1.jpg 提供更多信息）。\n    -   使用连字符而不是空格分隔单词（例如 thy-holy-texts.html）。\n\
    \    -   将网站首页命名为 'index.html' ——这是常见做法，大多数网络服务器都知道使用它。\n2.   始终如一地遵守这些规则有助于最大限度地减少错误。\n\
    \nQ1 改进以下文件名：\na) weird dog.png\nb) asdf2.jpg (一张火车的图片)\nc) home_page.html\n\n\
