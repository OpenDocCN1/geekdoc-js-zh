    # # Section Four — Creating Multi-Page Websites


    # ## Organising Files


    Before we get coding in this section, let''s talk about organisation. No, I don''t
    mean tidying your room, I mean file management — it''s useful for developing multi-page
    sites.


    +   - Understand sensible ways to name files.

    - Understand sensible ways to organise projects with folders.


    # ### Be consistent with file naming


    1) There are a few naming rules that can be useful for web developers to follow:

    - Use descriptive names so you can understand them at a glance (e.g. surfing-cat.jpg
    tells you more than image1.jpg).

    - Use hyphens, not spaces, to separate words (e.g. thy-holy-texts.html).

    - Call the home page of your website ''index.html'' — it''s common practice and
    most web servers will know to use it.

    2) Following these rules consistently can help minimise errors.


    Q1 Improve the following file names:

    a) weird dog.png

    b) asdf2.jpg (image of a train)

    c) home_page.html


    # ### Use folders to organise projects


    +   - Over the next few pages, you''ll be linking together multiple web pages
    — it helps to keep all the files together in one project folder.

    - If you''re using lots of images, create a separate ''images'' folder inside
    the project folder to keep them in.


    EXAMPLE How a typical project folder might look.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_31_0.png)


    Pick a sensible folder to save your project in.

    A project folder just for this website.

    A folder just for this website''s images.

    An HTML file for each of the web pages (''index'' is the home page).

    Your folders may look a bit different depending on your settings and operating
    system.


    Q2 List three things that could be improved with the file organisation of this
    project.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_31_1.png)


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_31_2.png)


    # ### Folder? No, I''m more of a scruncher myself...


    As you do more web development, good file organisation will pay off. It''s also
