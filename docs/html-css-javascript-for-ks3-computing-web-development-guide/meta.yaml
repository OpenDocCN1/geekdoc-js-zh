    - An [email button](http://email button) that opens a [new email](http://new email)\
    \ to IAmReallyFamous@azmail.co.uk.\n\nAn [example website](http://example website)\
    \ and [icons](http://icons) for these buttons are available in the [downloadable\
    \ content](http://downloadable content) for this section.\n\n**SOLUTION**\n**Plan:**\
    \ Download and save the icons to an 'images' folder, then set an appropriate hyperlink\
