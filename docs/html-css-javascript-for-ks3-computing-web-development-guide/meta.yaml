  md: "# More Input Fields\n\nNow playing on HTML FM, \"Check your tags\", by Inny\
    \ Putt and the Fields. Here are a couple more input fields to play with, and two\
    \ attributes thrown in for good measure.\n\n+   - Be able to use `<input>` to\
    \ mark up radio buttons and checkboxes.\n- Be able to use the `checked` and `disabled`\
    \ HTML attributes.\n\n# A radio button is a multiple choice input field\n\nThe\
    \ radio input field lets the user make a single choice from a set of options.\n\
    \nRadio buttons are grouped together using the name attribute — only one radio\
    \ button in each group can be selected at once.\n\n```\n<p>Pineapple on pizza?</p>\n\
    <form>\n  <input type=\"radio\" name=\"pineapple\" id=\"yes\">\n  <label for=\"\
    yes\">Yes</label><br>\n  <input type=\"radio\" name=\"pineapple\" id=\"no\">\n\
    \  <label for=\"no\">No</label><br>\n  <button type=\"button\" onclick=\"vote()\"\
    >Vote</button>\n</form>\n<script>\n  ...\n</script>\n\nfunction vote() {\n  let\
    \ yes = document.getElementById(\"yes\");\n  if (yes.checked == true) {\n    alert(\"\
    Oh my!\");\n  }\n}\n```\n\nThe type of a radio button is just `radio`. It's common\
    \ in web design to put the `label` after the corresponding radio button.\n\nThe\
    \ `checked` attribute is `true` if the option is `selected`.\n\nWhen the page\
    \ first loads, neither option is `checked`.\n\nClicking on the radio button itself\
    \ or on its `label` will `select` it.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_71_0.png)\n\
    \n+   - In the HTML, an `<input>` tag for a radio button can have its `checked`\
    \ attribute set, so that it starts off checked when the page first loads.\n- You\
    \ don't write a value — its presence alone means .checked is `initially true`\
    \ in JavaScript and its absence means .checked is `initially false`.\n\n```\n\
    <input type=\"radio\" checked>\n```\n\nThis also works for checkboxes (see below).\n\
    \n# Checkboxes are also multiple choice\n\nThe checkbox input field lets the user\
    \ make one or more choices from a set of options.\n\nEach option is a pair of\
    \ `<input>` and `<label>` tags.\n\n```\n<input type=\"checkbox\" id=\"pineapple\"\
    >\n<label for=\"pineapple\">Pineapple</label>\n\nfunction vote() {\n  let voteBtn\
    \ = document.getElementById(\"vote-btn\");\n  voteBtn.disabled = true;\n}\n```\n\
    \nYou don't need to set the `name` attribute for `checkboxes`.\n\nThis script\
    \ disables the 'Vote' button after it's clicked.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_71_1.png)\n\
    \nUnlike radio buttons, multiple checkboxes can be `selected` at the same time.\n\
    \nLike `checked`, **you can set the `disabled` attribute in HTML by writing only\
    \ the attribute name in `<input>` or `<button>` tags.**\n\nYou can alter the look\
    \ of disabled elements in CSS using the :disabled pseudo-class —\ne.g. `voteBtn:disabled\
    \ { color: Red; }`\n\n# I'll be honest — I checked out at the first mention of\
    \ pizza...\n\nIn JavaScript, you can check / uncheck a radio button or checkbox\
    \ by setting the `checked` attribute to `true` / `false`. You can also enable\
    \ an element again by setting the `disabled` attribute to `false`.\n\nSection\
    \ Eight — Advanced JavaScript"
