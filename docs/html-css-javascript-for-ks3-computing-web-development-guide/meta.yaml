    \n## 第二部分 — HTML 基础\n### HTML 标签\n\nTag — 你就是“它”。而这里的“它”，我指的是那个将要学习所有构成所有网页基础的语言的人。哦，请不要鼓掌。\n\
    \n+   * 了解 HTML 代表什么以及它的用途。\n* 了解 HTML 标签和元素。\n\n### HTML 构成了你页面的基础\n\n+   1)\
    \ 一位名叫蒂姆·伯纳斯-李的英国计算机科学家在 1989 年提出了万维网的概念——网页的主要语言 HTML 不久之后也出现了。\n2) 现代网页通常使用几种不同的编程语言，但它们共同使用的语言是\
    \ HTML。\n3) HTML 描述了网页的结构。\n4) 它用于“标记”内容的主要元素——如标题、段落、图像等。\n5) 当网页被查看时，网页浏览器会使用\
    \ HTML 来设置页面。\n\nHTML 代表超文本标记语言。在 HTML 中，“标记”仅仅意味着通过添加标签来标记内容，如下例所示。\n\n### HTML\
    \ 由许多标签组成\n\n+   * HTML 标记不同元素的方式是通过标签。\n* 标签通常是成对出现的——开始标签标记元素的开始，结束标签标记元素的结束。\n\
    \n示例：以下是一段典型 HTML 代码的样子。\n\n这是一个开始标签——一个被尖括号包围的单词。\n\n这是内容——它被标签包围。\n\n这是一个结束标签。它与开始标签相同，但单词前有一个正斜杠。\n\
    \n有些标签没有结束标签，但这种情况很少见——参见第 14 页。\n\n```\n<html>\nHyperText Markup Language. Learn\
    \ this!\n</html>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_11_0.png)\n\n\
    这整个东西（包括标签和内容）被称为一个元素。\n\n你将在下一节学习如何使用 CSS 来改变内容的外观。\n\n以下是此代码在网页浏览器中打开时的样子——浏览器不会显示标签。\n\
    \nQ1 另一个 HTML 开始标签的例子是 <u>。建议其结束标签是什么。\n\n德国人喜欢 HTML——但前提是标签必须是 guten（好）的...\n\
    \n设计网页时，思考你内容的哪些部分需要被标记——你想要突出显示的关键组成部分是什么？我们将在接下来的几页中介绍如何操作。\n\n### Head 和 Body\n\
    \n我们又来了。是时候掌握将你的代码分成头部和身体了。不过我们不会涉及生物学——不需要拿起解剖刀...\n\n+   - 了解网页的标准结构。\n- 了解\
    \ <head>、<body> 和 <title> 标签的用途。\n- 了解缩进如何使代码更易阅读。\n\n### 网页具有标准结构\n\n每次制作网页时，你都应该在开始前编写一些标签。这些是除了你在上一页看到的\
    \ <html> 标签之外的附加标签。\n\n以下是一些用于设置网页标准部分的标签。\n\n本书的可下载 HTML 文件在 <head> 中都包含一行以 `<meta\
    \ name=\"viewport\"...` 开头的额外内容。它会使网页在手机和平板电脑等小屏幕上调整大小以显示得更大。你也可以使用它——这是可选的。\n\
    \n这只是告诉浏览器你正在使用 HTML——你应该在每个页面上都包含它。它没有结束标签。\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>My Wonderful Page</title>\n</head>\n<body>\n  OK, it's not that\
    \ wonderful. Yet...\n</body>\n</html>\n```\n\n<head> 包含关于网页的信息，但不包含页面本身上显示的内容。\n\
    \n<body> 包含将在页面上对用户可见的所有元素。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_12_0.png)\n\
    \n这就是 <title> 标签设置的“标题”——它是在浏览器标签页上看到的内容。因为它是在 <head> 中设置的，所以在页面本身上看不到。\n\n###\
    \ 添加空隙使代码更易阅读\n\n+   1) 行首的空格称为缩进。\n2) 当在另一个标签内使用标签时，最好进行缩进，因为它会使结构更清晰——例如，在上面的代码中，<title>\
    \ 在 <head> 内部是显而易见的。\n3) 在代码中添加额外的空格不会改变页面的外观，但它会使代码读起来更顺畅。\n\n你可以使用 Tab 键来添加缩进。\n\
    \n```\n<!DOCTYPE html><html><head>\n<title>My Wonderful Page</title></head><body>\n\
    OK, it's not that wonderful. Yet...</body></html>\n```\n\n此代码生成的网页与上面的示例相同，但没有那些漂亮的缩进和空格，它更难阅读。\n\
    \n像健美运动员一样，我们大部分的开发工作都投入到 <body> 中... 我们将在后面的章节中向 <head> 添加更多内容，但现在 <body> 是关键，因为那是用户看到的。请记住，从现在开始，在你的所有代码中都要包含标准结构。\n"
