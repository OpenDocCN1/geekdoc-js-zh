  - "[PAGE 32]\n\n# External Hyperlinks\n\nHyperlinks are great for jumping between\
    \ web pages or sites — kind of like getting teleported in a sci-fi movie. Don't\
    \ beam me up yet, Scotty, I'm still writing the intr...\n\n+   - Understand what\
    \ a hyperlink is.\n- Be able to use <a> tags to mark up links to external web\
    \ pages.\n\n# Hyperlinks take you to other places\n\n1) A hyperlink (or just 'link')\
    \ is something you can click on to take you from one web page to another.\n\n\
    +   - An internal hyperlink can take you to other web pages on the same website\
    \ (see next page).\n- An external hyperlink will take you to a different website\
    \ altogether.\n\nQ1 Give two examples of how external hyperlinks are used on:\n\
    a) google.com\nb) wikipedia.org\n\n2) There wouldn't be a 'Web' without these\
    \ links between different sites.\n\n# Use <a> and href to add hyperlinks\n\n+\
    \   - The <a> tag marks up a hyperlink in HTML.\n- The href attribute is used\
    \ with the <a> tag to tell the web browser where you want the link to go.\n- Whatever\
    \ you put between the <a> and </a> tags will become a clickable link on the web\
    \ page.\n\nThe 'a' in the <a> tag stands for 'anchor'.\n\n```\n<body style=\"\
    font-family: Arial, sans-serif;\">\n  <p>This book has LOTS of code files.</p>\n\
    \  <p>\n    <a href=\"https://www.cgpbooks.co.uk/biscuit\">\n      Download them\
    \ here</a>.\n  </p>\n  <p>Or click this button:</p>\n  <a href=\"https://www.cgpbooks.co.uk/biscuit\"\
    >\n    <img src=\"download.png\" width=\"150\"></a>\n</body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_32_0.png)\n\
    \nSet the href attribute to the URL you want to link to — make sure this goes\
    \ in quotes.\n\nAdd the text that you want to be clickable — and don't forget\
    \ the closing </a> tag.\n\nTo turn an image into a hyperlink, do the same thing,\
    \ but put the image (see p.14) between the <a> and </a> tags instead.\n\nYou need\
    \ to put in the full URL into the href, including the https:// part, otherwise\
    \ this link won't work.\n\nSee p.3 for a recap on URLs.\n\nThis book has LOTS\
    \ of code files.\n\nDownload them here.\n\nOr click this button:\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_32_1.png)\n\
    \nHyperlinks are styled blue and underlined by default — clicking them takes you\
    \ to the URL.\n\nClicking this button will take you to the URL too.\n\nA button\
    \ is a graphical element a user can click to perform some action. You can find\
    \ images to use as buttons, make them yourself in a graphics program, or use the\
    \ built-in <button> tag (see p.53).\n\n# You href to check out these new tags\
    \ — they're <a>mazing...\n\nSearch engines use web crawlers to track where the\
    \ hyperlinks on pages are linking to. The more links there are to a page, the\
    \ more important the search engine may think that page is. Neat.\n\nSection Four\
    \ — Creating Multi-Page Websites"
  - "[PAGE 33]\n\n# Internal Hyperlinks\n\nLearning Objectives\n\nSo that's external\
    \ hyperlinks covered, but what about navigating between your own web pages? Well,\
    \ well, well. If it isn't your lucky day — a whole page on internal hyperlinks.\n\
    \n+   - Be able to use <a> tags to mark up links to your own web pages.\n- Understand\
    \ why relative file paths are needed for internal hyperlinks.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_33_0.png)\n\
    \n# Internal links take you around a website\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_33_1.png)\n\
    \n+   1. Most websites are made up of multiple web pages, all joined together\
    \ by internal hyperlinks.\n2. The user can click on these links to take them to\
    \ the part of the website they need to go to.\n\nEXAMPLE Create links using <a>\
    \ tags — set the href attribute to the page you're linking to.\n\nA web page called\
    \ \"innocent-button.html\":\n\n```\n<body style=\"text-align: center;\">\n  <h3>You\
    \ found a button.</h3>\n  <p><a href=\"button-pressed.html\">Press it</a>?</p>\n\
    \  <img src=\"button.png\" width=\"100\">\n</body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_33_2.png)\n\
    \nSet the href as the file name of your other web page.\n\nClicking this link\
    \ will take you to your other web page.\n\nA web page called \"button-pressed.html\"\
    :\n\n```\n<body style=\"background-color: Red; text-align: center;\">\n  <h1 style=\"\
    font-family: Impact, sans-serif;\">Whoops</h1>\n  <p style=\"font-family: Arial,\
    \ sans-serif;\">\n    You shouldn't have<br>pressed the button.</p>\n  <img src=\"\
    button-activated.png\" width=\"150\">\n</body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_33_3.png)\n\
    \nQ1 Extend this code to include a link back to the first web page.\n\n# Use relative\
    \ file paths instead of absolute ones\n\n+   - When you add an internal link or\
    \ an image to a web page, you need to tell the web browser where it is.\n- A relative\
    \ file path says where to look starting from the folder your web page is currently\
    \ saved in.\n\n```\n<a href=\"about.html\">Learn more!</a>\n<img src=\"images/logo.jpg\"\
    >\n```\n\nThis says that 'about.html' is in the same folder as the current page\
    \ (index.html).\n\nThis says 'logo.jpg' is in the 'images' folder.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_33_4.png)\n\
    \n+   - These relative file paths will work on other computers — including web\
    \ servers.\n- Don't use an absolute file path — this is a full path, and it only\
    \ works on your computer.\n\nCOMMON PROBLEMS\n\n```\n<a href=\"C:\\Users\\CGP\\\
    Documents\\web-project-1\\about.html\">Learn more!</a>\n```\n\nLinks like this\
    \ are no good for real websites where the files are stored on a web server.\n\n\
    # I use relatives' file paths — my sister is a lot more organised...\n\nIt might\
    \ take a few tries to get your hyperlinks working. If you run into any issues,\
    \ check the files for your web pages are in the same folder, and that the file\
    \ names match up to what href is set to.\n\nSection Four — Creating Multi-Page\
    \ Websites"
- md: "## Controlling Hyperlinks\n\n> And thus the little blue hyperlinks, in all\
    \ their underlined glory, stand out and cry \"click me, click me\". And I whisper\
    \ \"no\" — for you haven't yet set all their attributes.\n\n- Be able to make\
    \ hyperlinks that open in a new tab.\n- Be able to make hyperlinks that open a\
    \ new email.\n\n## Hyperlinks can open in a new tab\n\n1) Normally, when you click\
    \ a hyperlink, it opens in the tab you're currently using.\n2) Sometimes, it can\
    \ be better to open a link in a new tab.\n3) To do this, add a target attribute\
    \ into the `<a>` tag, and set its value to _blank.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_34_0.png)\n\
    \n```\n<p><a href=\"https://www.cgpbooks.co.uk\" target=\"_blank\"> Books</a>\
    \ (opens in new tab).</p>\n```\n\nWriting this message makes your web page more\
    \ accessible.\n\n## Hyperlinks can open a new email\n\n1) Instead of linking two\
    \ web pages, hyperlinks can also be used to open a new email using email software\
    \ on your computer.\n2) This is done by using mailto: in the href attribute followed\
    \ by an email address.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_34_1.png)\n\
    \n```\n<h2>The Bad Salad Co. - Lettuce help you</h2>\n<p>So, you found another\
    \ slug in your salad...</p>\n<p>You could look for your <a href=\"https://www.gov.uk\"\
    >consumer rights</a>.</p>\n<p>Just accept <a href=\"sorry.html\" target=\"_blank\"\
    >our apology</a> (opens in a new tab).</p>\n<p>Or email us at <a href=\"mailto:DoNotCare@azmail.co.uk\"\
    >DoNotCare@azmail.co.uk</a> (waaah).</p>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_34_2.png)\n\
    \nThe address set in the href will appear in the 'To' line of the email when the\
    \ link is clicked.\n\n> target=\"_blank\" — sounds like me trying archery...\n\
    \nIt's much more accessible to show the email address as the hyperlink, so people\
    \ can still use it even if they don't have email software, or if they want to\
    \ send an email from a different device.\n\n## Practice Questions\n\n### Warm\
    \ Up\n\n- Q1 Rename this file so that it follows the naming rules on p.28: `virtualReality_coding.html`\n\
    - Q2 Which HTML tag is used for hyperlinks?\n- Q3 What is the difference between\
    \ an internal and an external hyperlink?\n- Q4 What is the `href` attribute used\
    \ for?\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_35_0.png)\n\n### Practice Questions\n\
    \n- Q1 Complete this code so it makes a hyperlink that takes you to cgpbooks.co.uk.\n\
    \n```\n<a href=\"https://www.cgpbooks.co.uk\">Click here</a>\n```\n\n- Q2 What\
    \ is the default appearance for hyperlinks in text?\n\n- Q3 Here is some code\
    \ from a web page.\n\n```\n<body style=\"border-style: dashed;\">\n  <p style=\"\
    color: HotPink;\">Congratulations! You just won a new phone!!</p>\n  <ol>\n  \
