    \ to some coding challenges too, that takes you directly to their **video solution**.\
    \ You can also find all these extras at: **cgpbooks.co.uk/biscuit**\n\nPublished\
    \ by CGP\nBased on the classic CGP style created by Richard Parsons.\nWritten\
    \ by Alex Brown.\n\nEditors: Michael Bushell, Sammy El-Bahrawy, Andy Hurst and\
    \ Chris Lindle.\nReviewers: Chris Charles, Tim Dudley and Natalie Whiting.\nWith\
    \ thanks to Shaun Harrogate and Shaun Whorton for the proofreading.\nWith thanks\
    \ to Alice Dent for the copyright research.\n\n*Google Chrome™ browser is a trademark\
    \ of Google LLC and this book is not endorsed by or affiliated with Google in\
    \ any way.*\n*Firefox is a trademark of the Mozilla Foundation in the US and other\
    \ countries.*\n*Safari web browser and MacOS operating system are trademarks of\
    \ Apple Inc., registered in the U.S. and other countries.*\n*Notepad and Microsoft\
    \ Edge and Windows are trademarks of the Microsoft group of companies.*\n*JavaScript\
    \ is a trademark of Oracle Corporation in the United States.*\n\nCOWDR31 ~ 0124\
    \ - 28651\n\nClipart from Corel®\nText, design, layout and original illustrations\
    \ © Coordination Group Publications Ltd (CGP) 2024\nAll rights reserved.\n\n0800\
    \ 1712 712 • www.cgpbooks.co.uk\n\n# What are Networks?\n\n**Learning Objectives**\n\
    \nWhat's going on behind the scenes to make web pages appear on your device? Before\
    \ you start coding, it's good to know a thing or two about how it all works.\n\
    \n- Understand what a **network** is.\n- Learn that networks can be **wired**\
    \ or **wireless**.\n- Learn about the **benefits** and **drawbacks** of networks.\n\
    \n## Networks are **connected** devices\n\n1) When you **connect** two or more\
    \ **devices**, you've got a **network**.\n2) Networks allow devices to **communicate**\
    \ with each other.\n\n## Connections can be **wired** or **wireless**\n\n- **Signals**\
    \ pass through wires using either **electricity** (e.g. copper cables) or **light**\
    \ (e.g. fibre optic cables).\n- **Signals** can also **travel wirelessly** through\
    \ the air — usually through **radio waves**.\n\n> Wi-Fi® and Bluetooth® are wireless\
    \ technologies which both use radio waves.\n\n**EXAMPLE** Three networks you may\
    \ find in everyday life.\n\n**Q1** Describe an example of a network that may exist\
    \ in a:\na) supermarket\nb) sports stadium\n\n## There are **benefits** and **drawbacks**\
    \ of networks\n\n- Three **benefits** of networks:\n1) Messages can be sent **quickly**\
    \ and **cheaply** — for example, by **email**.\n2) Some **actions** can be done\
    \ **remotely**, such as switching off all computers in a classroom.\n3) **Files**\
    \ and **devices**, like printers, can be **shared** between computers.\n\n- Three\
    \ **drawbacks** of networks:\n1) They can be **expensive** to **set up**.\n2)\
    \ They may need **regular maintenance**.\n3) If a **hacker** or **malware** enters\
    \ a network, **all** the connected devices may be affected.\n\n> **Malware** is\
    \ a computer program designed to do something nasty. E.g. deleting or modifying\
    \ files.\n\n**I thought about avoiding networks, but wi-fight the inevitable...**\
    \ Computer networks date back to the 1950s — these days, you can't get far without\
    \ interacting with one. If you've got an electronic device, someone somewhere\
    \ will be trying to connect it up."
