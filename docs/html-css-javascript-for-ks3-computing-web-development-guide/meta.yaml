    \n最初“开始”按钮是启用的。一旦点击“开始”，它就被禁用，而“停止”按钮则被启用。显示的数字每秒增加1。当点击“停止”后，显示会保持固定。\n\nQ1 为秒表设置样式，例如。\n\
