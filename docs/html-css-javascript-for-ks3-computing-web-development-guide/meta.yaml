  md: '# Changing Text


    Learning Objectives

    Showing outputs as alerts is fun, but it''s not something that real websites use
    very much. All the cool kids use JavaScript to change the content on the page
    itself.

    - Understand the purpose of document.getElementById() and .innerHTML.

    - Be able to change the text within HTML elements using JavaScript.


    # JavaScript can change parts of your web page


    If you want to change bits of content (like text) on a web page:

    1) Set an ID for the HTML element that you want to change (see p.46 for a reminder).

    2) With JavaScript, use document.getElementById() to access the element with that
    ID.

    3) Replace the content of the element using .innerHTML.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_0.png)


    EXAMPLE

    You can change text on the page based on the result of a prompt.


    This <p> tag has been given an ID, so its content can be accessed and changed
    by the script.


    A button is used here to call the function, which will change the content of the
    <p> tag.


    ```

    <p>What''s your favourite colour?</p>

    <button type="button" onclick="getUsersFavColour()">

    Reply</button>

    <p id="fav-colour">Your favourite colour is ???</p>

    <script>

    function getUsersFavColour() {

    let colour = prompt("Enter your favourite colour.");

    let text = "Your favourite colour is " + colour + ".";


    let favColour = document.getElementById("fav-colour");

    favColour.innerHTML = text;

    }

    </script>

    ```


    This is the function that will be run by clicking the button.


    A prompt gets some user input, which is put into a sentence.


    This line gives you access to the element with the ID fav-colour, and...

    ...this line replaces the content of that element with the sentence formed from
    the prompt.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_1.png)


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_2.png)


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_3.png)


    This is the paragraph that will change based on the user''s input.


    This prompt appears when the ''Reply'' button is clicked.


    The paragraph changes to show the user''s input.


    Q1 Extend this code to include another button that says "Ignore". When clicked,
    this should change the second paragraph to give a disgruntled response — you can
    come up with this yourself.


    Functions are case sensitive. .getElementByID will bring up an error because "ID"
    should be "Id".


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_4.png)


    Remember, JavaScript errors won''t appear on the web page itself — check the console
    for errors if your code isn''t working properly.


    ```

    bankStatement.innerHTML = "£1,000,000";

    ```


    Using this JavaScript feature can make your web pages way more interactive, and
    won''t rely on the user having to check the console or alerts to see what''s changed.
    And there''s more to come...


    Section Seven — JavaScript Basics'
