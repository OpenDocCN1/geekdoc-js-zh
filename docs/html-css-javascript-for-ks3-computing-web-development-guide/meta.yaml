  md: '# # Images


    # ## Check the src carefully


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_0.png)


    Sometimes, you might see an icon like this ![missing image icon](image_url) instead
    of your image. This means the browser can''t find the image at the source you''ve
    said.


    ```

    <img src="spiderr.jpg">

    ```


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_1.png)


    +   - Double check the spelling of the file name or the file format.


    +   - If you''ve put the image in a folder, like the one here, add that to the
    source too — see p.30 for more about this.


    Some common image file formats are .jpg (or .jpeg), .png and .gif


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_2.png)


    # ## Image URLs can be used as the src


    +   - If you want to use an image from someone else''s website, a quicker method
    can be to put the image URL into the src attribute.


    +   - To do this, right click on an image in a browser and select ''Copy image
    address'', then paste this into your code in quotes:


    ```

    src="https://www.cgpbooks.co.uk/[redacted]/coolpics/spider.jpg"

    ```


    +   - It can be a looong link, so don''t panic if it goes on a bit.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_3.png)


    Be careful using image URLs — if the website changes or removes the image, it
    may change or fail to load on your web page too.


    # ## You can resize your images


    +   1) The dimensions of an image means its size on your screen — it''s often
    written as width × height (e.g. 80 × 40).


    +   2) These are the number of pixels wide and tall the image is.


    +   3) A web browser will show the image at its full size by default — to resize
    your image, you can specify the width and/or height using attributes.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_4.png)


    A pixel is the smallest square of colour in an image or on a screen.


    **EXAMPLE** Using width and height to resize an image.


    ```

    <h1>An itsy-bitsy version:</h1>

    <img src="spider.jpg" width="80" height="20">

    ```


    Here it''s resized so the width is 80 pixels... and the height is 20 pixels.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_5.png)


    But altering the original width and height proportions can make the image seem
    squashed.


    ```

    <h1>A better itsy-bitsy version:</h1>

    <img src="spider.jpg" width="80">

    ```


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_6.png)


    To keep the image looking the same as the original, only set one of the attributes,
    e.g. width or height.


    > My favourite src? I''d have to say sweet chilli or BBQ...


    Sometimes it takes a few tries to get the image showing up properly, so don''t
    get put off if that happens to you. Resizing your image can also take a bit of
    trial and error, but hey ho that''s life...'
