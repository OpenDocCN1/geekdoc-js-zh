  md: '# Section Seven — JavaScript Basics


    # Getting Started


    **Learning Objectives**


    You might have done some programming in languages like Python before. JavaScript
    is another language, and it''s perfect for doing funky stuff with web pages.


    - Understand what JavaScript is and what it''s used for.

    - Learn the difference between static and dynamic web pages.

    - Be able to use the <script> tag to mark up JavaScript.

    - Be able to use JavaScript to output a message to the console.


    # JavaScript is a programming language


    +   1. A programming language lets you control a computer by giving it instructions
    to follow.

    2. As HTML and CSS only describe the structure and style of a web page, they aren''t
    programming languages.

    3. JavaScript is — it can be used to make all sorts of programs, including desktop
    apps and games.

    4. Since most web browsers can run JavaScript, it''s commonly used on the Web
    — almost all websites use it in some way.


    > You may have heard of Java™ — despite the similar name, Java™ and JavaScript
    are different programming languages.


    # JavaScript creates dynamic web pages


    +   - The web pages you''ve made so far have been mostly static.

    - Lots of real web pages are dynamic and respond to the user''s actions.

    - Using JavaScript in combination with HTML and CSS, you can add interactivity
    to create dynamic web pages of your own.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_55_0.png)


    # JavaScript runs in a web browser


    To develop with JavaScript, it''s best to use a browser that has a console — e.g.
    Microsoft Edge (Windows), the Safari web browser (macOS), or the Google Chrome
    web browser (Windows, macOS and Linux).


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    console.log("Hello, world!");

    </script>

    </body>

    </html>

    ```


    JavaScript can be written within HTML using <script> tags.

    All this HTML should be familiar, except for this one line of JavaScript inside
    the <script> tags.

    Anything within the quotes is output to the console.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_55_1.png)


    When you open this page in a browser, you''ll just see a blank page because the
    output of console.log() is shown in the ''console''.

    To see it, you need to open the console. In Chrome, right click and select ''Inspect''.

    Then click ''Console'' on this menu (you may need to click ''>>'' to see this
    option).


    **I clicked on a static web page once — it was shocking...**

    If you already know other programming languages, be careful you don''t get the
    syntax mixed up with JavaScript — keep an eye on where you''re putting your brackets,
    quotes, semicolons, etc.'
