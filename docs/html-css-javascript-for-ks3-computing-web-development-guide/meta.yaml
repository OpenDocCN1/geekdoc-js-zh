  md: "# Developing for the Web\n\nWe'll start HTML properly in Section 2. But first,\
    \ you need the right tool for the job: a text editor (or a fancier code editor,\
    \ if you wanna). Read on for recommendations.\n\n+   - Be able to **create** and\
    \ **view** a **web page**.\n- Learn about the **software** available for **writing\
    \ web pages**.\n- Learn about how websites are **put on the web**.\n\n# Writing\
    \ your first web page\n\n+   1) Unlike coding in languages like **Scratch™** or\
    \ **Python**, you don't need to download any **special software** to get started\
    \ with **web development**.\n2) All you need is a **text editor**, a **web browser**\
    \ and a dream.\n3) Your computer should have the required software already:\n\
    \    - **Windows®** comes with **Notepad** as a text editor and **Edge** as a\
    \ web browser.\n    - **macOS operating system** comes with **TextEdit** as a\
    \ text editor and **Safari** as a web browser.\n4) So why wait any longer? Create\
    \ your first **web page** following the steps below.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_8_0.png)\n\
    \n**EXAMPLE** Making your first web page in Notepad.\n\nOpen your **text editor**\
    \ and **write a message**. [Image: Notepad with \"Hello, world!\"]\n\nNow you\
    \ need to **save your file** as a web page.\n\nChoose a **sensible folder** to\
    \ save it in (e.g. **Documents**). [Image: Save As dialog]\n\nGive it a **name**\
    \ and add **html** to the **end**. [Image: Save As dialog with filename \"hello-world.html\"\
    ]\n\nMake sure to set the **type** to '**All Files**', then click '**Save**'.\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_8_1.png)\n\nRemember, you can also\
    \ find all videos at cgpbbooks.co.uk/biscuit\n\nIn **TextEdit**, change the file\
    \ format to 'Web Page (.html)' — you don't need to write the '.html' yourself.\n\
    \nA **file format** is a way that data is stored in a file. E.g. saving as a '.html'\
    \ file tells your computer that it contains text written in **code** that a **web\
    \ browser** can interpret.\n\n+   5) To **view your page**, go to the **folder**\
    \ you saved it in and **double click** on the **file** — it should open in your\
    \ **default web browser**.\n6) If you want to **make changes** to your web page,\
    \ just **open the file** again from within your **text editor** — you may need\
    \ to change the **file type** to '**All Files**' to see it.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_8_2.png)\n\
    \n# Stay organised and stay safe\n\n+   - You'll need to save **lots of code files**\
    \ to try all the code in this book, so it's a good idea to **keep them organised**.\
    \ Making a **folder** for each **section** is a sensible plan.\n- Don't forget\
    \ — you can **visit the link** on the contents page to access **downloadable code\
    \ files** for all the examples, practice questions and coding challenges in this\
    \ book. They all **run** in your **web browser** and can be **edited** in your\
    \ **text editor**.\n- There's lots of code you may **find online** from **other\
    \ websites**, but be careful — it's not always **safe to use**. Don't use any\
    \ code you haven't **read and understood** first."
  merge: -1
