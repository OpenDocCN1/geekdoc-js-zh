  md: '# # Images


    Right, let''s spice things up a bit, shall we? Time to learn how to add an image
    or two to your web pages. A bit of file management is needed, but the results
    are worth it.


    +   - Be able to use the `<img>` tag to mark up images.

    - Be able to use the `src`, `width` and `height` attributes.


    # ## Use the `<img>` tag to add images


    Here''s how you use HTML to insert an image:


    +   1. Find an image you like.

    2. It''s easiest if you save it in the same folder as your web page file.

    3. Open the folder to check out the file name and file type.

    4. Now it''s time to add the code.


    If you''re grabbing an image from a website, right click on it (or control-click
    on Mac), and save it to your computer.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_17_0.png)


    You may need to adjust your folder''s ''View'' settings to see these details.


    # ### EXAMPLE


    Adding an image to a web page using `<img>` and `src`.


    ```

    <h1>Here''s my very special web crawler:</h1>


    <img src="spider.jpg">

    ```


    `src` is short for ''source'' — this is where the file for the image is located.

    The source is usually just the file name followed by its file type — make sure
    this goes in quotes.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_17_1.png)


    <img> is a rare example of a tag that doesn''t have a corresponding closing tag
    — so no </img> is needed here.


    +   5. Downloading and using images from other websites is fine for personal use,
    but make sure you have permission if you''re using them for real web pages.


    Sites like pixabay.com and unsplash.com have free images that you can use in real
    web pages.


    # ## src is an example of an attribute


    +   - `src` isn''t a tag — it''s called an attribute, and it goes inside a tag.

    - An attribute can be thought of as a setting of a tag that alters what the tag
    does or shows.

    - To use an attribute, put the attribute name followed by an equals sign, and
    then the value in quotes (e.g. `src="spider.jpg"`).

    - Some tags have more than one attribute, e.g. `<img>` can also have `width` and
    `height` attributes — see next page.

    - Remember, this all needs to be put inside the `<img>` tag, before the last angled
    bracket, `>`.


    You said no spiders!


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_17_2.png)


    Section Two — HTML Foundations'
