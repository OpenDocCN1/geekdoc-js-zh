    Or click this button:\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_32_1.png)\n\n\
    超链接默认样式为蓝色并带有下划线——点击它们会带你到指定的URL。\n\n点击此按钮也会带你到指定的URL。\n\n按钮是用户可以点击以执行某些操作的图形元素。你可以找到用作按钮的图像，在图形程序中自己制作，或使用内置的\
    \ `<a>` 标签（见第53页）。\n\n### 你需要检查一下这些新标签——它们是 `<a>` 级棒的...\n\n搜索引擎使用网络爬虫来跟踪页面上超链接指向的位置。指向一个页面的链接越多，搜索引擎可能认为该页面越重要。真棒。\n\
    \n第四节 — 创建多页网站\n\n## 内部超链接\n\n学习目标\n\n外部超链接已介绍完毕，但如何在你自己的网页之间导航呢？哎呀，如果你幸运的话——这整整一页都是关于内部超链接的。\n\
    \n-   能够使用 `<a>` 标记指向自己网页的链接。\n-   理解为什么内部超链接需要相对文件路径。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_33_0.png)\n\
    \n### 内部链接带你逛网站\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_33_1.png)\n\n1.  \
    \ 大多数网站由多个网页组成，所有这些网页都通过内部超链接连接在一起。\n2.   用户可以点击这些链接，跳转到他们需要访问的网站部分。\n\n示例 使用\
    \ `<a>` 标签创建链接——将 href 属性设置为你要链接到的页面。\n\n一个名为 \"innocent-button.html\" 的网页：\n\n\
    ```\n<body style=\"text-align: center;\">\n  <h3>You found a button.</h3>\n  <p><a\
    \ href=\"button-pressed.html\">Press it</a>?</p>\n  <img src=\"button.png\" width=\"\
    100\">\n</body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_33_2.png)\n\n\
    将 href 设置为另一个网页的文件名。\n\n点击此链接将带你到另一个网页。\n\n一个名为 \"button-pressed.html\" 的网页：\n\
    \n```\n<body style=\"background-color: Red; text-align: center;\">\n  <h1 style=\"\
    font-family: Impact, sans-serif;\">Whoops</h1>\n  <p style=\"font-family: Arial,\
    \ sans-serif;\">\n    You shouldn't have<br>pressed the button.</p>\n  <img src=\"\
    button-activated.png\" width=\"150\">\n</body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_33_3.png)\n\
    \nQ1 扩展此代码，添加一个返回第一个网页的链接。\n\n### 使用相对文件路径而不是绝对路径\n\n-   当你向网页添加内部链接或图像时，你需要告诉网页浏览器它在哪里。\n\
    -   相对文件路径说明从当前网页所在的文件夹开始查找。\n\n```\n<a href=\"about.html\">Learn more!</a>\n\
    <img src=\"images/logo.jpg\">\n```\n\n这意味着 'about.html' 与当前页面（index.html）在同一文件夹中。\n\
    \n这意味着 'logo.jpg' 在 'images' 文件夹中。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_33_4.png)\n\
    \n-   这些相对文件路径在其他计算机上——包括网络服务器上——也能正常工作。\n-   不要使用绝对文件路径——这是完整的路径，它只在你的计算机上有效。\n\
    \n常见问题\n\n```\n<a href=\"C:\\Users\\CGP\\Documents\\web-project-1\\about.html\"\
    >Learn more!</a>\n```\n\n这样的链接对于文件存储在网络服务器上的真实网站来说是没用的。\n\n### 我使用亲戚的文件路径——我姐姐组织性更强...\n\
    \n可能需要尝试几次才能让超链接正常工作。如果遇到任何问题，请检查你的网页文件是否在同一文件夹中，以及文件名是否与 href 设置的内容匹配。\n\n第四节\
    \ — 创建多页网站\n"
