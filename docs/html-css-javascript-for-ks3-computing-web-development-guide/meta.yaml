    \ in the downloadable content for the full set of styles.\n\nQ2 E.g. use a boolean\
    \ variable to keep track of when the timer has started, and use the onclick event\
    \ of a single 'Start/Stop' button to call a function like the one below.\n\n```\n\
    let hasStarted = false;\n\nfunction startStop() {\n    if (hasStarted == false)\
    \ {\n        startWatch();\n    } else {\n        stopWatch();\n    }\n}\n```\n\
    \nQ2 a)\nlet now = new Date();\nconsole.log(\"Stardate \" + now.getFullYear()\
    \ + \".\");\n\nb)\nlet now = new Date();\nlet time = now.getHours() + \":\" +\
    \ now.getMinutes();\nconsole.log(\"Alien contact established at \" + time);\n\n\
    Q3 a) The code starts a timer that calls the function doSomething() every 5 seconds.\n\
    b) The timer would continue to call doSomething() every 5 seconds until the web\
    \ page was closed.\n\n# Page 77 — Coding Challenges\n\nHead to cgpbooks.co.uk/biscuit\
    \ to download example code for each challenge.\n\n# Section Nine — Longer Challenges\n\
    \nHead to cgpbooks.co.uk/biscuit to download example code for each challenge.\n\
    \nAnswers"
