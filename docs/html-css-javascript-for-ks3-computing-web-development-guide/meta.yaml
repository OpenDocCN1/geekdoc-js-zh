    \ to get the stopwatch to work.\n\nThese variables will be needed later — they're\
    \ set here so they're available to use in any of the functions below.\n\n```\n\
    let timer = 0;\nlet seconds = 0;\n\nlet secondsDisplay = document.getElementById(\"\
    seconds-display\");\nlet startButton = document.getElementById(\"start-button\"\
    );\nlet stopButton = document.getElementById(\"stop-button\");\n```\n\nThis variable\
    \ will keep track of how many seconds have gone by after the timer has started.\n\
    \nThe main purpose of `startWatch()` is to create and start a timer — it's run\
    \ when the 'Start' button is clicked.\n\n```\nfunction startWatch() {\n    timer\
    \ = setInterval(updateWatch, 1000);\n    \n    startButton.disabled = true;\n\
    \    stopButton.disabled = false;\n}\n```\n\nA timer is set up to call `updateWatch()`\
    \ once every second (1000 milliseconds).\n\nThe 'Start' button is disabled. The\
    \ 'Stop' button is enabled.\n\n`stopWatch()` stops the timer when the 'Stop' button\
    \ is clicked.\n\n```\nfunction stopWatch() {\n    clearInterval(timer);\n    \n\
    \    startButton.disabled = false;\n    stopButton.disabled = true;\n}\n```\n\n\
    The stored timer is stopped.\n\nAlternating which button is disabled ensures that\
    \ the user can't call the functions in the wrong order.\n\nThe 'Start' button\
    \ is enabled. The 'Stop' button is disabled.\n\nOnce the stopwatch has been started,\
    \ `updateWatch()` will be called every second — it's responsible for keeping count\
    \ and updating the display.\n\n```\nfunction updateWatch() {\n    seconds = seconds\
    \ + 1;\n    secondsDisplay.innerHTML = seconds + \" s\";\n}\n```\n\nThe second\
    \ counter is increased by 1 and the display is updated.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_78_0.png)\n\
    \nInitially the 'Start' button is enabled. As soon as 'Start' is clicked, it's\
