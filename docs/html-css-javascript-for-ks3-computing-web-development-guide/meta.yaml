    \ href=\"https://www.cgpbooks.co.uk/biscuit\">\n    <img src=\"download.png\"\
    \ width=\"150\"></a>\n</body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_32_0.png)\n\
    \n将 href 属性设置为你想要链接到的URL——确保用引号括起来。\n\n添加你希望可点击的文本——别忘了闭合的 `</a>` 标签。\n\n要将图像变成超链接，做同样的事情，但将图像（见第14页）放在\
    \ `<a>` 和 `</a>` 标签之间。\n\n你需要将完整的URL放入 href 中，包括 `https://` 部分，否则此链接将不起作用。\n\n\
