  - "[PAGE 73]\n\n# Responding to Events\n\n+   ### Learning Objectives\n* Dear reader,\
    \ you're invited to learn more about making dynamic web pages.\n* Kindly RSVP:\
    \ ⊙ I'd love to know more. ○ No ta — this is where I bail out.\n* Learn what events\
    \ are and how they can be used.\n* Be able to use mouse events like onclick, onmouseover\
    \ and onmouseout.\n* Be able to use the oninput event to respond to changing input\
    \ fields.\n\n# User actions can trigger events\n\n+   * onclick is an example\
    \ of an event — the user clicks something and you can write code to respond to\
    \ it.\n* You've only used it with <button> tags up to now, but it actually works\
    \ with any HTML element.\n\nAn event is something that happens when a user is\
    \ interacting with a web page.\n\nSee p.60 for a recap on changing HTML attributes.\n\
    \nWhen the image of the unlit bulb is clicked, the picture is changed to an image\
    \ of a lit bulb.\n\n```\n<img src=\"bulb-off.jpg\" id=\"bulb-img\" onclick=\"\
    turnOn()\">\n<script>\n    function turnOn() {\n        let bulbImg = document.getElementById(\"\
    bulb-img\");\n        bulbImg.src = \"images/bulb-on.jpg\";\n    }\n</script>\n\
    ```\n\nQ1 Modify this example so that the light bulb alternates between on and\
    \ off if the user continues to click the image.\n\nHint: use a Boolean variable\
    \ to keep track of whether the bulb is on or off, and a selection statement to\
    \ decide what to do when the button is clicked.\n\n# There's an attribute for\
    \ every event\n\n+   1) Two other mouse events are:\n* onmouseover happens when\
    \ a user's mouse cursor moves over an element.\n* onmouseout happens when a user's\
    \ mouse cursor moves off an element.\n2) You can use these events as attributes\
    \ in most HTML elements. To respond to the event on your web page, just create\
    \ a JavaScript function and set the attribute to call it.\n\nEXAMPLE You can respond\
    \ to multiple events by setting more than one attribute.\n\n```\n<img src=\"bulb-off.jpg\"\
    \ id=\"bulb-img\" onmouseover=\"turnOn()\" onmouseout=\"turnOff()\">\n<script>\n\
    \    function turnOn() {\n        let bulbImg = document.getElementById(\"bulb-img\"\
    );\n        bulbImg.src = \"images/bulb-on.jpg\";\n    }\n    function turnOff()\
    \ {\n        let bulbImg = document.getElementById(\"bulb-img\");\n        bulbImg.src\
    \ = \"images/bulb-off.jpg\";\n    }\n</script>\n```\n\nThe onmouseover attribute\
    \ is set to call the turnOn() function.\nThe onmouseout attribute is set to call\
    \ the turnOff() function.\n\nPineapple detained. Over and out.\n\nThe image is\
    \ initially the unlit bulb when the page loads.\n\nThe image changes to the lit\
    \ bulb if the user's mouse cursor moves over it.\n\nThe image changes back to\
    \ the unlit bulb if the user's mouse cursor moves off it."
- md: "## Responding to Events\n\nChanging an input field is also an event\n\n1. Every\
    \ `<input>` element has an `oninput` event that occurs whenever the input is changed\
    \ in some way.\n2. For example, whenever a character is inserted, changed or deleted\
    \ in a text (or password) input field, the `oninput` event happens.\n3. This can\
    \ be used to update a web page live in response to a user typing.\n\nYou can use\
    \ the `oninput` attribute to give live feedback to the user.\n\nThe user must\
    \ enter a review that is no more than 20 characters in length.\n\nThis number\
    \ changes as they type to tell them how many characters they've left to use.\n\
    \nThe user is warned if they've used too many characters — shame...\n\nThe HTML:\n\
    \n```html\n<h2>20-Character Review</h2>\n<form>\n  <label for=\"review\">Review:</label>\n\
    \  <input type=\"text\" id=\"review\" oninput=\"checkInput()\">\n  <p id=\"message\"\
    >You've 20 characters left.</p>\n</form>\n<script> ... </script>\n```\n\nWhenever\
    \ the input field changes, the `checkInput()` function will be called.\nThe input\
    \ field starts off empty, so the initial text is an appropriate message.\n\nThe\
    \ JavaScript:\n\n```javascript\nfunction checkInput() {\n  let review = document.getElementById(\"\
    review\");\n  let message = document.getElementById(\"message\");\n  let charsUsed\
    \ = review.value.length;\n  if (charsUsed > 20) {\n    message.innerHTML = \"\
    You're over the 20-character limit.\";\n  } else {\n    let charsLeft = 20 - charsUsed;\n\
    \    message.innerHTML = \"You've \" + charsLeft + \" characters left.\";\n  }\n\
    }\n```\n\n`review.value` is the inputted string.\nAdding `.length` reads the length\
    \ of the string — in other words, the number of characters used.\n\nIf more than\
    \ 20 characters are used, the user is warned.\n\nIf 20 or fewer characters are\
    \ used, the number left to use is calculated and the message is updated.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_74_0.png)\n\
    \nQ2 Modify the example so that the text in the input field is red whenever the\
    \ user is over the 20 character limit.\n\nHint: the CSS color property affects\
    \ text in `<input>` fields.\n\nTake a look at the code for the colour picker (see\
    \ p.38) in the downloadable content for Section 5. It uses an input field of the\
    \ type color and updates the hex code on the page using the `oninput` event.\n\
    \nThe best advice I can give...\n\nThe `oninput` event depends on the type of\
    \ input. For radio buttons and checkboxes, it happens whenever they're checked\
    \ or unchecked. For a `color` type input, it's when a colour is picked.\n\n##\
    \ Showing and Hiding Elements\n\n> **Learning Objectives**\nYou've seen the display\
    \ property flexing its muscles already on p.49, but it's got another trick up\
    \ its sleeve — it can also make things disappear.\n* Be able to use the CSS display\
    \ property to show and hide elements.\n\n### display can make elements disappear\n\
    \nThe CSS display property changes how a web browser lays out an element.\n* `display:\
    \ block;` gives the element a box-like container — this is the default for many\
    \ elements — headings, paragraphs, `<div>`s, etc.\n* `display: none;` tells the\
    \ web browser not to display the element at all — it's simply ignored. This is\
    \ quite handy for making dynamic web pages.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_75_0.png)\n\
    \n**EXAMPLE**\nThe display property makes it easy to swap the content that's shown\
    \ on a web page.\n\nThe HTML:\n\nThe CSS:\n\n```html\n<div id=\"main\">\n  <p>Which\
    \ are better?</p>\n  <img src=\"dog-vs-cat.jpg\" height=\"200\"><br>\n  <button\
    \ type=\"button\" onclick=\"chooseDogs()\">Dogs</button>\n  or\n  <button type=\"\
    button\" onclick=\"chooseCats()\">Cats</button>\n</div>\n<div id=\"dogs\">\n \
    \ <p>You know it.</p>\n  <img src=\"dog.jpg\" height=\"200\">\n</div>\n<div id=\"\
    cats\">\n  <p>Ah, someone of culture.</p>\n  <img src=\"cat.jpg\" height=\"200\"\
    >\n</div>\n```\n\n> There are three `<div>`s on this page but only one will be\
    \ seen at a time.\n\nEach `<div>` has an ID so that they can be individually styled\
    \ and modified by the script.\n`display: none;` in the CSS causes both the 'dogs'\
    \ and 'cats' `<div>`s to be initially unseen on the web page.\n\n```css\n#dogs\
    \ {\n  display: none;\n}\n#cats {\n  display: none;\n}\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_75_1.png)\n\
    \nThe JavaScript:\n\nThese variables are set at the top of the script so both\
    \ functions can use them.\n\n```javascript\nlet main = document.getElementById(\"\
    main\");\nlet dogs = document.getElementById(\"dogs\");\nlet cats = document.getElementById(\"\
    cats\");\n\nfunction chooseDogs() {\n  dogs.style.display = \"block\";\n  main.style.display\
    \ = \"none\";\n}\n\nfunction chooseCats() {\n  cats.style.display = \"block\"\
    ;\n  main.style.display = \"none\";\n}\n```\n\nWhen the page first loads, only\
    \ the 'main' `<div>` is seen.\nWhen either button is clicked, the page dynamically\
    \ changes to show the corresponding `<div>`'s content.\n\nSetting display to block\
    \ means the content is shown and setting it to none means it isn't shown.\n\n\
    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_75_2.png)\n\n> Q1 Add a 'Choose again'\
    \ button to both the 'cats' and 'dogs' `<div>`s that can be used to reset the\
    \ web page.\n\n> If only `display: none;` could make my homework disappear...\n\
    There are all sorts of techniques for creating dynamically changing pages, and\
    \ often different ways to get the same results. There isn't always a right or\
    \ wrong way — if it works, it works.\n\nSection Eight — Advanced JavaScript\n\n\
    ## Date and Time\n\n**Learning Objectives**\nI'll make this quick, as I've a date\
    \ with a bowl of ice cream — JavaScript has functions that tell you the current\
    \ date and time.\n- Be able to use `Date()` to get the current date and time.\n\
    \n### Date() tells you the current date...\n\n1. Usually, you won't know exactly\
    \ when your code will be used.\n2. JavaScript has functions to get the current\
    \ date — you can use these on your website, so it'll always be up to date for\
    \ any user who visits it.\n\nDon't forget to include `new Date()`.\n\n```javascript\n\
    let now = new Date();\nconsole.log(now.getMonth() + 1); // 7\n```\n\nThe 'current\
    \ date' is the date when the code is run, not when it's written.\nThis stores\
    \ information about the current date in the variable `now`.\nThe date info is\
    \ retrieved using functions like `getMonth()`.\n`getMonth()` gives January as\
    \ 0, February as 1, etc. So you need to add 1 to get the usual calendar number\
    \ — e.g. 7, if you ran this code in July.\n\n3. There are other useful date functions:\n\
    \    - `getDay()` tells you the day of the week as a number from 0 to 6. (0 =\
    \ Sunday, 1 = Monday, 2 = Tuesday, etc.)\n    - `getDate()` tells you the day\
    \ of the month as a number from 1 to 31.\n    - `getFullYear()` tells you the\
    \ year as a four-digit number.\n\nQ1\nCreate a web page that displays the current\
    \ date in the form day/month/year, e.g. 14/5/2089.\n\n### ...and the current time\
    \ too\n\n- It's not just the calendar date that's available from `Date()` — it\
    \ also includes the current time.\n\n```html\n<p>The time is <b id=\"time\"></b>.</p>\n\
    <script>\nlet now = new Date();\nlet time = document.getElementById(\"time\");\n\
    time.innerHTML = now.getHours() + \":\" + now.getMinutes();\n</script>\n```\n\n\
    Time is given in the 24-hour clock.\nRemember, this code isn't inside a function,\
    \ so it will run immediately when the web page is viewed.\nThis `<b>` tag is left\
    \ empty — the script will fill it in.\n`Date()` captures the time at the moment\
    \ this line of code is run on the web page.\n\nThe time is 13:25.\n`getHours()`\
    \ tells you the hour in the 24-hour clock (0-23).\n`getMinutes()` tells you the\
    \ number of minutes past the hour (0-59).\n\n- You can also use `getSeconds()`\
    \ to get the number of seconds past the minute.\n\nQ2\nCreate a web page that\
    \ changes to a spooky theme during 'witching hour' (00:00-00:59 in the 24-hour\
    \ clock) — e.g. by changing colour and displaying a creepy image.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_76_0.png)\n\
    \n### It must be ditching hour — that bowl of ice cream stood me up...\n\nWhen\
    \ you use `new Date()` inside a function, the time info isn't stored until the\
    \ function is actually run and gets to that line of code. If the function is called\
    \ again, the time is updated.\n\n## Timing Code\n\n**Learning Objectives**\nGood\
    \ timing isn't just for comedy, many programs need it too — from stopwatches to\
    \ games. Here's the stopwatch. The games are your final challenge in Section 9.\n\
    * Be able to use `setInterval()` to start a timer and `clearInterval()` to stop\
    \ a timer.\n* Be able to use `Date()` to calculate time differences.\n\n### setInterval()\
    \ starts a timer\n\n1. You've seen how to respond to events that happen based\
    \ on user actions (p.70-71), but sometimes you want something to happen at a certain\
    \ time.\n2. The `setInterval()` function can be used to start a timer which waits\
    \ a given amount of time (in milliseconds) before calling another function.\n\
    3. The timer will call the function repeatedly — waiting the same amount of time\
    \ between each call.\n4. This continues forever until the `clearInterval()` function\
    \ is used to stop the timer (or until the user closes the web page).\n\n**KEY\
    \ TERMS**\nA millisecond is one thousandth of a second. This means that 1000 milliseconds\
    \ = 1 second, 2000 milliseconds = 2 seconds, and so on.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_77_0.png)\n\
    \n**EXAMPLE**\n`setInterval()` needs to be given a function and a time.\n* This\
    \ is the name of the function that will be called.\n* This is the time delay before\
    \ and between each function call.\n\n```javascript\nlet timer = setInterval(delayedHello,\
    \ 5000);\n\nfunction delayedHello() {\n  alert(\"Well timed!\");\n  clearInterval(timer);\n\
    }\n```\n\nStore the timer as a variable — this lets you stop the timer by calling\
    \ `clearInterval()` with the name of your variable in brackets.\n\n**GOING FURTHER**\n\
    A new timer is created every time `setInterval()` is called. You can store multiple\
    \ timers in different variables, if you want to use more than one timer on the\
    \ same web page.\n\nWhen the page is opened, you'll see nothing for 5 seconds,\
    \ then `delayedHello()` will be called and the alert will pop up.\n\nThis page\
    \ says\nWell timed!\n[OK]\n\n### A timer can be used to create a stopwatch\n\n\
    Here's how to create a simple stopwatch using a timer — starting with the HTML:\n\
    **EXAMPLE**\nThe stopwatch will have two buttons — one to start it and one to\
    \ stop it.\nThe counter will begin at 0 seconds and count up when the 'Start'\
    \ button is clicked.\n\n```html\n<div id=\"stopwatch\">\n  <div id=\"seconds-display\"\
    >0 s</div>\n  <button type=\"button\" id=\"start-button\" onclick=\"startWatch()\"\
    >Start</button>\n  <button type=\"button\" id=\"stop-button\" onclick=\"stopWatch()\"\
    \ disabled>Stop</button>\n</div>\n```\n\nThe `onclick` attribute of each button\
    \ is set to call a corresponding function.\n\nThe elements are given IDs so they\
    \ can be accessed by JavaScript (see the next page) and styled with CSS.\n\nThe\
    \ `disabled` attribute is present here (see p.68), so that the 'Stop' button can't\
    \ initially be clicked.\n\n0 s\nStart   Stop\n\n**This example is continued on\
    \ the next page...**\n\nSection Eight — Advanced JavaScript"
  mdcn: "\n## 响应事件\n\n更改输入字段也是一种事件\n\n1. 每个 `<input>` 元素都有一个 `oninput` 事件，只要输入内容以某种方式发生变化，该事件就会触发。\n\
    2. 例如，在文本（或密码）输入字段中插入、更改或删除字符时，`oninput` 事件就会发生。\n3. 这可用于根据用户的输入实时更新网页。\n\n你可以使用\
    \ `oninput` 属性向用户提供实时反馈。\n\n用户必须输入长度不超过 20 个字符的评论。\n\n此数字会随着他们的输入而变化，以告知他们剩余可用的字符数。\n\
    \n如果用户使用了过多的字符，则会收到警告——真糟糕……\n\nHTML 代码：\n\n```html\n<h2>20-Character Review</h2>\n\
    <form>\n  <label for=\"review\">Review:</label>\n  <input type=\"text\" id=\"\
    review\" oninput=\"checkInput()\">\n  <p id=\"message\">You've 20 characters left.</p>\n\
    </form>\n<script> ... </script>\n```\n\n每当输入字段发生变化时，都会调用 `checkInput()` 函数。\n\
    输入字段初始为空，因此初始文本是一条合适的提示信息。\n\nJavaScript 代码：\n\n```javascript\nfunction checkInput()\
    \ {\n  let review = document.getElementById(\"review\");\n  let message = document.getElementById(\"\
    message\");\n  let charsUsed = review.value.length;\n  if (charsUsed > 20) {\n\
    \    message.innerHTML = \"You're over the 20-character limit.\";\n  } else {\n\
    \    let charsLeft = 20 - charsUsed;\n    message.innerHTML = \"You've \" + charsLeft\
    \ + \" characters left.\";\n  }\n}\n```\n\n`review.value` 是输入的字符串。\n添加 `.length`\
    \ 会读取字符串的长度——换句话说，就是已使用的字符数。\n\n如果使用了超过 20 个字符，用户会收到警告。\n\n如果使用了 20 个或更少的字符，则会计算剩余可用的字符数并更新提示信息。\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_74_0.png)\n\nQ2 修改示例，使得当用户超过 20 个字符限制时，输入字段中的文本显示为红色。\n\
    \n提示：CSS 的 color 属性会影响 `<input>` 字段中的文本。\n\n请查看第 5 节可下载内容中的颜色选择器（参见第 38 页）的代码。它使用了一个\
    \ `color` 类型的输入字段，并使用 `oninput` 事件更新页面上的十六进制颜色代码。\n\n我能给出的最佳建议是……\n\n`oninput`\
    \ 事件取决于输入的类型。对于单选按钮和复选框，它们在被选中或取消选中时触发。对于 `color` 类型的输入，它在选取颜色时触发。\n\n## 显示和隐藏元素\n\
    \n> **学习目标**\n你已经在第 49 页见识过 `display` 属性的强大功能了，但它还有另一个诀窍——它也能让元素消失。\n* 能够使用 CSS\
    \ `display` 属性来显示和隐藏元素。\n\n### display 可以让元素消失\n\nCSS `display` 属性改变了网页浏览器布局元素的方式。\n\
    * `display: block;` 为元素提供一个类似盒子的容器——这是许多元素的默认值——标题、段落、`<div>` 等。\n* `display:\
    \ none;` 告诉网页浏览器完全不显示该元素——它会被直接忽略。这对于创建动态网页非常方便。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_75_0.png)\n\
    \n**示例**\n`display` 属性可以轻松切换网页上显示的内容。\n\nHTML 代码：\n\n```html\n<div id=\"main\"\
    >\n  <p>Which are better?</p>\n  <img src=\"dog-vs-cat.jpg\" height=\"200\"><br>\n\
    \  <button type=\"button\" onclick=\"chooseDogs()\">Dogs</button>\n  or\n  <button\
    \ type=\"button\" onclick=\"chooseCats()\">Cats</button>\n</div>\n<div id=\"dogs\"\
    >\n  <p>You know it.</p>\n  <img src=\"dog.jpg\" height=\"200\">\n</div>\n<div\
    \ id=\"cats\">\n  <p>Ah, someone of culture.</p>\n  <img src=\"cat.jpg\" height=\"\
    200\">\n</div>\n```\n\n> 这个页面上有三个 `<div>`，但一次只能看到其中一个。\n\n每个 `<div>` 都有一个 ID，以便可以单独设置样式并由脚本修改。\n\
    CSS 中的 `display: none;` 使得“dogs”和“cats”这两个 `<div>` 在网页上最初不可见。\n\n```css\n#dogs\
    \ {\n  display: none;\n}\n#cats {\n  display: none;\n}\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_75_1.png)\n\
    \nJavaScript 代码：\n\n这些变量在脚本顶部设置，以便两个函数都可以使用它们。\n\n```javascript\nlet main = document.getElementById(\"\
    main\");\nlet dogs = document.getElementById(\"dogs\");\nlet cats = document.getElementById(\"\
    cats\");\n\nfunction chooseDogs() {\n  dogs.style.display = \"block\";\n  main.style.display\
    \ = \"none\";\n}\n\nfunction chooseCats() {\n  cats.style.display = \"block\"\
    ;\n  main.style.display = \"none\";\n}\n```\n\n页面首次加载时，只显示“main” `<div>`。\n当点击任一按钮时，页面会动态变化，以显示相应\
    \ `<div>` 的内容。\n\n将 `display` 设置为 `block` 表示显示内容，设置为 `none` 表示不显示内容。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_75_2.png)\n\
    \n> Q1 在“cats”和“dogs”这两个 `<div>` 中都添加一个“重新选择”按钮，用于重置网页。\n\n> 要是 `display: none;`\
    \ 也能让我的作业消失就好了……\n有各种技术可以创建动态变化的页面，而且通常有多种方法可以实现相同的结果。没有绝对正确或错误的方式——如果有效，那就行得通。\n\
    \n第八部分 — 高级 JavaScript\n\n## 日期和时间\n\n**学习目标**\n我会快速讲完这部分，因为我和一碗冰淇淋有个约会——JavaScript\
    \ 提供了可以告诉你当前日期和时间的函数。\n- 能够使用 `Date()` 获取当前日期和时间。\n\n### Date() 告诉你当前日期……\n\n\
    1. 通常，你不会确切地知道你的代码何时会被使用。\n2. JavaScript 有获取当前日期的函数——你可以在你的网站上使用这些函数，这样无论哪个用户访问，网站都会是最新的。\n\
    \n不要忘记包含 `new Date()`。\n\n```javascript\nlet now = new Date();\nconsole.log(now.getMonth()\
    \ + 1); // 7\n```\n\n“当前日期”是代码运行时的日期，而不是编写时的日期。\n这行代码将有关当前日期的信息存储在变量 `now` 中。\n\
    日期信息通过 `getMonth()` 等函数获取。\n`getMonth()` 将一月表示为 0，二月表示为 1，以此类推。因此你需要加 1 才能得到通常的日历数字——例如，如果你在七月运行此代码，结果为\
    \ 7。\n\n3. 还有其他有用的日期函数：\n    - `getDay()` 告诉你星期几，用 0 到 6 的数字表示。（0 = 星期日，1 = 星期一，2\
    \ = 星期二，等等。）\n    - `getDate()` 告诉你一个月中的哪一天，用 1 到 31 的数字表示。\n    - `getFullYear()`\
    \ 告诉你年份，是一个四位数的数字。\n\nQ1\n创建一个网页，以 日/月/年 的格式显示当前日期，例如 14/5/2089。\n\n### ……以及当前时间\n\
    \n- `Date()` 提供的不仅是日历日期——还包括当前时间。\n\n```html\n<p>The time is <b id=\"time\"></b>.</p>\n\
    <script>\nlet now = new Date();\nlet time = document.getElementById(\"time\");\n\
    time.innerHTML = now.getHours() + \":\" + now.getMinutes();\n</script>\n```\n\n\
    时间以 24 小时制给出。\n记住，这段代码不在函数内部，因此当网页被查看时它会立即运行。\n这个 `<b>` 标签是空的——脚本将填充它。\n`Date()`\
    \ 捕获此代码在网页上运行那一刻的时间。\n\n时间是 13:25。\n`getHours()` 告诉你 24 小时制中的小时数（0-23）。\n`getMinutes()`\
    \ 告诉你当前小时过后的分钟数（0-59）。\n\n- 你也可以使用 `getSeconds()` 来获取当前分钟过后的秒数。\n\nQ2\n创建一个网页，使其在“魔幻时刻”（24\
    \ 小时制中的 00:00-00:59）切换到诡异主题——例如通过改变颜色和显示一张恐怖的图片。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_76_0.png)\n\
    \n### 一定是放我鸽子了——那碗冰淇淋居然爽约了……\n\n当你在函数内部使用 `new Date()` 时，时间信息在函数实际运行并执行到该行代码之前不会被存储。如果再次调用该函数，时间会被更新。\n\
    \n## 计时代码\n\n**学习目标**\n好的时机感不仅对喜剧很重要，许多程序也需要它——从秒表到游戏。下面是秒表。游戏是你们在第 9 部分的最终挑战。\n\
    * 能够使用 `setInterval()` 启动计时器和 `clearInterval()` 停止计时器。\n* 能够使用 `Date()` 计算时间差。\n\
    \n### setInterval() 启动一个计时器\n\n1. 你已经了解了如何响应基于用户操作发生的事件（第 70-71 页），但有时你希望某些事情在特定时间发生。\n\
    2. `setInterval()` 函数可用于启动一个计时器，该计时器在等待给定的时间（以毫秒为单位）后调用另一个函数。\n3. 该计时器将重复调用该函数——每次调用之间等待相同的时间。\n\
    4. 这将一直持续下去，直到使用 `clearInterval()` 函数停止计时器（或直到用户关闭网页）。\n\n**关键术语**\n毫秒是千分之一秒。这意味着\
    \ 1000 毫秒 = 1 秒，2000 毫秒 = 2 秒，以此类推。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_77_0.png)\n\
    \n**示例**\n`setInterval()` 需要一个函数和一个时间。\n* 这是要被调用的函数的名称。\n* 这是每次函数调用前及调用之间的时间延迟。\n\
    \n```javascript\nlet timer = setInterval(delayedHello, 5000);\n\nfunction delayedHello()\
    \ {\n  alert(\"Well timed!\");\n  clearInterval(timer);\n}\n```\n\n将计时器存储为一个变量——这允许你通过在括号中使用变量名调用\
    \ `clearInterval()` 来停止计时器。\n\n**深入探索**\n每次调用 `setInterval()` 都会创建一个新的计时器。如果你想在同一个网页上使用多个计时器，可以将它们存储在不同的变量中。\n\
    \n打开页面后，你会在 5 秒内看不到任何东西，然后 `delayedHello()` 会被调用，并弹出警告框。\n\n页面显示\nWell timed!\n\
    [OK]\n\n### 计时器可用于创建秒表\n\n下面是如何使用计时器创建一个简单的秒表——从 HTML 开始：\n**示例**\n这个秒表将有两个按钮——一个用于开始，一个用于停止。\n\
    计数器将从 0 秒开始，当点击“开始”按钮时开始计数。\n\n```html\n<div id=\"stopwatch\">\n  <div id=\"seconds-display\"\
    >0 s</div>\n  <button type=\"button\" id=\"start-button\" onclick=\"startWatch()\"\
    >Start</button>\n  <button type=\"button\" id=\"stop-button\" onclick=\"stopWatch()\"\
    \ disabled>Stop</button>\n</div>\n```\n\n每个按钮的 `onclick` 属性都设置为调用相应的函数。\n\n这些元素被赋予了\
    \ ID，以便可以通过 JavaScript 访问（见下一页）并使用 CSS 设置样式。\n\n这里存在 `disabled` 属性（参见第 68 页），以便“停止”按钮最初无法被点击。\n\
    \n0 s\n开始   停止\n\n**此示例将在下一页继续……**\n\n第八部分 — 高级 JavaScript\n"
