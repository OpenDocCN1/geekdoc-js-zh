    <script>\nlet now = new Date();\nlet date = document.getElementById(\"date\");\n\
    let dayOfMonth = now.getDate();\nlet month = now.getMonth() + 1;\nlet year = now.getFullYear();\n\
    date.innerHTML = dayOfMonth + \"/\" + month + \"/\" + year;\n</script>\n```\n\n\
