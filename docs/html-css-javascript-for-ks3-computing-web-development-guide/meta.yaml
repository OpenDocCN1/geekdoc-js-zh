  md: "# # Section Six — Advanced HTML & CSS\n\n# ## div Tags\n\n# ### Learning Objectives\n\
    \n<div> tags can help you make a fancy-pants web page with all your HTML organised\
    \ into nice neat sections — it's a win-win situation, so read on.\n\n+   * Understand\
    \ the purpose of the <div> tag.\n* Be able to use the <div> tag to mark up the\
    \ divisions of a web page.\n\n# # <div> is a container for other tags\n\n+   1)\
    \ Web pages often have a similar structure that can be broken down into smaller\
    \ pieces.\n2) These smaller pieces are called divisions — they're usually blocks\
    \ of related content.\n3) They can be marked up using <div> tags.\n4) Divisions\
    \ (or '<div>s') are useful because they:\n   * Help to keep your code more organised.\n\
    \   * Can be individually styled (see p.46).\n\n| Section |\n|---|\n| Header |\n\
    | Navigation Bar |\n| Main Content |\n| Footer |\n\nE.g. name, logo, slogan/tagline,\
    \ etc.\n\nE.g. copyright, contact info, etc.\n\nHTML also has specific tags you\
    \ could use for these divisions — e.g. <header>, <nav>, <main> and <footer>. They\
    \ can help things like search engines to understand your page. We're using <div>\
    \ tags in this section to keep things simple.\n\n# ### EXAMPLE\n\nA typical web\
    \ page with four divisions: header, navigation bar, main content and footer. This\
    \ is the header division. Each of these four divisions is marked up using <div>\
    \ tags.\n\n```\n<div style=\"background-color: Yellow; text-align: center;\">\n\
    \  <h1>Alien Watch!</h1>\n</div>\n<!-- The navigation bar division. -->\n<div\
    \ style=\"border-style: solid;\">\n  <ul>\n    <li><a href=\"#\">Home</a></li>\n\
    \    <li><a href=\"#\">Aliens</a></li>\n    <li><a href=\"#\">Evidence</a></li>\n\
    \  </ul>\n</div>\n<!-- The main content division. -->\n<div style=\"font-family:\
    \ Arial, sans-serif;\">\n  <p>I've learnt the truth.</p>\n  <p>Their secrets will\
    \ be revealed.</p>\n</div>\n<!-- The footer division. -->\n<div style=\"font-size:\
    \ 75%; text-align: center;\">\n  <p>&copy; <i>Alien Watcher</i> 2023</p>\n</div>\n\
    ```\n\nNot shown: the navigation bar is styled using the style sheet on p.41.\n\
    \nSpecial symbols can be inserted using codes like this in HTML — a web browser\
    \ will replace &copy; with © (the copyright symbol).\n\nEach division is given\
    \ its own distinct styling using inline CSS.\n\n+   5) Inline CSS has been used\
    \ to style divisions in the example above. If you want to use internal or external\
    \ CSS instead, then you need a way to style each <div> tag separately — the next\
    \ page shows you how to do this.\n\nQ1 From the code files for this section, open\
    \ the page ‘divTags-Q1.html’ in your web browser. Describe the structure of the\
    \ page in terms of the divisions you see.\n\n# ## I love how you've coded your\
    \ page — it's absolutely <div>-ine...\n\nThere's no hard and fast rules about\
    \ how <div> tags should be used. Things can be broken down even further, with\
    \ divisions inside divisions — it often depends on how things need to be styled."
  merge: -1
