  md: "# # Navigation Bars\n\n**Learning Objectives**\nThis page showcases the full\
    \ power of CSS in all its glory. But fair warning, some of the properties used\
    \ aren't covered until the next section, so don't worry if they're unfamiliar.\n\
    * Be able to use `a:hover` to style links when a mouse goes over them.\n* Be able\
    \ to create a horizontal navigation bar using CSS.\n\n# # `a:hover` is used for\
    \ mouse-over effects\n\n+   1. Changing styles when a user interacts with a page\
    \ can make it feel more engaging.\n2. `a:hover` let's you change a style when\
    \ a user moves their mouse over a link.\n\n```\na {\n  background-color: Black;\n\
    \  color: White;\n}\na:hover {\n  background-color: Yellow;\n  color: Red;\n}\n\
    ```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_44_0.png)\n\n# # Navigation bars\
    \ are just stylish lists\n\n+   * With some clever CSS, you can turn a boring\
    \ HTML list into a cool navigation bar.\n* This example uses advanced properties\
    \ (explained in Section 6), so don't worry about understanding how it all works\
    \ right now — you can just copy the style sheet shown below, then change the fonts\
    \ and colours to match your web page designs.\n\n```\nul {\n  background-color:\
    \ LimeGreen;\n  list-style-type: none;\n  margin: 0px;\n  padding: 0px;\n  overflow:\
    \ hidden;\n}\nli a {\n  text-decoration: none;\n  text-align: center;\n  padding:\
    \ 14px 20px;\n  display: block;\n  float: left;\n}\nli a:hover {\n  background-color:\
    \ Yellow;\n}\n```\n\n```\n<ul>\n  <li><a href=\"#\">Home</a></li>\n  <li><a href=\"\
    #\">Aliens</a></li>\n  <li><a href=\"#\">Evidence</a></li>\n</ul>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_44_1.png)\n\
    \n> Come join me at the Nav Bar — I'll :hover by the pool table...\nHave fun experimenting\
    \ with the navigation bar, but be aware — until you learn to use IDs in Section\
    \ 6, the styles in the example above will apply to any `<ul>` list element on\
    \ your page."
