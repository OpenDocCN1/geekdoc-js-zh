  - "[PAGE 63]\n\n# # Changing HTML Attributes\n\nSimilarly to how you can change\
    \ text with JavaScript, you can also use JavaScript to change the values of HTML\
    \ attributes — like the src attribute for images.\n\n+   - Be able to change the\
    \ attributes of HTML elements using JavaScript.\n- Be able to use selection to\
    \ determine how HTML attributes are changed.\n\n# ## JavaScript can change attribute\
    \ values\n\n1) To change an attribute value, set an ID for the element you want\
    \ to change, then use document.getElementById() to gain access to it — just like\
    \ you did when changing text on p.58.\n2) You can then assign a new value to any\
    \ attribute you want to change.\n\n```\n<img id=\"image\" src=\"images/question-mark.png\"\
    \ width=\"200\" alt=\"A green question mark\">\n\n<script>\nlet feeling = prompt(\"\
    Feeling good? 'yes' or 'no'?\");\nlet image = document.getElementById(\"image\"\
    );\n\nif (feeling.toLowerCase() == \"yes\") {\n  image.src = \"images/thumbs-up.png\"\
    ;\n  image.alt = \"A green thumbs-up\";\n}\n\nelse if (feeling.toLowerCase() ==\
    \ \"no\") {\n  image.src = \"images/thumbs-down.png\";\n  image.alt = \"A red\
    \ thumbs-down\";\n}\n</script>\n```\n\nChanging the attributes of an <img> element\
    \ based on a user's response to a prompt.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_63_0.png)\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_63_1.png)\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_63_2.png)\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_63_3.png)\n\nThe user is prompted to\
    \ input how they're feeling.\n\nInitially, the src is an image of a question mark.\
    \ This will only change if one of the conditions below is met.\n\nUse the ID to\
    \ gain access to the <img>.\n\nIf the user inputs \"yes\", the src changes to\
    \ a thumbs-up graphic...\n\n...if they input \"no\", the src changes to a thumbs-down\
    \ graphic.\n\nThe alt attributes are kept up to date too for accessibility.\n\n\
    Remember to use a relative file path to your images in the src — see p.30 for\
    \ a reminder.\n\nThis is what the user sees if they answer yes...\n...if they\
    \ answer no...\n...if they answer anything else.\n\nQ1 Extend this code to show\
    \ a thumb held horizontally if the user inputs \"ok\". Make sure you update the\
    \ prompt to show this as an option.\n\nThe <script> tags need to come after the\
    \ <img> tag in the example above, otherwise the <img> won't have loaded in when\
    \ your script tries to access it. Always putting your <script> tags before the\
    \ closing </body> tag is an easy way to avoid this problem.\n\n# ### Looks like\
    \ thumb-one's feeling good today...\n\nYou can use this JavaScript to change any\
    \ attribute you want for an HTML element. For example, you could change the width\
    \ or height attributes, or even which function onclick will call."
