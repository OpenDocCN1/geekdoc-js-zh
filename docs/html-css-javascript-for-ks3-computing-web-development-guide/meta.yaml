  md: '# Using Random Numbers


    LightSaltySeaweed. No, I''ve not eaten too much cheese again — I''m trying to
    name the colour I just randomly generated, so I''m throwing out words to see what
    sticks.


    +   • Be able to generate random numbers and random colours using JavaScript.


    # JavaScript can generate random numbers...


    +   • JavaScript has a simple command to generate a random decimal number.


    ```

    let randomNumber = Math.random();

    console.log(randomNumber);

    0.29304736087241623

    ```


    Math.random() generates a random decimal number between 0 and 1 (including 0,
    but not 1).


    +   • With a bit of maths, you can use this to get a random whole number too.

    • This formula gives a random whole number in the range from a up to b (including
    both) where a and b are any two whole numbers.


    ```

    Math.floor(Math.random() * n) + a;

    ```


    The smallest possible number.

    n = (b - a) + 1. This how many whole numbers are in the range (i.e. the number
    of possible outcomes).

    This rounds down so you end up with a whole number.


    EXAMPLE Generating a whole number from 1 to 5 (including both 1 and 5).


    There are (5 - 1) + 1 = 5 whole numbers in the range from 1 to 5.


    ```

    let oneToFive = Math.floor(Math.random() * 5) + 1;

    console.log(oneToFive);

    ```


    The smallest number in the range is 1.


    | 5 | 3 | 1 | 4 | 4 |


    The output could be any number from 1 to 5.


    Q1 Create a web page that asks the user to guess a random number from 10 to 40.
    Give an appropriate message in response to their answer.


    # ...and random colours too


    +   1) Colour names (see p.20) and hex codes (see p.38) aren''t the only way to
    choose colours in CSS. You can also choose a colour by giving separate red, green
    and blue components using rgb().

    2) The values represent how much red, green and blue (in that order) are used
    to make up the final colour — they range from 0 to 255. The bigger the number,
    the more of that colour is used.


    ```

    color: Indigo;

    color: #4B0082;

    color: rgb(75, 0, 130);

    ```


    Three ways of specifying the same colour in CSS.


    Indigo is made from a bit of red, no green, and lots of blue.


    EXAMPLE You can use Math functions with rgb() to generate random colours.


    The value of each colour component is randomly generated — there are 256 possible
    values for each and the smallest is 0.


    ```

    let r = Math.floor(Math.random() * 256);

    let g = Math.floor(Math.random() * 256);

    let b = Math.floor(Math.random() * 256);

    let colour = "rgb(" + r + ", " + g + ", " + b + ")";

    let body = document.getElementById("body");

    body.style.backgroundColor = colour;

    ```


    The strings are joined together (see p.54) to create an rgb() colour value, for
    example "rgb(89, 212, 8)", which is then assigned as the background colour of
    the <body>.


    This colour is rgb(89, 212, 8) — it''s just one of over 16 million possible outcomes.


    <body> is given the body ID for this to work.


    # Yeah, I can see why they went with rgb() and not roygibv()...


    Red, green and blue are the primary colours of light — they mix together to create
    other colours. Computer monitors, mobile phone screens, etc., display images by
    using pixels of these 3 colours.'
