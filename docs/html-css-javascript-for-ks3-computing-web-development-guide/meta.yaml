  md: '# # Independent Challenges


    # ## Challenge 6 — How Fast Can You...


    A games developer wants you to design a website with three games all about speed.
    There should be a home page and a page for each game, all linked with a navigation
    bar. The games are outlined below — you’ll need to include instructions for each
    game on its page.


    # ### How Fast Can You Click?


    In this game, the player must click a button as many times as they can in 10 seconds.


    +   - The page should show a big button that starts a visible 10 second countdown
    when clicked.

    - The number of times the user clicks the button in this time should be recorded.

    - Once the countdown ends, the number of clicks should be shown to the user, and
    the button should reset so the game can be played again.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_85_0.png)


    # ### How Fast Can You Type?


    In this game, the player must type a sentence shown on screen into an input field
    as fast as they can.


    +   - What the user types should be shown ''live'' below the input field.

    - The time from when they started typing the sentence, to when they finished typing
    the sentence correctly should be recorded.

    - This time should be displayed to the user, along with their words per minute
    (WPM) score at the end of the game.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_85_1.png)


    # ### How Fast Can You React?


    In this game, some dynamite will appear on a button after a random amount of time
    — the user has to click on it as fast as they can to defuse it.


    +   - The game should be controlled by a ''Begin'' button and a ''Reset'' button.

    - As soon as the dynamite button appears, a timer should be displayed on the screen
    (counting up in milliseconds).

    - When the user clicks on the dynamite button, the graphic should change to show
    that it has been defused, and the timer should stop to show the user''s reaction
    time.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_85_2.png)'
