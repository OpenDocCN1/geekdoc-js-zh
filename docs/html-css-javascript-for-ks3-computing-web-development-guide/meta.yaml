    \ and can be styled to match it.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_69_0.png)\n\
    \n```\nThe <input> tag creates an input field.\nName: <input type=\"text\">\n\
    This makes a single-line box that the user can type into.\n```\n\nThere are all\
    \ sorts of type values you can set for <input>. For example, radio for multiple\
    \ choice options, checkbox for yes/no inputs (see p.68), password for hidden inputs\
    \ (see below), color for a colour picker (see p.38) and date which brings up a\
    \ calendar.\n\n# Use labels for accessibility\n\nTo correctly pair-up these elements,\
    \ give the <input> tag an id and assign it to the for attribute of the <label>.\n\
    \n+   1) In the example above, the text \"Name:\" told the user what they should\
    \ type into the input field. It's best practice to mark this up using the <label>\
    \ tag.\n2) This doesn't change how things look, but it has a couple of neat benefits:\n\
    \    - In most browsers, a user can click or tap the label to place their cursor\
    \ in the input field.\n    - Screen readers (see p.18) will read aloud the label\
    \ when the input field is used.\n\n```\n<label for=\"name\">Name:</label>\n<input\
    \ type=\"text\" id=\"name\">\n```\n\n# Forms consist of multiple input fields\n\
    \nForms are typically made up of a collection of input fields, labels and buttons\
    \ — you'll have seen them all over the Web, e.g. whenever you sign up or log in\
    \ to a website.\n\n```\n<form>\n  <label for=\"name\">Name:</label>\n  <input\
    \ type=\"text\" id=\"name\">\n  <br>\n  <label for=\"code\">Secret Code:</label>\n\
    \  <input type=\"password\" id=\"code\">\n  <br>\n  <button type=\"button\">Enter</button>\n\
    </form>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_69_1.png)\n\nSection\
    \ Eight — Advanced JavaScript"
- md: "## Input Fields and Forms\n\n### Use JavaScript to read inputted values\n\n\
    1.  Working with forms in JavaScript is simple — you can use `document.getElementById()`\
    \ to access the input fields, then add `.value` to get the inputted data.\n2.\
    \  The example below extends the form from the previous page. Once completed,\
    \ the form will behave like this:\n    *   When clicked, the 'Enter' button will\
    \ call a function that handles the data in the form.\n    *   The function will\
    \ read the values of the input fields and then check if the 'Secret Code' is correct.\n\
    \    *   An alert will pop up with an appropriate message and if the 'Secret Code'\
    \ is correct, a link will be revealed.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_70_0.png)\n\
    \n**EXAMPLE** Psst... the secret code is \"1234\" but feel free to change it.\n\
    \n**Step 1** — Make the following changes to the HTML:\n*   Use the same code\
    \ for the input fields as before.\n*   Add an `<a>` tag with an id, but don't\
    \ set its `href` attribute or include any text — the user will see nothing to\
    \ begin with.\n*   Set the `onclick` attribute of the button to call a function\
    \ that will handle the data in the form.\n*   Add `<script>` tags.\n\n```\n<form>\n\
    \  <label> ... \n  <button type=\"button\" onclick=\"checkForm()\">Enter</button>\n\
    </form>\n<p><a id=\"secret-link\"></a></p>\n<script> ... </script>\n```\n\n**Step\
    \ 2** — Add the JavaScript between the `<script>` tags:\n`document.getElementById()`\
    \ is used to access the input fields and `.value` is added to get the inputted\
    \ data.\n\n```\nfunction checkForm() {\n    let name = document.getElementById(\"\
    name\").value;\n    let code = document.getElementById(\"code\").value;\n\n  \
    \  if (code == \"1234\") {\n        alert(\"Welcome, \" + name + \"! Access granted.\"\
    );\n        let secretLink = document.getElementById(\"secret-link\");\n     \
    \   secretLink.innerHTML = \"Enter secret page\";\n        secretLink.href = \"\
    secret-page.html\";\n    }\n    else {\n        alert(\"Wrong code, \" + name\
    \ + \"! Access denied.\");\n    }\n}\n```\n\n*   The inputted code is compared\
    \ to this secret code to check whether it's a match.\n*   If a correct code is\
    \ inputted, the hyperlink is changed so that it can be seen by the user and clicked\
    \ to enter the secret page.\n*   If a wrong code is inputted, the user is alerted\
    \ but the hyperlink stays empty.\n*   This isn't very secure because the \"secret\
    \ code\" is visible to anyone who inspects the source code of your web page, and\
    \ there's nothing stopping someone from visiting the secret page if they know\
    \ the URL. On a real website, the form data would be sent to a web server, which\
    \ would process it privately and keep track of which users have been granted access.\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_70_1.png)\n\n> **Q2** Modify the random\
    \ number guessing game from Q1 on p.65 to use a form with an input field, instead\
    \ of a prompt. The user should be able to continue guessing until they get the\
    \ correct number.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_70_2.png)\n\n*Pineapple\
    \ detained. Over and out.* — I was a beast on the putting field the other day\
    \ — on top form...\n\nThe `value` attribute can be set directly in your HTML —\
    \ this means the input field can be filled in already when the page loads, e.g.\
    \ `<input type=\"password\" value=\"blond007\">`.\n\n## More Input Fields\n\n\
    Now playing on HTML FM, \"Check your tags\", by Inny Putt and the Fields. Here\
    \ are a couple more input fields to play with, and two attributes thrown in for\
    \ good measure.\n\n### Learning Objectives\n\n*   Be able to use `<input>` to\
    \ mark up radio buttons and checkboxes.\n*   Be able to use the `checked` and\
    \ `disabled` HTML attributes.\n\n### A radio button is a multiple choice input\
    \ field\n\nThe radio input field lets the user make a single choice from a set\
    \ of options.\n\nRadio buttons are grouped together using the `name` attribute\
    \ — only one radio button in each group can be selected at once.\n\n```\n<p>Pineapple\
    \ on pizza?</p>\n<form>\n  <input type=\"radio\" name=\"pineapple\" id=\"yes\"\
    >\n  <label for=\"yes\">Yes</label><br>\n  <input type=\"radio\" name=\"pineapple\"\
    \ id=\"no\">\n  <label for=\"no\">No</label><br>\n  <button type=\"button\" onclick=\"\
    vote()\">Vote</button>\n</form>\n<script>\n  ...\n</script>\n\nfunction vote()\
    \ {\n  let yes = document.getElementById(\"yes\");\n  if (yes.checked == true)\
    \ {\n    alert(\"Oh my!\");\n  }\n}\n```\n\n*   The `type` of a radio button is\
    \ just `radio`. It's common in web design to put the `label` after the corresponding\
    \ radio button.\n*   The `checked` attribute is `true` if the option is `selected`.\n\
    *   When the page first loads, neither option is `checked`.\n*   Clicking on the\
    \ radio button itself or on its `label` will `select` it.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_71_0.png)\n\
    \n*   In the HTML, an `<input>` tag for a radio button can have its `checked`\
    \ attribute set, so that it starts off checked when the page first loads.\n* \
    \  You don't write a value — its presence alone means `.checked` is `initially\
    \ true` in JavaScript and its absence means `.checked` is `initially false`.\n\
    \n```\n<input type=\"radio\" checked>\n```\n\nThis also works for checkboxes (see\
    \ below).\n\n### Checkboxes are also multiple choice\n\nThe checkbox input field\
    \ lets the user make one or more choices from a set of options.\n\nEach option\
    \ is a pair of `<input>` and `<label>` tags.\n\n```\n<input type=\"checkbox\"\
    \ id=\"pineapple\">\n<label for=\"pineapple\">Pineapple</label>\n\nfunction vote()\
    \ {\n  let voteBtn = document.getElementById(\"vote-btn\");\n  voteBtn.disabled\
    \ = true;\n}\n```\n\n*   You don't need to set the `name` attribute for `checkboxes`.\n\
    *   This script disables the 'Vote' button after it's clicked.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_71_1.png)\n\
    \n*   Unlike radio buttons, multiple checkboxes can be `selected` at the same\
    \ time.\n*   Like `checked`, **you can set the `disabled` attribute in HTML by\
    \ writing only the attribute name in `<input>` or `<button>` tags.**\n*   You\
    \ can alter the look of disabled elements in CSS using the `:disabled` pseudo-class\
    \ — e.g. `voteBtn:disabled { color: Red; }`\n\n### I'll be honest — I checked\
    \ out at the first mention of pizza...\n\nIn JavaScript, you can check / uncheck\
    \ a radio button or checkbox by setting the `checked` attribute to `true` / `false`.\
    \ You can also enable an element again by setting the `disabled` attribute to\
    \ `false`.\n\n## Section Eight — Advanced JavaScript\n\n## Practice Questions\n\
    \n### Warm-Up\n\n*   **Q1** List four arithmetic operators used in JavaScript.\n\
    *   **Q2** Which function rounds a decimal number to the nearest integer?\n* \
    \  **Q3** What are the possible values of the variable `number` in the code below?\n\
    \n```\nlet number = Math.floor(Math.random() * 13) + 7\n```\n\n*   **Q4** What\
    \ are the three colour components of an `rgb()` colour code?\n*   **Q5** True\
    \ or false? The `id` attribute of a `<label>` tag is used to pair it up to an\
    \ input field.\n*   **Q6** Which HTML attribute can be used to: a) check a radio\
    \ button? b) disable a button?\n\n### Practice Questions\n\n*   **Q1** The code\
    \ on the right is meant to calculate the sum of two numbers entered by the user,\
    \ but it doesn't work. Describe how the code could be fixed.\n\n```\nlet num1\
    \ = prompt(\"Enter a number: \");\nlet num2 = prompt(\"Enter another: \");\nalert(\"\
    sum = \" + num1 + num2);\n```\n\n*   **Q2** Complete the code below so that it\
    \ randomly generates a colour that's within the range of the spectrum shown to\
    \ the right.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_72_0.png)\n\n```\nlet\
    \ r = Math.floor(Math.random() * _________) + _________;\nlet colour = \"rgb(\"\
    \ + ______ + \", 209, ______________)\";\n```\n\n*   **Q3** a) Complete the code\
    \ below so that it creates the web page shown.\n\n```\n<______________>\n  <label\
    \ for=\"______________\">What's your favourite sport?</label>\n  <______________\
    \ ______________=\"text\" id=\"sport\">\n  <button type=\"button\" onclick=\"\
    checkForm()\">______________</button>\n</______________>\n```\n\n*   b) Complete\
    \ the line of code below so that `sportText` is set to the text inside the input\
    \ field.\n\n```\nlet sportText =\n```\n\n*   **Q4** In what situation might you\
    \ use checkboxes rather than radio buttons?\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_72_1.png)\n\
    \n## Responding to Events\n\n### Learning Objectives\n\n*   Dear reader, you're\
    \ invited to learn more about making dynamic web pages.\n*   Kindly RSVP: ⊙ I'd\
    \ love to know more. ○ No ta — this is where I bail out.\n*   Learn what events\
    \ are and how they can be used.\n*   Be able to use mouse events like `onclick`,\
    \ `onmouseover` and `onmouseout`.\n*   Be able to use the `oninput` event to respond\
    \ to changing input fields.\n\n### User actions can trigger events\n\n*   `onclick`\
    \ is an example of an event — the user clicks something and you can write code\
    \ to respond to it.\n*   You've only used it with `<button>` tags up to now, but\
    \ it actually works with any HTML element.\n\nAn event is something that happens\
    \ when a user is interacting with a web page.\n\nSee p.60 for a recap on changing\
    \ HTML attributes.\n\nWhen the image of the unlit bulb is clicked, the picture\
    \ is changed to an image of a lit bulb.\n\n```\n<img src=\"bulb-off.jpg\" id=\"\
    bulb-img\" onclick=\"turnOn()\">\n<script>\n    function turnOn() {\n        let\
    \ bulbImg = document.getElementById(\"bulb-img\");\n        bulbImg.src = \"images/bulb-on.jpg\"\
    ;\n    }\n</script>\n```\n\n**Q1** Modify this example so that the light bulb\
    \ alternates between on and off if the user continues to click the image.\n\n\
    *Hint: use a Boolean variable to keep track of whether the bulb is on or off,\
    \ and a selection statement to decide what to do when the button is clicked.*\n\
    \n### There's an attribute for every event\n\n1.  Two other mouse events are:\n\
    \    *   `onmouseover` happens when a user's mouse cursor moves over an element.\n\
    \    *   `onmouseout` happens when a user's mouse cursor moves off an element.\n\
    2.  You can use these events as attributes in most HTML elements. To respond to\
    \ the event on your web page, just create a JavaScript function and set the attribute\
    \ to call it.\n\n**EXAMPLE** You can respond to multiple events by setting more\
    \ than one attribute.\n\n```\n<img src=\"bulb-off.jpg\" id=\"bulb-img\" onmouseover=\"\
    turnOn()\" onmouseout=\"turnOff()\">\n<script>\n    function turnOn() {\n    \
    \    let bulbImg = document.getElementById(\"bulb-img\");\n        bulbImg.src\
    \ = \"images/bulb-on.jpg\";\n    }\n    function turnOff() {\n        let bulbImg\
    \ = document.getElementById(\"bulb-img\");\n        bulbImg.src = \"images/bulb-off.jpg\"\
    ;\n    }\n</script>\n```\n\n*   The `onmouseover` attribute is set to call the\
    \ `turnOn()` function.\n*   The `onmouseout` attribute is set to call the `turnOff()`\
    \ function.\n\n*Pineapple detained. Over and out.*\n\n*   The image is initially\
    \ the unlit bulb when the page loads.\n*   The image changes to the lit bulb if\
    \ the user's mouse cursor moves over it.\n*   The image changes back to the unlit\
    \ bulb if the user's mouse cursor moves off it."
  mdcn: "\n## 输入框与表单\n\n### 使用JavaScript读取输入值\n\n1.  在JavaScript中处理表单很简单——你可以使用`document.getElementById()`来访问输入框，然后添加`.value`来获取输入的数据。\n\
    2.  下面的例子扩展了上一页的表单。完成后，表单将这样运行：\n    *   当点击“Enter”按钮时，它会调用一个处理表单数据的函数。\n    *\
    \   该函数将读取输入框的值，然后检查“Secret Code”是否正确。\n    *   将弹出一个提示框，显示相应消息；如果“Secret Code”正确，一个链接将被显示出来。\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_70_0.png)\n\n**示例** 嘘...秘密代码是\"1234\"\
    ，但你可以随意更改。\n\n**步骤1** —— 对HTML进行以下更改：\n*   使用与之前相同的代码来创建输入框。\n*   添加一个带有id的`<a>`标签，但不要设置其`href`属性或包含任何文本——用户一开始将看不到任何东西。\n\
    *   将按钮的`onclick`属性设置为调用一个处理表单数据的函数。\n*   添加`<script>`标签。\n\n```\n<form>\n  <label>\
    \ ... \n  <button type=\"button\" onclick=\"checkForm()\">Enter</button>\n</form>\n\
    <p><a id=\"secret-link\"></a></p>\n<script> ... </script>\n```\n\n**步骤2** —— 在`<script>`标签之间添加JavaScript代码：\n\
    使用`document.getElementById()`来访问输入框，并添加`.value`来获取输入的数据。\n\n```\nfunction checkForm()\
    \ {\n    let name = document.getElementById(\"name\").value;\n    let code = document.getElementById(\"\
    code\").value;\n\n    if (code == \"1234\") {\n        alert(\"Welcome, \" + name\
    \ + \"! Access granted.\");\n        let secretLink = document.getElementById(\"\
    secret-link\");\n        secretLink.innerHTML = \"Enter secret page\";\n     \
    \   secretLink.href = \"secret-page.html\";\n    }\n    else {\n        alert(\"\
    Wrong code, \" + name + \"! Access denied.\");\n    }\n}\n```\n\n*   将输入的代码与这个秘密代码进行比较，以检查是否匹配。\n\
    *   如果输入了正确的代码，超链接将被更改，以便用户可以看到并点击进入秘密页面。\n*   如果输入了错误的代码，用户会收到警报，但超链接保持为空。\n\
    *   这并不十分安全，因为“秘密代码”对任何查看你网页源代码的人来说都是可见的，而且如果有人知道URL，就没有什么能阻止他们访问秘密页面。在真实的网站上，表单数据会被发送到一个网络服务器，该服务器会私下处理数据并跟踪哪些用户被授予了访问权限。\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_70_1.png)\n\n> **Q2** 修改第65页Q1中的随机数猜谜游戏，使用带有输入框的表单代替提示框。用户应该能够持续猜测，直到猜中正确的数字。\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_70_2.png)\n\n*菠萝被扣留。完毕。* —— 我那天在推杆场上威风凛凛——状态极佳...\n\
    \n`value`属性可以直接在你的HTML中设置——这意味着输入框在页面加载时就已经被填充了，例如 `<input type=\"password\" value=\"\
    blond007\">`。\n\n## 更多输入字段\n\n现在收听HTML FM频道，播放由Inny Putt and the Fields演唱的“检查你的标签”。这里还有几个输入字段供你玩味，外加两个属性作为额外收获。\n\
    \n### 学习目标\n\n*   能够使用`<input>`来标记单选按钮和复选框。\n*   能够使用HTML的`checked`和`disabled`属性。\n\
    \n### 单选按钮是一种多选输入字段\n\n单选输入字段允许用户从一组选项中选择一个。\n\n单选按钮使用`name`属性进行分组——每组中只能同时选择一个单选按钮。\n\
    \n```\n<p>Pineapple on pizza?</p>\n<form>\n  <input type=\"radio\" name=\"pineapple\"\
    \ id=\"yes\">\n  <label for=\"yes\">Yes</label><br>\n  <input type=\"radio\" name=\"\
    pineapple\" id=\"no\">\n  <label for=\"no\">No</label><br>\n  <button type=\"\
    button\" onclick=\"vote()\">Vote</button>\n</form>\n<script>\n  ...\n</script>\n\
    \nfunction vote() {\n  let yes = document.getElementById(\"yes\");\n  if (yes.checked\
    \ == true) {\n    alert(\"Oh my!\");\n  }\n}\n```\n\n*   单选按钮的`type`就是`radio`。在网页设计中，通常将`label`放在相应的单选按钮之后。\n\
    *   如果选项被`选中`，则`checked`属性为`true`。\n*   页面首次加载时，两个选项都未被`checked`。\n*   点击单选按钮本身或其`label`都会`选中`它。\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_71_0.png)\n\n*   在HTML中，可以为单选按钮的`<input>`标签设置`checked`属性，使其在页面首次加载时就处于选中状态。\n\
    *   你不需要写一个值——它的存在本身就意味着在JavaScript中`.checked` `初始为true`，而它的缺失则意味着`.checked` `初始为false`。\n\
    \n```\n<input type=\"radio\" checked>\n```\n\n这对于复选框（见下文）同样适用。\n\n### 复选框也是多选\n\
    \n复选框输入字段允许用户从一组选项中选择一个或多个选项。\n\n每个选项都是一对`<input>`和`<label>`标签。\n\n```\n<input\
    \ type=\"checkbox\" id=\"pineapple\">\n<label for=\"pineapple\">Pineapple</label>\n\
    \nfunction vote() {\n  let voteBtn = document.getElementById(\"vote-btn\");\n\
    \  voteBtn.disabled = true;\n}\n```\n\n*   你不需要为`checkboxes`设置`name`属性。\n*   这个脚本在点击“投票”按钮后禁用它。\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_71_1.png)\n\n*   与单选按钮不同，多个复选框可以同时被`选中`。\n\
    *   和`checked`一样，**你可以在HTML中仅通过在`<input>`或`<button>`标签中写出属性名称来设置`disabled`属性。**\n\
    *   你可以在CSS中使用`:disabled`伪类来改变禁用元素的外观——例如 `voteBtn:disabled { color: Red; }`\n\
    \n### 说实话——我一听到披萨就走神了...\n\n在JavaScript中，你可以通过将`checked`属性设置为`true` / `false`来选中/取消选中一个单选按钮或复选框。你也可以通过将`disabled`属性设置为`false`来重新启用一个元素。\n\
    \n## 第八节 —— 高级JavaScript\n\n## 练习题\n\n### 热身\n\n*   **Q1** 列出JavaScript中使用的四种算术运算符。\n\
    *   **Q2** 哪个函数将小数四舍五入到最接近的整数？\n*   **Q3** 在下面的代码中，变量`number`的可能取值是什么？\n\n```\n\
    let number = Math.floor(Math.random() * 13) + 7\n```\n\n*   **Q4** `rgb()`颜色代码的三个颜色分量是什么？\n\
    *   **Q5** 判断对错：`<label>`标签的`id`属性用于将其与输入框配对。\n*   **Q6** 哪个HTML属性可以用来：a) 选中一个单选按钮？\
    \ b) 禁用一个按钮？\n\n### 练习题\n\n*   **Q1** 右边的代码旨在计算用户输入的两个数字之和，但它不起作用。描述如何修复该代码。\n\
    \n```\nlet num1 = prompt(\"Enter a number: \");\nlet num2 = prompt(\"Enter another:\
    \ \");\nalert(\"sum = \" + num1 + num2);\n```\n\n*   **Q2** 完成下面的代码，使其随机生成一个位于右侧所示光谱范围内的颜色。\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_72_0.png)\n\n```\nlet r = Math.floor(Math.random()\
    \ * _________) + _________;\nlet colour = \"rgb(\" + ______ + \", 209, ______________)\"\
    ;\n```\n\n*   **Q3** a) 完成下面的代码，使其创建所显示的网页。\n\n```\n<______________>\n  <label\
    \ for=\"______________\">What's your favourite sport?</label>\n  <______________\
    \ ______________=\"text\" id=\"sport\">\n  <button type=\"button\" onclick=\"\
    checkForm()\">______________</button>\n</______________>\n```\n\n*   b) 完成下面的代码行，以便将`sportText`设置为输入框内的文本。\n\
    \n```\nlet sportText =\n```\n\n*   **Q4** 在什么情况下你可能会使用复选框而不是单选按钮？\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_72_1.png)\n\
    \n## 响应事件\n\n### 学习目标\n\n*   亲爱的读者，你被邀请来了解更多关于制作动态网页的知识。\n*   请回复：⊙ 我想了解更多。 ○\
    \ 不了，谢谢——我到此为止。\n*   了解事件是什么以及如何使用它们。\n*   能够使用鼠标事件，如`onclick`、`onmouseover`和`onmouseout`。\n\
    *   能够使用`oninput`事件来响应输入框的变化。\n\n### 用户操作可以触发事件\n\n*   `onclick`是事件的一个例子——用户点击某个东西，你可以编写代码来响应它。\n\
    *   到目前为止，你只在`<button>`标签上使用过它，但它实际上适用于任何HTML元素。\n\n事件是用户与网页交互时发生的事情。\n\n回顾第60页关于更改HTML属性的内容。\n\
    \n当点击未点亮的灯泡图像时，图片会更改为点亮的灯泡图像。\n\n```\n<img src=\"bulb-off.jpg\" id=\"bulb-img\"\
    \ onclick=\"turnOn()\">\n<script>\n    function turnOn() {\n        let bulbImg\
    \ = document.getElementById(\"bulb-img\");\n        bulbImg.src = \"images/bulb-on.jpg\"\
    ;\n    }\n</script>\n```\n\n**Q1** 修改此示例，使用户持续点击图像时，灯泡在开和关之间交替。\n\n*提示：使用一个布尔变量来跟踪灯泡是开还是关，并使用选择语句来决定点击按钮时该做什么。*\n\
    \n### 每种事件都有对应的属性\n\n1.  另外两个鼠标事件是：\n    *   `onmouseover`发生在用户的鼠标光标移到元素上时。\n\
    \    *   `onmouseout`发生在用户的鼠标光标移出元素时。\n2.  你可以在大多数HTML元素中将这些事件用作属性。要在你的网页上响应事件，只需创建一个JavaScript函数并将属性设置为调用它即可。\n\
    \n**示例** 你可以通过设置多个属性来响应多个事件。\n\n```\n<img src=\"bulb-off.jpg\" id=\"bulb-img\"\
    \ onmouseover=\"turnOn()\" onmouseout=\"turnOff()\">\n<script>\n    function turnOn()\
    \ {\n        let bulbImg = document.getElementById(\"bulb-img\");\n        bulbImg.src\
    \ = \"images/bulb-on.jpg\";\n    }\n    function turnOff() {\n        let bulbImg\
    \ = document.getElementById(\"bulb-img\");\n        bulbImg.src = \"images/bulb-off.jpg\"\
    ;\n    }\n</script>\n```\n\n*   `onmouseover`属性被设置为调用`turnOn()`函数。\n*   `onmouseout`属性被设置为调用`turnOff()`函数。\n\
    \n*菠萝被扣留。完毕。*\n\n*   页面加载时，图像最初是未点亮的灯泡。\n*   如果用户的鼠标光标移到图像上，图像会变为点亮的灯泡。\n*   如果用户的鼠标光标移出图像，图像会变回未点亮的灯泡。\n"
