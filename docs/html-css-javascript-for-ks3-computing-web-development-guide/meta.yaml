  - "[PAGE 39]\n\n# Section Five — Style Sheets\n\n# Internal CSS\n\nLearning Objectives\n\
    Mixing CSS with HTML can make for a chunky bowl of code soup and, much like this\
    \ metaphor, it gets harder to swallow the more you add to it — so, let's break\
    \ it down.\n- Understand the purpose of using internal CSS instead of inline CSS.\n\
    - Be able to use the <style> tag to mark up internal CSS.\n\n# The style attribute\
    \ has its drawbacks\n\nRemember, inline CSS is assigned to the style attribute\
    \ of a specific HTML element.\n\n1) Code can become hard to read and write if\
    \ you've got loads of inline CSS.\n2) The same code needs to be repeated to style\
    \ different things in the same way, and the content of your page can get lost\
    \ in the surrounding code — it can also take ages to style every tag individually.\n\
    \nCOMMON PROBLEMS\nHow inline CSS can get repetitive.\nThe <h1> tags have the\
    \ same style repeated — as do the <p> tags.\n\n```\n<h1 style=\"color: Orange;\"\
    >Bad Food</h1>\n<p style=\"font-family: Arial; color: Blue;\">Deep-fried celery</p>\n\
    <h1 style=\"color: Orange;\">Baddest Food</h1>\n<p style=\"font-family: Arial;\
    \ color: Blue;\">Hot dogs</p>\n```\n\n**Bad Food**\nDeep-fried celery\n**Baddest\
    \ Food**\nHot dogs\n\n# Use <style> tags to add internal CSS\n\n- A style sheet\
    \ is just a collection of CSS rules used to style a web page.\n- Internal CSS\
    \ is a style sheet marked up by <style> tags in the <head> of a page.\n\nEXAMPLE\n\
    Recreating the example above using internal CSS.\n\n```\n<head>\n  <style>\n \
    \   h1 { color: Orange; }\n    p {\n      font-family: Arial;\n      color: Blue;\n\
    \    }\n  </style>\n</head>\n<body>\n  <h1>Bad Food</h1>\n  <p>Deep-fried celery</p>\n\
    \  <h1>Baddest Food</h1>\n  <p>Hot dogs</p>\n</body>\n```\n\nInternal CSS goes\
    \ between <style> tags inside the <head> element.\nThe property/value pairs are\
    \ the same as inline CSS, but you don't need the quotes.\nBoth <h1> elements will\
    \ have the same style — as will both the <p> elements.\n\nEach tag you want styled\
    \ needs to be named.\nCurly braces { } must surround the styles for each tag.\
    \ Just like with HTML, you can use indentation and extra spacing to make CSS more\
    \ readable.\nYou don't need any inline CSS in the <body>, as the internal CSS\
    \ is automatically applied.\n\nKEY TERMS\nThe internal CSS marked up by the <style>\
    \ tags is also known as an internal style sheet.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_39_0.png)\n\
    \nThe web page created by this code looks exactly the same as the example above.\n\
    \nYou'll see how to give different styles to elements of the same type on p.45.\n\
    \n# I've internalised this — it's now living in my <head> rent-free...\n\nWhen\
    \ using internal CSS, you can still use inline CSS to style individual elements.\
    \ If the same property is set in both inline and internal CSS, then the inline\
    \ CSS will take priority (see p.40)."
  - "[PAGE 40]\n\n# Styling Hyperlinks\n\n+   **Learning Objectives**\n* Links are\
    \ how people navigate around your website, so you don't want them to be missed\
    \ — here are a few tricks to make your links stand out using internal CSS.\n*\
    \ Understand the difference between visited and unvisited links.\n* Be able to\
    \ use a, a:link and a:visited to change the style of links.\n\n# Links can be\
    \ visited or unvisited\n\n1) As you saw in Section 4, hyperlinks are created using\
    \ the <a> tag.\n2) An unvisited link is a hyperlink to a web page you haven't\
    \ been to before. By default, with no CSS applied, these are coloured blue and\
    \ underlined.\n3) Once the linked web page has been visited, the link will turn\
    \ purple.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_40_0.png)\n\n# Use internal\
    \ CSS to style links\n\n+   * You can use a to apply styles to all links — whether\
    \ they're visited or not.\n* You can use a:link to style unvisited links and a:visited\
    \ to style visited links.\n\n```\n<head>\n<style>\n    a {\n        font-size:\
    \ 20px;\n    }\n    a:link {\n        color: DodgerBlue;\n        text-decoration-color:\
    \ Navy;\n    }\n    a:visited {\n        color: DarkOrange;\n        text-decoration-color:\
    \ Red;\n    }\n</style>\n</head>\n<body>\n    <a href=\"https://www.ordnancesurvey.co.uk\"\
    >Click me</a>\n</body>\n```\n\n**EXAMPLE**\nIt's best practice to style links\
    \ in this order: a, a:link and then a:visited.\n\nThe font for all links will\
    \ have a size of 20 pixels.\n\nHere's how the link looks before it's been visited.\
    \ [Click me]\n\nThis property sets the colour of any 'decoration' the text has\
    \ — for links, it's usually an underline.\n\nHere's how the link looks after it's\
    \ been visited. [Click me]\n\nIf this URL is already in your web browser's history,\
    \ it will count as visited — so change this to somewhere that you've never been\
    \ to if you want to see the unvisited style applied.\n\n+   * The text-decoration\
    \ property can also be used to style links — it can have the values: underline,\
    \ overline, line-through and none.\n\n+   **Q1** Write the internal CSS that styles\
    \ links like this:\nUnvisited [Click me]\nVisited [Click me]\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_40_1.png)\n\
    \nFor security reasons, most web browsers limit which properties you're allowed\
    \ to change for a:visited. If you find you can't style a visited link in a certain\
    \ way, then it may be disallowed.\n\na:link and a:visited are examples of 'pseudo-classes'\
    \ in CSS. Another is a:hover (see p.41) and there's also a:active which is used\
    \ to style a link at the moment it's clicked.\n\n> **CSS prank: swap the default\
    \ blue and purple colours of links...**\n...but seriously, don't forget the accessible\
    \ design principles from p.18 — your links should be easy to read, and they should\
    \ look different to other bits of text so people can see they're there."
- md: "## Colour Codes\n\n### Learning Objectives\n\nWith over a hundred colour names\
    \ to choose from, you'd think that'd be plenty. But no, it never is. Here's what\
    \ to do when 'MintCream' just isn't minty enough.\n\n- Learn how hex codes can\
    \ represent different colours.\n- Understand how to find a hex code for a given\
    \ colour.\n\n### Every colour has a hex code\n\n1) As you saw on p.20, there are\
    \ loads of named colours you can use on the Web. For example, 'Indigo' is this\
    \ dark purplish blue.\n\n2) Every colour has a corresponding hex colour code that\
    \ you can use instead of writing a name — e.g. the code for Indigo is #4B0082.\n\
    \nHex (short for hexadecimal) is a number system that uses 16 digits — the numerals\
    \ 0-9 and then the letters A-F.\n\n+   Q1 Use CSS to find which colour name matches\
    \ the following colour codes.\n\na) #0000FF\nBlue, Green or Yellow?\n\nb) #808080\n\
    Brown, Beige or Grey?\n\nc) #FFA500\nLime, Orange or Pink?\n\n### EXAMPLE\n\n\
    There's not much to using colour codes really.\n\n```\n<head>\n  <style>\n   \
    \ h1 { color: Indigo; }\n    p { color: #4B0082; }\n  </style>\n</head>\n<body>\n\
    \  <h1>Indigo Fansite</h1>\n  <p>Let's go indigo!</p>\n</body>\n```\n\nYou can\
    \ use a colour code instead of a colour name for any CSS property where you need\
    \ to set a colour.\n\nIndigo Fansite\nLet's go indigo!\n\nThe <h1> and <p> text\
    \ have the same colour.\n\nHex codes for the named colours are listed in ColourCodes.txt\
    \ in the downloadable files for this section.\n\n### Use a colour picker to find\
    \ a hex code\n\n+   * Hex codes are needed because not all colours have names.\n\
    * Even for named colours, you sometimes want a lighter or darker shade.\n* You\
    \ can use a tool like a colour picker to help you find a hex code for the exact\
    \ colour you want to use.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_41_0.png)\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_41_1.png)\n\nThe code files for this\
    \ section contain a colour picker app — just open 'ColourPicker.html' in your\
    \ web browser to use it. It may look a bit different depending on what device\
    \ you're using. You can also search e.g. \"CSS colour picker\" online to find\
    \ more advanced colour pickers.\n\nHex colour codes are based on a simple system:\
    \ the first two digits represent Red, the middle two represent Green, and the\
    \ last two represent Blue. E.g. Indigo has the code #4B0082 — meaning it's a mix\
    \ of Red (4B) and Blue (82), but no Green (00). By changing these values you can\
    \ alter the colour.\n\nYou can click here to switch the display to show hex code.\n\
    \n+   Q2 Use a colour picker to find the hex codes for the following colours:\n\
    \na) Black\nb) White\nc) Red\n\nAnyone going to #IndigoCon this year? #IndiGoing\
    \ #4B0082...\n\nWith so many colours available it can be tempting to use loads\
    \ of them, but many well-designed websites use just a few colours that work well\
    \ together — tastes vary, so do what speaks to you.\n\n## External CSS\n\n###\
    \ Learning Objectives\n\nFloral wallpaper, tartan cushions, a leopard-print rug…\
    \ My style is awful-(I could stop here)-ly inconsistent. Don't be like me — keep\
    \ your style consistent with external CSS.\n\n- Understand the **benefits** of\
    \ external CSS.\n- Be able to use the **<link>** tag to mark up **external CSS**\
    \ and add **icons** to web pages.\n- Learn about how **CSS rules** are **prioritised**.\n\
    \n### Web pages can share styles with external CSS\n\n1) Up till now, you've seen\
    \ two ways of **using CSS** in your web pages:\n\n- **Inline CSS** — which is\
    \ assigned to **style attributes** and is good for **one-off uses**.\n- **Internal\
    \ CSS** — which is marked up by **<style> tags** in the **<head>**, and is good\
    \ for **repeating styles** on a **web page**.\n\n2) If your website has **multiple\
    \ pages** that you want to **style the same way**, then using either of these\
    \ methods would mean you'd have to **copy the same CSS** into each page — which\
    \ **isn't very efficient**.\n\n3) **External CSS** solves this problem — it's\
    \ CSS that's **saved** in a **separate file**, called an **external style sheet**,\
    \ which is then **linked** to each of your pages.\n\nExternal CSS can also be\
    \ used if you just want your HTML to look less busy.\n\n### External CSS goes\
    \ in a .css file\n\nMaking an **external style sheet** is simple:\n\n- Open a\
    \ **new file** in your **text** (or **code**) editor.\n- **Save** the file with\
    \ the **.css file format** (depending on your editor, you may just need to select\
    \ 'Cascading Style Sheet' as the **file type**).\n- Once saved, enter your **CSS**\
    \ — it's written the same as **internal CSS** on p.36, except you **don't include**\
    \ the **<style> tags**.\n- **Save again** — your style sheet is now **ready to\
    \ use**.\n\n```\nbody {\n  background-color: LightBlue;\n  font-family: Arial,\
    \ sans-serif;\n}\nh1 {\n  text-decoration: underline;\n  color: Indigo;\n}\n```\n\
    \nSaving a .css file is similar to the process on p.5 for saving .html files.\n\
    \nThe following examples will assume this style sheet is saved as 'styles.css'\
    \ in the same folder as the web pages.\n\n### Use <link> to apply external CSS\n\
    \nOnce you've made an **external style sheet**, you then need to **connect it**\
    \ to your web pages using the **<link> tag**.\n\n**EXAMPLE** Linking to an external\
    \ style sheet.\n\nDespite the name, the <link> tag isn't used for hyperlinks —\
    \ that's the <a> tag's job (see p.30).\n\nThe **<link> tag** goes in the **<head>**\
    \ — it **doesn't** have a **closing tag**.\n\nThe **href** attribute tells the\
    \ **web browser** which **file** to look for and **where it's located**.\n\n```\n\
    <head>\n  <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n  <h1>CSS\
    \ Workshop</h1>\n  <p><a href=\"info.html\">Find out more</a>.</p>\n</body>\n\
    ```\n\nThe **rel** attribute tells the **web browser** how this file **relates**\
    \ to the **web page**.\n\n### CSS Workshop\n\nFind out more.\n\nWhen the **page**\
    \ is viewed in a web browser, it will **apply** the **style sheet** referred to\
    \ in the **<link> tag**.\n\n## External CSS\n\n### CSS has priority rules\n\n\
    1) When you use external CSS, you can still use inline and internal CSS on your\
    \ page.\n2) If a property is set in more than one place, there are rules about\
    \ which value is used.\n\n- If a property is set in both inline CSS and a style\
    \ sheet, the inline style will take priority.\n\n```\n<head>\n    <link rel=\"\
    stylesheet\" href=\"styles.css\">\n</head>\n<body>\n    <h1 style=\"text-decoration:\
    \ none;\">CSS Workshop</h1>\n    <p>It's a 24-hour coding extravaganza.</p>\n\
    \    <p><a href=\"signup.html\">Sign up here</a>.</p>\n</body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_43_0.png)\n\
    \n- If a property is set in both internal and external CSS, then whichever of\
    \ the <link> or <style> tags is used second will take priority.\n\n```\n<head>\n\
    \    <link rel=\"stylesheet\" href=\"styles.css\">\n    <style>\n        h1 {\
    \ text-decoration: line-through; }\n    </style>\n</head>\n<body>\n    <h1>CSS\
    \ Workshop</h1>\n    <p>Sorry, due to bug-ridden code, the event has been cancelled.</p>\n\
    </body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_43_1.png)\n\n### <link>\
    \ can add icons to your web pages\n\n- The <link> tag can also be used to add\
    \ icons to your web pages.\n- These are the small images that are shown next to\
    \ the title on a browser tab — these are sometimes called 'favicons' as they're\
    \ shown in favourites (or bookmarks) lists too.\n\n### EXAMPLE\n\nMaking your\
    \ web pages iconic.\n\n```\n<head>\n    <title>CSS Workshop</title>\n    <link\
    \ rel=\"icon\" href=\"icon.png\">\n</head>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_43_2.png)\n\
    \n> Wash your style sheets at 60 degrees to get rid of code bugs...\n\nTo recap:\
    \ inline CSS is for small bits of style unique to one element, internal CSS is\
    \ for styles that only apply to a single page, and external CSS is for styles\
    \ that apply to multiple pages — simple."
  mdcn: "\n## 颜色代码\n\n### 学习目标\n\n你可能会想，有一百多个颜色名称可选，应该足够了吧。但事实并非如此。当“薄荷奶油色”不够清新时，这里有解决办法。\n\
    \n- 学习十六进制代码如何表示不同的颜色。\n- 理解如何为给定的颜色查找十六进制代码。\n\n### 每种颜色都有一个十六进制代码\n\n1) 正如你在第20页所看到的，网页上有大量命名颜色可供使用。例如，“靛蓝色”就是这样一种深紫蓝色。\n\
    \n2) 每种颜色都有一个对应的十六进制颜色代码，你可以使用这个代码来替代颜色名称——例如，靛蓝色的代码是 #4B0082。\n\n十六进制（hexadecimal的缩写）是一种使用16个数字的数制——数字0-9和字母A-F。\n\
    \n+   Q1 使用CSS找出以下颜色代码对应的颜色名称。\n\na) #0000FF\n蓝色、绿色还是黄色？\n\nb) #808080\n棕色、米色还是灰色？\n\
    \nc) #FFA500\n黄绿色、橙色还是粉色？\n\n### 示例\n\n使用颜色代码其实并不复杂。\n\n```\n<head>\n  <style>\n\
    \    h1 { color: Indigo; }\n    p { color: #4B0082; }\n  </style>\n</head>\n<body>\n\
    \  <h1>Indigo Fansite</h1>\n  <p>Let's go indigo!</p>\n</body>\n```\n\n在任何需要设置颜色的CSS属性中，你都可以使用颜色代码来替代颜色名称。\n\
    \nIndigo Fansite\nLet's go indigo!\n\n<h1> 和 <p> 文本的颜色相同。\n\n命名颜色的十六进制代码列在本节可下载文件中的\
    \ ColourCodes.txt 文件中。\n\n### 使用取色器查找十六进制代码\n\n+   * 需要十六进制代码是因为并非所有颜色都有名称。\n\
    * 即使是命名颜色，有时你也需要更深或更浅的色调。\n* 你可以使用取色器等工具来帮助你找到想要使用的精确颜色的十六进制代码。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_41_0.png)\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_41_1.png)\n\n本节的代码文件包含一个取色器应用程序——只需在你的网页浏览器中打开“ColourPicker.html”即可使用。根据你使用的设备不同，它可能看起来略有不同。你也可以在线搜索，例如“CSS\
    \ colour picker”，以找到更高级的取色器。\n\n十六进制颜色代码基于一个简单的系统：前两位代表红色，中间两位代表绿色，最后两位代表蓝色。例如，靛蓝色的代码是\
    \ #4B0082——这意味着它是红色（4B）和蓝色（82）的混合，没有绿色（00）。通过更改这些值，你可以改变颜色。\n\n你可以点击此处切换显示以显示十六进制代码。\n\
    \n+   Q2 使用取色器找出以下颜色的十六进制代码：\n\na) 黑色\nb) 白色\nc) 红色\n\n今年有人去 #IndigoCon 吗？ #IndiGoing\
    \ #4B0082...\n\n有这么多颜色可用，很容易想大量使用它们，但许多设计精良的网站只使用少数几种搭配和谐的颜色——品味各不相同，所以选择能打动你的方式。\n\
    \n## 外部CSS\n\n### 学习目标\n\n花卉壁纸、格子靠垫、豹纹地毯……我的风格糟糕得（我可以就此打住）不一致。别学我——用外部CSS保持你的风格一致。\n\
    \n- 理解外部CSS的**好处**。\n- 能够使用 **<link>** 标签来标记**外部CSS**并为网页添加**图标**。\n- 了解**CSS规则**如何被**优先排序**。\n\
    \n### 网页可以通过外部CSS共享样式\n\n1) 到目前为止，你已经看到了在网页中**使用CSS**的两种方式：\n\n- **内联CSS** ——\
    \ 分配给**style属性**，适用于**一次性使用**。\n- **内部CSS** —— 由**<head>**中的**<style>标签**标记，适用于**网页**上的**重复样式**。\n\
    \n2) 如果你的网站有**多个页面**，并且你希望**以相同方式设置样式**，那么使用这两种方法中的任何一种都意味着你必须**将相同的CSS复制**到每个页面——这**效率不高**。\n\
    \n3) **外部CSS**解决了这个问题——它是在一个**单独的文件**中**保存**的CSS，称为**外部样式表**，然后**链接**到你的每个页面。\n\
    \n如果你只是希望你的HTML看起来不那么杂乱，也可以使用外部CSS。\n\n### 外部CSS放在.css文件中\n\n创建一个**外部样式表**很简单：\n\
    \n- 在你的**文本**（或**代码**）编辑器中打开一个**新文件**。\n- 将文件**保存**为 **.css文件格式**（根据你的编辑器，你可能只需选择“层叠样式表”作为**文件类型**）。\n\
    - 保存后，输入你的**CSS**——它的写法与第36页的**内部CSS**相同，只是你**不包含****<style>标签**。\n- **再次保存**——你的样式表现在**可以使用了**。\n\
    \n```\nbody {\n  background-color: LightBlue;\n  font-family: Arial, sans-serif;\n\
    }\nh1 {\n  text-decoration: underline;\n  color: Indigo;\n}\n```\n\n保存.css文件与第5页保存.html文件的过程类似。\n\
    \n以下示例将假设此样式表保存为“styles.css”，与网页在同一文件夹中。\n\n### 使用 <link> 应用外部CSS\n\n一旦你创建了**外部样式表**，你需要使用\
    \ **<link> 标签**将其**连接**到你的网页。\n\n**示例** 链接到外部样式表。\n\n尽管名为<link>，但<link>标签并非用于超链接——那是<a>标签的工作（参见第30页）。\n\
    \n**<link>标签**放在 **<head>** 中——它**没有** **结束标签**。\n\n**href**属性告诉**网页浏览器**要查找哪个**文件**以及**它的位置**。\n\
    \n```\n<head>\n  <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n\
    \  <h1>CSS Workshop</h1>\n  <p><a href=\"info.html\">Find out more</a>.</p>\n\
    </body>\n```\n\n**rel**属性告诉**网页浏览器**此文件与**网页**如何**相关**。\n\n### CSS Workshop\n\n\
    Find out more.\n\n当在网页浏览器中查看该**页面**时，它将**应用****<link>标签**中引用的**样式表**。\n\n## 外部CSS\n\
    \n### CSS有优先级规则\n\n1) 使用外部CSS时，你仍然可以在页面上使用内联和内部CSS。\n2) 如果一个属性在多个地方设置，则有关于使用哪个值的规则。\n\
    \n- 如果一个属性在内联CSS和样式表中都设置了，则内联样式将优先。\n\n```\n<head>\n    <link rel=\"stylesheet\"\
    \ href=\"styles.css\">\n</head>\n<body>\n    <h1 style=\"text-decoration: none;\"\
    >CSS Workshop</h1>\n    <p>It's a 24-hour coding extravaganza.</p>\n    <p><a\
    \ href=\"signup.html\">Sign up here</a>.</p>\n</body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_43_0.png)\n\
    \n- 如果一个属性在内部和外部CSS中都设置了，那么<link>或<style>标签中后使用的那个将优先。\n\n```\n<head>\n    <link\
    \ rel=\"stylesheet\" href=\"styles.css\">\n    <style>\n        h1 { text-decoration:\
    \ line-through; }\n    </style>\n</head>\n<body>\n    <h1>CSS Workshop</h1>\n\
    \    <p>Sorry, due to bug-ridden code, the event has been cancelled.</p>\n</body>\n\
    ```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_43_1.png)\n\n### <link>可以为你的网页添加图标\n\
    \n- <link>标签也可用于为你的网页添加图标。\n- 这些是显示在浏览器标签页标题旁边的小图像——有时被称为“网站图标”，因为它们也会显示在收藏夹（或书签）列表中。\n\
    \n### 示例\n\n让你的网页标志化。\n\n```\n<head>\n    <title>CSS Workshop</title>\n    <link\
    \ rel=\"icon\" href=\"icon.png\">\n</head>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_43_2.png)\n\
    \n> 用60度水温洗涤你的样式表，以消除代码漏洞...\n\n总结一下：内联CSS用于单个元素独有的小段样式，内部CSS用于仅应用于单个页面的样式，而外部CSS用于应用于多个页面的样式——就这么简单。\n"
