    # # Section Two — HTML Foundations

    ## HTML Tags


    Tag — you''re It. And by ''It'', I mean the person who''s going to be learning
    all about the language that forms the foundation for all web pages. Oh, please,
    no need to clap.


    +   * Understand what HTML stands for and what it''s used for.

    * Learn about HTML tags and elements.


    # ## HTML forms the foundation for your pages


    +   1) A British computer scientist called Tim Berners-Lee came up with the concept
    of the Web in 1989 — the main language of the web, HTML, came shortly afterwards.

    2) Modern web pages usually use a few different coding languages, but the one
    they all have in common is HTML.

    3) HTML describes the structure of a web page.

    4) It''s used to ''mark up'' the main elements of the content — like headings,
    paragraphs, images, etc.

    5) A web browser will use the HTML to set out the page when it''s viewed.


    HTML stands for HyperText Markup Language. In HTML, ''mark up'' just means to
    label content by adding tags, like in the example below.


    # ## HTML consists of lots of tags


    +   * The way HTML marks up different elements is through tags.

    * Tags usually come in pairs — an opening tag marks up the start of an element,
    and a closing tag marks up the end of an element.


    EXAMPLE Here''s how a typical bit of HTML code will look.


    This is an opening tag — a word surrounded by angle brackets.


    This is the content — it''s surrounded by the tags.


    This is the closing tag. It''s the same as the opening one but with a forward
    slash before the word.


    Some tags don''t have a closing tag, but this is rare — see p.14.


    ```

    <html>

    HyperText Markup Language. Learn this!

    </html>

    ```


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_11_0.png)


    This whole thing (both tags and the content) is called an element.


    You''ll learn to change how the content looks using CSS in the next section.


    Here''s how this code should look when opened in a web browser — the browser doesn''t
    show the tags.


    Q1 Another example of a HTML opening tag is <u>. Suggest what the closing tag
    is.


    Germans love HTML — but only if the tags are guten...


    When designing a web page, think about which parts of your content need marking
    up — what are the key components you want to stand out? We''ll go over how to
    do this on the next few pages.'
  - "[PAGE 12]\n\n# Head and Body\n\nHere we go again. It's time to get to grips with\
    \ splitting your code up into heads and bodies. We're not going all biological\
    \ though — no need to pick up a scalpel...\n\n+   - Understand the standard structure\
    \ of a web page.\n- Understand the purpose of the <head>, <body> and <title> tags.\n\
    - Learn how indentation makes code easier to read.\n\n# Web pages have a standard\
    \ structure\n\nEvery time you make a web page you should write a few tags before\
    \ you get started. These are in addition to the <html> tags you saw on the previous\
    \ page.\n\nHere are some tags to set out the standard part of a web page.\n\n\
    The downloadable HTML files for this book all contain an extra line in the <head>\
    \ that begins: `<meta name=\"viewport\"...` It resizes the web page to look bigger\
    \ on small screens, like phones and tablets. You can use it too — it's optional.\n\
    \nThis just tells the browser that you're using HTML — you should include it on\
    \ every page. It doesn't have a closing tag.\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>My Wonderful Page</title>\n</head>\n<body>\n  OK, it's not that\
    \ wonderful. Yet...\n</body>\n</html>\n```\n\nThe <head> contains information\
    \ about the web page, but no content that goes on the page itself.\n\nThe <body>\
    \ contains all elements that will be visible to the user on the page.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_12_0.png)\n\
    \nThis is the 'title' that the <title> tag is setting — it's what you see on the\
    \ browser tab. As it's set in the <head>, it isn't seen on the page itself.\n\n\
    # Adding gaps makes code easier to read\n\n+   1) A gap at the start of a line\
    \ is called an indent.\n2) It's a good idea to indent when you're using a tag\
    \ inside another tag, because it makes it clearer — e.g. in the code above, it's\
    \ obvious that <title> is inside the <head>.\n3) Adding extra spacing in the code\
    \ doesn't change how the page looks, but it reads more nicely.\n\nYou can use\
    \ the Tab key to add an indent.\n\n```\n<!DOCTYPE html><html><head>\n<title>My\
    \ Wonderful Page</title></head><body>\nOK, it's not that wonderful. Yet...</body></html>\n\
    ```\n\nThis code makes the same web page as the example above, but it's harder\
    \ to read without those lovely indents and gaps.\n\nLike a bodybuilder, most of\
    \ our dev work goes into our <body>... We'll add to the <head> more in later sections,\
    \ but for now the <body> is key because that's what the user sees. Remember to\
    \ include the standard structure in all your code from this point."
- md: "## Headings and Paragraphs\n\nRight, time to add a few more tags to your toolkit.\
    \ All of the ones you'll learn about on this page are for structuring text. Hold\
    \ on, that's MY job...\n\n- Be able to use the tags `<h1>`, `<h2>`, etc. to mark\
    \ up headings.\n- Be able to use `<p>` tags to mark up paragraphs.\n\n## Headings\
    \ make text bigger and bolder\n\n1. Lots of web pages (like book pages) use headings\
    \ above regular text.\n2. They summarise or introduce text, and they make it clear\
    \ what a page is about.\n3. This is done using heading tags. They start with an\
    \ 'h' followed by a number — 1 is for the biggest heading.\n\n**EXAMPLE** The\
    \ code below uses three different headings — `<h1>`, `<h2>` and `<h3>`.\n\n```\n\
    <!DOCTYPE html>\n<html>\n<head>\n    <title>Headings Showcase</title>\n</head>\n\
    <body>\n    <h1>Big Bad Heading</h1>\n    <h2>Quite A Big Heading</h2>\n    <h3>The\
    \ Runt Of These Headings</h3>\n    Here's just some boring text.\n</body>\n</html>\n\
    ```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_13_0.png)\n\n**Q1** There are\
    \ a limited number of heading sizes that can be used. Experiment to find which\
    \ tag is used for the smallest heading.\n\n## Use paragraph tags for regular text\n\
    \n1. You can also use a `<p>` tag — the 'p' stands for paragraph.\n2. Every time\
    \ you open a new `<p>`, the web browser displays the text that follows it in a\
    \ new paragraph.\n\nRemember to use a closing tag once your heading or paragraph\
    \ has finished, otherwise it'll affect later bits of code.\n\n**EXAMPLE** The\
    \ code below shows how `<p>` tags cause text to be displayed in a new paragraph.\n\
    \n```\n<p>The line breaks\nin the code\ndon't\nmean anything.</p>\n<p>Ooh look,\
    \ a new paragraph.</p>\n```\n\nThe line breaks in the code don't mean anything.\
    \ Ooh look, a new paragraph.\n\nRemember, gaps in the code aren't displayed in\
    \ a web browser — to space out text, you need to use tags like `<p>` instead.\n\
    \nA new `<p>` tag starts a new paragraph here.\n\nRemember to include the standard\
    \ structure (see previous page) to make this a full web page.\n\n<h1>We're heading\
    \ towards making some exquisite pages</h1> Ok, so the web pages you've made so\
    \ far look pretty dull. But don't worry, the rest of this section introduces tags\
    \ that'll make pages look waaay better — then we'll use CSS to make things pop\
    \ off.\n\n## Bold, Italic and Underline\n\n**Learning Objectives**\n\nSo you've\
    \ got your text, you've set your heading and paragraph tags, but it all still\
    \ looks a bit boring. **What's next?** Enter stage left, text formatting tags...\n\
    \n- Be able to use `<b>`, `<i>`, and `<u>` to mark up **bold**, *italic* and <u>underline</u>\
    \ in text.\n- Understand the importance of <u>closing tags</u>.\n\n## You can\
    \ add **bold**, *italic* and <u>underline</u> to your text\n\n1. To make text\
    \ **bolder**, use a `<b>` tag.\n2. To make text *italic*, use a `<i>` tag.\n3.\
    \ To give text an <u>underline</u>, use a `<u>` tag.\n4. They each have a <u>closing\
    \ tag</u>: `</b>`, `</i>` and `</u>`.\n\n> **Q1** How will these look?\n> a) `<b><u>Hands\
    \ off</u></b>`\n> b) `<b><u>my</u> <i>lunch</i></b>`!\n\n**EXAMPLE** The code\
    \ below formats the text with bold, italics and underline.\n\nYou can format text\
    \ <u>inside other elements</u> like headings.\n\n```\n<body>\n    <h1>Look at\
    \ <u>this</u>!</h1>\n    <p>I can't <b>tell you</b>\n    enough how <u><i>super</i></u>\
    \ this is.</p>\n</body>\n```\n\n**Look at this!**\n\nI can't **tell you** enough\
    \ how *super* this is.\n\nYou can also <u>combine formatting</u> by putting <u>two\
    \ tags</u>, one after another.\n\nOnly the text <u>inside</u> the <u>relevant\
    \ tags</u> will be <u>formatted</u> with bold, italics or underline.\n\n> You\
    \ can use the `<strong>` or `<em>` tags in place of `<b>` or `<i>` to mark up\
    \ \"important\" or \"emphasised\" text that's meant to be read in a different\
    \ tone of voice. They're good for accessibility as screen readers (see p.18) will\
    \ take special note of them, unlike `<b>` and `<i>`.\n\n![GOING FURTHER](https://via.placeholder.com/100x100?text=GOING+FURTHER)\n\
    \n## Don't forget the <u>closing tag</u>\n\nWeb browsers are usually quite <u>nice\
    \ to web developers</u> — they'll do their best to <u>display your page</u>, but\
    \ if you make mistakes, they might not <u>display</u> things the way you <u>wanted</u>.\n\
    \n![COMMON PROBLEMS](https://via.placeholder.com/100x100?text=COMMON+PROBLEMS)\
    \ A common mistake is forgetting a closing tag.\n\n```\n<p>I only wanted to underline\
    \ the word <u>'tremendous'</p>\n<p>and bold the word <b>'marvellous'.</p>\n<p>But\
    \ look what's happened...</p>\n<p>Now it's ruined.</p>\n```\n\nI only wanted to\
    \ underline the word 'tremendous'\nand bold the word **'marvellous'**.\n**But\
    \ look what's happened...**\n**Now it's ruined.**\n\nThere should have been a\
    \ `</u>` here to tell the browser to <u>stop</u> the <u>underlining</u>...\n\n\
    ...and a `</b>` here to tell the browser to <u>stop</u> the <u>bolding</u> — instead\
    \ it just carries on.\n\n![Cartoon of frustrated person at computer](https://via.placeholder.com/100x100?text=Cartoon)\
    \ bold, error, italic, error, underline, error\n\n**My teacher once called my\
    \ name in bold, italics and underline...**\nThese formatting tags are a <u>great</u>\
    \ way to add a bit of *flair* to your web pages, as long as you don't <u>forget</u>\
    \ the closing tags. Keep practising with them, and it'll become second nature.\
    \ <u>See?</u>\n\n## Lists and Other Bits\n\n**Learning Objectives**\n\nI bet you've\
    \ been eager to know how to organise stuff on your web page into lists. Well look\
    \ no further. I'll even throw in some funky text formatting tags as a bonus.\n\
    \n- Be able to use `<ol>`, `<ul>` and `<li>` to mark up `ordered` and `unordered`\
    \ lists.\n- Be able to use other `text formatting tags` such as `<mark>` and `<s>`.\n\
    \n## A list is a great way to summarise information\n\n1. In HTML, an `ordered`\
    \ list means one that is `given in sequence` (e.g. 1, 2, 3 or a, b, c) — these\
    \ are `marked up` by `<ol>`.\n2. An `unordered` list means one that is `bullet-pointed`\
    \ — these are `marked up` by `<ul>`.\n3. Inside these `<ol>` or `<ul>` tags, you\
    \ then add an `<li>` tag for each `list item`.\n\nYou can change the numbering\
    \ type or bullet point style of a list using CSS.\n\n## EXAMPLE Using `<ol>` (ordered\
    \ list) and `<ul>` (unordered list) with `<li>` (list item).\n\nIt's a good idea\
    \ to `indent` the list items (`<li>`) so it's clear that they are `inside` the\
    \ list.\nYou use `<li>` the `same way` for `both types` of list.\n\n```\n<h2>Here's\
    \ an ordered list:</h2>\n<ol>\n  <li>This is the top dog, woof</li>\n  <li>2nd\
    \ the best?</li>\n</ol>\n\n<h2>...and here's an unordered list:</h2>\n<ul>\n \
    \ <li>No favourites here, all points are equal</li>\n  <li>See? They're all just\
    \ regular bullets</li>\n</ul>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_15_0.png)\n\
    \nHere's an ordered list:\n1. This is the top dog, woof\n2. 2nd the best?\n\n\
    ...and here's an unordered list:\n* No favourites here, all points are equal\n\
    * See? They're all just regular bullets\n\n**Q1** Are the following examples most\
    \ suited to an ordered or unordered list?\na) Top five favourite movies.\nb) Instruments\
    \ in an orchestra.\nc) Different ways to cook a chicken.\nd) Questions for a test.\n\
    \n## There are other `text tags` you can use\n\n- `<mark>` and `</mark>` `highlights`\
    \ the text.\n- `<s>` and `</s>` `strikethrough` the text.\n- `<code>` and `</code>`\
    \ `changes the text to code font`.\n- `<blockquote>` and `</blockquote>` `indents\
    \ text to show that it's quoting a source`.\n- `<sup>` and `</sup>` `are used\
    \ for superscript text`.\n- `<sub>` and `</sub>` `are used for subscript text`.\n\
    \n**Q2** Recreate this web page:\n* Make `this` go like this\n* Ooh, `look` at\
    \ this\n* Watch `this` go `higher`\n\nIf my room was a list, it would be the unordered\
    \ type...\nHave a play around with these text formatting tags and see what you\
    \ can come up with. A to-do list? A recipe? Or maybe you just want to type messages\
    \ to your classmates in highlighted text.\n\n## Practice Questions\n\n### Warm-Up\n\
    \n- **Q1** What is a ‘tag’ in HTML?\n- **Q2** True or false? A HTML element is\
    \ the combination of an opening tag, some content, and a closing tag.\n- **Q3**\
    \ How will `<h1>` and `<h2>` headings look different?\n- **Q4** Why is it sensible\
    \ to add indents and gaps between lines in your code?\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_16_0.png)\n\
    \n### Practice Questions\n\n**Q1** Here's the basic structure that all HTML files\
    \ should have. Use terms from the box to complete the tags.\n\n**Terms to use:**\n\
    `DOCTYPE html`\n`/html`\n`body`\n`/p`\n`title`\n`head`\n`h1`\n\n*Not all of these\
    \ terms are needed in your answer.*\n\n```\n<!.......................>\n<html>\n\
    <.......................>\n<.......................>Summary</title>\n</head>\n\
    \n<.......................>\nMain page here.\n</body>\n\n<.......................>\n\
    ```\n\n**Q2** Explain the difference between the `<head>` and `<body>` tags.\n\
    \n........................................................................................................\n\
    ........................................................................................................\n\
    ........................................................................................................\n\
    \n**Q3** Complete the table to show what each tag does.\n\n| Opening tag | What\
    \ it’s used for |\n| :--- | :--- |\n| `<p>` | |\n| `<i>` | |\n| `<ul>` | |\n\n\
    **Q4** List three errors in the code below.\n\n```\n<h1>My Page</h1>\n<paragraph>Welcome\
    \ to my site. Here's a fact about <b>me:</paragraph>\n<h2 When I eat my birthday\
    \ cake, I save the candles until last.</h2>\n```\n\n1. ........................................................................................................\n\
    2. ........................................................................................................\n\
    3. ........................................................................................................"
  mdcn: "\n## 标题与段落\n\n好了，是时候向你的工具箱中添加更多标签了。本页将学习的所有标签都用于构建文本结构。等等，这本来是我的工作……\n\n\
    - 能够使用 `<h1>`、`<h2>` 等标签来标记标题。\n- 能够使用 `<p>` 标签来标记段落。\n\n## 标题使文本更大更醒目\n\n1. 许多网页（类似书籍页面）会在正文上方使用标题。\n\
    2. 它们用于总结或介绍文本，并明确页面的主题。\n3. 这通过标题标签实现。它们以 'h' 开头，后跟一个数字 —— 1 代表最大的标题。\n\n**示例**\
    \ 下面的代码使用了三个不同的标题 —— `<h1>`、`<h2>` 和 `<h3>`。\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n    <title>Headings Showcase</title>\n</head>\n<body>\n    <h1>Big Bad\
    \ Heading</h1>\n    <h2>Quite A Big Heading</h2>\n    <h3>The Runt Of These Headings</h3>\n\
    \    Here's just some boring text.\n</body>\n</html>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_13_0.png)\n\
    \n**Q1** 可用的标题大小数量有限。尝试找出哪个标签用于最小的标题。\n\n## 使用段落标签包裹普通文本\n\n1. 你也可以使用 `<p>` 标签\
    \ —— 'p' 代表段落。\n2. 每次你开启一个新的 `<p>`，网页浏览器就会将其后的文本显示为一个新段落。\n\n记住在标题或段落结束后使用结束标签，否则会影响后面的代码。\n\
    \n**示例** 下面的代码展示了 `<p>` 标签如何使文本显示为新段落。\n\n```\n<p>The line breaks\nin the code\n\
    don't\nmean anything.</p>\n<p>Ooh look, a new paragraph.</p>\n```\n\n代码中的换行符没有任何意义。哦，看，一个新段落。\n\
    \n记住，代码中的空格在网页浏览器中不会显示 —— 要间隔文本，你需要使用 `<p>` 这样的标签。\n\n一个新的 `<p>` 标签在这里开始了一个新段落。\n\
    \n记住包含标准结构（参见上一页）以使其成为一个完整的网页。\n\n<h1>我们正朝着制作精美页面的方向前进</h1> 好的，到目前为止你制作的网页看起来相当单调。但别担心，本节的其余部分将介绍能让页面看起来好很多的标签\
    \ —— 然后我们将使用 CSS 让内容跃然纸上。\n\n## 粗体、斜体和下划线\n\n**学习目标**\n\n现在你有了文本，设置了标题和段落标签，但整体看起来还是有点无聊。**接下来呢？**\
    \ 文本格式化标签登场了……\n\n- 能够使用 `<b>`、`<i>` 和 `<u>` 来标记文本中的**粗体**、*斜体*和<u>下划线</u>。\n\
    - 理解<u>结束标签</u>的重要性。\n\n## 你可以为文本添加**粗体**、*斜体*和<u>下划线</u>\n\n1. 要使文本**更粗**，使用\
    \ `<b>` 标签。\n2. 要使文本*倾斜*，使用 `<i>` 标签。\n3. 要给文本添加<u>下划线</u>，使用 `<u>` 标签。\n4. 它们各自都有一个<u>结束标签</u>：`</b>`、`</i>`\
    \ 和 `</u>`。\n\n> **Q1** 这些会是什么样子？\n> a) `<b><u>Hands off</u></b>`\n> b) `<b><u>my</u>\
    \ <i>lunch</i></b>`!\n\n**示例** 下面的代码用粗体、斜体和下划线格式化了文本。\n\n你可以在其他元素<u>内部</u>格式化文本，比如标题。\n\
    \n```\n<body>\n    <h1>Look at <u>this</u>!</h1>\n    <p>I can't <b>tell you</b>\n\
    \    enough how <u><i>super</i></u> this is.</p>\n</body>\n```\n\n**看看这个！**\n\n\
    我简直无法**告诉**你这有多么*棒*。\n\n你也可以通过连续放置<u>两个标签</u>来<u>组合格式化</u>。\n\n只有<u>相关标签</u><u>内部</u>的文本才会被格式化为粗体、斜体或下划线。\n\
    \n> 你可以使用 `<strong>` 或 `<em>` 标签代替 `<b>` 或 `<i>` 来标记“重要”或“强调”的文本，这些文本应该以不同的语调朗读。它们对可访问性很有好处，因为屏幕阅读器（见第18页）会特别注意它们，不像\
    \ `<b>` 和 `<i>`。\n\n![进一步探索](https://via.placeholder.com/100x100?text=GOING+FURTHER)\n\
    \n## 不要忘记<u>结束标签</u>\n\n网页浏览器通常对<u>网页开发者很友好</u> —— 它们会尽力<u>显示你的页面</u>，但如果你犯了错误，它们可能不会按照你<u>期望</u>的方式<u>显示</u>内容。\n\
    \n![常见问题](https://via.placeholder.com/100x100?text=COMMON+PROBLEMS) 一个常见的错误是忘记结束标签。\n\
    \n```\n<p>I only wanted to underline the word <u>'tremendous'</p>\n<p>and bold\
    \ the word <b>'marvellous'.</p>\n<p>But look what's happened...</p>\n<p>Now it's\
    \ ruined.</p>\n```\n\n我只想给单词 'tremendous' 添加下划线\n并给单词 **'marvellous'** 加粗。\n**但看看发生了什么...**\n\
    **现在全毁了。**\n\n这里本应该有一个 `</u>` 来告诉浏览器<u>停止</u><u>下划线</u>...\n\n...这里本应该有一个 `</b>`\
    \ 来告诉浏览器<u>停止</u><u>加粗</u> —— 相反，它只是继续了下去。\n\n![一个沮丧的人对着电脑的卡通图](https://via.placeholder.com/100x100?text=Cartoon)\
    \ 粗体，错误，斜体，错误，下划线，错误\n\n**我的老师曾经用粗体、斜体和下划线叫我的名字...**\n这些格式化标签是为你的网页增添些许*特色*的<u>绝佳</u>方式，只要你不<u>忘记</u>结束标签。坚持练习它们，这会成为你的第二天性。<u>明白了吗？</u>\n\
    \n## 列表与其他小玩意\n\n**学习目标**\n\n我敢打赌你一直很想知道如何将网页上的内容组织成列表。别再找了。我甚至会额外提供一些花哨的文本格式化标签。\n\
    \n- 能够使用 `<ol>`、`<ul>` 和 `<li>` 来标记 `有序` 和 `无序` 列表。\n- 能够使用其他 `文本格式化标签`，如 `<mark>`\
    \ 和 `<s>`。\n\n## 列表是总结信息的好方法\n\n1. 在 HTML 中，`有序` 列表意味着 `按顺序排列`（例如 1、2、3 或 a、b、c）的列表\
    \ —— 它们用 `<ol>` 标记。\n2. `无序` 列表意味着 `项目符号` 列表 —— 它们用 `<ul>` 标记。\n3. 在这些 `<ol>`\
    \ 或 `<ul>` 标签内部，你为每个 `列表项` 添加一个 `<li>` 标签。\n\n你可以使用 CSS 更改列表的编号类型或项目符号样式。\n\n\
    ## 示例 使用 `<ol>`（有序列表）和 `<ul>`（无序列表）与 `<li>`（列表项）。\n\n最好将列表项（`<li>`）进行 `缩进`，以便清楚地表明它们位于列表\
    \ `内部`。\n你以 `相同的方式` 对 `两种类型` 的列表使用 `<li>`。\n\n```\n<h2>Here's an ordered list:</h2>\n\
    <ol>\n  <li>This is the top dog, woof</li>\n  <li>2nd the best?</li>\n</ol>\n\n\
    <h2>...and here's an unordered list:</h2>\n<ul>\n  <li>No favourites here, all\
    \ points are equal</li>\n  <li>See? They're all just regular bullets</li>\n</ul>\n\
    ```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_15_0.png)\n\n这是一个有序列表：\n1. 这是老大，汪汪\n\
    2. 第二最好？\n\n...这是一个无序列表：\n* 这里没有最爱，所有点都平等\n* 看？它们都是普通的项目符号\n\n**Q1** 以下示例最适合使用有序列表还是无序列表？\n\
    a) 最喜欢的五部电影。\nb) 管弦乐队中的乐器。\nc) 烹饪鸡肉的不同方法。\nd) 测试题。\n\n## 还有其他可以使用的 `文本标签`\n\n\
    - `<mark>` 和 `</mark>` `高亮` 文本。\n- `<s>` 和 `</s>` `删除线` 文本。\n- `<code>` 和 `</code>`\
    \ `将文本更改为代码字体`。\n- `<blockquote>` 和 `</blockquote>` `缩进文本以表明它是引用来源`。\n- `<sup>`\
    \ 和 `</sup>` `用于上标文本`。\n- `<sub>` 和 `</sub>` `用于下标文本`。\n\n**Q2** 重新创建此网页：\n* 让\
    \ `这个` 像这样显示\n* 哦，看看 `这个`\n* 看 `这个` 变得 `更高`\n\n如果我的房间是一个列表，它会是无序的那种...\n尝试一下这些文本格式化标签，看看你能想出什么。一个待办事项列表？一个食谱？或者也许你只是想用高亮文本给同学输入消息。\n\
    \n## 练习题\n\n### 热身\n\n- **Q1** HTML 中的“标签”是什么？\n- **Q2** 判断对错？HTML 元素是开始标签、一些内容和结束标签的组合。\n\
    - **Q3** `<h1>` 和 `<h2>` 标题看起来有什么不同？\n- **Q4** 为什么在代码中添加缩进和行间距是明智的？\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_16_0.png)\n\
    \n### 练习题\n\n**Q1** 这是所有 HTML 文件应具备的基本结构。使用方框中的术语完成标签。\n\n**可使用的术语：**\n`DOCTYPE\
    \ html`\n`/html`\n`body`\n`/p`\n`title`\n`head`\n`h1`\n\n*并非所有这些术语都需要在你的答案中使用。*\n\
    \n```\n<!.......................>\n<html>\n<.......................>\n<.......................>Summary</title>\n\
    </head>\n\n<.......................>\nMain page here.\n</body>\n\n<.......................>\n\
    ```\n\n**Q2** 解释 `<head>` 和 `<body>` 标签之间的区别。\n\n........................................................................................................\n\
    ........................................................................................................\n\
    ........................................................................................................\n\
    \n**Q3** 完成表格以显示每个标签的作用。\n\n| 开始标签 | 用途 |\n| :--- | :--- |\n| `<p>` | |\n| `<i>`\
    \ | |\n| `<ul>` | |\n\n**Q4** 列出下面代码中的三个错误。\n\n```\n<h1>My Page</h1>\n<paragraph>Welcome\
    \ to my site. Here's a fact about <b>me:</paragraph>\n<h2 When I eat my birthday\
    \ cake, I save the candles until last.</h2>\n```\n\n1. ........................................................................................................\n\
    2. ........................................................................................................\n\
    3. ........................................................................................................\n"
