  md: "# # Classes and IDs\n\n# ## IDs are unique to one element\n\nIDs are **similar\
    \ to** classes, but used with a **single element** only.\n\n```\nIn the style\
    \ sheet:\n#gold-medal {\n    background-color: Gold;\n    width: 200px;\n}\n```\n\
    \nIDs are used for more than just styling. For really long web pages, you can\
    \ add them to the end of hyperlinks, for example, `'index.html#eggs'`, and a web\
    \ browser will automatically scroll down the page to the place where the element\
    \ with the eggs ID is found.\n\nIf you give multiple elements the same ID, you\
    \ may not see any issues right away, but it'll cause problems once you start using\
    \ JavaScript — so stick to one element per ID.\n\nTo **assign your ID** to an\
    \ **element**, add the **id attribute** and set its **value** to your **ID name**\
    \ (without the hash).\n\n```\nIn the `<body>`:\n<h1>Tourney Results</h1>\n<ol>\n\
    \    <li id=\"gold-medal\">Sir Slaysalot</li>\n    <li>Biscuit 'Honey' Badger</li>\n\
    \    <li>Bill Shoesbury</li>\n</ol>\n```\n\n+   ### Tourney Results\n1. **Sir\
    \ Slaysalot**\n2. Biscuit 'Honey' Badger\n3. Bill Shoesbury.\n\nYou can't list\
    \ multiples IDs like you can with classes. But every element can have both an\
    \ ID and one or more classes.\n\n**Q1** Extend the example above to add silver\
    \ and bronze medal IDs, with appropriate styles, to the second and third list\
    \ items.\n\n# ## Classes and IDs are great for styling `<div>`s\n\n**EXAMPLE**\
    \ Styling `<div>`s with classes and IDs.\nfact is a class, so more facts with\
    \ the same style can be added to this page in their own `<div>` later.\n\n```\n\
    .fact {\n    background-color: Beige;\n    color: Green;\n}\n#fact-of-the-day\
    \ {\n    background-color: Green;\n    color: Beige;\n}\n#fact-of-the-day h3 {\n\
    \    color: Gold;\n}\nWriting the ID **before** `h3` means `color: Gold;` only\
    \ applies to `<h3>` elements that are **inside the element** with **that ID**.\n\
    ```\n\n```\n<div class=\"fact\">\n    <h3>Cone you believe it?</h3>\n    <p>The\
    \ most popular ice cream flavour is vanilla!</p>\n</div>\nfact-of-the-day is an\
    \ ID, so it should only be used with one element.\n<div id=\"fact-of-the-day\"\
    >\n    <h3>It's snow joke...</h3>\n    <p>The UK's coldest ever day was -27.2\
    \ °C.</p>\n</div>\n```\n\nCone you believe it?\nThe most popular ice cream flavour\
    \ is vanilla!\nIt's snow joke...\nThe UK's coldest ever day was -27.2 °C.\n\n\
    **Q2** Modify the example above to add a `<div>` that surrounds both `<div>`s.\
    \ Style it to change the font for both facts at the same time.\n\n**Q3** Restyle\
    \ the example on p.44 using a style sheet with an ID for each of the four divisions.\n\
    \n## IDig your style — you're a class act...\nA tag can belong to a class and\
    \ have an ID at the same time — in this case, if the class and ID both try to\
    \ style a particular property in different ways, then the ID's style will be the\
    \ one used. ID deal."
  merge: -1
