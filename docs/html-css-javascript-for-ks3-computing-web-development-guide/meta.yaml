- md: "## Worked Challenges\n\n### Worked Challenge 2 — Village Hall\n\nA village\
    \ hall has two exciting events coming up: a 'Tech Expo' where local companies\
    \ come to show off their newest gadgets, and a 'Book Fest' where famous authors\
    \ are coming in to give talks.\n\nCreate two web pages that can be used to promote\
    \ these events. You need to make sure:\n\n* Styling across the two pages is professional\
    \ and accessible.\n* There is consistent styling across both the pages.\n* There\
    \ is an image on each page.\n* There are links between the pages.\n\n### SOLUTION\n\
    \nPlan: Create an external style sheet for the styles that will be consistent\
    \ across each page. Then create an HTML file for each page, add the appropriate\
    \ information, images and links, and apply the styles.\n\n```\ntech-expo.html:\n\
    <head>\n    <title>Tech Expo</title>\n    <link rel=\"stylesheet\" href=\"styles.css\"\
    >\n</head>\n\n<body>\n    <h2><u>Come to the Tech Expo!</u></h2>\n    <div class=\"\
    info\">\n        <p>Try the newest gadgets in the hall soon.</p>\n        <p>There\
    \ will also be a <a href=\"book-fest.html\">Book Fest</a>.</p>\n    </div>\n\n\
    \    <div class=\"photo-frame\">\n        <img src=\"tablet.jpg\" width=\"200\"\
    \ alt=\"Tablet with wireless keyboard\">\n    </div>\n</body>\n```\n\n```\nstyles.css:\n\
    body {\n    font-family: Arial, sans-serif;\n    background-color: AliceBlue;\n\
    }\n.info {\n    color: DarkGreen;\n    font-family: Garamond, serif;\n}\n.photo-frame\
    \ {\n    border-style: double;\n    width: 200px;\n    padding: 6px;\n    background-color:\
    \ Beige;\n}\n```\n\n1. Add the `<link>` to connect to the style sheet.\n2. The\
    \ external style sheet uses two classes (.info and .photo-frame) to style the\
    \ relevant divisions of the web page.\n3. Use classes with `<div>`s to add styling\
    \ to different parts of your page.\n4. Add the HTML file name for internal links,\
    \ using a relative file path.\n5. Make sure you link to the same external style\
    \ sheet in the `<head>`, so that this page is styled the same as tech-expo.html.\n\
    \n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_82_0.png)\n\n```\nbook-fest.html\
    \ (<body> only):\n<h2><u>Come to the Book Fest!</u></h2>\n<div class=\"info\"\
    >\n    <p>Talks from famous authors in the hall soon.</p>\n    <p>There will also\
    \ be a <a href=\"tech-expo.html\">Tech Expo</a>.</p>\n</div>\n\n<div class=\"\
    photo-frame\">\n    <img src=\"books.jpg\" alt=\"Books on a shelf\" width=\"200\"\
    >\n</div>\n```\n\n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_82_1.png)\n\n6.\
    \ Add alt text to improve accessibility.\n\n## Independent Challenges\n\nRight,\
    \ you're on your own now*. Have a go at creating these web pages using what you've\
    \ learnt. The first couple of challenges cover content from **Sections 2-6**,\
    \ but feel free to stick in any of the more advanced web dev tricks you know to\
    \ get your pages looking slick. *Full example solutions are still provided at\
    \ cgpbooks.co.uk/biscuit\n\n### Challenge 1 — Environmental Awareness\n\nYour\
    \ school wants you to create a **single web page** that can be used to provide\
    \ **environmental advice** to incoming **Year 7s**. Your page should contain the\
    \ following **features**:\n\n- Three types of **HTML headings**.\n- Two types\
    \ of **HTML lists**.\n- Styling that fits the **theme** of environmental awareness,\
    \ using **internal CSS** and at least one example of **inline CSS**.\n- At least\
    \ **two images**, which are saved in a **folder** called 'images'.\n- An appropriate\
    \ **icon** (favicon).\n\n> Flick back to p.40 for a reminder about adding icons\
    \ to your web pages.\n\n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_83_0.png)\n\
    \n### Challenge 2 — Fan Pages\n\nA start-up company called 'Fandomz' is creating\
    \ a website that **showcases different bands**. They want you to **design the\
    \ website** with pages for their **first two featured bands**:\n\n**FUNKY WAV3**\
    \ are an **indie band** from Banff, Canada. Their music is **fast-paced**, **energetic**\
    \ and **positive**. They are well-known in North America, and are starting to\
    \ **broaden their fanbase** globally.\n\n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_83_1.png)\n\
    \n> Video Solution\nRemember, you can also find all video solutions at cgpbooks.co.uk/biscuit\n\
    \n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_83_2.png)\n\n**Eisensturm** are\
    \ a **heavy metal band** from Dortmund, Germany. They like writing songs that\
    \ are **loud** and **screamy**, and have a small, die-hard **group of fans**.\
    \ Their favourite colours range from **black** to **dark grey**.\n\nYour website\
    \ should:\n\n- Have a **home page** and a **navigation bar** — the same navigation\
    \ bar should be used on **each page** of the website.\n- A page for each of the\
    \ **two bands**, with:\n  - A '**Biography**' section containing **brief information**\
    \ about the band (you can make this up).\n  - An '**Image Gallery**' with a few\
    \ **relevant images** displayed on the page.\n  - A '**Contact**' section with\
    \ a **link** that opens up an **email** addressed to the band (this could be to,\
    \ e.g. one of the band members or a band manager).\n- Match the **styling** of\
    \ each page to the **bands' vibes**.\n\n> Go back to p.41 to see how to add a\
    \ navigation bar.\n\n## Independent Challenges\n\nChallenge 3 onwards will require\
    \ some JavaScript to get the pages working properly. They're a bit trickier than\
    \ the first couple of Challenges, so be sure to flick back through Sections 7\
    \ and 8 if you need any help.\n\n### Challenge 3 — Design a Birthday Card\n\n\
    Create a web page that lets the user **design** a birthday card. The **customisable\
    \ options** should include:\n\n- The **background colour**. Let the user choose\
    \ these by inputting a colour name.\n- The **colour** of the **text**.\n- The\
    \ **size** of the **text**. This should be **validated** so that it's between\
    \ **20 and 50 pixels** only.\n- The **font** (allow the user to pick from **three**).\n\
    - How the **text** is **aligned** (left, centre, or right).\n- The **content**\
    \ of the card (e.g. a \"To\" line, a birthday message, and a sign-off line).\n\
    \n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_84_0.png)\n\nThese options should\
    \ be **controlled** through an **input form**, with different **input fields**\
    \ for each of the **styling properties** and **lines of text** within the card.\
    \ Your page should show an **example** of what the card will look like, which\
    \ **changes** when the user **applies** their choices.\n\n### Challenge 4 — Time\
    \ Until\n\nCreate a web page that **calculates** and shows **how long** there\
    \ is to go (in months and days) until the **following events**:\n- The **new year**.\n\
    - The user's next **birthday** (the user should be able to enter this in).\n\n\
    You should **display** these as boxes across the screen, as shown below.\n\nThe\
    \ calendar is complicated, so to simplify this challenge, you can do rough calculations\
    \ by assuming each month has 31 days.\n\n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_84_1.png)\n\
    \nYou can choose the **colours** and **styles** yourself.\n\nHint: consider how\
    \ the calculation might differ when the user's birthday month is before the current\
    \ month, and when their birthday day is before the current day (which will also\
    \ have an effect on the month).\n\n### Challenge 5 — Randomised Maths Quiz\n\n\
    Create a web page to **prepare students** for the regional **mental maths quiz-off**.\
    \ Before writing any code, you can **pick one** of + - / or * to use for the **whole\
    \ quiz**.\n\nYour page should use a **form** that asks the user to set the question\
    \ **difficulty** — the options should be, e.g. **easy** numbers (from 1 to 10),\
    \ **medium** numbers (from 10 to 100), or **hard** numbers (from 100 to 1000).\n\
    \nThe page should then show a **single maths operation** that uses **random numbers**\
    \ in the user's **selected range** — they'll need another **form** to enter their\
    \ **answer**.\n\nIf the user gets this question **right**, their **score** should\
    \ **increase by one**, and **another question** should be shown. If the user gets\
    \ a question **wrong**, the quiz should **end** and their **final score** should\
    \ be **displayed**.\n\n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_84_2.png)\n\
    \n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_84_3.png)\n\n## Independent Challenges\n\
    \n### Challenge 6 — How Fast Can You...\n\nA games developer wants you to design\
    \ a website with three games all about speed. There should be a home page and\
    \ a page for each game, all linked with a navigation bar. The games are outlined\
    \ below — you’ll need to include instructions for each game on its page.\n\n####\
    \ How Fast Can You Click?\n\nIn this game, the player must click a button as many\
    \ times as they can in 10 seconds.\n\n- The page should show a big button that\
    \ starts a visible 10 second countdown when clicked.\n- The number of times the\
    \ user clicks the button in this time should be recorded.\n- Once the countdown\
    \ ends, the number of clicks should be shown to the user, and the button should\
    \ reset so the game can be played again.\n\n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_85_0.png)\n\
    \n#### How Fast Can You Type?\n\nIn this game, the player must type a sentence\
    \ shown on screen into an input field as fast as they can.\n\n- What the user\
    \ types should be shown 'live' below the input field.\n- The time from when they\
    \ started typing the sentence, to when they finished typing the sentence correctly\
    \ should be recorded.\n- This time should be displayed to the user, along with\
    \ their words per minute (WPM) score at the end of the game.\n\n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_85_1.png)\n\
    \n#### How Fast Can You React?\n\nIn this game, some dynamite will appear on a\
    \ button after a random amount of time — the user has to click on it as fast as\
    \ they can to defuse it.\n\n- The game should be controlled by a 'Begin' button\
    \ and a 'Reset' button.\n- As soon as the dynamite button appears, a timer should\
    \ be displayed on the screen (counting up in milliseconds).\n- When the user clicks\
    \ on the dynamite button, the graphic should change to show that it has been defused,\
    \ and the timer should stop to show the user's reaction time.\n\n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_85_2.png)"
