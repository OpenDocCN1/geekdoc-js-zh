    \n## 导航栏本质上就是经过美化的列表\n\n-   通过一些巧妙的CSS，你可以把一个单调的HTML列表变成一个酷炫的导航栏。\n-   此示例使用了高级属性（在第六节中讲解），所以现在不必急于理解其工作原理——你可以直接复制下面的样式表，然后根据你的网页设计修改字体和颜色。\n\
    \n```css\nul {\n  background-color: LimeGreen;\n  list-style-type: none;\n  margin:\
    \ 0px;\n  padding: 0px;\n  overflow: hidden;\n}\nli a {\n  text-decoration: none;\n\
    \  text-align: center;\n  padding: 14px 20px;\n  display: block;\n  float: left;\n\
    }\nli a:hover {\n  background-color: Yellow;\n}\n```\n\n```html\n<ul>\n  <li><a\
    \ href=\"#\">Home</a></li>\n  <li><a href=\"#\">Aliens</a></li>\n  <li><a href=\"\
    #\">Evidence</a></li>\n</ul>\n```\n\n![绿色水平导航栏，包含三个链接](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_44_1.png)\n\
    \n> 快来加入我的导航栏——我会在台球桌旁 :hover 等你...\n\n尽情尝试导航栏吧，但请注意——在第六节你学会使用ID之前，上面示例中的样式会应用于页面上任何\
    \ `<ul>` 列表元素。\n\n## 练习题\n\n### 热身\n\nQ1 以下CSS类型应放在哪里？\na) style 属性？\nb) <style>\
    \ 标签？\nc) 单独的文件？\n\n![答案占位符](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_45_0.png)\n\n\
    Q2 编写CSS时，“颜色选择器”为什么有用？\n\nQ3 什么使一个超链接成为“已访问”状态？\n\nQ4 除了链接外部样式表，<link> 标签还可以用于什么？\n\
    \n### 练习题\n\nQ1 圈出并描述下面代码中的三个错误。\n\n```html\n<head>\n    <style>\n        h1 {\n\
    \            background-color: @7771F0,\n            color: White;\n        }\n\
    \    </style>\n</head>\n<body>\n    <h1>Heading for Trouble</h1>\n</body>\n```\n\
    \n1. ....................................................................................\n\
    2. ....................................................................................\n\
    3. ....................................................................................\n\
    \nQ2 看右侧的代码。\n\na) 以下这行代码的效果是什么？\n`a { text-decoration: none; }`\n....................................................................................\n\
    \n```html\n<head>\n    <style>\n        a { text-decoration: none; }\n       \
    \ a:link { color: Blue; }\n        a:visited { color: DarkOrange; }\n        a:hover{\
    \ background-color: Red; }\n    </style>\n</head>\n<body>\n    <a href=\"https://www.bbc.co.uk/\"\
    >\n        Click me</a>, thank you.\n</body>\n```\n\nb) 链接被点击后，“Click me”文本会变成什么颜色？\n\
    ....................................................................................\n\
    \nc) 提出一个能提高页面可访问性的修改建议。\n....................................................................................\n\
    \nQ3 何时应该使用外部CSS而非内部CSS？\n\nQ4 补全下面的代码，使 styles.css 用于样式化该网页。\n\n```html\n<head>\n\
    \    <________ rel=\"____\" ________=\"styles.css\">\n</head>\n```\n\n第五节 — 样式表\n\
    \n![答案占位符](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_45_1.png)\n\n## 第五节的编码挑战\n\n我看到你已经准备好迎接更多挑战了，所以这就为你奉上——我最拿手的三个。全部搞定后，访问\
    \ cgpbooks.co.uk/biscuit 下载每个挑战的示例代码，看看你做得有多棒。\n\n## 挑战 1 — 示例\n\n需要创建一个具有以下设计的超链接：\n\
    \n- 显示文本“Click me!”，字体为白色Arial，大小20px，无下划线。\n- 通常，其背景为“蓝色”。\n- 被访问后，其背景变为“紫色”。\n\
    - 鼠标悬停时，其背景变为浅蓝色（自选）。\n\n![设计占位符](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_46_0.png)\n\
    \n## 挑战 2\n\n创建一个学校用来展示其社团的网站。\n\n应有一个导航栏，包含指向以下每个社团单独网页的链接，以及返回主页的链接。\n\n- 编程社\
    \ — F.1.3教室，由 Ms Key-Bordia 负责。\n- 舞蹈社 — M.2.7教室，由 Mr Maca 和 Ms Rena 负责。\n- 篮球社\
    \ — 在体育馆，由 Coach Dunk 带领。\n\n每个社团的页面应显示其教室、负责老师、相关图片，并且应有独特的样式。\n\n![设计占位符](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_46_1.png)\n\
    \n## 挑战 3\n\n创建一个简单测验的网站。\n\n- 主页应至少包含两个选择题——如右侧示例所示。\n- 当用户点击答案时，应跳转到两个页面之一，告知其是否正确。这两个页面都应链接回主页。\n\
    - 该网站设计为多人共用一台电脑使用，因此为避免泄露正确答案，应将已访问和未访问链接样式设置为相同。\n- 应使用外部样式表，确保所有三个页面使用相同的字体。\n\
    \n![设计占位符](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_46_2.png)\n\n## 第六节 — 高级HTML与CSS\n\
    \n### div 标签\n\n#### 学习目标\n\n<div> 标签可以帮助你制作出炫酷的网页，将你所有的HTML组织成清晰整洁的区域——这是双赢的局面，请继续阅读。\n\
    \n- 理解 <div> 标签的用途。\n- 能够使用 <div> 标签来标记网页的不同区域。\n\n## <div> 是其他标签的容器\n\n1.  网页通常具有类似的结构，可以被分解成更小的部分。\n\
    2.  这些更小的部分被称为分区（divisions）——它们通常是相关的内容块。\n3.  可以使用 <div> 标签来标记它们。\n4.  分区（或“<div>s”）很有用，因为它们：\n\
    \   - 有助于让你的代码更有条理。\n   - 可以单独设置样式（见第46页）。\n\n| 区域 | 示例 |\n|---|---|\n| 页头 | 例如名称、标志、口号/标语等。\
    \ |\n| 导航栏 | |\n| 主内容 | |\n| 页脚 | 例如版权信息、联系信息等。 |\n\nHTML还有特定的标签可以用于这些区域——例如 <header>、<nav>、<main>\
    \ 和 <footer>。它们有助于搜索引擎等理解你的页面。在本节中我们使用 <div> 标签是为了简化说明。\n\n#### 示例\n\n一个典型的网页，包含四个分区：页头、导航栏、主内容和页脚。这是页头分区。这四个分区中的每一个都使用\
    \ <div> 标签进行标记。\n\n```html\n<div style=\"background-color: Yellow; text-align:\
    \ center;\">\n  <h1>Alien Watch!</h1>\n</div>\n<!-- 导航栏分区。 -->\n<div style=\"\
    border-style: solid;\">\n  <ul>\n    <li><a href=\"#\">Home</a></li>\n    <li><a\
    \ href=\"#\">Aliens</a></li>\n    <li><a href=\"#\">Evidence</a></li>\n  </ul>\n\
    </div>\n<!-- 主内容分区。 -->\n<div style=\"font-family: Arial, sans-serif;\">\n  <p>I've\
    \ learnt the truth.</p>\n  <p>Their secrets will be revealed.</p>\n</div>\n<!--\
    \ 页脚分区。 -->\n<div style=\"font-size: 75%; text-align: center;\">\n  <p>&copy;\
    \ <i>Alien Watcher</i> 2023</p>\n</div>\n```\n\n未显示：导航栏使用了第41页的样式表进行样式化。\n\n在HTML中可以使用像这样的代码插入特殊符号——网页浏览器会将\
    \ &copy; 替换为 ©（版权符号）。\n\n每个分区都使用内联CSS赋予了其独特的样式。\n\n5.  上面的示例中使用了内联CSS来设置分区的样式。如果你想改用内部或外部CSS，则需要一种方法来单独设置每个\
    \ <div> 标签的样式——下一页将向你展示如何做到这一点。\n\nQ1 从本节的代码文件中，在你的网页浏览器中打开“divTags-Q1.html”页面。根据你看到的分区来描述页面的结构。\n\
    \n### 我喜欢你编写页面代码的方式——它简直是<div>妙无比...\n\n关于如何使用 <div> 标签，并没有硬性的规定。内容可以进一步分解，形成分区套分区——这通常取决于样式需要如何设置。\n"
