  md: "# Internal Hyperlinks\n\nLearning Objectives\n\nSo that's external hyperlinks\
    \ covered, but what about navigating between your own web pages? Well, well, well.\
    \ If it isn't your lucky day — a whole page on internal hyperlinks.\n\n+   - Be\
    \ able to use <a> tags to mark up links to your own web pages.\n- Understand why\
    \ relative file paths are needed for internal hyperlinks.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_33_0.png)\n\
    \n# Internal links take you around a website\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_33_1.png)\n\
    \n+   1. Most websites are made up of multiple web pages, all joined together\
    \ by internal hyperlinks.\n2. The user can click on these links to take them to\
    \ the part of the website they need to go to.\n\nEXAMPLE Create links using <a>\
    \ tags — set the href attribute to the page you're linking to.\n\nA web page called\
    \ \"innocent-button.html\":\n\n```\n<body style=\"text-align: center;\">\n  <h3>You\
    \ found a button.</h3>\n  <p><a href=\"button-pressed.html\">Press it</a>?</p>\n\
    \  <img src=\"button.png\" width=\"100\">\n</body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_33_2.png)\n\
    \nSet the href as the file name of your other web page.\n\nClicking this link\
    \ will take you to your other web page.\n\nA web page called \"button-pressed.html\"\
    :\n\n```\n<body style=\"background-color: Red; text-align: center;\">\n  <h1 style=\"\
    font-family: Impact, sans-serif;\">Whoops</h1>\n  <p style=\"font-family: Arial,\
    \ sans-serif;\">\n    You shouldn't have<br>pressed the button.</p>\n  <img src=\"\
    button-activated.png\" width=\"150\">\n</body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_33_3.png)\n\
    \nQ1 Extend this code to include a link back to the first web page.\n\n# Use relative\
    \ file paths instead of absolute ones\n\n+   - When you add an internal link or\
    \ an image to a web page, you need to tell the web browser where it is.\n- A relative\
    \ file path says where to look starting from the folder your web page is currently\
    \ saved in.\n\n```\n<a href=\"about.html\">Learn more!</a>\n<img src=\"images/logo.jpg\"\
    >\n```\n\nThis says that 'about.html' is in the same folder as the current page\
    \ (index.html).\n\nThis says 'logo.jpg' is in the 'images' folder.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_33_4.png)\n\
    \n+   - These relative file paths will work on other computers — including web\
    \ servers.\n- Don't use an absolute file path — this is a full path, and it only\
    \ works on your computer.\n\nCOMMON PROBLEMS\n\n```\n<a href=\"C:\\Users\\CGP\\\
    Documents\\web-project-1\\about.html\">Learn more!</a>\n```\n\nLinks like this\
    \ are no good for real websites where the files are stored on a web server.\n\n\
    # I use relatives' file paths — my sister is a lot more organised...\n\nIt might\
    \ take a few tries to get your hyperlinks working. If you run into any issues,\
    \ check the files for your web pages are in the same folder, and that the file\
    \ names match up to what href is set to.\n\nSection Four — Creating Multi-Page\
    \ Websites"
  merge: -1
  pgno: 33
