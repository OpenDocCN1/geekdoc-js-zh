  - "[PAGE 70]\n\n# Input Fields and Forms\n\n# Use JavaScript to read inputted values\n\
    \n1) Working with forms in JavaScript is simple — you can use document.getElementById()\
    \ to access the input fields, then add .value to get the inputted data.\n2) The\
    \ example below extends the form from the previous page. Once completed, the form\
    \ will behave like this:\n• When clicked, the 'Enter' button will call a function\
    \ that handles the data in the form.\n• The function will read the values of the\
    \ input fields and then check if the 'Secret Code' is correct.\n• An alert will\
    \ pop up with an appropriate message and if the 'Secret Code' is correct, a link\
    \ will be revealed.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_70_0.png)\n\n\
    EXAMPLE Psst... the secret code is \"1234\" but feel free to change it.\n\nStep\
    \ 1 — Make the following changes to the HTML:\nUse the same code for the input\
    \ fields as before.\nAdd an <a> tag with an id, but don't set its href attribute\
    \ or include any text — the user will see nothing to begin with.\nSet the onclick\
    \ attribute of the button to call a function that will handle the data in the\
    \ form.\nAdd <script> tags.\n\n```\n<form>\n  <label> ... \n  <button type=\"\
    button\" onclick=\"checkForm()\">Enter</button>\n</form>\n<p><a id=\"secret-link\"\
    ></a></p>\n<script> ... </script>\n```\n\nStep 2 — Add the JavaScript between\
    \ the <script> tags:\ndocument.getElementById() is used to access the input fields\
    \ and .value is added to get the inputted data.\n\n```\nfunction checkForm() {\n\
    \    let name = document.getElementById(\"name\").value;\n    let code = document.getElementById(\"\
    code\").value;\n\n    if (code == \"1234\") {\n        alert(\"Welcome, \" + name\
    \ + \"! Access granted.\");\n        let secretLink = document.getElementById(\"\
    secret-link\");\n        secretLink.innerHTML = \"Enter secret page\";\n     \
    \   secretLink.href = \"secret-page.html\";\n    }\n    else {\n        alert(\"\
    Wrong code, \" + name + \"! Access denied.\");\n    }\n}\n```\n\nThe inputted\
    \ code is compared to this secret code to check whether it's a match.\nIf a correct\
    \ code is inputted, the hyperlink is changed so that it can be seen by the user\
    \ and clicked to enter the secret page.\nIf a wrong code is inputted, the user\
    \ is alerted but the hyperlink stays empty.\nThis isn't very secure because the\
    \ \"secret code\" is visible to anyone who inspects the source code of your web\
    \ page, and there's nothing stopping someone from visiting the secret page if\
    \ they know the URL. On a real website, the form data would be sent to a web server,\
    \ which would process it privately and keep track of which users have been granted\
    \ access.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_70_1.png)\n\n> Q2 Modify\
    \ the random number guessing game from Q1 on p.65 to use a form with an input\
    \ field, instead of a prompt. The user should be able to continue guessing until\
    \ they get the correct number.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_70_2.png)\n\
    \nI was a beast on the putting field the other day — on top form...\nThe value\
    \ attribute can be set directly in your HTML — this means the input field can\
    \ be filled in already when the page loads, e.g. <input type=\"password\" value=\"\
    blond007\">."
  - "[PAGE 71]\n\n# More Input Fields\n\nNow playing on HTML FM, \"Check your tags\"\
    , by Inny Putt and the Fields. Here are a couple more input fields to play with,\
    \ and two attributes thrown in for good measure.\n\n+   - Be able to use `<input>`\
    \ to mark up radio buttons and checkboxes.\n- Be able to use the `checked` and\
    \ `disabled` HTML attributes.\n\n# A radio button is a multiple choice input field\n\
    \nThe radio input field lets the user make a single choice from a set of options.\n\
    \nRadio buttons are grouped together using the name attribute — only one radio\
    \ button in each group can be selected at once.\n\n```\n<p>Pineapple on pizza?</p>\n\
    <form>\n  <input type=\"radio\" name=\"pineapple\" id=\"yes\">\n  <label for=\"\
    yes\">Yes</label><br>\n  <input type=\"radio\" name=\"pineapple\" id=\"no\">\n\
    \  <label for=\"no\">No</label><br>\n  <button type=\"button\" onclick=\"vote()\"\
    >Vote</button>\n</form>\n<script>\n  ...\n</script>\n\nfunction vote() {\n  let\
    \ yes = document.getElementById(\"yes\");\n  if (yes.checked == true) {\n    alert(\"\
    Oh my!\");\n  }\n}\n```\n\nThe type of a radio button is just `radio`. It's common\
    \ in web design to put the `label` after the corresponding radio button.\n\nThe\
    \ `checked` attribute is `true` if the option is `selected`.\n\nWhen the page\
    \ first loads, neither option is `checked`.\n\nClicking on the radio button itself\
    \ or on its `label` will `select` it.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_71_0.png)\n\
    \n+   - In the HTML, an `<input>` tag for a radio button can have its `checked`\
    \ attribute set, so that it starts off checked when the page first loads.\n- You\
    \ don't write a value — its presence alone means .checked is `initially true`\
    \ in JavaScript and its absence means .checked is `initially false`.\n\n```\n\
    <input type=\"radio\" checked>\n```\n\nThis also works for checkboxes (see below).\n\
    \n# Checkboxes are also multiple choice\n\nThe checkbox input field lets the user\
    \ make one or more choices from a set of options.\n\nEach option is a pair of\
    \ `<input>` and `<label>` tags.\n\n```\n<input type=\"checkbox\" id=\"pineapple\"\
    >\n<label for=\"pineapple\">Pineapple</label>\n\nfunction vote() {\n  let voteBtn\
    \ = document.getElementById(\"vote-btn\");\n  voteBtn.disabled = true;\n}\n```\n\
    \nYou don't need to set the `name` attribute for `checkboxes`.\n\nThis script\
    \ disables the 'Vote' button after it's clicked.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_71_1.png)\n\
    \nUnlike radio buttons, multiple checkboxes can be `selected` at the same time.\n\
    \nLike `checked`, **you can set the `disabled` attribute in HTML by writing only\
    \ the attribute name in `<input>` or `<button>` tags.**\n\nYou can alter the look\
    \ of disabled elements in CSS using the :disabled pseudo-class —\ne.g. `voteBtn:disabled\
    \ { color: Red; }`\n\n# I'll be honest — I checked out at the first mention of\
    \ pizza...\n\nIn JavaScript, you can check / uncheck a radio button or checkbox\
    \ by setting the `checked` attribute to `true` / `false`. You can also enable\
    \ an element again by setting the `disabled` attribute to `false`.\n\nSection\
    \ Eight — Advanced JavaScript"
