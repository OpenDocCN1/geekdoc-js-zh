  md: "# Section Nine — Longer Challenges\n\n# Worked Challenges\n\nTime for you to\
    \ create some bigger and better web pages. The challenges in this section are\
    \ designed to take you a bit longer, and test what you've learnt across multiple\
    \ sections. You can always extend them with your own ideas too. And remember,\
    \ visit cgpbooks.co.uk/biscuit to get the full example code for each challenge.\n\
    \n# Top tips for web development\n\nBefore you embark on your development quest,\
    \ here's a bit of advice:\n\n+   1) Read the challenges carefully before getting\
    \ started.\n2) A bit of planning can go a long way.\n   - Break the challenge\
    \ down into smaller parts to work through.\n   - Sketch out your web pages on\
    \ paper to help you decide on the styling.\n   - Flick back though the book to\
    \ decide which techniques need to be used.\n3) Save copies of your work regularly\
    \ and use a new file name for bigger changes (e.g. index-v2.html). That way you\
    \ can go back to an older version if you need to.\n4) Test your page after writing\
    \ each block of code — save it and reload the page in your browser.\n5) Remember,\
    \ with HTML and CSS, you often don't get any big error messages — if things aren't\
    \ quite working, look for the usual suspects: tags not closed properly, quotes\
    \ not used, misspelt words, missing brackets... it's a long list. Just make sure\
    \ you check your code carefully.\n\nHere are two worked challenges to begin with.\
    \ Give them a go, then see a solution underneath.\nAs always, don't forget to\
    \ visit the link on the contents page to download code files for all the challenges.\n\
    \n# Worked Challenge 1 — Create a Username\n\nIona Naccount needs a web page that\
    \ can create a username from an adjective, a noun and a randomly-generated number\
    \ from 1 to 30.\nThese details should be entered using a form, then combined together\
    \ into a single string (e.g. HeroicBat15), and output as an alert.\n\n> In case\
    \ HTML has replaced English in your brain, an adjective is a describing word (e.g.\
    \ heroic), and a noun is a thing (e.g. a bat or a man).\n\n```\n<form>\n    <label\
    \ for=\"adjective\">Adjective:</label>\n    <input type=\"text\" id=\"adjective\"\
    >\n    <br><label for=\"noun\">Noun:</label>\n    <input type=\"text\" id=\"noun\"\
    >\n    <br><button type=\"button\" onclick=\"generateUsername()\">\n    Generate\
    \ username</button>\n</form>\n<script>\n    function generateUsername() {\n  \
    \      let adjective = document.getElementById(\"adjective\").value;\n       \
    \ let noun = document.getElementById(\"noun\").value;\n        let randomNumber\
    \ = Math.floor(Math.random() * 30) + 1;\n        let username = adjective + noun\
    \ + randomNumber;\n        alert(\"Your generated username: \" + username);\n\
    \    }\n</script>\n```"
