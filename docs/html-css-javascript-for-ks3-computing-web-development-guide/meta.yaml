    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_37_1.png)\n\n```\n<a href=\"index.html\"\
    >\n    <img src=\"images/home.png\" alt=\"Home button\" width=\"50\"></a>\n\n\
    <a href=\"https://youtube.com/@CGPBooksVideos\">\n    <img src=\"images/play.png\"\
    \ alt=\"Play button\" width=\"50\"></a>\n\n<a href=\"mailto:IAmReallyFamous@azmail.co.uk\"\
    >\n    <img src=\"images/email.png\" alt=\"Email button\" width=\"50\"></a>\n\
    ```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_37_2.png)\n\n**SOLUTION**\n**Plan:**\
    \ Download and save the icons to an 'images' folder, then set an appropriate hyperlink\
    \ for each one (one internal, one external and one email).\n\n### Challenge 2\n\
    \nYour friend has been tasked with making a [fact-file](http://fact-file) on [three\
