    Advantage: ...........................................................................................................................................................................\n\
    Disadvantage: ...........................................................................................................................................................................\n\
    \n## Section Two — HTML Foundations\n### HTML Tags\n\nTag — you're It. And by\
    \ 'It', I mean the person who's going to be learning all about the language that\
    \ forms the foundation for all web pages. Oh, please, no need to clap.\n\n+  \
    \ * Understand what HTML stands for and what it's used for.\n* Learn about HTML\
    \ tags and elements.\n\n### HTML forms the foundation for your pages\n\n+   1)\
    \ A British computer scientist called Tim Berners-Lee came up with the concept\
    \ of the Web in 1989 — the main language of the web, HTML, came shortly afterwards.\n\
    2) Modern web pages usually use a few different coding languages, but the one\
    \ they all have in common is HTML.\n3) HTML describes the structure of a web page.\n\
    4) It's used to 'mark up' the main elements of the content — like headings, paragraphs,\
    \ images, etc.\n5) A web browser will use the HTML to set out the page when it's\
    \ viewed.\n\nHTML stands for HyperText Markup Language. In HTML, 'mark up' just\
    \ means to label content by adding tags, like in the example below.\n\n### HTML\
    \ consists of lots of tags\n\n+   * The way HTML marks up different elements is\
    \ through tags.\n* Tags usually come in pairs — an opening tag marks up the start\
    \ of an element, and a closing tag marks up the end of an element.\n\nEXAMPLE\
    \ Here's how a typical bit of HTML code will look.\n\nThis is an opening tag —\
    \ a word surrounded by angle brackets.\n\nThis is the content — it's surrounded\
    \ by the tags.\n\nThis is the closing tag. It's the same as the opening one but\
    \ with a forward slash before the word.\n\nSome tags don't have a closing tag,\
    \ but this is rare — see p.14.\n\n```\n<html>\nHyperText Markup Language. Learn\
    \ this!\n</html>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_11_0.png)\n\n\
    This whole thing (both tags and the content) is called an element.\n\nYou'll learn\
    \ to change how the content looks using CSS in the next section.\n\nHere's how\
    \ this code should look when opened in a web browser — the browser doesn't show\
    \ the tags.\n\nQ1 Another example of a HTML opening tag is <u>. Suggest what the\
    \ closing tag is.\n\nGermans love HTML — but only if the tags are guten...\n\n\
    When designing a web page, think about which parts of your content need marking\
    \ up — what are the key components you want to stand out? We'll go over how to\
    \ do this on the next few pages.\n\n### Head and Body\n\nHere we go again. It's\
    \ time to get to grips with splitting your code up into heads and bodies. We're\
    \ not going all biological though — no need to pick up a scalpel...\n\n+   - Understand\
    \ the standard structure of a web page.\n- Understand the purpose of the <head>,\
    \ <body> and <title> tags.\n- Learn how indentation makes code easier to read.\n\
    \n### Web pages have a standard structure\n\nEvery time you make a web page you\
    \ should write a few tags before you get started. These are in addition to the\
    \ <html> tags you saw on the previous page.\n\nHere are some tags to set out the\
    \ standard part of a web page.\n\nThe downloadable HTML files for this book all\
    \ contain an extra line in the <head> that begins: `<meta name=\"viewport\"...`\
    \ It resizes the web page to look bigger on small screens, like phones and tablets.\
    \ You can use it too — it's optional.\n\nThis just tells the browser that you're\
    \ using HTML — you should include it on every page. It doesn't have a closing\
    \ tag.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>My Wonderful Page</title>\n\
    </head>\n<body>\n  OK, it's not that wonderful. Yet...\n</body>\n</html>\n```\n\
    \nThe <head> contains information about the web page, but no content that goes\
    \ on the page itself.\n\nThe <body> contains all elements that will be visible\
    \ to the user on the page.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_12_0.png)\n\
    \nThis is the 'title' that the <title> tag is setting — it's what you see on the\
    \ browser tab. As it's set in the <head>, it isn't seen on the page itself.\n\n\
    ### Adding gaps makes code easier to read\n\n+   1) A gap at the start of a line\
    \ is called an indent.\n2) It's a good idea to indent when you're using a tag\
    \ inside another tag, because it makes it clearer — e.g. in the code above, it's\
    \ obvious that <title> is inside the <head>.\n3) Adding extra spacing in the code\
    \ doesn't change how the page looks, but it reads more nicely.\n\nYou can use\
    \ the Tab key to add an indent.\n\n```\n<!DOCTYPE html><html><head>\n<title>My\
    \ Wonderful Page</title></head><body>\nOK, it's not that wonderful. Yet...</body></html>\n\
    ```\n\nThis code makes the same web page as the example above, but it's harder\
    \ to read without those lovely indents and gaps.\n\nLike a bodybuilder, most of\
    \ our dev work goes into our <body>... We'll add to the <head> more in later sections,\
    \ but for now the <body> is key because that's what the user sees. Remember to\
    \ include the standard structure in all your code from this point."
  mdcn: "\n## 为 Web 开发\n\n### 代码编辑器拥有实用的功能\n\n1) 像记事本或 TextEdit 这样的文本编辑器完全适用于本书，但就功能而言，它们相当基础。\n\
    2) 代码编辑器是高级文本编辑器，具备以下功能来帮助你：\n   * 它们可以为代码添加颜色进行高亮显示——使其更易阅读。\n   * 一些编辑器具有自动完成功能，可以预测你正在输入的代码。\n\
    \   * 它们还可能进行自动格式化，甚至错误纠正。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_9_0.png)\n\
    \n### 一些是桌面应用程序...\n\n* 本书中一些即将出现的编程挑战的视频解决方案展示了 Notepad++，这是一款适用于 Windows® 的免费代码编辑器。\n\
    * 一些代码编辑器可在 Windows®、macOS 和 Linux® 上使用，例如 Visual Studio Code 和 Brackets（均免费）以及\
    \ Sublime Text（可免费试用）。\n* 每个编辑器看起来都会有所不同，因为它们使用不同的字体和颜色，但它们都允许你使用相同的编程语言编写网页。\n\
    \n也有很多手机应用可以让你编写代码——这里列出的许多网络应用在桌面和移动设备上都能使用。\n\n### ...而一些是网络应用\n\n* 还有一些网络应用，可以让你在网页浏览器中编写代码。\n\
    * 一些流行的基于浏览器的编辑器是 w3schools.com、jsfiddle.net 和 replit.com。\n* 它们的好处在于通常可以将代码和生成的网页并排显示。\n\
    * 然而，它们并不总是能轻松地保存或加载代码，因此对于较大的项目，坚持使用桌面程序可能更好。\n\n### 将网站发布到 Web 上并不容易\n\n1) 保存在你电脑上的网页实际上并不在\
    \ Web 上——只有你自己可以访问它们。\n2) 创建一个可在整个互联网上访问的网站涉及几个步骤：\n   * 购买一个域名。\n   * 从网络托管公司租用网络服务器上的空间。\n\
    \   * 将你的域名连接到网络服务器。\n   * 将你的代码文件上传到网络服务器。\n3) 这一切都需要花钱，但在你刚开始时并非必须。\n4) 有免费的网络托管服务可用，但使用它们有缺点——例如，你的网站上可能会出现不想要的广告。\n\
    \n你不需要将任何内容发布到 Web 上来学习本书——所有内容都可以在你的电脑上完成。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_9_1.png)\n\
