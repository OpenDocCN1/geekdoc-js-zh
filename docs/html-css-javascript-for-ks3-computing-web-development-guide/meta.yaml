  md: '# Quick Reference Guide


    # Key CSS properties


    Don''t underestimate the importance of **style** — here are some useful **CSS
    properties** you''ll find in this book.


    | Property | Description | Example(s) |

    |---|---|---|

    | border-style | Applies a border around an element. | border-style: dashed; |

    | color | Sets the colour of text for an element. | color: #00BFF; |

    | background-color | Sets the background colour of elements, or the whole page
    if set for <body>. | background-color: DarkRed; |

    | font-family | Sets a list of font families used for the text in an element,
    ordered by preference. | font-family: Georgia, serif; |

    | font-size | Sets the size of text for an element. | font-size: 200%; font-size:
    10px; |

    | text-align | Sets the alignment of text, e.g. left, right, centre. | text-align:
    center; |

    | width and height | Sets the size of an element. | width: 50%; height: 30px;
    |

    | margin | Sets the size of the empty space that surrounds an element, outside
    of its border. | margin: 20px; |

    | padding | Sets the size of the empty space within the borders of an element.
    | padding: 30px; |


    # Key bits of JavaScript code


    You can do loads with **JavaScript** — here are some helpful bits of **code**
    for all beginners.


    | Code | Description |

    |---|---|

    | let variable = document.getElementById("ID"); variable.innerHTML = "New text";
    variable.style.property = "New value"; variable.attribute = "New value"; | Names
    a new variable that accesses the element with the ID given in brackets. Changes
    the text in that element. Gives a new value to a property. Gives a new value to
    an attribute. |

    | if (condition) { do this } | Selection code that only runs if the condition
    is true. |

    | else if (condition) { do this } | Selection code that only runs if the condition
    is true and the previous conditions are false. |

    | else { do this instead } | Selection code that only runs if all previous conditions
    are false. |

    | function myFunction() { my function does this } | Allows a user to name their
    own function and define what it does. |

    | myFunction(); | Calls (runs the code of) a defined function. |'
