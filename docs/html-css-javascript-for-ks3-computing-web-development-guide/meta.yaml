    \ support the same colours\n\n+   * There are over a hundred colour names that\
    \ all modern web browsers agree on.\n* This means users will see the correct colours\
    \ no matter which browser they're using.\n\n> These are my favourites — for many\
    \ more, look at ColourNames.txt in the downloadable files for this section.\n\n\
    | HotPink | BlanchedAlmond | Honeydew | PowderBlue |\n|---|---|---|---|\n| FireBrick\
    \ | SandyBrown | SeaGreen | MidnightBlue |\n\n**Ugh, Ms BlanchedAlmond gave out\
    \ sooooo much homework...**\nIf you change the style of an element, it may change\
    \ things inside it too. E.g. adding `color` to `<ul>` will affect all the list\
    \ items — but you can still add a different `color` to individual list items.\n\
    \nSection Three — Adding Style with CSS"
  - "[PAGE 24]\n\n# # Background Colours\n\n> **Learning Objectives**\n\nThe best\
    \ part of a movie is what's going on in the background — and I'm not just saying\
    \ that because I've yet to land a big role. Anyway, I feel the same way about\
    \ web pages.\n\n- Be able to use the `background-color` property to fill backgrounds.\n\
    - Learn that you can use multiple CSS properties with one element.\n\n# ## Colour\
    \ backgrounds with background-color\n\nYou can colour the background of any element\
    \ using the `background-color` property.\n\n**EXAMPLE** Filling the background\
    \ of two bits of paragraph text.\n\nYou can use all the same colours as the `color`\
    \ property uses.\n\n```\n<p style=\"background-color: Yellow;\">How does a CSS\
    \ coder choose a house?</p>\n<p style=\"background-color: LightGrey;\">By comparing\
    \ property values...</p>\n```\n\n**How does a CSS coder choose a house?**\n\n\
    By comparing property values...\n\n> You can think of every HTML element as being\
    \ contained inside a box — it's usually invisible unless you change a style like\
    \ `background-color` or `border-style`. See p.47 for more about this.\n\n# ##\
    \ Add it to `<body>` to fill the whole page\n\n+   1) If you want to fill the\
    \ entire page with colour, just set `background-color` in the `<body>` tag.\n\
    2) You can still change the `background-color` of other elements if you want them\
    \ to be different.\n\n**EXAMPLE** How to fill the whole page in one easy move.\n\
    \nThe background of elements is transparent unless it's changed, so setting `background-color`\
    \ in `<body>` has the effect of filling the entire page...\n\n...except for this\
    \ italic text, as the `<i>` tag has its own `background-color` set.\n\n```\n<body\
    \ style=\"background-color: LightBlue;\">\n    <h1>Breaking News: Everything is\
    \ Blue!</h1>\n    <p>Apart from\n        <i style=\"background-color: Orange;\"\
    >this</i>.\n    </p>\n</body>\n```\n\n**Breaking News: Everything is Blue!**\n\
    \nApart from *this*.\n\n# ## You can mix and match style properties\n\nIf you\
    \ want to use multiple style properties, just put them one after the other.\n\n\
    ```\n<p style=\"background-color: Yellow; color: Red; border-style: dashed;\"\
    >\n    <b>Caution: this code runs hot!</b>\n</p>\n```\n\n> The `color` property\
    \ changes the border's colour too, but you can set that separately using the `border-colour`\
    \ property.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_24_0.png)\n\n> **Pssst\
    \ over here — let me fill you in on a little secret...**\n\nDon't forget the accessible\
    \ design principles on page 18 — if you change one of the `color` or `background-color`\
    \ properties, then think about whether you need to change the other one too."
