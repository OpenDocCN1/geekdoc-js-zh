- md: "# Images\n\nRight, let's spice things up a bit, shall we? Time to learn how\
    \ to add an image or two to your web pages. A bit of file management is needed,\
    \ but the results are worth it.\n\n- Be able to use the `<img>` tag to mark up\
    \ images.\n- Be able to use the `src`, `width` and `height` attributes.\n\n##\
    \ Use the `<img>` tag to add images\n\nHere's how you use HTML to insert an image:\n\
    \n1. Find an image you like.\n2. It's easiest if you save it in the same folder\
    \ as your web page file.\n3. Open the folder to check out the file name and file\
    \ type.\n4. Now it's time to add the code.\n\nIf you're grabbing an image from\
    \ a website, right click on it (or control-click on Mac), and save it to your\
    \ computer.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_17_0.png)\n\nYou may need\
    \ to adjust your folder's 'View' settings to see these details.\n\n### EXAMPLE\n\
    \nAdding an image to a web page using `<img>` and `src`.\n\n```html\n<h1>Here's\
    \ my very special web crawler:</h1>\n\n<img src=\"spider.jpg\">\n```\n\n`src`\
    \ is short for 'source' — this is where the file for the image is located.\nThe\
    \ source is usually just the file name followed by its file type — make sure this\
    \ goes in quotes.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_17_1.png)\n\n`<img>`\
    \ is a rare example of a tag that doesn't have a corresponding closing tag — so\
    \ no `</img>` is needed here.\n\n5. Downloading and using images from other websites\
    \ is fine for personal use, but make sure you have permission if you're using\
    \ them for real web pages.\n\nSites like pixabay.com and unsplash.com have free\
    \ images that you can use in real web pages.\n\n## src is an example of an attribute\n\
    \n- `src` isn't a tag — it's called an attribute, and it goes inside a tag.\n\
    - An attribute can be thought of as a setting of a tag that alters what the tag\
    \ does or shows.\n- To use an attribute, put the attribute name followed by an\
    \ equals sign, and then the value in quotes (e.g. `src=\"spider.jpg\"`).\n- Some\
    \ tags have more than one attribute, e.g. `<img>` can also have `width` and `height`\
    \ attributes — see next page.\n- Remember, this all needs to be put inside the\
    \ `<img>` tag, before the last angled bracket, `>`.\n\nYou said no spiders!\n\n\
    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_17_2.png)\n\nSection Two — HTML Foundations\n\
    \n# Images\n\n## Check the src carefully\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_0.png)\n\
    \nSometimes, you might see an icon like this ![missing image icon](image_url)\
    \ instead of your image. This means the browser can't find the image at the source\
    \ you've said.\n\n```html\n<img src=\"spiderr.jpg\">\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_1.png)\n\
    \n- Double check the spelling of the file name or the file format.\n- If you've\
    \ put the image in a folder, like the one here, add that to the source too — see\
    \ p.30 for more about this.\n\nSome common image file formats are .jpg (or .jpeg),\
    \ .png and .gif.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_2.png)\n\n## Image\
    \ URLs can be used as the src\n\n- If you want to use an image from someone else's\
    \ website, a quicker method can be to put the image URL into the src attribute.\n\
    - To do this, right click on an image in a browser and select 'Copy image address',\
    \ then paste this into your code in quotes:\n\n```\nsrc=\"https://www.cgpbooks.co.uk/[redacted]/coolpics/spider.jpg\"\
    \n```\n\n- It can be a looong link, so don't panic if it goes on a bit.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_3.png)\n\
    \nBe careful using image URLs — if the website changes or removes the image, it\
    \ may change or fail to load on your web page too.\n\n## You can resize your images\n\
    \n1. The dimensions of an image means its size on your screen — it's often written\
    \ as width × height (e.g. 80 × 40).\n2. These are the number of pixels wide and\
    \ tall the image is.\n3. A web browser will show the image at its full size by\
    \ default — to resize your image, you can specify the width and/or height using\
    \ attributes.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_4.png)\n\nA pixel\
    \ is the smallest square of colour in an image or on a screen.\n\n**EXAMPLE**\
    \ Using width and height to resize an image.\n\n```html\n<h1>An itsy-bitsy version:</h1>\n\
    <img src=\"spider.jpg\" width=\"80\" height=\"20\">\n```\n\nHere it's resized\
    \ so the width is 80 pixels... and the height is 20 pixels.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_5.png)\n\
    \nBut altering the original width and height proportions can make the image seem\
    \ squashed.\n\n```html\n<h1>A better itsy-bitsy version:</h1>\n<img src=\"spider.jpg\"\
    \ width=\"80\">\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_6.png)\n\n\
    To keep the image looking the same as the original, only set one of the attributes,\
    \ e.g. width or height.\n\n> My favourite src? I'd have to say sweet chilli or\
    \ BBQ...\n\nSometimes it takes a few tries to get the image showing up properly,\
    \ so don't get put off if that happens to you. Resizing your image can also take\
    \ a bit of trial and error, but hey ho that's life...\n\n# Practice Questions\n\
    \n## Warm-Up\n\nQ1 What is meant by the “source” of an image?\n\nQ2 List three\
    \ attributes that are used in an `<img>` tag.\n\nQ3 True or false? Image tags\
    \ don’t need to be closed.\n\nQ4 Which of these is not a common image file format?\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_19_0.png)\n\n## Practice Questions\n\
    \nQ1 Here’s part of the code from the file ‘S2-p16-PracticeQ-Q1.html’ in the downloadable\
    \ content for this section. When viewed in a web browser, it shows the heading,\
    \ but not the image.\n\n```html\n<h1>Here's the stadium closest to me:</h1>\n\
    <img source=\"wembley_stadium.png\">\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_19_1.png)\n\
    \n> Although it’s not shown, the standard structure (see p.9) is in the code.\n\
    \nDescribe the two issues in the code that is causing the image to fail to load,\
    \ and explain how they should be fixed.\n\n1. ________________________________________________________________________________________________________\n\
    2. ________________________________________________________________________________________________________\n\
    \nQ2 An image from a website has the following image URL:\nhttps://cgpbooks.co.uk/[redacted]/normalfiles/homework/forbidden.png\n\
    Complete the code below to show how this image can be added to a web page.\n\n\
    ```html\n<img ______=\"https://www.cgpbooks.co.uk/[redacted]/____________________/homework/________________________\"\
    >\n```\n\nQ3 Tess is trying to resize an image on her web page, but every time\
    \ she sets a new width and height, the image looks stretched. Suggest how Tess\
    \ could resize her image so it doesn't look stretched.\n\nQ4 Complete the missing\
    \ parts of the code on the left to recreate the web page shown on the right.\n\
    \n```html\n<h1>______________________________________________</_______>\n\n<__________\
    \ __________=\"wasp.jpg\" width=\"250\">\n\n<__________>\n    <li>Avispa</li>\n\
    \    <li>Vespa</li>\n    <li>_______________</li>\n    <li>Geting</li>\n</__________>\n\
    ```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_19_2.png)\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_19_3.png)\n\
    \n# Coding Challenges for Section Two\n\nWell here we are, the end of the second\
    \ section. Try your hand at these challenges to test the skills you’ve picked\
    \ up — then visit [cgpbooks.co.uk/biscuit](http://cgpbooks.co.uk/biscuit) to download\
    \ [example code](http://example code) for each challenge.\n\n## Challenge 1 —\
    \ Example\n\nCreate a web page for [your favourite recipe](http://your favourite\
    \ recipe). This can be real or completely made up...\n\nIt needs to include the\
    \ following features:\n\n- The [name of your dish](http://name of your dish) displayed\
    \ in the [title](http://title).\n- Three [headings](http://headings) in italics:\
    \ **\"Ingredients\"**, **\"How To Make\"**, and **\"How To Serve\"**.\n- A brief\
    \ [paragraph](http://paragraph) under each heading so someone could [follow your\
    \ recipe](http://follow your recipe).\n- A [picture](http://picture) of your dish.\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_20_0.png)\n\n**SOLUTION**\n**Plan:**\
    \ Make a new HTML file and add the standard structure. You're then going to need\
    \ to find or create an image for your dish and save it in the same folder as your\
    \ HTML file.\n\n1. Remember, the [title](http://title) needs to be [inside](http://inside)\
    \ the `<head>` tags.\n2. I'll leave you to write [each part](http://each part)\
    \ of the recipe, but use `<h1>` and `<p>` tags to [structure your text](http://structure\
    \ your text).\n3. For the image, use `src` to put in the [file name](http://file\
    \ name). Check it [matches](http://matches) with what's [saved](http://saved)\
    \ if you can't see it when [viewing your page](http://viewing your page) in a\
    \ browser.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>A Nice Bowl\
    \ Of Spiders</title>\n</head>\n<body>\n    <h1><i>Ingredients</i></h1>\n    <p>Before\
    \ you start, you will need...</p>\n    <h1><i>How To Make</i></h1>\n    <p>First...</p>\n\
    \    <h1><i>How To Serve</i></h1>\n    <p>Once you've finished cooking...</p>\n\
    \    <img src=\"my-dish.jpg\" width=\"300\">\n</body>\n</html>\n```\n\n## Challenge\
    \ 2\n\n## Challenge 3\n\nRecreate the [web page](http://web page) shown below.\n\
    \nA local mattress business has contacted you about [designing a website](http://designing\
    \ a website) for them.\nMake a web page that suits the [requirements](http://requirements)\
    \ they've outlined [in the email](http://in the email) below.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_20_1.png)\n\
    \n> **From:** constance@azmail.co.uk\n**To:** me\nHi there\nI'd like the web page\
    \ to contain the following things:\n- my name\n- my prices (£70 for a single bed,\
    \ £150 for a double bed)\n- my email address\n- an image of a bed with a width\
    \ of 250 pixels\nThanks,\nConstance Noring\n\nRemember, you can also find all\
    \ video solutions at [cgpbooks.co.uk/biscuit](http://cgpbooks.co.uk/biscuit)\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_20_2.png)\n\nYou can find your own\
    \ image for this or use the one provided in the downloadable files for this section."
  mdcn: "\n# 图片\n\n好了，让我们来点有趣的吧？是时候学习如何在你的网页中添加图片了。这需要一点文件管理，但效果绝对值得。\n\n- 能够使用 `<img>`\
    \ 标签来标记图片。\n- 能够使用 `src`、`width` 和 `height` 属性。\n\n## 使用 `<img>` 标签添加图片\n\n以下是使用\
    \ HTML 插入图片的方法：\n\n1.  找一张你喜欢的图片。\n2.  最好将它保存在与网页文件相同的文件夹中。\n3.  打开文件夹，检查文件名和文件类型。\n\
    4.  现在是时候添加代码了。\n\n如果你从网站上抓取图片，请右键点击它（或在 Mac 上按住 Control 键点击），然后将其保存到你的电脑上。\n\n\
    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_17_0.png)\n\n你可能需要调整文件夹的“查看”设置才能看到这些详细信息。\n\
    \n### 示例\n\n使用 `<img>` 和 `src` 将图片添加到网页。\n\n```html\n<h1>Here's my very special\
    \ web crawler:</h1>\n\n<img src=\"spider.jpg\">\n```\n\n`src` 是 'source'（源）的缩写——这是图片文件的位置。\n\
    源通常就是文件名后跟文件类型——确保它被放在引号内。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_17_1.png)\n\
    \n`<img>` 是一个罕见的例子，它是一个没有对应闭合标签的标签——所以这里不需要 `</img>`。\n\n5.  从其他网站下载和使用图片用于个人用途是可以的，但如果你要将它们用于真实的网页，请确保你有许可。\n\
    \n像 pixabay.com 和 unsplash.com 这样的网站提供免费的图片，你可以将它们用于真实的网页。\n\n## src 是属性的一个例子\n\
    \n-   `src` 不是一个标签——它被称为属性，并且它放在标签内部。\n-   属性可以看作是标签的一个设置，用于改变标签的功能或显示内容。\n- \
    \  要使用属性，请将属性名后跟等号，然后是引号中的值（例如 `src=\"spider.jpg\"`）。\n-   一些标签有多个属性，例如 `<img>`\
    \ 也可以有 `width` 和 `height` 属性——参见下一页。\n-   请记住，所有这些都需要放在 `<img>` 标签内，最后一个尖括号 `>`\
    \ 之前。\n\n你说过不要蜘蛛的！\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_17_2.png)\n\n第二部分\
    \ —— HTML 基础\n\n# 图片\n\n## 仔细检查 src\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_0.png)\n\
    \n有时，你可能会看到一个这样的图标 ![missing image icon](image_url) 而不是你的图片。这意味着浏览器无法在你指定的源位置找到图片。\n\
    \n```html\n<img src=\"spiderr.jpg\">\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_1.png)\n\
    \n-   仔细检查文件名或文件格式的拼写。\n-   如果你把图片放在一个文件夹里，比如这里的这个，也要把它添加到源中——更多关于此的信息请参见第 30\
    \ 页。\n\n一些常见的图片文件格式是 .jpg（或 .jpeg）、.png 和 .gif。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_2.png)\n\
    \n## 图片 URL 可以用作 src\n\n-   如果你想使用别人网站上的图片，一个更快捷的方法是将图片 URL 放入 src 属性中。\n-   要做到这一点，请在浏览器中右键点击图片并选择“复制图片地址”，然后将其粘贴到代码中并加上引号：\n\
    \n```\nsrc=\"https://www.cgpbooks.co.uk/[redacted]/coolpics/spider.jpg\"\n```\n\
    \n-   它可能是一个很长的链接，所以如果它显示得很长，不要惊慌。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_3.png)\n\
    \n使用图片 URL 要小心——如果网站更改或移除了图片，它在你网页上的显示也可能更改或无法加载。\n\n## 你可以调整图片的大小\n\n1.  图片的尺寸是指它在屏幕上的大小——通常写作宽\
    \ × 高（例如 80 × 40）。\n2.  这些是图片的像素宽度和高度。\n3.  网页浏览器默认会以图片的原始尺寸显示它——要调整图片大小，你可以使用属性来指定宽度和/或高度。\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_4.png)\n\n像素是图片或屏幕上最小的颜色方块。\n\n\
    **示例** 使用 width 和 height 来调整图片大小。\n\n```html\n<h1>An itsy-bitsy version:</h1>\n\
    <img src=\"spider.jpg\" width=\"80\" height=\"20\">\n```\n\n这里将它调整为宽度 80 像素...\
    \ 高度 20 像素。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_5.png)\n\n但是改变原始的宽高比例可能会使图片看起来被挤压了。\n\
    \n```html\n<h1>A better itsy-bitsy version:</h1>\n<img src=\"spider.jpg\" width=\"\
    80\">\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_18_6.png)\n\n为了保持图片外观与原始图片相同，只设置其中一个属性，例如\
