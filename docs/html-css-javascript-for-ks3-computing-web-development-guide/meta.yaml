  md: '# # Coding Challenges for Section Three


    Hello again — there''s a second page of challenges for this section, and you''re
    looking right at it. Feel free to take a breather before continuing on.


    # ## Challenge 3


    **Style Park Zoo** have created a web page to showcase their new star attraction:
    **Biscuit**, the **honey badger**.


    [Recreate the page](shown on the right) as accurately as you can based on the
    following details:


    +   - The colours used are: Black, Blue, Firebrick, Gold and Khaki.

    - The photo has been described as, "Biscuit, a honey badger, out on the prowl."

    - The page has been designed to look best on a mobile device — it has a width
    of 400 pixels.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_30_0.png)


    > The bloomin'' cheek, I bathe weekly!


    # # Biscuit

    - the -

    # Honey Badger


    We are delighted to welcome a wonderful new animal, all the way from Kenya.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_30_1.png)


    Her name is Biscuit and she is a honey badger, and she''d love to see you at the
    zoo soon.


    # ## Three *Fun Facts* about Biscuit


    +   1. She''s not even a badger, she''s more like a weasel or something.

    2. She eats frogs and snakes *for breakfast*.

    3. She smells **so bad** she can raid beehives without the bees wanting to go
    near her.


    Come and see Biscuit at the zoo!


    # ## Challenge 4


    **Max Revs** (American stunt driver) has **made his own** web page. Right now,
    it doesn''t **reflect his patriotic, daredevil persona** very well. The `<body>`
    of his code is shown below.


    ```

    <p>Max Revs</p>

    <p>About Max</p>

    <p>Max is a world-famous stunt driver with over two years'' experience!</p>

    <p>Max can do the following stunts:</p>

    <p>- Wheelies</p>

    <p>- Drifting</p>

    <p>- Crazy big jumps</p>

    <p>- Driving at mad speed</p>

    <p>- Parallel parking</p>

    <p>Here''s Max:</p>

    <img src="max-revs.jpg" width="400">

    ```


    Edit the page to **improve the HTML** and **add style with CSS**:


    +   - Fill in the **whole page** in a cool ''DodgerBlue'' colour.

    - Make the **key info** stand out with **headings** and **exciting colours**.

    - Mark up the **list of stunts** properly and give it an **alternating** Red and
    White background (to look like the stripes on the **USA flag**).

    - Max likes to be **centre-stage**, so make sure his photo appears in the **middle**
    of the page at the bottom, and has a **double border**.


    Max Revs

    About Max

    Max is a world-famous stunt driver with over two years'' experience!

    Max can do the following stunts:

    - Wheelies

    - Drifting

