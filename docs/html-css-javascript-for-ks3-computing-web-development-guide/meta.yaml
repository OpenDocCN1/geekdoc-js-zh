- md: "## Navigation Bars\n\n**Learning Objectives**\nThis page showcases the full\
    \ power of CSS in all its glory. But fair warning, some of the properties used\
    \ aren't covered until the next section, so don't worry if they're unfamiliar.\n\
    \n- Be able to use `a:hover` to style links when a mouse goes over them.\n- Be\
    \ able to create a horizontal navigation bar using CSS.\n\n## `a:hover` is used\
    \ for mouse-over effects\n\n1. Changing styles when a user interacts with a page\
    \ can make it feel more engaging.\n2. `a:hover` lets you change a style when a\
    \ user moves their mouse over a link.\n\n```css\na {\n  background-color: Black;\n\
    \  color: White;\n}\na:hover {\n  background-color: Yellow;\n  color: Red;\n}\n\
    ```\n\n![Navigation bar example showing black links that turn yellow when hovered](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_44_0.png)\n\
    \n## Navigation bars are just stylish lists\n\n- With some clever CSS, you can\
    \ turn a boring HTML list into a cool navigation bar.\n- This example uses advanced\
    \ properties (explained in Section 6), so don't worry about understanding how\
    \ it all works right now — you can just copy the style sheet shown below, then\
    \ change the fonts and colours to match your web page designs.\n\n```css\nul {\n\
    \  background-color: LimeGreen;\n  list-style-type: none;\n  margin: 0px;\n  padding:\
    \ 0px;\n  overflow: hidden;\n}\nli a {\n  text-decoration: none;\n  text-align:\
    \ center;\n  padding: 14px 20px;\n  display: block;\n  float: left;\n}\nli a:hover\
    \ {\n  background-color: Yellow;\n}\n```\n\n```html\n<ul>\n  <li><a href=\"#\"\
    >Home</a></li>\n  <li><a href=\"#\">Aliens</a></li>\n  <li><a href=\"#\">Evidence</a></li>\n\
    </ul>\n```\n\n![Green horizontal navigation bar with three links](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_44_1.png)\n\
    \n> Come join me at the Nav Bar — I'll :hover by the pool table...\n\nHave fun\
    \ experimenting with the navigation bar, but be aware — until you learn to use\
    \ IDs in Section 6, the styles in the example above will apply to any `<ul>` list\
    \ element on your page.\n\n## Practice Questions\n\n### Warm-Up\n\nQ1 What type\
    \ of CSS goes in:\na) the style attribute?\nb) <style> tags?\nc) a separate file?\n\
    \n![Placeholder for answer](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_45_0.png)\n\n\
    Q2 Why is a ‘colour picker’ useful when writing CSS?\n\nQ3 What makes a hyperlink\
    \ ‘visited’?\n\nQ4 Other than linking to external style sheets, what else can\
    \ the <link> tag be used for?\n\n### Practice Questions\n\nQ1 Circle and describe\
    \ the three errors in the code below.\n\n```html\n<head>\n    <style>\n      \
    \  h1 {\n            background-color: @7771F0,\n            color: White;\n \
    \       }\n    </style>\n</head>\n<body>\n    <h1>Heading for Trouble</h1>\n</body>\n\
    ```\n\n1. ....................................................................................\n\
    2. ....................................................................................\n\
    3. ....................................................................................\n\
    \nQ2 Look at the code on the right.\n\na) What is the effect of the following\
    \ line?\n`a { text-decoration: none; }`\n....................................................................................\n\
    \n```html\n<head>\n    <style>\n        a { text-decoration: none; }\n       \
    \ a:link { color: Blue; }\n        a:visited { color: DarkOrange; }\n        a:hover{\
    \ background-color: Red; }\n    </style>\n</head>\n<body>\n    <a href=\"https://www.bbc.co.uk/\"\
    >\n        Click me</a>, thank you.\n</body>\n```\n\nb) What colour will the text\
    \ “Click me” be after the link has been clicked?\n....................................................................................\n\
    \nc) Suggest a change to make the page more accessible.\n....................................................................................\n\
    \nQ3 When should you use external CSS instead of internal CSS?\n\nQ4 Complete\
    \ the code below so that styles.css will be used to style the web page.\n\n```html\n\
    <head>\n    <________ rel=\"____\" ________=\"styles.css\">\n</head>\n```\n\n\
    Section Five — Style Sheets\n\n![Placeholder for answer](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_45_1.png)\n\
    \n## Coding Challenges for Section Five\n\nI can see you're ready for more Challenges,\
    \ so here you go — three of my finest. Smash the lot, then see just how well you\
    \ did by visiting cgpbooks.co.uk/biscuit to download example code for each challenge.\n\
    \n## Challenge 1 — Example\n\nA hyperlink needs to be created with the following\
    \ design:\n\n- It says \"Click me!\" in a non-underlined, white, Arial font with\
    \ a size of 20px.\n- Normally, its background is 'Blue'.\n- Once visited, its\
    \ background becomes 'Purple'.\n- When hovered over, its background turns a lighter\
    \ blue (your choice).\n\n![Placeholder for design](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_46_0.png)\n\
    \n## Challenge 2\n\nCreate a website that allows a school to showcase the clubs\
    \ they are running.\n\nThere should be a navigation bar with links to separate\
    \ web pages for each of the following clubs, and back to the home page too.\n\n\
    - Code Club — room F.1.3, run by Ms Key-Bordia.\n- Dance Club — room M.2.7, run\
    \ by Mr Maca and Ms Rena.\n- Basketball Club — in the sports hall, led by Coach\
    \ Dunk.\n\nEach club's page should display its room, the teacher(s) running it,\
    \ a relevant image, and they should be uniquely styled.\n\n![Placeholder for design](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_46_1.png)\n\
    \n## Challenge 3\n\nCreate a website for a simple quiz.\n\n- The home page should\
    \ have at least two multiple choice questions — like the examples on the right.\n\
    - When the user clicks an answer, they should be taken to one of two pages that\
    \ says whether they are right or wrong. Both of these pages should link back to\
    \ the home page.\n- The site is meant to be used by people sharing a computer,\
    \ so to avoid giving away the correct answers, you should style visited and unvisited\
    \ links identically.\n- An external style sheet should be used to make sure all\
    \ three pages use the same fonts.\n\n![Placeholder for design](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_46_2.png)\n\
    \n## Section Six — Advanced HTML & CSS\n\n### div Tags\n\n#### Learning Objectives\n\
    \n<div> tags can help you make a fancy-pants web page with all your HTML organised\
    \ into nice neat sections — it's a win-win situation, so read on.\n\n- Understand\
    \ the purpose of the <div> tag.\n- Be able to use the <div> tag to mark up the\
    \ divisions of a web page.\n\n## <div> is a container for other tags\n\n1. Web\
    \ pages often have a similar structure that can be broken down into smaller pieces.\n\
    2. These smaller pieces are called divisions — they're usually blocks of related\
    \ content.\n3. They can be marked up using <div> tags.\n4. Divisions (or '<div>s')\
    \ are useful because they:\n   - Help to keep your code more organised.\n   -\
    \ Can be individually styled (see p.46).\n\n| Section | Example |\n|---|---|\n\
    | Header | E.g. name, logo, slogan/tagline, etc. |\n| Navigation Bar | |\n| Main\
    \ Content | |\n| Footer | E.g. copyright, contact info, etc. |\n\nHTML also has\
    \ specific tags you could use for these divisions — e.g. <header>, <nav>, <main>\
    \ and <footer>. They can help things like search engines to understand your page.\
    \ We're using <div> tags in this section to keep things simple.\n\n#### EXAMPLE\n\
    \nA typical web page with four divisions: header, navigation bar, main content\
    \ and footer. This is the header division. Each of these four divisions is marked\
    \ up using <div> tags.\n\n```html\n<div style=\"background-color: Yellow; text-align:\
    \ center;\">\n  <h1>Alien Watch!</h1>\n</div>\n<!-- The navigation bar division.\
    \ -->\n<div style=\"border-style: solid;\">\n  <ul>\n    <li><a href=\"#\">Home</a></li>\n\
    \    <li><a href=\"#\">Aliens</a></li>\n    <li><a href=\"#\">Evidence</a></li>\n\
    \  </ul>\n</div>\n<!-- The main content division. -->\n<div style=\"font-family:\
    \ Arial, sans-serif;\">\n  <p>I've learnt the truth.</p>\n  <p>Their secrets will\
    \ be revealed.</p>\n</div>\n<!-- The footer division. -->\n<div style=\"font-size:\
    \ 75%; text-align: center;\">\n  <p>&copy; <i>Alien Watcher</i> 2023</p>\n</div>\n\
    ```\n\nNot shown: the navigation bar is styled using the style sheet on p.41.\n\
    \nSpecial symbols can be inserted using codes like this in HTML — a web browser\
    \ will replace &copy; with © (the copyright symbol).\n\nEach division is given\
    \ its own distinct styling using inline CSS.\n\n5. Inline CSS has been used to\
    \ style divisions in the example above. If you want to use internal or external\
    \ CSS instead, then you need a way to style each <div> tag separately — the next\
    \ page shows you how to do this.\n\nQ1 From the code files for this section, open\
    \ the page ‘divTags-Q1.html’ in your web browser. Describe the structure of the\
    \ page in terms of the divisions you see.\n\n### I love how you've coded your\
    \ page — it's absolutely <div>-ine...\n\nThere's no hard and fast rules about\
    \ how <div> tags should be used. Things can be broken down even further, with\
    \ divisions inside divisions — it often depends on how things need to be styled."
  mdcn: "\n## 导航栏\n\n**学习目标**\n本页面展示了CSS的全部强大功能。但请注意，其中一些属性直到下一节才会讲到，所以如果看到不熟悉的语法也不用担心。\n\
    \n- 能够使用 `a:hover` 在鼠标悬停时设置链接样式。\n- 能够使用CSS创建水平导航栏。\n\n## `a:hover` 用于鼠标悬停效果\n\
    \n1.  当用户与页面交互时改变样式，可以让页面感觉更引人入胜。\n2.  `a:hover` 让你在用户将鼠标悬停在链接上时改变其样式。\n\n```css\n\
    a {\n  background-color: Black;\n  color: White;\n}\na:hover {\n  background-color:\
