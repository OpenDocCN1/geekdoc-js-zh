    # # What are Networks?


    **Learning Objectives**

    What''s going on behind the scenes to make web pages appear on your device?

    Before you start coding, it''s good to know a thing or two about how it all works.

    * Understand what a **network** is.

    * Learn that networks can be **wired** or **wireless**.

    * Learn about the **benefits** and **drawbacks** of networks.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_5_0.png)


    # ## Networks are **connected** devices


    1) When you **connect** two or more **devices**, you''ve got a **network**.

    2) Networks allow devices to **communicate** with each other.


    # ## Connections can be **wired** or **wireless**


    +   * **Signals** pass through wires using either **electricity** (e.g. copper
    cables) or **light** (e.g. fibre optic cables).

    * **Signals** can also **travel wirelessly** through the air — usually through
    **radio waves**.


    > Wi-Fi® and Bluetooth® are wireless technologies which both use radio waves.


    **EXAMPLE** Three networks you may find in everyday life.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_5_1.png)


    **Q1** Describe an example of a network that may exist in a:

    a) supermarket

    b) sports stadium


    # ## There are **benefits** and **drawbacks** of networks


    +   Three **benefits** of networks:

    1) Messages can be sent **quickly** and **cheaply** — for example, by **email**.

    2) Some **actions** can be done **remotely**, such as switching off all computers
    in a classroom.

    3) **Files** and **devices**, like printers, can be **shared** between computers.


    +   Three **drawbacks** of networks:

    1) They can be **expensive** to **set up**.

    2) They may need **regular maintenance**.

    3) If a **hacker** or **malware** enters a network, **all** the connected devices
    may be affected.


    > **Malware** is a computer program designed to do something nasty. E.g. deleting
    or modifying files.


    **I thought about avoiding networks, but wi-fight the inevitable...**

    Computer networks date back to the 1950s — these days, you can''t get far without
    interacting with one. If you''ve got an electronic device, someone somewhere will
    be trying to connect it up.'
- md: "## What is the Internet?\n\n**Learning Objectives**\n\nWithout the Internet,\
    \ your web pages will be collecting digital dust in your local documents folder.\
    \ Here are some of the nerdy details you may not already know.\n\n- Understand\
    \ what [the Internet](https://en.wikipedia.org/wiki/Internet) is.\n- Learn about\
    \ why [routers](https://en.wikipedia.org/wiki/Router_(computing)) and [servers](https://en.wikipedia.org/wiki/Server_(computing))\
    \ are important network devices.\n- Understand what [domain names](https://en.wikipedia.org/wiki/Domain_name)\
    \ and [URLs](https://en.wikipedia.org/wiki/URL) are.\n\n## The Internet is just\
    \ a HUGE network\n\n1. The Internet is a global [network of networks](https://en.wikipedia.org/wiki/Network_of_networks).\n\
    2. People use it every day to do all sorts of things — e.g. [viewing web pages](https://en.wikipedia.org/wiki/Web_page),\
    \ [sending emails](https://en.wikipedia.org/wiki/Email), using [social media](https://en.wikipedia.org/wiki/Social_media)\
    \ and [playing online games](https://en.wikipedia.org/wiki/Online_game).\n\nThe\
    \ Internet is a WAN (wide area network) that connects LANs (local area networks)\
    \ together.\n\n## Data is passed around by routers\n\n- Devices [connect](https://en.wikipedia.org/wiki/Internet_access)\
    \ to the Internet (wired or wirelessly) through [routers](https://en.wikipedia.org/wiki/Router_(computing)).\n\
    - [Routers](https://en.wikipedia.org/wiki/Router_(computing)) control the [sending\
    \ and receiving](https://en.wikipedia.org/wiki/Packet_switching) of [data](https://en.wikipedia.org/wiki/Data)\
    \ between networks.\n- They use [IP addresses](https://en.wikipedia.org/wiki/IP_address)\
    \ to figure out [where to send](https://en.wikipedia.org/wiki/Routing) the data\
    \ to. IP addresses are [unique numbers](https://en.wikipedia.org/wiki/Internet_Protocol_version_4)\
    \ (like 192.0.2.255) given to all devices [connected](https://en.wikipedia.org/wiki/Network_interface_controller)\
    \ on a network.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_6_0.png)\n\n## Domain\
    \ names make it easier to contact a server\n\n1. A [server](https://en.wikipedia.org/wiki/Server_(computing))\
    \ is a computer that [provides information](https://en.wikipedia.org/wiki/Web_server)\
    \ or [does a job](https://en.wikipedia.org/wiki/Server_(computing)) for other\
    \ devices on a network. For example, a [web server](https://en.wikipedia.org/wiki/Web_server)\
    \ sends you [web pages](https://en.wikipedia.org/wiki/Web_page) when you browse\
    \ a website.\n2. Devices [access servers](https://en.wikipedia.org/wiki/Internet_access)\
    \ over the Internet using their [IP addresses](https://en.wikipedia.org/wiki/IP_address),\
    \ but it's much [easier for people](https://en.wikipedia.org/wiki/Domain_Name_System)\
    \ to use a [domain name](https://en.wikipedia.org/wiki/Domain_name) instead, like\
    \ cgpbooks.co.uk.\n3. To ask for a [specific resource](https://en.wikipedia.org/wiki/URL)\
    \ from a web server, you use a [URL](https://en.wikipedia.org/wiki/URL) (Uniform\
    \ Resource Locator) — usually called a [web address](https://en.wikipedia.org/wiki/URL).\n\
    \nA **domain name** is a name linked to an IP address.\nA system called the **Domain\
    \ Name System (DNS)** converts domain names to IP addresses.\n\nThere's a lot\
    \ more info about the Web on the next page.\n\n> **EXAMPLE**\nThe different parts\
    \ of a URL.\n\n`https://www.cgpbooks.co.uk/biscuit`\n\n![URL Breakdown](https://example.com/url-breakdown.png)\n\
    \nThe [domain name](https://en.wikipedia.org/wiki/Domain_name). The path to a\
    \ specific resource — usually a [web page](https://en.wikipedia.org/wiki/Web_page)\
    \ or a [file](https://en.wikipedia.org/wiki/Computer_file).\n\nURLs can include\
    \ 'http' or 'https'.\nThe 's' means that encryption will be used for secure communication.\n\
    If you don't type either yourself, one of them will be inserted — it's usually\
    \ 'https' when the website supports it.\n\n## Doesn't matter where you're from,\
    \ URL welcome here...\n\nThe Internet has been a game-changer for global communication.\
    \ Without it, you'd only be able to access things in a small, local network. Now,\
    \ you can send selfies across the globe in seconds.\n\n## What is the Web?\n\n\
    > **Learning Objectives**\nDrum roll, please. It's time for the main event. The\
    \ thing you are actually going to be developing for — the one, the only, the definitely-not-spider-infested...\
    \ THE WEB.\n\n- Understand what the Web is.\n- Learn about how web browsers work.\n\
    - Learn about how search engines work.\n\n## Linked web pages make the Web what\
    \ it is\n\n1. The World Wide Web (WWW), usually called 'the Web', is the collection\
    \ of websites that can be accessed over the Internet.\n2. Websites are made up\
    \ of lots of web pages that are connected to each other, and often to web pages\
    \ on other websites too.\n3. It's these connections, called hyperlinks (or just\
    \ links), that give it the structure of a web.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_7_0.png)\n\
    \n## Web browsers convert code into web pages\n\n- A web browser is a piece of\
    \ software used to access the web.\n- The most common web browsers include: Google\
    \ Chrome™ browser, Microsoft Edge, Mozilla Firefox and Safari web browser.\n-\
    \ When you enter a URL (see p.3) in a web browser, it will contact a web server\
    \ to request the web page you want to view.\n- The web server will send back the\
    \ web page in code form, and the web browser will convert the code into what you\
    \ see.\n- The coding language used as the foundation for web pages is HTML, but\
    \ it's often used with other languages too, like CSS and JavaScript™. You'll learn\
    \ all about these languages as you work through this book.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_7_1.png)\n\
    \n## Search engines see code as well as content\n\n1. Search engines keep track\
    \ of a huge number of web pages, and let you search them based on the text or\
    \ images they contain.\n2. When developing for the web, you need to think about\
    \ how your code looks to search engines if you want your web pages to be found\
    \ in search results.\n3. Search engines rank web pages based on lots of factors,\
    \ including:\n   - How relevant the content is.\n   - How many other websites\
    \ link to it.\n   - How accessible it is — e.g. fast to load, mobile-friendly.\n\
    \   - How often it's chosen in search results.\n   - How up-to-date the content\
    \ is.\n4. You can write code that helps search engines understand the content\
    \ on your web pages. For example, you can add a text description to an image to\
    \ help a search engine know what it is — see p.18 for more about this.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_7_2.png)\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_7_3.png)\n\n> **Well, well, well, if\
    \ it isn't the World Wide Web......**\nThe Web is only one part of the Internet\
    \ — they ain't the same. The Internet includes other things like email, file sharing\
    \ and online games, which aren't always accessed through a web browser.\n\nSection\
    \ One — About the Web\n\n## Developing for the Web\n\nWe'll start HTML properly\
    \ in Section 2. But first, you need the right tool for the job: a text editor\
    \ (or a fancier code editor, if you wanna). Read on for recommendations.\n\n-\
    \ Be able to **create** and **view** a **web page**.\n- Learn about the **software**\
    \ available for **writing web pages**.\n- Learn about how websites are **put on\
    \ the web**.\n\n## Writing your first web page\n\n1. Unlike coding in languages\
    \ like **Scratch™** or **Python**, you don't need to download any **special software**\
    \ to get started with **web development**.\n2. All you need is a **text editor**,\
    \ a **web browser** and a dream.\n3. Your computer should have the required software\
    \ already:\n    - **Windows®** comes with **Notepad** as a text editor and **Edge**\
    \ as a web browser.\n    - **macOS operating system** comes with **TextEdit**\
    \ as a text editor and **Safari** as a web browser.\n4. So why wait any longer?\
    \ Create your first **web page** following the steps below.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_8_0.png)\n\
    \n**EXAMPLE** Making your first web page in Notepad.\n\nOpen your **text editor**\
    \ and **write a message**. [Image: Notepad with \"Hello, world!\"]\n\nNow you\
    \ need to **save your file** as a web page.\n\nChoose a **sensible folder** to\
    \ save it in (e.g. **Documents**). [Image: Save As dialog]\n\nGive it a **name**\
    \ and add **html** to the **end**. [Image: Save As dialog with filename \"hello-world.html\"\
    ]\n\nMake sure to set the **type** to '**All Files**', then click '**Save**'.\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_8_1.png)\n\nRemember, you can also\
    \ find all videos at cgpbbooks.co.uk/biscuit\n\nIn **TextEdit**, change the file\
    \ format to 'Web Page (.html)' — you don't need to write the '.html' yourself.\n\
    \nA **file format** is a way that data is stored in a file. E.g. saving as a '.html'\
    \ file tells your computer that it contains text written in **code** that a **web\
    \ browser** can interpret.\n\n5. To **view your page**, go to the **folder** you\
    \ saved it in and **double click** on the **file** — it should open in your **default\
    \ web browser**.\n6. If you want to **make changes** to your web page, just **open\
    \ the file** again from within your **text editor** — you may need to change the\
    \ **file type** to '**All Files**' to see it.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_8_2.png)\n\
    \n## Stay organised and stay safe\n\n- You'll need to save **lots of code files**\
    \ to try all the code in this book, so it's a good idea to **keep them organised**.\
    \ Making a **folder** for each **section** is a sensible plan.\n- Don't forget\
    \ — you can **visit the link** on the contents page to access **downloadable code\
    \ files** for all the examples, practice questions and coding challenges in this\
    \ book. They all **run** in your **web browser** and can be **edited** in your\
    \ **text editor**.\n- There's lots of code you may **find online** from **other\
    \ websites**, but be careful — it's not always **safe to use**. Don't use any\
    \ code you haven't **read and understood** first."
  mdcn: "\n## 什么是互联网？\n\n**学习目标**\n\n没有互联网，你的网页就只能在本地文件夹里收集数字灰尘了。这里有一些你可能还不知道的有趣细节。\n\
    \n- 了解[互联网](https://en.wikipedia.org/wiki/Internet)是什么。\n- 了解为什么[路由器](https://en.wikipedia.org/wiki/Router_(computing))和[服务器](https://en.wikipedia.org/wiki/Server_(computing))是重要的网络设备。\n\
    - 了解[域名](https://en.wikipedia.org/wiki/Domain_name)和[URL](https://en.wikipedia.org/wiki/URL)是什么。\n\
    \n## 互联网只是一个巨大的网络\n\n1. 互联网是一个全球性的[网络之网](https://en.wikipedia.org/wiki/Network_of_networks)。\n\
    2. 人们每天都用它来做各种事情——例如[浏览网页](https://en.wikipedia.org/wiki/Web_page)、[发送电子邮件](https://en.wikipedia.org/wiki/Email)、使用[社交媒体](https://en.wikipedia.org/wiki/Social_media)以及[玩在线游戏](https://en.wikipedia.org/wiki/Online_game)。\n\
    \n互联网是一个广域网，它将各个局域网连接在一起。\n\n## 数据通过路由器传递\n\n- 设备通过[路由器](https://en.wikipedia.org/wiki/Router_(computing))[连接](https://en.wikipedia.org/wiki/Internet_access)到互联网（有线或无线）。\n\
    - [路由器](https://en.wikipedia.org/wiki/Router_(computing))控制着[数据](https://en.wikipedia.org/wiki/Data)在网络之间的[发送和接收](https://en.wikipedia.org/wiki/Packet_switching)。\n\
    - 它们使用[IP地址](https://en.wikipedia.org/wiki/IP_address)来确定[数据发送的去向](https://en.wikipedia.org/wiki/Routing)。IP地址是分配给网络上所有[已连接](https://en.wikipedia.org/wiki/Network_interface_controller)设备的[唯一数字](https://en.wikipedia.org/wiki/Internet_Protocol_version_4)（例如\
    \ 192.0.2.255）。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_6_0.png)\n\n## 域名让联系服务器更容易\n\
    \n1. [服务器](https://en.wikipedia.org/wiki/Server_(computing))是一台为网络上的其他设备[提供信息](https://en.wikipedia.org/wiki/Web_server)或[执行任务](https://en.wikipedia.org/wiki/Server_(computing))的计算机。例如，当你浏览一个网站时，[网络服务器](https://en.wikipedia.org/wiki/Web_server)会向你发送[网页](https://en.wikipedia.org/wiki/Web_page)。\n\
    2. 设备通过互联网[访问服务器](https://en.wikipedia.org/wiki/Internet_access)，使用的是它们的[IP地址](https://en.wikipedia.org/wiki/IP_address)，但对人们来说，使用[域名](https://en.wikipedia.org/wiki/Domain_name)要[容易得多](https://en.wikipedia.org/wiki/Domain_Name_System)，比如\
    \ cgpbooks.co.uk。\n3. 要从网络服务器请求一个[特定资源](https://en.wikipedia.org/wiki/URL)，你需要使用[URL](https://en.wikipedia.org/wiki/URL)（统一资源定位符）——通常称为[网址](https://en.wikipedia.org/wiki/URL)。\n\
    \n**域名**是一个与IP地址相关联的名称。\n一个叫做**域名系统（DNS）**的系统负责将域名转换为IP地址。\n\n下一页将提供更多关于网络的信息。\n\
    \n> **示例**\nURL的不同部分。\n\n`https://www.cgpbooks.co.uk/biscuit`\n\n![URL 拆解](https://example.com/url-breakdown.png)\n\
    \n[域名](https://en.wikipedia.org/wiki/Domain_name)。指向特定资源的路径——通常是[网页](https://en.wikipedia.org/wiki/Web_page)或[文件](https://en.wikipedia.org/wiki/Computer_file)。\n\
    \nURL 可以包含 'http' 或 'https'。\n这里的 's' 表示将使用加密进行安全通信。\n如果你自己没有输入其中之一，系统通常会自动插入——当网站支持时，通常是\
    \ 'https'。\n\n## 不管你来自哪里，URL都欢迎你……\n\n互联网彻底改变了全球交流。没有它，你只能访问一个小型的本地网络里的东西。现在，你可以在几秒钟内将自拍照发送到全球各地。\n\
    \n## 什么是万维网？\n\n> **学习目标**\n鼓声响起。主角要登场了。你实际要开发的东西——独一无二，而且绝对没有蜘蛛窝……万维网。\n\n- 了解万维网是什么。\n\
    - 了解网页浏览器是如何工作的。\n- 了解搜索引擎是如何工作的。\n\n## 相互链接的网页构成了万维网\n\n1. 万维网，通常被称为“网络”，是可以通过互联网访问的网站的集合。\n\
    2. 网站由许多相互链接的网页组成，并且通常也与其他网站上的网页相链接。\n3. 正是这些被称为超链接（或简称链接）的连接，赋予了它网络的结构。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_7_0.png)\n\
    \n## 网页浏览器将代码转换为网页\n\n- 网页浏览器是一种用于访问网络的软件。\n- 最常见的网页浏览器包括：Google Chrome™ 浏览器、Microsoft\
    \ Edge、Mozilla Firefox 和 Safari 浏览器。\n- 当你在网页浏览器中输入一个 URL（见第 3 页）时，它会联系一个网络服务器来请求你想要查看的网页。\n\
    - 网络服务器会以代码形式发回网页，而网页浏览器会将这些代码转换成你所看到的内容。\n- 作为网页基础的编程语言是 HTML，但它通常也与其他语言一起使用，比如\
    \ CSS 和 JavaScript™。在学习本书的过程中，你将全面了解这些语言。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_7_1.png)\n\
    \n## 搜索引擎既看代码也看内容\n\n1. 搜索引擎跟踪着海量的网页，并允许你根据它们包含的文本或图像进行搜索。\n2. 在为网络开发时，如果你希望你的网页在搜索结果中被找到，你需要考虑你的代码在搜索引擎眼中是什么样子。\n\
    3. 搜索引擎根据许多因素对网页进行排名，包括：\n   - 内容的相关性。\n   - 有多少其他网站链接到它。\n   - 它的可访问性——例如，加载速度快，移动端友好。\n\
    \   - 它在搜索结果中被选中的频率。\n   - 内容的更新频率。\n4. 你可以编写代码来帮助搜索引擎理解网页上的内容。例如，你可以为图像添加文本描述，以帮助搜索引擎知道它是什么——更多信息请参见第\
    \ 18 页。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_7_2.png)\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_7_3.png)\n\
    \n> **哎呀，这不是万维网吗……**\n网络只是互联网的一部分——它们并不相同。互联网还包括其他东西，如电子邮件、文件共享和在线游戏，这些并不总是通过网络浏览器来访问。\n\
    \n第一部分 —— 关于网络\n\n## 为网络开发\n\n我们将在第 2 节正式开始学习 HTML。但首先，你需要合适的工具：一个文本编辑器（或者更花哨的代码编辑器，如果你想的话）。请继续阅读以获取推荐。\n\
    \n- 能够**创建**和**查看**一个**网页**。\n- 了解可用于**编写网页**的**软件**。\n- 了解网站是如何**发布到网络上**的。\n\
    \n## 编写你的第一个网页\n\n1. 与使用 **Scratch™** 或 **Python** 等语言编码不同，你不需要下载任何**特殊软件**来开始**网页开发**。\n\
    2. 你所需要的只是一个**文本编辑器**、一个**网页浏览器**和一个梦想。\n3. 你的电脑应该已经安装了所需的软件：\n    - **Windows®**\
    \ 自带 **Notepad** 作为文本编辑器，**Edge** 作为网页浏览器。\n    - **macOS 操作系统** 自带 **TextEdit**\
    \ 作为文本编辑器，**Safari** 作为网页浏览器。\n4. 那还等什么？按照下面的步骤创建你的第一个**网页**吧。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_8_0.png)\n\
    \n**示例** 在 Notepad 中创建你的第一个网页。\n\n打开你的**文本编辑器**并**写一条信息**。[图片：Notepad 中显示 \"Hello,\
    \ world!\"]\n\n现在你需要将文件**保存为**网页。\n\n选择一个**合适的文件夹**来保存它（例如 **Documents**）。[图片：另存为对话框]\n\
    \n给它一个**名字**并在**末尾**添加 **html**。[图片：另存为对话框，文件名为 \"hello-world.html\"]\n\n确保将**类型**设置为\
    \ **'所有文件'**，然后点击 **'保存'**。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_8_1.png)\n\
    \n记住，你也可以在 cgpbbooks.co.uk/biscuit 找到所有视频。\n\n在 **TextEdit** 中，将文件格式更改为“网页 (.html)”——你不需要自己写\
    \ '.html'。\n\n**文件格式**是文件中数据的存储方式。例如，保存为 '.html' 文件告诉你的计算机，它包含由**网页浏览器**可以解释的**代码**编写的文本。\n\
    \n5. 要**查看你的页面**，前往你保存它的**文件夹**并**双击**该**文件**——它应该会在你的**默认网页浏览器**中打开。\n6. 如果你想对网页**进行更改**，只需在你的**文本编辑器**中再次**打开文件**——你可能需要将**文件类型**更改为\
