- md: "## Coding Challenges for Section Four\n\nOh, you again. You're still here?\
    \ Well, I guess if you like these challenges so much you can have a couple more\
    \ to keep you going. Don't let me get in the way. You know you can take a break\
    \ if you want to, right...?\n\n## Challenge 3\n\n'High-Horse Manor' wants you\
    \ to design a new website to promote their five star hotel. The website should\
    \ include:\n\n- A home page containing the hotel's name, picture and the following\
    \ message:\n> \"Good tidings and a warm welcome to our splendiferous new website.\
    \ Prithee, come and stay with us for a while. Our rooms bear golden toilets as\
    \ standard, and one can break their fast on an array of options.\"\n- A page listing\
    \ the following breakfast options with some pictures:\n  - Eggs (any way that\
    \ takes your fancy)\n  - Endangered-game sausages\n  - Magic beans\n  - Royal\
    \ tomatoes\n  - Golden grain bread\n  - Thrice-smoked bacon\n  - Mushrooms à la\
    \ forest\n  - A range of wholegrain cereals\n- A 'contact' page containing the\
    \ hotel's address, phone number and a link which opens a new email addressed to\
    \ the hotel.\n- Links to navigate between each of the pages.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_38_0.png)\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_38_1.png)\n\n> You can make up these\
    \ contact details.\n\n## Challenge 4\n\nAn English teacher wants you to create\
    \ a website that his students can use to study his favourite poem, The Owl and\
    \ the Pussycat, by Edward Lear. The home page, shown below, has already been made.\n\
    \n```\n<body style=\"background-color: AliceBlue; text-align: center; font-family:\
    \ Optima, sans-serif;\">\n  <h1>The Owl and the Pussycat</h1>\n  <h2>By Edward\
    \ Lear</h2>\n  <p>Select a stanza:</p>\n  <p><a href=\"stanza-1.html\">First stanza</a></p>\n\
    \  <p><a href=\"stanza-2.html\">Second stanza</a></p>\n  <p><a href=\"stanza-3.html\"\
    >Third stanza</a></p>\n</body>\n```\n\n| The Owl and the Pussycat |\n| :--- |\n\
    | By Edward Lear |\n| Select a stanza: |\n| [First stanza] |\n| [Second stanza]\
    \ |\n| [Third stanza] |\n\nYou need to create a web page for each stanza, which\
    \ includes:\n\n- The title of the poem and stanza number.\n- The relevant stanza\
    \ of the poem.\n- A 'next stanza' and/or 'previous stanza' link where appropriate.\n\
    - A link back to the home page.\n\n> A stanza is a number of lines grouped together\
    \ that divides a poem into sections.\n\nYou should style the pages with CSS, and\
    \ match their file names with the internal links in the code above. The poem is\
    \ included in the downloadable content for this challenge, in a file called 'poem.txt'.\n\
    \n## Section Five — Style Sheets\n\n## Internal CSS\n\n**Learning Objectives**\n\
    Mixing CSS with HTML can make for a chunky bowl of code soup and, much like this\
    \ metaphor, it gets harder to swallow the more you add to it — so, let's break\
    \ it down.\n- Understand the purpose of using internal CSS instead of inline CSS.\n\
    - Be able to use the `<style>` tag to mark up internal CSS.\n\n## The style attribute\
    \ has its drawbacks\n\nRemember, inline CSS is assigned to the style attribute\
    \ of a specific HTML element.\n\n1. Code can become hard to read and write if\
    \ you've got loads of inline CSS.\n2. The same code needs to be repeated to style\
    \ different things in the same way, and the content of your page can get lost\
    \ in the surrounding code — it can also take ages to style every tag individually.\n\
    \n**COMMON PROBLEMS**\nHow inline CSS can get repetitive.\nThe `<h1>` tags have\
    \ the same style repeated — as do the `<p>` tags.\n\n```\n<h1 style=\"color: Orange;\"\
    >Bad Food</h1>\n<p style=\"font-family: Arial; color: Blue;\">Deep-fried celery</p>\n\
    <h1 style=\"color: Orange;\">Baddest Food</h1>\n<p style=\"font-family: Arial;\
    \ color: Blue;\">Hot dogs</p>\n```\n\n**Bad Food**\nDeep-fried celery\n**Baddest\
    \ Food**\nHot dogs\n\n## Use `<style>` tags to add internal CSS\n\n- A style sheet\
    \ is just a collection of CSS rules used to style a web page.\n- Internal CSS\
    \ is a style sheet marked up by `<style>` tags in the `<head>` of a page.\n\n\
    **EXAMPLE**\nRecreating the example above using internal CSS.\n\n```\n<head>\n\
    \  <style>\n    h1 { color: Orange; }\n    p {\n      font-family: Arial;\n  \
    \    color: Blue;\n    }\n  </style>\n</head>\n<body>\n  <h1>Bad Food</h1>\n \
    \ <p>Deep-fried celery</p>\n  <h1>Baddest Food</h1>\n  <p>Hot dogs</p>\n</body>\n\
    ```\n\nInternal CSS goes between `<style>` tags inside the `<head>` element.\n\
    The property/value pairs are the same as inline CSS, but you don't need the quotes.\n\
    Both `<h1>` elements will have the same style — as will both the `<p>` elements.\n\
    \nEach tag you want styled needs to be named.\nCurly braces `{ }` must surround\
    \ the styles for each tag. Just like with HTML, you can use indentation and extra\
    \ spacing to make CSS more readable.\nYou don't need any inline CSS in the `<body>`,\
    \ as the internal CSS is automatically applied.\n\n**KEY TERMS**\nThe internal\
    \ CSS marked up by the `<style>` tags is also known as an internal style sheet.\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_39_0.png)\n\nThe web page created by\
    \ this code looks exactly the same as the example above.\n\nYou'll see how to\
    \ give different styles to elements of the same type on p.45.\n\n## I've internalised\
    \ this — it's now living in my `<head>` rent-free...\n\nWhen using internal CSS,\
    \ you can still use inline CSS to style individual elements. If the same property\
    \ is set in both inline and internal CSS, then the inline CSS will take priority\
    \ (see p.40).\n\n## Styling Hyperlinks\n\n**Learning Objectives**\n- Links are\
    \ how people navigate around your website, so you don't want them to be missed\
    \ — here are a few tricks to make your links stand out using internal CSS.\n-\
    \ Understand the difference between visited and unvisited links.\n- Be able to\
    \ use `a`, `a:link` and `a:visited` to change the style of links.\n\n## Links\
    \ can be visited or unvisited\n\n1. As you saw in Section 4, hyperlinks are created\
    \ using the `<a>` tag.\n2. An unvisited link is a hyperlink to a web page you\
    \ haven't been to before. By default, with no CSS applied, these are coloured\
    \ blue and underlined.\n3. Once the linked web page has been visited, the link\
    \ will turn purple.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_40_0.png)\n\n\
    ## Use internal CSS to style links\n\n- You can use `a` to apply styles to all\
    \ links — whether they're visited or not.\n- You can use `a:link` to style unvisited\
    \ links and `a:visited` to style visited links.\n\n```\n<head>\n<style>\n    a\
    \ {\n        font-size: 20px;\n    }\n    a:link {\n        color: DodgerBlue;\n\
    \        text-decoration-color: Navy;\n    }\n    a:visited {\n        color:\
    \ DarkOrange;\n        text-decoration-color: Red;\n    }\n</style>\n</head>\n\
    <body>\n    <a href=\"https://www.ordnancesurvey.co.uk\">Click me</a>\n</body>\n\
    ```\n\n**EXAMPLE**\nIt's best practice to style links in this order: `a`, `a:link`\
    \ and then `a:visited`.\n\nThe font for all links will have a size of 20 pixels.\n\
    \nHere's how the link looks before it's been visited. [Click me]\n\nThis property\
    \ sets the colour of any 'decoration' the text has — for links, it's usually an\
    \ underline.\n\nHere's how the link looks after it's been visited. [Click me]\n\
    \nIf this URL is already in your web browser's history, it will count as visited\
    \ — so change this to somewhere that you've never been to if you want to see the\
    \ unvisited style applied.\n\n- The `text-decoration` property can also be used\
    \ to style links — it can have the values: `underline`, `overline`, `line-through`\
    \ and `none`.\n\n**Q1** Write the internal CSS that styles links like this:\n\
    Unvisited [Click me]\nVisited [Click me]\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_40_1.png)\n\
    \nFor security reasons, most web browsers limit which properties you're allowed\
    \ to change for `a:visited`. If you find you can't style a visited link in a certain\
    \ way, then it may be disallowed.\n\n`a:link` and `a:visited` are examples of\
    \ 'pseudo-classes' in CSS. Another is `a:hover` (see p.41) and there's also `a:active`\
    \ which is used to style a link at the moment it's clicked.\n\n> **CSS prank:\
    \ swap the default blue and purple colours of links...**\n...but seriously, don't\
    \ forget the accessible design principles from p.18 — your links should be easy\
    \ to read, and they should look different to other bits of text so people can\
    \ see they're there."
