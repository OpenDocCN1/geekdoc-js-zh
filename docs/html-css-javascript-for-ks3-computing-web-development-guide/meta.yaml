    >\n<p>Can regrow limbs.</p>\n\n<h2>Mantis Shrimp</h2>\n<img src=\"images/mantis-shrimp.jpg\"\
    \ width=\"150\">\n<p>Can punch with the speed of a bullet.</p>\n\n<h2>Shoebill</h2>\n\
