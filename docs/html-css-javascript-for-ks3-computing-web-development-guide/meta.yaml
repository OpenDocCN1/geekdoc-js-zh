  md: '# # Prompts


    +   **Learning Objectives**

    I''m sure you''re used to prompts — have you cleaned your room? Eaten your veg?
    Done your homework? Learnt how web pages can prompt a user to do something?


    * Be able to use `prompt()` to **get input** from the user.

    * Learn what happens when a `prompt()` is **cancelled**.


    # ## prompt() can get user input


    1) The `prompt()` **command** displays a **message** to the user **like** `alert()`,
    but it also allows the user to **type a message in return**.


    ```

    <script>

    prompt("Hello! What''s your name?");

    </script>

    ```


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_58_0.png)


    `prompt()` displays the message and gives the user a **box** in which to **type
    their response**.


    2) You can **use a variable** to **store** the **user''s response** from a `prompt()`.


    +   **EXAMPLE**

    Include a question or instruction in a prompt, so the user knows what you''re
    after.


    The **user''s response** to the `prompt()` is **stored** in the **variable** `name`.


    ```

    <script>

    let name = prompt("Hello! What''s your name?");

    let message = "Welcome, " + name + "!";

    alert(message);

    </script>

    ```


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_58_1.png)


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_58_2.png)


    The **user sees** the `prompt()` **first** — the script is **paused** until the
    user **clicks ''OK''**.


    The `alert()` then **appears after** the user has **clicked ''OK''** on the `prompt()`.


    **Q1** Modify your script from Q1 on p.54 so that it asks the user for their name
    using a `prompt()`.


    # ## Prompts can be **cancelled**


    If you **click** the ''Cancel'' button in the `prompt()` of the example above,
    you''ll see the following `alert()`.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_58_3.png)


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_58_4.png)


    ''null'' in JavaScript means **no value** — because the `prompt()` was **cancelled**,
    the **variable** `name` was set to `null`.


    **GOING FURTHER**

    You can check whether a `prompt()` was cancelled by using an `if` statement (see
    p.59) to test if it returned `null`. This is **different** to the user typing
    nothing and clicking OK — that returns an **empty string** "".


    ### To cancel the prompt function, unfollow it on social media...

    Prompts are a simple way of getting input from the user, but they can''t be styled
    — the user''s web browser controls what prompts look like. You''ll see how to
    create fancier input fields in Section 8.'
