  mdcn: "\n## 计时代码\n\n**示例** 你只需定义三个简单的函数，就能让秒表工作起来。\n\n这些变量后面会用到——将它们设置在这里，以便在下面的任何函数中都可以使用。\n\
    \n```\nlet timer = 0;\nlet seconds = 0;\n\nlet secondsDisplay = document.getElementById(\"\
    seconds-display\");\nlet startButton = document.getElementById(\"start-button\"\
    );\nlet stopButton = document.getElementById(\"stop-button\");\n```\n\n这个变量将用于跟踪计时器启动后经过了多少秒。\n\
    \n`startWatch()` 的主要目的是创建并启动一个计时器——当点击“开始”按钮时运行。\n\n```\nfunction startWatch()\
    \ {\n    timer = setInterval(updateWatch, 1000);\n    \n    startButton.disabled\
    \ = true;\n    stopButton.disabled = false;\n}\n```\n\n设置了一个计时器，每秒（1000毫秒）调用一次\
