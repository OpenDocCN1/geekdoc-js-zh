  - '[PAGE 34]


    # Controlling Hyperlinks


    > And thus the little blue hyperlinks, in all their underlined glory, stand out
    and cry "click me, click me". And I whisper "no" — for you haven''t yet set all
    their attributes.


    +   - Be able to make hyperlinks that open in a new tab.

    - Be able to make hyperlinks that open a new email.


    # Hyperlinks can open in a new tab


    1) Normally, when you click a hyperlink, it opens in the tab you''re currently
    using.

    2) Sometimes, it can be better to open a link in a new tab.

    3) To do this, add a target attribute into the <a> tag, and set its value to _blank.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_34_0.png)


    ```

    <p><a href="https://www.cgpbooks.co.uk" target="_blank"> Books</a> (opens in new
    tab).</p>

    ```


    Writing this message makes your web page more accessible.


    # Hyperlinks can open a new email


    1) Instead of linking two web pages, hyperlinks can also be used to open a new
    email using email software on your computer.

    2) This is done by using mailto: in the href attribute followed by an email address.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_34_1.png)


    ```

    <h2>The Bad Salad Co. - Lettuce help you</h2>

    <p>So, you found another slug in your salad...</p>

    <p>You could look for your <a href="https://www.gov.uk">consumer rights</a>.</p>

    <p>Just accept <a href="sorry.html" target="_blank">our apology</a> (opens in
    a new tab).</p>

    <p>Or email us at <a href="mailto:DoNotCare@azmail.co.uk">DoNotCare@azmail.co.uk</a>
    (waaah).</p>

    ```


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_34_2.png)


    The address set in the href will appear in the ''To'' line of the email when the
    link is clicked.


    > target="_blank" — sounds like me trying archery...

    It''s much more accessible to show the email address as the hyperlink, so people
    can still use it even if they don''t have email software, or if they want to send
    an email from a different device.'
