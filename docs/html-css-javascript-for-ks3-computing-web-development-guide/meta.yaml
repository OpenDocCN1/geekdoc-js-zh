  md: '# Glossary


    # Glossary of web dev words


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_88_0.png)


    There are loads of words used in web development that you may not be familiar
    with — here are a few...


    | Term | Definition |

    | --- | --- |

    | **Accessible design** | Making something in a way that allows it to be used
    by as many people as possible. |

    | **Attribute** | A setting of a tag that alters what the tag does or shows. |

    | **Class** (class) | A named collection of elements or the attribute used to
    assign elements to such a collection. |

    | **Console** | A window of some web browsers that shows outputs and errors of
    JavaScript code. |

    | **CSS** | Cascading Style Sheets — the language used to style a web page. Can
    be inline, internal or external. |

    | **Domain name** | A name linked to an IP address that identifies a location
    on the Web. |

    | **Element** | A part of a web page, usually defined by a pair of HTML tags and
    their content. |

    | **Event** | Something that happens when a user is interacting with a web page.
    |

    | **Font** | A particular design of the letters, numbers and symbols that make
    up text. |

    | **Hex colour code** | A combination of the numerals 0-9 and the letters A-F
    that represents a colour. |

    | **HTML** | HyperText Markup Language — a language that uses tags to label content.
    |

    | **Hyperlink** | Something a user can click on to take them from one web page
    or online resource to another — can be internal or external. |

    | **ID** (id) | A name referring to a unique element or the attribute used to
    assign that name to the element. |

    | **Input field** | An element that obtains user input by allowing them to interact
    with the web page. |

    | **Internet** | A global network of networks. |

    | **JavaScript** | A programming language that can be used to make dynamic web
    pages. |

    | **Margin** | The empty space surrounding an element, outside of its borders.
    |

    | **Mark up** | Labelling content by adding tags. |

    | **Network** | Two or more devices connected together. |

    | **Padding** | The empty space inside an element''s borders, surrounding its
    content. |

    | **Pixel** | The smallest square of colour in an image or on a screen, and a
    unit of measurement for many properties. |

    | **Property** | A feature of an element that you can change with CSS. |

    | **Style sheet** | A collection of CSS rules used to style a web page — can be
    internal (in `<style>` tags) or external (in a .css file). |

    | **Tag** | A label in angled brackets, `< >`, used to mark up content in HTML.
    |

    | **URL** | A web address — they usually consist of a domain name and a path to
    a resource. |

    | **Value** | The data held by a certain tag, attribute, property, or variable.
    |

    | **Web browser** | A piece of software used to access the Web. |

    | **Web page** | A single document on the Web, usually written in HTML. |

    | **Website** | A collection of web pages connected to each other with hyperlinks.
    |

    | **World Wide Web** | The collection of websites that can be accessed over the
    Internet. |'
