  md: '# # What are Networks?


    **Learning Objectives**

    What''s going on behind the scenes to make web pages appear on your device?

    Before you start coding, it''s good to know a thing or two about how it all works.

    * Understand what a **network** is.

    * Learn that networks can be **wired** or **wireless**.

    * Learn about the **benefits** and **drawbacks** of networks.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_5_0.png)


    # ## Networks are **connected** devices


    1) When you **connect** two or more **devices**, you''ve got a **network**.

    2) Networks allow devices to **communicate** with each other.


    # ## Connections can be **wired** or **wireless**


    +   * **Signals** pass through wires using either **electricity** (e.g. copper
    cables) or **light** (e.g. fibre optic cables).

    * **Signals** can also **travel wirelessly** through the air — usually through
    **radio waves**.


    > Wi-Fi® and Bluetooth® are wireless technologies which both use radio waves.


    **EXAMPLE** Three networks you may find in everyday life.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_5_1.png)


    **Q1** Describe an example of a network that may exist in a:

    a) supermarket

    b) sports stadium


    # ## There are **benefits** and **drawbacks** of networks


    +   Three **benefits** of networks:

    1) Messages can be sent **quickly** and **cheaply** — for example, by **email**.

    2) Some **actions** can be done **remotely**, such as switching off all computers
    in a classroom.

    3) **Files** and **devices**, like printers, can be **shared** between computers.


    +   Three **drawbacks** of networks:

    1) They can be **expensive** to **set up**.

    2) They may need **regular maintenance**.

    3) If a **hacker** or **malware** enters a network, **all** the connected devices
    may be affected.


    > **Malware** is a computer program designed to do something nasty. E.g. deleting
    or modifying files.


    **I thought about avoiding networks, but wi-fight the inevitable...**

    Computer networks date back to the 1950s — these days, you can''t get far without
    interacting with one. If you''ve got an electronic device, someone somewhere will
    be trying to connect it up.'
  merge: -1
