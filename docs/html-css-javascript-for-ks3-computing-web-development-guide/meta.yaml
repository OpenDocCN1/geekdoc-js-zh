    * 在提交评分之前，当鼠标悬停在星星上时，它们应该亮起金黄色，以向用户显示他们将选择的评分。\n* 要提交评分，用户可以点击其中一颗星星。\n* 评分提交后，不能更改——正确的星星应保持金黄色，并显示相关信息。\n\
    \n## 第九节 — 更长的挑战\n\n### 实战挑战\n\n是时候创建一些更大更好的网页了。本节中的挑战旨在让你花费更多时间，并测试你跨多个章节所学的内容。你也可以随时用你自己的想法来扩展它们。并且记住，访问\
    \ cgpbooks.co.uk/biscuit 获取每个挑战的完整示例代码。\n\n### 网络开发小贴士\n\n在开始你的开发之旅之前，这里有一些建议：\n\
    \n+   1) 开始前仔细阅读挑战。\n2) 一点规划大有裨益。\n   - 将挑战分解成更小的部分来逐步解决。\n   - 在纸上勾勒出你的网页，以帮助你决定样式。\n\
    \   - 快速翻阅本书，决定需要使用哪些技术。\n3) 定期保存你的工作副本，并为较大的更改使用新的文件名（例如 index-v2.html）。这样，如果需要，你可以回退到旧版本。\n\
    4) 编写每段代码后测试你的页面——保存它，并在浏览器中重新加载页面。\n5) 记住，使用HTML和CSS时，你通常不会收到大的错误信息——如果有些东西不太工作，寻找常见的嫌疑对象：标签未正确闭合、未使用引号、单词拼写错误、缺少括号...\
    \ 列表很长。只需确保你仔细检查你的代码。\n\n这里有两个实战挑战开始。试试看，然后看看下面的解决方案。\n一如既往，别忘了访问目录页上的链接，下载所有挑战的代码文件。\n\
    \n### 实战挑战1 — 创建用户名\n\nIona Naccount 需要一个网页，可以通过形容词、名词和1到30之间的一个随机生成的数字来创建用户名。\n\
    这些详细信息应通过表单输入，然后组合成一个字符串（例如 HeroicBat15），并作为警报输出。\n\n> 如果HTML已经取代了英语在你大脑中的位置，形容词是一个描述性词语（例如\
    \ heroic），名词是一个事物（例如一只蝙蝠或一个人）。\n\n```\n<form>\n    <label for=\"adjective\">Adjective:</label>\n\
    \    <input type=\"text\" id=\"adjective\">\n    <br><label for=\"noun\">Noun:</label>\n\
    \    <input type=\"text\" id=\"noun\">\n    <br><button type=\"button\" onclick=\"\
    generateUsername()\">\n    Generate username</button>\n</form>\n<script>\n   \
    \ function generateUsername() {\n        let adjective = document.getElementById(\"\
    adjective\").value;\n        let noun = document.getElementById(\"noun\").value;\n\
    \        let randomNumber = Math.floor(Math.random() * 30) + 1;\n        let username\
    \ = adjective + noun + randomNumber;\n        alert(\"Your generated username:\
    \ \" + username);\n    }\n</script>\n```\n"
