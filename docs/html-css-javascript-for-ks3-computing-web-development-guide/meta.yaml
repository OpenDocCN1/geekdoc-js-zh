  - '[PAGE 21]


    # Section Three — Adding Style with CSS


    # Accessible Design Principles


    **Learning Objectives**

    This section is all about adding a bit of glitz and glamour to your web pages
    — they''ve been quite bland so far. But first, here''s a few words about accessibility.


    * Learn about ways to design accessible web pages.

    * Be able to use the alt attribute to add image descriptions.


    # Follow these accessibility principles


    +   1. Accessibility is all about making something that can be used by as many
    people as possible.

    2. This is especially important for those with disabilities or impairments.


    Put headings in order of importance.

    E.g. <h1> should be used for the most important heading and come first on the
    page.


    Put big headings above small ones or **it can be confusing** to know what to read
    first...


    Space out text using <p> tags for paragraphs and the <br> tag for line breaks.


    ```

    <p>Time for a haiku...</p>

    <p>Paragraphs; line breaks. <br> Use their tags to format text <br> like a web
    dev pro.</p>

    ```


    Time for a haiku...

    Paragraphs; line breaks.

    Use their tags to format text like a web dev pro.


    Use high-contrast colours to make text easier to read.


    This is important for low-vision and colour-blind users.


    Make hyperlinks obvious — keep them underlined and colour them differently.


    Would you like to know more?

    [Learn about styling links.]


    # alt adds an alternative to <img>


    +   * The alt attribute can be added to an <img> tag to provide a text description
    of the image.

    * If the image cannot load for any reason, this alt text will be shown instead.

    * Screen readers use it too — they help people with visual impairments to understand
    what the image shows.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_21_0.png)


    ```

    <img src="shark.png" alt="A cartoon picture of a shark wearing scuba gear">

    ```


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_21_1.png)


    Spiders, wasps, and now sharks too... Was there no alternative?

    Accessibility features can help search engines understand your page too — they
    use headings to figure out the structure of your content, and alt attributes to
    know what your images are showing.'
  - "[PAGE 22]\n\n# # Styling Pages\n\n> ### Learning Objectives\n\nOkay, no more\
    \ excuses, it's finally time to get your web pages looking fabulous. Prepare to\
    \ become a bilingual web developer — you're going to be learning CSS.\n\n* Understand\
    \ what CSS stands for and what it's used for.\n* Be able to use the style attribute\
    \ to add inline CSS.\n* Be able to use the border-style property to add borders.\n\
    \n# ## CSS adds style to your web pages\n\n1) **CSS** stands for **Cascading Style\
    \ Sheets** — like HTML, it's another web language.\n\n2) A web page can **include\
    \ a mix** of HTML and CSS:\n   * HTML **marks up** the different **elements**\
    \ — like headings, paragraphs, **etc.**\n   * CSS **changes how** these elements\
    \ **look** — the fonts, colours, **etc.**\n\n3) A typical bit of CSS **looks like**\
    \ this:\n   * This is a property — it's a feature of the element that you're wanting\
    \ to change.\n   * `border-style`: solid;\n   * This is the property's value —\
    \ it's how you want the feature to look.\n\n# ## Use the style attribute to set\
    \ properties inline\n\n* The simplest way to use CSS is to add it directly into\
    \ HTML tags using their style attribute.\n* This is known as inline CSS — other\
    \ ways of using CSS are covered in Section 5.\n\n**EXAMPLE** How to add borders\
    \ to elements on your page.\n\nAdd a style attribute to the opening tag. Inside\
    \ the quotes, write the property followed by a colon. Then write the value followed\
    \ by a semi-colon.\n\n```\n<h1 style=\"border-style: solid;\">Ooh, what a nice\
    \ border</h1>\n\n<p>This paragraph has no style, so no border</p>\n\n<p style=\"\
    border-style: dotted;\">But this one has a dotted border</p>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_22_0.png)\n\
    \nYou can use the border-style property with most elements.\n\nThe borders will\
    \ stretch out to fill the width of your web browser. You'll learn to control their\
    \ size on p.24.\n\n> If a property isn't set, then a default value will be used\
