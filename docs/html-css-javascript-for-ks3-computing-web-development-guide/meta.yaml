    \n## 独立挑战\n\n好了，现在你要独立完成*。尝试运用你所学的知识来创建这些网页。前几个挑战涵盖了 **第 2-6 节** 的内容，但如果你知道任何更高级的网页开发技巧，也可以自由运用，让你的页面看起来更棒。*完整的示例解决方案仍在\
    \ cgpbooks.co.uk/biscuit 提供\n\n### 挑战 1 —— 环保意识\n\n你的学校希望你创建一个**单一网页**，用于向即将入学的**七年级学生**提供**环保建议**。你的页面应包含以下**功能**：\n\
    \n- 三种类型的 **HTML 标题**。\n- 两种类型的 **HTML 列表**。\n- 使用 **内部 CSS** 和至少一个 **内联 CSS**\
    \ 示例，设计符合**环保意识主题**的样式。\n- 至少**两张图片**，保存在名为 'images' 的**文件夹**中。\n- 一个合适的**图标**（网站图标）。\n\
    \n> 翻回第 40 页，回顾如何为网页添加图标。\n\n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_83_0.png)\n\
    \n### 挑战 2 —— 粉丝页面\n\n一家名为 'Fandomz' 的初创公司正在创建一个网站，以**展示不同的乐队**。他们希望你**设计这个网站**，为其**前两个特色乐队**制作页面：\n\
    \n**FUNKY WAV3** 是一支来自加拿大班夫的**独立乐队**。他们的音乐**节奏快**、**充满活力**且**积极向上**。他们在北美很出名，并开始**在全球拓展他们的粉丝群**。\n\
    \n![示例图](img/091ebbf5c71b5ebb2a4f4a460b11dfa_83_1.png)\n\n> 视频解决方案\n记住，你也可以在 cgpbooks.co.uk/biscuit\
    \ 找到所有视频解决方案\n\n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_83_2.png)\n\n**Eisensturm**\
    \ 是一支来自德国多特蒙德的**重金属乐队**。他们喜欢创作**响亮**、**嘶吼**的歌曲，并拥有一小群死忠**粉丝**。他们喜欢的颜色范围从**黑色**到**深灰色**。\n\
    \n你的网站应该：\n\n- 有一个**主页**和一个**导航栏** —— 网站**每个页面**都应使用相同的导航栏。\n- 为这两个**乐队**各做一个页面，包含：\n\
    \  - 一个“**乐队简介**”部分，包含关于乐队的**简要信息**（你可以自己编造）。\n  - 一个“**图片库**”，在页面上展示几张**相关图片**。\n\
    \  - 一个“**联系我们**”部分，包含一个**链接**，点击后打开一个**电子邮件**地址，收件人是该乐队（例如，可以是乐队成员或乐队经理）。\n-\
    \ 每个页面的**样式**要与**乐队的风格**相匹配。\n\n> 翻回第 41 页，查看如何添加导航栏。\n\n## 独立挑战\n\n从挑战 3 开始，将需要一些\
    \ JavaScript 才能让页面正常工作。它们比前几个挑战稍微难一点，所以如果需要帮助，请务必翻回第 7 和第 8 节。\n\n### 挑战 3 ——\
    \ 设计生日贺卡\n\n创建一个让用户**设计**生日贺卡的网页。**可自定义选项**应包括：\n\n- **背景颜色**。让用户通过输入颜色名称来选择。\n\
    - **文本**的**颜色**。\n- **文本**的**大小**。这应该经过**验证**，确保仅在 **20 到 50 像素**之间。\n- **字体**（允许用户从**三种**中选择）。\n\
    - **文本**的**对齐方式**（左对齐、居中或右对齐）。\n- 贺卡的**内容**（例如，“致”行、生日祝福语和署名行）。\n\n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_84_0.png)\n\
    \n这些选项应通过一个**输入表单**进行**控制**，为贺卡中的每个**样式属性**和**文本行**提供不同的**输入字段**。你的页面应显示一个**示例**，展示贺卡在用户**应用**其选择后的外观**变化**。\n\
    \n### 挑战 4 —— 倒计时\n\n创建一个网页，**计算**并显示距离**以下事件**还有多长时间（以月和天为单位）：\n- **新年**。\n-\
    \ 用户的下一个**生日**（用户应能够输入日期）。\n\n你应该将这些显示为横跨屏幕的方框，如下所示。\n\n日历很复杂，为了简化这个挑战，你可以假设每个月有\
    \ 31 天来进行粗略计算。\n\n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_84_1.png)\n\n你可以自己选择**颜色**和**样式**。\n\
    \n提示：考虑当用户生日所在的月份在当前月份之前，以及当用户生日所在的日子在当前日子之前时（这也会影响月份），计算方式可能会有所不同。\n\n### 挑战\
    \ 5 —— 随机数学测验\n\n创建一个网页，为地区性的**心算测验比赛****准备学生**。在编写任何代码之前，你可以**选择** + - / 或 *\
    \ 中的**一种**运算符用于**整个测验**。\n\n你的页面应使用一个**表单**，要求用户设置问题**难度** —— 选项应为，例如**简单**数字（1\
    \ 到 10）、**中等**数字（10 到 100）或**困难**数字（100 到 1000）。\n\n然后，页面应显示一个使用用户**选定范围**内**随机数字**的**单个数学运算**\
    \ —— 他们需要另一个**表单**来输入**答案**。\n\n如果用户**答对**了这道题，他们的**分数**应**增加一分**，并显示**下一道题**。如果用户**答错**，测验应**结束**，并**显示**他们的**最终分数**。\n\
    \n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_84_2.png)\n\n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_84_3.png)\n\
    \n## 独立挑战\n\n### 挑战 6 —— 你能多快……\n\n一家游戏开发商希望你设计一个包含三个速度游戏的网站。应该有一个主页和一个每个游戏的页面，所有页面都通过导航栏连接。游戏概述如下\
    \ —— 你需要在其页面上包含每个游戏的说明。\n\n#### 你能多快点击？\n\n在这个游戏中，玩家必须在 10 秒内尽可能多次地点击一个按钮。\n\n\
    - 页面应显示一个大按钮，点击时开始一个可见的 10 秒倒计时。\n- 应记录用户在这段时间内点击按钮的次数。\n- 倒计时结束后，应向用户显示点击次数，并且按钮应重置，以便可以再次玩游戏。\n\
    \n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_85_0.png)\n\n#### 你能多快打字？\n\n在这个游戏中，玩家必须尽快将屏幕上显示的句子输入到输入框中。\n\
    \n- 用户输入的内容应“实时”显示在输入框下方。\n- 应记录从他们开始输入句子到正确完成输入句子的时间。\n- 游戏结束时，应向用户显示该时间以及他们的每分钟字数（WPM）得分。\n\
    \n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_85_1.png)\n\n#### 你能多快反应？\n\n在这个游戏中，一些炸药会在随机时间后出现在一个按钮上\
    \ —— 用户必须尽快点击它来拆除。\n\n- 游戏应由“开始”按钮和“重置”按钮控制。\n- 一旦炸药按钮出现，屏幕上应显示一个计时器（以毫秒为单位向上计数）。\n\
    - 当用户点击炸药按钮时，图形应更改以显示它已被拆除，并且计时器应停止以显示用户的反应时间。\n\n![示例图](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_85_2.png)\n"
