  md: "# Coding Challenges for Section Eight\n\nRight, that's your lot. HTML? Smashed\
    \ it. CSS? Smashed it. JavaScript? Let's do a few more challenges... Have a go\
    \ at these ones, then visit cgpbooks.co.uk/biscuit to download example code for\
    \ each.\n\n# Challenge 1 — Example\n\nCreate a web page that shows a collection\
    \ of cute animal photos to lift people's spirits. The user should be able to type\
    \ the name of an animal they wish to see to get it to show up — if this animal\
    \ isn't in the collection, the page should apologise and show another photo instead.\n\
    \n```\nPlan: Use a form with an input field for the animal name, and a button\
    \ that calls a function to display a photo.\n\nfunction updatePhoto() {\n  let\
    \ photo = document.getElementById(\"photo\");\n  let animal = document.getElementById(\"\
    animal\");\n  let chosenAnimal = animal.value.toLowerCase();\n  if (chosenAnimal\
    \ == \"cat\") {\n    photo.src = \"cute-cat.jpg\";\n  }\n  else if (chosenAnimal\
    \ == \"dog\") {\n    photo.src = \"cute-dog.jpg\";\n  }\n  else {\n    alert(\"\
    Sorry - I've no photos of that ...\");\n    photo.src = ...\n  }\n  photo.style.display\
    \ = \"block\";\n}\n```\n\n# Challenge 2\n\nModify the web page from Challenge\
    \ 1 to instead show a randomly chosen photo which changes each time it's clicked.\
    \ Frame the photo in a container with a background colour that also randomly changes\
    \ whenever the photo does.\n\n# Challenge 3\n\n+   Create a website that simulates\
    \ a rocket launch. It should:\n* Initially, display only a \"Launch Rocket\" button.\n\
    * When the button is clicked, it should change to display a timer.\n* The timer\
    \ should count down 10 seconds in real-time.\n* When the timer reaches 0, the\
    \ page should change one last time to display an image of a rocket ship blasting\
    \ off.\n\n# Challenge 4\n\n+   Java's Crypt were impressed with your last web\
    \ page (see Challenge 3 on p.63) — but they want it improved. They have requested\
    \ that you remove the prompt and replace it with the following feature:\n* When\
    \ first loaded, the page should display three transparent stars.\n* Before a rating\
    \ has been submitted, the stars should light up gold when hovered over to show\
    \ the user what rating they'll be choosing.\n* To submit a rating, the user can\
    \ click on one of the stars.\n* After a rating has been submitted, it can't be\
    \ changed — the correct stars should stay gold and a related message should be\
    \ shown."
