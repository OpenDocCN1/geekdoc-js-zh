    \    -   三重烟熏培根\n    -   森林风格蘑菇\n    -   一系列全谷物麦片\n-   一个\"联系\"页面，包含酒店地址、电话号码和一个链接，点击后可打开一个地址为酒店的新电子邮件。\n\
    -   用于在各页面之间导航的链接。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_38_0.png)\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_38_1.png)\n\
    \n> 你可以自行编造这些联系信息。\n\n## 挑战 4\n\n一位英语老师希望你创建一个网站，供他的学生学习他最喜欢的诗歌——爱德华·李尔创作的《猫头鹰与小猫咪》。下面所示的主页已经制作完成。\n\
    \n```\n<body style=\"background-color: AliceBlue; text-align: center; font-family:\
    \ Optima, sans-serif;\">\n  <h1>The Owl and the Pussycat</h1>\n  <h2>By Edward\
    \ Lear</h2>\n  <p>Select a stanza:</p>\n  <p><a href=\"stanza-1.html\">First stanza</a></p>\n\
    \  <p><a href=\"stanza-2.html\">Second stanza</a></p>\n  <p><a href=\"stanza-3.html\"\
    >Third stanza</a></p>\n</body>\n```\n\n| 猫头鹰与小猫咪 |\n| :--- |\n| 作者：爱德华·李尔 |\n\
    | 选择一个诗节： |\n| [第一节] |\n| [第二节] |\n| [第三节] |\n\n你需要为每一节诗创建一个网页，包括：\n\n-   诗歌标题和节号。\n\
    -   相应的诗歌节。\n-   适当位置的\"下一节\"和/或\"上一节\"链接。\n-   一个返回主页的链接。\n\n> 诗节是将诗歌分成若干部分的若干行组合。\n\
    \n你应该使用CSS为页面设置样式，并将文件名与上面代码中的内部链接匹配。这首诗包含在本挑战的可下载内容中，文件名为`poem.txt`。\n\n## 第五节\
    \ —— 样式表\n\n## 内部CSS\n\n**学习目标**\n将CSS与HTML混合使用可能会让代码变得臃肿难读，就像这个比喻一样，添加得越多就越难以理解——所以，让我们来分解一下。\n\
    -   理解使用内部CSS而非内联CSS的目的。\n-   能够使用`<style>`标签来编写内部CSS。\n\n## style属性有其缺点\n\n记住，内联CSS被分配给特定HTML元素的style属性。\n\
    \n1.  如果你有大量内联CSS，代码可能变得难以阅读和编写。\n2.  相同的代码需要重复使用来以相同方式设置不同内容的样式，页面内容可能会淹没在周围的代码中——逐个设置每个标签的样式也可能花费很长时间。\n\
    \n**常见问题**\n内联CSS如何变得重复。\n`<h1>`标签有相同的样式重复——`<p>`标签也是如此。\n\n```\n<h1 style=\"\
    color: Orange;\">Bad Food</h1>\n<p style=\"font-family: Arial; color: Blue;\"\
    >Deep-fried celery</p>\n<h1 style=\"color: Orange;\">Baddest Food</h1>\n<p style=\"\
    font-family: Arial; color: Blue;\">Hot dogs</p>\n```\n\n**糟糕的食物**\n油炸芹菜\n**最糟糕的食物**\n\
    热狗\n\n## 使用`<style>`标签添加内部CSS\n\n-   样式表只是一组用于设置网页样式的CSS规则的集合。\n-   内部CSS是在页面`<head>`中通过`<style>`标签标记的样式表。\n\
    \n**示例**\n使用内部CSS重新创建上面的示例。\n\n```\n<head>\n  <style>\n    h1 { color: Orange;\
    \ }\n    p {\n      font-family: Arial;\n      color: Blue;\n    }\n  </style>\n\
    </head>\n<body>\n  <h1>Bad Food</h1>\n  <p>Deep-fried celery</p>\n  <h1>Baddest\
    \ Food</h1>\n  <p>Hot dogs</p>\n</body>\n```\n\n内部CSS位于`<head>`元素内的`<style>`标签之间。\n\
    属性/值对与内联CSS相同，但你不需要引号。\n两个`<h1>`元素将具有相同的样式——两个`<p>`元素也是如此。\n\n你需要为每个想要设置样式的标签命名。\n\
    花括号`{ }`必须包围每个标签的样式。就像HTML一样，你可以使用缩进和额外的空格使CSS更易于阅读。\n你不需要在`<body>`中使用任何内联CSS，因为内部CSS会自动应用。\n\
    \n**关键术语**\n通过`<style>`标签标记的内部CSS也称为内部样式表。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_39_0.png)\n\
    \n由这段代码创建的网页看起来与上面的示例完全相同。\n\n你将在第45页看到如何为同一类型的元素设置不同的样式。\n\n## 我已经内化了这个——它现在免费住在我的`<head>`里了...\n\
    \n使用内部CSS时，你仍然可以使用内联CSS来设置单个元素的样式。如果同一属性在内联和内部CSS中都设置，那么内联CSS将优先（见第40页）。\n\n##\
    \ 设置超链接样式\n\n**学习目标**\n-   链接是人们在你的网站上导航的方式，所以你不希望它们被忽略——这里有一些技巧，可以使用内部CSS让你的链接脱颖而出。\n\
    -   理解已访问和未访问链接之间的区别。\n-   能够使用`a`、`a:link`和`a:visited`来更改链接的样式。\n\n## 链接可以是已访问或未访问的\n\
    \n1.  正如你在第四节所看到的，超链接是使用`<a>`标签创建的。\n2.  未访问链接是指向你以前未访问过的网页的超链接。默认情况下，在不应用CSS的情况下，它们是蓝色带下划线的。\n\
    3.  一旦访问了链接的网页，链接将变为紫色。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_40_0.png)\n\
    \n## 使用内部CSS设置链接样式\n\n-   你可以使用`a`为所有链接（无论是否已访问）应用样式。\n-   你可以使用`a:link`设置未访问链接的样式，使用`a:visited`设置已访问链接的样式。\n\
    \n```\n<head>\n<style>\n    a {\n        font-size: 20px;\n    }\n    a:link {\n\
    \        color: DodgerBlue;\n        text-decoration-color: Navy;\n    }\n   \
    \ a:visited {\n        color: DarkOrange;\n        text-decoration-color: Red;\n\
    \    }\n</style>\n</head>\n<body>\n    <a href=\"https://www.ordnancesurvey.co.uk\"\
    >Click me</a>\n</body>\n```\n\n**示例**\n最佳实践是按以下顺序设置链接样式：`a`、`a:link`，然后是`a:visited`。\n\
    \n所有链接的字体大小将为20像素。\n\n这是链接在未访问时的外观。[点击我]\n\n此属性设置文本任何\"装饰\"的颜色——对于链接，通常是指下划线。\n\
    \n这是链接在已访问后的外观。[点击我]\n\n如果此URL已在你的Web浏览器历史记录中，它将被视为已访问——因此，如果你想看到未访问的样式应用，请将其更改为一个你从未访问过的地方。\n\
    \n-   `text-decoration`属性也可用于设置链接样式——它可以有以下值：`underline`、`overline`、`line-through`和`none`。\n\
    \n**Q1** 编写内部CSS，将链接设置为以下样式：\n未访问 [点击我]\n已访问 [点击我]\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_40_1.png)\n\
    \n出于安全原因，大多数Web浏览器限制你允许为`a:visited`更改的属性。如果你发现无法以某种方式设置已访问链接的样式，那可能是不允许的。\n\n\
    `a:link`和`a:visited`是CSS中\"伪类\"的例子。另一个是`a:hover`（见第41页），还有`a:active`，用于在链接被点击的瞬间设置其样式。\n\
    \n> **CSS恶作剧：交换链接的默认蓝色和紫色...**\n...但说真的，别忘了第18页的无障碍设计原则——你的链接应该易于阅读，并且应该看起来与其他文本不同，这样人们才能看到它们。\n"
