- md: "## Coding Challenges for Section Three\n\nHello again — there's a second page\
    \ of challenges for this section, and you're looking right at it. Feel free to\
    \ take a breather before continuing on.\n\n## Challenge 3\n\n**Style Park Zoo**\
    \ have created a web page to showcase their new star attraction: **Biscuit**,\
    \ the **honey badger**.\n\n[Recreate the page](shown on the right) as accurately\
    \ as you can based on the following details:\n\n-   The colours used are: Black,\
    \ Blue, Firebrick, Gold and Khaki.\n-   The photo has been described as, \"Biscuit,\
    \ a honey badger, out on the prowl.\"\n-   The page has been designed to look\
    \ best on a mobile device — it has a width of 400 pixels.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_30_0.png)\n\
    \n> The bloomin' cheek, I bathe weekly!\n\n## Biscuit the Honey Badger\n\nWe are\
    \ delighted to welcome a wonderful new animal, all the way from Kenya.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_30_1.png)\n\
    \nHer name is Biscuit and she is a honey badger, and she'd love to see you at\
    \ the zoo soon.\n\n## Three *Fun Facts* about Biscuit\n\n1.  She's not even a\
    \ badger, she's more like a weasel or something.\n2.  She eats frogs and snakes\
    \ *for breakfast*.\n3.  She smells **so bad** she can raid beehives without the\
    \ bees wanting to go near her.\n\nCome and see Biscuit at the zoo!\n\n## Challenge\
    \ 4\n\n**Max Revs** (American stunt driver) has **made his own** web page. Right\
    \ now, it doesn't **reflect his patriotic, daredevil persona** very well. The\
    \ `<body>` of his code is shown below.\n\n```\n<p>Max Revs</p>\n<p>About Max</p>\n\
    <p>Max is a world-famous stunt driver with over two years' experience!</p>\n<p>Max\
    \ can do the following stunts:</p>\n<p>- Wheelies</p>\n<p>- Drifting</p>\n<p>-\
    \ Crazy big jumps</p>\n<p>- Driving at mad speed</p>\n<p>- Parallel parking</p>\n\
    <p>Here's Max:</p>\n<img src=\"max-revs.jpg\" width=\"400\">\n```\n\nEdit the\
    \ page to **improve the HTML** and **add style with CSS**:\n\n-   Fill in the\
    \ **whole page** in a cool 'DodgerBlue' colour.\n-   Make the **key info** stand\
    \ out with **headings** and **exciting colours**.\n-   Mark up the **list of stunts**\
    \ properly and give it an **alternating** Red and White background (to look like\
    \ the stripes on the **USA flag**).\n-   Max likes to be **centre-stage**, so\
    \ make sure his photo appears in the **middle** of the page at the bottom, and\
    \ has a **double border**.\n\nMax Revs\nAbout Max\nMax is a world-famous stunt\
    \ driver with over two years' experience!\nMax can do the following stunts:\n\
    - Wheelies\n- Drifting\n- Crazy big jumps\n- Driving at mad speed\n- Parallel\
    \ parking\nHere's Max:\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_30_2.png)\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_30_3.png)\n\n## Section Four — Creating\
    \ Multi-Page Websites\n\n### Organising Files\n\nBefore we get coding in this\
    \ section, let's talk about organisation. No, I don't mean tidying your room,\
    \ I mean file management — it's useful for developing multi-page sites.\n\n- \
    \  Understand sensible ways to name files.\n-   Understand sensible ways to organise\
    \ projects with folders.\n\n### Be consistent with file naming\n\n1.  There are\
    \ a few naming rules that can be useful for web developers to follow:\n    - \
    \  Use descriptive names so you can understand them at a glance (e.g. surfing-cat.jpg\
    \ tells you more than image1.jpg).\n    -   Use hyphens, not spaces, to separate\
    \ words (e.g. thy-holy-texts.html).\n    -   Call the home page of your website\
    \ 'index.html' — it's common practice and most web servers will know to use it.\n\
    2.  Following these rules consistently can help minimise errors.\n\nQ1 Improve\
    \ the following file names:\na) weird dog.png\nb) asdf2.jpg (image of a train)\n\
    c) home_page.html\n\n### Use folders to organise projects\n\n-   Over the next\
    \ few pages, you'll be linking together multiple web pages — it helps to keep\
    \ all the files together in one project folder.\n-   If you're using lots of images,\
    \ create a separate 'images' folder inside the project folder to keep them in.\n\
    \nEXAMPLE How a typical project folder might look.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_31_0.png)\n\
    \nPick a sensible folder to save your project in.\nA project folder just for this\
    \ website.\nA folder just for this website's images.\nAn HTML file for each of\
    \ the web pages ('index' is the home page).\nYour folders may look a bit different\
    \ depending on your settings and operating system.\n\nQ2 List three things that\
    \ could be improved with the file organisation of this project.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_31_1.png)\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_31_2.png)\n\n### Folder? No, I'm more\
    \ of a scruncher myself...\n\nAs you do more web development, good file organisation\
    \ will pay off. It's also smart to save copies of projects as you go, so if anything\
    \ goes wrong, you can go back to an older version to recover it.\n\n## External\
    \ Hyperlinks\n\nHyperlinks are great for jumping between web pages or sites —\
    \ kind of like getting teleported in a sci-fi movie. Don't beam me up yet, Scotty,\
    \ I'm still writing the intr...\n\n-   Understand what a hyperlink is.\n-   Be\
    \ able to use `<a>` tags to mark up links to external web pages.\n\n### Hyperlinks\
    \ take you to other places\n\n1.  A hyperlink (or just 'link') is something you\
    \ can click on to take you from one web page to another.\n\n    -   An internal\
    \ hyperlink can take you to other web pages on the same website (see next page).\n\
    \    -   An external hyperlink will take you to a different website altogether.\n\
    \nQ1 Give two examples of how external hyperlinks are used on:\na) google.com\n\
    b) wikipedia.org\n\n2.  There wouldn't be a 'Web' without these links between\
    \ different sites.\n\n### Use `<a>` and `href` to add hyperlinks\n\n-   The `<a>`\
    \ tag marks up a hyperlink in HTML.\n-   The `href` attribute is used with the\
    \ `<a>` tag to tell the web browser where you want the link to go.\n-   Whatever\
    \ you put between the `<a>` and `</a>` tags will become a clickable link on the\
    \ web page.\n\nThe 'a' in the `<a>` tag stands for 'anchor'.\n\n```\n<body style=\"\
    font-family: Arial, sans-serif;\">\n  <p>This book has LOTS of code files.</p>\n\
    \  <p>\n    <a href=\"https://www.cgpbooks.co.uk/biscuit\">\n      Download them\
    \ here</a>.\n  </p>\n  <p>Or click this button:</p>\n  <a href=\"https://www.cgpbooks.co.uk/biscuit\"\
    >\n    <img src=\"download.png\" width=\"150\"></a>\n</body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_32_0.png)\n\
    \nSet the href attribute to the URL you want to link to — make sure this goes\
    \ in quotes.\n\nAdd the text that you want to be clickable — and don't forget\
    \ the closing `</a>` tag.\n\nTo turn an image into a hyperlink, do the same thing,\
    \ but put the image (see p.14) between the `<a>` and `</a>` tags instead.\n\n\
    You need to put in the full URL into the href, including the `https://` part,\
    \ otherwise this link won't work.\n\nSee p.3 for a recap on URLs.\n\nThis book\
