- md: "## Section Three — Adding Style with CSS\n\n### Accessible Design Principles\n\
    \n**Learning Objectives**\nThis section is all about adding a bit of glitz and\
    \ glamour to your web pages — they've been quite bland so far. But first, here's\
    \ a few words about accessibility.\n\n*   Learn about ways to design accessible\
    \ web pages.\n*   Be able to use the alt attribute to add image descriptions.\n\
    \n### Follow these accessibility principles\n\n1.  Accessibility is all about\
    \ making something that can be used by as many people as possible.\n2.  This is\
    \ especially important for those with disabilities or impairments.\n\nPut headings\
    \ in order of importance.\nE.g. <h1> should be used for the most important heading\
    \ and come first on the page.\n\nPut big headings above small ones or **it can\
    \ be confusing** to know what to read first...\n\nSpace out text using <p> tags\
    \ for paragraphs and the <br> tag for line breaks.\n\n```html\n<p>Time for a haiku...</p>\n\
    <p>Paragraphs; line breaks. <br> Use their tags to format text <br> like a web\
    \ dev pro.</p>\n```\n\nTime for a haiku...\nParagraphs; line breaks.\nUse their\
    \ tags to format text like a web dev pro.\n\nUse high-contrast colours to make\
    \ text easier to read.\n\nThis is important for low-vision and colour-blind users.\n\
    \nMake hyperlinks obvious — keep them underlined and colour them differently.\n\
    \nWould you like to know more?\n[Learn about styling links.]\n\n### alt adds an\
    \ alternative to <img>\n\n*   The alt attribute can be added to an <img> tag to\
    \ provide a text description of the image.\n*   If the image cannot load for any\
    \ reason, this alt text will be shown instead.\n*   Screen readers use it too\
    \ — they help people with visual impairments to understand what the image shows.\n\
    \n```html\n<img src=\"shark.png\" alt=\"A cartoon picture of a shark wearing scuba\
    \ gear\">\n```\n\nSpiders, wasps, and now sharks too... Was there no alternative?\n\
    Accessibility features can help search engines understand your page too — they\
    \ use headings to figure out the structure of your content, and alt attributes\
    \ to know what your images are showing.\n\n## Styling Pages\n\n> **Learning Objectives**\n\
    \nOkay, no more excuses, it's finally time to get your web pages looking fabulous.\
    \ Prepare to become a bilingual web developer — you're going to be learning CSS.\n\
    \n*   Understand what CSS stands for and what it's used for.\n*   Be able to use\
    \ the style attribute to add inline CSS.\n*   Be able to use the border-style\
    \ property to add borders.\n\n### CSS adds style to your web pages\n\n1.  **CSS**\
    \ stands for **Cascading Style Sheets** — like HTML, it's another web language.\n\
    \n2.  A web page can **include a mix** of HTML and CSS:\n    *   HTML **marks\
    \ up** the different **elements** — like headings, paragraphs, **etc.**\n    *\
    \   CSS **changes how** these elements **look** — the fonts, colours, **etc.**\n\
    \n3.  A typical bit of CSS **looks like** this:\n    *   This is a property —\
    \ it's a feature of the element that you're wanting to change.\n    *   `border-style`:\
    \ solid;\n    *   This is the property's value — it's how you want the feature\
    \ to look.\n\n### Use the style attribute to set properties inline\n\n*   The\
    \ simplest way to use CSS is to add it directly into HTML tags using their style\
    \ attribute.\n*   This is known as inline CSS — other ways of using CSS are covered\
    \ in Section 5.\n\n**EXAMPLE** How to add borders to elements on your page.\n\n\
    Add a style attribute to the opening tag. Inside the quotes, write the property\
    \ followed by a colon. Then write the value followed by a semi-colon.\n\n```html\n\
    <h1 style=\"border-style: solid;\">Ooh, what a nice border</h1>\n\n<p>This paragraph\
    \ has no style, so no border</p>\n\n<p style=\"border-style: dotted;\">But this\
    \ one has a dotted border</p>\n```\n\nYou can use the border-style property with\
    \ most elements.\n\nThe borders will stretch out to fill the width of your web\
    \ browser. You'll learn to control their size on p.24.\n\n> If a property isn't\
    \ set, then a default value will be used — for border-style the default is none.\n\
    \n**Ooh, what a nice border**\n\nThis paragraph has no style, so no border\n\n\
    > But this one has a dotted border\n\n*   Some other border-style values you can\
    \ try are: dashed, double, groove, ridge, inset and outset.\n\n| Q1 | Q2 |\n|\
    \ :--- | :--- |\n| Write a line of code that will display an image with a dashed\
    \ border. | Recreate this: Whoa, it's a double border |\n\n> **border-style: eaten\
    \ too much cheese;**\n\nThe colon (:) is always needed — it separates a CSS property\
    \ from its value. The semi-colon (;) is optional if you're only setting a single\
    \ property, but it's good practice to include it anyway.\n\n## Text Colours\n\n\
    **Learning Objective**\n\nIt's time to inject some colour into your web pages,\
    \ and CSS offers a palette of choices. Are you more of a 'LavenderBlush' or a\
    \ 'LemonChiffon' kind of person? Let's find out.\n\n*   Be able to use the `color`\
    \ property to change the colour of text.\n*   Learn about the colour names that\
    \ web browsers support.\n\n### Use the `color` property to colour text\n\n1. \
    \ Whenever you have an element containing text, you can change the text's colour\
    \ using the `color` property.\n2.  The simplest way to set the value of this property\
    \ is to use a colour name, such as 'Red', 'Green' or 'Blue'.\n\n> For more advanced\
    \ colouring, you can use colour codes — see p.38 for more about this.\n\n**EXAMPLE**\n\
    How to change the colour of text.\n\n```html\n<h3>Some of my teachers:</h3>\n\
    <ul>\n  <li style=\"color: Brown;\">Mr Brown</li>\n  <li style=\"color: Green;\"\
    >Ms Green</li>\n  <li style=\"color: Pink;\">Ms Rose</li>\n  <li style=\"color:\
    \ Red;\">Mr Redman</li>\n</ul>\n```\n\nSome of my teachers:\n*   Mr Brown\n* \
    \  Ms Green\n*   Ms Rose\n*   Ms Redman\n\n> If you don't set a colour, you'll\
    \ get a default colour which depends on the user's settings — in this book, we're\
    \ assuming that it's 'Black'.\n\nThe `color` property is set in the `style` attribute\
    \ of each `<li>` tag to give every list item a different colour.\n\nThe bullet\
    \ points are also coloured.\n\n### Be careful spelling 'color'\n\n**COMMON PROBLEMS**\n\
    How not to change the colour of text.\nYou need to use the American spelling,\
    \ so this should be 'color' without the 'u'.\nThe `color` property hasn't been\
    \ set correctly, so this text hasn't changed colour.\n\n```html\n<li style=\"\
    colour: Grey;\">Ms Grey</li>\n```\n\n*   Ms Grey\n\n### Most browsers support\
    \ the same colours\n\n*   There are over a hundred colour names that all modern\
    \ web browsers agree on.\n*   This means users will see the correct colours no\
    \ matter which browser they're using.\n\n> These are my favourites — for many\
    \ more, look at ColourNames.txt in the downloadable files for this section.\n\n\
    | HotPink | BlanchedAlmond | Honeydew | PowderBlue |\n|---|---|---|---|\n| FireBrick\
    \ | SandyBrown | SeaGreen | MidnightBlue |\n\n**Ugh, Ms BlanchedAlmond gave out\
    \ sooooo much homework...**\nIf you change the style of an element, it may change\
    \ things inside it too. E.g. adding `color` to `<ul>` will affect all the list\
    \ items — but you can still add a different `color` to individual list items.\n\
    \n## Background Colours\n\n> **Learning Objectives**\n\nThe best part of a movie\
    \ is what's going on in the background — and I'm not just saying that because\
    \ I've yet to land a big role. Anyway, I feel the same way about web pages.\n\n\
    *   Be able to use the `background-color` property to fill backgrounds.\n*   Learn\
    \ that you can use multiple CSS properties with one element.\n\n### Colour backgrounds\
    \ with background-color\n\nYou can colour the background of any element using\
    \ the `background-color` property.\n\n**EXAMPLE** Filling the background of two\
    \ bits of paragraph text.\n\nYou can use all the same colours as the `color` property\
    \ uses.\n\n```html\n<p style=\"background-color: Yellow;\">How does a CSS coder\
    \ choose a house?</p>\n<p style=\"background-color: LightGrey;\">By comparing\
    \ property values...</p>\n```\n\n**How does a CSS coder choose a house?**\n\n\
    By comparing property values...\n\n> You can think of every HTML element as being\
    \ contained inside a box — it's usually invisible unless you change a style like\
    \ `background-color` or `border-style`. See p.47 for more about this.\n\n### Add\
    \ it to `<body>` to fill the whole page\n\n1.  If you want to fill the entire\
    \ page with colour, just set `background-color` in the `<body>` tag.\n2.  You\
    \ can still change the `background-color` of other elements if you want them to\
    \ be different.\n\n**EXAMPLE** How to fill the whole page in one easy move.\n\n\
    The background of elements is transparent unless it's changed, so setting `background-color`\
    \ in `<body>` has the effect of filling the entire page...\n\n...except for this\
    \ italic text, as the `<i>` tag has its own `background-color` set.\n\n```html\n\
    <body style=\"background-color: LightBlue;\">\n    <h1>Breaking News: Everything\
    \ is Blue!</h1>\n    <p>Apart from\n        <i style=\"background-color: Orange;\"\
    >this</i>.\n    </p>\n</body>\n```\n\n**Breaking News: Everything is Blue!**\n\
    \nApart from *this*.\n\n### You can mix and match style properties\n\nIf you want\
    \ to use multiple style properties, just put them one after the other.\n\n```html\n\
    <p style=\"background-color: Yellow; color: Red; border-style: dashed;\">\n  \
    \  <b>Caution: this code runs hot!</b>\n</p>\n```\n\n> The `color` property changes\
    \ the border's colour too, but you can set that separately using the `border-colour`\
    \ property.\n\n> **Pssst over here — let me fill you in on a little secret...**\n\
    \nDon't forget the accessible design principles on page 18 — if you change one\
    \ of the `color` or `background-color` properties, then think about whether you\
    \ need to change the other one too."
  mdcn: "\n## 第三节 — 使用 CSS 为页面增添风格\n\n### 无障碍设计原则\n\n**学习目标**\n本节旨在为你的网页增添一些光彩和魅力——它们目前看起来相当平淡。但首先，让我们来谈谈无障碍设计。\n\
    \n*   了解设计无障碍网页的方法。\n*   能够使用 `alt` 属性为图片添加描述。\n\n### 遵循这些无障碍设计原则\n\n1.  无障碍设计的核心在于让更多人能够使用。\n\
