  - "[PAGE 60]\n\n# Functions\n\n+   Ah, functions... No, I don't mean fancy social\
    \ events. I'm talking JavaScript functions. You've used a few already, e.g. alert()\
    \ and prompt(), but here's how to make your own.\n\n- Understand what a function\
    \ is and how to define one yourself.\n- Understand how to call a function and\
    \ what this does.\n\n# You can create your own functions\n\nFunctions that you\
    \ want to create need to be defined somewhere in your code — this means they're\
    \ given a name and some code that performs their task.\n\nA function is a named\
    \ block of code that does a particular task.\n\n```\nA function definition starts\
    \ with the word function.\nfunction sayHello() {\n    console.log(\"Hello\");\n\
    }\nYou need to give the function a name, followed by round brackets, ().\nThe\
    \ code inside the curly braces {} is what the function does. Here, it just outputs\
    \ \"Hello\" into the console.\n```\n\n# Functions are used by being called\n\n\
    +   1) If you looked at the console for the example above, you'd see nothing —\
    \ this is because the function has only been defined.\n2) To run it, you need\
    \ to 'call' it.\n3) You can call a function as many times as you want, without\
    \ having to repeat its original code.\n\nCalling a function is when you write\
    \ its name to run its code.\n\n```\nContinuing the example above to call the function.\n\
    sayHello();\nconsole.log(\"Again?\");\nsayHello();\n\nHello\nAgain?\nHello\nThe\
    \ console shows the output from the function.\n```\n\n# You can use buttons to\
    \ call your functions\n\n```\nJust like alert() and prompt(), you can call your\
    \ own functions with <button>s.\n\n<p>Have you seen updog?</p>\n<button onclick=\"\
    updog()\">What's updog?</button>\n<script>\n    function updog() {\n        alert(\"\
    Not much, what's up with you?\");\n    }\n</script>\n\nHave you seen updog?\n\
    What's updog?\nThis page says\nNot much, what's up with you?\n[OK]\n```\n\nFor\
    \ the web pages in this book, we've placed the <script> tags last in the code,\
    \ just before the final </body> tag — it doesn't matter in this example, but it'll\
    \ avoid problems later on.\n\n> The JavaScript police called — they want their\
    \ function back...\nFunctions can save you loads of time when developing your\
    \ code — if you had to rewrite what a function did each time you used it, your\
    \ code would go on and on and on and on and on and..."
  - '[PAGE 61]


    # Changing Text


    Learning Objectives

    Showing outputs as alerts is fun, but it''s not something that real websites use
    very much. All the cool kids use JavaScript to change the content on the page
    itself.

    - Understand the purpose of document.getElementById() and .innerHTML.

    - Be able to change the text within HTML elements using JavaScript.


    # JavaScript can change parts of your web page


    If you want to change bits of content (like text) on a web page:

    1) Set an ID for the HTML element that you want to change (see p.46 for a reminder).

    2) With JavaScript, use document.getElementById() to access the element with that
    ID.

    3) Replace the content of the element using .innerHTML.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_0.png)


    EXAMPLE

    You can change text on the page based on the result of a prompt.


    This <p> tag has been given an ID, so its content can be accessed and changed
    by the script.


    A button is used here to call the function, which will change the content of the
    <p> tag.


    ```

    <p>What''s your favourite colour?</p>

    <button type="button" onclick="getUsersFavColour()">

    Reply</button>

    <p id="fav-colour">Your favourite colour is ???</p>

    <script>

    function getUsersFavColour() {

    let colour = prompt("Enter your favourite colour.");

    let text = "Your favourite colour is " + colour + ".";


    let favColour = document.getElementById("fav-colour");

    favColour.innerHTML = text;

    }

    </script>

    ```


    This is the function that will be run by clicking the button.


    A prompt gets some user input, which is put into a sentence.


    This line gives you access to the element with the ID fav-colour, and...

    ...this line replaces the content of that element with the sentence formed from
    the prompt.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_1.png)


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_2.png)


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_3.png)


    This is the paragraph that will change based on the user''s input.


    This prompt appears when the ''Reply'' button is clicked.


    The paragraph changes to show the user''s input.


    Q1 Extend this code to include another button that says "Ignore". When clicked,
    this should change the second paragraph to give a disgruntled response — you can
    come up with this yourself.


    Functions are case sensitive. .getElementByID will bring up an error because "ID"
    should be "Id".


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_4.png)


    Remember, JavaScript errors won''t appear on the web page itself — check the console
    for errors if your code isn''t working properly.


    ```

    bankStatement.innerHTML = "£1,000,000";

    ```


    Using this JavaScript feature can make your web pages way more interactive, and
    won''t rely on the user having to check the console or alerts to see what''s changed.
    And there''s more to come...


    Section Seven — JavaScript Basics'
  - "[PAGE 62]\n\n# Selection\n\nYou might want content on your web page to change\
    \ differently depending on what the user inputs. If you want to learn how to do\
    \ this, read on. Else, this'll go over your head.\n\n+   - Understand the purpose\
    \ of selection.\n- Be able to use if, else and else if statements.\n\n# Selection\
    \ is used to make decisions\n\n+   1) In JavaScript, if statements are used to\
    \ perform selection.\n2) They're often followed by an else statement.\n\nSelection\
    \ in programming is when code is written that will only do something based on\
    \ a condition.\n\nYou can use selection to respond to user input in different\
    \ ways.\n\nMake sure you use the right brackets — () surrounds the condition,\
    \ {} surrounds the code that will be run if the condition is met.\n\n```\n<p>I\
    \ like pizza.</p>\n<button type=\"button\" onclick=\"getFavTopping()\">Me too</button>\n\
    <p id=\"reaction\"></p>\n<script>\nfunction getFavTopping() {\n  let topping =\
    \ prompt(\"What's your favourite topping?\");\n  let reaction = document.getElementById(\"\
    reaction\");\n  if (topping.toLowerCase() == \"pepperoni\") {\n    reaction.innerHTML\
    \ = \"That's my favourite too!\";\n  }\n  else {\n    reaction.innerHTML = \"\
    Mmm, good choice.\";\n  }\n}\n</script>\n```\n\n== checks if two values are equal\
    \ — see p.64 for more about operators like this.\n\nThe <p> tag is left empty\
    \ for the script to fill in.\n\nThis function will run when the button is clicked.\n\
    \nPut the condition (what you're checking for) in the brackets after if — in this\
    \ case, you're checking if the user's favourite topping is pepperoni.\n\nThis\
    \ takes the value of the variable and makes it all lower case, so the check will\
    \ be true even if the user types e.g. \"Pepperoni\".\n\nThis is the code that\
    \ will run only if the check is true.\n\nAn else statement is optional. It will\
    \ only run when the if condition is false — in this case, when the user answers\
    \ with any topping other than pepperoni.\n\nI like pizza.\nMe too\n\nI like pizza.\n\
    Me too\n\nI like pizza.\nMe too\nThat's my favourite too.\n\nI like pizza.\nMe\
    \ too\nMmm, good choice.\n\nThis will be shown if the user inputs a topping other\
    \ than pepperoni.\n\nThis will be shown if the user inputs \"pepperoni\".\n\n\
    # Use else if to add more checks\n\nIf you want to check for another condition,\
    \ you can add an else if statement between if and else.\n\n```\nif ...\nelse if\
    \ (topping.toLowerCase() == \"pineapple\") {\n  reaction.innerHTML = \"That's\
    \ criminal!\";\n}\nelse ...\n```\n\nThe else if condition will only be checked\
    \ when the if condition is false.\n\nMe too\n\nThat's criminal!\n\nThis will be\
    \ shown if the user chooses pineapple.\n\nQ1 Add a second else if statement to\
    \ this code to give a different response when the user inputs \"spiders\".\n\n\
    You can add as many else if statements as you want.\n\n\"I'm a natural at selection\"\
    \ — Charles Darwin (probably...)\nSelection can take a bit of getting used to.\
    \ Try creating a similar web page to the one above, and make your own responses\
    \ to certain inputs using if, else and else if. Practice makes perfect.\n\nSection\
    \ Seven — JavaScript Basics"
- md: "## Changing HTML Attributes\n\nSimilarly to how you can change text with JavaScript,\
    \ you can also use JavaScript to change the values of HTML attributes — like the\
    \ src attribute for images.\n\n- Be able to change the attributes of HTML elements\
    \ using JavaScript.\n- Be able to use selection to determine how HTML attributes\
    \ are changed.\n\n## JavaScript can change attribute values\n\n1. To change an\
    \ attribute value, set an ID for the element you want to change, then use document.getElementById()\
    \ to gain access to it — just like you did when changing text on p.58.\n2. You\
    \ can then assign a new value to any attribute you want to change.\n\n```html\n\
    <img id=\"image\" src=\"images/question-mark.png\" width=\"200\" alt=\"A green\
    \ question mark\">\n\n<script>\nlet feeling = prompt(\"Feeling good? 'yes' or\
    \ 'no'?\");\nlet image = document.getElementById(\"image\");\n\nif (feeling.toLowerCase()\
    \ == \"yes\") {\n  image.src = \"images/thumbs-up.png\";\n  image.alt = \"A green\
    \ thumbs-up\";\n}\n\nelse if (feeling.toLowerCase() == \"no\") {\n  image.src\
    \ = \"images/thumbs-down.png\";\n  image.alt = \"A red thumbs-down\";\n}\n</script>\n\
    ```\n\nChanging the attributes of an `<img>` element based on a user's response\
    \ to a prompt.\n\nThe user is prompted to input how they're feeling. Initially,\
    \ the src is an image of a question mark. This will only change if one of the\
    \ conditions below is met. Use the ID to gain access to the `<img>`. If the user\
    \ inputs \"yes\", the src changes to a thumbs-up graphic... if they input \"no\"\
    , the src changes to a thumbs-down graphic. The alt attributes are kept up to\
    \ date too for accessibility.\n\nRemember to use a relative file path to your\
    \ images in the src — see p.30 for a reminder. This is what the user sees if they\
    \ answer yes... if they answer no... if they answer anything else.\n\nQ1 Extend\
    \ this code to show a thumb held horizontally if the user inputs \"ok\". Make\
    \ sure you update the prompt to show this as an option.\n\nThe `<script>` tags\
    \ need to come after the `<img>` tag in the example above, otherwise the `<img>`\
    \ won't have loaded in when your script tries to access it. Always putting your\
    \ `<script>` tags before the closing `</body>` tag is an easy way to avoid this\
    \ problem.\n\n### Looks like thumb-one's feeling good today...\n\nYou can use\
    \ this JavaScript to change any attribute you want for an HTML element. For example,\
    \ you could change the width or height attributes, or even which function onclick\
    \ will call.\n\n## Changing CSS Properties\n\nLearning Objectives: Onto styling\
    \ now and, yep, you guessed it, you can also use JavaScript to change the values\
    \ of CSS properties — \"is there anything this stuff can't do?\" I hear you cry...\n\
    - Understand how to change the styling of a web page using JavaScript.\n- Be able\
    \ to use .style to change the CSS properties of elements.\n\n## JavaScript can\
    \ change CSS property values\n\n1. Changing styling works similarly to changing\
    \ text and HTML attributes.\n2. First, set an ID for the element you want to change\
    \ the style of, and use document.getElementById() to access it.\n3. Then change\
    \ the property using .style as shown below.\n\nCommon Problem: JavaScript uses\
    \ CSS properties in lowerCamelCase (see p.54), so you need to write e.g. fontFamily\
    \ instead of font-family like you would in CSS.\n\nEXAMPLE: Changing the font\
    \ colour and background colour at the press of a button.\n\n```html\n<div id=\"\
    content\">\n  <h1>Something here?</h1>\n  <img src=\"images/ftephen.png\" width=\"\
    200\">\n  <p style=\"color: White;\">Ftephen says hi.</p>\n</div>\n<button type=\"\
    button\" onclick=\"changeColor()\">Reveal</button>\n<script>\n  function changeColor()\
    \ {\n    let content = document.getElementById(\"content\");\n    content.style.backgroundColor\
    \ = \"Black\";\n    content.style.color = \"White\";\n  }\n</script>\n```\n\n\
    Unlike previous examples, this ID is applied to a `<div>`, which contains three\
    \ tags. Two CSS style properties have been changed: the background-color and the\
    \ color (which changes the colour of the text). background-color has been converted\
    \ into lowerCamelCase for JavaScript to understand it. When the button is clicked,\
    \ the background colour for the whole `<div>` changes to black, revealing the\
    \ image and the message... and the font colour changes to white so the heading\
    \ can be read on a black background.\n\nOriginally, the image is white with a\
    \ transparent background, and the `<p>` tag has been styled white, so they can't\
    \ be seen on a white background. The `<body>` background colour is usually white\
    \ to begin with, but you may need to set that too.\n\nQ1 How would each of these\
    \ CSS properties be written in JavaScript?\na) margin-right\nb) height\nc) text-align\n\
    \nQ2 Extend the example above so that when the button is clicked, the font family\
    \ changes and more padding is added on the left-hand side.\n\nAre skinny jeans\
    \ back in style? I can't keep up with changes... You've only seen a tiny bit of\
    \ JavaScript at this point, but you can already start to make some really fancy\
    \ pages by combining it with all the HTML and CSS that you learned in earlier\
    \ sections.\n\n## Practice Questions\n\n### Warm-Up\n\nQ1 What is a function?\n\
    \nQ2 True or false? Function names are case sensitive in JavaScript.\n\nQ3 What\
    \ is meant by selection in programming?\n\n### Practice Questions\n\nQ1 a) Name\
    \ the function defined in this code and circle the place where it’s called.\n\n\
    b) Describe how the page changes after the function has run.\n\n```html\n<p>My\
    \ favourite sport is trolley racing.</p>\n<button type=\"button\" onclick=\"getFavSport()\"\
    >What's yours?</button>\n<p id=\"reply\"></p>\n<script>\n  function getFavSport()\
    \ {\n    let sport = prompt(\"Favourite sport\");\n    let message = \"You like\
    \ \" + sport + \".\";\n    let reply = document.getElementById(\"reply\");\n \
    \   reply.innerHTML = message;\n  }\n</script>\n```\n\nQ2 The web page below is\
    \ meant to show a different message and picture depending on whether the user\
    \ types “dogs” or “cats” into a prompt that appears when a button is clicked.\
    \ Complete the JavaScript so that typing “dogs” and “cats” results in the two\
    \ outputs shown below.\n\n```html\n<p id=\"reaction\"></p>\n<img id=\"pet-pic\"\
    \ src=\"dog-vs-cat.jpg\" height=\"200\"> <br>\n<button type=\"button\" onclick=\"\
    petChoice()\">Which is better?</button>\n<script>\n  function petChoice() {\n\
    \    let choice = prompt(\"'dogs' or 'cats'?\");\n    let reaction = document.getElementById(\"\
    reaction\");\n    let petPic = document.getElementById(\"pet-pic\");\n    if (choice\
    \ == \"dogs\") {\n      reaction.innerHTML = \"You know it.\";\n      petPic.src\
    \ = \"dog.jpg\";\n    }\n    else if (choice == \"cats\") {\n      reaction.innerHTML\
    \ = \"Ah, someone of culture.\";\n      petPic.src = \"cat.jpg\";\n    }\n  }\n\
    </script>\n```\n\nQ3 This JavaScript is meant to change a CSS property. Circle\
    \ the four errors, then write the correct code.\n\n```javascript\nlet navBar =\
    \ getElementByID(\"nav-bar\");\nnavBar.background-color = \"Purple\";\n```\n\n\
    Empty box for writing the correct code.\n\nSection Seven — JavaScript Basics.\n\
    \nSmiley face icons for self-assessment: Sad, Neutral, Happy.\n\n## Coding Challenges\
    \ for Section Seven\n\nHopefully your pages are now popping off — just don't spam\
    \ the user with 1000 alerts or they'll think they've got a virus. Have a go at\
    \ these challenges, then head over to cgpbooks.co.uk/biscuit to get the example\
    \ code.\n\n### Challenge 1 — Example\n\nCreate a web page that uses **alerts**\
    \ and **prompts** to help the user create a 'knock knock' joke.\n\n- Start with\
    \ an **alert** with the **message** \"Knock knock...\".\n- Then a **prompt** with\
    \ the **question** \"Who's there?\" to get a **response**.\n- Then a **prompt**\
    \ with the **comeback** \"___ who?\" to get the **punchline**.\n- The user should\
    \ then see the **whole joke laid out** on the web page.\n\n> Fill in the blank\
    \ with the user's response.\n\n> See p.45 for an example joke, and how you might\
    \ style it.\n\n**Plan:** Create a template for the joke in HTML, then use a script\
    \ to fill it in based on the answers to the prompts.\n\n```html\n<p>Knock knock...</p>\n\
    <p>Who's there?</p>\n<p id=\"response\"></p>\n<p id=\"comeback\"></p>\n<p id=\"\
    punchline\"></p>\n```\n\n```javascript\nalert(\"Knock knock...\");\nlet responseText\
    \ = prompt(\"Who's there?\");\nlet comebackText = responseText + \" who?\";\n\
    let punchlineText = prompt(comebackText);\n\nlet response = document.getElementById(\"\
    response\");\nlet comeback = document.getElementById(\"comeback\");\nlet punchline\
    \ = document.getElementById(\"punchline\");\n\nresponse.innerHTML = responseText;\n\
    comeback.innerHTML = comebackText;\npunchline.innerHTML = punchlineText;\n```\n\
    \n> 1. The HTML is simple. The first two lines of the joke can be filled in from\
    \ the start. The other lines are left empty, but given IDs so they can be changed\
    \ by the script. You might also add class attributes to style the page, (not shown\
    \ here).\n\n> 2. Use prompt() to ask the user to input their parts of the joke\
    \ — store each input in a variable.\n\n> 3. .getElementById() is used to access\
    \ each element using their ID.\n\n> 4. Finally, .innerHTML is used to fill in\
    \ the text on the page.\n\n### Challenge 2\n\nCreate a web page that can be **styled**\
    \ in **two different ways** — a **light mode** and a **dark mode**, like the example\
    \ on the right.\n\nThere should be a **button** for each mode that **changes**\
    \ your page to the appropriate styles each time it's **clicked**.\n\nYou can **create\
    \ your own** page or use the **example page** provided in the **downloadable files**\
    \ for this section.\n\n### Challenge 3\n\nA coffee shop, **Java's Crypt**, has\
    \ asked you to make a web page for their **customers** to **rate their experience**.\n\
    \n> Don't forget to make your page look good using CSS.\n\nThe page should:\n\n\
    - Ask the user to enter a **star rating** from **0 to 3** using a **prompt**.\n\
    - Use **selection** to display their **rating** (0, 1, 2 or 3) as that **number\
    \ of gold stars**, and follow it with a **related message**.\n- Show an appropriate\
    \ **alert** if they enter an **invalid rating**.\n\nThe **downloadable files**\
    \ for this section contain images for a **gold star** and a **transparent star**\
    \ that you can use."
  mdcn: "\n## 更改 HTML 属性\n\n与使用 JavaScript 更改文本类似，你也可以使用 JavaScript 来更改 HTML 属性的值——例如图像的\
    \ src 属性。\n\n- 能够使用 JavaScript 更改 HTML 元素的属性。\n- 能够使用选择来确定如何更改 HTML 属性。\n\n##\
    \ JavaScript 可以更改属性值\n\n1.  要更改属性值，请为要更改的元素设置一个 ID，然后使用 `document.getElementById()`\
    \ 来访问它——就像你在第 58 页更改文本时所做的那样。\n2.  然后，你可以为你想要更改的任何属性分配一个新值。\n\n```html\n<img id=\"\
    image\" src=\"images/question-mark.png\" width=\"200\" alt=\"A green question\
    \ mark\">\n\n<script>\nlet feeling = prompt(\"Feeling good? 'yes' or 'no'?\");\n\
    let image = document.getElementById(\"image\");\n\nif (feeling.toLowerCase() ==\
    \ \"yes\") {\n  image.src = \"images/thumbs-up.png\";\n  image.alt = \"A green\
    \ thumbs-up\";\n}\n\nelse if (feeling.toLowerCase() == \"no\") {\n  image.src\
    \ = \"images/thumbs-down.png\";\n  image.alt = \"A red thumbs-down\";\n}\n</script>\n\
    ```\n\n根据用户对提示的响应，更改 `<img>` 元素的属性。\n\n系统会提示用户输入他们的感受。最初，`src` 是一个问号的图像。只有在满足以下条件之一时，这才会改变。使用\
    \ ID 来访问 `<img>`。如果用户输入 \"yes\"，`src` 将更改为竖起大拇指的图标……如果他们输入 \"no\"，`src` 将更改为向下的大拇指图标。为了可访问性，`alt`\
    \ 属性也会随时更新。\n\n请记住，在 `src` 中使用指向图像的相对文件路径——第 30 页有提醒。这是用户回答 \"yes\" 时看到的……如果他们回答\
    \ \"no\"……如果他们回答其他任何内容。\n\nQ1 扩展此代码，以便在用户输入 \"ok\" 时显示一个水平的拇指。确保更新提示以显示此选项。\n\n\
    在上面的示例中，`<script>` 标签需要放在 `<img>` 标签之后，否则在你的脚本尝试访问它时，`<img>` 可能尚未加载。始终将你的 `<script>`\
    \ 标签放在 `</body>` 标签之前是避免此问题的一种简便方法。\n\n### 看起来今天 thumb-one 情绪不错……\n\n你可以使用此 JavaScript\
    \ 更改 HTML 元素的任何属性。例如，你可以更改 `width` 或 `height` 属性，甚至更改 `onclick` 将调用的函数。\n\n##\
    \ 更改 CSS 属性\n\n学习目标：现在进入样式部分，没错，你猜对了，你也可以使用 JavaScript 来更改 CSS 属性的值——“这东西有什么不能做的？”我听到你喊道……\n\
    - 理解如何使用 JavaScript 更改网页的样式。\n- 能够使用 `.style` 更改元素的 CSS 属性。\n\n## JavaScript 可以更改\
    \ CSS 属性值\n\n1.  更改样式的工作方式类似于更改文本和 HTML 属性。\n2.  首先，为你想要更改样式的元素设置一个 ID，并使用 `document.getElementById()`\
    \ 来访问它。\n3.  然后，如下所示使用 `.style` 更改属性。\n\n常见问题：JavaScript 使用小驼峰命名法的 CSS 属性（参见第\
    \ 54 页），因此你需要写例如 `fontFamily` 而不是 CSS 中的 `font-family`。\n\n示例：通过按下按钮更改字体颜色和背景颜色。\n\
    \n```html\n<div id=\"content\">\n  <h1>Something here?</h1>\n  <img src=\"images/ftephen.png\"\
    \ width=\"200\">\n  <p style=\"color: White;\">Ftephen says hi.</p>\n</div>\n\
    <button type=\"button\" onclick=\"changeColor()\">Reveal</button>\n<script>\n\
    \  function changeColor() {\n    let content = document.getElementById(\"content\"\
    );\n    content.style.backgroundColor = \"Black\";\n    content.style.color =\
    \ \"White\";\n  }\n</script>\n```\n\n与之前的示例不同，此 ID 应用于一个包含三个标签的 `<div>`。更改了两个\
    \ CSS 样式属性：`background-color` 和 `color`（它会更改文本的颜色）。`background-color` 已被转换为小驼峰命名法以便\
    \ JavaScript 理解。当按钮被点击时，整个 `<div>` 的背景颜色变为黑色，显示出图片和消息……字体颜色变为白色，以便标题在黑色背景上可读。\n\
    \n最初，图像是白色的，背景透明，`<p>` 标签被设置为白色，因此在白色背景上看不到它们。`<body>` 背景颜色通常一开始就是白色，但你也可能需要设置它。\n\
    \nQ1 这些 CSS 属性在 JavaScript 中应如何编写？\na) `margin-right`\nb) `height`\nc) `text-align`\n\
    \nQ2 扩展上面的示例，使得当按钮被点击时，字体族（font family）发生变化，并在左侧添加更多内边距（padding）。\n\n紧身牛仔裤又流行起来了吗？我跟不上变化了……此时你只看到了\
    \ JavaScript 的一小部分，但通过将它与你在前面章节学到的所有 HTML 和 CSS 结合起来，你已经可以开始制作一些非常漂亮的页面了。\n\n\
    ## 练习题\n\n### 热身\n\nQ1 什么是函数？\n\nQ2 对还是错？JavaScript 中函数名区分大小写。\n\nQ3 编程中的选择（selection）是什么意思？\n\
    \n### 练习题\n\nQ1 a) 命名此代码中定义的函数，并圈出调用它的地方。\n\nb) 描述函数运行后页面如何变化。\n\n```html\n<p>My\
    \ favourite sport is trolley racing.</p>\n<button type=\"button\" onclick=\"getFavSport()\"\
    >What's yours?</button>\n<p id=\"reply\"></p>\n<script>\n  function getFavSport()\
    \ {\n    let sport = prompt(\"Favourite sport\");\n    let message = \"You like\
    \ \" + sport + \".\";\n    let reply = document.getElementById(\"reply\");\n \
    \   reply.innerHTML = message;\n  }\n</script>\n```\n\nQ2 下面的网页旨在根据用户在点击按钮后出现的提示中输入\
    \ “dogs” 或 “cats” 来显示不同的消息和图片。完成 JavaScript，使得输入 “dogs” 和 “cats” 会产生下面所示的两个输出。\n\
    \n```html\n<p id=\"reaction\"></p>\n<img id=\"pet-pic\" src=\"dog-vs-cat.jpg\"\
    \ height=\"200\"> <br>\n<button type=\"button\" onclick=\"petChoice()\">Which\
    \ is better?</button>\n<script>\n  function petChoice() {\n    let choice = prompt(\"\
    'dogs' or 'cats'?\");\n    let reaction = document.getElementById(\"reaction\"\
    );\n    let petPic = document.getElementById(\"pet-pic\");\n    if (choice ==\
    \ \"dogs\") {\n      reaction.innerHTML = \"You know it.\";\n      petPic.src\
    \ = \"dog.jpg\";\n    }\n    else if (choice == \"cats\") {\n      reaction.innerHTML\
    \ = \"Ah, someone of culture.\";\n      petPic.src = \"cat.jpg\";\n    }\n  }\n\
    </script>\n```\n\nQ3 此 JavaScript 旨在更改一个 CSS 属性。圈出四个错误，然后写出正确的代码。\n\n```javascript\n\
    let navBar = getElementByID(\"nav-bar\");\nnavBar.background-color = \"Purple\"\
    ;\n```\n\n用于编写正确代码的空白框。\n\n第七节 — JavaScript 基础。\n\n用于自我评估的笑脸图标：难过、中立、开心。\n\n##\
    \ 第七节的编码挑战\n\n希望你的页面现在变得很棒——只是不要用 1000 条警报骚扰用户，否则他们会认为自己中了病毒。试试这些挑战，然后前往 cgpbooks.co.uk/biscuit\
    \ 获取示例代码。\n\n### 挑战 1 — 示例\n\n创建一个使用 **警报（alerts）** 和 **提示（prompts）** 来帮助用户创作“敲门敲门”笑话的网页。\n\
    \n- 从一个包含 **消息** “Knock knock...” 的 **警报** 开始。\n- 然后是一个包含 **问题** “Who's there?”\
    \ 的 **提示**，以获得一个 **回应**。\n- 然后是一个包含后续问句 **“___ who?”** 的 **提示**，以获得 **包袱**。\n\
    - 用户随后应该在网页上看到 **整个笑话被完整呈现**。\n\n> 用用户的回应填空。\n\n> 参见第 45 页的一个笑话示例，以及你可能如何为它添加样式。\n\
    \n**计划：** 在 HTML 中为笑话创建一个模板，然后使用脚本根据提示的答案来填充它。\n\n```html\n<p>Knock knock...</p>\n\
    <p>Who's there?</p>\n<p id=\"response\"></p>\n<p id=\"comeback\"></p>\n<p id=\"\
    punchline\"></p>\n```\n\n```javascript\nalert(\"Knock knock...\");\nlet responseText\
    \ = prompt(\"Who's there?\");\nlet comebackText = responseText + \" who?\";\n\
    let punchlineText = prompt(comebackText);\n\nlet response = document.getElementById(\"\
    response\");\nlet comeback = document.getElementById(\"comeback\");\nlet punchline\
    \ = document.getElementById(\"punchline\");\n\nresponse.innerHTML = responseText;\n\
    comeback.innerHTML = comebackText;\npunchline.innerHTML = punchlineText;\n```\n\
    \n> 1. HTML 很简单。笑话的前两行可以从一开始就填充。其他行留空，但赋予 ID 以便脚本可以更改它们。你也可以添加 class 属性来设置页面样式（此处未显示）。\n\
    \n> 2. 使用 `prompt()` 询问用户输入他们笑话的部分——将每个输入存储在一个变量中。\n\n> 3. `.getElementById()`\
    \ 用于使用它们的 ID 访问每个元素。\n\n> 4. 最后，`.innerHTML` 用于在页面上填充文本。\n\n### 挑战 2\n\n创建一个可以\
    \ **以两种不同方式进行样式设置** 的网页——**亮色模式** 和 **暗色模式**，如右侧示例所示。\n\n应该有一个 **按钮** 用于每种模式，每次\
    \ **点击** 时都能将你的页面 **更改为** 相应的样式。\n\n你可以 **创建你自己的** 页面，或使用 **本节可下载文件** 中提供的 **示例页面**。\n\
    \n### 挑战 3\n\n一家名为 **Java's Crypt** 的咖啡馆请你为他们的 **顾客** 制作一个网页，让他们可以 **评价他们的体验**。\n\
    \n> 别忘了使用 CSS 让你的页面看起来美观。\n\n该页面应该：\n\n- 要求用户使用 **提示** 输入一个 **从 0 到 3 的星级评分**。\n\
    - 使用 **选择** 将他们的 **评分**（0、1、2 或 3）显示为相应 **数量的金星**，并在其后跟上一条 **相关消息**。\n- 如果他们输入了\
    \ **无效的评分**，则显示适当的 **警报**。\n\n本节的 **可下载文件** 包含 **金星** 和 **透明星** 的图像，你可以使用它们。\n"
