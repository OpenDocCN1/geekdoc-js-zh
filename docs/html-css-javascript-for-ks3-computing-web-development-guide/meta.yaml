  md: "# Bold, Italic and Underline\n\n**Learning Objectives**\n\nSo you've got your\
    \ text, you've set your heading and paragraph tags, but it all still looks a bit\
    \ boring. **What's next?** Enter stage left, text formatting tags...\n\n* Be able\
    \ to use `<b>`, `<i>`, and `<u>` to mark up **bold**, *italic* and <u>underline</u>\
    \ in text.\n* Understand the importance of <u>closing tags</u>.\n\n# You can add\
    \ **bold**, *italic* and <u>underline</u> to your text\n\n1) To make text **bolder**,\
    \ use a `<b>` tag.\n2) To make text *italic*, use a `<i>` tag.\n3) To give text\
    \ an <u>underline</u>, use a `<u>` tag.\n4) They each have a <u>closing tag</u>:\
    \ `</b>`, `</i>` and `</u>`.\n\n> Q1 How will these look?\na) `<b><u>Hands off</u></b>`\n\
    b) `<b><u>my</u> <i>lunch</i></b>`!\n\n**EXAMPLE** The code below formats the\
    \ text with bold, italics and underline.\n\nYou can format text <u>inside other\
    \ elements</u> like headings.\n\n```\n<body>\n    <h1>Look at <u>this</u>!</h1>\n\
    \    <p>I can't <b>tell you</b>\n    enough how <u><i>super</i></u> this is.</p>\n\
    </body>\n```\n\n**Look at this!**\n\nI can't **tell you** enough how *super* this\
    \ is.\n\nYou can also <u>combine formatting</u> by putting <u>two tags</u>, one\
    \ after another.\n\nOnly the text <u>inside</u> the <u>relevant tags</u> will\
    \ be <u>formatted</u> with bold, italics or underline.\n\n> You can use the `<strong>`\
    \ or `<em>` tags in place of `<b>` or `<i>` to mark up \"important\" or \"emphasised\"\
    \ text that's meant to be read in a different tone of voice. They're good for\
    \ accessibility as screen readers (see p.18) will take special note of them, unlike\
    \ `<b>` and `<i>`.\n\n![GOING FURTHER](https://via.placeholder.com/100x100?text=GOING+FURTHER)\n\
    \n# Don't forget the <u>closing tag</u>\n\nWeb browsers are usually quite <u>nice\
    \ to web developers</u> — they'll do their best to <u>display your page</u>, but\
    \ if you make mistakes, they might not <u>display</u> things the way you <u>wanted</u>.\n\
    \n![COMMON PROBLEMS](https://via.placeholder.com/100x100?text=COMMON+PROBLEMS)\
    \ A common mistake is forgetting a closing tag.\n\n```\n<p>I only wanted to underline\
    \ the word <u>'tremendous'</p>\n<p>and bold the word <b>'marvellous'.</p>\n<p>But\
    \ look what's happened...</p>\n<p>Now it's ruined.</p>\n```\n\nI only wanted to\
    \ underline the word 'tremendous'\nand bold the word **'marvellous'**.\n**But\
    \ look what's happened...**\n**Now it's ruined.**\n\nThere should have been a\
    \ `</u>` here to tell the browser to <u>stop</u> the <u>underlining</u>...\n\n\
    ...and a `</b>` here to tell the browser to <u>stop</u> the <u>bolding</u> — instead\
    \ it just carries on.\n\n![Cartoon of frustrated person at computer](https://via.placeholder.com/100x100?text=Cartoon)\
    \ bold, error, italic, error, underline, error\n\n**My teacher once called my\
    \ name in bold, italics and underline...**\nThese formatting tags are a <u>great</u>\
    \ way to add a bit of *flair* to your web pages, as long as you don't <u>forget</u>\
    \ the closing tags. Keep practising with them, and it'll become second nature.\
    \ <u>See?</u>"
  merge: -1
