    \ **超链接** | 用户可以单击以从一个网页或在线资源跳转到另一个的内容——可以是内部或外部链接。 |\n| **ID** (`id`) | 引用一个唯一元素的名称，或者用于将该名称分配给元素的属性。\
    \ |\n| **输入字段** | 一个允许用户通过与网页交互来获取用户输入的元素。 |\n| **互联网** | 一个全球性的网络互联网络。 |\n| **JavaScript**\
