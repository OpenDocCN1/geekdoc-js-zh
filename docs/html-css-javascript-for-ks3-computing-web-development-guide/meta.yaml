    # Section Seven — JavaScript Basics


    # Getting Started


    **Learning Objectives**


    You might have done some programming in languages like Python before. JavaScript
    is another language, and it''s perfect for doing funky stuff with web pages.


    - Understand what JavaScript is and what it''s used for.

    - Learn the difference between static and dynamic web pages.

    - Be able to use the <script> tag to mark up JavaScript.

    - Be able to use JavaScript to output a message to the console.


    # JavaScript is a programming language


    +   1. A programming language lets you control a computer by giving it instructions
    to follow.

    2. As HTML and CSS only describe the structure and style of a web page, they aren''t
    programming languages.

    3. JavaScript is — it can be used to make all sorts of programs, including desktop
    apps and games.

    4. Since most web browsers can run JavaScript, it''s commonly used on the Web
    — almost all websites use it in some way.


    > You may have heard of Java™ — despite the similar name, Java™ and JavaScript
    are different programming languages.


    # JavaScript creates dynamic web pages


    +   - The web pages you''ve made so far have been mostly static.

    - Lots of real web pages are dynamic and respond to the user''s actions.

    - Using JavaScript in combination with HTML and CSS, you can add interactivity
    to create dynamic web pages of your own.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_55_0.png)


    # JavaScript runs in a web browser


    To develop with JavaScript, it''s best to use a browser that has a console — e.g.
    Microsoft Edge (Windows), the Safari web browser (macOS), or the Google Chrome
    web browser (Windows, macOS and Linux).


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    console.log("Hello, world!");

    </script>

    </body>

    </html>

    ```


    JavaScript can be written within HTML using <script> tags.

    All this HTML should be familiar, except for this one line of JavaScript inside
    the <script> tags.

    Anything within the quotes is output to the console.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_55_1.png)


    When you open this page in a browser, you''ll just see a blank page because the
    output of console.log() is shown in the ''console''.

    To see it, you need to open the console. In Chrome, right click and select ''Inspect''.

    Then click ''Console'' on this menu (you may need to click ''>>'' to see this
    option).


    **I clicked on a static web page once — it was shocking...**

    If you already know other programming languages, be careful you don''t get the
    syntax mixed up with JavaScript — keep an eye on where you''re putting your brackets,
    quotes, semicolons, etc.'
- md: "## Alerts and Buttons\n\nThis page contains information about using buttons\
    \ and displaying messages — it will self-destruct in 10....9....8.... Oh wait,\
    \ we're not doing timers until p.74.\n\n- Be able to use `alert()` to display\
    \ a message to the user.\n- Be able to use the `<button>` tag to mark up buttons.\n\
    - Be able to make buttons that display alerts when clicked.\n\n## alert() pops\
    \ up a message\n\n1) A big downside of `console.log()` is that the user likely\
    \ won't be looking at the console, so won't see the outputted message.\n2) The\
    \ `alert()` command is an easy way to display a message directly to the user.\n\
    \n## Buttons can control when alerts happen\n\n- The `<button>` tag marks up a\
    \ clickable button:\n\nSet the `type` attribute to `button` to ensure you get\
    \ a basic button. It won't do anything when clicked until you add a JavaScript\
    \ command.\n\nYou can apply CSS styles to buttons and the text on them — e.g.\
    \ `background-color`, `font-family`, etc. You can even use `<img>` to put an image\
    \ on a button.\n\n- To make a button do something, you can set its `onclick` attribute.\n\
    \n**EXAMPLE** `onclick` means 'do this thing when the user clicks the button'.\n\
    \n```html\n<button type=\"button\" onclick=\"alert('Ouch, not so hard')\">Click\
    \ me!</button>\n```\n\nThe `onclick` attribute of `<button>` contains JavaScript\
    \ code — no `<script>` tags needed. When the button is clicked, the `onclick`\
    \ code is run and the alert pops up.\n\n**COMMON PROBLEMS** When you've got quotes\
    \ inside other quotes, they can't be the same type. The `onclick` attribute is\
    \ using double quotes around the JavaScript code, so you can't also use double\
    \ quotes around the `alert()` message.\n\nTo solve this problem, you could use\
    \ single quotes in the `alert()` like the example above.\n\n```html\n<button type=\"\
    button\" onclick=\"alert(\"Eh??\")\">Click me!</button>\n```\n\nThe console shows\
    \ an error message when you get code wrong, with the line number in the `.html`\
    \ file that the error is on.\n\n## `<button onclick=\"runAI()\">Make Perfect Web\
    \ Page</button>`\n\nAlerts are a quick and simple way to show a message — useful\
    \ while you're getting started. They can be annoying though, so use them sparingly.\
    \ You'll see a friendlier way of outputting on p.58.\n\n## Variables and the +\
    \ Operator\n\n## Learning Objectives\n\nDid you get everything from the last two\
    \ pages? I hope I'm not just stringing you along. Speaking of strings, here's\
    \ a page all about using variables with strings and numbers.\n\n- Be able to use\
    \ variables to store values.\n- Be able to use the `+` operator to join strings\
    \ and add numbers.\n\n## Variables store values for later use\n\nLike most programming\
    \ languages, JavaScript has variables to store values.\n\n```javascript\nlet favouriteColour\
    \ = \"Green\";\nconsole.log(favouriteColour);\nfavouriteColour = \"Blue\";\nconsole.log(favouriteColour);\n\
    // Output:\nGreen\nBlue\n```\n\n**KEY TERMS** Lower camel case is a way of naming\
    \ variables in which the first letters of the second word onwards are capitalised\
    \ — e.g. `lowerCamelCase`.\n\nVariable names in JavaScript can't contain spaces.\
    \ They can contain numbers, but not as the first letter.\n\n## The + operator\
    \ joins strings together\n\nYou may have already noticed that when strings are\
    \ used in JavaScript they need to be written in quotes — you can use either single\
    \ or double quotes.\n\n```javascript\nlet favouriteColour = \"SlateGrey\";\nlet\
    \ message = \"Your favourite colour is \" + favouriteColour;\nconsole.log(message);\n\
    // Output:\nYour favourite colour is SlateGrey\n```\n\n**KEY TERMS** Strings are\
    \ just pieces of text — they can contain letters, numbers and symbols.\n\n**Q1**\
    \ Write code to set two variables, `name` and `prize`, and alert the user with\
    \ the message: “Congrats name, you’ve won a brand new prize.” (using the variable\
    \ values).\n\n## + also adds numbers\n\n- Numbers in JavaScript are written without\
    \ quotes.\n- When you use `+` on two numbers, it does addition.\n\n```javascript\n\
    let sum = 2 + 8;\nconsole.log(\"2 + 8 = \" + sum);\n// Output:\n2 + 8 = 10\n```\n\
    \n**COMMON PROBLEMS** Using a mix of strings and numbers with `+` operators may\
    \ give unexpected results.\n\n```javascript\nconsole.log(\"2 + 8 = \" + 2 + 8);\n\
    // Output:\n2 + 8 = 28\n```\n\n- When you use `+` with a string and a number,\
    \ the number will be converted to a string and then joined to the other string.\n\
    \nTo avoid this problem, either store the result of the calculation in a variable\
    \ (like in the example on the left), or put the calculation inside another pair\
    \ of brackets: `console.log(\"2 + 8 = \" + (2 + 8));`\n\n**Variables hold values\
    \ — unlike those football stickers I bought...** JavaScript has certain 'reserved\
    \ words' that can't be used as variable names. The word `let` is one example of\
    \ these, and you'll see a few more later in this book, such as `function`, `if`\
    \ and `else`.\n\n## Prompts\n\n**Learning Objectives** I'm sure you're used to\
    \ prompts — have you cleaned your room? Eaten your veg? Done your homework? Learnt\
    \ how web pages can prompt a user to do something?\n\n- Be able to use `prompt()`\
    \ to **get input** from the user.\n- Learn what happens when a `prompt()` is **cancelled**.\n\
    \n## prompt() can get user input\n\n1) The `prompt()` **command** displays a **message**\
    \ to the user **like** `alert()`, but it also allows the user to **type a message\
    \ in return**.\n\n```html\n<script>\nprompt(\"Hello! What's your name?\");\n</script>\n\
    ```\n\n`prompt()` displays the message and gives the user a **box** in which to\
    \ **type their response**.\n\n2) You can **use a variable** to **store** the **user's\
    \ response** from a `prompt()`.\n\n**EXAMPLE** Include a question or instruction\
    \ in a prompt, so the user knows what you're after.\n\nThe **user's response**\
    \ to the `prompt()` is **stored** in the **variable** `name`.\n\n```html\n<script>\n\
    let name = prompt(\"Hello! What's your name?\");\nlet message = \"Welcome, \"\
    \ + name + \"!\";\nalert(message);\n</script>\n```\n\nThe **user sees** the `prompt()`\
    \ **first** — the script is **paused** until the user **clicks 'OK'**.\n\nThe\
    \ `alert()` then **appears after** the user has **clicked 'OK'** on the `prompt()`.\n\
    \n**Q1** Modify your script from Q1 on p.54 so that it asks the user for their\
    \ name using a `prompt()`.\n\n## Prompts can be cancelled\n\nIf you **click**\
    \ the 'Cancel' button in the `prompt()` of the example above, you'll see the following\
    \ `alert()`.\n\n'null' in JavaScript means **no value** — because the `prompt()`\
    \ was **cancelled**, the **variable** `name` was set to `null`.\n\n**GOING FURTHER**\
    \ You can check whether a `prompt()` was cancelled by using an `if` statement\
    \ (see p.59) to test if it returned `null`. This is **different** to the user\
    \ typing nothing and clicking OK — that returns an **empty string** \"\".\n\n\
    ### To cancel the prompt function, unfollow it on social media...\n\nPrompts are\
    \ a simple way of getting input from the user, but they can't be styled — the\
    \ user's web browser controls what prompts look like. You'll see how to create\
    \ fancier input fields in Section 8.\n\n## Practice Questions\n\n### Warm-Up\n\
    \n**Q1** Which HTML tag is used to mark up JavaScript on a web page?\n\n**Q2**\
    \ Identify the error in the following code.\n\n```html\n<button type=\"button\"\
    \ click=\"alert('Whoa!')\">\nWell don't just sit there. Click me!</button>\n```\n\
    \n**Q3** If you have an error in JavaScript code on a web page, where can the\
    \ error message be seen?\n\n**Q4** In what situation does `prompt()` give the\
    \ value `null`?\n\n### Practice Questions\n\n**Q1** Explain the difference between\
    \ static and dynamic web pages.\n\n**Q2** Write the console output for the following\
    \ bits of code.\n\n```javascript\na) let word1 = \"wolf\";\n   let word2 = \"\
    what\";\n   let word3 = \"were\";\n   console.log(word3 + word1);\n```\n\n```javascript\n\
    b) let value = 10;\n   let result = value + 5;\n   value = 20;\n   console.log(result);\n\
    ```\n\n**Q3** Sketch the web page created by the code below.\n\n```html\na) <button\
    \ type=\"button\">Click me...</button>\n   <p>Do it!</p>\n```\n\nb) What happens\
    \ when the button is clicked on this web page?\n\n**Q4** Describe the two errors\
    \ in the code below.\n\n```javascript\n<script>\n    set name = prompt(\"What's\
    \ your name?\");\n    alert(\"Hello \", name);\n</script>\n```\n\n1. ....................................................................................................................\n\
    2. ...................................................................................................................."
  mdcn: "\n## 警报和按钮\n\n本页包含关于使用按钮和显示消息的信息——它将在10....9....8....秒后自我销毁....哦等等，我们在第74页之前还不做计时器。\n\
    \n- 能够使用 `alert()` 向用户显示消息。\n- 能够使用 `<button>` 标签来标记按钮。\n- 能够制作点击时显示警报的按钮。\n\n\
    ## `alert()` 弹出消息\n\n1) `console.log()` 的一个主要缺点是用户很可能不会看控制台，因此看不到输出的消息。\n2) `alert()`\
    \ 命令是一种直接向用户显示消息的简单方法。\n\n## 按钮可以控制警报何时发生\n\n- `<button>` 标记一个可点击的按钮：\n\n将 `type`\
    \ 属性设置为 `button` 以确保你得到一个基本按钮。在你添加 JavaScript 命令之前，点击它不会执行任何操作。\n\n你可以对按钮及其上的文本应用\
    \ CSS 样式——例如 `background-color`、`font-family` 等。你甚至可以使用 `<img>` 将图像放在按钮上。\n\n\
    - 要使按钮执行某些操作，可以设置其 `onclick` 属性。\n\n**示例** `onclick` 的意思是'当用户点击按钮时执行此操作'。\n\n\
    ```html\n<button type=\"button\" onclick=\"alert('Ouch, not so hard')\">Click\
    \ me!</button>\n```\n\n`<button>` 的 `onclick` 属性包含 JavaScript 代码——不需要 `<script>`\
    \ 标签。当按钮被点击时，`onclick` 代码运行并弹出警报。\n\n**常见问题** 当引号内嵌套引号时，它们不能是相同类型。`onclick` 属性在\
    \ JavaScript 代码周围使用了双引号，因此你不能在 `alert()` 消息周围也使用双引号。\n\n要解决这个问题，你可以在 `alert()`\
    \ 中使用单引号，如上例所示。\n\n```html\n<button type=\"button\" onclick=\"alert(\"Eh??\")\"\
    >Click me!</button>\n```\n\n当你代码出错时，控制台会显示一条错误消息，其中包含错误所在的 `.html` 文件行号。\n\n##\
    \ `<button onclick=\"runAI()\">Make Perfect Web Page</button>`\n\n警报是显示消息的一种快速而简单的方法——在你刚开始时很有用。不过它们可能会很烦人，所以要谨慎使用。你将在第58页看到一种更友好的输出方式。\n\
    \n## 变量和 + 运算符\n\n## 学习目标\n\n你从上两页学到所有东西了吗？我希望我不是在哄你。说到字符串，这一页全是关于在字符串和数字中使用变量的内容。\n\
    \n- 能够使用变量来存储值。\n- 能够使用 `+` 运算符连接字符串和相加数字。\n\n## 变量存储值以供后续使用\n\n与大多数编程语言一样，JavaScript\
    \ 有变量来存储值。\n\n```javascript\nlet favouriteColour = \"Green\";\nconsole.log(favouriteColour);\n\
    favouriteColour = \"Blue\";\nconsole.log(favouriteColour);\n// 输出:\nGreen\nBlue\n\
    ```\n\n**关键术语** 小驼峰命名法是一种变量命名方式，其中第二个单词及以后的首字母大写——例如 `lowerCamelCase`。\n\nJavaScript\
    \ 中的变量名不能包含空格。它们可以包含数字，但不能作为第一个字符。\n\n## + 运算符将字符串连接在一起\n\n你可能已经注意到，在 JavaScript\
    \ 中使用字符串时需要用引号括起来——你可以使用单引号或双引号。\n\n```javascript\nlet favouriteColour = \"SlateGrey\"\
    ;\nlet message = \"Your favourite colour is \" + favouriteColour;\nconsole.log(message);\n\
    // 输出:\nYour favourite colour is SlateGrey\n```\n\n**关键术语** 字符串只是文本片段——它们可以包含字母、数字和符号。\n\
    \n**问题1** 编写代码来设置两个变量 `name` 和 `prize`，并用消息向用户发出警报：“恭喜你 name，你赢得了一个全新的 prize。”（使用变量值）。\n\
    \n## + 也用于数字相加\n\n- JavaScript 中的数字编写时不加引号。\n- 当你对两个数字使用 `+` 时，它进行加法运算。\n\n```javascript\n\
    let sum = 2 + 8;\nconsole.log(\"2 + 8 = \" + sum);\n// 输出:\n2 + 8 = 10\n```\n\n\
    **常见问题** 在 `+` 运算符中混合使用字符串和数字可能会产生意外结果。\n\n```javascript\nconsole.log(\"2 + 8\
    \ = \" + 2 + 8);\n// 输出:\n2 + 8 = 28\n```\n\n- 当你对一个字符串和一个数字使用 `+` 时，数字将被转换为字符串，然后连接到另一个字符串。\n\
    \n要避免此问题，可以将计算结果存储在变量中（如左侧示例所示），或者将计算放在另一组括号中：`console.log(\"2 + 8 = \" + (2 +\
    \ 8));`\n\n**变量保存值——不像我买的那个足球贴纸...** JavaScript 有某些“保留字”不能用作变量名。`let` 这个词就是一个例子，你在本书后面还会看到更多，比如\
    \ `function`、`if` 和 `else`。\n\n## 提示\n\n**学习目标** 我相信你已经习惯了提示——你打扫房间了吗？吃蔬菜了吗？做完作业了吗？学会了网页如何提示用户做某事吗？\n\
    \n- 能够使用 `prompt()` 从用户那里**获取输入**。\n- 了解当 `prompt()` 被**取消**时会发生什么。\n\n## `prompt()`\
    \ 可以获取用户输入\n\n1) `prompt()` **命令**向用户显示一条**消息**，**类似于** `alert()`，但它也允许用户**输入一条消息作为回复**。\n\
    \n```html\n<script>\nprompt(\"Hello! What's your name?\");\n</script>\n```\n\n\
    `prompt()` 显示消息，并给用户一个**框**来**输入他们的回复**。\n\n2) 你可以**使用变量**来**存储**从 `prompt()`\
    \ 获得的**用户回复**。\n\n**示例** 在提示中包含一个问题或说明，这样用户就知道你要什么。\n\n`prompt()` 的**用户回复**被**存储**在**变量**\
    \ `name` 中。\n\n```html\n<script>\nlet name = prompt(\"Hello! What's your name?\"\
    );\nlet message = \"Welcome, \" + name + \"!\";\nalert(message);\n</script>\n\
    ```\n\n**用户首先看到** `prompt()`——脚本**暂停**，直到用户**点击“确定”**。\n\n然后，在用户点击了 `prompt()`\
    \ 上的“确定”之后，`alert()` **出现**。\n\n**问题1** 修改你在第54页问题1中的脚本，使其使用 `prompt()` 询问用户的名字。\n\
    \n## 提示可以被取消\n\n如果你在上例的 `prompt()` 中**点击**“取消”按钮，你会看到以下 `alert()`。\n\nJavaScript\
    \ 中的 'null' 表示**没有值**——因为 `prompt()` 被**取消**，所以**变量** `name` 被设置为 `null`。\n\n\
    **深入探索** 你可以使用 `if` 语句（见第59页）来检查 `prompt()` 是否被取消，测试它是否返回 `null`。这**不同于**用户什么也没输入并点击确定——那返回的是一个**空字符串**\
    \ \"\"。\n\n### 要取消提示功能，请在社交媒体上取消关注它...\n\n提示是从用户获取输入的一种简单方法，但它们不能被样式化——用户的网页浏览器控制着提示的外观。你将在第8章看到如何创建更花哨的输入字段。\n\
    \n## 练习题\n\n### 热身\n\n**问题1** 在网页上标记 JavaScript 使用的是哪个 HTML 标签？\n\n**问题2** 找出以下代码中的错误。\n\
    \n```html\n<button type=\"button\" click=\"alert('Whoa!')\">\nWell don't just\
    \ sit there. Click me!</button>\n```\n\n**问题3** 如果网页上的 JavaScript 代码有错误，可以在哪里看到错误消息？\n\
    \n**问题4** 在什么情况下 `prompt()` 会给出值 `null`？\n\n### 练习题\n\n**问题1** 解释静态网页和动态网页之间的区别。\n\
    \n**问题2** 写出以下代码段的控制台输出。\n\n```javascript\na) let word1 = \"wolf\";\n   let word2\
    \ = \"what\";\n   let word3 = \"were\";\n   console.log(word3 + word1);\n```\n\
    \n```javascript\nb) let value = 10;\n   let result = value + 5;\n   value = 20;\n\
    \   console.log(result);\n```\n\n**问题3** 勾画出以下代码创建的网页。\n\n```html\na) <button\
    \ type=\"button\">Click me...</button>\n   <p>Do it!</p>\n```\n\nb) 当这个网页上的按钮被点击时会发生什么？\n\
    \n**问题4** 描述以下代码中的两个错误。\n\n```javascript\n<script>\n    set name = prompt(\"What's\
    \ your name?\");\n    alert(\"Hello \", name);\n</script>\n```\n\n1. ....................................................................................................................\n\
    2. ....................................................................................................................\n"
