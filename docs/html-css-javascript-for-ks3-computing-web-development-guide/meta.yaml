- md: "## Functions\n\n+   Ah, functions... No, I don't mean fancy social events.\
    \ I'm talking JavaScript functions. You've used a few already, e.g. alert() and\
    \ prompt(), but here's how to make your own.\n\n- Understand what a function is\
    \ and how to define one yourself.\n- Understand how to call a function and what\
    \ this does.\n\n## You can create your own functions\n\nFunctions that you want\
    \ to create need to be defined somewhere in your code — this means they're given\
    \ a name and some code that performs their task.\n\nA function is a named block\
    \ of code that does a particular task.\n\n```\nA function definition starts with\
    \ the word function.\nfunction sayHello() {\n    console.log(\"Hello\");\n}\n\
    You need to give the function a name, followed by round brackets, ().\nThe code\
    \ inside the curly braces {} is what the function does. Here, it just outputs\
    \ \"Hello\" into the console.\n```\n\n## Functions are used by being called\n\n\
    +   1) If you looked at the console for the example above, you'd see nothing —\
    \ this is because the function has only been defined.\n2) To run it, you need\
    \ to 'call' it.\n3) You can call a function as many times as you want, without\
    \ having to repeat its original code.\n\nCalling a function is when you write\
    \ its name to run its code.\n\n```\nContinuing the example above to call the function.\n\
    sayHello();\nconsole.log(\"Again?\");\nsayHello();\n\nHello\nAgain?\nHello\nThe\
    \ console shows the output from the function.\n```\n\n## You can use buttons to\
    \ call your functions\n\n```\nJust like alert() and prompt(), you can call your\
    \ own functions with <button>s.\n\n<p>Have you seen updog?</p>\n<button onclick=\"\
    updog()\">What's updog?</button>\n<script>\n    function updog() {\n        alert(\"\
    Not much, what's up with you?\");\n    }\n</script>\n\nHave you seen updog?\n\
    What's updog?\nThis page says\nNot much, what's up with you?\n[OK]\n```\n\nFor\
    \ the web pages in this book, we've placed the <script> tags last in the code,\
    \ just before the final </body> tag — it doesn't matter in this example, but it'll\
    \ avoid problems later on.\n\n> The JavaScript police called — they want their\
    \ function back...\n\nFunctions can save you loads of time when developing your\
    \ code — if you had to rewrite what a function did each time you used it, your\
    \ code would go on and on and on and on and on and...\n\n## Changing Text\n\n\
    Learning Objectives\nShowing outputs as alerts is fun, but it's not something\
    \ that real websites use very much. All the cool kids use JavaScript to change\
    \ the content on the page itself.\n- Understand the purpose of document.getElementById()\
    \ and .innerHTML.\n- Be able to change the text within HTML elements using JavaScript.\n\
    \n## JavaScript can change parts of your web page\n\nIf you want to change bits\
    \ of content (like text) on a web page:\n1) Set an ID for the HTML element that\
    \ you want to change (see p.46 for a reminder).\n2) With JavaScript, use document.getElementById()\
    \ to access the element with that ID.\n3) Replace the content of the element using\
    \ .innerHTML.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_0.png)\n\nEXAMPLE\n\
    You can change text on the page based on the result of a prompt.\n\nThis <p> tag\
    \ has been given an ID, so its content can be accessed and changed by the script.\n\
    \nA button is used here to call the function, which will change the content of\
    \ the <p> tag.\n\n```\n<p>What's your favourite colour?</p>\n<button type=\"button\"\
    \ onclick=\"getUsersFavColour()\">\nReply</button>\n<p id=\"fav-colour\">Your\
    \ favourite colour is ???</p>\n<script>\nfunction getUsersFavColour() {\nlet colour\
    \ = prompt(\"Enter your favourite colour.\");\nlet text = \"Your favourite colour\
    \ is \" + colour + \".\";\n\nlet favColour = document.getElementById(\"fav-colour\"\
    );\nfavColour.innerHTML = text;\n}\n</script>\n```\n\nThis is the function that\
    \ will be run by clicking the button.\n\nA prompt gets some user input, which\
    \ is put into a sentence.\n\nThis line gives you access to the element with the\
    \ ID fav-colour, and...\n...this line replaces the content of that element with\
    \ the sentence formed from the prompt.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_1.png)\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_2.png)\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_3.png)\n\
    \nThis is the paragraph that will change based on the user's input.\n\nThis prompt\
    \ appears when the 'Reply' button is clicked.\n\nThe paragraph changes to show\
    \ the user's input.\n\nQ1 Extend this code to include another button that says\
    \ \"Ignore\". When clicked, this should change the second paragraph to give a\
    \ disgruntled response — you can come up with this yourself.\n\nFunctions are\
    \ case sensitive. .getElementByID will bring up an error because \"ID\" should\
    \ be \"Id\".\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_4.png)\n\nRemember,\
    \ JavaScript errors won't appear on the web page itself — check the console for\
    \ errors if your code isn't working properly.\n\n```\nbankStatement.innerHTML\
    \ = \"£1,000,000\";\n```\n\nUsing this JavaScript feature can make your web pages\
    \ way more interactive, and won't rely on the user having to check the console\
    \ or alerts to see what's changed. And there's more to come...\n\nSection Seven\
    \ — JavaScript Basics\n\n## Selection\n\nYou might want content on your web page\
    \ to change differently depending on what the user inputs. If you want to learn\
    \ how to do this, read on. Else, this'll go over your head.\n\n+   - Understand\
    \ the purpose of selection.\n- Be able to use if, else and else if statements.\n\
    \n## Selection is used to make decisions\n\n+   1) In JavaScript, if statements\
    \ are used to perform selection.\n2) They're often followed by an else statement.\n\
    \nSelection in programming is when code is written that will only do something\
    \ based on a condition.\n\nYou can use selection to respond to user input in different\
    \ ways.\n\nMake sure you use the right brackets — () surrounds the condition,\
    \ {} surrounds the code that will be run if the condition is met.\n\n```\n<p>I\
    \ like pizza.</p>\n<button type=\"button\" onclick=\"getFavTopping()\">Me too</button>\n\
    <p id=\"reaction\"></p>\n<script>\nfunction getFavTopping() {\n  let topping =\
    \ prompt(\"What's your favourite topping?\");\n  let reaction = document.getElementById(\"\
    reaction\");\n  if (topping.toLowerCase() == \"pepperoni\") {\n    reaction.innerHTML\
    \ = \"That's my favourite too!\";\n  }\n  else {\n    reaction.innerHTML = \"\
    Mmm, good choice.\";\n  }\n}\n</script>\n```\n\n== checks if two values are equal\
    \ — see p.64 for more about operators like this.\n\nThe <p> tag is left empty\
    \ for the script to fill in.\n\nThis function will run when the button is clicked.\n\
    \nPut the condition (what you're checking for) in the brackets after if — in this\
    \ case, you're checking if the user's favourite topping is pepperoni.\n\nThis\
    \ takes the value of the variable and makes it all lower case, so the check will\
    \ be true even if the user types e.g. \"Pepperoni\".\n\nThis is the code that\
    \ will run only if the check is true.\n\nAn else statement is optional. It will\
    \ only run when the if condition is false — in this case, when the user answers\
    \ with any topping other than pepperoni.\n\nI like pizza.\nMe too\n\nI like pizza.\n\
    Me too\n\nI like pizza.\nMe too\nThat's my favourite too.\n\nI like pizza.\nMe\
    \ too\nMmm, good choice.\n\nThis will be shown if the user inputs a topping other\
    \ than pepperoni.\n\nThis will be shown if the user inputs \"pepperoni\".\n\n\
    ## Use else if to add more checks\n\nIf you want to check for another condition,\
    \ you can add an else if statement between if and else.\n\n```\nif ...\nelse if\
    \ (topping.toLowerCase() == \"pineapple\") {\n  reaction.innerHTML = \"That's\
    \ criminal!\";\n}\nelse ...\n```\n\nThe else if condition will only be checked\
    \ when the if condition is false.\n\nMe too\n\nThat's criminal!\n\nThis will be\
    \ shown if the user chooses pineapple.\n\nQ1 Add a second else if statement to\
    \ this code to give a different response when the user inputs \"spiders\".\n\n\
    You can add as many else if statements as you want.\n\n\"I'm a natural at selection\"\
    \ — Charles Darwin (probably...)\n\nSelection can take a bit of getting used to.\
    \ Try creating a similar web page to the one above, and make your own responses\
    \ to certain inputs using if, else and else if. Practice makes perfect.\n\nSection\
    \ Seven — JavaScript Basics"
  mdcn: "\n## 函数\n\n+   啊，函数……不，我说的不是那些花哨的社交活动。我指的是JavaScript函数。你已经用过一些了，比如 `alert()`\
    \ 和 `prompt()`，但下面将介绍如何创建自己的函数。\n\n- 理解函数是什么，以及如何自己定义一个函数。\n- 理解如何调用函数，以及调用函数会做什么。\n\
    \n## 你可以创建自己的函数\n\n你想创建的函数需要在代码的某个地方被定义——这意味着它们会被赋予一个名称，以及一段执行其任务的代码。\n\n函数是一个命名的代码块，用于执行特定任务。\n\
    \n```\n函数定义以 function 关键字开头。\nfunction sayHello() {\n    console.log(\"Hello\"\
    );\n}\n你需要给函数起一个名字，后面跟上圆括号 ()。\n花括号 {} 内的代码就是函数要执行的内容。在这里，它只是在控制台中输出 \"Hello\"\
    。\n```\n\n## 通过调用来使用函数\n\n+   1) 如果你查看了上面例子的控制台，你会发现什么都没有——这是因为函数只是被定义了。\n2) 要运行它，你需要“调用”它。\n\
    3) 你可以根据需要多次调用一个函数，而无需重复其原始代码。\n\n调用函数就是写它的名字来运行其代码。\n\n```\n继续上面的例子来调用函数。\nsayHello();\n\
    console.log(\"Again?\");\nsayHello();\n\nHello\nAgain?\nHello\n控制台显示了函数的输出。\n\
    ```\n\n## 你可以使用按钮来调用函数\n\n```\n就像 alert() 和 prompt() 一样，你可以用 <button> 调用自己的函数。\n\
    \n<p>你听说过 updog 吗？</p>\n<button onclick=\"updog()\">什么是 updog？</button>\n<script>\n\
    \    function updog() {\n        alert(\"没啥，你怎么样？\");\n    }\n</script>\n\n你听说过\
    \ updog 吗？\n什么是 updog？\n这个页面显示\n没啥，你怎么样？\n[确定]\n```\n\n对于本书中的网页，我们将 <script> 标签放在代码的最后，就在最终的\
    \ </body> 标签之前——在这个例子中这并不重要，但以后可以避免问题。\n\n> 警察局来电话了——他们想把他们的函数要回去……\n\n函数可以在你开发代码时节省大量时间——如果你每次使用函数都要重写它所做的事情，你的代码会没完没了地写下去……\n\
    \n## 修改文本\n\n学习目标\n将输出显示为警报很有趣，但这不是真正的网站经常使用的方式。所有酷炫的网站都使用JavaScript来修改页面本身的内容。\n\
    - 理解 `document.getElementById()` 和 `.innerHTML` 的作用。\n- 能够使用JavaScript修改HTML元素内的文本。\n\
    \n## JavaScript 可以修改网页的部分内容\n\n如果你想修改网页上的内容（比如文本）：\n1) 为你想要修改的HTML元素设置一个ID（可以参考第46页）。\n\
    2) 使用JavaScript，通过 `document.getElementById()` 来访问具有该ID的元素。\n3) 使用 `.innerHTML`\
    \ 替换该元素的内容。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_0.png)\n\n示例\n你可以根据提示的结果来修改页面上的文本。\n\
    \n这个 <p> 标签被赋予了一个ID，因此脚本可以访问和修改它的内容。\n\n这里使用了一个按钮来调用该函数，该函数将修改 <p> 标签的内容。\n\n\
    ```\n<p>你最喜欢的颜色是什么？</p>\n<button type=\"button\" onclick=\"getUsersFavColour()\"\
    >\n回复</button>\n<p id=\"fav-colour\">你最喜欢的颜色是 ???</p>\n<script>\nfunction getUsersFavColour()\
    \ {\nlet colour = prompt(\"请输入你最喜欢的颜色。\");\nlet text = \"你最喜欢的颜色是 \" + colour\
    \ + \"。\";\n\nlet favColour = document.getElementById(\"fav-colour\");\nfavColour.innerHTML\
    \ = text;\n}\n</script>\n```\n\n这就是点击按钮时将运行的函数。\n\n提示框获取一些用户输入，并将其放入一个句子中。\n\n\
    这一行代码让你能够访问ID为 `fav-colour` 的元素，然后...\n...这一行代码用从提示框形成的句子替换了该元素的内容。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_1.png)\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_2.png)\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_3.png)\n\
    \n这是根据用户输入而改变的段落。\n\n点击“回复”按钮时会出现此提示框。\n\n段落会改变以显示用户的输入。\n\nQ1 扩展此代码，添加另一个写着“忽略”的按钮。点击时，应将第二个段落更改为表达不满的回应——你可以自己想出来。\n\
    \n函数是区分大小写的。`.getElementByID` 会引发错误，因为“ID”应该是“Id”。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_61_4.png)\n\
    \n请记住，JavaScript错误不会显示在网页本身上——如果代码不能正常工作，请检查控制台中的错误。\n\n```\nbankStatement.innerHTML\
    \ = \"£1,000,000\";\n```\n\n使用此JavaScript功能可以使你的网页更具交互性，并且不依赖于用户必须检查控制台或警报来查看发生了什么变化。还有更多内容等着你……\n\
    \n第七节 — JavaScript基础\n\n## 选择\n\n你可能希望网页上的内容根据用户输入的不同而有不同的变化。如果你想学习如何做到这一点，请继续阅读。否则，这将超出你的理解范围。\n\
    \n+   - 理解选择的目的。\n- 能够使用 `if`、`else` 和 `else if` 语句。\n\n## 选择用于做决策\n\n+   1) 在JavaScript中，`if`\
    \ 语句用于执行选择。\n2) 它们通常后面跟着一个 `else` 语句。\n\n编程中的选择是指编写的代码仅在满足某个条件时才执行某些操作。\n\n你可以使用选择以不同的方式响应用户输入。\n\
    \n确保使用正确的括号——`( )` 包围条件，`{ }` 包围如果条件满足则运行的代码。\n\n```\n<p>我喜欢披萨。</p>\n<button type=\"\
    button\" onclick=\"getFavTopping()\">我也是</button>\n<p id=\"reaction\"></p>\n<script>\n\
    function getFavTopping() {\n  let topping = prompt(\"你最喜欢的配料是什么？\");\n  let reaction\
    \ = document.getElementById(\"reaction\");\n  if (topping.toLowerCase() == \"\
    pepperoni\") {\n    reaction.innerHTML = \"那也是我最喜欢的！\";\n  }\n  else {\n    reaction.innerHTML\
    \ = \"嗯，不错的选择。\";\n  }\n}\n</script>\n```\n\n`==` 检查两个值是否相等——有关此类运算符的更多信息，请参见第64页。\n\
    \n`<p>` 标签留空，以便脚本填写内容。\n\n点击按钮时将运行此函数。\n\n将条件（你要检查的内容）放在 `if` 后面的括号中——在这个例子中，你是在检查用户最喜欢的配料是否是意大利辣香肠。\n\
    \n此代码获取变量的值并使其全部变为小写，因此即使用户输入例如“Pepperoni”，检查也将为真。\n\n此代码仅在检查为真时运行。\n\n`else`\
    \ 语句是可选的。它仅在 `if` 条件为假时运行——在这个例子中，当用户回答的不是意大利辣香肠的任何其他配料时。\n\n我喜欢披萨。\n我也是\n\n我喜欢披萨。\n\
    我也是\n\n我喜欢披萨。\n我也是\n那也是我最喜欢的！\n\n我喜欢披萨。\n我也是\n嗯，不错的选择。\n\n如果用户输入意大利辣香肠以外的配料，将显示此内容。\n\
    \n如果用户输入“pepperoni”，将显示此内容。\n\n## 使用 else if 添加更多检查\n\n如果你想检查另一个条件，可以在 `if` 和\
    \ `else` 之间添加一个 `else if` 语句。\n\n```\nif ...\nelse if (topping.toLowerCase() ==\
    \ \"pineapple\") {\n  reaction.innerHTML = \"那简直是犯罪！\";\n}\nelse ...\n```\n\n\
    `else if` 条件仅在 `if` 条件为假时才会被检查。\n\n我也是\n\n那简直是犯罪！\n\n如果用户选择菠萝，将显示此内容。\n\nQ1 在此代码中添加第二个\
    \ `else if` 语句，以便在用户输入“spiders”时给出不同的回应。\n\n你可以根据需要添加任意多的 `else if` 语句。\n\n“我在选择方面是个天生的高手”——查尔斯·达尔文（可能……）\n\
    \n选择可能需要一点时间来适应。尝试创建一个与上面类似的网页，并使用 `if`、`else` 和 `else if` 对某些输入做出你自己的回应。熟能生巧。\n\
    \n第七节 — JavaScript基础\n"
