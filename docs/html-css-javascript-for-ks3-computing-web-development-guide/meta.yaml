    \ Parsons 创作的经典 CGP 风格。\n由 Alex Brown 撰写。\n\n编辑：Michael Bushell, Sammy El-Bahrawy,\
    \ Andy Hurst, Chris Lindle。\n审阅：Chris Charles, Tim Dudley, Natalie Whiting。\n\
    感谢 Shaun Harrogate 和 Shaun Whorton 进行校对。\n感谢 Alice Dent 进行版权研究。\n\n*Google Chrome™\
    \ 浏览器是 Google LLC 的商标，本书未获 Google 以任何方式背书或关联。*\n*Firefox 是 Mozilla Foundation\
    \ 在美国和其他国家的商标。*\n*Safari 网页浏览器和 MacOS 操作系统是 Apple Inc. 在美国和其他国家注册的商标。*\n*Notepad、Microsoft\
    \ Edge 和 Windows 是 Microsoft 集团公司的商标。*\n*JavaScript 是 Oracle Corporation 在美国的商标。*\n\
    \nCOWDR31 ~ 0124 - 28651\n\n剪贴画来自 Corel®\n文本、设计、版式及原创插图 © Coordination Group Publications\
    \ Ltd (CGP) 2024\n版权所有。\n\n0800 1712 712 • www.cgpbooks.co.uk\n\n# 什么是网络？\n\n\
    **学习目标**\n\n是什么在幕后运作，让网页显示在你的设备上？在你开始编码之前，最好了解一下这一切是如何工作的。\n\n- 理解什么是**网络**。\n\
    - 了解网络可以是**有线**的或**无线**的。\n- 了解网络的**优点**和**缺点**。\n\n## 网络是**连接**的设备\n\n1) 当你将两个或多个**设备连接**起来时，你就拥有了一个**网络**。\n\
    2) 网络允许设备之间**相互通信**。\n\n## 连接可以是**有线**的或**无线**的\n\n- **信号**通过**电线**传输，可以使用**电**（例如铜缆）或**光**（例如光纤）。\n\
    - **信号**也可以在空气中**无线传播**——通常通过**无线电波**。\n\n> Wi-Fi® 和 Bluetooth® 是使用无线电波的无线技术。\n\
    \n**示例** 三个你可能在日常生活中遇到的网络。\n\n**Q1** 描述一个可能存在于以下场所的网络示例：\na) 超市\nb) 体育场\n\n##\
    \ 网络有**优点**也有**缺点**\n\n- 网络的三个**优点**：\n1) 消息可以**快速**且**廉价**地发送——例如通过**电子邮件**。\n\
    2) 某些**操作**可以**远程**完成，例如关闭教室里所有的电脑。\n3) **文件**和**设备**（如打印机）可以在计算机之间**共享**。\n\n\
    - 网络的三个**缺点**：\n1) **建立**网络可能**昂贵**。\n2) 可能需要**定期维护**。\n3) 如果**黑客**或**恶意软件**进入网络，**所有**连接的设备都可能受到影响。\n\
    \n> **恶意软件**是旨在执行恶意操作的计算机程序。例如删除或修改文件。\n\n**我曾想过避开网络，但 wi-fi 无法抗拒...** 计算机网络可追溯到\
    \ 20 世纪 50 年代——如今，不与网络互动就寸步难行。如果你有一个电子设备，某个地方就会有人试图将其连接起来。\n"
