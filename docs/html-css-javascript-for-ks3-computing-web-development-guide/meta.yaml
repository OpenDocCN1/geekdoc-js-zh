    \ at cgpbooks.co.uk/biscuit.\n\n```\nlet r = Math.floor(Math.random() * 56) +\
    \ 200;\nlet colour = \"rgb(\" + r + \", 209, 246)\";\n```\n\nThere are (255 –\
    \ 200) + 1 = 56 possible values for the red (r) component, and the smallest value\
