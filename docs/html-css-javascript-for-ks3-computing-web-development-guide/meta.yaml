    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_34_0.png)\n\n```\n<p><a href=\"https://www.cgpbooks.co.uk\"\
    \ target=\"_blank\"> Books</a> (opens in new tab).</p>\n```\n\n编写此消息使你的网页更易于访问。\n\
    \n## 超链接可以打开新电子邮件\n\n1)  超链接不仅可以链接两个网页，还可以用来使用你电脑上的电子邮件软件打开一封新邮件。\n2)  这通过在 `href`\
    \ 属性中使用 `mailto:` 后跟电子邮件地址来实现。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_34_1.png)\n\
