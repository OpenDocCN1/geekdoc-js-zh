  md: '# Section Eight — Advanced JavaScript


    # Numbers and Booleans


    **Learning Objectives**

    As you''ve seen, JavaScript can handle strings well — but it ain''t a one-trick
    pony, it''s an all-singing, all-dancing programming language that can handle other
    data types too.


    * Be able to use the common arithmetic and comparison operators.

    * Be able to use functions to convert between numbers and strings.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_67_0.png)


    # Arithmetic operators work on numbers


    1) JavaScript has a single numerical data type, called Number, which is used for
    both integers (whole numbers) and decimal numbers.

    2) The usual arithmetic operators can be used.

    3) If you need to convert a decimal number to an integer, you can use these functions:

    * Math.round() rounds to the nearest integer.

    * Math.floor() rounds down to the nearest integer.


    | Operator | Meaning | Example | Output |

    | :--- | :--- | :--- | :--- |

    | + | Addition | console.log(5 + 8); | 13 |

    | - | Subtraction | console.log(9 - 2); | 7 |

    | * | Multiplication | console.log(4 * 3); | 12 |

    | / | Division | console.log(6 / 2); | 3 |


    ```

    console.log(Math.round(5.7)); // 6

    console.log(Math.floor(5.7)); // 5

    ```


    # Boolean values are true or false


    1) Alongside strings and numbers, JavaScript also has a Boolean data type.

    2) There''s only two possible Boolean values — true and false.

    3) Comparison operators do what they sound like — they compare two values, giving
    a Boolean result.


    | Operator | Meaning | Example | Output |

    | :--- | :--- | :--- | :--- |

    | == | Equal to | console.log("A" == "a") | false |

    | != | Not equal to | console.log(7 != 9) | true |

    | < <= | Less than Less than or equal to | console.log(3 < 3) | false |

    | > >= | Greater than Greater than or equal to | console.log(3 >= 3) | true |


    # Strings can be converted to numbers


    * Values returned by prompt(), or taken from elements using .innerHTML, are strings.

    * JavaScript will automatically convert strings to numbers if you use them with
    some operators (e.g. -, *, /), but not with the + operator — which will join the
    strings together instead (see p.54).

    * If you want to do arithmetic, it''s best to convert values to numbers first,
    using e.g. parseInt().


    ```

    let input = prompt("How many laps can you swim?");

    let oldTotal = parseInt(input);

    let newTotal = oldTotal + 1;

    alert("Pfft, I can do " + newTotal + "!");


    // parseInt() converts the inputted string to an integer.

    // As an integer, oldTotal can be used in addition.

    ```


    * You can also use parseFloat() which converts strings to decimal numbers, and
    if needed, you can add .toString() after a variable to convert it back to a string,
    e.g. newTotal.toString().


    **Numbers are a false god — I''ve converted to Booleanism...**

    If a string isn''t a valid number, then parseInt() and parseFloat() will return
    a special value called NaN (short for ''Not a Number''). Any arithmetic you try
    to do with NaN will result in NaN.'
