  mdcn: "\n## 控制超链接\n\n> 于是，那些小巧的蓝色超链接，以其全然下划线的荣耀，脱颖而出，呐喊着“点我，点我”。而我轻声说“不”——因为你尚未设置它们的所有属性。\n\
    \n-   能够制作在新标签页中打开的超链接。\n-   能够制作用于打开新电子邮件的超链接。\n\n## 超链接可以在新标签页中打开\n\n1)  通常，当你点击一个超链接时，它会在你当前使用的标签页中打开。\n\
