    ```\n\n你可以使用类而不是ID，以便你的页面能显示多个甜点。\n\n## 挑战2\n\n创建一个包含以下一个或多个旗帜的网页。每个旗帜应仅使用`<div>`标签和CSS制作。它们可以水平或垂直排列。\n\
    \n## 挑战3\n\n时尚航空（Stylish Air）对飞往三个目的地的航班提供七折优惠：奥斯陆（挪威）、那不勒斯（意大利）和里斯本（葡萄牙）。他们希望有一个网站可用于推广这些优惠。首页应提及此优惠，并包含以下设计：\n\
    \n首页的每个方框都应包含一个链接，指向关于该目的地的页面。\n\n各个目的地页面的样式可以相同，但每个页面都应在左侧包含一张该目的地的照片，并在其右侧列出关于该目的地的若干事实。\n\
    \n## 第七节 — JavaScript基础\n\n## 入门\n\n**学习目标**\n\n你可能以前用过Python等语言进行过一些编程。JavaScript是另一种语言，它非常适合用来为网页添加酷炫效果。\n\
    \n- 理解JavaScript是什么以及它的用途。\n- 了解静态和动态网页的区别。\n- 能够使用`<script>`标签来标记JavaScript代码。\n\
    - 能够使用JavaScript向控制台输出消息。\n\n## JavaScript是一种编程语言\n\n1. 编程语言让你能够通过向计算机发出指令来控制它。\n\
    2. 由于HTML和CSS只是描述网页的结构和样式，它们不是编程语言。\n3. JavaScript是——它可以用来制作各种程序，包括桌面应用和游戏。\n\
    4. 由于大多数网络浏览器都能运行JavaScript，它在网络上被广泛使用——几乎所有网站都以某种方式使用它。\n\n> 你可能听说过Java™——尽管名字相似，但Java™和JavaScript是不同的编程语言。\n\
    \n## JavaScript创建动态网页\n\n- 你迄今为止制作的网页大多是静态的。\n- 许多真实的网页是动态的，并能响应用户的操作。\n- 通过将JavaScript与HTML和CSS结合使用，你可以添加交互性，创建自己的动态网页。\n\
    \n## JavaScript在网页浏览器中运行\n\n要进行JavaScript开发，最好使用带有控制台的浏览器——例如Microsoft Edge（Windows）、Safari网页浏览器（macOS）或Google\
    \ Chrome网页浏览器（Windows、macOS和Linux）。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <script>\nconsole.log(\"Hello, world!\");\n</script>\n</body>\n</html>\n```\n\
    JavaScript可以使用`<script>`标签写在HTML中。\n除了`<script>`标签内的这一行JavaScript代码，所有这些HTML代码你都应该熟悉。\n\
    引号内的任何内容都会被输出到控制台。\n\n当你在浏览器中打开这个页面时，你只会看到一个空白页面，因为`console.log()`的输出显示在“控制台”中。\n\
    要看到它，你需要打开控制台。在Chrome中，右键单击并选择“检查”。\n然后点击此菜单上的“控制台”（你可能需要点击“>>”才能看到此选项）。\n\n**我曾经点击过一个静态网页——那景象令人震惊……**\n\
    如果你已经了解其他编程语言，要注意不要将语法与JavaScript混淆——注意你的括号、引号、分号等放在哪里。\n"
