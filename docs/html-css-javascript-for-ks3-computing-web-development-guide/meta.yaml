    \n## Changing Fonts\n\nLearning Objectives\n\nA font can make all the difference\
    \ to how something looks. Totally Real Bank would look a bit fishy, but Totally\
    \ Real Bank? Now that's a legit business — sign me up.\n\n- Understand what a\
    \ font family is.\n- Be able to use the font-family property to change the font\
    \ of text.\n- Be able to use the font-size property to change the size of text.\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_26_0.png)\n\n### font-family determines\
    \ how text looks\n\n1. A font is a particular design of the letters, numbers and\
    \ symbols that make up text.\n2. A font family is a group of similar fonts — they\
    \ often include regular, bold and italic variations of the same font.\n   E.g.\
    \ the 'Times New Roman' family includes: regular, bold and italic.\n3. CSS also\
    \ groups fonts into generic families, including:\n   - Serif — for more traditional\
    \ looking text (e.g. Times New Roman).\n   - Sans-serif — for clean and simple\
    \ looking text (e.g. Arial).\n4. You can use the font-family property to say which\
    \ font(s) you want text to be displayed in.\n\nOther generic font families include:\
    \ cursive (e.g. for handwriting), monospace (e.g. for code) and fantasy (for other\
    \ stuff...).\n\nA serif is a small flick (line) attached to a letter.\n\n**EXAMPLE**\n\
    \nHow to use the font-family property.\nList one or more font families (separated\
    \ by commas) in your order of preference.\nInclude a generic family in case a\
    \ web browser can't display your other choices.\nIf a web browser couldn't use\
    \ Arial here, it would pick another font from the sans-serif family, like Helvetica.\n\
    \n```\n<body style=\"font-family: Arial, sans-serif;\">\n  <h1>New Font, New Me</h1>\n\
    \  <p>This is looking <i>better</i> already.</p>\n  <p style=\"font-family: 'Times\
    \ New Roman', serif;\">Serifs drool,</p>\n  <p>Sans-serifs rule.</p>\n</body>\n\
    ```\n\nPut in quotes around font names containing spaces.\n\n**New Font, New Me**\n\
    \nThis is looking better already.\nSerifs drool,\nSans-serifs rule.\n\n5. CSS\
    \ can make text bold and italic without using `<b>` or `<i>` tags.\n\n```\n<p\
    \ style=\"font-weight: bold;\">Bold</p>\n<p style=\"font-style: italic;\">Italic</p>\n\
    ```\n\nYou can set the value of these properties to normal to remove bold or italics\
    \ from elements that have them set as default.\n\n**Bold**\n*Italic*\n\n### Use\
    \ font-size to make text bigger and smaller\n\n**EXAMPLE**\n\nTwo ways to represent\
    \ size are by percentage or by number of pixels (px).\nA percentage value means\
    \ the text will be at that percentage bigger or smaller than usual.\nA value in\
    \ pixels means the text will be displayed at exactly that size.\n\nThe default\
    \ font size in web browsers is usually 16px.\n\n```\n<p>Domain names for sale</p>\n\
    <p style=\"font-size: 200%;\">Now just 50p</p>\n<p style=\"font-size: 8px;\">Sponsored\
    \ Ad</p>\n```\n\nDomain names for sale\nNow just 50p\nSponsored Ad\n\n> Inaccessible\
    \ web design principle #1: pick a font that's a pain in the backside to read...\n\
    \nIf your web browser isn't showing the correct font, then check commas and quotation\
    \ marks (they're easy to get wrong), and check spelling too — Ariel is my great-aunt's\
    \ name, not a font.\n\n## Alignment and Size\n\nTwo topics for the price of one\
    \ here — don't say I never did anything for you. This page covers the basics of\
    \ how to get stuff where you want it on a page.\n\n- Be able to use the text-align\
    \ property to realign text.\n- Be able to use the width property to resize elements.\n\
    \n### Improve layout by aligning\n\n- The text-align property changes the horizontal\
    \ position of blocks of text.\n- The three main values it can have are left (the\
    \ default), right and center.\n\n```\n<h1 style=\"text-align: center;\">\n  Pencil\
    \ Weekly\n</h1>\n<p style=\"text-align: right;\">\n  The right way to write. <br>\n\
    \  <img src=\"pencil.jpg\">\n</p>\n<p>Your source of pencil news.</p>\n```\n\n\
    There are lots of ways to position text and images with CSS. The example above\
    \ shows the simplest method — see Section 6 for more advanced positioning.\n\n\
    ### Resize elements using width\n\n1. Elements, like headings and paragraphs,\
    \ normally fill the width of the available space.\n2. You can change this behaviour\
    \ by setting their width property.\n3. Use a percentage value if you want a width\
    \ that's proportional to the available space.\n\n```\n<p style=\"width: 50%;\"\
    >The HB pencil performs well under extreme conditions.</p>\n```\n\n4. Use a value\
    \ in pixels if you want to set an exact width.\n\n```\n<p style=\"width: 100px;\"\
    >\nThe HB pencil performs well under extreme conditions.\n</p>\n```\n\n5. Beware\
    \ — this CSS width property is different to the HTML width attribute that you\
    \ saw for the `<img>` tag on p.15. That attribute can only have pixel values and\
    \ most elements can't use it.\n\n## CSS — Color Center Spelt Strangely...\n\n\
    Getting things where you want them on a web page can be a bit of a headache. It\
    \ can be helpful to add a border just to see where the edges of your element are\
    \ — you can always remove it later.\n\n## Practice Questions\n\n### Warm-Up\n\n\
    **Q1** What is a font family?\n**Q2** Is the following text in a serif or a sans-serif\
    \ font? \"I love eggs.\"\n**Q3** What does 'px' stand for when used in a property's\
    \ value?\n**Q4** Name three possible values of the text-align property.\n\n###\
    \ Practice Questions\n\n**Q1** Finish the sketch of the web page created by the\
    \ code below.\n\n```\n<body style=\"font-size: 10px;\">\n\n<p>Egg</p>\n<p style=\"\
    font-size: 150%;\">Egg</p>\n<p style=\"font-size: 20px;\">Egg</p>\n\n</body>\n\
    ```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_28_0.png)\n\n**Q2** Complete the\
    \ missing parts of the code to recreate the web pages shown.\n\n```\na)\n<h1 style=\"\
    ...;\">Arial, ...;\">Egg</h1>\n![serif or sans-serif?](image_placeholder_2)\n\
    Egg\n```\n\n```\nb)\n<p style=\"...\">\n<img src=\"egg.jpg\" alt=\"Egg\">\n</p>\n\
    ```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_28_1.png)\n\n**Q3** Describe the\
    \ three errors in the code below.\n\n```\n<body style=\"background-color: Yellow;\
    \ font-family: 'Times New Roman' serif;\">\n<h1 style=\"text-align: centre;\"\
    >My Fried Egg Recipe</h1>\n<p width=\"50%\">Fry it. Eat it. Victory.</p>\n</body>\n\
    ```\n\n1. ......................................................................................\n\
    2. ......................................................................................\n\
    3. ..................................................................................\n\
    \n## Coding Challenges for Section Three\n\nBy now you should be serving more\
    \ style than Paris Fashion Week, so why not have a go at these challenges?\nDon't\
    \ forget, you can visit [cgpbooks.co.uk/biscuit](http://cgpbooks.co.uk/biscuit)\
    \ to download [example code](http://example.com) for each challenge.\n\n## Challenge\
    \ 1 — Example\n\nA [tour guide company](http://tour-guide) wants you to design\
    \ a web page for them. One of the stops on their tour is the [Eiffel Tower](http://eiffel-tower)\
    \ in Paris.\n\n> Don't forget — the example code on these pages doesn't show the\
    \ full standard structure (see p.9).\n\nThe page should have the following features:\n\
    \n- A [light grey background](http://light-grey).\n- A [photo](http://photo) of\
    \ the Eiffel Tower in the [centre](http://centre), [200 pixels](http://200px)\
    \ in [height](http://height).\n- The text \"[Eiffel Tower, Paris](http://eiffel-tower-paris)\"\
    \ [underneath](http://underneath) the image, in a [serif font](http://serif-font).\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_29_0.png)\n\n## SOLUTION\n\nPlan: Find\
    \ a photo of the Eiffel Tower and save it in the same folder as the .html file,\
    \ then use CSS to style the background, font and set the positioning.\n\n1. Set\
    \ the background-color property to LightGrey in the `<body>` tag, so it applies\
    \ to the whole page.\n2. Set the font-family property to a serif font, and include\
    \ the generic serif family in case a web browser can't use your chosen font.\n\
    3. Use the text-align property to position everything in the centre of the page.\n\
    \n```\n<body style=\"background-color: LightGrey;\">\n    <p style=\"font-family:\
    \ 'Times New Roman', serif; text-align: center;\">\n        <img src=\"eiffel-tower.jpg\"\
    \ height=\"200\"\n             alt=\"A photo of the Eiffel Tower, Paris\">\n \
    \       <br> Eiffel Tower, Paris\n    </p>\n</body>\n```\n\n4. Use an `<img>`\
    \ tag and set the src attribute to the file name of the photo, and the height\
    \ attribute to 200 (pixels).\n5. Use a line break so the text goes underneath\
    \ the image.\n\n## Challenge 2\n\nYou have been [urgently hired](http://hired)\
    \ by a [kickboxing club](http://kickboxing) after their last web developer quit\
    \ without notice. They want you to complete an [unfinished web page](http://unfinished).\n\
    \nYou should:\n\n- Fix it — so the [errors are removed](http://errors).\n- Improve\
    \ it — so it's [more accessible](http://accessible).\n\nThe code below is your\
    \ [starting point](http://starting-point). On the right is a [mock up](http://mock-up)\
    \ of what the page is [supposed to look like](http://supposed-to-look-like).\n\
    \n```\n<body style=\"font: Arial;\n            color: Green;\n            background-color:\
    \ HotPink;\">\n    <p>Kiana's Kickboxing</p>\n    <img src=\"kickboxer\" height=\"\
    20\">\n    <p>Come by for a free drop-in:</p>\n    <p>Tuesday 4pm to 7pm</p>\n\
    </body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_29_1.png)\n\n> You don't\
    \ need to match these colours and fonts exactly."
  mdcn: "\n## 练习题\n\n## 热身练习\n\n**Q1** 判断对错：`<br>` 标签有一个闭合的 `</br>` 标签。\n**Q2** 'CSS'\
    \ 是什么的缩写？\n**Q3** 下面这行代码有什么问题？\n\n```\n<b style=\"colour: Green;\">USA USA USA!</b>\n\
    ```\n\n**Q4** 现代浏览器支持多少种颜色名称：多于100种还是少于100种？\n\n## 练习题\n\n**Q1** 给出两种方法，使你的网页设计更具可访问性。\n\
    \n1. ............................................................................................................\n\
    2. ............................................................................................................\n\
    \n**Q2** 描述 HTML 和 CSS 在用途上的区别。\n\n............................................................................................................\n\
    \n**Q3** 通过从每个术语画一条箭头指向代码中的正确部分，来标注下面的代码。\n\n```\n<p style=\"background-color:\
    \ LavenderBlush;\">\n  Don't read this, it won't help you answer the question.\n\
    </p>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_25_0.png)\n\n**Q4** 重新创建下面显示的网页。\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_25_1.png)\n\n## 更改字体\n\n学习目标\n\n字体能让事物的外观大不相同。“完全真实银行”看起来有点可疑，但“完全真实银行”呢？现在这是一家合法企业了——算我一个。\n\
    \n- 理解什么是字体族。\n- 能够使用 `font-family` 属性更改文本的字体。\n- 能够使用 `font-size` 属性更改文本的大小。\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_26_0.png)\n\n### `font-family` 决定文本的外观\n\
    \n1. 字体是构成文本的字母、数字和符号的一种特定设计。\n2. 字体族是一组相似的字体——它们通常包括同一字体的常规、粗体和斜体变体。\n   例如：'Times\
    \ New Roman' 字体族包括：常规、粗体和斜体。\n3. CSS 还将字体分组为通用字体族，包括：\n   - Serif（衬线体）——用于外观更传统的文本（例如\
    \ Times New Roman）。\n   - Sans-serif（无衬线体）——用于外观干净简洁的文本（例如 Arial）。\n4. 你可以使用 `font-family`\
    \ 属性来指定你希望文本使用哪种字体。\n\n其他通用字体族包括：cursive（用于手写体），monospace（用于代码）和 fantasy（用于其他东西……）。\n\
    \n衬线是附加在字母上的一个小勾（线条）。\n\n**示例**\n\n如何使用 `font-family` 属性。\n按你的偏好顺序列出一个或多个字体族（用逗号分隔）。\n\
    包含一个通用字体族，以防网页浏览器无法显示你的其他选择。\n如果网页浏览器无法使用 Arial，它会从无衬线字体族中选择另一种字体，比如 Helvetica。\n\
    \n```\n<body style=\"font-family: Arial, sans-serif;\">\n  <h1>New Font, New Me</h1>\n\
    \  <p>This is looking <i>better</i> already.</p>\n  <p style=\"font-family: 'Times\
    \ New Roman', serif;\">Serifs drool,</p>\n  <p>Sans-serifs rule.</p>\n</body>\n\
    ```\n\n在包含空格的字体名称两边加上引号。\n\n**新字体，新我**\n\n这已经看起来好多了。\n衬线体很逊，\n无衬线体才够酷。\n\n5. CSS\
    \ 可以使文本加粗和变为斜体，而无需使用 `<b>` 或 `<i>` 标签。\n\n```\n<p style=\"font-weight: bold;\"\
    >Bold</p>\n<p style=\"font-style: italic;\">Italic</p>\n```\n\n你可以将这些属性的值设置为 `normal`，以从默认设置了粗体或斜体的元素中移除这些样式。\n\
    \n**粗体**\n*斜体*\n\n### 使用 `font-size` 调整文本大小\n\n**示例**\n\n表示大小的两种方式是通过百分比或像素（px）。\n\
    百分比值意味着文本将比通常情况大或小该百分比。\n像素值意味着文本将按该精确大小显示。\n\n网页浏览器中的默认字体大小通常是 16px。\n\n```\n\
    <p>Domain names for sale</p>\n<p style=\"font-size: 200%;\">Now just 50p</p>\n\
    <p style=\"font-size: 8px;\">Sponsored Ad</p>\n```\n\n域名出售\n现在只需 50 便士\n赞助广告\n\
    \n> 不可访问的网页设计原则 #1：选择一个读起来很费劲的字体……\n\n如果你的网页浏览器没有显示正确的字体，那么请检查逗号和引号（它们很容易出错），还要检查拼写——Ariel\
    \ 是我姑婆的名字，不是字体。\n\n## 对齐与大小\n\n这里一次两个主题——别说我从没为你做过什么。本页介绍了如何将元素放置到页面上所需位置的基础知识。\n\
    \n- 能够使用 `text-align` 属性重新对齐文本。\n- 能够使用 `width` 属性调整元素大小。\n\n### 通过对齐改善布局\n\n\
    - `text-align` 属性改变文本块的水平位置。\n- 它可以有的三个主要值是 `left`（默认）、`right` 和 `center`。\n\n\
    ```\n<h1 style=\"text-align: center;\">\n  Pencil Weekly\n</h1>\n<p style=\"text-align:\
    \ right;\">\n  The right way to write. <br>\n  <img src=\"pencil.jpg\">\n</p>\n\
    <p>Your source of pencil news.</p>\n```\n\n有很多方法可以使用 CSS 来定位文本和图像。上面的例子展示了最简单的方法——更多高级定位请参见第\
    \ 6 节。\n\n### 使用 `width` 调整元素大小\n\n1. 像标题和段落这样的元素通常会填满可用空间的宽度。\n2. 你可以通过设置它们的\
    \ `width` 属性来改变这种行为。\n3. 如果你想要一个与可用空间成比例的宽度，请使用百分比值。\n\n```\n<p style=\"width:\
    \ 50%;\">The HB pencil performs well under extreme conditions.</p>\n```\n\n4.\
    \ 如果你想设置一个精确的宽度，请使用像素值。\n\n```\n<p style=\"width: 100px;\">\nThe HB pencil performs\
    \ well under extreme conditions.\n</p>\n```\n\n5. 注意——这个 CSS 的 `width` 属性与你在第\
    \ 15 页 `<img>` 标签上看到的 HTML `width` 属性不同。那个属性只能有像素值，而且大多数元素不能使用它。\n\n## CSS——颜色中心拼写很奇怪……\n\
    \n把东西放到网页上你想要的位置可能有点令人头疼。添加一个边框来查看元素的边缘位置可能会很有帮助——你随时可以之后再移除它。\n\n## 练习题\n\n###\
    \ 热身练习\n\n**Q1** 什么是字体族？\n**Q2** 下面的文字使用的是衬线字体还是无衬线字体？“I love eggs.”\n**Q3** 在属性值中使用的\
    \ 'px' 代表什么？\n**Q4** 说出 `text-align` 属性的三个可能值。\n\n### 练习题\n\n**Q1** 完成由下面代码创建的网页草图。\n\
    \n```\n<body style=\"font-size: 10px;\">\n\n<p>Egg</p>\n<p style=\"font-size:\
    \ 150%;\">Egg</p>\n<p style=\"font-size: 20px;\">Egg</p>\n\n</body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_28_0.png)\n\
