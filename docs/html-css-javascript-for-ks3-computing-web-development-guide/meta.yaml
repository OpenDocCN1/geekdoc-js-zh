  - "[PAGE 41]\n\n# Colour Codes\n\nLearning Objectives\n\nWith over a hundred colour\
    \ names to choose from, you'd think that'd be plenty. But no, it never is. Here's\
    \ what to do when 'MintCream' just isn't minty enough.\n\n* Learn how [hex codes](hex%20codes)\
    \ can represent [different colours](different%20colours).\n* Understand how to\
    \ [find a hex code](find%20a%20hex%20code) for a given colour.\n\n# Every colour\
    \ has a hex code\n\n1) As you saw on p.20, there are loads of [named colours](named%20colours)\
    \ you can use [on the Web](on%20the%20Web). For example, '[Indigo](Indigo)' is\
    \ this [dark purplish blue](dark%20purplish%20blue).\n\n2) Every colour has a\
    \ corresponding [hex colour code](hex%20colour%20code) that you can use instead\
    \ of writing a name — e.g. the [code for Indigo](code%20for%20Indigo) is #4B0082.\n\
    \nHex (short for hexadecimal) is a number system that uses 16 digits — the numerals\
    \ 0-9 and then the letters A-F.\n\n+   Q1 Use CSS to find which colour name matches\
    \ the following colour codes.\n\na) #0000FF\nBlue, Green or Yellow?\n\nb) #808080\n\
    Brown, Beige or Grey?\n\nc) #FFA500\nLime, Orange or Pink?\n\nEXAMPLE There's\
    \ not much to using colour codes really.\n\n```\n<head>\n  <style>\n    h1 { color:\
    \ Indigo; }\n    p { color: #4B0082; }\n  </style>\n</head>\n<body>\n  <h1>Indigo\
    \ Fansite</h1>\n  <p>Let's go indigo!</p>\n</body>\n```\n\nYou can use a [colour\
    \ code](colour%20code) instead of a [colour name](colour%20name) for any CSS property\
    \ where you need to [set a colour](set%20a%20colour).\n\nIndigo Fansite\nLet's\
    \ go indigo!\n\nThe <h1> and <p> text have the [same colour](same%20colour).\n\
    \nHex codes for the named colours are listed in ColourCodes.txt in the downloadable\
    \ files for this section.\n\n# Use a colour picker to find a hex code\n\n+   *\
    \ Hex codes are needed because [not all colours have names](not%20all%20colours%20have%20names).\n\
    * Even for [named colours](named%20colours), you sometimes want a [lighter](lighter)\
    \ or [darker shade](darker%20shade).\n* You can use a tool like a [colour picker](colour%20picker)\
    \ to help you find a [hex code](hex%20code) for the [exact colour](exact%20colour)\
    \ you want to use.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_41_0.png)\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_41_1.png)\n\
    \nThe code files for this section contain a colour picker app — just open 'ColourPicker.html'\
    \ in your web browser to use it. It may look a bit different depending on what\
    \ device you're using. You can also search e.g. \"CSS colour picker\" online to\
    \ find more advanced colour pickers.\n\nHex colour codes are based on a simple\
    \ system: the first two digits represent Red, the middle two represent Green,\
    \ and the last two represent Blue. E.g. Indigo has the code #4B0082 — meaning\
    \ it's a mix of Red (4B) and Blue (82), but no Green (00). By changing these values\
    \ you can alter the colour.\n\nYou can click here to switch the display to show\
    \ [hex code](hex%20code).\n\n+   Q2 Use a colour picker to find the hex codes\
    \ for the following colours:\n\na) Black\nb) White\nc) Red\n\nAnyone going to\
    \ #IndigoCon this year? #IndiGoing #4B0082...\n\nWith so many colours available\
    \ it can be tempting to use loads of them, but many well-designed websites use\
    \ just a few colours that work well together — tastes vary, so do what speaks\
    \ to you."
  - "[PAGE 42]\n\n# External CSS\n\n# Learning Objectives\n\nFloral wallpaper, tartan\
    \ cushions, a leopard-print rug… My style is awful-(I could stop here)-ly inconsistent.\
    \ Don't be like me — keep your style consistent with external CSS.\n\n+   - Understand\
    \ the **benefits** of external CSS.\n- Be able to use the **<link>** tag to mark\
    \ up **external CSS** and add **icons** to web pages.\n- Learn about how **CSS\
    \ rules** are **prioritised**.\n\n# Web pages can share styles with external CSS\n\
    \n1) Up till now, you've seen two ways of **using CSS** in your web pages:\n\n\
    +   - **Inline CSS** — which is assigned to **style attributes** and is good for\
    \ **one-off uses**.\n- **Internal CSS** — which is marked up by **<style> tags**\
    \ in the **<head>**, and is good for **repeating styles** on a **web page**.\n\
    \n2) If your website has **multiple pages** that you want to **style the same\
    \ way**, then using either of these methods would mean you'd have to **copy the\
    \ same CSS** into each page — which **isn't very efficient**.\n\n3) **External\
    \ CSS** solves this problem — it's CSS that's **saved** in a **separate file**,\
    \ called an **external style sheet**, which is then **linked** to each of your\
    \ pages.\n\nExternal CSS can also be used if you just want your HTML to look less\
    \ busy.\n\n# External CSS goes in a .css file\n\nMaking an **external style sheet**\
    \ is simple:\n\n+   - Open a **new file** in your **text** (or **code**) editor.\n\
    - **Save** the file with the **.css file format** (depending on your editor, you\
    \ may just need to select 'Cascading Style Sheet' as the **file type**).\n- Once\
    \ saved, enter your **CSS** — it's written the same as **internal CSS** on p.36,\
    \ except you **don't include** the **<style> tags**.\n- **Save again** — your\
    \ style sheet is now **ready to use**.\n\n```\nbody {\n  background-color: LightBlue;\n\
    \  font-family: Arial, sans-serif;\n}\nh1 {\n  text-decoration: underline;\n \
    \ color: Indigo;\n}\n```\n\nSaving a .css file is similar to the process on p.5\
    \ for saving .html files.\n\nThe following examples will assume this style sheet\
    \ is saved as 'styles.css' in the same folder as the web pages.\n\n# Use <link>\
    \ to apply external CSS\n\nOnce you've made an **external style sheet**, you then\
    \ need to **connect it** to your web pages using the **<link> tag**.\n\n**EXAMPLE**\
    \ Linking to an external style sheet.\n\nDespite the name, the <link> tag isn't\
    \ used for hyperlinks — that's the <a> tag's job (see p.30).\n\nThe **<link> tag**\
    \ goes in the **<head>** — it **doesn't** have a **closing tag**.\n\nThe **href**\
    \ attribute tells the **web browser** which **file** to look for and **where it's\
    \ located**.\n\n```\n<head>\n  <link rel=\"stylesheet\" href=\"styles.css\">\n\
    </head>\n<body>\n  <h1>CSS Workshop</h1>\n  <p><a href=\"info.html\">Find out\
    \ more</a>.</p>\n</body>\n```\n\nThe **rel** attribute tells the **web browser**\
    \ how this file **relates** to the **web page**.\n\n# CSS Workshop\n\nFind out\
    \ more.\n\nWhen the **page** is viewed in a web browser, it will **apply** the\
    \ **style sheet** referred to in the **<link> tag**."
