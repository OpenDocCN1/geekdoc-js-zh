    无障碍功能也有助于搜索引擎理解你的页面——它们利用标题来把握内容结构，并通过 `alt` 属性了解图片内容。\n\n## 样式化页面\n\n> **学习目标**\n\
    \n好了，别再找借口了，是时候让你的网页看起来棒极了。准备好成为一名双语网页开发者——你将要学习 CSS。\n\n*   理解 CSS 的含义及其用途。\n\
    *   能够使用 `style` 属性添加内联 CSS。\n*   能够使用 `border-style` 属性添加边框。\n\n### CSS 为你的网页增添风格\n\
    \n1.  **CSS** 代表 **层叠样式表**——与 HTML 类似，它也是一种网页语言。\n\n2.  网页可以**混合包含** HTML 和 CSS：\n\
    \    *   HTML **标记**不同的**元素**——如标题、段落**等**。\n    *   CSS **改变**这些元素的**外观**——字体、颜色**等**。\n\
    \n3.  一段典型的 CSS **看起来**像这样：\n    *   这是一个属性——它代表你想要改变的元素的某个特征。\n    *   `border-style`:\
    \ solid;\n    *   这是属性的值——它决定了你希望该特征呈现的样式。\n\n### 使用 style 属性设置内联属性\n\n*   使用\
    \ CSS 最简单的方法是通过其 `style` 属性直接将其添加到 HTML 标签中。\n*   这被称为内联 CSS——其他使用 CSS 的方法将在第\
    \ 5 节介绍。\n\n**示例** 如何为页面上的元素添加边框。\n\n在开始标签中添加一个 `style` 属性。在引号内，写上属性名后跟一个冒号。然后写上值，后跟一个分号。\n\
    \n```html\n<h1 style=\"border-style: solid;\">哦，好漂亮的边框</h1>\n\n<p>此段落没有样式，所以没有边框</p>\n\
    \n<p style=\"border-style: dotted;\">但这个段落有虚线边框</p>\n```\n\n`border-style` 属性可用于大多数元素。\n\
    \n边框将拉伸以填满网页浏览器的宽度。你将在第 24 页学习如何控制它们的尺寸。\n\n> 如果未设置属性，则会使用默认值——对于 `border-style`，默认值为\
    \ `none`。\n\n**哦，好漂亮的边框**\n\n此段落没有样式，所以没有边框\n\n> 但这个段落有虚线边框\n\n*   你还可以尝试的其他 `border-style`\
    \ 值包括：`dashed`（虚线）、`double`（双线）、`groove`（凹槽）、`ridge`（脊线）、`inset`（内嵌）和 `outset`（外凸）。\n\
    \n| Q1 | Q2 |\n| :--- | :--- |\n| 编写一行代码，显示一张带有虚线边框的图片。 | 重新创建这个：哇，是双线边框 |\n\n\
    > **`border-style: eaten too much cheese;`**\n\n冒号 (`:`) 始终是必需的——它将 CSS 属性与其值分隔开。分号\
    \ (`;`) 在只设置单个属性时是可选的，但包含它是个好习惯。\n\n## 文本颜色\n\n**学习目标**\n\n是时候为你的网页注入一些色彩了，CSS\
    \ 提供了丰富的调色板选择。你是更倾向于“薰衣草粉”还是“柠檬雪纺”风格？让我们一探究竟。\n\n*   能够使用 `color` 属性更改文本颜色。\n\
    *   了解网页浏览器支持的颜色名称。\n\n### 使用 `color` 属性为文本着色\n\n1.  每当你有一个包含文本的元素时，都可以使用 `color`\
    \ 属性更改文本颜色。\n2.  设置此属性值的最简单方法是使用颜色名称，如 “Red”（红色）、“Green”（绿色）或 “Blue”（蓝色）。\n\n\
    > 要进行更高级的着色，可以使用颜色代码——有关更多信息，请参阅第 38 页。\n\n**示例**\n如何更改文本颜色。\n\n```html\n<h3>我的一些老师：</h3>\n\
    <ul>\n  <li style=\"color: Brown;\">布朗先生</li>\n  <li style=\"color: Green;\">格林女士</li>\n\
    \  <li style=\"color: Pink;\">罗斯女士</li>\n  <li style=\"color: Red;\">雷德曼先生</li>\n\
    </ul>\n```\n\n我的一些老师：\n*   布朗先生\n*   格林女士\n*   罗斯女士\n*   雷德曼先生\n\n> 如果你没有设置颜色，你会得到一个默认颜色，它取决于用户的设置——在本书中，我们假设它是\
    \ “Black”（黑色）。\n\n`color` 属性是在每个 `<li>` 标签的 `style` 属性中设置的，以便为每个列表项赋予不同的颜色。\n\n\
    项目符号也被着色了。\n\n### 注意 “color” 的拼写\n\n**常见问题**\n如何不更改文本颜色。\n你需要使用美式拼写，所以应该是 “color”，不要带\
    \ “u”。\n`color` 属性没有正确设置，所以这段文本颜色没有改变。\n\n```html\n<li style=\"colour: Grey;\"\
    >格蕾女士</li>\n```\n\n*   格蕾女士\n\n### 大多数浏览器支持相同的颜色\n\n*   有超过一百种颜色名称是所有现代网页浏览器都认可的。\n\
    *   这意味着无论用户使用哪种浏览器，他们都会看到正确的颜色。\n\n> 这些是我最喜欢的颜色——更多颜色名称，请查看本节可下载文件中的 `ColourNames.txt`。\n\
    \n| HotPink | BlanchedAlmond | Honeydew | PowderBlue |\n|---|---|---|---|\n| FireBrick\
    \ | SandyBrown | SeaGreen | MidnightBlue |\n\n**哎呀，布兰奇·阿尔蒙德老师布置了超超超多作业……**\n如果你改变了一个元素的样式，它内部的内容也可能随之改变。例如，为\
    \ `<ul>` 添加 `color` 会影响所有的列表项——但你仍然可以为单个列表项添加不同的 `color`。\n\n## 背景颜色\n\n> **学习目标**\n\
    \n电影的精华在于背景中发生的故事——我这么说不仅是因为我还没演上大角色。无论如何，我对网页也有同样的感觉。\n\n*   能够使用 `background-color`\
    \ 属性填充背景。\n*   了解可以在一个元素上使用多个 CSS 属性。\n\n### 用 background-color 为背景着色\n\n你可以使用\
    \ `background-color` 属性为任何元素的背景着色。\n\n**示例** 填充两段段落文本的背景。\n\n你可以使用与 `color` 属性相同的所有颜色。\n\
    \n```html\n<p style=\"background-color: Yellow;\">CSS 程序员如何选择房子？</p>\n<p style=\"\
    background-color: LightGrey;\">通过比较属性值...</p>\n```\n\n**CSS 程序员如何选择房子？**\n\n通过比较属性值...\n\
    \n> 你可以将每个 HTML 元素想象成包含在一个盒子里——除非你更改了 `background-color` 或 `border-style` 等样式，否则它通常是不可见的。更多内容请参阅第\
    \ 47 页。\n\n### 将其添加到 `<body>` 以填充整个页面\n\n1.  如果你想用颜色填充整个页面，只需在 `<body>` 标签中设置\
    \ `background-color` 即可。\n2.  你仍然可以更改其他元素的 `background-color`，如果你希望它们有所不同。\n\n\
    **示例** 如何轻松一步填充整个页面。\n\n除非被更改，否则元素的背景是透明的，因此在 `<body>` 中设置 `background-color`\
    \ 的效果是填充整个页面...\n\n...除了这段斜体文本，因为 `<i>` 标签设置了它自己的 `background-color`。\n\n```html\n\
    <body style=\"background-color: LightBlue;\">\n    <h1>突发新闻：一切都是蓝色的！</h1>\n  \
    \  <p>除了\n        <i style=\"background-color: Orange;\">这个</i>。\n    </p>\n</body>\n\
    ```\n\n**突发新闻：一切都是蓝色的！**\n\n除了*这个*。\n\n### 你可以混合搭配样式属性\n\n如果你想使用多个样式属性，只需将它们一个接一个地放置。\n\
    \n```html\n<p style=\"background-color: Yellow; color: Red; border-style: dashed;\"\
    >\n    <b>注意：此代码运行时很烫！</b>\n</p>\n```\n\n> `color` 属性也会更改边框颜色，但你可以使用 `border-colour`\
    \ 属性单独设置它。\n\n> **嘘，过来——让我告诉你一个小秘密……**\n\n别忘了第 18 页的无障碍设计原则——如果你更改了 `color` 或\
    \ `background-color` 属性之一，请思考是否也需要更改另一个。\n"
