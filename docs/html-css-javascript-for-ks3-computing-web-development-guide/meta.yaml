    > Whoa, it's a double border |\n\n> ### border-style: eaten too much cheese;\n\
    \nThe colon (:) is always needed — it separates a CSS property from its value.\
    \ The semi-colon (;) is optional if you're only setting a single property, but\
    \ it's good practice to include it anyway."
