    console.log(oneToFive);\n```\n\n- 范围内的最小数字是 1。\n\n| 5 | 3 | 1 | 4 | 4 |\n\n输出可以是\
    \ 1 到 5 之间的任何数字。\n\n**Q1** 创建一个网页，要求用户猜测一个 10 到 40 之间的随机数。根据他们的答案给出适当的反馈消息。\n\n\
    ## ...以及随机颜色\n\n1) 颜色名称（见第 20 页）和十六进制代码（见第 38 页）并不是 CSS 中选择颜色的唯一方式。你还可以通过使用 rgb()\
    \ 分别指定红色、绿色和蓝色分量来选择颜色。\n2) 这些值代表构成最终颜色所使用的红色、绿色和蓝色（按此顺序）的量——它们的范围从 0 到 255。数字越大，使用的该颜色就越多。\n\
    \n```\ncolor: Indigo;\ncolor: #4B0082;\ncolor: rgb(75, 0, 130);\n```\n\n在 CSS\
    \ 中指定相同颜色的三种方式。\n\n靛蓝色（Indigo）由一点红色、没有绿色和大量的蓝色组成。\n\n**示例** 你可以将 Math 函数与 rgb()\
    \ 结合使用来生成随机颜色。\n\n每个颜色分量的值是随机生成的——每个都有 256 种可能的值，最小值为 0。\n\n```\nlet r = Math.floor(Math.random()\
    \ * 256);\nlet g = Math.floor(Math.random() * 256);\nlet b = Math.floor(Math.random()\
    \ * 256);\nlet colour = \"rgb(\" + r + \", \" + g + \", \" + b + \")\";\nlet body\
    \ = document.getElementById(\"body\");\nbody.style.backgroundColor = colour;\n\
    ```\n\n字符串被连接在一起（见第 54 页）以创建一个 rgb() 颜色值，例如 \"rgb(89, 212, 8)\"，然后将其分配为 `<body>`\
    \ 的背景颜色。\n\n这种颜色是 rgb(89, 212, 8)——它只是超过 1600 万种可能结果中的一种。\n\n要使此功能工作，需为 `<body>`\
    \ 元素赋予 body ID。\n\n**是的，我明白为什么他们选择了 rgb() 而不是 roygibv()...**\n\n红色、绿色和蓝色是光的三原色——它们混合在一起可以创造其他颜色。计算机显示器、手机屏幕等通过使用这\
    \ 3 种颜色的像素来显示图像。\n\n## 输入字段与表单\n\n什么？你想了解一个比 prompt() 更酷的替代方案？没问题，只需填写这张表格，您将在\
    \ 90 天内收到您的信息包。\n\n- 了解输入字段与 prompt() 的不同之处。\n- 能够使用 `<input>`、`<label>` 和 `<form>`\
    \ 标签来标记表单。\n- 能够使用 JavaScript 处理表单中的数据。\n\n## 输入字段允许用户输入数据\n\n1) Prompt() 是获取用户输入的一种简单方式（见第\
    \ 55 页），但它们会弹出独立于你网页的对话框，并且无法设置样式。\n2) 输入字段是获取用户输入的另一种方式——它们编码起来稍微复杂一些，但它们是你网页的一部分，可以设置样式以匹配它。\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_69_0.png)\n\n```\n<input> 标签创建一个输入字段。\n\
    Name: <input type=\"text\">\n这会创建一个用户可以输入的单行框。\n```\n\n你可以为 `<input>` 设置各种 type\
    \ 值。例如，radio 用于多选选项，checkbox 用于是/否输入（见第 68 页），password 用于隐藏输入（见下文），color 用于颜色选择器（见第\
    \ 38 页），date 则会弹出日历。\n\n## 使用标签以提高可访问性\n\n要正确配对这些元素，请为 `<input>` 标签添加一个 id 并将其赋值给\
