  md: "# Section Five — Style Sheets\n\n# Internal CSS\n\nLearning Objectives\nMixing\
    \ CSS with HTML can make for a chunky bowl of code soup and, much like this metaphor,\
    \ it gets harder to swallow the more you add to it — so, let's break it down.\n\
    - Understand the purpose of using internal CSS instead of inline CSS.\n- Be able\
    \ to use the <style> tag to mark up internal CSS.\n\n# The style attribute has\
    \ its drawbacks\n\nRemember, inline CSS is assigned to the style attribute of\
    \ a specific HTML element.\n\n1) Code can become hard to read and write if you've\
    \ got loads of inline CSS.\n2) The same code needs to be repeated to style different\
    \ things in the same way, and the content of your page can get lost in the surrounding\
    \ code — it can also take ages to style every tag individually.\n\nCOMMON PROBLEMS\n\
    How inline CSS can get repetitive.\nThe <h1> tags have the same style repeated\
    \ — as do the <p> tags.\n\n```\n<h1 style=\"color: Orange;\">Bad Food</h1>\n<p\
    \ style=\"font-family: Arial; color: Blue;\">Deep-fried celery</p>\n<h1 style=\"\
    color: Orange;\">Baddest Food</h1>\n<p style=\"font-family: Arial; color: Blue;\"\
    >Hot dogs</p>\n```\n\n**Bad Food**\nDeep-fried celery\n**Baddest Food**\nHot dogs\n\
    \n# Use <style> tags to add internal CSS\n\n- A style sheet is just a collection\
    \ of CSS rules used to style a web page.\n- Internal CSS is a style sheet marked\
    \ up by <style> tags in the <head> of a page.\n\nEXAMPLE\nRecreating the example\
    \ above using internal CSS.\n\n```\n<head>\n  <style>\n    h1 { color: Orange;\
    \ }\n    p {\n      font-family: Arial;\n      color: Blue;\n    }\n  </style>\n\
    </head>\n<body>\n  <h1>Bad Food</h1>\n  <p>Deep-fried celery</p>\n  <h1>Baddest\
    \ Food</h1>\n  <p>Hot dogs</p>\n</body>\n```\n\nInternal CSS goes between <style>\
    \ tags inside the <head> element.\nThe property/value pairs are the same as inline\
    \ CSS, but you don't need the quotes.\nBoth <h1> elements will have the same style\
    \ — as will both the <p> elements.\n\nEach tag you want styled needs to be named.\n\
    Curly braces { } must surround the styles for each tag. Just like with HTML, you\
    \ can use indentation and extra spacing to make CSS more readable.\nYou don't\
    \ need any inline CSS in the <body>, as the internal CSS is automatically applied.\n\
    \nKEY TERMS\nThe internal CSS marked up by the <style> tags is also known as an\
    \ internal style sheet.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_39_0.png)\n\
    \nThe web page created by this code looks exactly the same as the example above.\n\
    \nYou'll see how to give different styles to elements of the same type on p.45.\n\
    \n# I've internalised this — it's now living in my <head> rent-free...\n\nWhen\
    \ using internal CSS, you can still use inline CSS to style individual elements.\
    \ If the same property is set in both inline and internal CSS, then the inline\
    \ CSS will take priority (see p.40)."
