    \nQ2 Explain the main difference between a class and an ID.\n\n........................................................................................................\n\
    ........................................................................................................\n\
    \nQ3 Describe the two errors in the CSS code below.\n\n```css\n#main title {\n\
    \    text-decoration: underline;\n    margin-above: 5px;\n}\n```\n\n```html\n\
    <h1 id=\"main title\">Breaking News</h1>\n```\n\n1. ........................................................................................................\n\
    2. ........................................................................................................\n\
    \nQ4 Explain the difference between margins and padding.\n\n........................................................................................................\n\
    ........................................................................................................\n\
    ........................................................................................................\n\
    \nQ5 Sketch the web page created by the code below.\n\n```css\n.box {\n    border-style:\
    \ dashed;\n}\n#box1 {\n    width: 200px;\n    height: 200px;\n}\n#box2 {\n   \
    \ width: 150px;\n    height: 50px;\n}\n#box3 {\n    width: 50px;\n    height:\
    \ 100px;\n}\n```\n\n```html\n<div id=\"box1\" class=\"box\">\n    <div id=\"box2\"\
    \ class=\"box\"></div>\n    <div id=\"box3\" class=\"box\"></div>\n</div>\n```\n\
    \n## Coding Challenges for Section Six\n\nBefore you head off on a JavaScript\
    \ adventure, here's one last set of HTML & CSS challenges. Now say it with me,\
    \ \"Don't forget, you can visit cgpbooks.co.uk/biscuit to download example code\
    \ for each challenge.\"\n\n## Challenge 1 — Example\n\nRecreate the web page shown\
    \ on the right.\n\n```css\n#box {\n    width: 300px;\n    border-style: solid;\n\
    }\n#name {\n    text-align: center;\n    background-color: Yellow;\n    margin:\
    \ 0px;\n    padding: 5px;\n}\n```\n\n```css\n#photo {\n    display: block;\n \
    \   margin-top: 10px;\n    margin-bottom: 10px;\n    margin-left: auto;\n    margin-right:\
    \ auto;\n}\n```\n\n```html\n<div id=\"box\">\n    <h2 id=\"name\">Banana Custard</h2>\n\
    \    <img src=\"banana-custard.jpg\" id=\"photo\">\n    <p id=\"review\"><i>\"\
    It's absolutely vile.\"</i></p>\n</div>\n```\n\nYou could use classes instead\
    \ of IDs to allow your page to show multiple desserts.\n\n## Challenge 2\n\nCreate\
    \ a web page containing one or more of the following flags. Each flag should be\
    \ made using only `<div>` tags and CSS. They can be arranged horizontally or vertically.\n\
    \n## Challenge 3\n\nStylish Air has a 30% off special offer on flights to three\
    \ destinations: Oslo (Norway), Naples (Italy) and Lisbon (Portugal). They want\
    \ a website that can be used to promote these offers. The home page should mention\
    \ the offer and include this design:\n\nEach box on the home page should have\
    \ a link to a page about the destination.\n\nThe destination pages can be styled\
    \ the same way as each other, but they should each contain a photo of the destination\
    \ on the left, with a list of facts about the destination to the right of it.\n\
    \n## Section Seven — JavaScript Basics\n\n## Getting Started\n\n**Learning Objectives**\n\
    \nYou might have done some programming in languages like Python before. JavaScript\
    \ is another language, and it's perfect for doing funky stuff with web pages.\n\
    \n- Understand what JavaScript is and what it's used for.\n- Learn the difference\
    \ between static and dynamic web pages.\n- Be able to use the `<script>` tag to\
    \ mark up JavaScript.\n- Be able to use JavaScript to output a message to the\
    \ console.\n\n## JavaScript is a programming language\n\n1. A programming language\
    \ lets you control a computer by giving it instructions to follow.\n2. As HTML\
    \ and CSS only describe the structure and style of a web page, they aren't programming\
    \ languages.\n3. JavaScript is — it can be used to make all sorts of programs,\
    \ including desktop apps and games.\n4. Since most web browsers can run JavaScript,\
    \ it's commonly used on the Web — almost all websites use it in some way.\n\n\
    > You may have heard of Java™ — despite the similar name, Java™ and JavaScript\
    \ are different programming languages.\n\n## JavaScript creates dynamic web pages\n\
    \n- The web pages you've made so far have been mostly static.\n- Lots of real\
    \ web pages are dynamic and respond to the user's actions.\n- Using JavaScript\
    \ in combination with HTML and CSS, you can add interactivity to create dynamic\
    \ web pages of your own.\n\n## JavaScript runs in a web browser\n\nTo develop\
    \ with JavaScript, it's best to use a browser that has a console — e.g. Microsoft\
    \ Edge (Windows), the Safari web browser (macOS), or the Google Chrome web browser\
    \ (Windows, macOS and Linux).\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n\
    console.log(\"Hello, world!\");\n</script>\n</body>\n</html>\n```\n\nJavaScript\
    \ can be written within HTML using `<script>` tags.\nAll this HTML should be familiar,\
    \ except for this one line of JavaScript inside the `<script>` tags.\nAnything\
    \ within the quotes is output to the console.\n\nWhen you open this page in a\
    \ browser, you'll just see a blank page because the output of `console.log()`\
    \ is shown in the 'console'.\nTo see it, you need to open the console. In Chrome,\
    \ right click and select 'Inspect'.\nThen click 'Console' on this menu (you may\
    \ need to click '>>' to see this option).\n\n**I clicked on a static web page\
    \ once — it was shocking...**\nIf you already know other programming languages,\
    \ be careful you don't get the syntax mixed up with JavaScript — keep an eye on\
    \ where you're putting your brackets, quotes, semicolons, etc."
  mdcn: "\n## 高级定位\n\n**学习目标**\n这是本书中关于CSS的最后一部分。我知道，这段学习旅程非常精彩，结束也令人不舍，但我把一些最精彩的内容留到了最后。\n\
    \n- 能够使用`float`将图片与文本并排定位。\n- 能够使用`display: flex`将元素彼此并排定位。\n\n## float可以将图片与文本并排定位\n\
