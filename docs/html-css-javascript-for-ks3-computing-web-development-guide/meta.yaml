    \ target=\"_blank\">click here</a> to win another prize.</li>\n  </ol>\n</body>\n\
    ```\n\na) Where does the internal hyperlink take the user?\n\nb) If the hyperlink\
    \ in the second list item is clicked, what will happen?\n\nc) What is the role\
    \ of the target attribute in this code?\n\nd) Sketch the web page created by the\
    \ code (colouring optional).\n\nSection Four — Creating Multi-Page Websites\n\n\
    ### Practice Questions\n\n**Q4** a) Here are four possible values for `href` in\
    \ an `<a>` tag. Circle the option which is an absolute file path.\n\n- images/flying-squirrel.jpg\n\
