  - "[PAGE 47]\n\n# # Section Six — Advanced HTML & CSS\n\n# ## div Tags\n\n# ###\
    \ Learning Objectives\n\n<div> tags can help you make a fancy-pants web page with\
    \ all your HTML organised into nice neat sections — it's a win-win situation,\
    \ so read on.\n\n+   * Understand the purpose of the <div> tag.\n* Be able to\
    \ use the <div> tag to mark up the divisions of a web page.\n\n# # <div> is a\
    \ container for other tags\n\n+   1) Web pages often have a similar structure\
    \ that can be broken down into smaller pieces.\n2) These smaller pieces are called\
    \ divisions — they're usually blocks of related content.\n3) They can be marked\
    \ up using <div> tags.\n4) Divisions (or '<div>s') are useful because they:\n\
    \   * Help to keep your code more organised.\n   * Can be individually styled\
    \ (see p.46).\n\n| Section |\n|---|\n| Header |\n| Navigation Bar |\n| Main Content\
    \ |\n| Footer |\n\nE.g. name, logo, slogan/tagline, etc.\n\nE.g. copyright, contact\
    \ info, etc.\n\nHTML also has specific tags you could use for these divisions\
    \ — e.g. <header>, <nav>, <main> and <footer>. They can help things like search\
    \ engines to understand your page. We're using <div> tags in this section to keep\
    \ things simple.\n\n# ### EXAMPLE\n\nA typical web page with four divisions: header,\
    \ navigation bar, main content and footer. This is the header division. Each of\
    \ these four divisions is marked up using <div> tags.\n\n```\n<div style=\"background-color:\
    \ Yellow; text-align: center;\">\n  <h1>Alien Watch!</h1>\n</div>\n<!-- The navigation\
    \ bar division. -->\n<div style=\"border-style: solid;\">\n  <ul>\n    <li><a\
    \ href=\"#\">Home</a></li>\n    <li><a href=\"#\">Aliens</a></li>\n    <li><a\
    \ href=\"#\">Evidence</a></li>\n  </ul>\n</div>\n<!-- The main content division.\
    \ -->\n<div style=\"font-family: Arial, sans-serif;\">\n  <p>I've learnt the truth.</p>\n\
    \  <p>Their secrets will be revealed.</p>\n</div>\n<!-- The footer division. -->\n\
    <div style=\"font-size: 75%; text-align: center;\">\n  <p>&copy; <i>Alien Watcher</i>\
    \ 2023</p>\n</div>\n```\n\nNot shown: the navigation bar is styled using the style\
    \ sheet on p.41.\n\nSpecial symbols can be inserted using codes like this in HTML\
    \ — a web browser will replace &copy; with © (the copyright symbol).\n\nEach division\
    \ is given its own distinct styling using inline CSS.\n\n+   5) Inline CSS has\
    \ been used to style divisions in the example above. If you want to use internal\
    \ or external CSS instead, then you need a way to style each <div> tag separately\
    \ — the next page shows you how to do this.\n\nQ1 From the code files for this\
    \ section, open the page ‘divTags-Q1.html’ in your web browser. Describe the structure\
    \ of the page in terms of the divisions you see.\n\n# ## I love how you've coded\
    \ your page — it's absolutely <div>-ine...\n\nThere's no hard and fast rules about\
    \ how <div> tags should be used. Things can be broken down even further, with\
    \ divisions inside divisions — it often depends on how things need to be styled."
- md: "## Classes and IDs\n\n### Learning Objectives\n\nPin-pointing particular elements\
    \ is necessary if you want to style them from a style sheet — the boffins at HTML\
    \ HQ invented classes and IDs for this purpose.\n\n- Be able to use both **classes**\
    \ and **IDs** to **style** your web pages.\n- Understand the **difference** between\
    \ **classes** and **IDs**.\n\n## Classes are **named collections** of elements\n\
    \n1. So far, your **style sheets** have had a **limitation** — e.g. the code on\
    \ the right styles `<p>` **elements**, but it styles **every one** of them in\
    \ **the same way**.\n2. You don't always want **every paragraph** looking the\
    \ same, so in order to style just **some of them**, you need to use a **class**.\n\
    \n```\np {\n    font-size: 150%;\n    color: Blue;\n}\n```\n\n## **EXAMPLE**\n\
    \nYou can style all elements in the same class in one go.\n\nIn the style sheet:\n\
    \nInstead of writing a tag (like 'p'), write a full stop followed by the class\
    \ name — you choose it yourself.\n\n```\n.question {\n    font-size: 150%;\n \
    \   color: Blue;\n}\n```\n\n> **COMMON PROBLEMS**\n\nClass names can't contain\
    \ spaces, so it's common practice to use lowercase words joined with hyphens if\
    \ a single word isn't descriptive enough.\n\nIn the `<body>`:\n\nTo assign your\
    \ class to an element, add the class attribute to its tag and set its value to\
    \ your class name (without a full stop).\n\n```\n<p>Knock knock...</p>\n<p class=\"\
    question\">Who's there?</p>\n<p>HTML...</p>\n<p class=\"question\">HTML who?</p>\n\
    <p>HTMLMAO!</p>\n```\n\nKnock knock...\n**Who's there?**\nHTML...\n**HTML who?**\n\
    HTMLMAO!\n\n> Only these paragraphs are **styled**, as they're in the **question**\
    \ class.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_48_0.png)\n\n## Classes can\
    \ contain **different types** of elements\n\nIn the example above, **only** `<p>`\
    \ **elements belonged to the** question **class**, but a class can actually include\
    \ **any type of element** whatsoever.\n\n```\n<h1 class=\"question\">Feeling blue?</h1>\n\
    <p class=\"question\">Like to laugh?</p>\n<p>Join us at Joke club - Mondays 12am-1am,\
    \ by the bins.</p>\n```\n\n**Feeling blue?**\n**Like to laugh?**\nJoin us at Joke\
    \ club - Mondays 12am-1am, by the bins.\n\n> Both the **heading** and this **paragraph**\
    \ are styled using the **question** class.\nThe heading is **bold** as that's\
    \ a part of the **default style** for `<h1>` tags which **isn't** **changed**\
    \ in the style rules for the **question** class.\n\n## Elements can **belong**\
    \ to **multiple classes**\n\n- You can have **as many classes** in your style\
    \ sheet **as you need** — here's another.\n- You can put an element into **more\
    \ than one** class — just write the class names **separated by spaces**.\n\n```\n\
    .important { text-decoration: underline; }\n```\n\n```\n<p class=\"question important\"\
    >Can you bring cake?</p>\n```\n\n**Can you bring cake?**\n\nA space. **Both**\
    \ question **and** important styles are applied.\n\n## Classes and IDs\n\n###\
    \ IDs are unique to one element\n\nIDs are **similar to** classes, but used with\
    \ a **single element** only.\n\n```\n#gold-medal {\n    background-color: Gold;\n\
    \    width: 200px;\n}\n```\n\nIDs are used for more than just styling. For really\
    \ long web pages, you can add them to the end of hyperlinks, for example, `'index.html#eggs'`,\
    \ and a web browser will automatically scroll down the page to the place where\
    \ the element with the eggs ID is found.\n\nIf you give multiple elements the\
    \ same ID, you may not see any issues right away, but it'll cause problems once\
    \ you start using JavaScript — so stick to one element per ID.\n\nTo **assign\
    \ your ID** to an **element**, add the **id attribute** and set its **value**\
    \ to your **ID name** (without the hash).\n\nIn the `<body>`:\n\n```\n<h1>Tourney\
    \ Results</h1>\n<ol>\n    <li id=\"gold-medal\">Sir Slaysalot</li>\n    <li>Biscuit\
    \ 'Honey' Badger</li>\n    <li>Bill Shoesbury</li>\n</ol>\n```\n\n### Tourney\
    \ Results\n\n1. **Sir Slaysalot**\n2. Biscuit 'Honey' Badger\n3. Bill Shoesbury.\n\
    \nYou can't list multiples IDs like you can with classes. But every element can\
    \ have both an ID and one or more classes.\n\n**Q1** Extend the example above\
    \ to add silver and bronze medal IDs, with appropriate styles, to the second and\
    \ third list items.\n\n### Classes and IDs are great for styling `<div>`s\n\n\
    **EXAMPLE** Styling `<div>`s with classes and IDs.\nfact is a class, so more facts\
    \ with the same style can be added to this page in their own `<div>` later.\n\n\
    ```\n.fact {\n    background-color: Beige;\n    color: Green;\n}\n#fact-of-the-day\
    \ {\n    background-color: Green;\n    color: Beige;\n}\n#fact-of-the-day h3 {\n\
    \    color: Gold;\n}\n```\n\nWriting the ID **before** `h3` means `color: Gold;`\
    \ only applies to `<h3>` elements that are **inside the element** with **that\
    \ ID**.\n\n```\n<div class=\"fact\">\n    <h3>Cone you believe it?</h3>\n    <p>The\
    \ most popular ice cream flavour is vanilla!</p>\n</div>\n```\n\nfact-of-the-day\
    \ is an ID, so it should only be used with one element.\n\n```\n<div id=\"fact-of-the-day\"\
    >\n    <h3>It's snow joke...</h3>\n    <p>The UK's coldest ever day was -27.2\
    \ °C.</p>\n</div>\n```\n\nCone you believe it?\nThe most popular ice cream flavour\
    \ is vanilla!\nIt's snow joke...\nThe UK's coldest ever day was -27.2 °C.\n\n\
    **Q2** Modify the example above to add a `<div>` that surrounds both `<div>`s.\
    \ Style it to change the font for both facts at the same time.\n\n**Q3** Restyle\
    \ the example on p.44 using a style sheet with an ID for each of the four divisions.\n\
    \n### IDig your style — you're a class act...\n\nA tag can belong to a class and\
    \ have an ID at the same time — in this case, if the class and ID both try to\
    \ style a particular property in different ways, then the ID's style will be the\
    \ one used. ID deal.\n\n## Margins and Padding\n\nLearning Objectives: These next\
    \ couple of pages are all about the empty space that separates the bits and pieces\
    \ on a web page. Without it, elements would be bumping together like dodgems.\n\
    \n- Learn about margins and how to change them.\n- Learn about padding and how\
    \ to change it.\n\n## Margins are the spaces around an element\n\n1. Every HTML\
    \ element has a margin — it's the empty space that surrounds it.\n2. For example,\
    \ a paragraph of text, marked up by `<p>` tags, is usually displayed with margins\
    \ above and below that are roughly the size of single line of text.\n3. Margins\
    \ are outside an element's borders — making borders visible can help you see where\
    \ all the margins are.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_50_0.png)\n\
    \n> Have a look back at p.19 for a recap on the border-style property.\n\n```\n\
    .box { border-style: solid; }\n```\n\n```\n<body class=\"box\">\n  <h1 class=\"\
    box\">Dessert Menu</h1>\n  <p class=\"box\">Chocolate Pudding</p>\n  <p class=\"\
    box\">\n    \"It tasted better coming back up.\"\n  </p>\n</body>\n```\n\n> Border\
    \ styles are properties that have to be added to each element individually — they\
    \ won't be inherited from styles applied to `<body>`.\n\n## You can resize margins\n\
    \n- Changing the size of margins is one way you can control the position of elements.\n\
    - There are margins on all four sides of an element: top (above), right, bottom\
    \ (below) and left.\n- They each have CSS properties: margin-top, margin-right,\
    \ margin-bottom and margin-left.\n\n```\n#choc-pud {\n  background-color: Chocolate;\n\
    \  margin-bottom: 0px;\n}\n#choc-pud-review {\n  background-color: Khaki;\n  margin-top:\
    \ 0px;\n  margin-left: 30px;\n}\n```\n\n```\n<p id=\"choc-pud\" class=\"box\"\
    >\nChocolate Pudding\n</p>\n<p id=\"choc-pud-review\" class=\"box\">\n\"It tasted\
    \ better coming back up.\"\n</p>\n```\n\n> The gap between the elements is removed\
    \ by setting the margin below one element and above the other to 0 pixels.\n\n\
    > 30 pixels of space is added to the left-hand side, moving the paragraph to the\
    \ right.\n\n- If you want to set all four margins to the same size, you can use\
    \ the margin property — e.g. margin: 0px; removes all margins.\n\n## Margins and\
    \ Padding\n\n### Padding is the space inside an element\n\n1. **Padding** is similar\
    \ to margins, but it's the space inside an element's borders.\n2. Most elements\
    \ have no padding by default, so you have to add it to see the effect.\n3. **Use\
    \ the** padding property to do this — there's also -top, -right, -bottom **and**\
    \ -left variants.\n\n**EXAMPLE** Continuing the previous example by adding padding\
    \ to make things look more spacious.\n\n```\n#choc-pud {\n  background-color:\
    \ Chocolate;\n  margin-bottom: 0px;\n  padding: 10px;\n}\n#choc-pud-review {\n\
    \  background-color: Khaki;\n  margin-top: 0px;\n  margin-left: 30px;\n  padding-left:\
    \ 20px;\n}\n```\n\n```\n<p id=\"choc-pud\" class=\"box\">Chocolate Pudding</p>\n\
    <p id=\"choc-pud-review\" class=\"box\">\"It tasted better coming back up.\"</p>\n\
    ```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_51_0.png)\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_51_1.png)\n\
    \nThis text now has padding around it on all sides.\n\nThere's padding on the\
    \ left-hand side of this text, but none on the top and bottom.\n\n> **GOING FURTHER**\
    \ You can give multiple values for padding and margin at once. E.g. giving four\
    \ values (separated by spaces) will set them in the order top, right, bottom,\
    \ left.\n\n> There's also no padding on the right, but unless you set the width,\
    \ the paragraph will still fill the whole page.\n\n### auto will distribute margins\
    \ for you\n\nYou can reposition most elements relative to the web page by setting\
    \ certain margin properties to 'auto' — **this value tells CSS to** calculate\
    \ the size **for you.**\n\n> This is a better way to align an image when it isn't\
    \ within a block of text — instead of using the text-align property like on p.24.\n\
    \n```\n#choc-pud-image {\n  margin-left: auto;\n  margin-right: auto;\n  display:\
    \ block;\n}\n```\n\n```\n<img src=\"choc-pud.jpg\" id=\"choc-pud-image\">\n```\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_51_2.png)\n\n> The **auto** property\
    \ lets web pages look consistent on different devices — even if they have different\
    \ screen sizes.\n\nTo change the margins of an image, set the display property\
    \ to 'block'.\n\nIf both left and right margins are set to 'auto', then they'll\
    \ be the same size — half of the space available. This positions the element centrally.\n\
    \n```\n#choc-pud-image {\n  margin-left: auto;\n  margin-right: 0px;\n  display:\
    \ block;\n}\n```\n\n```\n<img src=\"choc-pud.jpg\" id=\"choc-pud-image\">\n```\n\
    \nA margin set to auto will fill the space if the opposite margin is zero — this\
    \ positions the element on one side of the page.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_51_3.png)\n\
    \nThe right margin is zero, so the image ends up on the right-hand side.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_51_4.png)\n\
    \n**Oh it's padding, with an a — sorry, I've got pudding for brains...**\nRemember,\
    \ margins are outside the border and padding is inside the border. Quite often\
    \ the border is invisible, but you can temporarily set a border-style if you need\
    \ to see where it is."
  mdcn: "\n## 类与ID\n\n### 学习目标\n\n若要通过样式表为特定元素设计样式，就必须精确定位这些元素——HTML总部的专家们为此发明了**类**和**ID**。\n\
    \n- 能够同时使用**类**和**ID**为网页**添加样式**。\n- 理解**类**和**ID**之间的**区别**。\n\n## 类是元素的**命名集合**\n\
    \n1.  目前为止，你的**样式表**一直存在**局限性**——例如，右侧代码虽然为`<p>`**元素**添加了样式，但它以**完全相同的方式**应用于**每一个**`<p>`元素。\n\
    2.  你并不希望**每个段落**看起来都一模一样，因此，若只想为**部分段落**添加样式，就需要使用**类**。\n\n```\np {\n    font-size:\
    \ 150%;\n    color: Blue;\n}\n```\n\n## **示例**\n\n你可以一次性为同一类的所有元素添加样式。\n\n在样式表中：\n\
    \n不要写标签名（如'p'），而是写一个点（.）后跟类名——类名由你自行选择。\n\n```\n.question {\n    font-size: 150%;\n\
    \    color: Blue;\n}\n```\n\n> **常见问题**\n\n类名不能包含空格，因此当单个单词描述性不足时，通常的做法是使用小写单词并用连字符连接。\n\
    \n在`<body>`中：\n\n要将类分配给某个元素，需在其标签中添加`class`属性，并将其值设置为你的类名（不加点）。\n\n```\n<p>Knock\
    \ knock...</p>\n<p class=\"question\">Who's there?</p>\n<p>HTML...</p>\n<p class=\"\
    question\">HTML who?</p>\n<p>HTMLMAO!</p>\n```\n\nKnock knock...\n**Who's there?**\n\
    HTML...\n**HTML who?**\nHTMLMAO!\n\n> 只有这些段落被**添加了样式**，因为它们属于**question**类。\n\n\
    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_48_0.png)\n\n## 类可以包含**不同类型的**元素\n\n\
    在上面的例子中，**只有**`<p>`**元素属于**question**类**，但实际上，一个类可以包含**任何类型**的元素。\n\n```\n<h1\
    \ class=\"question\">Feeling blue?</h1>\n<p class=\"question\">Like to laugh?</p>\n\
    <p>Join us at Joke club - Mondays 12am-1am, by the bins.</p>\n```\n\n**Feeling\
    \ blue?**\n**Like to laugh?**\nJoin us at Joke club - Mondays 12am-1am, by the\
    \ bins.\n\n> 这个**标题**和这段**文字**都使用了**question**类进行样式设置。\n标题是**粗体**，因为这是`<h1>`标签的**默认样式**的一部分，而在**question**类的样式规则中**并未改变**这一点。\n\
    \n## 元素可以**同时属于多个类**\n\n- 你可以在样式表中根据需要创建**任意数量的类**——这是另一个例子。\n- 你可以将一个元素放入**不止一个**类——只需将类名用**空格隔开**即可。\n\
    \n```\n.important { text-decoration: underline; }\n```\n\n```\n<p class=\"question\
    \ important\">Can you bring cake?</p>\n```\n\n**Can you bring cake?**\n\n一个空格。**question**和**important**的样式都会被应用。\n\
    \n## 类与ID\n\n### ID对于一个元素是唯一的\n\nID与类**相似**，但仅用于**单个元素**。\n\n```\n#gold-medal\
    \ {\n    background-color: Gold;\n    width: 200px;\n}\n```\n\nID不仅用于样式设计。对于非常长的网页，你可以将它们添加到超链接的末尾，例如`'index.html#eggs'`，网页浏览器会自动向下滚动到页面中带有eggs\
    \ ID的元素位置。\n\n如果你为多个元素指定了相同的ID，一开始可能不会看到任何问题，但当你开始使用JavaScript时，就会引发问题——因此请坚持每个ID只对应一个元素。\n\
    \n要将**ID分配**给**某个元素**，需添加**id属性**并将其**值**设置为你的**ID名称**（不包含井号）。\n\n在`<body>`中：\n\
    \n```\n<h1>Tourney Results</h1>\n<ol>\n    <li id=\"gold-medal\">Sir Slaysalot</li>\n\
    \    <li>Biscuit 'Honey' Badger</li>\n    <li>Bill Shoesbury</li>\n</ol>\n```\n\
    \n### 锦标赛结果\n\n1. **Sir Slaysalot**\n2. Biscuit 'Honey' Badger\n3. Bill Shoesbury.\n\
    \n你不能像使用类那样为多个元素指定相同的ID。但每个元素都可以同时拥有一个ID和一个或多个类。\n\n**问题1** 扩展上面的示例，为第二和第三个列表项添加银牌和铜牌ID，并设置相应的样式。\n\
    \n### 类与ID非常适合为`<div>`添加样式\n\n**示例** 使用类和ID为`<div>`添加样式。\nfact是一个类，因此稍后可以使用自己的`<div>`将更多具有相同样式的事实添加到此页面中。\n\
    \n```\n.fact {\n    background-color: Beige;\n    color: Green;\n}\n#fact-of-the-day\
    \ {\n    background-color: Green;\n    color: Beige;\n}\n#fact-of-the-day h3 {\n\
    \    color: Gold;\n}\n```\n\n将ID写在`h3`**之前**意味着`color: Gold;`仅应用于**带有该ID的元素内部**的`<h3>`元素。\n\
    \n```\n<div class=\"fact\">\n    <h3>Cone you believe it?</h3>\n    <p>The most\
    \ popular ice cream flavour is vanilla!</p>\n</div>\n```\n\nfact-of-the-day是一个ID，因此它应该只用于一个元素。\n\
    \n```\n<div id=\"fact-of-the-day\">\n    <h3>It's snow joke...</h3>\n    <p>The\
    \ UK's coldest ever day was -27.2 °C.</p>\n</div>\n```\n\nCone you believe it?\n\
    The most popular ice cream flavour is vanilla!\nIt's snow joke...\nThe UK's coldest\
    \ ever day was -27.2 °C.\n\n**问题2** 修改上面的示例，添加一个同时包含两个`<div>`的`<div>`。为其添加样式，以便同时更改两个事实的字体。\n\
    \n**问题3** 使用样式表（为第44页的四个部分各分配一个ID）重新设计该页面的示例。\n\n### 我欣赏你的风格——你真是个有“类”的人...\n\n\
    一个标签可以同时属于一个类并拥有一个ID——在这种情况下，如果类和ID都试图以不同方式设置某个特定属性的样式，那么ID的样式将被优先采用。这就叫ID优先。\n\
    \n## 外边距与内边距\n\n学习目标：接下来的几页将讨论网页上各个部分之间的空白区域。没有它，元素就会像碰碰车一样相互碰撞。\n\n- 了解外边距以及如何改变它们。\n\
    - 了解内边距以及如何改变它。\n\n## 外边距是元素周围的空间\n\n1.  每个HTML元素都有外边距——它是环绕元素的空白区域。\n2.  例如，由`<p>`标签标记的一段文本，通常显示时其上方和下方会有大致相当于一行文本大小的外边距。\n\
    3.  外边距位于元素边框的**之外**——使边框可见有助于你查看所有外边距的位置。\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_50_0.png)\n\
    \n> 请回顾第19页关于`border-style`属性的复习。\n\n```\n.box { border-style: solid; }\n```\n\
    \n```\n<body class=\"box\">\n  <h1 class=\"box\">Dessert Menu</h1>\n  <p class=\"\
    box\">Chocolate Pudding</p>\n  <p class=\"box\">\n    \"It tasted better coming\
    \ back up.\"\n  </p>\n</body>\n```\n\n> 边框样式是必须逐个添加到每个元素的属性——它们不会从应用于`<body>`的样式中继承。\n\
    \n## 你可以调整外边距的大小\n\n- 改变外边距的大小是控制元素位置的一种方式。\n- 元素四边都有外边距：上（上方）、右、下（下方）和左。\n- 它们各有对应的CSS属性：`margin-top`、`margin-right`、`margin-bottom`和`margin-left`。\n\
    \n```\n#choc-pud {\n  background-color: Chocolate;\n  margin-bottom: 0px;\n}\n\
    #choc-pud-review {\n  background-color: Khaki;\n  margin-top: 0px;\n  margin-left:\
    \ 30px;\n}\n```\n\n```\n<p id=\"choc-pud\" class=\"box\">\nChocolate Pudding\n\
    </p>\n<p id=\"choc-pud-review\" class=\"box\">\n\"It tasted better coming back\
    \ up.\"\n</p>\n```\n\n> 通过将一个元素下方的外边距和另一个元素上方的外边距都设置为0像素，可以移除元素之间的间隙。\n\n> 在左侧增加了30像素的空间，将段落向右移动。\n\
    \n- 如果你想将所有四个外边距设置为相同的大小，可以使用`margin`属性——例如，`margin: 0px;`会移除所有外边距。\n\n## 外边距与内边距\n\
    \n### 内边距是元素内部的空间\n\n1.  **内边距**类似于外边距，但它是元素边框**内部**的空间。\n2.  大多数元素默认没有内边距，因此你必须添加它才能看到效果。\n\
    3.  使用**`padding`属性**来实现这一点——还有`-top`、`-right`、`-bottom`和`-left`变体。\n\n**示例**\
    \ 延续前面的示例，添加内边距使内容看起来更宽敞。\n\n```\n#choc-pud {\n  background-color: Chocolate;\n\
    \  margin-bottom: 0px;\n  padding: 10px;\n}\n#choc-pud-review {\n  background-color:\
    \ Khaki;\n  margin-top: 0px;\n  margin-left: 30px;\n  padding-left: 20px;\n}\n\
    ```\n\n```\n<p id=\"choc-pud\" class=\"box\">Chocolate Pudding</p>\n<p id=\"choc-pud-review\"\
    \ class=\"box\">\"It tasted better coming back up.\"</p>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_51_0.png)\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_51_1.png)\n\n这段文本现在四周都有内边距。\n\n这段文本左侧有内边距，但顶部和底部没有。\n\
    \n> **进一步说明** 你可以一次性为`padding`和`margin`提供多个值。例如，提供四个值（用空格隔开）将按上、右、下、左的顺序进行设置。\n\
    \n> 右侧也没有内边距，但除非你设置了宽度，否则段落仍将填满整个页面宽度。\n\n### `auto`会为你分配外边距\n\n你可以通过将某些外边距属性设置为'auto'来相对于网页重新定位大多数元素——**这个值告诉CSS为你计算大小**。\n\
    \n> 这是在图像不在文本块内时对其居中对齐的更好方法——而不是像第24页那样使用`text-align`属性。\n\n```\n#choc-pud-image\
    \ {\n  margin-left: auto;\n  margin-right: auto;\n  display: block;\n}\n```\n\n\
    ```\n<img src=\"choc-pud.jpg\" id=\"choc-pud-image\">\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_51_2.png)\n\
    \n> **auto**属性使网页在不同设备上看起来一致——即使它们的屏幕尺寸不同。\n\n要更改图像的外边距，需将`display`属性设置为'block'。\n\
    \n如果左和右外边距都设置为'auto'，那么它们的大小将相同——占可用空间的一半。这会使元素居中定位。\n\n```\n#choc-pud-image {\n\
    \  margin-left: auto;\n  margin-right: 0px;\n  display: block;\n}\n```\n\n```\n\
    <img src=\"choc-pud.jpg\" id=\"choc-pud-image\">\n```\n\n如果相对的外边距为零，那么设置为auto的外边距将填满可用空间——这会使元素位于页面的一侧。\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_51_3.png)\n\n右外边距为零，因此图像最终位于右侧。\n\n\
    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_51_4.png)\n\n**哦，是内边距，带个“内”字——抱歉，我脑子像布丁一样糊了...**\n\
    记住，外边距在边框之外，内边距在边框之内。通常边框是不可见的，但如果需要查看其位置，可以临时设置一个`border-style`。\n"
