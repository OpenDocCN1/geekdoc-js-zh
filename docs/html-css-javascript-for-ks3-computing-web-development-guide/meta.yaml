  md: '# # What is the Internet?


    **Learning Objectives**


    Without the Internet, your web pages will be collecting digital dust in your local
    documents folder. Here are some of the nerdy details you may not already know.


    * Understand what [the Internet](https://en.wikipedia.org/wiki/Internet) is.

    * Learn about why [routers](https://en.wikipedia.org/wiki/Router_(computing))
    and [servers](https://en.wikipedia.org/wiki/Server_(computing)) are important
    network devices.

    * Understand what [domain names](https://en.wikipedia.org/wiki/Domain_name) and
    [URLs](https://en.wikipedia.org/wiki/URL) are.


    # ## The Internet is just a HUGE network


    1. The Internet is a global [network of networks](https://en.wikipedia.org/wiki/Network_of_networks).

    2. People use it every day to do all sorts of things — e.g. [viewing web pages](https://en.wikipedia.org/wiki/Web_page),
    [sending emails](https://en.wikipedia.org/wiki/Email), using [social media](https://en.wikipedia.org/wiki/Social_media)
    and [playing online games](https://en.wikipedia.org/wiki/Online_game).


    The Internet is a WAN (wide area network) that connects LANs (local area networks)
    together.


    # ## Data is passed around by routers


    +   * Devices [connect](https://en.wikipedia.org/wiki/Internet_access) to the
    Internet (wired or wirelessly) through [routers](https://en.wikipedia.org/wiki/Router_(computing)).

    * [Routers](https://en.wikipedia.org/wiki/Router_(computing)) control the [sending
    and receiving](https://en.wikipedia.org/wiki/Packet_switching) of [data](https://en.wikipedia.org/wiki/Data)
    between networks.

    * They use [IP addresses](https://en.wikipedia.org/wiki/IP_address) to figure
    out [where to send](https://en.wikipedia.org/wiki/Routing) the data to. IP addresses
    are [unique numbers](https://en.wikipedia.org/wiki/Internet_Protocol_version_4)
    (like 192.0.2.255) given to all devices [connected](https://en.wikipedia.org/wiki/Network_interface_controller)
    on a network.


    ![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_6_0.png)


    # ## Domain names make it easier to contact a server


    1. A [server](https://en.wikipedia.org/wiki/Server_(computing)) is a computer
    that [provides information](https://en.wikipedia.org/wiki/Web_server) or [does
    a job](https://en.wikipedia.org/wiki/Server_(computing)) for other devices on
    a network. For example, a [web server](https://en.wikipedia.org/wiki/Web_server)
    sends you [web pages](https://en.wikipedia.org/wiki/Web_page) when you browse
    a website.

    2. Devices [access servers](https://en.wikipedia.org/wiki/Internet_access) over
    the Internet using their [IP addresses](https://en.wikipedia.org/wiki/IP_address),
    but it''s much [easier for people](https://en.wikipedia.org/wiki/Domain_Name_System)
    to use a [domain name](https://en.wikipedia.org/wiki/Domain_name) instead, like
    cgpbooks.co.uk.

    3. To ask for a [specific resource](https://en.wikipedia.org/wiki/URL) from a
    web server, you use a [URL](https://en.wikipedia.org/wiki/URL) (Uniform Resource
    Locator) — usually called a [web address](https://en.wikipedia.org/wiki/URL).


    A **domain name** is a name linked to an IP address.

    A system called the **Domain Name System (DNS)** converts domain names to IP addresses.


    There''s a lot more info about the Web on the next page.


    > **EXAMPLE**

    The different parts of a URL.


    `https://www.cgpbooks.co.uk/biscuit`


    ![URL Breakdown](https://example.com/url-breakdown.png)


    The [domain name](https://en.wikipedia.org/wiki/Domain_name). The path to a specific
    resource — usually a [web page](https://en.wikipedia.org/wiki/Web_page) or a [file](https://en.wikipedia.org/wiki/Computer_file).


    URLs can include ''http'' or ''https''.

    The ''s'' means that encryption will be used for secure communication.

    If you don''t type either yourself, one of them will be inserted — it''s usually
    ''https'' when the website supports it.


    ## Doesn''t matter where you''re from, URL welcome here...


    The Internet has been a game-changer for global communication. Without it, you''d
    only be able to access things in a small, local network. Now, you can send selfies
    across the globe in seconds.'
  merge: -1
