  md: "# Styling Hyperlinks\n\n+   **Learning Objectives**\n* Links are how people\
    \ navigate around your website, so you don't want them to be missed — here are\
    \ a few tricks to make your links stand out using internal CSS.\n* Understand\
    \ the difference between visited and unvisited links.\n* Be able to use a, a:link\
    \ and a:visited to change the style of links.\n\n# Links can be visited or unvisited\n\
    \n1) As you saw in Section 4, hyperlinks are created using the <a> tag.\n2) An\
    \ unvisited link is a hyperlink to a web page you haven't been to before. By default,\
    \ with no CSS applied, these are coloured blue and underlined.\n3) Once the linked\
    \ web page has been visited, the link will turn purple.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_40_0.png)\n\
    \n# Use internal CSS to style links\n\n+   * You can use a to apply styles to\
    \ all links — whether they're visited or not.\n* You can use a:link to style unvisited\
    \ links and a:visited to style visited links.\n\n```\n<head>\n<style>\n    a {\n\
    \        font-size: 20px;\n    }\n    a:link {\n        color: DodgerBlue;\n \
    \       text-decoration-color: Navy;\n    }\n    a:visited {\n        color: DarkOrange;\n\
    \        text-decoration-color: Red;\n    }\n</style>\n</head>\n<body>\n    <a\
    \ href=\"https://www.ordnancesurvey.co.uk\">Click me</a>\n</body>\n```\n\n**EXAMPLE**\n\
    It's best practice to style links in this order: a, a:link and then a:visited.\n\
    \nThe font for all links will have a size of 20 pixels.\n\nHere's how the link\
    \ looks before it's been visited. [Click me]\n\nThis property sets the colour\
    \ of any 'decoration' the text has — for links, it's usually an underline.\n\n\
    Here's how the link looks after it's been visited. [Click me]\n\nIf this URL is\
    \ already in your web browser's history, it will count as visited — so change\
    \ this to somewhere that you've never been to if you want to see the unvisited\
    \ style applied.\n\n+   * The text-decoration property can also be used to style\
    \ links — it can have the values: underline, overline, line-through and none.\n\
    \n+   **Q1** Write the internal CSS that styles links like this:\nUnvisited [Click\
    \ me]\nVisited [Click me]\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_40_1.png)\n\
    \nFor security reasons, most web browsers limit which properties you're allowed\
    \ to change for a:visited. If you find you can't style a visited link in a certain\
    \ way, then it may be disallowed.\n\na:link and a:visited are examples of 'pseudo-classes'\
    \ in CSS. Another is a:hover (see p.41) and there's also a:active which is used\
    \ to style a link at the moment it's clicked.\n\n> **CSS prank: swap the default\
    \ blue and purple colours of links...**\n...but seriously, don't forget the accessible\
    \ design principles from p.18 — your links should be easy to read, and they should\
    \ look different to other bits of text so people can see they're there."
  merge: -1
  pgno: 40
