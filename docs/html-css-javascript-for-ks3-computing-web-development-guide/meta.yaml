    \n## 第三节编码挑战\n\n到现在，你应该比巴黎时装周更有型了，所以为什么不试试这些挑战呢？\n别忘了，你可以访问 [cgpbooks.co.uk/biscuit](http://cgpbooks.co.uk/biscuit)\
    \ 下载每个挑战的[示例代码](http://example.com)。\n\n## 挑战 1 — 示例\n\n一家[旅游公司](http://tour-guide)希望你为他们设计一个网页。他们行程中的一个站点是巴黎的[埃菲尔铁塔](http://eiffel-tower)。\n\
    \n> 别忘了——这些页面上的示例代码没有显示完整的标准结构（参见第 9 页）。\n\n该页面应具有以下特点：\n\n- [浅灰色背景](http://light-grey)。\n\
    - [居中](http://centre)放置的[埃菲尔铁塔照片](http://photo)，[高度](http://height)为 [200 像素](http://200px)。\n\
    - 图片下方是文本“[埃菲尔铁塔，巴黎](http://eiffel-tower-paris)”，使用[衬线字体](http://serif-font)。\n\
    \n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_29_0.png)\n\n## 解决方案\n\n计划：找到一张埃菲尔铁塔的照片，并将其保存在与\
    \ .html 文件相同的文件夹中，然后使用 CSS 设置背景、字体和定位样式。\n\n1. 在 `<body>` 标签中将 `background-color`\
    \ 属性设置为 `LightGrey`，使其应用于整个页面。\n2. 将 `font-family` 属性设置为衬线字体，并包含通用的 serif 字体族，以防网页浏览器无法使用你选择的字体。\n\
    3. 使用 `text-align` 属性将所有内容定位在页面的中心。\n\n```\n<body style=\"background-color: LightGrey;\"\
    >\n    <p style=\"font-family: 'Times New Roman', serif; text-align: center;\"\
    >\n        <img src=\"eiffel-tower.jpg\" height=\"200\"\n             alt=\"A\
    \ photo of the Eiffel Tower, Paris\">\n        <br> Eiffel Tower, Paris\n    </p>\n\
    </body>\n```\n\n4. 使用 `<img>` 标签，并将 `src` 属性设置为照片的文件名，`height` 属性设置为 200（像素）。\n\
    5. 使用换行符，使文本位于图片下方。\n\n## 挑战 2\n\n你被一家[搏击俱乐部](http://kickboxing)[紧急雇佣](http://hired)，因为他们的上一个网页开发者没有事先通知就辞职了。他们希望你完成一个[未完成的网页](http://unfinished)。\n\
    \n你应该：\n\n- 修复它——以便[错误被移除](http://errors)。\n- 改进它——使其[更具可访问性](http://accessible)。\n\
    \n下面的代码是你的[起点](http://starting-point)。右边是一个[模拟图](http://mock-up)，展示了该页面[应该](http://supposed-to-look-like)是什么样子。\n\
    \n```\n<body style=\"font: Arial;\n            color: Green;\n            background-color:\
    \ HotPink;\">\n    <p>Kiana's Kickboxing</p>\n    <img src=\"kickboxer\" height=\"\
    20\">\n    <p>Come by for a free drop-in:</p>\n    <p>Tuesday 4pm to 7pm</p>\n\
    </body>\n```\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_29_1.png)\n\n> 你不需要完全匹配这些颜色和字体。\n"
