  md: "# Input Fields and Forms\n\n# Use JavaScript to read inputted values\n\n1)\
    \ Working with forms in JavaScript is simple — you can use document.getElementById()\
    \ to access the input fields, then add .value to get the inputted data.\n2) The\
    \ example below extends the form from the previous page. Once completed, the form\
    \ will behave like this:\n• When clicked, the 'Enter' button will call a function\
    \ that handles the data in the form.\n• The function will read the values of the\
    \ input fields and then check if the 'Secret Code' is correct.\n• An alert will\
    \ pop up with an appropriate message and if the 'Secret Code' is correct, a link\
    \ will be revealed.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_70_0.png)\n\n\
    EXAMPLE Psst... the secret code is \"1234\" but feel free to change it.\n\nStep\
    \ 1 — Make the following changes to the HTML:\nUse the same code for the input\
    \ fields as before.\nAdd an <a> tag with an id, but don't set its href attribute\
    \ or include any text — the user will see nothing to begin with.\nSet the onclick\
    \ attribute of the button to call a function that will handle the data in the\
    \ form.\nAdd <script> tags.\n\n```\n<form>\n  <label> ... \n  <button type=\"\
    button\" onclick=\"checkForm()\">Enter</button>\n</form>\n<p><a id=\"secret-link\"\
    ></a></p>\n<script> ... </script>\n```\n\nStep 2 — Add the JavaScript between\
    \ the <script> tags:\ndocument.getElementById() is used to access the input fields\
    \ and .value is added to get the inputted data.\n\n```\nfunction checkForm() {\n\
    \    let name = document.getElementById(\"name\").value;\n    let code = document.getElementById(\"\
    code\").value;\n\n    if (code == \"1234\") {\n        alert(\"Welcome, \" + name\
    \ + \"! Access granted.\");\n        let secretLink = document.getElementById(\"\
    secret-link\");\n        secretLink.innerHTML = \"Enter secret page\";\n     \
    \   secretLink.href = \"secret-page.html\";\n    }\n    else {\n        alert(\"\
    Wrong code, \" + name + \"! Access denied.\");\n    }\n}\n```\n\nThe inputted\
    \ code is compared to this secret code to check whether it's a match.\nIf a correct\
    \ code is inputted, the hyperlink is changed so that it can be seen by the user\
    \ and clicked to enter the secret page.\nIf a wrong code is inputted, the user\
    \ is alerted but the hyperlink stays empty.\nThis isn't very secure because the\
    \ \"secret code\" is visible to anyone who inspects the source code of your web\
    \ page, and there's nothing stopping someone from visiting the secret page if\
    \ they know the URL. On a real website, the form data would be sent to a web server,\
    \ which would process it privately and keep track of which users have been granted\
    \ access.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_70_1.png)\n\n> Q2 Modify\
    \ the random number guessing game from Q1 on p.65 to use a form with an input\
    \ field, instead of a prompt. The user should be able to continue guessing until\
    \ they get the correct number.\n\n![](img/091ebbf5c71b5ebb2a4f4a4606b11dfa_70_2.png)\n\
    \nI was a beast on the putting field the other day — on top form...\nThe value\
    \ attribute can be set directly in your HTML — this means the input field can\
    \ be filled in already when the page loads, e.g. <input type=\"password\" value=\"\
    blond007\">."
