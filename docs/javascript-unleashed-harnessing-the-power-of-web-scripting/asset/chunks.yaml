    cannot be accessed outside of it.


    ### 5. Function Parameters and Arguments


    Parameters are placeholders for values that a function expects when it’s called.
    Arguments are the actual values passed to a function when it’s invoked.


    For instance:


    function greet(name) {


    console.log(`Hello, ${name}!`);


    }


    greet("Alice"); // "Alice" is the argument passed to the ''name'' parameter


    In this example, name is a parameter, and "Alice" is an argument.


    ### 6. Returning Values


    Functions can return values using the return statement. When a function encounters
    a return statement, it exits immediately, and the specified value is returned
    to the caller.


    function subtract(a, b) {


    return a - b;


    }


    const difference = subtract(10, 4);


    console.log(difference); // Outputs: 6


    In this example, the subtract function returns the result of a - b, which is 6.


    Understanding functions and scope is crucial for organizing and reusing code effectively
    in JavaScript. Functions allow you to break down complex tasks into smaller, manageable
    parts and encapsulate logic. Scope defines where variables are accessible and
    helps prevent naming conflicts between different parts of your code. These concepts
    are fundamental for building maintainable and structured JavaScript applications.


