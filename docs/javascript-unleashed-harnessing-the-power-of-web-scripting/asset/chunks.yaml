    ## 2.5 Functions and Scope


    Functions are a fundamental concept in JavaScript, allowing you to encapsulate
    and reuse blocks of code. They also play a crucial role in defining variable scope
    within your programs. In this section, we’ll explore functions, their syntax,
    and how scope works in JavaScript.


    ### 1. Function Declaration


    A function is defined using the function keyword, followed by a name, a list of
    parameters enclosed in parentheses, and a block of code enclosed in curly braces.
    Here’s the basic syntax:


    function functionName(parameter1, parameter2, ...) {


    // Code to be executed when the function is called


    }


