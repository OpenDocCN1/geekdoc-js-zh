    function addNumbers(a, b) {


    return a + b;


    }


    const result = addNumbers(3, 5); // Calls the function and stores the result in
    ''result''


    console.log(result); // Outputs: 8


    In this example, addNumbers is a function that takes two parameters (a and b)
    and returns their sum. When we call the function with addNumbers(3, 5), it returns
    8, which is stored in the result variable.


    ### 2. Function Expression


    Another way to define functions is through function expressions. In this approach,
    you assign a function to a variable. Here’s the syntax:


    const functionName = function(parameter1, parameter2, ...) {


    // Code to be executed when the function is called


    };


    Here’s an example of a function expression that multiplies two numbers:


    const multiplyNumbers = function(x, y) {


    return x * y;


    };


    const product = multiplyNumbers(4, 6);


    console.log(product); // Outputs: 24


    Function expressions are useful when you need to assign functions to variables,
    pass functions as arguments to other functions, or define functions dynamically.


    ### 3. Arrow Functions


    Arrow functions provide a concise way to write functions in JavaScript. They are
    especially useful for small, one-line functions. The syntax looks like this:


    const functionName = (parameter1, parameter2, ...) => {


    // Code to be executed when the function is called


    };


    Here’s an example of an arrow function that calculates the square of a number:


    const square = (num) => num * num;


    const squaredValue = square(5);


    console.log(squaredValue); // Outputs: 25


    Arrow functions have a more compact syntax and automatically capture the value
    of this from the surrounding context, making them popular for use in modern JavaScript
    code.


    ### 4. Function Scope


    In JavaScript, variables declared within a function are scoped to that function.
    This means they are only accessible within the function. Variables declared outside
    of any function have global scope and can be accessed from anywhere in your code.


    For example:


    function localScopeExample() {


    const localVar = "I am local!";


    console.log(localVar); // Outputs: I am local!


    }


    localScopeExample();


    console.log(localVar); // Throws an error: localVar is not defined


