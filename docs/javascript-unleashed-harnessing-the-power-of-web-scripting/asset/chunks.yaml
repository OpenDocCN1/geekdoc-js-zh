    const button = document.getElementById("myButton");


    button.addEventListener("click", function() {


    alert("Button clicked!");


    });


    In this example, we add a click event listener to a button element, displaying
    an alert when the button is clicked.


    Understanding how to select and manipulate elements in the DOM is foundational
    for web development. It enables you to create interactive and dynamic web pages
    by responding to user actions and dynamically updating content. These techniques
    are essential for building modern web applications and enhancing user experiences.


