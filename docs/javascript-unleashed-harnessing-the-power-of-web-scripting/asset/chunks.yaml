    }, 500);


    });


    Promise.race([promise1, promise2])


    .then(function(result) {


    console.log(result.message); // Output: Data fetched.


    })


    .catch(function(error) {


    console.error(error); // Output: Error: Promise 2 rejected.


    });


    Promise.race resolves or rejects as soon as any of the promises in the array does.


    ### 6. Async/Await


    ES6 introduced the async and await keywords, which simplify working with promises
    even further. The async keyword is used to declare an asynchronous function, while
    await is used within an async function to pause execution until a promise is resolved.


