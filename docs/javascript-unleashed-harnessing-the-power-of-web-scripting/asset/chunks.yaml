    ## 5.1 Closures and Lexical Scoping


    Closures and lexical scoping are advanced JavaScript concepts that play a crucial
    role in the language’s flexibility and power. They involve the scope in which
    functions are declared and the ability of functions to “remember” their lexical
    scope even when executed elsewhere. Understanding closures and lexical scoping
    is essential for writing efficient and maintainable JavaScript code.


    ### 1. Lexical Scoping


    Lexical scoping, also known as static scoping, determines the scope of a variable
    by its position within the source code. In JavaScript, variables declared with
    var, let, or const have lexical scope. This means that the scope of a variable
    is determined by its location in the source code when the code is written, not
    when it’s executed.


    function outer() {


    const message = "Hello, ";


    function inner(name) {


    console.log(message + name);


    }


    return inner;


    }


    const greet = outer();


    greet("Alice"); // Output: Hello, Alice


    In this example, the inner function has access to the message variable from its
    outer scope, demonstrating lexical scoping.'
