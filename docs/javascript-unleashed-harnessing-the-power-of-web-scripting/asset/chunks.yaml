  raw: '•  **Multiplication Assignment (*=):** Multiplies the variable on the left
    by the right operand and assigns the result to the left operand.


    let w = 7;


    w *= 2; // w is now 14


    • Division Assignment (/=): Divides the variable on the left by the right operand
    and assigns the result to the left operand.


    let a = 20;


    a /= 5; // a is now 4


    ### 3. Comparison Operators


    Comparison operators are used to compare values and return a Boolean (true or
    false) result:


    • Equal (==): Checks if two values are equal, but it performs type coercion (converts
    values to the same type).


    let isEqual = 5 == "5"; // isEqual is true


    • Not Equal (!=): Checks if two values are not equal (with type coercion).


    let isNotEqual = 10 != "5"; // isNotEqual is false


    • Strict Equal (===): Checks if two values are equal without type coercion (must
    be the same type and have the same value).


    let isStrictEqual = 5 === 5; // isStrictEqual is true


    • Strict Not Equal (!==): Checks if two values are not equal without type coercion.


    let isStrictNotEqual = 10 !== "5"; // isStrictNotEqual is true


    • Greater Than (>): Checks if the left operand is greater than the right operand.


    let isGreaterThan = 8 > 3; // isGreaterThan is true


    • Less Than (<): Checks if the left operand is less than the right operand.


    let isLessThan = 4 < 7; // isLessThan is true


    • Greater Than or Equal (>=): Checks if the left operand is greater than or equal
    to the right operand.


    let isGreaterOrEqual = 5 >= 5; // isGreaterOrEqual is true


    • Less Than or Equal (<=): Checks if the left operand is less than or equal to
    the right operand.


    let isLessOrEqual = 3 <= 3; // isLessOrEqual is true


    ### 4. Logical Operators


    Logical operators are used to perform logical operations and return a Boolean
    result:


    • Logical AND (&&): Returns true if both operands are true.


    let isBothTrue = true && true; // isBothTrue is true


    • Logical OR (||): Returns true if at least one operand is true.


    let isEitherTrue = true || false; // isEitherTrue is true


    • Logical NOT (!): Returns the opposite Boolean value of the operand.


    let isNotTrue = !true; // isNotTrue is false


    These are some of the most commonly used operators in JavaScript. They allow you
    to perform a wide range of operations, from basic arithmetic calculations to complex
    logical evaluations. Understanding how to use operators is fundamental for writing
    JavaScript code that can manipulate and process data effectively. In the following
    sections, we’ll explore control structures, such as conditional statements and
    loops, which allow you to make decisions and repeat actions in your code.


    ## 2.3 Control Structures: if, else, and switch


    Control structures in JavaScript are essential for determining the flow of your
    code. They allow you to make decisions and execute different blocks of code based
    on conditions. In this section, we’ll explore the if, else, and switch statements,
    which are fundamental for controlling the behavior of your JavaScript programs.


    ### 1. The if Statement


    The if statement is used to execute a block of code if a specified condition is
    true. Here’s the basic syntax:


    if (condition) {


    // Code to execute if the condition is true


    }


    For example, you can use an if statement to check if a user is old enough to access
    a certain website:


    const age = 18;


    if (age >= 18) {


    console.log("You are old enough to access this website.");


    }


    In this example, the code inside the if block is executed because the condition
    age >= 18 is true.


    ### 2. The else Statement


    The else statement is used in conjunction with if to execute a different block
    of code if the if condition is false. Here’s how it works:


    if (condition) {


    // Code to execute if the condition is true


    } else {


    // Code to execute if the condition is false


    }


    For example, you can modify the previous example to display a message for users
    who are not old enough:


    const age = 16;


    if (age >= 18) {


    console.log("You are old enough to access this website.");


    } else {


    console.log("You are not old enough to access this website.");


    }


    In this case, since age is 16, the code inside the else block is executed.


    ### 3. The else if Statement


    You can use the else if statement to check multiple conditions sequentially after
    an initial if statement. Here’s the syntax:


    if (condition1) {


    // Code to execute if condition1 is true


    } else if (condition2) {


    // Code to execute if condition2 is true


    } else {


    // Code to execute if none of the conditions are true


    }


    For example, you can use else if to categorize users based on their age:


    const age = 25;


    if (age < 18) {


    console.log("You are a minor.");


    } else if (age >= 18 && age < 65) {


    console.log("You are an adult.");


    } else {


    console.log("You are a senior citizen.");


    }


    In this example, the code inside the second if block is executed because the condition
    age >= 18 && age < 65 is true.


    ### 4. The switch Statement


    The switch statement is used when you want to select one of many code blocks to
    be executed. It’s often used when you have a single value that can have multiple
    cases. Here’s the basic syntax:


    switch (expression) {


    case value1:


    // Code to execute if expression equals value1


    break;


    case value2:


    // Code to execute if expression equals value2


    break;


    // Add more cases as needed


    default:


    // Code to execute if none of the cases match expression


    }


    Here’s an example of using a switch statement to determine the day of the week
    based on a number:


    const dayNumber = 3;


    let dayName;


    switch (dayNumber) {


    case 1:


    dayName = "Monday";


    break;


    case 2:


    dayName = "Tuesday";


    break;


    case 3:


    dayName = "Wednesday";


    break;


    case 4:


    dayName = "Thursday";


    break;


    case 5:


    dayName = "Friday";


    break;


    case 6:


    dayName = "Saturday";


    break;


    case 7:


    dayName = "Sunday";


    break;


    default:


    dayName = "Invalid day number";


    }


    console.log(`Today is ${dayName}.`);


    In this example, the switch statement evaluates dayNumber, and the corresponding
    case is executed based on its value. If none of the cases match, the default block
    is executed.


    Control structures like if, else, and switch are crucial for adding logic and
    decision-making capabilities to your JavaScript programs. They allow your code
    to adapt and respond to different situations, making your applications more powerful
    and dynamic.


    ## 2.4 Loops: for, while, and do-while


    Loops are essential in programming for executing a block of code repeatedly. JavaScript
    provides three main types of loops: for, while, and do-while. In this section,
    we’ll explore how to use these loops to efficiently repeat tasks.


    ### 1. The for Loop


    The for loop is commonly used when you know how many times you want to execute
    a block of code. It has three parts: initialization, condition, and iteration.


    Here’s the basic syntax of a for loop:


    for (initialization; condition; iteration) {


    // Code to be executed repeatedly


    }


    For example, you can use a for loop to print numbers from 1 to 5:


    for (let i = 1; i <= 5; i++) {


    console.log(i);


    }


    In this example: - let i = 1 initializes a variable i to 1\. - i <= 5 is the condition
    that checks whether i is less than or equal to 5. - i++ is the iteration step,
    which increments i by 1 in each iteration.


    The loop will run as long as the condition i <= 5 is true, and it prints the values
    of i from 1 to 5.


    ### 2. The while Loop


    The while loop is used when you don’t know in advance how many times you need
    to execute a block of code. It relies on a condition to control the loop’s execution.


    Here’s the basic syntax of a while loop:


    while (condition) {


    // Code to be executed repeatedly


    }


    For example, you can use a while loop to print numbers from 1 to 5:


    let i = 1;


    while (i <= 5) {


    console.log(i);


    i++;


    }


    In this example: - let i = 1 initializes a variable i to 1 before the loop. -
    i <= 5 is the condition that checks whether i is less than or equal to 5\. - i++
    is used to increment i within the loop.


    The loop continues to run as long as the condition i <= 5 is true.'
