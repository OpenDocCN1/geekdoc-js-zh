    \ Web 开发人员来说都是一项宝贵的技能。\n\n## 4.4 本地存储和 Web 存储\n\n本地存储和 Web 存储是客户端存储解决方案，允许 Web\
    \ 应用程序直接在用户浏览器中存储数据。这些数据可以用于持久用户偏好、缓存应用程序数据或提供离线功能。在本节中，我们将探索 `JavaScript` 中的本地存储和\
    \ Web 存储，以及如何在 Web 开发中使用它们。\n\n### 1. 本地存储与 Web 存储\n\n本地存储和 Web 存储是在浏览器中存储键值对的机制，但它们在范围和容量方面有所：\n\
    \n- **本地存储 (localStorage)**: 存储在本地存储中的数据跨浏览器会话持久化，可以在同一浏览器的不同标签页或窗口之间访问。与 Web\
    \ 存储相比，它的存储容量更大（通常每个域名约 5-10 MB）。本地存储数据不会随每个 `HTTP request` 发送到服务器，因此适合缓存和存储用户设置。\n\
    - **会话存储 (sessionStorage)**: 存储在会话存储中的数据在单个页面会话期间有效。它仅限于页面生命周期，且不在不同标签页或窗口之间共享。会话存储适用于用户与\
    \ 页面交互期间的临时数据存储。\n\n### 2. 存储数据\n\n你可以使用 `setItem` 方法通过提供键值对在本地存储或会话存储中存储数据：\n\
