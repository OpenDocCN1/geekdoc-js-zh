    \ 1. 创建一个 HTML 文件\n\n首先，创建一个 HTML 文件，在其中包含你的 JavaScript 代码。你可以使用如 Visual Studio\
    \ Code 等文本编辑器创建一个新文件，并以 `.html` 扩展名保存。例如，你可以将其命名为 `index.html`。\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\">\n<title>My First JavaScript\
    \ Program</title>\n</head>\n<body>\n<h1><h1>Hello, JavaScript!</h1>\n<p>This is\
    \ my first JavaScript program.</p>\n<script src=\"script.js\"></script>\n</body>\n\
    </html>\n```\n\n在这个 HTML 文件中，我们包含了一个带有标题、主标题和段落的简单结构。我们还包含了一个 `<script>` 标签来引用一个名为\
    \ `script.js` 的外部 JavaScript 文件，我们将在下一步中创建它。\n\n### 2. 创建 JavaScript 文件\n\n接下来，在与你的\
    \ HTML 文件相同的目录下创建一个名为 `script.js` 的 JavaScript 文件。这里就是你编写 JavaScript 代码的地方。\n\n\
    ```javascript\n// script.js\n// 这是一个单行注释\n/*\n这是一个多行注释。\n你可以添加注释来解释你的代码。\n*/\n\
    // 在浏览器控制台中显示一条消息\nconsole.log(\"Hello, JavaScript!\");\n// 在弹出对话框中弹出一个消息\nalert(\"\
    Welcome to JavaScript!\");\n```\n\n在这个 JavaScript 文件中，我们从添加注释开始。注释对于解释你的代码以及为你自己和其他开发者提供背景信息至关重要。\n\
    \n我们使用 `console.log()` 向浏览器的控制台打印消息，这是调试和检查 JavaScript 代码的有用工具。`alert()` 函数会显示一个带有消息的弹出对话框。\n\
    \n### 3. 将 JavaScript 链接到 HTML\n\n要将你的 JavaScript 文件连接到 HTML 文档，请确保包含一个 `<script>`\
    \ 标签，并使用 `src` 属性指向你的 `script.js` 文件，如上面的 HTML 代码所示。这会告诉浏览器加载并执行你的 JavaScript\
    \ 代码。\n\n### 4. 在网络浏览器中打开\n\n现在，在网络浏览器中打开你的 `index.html` 文件。你可以通过右键点击文件并选择“打开方式”，或简单地将文件拖入浏览器窗口。\n\
    \n你应该能看到显示的 HTML 内容，其中有“Hello, JavaScript!”主标题和下方的段落。此外，你会注意到你在 `script.js` 中编写的\
    \ JavaScript 代码已经执行。你可能会在浏览器控制台中看到打印的“Hello, JavaScript!”消息，并且会弹出一个带有“Welcome\
    \ to JavaScript!”消息的警对话框。\n\n恭喜你！你成功编写并执行了你的第一个 JavaScript 程序。这个简单的示例演示了 JavaScript\
    \ 如何与网页交互并增强其功能。你现在准备好进一步探索 JavaScript 并开始构建更复杂的应用程序了。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 第 2 章：JavaScript 基础\n\n![image](img/chapter_title_below.png)\n\n## 2.1 变量与数据类型\n\
    \n在 JavaScript 中，变量是存储和管理数据的根本。理解变量和数据类型是你掌握 JavaScript 之旅上的关键第一步。\n\n### 1. 变量声明\n\
    \n在 JavaScript 中，你使用 `var`、`let` 或 `const` 关键字来声明变量。你可以这样声明变量：\n\n```javascript\n\
    // 使用 'var'（旧式，不推荐）\nvar age = 30;\n// 使用 'let'（用于可变变量优先）\nlet name = \"John\"\
    ;\n// 使用 'const'（用于常量优先）\nconst pi = 3.1415;\n```\n\n- `var` 在历史上曾用于声明变量，但它有一些特殊之处，且在现代\
    \ JavaScript 中通常会被避免使用。\n- `let` 是声明可变变量的首选。你可以更改赋值给 `let` 变量的值。\n- `const` 用于声明常量，一旦赋值，其值就不能再更改。\n\
    \n### 2. 数据类型\n\nJavaScript 具有几种内置数据类型，包括：\n\n- **Number（数字）**：表示数值，包括整数和浮点数。例如：\n\
    \  ```javascript\n  let age = 30;\n  let price = 19.99;\n  ```\n- **String（字符串）**：表示文本，并用单引号（''）或双引号（”）括起来。例如：\n\
    \  ```javascript\n  let name = \"John\";\n  let message = 'Hello, World!';\n \
    \ ```\n- **Boolean（布尔值）**：表示真或假值。例如：\n  ```javascript\n  let isStudent = true;\n\
    \  let hasAccount = false;\n  ```\n- **Undefined（未定义）**：表示已声明但尚未赋值的变量。例如：\n  ```javascript\n\
    \  let firstName;\n  console.log(firstName); // 输出: undefined\n  ```\n- **Null（空）**：表示刻意缺失任何对象值。例如：\n\
    \  ```javascript\n  let emptyValue = null;\n  ```\n- **Object（对象）**：表示键值对集合，其中键是字符串（或符号），值可以是任何数据类型。例如：\n\
    \  ```javascript\n  let person = {\n    name: \"Alice\",\n    age: 25,\n    isStudent:\
    \ true,\n  };\n  ```\n- **Array（数组）**：表示有序的值列表，通常具有相同的数据类型。例如：\n  ```javascript\n\
    \  let colors = [\"red\", \"green\", \"blue\"];\n  let scores = [98, 85, 72, 91];\n\
    \  ```\n- **Function（函数）**：表示可重用的代码块。函数可以接收参数并返回。例如：\n  ```javascript\n  function\
    \ add(a, b) {\n    return a + b;\n  }\n  ```\n\n### 3. 变量的赋值与重新赋值\n\n你可以使用赋值运算符\
    \ `=` 给变量赋值：\n\n```javascript\nlet age = 30;\nlet name = \"John\";\n```\n\n也可以用新值对变量重新赋值：\n\
    \n```javascript\nlet score = 85; // 初始赋值\nscore = 92; // 重新赋值\n```\n\n### 4. 变量命名规则\n\
    \n在 JavaScript 中命名变量时：\n\n- 变量名是区分大小写的（`myVariable` 与 `myvariable` 不相同）。\n- 变量名只能包含字母、数字、下划线或美元符号。\n\
    - 变量名必须以字母、下划线或美元符号开头（不能是数字开头）。\n- 如 `if`、`for` 和 `function` 等保留字不能作为变量名。\n\n\
    ### 5. 动态类型\n\nJavaScript 是一种动态类型语言，这意味着变量可以在运行时更改数据类型。例如：\n\n```javascript\n\
    let value = 42; // 'value' 是数字\nvalue = \"Hello\"; // 现在 'value' 是字符串\nvalue =\
    \ true; // 现在 'value' 是布尔值\n```\n\n理解变量和数据类型是处理 JavaScript 的基础在本章的后续章节中，我们将探索如何对变量进行操作、处理运算符和表达式，以及使用条件语句控制代码流。\n\
    \n## 2.2 运算符与表达式\n\nJavaScript 中的运算符用于对操作数执行操作的符号或关键字。操作数可以是变量、值或表达式。理解运算符对于在\
    \ JavaScript 代码中执行各种计算和操作非常重要。\n\n### 1. 算术运算符\n\n算术运算符用于基础数学运算：\n\n- **加 (+)**：将两个值相加。\n\
    \  ```javascript\n  let sum = 5 + 3; // sum 为 8\n  ```\n- **减 (-)**：从左操作数中减去右操作数。\n\
    \  ```javascript\n  let difference = 10 - 4; // difference 为 6\n  ```\n- **乘 (*)**：两个值相乘。\n\
    \  ```javascript\n  let product = 6 * 7; // product 为 42\n  ```\n- **除 (/)**：用左操作数除以右操作数。\n\
    \  ```javascript\n  let quotient = 20 / 4; // quotient 为 5\n  ```\n- **取模 (%)**：返回左操作数除以右操作数的余数。\n\
    \  ```javascript\n  let remainder = 17 % 5; // remainder 为 2\n  ```\n\n### 2.\
    \ 赋值运算符\n\n运算符用于给变量赋值：\n\n- **赋值 (=)**：将右侧的值赋予左侧变量。\n  ```javascript\n  let x\
    \ = 10;\n  ```\n- **加赋值 (+=)**：将右操作数加到左侧变量上，并将结果赋给左操作数。\n  ```javascript\n  let\
    \ y = 5;\n  y += 3; // y 现在是 8\n  ```\n- **减赋值 (-=)**：从左侧变量中减去右操作数，并将结果赋给左操作数。\n\
    \  ```javascript\n  let z = 15;\n  z -= 4; // z 现在是 11\n  ```\n\n"
- fmt: "\n- **Multiplication Assignment (*=):** Multiplies the variable on the left\
    \ by the right operand and assigns the result to the left operand.\n\n```javascript\n\
    let w = 7;\nw *= 2; // w is now 14\n```\n\n- **Division Assignment (/=):** Divides\
    \ the variable on the left by the right operand and assigns the result to the\
    \ left operand.\n\n```javascript\nlet a = 20;\na /= 5; // a is now 4\n```\n\n\
    ### 3. Comparison Operators\n\nComparison operators are used to compare values\
    \ and return a Boolean (true or false) result:\n\n- **Equal (==):** Checks if\
    \ two values are equal, but it performs type coercion (converts values to the\
    \ same type).\n\n```javascript\nlet isEqual = 5 == \"5\"; // isEqual is true\n\
    ```\n\n- **Not Equal (!=):** Checks if two values are not equal (with type coercion).\n\
    \n```javascript\nlet isNotEqual = 10 != \"5\"; // isNotEqual is false\n```\n\n\
    - **Strict Equal (===):** Checks if two values are equal without type coercion\
    \ (must be the same type and have the same value).\n\n```javascript\nlet isStrictEqual\
    \ = 5 === 5; // isStrictEqual is true\n```\n\n- **Strict Not Equal (!==):** Checks\
    \ if two values are not equal without type coercion.\n\n```javascript\nlet isStrictNotEqual\
    \ = 10 !== \"5\"; // isStrictNotEqual is true\n```\n\n- **Greater Than (>):**\
    \ Checks if the left operand is greater than the right operand.\n\n```javascript\n\
    let isGreaterThan = 8 > 3; // isGreaterThan is true\n```\n\n- **Less Than (<):**\
    \ Checks if the left operand is less than the right operand.\n\n```javascript\n\
    let isLessThan = 4 < 7; // isLessThan is true\n```\n\n- **Greater Than or Equal\
    \ (>=):** Checks if the left operand is greater than or equal to the right operand.\n\
    \n```javascript\nlet isGreaterOrEqual = 5 >= 5; // isGreaterOrEqual is true\n\
    ```\n\n- **Less Than or Equal (<=):** Checks if the left operand is less than\
    \ or equal to the right operand.\n\n```javascript\nlet isLessOrEqual = 3 <= 3;\
    \ // isLessOrEqual is true\n```\n\n### 4. Logical Operators\n\nLogical operators\
    \ are used to perform logical operations and return a Boolean result:\n\n- **Logical\
    \ AND (&&):** Returns true if both operands are true.\n\n```javascript\nlet isBothTrue\
    \ = true && true; // isBothTrue is true\n```\n\n- **Logical OR (||):** Returns\
    \ true if at least one operand is true.\n\n```javascript\nlet isEitherTrue = true\
    \ || false; // isEitherTrue is true\n```\n\n- **Logical NOT (!):** Returns the\
    \ opposite Boolean value of the operand.\n\n```javascript\nlet isNotTrue = !true;\
    \ // isNotTrue is false\n```\n\nThese are some of the most commonly used operators\
    \ in JavaScript. They allow you to perform a wide range of operations, from basic\
    \ arithmetic calculations to complex logical evaluations. Understanding how to\
    \ use operators is fundamental for writing JavaScript code that can manipulate\
    \ and process data effectively. In the following sections, we’ll explore control\
    \ structures, such as conditional statements and loops, which allow you to make\
    \ decisions and repeat actions in your code.\n\n## 2.3 Control Structures: if,\
    \ else, and switch\n\nControl structures in JavaScript are essential for determining\
    \ the flow of your code. They allow you to make decisions and execute different\
    \ blocks of code based on conditions. In this section, we’ll explore the if, else,\
    \ and switch statements, which are fundamental for controlling the behavior of\
    \ your JavaScript programs.\n\n### 1. The if Statement\n\nThe if statement is\
    \ used to execute a block of code if a specified condition is true. Here’s the\
    \ basic syntax:\n\n```javascript\nif (condition) {\n  // Code to execute if the\
    \ condition is true\n}\n```\n\nFor example, you can use an if statement to check\
    \ if a user is old enough to access a certain website:\n\n```javascript\nconst\
    \ age = 18;\nif (age >= 18) {\n  console.log(\"You are old enough to access this\
    \ website.\");\n}\n```\n\nIn this example, the code inside the if block is executed\
    \ because the condition `age >= 18` is true.\n\n### 2. The else Statement\n\n\
    The else statement is used in conjunction with if to execute a different block\
    \ of code if the if condition is false. Here’s how it works:\n\n```javascript\n\
    if (condition) {\n  // Code to execute if the condition is true\n} else {\n  //\
    \ Code to execute if the condition is false\n}\n```\n\nFor example, you can modify\
    \ the previous example to display a message for users who are not old enough:\n\
    \n```javascript\nconst age = 16;\nif (age >= 18) {\n  console.log(\"You are old\
    \ enough to access this website.\");\n} else {\n  console.log(\"You are not old\
    \ enough to access this website.\");\n}\n```\n\nIn this case, since `age` is 16,\
    \ the code inside the else block is executed.\n\n### 3. The else if Statement\n\
    \nYou can use the else if statement to check multiple conditions sequentially\
    \ after an initial if statement. Here’s the syntax:\n\n```javascript\nif (condition1)\
    \ {\n  // Code to execute if condition1 is true\n} else if (condition2) {\n  //\
    \ Code to execute if condition2 is true\n} else {\n  // Code to execute if none\
    \ of the conditions are true\n}\n```\n\nFor example, you can use else if to categorize\
    \ users based on their age:\n\n```javascript\nconst age = 25;\nif (age < 18) {\n\
    \  console.log(\"You are a minor.\");\n} else if (age >= 18 && age < 65) {\n \
    \ console.log(\"You are an adult.\");\n} else {\n  console.log(\"You are a senior\
    \ citizen.\");\n}\n```\n\nIn this example, the code inside the second if block\
    \ is executed because the condition `age >= 18 && age < 65` is true.\n\n### 4.\
    \ The switch Statement\n\nThe switch statement is used when you want to select\
    \ one of many code blocks to be executed. It’s often used when you have a single\
    \ value that can have multiple cases. Here’s the basic syntax:\n\n```javascript\n\
    switch (expression) {\n  case value1:\n    // Code to execute if expression equals\
    \ value1\n    break;\n  case value2:\n    // Code to execute if expression equals\
    \ value2\n    break;\n  // Add more cases as needed\n  default:\n    // Code to\
    \ execute if none of the cases match expression\n}\n```\n\nHere’s an example of\
    \ using a switch statement to determine the day of the week based on a number:\n\
    \n```javascript\nconst dayNumber = 3;\nlet dayName;\nswitch (dayNumber) {\n  case\
