    \ 原型。\n\n### 2. 原型链\n\n原型链允许对象将属性和方法的访问委托给它们的原型。当你尝试访问对象上的某个属性或方法时，JavaScript\
    \ 首先检查该对象是否具有该属性或方法。如果没有，JavaScript 就会沿着原型链查找，直到找到该属性或方法或到达链的末端。\n\n```javascript\n\
    // 创建一个原型对象\nconst vehiclePrototype = {\n  startEngine() {\n    console.log(\"\
    Engine started.\");\n  },\n};\n\n// 创建一个继承自原型的对象\nconst car = Object.create(vehiclePrototype);\n\
    \n// 通过原型链访问方法\ncar.startEngine(); // 输出: Engine started.\n```\n\n在这个例子中，`car`\
    \ 对象从它的原型 `vehiclePrototype` 继承了 `startEngine` 方法。\n\n### 3. 构造函数与原型\n\n构造函数通常用于创建相同属性和方法的对象。当你使用构造函数创建对象时，它们会自动关联一个原型对象。\n\
    \n```javascript\n// 构造函数\nfunction Person(firstName, lastName) {\n  this.firstName\
