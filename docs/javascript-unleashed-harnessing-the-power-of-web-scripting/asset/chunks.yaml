    );\n\n// 在会话存储中存储数据\nsessionStorage.setItem(\"theme\", \"dark\");\n```\n\n在此示例中，我们在本地存储中存储了用户名并在会话存储中存储了主题偏好。\n\
    \n### 3. 获取数据\n\n要从本地存储或会话存储中检索数据，可以使用相应的键使用 `getItem` 方法：\n\n```javascript\n\
    // 从本地存储中获取数据\nconst username = localStorage.getItem(\"username\");\n\n// 从会话存储中获取数据\n\
    const theme = sessionStorage.getItem(\"theme\");\n```\n\n`getItem` 方法返回与提供的键关联的存储值。\n\
    \n### 4. 删除数据\n\n你可以使用 `removeItem` 方法从本地存储或会话存储中删除数据：\n\n```javascript\n// 从本地存储中删除数据\n\
    localStorage.removeItem(\"username\");\n\n// 从会话存储中删除数据\nsessionStorage.removeItem(\"\
    theme\");\n```\n\n这将删除了与指定键关联的键值对。\n\n### 5. 清空存储\n\n如果你需要删除存储在本地存储或会话存储中的所有数据，可以使用\
    \ `clear` 方法：\n\n```javascript\n// 清空本地存储\nlocalStorage.clear();\n\n// 清空会话存储\n\
    sessionStorage.clear();\n```\n\n清空存储时要小心，因为它将移除存储在相应存储区域中的所有数据。\n\n### 6. 存储事件\n\
    \n当本地存储和会话存储的数据被同源的其他窗口或标签页的脚本修改时，它们会触发存储事件。你可以监听这些事件，以便对应用程序其他部分的更改做出反应：\n\n\
    ```javascript\nwindow.addEventListener(\"storage\", function(event) {\n  console.log(`存储事件:\
    \ ${event.key} 从 ${event.oldValue} 更改到 ${event.newValue}`);\n});\n```\n\n当同源内的其他脚本修改本地存储或会话存储中的数据时，将调用此事件处理器。\n\
    \n### 7. 局限性和考虑\n\n- 存储在本地存储和会话存储中的数据仅限于字符串。你可以在存储之前将对象等复杂数据结构序列化为 `JSON` 字符串，并在检索时将反反序列化。\n\
    - 两种存储机制都是同步的，这意味着读取和写入数据可能会阻塞主线程。请注意性能考虑，特别是在处理大量数据时。\n- 存储空间是有限的（本地存储约 5-10\
    \ MB），因此避免在客户端存储中存储过多数据或敏感信息。\n- 浏览器对本地存储和会话存储的支持几乎是无处不在，使得它们成为 Web 应用程序开发的可靠选择。\n\
    \n本地存储和 Web 存储提供了在客户端存储和管理数据的方便方法，减少了频繁服务器请求的需求并改进了用户体验。理解如何有效使用本地存储和会话存储，对于希望通过数据持久化和缓存功能增强\
    \ Web 应用程序的 Web 开发人员来说非常有价值。\n\n## 4.5 用于多线程的 Web Workers\n\nWeb Workers 是现代浏览器的一项功能，允许在\
    \ Web 应用程序中实现多线程。它们允许 `JavaScript` 代码在后台并发运行，与负责处理用户界面和渲染的主线程分离。这可以显著提高 Web 应用程序的性能和响应速度，特别是对于涉及重计算、数据处理或长时间运行的任务。在本节中，我们将探索\
    \ Web Workers 以及如何在 Web 开发中使用它们。\n\n### 1. 创建 Web Worker\n\n要创建 Web Worker，你需要创建一个专门用于该任务的独立\
    \ JavaScript 文件。假设我们想在 Web Worker 中执行一个耗时的计算。以下是创建工作文件 `calculation.js` 的方法：\n\
    \n```javascript\n// calculation.js\nself.addEventListener(\"message\", function(e)\
    \ {\n  const data = e.data;\n  // 执行耗时的计算\n  const result = performCalculation(data);\n\
    \n  // 将结果传回主线程\n  self.postMessage(result);\n});\n\nfunction performCalculation(data)\
    \ {\n  // 在此处执行计算\n  return data * 2;\n}\n```\n\n"
- fmt: "\nIn this example, we define an event listener that listens for messages from\
    \ the main thread. When a message is received, it triggers the `performCalculation`\
    \ function and sends the result back to the main thread using `self.postMessage`.\n\
    \n### 2. Using a Web Worker in the Main Thread\n\nTo use the Web Worker in the\
    \ main thread, you need to create an instance of it and send and receive messages.\
    \ Here’s how you can do it:\n\n```javascript\n// main.js\n\n// Create a new Web\
    \ Worker instance\nconst worker = new Worker(\"calculation.js\");\n\n// Send data\
    \ to the worker\nconst inputData = 5;\n\nworker.postMessage(inputData);\n\n//\
    \ Receive the result from the worker\nworker.addEventListener(\"message\", function(e)\
    \ {\n  const result = e.data;\n  console.log(`Result from Web Worker: ${result}`);\n\
    });\n```\n\nIn this code, we create a new Web Worker instance by providing the\
    \ path to the worker script. We send data to the worker using `postMessage` and\
    \ listen for messages from the worker using an event listener.\n\n### 3. Benefits\
    \ of Web Workers\n\n- **Improved Responsiveness**: Web Workers prevent long-running\
    \ tasks from blocking the main thread, ensuring that your web application remains\
    \ responsive to user interactions.\n- **Parallel Processing**: You can utilize\
    \ multiple Web Workers to perform parallel processing, taking advantage of multi-core\
    \ processors and speeding up tasks like data processing and image manipulation.\n\
    - **Offloading Heavy Tasks**: Tasks such as image filtering, encryption, or complex\
    \ calculations can be offloaded to Web Workers, reducing the workload on the main\
    \ thread and preventing slowdowns.\n\n### 4. Limitations and Considerations\n\n\
    - **No DOM Access**: Web Workers do not have access to the DOM or the global `window`\
    \ object. They are meant for pure computation tasks and cannot directly manipulate\
    \ the DOM or interact with the user interface.\n- **Communication Overhead**:\
    \ Data sent between the main thread and Web Workers is serialized and deserialized,\
    \ which can introduce some communication overhead. Avoid sending large data objects\
    \ between threads.\n- **Same-Origin Policy**: Web Workers follow the same-origin\
    \ policy, meaning they can only communicate with the same domain they were loaded\
    \ from. This policy is essential for security reasons.\n- **Resource Duplication**:\
    \ Each Web Worker instance has its own global scope and cannot directly share\
    \ variables or data with other workers. If necessary, you can use techniques like\
    \ shared memory or libraries designed for inter-worker communication.\n\nWeb Workers\
    \ are a valuable tool for improving web application performance and responsiveness,\
    \ especially for CPU-intensive tasks. By utilizing the power of multithreading,\
    \ you can enhance the user experience and ensure that your web application remains\
    \ smooth and responsive even when handling computationally intensive operations.\n\
    \n| ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Chapter 5: Advanced JavaScript\
    \ Concepts\n\n![image](d2d_images/chapter_title_below.png)\n\n## 5.1 Closures\
    \ and Lexical Scoping\n\nClosures and lexical scoping are fundamental concepts\
    \ in JavaScript that play a crucial role in its functional nature and the management\
    \ of variable scope. Understanding closures and lexical scoping is essential for\
    \ writing clean and maintainable JavaScript code.\n\n### 1. Lexical Scoping\n\n\
    Lexical scoping, also known as static scoping, defines how variable names are\
    \ resolved in nested functions. In JavaScript, variables are scoped based on their\
    \ location within the source code, and this scope is determined at compile time.\
    \ This means that a variable’s scope is defined by its surrounding function or\
    \ block of code.\n\n```javascript\nfunction outer() {\n  const outerVar = \"I'm\
    \ in the outer function\";\n  function inner() {\n    const innerVar = \"I'm in\
    \ the inner function\";\n    console.log(outerVar); // Accessing outerVar from\
    \ inner function\n  }\n  inner();\n}\n\nouter();\n```\n\nIn this example, the\
    \ `inner` function has access to variables declared in its containing function,\
    \ `outer`, due to lexical scoping. It can access `outerVar` because it’s within\
    \ the lexical scope of `outer`.\n\n### 2. Closures\n\nA closure is a function\
    \ that “closes over” its lexical scope, allowing it to access variables from its\
    \ containing function even after the containing function has finished executing.\
    \ Closures are created whenever a function is defined within another function.\n\
    \n```javascript\nfunction createCounter() {\n  let count = 0;\n  return function\
    \ () {\n    count++;\n    console.log(count);\n  };\n}\n\nconst counter = createCounter();\n\
    counter(); // Outputs 1\ncounter(); // Outputs 2\n```\n\nIn this example, `createCounter`\
    \ returns an inner function that maintains access to the `count` variable even\
    \ after `createCounter` has completed execution. This is the essence of a closure.\n\
    \n### 3. Practical Uses of Closures\n\nClosures are widely used in JavaScript\
    \ for various purposes:\n\n- **Data Encapsulation**: Closures can be used to encapsulate\
    \ data and expose only the necessary parts, providing a way to implement private\
    \ variables.\n\n```javascript\nfunction createPerson(name) {\n  let age = 0;\n\
    \  return {\n    getName: function () {\n      return name;\n    },\n    getAge:\
    \ function () {\n      return age;\n    },\n    setAge: function (newAge) {\n\
    \      if (newAge >= 0) {\n        age = newAge;\n      }\n    },\n  };\n}\n\n\
    const person = createPerson(\"Alice\");\nconsole.log(person.getName()); // Outputs\
    \ \"Alice\"\nperson.setAge(30);\nconsole.log(person.getAge()); // Outputs 30\n\
    ```\n\n- **Function Factories**: Closures enable the creation of function factories,\
    \ where you generate functions with different behaviors based on input parameters.\n\
    \n```javascript\nfunction createMultiplier(factor) {\n  return function (number)\
    \ {\n    return number * factor;\n  };\n}\n\nconst double = createMultiplier(2);\n\
    console.log(double(5)); // Outputs 10\nconst triple = createMultiplier(3);\nconsole.log(triple(5));\
    \ // Outputs 15\n```\n\n- **Callback Functions**: Closures are frequently used\
    \ in callback functions to maintain context and access variables from the enclosing\
    \ scope.\n\n```javascript\nfunction fetchData(url, callback) {\n  fetch(url)\n\
    \    .then((response) => response.json())\n    .then((data) => callback(data))\n\
    \    .catch((error) => console.error(error));\n}\n\nconst apiUrl = \"https://api.example.com/data\"\
    ;\nfetchData(apiUrl, function (data) {\n  console.log(data);\n});\n```\n\nUnderstanding\
    \ closures and lexical scoping is essential for mastering JavaScript. These concepts\
    \ empower developers to write clean and efficient code by controlling variable\
    \ scope, creating reusable functions, and encapsulating data effectively. Closures,\
    \ in particular, play a crucial role in many advanced JavaScript patterns and\
    \ functional programming techniques.\n"
