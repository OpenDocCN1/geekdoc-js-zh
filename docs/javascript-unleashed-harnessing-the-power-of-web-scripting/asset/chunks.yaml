    \nIn JavaScript, every object has a prototype. A prototype is an object from which\
    \ other objects inherit properties and methods. The prototype relationship forms\
    \ a chain, commonly referred to as the prototype chain.\n\n```javascript\n// Creating\
    \ an object\nconst person = {\n  firstName: \"John\",\n  lastName: \"Doe\",\n\
    };\n\n// Accessing properties using the prototype chain\nconsole.log(person.firstName);\
    \ // Output: John\nconsole.log(person.hasOwnProperty(\"firstName\")); // Output:\
    \ true\n```\n\nIn this example, the `person` object inherits properties and methods\
    \ from its prototype, which is the built-in `Object` prototype.\n\n### 2. The\
    \ Prototype Chain\n\nThe prototype chain allows objects to delegate property and\
    \ method access to their prototypes. When you try to access a property or method\
    \ on an object, JavaScript first checks if the object has that property or method.\
    \ If it doesn’t, JavaScript looks up the prototype chain until it finds the property\
