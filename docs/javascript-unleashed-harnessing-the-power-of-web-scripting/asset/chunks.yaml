    # Chapter 4: JavaScript and HTML5


    ![image](d2d_images/chapter_title_below.png)


    ## 4.1 Canvas for Graphics and Animation


    HTML5 introduced the <canvas> element, which provides a powerful way to draw graphics
    and create animations using JavaScript. With the HTML5 canvas, you can create
    interactive visual elements, such as charts, graphs, games, and dynamic illustrations,
    directly within a web page. In this section, we’ll explore the basics of working
    with the HTML5 canvas element and how to draw graphics and animations using JavaScript.


    ### 1. The <canvas> Element


    To use the <canvas> element, you need to include it in your HTML markup:


    <canvas id="myCanvas" width="400" height="200"></canvas>


    •  id: This attribute allows you to uniquely identify the canvas element.


    •  width and height: These attributes set the dimensions of the canvas in pixels.


    ### 2. Accessing the Canvas


    In JavaScript, you can access the <canvas> element by its ID and obtain a drawing
    context, which is a JavaScript object that provides methods for drawing on the
    canvas:


    const canvas = document.getElementById("myCanvas");


    const context = canvas.getContext("2d");


    The getContext("2d") method returns a 2D rendering context, which is the most
    common and widely supported way to work with the canvas.


    ### 3. Drawing Shapes


    You can draw various shapes on the canvas, including rectangles, circles, lines,
    and paths. Here’s an example of drawing a simple rectangle:


    // Draw a filled rectangle


    context.fillStyle = "blue";


    context.fillRect(50, 50, 100, 60);


    In this code, we set the fill color to blue and draw a filled rectangle starting
    at coordinates (50, 50) with a width of 100 pixels and a height of 60 pixels.


    ### 4. Drawing Paths


    Paths allow you to create custom shapes and complex drawings. You define a path
    by specifying a series of drawing commands, such as moveTo, lineTo, and arc, to
    create lines and curves. Here’s an example of drawing a simple path:


    // Draw a triangle


    context.beginPath();


    context.moveTo(150, 100); // Move to the starting point


    context.lineTo(200, 50); // Draw a line


    context.lineTo(250, 100); // Draw another line


    context.closePath(); // Close the path


    context.stroke(); // Stroke the path outline


    In this code, we define a path to draw a triangle and then stroke it to create
    the outline.


    ### 5. Drawing Text


    The canvas also allows you to render text on the screen. You can set the font,
    size, color, and alignment for text rendering:


    context.font = "24px Arial";


    context.fillStyle = "red";


    context.textAlign = "center";


    context.fillText("Hello, Canvas!", canvas.width / 2, canvas.height / 2);


    In this example, we set the font, fill color, and text alignment and then use
    the fillText method to display text in the center of the canvas.


    ### 6. Animation


    The HTML5 canvas is well-suited for creating animations. To create animations,
    you typically use the requestAnimationFrame function, which repeatedly calls a
    specified function to update the canvas content. Here’s a basic example of animation:


    function animate() {


    // Clear the canvas


    context.clearRect(0, 0, canvas.width, canvas.height);


    // Update the animation state


    // Draw objects or shapes


    // Perform other animation logic


    // Request the next animation frame


    requestAnimationFrame(animate);


    }


    // Start the animation loop


    animate();


    In this code, the animate function is called repeatedly to update the canvas content.
    You can add your animation logic, such as moving objects, changing colors, or
    updating positions, within the animate function.'
