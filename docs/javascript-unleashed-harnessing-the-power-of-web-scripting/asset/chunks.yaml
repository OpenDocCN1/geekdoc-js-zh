    ## 5.3 Prototypes and Inheritance


    Prototypes and inheritance are fundamental concepts in JavaScript that allow objects
    to share properties and methods with other objects. Understanding prototypes is
    crucial for creating efficient and maintainable code when working with objects.
    In this section, we’ll delve into prototypes, how they relate to inheritance,
    and how they can be used in JavaScript.


    ### 1. Prototypes in JavaScript


    In JavaScript, every object has a prototype. A prototype is an object from which
    other objects inherit properties and methods. The prototype relationship forms
    a chain, commonly referred to as the prototype chain.


    // Creating an object


    const person = {


    firstName: "John",


    lastName: "Doe",


    };


    // Accessing properties using the prototype chain


    console.log(person.firstName); // Output: John


    console.log(person.hasOwnProperty("firstName")); // Output: true


    In this example, the person object inherits properties and methods from its prototype,
    which is the built-in Object prototype.


    ### 2. The Prototype Chain


    The prototype chain allows objects to delegate property and method access to their
    prototypes. When you try to access a property or method on an object, JavaScript
    first checks if the object has that property or method. If it doesn’t, JavaScript
    looks up the prototype chain until it finds the property or method or reaches
    the end of the chain.


    // Creating a prototype object


    const vehiclePrototype = {


    startEngine() {


    console.log("Engine started.");


    },


    };


    // Creating an object that inherits from the prototype


    const car = Object.create(vehiclePrototype);


    // Accessing a method through the prototype chain


    car.startEngine(); // Output: Engine started.


    In this example, the car object inherits the startEngine method from its prototype,
    vehiclePrototype.


    ### 3. Constructor Functions and Prototypes


    Constructor functions are often used to create objects that share the same properties
    and methods. When you create objects using a constructor function, they automatically
    have a prototype object associated with them.


    // Constructor function


    function Person(firstName, lastName) {


    this.firstName = firstName;


    this.lastName = lastName;


    }


    // Creating objects using the constructor


    const person1 = new Person("Alice", "Johnson");


    const person2 = new Person("Bob", "Smith");


    console.log(person1.firstName); // Output: Alice


    console.log(person2.lastName); // Output: Smith


    In this example, person1 and person2 are instances of the Person constructor,
    and they share a prototype.


    ### 4. Adding Properties and Methods to Prototypes


    You can add properties and methods to an object’s prototype, making them available
    to all instances of that object.


    // Constructor function


    function Person(firstName, lastName) {


    this.firstName = firstName;


    this.lastName = lastName;


    }


    // Adding a method to the prototype


    Person.prototype.getFullName = function() {


    return this.firstName + " " + this.lastName;


    };


    const person1 = new Person("Alice", "Johnson");


    const person2 = new Person("Bob", "Smith");


    console.log(person1.getFullName()); // Output: Alice Johnson


    console.log(person2.getFullName()); // Output: Bob Smith


    In this example, the getFullName method is added to the Person constructor’s prototype,
    allowing all instances of Person to access it.


    ### 5. Inheritance through Prototypes


    Prototypes enable inheritance in JavaScript. You can create object hierarchies
    where objects inherit properties and methods from other objects in the prototype
    chain.


    // Parent constructor function


    function Animal(name) {


    this.name = name;


    }


    // Adding a method to the parent prototype


    Animal.prototype.makeSound = function() {


    console.log("Animal makes a sound.");


    };


    // Child constructor function


    function Dog(name) {


    Animal.call(this, name); // Call the parent constructor


    }


    // Inheriting from the parent prototype


    Dog.prototype = Object.create(Animal.prototype);


    Dog.prototype.constructor = Dog;


    // Adding a method to the child prototype


    Dog.prototype.bark = function() {


    console.log("Dog barks.");


    };


    const dog = new Dog("Rex");


    dog.makeSound(); // Output: Animal makes a sound.


    dog.bark(); // Output: Dog barks.


    In this example, the Dog constructor inherits properties and methods from the
    Animal constructor through their prototypes.


    ### 6. ES6 Classes and Inheritance


    ES6 introduced a more structured way to work with prototypes and inheritance through
    the class syntax.


    // Parent class


    class Animal {


    constructor(name) {


    this.name = name;


    }


    makeSound() {


    console.log("Animal makes a sound.");


    }


    }


    // Child class


    class Dog extends Animal {


    constructor(name) {


    super(name); // Call the parent constructor


    }


    bark() {


    console.log("Dog barks.");


    }


    }


    const dog = new Dog("Rex");


    dog.makeSound(); // Output: Animal makes a sound.


    dog.bark(); // Output: Dog barks.


    ES6 classes provide a more concise and intuitive way to create and extend classes
    in JavaScript while still utilizing the prototype chain for inheritance.


    ### 7. Conclusion


    Prototypes and inheritance are core concepts in JavaScript that enable code reusability
    and hierarchy in object-oriented programming. Understanding how prototypes work,
    how to add properties and methods to them, and how to create object hierarchies
    is essential for writing efficient and maintainable JavaScript code. Whether you
    choose to use constructor functions and prototypes or ES6 classes, these concepts
    form the foundation of object-oriented programming in JavaScript.


    ## 5.4 Promises and Asynchronous Programming


    Promises are a critical feature in JavaScript for handling asynchronous operations.
    They provide a cleaner and more structured way to work with asynchronous code
    compared to traditional callback functions. In this section, we’ll explore promises,
    how they work, and how they enable asynchronous programming in JavaScript.


    ### 1. Understanding Asynchronous JavaScript


    Asynchronous operations are tasks that don’t block the main execution thread of
    a program. Common examples include making HTTP requests, reading files, and waiting
    for user interactions. JavaScript is single-threaded, which means it can only
    execute one operation at a time. However, it can simulate concurrency by leveraging
    asynchronous programming techniques.


    // Example of an asynchronous operation


    setTimeout(function() {


    console.log("Async operation completed.");


    }, 1000);


    console.log("Main thread continues.");


    In this code, the setTimeout function schedules an asynchronous task to run after
    1000 milliseconds. While waiting for the task to complete, the main thread continues
    executing other code.


    ### 2. Callbacks and Callback Hell


    Callbacks have traditionally been used to manage asynchronous operations in JavaScript.
    A callback is a function that’s passed as an argument to another function and
    executed when the operation is complete.


    function fetchData(callback) {


    setTimeout(function() {


    const data = { message: "Data fetched." };


    callback(data);


    }, 1000);


    }


    fetchData(function(result) {


    console.log(result.message);


    });


    However, as applications grow and involve multiple asynchronous operations, nested
    callbacks can lead to a phenomenon known as “callback hell” or “pyramid of doom.”
    This makes the code hard to read and maintain.


