- fmt: "\nNow that you have your development environment set up, it’s time to write\
    \ your first JavaScript program. In this section, we’ll guide you through the\
    \ process step by step.\n\n### 1. Create an HTML File\n\nTo begin, create an HTML\
    \ file where you can include your JavaScript code. You can use a text editor like\
    \ Visual Studio Code to create a new file and save it with an `.html` extension.\
    \ For example, you can name it `index.html`.\n\n```html\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1.0\">\n<title>My First JavaScript Program</title>\n\
    </head>\n<body>\n<h1>Hello, JavaScript!</h1>\n<p>This is my first JavaScript program.</p>\n\
    <script src=\"script.js\"></script>\n</body>\n</html>\n```\n\nIn this HTML file,\
    \ we have a simple structure with a title, a heading, and a paragraph. We also\
    \ include a `<script>` tag to reference an external JavaScript file called `script.js`,\
    \ which we will create in the next step.\n\n### 2. Create a JavaScript File\n\n\
    Next, create a JavaScript file named `script.js` in the same directory as your\
    \ HTML file. This is where you will write your JavaScript code.\n\n```javascript\n\
    // script.js\n// This is a single-line comment\n/*\nThis is a multi-line comment.\n\
    You can add comments to explain your code.\n*/\n// Display a message in the browser's\
    \ console\nconsole.log(\"Hello, JavaScript!\");\n// Alert a message in a pop-up\
    \ dialog\nalert(\"Welcome to JavaScript!\");\n```\n\nIn this JavaScript file,\
    \ we start by adding comments. Comments are essential for explaining your code\
    \ and providing context to yourself and other developers.\n\nWe use `console.log()`\
    \ to print a message to the browser’s console, which is a useful tool for debugging\
    \ and inspecting JavaScript code. The `alert()` function displays a pop-up dialog\
    \ with a message.\n\n### 3. Link JavaScript to HTML\n\nTo connect your JavaScript\
    \ file to your HTML document, make sure you include the `<script>` tag with the\
    \ `src` attribute pointing to your `script.js` file, as shown in the HTML code\
    \ above. This tells the browser to load and execute your JavaScript code.\n\n\
    ### 4. Open in a Web Browser\n\nNow, open your `index.html` file in a web browser.\
    \ You can do this by right-clicking the file and selecting “Open with” or simply\
    \ dragging the file into your browser window.\n\nYou should see your HTML content\
    \ displayed with the heading “Hello, JavaScript!” and the paragraph below it.\
    \ Additionally, you’ll notice that the JavaScript code you wrote in `script.js`\
    \ has executed. You may see the message “Hello, JavaScript!” printed in the browser’s\
    \ console, and an alert dialog with the message “Welcome to JavaScript!” will\
    \ appear.\n\nCongratulations! You’ve successfully written and executed your first\
    \ JavaScript program. This simple example demonstrates how JavaScript can interact\
    \ with web pages and enhance their functionality. You’re now ready to explore\
    \ JavaScript further and begin building more complex web applications.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Chapter 2: JavaScript Basics\n\n![image](d2d_images/chapter_title_below.png)\n\
    \n## 2.1 Variables and Data Types\n\nIn JavaScript, variables are fundamental\
    \ for storing and managing data. Understanding variables and data types is a crucial\
    \ first step in your journey to mastering JavaScript.\n\n### 1. Variable Declaration\n\
    \nIn JavaScript, you declare variables using the `var`, `let`, or `const` keywords.\
    \ Here’s how you can declare variables:\n\n```javascript\n// Using 'var' (historical,\
    \ not recommended)\nvar age = 30;\n// Using 'let' (preferred for mutable variables)\n\
    let name = \"John\";\n// Using 'const' (preferred for constants)\nconst pi = 3.1415;\n\
    ```\n\n- `var` has historically been used to declare variables, but it has some\
    \ quirks and is generally avoided in modern JavaScript.\n- `let` is the preferred\
    \ choice for declaring mutable variables. You can change the value assigned to\
    \ a `let` variable.\n- `const` is used for declaring constants, and its value\
    \ cannot be changed once assigned.\n\n### 2. Data Types\n\nJavaScript has several\
    \ built-in data types, including:\n\n- **Number**: Represents numeric values,\
    \ both integers and floating-point numbers. For example:\n  ```javascript\n  let\
    \ age = 30;\n  let price = 19.99;\n  ```\n- **String**: Represents text and is\
    \ enclosed in single ('’) or double (“”) quotes. For example:\n  ```javascript\n\
    \  let name = \"John\";\n  let message = 'Hello, World!';\n  ```\n- **Boolean**:\
    \ Represents true or false values. For example:\n  ```javascript\n  let isStudent\
    \ = true;\n  let hasAccount = false;\n  ```\n- **Undefined**: Represents a variable\
    \ that has been declared but hasn’t been assigned a value. For example:\n  ```javascript\n\
    \  let firstName;\n  console.log(firstName); // Outputs: undefined\n  ```\n- **Null**:\
    \ Represents the intentional absence of any object value. For example:\n  ```javascript\n\
    \  let emptyValue = null;\n  ```\n- **Object**: Represents a collection of key-value\
    \ pairs, where keys are strings (or symbols) and values can be of any data type.\
    \ For example:\n  ```javascript\n  let person = {\n    name: \"Alice\",\n    age:\
    \ 25,\n    isStudent: true,\n  };\n  ```\n- **Array**: Represents an ordered list\
    \ of values, typically of the same data type. For example:\n  ```javascript\n\
    \  let colors = [\"red\", \"green\", \"blue\"];\n  let scores = [98, 85, 72, 91];\n\
    \  ```\n- **Function**: Represents a reusable block of code. Functions can take\
    \ parameters and return values. For example:\n  ```javascript\n  function add(a,\
    \ b) {\n    return a + b;\n  }\n  ```\n\n### 3. Variable Assignment and Reassignment\n\
    \nYou can assign values to variables using the assignment operator `=`:\n\n```javascript\n\
    let age = 30;\nlet name = \"John\";\n```\n\nVariables can also be reassigned with\
    \ new values:\n\n```javascript\nlet score = 85; // Initial assignment\nscore =\
    \ 92; // Reassignment\n```\n\n### 4. Variable Naming Rules\n\nWhen naming variables\
    \ in JavaScript:\n\n- Variable names are case-sensitive (`myVariable` is not the\
    \ same as `myvariable`).\n- Variable names can only contain letters, digits, underscores,\
    \ or dollar signs.\n- Variable names must start with a letter, underscore, or\
    \ dollar sign (not a digit).\n- Reserved words like `if`, `for`, and `function`\
    \ cannot be used as variable names.\n\n### 5. Dynamic Typing\n\nJavaScript is\
    \ a dynamically typed language, which means that variables can change their data\
    \ type during runtime. For example:\n\n```javascript\nlet value = 42; // 'value'\
    \ is a number\nvalue = \"Hello\"; // Now 'value' is a string\nvalue = true; //\
    \ And now 'value' is a boolean\n```\n\nUnderstanding variables and data types\
    \ are the foundation for working with JavaScript. In the next sections of this\
    \ chapter, we’ll explore how to perform operations on variables, work with operators\
    \ and expressions, and control the flow of your code with conditional statements.\n\
    \n## 2.2 Operators and Expressions\n\nOperators in JavaScript are symbols or keywords\
    \ used to perform operations on operands. Operands can be variables, values, or\
    \ expressions. Understanding operators is essential for performing various calculations\
    \ and operations in your JavaScript code.\n\n### 1. Arithmetic Operators\n\nArithmetic\
    \ operators are used for basic mathematical operations:\n\n- **Addition (+)**:\
    \ Adds two values together.\n  ```javascript\n  let sum = 5 + 3; // sum is 8\n\
    \  ```\n- **Subtraction (-)**: Subtracts the right operand from the left operand.\n\
    \  ```javascript\n  let difference = 10 - 4; // difference is 6\n  ```\n- **Multiplication\
    \ (*)**: Multiplies two values.\n  ```javascript\n  let product = 6 * 7; // product\
    \ is 42\n  ```\n- **Division (/)**: Divides the left operand by the right operand.\n\
    \  ```javascript\n  let quotient = 20 / 4; // quotient is 5\n  ```\n- **Modulus\
    \ (%)**: Returns the remainder of the division of the left operand by the right\
    \ operand.\n  ```javascript\n  let remainder = 17 % 5; // remainder is 2\n  ```\n\
    \n### 2. Assignment Operators\n\nAssignment operators are used to assign values\
    \ to variables:\n\n- **Assignment (=)**: Assigns the value on the right to the\
    \ variable on the left.\n  ```javascript\n  let x = 10;\n  ```\n- **Addition Assignment\
    \ (+=)**: Adds the right operand to the variable on the left and assigns the result\
    \ to the left operand.\n  ```javascript\n  let y = 5;\n  y += 3; // y is now 8\n\
    \  ```\n- **Subtraction Assignment (-=)**: Subtracts the right operand from the\
    \ variable on the left and assigns the result to the left operand.\n  ```javascript\n\
    \  let z = 15;\n  z -= 4; // z is now 11\n  ```\n"
  raw: 'Now that you have your development environment set up, it’s time to write
    your first JavaScript program. In this section, we’ll guide you through the process
    step by step.


    ### 1. Create an HTML File


    To begin, create an HTML file where you can include your JavaScript code. You
    can use a text editor like Visual Studio Code to create a new file and save it
    with an “.html” extension. For example, you can name it “index.html.”


    <!DOCTYPE html>


    <html lang="en">


    <head>


    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>My First JavaScript Program</title>


    </head>


    <body>


    <h1>Hello, JavaScript!</h1>


    <p>This is my first JavaScript program.</p>


    <script src="script.js"></script>


    </body>


    </html>


    In this HTML file, we have a simple structure with a title, a heading, and a paragraph.
    We also include a <script> tag to reference an external JavaScript file called
    “script.js,” which we will create in the next step.


    ### 2. Create a JavaScript File


    Next, create a JavaScript file named “script.js” in the same directory as your
    HTML file. This is where you will write your JavaScript code.


    // script.js


    // This is a single-line comment


    /*


    This is a multi-line comment.


    You can add comments to explain your code.


    */


    // Display a message in the browser''s console


    console.log("Hello, JavaScript!");


    // Alert a message in a pop-up dialog


    alert("Welcome to JavaScript!");


    In this JavaScript file, we start by adding comments. Comments are essential for
    explaining your code and providing context to yourself and other developers.


    We use console.log() to print a message to the browser’s console, which is a useful
    tool for debugging and inspecting JavaScript code. The alert() function displays
    a pop-up dialog with a message.


    ### 3. Link JavaScript to HTML


    To connect your JavaScript file to your HTML document, make sure you include the
    <script> tag with the src attribute pointing to your “script.js” file, as shown
    in the HTML code above. This tells the browser to load and execute your JavaScript
    code.


    ### 4. Open in a Web Browser


    Now, open your “index.html” file in a web browser. You can do this by right-clicking
    the file and selecting “Open with” or simply dragging the file into your browser
    window.


    You should see your HTML content displayed with the heading “Hello, JavaScript!”
    and the paragraph below it. Additionally, you’ll notice that the JavaScript code
    you wrote in “script.js” has executed. You may see the message “Hello, JavaScript!”
    printed in the browser’s console, and an alert dialog with the message “Welcome
    to JavaScript!” will appear.


    Congratulations! You’ve successfully written and executed your first JavaScript
    program. This simple example demonstrates how JavaScript can interact with web
    pages and enhance their functionality. You’re now ready to explore JavaScript
    further and begin building more complex web applications.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Chapter 2: JavaScript Basics


    ![image](d2d_images/chapter_title_below.png)


    ## 2.1 Variables and Data Types


    In JavaScript, variables are fundamental for storing and managing data. Understanding
    variables and data types is a crucial first step in your journey to mastering
    JavaScript.


    ### 1. Variable Declaration


    In JavaScript, you declare variables using the var, let, or const keywords. Here’s
    how you can declare variables:


    // Using ''var'' (historical, not recommended)


    var age = 30;


    // Using ''let'' (preferred for mutable variables)


    let name = "John";


    // Using ''const'' (preferred for constants)


    const pi = 3.1415;


    •  var has historically been used to declare variables, but it has some quirks
    and is generally avoided in modern JavaScript.


    •  let is the preferred choice for declaring mutable variables. You can change
    the value assigned to a let variable.


    •  const is used for declaring constants, and its value cannot be changed once
    assigned.


    ### 2. Data Types


    JavaScript has several built-in data types, including:


    • Number: Represents numeric values, both integers and floating-point numbers.
    For example:


    let age = 30;


    let price = 19.99;


    • String: Represents text and is enclosed in single (’’) or double (““) quotes.
    For example:


    let name = "John";


    let message = ''Hello, World!'';


    • Boolean: Represents true or false values. For example:


    let isStudent = true;


    let hasAccount = false;


    • Undefined: Represents a variable that has been declared but hasn’t been assigned
    a value. For example:


    let firstName;


    console.log(firstName); // Outputs: undefined


    • Null: Represents the intentional absence of any object value. For example:


    let emptyValue = null;


    • Object: Represents a collection of key-value pairs, where keys are strings (or
    symbols) and values can be of any data type. For example:


    let person = {


    name: "Alice",


    age: 25,


    isStudent: true,


    };


    • Array: Represents an ordered list of values, typically of the same data type.
    For example:


    let colors = ["red", "green", "blue"];


    let scores = [98, 85, 72, 91];


    • Function: Represents a reusable block of code. Functions can take parameters
    and return values. For example:


    function add(a, b) {


    return a + b;


    }


    ### 3. Variable Assignment and Reassignment


    You can assign values to variables using the assignment operator =:


    let age = 30;


    let name = "John";


    Variables can also be reassigned with new values:


    let score = 85; // Initial assignment


    score = 92; // Reassignment


    ### 4. Variable Naming Rules


    When naming variables in JavaScript:


    •  Variable names are case-sensitive (myVariable is not the same as myvariable).


    •  Variable names can only contain letters, digits, underscores, or dollar signs.


    •  Variable names must start with a letter, underscore, or dollar sign (not a
    digit).


    •  Reserved words like if, for, and function cannot be used as variable names.


    ### 5. Dynamic Typing


    JavaScript is a dynamically typed language, which means that variables can change
    their data type during runtime. For example:


    let value = 42; // ''value'' is a number


    value = "Hello"; // Now ''value'' is a string


    value = true; // And now ''value'' is a boolean


    Understanding variables and data types is the foundation for working with JavaScript.
    In the next sections of this chapter, we’ll explore how to perform operations
    on variables, work with operators and expressions, and control the flow of your
    code with conditional statements.


    ## 2.2 Operators and Expressions


    Operators in JavaScript are symbols or keywords used to perform operations on
    operands. Operands can be variables, values, or expressions. Understanding operators
    is essential for performing various calculations and operations in your JavaScript
    code.


    ### 1. Arithmetic Operators


    Arithmetic operators are used for basic mathematical operations:


    • Addition (+): Adds two values together.


    let sum = 5 + 3; // sum is 8


    • Subtraction (-): Subtracts the right operand from the left operand.


    let difference = 10 - 4; // difference is 6


    •  **Multiplication (*):** Multiplies two values.


    let product = 6 * 7; // product is 42


    • Division (/): Divides the left operand by the right operand.


    let quotient = 20 / 4; // quotient is 5


    • Modulus (%): Returns the remainder of the division of the left operand by the
    right operand.


    let remainder = 17 % 5; // remainder is 2


    ### 2. Assignment Operators


    Assignment operators are used to assign values to variables:


    • Assignment (=): Assigns the value on the right to the variable on the left.


    let x = 10;


    • Addition Assignment (+=): Adds the right operand to the variable on the left
    and assigns the result to the left operand.


    let y = 5;


    y += 3; // y is now 8


    • Subtraction Assignment (-=): Subtracts the right operand from the variable on
    the left and assigns the result to the left operand.


    let z = 15;


    z -= 4; // z is now 11'
