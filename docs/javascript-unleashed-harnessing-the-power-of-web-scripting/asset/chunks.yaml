    # 第一章：JavaScript 简介


    ## 1.1 什么是 JavaScript?


    JavaScript 是 Web 开发中一种广泛使用的编程语言。它主要以为网页添加交互性和动态行为而闻名。在本节中，我们将深入探讨 JavaScript 的基础，并理解它在现代
    Web 开发中的作用。


    JavaScript 是一种高级的解释型脚本语言。这意味着你可以用 JavaScript 编写代码并直接在 浏览器中执行，而无需编译。它通常嵌入在 HTML
    文档中并在客户端运行，允许你创建交互式 Web  应用程序。


    ### JavaScript 的核心特性


    JavaScript 提供了一系列丰富的功能，使其成为 Web 开发的强大语言：


    1. **变量和数据类型**：JavaScript 支持多种数据类型，包括数字、字符串、布尔值和对象。你可以声明变量来存储和操作数据。

    2. **函数**：函数是可重用的代码块，可以在程序的任何地方定义和调用。它们对于组织和模块化你的代码至关重要。

    3. **控制结构**：JavaScript 支持 `if`、`else` 和 `switch` 等条件语句，以及 `for`、`while` 和 `do-while`
    等循环结构。

    4. **对象与原型**：JavaScript 是一种面向对象的语言，对象是其设计的中心。对象可以拥有属性和方法，你可以创建自定义对象和原型。

    5. **事件处理**：JavaScript 允许你响应网页上的用户交互和事件，例如鼠标点击和键盘输入。

    6. **DOM 操作**：文档对象模型（`DOM`）以树状结构表示 HTML 文档的结构。JavaScript 可以与 `DOM` 交互并对其操作，从而动态更改网页的内容和外观。

    7. **异步编程**：JavaScript 支持使用回调、`promises` 和 `async/await` 进行异步操作，允许你执行如从服务器获取数据等任务，而不会阻塞用户界面。


    ### JavaScript 在 Web 开发中的角色


    JavaScript 在现代 Web 开发中起着至关重要的作用：


    * **增强用户体验**：它允许开发者创建动态且响应式的用户界面，提升整体用户体验。

    * **客户端交互**：JavaScript 在用户的浏览器中执行，减少了对服务器往返的需求，这使得 Web 应用程序感觉更加灵敏。

    * **Web 应用程序**：JavaScript 通过处理复杂的功能，驱动了从社交媒体平台到在线编辑器的许多 Web 应用程序。

    * **框架与库**：出现了广泛的 JavaScript 框架和库，如 `React`、`Angular` 和 `Vue.js`，旨在简化和优化 Web 开发。


    在本章的接下来的章节中，我们将探索 JavaScript 的历史、它为什么重要，以及如何设置你的开发环境以开始编写 JavaScript 代码。准备好开启
    JavaScript 的世界之旅吧！


    ## 1.2 JavaScript 简史


    JavaScript 拥有一段迷人的历史，这段历史塑造了它今天这种多功能的语言形态。在本节中，我们将回顾对 JavaScript 开发做出贡献的关键里程碑和事件。


    ### 起于 Netscape


    JavaScript 最初由 Brendan Eich 在 20 世纪 90 年代初于 Netscape Communications 公司工作期间开发。最初的目标是为
    Web 浏览器创建一种脚本语言，使网页更具交互性。1995 年 9 月，Netscape 作为 Netscape Navigator 2.0 的一部分发布了
    JavaScript，这标志着 JavaScript 的诞生。


    ### ECMAScript 的诞生


    为了标准化 JavaScript，Netscape 在 1996 年将其提交给欧洲计算机厂商协会（`ECMA`）。这项标准化努力导致了 `ECMAScript`
    的诞生，这是一份定义了 JavaScript 核心特性的规范。`ECMAScript 1` 作为规范的官方版本于 1997 年 6 月发布。随后的版本，如
    `ECMAScript 3`（1999 年）和 `ECMAScript 5`（2009 年），引入了重要的特性和改进。


    ### 浏览器大战与 DOM


    在 20 世纪 90 年代后期和 21 世纪初，Web 经历了 Netscape Navigator 和微软 Internet Explorer 之间的“浏览器大战”。这种竞争导致了
    Web  技术的快速进步，包括 JavaScript。这两个浏览器都引入了自己的增强功能和专有特性。


    与此同时，文档对象模型（`DOM`）作为 Web 开发的关键组件出现。`DOM` 提供了一种与 Web 文档结构和内容交互的标准化方法，允许网页发生动态变化。JavaScript
    在操作 `DOM` 中起着核心作用。


    ### AJAX 与 Web 2.0


    在 21 世纪 20 年代中期，一种被称为异步 JavaScript 和 XML（`AJAX`）的技术备受关注。`AJAX` 允许 Web 应用程序在后台与服务器交换数据，而无需刷新页面。这标志着
    Web 开发的重大转变，使得创建更有响应性和交互性的 Web 应用程序成为可能。`AJAX` 对 Web 2.0 应用程序的发展具有推动作用。


    ### JavaScript 库和框架的兴起


    随着 Web 应用程序变得越来越复杂，人们开始寻找简化开发的方法。这导致了 JavaScript 库和框架的兴起。2006 年发布的 `jQuery` 因简化了
    `DOM` 操作并提供了跨浏览器兼容性而变得极其流行。


    在随后的几年里，像 `AngularJS`（后来的 `Angular`）、`React` 和 `Vue.js` 等框架彻底改变了前端开发，为构建 Web 应用程序提供了结构化的方法。


