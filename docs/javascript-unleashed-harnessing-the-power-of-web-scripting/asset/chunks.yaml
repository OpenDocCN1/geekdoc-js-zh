    console.log(words); // [''This'', ''is'', ''a'', ''sample'', ''sentence'']


    const joinedSentence = words.join(''-''); // Join words with hyphens


    console.log(joinedSentence); // ''This-is-a-sample-sentence''


    ### Data Validation and Sanitization


    When working with user input or external data, data validation and sanitization
    are critical to ensure data integrity and security. You can use regular expressions
    and built-in functions to validate and sanitize data.


    #### Example: Validating Email Addresses


    function isValidEmail(email) {


    // Regular expression for email validation


    const emailRegex = /^[A-Za-z0-9._%-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,4}$/;


    return emailRegex.test(email);


    }


    console.log(isValidEmail(''user@example.com'')); // true


    console.log(isValidEmail(''invalid-email'')); // false


