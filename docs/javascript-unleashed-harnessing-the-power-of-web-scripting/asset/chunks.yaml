    • Runtime Errors: These occur while the code is executing and are often caused
    by unexpected conditions or invalid operations.


    // Runtime error: Division by zero


    const result = 10 / 0;


    • Logical Errors: These are the hardest to detect because the code runs without
    errors, but it doesn’t produce the expected output due to flawed logic.


    // Logical error: Incorrect variable assignment


    const total = 10 + 5;


    console.log("Total: " + total); // Output: Total: 105


    ### 2. The try...catch Statement


    The try...catch statement is used to handle exceptions (runtime errors) gracefully.
    It allows you to execute code within a try block and provide a fallback action
    in case an error occurs.


    try {


    // Code that might throw an error


    const result = 10 / 0;


    console.log(result);


    } catch (error) {


    // Handle the error


    console.error("An error occurred: " + error.message);


    }


    In this example, the division by zero operation would normally throw an error,
    but the try...catch block prevents the program from crashing, and the error message
    is displayed.


    ### 3. The throw Statement


    You can manually throw custom errors using the throw statement. This is useful
    when you want to handle specific cases or provide more meaningful error messages.


    function divide(a, b) {


    if (b === 0) {


    throw new Error("Division by zero is not allowed.");


    }


    return a / b;


    }


    try {


    const result = divide(10, 0);


    console.log(result);


    } catch (error) {


    console.error("An error occurred: " + error.message);


    }


    Here, the divide function throws a custom error if the denominator is zero, leading
    to a more informative error message.


    ### 4. The finally Block


    The try...catch statement can be extended with a finally block, which is executed
    regardless of whether an error occurred or not. This block is often used for cleanup
    tasks.


    try {


    // Code that might throw an error


    const result = 10 / 2;


    console.log(result);


    } catch (error) {


    // Handle the error


    console.error("An error occurred: " + error.message);


    } finally {


    // Cleanup code


    console.log("Execution complete.");


    }


    In this example, the finally block ensures that the “Execution complete” message
    is always logged, regardless of whether an error occurred.


    ### 5. Debugging Tools


    Debugging is the process of identifying and fixing errors in your code. JavaScript
    provides a range of debugging tools, including browser developer tools and integrated
    development environments (IDEs) like Visual Studio Code.


    • Console: The console object provides methods like log, error, and info for printing
    messages and debugging information to the console.


    console.log("Debugging message.");


    • Breakpoints: You can set breakpoints in your code using your browser’s developer
    tools or an IDE. Breakpoints pause code execution, allowing you to inspect variables
    and step through code line by line.


    • Watch and Variables Panel: In developer tools, you can monitor the values of
    variables using the Watch panel. It’s helpful for tracking the state of your code
    during execution.


    • Console Errors: The console in developer tools displays error messages, making
    it easier to identify issues. Clicking on the error message often takes you to
    the line causing the error.


    • Step Through Code: Debugging tools allow you to step through your code one line
    at a time, helping you trace the flow and find errors.


    ### 6. Using console.assert


    The console.assert method is useful for adding assertions to your code. If an
    assertion is false, it throws an error with an optional error message.


    const value = 5;


    console.assert(value === 10, "Value should be 10.");


    If value is not equal to 10, an error message is displayed in the console.


    ### 7. Debugging Tips


    Here are some additional debugging tips:


    •  Use descriptive variable and function names to make it easier to understand
    your code.


    •  Break your code into smaller functions with single responsibilities. This makes
    it easier to isolate and debug issues.


    •  Comment your code to explain complex logic or why you made certain design decisions.


    •  Test your code incrementally and write unit tests to catch errors early.


    •  Take advantage of debugging features in your IDE, like auto-completion and
    code navigation.


    Debugging is a skill that improves with practice. The more you debug, the more
    adept you become at identifying and fixing errors efficiently, resulting in more
    robust and reliable JavaScript code.


