    ## 3.4 Event Handling in JavaScript


    Event handling is a fundamental part of web development that allows you to create
    interactive and responsive web applications. With JavaScript, you can define event
    listeners to respond to various user actions and browser events, such as clicks,
    keyboard input, mouse movements, and more. In this section, we’ll explore event
    handling in JavaScript.


    ### 1. Understanding Events


    Events are occurrences or happenings in a web page that can trigger JavaScript
    code to execute. Examples of events include:


    •  Click: Triggered when a user clicks on an element.


    •  Mouseover and Mouseout: Fired when the mouse pointer enters or leaves an element.


    •  Keydown, Keypress, and Keyup: Events related to keyboard input.


    •  Submit: Fired when a form is submitted.


    •  Load: Triggered when a web page or an image finishes loading.


    •  Resize: Fired when the browser window is resized.


    Events provide a way to make your web pages interactive by responding to user
    actions and other events.


    ### 2. Adding Event Listeners


    To respond to events, you can add event listeners to HTML elements using JavaScript.
    An event listener is a JavaScript function that gets executed when a specified
    event occurs on an element. Here’s the basic syntax for adding an event listener:


    const element = document.getElementById("myElement");


    element.addEventListener("eventName", eventHandlerFunction);


    •  element: The HTML element you want to attach the event listener to.


    •  "eventName": The name of the event you want to listen for (e.g., “click,” “keydown”).


    •  eventHandlerFunction: The JavaScript function that will be executed when the
    event occurs.


    For example, to add a click event listener to a button element:


    const button = document.getElementById("myButton");


    button.addEventListener("click", function() {


    alert("Button clicked!");


    });


    In this example, when the button with the ID “myButton” is clicked, an alert with
    the message “Button clicked!” will be displayed.


    ### 3. Event Object


    When an event occurs, an event object is automatically created and passed to the
    event handler function as a parameter. This event object contains information
    about the event, such as the type of event, the target element that triggered
    the event, and more.


    Here’s an example of accessing the event object in an event handler function:


    const element = document.getElementById("myElement");


    element.addEventListener("click", function(event) {


    console.log(event.type); // Outputs: "click"


    console.log(event.target); // Outputs the clicked element


    });


    You can use the event object to access information about the event and perform
    actions based on it.


    ### 4. Event Bubbling and Capturing


    In JavaScript, events propagate through the DOM tree, and there are two phases:
    capturing and bubbling.


    • Capturing Phase: Events are captured from the root of the DOM tree down to the
    target element.


    • Bubbling Phase: Events are then bubbled up from the target element back to the
    root of the DOM tree.


    You can specify whether you want to handle an event during the capturing or bubbling
    phase using the addEventListener method’s third parameter, which is a boolean:


    element.addEventListener("click", eventHandlerFunction, useCapture);


    •  useCapture: A boolean value (default is false) that determines the phase in
    which the event is handled.


    ### 5. Removing Event Listeners


    You can remove event listeners when they are no longer needed to prevent memory
    leaks and unexpected behavior. To remove an event listener, you need to specify
    the same event type and callback function used when adding the listener:


    const element = document.getElementById("myElement");


    function eventHandler() {


    // Event handling logic


    }


    element.addEventListener("click", eventHandler);


    // Later, to remove the event listener


    element.removeEventListener("click", eventHandler);


    Removing event listeners ensures that your code doesn’t continue to respond to
    events after the relevant elements are no longer in use.


    ### 6. Event Delegation


    Event delegation is a technique where you attach a single event listener to a
    parent element, which then handles events for its child elements. This is useful
    when you have multiple elements with the same behavior, like a list of items.


    const parentElement = document.getElementById("parentList");


    parentElement.addEventListener("click", function(event) {


    if (event.target.tagName === "LI") {


    // Handle the click on an LI element


    console.log("Item clicked:", event.target.textContent);


    }


    });


    In this example, the click event is delegated from the parent element to its list
    items (<li>), allowing you to handle clicks on individual list items without attaching
    separate event listeners to each one.


    Understanding event handling is essential for creating interactive web applications.
    It allows you to respond to user actions and make web pages dynamic. With event
    listeners, you can create responsive user interfaces and build web applications
    that provide a smooth and engaging user experience.


    ## 3.5 Working with Forms and User Input


    Forms are an integral part of web applications, enabling users to input data and
    interact with websites. JavaScript plays a crucial role in enhancing form functionality
    and validating user input. In this section, we’ll explore how to work with forms,
    access form elements, and handle user input using JavaScript.


    ### 1. Accessing Form Elements


    To work with form elements in JavaScript, you can access them using various methods,
    such as getElementById, getElementsByName, or querySelector. For example, to access
    an input element with a specific id:


    const inputElement = document.getElementById("myInput");


    You can also access elements by their name attribute:


    const radioButtons = document.getElementsByName("gender");


    Once you have a reference to a form element, you can manipulate its properties,
    validate input, and respond to user interactions.


