  trans: "\n\nPromises 的引入是为了解决回调地狱（callback hell）问题，并提供一种更结构化的异步代码处理方式。Promise 代表一个尚未可用但未来可能的值。Promise\
    \ 有三种状态：等待（pending）、已解析（resolved/fulfilled）和拒绝（rejected）。\n\n```javascript\n//\
    \ Creating a promise\nconst fetchData = new Promise(function(resolve, reject)\
    \ {\n  setTimeout(function() {\n    const data = { message: \"Data fetched.\"\
    \ };\n    resolve(data); // Resolve the promise with data\n  }, 1000);\n});\n\n\
    // Using the promise\nfetchData\n  .then(function(result) {\n    console.log(result.message);\n\
    \  })\n  .catch(function(error) {\n    console.error(error);\n  });\n```\n\n在这个示例中，`fetchData`\
    \ 代表一个异步操作。它可以用数据解析，也可以用错误拒绝。`then` 方法用于处理已解析的状态，而 `catch` 方法用于处理拒绝。\n\n## Promise\
    \ 链式调用 (Chaining Promises)\n\nPromise 的优势之一是能够以更易读、更易维护的方式将多个异步操作链式连接。\n\n```javascript\n\
    function fetchData() {\n  return new Promise(function(resolve, reject) {\n   \
    \ setTimeout(function() {\n      const data = { message: \"Data fetched.\" };\n\
    \      resolve(data);\n    }, 1000);\n  });\n}\n\nfunction processData(data) {\n\
    \  return new Promise(function(resolve, reject) {\n    setTimeout(function() {\n\
    \      data.processed = true;\n      resolve(data);\n    }, 1000);\n  });\n}\n\
    \nfetchData()\n  .then(processData)\n  .then(function(result) {\n    console.log(result.message);\
    \ // Output: Data fetched.\n    console.log(result.processed); // Output: true\n\
    \  })\n  .catch(function(error) {\n    console.error(error);\n  });\n```\n\n在这个示例中，`fetchData`\
    \ 和 `processData` 函数返回 Promise，允许它们被链式连接在一起。这使得异步操作的流程更加线性且具有可读性。\n\n## Promise.all\
    \ 和 Promise.race\n\n当你有多个需要在继续执行之前全部解析的 Promise 时，就会使用 `Promise.all` 方法。\n\n```javascript\n\
    const promise1 = fetchData();\nconst promise2 = processData();\nPromise.all([promise1,\
    \ promise2])\n  .then(function(results) {\n    console.log(results[0].message);\
    \ // Output: Data fetched.\n    console.log(results[1].processed); // Output:\
    \ true\n  })\n  .catch(function(error) {\n    console.error(error);\n  });\n```\n\
    \n`Promise.all` 会等待数组中的所有 Promise 都解析后才会调用 `.then` 处理器函数。\n\n相反，`Promise.race`\
    \ 用于当你希望在数组中第一个 Promise 解析或拒绝时立即执行任务。\n\n```javascript\nconst promise1 = fetchData();\n\
    const promise2 = new Promise(function(resolve, reject) {\n  setTimeout(function()\
    \ {\n    reject(new Error(\"Promise 2 rejected.\"));\n  }, 500);\n});\nPromise.race([promise1,\
    \ promise2])\n  .then(function(result) {\n    console.log(result.message); //\
    \ Output: Data fetched.\n  })\n  .catch(function(error) {\n    console.error(error);\
    \ // Output: Error: Promise 2 rejected.\n  });\n```\n\n`Promise.race` 只要数组中任何一个\
    \ Promise 解析或拒绝，它就会立即解析或拒绝。\n\n## Async/Await\n\nES6 引入了 `async` 和 `await` 关键字，这进一步简化了\
    \ Promise 的使用。`async` 关键字用于声明异步函数，而 `await` 用于在异步函数内部暂停执行，直到 Promise 解析完成。\n\n\
    ```javascript\nasync function fetchData() {\n  return new Promise(function(resolve)\
    \ {\n    setTimeout(function() {\n      const data = { message: \"Data fetched.\"\
    \ };\n      resolve(data);\n    }, 1000);\n  });\n}\n\nasync function processAsyncData()\
    \ {\n  const data = await fetchData();\n  console.log(data.message); // Output:\
    \ Data fetched.\n}\n```\n\n![image](img/scene_break.png)\n\n## 错误处理与调试\n\n错误处理和调试是任何\
    \ JavaScript 开发者的必备技能。随着代码变得越来越复杂，高效地识别并解决错误变得至关重要。在本节中，我们将探索各种错误处理技术和调试工具，帮助你排查\
    \ JavaScript 代码中的问题。\n\n### 理解 JavaScript 错误\n\nJavaScript 代码可能会遇到各种类型的错误，包括语法错误、运行时错误和逻辑错误。\n\
    \n- **语法错误 (Syntax Errors)：** 当你的代码违反语言的语法规则时发生。这些错误由 JavaScript 引擎在解析期间检测到，并阻止代码运行。\n\
    \n"
- fmt: "\n```javascript\n// Syntax error: Missing closing parenthesis\n\nconsole.log(\"\
    Hello, World\";\n```\n\n- **Runtime Errors**: These occur while the code is executing\
    \ and are often caused by unexpected conditions or invalid operations.\n\n```javascript\n\
    // Runtime error: Division by zero\n\nconst result = 10 / 0;\n```\n\n- **Logical\
    \ Errors**: These are the hardest to detect because the code runs without errors,\
    \ but it doesn’t produce the expected output due to flawed logic.\n\n```javascript\n\
    // Logical error: Incorrect variable assignment\n\nconst total = 10 + 5;\n\nconsole.log(\"\
    Total: \" + total); // Output: Total: 105\n```\n\n### 2. The try...catch Statement\n\
    \nThe `try...catch` statement is used to handle exceptions (runtime errors) gracefully.\
    \ It allows you to execute code within a `try` block and provide a fallback action\
    \ in case an error occurs.\n\n```javascript\ntry {\n  // Code that might throw\
    \ an error\n  const result = 10 / 0;\n  console.log(result);\n} catch (error)\
    \ {\n  // Handle the error\n  console.error(\"An error occurred: \" + error.message);\n\
    }\n```\n\nIn this example, the division by zero operation would normally throw\
    \ an error, but the `try...catch` block prevents the program from crashing, and\
    \ the error message is displayed.\n\n### 3. The throw Statement\n\nYou can manually\
    \ throw custom errors using the `throw` statement. This is useful when you want\
    \ to handle specific cases or provide more meaningful error messages.\n\n```javascript\n\
    function divide(a, b) {\n  if (b === 0) {\n    throw new Error(\"Division by zero\
    \ is not allowed.\");\n  }\n  return a / b;\n}\n\ntry {\n  const result = divide(10,\
    \ 0);\n  console.log(result);\n} catch (error) {\n  console.error(\"An error occurred:\
    \ \" + error.message);\n}\n```\n\nHere, the `divide` function throws a custom\
    \ error if the denominator is zero, leading to a more informative error message.\n\
    \n### 4. The finally Block\n\nThe `try...catch` statement can be extended with\
    \ a `finally` block, which is executed regardless of whether an error occurred\
    \ or not. This block is often used for cleanup tasks.\n\n```javascript\ntry {\n\
    \  // Code that might throw an error\n  const result = 10 / 2;\n  console.log(result);\n\
    } catch (error) {\n  // Handle the error\n  console.error(\"An error occurred:\
    \ \" + error.message);\n} finally {\n  // Cleanup code\n  console.log(\"Execution\
    \ complete.\");\n}\n```\n\nIn this example, the `finally` block ensures that the\
    \ “Execution complete” message is always logged, regardless of whether an error\
    \ occurred.\n\n### 5. Debugging Tools\n\nDebugging is the process of identifying\
    \ and fixing errors in your code. JavaScript provides a range of debugging tools,\
    \ including browser developer tools and integrated development environments (IDEs)\
    \ like Visual Studio Code.\n\n- **Console**: The `console` object provides methods\
    \ like `log`, `error`, and `info` for printing messages and debugging information\
    \ to the console.\n  ```javascript\n  console.log(\"Debugging message.\");\n \
    \ ```\n\n- **Breakpoints**: You can set breakpoints in your code using your browser’s\
    \ developer tools or an IDE. Breakpoints pause code execution, allowing you to\
    \ inspect variables and step through code line by line.\n\n- **Watch and Variables\
    \ Panel**: In developer tools, you can monitor the values of variables using the\
    \ `Watch` panel. It’s helpful for tracking the state of your code during execution.\n\
    \n- **Console Errors**: The console in developer tools displays error messages,\
    \ making it easier to identify issues. Clicking on the error message often takes\
    \ you to the line causing the error.\n\n- **Step Through Code**: Debugging tools\
    \ allow you to step through your code one line at a time, helping you trace the\
    \ flow and find errors.\n\n### 6. Using console.assert\n\nThe `console.assert`\
    \ method is useful for adding assertions to your code. If an assertion is false,\
    \ it throws an error with an optional error message.\n\n```javascript\nconst value\
    \ = 5;\nconsole.assert(value === 10, \"Value should be 10.\");\n```\n\nIf `value`\
    \ is not equal to 10, an error message is displayed in the console.\n\n### 7.\
    \ Debugging Tips\n\nHere are some additional debugging tips:\n\n- Use descriptive\
    \ variable and function names to make it easier to understand your code.\n- Break\
    \ your code into smaller functions with single responsibilities. This makes it\
    \ easier to isolate and debug issues.\n- Comment your code to explain complex\
    \ logic or why you made certain design decisions.\n- Test your code incrementally\
    \ and write unit tests to catch errors early.\n- Take advantage of debugging features\
    \ in your IDE, like auto-completion and code navigation.\n\nDebugging is a skill\
    \ that improves with practice. The more you debug, the more adept you become at\
    \ identifying and fixing errors efficiently, resulting in more robust and reliable\
    \ JavaScript code.\n\n# Chapter 6: JavaScript Libraries and Frameworks\n\n## 6.1\
    \ Introduction to Popular JavaScript Libraries\n\nJavaScript libraries and frameworks\
    \ are essential tools for developers, offering pre-built solutions and abstractions\
    \ to simplify common tasks and streamline development. In this section, we’ll\
    \ introduce you to some of the most popular JavaScript libraries and frameworks\
    \ used in web development.\n\n### 1. jQuery\n\n[jQuery](https://jquery.com/) is\
    \ a fast, small, and feature-rich JavaScript library. It simplifies HTML document\
    \ traversal, event handling, animations, and AJAX interactions for rapid web development.\
    \ jQuery provides a concise and powerful way to manipulate the DOM and handle\
    \ events.\n\n```javascript\n// Example: Using jQuery to handle a click event\n\
    $(document).ready(function () {\n  $(\"button\").click(function () {\n    alert(\"\
    Button clicked!\");\n  });\n});\n```\n\n### 2. React\n\n[React](https://reactjs.org/)\
    \ is a widely-used JavaScript library for building interfaces. Developed by Facebook,\
    \ React allows you to create reusable components and efficiently update the DOM\
    \ when data changes.\n\n```javascript\n// Example: Creating a React component\n\
    import React from 'react';\nfunction MyComponent(props) {\n  return <div>Hello,\
    \ {props.name}</div>;\n}\n```\n\n### 3. Angular\n\n[Angular](https://angular.io/)\
    \ is a powerful comprehensive framework for building web and mobile applications.\
    \ Developed by Google, Angular provides features like two-way data binding, dependency\
    \ injection, and a robust component-based architecture.\n\n```typescript\n// Example:\
    \ Creating an Angular component\nimport { Component } from '@angular/core';\n\n\
    @Component({\n  selector: 'app-root',\n  template: '<h1>Hello {{ name }}</h1>',\n\
    })\nexport class AppComponent {\n  name = 'Angular';\n}\n```\n\n### 4. Vue.js\n\
    \n[Vue.js](https://vuejs.org/) is a progressive JavaScript framework for building\
    \ interfaces. Known for its simplicity and flexibility, Vue allows you to incrementally\
    \ adopt its features, making it suitable for both small projects and large-scale\
    \ applications.\n\n```html\n<!-- Example: Creating a Vue component -->\n<template>\n\
    \  <div>\n    <p>{{ message }}</p>\n  </div>\n</template>\n\n<script>\nexport\
    \ default {\n  data() {\n    return {\n      message: 'Hello, Vue.js!',\n    };\n\
    \  }\n};\n</script>\n```\n\n### 5. Ember.js\n\n[Ember.js](https://emberjs.com/)\
    \ is an opinionated framework for building web applications. It follows the convention\
    \ over configuration (CoC) and don’t repeat yourself (DRY) principles, which promote\
    \ productivity.\n\n```javascript\n// Example: Creating an Ember.js component\n\
    import Component from '@glimmer/component';\n\nexport default class MyComponent\
    \ extends Component {\n  message = 'Hello, Ember.js!';\n}\n```\n\n### 6. Other\
    \ Libraries and Frameworks\n\nApart from the ones above, there are many other\
    \ JavaScript libraries and frameworks catering to specific needs, such as [Backbone.js](https://backbonejs.org/)\
    \ for structuring applications, [Meteor](https://www.meteor.com/) for full-stack\
    \ development, [D3.js](https://d3js.org/) for data visualization, and [Express.js](https://expressjs.com/)\
    \ for building web servers.\n\nChoosing the right library or framework depends\
    \ on your project requirements, team expertise, and development goals. Each of\
    \ these tools has its own strengths use cases, so experimenting with them can\
    \ enhance your web development.\n\n## 6.2 Working with jQuery\n\n[jQuery](https://jquery.com/)\
    \ is a popular JavaScript library that simplifies DOM manipulation and event handling.\
    \ It provides a convenient way to select elements, modify their attributes and\
    \ content, and perform various actions on web pages. In this section, we will\
    \ delve into how to work with jQuery.\n\n### Getting Started with jQuery\n\nTo\
    \ start using jQuery, you need to include it in your HTML file by adding the following\
    \ script tag to your document’s `<head>` or just before the closing `</body>`\
    \ tag:\n\n```html\n<script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"\
    ></script>\n```\n\nOnce jQuery is included, you can use it to perform tasks like\
    \ selecting elements, handling events, and modifying the DOM.\n\n### Selecting\
    \ Elements\n\njQuery provides a powerful selection mechanism using CSS-style selectors.\
    \ You can select elements by their tag name, class, ID, and more. For example:\n\
    \n```javascript\n// Select an element with an ID of 'my-element'\nvar element\
    \ = $('#my-element');\n\n// Select all elements with a class of 'btn'\nvar buttons\
    \ = $('.btn');\n\n// Select all 'div' elements\nvar divs = $('div');\n```\n\n\
    ### Modifying Elements\n\nYou can easily modify elements using jQuery. Common\
    \ operations include changing text, attributes, and CSS styles. Here are some\
    \ examples:\n\n```javascript\n// Change the text of an element\n$('#my-element').text('New\
    \ text');\n\n// Change an attribute (e.g., src of an image)\n$('img').attr('src',\
    \ 'new-image.jpg');\n\n// Add a CSS class to an element\n$('.btn').addClass('active');\n\
    ```\n\n### Event Handling\n\njQuery simplifies event handling by allowing you\
    \ to attach event listeners to elements easily. For instance:\n\n```javascript\n\
    // Attach a click event handler to a button element\n$('#my-button').click(function\
    \ () {\n  alert('Button clicked!');\n});\n\n// Shorthand for the click event\n\
    $('#my-button').on('click', function () {\n  alert('Button clicked!');\n});\n\
    ```\n\n### Animations and Effects\n\njQuery includes various animation and effect\
    \ functions to create smooth transitions and interactions on your webpage. You\
    \ can animate properties like opacity, width, and height:\n\n```javascript\n//\
    \ Animate the opacity of an element\n$('#fade-me').animate({ opacity: 0.25 },\
    \ 1000);\n\n// Toggle visibility with a sliding effect\n$('#toggle-me').slideToggle(500);\n\
    ```\n\n### AJAX with jQuery\n\njQuery simplifies making asynchronous requests\
    \ (AJAX) to fetch data from a server or send data to it. You can use functions\
    \ like `$.ajax()` or shortcuts like `$.get()` and `$.post()`.\n\n```javascript\n\
    // Using $.get() to fetch data from a server\n$.get('https://api.example.com/data',\
    \ function (data) {\n  console.log(data);\n});\n\n// Using $.post() to send data\
    \ to a server\n$.post('https://api.example.com/submit', { name: 'John', age: 30\
    \ }, function (response) {\n  console.log(response);\n});\n```\n\n### Plugins\
    \ and Extensibility\n\nOne of the strengths of jQuery is its extensive ecosystem\
    \ of plugins and extensions. These plugins provide additional functionality, such\
    \ as sliders, carousels, and form validation. You can easily incorporate these\
    \ plugins into your projects to save time.\n\n## 6.3 React: Building User Interfaces\n\
    \n[React](https://reactjs.org/) is a popular JavaScript library for building interfaces.\
    \ Developed by Facebook, React has gained widespread adoption in the web community\
    \ due to its component-based architecture and efficient way of managing the DOM.\n\
    \n### Introduction to React\n\nReact focuses on the concept of components. Components\
    \ are self-contained building blocks for creating user interfaces. They allow\
    \ you to break down your UI into smaller, manageable pieces. Here’s a simple example\
    \ of a React component:\n\n```javascript\nimport React from 'react';\n\nfunction\
    \ Greeting(props) {\n  return <h1>Hello, {props.name}!</h1>;\n}\n\nexport default\
    \ Greeting;\n```\n\n### Virtual DOM\n\nOne of key features of React is its Virtual\
    \ DOM. React maintains a lightweight in-memory representation of the actual DOM.\
    \ When data changes, React compares the Virtual DOM tree with the previous one\
    \ and updates only the parts that changed. This approach improves performance.\n\
    \n### JSX: JavaScript XML\n\nReact uses JSX (JavaScript XML) syntax to define\
    \ the structure. JSX allows you to write HTML-like code directly in your files.\
    \ Babel, a JavaScript compiler, transforms JSX into regular JavaScript. Here’s\
    \ an example of JSX within a React component:\n\n```javascript\nimport React,\
    \ { useState } from 'react';\n\nfunction Counter() {\n  const [count, setCount]\
    \ = useState(0);\n\n  const increment = () => {\n    setCount(count + 1);\n  };\n\
    \n  return (\n    <div>\n      <p>Count: {count}</p>\n      <button onClick={increment}>Increment</button>\n\
    \    </div>\n  );\n}\n\nexport default Counter;\n```\n*(Note: The original text\
    \ had some syntax errors in the provided snippets which have been cleaned up for\
    \ valid Markdown/JSX).*\n\n### Component-Based Architecture\n\nReact encourages\
    \ the decomposition of UI into reusable components. Each component can have its\
    \ state, properties (props), and lifecycle methods.\n\n```javascript\nimport React,\
    \ { Component } from 'react';\n\nclass Parent extends Component {\n  constructor(props)\
