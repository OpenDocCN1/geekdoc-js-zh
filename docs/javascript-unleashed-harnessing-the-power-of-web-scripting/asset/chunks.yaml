  trans: "\n\n- **乘法赋值 (*=):** 将左侧的变量乘以右侧的操作数，并将结果赋值给左侧的操作数。\n\n```javascript\nlet\
    \ w = 7;\nw *= 2; // w 现在是 14\n```\n\n- **除法赋值 (/=):** 将左侧的变量除以右侧的操作数，并将结果赋值给左侧的操作数。\n\
    \n```javascript\nlet a = 20;\na /= 5; // a 现在是 4\n```\n\n### 3. 比较运算符\n\n比较运算符用于比较值并返回布尔（true\
    \ 或 false）结果：\n\n- **等于 (==):** 检查两个值是否相等，但它会执行类型转换（将值转换为相同类型）。\n\n```javascript\n\
    let isEqual = 5 == \"5\"; // isEqual 为 true\n```\n\n- **不等于 (!=):** 检查两个值是否相等（带有类型转换）。\n\
    \n```javascript\nlet isNotEqual = 10 != \"5\"; // isNotEqual 为 false\n```\n\n\
    - **严格相等 (===):** 检查两个值是否相等而不进行类型转换（必须是相同类型且具有相同值）。\n\n```javascript\nlet isStrictEqual\
    \ = 5 === 5; // isStrictEqual 为 true\n```\n\n- **严格不等于 (!==):** 检查两个值是否相等而不进行类型转换。\n\
    \n```javascript\nlet isStrictNotEqual = 10 !== \"5\"; // isStrictNotEqual 为 true\n\
    ```\n\n- **大于 (>):** 检查左侧的操作数是否大于右侧的操作数。\n\n```javascript\nlet isGreaterThan =\
    \ 8 > 3; // isGreaterThan 为 true\n```\n\n- **小于 (<):** 检查左侧的操作数是否小于右侧的操作数。\n\n\
    ```javascript\nlet isLessThan = 4 < 7; // isLessThan 为 true\n```\n\n- **大于等于 (>=):**\
    \ 检查左侧的操作数是否大于或等于右侧的操作数。\n\n```javascript\nlet isGreaterOrEqual = 5 >= 5; // isGreaterOrEqual\
    \ 为 true\n```\n\n- **小于等于 (<=):** 检查左侧的操作数是否小于或等于右侧的操作数。\n\n```javascript\nlet\
    \ isLessOrEqual = 3 <= 3; // isLessOrEqual 为 true\n```\n\n### 4. 逻辑运算符\n\n逻辑运算符用于执行逻辑操作并返回布尔结果：\n\
    \n- **逻辑与 (&&):** 如果两个操作数都为真，则返回 true。\n\n```javascript\nlet isBothTrue = true\
    \ && true; // isBothTrue 为 true\n```\n\n- **逻辑或 (||):** 如果至少有一个操作数为真，则返回 true。\n\
    \n```javascript\nlet isEitherTrue = true || false; // isEitherTrue 为 true\n```\n\
    \n- **逻辑非 (!):** 返回操作数相反的布尔值。\n\n```javascript\nlet isNotTrue = !true; // isNotTrue\
    \ 为 false\n```\n\n这些是 JavaScript 中一些常用的运算符。它们允许你执行广泛的操作，从基础的算术计算到复杂的逻辑评估。理解如何使用运算符是编写能够有效操作和处理数据的\
    \ JavaScript 代码的基础。在接下来的章节中，我们将探索控制结构，例如条件语句和循环，这些结构允许你在代码中做出决策并重复操作。\n\n## 2.3\
    \ 控制结构：if, else 和 switch\n\nJavaScript 中的控制结构对于确定代码的执行流至关重要。它们允许你根据条件做出决策并执行不同的代码块。在本节中，我们将探索\
    \ if、else 和 switch 语句，这些是控制你的 JavaScript 程序行为的基础。\n\n### 1. if 语句\n\nif 语句用于在指定条件为真时执行代码块。以下是基本语法：\n\
    \n```javascript\nif (condition) {\n  // 如果条件为真，则执行的代码\n}\n```\n\n例如，你可以使用 if 语句来检查用户是否足够大以访问某个网站：\n\
    \n```javascript\nconst age = 18;\nif (age >= 18) {\n  console.log(\"你年龄足够可以访问此网站。\"\
    );\n}\n```\n\n在这个示例中，由于条件 `age >= 18` 为真，因此 if 块内部的代码被执行。\n\n### 2. else 语句\n\n\
    else 语句与 if 结合使用，在 if 条件为假时执行不同的代码块。工作原理如下：\n\n```javascript\nif (condition) {\n\
    \  // 如果条件为真，则执行的代码\n} else {\n  // 如果条件为假，则执行的代码\n}\n```\n\n例如，你可以修改之前的示例，为年龄不足的用户显示消息：\n\
    \n```javascript\nconst age = 16;\nif (age >= 18) {\n  console.log(\"你年龄足够可以访问此网站。\"\
    );\n} else {\n  console.log(\"你年龄不足以访问此网站。\");\n}\n```\n\n在这种情况下，由于 `age` 为 16，因此\
    \ else 块内部的代码被执行。\n\n### 3. else if 语句\n\n你可以使用 else if 语句在初始 if 语句之后按顺序检查多个条件。以下是语法：\n\
    \n```javascript\nif (condition1) {\n  // 如果 condition1 为真，则执行的代码\n} else if (condition2)\
    \ {\n  // 如果 condition2 为真，则执行的代码\n} else {\n  // 如果没有任何一个条件为真，则执行的代码\n}\n```\n\
    \n例如，你可以使用 else if 根据年龄对用户进行分类：\n\n```javascript\nconst age = 25;\nif (age < 18)\
    \ {\n  console.log(\"你是未成年人。\");\n} else if (age >= 18 && age < 65) {\n  console.log(\"\
    你是成年人。\");\n} else {\n  console.log(\"你是老年人。\");\n}\n```\n\n在这个示例中，由于条件 `age >=\
    \ 18 && age < 65` 为真，因此第二个 if 块内部的代码被执行。\n\n### 4. switch 语句\n\nswitch 语句用于当你想要从许多代码块中选择一个执行时。它通常用于你有一个具有多种情况的单一值时。以下是基本语法：\n\
    \n```javascript\nswitch (expression) {\n  case value1:\n    // 如果 expression 等于\
    \ value1，则执行的代码\n    break;\n  case value2:\n    // 如果 expression 等于 value2，则执行的代码\n\
    \    break;\n  // 根据需要添加更多 cases\n  default:\n    // 如果没有任何 case 匹配 expression，则执行的代码\n\
    }\n```\n\n这是一个使用 switch 语句根据数字确定星几示例：\n\n```javascript\nconst dayNumber = 3;\n\
    let dayName;\nswitch (dayNumber) {\n  case 1:\n    dayName = \"Monday\";\n   \
    \ break;\n  case 2:\n    dayName = \"Tuesday\";\n    break;\n  case 3:\n    dayName\
    \ = \"Wednesday\";\n    break;\n  case 4:\n    dayName = \"Thursday\";\n    break;\n\
    \  case 5:\n    dayName = \"Friday\";\n    break;\n  case 6:\n    dayName = \"\
    Saturday\";\n    break;\n  case 7:\n    dayName = \"Sunday\";\n    break;\n  default:\n\
    \    dayName = \"Invalid day number\";\n}\nconsole.log(`Today is ${dayName}.`);\n\
    ```\n\n在这个示例中，switch 语句评估 `dayNumber`。如果没有一个 case 匹配，则执行 default 块。if、else 和 switch\
    \ 等控制结构对于为你的 JavaScript 程序添加逻辑和决策能力至关重要。它们允许你的代码适应并响应不同的情况，使你的应用程序变得更强大。\n\n##\
    \ 2.4 循环：for, while 和 do-while\n\n循环在编程中对于重复执行代码块至关重要。JavaScript 提供了主要类型的循环：for、while\
    \ 和 do-while。在本节中，我们将探索如何使用这些循环来高效地完成任务。\n\n### 1. for 循环\n\nfor 循环通常用于在你知道想要执行代码块的次数时。它包含三个部分：初始化、条件和迭代。\n\
    \n```javascript\nfor (initialization; condition; iteration) {\n  // 重复执行的代码\n\
    }\n```\n\n例如，你可以使用 for 循环打印从 1 到 5 的数字：\n\n```javascript\nfor (let i = 1; i <=\
    \ 5; i++) {\n  console.log(i);\n}\n```\n\n在这个示例中：- `let i = 1` 初始化变量 `i` 为 1。\
    \ - `i <= 5` 是检查 `i` 是否小于或等于 5 的条件。 - `i++` 是迭代步骤，在每次迭代中将 `i` 加 1。\n\n### 2. while\
    \ 循环\n\nwhile 循环用于在你预先不知道需要执行代码块的次数时。它依赖于条件来控制循环的执行。\n\n```javascript\nwhile (condition)\
    \ {\n  // 重复执行的代码\n}\n```\n\n例如，你可以使用 while 循环打印从 1 到 5 的数字：\n\n```javascript\n\
    let i = 1;\nwhile (i <= 5) {\n  console.log(i);\n  i++;\n}\n```\n\n在这个示例中：- `let\
    \ i = 1` 在循环之前初始化变量 `i` 为 1。 - `i <= 5` 是检查 `i` 是否小于或等于 5 的条件。 - `i++` 在循环内部用于增加\
    \ `i`。\n\n只要条件 `i <= 5` 为真，循环就会继续运行。\n\n"
- fmt: "\n### 3. The do-while Loop\n\nThe do-while loop is similar to the while loop,\
    \ but it ensures that the block of code is executed at least once before checking\
    \ the condition.\n\nHere’s the basic syntax of a do-while loop:\n\n```javascript\n\
    do {\n  // Code to be executed repeatedly\n} while (condition);\n```\n\nFor example,\
    \ you can use a do-while loop to prompt a user for input until they enter a valid\
    \ number:\n\n```javascript\nlet userInput;\nlet number;\n\ndo {\n  userInput =\
    \ prompt(\"Enter a number:\");\n  number = parseInt(userInput);\n} while (isNaN(number));\n\
    \nconsole.log(`You entered a valid number: ${number}`);\n```\n\nIn this example:\n\
    - The code inside the loop prompts the user for input and attempts to convert\
    \ it to a number.\n- The loop continues to run as long as the condition `isNaN(number)`\
    \ is true, meaning the user has not entered a valid number. Once a valid number\
    \ is entered, the loop exits.\n\nThese are the three main types of loops in JavaScript,\
    \ each serving different purposes. Understanding when and how to use them is crucial\
    \ for controlling the flow of your programs and efficiently performing repetitive\
    \ tasks. Loops are essential tools for processing arrays, iterating through objects,\
    \ and managing program logic.\n\n## 2.5 Functions and Scope\n\nFunctions are a\
    \ fundamental concept in JavaScript, allowing you to encapsulate and reuse blocks\
    \ of code. They also play a crucial role in defining variable scope within your\
    \ programs. In this section, we’ll explore functions, their syntax, and how scope\
    \ works in JavaScript.\n\n### 1. Function Declaration\n\nA function is defined\
    \ using the `function` keyword, followed by a name, a list of parameters enclosed\
    \ in parentheses, and a block of code enclosed in curly braces. Here’s the basic\
    \ syntax:\n\n```javascript\nfunction functionName(parameter1, parameter2, ...)\
    \ {\n  // Code to be executed when the function is called\n}\n```\n\nFor example,\
    \ let’s create a simple function that adds two numbers:\n\n```javascript\nfunction\
    \ addNumbers(a, b) {\n  return a + b;\n}\n\nconst result = addNumbers(3, 5); //\
    \ Calls the function and stores the result in 'result'\nconsole.log(result); //\
    \ Outputs: 8\n```\n\nIn this example, `addNumbers` is a function that takes two\
    \ parameters (`a` and `b`) and returns their sum. When we call the function with\
    \ `addNumbers(3, 5)`, it returns 8, which is stored in the `result` variable.\n\
    \n### 2. Function Expression\n\nAnother way to define functions is through function\
    \ expressions. In this approach, you assign a function to a variable. Here’s the\
    \ syntax:\n\n```javascript\nconst functionName = function(parameter1, parameter2,\
    \ ...) {\n  // Code to be executed when the function is called\n};\n```\n\nHere’s\
    \ an example of a function expression that multiplies two numbers:\n\n```javascript\n\
    const multiplyNumbers = function(x, y) {\n  return x * y;\n};\n\nconst product\
    \ = multiplyNumbers(4, 6);\nconsole.log(product); // Outputs: 24\n```\n\nFunction\
    \ expressions are useful when you need to assign functions to variables, pass\
    \ functions as arguments to other functions, or define functions dynamically.\n\
    \n### 3. Arrow Functions\n\nArrow functions provide a concise way to write functions\
    \ in JavaScript. They are especially useful for small, one-line functions. The\
    \ syntax looks like this:\n\n```javascript\nconst functionName = (parameter1,\
    \ parameter2, ...) => {\n  // Code to be executed when the function is called\n\
    };\n```\n\nHere’s an example of an arrow function that calculates the square of\
    \ a number:\n\n```javascript\nconst square = (num) => num * num;\nconst squaredValue\
