    To change the text content of an HTML element, you can use the textContent property.
    For example:


    const element = document.getElementById("myElement");


    element.textContent = "New text content";


    Alternatively, if you want to modify the HTML content within an element, you can
    use the innerHTML property:


    const element = document.getElementById("myElement");


    element.innerHTML = "<strong>Updated</strong> content";


    Be cautious when using innerHTML with user-generated or untrusted content to avoid
    security vulnerabilities like cross-site scripting (XSS).


    ### 2. Modifying Element Attributes


    #### Changing Attributes


    You can change the attributes of an HTML element by accessing them and assigning
    new values. For example:


    const link = document.getElementById("myLink");


    link.href = "https://example.com";


    In this example, we update the href attribute of an anchor (<a>) element.


    #### Adding and Removing Attributes


    To add attributes dynamically, you can use the setAttribute method:


    const image = document.getElementById("myImage");


    image.setAttribute("alt", "Alternative text");


    This code adds or updates the alt attribute of an image element.


    To remove an attribute, you can use the removeAttribute method:


