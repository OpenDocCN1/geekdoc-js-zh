    fetchData


    .then(function(result) {


    console.log(result.message);


    })


    .catch(function(error) {


    console.error(error);


    });


    In this example, the fetchData promise represents an asynchronous operation. It
    can be resolved with data or rejected with an error. The then method is used to
    handle the resolved state, while the catch method handles rejections.


    ### 4. Chaining Promises


    One of the advantages of promises is the ability to chain multiple asynchronous
    operations in a more readable and maintainable way.


    function fetchData() {


