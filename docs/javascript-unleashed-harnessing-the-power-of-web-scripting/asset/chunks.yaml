    \ // 输出: Dog barks.\n```\n\nES6 类提供了一种更简洁、直观的方式用于在 JavaScript 中创建和扩展类，同时仍然利用原型链来实现继承。\n\
    \n### 7. 结论\n\n原型和继承是 JavaScript 的核心概念，它们实现了面向对象编程中的代码复用和层次结构。理解原型如何工作、如何向它们上添加属性和方法以及如何创建对象层次结构，对于编写高效且可维护的\
    \ JavaScript 代码至关重要。无论你选择使用构造函数和原型，还是 ES6 类，这些概念都构成了 JavaScript 面向对象编程的基础。\n\n\
    ## 5.4 Promises 与异步编程\n\nPromises 是 JavaScript 中处理异步操作的关键特性。与传统的回调函数相比，它们提供了一种更清晰、更有结构化的方式来处理异步代码。在本节中，我们将探索\
    \ Promise、它们如何工作，以及它们如何实现 JavaScript 中的异步编程。\n\n### 1. 理解异步 JavaScript\n\n异步操作是不阻塞程序主执行线程的任务。常见的用例包括发送\
    \ HTTP 请求、读取文件和等待用户交互。JavaScript 是单线程的，这意味着它一次只能执行一个操作。然而，它可以通过异步编程技术来模拟并发。\n\n\
    ```javascript\n// 异步操作示例\nsetTimeout(function() {\n  console.log(\"Async operation\
    \ completed.\");\n}, 1000);\n\nconsole.log(\"Main thread continues.\");\n```\n\
    \n在这段代码中，`setTimeout` 函数安排在 `1000` 毫秒后运行异步任务。在等待任务完成期间，主线程继续执行其他代码。\n\n### 2.\
    \ 回调与回调地狱\n\n回调传统一直用于管理 JavaScript 中的异步操作。回调是一个作为参数传递给另一个函数，并在操作完成时执行的函数。\n\n\
    ```javascript\nfunction fetchData(callback) {\n  setTimeout(function() {\n   \
    \ const data = { message: \"Data fetched.\" };\n    callback(data);\n  }, 1000);\n\
    }\n\nfetchData(function(result) {\n  console.log(result.message);\n});\n```\n\n\
    然而，随着应用程序增长并涉及多个异步操作，嵌套回调会导致被称为“回调地狱”或“金字塔”的现象。这使得代码变得难以阅读和维护。\n\n### 3. 引入 Promises\n\
    \n## 8. 结论（通用章节）\n\n面向对象编程是一种用于构建和组织代码的强大范式，JavaScript 提供了利用原型和类来实现 OOP 原则的活性。理解如何创建和操作对象、使用继承以及应用\
    \ OOP 概念，将帮助你为复杂的应用程序编写更模块化、可维护且表达力强的 JavaScript 代码。\n\n"
- fmt: "\nPromises were introduced to address the callback hell problem and provide\
    \ a more structured way to work with asynchronous code. A promise represents a\
    \ value that might not be available yet but will be in the future. Promises have\
    \ three states: pending, resolved (fulfilled), and rejected.\n\n```javascript\n\
    // Creating a promise\nconst fetchData = new Promise(function(resolve, reject)\
    \ {\n  setTimeout(function() {\n    const data = { message: \"Data fetched.\"\
    \ };\n    resolve(data); // Resolve the promise with data\n  }, 1000);\n});\n\n\
    // Using the promise\nfetchData\n  .then(function(result) {\n    console.log(result.message);\n\
    \  })\n  .catch(function(error) {\n    console.error(error);\n  });\n```\n\nIn\
    \ this example, the `fetchData` promise represents an asynchronous operation.\
    \ It can be resolved with data or rejected with an error. The `then` method is\
    \ used to handle the resolved state, while the `catch` method handles rejections.\n\
    \n## Chaining Promises\n\nOne of the advantages of promises is the ability to\
    \ chain multiple asynchronous operations in a more readable and maintainable way.\n\
    \n```javascript\nfunction fetchData() {\n  return new Promise(function(resolve,\
    \ reject) {\n    setTimeout(function() {\n      const data = { message: \"Data\
    \ fetched.\" };\n      resolve(data);\n    }, 1000);\n  });\n}\n\nfunction processData(data)\
    \ {\n  return new Promise(function(resolve, reject) {\n    setTimeout(function()\
    \ {\n      data.processed = true;\n      resolve(data);\n    }, 1000);\n  });\n\
    }\n\nfetchData()\n  .then(processData)\n  .then(function(result) {\n    console.log(result.message);\
    \ // Output: Data fetched.\n    console.log(result.processed); // Output: true\n\
    \  })\n  .catch(function(error) {\n    console.error(error);\n  });\n```\n\nIn\
    \ this example, the `fetchData` and `processData` functions return promises, allowing\
    \ them to be chained together. This results in a more linear and readable flow\
    \ of asynchronous operations.\n\n## Promise.all and Promise.race\n\nThe `Promise.all`\
    \ method is used when you have multiple promises that need to be resolved before\
    \ proceeding.\n\n```javascript\nconst promise1 = fetchData();\nconst promise2\
    \ = processData();\nPromise.all([promise1, promise2])\n  .then(function(results)\
    \ {\n    console.log(results[0].message); // Output: Data fetched.\n    console.log(results[1].processed);\
    \ // Output: true\n  })\n  .catch(function(error) {\n    console.error(error);\n\
    \  });\n```\n\n`Promise.all` waits for all promises in the array to be resolved\
    \ before calling the `.then` handler.\n\nOn the other hand, `Promise.race` is\
    \ used when you want to execute a task as soon as the first promise in an array\
    \ resolves or rejects.\n\n```javascript\nconst promise1 = fetchData();\nconst\
    \ promise2 = new Promise(function(resolve, reject) {\n  setTimeout(function()\
    \ {\n    reject(new Error(\"Promise 2 rejected.\"));\n  }, 500);\n});\nPromise.race([promise1,\
    \ promise2])\n  .then(function(result) {\n    console.log(result.message); //\
    \ Output: Data fetched.\n  })\n  .catch(function(error) {\n    console.error(error);\
    \ // Output: Error: Promise 2 rejected.\n  });\n```\n\n`Promise.race` resolves\
    \ or rejects as soon as any of the promises in the array does.\n\n## Async/Await\n\
    \nES6 introduced the `async` and `await` keywords, which simplify working with\
    \ promises even further. The `async` keyword is used to declare an asynchronous\
