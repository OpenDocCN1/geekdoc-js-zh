    const data = { message: "Data fetched." };


    resolve(data);


    }, 1000);


    });


    }


    function processData(data) {


    return new Promise(function(resolve, reject) {


    setTimeout(function() {


    data.processed = true;


    resolve(data);


    }, 1000);


    });


    }


    fetchData()


    .then(processData)


    .then(function(result) {


    console.log(result.message); // Output: Data fetched.


    console.log(result.processed); // Output: true


    })


    .catch(function(error) {


    console.error(error);


    });


    In this example, the fetchData and processData functions return promises, allowing
    them to be chained together. This results in a more linear and readable flow of
    asynchronous operations.


    ### 5. Promise.all and Promise.race


    The Promise.all method is used when you have multiple promises that need to be
    resolved before proceeding.


    const promise1 = fetchData();


    const promise2 = processData();


    Promise.all([promise1, promise2])


    .then(function(results) {


    console.log(results[0].message); // Output: Data fetched.


    console.log(results[1].processed); // Output: true


    })


    .catch(function(error) {


    console.error(error);


    });


    Promise.all waits for all promises in the array to be resolved before calling
    the .then handler.


    On the other hand, Promise.race is used when you want to execute a task as soon
    as the first promise in an array resolves or rejects.


    const promise1 = fetchData();


    const promise2 = new Promise(function(resolve, reject) {


