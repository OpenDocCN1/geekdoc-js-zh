    \ makes a sound.\ndog.bark(); // 输出: Dog barks.\n```\n\n在这个例子中，`Dog` 构造函数通过它们的原型从\
    \ `Animal` 构造函数继承了属性和方法。\n\n### 6. ES6 类与继承\n\nES6 通过 `class` 语法引入了更具结构的方式来处理原型和继承。\n\
    \n```javascript\n// 父类\nclass Animal {\n  constructor(name) {\n    this.name =\
