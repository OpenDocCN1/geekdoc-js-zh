    \ 进行访问和操作。\n\n例如，你可以像这样在元素上定义 `data-id` 属性：\n\n```html\n<div id=\"myDiv\" data-id=\"\
    123\">Custom data attribute</div\n```\n\n在 JavaScript 中访问并修改此数据属性：\n\n```javascript\n\
    const element = document.getElementById(\"myDiv\");\nconst dataId = element.getAttribute(\"\
    data-id\"); // 获取值\nconsole.log(dataId); // 输出: \"123\"\nelement.setAttribute(\"\
    data-id\", \"456\"); // 设置新值\n```\n\n数据属性是实现数据与元素关联并通过 JavaScript 访问的方便方法。\n\n\
    ## 3. 添加和删除元素\n\n### 1. 创建新元素\n\n要向 DOM 中添加新元素，你可以使用 `createElement` 方法创建一个新元素，设置其属性，并将其附加到现有元素：\n\
    \n```javascript\nconst newDiv = document.createElement(\"div\");\nnewDiv.textContent\
