    \ (num) => num * num;\nconst squaredValue = square(5);\nconsole.log(squaredValue);\
    \ // 输出: 25\n```\n\n箭头函数具有更紧凑的语法，并自动从周围环境中捕捉 `this` 的值，使其在现代 JavaScript 代码中流行。\n\
    \n### 4. 函数作用域 (Function Scope)\n\n在 JavaScript 中，在函数内部声明的变量的作用域限于该函数。这意味着它们只能在函数内部访问。在任何函数外部声明的变量具有全局作用域，可以在代码的任何地方访问。\n\
    \n例如：\n\n```javascript\nfunction localScopeExample() {\n  const localVar = \"\
    I am local!\";\n  console.log(localVar); // 输出: I am local!\n}\n\nlocalScopeExample();\n\
    console.log(localVar); // 抛错误：localVar is not defined\n```\n\n在此示例中，`localVar`\
    \ 定义在 `localScopeExample` 函数内部，无法在外部访问。\n\n### 5. 函数参数和参数 (Parameters and Arguments)\n\
    \n参数是函数在调用时期望的值的占位符。参数是在调用函数时传递给函数的实际值。\n\n例如：\n\n```javascript\nfunction greet(name)\
    \ {\n  console.log(`Hello, ${name}!`);\n}\n\ngreet(\"Alice\"); // \"Alice\" 是传递给\
    \ 'name' 参数的参数\n```\n\n在此示例中，`name` 是一个参数，而 `\"Alice\"` 是一个参数。\n\n### 6. 返回 (Returning\
    \ Values)\n\n函数可以使用 `return` 语句返回值。当函数遇到 `return` 语句时，它会立即退出并将指定的值返回给调用者。\n\n\
    ```javascript\nfunction subtract(a, b) {\n  return a - b;\n}\n\nconst difference\
    \ = subtract(10, 4);\nconsole.log(difference); // 输出: 6\n```\n\n在此示例中，`subtract`\
    \ 函数返回 `a - b` 的结果，即 6。\n\n理解函数和作用域对于在 JavaScript 中有效地组织和重用代码至关重要。函数允许你将复杂任务分解为更小、更容易的部分并封装逻辑。作用域定义了变量的可访问区域，有助于防止代码不同部分之间的命名冲突。这些概念是构建可维护且结构化的\
    \ JavaScript 应用程序的基础。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
