    \ 方法被添加到 `Person` 构造函数的原型上，允许所有 `Person` 实例访问它。\n\n### 5. 通过原型实现继承\n\n原型实现了 JavaScript\
    \ 中的继承。你可以创建对象层次结构，让对象从原型链中的其他对象继承属性和方法。\n\n```javascript\n// 父类构造函数\nfunction\
    \ Animal(name) {\n  this.name = name;\n}\n\n// 向父原型上添加方法\nAnimal.prototype.makeSound\
