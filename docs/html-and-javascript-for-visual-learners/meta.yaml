    # Before you begin


    Before you begin, it’s important that you know Windows well. A working knowledge
    of Windows makes it much easier to learn HTML and JavaScript. You should be familiar
    with:


    +   - How directories work

    - Windows Explorer

    - Basic word processing


    Make sure you can perform the following tasks:


    +   - Create a folder on your computer’s hard drive

    - Create a folder within a folder

    - Copy a paragraph from one document and paste it into another.


    If you have trouble doing this, set aside a couple of hours to learn Windows basics.
    Have a friend or co-worker who is proficient with computers walk you through Windows
    Explorer, creating folders and becoming familiar with file extensions.


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_7_0.png)


    You should also practice using the Cut, Copy, and Paste commands in a standard
    word processing program. When you can do these things on your own, you’re ready
    to learn HTML and JavaScript.'
