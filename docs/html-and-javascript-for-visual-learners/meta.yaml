    \ HTML editing programs. Allows search-and-replace through entire sites, and includes\
    \ many other useful features. Download a 30-day trial version at www.allaire.com."
  mdcn: "## 实践：启用翻转图形\n\n- 1. 在 index.html 的导航栏中，将“Cell Phones”和“PDAs”这两个词替换为翻转图形。使用图形\
    \ cellbright.gif、cell.gif、pdabright.gif 和 pda.gif。\n\n**提示：** 修改第一个单元格中的锚点标签和图像代码，以便在其他两个单元格中使用。\n\
    \n```\n<A HREF = \"laptops.html\"\nonMouseOver = \"imgOn('img1')\"\nonMouseOut\
