  md: '# Format a graphic


    1. In the Chesapeake Bay Retriever page, add this **ALT** attribute to the **<IMG>**
    tag:


    ```

    <IMG SRC="graphics/chessie.gif" ALIGN="left"

    ALT="Chesapeake Bay Retriever">

    ```


    > “Alt” text allows visually-impaired people to know what a graphic represents.
    Alt text also allows search engines to index visual content.


    2. Add the **VSPACE="4"** and **HSPACE="12"** attributes as well:


    ```

    <IMG SRC="graphics/chessie.gif" ALIGN="left"

    ALT="Chesapeake Bay Retriever" VSPACE="4"

    HSPACE="12">

    ```


    3. Also, add the **BORDER="1"** attribute:


    ```

    <IMG SRC="graphics/chessie.gif" ALIGN="left"

    ALT="Chesapeake Bay Retriever" VSPACE="4"

    HSPACE="12" BORDER="1">

    ```


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_46_0.png)'
  merge: -1
  pgno: 46
- img_proc: true
  md: '4. Save the page and view it in the browser. It should now look like this:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_47_0.png)


    An HSPACE of 12 creates a horizontal space of 12 pixels around the graphic that
    nothing can occupy


    A Border of 1 creates a 1-pixel border around the graphic


    5. Move your cursor onto the graphic. The “Alt” text—an alternative text description
    of the graphic—should pop up.


    The text should be aligned with the top of the graphic.


    **Tip:** *If you know the dimensions of a graphic, you can make it load faster
    by specifying its width and height in pixels:*


    ```

    <IMG SRC="graphics/chessie.gif" ALIGN="left" ALT="Chesapeake Bay Retriever" VSPACE="4"
    HSPACE="12" BORDER="1" WIDTH="150" HEIGHT="189">

    ```'
