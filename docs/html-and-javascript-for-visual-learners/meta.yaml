    \ all liability for any direct, indirect, consequential, incidental, exemplary,\
    \ or special damages resulting from the use of the information in this document\
    \ or from the use of any products described in it. Mention of any product does\
    \ not constitute an endorsement of that product by Visibooks™. Data used in examples\
    \ are intended to be fictional. Any resemblance to real companies, people, or\
    \ organizations is entirely coincidental.\n\nInternational Standard Book Number:\
    \ 0-9707479-2-6\n\nFirst Edition\n\n# Table of Contents\n\nIntroduction\n\n# HTML\
    \ Basics\n\nCreate a home page\nCreate the home page\nView the page in a browser\n\
    \nFormat pages and text\nChange fonts\nChange text size\nChange text weight\n\
    Change text color\nAlign text\nIndent text\nCreate lists\n\nCreate links to new\
    \ pages\nStep 1: Create a new page\nStep 2: Link to the new page\n\nCreate e-mail\
    \ and external links\nCreate an e-mail link\nLink to an external site\n\nInsert\
    \ and align graphics\nCapture a graphic from the Web\nInsert a graphic\nAlign\
    \ a graphic\nFormat a graphic\n\nCreate a basic navigation system\nLink back to\
    \ the home page\nLink pages to each other\nUse graphics as links\nUse graphics\
    \ as links\n\nChange page, link colors\nChange background color of page\nChange\
    \ link colors\nChange link colors\n\n# Layout & Navigation\n\n- Lay out pages\
    \ using tables\n  - Create a table\n  - Create a table\n  - Format a table\n \
    \ - Create a table-based home page\n  - Create new table-based pages\n\n- Create\
    \ navigation bars\n  - Create a navigation bar for a home page\n  - Create a navigation\
    \ bar for a main section page\n\n- Add subsections to site\n  - Insert a table\
    \ for content and subsection links\n  - Create subsection pages\n\nPlace tables\
    \ within tables\n\nLink to an external site using frames\n\n# Interactivity\n\n\
    Insert META tags\n\nCreate forms\n\n- Use style sheets\n  - Create a style sheet\n\
    \  - Apply a style sheet\n  - Create link effects with style sheets\n\nUpload\
    \ sites to a Web server\n\n# Advanced Layout\n\nEmploy background graphics\n\n\
    Employ spacer GIFs\n\nInsert a horizontal rule\n\nSpecify page margins\n\n# Practical\
    \ JavaScript\n\n- Enable rollover graphics\n  - View source code\n  - Copy source\
    \ code\n  - Modify source code\n\n- Open new windows\n\n- Validate form input\n\
    \n- Validate form input\n  - See how it works\n  - Insert the validation script\n\
    \  - Modify the <FORM> tag\n\n# Additional Resources\n\n# HTML Tag Chart\n\n#\
    \ Index\n\n# Introduction\n\nWelcome to *HTML and JavaScript for Visual Learners*.\
    \ If you’ve never used a Visibook before, you’ll find that it contains several\
    \ hundred illustrations, with comparatively little text. It presents essential\
    \ tasks, breaks them down into steps, then walks you through them with illustrations.\n\
    \n## What you’ll learn\n\nYou’ll learn how to use HTML to create a solid, attractive\
    \ Web site that’s easy to navigate. You’ll also learn how to upload it to a Web\
    \ server.\n\nYou won’t become an expert in Web publishing—that takes practice\
    \ and real-world experience. But you will learn the fundamentals of site-building,\
    \ and get a good foundation on which to build professional-level skills.\n\nAdditional\
    \ resources for acquiring expert-level HTML and JavaScript skills are found at\
    \ the end of this book.\n\n## How you’ll learn it\n\nThis book has five sections:\
    \ HTML Basics, Layout & Navigation, Interactivity, Advanced Layout, and Practical\
    \ JavaScript.\n\nAt the end of each task and section are practice exercises. Don’t\
    \ worry if you can’t work through the whole book in a day or two. Take your time,\
    \ and try to do the practice. You can check your work against examples posted\
    \ on the Web."
