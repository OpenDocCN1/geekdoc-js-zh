    # Providing navigation clues with text size


    The heading of the Chesapeake Bay Retriever page is made one size smaller than
    the heading of the home page. That’s because the CBR page is one step down in
    the site hierarchy.


    **Level 1: Dogs**

    (top level heading; **SIZE="+4"**)


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_32_1.png)


    **Level 2: Chesapeake Bay Retrievers**

    (second-level heading; **SIZE="+3"**)


    Making the heading of the CBR page smaller than the home page’s heading helps
    show people where they are in the site.'
