- md: '## Employ spacer GIFs


    > **Why use spacer GIFs?**


    Spacer GIFs are used to stretch table cells to an exact width. They are transparent,
    so they remain invisible regardless of the cell’s background color.


    A spacer GIF is used in the exercise below. It keeps the width of the left-hand
    cell constant, regardless of the size or resolution of the screen used to view
    it.


    1.  Go to **www.visibooks.com/advlout/pics** and save **spacer.gif** on your computer’s
    Desktop.

    2.  Below the top two tables, insert a third table just like the first table.

    3.  Insert **spacer.gif** in the left-hand cell. Give it a width of 100 and height
    of 1.


    ```

    <TD WIDTH="10%" BGCOLOR="#000099"><IMG SRC="spacer.gif" WIDTH="100" HEIGHT="1"></TD>

    ```


    **Tip:** Most spacer GIFs are 1x1 pixel, which load very quickly online. This
    one started out as 50x50 to make it easier to see and save.


    4.  Change the background color of the cell containing **spacer.gif** to bright
    yellow (**#ffff00**).

    5.  Put text in the right-hand cell so the page looks like this when viewed in
    the browser:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_141_0.png)


    6.  Set the browser to high resolution—1024x768 pixels. The page should look like
    this:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_141_1.png)


    Notice how the left-hand cells in the top and bottom tables stay the same width,
    regardless of the width of the browser used to view them.


    ## Insert a horizontal rule


    1.  Below the text in the right-hand cell, insert a `<P>` tag, then the tag for
    a horizontal rule:


    You can read our product reviews and also offer your own opinions and observations
    on high tech products.

    <P>

    <HR>


    2.  This generates a 3-D rule. To give it a cleaner look, add the attributes **NOSHADE**
    and **SIZE="1"** to the `<HR>` tag:


    <HR NOSHADE SIZE="1">


    3.  Place text below the horizontal rule so it looks like this when viewed in
    the browser:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_142_0.png)


    ## Specify page margins


    1.  In the `<BODY>` tag, add the **LEFTMARGIN**, **RIGHTMARGIN**, **TOPMARGIN**,
    **MARGINWIDTH** and **MARGINHEIGHT** attributes. Give them all a value of zero:


    ```html

    <BODY LEFTMARGIN="0" RIGHTMARGIN="0" TOPMARGIN="0" MARGINWIDTH="0" MARGINHEIGHT="0">

    ```


    > **Tip:** The **LEFTMARGIN**, **RIGHTMARGIN**, and **MARGINWIDTH** (along with
    **TOPMARGIN** and **MARGINHEIGHT**) attributes are redundant to account for browser
    differences: Internet Explorer recognizes **LEFTMARGIN**, **RIGHTMARGIN** and
    **TOPMARGIN**, while Netscape Navigator recognizes **MARGINWIDTH** and **MARGINHEIGHT**.


    2.  Specify a background color of white (`#ffffff`) for the cell containing the
    page''s text. Specify a background color of dark blue (`#000099`) for the page
    itself.


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_143_0.png)


    3.  Save the page and view it in the browser. When you’re done, it should look
    like this:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_144_0.png)


    ## Practice: Advanced layout


    1.  Give the navigation table (the one with Laptops, Cell Phones and PDAs) five
    cells.

    2.  Put | characters (on the same key as the backslash \ character on your keyboard)
    in the cells surrounding the one that contains Cell Phones.

    3.  Give the cells with the | characters a width of 1%, and center the | characters
    within the cells.

    4.  Color the | characters white. When you’re done, the page should look like
    the one at www.visibooks.com/advancedlayout:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_145_0.png)


    ## Practical JavaScript


    In this section, you’ll learn how to:


    -   Enable rollover graphics

    -   Open new windows

    -   Validate form input


    You’ll incorporate functions that look like this:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_146_0.png)


    Creating rollover graphic links


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_146_1.png)


    Opening new windows


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_146_2.png)


    Validating forms


    ## Enable rollover graphics


    What is JavaScript?


    JavaScript is a programming language that sits in the HTML code of a Web page.
    It’s not an industrial-strength language like C++, Java, or Perl that’s used to
    program Web servers. Rather, JavaScript is used to perform simple functions within
    Web pages.


    The following section shows you how to employ JavaScript’s three most useful functions.
    It won’t teach you how to write programs in JavaScript. Learning a programming
    language is just that: learning a new language, which can take months or years
    to master. Rather, you’ll learn how to obtain functioning JavaScript scripts and
    modify them to do what you want.


    This approach is fast and effective. There are thousands of JavaScript scripts
    available for free on the Web that perform anything you’d want to do in a Web
    page—all you have to do is customize them.


    Working with source code


    Sometimes you’ll see a Web page and say to yourself, “I wonder how they did that?”
    By viewing the page’s HTML and JavaScript source code, you can find out.


    You can also copy source code, paste it into pages you’re working on, and modify
    it. Since that’s so easy to do, source code for Web pages isn’t usually copyrighted.


    The following exercise shows you how to copy, paste, and modify an existing JavaScript
    to put rollover graphic links on your Web pages.


    ## View source code


    1.  Create a folder on your hard drive called “rollover,” at C:/rollover.

    2.  Using the browser, go to www.visibooks.com/advancedlayout.

    3.  View the page’s source code by clicking View, then Source.


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_148_0.png)


    ## Copy source code


    1.  A copy of Notepad with advancedlayout(1) in the title bar will appear. Select
    all the HTML, then copy it.


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_149_0.png)


    2.  Create a new blank page in Notepad and paste all the copied HTML code into
    it.

    3.  Save the page at C:\rollover as index.html.

    4.  Create a folder within the rollover folder called graphics: C:\rollover\graphics.

    5.  Go to www.visibooks.com/rolloverpics. Capture all six graphics there and save
    them in the graphics folder.

    6.  Go to **www.visibooks.com/rollover**. The graphics in the navigation bar are
    rollover links:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_150_0.png)


    7.  View its source code and highlight all the code between and including the
    **<SCRIPT>** and **</SCRIPT>** tags. It''s between the **<HEAD>** and **</HEAD>**
    tags:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_150_1.png)


    8.  Copy this JavaScript code.

    9.  Paste the JavaScript code between the **<HEAD>** and **</HEAD>** tags in index.html.


    ## Modify source code


    1.  You’ll notice that the names of the graphics specified in the JavaScript (laptops2.gif,
    laptops.gif, cellphones2.gif...) don’t correspond with the names of the graphics
    in your graphics folder.


    Modify the source code to specify the correct file names for your graphics:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_151_0.png)


    2.  Go back to **www.visibooks.com/rollover** in the browser, and view the page''s
    source code. Scroll down until you see the code for the second table, the one
    that defines the black navigation bar.

    3.  Highlight and copy the anchor tag with the **onMouseOver** and **onMouseOut**
    attributes, the closing anchor tag (`</a>`), and the image tag inside them. It
    links to laptops.html:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_152_0.png)


    4.  In index.html, get rid of the two cells with the | characters in them.'
  mdcn: '## 使用间隔 GIF 图片


    > **为什么使用间隔 GIF 图片？**


    间隔 GIF 图片用于将表格单元格拉伸到精确宽度。它们是透明的，因此无论单元格背景颜色如何，它们都保持不可见。


    下面的练习中使用了一个间隔 GIF 图片。无论用于查看它的屏幕大小或分辨率如何，它都能保持左侧单元格的宽度恒定。


    1.  前往 **www.visibooks.com/advlout/pics** 并将 **spacer.gif** 保存到您计算机的桌面上。

    2.  在顶部两个表格下方，插入第三个表格，与第一个表格相同。

    3.  在左侧单元格中插入 **spacer.gif**。将其宽度设为 100，高度设为 1。


    ```

    <TD WIDTH="10%" BGCOLOR="#000099"><IMG SRC="spacer.gif" WIDTH="100" HEIGHT="1"></TD>

    ```


    **提示：** 大多数间隔 GIF 图片是 1x1 像素，在线加载非常快。这个图片最初是 50x50，以便更容易查看和保存。


    4.  将包含 **spacer.gif** 的单元格背景颜色更改为亮黄色（**#ffff00**）。

    5.  在右侧单元格中放入文本，使页面在浏览器中查看时如下所示：


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_141_0.png)


    6.  将浏览器设置为高分辨率——1024x768 像素。页面应如下所示：


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_141_1.png)


    请注意，无论用于查看它们的浏览器宽度如何，顶部和底部表格中的左侧单元格都保持相同的宽度。


    ## 插入水平线


    1.  在右侧单元格的文本下方，插入一个 `<P>` 标签，然后是水平线的标签：


    您可以阅读我们的产品评论，也可以对高科技产品发表您自己的意见和看法。

    <P>

    <HR>


    2.  这会生成一条 3D 线条。为了使其外观更简洁，请在 `<HR>` 标签中添加 **NOSHADE** 和 **SIZE="1"** 属性：


    <HR NOSHADE SIZE="1">


    3.  在水平线下方放置文本，使其在浏览器中查看时如下所示：


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_142_0.png)


    ## 指定页边距


    1.  在 `<BODY>` 标签中，添加 **LEFTMARGIN**、**RIGHTMARGIN**、**TOPMARGIN**、**MARGINWIDTH**
    和 **MARGINHEIGHT** 属性。将它们的值都设为零：


    ```html

    <BODY LEFTMARGIN="0" RIGHTMARGIN="0" TOPMARGIN="0" MARGINWIDTH="0" MARGINHEIGHT="0">

    ```


    > **提示：** **LEFTMARGIN**、**RIGHTMARGIN** 和 **MARGINWIDTH**（以及 **TOPMARGIN** 和
    **MARGINHEIGHT**）属性是冗余的，以适应浏览器差异：Internet Explorer 识别 **LEFTMARGIN**、**RIGHTMARGIN**
    和 **TOPMARGIN**，而 Netscape Navigator 识别 **MARGINWIDTH** 和 **MARGINHEIGHT**。


    2.  为包含页面文本的单元格指定白色背景（`#ffffff`）。为页面本身指定深蓝色背景（`#000099`）。


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_143_0.png)


    3.  保存页面并在浏览器中查看。完成后，它应如下所示：


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_144_0.png)


    ## 练习：高级布局


    1.  给导航表格（包含笔记本电脑、手机和 PDA 的那个）五个单元格。

    2.  在包含手机的单元格周围的单元格中放置 | 字符（与键盘上的反斜杠 \ 字符在同一键上）。

    3.  将包含 | 字符的单元格宽度设为 1%，并将 | 字符在单元格内居中。

    4.  将 | 字符颜色设为白色。完成后，页面应如下所示，如 www.visibooks.com/advancedlayout：


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_145_0.png)


    ## 实用 JavaScript


    在本节中，您将学习如何：


    -   启用悬停图形

    -   打开新窗口

    -   验证表单输入


    您将整合如下所示的函数：


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_146_0.png)


    创建悬停图形链接


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_146_1.png)


    打开新窗口


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_146_2.png)


    验证表单


    ## 启用悬停图形


    什么是 JavaScript？


    JavaScript 是一种嵌入在网页 HTML 代码中的编程语言。它不是像 C++、Java 或 Perl 那样用于编程 Web 服务器的工业级语言。相反，JavaScript
    用于在网页内执行简单功能。


    以下部分将向您展示如何使用 JavaScript 最有用的三个函数。它不会教您如何用 JavaScript 编写程序。学习一门编程语言就是学习一门新语言，这可能需要数月或数年才能掌握。相反，您将学习如何获取可用的
    JavaScript 脚本并修改它们以实现您想要的功能。


    这种方法快速有效。网络上有成千上万的免费 JavaScript 脚本，可以执行您想在网页上做的任何事情——您所要做的就是自定义它们。


    使用源代码


    有时您会看到一个网页，然后对自己说：“我想知道他们是怎么做到的？”通过查看页面的 HTML 和 JavaScript 源代码，您可以找到答案。


    您还可以复制源代码，将其粘贴到您正在处理的页面中，并进行修改。由于这很容易做到，网页的源代码通常不受版权保护。


    以下练习向您展示如何复制、粘贴和修改现有的 JavaScript，以便在您的网页上放置悬停图形链接。


    ## 查看源代码


    1.  在您的硬盘驱动器上创建一个名为“rollover”的文件夹，路径为 C:/rollover。

    2.  使用浏览器，访问 www.visibooks.com/advancedlayout。

    3.  通过单击“查看”，然后单击“源代码”来查看页面的源代码。


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_148_0.png)


    ## 复制源代码


    1.  一个标题栏中带有 advancedlayout(1) 的记事本副本将出现。选择所有 HTML，然后复制它。


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_149_0.png)


    2.  在记事本中创建一个新的空白页面，并将所有复制的 HTML 代码粘贴到其中。

    3.  将页面保存在 C:\rollover，文件名为 index.html。

    4.  在 rollover 文件夹内创建一个名为 graphics 的文件夹：C:\rollover\graphics。

    5.  前往 www.visibooks.com/rolloverpics。捕获那里的所有六个图形并将它们保存在 graphics 文件夹中。

    6.  前往 **www.visibooks.com/rollover**。导航栏中的图形是悬停链接：


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_150_0.png)


    7.  查看其源代码，并突出显示 **<SCRIPT>** 和 **</SCRIPT>** 标签之间（包括这两个标签）的所有代码。它位于 **<HEAD>**
    和 **</HEAD>** 标签之间：


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_150_1.png)


    8.  复制此 JavaScript 代码。

    9.  将 JavaScript 代码粘贴到 index.html 中的 **<HEAD>** 和 **</HEAD>** 标签之间。


    ## 修改源代码


    1.  您会注意到 JavaScript 中指定的图形名称（laptops2.gif、laptops.gif、cellphones2.gif...）与您 graphics
    文件夹中的图形名称不对应。


    修改源代码以指定您图形的正确文件名：


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_151_0.png)


    2.  返回浏览器中的 **www.visibooks.com/rollover**，并查看页面的源代码。向下滚动，直到看到第二个表格的代码，即定义黑色导航栏的那个表格。

    3.  突出显示并复制带有 **onMouseOver** 和 **onMouseOut** 属性的锚点标签、结束锚点标签（`</a>`）以及它们内部的图像标签。它链接到
    laptops.html：


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_152_0.png)


    4.  在 index.html 中，删除包含 | 字符的两个单元格。'
