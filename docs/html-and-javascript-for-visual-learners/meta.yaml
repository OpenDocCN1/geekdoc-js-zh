  mdcn: "## 格式化表格\n\n1.  现在你将扩展表格。在记事本中，为 **<TABLE>** 标签添加 **WIDTH=\"100%\"** 属性：\n\
    \n```\n<BODY>\n<TABLE BORDER=1 WIDTH=\"100%\">\n<TR>\n<TD>Links</TD>\n<TD>Content</TD>\n\
    </TR>\n</TABLE>\n```\n\n2.  保存页面并在浏览器中查看。它应该看起来像这样：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_68_0.png)\n\
    \n## 百分比宽度与固定宽度表格\n\n使用表格布局页面时，将表格宽度设置为 100%。这样，页面内容就可以拉伸以填满整个显示器，无论显示器的分辨率如何。\n\
    \n如果你想让固定宽度表格在所有显示器上都适配，那么表格宽度就只能限制在 580 像素：\n\n**640 像素** 低分辨率显示器的宽度 **- 20 像素**\
    \ 浏览器偏移量：页面内容距离浏览器两侧的缩进距离 **- 40 像素** 20 像素用于垂直滚动条，另外 20 像素作为额外空间 **= 580 像素**\
    \ 可用于表格的宽度\n\n创建固定宽度表格的页面可以提供精确控制，但在更高分辨率的显示器上会浪费空间：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_69_0.png)\n\
    \n**页面：** 使用 580 像素宽的表格布局\n\n**用于查看页面的显示器：** 1280 像素宽\n\n3.  通过指定 BORDER=\"0\"\
    \ 来移除表格边框：\n\n```\n<BODY>\n<TABLE BORDER=\"0\" WIDTH=\"100%\">\n<TR>\n<TD>Links</TD>\n\
    <TD>Content</TD>\n</TR>\n</TABLE>\n```\n\n4.  通过向第一个 <TD> 标签添加属性 BGCOLOR=\"#CCCCCC\"\
    ，将第一个单元格设为浅灰色：\n\n```\n<BODY>\n<TABLE BORDER=\"0\" WIDTH=\"100%\">\n<TR>\n<TD\
    \ BGCOLOR=\"#CCCCCC\">Links</TD>\n<TD>Content</TD>\n</TR>\n</TABLE>\n```\n\n5.\
    \  保存页面并在浏览器中查看。它应该看起来像这样：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_70_0.png)\n\
    \n6.  你会注意到单词 \"Links\" 紧贴着左侧单元格的边缘。为了在单元格边缘和其内容之间添加 16 像素的边距，请向 **<TABLE>** 标签添加属性\
    \ **CELLPADDING=\"16\"**：\n\n```\n<BODY>\n<TABLE BORDER=\"0\" WIDTH=\"100%\" CELLPADDING=\"\
    16\">\n<TR>\n<TD BGCOLOR=\"#CCCCCC\">Links</TD>\n<TD>Content</TD>\n</TR>\n</TABLE>\n\
    ```\n\n7.  要消除单元格之间的间距，请向 **<TABLE>** 标签添加属性 **CELLSPACING=\"0\"**：\n\n```\n<BODY>\n\
    <TABLE BORDER=\"0\" WIDTH=\"100%\" CELLPADDING=\"16\" CELLSPACING=\"0\">\n<TR>\n\
    <TD BGCOLOR=\"#CCCCCC\">Links</TD>\n<TD>Content</TD>\n</TR>\n</TABLE>\n```\n\n\
    8.  保存页面并在浏览器中查看。它应该看起来像这样：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_71_0.png)\n\
    \n## 创建基于表格的主页\n\n1.  在硬盘驱动器上的 Travel 文件夹内创建一个名为 \"graphics\" 的文件夹。\n2.  访问 www.visibooks.com/travelpic。捕获那里的图形\
    \ (uva.gif) 并将其保存在 graphics 文件夹中。\n3.  在主页的右侧单元格中，将单词 \"Content\" 替换为标题 \"**Traveling\
    \ South**\"。将标题大小设为 +3，使用 Verdana 字体，并加粗。\n4.  在标题下方的新段落中插入该图形。\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_72_0.png)\n\
    \n5.  在图形下方，将以下句子作为新段落添加：\n\n如果你有几周的假期，你可能想去南方看看。里士满、威廉斯堡和查尔斯顿都是美丽的城市。\n\n将文本设为\
    \ arial 字体，大小 -1。\n\n6.  在左侧单元格中，将单词 \"Links\" 替换为本站主要部分的名称：Richmond, Williamsburg\
    \ 和 Charleston。用 <P> 标签分隔它们，并使用 arial 字体，大小 -1。\n\n页面的代码可以像这样：\n\n```\n<TABLE\
    \ BORDER=\"0\" WIDTH=\"100%\" CELLPADDING=\"16\" CELLSPACING=\"0\">\n<TR>\n<TD\
    \ BGCOLOR=\"#CCCCCC\">\n<FONT FACE=\"arial\" SIZE=\"-1\">\nRichmond\n<P>\nWilliamsburg\n\
    <P>\nCharleston\n</FONT>\n</TD>\n<TD>\n<FONT FACE=\"verdana\" SIZE=\"+3\"><B>Traveling\
    \ South</B></FONT>\n<P>\n<IMG SRC=\"graphics/uva.gif\">\n<P>\n<FONT FACE=\"arial\"\
    \ SIZE=\"-1\">If you've got a couple of weeks for vacation, you might want to\
    \ visit the South. Richmond, Williamsburg, and Charleston are all beautiful cities.</FONT>\n\
    </TD>\n</TR>\n</TABLE>\n```\n\n7.  保存页面并在浏览器中查看。它应该看起来像这样：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_74_0.png)\n\
    \n8.  要将左侧单元格的内容带到单元格顶部，请向第一个 <TD> 标签添加属性 VALIGN=\"top\"。（为了全面起见，也向第二个 <TD> 标签添加该属性）：\n\
    \n```\n<TABLE BORDER=\"0\" WIDTH=\"100%\"\nCELLPADDING=\"16\" CELLSPACING=\"0\"\
    >\n<TR>\n<TD BGCOLOR=\"#CCCCCC\" VALIGN=\"top\">\n<FONT FACE=\"arial\" SIZE=\"\
    -1\">\nRichmond\n<P>\nWilliamsburg\n<P>\nCharleston\n</FONT>\n</TD>\n<TD VALIGN=\"\
