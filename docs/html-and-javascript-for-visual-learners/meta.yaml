    # Link to an external site using frames


    # How to use frames


    “Frames” are a way to put more than one Web page at a time on a computer’s screen:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_96_0.png)


    A live example of frames can be seen at www.visibooks.com/frames.


    Many sites that used frames have now eliminated them, returning to single-page
    layouts. That’s because frames have serious drawbacks:


    +   - Frames are difficult to update. Every screen involves three or more pages
    to keep track of: the frameset itself, and at least two others to go in the frames.

    - Frame navigation is tricky. Links require special “targets” that go from page
    to frame.

    - Frames often require people to scroll annoyingly in more than one place.


    However, frames are useful for one thing: they allow a user to get back to a site
    with one click while clicking through other sites linked to it. An example of
    this can be seen in the external links at www.charuhas.com/sites.html.


    The following exercise demonstrates how to use frames to provide convenient links
    to external sites.'
