  - '[PAGE 20]


    3. View the page in the browser. Click the browser’s Refresh button, and the page
    should look like this:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_20_0.png)


    ## Web fonts


    When text is viewed on a computer, only fonts installed on the computer can be
    seen. For instance, if someone created a page that specified the Tekton font,
    almost no one viewing it would see it in Tekton because very few computers have
    that font installed. Computers without Tekton would display text in the default
    font: Times New Roman.


    All Windows computers have the Arial font installed. Windows 95 and later computers
    have Verdana. Macintoshes have Helvetica, the font that Arial is based upon.


    To cover all bases, specify multiple fonts:


    `<FONT FACE="verdana,arial,helvetica">`


    **Tip:** If a page doesn’t look like it’s supposed to—or nothing shows up at all—check
    the HTML code you’ve written. You might have left out a quote or made some other
    small mistake. Something that seems insignificant can wreck a page:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_20_1.png)'
- md: '## Change text size


    1. In Notepad, add the **SIZE="+4"** attribute to the **\<FONT\>** tag:


    **\<FONT FACE="arial" SIZE="+4"\>Dogs Home Page\</FONT\>**


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_21_0.png)


    2. Save the page and view it in the browser. It should look like this:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_21_1.png)


    ## Change text weight


    1. In Notepad, add the \<B\> tag in front of the words “Dogs Home Page” and close
    it after them:


    ```

    <FONT FACE="arial" SIZE="+4"><B>Dogs Home Page</B></FONT>

    ```


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_22_0.png)


    **Tip:** When inserting multiple tags, arrange them in mirror-image order. The
    tags and text above are a good example: since it starts with the \<FONT\> tag,
    it ends with the \</FONT\> tag. Tags that aren’t arranged in mirror-image order
    can cause display problems in some browsers.


    2. Save the page and view it in the browser. It should look like this:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_22_1.png)


    ## Change text color


    1. In the \<FONT\> tag, add the attribute COLOR="red":


    ```

    <FONT FACE="arial" SIZE="+4" COLOR="red">

    ```


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_23_0.png)


    2. Save the page. View it in the browser, and the text should show up red.


    3. Change the text color to black, then save the page.


    ```

    <FONT FACE="arial" SIZE="+4" COLOR="black">

    ```


    ## Align text


    1. Beneath the present text and tags, insert a \<P\> tag to begin a new paragraph.

    2. Beneath the \<P\> tag, insert the tag \<FONT FACE="arial" SIZE="-1"\> and the
    words “These are my favorite breeds of dog:”


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_24_0.png)


    3. Within the \<P\> tag, add the attribute ALIGN="right":

    4. Add a closing \</P\> tag after the new paragraph.


    ```

    <P ALIGN="right">

    <FONT FACE="arial" SIZE="-1">These are my favorite breeds of dog:

    </P>

    ```


    **Tip:** Usually a `<P>` tag requires no closing `</P>` tag in HTML, but in this
    case the `ALIGN="right"` attribute is used. The closing `</P>` tag after the paragraph
    keeps the browser from right-aligning whatever is beneath it.


    5. Save the page, then view it in the browser. It should look like this:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_25_0.png)


    6. Remove the `ALIGN="right"` attribute from the `<P>` tag.


    **Tip:** To generate a single-line break rather than the double-space a `<P>`
    tag generates, use the `<BR>` tag. Putting a `<BR>` or “Break” tag between two
    lines of text will bump the second line down to the next line:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_25_1.png)


    ```

    <FONT FACE="arial" SIZE="+4"><B>Dogs Home Page</B></FONT>

    <BR>

    <FONT FACE="arial" SIZE="-1">These are my favorite breeds of dog:</FONT>

    ```


    ## Indent text


    1. Below the text, “These are my favorite breeds of dog;” insert three new paragraphs:


    ```

    <P>Chesapeake Bay Retriever</P>

    <P>German Shepherd</P>

    <P>Yorkshire Terrier</P>

    ```


    2. Enclose these paragraphs in Unordered List tags to indent them:


    ```

    <UL>

    <P>Chesapeake Bay Retriever</P>

    <P>German Shepherd</P>

    <P>Yorkshire Terrier</P>

    </UL>

    ```


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_26_0.png)


    3. Save the page and view it in the browser. It should look like this:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_27_0.png)


    **Tip:** Notice how all the text below the `<FONT FACE="arial" SIZE="-1">` tag
    looks the same. It will stay that way until the closing `</FONT>` tag is inserted.


    ## Create lists


    1. With the three breeds of dog, replace the \<P\> and \</P\> tags with \<LI\>
    tags to generate bullets in front of the text that follows:


    ```

    <UL>

    <LI>Chesapeake Bay Retriever

    <LI>German Shepherd

    <LI>Yorkshire Terrier

    </UL>

    ```


    2. Save the page and view it in the browser. It should look like this:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_28_0.png)


    ## Practice: Format pages and text


    A. Why are the most common font choices Arial, Verdana, and Helvetica?


    B. What kinds of computers have the font Arial installed? Which have Helvetica
    instead?


    1. Change the title of the home page to “My Favorite Dogs.”

    2. Change the bulleted list to a numbered list.

    3. Change the numbered list back to a bulleted list.

    4. Make the list items bold. When you view it in the browser, the page should
    look like this:


    **Tip:** Use `<OL>` instead of `<UL>` to generate a numbered list.


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_29_0.png)


    Answers

    A. Those are the fonts that most Windows computers have installed.

    B. Windows computers have Arial, Macs have Helvetica.


    ## Create links to new pages


    ### Step 1: Create a new page


    1. In Notepad, change the title of the page to “Chesapeake Bay Retrievers,” then
    take out all the tags and text between the \<BODY\> and \</BODY\> tags.

    2. On the menu bar, click File, then Save As.

    3. Save the new page with the file name chesapeake.html.


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_30_0.png)


    **Tip:** Remember to Save as type: All Files.


    ### File names for the Web


    Most Web servers are Unix- or Linux-based, which don’t deal cleanly with spaces
    in file names. For instance if you name a file fido page.html, it may show up
    in the URL box of the browser as fido%20page.html.


    Also, Web servers are case-sensitive, so keeping file names lower-case eliminates
    a potential source of mistakes.


    Make all file names in a Web site—pages, graphics and folders—lower-case, with
    no spaces.


    Correct file name: german.html


    Incorrect: German Shepherds.html


    4. Beneath the \<BODY\> tag, type “Chesapeake Bay Retrievers.” This is the page
    heading. Make it verdana, bold, size +3:


    ```

    <BODY>

    <FONT FACE="verdana" SIZE="+3"><B>Chesapeake Bay Retrievers</B></FONT>

    </BODY>

    ```


    5. Save the page.


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_32_0.png)


    ### Providing navigation clues with text size


    The heading of the Chesapeake Bay Retriever page is made one size smaller than
    the heading of the home page. That’s because the CBR page is one step down in
    the site hierarchy.


    **Level 1: Dogs**

    (top level heading; **SIZE="+4"**)


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_32_1.png)


    **Level 2: Chesapeake Bay Retrievers**

    (second-level heading; **SIZE="+3"**)


    Making the heading of the CBR page smaller than the home page’s heading helps
    show people where they are in the site.


    ### Step 2: Link to the new page


    1. Open the home page (index.html) in Notepad. In front of the first item, Chesapeake
    Bay Retriever, insert an anchor tag. Then close the anchor tag:


    ```

    <LI><B><A HREF="chesapeake.html">Chesapeake Bay Retriever</A></B>

    ```


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_33_0.png)


    > **How an anchor tag works**


    Anchor tags create a clickable link to another page.


    A page with this file name... ...is linked to these words.


    `<a href="filename.html">New Page</a>`


    2. Save the home page and view it in the browser. The words **Chesapeake Bay Retriever**
    should be a link, and the page should look like this:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_34_0.png)


    3. Click on the **Chesapeake Bay Retriever** link. The Chesapeake Bay Retriever
    page should appear in the browser.


    ## Practice: Create links to new pages


    A. Why should file names be lower-case and free of spaces?


    B. Why should the headings on section pages (Chesapeake Bay Retrievers, German
    Shepherds) be smaller than the heading of the home page?


    1. Create new pages for German Shepherds and Yorkshire Terriers.


    | Page | Title | File Name |

    |---|---|---|

    | German Shepherds | German Shepherds | german.html |

    | Yorkshire Terriers | Yorkshire Terriers | yorkshire.html |


    2. On the home page, link the words German Shepherd and Yorkshire Terrier to their
    pages.


    3. On the home page, remove the words “**Home Page**” after “**Dogs.**”


    4. On the Chesapeake Bay Retriever, German Shepherd and Yorkshire Terrier pages,
    put the page headings in the same font and weight as the home page (Verdana; bold).


    5. Make the page headings of these pages one size smaller than the heading on
    the home page, just like on the Chesapeake Bay Retriever page.


    6. Save all pages and click on the home page’s links to make sure they work.


    Answers

    A. Because most Web servers deal better with lower-case, spaceless file names.

    B. It provides site users with a visual distinction between first-level (home)
    pages and second-level (main section) pages.'
