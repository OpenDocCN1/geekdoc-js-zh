    An HSPACE of 12 creates a horizontal space of 12 pixels around the graphic that
    nothing can occupy


    A Border of 1 creates a 1-pixel border around the graphic


    5. Move your cursor onto the graphic. The “Alt” text—an alternative text description
    of the graphic—should pop up.


    The text should be aligned with the top of the graphic.


    **Tip:** *If you know the dimensions of a graphic, you can make it load faster
    by specifying its width and height in pixels:*


    ```

