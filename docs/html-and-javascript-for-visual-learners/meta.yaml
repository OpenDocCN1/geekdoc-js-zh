    \ function Contact().\n\n```\n<FONT FACE=\"arial\" SIZE=\"+1\"><B><A HREF=\"javascript:Contact()\"\
    >Open new window with form inside</A></B></FONT>\n```\n\n> Tip: A function is\
    \ a job performed by a program. The one above is named Contact(). Its job is to\
    \ open the window that allows people to contact Visibooks.\n\n- 8. Copy the anchor\
    \ tag, then paste it into index.html so it links the second sentence to the\n\n\
    From this:\n\n```\n<A HREF=\"infoform.html\">Get more information about Western\
    \ travel mailed to you</A>\n```\n\nTo this:\n\n```\n<A HREF=\"javascript:Contact()\"\
    >Get more information about Western travel mailed to you</A>\n```\n\n- 9. Save\
    \ index.html and view it in the browser.\n- 10. Click on the linked sentence.\
    \ A new window should pop up with the form inside:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_158_0.png)\n\
    \n**Tip:** To change the size and appearance of the window that pops up, change\
    \ the values after `window.open`:\n\n```\nOpenNewWindow = window.open('contact.html',\
    \ 'help', 'toolbar=no, location=0, directories=no, status=yes, menubar=0, scrollbars=yes,\
    \ resizable=yes, width=300, height=350')\n```\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_158_1.png)\n\
    \n## Validate form input\n\n### See how it works\n\n- 1. In Notepad, open infoform.html\
    \ in the Travel West site.\n- 2. In the browser, go to www.visibooks.com/validate.\n\
    - 3. Click on the Send me info button. When you do, an alert window should appear.\
    \ When you enter your name and click the button, another alert window should appear\
    \ that reads, “Please input your address.” This also works with the e-mail input.\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_159_0.png)\n\n### Insert the validation\
    \ script\n\n- 1. View the source of the page at www.visibooks.com/validate, and\
    \ copy the JavaScript between the <HEAD> tags:\n\n```\n<script>\n<!--\nfunction\
    \ validate()\n{\nif (document.info.name.value==\"\")\n{\nalert (\"Please input\
    \ your name.\")\nreturn false\n}\nif (document.info.address.value==\"\")\n{\n\
    alert (\"Please input your address.\")\nreturn false\n}\nif (document.info.email.value==\"\
    \")\n{\nalert (\"Please input your e-mail address.\")\nreturn false\n}\n}\n//\
    \ -->\n</script>\n```\n\n> Comment tags hide the script from older, non-JavaScript\
    \ capable browsers so they don't display it\n\n**Tip:** Here's a diagram that\
    \ explains the if statement variables:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_160_0.png)\n\
    \n- 2. Paste it between the <HEAD> tags in infoform.html.\n\n### Modify the <FORM>\
    \ tag\n\n- 1. Add a **NAME** attribute to the `<FORM>` tag. Name the form “info.”\n\
    \n```html\n<FORM NAME=\"info\" METHOD=\"POST\"\naction=\"http://www.yourserver.com/cgi-bin/formmail.pl\"\
    >\n```\n\n- 2. Add the attribute **ONSUBMIT** to the `<FORM>` tag. Tell the form\
    \ that when the submit button is clicked, perform the function **return validate()**:\n\
    \n```html\n<FORM NAME=\"info\" METHOD=\"POST\"\nONSUBMIT=\"return validate()\"\
    \naction=\"http://www.yourserver.com/cgi-bin/formmail.pl\">\n```\n\n- 3. Save\
    \ the page. Notice how the JavaScript’s if statement input variables have the\
    \ same name as the form’s input fields:\n\n```\n<script>\n<!--\nfunction validate()\n\
    {\nif(document.info.name.value==\"\")\n{\nalert (\"Please input your name.\")\n\
    return false\n}\nif(document.info.address.value==\"\")\n{\nalert (\"Please input\
    \ your address.\")\nreturn false\n}\nif(document.info.email.value==\"\")\n{\n\
    alert (\"Please input your e-mail address.\")\nreturn false\n}\n}\n// -->\n</script>\n\
    ```\n\n```\n<TABLE WIDTH=\"50%\"\nCELLPADDING=\"4\"\nBORDER=\"0\"><TR><TD\nWIDTH=\"\
    5%\"><P\nALIGN=\"right\">Name:</TD>\n<TDWIDTH=\"45%\"><INPUT\nTYPE=\"text\" NAME=\"\
    name\"\nSIZE=\"20\"></TD></TR>\n<TD><P ALIGN=\"right\">Address:</TD>\n<TD><INPUT\
    \ TYPE=TEXT\nNAME=\"address\" SIZE=\"20\">\n</TD></TR>\n<TD><P ALIGN=\"right\"\
    >E-\nmail:</TD><TD><INPUT TYPE=\"text\"\nNAME=\"email\" SIZE=\"20\">\n</TD></TR><TD></TD><TD><INPUT\n\
    TYPE=\"submit\" VALUE=\"Send me\ninfo\"></TD></TR></TABLE>\n```\n\n- 4. View infoform.html\
    \ in the browser. It should look and work like the form at **www.visibooks.com/validate**.\n\
    \n## Additional Resources\n\n**Webmonkey (www.webmonkey.com)**\nA how-to site\
    \ for people building Web sites, filled with excellent tutorials and resources.\n\
    \n**EchoEcho (www.echoecho.com)**\nEven more tutorials than Webmonkey, and all\
    \ clear and detailed. Contains helpful statistics on browser usage, monitor settings,\
    \ platforms, and other technology used to view Web pages.\n\n**Project Cool (www.projectcool.com)**\n\
    Knowledge, guidance and inspiration for people building Web sites. It includes\
    \ a good style sheet guide at projectcool.com/developer/reference/css_style.html.\n\
    \n**Web Review (www.webreview.com)**\nA sharp and informative site for Web developers,\
    \ with sections on Authoring, Design, Development, E-Commerce, Multimedia, and\
    \ Back-End Web server Programming.\n\n**HTML Help (www.htmlhelp.com)**\nGood resource\
    \ site with lots of information on style sheets and HTML technical standards.\
    \ Includes online tools such as an HTML validator, link checker, and ASCII character\
    \ guide.\n\n**HTML & XHTML: The Definitive Guide (book)**\nChuck Musciano, Bill\
    \ Kennedy, O’Reilly; ISBN: 059600026X\nLike most O’Reilly books, geared towards\
    \ programmers. A comprehensive resource for HTML, but better yet, a guide to making\
