  md: '# Insert META tags


    > **META tags**


    META tags are HTML tags that can include a description of the page, as well as
    “keywords that provide clues to its content. META tags make a page easier to find
    and index by search engines.


    META tags don’t show up on a Web page. Rather, they reside unseen in its HTML
    code.


