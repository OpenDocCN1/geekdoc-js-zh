- md: "## Showing “you are here”\n\nA site’s navigational system should show people\
    \ two things: where they are, and where they can go.\n\nTo show people where they\
    \ are, make the link corresponding to the current page into plain text. This lets\
    \ users know that if they can’t go to that page, they must be looking at it.\n\
    \nHome | **Chesapeake Bay Retrievers** | German Shepherds | Yorkshire Terriers\n\
    \n↑\n**You are here**\n\nMaking the text bold reinforces the “you are here” message.\n\
    \n## Use graphics as links\n\n1. In Notepad, open the home page. Below the bulleted\
    \ list of links, in a new paragraph, insert the Chesapeake Bay Retriever, German\
    \ Shepherd and Yorkshire Terrier graphics:\n\n    ```html\n    <IMG SRC=\"graphics/chessie.gif\"\
    >\n    <IMG SRC=\"graphics/shepherds.gif\">\n    <IMG SRC=\"graphics/yorkie.gif\"\
    >\n    ```\n\n2. Enclose the first image tag within anchor tags that link it to\
    \ the Chesapeake Bay Retriever page:\n\n    ```html\n    <A HREF=\"chesapeake.html\"\
    ><IMG SRC=\"graphics/chessie.gif\"></A>\n    ```\n\n3. Save the page, then preview\
    \ it in the browser. When you click on the Chesapeake Bay Retriever graphic, it\
    \ should take you to the Chesapeake Bay Retriever page.\n\n4. Go back to Notepad\
    \ and add the **BORDER=\"0\"** attribute to the first image tag:\n\n    ```html\n\
    \    <A HREF=\"chesapeake.html\"><IMG SRC=\"graphics/chessie.gif\" BORDER=\"0\"\
    ></A>\n    ```\n\n5. Save the page and view it in the browser again. The blue\
    \ link border around the Chesapeake Bay Retriever graphic should be gone.\n\n\
    ## Practice: Create a navigation system\n\nA. What’s a good way to show site users\
    \ “You are here?”\n\n**Task:** To make your Dogs site look like the site at **www.visibooks.com/dogs**.\n\
    \n1. In Notepad, open the German Shepherds page, german.html.\n2. Following the\
    \ Home link, type:\n   | Chesapeake Bay Retrievers | German Shepherds |\n   |\
    \ Yorkshire Terriers |\n3. Make the words German Shepherds bold.\n4. Link the\
    \ words Chesapeake Bay Retrievers and Yorkshire Terriers to their corresponding\
    \ pages.\n5. Save the page.\n6. Using the same system, create navigation links\
    \ for the Yorkshire Terriers page. Then save the page.\n7. On the home page, link\
    \ the German Shepherds graphic to the German Shepherds page. Do the same for the\
    \ Yorkshire Terriers graphic.\n8. Take out the link borders of these graphics.\n\
    9. When finished, preview your Dogs site in the browser. It should look like the\
    \ site at **www.visibooks.com/dogs**.\n\n**Answers**\n\nA. Make the link corresponding\
    \ to the current page bold, and plain text (no longer a link).\n\n## Change page,\
    \ link colors\n\n### Change background color of page\n\n1. Open the home page\
    \ in Notepad.\n2. In the `<BODY>` tag, add the attribute `BGCOLOR=\"#ffffcc\"\
    `:\n   ```html\n   <BODY BGCOLOR=\"#ffffcc\">\n   ```\n3. Save the page and view\
    \ it in the browser. The background color of the page should now be pale yellow.\n\
    \n### Hexadecimal colors\n\nThe **ffffcc** that stands for pale yellow is a hexadecimal\
    \ color. Hexadecimal colors allow you to specify colors more precisely than you\
    \ can with words. For example, you could use the attribute **BGCOLOR=yellow**\
    \ in the body tag and the page background would turn bright yellow, but if you\
    \ used **BGCOLOR=pale yellow**, that wouldn’t work.\n\nFor shades of color, hexadecimals\
    \ must be used. They work like this:\n\nComputers show color as a mix of red,\
    \ green and blue. In hexadecimal colors, the first pair of letters or numbers\
    \ signify red, the second pair signify green, and the third pair signify blue:\n\
    \n| Red | Green | Blue |\n| --- | --- | --- |\n| **ff** | **ff** | **cc** |\n\n\
    ## Hexadecimal colors, continued\n\nThe color values go from the maximum amount\
    \ of color (ff) to no color at all (00):\n\n| Max | Mid-range | None |\n|---|---|---|\n\
    | ff | cc | 99 | 66 | 33 | 00 |\n\nNavy blue would be shown in hexadecimals as\
    \ no red (00), no green, (00), and a little bit of blue (66):\n\n```\n000066\n\
    ```\n\nA list of hexadecimal color codes is posted at:\n\nwww.webmonkey.com/reference/color_codes\n\
    \n## Change link colors\n\n1. In the home page, add the attribute `LINK=\"#ff0000\"\
    ` to the `<BODY>` tag:\n\n    ```html\n    <BODY BGCOLOR=\"#ffffcc\" LINK=\"#ff0000\"\
    >\n    ```\n\n    This makes the links on the page show up in red.\n\n2. Add the\
    \ attribute `VLINK=\"#00ff00\"` to the `<BODY>` tag:\n\n    ```html\n    <BODY\
    \ BGCOLOR=\"#ffffcc\" LINK=\"#ff0000\" VLINK=\"#00ff00\">\n    ```\n\n    This\
    \ makes visited links show up in green.\n\n    > **Tip:** Visited links are links\
    \ to pages that have already been viewed in the browser.\n\n3. Save the page and\
    \ view it in the browser. The links on the page should either be red or green.\n\
    \n### Consistent link colors\n\nLink colors should be consistent throughout a\
    \ Web site. If the links on one page are red, they should be red on every page.\n\
    \nLearning that “red equals link” once is much easier for people than having to\
    \ figure out the link color for each page or section of a site.\n\n## Practice:\
    \ HTML Basics\n\n**Task:** To create a Web site about cats that looks like the\
    \ site at www.visibooks.com/cats.\n\n1. Create a new home page and title it “The\
    \ Wonderful World of Cats.”\n2. Save it in a new folder on the C:\\ drive called\
    \ Cats:\n   ```\n   C:\\Cats\n   ```\n3. Make the heading of the page read “The\
    \ Wonderful World of Cats.”\n4. Below the main heading on the home page, insert\
    \ a bulleted list:\n   - House Cats\n   - Alley Cats\n   - Big Cats\n5. Make these\
    \ items arial, with a size of -1.\n6. Link each list item to a new page about\
    \ it. For instance, link “House Cats” to a new page about house cats with file\
    \ name housecats.html.\n7. On each of these new pages, put a descriptive heading\
    \ at the top of the page. For instance, the words “House Cats” at the top of the\
    \ house cats page.\n8. Put the main headings of all four pages in the Arial font.\
    \ Make them bold. Give the home page’s heading a size of +3. Give the headings\
    \ of the other pages a size of +2.\n9. On each page, write a descriptive sentence\
    \ or two in a new paragraph below the main heading. Make it arial, with a size\
    \ of -1.\n10. Go to www.visibooks.com/catpics and get the three cat graphics there.\
    \ Put them in a folder called “graphics” within the C:\\Cats folder.\n11. Insert\
    \ the appropriate graphic on each of the 3 pages between the main heading and\
    \ the descriptive text below.\n12. Align each graphic left, then specify vspace\
    \ of 4 and hspace of 16.\n13. Link each of the three “cat” pages back to the home\
    \ page, and to each other. On each page, make the “you are here” link into bold,\
    \ plain text.\n14. Make the background color of each page light grey.\n15. Make\
    \ the link color on each page bright red. Make the visited link color orange.\n\
    16. Preview the site in the browser. It should look like the site at www.visibooks.com/cats.\n\
    \n## Layout & Navigation\n\nIn this section, you’ll learn how to:\n\n- Lay out\
    \ pages using tables\n- Create navigation bars\n- Add subsections to site\n- Place\
    \ tables within tables\n- Link to an external site using frames\n\nYou’ll build\
    \ a site that looks like this:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_62_0.png)\n\
    \n## Lay out pages using tables\n\n### Tables and Web page layout\n\nAlmost all\
    \ professional-quality Web sites are laid out using tables. Just like a spreadsheet\
    \ has cells that contain numbers, a table on a Web page has cells that contain\
    \ links, graphics, and text.\n\nThe lines on this page clearly show its layout\
    \ with table cells:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_63_0.png)\n\n\
    ## Create a table\n\n1. Create a new folder on the C:\\ drive called “Travel.”\n\
    \n2. In Notepad, create a home page (file name index.html) titled “Traveling Down\
    \ South.” Save it in the Travel folder.\n\n    > **Tip:** Make sure that your\
    \ new home page has the correct file name—index.html—and all necessary tags:\n\
    \n    ```html\n    <HTML>\n    <HEAD>\n    <!--Created by Your Name-->\n    </HEAD>\n\
    \    <TITLE>\n    Traveling Down South\n    </TITLE>\n    <BODY>\n    </BODY>\n\
    \    </HTML>\n    ```\n\n3. You’re going to create a simple one-row, two-cell\
    \ table that looks like this:\n\n    | links | content |\n\n4. The first step\
    \ is to begin the table. Below the `<BODY>` tag, begin your table with the `<TABLE>`\
    \ tag:\n\n    ```html\n    <BODY>\n    <TABLE>\n    ```\n\n5. Below the `<TABLE>`\
    \ tag, start a row with the `<TR>` (Table Row) tag:\n\n    ```html\n    <BODY>\n\
    \    <TABLE>\n    <TR>\n    ```"
  mdcn: "## 显示“您在这里”\n\n网站的导航系统应向用户展示两件事：他们当前所在的位置，以及他们可以前往的位置。\n\n要向用户展示他们当前所在的位置，请将对应当前页面的链接设置为纯文本。这样用户就知道，如果他们无法跳转到该页面，那么他们一定正在浏览该页面。\n\
    \n首页 | **切萨皮克湾寻回犬** | 德国牧羊犬 | 约克夏梗犬\n\n↑\n**您在这里**\n\n将文本设置为粗体可以强化“您在这里”的信息。\n\
    \n## 将图形用作链接\n\n1.  在记事本中打开主页。在项目符号链接列表下方的新段落中，插入切萨皮克湾寻回犬、德国牧羊犬和约克夏梗犬的图形：\n\n\
    \    ```html\n    <IMG SRC=\"graphics/chessie.gif\">\n    <IMG SRC=\"graphics/shepherds.gif\"\
    >\n    <IMG SRC=\"graphics/yorkie.gif\">\n    ```\n\n2.  将第一个图像标签包裹在锚点标签内，使其链接到切萨皮克湾寻回犬页面：\n\
    \n    ```html\n    <A HREF=\"chesapeake.html\"><IMG SRC=\"graphics/chessie.gif\"\
    ></A>\n    ```\n\n3.  保存页面，然后在浏览器中预览。当您点击切萨皮克湾寻回犬图形时，它应该会带您跳转到切萨皮克湾寻回犬页面。\n\n\
    4.  返回记事本，为第一个图像标签添加 **BORDER=\"0\"** 属性：\n\n    ```html\n    <A HREF=\"chesapeake.html\"\
    ><IMG SRC=\"graphics/chessie.gif\" BORDER=\"0\"></A>\n    ```\n\n5.  保存页面并再次在浏览器中查看。切萨皮克湾寻回犬图形周围的蓝色链接边框应该消失了。\n\
    \n## 练习：创建导航系统\n\nA. 向网站用户显示“您在这里”的好方法是什么？\n\n**任务：** 使您的 Dogs 网站看起来像 **www.visibooks.com/dogs**\
    \ 网站。\n\n1.  在记事本中打开德国牧羊犬页面 german.html。\n2.  在“首页”链接之后，输入：\n    | 切萨皮克湾寻回犬 |\
    \ 德国牧羊犬 |\n    | 约克夏梗犬 |\n3.  将“德国牧羊犬”这几个字设置为粗体。\n4.  将“切萨皮克湾寻回犬”和“约克夏梗犬”这几个字链接到它们对应的页面。\n\
    5.  保存页面。\n6.  使用相同的系统，为约克夏梗犬页面创建导航链接。然后保存页面。\n7.  在主页上，将德国牧羊犬图形链接到德国牧羊犬页面。对约克夏梗犬图形执行相同操作。\n\
    8.  去掉这些图形的链接边框。\n9.  完成后，在浏览器中预览您的 Dogs 网站。它应该看起来像 **www.visibooks.com/dogs**\
    \ 网站。\n\n**答案**\n\nA. 将对应当前页面的链接设置为粗体，并且是纯文本（不再是链接）。\n\n## 更改页面、链接颜色\n\n### 更改页面背景颜色\n\
    \n1.  在记事本中打开主页。\n2.  在 `<BODY>` 标签中，添加属性 `BGCOLOR=\"#ffffcc\"`：\n    ```html\n\
    \    <BODY BGCOLOR=\"#ffffcc\">\n    ```\n3.  保存页面并在浏览器中查看。页面的背景颜色现在应该是浅黄色。\n\n\
    ### 十六进制颜色\n\n代表浅黄色的 **ffffcc** 是一种十六进制颜色。十六进制颜色允许您比使用文字更精确地指定颜色。例如，您可以在 body\
    \ 标签中使用属性 **BGCOLOR=yellow**，页面背景将变为亮黄色，但如果您使用 **BGCOLOR=pale yellow**，那将不起作用。\n\
    \n对于颜色的深浅，必须使用十六进制。它们的工作原理如下：\n\n计算机通过混合红色、绿色和蓝色来显示颜色。在十六进制颜色中，第一对字母或数字表示红色，第二对表示绿色，第三对表示蓝色：\n\
    \n| 红色 | 绿色 | 蓝色 |\n| --- | --- | --- |\n| **ff** | **ff** | **cc** |\n\n## 十六进制颜色（续）\n\
    \n颜色值从最大颜色量 (ff) 到完全没有颜色 (00)：\n\n| 最大 | 中等 | 无 |\n|---|---|---|\n| ff | cc |\
    \ 99 | 66 | 33 | 00 |\n\n海军蓝在十六进制中表示为无红色 (00)、无绿色 (00) 和少量蓝色 (66)：\n\n```\n000066\n\
    ```\n\n十六进制颜色代码列表发布在：\n\nwww.webmonkey.com/reference/color_codes\n\n## 更改链接颜色\n\
    \n1.  在主页中，为 `<BODY>` 标签添加属性 `LINK=\"#ff0000\"`：\n\n    ```html\n    <BODY BGCOLOR=\"\
    #ffffcc\" LINK=\"#ff0000\">\n    ```\n\n    这会使页面上的链接显示为红色。\n\n2.  为 `<BODY>`\
    \ 标签添加属性 `VLINK=\"#00ff00\"`：\n\n    ```html\n    <BODY BGCOLOR=\"#ffffcc\" LINK=\"\
    #ff0000\" VLINK=\"#00ff00\">\n    ```\n\n    这会使已访问的链接显示为绿色。\n\n    > **提示：**\
    \ 已访问的链接是指在浏览器中已经查看过的页面的链接。\n\n3.  保存页面并在浏览器中查看。页面上的链接应该是红色或绿色。\n\n### 一致的链接颜色\n\
    \n链接颜色在整个网站中应保持一致。如果一个页面上的链接是红色的，那么它们在每个页面上都应该是红色的。\n\n对于用户来说，学习一次“红色等于链接”比必须弄清楚网站每个页面或部分的链接颜色要容易得多。\n\
    \n## 练习：HTML 基础\n\n**任务：** 创建一个关于猫的网站，使其看起来像 www.visibooks.com/cats 网站。\n\n1.\
    \  创建一个新的主页，并将其标题命名为“The Wonderful World of Cats”。\n2.  将其保存在 C:\\ 驱动器上一个名为 Cats\
    \ 的新文件夹中：\n    ```\n    C:\\Cats\n    ```\n3.  使页面的标题显示为“The Wonderful World of\
    \ Cats”。\n4.  在主页主标题下方，插入一个项目符号列表：\n    - 家猫\n    - 流浪猫\n    - 大型猫科动物\n5.  将这些项目设置为\
    \ Arial 字体，大小为 -1。\n6.  将每个列表项链接到一个关于它的新页面。例如，将“家猫”链接到一个关于家猫的新页面，文件名为 housecats.html。\n\
    7.  在每个新页面的顶部，放置一个描述性标题。例如，在家猫页面的顶部放置“家猫”这几个字。\n8.  将所有四个页面的主标题设置为 Arial 字体。将它们设置为粗体。将主页标题的大小设置为\
    \ +3。将其他页面标题的大小设置为 +2。\n9.  在每个页面上，在主标题下方的新段落中写一两句描述性句子。将其设置为 Arial 字体，大小为 -1。\n\
    10. 前往 www.visibooks.com/catpics 获取那里的三个猫图形。将它们放入 C:\\Cats 文件夹中一个名为“graphics”的文件夹中。\n\
    11. 在 3 个页面中的每一个页面上，在主标题和下方的描述性文本之间插入相应的图形。\n12. 将每个图形左对齐，然后指定 vspace 为 4，hspace\
    \ 为 16。\n13. 将三个“猫”页面中的每一个都链接回主页，并相互链接。在每个页面上，将“您在这里”链接设置为粗体纯文本。\n14. 将每个页面的背景颜色设置为浅灰色。\n\
    15. 将每个页面上的链接颜色设置为亮红色。将已访问的链接颜色设置为橙色。\n16. 在浏览器中预览该网站。它应该看起来像 www.visibooks.com/cats\
    \ 网站。\n\n## 布局与导航\n\n在本节中，您将学习如何：\n\n- 使用表格布局页面\n- 创建导航栏\n- 为网站添加子部分\n- 在表格内放置表格\n\
    - 使用框架链接到外部网站\n\n您将构建一个看起来像这样的网站：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_62_0.png)\n\
    \n## 使用表格布局页面\n\n### 表格与网页布局\n\n几乎所有专业质量的网站都是使用表格布局的。就像电子表格有包含数字的单元格一样，网页上的表格也有包含链接、图形和文本的单元格。\n\
    \n此页面上的线条清晰地显示了其表格单元格布局：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_63_0.png)\n\
    \n## 创建表格\n\n1.  在 C:\\ 驱动器上创建一个名为“Travel”的新文件夹。\n\n2.  在记事本中创建一个主页（文件名 index.html），标题为“Traveling\
    \ Down South”。将其保存在 Travel 文件夹中。\n\n    > **提示：** 确保您的新主页具有正确的文件名——index.html——以及所有必要的标签：\n\
    \n    ```html\n    <HTML>\n    <HEAD>\n    <!--Created by Your Name-->\n    </HEAD>\n\
    \    <TITLE>\n    Traveling Down South\n    </TITLE>\n    <BODY>\n    </BODY>\n\
    \    </HTML>\n    ```\n\n3.  您将创建一个简单的一行两列表格，如下所示：\n\n    | 链接 | 内容 |\n\n4.  第一步是开始表格。在\
    \ `<BODY>` 标签下方，使用 `<TABLE>` 标签开始您的表格：\n\n    ```html\n    <BODY>\n    <TABLE>\n\
    \    ```\n\n5.  在 `<TABLE>` 标签下方，使用 `<TR>`（表格行）标签开始一行：\n\n    ```html\n    <BODY>\n\
    \    <TABLE>\n    <TR>\n    ```"
