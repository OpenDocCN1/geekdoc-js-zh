- md: "## Practice: Enable rollover graphics\n\n- 1. In the navigation bar of index.html,\
    \ replace the words “Cell Phones” and “PDAs” with rollover graphics. Use the graphics\
    \ cellbright.gif, cell.gif, pdabright.gif and pda.gif.\n\n**Tip:** Modify the\
    \ anchor tag and image code in the first cell for use in the other two.\n\n```\n\
    <A HREF = \"laptops.html\"\nonMouseOver = \"imgOn('img1')\"\nonMouseOut = \"imgOff('img1')\"\
    ><IMG\nSRC=\"graphics/lap.gif\" WIDTH=\"120\"\nHEIGHT=\"20\" BORDER=\"0\" name=\"\
    img1\"\nalt=\"Laptops\"></A>\n```\n\n- 2. When you’re done, save the page and\
    \ view it in the browser. It should look like this:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_154_0.png)\n\
    \n## Open new windows\n\n- 1. In Notepad, open up the home page for the Travel\
    \ West Web site: index.html at C:\\Travel West.\n- 2. In the browser, go to www.visibooks.com/newwindow.\n\
    - 3. View the source code for the page. Highlight and copy the JavaScript code\
    \ between the <HEAD> and </HEAD> tags.\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_155_0.png)\n\
    \n- 4. Paste it below the <META> tags in index.html:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_155_1.png)\n\
    \n- 5. Change the JavaScript code so that it opens infoform.html in the new window:\n\
    \nFrom this:\n\n```\n<SCRIPT LANGUAGE=\"JavaScript\">\n    function Contact()\n\
    \    {\n        OpenNewWindow =\n            window.open('contact.html', 'help',\
