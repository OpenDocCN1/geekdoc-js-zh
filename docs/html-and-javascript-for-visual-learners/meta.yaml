    # Upload sites to a Web server


    > FTP


    FTP stands for “File Transfer Protocol, a way to transfer files between computers
    over the Internet. Uploading a site to a Web server requires special FTP software.


    The most popular program used to upload and download Web pages from a server is
    WS_FTP. The LE version is free and can be downloaded at www.download.com or www.tucows.com.


    The Pro version costs $39.95, and can also be found at the Web site of the company
    that makes it, www.ipswitch.com.


    Below are instructions for uploading files using the free LE version.


    +   1. Download WS_FTP LE and install it.

    2. Open the program. You should see an initial Session Properties window. It should
    look like this:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_126_0.png)'
  - '[PAGE 127]


    3. Click the New button.


    4. In the Profile Name textbox, enter the name of your upload process, such as
    “Upload my Web site.”


    5. In the Host Name/Address textbox, enter the name or IP address of your Web
    server. It can be something like www.visibooks.com, washington.patriot.net, or
    207.176.7.217.


    > **Tip:** Contact your Web server administrator to find out the Host Name or
    IP Address of your Web server. The Web server administrator can also supply your
    User ID and Password.


    6. Leave the Host Type set at Automatic detect, and input your User ID and Password.


    7. Check the Save Pwd checkbox, then click the Apply button. The Session Properties
    window should now look something like this:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_127_0.png)'
