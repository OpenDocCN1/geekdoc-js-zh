  md: '# Practice: Create a home page


    A. What is the correct file name for a home page?


    B. Why is there a special file name for home pages?


    C. Why is it important that the home page—and all other pages in a Web site—have
    accurate titles?


    D. What is the difference between a page’s title and its file name?


    Answers


    A. index.html


    B. It allows home pages to appear in a browser without typing the file name as
    part of a Web address.


    C. Accurate titles allow people to find pages easier when bookmarking them or
    searching in a browser’s History list.


    D. A page title appears in the Title bar at the top of the browser. It’s plain
    text, such as “The Smith Family: Vacation Pictures,” that makes it easy for people
    to keep track of a page. A page’s file name, such as vacpics.html, is how the
    computer keeps track of it.'
