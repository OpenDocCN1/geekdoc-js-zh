  md: '# # Introduction


    Welcome to *HTML and JavaScript for Visual Learners*. If you’ve never used a Visibook
    before, you’ll find that it contains several hundred illustrations, with comparatively
    little text. It presents essential tasks, breaks them down into steps, then walks
    you through them with illustrations.


    # ## What you’ll learn


    You’ll learn how to use HTML to create a solid, attractive Web site that’s easy
    to navigate. You’ll also learn how to upload it to a Web server.


    You won’t become an expert in Web publishing—that takes practice and real-world
    experience. But you will learn the fundamentals of site-building, and get a good
    foundation on which to build professional-level skills.


    Additional resources for acquiring expert-level HTML and JavaScript skills are
    found at the end of this book.


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_6_0.png)


    # ## How you’ll learn it


    This book has five sections: HTML Basics, Layout & Navigation, Interactivity,
    Advanced Layout, and Practical JavaScript.


    At the end of each task and section are practice exercises. Don’t worry if you
    can’t work through the whole book in a day or two. Take your time, and try to
    do the practice. You can check your work against examples posted on the Web.


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_6_1.png)'
  merge: -1
  pgno: 6
- img_proc: true
  md: '# Before you begin


    Before you begin, it’s important that you know Windows well. A working knowledge
    of Windows makes it much easier to learn HTML and JavaScript. You should be familiar
    with:


    +   - How directories work

    - Windows Explorer

    - Basic word processing


    Make sure you can perform the following tasks:


    +   - Create a folder on your computer’s hard drive

    - Create a folder within a folder

    - Copy a paragraph from one document and paste it into another.


    If you have trouble doing this, set aside a couple of hours to learn Windows basics.
    Have a friend or co-worker who is proficient with computers walk you through Windows
    Explorer, creating folders and becoming familiar with file extensions.


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_7_0.png)


    You should also practice using the Cut, Copy, and Paste commands in a standard
    word processing program. When you can do these things on your own, you’re ready
    to learn HTML and JavaScript.'
  merge: -1
