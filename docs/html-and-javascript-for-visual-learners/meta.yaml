    > ### How e-mail links work


    When someone goes to a Web site and clicks on an e-mail link, it’s supposed to
    open the e-mail program on that person’s computer and insert the address into
    a new message.


    If the person’s e-mail program isn’t configured correctly, this won’t work. That’s
    why e-mail links should use the e-mail address as a link: so people can enter
    the address manually if they have to.'
