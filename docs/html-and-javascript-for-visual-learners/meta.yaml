    <IMG SRC=\"graphics/uva.gif\">\n<P>\n<FONT FACE=\"arial\" SIZE=\"-1\">If you've\
    \ got a\ncouple of weeks for vacation, you might want\nto visit the South. Richmond,\
    \ Williamsburg,\nand Charleston are all beautiful\ncities.</FONT>\n</TD>\n</TR>\n\
    </TABLE>\n```\n\n9.  要控制表格单元格的宽度，请向第一个 <TD> 标签添加属性 **WIDTH=\"20%\"**，向第二个添加属性\
    \ **WIDTH=\"80%\"**：\n\n```\n<TABLE BORDER=\"0\" WIDTH=\"100%\"\nCELLPADDING=\"\
    16\" CELLSPACING=\"0\">\n<TR>\n<TD BGCOLOR=\"#CCCCCC\" VALIGN=\"top\">\n<FONT\
    \ FACE=\"arial\" SIZE=\"-1\" WIDTH=\"20%\">\nRichmond\n<P>\nWilliamsburg\n<P>\n\
    Charleston\n</FONT>\n</TD>\n<TD VALIGN=\"top\" WIDTH=\"80%\">\n<FONT FACE=\"verdana\"\
    \ SIZE=\"+3\"><B>Traveling\nSouth</B></FONT>\n<P>\n<IMG SRC=\"graphics/uva.gif\"\
    >\n<P>\n<FONT FACE=\"arial\" SIZE=\"-1\">If you've got a\ncouple of weeks for\
    \ vacation, you might want\nto visit the South. Richmond, Williamsburg,\nand Charleston\
    \ are all beautiful\ncities.</FONT>\n</TD>\n</TR>\n</TABLE>\n```\n\n10. 保存页面并在浏览器中查看。它现在应该看起来像这样：\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_77_0.png)\n\n## 创建新的基于表格的页面\n\n1. \
    \ 在记事本菜单栏上，单击“编辑”，然后单击“全选”。\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_78_0.png)\n\
    \n2.  选中页面上的所有代码后，单击“编辑”，然后单击“复制”。\n\n3.  在菜单栏上，单击“文件”，然后单击“新建”。\n\n4.  当新的空白页面出现时，单击“编辑”，然后单击“粘贴”。\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_78_1.png)\n\n5.  将新页面保存在 C:\\Travel，文件名为\
    \ richmond.html。\n\n6.  将新页面标题设为 \"Richmond, VA.\"。\n\n7.  打开浏览器并访问 www.visibooks.com/travelpic/richpic。捕获那里的弗吉尼亚州里士满图形\
    \ (capitol.jpg) 并将其放入 graphics 文件夹。\n\n8.  将 \"**Traveling South**\" 标题替换为 \"\
    **Richmond, Virginia.**\"。将其大小设为 +2。\n\n9.  将主页图形替换为里士满图形。在图形下方的新段落中，输入句子 \"Richmond\
    \ is the capital of Virginia.\"。\n\n10. 在左侧单元格的单词下方添加单词 \"Home\"。完成后，页面应如下所示：\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_79_0.png)\n\n## 练习：使用表格布局页面\n\nA. *为什么你通常希望创建百分比宽度的表格，而不是固定像素宽度的表格？*\n\
