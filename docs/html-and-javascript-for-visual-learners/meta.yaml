    \n## Create new table-based pages\n\n1. On the Notepad menu bar, click Edit, then\
    \ Select All.\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_78_0.png)\n\n2. Once\
    \ all the code on the page is selected, click Edit, then Copy.\n\n3. On the menu\
