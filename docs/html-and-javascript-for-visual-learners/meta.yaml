    # Making a form work


    To make a form work, an action must be assigned to it. To add an action to your
    form, add the **ACTION** attribute to the **<FORM>** tag.


    Consult with your Web server administrator to specify what action you should assign.
    For example, an action for a form might look something like this:


    ```

    <FORM METHOD="POST"

    ACTION="http://www.yourdomain.com/cgi-bin/formmail.pl">

    ```


    This tells the form to post its data to a program called formmail.pl on at yourdomain.com.
    This program might take the form data and e-mail it to whomever you choose.'
