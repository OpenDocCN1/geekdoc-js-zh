  - '[PAGE 69]


    # Percentage vs. fixed-width tables


    When laying out a page using a table, set the table’s width at 100%. That way,
    the contents of the page can stretch to fill the whole monitor, regardless of
    the monitor’s resolution.


    If you want it to fit a fixed-width table on all monitors, you’re limited to a
    table 580 pixels wide:


    **640 pixels** width of low-resolution monitor **- 20 pixels** browser offset:
    the distance that page content is indented from the sides of the browser **- 40
    pixels** 20 for the vertical scroll bar, plus 20 extra **= 580 pixels** width
    available for table


    Creating pages with fixed-width tables offers precise control, but wastes space
    on higher-resolution monitors:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_69_0.png)


    **Page:** laid out using a table 580 pixels wide


    **Monitor used to view page:** 1280 pixels wide'
