    \n第一版\n\n# 目录\n\n引言\n\n# HTML 基础\n\n创建主页\n创建主页\n在浏览器中查看页面\n\n格式化页面和文本\n更改字体\n\
    更改文本大小\n更改文本粗细\n更改文本颜色\n对齐文本\n缩进文本\n创建列表\n\n创建指向新页面的链接\n步骤 1：创建新页面\n步骤 2：链接到新页面\n\
    \n创建电子邮件和外部链接\n创建电子邮件链接\n链接到外部站点\n\n插入和对齐图形\n从网络捕获图形\n插入图形\n对齐图形\n格式化图形\n\n创建基本导航系统\n\
    链接回主页\n将页面相互链接\n使用图形作为链接\n使用图形作为链接\n\n更改页面、链接颜色\n更改页面背景颜色\n更改链接颜色\n更改链接颜色\n\n\
    # 布局与导航\n\n- 使用表格布局页面\n  - 创建表格\n  - 创建表格\n  - 格式化表格\n  - 创建基于表格的主页\n  - 创建新的基于表格的页面\n\
    \n- 创建导航栏\n  - 为主页创建导航栏\n  - 为主分区页面创建导航栏\n\n- 向网站添加子分区\n  - 插入用于内容和子分区链接的表格\n\
    \  - 创建子分区页面\n\n在表格内放置表格\n\n使用框架链接到外部站点\n\n# 交互性\n\n插入 META 标签\n\n创建表单\n\n- 使用样式表\n\
    \  - 创建样式表\n  - 应用样式表\n  - 使用样式表创建链接效果\n\n将网站上传到 Web 服务器\n\n# 高级布局\n\n使用背景图形\n\
    \n使用间隔 GIF\n\n插入水平线\n\n指定页边距\n\n# 实用 JavaScript\n\n- 启用翻转图形\n  - 查看源代码\n  - 复制源代码\n\
    \  - 修改源代码\n\n- 打开新窗口\n\n- 验证表单输入\n\n- 验证表单输入\n  - 查看其工作原理\n  - 插入验证脚本\n  - 修改\
    \ <FORM> 标签\n\n# 附加资源\n\n# HTML 标签图表\n\n# 索引\n\n# 引言\n\n欢迎阅读*面向视觉学习者的 HTML 与 JavaScript*。如果您以前从未使用过\
    \ Visibook，您会发现它包含数百幅插图，而文字相对较少。它呈现基本任务，将其分解为步骤，然后通过插图引导您完成。\n\n## 您将学到什么\n\n\
    您将学习如何使用 HTML 创建一个结构稳固、外观吸引人且易于导航的网站。您还将学习如何将其上传到 Web 服务器。\n\n您不会成为网络出版专家——这需要实践和实际经验。但您将学习网站构建的基础知识，并为培养专业级技能打下良好的基础。\n\
    \n获取专家级 HTML 和 JavaScript 技能的附加资源可在本书末尾找到。\n\n## 您将如何学习\n\n本书分为五个部分：HTML 基础、布局与导航、交互性、高级布局和实用\
    \ JavaScript。\n\n每个任务和部分的末尾都有练习。如果您无法在一两天内完成整本书，请不要担心。慢慢来，并尝试完成练习。您可以对照网上发布的示例来检查您的工作。"
