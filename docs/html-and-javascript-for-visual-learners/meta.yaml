  md: "# Change page, link colors\n\n# Change background color of page\n\n+   1. Open\
    \ the home page in Notepad.\n2. In the <BODY> tag, add the attribute BGCOLOR=\"\
    #ffffcc\":\n   <BODY BGCOLOR=\"#ffffcc\">\n3. Save the page and view it in the\
    \ browser. The background color of the page should now be pale yellow.\n\n> ###\
    \ Hexadecimal colors\n\nThe **ffffcc** that stands for pale yellow is a hexadecimal\
    \ color. Hexadecimal colors allow you to specify colors more precisely than you\
    \ can with words. For example, you could use the attribute **BGCOLOR=yellow**\
    \ in the body tag and the page background would turn bright yellow, but if you\
    \ used **BGCOLOR=pale yellow**, that wouldn’t work.\n\nFor shades of color, hexadecimals\
    \ must be used. They work like this:\n\nComputers show color as a mix of red,\
    \ green and blue. In hexadecimal colors, the first pair of letters or numbers\
    \ signify red, the second pair signify green, and the third pair signify blue:\n\
    \n| Red | Green | Blue |\n| --- | --- | --- |\n| **ff** | **ff** | **cc** |"
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Hexadecimal colors, continued


    The color values go from the maximum amount of color (ff) to no color at all (00):


    | Max | Mid-range | None |

    |---|---|---|

    | ff | cc | 99 | 66 | 33 | 00 |


    Navy blue would be shown in hexadecimals as no red (00), no green, (00), and a
    little bit of blue (66):


    ```

    000066

    ```


    A list of hexadecimal color codes is posted at:


    www.webmonkey.com/reference/color_codes'
  merge: -1
