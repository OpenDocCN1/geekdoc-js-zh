    - 3. 查看该页面的源代码。高亮并复制 `<HEAD>` 和 `</HEAD>` 标签之间的 JavaScript 代码。\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_155_0.png)\n\
    \n- 4. 将其粘贴到 index.html 中 `<META>` 标签的下方：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_155_1.png)\n\
    \n- 5. 修改 JavaScript 代码，使其在新窗口中打开 infoform.html：\n\n从这个：\n\n```\n<SCRIPT LANGUAGE=\"\
    JavaScript\">\n    function Contact()\n    {\n        OpenNewWindow =\n      \
    \      window.open('contact.html', 'help', 'toolbar=no,location=0,directories=no,status=yes,menubar=0,scrollbars=yes,resizable=yes,width=300,height=350');\n\
    \    }\n</SCRIPT>\n```\n\n改为这个：\n\n```\n<SCRIPT LANGUAGE=\"JavaScript\">\n   \
    \ function Contact()\n    {\n        OpenNewWindow =\n            window.open('infoform.html',\
    \ 'help', 'toolbar=no,location=0,directories=no,status=yes,menubar=0,scrollbars=yes,resizable=yes,width=300,height=350');\n\
    \    }\n</SCRIPT>\n```\n\n**提示：** JavaScript 不是 HTML——它是一种编程语言。它在值周围没有引号时工作得更好。此外，不要更改脚本中有效单词的大小写。与\
    \ HTML 不同，JavaScript 区分大小写。\n\n- 6. 再次在 www.visibooks.com/newwindow 查看源代码。\n-\
    \ 7. 在 `<BODY>` 和 `</BODY>` 标签之间找到引用 JavaScript 函数 `Contact()` 的锚点标签。\n\n```\n\
    <FONT FACE=\"arial\" SIZE=\"+1\"><B><A HREF=\"javascript:Contact()\">Open new\
    \ window with form inside</A></B></FONT>\n```\n\n> 提示：函数是程序执行的一项任务。上面的函数名为 `Contact()`。它的任务是打开允许人们联系\
    \ Visibooks 的窗口。\n\n- 8. 复制锚点标签，然后将其粘贴到 index.html 中，使其将第二句话链接到\n\n从这个：\n\n```\n\
    <A HREF=\"infoform.html\">Get more information about Western travel mailed to\
    \ you</A>\n```\n\n改为这个：\n\n```\n<A HREF=\"javascript:Contact()\">Get more information\
    \ about Western travel mailed to you</A>\n```\n\n- 9. 保存 index.html 并在浏览器中查看。\n\
    - 10. 单击链接的句子。应该会弹出一个包含表单的新窗口：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_158_0.png)\n\
    \n**提示：** 要更改弹出窗口的大小和外观，请更改 `window.open` 后的值：\n\n```\nOpenNewWindow = window.open('contact.html',\
    \ 'help', 'toolbar=no, location=0, directories=no, status=yes, menubar=0, scrollbars=yes,\
    \ resizable=yes, width=300, height=350')\n```\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_158_1.png)\n\
    \n## 验证表单输入\n\n### 了解其工作原理\n\n- 1. 在记事本中，打开 Travel West 站点中的 infoform.html。\n\
    - 2. 在浏览器中，访问 www.visibooks.com/validate。\n- 3. 单击“Send me info”按钮。执行此操作时，应出现一个警告窗口。当您输入姓名并单击按钮时，应出现另一个警告窗口，显示“Please\
    \ input your address.”。这同样适用于电子邮件输入。\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_159_0.png)\n\
    \n### 插入验证脚本\n\n- 1. 在 www.visibooks.com/validate 查看页面源代码，并复制 `<HEAD>` 标签之间的 JavaScript：\n\
    \n```\n<script>\n<!--\nfunction validate()\n{\nif (document.info.name.value==\"\
    \")\n{\nalert (\"Please input your name.\")\nreturn false\n}\nif (document.info.address.value==\"\
    \")\n{\nalert (\"Please input your address.\")\nreturn false\n}\nif (document.info.email.value==\"\
    \")\n{\nalert (\"Please input your e-mail address.\")\nreturn false\n}\n}\n//\
    \ -->\n</script>\n```\n\n> 注释标签将脚本隐藏在旧的、不支持 JavaScript 的浏览器中，这样它们就不会显示它。\n\n**提示：**\
    \ 这是一个解释 `if` 语句变量的图表：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_160_0.png)\n\
    \n- 2. 将其粘贴到 infoform.html 的 `<HEAD>` 标签之间。\n\n### 修改 `<FORM>` 标签\n\n- 1. 为 `<FORM>`\
    \ 标签添加一个 **NAME** 属性。将表单命名为“info”。\n\n```html\n<FORM NAME=\"info\" METHOD=\"POST\"\
    \naction=\"http://www.yourserver.com/cgi-bin/formmail.pl\">\n```\n\n- 2. 为 `<FORM>`\
    \ 标签添加 **ONSUBMIT** 属性。告诉表单，当单击提交按钮时，执行函数 **return validate()**：\n\n```html\n\
    <FORM NAME=\"info\" METHOD=\"POST\"\nONSUBMIT=\"return validate()\"\naction=\"\
    http://www.yourserver.com/cgi-bin/formmail.pl\">\n```\n\n- 3. 保存页面。注意 JavaScript\
    \ 的 `if` 语句输入变量如何与表单的输入字段同名：\n\n```\n<script>\n<!--\nfunction validate()\n{\n\
    if(document.info.name.value==\"\")\n{\nalert (\"Please input your name.\")\nreturn\
    \ false\n}\nif(document.info.address.value==\"\")\n{\nalert (\"Please input your\
    \ address.\")\nreturn false\n}\nif(document.info.email.value==\"\")\n{\nalert\
    \ (\"Please input your e-mail address.\")\nreturn false\n}\n}\n// -->\n</script>\n\
    ```\n\n```\n<TABLE WIDTH=\"50%\"\nCELLPADDING=\"4\"\nBORDER=\"0\"><TR><TD\nWIDTH=\"\
    5%\"><P\nALIGN=\"right\">Name:</TD>\n<TDWIDTH=\"45%\"><INPUT\nTYPE=\"text\" NAME=\"\
    name\"\nSIZE=\"20\"></TD></TR>\n<TD><P ALIGN=\"right\">Address:</TD>\n<TD><INPUT\
    \ TYPE=TEXT\nNAME=\"address\" SIZE=\"20\">\n</TD></TR>\n<TD><P ALIGN=\"right\"\
    >E-\nmail:</TD><TD><INPUT TYPE=\"text\"\nNAME=\"email\" SIZE=\"20\">\n</TD></TR><TD></TD><TD><INPUT\n\
    TYPE=\"submit\" VALUE=\"Send me\ninfo\"></TD></TR></TABLE>\n```\n\n- 4. 在浏览器中查看\
    \ infoform.html。它应该看起来和工作起来像 **www.visibooks.com/validate** 上的表单。\n\n## 附加资源\n\
    \n**Webmonkey (www.webmonkey.com)**\n一个为构建网站的人们提供的操作指南网站，充满了优秀的教程和资源。\n\n**EchoEcho\
    \ (www.echoecho.com)**\n教程比 Webmonkey 更多，而且都清晰详细。包含有关浏览器使用情况、监视器设置、平台以及用于查看网页的其他技术的有用统计数据。\n\
    \n**Project Cool (www.projectcool.com)**\n为构建网站的人们提供知识、指导和灵感。它包括一个很好的样式表指南，位于\
    \ projectcool.com/developer/reference/css_style.html。\n\n**Web Review (www.webreview.com)**\n\
    一个面向 Web 开发者的敏锐且信息丰富的网站，包含创作、设计、开发、电子商务、多媒体和后端 Web 服务器编程等部分。\n\n**HTML Help (www.htmlhelp.com)**\n\
    一个优秀的资源网站，包含大量关于样式表和 HTML 技术标准的信息。包括在线工具，如 HTML 验证器、链接检查器和 ASCII 字符指南。\n\n**HTML\
    \ & XHTML: The Definitive Guide (书籍)**\nChuck Musciano, Bill Kennedy, O’Reilly;\
    \ ISBN: 059600026X\n像大多数 O’Reilly 书籍一样，面向程序员。一本全面的 HTML 资源，但更好的是，一本关于如何让 HTML\
    \ 与 XML——Web 开发中的“下一个大事件”——协同工作的指南。\n\n**Voodoo’s Introduction to JavaScript (rummelplatz.uni-mannheim/~skoch/js/tutorial.htm)**\n\
