  - "[PAGE 80]\n\n# Practice: Lay out pages using tables\n\nA. *Why do you usually\
    \ want to create tables with a percentage width, rather than a fixed-pixel width?*\n\
    \n**Task:** To make your Travel site look and work like the one at **www.visibooks.com/travel**.\n\
    \n+   1. Create pages for Williamsburg and Charleston just like the Richmond page.\n\
    \n   Get the graphic and text for the Williamsburg page at **www.visibooks.com/travelpic/willpic**.\
    \ Get the Charleston graphic and text at **www.visibooks.com/travelpic/charlpic**.\n\
    \n2. Using the words Richmond, Williamsburg, Charleston, and **Home** in the left-hand\
    \ cell of each page, link all the pages in this Web site to each other.\n\n  \
    \ ***TIP:*** *Don't forget to transform the link that shows \"You Are Here\" into\
    \ bold, plain text.*\n\n3. Insert the text and graphics in their appropriate pages.\n\
    \n4. Align all graphics to the left. Give them vspace of 4 pixels and hspace of\
    \ 12 pixels. Give each graphic appropriate Alt text.\n\n5. When you're done, preview\
    \ the site in the browser. It should look and work like **www.visibooks.com/travel**.\n\
    \n**Answers**\n\nA. *Fixed-width tables waste space and make pages look a bit\
    \ sparse when viewed on higher-resolution monitors.*"
- md: "## Create navigation bars\n\n### Create a navigation bar for a home page\n\n\
    1. Create a folder called “Travel West” on your hard drive at C:\\Travel West.\n\
    2. Create a home page titled “Traveling West for Vacation.” Save it in the Travel\
    \ West folder.\n3. Between the `<BODY>` and `</BODY>` tags, create a table with\
    \ one row and 3 cells in the row:\n4. Give the `<TABLE>` tag these attributes:\n\
    5. In the table’s first cell, enter the word “California.” In the second cell,\
    \ “The Rockies,” and in the third cell, “The Midwest.”\n6. Make each cell 33%\
    \ wide (except for the middle one, which has to be 34%: their sum must equal the\
    \ table width of 100%).\n\n```\n<TABLE>\n<TR>\n<TD> </TD>\n<TD> </TD>\n<TD> </TD>\n\
    </TR>\n</TABLE>\n```\n\n```\nWIDTH=\"100%\"\nBorder=\"0\"\nCELLPADDING=\"4\"\n\
    CELLSPACING=\"0\"\n```\n\n7. Center the words in each cell with `<CENTER>` tags:\n\
    \n```\n<TD WIDTH=\"33%\">\n<CENTER>\nCalifornia\n</CENTER>\n</TD>\n<TD WIDTH=\"\
    34%\">\n<CENTER>\nThe Rockies\n</CENTER>\n</TD>\n<TD WIDTH=\"33%\">\n<CENTER>\n\
    The Midwest\n</CENTER>\n</TD>\n```\n\n8. Change the text in each cell to arial,\
    \ size -1, and change the background color of all cells to light grey (#cccccc).\n\
    \n9. When you’re done, preview the page in the browser. The table should look\
    \ like this:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_82_0.png)\n\n10. Below\
    \ the table, in a new paragraph, enter the heading “Traveling West.” Make it arial,\
    \ size +4, bold.\n\n11. Below that, add a new paragraph with this text:\n\nWhen\
    \ you go West, be sure to visit the sights of California, the natural wonders\
    \ of the Rockies, and the cities of the Midwest.\n\n12. Make the new paragraph\
    \ verdana, size -1 and save the page.\n\n13. View the page in the browser. It\
    \ should look like this:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_83_0.png)\n\
    \n### Create a navigation bar for a main section page\n\n1. Create a new page\
    \ with file name california.html. Title it “Vacationing in California.”\n2. Make\
    \ the table just like the one on the home page, except with 4 cells instead of\
    \ 3.\n3. Format the table and text just like on the home page, but make the California\
    \ cell bright yellow (BGCOLOR=\"#ffff00\") to show “You are here.”\n4. When you’re\
    \ done, save the page and view it in the browser. The table should look like this:\n\
    5. Link the word Home to the home page (`<A HREF=\"index.html\">Home</A>`), then\
    \ save the page.\n6. Open the home page in Notepad.\n7. Link the word California\
    \ to the California page.\n8. Save the page.\n\n> **Tip:** Don’t forget to change\
    \ the cell widths. There are now four cells, and their widths must add up to 100%.\
    \ That means 25% per cell.\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_84_0.png)\n\
    \n### Practice: Create navigation bars\n\n**Task:** To make your Travel West site\
    \ look like the site at www.visibooks.com/travelwest.\n\n1. Create a new blank\
    \ page and save it with the file name midwest.html. It will be The Midwest page,\
    \ but leave it blank for right now.\n2. Create a new page with file name rockies.html.\
    \ This is The Rockies page. Title it “Nature in the Rocky Mountains.” Make its\
    \ navigation bar table exactly like that of the California page.\n3. Change the\
    \ “You are here” yellow background color from the California cell to The Rockies\
    \ cell.\n4. Link California, The Midwest and Home to their respective pages.\n\
    5. When you’re done, preview the page in the browser. It should look like this:\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_85_0.png)\n\n6. Repeat this process\
    \ with the California and Midwest pages so they’ve got functioning navigation\
    \ bars that show “you are here.”\n\n7. Go to the home page and in the navigation\
    \ bar, link The Rockies and The Midwest to their respective pages.\n\n8. Make\
    \ all text that corresponds to the current page bold. (Example: make “**The Rockies**”\
    \ bold on The Rockies page.)\n\n9. When you’re done, preview the site in the browser.\
    \ It should look like the site at **www.visibooks.com/travelwest**.\n\n## Add\
    \ subsections to site\n\n### Insert a table for content and subsection links\n\
    \n1. In Notepad, open the California page in the Traveling West Web site.\n\n\
    2. Below the navigation bar table, add another table that has one row and two\
    \ cells in the row. Give the table the attributes:\n\n```\nWIDTH=\"100%\"\nBORDER=\"\
    0\"\nCELLPADDING=\"16\"\nCELLSPACING=\"0\"\n```\n\n3. Make the first cell 25%\
    \ wide and the second cell 75% wide.\n\n```\n<TABLE BORDER=\"0\" WIDTH=\"100%\"\
    \ CELLPADDING=\"16\" CELLSPACING=\"0\">\n<TR>\n<TD WIDTH=\"25%\"> </TD>\n<TD WIDTH=\"\
    75%\"> </TD>\n</TR>\n</TABLE>\n```\n\n4. In the left-hand cell, put the subsections\
    \ for the main California section:\n\nThe Golden Gate Bridge\nHighway 101\nBig\
    \ Sur\n\n5. In the right-hand cell, put the heading “Places to visit in California.”\
    \ Below the heading, in a new paragraph, type the sentence:\n\nWhen in California,\
    \ be sure to see the Golden Gate bridge, Highway 101, and Big Sur.\n\n6. Align\
    \ the contents of both cells to the top of each.\n\n7. Make the text in the left-hand\
    \ navigation cell arial, size -1.\n\n8. Make the heading in the right-hand cell\
    \ bold, arial, size +3. Make the paragraph beneath the heading verdana, size -1.\n\
    \n9. When you’re done, save the page and preview it in the browser. The page should\
    \ look like this:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_88_0.png)\n\n###\
    \ Create subsection pages\n\n1. Create new blank pages for subsections The Golden\
    \ Gate Bridge, Highway 101 and Big Sur:\n\n| Page | Title | File Name |\n|---|---|---|\n\
    | The Golden Gate Bridge | Seeing the Golden Gate Bridge | goldengate.html |\n\
    | Highway 101 | Driving Highway 101 | highway101.html |\n| Big Sur | Staying in\
    \ Big Sur | bigsur.html |\n\n2. Copy the tables from the California page and paste\
    \ them into the Golden Gate Bridge page.\n\n3. On the Golden Gate Bridge page,\
    \ change the heading to read “Seeing the Golden Gate Bridge.” Make it size +2.\n\
    \n4. Below the heading, change the paragraph to read:\n\nThe Golden Gate Bridge\
    \ isn't golden--it's actually orange.\n\n5. Make it verdana, size -1.\n\n6. Link\
    \ the words California, Highway 101, and Big Sur to their respective pages. Leave\
    \ The Golden Gate Bridge as plain text to show “you are here.”\n\n7. When you’re\
    \ done, save the page and view it in the browser. It should look like this:\n\n\
    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_90_0.png)\n\n> **Consistent page layout**\n\
    \nCopying tables from one page and pasting them into new pages ensures that all\
    \ pages share the same layout.\n\nThis consistency makes site navigation easier:\
    \ no matter which page in the site is being viewed, a person knows where the page’s\
    \ links and content will be.\n\n### Practice: Add subsections to site\n\nA. What's\
    \ the best way to keep tables consistent from page to page?\n\nTask: To make your\
    \ Travel West Web site look and work like the one at www.visibooks.com/travelwest2.\n\
    \n1. Open the California page in Notepad. Link The Golden Gate Bridge, Highway\
    \ 101 and Big Sur to their respective pages.\n2. Open the Golden Gate Bridge page.\
    \ Copy both tables from the page.\n3. Paste these tables into the Highway 101\
    \ page.\n4. On the Highway 101 page, link the words The Golden Gate Bridge to\
    \ the Golden Gate Bridge page. Get rid of the anchor tags around Highway 101 so\
    \ it shows as plain text.\n5. Change the Highway 101 page's heading and descriptive\
    \ text beneath it so it looks like this:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_91_0.png)\n\
    \n6. Format the Big Sur page so its layout and navigation are consistent with\
    \ the Golden Gate Bridge and Highway 101 pages.\n\nHeading:\n**Staying in Big\
    \ Sur**\n\nParagraph:\nThere are many excellent hotels right on the ocean in Big\
    \ Sur.\n\n7. Save all pages.\n\n8. When you’re done creating all the pages in\
    \ the California section of this site, preview it in a browser. It should look\
    \ and work like www.visibooks.com/travelwest2.\n\nAnswers\nA. Copying and pasting\
    \ tables from one page to another.\n\n### Place tables within tables\n\n1. In\
    \ Notepad, open the Golden Gate Bridge page (goldengate.html).\n2. In front of\
    \ the paragraph below the main heading, begin a new table with:\n   - 2 rows\n\
    \   - 1 cell in each row\n   - WIDTH=\"200\"\n   - CELLPADDING=\"8\"\n\n> **Tip:**\
    \ To create a table with more than one row, just begin a new row after ending\
    \ the one above it:\n\n```\n<TR>\n<TD> </TD>\n</TR>\n<TR>\n<TD> </TD>\n</TR>\n\
    ```\n\nNote: the width is a number—200—which renders the width in pixels rather\
    \ than as a percentage.\n\n3. Color the top cell blue (#0000ff) and the bottom\
    \ cell grey (#cccccc).\n4. In the top cell, put the words, “A Whole Lot of Paint.”\
    \ Center the words and make them bold."
  mdcn: "## 创建导航栏\n\n### 为首页创建导航栏\n\n1.  在硬盘 C:\\Travel West 上创建一个名为“Travel West”的文件夹。\n\
    2.  创建一个标题为“Traveling West for Vacation”的主页。将其保存在 Travel West 文件夹中。\n3.  在 `<BODY>`\
    \ 和 `</BODY>` 标签之间，创建一个包含一行三列的表格：\n4.  为 `<TABLE>` 标签添加以下属性：\n5.  在表格的第一个单元格中输入“California”，第二个单元格输入“The\
    \ Rockies”，第三个单元格输入“The Midwest”。\n6.  将每个单元格的宽度设为 33%（中间的单元格除外，它必须是 34%：它们的总和必须等于表格的\
    \ 100% 宽度）。\n\n```\n<TABLE>\n<TR>\n<TD> </TD>\n<TD> </TD>\n<TD> </TD>\n</TR>\n\
    </TABLE>\n```\n\n```\nWIDTH=\"100%\"\nBorder=\"0\"\nCELLPADDING=\"4\"\nCELLSPACING=\"\
    0\"\n```\n\n7.  使用 `<CENTER>` 标签将每个单元格中的文字居中：\n\n```\n<TD WIDTH=\"33%\">\n<CENTER>\n\
    California\n</CENTER>\n</TD>\n<TD WIDTH=\"34%\">\n<CENTER>\nThe Rockies\n</CENTER>\n\
    </TD>\n<TD WIDTH=\"33%\">\n<CENTER>\nThe Midwest\n</CENTER>\n</TD>\n```\n\n8.\
    \  将每个单元格中的文本更改为 arial 字体，大小为 -1，并将所有单元格的背景色更改为浅灰色（#cccccc）。\n\n9.  完成后，在浏览器中预览该页面。表格应如下所示：\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_82_0.png)\n\n10. 在表格下方，新建一个段落，输入标题“Traveling\
    \ West”。将其设置为 arial 字体，大小 +4，加粗。\n\n11. 在其下方，添加一个新段落，内容如下：\n\n当你前往西部时，一定要参观加利福尼亚的景点、落基山脉的自然奇观以及中西部的城市。\n\
    \n12. 将新段落设置为 verdana 字体，大小 -1，然后保存页面。\n\n13. 在浏览器中查看该页面。它应如下所示：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_83_0.png)\n\
    \n### 为主分区页面创建导航栏\n\n1.  创建一个新页面，文件名为 california.html。标题为“Vacationing in California”。\n\
    2.  创建与首页相同的表格，但改为 4 个单元格而不是 3 个。\n3.  按照首页的格式设置表格和文本，但将 California 单元格设为亮黄色（BGCOLOR=\"\
    #ffff00\"）以显示“您在此处”。\n4.  完成后，保存页面并在浏览器中查看。表格应如下所示：\n5.  将“Home”一词链接到主页（`<A HREF=\"\
    index.html\">Home</A>`），然后保存页面。\n6.  在记事本中打开主页。\n7.  将“California”一词链接到 California\
    \ 页面。\n8.  保存页面。\n\n> **提示：** 不要忘记更改单元格宽度。现在有四个单元格，它们的宽度总和必须为 100%。这意味着每个单元格占\
    \ 25%。\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_84_0.png)\n\n### 练习：创建导航栏\n\
    \n**任务：** 使您的 Travel West 网站看起来像 www.visibooks.com/travelwest 上的网站。\n\n1.  创建一个新的空白页，并将其保存为文件名\
    \ midwest.html。它将是 The Midwest 页面，但现在先留空。\n2.  创建一个新页面，文件名为 rockies.html。这是 The\
    \ Rockies 页面。标题为“Nature in the Rocky Mountains”。使其导航栏表格与 California 页面的完全相同。\n\
    3.  将“您在此处”的黄色背景色从 California 单元格更改为 The Rockies 单元格。\n4.  将 California、The Midwest\
    \ 和 Home 分别链接到各自的页面。\n5.  完成后，在浏览器中预览该页面。它应如下所示：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_85_0.png)\n\
    \n6.  对 California 和 Midwest 页面重复此过程，使它们拥有显示“您在此处”的功能导航栏。\n\n7.  转到主页，在导航栏中将 The\
    \ Rockies 和 The Midwest 分别链接到各自的页面。\n\n8.  将所有对应当前页面的文本设置为加粗。（例如：在 The Rockies\
    \ 页面上将“**The Rockies**”加粗。）\n\n9.  完成后，在浏览器中预览该网站。它应看起来像 **www.visibooks.com/travelwest**\
    \ 上的网站。\n\n## 为网站添加子分区\n\n### 插入用于内容和子分区链接的表格\n\n1.  在记事本中，打开 Traveling West 网站中的\
    \ California 页面。\n\n2.  在导航栏表格下方，添加另一个表格，该表格包含一行两列。为表格添加以下属性：\n\n```\nWIDTH=\"\
    100%\"\nBORDER=\"0\"\nCELLPADDING=\"16\"\nCELLSPACING=\"0\"\n```\n\n3.  将第一个单元格宽度设为\
    \ 25%，第二个单元格宽度设为 75%。\n\n```\n<TABLE BORDER=\"0\" WIDTH=\"100%\" CELLPADDING=\"\
    16\" CELLSPACING=\"0\">\n<TR>\n<TD WIDTH=\"25%\"> </TD>\n<TD WIDTH=\"75%\"> </TD>\n\
    </TR>\n</TABLE>\n```\n\n4.  在左侧单元格中，放入 California 主分区的子分区：\n\nThe Golden Gate\
    \ Bridge\nHighway 101\nBig Sur\n\n5.  在右侧单元格中，输入标题“Places to visit in California”。在标题下方，新建一个段落，输入以下句子：\n\
    \nWhen in California, be sure to see the Golden Gate bridge, Highway 101, and\
    \ Big Sur.\n\n6.  将两个单元格的内容都对齐到顶部。\n\n7.  将左侧导航单元格中的文本设置为 arial 字体，大小 -1。\n\n\
    8.  将右侧单元格中的标题设置为加粗、arial 字体、大小 +3。将标题下方的段落设置为 verdana 字体，大小 -1。\n\n9.  完成后，保存页面并在浏览器中预览。该页面应如下所示：\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_88_0.png)\n\n### 创建子分区页面\n\n1.  为子分区\
    \ The Golden Gate Bridge、Highway 101 和 Big Sur 创建新的空白页：\n\n| 页面 | 标题 | 文件名 |\n\
    |---|---|---|\n| The Golden Gate Bridge | Seeing the Golden Gate Bridge | goldengate.html\
    \ |\n| Highway 101 | Driving Highway 101 | highway101.html |\n| Big Sur | Staying\
    \ in Big Sur | bigsur.html |\n\n2.  从 California 页面复制表格并粘贴到 Golden Gate Bridge\
    \ 页面。\n\n3.  在 Golden Gate Bridge 页面上，将标题更改为“Seeing the Golden Gate Bridge”。将其大小设为\
    \ +2。\n\n4.  在标题下方，将段落更改为：\n\nThe Golden Gate Bridge isn't golden--it's actually\
    \ orange.\n\n5.  将其设置为 verdana 字体，大小 -1。\n\n6.  将 California、Highway 101 和 Big\
    \ Sur 分别链接到各自的页面。将 The Golden Gate Bridge 保留为纯文本以显示“您在此处”。\n\n7.  完成后，保存页面并在浏览器中查看。它应如下所示：\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_90_0.png)\n\n> **一致的页面布局**\n\n从一个页面复制表格并粘贴到新页面中，可确保所有页面共享相同的布局。\n\
    \n这种一致性使网站导航更容易：无论查看网站中的哪个页面，用户都知道页面的链接和内容将位于何处。\n\n### 练习：为网站添加子分区\n\nA. 保持表格在页面之间一致的最佳方法是什么？\n\
    \n任务：使您的 Travel West 网站的外观和功能与 www.visibooks.com/travelwest2 上的网站相同。\n\n1.  在记事本中打开\
    \ California 页面。将 The Golden Gate Bridge、Highway 101 和 Big Sur 分别链接到各自的页面。\n2.\
    \  打开 Golden Gate Bridge 页面。复制该页面上的两个表格。\n3.  将这些表格粘贴到 Highway 101 页面。\n4.  在\
    \ Highway 101 页面上，将 The Golden Gate Bridge 一词链接到 Golden Gate Bridge 页面。移除 Highway\
    \ 101 周围的锚点标签，使其显示为纯文本。\n5.  更改 Highway 101 页面的标题及其下方的描述性文本，使其如下所示：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_91_0.png)\n\
    \n6.  格式化 Big Sur 页面，使其布局和导航与 Golden Gate Bridge 和 Highway 101 页面保持一致。\n\n标题：\n\
    **Staying in Big Sur**\n\n段落：\nThere are many excellent hotels right on the ocean\
    \ in Big Sur.\n\n7.  保存所有页面。\n\n8.  完成创建此网站 California 分区中的所有页面后，在浏览器中预览。它应看起来和运行起来像\
    \ www.visibooks.com/travelwest2。\n\n答案\nA. 从一个页面复制并粘贴表格到另一个页面。\n\n### 在表格内放置表格\n\
    \n1.  在记事本中，打开 Golden Gate Bridge 页面（goldengate.html）。\n2.  在主标题下方的段落之前，开始一个新表格，包含：\n\
    \    - 2 行\n    - 每行 1 个单元格\n    - WIDTH=\"200\"\n    - CELLPADDING=\"8\"\n\n\
    > **提示：** 要创建包含多行的表格，只需在结束上一行后开始一个新行：\n\n```\n<TR>\n<TD> </TD>\n</TR>\n<TR>\n\
    <TD> </TD>\n</TR>\n```\n\n注意：宽度是一个数字——200——它以像素为单位渲染宽度，而不是百分比。\n\n3.  将顶部单元格设为蓝色（#0000ff），底部单元格设为灰色（#cccccc）。\n\
    4.  在顶部单元格中，输入文字“A Whole Lot of Paint”。将文字居中并加粗。"
