  md: '# Additional Resources


    **Webmonkey (www.webmonkey.com)**

    A how-to site for people building Web sites, filled with excellent tutorials and
    resources.


    **EchoEcho (www.echoecho.com)**

    Even more tutorials than Webmonkey, and all clear and detailed. Contains helpful
    statistics on browser usage, monitor settings, platforms, and other technology
    used to view Web pages.


    **Project Cool (www.projectcool.com)**

    Knowledge, guidance and inspiration for people building Web sites. It includes
    a good style sheet guide at projectcool.com/developer/reference/css_style.html.


    **Web Review (www.webreview.com)**

    A sharp and informative site for Web developers, with sections on Authoring, Design,
    Development, E-Commerce, Multimedia, and Back-End Web server Programming.


    **HTML Help (www.htmlhelp.com)**

    Good resource site with lots of information on style sheets and HTML technical
    standards. Includes online tools such as an HTML validator, link checker, and
    ASCII character guide.


    **HTML & XHTML: The Definitive Guide (book)**

    Chuck Musciano, Bill Kennedy, O’Reilly; ISBN: 059600026X

    Like most O’Reilly books, geared towards programmers. A comprehensive resource
    for HTML, but better yet, a guide to making HTML work with XML—the “next big thing”
    in Web development.


    **Voodoo’s Introduction to JavaScript (rummelplatz.uni-mannheim/~skoch/js/tutorial.htm)**

    One of the original JavaScript tutorials, and still excellent. Explains the “why”
    as well as the “how” of programming in JavaScript.


    **HomeSite**

    The mother of all HTML editing programs. Allows search-and-replace through entire
    sites, and includes many other useful features. Download a 30-day trial version
    at www.allaire.com.'
