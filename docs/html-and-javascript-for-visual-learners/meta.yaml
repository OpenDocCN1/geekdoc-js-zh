- img_proc: true
  md: '# Create a table


    +   1. Create a new folder on the C:\ drive called “Travel.”


    +   2. In Notepad, create a home page (file name index.html) titled “Traveling
    Down South.” Save it in the Travel folder.


    > **Tip:** Make sure that your new home page has the correct file name—index.html—and
    all necessary tags:


    ```

    <HTML>

    <HEAD>

    <!--Created by Your Name-->

    </HEAD>

    <TITLE>

    Traveling Down South

    </TITLE>

    <BODY>

    </BODY>

    </HTML>

    ```


    +   3. You’re going to create a simple one-row, two-cell table that looks like
    this:


    | links | content |


    +   4. The first step is to begin the table. Below the <BODY> tag, begin your
    table with the <TABLE> tag:


    ```

    <BODY>

    <TABLE>

    ```


    +   5. Below the <TABLE> tag, start a row with the <TR> (Table Row) tag:


    ```

    <BODY>

    <TABLE>

    <TR>

    ```'
  merge: -1
  pgno: 64
- img_proc: true
  md: '6. In the table row, start the first cell with the <TD> (Table Data) tag:


    ```

    <BODY>

    <TABLE>

    <TR>

    <TD>

    ```


    7. After the <TD> tag, type the word “links,” then close the cell with the </TD>
    tag:


    ```

    <BODY>

    <TABLE>

    <TR>

    <TD>Links</TD>

    ```


    You’ve created the first cell in the row:


    | links | content |


    8. Now create the second cell in the row by adding a <TD> tag, the word Content,
    and closing the cell with a </TD> tag:


    ```

    <BODY>

    <TABLE>

    <TR>

    <TD>Links</TD>

    <TD>Content</TD>

    ```


    | links | content |'
