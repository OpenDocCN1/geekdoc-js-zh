  md: '# # Download Visibooks for Free


    **All Visibooks can be downloaded at www.visibooks.com.**

    Visibooks believes that you shouldn''t have to rely on strangers'' reviews or
    skim at a bookstore when deciding which computer book to buy. By putting our books
    online for you to download and review, we make it easier to find the right book.


    **Visibooks are free. Why buy a bound copy?**

    Visibooks are more useful on paper than as digital files. If you''d like to trade
    a small amount of money for a big chunk of time, purchase a bound copy of your
    Visibook:


    | | Print-It-Yourself | Buy a Bound Copy |

    |---|---|---|

    | **Printing** | Spend 1-2 hours printing it at home, or 30 minutes at work trying
    not to get caught using the office printer. Plus 1-2 hours to go to Kinko''s,
    have it bound, then bring it back. Or 5 minutes to pick up and sort pages that
    fell out after being bound with a clip. | 2 minutes to order |

    | **Binding** | Spend $1.50 for 150 sheets of paper, plus $2 depletion of printer
    cartridge, plus $8 for plastic comb binding. | Less than $20 for a spiral-bound
    copy, printed on heavyweight paper with full-color cover. |

    | **Total** | Spend 30 minutes to 4 hours. Spend $3.50 to $11.50. | 2 minutes,
    less than $25 shipped. |


    **Know someone who''d like to download Visibooks for free?**

    Tell someone about Visibooks: www.visibooks.com/refer.html.


    **Want to know when new Visibooks are published?**

    Sign up to be notified via e-mail: www.visibooks.com/notify.html.'
