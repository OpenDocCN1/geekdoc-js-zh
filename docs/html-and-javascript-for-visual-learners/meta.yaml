  md: '# Create a home page


    # Create the home page


    +   1. Open a browser, such as Internet Explorer or Netscape Navigator.


    +   2. Open the program Notepad. Do this by first clicking the Start button on
    the taskbar, then Programs, then Accessories, then Notepad.


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_9_0.png)


    +   3. At the top of the Notepad screen, type:


    ```

    <HTML>

    ```


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_9_1.png)


    **Tip:** <HTML> is a tag. Tags are instructions to a Web browser. This particular
    instruction lets the Web browser know that what follows is a Web page, written
    in HTML.


    Tags can be written in upper-case or lower-case letters—it doesn’t matter which.
    <HTML>, <html>, or <HtMl> are all fine.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '4. Save the file.


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_10_0.png)


    5. When the Save As window appears, select the C:\ drive in the Save in drop-down
    list.


    6. Create a new folder by clicking on the ![Create New Folder Icon](icon.png)
    icon.


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_10_1.png)'
