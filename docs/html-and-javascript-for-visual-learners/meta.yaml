  mdcn: "## 实践：使用样式表\n\n1.  在记事本中打开 `format.css`。\n2.  在 `.bodytext` 样式下方添加以下样式指令：\n\
    3.  保存 `format.css`。\n4.  打开主页并替换：\n\n```\n.heading {font-family: Verdana, Arial,\
    \ Helvetica, sans-serif; font-size: 48pt}\n```\n\n```\n<STYLE TYPE=\"text/css\"\
    >\n<!--\nA:link {color:\"#ff0000\"; text-decoration: none}\nA:visited {color:\"\
    #ff0000\"; text-decoration: none}\nA:hover {color:\"#00ff00\"; text-decoration:\
    \ underline}\n-->\n</STYLE>\n```\n\n为原始的 `<LINK>` 标签：\n\n```\n<LINK REL=\"stylesheet\"\
    \ HREF=\"format.css\">\n```\n\n5.  为 `<H1>` 标签添加 `CLASS=\"heading\"` 属性。\n\n```\n\
    <H1 CLASS=\"heading\">\n```\n\n6.  保存主页并在浏览器中查看。它应该看起来像这样：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_125_0.png)\n\
    \n## 将网站上传到 Web 服务器\n\n> FTP\n\nFTP 代表“文件传输协议”，是一种通过互联网在计算机之间传输文件的方式。将网站上传到 Web\
    \ 服务器需要特殊的 FTP 软件。\n\n用于从服务器上传和下载网页的最流行程序是 WS_FTP。LE 版本是免费的，可以从 www.download.com\
    \ 或 www.tucows.com 下载。\n\n专业版售价 39.95 美元，也可以在其制造商 www.ipswitch.com 的网站上找到。\n\n\
    以下是使用免费 LE 版本上传文件的说明。\n\n1.  下载 WS_FTP LE 并安装它。\n2.  打开程序。你应该会看到一个初始的会话属性窗口。它应该看起来像这样：\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_126_0.png)\n\n3.  单击“新建”按钮。\n\n4. \
    \ 在“配置文件名称”文本框中，输入你的上传过程的名称，例如“上传我的网站”。\n\n5.  在“主机名/地址”文本框中，输入你的 Web 服务器的名称或\
    \ IP 地址。它可以是类似 www.visibooks.com、washington.patriot.net 或 207.176.7.217 的地址。\n\
    \n> **提示：** 联系你的 Web 服务器管理员以获取你的 Web 服务器的主机名或 IP 地址。Web 服务器管理员还可以提供你的用户 ID 和密码。\n\
    \n6.  将“主机类型”设置为“自动检测”，并输入你的用户 ID 和密码。\n\n7.  勾选“保存密码”复选框，然后单击“应用”按钮。会话属性窗口现在应该看起来像这样：\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_127_0.png)\n\n8.  单击“确定”按钮，在联系到你的 Web\
    \ 服务器后，WS_FTP 窗口将出现。它应该看起来像这样：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_128_0.png)\n\
    \n9.  在左侧“本地系统”窗口的顶部，双击绿色箭头图标以在文件层次结构中向上移动。再次双击它以进入 C:\\ 驱动器。\n\n10. 双击包含你网站的文件夹以将其打开。\n\
    \n11. 在右侧“远程系统”窗口中，双击 `public_html` 文件夹，或指向服务器上你网站的文件夹。\n\n12. 你现在应该能在你的计算机和 Web\
    \ 服务器上看到你的网页。要发送你的网页，请选中它们，然后单击 ![button](https://via.placeholder.com/15) 按钮将它们发送到\
    \ Web 服务器。\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_129_0.png)\n\n> **提示：**\
    \ 如果你的 Web 服务器上已经有页面，你发送的新页面将替换具有相同文件名的旧版本。\n\n## 实践：交互性\n\n### 创建新的主页和网站\n\n\
    1.  创建一个标题为“世界舞蹈”的新主页。将其保存在 `C:\\Dance`。\n2.  为网站创建一个主页，看起来像这样：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_130_0.png)\n\
    \n> **提示：** 在 www.visibooks.com/dancing 获取此页面的图形和文本。\n\n3.  在此页面和网站中的每个其他页面的底部，放置一个指向\
    \ info@worlddance.org 的电子邮件链接。\n\n### 创建主要部分页面\n\n1.  将导航栏中的“American”、“Latin”和“European”这些词分别链接到关于美洲、拉丁和欧洲舞蹈的新主要部分页面。\n\
    \n> **提示：** 在 www.visibooks.com/dancing 获取这些页面的图像和文本。\n\n美洲舞蹈页面应该看起来像这样：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_131_0.png)\n\
    \n2.  使拉丁和欧洲页面与美洲舞蹈页面保持一致。\n\n### 创建子部分页面\n\n1.  在美洲舞蹈页面上，将“Lindy Hop”和“Foxtrot”这些词链接到关于这些舞蹈的新子部分页面。Lindy\
    \ Hop 页面应该看起来像这样：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_132_0.png)\n\n**提示：**\
    \ 在 www.visibooks.com/dancesub 获取此页面和其他子部分页面的图像和文本。\n\n2.  使 Foxtrot 页面与 Lindy\
    \ Hop 页面保持一致。\n\n3.  为拉丁部分创建子部分页面 Tango、Merengue 和 Salsa。\n\n4.  为欧洲部分创建子部分页面\
    \ Waltz 和 Contra Dancing。\n\n### META 标签\n\n1.  在主页中包含此 META 描述：\n\n   《世界舞蹈》包含有关美洲、拉丁和欧洲舞蹈的信息。\n\
    \n2.  在主页中包含这些 META 关键词：\n\n   舞蹈，世界，探戈，梅伦格，萨尔萨，林迪跳，狐步舞，华尔兹，对舞。\n\n### 创建表单\n\n\
    1.  在主页上，插入一个看起来像这样的表单：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_134_0.png)\n\
    \n2.  完成后，在浏览器中预览整个网站。它应该看起来像 www.visibooks.com/worlddancing 上的网站。\n\n## 高级布局\n\
    \n在本节中，你将学习如何：\n\n-   使用背景图像\n-   使用间隔 GIF\n-   插入水平线\n-   指定页边距\n\n你将创建一个看起来像这样的页面：\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_136_0.png)\n\n### 使用背景图形\n\n1.  打开记事本。\n\
    2.  创建一个包含所有必要 HTML 标签和一个两列表格的新页面：\n    行数：1\n    列数：2\n    宽度：100%\n    边框：0\n\
    \    单元格边距：18\n    单元格间距：0\n3.  将文件保存在计算机桌面上，文件名为 `advlayout.html`。将其标题设为“高级布局”。\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_137_0.png)\n\n4.  将表格中的两个单元格都设置为深蓝色背景色（#000099）。\n\
    5.  使第一个单元格宽度为 10%，第二个单元格宽度为 90%。\n\n6.  转到 www.visibooks.com/advlayout/pics 并将\
    \ `techtool.gif` 保存在计算机桌面上。将其插入左侧单元格。\n\n7.  转到 www.visibooks.com/advlayout/pics\
    \ 并将 `bkgd.gif` 保存在计算机桌面上。使用 `BACKGROUND` 属性将其设为右侧单元格的背景：\n\n```\n<TD WIDTH=\"\
    90%\" BGCOLOR=\"#000099\" BACKGROUND=\"bkgd.gif\">\n```\n\n8.  在右侧单元格中，输入文本“The\
    \ Magazine for People Who Like Gadgets”。\n\n9.  将文本设为 Arial 字体，大小 +1，加粗。\n\n10.\
    \ 将文本颜色设为白色。\n\n11. 在浏览器中预览页面。它应该看起来像这样：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_138_0.png)\n\
    \n**提示：** 注意单元格底部附近 `bkgd.gif` 开始重复的那条线。它重复是因为背景图形会平铺以填充单元格中的所有可用空间。该单元格高 136\
    \ 像素：`techtool.gif` 占 100 像素，加上单元格边距 36 像素（`techtool.gif` 上下各 18 像素）。\n\n`bkgd.gif`\
    \ 只有 123 像素高；因此，还剩下 13 像素的空间需要填充。要解决此问题，请使用图像编辑程序（如 Photoshop、Fireworks 或 Paint\
    \ Shop Pro）将背景图像调整为 136 像素高。"
