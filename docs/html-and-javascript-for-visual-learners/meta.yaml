    # Create a style sheet


    +   1. Create a new page with file name format.css.

    2. Save it in a new folder on the C:\ drive called CSS Site.


    > **Tip:** This is a style sheet, not a Web page. It''s a file that gives Web
    pages formatting instructions, but isn''t ever seen. It contains no HTML, and
    has a different file extension: .css rather than .html.


    3. On the blank format.css page, insert the following instruction:


    ```

    .bodytext {font-family:"Courier New", Courier, mono; font-size:11pt; font-weight:bold;
    color:"#ff0000"; background-color:#ccccff"}

    ```


    Here are the component parts of the formatting instructions for the .bodytext
    style:


    | .bodytext | ➡ The type of text to be formatted. |

    | font-family | ➡ The fonts in which the text should be displayed. First the computer
    looks for Courier New, then Courier, then a monospaced font. |

    | font-size | ➡ The size of the text. Unlike in HTML, style sheets allow specific
    point sizes to be used. |

    | font-weight | ➡ Bold or plain text. |

    | color | ➡ The color of the text. |

    | background-color | ➡ Changes the color of the page area directly behind the
    text. |'
