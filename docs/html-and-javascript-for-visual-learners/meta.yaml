    # Hexadecimal colors, continued


    The color values go from the maximum amount of color (ff) to no color at all (00):


    | Max | Mid-range | None |

    |---|---|---|

    | ff | cc | 99 | 66 | 33 | 00 |


    Navy blue would be shown in hexadecimals as no red (00), no green, (00), and a
