    # Create a table


    +   1. Create a new folder on the C:\ drive called “Travel.”


    +   2. In Notepad, create a home page (file name index.html) titled “Traveling
    Down South.” Save it in the Travel folder.


    > **Tip:** Make sure that your new home page has the correct file name—index.html—and
    all necessary tags:


    ```

    <HTML>

    <HEAD>

    <!--Created by Your Name-->

    </HEAD>

    <TITLE>

    Traveling Down South

    </TITLE>

    <BODY>

    </BODY>

    </HTML>

    ```


    +   3. You’re going to create a simple one-row, two-cell table that looks like
    this:


    | links | content |


    +   4. The first step is to begin the table. Below the <BODY> tag, begin your
    table with the <TABLE> tag:


    ```

    <BODY>

    <TABLE>

    ```


    +   5. Below the <TABLE> tag, start a row with the <TR> (Table Row) tag:


    ```

    <BODY>

    <TABLE>

    <TR>

    ```'
- md: "## Format a table\n\n1. Now you’ll extend the table. In Notepad, add the **WIDTH=\"\
    100%\"** attribute to the **<TABLE>** tag:\n\n```\n<BODY>\n<TABLE BORDER=1 WIDTH=\"\
    100%\">\n<TR>\n<TD>Links</TD>\n<TD>Content</TD>\n</TR>\n</TABLE>\n```\n\n2. Save\
    \ the page and view it in the browser. It should look like this:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_68_0.png)\n\
    \n## Percentage vs. fixed-width tables\n\nWhen laying out a page using a table,\
    \ set the table’s width at 100%. That way, the contents of the page can stretch\
    \ to fill the whole monitor, regardless of the monitor’s resolution.\n\nIf you\
    \ want it to fit a fixed-width table on all monitors, you’re limited to a table\
    \ 580 pixels wide:\n\n**640 pixels** width of low-resolution monitor **- 20 pixels**\
    \ browser offset: the distance that page content is indented from the sides of\
    \ the browser **- 40 pixels** 20 for the vertical scroll bar, plus 20 extra **=\
    \ 580 pixels** width available for table\n\nCreating pages with fixed-width tables\
    \ offers precise control, but wastes space on higher-resolution monitors:\n\n\
    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_69_0.png)\n\n**Page:** laid out using\
    \ a table 580 pixels wide\n\n**Monitor used to view page:** 1280 pixels wide\n\
    \n3. Remove the table border by specifying BORDER=\"0\":\n\n```\n<BODY>\n<TABLE\
    \ BORDER=\"0\" WIDTH=\"100%\">\n<TR>\n<TD>Links</TD>\n<TD>Content</TD>\n</TR>\n\
    </TABLE>\n```\n\n4. Make the first cell light grey by adding the attribute BGCOLOR=\"\
    #CCCCCC\" to the first <TD> tag:\n\n```\n<BODY>\n<TABLE BORDER=\"0\" WIDTH=\"\
    100%\">\n<TR>\n<TD BGCOLOR=\"#CCCCCC\">Links</TD>\n<TD>Content</TD>\n</TR>\n</TABLE>\n\
    ```\n\n5. Save the page and view it in the browser. It should look like this:\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_70_0.png)\n\n6. You’ll notice that\
    \ the word Links is right up against the edge of the left-hand cell. To add a\
    \ 16-pixel margin between the edge of the cells and their contents, add the attribute\
    \ **CELLPADDING=\"16\"** to the **<TABLE>** tag:\n\n```\n<BODY>\n<TABLE BORDER=\"\
    0\" WIDTH=\"100%\" CELLPADDING=\"16\">\n<TR>\n<TD BGCOLOR=\"#CCCCCC\">Links</TD>\n\
    <TD>Content</TD>\n</TR>\n</TABLE>\n```\n\n7. To eliminate the spacing between\
    \ cells, add the attribute **CELLSPACING=\"0\"** to the **<TABLE>** tag:\n\n```\n\
    <BODY>\n<TABLE BORDER=\"0\" WIDTH=\"100%\" CELLPADDING=\"16\" CELLSPACING=\"0\"\
    >\n<TR>\n<TD BGCOLOR=\"#CCCCCC\">Links</TD>\n<TD>Content</TD>\n</TR>\n</TABLE>\n\
    ```\n\n8. Save the page and view it in the browser. It should look like this:\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_71_0.png)\n\n## Create a table-based\
    \ home page\n\n1. Create a folder called “graphics” inside the Travel folder on\
