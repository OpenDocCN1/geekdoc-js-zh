  md: '10. Save the page by clicking on the Save button.


    > **Home page file names**


    All Web pages have a .html extension (or .htm).


    All home pages have the file name index.html. index.html comes up automatically
    when the address of a domain or directory where it’s located is typed into a browser.


    For instance, if you go to www.visibooks.com, the home page appears automatically.
    That’s because its file name is index.html. If the file name of the Visibooks
    home page was homepage.html, you’d have to type www.visibooks.com/homepage.html
    to get it to appear.


    *The Microsoft exception:* To get your home page to come up automatically on a
    Web server running Microsoft’s Internet Information Server as it’s operating system,
    give your home page the file name default.htm.


    11. Below the `<HTML>` tag, type:


    ```

    <HEAD>

    <!--Created by Your Name-->

    </HEAD>

    ```


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_12_0.png)


    **Tip:** The `<HEAD>` section contains information that doesn’t show up on the
    page when it is viewed in a browser. Note the closing `</HEAD>` tag: in HTML,
    you must give the browser instructions to end something as well as start it.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'Tip: <!--Created by Your Name--> is called a comment. Whatever text is between
    the dashes won’t show up on a browser’s screen—it’s only visible if someone views
    the page’s HTML code. You need to include the ! for this to work.


    12. Below the </HEAD> tag, title the page “A Home Page About Dogs” by using <TITLE>
    tags:


    ```

    <TITLE>

    A Home Page About Dogs

    </TITLE>

    ```


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_13_0.png)


    Tip: Note that the text “A Home Page About Dogs” is not a tag. It is text surrounded
    by tags. The <TITLE> tags tell the browser what to do with the text: make it the
    title of the page.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Page titles


    The title of a Web page describes the page. It’s what appears in a browser’s History
    list. The title also shows up as a link when a page comes up in a search engine.
    If all your pages have discrete, descriptive titles, they’ll be easier for people
    to find.


    The page title shows up in the top, or “title,” bar of the browser used to view
    it. The title of this page is Dogs.


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_14_0.png)


    13.Below the `</TITLE>` tag, add:


    ```

    <BODY>


    </BODY>

    ```


    > **Tip:** *Anything you want to be visible in a browser’s main window, put between
    the `<BODY>` and `</BODY>` tags.*'
