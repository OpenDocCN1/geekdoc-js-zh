- md: "# HTML and JavaScript for Visual Learners\n\ncomputer books for visual learners\n\
    \n1810 Monument Avenue, Suite 100\nRichmond, VA 23220\nwww.visibooks.com\n\n#\
    \ HTML and JavaScript for Visual Learners\n\nPublished by Visibooks, LLC, Richmond,\
    \ VA\n\n# Copyright\n\n> You have permission to post this book on a Web site,\
