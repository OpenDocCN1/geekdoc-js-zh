  md: '# Lay out pages using tables


    # Tables and Web page layout


    Almost all professional-quality Web sites are laid out using tables. Just like
    a spreadsheet has cells that contain numbers, a table on a Web page has cells
    that contain links, graphics, and text.


    The lines on this page clearly show its layout with table cells:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_63_0.png)'
  merge: -1
