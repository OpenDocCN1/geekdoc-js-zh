- md: '## Making a form work


    To make a form work, an action must be assigned to it. To add an action to your
    form, add the **ACTION** attribute to the **<FORM>** tag.


    Consult with your Web server administrator to specify what action you should assign.
    For example, an action for a form might look something like this:


    ```

    <FORM METHOD="POST"

    ACTION="http://www.yourdomain.com/cgi-bin/formmail.pl">

    ```


    This tells the form to post its data to a program called formmail.pl on at yourdomain.com.
    This program might take the form data and e-mail it to whomever you choose.


    ## Practice: Create forms


    1. Create a new page with file name favoritesform.html. Title it “My Favorite
    Places.”

    2. Insert a form, then insert a table with four rows and two cells in each row.
    Fill the cells with the text and form objects seen below:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_114_0.png)


    **Tip:** The HTML code for a drop-down list looks like this:


    ```

    <SELECT NAME="select">

    <OPTION>First Choice</OPTION>

    <OPTION>Second Choice</OPTION>

    <OPTION>Third Choice</OPTION>

    </SELECT>

    ```


    The HTML code for radio buttons looks like this:


    ```

    <input type="radio" name="radios" value="radio1" checked> This is radio button
    1

    <br>

    <input type="radio" name="radios" value="radio2"> This is radio button 2

    ```


    3. Put these values in the drop-down list:


    - California

    - The Rockies

    - The Midwest


    4. When finished, save the page and preview it in the browser. It should look
    like this:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_115_0.png)


    ## Use style sheets


    ### The pros and cons of style sheets


    Style sheets are a flexible, powerful tool for laying out and formatting Web pages.
    They allow every page in a site to get display instructions from just one style
    sheet.


    For instance, if you created a 1,000 page Web site using style sheets, and you
    wanted to change the link color on every page, you''d only need to change the
    link color on one style sheet. Without style sheets, you''d have to change 1,000
    individual pages.


    Style sheets can also create display effects. An example of this is at www.visibooks.com.
    When you roll your cursor over links, they become underlined—if you''re viewing
    the page with the Internet Explorer browser.


    That''s the disadvantage of using style sheets: they''re interpreted differently
    by each browser. A style sheet-based page viewed in Internet Explorer may look
    different than it does in Netscape Navigator or other browsers.


    ## Create a style sheet


    1. Create a new page with file name format.css.

    2. Save it in a new folder on the C:\ drive called CSS Site.


    > **Tip:** This is a style sheet, not a Web page. It''s a file that gives Web
    pages formatting instructions, but isn''t ever seen. It contains no HTML, and
    has a different file extension: .css rather than .html.


    3. On the blank format.css page, insert the following instruction:


    ```

    .bodytext {font-family:"Courier New", Courier, mono; font-size:11pt; font-weight:bold;
    color:"#ff0000"; background-color:#ccccff"}

    ```


    Here are the component parts of the formatting instructions for the .bodytext
    style:


    | .bodytext | ➡ The type of text to be formatted. |

    | font-family | ➡ The fonts in which the text should be displayed. First the computer
    looks for Courier New, then Courier, then a monospaced font. |

    | font-size | ➡ The size of the text. Unlike in HTML, style sheets allow specific
    point sizes to be used. |

    | font-weight | ➡ Bold or plain text. |

    | color | ➡ The color of the text. |

    | background-color | ➡ Changes the color of the page area directly behind the
    text. |


    4. Save format.css. It should look like this:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_118_0.png)


    ## Apply a style sheet


    1. In Notepad, create a new home page and put it the CSS Site folder.

    2. Title the home page “Style Sheet Demo Page.”

    3. Below the <BODY> tag, type the text CSS Site. Make it a size 1 heading using
    <H1> tags:

    4. In a new paragraph beneath it, type the sentence, “Cascading Style Sheets are
    a powerful and flexible tool for formatting Web pages:”

    5. Save the page and view it in the browser. It should look like this:


    ```

    <BODY>

    <H1>CSS Site</H1>

    ```


    ```

    <BODY>

    <H1>CSS Site</H1>

    <P>Cascading Style Sheets are a powerful and flexible tool for formatting Web
    pages</P>

    ```


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_119_0.png)


    6. Below the <HEAD> tag, add a <LINK> tag that points to format.css:


    ```

    <HTML>

    <HEAD>

    <LINK REL="stylesheet" HREF="format.css">

    </HEAD>

    <TITLE>Style Sheet Demo Page</TITLE>

    ```


    7. In the <P> tag, add the CLASS attribute that points to the .bodytext style:


    ```

    <P CLASS="bodytext">Cascading Style Sheets are a powerful and flexible tool for
    formatting Web pages.</P>

    ```


    8. Save the home page and view it in the browser. It should look like this:


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_120_0.png)


    The home page''s <LINK REL="stylesheet" HREF="format.css"> tag referred to format.css
    for formatting instructions.


    The paragraph on the page referred to the .bodytext style on format.css for formatting
    instructions.


    **Tip:** To use the same stylesheet to format pages throughout a site, just insert
    the same `<LINK>` tag in each Web page. For instance, if there were 100 pages
    in the CSS Site, they could all contain the same `<LINK REL="stylesheet" HREF="format.css">`
    tag and format body text the same way by using the `<P CLASS="bodytext">` tag.


    ## Create link effects with style sheets


    ### “Cascading” style sheets


    Style instructions can be contained within a Web page itself, without referring
    to a separate style sheet. These instructions will override those of the style
    sheet, hence the term “Cascading Style Sheets:”


    An instruction in a page’s text...


    ```

    <FONT

    COLOR="#ff0000">

    This is red

    text.</FONT>

    ```


    ...overrides a style instruction for the page...


    ```

    <STYLE

    TYPE="text/css">

    .greentext { color:

    "#00ff00" }

    </STYLE>

    ```


    ```

    <BODY>

    <P

    CLASS="greentext">

    This is green text.

    ```


    ...which overrides a style instruction for the site.


    ```

    <LINK REL="stylesheet"

    HREF="format.css">

    ```


    ```

    </HEAD>

    ```


    ```

    <BODY>

    ```


    ```

    <P CLASS="bodytext">

    This is blue text.

    ```


    The following exercise employs an in-page style.'
  mdcn: '## 让表单生效


    要让表单生效，必须为其分配一个操作。要向表单添加操作，请在 **<FORM>** 标签中添加 **ACTION** 属性。


    请咨询您的 Web 服务器管理员，以确定应分配何种操作。例如，表单的操作可能类似于这样：


    ```

    <FORM METHOD="POST"

    ACTION="http://www.yourdomain.com/cgi-bin/formmail.pl">

    ```


    这会指示表单将其数据发送到您域名上的一个名为 formmail.pl 的程序。该程序可能会获取表单数据，并将其通过电子邮件发送给您指定的任何人。


    ## 实践：创建表单


    1.  创建一个新页面，文件名为 favoritesform.html。将其标题设为“My Favorite Places”。

    2.  插入一个表单，然后插入一个包含四行、每行两个单元格的表格。按照下图所示，在单元格中填入文本和表单对象：


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_114_0.png)


    **提示：** 下拉列表的 HTML 代码如下所示：


    ```

    <SELECT NAME="select">

    <OPTION>First Choice</OPTION>

    <OPTION>Second Choice</OPTION>

    <OPTION>Third Choice</OPTION>

    </SELECT>

    ```


    单选按钮的 HTML 代码如下所示：


    ```

    <input type="radio" name="radios" value="radio1" checked> This is radio button
    1

    <br>

    <input type="radio" name="radios" value="radio2"> This is radio button 2

    ```


    3.  在下拉列表中填入以下值：


    -   California

    -   The Rockies

    -   The Midwest


    4.  完成后，保存页面并在浏览器中预览。它应该看起来像这样：


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_115_0.png)


    ## 使用样式表


    ### 样式表的优缺点


    样式表是用于布局和格式化网页的灵活而强大的工具。它们允许网站中的每个页面都从一个样式表获取显示指令。


    例如，如果您使用样式表创建了一个包含 1,000 个页面的网站，并且您想更改每个页面上的链接颜色，您只需在一个样式表中更改链接颜色即可。如果没有样式表，您将不得不更改
    1,000 个单独的页面。


    样式表还可以创建显示效果。一个例子可以在 www.visibooks.com 上看到。当您将光标悬停在链接上时，它们会变成下划线——如果您使用的是 Internet
    Explorer 浏览器查看页面的话。


    这就是使用样式表的缺点：不同的浏览器对它们的解释不同。在 Internet Explorer 中查看的基于样式表的页面，其外观可能与在 Netscape Navigator
    或其他浏览器中查看时不同。


    ## 创建样式表


    1.  创建一个新页面，文件名为 format.css。

    2.  将其保存在 C:\ 驱动器上一个名为 CSS Site 的新文件夹中。


    > **提示：** 这是一个样式表，而不是一个网页。它是一个为网页提供格式化指令但永远不会被看到的文件。它不包含 HTML，并且具有不同的文件扩展名：.css
    而不是 .html。


    3.  在空白的 format.css 页面上，插入以下指令：


    ```

    .bodytext {font-family:"Courier New", Courier, mono; font-size:11pt; font-weight:bold;
    color:"#ff0000"; background-color:#ccccff"}

    ```


    以下是 .bodytext 样式的格式化指令的组成部分：


    | .bodytext | ➡ 要格式化的文本类型。 |

    | font-family | ➡ 文本应显示的字体。计算机会首先查找 Courier New，然后是 Courier，最后是等宽字体。 |

    | font-size | ➡ 文本的大小。与 HTML 不同，样式表允许使用特定的磅值大小。 |

    | font-weight | ➡ 粗体或普通文本。 |

    | color | ➡ 文本的颜色。 |

    | background-color | ➡ 更改文本正后方页面区域的颜色。 |


    4.  保存 format.css。它应该看起来像这样：


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_118_0.png)


    ## 应用样式表


    1.  在记事本中，创建一个新的主页，并将其放入 CSS Site 文件夹中。

    2.  将主页标题设为“Style Sheet Demo Page”。

    3.  在 <BODY> 标签下方，输入文本 CSS Site。使用 <H1> 标签将其设为一级标题：

    4.  在其下方的新段落中，输入句子“Cascading Style Sheets are a powerful and flexible tool for
    formatting Web pages:”

    5.  保存页面并在浏览器中查看。它应该看起来像这样：


    ```

    <BODY>

    <H1>CSS Site</H1>

    ```


    ```

    <BODY>

    <H1>CSS Site</H1>

    <P>Cascading Style Sheets are a powerful and flexible tool for formatting Web
    pages</P>

    ```


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_119_0.png)


    6.  在 <HEAD> 标签下方，添加一个指向 format.css 的 <LINK> 标签：


    ```

    <HTML>

    <HEAD>

    <LINK REL="stylesheet" HREF="format.css">

    </HEAD>

    <TITLE>Style Sheet Demo Page</TITLE>

    ```


    7.  在 <P> 标签中，添加指向 .bodytext 样式的 CLASS 属性：


    ```

    <P CLASS="bodytext">Cascading Style Sheets are a powerful and flexible tool for
    formatting Web pages.</P>

    ```


    8.  保存主页并在浏览器中查看。它应该看起来像这样：


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_120_0.png)


    主页的 `<LINK REL="stylesheet" HREF="format.css">` 标签引用了 format.css 以获取格式化指令。


    页面上的段落引用了 format.css 上的 .bodytext 样式以获取格式化指令。


    **提示：** 要使用相同的样式表格式化整个网站中的页面，只需在每个网页中插入相同的 `<LINK>` 标签即可。例如，如果 CSS Site 中有 100
    个页面，它们都可以包含相同的 `<LINK REL="stylesheet" HREF="format.css">` 标签，并通过使用 `<P CLASS="bodytext">`
    标签以相同的方式格式化正文文本。


    ## 使用样式表创建链接效果


    ### “层叠”样式表


    样式指令可以包含在网页本身中，而无需引用单独的样式表。这些指令将覆盖样式表的指令，因此得名“层叠样式表”：


    页面文本中的一个指令...


    ```

    <FONT

    COLOR="#ff0000">

    This is red

    text.</FONT>

    ```


    ...覆盖了页面的样式指令...


    ```

    <STYLE

    TYPE="text/css">

    .greentext { color:

    "#00ff00" }

    </STYLE>

    ```


    ```

    <BODY>

    <P

    CLASS="greentext">

    This is green text.

    ```


    ...而后者又覆盖了网站的样式指令。


    ```

    <LINK REL="stylesheet"

    HREF="format.css">

    ```


    ```

    </HEAD>

    ```


    ```

    <BODY>

    ```


    ```

    <P CLASS="bodytext">

    This is blue text.

    ```


    以下练习将使用页面内样式。'
