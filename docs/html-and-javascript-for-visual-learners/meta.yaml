- md: "## Link to an external site using frames\n\n## How to use frames\n\n“Frames”\
    \ are a way to put more than one Web page at a time on a computer’s screen:\n\n\
    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_96_0.png)\n\nA live example of frames\
    \ can be seen at www.visibooks.com/frames.\n\nMany sites that used frames have\
    \ now eliminated them, returning to single-page layouts. That’s because frames\
    \ have serious drawbacks:\n\n- Frames are difficult to update. Every screen involves\
    \ three or more pages to keep track of: the frameset itself, and at least two\
    \ others to go in the frames.\n- Frame navigation is tricky. Links require special\
    \ “targets” that go from page to frame.\n- Frames often require people to scroll\
    \ annoyingly in more than one place.\n\nHowever, frames are useful for one thing:\
    \ they allow a user to get back to a site with one click while clicking through\
    \ other sites linked to it. An example of this can be seen in the external links\
    \ at www.charuhas.com/sites.html.\n\nThe following exercise demonstrates how to\
    \ use frames to provide convenient links to external sites.\n\n1. On the Golden\
    \ Gate Bridge page, in a new paragraph below the first one, type:\n\nVisit the\
    \ Web site for the Golden Gate bridge at www.goldengate.org.\n\nwww.goldengate.org\
    \ will be linked to the frameset page.\n\n2. Create a new blank page with file\
    \ name framesetgg.html. This will be the “frameset” page that holds two other\
    \ pages.\n\n3. Insert this HTML code into the new blank page:\n\n```\n<HTML>\n\
    \n<HEAD></HEAD>\n\n<TITLE>Golden Gate Frameset</TITLE>\n\n<FRAMESET ROWS=\"50,\
    \ *\">\n\n<FRAME NAME=\"topframe\" SRC=\"backtogg.html\">\n\n<FRAME NAME=\"bottomframe\"\
    \nSRC=\"http://www.goldengate.org\">\n\n</FRAMESET>\n\n</HTML>\n```\n\nDownload\
    \ other Visibooks for free at www.visibooks.com\n\n**Tip:** The `ROWS=\"50, *\"\
    ` attribute in the `<FRAMESET>` tag tells the frameset to make the top frame 50\
    \ pixels high, and to allow the bottom frame to fill in the rest of the available\
    \ space beneath it.\n\nThe top frame will contain the link back to the Golden\
    \ Gate Bridge page. The bottom frame will contain an external site: www.goldengate.org.\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_98_0.png)\n\n4. Save framesetgg.html.\n\
    5. Create a new page with file name backtogg.html. This is the page that will\
    \ contain a link back to the Golden Gate Bridge page.\n6. Give the new page a\
    \ light grey background, and a single link on it: [Back to the Golden Gate Bridge\
    \ page](#).\n7. Use an anchor tag with the `TARGET=\"_top\"` attribute to link\
    \ back to the Golden Gate Bridge page:\n\n```\n<A HREF=\"goldengate.html\" TARGET=\"\
    _top\">Back to the Golden Gate Bridge page</A>\n```\n\n**Tip:** The **TARGET=\"\
    _top\"** attribute enables linking to a page outside of the current frame...\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_99_0.png)\n\n...which avoids clicking\
    \ on the link and having the page come up in the same frame:\n\n8. Make the link\
    \ arial, size -1, and bold.\n9. Save the page.\n\n10. Open framesetgg.html in\
    \ the browser. It should look like this:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_100_0.png)\n\
    \n11. Click on the **Back to the Golden Gate Bridge page** link. It should take\
    \ you back to the Golden Gate Bridge page.\n\n**Tip:** To make the frameset look\
    \ more crisp and clean, try using the following attributes in framesetgg.html:\n\
    \n```\n<HTML>\n\n<HEAD>\n</HEAD>\n\n<TITLE>Golden Gate Frameset</TITLE>\n\n<FRAMESET\
    \ ROWS=\"28, *\" FRAMEBORDER=\"0\">\n\n<FRAME NAME=\"topframe\" SRC=\"backtogg.html\"\
    \nMARGINWIDTH=\"12\" MARGINHEIGHT=\"4\"\nSCROLLING=\"NO\" NORESIZE>\n\n<FRAME\
    \ NAME=\"bottomframe\"\nSRC=\"http://www.goldengate.org\"\nMARGINWIDTH=\"12\"\
    \ MARGINHEIGHT=\"12\"\nSCROLLING=\"AUTO\" NORESIZE>\n\n</FRAMESET>\n\n</HTML>\n\
    ```\n\n## Practice: Layout & Navigation\n\nA. Why is it important that navigational\
    \ links stay in the same place and order on pages throughout a Web site?\n\nB.\
    \ What is the minimum number of files that must be used to make a frameset work?\n\
    \n**Task:** Make your Travel West Web site look and function like the one at **www.visibooks.com/travelwest3**.\n\
    \n1. Layout out the Rockies page using tables so it looks like the California\
    \ page.\n\n*Heading for the Rockies page:*\n**Nature in the Rocky Mountains**\n\
    \n2. Create pages for three subsections of The Rockies main section:\n\n- Streams\n\
    - Snow\n- Rock Formations\n\n3. Make sure that these pages are linked and laid\
    \ out just like the Golden Gate Bridge, Highway 101 and Big Sur pages.\n\n| Page\
    \ | File name | Heading |\n| --- | --- | --- |\n| Streams | streams.html | Mountain\
    \ Streams |\n| Snow | snow.html | Snow in the Rockies |\n| Rock Formations | rocks.html\
    \ | Rock Formations |\n\n4. Repeat this process with the Midwest section of the\
    \ site. The subsections of the Midwest section are:\n\n- St. Louis\n- Chicago\n\
    - DeMoines\n\n| Page | File name | Heading |\n|---|---|---|\n| Midwest | midwest.html\
    \ | Cities of the Midwest |\n| St. Louis | stlouis.html | St. Louis |\n| Chicago\
    \ | chicago.html | Chicago |\n| DeMoines | demoines.html | DeMoines |\n\n5. On\
    \ the Chicago page, insert a one-row, one-cell, fixed-width table 200 pixels wide,\
    \ with cell padding of 4. Color it pale yellow (BGCOLOR=\"#ffffcc\").\n\n6. In\
    \ this table, put the sentence, “In the past, Chicago was home to Al Capone, Mayor\
    \ Daley, and the nation’s biggest stockyards.”\n\n7. On the St. Louis page, link\
    \ to the external Web site www.stlouis.com using frames.\n\n*Paragraph for St.\
    \ Louis page:*\nFind out what’s going on in St. Louis at www.stlouis.com.\n\n\
    8. When you’re done, open the Travel West site in the browser. It should look\
    \ and function like the one at www.visibooks.com/travelwest3.\n\n## Interactivity\n\
    \nIn this section, you’ll learn how to:\n\n- Insert META tags\n- Create forms\n\
    - Format text with style sheets\n- Employ templates\n- Upload sites to a Web server\n\
    \nYou’ll build a site that looks like this:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_104_0.png)\n\
    \n## Insert META tags\n\n> **META tags**\n\nMETA tags are HTML tags that can include\
    \ a description of the page, as well as “keywords that provide clues to its content.\
    \ META tags make a page easier to find and index by search engines.\n\nMETA tags\
    \ don’t show up on a Web page. Rather, they reside unseen in its HTML code.\n\n\
    1. In Notepad, open up the home page of the Travel West Web site.\n2. Beneath\
    \ the `<HEAD>` and signature (`<!--your name-->`) tags, insert the first `<META>`\
    \ tag for describing the site’s contents:\n\n```\n<HEAD>\n<!--Created by Your\
    \ Name-->\n<META NAME=\"description\" CONTENT=\"This is the Travel West Web site.\
    \ It contains information about vacationing in California, the Rockies and the\
    \ Midwest.\">\n</HEAD>\n```\n\n3. Beneath the “description” meta tag, insert a\
    \ new <META> tag for its search keywords:\n\n```\n<HEAD>\n<!--Created by Your\
    \ Name-->\n<META NAME=\"description\" CONTENT=\"This is the Travel West Web site.\
    \ It contains information about vacationing in California, the Rockies and the\
    \ Midwest.\">\n<META NAME=\"keywords\" CONTENT=\"traveling, travel, west, California,\
    \ rockies, midwest, golden gate bridge, highway 101, Big Sur, streams, snow, rock\
    \ formations, St. Louis, Chicago, De Moines\">\n</HEAD>\n```\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_106_0.png)\n\
    \n## Create forms\n\n1. Create a new page with file name infoform.html.\n2. Title\
    \ the page “Request for Information” and save it in the Travel West folder on\
    \ your hard drive.\n3. Below the <BODY> tag, type the sentence:\n   Fill out the\
    \ following form to get more information about traveling West:\n4. Below the sentence,\
    \ insert a <P> tag, then insert a <FORM> tag:\n   <BODY>\n   Fill out the following\
    \ form to get more information about traveling West:\n   <P>\n   <FORM>\n   </BODY>\n\
    5. Below the <FORM> tag, create a table with 4 rows and 2 cells in each row. Make\
    \ the width 50%, give it cellpadding of 4, and a border of 1."
  mdcn: "## 使用框架链接到外部网站\n\n## 如何使用框架\n\n“框架”是一种在计算机屏幕上同时显示多个网页的方式：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_96_0.png)\n\
    \n可以在 www.visibooks.com/frames 看到框架的实际示例。\n\n许多曾经使用框架的网站现在已经取消了它们，回到了单页布局。这是因为框架存在严重的缺点：\n\
    \n- 框架难以更新。每个屏幕都需要跟踪三个或更多页面：框架集本身，以及至少两个要放入框架的页面。\n- 框架导航很棘手。链接需要特殊的“目标”来从页面指向框架。\n\
    - 框架通常要求用户在多个地方进行恼人的滚动。\n\n然而，框架在一件事上很有用：它们允许用户在点击链接到其他网站时，只需单击一下即可返回到原始网站。可以在\
    \ www.charuhas.com/sites.html 的外部链接中看到一个例子。\n\n以下练习演示了如何使用框架为外部网站提供便捷链接。\n\n1.\
    \ 在金门大桥页面上，在第一个段落下方的新段落中，输入：\n\n访问金门大桥的网站 www.goldengate.org。\n\nwww.goldengate.org\
    \ 将链接到框架集页面。\n\n2. 创建一个新空白页，文件名为 framesetgg.html。这将是容纳另外两个页面的“框架集”页面。\n\n3. 将以下\
    \ HTML 代码插入新空白页：\n\n```\n<HTML>\n\n<HEAD></HEAD>\n\n<TITLE>Golden Gate Frameset</TITLE>\n\
    \n<FRAMESET ROWS=\"50, *\">\n\n<FRAME NAME=\"topframe\" SRC=\"backtogg.html\"\
    >\n\n<FRAME NAME=\"bottomframe\"\nSRC=\"http://www.goldengate.org\">\n\n</FRAMESET>\n\
    \n</HTML>\n```\n\n在 www.visibooks.com 免费下载其他 Visibooks\n\n**提示：** `<FRAMESET>`\
    \ 标签中的 `ROWS=\"50, *\"` 属性告诉框架集将顶部框架设置为 50 像素高，并允许底部框架填充其下方剩余的所有可用空间。\n\n顶部框架将包含返回金门大桥页面的链接。底部框架将包含一个外部网站：www.goldengate.org。\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_98_0.png)\n\n4. 保存 framesetgg.html。\n\
    5. 创建一个新页面，文件名为 backtogg.html。这是将包含返回金门大桥页面链接的页面。\n6. 为新页面设置浅灰色背景，并在上面放置一个链接：[返回金门大桥页面](#)。\n\
    7. 使用带有 `TARGET=\"_top\"` 属性的锚标签链接回金门大桥页面：\n\n```\n<A HREF=\"goldengate.html\"\
    \ TARGET=\"_top\">Back to the Golden Gate Bridge page</A>\n```\n\n**提示：** **TARGET=\"\
    _top\"** 属性允许链接到当前框架之外的页面...\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_99_0.png)\n\
    \n...这避免了点击链接后页面在同一个框架中打开的情况：\n\n8. 将链接设置为 Arial 字体，大小 -1，并加粗。\n9. 保存页面。\n\n10.\
    \ 在浏览器中打开 framesetgg.html。它应该看起来像这样：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_100_0.png)\n\
    \n11. 点击 **返回金门大桥页面** 链接。它应该带你返回金门大桥页面。\n\n**提示：** 要使框架集看起来更清晰整洁，请尝试在 framesetgg.html\
    \ 中使用以下属性：\n\n```\n<HTML>\n\n<HEAD>\n</HEAD>\n\n<TITLE>Golden Gate Frameset</TITLE>\n\
    \n<FRAMESET ROWS=\"28, *\" FRAMEBORDER=\"0\">\n\n<FRAME NAME=\"topframe\" SRC=\"\
    backtogg.html\"\nMARGINWIDTH=\"12\" MARGINHEIGHT=\"4\"\nSCROLLING=\"NO\" NORESIZE>\n\
    \n<FRAME NAME=\"bottomframe\"\nSRC=\"http://www.goldengate.org\"\nMARGINWIDTH=\"\
