    # Create link effects with style sheets


    # “Cascading” style sheets


    Style instructions can be contained within a Web page itself, without referring
    to a separate style sheet. These instructions will override those of the style
    sheet, hence the term “Cascading Style Sheets:”


    An instruction in a page’s text...


    ```

    <FONT

    COLOR="#ff0000">

    This is red

    text.</FONT>

    ```


    ...overrides a style instruction for the page...


    ```

    <STYLE

    TYPE="text/css">

    .greentext { color:

    "#00ff00" }

    </STYLE>

    ```


    ```

    <BODY>

    <P

    CLASS="greentext">

    This is green text.

    ```


    ...which overrides a style instruction for the site.


    ```

    <LINK REL="stylesheet"

    HREF="format.css">

    ```


    ```

    </HEAD>

    ```


    ```

    <BODY>

    ```


    ```

    <P CLASS="bodytext">

    This is blue text.

    ```


    The following exercise employs an in-page style.'
