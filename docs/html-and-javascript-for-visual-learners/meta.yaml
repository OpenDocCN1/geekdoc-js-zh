- md: "## Create e-mail and external links\n\n### Create an e-mail link\n\n1. In a\
    \ new paragraph beneath the list, type the sentence “For more information, contact\
    \ info@visibooks.com.”\n2. Surround the e-mail address with anchor tags, but instead\
    \ of linking it to a Web page, use the mailto command to link it to an e-mail\
    \ program:\n\n```\nFor more information, contact\n<A HREF=\"mailto:info@visibooks.com\"\
    >info@visibooks.com</A>\n```\n\n3. Save the page. When you view it in the browser,\
    \ it should look like this:\n\n> ### How e-mail links work\n\nWhen someone goes\
    \ to a Web site and clicks on an e-mail link, it’s supposed to open the e-mail\
    \ program on that person’s computer and insert the address into a new message.\n\
    \nIf the person’s e-mail program isn’t configured correctly, this won’t work.\
    \ That’s why e-mail links should use the e-mail address as a link: so people can\
    \ enter the address manually if they have to.\n\n### Link to an external site\n\
    \n1. In Notepad, add a new sentence after the last one. Type the sentence, “Please\
    \ also visit www.dogs.com.”\n2. Surround the Web address www.dogs.com with these\
    \ anchor tags to link it to the external Web site:\n3. Save the page.\n4. Preview\
    \ the page in the browser, then click on the link to see if it links to the external\
    \ site www.dogs.com.\n5. Close the browser.\n\n```\n<A HREF=\"http://www.dogs.com\"\
    >www.dogs.com</A>\n```\n\n> Tip: For an external link to work, you must type http://\
    \ as part of the Web address.\n\n## Insert and align graphics\n\n### Capture a\
    \ graphic from the Web\n\n1. Open a new browser window.\n2. Go to the Web site\
    \ www.visibooks.com/dogpics.\n3. Place your cursor on top of the picture of the\
    \ Chesapeake Bay Retriever, then click with your right mouse button.\n4. Click\
    \ Save Picture As.\n5. When the Save Picture window appears, select the “Dogs”\
    \ folder in the Save in drop-down list.\n6. Create a new folder within Dogs called\
    \ “graphics.”\n7. Double-click on the graphics folder so it appears in the Save\
    \ in drop-down list.\n8. Click the Save button to save the graphic inside the\
    \ graphics folder.\n\n> **Tip:** Creating this separate sub-folder to hold your\
    \ site’s graphics makes the site easier to organize and update.\n\n### Insert\
    \ a graphic\n\n1. In Notepad, open the Chesapeake Bay Retriever page, file name\
    \ chesapeake.html.\n2. Create a new paragraph under the main heading.\n3. In the\
    \ new paragraph, insert an image tag:\n\n```\n<IMG SRC=\"graphics/chessie.gif\"\
    >\n```\n\n> **Tip:** Notice that in this image tag there’s a “path.” For the image\
    \ source, the tag first points to the graphics folder, then to the file name of\
    \ the image within it.\n\n4. Save the page, then view it in the browser. It should\
    \ now look like this:\n\n### Align a graphic\n\n1. In a new paragraph below the\
    \ graphic, type in:\n\nChesapeake Bay Retrievers love water. If you throw tennis\
    \ balls in the water, these dogs will chase them and bring them back until your\
    \ arm falls off.\n\n2. Save the page and view it in the browser. The page should\
    \ look like this:\n3. Go back to Notepad and add the **ALIGN=\"left\"** attribute\
    \ to the `<IMG>` tag:\n\n```\n<IMG SRC=\"graphics/chessie.gif\"\nALIGN=\"left\"\
    >\n```\n\n4. Save the page and view it in the browser (just click the “Refresh”\
    \ or “Reload” button). It should look like this:\n\n### Format a graphic\n\n1.\
    \ In the Chesapeake Bay Retriever page, add this **ALT** attribute to the **<IMG>**\
    \ tag:\n\n```\n<IMG SRC=\"graphics/chessie.gif\" ALIGN=\"left\"\nALT=\"Chesapeake\
    \ Bay Retriever\">\n```\n\n> “Alt” text allows visually-impaired people to know\
    \ what a graphic represents. Alt text also allows search engines to index visual\
    \ content.\n\n2. Add the **VSPACE=\"4\"** and **HSPACE=\"12\"** attributes as\
    \ well:\n\n```\n<IMG SRC=\"graphics/chessie.gif\" ALIGN=\"left\"\nALT=\"Chesapeake\
    \ Bay Retriever\" VSPACE=\"4\"\nHSPACE=\"12\">\n```\n\n3. Also, add the **BORDER=\"\
    1\"** attribute:\n\n```\n<IMG SRC=\"graphics/chessie.gif\" ALIGN=\"left\"\nALT=\"\
    Chesapeake Bay Retriever\" VSPACE=\"4\"\nHSPACE=\"12\" BORDER=\"1\">\n```\n\n\
    4. Save the page and view it in the browser. It should now look like this:\n\n\
    An HSPACE of 12 creates a horizontal space of 12 pixels around the graphic that\
    \ nothing can occupy.\n\nA Border of 1 creates a 1-pixel border around the graphic.\n\
    \n5. Move your cursor onto the graphic. The “Alt” text—an alternative text description\
    \ of the graphic—should pop up.\n\nThe text should be aligned with the top of\
    \ the graphic.\n\n**Tip:** *If you know the dimensions of a graphic, you can make\
    \ it load faster by specifying its width and height in pixels:*\n\n```\n<IMG SRC=\"\
    graphics/chessie.gif\" ALIGN=\"left\" ALT=\"Chesapeake Bay Retriever\" VSPACE=\"\
    4\" HSPACE=\"12\" BORDER=\"1\" WIDTH=\"150\" HEIGHT=\"189\">\n```\n\n### Practice:\
    \ Insert graphics\n\nA. Why should you specify Alt text for each graphic you insert?\n\
    \n1. Go to **www.visibooks.com/dogpics**. Save the German Shepherds graphic in\
    \ C:\\dogs\\graphics with the file name shepherds.gif.\n2. Save the Yorkshire\
    \ Terrier graphic in C:\\dogs\\graphics with the file name yorkie.gif.\n3. Insert\
    \ shepherds.gif into the German Shepherds page in a new paragraph below the heading.\n\
    4. Insert yorkie.gif into the Yorkshire Terriers page in a new paragraph below\
    \ the heading.\n5. On the German Shepherds page, type “German Shepherds are smart\
    \ dogs” in a paragraph below the graphic.\n6. On the Yorkshire Terriers page,\
    \ type “Yorkshire Terriers are cute” in a paragraph below the graphic.\n7. On\
    \ both pages, align the text to the side of the graphic, as on the Chesapeake\
    \ Bay Retrievers page.\n8. On both pages, give the graphic a border of 1, vspace\
    \ of 4, and hspace of 12.\n9. On all three “Dog” pages, put all paragraph text\
    \ (not the main headings) in the arial font, with a size of -1.\n\nAnswers\n\n\
    A. Alt text makes it easier for vision-impaired people to understand a page's\
    \ content, and makes it easier for search engines to catalog it.\n\n## Create\
    \ a basic navigation system\n\n### Link back to the home page\n\n1. In Notepad,\
    \ open the Chesapeake Bay Retrievers page, chesapeake.html.\n2. Type the word\
    \ “Home” in a new paragraph beneath the first paragraph.\n3. Enclose it in anchor\
    \ tags that link it back to the home page:\n   `<A HREF=\"index.html\">Home</A>`\n\
    \   **Tip:** Remember, index.html is the file name for the home page.\n4. Save\
    \ the page, and view it in the browser. The word Home should now be a link, and\
    \ the page should look like this:\n\n```\n<A HREF=\"index.html\">Home</A>\n```\n\
    \n5. On the German Shepherds page, create a link back to the home page. Do this\
    \ the same way you created the link for the Chesapeake Bay retriever page.\n6.\
    \ On the Yorkshire Terriers page, create the same sort of link back to the home\
    \ page.\n\n### Link pages to each other\n\n1. In Notepad, open the Chesapeake\
    \ Bay Retrievers page.\n2. Following the Home link, type:\n   | Chesapeake Bay\
    \ Retrievers | German Shepherds | Yorkshire Terriers\n3. Make the words “Chesapeake\
    \ Bay Retrievers” bold to show site users “You are here.”\n4. Link the words “German\
    \ Shepherds” to the German Shepherds page:\n   `<A HREF=\"german.html\">German\
    \ Shepherds</A>`\n5. Link the words “Yorkshire Terriers” to the Yorkshire Terriers\
    \ page."
  mdcn: "## 创建电子邮件和外部链接\n\n### 创建电子邮件链接\n\n1.  在列表下方的新段落中，输入句子“如需更多信息，请联系 info@visibooks.com。”\n\
    2.  用锚点标签将电子邮件地址括起来，但不要将其链接到网页，而是使用 mailto 命令将其链接到电子邮件程序：\n\n```\nFor more information,\
    \ contact\n<A HREF=\"mailto:info@visibooks.com\">info@visibooks.com</A>\n```\n\
    \n3.  保存页面。在浏览器中查看时，它应该如下所示：\n\n> ### 电子邮件链接的工作原理\n\n当有人访问网站并点击电子邮件链接时，它应该会打开该人计算机上的电子邮件程序，并将地址插入到新邮件中。\n\
    \n如果该人的电子邮件程序配置不正确，此功能将无法工作。这就是为什么电子邮件链接应使用电子邮件地址作为链接的原因：以便人们在必要时可以手动输入地址。\n\n\
    ### 链接到外部网站\n\n1.  在记事本中，在最后一句之后添加一个新句子。输入句子“也请访问 www.dogs.com。”\n2.  用这些锚点标签将网址\
    \ www.dogs.com 括起来，以将其链接到外部网站：\n3.  保存页面。\n4.  在浏览器中预览页面，然后单击链接以查看它是否链接到外部网站 www.dogs.com。\n\
    5.  关闭浏览器。\n\n```\n<A HREF=\"http://www.dogs.com\">www.dogs.com</A>\n```\n\n>\
    \ 提示：要使外部链接正常工作，您必须将 http:// 作为网址的一部分输入。\n\n## 插入和对齐图形\n\n### 从网络捕获图形\n\n1.  打开一个新的浏览器窗口。\n\
    2.  访问网站 www.visibooks.com/dogpics。\n3.  将光标放在切萨皮克湾寻回犬的图片上，然后单击鼠标右键。\n4.  单击“图片另存为”。\n\
    5.  当“保存图片”窗口出现时，在“保存在”下拉列表中选择“Dogs”文件夹。\n6.  在 Dogs 内创建一个名为“graphics”的新文件夹。\n\
    7.  双击 graphics 文件夹，使其出现在“保存在”下拉列表中。\n8.  单击“保存”按钮，将图形保存在 graphics 文件夹内。\n\n>\
    \ **提示：** 创建这个单独的子文件夹来存放您网站的图形，可以使网站更易于组织和更新。\n\n### 插入图形\n\n1.  在记事本中，打开切萨皮克湾寻回犬页面，文件名\
    \ chesapeake.html。\n2.  在主标题下创建一个新段落。\n3.  在新段落中，插入图像标签：\n\n```\n<IMG SRC=\"graphics/chessie.gif\"\
    >\n```\n\n> **提示：** 注意，在这个图像标签中有一个“路径”。对于图像源，该标签首先指向 graphics 文件夹，然后指向其中的图像文件名。\n\
    \n4.  保存页面，然后在浏览器中查看。它现在应该如下所示：\n\n### 对齐图形\n\n1.  在图形下方的新段落中，输入：\n\n切萨皮克湾寻回犬喜欢水。如果你把网球扔进水里，这些狗会追逐它们并把它们捡回来，直到你的手臂累得抬不起来。\n\
    \n2.  保存页面并在浏览器中查看。页面应如下所示：\n3.  返回记事本，并在 `<IMG>` 标签中添加 **ALIGN=\"left\"** 属性：\n\
    \n```\n<IMG SRC=\"graphics/chessie.gif\"\nALIGN=\"left\">\n```\n\n4.  保存页面并在浏览器中查看（只需单击“刷新”或“重新加载”按钮）。它应该如下所示：\n\
    \n### 格式化图形\n\n1.  在切萨皮克湾寻回犬页面中，向 **<IMG>** 标签添加此 **ALT** 属性：\n\n```\n<IMG SRC=\"\
    graphics/chessie.gif\" ALIGN=\"left\"\nALT=\"Chesapeake Bay Retriever\">\n```\n\
    \n> “Alt”文本允许视力障碍者了解图形代表的内容。Alt 文本还允许搜索引擎对视觉内容进行索引。\n\n2.  同时添加 **VSPACE=\"4\"\
    ** 和 **HSPACE=\"12\"** 属性：\n\n```\n<IMG SRC=\"graphics/chessie.gif\" ALIGN=\"\
    left\"\nALT=\"Chesapeake Bay Retriever\" VSPACE=\"4\"\nHSPACE=\"12\">\n```\n\n\
    3.  此外，添加 **BORDER=\"1\"** 属性：\n\n```\n<IMG SRC=\"graphics/chessie.gif\" ALIGN=\"\
    left\"\nALT=\"Chesapeake Bay Retriever\" VSPACE=\"4\"\nHSPACE=\"12\" BORDER=\"\
    1\">\n```\n\n4.  保存页面并在浏览器中查看。它现在应该如下所示：\n\nHSPACE 为 12 会在图形周围创建 12 像素的水平空间，任何内容都无法占据。\n\
    \nBorder 为 1 会在图形周围创建 1 像素的边框。\n\n5.  将光标移到图形上。“Alt”文本——图形的替代文本描述——应该会弹出。\n\n\
    文本应与图形顶部对齐。\n\n**提示：** *如果您知道图形的尺寸，可以通过指定其宽度和高度（以像素为单位）使其加载更快：*\n\n```\n<IMG SRC=\"\
    graphics/chessie.gif\" ALIGN=\"left\" ALT=\"Chesapeake Bay Retriever\" VSPACE=\"\
    4\" HSPACE=\"12\" BORDER=\"1\" WIDTH=\"150\" HEIGHT=\"189\">\n```\n\n### 练习：插入图形\n\
    \nA. 为什么应该为插入的每个图形指定 Alt 文本？\n\n1.  访问 **www.visibooks.com/dogpics**。将德国牧羊犬图形保存在\
    \ C:\\dogs\\graphics 中，文件名为 shepherds.gif。\n2.  将约克夏梗犬图形保存在 C:\\dogs\\graphics\
    \ 中，文件名为 yorkie.gif。\n3.  在德国牧羊犬页面标题下方的新段落中插入 shepherds.gif。\n4.  在约克夏梗犬页面标题下方的新段落中插入\
    \ yorkie.gif。\n5.  在德国牧羊犬页面上，在图形下方的段落中输入“德国牧羊犬是聪明的狗”。\n6.  在约克夏梗犬页面上，在图形下方的段落中输入“约克夏梗犬很可爱”。\n\
    7.  在两个页面上，将文本与图形的一侧对齐，就像在切萨皮克湾寻回犬页面上一样。\n8.  在两个页面上，为图形设置边框为 1，垂直间距为 4，水平间距为\
    \ 12。\n9.  在所有三个“狗”页面上，将所有段落文本（非主标题）设置为 Arial 字体，大小为 -1。\n\n答案\n\nA. Alt 文本使视力障碍者更容易理解页面内容，并使搜索引擎更容易对其进行编目。\n\
    \n## 创建基本导航系统\n\n### 链接回主页\n\n1.  在记事本中，打开切萨皮克湾寻回犬页面 chesapeake.html。\n2.  在第一个段落下方的新段落中输入单词“主页”。\n\
    3.  用锚点标签将其括起来，链接回主页：\n   `<A HREF=\"index.html\">Home</A>`\n   **提示：** 请记住，index.html\
    \ 是主页的文件名。\n4.  保存页面，并在浏览器中查看。单词“主页”现在应该是一个链接，页面应如下所示：\n\n```\n<A HREF=\"index.html\"\
    >Home</A>\n```\n\n5.  在德国牧羊犬页面上，创建一个链接回主页。操作方法与为切萨皮克湾寻回犬页面创建链接相同。\n6.  在约克夏梗犬页面上，创建相同类型的链接回主页。\n\
    \n### 页面相互链接\n\n1.  在记事本中，打开切萨皮克湾寻回犬页面。\n2.  在“主页”链接之后，输入：\n   | 切萨皮克湾寻回犬 | 德国牧羊犬\
    \ | 约克夏梗犬\n3.  将“切萨皮克湾寻回犬”一词加粗，以向网站用户显示“您在此处”。\n4.  将“德国牧羊犬”一词链接到德国牧羊犬页面：\n  \
    \ `<A HREF=\"german.html\">German Shepherds</A>`\n5.  将“约克夏梗犬”一词链接到约克夏梗犬页面。"
