  - '[PAGE 6]


    # # Introduction


    Welcome to *HTML and JavaScript for Visual Learners*. If you’ve never used a Visibook
    before, you’ll find that it contains several hundred illustrations, with comparatively
    little text. It presents essential tasks, breaks them down into steps, then walks
    you through them with illustrations.


    # ## What you’ll learn


    You’ll learn how to use HTML to create a solid, attractive Web site that’s easy
    to navigate. You’ll also learn how to upload it to a Web server.


    You won’t become an expert in Web publishing—that takes practice and real-world
    experience. But you will learn the fundamentals of site-building, and get a good
    foundation on which to build professional-level skills.


    Additional resources for acquiring expert-level HTML and JavaScript skills are
    found at the end of this book.


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_6_0.png)


    # ## How you’ll learn it


    This book has five sections: HTML Basics, Layout & Navigation, Interactivity,
    Advanced Layout, and Practical JavaScript.


    At the end of each task and section are practice exercises. Don’t worry if you
    can’t work through the whole book in a day or two. Take your time, and try to
    do the practice. You can check your work against examples posted on the Web.


    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_6_1.png)'
- md: "## Before you begin\n\nBefore you begin, it’s important that you know Windows\
    \ well. A working knowledge of Windows makes it much easier to learn HTML and\
    \ JavaScript. You should be familiar with:\n\n- How directories work\n- Windows\
    \ Explorer\n- Basic word processing\n\nMake sure you can perform the following\
    \ tasks:\n\n- Create a folder on your computer’s hard drive\n- Create a folder\
    \ within a folder\n- Copy a paragraph from one document and paste it into another.\n\
    \nIf you have trouble doing this, set aside a couple of hours to learn Windows\
    \ basics. Have a friend or co-worker who is proficient with computers walk you\
    \ through Windows Explorer, creating folders and becoming familiar with file extensions.\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_7_0.png)\n\nYou should also practice\
    \ using the Cut, Copy, and Paste commands in a standard word processing program.\
    \ When you can do these things on your own, you’re ready to learn HTML and JavaScript.\n\
    \n## HTML Basics\n\nIn this section, you’ll learn how to:\n\n- Create a home page\n\
    - Format text\n- Create links to new pages\n- Create e-mail and external links\n\
    - Insert graphics\n- Create a navigation system\n- Change page and link colors\n\
    \nYou’ll build a site that looks like this:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_8_0.png)\n\
    \n## Create a home page\n\n### Create the home page\n\n1. Open a browser, such\
    \ as Internet Explorer or Netscape Navigator.\n\n2. Open the program Notepad.\
    \ Do this by first clicking the Start button on the taskbar, then Programs, then\
    \ Accessories, then Notepad.\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_9_0.png)\n\
    \n3. At the top of the Notepad screen, type:\n\n```\n<HTML>\n```\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_9_1.png)\n\
    \n**Tip:** `<HTML>` is a tag. Tags are instructions to a Web browser. This particular\
    \ instruction lets the Web browser know that what follows is a Web page, written\
    \ in HTML.\n\nTags can be written in upper-case or lower-case letters—it doesn’t\
    \ matter which. `<HTML>`, `<html>`, or `<HtMl>` are all fine.\n\n4. Save the file.\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_10_0.png)\n\n5. When the Save As window\
    \ appears, select the C:\\ drive in the Save in drop-down list.\n\n6. Create a\
    \ new folder by clicking on the ![Create New Folder Icon](icon.png) icon.\n\n\
    ![](img/e7a3640eba3fdf9a8dc6db6c967d2337_10_1.png)\n\n7. Name the new folder “Dogs,”\
    \ then double-click it so it appears in the Save in box.\n\n8. In the File name\
    \ textbox, type index.html.\n\n9. In the Save as type drop-down list, select All\
    \ Files. When you’re done, the window should look like this:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_11_0.png)\n\
    \n10. Save the page by clicking on the Save button.\n\n> **Home page file names**\n\
    \nAll Web pages have a .html extension (or .htm).\n\nAll home pages have the file\
    \ name index.html. index.html comes up automatically when the address of a domain\
    \ or directory where it’s located is typed into a browser.\n\nFor instance, if\
    \ you go to www.visibooks.com, the home page appears automatically. That’s because\
    \ its file name is index.html. If the file name of the Visibooks home page was\
    \ homepage.html, you’d have to type www.visibooks.com/homepage.html to get it\
    \ to appear.\n\n*The Microsoft exception:* To get your home page to come up automatically\
    \ on a Web server running Microsoft’s Internet Information Server as it’s operating\
    \ system, give your home page the file name default.htm.\n\n11. Below the `<HTML>`\
    \ tag, type:\n\n```\n<HEAD>\n<!--Created by Your Name-->\n</HEAD>\n```\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_12_0.png)\n\
    \n**Tip:** The `<HEAD>` section contains information that doesn’t show up on the\
    \ page when it is viewed in a browser. Note the closing `</HEAD>` tag: in HTML,\
    \ you must give the browser instructions to end something as well as start it.\n\
    \nTip: `<!--Created by Your Name-->` is called a comment. Whatever text is between\
    \ the dashes won’t show up on a browser’s screen—it’s only visible if someone\
    \ views the page’s HTML code. You need to include the ! for this to work.\n\n\
    12. Below the `</HEAD>` tag, title the page “A Home Page About Dogs” by using\
    \ `<TITLE>` tags:\n\n```\n<TITLE>\nA Home Page About Dogs\n</TITLE>\n```\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_13_0.png)\n\
    \nTip: Note that the text “A Home Page About Dogs” is not a tag. It is text surrounded\
    \ by tags. The `<TITLE>` tags tell the browser what to do with the text: make\
    \ it the title of the page.\n\n### Page titles\n\nThe title of a Web page describes\
    \ the page. It’s what appears in a browser’s History list. The title also shows\
    \ up as a link when a page comes up in a search engine. If all your pages have\
    \ discrete, descriptive titles, they’ll be easier for people to find.\n\nThe page\
    \ title shows up in the top, or “title,” bar of the browser used to view it. The\
    \ title of this page is Dogs.\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_14_0.png)\n\
    \n13. Below the `</TITLE>` tag, add:\n\n```\n<BODY>\n\n</BODY>\n```\n\n> **Tip:**\
    \ *Anything you want to be visible in a browser’s main window, put between the\
    \ `<BODY>` and `</BODY>` tags.*\n\n14. Below the `</BODY>` tag, close the `</HTML>`\
    \ tag. When you’re finished, the code should look like this:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_15_0.png)\n\
    \n15. Between the `<BODY>` and `</BODY>` tags, type the words:\n\nDogs Home Page\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_15_1.png)\n\n16. Save the page.\n\n\
    ### View the page in a browser\n\n1. Go to the browser and on its menu bar, click\
    \ File, then Open.\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_16_0.png)\n\n>\
    \ **Tip:** If you're using Netscape Communicator instead of Internet Explorer,\
    \ click Open Page, *then* Choose File.\n\n2. When the Open window appears, click\
    \ the Browse button.\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_16_1.png)\n\n\
    3. When the new window appears, navigate to the Dogs folder in the Look in drop-down\
    \ list, then select the home page: index.html.\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_17_0.png)\n\
    \n4. Click the Open button, then the OK button. The page should come up in the\
    \ browser and look like this:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_17_1.png)\n\
    \nYou have created a home page titled “A Home Page About Dogs.”\n\nThe home page’s\
    \ file name is index.html.\n\nIt is located in a folder called Dogs on the C:\\\
    \ drive.\n\n### Practice: Create a home page\n\nA. What is the correct file name\
    \ for a home page?\n\nB. Why is there a special file name for home pages?\n\n\
    C. Why is it important that the home page—and all other pages in a Web site—have\
    \ accurate titles?\n\nD. What is the difference between a page’s title and its\
    \ file name?\n\nAnswers\n\nA. index.html\n\nB. It allows home pages to appear\
    \ in a browser without typing the file name as part of a Web address.\n\nC. Accurate\
    \ titles allow people to find pages easier when bookmarking them or searching\
    \ in a browser’s History list.\n\nD. A page title appears in the Title bar at\
    \ the top of the browser. It’s plain text, such as “The Smith Family: Vacation\
    \ Pictures,” that makes it easy for people to keep track of a page. A page’s file\
    \ name, such as vacpics.html, is how the computer keeps track of it.\n\n## Format\
    \ pages and text\n\n### Change fonts\n\n1. In front of the words “Dogs Home Page,”\
    \ insert a `<FONT>` tag with the attribute FACE=\"arial\":\n\n   `<FONT FACE=\"\
    arial\">Dogs Home Page</FONT>`\n\n2. After the words, close the `<FONT>` tag:\n\
    \n   `<FONT FACE=\"arial\">Dogs Home Page</FONT>`\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_19_0.png)\n\
    \n> **Tip:** Think of an attribute as a sub-instruction to the browser. In this\
    \ case, the `<FONT>` tag tells the browser that text will be changed, and the\
    \ FACE attribute tells it how to change, specifying the Arial typeface.\n\n3.\
    \ View the page in the browser. Click the browser’s Refresh button, and the page\
    \ should look like this:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_20_0.png)\n\
    \n### Web fonts\n\nWhen text is viewed on a computer, only fonts installed on\
    \ the computer can be seen. For instance, if someone created a page that specified\
    \ the Tekton font, almost no one viewing it would see it in Tekton because very\
    \ few computers have that font installed. Computers without Tekton would display\
    \ text in the default font: Times New Roman.\n\nAll Windows computers have the\
    \ Arial font installed. Windows 95 and later computers have Verdana. Macintoshes\
    \ have Helvetica, the font that Arial is based upon.\n\nTo cover all bases, specify\
    \ multiple fonts:\n\n`<FONT FACE=\"verdana,arial,helvetica\">`\n\n**Tip:** If\
    \ a page doesn’t look like it’s supposed to—or nothing shows up at all—check the\
    \ HTML code you’ve written. You might have left out a quote or made some other\
    \ small mistake. Something that seems insignificant can wreck a page:\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_20_1.png)"
  mdcn: "## 开始之前\n\n在开始之前，你必须对 Windows 有充分的了解。掌握 Windows 的基本操作能让你更轻松地学习 HTML 和 JavaScript。你应该熟悉以下内容：\n\
    \n-   目录的工作原理\n-   Windows 资源管理器\n-   基本的文字处理\n\n确保你能完成以下任务：\n\n-   在电脑硬盘上创建一个文件夹\n\
    -   在文件夹内再创建一个文件夹\n-   从一个文档中复制一段文字并粘贴到另一个文档中。\n\n如果你在操作这些任务时遇到困难，请花几个小时学习 Windows\
    \ 基础知识。找一位精通电脑的朋友或同事，让他带你熟悉 Windows 资源管理器、创建文件夹以及了解文件扩展名。\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_7_0.png)\n\
    \n你还应该在标准的文字处理程序中练习使用“剪切”、“复制”和“粘贴”命令。当你能够独立完成这些操作时，你就准备好学习 HTML 和 JavaScript\
    \ 了。\n\n## HTML 基础\n\n在本节中，你将学习如何：\n\n-   创建主页\n-   格式化文本\n-   创建指向新页面的链接\n- \
    \  创建电子邮件和外部链接\n-   插入图形\n-   创建导航系统\n-   更改页面和链接颜色\n\n你将构建一个看起来像这样的网站：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_8_0.png)\n\
    \n## 创建主页\n\n### 创建主页\n\n1.  打开一个浏览器，例如 Internet Explorer 或 Netscape Navigator。\n\
    \n2.  打开“记事本”程序。操作方法是：首先单击任务栏上的“开始”按钮，然后依次单击“程序”、“附件”，最后单击“记事本”。\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_9_0.png)\n\
    \n3.  在记事本屏幕的顶部，输入：\n\n```\n<HTML>\n```\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_9_1.png)\n\
    \n**提示：** `<HTML>` 是一个标签。标签是给 Web 浏览器的指令。这个特定的指令让 Web 浏览器知道，接下来的内容是一个用 HTML 编写的网页。\n\
    \n标签可以用大写字母或小写字母书写——使用哪种都可以。`<HTML>`、`<html>` 或 `<HtMl>` 都是有效的。\n\n4.  保存文件。\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_10_0.png)\n\n5.  当“另存为”窗口出现时，在“保存在”下拉列表中选择\
    \ C:\\ 驱动器。\n\n6.  单击 ![创建新文件夹图标](icon.png) 图标来创建一个新文件夹。\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_10_1.png)\n\
    \n7.  将新文件夹命名为“Dogs”，然后双击它，使其出现在“保存在”框中。\n\n8.  在“文件名”文本框中，输入 index.html。\n\n\
    9.  在“保存类型”下拉列表中，选择“所有文件”。完成后，窗口应如下所示：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_11_0.png)\n\
    \n10. 单击“保存”按钮来保存页面。\n\n> **主页文件名**\n\n所有网页都有 .html 扩展名（或 .htm）。\n\n所有主页的文件名都是\
    \ index.html。当在浏览器中输入其所在的域名或目录地址时，index.html 会自动显示。\n\n例如，如果你访问 www.visibooks.com，主页会自动出现。这是因为它的文件名是\
    \ index.html。如果 Visibooks 主页的文件名是 homepage.html，你就必须输入 www.visibooks.com/homepage.html\
    \ 才能使其显示。\n\n*微软的例外情况：* 要让你的主页在运行微软 Internet Information Server 作为操作系统的 Web 服务器上自动显示，请将你的主页文件名设为\
    \ default.htm。\n\n11. 在 `<HTML>` 标签下方，输入：\n\n```\n<HEAD>\n<!--Created by Your\
    \ Name-->\n</HEAD>\n```\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_12_0.png)\n\
    \n**提示：** `<HEAD>` 部分包含的信息在浏览器中查看页面时不会显示出来。注意结束标签 `</HEAD>`：在 HTML 中，你必须告诉浏览器何时开始以及何时结束某项内容。\n\
    \n提示：`<!--Created by Your Name-->` 被称为注释。破折号之间的任何文本都不会显示在浏览器的屏幕上——只有在查看页面的 HTML\
    \ 代码时才可见。你需要包含 ! 才能使此功能生效。\n\n12. 在 `</HEAD>` 标签下方，使用 `<TITLE>` 标签将页面标题设为“关于狗的主页”：\n\
    \n```\n<TITLE>\nA Home Page About Dogs\n</TITLE>\n```\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_13_0.png)\n\
    \n提示：请注意，文本“A Home Page About Dogs”不是一个标签。它是被标签包围的文本。`<TITLE>` 标签告诉浏览器如何处理该文本：将其作为页面的标题。\n\
    \n### 页面标题\n\n网页的标题描述了该页面。它会出现在浏览器的历史记录列表中。当页面在搜索引擎中出现时，标题也会显示为一个链接。如果你的所有页面都有独特且描述性的标题，人们会更容易找到它们。\n\
    \n页面标题会显示在用于查看它的浏览器的顶部或“标题”栏中。此页面的标题是 Dogs。\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_14_0.png)\n\
    \n13. 在 `</TITLE>` 标签下方，添加：\n\n```\n<BODY>\n\n</BODY>\n```\n\n> **提示：** *任何你希望在浏览器主窗口中显示的内容，都放在\
    \ `<BODY>` 和 `</BODY>` 标签之间。*\n\n14. 在 `</BODY>` 标签下方，关闭 `</HTML>` 标签。完成后，代码应如下所示：\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_15_0.png)\n\n15. 在 `<BODY>` 和 `</BODY>`\
    \ 标签之间，输入文字：\n\nDogs Home Page\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_15_1.png)\n\
    \n16. 保存页面。\n\n### 在浏览器中查看页面\n\n1.  转到浏览器，在其菜单栏上，单击“文件”，然后单击“打开”。\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_16_0.png)\n\
    \n> **提示：** 如果你使用的是 Netscape Communicator 而不是 Internet Explorer，请单击“打开页面”，*然后*单击“选择文件”。\n\
    \n2.  当“打开”窗口出现时，单击“浏览”按钮。\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_16_1.png)\n\
    \n3.  当新窗口出现时，在“查找范围”下拉列表中导航到 Dogs 文件夹，然后选择主页：index.html。\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_17_0.png)\n\
    \n4.  单击“打开”按钮，然后单击“确定”按钮。页面应在浏览器中显示，如下所示：\n\n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_17_1.png)\n\
    \n你已经创建了一个标题为“关于狗的主页”的主页。\n\n主页的文件名是 index.html。\n\n它位于 C:\\ 驱动器上一个名为 Dogs 的文件夹中。\n\
    \n### 练习：创建主页\n\nA. 主页的正确文件名是什么？\n\nB. 为什么主页有特殊的文件名？\n\nC. 为什么主页——以及网站中的所有其他页面——拥有准确的标题很重要？\n\
    \nD. 页面标题和文件名有什么区别？\n\n答案\n\nA. index.html\n\nB. 它允许主页在浏览器中显示时无需将文件名作为网址的一部分输入。\n\
    \nC. 准确的标题使人们在收藏页面或在浏览器的历史记录列表中搜索时更容易找到页面。\n\nD. 页面标题显示在浏览器顶部的标题栏中。它是纯文本，例如“史密斯一家：度假照片”，让人们可以轻松地跟踪页面。页面的文件名，例如\
    \ vacpics.html，是计算机跟踪它的方式。\n\n## 格式化页面和文本\n\n### 更改字体\n\n1.  在“Dogs Home Page”这几个字前面，插入一个带有属性\
    \ FACE=\"arial\" 的 `<FONT>` 标签：\n\n   `<FONT FACE=\"arial\">Dogs Home Page</FONT>`\n\
    \n2.  在这几个字后面，关闭 `<FONT>` 标签：\n\n   `<FONT FACE=\"arial\">Dogs Home Page</FONT>`\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_19_0.png)\n\n> **提示：** 可以将属性视为给浏览器的子指令。在这个例子中，`<FONT>`\
    \ 标签告诉浏览器文本将被更改，而 FACE 属性告诉它如何更改，指定了 Arial 字体。\n\n3.  在浏览器中查看页面。单击浏览器的“刷新”按钮，页面应如下所示：\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_20_0.png)\n\n### Web 字体\n\n在计算机上查看文本时，只能看到计算机上安装的字体。例如，如果有人创建了一个指定使用\
    \ Tekton 字体的页面，几乎没有人会看到它使用 Tekton 字体，因为很少有计算机安装了该字体。没有 Tekton 的计算机将使用默认字体显示文本：Times\
    \ New Roman。\n\n所有 Windows 计算机都安装了 Arial 字体。Windows 95 及更高版本的计算机有 Verdana。Macintosh\
    \ 有 Helvetica，Arial 字体就是基于它设计的。\n\n为了涵盖所有情况，请指定多种字体：\n\n`<FONT FACE=\"verdana,arial,helvetica\"\
    >`\n\n**提示：** 如果页面看起来不像预期的那样——或者根本没有显示任何内容——请检查你编写的 HTML 代码。你可能漏掉了一个引号或犯了其他小错误。看似微不足道的东西可能会毁掉一个页面：\n\
    \n![](img/e7a3640eba3fdf9a8dc6db6c967d2337_20_1.png)"
