    ![](img/img/739ece6d965a774f75c4a6632b8b7538_18_1.png)


    图2.7：打开窗口


    8.  使用**浏览...按钮**，从你之前保存的**文件夹**位置选择**helloworld.html**文件。我在此演示中使用了文件夹位置“C:\books\HTML”。如下图2.8所示。


