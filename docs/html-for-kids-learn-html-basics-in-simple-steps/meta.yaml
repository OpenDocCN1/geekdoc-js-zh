    以下是执行此练习的指南：


    - 打开记事本

    - 使用标题和段落标签创建HTML。每个标题标签后跟相应的段落标签。在相应的标签之间输入文本。

    - 使用.htm或.html扩展名保存HTML文件

    - 使用网页浏览器打开HTML文件以查看结果。


    如果需要任何帮助，请查看**练习1 – 贪婪的乌鸦**章节，找到上述网页的HTML。


    ## 总结


    恭喜，你刚刚学会了使用标题和段落标签。不仅如此，你还创建了一个网页来展示故事。你是否有了构建故事网站的想法？嗯，一旦你详细学习了HTML，实现那个梦想就为期不远了。在那之前，继续阅读...


    ## 第四章


    ## 第四章 – 文本格式化


    在上一章中，你学习了编写标题和段落。我希望你喜欢这个练习。我们将在本章继续学习更多文本内容，但主要关注文本格式化。


    什么是**格式化**？在阅读任何书籍、查看任何网站上的文本或阅读Microsoft Word中的文档时，你一定观察到文本的某些部分显示为粗体（**粗体**）或带下划线（<u>下划线</u>）或斜体（*斜体*），以显示文本的重要性。在网页中使任何文本变为粗体、下划线或斜体称为“格式化”。


    我们将学习格式化在HTML中是如何使用的。


    ## 文本格式化示例


    是时候看看格式化的示例了。请访问维基百科的以下页面 - [https://en.wikipedia.org/wiki/India](https://en.wikipedia.org/wiki/India)。在下面图4.1所示的这个小段落中，你可以看到格式化的示例：


    你会发现文本的某些部分或某些行被突出显示为粗体和斜体，以显示文本的重要性。显示文本的重要性是格式化的主要用途。


    ## 学习细节


    是时候学习格式化的细节了。但在我们开始之前，让我们看看一些常见的格式化示例以及它们在下面表格中的样子。


    表4.1：格式化样式


    | 格式化样式 | 它的样子？ |

    |---|---|

    | 粗体 | **这是粗体文本。** |

    | 斜体 | *这是斜体文本。* |

    | 下划线 | <u>这是下划线文本。</u> |

    | 小号 | <small>这是小号文本。</small> |

    | 下标 | 这是<sub>下标</sub>文本。 |

    | 上标 | 这是<sup>上标</sup>文本。 |


    HTML中还有更多格式化方法，但本书将学习这些常用方法。


    让我们从第一种方法开始，使文本**粗体**。要使文本粗体，你可以这样编写HTML：


    `<b> 你的文本在这里 </b>`


    这意味着，你将文本放在`<b>`和`</b>`标签之间使其变为粗体。`<b>`代表粗体。很简单，不是吗？


    那么，使文本变为斜体需要什么呢？看看这里：


    `<i> 你的文本在这里 </i>`


    多么相似又简单！这里`<i>`代表斜体。猜猜看，所有其他格式化在HTML中的工作方式也相同。查看下面的表格，了解其他文本格式化的工作方式：


    *表4.2：格式化标签*


    | 格式化 | HTML标签 |

    |---|---|

    | 下划线 | `<u> 你的文本在这里 </u>` |

    | 小号 | `<small> 你的文本在这里 </small>` |

    | 下标 | `<sub> 你的文本在这里 </sub>` |

    | 上标 | `<sup> 你的文本在这里 </sup>` |


    到目前为止很有趣！让我们迈出下一步。思考一下，要使段落看起来像图4.2所示，需要什么。


    Lorem ipsum dolor **sit amet**, consectetur adipiscing elit. Fusce varius, tortor
    et *pellentesque ultrices*, eros justo vehicula ligula, <u>non egestas massa</u>
    sapien vel mauris. Mauris eget ex rhoncus, <sub>fermentum</sub> risus eget, mattis
    magna. Vestibulum tincidunt venenatis justo, in <sup>fermentum mauris</sup> lobortis
    in.


    图4.2：段落中的混合格式化


    你可以看到不同方式的文本格式化与普通文本混合在一起。它是如何工作的？看看下面创建这种格式化的HTML标签。


    ```html

    <html>

    <head>

    <title></title>

    </head>

    <body>

    <p>

    Lorem ipsum dolor <b> sit amet </b> consectetur adipiscing elit. Fusce varius
    tortor et <i> pellentesque ultrices </i>, eros justo vehicula ligula, <u> non
    egestas massa </u> sapien vel mauris. Mauris eget ex rhoncus, <sub> fermentum
    </sub> risus eget, mattis magna. Vestibulum tincidunt venenatis justo, in <sup>
    fermentum mauris </sup> lobortis in.

    </p>

    </body>

    </html>

    ```


    格式化的文本在段落标签中与普通文本混合或放置在一起。使用起来如此简单。你可以随心所欲地玩转文本格式化。

