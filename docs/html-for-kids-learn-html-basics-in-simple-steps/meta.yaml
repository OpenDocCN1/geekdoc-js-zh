    \    <tr>\n        <td>Cell Text</td>\n        <td>Cell Text</td>\n    </tr>\n\
    </table>\n```\n\n如果你观察这个结构，你可以将我上一段中谈到的不同表格标签联系起来。**border** 属性以像素为单位显示表格线的宽度。如果你不提供\
