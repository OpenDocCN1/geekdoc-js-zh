    ## Try it yourself


    You now understand how to use heading and paragraph tags. I want to give you an
    exercise where you show a small story on a web page. You create a web page which
    shows the story in the format shown in figure 3.7.


    Following are the guidelines to perform this exercise:


    - Open Notepad

    - Create HTML using heading and paragraph tags. Each heading tag will be followed
    by corresponding paragraph tag. Type in the text between the respective tags.

    - Save the HTML file using .htm or .html extension

    - Open the HTML file using web browser to see the result.


    If you need any help, please check **Exercise1 – Greedy Crow** chapter to find
    HTML for the web page above.


