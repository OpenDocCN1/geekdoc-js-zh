    # Chapter 3 – Heading and Paragraphs


    We learnt about HTML fundamentals in the previous chapter. You now understand
    the structure of a tag in HTML web page. With this basic understanding, from now
    onward, we will learn about specific tags in terms of what they do on the page
    and how to use them.


