    你应该记住并练习这些在记事本中创建HTML然后在网页浏览器（Internet Explorer）中查看的步骤，因为我们在后续章节的每个练习中都会这样做。


    ## 理解HTML结构


    既然你已经写下了你的第一个HTML网页，让我们来理解它的含义。


    正如我之前提到的，*就像人体由细胞构成；HTML由标签构成*。你在上面HTML示例中看到的所有内容都是一个**标签**。例如<html>、<head>、<title>、<body>、</html>、</head>、</title>、</body>，所有这些都称为标签。就像苹果被称为苹果，你被称为你的名字一样，这些东西被称为**标签**。我得说，这名字起得不错。每个标签在HTML中或者说在网页上都有其用途。


    HTML是网页的语言；你在第一章中学到了这一点。类似于任何其他语言（如英语），HTML也有单词和语法。在这个类比中，标签就像单词。在英语中，你使用语法将单词组合在一起，写出有意义的句子。同样在HTML中，你使用HTML语法将标签组合在一起，写出作为网页有意义的内容。


    你将在接下来的章节中学习这些标签或单词。我们现在将在本章的剩余部分学习HTML的语法。每当我们提到任何特定的HTML语法规则时，我们将用**HTML语法**：提示来标记它。


    例如，这是我们的第一条规则。

