    **Lists** are used in HTML to create bullet points based text on web pages. The
    purpose is the same, make your writing emphatic, readable and presentable.


    Let''s learn about it.


    # Examples of Lists


    We will use Wikipedia again to see example of List. Please go to the following
    page in Wikipedia - [https://en.wikipedia.org/wiki/Main_Page](https://en.wikipedia.org/wiki/Main_Page)
    . You see lists as highlighted in marking in the figure 7.1 below.'
