    ## 整合所有内容


    是时候将所有内容整合起来了。但在开始之前，让我再次展示HTML表单的目标，以唤起大家的记忆：


    - ✓ **目标1：** 当你在**数字1**文本框中输入一个数字，在**数字2**文本框中输入另一个数字，然后点击**乘法**按钮时，它将在**结果**文本框中显示两个数字的**乘积**。

    - ✓ **目标2：** 当你点击**清除**按钮时，它将**清除**或说**移除**在**数字1**、**数字2**和**结果**文本框中输入的任何值。


    为了实现这些目标，我们将执行以下JavaScript编程：


    - ✓ 在**乘法按钮**上放置**onclick事件**。此事件将包含一条JavaScript编程语句，该语句将**number1**和**number2**文本框控件的值相乘，并**写入****result**文本框控件。这将满足目标1。

    - ✓ 为了满足目标2，我们将在**清除按钮**上放置**onclick**事件。该事件将包含三条由分号（;）分隔的JavaScript语句。第一条语句将**写入空值**（两个单引号连在一起“
    ”）到**number1**控件，第二条和第三条语句将分别写入空值到**number2**和**result**控件。目的是清除这些控件的值。在JavaScript中，两个单引号连在一起（‘
    ’）意味着清除控件值。


    我已使用上述JavaScript编程修改了之前的HTML，其外观如图12.7所示。


    ```html

    <html>

    <head>

    <title>Calculation on Form</title>

    </head>

    <body>

    <form>


    Number1:&nbsp;<input type="text" id="number1"></input>

    <br></br>

    Number2:&nbsp;<input type="text" id="number2"></input>

    <br></br>

    Result:&nbsp;<input type="text" id="result"></input>

    <br></br>

    <input type="button" value="Multiply" id="multiplybutton" onclick="document.getElementById(''result'').value=document.getElementById(''number1'').value
    * document.getElementById(''number2'').value" ></input>&nbsp;


    <input type="button" value="Clear" id="clearbutton" onclick="document.getElementById(''number1'').value='''';
    document.getElementById(''number2'').value=''''; document.getElementById(''result'').value=''''"></input>


    </form>

    </body>

    </html>

    ```


