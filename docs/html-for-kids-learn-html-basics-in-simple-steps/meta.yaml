    used to feed her grain. She liked the place and her life was fine.</p>


    <h2>Crow meet Pigeon</h2>


    <p>One day a <sup>crow</sup> saw the pigeon and saw how it was getting wonderful
    food from the kitchen. Then one day she made friendship with the pigeon, and under
