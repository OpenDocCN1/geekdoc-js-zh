- md: '## CHAPTER 11


    ## Textbox Control


    Let’s start with **textbox** type control. It is used to type single line of text
    or sentence. Following is the example of textbox type control tag:


    ```

    <input type="text" id="control name"></input>

    ```


    You can see it uses `<input>` tag and **type** attribute value is "**text**" to
    tell it is textbox type control. **Id** stands for **identifier** and this attribute
    is used to keep a name for the control. Just like, teacher takes your name among
    other students in the class to find you. The Id attribute value can be used to
    find the control uniquely among other controls. We will learn the use of Id attribute
    more in the next chapter.


    ## Checkbox and Radio Controls


    The next type of controls are **checkbox** and **radio**. They are used to select
    options from multiple choices given. The following are the tags of these controls:


    ```

    <input type="checkbox" id="control name" >Option1</input>

    <input type="radio" id="control name" >Option1</input>

    ```


    Both again use `<input>` tags but their type attribute values are **checkbox**
    and **radio**. **Option1** is the display text of the choice shown on the web
    page. Since, using these controls, you provide multiple choices on the web page,
    you generally add more than one checkbox or radio controls to show multiple choices.
    You will see an example of this very soon.


    ## Button Control


    Moving on, the following is the tag structure for **button** type control.


    ```

    <input type="button" value="Button" id="control name" ></input>

    ```


    The type attribute value is **button**. The text in the **value** attribute is
    the display text of the button shown on the web page.


    ## Textarea Control


    Let’s see controls which do not use `<input>` tag. We will start with the **textarea**
    control. Here is how the tag looks like:


    ```

    <textarea id="control name" rows="10" cols="30"></textarea>

    ```


    We use **`<textarea>`** tag for this control. Since the textarea can take multiple
    lines of text, you also have choice to set height and width of the control using
    **rows** and **cols** attributes. Rows attribute determines the height of the
    control. Cols stands for columns and it determines width of the control. They
    both take integer values.


    ## Select Control


    We will next talk about **select** control which allows to select one option from
    multiple available choices. Here is the tag structure of select control:


    ```

    <select id="control name">

    <option> option1</option>

    <option> option2</option>

    <option> option3</option>

    <option> option4</option>

    </select>

    ```


    The tag starts with **`<select>`** and ends with **`</select>`**. And between
    these two tags, you can place multiple **`<option></option>`** tags. Each **`<option>`**
    tag represents one choice which can be selected by people. Text between **`<option>`**
    and **`</option>`** tags presents text of the choice on the web page. You add
    two or more **`<option>`** tags between **`<select>`** tags depending on number
    of choices to be provided on web page.


    We now have discussed all important controls. I suggest that you read about each
    control one more time and then look back in the table 11.1 to see how the control
    tags are shown on the web page.


    ## Form


    We now understand all types of controls and their tags. Let’s place all these
    controls under **`<form>`** tag in HTML. After all, form is container for all
    the controls. Here is how the HTML with form and controls will look like as shown
    in the figure 11.3.


    ![](img/739ece6d965a774f75c4a6632b8b7538_84_0.png)


    You can see, I have placed all the controls one by one inside `<form>` tag. I
    have separated each control by a new line tag `<br>` so that each control come
    next to each other upside-down in vertical line. It makes form more readable.


    If you look carefully, I have added a new element “&nbsp;”. This element is used
    to place a space anywhere you want on the web page. I have added them between
    checkbox and radio controls to have some space between them. On web page, it will
    show one space between choices given.


    For each control, I have used heading tag `<h3>` to show the name of the control.


    Finally, I have given some ids (identifiers) to the controls such as **name1**,
    **name2** etc. We will talk more about this attribute in the next chapter.


    So, how does this HTML look like? It is shown in figure 11.4.


    ## Text Control


    ![](img/739ece6d965a774f75c4a6632b8b7538_85_0.png)


    ## Text Area Control


    ![](img/739ece6d965a774f75c4a6632b8b7538_85_1.png)


    ## Checkbox Control


    ☐ Option1 ☐ Option2


    ## Radio Control


    ○ Option1 ○ Option2


    ## Select Control


    ![](img/739ece6d965a774f75c4a6632b8b7538_85_2.png)


    ## Button Control


    ![](img/739ece6d965a774f75c4a6632b8b7538_85_3.png)


    Figure 11.4: Form HTML Display


    Easy, right? I suggest you look at each HTML controls one by one as shown in the
    figure 11.3 and check how it has been shown on the web page in the figure 11.4.
    You should be comfortable with each control tag before we start the exercise.


    Let''s do some exercise.


    ## Try it yourself


    We will try to create a **Flight Booking Form** which can be used to book flight
    tickets. The form will look like as shown in figure 11.5.


    ![](img/739ece6d965a774f75c4a6632b8b7538_86_0.png)


    *Figure 11.5: Flight Booking Form Exercise*


    The following table shows choices for each select type control.


    *Table 11.2: Choices for Select Type Controls*


    | Select Type Control | Choices |

    |---|---|

    | Adult | 1, 2, 3, 4, 5 |

    | Child | 0, 1, 2, 3, 4 |

    | Infant | 0, 1, 2 |

    | Class | First, Business, Economy |


    Following are the guidelines to perform this exercise:


    - Open Notepad

    - Create HTML using a single form and various types of controls. Refer the previous
    part of the chapter to learn how to use each type of control tag.

    - Save the HTML file using .htm or .html extension

    - Open the HTML file using web browser to see the result.


    If you need any help, please check **Exercise 9 – Flight Booking** chapter to
    find HTML for the web page above. Best of luck!


    ## Summary


    Congratulations, you just finished one of the important concept in HTML. There
    are so many business applications or programs on internet and most of them use
    form based web pages. In next chapter, we will learn how to use these control
    values to perform some business action and calculations. That will make forms
    more interesting. Till then, keep reading...


    ## CHAPTER 12


    ## Chapter 12 – Brushing with JavaScript


    We are very close to finish basic understanding of HTML. You did a great job in
    finishing all the previous chapters. In the earlier chapter, we learnt about forms
    and controls and we primarily focused on designing the form on the web page. In
    real world, forms are used to solve real life business problems such as managing
    student admission, manage your income tax or book hotel and flight for some nice
    vacation.


    In order to solve business problems, it needs something called **programming**.
    Through programming you tell your form to perform some business action like the
    examples stated above. Just as HTML is a language for creating web pages, **JavaScript**
    is a language for the programming.


    Programming is a big topic and will require a separate book for itself. Keeping
    such magnitude in mind, we have kept programming out of the objectives of this
    book. But we will do a minimal JavaScript programming in this chapter where we
