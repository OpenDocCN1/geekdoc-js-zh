    ## CHAPTER 5


    ## Chapter 5 – Hyperlinks


    Welcome back friends! In the previous chapters, you learnt about formatting the
    text. You must have realized how simple but powerful HTML is to create any kind
    of content such as story, news or any write up you want to share on web site.


    We will now learn one of the most important element in HTML, it is called **Hyperlink**.
    In first two chapters, you learnt that any web site is a collection of web pages.
    How do you move from one page to another in a web site? You generally move from
    one page to another page in web site using Hyperlinks. You click on a hyperlink
    on a web page and it takes you to another web page and so on. In HTML world we
    say, we **navigate** from one page to another using Hyperlink.


    In this chapter, we will learn how to use hyperlink. Trust me, it is very simple.


    ## Examples of Hyperlinks


    We will take an example which everyone have seen. I guess almost everyone!


    Go to web site - [https://www.google.co.uk/](https://www.google.co.uk/) . Please
    don’t tell me you have not used google earlier. On this google web site, the following
    diagram 5.1 shows some of the examples of hyperlinks:


    ![](img/739ece6d965a774f75c4a6632b8b7538_41_0.png)


    Figure 5.1: Hyperlink Example


    There are more hyperlinks on this web page, but I showed some of them to make
    it simple to understand. When you click on a hyperlink, it takes you or say rather
    navigates you to the web page shown in the diagram. You can see that using hyperlink,
    you are able to go to various web pages which are part of Google web site.


    In the example above, Advertising, Business, Terms, Gmail display are called “**Text**”
    to the hyperlinks. Text shows a display text for hyperlink on web page; something
    which people can read to know the purpose of hyperlink. The web page where hyperlink
    takes you when you click is called “**Address**”. I suggest you memorize and understand
    both of these terms as they are fundamental to hyperlinks.


    Time to learn how to use hyperlink.


    ## Learning the Details


    Let’s start with an example. Suppose, you want to create a hyperlink which should
    take you to [https://www.google.co.uk/](https://www.google.co.uk/) web page and
    should show text as “Google Search”. It means, the hyperlink should display text
    as “Google Search” on web page (like, Advertising, Business, Terms, Gmail in example
    above). The address is [https://www.google.co.uk/](https://www.google.co.uk/).


    How do you write such hyperlink, take a look:


    ```

    <html>

    <head>

    <title></title>

    </head>

    <body>

    <a href="https://www.google.co.uk"> Google Search </a>

    </body>

    </html>

    ```


    Hyperlinks are presented by HTML tag <a>. Between <a> and </a> tags, you write
    **Text** of the hyperlink. **Text** is the display text of the hyperlink. You
    provide **address** of hyperlink in the attribute “**href**”. The purpose of the
    **Address** is to tell the place where web page is located.


    This hyperlink will look like as shown in figure 5.2 in the HTML page:


    ![](img/739ece6d965a774f75c4a6632b8b7538_42_0.png)


    *Figure 5.2: Google Search Example*


    It is simple. Right?


    Let’s take another interesting example. What will happen if I enter “#” as address
    in hyperlink like following?


    ```

    <a href="#"> My Link </a>

    ```


    You try yourself. You will find that the hyperlink will not take you anywhere
    but keep you on the same page where hyperlink is present. Funny, isn’t it?


    ## Try it yourself


    In this exercise, we will create a web page which will be **master search page**.
    From this page you can navigate to Google search, Bing search, Yahoo search and
    Wikipedia search. All major search web sites from one web page. The web page will
    look like as shown in figure 5.3.


    ![](img/739ece6d965a774f75c4a6632b8b7538_43_0.png)


    Figure 5.3: Master Search Page for Exercise


    When you click on these hyperlinks, it should take you to individual search pages.
    The following table shows address of these hyperlinks which you can use in your
    web page creation.


    Table 5.1: Hyperlink Addresses


    | Hyperlink Text | Address |

    | :--- | :--- |

    | **Google Search** | https://www.google.co.uk/ |

    | **Bing Search** | https://www.bing.com/ |

    | **Wikipedia Search** | http://en.wikipedia.org/wiki/Searching |

    | **Yahoo Search** | https://uk.search.yahoo.com/ |


    Following are the guidelines to perform this exercise:


    - Open Notepad

    - Create HTML using heading and hyperlink tags. For each hyperlink tag, use the
    text and address as given in the table 5.1.

    - Save the HTML file using .htm or .html extension

    - Open the HTML file using web browser to see the result.


    If you need any help, please check **Exercise3 – Master Search Page** chapter
    to find HTML for the web page above. Best of luck!


    ## Summary


    Bravo, one more chapter down. Double Bravo because you finished one of the most
    important concept in HTML. Big web sites are not possible without hyperlinks and
    you have just learnt fundamentals of the same. Keep the appetite up and keep reading...


    ## CHAPTER 6


    ## Chapter 6 – Images


    You learnt about hyperlink in the previous chapter. Hyperlink is one of the most
    important element in HTML because it provides a way to navigate between the web
    pages. Let’s move on to something visual now. What about **Images** or **Pictures**?
    There is a famous quotation that “***picture says a thousand words***”. Quotation
    shows how powerful pictures are in terms of delivering a message. Web sites show
    pictures to make web pages more exciting, optical and lively.


    How do we show image or picture on any web page? This chapter will try to answer
    these questions.


    ## Examples of Images


    Let’s see an example of picture on web page. Please go to the following page in
    Wikipedia - [https://en.wikipedia.org/wiki/Albert_Einstein](https://en.wikipedia.org/wiki/Albert_Einstein)
    . You see images as shown below in figure 6.1:


    ![](img/739ece6d965a774f75c4a6632b8b7538_46_0.png)


    Figure 6.1: Images Example


    You can see that I have marked two images – one is of **Albert Einstein** and
    other is of **Wikipedia Logo**. Don''t you agree that these images have made this
    page lively?


    Images on the web page can be used in two ways:


    - One way is just show image. Just show; nothing else.

    - Other way is to use image as hyperlink. It means when you click on the image,
    it will take you to some other page. How interesting!


    We will learn both ways in this chapter.


    ## Learning the Details


    How do we show image on web page? We use `<img>` tag for this purpose. Please
    check the example below:


    ```

    <img src="location of the image" alt="alternate text" width="width in pixel" height="height
    in pixel"></img>

    ```


    We start <img> tag and then we close with </img> tag like we do for any HTML tag.
    But then we use various other attributes to make sure image is shown on the web
    page. Let''s look into these attributes in the table below.


    Table 6.1: Attributes of the <img> tag


    | <img> tag attribute | Purpose |

    |---|---|

    | src | **src** stands for **source**. Like hyperlink, you enter address of the
    image for this attribute. Address is the location where this image has been stored.
    The address could be internet based image. It means image is stored at internet
    somewhere like any web page. Example is Albert Einstein image stored at Wikipedia.
    Address is: https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Einstein_1921_by_F_Schmutzer_-_restoration.jpg/220px-Einstein_1921_by_F_Schmutzer_-_restoration.jpg
    Or it could an address from your computer/laptop hard disk. It means the image
    is stored somewhere in your local computer hard disk. You provide folder location
    of the image. Example is - "file://C:/Books\HTMLforKids/mybook.jpg" You can use
    most types of images such as **jpg**, **jpeg**, **png**, **gif** and **bmp**.
    |

    | alt | **alt** stands for **alternate text**. This is the text shown on web page
    if image could not be shown on web page due to some reason. It is like a backup
    plan. You want to show some text in case image could not be shown due to some
    problem. |

    | width | It is the width of the image. If you don''t provide this value then
    it will show image in its original width. Width is measured in pixel. One pixel
    is like a dot on the screen. Just like you measure distance in meter or centimeter;
    in the same way you measure length of the image in pixel. |

    | height | It is the height of the image. Similar to width, it is also measured
    in pixel. If you don''t provide this value then it will show image in its original
    height. |'
