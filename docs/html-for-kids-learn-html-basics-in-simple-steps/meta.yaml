    # Chapter 8 –Table


    In the previous chapter, you learnt about how to use list to organize your writing.
    List makes writing points based, more readable and more presentable. There is
    another way you can organize your information and writing – it is called **Table**.
    You must have seen tables in your book, on web sites, also in your favorite magazine.
    Tables help you organize information in rows and columns.


    Tables are used for similar purpose on web sites as well. They help organize writing
    or information in rows and columns structure.


    Let’s learn about tables in this chapter.


