  md: '# CHAPTER 9


    # Chapter 9 – Styles on Page


    You have learnt most of the fundamental tags in HTML in the previous chapters.
    You understand when to use which tag and for what purpose. You can put all these
    tags together to make a nice web page.


    What we have not learnt is how to decorate the tags? How to make them colorful
    or of various size or of different font etc.? **Styles** are used in HTML for
    decoration purpose. Styles are like make-up of the web pages. You can choose your
    color, back ground, shades, lining to make the page more beautiful and attractive.


    There are so many styling methods. But we will learn some fundamental ones in
    this chapter. You will get a good idea about how to use styles and then you can
    explore other styling methods through further studies. Ready to color your web
    page! Here we go.


    # Examples of Styles


    Well, there is no exact sample of styles because every page does styles – some
    do more and some do less. Let’s see the web page of **Butlin’s** and see how they
    have used styles to color their page. For those who don’t know what Butlin’s is,
    they offer holiday resorts for the kids and families. Please go to the following
    web page - [http://www.butlins.com/](http://www.butlins.com/) and check styles
    as shown in figure 9.1 below.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# CHAPTER 9


    ![](img/739ece6d965a774f75c4a6632b8b7538_67_0.png)


    See, how styles have been used to decorate the web page. They look so beautiful
    and inviting. I think you have got an idea of what style means. Let’s study them
    in detail.


    # Learning the Details


    Styles are applied using a tag attribute called **style**. This attribute can
    be used with any tag. It has the following structure:


    ```

    style="property: value; property: value"

    ```


    **Property** means what style you want to use. **Value** means what style value
    you have chosen; how you want your page or tag to look. Not making much sense.
    Ok, let check the table below of some common style names, values and their purpose.
    It will then make perfect sense to you.


    Table 9.1: Common Used Styles


    | Style Property | Style Value | Purpose |

    |---|---|---|

    | background-color | Red or Green or Grey, any color | Used to paint background
    color of the web page |

    | color | Red or Green or Grey, any color | Used to paint color the text or hyperlink
