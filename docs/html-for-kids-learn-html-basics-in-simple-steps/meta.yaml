    ## 第二章


    ## 第二章 – 学习基础


    在第一章中，我们理解了网站和网页的概念。我们了解到HTML是创建网页的语言。你也看到了一个真实网站的HTML示例。我认为我们已经准备好开始学习HTML的基础知识了。然后在接下来的章节中，我们将对HTML有更广泛的理解。


    本章重点介绍HTML的结构以及如何在网页浏览器中查看HTML。我们还将学习标签和属性，它们是HTML的基本构建块。**就像人体由细胞构成；HTML由标签构成。**


    ## “Hello World”网页


    我知道我们甚至还没有学到关于HTML的任何东西，但让我们鼓起一点勇气，在对它一无所知的情况下写下我们的第一个HTML网页。我们自己的第一个“Hello World”网页。听起来很棒，对吧！请按照以下步骤操作：


    1.  打开**记事本**，屏幕为空白，如图2.1所示。


    ![](img/739ece6d965a774f75c4a6632b8b7538_13_0.png)


    图2.1：空白记事本


