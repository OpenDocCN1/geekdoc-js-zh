    # JavaScript to Read Value from Controls


    To be able to do the multiplication, we should have some way to read number written
    or typed in the controls. Then only we can apply some mathematical operation on
    the numbers. How do we read text or value from the control? The following is the
    JavaScript sentence to read value from the control:


    ```

    document.getElementById (''control name'').value

    ```


    I am sure this JavaScript sentence is not making much sense. Let’s dissect this
    statement as shown in figure 12.5 to learn more about it.


