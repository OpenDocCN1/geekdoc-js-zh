- img_proc: true
  md: '# CHAPTER 2


    when you meet an intelligent classmate, you say that classmate has one quality
    or attribute and that is being intelligent.


    What we realize is that the attributes provide additional details about someone
    or something.


    Attributes play the same purpose in tags as well. They provide additional details
    about the tag.


    Let’s take an example of the <body> tag; Body is generally used for background
    image, background color, font size etc.


    ```

    <body background="image of the background" bgcolor="color of the background" id="name
    of the body>

    ```


    The <Body> tag has the following attributes in this example as shown in the table
    2.1 below.


    Table 2.1: Body Attributes


    | Attribute | What it tells about <body> tag? |

    | :--- | :--- |

    | bgcolor | Background color of entire web page body |

    | background | Background image for the entire web page body |

    | Id | It is used in searching a tag programmatically. You will learn more about
    this in coming chapters. |


    Similar to <body> tag, all tags in the HTML have their own set of attributes.
    Some attributes like id are common across all tags. One tag can have more than
    one attributes. When you learn tags in coming chapters, you will also learn about
    their important attributes alongside.


    Finally, let’s see the structure of tag with attribute.


    ```

    <tag attribute-name="attribute-value"></tag>

    ```


    The attributes are presented as **attribute-name="attribute-value"** inside tags.
    All tags and attributes you learn in coming chapters will following the same structure.


