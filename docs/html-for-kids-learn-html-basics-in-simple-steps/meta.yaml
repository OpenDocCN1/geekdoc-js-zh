    “Headings” and “Paragraphs”? They are no different than what “Headings” and “Paragraphs”
    are used for in your books and note books. Headings are used to provide “title”
    of some topic. Paragraphs are used to provide written text for the topic. The
    purpose of “Headings” and “Paragraphs” tags in web pages is no different from
    how they are used in a book.


    # Examples of Heading and Paragraphs


    Best way to learn and realize something is to “see” that thing in real life. We
    will now see the examples of headings and paragraphs in a web page.


    Go to the following page in Wikipedia - [https://en.wikipedia.org/wiki/London](https://en.wikipedia.org/wiki/London).
