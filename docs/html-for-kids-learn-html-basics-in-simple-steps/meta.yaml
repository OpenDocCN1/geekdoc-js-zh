  md: '# CHAPTER 12


    In simple English, this JavaScript statement is saying **“Find a control with
    the name ‘control name’ inside HTML body and read value of it”**. Wow that complex
    looking JavaScript has such a simple meaning.


    JavaScript language is case sensitive. It means you need to write the statement
    taking care of each capital and small letter as shown in the statement here. If
    you write all in small letter or capital letters or mix other way around, then
    it will not work and throw error.


    So, if I have to read value of the textbox control named **number1** in the HTML
    shown earlier, your JavaScript statement will look like following:


    ```

    document.getElementById (‘number1’).value

    ```


    # JavaScript to Write Value to Controls


    Now that we know how to read value from the controls, let’s also learn, how to
    write value to a control? After all, the multiplication of number1 and number2
    has to be written inside the control named result. It means multiplication value
    has to be written to the result control.


    We will take help of **mathematical algebra** for this. You all must have learnt
    **expression** in algebra. Look at this expression problem here:


    > “Write a value of 5 to a term x and present as an expression”


    You must have solved this kind of problem many times. It is kid’s job right? How
    would the expression look like?


    ```

    x = 5

    ```


    Simple. Let me now change the problem statement in our HTML way.


    > “Write a value of 5 to textbox control result and present as an expression”


    The new expression will look very similar:


    ```

    document.getElementById (‘result’).value = 5

    ```


    Simple again. All I am doing that I am finding the result control by its identifier
    name and then writing a value of 5 to it. Exactly similar to term expression above.
    **This is another JavaScript statement which is used to write some value to a
    control.**'
