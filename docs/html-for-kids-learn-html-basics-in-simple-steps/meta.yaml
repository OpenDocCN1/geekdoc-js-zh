  md: '# # Preface


    **One** beautiful morning when I was enjoying my freshly brewed coffee and looking
    forward to a busy, interesting day, my son came to me and asked “*Dad! How do
    people create web sites? I heard they use HTML. How can I learn HTML?*” That day
    evening, I spent a good time searching a right book for him. It was not a quest
    for any HTML book, but it was a research to find the right content according to
    his young age and experience. It was not about finding a book which is complete
    for HTML, but it was about finding a book which takes him through baby steps to
    make him comfortable about HTML. I wanted a book which could grow his enthusiasm
    and curiosity to next level. Unfortunately, I could not find such book.


    But it motivated us that why should we not write one such book ourselves? We then
    worked on this book after all our first customer was at our home only. When writing
    this book, we took special care to keep the learning simple and with full of examples
    from real world. The kids reading this book will not only learn fundamentals of
    HTML but also be able to visualize how these fundamentals have been used in real
    web sites. This book is not a complete reference to HTML but it has been written
    to make young minds more inquisitive about HTML and inspire them to seek advanced
    learnings.


    After reading this book, the kids will be able to talk HTML and write web pages,
    but most important they would come back and ask “*Mom, Dad! I want to learn more
    about HTML?*”


    There is no age limit for the reader of this book because curiosity has nothing
    to do with age. Any person interested in HTML can use this book to understand
    the basics.


    Best Wishes!'
  merge: -1
  pgno: 2
- img_proc: true
  md: '# CHAPTER 1


    # Chapter 1 –Getting Started


    Welcome Friends!

    Since you have this book in your hand, I guess that you have a keen desire to
    learn about building websites. Your young mind wants to study and practice the
    fundamentals of creating a website.


    Websites are created using various technologies and languages such as HTML, Scripts,
    styles etc. HTML is the language to create websites. It stands for **Hypertext
    Markup Language**. I am not going to explain why HTML has this full name because
    you need to know few other things before you can understand the meaning. I don''t
    want to confuse you and trust me not knowing the name is not going to hurt you,
    at least as a beginner. Someone rightly said “*What''s in the name?*” You can
    learn meaning of HTML at some later point of time when you have broader knowledge
    about web technologies. But we are definitely going to understand how to write
    HTML. After all, no web site is created without writing HTML.


    Well, you have a right book in your hand. This book focuses on HTML and it is
    written for fundamentals. We are going to help you take those baby steps which
    will make you comfortable with HTML. We will learn all those things which a beginner
    is supposed to know. Then you can pursue advanced learnings later.


    # What you should know before reading this book


    There are few required skills for the reader of the book. These skills will help
    reader learn the chapters faster. The book is not going to focus on these skills.
    The skills are –


    +   - How to use computer?

    - How to access website using browsers such as Internet Explorer, Chrome, and
    Firefox etc.?

    - How to create a file in notepad and save the same?'
  merge: -1
  pgno: 3
- img_proc: true
  md: '# CHAPTER 1


    The computer which you use to practice the exercises should be connected to internet.

    Very basic skills and simple requirement. Isn’t it?


    # How to read this book?


    The approach taken by this book suits for beginners. Each of the chapters use
    simple language, explain fundamentals, show examples and finally ask you to do
    a small exercise. Each chapter covers one of the topic related to HTML and teaches
    in the following way:


    +   - First of all the topic is introduced and its purpose is explained

    - We then show example of the topic from the real web site

    - The topic is then explained in detail using examples

    - Finally a small exercise is given to practice the topic. The answer key for
    the exercise is given towards the end of the book.


    We have also recommended for advanced study of HTML in the later chapters.


