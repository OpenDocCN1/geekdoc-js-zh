    ## CHAPTER 2


    ## Chapter 2 – Learn the Basics


    In the first chapter, we understood the concept of web site and web pages. We
    learnt that the HTML is the language of creating web pages. You also saw an example
    of HTML from a real web site. I think we are in a good position to start looking
    into basics of HTML. Then in coming chapters, we will develop broader understanding
    of HTML.


    The current chapter focuses on the structure of HTML and how to view HTML in a
    web browser. We will also learn about tags and attributes which are the elementary
    building blocks of HTML. **Just like human body is made of cells; HTML is made
    of tags.**


    ## “Hello World” Web Page


    I know we have not learnt even a single thing about HTML, but let’s be a little
    courageous and write down our very first HTML web page without knowing anything
    about it. Our very own first “Hello World” web page. Sounds great, right! Follow
    these steps:


    1.  Open **notepad** with blank screen as shown in the figure 2.1.


    ![](img/739ece6d965a774f75c4a6632b8b7538_13_0.png)


    Figure 2.1: Blank Notepad


    2.  In this notepad, type your hello world HTML exactly as shown in the figure
    2.2. Come on, it is just eight lines. It would not take long.


    ![](img/739ece6d965a774f75c4a6632b8b7538_14_0.png)


    Figure 2.2: “Hello World” HTML Tags


    3.  Save the notepad file as “helloworld.html” in some folder location as shown
    in figure 2.3.


    ![](img/739ece6d965a774f75c4a6632b8b7538_15_0.png)


    Figure 2.3: helloworld HTML


    Here is the first basic lesson - all HTML files are saved with either “.html”
    or “.htm” extension.


    4.  How do we see our first HTML web page in web browser? Open Internet Explorer
    as shown in figure 2.4 (I am using Internet Explorer version 11. You can use other
    browser or version if you want.). The Internet Explorer is showing Bing map web
    site.


    ![](img/739ece6d965a774f75c4a6632b8b7538_16_0.png)


    Figure 2.4: Internet Explorer


    5.  Go to the **Internet Explorer window** and press **Alt** button on keyboard.
    It will start showing **File menu** as marked in square in the figure 2.5 below.


    ![](img/739ece6d965a774f75c4a6632b8b7538_17_0.png)


    *Figure 2.5: Internet Explorer File Menu*


    6.  Click on **File** and then **Open** menu option as shown in figure 2.6 below.


    ![](img/739ece6d965a774f75c4a6632b8b7538_18_0.png)


    Figure 2.6: File >> Open Menu


    7.  It will pop up the **Open window** which is shown in figure 2.7.


    ![](img/739ece6d965a774f75c4a6632b8b7538_18_1.png)


    Figure 2.7: Open Window


    8.  Using **Browse... button** select **helloworld.html** file from the **folder**
    location you have saved earlier. I have used folder location “C:\books\HTML” for
    this demonstration. It is shown in the figure 2.8 below.


    ![](img/739ece6d965a774f75c4a6632b8b7538_19_0.png)


    *Figure 2.8: File Selected.*


    9.  Click on OK button. It will show your first HTML web page in the Internet
    Explorer as shown in figure 2.9. See the Hello World message as you have typed
    in your HTML page.


    ![](img/739ece6d965a774f75c4a6632b8b7538_20_0.png)


    Figure 2.9: File Selected.


    Congratulations! You have just written your very first HTML web page. How do you
    feel? Excited! There is more to come.


    You should memorize and practice these steps of creating HTML in notepad and then
    viewing that in the web browser (Internet Explorer) because we will do this in
    every exercise as we move forward in other chapters.


    ## Understanding HTML Structure


    Now that you have written your first HTML web page, let’s understand what it means.


    As I mentioned earlier, *just like human body is made of cells; HTML is made of
    tags*. Everything you see in the HTML example above is a **tag**. For instance
    <html>, <head>, <title>, <body>, </html>, </head>, </title>, </body>, everything
    is called a tag. Just like apple is called apple, you are called by your name,
    these things are called **tags**. Nice name, I must say. Each tag has a purpose
    in HTML or say on web page.


    HTML is the language for web page; you learnt this in chapter one. Similar to
    any other language like English, HTML also has words and grammar. In this analogy,
    tags are like words. In English, you place words together using grammar to write
    some sentence that makes sense. Similarly in HTML, you place tags together using
    HTML grammar to write something which makes sense as a web page.


    You will learn these tags or words in coming chapters. We will now study grammar
    of HTML in the remaining part of this chapter. Whenever we mention any particular
    HTML grammar rule, we will mark that with **HTML Grammar**: tip.


    For instance, here is our very first rule.'
