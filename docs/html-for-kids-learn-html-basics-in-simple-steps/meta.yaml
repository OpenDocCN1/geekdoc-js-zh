  md: '# CHAPTER 11


    # Chapter 11 –Forms and Controls


    In the chapters so far, we mostly read about how to show information on web page
    or how to use links or how to make pages look beautiful. We will now focus on
    building a web page where people can type some information or able to select some
    choices using their keyword and mouse on the web pages. We generally call such
    activities of the people as **user inputs**.


    We all have seen examples of user inputs on various web sites. For example, on
    Google site when you type search text and press search button, that is a type
    of user input. Similarly when you or your parents go to online booking web sites
    and book for hotel or flights by typing start date, end date, number of people
    etc. that is also a type of user input.


    **Forms and Controls** are used to create such user inputs. **Form** is like a
    container (just like table was container earlier for <tr> and <td> tags) and **Controls**
    are individual user inputs. When I say container, it is similar to a book which
    is container for pages. A book contains one or more pages. Similarly, a form contains
    one or more controls. Not making much sense? Right? No worries, lets understand
    it again in the examples in the next section.


    This chapter and next chapter are closely related to each other. In current chapter
    you learn about designing forms while in next chapter you learn how to make use
    of user inputs to perform some business actions. For instance, on Google site,
    when I enter search text and press search button, the site responds back with
    search results. Providing these search results is business action for the Google
    site. Similarly, booking hotel or flight tickets based on people user inputs is
    another example of business action.


    # Examples of Forms and Controls


    Let’s start with the first example we discussed. Please go to Google site ([https://www.google.co.uk/](https://www.google.co.uk/))
    as shown in figure 11.1.'
