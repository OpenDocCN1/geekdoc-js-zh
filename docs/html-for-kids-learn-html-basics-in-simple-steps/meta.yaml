    # CHAPTER 2


    ![](img/739ece6d965a774f75c4a6632b8b7538_20_0.png)


    Figure 2.9: File Selected.


    Congratulations! You have just written your very first HTML web page. How do you
    feel? Excited! There is more to come.


    You should memorize and practice these steps of creating HTML in notepad and then
    viewing that in the web browser (Internet Explorer) because we will do this in
    every exercise as we move forward in other chapters.


    # Understanding HTML Structure


    Now that you have written your first HTML web page, let’s understand what it means.


    As I mentioned earlier, *just like human body is made of cells; HTML is made of
    tags*. Everything you see in the HTML example above is a **tag**. For instance
    <html>, <head>, <title>, <body>, </html>, </head>, </title>, </body>, everything
    is called a tag. Just like apple is called apple, you are called by your name,
    these things are called **tags**. Nice name, I must say. Each tag has a purpose
    in HTML or say on web page.


    HTML is the language for web page; you learnt this in chapter one. Similar to
    any other language like English, HTML also has words and grammar. In this analogy,
    tags are like words. In English, you place words together using grammar to write
    some sentence that makes sense. Similarly in HTML, you place tags together using
    HTML grammar to write something which makes sense as a web page.


    You will learn these tags or words in coming chapters. We will now study grammar
    of HTML in the remaining part of this chapter. Whenever we mention any particular
    HTML grammar rule, we will mark that with **HTML Grammar**: tip.


    For instance, here is our very first rule.'
- md: '## CHAPTER 2


    **HTML Grammar:** Each HTML tag comes in pair. You will always have an opening
    tag like `<tag>` and a corresponding closing tag like `</tag>`. The opening tag
    is written inside `<` and `>` brackets. The closing tag is written between `</`
    and `>` brackets.


    Let’s start with our very first tag.


    ## `<HTML>` Tag


    Take a look at first tag as shown below.


    ```html

    <html>

    <head>

    <title>My First Title</title>

    </head>

    <Body>


    Hello World!


    </Body>

    </html>

    ```


    You see an opening tag `<html>` and then closing tag `</html>`. `<html>` and `</html>`
    tags are like start and end points of the HTML file.


    **HTML Grammar:** all HTML files must start with `<html>` tag and end with `</html>`
    file.


    ## `<HEAD>` Tag


    Next important tag in HTML file is `<head>` tag. It has been highlighted below.


    ```html

    <html>

    <head>

    <title>My First Title</title>

    </head>

    <Body>


    Hello World!


    </Body>

    </html>

    ```


    This tag in real world web pages is used to contain scripts, styles and `<title>`
    tag. Well, don’t confuse with these new words. For now, we will keep it simple.
    What you need to know that it contains another important tag `<title>`. You will
    learn about `<head>` tag in more details when learning advanced styling and programming
    in HTML.


    **HTML Grammar:** The opening `<head>` tag comes immediately after `<html>` tag.
    The closing `</head>` tag comes before `<body>` tag. The `<head>` tag contains
    another tag called `<title>` tag.


    ## `<TITLE>` Tag


    What is `<title>` tag? It is an interesting and important tag. You can write some
    text between opening `<title>` and closing `</title>` tags. And whatever you write
    between these pairs will appear in the title of the browser window.


    Here is the example of our very first HTML:


    ```html

    <html>

    <head>

    <title>My First Title</title>

    </head>

    <Body>


    Hello World!


    </Body>

    </html>

    ```


    Here is the result of the `<title>` tag in browser (Internet Explorer in this
    case) window as shown in figure 2.10. You can see text written between `<title>`
    and `</title>` tags are shown in the title of the Internet Explorer.


    ![](img/739ece6d965a774f75c4a6632b8b7538_23_0.png)


    Figure 2.10: Internet Explorer Title


    **HTML Grammar:** the `<title>` tags must be written inside `<head>` tags. It
    contains any text which is then shown in the title of web browser window.


    **HTML Grammar:** The `<title>` and `<head>` tags are optional. It means, they
    can be inside HTML or they cannot. In coming chapters, you will find that we have
    not added these two tags in many of the examples because they are not required
    in those examples. However, it is a good practice to include both `<title>` and
    `<head>` tags in your HTML.


    In real life web sites, `<title>` tag is used to show summary or heading of the
    web page in the title of the browser window.


    ## `<BODY>` Tag


    The most important and primary tag in HTML is `<body>` tag. Whatever you write
    inside `<body>` tags; will be shown in the browser window. For instance, in our
    first page, we wrote Hello World!!! Inside `<body>` tag and it shown in the browser
    window (Internet Explorer).


    The body tag has been highlighted in the HTML below.


    ```html

    <html>

    <head>

    <title>My First Title</title>

    </head>

    <Body>

    Hello World!

    </Body>

    </html>

    ```


    The body tag content is shown in web browser as shown in the figure 2.11 below.


    ![](img/739ece6d965a774f75c4a6632b8b7538_24_0.png)


    Figure 2.11: `<body>` Tag shown in browser


    Let’s take another example. Go to Google web site - [https://www.google.co.uk/](https://www.google.co.uk/).
    You see I have squared a part of the web page as shown in figure 2.12. This squared
    part is made of various tags and all these tags are inside `<body>` and `</body>`.


    ![](img/739ece6d965a774f75c4a6632b8b7538_25_0.png)


    *Figure 2.12: Google Site Body*


    Check the Figure 2.13 below. I have highlighted some of the types of tags which
    are used inside `<body>` and `</body>` to construct the web page.


    ![](img/739ece6d965a774f75c4a6632b8b7538_26_0.png)


    Figure 2.13: Google Site Body Tags


    I have highlighted some tags but there are many more on this page. Each tag serves
    certain purpose on the web page. For instance, some are used to show Google logo,
    some to enter search text and some to be clicked to fetch search result.


    You will learn about many such tags in coming chapters. The `<body>` grammar rule
    will always be applied. Every tag you learn will be written between `<body>` and
    `</body>` tags.


    **HTML Grammar:** Opening `<body>` tag comes after `<head>` tag. The closing `</body>`
    tag comes before `</html>` tag. Every other tag you want to write in order to
    show your web page in the desired way is written between `<body>` and `</body>`
    tags.


    When writing tag names, always use small English letters otherwise you might get
    errors. In web world, writing tags in small English letter is always appreciated
    as **best practice**. I am sure you want to be associated with **the best word**.


    Sometimes tags are also referred as **elements** or **HTML elements**.


    ## Attributes of the Tag


    You learnt about tags and HTML structure. Now let''s learn about **attributes**
    which are important part of the tags.


    Attribute means quality. What is the purpose of attribute in real life? Let''s
    take an example. When you see a red apple, you say that one of the quality (or
    say attribute) of this apple is that it is red. Similarly, when you meet an intelligent
    classmate, you say that classmate has one quality or attribute and that is being
    intelligent.


    What we realize is that the attributes provide additional details about someone
    or something.


    Attributes play the same purpose in tags as well. They provide additional details
    about the tag.


    Let’s take an example of the `<body>` tag; Body is generally used for background
    image, background color, font size etc.


    ```html

    <body background="image of the background" bgcolor="color of the background" id="name
    of the body">

    ```


    The `<Body>` tag has the following attributes in this example as shown in the
    table 2.1 below.


    Table 2.1: Body Attributes


    | Attribute | What it tells about `<body>` tag? |

    | :--- | :--- |

    | bgcolor | Background color of entire web page body |

    | background | Background image for the entire web page body |

    | Id | It is used in searching a tag programmatically. You will learn more about
    this in coming chapters. |


    Similar to `<body>` tag, all tags in the HTML have their own set of attributes.
    Some attributes like id are common across all tags. One tag can have more than
    one attributes. When you learn tags in coming chapters, you will also learn about
    their important attributes alongside.


    Finally, let’s see the structure of tag with attribute.


    ```html

    <tag attribute-name="attribute-value"></tag>

    ```


    The attributes are presented as **attribute-name="attribute-value"** inside tags.
    All tags and attributes you learn in coming chapters will following the same structure.


    ## Summary


    Great, you now understand HTML structure, tags and attributes. You have fundamental
    concepts in place. It is time to start learning into specific tags, what purpose
    they solve, how to use and how they look on the web pages. Rest of the chapters
    in this book are focused on tags and related topics. Keep reading...


    ## CHAPTER 3


    ## Chapter 3 – Heading and Paragraphs


    We learnt about HTML fundamentals in the previous chapter. You now understand
    the structure of a tag in HTML web page. With this basic understanding, from now
    onward, we will learn about specific tags in terms of what they do on the page
    and how to use them.


    In this chapter, we will focus on **Headings** and **Paragraphs** tags. What are
    “Headings” and “Paragraphs”? They are no different than what “Headings” and “Paragraphs”
    are used for in your books and note books. Headings are used to provide “title”
    of some topic. Paragraphs are used to provide written text for the topic. The
    purpose of “Headings” and “Paragraphs” tags in web pages is no different from
    how they are used in a book.


    ## Examples of Heading and Paragraphs


    Best way to learn and realize something is to “see” that thing in real life. We
    will now see the examples of headings and paragraphs in a web page.


    Go to the following page in Wikipedia - [https://en.wikipedia.org/wiki/London](https://en.wikipedia.org/wiki/London).
    I am actually looking for information on London in Wikipedia. You see examples
    of heading and paragraph as shown below in figure 3.1.'
