    ## 第五章


    ## 第五章 – 超链接


    欢迎回来，朋友们！在前面的章节中，你学习了如何格式化文本。你一定已经意识到，使用HTML创建任何类型的内容（如故事、新闻或任何你想在网站上分享的文章）是多么简单而强大。


    我们现在将学习HTML中最重要的元素之一，它叫做**超链接**。在前两章中，你了解到任何网站都是网页的集合。那么，在一个网站中，你如何从一个页面移动到另一个页面呢？通常，你使用超链接在网站中从一个页面移动到另一个页面。你点击网页上的一个超链接，它就会带你到另一个网页，如此类推。在HTML的世界里，我们说我们使用超链接从一个页面**导航**到另一个页面。


    在本章中，我们将学习如何使用超链接。相信我，这非常简单。


    ## 超链接示例


    我们将举一个每个人都见过的例子。我猜几乎每个人都见过！


    访问网站 - [https://www.google.co.uk/](https://www.google.co.uk/)。请不要告诉我你以前没用过谷歌。在这个谷歌网站上，下面的图5.1展示了一些超链接的例子：


    ![](img/739ece6d965a774f75c4a6632b8b7538_41_0.png)


    图5.1：超链接示例


    这个网页上还有更多超链接，但我只展示了一些以便于理解。当你点击一个超链接时，它会带你到或者说导航到图中所示的网页。你可以看到，使用超链接，你能够访问谷歌网站的各种网页。


    在上面的例子中，Advertising、Business、Terms、Gmail被称为超链接的“**文本**”。文本显示了网页上超链接的显示文字；人们可以阅读它来了解超链接的用途。当你点击超链接时，它带你去的网页被称为“**地址**”。我建议你记住并理解这两个术语，因为它们是超链接的基础。


    是时候学习如何使用超链接了。


    ## 学习细节


    让我们从一个例子开始。假设你想创建一个超链接，它应该带你到 [https://www.google.co.uk/](https://www.google.co.uk/)
    网页，并且应该显示文本为“Google Search”。这意味着，超链接应该在网页上显示文本为“Google Search”（就像上面例子中的Advertising、Business、Terms、Gmail）。地址是
    [https://www.google.co.uk/](https://www.google.co.uk/)。


    你如何编写这样的超链接，看看：


    ```

    <html>

    <head>

    <title></title>

    </head>

    <body>

    <a href="https://www.google.co.uk"> Google Search </a>

    </body>

    </html>

    ```


    超链接由HTML标签 `<a>` 表示。在 `<a>` 和 `</a>` 标签之间，你编写超链接的**文本**。**文本**是超链接的显示文字。你在属性“**href**”中提供超链接的**地址**。**地址**的目的是告诉网页所在的位置。


    这个超链接在HTML页面中将如图5.2所示：


    ![](img/739ece6d965a774f75c4a6632b8b7538_42_0.png)


    *图5.2：Google Search 示例*


    很简单，对吧？


    让我们再举一个有趣的例子。如果我在超链接的地址中输入“#”，会发生什么，就像下面这样？


    ```

    <a href="#"> My Link </a>

    ```


    你自己试试看。你会发现超链接不会带你去任何地方，而是让你停留在超链接所在的同一页面。很有趣，不是吗？


    ## 动手试试


    在这个练习中，我们将创建一个网页，它将是一个**主搜索页面**。从这个页面，你可以导航到谷歌搜索、必应搜索、雅虎搜索和维基百科搜索。所有主要的搜索网站都在一个网页上。该网页将如图5.3所示。


    ![](img/739ece6d965a774f75c4a6632b8b7538_43_0.png)


    图5.3：练习用的主搜索页面


    当你点击这些超链接时，它应该带你到各个搜索页面。下表显示了这些超链接的地址，你可以在创建网页时使用。


    表5.1：超链接地址


    | 超链接文本 | 地址 |

    | :--- | :--- |

    | **Google Search** | https://www.google.co.uk/ |

    | **Bing Search** | https://www.bing.com/ |

    | **Wikipedia Search** | http://en.wikipedia.org/wiki/Searching |

    | **Yahoo Search** | https://uk.search.yahoo.com/ |


    以下是进行此练习的指南：


    -   打开记事本

    -   使用标题和超链接标签创建HTML。对于每个超链接标签，使用表5.1中给出的文本和地址。

    -   使用 .htm 或 .html 扩展名保存HTML文件

    -   使用网页浏览器打开HTML文件以查看结果。


    如果你需要任何帮助，请查看**练习3 – 主搜索页面**章节，以找到上述网页的HTML代码。祝你好运！


    ## 总结


    太棒了，又完成了一章。双倍的棒，因为你完成了HTML中最重要的概念之一。没有超链接，大型网站是不可能存在的，而你刚刚学习了它的基础知识。保持你的胃口，继续阅读……


    ## 第六章


    ## 第六章 – 图像


    你在上一章学习了超链接。超链接是HTML中最重要的元素之一，因为它提供了在网页之间导航的方式。现在让我们转向一些视觉化的东西。**图像**或**图片**怎么样？有一句著名的谚语：“***一图胜千言***”。这句话展示了图片在传递信息方面的强大能力。网站展示图片是为了让网页更令人兴奋、更直观、更生动。


    我们如何在任何网页上显示图像或图片？本章将尝试回答这些问题。


    ## 图像示例


    让我们看看网页上的图片示例。请访问维基百科的以下页面 - [https://en.wikipedia.org/wiki/Albert_Einstein](https://en.wikipedia.org/wiki/Albert_Einstein)。你会看到如图6.1所示的图像：


    ![](img/739ece6d965a774f75c4a6632b8b7538_46_0.png)


    图6.1：图像示例


    你可以看到我标记了两张图片——一张是**阿尔伯特·爱因斯坦**，另一张是**维基百科标志**。你不觉得这些图片让这个页面生动起来了吗？


    网页上的图像可以有两种使用方式：


    -   一种方式是仅仅显示图像。只是显示；没有其他。

    -   另一种方式是将图像用作超链接。这意味着当你点击图像时，它会带你到另一个页面。多么有趣！


    我们将在本章中学习这两种方式。


    ## 学习细节


    我们如何在网页上显示图像？我们使用 `<img>` 标签来实现这个目的。请查看下面的例子：


    ```

    <img src="location of the image" alt="alternate text" width="width in pixel" height="height
    in pixel"></img>

    ```


    我们开始使用 `<img>` 标签，然后像处理任何HTML标签一样用 `</img>` 标签关闭它。但接着我们使用各种其他属性来确保图像在网页上显示。让我们看看下表中的这些属性。


    表6.1：`<img>` 标签的属性


    | `<img>` 标签属性 | 用途 |

    |---|---|

    | src | **src** 代表 **source**（来源）。就像超链接一样，你为这个属性输入图像的地址。地址是此图像存储的位置。地址可以是基于互联网的图像。这意味着图像存储在互联网的某个地方，就像任何网页一样。例子是存储在维基百科的阿尔伯特·爱因斯坦图像。地址是：https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Einstein_1921_by_F_Schmutzer_-_restoration.jpg/220px-Einstein_1921_by_F_Schmutzer_-_restoration.jpg
    或者它也可以是你电脑/笔记本电脑硬盘上的地址。这意味着图像存储在你本地电脑硬盘的某个地方。你提供图像的文件夹位置。例子是 - "file://C:/Books\HTMLforKids/mybook.jpg"
    你可以使用大多数类型的图像，如 **jpg**、**jpeg**、**png**、**gif** 和 **bmp**。 |

    | alt | **alt** 代表 **alternate text**（替代文本）。如果由于某种原因图像无法在网页上显示，这是网页上显示的文本。它就像一个备用计划。你想在图像因某些问题无法显示时显示一些文本。
    |

    | width | 这是图像的宽度。如果你不提供这个值，它将以原始宽度显示图像。宽度以像素为单位。一个像素就像屏幕上的一个点。就像你用米或厘米测量距离一样；同样，你用像素测量图像的长度。
    |

    | height | 这是图像的高度。与宽度类似，它也以像素为单位。如果你不提供这个值，它将以原始高度显示图像。 |

    '
