    # 给孩子的HTML


    专为充满好奇心的年轻心灵打造的完美书籍


    ![](img/739ece6d965a774f75c4a6632b8b7538_0_0.png)


    布拉金德拉·辛格


    帕提克·拉瓦尔


    ## 目录


    - 前言

    - 第1章 - 入门

    - 第2章 - 学习基础

    - 第3章 - 标题和段落

    - 第4章 - 文本格式化

    - 第5章 – 超链接

    - 第6章 – 图像

    - 第7章 – 列表

    - 第8章 – 表格

    - 第9章 – 页面样式

    - 第10章 - 使用Iframe

    - 第11章 - 表单和控件

    - 第12章 - JavaScript入门

    - 第13章 - 进一步学习的参考资料

    - 练习1 – 贪心的乌鸦

    - 练习2 – 贪心的乌鸦格式化

    - 练习3 – 大师搜索页面

    - 练习4 – 艾萨克·牛顿

    - 练习5 – 目录

    - 练习6 – 学生成绩

    - 练习7 – 五彩的贪心乌鸦

    - 练习8 – 我的搜索

    - 练习9 – 航班预订

    - 练习10 – 表单计算


    ## 前言


    **一个**美丽的早晨，当我正享受着新鲜冲泡的咖啡，期待着忙碌而有趣的一天时，我的儿子走过来问我：“*爸爸！人们是怎么创建网站的？我听说他们用HTML。我怎么才能学会HTML？*”那天晚上，我花了好些时间为他寻找合适的书。这并非在寻找任何一本HTML书，而是在研究如何根据他的年龄和经验找到合适的内容。这不是要找一本完整的HTML参考书，而是要找一本能引导他一步步熟悉HTML的书。我希望这本书能将他的热情和好奇心提升到新的高度。遗憾的是，我没能找到这样的书。


    但这激励了我们：为什么不自己写一本呢？于是我们着手编写这本书，毕竟我们的第一位读者就在家里。在编写这本书时，我们特别注意保持学习的简单性，并充满了来自现实世界的例子。阅读这本书的孩子们不仅能学习HTML的基础知识，还能直观地了解这些基础知识如何在真实的网站中应用。这本书并非HTML的完整参考手册，但它旨在让年轻的心灵对HTML更加好奇，并激励他们去探索更高级的知识。


    读完这本书后，孩子们将能够谈论HTML并编写网页，但最重要的是，他们会回来问：“*妈妈，爸爸！我想了解更多关于HTML的知识？*”


    这本书的读者没有年龄限制，因为好奇心与年龄无关。任何对HTML感兴趣的人都可以使用这本书来理解基础知识。


    祝一切顺利！


    # 第1章 – 入门


    欢迎，朋友们！

    既然你手中拿着这本书，我猜你一定对学习构建网站有着强烈的渴望。你年轻的心灵想要学习和实践创建网站的基础知识。


    网站是使用各种技术和语言创建的，例如HTML、脚本、样式等。HTML是创建网站的语言。它代表**超文本标记语言**。我不会解释为什么HTML有这个全称，因为在你能理解其含义之前，你需要先了解一些其他东西。我不想让你困惑，相信我，不知道这个名字不会伤害你，至少作为初学者是这样。有人恰当地说过：“*名字里有什么？*”当你对网络技术有了更广泛的知识时，你可以在以后的某个时间点学习HTML的含义。但我们肯定会学习如何编写HTML。毕竟，没有网站是不通过编写HTML创建的。


    嗯，你手中拿着一本合适的书。这本书专注于HTML，并且是为初学者编写的。我们将帮助你迈出那些让你熟悉HTML的“婴儿学步”。我们将学习所有初学者应该知道的东西。然后你可以在以后追求更高级的学习。


    ## 阅读本书前你应该知道什么


    本书的读者需要具备一些必备技能。这些技能将帮助读者更快地学习各章节。本书不会专注于这些技能。这些技能是：


    - 如何使用计算机？

    - 如何使用Internet Explorer、Chrome和Firefox等浏览器访问网站？

    - 如何在记事本中创建文件并保存？


    你用来练习的计算机应该连接到互联网。

    非常基础的技能和简单的要求。不是吗？


    ## 如何阅读本书？


    本书采用的方法适合初学者。每一章都使用简单的语言，解释基础知识，展示示例，最后让你做一个小练习。每一章都涵盖一个与HTML相关的主题，并按以下方式教授：


    - 首先介绍该主题并解释其目的

    - 然后我们从真实的网站中展示该主题的示例

    - 接着使用示例详细解释该主题

    - 最后给出一个小练习来实践该主题。练习的答案在本书末尾给出。


    我们还在后面的章节中推荐了HTML的进阶学习。


    ## 什么是网站？


    我们都知道什么是网站。我相信每个人都以某种方式使用过网站。公司和个人拥有并发布网站是为了特定的目的。目的可以是任何事情——搜索信息、分享信息、销售商品、教育、入学或预订航班。

    让我们通过几个例子来理解。

    谷歌网站（https://www.google.co.uk/）用于在互联网上搜索信息。如图1.1所示。


    ![](img/739ece6d965a774f75c4a6632b8b7538_5_0.png)


    图1.1：谷歌网站的主页或着陆页


    亚马逊网站（[http://www.amazon.co.uk/](http://www.amazon.co.uk/)）在互联网上销售商品。如图1.2所示。


    ![](img/739ece6d965a774f75c4a6632b8b7538_6_0.png)


    图1.2：亚马逊网站的主页或着陆页


    Booking网站（http://www.booking.com/）用于在互联网上预订酒店。请查看下面的图1.3。


    ![](img/739ece6d965a774f75c4a6632b8b7538_7_0.png)


    图1.3：Booking.com网站的主页或着陆页


    维基百科网站（http://www.wikipedia.org/）用于在互联网上分享信息。如图1.4所示。


    ![](img/739ece6d965a774f75c4a6632b8b7538_8_0.png)


    图1.4：维基百科网站的主页或着陆页


    你可以看到，你想用网站实现什么没有边界。天空才是极限。告诉我，你对自己网站有什么想法？


    ## 什么是网页？


    你现在对网站是什么以及它能解决什么目的有了大致的了解。我们脑海中浮现的第一个问题是——这个网站是由什么构成的？这个问题催生了一个术语，叫做**网页**。


    网站是网页的集合。这意味着一个网站由一个或多个网页组成。让我们通过图1.5所示的例子来理解这个概念。


    ![](img/739ece6d965a774f75c4a6632b8b7538_9_0.png)


    访问谷歌网站（[https://www.google.co.uk/](https://www.google.co.uk/)）。当你点击**Gmail**链接时，它会打开一个新屏幕。同样，当你点击**图片**或**广告**链接时，它会打开相应的新屏幕。还有很多类似的链接，但我只举了三个例子。现在，这些打开的屏幕中的每一个都是独立的网页。**每个屏幕代表一个网页**。通过这些链接和点击，很明显，网站是这些屏幕的集合。由于每个屏幕代表一个网页，使用这个类比，我们可以说“**网站是网页的集合**”。


    要创建一个网站，你需要创建这些独立的屏幕或网页，然后将它们放置并链接在一起。当你打开网站时，首先打开的任何屏幕或网页被称为**主页或着陆页**。然后你从主页进入其他网页。


    ## 什么是HTML？

    '
