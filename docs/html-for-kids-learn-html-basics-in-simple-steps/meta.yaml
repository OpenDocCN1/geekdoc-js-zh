  md: '# CHAPTER 12


    # JavaScript to Perform Mathematical Operations


    We now know both read and write statements in JavaScript. We would now focus on
    multiplication of number1 and number2. Algebra expressions will again come to
    our help.

    Look at another expression problem here:


    > “There are three terms – x, y and z. Write an expression which multiplies terms
    x, y and assigns the result of multiplication to term z”


    Little lengthy problem but again simple one. How would the expression look now?


    ```

    z = x * y

    ```


    (*) is sign of multiplication in computer. Similarly, (+), (-) and (/) are signs
    of addition, subtraction and division respectively.

    Let me again change the problem statement in our HTML way:


    > “There are three textbox controls – number1, number2 and result. Write an expression
    which multiplies values of number1, number2 controls and assigns the result of
    multiplication to control result as value”


    Using the same statement as above, the expression in HTML Controls context will
    look like following:


    ```

    document.getElementById (‘result’).value = document.getElementById

    (‘number1’).value * document.getElementById (‘number2’).value

    ```


    This is the JavaScript statement to multiply values of two controls and assign
    to a third control. Similarly, you can write JavaScript statements for subtraction,
    addition and division. Only the sign of operation will change from (*) to (+),
    (-) or (/).

    Let’s move next. What if there are more than one JavaScript statements? How do
    we write them? If there are more than one JavaScript statements, then we separate
    them using semicolon (;). Take a look at the example below:


    ```

    document.getElementById (‘number1’).value = 5; document.getElementById

    (‘number2’).value = 5

    ```


    There are two JavaScript statements next to each other but separated by semicolon
    (;).'
