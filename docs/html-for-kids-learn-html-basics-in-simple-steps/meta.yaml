    \nIn the previous chapter, you learnt about how to use list to organize your writing.\
    \ List makes writing points based, more readable and more presentable. There is\
    \ another way you can organize your information and writing – it is called **Table**.\
    \ You must have seen tables in your book, on web sites, also in your favorite\
    \ magazine. Tables help you organize information in rows and columns.\n\nTables\
    \ are used for similar purpose on web sites as well. They help organize writing\
    \ or information in rows and columns structure.\n\nLet’s learn about tables in\
    \ this chapter.\n\n## Examples of Table\n\nWe will search for football world cup\
    \ at Wikipedia to see an example of table. Please go to the following web page\
