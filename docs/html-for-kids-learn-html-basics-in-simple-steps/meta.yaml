- img_proc: true
  md: '# CHAPTER 8


    ![](img/739ece6d965a774f75c4a6632b8b7538_62_0.png)


    Figure 8.2: Table Definitions


    **Row** is the horizontal line in the table. You can add as many rows as you want
    in the table. Row determines the height of the table.

    **Column** is the vertical line in the table. Again you can add as many columns
    as you require in your table. Column decides the width of the table.

    **Cell** is the cross section of row and column in the table. Number of cells
    in the table depends on the number of rows and column in the table. You write
    your information in table in the cell only.

    **Header** is a type of cell and it is a cell in the **first row** of the table.
    Generally they describe the name of the column in the header cells. In the world
    cup example above, header has text like year, host country, continent, matches
    which shows type of information written in the particular column. Header text
    is generally shown as bold.


    In HTML, tables are defined using `<table>`, `<th>`, `<tr>` and `<td>` tags. The
    `<th>` tag represents header cell. The `<tr>` tag represents row. The `<td>` tag
    represents cell. The `<table>` tag works as container and keeps all these tags
    together.


    Let’s map these tags to the table shown in figure 8.2 above. The mapping has been
    presented in the figure 8.3.'
  merge: -1
  pgno: 62
- img_proc: true
  md: "# CHAPTER 8\n\n![](img/739ece6d965a774f75c4a6632b8b7538_63_0.png)\n\nFigure\
    \ 8.3: Table Tags Mapping\n\nNumber of <tr> tags within <table> tag defines number\
    \ of rows in the table. If you want five rows in a table, you add five <tr> tags\
    \ inside <table> tag.\nSimilarly, number of <td> tags within <tr> tag defines\
    \ number of cells in the row. You want three 3 cells, you add three <td> tags\
    \ within <tr> tag.\n<th> tag works in the same way as <td> tag works.\nHeader\
    \ text is written inside <th></th> tags. Cell text is written within <td> </td>tags.\n\
    With this understanding, let's see the structure of table HTML.\n\n```\n<table\
    \ border=\"width in pixel\">\n    <tr>\n        <th>Header Text</th>\n       \
    \ <th>Header Text</th>\n    </tr>\n    <tr>\n        <td>Cell Text</td>\n    \
    \    <td>Cell Text</td>\n    </tr>\n    <tr>\n        <td>Cell Text</td>\n   \
    \     <td>Cell Text</td>\n    </tr>\n</table>\n```\n\nIf you look at the structure,\
    \ you can relate what I was talking about these different table tags in the previous\
    \ paragraph. The **border** attribute shows the width of the table lines in pixel.\
    \ If you don't provide border value, the table will have no lines.\nLet's see\
    \ an example. Please check the HTML below:\n\n```\n<html>\n```"
