    \ | 2nd | 12 / 12 | 819,810 | 35 | 23,423 | 51,800 | Råsunda Stadium, Solna †\
    \ |\n| 7 | 1962 | Chile | S. Amer. | 3rd | 4 / 4 | 893,172 | 32 | 27,912 | 68,679\
    \ | Estadio Nacional, Santiago |\n| 8 | 1966 | England | Europe | 1st | 8 / 7\
    \ | 1,563,135 | 32 | 48,848 | 98,270 | Wembley Stadium, London |\n| 9 | 1970 |\
    \ Mexico | N. Amer. | QF | 5 / 5 | 1,603,975 | 32 | 50,124 | 108,192 | Estadio\
    \ Azteca, Mexico City |\n| 10 | 1974 | West Germany | Europe | 1st | 9 / 9 | 1,865,753\
    \ | 38 | 49,099 | 83,168 | Olympiastadion, West Berlin |\n| 11 | 1978 | Argentina\
    \ | S. Amer. | 1st | 6 / 5 | 1,545,791 | 38 | 40,679 | 71,712 | River Plate Stadium,\
    \ Buenos Aires |\n| 12 | 1982 | Spain | Europe | top 12 | 17 / 14 | 2,109,723\
    \ | 52 | 40,572 | 95,500 | Camp Nou, Barcelona |\n| 13 | 1986 | Mexico | N. Amer.\
    \ | QF | 12 / 11 | 2,394,031 | 52 | 46,039 | 114,600 | Estadio Azteca, Mexico\
    \ City |\n| 14 | 1990 | Italy | Europe | 3rd | 12 / 12 | 2,516,215 | 52 | 48,389\
    \ | 74,765 | San Siro, Milan |\n| 15 | 1994 | United States | N. Amer. | top 16\
    \ | 9 / 9 | 3,587,538 | 52 | 68,991 | 94,194 | Rose Bowl, Pasadena, Calif. † |\n\
    | 16 | 1998 | France | Europe | 1st | 10 / 10 | 2,785,100 | 64 | 43,517 | 80,000\
    \ | Stade de France, Saint-Denis † |\n| 17 | 2002 | South Korea & Japan | Asia\
    \ | 4th / top 16 | 10 / 10 | 2,705,197 | 64 | 42,269 | 69,029 | International\
    \ Stadium Yokohama (Japan) |\n| 18 | 2006 | Germany | Europe | 3rd | 12 / 12 |\
    \ 3,359,439 | 64 | 52,491 | 80,000 | Olympiastadion (Berlin) |\n| 19 | 2010 |\
    \ South Africa | Africa | Group | 10 / 9 | 3,178,856 | 64 | 49,670 | 84,490 |\
    \ Soccer City, Johannesburg |\n| 20 | 2014 | Brazil | S. Amer. | 4th | 12 / 12\
    \ | 3,429,873 | 64 | 53,592 | 74,738 | Maracanã Stadium, Rio |\n| | Overall |\
    \ | | | | 37,500,710 | 836 | 44,857 | 171,772 | Maracanã Stadium, Rio (1950) |\n\
    \nFigure 8.1: Table Example\n\nYou can see how information such as year, country\
    \ name, continent, matches etc. have been organized nicely in rows and column\
    \ structure. Does it not make it more readable? I am sure you agree and that is\
    \ what the purpose of table is.\n\n## Learning the Details\n\nBefore we learn\
    \ about table HTML tags, let's study some of the names or definitions related\
    \ to the table.\n\nPlease refer the figure 8.2 to see various definitions related\
    \ to the tables.\n\n![](img/739ece6d965a774f75c4a6632b8b7538_62_0.png)\n\nFigure\
    \ 8.2: Table Definitions\n\n**Row** is the horizontal line in the table. You can\
    \ add as many rows as you want in the table. Row determines the height of the\
    \ table.\n**Column** is the vertical line in the table. Again you can add as many\
    \ columns as you require in your table. Column decides the width of the table.\n\
    **Cell** is the cross section of row and column in the table. Number of cells\
    \ in the table depends on the number of rows and column in the table. You write\
    \ your information in table in the cell only.\n**Header** is a type of cell and\
    \ it is a cell in the **first row** of the table. Generally they describe the\
    \ name of the column in the header cells. In the world cup example above, header\
    \ has text like year, host country, continent, matches which shows type of information\
    \ written in the particular column. Header text is generally shown as bold.\n\n\
    In HTML, tables are defined using `<table>`, `<th>`, `<tr>` and `<td>` tags. The\
    \ `<th>` tag represents header cell. The `<tr>` tag represents row. The `<td>`\
    \ tag represents cell. The `<table>` tag works as container and keeps all these\
    \ tags together.\n\nLet’s map these tags to the table shown in figure 8.2 above.\
    \ The mapping has been presented in the figure 8.3.\n\n![](img/739ece6d965a774f75c4a6632b8b7538_63_0.png)\n\
    \nFigure 8.3: Table Tags Mapping\n\nNumber of `<tr>` tags within `<table>` tag\
    \ defines number of rows in the table. If you want five rows in a table, you add\
    \ five `<tr>` tags inside `<table>` tag.\nSimilarly, number of `<td>` tags within\
    \ `<tr>` tag defines number of cells in the row. You want three 3 cells, you add\
    \ three `<td>` tags within `<tr>` tag.\n`<th>` tag works in the same way as `<td>`\
    \ tag works.\nHeader text is written inside `<th></th>` tags. Cell text is written\
    \ within `<td></td>` tags.\nWith this understanding, let's see the structure of\
    \ table HTML.\n\n```\n<table border=\"width in pixel\">\n    <tr>\n        <th>Header\
    \ Text</th>\n        <th>Header Text</th>\n    </tr>\n    <tr>\n        <td>Cell\
    \ Text</td>\n        <td>Cell Text</td>\n    </tr>\n    <tr>\n        <td>Cell\
    \ Text</td>\n        <td>Cell Text</td>\n    </tr>\n</table>\n```\n\nIf you look\
    \ at the structure, you can relate what I was talking about these different table\
    \ tags in the previous paragraph. The **border** attribute shows the width of\
    \ the table lines in pixel. If you don't provide border value, the table will\
    \ have no lines.\nLet's see an example. Please check the HTML below:\n\n```\n\
    <html>\n```"
