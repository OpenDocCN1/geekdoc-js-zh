    Figure 8.2: Table Definitions


    **Row** is the horizontal line in the table. You can add as many rows as you want
    in the table. Row determines the height of the table.

    **Column** is the vertical line in the table. Again you can add as many columns
    as you require in your table. Column decides the width of the table.

    **Cell** is the cross section of row and column in the table. Number of cells
    in the table depends on the number of rows and column in the table. You write
    your information in table in the cell only.

    **Header** is a type of cell and it is a cell in the **first row** of the table.
    Generally they describe the name of the column in the header cells. In the world
    cup example above, header has text like year, host country, continent, matches
    which shows type of information written in the particular column. Header text
    is generally shown as bold.


    In HTML, tables are defined using `<table>`, `<th>`, `<tr>` and `<td>` tags. The
    `<th>` tag represents header cell. The `<tr>` tag represents row. The `<td>` tag
    represents cell. The `<table>` tag works as container and keeps all these tags
    together.


    Let’s map these tags to the table shown in figure 8.2 above. The mapping has been
    presented in the figure 8.3.'
