    和 **clearbutton**。按钮的显示文本为 **Multiply** 和 **Clear**。


    HTML表单看起来如下图12.4所示：


    ![简单表单](img/739ece6d965a774f75c4a6632b8b7538_91_0.png)


    图12.4：简单表单


    在这个简单的表单中，我们将执行简单的编程以实现以下目标：


    - ✓ **目标1：** 当你在 **Number1** 文本框中输入一个数字，在 **Number2** 文本框中输入另一个数字，然后点击 **Multiply**
    按钮时，它将在 **Result** 文本框中显示两个数字的**乘积**。


    - ✓ **目标2：** 当你点击 **Clear** 按钮时，它将**清除**或说**移除** **Number1**、**Number2** 和 **Result**
    文本框中给出的任何值。


    准备好了！兴奋吗？我们开始吧。


    ## 从控件读取值的JavaScript


    为了能够进行乘法运算，我们需要有某种方法来读取在控件中写入或输入的数字。然后我们才能对这些数字应用一些数学运算。我们如何从控件中读取文本或值？以下是从控件读取值的JavaScript语句：


    ```javascript

    document.getElementById(''control name'').value

    ```


    我确信这个JavaScript语句并没有太大意义。让我们像图12.5所示那样剖析这个语句，以了解更多关于它的信息。


    ![JavaScript语句剖析](img/739ece6d965a774f75c4a6632b8b7538_92_0.png)


    该语句的第一部分是**HTML的主体**。它代表了HTML中`<body>`和`</body>`标签**之间**的所有内容。所有的HTML标签、元素和控件实际上都放置在HTML的主体中。我们在第2章中学习过这一点。


    第二部分是**通过控件名称查找元素**。控件只是一种用于用户输入的HTML标签类型。你在上一章中已经了解了它。你一定已经看到我们在Id属性中提供了**控件名称**。此属性用于在HTML主体内单独标识控件。就像你的名字或学号是你在班级中的唯一标识符一样。在这第二部分中，我们说的是在HTML主体内查找一个名为“control
    name”的控件。


    最后一部分说，既然你已经在HTML主体内找到了该控件，就去**读取该控件的值**。


    用简单的英语来说，这个JavaScript语句的意思是**“在HTML主体内查找一个名为‘control name’的控件并读取其值”**。哇，看起来如此复杂的JavaScript竟然有如此简单的含义。


    JavaScript语言区分大小写。这意味着你需要像此处语句所示那样，注意每个大写和小写字母来编写语句。如果你全部用小写字母、大写字母或以其他方式混合书写，那么它将无法工作并抛出错误。


    因此，如果我需要读取前面所示HTML中名为 **number1** 的文本框控件的值，你的JavaScript语句将如下所示：


    ```javascript

    document.getElementById(''number1'').value

    ```


    ## 向控件写入值的JavaScript


    现在我们知道了如何从控件读取值，让我们也学习如何向控件写入值？毕竟，number1和number2的乘积必须写入名为result的控件中。这意味着乘积值必须写入result控件。


    我们将借助**数学代数**来实现这一点。你们一定都学过代数中的**表达式**。看看这里的这个表达式问题：


    > “将值5写入项x并表示为一个表达式”


    你一定已经多次解决过这类问题。这是小菜一碟，对吧？表达式会是什么样子？


    ```

    x = 5

    ```


    很简单。现在让我用我们的HTML方式来改变问题陈述。


    > “将值5写入文本框控件result并表示为一个表达式”


    新的表达式将非常相似：


    ```javascript

    document.getElementById(''result'').value = 5

    ```


    同样简单。我所做的就是通过其标识名称找到result控件，然后向其写入值5。与上面的项表达式完全类似。**这是另一个用于向控件写入某个值的JavaScript语句。**


    ## 执行数学运算的JavaScript


    我们现在知道了JavaScript中的读取和写入语句。我们现在将专注于number1和number2的乘法。代数表达式将再次帮助我们。


    看看这里的另一个表达式问题：


    > “有三个项 – x、y和z。编写一个表达式，将项x和y相乘，并将乘积结果赋值给项z”


    问题有点长，但同样简单。现在的表达式会是什么样子？


    ```

    z = x * y

    ```


    (*) 是计算机中的乘法符号。类似地，(+)、(-) 和 (/) 分别是加法、减法和除法的符号。


    让我再次用我们的HTML方式来改变问题陈述：


    > “有三个文本框控件 – number1、number2和result。编写一个表达式，将number1和number2控件的值相乘，并将乘积结果作为值赋给控件result”


    使用与上面相同的语句，在HTML控件上下文中的表达式将如下所示：


    ```javascript

    document.getElementById(''result'').value = document.getElementById(''number1'').value
    * document.getElementById(''number2'').value

    ```


    这是将两个控件的值相乘并赋值给第三个控件的JavaScript语句。类似地，你可以为减法、加法和除法编写JavaScript语句。只有运算符号会从 (*)
    变为 (+)、(-) 或 (/)。


    让我们继续。如果有多个JavaScript语句怎么办？我们如何编写它们？如果有多个JavaScript语句，那么我们用分号 (;) 将它们分隔开。看看下面的例子：


    ```javascript

    document.getElementById(''number1'').value = 5; document.getElementById(''number2'').value
    = 5

    ```


    有两个JavaScript语句彼此相邻，但用分号 (;) 分隔。


    ## JavaScript事件


    现在，在我们将所有内容整合到一个网页中之前，最后要学习一件事。让我再次展示本节开头分享的HTML对应的第一个目标。它在下面的图12.6中呈现。


    - **目标1：** 当你在 **Number1** 文本框中输入一个数字，在 **Number2** 文本框中输入另一个数字，然后**点击Multiply按钮**时，它将在
    **Result** 文本框中**显示两个数字的乘积**。


    *图12.6：目标1*


    我已经高亮了我现在要讨论的区域。目标是在**有人点击Multiply按钮时**，在result控件中显示number1和number2的乘积。JavaScript编程如何知道有人点击了按钮？


    JavaScript编程中的此类事情由一个称为“**事件**”的术语管理。有各种类型的事件，它们在发生某些特殊情况时触发或发生。例如，在我们的例子中，按钮控件将有一个名为
    **onclick** 的事件，当有人点击按钮时触发。类似于onclick，还有许多其他事件，如onfocus、onblur等。我不会深入细节，因为你需要更多关于编程的知识才能完全理解它。


    回到 **onclick** 事件。以下是onclick JavaScript语句的外观：


    ```javascript

    onclick="JavaScript Programming Statements"

    ```


    如前所述，此事件在有人点击按钮时发生。当此事件发生时，它将执行提供给它的JavaScript编程语句。JavaScript语句可以是任何内容 – 读取、写入或执行我们之前学到的操作。


    例如，看看下面的例子：


    ```javascript

    onclick = "document.getElementById(''number1'').value = 5; document.getElementById(''number2'').value
    = 5"

    ```


    在上面的JavaScript语句中，当onclick事件发生时，它将执行两个JavaScript语句，这两个语句将值5写入number1和number2控件。


    我如何告诉HTML这个onclick事件是针对这个按钮的？你通过在按钮控件标签中添加onclick事件来实现。以下是示例：


    ```html

    <input type="button" id="control name" onclick=" JavaScript Programming Statements"
    ></input>

    ```

    '
