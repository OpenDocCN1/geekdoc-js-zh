    # CHAPTER 10


    # Chapter 10 –Using Iframe


    You learnt about styles in the previous chapter. You now know how to change background,
    color, font or font size to make your web page look elegant. Just pour in your
    creativity and create a master piece web pages using styles.

    In this chapter, we are going to discuss a very interesting topic. What if you
    want to show Wikipedia web page inside your own web page? Yes, you read it right.
    You are not going to create a Wikipedia web page, but will show that page inside
    your web page. You can achieve this using **Iframe** tags.

    Showing other web pages inside your page is sometimes very useful when you simply
    want to make use of some other web site inside your web page. You don’t want to
    recreate the other’s pages but reuse it for your purpose.

    Interesting, right?


    # Examples of Iframe


    We will go to University of Michigan web page to see an example of Iframe. Please
    go to the web site - [http://sitemaker.umich.edu/iframe.example/the__iframe__lives_here](http://sitemaker.umich.edu/iframe.example/the__iframe__lives_here)
    . You see Iframe as shown in figure 10.1 below.'
- md: '## CHAPTER 10


    ![Figure 10.1: Iframe Example](img/739ece6d965a774f75c4a6632b8b7538_73_0.png)


    You can see that there is a web page open in browser. And then you have another
    web page open inside the browser web page. You can perform any action on this
    inside web page like click, navigate, enter data etc. The inside web page is real
    and live.


    ## Learning the Details


    How we achieve what has been shown in the example above? The `<iframe>` tag is
    used for this purpose. Please check the structure of `<iframe>` tag below:


    ```

    <iframe src="address of inside web page" width="width in pixel" height="height
    in pixel"></iframe>

    ```


    We start and close `<iframe>` tags and use attribute to provide address of the
    inside web page.


    **Src** stands for **source**. We provide the address of the inside web page in
    this attribute. Please what recall we discussed providing address in **href**
    attribute for `<a>` tag and in **src** attribute in `<img>` tag? This is also
    similar to that. You provide the address of the web page or web site which you
    want to put inside Iframe.


    **Width** is the width of the inside web page when shown. It is measured in pixel.

    **Height** is the height of the inside web page and it is also measured in pixel.


    Let’s create a web page which shows Wikipedia page inside. The HTML of the web
    page will look like following:


    ```

    <html>

    <head>

    <title>Learning Iframe</title>

    </head>

    <body>

    <h1>Learn IFrame in HTML </h1>


    <iframe src="https://en.wikipedia.org/wiki/Main_page" width="600" height="600"></iframe>


    </body>

    </html>

    ```


    The web page will be shown as in the figure 10.2 below.


    ![Figure 10.2: Wikipedia in Iframe HTML Display](img/739ece6d965a774f75c4a6632b8b7538_75_0.png)


    Wow, you have just shown Wikipedia page inside your page. Simple and Awesome!

    Many web sites don''t like and don''t allow themselves to be put inside Iframe.
    Google web site is an example of that. We should respect their decision and try
    not to use their web sites in Iframe.


    ## Try it yourself


    Exercise time. We will create a web page named **My Search** which will show Bing
    search and Wikipedia search both in web sites inside My Search web page. Well,
    I wanted to use Google and Yahoo search as well but they don''t support Iframe
    and I totally respect that.

    Your web page will look like as shown in figure 10.3.


    ![Figure 10.3](img/739ece6d965a774f75c4a6632b8b7538_76_0.png)


    Please go ahead and play with both inside web pages. They will allow you to do
    everything.

    Here are the details to create the web page.

    Address of Bing search is: [https://www.bing.com/](https://www.bing.com/)

    Address of Wikipedia search is: [http://en.wikipedia.org/wiki/Searching](http://en.wikipedia.org/wiki/Searching)

    Height is 300 and width is 1000 for both Iframes.


    Following are the guidelines to perform this exercise:


    - Open Notepad

    - Create HTML using heading and Iframe tags. You will need two Iframe tags to
    show two web sites. The address of the web sites has been given in the earlier
    paragraph.

    - Save the HTML file using .htm or .html extension

    - Open the HTML file using web browser to see the result.


    If you need any help, please check **Exercise 8 – My Search** chapter to find
    HTML for the web page above. Best of luck!


    ## Summary


    That finishes using Iframe. You have learnt so many tags and styling methods in
    the previous chapters. Are you getting some ideas to put them together to make
    a fantastic web page? If so, I would say who is stopping you? Rock on! Keep reading...


    ## CHAPTER 11


    ## Chapter 11 – Forms and Controls


    In the chapters so far, we mostly read about how to show information on web page
    or how to use links or how to make pages look beautiful. We will now focus on
    building a web page where people can type some information or able to select some
    choices using their keyword and mouse on the web pages. We generally call such
    activities of the people as **user inputs**.


    We all have seen examples of user inputs on various web sites. For example, on
    Google site when you type search text and press search button, that is a type
    of user input. Similarly when you or your parents go to online booking web sites
    and book for hotel or flights by typing start date, end date, number of people
    etc. that is also a type of user input.


    **Forms and Controls** are used to create such user inputs. **Form** is like a
    container (just like table was container earlier for `<tr>` and `<td>` tags) and
    **Controls** are individual user inputs. When I say container, it is similar to
    a book which is container for pages. A book contains one or more pages. Similarly,
    a form contains one or more controls. Not making much sense? Right? No worries,
    lets understand it again in the examples in the next section.


    This chapter and next chapter are closely related to each other. In current chapter
    you learn about designing forms while in next chapter you learn how to make use
    of user inputs to perform some business actions. For instance, on Google site,
    when I enter search text and press search button, the site responds back with
    search results. Providing these search results is business action for the Google
    site. Similarly, booking hotel or flight tickets based on people user inputs is
    another example of business action.


    ## Examples of Forms and Controls


    Let’s start with the first example we discussed. Please go to Google site ([https://www.google.co.uk/](https://www.google.co.uk/))
    as shown in figure 11.1.


    ![Figure 11.1: Google Site Form Example](img/739ece6d965a774f75c4a6632b8b7538_79_0.png)


    You can see in this simple web page, there are three controls – a place to enter
    search text, two buttons to click. And all three controls are inside a form. Didn’t
    I say that Form is container which contains one or more controls? People provide
    user input to these controls such as typing a text, selecting from choices or
    clicking on a button. Each control is a way for people to provide some kind of
    input.


    To emphasize this idea, let’s see another example. Please open http://www.booking.com/
    web site as shown in figure 11.2.


    ![Figure 11.2: Booking Site Form Example](img/739ece6d965a774f75c4a6632b8b7538_80_0.png)


    This is another example where you have one form containing more than 5-6 controls.
    You see some more types of control in the figure 11.2 above such as ability to
    select dates of stay, selecting choices between Work and Leisure.


    HTML comes with various types of controls. We will learn about them in the remaining
    chapter.


    On a single web page, you can have more than one forms. And each form can have
    their own set of controls.


    ## Learning the Details


    You now understand the concept of form and controls. There are various types of
    control available in HTML. But for this book, we will focus on some important
    ones which are generally used in designing web pages.


    The table below shows different types of control in HTML, the purpose of the controls
    and how they look.


    Table 11.1: Types of Control


    | Control Type | Purpose | How it looks? |

    |---|---|---|

    | Textbox | Allows to type single line of text | `<input type="text">` |

    | Text Area | Allows to type multiple lines of text | `<textarea></textarea>`
    |

    | Checkbox | Allows to select multiple options from the given choices. | ☑ Option1<br>☐
    Option2<br>☑ Option3 |

    | Radio | Allows to select only one option from the given choices. | ○ Option1<br>●
    Option2<br>○ Option3 |

    | Button | Allows to click on a button to perform some action | `<button>Button</button>`
    |

    | Select | Allows to select one option from multiple drop down choices. | `<select><option>Option1</option><option>Option2</option><option>Option3</option><option>Option4</option></select>`
    |


    Time to learn how each of these individual controls work – what tags they use
    and what attributes are useful?


    Most of the controls use the same tag `<input>`. It is the **type** attribute
    value of `<input>` tag which is different based on what control you are using.
    Simple Enough.'
