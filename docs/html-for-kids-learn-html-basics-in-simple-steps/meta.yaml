  mdcn: "\n## 第六章\n\n让我向你展示如何在HTML中显示图片。我将使用上表中给出的阿尔伯特·爱因斯坦的图片地址，并在我的HTML页面中显示它。我会将高度设为200像素，宽度也设为200像素，就像一个正方形。HTML代码如下所示：\n\
    \n```html\n<html>\n<head>\n<title></title>\n</head>\n<body>\n<h2>Albert Einstein</h2>\n\
    <img src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Einstein_1921_by_F_Schmutzer_-_restoration.jpg/220px-Einstein_1921_by_F_Schmutzer_-_restoration.jpg\"\
    \ alt=\"Albert Einstein\" width=\"200\" height=\"200\">\n</body>\n</html>\n```\n\
    \n该HTML页面将显示为下面图6.2所示的样子。\n\n## 阿尔伯特·爱因斯坦\n\n![](img/739ece6d965a774f75c4a6632b8b7538_49_0.png)\n\
    \n图6.2：网页显示效果\n\n你可以看到，它按照我在`<img>`标签属性中指定的尺寸，以正方形（200 x 200）显示了图片。\n\n如果图片出了问题会怎样？例如，你给了图片一个错误的地址。一旦出现问题，网页将显示为图6.3所示的样子。我建议你自己动手试试。\n\
    \n![](img/739ece6d965a774f75c4a6632b8b7538_50_0.png)\n\n图6.3：图片问题\n\n你观察得很对。它显示了在`<img>`标签属性中定义的**替代文本**，而不是图片。\n\
    让我们继续前进！那么，将图片用作超链接怎么样？听起来很棒！对吧？下面是超链接标签的结构（回顾上一章）：\n\n```html\n<a href=\"网页地址\"\
    > 超链接文本 </a>\n```\n\n要将图片设为超链接，你需要用`<img>`标签替换**超链接文本**。例如，如果我想将阿尔伯特·爱因斯坦的图片设为超链接，点击后跳转到维基百科页面，那么我的HTML\
    \ `<a>`标签将如下所示：\n\n```html\n<a href=\"https://en.wikipedia.org/wiki/Albert_Einstein\"\
    >\n  <img src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Einstein_1921_by_F_Schmutzer_-_restoration.jpg/220px-Einstein_1921_by_F_Schmutzer_-_restoration.jpg\"\
    \ alt=\"Albert Einstein\" width=\"200\" height=\"200\">\n</a>\n```\n\n这不是很简单直观吗？我相信你会同意我的看法。\n\
    \n### 自己动手试试\n\n是时候用一些图片来点亮网页了。今天，我给你布置一个练习，你将使用标题标签、段落标签以及图片标签。制作一个**艾萨克·牛顿网页**，使其看起来像图6.4。\n\
    \n![](img/739ece6d965a774f75c4a6632b8b7538_51_0.png)\n\n图6.4：用于练习的图片页面\n\n请使用此URL（https://upload.wikimedia.org/wikipedia/commons/thumb/3/39/GodfreyKneller-IsaacNewton-1689.jpg/220px-GodfreyKneller-IsaacNewton-1689.jpg）在练习中显示牛顿爵士的图片。我希望高度为200像素，宽度为150像素。\n\
    \n以下是进行此练习的指南：\n\n-   打开记事本\n-   使用标题、图片和段落标签创建HTML。图片的地址或位置已在前面的段落中提供。在`<img>`标签中提供图片的高度和宽度。在段落标签中编写关于牛顿爵士的文本。\n\
    -   使用.htm或.html扩展名保存HTML文件\n-   使用网页浏览器打开HTML文件以查看结果。\n\n如果你需要任何帮助，请查看**练习4 –\
    \ 艾萨克·牛顿**章节，以找到上述网页的HTML代码。祝你好运！\n\n## 总结\n\n太棒了，你又完成了一章。希望你喜欢它。我喜欢网页上的图片和超链接，因为它们使网站变得如此互动和生动。希望你也有同感。继续阅读...\n\
    \n## 第七章\n\n## 第七章 – 列表\n\n欢迎！希望你喜欢在上一章中玩转图片。那很迷人，不是吗？让我们回到创意写作上来。好的，告诉我，你的英语老师说过多少次，如果你有多个选项可以写，使用要点列表可以使内容更突出、更清晰。将你的选项写成要点列表，可使其更具可读性和表现力。\n\
    \n**列表**在HTML中用于在网页上创建基于要点的文本。目的相同，让你的写作更突出、更具可读性和表现力。\n\n让我们来学习一下。\n\n### 列表示例\n\
    \n我们将再次使用维基百科来查看列表的示例。请访问维基百科的以下页面 - [https://en.wikipedia.org/wiki/Main_Page](https://en.wikipedia.org/wiki/Main_Page)。你可以看到列表在下面图7.1中被高亮标记。\n\
    \n![](img/739ece6d965a774f75c4a6632b8b7538_54_0.png)\n\n你可以看到网页上有三个列表或要点文本，用于显示新闻、当天的重要事件和一些事实。要点文本使页面更具可读性和条理性。\n\
    \n是时候学习细节了。\n\n### 学习细节\n\nHTML中存在三种类型的列表。下表列出了它们的名称并展示了它们的外观：\n\n表7.1：HTML中的列表类型\n\
    \n| 类型 | 用途 | 外观 |\n| :--- | :--- | :--- |\n| 无序列表 | 显示标记为要点的文本行 | • 第一章<br>•\
    \ 第二章<br>• 第三章<br>• 第四章 |\n| 有序列表 | 显示标记有数字、字母或罗马数字的文本行 | 1. 第一章<br>2. 第二章<br>3.\
    \ 第三章<br>4. 第四章 |\n| 描述列表 | 显示为有序列表，并提供每个文本行的描述。当你想在列表中同时提供简短文本行和详细描述时，这尤其重要。\
    \ | 第一章 - 简介<br>第二章 - \"你好\" HTML<br>第三章 - 什么是元素和属性？<br>第四章 - 标题和段落 |\n\n如果你回顾上面给出的维基百科页面示例，维基百科页面显示的是**无序列表。**\n\
    让我们详细看看每种类型的列表。我们将从无序列表开始。我们使用`<ul>`和`<li>`标签来创建无序列表。以下是这些标签的结构。\n\n```html\n\
    <ul>\n    <li>文本行一</li>\n    <li>文本行二</li>\n    <li>文本行三</li>\n    <li>文本行四</li>\n\
    </ul>\n```\n\n**UL** 代表 **无序列表**。**LI** 代表 **列表项**。你在`<li>`标签下提供各个文本行项目。然后将`<li>`标签列在`<ul>`标签下。你可以根据需要添加任意数量的`<li>`项目。\n\
    上面表格中显示示例的HTML是什么？如图7.2所示。\n\n![](img/739ece6d965a774f75c4a6632b8b7538_55_0.png)\n\
    \n很简单，不是吗？\n让我们看看有序列表。以下是有序列表标签的结构：\n\n```html\n<ol>\n    <li>文本行一</li>\n    <li>文本行二</li>\n\
    \    <li>文本行三</li>\n    <li>文本行四</li>\n</ol>\n```\n\n多么可预测！顺便说一下，**OL** 代表 **有序列表**。**LI**\
    \ 具有相同的名称和用途。\n让我们看看上面表格中给出的有序列表示例的HTML是什么样子。如图7.3所示。\n\n![](img/739ece6d965a774f75c4a6632b8b7538_56_0.png)\n\
    \n在上面的示例中，我们使用了数字（1, 2, 3...）来显示顺序。你也可以选择使用字母或罗马数字。你需要在**`<ol>`**标签中使用**type**属性来决定使用哪种选择。下表显示了type属性的示例。\n\
    \n表7.2：Type属性示例\n\n| 类型示例 | 外观 |\n| :--- | :--- |\n| `<ol type=\"1\"><li>第一章</li><li>第二章</li><li>第三章</li><li>第四章</li></ol>`\
    \ | 1. 第一章<br>2. 第二章<br>3. 第三章<br>4. 第四章 |\n| `<ol type=\"A\"><li>第一章</li><li>第二章</li><li>第三章</li><li>第四章</li></ol>`\
    \ | A. 第一章<br>B. 第二章<br>C. 第三章<br>D. 第四章 |\n| `<ol type=\"a\"><li>第一章</li><li>第二章</li><li>第三章</li><li>第四章</li></ol>`\
    \ | a. 第一章<br>b. 第二章<br>c. 第三章<br>d. 第四章 |\n| `<ol type=\"I\"><li>第一章</li><li>第二章</li><li>第三章</li><li>第四章</li></ol>`\
    \ | I. 第一章<br>II. 第二章<br>III. 第三章<br>IV. 第四章 |\n| `<ol type=\"i\"><li>第一章</li><li>第二章</li><li>第三章</li><li>第四章</li></ol>`\
    \ | i. 第一章<br>ii. 第二章<br>iii. 第三章<br>iv. 第四章 |\n\n简单但功能强大。\n\n最后，让我们来学习**描述列表**。以下是描述列表标签的结构：\n\
    \n```html\n<dl>\n    <dt>简短文本一</dt>\n        <dd>文本一的详细描述</dd>\n    <dt>简短文本二</dt>\n\
    \        <dd>文本二的详细描述</dd>\n    <dt>简短文本三</dt>\n        <dd>文本三的详细描述</dd>\n  \
    \  <dt>简短文本四</dt>\n        <dd>文本四的详细描述</dd>\n</dl>\n```\n"
