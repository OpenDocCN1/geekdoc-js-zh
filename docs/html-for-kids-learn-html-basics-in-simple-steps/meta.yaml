    \n## 第九章\n\n## 第九章 – 页面样式\n\n你在前面的章节中已经学习了 HTML 的大部分基础标签。你了解何时使用哪个标签以及用于什么目的。你可以将所有这些标签组合起来制作一个漂亮的网页。\n\
    \n我们还没有学习的是如何装饰标签？如何让它们变得五颜六色、大小各异或使用不同字体等？**样式**在 HTML 中用于装饰目的。样式就像是网页的化妆。你可以选择你的颜色、背景、阴影、线条，使页面更加美观和吸引人。\n\
    \n样式方法有很多。但本章我们将学习一些基础的。你将对如何使用样式有一个很好的了解，然后你可以通过进一步学习探索其他样式方法。准备好为你的网页上色吧！我们开始。\n\
    \n## 样式示例\n\n嗯，没有确切的样式样本，因为每个页面都有样式——有些多，有些少。让我们看看 **Butlin's** 的网页，看看他们是如何使用样式为页面上色的。对于那些不知道\
    \ Butlin's 是什么的人，他们为儿童和家庭提供度假胜地。请访问以下网页 - [http://www.butlins.com/](http://www.butlins.com/)\
    \ 并查看如下图 9.1 所示的样式。\n\n![](img/739ece6d965a774f75c4a6632b8b7538_67_0.png)\n\n\
    看，样式是如何被用来装饰网页的。它们看起来如此美丽和诱人。我想你已经对样式意味着什么有了概念。让我们详细学习它们。\n\n## 学习细节\n\n样式通过一个名为\
    \ **style** 的标签属性来应用。此属性可用于任何标签。它具有以下结构：\n\n```\nstyle=\"property: value; property:\
    \ value\"\n```\n\n**属性** 意味着你想使用什么样式。**值** 意味着你选择了什么样式值；你希望你的页面或标签看起来如何。不太明白。好的，让我们看看下面的表格，其中列出了一些常见的样式名称、值及其用途。这对你来说就完全有意义了。\n\
    \n表 9.1：常用样式\n\n| 样式属性 | 样式值 | 用途 |\n|---|---|---|\n| background-color | 红色、绿色、灰色，任何颜色\
    \ | 用于绘制网页的背景颜色 |\n| color | 红色、绿色、灰色，任何颜色 | 用于绘制文本或超链接的颜色 |\n| font-family |\
    \ Verdana、Courier、Arial 等 | 决定使用哪种文本字体。 |\n| font-size | 10 / 5 / 20 任何值 | 以像素为单位设置文本或超链接的大小\
    \ |\n| text-align | 左、居中、右 | 将文本、超链接或图像左对齐、居中或右对齐。 |\n\n你可以使用多个样式属性，但它们应该用 **分号**\
    \ [;] 分隔。属性和值之间用 **冒号** [:] 分隔。\n让我们看一个如图 9.2 所示的例子。让我们制作一个带有标题标签但没有样式的页面。\n\n\
    ```html\n<html>\n<head>\n<title>Style Example</title>\n</head>\n<body>\n<h2>I\
    \ am a heading.</h2>\n</body>\n</html>\n```\n\n![](img/739ece6d965a774f75c4a6632b8b7538_68_0.png)\n\
    \n*图 9.2：无样式的标题标签*\n\n现在，我们将添加样式，使标题标签看起来是红色的，如图 9.3 所示。\n\n```html\n<html>\n\
    <head>\n<title>Style Example</title>\n</head>\n<body>\n<h2 style=\"color:red\"\
    >I am a heading.</h2>\n</body>\n</html>\n```\n\n![](img/739ece6d965a774f75c4a6632b8b7538_68_1.png)\n\
    \n*图 9.3：红色标题标签*\n\n你可以看到我在 **<h2>** 标签中添加了 **style** 属性，属性为 **color**，值为 **red**。当我这样做时，它将\
    \ `<h2>` 标签的文本从黑色变成了红色。这就是样式的美妙之处。\n\n让我们将 `<h2>` 文本的字体更改为 **Arial**，如图 9.4 所示。\n\
    \n```html\n<html>\n<head>\n<title>Style Example</title>\n</head>\n<body>\n<h2\
