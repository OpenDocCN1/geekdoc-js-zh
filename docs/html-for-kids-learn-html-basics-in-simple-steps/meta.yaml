    # CHAPTER 11


    # Textbox Control


    Let’s start with **textbox** type control. It is used to type single line of text
    or sentence. Following is the example of textbox type control tag:


    ```

    <input type="text" id="control name"></input>

    ```


    You can see it uses <input> tag and **type** attribute value is “**text**” to
    tell it is textbox type control. **Id** stands for **identifier** and this attribute
    is used to keep a name for the control. Just like, teacher takes your name among
    other students in the class to find you. The Id attribute value can be used to
    find the control uniquely among other controls. We will learn the use of Id attribute
    more in the next chapter.


    # Checkbox and Radio Controls


    The next type of controls are **checkbox** and **radio**. They are used to select
    options from multiple choices given. The following are the tags of these controls:


    ```

    <input type="checkbox" id="control name" >Option1</input>

    <input type="radio" id="control name" >Option1</input>

    ```


    Both again use <input> tags but their type attribute values are **checkbox** and
    **radio**. **Option1** is the display text of the choice shown on the web page.
    Since, using these controls, you provide multiple choices on the web page, you
    generally add more than one checkbox or radio controls to show multiple choices.
    You will see an example of this very soon.


    # Button Control


    Moving on, the following is the tag structure for **button** type control.


    ```

    <input type="button" value="Button" id="control name" ></input>

    ```


    The type attribute value is **button**. The text in the **value** attribute is
    the display text of the button shown on the web page.


    # Textarea Control


    Let’s see controls which do not use <input> tag. We will start with the **textarea**
    control. Here is how the tag looks like:


    ```

    <textarea id="control name" rows="10" cols="30"></textarea>

    ```'
