    ## 第10章


    ![图10.1：Iframe示例](img/739ece6d965a774f75c4a6632b8b7538_73_0.png)


    你可以看到浏览器中打开了一个网页。然后在这个浏览器网页内部，又打开了另一个网页。你可以对这个内部网页执行任何操作，比如点击、导航、输入数据等。这个内部网页是真实且活跃的。


    ## 学习细节


    我们如何实现上面示例中展示的效果？`<iframe>`标签就是用于此目的。请查看下面`<iframe>`标签的结构：


    ```

    <iframe src="内部网页的地址" width="像素宽度" height="像素高度"></iframe>

    ```


    我们开始和结束`<iframe>`标签，并使用属性来提供内部网页的地址。


    **Src**代表**源**。我们在此属性中提供内部网页的地址。请回想一下我们在`<a>`标签的**href**属性和`<img>`标签的**src**属性中讨论过提供地址的方式吗？这与之类似。你提供想要放入Iframe中的网页或网站的地址。


    **Width**是内部网页显示时的宽度，以像素为单位。

    **Height**是内部网页的高度，同样以像素为单位。


    让我们创建一个在内部显示维基百科页面的网页。该网页的HTML将如下所示：


    ```

    <html>

    <head>

    <title>学习Iframe</title>

    </head>

    <body>

    <h1>在HTML中学习IFrame</h1>


    <iframe src="https://en.wikipedia.org/wiki/Main_page" width="600" height="600"></iframe>


    </body>

    </html>

    ```


    该网页将如下面的图10.2所示。


    ![图10.2：Iframe HTML显示中的维基百科](img/739ece6d965a774f75c4a6632b8b7538_75_0.png)


    哇，你刚刚在你的页面中展示了维基百科页面。简单又棒！

    许多网站不喜欢也不允许自己被放入Iframe中。谷歌网站就是一个例子。我们应该尊重他们的决定，尽量不要在Iframe中使用他们的网站。


    ## 自己动手试试


    练习时间。我们将创建一个名为**我的搜索**的网页，该网页将在“我的搜索”网页内部同时显示必应搜索和维基百科搜索网站。嗯，我本想也使用谷歌和雅虎搜索，但它们不支持Iframe，我完全尊重这一点。

    你的网页将如图10.3所示。


    ![图10.3](img/739ece6d965a774f75c4a6632b8b7538_76_0.png)


    请继续操作并尝试这两个内部网页。它们将允许你执行所有操作。

    以下是创建该网页的详细信息。

    必应搜索的地址是：[https://www.bing.com/](https://www.bing.com/)

    维基百科搜索的地址是：[http://en.wikipedia.org/wiki/Searching](http://en.wikipedia.org/wiki/Searching)

    两个Iframe的高度均为300，宽度均为1000。


    以下是执行此练习的指南：


    - 打开记事本

    - 使用标题和Iframe标签创建HTML。你需要两个Iframe标签来显示两个网站。网站的地址已在前面的段落中给出。

    - 使用.htm或.html扩展名保存HTML文件

    - 使用网页浏览器打开HTML文件以查看结果。


    如果你需要任何帮助，请查看**练习8 – 我的搜索**章节，以找到上述网页的HTML。祝你好运！


    ## 总结


    至此，Iframe的使用就结束了。你在前面的章节中已经学习了许多标签和样式方法。你是否开始有了一些将它们组合起来制作一个精彩网页的想法？如果是这样，我要说，谁在阻止你？放手去做吧！继续阅读...


    ## 第11章


    ## 第11章 – 表单与控件


    到目前为止，在前面的章节中，我们主要学习了如何在网页上显示信息，或者如何使用链接，或者如何使页面看起来更美观。现在，我们将专注于构建一个网页，让人们可以在网页上输入一些信息，或者使用他们的键盘和鼠标选择一些选项。我们通常将人们的此类活动称为**用户输入**。


    我们都在各种网站上见过用户输入的例子。例如，在谷歌网站上，当你输入搜索文本并按下搜索按钮时，这就是一种用户输入。同样，当你或你的父母访问在线预订网站，通过输入开始日期、结束日期、人数等来预订酒店或航班时，这也是一种用户输入。


    **表单与控件**用于创建此类用户输入。**表单**就像一个容器（就像之前表格是`<tr>`和`<td>`标签的容器一样），而**控件**是单个的用户输入项。当我说容器时，它类似于一本书是页面的容器。一本书包含一页或多页。同样，一个表单包含一个或多个控件。听起来不太明白，对吧？别担心，我们将在下一节的示例中再次理解它。


    本章和下一章密切相关。在本章中，你将学习设计表单，而在下一章中，你将学习如何利用用户输入来执行一些业务操作。例如，在谷歌网站上，当我输入搜索文本并按下搜索按钮时，网站会返回搜索结果。提供这些搜索结果就是谷歌网站的业务操作。同样，根据用户的输入预订酒店或机票是业务操作的另一个例子。


    ## 表单与控件的示例


    让我们从我们讨论的第一个例子开始。请访问谷歌网站（[https://www.google.co.uk/](https://www.google.co.uk/)），如图11.1所示。


    ![图11.1：谷歌网站表单示例](img/739ece6d965a774f75c4a6632b8b7538_79_0.png)


    你可以在这个简单的网页中看到，有三个控件——一个输入搜索文本的地方，两个可点击的按钮。并且所有三个控件都在一个表单内。我是不是说过表单是包含一个或多个控件的容器？人们向这些控件提供用户输入，例如输入文本、从选项中选择或点击按钮。每个控件都是人们提供某种输入的一种方式。


    为了强调这个想法，让我们看另一个例子。请打开http://www.booking.com/网站，如图11.2所示。


    ![图11.2：预订网站表单示例](img/739ece6d965a774f75c4a6632b8b7538_80_0.png)


    这是另一个例子，其中有一个表单包含超过5-6个控件。你在上面的图11.2中看到了更多类型的控件，例如选择入住日期、在工作和休闲之间选择选项的能力。


    HTML提供了各种类型的控件。我们将在本章的剩余部分学习它们。


    在一个网页上，你可以有多个表单。每个表单可以拥有自己的一组控件。


    ## 学习细节


    你现在理解了表单和控件的概念。HTML中有各种类型的控件可用。但对于本书，我们将重点介绍一些在网页设计中常用的重要控件。


    下表显示了HTML中不同类型的控件、控件的用途以及它们的外观。


    表11.1：控件类型


    | 控件类型 | 用途 | 外观 |

    |---|---|---|

    | 文本框 | 允许输入单行文本 | `<input type="text">` |

    | 文本区域 | 允许输入多行文本 | `<textarea></textarea>` |

    | 复选框 | 允许从给定选项中选择多个选项。 | ☑ 选项1<br>☐ 选项2<br>☑ 选项3 |

    | 单选按钮 | 允许从给定选项中仅选择一个选项。 | ○ 选项1<br>● 选项2<br>○ 选项3 |

    | 按钮 | 允许点击按钮以执行某些操作 | `<button>按钮</button>` |

    | 下拉选择 | 允许从多个下拉选项中选择一个选项。 | `<select><option>选项1</option><option>选项2</option><option>选项3</option><option>选项4</option></select>`
    |


    现在是时候学习这些单独的控件是如何工作的了——它们使用什么标签，哪些属性是有用的？


    大多数控件使用相同的标签`<input>`。根据你使用的控件不同，`<input>`标签的**type**属性值也不同。很简单。

    '
