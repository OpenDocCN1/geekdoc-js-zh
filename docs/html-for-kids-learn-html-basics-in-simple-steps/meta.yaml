    \ in some of your web sites. Till then, keep reading...\n\n## CHAPTER 9\n\n##\
    \ Chapter 9 – Styles on Page\n\nYou have learnt most of the fundamental tags in\
    \ HTML in the previous chapters. You understand when to use which tag and for\
    \ what purpose. You can put all these tags together to make a nice web page.\n\
    \nWhat we have not learnt is how to decorate the tags? How to make them colorful\
    \ or of various size or of different font etc.? **Styles** are used in HTML for\
    \ decoration purpose. Styles are like make-up of the web pages. You can choose\
    \ your color, back ground, shades, lining to make the page more beautiful and\
    \ attractive.\n\nThere are so many styling methods. But we will learn some fundamental\
    \ ones in this chapter. You will get a good idea about how to use styles and then\
    \ you can explore other styling methods through further studies. Ready to color\
    \ your web page! Here we go.\n\n## Examples of Styles\n\nWell, there is no exact\
    \ sample of styles because every page does styles – some do more and some do less.\
    \ Let’s see the web page of **Butlin’s** and see how they have used styles to\
    \ color their page. For those who don’t know what Butlin’s is, they offer holiday\
    \ resorts for the kids and families. Please go to the following web page - [http://www.butlins.com/](http://www.butlins.com/)\
    \ and check styles as shown in figure 9.1 below.\n\n![](img/739ece6d965a774f75c4a6632b8b7538_67_0.png)\n\
    \nSee, how styles have been used to decorate the web page. They look so beautiful\
    \ and inviting. I think you have got an idea of what style means. Let’s study\
    \ them in detail.\n\n## Learning the Details\n\nStyles are applied using a tag\
    \ attribute called **style**. This attribute can be used with any tag. It has\
    \ the following structure:\n\n```\nstyle=\"property: value; property: value\"\n\
    ```\n\n**Property** means what style you want to use. **Value** means what style\
    \ value you have chosen; how you want your page or tag to look. Not making much\
    \ sense. Ok, let check the table below of some common style names, values and\
    \ their purpose. It will then make perfect sense to you.\n\nTable 9.1: Common\
    \ Used Styles\n\n| Style Property | Style Value | Purpose |\n|---|---|---|\n|\
    \ background-color | Red or Green or Grey, any color | Used to paint background\
    \ color of the web page |\n| color | Red or Green or Grey, any color | Used to\
    \ paint color the text or hyperlink |\n| font-family | Verdana, Courier, Arial\
    \ etc. | Decides which text font to use. |\n| font-size | 10 / 5 / 20 any value\
    \ | Set the size of text or hyperlink in pixel |\n| text-align | Left, Center,\
    \ Right | Align text or hyperlink or image to left or to center or to right. |\n\
    \nYou can use more than one style properties but they should be separated by a\
    \ **semicolon** [;]. Property and Value have **colons** [:] between them.\nLet’s\
    \ see an example as shown in figure 9.2. Let’s make a page with heading tag but\
    \ no style.\n\n```html\n<html>\n<head>\n<title>Style Example</title>\n</head>\n\
    <body>\n<h2>I am a heading.</h2>\n</body>\n</html>\n```\n\n![](img/739ece6d965a774f75c4a6632b8b7538_68_0.png)\n\
    \n*Figure 9.2: Heading Tag No Style*\n\nNow, we will add style to make the heading\
    \ tag look red as shown in figure 9.3.\n\n```html\n<html>\n<head>\n<title>Style\
    \ Example</title>\n</head>\n<body>\n<h2 style=\"color:red\">I am a heading.</h2>\n\
    </body>\n</html>\n```\n\n![](img/739ece6d965a774f75c4a6632b8b7538_68_1.png)\n\n\
    *Figure 9.3: Heading Tag in Red Color*\n\nYou can see that I have added **style**\
    \ attribute in **<h2>** tag with property as **color** and value as **red**. And\
    \ when I did that it changed the text of <h2> tag from black to red. This is the\
    \ beauty of style.\n\nLet's change the font of <h2> text to **Arial** as shown\
    \ in figure 9.4.\n\n```html\n<html>\n<head>\n<title>Style Example</title>\n</head>\n\
    <body>\n<h2 style=\"color:red;font-family:arial\">I am a heading.</h2>\n</body>\n\
    </html>\n```\n\n![](img/739ece6d965a774f75c4a6632b8b7538_69_0.png)\n\n*Figure\
    \ 9.4: Heading Tag text in Arial font*\n\nYou see the font has changed now. The\
    \ text style looks different. I added **font-family** property with value **arial**.\
    \ I used semicolon to separate both properties color and font-family.\n\nLet's\
    \ change style of another tag to add back-ground color in the web page. I will\
    \ use **background-color** property with value **skyblue** in the **body** tag\
    \ of the HTML. It is shown in figure 9.5.\n\n```html\n<html>\n<head>\n<title>Style\
    \ Example</title>\n</head>\n<body style=\"background-color:skyblue\">\n<h2 style=\"\
    color:red;font-family:arial\">I am a heading.</h2>\n</body>\n</html>\n```\n\n\
    ![](img/739ece6d965a774f75c4a6632b8b7538_69_1.png)\n\n*Figure 9.5: Background\
    \ Style*\n\nYou see how various combination of styles and properties can be used\
    \ to make your web page colorful. All you need is knowledge of these different\
