    \ HTML 标签。但我们将采用简单的方法来理解它们。所以，请继续阅读。\n\n## 第8章\n\n## 第8章 – 表格\n\n在上一章中，你学习了如何使用列表来组织你的写作。列表使写作要点突出、更具可读性和更美观。还有另一种组织信息和写作的方式——它被称为**表格**。你一定在书本、网站以及你最喜欢的杂志中见过表格。表格帮助你将信息组织成行和列。\n\
