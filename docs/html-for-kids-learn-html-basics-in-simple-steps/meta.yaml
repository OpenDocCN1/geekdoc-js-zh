    ![](img/739ece6d965a774f75c4a6632b8b7538_14_0.png)


    图2.2：“Hello World” HTML标签


    3.  将记事本文件保存为“helloworld.html”，放在某个文件夹位置，如图2.3所示。


    ![](img/739ece6d965a774f75c4a6632b8b7538_15_0.png)


    图2.3：helloworld HTML


    这是第一个基本课程 - 所有HTML文件都以“.html”或“.htm”扩展名保存。


    4.  我们如何在网页浏览器中查看我们的第一个HTML网页？如图2.4所示打开Internet Explorer（我使用的是Internet Explorer
    11版本。你可以根据需要使用其他浏览器或版本。）。Internet Explorer显示的是Bing地图网站。


