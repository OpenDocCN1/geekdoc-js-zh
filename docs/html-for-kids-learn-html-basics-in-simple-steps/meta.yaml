    ## CHAPTER 4


    ## Chapter 4 – Formatting Text


    In the previous chapter, you learnt about writing headings and paragraphs. I hope
    you enjoyed the exercise. We will continue with more texts in this chapter but
    will primarily focus on formatting the text.


    What is **Formatting**? When reading any book or watching some text on any web
    site or reading some document in Microsoft Word, you must have observed that certain
    part of the text are shown as Bold (**Bold**) or as underlined (<u>underline</u>)
    or as Italic (*Italic*) to show the importance of the text. Making any text bold,
    underline or italic in web page is called “Formatting”.


    We will learn how formatting is used in HTML.


    ## Examples of Formatting Text


    Time to see samples of the formatting. Please go to the following page in Wikipedia
    - [https://en.wikipedia.org/wiki/India](https://en.wikipedia.org/wiki/India) .
    In this small paragraph shown in the figure 4.1 below, you can see examples of
    formatting:


    You find that certain part of the text or certain lines have been highlighted
    as bold and italic to show the importance of the text. Showing importance of the
    text is the primary use of formatting.


    ## Learning the Details


    It is time to learn details of the formatting. But before we start, let''s see
    some common formatting example and how they look in the table below.


    Table 4.1: Formatting Styles


    | Formatting Style | How it looks?. |

    |---|---|

    | Bold | **This is bold text.** |

    | Italic | *This is Italic text.* |

    | Underline | <u>This is underline text.</u> |

    | Small | <small>This is small text.</small> |

    | Subscript | This is<sub>subscript</sub> text. |

    | Superscript | This is<sup>superscript</sup> text. |


    There are more formatting methods available in HTML but we will learn these commonly
    used methods in this book.


    Let’s start with first method, making a text **bold**. To make a text bold, you
    write the HTML like following:


    `<b> your text here </b>`


    It means, you place your texts between `<b>` and `</b>` tags to make them bold.
    `<b>` for bold. It is simple. Isn’t it?


    So, what it takes to make text italic? Take a look here:


    `<i> your text here </i>`


    How similar and again simple! Here `<i>` stands for italic. Guess what, all other
    formatting also works in the same way in HTML. Take a look at the table below
    to understand how other text formatting works:


    *Table 4.2: Formatting Tags*


    | Formatting | HTML Tags |

    |---|---|

    | Underline | `<u> you text here </u>` |

    | Small | `<small> you text here </small>` |

    | Subscript | `<sub> you text here </sub>` |

    | Superscript | `<sup> you text here </sup>` |


    Interesting so far! Let’s take the next step. Think about it, what it will take
    to make a paragraph look as shown in figure 4.2.


    Lorem ipsum dolor **sit amet**, consectetur adipiscing elit. Fusce varius, tortor
    et *pellentesque ultrices*, eros justo vehicula ligula, <u>non egestas massa</u>
    sapien vel mauris. Mauris eget ex rhoncus, <sub>fermentum</sub> risus eget, mattis
    magna. Vestibulum tincidunt venenatis justo, in <sup>fermentum mauris</sup> lobortis
    in.


    Figure 4.2: Mixed Formatting in Paragraph


    You can see that different ways of formatting text has been mixed with normal
    text. How does it work? Look at the HTML tags below which created this kind of
    formatting.


    ```html

    <html>

    <head>

    <title></title>

    </head>

    <body>

    <p>

    Lorem ipsum dolor <b> sit amet </b> consectetur adipiscing elit. Fusce varius
    tortor et <i> pellentesque ultrices </i>, eros justo vehicula ligula, <u> non
    egestas massa </u> sapien vel mauris. Mauris eget ex rhoncus, <sub> fermentum
    </sub> risus eget, mattis magna. Vestibulum tincidunt venenatis justo, in <sup>
