    ## 第2章


    **HTML语法：** 每个HTML标签都是成对出现的。你总会有一个像`<tag>`这样的开始标签，以及一个像`</tag>`这样的结束标签。开始标签写在`<`和`>`括号内。结束标签写在`</`和`>`括号之间。


    让我们从我们的第一个标签开始。


    ## `<HTML>` 标签


    看看下面显示的第一个标签。


    ```html

    <html>

    <head>

    <title>My First Title</title>

    </head>

    <Body>


    Hello World!


    </Body>

    </html>

    ```


    你看到一个开始标签`<html>`，然后是结束标签`</html>`。`<html>`和`</html>`标签就像是HTML文件的起点和终点。


    **HTML语法：** 所有HTML文件必须以`<html>`标签开始，并以`</html>`标签结束。


    ## `<HEAD>` 标签


    HTML文件中下一个重要的标签是`<head>`标签。它在下面被高亮显示。


    ```html

    <html>

    <head>

    <title>My First Title</title>

    </head>

    <Body>


    Hello World!


    </Body>

    </html>

    ```


    这个标签在真实的网页中用于包含脚本、样式和`<title>`标签。嗯，不要被这些新词搞混了。目前，我们将保持简单。你需要知道的是它包含了另一个重要的标签`<title>`。当你学习HTML的高级样式和编程时，你会更详细地了解`<head>`标签。


    **HTML语法：** 开始的`<head>`标签紧跟在`<html>`标签之后。结束的`</head>`标签在`<body>`标签之前。`<head>`标签包含另一个叫做`<title>`的标签。


    ## `<TITLE>` 标签


    什么是`<title>`标签？它是一个有趣且重要的标签。你可以在开始的`<title>`和结束的`</title>`标签之间写一些文本。无论你在这对标签之间写什么，都会出现在浏览器窗口的标题中。


    这是我们第一个HTML的示例：


    ```html

    <html>

    <head>

    <title>My First Title</title>

    </head>

    <Body>


    Hello World!


    </Body>

    </html>

    ```


    这是`<title>`标签在浏览器（本例中是Internet Explorer）窗口中的结果，如图2.10所示。你可以看到写在`<title>`和`</title>`标签之间的文本显示在Internet
    Explorer的标题中。


    ![](img/739ece6d965a774f75c4a6632b8b7538_23_0.png)


    图2.10：Internet Explorer标题


    **HTML语法：** `<title>`标签必须写在`<head>`标签内。它包含任何文本，然后显示在网页浏览器窗口的标题中。


    **HTML语法：** `<title>`和`<head>`标签是可选的。这意味着，它们可以在HTML内部，也可以不在。在接下来的章节中，你会发现我们在许多示例中没有添加这两个标签，因为它们在那些示例中不是必需的。然而，在你的HTML中同时包含`<title>`和`<head>`标签是一个好习惯。


    在真实的网站中，`<title>`标签用于在浏览器窗口的标题中显示网页的摘要或标题。


    ## `<BODY>` 标签


    HTML中最重要的主要标签是`<body>`标签。无论你在`<body>`标签内写什么；都会显示在浏览器窗口中。例如，在我们的第一个页面中，我们在`<body>`标签内写了Hello
    World!!!，它显示在浏览器窗口（Internet Explorer）中。


    下面HTML中的body标签已被高亮显示。


    ```html

    <html>

    <head>

    <title>My First Title</title>

    </head>

    <Body>

    Hello World!

    </Body>

    </html>

    ```


    body标签的内容显示在网页浏览器中，如下图2.11所示。


    ![](img/739ece6d965a774f75c4a6632b8b7538_24_0.png)


    图2.11：浏览器中显示的`<body>`标签


    让我们再举一个例子。访问Google网站 - [https://www.google.co.uk/](https://www.google.co.uk/)。你看，我已经在图2.12中框出了网页的一部分。这个框出的部分由各种标签组成，所有这些标签都在`<body>`和`</body>`内部。


    ![](img/739ece6d965a774f75c4a6632b8b7538_25_0.png)


    *图2.12：Google网站主体*


    查看下面的图2.13。我高亮显示了一些在`<body>`和`</body>`内部用于构建网页的标签类型。


    ![](img/739ece6d965a774f75c4a6632b8b7538_26_0.png)


    图2.13：Google网站主体标签


    我高亮显示了一些标签，但这个页面上还有更多。每个标签在网页上都有特定的用途。例如，有些用于显示Google标志，有些用于输入搜索文本，有些用于点击以获取搜索结果。


    你将在接下来的章节中学习许多这样的标签。`<body>`语法规则将始终适用。你学习的每个标签都将写在`<body>`和`</body>`标签之间。


    **HTML语法：** 开始的`<body>`标签在`<head>`标签之后。结束的`</body>`标签在`</html>`标签之前。为了以所需方式显示你的网页而编写的每个其他标签都写在`<body>`和`</body>`标签之间。


    编写标签名称时，始终使用小写英文字母，否则可能会出错。在网络世界中，用小写英文字母编写标签一直被视为**最佳实践**。我相信你想与**最佳实践**联系在一起。


    有时标签也被称为**元素**或**HTML元素**。


    ## 标签的属性


    你已经了解了标签和HTML结构。现在让我们学习**属性**，它是标签的重要组成部分。


    属性意味着质量。在现实生活中，属性的目的是什么？让我们举个例子。当你看到一个红苹果时，你会说这个苹果的一个质量（或者说属性）是它是红色的。同样，当你遇到一个聪明的同学时，你会说这个同学有一个质量或属性，那就是聪明。


    我们意识到，属性提供了关于某人或某事的额外细节。


    属性在标签中也起着同样的作用。它们提供了关于标签的额外细节。


    让我们以`<body>`标签为例；Body通常用于背景图像、背景颜色、字体大小等。


    ```html

    <body background="image of the background" bgcolor="color of the background" id="name
    of the body">

    ```


    在这个例子中，`<Body>`标签具有以下属性，如下表2.1所示。


    表2.1：Body属性


    | 属性 | 它告诉了`<body>`标签什么？ |

    | :--- | :--- |

    | bgcolor | 整个网页主体的背景颜色 |

    | background | 整个网页主体的背景图像 |

    | Id | 用于以编程方式搜索标签。你将在接下来的章节中了解更多关于此的信息。 |


    与`<body>`标签类似，HTML中的所有标签都有自己的属性集。一些属性如id在所有标签中都是通用的。一个标签可以有多个属性。当你在接下来的章节中学习标签时，你也会同时学习它们的重要属性。


    最后，让我们看看带有属性的标签结构。


    ```html

    <tag attribute-name="attribute-value"></tag>

    ```


    属性以**属性名="属性值"**的形式呈现在标签内。你在接下来的章节中学习的所有标签和属性都将遵循相同的结构。


    ## 总结


    很好，你现在理解了HTML结构、标签和属性。你已经掌握了基本概念。是时候开始学习具体的标签了，它们解决什么问题，如何使用，以及它们在网页上的样子。本书其余章节的重点是标签和相关主题。继续阅读...


    ## 第3章


    ## 第3章 – 标题和段落


    我们在上一章学习了HTML基础知识。你现在理解了HTML网页中标签的结构。有了这个基本理解，从现在开始，我们将学习特定的标签，了解它们在页面上的作用以及如何使用它们。


    在本章中，我们将重点介绍**标题**和**段落**标签。什么是“标题”和“段落”？它们与你在书籍和笔记本中使用的“标题”和“段落”没有什么不同。标题用于提供某个主题的“标题”。段落用于提供主题的书面文本。网页中“标题”和“段落”标签的目的与它们在书籍中的使用方式没有区别。


    ## 标题和段落的示例


    学习和理解某事的最好方法是在现实生活中“看到”它。我们现在将看看网页中标题和段落的示例。


    访问维基百科的以下页面 - [https://en.wikipedia.org/wiki/London](https://en.wikipedia.org/wiki/London)。我实际上是在维基百科中寻找关于伦敦的信息。你可以在下面的图3.1中看到标题和段落的示例。

    '
