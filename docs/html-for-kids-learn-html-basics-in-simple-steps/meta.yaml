- md: '## CHAPTER 12


    ![Currency Conversion](img/739ece6d965a774f75c4a6632b8b7538_89_0.png)


    Figure 12.1: Currency Conversion


    When you click on the ![play button](play_button.png) image, it takes you to a
    second web page where it shows GBP equivalent for the USD amount as shown in figure
    12.2.


    ![Currency Conversion Result](img/739ece6d965a774f75c4a6632b8b7538_90_0.png)


    Figure 12.2: Currency Conversion Result


    The business problem (i.e. converting one currency value to another) which this
    website solved has been possible due to programming conducted over the form and
    controls. The programming read the value of USD currency and then used some calculation
    to convert that into GBP equivalent and show as result.


    We will try to do something similar in this chapter but simple one.


    ## Learning the Details


    To learn JavaScript programming, we will create a simple form on a web page and
    try out simple programming on that.


    Here is the HTML for the form as shown in figure 12.3 below.


    ```html

    <html>

    <head>

    <title>Calculation on Form</title>

    </head>

    <body>

    <form>

    Number 1: &nbsp;;<input type="text" id="number1"></input>

    Number 2: &nbsp;;<input type="text" id="number2"></input>

    <br></br>

    Result: &nbsp;<input type="text" id="result"></input>

    <br></br>

    <input type="button" value="multiply" id="multiplybutton"></input>&nbsp;

    <input type="button" value="clear" id="clearbutton"></input>&nbsp;

    </form>

    </body>

    </html>

    ```


    Figure 12.3: Simple Form HTML


    The form has three textbox controls identified with name – **number1**, **number2**
    and **result**. There are two buttons identified with name – **multiplybutton**
    and **clearbutton**. The display text for the buttons are **Multiply** and **Clear**.


    The HTML form looks like the following figure 12.4:


    ![Simple Form](img/739ece6d965a774f75c4a6632b8b7538_91_0.png)


    Figure 12.4: Simple Form


    In this simple form, we will perform simple programming to meet the following
    objectives:


    - ✓ **Objective1:** When you type a number in **Number1** text box, type another
    number in **Number2** text box and then click on **Multiply** button, it will
    show **multiplication** of both the numbers in **Result** text box.


    - ✓ **Objective2:** When you click on **Clear** button, it will **cleanup** or
    say **remove** any value given in **Number1**, **Number2** and **Result** textboxes.


    Ready! Excited! Here we go.


    ## JavaScript to Read Value from Controls


    To be able to do the multiplication, we should have some way to read number written
    or typed in the controls. Then only we can apply some mathematical operation on
    the numbers. How do we read text or value from the control? The following is the
    JavaScript sentence to read value from the control:


    ```javascript

    document.getElementById(''control name'').value

    ```


    I am sure this JavaScript sentence is not making much sense. Let’s dissect this
    statement as shown in figure 12.5 to learn more about it.


    ![JavaScript Statement Dissection](img/739ece6d965a774f75c4a6632b8b7538_92_0.png)


    The first part of the sentence is the **body of the HTML**. It represents everything
    in the HTML **between** `<body>` and `</body>` tags. All HTML tags, elements and
    controls actually are placed in the body of the HTML. We learnt about this in
    chapter 2.


    The second part is **finding element by control name**. Controls are a type of
    HTML tags only which are used for user input. You learnt about it in the previous
    chapter. You must have seen that we are providing **control name** in Id attribute.
    This attribute is used to individually identify the control inside HTML body.
    Just like your name or roll number is a unique identifier in your class. In this
    second part, we are saying that find a control with the name “control name” inside
    HTML body.


    The last part says, since you have found the control inside HTML body, go **read
    value** from this control.


    In simple English, this JavaScript statement is saying **“Find a control with
    the name ‘control name’ inside HTML body and read value of it”**. Wow that complex
    looking JavaScript has such a simple meaning.


    JavaScript language is case sensitive. It means you need to write the statement
    taking care of each capital and small letter as shown in the statement here. If
    you write all in small letter or capital letters or mix other way around, then
    it will not work and throw error.


    So, if I have to read value of the textbox control named **number1** in the HTML
    shown earlier, your JavaScript statement will look like following:


    ```javascript

    document.getElementById(''number1'').value

    ```


    ## JavaScript to Write Value to Controls


    Now that we know how to read value from the controls, let’s also learn, how to
    write value to a control? After all, the multiplication of number1 and number2
    has to be written inside the control named result. It means multiplication value
    has to be written to the result control.


    We will take help of **mathematical algebra** for this. You all must have learnt
    **expression** in algebra. Look at this expression problem here:


    > “Write a value of 5 to a term x and present as an expression”


    You must have solved this kind of problem many times. It is kid’s job right? How
    would the expression look like?


    ```

    x = 5

    ```


    Simple. Let me now change the problem statement in our HTML way.


    > “Write a value of 5 to textbox control result and present as an expression”


    The new expression will look very similar:


    ```javascript

    document.getElementById(''result'').value = 5

    ```


    Simple again. All I am doing that I am finding the result control by its identifier
    name and then writing a value of 5 to it. Exactly similar to term expression above.
    **This is another JavaScript statement which is used to write some value to a
    control.**


    ## JavaScript to Perform Mathematical Operations


    We now know both read and write statements in JavaScript. We would now focus on
    multiplication of number1 and number2. Algebra expressions will again come to
    our help.


    Look at another expression problem here:


    > “There are three terms – x, y and z. Write an expression which multiplies terms
    x, y and assigns the result of multiplication to term z”


    Little lengthy problem but again simple one. How would the expression look now?


    ```

    z = x * y

    ```


    (*) is sign of multiplication in computer. Similarly, (+), (-) and (/) are signs
    of addition, subtraction and division respectively.


    Let me again change the problem statement in our HTML way:


    > “There are three textbox controls – number1, number2 and result. Write an expression
    which multiplies values of number1, number2 controls and assigns the result of
    multiplication to control result as value”


    Using the same statement as above, the expression in HTML Controls context will
    look like following:


    ```javascript

    document.getElementById(''result'').value = document.getElementById(''number1'').value
    * document.getElementById(''number2'').value

    ```


    This is the JavaScript statement to multiply values of two controls and assign
    to a third control. Similarly, you can write JavaScript statements for subtraction,
    addition and division. Only the sign of operation will change from (*) to (+),
    (-) or (/).


    Let’s move next. What if there are more than one JavaScript statements? How do
    we write them? If there are more than one JavaScript statements, then we separate
    them using semicolon (;). Take a look at the example below:


    ```javascript

    document.getElementById(''number1'').value = 5; document.getElementById(''number2'').value
    = 5

    ```


    There are two JavaScript statements next to each other but separated by semicolon
    (;).


    ## JavaScript Events


    Now one last thing to learn before we put everything together in a web page. Let
    me show you again the first objective with the HTML which was shared in the beginning
    of this section. It is presented in figure 12.6 below.


    - **Objective1:** When you type a number in **Number1** text box, type another
    number in **Number2** text box and then **click on Multiply button**, it will
    **show multiplication of both numbers in Result text box**.


    *Figure 12.6: Objective 1*


    I have highlighted the area which I want to discuss now. The objective is to show
    multiplication of number1 and number2 in result control **when someone clicks
    on Multiply button**. How would JavaScript programming come to know when someone
    has clicked the button?


    Such things in JavaScript programming are managed by a term called “**Event**”.
    There are various types of events and they raise or occur when something special
    happens. For instance, in our case, there will be an event called **onclick**
    for button control which is raised when someone clicks on the button. Similar
    to onclick, there are many other events such as onfocus, onblur etc. I am not
    going to go in details because you would need some more knowledge about programming
    in order to understand it completely.


    Focusing back on **onclick** event. Here is how onclick JavaScript statement looks
    like:


    ```javascript

    onclick="JavaScript Programming Statements"

    ```


    As mentioned earlier, this event occurs when someone clicks on a button. And when
    this event occurs, it will perform the JavaScript programming statements provided
    to it. The JavaScript statements could be anything – reading, writing or performing
    operation as we learnt earlier.


    For instance, take look into following example:


    ```javascript

    onclick = "document.getElementById(''number1'').value = 5; document.getElementById(''number2'').value
    = 5"

    ```


    In the JavaScript statement above, when onclick event occurs, it will perform
    both JavaScript statements which write a value of 5 to both number1 and number2
    controls.


    How do I tell HTML that this onclick event is for this button? You do that by
    adding onclick event in the button control tag. Here is the example:


    ```html

    <input type="button" id="control name" onclick=" JavaScript Programming Statements"
    ></input>

    ```'
