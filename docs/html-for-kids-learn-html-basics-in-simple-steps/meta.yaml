    ## 第11章


    ## 文本框控件


    让我们从**文本框**类型控件开始。它用于输入单行文本或句子。以下是文本框类型控件标签的示例：


    ```

    <input type="text" id="control name"></input>

    ```


    你可以看到它使用了`<input>`标签，**type**属性值为"**text**"，表明这是一个文本框类型控件。**Id**代表**标识符**，此属性用于为控件保留一个名称。就像老师在班级众多学生中通过你的名字找到你一样。Id属性值可用于在众多控件中唯一地找到该控件。我们将在下一章更深入地学习Id属性的用法。


    ## 复选框和单选按钮控件


    下一类控件是**复选框**和**单选按钮**。它们用于从给定的多个选项中进行选择。以下是这些控件的标签：


    ```

    <input type="checkbox" id="control name" >Option1</input>

    <input type="radio" id="control name" >Option1</input>

    ```


    两者再次使用`<input>`标签，但它们的type属性值分别是**checkbox**和**radio**。**Option1**是显示在网页上的选项文本。由于使用这些控件时，你在网页上提供了多个选项，因此通常需要添加多个复选框或单选按钮控件来显示多个选择。你很快就会看到一个这样的例子。


    ## 按钮控件


    接下来，以下是**按钮**类型控件的标签结构。


    ```

    <input type="button" value="Button" id="control name" ></input>

    ```


    type属性值是**button**。**value**属性中的文本是显示在网页上的按钮文本。


    ## 文本区域控件


    让我们看看不使用`<input>`标签的控件。我们将从**文本区域**控件开始。标签如下所示：


    ```

    <textarea id="control name" rows="10" cols="30"></textarea>

    ```


    我们使用**`<textarea>`**标签来创建此控件。由于文本区域可以接受多行文本，你还可以选择使用**rows**和**cols**属性来设置控件的高度和宽度。Rows属性决定控件的高度。Cols代表列数，它决定控件的宽度。它们都接受整数值。


    ## 选择控件


    接下来我们将讨论**选择**控件，它允许从多个可用选项中选择一个。以下是选择控件的标签结构：


    ```

    <select id="control name">

    <option> option1</option>

    <option> option2</option>

    <option> option3</option>

    <option> option4</option>

    </select>

    ```


    标签以**`<select>`**开始，以**`</select>`**结束。在这两个标签之间，你可以放置多个**`<option></option>`**标签。每个**`<option>`**标签代表一个可供人们选择的选项。**`<option>`**和**`</option>`**标签之间的文本表示网页上显示的选项文本。根据网页上需要提供的选项数量，你在**`<select>`**标签之间添加两个或更多**`<option>`**标签。


    我们现在讨论了所有重要的控件。我建议你再读一遍每个控件的说明，然后回顾表11.1，看看控件标签在网页上是如何显示的。


    ## 表单


