    在本练习中，学生将创建一个密码强度检查器，根据输入的密码提供强度反馈。本练习介绍如何处理表单输入并根据输入值提供实时反馈。


    **涉及主题：**


    - HTML 结构

    - CSS 样式

    - JavaScript 事件监听器

    - DOM 操作（更新文本内容和样式）

    - 实时输入验证


    HTML:


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Strength Checker</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <div class="password-container">

    <h1>Password Strength Checker</h1>

    <input type="password" id="passwordInput" placeholder="Enter password">

    <p id="strengthDisplay">Password Strength: </p>

    </div>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    CSS:


    ```css

    body {

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    margin: 0;

    }


    .password-container {

    text-align: center;

    background-color: #f0f0f0;

    padding: 20px;

    border-radius: 10px;

    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

    }


    input {

    padding: 10px;

    font-size: 16px;

    margin-bottom: 10px;

    }


    p {

    font-size: 18px;

    margin: 0;

    }

    ```


    JavaScript:


    ```javascript

    function checkStrength(password) {

    let strength = ''Weak'';

    const regexes = [

    /[a-z]/,

    /[A-Z]/,

    /[0-9]/,

    /[^a-zA-Z0-9]/

    ];

    const passedTests = regexes.filter(regex => regex.test(password)).length;

    if (password.length >= 8 && passedTests >= 3) {

    strength = ''Strong'';

    } else if (password.length >= 6 && passedTests >= 2) {

    strength = ''Medium'';

    }

    return strength;

    }


    document.getElementById(''passwordInput'').addEventListener(''input'', function()
    {

    const password = this.value;

    const strength = checkStrength(password);

    document.getElementById(''strengthDisplay'').textContent = `Password Strength:
    ${strength}`;

    });

    ```


    ### 小费计算器


    **描述：**


    在本练习中，学生将创建一个小费计算器，根据用户输入计算小费金额和总账单。本练习介绍如何处理用户输入并执行计算。


    **涉及主题：**


    - HTML 结构

    - CSS 样式

    - JavaScript 事件监听器

    - 处理表单输入

    - 执行计算


    HTML:


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tip Calculator</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <div class="calculator-container">

    <h1>Tip Calculator</h1>

    <form id="calculatorForm">

    <input type="number" id="billAmount" placeholder="Enter bill amount" required>

    <input type="number" id="tipPercentage" placeholder="Enter tip percentage" required>

    <button type="submit">Calculate</button>

    </form>

    <p id="tipAmountDisplay">Tip Amount: $0.00</p>

    <p id="totalAmountDisplay">Total Amount: $0.00</p>

    </div>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    CSS:


    ```css

    body {

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    margin: 0;

    }


    .calculator-container {

    text-align: center;

    background-color: #f0f0f0;

    padding: 20px;

    border-radius: 10px;

    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

    }


    form {

    display: flex;

    flex-direction: column;

    gap: 10px;

    }


    input, button {

    padding: 10px;

    font-size: 16px;

    }


    p {

    font-size: 18px;

    margin: 0;

    }

    ```


    JavaScript:


    ```javascript

    document.getElementById(''calculatorForm'').addEventListener(''submit'', function(event)
    {

    event.preventDefault();

    const billAmount = parseFloat(document.getElementById(''billAmount'').value);

    const tipPercentage = parseFloat(document.getElementById(''tipPercentage'').value);

    const tipAmount = (billAmount * (tipPercentage / 100)).toFixed(2);

    const totalAmount = (billAmount + parseFloat(tipAmount)).toFixed(2);

    document.getElementById(''tipAmountDisplay'').textContent = `Tip Amount: $${tipAmount}`;

    document.getElementById(''totalAmountDisplay'').textContent = `Total Amount: $${totalAmount}`;

    });

    ```


