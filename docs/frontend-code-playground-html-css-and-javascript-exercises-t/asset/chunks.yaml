    ### 更改背景颜色


    描述：


    在本练习中，学生将创建一个简单的网页，其中包含一个按钮，点击该按钮可更改页面的背景颜色。本练习介绍基本的 DOM 操作和事件处理。


    涵盖主题：


    ● HTML 结构


    ● CSS 样式


    ● JavaScript 事件监听器


    ● DOM 操作


    HTML：


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Background Color</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <button id="changeColorButton">Change Background Color</button>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    CSS：


    ```css

    body {

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    margin: 0;

    background-color: #f0f0f0;

    }

    button {

    padding: 10px 20px;

    font-size: 16px;

    cursor: pointer;

    }

    ```


    JavaScript：


    ```javascript

    document.getElementById(''changeColorButton'').addEventListener(''click'', function()
    {

    document.body.style.backgroundColor = getRandomColor();

    });

    function getRandomColor() {

    const letters = ''0123456789ABCDEF'';

    let color = ''#'';

    for (let i = 0; i < 6; i++) {

    color += letters[Math.floor(Math.random() * 16)];

    }

    return color;

    }

    ```


    ### 显示/隐藏文本


    描述：


    在本练习中，学生将创建一个网页，其中包含一个按钮，用于切换段落的可见性。本练习介绍使用 JavaScript 显示和隐藏元素的概念。


    涵盖主题：


    ● HTML 结构


    ● CSS 样式


    ● JavaScript 事件监听器


    ● DOM 操作（显示/隐藏元素）


    HTML：


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Show/Hide Text</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <button id="toggleTextButton">Show/Hide Text</button>

    <p id="text" style="display: none;">This is a sample text that can be shown or
    hidden.</p>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    CSS：


    ```css

    body {

    font-family: Arial, sans-serif;

    display: flex;

    flex-direction: column;

    align-items: center;

    height: 100vh;

    justify-content: center;

    margin: 0;

    }

    button {

    padding: 10px 20px;

    font-size: 16px;

    cursor: pointer;

    margin-bottom: 20px;

    }

    p {

    font-size: 18px;

    }

    ```


    JavaScript：


    ```javascript

    document.getElementById(''toggleTextButton'').addEventListener(''click'', function()
    {

    const text = document.getElementById(''text'');

    if (text.style.display === ''none'') {

    text.style.display = ''block'';

    } else {

    text.style.display = ''none'';

    }

    });

    ```


