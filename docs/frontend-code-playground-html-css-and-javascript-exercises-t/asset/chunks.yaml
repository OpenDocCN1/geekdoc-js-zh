    \ center;\n  background-color: #f0f0f0;\n  padding: 20px;\n  border-radius: 10px;\n\
    \  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\n}\nform {\n  display: flex;\n  flex-direction:\
    \ column;\n  gap: 10px;\n  margin-bottom: 20px;\n}\ninput, button {\n  padding:\
    \ 10px;\n  font-size: 16px;\n}\np {\n  font-size: 36px;\n  margin-top: 20px;\n\
    }\n```\n\n#### JavaScript\n\n```javascript\nlet timer;\nlet timeLeft;\nlet isRunning\
    \ = false;\n\ndocument.getElementById('timerForm').addEventListener('submit',\
    \ function(event) {\n  event.preventDefault();\n  clearInterval(timer);\n  timeLeft\
    \ = parseInt(document.getElementById('secondsInput').value);\n  updateDisplay();\n\
    \  startTimer();\n  document.getElementById('stopButton').disabled = false;\n\
    \  document.getElementById('resetButton').disabled = false;\n});\n\ndocument.getElementById('stopButton').addEventListener('click',\
