    body {


    font-family: Arial, sans-serif;


    display: flex;


    justify-content: center;


    align-items: center;


    height: 100vh;


    margin: 0;


    }


    .quiz-container {


    text-align: center;


    background-color: #f0f0f0;


    padding: 20px;


    border-radius: 10px;


    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);


    width: 300px;


    }


    button {


    padding: 10px 20px;


    font-size: 16px;


    cursor: pointer;


    margin-top: 20px;


