    Explanation: Clicking the button with the ID showDateTimeButton triggers the display
    of the current date and time.


    What happens when the changeTextButton is clicked in the Change Text Content exercise?


    A) The text in the paragraph is changed to the input value


    B) The button text is changed


    C) The input field is cleared


    D) The paragraph is hidden


    Answer: A


    Explanation: Clicking the changeTextButton updates the text content of the paragraph
    with the ID textDisplay to the value entered in the input field.


    Which HTML element captures the user''s input in the Change Text Content exercise?


    A) <textarea>


    B) <input>


    C) <button>


    D) <div>


    Answer: B


    Explanation: The <input> element with the ID textInput captures the user''s input.


    What method is used to update the text content of an element in the Change Text
    Content exercise?


    A) innerHTML


    B) innerText


    C) textContent


    D) value


    Answer: C


    Explanation: The textContent property is used to update the text content of the
    paragraph element.


    What is the purpose of event delegation in the Highlight List Items exercise?


    A) To handle multiple event listeners for each list item


    B) To handle the click event on the entire list


    C) To style the list items


    D) To create new list items


    Answer: B


    Explanation: Event delegation is used to handle the click event on the entire
    list (<ul> element) instead of attaching event listeners to each individual list
    item.


    Which CSS class is added to a list item when it is clicked in the Highlight List
    Items exercise?


    A) selected


    B) active


    C) highlight


    D) clicked


    Answer: C


    Explanation: The highlight class is added to a clicked list item to change its
    background color.'
