    ```\n\n### 自定义分账小费计算器\n\n描述：\n\n在本练习中，学生将创建一个小费计算器，根据用户输入的账单金额、小费百分比和人数，计算每人应付的小费金额和总账单。本练习介绍如何处理多个表单输入并执行计算。\n\
    \n涵盖主题：\n\n* HTML 结构\n* CSS 样式\n* JavaScript 事件监听器\n* 处理表单输入\n* 执行计算\n\nHTML:\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
    >\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n  <title>Tip Calculator</title>\n  <link rel=\"stylesheet\" href=\"styles.css\"\
    >\n</head>\n<body>\n  <div class=\"calculator-container\">\n    <h1>Tip Calculator</h1>\n\
    \    <form id=\"calculatorForm\">\n      <input type=\"number\" id=\"billAmount\"\
    \ placeholder=\"Enter bill amount\" required>\n      <input type=\"number\" id=\"\
    tipPercentage\" placeholder=\"Enter tip percentage\" required>\n      <input type=\"\
    number\" id=\"numberOfPeople\" placeholder=\"Enter number of people\" required>\n\
    \      <button type=\"submit\">Calculate</button>\n    </form>\n    <p id=\"tipAmountDisplay\"\
    >Tip Amount: $0.00</p>\n    <p id=\"totalAmountDisplay\">Total Amount: $0.00</p>\n\
    \    <p id=\"perPersonDisplay\">Amount per Person: $0.00</p>\n  </div>\n  <script\
    \ src=\"script.js\"></script>\n</body>\n</html>\n```\n\nCSS:\n\n```css\nbody {\n\
    \  font-family: Arial, sans-serif;\n  display: flex;\n  justify-content: center;\n\
    \  align-items: center;\n  height: 100vh;\n  margin: 0;\n}\n\n.calculator-container\
    \ {\n  text-align: center;\n  background-color: #f0f0f0;\n  padding: 20px;\n \
    \ border-radius: 10px;\n  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\n}\n\nform\
    \ {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\ninput, button\
    \ {\n  padding: 10px;\n  font-size: 16px;\n}\n\np {\n  font-size: 18px;\n  margin:\
    \ 5px 0;\n}\n```\n\nJavaScript:\n\n```javascript\ndocument.getElementById('calculatorForm').addEventListener('submit',\
    \ function(event) {\n  event.preventDefault();\n  const billAmount = parseFloat(document.getElementById('billAmount').value);\n\
    \  const tipPercentage = parseFloat(document.getElementById('tipPercentage').value);\n\
    \  const numberOfPeople = parseInt(document.getElementById('numberOfPeople').value);\n\
    \  const tipAmount = (billAmount * (tipPercentage / 100)).toFixed(2);\n  const\
    \ totalAmount = (billAmount + parseFloat(tipAmount)).toFixed(2);\n  const perPersonAmount\
    \ = (totalAmount / numberOfPeople).toFixed(2);\n  document.getElementById('tipAmountDisplay').textContent\
    \ = `Tip Amount: $${tipAmount}`;\n  document.getElementById('totalAmountDisplay').textContent\
    \ = `Total Amount: $${totalAmount}`;\n  document.getElementById('perPersonDisplay').textContent\
    \ = `Amount per Person: $${perPersonAmount}`;\n});\n```\n\n#### 多项选择题\n\n在“带本地存储的待办事项列表”练习中，用于将任务存储到本地存储的方法是？\n\
    \na) `localStorage.setItem`\n\nb) `localStorage.save`\n\nc) `localStorage.store`\n\
    \nd) `localStorage.addItem`\n\n答案：a) `localStorage.setItem` 解释：`localStorage.setItem`\
    \ 方法用于将任务以字符串形式存储到本地存储中。\n\n在“BMI 计算器”练习中，用于计算 BMI 的公式是？\n\na) `weight / height`\n\
    \nb) `weight / (height * height)`\n\nc) `weight * height`\n\nd) `(weight + height)\
    \ / 2`\n\n答案：b) `weight / (height * height)` 解释：BMI 的计算方式是用体重（千克）除以身高（米）的平方。\n\
    \n在“数字时钟”练习中，用于每秒更新时间的方法是？\n\na) `setTimeout`\n\nb) `setInterval`\n\nc) `requestAnimationFrame`\n\
