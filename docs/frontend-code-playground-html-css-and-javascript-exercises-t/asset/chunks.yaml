    ### Calculator


    Description:


    In this exercise, students will create a simple calculator that performs basic
    arithmetic operations (addition, subtraction, multiplication, division). This
    exercise introduces handling button clicks, performing calculations, and dynamically
    updating the DOM.


    Topics Covered:


    ●       HTML structure


    ●       CSS styling


    ●       JavaScript event listeners


    ●       Handling button clicks


    ●       Performing calculations


    ●       DOM manipulation (updating text content)


    HTML:


    ```

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <div class="calculator-container">

    <h1>Calculator</h1>

    <div id="calculator">

    <div id="display">0</div>

    <button class="btn" data-value="7">7</button>

    <button class="btn" data-value="8">8</button>

    <button class="btn" data-value="9">9</button>

    <button class="btn" data-value="/">/</button>

    <button class="btn" data-value="4">4</button>

    <button class="btn" data-value="5">5</button>

    <button class="btn" data-value="6">6</button>

    <button class="btn" data-value="*">*</button>

    <button class="btn" data-value="1">1</button>

    <button class="btn" data-value="2">2</button>

    <button class="btn" data-value="3">3</button>

    <button class="btn" data-value="-">-</button>

    <button class="btn" data-value="0">0</button>

    <button class="btn" data-value=".">.</button>

    <button class="btn" id="clear">C</button>

    <button class="btn" data-value="+">+</button>

    <button class="btn" id="equals">=</button>

    </div>

    </div>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    CSS:


    ```

    body {

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    margin: 0;

    }

    .calculator-container {

    text-align: center;

    background-color: #f0f0f0;

    padding: 20px;

    border-radius: 10px;

    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

    }

    #calculator {

    display: grid;

    grid-template-columns: repeat(4, 50px);

    gap: 10px;

    }

    #display {

    grid-column: span 4;

    padding: 20px;

    background-color: #fff;

    border: 1px solid #ccc;

    text-align: right;

    font-size: 24px;

    border-radius: 5px;

    }

    .btn {

    padding: 20px;

    font-size: 18px;

    cursor: pointer;

    background-color: #fff;

    border: 1px solid #ccc;

    border-radius: 5px;

    }

    .btn:hover {

    background-color: #e0e0e0;

    }

    ```


    JavaScript:


    ```

    const display = document.getElementById(''display'');

    const buttons = Array.from(document.getElementsByClassName(''btn''));

    buttons.forEach(button => {

    button.addEventListener(''click'', function() {

    const value = this.getAttribute(''data-value'');

    if (value === null) return;

    switch(value) {

    case ''C'':

    display.textContent = ''0'';

    break;

    case ''='':

    try {

    display.textContent = eval(display.textContent);

    } catch {

    display.textContent = ''Error'';

    }

    break;

    default:

    if (display.textContent === ''0'' || display.textContent === ''Error'') {

    display.textContent = value;

    } else {

    display.textContent += value;

    }

    }

    });

    });

    document.getElementById(''clear'').addEventListener(''click'', () => {

    display.textContent = ''0'';

    });

    document.getElementById(''equals'').addEventListener(''click'', () => {

    try {

    display.textContent = eval(display.textContent);

    } catch {

    display.textContent = ''Error'';

    }

    });

    ```


    ### To-Do List


    Description:


    In this exercise, students will create a simple to-do list that allows users to
    add and remove tasks. This exercise introduces handling form inputs, dynamically
    updating the DOM, and managing a list of items.


    Topics Covered:


    ●       HTML structure


    ●       CSS styling


    ●       JavaScript event listeners


    ●       Handling form inputs


    ●       DOM manipulation (adding and removing elements)


    ●       Managing a list of items


    HTML:


    ```

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <div class="todo-container">

    <h1>To-Do List</h1>

    <form id="todoForm">

    <input type="text" id="taskInput" placeholder="Enter a new task" required>

    <button type="submit">Add Task</button>

    </form>

    <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    CSS:


    ```

    body {

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    margin: 0;

    }

    .todo-container {

    text-align: center;

    background-color: #f0f0f0;

    padding: 20px;

    border-radius: 10px;

    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

    width: 300px;

    }

    form {

    display: flex;

    flex-direction: column;

    gap: 10px;

    }

    input, button {

    padding: 10px;

    font-size: 16px;

    }

    ul {

    list-style-type: none;

    padding: 0;

    }

    li {

    padding: 10px;

    margin: 5px 0;

    background-color: #fff;

    border: 1px solid #ccc;

    border-radius: 5px;

    display: flex;

    justify-content: space-between;

    }

    button.remove {

    background: none;

    border: none;

    color: red;

    cursor: pointer;

    font-size: 16px;

    }

    ```


    JavaScript:


    ```

    document.getElementById(''todoForm'').addEventListener(''submit'', function(event)
    {

    event.preventDefault();

    const taskInput = document.getElementById(''taskInput'');

    const taskText = taskInput.value;

    if (taskText === '''') return;

    const li = document.createElement(''li'');

    li.textContent = taskText;

    const removeButton = document.createElement(''button'');

    removeButton.textContent = ''Remove'';

    removeButton.classList.add(''remove'');

    removeButton.addEventListener(''click'', function() {

    li.remove();

    });

    li.appendChild(removeButton);

    document.getElementById(''taskList'').appendChild(li);

    taskInput.value = '''';

    });

    ```


