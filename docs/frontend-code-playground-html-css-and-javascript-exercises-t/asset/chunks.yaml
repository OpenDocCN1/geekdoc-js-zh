    ### To-Do List with Priorities


    **Description:**


    In this exercise, students will create a to-do list with priority levels for each
    task. This exercise introduces handling form inputs, dynamically updating the
    DOM, and using CSS to style elements based on priority.


    **Topics Covered:**


    ● HTML structure


    ● CSS styling


    ● JavaScript event listeners


    ● DOM manipulation (adding, updating, and removing elements)


    ● Handling form inputs


    **HTML:**


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List with Priorities</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <div class="todo-container">

    <h1>To-Do List</h1>

    <form id="todoForm">

    <input type="text" id="taskInput" placeholder="Enter a new task" required>

    <select id="prioritySelect" required>

    <option value="high">High</option>

    <option value="medium">Medium</option>

    <option value="low">Low</option>

    </select>

    <button type="submit">Add Task</button>

    </form>

    <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    **CSS:**


    ```css

    body {

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    margin: 0;

    }

    .todo-container {

    text-align: center;

    background-color: #f0f0f0;

    padding: 20px;

    border-radius: 10px;

    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

    width: 300px;

    }

    form {

    display: flex;

    flex-direction: column;

    gap: 10px;

    }

    input, select, button {

    padding: 10px;

    font-size: 16px;

    }

    ul {

    list-style-type: none;

    padding: 0;

    }

    li {

    padding: 10px;

    margin: 5px 0;

    background-color: #fff;

    border: 1px solid #ccc;

    border-radius: 5px;

    display: flex;

    justify-content: space-between;

    }

    li.high {

    border-left: 5px solid red;

    }

    li.medium {

    border-left: 5px solid orange;

    }

    li.low {

    border-left: 5px solid green;

    }

    button.remove {

    background: none;

    border: none;

    color: red;

    cursor: pointer;

    font-size: 16px;

    }

    ```


    **JavaScript:**


    ```javascript

    document.getElementById(''todoForm'').addEventListener(''submit'', function(event)
    {

    event.preventDefault();

    const taskInput = document.getElementById(''taskInput'');

    const prioritySelect = document.getElementById(''prioritySelect'');

    const taskText = taskInput.value;

    const priority = prioritySelect.value;

    if (taskText === '''') return;

    const li = document.createElement(''li'');

    li.textContent = taskText;

    li.classList.add(priority);

    const removeButton = document.createElement(''button'');

    removeButton.textContent = ''Remove'';

    removeButton.classList.add(''remove'');

    removeButton.addEventListener(''click'', function() {

    li.remove();

    });

    li.appendChild(removeButton);

    document.getElementById(''taskList'').appendChild(li);

    taskInput.value = '''';

    prioritySelect.value = ''medium'';

    });

    ```


    ### Countdown Timer with Pause/Resume


    **Description:**


    In this exercise, students will create a countdown timer that can be paused and
    resumed. This exercise introduces handling form inputs, working with timers, and
    dynamically updating the DOM.


    **Topics Covered:**


    ● HTML structure


    ● CSS styling


    ● JavaScript event listeners


    ● Handling form inputs


    ● Working with timers


    ● DOM manipulation (updating text content)


