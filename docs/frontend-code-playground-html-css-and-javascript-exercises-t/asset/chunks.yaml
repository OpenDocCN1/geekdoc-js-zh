    ></script>\n</body>\n</html>\n```\n\nCSS：\n\n```css\nbody {\nfont-family: Arial,\
    \ sans-serif;\ndisplay: flex;\nflex-direction: column;\nalign-items: center;\n\
    height: 100vh;\njustify-content: center;\nmargin: 0;\n}\ninput {\npadding: 10px;\n\
    font-size: 16px;\nmargin-bottom: 10px;\n}\nbutton {\npadding: 10px 20px;\nfont-size:\
    \ 16px;\ncursor: pointer;\nmargin-bottom: 20px;\n}\np {\nfont-size: 24px;\n}\n\
    ```\n\nJavaScript：\n\n```javascript\nlet timer;\nlet countdown;\ndocument.getElementById('startButton').addEventListener('click',\
    \ function() {\n    clearInterval(timer);\n    const timeInput = document.getElementById('timeInput').value;\n\
    \    countdown = parseInt(timeInput, 10);\n    document.getElementById('timerDisplay').textContent\
    \ = countdown;\n    timer = setInterval(function() {\n        countdown--;\n \
    \       document.getElementById('timerDisplay').textContent = countdown;\n   \
    \     if (countdown <= 0) {\n            clearInterval(timer);\n            alert('Time\
    \ is up!');\n        }\n    }, 1000);\n});\n```\n\n#### 多项选择题\n\n在 JavaScript\
    \ 中，用于切换元素上 CSS 类的方法是哪个？\n\na) `addClass`\n\nb) `removeClass`\n\nc) `toggleClass`\n\
    \nd) `classList.toggle`\n\n答案：d) `classList.toggle` 解释：`classList.toggle` 方法用于根据类是否已存在来添加或移除元素上的类。\n\
    \n在“过滤列表项”练习中，哪个事件用于检测输入字段的变化？\n\na) `change`\n\nb) `input`\n\nc) `keyup`\n\n\
    d) `keydown`\n\n答案：b) `input` 解释：当 `<input>`、`<textarea>` 或 `<select>` 元素的值发生变化时，会触发\
    \ `input` 事件。\n\n如何使用 JavaScript 选择 DOM 中的下一个兄弟元素？\n\na) `previousElementSibling`\n\
    \nb) `nextElement`\n\nc) `nextSibling`\n\nd) `nextElementSibling`\n\n答案：d) `nextElementSibling`\
    \ 解释：`nextElementSibling` 属性返回紧跟在指定元素之后的兄弟元素，如果指定元素没有下一个兄弟元素，则返回 `null`。\n\n在“手风琴菜单”练习中，手风琴内容的初始显示样式是什么？\n\
    \na) `block`\n\nb) `inline`\n\nc) `none`\n\nd) `hidden`\n\n答案：c) `none` 解释：手风琴内容的初始显示样式设置为\
    \ `none`，表示内容默认隐藏。\n\n哪个 CSS 属性常用于在动态更改样式时创建平滑过渡？\n\na) `animation`\n\nb) `transform`\n\
    \nc) `transition`\n\nd) `duration`\n\n答案：c) `transition` 解释：`transition` 属性用于在\
    \ CSS 属性值动态变化时创建平滑过渡。\n\n#### 切换深色模式\n\n在“切换深色模式”练习中，用于触发深色模式切换的事件监听器是哪个？\n\n\
    A) `mouseover`\n\nB) `click`\n\nC) `dblclick`\n\nD) `keydown`\n\n答案：B\n\n解释：当按钮被点击时，使用\
    \ `click` 事件监听器来触发深色模式切换。\n\n在“切换深色模式”练习中，哪个 CSS 类被添加到 body 元素以启用深色模式？\n\nA) `dark`\n\
    \nB) `night-mode`\n\nC) `dark-mode`\n\nD) `dark-theme`\n\n答案：C\n\n解释：CSS 类 `dark-mode`\
    \ 被添加到 body 元素以启用深色模式。\n\n在“切换深色模式”练习中，哪个 CSS 属性被更改以在浅色和深色模式之间切换？\n\nA) `color`\n\
