    ## BMI Calculator


    In this exercise, students will create a BMI (Body Mass Index) calculator that
    calculates BMI based on user input for weight and height. This exercise introduces
    handling form inputs and performing calculations.


    Topics Covered:


    - HTML structure

    - CSS styling

    - JavaScript event listeners

    - Handling form inputs

    - Performing calculations


    HTML:


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMI Calculator</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <div class="calculator-container">

    <h1>BMI Calculator</h1>

    <form id="bmiForm">

    <input type="number" id="weightInput" placeholder="Enter weight in kg" required>

    <input type="number" id="heightInput" placeholder="Enter height in cm" required>

    <button type="submit">Calculate</button>

    </form>

    <p id="bmiDisplay">Your BMI: </p>

    </div>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    CSS:


    ```css

    body {

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    margin: 0;

    }

    .calculator-container {

    text-align: center;

    background-color: #f0f0f0;

    padding: 20px;

    border-radius: 10px;

    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

    }

    form {

    display: flex;

    flex-direction: column;

    gap: 10px;

    }

    input, button {

    padding: 10px;

    font-size: 16px;

    }

    p {

    font-size: 18px;

    margin: 0;

    }

    ```


    JavaScript:


    ```javascript

    document.getElementById(''bmiForm'').addEventListener(''submit'', function(event)
    {

    event.preventDefault();

    const weight = parseFloat(document.getElementById(''weightInput'').value);

    const height = parseFloat(document.getElementById(''heightInput'').value) / 100;

    const bmi = (weight / (height * height)).toFixed(2);

    document.getElementById(''bmiDisplay'').textContent = `Your BMI: ${bmi}`;

    });

    ```


    ## Digital Clock


    Description:


    In this exercise, students will create a digital clock that displays the current
    time and updates every second. This exercise introduces working with dates and
    times, and updating the DOM dynamically.


    Topics Covered:


    - HTML structure

    - CSS styling

    - JavaScript event listeners

    - Working with dates and times

    - DOM manipulation (updating text content)


    HTML:


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Clock</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <div class="clock-container">

    <h1>Digital Clock</h1>

    <p id="clockDisplay">00:00:00</p>

    </div>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    CSS:


    ```css

    body {

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    margin: 0;

    }

    .clock-container {

    text-align: center;

    background-color: #f0f0f0;

    padding: 20px;

    border-radius: 10px;

    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

    }

    #clockDisplay {

    font-size: 36px;

    margin-top: 20px;

    }

    ```


    JavaScript:


    ```javascript

    function updateClock() {

    const now = new Date();

    const hours = now.getHours().toString().padStart(2, ''0'');

    const minutes = now.getMinutes().toString().padStart(2, ''0'');

    const seconds = now.getSeconds().toString().padStart(2, ''0'');

    document.getElementById(''clockDisplay'').textContent = `${hours}:${minutes}:${seconds}`;

    }

    setInterval(updateClock, 1000);

    updateClock(); // Initial call to display clock immediately

    ```


    ## Responsive Navigation Menu


    Description:


    In this exercise, students will create a responsive navigation menu that collapses
    into a hamburger menu on smaller screens. This exercise introduces responsive
    design using CSS and handling click events in JavaScript.


    Topics Covered:


    - HTML structure

    - CSS styling

    - JavaScript event listeners

    - Responsive design

    - DOM manipulation (toggling classes)


    HTML:


