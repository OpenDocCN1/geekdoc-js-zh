    \ 属性被更改以在浅色和深色模式之间切换。\n\n在“切换深色模式”练习中，CSS 中的过渡效果有什么作用？\n\nA) 它立即改变文本颜色\n\nB) 它平滑地改变背景和文本颜色\n\
