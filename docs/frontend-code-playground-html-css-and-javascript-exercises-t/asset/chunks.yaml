    ### Toggle Dark Mode


    **Description:**


    In this exercise, students will create a webpage with a button that toggles between
    light and dark modes. This exercise introduces changing CSS styles dynamically
    based on user interaction.


    **Topics Covered:**


    ● HTML structure


    ● CSS styling


    ● JavaScript event listeners


    ● DOM manipulation (changing styles)


    **HTML:**


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toggle Dark Mode</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <button id="toggleButton">Toggle Dark Mode</button>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    **CSS:**


    ```css

    body {

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    margin: 0;

    background-color: white;

    color: black;

    transition: background-color 0.3s, color 0.3s;

    }


    button {

    padding: 10px 20px;

    font-size: 16px;

    cursor: pointer;

    }


    body.dark-mode {

    background-color: black;

    color: white;

    }

    ```


    **JavaScript:**


    ```javascript

    document.getElementById(''toggleButton'').addEventListener(''click'', function()
    {

    document.body.classList.toggle(''dark-mode'');

    });

    ```


    ### Filter List Items


    **Description:**


    In this exercise, students will create a webpage with an input field to filter
    list items. As the user types in the input field, the list will be filtered to
    show only the items that match the input. This exercise introduces filtering and
    searching within the DOM.


    **Topics Covered:**


    ● HTML structure


    ● CSS styling


    ● JavaScript event listeners


    ● DOM manipulation (filtering elements)


    **HTML:**


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Filter List Items</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <input type="text" id="filterInput" placeholder="Filter items...">

    <ul id="itemList">

    <li>Apple</li>

    <li>Banana</li>

    <li>Cherry</li>

    <li>Date</li>

    <li>Fig</li>

    <li>Grape</li>

    </ul>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    **CSS:**


    ```css

    body {

    font-family: Arial, sans-serif;

    display: flex;

    flex-direction: column;

    align-items: center;

    height: 100vh;

    justify-content: center;

    margin: 0;

    }


    input {

    padding: 10px;

    font-size: 16px;

    margin-bottom: 10px;

    }


    ul {

    list-style-type: none;

    padding: 0;

    }


    li {

    font-size: 18px;

    margin: 5px 0;

    }

    ```


    **JavaScript:**


    ```javascript

    document.getElementById(''filterInput'').addEventListener(''input'', function()
    {

    const filter = this.value.toLowerCase();

    const items = document.querySelectorAll(''#itemList li'');

    items.forEach(item => {

    if (item.textContent.toLowerCase().includes(filter)) {

    item.style.display = '''';

    } else {

    item.style.display = ''none'';

    }

    });

    });

    ```


    ### Accordion Menu


    **Description:**


    In this exercise, students will create an accordion menu where clicking on a section
    header expands or collapses the content. This exercise introduces creating interactive
    menus using JavaScript.


    **Topics Covered:**


    ● HTML structure


    ● CSS styling


    ● JavaScript event listeners


    ● DOM manipulation (show/hide elements)


    **HTML:**


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accordion Menu</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <div class="accordion">

    <div class="accordion-item">

    <div class="accordion-header">Section 1</div>

    <div class="accordion-content">Content for section 1.</div>

    </div>

    <div class="accordion-item">

    <div class="accordion-header">Section 2</div>

    <div class="accordion-content">Content for section 2.</div>

    </div>

    <div class="accordion-item">

    <div class="accordion-header">Section 3</div>

    <div class="accordion-content">Content for section 3.</div>

    </div>

    </div>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    **CSS:**


    ```css

    body {

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    margin: 0;

    }


    .accordion {

    width: 300px;

    }


    .accordion-item {

    border: 1px solid #ccc;

    border-radius: 5px;

    margin-bottom: 10px;

    }


    .accordion-header {

    background-color: #f0f0f0;

    padding: 10px;

    cursor: pointer;

    font-weight: bold;

    }


    .accordion-content {

    display: none;

    padding: 10px;

    }

    ```


    **JavaScript:**


    ```javascript

    document.querySelectorAll(''.accordion-header'').forEach(header => {

    header.addEventListener(''click'', function() {

    const content = this.nextElementSibling;

    if (content.style.display === ''block'') {

    content.style.display = ''none'';

    } else {

    content.style.display = ''block'';

    }

    });

    });

    ```


    ### Create a Modal Popup


    **Description:**


    In this exercise, students will create a modal popup that appears when a button
    is clicked and disappears when the close button inside the modal is clicked. This
    exercise introduces creating overlays and handling multiple events.


    **Topics Covered:**


    ● HTML structure


    ● CSS styling


    ● JavaScript event listeners


    ● DOM manipulation (show/hide elements)


    **HTML:**


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modal Popup</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <button id="openModalButton">Open Modal</button>

    <div id="modal" class="modal">

    <div class="modal-content">

    <span id="closeModalButton" class="close">&times;</span>

    <p>This is a modal popup!</p>

    </div>

    </div>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    **CSS:**


    ```css

    body {

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    margin: 0;

    }


    button {

    padding: 10px 20px;

    font-size: 16px;

    cursor: pointer;

    }


    .modal {

    display: none;

    position: fixed;

    z-index: 1;

    left: 0;

    top: 0;

    width: 100%;

    height: 100%;

    background-color: rgba(0, 0, 0, 0.5);

    justify-content: center;

    align-items: center;

    }


    .modal-content {

    background-color: white;

    padding: 20px;

    border-radius: 5px;

    width: 300px;

    text-align: center;

    }


    .close {

    position: absolute;

    top: 10px;

    right: 10px;

    cursor: pointer;

    font-size: 24px;

    }

    ```


    **JavaScript:**


    ```javascript

    document.getElementById(''openModalButton'').addEventListener(''click'', function()
    {

    document.getElementById(''modal'').style.display = ''flex'';

    });


    document.getElementById(''closeModalButton'').addEventListener(''click'', function()
    {

    document.getElementById(''modal'').style.display = ''none'';

    });

    ```


