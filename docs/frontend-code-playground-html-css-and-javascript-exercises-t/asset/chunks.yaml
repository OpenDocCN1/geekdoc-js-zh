  trans: "\n\n```html\n<button class=\"tab-button\" data-tab=\"tab2\">Tab 2</button>\n\
    \n<button class=\"tab-button\" data-tab=\"tab3\">Tab 3</button>\n\n</div>\n\n\
    <div class=\"tab-content\" id=\"tab1\">Content for Tab 1</div>\n\n<div class=\"\
    tab-content\" id=\"tab2\">Content for Tab 2</div>\n\n<div class=\"tab-content\"\
    \ id=\"tab3\">Content for Tab 3</div>\n\n<script src=\"script.js\"></script>\n\
    \n</body>\n\n</html>\n```\n\nCSS:\n\n```css\nbody {\n  font-family: Arial, sans-serif;\n\
    \  margin: 20px;\n}\n\n.tabs {\n  display: flex;\n  gap: 10px;\n}\n\n.tab-button\
    \ {\n  padding: 10px 20px;\n  cursor: pointer;\n  background-color: #f0f0f0;\n\
    \  border: 1px solid #ccc;\n  border-radius: 5px;\n}\n\n.tab-button.active {\n\
    \  background-color: #ccc;\n}\n\n.tab-content {\n  display: none;\n  margin-top:\
    \ 20px;\n  padding: 20px;\n  border: 1px solid #ccc;\n  border-radius: 5px;\n\
    \  background-color: #f9f9f9;\n}\n\n.tab-content.active {\n  display: block;\n\
    }\n```\n\nJavaScript:\n\n```javascript\ndocument.querySelectorAll('.tab-button').forEach(button\
    \ => {\n  button.addEventListener('click', function() {\n    document.querySelectorAll('.tab-button').forEach(btn\
    \ => btn.classList.remove('active'));\n    document.querySelectorAll('.tab-content').forEach(content\
    \ => content.classList.remove('active'));\n    this.classList.add('active');\n\
    \    document.getElementById(this.getAttribute('data-tab')).classList.add('active');\n\
    \  });\n});\n```\n\n### 随机名言生成器\n\n**描述：**\n\n在本练习中，学生将创建一个随机名言生成器，每次点击按钮时显示一条新名言。本练习介绍如何使用数组和随机选择元素。\n\
    \n**涵盖主题：**\n\n● HTML 结构  \n● CSS 样式  \n● JavaScript 事件监听器  \n● 数组  \n● DOM 操作（更新文本内容）\n\
    \nHTML:\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
    UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n  <title>Random Quote Generator</title>\n  <link rel=\"stylesheet\" href=\"\
    styles.css\">\n</head>\n<body>\n  <div class=\"quote-box\">\n    <p id=\"quoteDisplay\"\
    >Click the button to see a random quote.</p>\n    <button id=\"newQuoteButton\"\
    >New Quote</button>\n  </div>\n  <script src=\"script.js\"></script>\n</body>\n\
    </html>\n```\n\nCSS:\n\n```css\nbody {\n  font-family: Arial, sans-serif;\n  display:\
    \ flex;\n  justify-content: center;\n  align-items: center;\n  height: 100vh;\n\
    \  margin: 0;\n}\n\n.quote-box {\n  text-align: center;\n  background-color: #f0f0f0;\n\
    \  padding: 20px;\n  border-radius: 10px;\n  box-shadow: 0 0 10px rgba(0, 0, 0,\
    \ 0.1);\n}\n\nbutton {\n  margin-top: 20px;\n  padding: 10px 20px;\n  font-size:\
    \ 16px;\n  cursor: pointer;\n}\n```\n\nJavaScript:\n\n```javascript\nconst quotes\
    \ = [\n  \"The best way to predict the future is to invent it.\",\n  \"Life is\
    \ 10% what happens to us and 90% how we react to it.\",\n  \"The only limit to\
    \ our realization of tomorrow is our doubts of today.\",\n  \"Do not watch the\
    \ clock. Do what it does. Keep going.\",\n  \"Keep your face always toward the\
    \ sunshine—and shadows will fall behind you.\"\n];\n\ndocument.getElementById('newQuoteButton').addEventListener('click',\
    \ function() {\n  const randomIndex = Math.floor(Math.random() * quotes.length);\n\
    \  document.getElementById('quoteDisplay').textContent = quotes[randomIndex];\n\
    });\n```\n\n### 实时字符计数器\n\n**描述：**\n\n在本练习中，学生将创建一个实时字符计数器，当用户在文本区域输入时自动更新。本练习介绍如何使用输入事件和动态更新\
    \ DOM。\n\n**涵盖主题：**\n\n● HTML 结构  \n● CSS 样式  \n● JavaScript 事件监听器  \n● DOM 操作（更新文本内容）\n\
    \nHTML:\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
    UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n  <title>Real-time Character Counter</title>\n  <link rel=\"stylesheet\" href=\"\
    styles.css\">\n</head>\n<body>\n  <div class=\"counter-box\">\n    <textarea id=\"\
    textInput\" placeholder=\"Type something...\"></textarea>\n    <p id=\"charCount\"\
    >Characters: 0</p>\n  </div>\n  <script src=\"script.js\"></script>\n</body>\n\
    </html>\n```\n\nCSS:\n\n```css\nbody {\n  font-family: Arial, sans-serif;\n  display:\
    \ flex;\n  justify-content: center;\n  align-items: center;\n  height: 100vh;\n\
    \  margin: 0;\n}\n\n.counter-box {\n  text-align: center;\n  background-color:\
    \ #f0f0f0;\n  padding: 20px;\n  border-radius: 10px;\n  box-shadow: 0 0 10px rgba(0,\
    \ 0, 0, 0.1);\n}\n\ntextarea {\n  width: 100%;\n  height: 100px;\n  padding: 10px;\n\
    \  font-size: 16px;\n  margin-bottom: 10px;\n}\n\np {\n  font-size: 18px;\n  margin:\
    \ 0;\n}\n```\n\nJavaScript:\n\n```javascript\ndocument.getElementById('textInput').addEventListener('input',\
    \ function() {\n  const charCount = this.value.length;\n  document.getElementById('charCount').textContent\
    \ = `Characters: ${charCount}`;\n});\n```\n\n#### 多项选择题\n\n在灯箱图片查看器练习中，哪种方法用于在点击图片外部时关闭灯箱？\n\
    \na) `event.stopPropagation`  \nb) `event.preventDefault`  \nc) `event.target`\
    \  \nd) `event.currentTarget`\n\n答案：c) `event.target` 解释：`event.target` 属性用于判断点击是否发生在图片外部，从而关闭灯箱。\n\
    \n在工具提示悬停效果练习中，使用哪个 CSS 属性来创建平滑的过渡效果？\n\na) `transform`  \nb) `animation`  \n\
    c) `transition`  \nd) `visibility`\n\n答案：c) `transition` 解释：`transition` 属性用于创建工具提示可见性和不透明度的平滑过渡效果。\n\
    \n在工具提示悬停效果练习中，如何将工具提示文本动态添加到元素中？\n\na) 使用 `innerHTML`  \nb) 使用 `textContent`\
    \  \nc) 使用 `createElement` 和 `appendChild`  \nd) 使用 `insertAdjacentHTML`\n\n答案：c)\
    \ 使用 `createElement` 和 `appendChild` 解释：工具提示文本通过 `createElement` 和 `appendChild`\
    \ 方法动态创建并添加。\n\n如何在 JavaScript 中切换元素的可见性？\n\na) `style.visibility`  \nb) `style.display`\
    \  \nc) `classList.toggle`  \nd) 以上全部\n\n答案：d) 以上全部 解释：根据所需效果，可以使用 `style.visibility`、`style.display`\
    \ 或 `classList.toggle` 来切换可见性。\n\n在可折叠区域练习中，切换哪个 CSS 属性来显示或隐藏内容？\n\na) `visibility`\
    \  \nb) `opacity`  \nc) `display`  \nd) `height`\n\n答案：c) `display` 解释：`display`\
    \ 属性在 `block` 和 `none` 之间切换，以显示或隐藏可折叠内容。\n\n在拖放列表练习中，哪个 HTML 属性使元素可拖动？\n\na) `draggable`\
    \  \nb) `movable`  \nc) `sortable`  \nd) `dropzone`\n\n答案：a) `draggable` 解释：`draggable`\
    \ 属性用于指定元素可拖动。\n\n在拖放列表练习中，当可拖动元素被放下时触发哪个事件？\n\na) `dragend`  \nb) `dragstart`\
    \  \nc) `drop`  \nd) `dragenter`\n\n答案：c) `drop` 解释：当可拖动元素被放下时触发 `drop` 事件。\n\n\
    在简单计算器练习中，使用什么方法将按钮的值添加到显示屏？\n\na) `innerHTML`  \nb) `textContent`  \nc) `value`\
    \  \nd) `appendChild`\n\n答案：c) `value` 解释：使用 `value` 属性将按钮的值添加到显示屏。\n\n在简单计算器练习中，如何清除显示屏？\n\
    \na) `display.clear()`  \nb) `display.value = ''`  \nc) `display.reset()`  \n\
    d) `display.textContent = ''`\n\n答案：b) `display.value = ''` 解释：通过将 `value` 属性设置为空字符串来清除显示屏。\n\
    \n在标签页导航练习中，如何显示当前激活的标签页内容？\n\na) `style.display = 'block'`  \nb) `classList.add('active')`\
    \  \nc) `innerHTML`  \nd) `textContent`\n\n答案：b) `classList.add('active')` 解释：通过使用\
    \ `classList.add('active')` 添加 `active` 类来显示当前激活的标签页内容。\n\n在随机名言生成器练习中，使用什么方法从数组中随机选择一条名言？\n\
    \na) `Math.random()`  \nb) `Math.floor()`  \nc) `Array.prototype.random()`  \n\
    d) `Math.ceil()`\n\n答案：a) `Math.random()` 解释：使用 `Math.random()` 方法生成随机数，并使用 `Math.floor()`\
    \ 将其转换为数组索引范围内的整数。\n\n在实时字符计数器练习中，使用什么事件来更新字符计数？\n\na) `change`\n\n"
