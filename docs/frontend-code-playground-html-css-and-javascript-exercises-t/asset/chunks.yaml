    ### To-Do List with Local Storage


    Description:


    In this exercise, students will create a to-do list that saves tasks to local
    storage so they persist even after the page is refreshed. This exercise introduces
    working with local storage, handling form inputs, and dynamically updating the
    DOM.


    Topics Covered:


    ●       HTML structure


    ●       CSS styling


    ●       JavaScript event listeners


    ●       Local storage


    ●       DOM manipulation (adding, updating, and removing elements)


    HTML:


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List with Local Storage</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <div class="todo-container">

    <h1>To-Do List</h1>

    <form id="todoForm">

    <input type="text" id="taskInput" placeholder="Enter a new task" required>

    <button type="submit">Add Task</button>

    </form>

    <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    CSS:


    ```css

    body {

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    margin: 0;

    }

    .todo-container {

    text-align: center;

    background-color: #f0f0f0;

    padding: 20px;

    border-radius: 10px;

    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

    width: 300px;

    }

    ul {

    list-style-type: none;

    padding: 0;

    }

    li {

    padding: 10px;

    margin: 5px 0;

    background-color: #fff;

    border: 1px solid #ccc;

    border-radius: 5px;

    display: flex;

    justify-content: space-between;

    }

    button.remove {

    background: none;

    border: none;

    color: red;

    cursor: pointer;

    font-size: 16px;

    }

    ```


    JavaScript:


    ```javascript

    document.addEventListener(''DOMContentLoaded'', function() {

    const taskList = document.getElementById(''taskList'');

    const tasks = JSON.parse(localStorage.getItem(''tasks'')) || [];

    tasks.forEach(task => {

    addTaskToDOM(task);

    });

    document.getElementById(''todoForm'').addEventListener(''submit'', function(event)
    {

    event.preventDefault();

    const taskInput = document.getElementById(''taskInput'');

    const taskText = taskInput.value;

    if (taskText === '''') return;

    addTaskToDOM(taskText);

    tasks.push(taskText);

    localStorage.setItem(''tasks'', JSON.stringify(tasks));

    taskInput.value = '''';

    });

    function addTaskToDOM(taskText) {

    const li = document.createElement(''li'');

    li.textContent = taskText;

    const removeButton = document.createElement(''button'');

    removeButton.textContent = ''Remove'';

    removeButton.classList.add(''remove'');

    removeButton.addEventListener(''click'', function() {

    li.remove();

    const index = tasks.indexOf(taskText);

    tasks.splice(index, 1);

    localStorage.setItem(''tasks'', JSON.stringify(tasks));

    });

    li.appendChild(removeButton);

    taskList.appendChild(li);

    }

    });

    ```


