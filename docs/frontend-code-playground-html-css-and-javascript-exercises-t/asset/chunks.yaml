  trans: "\n\n```\n<link rel=\"stylesheet\" href=\"styles.css\">\n\n</head>\n\n<body>\n\
    \n<input type=\"text\" id=\"textInput\" placeholder=\"Enter new text\">\n\n<button\
    \ id=\"changeTextButton\">Change Text</button>\n\n<p id=\"textDisplay\">This is\
    \ the original text.</p>\n\n<script src=\"script.js\"></script>\n\n</body>\n\n\
    </html>\n```\n\nCSS:\n\n```\nbody {\n    font-family: Arial, sans-serif;\n   \
    \ display: flex;\n    flex-direction: column;\n    align-items: center;\n    height:\
    \ 100vh;\n    justify-content: center;\n    margin: 0;\n}\n\ninput {\n    padding:\
    \ 10px;\n    font-size: 16px;\n    margin-bottom: 10px;\n}\n\nbutton {\n    padding:\
    \ 10px 20px;\n    font-size: 16px;\n    cursor: pointer;\n    margin-bottom: 20px;\n\
    }\n\np {\n    font-size: 18px;\n}\n```\n\nJavaScript:\n\n```\ndocument.getElementById('changeTextButton').addEventListener('click',\
    \ function() {\n    const newText = document.getElementById('textInput').value;\n\
    \    document.getElementById('textDisplay').textContent = newText;\n});\n```\n\
    \n### 高亮列表项\n\n描述：\n\n在本练习中，学生将创建一个包含项目列表的网页。当点击某个项目时，其背景颜色会改变以突出显示。本练习介绍了事件委托和动态更新样式。\n\
    \n涵盖主题：\n\n● HTML 结构\n\n● CSS 样式\n\n● JavaScript 事件监听器\n\n● 事件委托\n\n● DOM 操作（更新样式）\n\
    \nHTML:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"\
    UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n    <title>Highlight List Items</title>\n    <link rel=\"stylesheet\" href=\"\
    styles.css\">\n</head>\n<body>\n    <ul id=\"itemList\">\n        <li>Item 1</li>\n\
    \        <li>Item 2</li>\n        <li>Item 3</li>\n        <li>Item 4</li>\n \
    \   </ul>\n    <script src=\"script.js\"></script>\n</body>\n</html>\n```\n\n\
    CSS:\n\n```\nbody {\n    font-family: Arial, sans-serif;\n    display: flex;\n\
    \    flex-direction: column;\n    align-items: center;\n    height: 100vh;\n \
    \   justify-content: center;\n    margin: 0;\n}\n\nul {\n    list-style-type:\
    \ none;\n    padding: 0;\n}\n\nli {\n    font-size: 18px;\n    margin: 5px 0;\n\
    \    padding: 10px;\n    cursor: pointer;\n}\n\nli.highlight {\n    background-color:\
    \ yellow;\n}\n```\n\nJavaScript:\n\n```\ndocument.getElementById('itemList').addEventListener('click',\
    \ function(event) {\n    if (event.target.tagName === 'LI') {\n        const items\
    \ = document.querySelectorAll('li');\n        items.forEach(item => item.classList.remove('highlight'));\n\
    \        event.target.classList.add('highlight');\n    }\n});\n```\n\n### 动态图片画廊\n\
    \n描述：\n\n在本练习中，学生将创建一个简单的图片画廊。当点击缩略图时，将显示该图片的较大版本。本练习介绍了处理点击事件和动态更新图片源。\n\n涵盖主题：\n\
    \n● HTML 结构\n\n● CSS 样式\n\n● JavaScript 事件监听器\n\n● DOM 操作（更改图片源）\n\nHTML:\n\n\
    ```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
    >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n    <title>Dynamic Image Gallery</title>\n    <link rel=\"stylesheet\" href=\"\
    styles.css\">\n</head>\n<body>\n    <div id=\"gallery\">\n        <img src=\"\
    thumbnail1.jpg\" alt=\"Thumbnail 1\" class=\"thumbnail\">\n        <img src=\"\
    thumbnail2.jpg\" alt=\"Thumbnail 2\" class=\"thumbnail\">\n        <img src=\"\
    thumbnail3.jpg\" alt=\"Thumbnail 3\" class=\"thumbnail\">\n    </div>\n    <div\
    \ id=\"display\">\n        <img id=\"largeImage\" src=\"placeholder.jpg\" alt=\"\
    Large Image\">\n    </div>\n    <script src=\"script.js\"></script>\n</body>\n\
    </html>\n```\n\nCSS:\n\n```\nbody {\n    font-family: Arial, sans-serif;\n   \
    \ display: flex;\n    flex-direction: column;\n    align-items: center;\n    height:\
    \ 100vh;\n    justify-content: center;\n    margin: 0;\n}\n\n#gallery {\n    display:\
    \ flex;\n    gap: 10px;\n}\n\n.thumbnail {\n    width: 100px;\n    cursor: pointer;\n\
    }\n\n#display {\n    margin-top: 20px;\n}\n\n#largeImage {\n    width: 300px;\n\
    }\n```\n\nJavaScript:\n\n```\ndocument.querySelectorAll('.thumbnail').forEach(thumbnail\
    \ => {\n    thumbnail.addEventListener('click', function() {\n        const largeImage\
    \ = document.getElementById('largeImage');\n        largeImage.src = this.src.replace('thumbnail',\
    \ 'large');\n    });\n});\n```\n\n### 交互式计数器\n\n描述：\n\n在本练习中，学生将创建一个带有增加和减少计数按钮的交互式计数器。本练习介绍了根据用户输入更新\
    \ DOM。\n\n涵盖主题：\n\n● HTML 结构\n\n● CSS 样式\n\n● JavaScript 事件监听器\n\n● DOM 操作（更新文本内容）\n\
    \nHTML:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"\
    UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n    <title>Interactive Counter</title>\n    <link rel=\"stylesheet\" href=\"\
    styles.css\">\n</head>\n<body>\n    <div id=\"counter\">\n        <button id=\"\
    decrementButton\">-</button>\n        <span id=\"count\">0</span>\n        <button\
    \ id=\"incrementButton\">+</button>\n    </div>\n    <script src=\"script.js\"\
    ></script>\n</body>\n</html>\n```\n\nCSS:\n\n```\nbody {\n    font-family: Arial,\
    \ sans-serif;\n    display: flex;\n    flex-direction: column;\n    align-items:\
    \ center;\n    height: 100vh;\n    justify-content: center;\n    margin: 0;\n\
    }\n\n#counter {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n\
    }\n\nbutton {\n    padding: 10px 20px;\n    font-size: 16px;\n    cursor: pointer;\n\
    }\n\nspan {\n    font-size: 24px;\n    width: 50px;\n    text-align: center;\n\
    }\n```\n\nJavaScript:\n\n```\nlet count = 0;\n\ndocument.getElementById('incrementButton').addEventListener('click',\
    \ function() {\n    count++;\n    document.getElementById('count').textContent\
    \ = count;\n});\n\ndocument.getElementById('decrementButton').addEventListener('click',\
    \ function() {\n    count--;\n    document.getElementById('count').textContent\
    \ = count;\n});\n```\n\n### 表单验证\n\n描述：\n\n在本练习中，学生将创建一个带有验证功能的简单表单。当点击提交按钮时，脚本将检查所有字段是否已填写，如果任何字段为空，则显示一条警告消息。本练习介绍了基本的表单验证。\n\
    \n涵盖主题：\n\n● HTML 结构\n\n● CSS 样式\n\n● JavaScript 事件监听器\n\n● 表单验证\n\n● DOM 操作（警告消息）\n\
    \nHTML:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"\
    UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n    <title>Form Validation</title>\n    <link rel=\"stylesheet\" href=\"styles.css\"\
    >\n</head>\n<body>\n    <form id=\"myForm\">\n        <input type=\"text\" id=\"\
    name\" placeholder=\"Name\">\n        <input type=\"email\" id=\"email\" placeholder=\"\
    Email\">\n        <button type=\"submit\">Submit</button>\n    </form>\n    <script\
    \ src=\"script.js\"></script>\n</body>\n</html>\n```\n\nCSS:\n\n```\nbody {\n\
    \    font-family: Arial, sans-serif;\n    display: flex;\n    flex-direction:\
    \ column;\n    align-items: center;\n    height: 100vh;\n    justify-content:\
    \ center;\n    margin: 0;\n}\n\nform {\n    display: flex;\n    flex-direction:\
    \ column;\n    gap: 10px;\n}\n\ninput {\n    padding: 10px;\n    font-size: 16px;\n\
    \    width: 200px;\n}\n\nbutton {\n    padding: 10px 20px;\n    font-size: 16px;\n\
    \    cursor: pointer;\n}\n```\n\nJavaScript:\n\n```\ndocument.getElementById('myForm').addEventListener('submit',\
    \ function(event) {\n    const name = document.getElementById('name').value;\n\
    \    const email = document.getElementById('email').value;\n    if (name === ''\
    \ || email === '') {\n        event.preventDefault();\n        alert('Please fill\
    \ out all fields.');\n    }\n});\n```\n\n#### 多项选择题\n\n在动态图片画廊练习中，使用什么方法为每个缩略图添加点击事件监听器？\n\
    \na) `addEventListener`\n\nb) `attachEvent`\n\nc) `onClick`\n\nd) `addListener`\n\
    \n答案：a) `addEventListener` 解释：`addEventListener` 方法用于将事件处理程序附加到指定元素。\n\n如何在 JavaScript\
    \ 中更改图片元素的源？\n\na) `element.src`\n\nb) `element.href`\n\nc) `element.link`\n\n\
    d) `element.url`\n\n答案：a) `element.src` 解释：图片元素的 `src` 属性用于获取或设置要显示的图片的 URL。\n\
    \n在交互式计数器练习中，使用什么方法更新 span 元素的文本内容？\n\na) `innerHTML`\n\nb) `textContent`\n\n\
    c) `innerText`\n\nd) `value`\n\n答案：b) `textContent` 解释：`textContent` 属性用于设置或返回元素的文本内容。\n\
    \n在 JavaScript 中，哪个事件用于检测表单何时被提交？\n\na) `click`\n\nb) `submit`\n\nc) `change`\n\
    \nd) `input`\n\n"
- fmt: '

    Answer: b) `submit` Explanation: The `submit` event is fired when a form is submitted.


    In the Form Validation exercise, how can you prevent the form from being submitted
    if validation fails?


    a) `return false`


    b) `event.stop`


    c) `event.preventDefault`


    d) `event.prevent`


    Answer: c) `event.preventDefault` Explanation: The `event.preventDefault` method
    is used to prevent the default action of the event from being triggered.


    Dynamic Image Gallery


    What is the primary purpose of the `forEach` method in the Dynamic Image Gallery
    exercise?


    A) To select the first element with a specific class


    B) To apply an event listener to each thumbnail


    C) To change the image source for all thumbnails


    D) To remove all thumbnail images


    Answer: B


    Explanation: The `forEach` method is used to apply an event listener to each thumbnail
    image.


    Which event triggers the display of the larger image in the Dynamic Image Gallery
    exercise?


    A) Mouseover


    B) Double click


    C) Click


    D) Key press


    Answer: C


    Explanation: The `click` event triggers the display of the larger image when a
    thumbnail is clicked.


    How is the source of the large image updated in the Dynamic Image Gallery exercise?


    A) By changing the `alt` attribute


    B) By changing the `src` attribute


    C) By adding a new image element


    D) By removing the old image element


    Answer: B


    Explanation: The `src` attribute of the large image element is updated to the
    source of the clicked thumbnail, with the filename modified to point to the larger
    version.


    What class do the thumbnail images have in the Dynamic Image Gallery exercise?


    A) `gallery`


    B) `display`


    C) `largeImage`


    D) `thumbnail`


    Answer: D


    Explanation: The thumbnail images have the class `thumbnail`.


    Interactive Counter


    What happens when the increment button is clicked in the Interactive Counter exercise?


    A) The count value is decremented by 1


    B) The count value is incremented by 1


    C) The count value is reset to 0


    D) The count value is displayed as a negative number


    Answer: B


    Explanation: Clicking the increment button increases the count value by 1.


    Where is the current count value displayed in the Interactive Counter exercise?


    A) In a `<div>` element


    B) In a `<span>` element


    C) In a `<p>` element


    D) In an `<h1>` element


    Answer: B


    Explanation: The current count value is displayed in a `<span>` element with the
    ID `count`.


    What JavaScript method is used to update the text content of the count display
    in the Interactive Counter exercise?


    A) `innerHTML`


    B) `value`


    C) `textContent`


    D) `appendChild`


    Answer: C


    Explanation: The `textContent` property is used to update the text content of
    the count display.


    Form Validation


    What event is used to validate the form in the Form Validation exercise?


    A) Click event on the submit button


    B) Keyup event on the input fields


    C) Submit event on the form


    D) Change event on the form


    Answer: C


    Explanation: The `submit` event on the form is used to validate the form when
    the submit button is clicked.


    What method prevents the form from submitting if validation fails in the Form
    Validation exercise?


    A) `stopPropagation()`


    B) `preventDefault()`


    C) `stopImmediatePropagation()`


    D) `return false`


    Answer: B


    Explanation: The `preventDefault()` method prevents the form from submitting if
    the validation fails.


    What message is displayed if any form fields are empty in the Form Validation
    exercise?


    A) "Form submitted successfully"


    B) "Please fill out all fields."


    C) "Invalid input"


    D) "Submission failed"


    Answer: B


    Explanation: An alert message saying "Please fill out all fields." is displayed
    if any form fields are empty.


    What JavaScript object is used to work with dates and times?


    a) `Time`


    b) `Date`


    c) `Calendar`


    d) `Clock`


    Answer: b) `Date` Explanation: The `Date` object is used to work with dates and
    times in JavaScript.


    How can you update the text content of an HTML element using JavaScript?


    a) `element.innerText`


    b) `element.textContent`


    c) `element.innerHTML`


    d) `element.updateText`


    Answer: b) `element.textContent` Explanation: The `textContent` property is used
    to set or return the text content of an element.


    What is event delegation?


    a) A technique to attach a single event listener to multiple elements


    b) A method to prevent event propagation


    c) A way to remove an event listener


    d) A property to change the event type


    Answer: a) A technique to attach a single event listener to multiple elements
    Explanation: Event delegation is a technique that allows you to attach a single
    event listener to a parent element to handle events for multiple child elements.


    Which method is used to add a new CSS class to an element in JavaScript?


    a) `element.classList.add()`


    b) `element.style.add()`


    c) `element.addClass()`


    d) `element.className.add()`


    Answer: a) `element.classList.add()` Explanation: The `classList.add()` method
    is used to add a new class to an element.


    In the "Highlight List Items" exercise, what event property is used to identify
    the clicked element?


    a) `event.target`


    b) `event.currentTarget`


    c) `event.srcElement`


    d) `event.element`


    Answer: a) `event.target` Explanation: The `target` property of the event object
    refers to the element that triggered the event.


    What is the purpose of the `new Date()` constructor in the Display Current Date
    and Time exercise?


    A) To format a string


    B) To create a new `Date` object representing the current date and time


    C) To add a delay


    D) To display an alert


    Answer: B


    Explanation: The `new Date()` constructor creates a new `Date` object that represents
    the current date and time.


    Which method is used to convert the `Date` object to a readable string in the
    Display Current Date and Time exercise?


    A) `toString()`


    B) `toDateString()`


    C) `toLocaleString()`


    D) `toUTCString()`


    Answer: C


    Explanation: The `toLocaleString()` method converts the `Date` object to a string
    representing the date and time in a readable format.


    Which HTML element is used to display the date and time in the Display Current
    Date and Time exercise?


    A) `<div>`


    B) `<p>`


    C) `<span>`


    D) `<h1>`


    Answer: B


    Explanation: The `<p>` element with the ID `dateTimeDisplay` is used to display
    the date and time.


    What triggers the display of the current date and time in the Display Current
    Date and Time exercise?


    A) Hovering over the button


    B) Clicking the button


    C) Double-clicking the button


    D) Loading the page


    Answer: B


    Explanation: Clicking the button with the ID `showDateTimeButton` triggers the
    display of the current date and time.


    What happens when the `changeTextButton` is clicked in the Change Text Content
    exercise?


    A) The text in the paragraph is changed to the input value


    B) The button text is changed


    C) The input field is cleared


    D) The paragraph is hidden


    Answer: A


    Explanation: Clicking the `changeTextButton` updates the text content of the paragraph
    with the ID `textDisplay` to the value entered in the input field.


    Which HTML element captures the user''s input in the Change Text Content exercise?


    A) `<textarea>`


    B) `<input>`


    C) `<button>`


    D) `<div>`


    Answer: B


    Explanation: The `<input>` element with the ID `textInput` captures the user''s
    input.


    What method is used to update the text content of an element in the Change Text
    Content exercise?


    A) `innerHTML`


    B) `innerText`


    C) `textContent`


    D) `value`


    Answer: C


    Explanation: The `textContent` property is used to update the text content of
    the paragraph element.


    What is the purpose of event delegation in the Highlight List Items exercise?


    A) To handle multiple event listeners for each list item


    B) To handle the click event on the entire list


    C) To style the list items


    D) To create new list items


    Answer: B


    Explanation: Event delegation is used to handle the `click` event on the entire
    list (`<ul>` element) instead of attaching event listeners to each individual
    list item.


    Which CSS class is added to a list item when it is clicked in the Highlight List
    Items exercise?


    A) `selected`


    B) `active`


    C) `highlight`


    D) `clicked`


    Answer: C


    Explanation: The `highlight` class is added to a clicked list item to change its
    background color.

