    What method is used to toggle the completed class on a task in the Simple To-Do
    List exercise?


    a) `classList.add`

    b) `classList.remove`

    c) `classList.toggle`

    d) `classList.change`


    Answer: c) `classList.toggle` Explanation: The `classList.toggle` method is used
    to add or remove the completed class when a task is clicked.


    In the Image Slider exercise, how often does the image change?


    a) Every second

    b) Every 2 seconds

    c) Every 3 seconds

    d) Every 5 seconds


    Answer: c) Every 3 seconds Explanation: The `setInterval` function is used to
    change the image every 3 seconds.


    How is the FAQ answer shown or hidden in the Interactive FAQ exercise?


    a) By changing the `innerHTML`

    b) By changing the `textContent`

    c) By toggling the `display` property

    d) By using the `visibility` property


    Answer: c) By toggling the `display` property Explanation: The `display` property
    is toggled between `block` and `none` to show or hide the FAQ answer.


