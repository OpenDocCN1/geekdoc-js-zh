    ### Stopwatch


    **Description:**


    In this exercise, students will create a stopwatch that can start, stop, and reset.
    This exercise introduces working with timers, controlling their execution, and
    updating the DOM dynamically.


    **Topics Covered:**


    - HTML structure

    - CSS styling

    - JavaScript event listeners

    - Working with timers

    - DOM manipulation (updating text content)


    HTML:


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stopwatch</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <div class="stopwatch-container">

    <h1>Stopwatch</h1>

    <p id="stopwatchDisplay">00:00:00</p>

    <div class="buttons">

    <button id="startButton">Start</button>

    <button id="stopButton">Stop</button>

    <button id="resetButton">Reset</button>

    </div>

    </div>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    CSS:


    ```css

    body {

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    margin: 0;

    }


    .stopwatch-container {

    text-align: center;

    background-color: #f0f0f0;

    padding: 20px;

    border-radius: 10px;

    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

    }


    #stopwatchDisplay {

    font-size: 36px;

    margin-bottom: 20px;

    }


    .buttons {

    display: flex;

    justify-content: center;

    gap: 10px;

    }


    button {

    padding: 10px 20px;

    font-size: 16px;

    cursor: pointer;

    }

    ```


    JavaScript:


    ```javascript

    let timer;

    let startTime;

    let elapsedTime = 0;

    let isRunning = false;


    function updateDisplay() {

    const display = document.getElementById(''stopwatchDisplay'');

    const time = new Date(elapsedTime);

    const minutes = time.getUTCMinutes().toString().padStart(2, ''0'');

    const seconds = time.getUTCSeconds().toString().padStart(2, ''0'');

    const milliseconds = Math.floor(time.getUTCMilliseconds() / 10).toString().padStart(2,
    ''0'');

    display.textContent = `${minutes}:${seconds}:${milliseconds}`;

    }


    document.getElementById(''startButton'').addEventListener(''click'', function()
    {

    if (!isRunning) {

    startTime = Date.now() - elapsedTime;

    timer = setInterval(function() {

    elapsedTime = Date.now() - startTime;

    updateDisplay();

    }, 10);

    isRunning = true;

    }

    });


    document.getElementById(''stopButton'').addEventListener(''click'', function()
    {

    if (isRunning) {

    clearInterval(timer);

    isRunning = false;

    }

    });


    document.getElementById(''resetButton'').addEventListener(''click'', function()
    {

    clearInterval(timer);

    elapsedTime = 0;

    updateDisplay();

    isRunning = false;

    });

    ```


    ### Password Strength Checker


    **Description:**


    In this exercise, students will create a password strength checker that provides
    feedback on the strength of the entered password. This exercise introduces working
    with form inputs and providing real-time feedback based on input values.


    **Topics Covered:**


    - HTML structure

    - CSS styling

    - JavaScript event listeners

    - DOM manipulation (updating text content and styles)

    - Real-time input validation


    HTML:


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Strength Checker</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <div class="password-container">

    <h1>Password Strength Checker</h1>

    <input type="password" id="passwordInput" placeholder="Enter password">

    <p id="strengthDisplay">Password Strength: </p>

    </div>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    CSS:


    ```css

    body {

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    margin: 0;

    }


    .password-container {

    text-align: center;

    background-color: #f0f0f0;

    padding: 20px;

    border-radius: 10px;

    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

    }


    input {

    padding: 10px;

    font-size: 16px;

    margin-bottom: 10px;

    }


    p {

    font-size: 18px;

    margin: 0;

    }

    ```


    JavaScript:


    ```javascript

    function checkStrength(password) {

    let strength = ''Weak'';

    const regexes = [

    /[a-z]/,

    /[A-Z]/,

    /[0-9]/,

    /[^a-zA-Z0-9]/

    ];

    const passedTests = regexes.filter(regex => regex.test(password)).length;

    if (password.length >= 8 && passedTests >= 3) {

    strength = ''Strong'';

    } else if (password.length >= 6 && passedTests >= 2) {

    strength = ''Medium'';

    }

    return strength;

    }


    document.getElementById(''passwordInput'').addEventListener(''input'', function()
    {

    const password = this.value;

    const strength = checkStrength(password);

    document.getElementById(''strengthDisplay'').textContent = `Password Strength:
    ${strength}`;

    });

    ```


