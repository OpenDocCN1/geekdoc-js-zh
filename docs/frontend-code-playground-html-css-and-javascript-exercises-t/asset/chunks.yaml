    ### Multiple Choice Questions


    What event listener is used to detect a button click in JavaScript?


    a) `click`

    b) `mouseover`

    c) `keydown`

    d) `load`


    Answer: a) `click` Explanation: The `click` event listener is used to detect when
    a button is clicked.


    How can you change the background color of a webpage using JavaScript?


    a) `document.body.color`

    b) `document.body.backgroundColor`

    c) `document.body.style.backgroundColor`

    d) `document.body.style.color`


    Answer: c) `document.body.style.backgroundColor` Explanation: To change the background
    color, you need to use `document.body.style.backgroundColor`.


    Which CSS property is used to hide an element in the DOM?


    a) `visibility`

    b) `opacity`

    c) `display`

    d) `hidden`


    Answer: c) `display` Explanation: The `display` property can be set to `none`
    to hide an element.


