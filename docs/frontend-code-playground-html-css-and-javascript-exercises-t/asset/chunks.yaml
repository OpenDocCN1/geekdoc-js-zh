    CSS:


    body {


    font-family: Arial, sans-serif;


    display: flex;


    justify-content: center;


    align-items: center;


    height: 100vh;


    margin: 0;


    }


    .calculator {


    display: flex;


    flex-direction: column;


    align-items: center;


    border: 1px solid #ccc;


    border-radius: 10px;


    padding: 20px;


    background-color: #f9f9f9;


    }


    #display {


    width: 200px;


    padding: 10px;


    margin-bottom: 10px;


    font-size: 18px;


    text-align: right;


    border: 1px solid #ccc;


    border-radius: 5px;


    }


    .buttons {


    display: grid;


    grid-template-columns: repeat(4, 50px);


