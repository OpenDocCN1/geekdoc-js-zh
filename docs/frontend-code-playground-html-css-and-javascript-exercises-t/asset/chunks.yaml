    ### Temperature Converter


    Description:


    In this exercise, students will create a temperature converter that converts temperatures
    between Celsius and Fahrenheit. This exercise introduces handling user inputs
    and performing calculations.


    Topics Covered:


    ●       HTML structure


    ●       CSS styling


    ●       JavaScript event listeners


    ●       Handling form inputs


    ●       Performing calculations


    HTML:


    ```

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <div class="converter">

    <h1>Temperature Converter</h1>

    <form id="converterForm">

    <input type="number" id="temperatureInput" placeholder="Enter temperature" required>

    <select id="unitSelect">

    <option value="CtoF">Celsius to Fahrenheit</option>

    <option value="FtoC">Fahrenheit to Celsius</option>

    </select>

    <button type="submit">Convert</button>

    </form>

    <p id="resultDisplay"></p>

    </div>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    CSS:


    ```

    body {

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    margin: 0;

    }

    .converter {

    text-align: center;

    background-color: #f0f0f0;

    padding: 20px;

    border-radius: 10px;

    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

    }

    form {

    display: flex;

    flex-direction: column;

    gap: 10px;

    }

    input, select, button {

    padding: 10px;

    font-size: 16px;

    }

    ```


    JavaScript:


    ```

    document.getElementById(''converterForm'').addEventListener(''submit'', function(event)
    {

    event.preventDefault();

    const temperature = parseFloat(document.getElementById(''temperatureInput'').value);

    const unit = document.getElementById(''unitSelect'').value;

    let convertedTemperature;

    if (unit === ''CtoF'') {

    convertedTemperature = (temperature * 9/5) + 32;

    } else {

    convertedTemperature = (temperature - 32) * 5/9;

    }

    document.getElementById(''resultDisplay'').textContent = `Converted Temperature:
    ${convertedTemperature.toFixed(2)}°`;

    });

    ```


