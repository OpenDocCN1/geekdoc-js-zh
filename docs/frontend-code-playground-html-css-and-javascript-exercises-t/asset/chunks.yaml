    \n答案：c) 使用 `remove` 方法 解释：`remove` 方法用于从 DOM 中移除列表项元素，并更新本地存储。\n\n在“BMI 计算器”练习中，身高输入使用的单位是？\n\
    \na) 米\n\nb) 英寸\n\nc) 英尺\n\nd) 厘米\n\n答案：d) 厘米 解释：身高输入以厘米为单位，然后转换为米用于 BMI 计算。\n\
    \n在“响应式导航菜单”练习中，用于切换导航菜单的事件是？\n\na) `mouseover`\n\nb) `click`\n\nc) `dblclick`\n\
