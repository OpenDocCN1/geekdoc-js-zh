    ### Number Guessing Game


    Description:


    In this exercise, students will create a number guessing game where the user has
    to guess a random number between 1 and 100\. This exercise introduces handling
    form inputs, generating random numbers, and dynamically updating the DOM.


    Topics Covered:


    ●       HTML structure


    ●       CSS styling


    ●       JavaScript event listeners


    ●       Handling form inputs


    ●       Generating random numbers


    ●       DOM manipulation (updating text content)


    HTML:


    <!DOCTYPE html>


    <html lang="en">


    <head>


    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Number Guessing Game</title>


    <link rel="stylesheet" href="styles.css">


    </head>


    <body>


    <div class="game-container">


    <h1>Number Guessing Game</h1>


    <form id="guessForm">


    <input type="number" id="guessInput" placeholder="Enter your guess" required>


    <button type="submit">Submit Guess</button>


    </form>


    <p id="resultDisplay">Guess a number between 1 and 100!</p>


    </div>


    <script src="script.js"></script>


    </body>


