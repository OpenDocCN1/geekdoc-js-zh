    ### Countdown Timer


    Description:


    In this exercise, students will create a countdown timer that counts down from
    a specified number of seconds and displays an alert when the time is up. This
    exercise introduces working with timers in JavaScript.


    Topics Covered:


    ●       HTML structure


    ●       CSS styling


    ●       JavaScript event listeners


    ●       Working with JavaScript timers (setInterval and clearInterval)


    HTML:


    <!DOCTYPE html>


    <html lang="en">


    <head>


    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Countdown Timer</title>


    <link rel="stylesheet" href="styles.css">


    </head>


    <body>


    <input type="number" id="timeInput" placeholder="Enter seconds">


    <button id="startButton">Start Countdown</button>


    <p id="timerDisplay">0</p>


    <script src="script.js"></script>


    </body>


    </html>


    CSS:


    body {


    font-family: Arial, sans-serif;


    display: flex;


    flex-direction: column;


    align-items: center;


    height: 100vh;


    justify-content: center;


    margin: 0;


    }


    input {


    padding: 10px;


    font-size: 16px;


    margin-bottom: 10px;


    }


    button {


    padding: 10px 20px;


    font-size: 16px;


    cursor: pointer;


    margin-bottom: 20px;


    }


    p {


    font-size: 24px;


    }


    JavaScript:


    let timer;


    let countdown;


    document.getElementById(''startButton'').addEventListener(''click'', function()
    {


    clearInterval(timer);


    const timeInput = document.getElementById(''timeInput'').value;


    countdown = parseInt(timeInput, 10);


    document.getElementById(''timerDisplay'').textContent = countdown;


    timer = setInterval(function() {


    countdown--;


    document.getElementById(''timerDisplay'').textContent = countdown;


    if (countdown <= 0) {


    clearInterval(timer);


    alert(''Time is up!'');


    }


    }, 1000);


    });


    #### Multiple Choice Questions


    What method is used to toggle a CSS class on an element in JavaScript?


    a) addClass


    b) removeClass


    c) toggleClass


    d) classList.toggle


    Answer: d) classList.toggle Explanation: The classList.toggle method is used to
    add or remove a class from an element, depending on whether the class is already
    present.


    In the Filter List Items exercise, which event is used to detect changes in the
    input field?


    a) change


    b) input


    c) keyup


    d) keydown


    Answer: b) input Explanation: The input event is fired when the value of an <input>,
    <textarea>, or <select> element has been changed.


    How can you select the next sibling element in the DOM using JavaScript?


    a) previousElementSibling


    b) nextElement


    c) nextSibling


    d) nextElementSibling


    Answer: d) nextElementSibling Explanation: The nextElementSibling property returns
    the element immediately following the specified one in its parent''s children
    list, and null if the specified element has no following sibling.


    In the Accordion Menu exercise, what is the initial display style of the accordion
    content?


    a) block


    b) inline


    c) none


    d) hidden


    Answer: c) none Explanation: The initial display style of the accordion content
    is set to none, meaning the content is hidden by default.


    What CSS property is commonly used to create smooth transitions when changing
    styles dynamically?


    a) animation


    b) transform


    c) transition


    d) duration


    Answer: c) transition Explanation: The transition property is used to create smooth
    transitions when CSS property values change dynamically.


    Toggle Dark Mode


    What event listener is used to trigger the dark mode toggle in the Toggle Dark
    Mode exercise?


    A) mouseover


    B) click


    C) dblclick


    D) keydown


    Answer: B


    Explanation: The click event listener is used to trigger the dark mode toggle
    when the button is clicked.


