    ### Change Background Color


    Description:


    In this exercise, students will create a simple webpage with a button that changes
    the background color of the page when clicked. This exercise introduces basic
    DOM manipulation and event handling.


    Topics Covered:


    ● HTML structure


    ● CSS styling


    ● JavaScript event listeners


    ● DOM manipulation


    HTML:


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Background Color</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <button id="changeColorButton">Change Background Color</button>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    CSS:


    ```css

    body {

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    margin: 0;

    background-color: #f0f0f0;

    }

    button {

    padding: 10px 20px;

    font-size: 16px;

    cursor: pointer;

    }

    ```


    JavaScript:


    ```javascript

    document.getElementById(''changeColorButton'').addEventListener(''click'', function()
    {

    document.body.style.backgroundColor = getRandomColor();

    });

    function getRandomColor() {

    const letters = ''0123456789ABCDEF'';

    let color = ''#'';

    for (let i = 0; i < 6; i++) {

    color += letters[Math.floor(Math.random() * 16)];

    }

    return color;

    }

    ```


    ### Show/Hide Text


    Description:


    In this exercise, students will create a webpage with a button that toggles the
    visibility of a paragraph of text. This exercise introduces the concepts of showing
    and hiding elements using JavaScript.


    Topics Covered:


    ● HTML structure


    ● CSS styling


    ● JavaScript event listeners


    ● DOM manipulation (show/hide elements)


    HTML:


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Show/Hide Text</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <button id="toggleTextButton">Show/Hide Text</button>

    <p id="text" style="display: none;">This is a sample text that can be shown or
    hidden.</p>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    CSS:


    ```css

    body {

    font-family: Arial, sans-serif;

    display: flex;

    flex-direction: column;

    align-items: center;

    height: 100vh;

    justify-content: center;

    margin: 0;

    }

    button {

    padding: 10px 20px;

    font-size: 16px;

    cursor: pointer;

    margin-bottom: 20px;

    }

    p {

    font-size: 18px;

    }

    ```


    JavaScript:


    ```javascript

    document.getElementById(''toggleTextButton'').addEventListener(''click'', function()
    {

    const text = document.getElementById(''text'');

    if (text.style.display === ''none'') {

    text.style.display = ''block'';

    } else {

    text.style.display = ''none'';

    }

    });

    ```


