    Answer: C


    Explanation: The CSS class dark-mode is added to the body element to enable dark
    mode.


    What CSS property is changed to switch between light and dark modes in the Toggle
    Dark Mode exercise?


    A) color


    B) background-color


    C) font-size


    D) margin


    Answer: B


    Explanation: The background-color property is changed to switch between light
    and dark modes.


    How does the transition effect in the CSS help in the Toggle Dark Mode exercise?


    A) It changes the text color instantly


    B) It smoothens the change of the background and text color


    C) It increases the font size


    D) It adds a delay before changing the color


    Answer: B


    Explanation: The transition effect smoothens the change of the background and
    text color, making the switch between light and dark modes more visually appealing.


    Filter List Items


    What JavaScript event is used to trigger the filtering of list items in the Filter
    List Items exercise?


    A) click


    B) input


    C) change


    D) mouseover


    Answer: B


    Explanation: The input event is used to trigger the filtering of list items as
    the user types in the input field.


    What method is used to convert text to lowercase for comparison in the Filter
    List Items exercise?


    A) toUpperCase()


    B) toLowerCase()


    C) trim()


    D) substring()


    Answer: B


    Explanation: The toLowerCase() method is used to convert text to lowercase for
    case-insensitive comparison.


    What happens to list items that do not match the filter input in the Filter List
    Items exercise?


    A) They are deleted


    B) Their text color changes


    C) They are hidden


    D) They are moved to the bottom of the list


    Answer: C


    Explanation: List items that do not match the filter input are hidden by setting
    their display property to none.


    Accordion Menu


    What CSS property is used to hide the accordion content initially in the Accordion
    Menu exercise?


    A) visibility


    B) opacity


    C) display


    D) overflow


    Answer: C


    Explanation: The display property is set to none to hide the accordion content
    initially.


    What event listener is used to expand or collapse accordion sections in the Accordion
    Menu exercise?


    A) mouseover


    B) click


    C) dblclick


    D) focus


    Answer: B


    Explanation: The click event listener is used to expand or collapse accordion
    sections when the header is clicked.


    How does the JavaScript code determine which accordion content to show or hide
    in the Accordion Menu exercise?


    A) It uses a specific ID


    B) It uses the nextElementSibling property


    C) It uses a class name


    D) It uses an attribute selector


    Answer: B


    Explanation: The nextElementSibling property is used to select the content element
    following the clicked header to show or hide it.


    In the Modal Popup exercise, which method is used to display the modal?


    a) display = ''block''


    b) display = ''flex''


    c) show()


    d) visible = true


    Answer: b) display = ''flex'' Explanation: The modal is displayed using display
    = ''flex'' to center it using Flexbox.


    What method is used to navigate to the next image in the Image Carousel exercise?


    a) nextImage()


    b) next()


    c) src = nextImage


    d) addEventListener


    Answer: d) addEventListener Explanation: The addEventListener method is used to
    handle the click event for navigating to the next image.


    In the Countdown Timer exercise, which function is used to repeatedly execute
    code at set intervals?


    a) setTimeout


    b) setInterval


    c) clearInterval


    d) setTimer'
