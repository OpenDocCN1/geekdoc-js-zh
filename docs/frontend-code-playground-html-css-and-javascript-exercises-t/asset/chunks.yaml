    \    const priorityInput = document.getElementById('priorityInput');\n    const\
    \ taskText = taskInput.value;\n    const priority = priorityInput.value;\n   \
    \ if (taskText === '') return;\n    addTaskToDOM(taskText, priority);\n    sortTasks();\n\
    \    taskInput.value = '';\n});\n\nfunction addTaskToDOM(taskText, priority) {\n\
    \    const li = document.createElement('li');\n    li.textContent = `${taskText}\
    \ (${priority})`;\n    li.setAttribute('data-priority', priority);\n    const\
    \ removeButton = document.createElement('button');\n    removeButton.textContent\
    \ = 'Remove';\n    removeButton.classList.add('remove');\n    removeButton.addEventListener('click',\
    \ function() {\n        li.remove();\n    });\n    li.appendChild(removeButton);\n\
    \    document.getElementById('taskList').appendChild(li);\n}\n\nfunction sortTasks()\
    \ {\n    const taskList = document.getElementById('taskList');\n    const tasks\
    \ = Array.from(taskList.children);\n    tasks.sort((a, b) => {\n        const\
    \ priorities = { 'High': 3, 'Medium': 2, 'Low': 1 };\n        return priorities[b.getAttribute('data-priority')]\
    \ - priorities[a.getAttribute('data-priority')];\n    });\n    tasks.forEach(task\
    \ => taskList.appendChild(task));\n}\n```\n\n### 随机颜色生成器\n\n描述：\n\n在本练习中，学生将创建一个随机颜色生成器，每次点击按钮时页面背景颜色都会改变。本练习介绍如何处理按钮点击、生成随机颜色以及动态更新\
    \ DOM。\n\n涵盖主题：\n\n● HTML 结构\n\n● CSS 样式\n\n● JavaScript 事件监听器\n\n● 处理按钮点击\n\n\
    ● 生成随机颜色\n\n● DOM 操作（更新样式）\n\nHTML：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\"\
    >\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n<title>Random Color Generator</title>\n<link rel=\"stylesheet\"\
    \ href=\"styles.css\">\n</head>\n<body>\n<div class=\"color-generator-container\"\
    >\n<h1>Random Color Generator</h1>\n<button id=\"colorButton\">Generate Color</button>\n\
    </div>\n<script src=\"script.js\"></script>\n</body>\n</html>\n```\n\nCSS：\n\n\
    ```\nbody {\n    font-family: Arial, sans-serif;\n    display: flex;\n    justify-content:\
    \ center;\n    align-items: center;\n    height: 100vh;\n    margin: 0;\n}\n\n\
    .color-generator-container {\n    text-align: center;\n    background-color: #f0f0f0;\n\
    \    padding: 20px;\n    border-radius: 10px;\n    box-shadow: 0 0 10px rgba(0,\
    \ 0, 0, 0.1);\n}\n\nbutton {\n    padding: 10px 20px;\n    font-size: 16px;\n\
    \    cursor: pointer;\n}\n```\n\nJavaScript：\n\n```\ndocument.getElementById('colorButton').addEventListener('click',\
    \ function() {\n    const randomColor = `#${Math.floor(Math.random() * 16777215).toString(16)}`;\n\
    \    document.body.style.backgroundColor = randomColor;\n});\n```\n\n#### 多项选择题\n\
    \n在“带截止日期的待办事项列表”练习中，当点击任务的“移除”按钮时会发生什么？\n\na) 任务被划掉\n\nb) 任务从列表中移除\n\nc) 任务被编辑\n\
    \nd) 任务被标记为已完成\n\n答案：b) 任务从列表中移除 解释：点击“移除”按钮会将任务从列表中移除。\n\n在“带截止日期的待办事项列表”练习中，`dueDateInput`\
    \ 元素的用途是什么？\n\na) 输入任务描述\n\nb) 输入任务截止日期\n\nc) 显示任务总数\n\nd) 移除任务\n\n答案：b) 输入任务截止日期\
    \ 解释：`dueDateInput` 元素用于输入要添加到列表的新任务的截止日期。\n\n在“带分类的 BMI 计算器”练习中，什么 BMI 值被认为是“正常体重”？\n\
    \na) BMI < 18.5\n\nb) 18.5 ≤ BMI < 24.9\n\nc) 24.9 ≤ BMI < 29.9\n\nd) BMI ≥ 29.9\n\
    \n答案：b) 18.5 ≤ BMI < 24.9 解释：BMI 值在 18.5 到 24.9 之间被认为是“正常体重”。\n\n在“带分类的 BMI 计算器”练习中，使用什么事件来处理表单提交？\n\
    \na) `click`\n\nb) `submit`\n\nc) `change`\n\nd) `input`\n\n答案：b) `submit` 解释：使用\
    \ `submit` 事件来处理表单提交并执行 BMI 计算。\n\n在“带本地存储的待办事项列表”练习中，当任务被移除时会发生什么？\n\na) 任务被隐藏\n\
    \nb) 任务从 DOM 和本地存储中移除\n\nc) 任务被标记为已完成\n\nd) 任务被编辑\n\n答案：b) 任务从 DOM 和本地存储中移除 解释：当任务被移除时，它会从\
    \ DOM 和本地存储中删除。\n\n在“带本地存储的待办事项列表”练习中，任务存储在哪里以便页面刷新后仍然保留？\n\na) Cookies\n\nb)\
    \ 会话存储\n\nc) 本地存储\n\nd) IndexedDB\n\n答案：c) 本地存储 解释：任务存储在本地存储中，以便即使在页面刷新后也能保留。\n\
    \n在“简单测验应用”练习中，使用什么事件来处理表单提交？\n\na) `click`\n\nb) `submit`\n\nc) `input`\n\nd)\
    \ `change`\n\n答案：b) `submit` 解释：使用 `submit` 事件来处理表单提交并计算测验分数。\n\n在“随机数生成器”练习中，使用什么函数来生成随机数？\n\
    \na) `Math.random()`\n\nb) `Math.floor()`\n\nc) `Math.random()` 和 `Math.floor()`\n\
    \nd) `Math.ceil()`\n\n答案：c) `Math.random()` 和 `Math.floor()` 解释：`Math.random()`\
    \ 函数生成一个 0 到 1 之间的随机数，`Math.floor()` 用于获取指定范围内的整数。\n\n在“文本反转器”练习中，使用什么方法来反转输入文本？\n\
    \na) `reverse()`\n\nb) `split()`\n\nc) `split().reverse().join()`\n\nd) `join()`\n\
    \n答案：c) `split().reverse().join()` 解释：使用 `split().reverse().join()` 方法将输入文本拆分为数组，反转数组，然后重新连接成字符串。\n\
    \n在“简单测验应用”练习中，如何计算用户的分数？\n\na) 通过检查所选答案是否与正确答案匹配\n\nb) 通过统计问题数量\n\nc) 通过计算完成测验所花费的时间\n\
    \nd) 通过将用户的答案与最高分进行比较\n\n答案：a) 通过检查所选答案是否与正确答案匹配 解释：用户的分数是通过检查每个问题的所选答案是否与正确答案匹配来计算的。\n\
    \n在“随机数生成器”练习中，用户需要输入什么值？\n\na) 一个数字\n\nb) 最小值和最大值\n\nc) 一个数字范围\n\nd) 一个布尔值\n\n\
    答案：b) 最小值和最大值 解释：用户需要输入最小值和最大值来定义随机数生成的范围。\n\n在“互动故事”练习中，使用什么事件来处理用户的选择？\n\na)\
    \ `click`\n\nb) `submit`\n\nc) `input`\n\nd) `change`\n\n答案：a) `click` 解释：使用 `click`\
    \ 事件来处理用户的选择并更新故事。\n\n在“互动故事”练习中，当用户点击“走左边的小路”时会发生什么？\n\na) 故事结束\n\nb) 用户被要求打开或离开一个宝箱\n\
    \nc) 用户遇到一只熊\n\nd) 用户回家\n\n答案：b) 用户被要求打开或离开一个宝箱 解释：点击“走左边的小路”会引导用户到一个宝箱，并提供打开或离开的选项。\n\
    \n在“图片轮播”练习中，使用什么事件来浏览图片？\n\na) `mouseover`\n\nb) `click`\n\nc) `submit`\n\nd)\
    \ `input`\n\n答案：b) `click` 解释：使用 `click` 事件来处理图片轮播的导航按钮。\n\n在“带本地存储的任务列表”练习中，任务存储在哪里以便页面刷新后仍然保留？\n\
    \na) Cookies\n\nb) 会话存储\n\nc) 本地存储\n\nd) IndexedDB\n\n答案：c) 本地存储 解释：任务存储在本地存储中，以便即使在页面刷新后也能保留。\n\
    \n在“带本地存储的任务列表”练习中，当点击任务的“移除”按钮时会发生什么？\n\na) 任务被标记为已完成\n\nb) 任务被编辑\n\nc) 任务从 DOM\
    \ 和本地存储中移除\n\n"
