    \nc) 作为数组\n\nd) 作为字符串\n\n答案：b) 作为对象 解释：转换率被定义为一个对象，其中包含每个度量单位的嵌套对象。\n\n在单词反转器练习中，用于捕获句子的输入元素是什么？\n\
    \na) `input`\n\nb) `textarea`\n\nc) `select`\n\nd) `button`\n\n答案：b) `textarea`\
    \ 解释：`textarea` 元素用于捕获用户输入的句子。\n\n在交互式待办事项列表练习中，当任务标记为完成时，添加了什么类？\n\na) `done`\n\
    \nb) `finished`\n\nc) `completed`\n\nd) `checked`\n\n答案：c) `completed` 解释：当任务标记为完成时，会添加\
