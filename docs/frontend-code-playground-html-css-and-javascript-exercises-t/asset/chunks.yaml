    c) `<p>`


    d) `<h1>`


    Answer: c) `<p>`


    Explanation: The `<p>` element with the ID `resultDisplay` is used to display
    the converted value.


    Which method is used to reverse each word in the Word Reverser exercise?


    a) `split()`


    b) `reverse()`


    c) `join()`


    d) All of the above


    Answer: d) All of the above


    Explanation: To reverse each word, the text is split into an array of words using
    `split()`, each word is reversed using `reverse()`, and then joined back into
    a string using `join()`.


    What HTML element is used to input the text in the Word Reverser exercise?


    a) `<input>`


    b) `<textarea>`


    c) `<div>`


    d) `<p>`


    Answer: b) `<textarea>`


    Explanation: The `<textarea>` element with the ID `textInput` is used to input
    the sentence that will be reversed.


    How are tasks marked as complete in the Interactive To-Do List exercise?


    a) By changing the text content


    b) By adding a class to the task element


    c) By removing the task element


    d) By changing the color of the task element


    Answer: b) By adding a class to the task element


    Explanation: Tasks are marked as complete by toggling the `completed` class on
    the task element, which applies a line-through style.


    Which event listener is used to handle the form submission in the Interactive
    To-Do List exercise?


    a) `change`


    b) `click`


    c) `submit`


    d) `input`


    Answer: c) `submit`


    Explanation: The `submit` event listener is used to handle the form submission
    to add a new task to the list.


    What method is used to stop the timer in the Countdown Timer exercise?


    a) `clearTimeout()`


    b) `clearInterval()`


    c) `stopInterval()`


    d) `stopTimeout()`


    Answer: b) `clearInterval()`


    Explanation: The `clearInterval()` method is used to stop the timer by clearing
    the interval set by `setInterval()`.


    Which HTML element is used to display the remaining time in the Countdown Timer
    exercise?


    a) `<div>`


    b) `<span>`


    c) `<p>`


    d) `<h1>`


    Answer: c) `<p>`


    Explanation: The `<p>` element with the ID `timerDisplay` is used to display the
    remaining time.


    How are the user''s answers evaluated in the Interactive Quiz exercise?


    a) By comparing the text content of the labels


    b) By checking the values of the checked radio inputs


    c) By counting the number of checked radio inputs


    d) By validating the form input values


    Answer: b) By checking the values of the checked radio inputs


    Explanation: The user''s answers are evaluated by checking the values of the checked
    radio inputs and comparing them to the correct answers.


    What HTML element is used to display the quiz questions in the Interactive Quiz
    exercise?


    a) `<div>`


    b) `<ul>`


    c) `<p>`


    d) `<form>`


    Answer: a) `<div>`


    Explanation: The `<div>` element with the ID `quiz` is used to display the quiz
    questions.


