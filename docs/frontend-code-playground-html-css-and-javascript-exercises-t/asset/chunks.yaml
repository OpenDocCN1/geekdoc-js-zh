    ### Tip Calculator with Custom Split


    Description:


    In this exercise, students will create a tip calculator that calculates the tip
    amount and total bill per person based on user input for bill amount, tip percentage,
    and number of people. This exercise introduces handling multiple form inputs and
    performing calculations.


    Topics Covered:


    ●       HTML structure


    ●       CSS styling


    ●       JavaScript event listeners


    ●       Handling form inputs


    ●       Performing calculations


    HTML:


    <!DOCTYPE html>


    <html lang="en">


    <head>


    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Tip Calculator</title>


    <link rel="stylesheet" href="styles.css">


    </head>


    <body>


    <div class="calculator-container">


    <h1>Tip Calculator</h1>


    <form id="calculatorForm">


    <input type="number" id="billAmount" placeholder="Enter bill amount" required>


    <input type="number" id="tipPercentage" placeholder="Enter tip percentage" required>


    <input type="number" id="numberOfPeople" placeholder="Enter number of people"
    required>


    <button type="submit">Calculate</button>


    </form>


    <p id="tipAmountDisplay">Tip Amount: $0.00</p>


    <p id="totalAmountDisplay">Total Amount: $0.00</p>


    <p id="perPersonDisplay">Amount per Person: $0.00</p>


    </div>


    <script src="script.js"></script>


    </body>


    </html>


    CSS:


    body {


    font-family: Arial, sans-serif;


    display: flex;


    justify-content: center;


    align-items: center;


    height: 100vh;


    margin: 0;


    }


    .calculator-container {


    text-align: center;


    background-color: #f0f0f0;


    padding: 20px;


    border-radius: 10px;


    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);


    }


    form {


    display: flex;


    flex-direction: column;


    gap: 10px;


    }


    input, button {


    padding: 10px;


    font-size: 16px;


    }


    p {


    font-size: 18px;


    margin: 5px 0;


    }


    JavaScript:


    document.getElementById(''calculatorForm'').addEventListener(''submit'', function(event)
    {


    event.preventDefault();


    const billAmount = parseFloat(document.getElementById(''billAmount'').value);


    const tipPercentage = parseFloat(document.getElementById(''tipPercentage'').value);


    const numberOfPeople = parseInt(document.getElementById(''numberOfPeople'').value);


    const tipAmount = (billAmount * (tipPercentage / 100)).toFixed(2);


    const totalAmount = (billAmount + parseFloat(tipAmount)).toFixed(2);


    const perPersonAmount = (totalAmount / numberOfPeople).toFixed(2);


    document.getElementById(''tipAmountDisplay'').textContent = `Tip Amount: $${tipAmount}`;


    document.getElementById(''totalAmountDisplay'').textContent = `Total Amount: $${totalAmount}`;


    document.getElementById(''perPersonDisplay'').textContent = `Amount per Person:
    $${perPersonAmount}`;


    });


