- fmt: "\nHTML:\n\n```html\n<div id=\"quiz\"></div>\n\n<button id=\"nextButton\">Next</button>\n\
    \n<p id=\"scoreDisplay\"></p>\n\n</div>\n\n<script src=\"script.js\"></script>\n\
    \n</body>\n\n</html>\n```\n\nCSS:\n\n```css\nbody {\n  font-family: Arial, sans-serif;\n\
    \  display: flex;\n  justify-content: center;\n  align-items: center;\n  height:\
    \ 100vh;\n  margin: 0;\n}\n.quiz-container {\n  text-align: center;\n  background-color:\
    \ #f0f0f0;\n  padding: 20px;\n  border-radius: 10px;\n  box-shadow: 0 0 10px rgba(0,\
    \ 0, 0, 0.1);\n  width: 300px;\n}\n#quiz {\n  margin-bottom: 20px;\n}\nbutton\
    \ {\n  padding: 10px 20px;\n  font-size: 16px;\n  cursor: pointer;\n}\np {\n \
    \ font-size: 18px;\n}\n```\n\nJavaScript:\n\n```javascript\nconst quizData = [\n\
    \  {\n    question: 'What is the capital of France?',\n    choices: ['Berlin',\
    \ 'Madrid', 'Paris', 'Rome'],\n    correct: 'Paris'\n  },\n  {\n    question:\
    \ 'What is 2 + 2?',\n    choices: ['3', '4', '5', '6'],\n    correct: '4'\n  },\n\
    \  {\n    question: 'Who wrote \"To Kill a Mockingbird\"?',\n    choices: ['Harper\
    \ Lee', 'Mark Twain', 'J.K. Rowling', 'Jane Austen'],\n    correct: 'Harper Lee'\n\
    \  }\n];\nlet currentQuestionIndex = 0;\nlet score = 0;\nconst quizElement = document.getElementById('quiz');\n\
    const nextButton = document.getElementById('nextButton');\nconst scoreDisplay\
    \ = document.getElementById('scoreDisplay');\nfunction loadQuestion() {\n  const\
    \ currentQuestion = quizData[currentQuestionIndex];\n  quizElement.innerHTML =\
    \ `\n    <p>${currentQuestion.question}</p>\n    ${currentQuestion.choices.map((choice,\
    \ index) => `\n      <label>\n        <input type=\"radio\" name=\"choice\" value=\"\
    ${choice}\">\n        ${choice}\n      </label>\n      <br>\n    `).join('')}\n\
    \  `;\n}\nfunction showScore() {\n  quizElement.style.display = 'none';\n  nextButton.style.display\
    \ = 'none';\n  scoreDisplay.textContent = `Your score: ${score} / ${quizData.length}`;\n\
    }\nnextButton.addEventListener('click', () => {\n  const selectedChoice = document.querySelector('input[name=\"\
    choice\"]:checked');\n  if (selectedChoice) {\n    const answer = selectedChoice.value;\n\
    \    if (answer === quizData[currentQuestionIndex].correct) {\n      score++;\n\
    \    }\n    currentQuestionIndex++;\n    if (currentQuestionIndex < quizData.length)\
    \ {\n      loadQuestion();\n    } else {\n      showScore();\n    }\n  } else\
    \ {\n    alert('Please select an answer');\n  }\n});\nloadQuestion();\n```\n\n\
    ### Random Background Color\n\nDescription:\n\nIn this exercise, students will\
