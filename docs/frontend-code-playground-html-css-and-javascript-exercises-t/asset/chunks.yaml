    ### Lightbox Image Viewer


    **Description:**


    In this exercise, students will create a lightbox image viewer that displays an
    image in an overlay when a thumbnail is clicked. Clicking outside the image or
    on a close button will close the lightbox. This exercise introduces handling multiple
    events and dynamic class manipulation.


    **Topics Covered:**


    - HTML structure

    - CSS styling

    - JavaScript event listeners

    - DOM manipulation (show/hide elements, changing classes)


    **HTML:**


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lightbox Image Viewer</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <div class="gallery">

    <img src="thumb1.jpg" alt="Thumbnail 1" class="thumbnail">

    <img src="thumb2.jpg" alt="Thumbnail 2" class="thumbnail">

    <img src="thumb3.jpg" alt="Thumbnail 3" class="thumbnail">

    </div>

    <div id="lightbox" class="lightbox">

    <span id="closeButton" class="close">&times;</span>

    <img id="lightboxImage" src="" alt="Large View">

    </div>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    **CSS:**


    ```css

    body {

    font-family: Arial, sans-serif;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    height: 100vh;

    margin: 0;

    }

    .gallery {

    display: flex;

    gap: 10px;

    }

    .thumbnail {

    width: 100px;

    cursor: pointer;

    }

    .lightbox {

    display: none;

    position: fixed;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    background-color: rgba(0, 0, 0, 0.8);

    justify-content: center;

    align-items: center;

    z-index: 1000;

    }

    .lightbox.active {

    display: flex;

    }

    .lightbox img {

    max-width: 80%;

    max-height: 80%;

    }

    .close {

    position: absolute;

    top: 20px;

    right: 20px;

    font-size: 24px;

    cursor: pointer;

    color: white;

    }

    ```


    **JavaScript:**


    ```javascript

    document.querySelectorAll(''.thumbnail'').forEach(thumbnail => {

    thumbnail.addEventListener(''click'', function() {

    const lightbox = document.getElementById(''lightbox'');

    const lightboxImage = document.getElementById(''lightboxImage'');

    lightboxImage.src = this.src.replace(''thumb'', ''large'');

    lightbox.classList.add(''active'');

    });

    });

    document.getElementById(''closeButton'').addEventListener(''click'', function()
    {

    document.getElementById(''lightbox'').classList.remove(''active'');

    });

    document.getElementById(''lightbox'').addEventListener(''click'', function(event)
    {

    if (event.target === this) {

    this.classList.remove(''active'');

    }

    });

    ```


