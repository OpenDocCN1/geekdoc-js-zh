  \ 'image2.jpg', 'image3.jpg'];\nlet currentIndex = 0;\ndocument.getElementById('prevButton').addEventListener('click',\
  \ function() {\n    currentIndex = (currentIndex === 0) ? images.length - 1 : currentIndex\
  \ - 1;\n    document.getElementById('carouselImage').src = images[currentIndex];\n\
  });\ndocument.getElementById('nextButton').addEventListener('click', function()\
  \ {\n    currentIndex = (currentIndex === images.length - 1) ? 0 : currentIndex\
  \ + 1;\n    document.getElementById('carouselImage').src = images[currentIndex];\n\
  });\n```\n\n## 倒计时器\n\n描述：\n\n在本练习中，学生将创建一个倒计时器，从指定的秒数开始倒计时，并在时间到时显示一个警告。本练习介绍了如何在\
  \ JavaScript 中使用定时器。\n\n涵盖主题：\n\n● HTML 结构\n\n● CSS 样式\n\n● JavaScript 事件监听器\n\n\
  ● 使用 JavaScript 定时器（`setInterval` 和 `clearInterval`）\n\nHTML：\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1.0\">\n<title>Countdown Timer</title>\n\
  <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n<input type=\"number\"\
  \ id=\"timeInput\" placeholder=\"Enter seconds\">\n<button id=\"startButton\">Start\
  \ Countdown</button>\n<p id=\"timerDisplay\">0</p>\n<script src=\"script.js\"></script>\n\
  </body>\n</html>\n```\n\nCSS：\n\n```css\nbody {\nfont-family: Arial, sans-serif;\n\
  display: flex;\nflex-direction: column;\nalign-items: center;\nheight: 100vh;\n\
  justify-content: center;\nmargin: 0;\n}\ninput {\npadding: 10px;\nfont-size: 16px;\n\
  margin-bottom: 10px;\n}\nbutton {\npadding: 10px 20px;\nfont-size: 16px;\ncursor:\
  \ pointer;\nmargin-bottom: 20px;\n}\np {\nfont-size: 24px;\n}\n```\n\nJavaScript：\n\
  \n```javascript\nlet timer;\nlet countdown;\ndocument.getElementById('startButton').addEventListener('click',\
  \ function() {\n    clearInterval(timer);\n    const timeInput = document.getElementById('timeInput').value;\n\
  \    countdown = parseInt(timeInput, 10);\n    document.getElementById('timerDisplay').textContent\
  \ = countdown;\n    timer = setInterval(function() {\n        countdown--;\n   \
  \     document.getElementById('timerDisplay').textContent = countdown;\n       \
  \ if (countdown <= 0) {\n            clearInterval(timer);\n            alert('Time\
  \ is up!');\n        }\n    }, 1000);\n});\n```\n\n### 多项选择题\n\n在 JavaScript 中，用于切换元素上\
  \ CSS 类的方法是哪个？\n\na) `addClass`\n\nb) `removeClass`\n\nc) `toggleClass`\n\nd) `classList.toggle`\n\
