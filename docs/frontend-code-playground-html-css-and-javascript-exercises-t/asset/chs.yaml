  C) 通过双击问题\n\nD) 通过右键点击问题\n\n答案：B\n\n解释：用户通过点击问题来显示答案。\n\n## 温度转换器\n\n描述：\n\n在本练习中，学生将创建一个温度转换器，用于在摄氏度和华氏度之间转换温度。本练习介绍如何处理用户输入和执行计算。\n\
  \n涵盖主题：\n\n●       HTML 结构\n\n●       CSS 样式\n\n●       JavaScript 事件监听器\n\n●  \
  \     处理表单输入\n\n●       执行计算\n\nHTML：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\"\
  >\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n<title>Temperature Converter</title>\n<link rel=\"stylesheet\"\
  \ href=\"styles.css\">\n</head>\n<body>\n<div class=\"converter\">\n<h1>Temperature\
  \ Converter</h1>\n<form id=\"converterForm\">\n<input type=\"number\" id=\"temperatureInput\"\
  \ placeholder=\"Enter temperature\" required>\n<select id=\"unitSelect\">\n<option\
  \ value=\"CtoF\">Celsius to Fahrenheit</option>\n<option value=\"FtoC\">Fahrenheit\
  \ to Celsius</option>\n</select>\n<button type=\"submit\">Convert</button>\n</form>\n\
  <p id=\"resultDisplay\"></p>\n</div>\n<script src=\"script.js\"></script>\n</body>\n\
  </html>\n```\n\nCSS：\n\n```\nbody {\nfont-family: Arial, sans-serif;\ndisplay: flex;\n\
  justify-content: center;\nalign-items: center;\nheight: 100vh;\nmargin: 0;\n}\n\
  .converter {\ntext-align: center;\nbackground-color: #f0f0f0;\npadding: 20px;\n\
  border-radius: 10px;\nbox-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\n}\nform {\ndisplay:\
  \ flex;\nflex-direction: column;\ngap: 10px;\n}\ninput, select, button {\npadding:\
  \ 10px;\nfont-size: 16px;\n}\n```\n\nJavaScript：\n\n```\ndocument.getElementById('converterForm').addEventListener('submit',\
  \ function(event) {\nevent.preventDefault();\nconst temperature = parseFloat(document.getElementById('temperatureInput').value);\n\
  const unit = document.getElementById('unitSelect').value;\nlet convertedTemperature;\n\
  if (unit === 'CtoF') {\nconvertedTemperature = (temperature * 9/5) + 32;\n} else\
  \ {\nconvertedTemperature = (temperature - 32) * 5/9;\n}\ndocument.getElementById('resultDisplay').textContent\
  \ = `Converted Temperature: ${convertedTemperature.toFixed(2)}°`;\n});\n```\n\n\
  ## 购物清单\n\n描述：\n\n在本练习中，学生将创建一个购物清单，可以添加和删除项目。本练习介绍如何处理表单输入、动态添加和删除 DOM 元素。\n\n\
  涵盖主题：\n\n●       HTML 结构\n\n●       CSS 样式\n\n●       JavaScript 事件监听器\n\n●    \
  \   DOM 操作（添加和删除元素）\n\nHTML：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  <meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n<title>Shopping List</title>\n<link rel=\"stylesheet\" href=\"\
  styles.css\">\n</head>\n<body>\n<div class=\"shopping-container\">\n<h1>Shopping\
  \ List</h1>\n<form id=\"shoppingForm\">\n<input type=\"text\" id=\"itemInput\" placeholder=\"\
  Enter item\" required>\n<button type=\"submit\">Add Item</button>\n</form>\n<ul\
  \ id=\"shoppingList\"></ul>\n</div>\n<script src=\"script.js\"></script>\n</body>\n\
  </html>\n```\n\nCSS：\n\n```\nbody {\nfont-family: Arial, sans-serif;\ndisplay: flex;\n\
  justify-content: center;\nalign-items: center;\nheight: 100vh;\nmargin: 0;\n}\n\
  .shopping-container {\ntext-align: center;\nbackground-color: #f0f0f0;\npadding:\
  \ 20px;\nborder-radius: 10px;\nbox-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\nwidth:\
  \ 300px;\n}\nul {\nlist-style-type: none;\npadding: 0;\n}\nli {\npadding: 10px;\n\
  margin: 5px 0;\nbackground-color: #fff;\nborder: 1px solid #ccc;\nborder-radius:\
  \ 5px;\ndisplay: flex;\njustify-content: space-between;\n}\nbutton.remove {\nbackground:\
  \ none;\nborder: none;\ncolor: red;\ncursor: pointer;\nfont-size: 16px;\n}\n```\n\
  \nJavaScript：\n\n```\ndocument.getElementById('shoppingForm').addEventListener('submit',\
  \ function(event) {\nevent.preventDefault();\nconst itemInput = document.getElementById('itemInput');\n\
  const itemText = itemInput.value;\nif (itemText === '') return;\nconst li = document.createElement('li');\n\
  li.textContent = itemText;\nconst removeButton = document.createElement('button');\n\
  removeButton.textContent = 'Remove';\nremoveButton.classList.add('remove');\nremoveButton.addEventListener('click',\
  \ function() {\nli.remove();\n});\nli.appendChild(removeButton);\ndocument.getElementById('shoppingList').appendChild(li);\n\
  itemInput.value = '';\n});\n```\n\n## 亮色/暗色模式切换\n\n描述：\n\n在本练习中，学生将创建一个亮色/暗色模式切换按钮，用于在亮色和暗色模式之间切换网页主题。本练习介绍如何切换\
  \ CSS 类并动态更新样式。\n\n涵盖主题：\n\n●       HTML 结构\n\n●       CSS 样式\n\n●       JavaScript\
  \ 事件监听器\n\n●       DOM 操作（切换类）\n\nHTML：\n\n\n\n\n\n## 浅色/深色模式切换\n\nHTML:\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"\
  viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Light/Dark\
  \ Mode Toggle</title>\n<link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n\
  <body>\n<div class=\"container\">\n<button id=\"toggleButton\">Toggle Light/Dark\
  \ Mode</button>\n</div>\n<script src=\"script.js\"></script>\n</body>\n</html>\n\
  ```\n\nCSS:\n\n```css\nbody {\nfont-family: Arial, sans-serif;\ndisplay: flex;\n\
  justify-content: center;\nalign-items: center;\nheight: 100vh;\nmargin: 0;\ntransition:\
  \ background-color 0.3s, color 0.3s;\n}\n\nbody.light-mode {\nbackground-color:\
  \ white;\ncolor: black;\n}\n\nbody.dark-mode {\nbackground-color: black;\ncolor:\
  \ white;\n}\n\n.container {\ntext-align: center;\n}\n\nbutton {\npadding: 10px 20px;\n\
  font-size: 16px;\ncursor: pointer;\n}\n```\n\nJavaScript:\n\n```javascript\ndocument.getElementById('toggleButton').addEventListener('click',\
  \ function() {\ndocument.body.classList.toggle('dark-mode');\ndocument.body.classList.toggle('light-mode');\n\
  });\n```\n\n## 秒表\n\n**描述：**\n\n在本练习中，学生将创建一个可以开始、停止和重置的秒表。本练习介绍如何使用定时器、控制其执行以及动态更新\
  \ DOM。\n\n**涉及主题：**\n\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- 定时器的使用\n- DOM\
  \ 操作（更新文本内容）\n\nHTML:\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  <meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n<title>Stopwatch</title>\n<link rel=\"stylesheet\" href=\"\
  styles.css\">\n</head>\n<body>\n<div class=\"stopwatch-container\">\n<h1>Stopwatch</h1>\n\
  <p id=\"stopwatchDisplay\">00:00:00</p>\n<div class=\"buttons\">\n<button id=\"\
  startButton\">Start</button>\n<button id=\"stopButton\">Stop</button>\n<button id=\"\
  resetButton\">Reset</button>\n</div>\n</div>\n<script src=\"script.js\"></script>\n\
  </body>\n</html>\n```\n\nCSS:\n\n```css\nbody {\nfont-family: Arial, sans-serif;\n\
  display: flex;\njustify-content: center;\nalign-items: center;\nheight: 100vh;\n\
  margin: 0;\n}\n\n.stopwatch-container {\ntext-align: center;\nbackground-color:\
  \ #f0f0f0;\npadding: 20px;\nborder-radius: 10px;\nbox-shadow: 0 0 10px rgba(0, 0,\
  \ 0, 0.1);\n}\n\n#stopwatchDisplay {\nfont-size: 36px;\nmargin-bottom: 20px;\n}\n\
  \n.buttons {\ndisplay: flex;\njustify-content: center;\ngap: 10px;\n}\n\nbutton\
  \ {\npadding: 10px 20px;\nfont-size: 16px;\ncursor: pointer;\n}\n```\n\nJavaScript:\n\
  \n```javascript\nlet timer;\nlet startTime;\nlet elapsedTime = 0;\nlet isRunning\
  \ = false;\n\nfunction updateDisplay() {\nconst display = document.getElementById('stopwatchDisplay');\n\
  const time = new Date(elapsedTime);\nconst minutes = time.getUTCMinutes().toString().padStart(2,\
  \ '0');\nconst seconds = time.getUTCSeconds().toString().padStart(2, '0');\nconst\
  \ milliseconds = Math.floor(time.getUTCMilliseconds() / 10).toString().padStart(2,\
  \ '0');\ndisplay.textContent = `${minutes}:${seconds}:${milliseconds}`;\n}\n\ndocument.getElementById('startButton').addEventListener('click',\
  \ function() {\nif (!isRunning) {\nstartTime = Date.now() - elapsedTime;\ntimer\
  \ = setInterval(function() {\nelapsedTime = Date.now() - startTime;\nupdateDisplay();\n\
  }, 10);\nisRunning = true;\n}\n});\n\ndocument.getElementById('stopButton').addEventListener('click',\
  \ function() {\nif (isRunning) {\nclearInterval(timer);\nisRunning = false;\n}\n\
  });\n\ndocument.getElementById('resetButton').addEventListener('click', function()\
  \ {\nclearInterval(timer);\nelapsedTime = 0;\nupdateDisplay();\nisRunning = false;\n\
  });\n```\n\n## 密码强度检查器\n\n**描述：**\n\n在本练习中，学生将创建一个密码强度检查器，根据输入的密码提供强度反馈。本练习介绍如何处理表单输入并根据输入值提供实时反馈。\n\
  \n**涉及主题：**\n\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- DOM 操作（更新文本内容和样式）\n- 实时输入验证\n\
  \nHTML:\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"\
  UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n<title>Password Strength Checker</title>\n<link rel=\"stylesheet\" href=\"styles.css\"\
  >\n</head>\n<body>\n<div class=\"password-container\">\n<h1>Password Strength Checker</h1>\n\
  <input type=\"password\" id=\"passwordInput\" placeholder=\"Enter password\">\n\
  <p id=\"strengthDisplay\">Password Strength: </p>\n</div>\n<script src=\"script.js\"\
  ></script>\n</body>\n</html>\n```\n\nCSS:\n\n```css\nbody {\nfont-family: Arial,\
  \ sans-serif;\ndisplay: flex;\njustify-content: center;\nalign-items: center;\n\
  height: 100vh;\nmargin: 0;\n}\n\n.password-container {\ntext-align: center;\nbackground-color:\
  \ #f0f0f0;\npadding: 20px;\nborder-radius: 10px;\nbox-shadow: 0 0 10px rgba(0, 0,\
  \ 0, 0.1);\n}\n\ninput {\npadding: 10px;\nfont-size: 16px;\nmargin-bottom: 10px;\n\
  }\n\np {\nfont-size: 18px;\nmargin: 0;\n}\n```\n\nJavaScript:\n\n```javascript\n\
  function checkStrength(password) {\nlet strength = 'Weak';\nconst regexes = [\n\
  /[a-z]/,\n/[A-Z]/,\n/[0-9]/,\n/[^a-zA-Z0-9]/\n];\nconst passedTests = regexes.filter(regex\
  \ => regex.test(password)).length;\nif (password.length >= 8 && passedTests >= 3)\
  \ {\nstrength = 'Strong';\n} else if (password.length >= 6 && passedTests >= 2)\
  \ {\nstrength = 'Medium';\n}\nreturn strength;\n}\n\ndocument.getElementById('passwordInput').addEventListener('input',\
  \ function() {\nconst password = this.value;\nconst strength = checkStrength(password);\n\
  document.getElementById('strengthDisplay').textContent = `Password Strength: ${strength}`;\n\
  });\n```\n\n## 小费计算器\n\n**描述：**\n\n在本练习中，学生将创建一个小费计算器，根据用户输入计算小费金额和总账单。本练习介绍如何处理用户输入并执行计算。\n\
  \n**涉及主题：**\n\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- 处理表单输入\n- 执行计算\n\nHTML:\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"\
  >\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
  <title>Tip Calculator</title>\n<link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n\
