  \ = 'block';\n}\n});\n});\n```\n\n## 创建模态弹窗\n\n**描述：**\n\n在本练习中，学生将创建一个模态弹窗，当点击按钮时显示，点击弹窗内的关闭按钮时消失。本练习介绍了创建覆盖层和处理多个事件。\n\
