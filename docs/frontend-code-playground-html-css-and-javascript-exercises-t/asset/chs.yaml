  q2\"]:checked');\nif (q2 && q2.value === 'b') {\nscore++;\n}\nconst resultDisplay\
  \ = document.getElementById('resultDisplay');\nresultDisplay.textContent = `You\
  \ scored ${score} out of 2.`;\n});\n```\n\n### Random Number Generator\n\n**描述：**\n\
  \n在此练习中，学生将创建一个随机数生成器，该生成器在指定范围内生成一个随机数并显示它。本练习介绍如何处理表单输入以及动态更新 DOM。\n\n**涵盖主题：**\n\
  \n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- 处理表单输入\n- 生成随机数\n- DOM 操作（更新文本内容）\n\
  \n**HTML：**\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"\
