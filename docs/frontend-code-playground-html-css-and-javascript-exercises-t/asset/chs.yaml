  ## 简单待办事项列表\n\n描述：\n\n在本练习中，学生将创建一个简单的待办事项列表，可以添加新任务并将其标记为已完成。本练习介绍了表单处理、动态向 DOM\
  \ 添加元素以及更新样式。\n\n涵盖主题：\n\n● HTML 结构\n\n● CSS 样式\n\n● JavaScript 事件监听器\n\n● DOM 操作（添加和更新元素）\n\
