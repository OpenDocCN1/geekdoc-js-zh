  \n涵盖主题：\n\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- Canvas API\n- 处理鼠标事件\n\nHTML：\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"\
