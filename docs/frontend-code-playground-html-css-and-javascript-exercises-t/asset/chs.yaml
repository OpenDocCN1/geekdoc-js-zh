  \    }\n    currentQuestionIndex++;\n    if (currentQuestionIndex < quizData.length)\
  \ {\n      loadQuestion();\n    } else {\n      showScore();\n    }\n  } else {\n\
  \    alert('Please select an answer');\n  }\n});\nloadQuestion();\n```\n\n### 随机背景颜色\n\
