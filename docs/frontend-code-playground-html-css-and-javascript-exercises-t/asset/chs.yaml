  \nD) `input`\n\n答案：C 解释：使用 `submit` 事件监听器处理表单提交，触发小费和总金额的计算。\n\n### 动态表格筛选\n\n描述：\n\
  \n在本练习中，学生将创建一个动态表格筛选器，允许用户根据输入筛选行。本练习介绍如何处理输入事件以及动态更新 DOM 以显示或隐藏表格行。\n\n涵盖主题：\n\
  \n● HTML 结构\n\n● CSS 样式\n\n● JavaScript 事件监听器\n\n● DOM 操作（根据输入筛选元素）\n\nHTML：\n\n\
  ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n\
  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Dynamic\
  \ Table Filter</title>\n<link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n\
  <body>\n<div class=\"filter-container\">\n<h1>Dynamic Table Filter</h1>\n<input\
  \ type=\"text\" id=\"filterInput\" placeholder=\"Filter table rows...\">\n<table\
  \ id=\"dataTable\">\n<thead>\n<tr>\n<th>Name</th>\n<th>Age</th>\n<th>City</th>\n\
  </tr>\n</thead>\n<tbody>\n<tr>\n<td>John Doe</td>\n<td>25</td>\n<td>New York</td>\n\
  </tr>\n<tr>\n<td>Jane Smith</td>\n<td>30</td>\n<td>Los Angeles</td>\n</tr>\n<tr>\n\
  <td>Mike Johnson</td>\n<td>45</td>\n<td>Chicago</td>\n</tr>\n<tr>\n```\n\n\n\n\n\
  \n<td>艾米丽·戴维斯</td>\n\n<td>22</td>\n\n<td>休斯顿</td>\n\n</tr>\n\n</tbody>\n\n</table>\n\
  \n</div>\n\n<script src=\"script.js\"></script>\n\n</body>\n\n</html>\n\nCSS：\n\n\
  ```css\nbody {\n  font-family: Arial, sans-serif;\n  display: flex;\n  justify-content:\
  \ center;\n  align-items: center;\n  height: 100vh;\n  margin: 0;\n}\n\n.filter-container\
  \ {\n  text-align: center;\n  background-color: #f0f0f0;\n  padding: 20px;\n  border-radius:\
  \ 10px;\n  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\n}\n\ninput {\n  padding: 10px;\n\
  \  font-size: 16px;\n  margin-bottom: 20px;\n  width: 100%;\n  box-sizing: border-box;\n\
  }\n\ntable {\n  width: 100%;\n  border-collapse: collapse;\n  margin-top: 20px;\n\
  }\n\nth, td {\n  padding: 10px;\n  border: 1px solid #ccc;\n}\n\nthead {\n  background-color:\
  \ #ddd;\n}\n```\n\nJavaScript：\n\n```javascript\ndocument.getElementById('filterInput').addEventListener('input',\
  \ function() {\n  const filter = this.value.toLowerCase();\n  const rows = document.querySelectorAll('#dataTable\
  \ tbody tr');\n  rows.forEach(row => {\n    const cells = row.querySelectorAll('td');\n\
  \    let match = false;\n    cells.forEach(cell => {\n      if (cell.textContent.toLowerCase().includes(filter))\
  \ {\n        match = true;\n      }\n    });\n    row.style.display = match ? ''\
  \ : 'none';\n  });\n});\n```\n\n### 模态弹窗\n\n**描述：**\n\n在本练习中，学生将创建一个可以通过按钮打开和关闭的模态弹窗。本练习介绍如何处理点击事件、切换类以及动态更新\
  \ DOM。\n\n**涵盖主题：**\n\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- DOM 操作（显示和隐藏元素）\n\
  \n**HTML：**\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
  UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n  <title>Modal Popup</title>\n  <link rel=\"stylesheet\" href=\"styles.css\"\
  >\n</head>\n<body>\n  <div class=\"modal-container\">\n    <button id=\"openModalButton\"\
  >Open Modal</button>\n    <div id=\"modal\" class=\"modal\">\n      <div class=\"\
  modal-content\">\n        <span id=\"closeModalButton\" class=\"close-button\">&times;</span>\n\
  \        <h2>Modal Title</h2>\n        <p>This is a simple modal popup.</p>\n  \
  \    </div>\n    </div>\n  </div>\n  <script src=\"script.js\"></script>\n</body>\n\
  </html>\n```\n\n**CSS：**\n\n```css\nbody {\n  font-family: Arial, sans-serif;\n\
  \  display: flex;\n  justify-content: center;\n  align-items: center;\n  height:\
  \ 100vh;\n  margin: 0;\n}\n\n.modal-container {\n  text-align: center;\n}\n\nbutton\
  \ {\n  padding: 10px 20px;\n  font-size: 16px;\n  cursor: pointer;\n}\n\n.modal\
  \ {\n  display: none;\n  position: fixed;\n  top: 0;\n  left: 0;\n  width: 100%;\n\
  \  height: 100%;\n  background-color: rgba(0, 0, 0, 0.5);\n  justify-content: center;\n\
  \  align-items: center;\n}\n\n.modal-content {\n  background-color: white;\n  padding:\
  \ 20px;\n  border-radius: 10px;\n  text-align: center;\n  position: relative;\n\
  }\n\n.close-button {\n  position: absolute;\n  top: 10px;\n  right: 10px;\n  font-size:\
  \ 24px;\n  cursor: pointer;\n}\n\n.modal.active {\n  display: flex;\n}\n```\n\n\
  **JavaScript：**\n\n```javascript\ndocument.getElementById('openModalButton').addEventListener('click',\
  \ function() {\n  document.getElementById('modal').classList.add('active');\n});\n\
  \ndocument.getElementById('closeModalButton').addEventListener('click', function()\
  \ {\n  document.getElementById('modal').classList.remove('active');\n});\n\nwindow.addEventListener('click',\
  \ function(event) {\n  const modal = document.getElementById('modal');\n  if (event.target\
  \ === modal) {\n    modal.classList.remove('active');\n  }\n});\n```\n\n### 带计次的秒表\n\
  \n**描述：**\n\n在本练习中，学生将创建一个带计次功能的秒表。本练习介绍如何使用定时器、处理用户输入以及动态更新 DOM。\n\n**涵盖主题：**\n\
  \n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- 定时器操作\n- DOM 操作（添加和更新元素）\n\n**HTML：**\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
  >\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
  \  <title>Stopwatch with Lap Times</title>\n  <link rel=\"stylesheet\" href=\"styles.css\"\
  >\n</head>\n<body>\n  <div class=\"stopwatch-container\">\n    <h1>Stopwatch</h1>\n\
  \    <p id=\"stopwatchDisplay\">00:00:00</p>\n    <div class=\"buttons\">\n    \
  \  <button id=\"startButton\">Start</button>\n      <button id=\"lapButton\">Lap</button>\n\
  \      <button id=\"resetButton\">Reset</button>\n    </div>\n    <h2>Lap Times</h2>\n\
  \    <ul id=\"laps\"></ul>\n  </div>\n  <script src=\"script.js\"></script>\n</body>\n\
  </html>\n```\n\n**CSS：**\n\n```css\nbody {\n  font-family: Arial, sans-serif;\n\
  \  display: flex;\n  justify-content: center;\n  align-items: center;\n  height:\
  \ 100vh;\n  margin: 0;\n}\n\n.stopwatch-container {\n  text-align: center;\n  background-color:\
  \ #f0f0f0;\n  padding: 20px;\n  border-radius: 10px;\n  box-shadow: 0 0 10px rgba(0,\
  \ 0, 0, 0.1);\n}\n\n#stopwatchDisplay {\n  font-size: 36px;\n  margin-bottom: 20px;\n\
  }\n\n.buttons {\n  display: flex;\n  justify-content: center;\n  gap: 10px;\n  margin-bottom:\
  \ 20px;\n}\n\nbutton {\n  padding: 10px 20px;\n  font-size: 16px;\n  cursor: pointer;\n\
  }\n\nul {\n  list-style-type: none;\n  padding: 0;\n}\n\nli {\n  padding: 5px;\n\
  \  border-bottom: 1px solid #ccc;\n}\n```\n\n**JavaScript：**\n\n```javascript\n\
  let timer;\nlet startTime;\nlet elapsedTime = 0;\nlet isRunning = false;\n\nfunction\
  \ updateDisplay() {\n  const display = document.getElementById('stopwatchDisplay');\n\
  \  const time = new Date(elapsedTime);\n  const minutes = time.getUTCMinutes().toString().padStart(2,\
  \ '0');\n  const seconds = time.getUTCSeconds().toString().padStart(2, '0');\n \
  \ const milliseconds = Math.floor(time.getUTCMilliseconds() / 10).toString().padStart(2,\
  \ '0');\n  display.textContent = `${minutes}:${seconds}:${milliseconds}`;\n}\n\n\
