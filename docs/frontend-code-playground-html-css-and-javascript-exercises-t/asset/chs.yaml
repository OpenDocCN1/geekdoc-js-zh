  \ 1</li>\n    <li draggable=\"true\">Item 2</li>\n    <li draggable=\"true\">Item\
  \ 3</li>\n    <li draggable=\"true\">Item 4</li>\n    <li draggable=\"true\">Item\
  \ 5</li>\n  </ul>\n  <script src=\"script.js\"></script>\n</body>\n</html>\n```\n\
  \n**CSS：**\n\n```css\nbody {\n  font-family: Arial, sans-serif;\n  display: flex;\n\
  \  justify-content: center;\n  align-items: center;\n  height: 100vh;\n  margin:\
  \ 0;\n}\nul {\n  list-style-type: none;\n  padding: 0;\n  width: 200px;\n}\nli {\n\
  \  padding: 10px;\n  margin: 5px 0;\n  background-color: #f0f0f0;\n  border: 1px\
  \ solid #ccc;\n  cursor: move;\n}\n```\n\n**JavaScript：**\n\n```javascript\nconst\
  \ list = document.getElementById('draggableList');\nlet draggedItem = null;\n\n\
  list.addEventListener('dragstart', function(event) {\n  draggedItem = event.target;\n\
  \  event.target.style.opacity = 0.5;\n});\n\nlist.addEventListener('dragend', function(event)\
  \ {\n  event.target.style.opacity = '';\n});\n\nlist.addEventListener('dragover',\
  \ function(event) {\n  event.preventDefault();\n});\n\nlist.addEventListener('dragenter',\
  \ function(event) {\n  if (event.target.tagName === 'LI') {\n    event.target.style.borderTop\
  \ = '2px solid #000';\n  }\n});\n\nlist.addEventListener('dragleave', function(event)\
  \ {\n  if (event.target.tagName === 'LI') {\n    event.target.style.borderTop =\
  \ '';\n  }\n});\n\nlist.addEventListener('drop', function(event) {\n  event.preventDefault();\n\
  \  if (event.target.tagName === 'LI') {\n    event.target.style.borderTop = '';\n\
  \    list.insertBefore(draggedItem, event.target);\n  }\n});\n```\n\n## 简易计算器\n\n\
  **描述：**\n\n在本练习中，学生将创建一个简易计算器，能够执行基本的算术运算（加、减、乘、除）。本练习介绍如何处理表单输入并使用 JavaScript 进行计算。\n\
  \n**涉及主题：**\n\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- 处理表单输入\n- 执行计算\n\n**HTML：**\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
  >\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
  \  <title>Simple Calculator</title>\n  <link rel=\"stylesheet\" href=\"styles.css\"\
  >\n</head>\n<body>\n  <div class=\"calculator\">\n    <input type=\"text\" id=\"\
  display\" disabled>\n    <div class=\"buttons\">\n      <button class=\"number\"\
  >7</button>\n      <button class=\"number\">8</button>\n      <button class=\"number\"\
  >9</button>\n      <button class=\"operator\">/</button>\n      <button class=\"\
  number\">4</button>\n      <button class=\"number\">5</button>\n      <button class=\"\
  number\">6</button>\n      <button class=\"operator\">*</button>\n      <button\
  \ class=\"number\">1</button>\n      <button class=\"number\">2</button>\n     \
  \ <button class=\"number\">3</button>\n      <button class=\"operator\">-</button>\n\
  \      <button class=\"number\">0</button>\n      <button id=\"clear\">C</button>\n\
  \      <button id=\"equals\">=</button>\n      <button class=\"operator\">+</button>\n\
  \    </div>\n  </div>\n  <script src=\"script.js\"></script>\n</body>\n</html>\n\
  ```\n\n**CSS：**\n\n```css\nbody {\n  font-family: Arial, sans-serif;\n  display:\
  \ flex;\n  justify-content: center;\n  align-items: center;\n  height: 100vh;\n\
  \  margin: 0;\n}\n.calculator {\n  display: flex;\n  flex-direction: column;\n \
  \ align-items: center;\n  border: 1px solid #ccc;\n  border-radius: 10px;\n  padding:\
  \ 20px;\n  background-color: #f9f9f9;\n}\n#display {\n  width: 200px;\n  padding:\
  \ 10px;\n  margin-bottom: 10px;\n  font-size: 18px;\n  text-align: right;\n  border:\
  \ 1px solid #ccc;\n  border-radius: 5px;\n}\n.buttons {\n  display: grid;\n  grid-template-columns:\
  \ repeat(4, 50px);\n  gap: 10px;\n}\nbutton {\n  width: 50px;\n  height: 50px;\n\
  \  font-size: 18px;\n  cursor: pointer;\n}\n```\n\n**JavaScript：**\n\n```javascript\n\
  let display = document.getElementById('display');\nlet buttons = Array.from(document.getElementsByClassName('number'));\n\
  let operators = Array.from(document.getElementsByClassName('operator'));\nlet clear\
  \ = document.getElementById('clear');\nlet equals = document.getElementById('equals');\n\
  let currentOperator = null;\nlet firstOperand = null;\nlet secondOperand = null;\n\
  \nbuttons.forEach(button => {\n  button.addEventListener('click', function() {\n\
  \    display.value += this.textContent;\n  });\n});\n\noperators.forEach(operator\
  \ => {\n  operator.addEventListener('click', function() {\n    if (display.value)\
  \ {\n      firstOperand = parseFloat(display.value);\n      currentOperator = this.textContent;\n\
  \      display.value = '';\n    }\n  });\n});\n\nclear.addEventListener('click',\
  \ function() {\n  display.value = '';\n  firstOperand = null;\n  secondOperand =\
  \ null;\n  currentOperator = null;\n});\n\nequals.addEventListener('click', function()\
  \ {\n  if (display.value) {\n    secondOperand = parseFloat(display.value);\n  \
  \  switch (currentOperator) {\n      case '+':\n        display.value = firstOperand\
  \ + secondOperand;\n        break;\n      case '-':\n        display.value = firstOperand\
  \ - secondOperand;\n        break;\n      case '*':\n        display.value = firstOperand\
  \ * secondOperand;\n        break;\n      case '/':\n        display.value = firstOperand\
  \ / secondOperand;\n        break;\n    }\n    firstOperand = null;\n    secondOperand\
  \ = null;\n    currentOperator = null;\n  }\n});\n```\n\n## 标签页导航\n\n**描述：**\n\n\
