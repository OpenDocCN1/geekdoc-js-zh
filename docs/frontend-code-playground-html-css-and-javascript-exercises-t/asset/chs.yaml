  \ 5px;\n}\n```\n\nJavaScript：\n\n```\nlet display = document.getElementById('display');\n\
  let buttons = Array.from(document.getElementsByClassName('number'));\nlet operators\
  \ = Array.from(document.getElementsByClassName('operator'));\nlet clear = document.getElementById('clear');\n\
  let equals = document.getElementById('equals');\nlet currentOperator = null;\nlet\
  \ firstOperand = null;\nlet secondOperand = null;\nlet history = document.getElementById('history');\n\
  \nbuttons.forEach(button => {\nbutton.addEventListener('click', function() {\ndisplay.value\
  \ += this.textContent;\n});\n});\n\noperators.forEach(operator => {\noperator.addEventListener('click',\
  \ function() {\nif (display.value) {\nfirstOperand = parseFloat(display.value);\n\
  currentOperator = this.textContent;\ndisplay.value = '';\n}\n});\n});\n\nclear.addEventListener('click',\
  \ function() {\ndisplay.value = '';\nfirstOperand = null;\nsecondOperand = null;\n\
  currentOperator = null;\n});\n\nequals.addEventListener('click', function() {\n\
  if (display.value) {\nsecondOperand = parseFloat(display.value);\nlet result;\n\
  switch (currentOperator) {\ncase '+':\nresult = firstOperand + secondOperand;\n\
  break;\ncase '-':\nresult = firstOperand - secondOperand;\nbreak;\ncase '*':\nresult\
  \ = firstOperand * secondOperand;\nbreak;\ncase '/':\nresult = firstOperand / secondOperand;\n\
  break;\n}\ndisplay.value = result;\nlet historyItem = document.createElement('li');\n\
  historyItem.textContent = `${firstOperand} ${currentOperator} ${secondOperand} =\
  \ ${result}`;\nhistory.appendChild(historyItem);\nfirstOperand = null;\nsecondOperand\
  \ = null;\ncurrentOperator = null;\n}\n});\n```\n\n### 自定义倒计时器\n\n描述：\n\n在本练习中，学生将创建一个倒计时器，用户可以输入自定义的倒计时时间。本练习介绍如何处理表单输入、使用定时器以及动态更新\
