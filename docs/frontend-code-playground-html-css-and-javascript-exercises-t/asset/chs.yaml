  option2\">走右边的小路</button>\n</div>\n<script src=\"script.js\"></script>\n</body>\n\
  </html>\n```\n\n**CSS：**\n```css\nbody {\nfont-family: Arial, sans-serif;\ndisplay:\
  \ flex;\njustify-content: center;\nalign-items: center;\nheight: 100vh;\nmargin:\
  \ 0;\n}\n.story-container {\ntext-align: center;\nbackground-color: #f0f0f0;\npadding:\
  \ 20px;\nborder-radius: 10px;\nbox-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\nwidth:\
