  if (answer.style.display === 'block') {\nanswer.style.display = 'none';\n} else\
  \ {\nanswer.style.display = 'block';\n}\n});\n});\n```\n\n## 货币转换器\n\n描述：\n\n在本练习中，学生将创建一个货币转换器，根据预定义的汇率将金额从一种货币转换为另一种货币。本练习介绍如何使用表单、处理用户输入以及执行计算。\n\
  \n涵盖主题：\n\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- 处理表单输入\n- 执行计算\n\nHTML：\n\n\
  ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n\
  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Currency\
  \ Converter</title>\n<link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n\
  <div class=\"converter\">\n<h1>Currency Converter</h1>\n<form id=\"converterForm\"\
  >\n<input type=\"number\" id=\"amountInput\" placeholder=\"Enter amount\" required>\n\
  <select id=\"currencySelect\">\n<option value=\"EUR\">USD to EUR</option>\n<option\
  \ value=\"GBP\">USD to GBP</option>\n<option value=\"JPY\">USD to JPY</option>\n\
  </select>\n<button type=\"submit\">Convert</button>\n</form>\n<p id=\"resultDisplay\"\
  ></p>\n</div>\n<script src=\"script.js\"></script>\n</body>\n</html>\n```\n\nCSS：\n\
  \n```css\nbody {\nfont-family: Arial, sans-serif;\ndisplay: flex;\njustify-content:\
  \ center;\nalign-items: center;\nheight: 100vh;\nmargin: 0;\n}\n.converter {\ntext-align:\
  \ center;\nbackground-color: #f0f0f0;\npadding: 20px;\nborder-radius: 10px;\nbox-shadow:\
  \ 0 0 10px rgba(0, 0, 0, 0.1);\n}\nform {\ndisplay: flex;\nflex-direction: column;\n\
  gap: 10px;\n}\ninput, select, button {\npadding: 10px;\nfont-size: 16px;\n}\n```\n\
  \nJavaScript：\n\n```javascript\nconst exchangeRates = {\nEUR: 0.85,\nGBP: 0.75,\n\
  JPY: 110.00\n};\ndocument.getElementById('converterForm').addEventListener('submit',\
  \ function(event) {\nevent.preventDefault();\nconst amount = parseFloat(document.getElementById('amountInput').value);\n\
  const currency = document.getElementById('currencySelect').value;\nconst rate =\
  \ exchangeRates[currency];\nconst convertedAmount = (amount * rate).toFixed(2);\n\
  document.getElementById('resultDisplay').textContent = `Converted Amount: ${convertedAmount}\
  \ ${currency}`;\n});\n```\n\n## 石头剪刀布游戏\n\n描述：\n\n在本练习中，学生将创建一个简单的石头剪刀布游戏，用户可以与电脑对战。本练习介绍如何处理用户输入、生成随机选择以及实现游戏逻辑。\n\
  \n涵盖主题：\n\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- 处理用户输入\n- 实现游戏逻辑\n\nHTML：\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"\
