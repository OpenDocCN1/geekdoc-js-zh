  \n## 灯箱图片查看器\n\n**描述：**\n\n在本练习中，学生将创建一个灯箱图片查看器，点击缩略图时在覆盖层中显示图片。点击图片外部或关闭按钮将关闭灯箱。本练习介绍如何处理多个事件和动态类操作。\n\
  \n**涉及主题：**\n\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- DOM 操作（显示/隐藏元素、更改类）\n\n\
  **HTML：**\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"\
  UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n<title>Lightbox Image Viewer</title>\n<link rel=\"stylesheet\" href=\"styles.css\"\
  >\n</head>\n<body>\n<div class=\"gallery\">\n<img src=\"thumb1.jpg\" alt=\"Thumbnail\
  \ 1\" class=\"thumbnail\">\n<img src=\"thumb2.jpg\" alt=\"Thumbnail 2\" class=\"\
  thumbnail\">\n<img src=\"thumb3.jpg\" alt=\"Thumbnail 3\" class=\"thumbnail\">\n\
  </div>\n<div id=\"lightbox\" class=\"lightbox\">\n<span id=\"closeButton\" class=\"\
  close\">&times;</span>\n<img id=\"lightboxImage\" src=\"\" alt=\"Large View\">\n\
  </div>\n<script src=\"script.js\"></script>\n</body>\n</html>\n```\n\n**CSS：**\n\
  \n```css\nbody {\nfont-family: Arial, sans-serif;\ndisplay: flex;\nflex-direction:\
  \ column;\nalign-items: center;\njustify-content: center;\nheight: 100vh;\nmargin:\
  \ 0;\n}\n.gallery {\ndisplay: flex;\ngap: 10px;\n}\n.thumbnail {\nwidth: 100px;\n\
  cursor: pointer;\n}\n.lightbox {\ndisplay: none;\nposition: fixed;\ntop: 0;\nleft:\
  \ 0;\nwidth: 100%;\nheight: 100%;\nbackground-color: rgba(0, 0, 0, 0.8);\njustify-content:\
  \ center;\nalign-items: center;\nz-index: 1000;\n}\n.lightbox.active {\ndisplay:\
  \ flex;\n}\n.lightbox img {\nmax-width: 80%;\nmax-height: 80%;\n}\n.close {\nposition:\
  \ absolute;\ntop: 20px;\nright: 20px;\nfont-size: 24px;\ncursor: pointer;\ncolor:\
  \ white;\n}\n```\n\n**JavaScript：**\n\n```javascript\ndocument.querySelectorAll('.thumbnail').forEach(thumbnail\
  \ => {\nthumbnail.addEventListener('click', function() {\nconst lightbox = document.getElementById('lightbox');\n\
  const lightboxImage = document.getElementById('lightboxImage');\nlightboxImage.src\
  \ = this.src.replace('thumb', 'large');\nlightbox.classList.add('active');\n});\n\
  });\ndocument.getElementById('closeButton').addEventListener('click', function()\
  \ {\ndocument.getElementById('lightbox').classList.remove('active');\n});\ndocument.getElementById('lightbox').addEventListener('click',\
  \ function(event) {\nif (event.target === this) {\nthis.classList.remove('active');\n\
  }\n});\n```\n\n## 工具提示悬停效果\n\n**描述：**\n\n在本练习中，学生将创建在悬停特定文本元素时出现的工具提示。本练习介绍鼠标事件和创建动态元素。\n\
  \n**涉及主题：**\n\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- DOM 操作（创建和定位元素）\n\n**HTML：**\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"\
  >\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
  <title>Tooltip Hover Effect</title>\n<link rel=\"stylesheet\" href=\"styles.css\"\
  >\n</head>\n<body>\n<p>Hover over the <span class=\"tooltip\" data-tooltip=\"This\
  \ is a tooltip!\">highlighted text</span> to see the tooltip.</p>\n<p>Hover over\
  \ this <span class=\"tooltip\" data-tooltip=\"Another tooltip!\">other text</span>\
  \ to see another tooltip.</p>\n<script src=\"script.js\"></script>\n</body>\n</html>\n\
  ```\n\n**CSS：**\n\n```css\nbody {\nfont-family: Arial, sans-serif;\nmargin: 50px;\n\
  }\n.tooltip {\nposition: relative;\ncursor: pointer;\ncolor: blue;\ntext-decoration:\
  \ underline;\n}\n.tooltip .tooltiptext {\nvisibility: hidden;\nwidth: 120px;\nbackground-color:\
  \ black;\ncolor: white;\ntext-align: center;\nborder-radius: 5px;\npadding: 5px;\n\
  position: absolute;\nz-index: 1;\nbottom: 125%; /* Position the tooltip above the\
  \ text */\nleft: 50%;\nmargin-left: -60px;\nopacity: 0;\ntransition: opacity 0.3s;\n\
  }\n.tooltip:hover .tooltiptext {\nvisibility: visible;\nopacity: 1;\n}\n```\n\n\
  **JavaScript：**\n\n```javascript\ndocument.querySelectorAll('.tooltip').forEach(item\
  \ => {\nitem.addEventListener('mouseenter', function() {\nconst tooltipText = document.createElement('div');\n\
  tooltipText.className = 'tooltiptext';\ntooltipText.innerHTML = this.getAttribute('data-tooltip');\n\
  this.appendChild(tooltipText);\n});\nitem.addEventListener('mouseleave', function()\
  \ {\nconst tooltipText = this.querySelector('.tooltiptext');\n```\n\n\n\n\n```\n\
  if (tooltipText) {\n  tooltipText.remove();\n}\n```\n\n## 可折叠区域\n\n**描述：**\n\n在本练习中，学生将创建可折叠区域，点击标题时展开或折叠。本练习介绍如何切换可见性和动态更改样式。\n\
  \n**涉及主题：**\n\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- DOM 操作（切换可见性）\n\n**HTML：**\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
  >\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
  \  <title>Collapsible Sections</title>\n  <link rel=\"stylesheet\" href=\"styles.css\"\
  >\n</head>\n<body>\n  <div class=\"collapsible\">\n    <div class=\"collapsible-header\"\
  >Section 1</div>\n    <div class=\"collapsible-content\">Content for section 1.</div>\n\
  \  </div>\n  <div class=\"collapsible\">\n    <div class=\"collapsible-header\"\
  >Section 2</div>\n    <div class=\"collapsible-content\">Content for section 2.</div>\n\
  \  </div>\n  <div class=\"collapsible\">\n    <div class=\"collapsible-header\"\
  >Section 3</div>\n    <div class=\"collapsible-content\">Content for section 3.</div>\n\
  \  </div>\n  <script src=\"script.js\"></script>\n</body>\n</html>\n```\n\n**CSS：**\n\
  \n```css\nbody {\n  font-family: Arial, sans-serif;\n  margin: 20px;\n}\n.collapsible\
  \ {\n  margin-bottom: 10px;\n  border: 1px solid #ccc;\n  border-radius: 5px;\n\
  }\n.collapsible-header {\n  background-color: #f0f0f0;\n  padding: 10px;\n  cursor:\
  \ pointer;\n  font-weight: bold;\n}\n.collapsible-content {\n  display: none;\n\
  \  padding: 10px;\n}\n```\n\n**JavaScript：**\n\n```javascript\ndocument.querySelectorAll('.collapsible-header').forEach(header\
  \ => {\n  header.addEventListener('click', function() {\n    const content = this.nextElementSibling;\n\
  \    if (content.style.display === 'block') {\n      content.style.display = 'none';\n\
  \    } else {\n      content.style.display = 'block';\n    }\n  });\n});\n```\n\n\
  ## 拖拽排序列表\n\n**描述：**\n\n在本练习中，学生将创建一个拖拽排序列表，通过拖放来重新排列项目。本练习介绍拖放事件和动态更新 DOM。\n\n\
  **涉及主题：**\n\n- HTML 结构\n- CSS 样式\n- JavaScript 拖放事件\n- DOM 操作（重新排列元素）\n\n**HTML：**\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
  >\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
