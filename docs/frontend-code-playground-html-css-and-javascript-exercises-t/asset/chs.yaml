  \n描述：\n\n在本练习中，学生将创建一个待办事项列表，该列表将任务保存到本地存储中，以便在页面刷新后仍然保留。本练习介绍了如何使用本地存储、处理表单输入以及动态更新\
  \ DOM。\n\n涵盖的主题：\n\n● HTML 结构\n\n● CSS 样式\n\n● JavaScript 事件监听器\n\n● 本地存储\n\n● DOM\
  \ 操作（添加、更新和删除元素）\n\nHTML：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  <meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n<title>To-Do List with Local Storage</title>\n<link rel=\"\
  stylesheet\" href=\"styles.css\">\n</head>\n<body>\n<div class=\"todo-container\"\
  >\n<h1>To-Do List</h1>\n<form id=\"todoForm\">\n<input type=\"text\" id=\"taskInput\"\
  \ placeholder=\"Enter a new task\" required>\n<button type=\"submit\">Add Task</button>\n\
  </form>\n<ul id=\"taskList\"></ul>\n</div>\n<script src=\"script.js\"></script>\n\
  </body>\n</html>\n```\n\nCSS：\n\n```css\nbody {\nfont-family: Arial, sans-serif;\n\
  display: flex;\njustify-content: center;\nalign-items: center;\nheight: 100vh;\n\
  margin: 0;\n}\n.todo-container {\ntext-align: center;\nbackground-color: #f0f0f0;\n\
  padding: 20px;\nborder-radius: 10px;\nbox-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\n\
  width: 300px;\n}\nul {\nlist-style-type: none;\npadding: 0;\n}\nli {\npadding: 10px;\n\
  margin: 5px 0;\nbackground-color: #fff;\nborder: 1px solid #ccc;\nborder-radius:\
  \ 5px;\ndisplay: flex;\njustify-content: space-between;\n}\nbutton.remove {\nbackground:\
  \ none;\nborder: none;\ncolor: red;\ncursor: pointer;\nfont-size: 16px;\n}\n```\n\
  \nJavaScript：\n\n```javascript\ndocument.addEventListener('DOMContentLoaded', function()\
  \ {\nconst taskList = document.getElementById('taskList');\nconst tasks = JSON.parse(localStorage.getItem('tasks'))\
  \ || [];\ntasks.forEach(task => {\naddTaskToDOM(task);\n});\ndocument.getElementById('todoForm').addEventListener('submit',\
  \ function(event) {\nevent.preventDefault();\nconst taskInput = document.getElementById('taskInput');\n\
  const taskText = taskInput.value;\nif (taskText === '') return;\naddTaskToDOM(taskText);\n\
  tasks.push(taskText);\nlocalStorage.setItem('tasks', JSON.stringify(tasks));\ntaskInput.value\
  \ = '';\n});\nfunction addTaskToDOM(taskText) {\nconst li = document.createElement('li');\n\
  li.textContent = taskText;\nconst removeButton = document.createElement('button');\n\
  removeButton.textContent = 'Remove';\nremoveButton.classList.add('remove');\nremoveButton.addEventListener('click',\
  \ function() {\nli.remove();\nconst index = tasks.indexOf(taskText);\ntasks.splice(index,\
  \ 1);\nlocalStorage.setItem('tasks', JSON.stringify(tasks));\n});\nli.appendChild(removeButton);\n\
  taskList.appendChild(li);\n}\n});\n```\n\n### BMI 计算器\n\n描述：\n\n\n\n\n\n## BMI 计算器\n\
  \n在此练习中，学生将创建一个 BMI（身体质量指数）计算器，根据用户输入的体重和身高计算 BMI。本练习介绍如何处理表单输入和执行计算。\n\n涵盖主题：\n\
