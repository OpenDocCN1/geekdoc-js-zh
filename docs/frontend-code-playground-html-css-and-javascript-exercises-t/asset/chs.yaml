  \ event.clientY - canvas.offsetTop);\nctx.stroke();\nctx.beginPath();\nctx.moveTo(event.clientX\
  \ - canvas.offsetLeft, event.clientY - canvas.offsetTop);\n}\n```\n\n### 带计圈功能的秒表\n\
