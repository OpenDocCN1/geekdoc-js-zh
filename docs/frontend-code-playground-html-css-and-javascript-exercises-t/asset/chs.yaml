  \ = 1`\n\n答案：b) `classList.add('active')` 解释：通过向模态元素添加 active 类，使用 `classList.add('active')`\
  \ 方法显示模态弹窗。\n\n\n\n\n\n在“带计圈功能的秒表”练习中，哪个函数用于定期更新显示？\n\na) `setTimeout`\nb) `setInterval`\n\
  c) `requestAnimationFrame`\nd) `setImmediate`\n\n答案：b) `setInterval` 解释：`setInterval`\
  \ 函数用于每 10 毫秒定期更新显示。\n\n在“带计圈功能的秒表”练习中，如何计算经过的时间？\n\na) `Date.now() - startTime`\n\
