  \ () => {\nstoryText.textContent = '你走了右边的小路，遇到了一只熊。你是与它搏斗还是逃跑？';\noption1.textContent\
  \ = '与熊搏斗';\noption2.textContent = '逃跑';\noption1.removeEventListener('click', arguments.callee);\n\
  option2.removeEventListener('click', arguments.callee);\noption1.addEventListener('click',\
  \ () => {\nstoryText.textContent = '你与熊搏斗并获胜了！你赢了！';\noption1.style.display = 'none';\n\
  option2.style.display = 'none';\n});\noption2.addEventListener('click', () => {\n\
  storyText.textContent = '你逃跑了，安全脱险。你赢了！';\noption1.style.display = 'none';\noption2.style.display\
  \ = 'none';\n});\n});\n```\n\n### 带本地存储的任务列表\n\n**描述：**  \n在此练习中，学生将创建一个任务列表，该列表将任务保存到本地存储中，以便在页面刷新后仍然保留。本练习介绍如何处理表单输入、动态更新\
  \ DOM 以及使用本地存储。\n\n**涵盖主题：**  \n● HTML 结构  \n● CSS 样式  \n● JavaScript 事件监听器  \n\
  ● 本地存储  \n● DOM 操作（添加、更新和删除元素）  \n● 处理表单输入\n\n**HTML：**\n```html\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1.0\">\n<title>带本地存储的任务列表</title>\n<link rel=\"\
  stylesheet\" href=\"styles.css\">\n</head>\n<body>\n<div class=\"task-list-container\"\
  >\n<h1>任务列表</h1>\n<form id=\"taskForm\">\n<input type=\"text\" id=\"taskInput\"\
  \ placeholder=\"输入新任务\" required>\n<button type=\"submit\">添加任务</button>\n</form>\n\
  <ul id=\"taskList\"></ul>\n</div>\n<script src=\"script.js\"></script>\n</body>\n\
  </html>\n```\n\n**CSS：**\n```css\nbody {\nfont-family: Arial, sans-serif;\ndisplay:\
  \ flex;\njustify-content: center;\nalign-items: center;\nheight: 100vh;\nmargin:\
  \ 0;\n}\n.task-list-container {\ntext-align: center;\nbackground-color: #f0f0f0;\n\
  padding: 20px;\nborder-radius: 10px;\nbox-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\n\
  width: 300px;\n}\nform {\ndisplay: flex;\nflex-direction: column;\ngap: 10px;\n\
  }\ninput, button {\npadding: 10px;\nfont-size: 16px;\n}\nul {\nlist-style-type:\
  \ none;\npadding: 0;\n}\nli {\npadding: 10px;\nmargin: 5px 0;\nbackground-color:\
  \ #fff;\nborder: 1px solid #ccc;\nborder-radius: 5px;\ndisplay: flex;\njustify-content:\
  \ space-between;\n}\nbutton.remove {\nbackground: none;\nborder: none;\ncolor: red;\n\
  cursor: pointer;\nfont-size: 16px;\n}\n```\n\n**JavaScript：**\n```javascript\ndocument.addEventListener('DOMContentLoaded',\
  \ function() {\nconst taskList = document.getElementById('taskList');\nconst tasks\
  \ = JSON.parse(localStorage.getItem('tasks')) || [];\ntasks.forEach(task => {\n\
  addTaskToDOM(task);\n});\n\ndocument.getElementById('taskForm').addEventListener('submit',\
  \ function(event) {\nevent.preventDefault();\nconst taskInput = document.getElementById('taskInput');\n\
  const taskText = taskInput.value;\nif (taskText === '') return;\naddTaskToDOM(taskText);\n\
  tasks.push(taskText);\nlocalStorage.setItem('tasks', JSON.stringify(tasks));\ntaskInput.value\
  \ = '';\n});\n\nfunction addTaskToDOM(taskText) {\nconst li = document.createElement('li');\n\
  li.textContent = taskText;\nconst removeButton = document.createElement('button');\n\
  removeButton.textContent = '删除';\nremoveButton.classList.add('remove');\nremoveButton.addEventListener('click',\
  \ function() {\nli.remove();\nconst index = tasks.indexOf(taskText);\nif (index\
  \ !== -1) {\ntasks.splice(index, 1);\nlocalStorage.setItem('tasks', JSON.stringify(tasks));\n\
  }\n});\nli.appendChild(removeButton);\ntaskList.appendChild(li);\n}\n});\n```\n\n\
  ### 带优先级的待办事项列表\n\n**描述：**  \n在此练习中，学生将创建一个待办事项列表，允许用户添加不同优先级的任务。本练习介绍如何处理表单输入、动态更新\
  \ DOM 以及根据优先级对元素进行排序。\n\n**涵盖主题：**  \n● HTML 结构  \n● CSS 样式  \n● JavaScript 事件监听器\
  \  \n● 处理表单输入  \n● DOM 操作（添加和排序元素）  \n● 使用数组\n\n**HTML：**\n```html\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1.0\">\n<title>带优先级的待办事项列表</title>\n<link rel=\"\
  stylesheet\" href=\"styles.css\">\n</head>\n<body>\n<div class=\"todo-container\"\
  >\n<h1>待办事项列表</h1>\n<form id=\"todoForm\">\n<input type=\"text\" id=\"taskInput\"\
  \ placeholder=\"输入新任务\" required>\n<select id=\"priorityInput\">\n<option value=\"\
  High\">高</option>\n<option value=\"Medium\">中</option>\n<option value=\"Low\">低</option>\n\
  </select>\n<button type=\"submit\">添加任务</button>\n</form>\n<ul id=\"taskList\"></ul>\n\
  </div>\n<script src=\"script.js\"></script>\n</body>\n</html>\n```\n\n**CSS：**\n\
  ```css\nbody {\nfont-family: Arial, sans-serif;\ndisplay: flex;\njustify-content:\
  \ center;\nalign-items: center;\nheight: 100vh;\nmargin: 0;\n}\n.todo-container\
  \ {\ntext-align: center;\nbackground-color: #f0f0f0;\npadding: 20px;\nborder-radius:\
  \ 10px;\nbox-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\nwidth: 300px;\n}\nform {\ndisplay:\
  \ flex;\nflex-direction: column;\ngap: 10px;\n}\ninput, select, button {\npadding:\
  \ 10px;\nfont-size: 16px;\n}\nul {\nlist-style-type: none;\npadding: 0;\n}\nli {\n\
  padding: 10px;\nmargin: 5px 0;\nbackground-color: #fff;\nborder: 1px solid #ccc;\n\
  border-radius: 5px;\ndisplay: flex;\njustify-content: space-between;\n}\nbutton.remove\
  \ {\nbackground: none;\nborder: none;\ncolor: red;\n```\n\n\n\n\n\n```\ncursor:\
  \ pointer;\n\nfont-size: 16px;\n\n}\n```\n\nJavaScript:\n\n```\ndocument.getElementById('todoForm').addEventListener('submit',\
  \ function(event) {\n    event.preventDefault();\n    const taskInput = document.getElementById('taskInput');\n\
  \    const priorityInput = document.getElementById('priorityInput');\n    const\
  \ taskText = taskInput.value;\n    const priority = priorityInput.value;\n    if\
  \ (taskText === '') return;\n    addTaskToDOM(taskText, priority);\n    sortTasks();\n\
  \    taskInput.value = '';\n});\n\nfunction addTaskToDOM(taskText, priority) {\n\
  \    const li = document.createElement('li');\n    li.textContent = `${taskText}\
  \ (${priority})`;\n    li.setAttribute('data-priority', priority);\n    const removeButton\
  \ = document.createElement('button');\n    removeButton.textContent = 'Remove';\n\
  \    removeButton.classList.add('remove');\n    removeButton.addEventListener('click',\
  \ function() {\n        li.remove();\n    });\n    li.appendChild(removeButton);\n\
  \    document.getElementById('taskList').appendChild(li);\n}\n\nfunction sortTasks()\
  \ {\n    const taskList = document.getElementById('taskList');\n    const tasks\
  \ = Array.from(taskList.children);\n    tasks.sort((a, b) => {\n        const priorities\
  \ = { 'High': 3, 'Medium': 2, 'Low': 1 };\n        return priorities[b.getAttribute('data-priority')]\
  \ - priorities[a.getAttribute('data-priority')];\n    });\n    tasks.forEach(task\
  \ => taskList.appendChild(task));\n}\n```\n\n### 随机颜色生成器\n\n描述：\n\n在本练习中，学生将创建一个随机颜色生成器，每次点击按钮时页面背景颜色都会改变。本练习介绍如何处理按钮点击、生成随机颜色以及动态更新\
