  }\n```\n\n### 带开始/停止/重置功能的倒计时器\n\n**描述：** 在本练习中，学生将创建一个倒计时器，允许用户开始、停止和重置倒计时。本练习介绍如何处理按钮点击、使用计时器以及动态更新\
  \ DOM。\n\n**涵盖主题：**\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- 处理按钮点击\n- 使用计时器\n\
  - DOM 操作（更新文本内容）\n\n#### HTML\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
  <head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n<title>倒计时器</title>\n<link rel=\"stylesheet\" href=\"styles.css\"\
  >\n</head>\n<body>\n<div class=\"timer-container\">\n<h1>倒计时器</h1>\n<form id=\"\
  timerForm\">\n<input type=\"number\" id=\"secondsInput\" placeholder=\"输入秒数\" required>\n\
  <button type=\"submit\">开始计时</button>\n</form>\n<p id=\"timerDisplay\">0:00</p>\n\
  <button id=\"stopButton\" disabled>停止</button>\n<button id=\"resetButton\" disabled>重置</button>\n\
  </div>\n<script src=\"script.js\"></script>\n</body>\n</html>\n```\n\n#### CSS\n\
  \n```css\nbody {\n  font-family: Arial, sans-serif;\n  display: flex;\n  justify-content:\
  \ center;\n  align-items: center;\n  height: 100vh;\n  margin: 0;\n}\n.timer-container\
  \ {\n  text-align: center;\n  background-color: #f0f0f0;\n  padding: 20px;\n  border-radius:\
  \ 10px;\n  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\n}\nform {\n  display: flex;\n\
  \  flex-direction: column;\n  gap: 10px;\n  margin-bottom: 20px;\n}\ninput, button\
  \ {\n  padding: 10px;\n  font-size: 16px;\n}\np {\n  font-size: 36px;\n  margin-top:\
  \ 20px;\n}\n```\n\n#### JavaScript\n\n```javascript\nlet timer;\nlet timeLeft;\n\
  let isRunning = false;\n\ndocument.getElementById('timerForm').addEventListener('submit',\
  \ function(event) {\n  event.preventDefault();\n  clearInterval(timer);\n  timeLeft\
  \ = parseInt(document.getElementById('secondsInput').value);\n  updateDisplay();\n\
  \  startTimer();\n  document.getElementById('stopButton').disabled = false;\n  document.getElementById('resetButton').disabled\
  \ = false;\n});\n\ndocument.getElementById('stopButton').addEventListener('click',\
  \ function() {\n  clearInterval(timer);\n  isRunning = false;\n  document.getElementById('stopButton').disabled\
  \ = true;\n});\n\ndocument.getElementById('resetButton').addEventListener('click',\
  \ function() {\n  clearInterval(timer);\n  timeLeft = 0;\n  updateDisplay();\n \
  \ document.getElementById('stopButton').disabled = true;\n  document.getElementById('resetButton').disabled\
  \ = true;\n});\n\nfunction startTimer() {\n  if (!isRunning) {\n    timer = setInterval(function()\
  \ {\n      if (timeLeft > 0) {\n        timeLeft--;\n        updateDisplay();\n\
  \      } else {\n        clearInterval(timer);\n        alert('时间到！');\n       \
  \ document.getElementById('stopButton').disabled = true;\n        document.getElementById('resetButton').disabled\
  \ = true;\n      }\n    }, 1000);\n    isRunning = true;\n  }\n}\n\nfunction updateDisplay()\
  \ {\n  const minutes = Math.floor(timeLeft / 60).toString().padStart(1, '0');\n\
  \  const seconds = (timeLeft % 60).toString().padStart(2, '0');\n  document.getElementById('timerDisplay').textContent\
  \ = `${minutes}:${seconds}`;\n}\n\nupdateDisplay();\n```\n\n### 交互式测验\n\n**描述：**\
