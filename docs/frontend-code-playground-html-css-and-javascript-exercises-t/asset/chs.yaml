  \n解释：正确答案通过将文本颜色改为绿色来指示。\n\n### Simple Quiz App\n\n**描述：**\n\n在此练习中，学生将创建一个简单的测验应用，该应用呈现多项选择题并提供用户答案的反馈。本练习介绍如何处理表单提交、使用数组以及动态更新\
  \ DOM。\n\n**涵盖主题：**\n\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- 处理表单提交\n- 使用数组\n\
  - DOM 操作（更新文本内容）\n\n**HTML：**\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
  <head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n<title>Simple Quiz App</title>\n<link rel=\"stylesheet\"\
  \ href=\"styles.css\">\n</head>\n<body>\n<div class=\"quiz-container\">\n<h1>Quiz\
  \ App</h1>\n<form id=\"quizForm\">\n<div class=\"question\">\n<p>What is the capital\
  \ of France?</p>\n<label><input type=\"radio\" name=\"q1\" value=\"a\"> Paris</label><br>\n\
  <label><input type=\"radio\" name=\"q1\" value=\"b\"> Berlin</label><br>\n<label><input\
  \ type=\"radio\" name=\"q1\" value=\"c\"> Madrid</label>\n</div>\n<div class=\"\
  question\">\n<p>What is 2 + 2?</p>\n<label><input type=\"radio\" name=\"q2\" value=\"\
  a\"> 3</label><br>\n<label><input type=\"radio\" name=\"q2\" value=\"b\"> 4</label><br>\n\
  <label><input type=\"radio\" name=\"q2\" value=\"c\"> 5</label>\n</div>\n<button\
  \ type=\"submit\">Submit</button>\n</form>\n<p id=\"resultDisplay\"></p>\n</div>\n\
  <script src=\"script.js\"></script>\n</body>\n</html>\n```\n\n**CSS：**\n\n```css\n\
  body {\nfont-family: Arial, sans-serif;\ndisplay: flex;\njustify-content: center;\n\
  align-items: center;\nheight: 100vh;\nmargin: 0;\n}\n.quiz-container {\ntext-align:\
  \ center;\nbackground-color: #f0f0f0;\npadding: 20px;\nborder-radius: 10px;\nbox-shadow:\
  \ 0 0 10px rgba(0, 0, 0, 0.1);\nwidth: 300px;\n}\n.question {\nmargin-bottom: 20px;\n\
  }\nbutton {\npadding: 10px 20px;\nfont-size: 16px;\ncursor: pointer;\n}\n#resultDisplay\
  \ {\nmargin-top: 20px;\nfont-size: 18px;\n}\n```\n\n**JavaScript：**\n\n```javascript\n\
  document.getElementById('quizForm').addEventListener('submit', function(event) {\n\
  event.preventDefault();\nlet score = 0;\nconst q1 = document.querySelector('input[name=\"\
