  \ndocument.getElementById('reversedTextDisplay').textContent = `Reversed Text: ${reversedText}`;\n\
  \n});\n```\n\n### 互动故事\n\n**描述：**  \n在此练习中，学生将创建一个互动故事，用户通过选择影响故事结局。本练习介绍如何处理按钮点击、使用数组以及动态更新\
  \ DOM。\n\n**涵盖主题：**  \n● HTML 结构  \n● CSS 样式  \n● JavaScript 事件监听器  \n● 处理按钮点击 \
  \ \n● 使用数组  \n● DOM 操作（更新文本内容）\n\n**HTML：**\n```html\n<!DOCTYPE html>\n<html lang=\"\
  en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
