- "# 前端代码练习场：HTML、CSS和JavaScript技能提升练习\n\n献给\n\n亚历克西斯和塞巴斯蒂安·斯维基斯\n\n感谢你们的支持\n\n##\
  \ 更改背景颜色\n\n描述：\n\n在本练习中，学生将创建一个简单的网页，其中包含一个按钮，点击该按钮可更改页面的背景颜色。本练习介绍基本的 DOM 操作和事件处理。\n\
  \n涵盖主题：\n\n● HTML 结构\n\n● CSS 样式\n\n● JavaScript 事件监听器\n\n● DOM 操作\n\nHTML：\n\n\
  ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n\
  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Change\
  \ Background Color</title>\n<link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n\
  <body>\n<button id=\"changeColorButton\">Change Background Color</button>\n<script\
  \ src=\"script.js\"></script>\n</body>\n</html>\n```\n\nCSS：\n\n```css\nbody {\n\
  font-family: Arial, sans-serif;\ndisplay: flex;\njustify-content: center;\nalign-items:\
  \ center;\nheight: 100vh;\nmargin: 0;\nbackground-color: #f0f0f0;\n}\nbutton {\n\
  padding: 10px 20px;\nfont-size: 16px;\ncursor: pointer;\n}\n```\n\nJavaScript：\n\
  \n```javascript\ndocument.getElementById('changeColorButton').addEventListener('click',\
  \ function() {\ndocument.body.style.backgroundColor = getRandomColor();\n});\nfunction\
  \ getRandomColor() {\nconst letters = '0123456789ABCDEF';\nlet color = '#';\nfor\
  \ (let i = 0; i < 6; i++) {\ncolor += letters[Math.floor(Math.random() * 16)];\n\
  }\nreturn color;\n}\n```\n\n## 显示/隐藏文本\n\n描述：\n\n在本练习中，学生将创建一个网页，其中包含一个按钮，用于切换段落的可见性。本练习介绍使用\
  \ JavaScript 显示和隐藏元素的概念。\n\n涵盖主题：\n\n● HTML 结构\n\n● CSS 样式\n\n● JavaScript 事件监听器\n\
  \n● DOM 操作（显示/隐藏元素）\n\nHTML：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  <meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n<title>Show/Hide Text</title>\n<link rel=\"stylesheet\"\
  \ href=\"styles.css\">\n</head>\n<body>\n<button id=\"toggleTextButton\">Show/Hide\
  \ Text</button>\n<p id=\"text\" style=\"display: none;\">This is a sample text that\
  \ can be shown or hidden.</p>\n<script src=\"script.js\"></script>\n</body>\n</html>\n\
  ```\n\nCSS：\n\n```css\nbody {\nfont-family: Arial, sans-serif;\ndisplay: flex;\n\
  flex-direction: column;\nalign-items: center;\nheight: 100vh;\njustify-content:\
  \ center;\nmargin: 0;\n}\nbutton {\npadding: 10px 20px;\nfont-size: 16px;\ncursor:\
  \ pointer;\nmargin-bottom: 20px;\n}\np {\nfont-size: 18px;\n}\n```\n\nJavaScript：\n\
  \n```javascript\ndocument.getElementById('toggleTextButton').addEventListener('click',\
  \ function() {\nconst text = document.getElementById('text');\nif (text.style.display\
  \ === 'none') {\ntext.style.display = 'block';\n} else {\ntext.style.display = 'none';\n\
  }\n});\n```\n\n## 向列表添加项目\n\n描述：\n\n\n\n\n在本练习中，学生将创建一个包含输入字段和按钮的网页，用于向列表添加项目。本练习介绍如何创建新元素并将其附加到\
  \ DOM。\n\n涵盖主题：\n\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- DOM 操作（创建和附加元素）\n\n\
  HTML：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"\
  UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n<title>Add Items to List</title>\n<link rel=\"stylesheet\" href=\"styles.css\"\
  >\n</head>\n<body>\n<input type=\"text\" id=\"itemInput\" placeholder=\"Enter item\"\
  >\n<button id=\"addItemButton\">Add Item</button>\n<ul id=\"itemList\"></ul>\n<script\
  \ src=\"script.js\"></script>\n</body>\n</html>\n```\n\nCSS：\n\n```css\nbody {\n\
  font-family: Arial, sans-serif;\ndisplay: flex;\nflex-direction: column;\nalign-items:\
  \ center;\nheight: 100vh;\njustify-content: center;\nmargin: 0;\n}\ninput {\npadding:\
  \ 10px;\nfont-size: 16px;\nmargin-bottom: 10px;\n}\nbutton {\npadding: 10px 20px;\n\
  font-size: 16px;\ncursor: pointer;\nmargin-bottom: 20px;\n}\nul {\nlist-style-type:\
  \ none;\npadding: 0;\n}\nli {\nfont-size: 18px;\nmargin: 5px 0;\n}\n```\n\nJavaScript：\n\
  \n```javascript\ndocument.getElementById('addItemButton').addEventListener('click',\
  \ function() {\nconst itemInput = document.getElementById('itemInput');\nconst newItemText\
  \ = itemInput.value;\nif (newItemText !== '') {\nconst newItem = document.createElement('li');\n\
  newItem.textContent = newItemText;\ndocument.getElementById('itemList').appendChild(newItem);\n\
  itemInput.value = '';\n}\n});\n```\n\n### 多项选择题\n\n在 JavaScript 中，用于检测按钮点击的事件监听器是什么？\n\
  \na) `click`\nb) `mouseover`\nc) `keydown`\nd) `load`\n\n答案：a) `click` 解释：`click`事件监听器用于检测按钮被点击的时刻。\n\
  \n如何使用 JavaScript 更改网页的背景颜色？\n\na) `document.body.color`\nb) `document.body.backgroundColor`\n\
  c) `document.body.style.backgroundColor`\nd) `document.body.style.color`\n\n答案：c)\
  \ `document.body.style.backgroundColor` 解释：要更改背景颜色，需要使用`document.body.style.backgroundColor`。\n\
  \n哪个 CSS 属性用于隐藏 DOM 中的元素？\n\na) `visibility`\nb) `opacity`\nc) `display`\nd) `hidden`\n\
  \n答案：c) `display` 解释：`display`属性可以设置为`none`来隐藏元素。\n\n如何使用 JavaScript 创建新的 HTML 元素？\n\
  \na) `document.createElement()`\nb) `document.newElement()`\nc) `document.create()`\n\
  d) `document.new()`\n\n答案：a) `document.createElement()` 解释：`document.createElement()`方法用于创建新的\
  \ HTML 元素。\n\n在“向列表添加项目”练习中，哪个函数将新项目附加到列表？\n\na) `append()`\nb) `addChild()`\nc)\
  \ `appendChild()`\nd) `add()`\n\n答案：c) `appendChild()` 解释：`appendChild()`方法用于向父节点添加新的子元素。\n\
  \n在“更改背景颜色”练习中，`getRandomColor`函数的目的是什么？\n\nA) 更改文本颜色\nB) 生成随机背景颜色\nC) 更改字体大小\n\
  D) 生成随机字体样式\n\n答案：B\n解释：`getRandomColor`函数生成一个随机颜色代码，用于更改页面的背景颜色。\n\n在“更改背景颜色”练习中，哪个事件监听器用于触发颜色变化？\n\
  \nA) `mouseover`\nB) `keydown`\nC) `click`\nD) `scroll`\n\n答案：C\n解释：`click`事件监听器用于在按钮被点击时触发背景颜色变化。\n\
  \n在“更改背景颜色”练习中，哪个 HTML 元素具有 ID `changeColorButton`？\n\nA) `<body>`\nB) `<button>`\n\
  C) `<div>`\nD) `<span>`\n\n答案：B\n解释：`<button>`元素具有 ID `changeColorButton`。\n\n在`getRandomColor`函数中，表达式`Math.floor(Math.random()\
  \ * 16)`的作用是什么？\n\nA) 生成 0 到 16 之间的随机数。\nB) 生成 0 到 15 之间的随机数。\nC) 生成 1 到 16 之间的随机数。\n\
  D) 生成 1 到 15 之间的随机数。\n\n答案：B\n解释：`Math.random()`生成 0 到 1 之间的随机数。乘以 16 并使用`Math.floor`将其向下取整为\
  \ 0 到 15 之间的整数。\n\n在“显示/隐藏文本”练习中，段落的初始 CSS `display`属性值是什么？\n\nA) `block`\nB) `inline`\n\
  C) `flex`\nD) `none`\n\n答案：D\n解释：段落的初始 CSS `display`属性值设置为`none`，使其隐藏。\n\n在“显示/隐藏文本”练习中，切换文本可见性时检查的条件是什么？\n\
  \nA) 如果文本内容为空\nB) 如果文本的`display`为`none`\nC) 如果按钮被点击\nD) 如果文本的`display`为`block`\n\
  \n答案：B\n解释：条件检查文本的`display`属性是否为`none`，以切换其可见性。\n\n在“显示/隐藏文本”练习中，当`toggleTextButton`被点击且文本已经可见时会发生什么？\n\
  \nA) 文本变为斜体\nB) 文本被隐藏\nC) 文本颜色改变\nD) 文本字体大小增加\n\n答案：B\n解释：如果文本已经可见，点击按钮会通过将`display`属性设置为`none`来隐藏文本。\n\
  \n在“向列表添加项目”练习中，当`addItemButton`被点击时会发生什么？\n\nA) 添加一个新段落\nB) 添加一个新列表项\nC) 输入字段被清空\n\
  D) B 和 C 都正确\n\n答案：D\n解释：当按钮被点击时，会添加一个新列表项，并且输入字段被清空。\n\n在“向列表添加项目”练习中，哪个 HTML 元素用于捕获用户的输入？\n\
  \nA) `<input>`\nB) `<textarea>`\nC) `<div>`\nD) `<span>`\n\n答案：A\n解释：`<input>`元素捕获用户的输入。\n\
  \n在“向列表添加项目”练习中，使用什么方法创建新的列表项元素？\n\nA) `document.createElement('li')`\nB) `document.createElement('div')`\n\
  C) `document.createElement('p')`\nD) `document.createElement('span')`\n\n答案：A\n\
  解释：`document.createElement('li')`方法用于创建新的列表项元素。\n\n## 显示当前日期和时间\n\n描述：\n\n在本练习中，学生将创建一个包含按钮的网页，点击按钮时显示当前日期和时间。本练习介绍如何使用\
  \ JavaScript 日期对象以及在网页上显示文本。\n\n涵盖主题：\n\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n\
  - 使用 JavaScript Date 对象\n- DOM 操作\n\nHTML：\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
  en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n<title>Display Date and Time</title>\n<link rel=\"stylesheet\"\
  \ href=\"styles.css\">\n</head>\n<body>\n<button id=\"showDateTimeButton\">Show\
  \ Date and Time</button>\n<p id=\"dateTimeDisplay\"></p>\n<script src=\"script.js\"\
  ></script>\n</body>\n</html>\n```\n\nCSS：\n\n```css\nbody {\nfont-family: Arial,\
  \ sans-serif;\ndisplay: flex;\nflex-direction: column;\nalign-items: center;\nheight:\
  \ 100vh;\njustify-content: center;\nmargin: 0;\n}\nbutton {\npadding: 10px 20px;\n\
  font-size: 16px;\ncursor: pointer;\nmargin-bottom: 20px;\n}\np {\nfont-size: 18px;\n\
  }\n```\n\nJavaScript：\n\n```javascript\ndocument.getElementById('showDateTimeButton').addEventListener('click',\
  \ function() {\nconst now = new Date();\nconst dateTimeString = now.toLocaleString();\n\
  document.getElementById('dateTimeDisplay').textContent = dateTimeString;\n});\n\
  ```\n\n## 更改文本内容\n\n描述：\n\n在本练习中，学生将创建一个包含输入字段和按钮的网页。当按钮被点击时，段落中的文本内容会更新为输入字段中输入的文本。本练习介绍如何使用\
  \ JavaScript 动态更新文本内容。\n\n涵盖主题：\n\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- DOM\
  \ 操作（更新文本内容）\n\nHTML：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  <meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n<title>Change Text Content</title>\n```\n\n\n\n\n```\n<link\
  \ rel=\"stylesheet\" href=\"styles.css\">\n\n</head>\n\n<body>\n\n<input type=\"\
  text\" id=\"textInput\" placeholder=\"Enter new text\">\n\n<button id=\"changeTextButton\"\
  >Change Text</button>\n\n<p id=\"textDisplay\">This is the original text.</p>\n\n\
  <script src=\"script.js\"></script>\n\n</body>\n\n</html>\n```\n\nCSS:\n\n```\n\
  body {\n    font-family: Arial, sans-serif;\n    display: flex;\n    flex-direction:\
  \ column;\n    align-items: center;\n    height: 100vh;\n    justify-content: center;\n\
  \    margin: 0;\n}\n\ninput {\n    padding: 10px;\n    font-size: 16px;\n    margin-bottom:\
  \ 10px;\n}\n\nbutton {\n    padding: 10px 20px;\n    font-size: 16px;\n    cursor:\
  \ pointer;\n    margin-bottom: 20px;\n}\n\np {\n    font-size: 18px;\n}\n```\n\n\
  JavaScript:\n\n```\ndocument.getElementById('changeTextButton').addEventListener('click',\
  \ function() {\n    const newText = document.getElementById('textInput').value;\n\
  \    document.getElementById('textDisplay').textContent = newText;\n});\n```\n\n\
  ## 高亮列表项\n\n描述：\n\n在本练习中，学生将创建一个包含项目列表的网页。当点击某个项目时，其背景颜色会改变以突出显示。本练习介绍了事件委托和动态更新样式。\n\
  \n涵盖主题：\n\n● HTML 结构\n\n● CSS 样式\n\n● JavaScript 事件监听器\n\n● 事件委托\n\n● DOM 操作（更新样式）\n\
  \nHTML:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"\
  UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n    <title>Highlight List Items</title>\n    <link rel=\"stylesheet\" href=\"\
  styles.css\">\n</head>\n<body>\n    <ul id=\"itemList\">\n        <li>Item 1</li>\n\
  \        <li>Item 2</li>\n        <li>Item 3</li>\n        <li>Item 4</li>\n   \
  \ </ul>\n    <script src=\"script.js\"></script>\n</body>\n</html>\n```\n\nCSS:\n\
  \n```\nbody {\n    font-family: Arial, sans-serif;\n    display: flex;\n    flex-direction:\
  \ column;\n    align-items: center;\n    height: 100vh;\n    justify-content: center;\n\
  \    margin: 0;\n}\n\nul {\n    list-style-type: none;\n    padding: 0;\n}\n\nli\
  \ {\n    font-size: 18px;\n    margin: 5px 0;\n    padding: 10px;\n    cursor: pointer;\n\
  }\n\nli.highlight {\n    background-color: yellow;\n}\n```\n\nJavaScript:\n\n```\n\
  document.getElementById('itemList').addEventListener('click', function(event) {\n\
  \    if (event.target.tagName === 'LI') {\n        const items = document.querySelectorAll('li');\n\
  \        items.forEach(item => item.classList.remove('highlight'));\n        event.target.classList.add('highlight');\n\
  \    }\n});\n```\n\n## 动态图片画廊\n\n描述：\n\n在本练习中，学生将创建一个简单的图片画廊。当点击缩略图时，将显示该图片的较大版本。本练习介绍了处理点击事件和动态更新图片源。\n\
  \n涵盖主题：\n\n● HTML 结构\n\n● CSS 样式\n\n● JavaScript 事件监听器\n\n● DOM 操作（更改图片源）\n\nHTML:\n\
  \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
  >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n    <title>Dynamic Image Gallery</title>\n    <link rel=\"stylesheet\" href=\"\
  styles.css\">\n</head>\n<body>\n    <div id=\"gallery\">\n        <img src=\"thumbnail1.jpg\"\
  \ alt=\"Thumbnail 1\" class=\"thumbnail\">\n        <img src=\"thumbnail2.jpg\"\
  \ alt=\"Thumbnail 2\" class=\"thumbnail\">\n        <img src=\"thumbnail3.jpg\"\
  \ alt=\"Thumbnail 3\" class=\"thumbnail\">\n    </div>\n    <div id=\"display\"\
  >\n        <img id=\"largeImage\" src=\"placeholder.jpg\" alt=\"Large Image\">\n\
  \    </div>\n    <script src=\"script.js\"></script>\n</body>\n</html>\n```\n\n\
  CSS:\n\n```\nbody {\n    font-family: Arial, sans-serif;\n    display: flex;\n \
  \   flex-direction: column;\n    align-items: center;\n    height: 100vh;\n    justify-content:\
  \ center;\n    margin: 0;\n}\n\n#gallery {\n    display: flex;\n    gap: 10px;\n\
  }\n\n.thumbnail {\n    width: 100px;\n    cursor: pointer;\n}\n\n#display {\n  \
  \  margin-top: 20px;\n}\n\n#largeImage {\n    width: 300px;\n}\n```\n\nJavaScript:\n\
  \n```\ndocument.querySelectorAll('.thumbnail').forEach(thumbnail => {\n    thumbnail.addEventListener('click',\
  \ function() {\n        const largeImage = document.getElementById('largeImage');\n\
  \        largeImage.src = this.src.replace('thumbnail', 'large');\n    });\n});\n\
  ```\n\n## 交互式计数器\n\n描述：\n\n在本练习中，学生将创建一个带有增加和减少计数按钮的交互式计数器。本练习介绍了根据用户输入更新 DOM。\n\
  \n涵盖主题：\n\n● HTML 结构\n\n● CSS 样式\n\n● JavaScript 事件监听器\n\n● DOM 操作（更新文本内容）\n\nHTML:\n\
  \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
  >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n    <title>Interactive Counter</title>\n    <link rel=\"stylesheet\" href=\"\
  styles.css\">\n</head>\n<body>\n    <div id=\"counter\">\n        <button id=\"\
  decrementButton\">-</button>\n        <span id=\"count\">0</span>\n        <button\
  \ id=\"incrementButton\">+</button>\n    </div>\n    <script src=\"script.js\"></script>\n\
  </body>\n</html>\n```\n\nCSS:\n\n```\nbody {\n    font-family: Arial, sans-serif;\n\
  \    display: flex;\n    flex-direction: column;\n    align-items: center;\n   \
  \ height: 100vh;\n    justify-content: center;\n    margin: 0;\n}\n\n#counter {\n\
  \    display: flex;\n    align-items: center;\n    gap: 10px;\n}\n\nbutton {\n \
  \   padding: 10px 20px;\n    font-size: 16px;\n    cursor: pointer;\n}\n\nspan {\n\
  \    font-size: 24px;\n    width: 50px;\n    text-align: center;\n}\n```\n\nJavaScript:\n\
  \n```\nlet count = 0;\n\ndocument.getElementById('incrementButton').addEventListener('click',\
  \ function() {\n    count++;\n    document.getElementById('count').textContent =\
  \ count;\n});\n\ndocument.getElementById('decrementButton').addEventListener('click',\
  \ function() {\n    count--;\n    document.getElementById('count').textContent =\
  \ count;\n});\n```\n\n## 表单验证\n\n描述：\n\n在本练习中，学生将创建一个带有验证功能的简单表单。当点击提交按钮时，脚本将检查所有字段是否已填写，如果任何字段为空，则显示一条警告消息。本练习介绍了基本的表单验证。\n\
  \n涵盖主题：\n\n● HTML 结构\n\n● CSS 样式\n\n● JavaScript 事件监听器\n\n● 表单验证\n\n● DOM 操作（警告消息）\n\
  \nHTML:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"\
  UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n    <title>Form Validation</title>\n    <link rel=\"stylesheet\" href=\"styles.css\"\
  >\n</head>\n<body>\n    <form id=\"myForm\">\n        <input type=\"text\" id=\"\
  name\" placeholder=\"Name\">\n        <input type=\"email\" id=\"email\" placeholder=\"\
  Email\">\n        <button type=\"submit\">Submit</button>\n    </form>\n    <script\
  \ src=\"script.js\"></script>\n</body>\n</html>\n```\n\nCSS:\n\n```\nbody {\n  \
  \  font-family: Arial, sans-serif;\n    display: flex;\n    flex-direction: column;\n\
  \    align-items: center;\n    height: 100vh;\n    justify-content: center;\n  \
  \  margin: 0;\n}\n\nform {\n    display: flex;\n    flex-direction: column;\n  \
  \  gap: 10px;\n}\n\ninput {\n    padding: 10px;\n    font-size: 16px;\n    width:\
  \ 200px;\n}\n\nbutton {\n    padding: 10px 20px;\n    font-size: 16px;\n    cursor:\
  \ pointer;\n}\n```\n\nJavaScript:\n\n```\ndocument.getElementById('myForm').addEventListener('submit',\
  \ function(event) {\n    const name = document.getElementById('name').value;\n \
  \   const email = document.getElementById('email').value;\n    if (name === '' ||\
  \ email === '') {\n        event.preventDefault();\n        alert('Please fill out\
