  \ === 'paper')\n) {\nresult = 'You win!';\n} else {\nresult = 'You lose!';\n}\n\
  ```\n\n\n\n\n\n```javascript\ndocument.getElementById('resultDisplay').textContent\
  \ = `You chose ${userChoice}. Computer chose ${computerChoice}. ${result}`;\n\n\
  });\n```\n\n## 带暂停和重置功能的倒计时器\n\n描述：\n\n在本练习中，学生将创建一个可以暂停和重置的倒计时器。本练习介绍了如何使用定时器、控制其执行以及动态更新\
  \ DOM。\n\n涵盖的主题：\n\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- 使用定时器\n- DOM 操作（更新文本内容）\n\
  \nHTML：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"\
  UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n<title>Countdown Timer</title>\n<link rel=\"stylesheet\" href=\"styles.css\"\
  >\n</head>\n<body>\n<div class=\"timer-container\">\n<h1>Countdown Timer</h1>\n\
  <input type=\"number\" id=\"timeInput\" placeholder=\"Enter seconds\" required>\n\
  <div class=\"buttons\">\n<button id=\"startButton\">Start</button>\n<button id=\"\
  pauseButton\">Pause</button>\n<button id=\"resetButton\">Reset</button>\n</div>\n\
  <p id=\"timerDisplay\">0</p>\n</div>\n<script src=\"script.js\"></script>\n</body>\n\
  </html>\n```\n\nCSS：\n\n```css\nbody {\nfont-family: Arial, sans-serif;\ndisplay:\
  \ flex;\njustify-content: center;\nalign-items: center;\nheight: 100vh;\nmargin:\
  \ 0;\n}\n.timer-container {\ntext-align: center;\nbackground-color: #f0f0f0;\npadding:\
  \ 20px;\nborder-radius: 10px;\nbox-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\n}\ninput\
  \ {\npadding: 10px;\nfont-size: 16px;\nmargin-bottom: 10px;\n}\n.buttons {\ndisplay:\
  \ flex;\njustify-content: center;\ngap: 10px;\nmargin-bottom: 20px;\n}\nbutton {\n\
  padding: 10px 20px;\nfont-size: 16px;\ncursor: pointer;\n}\np {\nfont-size: 24px;\n\
  margin: 0;\n}\n```\n\nJavaScript：\n\n```javascript\nlet timer;\nlet countdown;\n\
  let isPaused = false;\n\ndocument.getElementById('startButton').addEventListener('click',\
  \ function() {\nif (!isPaused) {\nclearInterval(timer);\nconst timeInput = parseInt(document.getElementById('timeInput').value,\
  \ 10);\ncountdown = timeInput;\n}\nisPaused = false;\ndocument.getElementById('timerDisplay').textContent\
  \ = countdown;\ntimer = setInterval(function() {\nif (!isPaused) {\ncountdown--;\n\
  document.getElementById('timerDisplay').textContent = countdown;\nif (countdown\
  \ <= 0) {\nclearInterval(timer);\nalert('Time is up!');\n}\n}\n}, 1000);\n});\n\n\
  document.getElementById('pauseButton').addEventListener('click', function() {\n\
  isPaused = true;\n});\n\ndocument.getElementById('resetButton').addEventListener('click',\
  \ function() {\nclearInterval(timer);\ncountdown = 0;\ndocument.getElementById('timerDisplay').textContent\
  \ = countdown;\nisPaused = false;\n});\n```\n\n### 多项选择题\n\n在简单待办事项列表练习中，哪个事件用于处理表单提交？\n\
  \na) `click`\nb) `submit`\nc) `change`\nd) `input`\n\n答案：b) `submit` 解释：`submit`\
  \ 事件用于在向待办事项列表添加新任务时处理表单提交。\n\n在简单待办事项列表练习中，使用什么方法来切换任务的 completed 类？\n\na) `classList.add`\n\
  b) `classList.remove`\nc) `classList.toggle`\nd) `classList.change`\n\n答案：c) `classList.toggle`\
  \ 解释：`classList.toggle` 方法用于在点击任务时添加或移除 completed 类。\n\n在图片轮播练习中，图片多久更换一次？\n\na)\
  \ 每秒\nb) 每 2 秒\nc) 每 3 秒\nd) 每 5 秒\n\n答案：c) 每 3 秒 解释：`setInterval` 函数用于每 3 秒更换一次图片。\n\
  \n在交互式常见问题解答练习中，如何显示或隐藏答案？\n\na) 通过更改 `innerHTML`\nb) 通过更改 `textContent`\nc) 通过切换\
  \ `display` 属性\nd) 通过使用 `visibility` 属性\n\n答案：c) 通过切换 `display` 属性 解释：`display`\
  \ 属性在 `block` 和 `none` 之间切换，以显示或隐藏常见问题解答的答案。\n\n在交互式常见问题解答练习中，常见问题解答答案的初始 display\
  \ 属性是什么？\n\na) `block`\nb) `inline`\nc) `none`\nd) `hidden`\n\n答案：c) `none` 解释：常见问题解答答案的初始\
  \ display 属性设置为 `none`，表示默认隐藏。\n\n在货币转换器练习中，如何显示转换后的金额？\n\na) 使用 `innerHTML`\nb)\
  \ 使用 `textContent`\nc) 使用 `value`\nd) 使用 `appendChild`\n\n答案：b) 使用 `textContent`\
  \ 解释：`textContent` 属性用于在结果显示元素中显示转换后的金额。\n\n在石头剪刀布游戏练习中，使用什么方法为计算机生成随机选择？\n\na)\
  \ `Math.random()`\nb) `Math.floor()`\nc) `Array.prototype.random()`\nd) `Math.ceil()`\n\
  \n答案：a) `Math.random()` 解释：`Math.random()` 方法用于生成一个随机数，然后用于为计算机选择随机选项。\n\n在带暂停和重置功能的倒计时器练习中，哪个函数用于重复执行倒计时逻辑？\n\
  \na) `setTimeout`\nb) `setInterval`\nc) `clearInterval`\nd) `setTimer`\n\n答案：b)\
  \ `setInterval` 解释：`setInterval` 函数用于每隔一秒重复执行倒计时逻辑。\n\n在带暂停和重置功能的倒计时器练习中，如何暂停计时器？\n\
  \na) 通过清除间隔\nb) 通过设置暂停标志\nc) 通过重置计时器\nd) 通过使用 `pause()` 方法\n\n答案：b) 通过设置暂停标志 解释：通过将\
