  \ `highlight` 类，然后将其添加到被点击的项，以确保一次只高亮一个项。\n\n### 切换深色模式\n\n**描述：**\n\n在本练习中，学生将创建一个带有按钮的网页，该按钮可在浅色和深色模式之间切换。本练习介绍了如何根据用户交互动态更改\
