  \n});\n\ndocument.getElementById('taskList').appendChild(li);\n\ntaskInput.value\
  \ = '';\n\n});\n```\n\n## 图片轮播\n\n描述：\n\n在本练习中，学生将创建一个每隔几秒自动切换图片的图片轮播。本练习介绍如何使用定时器以及动态更新\
  \ DOM。\n\n涵盖主题：\n\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- DOM 操作（更改图片源）\n- 定时器的使用\n\
  \nHTML：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"\
