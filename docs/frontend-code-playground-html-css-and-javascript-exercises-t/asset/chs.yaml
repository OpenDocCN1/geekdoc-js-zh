  \ {\ntext-align: center;\nbackground-color: #f0f0f0;\npadding: 20px;\nborder-radius:\
  \ 10px;\nbox-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\n}\n.choices {\ndisplay: flex;\n\
  justify-content: center;\ngap: 10px;\nmargin-bottom: 20px;\n}\nbutton.choice {\n\
