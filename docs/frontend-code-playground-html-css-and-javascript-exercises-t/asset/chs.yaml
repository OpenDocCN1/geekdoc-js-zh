  \ function() {\ndocument.body.classList.toggle('dark-mode');\n});\n```\n\n### 过滤列表项\n\
  \n**描述：**\n\n在本练习中，学生将创建一个带有输入字段的网页，用于过滤列表项。当用户在输入字段中键入时，列表将被过滤，仅显示与输入匹配的项。本练习介绍了\
  \ DOM 中的过滤和搜索。\n\n**涵盖主题：**\n\n● HTML 结构\n\n● CSS 样式\n\n● JavaScript 事件监听器\n\n●\
  \ DOM 操作（过滤元素）\n\n**HTML：**\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  <meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n<title>Filter List Items</title>\n<link rel=\"stylesheet\"\
  \ href=\"styles.css\">\n</head>\n<body>\n<input type=\"text\" id=\"filterInput\"\
  \ placeholder=\"Filter items...\">\n<ul id=\"itemList\">\n<li>Apple</li>\n<li>Banana</li>\n\
  <li>Cherry</li>\n<li>Date</li>\n<li>Fig</li>\n<li>Grape</li>\n</ul>\n<script src=\"\
  script.js\"></script>\n</body>\n</html>\n```\n\n**CSS：**\n\n```css\nbody {\nfont-family:\
  \ Arial, sans-serif;\ndisplay: flex;\nflex-direction: column;\nalign-items: center;\n\
  height: 100vh;\njustify-content: center;\nmargin: 0;\n}\n\ninput {\npadding: 10px;\n\
  font-size: 16px;\nmargin-bottom: 10px;\n}\n\nul {\nlist-style-type: none;\npadding:\
  \ 0;\n}\n\nli {\nfont-size: 18px;\nmargin: 5px 0;\n}\n```\n\n**JavaScript：**\n\n\
  ```javascript\ndocument.getElementById('filterInput').addEventListener('input',\
  \ function() {\nconst filter = this.value.toLowerCase();\nconst items = document.querySelectorAll('#itemList\
  \ li');\nitems.forEach(item => {\nif (item.textContent.toLowerCase().includes(filter))\
  \ {\nitem.style.display = '';\n} else {\nitem.style.display = 'none';\n}\n});\n\
  });\n```\n\n### 手风琴菜单\n\n**描述：**\n\n在本练习中，学生将创建一个手风琴菜单，点击某个部分的标题可展开或折叠其内容。本练习介绍了使用\
