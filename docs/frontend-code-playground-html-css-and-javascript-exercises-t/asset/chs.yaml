  \n### 闪卡应用  \n\n描述：  \n\n在此练习中，学生将创建一个闪卡应用，显示问题并在点击时揭示答案。本练习介绍如何处理点击事件、管理状态以及动态更新\
  \ DOM。  \n\n涵盖主题：  \n\n● HTML 结构  \n● CSS 样式  \n● JavaScript 事件监听器  \n● 处理点击事件 \
  \ \n● DOM 操作（更新文本内容）  \n● 状态管理  \n\nHTML：  \n\n```html\n<!DOCTYPE html>\n<html lang=\"\
  en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n<title>Flashcard App</title>\n<link rel=\"stylesheet\" href=\"\
  styles.css\">\n</head>\n<body>\n<div class=\"flashcard-container\">\n<h1>Flashcard\
  \ App</h1>\n<div id=\"flashcard\" class=\"flashcard\">\n<p id=\"flashcardContent\"\
  >Click to reveal the answer</p>\n</div>\n<button id=\"nextButton\">Next</button>\n\
  </div>\n<script src=\"script.js\"></script>\n</body>\n</html>\n```\n\nCSS：  \n\n\
  ```css\nbody {\nfont-family: Arial, sans-serif;\ndisplay: flex;\njustify-content:\
  \ center;\nalign-items: center;\nheight: 100vh;\nmargin: 0;\n}\n.flashcard-container\
  \ {\ntext-align: center;\nbackground-color: #f0f0f0;\npadding: 20px;\nborder-radius:\
  \ 10px;\nbox-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\n}\n.flashcard {\nwidth: 300px;\n\
  height: 200px;\nbackground-color: white;\nborder: 1px solid #ccc;\nborder-radius:\
  \ 10px;\ndisplay: flex;\njustify-content: center;\nalign-items: center;\nfont-size:\
  \ 24px;\ncursor: pointer;\nmargin-bottom: 20px;\n}\nbutton {\npadding: 10px 20px;\n\
  font-size: 16px;\ncursor: pointer;\n}\n```\n\nJavaScript：  \n\n```javascript\nconst\
  \ flashcards = [\n{ question: 'What is the capital of France?', answer: 'Paris'\
  \ },\n{ question: 'What is 2 + 2?', answer: '4' },\n{ question: 'What is the capital\
  \ of Spain?', answer: 'Madrid' }\n];\nlet currentFlashcardIndex = 0;\nconst flashcardContent\
  \ = document.getElementById('flashcardContent');\nconst flashcard = document.getElementById('flashcard');\n\
  function showFlashcard(index) {\nflashcardContent.textContent = flashcards[index].question;\n\
  flashcard.dataset.flipped = 'false';\n}\nflashcard.addEventListener('click', ()\
  \ => {\nif (flashcard.dataset.flipped === 'false') {\nflashcardContent.textContent\
  \ = flashcards[currentFlashcardIndex].answer;\nflashcard.dataset.flipped = 'true';\n\
  } else {\nflashcardContent.textContent = flashcards[currentFlashcardIndex].question;\n\
