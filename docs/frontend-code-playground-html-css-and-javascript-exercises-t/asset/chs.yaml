  \n## 带用户输入的倒计时器\n\n描述：\n\n在此练习中，学生将创建一个倒计时器，允许用户输入秒数并启动计时器。本练习介绍如何处理表单输入、使用计时器以及动态更新\
  \ DOM。\n\n涵盖的主题：\n\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- 使用计时器\n- 处理表单输入\n\
  - DOM 操作（更新文本内容）\n\nHTML：\n\n```html\n<!DOCTYPE html>\n```\n\n\n\n\n\n## 带用户输入的倒计时器\n\
  \n### HTML\n\n```html\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta\
  \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Countdown\
  \ Timer with User Input</title>\n<link rel=\"stylesheet\" href=\"styles.css\">\n\
  </head>\n<body>\n<div class=\"timer-container\">\n<h1>Countdown Timer</h1>\n<form\
  \ id=\"timerForm\">\n<input type=\"number\" id=\"secondsInput\" placeholder=\"Enter\
  \ seconds\" required>\n<button type=\"submit\">Start Timer</button>\n</form>\n<p\
  \ id=\"timerDisplay\">0:00</p>\n</div>\n<script src=\"script.js\"></script>\n</body>\n\
  </html>\n```\n\n### CSS\n\n```css\nbody {\nfont-family: Arial, sans-serif;\ndisplay:\
  \ flex;\njustify-content: center;\nalign-items: center;\nheight: 100vh;\nmargin:\
  \ 0;\n}\n.timer-container {\ntext-align: center;\nbackground-color: #f0f0f0;\npadding:\
  \ 20px;\nborder-radius: 10px;\nbox-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\n}\nform\
  \ {\ndisplay: flex;\nflex-direction: column;\ngap: 10px;\nmargin-bottom: 20px;\n\
  }\ninput, button {\npadding: 10px;\nfont-size: 16px;\n}\np {\nfont-size: 36px;\n\
  margin-top: 20px;\n}\n```\n\n### JavaScript\n\n```javascript\nlet timer;\nlet timeLeft;\n\
  document.getElementById('timerForm').addEventListener('submit', function(event)\
  \ {\nevent.preventDefault();\nclearInterval(timer);\ntimeLeft = parseInt(document.getElementById('secondsInput').value);\n\
  startTimer();\n});\nfunction startTimer() {\ntimer = setInterval(function() {\n\
  if (timeLeft > 0) {\ntimeLeft--;\nupdateDisplay();\n} else {\nclearInterval(timer);\n\
  alert('Time is up!');\n}\n}, 1000);\n}\nfunction updateDisplay() {\nconst minutes\
  \ = Math.floor(timeLeft / 60).toString().padStart(1, '0');\nconst seconds = (timeLeft\
  \ % 60).toString().padStart(2, '0');\ndocument.getElementById('timerDisplay').textContent\
  \ = `${minutes}:${seconds}`;\n}\nupdateDisplay();\n```\n\n## 交互式测验应用\n\n**描述：**\
  \ 在本练习中，学生将创建一个交互式测验应用，显示多项选择题并提供即时反馈。本练习介绍如何处理表单输入、动态更新 DOM 以及提供反馈。\n\n**涵盖主题：**\n\
  - HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- 处理表单输入\n- DOM 操作（更新元素）\n\n### HTML\n\n\
  ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n\
  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Interactive\
  \ Quiz App</title>\n<link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n\
  <div class=\"quiz-container\">\n<h1>Quiz App</h1>\n<div id=\"quiz\"></div>\n<button\
  \ id=\"submit\">Submit</button>\n<div id=\"results\"></div>\n</div>\n<script src=\"\
  script.js\"></script>\n</body>\n</html>\n```\n\n### CSS\n\n```css\nbody {\nfont-family:\
  \ Arial, sans-serif;\ndisplay: flex;\njustify-content: center;\nalign-items: center;\n\
  height: 100vh;\nmargin: 0;\n}\n.quiz-container {\ntext-align: center;\nbackground-color:\
  \ #f0f0f0;\npadding: 20px;\nborder-radius: 10px;\nbox-shadow: 0 0 10px rgba(0, 0,\
  \ 0, 0.1);\nwidth: 300px;\n}\nbutton {\npadding: 10px 20px;\nfont-size: 16px;\n\
  cursor: pointer;\nmargin-top: 20px;\n}\n```\n\n### JavaScript\n\n```javascript\n\
  const quizContainer = document.getElementById('quiz');\nconst resultsContainer =\
  \ document.getElementById('results');\nconst submitButton = document.getElementById('submit');\n\
  const myQuestions = [\n{\nquestion: \"What is the capital of France?\",\nanswers:\
  \ {\na: \"Berlin\",\nb: \"Madrid\",\nc: \"Paris\"\n},\ncorrectAnswer: \"c\"\n},\n\
  {\nquestion: \"Who is the CEO of Tesla?\",\nanswers: {\na: \"Jeff Bezos\",\nb: \"\
  Elon Musk\",\nc: \"Bill Gates\"\n},\ncorrectAnswer: \"b\"\n},\n{\nquestion: \"What\
  \ is the smallest planet in our solar system?\",\nanswers: {\na: \"Mars\",\nb: \"\
  Venus\",\nc: \"Mercury\"\n},\ncorrectAnswer: \"c\"\n}\n];\nfunction buildQuiz()\
  \ {\nconst output = [];\nmyQuestions.forEach((currentQuestion, questionNumber) =>\
  \ {\nconst answers = [];\nfor (letter in currentQuestion.answers) {\nanswers.push(\n\
  `<label>\n<input type=\"radio\" name=\"question${questionNumber}\" value=\"${letter}\"\
  >\n${letter} :\n${currentQuestion.answers[letter]}\n</label>`\n);\n}\noutput.push(\n\
  `<div class=\"question\"> ${currentQuestion.question} </div>\n<div class=\"answers\"\
  > ${answers.join('')} </div>`\n);\n});\nquizContainer.innerHTML = output.join('');\n\
  }\nfunction showResults() {\nconst answerContainers = quizContainer.querySelectorAll('.answers');\n\
  let numCorrect = 0;\nmyQuestions.forEach((currentQuestion, questionNumber) => {\n\
  const answerContainer = answerContainers[questionNumber];\nconst selector = `input[name=question${questionNumber}]:checked`;\n\
  const userAnswer = (answerContainer.querySelector(selector) || {}).value;\nif (userAnswer\
  \ === currentQuestion.correctAnswer) {\nnumCorrect++;\nanswerContainers[questionNumber].style.color\
  \ = 'green';\n} else {\nanswerContainers[questionNumber].style.color = 'red';\n\
  }\n});\nresultsContainer.innerHTML = `${numCorrect} out of ${myQuestions.length}`;\n\
  }\nbuildQuiz();\nsubmitButton.addEventListener('click', showResults);\n```\n\n##\
  \ 带本地存储的购物清单\n\n**描述：** 在本练习中，学生将创建一个购物清单，将商品保存到本地存储中，以便在页面刷新后仍然保留。本练习介绍如何处理表单输入、动态更新\
  \ DOM 以及使用本地存储。\n\n**涵盖主题：**\n- HTML 结构\n- CSS 样式\n- JavaScript 事件监听器\n- 本地存储\n\
  - DOM 操作（添加、更新和删除元素）\n- 处理表单输入\n\n### HTML\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
  en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n<title>Shopping List with Local Storage</title>\n<link rel=\"\
  stylesheet\" href=\"styles.css\">\n</head>\n<body>\n<div class=\"list-container\"\
  >\n<h1>Shopping List</h1>\n<form id=\"shoppingForm\">\n<input type=\"text\" id=\"\
  itemInput\" placeholder=\"Enter a new item\" required>\n<button type=\"submit\"\
  >Add Item</button>\n</form>\n<ul id=\"itemList\"></ul>\n</div>\n<script src=\"script.js\"\
  ></script>\n</body>\n</html>\n```\n\n### CSS\n\n```css\nbody {\nfont-family: Arial,\
  \ sans-serif;\ndisplay: flex;\njustify-content: center;\nalign-items: center;\n\
  height: 100vh;\nmargin: 0;\n}\n.list-container {\ntext-align: center;\nbackground-color:\
  \ #f0f0f0;\npadding: 20px;\nborder-radius: 10px;\nbox-shadow: 0 0 10px rgba(0, 0,\
  \ 0, 0.1);\nwidth: 300px;\n}\nform {\ndisplay: flex;\nflex-direction: column;\n\
  gap: 10px;\n}\ninput, button {\npadding: 10px;\nfont-size: 16px;\n}\nul {\nlist-style-type:\
  \ none;\npadding: 0;\n}\nli {\npadding: 10px;\nmargin: 5px 0;\nbackground-color:\
  \ #fff;\nborder: 1px solid #ccc;\nborder-radius: 5px;\ndisplay: flex;\njustify-content:\
  \ space-between;\n}\nbutton.remove {\nbackground: none;\nborder: none;\ncolor: red;\n\
  cursor: pointer;\nfont-size: 16px;\n}\n```\n\n### JavaScript\n\n```javascript\n\
  document.addEventListener('DOMContentLoaded', function() {\nconst itemList = document.getElementById('itemList');\n\
  const items = JSON.parse(localStorage.getItem('items')) || [];\nitems.forEach(item\
  \ => {\naddItemToDOM(item);\n});\ndocument.getElementById('shoppingForm').addEventListener('submit',\
  \ function(event) {\nevent.preventDefault();\nconst itemInput = document.getElementById('itemInput');\n\
  const itemText = itemInput.value;\nif (itemText === '') return;\naddItemToDOM(itemText);\n\
  items.push(itemText);\nlocalStorage.setItem('items', JSON.stringify(items));\nitemInput.value\
  \ = '';\n});\nfunction addItemToDOM(itemText) {\nconst li = document.createElement('li');\n\
  li.textContent = itemText;\nconst removeButton = document.createElement('button');\n\
  removeButton.textContent = 'Remove';\nremoveButton.classList.add('remove');\nremoveButton.addEventListener('click',\
  \ function() {\nli.remove();\nconst index = items.indexOf(itemText);\nif (index\
  \ !== -1) {\nitems.splice(index, 1);\nlocalStorage.setItem('items', JSON.stringify(items));\n\
  }\n});\nli.appendChild(removeButton);\nitemList.appendChild(li);\n}\n});\n```\n\n\
