  <div class=\"choices\">\n<button class=\"choice\" data-choice=\"rock\">Rock</button>\n\
  <button class=\"choice\" data-choice=\"paper\">Paper</button>\n<button class=\"\
  choice\" data-choice=\"scissors\">Scissors</button>\n</div>\n<p id=\"resultDisplay\"\
  ></p>\n</div>\n<script src=\"script.js\"></script>\n</body>\n</html>\n```\n\nCSS：\n\
  \n```css\nbody {\nfont-family: Arial, sans-serif;\ndisplay: flex;\njustify-content:\
