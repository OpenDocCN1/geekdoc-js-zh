  trans: "\n就这些！你现在已经成功创建了一个更加注重安全的表单。\n\n### name 属性\n\n在阅读下方的示例时，你会在几段代码中注意到 `name`\
    \ 属性。这与 `value` 属性不同，后者改变的是元素的名称——即用户看到的文本。`name` 属性与表单的 `action` 配合工作，并根据你提供的作为变量标识的文本创建一个变量。例如，如果你在某个表单输入类型之后给出\
    \ `name=\"user\"`，那么该细节将被存储在一个名为 `user` 的变量中，并会被发送到你使用表单 `action` 创建的页面。在页面中，每当你需要使用相应的细节进行某些操作时，都可以通过变量\
    \ `user` 对其进行处理。\n\n通常，当你希望用户通过单个提交按钮提交字段列表时，添加 `name` 属性是很有必要的。如果你没有这样做，信息将不会发送到页面；如果你只对少数几个字段包含了该属性，那么只有这些对应字段的细节会被发送到页面进行后续处理。\n\
    \n### option 标签\n\n在我们讨论输入类型以及你将在表单中为了方便使用的使用的各种元素之前，你需要了解一个名为 `<option>` 标签的重要标签。当你希望用户能够从选项列表中选择时，就应该使用这个标签。让我们来看\
    \ `option` 标签使用的语法：\n\n```html\n<option value=\"game1\" Super Mario>\n<option\
    \ value=\"game2\" Runescape>\n```\n\n如果你执行这段代码，你会发现屏幕上只显示 Super Mario 和 Runescape\
    \ 两个名称，而没有选择它们的选项。`option` 标签只创建选项，并没有将它们分组到单个字段中的功能。这正是 `select` 和 `datalist`\
    \ 元素用用场。`option` 标签与这些标签配合工作，但关于这两个新标签的内容将在稍后介绍。\n\n目前，只要理解这些基础标签和属性就足够了，它们将在后续不同元素的示例中频繁使用。现在让我们进入不同的输入类型以及每种类型的示例代码，以便你更好地理解。\n\
    \n### Input（输入）\n\n有很多输入元素类型。你创建的每个表单都会用到其中几种。让我们来看看此类输入类型使用的基本语法：\n\n```html\n\
    <input type=\"relevant_type\" name=\"relevant_name\" value=\"relevant_value\"\
    >\n```\n\n#### Text（文本）\n\n这启用了一个单行输入字段（注意，该字段只接受文本）。\n\n示例\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<form action=\"\">\nUsername:<input type=\"text\" name=\"\
    username\">\n</form>\n</body>\n</html>\n```\n\n这段代码在用户提供其用户名（Username）时接收其文本。用户的输入将存储在你发送文件所在页面中名为\
    \ `username` 的变量中。表单的 `action` 被留空了，你可以插入任何你想让信息发送到的页面。\n\n#### Submit（提交）\n\n\
    这创建了一个名为“Submit”的按钮，其功能正如其名。它将输入的细节发送到表单处理器（form handler），这是表单 `action` 的高级名称。\n\
    \n示例\n\n```html\n<form action=\"action.php\">\n  Username:<br>\n  <input type=\"\
    text\" name=\"userid\"><br>\n  Password:<br>\n  <input type=\"password\" name=\"\
    pass\"><br>\n  <input type=\"submit\" value=\"Submit\">\n</form>\n```\n\n在这里使用了另一种名为\
    \ `Password`（密码）的输入类型。当给出 `<input type=\"password\">` 时，文本框也接受特殊字符，并且一旦按下 Submit\
    \ 按钮，细节就会发送到表单处理器。通过更改提交按钮的 `value` 值，你可以更改文本。例如，给出 `value=\"Click to confirm\"\
    ` 将创建一个显示“Click to confirm”的按钮，但执行的是提交按钮的操作。\n\n#### Radio（单选框）\n\n单选框输入类型为用户提供了一个供列表列表，用户在任何时间只能选择其中一个。\n\
    \n示例\n\n```html\n<form>\n  <input type=\"radio\" name=\"occupation\" value=\"\
    student\"> Student<br>\n  <input type=\"radio\" name=\"occupation\" value=\"unemployed\"\
    > Unemployed<br>\n  <input type=\"radio\" name=\"occupation\" value=\"teacher\"\
    > Teacher\n</form>\n```\n\n这创建了一个关于用户职业的选项列表。如果你希望某个特定选项被默认选中，可以通过输入类型的末尾添加 `checked`\
    \ 来实现。\n\n例如，将 `<input type=\"radio\" name=\"occupation\" value=\"student\"> Student<br>`\
    \ 替换为 `<input type=\"radio\" name=\"occupation\" value=\"student\" checked> Student<br>`\
    \ 将默认选中 Student。\n\n#### Checkbox（复选框）\n\n当你想要用户从你提供的选项中选择多个选项时，使用复选框。语法与其他输入类型相同。\n\
    \n示例\n\n```html\n<form action=\"action_page.php\">\n<input type=\"checkbox\" name=\"\
    gadget1\" value=\"Laptop\" >I have a laptop <br>\n<input type=\"checkbox\" name=\"\
    gadget2\" value=\"PC\">I have a PC<br>\n<input type=\"submit\">\n</form>\n```\n\
    \n这个示例创建了 2 个复选框，询问用户是否拥有笔记本电脑和 PC。再次，如果你想让某些选项默认选中，在输入类型的末尾添加 `checked`：\n\n\
    ```html\n<input type=\"checkbox\" name=\"gadget1\" value=\"Laptop\" checked>I\
    \ have a laptop <br>\n```\n\n#### Button（按钮）\n\n你可以利用按钮输入类型来定义点击按钮执行的操作。\n\n示例\n\
    \n```html\n<input type=\"button\" onclick=\"alert('HTML tutorial!')\" value=\"\
    Click Here!\">\n```\n\n这段小代码生成了一个显示“Click Here!”的按钮，点击时会弹出消息。与其他输入类型一样，更改 `value`\
    \ 将更改按钮内部的消息。\n\n#### Number（数字）\n\n这是一种只接受用户数字的输入类型。你可以选择数字的范围，用户能够提供一个仅在该范围内的数字。当你想要为出生日期或年龄之类的提供输入字段时，这非常有用。该字段自带选择箭头，可以使用它们，或者用户也可以手动输入输入。\n\
    \n示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<form action=\"page.php\">\n\
    Birthdate:\n<input type=\"number\" name=\"quantity\" min=\"1\" max=\"31\">\n<input\
    \ type=\"submit\" value=\"Confirm\">\n</form>\n</body>\n</html>\n```\n\n这段示例代码将创建一个出生日的输入字段，最大值为\
    \ 31，最小值为 1。你可以根据喜好更改这些数字。`min` 和 `max` 关键字分别代表最小和最大，正如你可能到的。然而，如果你的浏览器是 Internet\
    \ Explorer 9 或更早版本，这种输入类型将无法工作。\n\n#### TextArea（文本区域）\n\n当你的表单要求用户输入个人细节时，你需要一个可以接受多行输入的输入字段。在这种情况下，使用\
    \ `text` 输入类型将不起作用，你需要使用 `TextArea`。\n\n示例\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<textarea rows=\"5\" cols=\"75\">\n你可以使用这个空间输入任何你想输入的内容。所有内容都将显示在文本字段中。如果你决定不提供默认的信息或文本，可以留空这个空间，用户就可以输入他们的个人细节或你需要的相关细节。\n\
    </textarea>\n</body>\n</html>\n```\n"
- fmt: '

    This example code unfortunately only gets the details, but does not do anything
    with the details. In order to process the information, you need to include a submit
    input type, which was discussed earlier, and a form action. This form action has
    to send the details to a relevant page on the website (usually within the webpage
    itself), where the details can be processed, and the final result can be used.
    For example, if you want the details to get stored in a database, you need to
    do so via the `form action`, which is not possible without a submit button. Once
    again, it’s quite obvious, but ‘rows’ stands for the number of rows you want the
    input field to have, and ‘cols’ stands for the number of columns that you want
    (which is basically the number letters per line, including blank spaces).


    ## Range


    You may have seen in several HTML forms a slider, in which you lick on a circular
    button and drag it to the position you want to indicate a number or percentage.
    You can do that with the help of the `<range>` tag. This creates a slider with
    the minimum and maximum values set by you, that the user can use.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <form action="action_page.php" method="get">

    Percentage:

    <input type="range" name="percent" min="0" max="100">

    <input type="submit">

    </form>

    </body>

    </html>

    ```


    This would create a slider with a range of 0-100%, and you will be able to select
    any value in between. This accepts only whole numbers however. An ideal example
    of this would be in a form that gets input from the user regarding their fat percentage,
    height, and weight, and then give the Body Mass Index (BMI) as an output. Here,
    instead of getting the input from the user as a numbers for the fat percentage,
    you can use a slider to do so. In the end, what matters is that the form is easy
    to use, and not how the input is obtained.


    Note that the `<range>` tag is not supported in Internet Explorer 9 and its previous
    versions.


    ## Time and Week


    The time and week tags allow the user to input the time and week, as well as year.
    If your form requires your user to input his or her birth year, then using these
    tags will make it much easier, since it pops up a time or a week picker, from
    which the user can just select the time, week, and year instead of typing it out.


    ### Example


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <form action="page.php">

    Choose time:

    <input type="time" name="time">

    <input type="submit">

    </form>

    </body>

    </html>

    ```


    This example creates a field where the user has to type in the time, or select
    from a time-picker which should pop up as soon as he or she starts typing. It’s
    important to know that this time picker might not be supported in certain browsers,
    so do make sure to check beforehand if what you need your user to do is select
    from the picker and not type the input out.


    In a similar way, the input type `week`, `datetime` and `month` can be used. Week
    and month work with most browsers, but `datetime` tag also gives the timezone.
    If you only want the local time in the user’s country, then using `datetime-local`
    would be more appropriate. Once again, the code for `datetime-local` is the same
    as the ones for `week` and `month`.


    These are some of the various input types that you can use (and will be using)
    in all of your forms. Now that you have a clear idea of the different input types
    in your mind, it is time to move onto the different elements that you can use
    within these input types, to make your form look even better and make it easy
    to use.


    ## Select


    The `select` attribute of the HTML form creates a drop down list. This list contains
    options that the user can select. This is different from the attributes like ‘Number’,
    because the user will only be able to select the option, and cannot type anything
    in it.


    ### Example


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <form action="page.asp" method="POST">

    Username:<input type="text" name="userid">

    <input type="submit" value="Store User ID">

    <br>

    List:

    <select>

    <option value="a">A</option>

    <option value="b">B</option>

    <option value="c">C</option>

    <option value="d">D</option>

    </select>

    </form>

    </body>

    </html>

    ```


    Here, the `POST` method is used, which as stated before, will prevent the details
    from appearing in the URL when the user hits the submit button. In the list, you
    can add as many options as you want, but make sure to include the `</option>`
    tag after each option. When you want the selected option to have a specific variable
    name in the page you’re sending it to, then use the `name` attribute. Your code
    should look something like this:


    ```html

    <select name="name_you_want_in_page">

    ```


    ## FieldSet and Legend


    Legend is used to give a caption to the `<fieldset>` tag. The `fieldset` tag groups
    together the elements you want. A visible border appears around the elements when
    the `fieldset` tag is used. This makes it much easier for your user to read and
    understand what is required as an input. What the `legend` tag does is, it creates
    a caption just at the top of the `fieldset`, which makes it even more easier for
    the users. As a website designer, the user’s comfortability should be your primary
    aim, and as such, these tags will come handy.


    ### Example


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <form>

    <fieldset>

    <legend>Education:</legend>

    School: <input type="text"><br>

    College: <input type="text"><br>

    Qualifications: <input type="text">

    <input type="submit">

    </fieldset>

    </form>

    </body>

    </html>

    ```


    This code will create 3 text boxes, where the user will enter the corresponding
    details, and the submit given at the end performs the same action as stated before.


    ## HTML5 Elements


    The elements given below are but two of the various elements that have been added
    in HTML5. These elements work only in HTML5 compatible browsers.


    ### Datalist


    At times, going through a list while looking for a particular option can be annoying,
    especially if the list is large. In such cases, adding a `datalist` instead of
    just the `<option>` tag would make it easier for the users. Datalist is different
    from the number tag, only this for text. It acts as an auto-fill feature for the
    input field. As soon as he she starts typing, the relevant choice pops up.


    ### Example


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <form action="page.asp" method="get">

    <input list="bike" name="bike">

    <datalist id="bike">

    <option value="bike1">

    <option value="bike2">

    <option value="bike3">

    <option value="bike4">

    <option value="bike5">

    </datalist>

    <input type="submit">

    </form>

    </body>

    </html>

    ```


    Despite being very useful, the `datalist` tag can be used only in HTML5, and is
    not supported by Internet Explorer 9 or its previous versions is not supported
    even by Safari.


    ### Keygen


    When you want to authenticate your users, then you have to use the `keygen` tag.
    This tag does the function of creating a pair of keys. One of these keys will
    be stored locally, and the other will be sent to the server. Of course, the locally
    stored key will be private, and the other will be public.


    ### Example


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <form action="page" method="get">

    Username: <input type="text" name="userid">

    Encryption: <keygen name="password">

    <input type="submit">

    </form>

    </body>

    </html>

    ```


    Here, the `name` ‘password’ refers to the name of the variable in the page you’re
    sending, which stores the generated key. Unfortunately, this tag is not supported
    by any of the Internet Explorer versions, so use caution before actually implementing
    it in your website.

