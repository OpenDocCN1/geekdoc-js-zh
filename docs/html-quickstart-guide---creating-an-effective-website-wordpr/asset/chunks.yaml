    Chapter 6: Comments


    Comments are nothing but pieces of code that are ignored by web browser. Adding
    comments to the HTML code is a very good practice, especially for complex documents.
    Comments indicate different sections of a document. They can also be used for
    indicating other notes to other persons looking at the code. By increasing the
    code readability, comments help users to understand code easily.


    For adding a comment in HTML, you need to place the content in between the tags
    <!-- ... -->. Any content that is placed inside these tags will be considered
    as comments and the browser will completely ignore them. Here is an example


    Example


    <!DOCTYPE html>     <html>     <head>  <!-- Document Header Starts -->     <title>This is document title</title>     </head> <!-- Document Header Ends -->     <body>     <p>The content of the document goes here.....</p>     </body>     </html>


    This code will produce the output which displays the content placed inside the
    paragraph tag but it will hide the content placed inside the comment tags.


    The content of the document goes here…..


    ## Valid vs. Invalid Comments


    Comments cannot be nested; this means that you cannot place a comment inside another
    comment. You should always ensure that there are no spaces given at the start
    of the comment string. The ‘--’ (double dash sequence) may not appear within a
    comments except in the closing tag (-->). Here is an example.


    Example


    In this example, we will give a valid comment and it will be ignored by the browser.


    <!DOCTYPE html>     <html>     <head>     <title>Example for Comment</title>     </head>     <body>     <!--   This comment is valid -->     <p>The content of the document goes here.....</p>     </body>     </html>


    The above code will produce the following output:


    The content of the document goes here…..


    The following example will have an invalid comment. Browsers do not hide invalid
    comments and they display them as content. We will add an extra space in between
    the opening < and !.


    <!DOCTYPE html>     <html>     <head>       <title>Example for Invalid Comment</title>     </head>     <body>     < !--   This comment is not a valid one -->     <p>The content of the document goes here.....</p>     </body>     </html>


    The above code will produce the following output:


    < !-- This comment is not a valid one -->


    The content of the document goes here.....


    ## Multiline Comments


    So far, we have only discussed about single line comments. However, HTML also
    supports the multi-line comments.


    You can increase the code readability by adding comments in multiple lines by
    using a special beginning and ending tags <!-- and --> that are placed in front
    of the first line and after the last line as given in the example shown below.


    Example


    <!DOCTYPE html><html>     <head>       <title>Multiline Comments</title>     </head>     <body>     <!--        This is an example of multiline comment and


    it can be extended to any number of


    lines you like.


    -->     <p>The content of the document goes here.....</p>     </body>     </html>


    The above code will produce the following output:


    The content of the document goes here.....


