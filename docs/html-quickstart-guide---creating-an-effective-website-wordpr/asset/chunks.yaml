  raw: 'This covers most of the commonly used basic elements in HTML forms that you
    need to know about. Remember that just reading through this will do no good; you
    have to actually execute these codes, experiment with them, modify them to your
    tastes, and finally start writing your own code in order to truly master the powerful
    tool that is the HTML form. This is true not only for the HTML form, but also
    the other elements in HTML. Now that we have seen the common elements, let us
    move on and take a look at some elements and attributes that can be used to make
    your form look a tad more organized.


    ### Optgroup


    The <optgroup> tag helps with grouping together different options. You may ask
    the need for grouping something that is already grouped together within a single
    field (usually using <select> or <datalist>. To clear this confusion, let us look
    at an example:


    Suppose you want your user to tell what model of laptop he or she is using currently.
    You could just simply create a huge list of different brands of laptops with their
    several models. Though this it is possible, it is extremely time consuming for
    the user to select the laptop model from the list that contains thousands of options.
    Now if you did not use <datalist> but used <select>, this makes it almost impossible
    for the user to find his or her model, as the user will not be able to even type
    the first few numbers or letters, to simplify the search. This would be a code
    that produces results, albeit ineffectively. The very idea idea of coding is to
    optimize time consumed, both by the user, and by the processing.


    This is where the <optgroup> tag comes into play. Suppose you group together different
    models under the same brand, you will be able to create a list which contains
    the brand names, with a sub-list in between each brand name which would contain
    the model. Not only will this make the selection process much easier for the user,
    it also organizes your list, giving it a more professional and presentable look.


    Example


    <!DOCTYPE html>


    <html>


    <body>


    <select>


      <optgroup label="HP">


        <option value="envy">Envy</option>


        <option value="pavilion">Pavilion</option>


      </optgroup>


      <optgroup label="Lenovo">


        <option value="y50">Y50</option>


        <option value="y40">Y40</option>


      </optgroup>


    </select>


    </body>


    </html>


    Try executing the above code without the <optgroup> tags. You will notice a list
    that contains Envy, Pavilion, Y50, and Y40, with no order. Now use the exact code
    given above, and you will obtain a list that has several sub-headings (you get
    the same number of sub-headings as the <optgroup> tags used) under which the models
    will be listed. If you are using the <select> tag to get some input from the user,
    and your options are quite large in number, then you must use the <optgroup> tag.


    The ‘label’ in the <optgroup> syntax is the name you want to give the sub-heading.
    Note that only the options can be selected, and the sub-headings cannot.


    ### Readonly


    Sometimes you require a field which has a set value or text in it, which the user
    should not be able to change, but should be able to see. When you have such a
    situation in your hands, the <readonly> attribute becomes useful. Just as the
    name suggests, the user will be able to only read what is given in the field,
    and will not be able to make changes to the field.


    The syntax for <readonly> tag is:


    <input type=“type_you_need” name=“name” value=“value” readonly>


    Example


    <!DOCTYPE html>


    <html>


    <body>


    <form action=“page.php">


    Your current location:<br>


    <input type="text" name="place" value=“California” readonly>


    <br>


    </form>


    </body>


    </html>


    When this code gets executed, you will be able to see ‘California’ displayed in
    the input field, but will not be able to make any change to the field.


    ### Autocomplete


    An element you should definitely be aware of to make things easier for your user,
    especially if you form is to be used repeatedly. If your user has to submit a
    report once in a couple of days using your HTML form, then using the <autocomplete>
    tag will make it much easier for him or her. If you’re aware of the Autofill setting
    in the Google Chrome browser, then understanding the function of this tag should
    be easy. It is the same, except that the user has to first input the details at
    least once, before the form starts autocompleting the fields.


    Let us look at the basic syntax for autocomplete, which is usually placed along
    with the form action. This enables the autocomplete attribute in all of the form’s
    elements.


    <form action=“page.pgp” autocomplete=“on”>


    Example


    <!DOCTYPE html>


    <html>


    <body>


    <form action="action_page.php" autocomplete="on">


    Name:<input type="text" name="name"><br>


    Age:<input type="number" name="age"><br>


    Work ID <input type="number" name="id" autocomplete="off"><br>


    <input type="submit">


    </form>


    </body>


    </html>


    This code will create 3 fields, one each for name, age and work ID. The first
    time the user uses the form, he or she will have to type in the details completely.
    From then on, whenever the form is used, autocomplete will kick in as soon as
    the field is double-clicked, or the first letter is typed, making everything so
    much more easier for the user.


    Note that autocomplete is switched off for the Work ID. This is done because the
    Work ID, which should be kept private should not be displayed to others who type
    in someone else’s name. What this basically means is that you can switch autocomplete
    attribute off to which field you want by adding an <autocomplete=“off”> at the
    end of the input type.


    This covers most of the HTML form elements, and you should be able to create your
    own form with different elements and attributes now. Always remember to keep trying
    different elements to find out what makes the form easy to use. The ultimate aim
    of a form is to make it easy to use so that even a layman will be able fill it
    up quickly.


