  trans: "\n# HTML5 语义元素\n\n## 引言\n\n我们已经详细讨论过一个语义元素，尽管当时没有提及：<form>。是的，<form> 标签是一个语义元素！当你看到\
    \ <form> 标签时，你会立刻意识到它与表单有关，并且可以开始相应地添加属性。\n\n## 语义元素概述\n\n以下是 HTML5 提供的部分语义元素列表：\n\
    \n- <details>\n- <article>\n- <section>\n- <summary>\n- <time>\n- <aside>\n- <mark>\n\
    \n现在我们将通过一些示例来了解这些标签的工作原理。\n\n## 示例\n\n### 文章\n\n<article> 标签允许你创建一篇文章。当然，你可以创建与网页相关联的文章，但文章的一般理念是每篇文章都应该不同。因此，当你想要提及与网站主题完全无关或毫不相干的内容时，可以使用\
    \ <article> 标签。\n\n以下是一个示例代码，你可以尝试运行：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <article>\n  <h2>This is the article’s heading</h1>\n  <p>With the help of the\
    \ article tag, you can create articles that provide content not related to the\
    \ webpage.</p>\n</article>\n</body>\n</html>\n```\n\n上述代码将执行给定的文本，标题以 <h2> 大小显示。\n\
    \n### 章节\n\n章节是基于单一思想或主题的内容组。这就是它们与文章的区别，文章的主题可以是任何内容。章节必须围绕一个主题才能使表述有意义。以下是一个如何在\
    \ HTML 中组合两个章节的示例：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<section>\n  <h1>Section\
    \ 1</h1>\n  <p>This is section 1’s content. This section states that HTML coding\
    \ is easy to learn, and easy to forget, so stay in practice if you want to become\
    \ a professional!</p>\n</section>\n<section>\n  <h1>Section 2</h1>\n  <p>This\
    \ is section 2\\. This section would like to say that this book covers almost\
    \ all the concepts, and you can always come back and refer to it when you get\
    \ doubts regarding the basics.</p>\n</section>\n</body>\n</html>\n```\n\n如你所见，这两个章节的主题都是\
    \ HTML，但它们要表达的内容却大相径庭。\n\n### 侧边栏\n\n很多时候，你可能见过主内容居中或靠左显示，而一些次要的关联内容显示在侧边栏中。这通过\
    \ <aside> 标签实现。该标签用于显示与主题相关的小段信息，可以放置在两侧。\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<p>This is the main topic, about HTML.</p>\n<aside>\n  <h4>HTML</h4>\n\
    \  <p>HTML is Hyper Text Markup Language</p>\n</aside>\n</body>\n</html>\n```\n\
    \n### 详情与摘要\n\n这是一个你可能见过的小箭头标记，点击后会展开一个小文本框并显示附加信息。<details> 因此是一种用户可以选择查看的附加信息方式。<summary>\
    \ 标签允许你为 <details> 标签添加标题。理解这一点的最好方式是通过示例：\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<details>\n  <summary>Click here for more info</summary>\n  <p>This is\
    \ the extra information.</p>\n</details>\n</body>\n</html>\n```\n\n当你尝试这段代码时，你会注意到摘要中的文本会作为标题显示，而其他文本则进入可展开的文本框。这就是\
    \ <details> 和 <summary> 的工作方式。\n\n### 图像与图注\n\n这再简单不过了。你可以使用 <figure> 和 <figcaption>\
    \ 标签为图像添加标题。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>This is your description.\
    \ Instead of giving a caption for the image you are uploading as a description,\
    \ it might be a better idea to use the <figcaption> tag as shown below.</p>\n\
    <figure>\n  <img src=“image.jpeg\" alt=“Enter Image\" width=\"300\" height=\"\
    220\">\n  <figcaption>Image1: This is your caption.</figcaption>\n</figure>\n\
    </body>\n</html>\n```\n\n## 结论\n\n创建网页这件事多年来一直被神秘感和网络术语所笼罩，但我希望我已经向你表明，它并没有你想象的那么可怕。事实上，HTML\
    \ 实际上是相当直观的。如果你正在寻找一种真正能有所成就且易于解释的爱好，那么你来对地方了。这些是你构建网页的基础，你可以进一步学习 CSS、Java、JavaScript、C++\
    \ 等等，永无止境。记住，如果你真正掌握并理解了当前所做的事情，你就永远不会力不从心。\n\n如果有什么让你感到困惑或不解，我最好的建议是打开 TextEdit\
    \ 或记事本，开始动手实践。在浏览器中打开它，看看它对你的页面有什么作用。一步一步地学习必然会带你走向成功。没有必要在完全理解所做的事情之前就急于前进。\n\
    \n如果你发现自己需要回归基础，或者只是不记得如何做某件简单的事，就回到这本书，看看基础知识。凭借我在本书中向你展示的一切，你应该能够掌握网页制作的开端，如果你能把握住开端，剩下的就是一步一步地迈出下一步。祝你好运，去创造一个精彩的网页吧。\n\
