    # 第 10 章：HTML 颜色


    颜色在美化网页方面起着非常重要的作用，能让页面看起来赏心悦目。在页面级别，你可以通过 `<body>` 标签指定颜色。你也可以使用 `bgcolor` 属性为不同标签设置颜色。


    `<body>` 标签提供以下属性，可用于设置不同的颜色。


    - `vlink` – 设置已访问链接（点击过一次或多次的链接）的颜色。

    - `link` – 用于设置链接文本的颜色。

    - `alink` – 用于设置选中链接或活动链接的颜色。

    - `text` – 用于设置正文文本的颜色。

    - `bgcolor` – 用于设置背景颜色。


    ## HTML 颜色编码方法


    HTML 中有三种不同的方法为网页设置颜色，如下所示：


    - 颜色名称 – 你可以直接指定颜色名称，例如红色、蓝色或绿色。

    - 十六进制代码 – 你可以使用六位十六进制代码指定颜色。每种颜色都可以通过其中包含的红色、蓝色和绿色来表示。十六进制代码正是这种表示方式。

    - 颜色十进制值或百分比值 – 该值通过 `rgb()` 属性指定。


    现在我们将详细探讨这些配色方案。


    ## HTML 颜色 – 颜色名称


    你可以直接指定颜色名称来设置背景或文本颜色。W3C 列出了总共 16 种基本颜色，这些颜色可通过 HTML 验证器验证。大多数主流浏览器支持超过 200 种不同的颜色。


    W3C 标准 16 种颜色


    W3C 推荐的 16 种标准颜色列表如下。


    ![](img/image00125.jpeg)


    示例


    以下是一个使用颜色名称设置背景颜色的示例。


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>按名称设置 HTML 颜色</title>

    </head>

    <body text="blue" bgcolor="green">

    <p>为 body 和 table 使用不同的颜色名称，查看结果。</p>

    <table bgcolor="black">

    <tr>

    <td>

    <font color="white">这段文本将在黑色背景上显示为白色。</font>

    </td>

    </tr>

    </table>

    </body>

    </html>

    ```


    ## HTML 颜色 – 十六进制代码


    十六进制代码是颜色的六位数字表示。十六进制代码的前两位代表红色的值，中间两位代表绿色的值，最后两位代表蓝色的值。十六进制代码格式为 RRGGBB。


    你可以从图形软件（如 MS Paint、Paintshop Pro 或 Adobe Photoshop）中获取十六进制值。


    十六进制代码前会带有井号 # 或英镑符号。下面是一个使用十六进制代码表示颜色的表格。


    ![](img/image00126.jpeg)


    示例


    以下示例展示了如何通过十六进制颜色代码设置 HTML 标签的背景：


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>按十六进制设置 HTML 颜色</title>

    </head>

    <body text="#0000FF" bgcolor="#00FF00">

    <p>为 body 和 table 使用不同的十六进制颜色，查看结果。</p>

    <table bgcolor="#000000">

    <tr>

    <td>

    <font color="#FFFFFF">这段文本将在黑色背景上显示为白色。</font>

    </td>

    </tr>

    </table>

    </body>

    </html>

    ```


    ## HTML 颜色 – RGB 值


    颜色值可以通过 `rgb()` 属性指定。该属性分别接受红色、绿色和蓝色三个值作为输入。每个颜色的取值范围为整数 0 到 255，或百分比形式。


    以下是一些颜色的 RGB 值列表。


    ![](img/image00127.jpeg)


    示例


    以下示例展示了如何通过 `rgb()` 值设置 HTML 标签的背景颜色：


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>按 RGB 代码设置 HTML 颜色</title>

    </head>

    <body text="rgb(0,0,255)" bgcolor="rgb(0,255,0)">

    <p>为 body 和 table 使用不同的颜色代码，查看结果。</p>

    <table bgcolor="rgb(0,0,0)">

    <tr>

    <td>

    <font color="rgb(255,255,255)">这段文本将在黑色背景上显示为白色。</font>

    </td>

    </tr>

    </table>

    </body>

    </html>

    ```


    注意：并非所有浏览器都支持 `rgb()` 颜色属性。因此在使用时需谨慎。


    ## 浏览器安全颜色


    共有 216 种颜色被认为是浏览器安全的。它们是计算机无关的颜色。这些颜色的十六进制代码范围从 000000 到 FFFFFF。所有拥有 256 色调色板的计算机都支持这些颜色。


    ![](img/image00128.jpeg)


    # 第 11 章：HTML 多媒体


    随着多媒体在互联网上风靡一时，当今世界上没有设计师不想为自己的网站添加多媒体。添加多媒体能确保你的网站看起来令人惊艳，如果你的网站需要稳定的流量，那么添加此类媒体就变得必不可少。


    当第一批浏览器问世时，它们只支持文本。你能想象一个只显示文本的网页吗？没有图片、没有视频、没有声音、没有 GIF。最糟糕的是，只有一种字体和一种颜色！听起来枯燥乏味，不是吗？这很可能正是当时浏览器开发者的想法，因为之后推出的浏览器开始支持媒体了！


    添加多媒体非常容易且有趣，但你需要判断用户使用的浏览器是否支持该媒体。大多数浏览器支持本章讨论的流行格式，但有时也会失效。在这些并不罕见的情况下，你可能需要安装额外的程序（称为插件）才能让媒体在网页浏览器中正常工作。幸运的是，随着
    HTML5 的出现，所有这些问题都将消失，多媒体前景一片光明。


    由于之前已经讨论过添加图片，本章将重点介绍如何将视频和声音集成到网页中。在操作时，你有责任让用户尽可能轻松地浏览你的网页。这意味着你需要决定是否希望某些图片和声音在页面弹出时自动播放。如果你的网站面向经济条件较好的用户，他们很可能拥有快速的互联网连接，这意味着加载这些图片和声音不会浪费他们的时间。想象一下一个网速很慢的用户。如果你在网页中添加声音和图片，并让它们在页面打开时立即加载，那么由于网速慢，用户将永远无法正常使用你的网站。这是一个权衡：既要让网页吸引人、有吸引力，又要维护你的用户基础。当你的网站依靠流量赚钱时，这是一个严肃的问题。维护用户基础比在网页中添加大量媒体更重要，尤其是当你的网站并非围绕多媒体主题时。


    在解决了这个略显枯燥但严肃的问题，并且你已做出权衡决定之后，让我们来看看目前最常用的一些流行视频和声音格式，以及如何将它们添加到网站中的示例代码。


    ## MPEG


    由动态图像专家组（Moving Pictures Experts Group）开发的 MPEG 格式一经问世便风靡互联网。它是迄今为止最流行的格式，受到所有浏览器的支持。没错，是所有浏览器！但不幸的是，HTML5
    非常挑剔，只允许少数几种视频格式，即 MP4、WebM 和 Ogg。因此，此处不讨论 MPEG 格式。


    '
- fmt: '

    ## Adding Audio


    As with videos, prior to HTML5, audio could not be integrated into a website easily.
    The website designer had to use additional programs called plug-ins to let the
    audio play in the website. That is to say, there was no standard. HTML5 once again
    swept away these hardships and brought us a new, easy way for playing audio files
    in a web page : the `<audio>` tag.


    HTML supported different audio formats, but only with the help of the annoying
    plug-ins (which used to be the primary reason for the webpage crashing). HTML5
    however, is picky with audio as well as video, and allows only 3 formats. These
    are the `ogg`, `mp3`, and `wav` formats.

    '
  raw: 'In previous versions of HTML, you are required to install an additional plug-in
    in order to embed videos on to your webpage. As tedious as it sounds, it was actually
    how things were done before. But now, with HTML5, this problem has been solved,
    and videos can now be included with just a simple <video> tag, much like how the
    HTML supports images using <img> tag (as discussed in an earlier chapter).


    ## Adding Videos


    The basic syntax for adding videos is :


    <video>


    <source>


    </video>


    Now, the source tag obviously should not be blank as given above. Let us take
    a look at an example, and then we will see the different attributes used, and
    which attributes you can use to further customize the video appearance on the
    web page.


    Example


    <!DOCTYPE html>


    <html>


    <body>


    <video width="640" height="480" controls>


      <source src=“example.mp4" type="example/mp4">


      <source src=“example.ogg" type="example/ogg">


    </video>


    </body>


    </html>


    The above code will embed the example video on to the website. If it has not come
    to your attention yet, there are 2 videos included here. It’s actually just one
    video in 2 different formats. The browser will automatically include the video
    that it supports, and disregards the other video format. Also, when you decide
    to include text within the video tags, it gets displayed only if the browser does
    not support the format. Therefore, a good (and easy) way of checking if the browser
    supports a specific format would be to try this code out first before executing
    your actual code:


    <!DOCTYPE html>


    <html>


    <body>


    <video>


      <source src=“example.mp4" type="example/mp4">


    Looks like your browser does not support the mp4 format. Try another browser,
    or change the format now.


    </video>


    </body>


    </html>


    The text given after the <source> tag will get displayed on your screen only when
    the format of the video you have taken is not supported by the browser.


    Let us now take a look at the different attributes included in this example.


    ## Width and Height


    Under the <video> tag, width and height are mentioned, which are the dimensions
    of the video as it appears on the webpage. If you do not include the the width
    and height attributes, the browser will automatically select the default width
    to height ratio of the video. When you go for the default video size as chosen
    by the browser, the video will begin to flicker whenever it loads, which becomes
    an annoying issue.


    However, if you do include these two attributes, but give lower aspect ratios
    than the actual video, then the video displayed on the webpage will be scaled
    down, proportionately. If you give the width and height attributes a value greater
    than the video’s actual aspect ratio, then the the video will cover more screen,
    but the video size remains as is. The rest of the area gets filled by a black
    space. For a user, this would look absolutely horrible, and you should avoid giving
    greater aspect ratios at all costs. When worst comes to worst and you are not
    able to find out the aspect ratio of the video, then just include the video without
    any aspect ratio. The default video size look will be much better than the same
    sized video being displayed in large black space.


    ## Controls


    You must have seen the play, pause, seeking, volume, toggle full-screen, captions/subtitles
    and other controls in most of the video streaming websites you have used. These
    are nothing but the ‘controls’ in HTML5\. Instead of adding these options one
    by one, HTML5 makes it extremely easy; all you have to do is include the term
    ‘controls’ in the video tag, and all of these options become available in the
    video.


    It’s important to note that the the full-screen option may not be available to
    you if the browser does not support it. It is mandatory that you check which browser
    accepts the video format you are using, and which browser allows the full-screen
    option.


    ## Source


    Source src is literally as it sounds - this is what you have to use to specify
    which video you want to embed on to the website. When you include multiple source
    files in different formats, then the browser will automatically use the first
    format that it recognizes. Basically, the source attribute is your way of telling
    the browser to pick whatever format it wants.


    ## Allowfullscreen


    An attribute that would make users extremely happy, the allowfullscreen attribute
    does what it says. It gives the user a choice of using the full-screen option.
    Usually, when videos are played, they do not maximize automatically, and in most
    cases there will not be an option to play the video in the entirety of the screen
    since the videos are normally played within the specified iframes. However, in
    HTML5, the allowfullscreen attribute makes everything better by adding the full-screen
    feature. When the attribute is enabled, you should be able to see a full-screen
    button at the bottom right corner of the video, which when clicked opens the video
    in a fullscreen. This attribute should not really pose a problem to you, since
    most browsers allow fullscreen options. An important point for you to note here
    is that only if the browser  used itself has a fullscreen option will the allowfullscreen
    attribute work.


    ## Autoplay


    This is a very dangerous attribute to experiment with. It does not really have
    any technical problems, but this feature can either make or break your user-base.
    When the <autoplay> attribute is included, the video you have embedded on to your
    website starts playing as soon as the page loads. While this may make it seem
    like you are actually doing the user a favor by automatically playing the video
    for him or her, if the user has a slow connection then the page will take quite
    a long time to load. This means that the chances of losing your users increases
    drastically.


    To enable autoplay, just add the ‘autoplay’ at the end of the video tag, as shown
    in the following example:


    <!DOCTYPE html>


    <html>


    <body>


    <video>


    <source src=“example.mp4" type=“example/mp4" autoplay>


    Looks like your browser does not support the mp4 format. Try another browser,
    or change the format now.


    </video>


    </body>


    </html>


    This is the same code, with the addition of autoplay. If the browser supports
    the video format, then the video automatically plays in the webpage.


    With this, we come to conclusion of the video tag being used in HTML5 to embed
    videos on to your webpage. Embedding videos on to your webpage has become very
    easy with HTML5, but do take care and ensure that the web browser your users will
    be using actually supports the format.


    MP4, Ogg, and WebM are all together supported only by Google Chrome, Mozilla Firefox
    and Opera at the moment. Make sure to use these browsers, to ensure that the video
    you are embedding is able to be viewed on the web page.


    Let us now take a look at integrating audio on to your webpage.


    ## Adding Audio


    As with videos, prior to HTML5, audio could not be integrated into a website easily.
    The website designer had to use additional programs called plug-ins to let the
    audio play in the website. That is to say, there was no standard. HTML5 once again
    swept away these hardships and brought us a new, easy way for playing audio files
    in a web page : the <audio> tag.


    HTML supported different audio formats, but only with the help of the annoying
    plug-ins (which used to be the primary reason for the webpage crashing). HTML5
    however, is picky with audio as well as video, and allows only 3 formats. These
    are the ogg, mp3, and wav formats.'
