- fmt: "\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Example for Meta Tags</title>\n\
    \  <meta name=\"keywords\" content=\"Ducati, Aprilia, BMW\" />\n  <meta name=\"\
    description\" content=\"Learning about Meta Tags.\" />\n</head>\n<body>\n  <p>Hello\
    \ World!</p>\n</body>\n</html>\n```\n\n## Document Revision Date\n\nThe `<meta>`\
    \ tag can be used for providing information regarding the last updation of the\
    \ document. Various web browsers use this information while refreshing your web\
    \ page. Here is an example.\n\n### Example\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>Meta Tags Example</title>\n  <meta name=\"keywords\" content=\"\
    Ducati, Aprilia, BMW\" />\n  <meta name=\"description\" content=\"Learning about\
    \ Meta Tags.\" />\n  <meta name=\"revised\" content=\"Topgear, 7/7/15\" />\n</head>\n\
    <body>\n  <p>Hello HTML5!</p>\n</body>\n</html>\n```\n\n## Document Refreshing\n\
    \nYou can use the `<meta>` tag for specifying the duration on when to auto refresh\
    \ your page. Here is an example.\n\n### Example\n\nIf you wish to make your web\
    \ page refreshed automatically for every 10 seconds, use the below syntax.\n\n\
    ### Syntax:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Meta Tags Example</title>\n\
    \  <meta name=\"keywords\" content=\"Ducati, Aprilia, BMW\" />\n  <meta name=\"\
    description\" content=\"Learning about Meta Tags.\" />\n  <meta name=\"revised\"\
    \ content=\"Topgear, 7/7/15\" />\n  <meta http-equiv=\"refresh\" content=\"10\"\
    \ />\n</head>\n<body>\n  <p>Hello HTML5!</p>\n</body>\n</html>\n```\n\n## Page\
    \ Redirection\n\nUsing `<meta>` tag, you can redirect your web page to other web\
    \ pages. You can actually specify the duration when you want to redirect the page\
    \ by specifying the number of seconds. Here is an example.\n\n### Example\n\n\
    In the following example, the current page will be redirected to another page\
    \ after 10 seconds. If you leave the content attribute unspecified, the current\
    \ web page will be redirected immediately.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>Meta Tags Example</title>\n  <meta name=\"keywords\" content=\"\
    Ducati, Aprilia, BMW\" />\n  <meta name=\"description\" content=\"Learning about\
    \ Meta Tags.\" />\n  <meta name=\"revised\" content=\"Topgear, 7/7/15\" />\n \
    \ <meta http-equiv=\"refresh\" content=\"5; url=http://www.topgear.com\" />\n\
    </head>\n<body>\n  <p>Hello HTML5!</p>\n</body>\n</html>\n```\n\n## Setting Cookies\n\
    \nCookies are nothing but a data that is stored on your computer in the form of\
    \ small text files. Cookies are exchanged between the web server and the web browser\
    \ for keeping track on the information that the web application needs.\n\nUsing\
    \ `<meta>` tag, the cookies can be stored on the client side and of this information\
    \ can be later used by the web server for tracking the visitor of its site.\n\n\
    ### Example\n\nIn the following example, the current page will be redirected to\
    \ another page after 10 seconds. If you leave the content attribute unspecified,\
    \ the current web page will be redirected immediately.\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <title>Meta Tags Example</title>\n  <meta name=\"keywords\"\
    \ content=\"Ducati, Aprilia, BMW\" />\n  <meta name=\"description\" content=\"\
    Learning about Meta Tags.\" />\n  <meta name=\"revised\" content=\"Topgear, 7/Jul/15\"\
    \ />\n  <meta http-equiv=\"cookie\" content=\"userid=xyz; expires=Wednesday, 08-Aug-15\
    \ 23:59:59 GMT;\" />\n</head>\n<body>\n  <p>Hello HTML5!</p>\n</body>\n</html>\n\
    ```\n\nIf the expiration date and time are not included, the cookie will then\
    \ be considered as a session cooking. Session cookies will be deleted when the\
    \ browser is closed.\n\n## Setting Author Name\n\nYou can set an author name in\
    \ a web page using meta tag. See an example below:\n\n### Example\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <title>Meta Tags Example</title>\n  <meta name=\"\
    keywords\" content=\"Ducati, Aprilia, BMW\" />\n  <meta name=\"description\" content=\"\
    Learning about Meta Tags.\" />\n  <meta name=\"author\" content=\"Mahnaz Mohtashim\"\
    \ />\n</head>\n<body>\n  <p>Hello HTML5!</p>\n</body>\n</html>\n```\n\n## Specify\
    \ Character Set\n\nYou can use `<meta>` tag to specify character set used within\
    \ the webpage.\n\n### Example\n\nBy default, Web servers and Web browsers use\
    \ ISO-8859-1 (Latin1) encoding to process Web pages. Following is an example to\
    \ set UTF-8 encoding:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Meta\
    \ Tags Example</title>\n  <meta name=\"keywords\" content=\"Ducati, Aprilia,BMW\"\
    \ />\n  <meta name=\"description\" content=\"Learning about Meta Tags.\" />\n\
    \  <meta name=\"author\" content=\"Mahnaz Mohtashim\" />\n  <meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=UTF-8\" />\n</head>\n<body>\n  <p>Hello\
    \ HTML5!</p>\n</body>\n</html>\n```\n\nTo serve the static page with traditional\
    \ Chinese characters, the webpage must contain a `<meta>` tag to set Big5 encoding:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Meta Tags Example</title>\n\
    \  <meta name=\"keywords\" content=\"Ducati, Aprilia, BMW\" />\n  <meta name=\"\
    description\" content=\"Learning about Meta Tags.\" />\n  <meta name=\"author\"\
    \ content=\"Mahnaz Mohtashim\" />\n  <meta http-equiv=\"Content-Type\" content=\"\
    text/html; charset=Big5\" />\n</head>\n<body>\n  <p>Hello HTML5!</p>\n</body>\n\
    </html>\n```\n\n# Chapter 6: Comments\n\nComments are nothing but pieces of code\
    \ that are ignored by web browser. Adding comments to the HTML code is a very\
    \ good practice, especially for complex documents. Comments indicate different\
    \ sections of a document. They can also be used for indicating other notes to\
    \ other persons looking at the code. By increasing the code readability, comments\
    \ help users to understand code easily.\n\nFor adding a comment in HTML, you need\
    \ to place the content in between the tags `<!-- ... -->`. Any content that is\
    \ placed inside these tags will be considered as comments and the browser will\
    \ completely ignore them. Here is an example\n\n### Example\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>  <!-- Document Header Starts -->\n  <title>This is document\
    \ title</title>\n</head> <!-- Document Header Ends -->\n<body>\n  <p>The content\
    \ of the document goes here.....</p>\n</body>\n</html>\n```\n\n## Valid vs. Invalid\
    \ Comments\n\nComments cannot be nested; this means that you cannot place a comment\
    \ inside another. You should always ensure that `--` (double dash) may not appear\
    \ within a comment except in the closing tag `-->`. Here is an example.\n\n###\
    \ Example\n\nIn this example, we will give a valid comment and it will be ignored\
    \ by the browser.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Example\
    \ for Comment</title>\n</head>\n<body>\n  <!-- This comment is valid -->\n  <p>The\
    \ content of the document goes here.....</p>\n</body>\n</html>\n```\n\nThe above\
    \ code will produce the output:\n\nThe content of the document goes here.....\n\
    \nThe following example will have an invalid comment. Browsers do not hide invalid\
    \ comments and they display them as content. We will add an extra space in the\
    \ opening `<` and `!`.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Example\
    \ for Invalid Comment</title>\n</head>\n<body>\n  < !-- This comment is not valid\
    \ one -->\n  <p>The content of the document goes here.....</p>\n</body>\n</html>\n\
    ```\n\nThe above code will produce the following output:\n\n< !-- This comment\
    \ is not valid one -->\n\nThe content of the document goes here.....\n\n## Multiline\
    \ Comments\n\nSo far, we have only discussed about single line comments. However,\
    \ HTML also supports the multi-line comments.\n\nYou can increase the code readability\
    \ by adding comments in multiple lines by using a special beginning and ending\
    \ tags `<!--` and `-->` that are placed in front of the first line and after the\
    \ last line as given in the example shown below.\n\n### Example\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <title>Multiline Comments</title>\n</head>\n<body>\n\
    <!-- This is an example of multiline comment and\n\nit can be extended to any\
    \ number of\n\nlines you like. -->\n  <p>The content of the document goes here.....</p>\n\
    </body>\n</html>\n```\n\nThe above code will produce the following output:\n\n\
    The content of the document goes here.....\n\n## Conditional Comments\n"
