    # Chapter 10: HTML Colors


    Colors play a very important role in beautifying your web page, making it good
    to look and feel it. On the page level, you can specify the colors by using the
    <body> tag. You can also use the `bgcolor` attribute for setting the colors what
    different tags.


    The following attributes are available with the <body> tag, with which different
    colors can be set.


    - `vlink` - This will set the color for the links that are visited (links clicked
    once or more)

    - `link` - The color of the linked text can be set using this.

    - `alink` - The color for the selected links or active links can be set using
    this.

    - `text` - The body text color can be set with this.

    - `bgcolor` - The color of the background can be set with this.


    ## HTML Color Coding Methods


    There are three different methods in HTML for setting setting colors for the web
    page. They are as follows:


    - Color names - you can directly specify the names of the colors like red, blue
    or green.

    - Hex codes - You can specify the color using a six digit hex code. Every color
    can be represented by the red, blue and green colors present in them. The hex
    code is nothing but a representation of this.

    - Color decimal or percentage values - This value will be specified by using the
    `rgb()` property.


    Now we will have a look at these coloring schemes in detail.


    ## HTML Colors - Color Names


    You can directly specify the name of the color for setting it as the background
    or text color. There are a total of 16 basic colors listed by W3C, that validate
    with the HTML validator. Most of the major browsers support more than 200 different
    colors.


    W3C Standard 16 Colors


    The list of 16 standard colors, recommended by W3C is given below.


    ![](Images/image00125.jpeg)


    Example


    Here is an example where we said to the background color using the color name.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>HTML Colors by Name</title>

    </head>

    <body text="blue" bgcolor="green">

    <p>Use different color names for for body and table and see the result.</p>

    <table bgcolor="black">

    <tr>

    <td>

    <font color="white">This text will appear white on black background.</font>

    </td>

    </tr>

    </table>

    </body>

    </html>

    ```


    ## HTML Colors - Hex Codes


    The hex code is nothing but the six digit the presentation for a color. The first
    two digits of the hex code represent the value of red, the next two digits represented
    the value of green and the last two digits represented the value of blue. The
    hex code will be RRGGBB.


    You can take the hexadecimal value from graphics software like MS paint, Paintshop
    Pro or Adobe Photoshop.


    A hash sign # or pound will precede the hexadecimal code. Given below is a table
    with the colors using hex code.


    ![](Images/image00126.jpeg)


    Example


    Here are the examples to set background of an HTML tag by color code in hexadecimal:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>HTML Colors by Hex</title>

    </head>

    <body text="#0000FF" bgcolor="#00FF00">

    <p>Use different color hex for for body and table and see the result.</p>

    <table bgcolor="#000000">

    <tr>

    <td>

    <font color="#FFFFFF">This text will appear white on black background.</font>

    </td>

    </tr>

    </table>

    </body>

    </html>

    ```


    ## HTML Colors - RGB Values


    The color value can be specified with the `rgb()` property. This takes 3 values
    as the input for the colors red, green and blue, respectively. The range of each
    color varies from integer values 0 to 255 or as a percentage.


    The list of the RGB values for few colors is given below.


    ![](Images/image00127.jpeg)


    Example


    Here are the examples to set background of an HTML tag by color code using `rgb()`
    values:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>HTML Colors by RGB code</title>

    </head>

    <body text="rgb(0,0,255)" bgcolor="rgb(0,255,0)">

    <p>Use different color code for for body and table and see the result.</p>

    <table bgcolor="rgb(0,0,0)">

    <tr>

    <td>

    <font color="rgb(255,255,255)">This text will appear white on black background.</font>

    </td>

    </tr>

    </table>

    </body>

    </html>

    ```


    Note: Not all browsers support the `rgb()` color property. You should be careful
    on its usage for this reason.


    ## Browser Safe Colors


    There are a total of 216 colors that are supposed to be browser safe. They are
    computer independent colors. These colors range from the 000000 to FFFFFF in hex
    code. All computers having the 256 color palette support these.


    ![](Images/image00128.jpeg)


    # Chapter 11: HTML Multimedia


    With multimedia being the rage these days in the Internet, there are no designers
    in the world today who do not want to add multimedia to their websites. Adding
    multimedia ensures that your website looks stunning, and if your website requires
    a steady flow of traffic, then adding such media becomes a necessity.


    When the first browsers were launched, they supported only text. Can you imagine
    a webpage displaying nothing but text? No pictures, no videos, no sounds, no gifs.
    The worst part was that only one font and one color existed! Sounds dull and boring,
    doesn’t it? Which is exactly what must have been going through the minds of the
    browser developers at that time, because the browsers which came up after that
    started supporting media!


    Adding multimedia is very easy and fun to do, but it lies up to you to figure
    out if the browser - which your users will be using - will support the media or
    not. Most browsers support the popular formats discussed in this chapter, but
    sometimes, it will not work. In these not-so-rare cases, you might need to install
    an additional programs (called a plug-in) to let the media work in the web browser.
    Fortunately, with HTML5, all these problems will disappear, and a promising future
    for multimedia lies ahead.


    Since adding images has already been discussed previously, this chapter will focus
    specifically on integrating videos and sounds into your webpage. While you do
    this, it is your responsibility to make the perusal of your webpage by your users
    as easy as possible. What this means is that you have to be able to decide if
    you want some images and sounds to play automatically as soon as a page pops up.
    If your website targets users who are well off, they most likely will be having
    a fast internet connection, which means loading these images and sounds will not
    waste their time. Imagine a person with really slow connection. If you start adding
    sounds and images to your webpages to be loaded as soon as the page is opened,
    the user will never be able to use your site properly because of the slow connection.
    It’s a tradeoff, between making your webpage really attractive and catchy, and
    maintaining your user-base. This is a serious issue when your website is one that
    earns money from the traffic it gets. Maintaining your user-base is more important
    than adding loads of media into your webpage, especially if your website doesn’t
    revolve around the topic of multimedia.


    With the unfortunately boring, but serious issue out of the way and your decision
    in the tradeoff having been made, let us take a look at some popular video and
    sound formats that are most commonly used these days, along with some example
    codes on how to add them into your website.


    ## MPEG


    Developed by Moving Pictures Experts Group, the MPEG format became the rage on
    the internet as soon as it came into existence. The most popular format up to
    date, it’s supported by every browser out there. That’s right, every single one
    of them! Unfortunately, being very picky, HTML5 allows only a few video formats,
    namely the MP4, WebM and Ogg. As such, this format will not be discussed here.

