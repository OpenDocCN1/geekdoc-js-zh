    ## Acronym Element


    You can indicate your text as an acronym in HTML by using the<acronym> element.
    You should place your text in between the opening tag <acronym> and closing tag
    </acronym> for indicating it as an acronym. Here is an example.


    Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Acronym Example</title>

    </head>

    <body>

    <p>This chapter covers marking up text in <acronym>XHTML</acronym>.</p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    This chapter covers marking up text in XHTML.


    ## Text Direction


    The element <bdo>...</bdo> stands for Bi-Directional Override. You can override
    the text direction using this element. Here is an example.


    Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Text Direction</title>

    </head>

    <body>

    <p>This text goes from left to right.</p>

    <p><bdo dir="rtl">This text goes from right to left.</bdo></p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    This text goes from left to right.


    This text goes from right to left.


    ## Special Terms


    You can introduce special terms on your web page on for doing it; you can use
    the element <dfn>...</dfn>. This is very much similar to italicized text in the
    middle of a paragraph.


    You would typically use the element <dfn> when you introduce a key term for the
    first time. The recent browsers will render the text of the <dfn> element in and
    italicized format. Here is an example.


    Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Special Terms Example</title>

    </head>

    <body>

    <p>The following word is a <dfn>special</dfn> term.</p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    The following word is a special term.


    ## Quoting Text


    In HTML, you can quote a passage from a different source. For doing it, you should
    place the content in between the opening tag <blockquote> and closing tag </blockquote>.


    Any text placed inside this element will usually be intended from left and right
    edges of the text surrounding it. Sometimes it uses italicized font. Here is an
    example.


    Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Blockquote Example</title>

    </head>

    <body>

    <p>The following description of XHTML is taken from the W3C Web site:</p>

    <blockquote>XHTML 1.0 is the W3C''s first Recommendation for XHTML, following
    on from earlier work on HTML 4.01, HTML 4.0, HTML 3.2 and HTML 2.0.</blockquote>

    </body>

    </html>

    ```


    The above code will produce the following output:


    The following description of XHTML is taken from the W3C Web site:


    XHTML 1.0 is the W3C''s first Recommendation for XHTML, following on from earlier
    work on HTML 4.01, HTML 4.0, HTML 3.2 and HTML 2.0.


    ## Short Quotations


    You can add double quotes inside a sentence by using the <q>...</q> element. Here
    is an example.


    Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Double Quote</title>

    </head>

    <body>

    <p>Paul is in Spain, <q>I think I am right</q>.</p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    Paul is in Spain, I think I am right.


    ## Text Citations


    When you are quoting some text, by placing the source between the opening and
    closing tags <cite>  </cite>, you can indicate the source. Here is an example.


    Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Citations</title>

    </head>

    <body>

    <p>This HTML tutorial is derived from <cite>W3 Standard for HTML</cite>.</p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    This HTML tutorial is derived from W3 Standard for HTML.


    ## Computer Code


    If you are adding any programming code to your web page, you should place it inside
    the opening tag <code> and closing tag </code>. The content placed inside this
    element will usually be presented in the monospaced font, like any other called
    in other programming books. Here is an example.


    Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example Computer Code</title>

    </head>

    <body>

    <p>This is regular text. <code>This is code.</code> This is regular text.</p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    This is regular text.This is code. This is regular text.


    ## Keyboard Text


    In some situations, you will need your reader to type text using his keyboard.
    In such situations you can make use of the element <kbd>...</kbd>. This element
    will indicate a text that is to be typed. Here is an example.


    Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Keyboard Text</title>

    </head>

    <body>

    <p>Regular text. <kbd>This is inside kbd element</kbd> Regular text.</p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    Regular text. This is inside kbd element Regular text.


    ## Programming Variables


    Usually, this element will be used along with the elements <code> and <pre> for
    indicating that the content placed inside this element is variable. Here is an
    example.


    Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example Variable Text</title>

    </head>

    <body>

    <p><code>document.write("<var>user-id</var>")</code></p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    ```

    document.write("user-id")

    ```


    ## Program Output


    The sample output of a program can be indicated using the element <samp>...</samp>.
    Script can also be indicated using this. However, it is usually used for documenting
    coding concepts or programming. Here is an example.


    Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example Program Output</title>

    </head>

    <body>

    <p>The result of the program is <samp>Hello World!</samp></p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    The result of the program is Hello World!


    ## Address Text


    You can give the address using the <address>...</address> element. Here is an
    example.


    Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Address</title>

    </head>

    <body>

    <address>1719 c, David Drive, Marietta, Atlanta, Georgia </address>

    </body>

    </html>

    ```


    The above code will produce the following output:


    1719 c, David Drive, Marietta, Atlanta, Georgia


    # Chapter 5: Meta Tags


    In HTML, you are allowed to specifying metadata, which is the additional important
    information regarding the document, in different ways. You can use the META elements
    for including name/value pairs for describing the properties of the document,
    such as document author, author, expiry date, the list of keywords, etc.,


    Such additional information can be provided using the <meta> tag. There are no
    closing tags for the Meta tag and hence it is an empty element. Though it is an
    empty element, but the information can be passed through its attributes.


    In general, you can add more than one meta tags to your document, basing on the
    information that you are adding to your document. The physical appearance of your
    document will not have any effect because of meta tags. From the application point
    of view, it doesn''t matter if meta tags are included or not.


    ## Adding Meta Tags to Your Documents


    You can provide a Meta data to your pages by adding <meta> tags within The document’s
    header, represented by the tags <head> and </head>. In addition to their core
    attributes, they can have the following attributes:


    ![](Images/image00124.jpeg)


    ## Specifying Keywords


    Important keywords that are related to the document can be specified using <meta>
    tag. These keywords will be later used by various search engines. They will also
    be used for indexing your page for search. Here is an example.


    Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Meta Tags Example</title>

    <meta name="keywords" content="Ducati, Aprilia, BMW" />

    </head>

    <body>

    <p>Hello World!</p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    Hello World!


    ## Document Description


    You can provide a short description of your document by using <meta> tags. Similar
    to keywords, the subscription will also be used by search engines while indexing
    the web page for searching purposes. Here is an example.


