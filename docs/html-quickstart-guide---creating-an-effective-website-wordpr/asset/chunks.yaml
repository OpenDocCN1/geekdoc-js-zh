  trans: "\n\n条件注释仅在 Internet Explorer 浏览器中有效，其他浏览器会忽略条件注释。条件注释从 Internet Explorer\
    \ 5 开始支持，可用于针对不同版本的 Internet Explorer 提供条件指令。以下是一个示例。\n\n### 示例\n\n```html\n<!DOCTYPE\
    \ html><html>\n<head>\n  <title>条件注释示例</title>\n<!--[if IE 6]>\n  此处为针对 IE 6 的特殊指令\n\
    <![endif]-->\n</head>\n<body>\n<p>文档内容在此处……</p>\n</body>\n</html>\n```\n\n当需要根据\
    \ IE 版本使用不同样式表时，条件注释会很有帮助。\n\n## 使用注释标签\n\nHTML 代码的一部分可以设为注释，少数浏览器支持 `<comment>`\
    \ 标签。以下是一个示例。\n\n### 示例\n\n```html\n<!DOCTYPE html><html>\n<head>\n<title>使用注释标签</title>\n\
    </head>\n<body>\n<p>这是<comment>不是</comment> Internet Explorer。</p>\n</body>\n\
    </html>\n```\n\n如果你使用的是 IE，上述代码将产生以下输出：\n\n这是 Internet Explorer。\n\n如果你使用的是非 IE\
    \ 的其他浏览器，上述代码将产生以下输出：\n\n这不是 Internet Explorer。\n\n## 注释脚本代码\n\n当你在 HTML 代码中使用\
    \ VBScript 或 JavaScript 时，明智的做法是将脚本代码放在适当的注释中。这样可以确保它们能在旧版浏览器中使用。以下是一个示例。\n\n\
    ### 示例\n\n```html\n<!DOCTYPE html><html>\n<head>\n<title>注释脚本代码</title>\n<script>\n\
    <!--\n  document.write(\"哈库纳马塔塔！\")\n//-->\n</script>\n</head>\n<body>\n<p>哈库纳，马塔塔！</p>\n\
    </body>\n</html>\n```\n\n上述代码将产生以下输出：\n\n哈库纳马塔塔！\n\n哈库纳，马塔塔！\n\n## 注释样式表\n\n当你在\
    \ HTML 代码中使用样式表时，明智的做法是将样式表代码放在适当的注释中。这样可以确保它们能在旧版浏览器中使用。我们将在另一章中学习样式表。以下是一个示例。\n\
    \n### 示例\n\n```html\n<!DOCTYPE html><html>\n<head>\n<title>注释样式表</title>\n<style>\n\
    <!--\n.example {\n  border:1px solid #4a7d49;\n}\n//-->\n</style>\n</head>\n<body>\n\
    <div class=\"example\">早上好！</div>\n</body>\n</html>\n```\n\n上述代码将产生以下输出：\n\n早上好！\n\
    \n# 第 7 章：HTML 表单\n\n大多数网站至少有一个页面用于征求访客反馈，或要求他们提供电子邮件进行订阅。要实现这一点，你需要在页面中放置多个文本框，供用户输入信息。表单几乎无处不在，尽管它常常被忽视。当你登录邮箱、Facebook\
    \ 或任何需要用户名和密码的服务时，你就是在使用表单输入数据。在 HTML 中，这可以通过表单及其元素来实现。\n\n表单的基本思路是：访客使用文本框输入数据，数据被提交到后端应用程序（如\
    \ ASP 或 PHP 脚本）。该应用程序可以根据网页创建者的逻辑算法配置为执行任何操作。以下是一些常用元素和属性，你必须了解它们才能创建吸引访客的表单：\n\
    \n### Input\n\n这是最重要的元素，用于获取用户输入。它有多种输入属性，如文本、单选按钮和提交按钮。单选按钮用于从你提供的不同选项中进行选择，另外两种则相当直观。语法为\
    \ `<input>`。\n\n### TextArea\n\n当你希望用户输入超过一行的内容（例如描述其专业经验的段落）时，需要使用 `TextArea`\
    \ 元素。\n\n### Button\n\n该元素创建一个按钮，点击后执行某些操作。\n\n### Select\n\n虽然在用户必须输入详细信息的表单中并非必需，但了解此元素能让访客操作更便捷。`Select`\
    \ 元素创建一个下拉列表，访客可从中选择一个选项。\n\n### Legend\n\n如果你希望表单看起来有条理，这是一个重要的元素。`Legend` 为\
    \ `fieldset` 标签元素创建标题，该元素用于将表单中相关的字段分组。\n\n## HTML5 元素\n\n这些是 HTML5 特有的元素，不能在其他地方使用。\n\
    \n### Datalist\n\n当你希望用户开始输入时立即显示选项列表，可以使用 `Datalist`。这与 `Select` 元素不同，后者用户只能从列表中选择。`Datalist`\
    \ 元素在用户点击箭头标记时显示列表，并在用户开始输入时显示相关选项。\n\n### Keygen\n\n当你希望创建一种安全的方式来验证用户身份时，可以使用\
    \ `keygen` 元素。它会生成两个密钥：一个存储在本地（私钥），另一个发送到服务器（公钥）。\n\n### Form Action\n\n在进入示例之前，有一个属性你必须了解，即\
    \ `form action`。该属性决定按下提交按钮时数据应发送到哪个页面。所谓“处理”，是指你可以向用户显示详细信息，或将其发送到数据库。然而，使用 `form\
    \ action` 需要你具备 ASP 的基础知识。由于本书仅聚焦于 HTML，因此不会讨论 ASP 和 PHP。网上有许多教程详细解释了 PHP 和 ASP。\n\
    \n`form action` 的语法非常简单：\n\n```html\n<form action=\"page.php\" method=\"你希望使用的方法\"\
    >\n```\n\n### Get 和 Post\n\n这一点相当直观。`page.php` 指的是你要发送详细信息的页面。如果你之前没有定义页面，那么你只会收到“文件未找到”的消息。然而，如果你查看\
    \ URL 或浏览“文件未找到”消息中提供的信息，你会注意到用户输入的详细信息会显式地显示出来。这就引出了 `form action` 中使用的方法。\n\n\
    有两种表单动作：`GET` 和 `POST`。如果一开始没有选择任何选项，则默认使用 `GET` 选项。`GET` 的问题在于，用户输入的任何详细信息都会显示在\
    \ URL 中。虽然用户在家时这可能不是问题，但想象一下，当用户使用你的表单在公共场所或公用计算机上输入详细信息时，只需查看历史记录就能打开之前访问过的网站，以及\
    \ URL 中的密码和用户名。这是一个巨大的安全威胁，因此本指南倾向于使用 `POST` 方法。\n\n在 `POST` 方法中，执行相同的操作——即详细信息被发送到\
    \ PHP 或 ASP 脚本，或一个处理详细信息的页面——但 URL 中除了 `form action` 发送详细信息的页面外，不会显示任何内容。\n\n\
    如果你想使用 `POST` 方法，请使用以下语法：\n\n```html\n<form action=\"page.php\" method=\"POST\"\
    >\n```\n\n"
- fmt: "\nand that’s it! You’ve now successfully created a form which gives more priority\
    \ to security.\n\n### Name attribute\n\nAs you go through the examples given below,\
    \ you will notice in several of the codes the attribute `name`. This is different\
    \ from the `value` attribute, which changes the name of the displayed element\
    \ - that is, the text that the user sees. The name` attribute works in conjunction\
    \ with the form action, and it creates a variable with whatever text you have\
    \ given as the identification of the variable. For example, if you give `name=\"\
    user\"` right after some form input type, then that detail will get stored in\
    \ a variable called `user`, which will be sent to the page you have created using\
    \ the form action. In the page, you can process it by using the variable `user`\
    \ whenever you feel the need to use the corresponding detail for something.\n\n\
    Usually, when you want your users to submit a list of fields using just a single\
    \ submit button, it becomes necessary to add the `name` attribute. If you fail\
    \ to do so, the information will not get sent to the page, and if you include\
    \ the attribute for only a couple of fields, then only those corresponding fields’\
    \ details will be sent to the page for further processing.\n\n### Option tag\n\
    \nBefore we head on to the input types and the various elements you are going\
    \ to be using in a form to make it easy to use, you need to know about an important\
    \ tag called the `<option>` tag. When you want the user to be able to select from\
    \ a list of options, then this tag should be used. Let us take a look at the syntax\
    \ that is used for the option tag:\n\n```html\n<option value=\"game1\" Super Mario>\n\
    <option value=\"game2\" Runescape>\n```\n\nIf you execute this code, you will\
    \ notice that all you get on your screen are the names Super Mario and Runescape,\
    \ with no option to select them. The option tag only creates the options, it does\
    \ nothing in grouping them into a single field. That is where the select and datalist\
    \ element come in. The option tag works in conjunction with these tags, but more\
    \ on these two new tags later.\n\nFor now, it is enough if you understand these\
    \ basic tags and attributes, which will be used regularly in the following examples\
    \ for the different elements. Let us now head on to different input types and\
    \ an example code for each of them for your better understanding.\n\n### Input\n\
    \nThere are a number of input element types. You will be making use of more than\
    \ a few of them in every form that you create. Let us take a look at the basic\
    \ syntax that is used for such input types:\n\n```html\n<input type=\"relevant_type\"\
    \ name=\"relevant_name\" value=\"relevant_value\">\n```\n\n#### Text\n\nThis enables\
    \ a single line input field (note that this field accepts only text).\n\nExample\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<form action=\"\">\nUsername:<input\
    \ type=\"text\" name=\"username\">\n</form>\n</body>\n</html>\n```\n\nThis code\
    \ accepts text from the user when he gives his Username. The input from the user\
    \ gets stored in a variable called `username` in the page you’re sending the file\
    \ to. The form action has been left blank, and you can insert whichever page you\
    \ want the information to be sent to.\n\n#### Submit\n\nThis creates a button\
    \ called “Submit” which does exactly as it sounds. It sends the details that are\
    \ entered to form handler, a fancy name for the form action.\n\nExample\n\n```html\n\
    <form action=\"action.php\">\n  Username:<br>\n  <input type=\"text\" name=\"\
    userid\"><br>\n  Password:<br>\n  <input type=\"password\" name=\"pass\"><br>\n\
    \  <input type=\"submit\" value=\"Submit\">\n</form>\n```\n\nHere, another input\
    \ type called `Password` is used. When the `<input type=\"password\">` is given,\
    \ the text box accepts special characters as well, and the details would be sent\
    \ to the form handler as soon as the Submit button is pressed. By changing the\
    \ value of the submit button, you can change the text. For example, giving `value=\"\
    Click to confirm\"` will create a button that says “Click to confirm”, but performs\
    \ the action of the submit button.\n\n#### Radio\n\nThe radio input type gives\
    \ a list of choices the user can choose from, wherein he can select only one choice\
    \ at any given time.\n\nExample\n\n```html\n<form>\n  <input type=\"radio\" name=\"\
    occupation\" value=\"student\"> Student<br>\n  <input type=\"radio\" name=\"occupation\"\
    \ value=\"unemployed\"> Unemployed<br>\n  <input type=\"radio\" name=\"occupation\"\
    \ value=\"teacher\"> Teacher\n</form>\n```\n\nThis creates a list of options regarding\
    \ the user’s occupation. If you want a particular choice to be selected by default,\
    \ you can do that by adding a `checked` at the end of the input type.\n\nFor example,\
    \ replacing `<input type=\"radio\" name=\"occupation\" value=\"student\"> Student<br>`\
    \ - with `<input type=\"radio\" name=\"occupation\" value=\"student\" checked>\
    \ Student<br>` will select Student by default.\n\n#### Checkbox\n\nWhen you want\
    \ to let your user select multiple options from the choices you provide, use checkboxes.\
    \ The syntax is the same as the other input types.\n\nExample\n\n```html\n<form\
    \ action=\"action_page.php\">\n<input type=\"checkbox\" name=\"gadget1\" value=\"\
    Laptop\" >I have a laptop <br>\n<input type=\"checkbox\" name=\"gadget2\" value=\"\
    PC\">I have a PC<br>\n<input type=\"submit\">\n</form>\n```\n\nThis example creates\
    \ 2 checkboxes, which ask the user if he owns a laptop and a PC. Once again, if\
    \ you want certain options to be selected by default, add a `checked` at the end\
    \ of the input type like:\n\n```html\n<input type=\"checkbox\" name=\"gadget1\"\
    \ value=\"Laptop\" checked>I have a laptop <br>\n```\n\n#### Button\n\nYou can\
    \ make use of the button input type to define the action that clicking on a button\
    \ performs.\n\nExample\n\n```html\n<input type=\"button\" onclick=\"alert('HTML\
    \ tutorial!')\" value=\"Click Here Please!\">\n```\n\nThis small code generates\
    \ a button which says \"Click Here Please!\", which when clicked pops a message\
    \ up. As with the other input types, changing the value will change the message\
    \ inside the button.\n\n#### Number\n\nThis is an input type which will accept\
    \ only numbers from the user. You can select the range of the numbers, and your\
    \ user will be able to give an input which contains a number only exists within\
    \ the range. This is useful when you want to give an input field for something\
    \ like birthdates, or age. The field automatically comes with selection arrows,\
    \ which can be used or the user can manually type the input themselves.\n\nExample\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<form action=\"page.php\">\nBirthdate:\n\
    <input type=\"number\" name=\"quantity\" min=\"1\" max=\"31\">\n<input type=\"\
    submit\" value=\"Confirm\">\n</form>\n</body>\n</html>\n```\n\nThis example code\
    \ will create an input field for birthdate, with a maximum value of 31 and a minimum\
    \ value of 1. You can obviously change these numbers to your liking. The keywords\
    \ `min` and `max` stand for minimum and maximum respectively as you can probably\
    \ guess. However, if your browser is Internet Explorer 9 or earlier this input\
    \ type will not work.\n\n#### TextArea\n\nWhen your form requires your users to\
    \ enter personal details, you want to have an input field which can accept more\
    \ than one line of input. In such a case, using the input type text would not\
    \ work, and you need to use TextArea.\n\nExample\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<textarea rows=\"5\" cols=\"75\">\nYou can use this space to type\
    \ whatever you want. All of this will be displayed in the text field. If you decide\
    \ to not give information or text that appears by default, you can leave this\
    \ space blank, and the user will be able to enter his or her personal details\
    \ or the relevant detail you want.\n</textarea>\n</body>\n</html>\n```\n"
  raw: 'and that’s it! You’ve now successfully created a form which gives more priority
    to security.


    ### Name attribute


    As you go through the examples given below, you will notice in several of the
    codes the attribute ‘name’. This is different from the ‘value’ attribute, which
    changes the name of the displayed element - that is, the text that the user sees.
    The ‘name’ attribute works in conjunction with the form action, and it creates
    a variable with whatever text you have given as the identification of the variable.
    For example, if you give ‘name=“user”’ right after some form input type, then
    that detail will get stored in a variable called ‘user’, which will be sent to
    the page you have created using the form action. In the page, you can process
    it by using the variable ‘user’ whenever you feel the need to use the corresponding
    detail for something.


    Usually, when you want your users to submit a list of fields using just a single
    submit button, it becomes necessary to add the name attribute. If you fail to
    do so, the information will not get sent to the page, and if you include the attribute
    for only a couple of fields, then only those corresponding fields’ details will
    be sent to the page for further processing.


    ### Option tag


    Before we head on to the input types and the various elements you are going to
    be using in a form to make it easy to use, you need to know about an important
    tag called the <option> tag. When you want the user to be able to select from
    a list of options, then this tag should be used. Let us a take a look at the syntax
    that is used for the option tag:


    <option value=“game1” Super Mario>


    <option value=“game2” Runescape>


    If you execute this code, you will notice that all you get on your screen are
    the names Super Mario and Runescape, with no option to select them. The option
    tag only creates the options, it does nothing in grouping them into a single field.
    That is where the select and datalist element come in. The option tag works in
    conjunction with these tags, but more on these two new tags later.


    For now, it is enough if you understand these basic tags and attributes, which
    will be used regularly in the following examples for the different elements. Let
    us now head on to different input types and an example code for each of them for
    your better understanding.


    ### Input


    There are a number of input element types. You will be making use of more than
    a few of them in every form that you create. Let us take a look at the basic syntax
    that is used for such input types:


    <input type=“relevant_type” name=“relevant_name” value=“relevant_value”>


    #### Text


    This enables a single line input field (note that this field accepts only text).


    Example


    <!DOCTYPE html>


    <html>


    <body>


    <form action="">


    Username:<input type="text" name="username">


    </form>


    </body>


    </html>


    This code accepts text from the user when he gives his Username. The input from
    the user gets stored in a variable called username in the page you’re sending
    the file to. The form action has been left blank, and you can insert whichever
    page you want the information to be sent to.


    #### Submit


    This creates a button called “Submit” which does exactly as it sounds. It sends
    the details that are entered to form handler, a fancy name for the form action.


    Example


    <form action=“action.php">


      Username:<br>


      <input type="text" name="userid"><br>


      Password:<br>


      <input type="password" name="pass"><br>


      <input type="submit" value="Submit">


    </form>


    Here, another input type called Password is used. When the <input type=“password”>
    is given, the text box accepts special characters as well, and the details would
    be sent to the form handler as soon as the Submit button is pressed. By changing
    the value of the submit button, you can change the text. For example, giving ‘value=“Click
    to confirm”’ will create a button that says “Click to confirm”, but performs the
    action of the submit button.


    #### Radio


    The radio input type gives a list of choices the user can choose from, wherein
    he can select only one choice at any given time.


    Example


    <form>


      <input type="radio" name="occupation" value="student"> Student<br>


      <input type="radio" name="occupation" value="unemployed"> Unemployed<br>


      <input type="radio" name="occupation" value="teacher"> Teacher


    </form>


    This creates a list of options regarding the user’s occupation. If you want a
    particular choice to be selected by default, you can do that by adding a “checked”
    at the end of the input type.


    For example, replacing  “<input type="radio" name="occupation" value=“student">"
    Student<br> - with   “<input type="radio" name="occupation" value=“student" checked>
    Student<br>” will select Student by default.


    #### Checkbox


    When you want to let your user select multiple options from the choices you provide,
    use checkboxes. The syntax is the same as the other input types.


    Example


    <form action="action_page.php">


    <input type="checkbox" name="gadget1" value="Laptop" >I have a laptop <br>


    <input type="checkbox" name="gadget2" value=“PC”>I have a PC<br>


    <input type="submit">


    </form>


    This example creates 2 checkboxes, which ask the user if he owns a laptop and
    a PC. Once again, if you want certain options to be selected by default, add a
    “checked” at the end of the input type like this:


    <input type="checkbox" name="gadget1" value="Laptop" checked>I have a laptop <br>


    #### Button


    You can make use of the button input type to define the action that clicking on
    a button performs.


    Example


    <input type="button" onclick="alert(''HTML form tutorial!'')" value="Click Here
    Please!">


    This small code generates a button which says "Click Here Please!", which when
    clicked pops a message up saying "HTML form tutorial". As with the other input
    types, changing the value will change the message displayed inside the button.


    #### Number


    This is an input type which will accept only numbers from the user. You can select
    the range of the numbers, and your user will be able to give an input which contains
    a number that only exists within the range. This is useful when you want to give
    an input field for something like birthdates, or age. The field automatically
    comes with selection arrows, which can be used or the user can manually type the
    input themselves.


    Example


    <!DOCTYPE html>


    <html>


    <body>


    <form action="page.php">


    Birthdate:


    <input type="number" name="quantity" min="1" max="31">


    <input type="submit" value="Confirm">


    </form>


    </body>


    </html>


    This example code will create an input field for birthdate, with a maximum value
    of 31 and a minimum value of 1\. You can obviously change these numbers to your
    liking. The keywords ''min'' and ''max'' stand for minimum and maximum respectively
    as you can probably guess. However, if your browser is Internet Explorer 9 or
    earlier this input type will not work.


    #### TextArea


    When your form requires your users to enter personal details, you want to have
    an input field which can accept more than one line of input. In such a case, using
    the input type text would not work, and you need to use TextArea.


    Example


    <!DOCTYPE html>


    <html>


    <body>


    <textarea rows="5" cols="75">


    You can use this space to type whatever you want. All of this will be displayed
    in the text field. If you decide to not give information or text that appears
    by default, you can leave this space blank, and the user will be able to enter
    his or her personal details or the relevant detail you want.


    </textarea>


    </body>


    </html>'
