- fmt: "\nWith these three options at hand, a question might pop in your head, asking\
    \ which format should be used. All these formats pale in comparison to the size\
    \ of the average video file, and you should be able to use any of them. However,\
    \ audio files with the `mp3` extension traditionally are bigger in size than the\
    \ audio files with the `ogg` extension. With regards to quality, `mp3` is better\
    \ than `ogg`, but the difference in the quality is so tiny that you will not even\
    \ be able to recognize it. It is safe to say that it does not really matter either\
    \ way. With respect to `wav` however, both `ogg` and `mp3` formats are smaller\
    \ in size.\n\nUncompressed `wav` audio files are surprisingly large, but are supported\
    \ by most of the browsers. `gg` has the smallest size, but it is not universal\
    \ unfortunately. Several browsers do not accept `ogg` audio files. Therefore,\
    \ `mp3` audio files would be the best option to go for, as they are moderate in\
    \ size, and are supported by all browsers.\n\nLet us now take a look at an example\
    \ for better understanding of how certain audio files can be added to your webpage:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <audio controls>\n    <source src=\"\
    example.ogg\" type=\"example/ogg\">\n    <source src=\"example.mp3\" type=\"example/mpeg\"\
    >\n  </audio>\n</body>\n</html>\n```\n\n## Source\nThe `<source>` part of the\
    \ code does exactly the same thing as the `<source>` in the video section explained\
    \ above. It simply tells the browser which audio file to select. If multiple formats\
    \ are given, then the browser will decide to take the first format that it can\
    \ support. The others would be disregarded.\n\n## Controls\nThe `controls` attribute\
    \ gives the audio file on the webpage options like play, volume and pause, which\
    \ are essential in any audio file.\n\nWhen you are unsure of whether the browser\
    \ you are using supports a particular file, try executing the follow example code:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <audio controls>\n    <source src=\"\
    example.ogg\" type=\"example/ogg\">\n    <source src=\"example.mp3\" type=\"example/mpeg\"\
    >\n    Does not support, apparently.\n  </audio>\n</body>\n</html>\n```\n\nIf\
    \ you see the text that you have typed in above on the screen, then that means\
    \ the browser does not support the format you are using. Basically, all the text\
    \ within the `<audio>` and `</audio>` tags will not be displayed if the browser\
    \ supports the format. The displaying of the text is a clear indication that you\
    \ should either change the browser being used, or the format being used.\n\n##\
    \ Embedding YouTube videos\nHere is an interesting and easy way of embedding videos\
    \ that are online on your website. Of course, you have to give credits to the\
    \ original owners, but you can embed online videos. The next part of this chapter\
    \ will focus on how to embed YouTube videos (the most widely used video-sharing\
    \ website) on to your own website. In HTML5, you can embed videos easily, but\
    \ as stated before, embedding videos and audio in HTML is very difficult, unless\
    \ you just use YouTube.\n\nTo know more about embedding YouTube videos, let us\
    \ first take a look and try to understand the function of a very important element\
    \ in this context:\n\n### iframe\nThe `<iframe>` tag is used to specify an inline\
    \ frame (‘i’ in iframe stands for inline). What this means is that you can embed\
    \ another document within the document you are currently working on. This is a\
    \ really easy way to embed YouTube videos on to your webpage, and is recommended.\n\
    \nThe general syntax is:\n```html\n<iframe src=\"document_you_want_to_add\"></iframe>\n\
    ```\n\nAs with audio and video tags, if you want to see if your current browser\
    \ supports the `<iframe>` tag, just add some text within the `<iframe>` and `</</iframe>>`\
    \ tags. If it gets displayed on the screen, then the browser does not support\
    \ the tag. If there is no text, then that means the browser is giving you the\
    \ green signal to proceed.\n\nThe following steps will give you a clear idea on\
    \ adding videos from YouTube to your webpage:\n\n1. Note the video ID. When you\
    \ play a video on YouTube, a unique ID is generated, which you should make a note\
    \ of.\n2. Create the `<iframe>` tag in your webpage, and make sure to include\
    \ whatever height and width ratio you want in your player.\n3. Within the `<iframe>`\
    \ tag, let the `src` attribute point towards the URL of the YouTube video. This\
    \ is where the video ID you took note of earlier becomes useful. And that’s it!\
    \ It is really simple, isn’t it?\n\nAn example code is given below:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <iframe width=\"420\" height=\"345\" src=\"\
    http://www.youtube.com/embed/enter_your_video_ID_here\"></iframe>\n</body>\n</html>\n\
    ```\n\nIs that all you can do with YouTube videos? Definitely not! You can create\
    \ playlists, make use of autohide, autoplay, controls, and loop functions that\
    \ YouTube gives you permission for.\n\nTo make use of these parameters, you have\
    \ to add a certain symbol after the embedded URL. At this stage, you do not really\
    \ need to know what the symbol means, it is sufficient for you to just know that\
    \ you have to use it. This symbol is the question mark `?`, which should be added\
    \ at the end of the URL, followed by the parameter you want to make use of. If\
    \ you want to add several parameters to the same link, then you have to make use\
    \ of the `&` symbol. Basically, just use the question mark for the first parameter,\
    \ and then use the ampersand symbol for the other parameters.\n\nLet us now take\
    \ a look at an easy way of adding these parameters:\n`http://www.youtube.com/embed/enter_your_video_ID_here?autoplay=1`\n\
    \nIf you notice, `autoplay` can have different values. `autoplay=1` stands for\
    \ enabling autoplay and `autoplay=0` stands for disabling autoplay. YouTube itself\
    \ has defined these parameters and given them these values. In a case where you\
    \ want multiple parameters to be added into a single URL, then the syntax would\
    \ go something like:\n`http://www.youtube.com/embed/enter_your_video_ID_here?autoplay=1&controls=0`\n\
    \nHere, the controls like play, pause and seeking will not be displayed. That\
    \ is what the value 0 does to the `controls` parameter. Now that you know about\
    \ these parameters, your interest has probably piqued. Given below are some of\
    \ the YouTube parameters, along with their values:\n\n### Autohide\nIt decides\
    \ if the player controls should be displayed or not.\n- Value `0`: makes the `autohide`\
    \ parameter display the player control always.\n- Value `1`: hides the player\
    \ controls as soon as the video has started playing.\n- Value `2`: lets the browser\
    \ choose between `0` and `1`, depending on the player size. If the player is in\
    \ `16:9` or `4:3` ratio, then option `1` will be selected, otherwise, option `0`\
    \ is selected.\n\n### Autoplay\nJust as the name says, it decides whether the\
    \ video should play as soon as the player loads or not.\n- Value `0`: The video\
    \ will not play as soon as the player loads. The user has to click to play the\
    \ video.\n- Value `1`: The video will play as soon as the player loads, automatically.\n\
    \n### Loop\nThe `loop` parameter is used to decide if the video should loop and\
    \ play repeatedly or not.\n- Value `0`: By default, this is selected, and the\
    \ video gets played only once.\n- Value `1`: The video keeps playing and looping\
    \ forever.\n\n### Playlists\nYou can also create a playlist of YouTube videos.\
    \ You do not need to create separate src codes, you can create a playlist using\
    \ just a single source URL.\n"
