    was not mentioned at the time : <form>. Yes, the form tag is a semantic element!
    When you see the tag <form>, you automatically realize it has something to do
    with forms, and you can start adding attributes accordingly.


    Given below is a list of some of the semantic elements that HTML5 offers:


    <details>


    <article>


    <section>


    <summary>


    <time>


    <aside>


    <mark>


    We shall now proceed to look at some examples to understand how these tags work.


    ## Article


    The article tag lets you create an article. You can, of course, create an article
    that has some relation to the web page, but the general idea of an article is
    that each article should be different. Therefore, the <article> tag is used when
    you want to mention something that goes out of context, or is not related to the
    main topic of the website in the slightest.


    Here is an example code which you can try out:


    <!DOCTYPE html>


    <html>


    <body>


    <article>


      <h2>This is the article’s heading</h1>


      <p>With the help of the article tag, you can create articles that provide content
    not related to the webpage.</p>


    </article>


    </body>


    </html>


    The above code will execute the text given, with the heading in the <h2> size.


    ## Section


    Sections are groups of content that are based on a single idea or theme. This
    is how they differ from articles, where the theme can be anything. Sections have
    to stick to one theme for the word to make sense. Here is an example of how 2
    sections can be put together in HTML:


    <!DOCTYPE html>


    <html>


    <body>


    <section>


      <h1>Section 1</h1>


      <p>This is section 1’s content. This section states that HTML coding is easy
    to learn, and easy to forget, so stay in practice if you want to become a professional!</p>


    </section>


    <section>


      <h1>Section 2</h1>


      <p>This is section 2\. This section would like to say that this book covers
    almost all the concepts, and you can always come back and refer to it when you
    get doubts regarding the basics.</p>


    </section>


    </body>


    </html>


    As you can see, the two sections have got the same theme - HTML, but are very
    different in what they are trying to say.


    ## Aside


    Oftentimes you may have seen the main content being displayed in the centre or
    towards the left, with some minor related content being displayed in the sidebar.
    This is done with the help of the <aside> tag. This tag is used to display small
    sections of information that is related to the main topic, and can be placed at
    the sides.


    <!DOCTYPE html>


    <html>


    <body>


    <p>This is the main topic, about HTML.</p>


    <aside>


      <h4>HTML</h4>


      <p>HTML is Hyper Text Markup Language</p>


    </aside>


    </body>


    </html>


    ## Details and Summary


    This is the small arrow mark you might have seen, which when clicked, expands
    a small text box and displays additional information. Details is therefore, a
    way of adding information which the user can choose to see. The summary tag lets
    you add the title for the details tag. The best way to understand this is with
    an example:


    <!DOCTYPE html>


    <html>


    <body>


    <details>


      <summary>Click here for more info</summary>


      <p>This is the extra information.</p>


    </details>


    </body>


    </html>


    When you try this code, you will notice that the text in the summary gets displayed
    as the title, with the other text going into the expandable text box. This is
    how the details and summary works.


    ## Figure and Figcaption


    This is as easy as it gets. You can add an image, and attach a caption to it with
    the help of the figure and fig caption tags.


    <!DOCTYPE html>


    <html>


    <body>


    <p>This is your description. Instead of giving a caption for the image you are
    uploading as a description, it might be a better idea to use the <figcaption>
    tag as shown below.</p>


    <figure>


      <img src=“image.jpeg" alt=“Enter Image" width="300" height="220">


      <figcaption>Image1: This is your caption.</figcaption>


    </figure>


    </body>


    </html>


    # Conclusion


    Creating a webpage is something that has been wreathed in mysticism and cyber
    mumbo jumbo for years, but I hope that I’ve shown you that it’s not as scary as
    you might think. In fact, HTML is actually fairly straight forward. IF you’re
    looking for a hobby that can really accomplish something and is easy to explain,
    then you’ve come to the right place. These are the foundations upon which you
    can build your webpage and push on to greater things like CSS, Java, JavaScript,
    C++, and the list goes on and on. Remember, that you can never really get in over
    your head if you master and truly understand what it is that you’re working on
    in the moment.


    If something doesn’t make sense to you or is confusing, my best suggestion to
    you is to open up your TextEdit or Notepad and start working on it. Pull it up
    in your browser and have a look at what it does for your page. Taking everything
    step by step will inevitably lead you to the path of success. There is never a
    reason to jump ahead without fully understanding what it is that you’ve done.


    If you ever find yourself having a need to get back to the basics or you just
    don’t remember how to do something simple, come back to this book and have a look
    at the fundamentals. With everything that I have presented to you in this book,
    you should be able to get the grasp on the beginnings of a webpage and if you
    can get the beginning, it’s just a matter of taking the next step piece by piece.
    So good luck and get out there and make an amazing webpage.


