    <head>\n<title>HTML Ordered List</title>\n</head>\n<body>\n  <ol type=\"A\">\n\
    \    <li>Apple</li>\n    <li>Mango</li>\n    <li>Banana</li>\n    <li>Pear</li>\n\
    \  </ol>\n</body>\n</html>\n```\nThe above code will produce the following output:\n\
    \nApple\nMango\nBanana\nPear\n\n### Example\nWe will use `<ol type=\"a\">` for\
