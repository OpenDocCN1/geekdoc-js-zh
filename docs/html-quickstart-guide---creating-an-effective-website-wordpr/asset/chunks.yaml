    \ output.\n\n```\nint main(void) {\n  printf(\"Hello World!\\n\");\n  // return\
    \ 0;\n\n}\n```\n\n## Nonbreaking Spaces\n\nIn some cases you do not want your\
    \ browser to split the words across lines. In such cases you can use the nonbreaking\
    \ space entity `&nbsp;` instead of using the normal space. Have a look at the\
    \ following example for a better understanding.\n\nExample\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>Example forNonbreaking Spaces</title>\n</head>\n\
    <body>\n<p>\nThe agent in the movie is \"James&nbsp;Bond&nbsp;007.\"</p>\n</body>\n\
    </html>\n```\n\n# Chapter 2: HTML Elements\n\nAn element in his family will be\
    \ defined by starting tag. If other content can be contained within the element,\
    \ it will have a closing tag. For the closing tag, the name of the element will\
    \ be preceded with a `/`. Some of such elements are given below.\n\n![](Images/image00121.jpeg)\n\
    \nHere, `<i>` and `</i>` is an element, `<marquee>` and `</marquee>` is another\
    \ element. There are a few HTML elements that doesn't need closing tags, such\
    \ as `<br />`, `<hr />`, `<img />`, etc. The HTML elements which doesn't require\
    \ closing tags are called as void elements.\n\nThe HTML document has a tree for\
    \ these elements and this tree specifies on how the documents of HTML should be\
    \ built. It also specifies the type of content that is to be placed in what part\
    \ of the document.\n\n## HTML Tag vs. Element\n\nAn element of HTML will be defined\
    \ using a starting tag. If other content is placed inside it, it will have a closing\
    \ tag.\n\nFor instance, `<i>` is the starting tag for italic text and `</i>` is\
    \ the closing tag for it. But, `<i>This text is italic</i>` is a italic text element.\n\
    \n## Nested Elements in HTML\n\nHTML allows you to nest HTML elements within other\
    \ HTML elements. Here is an example:\n\nExample\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>Example for Nested Elements</title>\n</head>\n<body>\n\
    <h2>This is <b>bold</b> heading</h2>\n<p>This is <i>italic</i> text</p>\n</body>\n\
    </html>\n```\n\nThe above code will produce the following output\n\nThis is bold\
    \ heading\n\nThis is italic text\n\n## Attributes\n\nTill now, we have seen some\
    \ of the tags like paragraph tag `<p>`, heading tags `<h1>`, `<h2>` and a few\
    \ other tags in the most simple form. These bags can be given some extra information\
    \ known as attributes.\n\nThe characteristics of an element in HTML can be defined\
    \ using an attribute. This will be placed inside the opening tag of the element\
    \ and they contain two parts, name and value.\n\nThe name of the attribute is\
    \ nothing but the property that you wish to set. For example, the font element\
    \ carries attributes like color, size, type, etc., which are used for indicating\
    \ the font color, font size and font type that is to be displayed on the page.\n\
    \nThe value of the attribute is nothing but the value for the property that you\
    \ wish to set. The value of an attribute should always be placed inside quotations.\
    \ The examples below will show you the values that can be given to the above given\
    \ name: Red, 3 and Georgia, as font color, size and type.\n\nYou should be careful\
    \ when using names and values for attributes, as they are case sensitive. However,\
    \ the W3C (World Wide Web Consortium), recommends the use of lowercase attributes\
    \ and attribute values in their recommendation for HTML 4.\n\nHere is an example.\n\
    \nExample\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Align Attribute\
    \  Example</title>\n</head>\n<body>\n<p align=\"right\">This content will be aligned\
    \ to the right</p>\n<p align=\"center\">This content will be aligned to the center</p>\n\
    <p align=\"left\">This content will be aligned to the left</p>\n</body>\n</html>\n\
    ```\n\nThe above code will give us the following output:\n\nThis content will\
    \ be aligned to the right.\n\nThis content will be aligned to the center.\n\n\
    This content will be aligned to the left.\n\n## Internationalization Attributes\n\
    \nIn HTML, there are a total of three internationalization attributes. These are\
    \ available for most of the XHTML elements, but not for all.\n\n- `dir`\n- `lang`\n\
    - `xml:lang`\n\n### The `dir` Attribute\n\nYou can specify the text flow direction\
    \ to the browser by using the `dir` attribute. This attribute can take two values,\
    \ as shown in the table given below.\n\n![](Images/image00122.jpeg)\n\nExample\n\
    \n```html\n<!DOCTYPE html>\n<html dir=\"rtl\">\n<head>\n<title>Display Directions</title>\n\
    </head>\n<body>\nThis is how IE 5 renders right-to-left directed text.\n</body>\n\
    </html>\n```\n\nThe above code will produce the following output:\n\nThis is how\
    \ IE 5 renders right-to-left directed text.\n\nIf the `dir` attribute is placed\
    \ inside the `<html>` tag, it will determine how the text of the entire document\
    \ will be presented. If this attitude is use the inside another tag, it will just\
    \ to control the direction of the text contained in that specific tag.\n\n###\
    \ The `lang` Attribute\n\nYou can indicate the main language that is to be used\
    \ in your document by using the `lang` attribute. The only reason for keeping\
    \ this attribute is HTML is for the backwards compatibility with previous versions\
    \ of HTML. In the new XHTML documents, this attribute is replaced with the `xml:lang`\
    \ attribute.\n\nThe `lang` attributes have the values as ISO 639 standard 2-character\
    \ language codes. You can check the complete list of language codes with the [HTML\
    \ Language Codes: ISO 639](http://www.tutorialspoint.com/html/language_iso_codes.htm).\n\
    \nExample\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<title>English\
    \ Language Page</title>\n</head>\n<body>\nThis page is using English Language\n\
    </body>\n</html>\n```\n\n### The `xml:lang` Attribute\n\nIn XHTML, the `xml:lang`\
    \ attribute is used as a replacement for the original `lang` attribute used in\
    \ earlier versions of HTML. As mentioned above, the `xml:lang` attribute value\
    \ should be an ISO-639 country code.\n\n## Generic Attributes\n\nThere are a few\
    \ other attributes that can be readily used with most of the HTML tags. The list\
    \ of those attributes is given in the table below.\n\n![](Images/image00123.jpeg)\n\
    \n# Chapter 3: Formatting in HTML\n\nIf you are familiar with using the word processor,\
    \ you probably must also be similar with making text bold, italicized or underlined.\
    \ There are a total of 10 options available in HTML and XHTML, which will indicate\
    \ your text will appear.\n\n## Bold Text\n\nAny content that is placed in between\
    \ `<b>...</b>` element will be displayed as bold text. Here is an example.\n\n\
    Example\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Example for Bold Text</title>\n\
    </head>\n<body>\n<p>The following word will be in a <b>bold</b> typeface.</p>\n\
    </body>\n</html>\n```\n\nThe above code will produce the following output:\n\n\
    The following word will be in a bold typeface.\n\n## Italic Text\n\nAny content\
    \ that is placed in between `<i>...</i>` element will be displayed as italicized\
    \ text. Here is an example.\n\nExample\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title>Example for Italic Text</title>\n</head>\n<body>\n<p>The following word\
    \ will be in a <i>italicized</i> typeface.</p>\n</body>\n</html>\n```\n\nThe above\
    \ code will produce the following output:\n\nThe following word will be in an\
    \ italicized typeface.\n"
  raw: 'The <hr /> tag is also categorized as an empty element. This doesn''t need
    opening tags and closing tags as there is no content going in between.


    There is a space in between the characters hr and / in the <hr /> element. If
    the space is omitted, older versions of browsers will have problem with the rendering
    the horizontal line and if the / is missed, it won''t be a valid element in XHTML.


    ## Preserve Formatting


    In some cases your text should follow the same format as it is entered in the
    HTML document. You can make use of the <pre> tag in such cases. It means preformatted
    text.


    Any text entered into between the tags <pre> and </pre> will have the same text
    format as seen in the source document. Here is an example.


    Example


    <!DOCTYPE html>     <html>     <head>     <title>Example for Preserve Formatting</title>     </head>     <body>     <pre>     int main(void) {      printf("Hello World!\n");      // return 0;


    }     </pre>     </body>     </html>


    The above code will produce the following output.


    int main(void) {      printf("Hello World!\n");      // return 0;


    }  

    ## Nonbreaking Spaces


    In some cases you do not want your browser to split the words across lines. In
    such cases you can use the nonbreaking space entity &nbsp; instead of using the
    normal space. Have a look at the following example for a better understanding.


    Example


    Let us use the words James Bond 007 for our example and we do not want the browser
    to split these words. We will add to the nonbreaking space entity &nbsp; instead
    of space.


    <!DOCTYPE html>     <html>     <head>     <title>Example forNonbreaking Spaces</title>     </head>     <body>     <p>


    The agent in the movie is "James&nbsp;Bond&nbsp;007."</p>     </body>     </html>


    # Chapter 2: HTML Elements


    An element in his family will be defined by starting tag. If other content can
    be contained within the element, it will have a closing tag. For the closing tag,
    the name of the element will be preceded with a /. Some of such elements are given
    below.


    ![](Images/image00121.jpeg)


    Here, <i> and </i> is an element, <marquee> and </marquee> is another element.
    There are a few HTML elements that doesn''t need closing tags, such as <br />,
    <hr />, <img />, etc. The HTML elements which doesn''t require closing tags are
    called as void elements.


    The HTML document has a tree for these elements and this tree specifies on how
    the documents of HTML should be built. It also specifies the type of content that
    is to be placed in what part of the document.


    ## HTML Tag vs. Element


    An element of HTML will be defined using a starting tag. If other content is placed
    inside it, it will have a closing tag.


    For instance, <i> is the starting tag for italic text and </i> is the closing
    tag for it. But, <i>This text is italic</i> is a italic text element.


    ## Nested Elements in HTML


    HTML allows you to nest HTML elements within other HTML elements. Here is an example:


    Example


    <!DOCTYPE html>     <html>     <head>     <title>Example for Nested Elements</title>     </head>     <body>     <h2>This is <b>bold</b> heading</h2>     <p>This is <i>italic</i> text</p>     </body>     </html>


    The above code will produce the following output


    This is bold heading


    This is italic text


    ## Attributes


    Till now, we have seen some of the tags like paragraph tag <p>, heading tags <h1>,
    <h2> and a few other tags in the most simple form. These bags can be given some
    extra information known as attributes.


    The characteristics of an element in HTML can be defined using an attribute. This
    will be placed inside the opening tag of the element and they contain two parts,
    name and value.


    The name of the attribute is nothing but the property that you wish to set. For
    example, the font element carries attributes like color, size, type, etc., which
    are used for indicating the font color, font size and font type that is to be
    displayed on the page.


    The value of the attribute is nothing but the value for the property that you
    wish to set. The value of an attribute should always be placed inside quotations.
    The examples below will show you the values that can be given to the above given
    name: Red, 3 and Georgia, as font color, size and type.


    You should be careful when using names and values for attributes, as they are
    case sensitive. However, the W3C (World Wide Web Consortium), recommends the use
    of lowercase attributes and attribute values in their recommendation for HTML
    4.


    Here is an example.


    Example


    <!DOCTYPE html>     <html>     <head>     <title>Align Attribute  Example</title>     </head>     <body>     <p align="right">This content will be aligned to the right</p>     <p align="center">This content will be aligned to the center</p>     <p align="left">This content will be aligned to the left</p>     </body>     </html>


    The above code will give us the following output:


    This content will be aligned to the right.


    This content will be aligned to the center.


    This content will be aligned to the left.


    ## Internationalization Attributes


    In HTML, there are a total of three internationalization attributes. These are
    available for most of the XHTML elements, but not for all.


    dir


    lang


    xml:lang


    ### The dir Attribute


    You can specify the text flow direction to the browser by using the dir attribute.
    This attribute can take two values, as shown in the table given below.


    ![](Images/image00122.jpeg)


    Example


    <!DOCTYPE html>     <html dir="rtl">     <head>     <title>Display Directions</title>     </head>     <body>     This is how IE 5 renders right-to-left directed text.     </body>     </html>


    The above code will produce the following output:


    This is how IE 5 renders right-to-left directed text.


    If the dir attribute is placed inside the<html> tag, it will determine how the
    text of the entire document will be presented. If this attitude is use the inside
    another tag, it will just to control the direction of the text contained in that
    specific tag.


    ### The lang Attribute


    You can indicate the main language that is to be used in your document by using
    the lang attribute. The only reason for keeping this attribute is HTML is for
    the backwards compatibility with previous versions of HTML. In the new XHTML documents,
    this attribute is replaced with the xml:lang attribute.


    The lang attributes have the values as ISO 639 standard 2-character language codes.
    You can check the complete list of language codes with the [HTML Language Codes:
    ISO 639](http://www.tutorialspoint.com/html/language_iso_codes.htm).


    Example


    <!DOCTYPE html>     <html lang="en">     <head>     <title>English Language Page</title>     </head>     <body>     This page is using English Language     </body>     </html>


    ### The xml:lang Attribute


    In XHTML, the xml:lang attribute is used as a replacement for the original lang
    attribute used in earlier versions of HTML. As mentioned above, the xml:lang attribute
    value should be an ISO-639 country code.


    ## Generic Attributes


    There are a few other attributes that can be readily used with most of the HTML
    tags. The list of those attributes is given in the table below.


    ![](Images/image00123.jpeg)


    # Chapter 3: Formatting in HTML


    If you are familiar with using the word processor, you probably must also be similar
    with making text bold, italicized or underlined. There are a total of 10 options
    available in HTML and XHTML, which will indicate your text will appear.


    ## Bold Text


    Any content that is placed in between <b>...</b> element will be displayed as
    bold text. Here is an example.


    Example


    <!DOCTYPE html>     <html>     <head>     <title>Example for Bold Text</title>     </head>     <body>     <p>The following word will be in a <b>bold</b> typeface.</p>     </body>     </html>


    The above code will produce the following output:


    The following word will be in a bold typeface.


    ## Italic Text


    Any content that is placed in between <i>...</i> element will be displayed as
    italicized text. Here is an example.


    Example


    <!DOCTYPE html>     <html>     <head>     <title>Example for Italic Text</title>     </head>     <body>     <p>The following word will be in a <i>italicized</i> typeface.</p>     </body>     </html>


    The above code will produce the following output:


    The following word will be in an italicized typeface.'
