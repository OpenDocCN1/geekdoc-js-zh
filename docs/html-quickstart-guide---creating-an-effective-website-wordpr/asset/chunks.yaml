    \ Tags</title>\n  <meta name=\"keywords\" content=\"Ducati, Aprilia, BMW\" />\n\
    \  <meta name=\"description\" content=\"Learning about Meta Tags.\" />\n</head>\n\
    <body>\n  <p>Hello World!</p>\n</body>\n</html>\n```\n\n## 文档修订日期\n\n`<meta>`\
    \ 标签可以提供有关文档最后更新的信息。各种网页浏览器在刷新您的网页时会使用这些信息。以下是一个示例。\n\n### 示例\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <title>Meta Tags Example</title>\n  <meta name=\"keywords\"\
    \ content=\"Ducati, Aprilia, BMW\" />\n  <meta name=\"description\" content=\"\
    Learning about Meta Tags.\" />\n  <meta name=\"revised\" content=\"Topgear, 7/7/15\"\
    \ />\n</head>\n<body>\n  <p>Hello HTML5!</p>\n</body>\n</html>\n```\n\n## 页面刷新\n\
    \n你可以使用 `<meta>` 标签来指定自动刷新页面的持续时间。以下是一个示例。\n\n### 示例\n\n如果你希望网页每 10 秒自动刷新一次，请使用下面的语法。\n\
    \n### 语法：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Meta Tags Example</title>\n\
    \  <meta name=\"keywords\" content=\"Ducati, Aprilia, BMW\" />\n  <meta name=\"\
    description\" content=\"Learning about Meta Tags.\" />\n  <meta name=\"revised\"\
    \ content=\"Topgear, 7/7/15\" />\n  <meta http-equiv=\"refresh\" content=\"10\"\
    \ />\n</head>\n<body>\n  <p>Hello HTML5!</p>\n</body>\n</html>\n```\n\n## 页面跳转\n\
    \n使用 `<meta>` 标签，你可以将网页重定向到其他网页。你实际上可以通过指定秒数来指定想要跳转页面的持续时间。以下是一个示例。\n\n### 示例\n\
    \n在以下示例中，当前页面将在 10 秒后跳转到另一个页面。如果你留空 content 属性，当前网页将立即被重定向。\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <title>Meta Tags Example</title>\n  <meta name=\"keywords\"\
    \ content=\"Ducati, Aprilia, BMW\" />\n  <meta name=\"description\" content=\"\
    Learning about Meta Tags.\" />\n  <meta name=\"revised\" content=\"Topgear, 7/7/15\"\
    \ />\n  <meta http-equiv=\"refresh\" content=\"5; url=http://www.topgear.com\"\
    \ />\n</head>\n<body>\n  <p>Hello HTML5!</p>\n</body>\n</html>\n```\n\n## 设置 Cookies\n\
    \nCookies 无非是以小型文本文件的形式存储在你的计算机上的数据。Cookies 在网页服务器和网页浏览器之间交换，用于跟踪 Web 所需的信息。\n\
    \n使用 `<meta>` 标签可以将 Cookies 存储在客户端，这些信息稍后可以被网页服务器用于跟踪网站的访问者。\n\n### 示例\n\n在以下示例中，当前页面将在\
    \ 10 秒后跳转到另一个页面。如果你留空 content 属性，当前网页将立即被重定向。\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>Meta Tags Example</title>\n  <meta name=\"keywords\" content=\"\
    Ducati, Aprilia, BMW\" />\n  <meta name=\"description\" content=\"Learning about\
    \ Meta Tags.\" />\n  <meta name=\"revised\" content=\"Topgear, 7/Jul/15\" />\n\
    \  <meta http-equiv=\"cookie\" content=\"userid=xyz; expires=Wednesday, 08-Aug-15\
    \ 23:59:59 GMT;\" />\n</head>\n<body>\n  <p>Hello HTML5!</p>\n</body>\n</html>\n\
    ```\n\n如果没有包含过期日期和时间，则 Cookie 将视为会话 Cookie（session cookie）。会话 Cookie 在浏览器关闭时删除。\n\
    \n## 设置作者名称\n\n你可以使用 meta 标签在网页中设置作者名称。见下示例：\n\n### 示例\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <title>Meta Tags Example</title>\n  <meta name=\"keywords\"\
    \ content=\"Ducati, Aprilia, BMW\" />\n  <meta name=\"description\" content=\"\
    Learning about Meta Tags.\" />\n  <meta name=\"author\" content=\"Mahnaz Mohtashim\"\
    \ />\n</head>\n<body>\n  <p>Hello HTML5!</p>\n</body>\n</html>\n```\n\n## 指定字符集\n\
    \n你可以使用 `<meta>` 标签来指定网页内使用的字符集。\n\n### 示例\n\n默认情况下，Web 服务器和网页浏览器使用 ISO-8859-1（Latin1）编码来处理网页。以下是设置\
    \ UTF-8 编码的示例：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Meta Tags\
    \ Example</title>\n  <meta name=\"keywords\" content=\"Ducati, Aprilia,BMW\" />\n\
    \  <meta name=\"description\" content=\"Learning about Meta Tags.\" />\n  <meta\
    \ name=\"author\" content=\"Mahnaz Mohtashim\" />\n  <meta charset=\"UTF-8\">\n\
    </head>\n<body>\n  <p>Hello HTML5!</p>\n</body>\n</html>\n```\n\n"
- fmt: "\nThe conditional comments do not work on any other browser other than Internet\
    \ Explorer. Other browsers ignore conditional comments. The support for conditional\
    \ comments started from Internet Explorer 5. They can be used for giving conditional\
    \ instructions for different Internet Explorer versions. Here is an example.\n\
    \n### Example\n\n```html\n<!DOCTYPE html><html>\n<head>\n  <title>Example for\
    \ Conditional Comments</title>\n<!--[if IE 6]>\n  Special instructions for IE\
    \ 6 here\n<![endif]-->\n</head>\n<body>\n<p>The content of the document goes here.....</p>\n\
    </body>\n</html>\n```\n\nConditional comments can be helpful in situations where\
    \ you will need to use different style sheets, depending on the version of IE.\n\
    \n## Using Comment Tag\n\nA part of the HTML code can be made as a comment and\
    \ there are a few browsers supporting the `<comment>` tag. Here is an example.\n\
    \n### Example\n\n```html\n<!DOCTYPE html><html>\n<head>\n<title>Using Comment\
    \ Tag</title>\n</head>\n<body>\n<p>This is <comment>not</comment> Internet Explorer.</p>\n\
    </body>\n</html>\n```\n\nThe above code will produce the following output if you're\
    \ using IE:\n\nThis is Internet Explorer.\n\nThe above code will produce the following\
    \ output if you're using a different browser other than IE:\n\nThis is not Internet\
    \ Explorer.\n\n## Commenting Script Code\n\nIn cases where you are using VBScript\
    \ or JavaScript with your HTML code, it is wise to place the script code inside\
    \ proper comments. This will make sure that they can be used with older browsers.\
    \ Here is an example.\n\n### Example\n\n```html\n<!DOCTYPE html><html>\n<head>\n\
    <title>Commenting Script Code</title>\n<script>\n<!--\n  document.write(\"Hakuna\
    \ Matata!\")\n//-->\n</script>\n</head>\n<body>\n<p>Hakuna, Matata!</p>\n</body>\n\
    </html>\n```\n\nThe above code will produce the following output:\n\nHakuna Matata!\n\
    \nHakuna, Matata!\n\n## Commenting Style Sheets\n\nIn cases where you are using\
    \ style sheets with your HTML code, it is wise to place the style sheet code inside\
    \ proper comments. This will make sure that they can be used with older browsers.\
    \ We will learn about style sheets in a different chapter. Here is an example.\n\
    \n### Example\n\n```html\n<!DOCTYPE html><html>\n<head>\n<title>Commenting Style\
    \ Sheets</title>\n<style>\n<!--\n.example {\n  border:1px solid #4a7d49;\n}\n\
    //-->\n</style>\n</head>\n<body>\n<div class=\"example\">Good, Morning!</div>\n\
    </body>\n</html>\n```\n\nThe above code will produce the following output:\n\n\
    Good, Morning!\n\n# Chapter 7: HTML Forms\n\nMost websites have at least one page\
    \ that asks its visitors for feedback, or requests them to subscribe by giving\
    \ their e-mail. To be able to do this, you need to have several text boxes in\
    \ the page, where the users give their inputs. Forms are used pretty much everywhere,\
    \ though it goes unnoticed. When you log into your e-mail, Facebook, or anything\
    \ that requires a username and password, you’re using a form to input your data.\
    \ This can be done in HTML by using forms, and its elements.\n\nThe idea behind\
    \ a form is that the visitor uses the text box to input some data, and the data\
    \ gets posted to a back-end application like ASP or PHP script. This application\
    \ can be configured to perform whatever action the webpage creator wants using\
    \ his own logical algorithms. Listed below are some commonly used elements and\
    \ attribute which you must know about to create a form that can capture your visitor’s\
    \ attention:\n\n### Input\n\nThe most important element out there, you use this\
    \ to get the input from the user. There are various input attributes like text,\
    \ radio buttons, and the submit button. Radio buttons are used to select from\
    \ different options which you give, and the other two are fairly straightforward\
    \ to understand. The syntax is `<input>`.\n\n### TextArea\n\nWhen you want your\
    \ user to enter something that goes beyond a single line, such as a paragraph\
    \ to describe their professional expertise, you need to use the `TextArea` element.\n\
    \n### Button\n\nThis element creates a button which when clicked, performs some\
    \ action.\n\n### Select\n\nThough not needed in forms where the user has to type\
    \ his details, knowing about this element makes it easier for your visitors. Select\
    \ element creates a drop-down list, from which the visitor can select one option.\n\
    \n### Legend\n\nAn important element you should consider if you want your form\
    \ to look organized, the legend creates a caption for the `fieldset` tag element\
    \ which groups together related fields in the form.\n\n## HTML5 elements\n\nThese\
    \ are elements unique to HTML5, and cannot be used elsewhere.\n\n### Datalist\n\
    \nWhen you want the user to get a list of options as soon as he starts typing,\
    \ then `Datalist` can be used. This is different from the `Select` element, where\
    \ the user can only select from a list of options. The `Datalist` element displays\
    \ a list if the user clicks the arrow mark, and also displays the relevant choice\
    \ as soon as the user starts typing.\n\n### Keygen\n\nWhen you want to create\
    \ a secure way to authenticate users, then the `keygen` element can be used. It\
    \ creates 2 keys, one is stored locally (the private key) and the other is sent\
    \ to the server (the public key).\n\n### Form Action\n\nBefore we head onto the\
    \ example, there’s one attribute which you must know, which is `form action`.\
    \ This attribute decides which page the data should be sent to, as the submit\
    \ button is pressed. By processing, what is meant is that you can either display\
    \ the details to the user, or just send it to a database. However, using form\
    \ action requires you have prior knowledge of ASP. Since this book focuses on\
    \ HTML alone, ASP and PHP will not be discussed. There are several tutorials online\
    \ that explain PHP and ASP in detail.\n\nWhen it comes to the syntax of the form\
    \ action, it’s quite simple:\n\n```html\n<form action=\"page.php\" method=\"method_you_want\"\
    >\n```\n\n### Get and Post\n\nNow this is pretty straightforward. The `page.php`\
    \ refers to the page you want to send the details to. If you do not have a page\
    \ defined previously, then all you will get is a ‘File not found’ message. However,\
    \ if you look at the URL or go through the information provided in the File not\
    \ found message, you will notice that the details that the user had entered appear\
    \ explicitly. This brings us to the method used in the form action.\n\nThere are\
    \ two form actions, `GET` and `POST`. If no option is selected in the beginning,\
    \ then the `GET` option is set as default. The problem with `GET` is that whatever\
    \ detail the user inputs, it gets displayed in the URL. While this may not pose\
    \ a problem when the user is at home, imagine a scenario when he or she uses your\
    \ form to enter details in a public place, or on a computer that’s common to all.\
    \ A small history check will open up the previously visited websites, along with\
    \ the passwords and usernames in the URL. This is a huge security threat, which\
    \ movies this guide toward the `POST` method.\n\nIn the `POST` method, the same\
    \ action occurs - that is, the details get sent to the PHP or ASP script or a\
    \ page where the details get processed - but nothing appears on the URL except\
    \ the page that the form action sends the details to.\n\nIf you want to use the\
    \ `POST` method, use the following syntax:\n\n```html\n<form action=\"page.php\"\
    \ method=\"POST\">\n```\n"
  raw: 'The conditional comments do not work on any other browser other than Internet
    Explorer. Other browsers ignore conditional comments. The support for conditional
    comments started from Internet Explorer 5\. They can be used for giving conditional
    instructions for different Internet Explorer versions. Here is an example.


    Example


    <!DOCTYPE html><html>     <head>       <title>Example for Conditional Comments</title>      <!--[if IE 6]>       Special instructions for IE 6 here     <![endif]-->      </head>     <body>     <p>The content of the document goes here.....</p>     </body>     </html>


    Conditional comments can be helpful in situations where you will need to use different
    style sheets, depending on the version of IE.


    ## Using Comment Tag


    A part of the HTML code can be made as a comment and there are a few browsers
    supporting the <comment> tag. Here is an example.


    Example


    <!DOCTYPE html><html>     <head>     <title>Using Comment Tag</title>     </head>     <body>     <p>This is <comment>not</comment> Internet Explorer.</p>     </body>     </html>


    The above code will produce the following output if you''re using IE:


    This is Internet Explorer.


    The above code will produce the following output if you''re using a different
    browser other than IE:


    This is not Internet Explorer.


    ## Commenting Script Code


    In cases where you are using VBScript or JavaScript with your HTML code, it is
    wise to place the script code inside proper comments. This will make sure that
    they can be used with older browsers. Here is an example.


    Example


    <!DOCTYPE html><html>     <head>     <title>Commenting Script Code</title>     <script>     <!--       document.write("Hakuna Matata!")     //-->     </script>     </head>     <body>     <p>Hakuna, Matata!</p>     </body>     </html>


    The above code will produce the following output:


    Hakuna Matata!


    Hakuna, Matata!


    ## Commenting Style Sheets


    In cases where you are using style sheets with your HTML code, it is wise to place
    the style sheet code inside proper comments. This will make sure that they can
    be used with older browsers. We will learn about style sheets in a different chapter.
    Here is an example.


    Example


    <!DOCTYPE html><html>     <head>     <title>Commenting Style Sheets</title>     <style>     <!--     .example {      border:1px solid #4a7d49;     }     //-->     </style>     </head>     <body>     <div class="example">Good, Morning!</div>     </body>     </html>


    The above code will produce the following output:


    Good, Morning!


    # Chapter 7: HTML Forms


    Most websites have at least one page that asks its visitors for feedback, or requests
    them to subscribe by giving their e-mail. To be able to do this, you need to have
    several text boxes in the page, where the users give their inputs. Forms are used
    pretty much everywhere, though it goes unnoticed. When you log into your e-mail,
    Facebook, or anything that requires a username and password, you’re using a form
    to input your data. This can be done in HTML by using forms, and its elements.


    The idea behind a form is that the visitor uses the text box to input some data,
    and the data gets posted to a back-end application like ASP or PHP script. This
    application can be configured to perform whatever action the webpage creator wants
    using his own logical algorithms. Listed below are some commonly used elements
    and attribute which you must know about to create a form that can capture your
    visitor’s attention:


    ### Input


    The most important element out there, you use this to get the input from the user.
    There are various input attributes like text, radio buttons, and the submit button.
    Radio buttons are used to select from different options which you give, and the
    other two are fairly straightforward to understand. The syntax is <input>.


    ### TextArea


    When you want your user to enter something that goes beyond a single line, such
    as a paragraph to describe their professional expertise, you need to use the TextArea
    element.


    ### Button


    This element creates a button which when clicked, performs some action.


    ### Select


    Though not needed in forms where the user has to type his details, knowing about
    this element makes it easier for your visitors. Select element creates a drop-down
    list, from which the visitor can select one option.


    ### Legend


    An important element you should consider if you want your form to look organized,
    the legend creates a caption for the fieldset tag element which groups together
    related fields in the form.


    ## HTML5 elements


    These are elements unique to HTML5, and cannot be used elsewhere.


    ### Datalist


    When you want the user to get a list of options as soon as he starts typing, then
    Datalist can be used. This is different from the Select element, where the user
    can only select from a list of options. The Datalist element displays a list if
    the user clicks the arrow mark, and also displays the relevant choice as soon
    as the user starts typing.


    ### Keygen


    When you want to create a secure way to authenticate users, then the keygen element
    can be used. It creates 2 keys, out of which one is stored locally (the private
    key) and the other is sent to the server (the public key).


    This list covers some of the most commonly used HTML form elements, and there
    are lots more to experiment with. Try these out first, and then start experimenting
    with different elements! Below are some example codes that you can use, or modify
    to suit your needs. The <form> tag has to be used to use the form elements in
    your webpage. Compared to elements, there are several times more attributes, so
    most of the commonly used attributes will be explained after the corresponding
    codes.


    ### Form Action


    Before we head onto the example codes, there’s one form attribute which you must
    know about, which is the “form action”. This attribute decides which the page
    the data entered should be sent to, as soon as the submit button is pressed. It
    is here where the input gets processed. By processing, what is meant is that you
    can either display the details to the user, or just send it to a MySQL database,
    where it can be stored for future use. However, using form action requires you
    have to prior knowledge of ASP or PHP scripts. Since this book focuses on HTML
    alone, ASP and PHP will not be discussed here. There are several tutorials online
    that explain PHP and ASP in detail. It''s not really all that difficult to understand,
    and you have to know about it, or HTML forms become useless since you need to 
    send the details obtained from the user to a form handler in order to actually
    have some use for them.


    When it comes to the syntax of the form action, it’s quite simple:


    <form action=“page.php” method=“method_you_want”>


    ### Get and Post


    Now this is pretty straightforward. The page.php refers to the page you want to
    send the details to. If you do not have a page defined previously, then all you
    will get is a ‘File not found’ message, since no such file exists. However, if
    you look at the URL or go through the information provided in the File not found
    message, you will notice that the details that the user had entered appear explicitly.
    This brings us to the method used in the form action.


    There are two form actions, GET and POST. If no option is selected in the beginning,
    then the GET option is set as default. The problem with GET is that whatever detail
    the user inputs, it gets displayed in the URL. While this may not pose a problem
    when the user is at home, imagine a scenario when he or she uses your form to
    enter details in a public place, or on a computer that’s common to all. A small
    history check will open up the previously visited websites, along with the passwords
    and usernames in the URL. This is a huge security threat, which movies this guide
    toward the POST method.


    In the POST method, the same action occurs - that is, the details get sent to
    the PHP or ASP script or a page where the details get processed - but nothing
    appears on the URL except the page that the form action sends the details to.


    If you want to use the POST method, use the following syntax:


    <form action=“page.php” method=“POST”>'
