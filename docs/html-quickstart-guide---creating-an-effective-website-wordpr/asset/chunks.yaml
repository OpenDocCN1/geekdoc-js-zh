  trans: "\n\n`<hr />` 标签也被归类为空元素。它不需要开始标签和结束标签，因为其中没有内容。\n\n在 `<hr />` 元素中，字符 `hr`\
    \ 和 `/` 之间有一个空格。如果省略了空格，旧版本的浏览器在渲染水平线时会出现问题；如果缺少 `/`，则在 XHTML 中它就不是一个有效的元素。\n\n\
    ## 保留格式\n\n在某些情况下，你的文本应保持与 HTML 文档中输入时相同的格式。此时你可以使用 `<pre>` 标签。它表示预格式化文本。\n\n\
    在 `<pre>` 和 `</pre>` 标签之间输入的任何文本都将保持与源文档中相同的文本格式。下面是一个示例。\n\n示例\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>保留格式示例</title>\n</head>\n<body>\n<pre>\nint main(void)\
    \ {\n  printf(\"Hello World!\\n\");\n  // return 0;\n\n}\n</pre>\n</body>\n</html>\n\
    ```\n\n上述代码将产生以下输出。\n\n```\nint main(void) {\n  printf(\"Hello World!\\n\");\n\
    \  // return 0;\n\n}\n```\n\n## 不换行空格\n\n在某些情况下，你不希望浏览器将单词跨行拆分。此时可以使用不换行空格实体 `&nbsp;`\
    \ 来代替普通空格。请看下面的示例以更好地理解。\n\n示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>不换行空格示例</title>\n\
    </head>\n<body>\n<p>\n电影中的特工是 \"James&nbsp;Bond&nbsp;007.\"</p>\n</body>\n</html>\n\
    ```\n\n# 第 2 章：HTML 元素\n\n一个元素由其开始标签定义。如果元素内可以包含其他内容，则它会有结束标签。对于结束标签，元素名称前会加上一个\
    \ `/`。下面给出了一些此类元素。\n\n![](img/image00121.jpeg)\n\n这里，`<i>` 和 `</i>` 是一个元素，`<marquee>`\
    \ 和 `</marquee>` 是另一个元素。有一些 HTML 元素不需要结束标签，例如 `<br />`、`<hr />`、`<img />` 等。这些不需要结束标签的\
    \ HTML 元素被称为空元素。\n\nHTML 文档为这些元素构建了一个树形结构，该结构规定了 HTML 文档应如何构建，同时也指定了文档的哪一部分应放置何种类型的内容。\n\
    \n## HTML 标签 vs. 元素\n\nHTML 元素通过开始标签来定义。如果内部放置了其他内容，则它会有结束标签。\n\n例如，`<i>` 是斜体文本的开始标签，`</i>`\
    \ 是其结束标签。但 `<i>这段文本是斜体</i>` 是一个斜体文本元素。\n\n## HTML 中的嵌套元素\n\nHTML 允许你在其他 HTML 元素中嵌套\
    \ HTML 元素。下面是一个示例：\n\n示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>嵌套元素示例</title>\n\
    </head>\n<body>\n<h2>这是一个<b>粗体</b>标题</h2>\n<p>这是<i>斜体</i>文本</p>\n</body>\n</html>\n\
    ```\n\n上述代码将产生以下输出：\n\n这是一个粗体标题\n\n这是斜体文本\n\n## 属性\n\n到目前为止，我们已经看到了一些最简单的标签，如段落标签\
    \ `<p>`、标题标签 `<h1>`、`<h2>` 等。这些标签可以附加一些额外信息，称为属性。\n\nHTML 元素的特性可以通过属性来定义。属性放在元素的开始标签内，包含两部分：名称和值。\n\
    \n属性名称就是你要设置的属性。例如，字体元素带有 color、size、type 等属性，用于指示页面上显示的字体颜色、字体大小和字体类型。\n\n属性值就是你要设置的属性的值。属性值应始终放在引号内。下面的示例将展示可以为上述名称赋予的值：Red、3\
    \ 和 Georgia，分别作为字体颜色、大小和类型。\n\n在使用属性的名称和值时需小心，因为它们是区分大小写的。不过，W3C（万维网联盟）在其 HTML\
    \ 4 推荐标准中建议使用小写的属性名称和属性值。\n\n下面是一个示例。\n\n示例\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>对齐属性示例</title>\n</head>\n<body>\n<p align=\"right\">此内容将右对齐</p>\n\
    <p align=\"center\">此内容将居中对齐</p>\n<p align=\"left\">此内容将左对齐</p>\n</body>\n</html>\n\
    ```\n\n上述代码将产生以下输出：\n\n此内容将右对齐。\n\n此内容将居中对齐。\n\n此内容将左对齐。\n\n## 国际化属性\n\nHTML 中共有三个国际化属性。这些属性适用于大多数\
    \ XHTML 元素，但并非全部。\n\n- `dir`\n- `lang`\n- `xml:lang`\n\n### `dir` 属性\n\n你可以使用\
    \ `dir` 属性向浏览器指定文本流向方向。该属性可以取两个值，如下表所示。\n\n![](img/image00122.jpeg)\n\n示例\n\n\
    ```html\n<!DOCTYPE html>\n<html dir=\"rtl\">\n<head>\n<title>显示方向</title>\n</head>\n\
    <body>\n这是 IE 5 渲染从右到左文本的方式。\n</body>\n</html>\n```\n\n上述代码将产生以下输出：\n\n这是 IE 5\
    \ 渲染从右到左文本的方式。\n\n如果 `dir` 属性放在 `<html>` 标签内，它将决定整个文档的文本呈现方式。如果该属性用在其他标签内，则仅控制该特定标签内包含的文本方向。\n\
    \n### `lang` 属性\n\n你可以使用 `lang` 属性指示文档中使用的主要语言。在 HTML 中保留此属性的唯一原因是为了向后兼容旧版本的 HTML。在新的\
    \ XHTML 文档中，此属性已被 `xml:lang` 属性取代。\n\n`lang` 属性的值采用 ISO 639 标准的 2 字符语言代码。你可以在\
    \ [HTML 语言代码：ISO 639](http://www.tutorialspoint.com/html/language_iso_codes.htm)\
    \ 查看完整的语言代码列表。\n\n示例\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    <title>英文页面</title>\n</head>\n<body>\n此页面使用英文\n</body>\n</html>\n```\n\n### `xml:lang`\
    \ 属性\n\n在 XHTML 中，`xml:lang` 属性用于替代早期 HTML 版本中使用的原始 `lang` 属性。如上所述，`xml:lang`\
    \ 属性的值应为 ISO-639 国家代码。\n\n## 通用属性\n\n还有一些其他属性可以方便地与大多数 HTML 标签一起使用。这些属性的列表如下表所示。\n\
    \n![](img/image00123.jpeg)\n\n# 第 3 章：HTML 中的格式化\n\n如果你熟悉使用文字处理器，那么你可能也熟悉将文本设为粗体、斜体或下划线。HTML\
    \ 和 XHTML 中共有 10 种选项可用于指示文本的显示方式。\n\n## 粗体文本\n\n放在 `<b>...</b>` 元素之间的任何内容都将显示为粗体文本。下面是一个示例。\n\
    \n示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>粗体文本示例</title>\n</head>\n\
    <body>\n<p>以下单词将以<b>粗体</b>显示。</p>\n</body>\n</html>\n```\n\n上述代码将产生以下输出：\n\n以下单词将以粗体显示。\n\
    \n## 斜体文本\n\n放在 `<i>...</i>` 元素之间的任何内容都将显示为斜体文本。下面是一个示例。\n\n示例\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>斜体文本示例</title>\n</head>\n<body>\n<p>以下单词将以<i>斜体</i>显示。</p>\n\
    </body>\n</html>\n```\n\n上述代码将产生以下输出：\n\n以下单词将以斜体显示。\n\n"
- fmt: "\n## Underlined Text\n\nAny content that is placed in between `<u>......</u>`\
    \ element will be displayed as underlined text. Here is an example.\n\nExample\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Example for Underlined Text</title>\n\
    </head>\n<body>\n<p>The following word will be in an <u>underlined</u> typeface.</p>\n\
    </body>\n</html>\n```\n\nThe above code will produce the following output:\n\n\
    The following word will be in an underlined typeface.\n\n## Strike Text\n\nAny\
    \ content that is placed in between `<strike>...</strike>` element will be displayed\
    \ as struck text, is a thin line through the text. Here is an example.\n\nExample\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Strike Text Example</title>\n\
    </head>\n<body>\n<p>The following word uses a <strike>strikethrough</strike> typeface.</p>\n\
    </body>\n</html>\n```\n\nThe above code will produce the following output:\n\n\
    The following word uses a strikethrough typeface.\n\n## Monospaced Font\n\nAny\
    \ content placed in between the `<tt>...</tt>` element will be displayed as monospaced\
    \ font. Most of the available fonts are variable width fonts. This is because\
    \ different letters have different widths. For instance the letter w is wider\
    \ than i. With a monospaced font, every letter will have the same width. Here\
    \ is an example.\n\nExample\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Example\
    \ for Monospaced Font</title>\n</head>\n<body>\n<p>The following word uses a <tt>monospaced</tt>\
    \ typeface.</p>\n</body>\n</html>\n```\n\nThe above code will produce the following\
    \ output:\n\nThe following word uses amonospacedtypeface.\n\n## Superscript Text\n\
    \nYou can use the `<sup>...</sup>` element for adding a superscript on your web\
    \ page. A superscript is nothing but the text with the same font with the same\
    \ font size as the text surrounding it, but it will be displayed half a character's\
    \ height above the surrounding text. Here is an example.\n\nExample\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>Example for Superscript Text</title>\n\
    </head>\n<body>\n<p>The following word uses a <sup>superscript</sup> typeface.</p>\n\
    </body>\n</html>\n```\n\nThe above code will produce the following output:\n\n\
    The following word uses a superscript  typeface.\n\n## Subscript Text\n\nYou can\
    \ use the `<sub>...</sub>` element for adding a subscript on your web page. A\
    \ subscript is nothing but the text with the same font with the same font size\
    \ as the text surrounding it, but it will be displayed half a character's height\
    \ below the surrounding text. Here is an example.\n\nExample\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>Example for Subscript Text</title>\n</head>\n\
    <body>\n<p>The following word uses a <sub>subscript</sub> typeface.</p>\n</body>\n\
    </html>\n```\n\nThe above code will produce the following output:\n\nThe following\
    \ word uses a subscript typeface.\n\n## Inserted Text\n\nAny text that is placed\
    \ in between the `<ins>...</ins>` element will be shown as inserted text. Here\
    \ is an example.\n\nExample\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Example\
    \ for Inserted Text</title>\n</head>\n<body>\n<p>I want to drink <del>cola</del>\
    \ <ins>wine</ins></p>\n</body>\n</html>\n```\n\nThe above code will produce the\
    \ following output:\n\nI want to drink cola wine\n\n## Deleted Text\n\nAny text\
    \ that is placed in between the `<del>...</del>` element will be shown as deleted\
    \ text. Here is an example.\n\nExample\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title>Example for Deleted Text</title>\n</head>\n<body>\n<p>I want to drink <del>cola</del>\
    \ <ins>wine</ins></p>\n</body>\n</html>\n```\n\nThe above code will produce the\
    \ following output:\n\nI want to drink wine\n\n## Larger Text\n\nAny content placed\
    \ inside the element `<big>...</big>` will be displayed as a one size larger font\
    \ than the rest of the content surrounding it. Here is an example explaining larger\
    \ text.\n\nExample\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Example\
    \ for Larger Text</title>\n</head>\n<body>\n<p>You canadd<big>larger</big> text\
    \ in middle of a sentence using this.</p>\n</body>\n</html>\n```\n\nThis above\
    \ code will produce the following output:\n\nYou can add larger text in middle\
    \ of a sentence using this.\n\n## Smaller Text\n\nAny content placed inside the\
    \ element `<small>...</small>` will be displayed as a one size smaller font than\
    \ the rest of the content surrounding it. Here is an example explaining smaller\
    \ text.\n\nExample\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Example\
    \ for Smaller Text</title>\n</head>\n<body>\n<p> You can add <small>smaller</small>\
    \ text in middle of a sentence using this.</p>\n</body>\n</html>\n```\n\nThis\
    \ above code will produce the following output:\n\nYou can add smaller text in\
    \ middle of a sentence using this.\n\n## Grouping Content\n\nYou can use the elements\
    \ `<div>` and `<span>` for grouping several elements together for creating sections\
    \ or subsections in a page. Here is an example.\n\nExample\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>Example for Div Tag</title>\n</head>\n<body>\n\
    <div id=\"menu\" align=\"middle\" >\n<a href=\"/index.htm\">HOME</a> | \n\n<a\
    \ href=\"/about/contact_us.htm\">CONTACT</a> |\n\n<a href=\"/about/index.htm\"\
    >ABOUT</a>\n</div>\n\n<div id=\"content\" align=\"left\" bgcolor=\"white\">\n\
    <h4>Some Content</h4>\n<p>The content will go here.....</p>\n</div>\n</body>\n\
    </html>\n```\n\nThis will produce the following output:\n\n[HOME](http://www.tutorialspoint.com/index.htm)\
    \ | [CONTACT](http://www.tutorialspoint.com/about/contact_us.htm) | [ABOUT](http://www.tutorialspoint.com/about/index.htm)\n\
    \nSOME CONTENT\n\nThe content will go here.....\n\nOn the other hand, the `<span>``\
    \ element can only be used for grouping inline elements. In cases where you need\
    \ to group a part of a paragraph or a sentence together, you can make use of the\
    \ `<span>` element. Here is an example.\n\nExample\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>Example for Span Tag</title>\n</head>\n<body>\n<p>This\
    \ is the example of <span style=\"color:green\">span tag</span> and the <span\
    \ style=\"color:red\">div tag</span> along with CSS</p>\n</body>\n</html>\n```\n\
    \nThe above code will produce the following output.\n\nThis is the example of\
    \ span tag and the div tag along with CSS\n\nThe above tags are used alongside\
    \ CSS, which allow you to attach a style to a particular section of a page.\n\n\
    # Chapter 4: HTML Phrase Tags\n\nThe phrase tags in HTML are designed for performing\
    \ specific purposes. They look similar to other tags like `<b>`, `<i>`, `<pre>`,\
    \ and `<tt>`, which we have already seen in our previous chapters. In this chapter\
    \ we will go through the important phrase tags in HTML.\n\n## Emphasized Text\n\
    \nAny content that is placed in between the `<em>...</em>` element will be shown\
    \ as emphasized text. Here is an example.\n\nExample:\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>Example for Emphasized Text</title>\n</head>\n<body>\n\
    <p>The following word uses a <em>emphasized</em> typeface.</p>\n</body>\n</html>\n\
    ```\n\nThe above code will produce the following output:\n\nThe following word\
    \ uses an emphasized typeface.\n\n## Marked Text\n\nAny content that is placed\
    \ in between the `<mark>...</mark>` element will be shown as marked text, with\
    \ a yellow link. Here is an example.\n\nExample\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>Marked Text Example</title>\n</head>\n<body>\n<p>The following\
    \ word has been <mark>marked</mark> with yellow</p>\n</body>\n</html>\n```\n\n\
    The above code will produce the following output:\n\nThe following word has been\
    \ marked with yellow.\n\n## Strong Text\n\nAny content that is placed in between\
    \ the `<strong>...</strong>` element will be shown as important text. Here is\
    \ an example.\n\nExample\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Strong\
    \ Text Example</title>\n</head>\n<body>\n<p>The following word uses a <strong>strong</strong>\
    \ typeface.</p>\n</body>\n</html>\n```\n\nThe above code will produce the following\
    \ output:\n\nThe following word uses a strong typeface.\n\n## Text Abbreviation\n\
    \nIn HTML, you are allowed to abbreviate your text. You can do it by placing the\
    \ text inside the opening `<abbr>` and closing</</abbr>` tags. The full description\
    \ should be added in the title attribute and nothing else, if present. Here is\
    \ an example.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Text Abbreviation</title>\n\
    </head>\n<body>\n<p>My best friend's name is  <abbr title=\"Abigail\">Abi</abbr>.</p>\n\
    </body>\n</html>\n```\n\nThe above code will produce the following output:\n\n\
    My best friend's name is Abi.\n"
