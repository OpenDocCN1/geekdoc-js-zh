    \ Text</title>\n</head>\n<body>\n<p>The following word uses a <sup>superscript</sup>\
    \ typeface.</p>\n</body>\n</html>\n```\n\n上面的代码将产生以下输出：\n\n接下来的单词将使用上标字体。\n\n\
    ## 下标文本\n\n你可以使用 `<sub>...</sub>` 元素在你的网页上添加下标。下标只是与周围文本具有相同字体和字号的文本，但它将显示在周围文本下方半个字符的高度。这里有一个示例。\n\
