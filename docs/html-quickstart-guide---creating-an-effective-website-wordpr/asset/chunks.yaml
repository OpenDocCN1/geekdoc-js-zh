  trans: "\n\n## 下划线文本\n\n任何放置在 `<u>............</u>` 元素之间的内容都将显示为下划线文本。这里有一个示例。\n\
    \n示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Example for Underlined\
    \ Text</title>\n</head>\n<body>\n<p>The following word will be in an <u>underlined</u>\
    \ typeface.</p>\n</body>\n</html>\n```\n\n上面的代码将产生以下输出：\n\n接下来的单词将以<u>下划线</u>字体显示。\n\
    \n## 删除线文本\n\n任何放置在 `<strike>...</strike>` 元素之间的内容都将显示为删除线文本，即穿过文本的一条细线。这里有一个示例。\n\
    \n示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Strike Text Example</title>\n\
    </head>\n<body>\n<p>The following word uses a <strike>strikethrough</strike> typeface.</p>\n\
    </body>\n</html>\n```\n\n上面的代码将产生以下输出：\n\n接下来的单词将使用<s>删除线</s>字体。\n\n## 等宽字体\n\n\
    任何放置在 `<tt>...</tt>` 元素之间的内容都将显示为等宽字体。大多数可用字体都是可变字体。这是因为不同的字母宽度不同。例如，字母 w 比 i\
    \ 宽。使用等宽字体，每个字母将具有相同的宽度。这里有一个示例。\n\n示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title>Example for Monospaced Font</title>\n</head>\n<body>\n<p>The following\
    \ word uses a <tt>monospaced</tt> typeface.</p>\n</body>\n</html>\n```\n\n上面的代码将产生以下输出：\n\
    \n接下来的单词将使用等宽字体。\n\n## 上标文本\n\n你可以使用 `<sup>...</sup>` 元素在你的网页上添加上标。上标只是与周围文本具有相同字体和字号的文本，但它将显示在周围文本上方半个字符的高度。这里有一个示例。\n\
