- fmt: "\nDepending on your requirements, you can set the height and width of an image\
    \ with the help of the `height` and `width` attributes. The height and width for\
    \ the image can either be specified in terms of its percentage with its actual\
    \ size or in terms of pixels. Not that the original resolution of the image will\
    \ change if the ratios are not maintained. Here is an example.\n\n### Example\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Set Image Width and Height</title>\n\
    </head>\n<body>\n<p>Setting image width and height</p>\n<img src=\"/html/images/test.png\"\
    \ alt=\"Test Image\" width=\"200\" height=\"150\"/>\n</body>\n</html>\n```\nThe\
    \ above code will produce an output image with the width 200 and height 150.\n\
    \n## Set Image Border\n\nEvery image by default will have a border surrounding\
    \ it. You can specify the thickness of the border using the `border` attribute,\
    \ in terms of pixels. If you wish to remove the border around your image, you\
    \ should set the thickness to 0. Here is an example.\n\n### Example\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>Set Image Border</title>\n</head>\n<body>\n\
    <p>Setting image Border</p>\n<img src=\"/html/images/test.png\" alt=\"Test Image\"\
    \ border=\"3\"/>\n</body>\n</html>\n```\nThe above code will produce an output\
    \ with the border 3.\n\n## Set Image Alignment\n\nAll the images, by default,\
    \ will be aligned to the left. You can specify the alignment of the image using\
    \ the `align` attribute to set the image to the right or center. Here is an example.\n\
    \n### Example\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Set Image Alignment</title>\n\
    </head>\n<body>\n<p>Setting image Alignment</p>\n<img src=\"/html/images/test.png\"\
    \ alt=\"Test Image\" border=\"3\" align=\"right\"/>\n</body>\n</html>\n```\nThe\
    \ above code will produce an output image aligned to the right, with a border\
    \ 3.\n\n# Chapter 9: HTML Lists\n\nIn HTML, information can be specified using\
    \ three types of lists. A list must contain at least one list element. Lists contain:\n\
    \n- `<ul>` - This is an unordered list. The list items will be listed using plain\
    \ bullets.\n- `<ol>` - This is an ordered list. The list items in this list will\
    \ be listed with different schemes of numbers.\n- `<dl>` - This is a definition\
    \ list. The items in the definition list will be arranged in the same way as they\
    \ are in a dictionary.\n\n## HTML Unordered Lists\n\nAnd unordered list can be\
    \ defined as a collection of items with no special sequence or order. You can\
    \ create this list by using the `<ul>` tag. All the items in this list will be\
    \ marked using bullets. Here is an example.\n\n### Example\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>HTML Unordered List</title>\n</head>\n<body>\n\
    <ul>\n<li>Apple</li>\n<li>Mango</li>\n<li>Banana</li>\n<li>Pear</li>\n</ul>\n\
    </body>\n</html>\n```\nThe above code will produce the following output:\n\nApple\n\
    Mango\nBanana\nPear\n\n### The type Attribute\n\nYou can actually specify the\
    \ type of bullet to be used by using the `type` attribute of the `<ul>` tag. The\
    \ default a bullet time is a disc. The other possible options are:\n\n- `<ul type=\"\
    disc\">`\n- `<ul type=\"square\">`\n- `<ul type=\"circle\">`\n\n### Example\n\
    Following is an example where we used `<ul type=\"square\">`:\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>HTML Unordered List</title>\n</head>\n<body>\n\
    \  <ul type=\"square\">\n    <li>Apple</li>\n    <li>Mango</li>\n    <li>Banana</li>\n\
    \    <li>Pear</li>\n  </ul>\n</body>\n</html>\n```\nThe above code will produce\
    \ the following output:\n\nApple\nMango\nBanana\nPear\n\n### Example\nFollowing\
    \ is an example where we used `<ul type=\"disc\">`:\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>HTML Unordered List</title>\n</head>\n<body>\n  <ul type=\"\
    disc\">\n    <li>Apple</li>\n    <li>Mango</li>\n    <li>Banana</li>\n    <li>Pear</li>\n\
    \  </ul>\n</body>\n</html>\n```\nThe above code will produce the following output:\n\
    \nApple\nMango\nBanana\nPear\n\n### Example\nFollowing is an example where we\
    \ used `<ul type=\"circle\">`:\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>HTML\
    \ Unordered List</title>\n</head>\n<body>\n  <ul type=\"circle\">\n    <li>Apple</li>\n\
    \    <li>Mango</li>\n    <li>Banana</li>\n    <li>Pear</li>\n  </ul>\n</body>\n\
    </html>\n```\nThe above code will produce the following output:\n\nApple\nMango\n\
    Banana\nPear\n\n## HTML Ordered Lists\n\nYou can use the order list in HTML when\
    \ you are required to place the list items in a numbered list, instead of using\
    \ the regular bullet list. You can place the items in an ordered list by using\
    \ the `<ol>` tag. The number for an ordered list starts with 1 and will be increment\
    \ by 1 with each element added to this list using `<li>`. Here is an example.\n\
    \n### Example\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>HTML Ordered List</title>\n\
    </head>\n<body>\n<ol>\n<li>Apple</li>\n<li>Mango</li>\n<li>Banana</li>\n<li>Pear</li>\n\
    </ol>\n</body>\n</html>\n```\nThe above code will produce the following output:\n\
    \nApple\nMango\nBanana\nPear\n\n### The type Attribute\n\nYou can specify the\
    \ numbering type you like by using the `type` attribute of the `<ol>` tag. The\
