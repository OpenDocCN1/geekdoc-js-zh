  trans: "\n\n有了这三个选项，你脑中可能会出现这个问题：应该使用哪种格式？所有这些格式与平均视频文件的大小相比都是微不足道的，你应该可以使用其中任何一种。然而，传统上\
    \ `mp3` 扩展名的音频文件尺寸要比 `ogg` 扩展名的音频文件大。在质量方面，`mp3` 优于 `ogg`，但这种差异微小到你甚至无法察觉。可以说，用哪种格式其实并不重要。但对于\
    \ `wav`，`ogg` 和 `mp3` 格式的都更小。\n\n未压缩的 `wav` 音频文件大得惊人，但大多数浏览器都支持它。`ogg` 最小，遗憾的是它并不通用。一些浏览器不接受\
    \ `ogg` 音频文件。因此，`mp3` 音频文件是最佳选择，因为它们的大小适中，并且被所有浏览器支持。\n\n让我们一个示例，以便更好地理解如何将音频文件添加到你的网页中：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <audio controls>\n    <source src=\"\
    example.ogg\" type=\"example/ogg\">\n    <source src=\"example.mp3\" type=\"example/mpeg\"\
    >\n  </audio>\n</body>\n</html>\n```\n\n## 源码\n代码中的 `<source>` 部分的作用与上面解释的视频部分中的\
    \ `<source>` 完全相同。它只是告诉浏览器应该选择哪一个音频文件。如果提供了多个格式，浏览器将决定采用它所支持的第一种格式。其他的将将被忽略。\n\
    \n## 控制功能\n`controls` 属性为网页上的音频文件提供了播放、音量和暂停等选项，这些功能在任何音频文件中都是至关重要的。\n\n当你不确定使用的浏览器是否支持特定文件时，请尝试执行以下示例代码：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <audio controls>\n    <source src=\"\
    example.ogg\" type=\"example/ogg\">\n    <source src=\"example.mp3\" type=\"example/mpeg\"\
    >\n    Does not support, apparently.\n  </audio>\n</body>\n</html>\n```\n\n如果你在屏幕上看到了你上面输入的文本，那么意味着浏览器不支持你正在使用的格式。基本上，如果浏览器支持该格式，`<audio>`\
    \ 和 `</audio>` 标签内的所有文本将不会显示。文本的显示是一个明确的信号，表明你应该更换正在使用的浏览器或正在使用的格式。\n\n## 嵌入 YouTube\
    \ 视频\n这是一种在你的网站上嵌入在线视频的有趣且简单的方法。当然，你需要向原始所有者致谢，但你可以嵌入在线视频。本章的下一部分将重点介绍如何将 YouTube\
    \ 视频（最常用的视频共享网站）嵌入你自己的网站中。在 HTML5 中，你可以轻松嵌入视频，但如前所述，除非使用 YouTube，否则在 HTML 中嵌入视频和音频是非常困难。\n\
    \n要了解更多关于嵌入 YouTube 视频的信息，让我们先查看并尝试理解此上下文中一个重要元素的功能：\n\n### iframe\n`<iframe>`\
    \ 标签用于指定内联框架（iframe 中的‘i’代表 inline 内联）。这意味着你可以在当前正在工作的文档中嵌入另一个文档。这是在网页上嵌入 YouTube\
    \ 视频的一种非常简单的方法，也是推荐的做法。\n\n通用语法为：\n```html\n<iframe src=\"document_you_want_to_add\"\
    ></</iframe>>\n```\n\n与音频和视频标签一样，如果你想查看当前浏览器是否支持 `<iframe>` 标签，只需在 `<iframe>`\
    \ 和 `</iframe>` 标签之间添加一些文本。如果它显示在屏幕上，则说明浏览器不支持该标签。如果没有文本，则意味着浏览器向你发出了绿灯允许继续。\n\
    \n以下步骤将让你对如何将 YouTube 视频添加到你的网页有一个清晰的认识：\n\n1.  注意视频 ID。当你在 YouTube 上播放视频时，会生成一个唯一的\
    \ ID，你应该将其记录。\n2.  在你的网页中创建 `<iframe>` 标签，并确保包含播放器中你想要的任何高宽比例。\n3.  在 `<iframe>`\
    \ 标签内，让 `src` 属性指向 YouTube 视频的 URL。这就是你之前记录的视频 ID 发挥用场的地方。就是这样！非常简单，不是吗？\n\n下面给出了示例代码：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <iframe width=\"420\" height=\"\
    345\" src=\"http://www.youtube.com/embed/enter_your_video_ID_here\"></</iframe>>\n\
    </body>\n</html>\n```\n\n这就是你对 YouTube 视频能做的全部了吗？绝对不是！你可以创建播放列表，并利用 YouTube 允许你的自动隐藏、自动播放、控制和循环功能。\n\
    \n要使用这些参数，你必须在嵌入的 URL 之后添加特定的符号。在这个阶段，你并不需要知道该符号的含义，只需知道你必须使用它就足够。这个符号是问号 `?`，它应该添加到\
    \ URL 的末尾，后面紧跟你想使用的参数。如果你想在同一个链接中添加多个参数，则必须使用 `&` 符号。基本上，只需为第一个参数使用问号，后续参数使用波浪符号。\n\
    \n让我们现在来看一个添加这些参数的简单方法：\n`http://www.youtube.com/embed/enter_video_ID_here?autoplay=1`\n\
    \n如果你注意到，`autoplay` 有不同的值。`autoplay=1` 代表启用自动播放，`autoplay=0` 代表禁用自动播放。YouTube\
    \ 本身定义了这些参数并赋予了这些值。在需要在单个 URL 中添加多个参数的情况下，语法将如下：\n`http://www.youtube.com/embed/enter_video_ID_here?autoplay=1&controls=0`\n\
    \n在这里，播放、暂停和进度控制控制将将显示。这就是值 0 对 `controls` 参数的作用。现在你了解了这些参数，你的兴趣可能被激发了。下面给出了一些\
    \ YouTube 参数及其值：\n\n### Autohide\n它决定是否显示播放器控制。\n- 值 `0`：使 `autohide` 参数始终显示播放控制。\n\
    - 值 `1`：在视频开始播放后隐藏播放控制。\n- 值 `2`：让浏览器根据播放器尺寸在 `0` 和 `1` 之间选择。如果播放器比例为 `16:9` 或\
    \ `4:3`，则选择选项 `1`，否则选择 `0`。\n\n### Autoplay\n正如其名，它决定视频是否在播放器加载时立即播放。\n- 值 `0`：视频在播放器加载后不会播放。用户必须点击播放。\n\
    - 值 `1`：视频在播放器加载后立即播放。\n\n### Loop\n`loop` 参数用于决定视频是否应该循环反复播放。\n- 值 `0`：默认选择此项，视频只播放一次。\n\
    - 值 `1`：视频将一直循环播放。\n\n### Playlists\n你还可以创建 YouTube 视频的播放列表。你不需要创建单独的 src 代码，可以使用单个源\
    \ URL 创建播放列表。\n\n"
- fmt: '

    First off, note down the ID of the YouTube playlist. You need this ID so that
    your browser can refer to it when you embed the playlist on your webpage. Now
    you have to use the `videoseries` parameter.


    An example code for embedding a playlist in your webpage would be:


    http://www.youtube.com/embed/videoseries?list=ID_you_took_note_of


    The method used to embed videos (`iframe`) here is the simplest of them all, and
    is highly recommended by YouTube as well. That does not necessarily mean that
    this is the only way of embedding videos on your webpage. Before `<iframe>` tag
    became popular, two tags were generally used: `<object>` and `<embed>`. Though
    deprecated from early 2015, it is still possible to use these tags, and as a website
    creator and designer, you need to know about using these tags as well.


    Let us look at an example to further understand the syntax of the `object` and
    `embed` tags:


    ### Object


    Before `iframe` became popular, the `object` tag was the de facto way of embedding
    any video on to a web page. It worked really well, but had some serious demerits,
    which is why YouTube currently disapproves of using the `<object>` tag to embed
    its videos. We will see more about about why `iframe` is preferred over `object`
    later on. For now, let us take a look at a small example to see how the `<object>`
    tag works:


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <object width="420" height="315" data=“http://www.youtube.com/embed/enter_the_video_ID_here”></object>

    </body>

    </html>

    ```


    As with the `<iframe>` tag, the `object` tag also requires you to specify the
    width to height aspect ratio, or you will face problems as the video begins to
    load. A notable change with the `<object>` tag is that the video is specified
    in the `data` attribute. There is no source `src` attribute here. As with iframe,
    there are several attributes you can use with the `<object>` tag, but you will
    not be using `<object>` tag much, and hence it will not be discussed in detail
    here, but if you really want to learn about the `<object>` tag, there are plenty
    of tutorials online that will be able to answer all your queries.


    ### Embed


    `Embed` works the same as `object` does, but here (once again) the `src` attribute
    is used to point to the YouTube video. If you are using a really old browser,
    then chances are `embed` tag is the only option for you to embed videos on to
    your web page. Most of the very old browsers do not support the `<object>` tag.


    Here is an example that depicts how the `<embed>` tag ought to be used to embed
    YouTube videos (or any video):


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <embed width="420" height="315" src=“http://www.youtube.com/embed/enter_video_ID_here”></embed>

    </body>

    </html>

    ```


    ### Why iframe?


    With all this in mind, let us now try and understand why the `<iframe>` tag is
    much more widely used than the other 2 tags.


    Essentially, `iframe` and the code embedded along with it are dynamic or ‘live’.
    What this means is that if some changes are made either intentionally or unintentionally
    to the settings, the embedded code will automatically adjust itself to accommodate
    the new changes. For example, to let some videos run you need to have shockwave
    flash player installed. If the user does not have this installed, then the code
    automatically allows the user to view the video with the help of the plug-in or
    player installed in the webpage. Another advantage in using the `iframe` tag is
    the format used. Some browsers do not allow certain formats, as discussed earlier.
    This is especially true in HTML5, which supports only 3 formats! But when you
    include the same source file in different formats using the `source-src` attribute
    in the `<iframe>` tag, then the browser gets the ability to automatically decide
    which format to play without the user or designer intervening. By default, the
    browser selects the first format that it recognizes and supports. While this may
    sound as a meagre issue to you right now, you will understand the problems behind
    `<object>` tag when you include a video file in a format that your browser does
    not support and end up staring at a huge blank screen, almost like the White Screen
    of Death).


    Coming to `<object>` tag, the greatest drawback is that it is static. To be more
    accurate, the embedded code added along with the `<object>` tag is static. What
    this means it that it does not allow its code to vary according to changes made
    in the settings. When you use the `<iframe>` tag in embed your videos, you do
    not need to give much importance to shockwave-flash player. In stark contrast,
    if you decide to embed your videos using the `<object>` tag and do not have the
    required software (player) installed on your browser, all you will end up seeing
    is the blank screen.


    In essence, it is safe to say that going the `<iframe>` way is best, and will
    work out the best results. Only in cases where `iframe` fails should you need
    to start using the `<object>` and `<embed>` tags.


    ## Adding plug-ins


    You may have the term ‘plug-ins’ used throughout this chapter. Plug-ins are nothing
    but small, simple helper applications that give the browser an additional function.
    It may be more appropriate to say that the plug-ins extend the functionality of
    a browser. There will be times when you will be expected to add a plug-in to let
    the browser you are using support some video or audio file. A characteristic of
    a good website is to have as less plug-ins as possible, however that does not
    mean you should not have any. Plug-ins are also the major reason why `<object>`
    and `<embed>` tags are used. To embed plug-ins, you are required to use `<object>`
    and `<embed>` tags. Let us now take an example to further understand how the object
    tag works.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <object width="500" height="100" data=“example.swf"></object>

    </body>

    </html>

    ```


    The `.swf` format stands for Shockwave Flash, and it is a format used by files
    that have small animations and sound. The `.swf` format was designed specifically
    with speed and efficiency in mind, and as such, using `.swf` formats to display
    small animations might be a good idea. Now, onto the attributes - width and height
    do the same function as before (they decide the object’s dimensions). The `data`
    attribute is used to specify the file you are going to displaying, be it an audio
    or video file, along with the format.


    This concludes the chapter on HTML multimedia. HTML5 will create new standards
    for multimedia, and sharing it will become easier than ever. Therefore it is imperative
    that you know about the basics of HTML5 as well (only after you master HTML, though).


    # Chapter 12: HTML5 and Semantics


    Once you have truly mastered HTML, you will begin to notice that the tags you
    use usually make no sense, unless you know what it does. For example, consider
    the tag `<div>`. When a person who has no knowledge of HTML sees this tag, he
    or she will never be able to figure out the true meaning of the tag, or its function.
    This isn’t really much of an issue, but it is quite annoying.


    We evolved from having to use just binary numbers to using text. Why not take
    it a step further and use text that actually make sense to both man and machine?
    This is exactly what HTML5 does. With HTML5, semantic elements have been added,
    using which HTML coding has become extremely easy.

