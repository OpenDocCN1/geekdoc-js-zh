  trans: "\n\n根据你的需求，你可以借助 `height` 和 `width` 属性设置图像的高度和宽度。图像的高度和宽度可以是相对于实际尺寸的百分比，也可以以像素为单位。请注意，如果不保持比例，图片的原始分辨率将会发生变化。以下是一个示例。\n\
    \n### 示例\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>设置图像宽度和高度</title>\n\
    </head>\n<body>\n<p>设置图像宽度和高度</p>\n<img src=\"/html/images/test.png\" alt=\"Test\
    \ Image\" width=\"200\" height=\"150\"/>\n</body>\n</html>\n```\n上面的代码将生成一个宽度为\
    \ 200、高度为 150 的图像。\n\n## 设置图像边框\n\n默认情况下，每张图像周围都有一个边框。你可以使用 `border` 属性以像素为单位指定边框的厚度。如果你想移除图像周围的边框，应将厚度设置为\
    \ 0。以下是一个示例。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>设置图像边框</title>\n\
    </head>\n<body>\n<p>设置图像边框</p>\n<img src=\"/html/images/test.png\" alt=\"Test\
    \ Image\" border=\"3\"/>\n</body>\n</html>\n```\n上面的代码将产生一个边框为 3 的输出。\n\n## 设置图像对齐方式\n\
    \n默认情况下，所有图像都向左对齐。你可以使用 `align` 属性指定图像的对齐方式，将图像设置为右侧或居中。以下是一个示例。\n\n### 示例\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>设置图像对齐方式</title>\n</head>\n<body>\n<p>设置图像对齐方式</p>\n\
    <img src=\"/html/images/test.png\" alt=\"Test Image\" border=\"3\" align=\"right\"\
    />\n</body>\n</html>\n```\n上面的代码将生成一个向右对齐的图像，边框为 3。\n\n# 第 9 章：HTML 列表\n\n在 HTML\
    \ 中，可以使用三种类型的列表指定信息。列表必须包含至少一个列表元素。列表包含：\n\n- `<ul>` - 这是一个无序列表。列表项将使用普通的符号列出。\n\
    - `<ol>` - 这是一个有序列表。此列表中的项将使用不同的数字方案列出。\n- `<dl>` - 这是一个定义列表。定义列表中的项目排列方式与字典中的排列方式相同。\n\
    \n## HTML 无序列表\n\n无序列表可以定义为没有特殊顺序或次序的项目集合。你可以通过 `<ul>` 标签创建此列表。列表中的所有项目都将使用符号标记。以下是一个示例。\n\
    \n### 示例\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>HTML 无序列表</title>\n\
    </head>\n<body>\n<ul>\n<li>Apple</li>\n<li>Mango</li>\n<li>Banana</li>\n<li>Pear</li>\n\
    </ul>\n</body>\n</html>\n```\n上面的代码将产生以下输出：\n\nApple\nMango\nBanana\nPear\n\n\
    ### type 属性\n\n你实际上可以通过使用 `<ul>` 标签的 `type` 属性来指定使用的符号类型。默认符号是实心圆（disc）。其他可能的选项有：\n\
    \n- `<ul type=\"disc\">`\n- `<ul type=\"square\">`\n- `<ul type=\"circle\">`\n\
    \n### 示例\n以下是一个使用了 `<ul type=\"square\">` 的示例：\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>HTML 无序列表</title>\n</head>\n<body>\n  <ul type=\"square\">\n  \
    \  <li>Apple</li>\n    <li>Mango</li>\n    <li>Banana</li>\n    <li>Pear</li>\n\
    \  </ul>\n</body>\n</html>\n```\n上面的代码将产生以下输出：\n\nApple\nMango\nBanana\nPear\n\
    \n### 示例\n以下是一个使用了 `<ul type=\"disc\">` 的示例：\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>HTML 无序列表</title>\n</head>\n<body>\n  <ul type=\"disc\">\n    <li>Apple</li>\n\
    \    <li>Mango</li>\n    <li>Banana</li>\n    <li>Pear</li>\n  </ul>\n</body>\n\
    </html>\n```\n上面的代码将产生以下输出：\n\nApple\nMango\nBanana\nPear\n\n### 示例\n以下是一个使用了\
    \ `<ul type=\"circle\">` 的示例：\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>HTML\
    \ 无序列表</title>\n</head>\n<body>\n  <ul type=\"circle\">\n    <li>Apple</li>\n\
    \    <li>Mango</li>\n    <li>Banana</li>\n    <li>Pear</li>\n  </ul>\n</body>\n\
    </html>\n```\n上面的代码将产生以下输出：\n\nApple\nMango\nBanana\nPear\n\n## HTML 有序列表\n\n\
    当你需要对列表项进行编号时，可以在 HTML 中使用有序列表。你可以通过 `<ol>` 标签将列表项放入有序列表中。以下是一个示例。\n\n### 示例\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>HTML 有序列表</title>\n</head>\n\
    <body>\n<ol>\n<li>Apple</li>\n<li>Mango</li>\n<li>Banana</li>\n<li>Pear</li>\n\
    </ol>\n</body>\n</html>\n```\n上面的代码将产生带编号的列表，从 1 开始。\n\n### type 属性\n\n你可以通过使用\
    \ `<ol>` 标签的 `type` 属性来指定编号类型。可选类型包括：\n\n- `type=\"1\"` - 阿拉伯数字（默认）\n- `type=\"\
    A\"` - 大写字母\n- `type=\"a\"` - 小写字母\n- `type=\"I\"` - 大写罗马数字\n- `type=\"i\"` -\
    \ 小写罗马数字\n\n### 示例\n以下是一个使用了 `<ol type=\"A\">` 的示例：\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>HTML 有序列表</title>\n</head>\n<body>\n  <ol type=\"A\">\n\
    \    <li>Apple</li>\n    <li>Mango</li>\n    <li>Banana</li>\n    <li>Pear</li>\n\
    \  </ol>\n</body>\n</html>\n```\n上面的代码将产生大写字母编号的输出。\n\n### 示例\n以下是一个使用了 `<ol type=\"\
    a\">` 的示例：\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>HTML 有序列表</title>\n\
    </head>\n<body>\n  <ol type=\"a\">\n    <li>Apple</li>\n    <li>Mango</li>\n \
    \   <li>Banana</li>\n    <li>Pear</li>\n  </ol>\n</body>\n</html>\n```\n上面的代码将产生小写字母编号的输出。\n\
    \n### 示例\n以下是一个使用了 `<ol type=\"I\">` 的示例：\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>HTML 有序列表</title>\n</head>\n<body>\n  <ol type=\"I\">\n    <li>Apple</li>\n\
    \    <li>Mango</li>\n    <li>Banana</li>\n    <li>Pear</li>\n  </ol>\n</body>\n\
    </html>\n```\n上面的代码将产生大写罗马数字编号的输出。\n\n### 示例\n以下是一个使用了 `<ol type=\"i\">` 的示例：\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>HTML 有序列表</title>\n</head>\n\
    <body>\n  <ol type=\"i\">\n    <li>Apple</li>\n    <li>Mango</li>\n    <li>Banana</li>\n\
    \    <li>Pear</li>\n  </ol>\n</body>\n</html>\n```\n上面的代码将产生小写罗马数字编号的输出。\n\n##\
    \ HTML 定义列表\n\nXHTML 和 HTML 支持一种被称为定义列表的列表样式。这里的实体将按照在百科全书或字典中的方式列出。使用定义列表非常表示项目列表、词汇表或其他值/名称列表。\n\
    \n定义列表将使用以下标签：\n\n- `<dl>` - 定义列表的开始\n- `<dt>` - 项目（术语）\n- `<dd>` - 项目定义\n- `</dl>`\
    \ - 定义列表的结束\n\n以下是使用 `<dt>` 的示例\n\n```html\n<dl>\n  <dt>Term</dt>\n  <dd>Term\
    \ definition</dd>\n</dl>\n```\n\n"
