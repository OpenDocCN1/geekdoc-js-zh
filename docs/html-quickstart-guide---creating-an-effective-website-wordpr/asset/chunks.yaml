    with the help of the height and width attributes. The height and width for the
    image can either be specified in terms of its percentage with its actual size
    or in terms of pixels. Not that the original resolution of the image will change
    if the ratios are not maintained. Here is an example.


    Example


    <!DOCTYPE html>     <html>     <head>     <title>Set Image Width and Height</title>     </head>     <body>     <p>Setting image width and height</p>     <img src="/html/images/test.png" alt="Test Image" width="200" height="150"/>     </body>     </html>


    The above code will produce an output image with the width 200 and height 150\.


    ## Set Image Border


    Every image by default will have a border surrounding it. You can specify the
    thickness of the border using the border attribute, in terms of pixels. If you
    wish to remove the border around your image, you should set the thickness to 0.
    Here is an example.


    Example


    <!DOCTYPE html>     <html>     <head>     <title>Set Image Border</title>     </head>     <body>     <p>Setting image Border</p>     <img src="/html/images/test.png" alt="Test Image" border="3"/>     </body>     </html>


    The above code will produce an output with the border 3\.


    ## Set Image Alignment


    All the images, by default, will be aligned to the left. You can specify the alignment
    of the image using the align attribute to set the image to the right or center.
    Here is an example.


    Example


    <!DOCTYPE html>     <html>     <head>     <title>Set Image Alignment</title>     </head>     <body>     <p>Setting image Alignment</p>     <img src="/html/images/test.png" alt="Test Image" border="3" align="right"/>     </body>     </html>


    The above code will produce an output image aligned to the right, with a border
    3\.


    # Chapter 9: HTML Lists


    In HTML, information can be specified using three types of lists. A list must
    contain at least one list element. Lists contain:


    <ul> - This is an unordered list. The list items will be listed using plain bullets.


    <ol> - This is an ordered list. The list items in this list will be listed with
    different schemes of numbers.


    <dl> - This is a definition list. The items in the definition list will be arranged
    in the same way as they are in a dictionary.


    ## HTML Unordered Lists


    And unordered list can be defined as a collection of items with no special sequence
    or order. You can create this list by using the <ul> tag. All the items in this
    list will be marked using bullets. Here is an example.


    Example


    <!DOCTYPE html>     <html>     <head>     <title>HTML Unordered List</title>     </head>     <body>     <ul>     <li>Apple</li>     <li>Mango</li>     <li>Banana</li>     <li>Pear</li>     </ul>     </body>     </html>


    The above code will produce the following output:


    Apple


    Mango


    Banana


    Pear


    The type Attribute


    You can actually specify the type of bullet to be used by using the type attribute
    of the <ul> tag. The default a bullet time is a disc. The other possible options
    are:


    <ul type="disc">


    <ul type="square">


    <ul type="circle">


    Example


    Following is an example where we used <ul type="square">


    <!DOCTYPE html>     <html>     <head>     <title>HTML Unordered List</title>     </head>     <body>       <ul type="square">       <li>Apple</li>       <li>Mango</li>       <li>Banana</li>       <li>Pear</li>       </ul>     </body>     </html>


    The above code will produce the following output:


    Apple


    Mango


    Banana


    Pear


    Example


    Following is an example where we used <ul type="disc"> :


    <!DOCTYPE html>     <html>     <head>     <title>HTML Unordered List</title>     </head>     <body>       <ul type="disc">       <li>Apple</li>       <li>Mango</li>       <li>Banana</li>       <li>Pear</li>       </ul>     </body>     </html>


    The above code will produce the following output:


    Apple


    Mango


    Banana


    Pear


    Example


    Following is an example where we used <ul type="circle"> :


    <!DOCTYPE html>     <html>     <head>     <title>HTML Unordered List</title>     </head>     <body>       <ul type="circle">       <li>Apple</li>       <li>Mango</li>       <li>Banana</li>       <li>Pear</li>       </ul>     </body>     </html>


    The above code will produce the following output:


    Apple


    Mango


    Banana


    Pear


    ## HTML Ordered Lists


    You can use the order list in HTML when you are required to place the list items
    in a numbered list, instead of using the regular bulleted list. You can place
    the items in an ordered list by using the <ol> tag. The number in for an ordered
    list starts with 1 and it will be incremented by 1 with each element added to
    this list using <li>. Here is an example.


    Example


    <!DOCTYPE html>     <html>     <head>     <title>HTML Ordered List</title>     </head>     <body>     <ol>     <li>Apple</li>     <li>Mango</li>     <li>Banana</li>     <li>Pear</li>     </ol>     </body>     </html>


    The above code will produce the following output:


    Apple


    Mango


    Banana


    Pear


    The type Attribute


    You can specify the numbering type you like by using the type attribute of the
    <ol> tag. The number will be the default numbering type. The other possible options
    are the following:


    <ol type="A"> - Upper-Case Letters.


    <ol type="a"> - Lower-Case Letters.


    <ol type="I"> - Upper-Case Numerals.


    <ol type="i"> - Lowercase Numerals.


    <ol type="1"> - Default-Case Numerals.


    Example


    We will use the <ol type="1"> for this example.


    <!DOCTYPE html>     <html>     <head>     <title>HTML Ordered List</title>     </head>     <body>       <ol type="1">       <li>Apple</li>       <li>Mango</li>       <li>Banana</li>       <li>Pear</li>       </ol>     </body>     </html>


    The above code will produce the following output:


    Apple


    Mango


    Banana


    Pear


    Example


    We will use the <ol type="I"> for this example.


    <!DOCTYPE html>     <html>     <head>     <title>HTML Ordered List</title>     </head>     <body>       <ol type="I">       <li>Apple</li>       <li>Mango</li>       <li>Banana</li>       <li>Pear</li>       </ol>     </body>     </html>


    The above code will produce the following output:


    Apple


    Mango


    Banana


    Pear


    Example


    We will use the <ol type="i"> for this example.


    <!DOCTYPE html>     <html>     <head>     <title>HTML Ordered List</title>     </head>     <body>       <ol type="i">       <li>Apple</li>       <li>Mango</li>       <li>Banana</li>       <li>Pear</li>       </ol>     </body>     </html>


    The above code will produce the following output:


    Apple


    Mango


    Banana


    Pear


    Example


    We will use the <ol type="A"> for this example.


    <!DOCTYPE html>     <html>     <head>     <title>HTML Ordered List</title>     </head>     <body>       <ol type="A">       <li>Apple</li>       <li>Mango</li>       <li>Banana</li>       <li>Pear</li>       </ol>     </body>     </html>


    The above code will produce the following output:


    Apple


    Mango


    Banana


    Pear


    Example


    We will use the <ol type="a"> for this example.


    <!DOCTYPE html>     <html>     <head>     <title>HTML Ordered List</title>     </head>     <body>       <ol type="a">       <li>Apple</li>       <li>Mango</li>       <li>Banana</li>       <li>Pear</li>       </ol>     </body>     </html>


    The above code will produce the following output:


    Apple


    Mango


    Banana


    Pear


    The start Attribute


    You can specify the starting point with a specific number to start a list with
    the help of the start attribute of the <ol> tag. The other possible options the
    following (we will start at the numbering with 3).


    <ol type="1" start="3">    - Numerals starts with 3


    <ol type="a" start="3">    - Letters starts with c


    <ol type="A" start="3">    - Letters starts with C


    <ol type="i" start="3">    - Numerals starts with iii


    <ol type="I" start="3">    - Numerals starts with III


    Example


    Following is an example where we used <ol type="i" start="3" >


    <!DOCTYPE html>     <html>     <head>     <title>HTML Ordered List</title>     </head>     <body>       <ol type="i" start="3">       <li>Apple</li>       <li>Mango</li>       <li>Banana</li>       <li>Pear</li>       </ol>     </body>     </html>


    The above code will produce the following output:


    Apple


    Mango


    Banana


    Pear


    ## HTML Definition Lists


    XHTML an HDMI support a list style called the definition list. Here are the entities
