  trans: '


    ## 添加音频


    与视频类似，在 HTML5 之前，音频无法轻松集成到网站中。网站设计师必须使用名为“插件”（plug-ins）的额外程序来让音频在网站中播放。这意味着当时并没有统一的标准。HTML5
    再次扫清了这些困难，为我们带来了一种在网页中播放音频文件的新且简便的方法：`<audio>` 标签。


    HTML 曾支持不同的音频格式，但仅得益于那些烦人的插件（这些插件曾是导致网页崩溃的主要原因）。然而，HTML5 对音频和视频也同样挑剔，只允许 3 种格式。它们分别是
    `ogg`、`mp3` 和 `wav` 格式。

