    这段示例代码遗憾地只获取了详情，但没有对这些详情进行任何处理。为了处理这些信息，你需要包含一个之前讨论过的 `submit` 类型的输入框以及一个表单的 `action`。这个表单
    `action` 必须将详情发送到网站上的相关页面（通常在网页内部），在该页面上可以处理详情，并可以使用最终结果。例如，如果你想将详情存储在数据库中，你需要通过
    `form action` 来实现，如果没有提交按钮，这是无法实现的。再次强调，这显而易见，但‘rows’代表你希望输入框拥有的行数，而‘cols’代表你希望的列数（基本上是每行的字母数，包括空格）。


    ## 范围（Range）


    你可能在多个 HTML 表单中见过一个滑块，在其中你点击圆形按钮并将其拖动到你想要指示的数字或百分比的位置。你可以借助 `<range>` 标签来实现这一点。这会创建一个由你设置最小值和最大值的滑块，供用户使用。


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <form action="action_page.php" method="get">

    百分比：

    <input type="range" name="percent" min="0" max="100">

    <input type="submit">

    </form>

    </body>

    </html>

    ```


    这会创建一个范围为 0-100% 的滑块，你能够选择中间的任何值。然而，这只接受整数。一个理想的示例是：在一个表单接收用户关于其体脂百分比、身高和体重的输入，然后给出质量指数（BMI）作为输出。在这里，你不需要以数字形式获取体脂百分比的输入，而是可以使用滑块来完成。最后，重要的是表单易于使用，而不是输入是如何获取的。


    请注意，`<range>` 标签在 Internet Explorer 9 及其之前的版本中不受支持。


    ## 时间与周（Time and Week）


    `time` 和 `week` 标签允许用户输入时间、周以及年份。如果你的表单要求用户输入出生年份，那么使用这些标签将变得简单得多，因为会弹出一个时间或周的选择器，用户只需从中选择时间、周和年份，而无需手动输入。


    ### 示例


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <form action="page.php">

    选择时间：

    <input type="time" name="time">

    <input type="submit">

    </form>

    </body>

    </html>

    ```


    此示例创建了一个字段，用户必须其中输入时间，或者从时间选择器中选择，选择器会在用户开始输入时弹出。需要知道的是是，这种时间选择器在某些浏览器中可能不受支持，因此务必提前检查你是否需要用户从选择器中选择而不是手动输入。


    同样，也可以使用输入类型 `week`、`datetime` 和 `month`。`week` 和 `month` 在大多数浏览器中都可以工作，但 `datetime`
    标签还提供了时区。如果你只想要用户所在国家的本地时间，那么使用 `datetime-local` 会更合适。再次，`datetime-local` 的代码与
    `week` 和 `month` 的代码相同。


    这些是你可以在所有表单中使用（并在以后使用）的各种输入类型。现在你已经对不同的输入类型有了清晰的思路，是时候转向这些输入类型内部可以使用的不同元素了，让你的表单看起来更好且更易于使用。


    ## 下拉列表（Select）


    HTML 表单的 `select` 属性创建一个下拉列表。该列表包含用户可以选择的选项。这与‘Number’等属性不同，因为用户只能选择选项，不能在其中输入任何内容。


    ### 示例


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <form action="page.asp" method="POST">

    用户名：<input type="text" name="userid">

    <input type="submit" value="存储用户 ID">

    <br>

    列表：

    <select>

    <option value="a">A</option>

    <option value="b">B</option>

    <option value="c">C</option>

    <option value="d">D</option>

    </select>

    </form>

    </body>

    </html>

    ```


    在这里，使用了 `POST` 方法，如前所述，它将防止详情在用户点击提交按钮时显示在 URL 中。在列表中，你可以添加任意数量的选项，但请确保在每个选项之后都包含
    `</option>` 标签。当你希望选中的选项在发送到的页面中具有特定的变量名时，请使用 `name` 属性。你的代码看起来应该是这样：


    ```html

    <select name="name_you_want_in_page">

    ```


    ## 字段组与图例（FieldSet and Legend）


    `legend` 用于为 `<fieldset>` 标签提供标题。`fieldset` 标签将你想要的元素组合在一起。当使用 `fieldset` 标签时，元素周围会出现一个可见的边界。这使得你的用户更容易阅读和理解需要作为输入的内容。`legend`
    标签的作用是在 `fieldset` 顶部创建一个标题，这使得用户更加方便。作为网站设计师，用户的舒适度应该是你的首要目标，这些标签会非常有用。


    ### 示例


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <form>

    <fieldset>

    <legend>教育</legend>

    学校：<input type="text"><br>

    大学：<input type="text"><br>

    学历：<input type="text">

    <input type="submit">

    </fieldset>

    </form>

    </body>

    </html>

    ```


    此代码将创建文本框，用户在此填写详情，最后的提交操作如前所述。


    ## HTML5 元素


    下面的元素是 HTML5 中添加的各种元素中的两个。这些元素在兼容 HTML5 的浏览器中工作。


    ### 数据列表（Datalist）


    有时，在列表中寻找特定选项可能会很麻烦，特别是当列表很大时。在这种情况下，使用 `datalist` 而不是简单的 `<option>` 标签会让用户更方便。`datalist`
    与数字标签不同，它用于文本。它作为输入框的自动填充功能。一旦用户开始输入，相关的选项就会弹出。


    ### 示例


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <form action="page.asp" method="get">

    <input list="bike" name="bike">

    <datalist id="bike">

    <option value="bike1">

    <option value="bike2">

    <option value="bike3">

    <option value="bike4">

    <option value="bike5">

    </datalist>

    <input type="submit">

    </form>

    </body>

    </html>

    ```


    尽管非常实用，`datalist` 标签只能在 HTML5 中使用，Internet Explorer 9 及其之前的版本甚至不支持。


    ## 密钥生成（Keygen）


    当你需要验证用户身份时，你需要使用 `keygen` 标签。该标签的功能是创建一对密钥。其中一个密钥将存储在本地，另一个将发送到服务器。当然，本地存储的密钥是私有的，另一个是公开的。


    ### 示例


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <form action="page" method="get">

    用户名：<input type="text" name="userid">

    加密：<keygen name="password">

    <input type="submit">

    </form>

    </body>

    </html>

    ```


    在这里，`name` ‘password’指的是你发送到的页面中的变量名，该变量存储生成的密钥。遗憾的是，此标签不支持任何版本的 Internet Explorer，因此在实际在你的网站中实现它之前，请务必小心。


