    首先，记录下 YouTube 播放列表的 ID。你需要这个 ID，以便你的浏览器在网页上嵌入播放列表时能够引用它。现在，你必须使用 `videoseries`
    参数。


    在你的网页中嵌入播放列表的代码示例如下：


    http://www.youtube.com/embed/videoseries?list=ID_you_took_note_of


    这里用于嵌入视频的方法（`iframe`）是所有方法中最简单的，YouTube 也高度推荐使用它。这并不意味着这是在网页上嵌入视频的唯一方法。在 `<iframe>`
    标签流行之前，通常会使用两个标签：`<object>` 和 `<embed>`。虽然它们从 2015 年初就开始废弃了，但仍然可以使用这些标签，而且作为网站的创建者和设计师，你需要了解这些标签的使用。


    让我们来看一个示例，以进一步理解 `object` 和 `embed` 标签的语法：


    ### Object


    在 `iframe` 流行之前，`object` 标签是在网页上嵌入任何视频的实际标准。它的运行效果非常好，但也有存在一些严重的缺点，这就是为什么 YouTube
    目前不赞使用 `<object>` 标签来嵌入其视频。稍后我们将看到更多关于为什么 `iframe` 优于 `object` 的内容。现在，让我们来看一个小示例，看看
    `<object>` 标签是如何工作的：


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <object width="420" height="315" data=“http://www.youtube.com/embed/enter_the_video_ID_here”></object>

    </body>

    </html>

    ```


    与 `<iframe>` 标签一样，`object` 标签也你指定宽高的纵横比，否则当视频开始加载时你将面临问题。`<object>` 标签的一个显著变化是，视频是在
    `data` 属性中指定的。这里没有源文件 `src` 属性。和 iframe 一样，有几个属性可以与 `<object>` 标签一起使用，但你不会经常使用
    `<object>` 标签，因此在这里不会进行详细讨论；但如果你真的想学习 `<object>` 标签，网上有大量的教程可以回答你的所有查询。


    ### Embed


    `Embed` 的工作方式与 `object` 相同，但这里（再次）使用 `src` 属性来指向 YouTube 视频。如果你使用的是非常老旧的浏览器，那么
    `embed` 标签可能是你在网页上嵌入视频的唯一选择。大多数非常老老的浏览器都不支持 `<object>` 标签。


    这里是一个描述如何使用 `<embed>` 标签来嵌入 YouTube 视频（或任何视频）的示例：


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <embed width="420" height="315" src=“http://www.youtube.com/embed/enter_video_ID_here”></embed>

    </body>

    </html>

    ```


    ### 为什么选择 iframe?


    考虑到所有这些，让我们现在尝试理解一下为什么 `<iframe>` 标签比其他两个标签使用得广泛得多。


    本质上，`iframe` 和随之嵌入的代码是动态或“实时”的。这意味着，如果对设置进行了有意或无意的任何更改，嵌入的代码将自动调整自身以适应这些新变化。例如，为了让某些视频运行，你需要安装
    shockwave flash 播放器。如果用户没有安装它，代码会自动允许用户通过网页中安装的插件或播放器查看视频。使用 `iframe` 标签的另一个优势是所使用的格式。正如之前讨论过的，某些浏览器不允许某些格式。这在仅支持
    3 种格式的 HTML5 中尤其如此！但当你使用 `<iframe>` 标签中的 `source-src` 属性以不同格式包含同一个源文件时，浏览器就能够在没有用户或设计师干预的情况下自动决定播放哪种格式。默认情况下，浏览器选择它识别并支持的第一种格式。虽然这现在听起来来说可能是一个微不足道的问题，但当你以浏览器不支持的格式包含视频文件，并最终面对一个巨大的空白屏幕（几乎就像“死亡白屏”一样）时，你就会理解
    `<object>` 标签背后的问题了。


    谈到 `<object>` 标签，最大的缺点是它是静态的。更准确地说，随 `<object>` 标签一起添加的嵌入代码是静态的。这意味着它不允许代码根据设置的更改而变化。当你使用
    `<iframe>` 标签嵌入视频时，你不需要重视 shockwave-flash 播放器。形成鲜明对比的是，如果你决定使用 `<object>` 标签嵌入视频，并且浏览器上没有安装所需的软件（播放器），你最终看到的将是空白屏幕。


    从本质上说，可以说采用 `<iframe>` 方式是最好的，并将产生最好的结果。只有在 `iframe` 失败的情况下，你才需要开始使用 `<object>`
    和 `<embed>` 标签。


    ## 添加插件


    你可能会在本章中看到“插件（plug-ins）”一词。插件无非小型、简单的辅助程序，为浏览器提供额外的功能。说插件扩展了浏览器的功能更为合适。在某些情况下，你会被要求添加插件，以便你正在使用的浏览器支持某些视频或音频文件。一个优秀网站的特点是尽可能减少插件，但这并不意味着你不应该有任何。插件也是使用
    `<object>` 和 `<embed>` 标签的主要原因。为了嵌入插件，你需要使用 `<object>` 和 `<embed>` 标签。让我们现在来看一个示例以进一步理解
    object 标签的工作：


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <object width="500" height="100" data=“example.swf"></object>

    </body>

    </html>

    ```


    这结束了 HTML 多媒体的章节。HTML5 将为多媒体创建新标准，共享它将变得前所未有的简单。因此，你必须了解 HTML5 的基础知识（尽管是在掌握 HTML
    之后）。


    # 第 12 章：HTML5 与语义化


    一旦你真正精通了 HTML，你就会开始注意到你使用的标签通常没有任何意义，除非你知道它是做什么的。例如，考虑 `<div>` 标签。当一个没有任何 HTML
    知识的人看到这个标签时，他或她永远无法弄清楚标签的真实含义或功能。


    我们从必须使用二进制数字演进到使用文本。为什么不更进一步，使用对人类和机器都有意义的文本呢？这正是 HTML5 所能的。通过 HTML5，添加了语义化元素，使用这些元素
    HTML 编码变得极其简单。

