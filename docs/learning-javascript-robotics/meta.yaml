    Try putting something warm or cold near the sensor to see how the bar graph changes!


    ## Summary


    In this chapter, we''ve learned how to use many different input devices and sensors
    in order to build Johnny-Five projects that listen to the world around them. We''ve
    learned how to listen for events, as well as use both the generic Sensor object
    and specialized objects like Button and Temperature.


    In the next chapter, we''ll start looking at moving robots using sensors.


    ## Chapter 6. Moving Your Bot


    In this chapter, we will cover the following topics:


    - The different kinds of servos and motors

    - Special concerns when using motors and servos

    - Wiring up servos and motors

    - Creating a project with a motor and using the REPL

    - Creating a project with a servo and a sensor


    ## What you''ll need for this chapter


    You''ll need your microcontroller—I highly recommend the Arduino Uno for this
    chapter because of its compatibility. You''ll also need your USB cable, a breadboard,
    some breadboard wires, and a 10k ohm resistor. Grab a photocell, or any other
    sensor you''d like to try.


    You''ll also need a motor that runs on 5V and a standard hobby servo that uses
    5V. These can be found easily at hobby stores or on Adafruit, SparkFun, Seeed
    studio, and many other online shops. Check out the following section to see some
    of your options.


    ## The different kinds of servos and motors


    First, we''ll go over a few common servos and motors that you''ll run into. But
    first, for those who are new to this, let''s look at a quick description of motors
    and servos.


    ## Defining motors and servos


    A motor (or an electrical motor for our purposes) converts electrical energy to
    motion. Electricity goes in, motion comes out. This motion is output as a rotation
    motion; one of the most common uses of electronic motors is to turn wheels. Note
    that while you can control the speed of a motor by controlling the power being
    input, you cannot change the position of a motor precisely.


    This is where servos come in. Servos use electricity to move to a set point—most
    commonly in an arc of 180 degrees. However, there are some servos that can rotate
    360 degrees. We''ll discuss these in a moment. Servos are technically specialized
    motors, and while motors are used to propel projects, servos are used to control
    them.


    ## Things to keep in mind


    There are quite a few servos and motors available for use with your Johnny-Five
    projects. While we are going to go over many of these, there are a few things
    to keep in mind when looking at motors to be used.


    For instance, be sure to be aware of the voltage and current needed to power the
    motor or servo; if this is above 5 volts, you''ll need to power them with something
    other than the Arduino''s 5V OUT, and if they draw a lot of current but only use
    5V, you might consider an external power supply for your Arduino board. Note that
    additional electric current is supplied whenever you have multiple servos—but
    the voltage required stays the same; for instance, if you have two servos that
    require 5V of voltage but 200 mA of electric current, you still only need 5 volts
    but you will need 400 mA current! Much of this information can be found on the
    data sheet for the motor or servo you are using.


    ## Types of motors


    While we''re going to go over a few types of motors here, keep in mind that the
    functionality of most of these motors is the same; they have an on and off switch,
    and you can slightly adjust their speed with power adjustments. However, this
    doesn''t rule out the use of motors entirely—there are some interesting uses as
    well!


    Your standard hobby motor looks like a large cylinder with a few wires on one
    end and a rod on the other end, like the following figure:


    ![](img/798b2390880773c3e3d0e21417ef58f8_125_0.png)


    A standard DC hobby motor


    The motors come in various sizes and can generate different levels of work. These
    are mainly used for motion and propelling projects such as remote-control vehicles.
    Some of these motors are called directional motors—this means you can control
    the direction. With nondirectional motors, you can only turn the motor in one
    direction. Keep in mind when considering your project.


    There are also vibration motors—these are found in cell phones that alert you
    to your calls without an audible ring. These look similar to regular motors, but
    the rod at the end has an asymmetrical weight attached, as shown in the following
    figure:


    ![](img/798b2390880773c3e3d0e21417ef58f8_126_0.png)


    A vibration motor


    These motors are primarily used for tactile vibration, but in the wearables and
    cell phone worlds, this can be a vital piece of the puzzle!


    Finally, there are stepper motors. They are usually larger and require more power:


    ![](img/798b2390880773c3e3d0e21417ef58f8_126_1.png)


    A stepper motor


    However, stepper motors move in a discreet manner, giving you more control and
    precision with full rotation. One very common use of these motors is 3D printing—these
    are de-crete.


    ## Types of servos


    There are two main types. The first is the standard servo, which is generally
    used in remote-control vehicles, such as cars, as shown in the following figure:


    ![](img/798b2390880773c3e3d0e21417ef58f8_127_0.png)


    A standard servo


    These servos move in a range of 180 degrees. There are also continuous servos
    that can rotate 360 degrees. These are regularly used in robotics, as they can
    be set to a specific speed.


    There are also continuous servos that span a full 360 degree. These tend to look
    similar to the standard servo, as shown in the following figure:


    ![](img/798b2390880773c3e3d0e21417ef58f8_128_0.png)


    A continuous servo


    ## Do I use a servo or motor?


    This is a fantastic question: if you want movement, which one do you use? A servo
    or a motor? The rule of thumb is, if you want precise movement, you''ll need a
    servo; while motors go on and off with the speed varied by the amount of power
    sent to it. Many of you will think that if you want a full 360 degree range, you''re
    limited to motors. This isn''t always the case; continuous servos combine the
    precise nature of servos with a full range of motion offered by a motor.


    ## Servo and motor controllers


    Sometimes, you may want to use a lot of motors or servos on a project; a good
    example of this is a hexapod kit, which uses high-powered servos! There are not
    that many pins on an Arduino Uno, but using a servo or motor controller, you can
    control many motors or servos using two data pins. These controllers use the I2C
    method that we discussed in Chapter 4, Using Specialized Output Devices. Johnny-Five
    has built-in support for quite a few of these controllers. If you''d like to use
    one, make sure that you check the documentation at www.johnny-five.io to make
    sure yours is compatible.


    ![](img/798b2390880773c3e3d0e21417ef58f8_130_0.png)


    An example of a servo controller with an I2C interface


    ## Motor and servo shields


    A shield is an Arduino term for a board that is placed on top of an Arduino, usually
    an Uno, to give some extra capability. Shields can be used to add Wi-Fi, LED matrices,
    and so on. A very common shield type is the shield for motors and servos. Johnny-Five
    supports a few shields for motor use. Again, if you wish to use a lot of motors
    or high-powered motors, check out the documentation at www.johnny-five.io to see
    whether a motor shield is right for your project.


    ![](img/798b2390880773c3e3d0e21417ef58f8_131_0.png)


    An example of a motor shield

