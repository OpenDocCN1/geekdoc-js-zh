    \ LED 的开关要复杂得多。幸运的是，Johnny-Five 的 Piezo API 提供了 `play()` 方法，它接受一个对象。该对象具有 `beats`（节拍）、`tempo`（节奏）和\
    \ `song`（歌曲）等属性——我们将使用这些属性来播放你的曲子。\n\n有很多方法可以为 `play()` 方法描述歌曲。一种方法——我们在这里使用的方法——是字符串字符串：\n\
    \nCDFDA-AAAAAGGGGG--CDDFG-GGGGFFFF--\n\n当你使用这种方法时，它将假设使用中八度，`-` 符号表示空或关闭音符——这里不会播放任何声音。\n\
