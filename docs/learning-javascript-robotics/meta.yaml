    # # Connecting NodeBots to the Web


    Bots are really cool on their own—collecting data, outputting that data using
    colors, text, and even images! We can only do so much when our bots only talk
    to themselves. However, because of the Node platform that we build NodeBots on,
    talking to web services and using Internet data in our projects is really simple.
    How so? Well, all you have to remember about NodeBots code is the following.'
  - '[PAGE 207]


    # # It''s just a Node Server!


    Implementing data retrieval and third-party APIs in our NodeBots is easy—especially
    when, thanks to npm, the modules that interface with all our favorite APIs are
    right at our fingertips.


    Anything that you can install on your computer from npm, you can use with your
    NodeBots. For instance, I have a wearable that pulls colors from tweets—I use
    Twitter and the color modules from npm to make this happen smoothly!


    For our first example, we''re going to build a relatively simple bot, hardware-wise.
    It''ll have a button and a temperature sensor. However, we''re going to connect
    this bot to the Internet and have it collect weather data and use Twilio to text
    us this data.'
  - '[PAGE 208]


    # Using Twilio


    In order to get started, you''ll have to follow the instructions at http://twilio.github.io/twilio-node/
    to get your own account, phone number, and API keys. Once you''ve done this, you''ll
    need to save the keys and phone number for use in our project code.'
