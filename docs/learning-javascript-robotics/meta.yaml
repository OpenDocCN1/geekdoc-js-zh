  - '[PAGE 216]


    # Tethering and Johnny-Five


    You may have noticed one limitation of our Arduino setup with Johnny-Five: we
    have to keep our microcontroller attached to our computer via USB and keep the
    Node running on the computer in order to keep Johnny-Five running. Luckily, this
    isn''t the case for all NodeBots on Johnny-Five. For instance, the BeagleBone
    Black runs Node on-board, and so, and, using beaglebone-s, you don''t need to
    tether. You just run the Johnny-Five code straight on the device. This is also
    true for raspi-io for Raspberry Pi and tessel-io for the Tessel 2.


    More and more devices will be added to Johnny-Five as time goes on, and tethering
    limitations will become less and less of an issue accordingly.'
  - '[PAGE 217]


    # Other JS libraries and platforms


    Johnny-Five is definitely an amazing library and one of the cornerstones of NodeBots.
    However, one of the great things about open source hardware and software is that
    there is a litany of choices for you to explore in the world of NodeBots. I''ll
    go into just a few of the many available, as new choices and projects are popping
    up every day!'
  - '[PAGE 218]


    # Espruino


    Espruino is an open source effort by Gordon Williams to create a microcontroller
    that runs JavaScript right on the board. There are currently two models available:
    the Espruino, which is the size of a credit card, and the Pico, which is nearly
    stamp-sized. Both interact via a USB connection.


    Note that the Espruino doesn''t use Node; it uses its own version of JavaScript
    that is in some places heavily modified. However, to most JavaScript developers,
    it will feel remarkably familiar.


    The Espruino uses a Chrome app to code and flash the board, and has a good amount
    of documentation. As the entire effort is open-source, users are welcome to contribute.
    You can find out more about the Espruino at www.espruino.com, and the boards are
    available for purchase on Adafruit.'
  - '[PAGE 219]


    # Tessel


    The Tessel project is another fully open sourced platform that has two versions.
    Tessel 1 ran a Node-like environment using a LUA interpreter under the hood, and
    Tessel 2 runs Linux with Node on top. Note that the Johnny-Five wrapper tessel-io
    only works for Tessel 2! However, both of these boards are very interesting and
    fairly easy to use without Johnny-Five, and are well-supported and documented
    by the Tessel steering committee.


    Tessel 2 was ready to be shipped soon at the time of writing this book, and you
    can check out its progress or pre-order/buy one tessel.io.'
- md: "\n## Cylon.js\n\nCylon.js is a library much like Johnny-Five, which also supports\
    \ many platforms. Its focus is also slightly broader. While Johnny-Five sticks\
    \ to making sure that microcontroller support is the main focus, Cylon supports\
    \ other serial peripherals. You can find out more about this open-source project\
    \ at [cylonjs.com].\n\n## JerryScript\n\nJerryScript is a brand new open-source\
    \ project from Samsung to get a JavaScript engine running in a small enough amount\
    \ of memory so that it can run on a microcontroller without Linux running underneath.\
    \ While this is a very new and ambitious project, if it succeeds, it can usher\
    \ in a whole new era of JavaScript robotics. You can learn more at https://samsung.github.io/jerryscript/.\n\
    \n## Tiny Linux computers\n\nWhile this is less of a concerted effort and more\
    \ of a category of devices, there are new, smaller, faster Linux machines coming\
    \ out every few months. From Raspberry Pi to Onion Omega, these machines that\
    \ carry their own GPIO are definitely an interesting segment of devices to explore.\
    \ Many have their own GPIO Node modules outside of Johnny-Five. BeagleBone Black\
    \ has BoneScript, for instance. Keep an eye out in the future for more of these\
    \ tiny computers, and definitely consider them for your standalone NodeBots projects.\n\
    \n## Vendor libraries\n\nMany IoT microcontrollers also come with JS libraries\
    \ to use. For instance, Particle has released an npm module to work with their\
    \ Core and Photon platforms over their cloud service using the Spark package.\
    \ (Note that, because of their company name change, this package name may change\
    \ when this book is published). Many vendors are moving to Node on their own terms,\
    \ so definitely look for an npm package when looking at new hardware platforms.\n\
    \n## Where to go from here\n\nAs we near the end of this book, I'll address the\
    \ questions that I get most often: Where do I go from here? What do I build? Who\
    \ do I ask for help?\n\nAs for to build, you can do as I do. I keep a small notebook\
    \ with me, although I also use my phone to record thoughts—I think about the small\
    \ things I'd like to have in day-to-day life. What problems can I solve? What\
    \ would look cool? I write down these problems or wants and go over them later.\
    \ Can I fix this with a NodeBot, I ask myself. If I can, awesome! I have my next\
    \ project. I think you'll find you have more ideas than you thought you did with\
    \ this method.\n\nOnce you've built something, write about it! The NodeBots community\
    \ loves to see how you built something. Don't worry if it's not the next terrain-navigating\
    \ hexapod; we'd like to see how you built your Internet-connected Christmas lights\
    \ or your automatic dog-feeder. You can never have too many examples for people\
    \ to look at, and one of the best ways to contribute back is documentation.\n\n\
    What if you get a new part working? Submit a pull request to Johnny-Five. The\
    \ team is very good about issuing fast and friendly feedback, and will work with\
    \ you to get your component into Johnny-Five. Also, come and say \"Hi\" in our\
    \ Gitter channel—we're super friendly and love to meet new users and NodeBotters.\n\
    \nThanks for taking this journey through JavaScript Robotics with me! I'm nodebotanist\
    \ on Twitter, GitHub, and just about anywhere—come and say \"HI\" and show me\
    \ what you've built!\n\n## Index\n\n### A\n\n- accelerometer\n    - building,\
    \ with I2C devices / Building with an I2C device – Accelerometer\n    - wiring\
    \ up / Wiring up our accelerometer\n    - example, coding / Coding up our example\n\
