  md: "# Writing the script\n\nThe script is a little more complicated than our last\
    \ few scripts; we need to create a Piezo element, which just requires a pin. However,\
    \ a piece of music is more complicated than turning an LED on and off. Luckily,\
    \ the Johnny-Five Piezo API has the play() method, which takes an object. This\
    \ object has attributes such as beats, tempo and song—we'll use these to play\
    \ your tune.\n\nThere are many ways to describe a song for the play() method.\
    \ One way—the way that we'll use here—is a string of notes, as follows:\n\nCDFDA-AAAAAGGGGG--CDDFG-GGGGFFFF--\n\
    \nWhen you use this method, it will assume the middle octave, and the - symbol\
    \ indicates null or off notes—nothing which will play here.\n\nFor beats, we will\
    \ use one-fourth time, and for tempo, we'll start with 100 bpm (beats per minute).\
    \ Your code will look like this:\n\n```\nvar five = require(\"johnny-five\"),\n\
    board = new five.Board();\n\nboard.on(\"ready\", function() {\n  var piezo = new\
    \ five.Piezo(3);\n\n  board.repl.inject({\n    piezo: piezo\n  });\n\n  piezo.play({\n\
    \    song: \"C D F A - A A A A G G G - C D F G - G G G F F F F -\",\n    beats:\
    \ 1 / 4,\n    tempo: 20\n  });\n});\n```\n\nSave it to a file called piezo.js\
    \ and run it in your terminal:\n\nnode piezo.js\n\nYou should hear a jaunty tune\
    \ come from your Arduino board!"
