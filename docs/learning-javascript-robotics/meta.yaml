    \n如果您在 www.PacktPub.com 拥有 Packt 账户，今天可以使用其访问 PacktLib 并查看 9 本完全免费的书籍。只需使用您的登录凭据即可立即访问。\n\
    \n## 前言\n\n你好！欢迎阅读 *Learning JavaScript Robotics*。在书中，你将学习如何使用 Johnny-Five 为 Arduino\
    \ 和其他机器人平台编写 JavaScript 代码。我们将涵盖 Johnny-Five 的基础知识、输入和输出设备，甚至是伺服和电机等移动设备。最后，我们将介绍如何将你的机器人连接到互联网，并在不同平台之间移动你的\
    \ Johnny-Five 代码。\n\n## 本书内容\n\n第 1 章 JS 机器人入门，将通过设置 Arduino Uno 和探索 NodeBots\
    \ 世界来带你入门。\n\n第 2 章使用 Johnny-Five 将涵盖 Johnny-Five 的基础知识，包括读取-评估-打印循环（REPL），我们将构建第一个项目。\n\
    \n第 3 章使用数字和 PWM 输出引脚将涵盖基础输出设备，使用数字引脚和 PWM 引脚。\n\n第 4 章使用特殊输出设备将涵盖使用一个或多个引脚的特殊输出。\n\
    \n第 5 章使用输入设备和传感器将涵盖使用模拟和 GPIO 引脚的输入设备。\n\n第 6 章移动你的机器人将涵盖使用 Johnny-Five 伺服和电机的基本用法。\n\
    \n第 7 章使用动画库进行高级移动将涵盖动画库以及如何为你的 NodeBots 创建高级移动方案。\n\n第 8 章高级组件——SPI、I2C 和其他设备将涵盖使用\
    \ Johnny-Five 使用 I2C、SPI 和其他高级组件。\n\n第 9 章将 NodeBots 连接到世界以及下一步去向将涵盖如何将你的 NodeBots\
    \ 连接到互联网，并在 Arduino以外的平台上使用 Johnny-Five 代码。\n\n## 本书所需的材料\n\n在开始学习之前，你需要准备以下要素：\n\
    \n- JavaScript 和 Node.JS 的基础知识\n- 一台支持 node-serialport 的 USB 接口的电脑，运行 Node.JS\
    \ 4.x\n- 一个 Arduino Uno 或其他 Johnny-Five 支持的板（参见 http://johnny-five.io/platform-support/）以及用于该板的\
    \ USB 线\n- 发光二极管（LED）——准备几十个可以让你完成所有示例并留有容错空间\n- 一个压电元件\n- 一个字符 LCD（带有 I2C 接口的即可）\n\
    - 一个兼容面包板的按按钮\n- 一个兼容面包板的旋转电位器\n- 光敏二极管\n- 一个基础温度传感器\n- 三个运行 5v 的业级伺服\n- 一个运行\
    \ 5v 的业级电机\n- 一个 ADXL3452C 加速度计\n- 来自 SparkFun 的 LED 矩阵套件——产品号 DEV-11861\n- 一个游戏手——RetroLink\
    \ N64 控制器或 DualShock3\n- （可选）一个 Particle Photon 微控制器\n\n## 读者\n\n如果你以前用过 Arduino，或者你是电子领域的新手并想尝试用\
    \ JavaScript 写 Sketch，那么这本书就是适合你的。具备 JavaScript 和 Node.js 的基础知识将帮助你充分利用本书的内容。\n\
    \n## 约定\n\n在书中，你会发现多种文本样式来区分不同类型的信息。以下是这些样式的示例及其含义。\n\n文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径、虚拟\
    \ URL、用户输入和 Twitter 账号显示如下：“例如，LED 对象具有 `on()` 和 `off()` 函数，可以控制 LED 的开启和关闭。”\n\
    \n代码块设置如下：\n\n```\nvar myPin = new five.Pin(11);\nmyPin.on('high', function(){\n\
    \  console.log('pin 11 set to high!');\n});\n```\n\n当我们让你注意代码块的特定部分时，相关的行或项目将加粗：\n\
    \n```\nvar myPin = new five.Pin(11);\nmyPin.on('high', function(){\n  console.log('pin\
    \ 11 set to high!');\n});\n```\n\n任何命令行输入或输出写法如下：\n\n> > node-repl.js\n\n**新术语**和**重要词汇**将加粗显示。你在屏幕上看到的单词（例如在菜单或对话框中），在文中显示如：“现在，我们将构建几个项目来演示如何使用更多传感器：一个**光敏电阻**和一个**温度**传感器。”\n\
    \n# 注意\n\n警告或重要注释将在此框中显示。\n\n# 提示\n\n技巧将如下所示显示。\n\n## 读者反馈\n\n我们欢迎读者的反馈。告诉我们你对这本书的看法——你喜欢或不喜欢的地方。读者反馈对我们非常重要，它可以帮助我们开发你真正受益的作品。\n\
