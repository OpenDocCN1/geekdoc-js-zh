  md: '# Writing keyframes


    Writing keyframes are at the core of the Animation API—the power of this API is
    its ability to tween between our keyframes. Each keyframe is an object, and you''ll
    pass your keyframes into your segment via an array. Remember: you''ll want to
    write a keyframe for each of your cue points.


    # The keyframe object


    As each keyframe is an object, we have access to a few properties that we can
    establish for each one:


    | Keyframe | Properties |

    |---|---|n| degrees | degrees is what the name implies; the degree you want the
    servo to be at when the keyframe is reached. It should be an integer value between
    0 and 180 inclusive. |

    | step | step is similar to degrees, but relative to the last keyframe; for instance,
    if degrees is set to 135 in the first keyframe and step is set to -45 in the next
    keyframe, the second keyframe will move the servo to 135-45 = 90 degrees. |

    | easing | When you create an animation segment, by default tweening is done at
    the speed for the entire span between two keyframes. The easing functions are
    applied to these frames to change the speed. This can make a motion loop like
    fluid or serve a practical purpose; easing can make quick movements in different
    directions easier on your servos and equipment.|


    There are several easing functions available via Johnny-Five''s use of the ease-component
    module; one very popular is inCirc, which causes the frames to move slowly at
    first, quickly increasing the middle, and slowing down again towards the end.
    See the Johnny-Five and ease-component docs for more examples of easing functions.


    | Keyframe | Properties |

    |---|---|n| copyDegrees | copyDegrees calculates the calculated or explicitly
    set value from the frame at the index. For, let''s say we have two keyframes:
    one has degrees set to 90, and the second has step set to 45. If we create a keyframe
    with copyDegrees set to 0, it will copy the first frame and set to 90. If we set
    the index to 1, it will copy the second frame and 90 + 45 = 135 will be the setting
    for the third keyframe. |

    | copyFrame | copyFrame is similar to copyDegrees, but it copies all the attributes
    of the frame instead of just the degrees; this includes easing functions and so
    on.|


    position is an advanced and new concept in Johnny-Five''s Animation API. This
    allows you to get three tuples representing a 3D coordinate in space, and it will
    move the array of servos to this point.


    It is worth noting that you need more than just Johnny-Five for this; you''ll
    need an IK (Inverse Kinematic) solver, such as Donovan Buck''s sharp project.
    Getting into the details of position is outside the scope of this book, but it
    is still actively developed and the functionality might change. However, if you''re
    looking to build a robot that moves with you, check this out.'
  merge: -1
  pgno: 159
- img_proc: true
  md: "# Keyframe shorthand\n\nYou can also define keyframes without objects; if you\
    \ pass your keyframes as an array of integer values, each integer value will be\
    \ interpreted as a step value. Consider the following array:\n\n```\nkeyFrames:\
    \ [0, 90, -45, 90, -90]\n```\n\nThis will (assuming a 0 start point) move the\
    \ servo to 0, 90, 45, 135, and 45 degrees for each cue point.\n\nYou can also\
    \ use non-integer values in shorthand syntax to mean specialized values:\n\n|\
    \ Values | Properties |\n|---|---|\n null | When null is passed into a shorthand\
    \ keyframes array, its value depends on its position. If it is the first keyframe,\
    \ the segment will use the existing servo position as its first frame. If it is\
    \ the last in array, it will copy the previous keyframe's value.\nHowever, if\
    \ it is used between two frames, something interesting happens: it will drop the\
    \ keyframe, and tweening will be calculated between the keyframe before and after\
    \ the null value. This can be handy if you like a servo to take more time between\
    \ two keyframes |\n false | false, used anywhere in a shorthandframe array, will\
    \ copy the last known value. It will not move the servo between the two keyframes\
    \ |\n\nSo, in closing, you can use either a keyframe object, a number, null, or\
    \ false to represent a keyframe in a segment definition. Now that we've explored\
    \ the attributes available on a keyframe object, let's write some keyframes to\
    \ match certain situations.\n\n# Examples of writing keyframes\n\nLet's explore\
    \ some examples of keyframes:\n\nExample 1: Write a set of keyframes that starts\
    \ a servo at the last position it was at, moves to it by 90 degrees with an inOutCirc\
    \ easing, then moves it by 45 degrees back with no easing:\n\n+   1. The first\
    \ keyframe can be handled using the null value:\n\nvar myFrames = [null];\n2.\
    \ The second requires a keyframe object because we want to establish an easing\
    \ function:\n\nvar myFrames = [null, { degrees: 90, easing: 'inOutCirc' }];\n\
    3. The last could be done with a keyframe object:\n\nvar myFrames = [null, { degrees:\
    \ 90, easing: 'inOutCirc' }, { step: -45 }];\n\nHowever, we can also use shorthand—remember\
    \ that passing a number as a keyframe will lead to"
  merge: -1
  pgno: 160
