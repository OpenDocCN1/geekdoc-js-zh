  mdcn: '


    ## 使用 TextBot


    现在，拿起你的手机并运行代码：


    ```

    node arduino-weatherbot.js

    ```


    一旦你按下按钮，稍等一会儿，你应该会在手机的收件箱中看到一条短信！


    ![](img/798b2390880773c3e3d0e21417ef58f8_211_0.png)


    来自我的 WeatherBot 的短信！


    我们现在已经将你的 NodeBots 连接到两个在线服务：weather-js 使用 Yahoo 气象数据和 Twilio！


    我们已经在 Arduino Uno 上做了很多工作，这非常棒了，但让我们聊聊迁移到其他微控制器，以及通过 Johnny-Five 实现这一点有多简单吧！


    ## Johnny-Five 与广阔的微控制器世界


    在本书的大部分中我们都在使用 Johnny-Five，但我们还没有真正触及它最好的功能之一！虽然 REPL 和 API 确实是强项，但它真正脱颖而出的是这一系列微控制器。


    要了解 Johnny-Five 支持的最新动态，请查看 johnny-five.io/platform-support——正如我们在前面的章节中所看到的，此页面包含了
    Johnny-Five 支持的所有平台，以及它们支持的组件类型。


    封装器（Wrappers），我们在本次构建中将用到，是将 Johnny-Five 的 Fermata 通信方法翻译到其他不一定使用 Fermata 的平台的代码片段。在我们的构建中，我们将使用
    Particle Photon，它使用一种名为 VoodooSpark 的固件。particle-io 封装器本质上教了 Johnny-Five 如何使用
    VoodooSpark 语言，这样我们就可以用现有的代码使用 Photon 了。


    让我们通过将我们的 Arduino Uno WeatherBot 迁移到 particle.io 上的 Particle Photon，来看看这有多简单吧。我们的
    Uno 和 Photon 之间确实存在一些差异：Photon 是一个 20 美元的连接了 Wi-Fi 的设备，并且带有 Particle 提供的云服务。


    一旦你收到 Photon，你将需要使用 particle-cli 创建账户并认领你的 Photon。将你的 Photon 插入 USB 端口，当状态灯闪烁蓝光时，安装
    CLI - 使用 npm 并运行设置：


    ```

    npm install -g particle-cli

    particle setup

    ```


    一旦运行了设置，你还需要访问令牌（access token）和设备 ID（device ID）。要获取设备 ID，请运行以下命令：


    ```

    particle list

    ```


    然后，复制你刚刚设置的 Photon 的十六进制标识符。要获取访问令牌，请运行以下命令：


    ```

    particle token list

    ```


    接下来，复制任何未过期令牌的十六进制值。


    最后，我们需要用 VoodooSpark 刷写我们的 Photon，这种固件就像 Uno 上的 Fermata 一样，允许我们的 Johnny-Five 代码与
    Photon 通信。你可以通过两种方式实现：一种遵循 https://github.com/voodootikod/voodoospark 上的说明，另一种是使用新的命令行工具
    voodoospark-installer。要使用新的 CLI，请如下方式安装：


    ```bash

    npm install -g voodoospark-installer

    ```


    然后运行以下命令：


    ```

    voodoospark

    ```


    这会要求你输入 Particle 用户名和密码，然后给你一个 Photon 列表供选择。选择你的新 Photon，按下 *Enter*，它就会在那个 Photon
    上安装 VoodooSpark。


    ## 将我们的 WeatherBot 迁移到 Particle Photon


    首先，让我们看看这个机器人的硬件设置。它与 Arduino Uno 的构建非常相似，但引脚稍有不同：


    ![](img/798b2390880773c3e3d0e21417ef58f8_214_0.png)


    WeatherBot Photon 原图


    接下来，我们需要进入项目文件夹并安装 particle-io。particle-io 模块是一个 Johnny-Five 封装模块——它告诉 Johnny-Five
    如何与 Photon 通信，因为这与 Arduino 通信略不同。


    ```bash

    npm install particle-io

    ```


    现在，我们需要将封装器添加到我们的代码中。我建议你将原始代码复制到名为 `photon-weatherbot.js` 的新文件中：


    ```javascript

    var five = require(''johnny-five'');

    // our particle-io wrapper

    var Particle = require(''particle-io'');

    ```


    '
