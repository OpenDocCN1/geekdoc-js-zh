    # # Building the WeatherBot


    First, let''s wire up the WeatherBot, as shown in the following diagram:


    ![](img/798b2390880773c3e3d0e21417ef58f8_209_0.png)


    The Arduino WeatherBot schematic


    Once you''ve wired it all together and got your Twilio API keys and phone number,
    it''s time to start coding.


    Let''s take a look at the steps that we need to take:


    +   1. We need to establish our weather and Twilio services, create our board,
    and start the board.

    2. When, when the board is ready, we need to create a temperature sensor and a
    button object.

    3. When the temperature sensor updates, we need to update a variable with the
    current indoor temperature.

    4. When the button is pressed, we need to get the outside weather data, and combining
    with this'
  - "[PAGE 210]\n\nour indoor weather data, we have to send a text message using our\
    \ Twilio client.\n\nSo we'll need the following in a file called arduino-weatherbot.js:\n\
    \n```\nvar five = require('johnny-five');\n// we'll use weather-js for the weather\n\
    var weather = require('weather-js');\n// and Twilio so we send our text message\n\
    var twilio = require('twilio') (YOUR_ACCOUNT_SID, YOUR_AUTH_TOKEN)\n\nvar board\
    \ = new five.Board();\n\nboard.on('ready', function() {\n  var button = new five.Button(2);\n\
    \  var temp = new five.Temperature({\n    pin: 'A0',\n    controller: 'TMP36'\
    \ // Make sure you use the controller proper for your\n    sensor!\n  });\n\n\
    \  var currentTemp = undefined; // we'll stash the temp sensor data here\n\nbutton.on('press',\
    \ function() {\n    console.log('Inside: ' + currentTemp + ' degrees F');\n  \
    \  weather.find({ search: 'Austin, TX', degreeType: 'F' }, function(err, data)\
    \ {\n      console.log('Outside: ' + data[0].current.temperature + ' degrees F');\n\
    \      twilio.sendMessage({\n        to: YOUR_PHONE_NUMBER,\n        from: YOUR_TWILIO_NUMBER,\n\
    \        body: 'Inside: ' + currentTemp + ' degrees F \\n Outside: ' \n      \
    \  + data[0].current.temperature + ' degrees F'\n      }, function(err, responseData)\
    \ {\n        if (err) {\n          console.log('Success!');\n        } else {\n\
    \          console.log(err); // we need to catch any Twilio errors\n        }\n\
    \      });\n    });\n  });\n\ntemp.on('change', function(err, data) {\n    currentTemp\
    \ = data.F; //stash the temp data when it changes;\n  });\n});\n```\n\nOnce you've\
    \ got all this, keep in mind what you need to change: YOUR_ACCOUNT_SID and YOUR_AUTH_TOKEN\
    \ needs to be replaced with the keys you received from the Twilio API, YOUR_PHONE_NUMBER\
    \ needs to be replaced with a number you can text, and YOUR_TWILIO_NUMBER needs\
    \ to be replaced with the number you received from Twilio. Finally, you should\
    \ change Austin, to location for more accurate data:"
- md: "\n## Using the TextBot\n\nNow, grab your cell phone and run the code:\n\n```\n\
    node arduino-weatherbot.js\n```\n\nOnce you've pressed the button, wait a bit,\
    \ and you should see a text message in your phone's inbox!\n\n![](img/798b2390880773c3e3d0e21417ef58f8_211_0.png)\n\
    \nThe text message from my WeatherBot!\n\nWe've now connected your NodeBots to\
    \ two online services: weather-js uses Yahoo weather and Twilio!\n\nWe've done\
    \ a lot with our Arduino Uno, and it's been great, but let's talk about moving\
    \ on to other microcontrollers and how easy this can be with Johnny-Five!\n\n\
    ## Johnny-Five and the wide world of microcontrollers\n\nWe've been using Johnny-Five\
    \ for the majority of this book, but we haven't really touched on one of its best\
    \ features! While the REPL and the API are definitely strong points, what really\
    \ stands out about it is this wide array of microcontrollers.\n\nTo be up to date\
    \ with what Johnny-Five supports, check out johnny-five.io/platform-support—this\
    \ page, as we saw in the earlier chapters, contains all the platforms that Johnny-Five\
    \ supports, and also what types of component they support.\n\nWrappers, we'll\
    \ use in this build, are pieces of code that translate Johnny-Five's Fermata method\
    \ of communicating to other platforms that don't necessarily use Fermata. In our\
    \ build, for instance, we'll be using a Particle Photon, which uses a firmware\
    \ called VoodooSpark. The particle-io wrapper essentially teaches Johnny-Five\
    \ how to speak VoodooSpark, so we can use the Photon with our existing code.\n\
    \nLet's check how easy it is to move by moving our Arduino Uno WeatherBot to the\
    \ Particle Photon, which is available at particle.io. There are definitely some\
    \ differences between our Uno and the Photon: the Photon is a $20, Wi-Fi-connected\
    \ device, and it comes with cloud services provided by Particle.\n\nOnce you've\
    \ received your Photon, you will have to use particle-cl to create an account\
    \ and claim your Photon. Do this by plugging your Photon into a USB port, and\
    \ while the status light flashes blue, install the CLI - using npm and run the\
    \ setup:\n\n```\nnpm install -g particle-cli\nparticle setup\n```\n\nOnce you've\
    \ run the setup, you'll need your access token and device ID. To get the device\
    \ ID, run the following:\n\n```\nparticle list\n```\n\nThen, copy the hex identifier\
    \ for the Photon you just set up. To get your access token, run the following:\n\
    \n```\nparticle token list\n```\n\nNext, copy the hex value for any nonexpired\
    \ token.\n\nFinally, we need to flash our Photon with VoodooSpark, a firmware\
    \ that, like Fermata on the Uno, allows our Johnny-Five code to communicate with\
    \ our Photon. You can go about this in two ways: one is to follow the instructions\
    \ at https://github.com/voodootikod/voodoospark, and the other is to use the new\
    \ command-line tool, voodoospark-installer. To use the new CLI, install it as\
    \ follows:\n\n```\nnpm install -g voodoospark-installer\n```\n\nThen, run the\
    \ following:\n\n```\nvoodoospark\n```\n\nThis will ask for your Particle username\
    \ and password, and then give you a list of Photons to pick from. Select your\
    \ new Photon, hit *Enter*, and it will install VoodooSpark on that Photon.\n\n\
    ## Moving our WeatherBot to the Particle Photon\n\nFirst, let's look at the hardware\
    \ setup for this bot. It's very similar to the Arduino Uno build, but the pins\
    \ are a bit different:\n\n![](img/798b2390880773c3e3d0e21417ef58f8_214_0.png)\n\
    \nA WeatherBot Photon schematic\n\nNext, we'll need to enter our project folder\
    \ and install particle-io. The particle-io module is a Johnny-Five wrapper module—it\
    \ tells Johnny-Five how to communicate with the Photon, because it is slightly\
    \ different to communicating with the Arduino.\n\n```bash\nnpm install particle-io\n\
    ```\n\nNow, we need to add the wrapper to our code. I suggest that you copy your\
    \ original code to a new file called `photon-weatherbot.js`:\n\n```javascript\n\
