  - "[PAGE 47]\n\n# Objects, functions, and events\n\nJohnny-Five programs work using\
    \ an event-based structure, and there are three concepts to keep in mind: objects,\
    \ functions, and events.\n\nObjects to programmatically represent our physical\
    \ electronic components and are usually constructed using the `new` keyword. A\
    \ few examples of objects in Johnny-Five include the `five` object, which represents\
    \ the Johnny-Five library, the `Board` object, which represents our microcontroller;\
    \ and the LED object, which will programmatically represent our LED:\n\n```\n\
    var led = new five.Led(11);\n```\n\nFunctions are available for the objects we\
    \ create and usually represent the actions that our robots can do. For instance,\
    \ the LED object has an `on()` and `off()` function that turns the LED on and\
    \ off:\n\n```\nled.on();\nled.off();\nled.blink();\nled.stop();\n```\n\nEvents\
    \ are fired on objects and represent represent observable points in our program.\
    \ For example, the `Board` object fires a `ready` event when the board is ready\
    \ to receive instructions from a Johnny-Five program.\n\nWe can also set events\
    \ on a pin to track events on our LED:\n\n```\nvar myPin = new five.Pin(11);\n\
    myPin.on('high', function() {\n  console.log('pin 11 set to high!');\n});\n```\n\
    \nWe will use all three of these concepts in Johnny-Five program we write, so\
    \ it's good to normalize our vocabulary early!"
  - "[PAGE 48]\n\n# Going over our blink-LED script\n\nIn the previous chapter, we\
    \ wrote a small script to blink an on-board LED on and off. Let's take a look\
    \ at this code in detail and outline the objects, functions, and events we have\
    \ used:\n\n```\nvar five = require(\"johnny-five\");\n```\n\nThe preceding line\
    \ just pulls johnny-five into our program so that we can use it.\n\n```\nvar board\
    \ = new five.Board();\n```\n\nThe preceding line constructs our board object.\
    \ Note that, without parameters, Johnny-Five assumes you are using an Arduino\
    \ and guesses the serial port for you.\n\n```\nboard.on(\"ready\", function()\
    \ {\n  var led = new five.Led(13);\n  led.blink(500);\n});\n```\n\nHere, we set\
    \ up a listener on our Board object for the ready event. When the board is ready,\
    \ the handler instantiates an Led object at pin 13 and makes the LED blink by\
    \ calling the blink function on that object.\n\nThis will be the basic format\
    \ for most Johnny-Five functions: create a Board object, create a listener and\
    \ handler for the ready event, and then, within the ready event handler, create\
    \ component objects and call functions through them. We can also add listeners\
    \ and handlers to the component objects—we'll talk about this in the next few\
    \ chapters."
  - '[PAGE 49]


    # Understanding events in Johnny-Five


    The events in Johnny-Five are a very important concept—this is also a new concept,
    especially if you are used to low-level language programming. It''s very similar
    to the idea of interrupts, but definitely strays away from the traditional robotics
    programming paradigm of an event loop. While you can create timers and loops in
    Johnny-Five, it highly encourages an event-based programming approach, which can
    need some practice.'
- md: "\n# Why events?\n\nA question that gets asked a lot is, \"Why event-based?\
    \ Why not loop-based and interrupt-based as in previous methods?\"\n\nA lot of\
    \ this has to do with the way robots work and the way we think about robot programs.\
    \ When you think about what you want a robot to do, you're less likely to think\
    \ \"Every X seconds, I want to check for A and start task B...\" and you are more\
    \ likely to think \"When Y happens, I want to start event C...\"\n\nThe event-based\
    \ system in Johnny-Five works really well with this train of thought by allowing\
    \ users to place listeners and handlers in the events instead of polling for the\
    \ correct conditions every X seconds. It makes robotics programming a little easier\
    \ to grasp for those who are new to robotics programming.\n\nGrasping events is\
    \ very important to understanding Johnny-Five—this is because every Johnny-Five\
    \ script begins by instantiating a Board object and waiting for it to fire a ready\
    \ event. This is the equivalent of the DOM ready event in browser-based JavaScript\
    \ applications—it tells you that you're ready to start sending instructions.\n\
    \n# Wiring up an external LED\n\nFor our first hardware project, we're going to\
    \ wire an LED to the Arduino. An LED, or a Light Emitting Diode, is a component\
    \ that lights up when electric current is passed through it. They come in many\
    \ colors and sizes and are one of the most easy-to-use and versatile components\
    \ in hobbyist robotics.\n\n## Setting up the hardware\n\nFirst, take an LED. We'll\
    \ determine the positive and negative leads of the LED—for this component, it's\
    \ straightforward: the positive lead is longer than the negative lead.\n\n![](img/798b2390880773c3e3d0e21417ef58f8_52_0.png)\n\
    \nDetermining the positive and negative ends of an LED\n\nTo wire the LED to an\
    \ Arduino, place the positive lead on pin 11 and the negative lead on the pin\
    \ marked GND, just like in the following diagram:\n\n![](img/798b2390880773c3e3d0e21417ef58f8_52_1.png)\n\
    \nWiring up our LED\n\nYou can also use a breadboard if you wish to—it will look\
    \ like the following:\n\n![](img/798b2390880773c3e3d0e21417ef58f8_53_0.png)\n\n\
    # Wiring an LED with a breadboard\n\nNow that we've wired up the LED, we're going\
    \ to make it blink as we did in the last chapter. The script looks very familiar:\n\
    \n```\nvar five = require(\"johnny-five\");\n\nvar board = new five.Board();\n\
    \nboard.on(\"ready\", function() {\n  var led = new five.Led(11);\n  led.blink(500);\n\
    });\n```\n\nThis is because it's nearly the same script as in the previous chapter—we\
    \ just changed the pin number to reflect the new LED we have installed.\n\nSave\
    \ and run the script. You should see a blinking LED on your board, as shown in\
    \ the following screenshot:\n\n[TODO: Add Photo]\n\nWhen you run the script, you'll\
    \ notice a prompt—you can even type into it! This is the REPL, and we're going\
    \ to use it to play with our LED in real time!\n\n## Using the Read-Eval-Print-Loop\
    \ (REPL)\n\nThe Read, Eval, Print Loop, or REPL, is a concept relative to many\
    \ scripting languages, but it is new to libraries, and definitely new to robotics.\
    \ Think about how you alter the state in a typical Arduino program: you modify\
    \ the source code, re-load it onto the board, and wait for it to run.\n\nHowever,\
    \ due to the way Johnny-Five works, we can modify the state of our robot code\
    \ *while the code is running*. This is because we use Firmata—the board is just\
    \ a thin client that reacts to instructions from our node program, so if we let\
    \ our Node programs send different instructions, we can change how our robot works\
    \ in real time.\n\nThe way to do this in a Johnny-Five program is by injecting\
    \ components into the REPL, which allows us to use them.\n\n# Making components\
    \ available to the REPL\n\nWe're going to modify our script from the previous\
    \ section in order to emulate our LED. To do this, we're going to use the `this.repl.inject()`\
    \ function. The `this` keyword, when used within our `board.on('ready')` handler,\
    \ is a reference to the global context, so we can access the REPL for the program\
    \ we are working on with `this.repl`. The `inject` method accepts an object; the\
    \ keys of object will represent the names you can access from the REPL, and the\
    \ values will be the components you wish to access.\n\nSo, we're going to pass\
    \ the following object to the `inject` method. It will allow us to access our\
    \ LED component by the `myLed` name:\n\n```\n{\n  myLed: led\n}\n```\n\nOur new\
    \ program looks like this:\n\n```\nvar five = require(\"johnny-five\");\n\nvar\
    \ board = new five.Board();\n\nboard.on(\"ready\", function() {\n  var led = new\
    \ five.Led(11)\n\n  this.repl.inject({\n    myLed: led\n  });\n\n  led.blink(500);\n\
    });\n```\n\nOur new program looks like this: it will allow us to access our LED\
    \ component by the `myLed` name:\n\n```\nvar five = require(\"johnny-five\");\n\
    \nvar board = new five.Board();\n\nboard.on(\"ready\", function() {\n  var led\
