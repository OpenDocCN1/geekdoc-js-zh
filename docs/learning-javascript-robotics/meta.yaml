  md: '# About the Author


    Kassandra Perch is an open web developer and supporter. She began as a frontend
    developer and moved to server-side with the advent of Node.js and was especially
    enthralled by the advance of the NodeBots community. She travels the world speaking
    at conferences about NodeBots and the fantastic community around them. When she''s
    not building bots, she''s knitting, sewing, sculpting, or playing video games
    with her cats.


    I''d like to thank my mentor—as I''ve said in the past, I don''t know where I''d
    be without you, but I certainly know my life is better with you in it. My parents
    supported me as a child who took things apart, and their support lets me continue
    to do so, as well as build things of my own.


    The NodeBots community deserves a huge thank you: your sense of wonder and joy
    in learning new things keeps me going. Special thanks to Rick and Raquel for getting
    me started.'
  merge: -1
