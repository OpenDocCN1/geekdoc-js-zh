  md: '# Learning the terminology


    There are two parts that make up any servo animation in Johnny-Five: a target
    and one or more segments. The target is either a servo or an array of servos.
    We''ll go into the programmatic differences between a servo and a servo array
    in our first project; the basic point is that a ServoArray object in Johnny-Five
    allows a logical grouping and the manipulation of multiple servos—a leg, for instance,
    would be a logical use of a ServoArray object.


    A segment is the programmatic description of a piece of animation. It is comprised
    of a few pieces of information: a duration, cue points, and keyframes.


    A keyframe is a description of the position of the target at a given point. A
    keyframe has no concept of time; it is an instantaneous description of state.
    Keyframes are combined with cue points in a segment to add the concept of time.


    Cue points are the points at which each keyframe is placed in a segment. This
    is not a discrete point in time; cue points are described relative to the segment,
    usually as a decimal between 0 and 1 where 0 is the beginning of the segment and
    1 is the end.


    The duration outlines exactly how long the segment will take. The rest of the
    information uses the duration to calculate the speeds necessary to make it between
    keyframes at the cue points given. Duration adds the concept of discrete time
    to a segment.


    In order to better understand how these work together, let''s walk through a segment
    description: we have a segment with a duration of 2000 ms (2 seconds). It has
    cue points at 0, .75, and 1. There are two servos in our target: keyframe 1 has
    servo 1 at 0 degrees, and servo 2 at 90 degrees. Keyframe 2 has servo 1 at 45
    degrees, and servo 2 at 135 degrees. Keyframe 3 has servo 1 at 90 degrees, and
    servo 2 at 180 degrees. So in all, we have a servo starting at 0 degrees and moving
    to 90 degrees over 2 seconds, and a second servo moving from 90 to 180 degrees
    in that same 2 seconds.


    A graphical representation of this can be seen in the following figure:


    ![](img/798b2390880773c3e3d0e21417ef58f8_151_0.png)'
