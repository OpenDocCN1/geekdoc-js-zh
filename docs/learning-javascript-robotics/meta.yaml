- md: "## Special concerns when using motors and servos\n\nProjects that use servos\
    \ and motors have some special considerations for them that are mostly focused\
    \ around power and the fact that Johnny-Five projects are tethered to the computer\
    \ running the Johnny-Five code.\n\n## Power concerns\n\nServos and motors draw\
    \ a lot of power. This can be an issue when you are using several of them. If\
    \ you are using 5V servos and motors and more than two or three at a time, you\
    \ should use an external power supply for your Arduino to draw this extra current\
    \ without affecting performance. These power supplies are usually plugged in to\
    \ an external outlet, and look like the following figure.\n\n## Note\n\n### WARNING!\n\
    \nBefore plugging any external power supply into your board, make sure that the\
    \ board you are using is voltage regulated for the voltage of the power supply;\
    \ for an Arduino Uno, this is 12V. When in doubt, use a 5V power supply for Arduinos.\
    \ Also, follow proper safety protocols when dealing with outside power sources.\
    \ SparkFun has a great guide at https://learn.sparkfun.com/tutorials/how-to-power-a-project.\n\
    \nIf you are using servos or motors that require more than 5V, you will need to\
    \ supply power externally to your motors or servos. This is outside the scope\
    \ of this book.\n\n## Tethering and cables\n\nJohnny-Five usage means that the\
    \ code running on the board is receiving messages from the host computer. If this\
    \ connection is lost, the project cannot run. This means that for most Johnny-Five\
    \ projects, you will need to maintain a USB cable connection. So if you're going\
    \ to make a project that involves motion, you'll want a long USB cable.\n\nThere\
    \ are options for wireless NodeBots using Johnny-Five described in Chapter 9,\
    \ Connecting NodeBots to the World, and Where to Go Next.\n\n## Wiring up servos\
    \ and motors\n\nWiring up servos will look similar to wiring up sensors, except\
    \ the signal maps to an output. Wiring up a motor is similar to wiring up an LED.\n\
    \n## Wiring up servos\n\nTo wire up a servo, you'll have to use a setup similar\
    \ to the following figure:\n\n![](img/798b2390880773c3e3d0e21417ef58f8_136_0.png)\n\
    \nA servo wiring diagram\n\n### Tip\n\n- The wire colors may vary for your servo.\
    \ If your wires are red, brown, and orange, red is 5V, brown is **GND**, and orange\
    \ is signal. In doubt, check the data sheet that came with your servo.\n\n- After\
    \ wiring up the servo, plug the board in and listen to your servo. If you hear\
    \ a clicking noise, quickly unplug the board—this means your servo is trying to\
    \ place itself in a position it cannot reach. Usually, there is a small screw\
    \ at the bottom of most servos that you can use to calibrate it. Use a small screwdriver\
    \ to rotate this until it stops clicking when the power is turned on.\n\n- This\
