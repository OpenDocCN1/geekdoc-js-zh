    ![](img/798b2390880773c3e3d0e21417ef58f8_68_0.png)


    The wiring for our multiple LEDs project


    Note that the LEDs are wired to pins 2, 4, 6, and 9—two on Digital pins and two
    on PWM pins. We will perform an experiment to check whether they are Digital or
    PWM pins.'
