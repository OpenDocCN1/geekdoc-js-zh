    # 第 1 章 开启 JS 机器人


    欢迎来到 JavaScript 机器人的世界！让我们来探索使用 Arduino 和 Johnny-Five 使用 JavaScript 编写机器人程序是多么简单。


    在本章中，我们将完成以下工作：


    - 探索 JS 机器人、NodeBots 和 Johnny-Five

    - 设置我们的开发环境

    - 闪烁板载 LED 灯


    # 理解 JS 机器人、NodeBots 和 Johnny-Five


    JavaScript 作为一种机器人语言，真正始于几年前由 Chris Williams 编写的 own NPM 模块 `node-serialport`
    的创建。该模块允许 Node.JS 通过串口连接与设备通信；这包括来自旧电脑的典型串口连接，或者我们每天使用的 USB 和蓝牙连接。但是，NodeBot 到底是什么？我们该如何开始使用
    Johnny-Five 它们？


    # 什么是 NodeBot 以及其他基础词汇


    NodeBot 是任何使用 JavaScript 和/或 Node.JS 控制的硬件设备。这可以涵盖各种项目；创建 NodeBot 有成百种方法。在本书中，我们将使用
    Johnny-Five 库，这是一个由 Rick Waldron 创建的开源项目。


    # 注意事项


    对于机器人学领域的新读者来说，微控制器是一个包含处理器、内存和输入/输出引脚的小型计算机。它作为我们项目的大脑——我们的程序将与此微控制器通信或加载到微控制器上。微控制器有许多形状和大小，并具有多种功能。


    我们将在项目中使用微控制器。你应该使用哪种微控制器？幸运的是，我们使用 Johnny-Five 意味着我们可以从大量不同的微控制器中选择，并且仍然编写与你在书中看到的相同的代码！


    Johnny-Five 到底是什么？它是如何让我们的生活变得更简单的？


    # Johnny-Five (http://johnny-five.io) 是一个用于 Node.JS 的开源机器人库。它由 Rick Waldron 创建，拥有一个活跃的贡献者和支持者社区。在编写本书时使用的
    Node.JS 4.x 版本中，该模块已知可以在 Windows、Mac 和 Linux 计算机上无问题地运行。


    Johnny-Five 构建在 `node-serialport` 之上，允许我们编写通过不同连接类型与不同微控制器通信的 JavaScript 应用。对于某些较新的板卡（例如兼容
    Arduino 的板卡），Johnny-Five 使用串口连接。Johnny-Five 在互联网服务上仿真这种串口连接！


    Johnny-Five 使用多种板类型的能力是通过其封装器系统（wrapper system）实现的。一旦安装了核心系统，你就可以为你特定的微控制器安装一个封装器，而
    API 将保持不变。这是一个强大的概念——你可以为一个平台编写代码，并快速将其移动到另一个平台，而无需进行更改。


    # 我们将在本书中使用的内容


    对于书中的示例，我们将使用 Arduino Uno。你可以从 Adafruit (www.adafruit.com)、SparkFun (www.sparkfun.com)
    等网站获取这些板卡。你也可以使用与 Arduino Uno 兼容的板卡。例如，SainSmart 销售的类 Uno 板卡对我们的目的也可以良好工作。对于本章，你需要板卡本身以及一根
    USB 线。


    在随后的章节中，我们将使用其他组件——每章都会有一个表格，列出项目内所需的材料列表。


    # 设置你的开发环境


    现在我们已经涵盖了基本概念，我们将为第一个项目设置开发环境。在编写本书时，此处使用的所有软件均可在 Windows、Mac 和 Linux 桌面电脑上运行。


    # 安装 Node.JS


    如果你没有安装 Node.JS，可以从 nodejs.org 下载适用于你平台的安装程序。该安装程序还将安装 NPM（Node 包管理器），它将用于管理其他软件。


    在你的机器上运行安装程序，这可能需要重启。之后，打开终端并运行以下命令：


    ```bash

    node --version

    ```


    输出应该是 4.x，其中 x 是数字。


    # 设置项目并安装 Johnny-Five


    在终端中，为项目创建一个文件夹并进入该目录：


    ```bash

    mkdir my-robotics-project

    cd my-robotics-project

    ```


    接下来，我们将安装 Johnny-Five：


    ```bash

    npm install johnny-five

    ```


    你应该看到一个加载图标，随后是输出。如果没有看到错误消息，你就可以使用 Johnny-Five 了。


    # 注意事项


    在 Mac 机器上，你可能需要安装 Xcode 开发者工具。


    # 连接微控制器并安装 Firmata


    首先，你仍然在使用 JavaScript。是的；然而，我们必须确保板卡上运行了特定的 sketch（即 Arduino 程序），以便 Johnny-Five
    能够正常通信。


    你可以在 Arduino 网站获取安装程序（http://www.arduino.com/en/Main/Software）。本书假设你拥有 1.6.4 版本，但
    1.4 范围的版本也可以工作。


    下载软件后，打开它。然后，我们将确保你的串口连接正常。


    # 注意事项


    如果你使用的是 Arduino 的板卡，则此步骤不是必要的。然而，可能会其他步骤。这些步骤将在你板卡的封装插件中概述。


    将 USB 线分别插入板卡和电脑。板卡上的一些 LED 将亮起——这是正常的。然后，进入 Arduino IDE 的工具（Tools）菜单并悬停在端口（Ports）子菜单上。你应该看到一个类似于下方的端口列表。


    ![](img/798b2390880773c3e3d0e21417ef58f8_37_0.png)


    你应该在列表中看到至少一个符合以下格式的项目：/dev/cu.usbmodem****。它旁边可能或没有 Arduino Uno。如果你看到了这个，请点击它，因为这就是你用于安装
    Firmata 的端口。如果你有这个，意味着你的板卡可以与电脑通信，你已经准备好安装 Firmata 了。


    要在板卡上安装 Firmata，转文件（File） | 示例（Examples） | Firmata | StandardFirmata，如下截图所示：


