    \ optional parameter allows you to address each one specifically. We\nwon't be\
    \ using this here because we only have one device.\n\n| Methods | Properties |\n\
    | --- | --- |\n| .on([index]) | This turns on all the matrices if no index is\
    \ passed. It turns off the device at an index if an index value is passed. |\n\
    | .off([index]) | This turns off the matrices if no index is passed, and the one\
    \ at an index if it is passed. Note that when a matrix is turned off, it still\
    \ retains data that will be shown when the matrix is turned back on—this can be\
    \ used as a power saver for battery-run projects! |\n| .clear([index]) | This\
    \ clears all matrices if no index is passed, and clears the matrix at an index\
    \ if one is passed. This clears out the data and turns all LEDs in the matrix\
    \ off. |\n| .brightness([index], brightness) | If no index is passed, this sets\
    \ all matrices to the brightness (0-100). If an index is passed, this sets the\
    \ matrix at that index to the passed brightness level. |\n| .led(index, row, col,\
    \ state) | If no index is passed, this sets all at the point (row, col) to state\
    \ (1 for ON, 0 for OFF). If an index is passed, this sets only the LED on that\
    \ matrix.\n\nThere are also functions to draw multiple LEDs at once, but we'll\
    \ need to talk about how we pass drawing data to the LED matrix first.\n\n# Formatting\
