    Johnny-Five. What we''ll use is an LED matrix. This is a matrix of several single-,
    dual-, or tri-color LEDs that are controlled as a group.


    You can really see the benefit of SPI here—controlling each of these LEDs with
    a pin would would require 64 pins for a single-color matrix! For dual- and tri-color,
