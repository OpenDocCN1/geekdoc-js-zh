    ## 本章所需的物品


    你将需要微控制器、一根 USB 线和电脑。你还需要一个 ADXL345I2C 加速度计（例如 Adafruit Industries 产品 ID 1231
    或 SparkFun 产品 SEN-09836），以及一个来自 SparkFun 的 LED 矩阵组件——产品编号 DEV-11861。你还需要来自[第 4
    章，使用特殊输出设备] 的 LCD 显示器。最后，你还需要一个 USB 游戏手——我推荐亚马逊上售价约 15 美元的 N64RetroLink 控制器，但如果你有一个备用的
    PS3-DualShock 3 控制器，我也会包含相应的说明。


    ## 为什么我们需要 I2C 和 SPI 协议？


    这一切开始变得非常复杂了，对吧？为什么要费劲呢？我们有数字引脚和模拟引脚；读取这些引脚的值不足够吗？


    当你离开 LED 的领域时就不够了。考虑一下你正在页面上（或很可能是屏幕！）阅读的文本包含了多少信息。字节和字节的信息。这对于你在 Johnny-Five
    应用中使用的许多外设都是如此。


    例如，我们将使用的加速度计——如果没有 I2C 协议，它将使用三个模拟引脚。这占据了 Arduino Uno 上大部分的模拟引脚，而且许多平台根本没有模拟引脚！更不用说我们在第
    4 章《使用特殊输出设备》中使用的 LCD 了。如果没有 I2C，我们必须正确地连接 11 个不同的引脚，其中 6 个是离散的数据引脚。


    数据发送和接收的复杂性也是一个问题。有些传感器回的数据不符合 0-1024 的模拟范围。有些输出设备（如 LCD 屏幕）则需要字节级的信息。这些设备需要这些协议来有效地通信并接收它们需要的数据。


    I2C 和 SPI 协议允许我们为小型项目开启一个全新的数据维度——我们可以用更少的引脚使用更多的设备。


    首先，我们将看一眼 SPI 协议——这种协议允许我们以比以前设置简单得的方式发送大量数据。


    ## 探索 SPI（串行外设接口）设备


    **串行外设接口 (SPI)** 是一种用于 Johnny-Five 中以及通用机器人领域中某些设备的协议。它的出现是为了应对典型的串行连接（你现在在爱好者机器人中并不常见），这种连接在本质上是异步的。这导致了大量的开销，因此
    SPI 被开发为一种确保数据以高效方式发送和接收的方法。


    ### **提示**


    请记住，当我们在此背景下谈论同步/异步时，我们*不是*在像在 JavaScript 中那样谈论它。你仍然可以围绕 SPI 方法编写异步 JavaScript
    函数！


    ## SPI 是如何工作的


    在典型的串行连接中，你有一根用于发送数据的引线 (TX) 和一根用于接收数据的引线 (RX)，这使得通信变得困难。接收端如何知道发送端发送字节有多快，以及何时完成？这种对同步时间的缺失就是我们在此语境下所说的“异步”——发送和接收设备只是按照自己的意愿快速地发送字节，假设接收端知道如何读取这些数据。


    让我们来看看 SPI 的的一些特性：


    - SPI 使用单独的引脚来建立统一的时间时钟，以同步接收端和发送端。这个数据时钟在每发送一个位（bit）时会在高电平和低电之间翻转——告诉接收端正在读取一条新信息。


    - SPI 还将通信拆分为 MOSI（主出从入）和 MISO（主入从出）。我将使用它们的缩写，但在我们的目的中将使用微控制器和设备来指代，在此背景下它们工作得很好。


    - MOSI 引脚是从微控制器发送数据到设备的线路——对于我们的目的，它是输出。MISO 是设备将数据发送到微控制器的线路——非常适合传感器和其他输入需求。注意，如果设备没有理由向微控制器传回数据（例如我们的
    LED 矩阵），它可能会省略 MOSI 引脚和 MISO 引脚，或者将其标记为“data”。


    - 最后，SPI 设备使用 CS 或 SS 引脚（片选选择或从设备选择），它用于一个微控制器使用多个设备的设置。通过在高电平和低电之间翻转，让微控制器告诉设备它正在发送数据。翻转你正在读取或写入的设备的
    CS 引脚，其他设备将忽略该数据。


    总结一下，你平均需要四个引脚——一个用于同步时钟（通常标记为 SCLK），一个用于微控制器将数据发送到设备，一个用于设备将数据发送到微控制器，以及一个用于片选。


    ![](img/798b2390880773ce3d0e21417ef58f8_179_0.png)


    SPI 详解——图片来源：https://en.wikipedia.org/wiki/Serial_Peripheral_Interface_Bus


    ### 提示


    注意，在许多单 SPI 设备的设置中，接线图将显示 CS 引脚连接到 5V。这是没问题的——你只是将 CS 永久设置为高电平，告诉设备始终在监听或发送数据。


    ## Johnny-Five 如何处理 SPI


    幸运的是，我们不需要自己处理时序——Johnny-Five 在许多平台上都支持 SPI，最著名的是 Arduino 微控制器。`shiftOut(dataPin,
    clockPin, data)` 方法将字节移位到设备。


    因此考虑到我们所知的，Johnny-Five 执行了以下操作：


    1. 将时钟、数据和 CS 引脚设置为输出模式。

    2. 向设备发送启动信号。

    3. 等待数据发送。

    4. 将 CS 引脚设置为低电平，表示正在发送数据。

    5. 写入数据和时钟。

    6. 将 CS 引脚设回高电平以表示我们已完成。


    ## SPI 的优点与缺点


    SPI 的优点主要在于速度和易用性方面；从 SPI 设备读写数据要容易得多，因为不需要额外的位或模式来告知数据的开始和结束。


    缺点涉及所需引脚的数量；虽然串行连接只需要两根，但 SPI 需要四根，其中只有一根可以被设备共享。


    ## 使用 SPI 设备构建——LED 矩阵


    在我们的第一个项目中，我们将配合 Arduino 和 Johnny-Five 使用 SPI 设备。我们将使用一个 LED 矩阵。这是一个由多个单色、双色或三色
    LED 组成的矩阵，作为一个整体进行控制。


    在这里你可以真正看到 SPI 的优势——如果用引脚控制每个 LED，单色矩阵就需要 64 根引脚！对于双色和三色，将是 128 根和 192 根！SPI 通过允许基于两个引脚进行控制，在这里确实提供了助力。


    ### 构建


    获取你的 LED 矩阵并进行连接！如果你有不同的 LED 矩阵，这里是引脚对应关系：引脚 2 连接到 DIN 或 DATA，引脚 3 连接到 SCLK、CLK
    或 clock，引脚 4 连接到 CS，如下图所示：


    ![](img/798b2390880773ce3d0e21417ef58f8_184_0.png)


    LED 矩阵接线图


    注意图中的物品有一个额外的引脚——忽略它！你的应该只有五个引脚，并且在你获得的任何套件中引脚都应该有清晰标记。


    ## API


    Johnny-Five 中的 LED 矩阵 API 为我们提供了许多操作这个输出设备的方法。在进入我们的之前，让我们通过下表查看构造函数和一些方法：


