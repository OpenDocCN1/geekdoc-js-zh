    As we know the first keyframe will set the servo to 0, we can use step instead
    of degrees. For the next step, we want the servo to take two cue points to move
    to 180. We could calculate how to do this with standard keyframes, or we could
    use a shorthand null to tell the segment to skip that cue point and tween between
    90 and 180 over two cue points:


    ```

    var myFrames = [{degrees: 0}, 90, null, {degrees: 180}]

    ```


    Now you''ve learned how to write keyframe arrays and objects, let''s take a look
    at writing the rest of our Animation object.'
