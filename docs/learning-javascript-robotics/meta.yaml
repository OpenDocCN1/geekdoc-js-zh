  md: "# # Coding our dimmer switch\n\nAs we write code, you'll notice that there\
    \ is no potentiometer object in Johnny-Five. That's fine. As the potentiometer\
    \ is a very basic sensor, we'll be using the Sensor object instead.\n\nNext, let's\
    \ take a look at the events that we'll be using. The change event fires when the\
    \ input from the potentiometer changes, so we'll use this event to trigger our\
    \ LED change. In order to get the reading, we'll use this.value, as explained\
    \ in the documentation.\n\nNow, let's think about how LEDs work and the input\
    \ from the potentiometer. The LED can be set from 0 to 255, and the potentiometer\
    \ can take an input from 0 to 1023. We can do that to scale these outputs, but\
    \ luckily, Johnny-Five has a function to help us out. This is called the scale(min,\
    \ max) function. It will scale our input to the number that we give it; in case,\
    \ 0 and 255. We will use this.value to reference the scaled value. If you want\
    \ to see the unscaled value in the event handler, you can use this.raw.\n\nWe\
    \ can use the scale function before the event listener call to scale our potentiometer's\
    \ output to our LED can understand.\n\nWith this in mind, we can write the code\
    \ for our dimmer switch. Go ahead and place the following code in dimmer-switch.js:\n\
    \n```\nvar five = require('johnny-five');\n\nvar board = new five.Board();\n\n\
    board.on('ready', function() {\n  var pot = new five.Sensor('A0');\n  var led\
    \ = new five.Led(11);\n\npot.scale(0, 255).on('change', function () {\n  console.log('The\
    \ scaled potentiometer value is: ' + this.value);\n  console.log('The raw potentiometer\
    \ value is: ' + this.raw);\n  led.brightness(this.value);\n});\n});\n```\n\nStart\
    \ the script using the following:\n\n+   > node dimmer-switch.js\n\nTry this by\
    \ twisting the potentiometer. Data should log in to your terminal as follows:"
