- img_proc: true
  md: '# Multiple pins with several LEDs


    For the next project, we''re going to look at the Led object API and test several
    different methods. It is one of the benefits of Johnny-Five—abstraction. If you
    can understand the concept of an LED, you can use the Johnny-Five LED object without
    thinking about the underlying pins or timings. Let''s go over the methods that
    we''ll use for our project:


    +   - on() and off(): These turn an LED on and off. Under abstraction, this sets
    the pin that is wired to the LED to HIGH and LOW. We''ll be using these in the
    REPL.

    - blink(time): This turns an LED on and off at a given interval. strobe() and
    blink() are aliases of each other and do the same thing.

    - pulse(time): This will cause an LED to pulse on and off in an eased manner.
    This requires an LED wired to a PWM pin. The time argument sets the length of
    each side of the pulse—500 will mean the LED fade in for 500 ms and fade out for
    500 ms, meaning a 1-second pulse.

    - fade(brightness, ms): This will cause LED to fade on or off from its current
    brightness to the given brightness over ms milliseconds.

    - stop(): This stops any recurring action happening on an LED. Note that this
    won''t necessarily turn off the LED. It this means the LED is on, so be it. It
    will stop the action in its tracks—


    Remember that most Johnny-Five object functions are chainable—you can use one
    right after the other.


    ```

    myLed.stop().off()

    ```


    The preceding code will stop any recurring event on the LED and turn it off.


    Now that we know functions we''ll be working with, let''s wire up our next project.'
  merge: -1
