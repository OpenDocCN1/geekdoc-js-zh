  md: '# Motor and servo shields


    A shield is an Arduino term for a board that is placed on top of an Arduino, usually
    an Uno, to give some extra capability. Shields can be used to add Wi-Fi, LED matrices,
    and so on. A very common shield type is the shield for motors and servos. Johnny-Five
    supports a few shields for motor use. Again, if you wish to use a a lot of motors
    or high-powered motors, check out the documentation at www.johnny-five.io to see
    whether a motor shield is right for your project.


    ![](img/798b2390880773c3e3d0e21417ef58f8_131_0.png)


    An example of a motor shield'
