    ```

    lcd.clear();

    lcd.useChar(''clock'');

    lcd.print(":clock");

    ```


    This will clear the LCD and print a clock character. The .useChar function pulls
    the character with this name out of the definitions that Johnny-Five provides
    and sends the commands to the LCD to load it into memory. When we run the .print
    function, the ":" delimiters tell the function that we want to use a special character.'
