- img_proc: true
  md: '# Do I use a servo or a motor?


    This is a fantastic question: if you want movement, which one do you use? A servo
    or a motor? The rule of thumb is, if you want precise movement, you''ll need a
    servo; while servos can be configured to move in certain angles, motors go on
    and off with the speed setting varied by the amount of power sent to it—not a
    discrete unit such as degrees/second.


    Many of you will think that if you want a full 360 degree range of motors, you''re
    limited to using motors. This isn''t always the case; continuous servos combine
    the precise nature of servos with a full range of motion offered by a motor.'
  merge: -1
