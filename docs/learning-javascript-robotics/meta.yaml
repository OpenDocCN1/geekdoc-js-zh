    ## 第 5 章：使用输入设备和传感器


    我们已经处理了输出，但让机器人真正变得有趣的是利用输入来生成输出！在本章中，我们将介绍基础输入设备（如按钮）和环境传感器（如检测环境光的光传感器）。我们将讨论
    Johnny-Five 如何利用事件（events）让这些设备变得易于使用，并构建一些项目。在完成本章后，你将拥有处理大多数输入/输出项目所所需的所有知识。


    本章将涵盖以下主题：


    - 模拟输入引脚是如何运作的

    - Johnny-Five 的传感器事件

    - 使用基础输入设备——按钮和电位器

    - 使用传感器——光传感器和温度传感器

    - 其他类型的传感器及其用途


    ## # 本章所需的材料


    对于本章中的项目，你需要你的开发板、一根 USB 数据线以及一些输入设备和传感器。


    首先，你需要一个按钮。你可以在大多数初学者套件中找到很多按钮，也可以单独购买。我们将考虑一种四脚设计的按钮，如下方的截图所示：


    ![](img/798b2390880773c3e3d0e21417ef58f8_99_0.png)


    > *用于机器人项目的常用轻按按钮*


    不过，二脚的设计也可以的——四脚按钮仍然代表按钮的两个面，所以你可以用二脚设计来复制这些。


    你还需要一个旋转电位器——这些是你通过旋转来设置数值的旋钮，类似于扬声器上的音量旋钮。你需要一个适用于面包板且具有三脚设计的电位器，如下方的截图所示：


    ![](img/798b2390880773c3e3d0e21417ef58f8_99_1.png)


    ### 小贴


    请注意，你可能会接触滑动电位器（看起来像滑动开关或类似于调光开关的）或其他电位器。它们都可以正常工作，但请访问 www.johnny-five.io 网站查看更多关于接线的详细信息。


    对于输入，首先你需要一个通常称为光敏电阻（photocell）的光传感器。通常，它们看起来像顶部带有波浪形设计的棕色二极管，如下方的截图所示：


    ![](img/798b2390880773c3e3d0e21417ef58f8_100_0.png)


    光传感器二极管


    光传感器也有扩展板（breakout boards），但对于本章，让我们坚持使用二极管类型。在 Adafruit 和 SparkFun 上很容易找到它们。


    为了完善我们的传感器，你需要一个温度传感器。它们看起来像小小的半圆柱体，底部有三个金属脚。我推荐 TMP36，它的背面写有 TMP 字样，如下方的截图所示：


    ![](img/798b2390880773c3e3d0e21417ef58f8_100_1.png)


    温度传感器


    你也可以使用 LM35 并相同的接线——这个传感器看起来和 TMP36 一一样，只是背面写的是 LM35。如果你使用不同的温度传感器，在继续之前，请务必检查
    johnny-five.io 文档 http://johnny-five.io/api/temperature 以查看该传感器是否被支持。


    你还需要一个面包板、一些面包板跳线、一个 LED 和几个 10k 欧姆电阻。


    电阻器降低发送到我们传感器的电流以确保读数准确，有时也用于保护输出设备。为了确保你的电阻是 10k 欧姆，我们将使用电阻上的色环。你的电阻应该有棕色、黑色和橙色色环。这些之后可能还有另一个色环——该环的颜色对我们来说并不重要。电阻看起来如下：


    ![](img/798b2390880773c3e3d0e21417ef58f8_101_0.png)


    10k 欧姆电阻


    ## 模拟输入引脚是如何运作的


    输入是优秀机器人公式的第一部分；那些知道天气、能看出移动有多快或能看到物体所在位置的机器人。引脚让这一切成为可能，因此在本节中，我们将讨论它们是如何工作的以及我们将如何利用它们。


    模拟输入引脚通过从传感器读取电压水平并将电压水平转换为 0 到 1023 之间的整数值来工作。输入设备制造商通常会为设备提供一个比例尺，告诉我们如何将此整数值转换为真实值；例如，我们将使用温度传感器将值转换为我们人类可以理解的温度。


    我们将通过插入人类输入设备和环境传感器，并映射它们提供的输入来利用这些引脚。这样，我们就可以开始开发使用输入生成输出的项目。


    ## Johnny-Five 传感器事件


    正如前面的章节所讨论，Johnny-Five 的许多功能依赖于事件（events）。输入和传感器也不例外——在大多数时候，你通过等待事件来与这些设备交互。虽然大多数输入设备都有在任何时刻读取数据的方法，但这些主要用于调试，在编写项目代码时，你需要良好掌握你的输入设备或传感器可用的事件。


    大多数输入设备和传感器都有数据事件（data event）；这告诉程序何时从设备读取了数据。这像是一个“消防水管”：它的报告速度非常快，可能会让人应不从心。这通常用于调试，因为大多数机器人程序感兴趣的是传感器或输入数据何时变化，而不是何时有新输入待读取。


    变化事件（change event）在大多数设备上也可用，这是一个非常常用的事件——它只在输入数据发生变化时触发。


    ## 使用基础输入——按钮和电位器


    正如前面讨论的，Johnny-Five 的很多功能依赖于事件。


    ## 连线按钮和 LED


    首先，我们要连接一个按钮并编写一些代码来测试它是否被按下。


    ## 编写 button-led.js


    现在让我们看看 Johnny-Five 中的 Button 对象，看看我们的代码需要什么。


    '
