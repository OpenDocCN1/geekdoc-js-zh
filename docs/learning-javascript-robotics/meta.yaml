    Now''s the time to play with the REPL—for instance, try the following command
    line:


    `matrix.draw(check2);`


    And watch it change! You can also clear the matrix with the following command
    line:


    `matrix.clear() `


    Draw a predefined character with the following command line:


    `matrix.draw(''J'');`


    After clearing again, try the `.led` and `.row` functions as follows:


    `matrix.clear();`

    `matrix.led(3, 3, 1)`

    `matrix.row(1, 0xA1);`


    You now have a good grasp of the LED matrix and using SPI devices with Johnny-Five!
    We''ve discussed the ups and downs of SPI communications and covered a little
    about why serial connections remain and create a lot of overhead. Now, we''re
    going to take a look at I2C—a protocol designed to gather many of the benefits
    of SPI and serial and join them together.'
