    ```\n\n我们将在第 2 章“使用 Johnny-Five”中详细介绍此脚本的功能，但基本概述如下：我们在 Johnny-Five 模块中引入此脚本，并使用它创建一个新的板对象。当该板准备绪时，我们将在引脚\
    \ 13 处创建一个 LED 对象（该引脚连接到 Arduino Uno 板上的板载 LED）。然后我们让该 LED 每半秒闪烁一次。\n\n# 运行脚本\n\
