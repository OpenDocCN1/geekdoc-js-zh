  mdcn: "\n- `.play()` 播放动画，从第一个尚未运行的片段开始。如果动画被暂停，它将继续执行正在进行中的最后一个片段。\n\n- `.pause()`\
    \ 停止动画，但保留任何正在进行片段的进度，并保持片段队列。\n\n- `.stop()` 清空片段队列并停止所有动画。\n\n- `.next()` 清除当前片段并移动到下一个片段。然而，动画不会在每个片段完成后自动调用此方法，用户通常也也不会调用它。\n\
    \n- `.speed([speed])` 可用于查看（当不传递参数时）或设置（当传递代表倍率的数字时）当前动画的速度。\n\n现在我们已经了解了动画的一般工作原理，让我们用三个舵机构建自己的项目吧。让我们动起来吧！\n\
    \n## 项目 – 让我们的舵机数组动起来\n\n你应该还拥有上一个项目中的舵机数组。让它动起来吧！我们将使用 REPL 实时修改我们的动画片段，并发挥 Animation\
    \ API 的真正威力。\n\n让我们从初始化板、设置舵机数组、创建动画和片段，并将它们插入 REPL 的代码开始。将以下内容放入 `animation-project.js`\
    \ 中：\n\n```javascript\nvar five = require('johnny-five')\n\nvar board = new five.Board()\n\
    \nboard.on('ready', function(){\n  var servos = new five.Servos([3, 5, 6])\n \
    \ var animation = new five.Animation(servos)\n\n  var mySegment = {\n    easing:\
    \ 'inOutCirc',\n    duration: 3000,\n    cuePoints: [0, .25, .75, 1],\n    keyFrames:\
    \ [\n      [[degrees: 45], 45, 45, -45],\n      [[degrees: 30], 30, 30, 30],\n\
    \      [[degrees: 20}, 40, 40, 40]\n    ]\n  }\n\n  this.repl.inject({\n    animation,\n\
    \    mySegment\n  })\n\n  animation.enqueue(mySegment)\n})\n```\n\n使用以下命令运行此代码：\n\
    \n```\nnode animation-project.js\n```\n\n你的舵机将活跃起来并开始运行该片段（我们在最后一行将其排入队列了！）。一旦运行完成，让我们在循环中再次查看。在\
    \ REPL 中，输入以下内容：\n\n- >mySegment.loop = true\n- >animation.enqueue(mySegment)\n\
    \n片段应该开始循环运行。想让它变慢一点吗？让我们使用 Animation 对象的 `speed()` 函数更改速度：\n\n- >animation.speed(.5)\n\
    \n这应该会让速度减慢一半。现在让我们停止动画并清空队列：\n\n```\n>animation.stop()\n```\n\n让我们看看当我们使用缓动函数让片段具有节拍（metronomic）并运行它会发生什么：\n\
    \n```\n>mySegment.easing = 'inOutCirc'\n>mySegment.metronomic = true\n>animation.enqueue(mySegment)\n\
    ```\n\n片段现在会正向和反向循环运行，看起来更加流畅！\n\n这很酷，但如果我们想让动画一个接一个地运行呢？我们可以使用一系列的持续时间和定时器，也可以利用\
    \ Johnny-Five 的事件系统，该系统扩展了 Animation API。接下来，我们将探索如何利用这些事件来创建定时动画。\n\n## 动画事件\n\
    \n许多动作需要等待一个片段完成后再开始另一个。某些片段还应该在特定时间触发。处理这些计时和通信系统的最佳方法是使用 Johnny-Five 的 `animation`\
    \ 事件。\n\n我们通过在片段的特殊属性上分配回调函数来接入这些事件。让我们查看每个事件的细节，以及它们何时触发。\n\n| 事件 | 细节 |\n|---|--|\n\
    | onstart | 当片段在动画中开始播放时，触发 `onstart` 回调。 |\n| onstop | 仅当片段在队列中或正在运行，但通过 `animation.stop()`\
    \ 停止动画时，调用 `onstop` 回调。 |\n| onpause | 仅当片段在队列中或在通过 `animation.pause()` 传递的动画运行时，调用\
    \ `onpause` 回调。 |\n| oncomplete | 仅当片段在动画中运行完成后，才会触发 `oncomplete` 回调。注意：这**不适用于**循环片段。请参见\
    \ `onloop` 回调。 |\n| onloop | 当函数循环执行时调用 `onloop` 回调，即在第二次运行开始以及此后的每次开始运行时调用。 |\n\
    \n为了理解事件是如何工作的以及它们的用途，让我们开始最后一个项目：从第 4 章 *使用专用输出设备* 中获取你的 LCD，以及本章之前的舵机数组，让我们开始构建吧。\n\
    \n## 构建带有信息性 LCD 显示的舵机数组\n\n使用以下图表构建你的项目；第一张图用于 I2C LCD 显示器：\n\n![](img/798b2390880773c3e3d0e21417ef58f8_170_0.png)\n\
    \n事件项目接线图—I2C LCD\n\n第二张图用于标准 LCD 显示器：\n\n![](img/798b2390880773c3e3d0e21417ef58f8_171_0.png)\n\
    \n事件项目接线图—标准 LCD\n\n连接完成后，你的代码应该是这样的：\n\n```javascript\nvar five = require('johnny-five')\n\
    \nvar board = new five.Board()\n\nboard.on('ready', function(){\n  var servos\
    \ = new five.Servos([3, 5, 6])\n  var animation = new five.Animation(servos)\n\
    \n  var mySegment = {\n    easing: 'inOutCirc',\n    duration: 3000,\n    cuePoints:\
    \ [0, .25, .75, 1],\n    keyFrames: [\n      [[degrees: 45], 45, 45, -45],\n \
    \     [[degrees: 30], 30, 30, 30],\n      [[degrees: 20}, 40, 40, 40]\n    ],\n\
    \    onstart: function() {\n      console.log('Segment started!')\n    },\n  \
    \  onpause: function() {\n      console.log('Segment paused!')\n    },\n    onstop:\
    \ function() {\n      console.log('Segment stopped!')\n    },\n    onloop: function()\
    \ {\n      console.log('Segment looped!')\n    },\n    oncomplete: function()\
    \ {\n      console.log('Segment completed!')\n    }\n  }\n\n  this.repl.inject({\n\
    \    animation,\n    mySegment\n  })\n\n  animation.enqueue(mySegment)\n})\n```\n"
