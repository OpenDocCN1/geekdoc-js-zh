    \ functions in the following table:\n\n| Functions | Properties |\n| --- | ---\
    \ |\n| .row([index], row, value); | If an index is not passed, this sets the LEDs\
    \ in a row to value—where the value is an 8-bit or 16-bit value (0-255 in decimal).\
    \ If an index is passed, this only sets the row at device's index. |\n| .column([index],\
    \ col, value); | If an index is not passed, this sets the LEDs in a col to value—where\
    \ the value is an 8-bit or 16-bit value (0-255 in decimal). If an index is passed,\
    \ this only sets the row at device's index. |\n| .draw([index], character); |\
    \ This draws a character on the device at an index, if passed. If no index is\
    \ passed, this renders the character on all LEDs. |\n\nSo, .row() and .column()\
    \ work with one hexadecimal value—.row(0, 0xFF) sets the first row of LEDs to\
    \ ON for all matrices.\n\n.draw can accept a few things as valid input. We have\
    \ shown many of these in previous examples: Strings of binary characters and hexadecimal\
    \ values, both in an array of rows. But luckily, the library already has several\
    \ characters implemented for us. The predefined characters for LED matrices in\
    \ Johnny-Five as follows:\n\n- 0123456789...\n- !#$%&'()*+,-./:<=>?@\n- ABCDEFGHIJKLMNOPABCDEFGHIJKLMNOPQRSTUVWXYZ[\\\
    ]^^_`\n- abcdefghijklmnopqrstuvwxyz{|}~\n\nYou can pass in a string containing\
    \ one of these characters as your value, as shown here:\n\n```\nmyMatrix.draw('~');\n\
    myMatrix.draw('A');\n```\n\nThis allows us much more easily to show text and numerical\
    \ output on our LED matrix.\n\nNow that we've explored the API, let's write some\
    \ code that loads a character that we define, then injects our matrix and another\
    \ character that we define into the REPL so we can play with it live!\n\n# The\
    \ Code\n\nPlace the following into led-matrix.js:\n\n```\nvar five = require(\"\
    johnny-five\");\nvar board = new five.Board();\n\nboard.on(\"ready\", function()\
    \ {\n  // our first defined character using string\n  var checkerboard1 = [\n\
    \    \"01010101\",\n    \"10101010\",\n    \"01010101\",\n    \"10101010\",\n\
    \    \"01010101\",\n    \"10101010\",\n    \"01010101\",\n    \"10101010\"\n \
    \ ];\n\n  // our second defined character using hex values\n  var checkerboard2\
    \ = [0xAA, 0x55, 0xAA, 0x55, 0xAA, 0x55, 0xAA, 0x55];\n\n  var matrix = new five.LedMatrix({\n\
    \    pins: {\n      data: 2,\n      clock: 3,\n      cs: 4\n    }\n  });\n\n \
    \ matrix.draw(checkerboard1); // draw our first character\n\n  board.repl.inject({\n\
    \    matrix: matrix,\n    check1: checkerboard1,\n    check2: checkerboard2\n\
    \  });\n});\n```\n\nOnce you've got the code in, run it with:\n\n```\nnode led-matrix.js\n\
    ```\n\nIn a few seconds, your LED matrix should light up with a checkerboard pattern\
    \ like the following:\n\n![](img/798b2390880773c3e3d0e21417ef58f8_188_0.png)\n\
    \nNow's the time to play with the REPL—for instance, try the following line:\n\
    \n`matrix.draw(checkerboard2);`\n\nAnd watch it change! You can also clear the\
    \ matrix with the following line:\n\n`matrix.clear()`\n\nDraw a predefined character\
    \ with the following line:\n\n`matrix.draw('J');`\n\nAfter clearing again, try\
    \ the `.led` and `.row` functions as follows:\n\n`matrix.clear();`\n`matrix.led(3,\
    \ 3, 1)`\n`matrix.row(1, 0xA1);`\n\nYou now have a good grasp of the LED matrix\
    \ and using SPI devices with Johnny-Five! We've discussed the ups and downs of\
    \ SPI communications and covered a little about why serial connections create\
    \ a lot of overhead. Now we're going to take a look at I2C—a protocol designed\
    \ to gather many of the benefits of SPI and serial and join them together.\n\n\
    # Exploring I2C devices\n\nWe touched on I2C devices back in Chapter 4, Using\
    \ Output Devices—you may have used an I2C LCD to display some data. You may have\
    \ noticed that the I2C LCD was much easier to wire up, and had the same API as\
    \ the non-I2C LCD. Luckily, this is because Johnny-Five strives to give every\
    \ component a similar API regardless of its implementation or protocol. But how\
    \ does I2C work, and what makes it a useful protocol?\n\n# I2C works\n\nI2C, which\
    \ stands for Inter-Integrated Circuit, is a protocol that input and output components\
    \ can use to communicate with microcontrollers. It's very standardized, and nearly\
    \ all I2C devices operate in the same way. I2C also has the major benefit of being\
    \ recognized and implemented by many microcontroller manufacturers—including Arduino.\
    \ Any Arduino platform that is compatible with Johnny-Five is also compatible\
    \ with I2C devices.\n\nHowever, implementing an I2C device in Johnny-Five can\
    \ be a tricky proposition. To understand why, we need a better understanding of\
    \ how I2C works.\n\nI2C has the good parts of SPI combined with the good parts\
    \ of serial communications. It only uses two pins for data and clock, but has\
    \ a synchronous clock that can be set by the system!\n\n# Pins used by I2C\n\n\
    I2C uses two pins outside of any power requirements: SDA, which is a data line,\
    \ and SCL, which is a clock line. These two pins form an information bus, which\
    \ can be used by many devices at once.\n\nThis is where it sounds a lot like SPI;\
    \ the two pins drive each other. When sending an instruction, the SCL pin is flipped,\
    \ telling us that another bit of data is ready, while simultaneously flipping\
    \ the SDA bit to the value of the bit being sent. This allows the programmer and\
    \ microcontroller to dynamically control the clock—this allows accurate data transmission\
    \ and very few bit errors. However, it can be difficult to implement this behavior\
    \ ourselves.\n\nEach time data is sent to I2C, an address is sent as the first\
    \ byte. This address refers to the device on which our microcontroller is.\n\n\
    Luckily, we don't have to implement this behavior ourselves—Johnny-Five and the\
    \ underlying Firmata system have implemented this for us. However, you will need\
    \ to understand how to write and read from these devices—otherwise, you'll be\
    \ stuck with a device that won't even boot up!\n\n# How I2C devices send and receive\
    \ data\n\nEvery I2C device has an address, which is usually shown in hexadecimal\
    \ format. For instance, the address of the accelerometer we'll be using in this\
    \ chapter is 0x53 (the 0x, for those unfamiliar with hexadecimal, indicates that\
    \ the number is in hexadecimal format). This is useful when the I2C bus for a\
    \ microcontroller is controlling multiple devices—the address tells the devices\
    \ on the bus which device we are writing to or reading from. An example of address\
    \ used follows:\n\nData is sent by writing to and reading registers on the I2C\
    \ device. Every time we want to write or read from an I2C device, we need to send\
    \ the address (so the bus know which device you are addressing to) and the register\
    \ we want to read or write. If we are writing data, we also need to send the bit\
    \ we wish to\n\n![](img/798b2390880773c3e3d0e21417ef58f8_190_0.png)\n"
  mdcn: "\n\n# 提示\n\n注意在 API 中，许多这些函数接受一个可选的索引——这是因为你可以将 LED 矩阵串联起来，这个可选参数允许你专门地寻址每一个矩阵。我们在这里不会使用它，因为我们只有一个设备。\n\
    \n| 方法 | 属性 |\n| --- | --- |\n| .on([index]) | 如果不传递索引，则打开所有矩阵。如果传递了索引值，则关闭该索引处的设备。\
    \ |\n| .off([index]) | 如果不传递索引，则关闭所有矩阵；如果传递了索引，则关闭该索引处的矩阵。注意，当矩阵被关闭时，它仍然保留数据，当矩阵重新打开时会显示出来——这可以作为电池供电项目的省电功能！\
    \ |\n| .clear([index]) | 如果不传递索引，则清除所有矩阵；如果传递了索引，则清除该索引处的矩阵。这会清除数据并关闭矩阵中的所有 LED。\
    \ |\n| .brightness([index], brightness) | 如果不传递索引，则将所有矩阵设置为亮度（0-100）。如果传递了索引，则将该索引处的矩阵设置为传递的亮度级别。\
    \ |\n| .led(index, row, col, state) | 如果不传递索引，则将点 (row, col) 处设置为状态（1 为开启，0 为关闭）。如果传递了索引，则仅设置该矩阵上的\
    \ LED。 |\n\n还有一些可以同时绘制多个 LED 的函数，但我们需要先讨论如何将绘制数据传递给 LED 矩阵。\n\n# 为 LED 矩阵格式化数据\n\
    \n如前面的 .led 函数所示，1 将 LED 设置为开启，0 将其设置为关闭。这看起来很多二进制数据，对吧？那是因为它们确实是二进制的，这就是我们向 LED\
    \ 矩阵发送所有数据的方式——一系列二进制位。\n\n例如，你可以向 8x8 的 LED 矩阵发送图像，用一个行数组表示，行由包含行中每个 LED 二进制值的字符串组成：\n\
    \n```\nvar checkerboard = [\n  \"01010101\",\n  \"10101010\",\n  \"01010101\"\
    ,\n  \"10101010\",\n  \"01010101\",\n  \"10101010\",\n  \"01010101\",\n  \"10101010\"\
    \n];\n```\n\n这可能会变得难以处理。你也可以用十六进制值发送相同的数据，每个数字包含两个数字；我们的第一行二进制是 01010101，翻译为 0x55，第二行二进制是\
    \ 10101010，翻译为 0xAA：\n\n```\nvar checkerboardHex = [0x55, 0xAA, 0x55, 0xAA, 0x55,\
    \ 0xAA, 0x55, 0xAA];\n```\n\n在我们讨论下一组函数（我称之为绘制函数）时，请记住这一点。\n\n# 绘制函数\n\n让我们在下表中探索一些绘制函数：\n\
    \n| 函数 | 属性 |\n| --- | --- |\n| .row([index], row, value); | | 如果不传递索引，则将一行的 LED\
    \ 设置为值——value 是一个 8 位或 16 位的值（十进制 0-255）。如果传递了索引，则仅设置设备索引处的行。 |\n| .column([index],\
    \ col, value); | 如果不传递索引，则将一列的 LED 设置为值——value 是一个 8 位或 16 位的值（十进制 0-255）。如果传递了索引，则仅设置设备索引处的行。\
    \ |\n| .draw([index], character); | 如果传递了索引，则在索引处的设备上绘制字符。如果不传递索引，则在所有 LED 上渲染该字符。\
    \ |\n\n因此，.row() 和 .column() 使用一个十六进制值工作——.row(0, 0xFF) 将所有矩阵的第一行 LED 设置为开启。\n\
    \n.draw 可以接受几种内容作为有效输入。我们在之前的示例中展示了其中许多内容：包含二进制字符的字符串和十六进制值，它们都位于一个行数组中。但幸运的是，该库已经为我们实现了几个字符。Johnny-Five\
    \ 中 LED 矩阵的预定义字符如下：\n\n- 0123456789...\n- !#$%&'()*+,-./:<=>?@\n- ABCDEFGHIJKLMNOPABCDEFGHIJKLMNOPQRSTUVWXYZ[\\\
    ]^^_`\n- abcdefghijklmnopqrstuvwxyz{|}~\n\n你可以传递一个包含其中一个字符的字符串作为你的值，如下：\n\n```\n\
    myMatrix.draw('~');\nmyMatrix.draw('A');\n```\n\n这让我们能够更容易地在 LED 矩阵上显示文本和数字输出。\n\
    \n现在我们已经探索了 API，让我们写一些代码，加载我们定义的字符，然后将我们的矩阵和另一个定义的字符注入 REPL 中，这样我们就可以实时操作它了！\n\
    \n# 代码\n\n将以下内容放入 led-matrix.js：\n\n```\nvar five = require(\"johnny-five\");\n\
    var board = new five.Board();\n\nboard.on(\"ready\", function() {\n  // 我们使用字符串定义的第一个字符\n\
    \  var checkerboard1 = [\n    \"01010101\",\n    \"10101010\",\n    \"01010101\"\
    ,\n    \"10101010\",\n    \"01010101\",\n    \"10101010\",\n    \"01010101\",\n\
    \    \"10101010\"\n  ];\n\n  // 使用十六进制值定义的第二个字符\n  var checkerboard2 = [0xAA,\
    \ 0x55, 0xAA, 0x55, 0xAA, 0x55, 0xAA, 0x55];\n\n  var matrix = new five.LedMatrix({\n\
    \    pins: {\n      data: 2,\n      clock: 3,\n      cs: 4\n    }\n  });\n\n \
    \ matrix.draw(checkerboard1); // 绘制第一个字符\n\n  board.repl.inject({\n    matrix:\
    \ matrix,\n    check1: checkerboard1,\n    check2: checkerboard2\n  });\n});\n\
    ```\n\n一旦输入了代码，运行它：\n\n```\nnode led-matrix.js\n```\n\n几秒钟后，你的 LED 矩阵应该像下面这样显示棋盘格图案：\n\
    \n![](img/798b2390880773c3e3d0e21417ef58f8_180.png)现在是时候用 REPL 操作了——例如尝试以下行：\n\
    \n`matrix.draw(checkerboard2);`\n\n并观察它的变化！你也可以用以下行清除矩阵：\n\n`matrix.clear()`\n\
    \n使用以下行绘制预定义字符：\n\n`matrix.draw('J');`\n\n再次清除后，尝试 .led 和 .row 函数：\n\n`matrix.clear();`\n\
    `matrix.led(3, 3, 1)`\n`matrix.row(1, 0xA1);`\n\n你现在已经掌握了 LED 矩阵和 SPI 设备！我们讨论了\
    \ SPI 通的优缺点，以及串口产生大量开销的原因。现在我们将查看 I2C——一种将 SPI 和串口的优点结合在一起的协议。\n\n# 探索 I2C 设备\n\
    \n我们在第 4 章“使用设备”中提到过 I2C 设备——你可能使用过 I2C LCD 显示某些数据。你可能注意到 I2C LCD 接线简单得多，并且具有与非\
    \ I2C LCD 相同的 API。幸运的是，这是因为 Johnny-Five 无论实现或协议如何，都提供类似的 API。但 I2C 是如何工作的？什么使其成为一种实用的协议？\n\
    \n# I2C 工作原理\n\nI2C，全集成间电路（Inter-Integrated Circuit），是一种输入输出组件可与微控制器通信的协议。它是标准化的，几乎所有的\
    \ I2C 设备以相同的方式运行。I2C 的另一个主要优点是被许多微控制器制造商（包括 Arduino）认可并实现的。任何兼容 Johnny-Five 的\
    \ Arduino 平台也兼容 I2C 设备。\n\n然而，在 Johnny-Five 中实现 I2C 设备可能是一个棘手的问题。为了理解为什么，我们需要更好地了解\
    \ I2C 如何工作。\n\nI2C 结合了 SPI 和串口通信的优点。它只使用两个引脚，但有一个由设置的同步时钟！\n\n# I2C 使用的引脚\n\n\
    I2C 除了电源需求外使用两个引脚：SDA（数据线）和 SCL（时钟线）。这两个引脚形成一条总线，可以被多个设备同时使用。\n\n这里听起来很像 SPI；两个引脚相互驱动。发送指令时，SCL\
    \ 引脚翻转，告诉我们另一个数据位，同时将 SDA 位翻转为要发送的值。这允许程序员和微控制器动态控制时钟——这实现了精确的数据传输和极少的位错误。然而，我们自己实现这种行为可能很困难。\n\
    \n每次向 I2C 发送数据时，都会作为第一个字节发送地址。该地址指向微控制器所在的设备。\n\n幸运的是，我们不需要自己实现这种行为——Johnny-Five\
    \ 和底层 Firmata 系统已经为我们实现了。但是，你仍然需要如何对这些设备进行读写——否则，你将面对一个无法启动的设备！\n\n# I2C 设备如何发送接收数据\n\
    \n每个 I2C 设备都有一个地址，通常以十六进制格式显示。例如，在本章中使用的加速度计地址是 0x53（对于不熟悉十六进制的人，0x 表示该数字是十六进制格式）。当微控制器的\
    \ I2C 总线控制多个设备时，这非常有用——地址告诉总线上的设备我们正在向哪个写入或从哪个读取。地址使用的示例：\n\n通过写入和读取 I2C 设备上的寄存器发送数据。每次想要写入或读取\
    \ I2C 设备时，我们需要发送地址（以便总线知道你正在访问哪个设备）以及我们想要读取或写入的寄存器。如果我们正在写入数据，还需要发送我们希望的位：\n\n\
    ![](img/798b2390880773c3e3d0e21417ef58f8_190_0.png)\n\n"
