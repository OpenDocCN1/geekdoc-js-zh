    # # Chapter 3. Using Digital and PWM Output Pins


    In this chapter, we''ll explore the pins of our microcontroller: how they work,
    how to manipulate them with Johnny-Five, and how different pins can be programmed
    to behave in different ways. We''ll also build two new projects—one in which we
    will use several LEDs to explore the Led API more, and another in which we will
    use a Piezo element to make some music! We will cover the following topics in
    this chapter:


    +   - How GPIO pins work

    - Using multiple outputs with several LEDs

    - Using a PWM output with a Piezo element'
- md: "\n## What you'll need for this chapter\n\nFor the first project, you'll need\
    \ your microcontroller, a handful of breadboard wires, a half-sized breadboard,\
    \ and five LEDs.\n\nFor the second project, you'll need your microcontroller,\
    \ a handful of breadboard wires, a half-sized breadboard, and a Piezo element.\n\
    \n## How GPIO pins work\n\nIf we look at our last project, we can observe that\
    \ from the code that we're writing values to an Led object in Johnny-Five, and\
    \ it's changing the state and brightness of an LED. How does this work? While\
    \ the in-depth details are beyond the scope of this book, we will go a little\
    \ into how this works; this uses the concept of GPIO, or General-Purpose Input/Output,\
    \ pins.\n\nA GPIO pin is a pin that provides electric current to or reads electric\
    \ current from a circuit. In our last project, we used this to provide varying\
    \ levels of power to our LED. These pins can be configured by users (that's us!)\
    \ to be used as input (read electric current) or output (provide electric current).\
    \ For now, we're going to focus on the output pins, of which there are two main\
    \ types: Digital and PWM.\n\n## Digital output pins\n\nDigital output pins are\
    \ only capable of providing two levels of electric current to our circuits: 1\
    \ and 0, HI and LOW, or ON and OFF. This means if we plug an LED into a digital\
    \ pin, we can only turn it on or off.\n\nHowever, in our case, when we ran the\
    \ pulse() method, our LED exhibited varying levels of brightness. What does this\
    \ mean? This means we used a PWM pin in our previous examples.\n\n## PWM output\
    \ pins\n\n**A PWM (Pulse-Width Modulation)** pin is capable of sending varying\
    \ levels of power to our circuit (sort of). The way this works is by setting the\
    \ pin to HIGH and then LOW very quickly in a timed manner, which emulates varying\
    \ levels of power.\n\nProgrammatically, you can set a PWM pin to any value between\
    \ 0 and 255, inclusive. The value you set the pin decides how often the pin is\
    \ set to HIGH; for instance, the value 0 would mean the PWM pin is set to HIGH\
    \ for 0% of the time. The value 85 is one-third of 255, and would mean the pin\
    \ is set to HIGH for one-third of the time—this emulates one-third power, or in\
    \ the case of our LED, one-third brightness.\n\nOur first example uses a PWM pin\
    \ to show varying degrees of brightness of our LED, but there are nearly infinite\
    \ uses for PWM pins—as we'll see later in this chapter, we can even make music\
    \ with them!\n\n## How to tell the difference between Digital and PWM pins\n\n\
    How can you check which pins are PWM on a microcontroller? This really depends\
    \ on the microcontroller you're using. For the Arduino Uno, which we have used\
    \ in this book, the PWM pins are marked with a ~, tilde, symbol. This means, on\
    \ an Uno, the PWM pins are 3, 5, 6, 9, 10, and 11.\n\n![](img/798b2390880773c3e3d0e21417ef58f8_66_0.png)\n\
    \nDetermining the PWM pins on an Arduino Uno\n\nNext, we'll explore the differences\
    \ between the pins by wiring up several LEDs and playing with the Led API.\n\n\
    ## Multiple pins with several LEDs\n\nFor the next project, we're going to look\
    \ at the Led object API and test several different methods. It is one of the benefits\
    \ of Johnny-Five—abstraction. If you can understand the concept of an LED, you\
    \ can use the Johnny-Five LED object without thinking about the underlying pins\
    \ or timings. Let's go over the methods that we'll use for our project:\n\n- on()\
    \ and off(): These turn an LED on and off. Under abstraction, this sets the pin\
    \ that is wired to the LED to HIGH and LOW. We'll be using these in the REPL.\n\
    - blink(time): This turns an LED on and off at a given interval. strobe() and\
    \ blink() are aliases of each other and do the same thing.\n- pulse(time): This\
    \ will cause an LED to pulse on and off in an eased manner. This requires an LED\
    \ wired to a PWM pin. The time argument sets the length of each side of the pulse—500\
    \ will mean the LED fade in for 500 ms and fade out for 500 ms, meaning a 1-second\
    \ pulse.\n- fade(brightness, ms): This will cause LED to fade on or off from its\
    \ current brightness to the given brightness over ms milliseconds.\n- stop():\
    \ This stops any recurring action happening on an LED. Note that this won't necessarily\
    \ turn off the LED. If this means the LED is on, so be it. It will stop the action\
    \ in its tracks—\n\nRemember that most Johnny-Five object functions are chainable—you\
    \ can use one right after the other.\n\n```\nmyLed.stop().off()\n```\n\nThe preceding\
    \ code will stop any recurring event on the LED and turn it off.\n\nNow that we\
    \ know functions we'll be working with, let's wire up our next project.\n\n##\
    \ Setting up the hardware for the project\n\nGrab your materials and look at the\
    \ following diagram:\n\n![](img/798b2390880773c3e3d0e21417ef58f8_68_0.png)\n\n\
    The wiring for our project\n\n## Multiple pins with several LEDs\n\nFor the next\
    \ project, we're going to look at the Led object API and test several different\
    \ methods. It is one of the benefits of Johnny-Five—abstraction. If you can understand\
    \ the concept of an LED, you can use the Johnny-Five LED object without thinking\
    \ about the underlying pins or timings. Let's go over the methods that we'll use\
    \ for our project:\n\n- on() and off(): These turn an LED on and off. Under abstraction,\
    \ this sets the pin that is wired to the LED to HIGH and LOW. We'll be using these\
    \ in the REPL.\n- blink(time): This turns an LED on and off at a given interval.\
    \ strobe() and blink() are aliases of each other and do the same thing.\n- pulse(time):\
    \ This will cause an LED to pulse on and off in an eased manner. This requires\
    \ an LED wired to a PWM pin. The time argument sets the length of each side of\
    \ the pulse—500 will mean the LED fade in for 500 ms and fade out for 500 ms,\
    \ meaning a 1-second pulse.\n- fade(brightness, ms): This will cause LED to fade\
    \ on or off from its current brightness to the given brightness over ms milliseconds.\n\
    - stop(): This stops any recurring action happening on an LED. Note that this\
    \ won't necessarily turn off the LED. If this means the LED is on, so be it. It\
    \ will stop the action in its tracks—\n\nRemember that most Johnny-Five object\
    \ functions are chainable—you can use one right after the other.\n\n```\nmyLed.stop().off()\n\
    ```\n\nThe preceding code will stop any recurring event on the LED and turn it\
