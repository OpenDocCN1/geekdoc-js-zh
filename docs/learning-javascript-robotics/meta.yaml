  md: '# # Wiring up servos


    To wire up a servo, you''ll have to use a setup similar to the following figure:


    ![](img/798b2390880773c3e3d0e21417ef58f8_136_0.png)


    A servo wiring diagram


    # ## Tip


    The wire colors may vary for your servo. If your wires are red, brown, and orange,
    red is 5V, brown is **GND**, and orange is signal. In doubt, check the data sheet
    that came with your servo.


    After wiring up the servo, plug the board in and listen to your servo. If you
    hear a clicking noise, quickly unplug the board—this means your servo is trying
    to place itself in a position it cannot reach. Usually, there is a small screw
    at the bottom of most servos that you can use to calibrate it. Use a small screwdriver
    to rotate this until it stops clicking when the power is turned on.


    This procedure is the same for continuous servos—the diagram does not change much
    either. Just replace the regular servo with a continuous one and you''re good
    to go.'
