  mdcn: "\n\n# 为什么使用事件？\n\n经常被问的问题是：“为什么要基于事件？为什么不像以前的方法那样基于循环和基于中断的呢？”\n\n这在很大程度上与机器人的工作方式以及我们思考机器人程序的方式有关。当你考虑让机器人执行什么时，你不太可能想“每隔\
    \ X 秒，我想检查 A 并启动任务 B……”，而你更有可能想的是“当 Y 发生时，我想启动事件 C……”\n\nJohnny-Five 中基于事件的系统与这种思维模式配合得非常完美，它允许用户在事件中放置监听器和处理器，而不是每隔\
    \ X 秒轮询一次正确的条件。这让初学机器人编程的人来说，机器人编程变得更容易理解。\n\n理解事件对于掌握 Johnny-Five 至关重要——因为每个\
    \ Johnny-Five 脚本都从实例化 `Board`（主板）对象开始，并等待它触发 `ready` 事件。这等同于浏览器端 JavaScript 应用中的\
    \ DOM `ready` 事件——它通知你已经准备好开始发送指令了。\n\n# 连接外部 LED\n\n在我们的第一个硬件项目中，我们将把一个 LED 连接到\
    \ Arduino。LED，又称发光二极管，是一种在电流通过时会发光的组件。它们有许多颜色和尺寸，是业余机器人领域中最易用且多功能的组件之一。\n\n##\
    \ 设置硬件\n\n首先，取一个 LED。我们将确定 LED 的正极和负极——对于这种组件来说，这很直观：正极比负极长。\n\n![](img/798b2390880773c3e3d0e21417ef58f8_52_0.png)\n\
    \n确定 LED 的正极和负端\n\n要将 LED 连接到 Arduino，将正极放在引脚 11 上，负极放在标记为 GND 的引脚上，如下所示：\n\n\
    ![](img/798b2390880773c3e3d0e21417ef58f8_52_1.png)\n\n连接我们的 LED\n\n如果你愿意，也可以使用面包板——它看起来像如下：\n\
    \n![](img/798b2390880773c3e3d0e21417ef58f8_53_0.png)\n\n# 使用面包板连接 LED\n\n现在我们已经连接好了\
    \ LED，我们将像上一章做的那样让它闪烁。脚本看起来非常熟悉：\n\n```\nvar five = require(\"johnny-five\");\n\
    \nvar board = new five.Board();\n\nboard.on(\"ready\", function() {\n  var led\
    \ = new five.Led(11);\n  led.blink(500);\n});\n```\n\n这是因为这和上章的脚本几乎相同——我们只是更改了引脚编号以反映我们安装的新\
    \ LED。\n\n保存并运行脚本。你应该能在你的主板上看到一个闪烁的 LED，如下截图所示：\n\n[待办：添加照片]\n\n当你运行脚本时，你会注意到一个提示——你甚至可以在其中输入内容！这是\
    \ REPL，我们将用它来实时操作我们的 LED！\n\n## 使用读取-评估-打印循环 (REPL)\n\n读取-评估-打印循环（或 REPL）是许多脚本语言中的一个概念，但对于库来说是新的，对机器人领域来说绝对是全新的。回想一下你在典型的\
    \ Arduino 程序中是如何改变状态的：你修改源代码，将其重新加载到板上，然后等待它运行。\n\n然而，由于 Johnny-Five 的工作方式，我们可以在*代码运行期间*修改机器人代码的状态。这是因为我们使用了\
    \ Firmata——主板只是一个对我们 Node 程序指令做出响应的轻量客户端，所以如果我们让我们的 Node 程序发送不同的指令，我们就可以实时改变机器人的工作方式。\n\
    \n在 Johnny-Five 程序中实现此点的方法向 REPL 注入组件，从而允许我们使用它们。\n\n#让组件对 REPL 可\n\n我们将修改上一节中的脚本来模拟我们的\
    \ LED。为了做到，我们将使用 `this.repl.inject()` 函数。当 `this` 关键字在我们的 `board.on('ready')`\
    \ 处理器中使用时，它是对全局上下文的引用，因此我们可以通过 `this.repl` 访问我们正在编写程序的 REPL。`inject` 方法接受一个对象；对象的键（keys）将代表你可以从\
    \ REPL 访问的名称，而值（values）将是你希望访问的组件。\n\n因此，我们将以下对象传递给 `inject` 方法。这将允许我们通过 `myLed`\
    \ 名称访问我们的 LED 组件：\n\n```\n{\n  myLed: led\n}\n```\n\n我们的新程序看起来如下：它将允许我们通过 `myLed`\
    \ 名称访问我们的 LED 组件：\n\n```\nvar five = require(\"johnny-five\");\n\nvar board =\
    \ new five.Board();\n\nboard.on(\"ready\", function() {\n  var led = new five.Led(11)\n\
    \n  this.repl.inject({\n    myLed: led\n  });\n\n  led.blink(500);\n});\n```\n\
    \n（注：原文后续部分存在大量重复的 OCR 错误，此处已根据逻辑进行清理并翻译。）\n\n"
