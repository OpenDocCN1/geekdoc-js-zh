    \ [[degrees: 45], 45, 45, -45],\n      [[degrees: 30], 30, 30, 30],\n      [[degrees:\
    \ 20}, 40, 40, 40]\n    ]\n  }\n\n  this.repl.inject({\n    animation,\n    mySegment\n\
    \  })\n\n  animation.enqueue(mySegment)\n})\n```\n\nGo ahead and run this with\
    \ the following:\n\n```\nnode animation-project.js\n```\n\nYour servos will spring\
    \ to life and start running the segment (we queued it on the last line!). Once\
    \ it's done running, let's see it again on a loop. In the REPL, type the following:\n\
    \n- >mySegment.loop = true\n- >animation.enqueue(mySegment)\n\nThe segment should\
    \ start running on a loop. Want to see it slower? Let's change the speed using\
    \ the Animation object's speed() function:\n\n- >animation.speed(.5)\n\nThis should\
    \ slow it down to half speed. Let's go ahead and stop the animation, clearing\
    \ the queue:\n\n```\n>animation.stop()\n```\n\nLet's see what happens when we\
    \ make our segment metronomic using an easing function, and then run it:\n\n```\n\
    >mySegment.easing = 'inOutCirc'\n>mySegment.metronomic = true\n>animation.enqueue(mySegment)\n\
    ```\n\nThe segment now loops forward and reverses and looks more fluid!\n\nThis\
    \ is cool, but what if we want animations to run one after the other? We could\
    \ use a series of durations and timers, or we could tap into Johnny-Five's event\
    \ system, which extends through the Animation API. Next we'll explore how to tap\
    \ into these events to create timed animations.\n\n## Animation events\n\nA lot\
    \ of movements require waiting for one segment to finish before starting another.\
    \ Some segments should only be fired at certain times, as well. The best way to\
    \ handle these timings and communication systems is by using Johnny-Five's `animation`\
    \ events.\n\nWe tap into these events by assigning callbacks to special attributes\
    \ on segments. Let's go into the details of each one and see when they will fire.\n\
    \n| Events | Details |\n|---|--|\n| onstart | The onstart callback fires when\
    \ the segment has begun playing in the animation. |\n| onstop | The onstop callback\
    \ is called only when the segment is either in the queue or currently running,\
    \ but the animation is stopped via `animation.stop()`. |\n| onpause | The onpause\
    \ callback is called only when the segment is queued or running in an animation\
    \ that has been passed via `animation.pause()`. |\n| oncomplete | The oncomplete\
    \ callback only fires when the segment has completed running in an animation.\
    \ Note: This does NOT apply to looped segments. See the `onloop` callback for\
    \ this. |\n| onloop | The onloop callback is called when a function loops, that\
    \ is at the beginning of the second run-through and each started run-through thereafter.\
    \ |\n\nIn order to understand how the events work and what they can be used for,\
    \ let's start on our final project: grab your LCD from Chapter 4, *Using Specialized\
