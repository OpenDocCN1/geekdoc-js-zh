- md: "\nCommunity Experience Distilled\n\n## Learning JavaScript Robotics\nRobotics\n\
    \nDesign, build, and program your own remarkable robots with JavaScript and open\
    \ source hardware\n\nKassandra Perch [PACKT] open source*\n\n## Learning JavaScript\
    \ Robotics\n\n## Table of Contents\n\n- Learning JavaScript Robotics\n- Credits\n\
    - About the Author\n- About the Reviewers\n- www.PacktPub.com\n- Support files,\
    \ eBooks, discount offers, and more\n- Why subscribe?\n- Free access from Packt\
    \ account holders\n- Preface\n- What this book covers\n- What you need for this\
    \ book\n- Who this book is for\n- Conventions\n- Reader feedback\n- Customer support\n\
    - Downloading the example code\n- Downloading the color images of this book\n\
    - Errata\n- Piracy\n- Questions\n## 1. Getting Started with JS Robotics\n  - Understanding\
    \ JS Robotics, NodeBots, and Johnny-Five\n  - What a NodeBot is, and other basic\
    \ vocabulary\n  - Johnny-Five and the NodeBot revolution\n  - What we'll be using\
    \ in this book\n  - Setting up your development environment\n  - Installing NodeJS\n\
    \  - Setting up your project and installing Johnny-Five\n  - Connecting your Microcontroller\
    \ and installing Firmata\n  - Hello, World! – Blinking an onboard LED\n  - Writing\
    \ the Johnny-Five script\n  - Running the script\n  - Summary\n## 2. Working with\
    \ Johnny-Five\n  - What you'll need for this chapter\n  - How a Johnny-Five program\
    \ works\n  - Objects, functions, and events\n  - Going over our blink-LED script\n\
    \  - Understanding events in Johnny-Five\n## Why events?\n- Wiring up an external\
    \ LED\n- Setting up the hardware\n- Using the Read-Eval-Print-Loop (REPL)\n- Making\
    \ components available to the REPL\n- Using the REPL\n- Summary\n## 3. Using Digital\
    \ and PWM Output Pins\n  - What you'll need for this chapter\n  - How GPIO pins\
    \ work\n  - Digital output pins\n  - PWM output pins\n  - How to tell the difference\
    \ between Digital and PWM pins\n  - Multiple pins with several LEDs\n  - Setting\
    \ up the hardware for the project\n  - Writing the script for the project\n  -\
    \ Exploring more about LED objects in Johnny-Five\n  - Using PWM pins with the\
    \ Piezo element\n  - Setting up the hardware\n  - Writing the script\n  - What's\
    \ going on with the pin?\n  - Exploring the Piezo API\n  - Summary\n## 4. Using\
    \ Specialized Output Devices\n  - What you'll need for this chapter\n  - Outputs\
    \ that require multiple pins\n  - Inter-Integrated Circuits (I2C)\n  - Checking\
    \ compatibility with Johnny-Five\n  - Obtaining documentation, wiring diagrams,\
    \ and so on\n  - Project — character LCD display\n  - Wiring up – I2C LCDs\n \
    \ - The code\n  - The I2C version\n  - The non-I2C version\n  - Running the code\n\
    \  - Summary\n## 5. Using Input Devices and Sensors\n  - What you'll need for\
    \ this chapter\n  - How analog input pins work\n  - Johnny-Five sensor events\n\
    \  - Using basic inputs – buttons and potentiometers\n  - Wiring up our button\
    \ and LED\n  - Coding button-led.js\n  - Wiring the potentiometer and the LED\n\
    \  - Coding our dimmer switch\n## Using sensors – Light and Temperature\n  - Wiring\
    \ up our photocell\n  - Coding our photocell example\n  - barcli\n  - Coding everything\
    \ together\n  - Wiring up the temperature sensor\n  - Coding our temperature example\n\
    \  - Summary\n## 6. Moving Your Bot\n  - What you'll need for this chapter\n \
    \ - The different kinds of servos and motors\n  - Defining motors and servos\n\
    \  - Things to keep in mind\n  - Types of motors\n  - Types of servos\n  - Do\
    \ I use a servo or a motor?\n  - Servo and motor controllers\n  - Motor and servo\
    \ shields\n  - Special concerns when using motors and servos\n  - Power concerns\n\
    \  - Tethering and cables\n  - Wiring up servos and motors\n  - Wiring up servos\n\
    \  - Wiring up motors\n  - Creating a project with a motor and using the REPL\n\
    \  - Exploring the motor API\n  - Creating a project with a servo and a sensor\n\
    \  - Exploring the servo API with the REPL\n  - Summary\n## 7. Advanced Movement\
    \ with the Animation Library\n  - What you'll need for this chapter\n  - What\
    \ is the Animation API?\n  - Why do we need an Animation API?\n  - Why animation?\n\
    \  - Looking at the Animation API\n  - Learning the terminology\n  - The difference\
    \ between to() and the Animation API\n  - Using the ServoArray object\n  - Project\
    \ – wiring up three servos and creating an array\n  - Writing Servo Animations\n\
    ## The keyframe object\n  - Keyframe shorthand\n  - Examples of writing keyframes\n\
    ## Writing segments\n  - Segment options\n  - Multiple servos in one segment\n\
    \  - Examples of writing segments\n## The Animation object\n  - Project – animating\
    \ our servo array\n## Animation events\n  - Building a servo array with an informative\
    \ LCD readout\n  - Summary\n## 8. Advanced Components – SPI, I2C, and Other Devices\n\
    \  - What you'll need for this chapter\n  - Why do we need the I2C and SPI protocols?\n\
    ## Exploring SPI (Serial Peripheral Interface) devices\n  - How SPI works\n  -\
    \ How Johnny-Five does SPI\n  - Benefits and drawbacks of SPI\n  - Building with\
    \ an SPI device – an LED matrix\n  - The build\n  - The API\n  - Formatting data\
    \ for the LED matrix\n  - The Drawing functions\n  - The Code\n## Exploring I2C\
    \ devices\n  - How I2C works\n  - Pins used by I2C\n  - How I2C devices send and\
    \ receive data\n  - Benefits and drawbacks of I2C\n  - Benefits\n  - Drawbacks\n\
    \  - Building with an I2C device – Accelerometer\n  - Wiring up our accelerometer\n\
    \  - Coding up our example\n## External Devices\n- Why External Devices?\n  -\
    \ node-serialport\n  - node-hid\n  - Building with gamepad\n  - The hardware\n\
    \  - gamepad API\n  - The Code\n## Summary\n## 9. Connecting NodeBots to the World,\
    \ and Where Next\n- What you'll need for this chapter\n- Connecting NodeBots to\
    \ the Web\n- It's just a Node\n- Using Twilio\n- Building the WeatherBot\n- Using\
    \ Johnny-Five and the wide world of microcontrollers\n- Moving our WeatherBot\
    \ to Particle\n- Tethering and Johnny-Five\n- Other libraries and platforms\n\
    - Espruino\n- Tessel\n- Cylon.js\n- JerryScript\n- Vendor libraries\n- Where to\
    \ go here\n\nIndex\n\n## Learning Robotics\n\nCopyright © 2015 Packt Publishing\n\
    \nAll rights reserved. No part of this book may be reproduced, stored in a retrieval\
    \ system, or transmitted in any form or by means, without the prior written permission\
    \ of the publisher, except in the case of brief quotations in critical articles\
    \ or reviews.\n\nEvery effort has been made in the preparation of this book to\
    \ ensure the accuracy of the information. However, the author, nor Packt Publishing,\
    \ and its dealers or distributors will be held liable for any damages caused or\
    \ alleged to be caused directly or indirectly by this book.\n\nPackt Publishing\
    \ has endeavored to provide trademark information about all of the companies and\
    \ products mentioned in this book by the appropriate use of capitals. However,\
    \ Packt Publishing cannot guarantee the accuracy of this information.\n\nFirst\
    \ published: November 2015\n\nProduction reference: 123115\n\nPublished by Packt\
    \ Publishing Ltd.\n\nLivery Place\n\n35 Livery Street\n\nBirmingham B3 2PB, UK.\n\
    \nISBN 978-1-78588-334-7\n\nwww.packpub.com\n\n## Credits\n\nAuthor: Kassandra\
    \ Perch\n\nReviewers: Chris S. Crawford, Tomomi Imura\n\nCommissioning Editor:\
    \ Neil Alexander\n\nAcquisition Editor: Aaron Lazar\n\nContent Development Editor:\
    \ Mayur Pawanikar\n\nTechnical Editor: Menza Mathew\n\nCopy Editor: Kausambhi\
    \ Majumdar\n\nProject Coordinator: Nidhi Joshi\n\nProofreader: Safis Editing\n\
    \nIndexer: Rekha Nair\n\nProduction Coordinator\n\n## Manu Joseph\n\n## Cover\
    \ Work\n\nManu Joseph\n\n## About the Author\n\nKassandra Perch is an open web\
    \ developer and supporter. She began as a frontend developer and moved to server-side\
    \ with the advent of Node.js and was especially enthral by the advance of the\
    \ NodeBots community. She travels the world speaking at conferences about NodeBots\
    \ and the fantastic community around them. When she's not building bots, she's\
    \ knitting, sewing, sculpting, or playing video games with her cats.\n\nI'd like\
    \ to thank my mentor—as I've said in the past, I don't know where I'd be without\
    \ you, but I certainly know my life is better with you in it. My parents supported\
    \ me as a child who took things apart, and their support lets me continue to do\
    \ so, as well as build things of my own.\n\nThe NodeBots community deserves a\
    \ huge thank you: your sense of wonder and joy in learning new things keeps me\
    \ going. Special thanks to Rick and Raquel for getting me started.\n"
  mdcn: "\n社区经验精华\n\n## 学习 JavaScript 机器人\n机器人\n\n使用 JavaScript 和开源硬件设计、构建并编写你自己的卓越机器人\n\
