  mdcn: "\n\n## Cylon.js\n\nCylon.js 是一个类似于 Johnny-Five 的库，它也支持许多平台。它的重点稍微广泛一些。虽然\
    \ Johnny-Five 专注于确保微控制器支持是核心重点，但 Cylon 支持其他串口外围设备。你可以在 [cylonjs.com](http://cylonjs.com)\
    \ 更多关于这个开源项目的信息。\n\n## JerryScript\n\nJerryScript 是三星推出的全新开源项目，旨在让 JavaScript\
    \ 引擎在极小的内存中运行，从而能够在没有 Linux 系统的情况下在微控制器上运行。虽然这是一个非常新且雄心勃勃的项目，但如果成功，它将开启 JavaScript\
    \ 机器人的新时代。你可以在 https://samsung.github.io/jerryscript/ 了解更多信息。\n\n## 小型 Linux 电脑\n\
    \n虽然这与其说是一个集中的努力，不如说是一类设备，但每隔几个月就会出现新的、更小、更快的 Linux 机器。从树莓派（Raspberry Pi）到 Onion\
    \ Omega，这些自带 GPIO 的机器绝对是一个值得探索的设备领域。许多设备在 Johnny-Five 之外有自己的 GPIO Node 模块。例如，BeagleBone\
    \ Black 拥有 BoneScript。未来请关注此类微型电脑，并在开发你的独立 NodeBots 项目时务必考虑它们。\n\n## 厂商库\n\n许多\
    \ IoT 微控制器也附带了可使用的 JS 库。例如，Particle 发布了一个 npm 模块，用于通过 Spark 软件包通过他们的云服务与其 Core\
    \ 和 Photon 平台进行工作。（注意，由于公司名称的变更，该包名称在本书出版时可能会发生变化）。许多厂商正在根据自己的条款转向 Node，因此在查看新硬件平台时，务必寻找相应的\
    \ npm 包。\n\n## 接下来该去哪里\n\n随着本书接近尾声，我将回答最常收到的问题：我该去哪里？我该构建什么？我该向谁寻求帮助？\n\n至于构建什么，你可以像我一样做。我随身带着一个笔记本，尽管我也会用手机记录想法——我会思考日常生活中想要的小事。我可以解决什么问题？什么东西看起来很酷？我写下这些问题或需求，并在稍后进行回顾。我会问自己：我能用\
    \ NodeBot 修复它吗？如果可以，太棒了！我就有了下一个项目。我想你会发现，通过这种方法，你的想法比你想象的要多。\n\n一旦你构建了东西，就写写它吧！NodeBots\
    \ 社区喜欢看到你是如何构建东西的。不要担心它不是下一个地形导航的六足机器人；我们想看到你是如何构建连接互联网的圣诞灯或自动喂食器器的。对于人们参考来说，示例越多越好，贡献最好的方式之一就是编写文档。\n\
    \n如果你让一个新零件工作了怎么办？向 Johnny-Five 提交一个拉请求（pull request）。团队非常擅长提供快速且友好的反馈，并将与你合作将你的组件引入\
    \ Johnny-Five。此外，来我们的 Gitter 频道打个“招呼”吧——我们非常友好，喜欢结识新用户和 NodeBotters。\n\n感谢与我一起开启这段\
    \ JavaScript 机器人的之旅！我在 Twitter、GitHub 以及几乎任何地方都是 nodebotanist——来跟我说“HI”，并让我看看你构建了什么吧！\n\
    \n## 索引\n\n### A\n\n- 加速度计 (accelerometer)\n    - 构建，使用 I2C 设备 / Building with\
