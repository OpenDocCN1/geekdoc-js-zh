    Chapter 1, Getting Started with JS Robotics, will get you started by setting up
    an Arduino Uno and exploring the world of NodeBots.


    Chapter 2, Working with Johnny-Five, covers the basics of Johnny-Five, including
    Read-Eval-Print-Loop (REPL), and we will build our first project.


    Chapter 3, Using Digital and PWM Output Pins, covers basic output devices, using
    both digital and PWM pins.


    Chapter 4, Using Specialized Output Devices, covers specialized outputs that use
    one or multiple pins.


    Chapter 5, Using Input Devices and Sensors, covers input devices using analog
    and GPIO pins.


    Chapter 6, Moving Your Bot, covers basic servo and motor usage with Johnny-Five.


    Chapter 7, Advanced Movement with the Animation Library, covers the Animation
    Library and how to create advanced movement schemes for your NodeBots.


    Chapter 8, Advanced Components – SPI, I2C, and Other Devices, covers the use of
    I2C, SPI, and other advanced components with Johnny-Five.


    Chapter 9, Connecting NodeBots to the World, and Where to Go Next, covers how
    to connect your NodeBots to the Internet and use Johnny-Five code with platforms
    other than Arduino.'
