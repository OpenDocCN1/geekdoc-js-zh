  md: "# Coding our temperature example\n\nLooking at the API for the temperature\
    \ sensor object, we will notice that there are no special API calls. However,\
    \ there are special attributes of the this object inside our data event handler.\
    \ These attributes allow us to access the Fahrenheit, Celsius, and Kelvin readings\
    \ for our temperature sensor without doing the translation math ourselves.\n\n\
    With our prior knowledge of Sensor objects and barcli, we can write the following\
    \ in `temperature.js:`\n\n```\nvar five = require('johnny-five');\nvar Barcli\
    \ = require('barcli');\n\nvar board = new five.Board();\n\nvar fahrenheitGraph\
