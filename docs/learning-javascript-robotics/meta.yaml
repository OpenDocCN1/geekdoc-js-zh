  md: '# Writing segments


    We know segments consist of an array of keyframes, an array of cue points, a duration,
    and some options. Let''s take a look at the options available to us in each segment,
    and then build some segments to get us ready for our next project.


    # Segment options


    The segment options and their properties are as follows:


    | Segment options | Properties |

    | - | - |

    | target | You can use this in the segment to override the target segment operates
    on; this is usually specified by the animation, so setting it in the segment overrides
    the animation''s assignment |

    | easing | Just like keyframes, you can set an easing function for an entire segment.
    Note that easing functions stack; if you use an easing function on keyframes and
    a segment, the tweening will calculate the keyframe easing and then the segment
    easing |

    | loop | This is a Boolean; true causes this segment to loop enqueued until it
    is stopped by the animation it was queued to |

    | loopBack | If you''d like a segment to loop back to some other than the first
    cue point, you can specify the index of that cue point here. For instance if a
    segment has the cue points [0, .25..75, 1] and you set LoopBack to 1, it will
    loop the cue points [.25,.75, 1] only |

    | metronome | This is a Boolean; true, the segment will run from the first cue
    point to the last, back to the first in reverse order. You can combine this with
    the loop option, but it will not loop by default |

    | progress | This attribute can be either used as information about a running
    segment (as we will see in a later project) or set; set the current progress of
    the animation if you''d to start at a different point. This should be a value
    between 0 and 1, which cue points |

    | speed | Much like progress, this can be used as information and set. The default
    is 1.0, and this changes the speed multiplier which the segment runs |

    | fps | This sets the maximum frames per second that a segment can run. The default
    is 60. Changing the maximum fps of a segment will not change the speed or cue
    points |


    # Multiple servos in one segment


    More than not, you''ll be animating more than one servo at a time. How do you
    handle keyframes for more than one servo? By passing an array of arrays; each
    array represents the keyframes for a servo in the target servo array. For instance,
    the following segment contains the keyframes for two servos in an array:'
  merge: -1
