    \ API\n  - 总结\n## 4. 使用专用输出设备\n  - 本章所需的准备\n  - 需要多个引脚的输出\n  - 集间电路 (I2C)\n  -\
    \ 检查与 Johnny-Five 的兼容性\n  - 获取文档、接线图等\n  - 项目 — 字符 LCD 显示器\n  - 接线 – I2C LCD\n\
    \  - 代码\n  - I2C 版本\n  - 非 I2C 版本\n  - 运行代码\n  - 总结\n## 5. 使用输入设备和传感器\n  - 本章所需的准备\n\
    \  - 模拟输入引脚的工作原理\n  - Johnny-Five 传感器事件\n  - 使用基础输入——按钮和电位器\n  - 连接按钮和 LED\n \
    \ - 编写 button-led.js\n  - 连接电位器和 LED\n  - 编写调光开关\n## 使用传感器 – 光照和温度\n  - 连接光敏电阻\n\
    \  - 编写光敏电阻示例\n  - barcli\n  - 将所有内容整合在一起\n  - 连接温度传感器\n  - 编写温度示例\n  - 总结\n##\
    \ 6. 移动你的机器人\n  - 本章所需的准备\n  - 不同类型的舵服和电机\n  - 定义电机和舵服\n  - 需要注意的要点\n  - 电机类型\n\
    \  - 舵服类型\n  - 我应该用舵服还是电机？\n  - 舵服和电机控制器\n  - 电机和舵服扩展板\n  - 使用电机和舵服 时的特殊注意事项\n\
    \  - 电源问题\n  - 束缚与线缆\n  - 连接舵服和电机\n  - 连接舵服\n  - 连接电机\n  - 使用电机创建一个项目并使用 REPL\n\
    \  - 探索电机 API\n  - 使用舵服和传感器创建一个项目\n  - 使用 REPL 探索舵服 API\n  - 总结\n## 7. 使用动画库进行高级移动\n\
    \  - 本章所需的准备\n  - 什么是 Animation API？\n  - 为什么我们需要 Animation API？\n  - 为什么需要动画？\n\
    \  - 查看 Animation API\n  - 学习术语\n  - to() 方法与 Animation API 的区别\n  - 使用 ServoArray\
    \ 对象\n  - 项目 – 连接三个舵服并创建一个数组\n  - 编写舵服动画\n## 关键帧对象\n  - 关键帧简写\n  - 编写关键帧的示例\n\
    ## 编写段 (Segments)\n  - Segment 选项\n  - 一个段中的多个舵服\n  - 编写段的示例\n## Animation 对象\n\
    \  - 项目 – 为我们的舵服数组制作动画\n## 动画事件\n  - 构建带有信息 LCD 输出的舵服数组\n  - 总结\n## 8. 高级组件 –\
    \ SPI、I2C 及其他设备\n  - 本章所需的准备\n  - 为什么我们需要 I2C 和 SPI 协议？\n## 探索 SPI (串行外设接口) 设备\n\
    \  - SPI 如何工作\n  - Johnny-Five 如何处理 SPI\n  - SPI 的优缺点\n  - 使用 SPI 设备构建——LED 矩阵\n\
    \  - 构建过程\n  - API\n  - 为 LED 矩阵格式化数据\n  - 绘图函数\n  - 代码\n## 探索 I2C 设备\n  - I2C\
    \ 如何工作\n  - I2C 使用的引脚\n  - I2C 设备如何发送接收数据\n  - I2C 的优缺点\n  - 优点\n  - 缺点\n  - 使用\
    \ I2C 设备构建——加速度计\n  - 连接加速度计\n  - 编写示例代码\n## 外部设备\n- 为什么需要外部设备？\n  - node-serialport\n\
    \  - node-hid\n  - 使用游戏柄构建\n  - 硬件\n  - gamepad API\n  - 代码\n## 总结\n## 9. 将 NodeBots\
    \ 连接到世界，以及后续展望\n- 本章所需的准备\n- 将 NodeBots 连接到网络\n- 它只是一个 Node\n- 使用 Twilio\n- 构建天气机器人\
    \ (WeatherBot)\n- 使用 Johnny-Five 和广阔的微控制器世界\n- 将我们的 WeatherBot 移动到 Particle\n\
    - 束缚与 Johnny-Five\n- 其他库和平台\n- Espruino\n- Tessel\n- Cylon.js\n- JerryScript\n\
    - 厂商库\n- 接下来可以去哪里\n\n索引\n\n## 学习机器人\n\n版权所有 © 2015 Packt Publishing\n\n保留所有权利。\n\
    \n本书的任何部分在未经出版者事先许可的情况下，不得复制、存储在检索系统中或以任何形式或手段传输，但文章或评论中的简短引用除外。\n\n在编写本书时，我们尽力确保信息的准确性。然而，作者、Packt\
    \ Publishing 及其分销商对因本书直接或间接造成的任何损害不承担责任。\n\n首次出版于：2015年11月\n\n制作参考号：12315\n\n\
    Packt Publishing Ltd. 出版\n\nLivery Place\n\n35 Livery Street\n\nBirmingham B32PB,\
    \ UK\n\nISBN 978-1-78588-334-7\n\nwww.packpub.com\n\n## 致谢\n\n作者：Kassandra Perch\n\
    \n评审员：Chris S. Crawford, Tomomi Imura\n\n策划编辑：Neil Alexander\n\n收购编辑：Aaron Lazar\n\
    \n内容开发编辑：Mayur Pawanikar\n\n技术编辑：Menza Mathew\n\n文字编辑：Kausambhi Majumdar\n\n项目协调：Nidhi\
    \ Joshi\n\n校对：Safis Editing\n\n索引：Rekha Nair\n\n制作协调\n\n## Manu Joseph\n\n## 封面设计\n\
    \nManu Joseph\n\n## 关于作者\n\nKassandra Perch 是一个开源 Web 开发人员支持者。她从前端开发起步，随着 Node.js\
    \ 的出现转向后端开发，并对 NodeBots 社区的发展深着迷。她游遍世界为 NodeBots 及其优秀的社区进行演讲。在不构建机器人时，她会编织、缝纫、雕塑或和猫一起玩视频游戏。\n\
    \n我想感谢我的导师——正如我以前提到过那样，我不知道没有你会在哪里，但我知道有你在我的生活变得更好。我的父母在我小时候作为一个拆解东西的孩子时就支持我，这种支持让我能够继续这样做，同时也创造属于自己的东西。\n\
    \nNodeBots 社区值得我们巨大的感谢：你们的好奇心和学习新事物的快乐一直激励着前行。特别感谢 Rick 和 Raquel 带我开启了这一切。\n"
