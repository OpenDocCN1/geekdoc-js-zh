  md: "# Project – animating our servo array\n\nYou should still have your servo array\
    \ from the last project. Let's animate it! We'll use the REPL to modify our animation\
    \ segment in real time and with some of the true power of the Animation API.\n\
    \nLet's start with the code that initializes our board, sets up our servo array,\
    \ creates an animation and a segment, and inserts them into the REPL. Place the\
    \ following into animation-project.js:\n\n```\nvar five = require('johnny-five')\n\
    \nvar board = new five.Board()\n\nbord.on('ready', function(){\n  var servos =\
    \ new five.Servos([3, 5, 6])\n  var animation = new five.Animation(servos)\n\n\
    \  var mySegment = {\n    easing: 'inOutCirc',\n    duration: 3000,\n    cuePoints:\
    \ [0, .25, .75, 1],\n    keyFrames: [\n      [[degrees: 45], 45, 45, -45],\n \
    \     [[degrees: 30], 30, 30, 30],\n      [[degrees: 20}, 40, 40, 40]\n    ]\n\
    \  }\n\n  this.repl.inject({\n    animation,\n    mySegment\n  })\n\n  animation.enqueue(mySegment)\n\
    })\n```\n\nGo ahead and run this with the following:\n\n```\nnode animation-project.js\n\
    ```\n\nYour servos will spring to life and start running the segment (we queued\
    \ it on the last line!). Once it's done running, let's see it again on a loop.\
    \ In the REPL, type the following:\n\n+   >mySegment.loop = true\n>animation.enqueue(mySegment)\n\
    \nThe segment should start running on a loop. Want to see it slower? Let's change\
    \ the speed using the Animation object's speed() function:\n\n+   >animation.speed(.5)"
