- img_proc: true
  md: '# # Using the Read-Eval-Print-Loop (REPL)


    The Read, Eval, Print Loop, or REPL, is a concept relative to many scripting languages,
    but it is new to libraries, and definitely new to robotics. Think about how you
    alter the state in a typical Arduino program: you modify the source code, re-load
    it onto the board, and wait for it to run.


    However, due to the way Johnny-Five works, we can modify the state of our robot
    code *while the code is running*. This is because we use Firmata—the board is
    just a thin client that reacts to instructions from our node program, so if we
    let our Node programs send different instructions, we can change how our robot
    works in real time.


    The way to do this in a Johnny-Five program is by injecting components into the
    REPL, which allows us to use them.'
  merge: -1
  pgno: 55
- img_proc: true
  md: "# Making components available to the REPL\n\nWe're going to modify our script\
    \ from the previous section in order to emulate our LED. To do this, we're going\
    \ to use the `this.repl.inject()` function. The `this` keyword, when used within\
    \ our `board.on('ready')` handler, is a reference to the global context, so we\
    \ can access the REPL for the program we are working on with `this.repl`. The\
    \ `inject` method accepts an object; the keys of object will represent the names\
    \ you can access from the REPL, and the values will be the components you wish\
    \ to access.\n\nSo, we're going to pass the following object to the `inject` method.\
    \ It will allow us to access our LED component by the `myLed` name:\n\n```\n{\n\
    \  myLed: led\n}\n```\n\nOur new program looks like this:\n\n```\nvar five = require(\"\
    johnny-five\");\n\nvar board = new five.Board();\n\nboard.on(\"ready\", function()\
