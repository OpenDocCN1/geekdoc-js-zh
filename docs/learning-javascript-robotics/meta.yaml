  md: '# Exploring the servo API with the REPL


    The most basic thing we can do with a servo is to set it to a specific angle.
    We do this by calling the .to() function with a degree, as follows:


    ```

    > servo.to(90);

    ```


    This should center the servo. You can also set a time on the .to() function, which
    can take a certain amount of time:


    ```

    > servo.to(20, 500);

    ```


    This will move the servo from 90 degrees to 20 degrees in over 500 ms.


    You can even determine how many steps the servo takes to get to the new angle,
    as follows:


    ```

    > servo.to(120, 500, 10);

    ```


    This will move the servo to 120 degrees in over 500 ms in 10 discrete steps.


    The .to() function is very powerful and will be used in the majority of your Servo
    objects. However, there are many useful functions. For instance, checking whether
    servo is calibrated correctly is easier when you can see all angles quickly. For
    this, we can use the .sweep() function, as follows:


    ```

    > servo.sweep();

    ```


    This will sweep the back and forth between its minimum and maximum values, which
    are 0 and 180, unless set in the constructor via the range property. You can also
    specify a range to sweep:


    ```

    > servo.sweep({ range: [20, 120] });

    ```


    This will sweep the servo from 20 to 120 repeatedly. You can also set the interval
    property, which will change how long the servo sweep takes, and a step property,
    which sets the number of discrete steps taken, as follows:


    ```

    > servo.sweep({ range: [20, 120], interval: 1000, step: 10 });

    ```


    This will cause the servo to sweep from 20 to 120 every second in 10 discrete
    steps.


    You can stop a servo''s movement with the .stop() method, as follows:


    ```

    > servo.stop();

    ```


    # Tip


    For continuous servos, you can use .cw() and .ccw() with a speed between 0 and
    255 to move the'
  merge: -1
