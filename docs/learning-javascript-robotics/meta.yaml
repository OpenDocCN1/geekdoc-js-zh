- md: "\nNow that we've got a button working, let's set up our potentiometer and discover\
    \ some other events related to input and sensor devices. Our project will set\
    \ the brightness of the LED to correlate to the input from the potentiometer—we're\
    \ building a dimmer switch, essentially.\n\n## Wiring the potentiometer and the\
    \ LED\n\nGrab your potentiometer and follow the wiring in the following diagram:\n\
    \n![](img/798b2390880773c3e3d0e21417ef58f8_108_0.png)\n\n### Tip\n\nPlease note\
    \ that if you're using the setup from your button project, the LED pin changes\
    \ in this one, so make sure that you move it, too.\n\n## Coding our dimmer switch\n\
    \nAs we write code, you'll notice that there is no potentiometer object in Johnny-Five.\
    \ That's fine. As the potentiometer is a very basic sensor, we'll be using the\
    \ Sensor object instead.\n\nNext, let's take a look at the events that we'll be\
    \ using. The change event fires when the input from the potentiometer changes,\
    \ so we'll use this event to trigger our LED change. In order to get the reading,\
    \ we'll use this.value, as explained in the documentation.\n\nNow, let's think\
    \ about how LEDs work and the input from the potentiometer. The LED can be set\
    \ from 0 to 255, and the potentiometer can take an input from 0 to 1023. We can\
    \ do that to scale these outputs, but luckily, Johnny-Five has a function to help\
    \ us out. This is called the scale(min, max) function. It will scale our input\
    \ to the number that we give it; in case, 0 and 255. We will use this.value to\
    \ reference the scaled value. If you want to see the unscaled value in the event\
    \ handler, you can use this.raw.\n\nWe can use the scale function before the event\
    \ listener call to scale our potentiometer's output to our LED can understand.\n\
    \nWith this in mind, we can write the code for our dimmer switch. Go ahead and\
    \ place the following code in dimmer-switch.js:\n\n```\nvar five = require('johnny-five');\n\
    \nvar board = new five.Board();\n\nboard.on('ready', function() {\n  var pot =\
    \ new five.Sensor('A0');\n  var led = new five.Led(11);\n\npot.scale(0, 255).on('change',\
    \ function () {\n  console.log('The scaled potentiometer value is: ' + this.value);\n\
    \  console.log('The raw potentiometer value is: ' + this.raw);\n  led.brightness(this.value);\n\
    });\n});\n```\n\nStart the script using the following:\n\n- > node dimmer-switch.js\n\
    \nTry this by twisting the potentiometer. Data should log in to your terminal\
    \ as follows:\n\n```\nThe scaled potentiometer value is: 74.37396244634874\nThe\
    \ raw potentiometer value is: 301.63890680523803\nThe scaled potentiometer value\
    \ is: 302.62885480799886\nThe raw potentiometer value is: 302.8240058939161\n\
    The scaled potentiometer value is: 74.09539178735557\nThe raw potentiometer value\
    \ is: 301.57111356231685\nThe scaled potentiometer value is: 74.632921110873423\n\
    The raw potentiometer value is: 301.4885653356211\nThe scaled potentiometer value\
    \ is: 74.48094674842879\nThe raw potentiometer value is: 301.5917947248009\nThe\
    \ scaled potentiometer value is: 74.67831233463977\nThe raw potentiometer value\
    \ is: 302.1139593013772\n```\n\n## The output from dimmer-switch.js\n\nThe brightness\
    \ of the LED should change accordingly. Now that we have a good grasp on input\
    \ devices, we'll take a look at sensors, using a photocell and a temperature sensor.\n\
    \n## Using sensors – Light and Temperature\n\nNow, we'll build a couple of projects\
    \ that demonstrate how to use more advanced sensors: a **photocell** and a **temperature**\
    \ sensor. We'll learn how specialized Johnny-Five Sensor objects allow us to make\
    \ these easier to use, and how to play with inputs in the REPL and show some input\
    \ data in the console using a module called `barcli`.\n\n## Wiring up our photocell\n\
    \nFirst, we'll start with the photocell—see the following wiring diagram:\n\n\
    ![](img/798b2390880773c3e3d0e21417ef58f8_112_0.png)\n\n> *The wiring diagram for\
    \ the photocell*\n\n### Tip\n\nNote that the resistor setup is how we wire up\
    \ a sensor with only two leads and we need three—input, power, and ground.\n\n\
    ## Coding our photocell example\n\nAs we code our photocell example, we'll note\
    \ that there is no photocell object so we're going to use the generic Sensor object\
    \ as we did with the potentiometer. For outputting the data that we get from the\
    \ sensor, we're going to use a handy utility called barcli to make our output\
    \ easier to read.\n\nIn the early days of Johnny-Five, one of the most common\
    \ ways to check data was to log the data on every change. This got messy quickly\
    \ with thousands of lines printed out to the console. This is not very useful,\
    \ as shown in the following:\n\n```\n32.4568812660873\n27.8774541481502\n35.5163257897961\n\
    86.4250219179646\n355.6769328412\n257.883966591209\n34.698576128218\n122.36932369365983\n\
    351.917441117915\n274.548653352402\n120.491192303597\n181.224227930578\n257.202807529003\n\
    193.855884298956\n361.467799863834\n256.526252354680\n375.865188892321\n172.1906797966040\n\
    64.688491085799\n362.560875028371\n383.669315688775\n196.574728262658\n277.260777248674\n\
    332.7016864311779\n96.2372131842512\n181.6236798338290\n11.3889004452329\n53.23780384570175\n\
    363.8311206363154\n290.7709912315249\n260.388778670752\n72.2448651939563\n214.3381392952331\n\
    203.8754901848733\n```\n\n### Output before barcli\n\nLuckily, Donovan Buck (who\
    \ we'll see again in the Animation chapter) wrote a handy Node module barcli (pronounced\
    \ BAHR-LEE) that makes it easier to render bar graphs in the console. This is\
    \ the best way to show sensor data in the console, because you can see it being\
    \ updated in real time, and it's much more readable than thousands of lines of\
    \ integers!\n\nYou can find barcli here: https://github.com/dtex/barcli. In order\
    \ to install barcli so that you can use it in the same folder as your code, run\
    \ the following:\n\n- > npm install barcli\n\nIn order to create our graph with\
    \ the range of our photocell (0 to 1023), we'll use the following code:\n\n```\n\
    var barcli = require('barcli');\nvar graph = new barcli({\n  label: 'photocell',\n\
    \  range: [0, 1023]\n});\n```\n\nTo set the graph, we'll use the following:\n\n\
    graph.set([photocell value]);\n\nThese graphs are much easier to read, as shown\
    \ in the following example:\n\n![](img/798b2390880773c3e3d0e21417ef58f8_114_0.png)\n\
    \n## A barcli graph in the console\n\n## Coding everything together\n\nUsing our\
    \ knowledge of Johnny-Five, the Sensor object, and now barcli, we can write the\
    \ following in photocell.js:\n\n```\nvar five = require('johnny-five');\nvar Barcli\
    \ = require('barcli');\n\nvar board = new five.Board();\nvar graph = new Barcli({\n\
    label: 'Photocell',\nrange: [0, 1023]\n});\n\nboard.on('ready', function() {\n\
    \  var photocell = new five.Sensor('A0');\n\n  photocell.on('data', function()\
    \ {\n    graph.update(this.value);\n  });\n});\n```\n\nNow that we've written\
    \ the code, run it with the following:\n\n- > node photocell.js\n\nThe bar graph\
    \ in your console should be updated as you cover up or shine light on the photocell.\
    \ Now that we've explored a typical Sensor object, let's take a look at a specialized\
    \ one using our temperature sensor.\n\n## Wiring up the temperature sensor\n\n\
    Use the following diagram to wire up your TMP36 or LM35:\n\n![](img/798b2390880773c3e3d0e21417ef58f8_116_0.png)\n\
    \n## Wiring up the temperature sensor\n\n### Tip\n\nOne way to check that your\
    \ TMP36 or LM35 is wired correctly is by wiring it and then plugging it into your\
    \ computer. The diagram assumes the flat side is facing you, but it's always good\
    \ to double-check!\n\n## Coding our temperature example\n\nLooking at the API\
    \ for the temperature sensor, we'll notice that there are no special API calls.\
    \ However, there are special attributes of this object inside our data handler.\
    \ These attributes allow us to access the Fahrenheit, Celsius, and Kelvin readings\
    \ for our temperature sensor without doing the translation math.\n\nWith our prior\
    \ knowledge of Sensor objects and barcli, we can write the following in temperature.js:\n\
    \n```\nvar five = require('johnny-five');\nvar Barcli = require('barcli');\n\n\
    var board = new five.Board();\n\nvar fahrenheitGraph = new Barcli({\n  label:\
    \ 'Fahrenheit',\n  range: [20, 120]\n});\n\nvar celsiusGraph = new Barcli({\n\
    \  label: 'Celsius',\n  range: [6, 50]\n});\n\nvar kelvinGraph = new Barcli({\n\
    \  label: 'Kelvin',\n  range: [250, 325]\n});\n\nboard.on('ready', function()\
    \ {\n  var temp = new five.Temperature('A0');\n\n  temp.on('data', function(err,\
    \ data) {\n    fahrenheitGraph.update(data.fahrenheit);\n    celsiusGraph.update(data.celsius);\n\
    \    kelvinGraph.update(data.kelvin);\n  });\n});\n```\n\nNow, just run this with\
    \ the following:\n\n- > node temperature.js\n\nWe should see three bar graphs\
    \ in the console as follows:\n\n![](img/798b2390880773c3e3d0e21417ef58f8_117_0.png)\n"
  mdcn: "\n既然我们已经让按钮工作了，现在让我们设置电位器，并发现其他与输入和传感器设备相关的事件。我们的项目将设置 LED 的亮度与电位器的输入相关联——本质上，我们正在构建一个调光开关。\n\
    \n## 接线电位器和 LED\n\n拿起你的电位器，并按照下面的图进行接线：\n\n![](img/798b2390880773c3e3d0e21417ef58f8_108_0.png)\n\
    \n### 提示\n\n请注意，如果你使用的是按钮项目中的设置，那么 LED 引脚在本次中发生了变化，所以请确保你也移动了它。\n\n## 编写我们的调光开关代码\n\
    \n在编写代码时，你会发现 Johnny-Five 中没有电位器对象。这没关系。由于电位器是非常基础的传感器，我们将使用 `Sensor` 对象来代替。\n\
    \n接下来，让我们看看我们将将使用的事件。`change` 事件在电位器的输入发生变化时触发，因此我们将使用该事件来触发 LED 的变化。为了获取读取值，正如文档中所解释的那样，我们将使用\
    \ `this.value`。\n\n现在，让我们思考 LED 的工作原理以及电位器的输入。LED 的设置范围是从 0 到 255，而电位器可以接受 0 到\
    \ 1023 的输入。我们可以通过此对这些输出进行缩放，但幸运的是，Johnny-Five 有一个函数可以帮助我们。这被称为 `scale(min, max)`\
    \ 函数。它会将我们的输入缩放到我们给出的数字；在这种情况下是 0 和 255。我们将使用 `this.value` 来引用缩放后的值。如果你想在事件处理程序查看未缩放的值，可以使用\
    \ `this.raw`。\n\n我们可以在调用事件监听器之前使用 `scale` 函数，将电位器的输出缩放到 LED 能够理解的范围。\n\n考虑到这些，我们可以为调光开关编写代码。请将以下代码放入\
    \ `dimmer-switch.js` 中：\n\n```\nvar five = require('johnny-five');\n\nvar board\
    \ = new five.Board();\n\nboard.on('ready', function() {\n  var pot = new five.Sensor('A0');\n\
    \  var led = new five.Led(11);\n\npot.scale(0, 255).on('change', function () {\n\
    \  console.log('The scaled potentiometer value is: ' + this.value);\n  console.log('The\
    \ raw potentiometer value is: ' + this.raw);\n  led.brightness(this.value);\n\
    });\n});\n```\n\n使用以下命令启动脚本：\n\n- > node dimmer-switch.js\n\n尝试扭动电位器。数据应该如下所示日志到你的终端中：\n\
    \n```\nThe scaled potentiometer value is: 74.37396244634874\nThe raw potentiometer\
    \ value is: 301.63890680523803\nThe scaled potentiometer value is: 302.62885480799886\n\
    The raw potentiometer value is: 302.8240058939161\nThe scaled potentiometer value\
    \ is: 74.09539178735557\nThe raw potentiometer value is: 301.57111356231685\n\
    The scaled potentiometer value is: 74.632921110873423\nThe raw potentiometer value\
    \ is: 301.4885653356211\nThe scaled potentiometer value is: 74.48094674842879\n\
    The raw potentiometer value is: 301.5917947248009\nThe scaled potentiometer value\
    \ is: 74.67831233463977\nThe raw potentiometer value is: 302.1139593013772\n```\n\
    \n## dimmer-switch.js 的输出\n\nLED 的亮度应该随之改变。现在我们已经很好地掌握了输入设备，我们将查看传感器，使用光敏电阻和温度传感器。\n\
    \n## 使用传感器 – 光照和温度\n\n现在，我们将构建两个项目来演示如何使用更高级的传感器：**光敏电阻**和**温度**传感器。我们将学习专门的 Johnny-Five\
    \ `Sensor` 对象如何让这些传感器的变得更易用，以及如何在 REPL 中操作输入并使用一个名为 `barcli` 的模块在控制台中显示一些输入数据。\n\
    \n## 接线光敏电阻\n\n首先，我们从光敏电阻开始——参见下面的接线图：\n\n![](img/798b2390880773c3e3d0e21417ef58f8_112_0.png)\n\
    \n> *光敏电阻的接线图*\n\n### 提示\n\n注意，电阻设置是我们连接只有两个引脚的传感器的方式，而我们需要三个引脚——输入、电源和地。\n\n\
    ## 编写我们的光敏电阻示例\n\n在编写光敏电阻示例时，我们会注意到没有光敏电阻对象，因此我们将像处理电位器一样使用通用的 `Sensor` 对象。为了输出从传感器处获得的数据，我们将使用一个名为\
    \ `barcli` 的方便工具来让我们的输出更易读。\n\n在 Johnny-Five 早期，检查数据的最常用方法之一是记录数据。这很快就会在控制台中打印出成千上万行。这并不好用，如下所示：\n\
    \n```\n32.4568812660873\n27.8774541481502\n35.5163257897961\n86.425021917964\n\
    355.6769328412\n257.883966591209\n34.698576128218\n122.36932369365983\n351.917441117915\n\
    274.548653352402\n120.491192303597\n181.224227930578\n257.202807529003\n193.855884298956\n\
    31.467799863834\n256.526252354680\n375.865188892321\n172.190679796604\n64.688491085799\n\
    362.560875028371\n383.669315688775\n196.574728262658\n277.260777248674\n332.7016864311779\n\
    96.2372131842512\n181.6236798338290\n11.3889004452329\n53.23780384570175\n363.8311206363154\n\
    290.7709912315249\n260.388778670752\n72.2448651939563\n214.3381392952331\n203.875490184873\n\
    ```\n\n### 使用clicli 输出\n\n幸运的是，Donovan Buck（我们将在动画章节再次看到）编写了一个方便的 Node 模块 `barcli`（读作\
    \ BAHR-LEE），它让在控制台中渲染条形图变得更容易。这是在控制台中显示传感器数据的最佳方法，因为你可以实时看到更新，而且比成千行整数易读得多！\n\n\
    你可以在这里找到 barcli：https://github.com/dtex/barcli。为了在代码文件夹中使用 barcli，请运行以下命令：\n\n\
    - > npm install barcli\n\n为了创建一个范围为光敏电阻（0 到 1023）的图表，我们将使用以下代码：\n\n```\nvar barcli\
    \ = require('barcli');\nvar graph = new barcli({\n  label: 'photocell',\n  range:\
    \ [0, 1023]\n});\n```\n\n为了设置图表，我们将使用以下代码：\n\ngraph.set([photocell value]);\n\n\
    这些图表要易读得多，如下所示：\n\n![](img/798b2390880773c3e3d0e21417ef58f8_114_0.png)\n\n## 控制台中的\
    \ barcli 图\n\n## 整合代码\n\n利用对 Johnny-Five、`Sensor` 对象以及现在的 `barcli` 的知识，我们可以在 `photocell.js`\
    \ 中编写以下代码：\n\n```\nvar five = require('johnny-five');\nvar Barcli = require('barcli');\n\
    \nvar board = new five.Board();\nvar graph = new Barcli({\nlabel: 'Photocell',\n\
    range: [0, 1023]\n});\n\nboard.on('ready', function() {\n  var photocell = new\
    \ five.Sensor('A0');\n\n  photocell.on('data', function() {\n    graph.update(this.value);\n\
    \  });\n});\n```\n\n现在代码写好了，使用以下命令运行它：\n\n- > node photocell.js\n\n当你遮挡或光照光敏电阻时，控制台中的条形图应该会更新。现在我们已经探索了典型的\
    \ `Sensor` 对象，让我们来看看一个使用温度传感器的特殊对象。\n\n## 接线温度传感器\n\n使用下面的图表接线你的 TMP36 或 LM35：\n\
    \n![](img/798b2390880773c3e3d0e21417ef58f8_116_0.png)\n\n## 接线温度传感器\n\n### 提示\n\
    \n检查 TMP36 或 LM35 接线正确的一种方法是先接线然后插入电脑。图表假设平坦的一面对朝你，但双重检查总是好的！\n\n## 编写我们的温度示例\n\
    \n查看温度传感器的 API，我们会发现没有特殊的 API 调用。但是，我们的数据处理器内部有特殊的属性。这些属性允许我们在不需要进行转换数学的情况下，访问华氏、摄氏和开尔文读取值。\n\
    \n利用我们对传感器对象和 `barcli` 的知识，我们可以在 `temperature.js` 中编写以下代码：\n\n```\nvar five =\
    \ require('johnny-five');\nvar Barcli = require('barcli');\n\nvar board = new\
    \ five.Board();\n\nvar fahrenheitGraph = new Barcli({\n  label: 'Fahrenheit',\n\
    \  range: [20, 120]\n});\n\nvar celsiusGraph = new Barcli({\n  label: 'Celsius',\n\
    \  range: [6, 50]\n});\n\nvar kelvinGraph = new Barcli({\n  label: 'Kelvin',\n\
    \  range: [250, 325]\n});\n\nboard.on('ready', function() {\n  var temp = new\
    \ five.Temperature('A0');\n\n  temp.on('data', function(err, data) {\n    fahrenheitGraph.update(data.fahrenheit);\n\
    \    celsiusGraph.update(data.celsius);\n    kelvinGraph.update(data.kelvin);\n\
    \  });\n});\n```\n\n现在，只需使用以下命令运行它：\n\n- > node temperature.js\n\n我们应该在控制台中看到如下三个条形图：\n\
    \n![](img/798b2390880773c3e3d0e21417ef58f8_117_0.png)\n\n"
