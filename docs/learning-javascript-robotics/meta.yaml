    # External Devices


    SPI, I2C, and some other protocols get really complex, but there''s a whole other
    world of devices we can also use with our Johnny-Five projects. These technically
    fall outside the scope of the Johnny-Five library, but works well with the library
    due to their use of Node.JS. Let''s take a look at the "why" and the "how" of
    external devices with Johnny-Five.'
  - '[PAGE 197]


    # Why External Devices?


    Microcontrollers are amazing! They can do a litany of things—input, output, and
    so on - but sometimes you see a new device that doesn''t plug in to a microcontroller.
    Perhaps it contains a microcontroller of its own—such a quadcopter or a drone!
    This section covers the use of these devices with Node and integrating them into
    your Johnny-Five projects.


    Some real cool examples that have been integrated into Johnny-Five projects are
    as follows: video game controllers; the LeapMotion controller, a gesture sensor
    that tracks hand position and movement; and Wi-Fi-enabled controllers, such as
    the Parrot AR drones.


    But how do we communicate with devices without using Johnny-Five? The answer actually
    lies within Johnny-Five itself: node-serialport, a library that handles serial
    connections via Node.JS. Let''s take a look at how this library enables us to
    build the amazing world of NodeBots.


    # node-serialport


    As early as five years ago, NodeBots didn''t exist. As early as ten years ago,
    they weren''t even a thought—JavaScript was a browser language, after all. However,
    with the advent of Node, all sorts of new technologies were available to Node.


    Serial connections are the communications channel between all sorts of devices—such
    as printers, webcams—and many of the peripherals we use on a daily basis. In 2009,
    Chris Williams (often cited as the Godfather of NodeBots!) created node-serialport.
    The node-serialport library allows you to communicate with serial devices using
    Node.JS.


    At first, this didn''t create the explosion of NodeBots you''d expect by reading
    a book like this—it was still a very specialized thing to get a serial connection
    working. However, shortly after the creation of node-serialport, Rick Waldron
    wrote Johnny-Five on top of it. That''s right; under its hood, Johnny-Five uses
    node-serialport to speak to the Arduino boards we are using in our examples.


    However, there are other devices that have made their way to Node using libraries
    outside node-serialport; these include gamepads meant for playing games on the
    PC. Many devices that you can add to your computer via USB can now be used with
    Node, thanks to another library called node-hid.


    # node-hid


    The node-hid library is for using Human Interface Device (HID) devices, such as
    gamepads. HID is a part of the USB specification and allows many peripherals to
    speak to a computer in a way that is easily understood and emulated.


    Some of the most popular HID devices used are gamepads, computer, and retro system
    emulators. In our next build, we''ll explore how to use these external devices
    with Johnny-Five, using'
