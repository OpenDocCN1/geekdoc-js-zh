    \ technical articles, sign up for a range of free newsletters and receive exclusive\
    \ discounts and offers on Packt books and eBooks.\n\nhttps://www2.packtpub.com/books/subscription/packtlib\n\
    \nDo you need instant solutions to your IT questions? PacktLib's online digital\
    \ book library. Here, you can search, access, and read Packt's entire library\
    \ of books.\n\n## Why subscribe?\n\n- Fully searchable across every book published\
    \ by Packt\n- Copy and paste, print, and bookmark content\n- On demand and accessible\
    \ via a web browser\n\n## Free access for Packt account holders\n\nIf you have\
    \ an account with Packt at www.PacktPub.com, you can use this to access PacktLib\
    \ today and view 9 entirely free books. Simply use your login credentials for\
    \ immediate access.\n\n## Preface\n\nHello! Welcome to *Learning JavaScript Robotics*.\
    \ In this book, you'll learn how to write code for Arduino and other robotics\
    \ platforms in JavaScript using Johnny-Five. We'll cover the basics of Johnny-Five,\
    \ input and output devices, and even movement devices such as servos and motors.\
    \ Finally, we'll cover how to connect your bots to the Internet and move your\
    \ Johnny-Five code between different platforms.\n\n## What this book covers\n\n\
    Chapter 1, Getting Started with JS Robotics, will get you started by setting up\
    \ an Arduino Uno and exploring the world of NodeBots.\n\nChapter 2, Working with\
    \ Johnny-Five, covers the basics of Johnny-Five, including Read-Eval-Print-Loop\
    \ (REPL), and we will build our first project.\n\nChapter 3, Using Digital and\
    \ PWM Output Pins, covers basic output devices, using both digital and PWM pins.\n\
    \nChapter 4, Using Specialized Output Devices, covers specialized outputs that\
    \ use one or multiple pins.\n\nChapter 5, Using Input Devices and Sensors, covers\
    \ input devices using analog and GPIO pins.\n\nChapter 6, Moving Your Bot, covers\
    \ basic servo and motor usage with Johnny-Five.\n\nChapter 7, Advanced Movement\
    \ with the Animation Library, covers the Animation Library and how to create advanced\
    \ movement schemes for your NodeBots.\n\nChapter 8, Advanced Components – SPI,\
    \ I2C, and Other Devices, covers the use of I2C, SPI, and other advanced components\
    \ with Johnny-Five.\n\nChapter 9, Connecting NodeBots to the World, and Where\
    \ to Go Next, covers how to connect your NodeBots to the Internet and use Johnny-Five\
    \ code with platforms other than Arduino.\n\n## What you need for this book\n\n\
    You will need the following factors before you start on the book:\n\n- A basic\
    \ working knowledge of JavaScript and Node.JS\n- A computer with USB ports that\
    \ support node-serialport, running Node.JS 4.x\n- An Arduino Uno or other supported\
    \ board supported by Johnny-Five (see http://johnny-five.io/platform-support/)\
    \ and a USB cable for the board\n- Light-Emitting Diodes (LEDs) - having a dozen\
    \ should let you finish all the examples with room for error.\n- A Piezo element\n\
    - A character LCD (one with an I2C interface is fine)\n- A push-button that is\
    \ breadboard friendly\n- A rotating potentiometer that is breadboard friendly\n\
    - A light-sensing diode\n- A basic temperature sensor\n- Three hobby servos that\
    \ runs on 5v\n- One hobby motor that runs on 5v\n- An ADXL3452C Accelerometer\n\
    - An LED matrix kit from SparkFun—product number DEV-11861\n- A GamePad—RetroLink\
    \ N64 controller or a DualShock3\n- (Optional) A Particle Photon microcontroller\n\
    \n## Who this book is for\n\nIf you've worked with Arduino before or are new to\
    \ electronics and would like to try writing sketches in JavaScript, then this\
    \ book is for you. A basic knowledge of JavaScript and Node.js will help you get\
    \ the most out of this book.\n\n## Conventions\n\nIn this book, you will find\
    \ a number of text styles that distinguish between different kinds of information.\
    \ Here are some examples of these styles and an explanation of their meaning.\n\
    \nCode words in text, database table names, folder names, filenames, file extensions,\
    \ pathnames, dummy URLs, user input, and Twitter handles are shown as follows:\
    \ \"For instance, the LED object has `on()` and `off()` function that turns the\
    \ LED on and off.\"\n\nA block of code is set as follows:\n\n```\nvar myPin =\
    \ new five.Pin(11);\nmyPin.on('high', function(){\n  console.log('pin 11 set to\
    \ high!');\n});\n```\n\nWhen we draw your attention to a particular part of a\
    \ code block, the relevant lines or items are set in bold:\n\n```\nvar myPin =\
    \ new five.Pin(11);\nmyPin.on('high', function(){\n  console.log('pin 11 set to\
    \ high!');\n});\n```\n\nAny command-line input or output is written as follows:\n\
    \n> > node-repl.js\n\n**New terms** and **important words** are shown in bold.\
    \ Words you see on the screen, for example, in menus or dialog boxes, appear in\
    \ the text like: \"Now, we'll build a couple of projects that demonstrate how\
    \ to use more sensors: a **photocell** and a **temperature** sensor.\",\n\n# Note\n\
    \nWarnings or important notes appear in a box like this.\n\n# Tip\n\nTips and\
    \ tricks appear like this.\n\n## Reader feedback\n\nFeedback from our readers\
    \ is always welcome. Let us know what you think about this book—what you liked\
    \ or disliked. Reader feedback is important for us as it helps us develop titles\
    \ that you will really get the most of.\n\nTo send us general feedback, simply\
    \ e-mail <feedback@packpub.com>, and mention the book's title in the subject of\
    \ your message.\n\nIf there is a topic that you have expertise in and you are\
    \ interested in either writing or contributing to a book, see our author guide\
    \ at www.packpub.com/authors.\n\n## Customer support\n\nNow that you are the proud\
    \ owner of a Packt book, we have a number of things to help you to get the most\
    \ from your purchase.\n\n## Downloading the example code\n\nYou can download the\
    \ example code files from your account at http://www.packpub.com for all the Packt\
    \ Publishing books you have purchased. If you purchased this book elsewhere, you\
    \ can visit http://www.packpub.com/support and register to have the files e-mailed\
    \ directly to you.\n\n## Downloading the color images of this book\n\nWe also\
    \ provide you with a PDF file that has color images of the screenshots/diagrams\
    \ used in this book. The color images will help you better understand the changes\
    \ in the output. You can download this file from: https://www.packpub.com/sites/default/files/downloads/3347OS_ColoredImages.pdf.\n"
  mdcn: "\n\n## 关于评审者\n\nChris S. Crawford (@chris_crawford_) 是佛罗里达大学以人为本计算专业的博士生。他目前在人类体验研究实验室的脑机接口研究小组担任研究生研究员。他的研究重点是人机交互，包括研究如何利用脑电图（EEG）等生理信号来增强人机交互。Chris\
    \ 在感知计算、3D 计算机图形学、电视投票以及原生/Web 应用开发等多个领域拥有工作经验。目前，他还担任 SeniorGeek Communications,\
