    });\n});\n```\n\n它的工作原理如下：它与我们在上一章中编写的传感器代码相似！只是在数据事件期间，我们告诉舵机根据来自光敏电阻的缩放数据移动到正确的位置。运行以下命令行：\n\
    \n- > `node photoresistor-servo.js`\n\n然后，尝试打开灯并遮住你的光敏电阻，观察舵机的移动！\n\n# 总结\n\n\
    我们现在知道如何使用舵机和电机来驱动我们的机器人项目了。轮式机器人已经就绪了！但更复杂的项目呢，例如六足机器人？行走需要精确的时间控制。正如我们在 `.to()`\
    \ 函数中提到的，得益于 `Animation` 库，我们可以对舵机的运动进行计时。\n\n在下一章中，我们将讨论 `Animation` 库，并进行一些让几个舵机按顺序和组合移动的项目。\n\
    \n## 第 7 章：使用 Animation 库进行高级运动\n\n现在我们已经在机器人项目中实现了基础动作，我们将开始探索如何创建定时的复杂动作。起初看起来可能很令人生畏——仅仅跟踪一个舵机就已经够难了！幸运的是，Johnny-Five\
    \ 中的 `Animation` 库让这些复杂动作变得更容易理解和编程。在本章中，我们将探索使 `Animation` 库变得特殊之处，并开始处理一些舵机动画。我们将涵盖以下主题：\n\
    \n- 什么是 Animation API？\n- 观察 Animation API\n- 编写舵机动画\n- 动画事件\n\n# 本章所需的材料\n\n\
    你需要你的微控制器——非常建议在本章中使用 Arduino Uno，因为它的兼容性很好。你还需要一根 USB 线、面包板、一些跳线线以及你在第 4 章《使用特殊输出设备》中使用的\
    \ LCD。你还需要三个标准舵机。如果可能的话，舵机应该是同一品牌和型号——这将有助于我们的项目。\n\n## 什么是 Animation API？\n\n\
    本章的标题引出了很多问题——什么是 Animation API？它如何与舵机相关？这里还使用了许多术语。首先，让我们讨论 Animation API 的产生和发展，以提供一些背景信息。\n\
    \n## 为什么我们需要 Animation API？\n\nAnimation API 的创建基于 Donovan Buck 和 Rick Waldron\
    \ 在行走机器人方面开始的工作——Rick 构建了一个四足机器人，而 Donovan 构建了一个六足机器人。事实证明，行走机器人对涉及的舵机需要大量的计时，而当时的\
    \ Johnny-Five 库仅能够最高速度运行舵机从一个角度到另一个角度。这使得行走变得非常困难，因为即使是相同品牌型号的舵机，最大速度也略有不同。此外，在某些情况下，你希望不同的舵机以不同的速度移动——这在\
    \ Animation API 出现之前也是无法实现的。\n\n这导致了一个函数的开发，它允许你通过提供完成时间来设置给定运动的速度——我们在上一节中探索了这些函数。你还可以设置一组离散的运动。虽然这些确实有助于行走机器人的代码，但该\
    \ API 还有另一个巨大的优势，这也是为什么这个名字看起来很奇怪。\n\n## 为什么是动画？\n\n动画是对随时间运动的描述。关键帧（Keyframes）用于动画中在给定时间设置关键位置——有多个动画库会计算这些关键帧之间的帧，被称为补帧（tweening）。Johnny-Five\
    \ 中的 Animation API 允许你为舵机运动设置关键帧，然后由它为你完成补帧——允许你通过程序定义一组随时间变化的运动，就像动画状态的定义一样。\n\
    \n这对于移动机器人非常有用——计算移动到特定点的腿部每个舵机的速度，对于即使是最熟练的程序员来说也是令人头疼的。Animation API 为我们补帧的能力意味着我们可以设置关键帧并让代码完成其余工作。这意味着即使是移动机器人初学者也能创建复杂的动作。\n\
    \n现在我们有了一些背景知识，让我们俯瞰 Animation API 以及描述和与其交互的各种方式。\n\n# 观察 Animation API\n\nAnimation\
    \ API 提供了一种定义复杂运动的强大方式。API 的核心是段（segment），它代表了在一段时间内的特定运动。每个段包含一个或多个关键帧，这些关键帧定义了舵机在特定点的状态。API\
    \ 然后处理这些关键帧之间的插值，创建平滑的过渡。\n\n要使用 Animation API，你需要创建一个动画对象。然后你可以对其添加段。在每个段中，你可以定义关键帧。这里有一个创建一个简单动画的示例：\n\
    \n```\nvar servo = new five.Servo({\n  pin: 9\n});\n\nvar animation = new five.Animation(servo);\n\
    \nanimation.addSegment({\n  duration: 2000,\n  keyframes: [\n    {time: 0, value:\
    \ 0\n    },\n    {time: 1000, value: 90\n    },\n    {time: 1500, value: 180\n\
    \    },\n    {time: 2000, value: 0\n    }\n  ]\n});\n\nanimation.play();\n```\n\
    \n在这个示例中，舵机将在第一秒内从 0 度到 90 度，然后在半秒内到 180 度，最后回到 0 度。Animation API 为你处理所有的计算。\n\
    \nAPI 还提供了允许你对动画不同阶段做出响应的事件。例如，你可以监听 `complete` 事件以知道动画何时完成。\n\n# 编写舵机动画\n\n现在你理解了\
    \ Animation API 的基础，就可以开始创建更复杂的动画。例如，你可以创建一个模仿六足机器人步态的动画。这涉及到多个舵机的同步工作。你可以使用不同的持续时间和关键帧让动作看起来更自然。\n\
    \n```\nvar leg1 = new five.Servo({\n  pin: 9\n});\nvar leg2 = new five.Servo({\n\
    \  pin: 10\n});\n\nvar animation1 = new five.Animation(leg1);\nvar animation2\
    \ = new five.Animation(leg2);\n\nanimation1.addSegment({\n  duration: 1000,\n\
    \  keyframes: [\n    {time: 0, value: 0\n    },\n    {time: 1000, value: 90\n\
    \    }\n  ]\n});\n\nanimation2.addSegment({\n  duration: 1000,\n  keyframes: [\n\
    \    {time: 0, value: 90\n    },\n    {time: 1000, value: 0\n    }\n  ]\n});\n\
    \nanimation1.play();\nanimation2.play();\n```\n\n# 动画事件\n\nAnimation API 提供了你可以使用的多个事件。常见的有\
    \ 'start''complete' 和 'update'。\n\n- 'start'：动画开始时触发。\n- 'complete'：动画完成时触发。\n\
    - 'update'：在每次舵机位置更新时触发。\n\n```\nanimation.on('start', function() {\n  console.log('Animation\
    \ started!');\n});\n\nanimation.on('complete', function() {\n  console.log('Animation\
    \ complete!');\n});\n\nanimation.on('update', function(value) {\n  console.log('Current\
    \ position: ' + value);\n});\n```\n"
