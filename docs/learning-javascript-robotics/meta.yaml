  raw:
  - '[PAGE 220]


    # # Cylon.js


    Cylon.js is a library much like Johnny-Five, which also supports many platforms.
    Its focus is also slightly broader. While Johnny-Five sticks to making sure that
    microcontroller support is the main focus, Cylon supports other serial peripherals.
    You can find out more about this open-source project at [cylonjs.com](.'
  - '[PAGE 221]


    # JerryScript


    JerryScript is a brand new open-source project from Samsung to get a JavaScript
    engine running in a small enough amount of memory so that it can run on a microcontroller
    without Linux running underneath. While this is a very new and ambitious project,
    if it succeeds, it can usher in a whole new era of JavaScript robotics. You can
    learn more at https://samsung.github.io/jerryscript/.'
  - '[PAGE 222]


    # Tiny Linux computers


    While this is less of a concerted effort and more of a category of devices, there
    are new, smaller, faster Linux machines coming out every few months. From Raspberry
    Pi to Onion Omega, these machines that carry their own GPIO are definitely an
    interesting segment of devices to explore. Many have their own GPIO Node modules
    outside of Johnny-Five. BeagleBone Black has BoneScript, for instance. Keep an
    eye out in the future for more of these tiny computers, and definitely consider
    them for your standalone NodeBots projects.'
  - '[PAGE 223]


    # Vendor libraries


    Many IoT microcontrollers also come with JS libraries to use. For instance, Particle
    has released an npm module to work with their Core and Photon platforms over their
    cloud service using the Spark package. (Note that, because of their company name
    change, this package name may change when this book is published). Many vendors
    are moving to Node on their own terms, so definitely look for an npm package when
    looking at new hardware platforms.'
  - '[PAGE 224]


    # # Where to go from here


    As we near the end of this book, I''ll address the questions that I get most often:
    Where do I go from here? What do I build? Who do I ask for help?


    As for to build, you can do as I do. I keep a small notebook with me, although
    I also use my phone to record thoughts—I think about the small things I''d like
    to have in day-to-day life. What problems can I solve? What would look cool? I
    write down these problems or wants and go over them later. Can I fix this with
    a NodeBot, I ask myself. If I can, awesome! I have my next project. I think you''ll
    find you have more ideas than you thought you did with this method.


    Once you''ve built something, write about it! The NodeBots community loves to
    see how you built something. Don''t worry if it''s not the next terrain-navigating
    hexapod; we''d like to see how you built your Internet-connected Christmas lights
    or your automatic dog-feeder. You can never have too many examples for people
    to look at, and one of the best ways to contribute back is documentation.


    What if you get a new part working? Submit a pull request to Johnny-Five. The
    team is very good about issuing fast and friendly feedback, and will work with
    you to get your component into Johnny-Five. Also, come and say "Hi" in our Gitter
    channel—we''re super friendly and love to meet new users and NodeBotters.


    Thanks for taking this journey through JavaScript Robotics with me! I''m nodebotanist
    on Twitter, GitHub, and just about anywhere—come and say "HI" and show me what
    you''ve built!'
