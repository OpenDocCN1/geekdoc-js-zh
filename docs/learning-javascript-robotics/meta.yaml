    # Chapter 1. Getting Started with JS Robotics


    Welcome to the world of JavaScript robotics! Let''s explore how easy it is to
    get started with writing robotics programs in JavaScript using Arduino and Johnny-Five.


    In this chapter, we will do the following:


    - Explore JS Robotics, NodeBots, and Johnny-Five

    - Set up our development environment

    - Blink an on-board LED


    # Understanding JS Robotics, NodeBots, and Johnny-Five


    JavaScript as a robotics language truly began a few years ago with the creation
    of node-serialport an NPM module written by Chris Williams. This module allows
    Node.JS to communicate with devices over a serial connection; this can include
    the typical serial connections from older computers, or the USB and Bluetooth
    connections that we use every day. What exactly is a NodeBot though, and how do
    we get started with using them with Johnny-Five?


    # What a NodeBot is, and other basic vocabulary


    A NodeBot is any piece of hardware that is controlled using JavaScript and/or
    Node.JS. This can encompass a wide variety of projects; there are hundreds of
    ways to create a NodeBot. In this book, we are going to use the Johnny-Five library,
    an open source project created by Rick Waldron.


    # Note


    For those readers who are new to robotics, a microcontroller is a small computer
    that contains a processor, memory, and input/output pins. This serves as the brain
    of our project—our programs will communicate with or will be loaded onto this
    microcontroller. Microcontrollers come in many shapes and sizes, and with multiple
    capabilities.


    We''re going to use a microcontroller for our projects. What microcontroller should
    you use? Luckily, our use of Johnny-Five means that we can choose from a large
    array of different microcontrollers and still write the same code as you''ll see
    in this book!


    What exactly is Johnny-Five, and how does it make our lives easier?


    # Johnny-Five and the NodeBot revolution


    Johnny-Five (http://johnny-five.io) is an open source robotics library for Node.JS.
    It was created by Rick Waldron and has a thriving community of contributors and
    supporters. This module has been known to work on Windows, Mac, and Linux computers
    without any issues at the time of writing this book using Node.JS version 4.x.


    Johnny-Five was built on top of node-serialport and allows us to write JavaScript
    applications that communicate with different microcontrollers using different
    types of connection. For some newer boards, such as Arduino-compatible boards,
    Johnny-Five uses a serial connection. Johnny-Five emulates this serial connection
    over an Internet service!


    The capability of Johnny-Five to use multiple board types is implemented using
    its wrapper system. Once the core system is installed, you can install a wrapper
    for your particular microcontroller, and the APIs will remain the same. This is
    a powerful concept—you can write code for one platform and quickly move it to
    another without having to change it.


    # What we''ll be using in this book


    For the examples in this book, we''ll use an Arduino Uno. You can get these boards
    from sites such as Adafruit (www.adafruit.com), SparkFun (www.sparkfun.com), and
    so on. You can also use a board that is Arduino Uno-compatible. SainSmart, for
    instance, sells Uno-like boards that will work fine for our purposes. For this
    chapter, you''ll need the board itself and a USB cable for it.


    In later chapters, we''ll be using other components—there will be a table in each
    chapter with an accessible list of materials for the projects within.


    # Setting up your development environment


    Now that we''ve covered the basic ideas, we''re going to set up the development
    environment for our first project. All the software used here worked on Windows,
    Mac, and Linux desktop computers at the time of writing this book.


    # Installing Node.JS


    If you don''t have Node.JS installed, you can download an installer for your platform
    from nodejs.org. This installer will also install NPM or Node Package Manager,
    which will be used to manage the rest of the software.


    Run the installer on your machine, which may require a restart. After this, open
    up terminal and run the following command:


    ```bash

    node --version

    ```


    The output from this command should be 4.x, where x are integers.


    # Setting up your project and installing Johnny-Five


    In your terminal, create a folder for your project and change directories to this:


    ```bash

    mkdir my-robotics-project

    cd my-robotics-project

    ```


    Next, we''re going to install Johnny-Five:


    ```bash

    npm install johnny-five

    ```


    You should see a spinner, followed by some output. Unless you see an error message
    at the end of your output, you''re good to go with Johnny-Five.


    # Note


    On a Mac machine, you may need to install Xcode developer-line tools.


    # Connecting your Microcontroller and installing Firmata


    First, you are still using JavaScript. Yes; however, we must make sure that there''s
    a particular sketch (that''s Arduino-speak program) running on our board in order
    for Johnny-Five to communicate properly.


    You can get the installer at the Arduino website (http://www.arduino.com/en/Main/Software).
    This book assumes that you have version 1.6.4, but the versions in the 1.4 range
    should work as well.


    Once you''ve downloaded the software, open it. Then, we''ll make sure that your
    serial connection works.


    # Note


    If you are using a board other than an Arduino, this step is not necessary. However,
    there may be other steps. These will be outlined with the wrapper plugin for your
    board.


    Plug the USB cable into both the board and the computer. A few LEDs should light
    up on this board— this is normal. Then, go to the Tools menu in the Arduino IDE
    and hover over the ports submenu. You should see a list of ports that looks somewhat
    like the following screenshot.


    ![](img/798b2390880773c3e3d0e21417ef58f8_37_0.png)


    You should see at least one entry in this list that fits the following format:
    /dev/cu.usbmodem**** It may or not have Arduino Uno next to it. If you see this,
    go ahead and click on it, because this is the port you will want to use for the
    Firmata installation. If you have this, it means your board can communicate with
    your computer, and you''re ready to install Firmata.


    To install Firmata on your board, go to File | Examples | Firmata | StandardFirmata,
    as shown in the following screenshot:

    '
