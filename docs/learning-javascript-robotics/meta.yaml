    ## 本章所需的物品


    对于第一个项目，你需要你的微控制器、几根面包板跳线、一个半尺寸的面包板和五个 LED。


    对于第二个项目，你需要你的微控制器、几根面包板跳线、一个半尺寸的面包板以及一个压电元件（Piezo element）。


    ## GPIO 引脚的工作原理


    如果我们回顾上一个项目，可以观察到通过我们编写的代码，我们向 Johnny-Five 中的一个 Led 对象写入值，并改变了 LED 的状态和亮度。这是如何工作的呢？虽然深入细节超出了本书的范围，但我们将简要介绍其工作原理；这使用了
    GPIO，即通用型输入/输出引脚的概念。


    GPIO 引脚是向电路提供电流或从电路中读取电流的引脚。在上一个项目中，我们使用它来为 LED 提供不同水平的电能。这些引脚可以由用户（也就是我们！）配置为输入（读取电流）或输出（提供电流）。现在，我们将重点关注输出引脚，它们主要有两种类型：数字（Digital）和
    PWM。


    ## 数字输出引脚


    数字输出引脚只能为我们的电路提供两个水平的电流：1 和 0，HI 和 LOW，或者开启和关闭。这意味着如果我们将 LED 插入数字引脚，我们只能开启或关闭它。


    然而，在我们的案例中，当我们运行 `pulse()` 方法时，我们的 LED 表现出不同水平的亮度。这意味着什么？这意味着我们在之前的示例中使用了 PWM
    引脚。


    ## PWM 输出引脚


    **PWM（脉冲宽度调制）**引脚能够向我们的电路发送不同水平的电能（某种意义上）。它的工作原理是通过按时间方式非常快速地将引脚设置为 HIGH，然后设为
    LOW，从而模拟不同水平的电能。


    在程序中，你可以将 PWM 引脚设置为 0 到 255 之间的任何值（包含边界）。你设置引脚的值决定了引脚被设置为 HIGH 的频率；例如，值 0 意味着
    PWM 引脚设置为 HIGH 的时间比例为 0%。值 85 是 255 的三分之一，意味着引脚设置为 HIGH 的时间占三分之一——这模拟了三分之一的功率，或者在我们的
    LED 案例中，就是三分之一的亮度。


    我们的第一个示例使用 PWM 引脚来显示 LED 不同程度的亮度，但 PWM 引脚有几乎无限的用途——正如我们在本章稍后看到的，我们甚至可以用它们制作音乐！


    ## 如何区分数字引脚和 PWM 引脚


    你如何检查微控制器上的哪些引脚是 PWM 的？这实际上取决于你正在使用的微控制器。对于我们在书中使用的 Arduino Uno，PWM 引脚用 `~`（波浪线）符号标记。这意味着在
    Uno 上，PWM 引脚是 3, 5, 6, 9, 10 和 11。


    ![](img/798b2390880773c3e3d0e21417ef58f8_66_0.png)


    确定 Arduino Uno 上的 PWM 引脚


    接下来，我们将通过连接多个 LED 并尝试 Led API 来探索引脚之间的差异。


    ## 多个引脚与多个 LED


    对于下一个项目，我们将查看 Led 对象 API 并测试几种不同的方法。这是 Johnny-Five 的优势之一——抽象化。如果你理解 LED 的概念，就可以使用
    Johnny-Five 的 LED 对象，而无需考虑底层的引脚或时序。让我们过一下将在项目将在使用的方法：


    - `on()` 和 `off()`：这些方法用于开启和关闭 LED。在抽象层下，这会将连接到 LED 的引脚设置为 HIGH 和 LOW。我们将在 REPL
    中使用这些。

    - `blink(time)`：这会在给定的间隔内开启和关闭 LED。`strobe()` 和 `blink()` 是彼此的别名，功能相同。

    - `pulse(time)`：这将导致 LED 以平滑的方式脉冲式开启关闭。这需要 LED 连接到 PWM 引脚上。`time` 参数设置脉冲每侧的长度——500
    意味着 LED 在 500 ms 内逐渐淡入，在 500 ms 内逐渐淡出，这意味着一个 1 秒的脉冲。

    - `fade(brightness, ms)`：这将导致 LED 在 ms 毫秒内从当前亮度逐渐淡入或淡出到给定亮度。

    - `stop()`：这会停止发生在 LED 上的任何循环操作。注意，这并不一定会关闭 LED。如果这意味着 LED 是开启的，那就随它吧。它会中断正在进行的动作——


    记住，大多数 Johnny-Five 对象函数都是可链的——你可以一个接一个使用它们。


    ```

    myLed.stop().off()

    ```


    上述代码将停止 LED 上的任何循环事件并将其关闭。


    现在我们已经知道了将要使用的函数，让我们来连接下一个项目。


    ## 准备项目硬件


    准备好材料并查看下图：


    ![](img/798b2390880773c3e3d0e21417ef58f8_68_0.png)


    我们项目的接线图


