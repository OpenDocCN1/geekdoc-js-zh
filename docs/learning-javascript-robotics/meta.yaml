  md: '# Tethering and Johnny-Five


    You may have noticed one limitation of our Arduino setup with Johnny-Five: we
    have to keep our microcontroller attached to our computer via USB and keep the
    Node running on the computer in order to keep Johnny-Five running. Luckily, this
    isn''t the case for all NodeBots on Johnny-Five. For instance, the BeagleBone
    Black runs Node on-board, and so, and, using beaglebone-s, you don''t need to
    tether. You just run the Johnny-Five code straight on the device. This is also
    true for raspi-io for Raspberry Pi and tessel-io for the Tessel 2.


    More and more devices will be added to Johnny-Five as time goes on, and tethering
    limitations will become less and less of an issue accordingly.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# Other JS libraries and platforms


    Johnny-Five is definitely an amazing library and one of the cornerstones of NodeBots.
    However, one of the great things about open source hardware and software is that
    there is a litany of choices for you to explore in the world of NodeBots. I''ll
    go into just a few of the many available, as new choices and projects are popping
    up every day!'
