    \ so you can file issues and make pull requests with your own examples.\n\n##\
    \ Project – character LCD display\n\nFor our project, we're going to connect our\
    \ character LCD to our Arduino Uno board and Johnny-Five to print some messages\
    \ on it. I'll be using an I2C display, but will include wiring diagrams and code\
    \ for non-I2C versions as well.\n\n## Wiring up – I2C LCDs\n\nFirst, we'll describe\
    \ how to wire up an I2C LCD. Note that the image diagram will look different,\
    \ because no component exists in the imaging software for the I2C backpack. There\
    \ is an accompanying diagram to clarify your queries.\n\nYou'll want to look for\
    \ the pins labeled SCL and SDA on the back of your LCD unit—these pins need to\
    \ be connected to two pins on the Arduino Uno that are not clearly labeled on\
    \ all units. These pins are near the USB connector and the reset button. With\
    \ the USB connector facing left, the pins are on the left-most side of the top\
    \ rail of pins—on the left is SCL, and on the right is SDA. On newer boards, these\
    \ are labeled on the side of the pin railing.\n\nOnce these are in place, you'll\
    \ want to connect VCC to 5V and GND to GND. If an LED pin exists, you can wire\
    \ it to 3v3.\n\n![](img/798b2390880773c3e3d0e21417ef58f8_89_0.png)\n\n> No official\
    \ part exists for the i2c backpack yet, so NOTE that this will look a tad different\
    \ (see photo). The orange wire should go to the pin labeled SCL on the backpack,\
    \ red to VCC, black to GND, and brown to LED (if that exists for your LCD)\n\n\
    ## A diagram of an I2C LCD hookup\n\n![](img/798b2390880773c3e3d0e21417ef58f8_90_0.png)\n\
    \nThe photo of an I2C backpack wiring – wiring up regular LCDs\n\nThere are six\
    \ data pins and a few ground and power pins to use when wiring a non-I2C LCD.\
    \ These are:\n\n- rs, en, d4, d5, d6, and d7, and are represented by pins 4, 6,\
    \ 11, 12, 13, and 14 on the LCD. We're going to wire these to pins 8, 9, 4, 5,\
    \ 6, and 7 on the Uno.\n- Pins 2 and 15 are both connected to the main power supply—pin\
    \ 2 powers the LCD itself, and pin 15 powers the backlight LED. Pins 1 and 16\
    \ run to ground to match pins 2 and 15. Pin 3 is connected to a potentiometer—about\
    \ which we'll talk more in the next chapter. For now, note that it looks like\
    \ a small turntable knob. You should have received one with your LCD, and you\
    \ should, for now, wire it as shown in the following diagram—the left-hand side\
    \ to power, the right-hand side to ground, and the middle to pin 3 of the LCD\
    \ (note—you can't get this backwards). This potentiometer controls contrast, and\
    \ is built into I2C LCDs.\n\n## Note\n\nPlease note that, in the following diagram,\
    \ the Arduino Uno has been rotated. Please be sure to be careful while wiring\
    \ this up!\n\n![](img/798b2390880773c3e3d0e21417ef58f8_91_0.png)\n\nIn order to\
    \ check that your wiring is working, you can plug your Arduino into your computer.\
    \ The backlight should turn on, and you should be able to see block characters\
    \ on your LCD. Adjust the potentiometer, if necessary, to see the block characters.\n\
    \n## The code\n\nNow that we have our LCD wired up, we're going to write some\
    \ code in the following sections. While we will do some initialization in the\
    \ code, we will also open up the LCD to the REPL and play with it in real time!\n\
    \n## The I2C version\n\nThe code for the I2C version LCD is as follows:\n\n```javascript\n\
    var five = require(\"johnny-five\");\nvar board = new five.Board();\n\nboard.on(\"\
    ready\", function () {\n  // Controller: PCF8574A (Generic I2C)\n  // Locate the\
    \ controller chip model number on the chip itself.\n  var l = new five.LCD({\n\
    \    controller: \"PCF8574A\"\n  });\n\n  l.print(\"hello!\");\n});\n```\n\n##\
    \ The non-I2C version\n\nThe code for the non-I2C version LCD is as follows:\n\
    \n```javascript\nvar five = require(\"johnny-five\");\nvar board = new five.Board();\n\
    \nboard.on(\"ready\", function () {\n  var l = new five.LCD();\n\n  l.print(\"\
    hello!\");\n});\n```\n"
  mdcn: "\n\n还有一个背光引脚选项；大多数 LCD 都有背光，有些带有 RGB 背光。如果你没有背光，则不需要初始化此参数；如果你是单色背光，则需要注意要设置此选项。\n\
    \n如果你有一块带有 RGB 背光的 LCD，你可能需要查看 LED 子标题下的 `Led.RGB` 类并自己手动实例化它——我们将在项目部分查看这部分的实际代码，但你可以先去查看一下\
    \ RGB LED API 以确保万无一失。\n\n一旦你熟悉了如何在 Johnny-Five 网站上查找信息，你就已经为你的项目解锁了大量信息。有什么遗漏的内容吗？整个页面都是开源的并可以在\
    \ [GitHub](https://github.com/bocoup/johnny-five.io) 上获取，你可以提交问题（issues）并使用自己的示例提交拉取请求（pull\
    \ requests）。\n\n## 项目 – 字符 LCD 显示器\n\n在我们的项目中，我们将字符 LCD 连接到 Arduino Uno 板上，并使用\
    \ Johnny-Five 在其上打印消息。我将使用 I2C 显示器，但也会包含非 I2C 版本的接线图和代码。\n\n## 接线 – I2C LCD\n\n\
    首先，我们将描述如何连接 I2C LCD。请注意，图像图示看起来会有所不同，因为成像软件中不存在 I2C 扩展板的组件。附带的图表将消除你的疑问。\n\n\
    你需要寻找 LCD 单元背面标记为 SCL 和 SDA 的引脚——这些引脚需要连接到 Arduino Uno 上的两个引脚，这些引脚在所有单元上并没有明确标记。它们位于\
    \ USB 接口和重位按钮附近。当 USB 接口面向左侧时，引脚位于顶部引脚列的最左侧——左边是 SCL，右边是 SDA。在较新的板卡上，这些引脚标记在引脚列的侧面。\n\
    \n一旦连接好这些，你需要将 VCC 连接到 5V，将 GND 连接到 GND。如果存在 LED 引脚，你可以将其接到 3v3。\n\n![](img/798b2390880773c3e3d0e21417ef58f8_89_0.png)\n\
    \n> 目前还没有 i2c 扩展板的官方零件，因此请注意（NOTE）这看起来会有所不同（见照片）。橙色线应连接到扩展板上标记为 SCL 的引脚，红色连接 VCC，黑色连接\
    \ GND，棕色连接到 LED（如果你的 LCD 有该引脚）。\n\n## I2C LCD 连接图\n\n![](img/798b2390880773c3e3d0e21417ef58f8_90_0.png)\n\
    \nI2C 扩展板的接线照片 – 连接普通 LCD\n\n在接线非 I2C LCD 时，有六个数据引脚和几个地线电源引脚可以使用。这些是：\n\n- rs,\
    \ en, d4, d5, d6 和 d7，分别由 LCD 上的 4, 6, 11, 12, 13 和 14 号引脚表示。我们将它们连接到 Uno 上的 8,\
    \ 9, 4, 5, 6 和 7 号引脚。\n- 引脚 2 和 15 都连接到主电源——第 2 号引脚为 LCD 本身供电，第 15 号引脚为背光 LED\
    \ 供电。引脚 1 和 16 接到地以匹配引脚 2 和 15。第 3 号引脚连接到一个电位器——我们将在下一章中详细讨论它。现在，请注意它看起来像一个小的转盘旋钮。你应该在收到\
    \ LCD 时已经得到了一个，目前你应该按照下面的图示所示进行接线——左侧接电源，右侧接地，中间连接到 LCD 的第 3 号引脚（注意——你不能接反）。这个电位器控制对比度，并内置在\
    \ I2C LCD 中。\n\n## 注意事项\n\n请注意，在接接图中，Arduino Uno 经过了旋转。在接线时请务必小心！\n\n![](img/798b2390880773c3e3d0e21417ef58f8_91_0.png)\n\
    \n为了检查你的接线是否正常，你可以将 Arduino 插入电脑。背光应该开启，你应该能在 LCD 上看到块状字符。如有必要，调整电位器以看到块状字符。\n\
    \n## 代码\n\n现在我们已经接好了 LCD，我们将在后续章节中编写一些代码。虽然我们在代码中进行一些初始化，但我们还将 LCD 到 REPL 并进行实时操作！\n\
    \n## I2C 版本\n\nI2C 版本 LCD 的代码如下：\n\n```javascript\nvar five = require(\"johnny-five\"\
    );\nvar board = new five.Board();\n\nboard.on(\"ready\", function () {\n  // Controller:\
    \ PCF8574A (Generic I2C)\n  // 在芯片本身上找到控制器芯片的型号。\n  var l = new five.LCD({\n \
    \   controller: \"PCF8574A\"\n  });\n\n  l.print(\"hello!\");\n});\n```\n\n##\
    \ 非 I2C 版本\n\n非 I2C 版本 LCD 的代码如下：\n\n```javascript\nvar five = require(\"johnny-five\"\
    );\nvar board = new five.Board();\n\nboard.on(\"ready\", function () {\n  var\
    \ l = new five.LCD();\n\n  l.print(\"hello!\");\n});\n```\n\n"
