  - '[PAGE 153]


    # The difference between .to() and the Animation API


    It may look like the extra options in the .to() method for servos allow the creation
    of animations implicitly. This is not the case!


    The duration parameter, while allowing servos to move at nonmax speeds, does not
    necessarily serve the same purpose as an animation. The rate parameter does not
    create keyframes; the rate parameter creates a number of discrete movements, and
    they are moved to at the maximum speed.


    So, while using .to() with durations and rates may seem like creating animations,
    you should know that they are not a full substitute to write your own animations
    and segments using the Animation API.'
  - '[PAGE 154]


    # # Using the ServoArray object


    We''ve discussed the concept of ServoArray, but let''s look at it in a little
    more detail, we''ll be using it in this chapter''s projects.


    Constructing the ServoArray object looks remarkably similar to constructing a
    single servo; however, the object is called Servos instead of Servo, and you pass
    in an array of pins representing the pins your group of servos is:


    ```

    var myServos = five.Servos([3, 5, 6]);

    ```


    This creates an array of servos that are on pins 3, 5, and 6.


    Performing actions on a servo array is also remarkably similar to moving a single
    servo; using .to() will move all the servos using the parameters given. For instance,
    consider the following:


    ```

    myServos.to(120, 500);

    ```


    This will move all the servos in the array to 120 degrees over 500 ms. If you''d
    like to move one servo independently, all you need is its key in the servo array—you
    can then reference it and move it as a standard Servo object:


    ```

    myServos[0].to(90, 200);

    ```


    This moves the first servo in the array to 90 degrees over 200 ms.


    ServoArrays are also very useful in creating animations; you can address an entire
    array of servos with a single keyframe, allowing you to write keyframes and segments
    for several servos at once, instead of writing them separately for each servo.


    Now that we''ve explored the terminology and concepts behind the Animation API,
    let''s build our first project; we''re going to build three servos into a servo
    array that we can manipulate.'
