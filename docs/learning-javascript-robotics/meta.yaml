  md: '# How a Johnny-Five program works


    In this section, we''ll take a look at the internals of a Johnny-Five program
    in more detail, so we can start building more complex applications.'
  merge: -1
  pgno: 46
- img_proc: true
  md: "# Objects, functions, and events\n\nJohnny-Five programs work using an event-based\
    \ structure, and there are three concepts to keep in mind: objects, functions,\
    \ and events.\n\nObjects to programmatically represent our physical electronic\
    \ components and are usually constructed using the `new` keyword. A few examples\
    \ of objects in Johnny-Five include the `five` object, which represents the Johnny-Five\
    \ library, the `Board` object, which represents our microcontroller; and the LED\
    \ object, which will programmatically represent our LED:\n\n```\nvar led = new\
    \ five.Led(11);\n```\n\nFunctions are available for the objects we create and\
    \ usually represent the actions that our robots can do. For instance, the LED\
    \ object has an `on()` and `off()` function that turns the LED on and off:\n\n\
    ```\nled.on();\nled.off();\nled.blink();\nled.stop();\n```\n\nEvents are fired\
    \ on objects and represent represent observable points in our program. For example,\
    \ the `Board` object fires a `ready` event when the board is ready to receive\
    \ instructions from a Johnny-Five program.\n\nWe can also set events on a pin\
    \ to track events on our LED:\n\n```\nvar myPin = new five.Pin(11);\nmyPin.on('high',\
    \ function() {\n  console.log('pin 11 set to high!');\n});\n```\n\nWe will use\
    \ all three of these concepts in Johnny-Five program we write, so it's good to\
    \ normalize our vocabulary early!"
  merge: -1
  pgno: 47
- img_proc: true
  md: "# Going over our blink-LED script\n\nIn the previous chapter, we wrote a small\
    \ script to blink an on-board LED on and off. Let's take a look at this code in\
    \ detail and outline the objects, functions, and events we have used:\n\n```\n\
    var five = require(\"johnny-five\");\n```\n\nThe preceding line just pulls johnny-five\
    \ into our program so that we can use it.\n\n```\nvar board = new five.Board();\n\
    ```\n\nThe preceding line constructs our board object. Note that, without parameters,\
    \ Johnny-Five assumes you are using an Arduino and guesses the serial port for\
    \ you.\n\n```\nboard.on(\"ready\", function() {\n  var led = new five.Led(13);\n\
    \  led.blink(500);\n});\n```\n\nHere, we set up a listener on our Board object\
    \ for the ready event. When the board is ready, the handler instantiates an Led\
    \ object at pin 13 and makes the LED blink by calling the blink function on that\
    \ object.\n\nThis will be the basic format for most Johnny-Five functions: create\
    \ a Board object, create a listener and handler for the ready event, and then,\
    \ within the ready event handler, create component objects and call functions\
    \ through them. We can also add listeners and handlers to the component objects—we'll\
    \ talk about this in the next few chapters."
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Understanding events in Johnny-Five


    The events in Johnny-Five are a very important concept—this is also a new concept,
    especially if you are used to low-level language programming. It''s very similar
    to the idea of interrupts, but definitely strays away from the traditional robotics
    programming paradigm of an event loop. While you can create timers and loops in
    Johnny-Five, it highly encourages an event-based programming approach, which can
    need some practice.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# Why events?


    A question that gets asked a list is, "Why event-based? Why not loop-based and
    interrupt-based as in previous methods?"


    A lot of this has to do with the way robots work and the way we think about robot
    programs. When you think about what you want a robot to do, you''re less likely
    to think "Every X seconds, I want to check for A and start task B..." and you
    are more likely to think "When Y happens, I want to start event C..."


    The event-based system in Johnny-Five works really well with this train of thought
    by allowing users to place listeners and handlers in the events instead of polling
    for the correct conditions every X seconds. It makes robotics programming a little
    easier to grasp for those who are new to robotics programming.


    Grasping events is very important to understanding Johnny-Five—this is because
    every Johnny-Five script begins by instantiating a Board object and waiting for
    it to fire a ready event. This is the equivalent of the DOM ready event in browser-based
    JavaScript applications—it tells you that''re ready to start sending instructions.'
  merge: -1
  pgno: 50
- img_proc: true
