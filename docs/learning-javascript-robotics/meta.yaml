- md: "\ncontinuous servo back and forth.\n\nNow that we've seen the Servo object\
    \ API at work, let's hook our servo up to a sensor. In this case, we'll use a\
    \ photocell. This code is a good example for a few reasons: it shows off Johnny-Five's\
    \ event API, allows us to use a servo with an event, and gets us used to wiring\
    \ inputs to outputs using events.\n\nFirst, let's add a photocell to our project\
    \ using the following diagram:\n\n![](img/798b2390880773c3e3d0e21417ef58f8_142_0.png)\n\
    \nA servo and photoresistor wiring diagram\n\ncreate a photoresistor-servo.js\
    \ file, and add the following:\n\n```\nvar five = require('johnny-five');\n\n\
    var board = new five.Board();\n\nboard.on('ready', function() {\n\n  var servo\
    \ = new five.Servo({\n    pin: 6\n});\n\n  var photoresistor = new five.Sensor({\n\
    \  pin: \"A0\",\n  freq: 250\n});\n\nphotoresistor.scale(0, 180).on('change',\
    \ function() {\n  servo.to(this.value);\n});\n});\n```\n\nHow this works as follows:\
    \ it's similar to the sensor code we wrote in the previous chapter! It's just\
    \ during the data event that we tell our servo to move to the correct position\
    \ based on the scaled data from our photoresistor. Run the following command line:\n\
    \n- > node photoresistor-servo.js\n\nThen, try turning the light on and covering\
    \ up your photoresistor and watch the servo move!\n\n# Summary\n\nWe now know\
    \ how to use servos and motors to move our robotics projects. Wheeled robots are\
    \ good to go! But what about more complex projects, such as the hexapod? Walking\
    \ takes timing. As we mentioned in the .to() function, we can time servo movement,\
    \ thanks to the Animation library.\n\nIn the next chapter, we'll talk about the\
    \ Animation library and do some projects that move a few servos in sequence and\
    \ as a group.\n\n## Chapter 7. Advanced Movement with the Animation Library\n\n\
    Now that we've achieved basic movements in our robotics projects, we're going\
    \ to explore how to create timed, complex movements. This may seem daunting at\
    \ first—keeping track of one servo is hard enough! Luckily for us, the Animation\
    \ library in Johnny-Five makes these complex movements easier to both understand\
    \ and program. In this chapter, we'll explore what makes the Animation library\
    \ special and start working with some servo animations. We will cover the following\
    \ topics:\n\n- What is the Animation API?\n- Looking at the Animation API\n- Writing\
    \ servo animations\n- Animation events\n\n# What you'll need for this chapter\n\
    \nYou'll need your microcontroller—Highly recommend the Arduino Uno for this chapter\
    \ because of its compatibility. You'll also need a USB cable, a breadboard, some\
    \ breadboarding wires, and the LCD you used in Chapter 4, Using Specialized Output\
    \ Devices. You'll also need three standard servos. If possible, the servos should\
    \ be of the same brand and make—this will help with our project.\n\n## What is\
    \ the Animation API?\n\nThis chapter's title leads to a lot of questions—what\
    \ is the Animation API and how does it relate to servos? There's also a lot of\
    \ terminology used here. To start, let's discuss the point and development of\
    \ the Animation API to give us a little context.\n\n## Why do we need an Animation\
    \ API?\n\nThe Animation API was created around the work started by Donovan Buck\
    \ and Rick Waldron on walking robots—Rick built a quadruped bot, and Donovan,\
    \ a Hexapod. Turns out, walking robots require a lot of timing on the servos involved,\
    \ and the Johnny-Five library at the time was only capable of running servos from\
    \ one degree to another at a maximum speed. This made walking very difficult,\
    \ because even with servos of the same brand and make, the maximum speed is slightly\
    \ different. Also, there are situations in which you want different servos to\
    \ move at different speeds—this was impossible before the Animation API as well.\n\
    \nThis led to the development of a function that allows you to set the speed of\
    \ a given movement by giving a time to complete—we explored these functions in\
    \ the previous section. You can also set a number of discrete movements. While\
    \ these definitely helped with walking robotics code, there's another huge benefit\
    \ to this API, and this is why the name might seem strange.\n\n## Why animation?\n\
    \nAn animation is a description of movements over time. Keyframes are used in\
    \ animations to set key positions at given times—there are several animation libraries\
    \ that will calculate the frames in-between these keyframes, called tweening.\
    \ The Animation API in Johnny-Five allows you to set keyframes for a servo movement\
    \ and then does the tweening for you—allowing you to programmatically define a\
    \ set of movements over time, just as the definition of animation states.\n\n\
    This is great for moving robotics—calculating the speed for each servo in a leg\
    \ that is moving to a specific point would be daunting for even the most skilled\
    \ programmer. The Animation API's ability to do tweening for us means that we\
    \ can set the keyframes and let the code do the rest. This means that even beginners\
    \ in moving robotics can create complex movements.\n\nNow that we have some context,\
    \ let's take a bird's-eye view of the Animation API and the various ways to describe\
    \ and interact with it.\n\n# Looking at the Animation API\n\nThe Animation API\
    \ provides a powerful way to define complex movements. The core of the API is\
    \ the segment, which represents a specific movement over a period of time. Each\
    \ segment contains one or more keyframes, which define the state of the servo\
    \ at specific points in time. The API then handles the interpolation between these\
    \ keyframes, creating smooth transitions.\n\nTo use the Animation API, you first\
    \ need to create an animation object. Then, you can add segments to it. Within\
    \ each segment, you can define keyframes. Here is an example of how to create\
    \ a simple animation:\n\n```\nvar servo = new five.Servo({\n  pin: 9\n});\n\n\
    var animation = new five.Animation(servo);\n\nanimation.addSegment({\n  duration:\
    \ 2000,\n  keyframes: [\n    {time: 0, value: 0\n    },\n    {time: 1000, value:\
    \ 90\n    },\n    {time: 1500, value: 180\n    },\n    {time: 2000, value: 0\n\
    \    }\n  ]\n});\n\nanimation.play();\n```\n\nIn this example, the servo will\
    \ move from 0 to 90 degrees in the first second, then to 180 degrees in the next\
    \ half second, and finally back to 0. The Animation API handles all the math to\
    \ calculate the speeds for you.\n\nThe API also provides events that allow you\
    \ to respond to different stages of the animation. For example, you can listen\
    \ for the 'complete' event to know when an animation has finished.\n\n```\nanimation.on('complete',\
    \ function() {\n  console.log('Animation finished!');\n});\n```\n\n# Writing servo\
    \ animations\n\nNow that you understand the basics of the Animation API, you can\
    \ start creating more complex animations. For instance, you could create an animation\
    \ that mimics the walking gait of a hexapod. This would involve coordinating multiple\
    \ servos working in sync. You can use different segment durations and keyframes\
    \ to make the movement look more natural.\n\n```\nvar leg1 = new five.Servo({\n\
    \  pin: 9\n});\nvar leg2 = new five.Servo({\n  pin: 10\n});\n\nvar animation1\
    \ = new five.Animation(leg1);\nvar animation2 = new five.Animation(leg2);\n\n\
    animation1.addSegment({\n  duration: 1000,\n  keyframes: [\n    {time: 0, value:\
    \ 0\n    },\n    {time: 1000, value: 90\n    }\n  ]\n});\n\nanimation2.addSegment({\n\
    \  duration: 1000,\n  keyframes: [\n    {time: 0, value: 90\n    },\n    {time:\
    \ 1000, value: 0\n    }\n  ]\n});\n\nanimation1.play();\nanimation2.play();\n\
    ```\n\n# Animation events\n\nThe Animation API provides several events that you\
    \ can use. The most common ones are 'start', 'complete', and 'update'.\n\n- 'start':\
    \ Fired when the animation begins.\n- 'complete': Fired when the animation finishes.\n\
    - 'update': Fired every time the servo position is updated.\n\n```\nanimation.on('start',\
    \ function() {\n  console.log('Animation started!');\n});\n\nanimation.on('complete',\
    \ function() {\n  console.log('Animation complete!');\n});\n\nanimation.on('update',\
    \ function(value) {\n  console.log('Current position: ' + value);\n});\n```"
  mdcn: "\n连续的往复运动。\n\n现在我们已经看到了 `Servo` 对象 API 的工作方式，让我们将舵机连接到传感器上。在这种情况下，我们将使用光敏电阻。这段代码是一个很好的示例，原因在于：它展示了\
    \ Johnny-Five 的事件 API，允许我们对带有事件的舵机，并让我们习惯于使用事件将输入连接到输出。\n\n首先，让我们根据下面的图表向项目中添加一个光敏电阻：\n\
    \n![](img/798b2390880773c3e3d0e21417ef58f8_142_0.png)\n\n舵机与光敏电阻接线图\n\n创建一个 `photoresistor-servo.js`\
    \ 文件，并添加以下内容：\n\n```\nvar five = require('johnny-five');\n\nvar board = new five.Board();\n\
    \nboard.on('ready', function() {\n\n  var servo = new five.Servo({\n    pin: 6\n\
    });\n\n  var photoresistor = new five.Sensor({\n  pin: \"A0\",\n  freq: 250\n\
