    # Running the code


    Now that we''ve written the code, let''s start the program. Use the `lcd-i2c.js`
    node or the `lcd.js` node, depending on the type of character LCD you are using
    to start the program.


    What you should see is your LCD lighting up and displaying **hello**, followed
    by a heart character. The LCD carat should also be blinking.


    Where did the heart character come from? One of the many fun things about character
    LCDs is that you can define a few custom icons to use with them. Johnny-Five has
    created a set that you can use in the `lcd` object. Some other examples of icons
    defined by Johnny-Five include target, duck, dice1, dice2, up to dice6, and check.


    # Note


    Please note that you can only use up to eight of these custom characters at one
    time—LCDs have a limited memory for custom characters.


    Now that our code is running, we''re going to play around with the LCD API via
    the REPL. We''ve attached our `lcd` object to the `lcd` variable. First, let''s
    clear the LCD as follows:


    ```

    > `lcd.clear()`

    ```


    Your LCD should now be blank, and the carat should still be blinking. If you''d
    like to turn this off, you can type the following:


    ```

    > `lcd.noBlink()`

    ```


    This will turn off the carat. Want to start on line 2? We can move the cursor
    with the `cursor(row, column)` function:


    ```

    > `lcd.cursor(1, 0);`

    ```


    Similar to arrays and other programming concepts, the column and row indices of
    an LCD are 0-based: for example, row 2 is index 1. Now, let''s print something
    on row 2:


    ```

    > `lcd.print("hello, world!")`

    ```


    This should print properly on the second line. Now, let''s clear the display,
    so we can case an edge of character LCDs:


    ```

    > `lcd.clear()`

    ```


    ```

    > `lcd.print("This is a really really really really long sentence!")`

    ```


    Notice anything weird? When line 1 overflows, it starts printing on row 3, and
    then row 2. This is how the LCD functions normally. What this means is you need
    to check the length of your string to prevent this overflow from making your code
    look broken. Now, let''s clear our LCD and load'
