- img_proc: true
  md: '# Defining motors and servos


    A motor (or an electrical motor for our purposes) converts electrical energy to
    motion. Electricity goes in, motion comes out. This motion is output as a rotation
    motion; one of the most common uses of electronic motors is to turn wheels. Note
    that while you can control the speed of a motor by controlling the power being
    input, you cannot change the position of a motor precisely.


    This is where servos come in. Servos use electricity to move to a set point—most
    commonly in an arc of 180 degrees. However, there are some servos that can rotate
    360 degrees. We''ll discuss these in a moment. Servos are technically specialized
    motors, and while motors are used to propel projects, servos are used to control
    them.'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Things to keep in mind


    There are quite a few servos and motors available for use with your Johnny-Five
    projects. While we are going to go over many of these, there are a few things
    to keep in mind when looking at motors to be used.


    For instance, be sure to be aware of the voltage and current needed to power the
    motor or servo; if this is above 5 volts, you''ll need to power them with something
    other than the Arduino''s 5V OUT, and if they draw a lot of current but only use
    5V, you might consider an external power supply for your Arduino board. Note that
    additional electric current is supplied whenever you have multiple servos—but
    the voltage required stays the same; for instance, if you have two servos that
    require 5V of voltage but 200 mA of electric current, you still only need 5 volts
    but you will need 400 mA current! Much of this information can be found on the
    data sheet for the motor or servo you are using.'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# Types of motors


    While we''re going to go over a few types of motors here, keep in mind that the
    functionality of most of these motors is the same; they have an on and off switch,
    and you can slightly adjust their speed with power adjustments. However, this
    doesn''t rule out the use of motors entirely—there are some interesting uses as
    well!


    Your standard hobby motor looks like a large cylinder with a few wires on one
    end and a rod on the other end, like the following figure:


    ![](img/798b2390880773c3e3d0e21417ef58f8_125_0.png)


    A standard DC hobby motor


    The motors come in various sizes and can generate different levels of work. These
    are mainly used for motion and propelling projects such as remote-control vehicles.
    Some of these motors are called directional motors—this means you can control
    the direction. With nondirectional motors, you can only turn the motor in one
    direction. Keep in mind when considering your project.


    There are also vibration motors—these are found in cell phones that alert you
    to your calls without an audible ring. These look similar to regular motors, but
    the rod at the end has an asymmetrical weight attached, as shown in the following
    figure:'
  merge: -1
  pgno: 125
- img_proc: true
  md: '![](img/798b2390880773c3e3d0e21417ef58f8_126_0.png)


    A vibration motor


    These motors are primarily used for tactile vibration, but in the wearables and
    cell phone worlds, this can be a vital piece of the puzzle!


    Finally, there are stepper motors. They are usually larger and require more power:


    ![](img/798b2390880773c3e3d0e21417ef58f8_126_1.png)


    A stepper motor


    However, stepper motors move in a discreet manner, giving you more control and
    precision with full rotation. One very common use of these motors is 3D printing—these
    motors are at the heart of most 3D printers because of their precision and speed.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# Types of servos


    There are two main types of servos. The first is generally called a standard servo;
    they are regularly used in hobby remote-control vehicles, such as cars and planes,
    as well as hobby robotics. These tend to look similar to a box with a plastic
    cylinder and a propeller, an arm, or a disc shape on top, as shown in the following
    figure:


    ![](img/798b2390880773c3e3d0e21417ef58f8_127_0.png)


    A standard servo


    These servos move in a range of motion that spans 180 degrees or half of a full
    range of motion. However, these can be set to a required position giving them
    precision over motors.


    There are also continuous servos that span a full 360 degrees. Note that the two
    types of servos look remarkably similar; checkout the previous servo and the one
    shown in the following figure:'
  merge: -1
  pgno: 127
- img_proc: true
  md: '![](img/798b2390880773c3e3d0e21417ef58f8_128_0.png)


    # A continuous servo


    Most continuous servos have a label on them that indicates that they are continuous
    servos, but you''ll have to keep a track of the different types when purchasing
    your own.'
