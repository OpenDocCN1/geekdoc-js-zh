  md: "# Coding everything together\n\nUsing our knowledge of Johnny-Five, the Sensor\
    \ object, and now barclli, we can write the following in photocell.js:\n\n```\n\
    var five = require('johnny-five');\nvar Barcli = require('barclli');\n\nvar board\
    \ = new five.Board();\nvar graph = new Barcli({\nlabel: 'Photocell',\nrange: [0,\
