    \n# 理解 Johnny-Five 中的事件\n\n现在我们已经搭建好了开发环境，可以开始编写用于 Arduino 板板的 JavaScript 代码了。我们将从闪烁\
    \ Arduino 微控制器中内置的 LED 开始。\n\n# 编写 Johnny-Five 脚本\n\n在你喜欢的 IDE 中，在项目目录下创建一个新的\
