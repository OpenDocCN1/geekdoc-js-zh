  mdcn: "\n## 使用电机和舵服的特殊注意事项\n\n使用舵机和电机的项目有一些特殊的考虑因素，这些考虑主要集中在电源上，以及 Johnny-Five 项目连接到运行\
    \ Johnny-Five 代码的计算机这一点。\n\n## 电源问题\n\n舵机和电机消耗大量功率。当你同时使用多个设备时，这可能会成为问题。如果你在使用\
    \ 5V 的舵机和电机，且同时使用两个或三个，你应该为 Arduino 使用外部电源，以提供额外的电流而不影响性能。这些电源通常插在外部插座上，如图所示。\n\
    \n## 注意事项\n\n### 警告！\n\n在将任何外部电源连接到开发板之前，请确保你正在使用的板已根据电源电压进行了电压调节；对于 Arduino Uno，该电压为\
    \ 12V。如果不确定，为 Arduino 使用 5V 电源。此外，在处理外部电源时，请遵循适当的安全协议。SparkFun 在这里有一个非常好的指南：https://learn.sparkfun.com/tutorials/how-to-power-a-project。\n\
    \n如果你使用的舵机或电机需要的电压超过 5V，则需要为你的电机或舵服提供外部电源。这超出了本书的范围。\n\n## 连接与电缆\n\n使用 Johnny-Five\
    \ 意味着运行在板上的代码正在接收来自主机的消息。如果丢失此连接，项目将无法运行。这意味着对于大多数 Johnny-Five 项目，你将需要维持 USB 线连接。因此，如果你要做一个涉及运动的项目，你可能需要一根长的\
    \ USB 线。\n\n第 9 章“将 NodeBots 连接到世界”和“下一步去向哪里”中描述了使用 Johnny-Five 的无线 NodeBots 的选项。\n\
    \n## 接线舵机和电机\n\n连接舵机的方法与连接传感器类似，区别在于信号映射到输出引脚。连接电机的方法与连接 LED 类似。\n\n## 连接舵机\n\n\
    要连接舵机，你必须使用类似于下图的设置：\n\n![](img/798b2390880773c3e3d0e21417ef58f8_136_0.png)\n\n\
    舵机接线图\n\n### 小贴士\n\n- 舵机的线颜色可能不同。如果你的电线是红色、棕色和橙色，那么红色是 5V，棕色是 **GND**，橙色是信号。如果不确定，请检查随舵机附带的数据表。\n\
    \n- 接好舵机后，插上开发板并听舵机的声音。如果你听到“咔咔”声，请迅速拔掉开发板——这意味着你的舵机正试图将其放置到一个它无法到达的位置。通常，大多数舵机的底部有一个小螺丝，你可以用它进行校准。使用小螺丝刀旋转它，直到在通电时不再发出咔咔声。\n\
    \n- 该过程对于连续旋转舵机也是相同的——图示也没有太大变化。只需将普通舵机替换为连续舵机即可。\n\n## 连接电机\n\n电机的接线方法如图所示：\n\
    \n![](img/798b2390880773c3e3d0e21417ef58f8_137_0.png)\n\n电机接线图\n\n同样，你希望信号引脚连接到\
    \ PWM 引脚。由于只有两个引脚，可能会对电源引脚连接哪里感到困惑——它连接到 PWM 引脚，因为类似于第 2 章《使用 Johnny-Five》中我们的\
    \ LED 从 PWM 引脚获取电源一样，同一个引脚将为运行电机提供电源。\n\n现在我们已经知道如何接线，让我们来完成一个涉及电机和 Johnny-Five\
    \ REPL 的项目。\n\n## 创建带有电机的项目并使用 REPL\n\n拿起你的电机和开发板，按照上一节中的图表连接电机。正如前面的图所示，让我们使用引脚\
    \ 6 作为信号引脚。\n\n我们在代码中要做的的是创建一个 `Motor` 对象并将其注入 REPL，这样我们就可以在命令行中对其进行操作了。创建一个 `motor.js`\
    \ 文件并放入以下代码：\n\n```\nvar five = require('johnny-five');\n\nvar board = new five.Board();\n\
    \nboard.on('ready', function() {\n\n  var motor = new five.Motor({\n    pin: 6\n\
    \  });\n\n  this.repl.inject({\n    motor: motor\n  });\n});\n```\n\n然后，插上开发板并使用\
    \ `node motor.js` 启动程序。\n\n## 探索电机 API\n\n如果我们查看 Johnny-Five 官方网站上的文档，这里有一些我们可以尝试的内容。首先，让我们让电机以大约一半的速度运行起来：\n\
    \n```\n> motor.start(125);\n```\n\n`.start()` 方法接受一个 0 到 255 之间的值。听起来很熟悉吧？因为这些正是我们可以分配给\
    \ PWM 引脚的值！好了，让我们让电机通过惯性停止：\n\n```\n> motor.stop();\n```\n\n注意，虽然这个函数会导致电机由于惯性停止，但有一个专门的\
    \ `.brake()` 方法。不过，这需要一个专门的制动引脚。\n"
