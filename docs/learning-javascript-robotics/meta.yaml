- md: "\n## Benefits and drawbacks of I2C\n\nThere are definitely benefits and drawbacks\
    \ of using I2C with Johnny-Five, and they can affect your builds or choice of\
    \ microcontroller.\n\n## Benefits\n\nLet's go through the benefits of using the\
    \ I2C devices, as follows:\n\n- 1. One of the benefits of using I2C devices is\
    \ that you can use several devices with just two data pins: SDA and SCL. As this\
    \ is built on a bus, you can use several devices without any issues.\n- 2. Another\
    \ benefit of I2C devices is that they conform to a standard; implementing these\
    \ standards mostly to a formula that is easier to follow the devices with a less\
    \ rigid standard (or no standard!).\n- 3. Finally, there are many I2C backpacks\
    \ for devices that use several data pins—such as our LCD from earlier. These backpacks\
    \ can make devices usable with microcontrollers using fewer pins. There is even\
    \ some work being done in Johnny-Five to use I2C expanders, which will allow devices\
    \ without analog input or PWM pins to devices that require these pins. This is\
    \ called the Expander API and more info can be found on this at johnny-five.io.\n\
    \n## Drawbacks\n\nLet's go through the drawbacks of using the I2C devices, as\
    \ follows:\n\n- 1. One of the drawbacks of I2C in Johnny-Five is that not all\
    \ platforms that run Johnny-Five support it—be sure to check the Platform Support\
    \ section of johnny-five.io before trying I2C with your device.\n- 2. Another\
    \ drawback of implementing new I2C devices is that timing can be an issue—I2C\
    \ is very synchronous by nature; it requires certain instructions to be sent in\
    \ a certain order with certain delays in between. Johnny-Five and JavaScript are\
    \ not the easiest to wrap around these concepts, and this can cause some really\
    \ interesting race conditions and bugs. However, these issues only appear when\
    \ implementing your own I2C devices.\n\n## Building with an I2C device – Accelerometer\n\
    \nBuilding a Johnny-Five project with an I2C component can sound tricky—luckily,\
    \ because of the way Johnny-Five works, it's actually nearly simple as other projects\
    \ we've worked on in this book. For this project, you'll need your microcontroller,\
    \ your breadboard and wires, and your ADXL345 accelerometer.\n\n### Wiring up\
    \ our accelerometer\n\nTo get started, wire up your project as shown in the following\
    \ diagram. Be sure that you only use the I2C pins and the power pins on your accelerometer.\
    \ Also, be sure to use as many jumper wires as you can, as you have been able\
    \ to move the breadboard and the accelerometer around a bit to test this project:\n\
    \n![](img/798b2390880773c3e3d0e21417ef58f8_192_0.png)\n\nOne last thing to note:\
    \ if you use the SparkFun ADXL345 board, you'll need to wire the CS (Chip Select)\
    \ pin to VCC, as shown here:\n\n![](img/798b2390880773c3e3d0e21417ef58f8_193_0.png)\n\
    \n### Wiring for the SparkFun breakout board\n\nYou do NOT need to do this for\
    \ the Adafruit ADXL345 board.\n\nOnce you've wired the accelerometer, it's time\
    \ to write the code to test that everything works. We'll be using `barcli` again,\
    \ to show each axis of acceleration easily.\n\n### Coding up our example\n\nIn\
    \ order to code our example, we should first look at the `Accelerometer` object\
    \ and API to see which events to watch for.\n\nLooking at the API, we'll want\
    \ to tap into the `change` event. Luckily for us, we can also tap into a lot of\
    \ information regarding the accelerometer, thanks to the Johnny-Five API. Inside\
    \ the `change` event handler, we can access the following bits of data:\n\n| Data\
    \ | Properties |\n|---|---|\n| this.x | This is the value for the x axis in G\
    \ forces |\n| | | This is the value for the y axis in G forces |\n| this.z | This\
    \ is the value for the z axis in G forces |\n| this.pitch | This is the pitch\
    \ of the device in degrees |\n| this.roll | This is the roll of the device in\
    \ degrees |\n| this.acceleration | This is the total acceleration of the device\
    \ |\n| this.inclination | This is the inclination (incline measure) of the device\
    \ |\n| this.orientation | This is a value between -3 and 3 representing the physical\
    \ orientation of the device |\n\nSince we want to show bar graphs of the output,\
    \ let's consider the ranges we will need to set on these graphs. The axes' raw\
    \ data doesn't tell us too much, so let's skip the graphs of these. Pitch, roll,\
    \ and inclination are in degrees, so we'll set the range from -180 to 180. And\
    \ acceleration will be between -2 and 2g, although you can set this higher for\
    \ the ADXL345—up to 16g. Orientation will be between -3 and 3.\n\nKnowing all\
    \ of this, we can write our code as follows:\n\n```javascript\nvar five = require('johnny-five');\n\
    var barcli = require('barcli');\nvar board = new five.Board();\n\nboard.on('ready',\
    \ function() {\n  //set up our accelerometer\n  var accel = new five.Accelerometer({\n\
    \    controller: 'ADXL345'\n  });\n\n  //set up our graphs\n  accel.on('change',\
    \ function() {\n    barcli.bar('pitch', this.pitch, -180, 180);\n    barcli.bar('roll',\
    \ this.roll, -180, 180);\n    barcli.bar('acceleration', this.acceleration, -2,\
    \ 16);\n    barcli.bar('inclination', this.inclination, -180, 180);\n    barcli.bar('orientation',\
    \ this.orientation, -3, 3);\n  });\n});\n```\n*(Note: The OCR for the final code\
    \ block was highly fragmented and repetitive; I have reconstructed the logic based\
    \ on the context of the data table and standard Johnny-Five patterns to provide\
    \ a functional representation.)*\n\nWait, looking at the OCR again, the last part\
    \ is very garbled. Let me provide the corrected text flow for the remaining sections\
    \ as requested, while fixing the OCR artifacts.\n\n[Corrected text for the final\
    \ pages follows:]\n\n## node-serialport\n\nAs early as five years ago, NodeBots\
    \ didn't exist. As early as ten years ago, they weren't even a thought—JavaScript\
    \ was a browser language, after all. However, with the advent of Node, all sorts\
    \ of new technologies were available to Node.\n\nSerial connections are the communications\
    \ channel between all sorts of devices—such as printers, webcams—and many of the\
    \ peripherals we use on a daily basis. In 2009, Chris Williams (often cited as\
    \ the Godfather of NodeBots!) created node-serialport. The node-serialport library\
    \ allows you to communicate with serial devices using Node.JS.\n\nAt first, this\
    \ didn't create the explosion of NodeBots you'd expect by reading a book like\
    \ this—it was still a very specialized thing to get a serial connection working.\
    \ However, shortly after the creation of node-serialport, Rick Waldron wrote Johnny-Five\
    \ on top of it. That's right, under its hood, Johnny-Five uses node-serialport\
    \ to speak to the Arduino boards we are using.\n\nHowever, there are other devices\
    \ that have made their way to Node using libraries outside node-serialport; these\
    \ include gamepads meant for playing games on the PC. Many devices that you can\
    \ add to your computer via USB can now be used with Node, thanks to another library\
    \ called node-hid.\n\n## node-hid\n\nThe node-hid library is for using Human Interface\
    \ Device (HID) devices, such as gamepads. HID is a part of the USB specification\
    \ and allows many peripherals to speak to a computer in a way that is easily understood\
    \ and emulated.\n\nSome of the most popular HID devices used are gamepads, computer,\
    \ and retro system emulators. In our next build, we'll explore how to use these\
    \ external devices with Johnny-Five, using\n"
