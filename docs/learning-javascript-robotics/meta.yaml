    # Summary


    In this chapter, we''ve looked at how to use specialized inputs by walking through
    the documentation on johnny-five.io. The knowledge used here will allow you to
    use many different components that you come across in your robotics adventures.
    Just be sure that, if you find a new component and write the code, you contribute
    it back to Johnny-Five to make it better for everyone else!


    In the next chapter, we will learn how to use many different input devices and
    sensors in order to build Johnny-Five projects.'
- md: "\n## Chapter 5. Using Input Devices and Sensors\n\nWe've handled outputs, but\
    \ what makes robots truly interesting is the use of inputs to generate outputs!\
    \ In this chapter, we'll go over basic input devices, such as buttons, and environmental\
    \ sensors, such as a sensor that detects ambient light. We'll talk about how Johnny-Five\
    \ uses events to make these devices easy to use, and build some projects. After\
    \ finishing this chapter, you should have all the knowledge that you need to handle\
    \ most input/output projects.\n\nThis chapter will cover the following topics:\n\
    \n- How analog input pins work\n- Johnny-Five's sensor events\n- Using basic inputs\
    \ – buttons and potentiometers\n- Using sensors – light and temperature\n- Other\
    \ types of sensors and their uses\n\n## # What you'll need for this chapter\n\n\
    For the project in this chapter, you'll need your board, a USB cable, and a few\
    \ inputs and sensors.\n\nFirst, you'll want a button. You can find these aplenty\
    \ in most starter kits, but you can also buy them separately. We're going to consider\
    \ a button with a four-prong design, as shown in the following screenshot:\n\n\
    ![](img/798b2390880773c3e3d0e21417ef58f8_99_0.png)\n\n> *A common push button\
    \ for robotics projects*\n\nHowever, a design with two prongs is fine too—four-prong\
    \ buttons still represent two sides of the button, so you can replicate these\
    \ with two-prong designs.\n\nYou'll also need a rotating potentiometer—these are\
    \ knobs that you twist to set a value, similar to the volume knob on a speaker.\
    \ You'll want one that's breadboard-friendly with a three-prong design, as shown\
    \ in the following screenshot:\n\n![](img/798b2390880773c3e3d0e21417ef58f8_99_1.png)\n\
    \n### Tip\n\nPlease note that you may have access to a sliding potentiometer (one\
    \ that looks like a sliding switch or similar to a dimmer switch) or some other\
    \ potentiometer. These will work fine, but check the www.johnny-five.io site for\
    \ more details on wiring them.\n\nFor inputs, first you'll need a light sensor\
    \ that is commonly referred to as a photocell. Usually, these look like diodes\
    \ that are tan with a wave design on top, as shown in the following screenshot:\n\
    \n![](img/798b2390880773c3e3d0e21417ef58f8_100_0.png)\n\nA light sensor diode\n\
    \nThere are breakout boards for light sensors as well, but for this chapter, let's\
    \ stick with the diode kind. These can be found very easily on Adafruit and SparkFun.\n\
    \nTo round out our sensors, you'll want a temperature sensor. These look like\
    \ small, half-cut cylinders with three metal prongs at the bottom. I recommend\
    \ the TMP36, which has TMP written on the back, as shown in the following screenshot:\n\
    \n![](img/798b2390880773c3e3d0e21417ef58f8_100_1.png)\n\nA temperature sensor\n\
    \nyou can also use an LM35 with the same wiring—this sensor looks the same as\
    \ the TMP36, except that LM35 is written on the back. If you use a different temperature\
    \ sensor, before you continue, be sure to check the johnny-five.io documentation\
    \ at http://johnny-five.io/api/temperature to see whether or not the sensor is\
    \ supported.\n\nYou'll also need a breadboard, a handful of breadboard wires,\
    \ an LED, and a few 10k Ohm resistors.\n\nResistors lower the electric current\
    \ being sent to our sensors to ensure accurate readings and are also sometimes\
    \ used to protect output devices. To make sure that your resistors are 10k ohm,\
    \ we're going to use the colored stripes on the resistor. Your resistor should\
    \ have brown, black, and orange bands. There may be another band after these—the\
    \ color of this band, for our purposes, doesn't matter. The resistor should look\
    \ like the following:\n\n![](img/798b2390880773c3e3d0e21417ef58f8_101_0.png)\n\
    \nA 10k ohm resistor\n\n## How analog input pins work\n\nInputs are the first\
    \ half of awesome robots equations; robots that know the weather, can tell how\
    \ fast they are moving, or see where things are. Input pins make this possible,\
    \ so in this section we'll discuss how they work and how we're going to utilize\
    \ them.\n\nAnalog input pins work by reading a voltage level from a sensor and\
    \ converting this voltage level to an integer value between 0 and 1,023. Input\
    \ device manufacturers usually give a scale to their device that tells us how\
    \ to turn this integer value into a real-world value; for instance, we'll do this\
    \ with our temperature sensor to change the value into a temperature that we as\
    \ humans can understand.\n\nWe're going to utilize these pins by plugging in both\
    \ the human input devices and the environmental sensors, and map the inputs that\
    \ they give. This way, we can start developing projects that use inputs to generate\
    \ outputs.\n\n## Johnny-Five sensor events\n\nAs discussed in the previous chapters,\
    \ Johnny-Five is dependent on events for a lot of its functionality. This is not\
    \ different for inputs and sensors—most of the time, you'll interact with these\
    \ by waiting for events. While most input devices have ways to read data at any\
    \ given moment, these are mostly used for debugging, and you'll need to have a\
    \ good grasp of the events available for your input device or sensor when coding\
    \ your projects.\n\nMost input devices and sensors have a data event; this tells\
    \ the program when data is read from the device. This is a kind of a firehose:\
    \ it reports quite quickly and can be a little overwhelming. This is usually used\
    \ for debugging, as most robotics programs are more interested in when the sensor\
    \ or input data changes rather than when there is new input to be read.\n\nThe\
    \ change event, also available on most devices, is a very commonly-used event—it\
    \ only fires when the incoming data has changed. A good example is a temperature\
    \ change as we'll see in one of the projects in this chapter.\n\nThe best way\
    \ to figure out what events to use is by the Johnny-Five documentation for your\
    \ device at johnny-five.io; this will give you a full list of events for each\
    \ input and sensor type and can be very helpful when starting new projects.\n\n\
    ## Using basic inputs – buttons and potentiometers\n\nLet's take a look at using\
    \ some basic input devices first. We'll start with a button and a potentiometer—two\
    \ of the easiest input devices to use with Johnny-Five, and a good way to get\
    \ acquainted with both specialized input objects, such as buttons, and general\
