  md: "# The Animation object\n\nThe analogy that I like for the Animation object\
    \ is to think of it like an MP3 player. You load tracks into it, and you can press\
    \ play, pause, or stop. You queue segments into an animation in any order, and\
    \ you can play, pause, or stop the animation at any time.\n\nLet's take a quick\
    \ look at the constructor: it only takes one parameter, which is the target. As\
    \ we mentioned earlier, the target is the servo or an array of servos being animated.\
    \ So, let's take a look at a sample program that constructs a servo array and\
    \ constructs an Animation object:\n\n```\nvar five = require('johnny-five')\n\n\
    var board = new five.Board()\n\nboard.on('ready', function() {\n  var servos =\
    \ new five.Servos([3, 5, 6])\n  var animation = new five.Animation(servos)\n})\n\
    ```\n\nOnce we've constructed the Animation object, the next important function\
    \ is .enqueue(). You pass a segment to this function to add it to the animation\
    \ queue. Animations are run first-in, first-out, so our code becomes:\n\n```\n\
    var five = require('johnny-five')\n\nvar board = new five.Board()\n\nboard.on('ready',\
    \ function() {\n  var servos = new five.Servos([3, 5, 6])\n  var animation = new\
    \ five.Animation(servos)\n\n  var mySegment = {\n    easing: 'inOutCirc',\n  \
    \  duration: 3000,\n    cuePoints: [0, .25, .75, 1],\n    keyframes: [[degrees:\
    \ 45], 45, 45, -45]\n  }\n\n  animation.enqueue(mySegment)\n})\n```\n\nThat's\
    \ the whole kit and caboodle; animations are set to run as soon as a segment is\
    \ enqueued! Let's take an in-depth look at the functions available to the Animation\
    \ object:\n\n| Functions | Properties |\n| --- | --- |\n| .enqueue() | .enqueue()\
    \ places a segment in a queue for the animation. Segments are run first-in, first-out\
    \ when an animation is played. |"
  merge: -1
  pgno: 165
- img_proc: true
  md: '.play() plays the animation, starting with the first segment put in that hasn''t
    already run. It will continue the last segment in progress if the animation was
    paused.


    .pause() stops the animation, but maintains progress on any in-progress segments
    and maintains the segment queue.


    .stop() clears the segment queue as well as stops all animation.


    .next() clears the current segment and moves to the next. However, this is not
    automatically called by the animation when each segment finishes and is normally
    not called by the user.


    .speed([speed]) can be used to view (when no arguments are passed) or set (when
    a number representing a multiplier is passed) the speed of the current animation.


    Now that we know how animations work in general, let''s build our own project
    with our three servos. Let''s animate!'
