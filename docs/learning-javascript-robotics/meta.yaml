    Among the preceding alternatives, which one you are entirely up to your own preference.


    **Example 2:** Write a set of keyframes that starts the servo at 0, moves to 90,
    spends two points moving to 180, and then moves to 135:


    +   1. The first and second keyframes can be set via a keyframe object, as follows:

    ```nvar myFrames = [{degrees: 0}, {degrees: 90}];

