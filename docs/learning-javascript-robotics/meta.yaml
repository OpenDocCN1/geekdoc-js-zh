  md: '# # Johnny-Five and the wide world of microcontrollers


    We''ve been using Johnny-Five for the majority of this book, but we haven''t really
    touched on one of its best features! While the REPL and the API are definitely
    strong points, what really stands out about it is this wide array of microcontrollers.


    To be up to date with what Johnny-Five supports, check out johnny-five.io/platform-support—this
    page, as we saw in the earlier chapters, contains all the platforms that Johnny-Five
    supports, and also what types of component they support.


    Wrappers, we''ll use in this build, are pieces of code that translate Johnny-Five''s
    Fermata method of communicating to other platforms that don''t necessarily use
    Fermata. In our build, for instance, we''ll be using a Particle Photon, which
    uses a firmware called VoodooSpark. The particle-io wrapper essentially teaches
    Johnny-Five how to speak VoodooSpark, so we can use the Photon with our existing
    code.


    Let''s check how easy it is to move by moving our Arduino Uno WeatherBot to the
    Particle Photon, which is available at particle.io. There are definitely some
    differences between our Uno and the Photon: the Photon is a $20, Wi-Fi-connected
    device, and it comes with cloud services provided by Particle.


    Once you''ve received your Photon, you will have to use particle-cl to create
    an account and claim your Photon. Do this by plugging your Photon into a USB port,
    and while the status light flashes blue, install the CLI - using npm and run the
    setup:


    ```

    npm install -g particle-cli

    particle setup

    ```


    Once you''ve run the setup, you''ll need your access token and device ID. To get
    the device ID, run the following:


    ```

    particle list

    ```


    Then, copy the hex identifier for the Photon you just set up. To get your access
    token, run the following:


    ```

    particle token list

    ```


    Next, copy the hex value for any nonexpired token.


    Finally, we need to flash our Photon with VoodooSpark, a firmware that, like Fermata
    on the Uno, allows our Johnny-Five code to communicate with our Photon. You can
    go about this in two ways: one is to follow the instructions at https://github.com/voodootikod/voodoospark,
    and the other is to'
  merge: -1
  pgno: 212
- img_proc: true
  md: 'use the new command-line tool, voodoospark-installer. To use the new CLI, install
    it as follows:


    ```

    npm install -g voodoospark-installer

    ```


    Then, run the following:


    ```

    voodoospark

    ```


    This will ask for your Particle username and password, and then give you a list
    of Photons to pick from. Select your new Photon, hit *Enter*, and it will install
    VoodooSpark on that Photon.'
  merge: -1
