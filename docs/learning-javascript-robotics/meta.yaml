    \ with Johnny-Five, the same pin will provide the power to run the motor.\n\n\
    Now that we know how to wire these up, let's work on a project involving a motor\
    \ and Johnny-Five's REPL.\n\n## Creating a project with a motor and using the\
    \ REPL\n\nGrab your motor and board, and follow the diagram in the previous section\
