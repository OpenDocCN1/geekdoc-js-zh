  md: '# Summary


    In this chapter, we''ve looked at how to use specialized inputs by walking through
    the documentation on johnny-five.io. The knowledge used here will allow you to
    use many different components that you come across in your robotics adventures.
    Just be sure that, if you find a new component and write the code, you contribute
