    # # What''s going on with the pin?


    The reason a Piezo requires a PWM pin is that the Piezo object is sending different
    amounts of power through pin 3 to the Piezo, which causes it to emit different
    notes. The Johnny-Five library allows us to show these notes in a way that we
    can understand, instead of having to calculate how much power to send for each
    note.'
