- img_proc: true
  md: '# I2C works


    I2C, which stands for Inter-Integrated Circuit, is a protocol that input and output
    components can use to communicate with microcontrollers. It''s very standardized,
    and nearly all I2C devices operate in the same way. I2C also has the major benefit
    of being recognized and implemented by many microcontroller manufacturers—including
    Arduino. Any Arduino platform that is compatible with Johnny-Five is also compatible
    with I2C devices.


    However, implementing an I2C device in Johnny-Five can be a tricky proposition.
    To understand why, we need a better understanding of how I2C works.


    I2C has the good parts of SPI combined with the good parts of serial communications.
    It only uses two pins for data and clock, but has a synchronous clock that can
    be set by the system!


    # Pins used by I2C


    I2C uses two pins outside of any power requirements: SDA, which is a data line,
    and SCL, which is a clock line. These two pins form an information bus, which
    can be used by many devices at once.


    This is where it sounds a lot like SPI; the two pins drive each other. When sending
    an instruction, the SCL pin is flipped, telling us that another bit of data is
    ready, while simultaneously flipping the SDA bit to the value of the bit being
    sent. This allows the programmer and microcontroller to dynamically control the
    clock—this allows accurate data transmission and very few bit errors. However,
    it can be difficult to implement this behavior ourselves.


    Each time data is sent to I2C, an address is sent as the first byte. This address
    refers to the device on which our microcontroller is.


    Luckily, we don''t have to implement this behavior ourselves—Johnny-Five and the
    underlying Firmata system have implemented this for us. However, you will need
    to understand how to write and read from these devices—otherwise, you''ll be stuck
    with a device that won''t even boot up!


    # How I2C devices send and receive data


    Every I2C device has an address, which is usually shown in hexadecimal format.
    For instance, the address of the accelerometer we''ll be using in this chapter
    is 0x53 (the 0x, for those unfamiliar with hexadecimal, indicates that the number
    is in hexadecimal format). This is useful when the I2C bus for a microcontroller
    is controlling multiple devices—the address tells the devices on the bus which
    device we are writing to or reading from. An example of address used follows:


    Data is sent by writing to and reading registers on the I2C device. Every time
    we want to write or read from an I2C device, we need to send the address (so the
    bus know which device you are addressing to) and the register we want to read
    or write. If we are writing data, we also need to send the bit we wish to


    ![](img/798b2390880773c3e3d0e21417ef58f8_190_0.png)'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# Benefits and drawbacks of I2C


    There are definitely benefits and drawbacks of using I2C with Johnny-Five, and
    they can affect your builds or choice of microcontroller.


    # Benefits


    Let''s go through the benefits of using the I2C devices, as follows:


    +   1. One of the benefits of using I2C devices is that you can use several devices
    with just two data pins: SDA and SCL. As this is built on a bus, you can use several
    devices without any issues.

    2. Another benefit of I2C devices is that they conform to a standard; implementing
    these standards mostly to a formula that is easier to follow the devices with
    a less rigid standard (or no standard!).

    3. Finally, there are many I2C backpacks for devices that use several data pins—such
    as our LCD from earlier. These backpacks can make devices usable with microcontrollers
    using fewer pins. There is even some work being done in Johnny-Five to use I2C
    expanders, which will allow devices without analog input or PWM pins to devices
    that require these pins. This is called the Expander API and more info can be
    found on this at johnny-five.io.


    # Drawbacks


    Let''s go through the drawbacks of using the I2C devices, as follows:


    +   1. One of the drawbacks of I2C in Johnny-Five is that not all platforms that
    run Johnny-Five support it—be sure to check the Platform Support section of johnny-five.io
    before trying I2C with your device.

    2. Another drawback of implementing new I2C devices is that timing can be an issue—I2C
    is very synchronous by nature; it requires certain instructions to be sent in
    a certain order with certain delays in between. Johnny-Five and JavaScript are
    not the easiest to wrap around these concepts, and this can cause some really
    interesting race conditions and bugs. However, these issues only appear when implementing
    your own I2C devices.'
  merge: -1
  pgno: 191
