    尝试在传感器附近放置温暖或冰冷的物体，观察条形图如何变化！


    ## 总结


    在本章中，我们学习了如何使用许多不同的输入设备和传感器来构建能够倾听周围环境的 Johnny-Five 项目。我们学习了如何监听事件，以及如何使用通用 `Sensor`
    对象以及 `Button`（按钮）和 `Temperature`（温度）等专用对象。


    在下一章中，我们将开始学习使用传感器让机器人移动。


    ## 第6 章：让你的机器人移动


    在本章中，我们将涵盖以下主题：


    - 各种类型的舵机和电机

    - 使用电机和舵机时的注意事项

    - 舵机和电机的接线

    - 使用电机并配合 REPL 创建项目

    - 使用舵机和传感器创建项目


    ## 本章所需的材料


    你需要你的微控制器——由于兼容性良好，我强烈建议在本章中使用 Arduino Uno。你还需要 USB 数据线、面包板、一些跳线线和一个 10k 欧姆电阻。拿一个光敏电阻，或任何你想尝试的其它传感器。


    你还需要一个 5V 电电运行的电机和一个使用 5V 的标准趣味舵机。这些可以在爱好商店或 Adafruit、SparkFun、Seeed studio 以及许多其他在线商店轻松找到。查看以下章节以了解你的选择。


    ## 各种类型的舵机和电机


    首先，我们将介绍你会遇到的一些常用舵机和电机。但在那之前，对于初学者来说，让我们先快速看一眼电机和舵机的简要描述。


    ## 定义电机和舵机


    电机（在我们的语境下指电动机）将电能转换为动能。电进入，运动输出。这种运动以旋转运动的形式输出；电子电机最常见的用途之一是驱动轮子。请注意，虽然你可以通过控制输入功率来控制电机的速度，但你无法精确地改变电机的位置。


    这就是舵机派上用场的地方。舵机利用电移动到设定点——最常见的是 180 度的弧度内。然而，有些舵机可以旋转 360 度。我们稍后会讨论这些。舵机在技术上是特种电机，虽然电机用于驱动项目，而舵机则用于控制项目。


    ## 注意事项


    有很多可用于你的 Johnny-Five 项目的舵机和电机。虽然我们将介绍其中许多，但在考虑要使用的电机时，有几点需要记住。


    例如，务必注意驱动电机或舵机所需的电压和电流；如果电压超过 5 伏特，你需要使用 Arduino 5V OUT 之外的其他设备为其供电；如果它们的电流很大但只使用
    5V，你可能考虑为你的 Arduino 板板使用外部电源。请注意，每当你有多个舵机时，会有额外的电流——但所需的电压保持不变；例如，如果你有两个需要 5V
    电压但 200 mA 电流的舵机，你仍然只需要 5 伏特，但你将 400 mA 的电流！这些大部分信息可以在你正在使用的电机或舵机的数据表中找到。


    ## 电机类型


    虽然我们在这里将介绍几种类型的电机，但请记住，大多数这些电机的功能是相同的；它们有一个开启和关闭开关，你可以通过调节功率来微调它们的速度。然而，这并不完全排除使用电机的可能性——它们也有一些有趣的用法！


    你的标准趣味电机像一个大圆柱体，一端有几根线，另一端有一根杆，如图所示：


    ![](img/798b2390880773c3e3d0e21417ef58f8_125_0.png)


    标准直流趣味电机


    电机有各种尺寸，并能产生不同水平的功。它们主要用于运动和驱动如遥控汽车等项目。其中一些电机被称为定向电机——这意味着你可以控制方向。对于无方向电机，你只能让电机向一个方向旋转。在考虑你的项目时记住这一点。


    还有震动电机——这些常见于手机中，可以在不发出响铃的情况下提醒你有来电。它们看起来与普通电机相似，但末端的杆上附有一个不对称的配重，如图所示：


    ![](img/798b2390880773c3e3d0e21417ef58f8_126_0.png)


    震动电机


    这些电机主要用于触觉反馈，但在可穿戴设备和手机领域，这可能是解决问题的关键环节之一！


    最后，是步进电机。它们通常更大且需要更多功率：


    ![](img/798b2390880773c3e3d0e21417ef58f8_126_1.png)


    步进电机


    然而，步进电机以离散的方式移动，让你在全旋转时获得更多的控制和精密度。这些电机的一个非常常见的用途是 3D 打印——这些是必不可少的。


    ## 舵机类型


    主要有两种类型。第一种是标准舵机，通常用于遥控车辆（如汽车），如图所示：


    ![](img/798b2390880773c3e3d0e21417ef58f8_127_0.png)


    标准舵机


    这些舵机在 180 度范围内移动。还有可以旋转 360 度的连续舵机。它们经常用于机器人领域，因为可以设定特定的速度。


    连续舵机看起来与标准舵机相似，如图所示：


    ![](img/798b2390880773c3e3d0e21417ef58f8_128_0.png)


    连续舵机


    ##用舵机还是电机？


    这是一个非常棒的问题：如果你想要运动，你应该用哪一个？舵机还是电机？经验法则是，如果你想要精确的运动，你需要舵机；而电机通过发送它的功率量来开启关闭。许多人会认为如果你想要全
    360 度范围，就只能限于电机。事实并非如此；连续舵机结合了舵机的精确特性和电机提供的全范围。


    ## 舵机和电机控制器


    有时，你可能在项目中使用许多电机或舵机；一个很好的例子是六足机器人套件，它使用了高功率舵机！Arduino Uno 的引脚并不多，但使用舵机或电机控制器，你可以使用两个数据引脚控制许多电机或舵机。这些控制器使用了第4章“专用输出设备”中讨论过的
    I2C 方法。Johnny-Five 内置了对这类控制器的支持。如果你想使用一个，请确保查看 www.johnny-five.io 上的文档以确保你的设备是兼容的。


    ![](img/798b2390880773c3e3d0e21417ef58f8_130_0.png)


    带有 I2C 接口的舵机控制器示例


    ## 电机舵机扩展板


    Shield 是 Arduino 的术语，指放置在 Arduino（通常是 Uno）之上的板，以提供额外的功能。扩展板可以添加 Wi-Fi、LED 矩阵等。一种常见的扩展板类型是用于电机和舵机的扩展板。Johnny-Five
    支持一些用于电机的扩展板。同样，如果你希望使用许多或高功率电机，请查看 www.johnny-five.io 上的文档，查看电机扩展板是否适合你的项目。


    ![](img/798b2390880773c3e3d0e21417ef58f8_131_0.png)


    电机扩展板示例


