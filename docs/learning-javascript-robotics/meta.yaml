- img_proc: true
  md: '# # About the Reviewers


    Chris S. Crawford (@chris_crawford_) is a PhD student in Human-Centered Computing
    at the University of Florida. He is currently a graduate researcher in Brain-Computer
    Interface Research Group in Human-Experience Research Lab. His research focus
    is Brain-Robot Robot Interaction, which consists of investigating the ways in
    which physiological signals such as electroencephalogram (EEG) can be used to
    enhance human-robot interactions. Chris has experience of working in various areas
    including perceptual computing, 3D computer graphics, televoting, and native/web
    app development. Currently, he also serves as a lead software engineer for SeniorGeek
    Communications, LLC.


    Tomomi Imura (@girlie_mac) is an avid open web and open technology advocate, a
    frontend engineer, and a creative technologist, who has been active in the mobile
    space for more than 8 years, before she started working with Internet of Things.
    She loves to hack with hardware and occasionally gives talks at conferences and
    workshops on prototyping IoT with Raspberry Pi.


    She works as a senior developer evangelist at the San Francisco-based data stream
    provider, PubNub, to support the best developer experiences.'
