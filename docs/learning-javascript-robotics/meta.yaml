    \ NodeBot。我们介绍了书中将使用的硬件组件，并学习了如何设置开发环境。最后，我们了解了如何让板载 LED 闪烁。在下一章中，我们将深入探讨为什么 Johnny-Five\
    \ 如此强大，并开始编写和构建更复杂的项目。\n\n# 第 2 章. 使用 Johnny-Five\n\n在本章中，我们将开始使用 Johnny-Five\
