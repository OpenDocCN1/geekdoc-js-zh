  - '[PAGE 159]


    # Writing keyframes


    Writing keyframes are at the core of the Animation API—the power of this API is
    its ability to tween between our keyframes. Each keyframe is an object, and you''ll
    pass your keyframes into your segment via an array. Remember: you''ll want to
    write a keyframe for each of your cue points.


    # The keyframe object


    As each keyframe is an object, we have access to a few properties that we can
    establish for each one:


    | Keyframe | Properties |

    |---|---|n| degrees | degrees is what the name implies; the degree you want the
    servo to be at when the keyframe is reached. It should be an integer value between
    0 and 180 inclusive. |

    | step | step is similar to degrees, but relative to the last keyframe; for instance,
    if degrees is set to 135 in the first keyframe and step is set to -45 in the next
    keyframe, the second keyframe will move the servo to 135-45 = 90 degrees. |

    | easing | When you create an animation segment, by default tweening is done at
    the speed for the entire span between two keyframes. The easing functions are
    applied to these frames to change the speed. This can make a motion loop like
    fluid or serve a practical purpose; easing can make quick movements in different
    directions easier on your servos and equipment.|


    There are several easing functions available via Johnny-Five''s use of the ease-component
    module; one very popular is inCirc, which causes the frames to move slowly at
    first, quickly increasing the middle, and slowing down again towards the end.
    See the Johnny-Five and ease-component docs for more examples of easing functions.


    | Keyframe | Properties |

    |---|---|n| copyDegrees | copyDegrees calculates the calculated or explicitly
    set value from the frame at the index. For, let''s say we have two keyframes:
    one has degrees set to 90, and the second has step set to 45. If we create a keyframe
    with copyDegrees set to 0, it will copy the first frame and set to 90. If we set
    the index to 1, it will copy the second frame and 90 + 45 = 135 will be the setting
    for the third keyframe. |

    | copyFrame | copyFrame is similar to copyDegrees, but it copies all the attributes
    of the frame instead of just the degrees; this includes easing functions and so
    on.|


    position is an advanced and new concept in Johnny-Five''s Animation API. This
    allows you to get three tuples representing a 3D coordinate in space, and it will
    move the array of servos to this point.


    It is worth noting that you need more than just Johnny-Five for this; you''ll
    need an IK (Inverse Kinematic) solver, such as Donovan Buck''s sharp project.
    Getting into the details of position is outside the scope of this book, but it
    is still actively developed and the functionality might change. However, if you''re
    looking to build a robot that moves with you, check this out.'
- md: "\n## Keyframe shorthand\n\nYou can also define keyframes without objects; if\
    \ you pass your keyframes as an array of integer values, each integer value will\
    \ be interpreted as a step value. Consider the following array:\n\n```\nkeyFrames:\
    \ [0, 90, -45, 90, -90]\n```\n\nThis will (assuming a 0 start point) move the\
    \ servo to 0, 90, 45, 135, and 45 degrees for each cue point.\n\nYou can also\
    \ use non-integer values in shorthand syntax to mean specialized values:\n\n|\
    \ Values | Properties |\n|---|---|\n| null | When null is passed into a shorthand\
    \ keyframes array, its value depends on its position. If it is the first keyframe,\
    \ the segment will use the existing servo position as its first frame. If it is\
    \ the last in array, it will copy the previous keyframe's value. However, if it\
    \ is used between two frames, something interesting happens: it will drop the\
    \ keyframe, and tweening will be calculated between the keyframe before and after\
    \ the null value. This can be handy if you like a servo to take more time between\
    \ two keyframes. |\n| false | false, used anywhere in a shorthand keyframe array,\
    \ will copy the last known value. It will not move the servo between the two keyframes.\
    \ |\n\nSo, in closing, you can use either a keyframe object, a number, null, or\
    \ false to represent a keyframe in a segment definition. Now that we've explored\
    \ the attributes available on a keyframe object, let's write some keyframes to\
    \ match certain situations.\n\n## Examples of writing keyframes\n\nLet's explore\
    \ some examples of keyframes:\n\nExample 1: Write a set of keyframes that starts\
    \ a servo at the last position it was at, moves to it by 90 degrees with an inOutCirc\
    \ easing, then moves it by 45 degrees back with no easing:\n\n- 1. The first keyframe\
    \ can be handled using the null value:\n```javascript\nvar myFrames = [null];\n\
    ```\n- 2. The second requires a keyframe object because we want to establish an\
    \ easing function:\n```javascript\nvar myFrames = [null, { degrees: 90, easing:\
    \ 'inOutCirc' }];\n```\n- 3. The last could be done with a keyframe object:\n\
    ```javascript\nvar myFrames = [null, { degrees: 90, easing: 'inOutCirc' }, { step:\
    \ -45 }];\n```\n\nHowever, we can also use shorthand—remember that passing a number\
    \ as a keyframe will lead to:\n\n```javascript\nvar myFrames = [null, {degrees:\
    \ 90, easing: 'inOutCirc'}, -45];\n```\n\nAmong the preceding alternatives, which\
    \ one you are entirely up to your own preference.\n\n**Example 2:** Write a set\
    \ of keyframes that starts the servo at 0, moves to 90, spends two points moving\
    \ to 180, and then moves to 135:\n\n- 1. The first and second keyframes can be\
    \ set via a keyframe object, as follows:\n```javascript\nvar myFrames = [{degrees:\
    \ 0}, {degrees: 90}];\n```\n- 2. Otherwise for the second keyframe, we can use\
    \ a shorthand, as shown here:\n```javascript\nvar myFrames = [{degrees: 0}, 90];\n\
    ```\n\nAs we know the first keyframe will set the servo to 0, we can use step\
    \ instead of degrees. For the next step, we want the servo to take two cue points\
    \ to move to 180. We could calculate how to do this with standard keyframes, or\
    \ we could use a shorthand null to tell the segment to skip that cue point and\
    \ tween between 90 and 180 over two cue points:\n\n```javascript\nvar myFrames\
    \ = [{degrees: 0}, 90, null, {degrees: 180}]\n```\n\nNow you've learned how to\
    \ write keyframe arrays and objects, let's take a look at writing the rest of\
    \ our Animation object.\n\n## Writing segments\n\nWe know segments consist of\
    \ an array of keyframes, an array of cue points, a duration, and some options.\
    \ Let's take a look at the options available to us in each segment, and then build\
    \ some segments to get us ready for our next project.\n\n## Segment options\n\n\
    The segment options and their properties are as follows:\n\n| Segment options\
    \ | Properties |\n| - | - |\n| target | You can use this in the segment to override\
    \ the target segment operates on; this is usually specified by the animation,\
    \ so setting it in the segment overrides the animation's assignment |\n| easing\
    \ | Just like keyframes, you can set an easing function for an entire segment.\
    \ Note that easing functions stack; if you use an easing function on keyframes\
    \ and a segment, the tweening will calculate the keyframe easing and then the\
    \ segment easing |\n| loop | This is a Boolean; true causes this segment to loop\
    \ enqueued until it is stopped by the animation it was queued to |\n| loopBack\
    \ | If you'd like a segment to loop back to some other than the first cue point,\
    \ you can specify the index of that cue point here. For instance if a segment\
    \ has the cue points [0, .25..75, 1] and you set LoopBack to 1, it will loop the\
    \ cue points [.25,.75, 1] only |\n| metronome | This is a Boolean; true, the segment\
    \ will run from the first cue point to the last, back to the first in reverse\
    \ order. You can combine this with the loop option, but it will not loop by default\
    \ |\n| progress | This attribute can be either used as information about a running\
    \ segment (as we will see in a later project) or set; set the current progress\
    \ of the animation if you'd to start at a different point. This should be a value\
    \ between 0 and 1, which cue points |\n| speed | Much like progress, this can\
    \ be used as information. The default is 1, and this changes the multiplier which\
    \ the segment runs |\n| fps | This sets the maximum frames per second that a segment\
    \ can run. The default is 60. Changing the maximum fps of a segment will not change\
    \ speed or cue points |\n\n## Multiple servos in one segment\n\nMore or not, you'll\
    \ be animating more than one servo at a time. How do you handle keyframes for\
    \ more than one? By passing an array of arrays; each array represents keyframes\
    \ for a servo. For instance the following segment contains keyframes for two servos\
    \ in an array:\n\n```javascript\nvar multiServoSegment = {\n  duration: 2000,\n\
    \  cuePoints: [0, .5, 1],\n  keyframes: [\n    [degrees: 135, -45],\n    [degrees:\
    \ 45, 45]\n  ]\n}\n```\n\n## Examples of writing segments\n\nLet's walk through\
    \ a couple examples of writing segments.\n\n**Example 1:** Write a sweeping segment\
    \ that goes from 0 to 180 and back. Give it the inOutCirc easing and make it loop.\
    \ The duration should be 5 seconds, with keyframes as possible. Now we could out\
    \ our keyframes from 0 to 180 and back, or we could use the metronome option to\
    \ help us. Using the metronome function means that we only need keyframes and\
    \ cue points—here's the result of this example:\n\n```javascript\nvar sweepingSegment\
    \ = {\n  duration: 5000,\n  metronome: true,\n  loop: true,\n  easing: 'inOutCirc',\n\
    \  cuePoints: [0, 1],\n  keyframes: [{degrees: 0}, {degrees: 180}]\n}\n```\n\n\
    **Example 2:** Write a segment that runs once. This segment contains instructions\
    \ for two servos. Servo starts at whatever the servo is already at, adds 45 degrees\
    \ over 1 second, then removes 30 degrees over 2 seconds, and finally adds 15 degrees\
    \ over 1 second. The second servo simply moves from 20 degrees to 120 degrees\
    \ over the duration, with full tweening and the inOutCirc easing. The duration\
    \ of the segment should be 4 seconds. We're using relative positions here, so\
    \ it looks like keyframe shorthand will come in handy. We have to set cue points\
    \ at 0, .25, .75, and 1. Remember—in keyframe shorthand, null at the beginning\
    \ means we use the current position of the servo, and null in the middle means\
    \ skip the cue point and recalculate tweening! Keeping all of this in mind, we\
    \ give the following:\n\n```javascript\nvar mySegment = {\n  duration: 4000,\n\
    \  cuePoints: [0, .25, .75, 1],\n  keyframes: [\n    [null, 45, -30, 15],\n  \
    \  [{degrees: 20}, null, null, {degrees: 120}]\n  \n}\n```\n\nThis is the true\
    \ power of the Animation API—we can describe complex movements in objects that\
    \ mathematically work out. Now that we know how to write keyframes and segments,\
    \ let's take a look at writing Animation objects and running segments using them.\n\
    \n## The Animation object\n\nThe analogy that I like for the Animation object\
    \ is to think of it like an MP3 player. You load tracks into it, and you can play,\
    \ pause, or stop. You queue segments into an animation in any order, and you can\
    \ play, pause, or stop the animation at any time.\n\nLet's take a quick look at\
    \ the constructor: it only takes one parameter, which is the target. As we mentioned\
    \ earlier, the target is the servo or an array of servos being animated. So, let's\
    \ take a look at a sample program that constructs a servo array and constructs\
    \ an Animation object:\n\n```javascript\nvar five = require('johnny-five')\n\n\
    var board = new five.Board()\n\nboard.on('ready', function() {\n  var servos =\
    \ new five.Servos([3, 5, 6])\n  var animation = new five.Animation(servos)\n})\n\
    ```\n\nOnce you've constructed the Animation object, the next important function\
    \ is .enqueue(). You pass a segment to this function to add it to the animation\
    \ queue. Animations are run first-in, first-out, so our code becomes:\n\n```javascript\n\
    var five = require('johnny-five')\n\nvar board = new five.Board()\n\nboard.on('ready',\
    \ function() {\n  var servos = new five.Servos([3, 5, 6])\n  var animation = new\
    \ five.Animation(servos)\n\n  var mySegment = {\n    easing: 'inOutCirc',\n  \
    \  duration: 3000,\n    cuePoints: [0, .25, .75, 1],\n    keyframes: [[degrees:\
    \ 45], 45, 45, -45]\n  }\n\n  animation.enqueue(mySegment)\n})\n```\n\nThat's\
    \ the whole kit and caboodle; animations are set to run as soon as a segment is\
    \ enqueued!\n"
  mdcn: "\n\n## 关键帧简写\n\n你也可以在不对象的情况下定义关键帧；如果你将关键帧作为整数值数组传递，则每个整数值将被解释为步进值（step value）。考虑以下数组：\n\
    \n```\nkeyFrames: [0, 90, -45, 90, -90]\n```\n\n这（假设起始点为 0）将在每个时间点将舵机移动到 0、90、45、135\
    \ 度和 45 度。\n\n你也可以在简写语法中使用非整数值来表示特殊值：\n\n| 值 | 属性 |\n|---|---|\n| null | 当将 `null`\
    \ 传递到简写关键帧数组时，其值取决于它所在的位置。如果它是第一个关键帧，该分段将使用现有的舵机位置作为第一帧。如果它是数组中的最后一个，它将复制上一个关键帧的值。然而，如果它被用在两个帧之间，就会发生一些有趣的事情：它将丢弃该关键帧，并在\
    \ null 值之前之后的关键帧之间计算补间动画（tweening）。如果你希望舵机在两个关键帧之间花费更多时间，这会非常有用。 |\n| false |\
    \ `false` 在简写关键帧数组中的任何地方使用，将复制最后一个已知值。它不会在两个关键帧之间移动舵机。 |\n\n所以，最后，你可以使用关键帧对象、数字、`null`\
    \ 或 `false` 来表示分段定义中的关键帧。现在我们已经探索了关键帧对象上可用的属性，让我们写一些以匹配某些情况的关键帧。\n\n## 编写关键帧的示例\n\
    \n让我们探索一些关键帧的示例：\n\n示例 1：编写一组关键帧，让舵机从上一个的位置开始，通过 `inOutCirc` 缓动移动 90 度，然后在无缓动的情况下向回移动\
    \ 45 度：\n\n- 1. 第一个关键帧可以使用 `null` 值来处理：\n```javascript\nvar myFrames = [null];\n\
    ```\n- 2. 第二个需要关键帧对象，因为我们想要建立一个缓动函数：\n```javascript\nvar myFrames = [null, { degrees:\
    \ 90, easing: 'inOutCirc' }];\n```\n- 3. 最后一个可以使用关键帧对象完成：\n```javascript\nvar\
    \ myFrames = [null, { degrees: 90, easing: 'inOutCirc' }, { step: -45 }];\n```\n\
    \n然而，我们也可以使用简写——记住将数字作为关键帧会导致：\n\n```javascript\nvar myFrames = [null, {degrees:\
    \ 90, easing: 'inOutCirc'}, -45];\n```\n\n在上述替代方案中，选择哪一个完全取决于你的喜好。\n\n**示例 2：**编写一组关键帧，让舵机从\
    \ 0 开始，移动到 90，花费两个点移动到 180，然后移动到 135：\n\n- 1. 第一个和第二个关键帧可以通过关键帧对象设置，如下：\n```javascript\n\
    var myFrames = [{degrees: 0}, {degrees: 90}];\n```\n- 2. 否则对于第二个关键帧，我们可以使用简写，所示：\n\
    ```javascript\nvar myFrames = [{degrees: 0}, 90];\n```\n\n由于我们知道第一个关键帧将舵机设置为 0，我们可以使用\
    \ `step` 代替 `degrees`。对于下一步，我们希望舵机花费两个时间点移动到 180。我们可以用标准关键帧计算如何执行，或者我们可以使用简写的\
    \ `null` 告诉分段跳过该时间点，并在两个时间点在 90 和 180 之间进行补间动画：\n\n```javascript\nvar myFrames\
    \ = [{degrees: 0}, 90, null, {degrees: 180}]\n```\n\n现在你已经学会了如何编写关键帧数组和对象，让我们看看\
    \ Animation 对象的其余部分。\n\n## 编写分段\n\n我们知道分段由关键帧数组、时间点数组、持续时间（duration）和一些选项组成。让我们看看每个分段对应的选项，然后构建一些分段为我们的项目做准备。\n\
    \n## 分段选项\n\n分段选项及其属性如下：\n\n| 分段选项 | 属性 |\n|---|---|\n| - | - |\n| target | 你可以在分段中使用它覆盖目标；通常由动画指定，因此在分段中设置它覆盖\
    \ |\n| easing | 与关键帧一样，可以为整个分段设置缓动函数。注意缓动函数是堆叠的；如果你在关键帧和分段中使用缓动函数，补间动画将计算关键帧和然后分段的\
    \ |\n| loop | 这是一个布尔值；`true` 导致分段循环，直到被动画停止 |\n| loopBack | 如果你希望分段循环到第一个时间点以外，可以在这里指定索引。例如，如果分段有时间点\
    \ `[0,.25,.75,1]` 并设置 `LoopBack` 为 1，它将循环到该时间点 |\n| metronome | 这是一个布尔值；`true`\
    \ 分段将从第一个时间点反向运行到最后一个。你可以将其与 loop 选项结合，但默认不循环 |\n| progress | 此属性可以用作运行分段的信息（我们稍后的项目中看到）或设置动画当前进度，这是一个\
    \ 0 到 1 之间的值 |\n| speed | 与 progress 类似，可以作为信息。默认是 1，这改变分段运行的倍数 |\n| fps | 这设置分段每秒可以运行的最大帧数。默认是\
    \ 60。更改分段的 fps 不改变速度或时间点 |\n\n## 一个分段中的多个舵机\n\n无论如何，你都在同时动画多个舵机。如何处理多个舵机的关键帧？通过传递数组数组；每个数组代表一个舵机的关键帧。例如，以下分段包含两个舵机的关键帧数组：\n\
    \n```javascript\nvar multiServoSegment = {\n  duration: 2000,\n  cuePoints: [0,\
    \ .5, 1],\n  keyframes: [\n    [degrees: 135, -45],\n    [degrees: 45, 45]\n \
    \ ]\n}\n```\n\n## 编写分段的示例\n\n让我们过的几个分段的示例。\n\n**示例 1：**编写一个从 0 到 180 再返回的分段。给它\
    \ `inOutCirc` 缓动并让它循环。持续时间应该是 5 秒，可以使用关键帧。现在我们可以写出从 0 到 180 再返回的关键帧，或者我们可以使用 metronome\
    \ 选项来帮助。使用 metronome 函数意味着我们只需要关键帧和时间点——这是该示例的结果：\n\n```javascript\nvar sweepingSegment\
    \ = {\n  duration: 5000,\n  metronome: true,\n  loop: true,\n  easing: 'inOutCirc',\n\
    \  cuePoints: [0, 1],\n  keyframes: [{degrees: 0}, {degrees: 180}]\n}\n```\n\n\
    **示例 2：**编写一个运行一次的分段。此分段包含两个舵机的指令。舵机从当前位置开始，在 1 秒内增加 45 度，然后在 2 秒内移除 30 度，最后在\
    \ 1 秒内增加 15 度。第二个舵机在持续时间内简单的从 20 度移动到 120 度，具有完整的补间的 `inOutCirc` 缓动。分段的持续时间应该是\
    \ 4 秒。我们在这里使用相对位置，所以关键帧简写大派用场。我们必须在 0,.25,.75 和 1 设置时间点。记住——在关键帧简写中，开头的 `null`\
    \ 意味着使用舵机的当前位置，中间的 `null` 意味着跳过时间点并重新计算补间！记住这些，我们给出以下：\n\n```javascript\nvar mySegment\
    \ = {\n  duration: 4000,\n  cuePoints: [0, .25, .75, 1],\n  keyframes: [\n   \
    \ [null, 45, -30, 15],\n    [{degrees: 20}, null, null, {degrees: 120}]\n  ]\n\
    }\n```\n\n这就是 Animation API 的真正威力——我们可以在对象中描述数学上行的复杂运动。现在我们已经知道如何编写关键帧和分段，让我们看看编写\
    \ Animation 对象并使用它们运行分段。\n\n## Animation 对象\n\n我喜欢的对 Animation 类比是把它想象成 MP3 播放器。你将轨道加载到其中，可以播放、暂停或停止。你可以任何顺序将分段队列到动画中，并随时播放、暂停或停止动画。\n\
    \n让我们快速看看构造函数：它只接受一个参数，即 `target`。正如我们之前提到的，目标是正在动画化的舵机或舵机数组。所以，让我们看看一个构造舵机数组并构造\
    \ Animation 对象的示例程序：\n\n```javascript\nvar five = require('johnny-five')\n\nvar\
    \ board = new five.Board()\n\nboard.on('ready', function() {\n  var servos = new\
    \ five.Servos([3, 5, 6])\n  var animation = new five.Animation(servos)\n})\n```\n\
    \n一旦构造了 Animation 对象，下一个重要的函数是 `.enqueue()`。你将一个分段传递给此函数以添加到动画队列中。动画是先先出的，所以我们的代码变成：\n\
    \n```javascript\nvar five = require('johnny-five')\n\nvar board = new five.Board()\n\
    \nboard.on('ready', function() {\n  var servos = new five.Servos([3, 5, 6])\n\
    \  var animation = new five.Animation(servos)\n\n  var mySegment = {\n    easing:\
    \ 'inOutCirc',\n    duration: 3000,\n    cuePoints: [0, .25, .75, 1],\n    keyframes:\
    \ [[degrees: 45], 45, 45, -45]\n  }\n\n  animation.enqueue(mySegment)\n})\n```\n\
    \n全部就是这样；一旦分段入队列，动画就会开始运行！\n\n"
