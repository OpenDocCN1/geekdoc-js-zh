    developer and moved to server-side with the advent of Node.js and was especially
    enthralled by the advance of the NodeBots community. She travels the world speaking
    at conferences about NodeBots and the fantastic community around them. When she''s
    not building bots, she''s knitting, sewing, sculpting, or playing video games
