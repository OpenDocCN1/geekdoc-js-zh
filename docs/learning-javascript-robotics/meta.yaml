    # Learning the terminology


    There are two parts that make up any servo animation in Johnny-Five: a target
    and one or more segments. The target is either a servo or an array of servos.
    We''ll go into the programmatic differences between a servo and a servo array
    in our first project; the basic point is that a ServoArray object in Johnny-Five
    allows a logical grouping and the manipulation of multiple servos—a leg, for instance,
    would be a logical use of a ServoArray object.


    A segment is the programmatic description of a piece of animation. It is comprised
    of a few pieces of information: a duration, cue points, and keyframes.


    A keyframe is a description of the position of the target at a given point. A
    keyframe has no concept of time; it is an instantaneous description of state.
    Keyframes are combined with cue points in a segment to add the concept of time.


    Cue points are the points at which each keyframe is placed in a segment. This
    is not a discrete point in time; cue points are described relative to the segment,
    usually as a decimal between 0 and 1 where 0 is the beginning of the segment and
    1 is the end.


    The duration outlines exactly how long the segment will take. The rest of the
    information uses the duration to calculate the speeds necessary to make it between
    keyframes at the cue points given. Duration adds the concept of discrete time
    to a segment.


    In order to better understand how these work together, let''s walk through a segment
    description: we have a segment with a duration of 2000 ms (2 seconds). It has
    cue points at 0, .75, and 1. There are two servos in our target: keyframe 1 has
    servo 1 at 0 degrees, and servo 2 at 90 degrees. Keyframe 2 has servo 1 at 45
    degrees, and servo 2 at 135 degrees. Keyframe 3 has servo 1 at 90 degrees, and
    servo 2 at 180 degrees. So in all, we have a servo starting at 0 degrees and moving
    to 90 degrees over 2 seconds, and a second servo moving from 90 to 180 degrees
    in that same 2 seconds.


    A graphical representation of this can be seen in the following figure:


    ![](img/798b2390880773c3e3d0e21417ef58f8_151_0.png)'
  - '[PAGE 152]


    # A graphical representation of an animation segment


    So, now that we have our segment information, let''s use the duration and cue
    points to see when each keyframe should be reached: the 0 cue point will be reached
    at 0 ms, the .75 cue point will be reached at 1,500 ms, and the 1 cue point will
    be reached at 2,000 ms. But how do we determine when a cue point will be reached
    in a segment? We can use the following formula to determine when a cue point will
    be reached in a segment:


    ```

    time of cue point = cue point value * duration

    ```


    The formula for a cue point time


    So, for the .75 cue point, 2000 ms * .75 = 1500 ms.


    Now, we match these cue points to our keyframes: at 0 ms, servo one will be at
    0 and servo two at 90 degrees. At 1500 ms, servo one will be at 45 degrees and
    servo two will be at 135 degrees, and at 2000 ms, servo one will be at 90 degrees
    and servo two at 180 degrees. A graphical representation of this is shown in figure
    3:


    ![](img/798b2390880773c3e3d0e21417ef58f8_152_0.png)


    The pictures of the servo movement from the segment


    So, in summary, an animation consists of segments applied to a target. Segments
    consist of keyframes, set to cue points whose timings are determined by the segment''s
    duration.


    You get a glimpse of the Power Animation API gives you this example; trying to
    calculate the speed needed to move one servo from one degree point to another
    x milliseconds is a difficult task—to get a lot of servos that represent an arm
    or leg to do would be chaotic. The Animation API does this for you by allowing
    you to set keyframes and cue points in a segment to achieve the movement you want.'
- md: "\n# The difference between .to() and the Animation API\n\nIt may look like\
    \ the extra options in the .to() method for servos allow the creation of animations\
    \ implicitly. This is not the case!\n\nThe duration parameter, while allowing\
    \ servos to move at non-max speeds, does not necessarily serve the same purpose\
    \ as an animation. The rate parameter does not create keyframes; the rate parameter\
    \ creates a number of discrete movements, and they are moved to the maximum speed.\n\
    \nSo, while using .to() with durations and rates may seem like creating animations,\
    \ you should know that they are not a full substitute to write your own animations\
    \ and segments using the Animation API.\n\n## Using the ServoArray object\n\n\
    We've discussed the concept of ServoArray, but let's look at it in a little more\
    \ detail, we'll be using it in this chapter's projects.\n\nConstructing the ServoArray\
    \ object looks remarkably similar to constructing a single servo; however, the\
    \ object is called Servos instead of Servo, and you pass in an array of pins representing\
    \ the pins your group of servos is:\n\n```javascript\nvar myServos = five.Servos([3,\
    \ 5, 6]);\n```\n\nThis creates an array of servos that are on pins 3, 5, and 6.\n\
    \nPerforming actions on a servo array is also remarkably similar to moving a single\
    \ servo; using .to() will move all the servos using the parameters given. For\
    \ instance, consider the following:\n\n```javascript\nmyServos.to(120, 500);\n\
    ```\n\nThis will move all the servos in the array to 120 degrees over 500 ms.\
    \ If you'd like to move one servo independently, all you need is its key in the\
    \ servo array—you can then reference it and move it as a standard Servo object:\n\
    \n```javascript\nmyServos[0].to(90, 200);\n```\n\nThis moves the first servo in\
    \ the array to 90 degrees over 200 ms.\n\nServoArrays are also very useful in\
    \ creating animations; you can address an entire array of servos with a single\
    \ keyframe, allowing you to write keyframes and segments for several servos at\
    \ once, instead of writing them separately for each servo.\n\nNow that we've explored\
    \ the terminology and concepts behind the Animation API, let's build our first\
    \ project; we're going to build three servos into a servo array that we can manipulate.\n\
    \n## Project – wiring up three servos and creating an array\n\nFirst, you'll have\
    \ to wire up your three servos as shown in the following figure:\n\n![](img/798b2390880773c3e3d0e21417ef58f8_155_0.png)\n\
    \nTaking our knowledge of Johnny-Five and the code we went over in the last section,\
    \ let's write a code to create a servo array of the servos we just wired up and\
    \ inject them into the REPL so that we can run some code in real time. Place the\
    \ following into `servo-array.js`:\n\n```javascript\nvar five = require('johnny-five')\n\
    \nvar board = new five.Board({\n  port: '/dev/cu.usbbmodem14131'\n})\n\nboard.on('ready',\
    \ function(){\n  var myServos = new five.Servos([3,5,6])\n  this.repl.inject({\n\
    \    servos: myServos\n  })\n});\n```\n\nNow we run it with the following:\n\n\
    - node servo-array.js\n\nIf so, eventually, REPL will start and your servos should\
    \ move to their starting position (the default is 90).\n\nLet's explore moving\
    \ these servos as a group. Let's sweep them all:\n\n```javascript\nservos.sweep()\n\
    ```\n\n### Tip\n\nIf, while sweeping all the servos in your array, they seem choppy,\
    \ don't fret; we are using three servos now, which takes more electric current\
    \ than usual. The choppiness is due to a lack of electric current. While this\
    \ is OK for our present example, you should definitely take a look at the powering\
    \ servos section in Chapter 6, Moving Your Bot, if you want to make a project\
    \ with multiple servos run smoothly.\n\nWe can stop the servos with the following:\n\
    \n```javascript\nservos.stop()\n```\n\nNow, let's explore how to use .to(), and\
    \ not only look at how it works with each servo, but also how duration and rate\
    \ don't substitute the writing of an animation.\n\nWe can move all of the servos\
    \ to the same angle using .to(), as follows:\n\n```javascript\nservos.to(0)\n\
    ```\n\nWe can use the same parameters, duration, and rate that we used with a\
    \ single servo, as shown here:\n\n```javascript\nservos.to(90, 500, 10)\n```\n\
    \nThat's pretty smoothly, right? Like an animation would? That's true! But let's\
    \ slow .to() and see what's actually happening here:\n\n```javascript\nservos.to(0)\n\
    ```\n\n```javascript\nservos.to(180, 10000, 20)\n```\n\nThat's a 180-degree movement\
    \ over 10 seconds with 20 discrete steps. Did you notice the choppiness? That's\
    \ because this writes to servoWrite() instead of writing an animation segment.\n\
    \nYou can also control one servo at a time as we explored in the last section.\
    \ For instance, run the following:\n\n```javascript\nservos[0].to(0);\n```\n\n\
    This will move the first servo (on pin 3) to 0 degrees.\n\nThere are some great\
    \ options in the API that will make movements smoother. Let's explore:\n\n## Writing\
    \ Animations\n\nAs we discussed in the last section, an animation is created in\
    \ Johnny-Five and then we'll learn about:\n\n## Writing keyframes\n\nWriting keyframes\
    \ are at the core of the API; the power of this API is its ability to tween between\
    \ keyframes.\n\n## The keyframe object\n\nAs each keyframe is an object, we have\
    \ access to a few properties:\n\n| Keyframe | Properties |\n|---|---|\n| degrees\
    \ | degrees is what the name implies; the degree you want the servo to be when\
    \ the keyframe is reached. It should be an integer value between 0 and 180. |\n\
    | step | step is similar to degrees, but relative to the last keyframe; for instance,\
    \ if degrees is set to 135 in the keyframe and step is set to -45 in the next\
    \ keyframe, the second keyframe will move to 135-45 = 90. |\n| easing | When you\
    \ create an animation segment, by default tweening is done at the speed. The easing\
    \ functions are applied to these frames to change the speed. |\n\nThere are several\
    \ easing functions available via Johnny-Five's use of the ease-component module;\
    \ one very popular is inCirc, which causes the frames to move slowly at first,\
    \ quickly increasing the middle, and slowing down again towards the end. See the\
    \ Johnny-Five and ease-component docs for more examples.\n\n| Keyframe | Properties\
    \ |\n|---|---|\n| copyDegrees | copyDegrees calculates the calculated or explicitly\
    \ set value from the frame at the index. For, let's say we have two keyframes:\
    \ one has degrees set to 90, and the second has step set to 45. If we create a\
    \ keyframe with copyDegrees set to 0, it will copy the first frame and set to\
    \ 90. If we set the index to 1, it will copy the second frame and 90 + 45 = 135\
    \ will be the setting for the third keyframe. |\n| copyFrame | copyFrame is similar\
    \ to copyDegrees, but it copies all the attributes of the frame instead of just\
    \ the degrees; this includes easing functions and so on. |\n\nposition is an advanced\
    \ and new concept in Johnny-Five's Animation API. This allows you to get three\
    \ tuples representing a 3D coordinate in space, and it will move the array of\
    \ servos to this point.\n\nIt is worth noting that you need more than just Johnny-Five\
    \ for this; you'll need an IK (Inverse Kinematic) solver, such as Donovan Buck's\
    \ sharp project. Getting into the details of position is outside the scope of\
    \ this book, but it is still actively developed and the functionality might change.\
    \ However, if you're looking to build a robot that moves with you, check this\
    \ out.\n"
  mdcn: "\n\n# .to() 与 Animation API 之间的区别\n\n看起来 `.to()` 方法中的额外选项允许隐式地创建动画。事实并非如此！\n\
    \n`duration` 参数虽然允许舵机以非最大速度移动，但其目的并不一定与动画相同。`rate` 参数不会创建关键帧；`rate` 参数创建的是若干离散的动作，并且这些动作会以最大速度移动。\n\
    \n因此，虽然使用带有 `durations` 和 `rates` 的 `.to()` 看起来看起来像在创建动画，但你应该知道，它们并不是使用 Animation\
    \ API 编写自定义动画和片段的完全替代方案。\n\n## 使用 ServoArray 对象\n\n我们已经讨论过 `ServoArray` 的概念，但让我们更详细地查看它，我们将在本章节中使用它。\n\
    \n构造 `ServoArray` 对象看起来与构造单个舵机非常相似；然而，该对象被称为 `Servos` 而不是 `Servo`，你传入的是一个引脚数组，代表你的舵机组所占的引脚：\n\
    \n```javascript\nvar myServos = five.Servos([3, 5, 6]);\n```\n\n这创建了一个位于引脚 3、5\
    \ 和 6 的舵机数组。\n\n在舵机数组上执行操作与移动单个舵机也非常相似；使用 `.to()` 将根据给定的参数移动所有舵机。例如，考虑以下代码：\n\n\
    ```javascript\nmyServos.to(120, 500);\n```\n\n这将数组中的所有舵机在 500 ms 内移动到 120 度。如果你想独立地移动一个舵机，只需要它在舵机数组中的键（key）——你可以引用它并像标准的\
    \ `Servo` 对象一样移动它：\n\n```javascript\nmyServos[0].to(90, 200);\n```\n\n这将数组中的第一个舵机在\
    \ 200 ms 内移动到 90 度。\n\n`ServoArrays` 在创建动画时也非常有用；你可以用一个关键帧来控制整个舵机数组，允许你同时为多个舵机编写关键帧和片段，而不是为每个舵机分地编写。\n\
    \n现在我们已经探索了 Animation API 背后的术语和概念，让我们来构建第一个项目吧；我们将把三个舵机构建成一个可以操纵的舵机数组。\n\n##\
    \ 项目 – 连接三个舵机并创建一个数组\n\n首先，你必须按照下图所示连接你的三个舵机：\n\n![](img/798b2390880773c3e3d0e21417ef58f8_155_0.png)\n\
    \n结合我们对 Johnny-Five 的了解以及上一节中复过的代码，让我们写一段代码，为刚刚连接的舵机创建一个舵机数组，并将其注入 REPL，这样我们就可以实时运行代码。将以下内容放入\
    \ `servo-array.js`：\n\n```javascript\nvar five = require('johnny-five')\n\nvar\
    \ board = new five.Board({\n  port: '/dev/cu.usbbmodem14131'\n})\n\nboard.on('ready',\
    \ function(){\n  var myServos = new five.Servos([3,5,6])\n  this.repl.inject({\n\
    \    servos: myServos\n  })\n});\n```\n\n现在我们用以下命令运行它：\n\n- node servo-array.js\n\
    \n如果是的话，REPL 将启动，你的舵机应该移动到它们的起始位置（默认为 90）。\n\n让我们探索如何成组移动这些舵机。让我们让它们全部扫描（sweep）：\n\
    \n```javascript\nservos.sweep()\n```\n\n### 提示\n\n如果在扫描数组中的所有舵机时，它们看起来很断断续续的，不要担心；我们现在正在使用三个舵机，消耗的电流比平时大。卡顿感是因为电流不足。虽然这对于我们目前的示例没有问题，但如果你想让一个带有多个舵机的项目运行得流畅，一定要查看第\
    \ 6 章《移动你的机器人》中的舵机供电章节。\n\n我们可以通过以下方式停止舵机：\n\n```javascript\nservos.stop()\n```\n\
    \n现在，让我们探索如何使用 `.to()`，不仅看它在每个舵机上如何工作，还要看 `duration` 和 `rate` 如何不能替代动画的编写。\n\n\
    我们可以使用 `.to()` 将所有舵机移动到同一个角度，如下：\n\n```javascript\nservos.to(0)\n```\n\n我们可以使用与单个舵机相同的参数、即\
    \ `duration` 和 `rate`，如下所示：\n\n```javascript\nservos.to(90, 500, 10)\n```\n\n\
    这非常平滑，对吧？就像动画一样？确实如此！但让我们放慢 `.to()` 看看这里实际上发生了什么：\n\n```javascript\nservos.to(0)\n\
    ```\n\n```javascript\nservos.to(180, 10000, 20)\n```\n\n这是在 10 秒内进行 180 度的移动，共有\
    \ 20 个离散步骤。你注意到卡顿感了吗？这是因为这是写入到 `servoWrite()` 的，而不是写入动画片段。\n\n你也可以像我们在上一节中探索的那样一次控制一个舵机。例如，运行以下代码：\n\
    \n```javascript\nservos[0].to(0);\n```\n\n这将把第一个舵机（引脚 3）移动到 0 度。\n\nAPI 中有一些很棒的选项可以让动作更平滑。让我们探索：\n\
    \n## 编写动画\n\n正如我们在上一节讨论过的，动画是在 Johnny-Five 中创建的，然后我们将学习：\n\n## 编写关键帧\n\n关键帧是 API\
    \ 的核心；该 API 的威力在于可以在关键帧之间进行插值。\n\n## 关键帧对象\n\n由于每个关键帧都是一个对象，我们可以访问一些属性：\n\n| 属性\
    \ | 描述 |\n|---|---|\n| degrees | `degrees` 是在到达关键帧时舵机应该处于的角度。它应该是一个 0 到 180 之间的整数。\
    \ |\n| step | `step`  `degrees`，但它是相对于上一个关键帧的；例如，如果关键帧的 `degrees` 设置为 135，而在下一个关键帧中\
    \ `step` 设置为 -45，那么第二个关键帧将移动到 90。 |\n| easing | 当你创建动画片段时，默认按速度进行插值。缓函数应用于这些帧以改变速度。\
    \ |\n\n通过 Johnny-Five 使用 `ease-component` 模块可以使用多种缓函数；其中非常流行的是 `inCirc`，它导致帧开始移动缓慢，中间加速，并在结尾再次减慢。更多示例请参考\
    \ Johnny-Five 和 ease-component 的文档。\n\n| 属性 | 描述 |\n|---|---|\n| copyDegrees |\
    \ `copyDegrees` 根据索引计算计算或显式设置的值。例如，假设我们有两个关键帧：一个 `degrees` 设置为 90，第二个 `step` 设置为\
    \ 45。如果我们创建一个 `copyDegrees` 设置为 0 的关键帧，它将复制第一个帧并设置为 90。如果我们设置索引为1，它将复制第二个帧，90\
    \ + 45 = 135 将是第三个关键帧的设置。 |\n| copyFrame | `copyFrame` 类似于 `copyDegrees`，但它复制帧的所有属性而不仅仅是角度；这包括缓函数等等。\
    \ |\n\n`position` 是 Johnny-Five Animation API 中一个高级且新的概念。它允许你获取三个表示空间中三维坐标的元组，并将整个舵机数组移动到该点。\n\
    \n值得注意的是，实现此功能不仅需要 Johnny-Five；你还需要一个 IK（逆向运动学）求解器，例如 Donovan Buck 的 `sharp` 项目。深入研究\
    \ `position` 的细节超出了本书的范围，但它仍在开发中，功能可能会发生变化。然而，如果你想制作一个随你移动的机器人，可以查看这个项目。\n\n"
