  - '[PAGE 169]


    # Animation events


    A lot of movements require waiting for one segment to finish before starting another.
    Some segments should only be fired at certain times, as well. The best way to
    handle these timings and communication systems is by using Johnny-Five''s `animation`
    events.


    We tap into these events by assigning callbacks to special attributes on segments.
    Let''s go into the details of each one and see when they will fire.


    | Events | Details |

    |---|--|

    | onstart | The onstart callback fires when the segment has begun playing in the
    animation. |

    | onstop | The onstop callback is called only when the segment is either in the
    queue or currently running, but the animation is stopped via `animation.stop()`.
    |

    | onpause | The onpause callback is called only when the segment is queued or
    running in an animation that has been passed via `animation.pause()`. |

    | oncomplete | The oncomplete callback only fires when the segment has completed
    running in an animation. Note: This does NOT apply to looped segments. See the
    `onloop` callback for this. |

    | onloop | The onloop callback is called when a function loops, that is at the
    beginning of the second run-through and each started run-through thereafter. |


    In order to understand how the events work and what they can be used for, let''s
    start on our final project: grab your LCD from Chapter 4, *Using Specialized Output
    Devices*, and your servo array from earlier in the chapter, and let''s build.'
