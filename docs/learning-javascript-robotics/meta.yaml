- img_proc: true
  md: '# Why do we need the I2C and SPI protocols?


    This is all starting to get really complicated, right? Why even bother? We have
    digital pins and analog pins; shouldn''t reading values from these be enough?


    Not when you go outside the realm of LEDs. Think about how much information goes
    into this text you''re reading on a page (or, likely, a screen!) Bytes and bytes
    of information. This is true for many peripherals you''ll use in Johnny-Five applications.


    For instance, the accelerometer we''ll be using—without the I2C protocol, it would
    use three analog pins. That''s the majority of the analog pins on Arduino Uno,
    and many platforms don''t have analog pins at all! Not to mention the LCD we used
    in Chapter 4. Using Specialized Output Devices—without I2C, we have to correctly
    wire 11 different pins, six of which are separate data pins.


    The complexity of data being sent and received is also an issue. There are sensors
    that send back data that doesn''t fit in an analog range of 0-1024. There are
    output devices—such as LCD screens—that need bytes of information. These devices
    need these protocols to effectively communicate and receive the data they need.


    The I2C and SPI protocols allow us to unlock an entirely new dimension of data
    for small projects—we can use many more devices with fewer pins.


    First, we''ll take a look at the SPI protocol—this protocol allows us to send
    a lot of data in a much easier way than previous setups.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# # Exploring SPI (Serial Peripheral Interface) devices


    **Serial Peripheral Interface (SPI)** is a protocol to be used with certain devices
    in Johnny-Five and in general, robotics. It came about as a a response to typical
    serial connections (which you don''t see often in hobbyist robotics anymore),
    which were asynchronous in nature. This led to a lot of overhead, so SPI was developed
    as a way to ensure data was sent and received in a way that was efficient.


    # **Tip**


    Keep in mind that when we talk about synchronous/asynchronous in this context,
    we are *NOT* talking about it as we would in JavaScript. You can still write async
    JavaScript functions around SPI methods!'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# How SPI works


    In typical serial connections, you have a line from which data goes out (TX) and
    a line to which the data comes in (RX), and this makes communication difficult.
    How does the receiver know how fast the sender would be sending bytes, and when
    are they done? This lack of a synchronized time is what we mean when we say asynchronous
    in this context—the sending and receiving devices just send bytes as fast as they
    please, assuming the receiver will know how to read that data.


    Let''s go through some of the features of SPI:


    +   - SPI uses a separate pin to establish a unified time clock, to sync the receiver
    and sender. This data clock is flipped between a HIGH and LOW each time a bit
    is sent—telling the receiver that a new piece of information is being read.


    +   - SPI also splits the communications into MOSI (Master Out Slave In) and MISO
    (Master In Slave Out). I''ll refer to these by their acronyms, but I will use
    microcontrollers and devices for our purposes, in this context they work well.


    +   - The MOSI pin is the line to send data from the microcontroller to the device—output,
    for our purposes. MISO is a line for the device to send data to the microcontroller—great
    for sensors and other input needs. Note that if a device does not have any reason
    to communicate data back to the microcontroller (like our LED matrix), it may
    leave off the MOSI pin and the MISO pin something such as "data".


    +   - Finally, SPI devices use a CS or SS pin (Chip Select or Slave Select), which
    is used in setups where multiple devices are used by one microcontroller. This
    is flipped HIGH and LOW to let the microcontroller tell the device that it is
    sending data. Flip the CS pin of the device you are reading from or writing to,
    and other devices will ignore that data.


    So to recap, you need four pins on average—one for the synchronous clock (often
    labeled SCLK), one for the microcontroller to send data to the device, one for
    the device to send data to the microcontroller, and one for chip selection.


    ![](img/798b2390880773c3e3d0e21417ef58f8_179_0.png)


    SPI explained—Image credit: https://en.wikipedia.org/wiki/Serial_Peripheral_Interface_Bus'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Tip


    Note that in many setups with one SPI device, wiring diagrams will show that the
    CS pin is wired to the 5V. This is fine—you''re just permanently setting the CS
    to HIGH, telling the device to always be listening for or sending data.'
  merge: -1
