  md: "# Coding button-led.js\n\nNow, let's take a look at the Button object in Johnny-Five\
    \ to see what we'll need for our code. First, we want to see whether or not there's\
    \ an event to tap into when the button is pressed. Sure, there is such an event:\
    \ the press event is logged when the button is pressed. Right below, we see the\
    \ release event that is logged when the button is released.\n\nUsing these and\
    \ our previous knowledge of the Led object, we can write the following in button-led.js:\n\
    \n```\nvar five = require('johnny-five');\n\nvar board = new five.Board();\n\n\
    board.on('ready', function() {\n  var button = new five.Button('A0');\n  var led\
    \ = new five.Led(13);\n\n  button.on('press', function() {\n    console.log('button\
    \ pressed!');\n    led.on();\n  });\n\nbutton.on('release', function() {\n   \
    \ console.log('button released!');\n    led.off();\n  });\n});\n```\n\nThis code\
    \ will light the LED when the button is pressed and turn it off again when the\
    \ button is released. Go ahead and run it with the following command:\n\n> > node\
    \ button-led.js\n\nTry this. You should see an output in your console like the\
    \ following:\n\n![](img/798b2390880773c3e3d0e21417ef58f8_106_0.png)\n\nThe output\
    \ from led-button.js\n\nThe LED should be lit when the button is pressed, and\
    \ it should be turned off when the button is released."
  merge: -1
