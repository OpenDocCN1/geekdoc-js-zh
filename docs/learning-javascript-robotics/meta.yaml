  md: "# Creating a project with a servo and a sensor\n\nLet's start with just a servo\
    \ and a REPL, then we can add a sensor section as Use the diagram from the previous\
    \ section to refer to a servo, and use pin 6 for signal.\n\nBefore we write our\
    \ program, let's take a look at some of the options `Servo` object constructor\
    \ gives us. You can set an arbitrary range by passing `[min, max]` to the `range`\
    \ property. This is great for low quality servos that have trouble at very low\
    \ and high values.\n\nThe `type` property is also important. We'll be using a\
    \ standard servo, but you'll need to set this to `continuous` if you're using\
    \ a continuous servo. Since `standard` is the default, we can leave this out for\
    \ now.\n\nThe `offset` property is important for calibration. If your servo is\
    \ set too far in one direction, you can change the offset to sure it can programmatically\
    \ reach every angle it meant to. If you hear clicking at very high or low values,\
    \ try adjusting the `offset`.\n\nYou can invert the direction of the servo with\
    \ the `invert` property or initialize the servo at the center with `center`. Centering\
    \ the servo helps you know whether you need to calibrate it. If you center it\
    \ and the arm isn't centered, try adjusting the `offset` property.\n\nNow that\
    \ we've got a good grasp of the constructor, let's write some code. Create a file\
    \ called `servo-repl.js` and enter the following code:\n\n```\nvar five = require('johnny-five');\n\
    \nvar board = new five.Board();\n\nboard.on('ready', function() {\n\n  var servo\
    \ = new five.Servo({\n    pin: 6\n  });\n\n  this.repl.inject({\n    servo: servo\n\
    \  });\n\n});\n```\n\nThis code simply constructs a standard `servo` object for\
    \ pin 6 and injects it into the REPL.\n\nThen, run it using the following command\
    \ line:\n\n> node servo-repl.js\n\nYour servo should jump to its initialization\
    \ point. Now, let's figure out how to write the code that makes the servo move."
