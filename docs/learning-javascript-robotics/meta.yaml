- img_proc: true
  md: '# # How Johnny-Five does SPI


    Luckily, we don''t have to handle timing and bit-shifting ourselves—Johnny-Five
    gives us a nice to deal with SPI connections. The functions for these are attached
    to the Board object and are usually accessed by the component libraries themselves—you
    won''t be using these much unless you''re implementing your own SPI device!


    This method handles the sending out of data to the device. Also, this is the method
    used for our LED matrix. The method, `Board.shiftOut(dataPin, clockPin, data)`,
    shifts out the bytes in data through the pin `dataPin` using `clockPin` as a clock.


    So considering what we know of SPI, we can determine that Johnny-Five does the
    following for us:


    +   1. Sets the clock, data, and CS pins to OUTPUT mode.

    2. Sends startup instructions specific to our device (in the case of our LED matrix,
    brightness and refresh rate are two examples).

    3. Waits for data to be sent by our program.

    4. Sets the CS pin to LOW to indicate that data is being sent to it.

    5. Writes the data and syncs the clock and data pins for us.

    6. Sets the CS pin back to HIGH to indicate we are done sending data.'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Benefits and drawbacks of SPI


    The benefits of SPI are mainly in the speed and ease-of-use categories; it''s
    way easier to write and read from SPI devices because they agree on timing and
    you don''t need extra bits or patterns to alert devices of the beginning and end
    of data.


    The downside involves the sheer number of pins required; whereas serial connections
    only required two pins, SPI requires four, with only one pin that can be shared
    with multiple SPI devices. Your SPI devices can all share a clock pin, but need
    their own MISO, MOSI, and CS pins. This can proliferate quite quickly.


    Luckily, Johnny-Five has SPI support on quite a few platforms, most notably Arduino
    microcontrollers. Next, we''ll take a look at building a project with an SPI device—our
    LED matrix!'
  merge: -1
  pgno: 182
