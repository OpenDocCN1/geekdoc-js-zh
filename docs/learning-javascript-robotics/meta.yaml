- md: "\n## Writing the script\n\nThe script is a little more complicated than our\
    \ last few scripts; we need to create a Piezo element, which just requires a pin.\
    \ However, a piece of music is more complicated than turning an LED on and off.\
    \ Luckily, the Johnny-Five Piezo API has the play() method, which takes an object.\
    \ This object has attributes such as beats, tempo and song—we'll use these to\
    \ play your tune.\n\nThere are many ways to describe a song for the play() method.\
    \ One way—the way that we'll use here—is a string of notes, as follows:\n\nCDFDA-AAAAAGGGGG--CDDFG-GGGGFFFF--\n\
    \nWhen you use this method, it will assume the middle octave, and the - symbol\
    \ indicates null or off notes—nothing which will play here.\n\nFor beats, we will\
