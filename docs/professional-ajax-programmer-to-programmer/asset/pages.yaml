    # Creating a Site Search Widget


    Search functionality is an integral part of any web site; it enables your viewers
    to find the data they desire and easily. However, conventional search mechanisms
    suffer from the problems as the rest of the Web: they require a page refresh and
    possibly losing data when the search is performed.


    Within the past year, many Ajax solutions have surpassed with one standing above
    the rest: LiveSearch. LiveSearch (http://blog.bitflux.ch/wiki/LiveSearch), developed
    by the people at BitFlux (www.bitflux.ch) is a search-as-you-type solution to
    emulate the Apple Spotlight feature in OS Tiger.


    LiveSearch presents a new take on web sites, but it also has its credits. For
    one, it offers a different approach to achieving the desired results. The average
    user is used to enter his search query and pressing a Search box. LiveSearch,
    on the other hand, uses the onkeypress DOM event and returns the results as you
    type. This method may be more efficient in terms of your results, but it is unexpected
    by the user, which can cause confusion.


    This next widget is an Ajax solution for a site that uses a SQL database as a
    search box, a submit button, and a <div> element that displays the search results
    (see Figure 8-5).


    ![](img/b372374b4ba34adee418bd5ab6e01f7f_258_0.png)


    Figure 8-5


