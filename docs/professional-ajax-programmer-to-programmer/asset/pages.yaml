    # # Testing


    Before deploying any application, it is always a good idea to test the installation.
    For testing purposes, feeds.xml contains only one feed: Yahoo! News.


    Open your browser and navigate to http://localhost/fooreader/xml.aspx?xml=yahoo_stories.


    This tests to make sure that the server-side component is able to retrieve an
    news feed properly. If everything is working correctly, you should see the XML
    feed displayed in your browser (see [Figure 5-7](#


    ![](img/b372374b4ba34adee418bd5ab6e01f7f_152_1.png)


    Figure 5-7


    If some reason you see an ASP.NET error, the error message will tell you what
    you should do. The most common error is an Access Denied error, in which case
    the proper rights should be given to the ASP.NET user account (or NETWORK SERVICE
    for Windows 2003).


    If you do not have access to permissions for the web server, such as when you
    run web space from a provider, you may be able to Access Denied errors by turning
    on impersonation. The impersonation settings are located in the web.config file.'
