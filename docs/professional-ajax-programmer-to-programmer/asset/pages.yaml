    When dealing with an XML document that contains namespaces, these namespaces must\
    \ be declared to use XPath expressions. The MSXML document exposes a method called\
    \ setProperty() which is used to set second-level properties for the object. The\
    \ specific property `SelectionNamespaces` is set with an alias for any default\
    \ or external namespace. Aside from using the setProperty() method, namespace\
    \ declarations are assigned as they are in XML documents.\n\n```\nvar sName=\"\
    xmlns:na='http://site1.com' xmlns:pub='http://site2.com'\nxmlDocument.setProperty(\"\
    SelectionNamespaces\", sName);\n```\n\nThe names na and pub represent the namespaces\
    \ used in the XML document. Notice that the namespace prefix na is defined for\
    \ the default namespace. MSXML will not recognize a default namespace when selecting\
    \ nodes with XPath, the declaration of an alias prefix is necessary. Now that\
    \ the SelectionNamespace property is set, you can select nodes within the document:\n\
    \n```\nvar rRoot = xmlDocument.documentElement;\nvar sXPath = \"book/pub:name\"\
    ;nvar cPublishers = rRoot.selectNodes(sXPath);\n```\n\n```\nif (cPublishers.length\
