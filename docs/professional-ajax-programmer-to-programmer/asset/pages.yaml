  md: "Because this page should be functional without JavaScript, all this code is\
    \ attached at runtime after determining if the browser is capable of using XMLHttpRequest.\
    \ Fortunately, the XMLHttpRequest object in the XMLHttpRequest library has a function,\
    \ isSupported(), which can be used to determine this:\n\n```\nwindow.onload =\
    \ function () {\n  if (zXmlHttp.isSupported()) {\n    //begin Ajax code here\n\
    \  }\n}\n```\n\nInside this code block is where the Predictive Fetch code goes,\
    \ ensuring that browsers without XMLHttpRequest support will not have their usability\
    \ affected by half-functioning code.\n\nThe first step in the process of setting\
    \ up Predictive Fetch for the article is to determine which page the user is currently\
    \ viewing. To do this, you must look at the URL's query string to see if the page\
    \ parameter is specified. If it is, you can extract the page number from there;\
    \ otherwise, you can assume that the page number is 1 (the default):\n\n```\n\
    window.onload = function () {\n  if (zXmlHttp.isSupported()) {\n    if (location.href.indexOf(\"\
    page=\") > -1) {\n      var queryString = location.search.substring(1);\n    \
    \  iCurPage = parseInt(queryString.substring(queryString.indexOf(\"=\")+1));\n\
    \    } else {\n      iCurPage = 1;\n    }\n    nextPageToLoad = iCurPage+1;\n\
    \  }\n} // code here\n```\n\nIn this code, the page's URL (accessible through\
    \ location.href) is tested to see if page has been specified. If so, the query\
    \ string is retrieved using location.search (which returns only the query string,\
    \ including the question mark, the call to substring(1) strips out). The next\
    \ line retrieves just the page string after the equals sign (which should be the\
    \ page number), converts it to an integer using parseInt(), and stores the result\
    \ in iCurPage. If, on the other hand, the page parameter is not specified in the\
