    \ names are unique (which they have to be), so this is the identifier of the link:\n\
    \n```\nthis.getLinkFileName = function (sFileName) {\n  for (var i = 0; i < this.sections.length;\
    \ i++) {\n    var section = this.sections[i];\n    for (var j = 0; j < section.links.length;\
    \ j++) {\n      var link = section.links[j];\n      if (sFileName.toLowerCase()\
    \ == link.toLowerCase()) {\n        return link;\n      }\n    }\n  }\n  alert(\"\
    Cannot find the specified feed information.\");\n  return this.sections[0].link[0];\n\
    }\n```\n\nWhen a match cannot be found, an error message is displayed via the\
    \ alert() method, and the first <link> element in the feeds is returned.\n\n#\
    \ Drawing User Interface Elements\n\nThe code within footer.js is responsible\
    \ for generating the dynamic elements required to display the data to the user.\
    \ The feeds list in the feeds pane and the items in the item pane are all dynamically\
    \ generated according to the data they receive. This dynamic content is generated\
    \ by both DOM methods and innerHTML. Elements created by the DOM are created at\
    \ the page load and when a new feed is loaded.\n\nThe contents of the message\
    \ are displayed using innerHTML. This is necessary because many feeds include\
    \ CDATA sections, which contain HTML formatting; DOM methods to display the text\
