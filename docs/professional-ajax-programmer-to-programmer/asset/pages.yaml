  md: "client, the reader continues to read and barely notices that the next page\
    \ comes up almost instantaneously after clicking the Next page link.\n\nAnother\
    \ simple use case happens during the writing of an e-mail. Most of the time, you'll\
    \ be writing an e-mail to someone you know, so it's logical to assume that the\
    \ person is already in your address book. To help out, it may be to preload your\
    \ address book in the background and offer suggestions. This approach is taken\
    \ by many web-based e-mail systems, including Gmail and AOL Mail. The key, once\
    \ again, is the \"logical-to-assume\" criterion. By anticipating and pre-loading\
    \ information related to the user's most likely next steps, you related to any\
    \ possible next step, you can quickly overload your server and make the browser\
    \ bog down with extra processing. As a rule of thumb, only pre-fetch information\
    \ when you believe it is logical to assume that completing the user's next request.\n\
    \n# # Page Loading Example\n\nAs mentioned previously, one of the simplest and\
    \ most logical uses of the Predictive Fetch pattern is the preloading of pages\
    \ in an online article. With the advent of blogs, or blogs for short, everyone\
    \ has been hit by the publishing bug, writing articles on their web sites. Reading\
    \ long articles online is very difficult on the eyes, so many sites split into\
    \ multiple pages. This is better for reading, but takes longer to load because\
    \ each page begins with all of the text above that were on the original page.\
    \ Predictive Fetch eases the load on both the client and server by loading only\
    \ the text for the next page while the reader is still reading the first page.\n\
