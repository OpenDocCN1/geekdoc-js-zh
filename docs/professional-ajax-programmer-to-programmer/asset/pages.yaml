  md: '```

    ''From'' text NULL,

    Subject bigint(20) default NULL,

    Date bigintint default NULL,

    Message text NULL,

    HasAttachments tinyint(1) NOT NULL default ''0'',

    Unread tinyint(1) NOT NULL default ''1'',

    FolderId int(11) NOT NULL default ''0'',

    PRIMARY KEY (MessageId);


    ```


    The MessageId is an autoincrement field and the e-mail with a unique ID number
    in the database: it is also the primary key. The To, CC, From, Subject, Date,
    and Message fields are parts of an e-mail message.(To and From must be enclosed
    in switched tables because they are in SQL) The HasAttachments and Unread fields
    are tinyint, which means they can have values of 0 or 1 (false or true). Finally,
    the FolderId field contains the ID of the folder in which the message is stored.
    This allows you to select messages that exist only in the Inbox or Trash folders.


    If an e-mail contains any attachments, they are stored in the AjaxMailAttachments
    table:


    ```

    CREATE TABLE AjaxMailAttachments (

    AttachmentId int(11) NOT NULL auto_increment,

    MessageId int(11) NOT NULL default ''0'',

    Filename text NULL,

    ContentType text NULL,

    Size int(11) NOT NULL default ''0'',

    Data longtext NOT NULL,

    PRIMARY KEY (AttachmentId)

    );

    ```


    Like the AjaxMailMessages table, the AjaxMailAttachments table contains an autoincrement
    field. This field called AttachmentId provides each attachment with a unique ID
    number. The next field, MessageId, houses the message ID of the e-mail to which
    it is attached (which matches the MessageId in AjaxMailMessages). Next, the Filename
    and ContentType columns store the attachment''s file name and content-type(both
    are necessary to enable the user to download the attachment later). Last, the
    Size and Data fields store the attachment''s size (in bytes) and the binary/text
    data of the file, respectively.


    # The Configuration File


    Much like any application, AjaxMail relies on a configuration file, called config.inc.php,
    to provide information required to configure it. As information is required in
    different areas of the application, it''s best to store it as constants. In PHP,
    constants give you the advantage of being available in every scope of the application,
    which means that you don''t need to define them using the global variables.


    To create a constant in PHP, use the define() method, passing in the name of the
    constant (as a string) and its value. For example:


    ```

    define("MY_CONSTANT", "my value");

    ```


    The first group of constants relates directly to your MySQL database:'
