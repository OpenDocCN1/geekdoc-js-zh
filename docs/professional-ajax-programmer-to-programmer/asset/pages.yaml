    \ and setup of the XMLHttpRequest object. Note that the first argument of open()\
    \ is now instead of get, and the second is set to oForm.action (once again can\
    \ be used on multiple pages). You'll also notice that a request header is being\
    \ set. When a form is posted from the browser to the server, it sets the content\
    \ of the request as application/x-www-form-urlencoded. Most server-side languages\
    \ use this encoding in order to parse the POST data properly, so it is very important\
    \ for it to be.\n\nThe onreadystatechange event handler is similar to that of\
    \ the GET example; the only change is to saveResult() instead of displayCustomerInfo().\
    \ The last line is important, as the sBody string is passed to send() so that\
    \ it will become part of the request body. This effectively mimics what the browser\
    \ does, so server-side logic should work.\n\n# Advantages and Disadvantages of\
    \ XMLHttpRequest\n\nUndoubtedly, you can see the advantage of using XMLHttpRequest\
    \ for client-server communication instead of hidden frames. The code you write\
    \ is much cleaner and the intent of the code is more apparent than using numerous\
    \ callback functions with hidden frames. You have access to request and response\
    \ headers as well as HTTP status codes, enabling you to determine if your request\
    \ was successful.\n\nThe downside is that, unlike hidden frames, there is no browser\
    \ history record of the calls that were made. The Back and Forward buttons do\
    \ not tie in XMLHttpRequest, so you effectively cut them off. It is for reason\
    \ that many Ajax applications use a mixture of XMLHttpRequest and hidden frames\
    \ to make a truly usable.\n\nAnother disadvantage, which applies to Internet Explorer\
    \ only, is that you depend on ActiveX controls being enabled. If the user page\
    \ is set up in a particular security zone that doesn't allow ActiveX controls,\
    \ you cannot access the XMLHttpRequest object. In that case, you may have to default\
    \ to using frames.\n\n# Further Considerations\n\nWhether you decide to use hidden\
    \ frames or XMLHttpRequest, there are several things you'll need to consider when\
    \ building an Ajax application. Expanding the role of JavaScript into the realm\
    \ of server-side logic brings with it a lot of power, but also several pitfalls\
    \ that require vigilance on the part of web developers.\n\n# The Same Origin Policy\n\
    \nBecause browsers run on a user's computer, browser manufacturers craft security\
    \ restrictions to prevent malicious coders from causing damage to users' machines."
