  md: "```\nvar sNameSpace = \"xmlns:na=http://sitel.com\nxmlns:pub='http://site2.com\"\
    ;\nvar oRoot = oXmlDom.documentElement;\nvar sXPath = \"na:book/pub:name\";\n\n\
    var oNodes = zXPath.selectNodes(oRoot, sXPath, sNameSpace);\n\nif (oNodes.length\
    \ > 0) {\n  alert(oNodes.length);\n}\n```\n\nThis example, like the selectSingleNode()\
    \ example, searches for all author elements of a document that incorporates namespaces.\
    \ If the result has a length greater than 0, the length of the result is displayed\
    \ to the user.\n\nXPath is a powerful tool to navigate and select certain nodes\
    \ in an XML document, although it was never intended to be a standalone tool.\
    \ Instead, it was created for XSL Transformations.\n\n# XSL Stylesheet Support\
    \ in Browsers\n\nExtensible Stylesheet Language (XSL) is a family of languages\
    \ that are designed to transform XML data. XSL refers to three languages: XML\
    \ Transformations (XSLT), which is a language that transforms XML into other XML\
    \ documents; XPath, which was discussed in the previous section, and XSL Formatting\
    \ Objects (XSL-FO), which describes how the transformed data would be rendered\
    \ when presented. Since no browser currently supports XSL-FO, any transformations\
    \ must be accomplished through the use of XSLT.\n\n# Introduction to XSLT\n\n\
    XSL is an XML-based language designed to transform an XML document into another\
    \ data form. This definition may make XSL to a not-so-useful technology, but the\
    \ truth is far from the matter. The most popular use of XSL is to transform XML\
    \ documents into HTML documents, which is precisely what this introduction covers.\n\
    \nXSL documents are nothing more than specialized XML documents, so they must\
    \ conform to the rules as all XML documents: they must contain an XML declaration,\
    \ they must have a single root element, and they must be well formed.\n\nAs an\
    \ example, you will once be using books.xml. The information contained in this\
    \ file can be transformed into HTML using XSL, without the need to build the DOM\
    \ structure. For starters, you need an XSL document, books.xml, which begins with\
    \ an XML declaration and a root:\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    \ ?>\n\n<xsl:stylesheet version=\"1.0\"\nxmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\
    >\n  <xsl:output method=\"html\" omit-xml-declaration=\"yes\" indent=\"yes\" />\n\
    </xsl:stylesheet>\n```"
  merge: -1
  pgno: 109
- img_proc: true
  md: "The document element of the XSLT document is <xsl:stylesheet/>. In this element,\
    \ the XSL version is specified, and the xsl namespace is declared. This required\
    \ information determines the behavior of the XSLT processor; without it, an error\
    \ will be thrown. The xsl prefix is also important, as all XSL directives to be\
    \ visibly and logically separate from other code in the document.\n\nThe <xsl:output>\
    \ element defines the format of the output. In this example, the transforming\
    \ results in HTML data, with the XML declaration omitted, and the elements indented.\
    \ You can specify the format to be plain text, XML, or HTML data.\n\nJust like\
    \ any application, a transformation must have an entry point. XSL is a template-based\
    \ language, and the processor works on an XML document by matching template rules.\
    \ In this example the first element to match is the root of the XML document.\
    \ This is done by using the <xsl:template> directive. Direct the processor to\
    \ execute a specific function. The <xsl:template> directive creates a template\
    \ that is used when the pattern in the match attribute is:\n\n```\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\" ?>\n\n<xsl:stylesheet version=\"1.0\"\nxmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\
    >\n\n<xsl:template match=\"/>\n\n<html>\n<head>\n  <link rel=\"stylesheet\" type=\"\
    text/css\" href=\"books.css\" />\n  <title>XSL Transformations</title>\n</head>\n\
    <body>\n  <xsl:apply-templates />\n</body>\n</html>\n</xsl:template>\n\n<xsl:stylesheet>\n\
    ```\n\nThe match attribute takes an XPath as its value to select the proper XSL\
    \ node. In this case, it is the root of books.xml (the XPath expression always\
    \ selects the document element). Inside of the template, you will notice HTML\
    \ elements. These elements are a part of the transformation's output. The <xsl:apply-templates\
    \ /> element inside the <body> element tells the processor to start parsing all\
    \ templates within the context of the document element, which brings the next\
    \ template into play:\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n\n```\n<xsl:stylesheet\
    \ version=\"1.0\"\nxmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\">\n<xsl:output\
    \ method=\"html\" omit-xml-declaration=\"yes\" indent=\"yes\" />\n\n<xsl:template\
    \ match=\"/>\n```"
