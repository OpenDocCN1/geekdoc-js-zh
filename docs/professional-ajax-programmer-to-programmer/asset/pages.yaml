  md: '# Cross-Domain Web Services


    So far in this chapter you''ve been calling a service that resides on the same
    domain as the page accessing it. By doing this, you have avoided the problem of
    cross-domain scripting (also as cross-site scripting, or XSS). As discussed earlier
    in this book, this problem is caused by the fact that there are security risks
    in allowing calls to external services. If the web service is on the same domain
    as the page caller, the browser will permit the SOAP request, but what if you
    want to use one of the Google or Amazon.com services?


    For this you''ll need to use a server-side proxy which runs on your server and
    makes calls on behalf of the client. The proxy returns the information it receives
    back to the client. The setup resets of a web proxy that is compatible in corporate
    networks. In that model, all requests are passed to a central server that retrieves
    the web page and passes it to the requester.


    # The Google Web APIs Service


    Google provides a number of methods that can be called through its web service,
    including methods for retrieving cached copies of pages as the more obvious results
    for a given search process. The method you will need to use is a server-side proxy
    or doSpellingSuggestion, which takes a phrase and returns what Google believes
    you meant to type. If your phrase is not possible or it is so obscure that Google
    cannot have a suggestion, an empty string is returned.


    > Important: The developers'' kit for the Google Web APIs service can be found
    at http://www.google.com/apis/index.html. The kit contains the SOAP and WSDL standards,
    as well as examples in C#, Visual Basic, .NET.


    You will need to register Google with a security key to allow you to access the
    service. There are also rules about how it can be used commercially and for development
    purposes.


    # Setting Up the Proxy


    After you have downloaded the Google documentation and received your key, you
    need to set up a service on your server that will accept the calls from your users
    and pass them to Google. The basic service is built in the way as the Math service
    discussed earlier.


    Open the IIS manager (Start=Administrative Tools=Internet Services). Expand the
    tree to the Default Web Site node, and right-click and choose New=Virtual Directory.
    In the Alias of the Virtual Directory Creation wizard, make your new directory
    GoogleProxy, and then click. On the next screen, browse to the IIS directory of
