  md: '# What This Book Covers


    Professional Ajax provides a developer-level tutorial of Ajax techniques, patterns,
    and use cases.


    The book begins by exploring the roots of Ajax, covering how the evolution of
    the Web and new technologies led to the development of Ajax techniques. A detailed
    discussion of frames, JavaScript, code, XML, and XMLHttp related to Ajax is included.


    In this introduction, the book moves on to cover the implementation of specific
    Ajax techniques. Request brokers such as hidden frames, dynamic frames, and XML-Http
    are compared and contrasted, explaining when one method should be used over another.
    To make this discussion clear, a brief overview of HTTP requests and responses
    is included.


    Once a basic understanding of the various request types is discussed, the book
    moves on to provide examples of how and when to use Ajax in a web site or web
    application. Different data formats—including plain text, XML, JSON—are discussed
    for their advantages and disadvantages. Also included is a discussion on web services
    and how they may be used to perform Ajax techniques.


    The last part of the book walks you through the creation of a full-fledged Ajax
    application called AjaxMail, which incorporates many of the techniques discussed
    throughout the book, and introduces you to use Ajax libraries to make Ajax communication
    easier for developers.


    # How This Book is Structured


    This begins by providing background about the origins of Ajax before moving into
    actual implementation. Next, the various ways to accomplish client-server communication
    are discussed, setting the stage for the rest of the book. It is recommended that
    you read the book straight through, each chapter builds on information from the
    previous chapters.


    The chapter-level breakdown is as follows:


    +   * **Chapter 1: "What is Ajax?"** This chapter explains the origins of Ajax
    and the technologies involved. It explores how Ajax developed as the Web developed
    and who, if any, can claim ownership of the techniques.

    * **Chapter 2: "Basics."** This chapter introduces the various ways to accomplish
    Ajax communication, including the hidden frame and XMLHttp. The advantages and
    disadvantages of each approach are discussed, as well as guidelines on when each
    should be used.

    * **Chapter 3: "Patterns."** This chapter focuses on design patterns using Ajax.
    There are a variety of ways to incorporate Ajax into web sites and applications;
    these have been organized into a hierarchy of design patterns that describe best
    practices for Ajax

    Chapter 4: "XML, XPath, and XSLT."** This chapter introduces XML, XPath, and XSLT
    as complementary technologies to Ajax. The discussion centers on using XML as
    a data format and using XPath and XSLT to access and display information.

    **Chapter 5: "Synchronization with RSS."** This chapter deals with using Ajax
    together with syndication formats RSS and Atom for a web-based news aggregator.

    * **Chapter 6: "Web Services."** This chapter brings web services into the Ajax
    picture. Examples of how to call web services from the client are explained, and
    how to create server-side proxies to work around browser security restrictions.

    * **Chapter 7: "JSON."** This chapter introduces JavaScript Object Notation (JSON)
    as an alternate data format for Ajax communication. Advantages and disadvantages
    of using JSON and plain text are discussed.

    * **Chapter 8: "Web Site Widgets."** This chapter brings the techniques from the
    previous chapters into focus by creating Ajax widgets that can be included in
    your web site.

    * **Chapter 9: "AjaxMail."** This chapter walks you through the development of
    a complete web application, AjaxMail. This application is an Ajax-based e-mail
    system that uses many of the techniques described earlier in the book.'
  merge: -1
  pgno: 4
- img_proc: true
  md: '+   * Chapter 10: "Ajax Frameworks." This chapter covers Ajax frameworks: JPSPAN
    for PHP, DWR for Java and JSP, and Ajax.NET for the .NET framework. Each of these
    frameworks attempts automate part of the Ajax development process.


