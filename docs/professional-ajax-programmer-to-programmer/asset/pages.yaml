  md: "```\nxmlns=\"http://www.wrox.com/services/authors-books\"\nxlink:href=\"http://www.wrox.com/services/authors/\"\
    \n<author forenames=\"Michael\" surname=\"Kay\"\nxlink:href=\"http://www.wrox.com/services/authors/kaym\"\
    \nid=\"kaym\"/>\n<author forenames=\"Joe\" surname=\"Fawcett\"\nxlink:href=\"\
    http://www.wrox.com/services/authors/fawcettj\"\nid=\"fawcettj\"/>\n<author forenames=\"\
    Jeremy\" surname=\"McPeak\"\nxlink:href=\"http://www.wrox.com/services/authors/mcpekaj\"\
    \nid=\"mcpeakj\"/>\n<author forenames=\"Nicholas\" surname=\"Zakas\"\nxlink:href=\"\
    http://www.wrox.com/services/authors/zakas\"\nid=\"zakas\"/>\n<!--\n  More authors\n\
    -->\n</author>\n```\n\nThere are a couple of things to note about this XML. First,\
    \ a default namespace of http://www.wrox.com/services/authors-books is declared\
    \ so that any un-prefixed elements, such as `<authors\\>`, are assumed to belong\
    \ to this namespace. This means that the `<authors\\>` element can be differentiated\
    \ from another element with a similar name but from a different namespace. The\
    \ namespace URI, http://www.wrox.com/services/authors-books, is used simply as\
    \ a unique string; there is no guarantee that an actual resource is available\
    \ at that location. The key is that it is a Uniform Resource Identifier (URI),\
    \ which is simply an identifier, not a Uniform Resource Locator (URL), which would\
    \ point to a specific location.\n\nSecond, the use of the href attribute from\
    \ the http://www.w3.org/1999/xlink namespace. Although not essential, REST-style\
    \ services have now standardized on this notation for what HTML was a standard\
    \ hyperlink.\n\nXlink is a way of linking documents that goes way beyond the straightforward\
    \ hyperlinks of HTML. It provides capabilities to specify a two-way dependency\
    \ so that documents can be activated from each other as well indicating how a\
    \ link is activated—for example, by clicking, automatically, or after a preset.\
    \ Its cousin XPointer is concerned with specifying sections within a document\
    \ and arose from the need for a more powerful notation than the simple named links\
    \ within HTML pages.\n\nAlthough they have both reached recommendation status\
    \ at the W3C, they are still not widely used. For more information, visit www.w3.org/XML/linking.\n\
    \nIf used in a web site or application, the XML returned from the REST service\
    \ would be transformed, either client-side or server-side, to a more user-friendly\
    \ format (most likely HTML) something like\n\n```\n<html>\n<head>\n  <title>Wrox\
    \ Authors</title>\n</head>\n```"
