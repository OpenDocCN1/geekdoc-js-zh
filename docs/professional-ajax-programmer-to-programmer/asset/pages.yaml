  md: '# XSLT in Firefox


    Like XML and XPath, the Firefox implementation of XSLT transformations varies
    from the IE implementation. Firefox does implement an XSLProcessor class to perform
    transformations, but the similarities end there.


    The first step in performing a transformation in Firefox is to load the XML and
    XSL documents into a DOM object:


    ```

    var oXmlDom = zXmlDom.createDocument();

    var oXsDom = zXmlDom.createDocument();

    ```


    ```

    oXmlDom.async = false;

    oXsDom.async = false;

    ```


    ```

    oXmlDom.load("books.xml");

    oXsDom.load("books.xml");

    ```


    The XSLTProcessor exposes the importStylesheet() method, which takes an XML DOM
    object containing the XSLT document as an argument:


    ```

    var oXsltProcessor = new XSLTProcessor();

    oXsltProcessor.importStylesheet(oXsDom);

    ```


    Last, the transformation methods are called. There are two of these methods:

    transformToDocument() and transformToFragment().

    transformToDocument() method takes an XML DOM object as an argument and returns
    a new DOM object containing the transformation. This is the method you want to
    use:


    ```

    var oNewDom = oXsltProcessor.transformToDocument(oXmlDom);

    ```


    The resulting DOM object can be used like any other XML DOM object. You can select
    nodes with XPath, traverse the node structure with properties, and even use it
    in another transformation.


    The transformToFragment() method returns a document fragment, as its name suggests,
    to append to another DOM object. This method takes two arguments: the first is
    the XML object you want to transform, and the second is the DOM object you intend
    to append the result to:


    ```

    var oFragment = oXsltProcessor.transformToFragment(oXmlDom, document);

    document.body.appendChild(oFragment);

    ```


    In this example, the resulting DOM fragment is appended to the body of the document
    object. Note that you can append the fragment to any node within the DOM object
    passed to the transformToFragment() method.


    But if you wanted a string returned as the result of transformation like the transformNode()
    method implemented by Microsoft? You could use the XMLSerializer class learned
    of earlier. Just pass the transformation to the serializeToString() method:


    ```

    var oSerializer = new XMLSerializer();

    var str = oSerializer.serializeToString(oNewDom);

    ```


    If using the xml library, this is simplified by using the xml property:


    ```

    var str = oFragment.xml;

    ```'
