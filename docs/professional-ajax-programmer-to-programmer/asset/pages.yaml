  md: "```\n'array'=>array(\n  'class'=>JSpan_SerializedArray,\n  'file'=>NULL\n),\n\
    \n'object'=>array(\n  'class'=>JSpan_SerializedObject,\n  'file'=>NULL\n),\n'jspan_error'=>array(\n\
    \  'class'=>JSpan_SerializedError,\n  'file'=>NULL\n)\n);\n```\n\nEach type uses\
    \ a specific class to translate it into a function that returns the given data.\
    \ The code for each class can reside in the page itself or exist in a separate\
    \ file. With the default JSpan set up all the classes are defined in the page\
    \ $file property is set to null.\n\nEach serializer has a method named `generate`\
    \ that produces the JavaScript representation. For example, if a Boolean value\
    \ `true` was serialized to the client, the representation would be similar to\
    \ the following:\n\n```\nvar data_serialized = 'new Function('var t1 = true; return\
    \ t1;');\nvar data_func = eval(data_serialized);\nvar data_func = data_func();\n\
    ```\n\nUnserializer.php and Types.php are for conversion between JavaScript and\
    \ PHP.\n\nTypes.php contains definitions for two base types: JSpan_Object and\
    \ JSpan_Error. (All JavaScript objects are converted into instances of one of\
    \ these Although JSpan_Error has the properties `code`, `name`, and `message`\
    \ discussed in the section on errors, JSpan_Object is an empty class that serves\
    \ as a base for more specific implementations.\n\nUnserializer.php uses one of\
    \ other classes for deserialization, both of which are found in the unserializer\
    \ folder: JSpan_Unserializer_XML in XML.php or JSpan_Unserializer_PHP in PHP.php.\
    \ Unless the PHP version is requested specifically, the XML version is used.\n\
    \nIn the JSpan representation, each element is represented by an element in an\
    \ XML document; for example, the Boolean value is a `<b>` element with an attribute\
    \ name `v`\n\n```\n<b>v=\"1\"/>\n```\n\nA value of false would be shown as v=0.\n\
    \nThe complete document representing the call to `getFromEmail()`, which accepts\
