    # XPath Support in Browsers


    As XML grew in popularity, the need to access specific pieces of data directly
    became apparent. In 1999, XML Path Language (XPath) was introduced in the Extensible
    Stylesheet Language (XSL) specification as a means to find any node within an
    XML document. XPath uses a non-XML syntax that closely resembles the path syntax
    of a file system. The language consists of location paths and expressions, as
    well as a few helpful functions to aid in retrieving specific data.'
