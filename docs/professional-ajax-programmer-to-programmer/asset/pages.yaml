  md: "The return value is a hashtable, which stores data items that can be accessed\
    \ through a unique key in a similar way to the hashmap in the DWR. A key named\
    \ success is assigned a value of false, which is modified to true if the call\
    \ to the database is successful.\n\nThe next step is to create a connection to\
    \ the Sales database. As mentioned earlier, the connection details for the database\
    \ would be stored in a configuration file:\n\n```\nstring sConnString = \"Provider=OLEDB;\
    \ Data Source='localhost'; \" \n    + \"Initial Catalog=sales; User Id='Test\"\
    ;\nOleDbConnection conn = new OleDbConnection(sConnString);\\nconn.Open();\n```\n\
    \nIf you want to improve performance over SQL Server but are prepared to forgo\
    \ the advantage of changing databases by altering your connection string, you\
    \ can use the Server-specific SqlConnection instead of OleDbConnection.\n\nThe\
    \ SQL statement is then built up, using a StringBuilder, taking care to replace\
    \ any quotes that might be in the email string:\n\nIn the .NET Framework, a String\
    \ object is immutable; it cannot be changed and any alterations, such as appending\
    \ characters, are handled by creating a new string. The older version still remains\
    \ in memory but is inaccessible. This is obviously wasteful from a memory point\
    \ of view. To overcome this problem a separate class named StringBuilder is used.\
    \ This can be changed without replication, and when all changes are complete it\
    \ can be converted to a fully fetched String by calling its ToString().\n\n```\n\
    StringBuilder SQL = new StringBuilder(\"SELECT * FROM Customer WHERE Email = \"\
    \");\\nstring safeEmail = Email.Replace(\"'\", \"''\");\\nSQL.append(safeEmail\
    \ + \"');\");\n```\n\nAn OleDbCommand object is used to execute the SQL and the\
    \ results are returned in the form of an OleDataDataReader.\n\nOleDataDataReader\
    \ is an ADO.NET class that is used to provide read-only access to a results of\
    \ a Select query. It can traverse the results in a forward direction and provides\
    \ methods to retrieve the values from any field using the field name or position.\n\
    \n```\nOleDbCommand cmd = new OleDbCommand(SQL.ToString(), conn);\\nOleDataDataReader\
    \ dr = cmd.ExecuteReader();\n```\n\nAs you can see, the code is extremely similar\
    \ to its Java equivalent.\n\nThe rows are accessed one-by-one by calling the read()\
    \ method, the return value of dr.Read() will be true only if the rows exist. In\
    \ this case, the hashtable is populated, and the success key set to true; otherwise\
    \ it will be set to false and the details are left empty.\n\n```\nBoolean found\
    \ = dr.Read();\\nif (found) {\\n    address[\"success\"] = true;\\n    address[\"\
    forenames\"] = (dr.IsDBNull(1) ? \"\" : dr.GetString(1));\\n}\n```"
