  md: '# Chapter 1: What Is Ajax?


    # Overview


    From 2001 to 2005, the World Wide Web went through a tremendous growth spurt in
    terms of the technologies and methodologies being used to bring this once-static
    medium to life. Online brochures and catalogs no longer dominated the Web as web
    applications began to emerge as a significant portion of online destinations.
    Web applications developed from their site ancestors that they provided an instant
    service to users. For business process management or personal interests, developers
    were forced to create new interaction paradigms as users came to create richer
    functionality.


    Spurned by little-known and lesser-used technologies that had been included in
    web browsers for some time, the Web took a step forward, shattering the traditional
    usage model that required a full page load every time new data or a new part of
    the application''s logic was accessed. Companies began to experiment with dynamic
    reloading of portions of web pages, transferring only a small amount of data to
    the client, resulting in a faster, and arguably better, user experience.


    At the forefront of this was Google. After experiments conducted by Google engineers
    pushing through a special part of the site called Google Labs, Many of the projects
    at Google Labs, such as Google and Google Maps, only involved a single page that
    was never unloaded but was constantly updated nevertheless. These innovations,
    which began to bring the advantages of desktop software into the common browser,
    were praised around the Web as ushering in a new age of web development. And they
    indeed did.


    Numerous open and commercial products began development to take advantage of this
    new web application model. These projects explained their technology using a variety
    of terms such as JavaScript routing, web remote procedure calls, and dynamic updating.
    Soon, a new term emerged.


    # Ajax is Born


    In February 2005, Jesse James Garrett of Adaptive Path, LLC published an online
    article titled, "Ajax: A New Approach to Web Applications" (still available at
    www.adaptivepath.com/publications/essays/archives/000385.php). In this essay,
    Garrett explained how well web applications were closing the gap between the Web
    and traditional desktop applications. He cited new and several of the Google projects
    as examples of how traditionally desktop-based user interaction models were now
    being brought on the Web. The movement grew into a firestorm of interest, excitement,
    and controversy:


    +   Google and Google Maps are two examples of a new approach to asynchronous
    JavaScript that we at Adaptive Path have calling Ajax. The name is shorthand for
    Asynchronous JavaScript - XML, and it represents a fundamental shift in what is
    possible on the Web.


    From that point forward, a tide of Ajax articles, code snippets, and debates began
    popping up over the Web. Developers blogged about it, technology magazines about
    it, and began hitting their products to it. But to understand what Ajax is, you
    must first understand the evolution of every web technologies led to its development.


    # The Evolution of the Web


    When Tim Berners-Lee crafted the first proposal for the "web" of the World Wide
    Web in 1990, the idea was fairly simple: to create a "web" of interconnected information
    using hypertext and Uniform Resource Identifiers (URIs). The ability to link disparate
    resources from all around the world held potential for scholarly endeavors, where
    people would be able to access'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'amount almost instantly. Indeed, the first HyperText Markup Language (HTML)
    featured more than formatting and linking commands, a platform not for building
    rich interactive software rather for sharing the kinds of textual and illustrative
    information that dominated the late age of print. It was from these static pages
    that the Web grew.


    As the Web evolved, businesses saw potential in the ability to distribute information
    about products and services to the masses. The next generation of Web saw an increased
    ability to format and display information as HTML also evolved to meet the needs
    and match the expectations of these new media-savvy users. But a small company
    called Netscape was ready to push usage of the Web at a much faster pace.


    # JavaScript


    Netscape Navigator was the first mainstream web browser, and, as much, moved web
    technologies along quickly. However, Netscape often ridiculed by standards organizations
    for implementing new technologies and extensions to extending technologies before
    the standards were in (place Microsoft is being chastised for ignoring existing
    standards in its development). JavaScript


    Originally Mocha, JavaScript was created by Brendan Eich of Netscape and included
    in version 2.0 (released in 1995). For the first time, developers were able to
    affect how a web page could interact with the user. Instead of making constant
    trips to the server and back for simple tasks such as data validation, it became
    possible to transfer this small bit of processing to the browser. This ability
    was very important at a time when most Internet users were connected through a
    28.8 Kbps modem, turning every request to the server into a waiting frame. Minimizing
    the number of times the user had to wait for a response was the first major toward
    the Ajax approach.


    # Frames


    The original version of HTML intended for every document to be standalone, and
    it wasn''t until HTML 4.0 that frames were officially introduced. The idea that
    the display of a web page could be split into several documents was a radical
    one, and controversial embraced as Netscape Navigator 2.0 was the first browser
    to support frames and JavaScript together. This turned out to be a major step
    in the evolution of Ajax.


    When the wars of the late 1990s began between Microsoft and Netscape, both JavaScript
    and frames became formalized. As more features were added to both, creative developers
    began experimenting with the two together. Because a frame represented a completely
    separate request to the server, the ability to control a frame and its contents
    with JavaScript opened the door to some exciting possibilities.


    # The Hidden Frame Technique


    As developers began to understand how to manipulate frames, a new technique emerged
    to facilitate client-server communication. The hidden frame technique involved
    setting up a frames where one frame was set to a width or height of 0 pixels,
    and its sole purpose was to initiate communication with the server. The hidden
    frame would contain an HTML form with specific fields that could be dynamically
    filled out by JavaScript and submitted back to the server. When the frame returned,
    it would call another JavaScript function to notify the original that data had
    been returned. The hidden frame technique represented the first asynchronous request/response
    model for web applications.


    While this was the first Ajax communication model, another technological advancement
    was just around the corner.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# Dynamic HTML and the DOM


    Up to about 1996, the Web was still a static world. Although JavaScript the hidden
    frame technique livened up the user interaction, there was still no way to change
    the display of a page without reloading it. Then Internet Explorer 4.0.


    At this point, Internet Explorer had caught up with the technology of market leader
    Netscape Navigator and even-upped it in one important respect through the introduction
    of Dynamic HTML (HTML). Although still in the development phase, HTML represented
    a significant step forward from the days of static web pages, enabling developers
    to alter any part of a loaded page using JavaScript. Along with the emergence
    of cascading stylesheets (CSS), HTML reinvented web development as dynamic discipline,
    opening the paths Microsoft and Netscape followed during the early years of each.
    Excellence in the developer community was justified, although because becoming
    HTML with the hidden frame technique meant that any part of a page could be refreshed
    with server information at any time. This was a paradigm shift for the web.


    HTML never needed to a standards body, although Microsoft''s influence would felt
    strong with the introduction of the Document Object Model (DOM) as the centerpiece
    of the standards. Unlike HTML, which sought only to modify sections of a web page,
    the DOM had a more ambitious purpose: to provide a structure for another web page.
    The manipulation of such structure would then allow HTML-like modifications to
    the page. This was the step forward for Ajax.


    # Iframes


    Although the hidden frame technique became incredibly popular, it had a downside
    — one had to plan ahead of time and reuse a frameset anticipating the usage of
    hidden frames. When the <iframe> element was introduced as an official HTML 4.0
    in 1997, it introduced another significant step in the evolution of the Web.


    Instead of defining framets, developers could place iframes anywhere on a page.
    This enabled developers to forget framets, altogether and simply place iframes
    (through the use of CSS) on a page to enable client-server communication. And
    when the DOM was fully implemented in Internet Explorer 5 and Netscape 6, it introduced
    the ability to dynamically create iframes on the fly, meaning that a JavaScript
    function could be used to create an iframe, make a request, and get the response
    — all without including any additional HTML in a page. This led to the next generation
    of the hidden frame technique: the hidden iframe.


    # XMLHttp


    The developers at Microsoft must have realized the potential of the hidden frame
    technique and the new hidden iframe technique, they decided to provide developers
    with a better tool for client-server interaction. That tool came in the form of
    an ActiveX object called XMLHttpRequest, introduced in 2001.


    One of the extensions to JavaScript allowed the creation of ActiveX controls,
    Microsoft''s property programming objects. When supporting HTML through a library
    XML, the XMLHttpRequest object was included in it carried the XML name, this object
    was more than just another XML object. It was more like an ad hoc HTTP request
    that could be controlled from JavaScript. Developers had to handle HTTP status
    codes and headers, as well as any data returned from the server. The data was
    structured XML, pre-formatted swaths of HTML, serialized JavaScript objects, or
    data in any other format desired by the developer. Instead of using hidden frames
    or iframes, it was now possible to access the server programmatically using pure
    JavaScript, independent of the page load/reload cycle. The XMLHttpRequest object
    became a tremendous hint for Internet Explorer'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'With popularity momentum, developers at the open source Mozilla project began
    their own port of XMLHttpRequest. Instead of allowing access to ActiveX, the Mozilla
    developers replicated the object''s principal methods and properties in a native
    browser objectXMLHttpRequest. With the major browsers supporting some form of
    XMLHttpRequest, the development of Ajax-type interfaces really took off and forced
    the fringe browsers, Opera and Safari, to support some form of XMLHttpRequest
    as well (both chose to do so natively with an XMLHttpRequest, mimicking Mozilla).


    # # The Real Ajax


    Despite the frequently asked questions attached to the end of Garrett''s essay—some
    confusion still exists as to what Ajax really is. Simply put, Ajax is nothing
    more than an approach to web interaction. This approach involves transmitting
    only a small amount of information to and from the server in order to give the
    user the most responsive experience.


    Instead of the web application model where the browser is responsible for initiating
    requests, and processing requests from the server, Garrett provides an intermediate
    layer— Garrett calls an Ajax engine — handle this communication. An Ajax engine
    is just a JavaScript object or function that is called whenever needs to be requested
    from the server. Instead of the traditional method of providing a link to another
    resource (such as another web page), each link calls the Ajax engine, which schedules
    and executes the request asynchronously, meaning that code executes without wait
    for a response before.


    The server — which traditionally would serve HTML, CSS, or JavaScript — is configured
    to return data that the Ajax engine can use. This data can be parsed as text,
    or any other data that the user may need. The only requirement is that the Ajax
    engine can understand and interpret the data


    When the Ajax engine receives the server response, it goes into action, often
    parsing the data and making several changes to the user interface based on the
    information it was provided. Because this process involves transferring less than
    the traditional web application model, user interface updates are faster, and
    the user is able to do his or her work more quickly. Figure 1-1 is an adaptation
    of the figure in Garrett''s article, displaying the difference between the traditional
    and Ajax application models.


    ![](img/b372374b4ba34adee418bd5ab6e01f7f_10_0.png)


    # # Ajax Principles


    As a new web application model, Ajax is still in its infancy. However, several
    web developers have taken this development as a challenge. The challenge is to
    define what makes a good Ajax web application versus a mediocre one. Michael Mahemoff
    (http://mahemoff.com/), a software developer and usability expert, identified
    several key principles of Ajax applications that are respecting:


    +   - **Minimal traffic:** Ajax applications should send and receive as little
    information as possible to and from the server. In short, Ajax can minimize the
    amount of traffic between'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'the client and the server. Making sure that your Ajax application doesn''t
    send and receive unnecessary information adds to its robustness.


    +   - No surprises: Ajax applications typically introduce different user interaction
    models than traditional web applications. As opposed to the web standard of click-and-wait,
    Ajax applications use other interface paradigms such as drag-and-drop or double-clicking.
    No matter what user interaction model you choose, be consistent so that the user
    knows what to do.


    +   - Established conventions: Don''t waste time inventing new user interaction
    models that your users will be unfamiliar with. Borrow heavily from traditional
    web applications and desktop applications so there is a minimal learning curve.


    +   - No distractions: Avoid unnecessary and distracting page elements as looping
    animations, and blinking page sections. Such gimmicks distract the user from what
    he is trying to accomplish.


    +   - Accessibility: Consider who your primary and secondary users will be and
    how they most likely access your Ajax application. Don''t program yourself into
    a corner so that an unexpected new audience is completely locked out. Will your
    users be using older browsers or special software? Make sure you know ahead of
    time and plan for it.


    +   - Avoid entire page downloads: All server communication after the initial
    page download should be managed by the Ajax engine. Download small amounts of
    data in place, but reloading the entire page in others.


    +   - User first: Design the Ajax application with the users in mind before inventing
    anything else. Try to make the common cases easy to accomplish and not caught
    off with how you''re going to fit in advertising or cool effects.


    The common thread in all these principles is usability. Ajax is, primarily, enhancing
    the web experience for your users; the technology behind it is merely means to
    that end. By adhering to the preceding principles, you can be reasonably assured
    that your Ajax application will be useful and usable.


    # Technologies Behind Ajax


    Garrett''s article mentions several technologies that he sees as parts of an Ajax
    solution. are:


    +   - HTML/XHTML: Primary content representation languages


    +   - CSS: Provides stylistic formatting to XHTML


    +   - DOM: Dynamic updating of a loaded page


    +   - XML: Data exchange format


    +   - XSLT: Transforms XML into XHTML (styled by CSS)


    +   - XMLHttpRequest: Primary communication broker


    +   - JavaScript: Scripting language used to program an Ajax engine


    In reality, all these technologies are available to be used in Ajax solutions,
    but only three are required: HTML/XHTML, DOM, and JavaScript. XHTML is obviously
    necessary for the display of information, the DOM is necessary to change portions
    of the XHTML page without reloading it. The last part, JavaScript, is necessary
    to initiate the client-server communication and manipulate the DOM to update the
    web page. The other technologies in the list are helpful in fine-tuning an Ajax
    solution, but they aren''t necessary.'
