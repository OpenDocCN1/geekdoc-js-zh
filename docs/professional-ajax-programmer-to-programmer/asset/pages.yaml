    \ = null;\n  }\n  mboxbox.setProcessing(false);\n}\n```\n\nThe `loadRender()`\
    \ function expects a JSON string to be passed in an argument. That data is loaded\
    \ using the `loadInfo()` method. Once that happens, the `renderFolder()` method\
    \ called begin displaying the new information. After that, the function checks\
    \ if there is a notice that needs to be displayed in `nextNotice`. If so, notice\
    \ is displayed and `nextNotice` is set back to null. The very last step is to\
    \ set the `processing` flag to false, indicating that the mailbox is free to make\
    \ other requests.\n\nThe simpler case is when a command has to be executed on\
    \ the server without returning any information. When the request has completed,\
    \ you simply want to display any notification that may be waiting and then reset\
    \ the processing flag back to false. To do so, use:\n\n```\nfunction execute(sInfo)\
    \ {\n\n  if (mboxbox.nextNotice) {\n    mboxbox.showNotice(\"Info\", mboxbox.nextNotice);\n\
    \    mboxbox.nextNotice = null;\n  }\n  mboxbox.setProcessing(false);\n}\n```\n\
    \nUsing this callback instead of `loadRender()` prevents the user interface from\
    \ updating when the request completes. The action taken is purely based on the\
    \ scenes and is only indicated by the notice (if any) that is displayed. With\
    \ `loadRender()`, the last step is to set `processing` back to false.\n\nThe last\
    \ callback, `sendConfirmation()`, is used only when sending mail. It expects a\
    \ simple JSON object to be returned with two properties: `error` and `message`.\
    \ If `error` is true, an error has occurred and the `message` property contains\
    \ an error message to display to the user; otherwise, the mail was sent successfully\
    \ and `message` contains a message to be displayed using `showNotice()`.\n\n```\n\
    function sendConfirmation(sData) {\n\n  var oResponse = JSON.parse(sData);\n \
