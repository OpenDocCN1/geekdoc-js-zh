  md: "To read the remote server's response, use the OpenRead() method. This method\
    \ returns a Stream object that you can read with a StreamReader class. The StreamReader's\
    \ ReadToEnd() method reads the stream and returns it as a string to xmlStr. If\
    \ for reason reason fails (most likely as a result of not finding the remote host),\
    \ an error is created by the writerErrorDoc() and used in the process of the weather\
    \ feed.\n\nAt this point, you have some XML data to use; now perform an XML transformation\
    \ on the XML document. Transforming the data at the server is advantageous for\
    \ several reasons. For one, it greatly simplifies the client-side code. The data\
    \ sent to the client is already in HTML, so it is easily added to the page. A\
    \ server-side transformation also makes the client work less. The data is complete\
    \ when it reaches the client, no other data manipulation, than placing in the\
    \ page, is required.\n\nXSL transformations in NET closely resemble the transformations\
    \ provided by MSXML in Chapter 4. The first step in a transformation is to create\
    \ the objects involved:\n\n```\nXslTransform transform = new XslTransform();\n\
    XmlDocument xml = new XmlDocument();\nusing (StringWriter writer = new StringWriter())\n\
    ```\n\nTransformations in .NET include an XslTransform object, an XmlDocument\
    \ object, and a StringWriter object, which contains the resulting transformed\
    \ data. The next step in the transformation process is to load the XML data into\
    \ the XmlDocument object and the XSL document into the Xslt object:\n\n```\nxml.Load(xmlStr);\n\
    slt.Load(path + \"/weather.xslt\");\n```\n\nThe LoadXml method of the XmlDocument\
    \ class resembles the loadXML() method in the MSXML library. It accepts a string\
    \ argument representing the XML data. The XML document is loaded into the XMLDocument\
    \ via the Load() method. This method takes one argument: a string containing the\
    \ path to the XML document.\n\nThe final step is to perform transformation and\
    \ retrieve the resulting data from the StringWriter:\n\n```\nxslt.Transform(xml,\
    \ stringWriter, null);\nxmlStr = stringWriter.ToString();\n```\n\nThe Transform\
    \ method has overloads. Overloaded methods have the same name that perform the\
    \ same function, but accept different arguments. This particular overload accepts\
    \ the XML document in the first position, an argument list (or parameter list)\
    \ to pass to the XSLT processor in the second position, the StringWriter to serve\
    \ as output in the third position. Use null to handle any XML namespaces in the\
    \ last position. Once the transformation is complete, you can use the ToString()\
    \ method to obtain the transformed data from the StringWriter.\n\nThe final step\
    \ in getWeatherData() is to cache the data. This is done with a StreamWriter,\
    \ which writes the data in UTF-8 encoding:\n\n```\nusing (StreamWriter writer\
    \ = new StreamWriter(_cachedFile))\n{\n    writer.Write(xmlStr);\n}\n```\n\nThe\
    \ StreamWriter class constructor accepts a string argument containing the path\
    \ to the file to write to. The StreamWriter writes the contents of xmlStr and\
    \ is promptly disposed of when the using block exits."
