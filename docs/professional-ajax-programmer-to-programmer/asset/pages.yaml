  md: "# XPath in IE\n\nMicrosoft's implementation of XPath is a part of MSXML 3.0\
    \ and later. If you are using any version of Windows XP, or have IE 6.0 or higher\
    \ installed, your computer has this capability. If not, you will need to download\
    \ and install the latest MSXML package.\n\nMicrosoft chose to implement two methods\
    \ that select nodes based on XPath expressions. The first, selectSingleNode(),\
    \ returns the first node within its context that matches the expression. For example:\n\
    \n```\nvar FirstAuthor = oXmldom.document.element.selectSingleNode(\"book/author\"\
    );\n```\n\nThis code returns the `<a>` element that is a child of a `<b>` element\
    \ in the context of the document. The result of this is the following:\n\n```\n\
    <author>Nicholas C. Zakas, Jeremy McPeak, Joe Fawcett</author>\n```\n\nThe second\
    \ method in Microsoft's XPath implementation is selectNodes(). This method returns\
    \ a NodeList, of all nodes that match in the XPath expression:\n\n```\nvar Authors\
    \ = oXmldom.document.element.selectNodes(\"book/author\");\n```\n\nAs you may\
    \ have guessed, all `<a>` elements with a parent of `<b>` in the context of the\
    \ document are returned. If the pattern cannot be matched in the document, a NodeList\
    \ is still returned but it has a length of 0. It is a good idea to check the length\
    \ of a returned before attempting to use it:\n\n```\nif (Authors.length > 0) {\n\
    \  //Do something\n}\n```\n\n# Working with Namespaces\n\nThe X in XML stands\
    \ for extensible. There are no predefined elements in an XML document; a developer\
    \ created every element in any given XML document. This extensibility is part\
    \ of what makes XML so popular, but it inherently carries a problem: naming conflicts.\
    \ For example, consider the following XML document:\n\n```\n<?xml version=\"1.0\"\
    \ encoding=\"utf-8\"?>\n```\n\n```\n<addresses>\n  <address>\n    <number>12345</number>\n\
    \    <street>Your Street</street>\n    <city>Your City</city>\n    <state>Your\
    \ State</state>\n    <country>USA</country>\n  </address>\n</addresses>\n```\n\
    \nThere is nothing out of the ordinary in this document. It simply describes an\
    \ address located in the USA. But what if the following lines were added:"
  merge: -1
