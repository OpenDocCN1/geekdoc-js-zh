    # New Comment Notifier Example


    A feature has been creeping into blogs the Web since the beginning of 2005 is
    a New Comment Notifier. A New Comment Notifier does exactly what it says it does:
    alerts the user when a new comment has been added. This can take the form of a
    single text message displayed on the page or an animated message that slides in
    out of view, but the basic idea is the same. In example, Periodic Refresh is used
    to check a database table containing comments to see which is the newest.


    Suppose you have a simple MySQL table, defined as:


    ```

    CREATE TABLE `Comments` (

    `CommentId` INT NOT NULL AUTO_INCREMENT,

    `BlogEntryId` INT NOT NULL,

    `Name` VARCHAR(100) NOT NULL,

    `Message` VARCHAR(255) NOT NULL,

    `Date` DATETIME NOT NULL,

    PRIMARY KEY (`CommentId`)

    ) COMMENT = ''Blog Comments'';

    ```


    The SQL query to run this is:


    ```

    select CommentId, Name, LEFT(Message, 50)

    from BlogComments order by Date desc

    limit 0,1

    ```


    This query returns the comment ID (which is autogenerated), the name of the person
    who left the comment, and the first 50 characters of the message text (using the
    LEFT() function) for the most recent comment. The 50 characters are used as a
    preview of the actual comment (you probably don''t want to get the entire message
    because it could be long).


    The page that runs this query is CheckComments.php, and outputs a string in the
    following format:

    <comment ID||<name>||<message>


    This format allows Array.split() to be used in order to extract the individual
    pieces of information with little effort. If there are no comments or there is
    an error, the comment ID will be -1 and the other parts of the string will be
    blank. Here is the complete listing for CheckComments.php:


    ```

    <?php

    header("Cache-control: No-Cache");

    header("Pragma: No-Cache");

    ```


