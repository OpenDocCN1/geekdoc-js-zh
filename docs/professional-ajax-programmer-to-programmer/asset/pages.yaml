  md: '# Chapter 9: AjaxMail


    # Overview


    One of the most popular Ajax applications is Gmail, a web-based e-mail system
    that incorporates several Ajax techniques to create a seamless user experience.
    Gmail loads a single page and then makes changes to reflect user actions, eliminating
    entirely the "click-and-wait" experience of most web applications. There is a
    lot of back-and-forth with the server to retrieve information that the user never
    knows because of the system''s design. AjaxMail is an excellent example of how
    to build an Ajax-based web application, this chapter focuses on developing a similar
    application called AjaxMail.


    In this chapter, you will use techniques learned throughout the book to bring
    AjaxMail to life. Both hidden frames and the XMLHttpRequest object will be used
    for communicating with the server, and you will be reminded of how and to use
    each technique. Remember, the whole point of using Ajax is to improve the user''s
    experience; this chapter gives you the opportunity to firsthand how to create
    an application with the user in mind.


    # Requirements


    Before building a web application, it is always good to define the requirements
    and build to them. You may have never used an e-mail application like Outlook,
    Thunderbird, or Eudora on a daily basis and have really thought about all the
    things it must do to provide a good user experience. For simplicity, AjaxMail
    will support a subset of what these applications do (although it is easy enough
    to extend the functionality on your).


    The requirements for AjaxMail are:


    +   * Support for POP3 to receive mail and SMTP to send mail

    * Ability to read a list of e-mail messages from the server

    * Visual indication if a message contains an attachment

    * Ability to read an individual e-mail with support for plain text messages only

    * Notification when new mail messages arrive

    * Ability to send, forward, and reply to messages


    To implement these requirements, a variety of Ajax patterns and communication
    techniques will be used. There is extensive use of XMLHttpRequest, requiring the
    use of the XML library, and some hidden frames. In building this application,
    you will learn how to incorporate and integrate the techniques you have learned
    in this book.


    # Architecture


    AjaxMail is built using PHP for the server-side language and MySQL for the database.
    A database is necessary to keep track of information relating to specific messages,
    such as what folder they in and whether they have been read. Both of these can
    be accomplished by setting flags for a message in the database.


    There are two folders in AjaxMail: Inbox and Trash. When a message is deleted
    from the Inbox, it is moved to the Trash. The message is permanently deleted when
    the Trash is emptied; otherwise, the message remains in the Trash (it is also
    possible to restore a message from the Trash). Even though this chapter uses only
    these two folders, you may use as many as you wish.


    Each time a request is made to the server, AjaxMail checks to see if there are
    any new messages in the specified POP3 e-mail account. If there are, the messages
    are downloaded and saved into the MySQL database. The messages are then read out
    of the database and sent back to the client.'
