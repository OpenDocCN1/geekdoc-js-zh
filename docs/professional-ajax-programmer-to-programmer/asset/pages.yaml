  md: "# XMLHttp Requests\n\nWhen Microsoft Internet Explorer 5 introduced a rudimentary\
    \ level of XML support, ActiveX library called MSXML was also introduced (discussed\
    \ at length in Chapter 4). One of the objects provided in this library became\
    \ very popular: XMLHttp.\n\nThe XMLHttp object was created to enable developers\
    \ to initiate HTTP requests from anywhere in an application. These requests were\
    \ intended to return XML, so the XMLHttp object provided any way to access this\
    \ information in the form of an XML document. Since it was an ActiveX control,\
    \ XMLHttp could be used only in web pages but also in Windows-based desktop application;\
    \ however, the popularity on the Web has outpaced itself for desktop applications.\n\
    \nPicking up by popularity, Mozilla duplicated the XMLHttp functionality for its\
    \ browsers, such as Firefox. Shortly thereafter, the Safari (as of version 1.2)\
    \ and Opera (version 7.6) browsers had duplicated Mozilla's implementation. Today,\
    \ all four browsers support XMLHttp to some extent. (Safari and Opera still have\
    \ incomplete implementations, supporting GET and POST but no other requests.)\n\
    \n# Creating XMLHttp Object\n\nThe first step to using an XMLHttp object is, obviously,\
    \ to create one. Because Microsoft's implementation is an ActiveX control, you\
    \ must use the ActiveXObject class in JavaScript, passing the XMLHttp control's\
    \ signature:\n\n```\nvar xmlHttp = new ActiveXObject(\"Microsoft.XMLHttp\");\n\
    ```\n\nThis line creates the first version of the XMLHttp object (the one shipped\
    \ with IE 5.0). The problem is that there have been several versions released\
    \ with each subsequent release of the MSXML library. Each release brings better\
    \ stability and speed, so you want to make sure you are using the most recent\
    \ version available on the user's machine. The signatures are:\n\n+   * Microsoft.XMLHttp\n\
    * MSXML2.XMLHttp\n* MSXML2.XMLHttp-3.0\n* MSXML2.XMLHttp-4.0\n* MSXML2.XMLHttp-5.0\n\
    \nUnfortunately, the only way to determine the best version is to try to create\
    \ each one. Because this is an ActiveX control, any failure to create an object\
    \ will throw an error, which means you must encapsulate each attempt within a\
    \ try...catch block. The end result is a function like this:\n\n```\nfunction\
    \ createXMLHttp() {\n  var aVersions = [ \"MSXML2.XMLHttp-5.0\",\n  \"MSXML2.XMLHttp-4.0\"\
    ,\"MSXML2.XMLHttp-3.0\",\n  \"MSXML2.XMLHttp\",\"Microsoft.XMLHttp\" ];\n\n  for\
    \ (var i = 0; i < aVersions.length; i++) {\n    try {\n      var oXmlHttp = new\
    \ ActiveXObject(aVersions[i]);\n      return oXmlHttp;\n    } catch (oError) {\n\
    \      // nothing\n    }\n  }\n}\n```"
