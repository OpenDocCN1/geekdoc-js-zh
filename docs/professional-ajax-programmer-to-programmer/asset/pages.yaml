  md: "and XML documents alike. At the center of this two primary objects: XPathEvaluator\
    \ and XPathResult.\n\nThe XPathEvaluator class gives a XPath expression to the\
    \ evaluate() method, which takes five arguments: the XPath string to be run against,\
    \ the context node that the expression should be run against, a namespace resolver\
    \ (which is a function that will handle the namespaces in the expression), the\
    \ result type you want (ten result types available), and an XPathResult object\
    \ to contain the results (if this argument is null, then a new XPathResult is\
    \ created).\n\nBefore moving on, it's important to understand the various result\
    \ types that can be returned from evaluate(): These are:\n\n+   * XPathResult.ANY_TYPE,\
    \ which returns no type. The method returns the type that naturally results from\
    \ the evaluation of the expression.\n* XPathResult.ANY_ORDERED_NODE_TYPE, which\
    \ returns a node set of node that is accessed through the singleNode property;\
    \ null is returned if there are no matching nodes. The returned node may may not\
    \ be the first occurring node.\n* XPathResult.BOOLEAN, returns a Boolean value.\n\
    * XPathResult.FIRST_ORDERED_NODE_TYPE, which returns a node consisting of one\
    \ node. This node is accessed with the singleNode property of the XPathResult\
    \ class. The returned node is the first occurring in the document.\n* XPathResult.NUMBER_TYPE,\
    \ which returns a number value.\n* XPathResult.ORDERED_NODE_ITERATOR_TYPE, which\
    \ returns a document-ordered node set that can be iterated using the iterateNext()\
    \ method; therefore, you can easily access each individual node in the set\n*\
    \ XPathResult.ORDERED_NODE_SNAPSHOT_TYPE, which returns a document-ordered node\
    \ set that is a snapshot of the result set. Any modifications to the nodes in\
    \ the document do not affect the results.\n* XPathResult.STRING_TYPE, which returns\
    \ a string value.\n* XPathResult.UNORDERED_NODE_ITERATOR_TYPE, which returns a\
    \ node set that can be iterated through; however, the results may or not be in\
    \ the same order as they appear in the document.\n* XPathResult.UNORDERED_NODE_SNAPSHOT_TYPE,\
    \ which returns an unordered snapshot node set. Any modifications to the nodes\
    \ in the document do not affect the result set.\n\nThe most common result type\
    \ is XPathResult.ORDERED_NODE_ITERATOR_TYPE:\n\n```\nvar oEvaluator = new XPathEvaluator();\n\
    var sXPath = \"book/author\";\nvar oResult = oEvaluator.evaluate(sXPath,oXmlDom.documentElement,null,\n\
    XPathResult.ORDERED_NODE_ITERATOR_TYPE,null);\n```\n\n```\nvar aNodes = new Array();\n\
    \nif (oResult != null) {\n  var oElement;\n  while (oElement = oResult.iterateNext())\
    \ {\n    aNodes.push(oElement);\n  }\n}\n```"
  merge: -1
