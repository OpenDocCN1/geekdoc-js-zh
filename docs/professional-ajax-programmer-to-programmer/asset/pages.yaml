  md: 'The document element, <wsdl:definitions/>, encompasses the content and allows
    the declaration of various namespaces. The next element, <wsdl:types/>, contains
    the XML schema used by the service. Each of this element is <s:schema>, which
    describes the format of all elements that appear in the <soap:Body/> of either
    the request or the response.


    The first element described in the schema is <add/> Since the <s:schema> element
    has elementDefault set to, <add/> is assumed to be in the namespace designed by
    the targetNamespace attribute, http://www.wrox.com/services/math. The <add/> element
    is then declared to contain a sequence of two elements, <op1> and <op2>. Both
    of these elements have minOccurs and maxOccurs set to 1, which means they must
    appear once and only once. They also have a type attribute of s:float, which is
    one of the built-in XML schema types.


    +   You can find a list of XML schema data types at http://www.w3.org/XML/schema-0/#CreateDT.
    If you need more complicated types, you can construct complex types by aggregating
    and restricting these base types.


    Next in the schema is <s:element/>, this one describing <addResponse/>. This element
    is defined to have one child element, <add/>, which contains the result of the
    operation (which appear as s:float). This is the last entry in the included XML
    schema.


    Back in the main body of the WSDL file is a short section describing <wsdl:message/>
    elements: addSoapIn and addSoapOut. Each of these elements has <wsdl:part/> that
    specifies the element in the XML schema to use. Both refer to the two elements
    add and response, respectively. This section states the format of each message.


    The following is used to group the <wsdl:message> elements into operations. An
    operation is defined as a single unit of work and,, comprises of <wsdl:input>
    and namely <wsdl:output> and an optional <wsdl:fault>. The following example has
    a <wsdl:operation> that describes a method. The message attributes on its <wsdl:input>
    and <wsdl:output> are named namely <wsdl:operation> containing a user-friendly
    description of the method. You will also find <wsdl:documentation> elements later
    in the chapter.


    After the part type is a <wsdl:binding/> block. A binding pairs an operation with
    a protocol used to communicate with the service. There are three bindings described
    in the WSDL: SOAP, HTTP GET/POST, and MIME. This chapter focuses on the SOAP binding.
    The HTTP GET/POST bindings with URLs are encoded (for GET requests) or how the
    data is encoded (for POST requests). MIME binding defines parts of the message,
    normally the output, to be expressed in different types. MIME means the format
    of the response could be XML, whereas a second part could be HTML.


    You can read more about these alternatives at www://www.w3.org/TR/2002/wsdl-bindings-20020709/


    First, the name of the binding is set to the MathSoap port type defined in the
    <wsdl:portType section. Second, the <soap:binding/> element uses the transport
    attribute to specify that the service operates over HTTP. The <wsdl:operation/>
    element simply defines the name of the method, add. The <soap:operation/> contains
    the soapAction that needs to be incorporated into the header of the HTTP request
    as well as the style attribute, which specifies that the SOAP message will be
    of data type rather than an RPC type.'
