    \ title=\"Click to go posting.\" target=\"_new\">Travel to Post</a>\n    </div>\n\
    \    <div id=\"divMessageBody\"></div>\n  </div>\n</div>\n```\n\n# Usability\n\
    \nThere are a few usability issues that you should be concerned with. For one,\
    \ users expect web applications to function like any other application. In Outlook\
    \ 2003, from which this application borrows heavily, double-clicking an item in\
    \ the items pane will pull the specific email message in a new window. Since FooReader.NET\
    \ is based on that model, double-clicking an item opens a new window and takes\
    \ the user to the specific blog post or article. To achieve this, the onclick\
    \ event on the items is assigned the doubleClick() handler (you'll see this assignment\
    \ layer):\n\n```\nfunction doubleClick() {\n  var oItem = oFeeds[this.getAttribute(\"\
    frFeedItem\")];\n  var oWindow = window.open(oItem.link.value);\n}\n```\n\nSecond,\
    \ the user needs to know when the application is working to fill a request. The\
    \ only time a request is made to the server is when a feed is loaded, some type\
    \ of visual cue needs to show the user that something is happening. For this purpose,\
    \ Figure 5-2 shows this user interface cue in action."
