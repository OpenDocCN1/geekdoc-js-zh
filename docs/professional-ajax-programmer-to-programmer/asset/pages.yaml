    \ is a powerful interface from which you can retrieve, remove, and add data.\n\
    \n# Error Handling in IE\n\nWhen XML data is loaded, errors can be thrown for\
    \ a variety of reasons. For example, the external XML file may not be found or\
    \ the XML may not be well formed. To handle these occasions, MSXML provides the\
    \ parseError object, which contains the information. This is a property of every\
    \ XML DOM document MSXML creates.\n\nTo check for errors, the parseError object\
    \ exposes the errorCode property, which can be compared to the integer 0; if errorCode\
    \ does not equal 0, an error occurs. The following example is designed specifically\
    \ to cause an error:\n\n```\nvar sXml = \"<root><person><name>Jeremy McPeak</name></root>\"\
    ;\nvar xmlDom = createDocument();\nxmlDom.loadXML(sXml);\n\nif (xmlDom.parseError.errorCode\
    \ != 0) {\n  alert(\"An Error Occurred: \" + xmlDom.parseError.reason);\n} else\
    \ {\n  // Code to successful load.\n}\n```\n\nIn the highlighted line, the </person>\
    \ element is not closed. Because the XML being loaded is not well formed, an error\
    \ occurs. The errorCode is compared to 0; if they do not match (and they don't!),\
    \ an alert will display what caused the error. To do this, it uses the reason\
    \ property of the parseError object, which describes the reason for the error.\n\
    \nThe parseError object provides the following properties to enable you to better\
    \ understand an error:\n\n+   * errorCode: The code as a long integer\n* filePos:\
    \ A long integer specifying the position in the file where the error occurred\n\
    * line: The line number that contains the error as a long integer\n* linePos:\
    \ The character position in the line where the error occurred (long integer)\n\
    * reason: A string specifying why the error happened\n* srcText: The text of the\
    \ line where the error occurred\n* url: The URL of the XML document as a string\n\
    \nAll of these properties provide information about each error, it is up to you\
    \ to make the most sense given your needs.\n\n+   * Important The errorCode property\
    \ can be positive or negative; only when errorCode is 0 you can be that no error\
    \ occurred.\n\n# XML DOM in Firefox\n\nWhen it comes time to implement the XML\
    \ DOM in Mozilla Firefox, the developers took a more standards-centric approach\
    \ in making it a part of the JavaScript implementation. In doing so, Mozilla ensured\
    \ XML DOM support on all platforms in Gecko-based browsers."
