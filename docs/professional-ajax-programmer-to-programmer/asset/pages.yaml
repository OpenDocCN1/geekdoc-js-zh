    # Summary of JSPSpan


    JSpan is easy to use and integrates well with PHP. It can cope with classes that
    the builtin and more complex ones if they are built from them. If JSPSpan has
    one main failing, it is that the online documentation is somewhat sparse. Although
    JSPSpan is covered extensively by numerous sites, if you need to customize JSPSpan
    itself, you will need to dig into the source files and examples included in the
    basic installation.


    # DWR


    Direct Web Remoting (DWR) is designed to be used with Java, one of the most widely
    used object-oriented languages. Java is limited to any particular platform, but
    its main use has server-side rather than desktop applications.


    > Remember that the similarity in names between Java and JavaScript owes more
    to matching methods than inherit relationships between the two languages. Although
    the syntax of both is identical in to places, there are many differences, especially
    when it comes to data typing.


    # How It Works


    DWR also uses reflection to examine any of the classes specified in its configuration
    files. It dispatches JavaScript to the client in which each function resembles
    that on the class but has an extra parameter specifying a function to call when
    As JSPSpan, DWR uses a cross-browser library and the latest version of XMLHttpRequest,
    the ActiveX version if running Internet Explorer or the native JavaScript version
    for the Mozilla-based browsers and others such as Safari and Conquer.


    # Installing DWR


    Although the actual installation of DWR is straightforward, there are a number
    of prerequisites that need to be taken care of.


    # Installing the Java SDK


    First, download the Java software development kit from http://java.sun.com. The
    following examples are based on the version 1.5 kit, so if you have an earlier
    version you will need to upgrade.


    > You have a number of options available at Sun''s site that can be confusing
    at times. For development work, you basically have two choices: either the plain
    development kit (which will also install the necessary files for all Java applications)
    or the one that includes the NetBeans IDE (Integrated Development Environment).
    All the examples in this chapter can be developed and run without the IDE. This
    can then be downloaded separately if you are moving to more serious Java development.


    You can then install the kit and runtime and create any environment variables
    detailed in the accompanying readme file.


    # Installing the Web Server


    Next, you will need a web server that supports Java servlets and JSP. The most
    common one is Tomcat, part of the Apache Jakarta project. There are versions available
    for Windows'
