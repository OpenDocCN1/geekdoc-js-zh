    REST-style services are fairly straightforward and follow a repeating pattern.
    For example, you may get a complete list of authors using http://www.wrox.com/services/authors/,
    while a slight modification, adding an author ID at the end, may retrieve information
    about a single author, from http://www.wrox.com/services/authors/fawcettj.


    The service can be implemented in any number of ways. It could be more or less,
    server-side processing such as ASP, JSP, or PHP, fetches data from a database
    and returns the appropriately constructed XML. In this case the URL would be mapped
    by the server to an application-specific way of retrieving the data, possibly
    by invoking a stored procedure in the database.


    > You can read more about REST-style services (also called RESTful services) at
    www.network.wrox.com/ee/2003/eereest.html.


    # .NET Connection


    By many respects, Microsoft spearheaded the web services movements with the introduction
    of SOAP. When Microsoft presented SOAP to IBM as a way of transporting data, IBM
    came on board, helping to develop what later became WSDL. With the combined force
    of Microsoft and IBM, many more companies joined on board, such as Oracle, Sun,
    and HP. The standards were established and the beginning of the web service era
    was on the horizon, but there was a catch: there were no tools to facilitate the
    creation of web services. There where .NET came in.


    Microsoft released the .NET Framework in 2000 with the aim of providing a platform-independent
    development framework to compete with Java. Since Microsoft started nearly from'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'scratch with the .NET initiative, they built in strong support for XML, as
    well as the creation and consumption of web services using SOAP and WSDL. Using
    .NET, there are simple ways to provide a web wrapper around existing applications
    as well as exposing .NET classes using web services.


    When developing web services, you can decide how much interaction with SOAP and
    WSDL is necessary. There are tools to shield developers from the underlying structure,
    and you can also change fine details if necessary. The 2005 version of the .NET
    Framework makes even more use of XML and web services.


    # Design Decisions


    Although the .NET Framework makes service development easier, it is by no means
    only to create them. Just like any other programming task, there are several design
    and development decisions that must be made. Remember, web services provide a
    platformindependent way of receiving and sending data, the service consumer doesn''t
    (or in many cases) want information about how it is implemented. Unfortunately,
    there are things to be aware of when interoperability is a concern.


    +   * All platforms support the same data types. For example, many services return
    an ADO.NET dataset. A system without .NET will be unlikely to understand this
    data format. Similarly, arrays are problematic because they can be represented
    in any number of ways.


    +   * Some services are more than missing or extra headers in the request. This
    problem is allied to consumers that do not get all the correct headers, which
    can create problems, especially when it comes to securing a service.


    In an effort to cover these and other issues, the Web Services Interoperability
    Organization was formed. You can find its aims, findings, and conference recommendations
    at www.ws-i.org/


    When creating a web service, your first decision is which platform to use. If
    you choose Windows, you''ll almost certainly use IIS as your web service. You
    can use ASP.NET to create your services, or ASP for older versions of IIS (this
    is more difficult). The examples in this chapter use ASP.NET.


    If you are using UNIX or Linux, you will likely be using JSP or PHP, both of which
    have open source web services. Using these, you will need to program in Java or
    PHP, respectively, to create web services.


    > The project (http://www.apache.org/axis/) has development tools for both Java
    and C++.


    > For PHP there are plenty of options, including PhpXMLRPC (http://phpmlrc.sourceforge.net/)
    and Pear SOAP (http://pear.php.net/package/SOAP).


    After you choose a language, you''ll need to decide who will access to your service.
    Your application will be the only one calling, or will your service be accessible
    publicly? If the latter, you will need to take into account the interoperability
    issues discussed previously; if the former, you can take advantage of some of
    the specialized features provided by the client or the server.


    With a web service created, the next step is to consume it. Any application that
    calls a web service is considered a consumer. Typically, consuming a web service
    follows a distinct pattern: create a request, send the request, and act on the
    received response. The exact method for taking these steps is up to the functionality
    that is accessible by the consumer.'
