  md: "<w:op1>4.5</w:op1>\n<w:op2>5.4</w:op2>\n</w:add>\n</soap:Body>\n</soap:Envelope>\n\
    \nWhenever you are dealing with non-trivial XML documents, for example documents\
    \ that are to be shared across businesses and applications, namespaces come into\
    \ play. Namespaces are especially important in SOAP because elements need to be\
    \ produced and read by different systems. The SOAP namespace, specified in this\
    \ example as `http://schemas.xmlsoap.org/soap/envelope/` , is for version 1.1,\
    \ and can vary depending on which version you are using. The 1.2 namespace is\
    \ `http://www.w3.org/2003/05/soap-envelope`.\n\n <w:add>` element specifies the\
    \ name of the method to call (add) and contains the other namespace in the element,\
    \ `http://www.wrox.com/services/math`. This namespace is specific to the service\
    \ that is being called and can be defined by the developer. The `soapencodingStyle`\
    \ attribute points to a URL indicating how the data is encoded in the request.\
    \ There is a variety of other encoding styles available, such as the system type\
    \ employed in XML schemas.\n\nAn optional `<soap:Header>` element can be used\
    \ to contain additional information, such as security credentials. If used, this\
    \ element comes immediately after `<soap:Body>`.\n\nIf the request to add numbers\
    \ executed successfully, the response message would look like this:\n\n```\n<?xml\
    \ version=\"1.0\" encoding=\"utf-8\" ?>\n<soap:Envelope xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope\"\
    >\n  soap:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding\">\n```\n\n\
    ```\n<soap:Body>\n  <w:addResponse xmlns:w=\"http://www.wrox.com/services/math\"\
    >\n    <w:addResult>9.9</w:addResult>\n  </w:addResponse>\n</soap:Body>\n</soap:Envelope>\n\
    ```\n\nAs you can see, the format is similar to the initial request. The standard\
    \ way of supplying the result is to create an element with the name of the method\
    \ followed by the \"Response.\" In this case, the element is `<w:addResponse>`,\
    \ and has the same namespace as the `<w:add>` element. The actual result is returned\
    \ in the `<w:addResult>` element. The web service developer can define all these\
    \ elements.\n\nWere there a problem processing the SOAP request or, assuming the\
    \ request actually failed, then a `<soap:Fault>` element will be returned. For\
    \ instance, if the first operand in the order might have been entered incorrectly\
    \ as a letter of the number, you might receive the following:\n\n```\n<?xml version=\"\
    1.0\" encoding=\"utf-8\" ?>\n<soap:Envelope xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope\"\
    >\n  <soap:Body>\n    <soap:Fault>\n```"
