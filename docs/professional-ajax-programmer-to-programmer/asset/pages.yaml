    \ functions that use XMLHttpRequest to post and receive from the server. The last\
    \ script, `util.js`, uses more of helper functions that, among other things, help\
    \ format data returned from the server. In the example above, toGMTString() method\
    \ returns a string, none of these utility functions are needed. Many Java methods,\
    \ return complex types that do not care when displaying or being passed for further\
    \ processing.\n\nThe page has one button that, when clicked, calls showDate().\
    \ This function in uses the Date object and calls one of its methods, toGMTString().\
    \ Here you see a difference between the use of the JavaScript object and its Java\
    \ counterpart.\n\n```\nfunction showDate() {\n  Date.toGMTString(callback);\n\
    }\n```\n\nIn Java, toGMTString() method takes no arguments; in DWR's JavaScript,\
