    # The User Interface


    The key to any successful (useful) web application is the design of the user interface.
    Because AjaxMail is meant to demonstrate the use of Ajax techniques, the user
    interface is quite simple and bare-bones. There are three different views of the
    user interface:


    +   - **Folder view**: Displays a folder of messages (either Inbox or Trash).


    +   - **Read view**: Displays a received message.


    +   - **Compose view**: Displays a form so you can send e-mails.


