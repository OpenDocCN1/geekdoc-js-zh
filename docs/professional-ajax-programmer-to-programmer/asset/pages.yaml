  md: 'Without the braces, the output would use the string literals "$Title" and "$varIsbn"
    instead.


    Using variables in attributes of XSL directives, select, are the exception to
    this rule. Using curly braces in these types of attributes will cause an, and
    the document transformation will fail.


    The remainder of XSL directives in this example are <xsl:value-of/> elements.
    Elements retrieve the value of the matched variable node or node applying the
    select attribute. The select attribute behaves in the same way as the select attributes
    of <xsl:variable> do: they make an XPath expression and select the node or variable
    that matches. The first instance of <xsl:value-of/> in this template references
    the $Title variable (lack of braces), so the value of the variable is used. Next,
    the value of the author element is used; with $Var and $publisher/.


    In order for an XML document to transform in the browser, it must have a stylesheet.
    In books.xml, add the following immediately after the XML declaration:


    ```

    <?xml-stylesheet type="text/xml" href="books.xsl?>

    ```


    This tells the processor to apply the stylesheet books.xml to document. Viewing
    this modified XML in a web browser will no longer show the XML structure, but
    it will show the resulting transformation to HTML. However, using this directive
    will not work through JavaScript. For that, you''ll need to use some special objects.


    # XSL in IE


    There are two ways to transform an XML document in IE, both of which require the
    use of MSXML. With version 3.0, MSXML has full support for XSL 1.0. If you don''t
    have Windows XP or IE 6, it is time to upgrade. You can find the latest MSXML
    downloads at http://msn.microsoft.com/XML/XMLDownloads/.


    The first and easiest method loads both the XML and XSL documents into separate
    XML DOM objects:


    ```

    var oXmlDom = zXmlDom.createDocument();

    var OXslDom = zXmlDom.createDocument();

    ```


    ```

    oXmlDom.async = false;

    OXslDom.async = false;


    oXmlDom.load("books.xml");

    OXslDom.load("books.xsl");

    ```


    When both documents are loaded, you call the transformNode() method to start the
    transformation:


    ```

    var sResults = oXmlDom.transformNode(oXmlDom);

    ```


    The transformNode() method takes an XML DOM object as an argument (in this case,
    the XSL document) and returns the transformed data as a string. But you don''t
    have to call transformNode() at the document level; it can be called from any
    element in the XML document:


    ```

    var sResults = oXmlDom.documentElement.firstChild.transformNode(oXmlDom);

    ```


    The transformNode() method will transform only the element it was called from
    and its children. In this example, the first <book/> element is transformed, as
    shown in Figure 4-3.'
