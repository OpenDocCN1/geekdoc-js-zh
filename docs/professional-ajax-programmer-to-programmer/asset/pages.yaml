    # The Architecture


    In Chapter 1, you saw the basic architecture of an Ajax solution involving the
    user interface and Ajax engine on the client. The autuggest architecture follows
    this general format, where the user interface is the autuggest control and the
    Ajax engine is a suggestion provider (Figure 7).


    ![](img/b372374b4ba34adee418bd5ab6e01f7f_196_0.png)


    # Figure 7-2


    In this architecture, the autuggest control has no idea where the suggestions
    are coming; they could be coming from the client or the server. All the autuggest
    controls know how to call the suggestion provider for suggestions the text contained
    within the box. The suggestion provider handles all the server communication and
    notifies the autuggest control when the suggestions are available. To accomplish
    this, the autuggest control and the suggestion provider need to implement specific
    interfaces so each knows what method to call on the other.


    # The Classes


    Two classes are necessary to represent the two client-side components of the autuggest
    functionality, practically called AutoSuggestControl and SuggestionProvider. The
    AutoSuggestControl is assigned a SuggestionProvider when it is created so that
    all requests go through it. The SuggestionProvider has only one method requestSuggestions(),
    called by the AutoSuggestControl whenever suggestions are needed. This method
    takes two arguments: the AutoSuggestControl itself and a Boolean value indicating
    whether the control should type ahead when the suggestions are returned.


    When the suggestions have been retrieved, the SuggestionProvider calls the autuggest()
    method of the AutoSuggestControl, passing in the array of suggestions'
