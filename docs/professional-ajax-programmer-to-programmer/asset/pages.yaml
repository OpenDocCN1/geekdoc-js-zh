  md: "Next in the index.php page is a <div> element divNotice. This element is used\
    \ to display notifications to the user, which is critical in an Ajax application.\
    \ Because the page itself doesn't reload or change to another page, there is no\
    \ indication if a particular operation was successful. This area is used to relay\
    \ such information.\n\nAjaxMail needs different types of notifications: one for\
    \ general information and one for error information. General information includes\
    \ such as notifying the user when an e-mail is sent or deleted; error information\
    \ is important when one of these actions is supposed to occur but doesn't. A general\
    \ notification appears as a yellow box with a \"!\" icon to the left; an error\
    \ notification appears as a red box with an exclamation point to the left\n\n\
    This is a general notification to the user\n\nThis is an error notification to\
    \ the user\n\n# Figure-9\n\nThe divNotice element is dynamically assigned text\
    \ as well as an appropriate CSS class, info or error, to create the desired appearance.\
    \ The styles are defined as follows:\n\n```\n#divNotice {\n  moz-box-sizing: border-box;\n\
