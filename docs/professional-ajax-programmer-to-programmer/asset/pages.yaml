  md: "```\nvar oElement;\nwhile (oElement = oResult.iterateNext()) {\n  aNodes.push(oElement);\n\
    }\n```\n\nThis example resembles the last evaluation code. However, notice the\
    \ addition to the evaluate() method; the pointer to the nsResolver function, written\
    \ earlier, is passed to the evaluate() method to handle the namespaces in the\
    \ XPath expression. The remainder of the code should look familiar to you. The\
    \ resulting NodeList is converted to an array by the iterateNext() method of the\
    \ XPathResult class to iterate through.\n\nAs you can see, the Firefox XPath implementation\
    \ is quite from the Microsoft approach; so it is helpful to use a cross-browser\
    \ library that enables you to perform XPath evaluations.\n\n# Cross-Browser XPath\n\
    \nThe XML library created by the authors provides cross-browser XPath functionality\
    \ through a common interface. The object responder for providing XPath functionality\
    \ is zXPath, which has two methods.\n\nThe first method is selectSingleNode().\
    \ This method, like the IE of the same name, returns the first node that matches\
    \ the context, the XPath string, and three arguments: the context node, a string\
    \ containing the namespace declarations. The namespace string should be in the\
    \ following:\n\n```\nxmlns:na='http://site.com' xmlns:pub='http://site2.com'\n\
    xmlns:ns='http://site3.com'\n```\n\nIf you are not working with namespaces, then\
    \ the first arguments of selectSingleNode() are the only required arguments.\n\
    \nThe returned result of selectSingleNode() is the selected XML node, or null\
    \ if a match cannot be found. The browser does not support XPath, an error is\
    \ thrown that the browser does not have an XPath engine installed. The following\
    \ example evaluates an XPath expression against the document element.\n\n```\n\
    var oRoot = oXmlDocument.documentElement;\nvar oNode = zXPath.selectSingleNode(oRoot,\
    \ \"book/author\", null);\n```\n\n```\nif (oNode) {\n  alert(oNode.xml);\n}\n\
    ```\n\nThis example searches for the <author> element contained in a <book/> element\
    \ in the context of the document. If found, the serialized XML data is displayed\
    \ to the user in an alert method.\n\nThe second method is zSelectNodes(), which\
    \ returns a node set like the IE selectNodes() method. The syntax closely resembles\
    \ that of the selectSingleNode() method above, and the arguments are exactly the\
    \ same, the same namespace rules apply. Also like selectSingleNode() an error\
    \ is thrown in the event the browser does not have an XPath engine installed.\
    \ The next example demonstrates the selectNodes() method:"
