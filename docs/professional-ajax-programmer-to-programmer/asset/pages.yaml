  md: "```\n<html>{\n<script>\nalert(Data);\n</script>\n</head>\n<body>\n<input type=\"\
    button\" value=\"Show Date\" onclick=\"showDate();\">\n</body>\n</html>\n```\n\
    \nThe page has three included scripts, all of which are generated automatically\
    \ by DWR. The first script, which is fetched from `DwrTest/interface/Date.js`,\
    \ takes the name of the object you will use (this is the name in the `create`\
