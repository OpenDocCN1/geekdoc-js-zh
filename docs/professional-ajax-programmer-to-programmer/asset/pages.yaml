  md: "# The Suggestion Provider\n\nThe SuggestionProvider class is relatively simple\
    \ compared to the AutoSuggestControl has only one purpose: to request suggestions\
    \ from the server and forward them to the control. To do so, SuggestionProvider\
    \ needs an instance of HttpRequest. Instead of using a new object for each request,\
    \ the same object will be used over and over, to avoid the overhead of creating\
    \ and destroying objects in rapid succession. This single instance is created\
    \ using the XML library's XMLHttpRequest factory stored in a property called http:\n\
    \n```\nfunction SuggestionProvider() {\n    this.http = XMLHttpRequest.createRequest();\n\
    }\n```\n\nThe method of the suggestion provider is requestSuggestions(), which\
    \ you may remember from the architecture a discussion. This method accepts two\
    \ arguments: the AutoSuggestControl to work on and a flag indicating whether typeahead\
    \ should be used. The complete code of this as follows:\n\n```\nSuggestionProvider.prototype.requestSuggestions\
    \ = function\n(oAutoSuggestControl,\n```\n\n```\nvar http = this.http;\n\n//cancel\
    \ any active requests\nif (http.readyState == 0) {\n    http.abort();\n}\n\n//define\
    \ the data\nvar data = {\n    requesting: \"StatesAndProvinces\",\n    text: oAutoSuggestControl.inputText,\n\
    \    limit: 5\n};\n\n//open connection to server\nhttp.open(\"post\", \"suggestions.php\"\
    , true);\nhttp.onreadystatechange = function () {\n    if (http.readyState ==\
    \ 4) {\n        //evaluate the returned text JavaScript (an array)\n        var\
    \ suggestions = JSON.parse(http.responseText);\n        //provide suggestions\
    \ to the control\n        oAutoSuggestControl.autosuggest(suggestions, bTypeAhead);\n\
    \    }\n}\n```"
