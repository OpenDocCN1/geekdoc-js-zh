  md: "Once you have a text range, its methods enable you to select certain parts\
    \ of the text. Although there are many range methods, the only ones of interest\
    \ for this example are moveStart() and moveEnd(), which both accept two arguments:\
    \ a unit and a number. The unit can be character, word, sentence, or textedit,\
    \ which indicates the number of units to move from the start or end of the text\
    \ (this should be a positive number for moveStart() and a negative for moveEnd()).\
    \ When the endpoints of the range are set, you can call it select() to highlight\
    \ just those characters. For example, to select the first three characters in\
    \ a text box, you do:\n\n```\nvar oRange = oTextbox.createTextRange();\nnoRange.moveStart(\"\
    character\", 0);\noRange.moveEnd(\"character\", 3 - oTextbox.value.length);\n\
    oRange.select();\noextbox.focus();\n```\n\nNote to get the appropriate value for\
    \ moveEnd(), it's necessary to set the length of the text in the text box by the\
    \ number of characters to select (3). The last step is to set the focus to the\
    \ text box so that the selection is visible (Text can be selected only when the\
    \ text box has focus.) The process is a bit involved in Internet Explorer, but\
    \ pretty easy to select. Firefox, on the other, is straightforward.\n\nText boxes\
    \ in Firefox have a non-standard method called selectionRange(), which accepts\
    \ two arguments: the index of the character to start with and the index of character\
    \ after the last character to select. So, to select the first three characters\
