    \ firstNumber, int secondNumber)\n{\n    return firstNumber + secondNumber;\n\
    }\n```\n\nAccess is then available client-side using the syntax PageClass.Method(Arg1,\
    \ Arg2, .). So, in this code you would be:\n\n```\nvar response = Index.Add(6,\
