  md: "The eBook object now passed to the XSLProcessor, meaning the XSLT stylesheet\
    \ can use it. Now the XSL document must be changed to look for this object and\
    \ use its information. The first requirement is to add a new namespace to the\
    \ root element, <xsl:stylesheet/>. This namespace must match the one used in addObject():\n\
    \n```\n<xsl:stylesheet version=\"1.0\"\nxmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\
    \n\nxmlns:book=\"http://my-object\">\n```\n\nThe prefix bookObj will be used to\
    \ access this information. Now that the namespace and prefix are ready to go,\
    \ use <xsl:value-of/> elements elements should be added to the document to retrieve\
    \ the object's members:\n\n```\n<html>\n<head>\n  <link rel=\"stylesheet\" type=\"\
    text/css\" href=\"books.css\" />\n</head>\n<body>\n  <xsl:value-of select=\"bookObj:methodOne()\"\
    \ />\n  <div align=\"center\">\n    <b><xsl:value-of select=\"bookObj:get-propertyOne()\"\
    \ /></b>\n  </div>\n  <xsl:apply-templates/>\n</body>\n</html></template>\n```\n\
    \n```\n<xsl:value-of/>\n```\n\nRemember that the <xsl:value-of/> retrieves the\
    \ value of an element, or in this case, an object. The first <xsl:value-of/> directive\
    \ retrieves (or calls) methodOne(), which sends an alert welcoming to the user\
    \ to the page. The second <xsl:value-of/> directive is similar to the first, except\
    \ that it retrieves the value of the propertyName of the oBook object.\n\nWhen\
    \ the output is transformed in the browser, the user will see the phrase My Current\
    \ Books at the top of the page.\n\n+   Important When using an object in transformations,\
    \ all properties and methods must be retrieved using the XSLProcessor to understand.\
    \ String, Number, and Boolean values work as expected; returning any other value\
    \ will throw a JavaScript error when the transformation executes.\n\nThe next\
    \ useful feature of the XSLProcessor is the addParameter() method. Unlike sending\
    \ an object into a transformation, parameters are a standard part of XSL. To specify\
    \ a parameter, pass the name and value, like this:\n\n```\nvar XSLProcessor =\
    \ oXSLTemplate.createProcessor();\nXSLProcessor.input = oXMLDom;\nXSLProcessor.addParameter(\"\
    message\", \"My Book List\");\n```"
