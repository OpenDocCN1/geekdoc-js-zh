    The first line inside the method sets xhr equal to the stored XMLHttpRequest object.
    This is done for convenience and keeping the code clean. Next, you check to make
    sure that isn''t already a request waiting for a response. If the XMLHttpRequest
    object is ready to be used cleanly, its readyState will be 0; otherwise you must
    cancel the existing request (by calling abort()) before making another request.


    Because the data being sent to the server is to be JSON-encoded, you first need
    to create an object (oData) to hold the information. There are three pieces of
    information being sent: the table to get the data out of, the current value in
    the text box, and the maximum number of suggestions to retrieve (5). The maximum
    number of suggestions is important because it prevents long database queries from
    being executed repeatedly.


    Next, a request is opened to suggestions.php, the server-side component of the
    control. This request is asynchronous (last argument of open() is set to true),
    so it''s necessary to provide an onreadychange-event handler. The event handler
    checks to ensure that the readyState is 4, and then parses the returned text as
    a JSON array of values. This array, with the original itself, is passed back to
    the AutoSuggest via the outsetget().


    The last step in this method is, of course, to send the request. Since the request
    is being a POST, the data has to be passed into the send() method. The oData is
    first encoded into JSON before being sent.


    With that, the SuggestProvider class is complete. The only thing left to do is
    to write the suggestions.php file that uses the data.


    # The Server-Side Component


    In many ways, the server-side component for the autosuggest control is the most
    straightforward; it''s just a simple being executed from top to bottom, with no
    functions or methods to be considered. Note that this is a PHP page, all the code
    in this section must be contained within a PHP code block `<?php ... ?>`.


    The first part of the page is to set the content type to text/plain; indicating
    that this is a PHP file and shouldn''t be handled as anything. You can optionally
    specify a character set, but make sure that it is Unicode-compatible, such as
    UTF-8, since all characters are used in JavaScript. Here''s the line that assigns
    the content type:


    ```

    header("Content-Type: text/plain; charset=UTF-8");

    ```


    Next, include the PHP-library and create a new instance of the JSON object:


    ```

    require_once("suggestions.php");

    $JSON = new JSON();

    ```


    Normally when data is sent to a PHP page, you use $_GET, $_POST, or $_REQUEST
