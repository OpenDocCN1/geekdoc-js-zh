    </script>\n</head>\n<body>\n<div id=\"myWeather\"></div>\n</body>\n</html>\n```\n\
    \nThis new code adds another <script> element containing a function called init().\
    \ Inside this function, retrieve a reference to the <div> element with myWeather\
    \ as its ID. It is important to run init() during the onload event, as the browser\
    \ will not find the myWeather <div id=\"myWeather\">\"></div> element and will\
    \ not append the widget to it.\n\n# Creating a Web Search Widget\n\nThe most widely\
    \ used function of the Web is searching. It's not even an option: if you want\
    \ to find any information, the search engines of the Web are the places you have\
    \ to go to.\n\nWith the ever-expanding technology of the Web, conventional search\
    \ engines are opening the doors to more unconventional means to get the content\
    \ you desire. The first to jump onto the scene was Yahoo!'s YIQ service (http://y.search.yahoo.com/publisher/index.html).\
    \ This new service enables you to search from any web page, provided the page's\
    \ author includes it in their web page. It is"
  merge: -1
  pgno: 247
- img_proc: true
  md: "a service to provide related search results to the content at hand, giving\
    \ readers more information at their fingertips without leaving your page.\n\n\
    The Yahoo! IQ is a great idea, but it hasn't surfaced without criticism. The main\
    \ argument? It requires the use of Yahoo!'s JavaScript and you have to add a <form/>\
    \ element, meeting the Yahoo requirements, to perform the search. For many web\
    \ sites, it takes too much effort to provide the service. And after all, the results\
    \ are presented on the Yahoo! site, breaking away your web site.\n\nThankfully,\
    \ Yahoo is not the only search engine built into this \"provide search results\
    \ from your web site\". MSN Search (http://search.msn.com) provides a similar\
    \ service, it enables the web developer to control the look, feel, and implementation.\
    \ This makes it possible to subscribe to a particular search or add the results\
    \ to your page using Ajax methods.\n\n**Note** Google has yet to try this into\
    \ its new spin on \"search from your site\" technique, at the time of writing,\
    \ released Google BlogSearch (http://blogsearch.google.com), which provides results\
    \ returned in either RSS or Atom formats.\n\n# The Server-Side Component\n\nPerform\
    \ a search with MSN Search, and you'll see an orange XML image at the bottom of\
    \ the results page. Clicking this image takes you to a new page, giving you the\
    \ URL to subscribe to the search:\n\nhttp://search.msn.com/results.aspx?q=[SEARCHTERM]&format=rss\n\
    \nWith this, you can write the server-side code to retrieve the remote feed. For\
    \ the widget, you will use PHP to retrieve the search feed. The URL to request\
    \ information from the websearch.php?search=[SEARCHTERM]\n\nThere's only one variable\
    \ in the query string: `search`. Therefore, the application should look for this\
    \ query item. The code for the server-side application closely resembles that\
    \ of the NewsTicker widget.\n\n```\n<php\nheader(\"Content-Type: text/xml\");\n\
    header(\"Cache-Control: no-cache\");\n\nif ( isset($_GET[\"search\"])) {\n\t$searchTerm\
    \ = urlencode(stripslashes($_GET[\"search\"]));\n\t$url = \"http://search.msn.com/results.aspx?q=$searchTerm&format=rss\"\
    ;\n\n\t$xml = file_get_contents($url);\n\necho $xml;\n}?>\n```"
