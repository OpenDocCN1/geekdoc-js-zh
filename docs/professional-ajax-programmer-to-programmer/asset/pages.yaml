    \ fragment, making all the changes to the HTML DOM at once. With this final line\
    \ of code, parseBookInfo() is complete.\n\n# Tying it together\n\nThe body of\
    \ this web page is generated entirely by JavaScript. Because of this, the element\
    \ creation and insertion code must execute after the document is loaded. Remember,\
    \ parseBookInfo(oXml) is loaded, so the XML DOM object creation needs to execute\
    \ at the page load. Create a function called init() to house the XML DOM creation:\n\
    \n```\nfunction init() {\n    var oXmlDom = zXmlDom.document.createDocument();\n\
    \    oXmlDom.onreadystatechange = function () {\n        if (oXmlDom.readyState\
