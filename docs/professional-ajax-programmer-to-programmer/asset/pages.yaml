- img_proc: true
  md: "When defined as TRUE, as in the line above, a PHP error will simply show as\
    \ \"Server unable to respond.\" JPSpan errors will contain detailed information\
    \ in the error object's message, code, and name properties. If defined as FALSE,\
    \ extra information is available for all errors.\n\nThe second configuration option\
    \ allows even more information to be sent to the client:\n\n```\nif (!defined('JPSPAN_ERROR_DEBUG'))\
    \ {\n    define('JPSPAN_ERROR_DEBUG', FALSE);\n}\n```\n\nWhen JPSPAN_ERROR_DEBUG\
    \ is defined as TRUE, two additional properties are added to the error: file and\
    \ line. These properties carry the name of the PHP file from which the error was\
    \ thrown and line number where it occurred. This information could be used in\
    \ an attack against the web site, so the default value of FALSE causes these two\
    \ pieces of information to be hidden. It is extremely useful, however, to have\
    \ it to TRUE in a development environment.\n\n# Type Translation\n\nAny Ajax framework\
    \ has to cope with the problem of representing types from the server-side language\
    \ in JavaScript, and vice versa. The three main PHP pages, found in the JPSpan\
    \ subfolder, deal specifically with converting types between the two languages:\
    \ Serializer.php, Types.php, and Unserializer.php.\n\nSerializer.php contains\
    \ code that defines a global array\nJPSPAN_SERIALIZER_MAP contains an element\
    \ for each PHP type that can be represented in JavaScript. As you can see, there\
    \ are entries for all PHP types as well as ways of representing null and jpspan_error:\n\
    \n```\n$GLOBALS['_JPSPAN_SERIALIZER_MAP'] = array(\n  'string'=>array(\n    'class'=>'JPSpan_SerializedString',\n\
    \    'file'->NULL\n  ),\n  'integer'=>array(\n    'class'=>'JPSpan_SerializedInteger',\n\
    \    'file'->NULL\n  ),\n  'boolean'=>array(\n    'class'=>'JPSpan_SerializedBoolean',\n\
    \    'file'->NULL\n  ),\n  'double'=>array(\n    'class'=>'JPSpan_SerializedFloat',\n\
    \    'file'->NULL\n  ),\n  'null'=>array(\n    'class'=>'JPSpan_SerializedNull',\n\
    \    'file'->NULL\n  )\n)\n```"
  merge: -1
