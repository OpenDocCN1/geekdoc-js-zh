    # Hidden Form POST Requests


    The previous example used a GET request to retrieve information from a database.
    This was fairly simple because the customer ID could just be appended to the URL
    in a query string and sent on its way. But what if you need to send a POST request?
    This, too, is possible using the form technique, although it takes a little extra
    work.


    A POST request is typically sent when data needs to be sent to the server as opposed
    to a GET, which merely requests data from the server. Although GET requests can
    send extra data through the query string, some browsers can handle only up to
    52KB of query string information. A POST request, on the other hand, can send
    up to 2GB of information, making it ideal for most uses.


    Traditionally, the only way to send POST requests was to use a form with its method
    attribute set to post. Then, the data contained in the form was sent in a POST
    request to the URL'
