  md: "After creation of the processor, Its input property is assigned XmlDom, the\
    \ XML DOM object containing the XML document to transform. At this point, everything\
    \ the processor requires is in place, so all remains is the actual transformation\
    \ and the retrieval of the output:\n\n```\noXmlProcessor.transform();\ndocument.body.innerHTML\
    \ = oXmlProcessor.output;\n```\n\nUnlike transformNodes(), the transform() method\
    \ does not returning the result output as a string. To retrieve the output of\
    \ the transformation, use the output property of the XSLProcessor object. This\
    \ entire process requires much more coding than the transformNode() method and\
    \ yields the same result. Why not use this process?\n\nXML provides a few extra\
    \ methods that can be used in these transformations. The first is addObject().\
    \ This method adds a JavaScript object to the stylesheet, and can even call methods\
    \ and output values in the transformed document. Consider the following object:\n\
    \n```\nvar oBook = \"My Current Books\",\nmethodOne : function () {\n\talert(\"\
    Welcome to my Book List\");\n\treturn \"\";\n};\n```\n\nIf you wanted to use this\
    \ information in the transformation? Using the addObject() method, you can pass\
    \ in two arguments: the object and a namespace URI to identify it. So, to add\
    \ this object with a URI of \"http://my-object\", you can do the following:\n\n\
    ```\nvar oXmlDom = zXmlDom.createDocument();\noXmlDom.async = false;\noXmlDom.load(\"\
    books.xml\");\n```\n\n```\nvar oXslDom = new ActiveXObject(\"Msxml2.FreeThreadedDOMDocument.3.0\"\
    );\noXslDom.async = false;\noXslDom.load(\"books.xml\");\n```\n\n```\nvar oXslTemplate\
    \ = new ActiveXObject(\"Msxml2.XSLTemplate.3.0\");\noXslTemplate.stylesheet =\
    \ oXmlDom;\n```\n\n```\noXslProcessor.input = oXmlDom;\n```\n\n```\noXslProcessor.addObject(oBook,\
    \ \"http://my-object\");\n```\n\n```\noXslProcessor.transform();\ndocument.body.innerHTML\
    \ = oXmlProcessor.output;\n```"
