  md: "Now that you can select parts of the text box, it's time to implement the typesahead\
    \ functionality. To do this, a typeAhead() method is defined that accepts a single\
    \ argument: the suggestion to display in the textbox. The suggestion being passed\
    \ in is assumed to be appropriate (and must have at least one character). This\
    \ method does three things:\n\n+   1. It gets the length of the text already in\
    \ the text box.\n2. It places the suggestion into the text box.\n3. It selects\
    \ only the portion of the text the user didn't use using the information from\
    \ step.\n\nAdditionally, since typeface can be supported only in Internet Explorer\
    \ and Firefox, you should check to make sure one of both browsers is used before\
    \ then the selection be executed so not to interrupt the user's typing. Once again,\
    \ testing for the createTextRange() and setSelectionRange() methods of the text\
    \ box is to:\n\n```\nAutoSuggestControl.prototype.typeAhead = function (suggestion)\
    \ {\n  if (this.textbox.createTextRange ||\n      this.textbox.selectionRange)\
    \ {\n    var ilen = this.textbox.value.length;\n    this.textbox.value = suggestion;\n\
    \    this.selectRange(ilen, suggestion.length);\n  }\n};\n```\n\nWith this method\
    \ complete, you now need another method to call and pass it in the suggestion.\
    \ This is where the autosuggest() method comes in.\n\n# The autosuggest() Method\n\
    \nPerhaps the most important method in the control is autosuggest(). This single\
    \ method is responsible for receiving an array of suggestions for the text box\
    \ and deciding what to do with them. Eventually, this method will be used to implement\
    \ the full autuggest functionality (including drop-down suggestions), but for\
    \ now, it's used to implement ahead only.\n\nBecause autosuggest() will be an\
    \ array of suggestions, you have your pick as to which to use for the typesahead\
    \ value. It's recommended to use the first value in the array to keep it simple.\
    \ The problem is that there may not be suggestions for a value, in which case\
    \ an array may be returned. You shouldn't call typeAhead() if there are no suggestions,\
    \ so it's important to check the length of the array first:\n\n```\nAutoSuggestControl.prototype.autosuggest\
    \ = function (suggestions) {\n  if (suggestions.length > 0) {\n    this.typeAhead(suggestions[0]);\n\
    \  }\n}\n```\n\nBut where do the suggestions come from? It's actually the job\
    \ of the suggestion provider to call this method and pass in the suggestions.\
    \ Implementation of this feature is discussed later in the chapter.\n\n# Handling\
    \ Key Events\n\nOf course the autuggest functionality has to be tied to the text\
    \ box using events. There are three events that deal with keys: keydown,keypress,\
    \ and keyup. The keydown event fires whenever the user presses a key on the keyboard\
    \ before any changes occur to the text box. This obviously won't help with autuggest\
    \ because you need to know the full text of the text box; using this event would\
    \ mean being one keystroke behind. For the same reason,"
