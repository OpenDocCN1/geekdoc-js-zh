  md: '# Resources Used


    AjaxMail uses open source software libraries to achieve its functionality:


    +   - zXml Library: The cross-browser XML JavaScript library used throughout this
    book. Available at http://www.nczolone.net/downloads/


    +   - Douglas Crockford''s JSON JavaScript Library: The JavaScript JSON parser.
    Available at www.json.org.


    +   - PHPMailer: A PHP SMTP email sending solution. Available at http://phpmailer.sourceforge.net/


    +   - JSON-PHP: The PHP JSON library. Available at http://mike.teczno/json.html.


    +   - POPLIB: A PHP POP3 mail interface written by one of your authors, Jeremy
    McPease. Available at www.wdone.com/php/pop3lib.zip.


    Note that all these resources are included in the book''s example code downloads,
    available at www.wrox.com.


    # The Database Tables


    AjaxMail will need e-mails to be stored in the database, various tables must be
    created. If you have to create a new database on the MySQL server, you should
    create a database named AjaxMail. (You may use any other database that is already
    set up.) There are three tables to add: AjaxMailFolders, AjaxMailMessages, and
    AjaxMailAttachments.


    The first table, AjaxMailFolders, defines the various folders available in AjaxMail:


    ```

    CREATE TABLE AjaxMailFolders (

    FolderId int(11) NOT NULL auto_increment,

    Name text NULL,

    PRIMARY KEY (FolderId)

    );

    ```


    ```

    INSERT INTO AjaxMailFolders VALUES (1, ''Inbox'');

    INSERT INTO AjaxMailFolders VALUES (2, ''Trash'');

    ```


    Each folder in AjaxMail is assigned a FolderId (an autoincrement primary key)
    and a name. For the purposes of this chapter, there are only two folders: Inbox
    and Trash. You can feel free to add more to your own needs.


    The AjaxMailMessages table holds each e-mail information. In 11 columns: a unique
    identification name (autoincremented so you don''t need to worry about it), the
    different fields of an e-mail (To, From, Subject, and on), what folder it exists
    in (Inbox, Trash, and so on), whether the user has read the e-mail. You can create
    the table using the following SQL statement:


    ```

    CREATE TABLE AjaxMailMessages (

    MessageId int(11) NOT NULL auto_increment,

    ''To'' text NULL,

    CC text NOT NULL,

    BCC text NOT NULL,

    ```'
