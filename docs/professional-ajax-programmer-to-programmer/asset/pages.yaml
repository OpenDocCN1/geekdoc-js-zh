  md: '# Creating a Windows Service


    Now it''s time to move away from the specifications and theories to create a simple
    web service.

    The web service described in this section uses document-style SOAP requests and
    responses to implement the Math service described in the WSDL earlier in this
    chapter. Note that this process uses free tools available from Microsoft, which
    involve a little more work than if you were to use, say, Visual Studio .NET. The
    extra work you''ll do in this section will aid in your understanding of web services
    and could pay dividends in your development career should you go with an auto-generated
    service.


    # System Requirements


    To create this service, you will need three minimum requirements:


    +   - A Windows machine running IIS 5 or greater. This comes as standard on all
    XP Professional machines and on all servers from Windows 2000 onwards.

    - The .NET Framework must be installed on the machine running IIS. You will also
    need the .NET Software Development Kit (SDK) on the machine you are developing
    on. For purposes of this example, it is assumed that you are developing on the
    machine that has IIS (You can download the .NET Framework and the SDK from http://msmicrosoft.com/netframework/downloads/updates/default.aspx).

    - A text editor to write the code. This can be Notepad, which is standard on all
    Windows machines and is more adequate than for the purposes of this example (although
    a development editor that supports syntax highlighting is preferable).


    # Configuring IIS


    The first task is to create a home for your service. Go to Start>Administrative
    Tools and select Internet Information Services.(Alternatively, enter %systemroot%\System32\inetinfos.msc
    in the Start>Run box and click OK). Expand the tree on the left to find the Default
    Site node, and then right-click and choose New>Virtual Directory, as shown in
    Figure 6-1. This will bring up the Virtual Directory Creation Wizard, which guides
    you the name of the web service as seen by the client (see Figure 6-2).


    ![](img/b372374b4ba34adee418bd5ab6e01f7f_165_0.png)


    Figure 6-1'
  merge: -1
  pgno: 165
- img_proc: true
  md: '![](img/b372374b4ba34adee418bd5ab6e01f7f_166_0.png)


    # Figure 6-2


    Name the folder Math, and then click Next. On the next screen, browse to the standard
    IIS directory of C:\InetPub\wwwroot. Create a new folder, named Math, directly
    below this folder. Accept the defaults for the remaining screens of the wizard.
    When this is done, use Windows Explorer to create a new folder underneath Math
    named bin, which will hold the DLL once the service is built. Your hierarchy should
    now look like Figure 6-3.


    ![](img/b372374b4ba34adee418bd5ab6e01f7f_166_1.png)


    # Figure 6-3


    # Coding the Web Service


    The web service is creating quite simple. Its name is Math, and it implements
    the four basic arithmetic operations: addition, subtraction, multiplication, and
    division. These four operations each accept two parameters, defined as floats,
    and return a float as the result. The class itself will be coded in C#, and the
    web service will be published in ASP.NET.


    Create a new file in your text editor and add the following lines:


    ```

    using System;

    using System.Web;

    using System.Web.Services;

    ```


    This code doesn''t add any extra functionality, but it does save you from having
    to type fully qualified class names. Since you will be using several classes from
    these namespaces, it saves space to refer to them here.'
