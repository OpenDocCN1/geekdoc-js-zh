- img_proc: true
  md: 'other from client-server communication) and stored in a variable named sJSON.
    You now have a string of information, not an object and certainly not an object
    with two arrays. To transform it into an object, you can simply use the JavaScript
    eval() function, like so:


    ```

    var oCarInfo = eval("(\ + sJSON + ")")

    ```


    This example uses JSON text textes and then passes those strings into the eval()
    function, which acts as a JavaScript interpreter. The result of this operation
    is a JavaScript object identical to the oCarInfo object defined in the last section.
    You can access information in this object the exact same way:


    ```

    alert(oCarInfo.availableColors[0]); //outputs "red"

    alert(oCarInfo.availableDoors[1]); //outputs "d4"

    ```


    # Important


    It''s very important to include the extra parentheses around any JSON string before
    passing it into eval(). Remember, curly braces represent statements in JavaScript
    (such as used with the if statement). The only way the interpreter knows that
    the braces represent an object and not a statement is to look for an equals sign
    before it or for parentheses around it (which indicates that the code is an expression
    to be evaluated instead of a statement to be run).


    You can see the obvious benefits of using JSON as a data format for JavaScript
    communication: it takes the evaluation out of your hands and, therefore, grants
    you access to the information you need later.


    # JSON Encoding/Decoding


    As part of his work, Crockford created a utility that can be used to decode and
    encode between JSON and JavaScript objects. The source for this tool can be downloaded
    at www.croford.com/json.js.


    You may be asking yourself, "Didn''t I just learn to decode JSON using the eval()
    function?" The answer is yes, but there is an inherent flaw in eval(): it will
    evaluate any JavaScript code passed into it, not just JSON. This could be a huge
    security risk when dealing with enterprise applications. To deal with this, you
    use the JSON.parse() method defined in the aforementioned file, which will parse
    and convert JSON into JavaScript objects. For example:


    ```

    var oObject = JSON.parse(sJSON);

    ```


    Also provided with this is a way to convert JavaScript objects into a JSON string
    for transmission. There is no such built-in way to do this in JavaScript.) All
    you need to pass an object to JSON.stringify() method. Consider the following
    example:


    ```

    var oCar = new Object();

    oCar.doors = 4;

    oCar.color = "blue";

    oCar.year = 1995;

    oCar.drivers = new Array("Penny", "Dan", "Kris");

    ```


    This code outputs the following JSON string:


    ```

    {"doors":4,"color":"blue","year":1995,"drivers":["Penny","Dan","Kris"]}

    ```'
