  md: "The cur property stores the index of the current suggestion in the suggestions\
    \ array. By default, this value is set to -1 because there are no suggestions\
    \ initially. When the arrow keys are pressed, cur will change to the current suggestion.\
    \ The second added property, text, holds the current value of the text box and\
    \ changes to reflect what the user actually typed.\n\nAs cur, the highlighted\
    \ suggestion changes as. To encapsulate this functionality, a method called goToSuggestion()\
    \ is used. This method accepts only one argument, a number sign indicates which\
    \ direction to move. For instance, any number greater than 0 moves the selection\
    \ to the next suggestion; any number less or equal to 0 moves the selection to\
    \ the previous suggestion. Here's the code:\n\n```\nAutoSuggestionControl.prototype.goToSuggestion\
    \ = function (iDiff) {\n  var cSuggestionNodes = this.layer.childNodes;\n\n  if\
    \ (cSuggestionNodes.length > 0) {\n    var oNode = null;\n\n    if (iDiff > 0)\
    \ {\n      if (this.cur < cSuggestionNodes.length-1) {\n        oNode = cSuggestionNodes[++this.cur];\n\
    \      }\n    } else {\n      oNode = cSuggestionNodes[--this.cur];\n    }\n \
    \ }\n\n  if (oNode) {\n    this.highlightSuggestion(oNode);\n    this.textbox.value\
    \ = oNode.firstChild.nodeValue;\n  }\n} \n};\n```\n\nThis method begins by obtaining\
    \ the collection of child nodes in the drop-down layer. Since only <div> elements\
    \ containing suggestions are child nodes of the layer, the child nodes matches\
    \ the number of suggestions. This number can be used to determine if there are\
    \ any suggestions (in which case it will be greater than zero). If there are no\
    \ suggestions, the method needs not do anything.\n\nWhen there are suggestions,\
    \ a named variable oNode is created to store a reference to the suggestion node\
    \ to highlight, and the method checks to see which direction to go. If iDiff is\
    \ greater than 0, it tries to go to the next suggestion. In doing so, the method\
    \ first ensures that cur isn't greater than the number of suggestions minus 1\
    \ (because the index of the last element in a collection with n elements is n-1).\
    \ Assuming there is a next suggestion, cur is prefix incremented (meaning it assigns\
    \ its new value before the line it's on) to retrieve the node for the next suggestion."
