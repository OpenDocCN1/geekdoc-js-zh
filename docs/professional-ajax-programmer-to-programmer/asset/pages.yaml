  md: 'Note An ADODB.Recordset is a class that holds the result of a SQL select query.
    It has methods that enable users to scroll through the rows returned as well as
    properties that allow the names, types, and values of the different fields to
    be retrieved.


    The Recordset exposes a Boolean property, EOF, which stands for End of File. If
    this is not true, at least one row was returned; therefore, the success field
    of the address array is set to TRUE.


    The various fields of the recordset are added as members of the address array.


    Note You can add array members in PHP at you will; you do not need to specify
    any other information. You can add members indexed by integers, and you can specify
    the index or leave it blank in order to add the new value to the end of the array.


    Both the Recordset and Connection are closed to free up system resources, and
    $rs->close(); is returned:


