    # Creating a Weather Widget


    Weather information is popular to display both on the desktop and on the Web.
    Many applications and widgets are solely devoted to retrieving and displaying
    this information. Naturally, Ajax is well suited for this type of widget.


    # The Weather.com SDK


    The first step in creating this widget is locating a source of weather information.
    Probably the most popular is the Weather.com XML service. It is this information
    that you will use to create this widget.


    The use of the Weather.com XML service hinges upon the following guidelines. To
    use your XML feeds you must register for a license. To register, go http://registration.weather.com/registration/xmlop/step1/.
    After your registration, Weather.com will send you an e-mail with a link to the
    XML feed SDK and provide you your license key and partner ID.


    For web-based applications, you must limit how often you retrieve information
    from the service. As specified in the SDK documentation, the refresh rate for
    the Cached Conditions is 30 minutes; therefore, the server application must cache
    the retrieved information and only update it every 30 minutes. There are two ways
    to accomplish this:


    +   1. Create a smart thread that runs independently of the web and pulls the
    feed every 30 minutes. The application then uses the cached feed and never worries
    about the time between information pulls.

    2. With every page request, the application can keep track of the last time the
    feed was retrieved, and refresh of the data after 30 minutes have passed.


    Both architectures will serve this widget''s purpose. The first is ideal. Communication
    between the server and the remote host are the same in both situations; the smart
    thread requires only one file operation every half (writing the cached feed).
    Unfortunately, ASP.NET applications time out after 20 minutes of inactivity, which
    can result in old data. It is possible to change this behavior; however, it requires
    access to the machine.config file, and not everyone has access to that configuration
    file in their environment. Therefore, this widget will use the second solution.


