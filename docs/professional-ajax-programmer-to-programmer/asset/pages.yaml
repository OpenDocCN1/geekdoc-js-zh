  md: '# Chapter 6: Web Services


    # Overview


    When XML use began to take off just after the 2000, businesses, developers, and
    others looked for new ways to use it. The promise of separating content and presentation
    had been met, but how could this capability be capitalized on? The answer came
    in form of web services.


    Web services provide a way to exchange data between applications and servers.
    To facilitate this communication, web services use the Internet to send messages
    composed of XML data back and forth between a consumer (the application that uses
    the data) and a provider (the server that contains the data). This is not unlike
    traditional distributed computing models, such as CORBA, DCOM, and RMI, where
    methods are executed over a network connection. The major difference between web
    services is that the data being transmitted is XML text instead of a binary format.


    The promise behind web services is that having software components available,
    on demand, to any application in the world. Whether that be a web application
    or a traditional desktop application, it is possible to use the same service to
    perform the same task.


    # Related Technologies


    Web services aren''t a single technology or platform; in fact, they are a mixture
    of protocols, languages, and formats. And although several platforms have incorporated
    web services into their current offerings, there are still some basic parts that
    remain consistent.


    # SOAP


    SOAP is a combination of an XML-based language and any number of common protocols
    for transmitting this data. The SOAP specification describes an intricate language
    with numerous elements and attributes, intended to describe most types of data.
    This information can be transported over any number of protocols, but is most
    commonly sent over HTTP along with other traffic.


    > Originally an acronym for Simple Object Access Protocol, the specification now
    only goes by SOAP.


    There are two ways of using SOAP, the remote call (RPC) style and the document
    style.


    # RPC-Style SOAP


    The RPC style treats the web as though it were containing one or more methods
    (in the same way you use a local class to establish communication with a database).
    A request is made to the service detailing the method name to call and the parameters,
    if any. The method is executed on the server, and an XML response is dispatched
    containing the return value, if any message it went away. Imagine a web service
    that provides arithmetic operations: addition, subtraction, multiplication, and
    division. Each method takes two inputs and returns a result. An RPC-style request
    for the addition would look like this:


    ```

    <xml version="1.0" encoding="utf-8"?>

    <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope">

    <soap:Header xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/

    ```'
