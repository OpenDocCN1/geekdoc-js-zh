    \ a handler), then the onload() method is called. Use of this event will be seen\
    \ later in the chapter.\n\n# The User Experience\n\nThe user interface may be\
    \ the most important part of application: if the user cannot use the application,\
    \ there is no reason for the application to exist. FoxReader.NET was designed\
    \ to be easily used and understood by the user. In fact, it borrows heavily from\
