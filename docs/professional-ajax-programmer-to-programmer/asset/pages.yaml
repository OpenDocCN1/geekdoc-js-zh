  md: 'most important security restriction in the JavaScript paradigm is the same
    origin policy, which determines the servers a certain page is allowed to communicate
    with.


    An origin is considered a single domain, such as WWW.example.com, accessed through
    a single protocol, most often HTTP. The same origin policy states that any page
    loaded from this origin may access, download, and interact with any other page
    from the same origin. This is what enables the hidden frame to work: both frames
    from the same origin; they are allowed to communicate using JavaScript. If you
    try to load a frame from another origin, you will not be able to interact with
    that page or any scripting features of it. The intent is to prevent malicious
    programmers from getting information out of a legitimate page.


    The same origin policy also affects how XMLHttpRequest works. Using XMLHttpRequest,
    you cannot access any resource that is not from the same origin as the page running.
    This means that, by default, you cannot use a URL with http:// in the open() method;
    you can only use absolute or relative URLs from the same domain. If you need to
    access a URL located in a different origin, you must create a server-side proxy
    to handle the communication (see Figure 2-4)


    ![](img/b372374b4ba34adee418bd5ab6e01f7f_46_0.png)


    Figure 2-4


    Using a server-side proxy, the browser makes a request to the web server. The
    web server then contacts another web server outside of the domain to request the
    appropriate information. When your web server receives the response, it is forwarded
    back to the browser. The result is a seamless transmission of external data. You
    will be server-side proxies later in this process. Internet Explorer doesn''t
    explain an explicit origin policy. It relies on its own security zones to determine
    what and cannot be accessed. Pages belonging to the Internet security zone typically
    follow rules similar to the same origin policy, whereas those in the Trusted zone
    may be exempt.


    # Cache Control


    Whenever you are dealing with repeat calls to the same page, you should be concerned
    about browser caching. For unaware, web browsers tend to cache resources to improve
    the speed with which sites are downloaded and displayed. This can result in a
    tremendous speed increase over frequently visited sites, but can also cause problems
    for pages that change. If you are making several Ajax calls, you need to be aware
    that caching may cause you problems.


    The best way to deal with is to include a no-cache header on any data sent from
    the server to the browser. This can be done using the Cache-Control header, which
    should be set up as:


    ```

    Cache-Control: no-cache

    ```


    This tells the browser not to cache the data from the specific URL. Instead, the
    browser always calls a new version from the server instead of a saved version
    from its own cache.


    # Summary


    This chapter introduced you to several Ajax techniques for client-server communication.
    It began with an HTTP primer requests and responses. You learned about the'
