    \ 5000)\">\n```\n\nAfter a delay of 5 seconds, FetchCompletedTransactions is called\
    \ and the results returned to the transactionsCompleteCallback function. If there\
    \ is no error and data available, HTML is built up detailing the transaction's\
    \ ID, name, and status, and displayed to the user. The function then setTimeout\
    \ again, ensuring that the results are repopulated every 10 seconds.\n\n# Summary\
    \ of Ajax.NET\n\nProvided that you is already ready, Ajax.NET is extremely simple\
    \ to set up. It can handle most data types that you will need. And if you don't\
    \ like any of it, it is an open source framework, so you are free to examine how\
    \ it works and even write your own improvements.\n\n# Summary\n\nAll three of\
    \ the frameworks in this chapter have their strengths; the main factor in deciding\
    \ which one is almost certainly governed by what your web server is running at\
    \ the moment. All languages—PHP, Java, and NET—have myriad web-based resources\
    \ and books devoted to (although Java probably comes slightly ahead of the others\
    \ on this point). Ajax.NET scores highest for ease of use when it comes to making\
    \ methods available; adding one line to an existing procedure and one line in\
    \ the page handler is certainly very simple, with DWR there is no internal modification\
    \ of the class at all, enabling you to re-use classes from elsewhere more easily.\
    \ JSpan's strength lies in the fact that both it and JavaScript are weakly typed,\
    \ there is less effort involved in coercing types between the two languages."
