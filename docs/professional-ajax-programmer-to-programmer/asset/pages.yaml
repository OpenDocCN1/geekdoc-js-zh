  md: 'Content-Type: application/x-www-form-encoded

    Content-Length: 40

    Connection: Keep-Alive


    name=Professional%0Ajax&publisher=Wiley


    You should note few differences between a POST request and a GET request. First,
    the request line begins with POST or GET, indicating the type of request. You''ll
    notice that the Host and User-Agent headers are still there, along with two new
    ones. The Content-Type header indicates how the request body is encoded. Browsers
    often encode post data as application/x-www-form-urlencoded, which is the MIME
    type for simple URL encoding. The Content-Length header indicates the byte length
    of the request body. After the Connection header and the blank line is the request
    body. As most POST requests, this is made up of simple name-value pairs, where
    name is Professional Ajax and publisher is Wiley. You may recognize that this
    format is the same as that of query parameters on URL.


    As mentioned previously, there are other HTTP request types, but they follow the
    same basic format as GET and POST. The next step is to look at what the server
    sends back in response to an HTTP request.


    # HTTP Responses


    The format of an HTTP response, which is very similar to that of a request, is
    as follows:


    ```

    <status-line>

    <headers>

    <blank line>

    [response-body]>

    ```


    As you can see, the only real difference in a response is that the first line
    contains status information instead of request. The status line tells you about
    requested resource by providing a status code. Here''s a sample HTTP response:


    ```

    HTTP/1.1 200 OK

    Date: Sat, 31 Dec 2005 23:59:59 GMT

    Content-Type: text/html;charset=ISO-8859-1

    Content-Length: 122

    ```


    ```

    <html>

    <head>

    <title>Wrox Homepage</title>

    </head>

    <body>

    <!-- body goes here --

    </body>

    </html>

    ```


    In this example the status line gives an HTTP status code of 200 of OK. The status
    line always contains the status code and the corresponding short message so that
    there isn''s no confusion. The most common status codes are:


    +   - 200 (OK): The resource was found and is all well.'
