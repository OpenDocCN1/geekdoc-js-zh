  md: 'Because the server is responsible only for pulling and calling remote feels,
    it makes sense to have one ASP.NET page responsible for these operations. This
    page, called xml.aspx, will have a codebehind where a good deal of ASP.NET code
    is contained.


    **Note** Code-behind is a method for authoring web pages for the ASP.NET platform.
    Unlike inline programming, where the server-side code is interspersed with HTML
    markup (like PHP and ASP), codebehind enables you to remove all logic from the
    HTML code and place it in a separate class. This results in a clean separation
    of HTML and .NET programming language of choice.


    The entry point for the server-side is the Page_Load event handler, where a method
    StartFooReader() is called. It is in StartFooReader() where your code will be
    contained.


    The language for this project is C#, which is the language created for the .NET
    Framework.


    # Setting the Headers


    For this application, you must set a few headers. Headers in ASP.NET is a simple
    task:\ Response.ContentType = "text/xml"; Response.CacheControl = "No-cache";


    Headers are set with the Response object, which contains HTTP response information.
    Setting the MIME content type is imperative to the operation of the application.
    Mozilla-based browsers will not load your XML file unless the MIME specifies it
    as XML document, or "text/xml" is one of many types that do.


    It is also important to make sure that the data retrieved with XMLHttpRequest
    is not cached. Internet Explorer (IE) caches all data retrieved with XMLHttpRequest
    unless explicitly to the CacheControl header. If this header is not set, IE will
    use the cache data until the browser''s cache is dumped.


    # Getting the Remote Data


    To determine the feeds to display, FooReader.NET uses a proprietary XML document,
    feeds.xml, which contains a list of feeds that are available for the user to request.
    This file contains a set of <link> elements divided into sections by <section>
    elements. <link> element has a filename attribute which is similar to an id attribute
    in HTML; it must be unique, and it is identified by the <link>:


    ```

    <xml version="1.0" encoding="utf-8">

    <feeds>

    <section>

    <link name="News">

    <link name="Yahoo! Top Stories" filename="yahoo_topstories" href="http://rss.news.yahoo.com/rss/topstories"
    />

    </section>

    </feeds>

    ```


    The example shows a basic feeds list. A typical list can contain as many <section>
    and <link> elements as you desire. Note that <section> elements can be children
    of the root element, and <link> elements can only be contained in <section> elements.


    **Note** The name attribute of the <section> and <link> is displayed to the user
    in the feeds pane and is not used in any other operation.


    When requesting a feed, the value of the filename attribute is assigned to the
    xml variable in the query string.'
