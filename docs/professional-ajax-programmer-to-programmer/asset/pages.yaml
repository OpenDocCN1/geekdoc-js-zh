  md: "As you know now, the first two lines set the required headers that the browser\
    \ will handle the data correctly. The next line of code uses the `isset()` function\
    \ to determine whether the search key is present in the query string.\n\nThe search\
    \ term should go through a variety of functions to send a proper request to the\
    \ remote host. It is first passed to `stripsashes()` function. If magic quotes\
    \ are enabled in the PHP configuration (the default), any quote that reaches is\
    \ automatically escaped with a slash: \"search query\". The `stripsashes()` function\
    \ removes this escape, leaving only \"search query\". After the slashes/ then\
    \ goes to `urlencode()` function, which properly encodes characters to be used\
    \ in a query string. Spaces, quotes, and ampersands, are all encoded.\n\nIf the\
    \ search term does not go through these processes, the MSN server will return\
    \ a code 404: Bad Request.\n\nWhen search is ready for transmission, it is included\
    \ in the URL and stored in the `$url` variable. Finally, the `file_get_contents()`\
    \ function opens the remote file, reads the contents, and returns it as the `$xml`\
    \ variable, which is printed to the page using the echo command.\n\n# # The Client-Side\
    \ Component\n\nThe client-side code departs from the classes created earlier in\
    \ this chapter. Instead of creating a class and using instances of that, this\
    \ widget consists of a static object msnWebSearch:\n\n```\nvar msnWebSearch =\
    \ {};\n```\n\nHere, you use of object literal notation creating the `msnWebSearch`\
    \ object. You will use this object in the `onclick` event of an `HTMLElement`\
    \ in order to perform a search:\n\n```\n<a href=\"#\" onclick=\"msnWebSearch.search(event,\"\
    Professional Ajax\");\nreturn\nfalse;\"></a>\n```\n\nThis object exposes several\
    \ methods to get the search results and to draw and position the HTML to contain\
    \ the data. The first method to cover is `drawListBox()`, which draws the HTML.\
    \ The method draws list like:\n\n```\n<div class=\"ajaxnWebSearchBox\">\n  <div\
    \ class=\"ajaxnWebSearchHeading\">MSN Search Results\n    <a class=\"ajaxnWebSearchCloseLink\"\
    \ href=\"#\">X</a>\n  </div>\n</div>\n```\n\n```\n<div class=\"ajaxnWebSearchResults\"\
    >\n  <a class=\"ajaxnWebSearchLink\" target=\"_new\" />\n  <a class=\"ajaxnWebSearchLink\"\
    \ target=\"_new\" />\n</div>\n```\n\nThe result box is divided into two parts:\
    \ a heading and a results pane (see Figure 8-3). The heading tells the user that\
    \ this box contains results from an MSN search. It also contains an X, which will\
    \ close the box. The results pane contains block-style links, which opens a new\
    \ window when clicked."
