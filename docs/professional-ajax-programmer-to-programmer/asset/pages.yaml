  md: '# Creating an Autosuggest Box


    The best way to learn about any programming concept is to put it into a practical
    example. Google Suggest (located at www.google.com/webp?complete=1) is a very
    simple Ajax application that many programmers have spent time dissecting, analyzing,
    and re-creating. If you haven''t yet taken a look at the live application, please
    do so now; it will greatly aid you in your understanding of this example.


    Functionality such as, suggesting to the user values to type, has been around
    in desktop applications for some time. Google Suggest brought the idea to the
    Web and a lot of excitement when it did. It is mentioned earlier in the book,
    Google Suggest was really one of the early Ajax applications that developers excited
    about the concept. It seems to attempt to emulate the before suggestions and help
    understand Ajax.


    The example built in this section adds the selection of states or provinces in
    a personal information form. For those that deal with international customers,
    it is vital to include the state or province with the country. However, it''s
    not optimal to load every state and province in the entire world into a drop-down
    box for the user to select. It''s much easier to let the user typing, and then
    retrieve only those results that make the most sense. Autosuggest functionality
    is perfect for this case.


    # Functionality Overview


    Before building, it''s always helpful to understand exactly what you''re building.
    Anyone can say they are emulating the functionality of Google Suggest, but what
    does that mean? The example you build in this section has the following functionality:


    +   * Typeahead: As the user is typing, the rest of the text box fills with the
    best suggestion. As the user continues to type, the box automatically adjusts
    its suggestion. The suggested text always appears (highlighted). This should work
    no matter how fast the user types.


    +   * Suggestions list: Also as the user is typing, a drop-down list of other
    suggestions is displayed. These suggestions are generated automatically while
    the user types so that there is no discernible delay.


    +   * Keyboard controls: When the suggestions are displayed, the user is able
    to scroll up and down the list using the up and down arrows on the keyboard and
    select a suggestion. Press Enter enters the value into the text box and hides
    the suggestion list. The Esc can be used to hide the suggestions.


    +   * Hide suggestions: The drop-down suggestion list is small enough to hide
    itself whenever the text box is not used or when the browser is hidden.


    You probably didn''t realize that Google Suggest was doing so much. This is the
    key with Ajax: you don''t think about what''s going on because it works in an
    intuitive way.


