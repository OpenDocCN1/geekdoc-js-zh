    # Writing the Error Document


    One final method of the WeatherInfo class needs mentioning:_writeErrorDoc(). As
    stated before, this method writes a simple error document in XML to be used in
    the event the remote host cannot be contacted. It accepts one argument, a WebException
    instance:


    ```

    private string _writeErrorDoc(WebException exception)

    {

    XmlDocument xml = new XmlDocument();

    xml.LoadXml("<errorDoc/>");


    XmlElement element = xml.CreateElement("alert");

    element.InnerText = "An Error Occurred!";


    XmlElement messageElement = xml.CreateElement("message");

    messageElement.InnerText = exception.Message;


    xml.DocumentElement.AppendChild(element);

