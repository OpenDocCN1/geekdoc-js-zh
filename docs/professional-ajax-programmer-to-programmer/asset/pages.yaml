  md: "```\n<faultcode:soap:Client</faultcode>\n<faultstring>Server was unable to\
    \ read request.\nInput string was not in a correct format.\nThere is an error\
    \ in XML document (4, 13).\n</faultstring>\n<detail/>\n<soap:Fault>\n<soap:Body>\n\
    </soap:Envelope>\n```\n\nThe `<soap:Fault>` element, of which there can be only\
    \ one, gives a clause to the problem encountered. The most telling information\
    \ is contained in a `<code></code>. There are a limited number of options for\
    \ fault, which of the two ones are `soap:Server` and `soap:client`. A `soap:Server`\
    \ fault could indicate such a problem as the server being unable to connect to\
    \ a database. In this case, resending the message may well suffice. `soap:Client`\
    \ is specified, if other means the message is incorrectly formatted and will not\
    \ succeed without modification.\n\nA more-readable error message is signaled by\
    \ the `<faultstring/>` element, which contains application-specific details. If\
    \ a secondary system, such as a database, is the primary cause information pertaining\
    \ to this error may be returned in an optional `<factor/>` element (not shown\
    \ in this example).\n\n# Document-Style SOAP\n\nThe document style of SOAP relies\
    \ on XML schemas to design the format of the request and response. This style\
    \ is seeing gaining in popularity and some predict that it will eventually replace\
    \ the RPC style. With SOAP encoding, see http://microsoft.com/library/en-us/dnasm/html/argosoap.asp.\n\
    \nA document-style request may not look different from an RPC-style request. For\
    \ example the RPC request from the previous section could be a valid document-style\
    \ request by simply removing the `soap:encodingStyle` attribute. The difference\
    \ is that an RPC request always uses the same method name in a containing element\
    \ around its parameters; the document style request has no such constraints. Here's\
    \ an example that is\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<soap:Envelope\
    \ xmlns=\"http://schemas.xmlsoap.org/soap/envelope\">\n<soap:Body>\n<add xmlns=\"\
    http://www.wrox.com/services/math\" op1=\"4.5\" op2=\"5.4\" />\n</soap:Body>\n\
    </soap:Envelope>\n\nNote that the highlighted line contains the method name (add)\
    \ and two operands (op1 and op2) in a single element. This construct is not possible\
    \ with RPC-style requests. The document style has this flexibility because there\
    \ is an accompanying XML schema. A web service can use this XML schema to validate\
    \ the structure of the request; the service is free to use the information in\
    \ the request appropriately. Responses follow the same basic rules as requests:\
    \ \n\nWeb services created using Visual Studio .NET, are by default, in document\
    \ style (although this can be changed by applying various"
