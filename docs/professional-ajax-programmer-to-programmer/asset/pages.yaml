  md: "attributes to the underlying code).\n\nAt this point, you might be wondering\
    \ where the XML schema is kept and how it is made available to both the client\
    \ and the service. The answer to those questions lies in yet another abbreviation:\
    \ WSDL.\n\n# WSDL\n\nWeb Services Description Language (WSDL) is another XML-based\
    \ language that was created to describe the usage of a particular web service,\
    \ or how a particular service could be built. The resulting specification describes\
    \ an incredibly language, designed to be extremely flexible and allow for much\
    \ re-use as possible; it is the sort of document that is manually constructed\
    \ only by the most ardent enthusiast. Typically, a software tool is used for the\
    \ initial WSDL file creation and then tweaked, as necessary.\n\nThe following\
    \ is a WSDL file: describing a sample math service with a single add method (which\
    \ will be building):\n\n```\n<xml version=\"1.0\" encoding=\"utf-8\"?>\n<wsdl:definitions\n\
    \    xmlns:wsdl=\"http://schemas.xmlsoap.org/wsdl/\"\n    xmlns:soap=\"http://schemas.xmlsoap.org/wsdl/soap/\"\
    \n    xmlns:xs=\"http://www.w3.org/2001/XMLSchema\"\n    xmlns:tns=\"http://www.wrox.com/services/math\"\
    \n    xmlns:wsdl=\"http://schemas.xmlsoap.org/wsdl/\"\n    targetNamespace=\"\
    http://www.wrox.com/services/math\">\n\n  <wsdl:types>\n    <xs:schema elementFormDefault=\"\
    qualified\"\n        targetNamespace=\"http://www.wrox.com/services/math\">\n\
    \      <xs:element name=\"add\">\n        <xs:complexType>\n          <xs:sequence>\n\
    \            <xs:element minOccurs=\"1\" maxOccurs=\"1\" name=\"opl\" type=\"\
