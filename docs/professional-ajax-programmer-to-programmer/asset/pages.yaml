  md: "This small addition saves the user typed before asking for suggestions. This\
    \ will be very useful when dealing with the Esc key. With these two methods updates,\
    \ all that's left to make sure gotoSuggestion() gets called at the right time.\n\
    \nTo handle the up arrow, down arrow, Esc and Enter keys, a handleKeyDown() method\
    \ is necessary. Similar to handleKeyUp(), this also requires the event object\
    \ to be passed. And once again, you will need to rely on the event's key to tell\
    \ which key was pressed. The keys for up arrow, down arrow, Esc, and Enter keys\
    \ are 38, 40, 27, and 13, respectively. The handleKeyDown() method is defined\
    \ as follows:\n\n```\nAutoSuggestionControl.prototype.handleKeyDown = function\
    \ (oEvent) {\n  switch(oEvent.keyCode) {\ncase 38: //up arrow\n      this.gotoSuggestion(-1);\n\
    \      break;\ncase 40: //down arrow\n      this.gotoSuggestion(1);\n      break;\n\
    case 27: //esc\n      this.textbox.value = this.inputText;\n      this.selectRange(this.userText.length,\
    \ 0);\n      /* falls through **/\ncase 13: //enter\n      this.hideSuggestions();\n\
    \      oEvent.returnValue = false;\n      if (oEvent.preventDefault()) {\n   \
    \     oEvent.preventDefault();\n      }\n      break;\n  }\n}\n```\n\nWhen the\
    \ up arrow is pressed (key code 38), the gotoSuggestion() method is called with\
    \ an argument of -1, indicating that the previous selection should be selected.\
    \ Likewise, when down arrow is pressed (key code 40), gotoSuggestion() is called\
    \ with 1 as an argument to highlight the next suggestion. If Esc is pressed (key\
    \ code 27), there are a couple of things to do.\n\nFirst, you need to set the\
    \ text box value to the original text that the user typed. Second, you need to\
    \ set the selection of the text to be after the user typed so he or she can continue\
    \ typing. This is done by setting the range to the length of the text with a selection\
    \ of zero. Then, this falls through to the Enter's key (key code 13) which hides\
    \ the suggestions list. This, the code contains only one call to hideSuggestions()\
    \ instead of two. However, when the user presses the up or down arrows, the suggestion\
    \ is shown in the dropdown list. This means that when the Enter key is pressed,\
    \ you need only to hide the drop-down list of suggestions.\n\nFor both Esc and\
    \ Enter, you must also block the default behavior of the key press. It is important\
    \ to prevent unintended behavior, as the Enter key submitting the form when the\
    \ user just wanted to select the current suggestion. The default behavior is blocked\
    \ first by setting event.returnValue equal to false (for IE) and then calling\
    \ preventDefault() (if it's available, for Firefox)."
