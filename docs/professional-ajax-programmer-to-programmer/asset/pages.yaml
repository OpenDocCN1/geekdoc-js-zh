    ![](img/b372374b4ba34adee418bd5ab6e01f7f_113_0.png)


    Figure 4-3


    The second method of transformation in IE is a bit more involved, but it also
    gives you more

    control and features. This process involves creating multiple objects in the MSXML
    library. The

    first step in this lengthy process is to create a thread-safe XML DOM object,
    which the

    XSL stylesheet is loaded into:


    ```

    var XMLDom = zXMLDom.createDocument();

    XMLDom.async = false;

    XMLDom.load("books.xml");

    ```


    ```

    var XslDom = new ActiveX("Msxml2.FreeThreadedDOMDocument.3.0")

    XslDom.async = false;

    XslDom.load("books.xml");

    ```


    The FreeThreadedDOMDocument class is yet another ActiveX class and is part of
    the MSXML

    library. You must use the FreeThreadedDOMDocument class to create XSLTemplate
    objects,

    this example (the next example shows the creation of an XSLTemplate object). In

    ener versions of MSXML, every call to the transformNode() method forced a recompile
    of

    t XSL stylesheet allowing the transformation process considerably. With a

    FreeThreadedDOMDocument, the stylesheet is cached and ready to use until it''s

    removed from memory.


    After the XSL DOM object, you must create another ActiveX object, an XSL template:

    var XslTemplate = new ActiveX("Msxml2.XSLTemplate.3.0")

    XslTemplate.stylesheet = XslDom;


    The XSLTemplate class is used to create XSL stylesheets and create an XSLProcessor;
    so

    after the template is created, the XSL document is assigned to the XSLTemplate
    class''s

    stylesheet property, which caches and loads the XSL.


    The next step in this process is to create an XSLProcessor, which is created by
    calling the

    createProcessor() method of the XSLTemplate class:


    ```

    var XslProcessor = XslTemplate.createProcessor();

    XslProcessor.input = XslDom;

    ```'
