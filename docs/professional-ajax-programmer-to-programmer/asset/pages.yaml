  pgno: 20
- img_proc: true
  md: '+   304 (NOT MODIFIED): The resource has not been modified since the last request.
    This is used often for browser cache mechanisms.


    +   401 (UNAUTHORIZED): The client is not authorized to access the resource. Often,
    this will cause the browser to ask for a username and password to log in the server.


    +   403 (FORBIDDEN): The client failed to gain authorization. This typically happens
    if you fail to log in with a correct user and password after 401.


    +   404 (NOT FOUND): The resource does not exist at the location.


    Following the status line are some headers. Typically, the server will return
    a Date header indicating the date and time that the response was generated. Servers
    may also return some information about themselves, although this is not required).
    The next two headers should look similar, as the Content-Type and Content-Length
    headers in POST requests. Each header specifies an encoding of ISO-8859-1 (which
    is standard for the United English resources), the MIME type for HTML (text).
    The body of the response simply contains the HTML source of the requested resource
    (although it could contain plain text or binary data for other types of resources).
    It is that the browser displays to the user.


    Note that there is no indication as to the type of data requested for this response;
    however, this is of no consequence to the server. It is up to the client to know
    what kind of data be sent back for each type of request and to decide what data
    should be used.


    # # Ajax Communication Techniques


    Now that you understand the basics of how HTTP communication works, its time to
    look into enhancing communication from a web page. As you know, there are a lot
    of requests going back and forth between the browser and server while you are
    surfing the Web. Initially, all these requests happened because the user made
    an overt action that required such a step. Ajax techniques free developers from
    waiting to make such an action, allowing you to call to the server at any time.


    As discussed in Chapter 1, Ajax communication supports a number of different techniques.
    Each of these has advantages and disadvantages, so it''s important to understand
    which one to use in situation.


    # # The Hidden Frame Technique


    With the introduction of HTML frames, the hidden frame technique was born. The
    basic idea behind this technique is to create a frameset that is used for client-server
    communication. You can hide a frame by setting its width or height to 0 pixels,
    effectively removing it from the display. Although some browsers (such as Netscape
    4) couldn''t fully hide frames, often leaving borders thick, this technique again
    gained popularity among developers.


    # # The Pattern


    The hidden frame technique follows a very specific, four-step pattern (the first
    step begins with a visible frame, where the user is interacting with a web page.
    Naturally, the user is unaware that there is a frame (in modern browsers, it is
    not rendered) and gets interacting with the page as one totally. At some point,
    the user performs an action that requires additional data from the server. When
    this happens, the first step in the process occurs: a JavaScript function call
    is made to the hidden frame. This call can be as simple as redirecting the hidden
    frame to another page or as complicated as posting form data. Regardless of the
    intricacy of the function, the result is the second step in the process, a request
    made to the server.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '![](img/b372374b4ba34adee418bd5ab6e01f7f_22_0.png)


    # Figure 2-1


    The third step in the pattern is a response received from the server. Because
    you are dealing with frames, this might be another web page. This web page must
    contain the data requested from the server as well some JavaScript to transfer
    to the visible frame. Typically, this is done by assigning an onload event handler
    in the return web page that calls a function in the visible frame after it has
    been fully loaded (this is the fourth step). With the data now in the visible
    frame, it is up to that frame decide what to do with the data.


    # Hidden Frame GET Requests


    Now that the frame technique has been explained, it''s time to learn more about
    it. With any new technique, the best way is to work through an example. For this
    example, you''ll be creating a simple lookup page where a customer service representative
    can look up information about a customer. This is the first example in return
    about the customer. It is very simple: The user will enter a customer ID and receive
    information about the customer. This type of functionality will often be needed
    with a database, it is necessary to do some server-side programming as well. The
    example is written in PHP, an open source language, and MySQL (available at www.mysql.org),
    an open source database that ties together well with PHP.


    Although this is intended to be used with MySQL, you should be able to run it
    on other databases with little or modification.


    # Important


    First, customer data can be looked up, you must have a table to contain it. You
    can create the table by using the following SQL script:


    ```

    CREATE TABLE ''Customers'' (

    ''CustomerId'' int(11) NOT NULL auto_increment,

    ''Name'' varchar(255) NOT NULL default '''',

    ''Address'' varchar(255) NOT NULL default '''',

    ''City'' varchar(255) NOT NULL default '''',

    ''State'' varchar(255) NOT NULL default '''',

    ''Zip'' varchar(255) NOT NULL default '''',

    ''Phone'' varchar(255) NOT NULL default '''',

    ''E-mail'' varchar(255) NOT NULL default '''',

    PRIMARY KEY (''CustomerId'')

    ) TYPE=Sample Customer Data;

    ```


    The most important field in this table is CustomerID, which is what you will use
    to look up the customer information.


    Note You can download this script, along with some sample data, from www.wxyz.com.


    With the database table all set, it''s time to move on to the HTML code. To use
    the hidden frame technique, you must start with an HTML frameset, as like this:


    ```

    <frameset rows="100%,0" frameborder="0">

    ```'
