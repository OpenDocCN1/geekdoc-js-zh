    The createRequest() function, the XMLHttpRequest library itself, will be used
    throughout this book to aid in cross-browser handling of Ajax technologies.


    # # Using XMLHttpRequest


    After you have created an XMLHttpRequest object, you are ready to make HTTP requests
    from JavaScript. The first step is to call the open() method, which initializes
    the object. This method accepts three arguments:


    +   * **Request Type**: A string indicating the request type to be made — typically,
    GET or POST (these are the only ones currently supported by all browsers).

    * **URL**: A string indicating the URL to send the request to.

    * **Async**: A Boolean value indicating whether the request should be made asynchronously.


    The last argument, async, is important because it controls how JavaScript executes
    the request. When set to true, the request is sent asynchronously, and JavaScript
    code execution continues without waiting for the response; you must use an event
    handler to watch for the response. If async is set to false, the request is sent
    synchronously, and JavaScript waits for a response from the server before continuing
    code execution. That means if the response takes a long time, the user cannot
    interact with the browser until the response has completed. For reason, best practices
    around the development of Ajax applications favor asynchronous requests for short
    messages sent to and from the server.


    To make an asynchronous request to info.txt, you would start by doing:


    ```

    var oXmlHttp = zXMLHttpRequest.createRequest();

    XmlHttp.open("get", "info.txt", true);

    ```


    Note that the first argument of the request, the request type, is irrelevant even
    technically request types are defined as all uppercase.


    Next, you to define an onreadystatechange event handler. The XMLHttpRequest object
    has a property called readyState that changes as the request goes through and
    the response is received. There are five possible values for readyState:


    +   * **0 (Initialized)**: The object has been created but the open() method hasn''t
    been called.

    * **1 (Loading)**: The open() method has been called but the request hasn''t been
    sent.

    * **2 (Loaded)**: The request has been sent.

    * **3 (Interactive)**: A partial response has been received.

    * **4 (Complete)**: All data has been received and the connection has been closed.


    Every time the readyState changes from one value to another, the onreadystatechange
    event handler is called. Because of differences in browser implementations, the
    only reliable readyState values for cross-browser development are 0, 1, and 4.
    In most cases, you will check only for 4 to see when the request has returned:


    ```

    var oXmlHttp = zXMLHttpRequest.createRequest();

    XmlHttp.open("get", "info.txt", true);

    ```'
