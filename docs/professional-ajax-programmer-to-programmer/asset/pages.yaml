  md: "```\n<html>\n<head>\n  <link rel=\"stylesheet\" type=\"text/css\" href=\"books.css\"\
    \ />\n  <title>XSL Transformations</title>\n</head>\n<body>\n  <xsl:apply-templates\
    \ />\n</body>\n</html>\n</xsl:template>\n<xsl:template match=\"book\">\n  <div\
    \ class=\"varIsbn\">\n    <xsl:variable name=\"varIsbn\" select=\"@isbn\" />\n\
    \    <xsl:variable name=\"varTitle\" select=\"title\" />\n    <img class=\"bookCover\"\
    \ alt=\"${varTitle}\" src=\"${varIsbn}.png\" />\n    <div class=\"bookContent\"\
    >\n      <h3><xsl:value-of select=\"$varTitle\" /></h3>\n      Written by: <xsl:value-of\
    \ select=\"$author\" /><br />\n      ISBN # <xsl:value-of select=\"$varIsbn\"\
    \ />\n      <div class=\"bookPublisher\"><xsl:value-of select=\"$publisher\" /></div>\n\
    \    </div>\n  </div>\n</xsl:template>\n</xsl:stylesheet>\n```\n\nThis new template\
    \ matches all <book> elements, when the processor reaches each <book> in the XML\
    \ document, this template is used. The first two XSL directives in the template\
    \ are <xsl:variable/>, which defines variables.\n\nVariables in XSL are primarily\
    \ used in XPath expressions or attributes (where elements cannot be used without\
    \ breaking XML syntax). The <xsl:variable> has two attributes: name and select.\
    \ The select attribute specifies an XPath expression and stores the matching value\
    \ in the variable. After the initial declaration, variables are referred to by\
    \ the $ sign (the variable defined as varIsbn is later referenced as $varIsbn).\n\
    \nThe first variable, $varIsbn, is assigned the value of the <book> element's\
    \ attribute. The second, $varTitle, is assigned the value of the <title> element.\
    \ These two pieces of information are used in the attributes of the HTML <img>\
    \ element. To output variables in attributes, use the variable name in braces:\n\
    <img class=\"bookCover\" alt=\"${title}\" src=\"${varIsbn}.png\" />"
