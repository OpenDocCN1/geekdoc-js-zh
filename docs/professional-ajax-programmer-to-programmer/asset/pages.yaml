    \n# Simple and Complex Types\n\nThe Ajax.framework uses JavaScript Object Notation\
    \ (JSON), which you have seen in Chapter 7, to pass objects to the client. It\
    \ can cope with all the primitive types, such as integers, strings, and Boolean\
    \ values, and also has built-in support for some of the common .NET complex types,\
    \ such as ADO.NET dataset or datatable.\n\nAs an example of manipulating a dataset,\
    \ imagine you have called a function on your server-side class,MyClass.GetDataSet(callback)\
    \ that returns a dataset:\n\nYour callback function could then read values from\
    \ the dataset in the same manner as using it from within :NET:\n\n```\nfunction\
    \ callback(Response)\n{\n  if (Response.error)\n  {\n    alert(Response.error);\n\
