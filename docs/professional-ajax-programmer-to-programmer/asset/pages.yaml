  md: 'The main difference between a document-style message and an RPC-style message
    is that the document style sends the message as elements within the <soap:body>
    that can have whatever the sender and receiver agree upon using the embedded schema
    as a guide. An RPC-style message, however, has an element after the method being
    called. This in turn will have one element for each parameter the method accepts.


    The <soap:operation/> has two children, <wsdl:input> and <wsdl:output>, which
    are used to describe the request and response format. In this case, the <soap:body>
    specifies a use of literal. In practical terms, this is the only option with document-style
    services; RPC-style services the choice extends to encoded, in which case the
    <soap:body> would further specify which encoding type was be used for the parameter
    types.


    The final part of the document, <wsdl:service/>, defines how to call the service
    from a client. It also contains a human-readable description of the service and
    the <wsdl:port/> element, which references the Soap Binding in the last section.
    The most important element in this section is <soap:address/>, which contains
    the location attribute containing the URL needed to access the service.


    ```

    <wsdl:service name="Math">

    <wsdl:documentation>

    Contains a number of simple arithmetical functions

    </wsdl:documentation>

    <wsdl:port name="MathSoap" binding="tns:MathSoap">

    <soap:address location="http://localhost/Math/Math.asmx" />

    </wsdl:port>

    </wsdl:service>

    ```


    Looking at a WSDL file may be a bit daunting for new developers, but the good
    news is that you will probably never have to hand one code ever. In fact, the
    file in this section was created automatically by the .NET web service, which
    examines the underlying code and generates the XML.


    XML schemas are a web topic and a full discussion is outside the scope of this
    book. If you would like to learn more about XML schemas, consider picking up Beginning
    XML Schemas, 3rd Edition (Wiley Publishing, ISBN 0-7645-7077-3), or for a web
    tutorial, visit www.w3schools.com/schema/default.asp.


    # REST


    Representational State Transfer, often abbreviated as REST, represents a way of
    using the existing HTTP protocol to transmit data. Although mostly used for web
    services, REST can be used for any type of HTTP-based request and response systems
    as well. In regard to web services, REST enables you to call a URL in a specific
    format to return data (which will also be in specific format). This data may contain
    further information on how to retrieve even more data. The web service usage,
    the data will be returned as XML.


    For example, suppose Wrox would provide a way for others to retrieve a list of
    all authors. REST-style web services use simple URLs to access data; the Wrox
    Book could use this URL to retrieve the list of authors:


    +   * http://www.wrox.com/services/authors/


    This service may return an XML representation of the known authors with information
    on how to access details about each one:


    ```

    <xml version="1.0" encoding="utf-8" ?>

    <authors xmlns:xlink="http://www.w3.org/1999/xlinklink"

    ```'
