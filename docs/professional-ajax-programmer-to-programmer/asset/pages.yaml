  md: "```\nthrow new Error(\"An error occurred.\");\n\noXmlHttp.send(null);\n} catch\
    \ (oException) {\n  iFailed++;\n  downloadLinks();\n}\n```\n\nThis code is constructed\
    \ similarly to the previous example. The try...catch block is used to catch any\
    \ errors that may occur during the communication, and a custom error is thrown\
    \ when the status isn'200. The main difference is that when an error is caught,\
    \ the iFailed variable is incremented and downloadLinks() is called again. As\
    \ long as iFailed is less than 10 (meaning it's failing less than ten times),\
    \ another request will be fired off to the download.\n\nIn general, the Retry\
    \ Pattern should be used only when the request is intended to occur only once,\
    \ as in a Multi-Stage Download. If you try to use this pattern with interval requests,\
    \ such as Periodic Refresh, you could end up with an ever-increasing number of\
    \ requests taking up memory.\n\n# Summary\n\nIn this chapter, you learned about\
    \ various design patterns for Ajax solutions. You first learned how to use Predictive\
    \ Fetch to improve the user experience through preloading information that is\
    \ likely to be used in the future. You created an example using Predictive Fetch\
    \ to preload pages in an article after a few seconds, when it is likely that the\
    \ user intends to read the entire article.\n\nNext, you learned about Submission\
    \ Throttling, which is a way of incrementally sending data to the server instead\
    \ of doing it all at once. You learned how to use this pattern for data validation\
    \ in a form. It submitting, Periodic Refresh was also discussed, which periodically\
    \ receives information from the server. You built an example using Periodic Refresh\
    \ that displays a notification when a new comment has been posted to a blog or\
    \ message board.\n\nThis chapter also introduced you to the Multi-Stage Download\
    \ pattern, which is a way of continuing to download extra information after the\
    \ page has loaded. You learned that this would lead to faster initial download\
    \ time for pages and you can control the frequency and sequence of requests in\
    \ any way you see fit.\n\nThe last section discussed fallback patterns that are\
    \ used to handle errors in client-server communication. You learned that there\
    \ are two types of errors you may encounter: server errors (such as 404 not found)\
    \ or communication errors (where the server cannot be contacted). Two patterns,\
    \ Cancel Pending Requests and Try Again, were discussed as ways of dealing with\
    \ these errors."
