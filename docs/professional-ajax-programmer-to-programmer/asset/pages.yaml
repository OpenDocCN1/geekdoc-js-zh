    # About the Authors


    Nicholas C. Zakas has a BS in Computer Science from Merrimack College and an MBA
    degree from Endincott College. He is the author of Professional JavaScript for
    Web Developers as well as several other titles. Nicholas has worked in web development
    for more than five years and has helped develop solutions for some of the largest
    companies in the world. Nicholas can be reached through his web site at www.zczonline.net.


    Jeremy Peak has been tinkering with web development as in 1998. Currently working
    in the IT department of a school district, Jeremy has developing web solutions
    with JavaScript, PHP, and C#. He has written online articles covering topics as
    XSLT, WebForms, and C.


    Joe Fawcett started programming in the 1970s and worked briefly in IT after leaving
    fulltime education. He then pursued a more checked career before returning to
    software development in 1994. In 2003, he was awarded the title Microsoft Valuable
    Professional in XML for community contributions and technical expertise. Joe works
    in London as a developer for The Financial Training Company, which provides professional
