  md: 'The web.config file is an XML-based configuration file for a web application.
    The root element of web.config is <configuration/>, which is usually followed
    by the <system.web/> element. You can add the following line to the <system.web/>
    element: <identity impersonate="true"/>


    Bear in mind that this solution is highly situational and depends on the web server''s
    settings. However, it may solve unauthorized access errors you may encounter in
    a rented server environment.


    Once the application is tested and confirmed to work, you can edit feeds.xml to
    contain whatever feeds you desire.


    # Summary


    In this chapter, you learned the history of online syndication, including the
    rise of RSS and Atom as the two dominant XML formats for syndication. You also
    learned how RSS aggregators, such as FooReader.NET, make using news feeds much
    easier.


    This chapter walked through the creation and implementation of a web-based RSS/Atom
    aggregator, FooReader.NET. Starting with the client components, you learned how
    to create XParser, a JavaScript RSS/Atom parser that provides an easy to use interface
    for developers of web applications based on RSS and Atom. You also learned how
    XParser uses the XML DOM preset in Microsoft Internet Explorer and Mozilla-based
    browsers.


    You learned that the client-side components of a web application are a necessity
    to properly display data to the user, server-side components are needed to retrieve
    the necessary data. Using C# and the .NET Framework, you learned how to retrieve
    remote XML feeds, cache them, and output them to a page. You also learned how
    to set HTTP headers so that browsers will know what to expect, and remote servers
    know what is hitting them.


    Finally, you learned how to set up the application in IIS and test it to make
    sure it was properly installed.'
