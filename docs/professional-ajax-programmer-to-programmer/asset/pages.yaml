    # # Setup


    Generally, web applications are simple to set and up..NET web applications, however,
    require a few extra steps during setup.


    The first requirement in installing FooReader.NET is to make sure that Information
    Services (IIS) is installed on the machine. IIS is Microsoft''s web server and
    is only available for owners of Windows 2000 Professional, Windows 2000 Server,
    Windows XP Professional, and Windows 2003. Installing IIS requires the Windows
    CD and can be done in the Add/Remove Components section of the Add/Remove Programs
    Control Panel (Figure 5-3).


    ![](img/b372374b4ba34adee418bd5ab6e01f7f_150_0.png)


    # Figure 5-3


    You must also install the .NET Framework in order to run FooReader.NET. You need
    version 1.1 or greater. It is freely available at http://mdn.microsoft.com/net/framework/downloads/updates/default.aspx
    for users of Windows 98 and later.


    When IIS and the NET Framework are installed, create a folder called FooReader
    in IIS wwwroot directory, located at:\inetpub\ and move all FooReader.NET files
    and folders to the newly created FooReader folder. After the files have been placed
    in the FooReader directory, you need to register the application in IIS, which
    you can do in the IIS Management Console (see Figure 5-4). In the computer''s
    Control Panel (Start->Control Panel), double-click Administrative Tools, and then
    double-click the Internet Information Services icon.'
