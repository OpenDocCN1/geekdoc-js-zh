  md: "# Excluding Methods\n\nIf you want to provide access to a class but limit which\
    \ methods can be called, use the <exclude> element. For example, the following\
    \ excludes the toGMTString() method being called on the Date class:\n\n```\n<create\
    \ creator=\"new\" javascript=\"Date\">\n<param name=\"class\" value=\"java.util.Date\"\
    />\n<exclude method=\"toGMTString()\"/>\n</create>\n```\n\n# The Script Creator\n\
    \nSome objects cannot be set up by a simple call to a default constructor; they\
    \ may be accessible via the methods on another class or from a to static getInstance()\
    \ method. An example of this is the EmailValidator from the org.apache.commons.validator\
    \ package. This does not have a public constructor, but an instance can be obtained\
    \ by using the static method getInstance() on the class.\n\nTo create an EmailValidator,\
    \ use the version of the <create>\n\n```\n<create creator=\"script\" javascript=\"\
    EmailValidator\">\n<param name=\"language\" value=\"beanshell\"/>\n<param name=\"\
    script\">\nimport org.apache.commons.validator.EmailValidator;\n  return EmailValidator.getInstance();\n\
    </param>\n</create>\n```\n\nThe scripting language used here is beanshell, one\
    \ of the Scripted Framework (BSF) languages.\n\n> Important You can read more\
    \ on beanshell at www.beanshell.org/ and see other languages supported by BSF\
    \ at http://jakarta.apache.org/bsf/index.html\n\n# The Spring Creator\n\nThe Spring\
    \ framework (www.springframework.org) is designed to bring together a number of\
    \ Java technologies as well as enable practical code re-use and sophisticated\
    \ management of JavaBeans. It a lightweight replacement for parts of the Java\
    \ 2 Enterprise Edition (J2EE), is used to create highly scalable applications\
    \ where numbers of users are expected to be used by the system independently.\
    \ In these situations, resources memory need to be carefully managed.\n\nYou can\
    \ make use of these enterprises by using the spring creator:\n\n```\n<create creator=\"\
    spring\" javascript=\"MyBean\">\n<param name=\"beanName\" value=\"MyBean\"/>\n\
    <param name=\"location\" value=\"beans.xml\"/>\n</create>\n```\n\nThe Spring framework\
    \ and associated techniques are a huge topic. In addition to visiting the preceding\
    \ URL, you can read more about DWR and Spring at http://getahead.ltd.uk/dwr/server/spring."
