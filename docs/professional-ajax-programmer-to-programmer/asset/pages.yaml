    # # A Basic XML Example


    XML is a semantic, describing language. Generally. The elements contained in any
    given XML

    document describe the data of that document, making it a decent store for static

    information, or information that does not change.


    Imagine you are running an online bookstore and have a list of Best Picks which
    information is stored

    in an XML document, books.xml need to display this information to the user, but
    you want

    to so without using a server component, you turn to a JavaScript solution using
    the zXml library that will load the XML file, parse through it,

    and display the information in a web page using DOM methods.


    The books.xml file contains the following XML data:


    ```

    <xml version="1.0" encoding="utf-8"?>

    ```


    ```

    <bookList>

    <book isbn="0417777781">

    <title>Professional Ajax</title>

    <author>Nicholas C. Zakas, Jeremy Mepeak, Joe Fawcett</author>

    <publisher>Wrox</publisher>

    </book>

    ```'
