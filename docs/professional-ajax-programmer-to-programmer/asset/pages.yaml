    # FooReader.NET


    Syndication with RSS and Atom is about the sharing of information. In order to
    view information from different sources, an aggregator is used to assimilate the
    different feeds into one location. An aggregator makes it easier and faster to
    stay up-to-date with information collected around the Web (much easier than visiting
    several sites each day). The rest of this chapter focuses on the design and development
    of such an aggregator.


    FooReader.NET is a web-based, RSS/Atom aggregator from ForgetFoo''s Cold-Fusion-based
    FooReader (http://reader.forgetfoo.com/). With many conventional applications
    filling the aggregator, including e-mail applications, how you build a web-based
    RSS/Atom aggregator? Consider the following:


    +   - **The Web is cross-platform.** Building a web-based aggregator ensures that
    anyone with a modern browser can access it.


    +   - **The Web is centrally located.** One of the problems with conventional
    aggregators is installed on the computer is upkeep in many locations. If you need
    to syndicate feeds at work and at home, you must install an aggregator on each
    computer and load it with the appropriate feeds. A web-based aggregator eliminates
    this problem because any change to the feed is seen regardless of the user''s
    location.


    # Client-Side Components


    As described, the client-side components of an Ajax solution are in charge of
    presenting the data to the user and communicating with the server. For FooReader.NET,
    several client-side components are necessary to manage the overall user experience.


    +   - XParser, the JavaScript class responsible for requesting information and
    parses it when the data is received.


    +   - The user interface ties the user to their data. The user interface is essentially
    a web page, the usual suspects of web browser technologies are: HTML, CSS, and
    JavaScript.


    +   - The JavaScript code takes the information XParser and displays it to the
    UI


    > Note Although JavaScript has no formal definition of classes, it does have the
    logical equivalent. To aid in your understanding, this text refers to functions'
