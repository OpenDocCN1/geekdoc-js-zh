    # The Folder View


    The folder view is the first thing the user sees after the application is loaded.
    It consists of the title of the folder (Inbox or Trash), a pagination control
    that displays which messages are being displayed and the total number of messages,
    and a list of e-mails (see Figure 9-2). Taking a cue from Gmail, AjaxMail does
    not use table headers for the list of messages because people are accustomed to
    seeing e-mail by the person who sent, subject, and date.


    ![](img/b372374b4ba34adee418bd5ab6e01f7f_311_0.png)


    Figure 9-2


    You may notice that the traditional check box next to each e-mail is missing.
    That''s because there is only one thing you can do with an e-mail in Ajax: delete
    it. Instead of a check box, there is a red X next to each e-mail that can be clicked
    to delete it (move it to the Trash). When you switch to the Trash folder, the
    icons change to a green arrow that, when clicked, moves the e-mail back into the
    Inbox (see Figure 9-3).'
