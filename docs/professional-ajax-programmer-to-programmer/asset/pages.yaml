  md: "```\n<comp:address>\n<comp:ip>127.0.0.1</comp:ip>\n<comp:hostname>localhost</comp:hostname>\n\
    </comp:address>\n</addresses>\n```\n\nThis newly edited XML document defines two\
    \ namespaces: one with the prefix mail representing a mailing address, and the\
    \ other with a prefix of comp to represent a computer. Probably the first time\
    \ you noticed was the usage of the prefixes. Every element associated with a certain\
    \ address type is associated with the corresponding namespace, so every element\
    \ associated as a mailing address has the mail prefix while every computer-based\
    \ address has the comp prefix.\n\nThe use of namespaces avoids conflicts, and\
    \ XML processors now understand the difference between the two address types.\n\
    \nNamespaces in XPath add a slight complication when using selectSingleNode()\
    \ and selectNodes(). Consider the modified version of books.xml:\n<?xml version=\"\
    1.0\" encoding=\"utf-8\"?>\n\n```\n<book xmlns=\"http://site1.com\" xmlns:pub=\"\
    http://site2.com\">\n<book isbn=\"0471777781\">\n  <title>Professional Ajax</title>\n\
    \  <author>Nicholas C. Zakas, Jeremy Peak, Joe Fawcett</author>\n  <pub:name>Wrox</pub:name>\n\
    </book>\n<book isbn=\"0764579088\">\n  <title>Professional JavaScript for Web\
    \ Developers</title>\n  <author>Nicholas C. Zakas</author>\n  <pub:name>Wrox</pub:name>\n\
    </book>\n<book isbn=\"0764557599\">\n  <title>Professional C#</title>\n  <author>Simon\
    \ Robinson, et al</author>\n  <pub:name>Wrox</pub:name>\n</book>\n<book isbn=\"\
    1861006314\">\n  <title>GDI+ Programming: Creating Custom Controls Using C#</title>\n\
    \  <author>Eric White</author>\n</book>\n```"
