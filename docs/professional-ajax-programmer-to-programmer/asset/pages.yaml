  md: "![](img/b372374b4ba34adee418bd5ab6e01f7f_137_0.png)\n\nThis loading is caused\
    \ by a JavaScript function called toggleDiv(). It takes one argument, a Boolean\
    \ value that determines which one she shows:\n\n```\nfunction toggleDiv(bShow)\
    \ {\n  var toggleDiv = document.getElementById(\"loadingDiv\");\n  toggleDiv.style.display\
    \ = (bShow) ? \"block\" : \"none\";\n}\n```\n\n# Server-Side Components\n\nIn\
    \ a perfect world, a simple application as FooReader.NET. JavaScript would be\
    \ able to retrieve XML feeds across domains with XMLHttpRequest, and there would\
    \ be no need to make any calls to a server component. Because of the Internet\
    \ Explorer and Firefox restrictions, however, it is not possible to retrieve data\
    \ from a different domain; thus, server-side component is required.\n\n# Possible\
    \ Paradigms\n\nThe server's job in FooReader.NET is to retrieve the XML feeds\
    \ for the client to use. Following this model, there are two possible design paths\
    \ for the server; both will have their pros and cons.\n\nThe first method is a\
    \ cached feed architecture. The server program would act as a service, fetching\
    \ a list of feeds at a certain time, caching, and serving the cached feeds to\
    \ the client when requested. This option potentially saves bandwidth, but it also\
    \ risks the reader not having up-to-date feeds. More user action would be required\
    \ to display the current, up-to date feeds, which goes against the Ajax ideology.\n\
    \nThe second method is a demand on delivery architecture, where the server would\
    \ retrieve any given feed when the user requests it. This may use more bandwidth,\
    \ but it ensures the reader will have up-to-date information; moreover, this design\
    \ is inline with the Ajax concepts and is what user would expect.\n\n# Implementation\n\
    \nFooReader.NET uses the demand on delivery model, with an exception that a feed\
    \ is cached when it is fetched. The cached version is only used in the event that\
    \ the remote host cannot be contacted and an up-to-date feed cannot be retrieved.\
    \ This ensures that the user has something to read, even though it is older data."
