    \nFigure 10-4\n\n# Error Handling\n\nErrors can occur with any application, especially\
    \ when communication between separate machines is involved. JSPSpan has a means\
    \ of trapping non-fatal errors that occur when processing the server-side and\
    \ having them appear as standard client-side exceptions.\n\nThe server-side page\
    \ contains the following line:\nrequire_once JSPAN . 'ErrorHandler.php';\n\nErrorHandler.php\
    \ is a generic handler that can propagate non-fatal errors to the client; it can\
    \ handle PHP errors as well as those caused specifically by JSPSpan.\n\nIt allows\
    \ for two basic configuration settings. The first defines how much information\
    \ to give to the client when an error occurs directly as the result of the PHP,\
    \ not because of a JSPSpan method causing an exception:\n\n```\nif (!defined('JSPAN_ERROR_MESSAGES'))\
    \ {\n    define('JSPAN_ERROR_MESSAGES', TRUE);\n}\n```"
