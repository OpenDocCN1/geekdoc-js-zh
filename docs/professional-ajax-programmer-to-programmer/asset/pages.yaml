  md: '# Chapter 2: Ajax Basics


    The driving force behind Ajax is the interaction between the client (web browser)
    and the server. Previously, the understanding of this communication was limited
    to those who developed purely on the server-side using languages such as Perl
    and C. Newer technologies such as ASP.NET, PHP, and JSP encouraged a mix of client-
    and server-side techniques for engineers creating web applications, but they often
    lacked a full understanding of all client-side technologies (such as JavaScript).
    Now the pendulum has swung in the other direction, and client-side need to understand
    more about server-side technology in order to create Ajax solutions.


    # HTTP Primer


    Central to a good grasp of Ajax techniques is hypertext transmission protocol
    (HTTP), the protocol to transmit web pages, images, and other types of files over
    the Internet to your browser and back. Whenever you type a URL into the browser,
    "http://" is prepended to the address, indicating that you will be using HTTP
    to access the information at the given location. (Most browsers support a number
    of different protocols, most notably HTTP.)


    > Note: This section covers only aspects of HTTP that are of interest to Ajax
    developers. It constitutes an HTTP response guide or tutorial.


    HTTP consists of two parts: a request and a response. When you type a URL in a
    web browser, the browser creates and sends a request on your behalf. This request
    contains the URL you typed in as well as some information about the browser. The
    server receives this and sends back a response. The response contains information
    about the request as well as the data located at the URL (if any). It''s up to
    the browser to interpret the response and display the web page (or other resource).


    # HTTP Requests


    The format of an HTTP request is as follows:


    ```

    <request-line>

    <headers>

    <blank line>

    [request-body]>

    ```


    In an HTTP request, the first line must be a request line indicating the type
    of request, the resource to access, and the version of HTTP being used. Next,
    a set of headers indicate additional information that may be of use to the server.
    After the headers is a blank line, which can be followed by additional data (called
    the body).


    There are a large number of request types defined in HTTP, but the two of interest
    to Ajax developers are GET and POST. When you type a URL in a web browser, the
    browser sends a GET request for that URL, which basically tells the server to
    get the resource and send it back. Here''s what a GET request for www.wrox.com
    might look like:


    ```

    GET /HTTP/1.1

    Host: www.wrox.com

    User-Agent: Mozilla/5.0 (Windows; Windows NT 5.1; en-US; rv:1.7.6)

    cko/20050522 Firefox/1.0.1

    Connection: Keep-Alive

    ```


    The first part of the request line specifies that the request is a GET request.
    The second part of that line is a forward slash (/), indicating that it is for
    the root of the domain. The last part of the request line specifies to use HTTP
    version 1.1 (the alternative is 1.0). And where is the request sent? That''s where
    the second line comes in.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'The second line is the first in the request, Host. The Host header indicates
    the target of the request. Combining Host with the forward slash from the first
    line tells the server that the request is for www.rox.com/. The Host header is
    a requirement of HTTP 1.1; the version 1.0 did not require it. The User-Agent
    header, which is accessible to both server and client-side scripts is the cornerstone
    of browser detection. Information is defined by the browser that you are using
    (in this example, Firefox 1.0.1) and is automatically set on every request. The
    line is the Connection header, which is typically set to Keep-Alive for browser
    operations (it can also be set to other values, that are beyond the scope of this
    book). Note there is a single blank line after the last header. Even though there
    is no request body, the blank line is required.


    If you were to request a page under the www.rox.com domain, such as http://www.rox.com/books,
    the request would look like this:


    ```

    GET /books/rox.com

    Host: www.rox.com

    User-Agent: Mozilla/5.0 (Windows; UI Windows NT 5.1; en-US; rv:1.7.6)

    cko/200050225 Firefox/1.0.1

    Connection: Keep-Alive

    ```


    Note that only the first line changed, and it contains only the part that comes
    after www.rox.com in the URL.


    Sending parameters for a GET request requires the extra information to be appended
    to the URL itself. The format looks like:


    ```

    URL ? name=value&name=26..&name=valueN

    ```


    This information, called a query string, is duplicated in the line of the HTTP
    request, as follows:

    GET /books?name=Professional20Ajax HTTP/1.1

    Host: www.rox.com

    User-Agent: Mozilla/5.0 (Windows; UI Windows NT 5.1; en-US; rv:1.7.6)

    cko/200050225 Firefox/1.0.1

    Connection: Keep-Alive


    Note that the text "Ajax" had to be encoded, replacing the space with %20, in
    order to send it as a parameter to the URL. This is URL encoding, which is used
    in many parts of HTTP (JavaScript has built-in functions to handle URL encoding
    and decoding; these are discussed later in the chapter). The name-value pairs
    are separated by an ampersand. Server-side technologies will decode the request
    body and process these values in some sort of logical manner. Of course, it is
    up to the server to decide what to do with this


    > Important Browsers send many more headers than the ones discussed in this section.
    The examples here have kept short for simplicity.


    The POST request, on the other hand, provides additional information to the server
    in the request body. Typically, when you fill out an online form and submit it,
    that data is being sent through a POST request.


    Here''s what a typical POST request looks like:


    ```

    POST / www.rox.com

    Host: Mozilla/5.0 (Windows; UI Windows NT 5.1; en-US; rv:1.7.6)

    cko/200050225 Firefox/1.0.1

    ```'
