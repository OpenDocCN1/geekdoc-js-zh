    Setting up an event handler for the text box involves two steps: defining a function
    and assigning it as an event handler. The function is a method of the autuggest
    control, called handlerKeyup(). This method expects the event object to be passed
    in an argument (how to accomplish this is discussed later) so it can tell whether
    the key being pressed should enable autuggest functionality. Since keep fires
    for all keys, not just character keys, you''ll receive events when you use a cursor,
    the tab, and any other key on the keyboard. To avoid interfering with a text box
    works, suggestions should be made only when a character key is pressed. When the
    event object''s keyCode enters the picture:


    The Code property is supported by most modern browsers (Internet Explorer on Windows
    and Macintosh, Firefox, Opera, and Safari) and returns a numeric code representing
    the key that was pressed. Using this property, since the autuggest functionality
    should only happen when character keys are pressed, you need to set up behaviors
    for specific keys. You need to check this property for an appropriate value before
    proceeding. Believe it or not, the easiest way to do this is to detect the keys
    that you want to ignore. This approach is more efficient because there are more
    character keys than non-character keys. The following table displays the keys
    that could be ignored:


    | Key | Code | Key | Code |

    |---|---|---|--|

    | Backspace | 8 | Print Screen | 44 |

    | Tab | 9 | Delete | 46 |

    | Enter | 13 | F1 | 112 |

    | Shift | 16 | F2 | 113 |

    | Ctrl | 17 | F3 | 114 |

    | Alt | 18 | F4 | 115 |

    | Pause/Break | 19 | F5 | 116 |

    | Caps Lock | 20 | F6 | 117 |

    | Esc | 27 | F7 | 118 |

    | Page Up | 33 | F8 | 119 |

    | Page Down | 34 | F9 | 120 |

    | End | 35 | F10 | 121 |

    | Home | 36 | F11 | 122 |

    | Left Arrow | 37 | F12 | 123 |

    | Up Arrow | 38 | | |

    | Right Arrow | 39 | | |

    | Down Arrow | 40 | | |


    You notice a pattern among the key codes. It looks like all keys with less than
    or equal to 66 should be ignored and all keys between 112 and 123 should be ignored.
    This is generally true, but there is an exception. The space bar has a key code
    of 32, so you actually need to check to see if the code is less than 32, between
    33 and 46, or between 112 and 123. If it''s not in any of these groups, then you
    know it''s a character key.'
