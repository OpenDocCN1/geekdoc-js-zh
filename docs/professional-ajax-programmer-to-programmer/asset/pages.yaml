  md: '# Chapter 10: Ajax Frameworks


    # Overview


    In this chapter, you will see three frameworks that all have a common goal: to
    make the task of developing Ajax-enabled web sites easier and quicker. They all
    try to abstract the details concerning the underlying communications between the
    server and the client, leaving the developer free to concentrate on the more interesting
    aspects, such as implementing the classes that actually take care of the business
    logic peculiar to an application.


    The frameworks chosen use a different server-side processing technique: PHP, Java,
    and ASP.NET, respectively. They all fall into the category of frameworks known
    as Remote Invocation. This means that the framework is responsible only for providing
    client-side JavaScript that handles the complexities of XMLHttpRequest, converting
    parameters to a suitable format, and returning values to the page, usually through
    a callback function. This is in contrast to HTML/JS generation frameworks, which
    only require you to handcraft any code but allow less control over the request
    and response handling.


    This chapter focuses on three frameworks, many of which available:


    +   - JSPans: JSP integrates with PHP, a robust and open source server-side language.

    - DWR: DWR allows Java classes on the server.

    - Ajax.Net: Ajax.NET enables communication with server-side clients built with
    .NET language.


    The examples for each framework follow a common pattern: each demonstrates how
    to create a business object and call it asynchronously from an HTML client.


    > Note The business object is a class that represents a real-world entity and
    has the methods and properties necessary to working with it within an application.
    An example would be a Video class used in a Video store''s booking system. The
    Video class has properties such as title and cost, and methods such as isOverdue().


    The business object in our examples will represent a customer, a common class
    in many applications. In a real-life scenario, the Customer could contain many
    properties, such as the customer''s name, address, and how he or she has been
    a client, as well as methods as getOutstandingOrders().


    To make the examples more manageable and focus on the use of the frameworks, the
    Customer used in the examples is much simpler. It has only one method, getAddressFromEmail(),
    which returns the customer''s address given his her email address as parameter.


    > Note In a well-built application, the classes, representing real-world entities,
    are separate from the data, each dealing with the details to a permanent storage
    facility, such as a relational database. To keep the examples straightforward,
    the Customer itself will retrieving information from the database.


    # JSPans


    JSPans is an Ajax framework with the intention of integrating client-side JavaScript
    with serverside code written in PHP. PHP has been around since the nineties and
    has from simple beginnings to a full-fledged object-oriented language that can
    run on both Windows and UNIX/Linux platforms. The main advantages of using PHP
    over other platforms, such as Java or .NET, are that it is smaller, much simpler
    to install, and more lightweight, needing only a fraction of the memory of the
    Java runtime or the .NET CLR.'
