- img_proc: true
  md: 'and more content. This approach, while giving the user more information, also
    leads to slower download times as everything is loaded in seemingly random order.
    Frankly, there is an Ajax solution for this problem.


    Multi-Stage Download is an Ajax pattern wherein only the most basic functionality
    is loaded upon a paging. Once the page begins to download other components that
    should appear on the page. If the user leaves the page before all of the components
    are downloaded, it of no consequence. However, if the user stays on the page for
    an extended period of time (perhaps reading an article), the extra functionality
    is loaded in the background and when the user is ready. The major advantage is
    that you, as the developer, get to decide what is downloaded and at what point
    in time.


    This is a fairly new pattern and has been popularized by Microsoft''s start. When
    you first visit start, it is a very simple page with a search box in the middle.
    Behind the scenes, a series of requests is being fired off to fill in more content
    on the page. Within a few seconds jumps to life as content from different locations
    is pulled in and displayed.


    Although nice, Multi-Stage Download has a downside: the page must work in the
    simplest form for browsers that not support Ajax technologies. This means all
    the basic functionality must work without any additional downloads. The typical
    way of dealing with this problem is to provide graceful degradation, meaning that
    those browsers that support Ajax get the more extensive interface while others
    get a simple, bare-bones interface. This is especially important if you are expecting
    search engines to crawl your site; since these bots don''t support JavaScript,
    they rely solely on the HTML in the page to determine your site''s value.


    # Additional Information Links Example


    When reading an article, frequently there are Additional Information links included
    for reading on the topic. The key question is here: What is the main content?
    Clearly the article text is the main content on the page, so it should be downloaded
    when the page is initially loaded. The additional links aren''t as important,
    so they can be loaded later. This example walks you through the creation of a
    solution.


    First, you''ll need to lay out a page to hold the article. For example, it''s
    a very simple layout:


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD XHTML 1.0 Transitional//EN"

    http://www.w3.org/TR/DTD/xhtml-transitional.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml" lang="en">

    <head>

    <title>Article Example</title>

    <script type="text/javascript" src="zmxml.js"></script>

    <script type="text/javascript" src="Article.js"></script>

    <link rel="stylesheet" type="text/css" href="Article.css" />

    </head>

    <body>

    <h1>Article Title</h1>

    <div id="divAdditionalLinks"></div>

    <div id="divPage"></div>

    <!-- article content here --

    <div></div>

    </body>

    </html>

    ```'
