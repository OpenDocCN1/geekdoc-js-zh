  md: "```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\n<addresses>\n  <address>\n\
    \    <number>12345</number>\n    <street>Your Street</street>\n    <city>Your\
    \ City</city>\n    <state>Your State</state>\n    <country>USA</country>\n  </address>\n\
    </addresses>\n```\n\n```\n<address>\n  <ip>127.0.0.1</ip>\n  <hostname>localhost</hostname>\n\
    </address>\n</addresses>\n```\n\nThis document describes two types of addresses:\
    \ a physical mailing address and a computer address. While both addresses are\
    \ legitimate, handling this information requires different approaches, especially\
    \ since both <address> elements contain completely different elements. An XML\
    \ processor will not distinguish the difference between these two <address> elements,\
    \ so it is up to you to do. This is where namespaces come into play.\n\nNamespaces\
    \ consist of two parts: a namespaceURL and a prefix. Namespace identifies the\
    \ namespace. Generally,namespaceURLs are web sites, because they must be unique\
    \ to access different web sites. The prefix is a local name in the XML document\
    \ for the namespace. Every tag in the name uses the namespace prefix. The syntax\
    \ of namespace declarations is as follows:\n\n```\nxmlns:namespace-prefix=\"namespaceURI\"\
    \n```\n\nThe xmlns keyword tells the XML parser that a namespace declaration is\
    \ taking place. The namespaceprefix is the local name used in the elements that\
    \ fall under this namespace, and namespaceURI is the universal resource locator\
    \ that represents the prefix.\n\nNamespace declarations must appear before the\
    \ namespace is used in the XML document. Ideally, the root element contains the\
    \ namespace declarations:\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
    \n<addresses xmlns:mail=\"http://www.wrox.com/mail\"\n  xmlns:comp=\"http://www.wrox.com/computer>\n\
    ```\n\n```\n<mail:address>\n  <mail:number>12345</mail:number>\n  <mail:street>Your\
    \ Street</mail:street>\n  <mail:city>Your City</mail:city>\n  <mail:state>Your\
    \ State</mail:state>\n  <mail:country>USA</mail:country>\n</mail:address>\n```"
