  md: '# Chapter 5: Syndication with RSS/Atom


    The introduction of XML ushered in a new era of sharing information. Data sharing
    was difficult at best. Companies had their own proprietary transmission protocols
    and data formats, neither was available to the public. The idea of transmitting
    information on a web site using anything other than HTML was a strange, if unheard
    of, idea. This changed in 1998 when Microsoft introduced Explorer 4.0 with a new
    feature Active Channels. Built upon the Microsoft-developed Channel Definition
    Format (CDF), Active Channels allowed web sites to be adapted to users'' desktops
    for the everyday user. The problem with Active Channels, however, was its poor
    support for the bundled Desktop. Anyone could make a channel, but the industry
    lacked tools to create and manage CDF files. The primary users of Active Channels,
    big media companies, pushed users away with excessive ads that increased the bandwidth
    of channel used. Additionally, there was little add or perceived value in using
    Active Channels. The whole concept of syndication seemed to have died with Active
    Channels and the failure of CDF to reach recognition status from the World Wide
    Web Consortium. And then came RSS.


    # RSS


    In 1999, Netscape launched the My portal, a single page for users to visit for
    all their news. The idea was simple: to pull information from any number of sources
    and display them on My Nestle. To facilitate this, Danny of Netscape Communications
    developed RDF Site Summary (RSS), an XML data format based on the Resource Description
    Framework (RDF). It would later become known as RSS 0.9.


    Shortly after the introduction of RSS 0.9, Dave Weiner of Wonderland Software
    contacted Kathy regarding the RSS 0.9 format. When Weiner developed an XML format
    to use with his site, ScriptingNews, found that it RSS 0.9 could be combined and
    simplified to make a better, more usable format. Danny of Libby released a prototype
    of the new Web Site Summary (RSS), which became RSS 0.1. They then began using
    RSS 0.9 to continue until to 2001, when support for RSS feeds was dropped. Netscape
    lost interest in RSS and left it without an answer. What would splinter the RSS
    format into two different versions?


    A mailing list of deliverers and other interested parties formed in order to continue
    the development of RSS. This group, groups.yahoo.com/group/rss-dev/, produced
    a specification called RSS 1.0, in December 2000. RSS 1.0 was based on the original
    RDF Site Summary (RSS 0.9) and sought to extend it by modifying the original 0.9
    version. These modules are namespaces that can be created by anyone, allowing
    new functionality to be added without changing the specification. It''s important
    to note that RSS 1.0 is a derivative of RSS 0.9 but not related to RSS 0.91.


    At the same time, Weiner declared himself the owner of RSS and continued to develop
    his version, releasing what he called RSS 2.0 (Really Simple Syndication). This
    was based on RSS 0.1, the version Weiner and Libby developed together. The emphasis
    for RSS 2.0 was the simplicity of the format. When Weiner ended up working at
    Harvard, he assigned ownership of RSS 2.0 to Harvard''s Berkman Center for the
    Internet & Society, which now manages and publishes the specification at


    http://blogs.law.harvard.edu/tech/rss. RSS 2.0 is the most widely used RSS today.


    Note Today, the RSS encompasses three different versions of the RSS format: RSS
    0.9, RSS 1.0, and RSS 2.0.


    # RSS 0.1


    RSS 0.1 was based upon Document Type Declarations (DTDs) and was was possibly
    the most popular RSS version until the release of RSS 2.0. Some statistics show
    RSS 0.9 capturing 52 percent of the syndication market in 2001, with a steady
    increase until the introduction of 2.0'
