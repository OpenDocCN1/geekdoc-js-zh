  md: "To create an XML DOM in Firefox, the createDocument() method of the document.implementation\
    \ object is called. This method takes three arguments: the first is a string containing\
    \ the namespace URI for the document to use, the second is a string containing\
    \ the qualified name of the document's root element, and the third is the type\
    \ of document (also called doctype). To create an XML DOM, you can do this:\n\n\
    ```\nvar oXmlDom = document.implementation.createDocument(\", \"\", null);\n```\n\
    \nBy passing in an empty string for the first two arguments, and null for the\
    \ third, you ensure a completely empty document. In fact, there is no JavaScript\
    \ support for doctypes in Firefox, so the third argument must be null. To create\
    \ an XML DOM with document element, specify the tag name in the second argument:\n\
    \n```\nvar oXmlDom = document.implementation.createDocument(\", \"books\", null);\n\
    ```\n\nThis code creates an XML DOM whose element is <books>. You can take a step\
    \ further and specify a namespace in the creation of the DOM by specifying the\
    \ namespace URI in the first argument:\n\n```\nvar oXmlDom = document.implementation.createDocument(\"\
    http://www.sitel.com\", \"books\", null);\n```\n\nWhen a namespace is specified\
    \ in the createDocument() method, Firefox automatically assigns a prefix a0 to\
    \ represent the namespace URI:\n\n```\n<books xmlns:a0=\"http://www.sitel.com\"\
    \ />\n```\n\nFrom here, you can programmatically the XML document programmatically;\
    \ however, you will want to load pre existing XML documents into a blank XML DOM\
    \ object.\n\n# Loading XML Data in Firefox\n\nLoading XML into a DOM is similar\
    \ to Microsoft's approach with one glaring difference: Firefox supports the load()\
    \ method. Therefore, you can use the same code to load external XML data in both\
    \ browsers:\n\n```\noXmlDom.load(\"books.xml\");\n```\n\nAlso like Microsoft,\
    \ Firefox implemented the async property, and its behavior matches that of Microsoft's:\
    \ setting async to false forces the document to be loaded in synchronous mode;\
    \ otherwise the document is loaded asynchronously.\n\nAnother difference between\
    \ Firefox and XML DOM implementations is that Firefox does not support the readState\
    \ property or the onstatechange event handler. Instead, it supports the load event\
    \ and the onload event handler. The load event fires after the document is completely\
    \ loaded.\n\n```\noXmlDom.load(\"books.xml\");\noXmlDom.onload = function () {\n\
    \  //Do something when the document is fully loaded.\n};\n```\n\nAs mentioned\
    \ previously, the loadXML() method does not exist in the Firefox implementation;\
    \ however, it is possible to emulate the loadXML() behavior through the Firefox\
    \ DOMParser class. This class has a method called parseFromString(), which loads\
    \ a string and parses into a document:\n\n```\nvar sXml = \"<root><name>Jeremy\
    \ McPeake</name></root>\";\nvar oParser = new DOMParser();\nvar oXmlDom = oParser.parseFromString(sXml,\
    \ \"text/xml\");\n```"
