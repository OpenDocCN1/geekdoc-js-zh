  md: "In this code, a string of XML is created to pass to the DOMParser parseFromString()\
    \ method. The two arguments for parseFromString() are the XML string and the content\
    \ type of the data (typically set to \"text/xml\"). The parseFromString() method\
    \ returns an XML DOM object, which you can treat as XmlDom in this code.\n\n#\
    \ Retrieving XML Data in Firefox\n\nDespite their differences, IE and Firefox\
    \ share many properties and methods to retrieve XML data contained in the document.\
    \ In IE, you can retrieve the root element of the document using the documentElement\
    \ property, as:\n\n```\nvar oNode = oXmlDom.documentElement;\n```\n\nFirefox supports\
    \ the W3C standards of attributes, childNodes, firstChild, lastChild, nextSibling,\
    \ nodeName, nodeType, nodeValue, ownerDocument, parentNode, and previousSibling.\
    \ Unfortunately, Firefox does not support the Microsoft-proprietary text and XML\
    \ properties, but with its flexibility, you emulate emulate.\n\nAs a quick recap,\
    \ the text property returns the content of the node or the concatenated text of\
    \ the current node and its descendants. However, not only does it return the text\
    \ of the existing node, but also the text of all child nodes; this is easy enough\
    \ to implement. A simple function that takes an argument as can provide the result\
    \ as:\n\n```\nfunction getText(oNode) {\n  var sText = \"\"\n  for (var i = 0;\
    \ i < oNode.childNodes.length; i++) {\n    if (oNode.childNodes[i].hasChildren())\
    \ {\n      sText += getText(oNode.childNodes[i]);\n    } else {\n      sText +=\
    \ oNode.childNodes[i].nodeValue;\n    }\n  }\n  return sText;\n}\n```\n\nIn getText(),\
    \ sText is used to store every piece of text that is retrieved. As the for loop\
    \ iterates through the oNode, each child is checked to see if it contains children.\
    \ If it does, the childNode is passed to getText() and goes through the same process.\
    \ If no child exists, the nodeValue of the current node is added to the string\
    \ (for text nodes, this is just the string). After all children have been processed,\
    \ the function returns sText.\n\nThe IE property serializes all XML contained\
    \ in the current node. Firefox achieves the same result using the XMLSerializer\
    \ object. This object has a single method that is accessible using JavaScript\
    \ serializeToString(). Using this method, XML data is serialized:\n\n```\nfunction\
    \ serializeXml(oNode) {\n  var oSerializer = new XMLSerializer();\n  return oSerializer.serializeToString(oNode);\n\
    }\n```\n\nThe serializeXml() function takes an XML node as an argument. An XMLSerializer\
    \ object is created, and the node is passed to the serializeToString() method.\
    \ The result of this method, a string representation of the XML data, is returned\
    \ to the caller."
