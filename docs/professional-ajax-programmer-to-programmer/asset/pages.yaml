  md: '# Confusion and Controversy


    Despite the popularity of the term Ajax, it has been met with its fair share of
    dissenters and controversy. Some believe that Ajax is an aberration of what the
    Web was moving towards before Ajax entered the picture. The proponents of semantic
    HTML design, accessibility, and the separation of content and presentation were
    gaining ground and acceptance among developers, and some believe that the popularity
    of Ajax has pushed movement into the background. The belief of these critics is
    that creating presentation with JavaScript has turned it into a messy mix like
    the early days of server-side scripting. Many believe that accessibility will
    suffer if more developers turn to Ajax.


    Others have spent a significant amount of time dissecting Garrett''s article and
    disproving several assumptions that he made. For instance, the article mentions
    using XML and XMLHttpRequest repeatedly being the core of the Ajax model, but
    many of the examples he lists don''t use them. Gmail and Google Maps dont use
    either of these technologies; Google Suggest uses only XMLHttpRequest and JavaScript
    instead of XML for data exchange. Critics also point out that the explanation
    of Ajax in the article is completely misleading, citing several technologies that
    are not only unnecessary (such as XML and HTTP) but unlikely to be used in many
    cases (such as XSLT).


    Another argument suggests Garrett and Garrett''s Adaptive Path article is that
    it is merely a new name for a technique that has already been used for some time.
    With this type of data retrievalat enabled in Netscape Navigator 2.0, it really
    became more prominent in 2001-2002, with the explanation of an article on the
    Developer Connection site entered, "Remote Scripting with IFrames available at
    http://developer.apple.com/webcontent/iframe.html". This article is widely believed
    to be the first mainstream article published on Ajax-like methodologies. The term
    remote scripting never caught on with quite the power as Ajax.


    Still others at the term Ajax and Garrett''s article, believe that its creation
    was more than a marketing gimmick for Garrett''s company, Adaptive Path, LLC.
    Some believe that creating a name for a technique that already exists is disengenuous
    and clear sign of ill intent. Regardless of this and other controversies surrounding
    Ajax, the approach now has a name that developers are quickly becoming familiar
    with, and that comes a need for a deeper understanding and explanation that it
    may be used in the best possible ways.


    # Summary


    This chapter introduced to the basic premise of Ajax, Short for Asynchronous JavaScript
    + XML, the term Ajax was coined by Jesse James Garrett in an article posted on
    the Adaptive Path, LLC web site. The article introduced Ajax as a new user interaction
    model for applications in which full pages are no longer necessary.


    This chapter explored the evolution of the Web in relation to the development
    of technologies that enable Ajax to be a reality today. Ajax owes its existence
    to the introduction of both JavaScript and frames into web browsers, which made
    asynchronous data retrieval using JavaScript theoretically possible in Netscape
    Navigator 2.0. Throughout the evolution of new technologies, Ajax methodologies
    such as the hidden frame technique developed. The introduction of iframes and
    XMLHttp pushed Ajax development forward.


    Although Ajax can be used to accomplish many things, it is best to enhance the
    user experience rather than providing cool effects. This chapter discussed several
    Ajax principles, all circling back to the requirements of the user being paramount
    to anything else in application development.


    Several of the most popular Ajax applications were also discussed, including Google
    Suggest, Gmail, Google Maps, Yahoo!, and the Bitflux Blog.


    Finally, the chapter covered the controversy surrounding Ajax, Garrett''s article,
    and Ajax''s place on the Web. Some feel that the popularization of Ajax will lead
    to an overall lack of accessibility,'
  merge: -1
  pgno: 16
- img_proc: true
  md: whereas others question Garrett's motive for writing the now-famous article.
    As with all approaches, Ajax is at its best when used in a logical enhancement
    to a well-designed web application.
