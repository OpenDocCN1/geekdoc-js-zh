    With this, you can now use this example same way as the hidden POST example; the
    SaveCustomer.php page handles the data and calls saveResult() in the main page
    when completed.


    Note that the examples in this section have been simplified in order to focus
    on the Ajax techniques. If you were to use these in a real web application, you
    would need to provide more user feedback, such as disabling the frame while a
    request is being made.


    # Advantages and Disadvantages of Hidden Frames


    Now that you have the powerful things that you can do with hidden frames, it''s
    time to discuss the practicality of using them. As previously mentioned, this
    technique has been around for many years and is still used in many Ajax applications.


    One of the biggest arguments for using hidden frames is that you can maintain
    the browser history and enables users to use the Back and Forward buttons in the
    browser. Because the browser doesn''t know that a hidden frame is, in fact, hidden,
    it keeps track of all the requests made through it. Ajax application may not change,
    the changes in the hidden iframe mean that the Back and Forward buttons will move
    through the history of iframe instead of the main page. This technique is used
    in Gmail and Google Maps for this very reason.


    Be careful, because iframes do not store browser history. Whereas IE stores the
    history of iframes, Firefox does so only if the iframe was defined using HTML
    (that is, not created dynamically using JavaScript). Safari does not store browser
    history for iframes, regardless of how they are included in the page.


    The downside of hidden iframes is that there is very little information about
    what''s going on behind the scenes. You are completely reliant on the proper page
    being returned. If the hidden iframe page failed to load, there is no notification
    to the user that a problem has occurred; the main page will continue to wait until
    the appropriate JavaScript function is called. You may be able to provide some
    comfort to the user by setting a timer for a long period of time, maybe five minutes,
    and displaying a message if the page hasn''t loaded by then, but that''s just
    a workaround. The main problem is that you don''t enough information about the
    HTTP request that is happening behind the scenes. Fortunately, there is another
    option.'
