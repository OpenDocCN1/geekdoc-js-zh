    # Submission Throttling


    Predictive fetch is one for retrieving data from the server; the other side of
    an Ajax solution is sending of data to the server. Since you want to avoid page
    refreshes, the question of when to send user data is important. In a web site
    or web application, each click makes a request to the server so that the server
    is aware of what the client is doing. In the Ajax model, the user interacts with
    the site or application without additional requests generated for each click.


    One solution would be to send back to the server every time a user action occurs,
    similar to that of a traditional web solution. Then as the user types a letter,
    that is sent to the server immediately. This process is repeated for each letter
    typed. The problem with this approach is that it has the possibility to create
    a large number of requests in a short amount of time, which may not only cause
    problems for the server but may cause the user interface to slow down as each
    request is being made and processed. The Submission Throttling design pattern
    is an alternative approach to this problematic issue.


    Using Submission Throttling, you buffer the data to be sent to the client and
    then send the data at predetermined times. The Google Suggest feature does this
    brilliantly. It doesn''t send a request after each character is typed. Instead,
    it waits for a certain amount of time and sends all at once. The delay from typing
    to sending has been fine-tuned to the point that it does not feel like much of
    a delay either. Submission Throttling, in part, gives Google Suggest its speed.


    Submission Throttling typically begins either when the web site or application
    first loads or because of a specific user action. Then, a client-side function
    is called to begin the buffering of data. Every so, the user''s status is checked
    to see if he or she is idle (doing so prevents any interference with the user
    interface). If the user is still idle, data continues to be collected. When the
    user is idle, which is to say he is not performing an action, it''s time to decide
    whether to send the data. This determination depends on your use case; you may
    want to send data only when it reaches a certain size, or you may want to send
    it every time the user is idle. After the data is sent, the application continues
    to gather data until either a server response or some user signals to stop the
    data collection. Figure 3-2 outlines this process.'
