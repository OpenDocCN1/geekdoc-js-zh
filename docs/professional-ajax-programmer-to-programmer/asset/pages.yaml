    \ elements. Not only does this save lines of code (not to mention download), but\
    \ extra, unnecessary work for the client as well.\n\nThe classic-centric .NET\
    \ Framework inspires its design with three classes comprising the main XParserItem,\
    \ XParserElement, and XParserAttribute.\n\nStarting with the simplest class in\
    \ XParser, XParserAttribute is a representation of an element's attribute. Attributes\
    \ tend to have only one desired piece of data: and that is the only property of\
    \ XParserAttribute.\n\n```\nfunction XParserAttribute(oNode) {\n  this.value =\
    \ oNode.value;\n}\n```\n\nThe XParserAttribute constructor takes one argument,\
    \ the DOM attribute node. From this node, the attribute's value is accessed and\
    \ stored to the value property by the node's value property. Simple, eh?\n\nThe\
    \ XParserElement represents an XML element and is responsible for accessing and\
    \ retrieving the element's value and attributes. The class's constructor accepts\
    \ two arguments: the element's node and the value of that node.\n\n```\nfunction\
    \ XParserElement(oNode, sValue) {\n  this.node = oNode || false;\n  this.value\
    \ = sValue || (this.node && this.node.text) || false;\n```\n\nIn first few lines,\
    \ two of the four classes are set to the values of the parameters. Notice the\
