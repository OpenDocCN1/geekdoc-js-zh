  md: "Because there are five versions, and you presumably always want to use the\
    \ latest, it is helpful to support a function to determine which version to use.\
    \ Doing ensures you get the most up-to-date and the highest performance. The following\
    \ function, `createDocument()`, enables you to create the correct MSXML DOM document:\n\
    \n```\nfunction createDocument() {\n  var aVersions = [\"MSXML2.DOMDocument.5.0\"\
    ,\n\"MSXML2.DOMDocument.4.0\",\"MSXML2.DOMDocument.3.0\",\n\"MSXML2.DOMDocument\"\
    ,\"Microsoft.XmlDom\"];\n\n  for (var i = 0; i < aVersions.length; i++) {\n  \
    \  try {\n      var oXmlDom = new ActiveXObject(aVersions[i]);\n      return oXmlDom;\n\
    \    } catch (oError) {\n      //Do nothing\n    }\n  }\n\n  throw new Error(\"\
    MSXML is not installed.\");\n}\n```\n\nThis function iterates through the `a`\
    \ array, which contains the version strings of MSXML documents. It starts with\
    \ the latest version, `MSXML2.DOMDocument.5.0`, and attempts to create the DOM\
    \ document. If the object creation is successful, it is returned and `createDocument()`\
    \ exits; If it fails, an error is thrown and caught by the `try...catch` block,\
    \ the loop continues and the next version is tried. If the creation of an MSXML\
    \ DOM document fails, a thrown error states that MSXML is not installed. This\
    \ function is not a class, so its usage like any other function that returns a\
    \ value:\n\n```\nvar oXmlDom = createDocument();\n```\n\nUsing `createDocument()`\
    \ will ensure that the most up-to-date DOM document is used. Now you have an XML\
    \ DOM at your disposal, it is time to load some XML data.\n\n# # Loading MSXML\
    \ in IE\n\nMSXML supports two methods to load XML: `load()` and `loadXML()`. The\
    \ `load()` method loads an XML file at a specific location on the Web. With XMLHttp,\
    \ the `load()` method enables you to load data in two modes: asynchronously or\
    \ synchronously. By default, the `load()` method is asynchronous; to use synchronous,\
    \ the MSXML object's `async` property must be set to false, as follows:\n\n```\n\
    oXmlDom.async = false;\n```\n\nIn asynchronous mode, the MSXML object exposes\
    \ the `readyState` property, which has the five states as the XMLHttp `readyState`\
    \ property.\n\nAdditionally, the DOM document supports the `onreadystatechange`\
    \ event handler, enabling you to monitor the `readyState` property. Because asynchronous\
    \ is the default, setting the `async` property to `true` is it optional:\n\n```\n\
    oXmlDom.async = true;\n```"
