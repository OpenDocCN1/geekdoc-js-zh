  md: '![](img/b372374b4ba34adee418bd5ab6e01f7f_58_0.png)


    Figure 3-2


    The Submission Throttling pattern should never be used for mission-critical data.
    If information must be posted to the server within a specific amount of time,
    you are better off using a traditional form to ensure the correct and timely delivery
    of the information.


    # Incremental Form Validation Example


    As mentioned previously, Submission Throttling can be achieved through various
    user interactions. When using forms, it is sometimes useful to upload data incrementally
    as the form is being filled out. The most common usage is to validate the data
    as the user is filling in the form instead of waiting until the end to determine
    any errors. In this case, you would most likely use the onchange event handler
    of each form element to determine when to upload the data.


    The change event fires whenever a <select> element is selected; it for others
    when its value has changed and it has lost focus. For example, if you type a couple
    of letters to a text box and then click elsewhere on the screen (causing the text
    box to lose focus), the change event fires and the onchange event handler is called.
    If you click in the text box again and then click elsewhere (or press the Tab
    key), the text box will lose focus because no changes have been made. Using this
    event handler of Submission Throttling can prevent unnecessary requests.


    Normally, the form validation is simply a precursor to submission. The form''s
    submit button starts out disabled, enabled only when all fields have been validated
    by the server. For example, suppose you are running a web site where users must
    sign up to gain access to certain features. This may be a shopping site that requires
    sign-in to purchase items'
