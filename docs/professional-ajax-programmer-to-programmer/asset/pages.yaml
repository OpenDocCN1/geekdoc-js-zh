  md: "```\nblnRequestsEnabled = false;\n)\n\n```\n\nNow, when either of the two error\
    \ types occurs, an error will be thrown (either by the browser or by you) and\
    \ the blRequestsEnabled variable will be set to false, effectively canceling any\
    \ further requests if checkIf() called.\n\nYou may have noticed that for another\
    \ request is created only if the status is 200, which prevents another request\
    \ from occurring for any other status. That works for server errors, but it doesn't\
    \ do anything for communication errors. It's always better to have more than one\
    \ way to handle errors when they occur.\n\n# Try Again\n\nAnother option when\
    \ dealing with errors is to keep trying for a specified amount of time or a particular\
    \ number of times. Once again, unless the Ajax functionality is key to the user's\
    \ experience, there is no need to notify him or her about the failure. It is best\
    \ to handle the problem behind until it can be resolved.\n\nTo illustrate this\
    \ Retry pattern, consider the Multi-Stage Download example. In that example, extra\
    \ links were downloaded and displayed alongside the article. If an error occurred\
    \ during the request, an error message would pop up in most browsers. The user\
    \ would have no idea what the error was or what caused, why displaying a message\
    \ at all? Instead, it would make more sense to continue downloading the information\
    \ a few times before giving up.\n\nTo track the number of failed attempts, a global\
    \ variable is necessary:\n\n```\nvar iFailed = 0;\n```\n\nThe iFailed starts at\
