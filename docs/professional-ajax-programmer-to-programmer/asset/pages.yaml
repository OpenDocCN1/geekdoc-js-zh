  md: "Next, create a namespace called Wrox.Services and a class called Math that\
    \ inherits from System.Web.Services.WebService:\n\n```\nnamespace Wrox.Services\n\
    {\n    [WebService Description = \"Contains a number of simple arithmetical functions\"\
    ,n    Namespace = \"http://www.wrox.com/services/math\"]\n    public class Math\
    \ : System.Web.Services.WebService\n    {\n        //class code here\n    }\n\
    }\n```\n\nThe namespace keyword is used in a similar way as namespaces in XML;\
    \ it means the full name of the Math class is Wrox.Services.Math. Immediately\
    \ after the namespace definition is an attribute called Service, which marks the\
    \ class on the following line as a web service. Doing this enables extra functionality\
    \ for the class, as generating a WSDL file. You will also notice that a Description\
    \ parameter is included (and will also appear in the WSDL file).\n\nThen create\
    \ the class name, Math, which inherits from the base class of System.Web.Services.WebService.\
    \ Inheriting from this class means you don't need to worry about any specific\
    \ code for writing services; the base class handles all of them. You can simply\
    \ focus on writing the methods that will be published as part of the web service.\n\
    \nDefining a method to be used in a web service is as easy as writing a regular\
    \ method and tagging it with the special WebMethod attribute:\n\n```\n[WebMethod\
    \ Description = \"Returns the sum of two floats as a float\"]\npublic float add(float\
    \ op1, float op2)\n{\n    return op1 + op2;\n}\n```\n\nOnce, the code is very\
