    \ the first two panes are a fixed width while the third pane is fluid (Figure\
    \ 5-1).\n\n![](img/b372374b4ba34adee418bd5ab6e01f7f_135_0.png)\n\nFigure 5-1\n\
    \nThe first pane, called the feeds pane, displays the different feeds as links\
    \ that the user can click on. A <div> element with an id of divFeed in the feeds\
    \ pane allows the feeds list to be written to the document. Because this pane\
    \ is populated dynamically, only the containing elements are statically written:\n\
    \n```\n<div id=\"divFeedsPane\">\n  <div class=\"paneheader\">Feeds</div>\n  <div\
    \ id=\"divFeedList\"></div>\n</div>\n```\n\nWhen the user clicks on a feed, the\
    \ items are loaded into the middle pane: the items pane. This second pane has\
    \ two elements that are used to display information. The first is a <div> element\
    \ with an id of divViewingItem. This element displays two things to the user:\
    \ what they are currently reading and the document type (RSS or Atom). The second\
    \ element is another <div> whose id is set to divItemList. This element will contain\
    \ a list of <li>RSS elements or <entry/> Atom elements. Like the feeds pane, only\
    \ the containing elements are statically written to the page:"
