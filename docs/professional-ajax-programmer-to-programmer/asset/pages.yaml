  md: "This code adds the \"message\" parameter to the XSLProcessor. When the XSL\
    \ transformation executes, the processor uses the value of the parameter, \"My\
    \ Book List\", and places it in the appropriate location. Parameters in XSL use\
    \ the `<xsl:param/>` directive:\n\n```\n<xsl:param name=\"message\" />\n```\n\n\
    Notice that the name attribute matches the name in addParameter(). This parameter\
    \ receives the value \"My Book List\", which is retrieved using the variable syntax\
    \ you learned earlier:\n\n```\n<xsl:value-of select=\"$message\" />\n```\n\nIn\
    \ this example, the `<xsl:value-of/>` directive retrieves the parameters value.\
    \ The updated XSL stylesheet would look like this:\n\n```\n<xsl:stylesheet version=\"\
    1.0\"\nxmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\">\n```\n\n```\n<xsl:template\
    \ match=\"/\"/>\n```\n\n```\n<html>\n  <head>\n    <link rel=\"stylesheet\" type=\"\
    text/css\" href=\"books.css\" />\n  </head>\n  <body>\n```\n\n```\n<xsl:value-of\
    \ select=\"$message\" />\n```\n\n```\n<xsl:apply-templates />\n  </body>\n</html>\n\
    ```\n\n```\n</xsl:template>\n```\n\nThe updated stylesheet adds two new lines\
    \ of code. The first is the addition of the `<xsl:param/>` directive, and the\
    \ second is the `<xsl:value-of/>` that retrieves the value of the parameter. Parameter\
    \ declarations can exist anywhere in the XSL document. This code shows the parameter\
    \ declaration at the top of the document, but you are not limited to this location.\n\
    \nOne final feature of using an XSLProcessor is its speed; it compiles the XSL\
    \ stylesheet, so subsequent transformations using the same stylesheet result in\
    \ faster transformations (compared to using transformNodes()). To do this, use\
    \ the reset() method of the XSLProcessor object. This method clears the input\
    \ and output properties but not the stylesheet property. This readies the processor\
    \ for the next transformation with the same stylesheet."
