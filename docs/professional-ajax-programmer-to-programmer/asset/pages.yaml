- img_proc: true
  md: "In this code, an XPathEvaluator object is created and used to evaluate the\
    \ XPath expression book/author in the context of the document's root element.\
    \ Because the result type is ORDERED_NODE_ITERATOR_TYPE, the evaluation returns\
    \ a node set that you can iterate through using the iterateNext().\n\nThe iterateNext()\
    \ resembles the nextSibling property of a DOM node in that it selects the node\
    \ in the result set and returns null when the end of the result is reached. This\
    \ function allows you to use it in a while loop as in the previous example; as\
    \ long as oElement is not null, it is added to the aNodes array through the push()\
    \ method. Populating an array gives IE-like functionality; you can then use it\
    \ in a for loop or access separate elements.\n\n# Working with Namespace Resolver\n\
    \nIn the syntax of the evaluate() method, you use a reference to a namespace resolver.\
    \ A namespace resolver is a function that resolves any namespace prefixes in the\
    \ XPath expression to a namespace URI. The namespace resolver can be named any\
    \ name you want, but it requires a string argument (which is the prefix to check).\n\
    \nThe resolver checks the prefix provided by the argument and should return the\
    \ namespace URI associated with it. To use the values from the IE example, you\
    \ can write the following resolver:\n\n```\nfunction nsResolver(sPrefix) {\n \
    \   switch (sPrefix) {\n        case \"na\":\n            return \"http://site1.com\"\
    ;n            break;\n        case \"pub\":\n            return \"http://site2.com\"\
    ;n            break;\n        default:\n            return null;\n           \
    \ break;\n    }\n}\n```\n\nWith the resolver written, you can use the following\
    \ XPath expression on the modified books.xml document from the IE namespace example:\n\
    \n```\nvar sXPath = \"na:book/pub:name\";\n```\n\n```\nvar oEvaluator = new XPathEvaluator();\n\
    ```\n\n```\nvar oResult = oEvaluator.evaluate(sXPath, oXmlDom.documentElement,\
    \ nsResolver, XPathResult.ORDERED_NODE_ITERATOR_TYPE, null);\n```\n\n```\nvar\
    \ aNodes = new Array();\n```\n\n```\nif (oResult != null) {\n```"
