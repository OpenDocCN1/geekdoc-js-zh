    \ parameter will become part of the generated WSDL file. Although you can write\
    \ as many methods as you'd like, here is the complete code for this example, including\
    \ the arithmetic methods:\n\n```\nusing System;\nusing System.Web;\nusing System.Web.Services;\n\
    ```\n\n```\nnamespace Wrox.Services\n{\n```\n\n```\n\\[WebService Description\
    \ = \"Contains a number of simple arithmetical functions\",\n    Namespace = \"\
    http://www.wrox.com/services/math\"]\n    public class Math : System.Web.Services.WebService\n\
    \    \n```"
