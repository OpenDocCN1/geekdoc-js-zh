  md: '# Chapter 3: Ajax Patterns


    # Overview


    Design patterns describing techniques to solve common problems. Given that programming
    has been around for several decades, chances that many of the problems you face
    every day have been solved by someone else. Since the mid-1990s, a lot of attention
    has been drawn to design patterns as a way to cut development time.


    Even though the term Ajax has been around only since the late 1990s, giving rise
    to several Ajax patterns that solve specific problems. You''ve already seen some
    of these patterns in action, namely the hidden frame technique and asynchronous
    XMLHttpRequest. These are communication patterns between the client and server
    using JavaScript. As you may expect, there are many more types of patterns


    Author and programmer Michael Makhoff was the first to document Ajax patterns
    at his site, www.ajaxpatterns.org. The patterns presented in this chapter are
    a mixture of Makhoff s and others that you have identified. Design patterns, described
    on a web site or in a book, can never be identified, only accepted. Design patterns
    are not to but but solutions that have worked previously. It is up to the development
    community to generate "collective wisdom" around patterns; it is up to the individual
    developer to decide whether to implement a given pattern in his or her own application.


    # Communication Control Patterns


    You already know, from Chapter 2, how to communicate with the server using JavaScript.
    The real question is: What is the best way to initiate and continue to make requests
    to the server? In some cases, it may be best to retrieve information from the
    server so that it is available immediately upon some action. In other cases, you
    may want to send data to, or receive data from, the server at intervals. Everything
    shouldn''t be downloaded at once, and instead be downloaded in a sequence. Ajax
    allows you fine granularity in controlling the communication between client and
    server to achieve your desired behavior.


    # Predictive Fetch


    In a traditional web solution, the application has no idea of what to come next.
    A page is presented with any number of links, each one leading to a different
    part of the site. This may be termed based on demand."where the user, through
    his or her actions, tells the server what data should be retrieved. While this
    paradigm governs the Web since its inception, it has the unfortunate effect of
    forcing the start-and-stop model of user interaction upon the user. With help
    of Ajax, this is beginning to change.


    The Predictive Fetch pattern is a relatively simple idea that can be difficult
    to implement: the Ajax application questions what the user is going to get and
    retrieves the appropriate data. In a perfect world, it would be wonderful to know
    what the user is going to do and make sure the next data is available when needed.
    In reality, however, determining future user action is a guessing game depending
    on your intentions.


    There are simple cases where predicting user action is easiest. Suppose you are
    reading an article that is separated into three pages. It is logical that if you
    are interested in reading the first page, you''re also interested in reading the
    second and third page. If the first page has been loaded for a few seconds (which
    can be easily determined by using a timeout), it is probable to download the second
    page in the background. Likewise, if the second page has been loaded for a few
    seconds, it is logical to assume that the reader will continue on to the third
    page. As this extra data is being loaded cached on the'
