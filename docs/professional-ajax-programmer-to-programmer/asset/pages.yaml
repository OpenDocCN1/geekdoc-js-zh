  md: '# Introduction to XPath


    An XPath expression consists of two parts: a context and a selection pattern.
    The context node is the context from which the selection pattern begins. Referring
    to books.xml from the previous section, consider this XPath expression:


    ```

    book/author

    ```


    If this were expressed at the root level (its context), all <author> nodes would
    be returned because the <book> element is a child of the document element and
    contains an <author/> element. This expression is not very specific, as all <author/>
    elements are returned.


    If you want to retrieve only the <book> element that has a specific ISBN? The
    XPath expression would look like this:


    ```

    book[@isbn=''0471777781'']

    ```


    The book part of the expression describes which to retrieve. Inside of the square
    brackets is a condition this element must match. The @isbn part represents the
    isbn attribute (which is short for attribute). This expression reads "find the
    book elements that have an isbn attribute of ''0471777781''.


    XPath expressions can also be more complex. Consider the following expression:


    ```

    book[contains(text(), ''McPeak'')]

    ```


    This expression reads, "Find the book elements that contain the string ''McPeak''.
    Since this is a more complicated expression, it helps to break it down, working
    from the outside to the inside. Removing all conditions, you have this expression:


    ```

    book...

    ```


    First, now you are looking for a book element with a child <author> element which
    will be returned if it is the outermost element; next the conditions. Inside the
    first set of brackets, you notice the <author/> element:


    ```

    author...

    ```


    Now you know you are looking for a book element with a child <author> element
    need to be checked as well because the expression doesn''t end there:


    ```

    contains(text(), ''McPeak'')

    ```


    The contains() function takes arguments and returns true if the first argument
    contains the second argument. The text() function returns all the text in the
    context, the text contents of the <author/> element are passed as the first argument
    in contains(). The second argument is the search text, in this case ''McPeak''.


    Important Note that the contains() function, like all XPath functions, is case-sensitive.


    The resulting set is one <book/> element, because there is only one book with
    an author (or coauthor) whose name is McPeak.


    As you can see, XPath is a useful language that makes finding specific nodes in
    XML data rather simpler. It is no wonder Microsoft and Mozilla implemented XPath
    in their browsers for client-side use.'
