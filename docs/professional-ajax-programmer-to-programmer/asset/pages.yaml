  md: '# Introduction


    With recent advances in JavaScript, web developers have been able to create an
    unprecedented user experience in web applications. Breaking free of the "click-and-wait"
    paradigm that has dominated the web since its inception, developers can now bring
    features formerly reserved for desktop applications onto the web using a technique
    called Ajax.


    Ajax is an all-encompassing term surrounding the use of asynchronous HTTP requests
    initiated by JavaScript for the purpose of retrieving information from the server
    without reloading the page. These requests may be executed in any number of ways
    and using any number of different data transfer formats. Combining this method
    data retrieval with the interactivity of the Document Object Model (DOM) has bred
    a new generation of web applications that defy all the traditional rules of what
    can happen on the web. Big companies such as Google, Yahoo and Microsoft have
    moved towards the goal of creating web applications that look and behave like
    desktop applications.


    This book covers the various aspects of Ajax, including the different ways you
    can initiate HTTP requests to the server and the different formats that can be
    used to carry data back and forth. You will learn Ajax techniques and patterns
    for executing client-server communication on your web site and in web applications.


    # Whom This Book is For


    This book is aimed at two groups of readers:


    +   - Web application developers looking to enhance the usability of their web
    sites and web applications.

    - Intermediate JavaScript developers looking to further understand the language.


    In addition, familiarity with the following related technologies is a strong indicator
    that this book is for:


    +   - XML

    - XSLT

    - Web Services

    - PHP

    - C#

    - HTML

    - CSS


    This book is not at beginners without a basic understanding of the aforementioned
    technologies. Also, a good understanding of JavaScript is vitally important to
    understanding this book. Readers who do not have this knowledge should instead
    refer to books such as Beginning JavaScript, Second Edition (Wiley Publishing,
    ISBN 0-7645-5587-1) and Professional JavaScript for Web Developers (Wiley Publishing,
    ISBN 0-7645-7908-8).'
  merge: -1
  pgno: 3
