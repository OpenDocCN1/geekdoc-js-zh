    > Note The preceding code shares a baresome dwr.xml file. In addition to the XML\
    \ prologue, there may also be sections showing the display name and description\
    \ that appear in the Tomcat manager.\n\nThe dwr.xml configuration file contains\
    \ an element, <web-app>, which is the default namespace of http://java.sun.com/ns/jee\
    \ (as are all the other elements). There are two sections. The first block, <servlet>,\
    \ specifies the name of the servlet along with other information, as whether the\
    \ built-in page is enabled.\n\nThe second section, <servlet-mapping>, relates\
    \ a URL to an entry in the <servlet> section. In this instance, specifying a URL\
    \ ending with dwr will cause the dwr-invoker servlet to handle the client request.\n\
    \n> Note dwr-invoker is the workhorse of DWR. It is a Java servlet providing all\
    \ the basic functionality as well the built-in test harness and other features.\n\
    \nThis file is not unique to DWR and will be present in all servlet applications.\
    \ If you need to use DWR in an application that has a web.xml file, simply add\
    \ the necessary <servlet> and <servlet-mapping> elements to the appropriate part\
    \ of the file. Save the file into the folder named WEB-INF directly under the\
    \ Dwr directory.\n\nThe second file, dwr.xml, also resides in WEB-INF. A minimal\
    \ example is shown below.\n\n```\n<dwr>\n<all>\n  <create creator=\"new\" javascript=\"\
    JDate\">\n    <param name=\"class\" value=\"java.util.Date\" />\n  </create>\n\
    </all>\n</dwr>\n```\n\nThis example dictates that the java.util.Date class will\
