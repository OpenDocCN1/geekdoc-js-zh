    \ This completes the keyboard support for the autocomplete, but there is one more\
    \ thing to take into account.\n\n# Fast-Type Support\n\nBecause the handleKeyUp\
    \ method requests suggestions whenever a key is pressed, you may be wondering\
    \ if it is possible to keep up when someone is typing quickly. The answer is no.\
    \ You may be surprised to find that suggestions are far too late (including the\
    \ event handling letters you never typed) and a very choppy user experience (with\
    \ long pauses as you type). So, how can you make that fast suggestions aren't\
    \ left out of functionality?\n\nQuite simply, you would wait a short amount before\
    \ requesting suggestions from the server. This can be done using the setTimeout()\
    \ method, which delays the calling of the function for a set time interval. The\
    \ new functionality is saved in the AutoSuggestControl. If another key is pressed\
    \ before the timeout has activated, the existing timeout is cleared and a new\
