    \ the \"Manipulating the DOM in IE\" section for a refresher.\n\n# # Error Handling\
    \ in Firefox\n\nFirefox, surprisingly, handles errors differently than IE. When\
    \ IE runs into an error, it populates the parseError object; when Firefox runs\
    \ into an error, it loads an XML document containing the error into the XML DOM\
    \ document. Consider the following example:\n\n```\nvar sXml = \"<root><person><name>Jeremy\
    \ Mcpeak</name></root>\";\nvar oParser = new DOMParser();\nvar oXmlDom = oParser.parseFromString(sXml,\
    \ \"text/xml\");\n```\n\n```\nif (oXmlDom.documentElement.tagName != \"parsererror\"\
    ) {\n  // No error occurred. Do something here.\n} else {\n  alert(\"An Error\
    \ Occurred\\n}\n```\n\nIn the highlighted line, you'll see what will cause the\
    \ error: a malformed XML string (because the <person> element is not closed).\
    \ When the malformed XML is loaded, the XML DOM object loads an error document\
    \ with a <parsererror> . You can easily determine if an error occurred by checking\
    \ the documentElement tagName property; if it's not parsererror, you can be assured\
    \ that an error did not occur.\n\nThe error document created in this example looks\
    \ like this:\n\n```\n<parsererror xmlns=\"http://www.mozilla.org/newlayout/xml/parsererror.xml\"\
    >XML\nParsing: mismatched tag. Expected: <person>.\nLocation: http://yoda/foreader/test.htm\n\
    Line Number 1, Column 43: <sourcetext><root><person>Jeremy\nMcpeak</name></root></sourcetext></parsererror>\n\
    ```\n\nAll of the information is available in the error document. If you use this\
    \ instrumentation, you will have to parse it. The easiest way to do this is to\
    \ use a regular expression:\n\n```\nvar reError = /([\\s\\S]*?)Location:([\\s\\\
    S]*?)Line Number (\\d+):<sourcetext>([\\s\\S]*?)</sourcetext>>/;\n```\n\nThis\
    \ regular expression extracts the error document into features: the message name\
    \ where the error happened, the line number, the position in the line where the\
    \ error occurred, and the source that caused the error. Using the test() method\
    \ of the regular expression will enable you to use these pieces of data:\n\n```\n\
    if (oXmlDom.firstChild.tagName != \"parsererror\") {\n  // No error occurred.\
    \ Do something here.\n} else {\n```\n\n```\nvar oXmlSerializer = new XMLSerializer();\n\
    var sXmlError = oXmlSerializer.serializeToString(oXmlDom);\nvar reError = /([\\\
    s\\S]*?)Location:([\\s\\S]*?)Line Number (\\d+)/\n```\n\nColumn"
