    \n```\n#weatherContainer {\n  position: relative;\n  background: url('../img/background.gif');\n\
    \  width: 220px;\n  height: 149px;\n}\n```\n\nA relative position does not interfere\
    \ with the page flow unless you use top and left coordinates. The background of\
    \ this <div> element is a custom-made GIF file the same size as the <div> 220\
    \ pixels wide and 149 pixels high.\n\nThe SDK includes Weather.com's own images\
    \ to provide a visual display of the current weather conditions. These image files\
    \ are PNG images and xx.png, where xx is a number. This number, in the XML field,\
    \ resides at weather/cc/icon (ic stands for conditions). To accomplish the look\
    \ of this example, give it an absolute position, which enables you to place it\
    \ anywhere in its container and removes it from the document flow.\n\n```\n#weatherIcon\
    \ {\n  position: absolute;\n  top: -25px;\n  left: -25px;\n}\n```\n\nThis code\
    \ places img 25 pixels to the left and from the top-left corner of the container.\
    \ Because the images provided by Weather.com are PNGs, additional coding is required\
    \ for Internet Explorer to handle the transparency information.\n\nMicrosoft exposes\
    \ a DirectX filter called AlphaLoader, which makes PNGs correctly display transparency.\
    \ However, the use of this filter is limiting, as it cannot be applied with CSS.\
    \ To solve this, you can download the PNG behavior (http://webfx.eae/shtml/pngbehavior/pngbehavior.html).\
    \ It is an excellent tool, and is perfect in this situation. Use it, adding the\
    \ following rule to your CSS:\n\n```\n#weatherIcon img {\n  width: 128px;\n  height:\
    \ 128px;\n  behavior: url(\"pngbehavior.htc\");\n}\n```\n\nIn Internet Explorer,\
    \ this rule applies the PNG behavior to every <img> element in the document, but\
    \ it only applies the AlphaLoader for PNG files. All other <img> tags with .gif,\
    \ .jpg, or any other extension are alone. The filter property is Internet Explorer-specific;\
    \ therefore, all browsers ignore the property and its value.\n\nYou must set the\
    \ height and width properties when using AlphaLoader."
