  md: '# Summary


    This chapter introduced you to the concept of web services, an architecture allowing
    the transfer of data from one location on the Internet to another. You learned
    about the evolution of web services and associated technologies, such as SOAP,
    WSDL, and REST. The similarities and differences between SOAP and REST services
    were also discussed.


    Next, you learned how to create your web service using ASP.NET and C#. This involved
    downloading the .NET SDK and using the built-in web service creation and management
    tools. You learned to inspect and test your web service using the generated .NET
    harness.


    You then moved on to create a test harness client for Internet Explorer, and then
    one for Mozilla, using different techniques to call the web service. You were
    introduced to the web service behavior for Internet Explorer and the high-level
    SOAP classes in Mozilla. The last test harness created is intended to be universal,
    using XMLHttpRequest to send and receive SOAP messages.


    Last, you learned about cross-domain issues with web services and how to avoid
    them using a serverside proxy.


    In this chapter the SOAP specifications were used to pass arguments between the
    client and the server. Although this is a robust and flexible method, it adds
    a lot of overhead to the process and means that the client must be able to handle
    XML and all its attendant complexity. The next chapter shows a simpler and less
    formal way of passing data between machines called JavaScript Object Notation
    (JSON).'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# Chapter 7: JSON


    # Overview


    With the still-rising popularity of web services, XML has practically become the
    de facto standard for data transmission. However, XML is not without its detractors.
    For example, some consider it to be overly verbose for data transmission purposes,
    necessitating many more bytes of information to be sent across the Internet what
    could have been done in a much smaller format. To take this into consideration,
    new formats of XML compression and extending or adding to XML, such as Binary
    XML, have been developed. All these solutions work on extending or adding to XML,
    making backwards compatibility an issue. Douglas Crockford, a long-time software
    engineer, proposed a new data format based on JavaScript Object Notation (JSON).


    Until this point, you''ve used either plain text or XML to transmit data and forth
    to the server. This chapter introduces the use of JSON in Ajax communication as
    an alternative to these more traditional data formats.


    # What Is JSON?


    JSON is a very lightweight data format based on the JavaScript syntax, namely
    array and object literals. Because it uses JavaScript syntax, JSON definitions
    can be included within JavaScript files and accessed without the extra parsing
    that comes along with XML-based languages. But before you use JSON, it''s important
    to understand the specific JavaScript syntax for array and object literals.


    # Array Literals


    For unfamiliar with JavaScript literal notation, array literals are specified
    by square brackets ([]) to enclose a comma-delimited list of JavaScript values
    (meaning a string, number, Boolean, or null value), such as:


    ```

    var aNames = ["Benjamin", "Michael", "Scott"];

    ```


    You can access the values in the array by using the array name and bracket notation:


    ```

    alert(aNames[0]); //outputs "Benjamin"

    alert(aNames[1]); //outputs "Michael"

    alert(aNames[2]); //outputs "Scott"

    ```


    Note that the first position in the array is 0, and the value in that position
    is "Benjamin".


    Because arrays in JavaScript are not typed, they can be used to store any number
    of different data types:


    ```

    var aValues = ["string", 24, true, null];

    ```


    This array contains a string, followed by a number, followed by a Boolean, followed
    by a null value. This is completely legal and perfectly fine JavaScript.


    If you were to define an array without using literal notation, you would have
    to use the Array constructor, such as:


    ```

    var aValues = new Array("string", 24, true, null);

    ```


    > It''s important to note that either way is acceptable when writing JavaScript,
    but only array literals are valid in JSON.'
  merge: -1
  pgno: 185
- img_proc: true
  md: "# Object Literals\n\nObject literals are used to store information in name-value\
    \ pairs, ultimately creating an object. An object literal is defined by two curly\
    \ braces ({ and }). Inside of these can be placed any number of name-value pairs,\
    \ defined with a string, a colon, and the value. Each name-value pair must be\
    \ followed with a comma, except for the last one (making this more like defining\
    \ an associative array in Perl). For example:\n\n```\nvar oCar = {\n  \"color\"\
    \ : \"red\",\n  \"doors\" : 4,\n  \"paidFor\" : true\n}\n```\n\nThis code creates\
    \ an object with three properties color, doors, and paidFor, each containing different\
    \ values. You can access these properties using the object name and dot notation,\
    \ as:\n\n```\nalert(oCar.color); //outputs \"red\"\nalert(oCar.doors); //outputs\
    \ \"4\"\nalert(oCar.paidFor); //outputs \"true\"\n```\n\nYou can also use bracket\
    \ notation and pass the name of the property as a string value (like the way it\
    \ was defined using object literal notation):\n\n```\nalert(oCar[\"color\"]);\
    \ //outputs \"red\"\nalert(oCar[\"doors\"]); //outputs \"4\"\nalert(oCar[\"paidFor\"\
    ]); //outputs \"true\"\n```\n\nThe same object could be created using the JavaScript\
    \ Object constructor, like this:\n\n```\nvar oCar = new Object();\noCar.color\
    \ = \"red\"\noCar.doors = 4;\noCar.paidFor = true;\n```\n\nAs you can, the object\
    \ literal notation requires less code than using the Object constructor.\n\n>\
    \ **Important** Once again, although either approach is valid in JavaScript, only\
    \ object literal notation is valid in JSON.\n\n# Mixing Literals\n\nIt's possible\
    \ to mix object and array literals, creating an array of objects or an object\
    \ containing an array. Suppose you wanted to create an array of car objects similar\
    \ to the one created in the last section. You could do so as follows:\n\n```\n\
    var oCars = [\n  \"color\" : \"red\",\n  \"doors\" : 2,\n  \"paidFor\" : true\n\
    ],\n```"
