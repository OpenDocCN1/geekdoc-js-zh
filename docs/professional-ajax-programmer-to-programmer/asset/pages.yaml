    # # Chapter 8: Web Site Widgets


    # ## Overview


    Both on the desktop and on the Web, widgets have become a highly sought-after
    commodity. A widget is a mini, self-containing application that performs a specific
    purpose. Programs like Konfabulator (www.konfabulator.com) offered users a platform
    to run widgets on computers. Ranging from readers to Ebay monitors, these widgets
    provide useful information to people who want them. They are applications that
    require little to setup and perform only their allotted function.


    On the Web, most widgets were primarily limited to static HTML widgets, designed
    to emulate operating system controls such as menus, structure trees, and toolbars.
    While these widgets provided a means to emulate traditional applications, they
    didn''t offer much more than that.


    Thanks to the capabilities of XMLHttpRequest, widgets are beginning to incorporate
    data manipulation and retrieval with HTML, creating rich web widgets that are
    normally found only on the desktop.


    In this chapter, you will create four web widgets using PHP, ASP.NET, HTML, and
    Ajax: a news ticker, a weather widget, a web search widget, and a site search
    widget. The following sections will walk you through the creation of these widgets
    and how to apply them to your web page.


    # ## Creating a News Ticker Widget


    Popular on both television networks and web sites, the news ticker displays current
    events in a scrolling format. Unlike the static nature of television, the Web
    enables users to interact with these tickers. If it catches their interest, they
    can click the news item and it takes them to their desired information.


    The widget built in this section, a news ticker, provides this functionality (see
    Figure 8-1). Like any other Ajax-enabled application, it comes in two parts: a
    server application and a client application.'
