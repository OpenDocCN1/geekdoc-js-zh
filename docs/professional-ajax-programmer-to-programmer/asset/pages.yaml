  md: '# Important


    For more information on which converters are available and which need allowing
    specifically they can be used by your code, see http://getahead.ltd.uk/dwr/server/dwrxml/converters.


    # Summary of DWR


    DWR is an excellent way to harness the power of Java for use in client-side web
    pages. The hundreds of Java packages already available make it almost a certainty,
    whatever your need, there will be something that fits the bill. There is also
    the advantage that there is no shortage of information, tutorials, and experts
    willing to share their knowledge about the Java platform.


    # Ajax.NET


    Ajax.NET is designed to allow remote calling of classes in .NET language, specifically
    those accessed ASP.NET. The NET Framework has been around since 1999, and one
    of its aims is to enable code in different languages to integrate with each other
    seamlessly. The main .NET languages are Visual Basic, .NET and C#, but there are
    many others, ranging from J#, a .NET port of Java, to COBOL.


    # How It Works


    As the other frameworks discussed in this chapter, Ajax.NET uses a cross-browser,
    client-side library to post calls to the server via the server-side code in the
    ASP.NET page. Unlike the other frameworks, Ajax.NET takes advantage of an ASP.NET
    feature called attributes, which is used to mark the methods that will be available
    from the client.


    # Installing Ajax.NET


    To use Ajax.NET, you need to be running IIS version 5 or greater and have the
    .NET Framework installed. Although creating web sites using ASP.NET can be done
    easily via Visual Studio, using a standard editor


    > Chapter 6 discusses how to set up a virtual folder for IIS and create an Ajax.NET
    web project.


    Download the Ajax DLL from http://ajax.schwarz-interactive.de/. At the time of
    writing, two releases are available: any one with a version of 5.7.25.1 or greater
    is for use with version 2 of .NET; if you are not running, one of the earlier
    DLLs, such as 5.7.22.2.


    Next, you need to add a reference to this DLL to project in which you use Ajax.NET.


    # Adding the Ajax.dll Reference


    You need to create your project before setting up Ajax.NET, so start Visual Studio
    .NET and add a new ASP.NET web application named AjaxTest.


    > The project can be in C#, Visual Basic, .NET, or any other option on your machine.


    Right-click the project name, AjaxTest, and then choose Add->New Folder. Name
    the new folder ref. Add the Ajax DLL downloaded earlier to this folder, and then
    add a reference to by right-clicking the References folder, browsing to ref, and
    double-clicking Ajax.dll. Finally.'
