  md: "With this, you're now ready to transmit the information to whatever destination\
    \ makes sense for you.\n\n# JSON versus XML\n\nAs mentioned previously, one of\
    \ the advantages of JSON over XML is that it's more compact. XML is considered\
    \ by some to be overly verbose for its purpose. But what does this mean exactly?\
    \ Consider the following XML data:\n\n```\n<classinfo>\n  <students>\n    <student>\n\
    \      <name>Michael Smith</name>\n      <average>99.5</average>\n      <age>17</age>\n\
    \      <graduating>true</graduating>\n    </student>\n    <student>\n      <name>Steve\
    \ Johnson</name>\n      <average>34.87</average>\n      <age>17</age>\n      <graduating>false</graduating>\n\
    \    </student>\n    <student>\n      <name>Rebecca Young</name>\n      <average>89.6</average>\n\
    \      <age>18</age>\n      <graduating>true</graduating>\n    </student>\n  </students>\n\
    </classinfo>\n```\n\nThis example contains information about three students in\
    \ a class. Right away, there is some XML that is not entirely necessary: the <classinfo>\
    \ and <students/> elements. These elements help to define the overall structure\
    \ and meaning of the information, although the actual information you're interested\
    \ in is the students and their information. Plus, for each piece of information\
    \ about students, the name of the information is repeated twice, although the\
    \ actual data is repeated only once (for example, \"name\" appears in both tags).\
    \ Consider the same information formatted as JSON.\n\n```\n\"classinfo\": {\n\
    \  \"students\": [\n    {\n      \"name\": \"Michael Smith\",\n      \"average\"\
    : 99.5,\n      \"age\": 17,\n      \"graduating\": true\n```"
  merge: -1
  pgno: 189
- img_proc: true
  md: "```\n{\n  \"name\" : \"Steve Johnson\",\n  \"average\" : 34.87,\n  \"age\"\
    \ : 17,\n  \"graduating\" : false,\n{\n  \"name\" : \"Rebecca Young\",\n  \"average\"\
    \ : 89.6,\n  \"age\" : 18,\n  \"graduating\" : true\n}\n}\n```\n\nAs you can see,\
    \ a lot of the superfluous information is not present. Since closing tags aren't\
    \ necessary to match opening tags, it greatly reduces the number of bytes needed\
    \ to transmit the information. Not including spaces, the JSON is 224 bytes, whereas\
    \ the comparable XML data is 365 bytes, saving more than 100 bytes. (This is why\
    \ Crockford, JSON's creator, calls it the \"flat alternative to XML.\")\n\nThe\
    \ disadvantage to JSON-formatted data compared to XML is that it's less readable\
    \ to the layman. Because XML is verbose, it's easy to understand what data is\
    \ being represented. JSON, with its shorthand notation, can be difficult to decipher\
    \ when viewed with the naked eye. Of course, an argument can be made that data\
    \ exchange formats should never be viewed with the naked eye, but then there is\
    \ really no reason to make the data be human readable. But this begs the question:\
    \ Are there any JSON tools available? The answer is yes.\n\n# Server-Side JSON\
    \ Tools\n\nAs you know, Ajax has to do with the interaction between the client\
    \ and the server, so JSON would be of no use for this purpose unless there were\
    \ server-side tools to aid in the encoding and decoding. As luck would have, there\
    \ are quite a few JSON tools for server-side languages. Although it is beyond\
    \ the scope of this book to discuss every one of these tools, it is useful to\
    \ look at one and then develop a solution using it.\n\n# JSON-PHP\n\nJSON-PHP\
    \ is a PHP utility to enable the encoding and decoding of JSON information. This\
    \ utility, written by Michal Migurski, is available for free at http://mike.teczno.com/json.php.\
    \ All you need to be using JSON in PHP is to include the JSON file in your page\
    \ and make use of the JSON object.\n\nCreating new instance of the JSON object\
