  md: '```

    "color" : "blue",

    "doors" : 4,

    "paidFor" : true,

    {

    "color" : "white",

    "doors" : 2,

    "paidFor" : false

    };

    ```


    This code defines an array, aCars, which has three objects in it. The three objects
    each have properties named color, doors, and paidFor. (Each object represents
    a car, of course.) You can access any information of the array by using a combination
    of bracket and dot notation. For example, to get the number of doors on the second
    car in the array, the following line will do the trick:


    ```

    alert(aCars[1].doors); // outputs "4"

    ```


    In this example, you are first getting the value in the second position of the
    array (position 1) and then getting the property named doors.


    You can also define the property as inside of object literals, such as:


    ```

    var oCarInfo = {

    "availableColors" : ["red", "white", "blue"],

    "availableDoors" : [2, 4]

    };

    ```


    This code defines an object called oCarInfo which has two properties, availableColors
    and availableDoors. Both of these properties are arrays, containing strings and
    numbers, respectively. To access a value here, you just reverse the order of the
    bracket and dot notation. To get to the second value, you can do this:


    ```

    alert(oCarInfo.availableColors[1]);

    ```


    In this example, you are first returning the property named availableColors, and
    then getting the value in the second position (position 1). What does all this
    have to do with JSON?


    # JSON Syntax


    JSON syntax is really nothing more than the mixture of object and array literals
    to store data. The only difference from the examples in the last section is that
    JSON doesn''t have variables. Remember, JSON represents only data;it has no concept
    of variables, assignments, or equality. Therefore, the JSON code for the last
    example is simply:


    ```

    {

    "availableColors" : ["red", "white", "blue"],

    "availableDoors" : [2, 4]

    }

    ```


    Note that the variable oCarInfo has been removed, as the semicolon following the
    curly brace. If this was transmitted via HTTP to a browser, it would be fairly
    quick because of the small number of characters. Suppose this data was retrieved
    using XMLHttpRequest (or some'
