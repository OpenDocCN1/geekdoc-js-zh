    }\n```\n\nThe XPath expression uses the namespaces specified in the SelectionNamespaces\
    \ property and selects all <pub:name/> elements. In the case of this example,\
    \ a NodeList consisting of five elements is returned, which you can use then.\n\
    \n# XPath in Firefox\n\nThe Firefox XPath implementation follows the DOM standard,\
    \ which is quite different from the IE implementation. The Firefox implementation\
    \ allows XPath expressions to run HTML"
