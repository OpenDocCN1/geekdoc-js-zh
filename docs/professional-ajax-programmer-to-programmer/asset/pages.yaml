    \ a certain amount of time before requesting suggestions. If another key is pressed\
    \ before the request is made the control cancels the original request (by clearing\
    \ the timeout) and asks for a new request to be made after the same amount of\
    \ time. In this way, you can be sure that the request for suggestions goes out\
    \ only while the user is pausing typing.\n\nTo implement this, the first thing\
    \ you need is a property to hold the timeout ID. You can add the timeoutId directly\
    \ to the AutoSuggestControl class, as follows:\n\n```\nfunction AutoSuggestControl(oTextbox,\
