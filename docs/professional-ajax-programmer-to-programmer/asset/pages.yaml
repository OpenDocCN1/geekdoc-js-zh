  md: "# The scope Parameter\n\nThe `<create>` element can also take an attribute\
    \ `scope`, which can be page, session, request,or application. This enables you\
    \ to specify the lifetime of a bean; if no scope is specified, it defaults to\
    \ request.\n\nIf you wanted to use the `Customer` class for a session, for example\
    \ (which is not that helpful since it has no properties), the syntax would be\
    \ as follows:\n\n```\n<create creator=\"new\" javascript=\"wrox.Customer\">\n\
    \  <param name=\"class\" value=\"wrox.Customer\" scope=\"session\"/>\n</create>\n\
    ```\n\n# Converters\n\nBecause Java has more data types than JavaScript, you may\
    \ be wondering what would happen if DWR encountered a value cannot be translated.\
    \ When no translation is available, DWR uses converters to bridge the gap. `Converters`\
    \ translate types between Java and JavaScript. There are a number of predefined\
    \ converters that ship with DWR, such as the `Converter`, which marshals between\
    \ the `java.util.Date` and the JavaScript `Date` object. Other converters use\
    \ the `ArrayConverter`, the `StringConverter`, and the `BeanConverter`.\n\nIn\
    \ theory, it is possible to build your own converter; in practice, however, this\
    \ is extremely unlikely and would be necessary only if your method required a\
    \ particularly unusual type.\n\nThere is, however, one aspect of converters you\
    \ should consider: security may be possible in certain circumstances to run malicious\
    \ code through a converter; this is not possible with primitive types, but could\
    \ happen with a JavaBean. To safeguard this, the thebean converter is disabled\
    \ by default. You can allow it, by adding an entry to the `<allow>` section of\
    \ `dwr.xml`.\n\nTo allow everything in thebean, add to the following line:\n\n\
    ```\n<dwr>\n  <allow>\n    <convert converter=\"bean\" match=\"your.full.package.BeanName/>\n\
    \    <!-- other allowed converters and creators -->\n  </allow>\n</dwr>\n```\n\
    \nThe match specifies which bean to allow. You can expand it to entire package\
    \ by using an asterisk as a wild card:\n\n```\n<convert converter=\"bean\" match=\"\
    your.full.package.*\"/>\n```\n\nYou can exclude properties from being converted\
    \ if you add a child element to the `<convert>`:\n\n```\n<convert converter=\"\
    bean\" match=\"your.full.package.BeanName\">\n  <param name=\"exclude\" value=\"\
    property,property2\"/>\n</convert>\n```\n\nAlternatively, and more safely, you\
    \ can specify which properties can be converted (all others are ignored):\n\n\
    ```\n<convert converter=\"bean\" match=\"your.full.package.BeanName\"/>\n```"
