    \n# Periodic Refresh\n\nThe Refresh design pattern describes the process of checking\
    \ for new server information in specific intervals. This approach, also called\
    \ polling, requires the browser to keep track of when the server should take place.\n\
    \nThis pattern is used in a variety of different ways on the Web:\nexample, the\
    \ NFL Scoreboard update online scores automatically.\n\n+   ESPN uses Refresh\
    \ to update online scores automatically. http://sports.espn.com/nfl/scoreboard\
    \ shows up-to-the-minute scores and drives for every NFL game being played. Using\
    \ XMLHttp objects and a bit of Flash, the page repeatedly updates itself with\
    \ new information.\nGmail (mail.google.com) uses Refresh to notify users when\
    \ a new message has been received. While you are reading e-mail or performing\
    \ other operations, Gmail repeatedly checks the inbox for new mail at intervals.\
    \ This is done without notification until new mail arrives, at which point the\
    \ number of new e-mails is displayed in parentheses next to the inbox menu.\n\
    XHTML Live Chat (www.plasticstore.com/projects/chat/) uses Refresh to implement\
    \ a chat room using simple web technologies. The chat room text is updated every\
    \ few seconds by checking for new information. If there is a new message, the\
    \ page is updated to reflect it, creating a traditional chat experience."
