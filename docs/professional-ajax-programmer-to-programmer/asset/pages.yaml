  md: '# Chapter 4: XML, XPath, and XSLT


    # Overview


    As the popularity of XML grew, web developers wanted to use the technology on
    both the server and client-side, but only the former initially offered XML functionality.
    Starting with Internet Explorer 5.0 and Mozilla 1.0, Microsoft and Mozilla began
    to support XML support through JavaScript in their browsers. Recently, Apple and
    Opera added some XML support to their browsers, albeit not to the extent that
    Microsoft and Mozilla have. Browser makers continue to broaden the availability
    of XML support with new features, giving web developers powerful tools akin to
    those found only on the server.


    In this chapter, you will learn how to load and manipulate documents in an XML
    DOM object, use XPath to select XML nodes that meet certain criteria, and transform
    XML documents into HTML using XSL.


    # XML Support in Browsers


    Many web browsers are available today, but few have as complete support for XML
    and its related technologies as Internet Explorer (IE) and Mozilla Firefox. Other
    browsers are starting to catch up, with Safari and Opera now able to open XML
    documents, the functionality is either incomplete or null. Because of these issues,
    this chapter focuses primarily on the implementations in IE and Firefox.


    # XML DOM in IE


    When Microsoft added XML to IE 5.0, they did so by incorporating the MSXML ActiveX
    library, a component originally written to parse Channels in IE 4.0. This original
    version wasnt intended for public use, but developers became aware of the component
    and began using it. Microsoft reloaded it with a fully upgraded version of MSXML,
    which was included in IE 4.01. MSXML was primarily an IE-only component until
    2001 when Microsoft released MSXML 3.0, a separate distribution available through
    the company''s site. Later that year, version 4.0 was released as the Microsoft
    XML Server Services Component. Since its inception, MSXML has gone from a basic,
    non-validating XML parser to a fully featured component that can validate XML
    documents, perform XML transformations, support namespace usage, the Simple API
    for XML (SAX), and the W3C XPath and XML Schema standards, while improving performance
    with each version.


    To create an ActiveX object in JavaScript, Microsoft implemented a new class ActiveObject
    which can be instantiated a number of ActiveX objects. Its constructor takes one
    argument, containing the version of the ActiveX object to create; in this case,
    it is the version of the XML document. The first DOM ActiveX object was called
    Microsoft.XmlDom, whose creation looks like this:


    ```

    var xDom = new ActiveXObject("Microsoft.XmlDom");

    ```


    At the time of writing, there are five different versions of the MSXML document,
    and their version strings are as follows:


    +   - Microsoft.XmlDom

    - MSXML.2DOMDocument

    - MSXML.2DOMDocument.3.0

    - MSXML.2DOMDocument.4.0

    - MSXML.2DOMDocument.5.0


    +   Important MSXML is an ActiveX implementation; it is available only on Windows
    platforms. IE 5 on the Mac has no XML DOM support.'
