  md: "# Session State\n\nAjax.NET can also handle cases where you need access to\
    \ session variables. When declaring the AjaxMethod attribute, you can pass a parameter\
    \ specifying whether you need read, write, or read and write access.\n\n```\n\
    [Ajax.AjaxMethod(HttpSessionStateRequirement.Read)]\npublic string MyMethod()\n\
    {\n```\n\nThe other two options are HttpSessionStateRequirement.Write and HttpSessionStateRequirement.Read.\n\
    \nSuppose, for example, that the user has initiated a number of transactions on\
    \ a site and wants to know which have been completed. In traditional web applications,\
    \ he or she would need to revisit a specific page to get the status, but with\
    \ an Ajax approach this is not necessary.\n\nThe ID of each transaction to be\
    \ completed is held in a session variable named WaitingTransactions.\n\n```\n\
    [Ajax.AjaxMethod(HttpSessionStateRequirement.Read)]\npublic ArrayList completedTransactions\
    \ = FetchCompletedTransactions()\n{\n```\n\n```\nif (HttpContext.Current.Session[\"\
    WaitingTransactions\"] == null)\n{\n    return null;\n}\n\nArrayList completedTransactions\
    \ = new ArrayList();\nint[] transactions = (int[])HttpContext.Current.Session[\"\
    WaitingTransactions\"];\nfor (int i = 0; i < transactions.Length; i++)\n{\n  \
    \  Transaction tx = Transaction.GetFromId(transactions[i]);\n    if (tx != null\
    \ && tx.Status == TransactionStatus.Ready)\n{\n        completedTransactions.Add(tx);\n\
    \    }\n}\nreturn completedTransactions;\n```\n\nThe session variable is checked;\
    \ if not found to null, it is cast to an array of integers. Each integer is fed\
    \ to a method that retrieves details of the transaction and if it is ready then\
    \ adds it to the ArrayList to be returned to the caller.\n\nNow you can use the\
    \ window.setTimeout to poll the state of the transactions:\n\n```\n<script type=\"\
    text/javascript\">\nfunction transactionsCompleteCallback(response)\n{\n    if\
    \ (response.error != null\n```"
