  md: '# How It Works


    JPSpan works by analyzing a class using reflection. It then emits a number of
    JavaScript methods that accept the same arguments as the methods of the class
    on the server. When one of these methods is called, it uses a cross-browser library
    to instantiate the appropriate XMLHttpRequest for the platform and posts data
    to the server. The response is then returned and passed to a function on the client
    for further use.


    Reflection examines a class to find out its properties and methods. It is a commonly
    used technique in object-oriented languages and is often used as a way of writing
    generic code that can work with a large number of classes.


    # Installing JPSpan


    The first thing you need is a web server that supports PHP, version 5.0. This
    can be the ubiquitous Apache server for Unix/Linux or IIS for Windows (although
    others also support PHP, these are the most common). When installing the PHP processor
    as a out of server using CGI or in process using ISAPI, the first method is recommended
    for its simplicity, security. For the purposes of this chapter, the ISAPI installation
    was chosen.


    You can find the PHP installation, along with a list of compatible web servers,
    at http://www.php.net. There is a comprehensive set of instructions with a list
    of Frequently Asked Questions detailing how to resolve common difficulties and
    problems.


    The actual JSPan installation can be found at http://sourceforge.org/projects/jspan.
    Aside from the documentation and examples, it consists of a few PHP pages alongside
    several JavaScript files. The entry point, JPSpan, is in a folder named JSPan,
    which is best placed directly under the root of your web server (for IIS this
    is C:\inetPub\wwwroot and for Apache it is /usr/local/apache/htdocs). There is
    a subfolder, also called JSPan, that contains additional PHP and JavaScript files.


    # Creating the Server-Side Page


    There are two stages in developing the server-side page: implementing the business
    classes that will hook them into the framework so that they become accessible
    from the client.


    The first stage is to create a standard server-side skeleton page that can be
    used as a starting point for most JSPan projects. Because of the basic plumbing
    needed to inform JSPan of the business class as well as other options such as
    what to do in the event of an error.


    The second stage is the coding of the business class or classes to deploy, which
    requires a knowledge of PHP and the syntax to declare classes. The syntax is very
    similar to C++ and Java, so no knowledge of those languages will help.


    After the business class has been placed outside of the JSPan framework, it can
    be incorporated into the skeleton page for use by the client.


    # The Standard Page Code


    The basic structure of a server-side processing page looks something like the
    following example:


    ```

    <?php


    //Business class to be included here

    ```'
