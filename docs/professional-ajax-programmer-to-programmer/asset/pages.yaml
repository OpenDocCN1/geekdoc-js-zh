    \ following sections build on each other, and the complete code can be downloaded\
    \ from www.wrox.com.\n\n# # Implementing Typehead\n\nTo implement the first feature,\
    \ typehead, it's helpful to understand exactly how it works. Typehead boxes look\
    \ at what the user has and makes a suggestion, highlighting only the part that\
    \ was added automatically. For example, if you were to type `Ma` into a text box,\
    \ the suggestion might be `Maine`, but only `ine` would be highlighted. Doing\
    \ this allows the user to continue typing without interruption simply replace\
    \ the new characters highlighted.\n\nOriginally, the only type of highlighting\
    \ possible using JavaScript was to highlight the text in the text box as follows:\n\
    \n```\nvar oTextbox = document.getElementById(\"txtState\");\noTextbox.select();\n\
    ```\n\nThis code gets to select a range within the text box of `txtState` and\
    \ then selects all the text contained within it. Although this functionality is\
    \ fine for many everyday uses, it's not very helpful for implementing typehead.\
    \ Thankfully, both Internet Explorer and Firefox have ways of selecting parts\
    \ of the item (if available). But as usual, the two biggest combatants in the\
    \ world do in two completely different ways.\n\nThe Internet Explorer solution\
    \ is to use a range. Not be confused with DOM ranges, an Internet Explorer range\
    \ is an invisible selection of the page, beginning on a single character and ending\
