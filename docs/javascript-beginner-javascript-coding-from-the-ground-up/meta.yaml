    \ every type of data like string, integers, floating point integers, Boolean,\
    \ etc. by the same constructor var.\n\n```javascript\nvar x=2;\nvar y=0.04; z='A';\n\
    ```\n\nAll these are variables have a scope and a lifetime which is the time that\
    \ the value that they contain will be valid.\n"
  mdcn: "\n在某个时间点。假设你编写的用于对数字列表排序的代码有一个 bug。现在想象你没有函数的概念。那么基本上在任何你使用了那段有 bug 代码的地方，你都需要搜索它然后修复\
