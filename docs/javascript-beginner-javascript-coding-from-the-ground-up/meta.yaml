  md: '# How JavaScript stores numbers


    Before we get started on how to work with numbers, learning how exactly Javascript
    sees them is necessary. Javascript (JS) stores all numbers as floating point numbers
    - that is, all numbers can have decimal points. Unlike C style languages, there
    is no separate type for integers. All numbers are stored in the Number type. You
    can store numbers as follows: var x = 12; var y = 2.66; var z = 312e-2; The last
    example is a case of exponential notation. In this case, z is equal to 3.12. In
    many cases, if you have a number in a string, JS will try to convert it to a number
    for numeric calculations. For example var num = "1234"; If you try to use num
    in numerical operations, it is treated as 1234. However, there is one very important
    quirk to this during addition, which we will see shortly.


    Arithmetic operations First, let''s look at how to perform basic arithmetic operations.
    These include addition, subtraction, multiplication, and division. These are done
    as follows: var x = 12 + 24; X will now store the value 36.


    ```

    var x = 24 / 2; X will now store the value 12.

    var x = 3 - 2; X will store the value 1.

    var x = 4 * 9; X will store the value 36.

    ```


    Note that all these will work with using strings as numbers, as well, except for
    the addition operator +. Let''s take a look at a few statements: var x = 24 /
    "2"; var y = "3" * "4"; var z = "12" + 3; var n = 36 / "Mike"; The first will
    result in 12, as expected, and so will the next. But z will hold the value "123"
