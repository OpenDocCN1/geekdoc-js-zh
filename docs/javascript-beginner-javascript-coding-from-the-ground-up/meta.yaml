  md: '# YOUR FIRST JASCRIPT PROGRAM


    HTML adds structure to a web page and CSS (Cascading Style Sheets) adds the relevant
    style required to make the page look elegant.


    But, how do you make the page talk? How do you make it dynamic?


    That''s where JavaScript comes in.


    JavaScript adds additional functionality to a rather static web page and lets
    users interact with the various elements present in the page.


    In this chapter, you''ll make your very first JavaScript program, the famous “Hello,
    World!” that will introduce you to this vast simple language that is often touted
    as the “Language of the Web.” It is presumed that you are aware of HTML and CSS
    syntax, as they’ll be used throughout the text.


    Web Browsers render HTML and CSS and display it on the screen, and have a built-in
    JavaScript interpreter that understands the language and executes the tasks of
    the program.


    But for browsers to know where to start with the interpretation of JavaScript,
    we need to make use of the <script> tag that tells the browser the starting point
    of the program. </script> tells the browser that it has reached the end of the
    program.


    JavaScript is written within the tags <script> and </script>, and these tags are
    most commonly placed just above the <body> tag.


    This is done to make the script load after the initial page-load that makes the
    page load faster.'
