    ).innerHTML = add(7,14);\n\n- 2. 始终使用 `()` 运算符来调用函数。如果漏掉了它，返回的将是函数的整个文本。\n在上一个例子中，如果你只是简单地调用\
    \ `add` 而不是 `add()`，HTML 将包含整个函数文本。\n\n- 3. 函数可以直接作为变量的值使用。\n例如：\n\n```javascript\n\
    var x = add(5,7);\nvar printString = \"The result is \" + x ; 或者，\nvar printString=\"\
    The result is \" + add(5,7); 在两种情况下，输出将是相同的。\n```\n\n始终记住，如果你编写了一组在程序中重复多次的代码，请为它创建一个函数。此外，函数的长度应该保持尽可能小。\n\
    \n# 第 10 章\n\n# 理解对象\n\nJavaScript 是基于 OOP（面向对象编程）范式的，因此它中的几乎所有内容都是对象，或者至少表现得像对象，无论是数组、函数还是正则表达式（regex）。对象是\
    \ JavaScript 中最基本的构建块。\n\n## 什么是对象？\n\n对象是属性的集合并具有类型。就像在其他编程语言中一样，人们可以通过将其与现实中的物体进行比较来理解对象的概念。以汽车为例，相同的型号可能有不同的颜色，即具有不同的属性，但它们属于同一个类别，即汽车，也就是说它们具有相同的类型。\n\
    \n这里是一个例子，可以更清楚地理解上述描述的对象的概念：function car(color, numberPlate) {\n\n```javascript\n\
