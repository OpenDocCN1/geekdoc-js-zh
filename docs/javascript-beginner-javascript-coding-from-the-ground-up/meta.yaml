  md: '# Objects are reference data types


    Primitive data types are referenced by their values whereas reference data types
    are referenced by their address.


    Understanding the difference with an example: // Primitive data types: var x =
    45; var y = x = 10; console.log(x); // 10


    ```

    console.log(y); // 45

    ```


    As you can see in the above example, altering the value of ‘x’ didn’t have any
    effect on value of ‘y’, but it is not the same with reference data types, let’s
    see the same type of example with reference data types: var x = { value: 45 };//
    object, reference data type var y = x; x.value = 10; console.log(x.value); //
    10


    ```

    console.log(y.value);// 10

    ```


    As illustrated in the above example, altering the value of ‘x’ this time affected
    the value of ‘y’, this is because object being a reference data type, is referenced
    by address so the same address gets assigned to ‘y’ and any change in that brings
    change to both ‘x’ and ‘y’. This is why objects in JavaScript are said to be Mutable,
    meaning changeable.'
