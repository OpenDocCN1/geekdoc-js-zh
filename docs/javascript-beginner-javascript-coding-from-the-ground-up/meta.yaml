- md: "\nYou will learn about functions in detail in later chapters.\n\n- 5. Conditional\
    \ statements\n\nConditional statements are used when we need to make certain decisions\
    \ based on some conditions. For example, if there is a program to find out if\
    \ a person is eligible to vote or not, we input the age of the person and compare\
    \ it with 18. If it is more than 18, we say that person is eligible to vote or\
    \ else not.\n\nFor example: if(age>18) alert(\"eligible to vote\"); else alert(\"\
    Ineligible to vote\");\n\n- 6. Looping constructs in JavaScript\n\nLoops are used\
    \ to execute a certain part of code several times repeatedly. There are various\
    \ ways in which we can implement loops. E.g. For loop, while loop, do-while loop.\n\
    \nFor example: for (i = 0; i < 10; i++) { alert(i); }\n\n- 7. Event handling in\
    \ JavaScript\n\nEvents are some activity which happens on the web page. For example,\
    \ a mouse click on the web page, loading of the web page, etc. Event handling\
    \ is a way to handle what happens when such event occurs. Some common event handlers\
    \ are onclick, onload, onmouseover, and onmouseout.\n\nThis is a very important\
    \ concept. Developing any web application without event handlers does not make\
