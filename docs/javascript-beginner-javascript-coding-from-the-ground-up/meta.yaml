  md: '# # REAL-LIFE USES OF JAVASCRIPT


    JavaScript is being used on almost every website out there on the web, and why
    not? It adds so much functionality to any page that uses this scripting language.
    If it wasn''t for JavaScript, we would probably be stuck in the 90s where websites
    offered no functionalities to the users. It was not at all intuitive as far as
    user-experience (UX) is concerned, which is perhaps the best thing that this language
    has given to us.


    JavaScript is practically everywhere. From the forms that you submit to the drop-down
    buttons on the menus of the modern websites to the numerous errors that it shows
    when you leave a blank field to the most annoying yet useful alert boxes, they
    all are made using JavaScript.


    By now, you probably would have guessed what JavaScript brings to the table.


    Yes, everything.


    Learning the basic, simple syntax of the language can give you the power to build
    a whole calculator that looks decent enough, and in case you happen to sprinkle
    a little of the CSS magic, that would look just amazing. And that is where the
    practical usage of the language literally begins.


    Let''s look at some practical, real-life scenarios where JavaScript has proved
    to be a boon: Case 1: Form Validation A good form on the internet is said to be
    one that utilizes the power of JavaScript to validate user-input and display errors
    whenever there is an empty field, or inappropriate field inputs occur. Let''s
    assume the case if JavaScript was not used. In that case, the user who is filling
    the form would have to first submit the form, and since he does not know whether
    he has made any errors yet, and when it is submitted, it is sent to the server
    to be processed by a POST request, and then the server'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'responds with any error(s) that might have occurred. This is a two-way trip.


    Much of this can be saved if we use client-side validation using JavaScript. And
    here comes the power of JavaScript when it responds in split seconds if the user
    makes any error(s) while filling the form itself.


    # Case 2: DOM Manipulation


    Most of the time, the server responds with a static web page that the browser
    renders and displays it on the browser. But, what if we get the power to manipulate
    a few elements on the web page? Wouldn''t it feel exciting if we could change
    the state of things, their order, their properties and even their attributes and
    it could become a whole new thing altogether? Well, it turns out JavaScript gives
    us all that that might make that happen. Pretty sweet.


    # Case 3: Event Listeners


    The only way a user truly gets engaged with a web page is when they are allowed
    to click a button and they get a response back, like some new page or it changes
    some data on the web page, or it allows them to carry out some calculation-on-the-fly.
    JavaScript allows us to add that functionality by attaching functions to buttons
    or elements on the web page, often called DOM (Document Object Model) elements
    that bind themselves to that element and only execute or fire when the requisite
    action is carried out. This makes the user-experience satisfied.


    There are many uses of JavaScript that are adding to the rich UX of the web pages.
    In the modern websites, nowadays, Client Side Rendering has has made'
