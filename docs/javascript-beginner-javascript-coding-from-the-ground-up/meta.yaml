    be accessed, modified everywhere. While in the case of a variable that has local
    scope, it can be accessed or modified only within the function which they have
    been defined.


    A variable that is declared inside a function is a Local variable. It is only
    created when the function is executed, stays alive till the function is running
    and then gets destroyed automatically. The variable cannot be accessed anywhere
    outside that function.


    ```

    varmyVar= "Something"; myFunctionFunc(){

    varmyVar= "Another thing"; }

    ```


    As be seen, we can have a local as well as a global variable of the same name.
    The difference occurs at the place at which they''re being called.


    For example, if we print the value of the variable myVarinside the function, we''d
    get "Another thing" printed on the screen. On the other hand, if we try to print
    the value of myVar outside that function, we''d get "Something" printed on the
    display. So we can see it''s just the placement of the variable that decides entirely
    whether it''s a local or a global variable.


    When JavaScript starts to execute a function, it first looks for all the variable
    declarations that exist inside the function, for example, var foo. Then it creates
    all the variables with the initial value undefined. If the variable is declared
    along'
