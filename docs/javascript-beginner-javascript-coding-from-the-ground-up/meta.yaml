    # FUNCTIONS IN JAVASCRIPT


    Functions form an integral part of any programming language. If not for the functions,
    our program would contain lots of redundant code. Function helps us write code
    in an efficient manner which not only improves the readability but also contribute
    a great deal while maintaining it. Let us explore what a function is and why it
    is required!


    A function is a set of statements which are used to carry out a particular task.
    It is as simple as saying that you have a function which carries out the addition
    of two numbers. So at any point in the program, if you need to calculate the sum
    of two numbers, you just call this particular function and pass the two values
    to be added. The function will then return the desired value. Let us first look
    at the syntax for declaring and defining a function and then we will discuss in
    detail about it.


    ```

    functionName(parameter1, parameter2, parameter3) {

    //set of statements to be executed }

    ```


    As you can see above, a function definition starts with the keyword "function,"
    followed by a unique function name, followed by a parenthesis (). The task which
    the function is supposed to execute is written curly braces. Whenever a function
    is called, all the statements within the curly braces will be executed. If you
    notice in the above syntax, there are a set of parameters within the parenthesis
    which are separated by commas. These are the values which the function requires
    in order to produce the desired result. In other words, these are the values one
    must pass while calling the function.


    Let us look at a simple example of a function which accepts two values and return
    their sum.'
  - "[PAGE 52]\n\n```\nfunction addTwoNumbers(num1, num2){\n\n  return num1+num2;\
    \ //Calculates and returns the sum }\n```\n\nOne must note that a function remains\
    \ dormant or inactive until it is invoked or called in the main program. Consider\
    \ these analogous to a toast maker present in the kitchen. Toast maker is supposed\
    \ to toast a bread which you supply to it. It remains inactive unless you need\
    \ it. When you need it, you just put the bread inside and switch it on. It then\
    \ does the usual. Same happens with a function too. It is executed when it is\
    \ called or invoked.\n\nEach function should have its own unique function name.\
    \ This is important because when you call a function, there should be no ambiguous\
    \ situation.\n\nThe parameters behave as local variables inside the function.\
    \ If you have knowledge about some other programming languages, you might have\
    \ heard of procedure or subroutine. What subroutine to them is a function in JavaScript.\n\
    \nA function is executed when it is invoked. This can happen because of one of\
    \ the following scenarios:\n\n+   - When it is called from a JavaScript program.\n\
    - Automatically invoked.\n- When some events occur (Events generally refers to\
    \ an activity that happens on the web page)\n\nWhenever a return statement is\
    \ encountered, the value is returned to the place where it is called from. Any\
    \ statement beyond the return statement in the function is not executed. Therefore\
    \ it is extremely important that the return statement is placed at the end of\
    \ the function. In some cases, we might have to place the return in the beginning,\
