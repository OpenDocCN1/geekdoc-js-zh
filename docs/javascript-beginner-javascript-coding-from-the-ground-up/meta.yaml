    on it. You can do it via Date.now() method directly.

    Example: console.log( Date.now() ); // outputs current time as no. Of milliseconds
    passed since January 1, 1970


    The Date.parse() method This method parses the date string passed as its argument
    and returns it as the number of milliseconds passed since January 1, 1970, i.e.,
    as a timestamp. The date string must be in a valid format. The valid forms of
    date strings have been explained earlier in this chapter.

    Example: var example = Date.parse(''2017-07-17T10:21:35Z''); console.log(example);
    // 1500286895000


    If the date string is invalid format then this method returns ‘NaN’.


    The toString() method This method is used to convert the date to a string which
    is in more readable format.

    Example: var example = Date.parse( ''2017-07-17T10:21:35Z'' ); example.toDateString();
    // Mon Jul 17 2017


    This method returns the string which is relative to the local time zone, if you
    want to use string which is relative to UTC then you can use .toUTCString() method
    whose usage is same as this method.


    Comparing two dates It is really easy to compare two dates in JavaScript, it can
