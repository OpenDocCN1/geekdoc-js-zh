- img_proc: true
  md: '# EVENTS IN JAVASCRIPT


    What is an Event in JavaScript?


    It’s very similar to the literal meaning of the word. If anything happens changes
    the DOM (Document Object Model) tree’s structure, it is an event. Some of these
    events are generated by the user itself, like Mouse events or Keyboard events
    while some events are generated by the browser API itself, like scrolling to a
    particular area of the web page or play/pause of a video, page reloads, or window
    resizes, etc. These events have their properties or attributes and are prototyped
    to contain a function/method which is fired when the property/attribute/value
    of a particular event changes, either by the user or automated.


    These events allow developers to execute code when that happens. This allows greater
    flexibility to the developers and smooth usability to the end user.


    When the end user does something on the web page, an event is said to take place.
    In addition to user-initiated events, there are some events like “load” which
    is executed when the page has finished loading, for instance.


    Example: <p> This is a paragraph </p> <script language="text/javascript">addEventListener("click",
    function(){


    ```

    console.log("You clicked!");</script> This code snippet attaches an “Event Listener”
    to the DOM element <p> and attaches an anonymous function which gets when the
    element is clicked, and the console displays “You clicked!” that happens. The
    event handler for a specific event to take place and when it happens, it handles
    the event by executing the code that the anonymous function has within itself.

    ```'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Earlier event handling methods


    In the initial days when the event-handling was being developed, it supported
    just a handful of events. The mouseover and mouseout events were very successful
    and gained popularity instantly and were on every other page. Apart from that,
    there was the addition of the event handler that could detect whether the user
    had submitted a form and executed functions when it detected true.


    These initial events led to a revolution, and an enormous set of events developed
    were released later. The interaction was not limited to something. Developers
    could now make the web page come alive and react to different user actions.


    A typical event handler back in the hay days looked somewhat like this: <a href="#"
    onclick=''alert("Clicked");''>'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Event handling today


    The number of events that a typical modern browser supports today has grown to
    an enormous extent if compared to the 2000s. Also, back then most of the event
    handlers were spilled here and there on anchor links and buttons on the HTML code,
    and it was very absurd to even look at, let alone debug. Today, almost every event
    handler can be coded entirely in the JavaScript file. We don''t have to clutter
    up the HTML code. Further, we have also been given the freedom to attach multiple
    event handlers that were not possible back then.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# Event objects


    The built-in function addEventListener() takes two arguments, the first one being
    the Event object. Event gives us the information about the event in the form of
    an object, like say click, scrollTop mousedown, mouseover, etc. For example, in
    the previous example if we were to know what button was clicked, we can look at
    the object''s which property


    ```

    <button>Click any way you want</button><script>var button = document.querySelector("button");
    button.addEventListener("mousedown", function(event){nif(event.which==1) console.log("Left
    Button"); else if(event.which==2) console.log("Middle Button"); else if(event.which==3)
    console.log("Right Button");});</script>The information stored in an event object
    differs per type of event. The object''s typeproperty always holds a string identifying
    the event.

    ```


    Let’s look at some common HTML5 events:


    +   * Mouse Events

    * Keyboard Events

    * Browser Events

    * Form Events

    * CSS Animation Events

    * CSS Transition Events

    * Media Events

    * Progress Events'
  merge: -1
  pgno: 117
- img_proc: true
  md: "# Mouse events\n\nThe mouse events are fired when the system detects a change\
    \ in position/state of the pointing device over the element that has the listener\
    \ attached to it.\n\n+   1) mouseenter - This event is fired when the mouse is\
    \ moved any element with the listener is attached to. It acts in a way similar\
    \ to :hover pseudo-class in CSS works.\n   Eg: <a href=\"#\" onmouseover=someFunc()>\
    \ > Element </a> 2) mouseover - This event is fired when the pointing device is\
    \ moved onto the element that has the listener attached to itself or any one of\
    \ its child elements.\n3) mouseup/mousedown - This event is fired when the mouse\
    \ pressed on an element and the mousedown fires when the mouse is released over\
    \ an element.\n4) click - This event is fired when the mouse button (Right or\
    \ Left) has been pressed and released on an element 5) dclick - This event is\
    \ fired when the mouse button (ANY) has been clicked twice on the element.\n6)\
    \ wheel - This event is fired when the wheel button of the mouse is rotated in\
    \ any direction.\n7) mouseleave - This event is fired when the mouse leaves the\
    \ element to which the listener was attached to."
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Keyboard Events


    These are the events when the system detects the change in the state of the keys
    of a keyboard 1) keydown - When any key is pressed on the keyboard, this event
    is fired.


    +   2) keypress - When any key except some special keys like Fn, CapsLock is in
    pressed manner, this event takes place.

    3) keyup - When any key is released from a pressed state, this event takes place.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# Browser events


    Some events do not adhere to what the user clicks or makes changes to, but rather
    the change in the state of some resources native to the browser 1) cached


    +   - This event is fired when the resources that were necessary for the page
    load completes downloading, and the application caching is done.

    2) error - This event is fired if a resource failed to load.

    3) abort - This event is fired when the loading of any particular resource has
    been aborted.

    4) load - This event is fired when the document finishes loading.

    5) beforeunload - This event is fired when the document and all of its resources
    are about to be unloaded.

    6) unload - This event is fired when the document is being unloaded from the disk
    cache.'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# Form Events


    Forms are central to making dynamic pages.


    +   1) reset - This event is fired when the reset button is pressed, i.e. the
    form is reset.

    2) submit - This event is fired when the form is being submitted so that some
    required action can be taken via event handlers.

    3) onblur - This event is fired when the element loses focus 4) onchange - This
    event is fired when the content of the form event is altered.

    5) onfocus - This event is fired when the element gets focus 6) oninput - This
    event is fired when the element gets some input from the user.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# CSS animation events


    The animations done with the help of CSS makes the page pretty, and when we are
    able to know the states of the animation, we can govern it using these events


    +   1) animationstart - This event is fired when a CSS animation has started.
    If there is some animation-delay, this event will fire once the delay time is
    done with.


    +   2) animationend - This event is fired once the animation stops.


    +   3) animationiteration - When the CSS animation is repeated, this event is
    fired.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# CSS Transition events


    A smooth transition made possible using CSS can be further controlled using JavaScript
    event handlers.


    +   1) transitionstart - This event is fired when the CSS transition has actually
    started.

    2) transitioncancel - This event is fired when the CSS transition has been canceled.

    3) transitionend - This event is fired when the CSS transition has completed its
    course of run.

    4) transitionrun - This event is fired when the CSS transition has starting to
    run before any delay whatsoever.'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Media events


    There are various events that fall in this category. The most important and most
    used among them: 1) play - This event is fired when the playback of any media
    begins 2) pause - This event is fired when the media playback is paused.


    +   3) loadmetadata - This event is fired when the metadata has finished loading.


    This is a brief list of events that are commonly used in JavaScript. There are,
    in addition to these, a huge list of events that the modern browser is capable
    of handling.


    To sum it up, events in JavaScript are composed of two things: 1) Event listeners
    2) Event handler'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# Listening for events


    As has been previously stated, everything that one does inside the web browser
    results in some events getting fired so that we get some response and the interactivity
    between the user and the application stays alive. Sometimes, events fire when
    the page loads. Sometimes, they fire for some particular action that you, like
    click a button or hover over some element or submit a form, etc.


    But, what we look for is to make some of the events that hold value to us, be
    commanded over, i.e. execute some task if that specific event occurs. So, we gracefully
    attach an event listener to that event.


    The basic syntax of an event listener is like this: source.addEventListener(eventName,
    eventHandler, false); Let''s break it down and analyze it part-by-part.


    +   1) Source - Source is typically any DOM element that we want to listen for
    events. For instance, an anchor link or window object, etc.


    +   2) The eventName - The function addEventListener is a built-in function that
    takes three arguments, the first one of the event name is the name of the event
    that we''re looking to listen to, like click, mouseover, etc.


    +   3) The eventHandler -This is the second argument that the addEventListener
    function takes which is the function or chunk of code that is to be executed when
    the event that we''re interested in fires. These are almost always anonymous functions.'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'Simple Example: document.addEventListener("click", changeColor, false); The
    source here, in which we''re interested in is the document itself. We''re attaching
    the event with the name click, and the event handler that handles the event changeColor
    which can be defined by the user.


    So far, we have listened for an event using the addEventListener function. Now,
    it''s time to react to that event. That means that we need to define what happens
    when that event is fired. In this particular example, we''ve set the event-handler
    to be a function changeColor. Let''s now define it.


    ```

    function changeColor(){

    console.log("changed the color"); }

    ```'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# Event arguments


    The event handler function after getting called by an event listener also provides
    access to the event object as one of its arguments. This event object has properties
    which are exclusive to that specific event.


    A mouse event object will have different properties than a keyboard event object
    or a browser event object. These objects have their own specialized behavior that
    we can exploit.


    To access this event object, we need to pass it to the event handler as an argument.
    Preferably the letter “e” is used to indicate the event as an argument.


    ```

    function change(e){

    console.log("changed the color"); }

    ```


    All these events have some properties/attributes in common. The major reason is
    that all these events are derived from the basic Event type which has been discussed
    earlier. Some of these events are: 1) preventDefault 2) target 3) type 4) target
    5) stopPropagation 6) currentTarget'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Removing an event listener


    When there’s a need to add some event listeners to DOM element, there is an equal
    need to remove these listeners from the elements. This is done using the removeEventListener()
    function whose basic structure and signature is basically the same as addEventListener().


    ```

    source.removeEventListener(eventName, eventHandler, false);

    ```'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# CONCLUSION


    That should give you a basic idea of how events are used in JavaScript and why
    is it necessary to use them in the first place. The things to note are that events
    are anything that happens in the application, and we can attach event-listeners
    to make sure we get to know when that event occurs so that we can execute some
    code at that time.


