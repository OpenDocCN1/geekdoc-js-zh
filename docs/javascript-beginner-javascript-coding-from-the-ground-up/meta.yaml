    \ to :hover pseudo-class in CSS works.\n  Eg: <a href=\"#\" onmouseover=someFunc()>\
    \ > Element </a>\n- 2) mouseover - This event is fired when the pointing device\
    \ is moved onto the element that has the listener attached to itself or any one\
    \ of its child elements.\n- 3) mouseup/mousedown - This event is fired when the\
    \ mouse is pressed on an element and the mousedown fires when the mouse is released\
    \ over an element.\n- 4) click - This event is fired when the mouse button (Right\
    \ or Left) has been pressed and released on an element.\n- 5) dclick - This event\
    \ is fired when the mouse button (ANY) has been clicked twice on the element.\n\
    - 6) wheel - This event is fired when the wheel button of the mouse is rotated\
    \ in any direction.\n- 7) mouseleave - This event is fired when the mouse leaves\
    \ the element to which the listener was attached to.\n\n## Keyboard Events\n\n\
    These are the events when the system detects the change in the state of the keys\
    \ of a keyboard.\n\n- 1) keydown - When any key is pressed on the keyboard, this\
    \ event is fired.\n- 2) keypress - When any key except some special keys like\
    \ Fn, CapsLock is in pressed manner, this event takes place.\n- 3) keyup - When\
    \ any key is released from a pressed state, this event takes place.\n\n## Browser\
    \ events\n\nSome events do not adhere to what the user clicks or makes changes\
    \ to, but rather the change in the state of some resources native to the browser.\n\
    \n- 1) cached\n  - This event is fired when the resources that were necessary\
    \ for the page load completes downloading, and the application caching is done.\n\
    - 2) error - This event is fired if a resource failed to load.\n- 3) abort - This\
    \ event is fired when the loading of any particular resource has been aborted.\n\
    - 4) load - This event is fired when the document finishes loading.\n- 5) beforeunload\
    \ - This event is fired when the document and all of its resources are about to\
    \ be unloaded.\n- 6) unload - This event is fired when the document is being unloaded\
    \ from the disk cache.\n\n## Form Events\n\nForms are central to making dynamic\
    \ pages.\n\n- 1) reset - This event is fired when the reset button is pressed,\
    \ i.e. the form is reset.\n- 2) submit - This event is fired when the form is\
    \ being submitted so that some required action can be taken via event handlers.\n\
    - 3) onblur - This event is fired when the element loses focus.\n- 4) onchange\
    \ - This event is fired when the content of the form event is altered.\n- 5) onfocus\
    \ - This event is fired when the element gets focus.\n- 6) oninput - This event\
    \ is fired when the element gets some input from the user.\n\n## CSS animation\
    \ events\n\nThe animations done with the help of CSS makes the page pretty, and\
    \ when we are able to know the states of the animation, we can govern it using\
    \ these events.\n\n- 1) animationstart - This event is fired when a CSS animation\
    \ has started. If there is some animation-delay, this event will fire once the\
    \ delay time is done with.\n- 2) animationend - This event is fired once the animation\
    \ stops.\n- 3) animationiteration - When the CSS animation is repeated, this event\
    \ is fired.\n\n## CSS Transition events\n\nA smooth transition made possible using\
    \ CSS can be further controlled using JavaScript event handlers.\n\n- 1) transitionstart\
    \ - This event is fired when the CSS transition has actually started.\n- 2) transitioncancel\
    \ - This event is fired when the CSS transition has been canceled.\n- 3) transitionend\
    \ - This event is fired when the CSS transition has completed its course of run.\n\
    - 4) transitionrun - This event is fired when the CSS transition has starting\
    \ to run before any delay whatsoever.\n\n## Media events\n\nThere are various\
    \ events that fall in this category. The most important and most used among them:\n\
    \n- 1) play - This event is fired when the playback of any media begins.\n- 2)\
    \ pause - This event is fired when the media playback is paused.\n- 3) loadmetadata\
    \ - This event is fired when the metadata has finished loading.\n\nThis is a brief\
    \ list of events that are commonly used in JavaScript. There are, in addition\
    \ to these, a huge list of events that the modern browser is capable of handling.\n\
    \nTo sum it up, events in JavaScript are composed of two things:\n1) Event listeners\n\
    2) Event handler\n\n## Listening for events\n\nAs has been previously stated,\
    \ everything that one does inside the web browser results in some events getting\
    \ fired so that we get some response and the interactivity between the user and\
    \ the application stays alive. Sometimes, events fire when the page loads. Sometimes,\
    \ they fire for some particular action that you, like click a button or hover\
    \ over some element or submit a form, etc.\n\nBut, what we look for is to make\
    \ some of the events that hold value to us, be commanded over, i.e. execute some\
    \ task if that specific event occurs. So, we gracefully attach an event listener\
    \ to that event.\n\nThe basic syntax of an event listener is like this: `source.addEventListener(eventName,\
    \ eventHandler, false);` Let's break it down and analyze it part-by-part.\n\n\
    - 1) Source - Source is typically any DOM element that we want to listen for events.\
    \ For instance, an anchor link or window.\n- 2) eventName - The eventName is the\
    \ name of the event we're listening to, like click, mouseover, etc.\n- 3) eventHandler\
    \ - This is the function that is executed when the event fires.\n\nSimple Example:\
    \ `document.addEventListener(\"click\", changeColor, false);` The source here,\
    \ which we're interested in is the document itself. We've set the event-handler\
    \ to be a function named changeColor.\n\n```javascript\nfunction changeColor()\
    \ {\n    console.log(\"changed the color\");\n}\n```\n\n## Event arguments\n\n\
    The event handler function after getting called by an event listener also provides\
    \ access to the event object as one of its arguments. This event object has properties\
    \ which are exclusive to that specific event.\n\nA mouse event object will have\
    \ different properties than a keyboard event object or a browser event object.\
    \ These objects have their own behavior that we can exploit.\n\nTo access this\
    \ event object, we need to pass it to the event handler as an argument. Preferably\
    \ the letter \"e\" is used to indicate the event as an argument.\n\n```javascript\n\
    function change(e) {\n    console.log(\"changed the color\");\n}\n```\n\nAll these\
    \ events have some properties/attributes in common. The major reason is that all\
    \ these events are derived from the basic Event type which has been discussed\
    \ earlier. Some of these events are:\n1) preventDefault\n2) target\n3) type\n\
    4) bubbles\n5) stopPropagation\n6) currentTarget\n\n## Removing an event listener\n\
    \nWhen there’s a need to add some event listeners to DOM element, there is an\
    \ equal need to remove these listeners from the elements. This is done using the\
    \ removeEventListener() function whose basic structure and signature is basically\
    \ the same as addEventListener().\n\n```javascript\nsource.removeEventListener(eventName,\
    \ eventHandler, false);\n```\n\n## CONCLUSION\n\nThat should give you a basic\
    \ idea of how events are used in JavaScript and why is necessary to use them in\
    \ the first place. The things to note are that events are anything that happens\
    \ in the application, and we can attach event-listeners to make sure we get to\
    \ know when that event occurs so that we can execute some code at that time.\n\
    \nThank you very much for downloading JavaScript: Beginner JavaScript Coding From\
    \ The Ground Up! Please be on the lookout for the next book in this series, JavaScript:\
    \ Intermediate JavaScript Coding From The Ground Up. There is more yet left to\
    \ learn to further your coding knowledge base. The journey does not stop at beginner\
    \ for us.\n\nIf you have enjoyed this book, please leave a positive review on\
    \ Amazon to show your support. Your feedback is greatly appreciated!\n"
  mdcn: "\n\n## 鼠标事件\n\n当系统检测到指针设备在绑定了监听器的元素之上的位置/状态发生变化时，就会触发鼠标事件。\n\n- 1) mouseenter\
    \ - 当鼠标移动到任何绑定了监听器的元素上时，会触发此事件。它的工作方式类似于 CSS 中的 `:hover` 伪类。\n  例如：<a href=\"\
    #\" onmouseover=someFunc()> 元素 </a>\n- 2) mouseover - 当指针设备移动到绑定了监听器的元素或其任何一个子元素时，会触发此事件。\n\
    - 3) mouseup/mousedown - 当鼠标在元素上按下时触发 mousedown 事件，当鼠标在元素上释放时触发 mouseup 事件。\n\
    - 4) click - 当鼠标按钮（右键或左键）在元素上按下并释放时，会触发此事件。\n- 5) dclick - 当在元素上点击两次鼠标按钮（任意）时，会触发此事件。\n\
    - 6) wheel - 当鼠标滚轮按钮向任何方向旋转时，会触发此事件。\n- 7) mouseleave - 当鼠标离开绑定了监听器的元素时，会触发此事件。\n\
    \n## 键盘事件\n\n这些事件是在系统检测到键盘按键状态变化时触发的。\n\n- 1) keydown - 当按下键盘上的任何按键时，会触发此事件。\n\
    - 2) keypress - 当按下键盘上的除 Fn 等特殊键以外的任何按键时，会触发此事件。\n- 3) keyup - 当释放键盘上的任何按键时，会触发此事件。\n\
    \n## 浏览器事件\n\n这些事件是在系统检测到浏览器相关页面状态变化时触发的。\n\n- 1) error - 当资源加载失败时，会触发此事件。\n-\
    \ 2) abort - 当资源加载被取消时，会触发此事件。\n- 3) load - 当资源加载完成时，会触发此事件。\n- 4) complete -\
    \ 当整个页面（及其所有资源）加载完成时，会触发此事件。\n- 5) beforeunload - 在页面准备卸载之前，会触发此事件。\n- 6) unload\
    \ - 当页面被卸载时，会触发此事件。\n\n## 表单事件\n\n这些事件是与表单操作相关的。\n\n- 1) reset - 当表单被重置时，会触发此事件。\n\
    - 2) submit - 当表单被提交时，会触发此事件。\n- 3) change - 当表单元素的值发生改变并失去焦点时，会触发此事件。\n- 4) blur\
    \ - 当元素失去焦点时，会触发此事件。\n- 5) focus - 当元素获得焦点时，会触发此事件。\n- 6) input - 当元素的内容值发生变化时，会触发此事件。\n\
    \n## 媒体事件\n\n这些事件是与媒体（如音视频）相关的。\n\n- 1) play - 当媒体播放开始时，会触发此事件。\n- 2) pause -\
    \ 当媒体播放暂停时，会触发此事件。\n- 3) metadata - 当媒体元数据加载完成时，会触发此事件。\n\n## 动画事件\n\n这些事件是与 CSS\
    \ 动画相关的。\n\n- 1) animationstart - 当动画开始时，会触发此事件。\n- 2) animationend - 当动画结束时，会触发此事件。\n\
    - 3) animationiteration - 当动画每循环一次时，会触发此事件。\n\n## 过渡事件\n\n这些事件是与 CSS 过渡相关的。\n\n\
    - 1) transitionstart - 当过渡开始时，会触发此事件。\n- 2) transitioncancel - 当过渡被取消时，会触发此事件。\n\
    - 3) transitionend - 当过渡完成时，会触发此事件。\n\n"
