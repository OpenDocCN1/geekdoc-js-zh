    \ formed points to the date and time which you get by adding the specified number\
    \ of milliseconds added to Jan 1st of 1970 UTC+0. These milliseconds passed since\
    \ Jan 1st of 1970 UTC+0 used to specify date and time is called timestamp.\n\n\
    \  Example: car example = new Date (24 3600 1000); //adding one day console.log(\
    \ example ); // Fri Jan 02 1970 ...\n\n+   - new Date(datestring)\n  If the date\
