    \n# KEITH DVORJAK\n\n# JavaScript Beginner JavaScript Coding\nFrom The Ground\
    \ Up\n\n© Copyright 2017 by Keith Dvorjak - All rights reserved.\n\nThe transmission,\
    \ duplication, reproduction of any of the following work including specific information\
    \ will be considered an illegal act irrespective of if it is done electronically\
    \ or in print. This extends to creating a secondary or tertiary copy of the work\
    \ or a recorded copy and is only allowed with express written consent from the\
    \ Publisher. All additional right reserved.\n\nThe information in the following\
    \ pages is broadly considered to be a truthful and accurate account of facts and\
    \ as such any inattention, use or misuse of the information in question by the\
    \ reader will render any resulting actions under their purview. There are no scenarios\
    \ in which the publisher or the original author of this work can be in any fashion\
    \ deemed liable for any hardship or damages that may befall after undertaking\
    \ information described herein.\n\nAdditionally, the information in the following\
    \ pages is intended only for informational purposes and should be thought of as\
    \ universal. As befitting its nature, it is presented without assurance regarding\
    \ its prolonged validity or interim quality.\n\n# Table of Contents\n\n- Chapter\
    \ 1: Introduction to JavaScript\n- Chapter 2: Main features of JavaScript\n- Chapter\
    \ 3: Real-life uses of JavaScript\n- Chapter 4: Your first JavaScript program\n\
    - Chapter 5: Embedding JavaScript code in HTML\n- Chapter 6: Basic display operations\
    \ in JavaScript\n- Chapter 7: Variables, data types & constants\n- Chapter 8:\
    \ Basic Operators\n- Chapter 9: Functions in JavaScript\n- Chapter 10: Understanding\
    \ objects\n- Chapter 11: Scope of a variable\n- Chapter 12: Working with numbers\
    \ in JavaScript\n- Chapter 13: Working with strings in JavaScript\n- Chapter 14:\
    \ Working with date and time in JavaScript\n- Chapter 15: Events in JavaScript\n\
    - Conclusion\n\n## CHAPTER 1\n\n## INTRODUCTION TO JAVASCRIPT\n\nJavaScript is\
    \ known as the \"language of the web\" because it is used in the development of\
    \ an incredibly high number of applications on the web and the mobile paradigm\
    \ alike. It is the language which makes web applications dynamic so that users\
    \ can interact with them, which provides a rich user experience.\n\nWhen JavaScript\
    \ came into existence around 1995, most of the logical calculations and input\
    \ validations in web pages were primarily done using server-side languages like\
    \ PHP. The process was very long and unnecessarily involved two-way trips, first\
    \ to send a request to the server and then get the data/error back to the client's\
    \ computer. It was a huge letdown to UX. The need of that time was to make validations\
    \ right on the client's computer before sending to the server, thereby reducing\
    \ the bandwidth, which at that time was a major issue that the user would not\
    \ have to wait just to see if he made any errors while typing out that form.\n\
    \nJavaScript was created by Brendan Eich as \"LiveScript\" in 1995, which got\
    \ renamed to \"JavaScript.\" It was initially named \"Mocha\" but then renamed\
    \ JavaScript to gain traction with the language Java that was getting popular\
    \ at the same time. The first major standardization occurred in the form of ECMA\
    \ standardization. The first version developed still lacked features like REGEX\
    \ and JSON and some important built-in functions. The language kept getting developed\
    \ and adding features to its repertoire.\n\nIt was the ECMA v3 that saw the birth\
    \ of AJAX (Asynchronous JavaScript and XML), which today is at the core of every\
    \ web application and framework.\n\nAt present, the language is packed with exciting\
    \ new features. Let's look at the advantages one gets with JavaScript:\n\n- JavaScript\
    \ is a lightweight, interpreted programming language.\n- Designed for creating\
    \ simple as well as complex web applications\n- Furthers the functionality of\
    \ web pages\n- Animations and Visual effects can be done easily\n- UI/UX improvements\n\
    \nOwing to the language's success and usability, many frameworks and libraries\
    \ like jQuery, Angular JS, React JS have been developed which make writing code\
    \ in JavaScript delight.\n\nJavaScript is the scripting language that is being\
    \ actively used by developers around the globe in creating interactive web applications\
    \ that are visually appealing and at the same time packed with functionalities\
    \ just like the desktop applications.\n\nIt means that web pages are not static\
    \ in nature. The elements can be modified and made interactive, functional and\
    \ animated by the use of this language as a scripting tool.\n\nJavaScript began\
    \ as a client-side scripting language but is being used on the backend side of\
    \ the web also in the form of Node.js. Many libraries and frameworks have sprung\
    \ up in the meantime to make the developer's life easy.\n\nJavaScript has built-in\
    \ as well as user-defined methods/functions that allow themselves to get bound\
    \ to certain buttons or elements and can be called whenever and wherever. These\
    \ functions are being actively used to automate tasks like the setTimeout() or\
    \ setInterval() functions that can be called after a period of time to do some\
    \ task. JavaScript can be used in the HTML file itself, if it is written into\
    \ the <script> tags, and can also be attached to it as an external file. The extension\
    \ of a JavaScript program is '.js.'\n\nJavaScript is often abbreviated as JS.\
    \ Some of the main features of the language are as follows:\n\n- High-level, Weakly\
    \ Typed\n- Interpreted\n- Functional\n- Object-Oriented\n\nObject-Oriented design\
    \ is perhaps the most important feature of JavaScript, as it allows us the creation\
    \ of objects and establishes relationships between them, commonly known as Inheritance\
    \ and Encapsulation, which you'll come to know about in the proceeding chapters.\n\
    \n## CHAPTER 2\n\n## MAIN FEATURES OF JAVCRIPT\n\nMost of the features of JavaScript\
    \ are more or less same as that of programming languages. Almost all programming\
    \ languages have these features. The main features are as follows:\n\n### 1. JavaScript\
    \ Variables\n\nOne of the very important features of JavaScript is variables.\
    \ They act as the storage containers for values. In other words, they are the\
    \ names of memory locations at which the values are stored. These values can be\
    \ an integer, decimal values, strings or single characters. The variable names\
    \ have to be unique. This is important because otherwise, this will create a great\
    \ amount of confusion. The name of the variable can start from an alphabet, dollar\
    \ sign or underscore signs. The names are case-sensitive. You will get to know\
    \ exact rules for naming a variable in the later chapter.\n\nExamples of some\
    \ variables are: var abcd; var $abc;\n\n### 2. JavaScript Objects\n\nObjects are\
    \ nothing but a collection of some data values. These generally are written as\
    \ name-value pairs. For example: var name = {firstName:\"Amit\", lastName:'Kumar\"\
    , age:70}; To access the values in an object, we use dot notation. For example,\
    \ if you want to access the lastName present in name object, we can write that\
    \ as name.lastName. Arrays are a type of object.\n\n### 3. JavaScript Comments\n\
    \nComment is a feature which is often neglected by novice programmers, but as\
    \ one starts getting experienced at coding, they realize the great value it brings\
    \ to the code. These are basically a way to create notes in the code. This improves\
    \ the readability of the code. They are not executed by the compiler.\n\nThere\
    \ are two types of comments:\n\n- a. Single line comments\n- b. Multi-line comments\n\
    \  - a. Single line comments: As as the name suggests, is used when the comments\
    \ are single line For example: var name; //name of the customer\n  - b. Multi-line\
    \ comments: This is used if the length of the comment goes beyond a line. For\
    \ example: /* This program calculates the factorial of a number */\n\n### 4. JavaScript\
    \ Functions or methods\n\nFunctions form an integral part of any programming language.\
    \ Function helps us write code in an efficient manner which not only improves\
    \ the readability but also contribute a great deal while maintaining it. A function\
    \ is a set of statements which are used to carry out a particular task. For example:\
    \ function addTwoNumbers(num1, num2) {\n\n```javascript\nreturn num1+num2; //Calculates\
    \ and returns the sum\n}\n```\n"
  mdcn: "\n\n# JavaScript\n\n初学者 JavaScript 编程\n从零开始\n\n![](img/9a74f36f67e833039c3e1d4feac705ea_0_0.png)\n\
    \n# KEITH DVORJAK\n\n# JavaScript 初学者 JavaScript 编程\n从零开始\n\n© Copyright 2017\
    \ Keith Dvorjak - 保留所有权利。\n\n无论是以电子形式还是印刷形式，对以下任何作品（包括特定信息）的传输、复制、复制都将被视为非法行为。这适用于创建作品的二级或三级副本或录制副本，并且在获得出版者明确书面许可的情况下允许。保留所有其他权利。\n\
    \n后续页面中的信息被广泛认为是对事实的真实准确的描述，因此，读者对相关信息的任何疏忽、使用或误用都将对其权限范围内产生的任何结果承担责任。在任何情况下，出版者或本书的原始作者都不会对采取本文所描述的信息后可能发生的任何困难或损害承担任何责任。\n\
    \n此外，后续页面中的信息仅供参考之用，应被认为是通用的。根据其性质，这些信息的呈现不对其长期有效性或中间质量提供保证。\n\n# 目录\n\n- 第 1\
    \ 章：JavaScript 简介\n- 第 2 章：JavaScript 的主要特性\n- 第 3 章：JavaScript 的实际应用\n- 第 4 章：你的第一个\
    \ JavaScript 程序\n- 第 5 章：在 HTML 中嵌入 JavaScript 代码\n- 第 6 章：JavaScript 中的基本显示操作\n\
    - 第 7 章：变量、数据类型与常量\n- 第 8 章：基础运算符\n- 第 9 章：JavaScript 中的函数\n- 第 10 章：理解对象\n- 第\
    \ 11 章：变量的作用域\n- 第 12 章：在 JavaScript 中处理数字\n- 第 13 章：在 JavaScript 中处理字符串\n- 第\
    \ 14 章：在 JavaScript 中处理日期和时间\n- 第 15 章：JavaScript 中的事件\n- 结论\n\n## 第一章\n\n## JavaScript\
    \ 简介\n\nJavaScript 被称为“网页语言”，因为它被用于大量的 Web 和移动应用程序。它是让 Web 变得动态的语言，使用户能够与之交互，提供丰富的用户体验。\n\
    \n当 JavaScript 在 1995 年左右诞生时，网页中的大多数逻辑计算和输入验证主要是使用 PHP 等服务器端语言完成的。这个过程非常漫长，并且涉及不必要的双向传输：首先向服务器发送请求，然后将数据/错误返回到客户端计算机。这对用户体验（UX）来说是一个巨大的遗憾。当时的需求是在发送到服务器之前，直接在客户端计算机上进行验证，从而减少带宽——这在当时是一个主要问题，用户不需要为了查看自己在填写表单时是否输入了任何错误而等待。\n\
    \nJavaScript 由 Brendan Eich 在 1995 年创建的，最初名为“LiveScript”，后来被更名为“JavaScript”。它最初被命名为“Mocha”，但后来改为\
    \ JavaScript，以获得当时流行的 Java 语言的关注度。第一次重大标准化是以 ECMA 标准化的形式出现的。开发的第一个版本仍然缺乏 REGEX\
    \ 和 JSON 以及一些重要的内置函数。该语言不断发展并向其功能库中添加新功能。\n\nECMA v3 见证了 AJAX（异步 JavaScript 和\
    \ XML）的诞生，如今它是每个 Web 应用程序和框架的核心。\n\n目前，该语言充满了许多令人兴奋的新特性。让我们来看看使用 JavaScript 带来的优势：\n\
    \n- JavaScript 是一种轻量级的、解释型的编程语言。\n- 设计用于创建简单及复杂的 Web 应用程序\n- 增强了网页的功能\n- 可以轻松实现动画和视觉效果\n\
    - UI/UX 的改进\n\n由于该语言的成功和易用性，开发了许多如 jQuery、Angular JS、React JS 等框架和库，使得编写 JavaScript\
    \ 代码变成了一件享受。\n\nJavaScript 是一种全球开发者都在积极使用的脚本语言，用于创建视觉上吸引人且功能上类似于桌面应用程序的交互式 Web\
    \ 应用程序。\n\n这意味着网页在本质上不是静态的。通过这种语言作为脚本工具，可以对元素进行修改并使其具有交互性、功能性和动画。\n\nJavaScript\
    \ 最初是客户端脚本语言，但现在也以 Node.js 的形式用于 Web 后端。在此期间出现了许多库和框架来简化开发者的生活。\n\nJavaScript\
    \ 有内置以及用户定义的方法/函数，允许它们绑定到某些按钮或元素上，并随时随地被调用。这些函数被积极用于自动化任务，例如 `setTimeout()` 或\
    \ `setInterval()` 函数，它们可以在一段时间后调用以执行某些任务。JavaScript 可以直接写在 HTML 文件中（如果写入 `<script>`\
    \ 标签中），也可以作为外部文件附加它。JavaScript 程序的扩展名是 `.js`。\n\nJavaScript 通常缩写为 JS。该语言的一些主要特性如下：\n\
    \n- 高级、弱类型\n- 解释型\n- 函数式\n- 面向对象\n\n面向对象的设计也许是 JavaScript 最重要的特性，因为它允许我们创建对象并建立它们之间的关系，通常被称为“继承”和“封装”，你将在后续章节中了解到这些内容。\n\
    \n## 第二章\n\n## JavaScript 的主要特性\n\nJavaScript 的大多数特性在某种程度上与其他编程语言相同。几乎所有的编程语言都具有这些特性。主要特性如下：\n\
    \n### 1. JavaScript 变量\n\nJavaScript 的非常重要的特性之一是变量。它们充当值的存储容器。换句话说，它们是存储值的内存位置名称。这些值可以是整数、小数、字符串或单个字符。变量名必须是唯一的。这很重要，因为否则将造成巨大的混乱。变量名可以从字母、美元符号或下划线开始。名称对大小写敏感。你将在章节章节中了解变量命名的精确规则。\n\
    \n一些变量的示例：`var abcd; var $abc;`\n\n### 2. JavaScript 对象\n\n对象无非某些数据值的集合。它们通常以键值对的形式编写。例如：`var\
    \ name = {firstName:\"Amit\", lastName:'Kumar', age:70};` 要访问对象中的值，我们使用点符号（dot\
    \ notation）。例如，如果你想访问 `name` 对象中的 `lastName`，我们可以写成 `name.lastName`。数组是对象的一种。\n\
    \n### 3. JavaScript 注释\n\n注释是初学者经常忽视的特性，但随着编程经验的增加，他们意识到它为代码带来的巨大价值。这些基本上是在代码中创建笔记的方法。这提高了代码的可读性。它们不会被编译器执行。\n\
    \n注释有两类类型：\n\n- a. 单行注释\n- b. 多行注释\n  - a. 单行注释：顾如其名，用于注释单行内容。例如：`var name; //name\
    \ of the customer`\n  - b. 多行注释：如果注释长度超过一行则使用。例如：`/* This program calculates the\
    \ factorial of a number */`\n\n### 4. JavaScript 函数或方法\n\n函数是任何编程语言不可或缺的一部分。函数帮助我们以高效的方式编写代码，不仅提高了代码的可读性，而且在维护方面做了巨大贡献。函数是一组用于执行特定任务的语句。例如：`function\
    \ addTwoNumbers(num1, num2) {`\n\n```javascript\nreturn num1+num2; //Calculates\
    \ and returns the sum\n}\n```\n\n"
