    ## Math 函数


    算术运算符并不能涵盖你对数字的所有操作。要执行如求平方根或数字的绝对值等操作，你必须使用 Math 函数。这些函数的通用语法为 `Math.method(argument)`。


    第一组函数是 `Math.round()`、`Math.ceil()` 和 `Math.floor()`。`Math.round()` 函数将数字四舍五入为整数。如果小数点后的第一位数字大于或等于
    5，则向上舍入到下一个整数；如果小于 5，则向下舍入到上一个整数。`ceil` 函数与之相似，但总是将数字向上取整到下一个整数，而 `floor` 函数总是将其向下取整到上一个整数。


    ```

    var x = 25.52;

    var y = 25.19;


    var xRound = Math.round(x); var yRound = Math.round(y); var xCeil = Math.ceil(x);
    var yCeil = Math.ceil(y); var xFloor = Math.floor(x); var yFloor = Math.floor(y);
    xRound 将为 26，yRound 将为 25。xCeil 和 yCeil 都将为 26，xFloor 和 yFloor 将为 25。Math.pow()
    函数可用于计算一个数字的另一个数字的幂。例如：var x = Math.pow(2,10); x 将为 1024。求平方根（即 ½ 次幂）是一个非常常见的操作，你可以使用
    Math.sqrt(x) 来执行它：var x = Math.sqrt(9); 此时 x 将为 3。Math.abs() 函数返回传递给它的数字的绝对值。


    ```

    var x = Math.abs(-2); X 将为 2。Math.min() 和 Math.max() 函数可以用于找到给定的数字列表的最小值和最大值。它们可以接受任意数量的参数。


    ```

    var maximum = Math.max(10,12,14,3,7,1,3); var minimum = Math.min(10,12,14,3,7,1,3);
    Maximum 将取值 14，minimum 将取值 1。math 库还包含三角函数的内置函数 sin、cos 和 tan 以及它们的反函数。这些函数分别是
    Math.sin()、Math.cos()、Math.tan()、Math.asin()、Math.acos()、Math.atan()。所有这些函数都以弧度运行，因此你应该将任何角度的角度转换为弧度后再使用。


    ```

    var sinpi = Math.sin(Math.PI); Sinpi 将取值 0。最后，Math.log() 函数允许你找到数字的自然对数。


    ```

    var logten = Math.log(10);


    ```


    logten 将取值 2.302。JS 在 Math 库中也有几个数学常数，例如 Pi 和 E。


    ## 随机数


    对于加密和视频游戏等情况，随机数非常重要。要生成随机数，你可以使用 Math.random() 函数。Math.random() 函数返回 0 到 1 之间的随机数，包含
    0但不包含 1。


    ```

    var n = Math.random(); N 每次都会取一个不同的值。在需要两个数字 a 和 b 之间的随机数的情况下，可以使用以下代码：randn =
    a + (Math.random() * (a-b)); 这将始终给你一个 a 和 b 之间的数字。要获取 a 和 b 之间的整数，可以使用我们上面看到的
    floor、ceil 或 round 函数。

    ```


    ## 第 13 章


    ## 在 JAVASCRIPT 中处理字符串


    字符串是一组字符。它存储了一系列字符。如前面的章节所述，我们使用单引号或双引号来存储字符串。例如：var name="Amit"; //双引号 或者，


    ```

    var name= ‘Amit’; //单引号

    ```


    如果字符串本身包含单引号或双引号怎么办？例如：desc= “He is referred as the “Don” among his colleagues’;
    //错误 或者


    ```javascript

    var desc = ‘It’s alright’; //错误

    ```


    在这些情况下，我们利用转义字符（ \ ）来以正确的方式界定我们的字符串。转义字符告诉编译器后面跟着特殊字符。让我们通过一个例子来更好地理解这一点。


    ```

    var desc= “He is referred to as the \Don" among his colleagues”; 或者，


    ```javascript

    var desc = ‘It’s alright’; //错误

    ```


    有时我们也可以使用简单的方法。如果字符串包含双引号，则用单引号包裹整个字符串；如果字符串包含单引号，则用双引号包裹整个字符串。例如：var answer =
    "It’s alright"; var desc= ‘He is referred to the “Don” among his colleagues’;
    转义字符也可以用于其他特殊字符，如反斜杠 (\)、退格符 (\b)、回车 (\r) 等。


    每个字符串都有一个名为 length 的内置属性，可以用于知道字符串的长度。例如：var textRand = “INDIA"; var len=textRand.length;
    //len 将存储 5


    有时字符串可能会比通常长。在这些情况下，字符串可能无法单行显示。这通常会导致混困。为了防止这产生混困并引起问题，我们将字符串分为两部分，然后使用它进行连接。


    有许多与字符串相关的方法和各种属性，使得字符串的操作变得简单。让我们逐一查看。


    ### 1. Length 属性

    每个字符串都有一个相关的 length 属性。它返回字符串字符的数量。

    例如：var randText="ABC DEF GHI"; var len=randText.length; //len 将包含 11


    ### 2. indexOf 方法

    该方法返回指定文本在字符串中第一次出现的位置（索引）。如果未找到指定的字符串，则返回 -1。索引从 0 开始。

    例如：var text = "My name is Amit"; var ind = text.indexOf("Amit"); //将返回 11，因为 Amit
    存在于位置 11


    ### 3. lastIndexOf 方法

    该方法返回给定文本在字符串中最后一次出现的位置（索引）。如果未找到指定的字符串，则返回 -1。


    ```

    var text = "Our own planet earth is a great planet"; var n = str.lastIndexOf("planet");
    //这将返回 31，因为 planet 的最后一次出现是在 31

    ```

    注意：上述两种方法也接受第二个参数，该参数是搜索开始的位置。


    ```javascript

    var text = "My name is Amit"; var ind = text.indexOf("Amit",2); // 在这种情况下，搜索从索引
    2 开始

    ```


    ### 4. search 方法

    search 方法的行为与 indexOf() 方法完全相同。然而，它不接受任何第二个参数。因此，在这种情况下，搜索在所有情况下都从索引 0 开始。这用于使用正则表达式搜索字符串模式。


    ### 5. slice 方法

    slice() 方法两个参数——start（开始）和 end（结束）。正如名称所示，slice 返回从开始索引到结束索引的字符串。

    例如：var country = "India, Bahama, Fiji";


    ```javascript

    var res = country.slice(7, 13); //这将返回 Bahama // 如果省略第二个参数，字符串的剩余部分将被切掉。

    ```


    '
