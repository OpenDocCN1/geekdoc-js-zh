    \ An object is the most fundamental block of JavaScript.\n\n## What are objects?\n\
    \nAn object is a collection of properties and has a type. Just as in other programming\
    \ languages, one can understand the concept of an object by comparing it to real-life\
    \ objects. Let’s take a car, for example, the same model may have a different\
    \ color, i.e., have different properties, but it belongs to the same category\
    \ which is a car, i.e., it is of the same type.\n\nHere is an example for understanding\
    \ the object's concept as described above more clearly: function car(color, numberPlate)\
    \ {\n\n```javascript\n//this is like blueprint of object, not the object it self\
    \ this.color = color;\nthis.numberPlate = numberPlate; // \n//Creating Objects:\
    \ var car1 = new car(\"Green\", 1234);//they are of same type\nvar car2 = new\
    \ car(\"Red\", 5678);//but have different properties\nconsole.log(car1);//outputs\
    \ car1 details, i.e. Green and 1234 on console\nconsole.log(car2);//outputs car2\
    \ details, i.e. Red and 5678 on console\n```\n\n# Accessing object’s properties\n\
    \nIn JavaScript, you can access the object properties in two ways, viz, the dot\
    \ notation and the bracket notation. The syntax of both ways are as follows:\n\
    myObject.propertyName; //dot notation\nmyObject['propertyName']; //bracket notation\n\
    Note that if the object property is integral, then it can be accessed only with\
    \ bracket notation, example: myObject.55 //WRONG\n\n```javascript\nmyObject['55'];\
    \ //RIGHT\n```\n\n# Creating objects In JavaScript\n\nListed below are the ways\
    \ to create objects in JavaScript:\n\n- **Object Literal:**\nThis is the most\
    \ common and probably the easiest way of creating an object in JavaScript.\n\n\
    Example: var myObject = {\n\n```javascript\nobjectProperty1: 45, objectProperty2:\
    \ ‘something else’, objectMethod\nfunction() {//using call as object property\
    \ console.log(this.objectProperty1,\nthis.objectProperty2)/prints object property\
    \ on console\n};myObject.objectMethod();//example call to object method/function\
    \ \n```\n\n- **the ‘new’ keyword:**\nYou can create objects by calling the object\
    \ constructor(a function used to initialize new objects) with ‘new’ keyword.\n\
    \nExample: var myObject = new Object();//constructor to initialize new object\
    \ myObject.property1 = 45; myObject.property2 = ‘something else’;\nmyObject.objectMethod\
    \ = function() { /* ... */ }; You can also define your own constructor function\
    \ to create new objects; the constructor function is like a blueprint of your\
    \ object, you can create many objects ensuring that they are all of the same types,\
    \ though they may different properties.\n\nExample of custom constructor function:\
    \ function students(name, age, class) {\n\n```javascript\nthis.name = name; this.age\
    \ = age; this.class = class\n//using ‘new’ keyword to create object from custom\
    \ constructor function: var\nstudent1 = new student(“Sam”, 14, 2);//a student\
    \ with name sam and age 17 of\nvar student2 = new student(“Joe”, 17, 11);//a student\
    \ of age 17 and class 11\n```\n\n# Nested objects\n\nYou can create an object\
    \ within an object. This can be done by assigning an object to an object’s property.\
    \ This is called nesting.\n\nExample: var student = {\n\n```javascript\nname:\
    \ “Mark”, marks : { //nesting maths: 80, english: 95\n}\n```\n\n```javascript\n\
    ; //nested objects can be referenced like this: student.marks.maths; // dot notation\n\
    student['marks']['maths'] // bracket notation\n```\n\n# Use of ‘this’ keyword\
    \ In objects\n\nThe keyword ‘this’ inside an object references the object in which\
    \ it is being used. It is used to access or assign values to the object properties\
    \ from within itself.\n\nExample: function objectConstructor(value) {\n\n```javascript\n\
    this.objectProperty = value; //assigning new value to our object console.log(\n\
    this.objectProperty ); //accessing our object’s property\n}\n```\n\n# Objects\
    \ are reference data types\n\nPrimitive data types are referenced by their values\
    \ whereas reference data types are referenced by their address.\n\nUnderstanding\
    \ the difference with an example: // Primitive data types: var x = 45; var y =\
    \ x = 10; console.log(x); // 10\n\n```javascript\nconsole.log(y); // 45\n```\n\
    \nAs you can see in the above example, altering the value of ‘x’ didn’t have any\
    \ effect on value of ‘y’, but it is not the same with reference data types\n\n\
    ```javascript\nvar x = { value: 45 }; // object reference data type\nvar y = x;\
    \ x.value = 10;\nconsole.log(x.value); // 10\nconsole.log(y.value); // 10\n```\n\
    \nAs you can see in the above example, altering the value of ‘x’ didn’t have any\
    \ effect on value of ‘y’, but it is not the same with reference data types being\
    \ referenced by address. This is why objects in JavaScript are said to be Mutable,\
    \ meaning changeable.\n\n# Removing an object’s property\n\nAs studied in chapter\
    \ 5, we can use the ‘delete’ operator to delete an object’s property. To delete\
    \ a property from an object, you have to write the ‘delete’ operator followed\
    \ by the object with its property to be deleted.\n\nExample: var student = {\n\
    \n```javascript\nname:'Joe', age: 16\n}; console.log(student.age);//16\ndelete\
    \ student.age;//deleting the property console.log( student.age ); //gives an error\
    \ saying ‘undefined’\n```\n\n# Looping through object’s properties\n\nYou can\
    \ loop through object’s properties with the help of for-in loop.\n\nExample: var\
    \ carList = {\n\n```javascript\ncar1: 'Mustang', car2: 'Beetle', car3: 'Viper'\n\
    }; //looping thorough object's properties: for(var property in carList) {\nconsole.log(\
    \ property ); //outputs Mustang, Beetle, Viper }\n```\n\nAn alternative to loop\
    \ through object's properties is to use the Object.key() method of the Object\
    \ class to obtain an array of keys and loop through that array to access the properties\
    \ of objects.\n\nExample: //using the same object as the example above for (const\
    \ propertyName\nof Object.keys(carList)) {\n\n```javascript\nconsole.log(carList[propertyName]);\
    \ }\n```\n\nYou have learned how to work with objects in JavaScript. I hope you\
