  md: '# The Math functions


    Arithmetic operators don''t cover all you you need to do with numbers. To do things
    like finding the square root or the absolute value of a number, you have to use
    the Math functions. These are generally used by the syntax Math.method(argument).


    The first set of functions are Math.round(), Math.ceil(), and Math.floor(). The
    Math.round() function rounds a number to an integer. If the first digit after
    the decimal place is greater than or equal to 5, it rounds up to the next integer,
    and if it is less than 5, it rounds down to the previous integer. The ceil function
    is similar except always rounds a number up to the next integer, and the floor
    function always rounds it down to the previous integer.


    var x = 25.52;

    var y = 25.19;


    var xRound = Math.round(x); var yRound = Math.round(y); var xCeil = Math.ceil(x);
    var yCeil = Math.ceil(y); var xFloor = Math.floor(x); var yFloor = Math.floor(y);
    xRound will be 26 and yRound 25. xCeil and yCeil will both be 26, and xFloor and
    yFloor will be 25. The Math.pow() function can be used to find a number raised
    to the power of another number. For example: var x = Math.pow(2,10); x will be
    1024. Finding the square root, or the power of ½, is a very common operation,
    which you can perform using Math.sqrt(x): var x = Math.sqrt(9); And x will be
    3. The Math.abs() function returns the absolute value of a number passed to it.


    var x = Math.abs(-2); X will be 2. The Math.min() and Math.max() functions can
    be used to find the minimum and maximum of a list of numbers given to them. They
    can take any number of arguments.'
