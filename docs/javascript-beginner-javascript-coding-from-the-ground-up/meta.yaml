    \ 字符串还有许多其他方法，你可以在网上搜索它们。\n\n# 第 14 章\n\n# 在 JAVASCRIPT 中处理日期和时间\n\n日期和时间操作是 JavaScript\
    \ 的重要部分，作为一名开发者，你将面临日期和时间起至关作用的情况。\n\n# 'Date' 对象\n\n在 JavaScript 中，我们使用内置的 'Date'\
    \ 对象来处理日期和时间；它提供了许多实用的函数用于高效的日期和时间操作。\n\n# 初始化 ‘Date’ 对象\n\n你可以借助 JavaScript 中的\
    \ `new` 操作符来初始化一个新的日期对象。你可以用四种格式来初始化日期对象，列如下：\n\n- new Date()\n  当不带任何参数初始化时，日期对象指向当前的日期和时间。\n\
