  md: '# FUNCTIONS IN JAVASCRIPT


    Functions form an integral part of any programming language. If not for the functions,
    our program would contain lots of redundant code. Function helps us write code
    in an efficient manner which not only improves the readability but also contribute
    a great deal while maintaining it. Let us explore what a function is and why it
    is required!


    A function is a set of statements which are used to carry out a particular task.
    It is as simple as saying that you have a function which carries out the addition
    of two numbers. So at any point in the program, if you need to calculate the sum
    of two numbers, you just call this particular function and pass the two values
    to be added. The function will then return the desired value. Let us first look
    at the syntax for declaring and defining a function and then we will discuss in
    detail about it.


    ```

    functionName(parameter1, parameter2, parameter3) {

    //set of statements to be executed }

    ```


    As you can see above, a function definition starts with the keyword "function,"
    followed by a unique function name, followed by a parenthesis (). The task which
    the function is supposed to execute is written curly braces. Whenever a function
    is called, all the statements within the curly braces will be executed. If you
    notice in the above syntax, there are a set of parameters within the parenthesis
    which are separated by commas. These are the values which the function requires
    in order to produce the desired result. In other words, these are the values one
    must pass while calling the function.


    Let us look at a simple example of a function which accepts two values and return
    their sum.'
