  md: '# innerHTML


    "innerHTML” as the name suggests, represents the inner content of an HTML element.
    So basically we can use innerHTML property to change the content inside any HTML
    element. However, there is a small catch. How will the JavaScript know which element
    we are actually interested in changing? What if it changes the content of all
    the elements in the web page? To solve this problem, we assign an id to the HTML
    element whose content we are interested in changing. That way we will be sure
    as to which element should reflect the changes. The next situation which arises
    in front of us is how we access an HTML element based on the id. In such case,
    we make use of a method called document.getElementById(“ID”).


    Changing the innerHTML property of an HTML element is a common way to display
    data in HTML.


    Let us look at an example here.


    ```

    <!DOCTYPE html> <html><body><h1>Chapter 6</h1> <p>Use of innerHTML to display
    data</p> <p id="new"></p> <script>document.getElementById("new").innerHTML = "This
    is how it’s done";</script> </body></html>

    ```'
  merge: -1
