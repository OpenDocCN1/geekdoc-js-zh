    Example: var example = Date.parse( ''2017-07-17T10:21:35Z'' ); example.toDateString();
    // Mon Jul 17 2017


    This method returns the string which is relative to the local time zone, if you
    want to use string which is relative to UTC then you can use .toUTCString() method
    whose usage is same as this method.


    Comparing two dates It is really easy to compare two dates in JavaScript, it can
    be just as you compare two integers with the comparison operators.

    Example: var date1 = new Date(2017, 5, 10); var date2 = new Date(2011, 4, 9);
    if(date1 > date2) // comparing dates console.log("date1 is bigger!"); else'
