    \ 1970 年 1 月 1 日 UTC+0 加上指定的毫秒数后的日期和时间。自 1970 年 1 月 1 日 UTC+0 经过的毫秒被称为时间戳。\n\n\
    \  示例:var example = new Date (24 3600 1000); // 加上一天 console.log( example ); //\
