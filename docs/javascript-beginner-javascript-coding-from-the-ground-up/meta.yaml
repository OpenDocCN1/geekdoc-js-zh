    - setSeconds(sec [, ms])\n  This method is used to set the second of the minute,\
    \ you can also set the millisecond using this method but is optional.\n  Example:\
    \ var myocard = new Date(); myDate.setSeconds(58);\n- setMilliseconds(ms)\n  This\
    \ method is used to set the millisecond of the second.\n  Example: var myocard\
    \ = new Date(); myDate.setMilliseconds(123);\n- setTime(milliseconds)\n  This\
    \ method is used to set the date and time as timestamp format, which is the number\
    \ of milliseconds since January 1, 1970.\n  Example: var myocard = new Date();\
    \ myDate.setTime(1500286895000); // 2017-07-17T10:21:35Z\n\nPlease note that the\
    \ above-mentioned method sets the component of the date relative to the local\
    \ time zone, if you want them with respect to UTC you can just add the word \"\
    UTC\" after the \"get\" part of the method in the above-mentioned methods, for\
    \ example \"setMinutes()\" becomes \"setUTC()\".\n\n## The Date.now() method\n\
    \nIf you want to get current time as the number of milliseconds passed since January\
    \ 1, 1970, you do not need to create a new date object and then use .getTime()\
    \ method on it. You can do it via Date.now() method.\nExample: console.log( Date.now()\
    \ ); // outputs current time as milliseconds passed since January 1, 1970\n\n\
    ## The Date.parse() method\n\nThis method parses the date string passed as its\
    \ argument and returns it as the number of milliseconds passed since January 1,\
    \ 1970, i.e., as a timestamp. The date string must be in a valid format. The valid\
    \ forms of date strings have been explained earlier in this chapter.\nExample:\
    \ var example = Date.parse('2017-07-17T10:21:35Z'); console.log(example); // 1500286895000\n\
    \nIf the date string is invalid format then this method returns ‘NaN’.\n\n## The\
    \ toString() method\n\nThis method is used to convert the date to a string which\
    \ is in more readable format.\nExample: var example = new Date('2017-07-17T10:21:35Z');\
    \ example.toDateString(); // Mon Jul 17 2017\n\nThis method returns the string\
    \ which is relative to the local time zone, if you want to use string which is\
    \ relative to UTC then you can use .toUTCString() method whose usage is same as\
    \ this method.\n\n## Comparing two dates\n\nIt is really easy to compare two dates\
    \ in JavaScript, it can be just as you compare two integers with the comparison\
    \ operators.\nExample: var date1 = new Date(2017, 5, 10); var date2 = new Date(2011,\
    \ 4, 9); if(date1 > date2) // comparing dates console.log(\"date1 is bigger!\"\
    ); else console.log(\"date2 is bigger\"); This chapter showed how to work with\
    \ date and time in JavaScript.\n\n# CHAPTER 15\n\n## EVENTS IN JAVASCRIPT\n\n\
    ### What is an Event in JavaScript?\n\nIt’s very similar to the literal meaning\
    \ of the word. If anything happens changes the DOM (Document Object Model) tree’s\
    \ structure, it is an event. Some of these events are generated by the user itself,\
    \ like Mouse events or Keyboard events while some events are generated by the\
    \ browser API itself, like scrolling to a particular area of the web page or play/pause\
    \ of a video, page reloads, or window resizes, etc. These events have their properties\
    \ or attributes and are prototyped to contain a function/method which is fired\
    \ when the property/attribute/value of a particular event changes, either by the\
    \ user or automated.\n\nThese events allow developers to execute code when that\
    \ happens. This allows greater flexibility to the developers and smooth usability\
    \ to the end user.\n\nWhen the end user does something on the web page, an event\
    \ is said to take place. In addition to user-initiated events, there are some\
    \ events like “load” which is executed when the page has finished loading, for\
    \ instance.\n\nExample: <p> This is a paragraph </p> <script language=\"text/javascript\"\
    >addEventListener(\"click\", function(){ console.log(\"You clicked!\");</script>\
    \ This code snippet attaches an “Event Listener” to the DOM element <p> and attaches\
    \ an anonymous function which gets when the element is clicked.\n\n### Earlier\
    \ event handling\n\nIn the initial days when event-handling was developed, it\
    \ supported just a handful of events. The mouseover and mouseout events were very\
    \ successful and gained popularity instantly and were on every page. Apart from\
    \ that, there was the addition of the event handler that could detect whether\
    \ the user submitted a form.\n\nThese initial events led to a revolution, and\
    \ an enormous set of events developed were released later. The interaction was\
    \ not limited to something. Developers could now make the web page come alive\
    \ and react to different user actions.\n\nA typical event handler back in the\
    \ hay days looked somewhat like this: <a href=\"#\" onclick='alert(\"Clicked\"\
    );'>\n\n## Event handling today\n\nThe number of events that a typical browser\
    \ supports today has grown to an enormous extent compared to the 2000s. Also,\
    \ back then most of the event handlers were spilled here and there on anchor links\
    \ and buttons on the HTML code, and it was very absurd to even look at, let alone\
    \ debug. Today, every event handler can be coded entirely in the JavaScript file.\
    \ We don't have to clutter up the HTML code. Further, we have also been given\
    \ the freedom to attach multiple event handlers that were not possible back then.\n\
    \n## Event objects\n\nThe built-in function addEventListener() takes two arguments,\
    \ the first one being the Event object. Event gives us the information about the\
    \ event in the form of an object, like say click, scrollTop mousedown, mouseover,\
    \ etc. For example, in the previous example if we were to know what button was\
    \ clicked, we can look at the object's which property\n\n```html\n<button>Click\
    \ any way you want</button><script>var button = document.querySelector(\"button\"\
    ); button.addEventListener(\"mousedown\", function(event){if(event.which==1) console.log(\"\
    Left Button\"); else if(event.which==2) console.log(\"Middle Button\"); else if(event.which==3)\
    \ console.log(\"Right Button\");});</script>\n```\nThe information stored in an\
    \ event object differs per type of event. The object's typeproperty always holds\
    \ a string identifying the event.\n"
