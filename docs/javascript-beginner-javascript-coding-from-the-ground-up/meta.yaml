    # SCOPE OF A VARIABLE


    Variables are created in JavaScript to act as containers to store data. Unlike
    other compiled languages like C/C++ where it is mandatory to define the type of
    data to be stored explicitly, JavaScript makes no such divisions and stores every
    type of data like string, integers, floating point integers, Boolean, etc. by
    the same constructor var.


    ```

    var x=2;

    var y=0.04; z=''A'';

    ```


    All these are variables have a scope and a lifetime which is the time that the
    value that they contain will be valid.'
- md: "\n## Scope\n\nLet's talk about the scope of a variable, first. JavaScript has\
    \ two scopes:\n\n- Global\n- Local\n\nIf we say that a variable has global scope,\
    \ it means that the variable can be used throughout the script, in all functions\
    \ that are within the script. It can be accessed, modified everywhere. While in\
    \ the case of a variable that has local scope, it can be accessed or modified\
    \ only within the function which they have been defined.\n\nA variable that is\
    \ declared inside a function is a Local variable. It is only created when the\
    \ function is executed, stays alive till the function is running and then gets\
    \ destroyed automatically. The variable cannot be accessed anywhere outside that\
    \ function.\n\n```javascript\nvarmyVar= \"Something\"; myFunctionFunc(){\nvarmyVar=\
    \ \"Another thing\"; }\n```\n\nAs be seen, we can have a local as well as a global\
    \ variable of the same name. The difference occurs at the place at which they're\
    \ being called.\n\nFor example, if we print the value of the variable myVarinside\
    \ the function, we'd get \"Another thing\" printed on the screen. On the other\
    \ hand, if we try to print the value of myVar outside that function, we'd get\
    \ \"Something\" printed on the display. So we can see it's just the placement\
    \ of the variable that decides entirely whether it's a local or a global variable.\n\
    \nWhen JavaScript starts to execute a function, it first looks for all the variable\
    \ declarations that exist inside the function, for example, var foo. Then it creates\
    \ all the variables with the initial value undefined. If the variable is declared\
    \ along with some value inside the function, it still is initialized with the\
    \ value undefined. Then, JavaScript starts to execute the present statements line\
    \ by line. When it reaches the line where the variable declaration is made, it\
    \ gives that variable that value, removing the undefined label.\n\nExample: var\
    \ something=100; foo();\n\n```javascript\nfunction foo(){\nconsole.log(something);\
    \ if(false) var something=112; }\n```\n\nThe console.log here will print undefined.\
    \ The reason is that when the function is executed, the variable that is declared\
    \ inside that if statement is taken and the value is set to be undefined. Then\
    \ that console.log statement occurs.\n\nHad the if statement not there, we would\
    \ have got 100 printed on the console.\n\n## Closures\n\nIn JavaScript, the nested\
    \ function stores references to the variable declared in the same scope as the\
    \ function. This set of references is called Closures.\n\nExample: function foo(name){\n\
    \n```javascript\nreturn function(){\n  bar(name);\n}\n\nfunction bar(name){\n\
    \  console.log(\"Hello\"+name);\n}\n```\n\nWhen the function is called with something\
    \ like, foo(\"John\") the console will display Hello John on the display.\n\n\
    How’s this happening? Go through that code snippet once again. The foo() makes\
    \ a call to the function bar() whose signature has an argument with it. When foo()\
    \ is called, the inner nested function gets the reference to the argument of foo()\
    \ in this case which is “John.” This reference to the variable that the nested\
    \ function bar() got is a closure in JavaScript. That is how closures work.\n\n\
    ## ES6 specification\n\nECMA script is the super class of JavaScript and acts\
    \ like a standard for the language. JavaScript has added features in the 2015\
    \ version of the script which includes the introduction of block-scoped variables,\
    \ let and const. For these variables {..} defines a new scope. When the variable\
    \ like them are initialized, it only affects the scope in which they’re defined\
    \ in.\n\nExample: let a=2;\n\n```javascript\nconst b=3; {\nlet a=3;\nconsole.log(a);\
    \ }\n```\n\nconsole.log(a); Both these console.log() statements will print different\
    \ values. The reason being that both the variables “a” have been defined in different\
    \ scopes.\n\n## Conclusion\n\nJavaScript variables are the easiest to work with\
    \ as they involve no type setting as is the case with other compiled language,\
    \ and hence is called weakly-typed. It offers us so many functionalities that\
    \ we can use. The language keeps on enhancing and since 2015 has added the let\
    \ and const variables that make the life of a JavaScript programmer easier and\
    \ interesting.\n\n## CHAPTER 12\n\n## WORKING WITH NUMBERS IN JAVASCRIPT\n\nMost\
    \ of the programming involves working with numbers. Whether it is working with\
    \ the balance in a bank account, or sending encrypted messages across other users,\
    \ or nearly anything else, you will be performing arithmetic operations, trying\
    \ to find square roots and so on, or finding random numbers to use. Javascript\
    \ makes these tasks a lot simpler than many other languages, and most of these\
    \ operations are very intuitive.\n\n## How JavaScript stores numbers\n\nBefore\
    \ we get started on how to work with numbers, learning how exactly Javascript\
    \ sees them is necessary. Javascript (JS) stores all numbers as floating point\
    \ numbers - that is, all numbers can have decimal points. Unlike C style languages,\
    \ there is no separate type for integers. All numbers are stored in the Number\
    \ type. You can store numbers as follows: var x = 12; var y = 2.66; var z = 312e-2;\
    \ The last example is a case of exponential notation. In this case, z is equal\
    \ to 3.12. In many cases, if you have a number in a string, JS will try to convert\
    \ it to a number for numeric calculations. For example var num = \"1234\"; If\
    \ you try to use num in numerical operations, it is treated as 1234. However,\
    \ there is one very important quirk to this during addition, which we will see\
    \ shortly.\n\nArithmetic operations First, let's look at how to perform basic\
    \ arithmetic operations. These include addition, subtraction, multiplication,\
    \ and division. These are done as follows: var x = 12 + 24; X will now store the\
    \ value 36.\n\n```javascript\nvar x = 24 / 2; X will now store the value 12.\n\
    var x = 3 - 2; X will store the value 1.\nvar x = 4 * 9; X will store the value\
    \ 36.\n```\n\nNote that all these will work with using strings as numbers, as\
    \ well, except for the addition operator +. Let's take a look at a few statements:\
    \ var x = 24 / \"2\"; var y = \"3\" * \"4\"; var z = \"12\" + 3; var n = 36 /\
    \ \"Mike\"; The first will result in 12, as expected, and so will the next. But\
    \ z will hold the value \"123\" and not 15. This is because the + operator is\
    \ performing concatenation - it is joining strings together. In this case, JS\
    \ converted 3 to \"3\" and then added two strings together to get \"123\". You\
    \ will have to keep this in mind every time you are adding anything that could\
    \ be a string!\n\nThe last one is also interesting. There is no obvious answer\
    \ to this - 36 can't be divided by Mike. JS fills n with the value NaN - short\
    \ for Not a Number. Every time you perform a numeric computation that can't result\
    \ in a number, you will get a NaN as the result. If you want to check if a variable\
    \ is a NaN, you can do this: isNaN(n); This will return true! You can also fill\
    \ a variable with NaN yourself. Similarly, when you perform a calculation that\
    \ results in infinity, JS will return the value Infinity.\n\nvar p = 12 / 0; The\
    \ variable p will have the value Infinity. Infinity is not the string \"Infinity,”\
    \ it's a value.\n\n## Using built-in functions\n\nFor simple things like getting\
    \ a number down to a certain number of decimal places, or converting it to a string,\
    \ JS has built-in functions. Most of these functions are used by the syntax object.method(arguments);\
    \ To convert a number to a string, you can use the toString() method: var x =\
    \ 25; var x_in_string = x.toString(); x_in_string will be equal to “25”. The toExponential(n)\
    \ method writes the number out in scientific notation, with n digits behind the\
    \ decimal point. The argument n is optional, and you can replace it with any number.\n\
    \nvar x = 25.3221; var x_in_exponents = x.toExponential(3); x_in_exponents will\
    \ be “25.321e0”. Note that the output is a string. If you call toExponential without\
    \ an argument, it will not round the number at all. The toFixed(n) method works\
    \ to output the number with a certain number of decimal places.\n x = 25.1168;\
    \ var x_to_2 = x.toFixed(2); x_to_2 will be “25.12”. Note that it rounds the number.\
    \ Often you will need to convert a string into a number. This may be especially\
    \ useful in the case we saw above where you tried to add a string and a number.\
    \ To prevent concatenation, you should use the function Number(). This function\
    \ is used differently: var x = “25.12”; var y = Number(x); Now y will have the\
    \ value 25. There are two more functions you can use: parseInt() and parseFloat().\
    \ These two functions take the first number in the string and return it rounded\
    \ as with the decimal respectively.\n var x = “10.2 20 30”; var y = parseInt(x);\
    \ var z = parseFloat(x); y will be 10 and x will be 10.2. All of these functions\
    \ will return a NaN if the number cannot be converted.\n"
  mdcn: "\n\n## 范围\n\n首先，我们来谈谈变量范围。JavaScript 有两种范围：\n\n- 全局范围 (Global)\n- 局部范围 (Local)\n\
    \n如果我们说一个变量具有全局范围，意味着该变量可以在整个脚本中使用，即脚本内所有函数中都可以。它可以在任何地方被访问和修改。而对于具有局部范围的变量，它只能在定义的函数内部被访问或修改。\n\
    \n在函数内部声明的变量是局部变量。它只在函数执行时被创建，在函数运行期间一直存在，然后自动销毁。变量无法在函数外部的任何地方被访问。\n\n```javascript\n\
    varmyVar= \"Something\"; myFunctionFunc(){\nvarmyVar= \"Another thing\"; }\n```\n\
    \n如所示，我们可以拥有同名的局部变量和全局变量。区别在于它们被调用的位置。\n\n例如，如果在函数内部打印变量 `myVar` 的值，我们会在屏幕上看到\
    \ \"Another thing\"。另一方面，如果我们尝试在函数外部打印 `myVar` 的值，我们会在显示器上看到 \"Something\"。所以我们可以看到，完全是变量的位置决定了它是局部变量还是全局变量。\n\
    \n当 JavaScript 开始执行一个函数时，它会首先查找函数内部的所有变量声明，例如 `var foo`。然后它会创建所有初始值为 `undefined`\
    \ 的变量。如果变量在函数内部声明时带有某个值，它仍然会被初始化为 `undefined`。然后，JavaScript 开始逐行执行当前语句。当到达变量声明所在的行时，它会将该值赋予变量，从而移除\
    \ `undefined` 标签。\n\n示例：`var something=100; foo();`\n\n```javascript\nfunction\
    \ foo(){\nconsole.log(something); if(false) var something=112; }\n```\n\n这里的 `console.log`\
    \ 将打印 `undefined`。原因是当函数执行时，该 `if` 语句内部声明的变量被提取且其值被设置为 `undefined`。然后执行该 `console.log`\
    \ 语句。\n\n如果没有那个 `if` 语句，我们会在控制台得到 100。\n\n## 闭包\n\n在 JavaScript 中，嵌套函数存储了与函数相同作用域声明的变量引用。这组引用被称为闭包\
    \ (Closures)。\n\n示例：`function foo(name){`\n\n```javascript\nreturn function(){\n\
    \  bar(name);\n}\n\nfunction bar(name){\n  console.log(\"Hello\"+name);\n}\n```\n\
    \n当使用类似 `foo(\"John\")` 的参数调用函数时，控制台将显示 Hello John。\n\n这是如何发生的？再次过一遍这段代码片段。`foo()`\
    \ 调用了函数 `bar()`，该函数的签名带有一个参数。当 `foo()` 被调用时，内部嵌套函数获取了 `foo()` 参数的引用，在这种情况下是 “John.”。这种嵌套函数\
    \ `bar()` 获取的对变量的引用在 JavaScript 中就是闭包。这就是闭包的工作原理。\n\n## ES6 规范\n\nECMA script\
    \ 是 JavaScript 的超类，并充当该语言的标准。JavaScript 在 2015 版本的脚本中添加了新功能，包括引入了块级作用域变量 `let`\
    \ 和 `const`。对于这些变量，`{..}` 定义了一个新的作用域。当这些变量被初始化时，它们只会影响它们定义所在的作用域。\n\n示例：`let a=2;`\n\
    \n```javascript\nconst b=3; {\nlet a=3;\nconsole.log(a); }\n```\n\n`console.log(a);`\
    \ 这两个 `console.log()` 语句将打印不同的值。原因是两个变量 “a” 是定义在不同作用域中的。\n\n## 结论\n\nJavaScript\
    \ 变量是最容易处理的，因为它们不涉及像编译语言那样的类型设置，因此被称为弱类型 (weakly-typed)。它为我们提供了许多可以使用的功能。这种语言不断增强，自2015年以来添加了\
    \ `let` 和 `const` 变量，让 JavaScript 程序员的生活变得更加简单和有趣。\n\n## 第 12 章\n\n## 在 JavaScript\
    \ 中处理数字\n\n大多数编程工作都涉及数字处理。无论是处理银行账户余额，还是向其他用户发送加密消息，或者几乎任何其他内容，你将执行算术运算、尝试寻找平方根等，或者寻找随机数使用。JavaScript\
    \ 让这些任务比许多其他语言简单得多，而且这些操作中的大部分都非常直观。\n\n## JavaScript 如何存储数字\n\n在我们开始学习如何处理数字之前，有必要学习\
    \ JavaScript 确切是如何看待它们的。JavaScript (JS) 将所有数字存储为浮点数 (floating point numbers)——也就是说所有数字都可以带有小数点。与\
    \ C 风格语言不同，整数没有单独的类型。所有数字都存储在 `Number` 类型中。你可以如下所示存储数字：`var x = 12; var y = 2.66;\
    \ var z = 312e-2;` 最后一个例子是指数计数法的用。在这种情况下，`z` 等于 3.12。在很多情况下，如果你有一个字符串中的数字，JS 会尝试将其转换为数字以进行数值计算。例如\
    \ `var num = \"1234\";` 如果你尝试在数值运算中使用 `num`，它会被视为 1234。然而，在加法期间有一个非常重要的特殊情况，我们很快就会看到。\n\
    \n算术运算首先，让我们看看如何执行基础算术运算。这些包括加法、减法、乘法和除法。执行方式如下：`var x = 12 + 24;` `X` 现在将存储值\
    \ 36。\n\n```javascript\nvar x = 24 / 2; X 现在将存储值 12.\nvar x = 3 - 2; X 将存储值 1.\n\
    var x = 4 * 9; X 将存储值 36.\n```\n\n注意，除了加法运算符 `+` 之外，所有这些操作使用字符串作为数字也可以工作。让我们来看几个语句：`var\
    \ x = 24 / \"2\"; var y = \"3\" * \"4\"; var z = \"12\" + 3; var n = 36 / \"Mike\"\
    ;` 第一个将如预期的得到 12，下一个也是如此。但 `z` 将持有值 \"123\" 而不是 15。这是因为 `+` 运算符执行的是拼接 (concatenation)——它正在将字符串连接。在这种情况下，JS\
    \ 将 3 转换为 \"3\" 然后将两个字符串相加得到 \"123\"。每当你添加任何可能是字符串的内容时，都必须记住这一点！\n\n最后一个也很有趣。这个问题没有明显的答案——\
    \ 36 不能除以 Mike。JS 用 `NaN` 的值填充 `n`——它是 Not a Number（不是数字）的缩写。每当你执行一个无法产生数字的数值计算时，你都会得到\
    \ `NaN` 作为结果。如果你想检查一个变量是否为 `NaN`，你可以这样做：`isNaN(n);` 这将返回 `true`！你也可以自己给变量填充 `NaN`。同样，当你执行一个导致无穷大的计算时，JS\
    \ 将返回值 `Infinity`。\n\n`var p = 12 / 0;` 变量 `p` 将具有值 `Infinity`。`Infinity` 不是字符串\
    \ \"Infinity\"，而是一个值。\n\n## 使用内置函数\n\n对于简单的事情，例如将数字保留到特定的的小位数，或将其转换为字符串，JS 有内置函数。这些函数大部分通过语法\
    \ `object.method(arguments);` 使用。要将数字转换为字符串，你可以使用 `toString()` 方法：`var x = 25;\
    \ var x_in_string = x.toString();` `x_in_string` 将等于 “25”。`toExponential(n)` 方法以科学计数法写出数字，小数点后有\
    \ `n` 位数字。参数 `n` 是可选的，你可以用任何数字替换它。\n\n`var x = 25.3221; var x_in_exponents = x.toExponential(3);\
    \ x_in_exponents` 将是 “25.321e0”。注意输出是一个字符串。如果你不带带参数调用 `toExponential`，它将完全不对对进行舍入。`toFixed(n)`\
    \ 方法的作用是输出带有特定小数位的数字。\n x = 25.1168; var x_to_2 = x.toFixed(2); x_to_2` 将是 “25.12”。注意它对数字进行了舍入。通常你需要将字符串转换为数字。这在我们上面看到的尝试将字符串和数字相加的情况下特别有用。为了防止拼接，你应该使用\
    \ `Number()` 函数。该函数的使用方式不同：`var x = “25.12”; var y = Number(x);` 现在 `y` 将拥有值 25。你还可以使用另外两个函数：`parseInt()`\
    \ 和 `parseFloat()`。这两个函数获取字符串中的第一个数字并分别返回舍入后的结果。\n var x = “10.2 20 30”; var y\
    \ = parseInt(x); var z = parseFloat(x);` `y` 将是 10，而 `x` 将是 10.2。如果无法转换数字，这些函数都将返回\
    \ `NaN`。\n\n"
