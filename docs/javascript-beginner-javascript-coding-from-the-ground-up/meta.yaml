    \ to current date and time.\n\n  Example : var example = new Date(); console.log(\
    \ example ); //shows current date and time The resulting date and time are relative\
    \ to the local timezone of the system on which the code is run.\n\n+   - new Date(milliseconds)\n\
    \  When initialized with(single argument which is an integer, that integer is\
