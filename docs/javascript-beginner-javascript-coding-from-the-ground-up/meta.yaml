  md: 'JavaScript is often abbreviated as JS. Some of the main features of the language
    are as follows:


    +   - High-level, Weakly Typed

    - Interpreted

    - Functional

    - Object-Oriented


    Object-Oriented design is perhaps the most important feature of JavaScript, as
    it allows us the creation of objects and establishes relationships between them,
    commonly known as Inheritance and Encapsulation, which you''ll come to know about
    in the proceeding chapters.'
