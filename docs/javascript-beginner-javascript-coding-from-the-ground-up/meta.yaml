- img_proc: true
  md: '# MAIN FEATURES OF JAVASCRIPT


    Most of the features of JavaScript are more or less same as that of other common
    programming languages. Almost all the programming languages have these features.
    The main features are as follows.


    +   1. JavaScript Variables


    One of the very important features of JavaScript is variables. They act as the
    storage containers for values. In other words, they are the names of the memory
    locations at which the values are stored. These values can be an integer, decimal
    values, strings or single characters. The variable names have to be unique. This
    is important because otherwise, this will create a great amount of confusion.
    The name of the variable can start from an alphabet, dollar sign or underscore
    signs. The names are case-sensitive. You will get to know exact rules for naming
    a variable in the later chapter.


    Examples of some variables are: var abcd; var $abc;


    +   2. JavaScript Objects


