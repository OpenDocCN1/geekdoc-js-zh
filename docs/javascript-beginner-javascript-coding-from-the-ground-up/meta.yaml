    ## The Math functions


    Arithmetic operators don''t cover all you need to do with numbers. To do things
    like finding the square root or the absolute value of a number, you have to use
    the Math functions. These are generally used by the syntax Math.method(argument).


    The first set of functions are Math.round(), Math.ceil(), and Math.floor(). The
    Math.round() function rounds a number to an integer. If the first digit after
    the decimal place is greater than or equal to 5, it rounds up to the next integer,
    and if it is less than 5, it rounds down to the previous integer. The ceil function
    is similar except always rounds a number up to the next integer, and the floor
    function always rounds it down to the previous integer.


    var x = 25.52;

    var y = 25.19;


    var xRound = Math.round(x); var yRound = Math.round(y); var xCeil = Math.ceil(x);
    var yCeil = Math.ceil(y); var xFloor = Math.floor(x); var yFloor = Math.floor(y);
    xRound will be 26 and yRound 25. xCeil and yCeil will both be 26, and xFloor and
    yFloor will be 25. The Math.pow() function can be used to find a number raised
    to the power of another number. For example: var x = Math.pow(2,10); x will be
    1024. Finding the square root, or the power of ½, is a very common operation,
    which you can perform using Math.sqrt(x): var x = Math.sqrt(9); And x will be
    3. The Math.abs() function returns the absolute value of a number passed to it.


    var x = Math.abs(-2); X will be 2. The Math.min() and Math.max() functions can
    be used to find the minimum and maximum of a list of numbers given to them. They
    can take any number of arguments.


    var maximum = Math.max(10,12,14,3,7,1,3); var minimum = Math.min(10,12,14,3,7,1,3);
    Maximum will take the value 14 and minimum will take the value 1. The math library
    also has built in functions for trigonometric functions sin, cos and tan, and
    their inverses. These functions are Math.sin(), Math.cos(), Math.tan(), Math.asin(),
    Math.acos(), Math.atan(). All of these functions work in radians, so you should
    convert any angles in degrees to radians for use.


    var sinpi = Math.sin(Math.PI); Sinpi will take the value 0. Finally, the Math.log()
    function allows you to find the natural logarithm of a number.


    var logten = Math.log(10);


    logten will take the value 2.302. JS also has a few mathematical constants, such
    as Pi and E, in the Math library.


    ## Random numbers


    For cases like cryptography and video games, random numbers are very important.
    To generate random numbers, you can use the Math.random() function. The Math.random()
    function returns a random number between 0 and 1, 1 exclusive and 0 inclusive.


    ```

    var n = Math.random(); N will take a different value every time. To make use of
    this in situations where you need a random number between two numbers a and b,
    you can use the following code: randn = a + (Math.random() * (a-b)); This will
    always give you a number between a and b. To get an integer between a and b, you
    can use the floor, ceil or round functions we saw up above.

    ```


    ## CHAPTER 13


    ## WORKING WITH STRINGS IN JAVASCRIPT


    Strings are a group of characters. It stores a series of characters. As specified
    in previous chapters, we use single or double quotes for storing a string. For
    example: var name="Amit"; //Double quotes Or,


    var name= ‘Amit’; //Single Quotes What if the string itself contains single or
    double quotes? For example: desc= “He is referred as the “Don” among his colleagues’;
    //Error Or


    var desc = ‘It’s alright’; //Error In those cases, we make use of escape character
    ( \ ) to demarcate our string in a proper manner. The escape character specifies
    to the compiler that there are special characters following that. Let us understand
    this better with an example.


    var desc= “He is referred to as the \Don" among his colleagues”; Or,


    var desc = ‘It’s alright’; //Error Sometimes we can also use a simple way. If
    the string contains double quotes, then enclose the entire string in a single
    quote and if the string contains single quotes, then enclose the entire string
    in double quote. For example: var answer = "It’s alright"; var desc= ‘He is referred
    to the “Don” among his colleagues’; Escape characters can also be used for other
    special characters like a backslash (\), backspace (\b), carriage return (\r),
    etc.


    Every string has a built-in property known as the length which can be used to
    know the length of a string. For example: var textRand = “INDIA"; var len=textRand.length;
    //len will store 5


    Sometimes it might happen that the string is longer than usual. In those cases,
    the string might not fit in a single line. That often can result in confusion.
    To prevent this from creating confusions and causing problems, we divide the string
    into two parts and then concatenate it using it.


    There are several methods and various properties associated with strings which
    make some operations on the string easy. Let us look at them one by one.


    ### 1. Length property

    Every string has a length property associated with them. It returns the number
    of characters the string has.

    For example: var randText="ABC DEF GHI"; var len=randText.length; //len will contain
    11


    ### 2. indexOf method

    This method returns the position (index) of the first occurrence of a specified
    text in the string. It returns -1 if the given string is not found. The index
    starts from 0.

    For example: var text = "My name is Amit"; var ind = text.indexOf("Amit"); //Will
    return 11 because Amit is present at location 11


    ### 3. lastIndexOf method

    This method returns the position (index) of the last occurrence of the given text
    in the string. It returns -1 if the given string is not found.


    ```

    var text = "Our own planet earth is a great planet"; var n = str.lastIndexOf("planet");
    //This will return 31 as last occurrence of planet is at 31

    ```

    Note: Both of the above methods accept the 2nd parameter as well which the position
    is from where the search has to start.


    ```

    var text = "My name is Amit"; var ind = text.indexOf("Amit",2); //In this case,
    the search starts from index 2

    ```


    ### 4. search method

    The search method behaves exactly same as the indexOf() method. However, it does
    not accept any second parameter. Therefore, in this case, the search starts from
    index 0 in all the cases. This is used for searching a pattern of strings using
    regular expressions.


    ### 5. slice method

    The slice() method takes two parameters – start and end. As the name suggests,
    slice returns the string from start index to end index.

    For example: var country = "India, Bahama, Fiji";


    ```

    var res = country.slice(7, 13); //This will return Bahama // In the case second
    parameter is omitted, rest of the string is chopped off.

    ```

