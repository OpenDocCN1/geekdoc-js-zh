  md: '# EMBEDDING JAVASCRIPT CODE IN HTML


    You can use JavaScript with HTML for a dynamic and delightful user experience.
    In this chapter, we will learn about the various ways through which we can embed
    JavaScript in an HTML document.


    In order to embed JavaScript directly in a page, you can use the \<script>\` tag.


    The syntax of the script tag is as follows: \<script> //JavaScript code goes here,
    example: alert("Hello from JavaScript"); \</script> Various optional attributes
    are available for use with the script tag for more customization. Here is the
    list of available attributes that can be used with the tag: **type**: This tag
    is used to specify the language written between the script tag, but since JavaScript
    is the primary scripting language used for all web browsers, it is not mandatory
    to use this attribute, as it is set by default. Here is an example: \<script type="text/JavaScript">JavaScript
    code here \</script> src: If you want to load JavaScript code externally then
    this is the attribute which you should be looking at. The URL of the external
    JavaScript code is the value of this attribute.


    ```

    <script src="url/to/external/JavaScript.file.js"></script> defer: If this attribute
    is present in the script tag then the JavaScript file associated with script tag
    is executed after the page has been fully parsed, i.e. over the DOMContentLoaded
    event is fired. Example: <script src="path/to/file.js" defer></script> Note that
    this attribute is only for JavaScript code loaded externally, i.e., if the src
    attribute is present in the same script tag as the defer attribute.

    ```


    **async**: If this attribute is present in the script tag then the JavaScript
    file associated with script tag is executed asynchronously while the page continues
    to load. If this tag is not present the script is first executed, and then the
    page load continues. Example: <script src="path/to/file.js" async></script> Note'
  merge: -1
  pgno: 22
