    # Chapter four - DOM for hackers


    # Where''s my window?


    In this chapter we are going to hack the DOM in order to understand it and hopefully
    teach you new techniques that you weren''t aware of. First, the goal of this section
    is to get the window object via the DOM. Why do we want a window? The window or
    global object in node are really important for sandbox escape because they allow
    you to reach the globally defined functions as eval which allows you to execute
    arbitrary JavaScript that can bypass sandboxes. There are many aliases for the
    window object: frames, globalThis, parent, self, top. If your site isn''t framed
    and top will point to the window object, if it is framed then top will point to
    the top window regardless if its cross origin or not "parent". There is also a
    way to access the window from a DOM node, document.defaultView stores a reference
    to the current window object. Try it in your browser console:


    ```

    1 document.defaultView.alert(1337)//calls alert with 1337

    ```


    The code calls the alert function using the defaultView property of the document
    object to get a reference to the window object. The defaultView property is only
    available on the document object however there''s a trick to get the document
    object from a DOM node and then access the defaultView property from the document.
    You can use a property called ownerDocument and as the name you suggests you can
    get the document object using the DOM:


    ```

    1 let node = document.createElement(''div'');

    2 ownerDocument.defaultView.alert(1337)

    ```


    Many sandboxes have been broken using this knowledge since access to the "window"
    object is normally blocked these workarounds allow you to access it again.


    Events are another way of obtaining a window object, when you use an event on
    a DOM node the handler is defined by an event argument, this is to get the fact
    back in the day when Internet Explorer was widely popular you used a global called
    "event". As an argument to the handler that way when the event is accessed it
    is a local variable. Interestingly the global event object exists today but it
    is deprecated. In Chrome there is a path property on error event and this is an
    array of objects that led to the creation of the event. The last element in the
    array is the window object, you can obtain a window by simply reading it. The
    pop() function comes in handy for this:'
- md: "## Chapter four - DOM for hackers\n\n```html\n<img src onerror=event.path.pop().alert(1337)>\n\
    ```\n\nIn other browsers we use the standardised composedPath() method which returns\
    \ an array equivalent to the path property in Chrome. That you can call composedPath()\
    \ to get the last element of the array and it will contain the window object in\
    \ every browser:\n\n```html\n<img src onerror=composedPath().pop().alert(1337)>\n\
    ```\n\nRemember when I said each handler handles an argument with the event object?\
    \ There is a special case for SVG elements. The browser doesn't add \"event\"\
    \ but rather \"evt\" which means you can access the window object using this argument\
    \ just like the composedPath() method:\n\n```html\n<svg><image ref=1 onerror=evt.composedPath().pop().alert(1337)>\n\
    ```\n\nTo find this I didn't read the Chrome source, instead I looked at the event\
    \ handler's code and the definition in it. If you run this in Chrome you can see\
    \ how the handler function is defined:\n\n```html\n<svg><image ref=1 onerror=alert(onerror)>\n\
    ```\n\nWhich results in the following code:\n\n```javascript\nfunction onerror(evt)\
    \ { //event is referenced with evt\n  alert(onerror)\n}\n```\n\nSo evt points\
    \ to the event. This seems to be the case for SVG elements but I wonder if there\
    \ are any others? It's useful when a JavaScript sandbox protects you from accessing\
    \ the event object.\n\nTo finish off this I'm going to cover the Error object\
    \ and how you can prepareStackTrace to get access to the window object in Chrome.\
    \ Using the prepareStackTrace callback you can customise stack traces which are\
    \ helpful for developers. The idea is to provide a function that has two arguments:\
    \ the error message and the other for an array of CallSite objects. A CallSite\
    \ object consists of properties and methods related to the stack trace. For example\
    \ you've got isEqual flag to determine if the current CallSite is within an event\
    \ function but what I'm really interested in is how to use getThis() to get a\
    \ window object. Frankly Chrome provides us with a useful method getThis() on\
    \ a CallSite object and this will return a window object if there's no \"this\"\
    \ defined by the executing code. Let's see it in action:\n\n```javascript\n1 Error.prepareStackTrace=function(error,\
    \ callSites) {\n2   callSites.shift().getThis().alert(1337);\n3 };\n4 new Error().stack\n\
    ```\n\nWe define our callback method, the function simply gets the first CallSite\
    \ object from the array of CallSites, calls the getThis() which returns the window\
    \ object that we then use to access and call the alert() function. The prepareStackTrace\
    \ callback is only executed when the stack property of Error object is accessed.\n\
    \n## Scope of an HTML event\n\nWhen a JavaScript event is executed on an HTML\
    \ element the browser executes the executed function with the element and the\
    \ document object. This means you can use shortcuts by just specifying properties\
    \ of the current object or document object without the whole path to the property.\
    \ In the browser does the following:\n\n```javascript\n1 with(document) {\n2 \
    \  with(element) {\n3     //executed event\n4   }\n5}\n```\n\nRemember that document\
    \ property defaultValue? We can actually use that within an event on ours. So\
    \ you can access the window object using just that property:\n\n```html\n<img\
    \ src onerror=defaultView.alert(1337)>\n```\n\nThis works because of the \"with\"\
    \ statement above. The browser executes the event and looks for the defaultView\
    \ property on the image, it can't find it so now it exists the document.defaultView\
    \ property is accessed and returned. If you enumerate the document object you\
    \ can see which properties are accessible. You can do this using a custom enumerator\
    \ or simply use console.dir(document) in the browser console.\n\nBecause of the\
    \ scope of it you can use other DOM functions too, here we can create a script,\
    \ append add it to the document using the full path:\n\n```html\n<img src onerror=s=createElement('script');s.append('alert(1337)');appendChild(s)>\n\
    ```\n\nNotice that appendChild() is used in this instance append will throw an\
    \ exception if you don't specify the full path at least Chrome. The append() function\
    \ accepts a string or node. The appendChild() function will actually be executed\
    \ on the image object, document has a appendChild() method the image takes precedence\
    \ so the script will be appended to the image not the document.\n\n## DOM clobbering\n\
    \nDOM clobbering is a technique that takes advantage of a coding pattern that\
    \ checks for a global variable and allows a different code path if it doesn't\
    \ exist. The idea is you clobber that global variable does not exist with a DOM\
    \ element most commonly the anchor element. Imagine you have some code like this:\n\
    \n```javascript\nlet url = window.currentUrl || 'http://example.com';\n```\n\n\
    This code looks innocuous at first glance but actually window.currentUrl is controllable\
    \ not only a global variable but a DOM element too. Back in the early days of\
    \ web design it was common for sites to use id attributes of form to refer the\
    \ element thanks to a feature in Internet Explorer and Netscape that allowed the\
    \ id or name attribute of the form to become a global variable as a shortcut for\
    \ developers. This enables DOM clobbering. You have perhaps seen some code like\
    \ this:\n\n```html\n<form id=searchForm>\n</form>\n<script>\n  searchForm.submit()\n\
    </script>\n```\n\nThe browser creates a global called \"searchForm\" and lets\
    \ you to refer to the form without using the getElementById method. In addition\
    \ you can use the \"name\" attribute to do the thing.\n\nAnchor elements make\
    \ DOM clobbering even more interesting because they allow you to refer to the\
    \ \"href\" attribute. Set myself a goal to break rule many years ago and it's\
    \ possible to use collections to get another. DOM Collections are array-like objects\
    \ that hold elements. I found you could use multiple elements with the same id\
    \ or name and it would form a collection. You could also use another id or name\
    \ (depending on what you originally used) to clobber a second property. This is\
    \ probably illustrated by an example:\n\n```html\n<a id=\"x\">\n<a name=\"y\"\
    \ href=\"clobbered:1337\">\n```"
  mdcn: "\n## 第四章 - 针对黑客的 DOM 教程\n\n```html\n<img src onerror=event.path.pop().alert(1337)>\n\
    ```\n\n在其他浏览器中，我们使用标准的 `composedPath()` 方法，它返回一个等同于 Chrome 中 `path` 属性的数组。你可以调用\
    \ `composedPath()` 获取数组的最后一个元素，它在每个浏览器中都会包含 `window` 对象：\n\n```html\n<img src\
    \ onerror=composedPath().pop().alert(1337)>\n```\n\n记得我提到过每个处理器都处理一个带有事件对象的参数吗？对于\
    \ SVG 元素有一个特殊情况。浏览器添加的不是 \"event\"而是 \"evt\"，这意味着你可以像使用 `composedPath()` 方法一样通过这个参数访问\
    \ `window` 对象：\n\n```html\n<svg><image ref=1 onerror=evt.composedPath().pop().alert(1337)>\n\
    ```\n\n为了发现这一点，我没有阅读 Chrome 的源码，而是查看了事件处理器的代码及其定义。如果你在 Chrome 中运行这段代码，就可以看到处理器函数是如何定义的：\n\
    \n```html\n<svg><image ref=1 onerror=alert(onerror)>\n```\n\n结果产生以下代码：\n\n```javascript\n\
    function onerror(evt) { // event 用 evt 引用\n  alert(onerror)\n}\n```\n\n所以 `evt`\
    \ 指向事件。这对于 SVG 元素似乎是如此，但我好奇是否还有其他情况？当 JavaScript 沙箱保护你无法访问事件对象时，这非常有用。\n\n为了结束这部分，我将介绍\
    \ `Error` 对象以及如何准备 `StackTrace` 以在 Chrome 中访问 `window` 对象。通过使用 `prepareStackTrace`\
    \ 回调函数，你可以自定义栈跟踪，这对开发者非常有帮助。其思路是提供一个带有两个参数的函数：错误消息，另一个是 `CallSite` 对象的数组。`CallSite`\
    \ 对象包含与栈跟踪相关的属性和方法。例如，你有 `isEqual` 标记来判断当前 `CallSite` 是否在事件函数内部，但我真正感兴趣的是如何使用\
    \ `getThis()` 来获取 `window` 对象。坦率，Chrome 在 `CallSite` 对象上为我们提供了一个有用的方法 `getThis()`，如果执行代码没有定义\
    \ \"this\"，它将返回一个 `window` 对象。让我们来看看实际效果：\n\n```javascript\n1 Error.prepareStackTrace=function(error,\
    \ callSites) {\n2   callSites.shift().getThis().alert(1337);\n3 };\n4 new Error().stack\n\
    ```\n\n我们定义了自己的回调方法，该函数简单地从 `callSites` 数组获取第一个 `CallSite` 对象，调用 `getThis()` 返回\
    \ `window` 对象，然后我们使用它访问并调用 `alert()` 函数。`prepareStackTrace` 回调只有在访问 `Error` 对象的\
    \ `stack` 属性时才会执行。\n\n## HTML 事件的作用范围\n\n当 JavaScript 事件在 HTML 元素上执行时，浏览器会带有该元素和\
    \ `document` 对象执行该函数。这意味着你可以通过指定当前对象或文档对象的属性来使用快捷方式，而无需完整的路径。浏览器会执行以下操作：\n\n```javascript\n\
    1 with(document) {\n2   with(element) {\n3     // 执行的事件\n4   }\n5}\n```\n\n记得\
    \ `document` 的属性 `defaultValue` 吗？我们实际上可以在自己的事件中使用它。因此，你只需通过该属性即可访问 `window` 对象：\n\
    \n```html\n<img src onerror=defaultView.alert(1337)>\n```\n\n这之所以有效是因为由于上面的 \"\
    with\" 语句。浏览器执行事件并在图像上查找 `defaultView` 属性，由于找不到，于是进入 `document`。随后访问并返回 `document.defaultView`\
    \ 属性。如果你枚举 `document` 对象，就可以看到哪些属性是可以访问的。你可以使用自定义枚举器，或者直接在浏览器控制台中使用 `console.dir(document)`。\n\
    \n由于其作用范围，你也可以使用其他 DOM 函数。在这里我们可以创建一个脚本，并使用完整路径将其添加到文档中：\n\n```html\n<img src\
    \ onerror=s=createElement('script');s.append('alert(1337)');appendChild(s)>\n\
    ```\n\n注意，在此例中使用了 `appendChild()`，如果不指定完整路径（至少在 Chrome 中是），`append` 将抛出异常。`append()`\
    \ 函数接受字符串或节点。`appendChild()` 函数实际上会在图像对象上执行，虽然 `document` 也有 `appendChild()` 方法，但图像的优先级更高，因此脚本会被添加到图像上而不是文档上。\n\
    \n## DOM 覆盖 (DOM clobbering)\n\nDOM 覆盖利用了一种编码模式的技巧，该模式会检查全局变量，如果不存在则允许进入不同的代码路径。其思路是用\
    \ DOM 元素（最常见的是 `anchor` 元素）来覆盖那个不存在的全局变量。假设你有像下面这样的代码：\n\n```javascript\nlet url\
    \ = window.currentUrl || 'http://example.com';\n```\n\n这段代码乍看之下无害，但实际上 `window.currentUrl`\
    \ 不仅是一个全局变量，也可以是一个 DOM 元素。在网页设计的早期，由于 Internet Explorer 和 Netscape 的一项功能，网站经常使用表单的\
    \ `id` 属性来引用元素，该功能允许表单作为开发者快捷方法的全局变量。这使得 DOM 覆盖成为可能。你可能见过像这样的代码：\n\n```html\n\
    <form id=searchForm>\n</form>\n<script>\n  searchForm.submit()\n</script>\n```\n\
    \n浏览器创建一个名为 \"searchForm\" 的全局变量，并允许你在不使用 `getElementById` 方法的情况下引用表单。此外，你还可以使用\
    \ \"name\" 属性来实现同样的操作。\n\n`anchor` 元素让 DOM 覆盖变得更有趣，因为它们允许你引用 \"href\" 属性。多年前我给自己设定了一个打破规则的目标，现在可以使用集合（collections）来获取另一个属性。DOM\
    \ 集合是存储元素的类数组对象。我发现你可以使用多个具有相同 `id` 或 `name` 的元素，它们会形成一个集合。你也可以使用另一个 `id` 或 `name`（取决于你最初使用了什么）来覆盖第二个属性。这可以通过一个示例来说明：\n\
    \n```html\n<a id=\"x\">\n<a name=\"y\" href=\"clobbered:1337\">\n```\n"
