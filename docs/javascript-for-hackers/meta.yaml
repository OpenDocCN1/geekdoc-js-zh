    \ JS 字符串中注入一个闭合的`<script>`标签，这将关闭脚本块并由于未闭合的字符串抛出 JavaScript 异常。你可以继续注入自己的 HTML\
    \ 并在目标应用上实现 XSS：\n\n```javascript\n<script>\nlet foo = \"</script><img/src/onerror=alert(1337)\"\
    ;\n</script>\n```\n\n为了修复此漏洞，你可以使用反斜杠转义正斜杠字符 `/`，防止闭合脚本生效，但这不是最佳修复方法（我们稍后发现）。更好的修复方法是使用\
    \ Unicode 转义 `<` 和 `>`，这可以确保 HTML 不会在字符串内部被渲染。当然，你还需要对反斜杠和引号进行编码。\n\n## 脚本内部的注释\
    \ (Comments inside scripts)\n\n你可能认为通过转义正斜杠来修复之前的漏洞就能解决问题，但事实并非如此。如果你有两个注入点，一个在\
    \ JavaScript 变量内部，另一个在 HTML 属性内部。你可以注入一个 HTML 注释开启标签和脚本，这会阻止脚本闭合，脚本块将一直持续直到遇到另一个闭合脚本标签。\n\
    \n```javascript\n<script>\nlet foo = \"<!----script>\";\n</script>\n```\n\n```html\n\
