    HTML 拥有广泛的编码选项。在本节中，我将介绍通过实体编码字符的各种方法，并用几个示例结束本节。


    ## 十进制实体


    你可以使用字符代码来表示不同的字符，它们以 `&#` 开头，并以可选的分号结尾。例如，字符 "j" 表示为字符代码 106。要产生这个字符，只需将前缀与代码结合，后面跟一个可选的分号。你还可以在字符代码之前使用任意数量的零：


    - 1 <a href="&#106;avascript:alert(1337)">test1</a>a>

