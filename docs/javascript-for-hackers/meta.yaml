    the image element to be rendered.


    # HTML entities inside SVG script


    You might think that you perform escaping correctly you can prevent XSS inside
    script blocks. However, inside SVG it''s a different story. HTML entities are
    rendered inside because SVG is an XML format and this means the when the entities
    are decoded by SVG, JavaScript will then get the correct unencoded characters


    ```

    <svg>

    <script>let foo = "&quot;-alert(1)//";</script>

    </svg>

    ```


    # Script without closing script


    You might have thought you always need a closing script when using a script block.
    You''d be wrong at least on Firefox. If you use SVG you can have a self closing
    script on Firefox:


    ```

    <svg><script href=data:,alert(1) />

    ```


    You have to use the href attribute because you are inside SVG and not HTML and
    src attribute isn''t supported there.'
