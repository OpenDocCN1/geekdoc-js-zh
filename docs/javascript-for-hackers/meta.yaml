- md: "## Chapter three - Fuzzing\n\nYou can apply the logic above to fuzz for single\
    \ line comments, instead of placing the placeholders at either end of the random\
    \ string you can place them before to detect them. Next let's find single line\
    \ comments:\n\n```javascript\nlog=[];\nfor(let i=0;i<0x1ffff;i++){\n  try {\n\
    \    eval(`${String.fromCodePoint(i,i)}%$L234$`)\n    log.push(i);\n  } catch(e)\
    \ {\n  }\n}\nconsole.log(log);//47\n```\n\nWe detected a forward slash as expected.\
    \ You can see there is a real skill in crafting fuzz vectors for finding interesting\
    \ behaviour. We need to consider how the fuzz vector will be executed and in what\
    \ context to avoid false positives.\n\nFinally in this chapter we're going to\
    \ cover nested fuzzing to find an interesting JavaScript comment behaviour you\
    \ might not be aware of. Nested fuzzing is tricky to do because it involves more\
    \ characters and currently modern browsers are not powerful enough to execute\
    \ multiple for loops with codepoints greater than 0xff. However if we reduce the\
    \ amount of codepoints being tested in this we can find some interesting stuff.\n\
    \n```javascript\nlog=[];\nfor(let i=0;i<=0xff;i++) {\n  for(let j=0;j<0xff;j++)\
    \ {\n    try {\n      eval(`${String.fromCodePoint(i,j)}%$L234$`)\n      log.push([i,j]);\n\
    \    } catch(e) {\n    }\n  }\n}\nconsole.log(log));//[35, 33], [47, 47]\n```\n\
    \nWe used nested loops for this time, we had to limit the amount of characters\
    \ as discussed for performance reasons. Then I used the fromCodePoint method to\
    \ add two characters from one code points in each loop and added some jump after\
    \ the comment to prove a comment was happening. We added an array of both characters\
    \ since both are required to produce a comment. We got an expected double forward\
    \ slash but what's this? 35 and 33 are \"#!\" they act as a single line comment\
    \ provided they are at the beginning of the executed JavaScript. You can verify\
    \ your results by trying to execute an alert with comment in place.\n\n```javascript\n\
    1 !\n2 alert(1337)//executes alert with 1337\n```\n\nIf you add any character\
    \ before the hash it will fail:\n\n```javascript\n1 123\n2 !\n3 alert(@)//alert\
    \ will not be called.\n```\n\nIn the example if there are any characters before\
    \ the hash the comment will not work. The shebang was probably added as a comment\
    \ sequence of JavaScript being used as shell scripts NodeJS and so a common case\
    \ was to ignore it.\n\n## Fuzzing escapes\n\nIn my effort to break JavaScript\
    \ sandboxes I ventured into fuzzing different escapes such as unicode escapes\
    \ discussed in the introduction chapter. This led me to find interesting behaviour\
    \ in various browsers. I found in Safari it wouldn't throw an exception when encountering\
    \ undefined unicode escapes in strings. When Old Opera (pre-Chrome) would also\
    \ incorrectly parse unicode escapes when sent to evaluate. Old behaviours can\
    \ be used for sandboxed escapes if you're lucky how do we find them? Fuzzing of\
    \ course! You have to be aware of the context you're fuzzing in and if they require\
    \ double encoding. Let's fuzz a simple unicode escape:\n\n```javascript\n1 let\
    \ a = 123;\n2 log=[];\n3 for(let i=0;i<0x1ffff;i++){\n4   try{\n5     eval(`\\\
    \\u${String.fromCodePoint(i)}a`);\n6     log.push(i);\n7   } catch(e) {\n8 }\n\
    9 console.log(log);//48\n```\n\nIn the code I fuzz for all the unicode characters\
    \ as previously earlier. This time I defined a variable \"a\" to see if eval throws\
    \ or not. Eval will throw an exception if the code attempts to access an undefined\
    \ variable. We want to know if \"a\" is successfully accessed or not. We do not\
    \ use the escape format of \"\\u\" and you have to escape the backslash because\
    \ we want eval to interpret the unicode escape. We add our fuzz character. When\
    \ fuzzing all characters we get one result of \"48\" which is the character code\
    \ for zero. We have determined that this unicode format allows zero padding with\
    \ pure fuzzing.\n\nNot only can you fuzz for characters you could also fuzz hex\
    \ by changing the placeholder. Each number literal has a toString method that\
    \ allows you to specify the radix which will convert the integer into the base\
    \ specified from 2-36. Hex:\n\n```javascript\n1 a = 123;\n2 log=[];\n3 for(let\
