    \ This really seems like a problem with the specification as inherited properties\
    \ should not be used when using native APIs as it can lead to prototype pollution.\
    \ I doubt this will be fixed since inheritance is at the core of JavaScript.\n\
    \nThere are other places where this happens, you can pollute property traps because\
    \ they require function the damage is limited to throwing JavaScript exceptions.\n\
    \nEven localStorage is vulnerable to this technique provided the site uses the\
    \ getter not the getItem(). Often, developers use the getter for that localStorage.foo\
    \ because it's convenient but it will inherit from the Object prototype and therefore\
    \ you can control the property via prototype pollution so you would have a potential\
    \ gadget\n\n```\nif(localStorage.foo) {\n  let foo = localStorage.foo;\n}\n```\n\
    \nThe example creates a potential gadget called “foo”. Because the code checks\
    \ for the presence of the “foo” property and uses the getter in each instance\
    \ this can be polluted."
- md: "## Chapter six - Prototype pollution\n\n## Finding gadgets\n\nSo you've found\
    \ a gadget and have prototype pollution, how can you identify actual gadgets?\
    \ First of all you need to execute some JavaScript first before the page executes\
