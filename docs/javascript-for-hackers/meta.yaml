    # Calling functions with arguments without parentheses


    We can expand our goal a bit, rather than just calling a function we can try to
    call the function and pass all arguments without any parentheses. I had a moment
    of inspiration while whilst JS. I thought about the exception handler and how
    you can provide your own function. In case you don''t know the window object has
    a global handler onerror, when you provide a handler your function will get all
    the exceptions from the page. This handler gets called with the message in the
    first argument, the URL in the second line, name number in the third, column number
    in the fourth and finally the error object in the last argument. The message argument
    is what interests me because we can influence it then the handler will get called
    with a string in the first argument. You might be wondering how to call the handler
    with an argument you choose, you could set the handler and then throw a JavaScript
    exception of course! You could do this by generating some invalid code or could
    use the throw statement.


    The throw statement allows you to create a new exception and provide your own
    error message, this can be a JavaScript exception which will be important later.
    If you''re a JavaScript developer you''ll be aware of it and it''s quite common
    code to see this:


    ```

    throw new Error(''Some exception'');

    ```


    As mentioned the throw statement accepts an expression and it doesn''t necessarily
    need to be an object, you can throw a string and this gets passed to the error
    handler. To call a function with arguments we need to set the handler and throw
    a string like so:


    ```

    onerror=alert; ''foo''

    ```


    Which results in Chrome at least an alert box with "Uncaught foo". You might be
    thinking how can we execute arbitrary code? If you replace "alert" with "eval"
    then when the exception is thrown it will get evaluated as code. But that leaves
    us with the unfortunate "Uncaught" with a space. To round that we can simply inject
    an of equals to make the "Uncaught" become a variable assignment and therefore
    be valid JavaScript:'
