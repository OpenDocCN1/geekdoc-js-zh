    \ interesting like an eval function or other method or assignment that can result\
    \ in a vulnerability. The property becomes a gadget when it reaches a vulnerable\
    \ sink.\n\n## Potential gadget\n\nIf you've found a property that is controllable\
    \ via prototype pollution but you have yet to identify if it hits a sink then\
    \ you can refer to this as a potential prototype pollution gadget.\n\n## Client-side\
    \ prototype pollution\n\nThere are two forms of prototype pollution: client and\
    \ server side. This section deals with the client-side form. The goal of exploiting\
    \ client-side prototype pollution is generally DOM XSS. You find if the site allows\
    \ you to add properties to the Object prototype and then see if the property hits\
    \ a sink results in controlling JavaScript or HTML.\n\n## Finding prototype pollution\n\
    \nNow that we've defined the terms we can start to look for prototype pollution.\
    \ You can do this by simply injecting a vector and then use the browser console\
    \ to confirm that it worked. For example imagine a site allows you to use properties\
    \ & values in the query string and has a vulnerable merge operation in a library\
    \ they use. You could inject a probe in the query string that attempted to set\
    \ a property on the Object prototype:\n\n```\n__proto__[foo]=bar\n```\n\nAfter\
    \ the page has loaded you could use the browser console to inspect the Object\
    \ prototype:\n\n```javascript\n1 console.log(Object.prototype)\n2 //(foo: 'bar',\
    \ constructor: f, __defineGetter__: f, __defineSetter__: f, hasOwnProp\\)\n3 rty:\
    \ f,)\n```\n\nIf the Object prototype contains any property you've successfully\
    \ found client-side prototype pollution. Using the __proto__ property isn't the\
    \ only way of finding prototype pollution, you can use the constructor[prototype]\
    \ properties which is essentially the same thing, it's less common than the __proto__\
    \ property because it requires two key properties and often sites will generally\
    \ use two. To test for this you can follow the process just replace __proto__\
    \ with constructor[prototype]:\n\n```javascript\n?constructor[prototype][foo]=bar\n\
    ```\n\nWhich results in manipulation of the object prototype provided the site\
    \ is vulnerable to this technique:\n\n## Chapter six - Prototype pollution\n\n\
    ```javascript\n1 console.log(Object.prototype) __Getter__: f, __define__: f, hasOwnProp\\\
    \n2 //<foo:'bar', constructor: f, __define__: f, __defineSetter__: f, hasOwnProp\\\
    \n3 rty: f, _\n```\n\nDifferent libraries parse the query string in different\
    \ ways, I have encountered sites that use dots in the query string, test for that\
    \ simply remove the square brackets and add to access different property keys:\n\
    \n```\n?__proto__.foo=bar\n```\n\nIt's worth checking the hash, I've seen sites\
    \ parsing the hash as query parameters. If you try each combination with both\
    \ query string and hash then that should get 99% of client-side prototype pollution\
    \ vulnerabilities.\n\n## Modification of native methods\n\nWhen a site is vulnerable\
    \ to prototype pollution you are not limited to just manipulating the Object prototype,\
    \ you don't even need to add a property. You can change one of the native methods\
    \ of the global Object or others. For example, a site uses the Object.keys method,\
    \ it's quite possible to overwrite this using a prototype pollution source. An\
    \ attack might look like the following:\n\n```javascript\n?__proto__[keys]=//Object.keys\
    \ === \"\"\n```\n\nThis removes the functionality of the method by assigning it\
    \ to a string. In practice this sort of attack is difficult to exploit since you\
    \ can't provide your function as is limited to strings or JSON supported types.\
    \ However, you can use this technique as part of a bug chain that can take you\
    \ down a different path.\n\n## Native browser APIs\n\nQuite surprisingly browser\
    \ APIs themselves are vulnerable to prototype pollution wherever the API allows\
    \ to use an object literal passed as an argument (common with configuration) you\
    \ can often use prototype pollution to influence values. One example is the fetch()\
    \ function, the first parameter accepts a string or request object and the second\
    \ parameter accepts an options object. If a site doesn't include one of the properties\
    \ on the request object or object then you can use prototype pollution to influence\
    \ them. As it's best illustrated with an example:\n\n```javascript\n1 Object.prototype.body='foo=bar'\n\
    2 const request = new Request('/myEndpoint',{\n3 method: 'POST',\n4 });\n5 fetch(request);\n\
    ```\n\n## Chapter six - Prototype pollution\n\nThe code above uses the Request\
    \ object to build a request to send to the fetch() function because the Request\
    \ object does not define a body property; it's possible to control the property\
    \ using an inherited property via prototype pollution. When the POST request is\
    \ sent it will have a POST body with foo-bar. Exactly the same technique can be\
    \ used with the second parameter of the fetch function:\n\n```javascript\nObject.prototype.body='foo=bar'\n\
    const request = new Request('/myEndpoint',{\n  method: 'POST',\n});\nfetch(request);\n\
    ```"
  mdcn: "\n## Gadget（利用get）\n\nGadget 指的是你污染的属性被用于某些有趣的地方，例如 `eval` 函数或其他方法或赋值，而这些操作可能导致漏洞。当该属性到达一个漏洞的汇点（sink）时，它就变成了一个\
