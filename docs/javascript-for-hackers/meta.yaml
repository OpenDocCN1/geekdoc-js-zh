    \ value just like it an identifier:\n\n```javascript\n1 +[]//creates an array\
    \ with 0 in it\n2\n3 [][][+]//gets the first element in the array\n4\n5 ++[]][+]//increments\
    \ the first element in the array to\n6\n```\n```-alphanumeric JavaScript\n```\n\
    \n## Chapter seven - Non-alphanumeric JavaScript"
  mdcn: "\n## 第六章 - 原型链污染\n\n## 寻找 gadget（利用get）\n\n既然你发现了一个 gadget 并且存在原型链污染，如何识别真正的\
    \ gadget 呢？首先，你需要在页面执行其代码之前执行一些 JavaScript。你可以通过使用像 Burp 这样的代理，并在任何代码执行之前添加一个\
    \ `debugger` 语句来实现。`debugger` 语句是一个特殊的 JavaScript 命令，当执行到该语句时会调用 JavaScript 调试器（通常是\
    \ DevTools）；当执行遇到该语句时，JavaScript 的执行会在该处暂停，你可以自由地使用调试器输入自己的 JavaScript 代码。如果你发现某个原型是一个真实的\
    \ gadget，可以使用 `Object.defineProperty()` 方法来发现该属性何时被使用。你可以调用此方法并在每次访问属性的访问器（getter）时进行堆栈跟踪（stack\
    \ trace）：\n\n```javascript\nObject.defineProperty(Object.prototype,'potentialGadget',\
    \ {__proto__:null, get(){\n  console.trace();\n  return 'test';\n}})\n```\n\n\
    通过堆栈跟踪，你可以识别出源代码中使用该属性的部分，以及该值最终是否进入了某个漏洞点（sink）。有一些工具可以自动化这个过程。我写了一个名为 `DOM Invader`\
    \ 的工具，它可以检测原型链污染源和 gadget。它是 Burp Suite 内置浏览器的一个扩展程序。\n\n## 服务端原型链污染\n\n客户端原型链污染很容易检测，因为你拥有源代码；而服务端则要困难得多，因为污染发生在服务器上，通常你无法访问源代码。当涉及到\
    \ DoS（拒绝服务）时，问题会进一步升级：对于客户端 DoS，你可以刷新浏览器一切恢复正常，而 DoS 发生在服务器端，应用程序可能会崩溃导致你或其他用户无法访问，唯一的解决方案就是重启\
    \ node 进程。\n\n如果你有源代码，情况会更加简单。同样的原理适用于服务端原型链污染，即你和 gadget。只要你控制 node 进程并自行托管应用程序，你甚至可以采用在浏览器控制台中那种成功检测原型链污染的方法。node\
    \ 有两个极其关重要的命令行标记（flags）：\n\n- - inspect\n- -inspect-brk\n\n第一个选项允许你使用 devtools\
    \ 调试 node 应用，你只需要在运行程序时添加该标记即可：\n\n```bash\nnode -inspect your-app.js\n```\n\n\
    然后你可以通过访问 `chrome://inspect/` 来使用 Chrome 调试 node。\n\n如果你正确启动了进程，你应该能看到一个远程目标（remote\
    \ target）出现。你可以检查该目标并访问控制台。像客户端一样，你现在可以使用控制台检查 `Object.prototype`。堆栈跟踪依然有效，你可以使用本章之前讨论的\
    \ `Object.defineProperty()` 技术获取访问属性的确切行数。\n\n在某些情况下，你可能想要调试已经运行的应用程序部分，因此调试器已经跳过了你想调试的部分。这就是第二个命令行标记\
    \ `-inspect-brk` 发挥用场的地方——它会指示 node 进程在应用程序执行之前暂停，这对于 node 应用中的 gadget 来说超级有用。然后你可以再次在相同的\
    \ URL 使用 Chrome，如前所述，你可以使用调试器单步或恢复执行，甚至可以添加你自己的断点。\n\n使用 devtools 的全局搜索（sitewide\
    \ search）对于测试也超级方便，一旦按照前面的说明打开了远程控制台，你就可以对所有运行的 node 应用进行搜索。点击 devtools 窗口右侧的三个点，点击\
    \ search 选项。可以用它来寻找潜在的 gadget。结合前面提到的 `defineProperty()` 技术，应该有助于识别它们。\n\n## 总结\n\
    \n在本章中，我们介绍了原型链污染，定义了什么是技术、源（source）和 gadget。我们向你展示如何寻找原型链污染，以及如何利用原型链污染漏洞修改原生函数。我们还讨论了即使是\
    \ JavaScript 原生 API 本身，在参数中使用对象时也会受到原型链污染的影响。我们展示了如何手动寻找潜在的 gadget，最后介绍了服务端原型链污染，以及如何使用与客户端相同的技术来调试\
    \ node 应用程序。\n\n## 第七章 - 非字母数字 JavaScript\n\n## 编写非字母数字 JavaScript\n\n这一切始于 slackers\
    \ 论坛的用户注意到一封来自长泽阳介（Yosuke Hasegawa）的令人惊讶的新帖，他是一位杰出的日本安全研究人员。在贴子中，他详细介绍了如何在不使用字母数字字符的情况下执行\
    \ JavaScript。这对我们所有人来说都是一次启示，我们开始剖析它的工作原理。基本思想是使用方括号 `[]` 和 JavaScript 表达式来创建字符串，并使用同样基于表达式数字索引来拼接字符串，从而创建有效的属性名，并最终在不显示脏话字符的情况下编写任意的\
    \ \"u\"。这后来也变成了 `JSF'ck vI`（它掩盖了 \"u\"，此本书不显示脏话）。现在，我将统称为友好的名称“非字母数字”JavaScript\
    \ 或 non-alpha JS。你只需要一种生成数字的方法，因为 JavaScript 是弱类型语言，你可以使用中缀运算符 `\"+\"` 来实现，该运算符会尝试将随后的表达式转换为数字，如果无法转换则变为\
    \ `NaN`（非数字）。第一步是获取一个零：\n\n```javascript\n+1 +[]//0\n```\n\n太好了，我们有了零，但这只会允许我们获取字符串的第一个字符：\n\
    \n```javascript\n+1 'abc'[+]//a\n```\n\n但我们如何获取 \"b\" 呢？嗯，你可以将方括号访问器与数组结合，获取数组中项的引用，JavaScript\
    \ 允许你像处理标识符一样对这个值进行加/减：\n\n```javascript\n1 +[]//创建一个包含 0 的数组\n2\n3 [][][+]//获取数组中的第一个元素\n\
    4\n5 ++[]][+]//将数组中的第一个元素加 1 变成\n6\n```\n```-alphanumeric JavaScript\n```\n\n\
    ## 第七章 - 非字母数字 JavaScript\n"
