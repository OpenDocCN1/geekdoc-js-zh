    # ## Calling functions without parentheses


    One of my favorite goals is the title of this chapter because there is so much
    depth with it. You can create sub-goals with it and it will help you understand
    JavaScript features quickly. I think my first attempt at executing JS without
    parentheses was tinkering with the valueOf method. You can use valueOf when you
    want a particular object to return a primitive value such as a number. Generally
    you''d use it with an object literal to make your object interact with other primitives
    or perhaps perform addition or subtraction:


    ```

    let obj = {valueOf(return 1)};

    obj()//2

    ```


    This is interesting valueOf allows you to define a function that gets called when
    the object is used as a primitive. So we can use the alert function instead of
    a custom function and what will be called instead? It''s not as easy as that,
    let''s try it and see what happens:


    ```

    let obj = {valueOf.alert};

    obj()//Illegal invocation

    ```


    We define the alert to call with valueOf, the object is used with the addition
    operator that calls the JavaScript method, valueOf is assigned to the alert function
    when attempting to call alert JavaScript engine will throw an "illegal invocation"
    error. This is because the alert function requires the "this" to be a window object.
    When our alert function is called the "this" object will be our custom object
    why an is exception. Objects in JavaScript inherit from the Object prototype and
    valueOf is actually defined in the Object prototype, this means we don''t need
    to use a custom object; we can use an existing object since pretty every object
    has valueOf functionality! Can you see where this is going? The window object
    itself has a valueOf method and we can overwrite that:


    ```

    window.valueOf=alert;window//calls alert()

    ```


    This time the alert call is successful and this is because we changed the windows
    valueOf method and when valueOf is called the "this" object will be window and
    the illegal invocation error will'
