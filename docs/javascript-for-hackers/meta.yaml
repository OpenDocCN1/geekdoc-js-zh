    \ / *http://www.youtube.com/watch?v=-ijb0287e*\n\n## Chapter six - Prototype pollution\n\
    \n### Introduction\n\nPrototype pollution is a vulnerability that occurs when\
    \ you do a recursive merge and one or more objects are controllable. When a recursive\
    \ merge happens the code often uses property keys in an unsafe way that can cause\
    \ unintended assignments. For example JavaScript has a magic property called __proto__\
    \ this is actually a getter/setter which allows you to obtain and set the object's\
    \ prototype. If your controllable object can use this the recursive merge will\
    \ actually manipulate the global prototypes commonly Object.prototype. This then\
    \ allows you to have control over unexpected properties that the developer assumes\
    \ are safe and therefore can lead to DOM XSS in the client or even RCE at the\
    \ server level.\n\nNormally you can set an ordinary object called __proto__ as\
    \ mentioned it's really a getter/setter. However, when using JSON.parse a regular\
    \ property is created if you use the __proto__ property this is one of the components\
    \ that can lead to prototype pollution. This can be demonstrated with the following\
    \ code:\n\n```javascript\n({__proto__\":\"foo\"}).hasOwnProperty('proto') // false\n\
    (JSON.parse('{\"__proto__\":\"foo\"}')).hasOwnProperty('proto') // true\n```\n\
    \nWhen a vulnerable merge function the because __proto__ is a regular property\
    \ this will allow it to be used but importantly when it is attempted to be assigned\
    \ it becomes a setter again on the target object and this is what causes prototype\
    \ pollution. It's worth noting that __proto__ isn't the only attack vector it's\
    \ the most common but there is an alternative __proto__ is essentially a shortcut\
    \ to constructor.prototype and if a recursive merge allows you to use a lot of\
    \ properties then you can use the constructor.prototype properties to cause prototype\
    \ pollution. Nowve got the basics of how it occurs out of the way look at how\
    \ you can exploit it.\n\n### Technique\n\nThe technique refers to how it pollutes\
    \ the prototype. For example you are using __proto__ or constructor/prototype\
    \ or another technique.\n\n### Source\n\nA prototype pollution source is the injection\
    \ required to cause prototype pollution. This is made up of a technique the property\
    \ name and the place it comes from example JSON query string or hash. When all\
    \ those components are together I refer to it as a prototype pollution source:\n\
    \n```text\n?__proto__[property]=value\n```"
