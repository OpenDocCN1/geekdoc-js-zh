    # Chapter one - Introduction


    JavaScript has been my passion, I''m fascinated by ways to help me understand
    JS further. You can often see me tweeting about ways to call functions without
    parentheses, insane XSS vectors and general ways to find deeper ways of understanding
    a feature. I''m often asked how a tweet can be used to apply to a WAF bypass or
    browser exploit. For this isn''t important, sure you could use ways to call JavaScript
    functions without bypass WAFs but the point of my tweets is to repeat and rapidly
    gain knowledge that could be applied.


    One such example is `].sort`, sort accepts and I found that you could use that
    to call the goal what I will talk about. What I''m trying is to hack my brain
    to make these vectors important for me to remember, you''ll see me posting variants
    of a particular technique and it certainly helps that I find enjoyment out these
    techniques. How often have you found yourself reading a book or particular article
    not to sink in? By looking for ways to hack JavaScript you are learning about
    a feature and then applying that knowledge to achieve a goal, it doesn''t matter
    what that goal is as long as you''re a target it will help you remember.


    These sorts of techniques can apply to anything really and it''s pretty much common
    sense really, if you look at it as an example you get better at just reading about
    it, you apply knowledge and practice and train by actually doing the sport. JS
    hacking is a lot like this, there is no way in your day to do your job you''ll
    use every feature JS has if you try and hack it you can choose the feature to
    learn about. This is really my philosophy and I''m going to train and teach you
    how to follow it and learn at a rapid pace but enjoy what you are doing.


    # Environment


    In order to follow this process you need a rapid environment to conduct your tests.
    What it means is you need something that you can execute your code and instantly
    get the results. This can be a multitude of things, a browser console, local server
    or a web app as JS Fiddle. Personally I decided to write my own web app "Hackvector",
    giving it the ability to evaluate code, inspect objects, write HTML but other
    options are fine too. I just wanted more power and to make sure your input isn''t
    being logged somewhere.'
