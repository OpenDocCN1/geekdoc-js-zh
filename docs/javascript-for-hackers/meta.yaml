  mdcn: "\n## 第三章 - 模糊测试 (Fuzzing)\n\n可以将上述逻辑应用于单行注释的模糊测试，而不是将占位符放在随机字符串的两端，你可以将它们放在前面进行检测。接下来，让我们寻找单行注释：\n\
    \n```javascript\nlog=[];\nfor(let i=0;i<0x1ffff;i++){\n  try {\n    eval(`${String.fromCodePoint(i,i)}%$L234$`)\n\
    \    log.push(i);\n  } catch(e) {\n  }\n}\nconsole.log(log);//47\n```\n\n我们如预期那样检测到了正斜杠。你可以看到，构造模糊测试向量来寻找有趣的行为确实需要真正的技巧。我们需要考虑模糊测试向量将如何执行以及在什么种上下文中执行，以避免误报。\n\
    \n最后，在本章中，我们将介绍嵌套模糊测试，以发现你可能没有意识的一种有趣 JavaScript 注释行为。嵌套模糊测试很难做，因为它涉及更多字符，而且目前现代器的性能不足以执行多个大于\
    \ 0xff 的代码点的 `for` 循环。然而，如果我们减少此处测试的代码点数量，就能发现一些有趣的东西。\n\n```javascript\nlog=[];\n\
    for(let i=0;i<=0xff;i++) {\n  for(let j=0;j<0xff;j++) {\n    try {\n      eval(`${String.fromCodePoint(i,j)}%$L234$`)\n\
    \      log.push([i,j]);\n    } catch(e) {\n    }\n  }\n}\nconsole.log(log);//[35,\
    \ 33], [47, 47]\n```\n\n这次我们使用了嵌套循环，出于性能考虑，我们限制了字符的数量。然后我使用 `fromCodePoint` 方法从每个循环中的一个代码点添加两个字符，并在注释后添加了一些跳转以证明注释正在发生。我们添加了包含两个字符的数组，因为产生注释需要这两个字符。我们得到了预期的双正斜杠，但这是什么？35\
    \ 和 33 是 \"#!\"，只要它们位于执行的 JavaScript 开头，就会充当单行注释。你可以通过尝试执行带有注释的 `alert` 来验证你的结果。\n\
    \n```javascript\n1 !\n2 alert(1337)//执行带有 1337 的 alert\n```\n\n如果你在井号之前添加任何字符，它将失败：\n\
    \n```javascript\n1 123\n2 !\n3 alert(@)//alert 不会被调用。\n```\n\n在示例中，如果井号之前有任何字符，注释将不起作用。shebang\
    \ 可能是作为 JavaScript 用于 shell 脚本 NodeJS 的注释序列添加的，因此这种情况是忽略它。\n\n## 模糊测试转义 (Fuzzing\
    \ escapes)\n\n在破解 JavaScript 沙箱的过程中，我尝试对不同的转义进行模糊测试，例如引言章节讨论过的 Unicode 转义。这导致我在各种浏览器中发现了有趣的行为。我发现在\
    \ Safari 在遇到字符串中未定义的 Unicode 转义符时不会抛出异常。旧版本的 Opera（Chrome 之前）在发送给 `evaluate` 时也会错误地解析\
    \ Unicode 转义符。如果你足够幸运，旧的行为可以用于沙箱逃逸。我们如何找到它们呢？当然是模糊测试！你必须意识到你正在模糊测试的上下文，以及它们是否需要双重编码。让我们测试一个简单的\
    \ Unicode 转义：\n\n```javascript\n1 let a = 123;\n2 log=[];\n3 for(let i=0;i<0x1ffff;i++){\n\
    4   try{\n5     eval(`\\\\u${String.fromCodePoint(i)}a`);\n6     log.push(i);\n\
    7   } catch(e) {\n8 }\n9 console.log(log);//48\n```\n\n在代码中，我像之前那样测试所有的 Unicode\
    \ 字符。这一次我定义了一个变量 \"a\" 来看看 `eval` 是否会抛出异常。如果代码尝试访问未定义变量，`eval` 将抛出异常。我们想知道 \"\
    a\" 是否被成功访问。我们使用 `\\u` 格式并必须转义反斜杠，因为我们希望 `eval` 解析 Unicode 转义。当我们测试所有字符时，我们得到了\
    \ \"48\" 的结果，这就是字符。我们确定这种 Unicode 格式允许纯测试填充。\n\n你不仅可以测试字符，还可以通过更改进制来测试。每个数字字量量有一个\
    \ `toString` 方法，允许你指定进制将整数转换为 2-36 进制。\n\n```javascript\n1 a = 123;\n2 log=[];\n\
    3 for(let i=0;i<=0xff;i++)\n\ntry {\n    eval\n```\n"
