    \ the \"u\" this book doesn't display swear words. Now I'll refer to it by its\
    \ family friendly name \"non-alphanumeric\" JavaScript or non-alpha JS. You just\
    \ need a way of generating a number and because JavaScript is loosely typed you\
    \ can do that using the infix operator \"+\", this operator will attempt to convert\
