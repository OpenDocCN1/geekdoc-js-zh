    # 第二章 - 无需括号的 JavaScript


    ```javascript

    ''a''.replace(`${alert}``calls alert with a,)

    ```


    这看起来有点奇怪。我们需要那个逗号，因为数组会被转换为字符串。我们该如何避免这一点呢？一种方法是调用自身来改变 "this" 值，这意味着我们可以控制 `match`
    参数并使用正则表达式来匹配任何字符：


    ```javascript

    ''a''.replace.call($1, `././)$alert})calls alert with 1

    ```


    上述发生的情况是：`replace` 函数通过 `call` 被调用，这会将 "this" 赋值为 "1" 的标签模板字符串。我们使用了一个正则表达式，并且由于使用了
    `call`，我们将此正则传递给 `replace` 函数的第一个参数，该正则匹配任何单个字符（排除换行符），然后我们传递 `alert` 函数的引用，导致
    `alert` 带参数 `1` 被调用。嘿。这太疯狂了，对吧？谁知道模板字符串可以这样被滥用？这里有一个很好的挑战：你可以用 `1337` 代替 `1` 来调用
    `alert`。


    你可以使用这种技术配合 `Reflect` 对象调用任何函数以及任何参数。那么，`Reflect` 对象到底是什么呢？它允许你对任何对象执行诸如函数的 get/set
    操作等。例如，它可以用来替代 `call` 和 `apply`，因为它有一个自定义方法可以用于调用任何对象上的函数。你只需要传递函数以及你想要调用该函数的参数即可。正如前面提到的，它可以用于其他操作，但现在让我们先集中在
    `apply` 上：


    ```javascript

    Reflect.apply(${alert},[window],[1337])`/alert is called with 1337`

    ```


    让我们拆解一下这里发生了什么：我们传递了想要调用的函数（在本例中为 "alert"），将 "this" 值传递给函数（在本例中为 "window"），这避免了非法调用错误，最后我们传递了一个想要传递给函数的参数数组。正如前面提到的，使用
    "Call" 是为了避免将字符串数组作为第一个参数传递。`Reflect` 方法不需要特定的 "this" 值，并乐意执行任何赋值给 "this" 的对象。


    我们可以对其他操作执行相同的操作，例如 `set`。`Reflect` 对象的 `set` 方法允许你对任何对象执行 set 操作。这可以通过给 `location`
    对象赋值来演示：


    ```javascript

    Reflect.set.call(${location},${href},`javascript:alert(1337)`)

    ```


    ```javascript

    // 分配一个 javascript url

    ```


    `set` 方法要求第一个参数为有效对象（在本例中为 "location"），第二个参数为属性，第三个参数为要赋值的值。


    # has instance 符号


    我想讨论的最后一个方法是使用 `hasInstance` 符号。符号 允许你在属性键中定义一个唯一的令牌。它们是内置符号，你可以用它们执行各种操作。JavaScript
    以这种方式使用符号是为了避免使用与 Web 上现有代码冲突的特殊属性。"hasInstance" 符号允许你自定义 `instanceof` 运算符的行为，如果你设置了这个符号，它会将左操作的操作数传递给由符号定义的函数。这提供了一种无需括号执行
    JavaScript 的整洁方式：


    ```javascript

    alert(''\x281337\x29''instanceof([Symbol[''hasInstance'']]):eval)//calls alert(1337)

    ```


    在上面的示例中，我们在 `instanceof` 运算符之前的字符串中定义了负载，并使用一个带有 "hasInstance" 符号的新对象字面量赋值了 `eval`
    运算符，然后当 `instanceof` 运算符配合字符串和对象运行时，字符串会被传递给 `eval`，`alert` 函数将被调用。你可以这样使用符号而无需使用方括号：


    ```javascript

    alert(''\x281337\x29''instanceof([Symbol.hasInstance]:eval)//calls alert(1337)

    ```


    # 总结


    这一章向你展示了如何在目标内定义目标子目标。这使你能够快速学习各种 JavaScript 特性，并确保你不是在盯着空白屏幕。心中有明确的目标有助于你关注有趣的特性，并确保你不断学习。在这一章中，我们学习了
    `onerror` 处理程序以及如何滥用它来无括号执行 JavaScript；我们转向标签模板字符串，并揭示了带类型传递参数给函数时令人惊讶的行为；最后我们涵盖了
    "hasInstance" 符号以及如何滥用它进行 JavaScript 攻击。


    # 第三章 - Fuzzing


    ## 真相


    涉及到模糊测试（fuzzing）时，人们通常认为用它来发现可利用的漏洞或崩溃。你确实可以用它做这一点，我过去也发现过漏洞，但你也可以用模糊测试来发现浏览器行为。

