  md: '# Chapter one - Introduction


    JavaScript has been my passion, I''m fascinated by ways to help me understand
    JS further. You can often see me tweeting about ways to call functions without
    parentheses, insane XSS vectors and general ways to find deeper ways of understanding
    a particular feature. I''m often asked how a tweet can be used to apply to a WAF
    bypass or browser exploit. For this isn''t important, sure you could use ways
    to call JavaScript functions without bypass WAFs but the point of my tweets is
    to repeat and rapidly gain knowledge that could be applied.


    One such example is [] .sort, sort accepts and I found that you could use that
    to call the goal what I will talk about. What I''m trying is to hack my brain
    to make these vectors important for me to remember, you''ll see me posting variants
    of a particular technique and it certainly helps that I find enjoyment out finding
    these techniques. How often have you found yourself reading a book or particular
    article not to sink in? By looking for ways to hack JavaScript you are learning
    about a feature and then applying that knowledge to achieve a goal, it doesn''t
    matter what that goal is as long as you''re a target it will help you remember.


    These sorts of techniques can apply to anything really and it''s pretty much common
    sense really, if you look at it as an example you get better at just reading about
    it, you apply knowledge and practice and train by actually doing the sport. JS
    hacking is a lot like this, there is no way in your day to do your job you''ll
    use every feature JS has if you try and hack it you can choose the feature to
    learn about. This is really my philosophy and I''m going to train and teach you
    how to follow it and learn at a rapid pace but enjoy what you are doing.


    # Environment


    In order to follow this process you need a rapid environment to conduct your tests.
    What it means is you need something that you can execute your code and instantly
    get the results. This can be a multitude of things, a browser console, local server
    or a web app as JS Fiddle. Personally I decided to write my own web app "Hackvector",
    giving it the ability to evaluate code, inspect objects, write HTML but other
    options are fine too. I just wanted more power and to make sure your input isn''t
    being logged somewhere. Your environment needs to be able to evaluate JavaScript
    and return the results at the bare minimum.


    # Set a goal


    Once you''ve got your chosen environment set the next step is to set a goal. If
    you have no goal you can be staring at a blank page not getting anywhere. A goal
    enables you to make sure you''re always'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'trying something and it can be flexible too. For instance one of my goals wasexecute
    JavaScript without parentheses". If you set a good goal it will almost never end
    and good ones also mutate into another goal for the goal I mentioned earlier mutated
    into "execute JavaScript functions without parentheses and pass arguments". Now
    you can see how these two goals are useful because now you have a clear idea what
    to do and you can use JavaScript features to achieve that goal. In the above the
    second goal is more challenging than the first but the second goal enables you
    to gain knowledge to achieve the more difficult goal.


    # Fuzzing


    Fuzzing is one of the most important tools in a JavaScript hackers toolbox, enables
    you to answer questions really fast and discover new things by getting the computer
    to report the results. Fuzzing is simply writing code that enumerates characters,
    code or data in order to finding behaviour. In binary exploitation you''ll use
    a fuzzer to find DoS or an exploit crash when fuzzing hacking is to achieve your
    goal by answering questions. For example I set myself a goal to understand what
    characters are allowed as whitespace, you might be wondering why not simply look
    at the specification? You should not use the specification as your only source
    of information when trying to discover browser behaviour because browsers sometimes
    do not follow the specification, they can be because they make a mistake or simply
    choose not to various reasons backward compatibility.


    Using fuzzing is an important tool to find these interesting edge cases. You might
    wonder why these edge cases are important, in the whitespaces example I gave I
    writing a JavaScript parser and sandbox and whitespace turns out to be pretty
    significant when trying to parse JavaScript and could lead to a sandbox bypass.
    By ensuring I handled whitespace correctly according to what the browser could
    ensure my sandbox was secure. Later in the book I''ll show you how to use fuzzing
    to answer questions and discover interesting behaviour.


    # Persistence and luck


    JavaScript hacking is very like web security research in the fact that it takes
    a lot of persistence and lots of luck to find interesting behaviour. Some knowledge
    is important but persistence enables you to expand your knowledge and get luck.
    If you are just starting learning JavaScript and don''t have much knowledge, following
    the principles of this book can help you gain knowledge rapidly you have a lot
    of persistence. If you find yourself starting at a blank screen with any ideas
    what to do, try a new goal or simplify your goal so you can keep moving. Don''t
    be afraid to try things that you think might not work and if you''re persistent
    your time won''t be wasted because you learn little things on the way to finding
    interesting stuff. Remember persistence doesn''t just mean sticking at the same
    thing all the time, you can come back to something months later and try different
    techniques.'
  merge: -1
  pgno: 6
- img_proc: true
  md: '# Social media


    I use Twitter a lot when I hack JS hacking. It''s useful because you can get instant
    feedback on your technique both positive and negative. As you build followers
    you''ll find other people who enjoy the same thing and you''ll find that they
    point out a variant or something you''ve overlooked. It is great because not are
    you learning but everyone who sees the conversion is learning too. Imagine if
    everyone took this approach, everyone would learn at a rapid pace and you''d find
    some interesting JavaScript behaviour. When I smelt it into some files in my head
    and if I forget I can always search Twitter or download my tweets to find the
    particular technique. One important though is that Twitter is not good for long
    term storage of data, if you''ve found something you''re particularly proud of
    you are better off writing a blog post and then tweeting a link to.


    # The basics


    In this section I''ll go over the basics of JavaScript hacking to give you the
    foundation to handle the other chapters. If you''re an experienced developer or
    JS hacker feel free to skip this section. If you want to learn more about JavaScript
    please stick with me. JavaScript supports various types of encoding, you have
    hexadecimal, octal and two flavours of unicode encoding.


    # Hexadecimal


    First up we''ll tackle hexadecimal encoding, this works only within strings, if
    you try and use them as identifiers then they will fail. Hex uses a base of 16
    and the escape is prefixed with an "x". Here are some examples:


    ```

    ''\x61''//a

    "\x61"//a

    ''\x61''//a


    function a(){

    \x61()fails

    ```


    In the examples above you can see the first three work correctly inside strings
    but the last example fails to call the function because hex escapes aren''t allowed
    there. Another interesting aspect is that hex escapes have to use a lowercase
    "x", if you use an uppercase "X" then it won''t be treated as a hex escape and
    the JavaScript engine will simply process the string as a literal X followed by
    the characters you specify.'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# Unicode


    Unicode escapes also work in strings but are also allowed in identifiers. There
    are two forms of unicode escapes "\u" and "\U". The former allows you to produce
    a character within the range 0x00-FFFF the latter allows you to specify the entire
    range of unicode code points. There are some examples of unicode escapes:


    ```

    \u0061`//a

    \u0061`//a

    \u0061`//a


    function a(){

    \u0061()//correct calls the function

    ```


    The code above will execute perfectly fine, each string about this form of unicode
    escapes and the function will be called correctly. Some points about this type
    of unicode escapes you must specify four hexadecimal characters for example \u61
    is not allowed, most browsers will throw an exception: There were some browsers
    that allow invalid unicode escapes as \u61 but was a browser bug. You cannot encode
    parentheses or other characters only identifiers of strings. Next is another type
    of unicode escape that allows you to specify unicode code points for the entire
    range, they have similar characteristics as standard unicode escapes that you
    can use in strings and unlike standard unicode escapes they are not restricted
    to four hexadecimal characters. To use these escapes you use \U] inside the curly
    braces you specify a hex unicode code point. The following examples work fine
    with this type of unicode escape:


    ```

    \u{61}`//a

    \u{000000000061}`//a

    \u{0061}`//a


    function a(){

    \u{61}()//correct calls the function


    u{3134a}=123//unicode character "3134a" is allowed as a variable

    ```


    As the code demonstrates an unlimited amount of zero padding and the exclusion
    of zeros will be allowed. You can specify higher unicode characters as the last
    example shows. Those are the main differences between the two unicode escapes:


    # Octal


    Octal escapes use base 8 and can only be used strings. There is no prefix with
    octal escapes; you simply use a backslash followed by a base 8 number. If you
    try to use a number outside the octal range the JavaScript engine will just return
    the number:'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# Chapter one - Introduction


    ```

    `\141`/a

    "8"//number outside the octal range so 8 is returned

    ```


    Octal escapes aren''t allowed in template strings.


    # Eval and escapes


    Now you know the different escapes that are available you can use them with eval
    or other forms of eval like setTimeout. When using them with these functions you
    have to double escape or even if they are nested! The JavaScript is actually executed
    with strings it will attempt to decode the input passed to it, so when the engine
    executes the string this allows us to break some of the rules defined earlier.
    For example, remember that hex can only be used with strings? Well, if you use
    eval hex will be decoded first and then executed which means the following is
    perfectly valid:


    ```

    eval(''a=123'')/a = 123

    ```


    You can do the same with unicode escapes because they are allowed in identifiers
    you can double escape them:


    ```

    eval(\u0061=123'')

    //\u0061 = 123

    ///a = 123

    ```


    As the above example shows you can escape the backslash inside the string which
    produces a unicode escape which is then used as an identifier. The unicode escape
    effectively translates to a=123. You aren''t limited to escaping the backslash
    either; you can escape any part of the escape when using eval and can match the
    encodings. This is quite difficult to illustrate without being overly complex
    and confusing. So I''ll demonstrate in parts:


    ```

    eval(\u0061=123'')//unicode escape using "a" assignment

    eval(\ux3061=123'')//hex encode the first zero

    eval(\ux3066\61=123'')//octal encode the 6

    ```


    # Strings


    There are three forms of strings, you have single quoted, double quoted and template
    strings. As mentioned in the escapes section you can use various types of encoding
    within all the types of strings. In addition you can use single character escape
    sequences:'
  merge: -1
  pgno: 9
- img_proc: true
  md: "# Chapter one - Introduction\n\n+   1 \\b//backspace\n2 \\f//form feed\n3 \\\
    n//new line\n4 \\r//carriage return\n5 \\t//tab\n6 \\@//null\n7 \\'single quote\n\
    8 \\\"double quote\n9 \\\\backslash\n10 \\\\\\\n\nYou can also escape any character\
    \ that isn't part of an escape sequence and they are treated as the actual character\
    \ for example:\n\n\"H\\E\\L\\O\"//HELLO\n\nInterestingly you can use a backslash\
    \ at the end of line to continue it onto the next line:\n\n+   1 'I continue \\\
    \n2 onto the next line'\n\nThis behaviour also works with object property names:\n\
    \n```\nlet foo = {\n  'bar\\'\n  ': \"baz\"\n}\n```\n\nDouble and single quoted\
    \ strings do not support multiple lines unless you use \\ to continue to the next\
    \ line, template strings support multiple lines and the continuation behaviour.\
    \ This can be proved with the following code:\n\n```\n1 x = 'a\\\n2 b\\';\n3 c';\n\
    4 x=='abc'/true\n5\n6 x = `a\n7 b\n8 c';\n9 x=='abc'/false\n```"
  merge: -1
  pgno: 10
- img_proc: true
  md: 'So as you can see the first code snippet proves the continuation behaviour
    exists in template strings since the new lines aren''t added to the string. The
    second snippet shows template strings supporting new lines and they are included
    within the string. Template strings have a feature that allows you to execute
    arbitrary JavaScript expressions in placeholders, they define ${}, your expression
    goes inside the curly braces:


    ```

    `${7*}`//49

    ```


    Surprisingly any JavaScript expression is supported within the placeholders including
    templating string! Which means you can nest template strings within template strings,
    this leads to bizarre looking JavaScript that is perfectly valid:


    ```

    `${${${7*}}}`//49

    ```


    Imagine trying to write a parser for that! I admire V8, JavaScript Core and Spidermon
    because JavaScript is so complex nowadays it takes some clever parsing to get
    it right. Anyway you can call functions using what''s tagged template strings.
    You simply simplify the function or expression that returns a function to call
    and use backticks after it to that function:


    ```

    alert`1337`//calls the alert function with the argument 1337

    ```


    As mentioned it supports an expression too, so again you can have bizarre looking
    JavaScript that calls multiple functions. Let''s crank it up a notch and demonstrate
    this. If you have a function that returns itself you can have an unlimited amount
    of backticks:


    ```

    function x(){return x}

    ```


    It looks like an error but the above will execute in any JavaScript engine that
    supports tagged template strings. The function is called once and because it returns
    itself another template string is allowed because it''s a function and so on.


    # Call and apply


