    \n```javascript\nlet foo = {\n  'bar\\'\n  ': \"baz\"\n}\n```\n\nDouble and single\
    \ quoted strings do not support multiple lines unless you use \\ to continue to\
    \ the next line, template strings support multiple lines and the continuation\
    \ behaviour. This can be proved with the following code:\n\n```javascript\n1 x\
    \ = 'a\\\n2 b\\';\n3 c';\n4 x=='abc'/true\n5\n6 x = `a\n7 b\n8 c';\n9 x=='abc'/false\n\
    ```\n\nSo as you can see the first code snippet proves the continuation behaviour\
    \ exists in template strings since the new lines aren't added to the string. The\
    \ second snippet shows template strings supporting new lines and they are included\
    \ within the string. Template strings have a feature that allows you to execute\
    \ arbitrary JavaScript expressions in placeholders, they define ${}, your expression\
    \ goes inside the curly braces:\n\n```javascript\n`${7*}` // 49\n```\n\nSurprisingly\
    \ any JavaScript expression is supported within the placeholders including templating\
    \ string! Which means you can nest template strings within template strings, this\
    \ leads to bizarre looking JavaScript that is perfectly valid:\n\n```javascript\n\
    `${${${7*}}}` // 49\n```\n\nImagine trying to write a parser for that! I admire\
    \ V8, JavaScript Core and Spidermon because JavaScript is so complex nowadays\
    \ it takes some clever parsing to get it right. Anyway you can call functions\
    \ using what's tagged template strings. You simply simplify the function or expression\
    \ that returns a function to call and use backticks after it to that function:\n\
    \n```javascript\nalert`1337` // calls the alert function with the argument 1337\n\
    ```\n\nAs mentioned it supports an expression too, so again you can have bizarre\
    \ looking JavaScript that calls multiple functions. Let's crank it up a notch\
    \ and demonstrate this. If you have a function that returns itself you can have\
    \ an unlimited amount of backticks:\n\n```javascript\nfunction x(){return x}\n\
    ```\n\nIt looks like an error but the above will execute in any JavaScript engine\
    \ that supports tagged template strings. The function is called once and because\
    \ it returns itself another template string is allowed because it's a function\
    \ and so on.\n\n## Call and apply\n\nCall is a property of every function that\
    \ allows you to call it and change the \"this value\" of the function in the first\
    \ argument and any subsequent arguments are passed to that function. For example:\n\
    \n```javascript\nfunction x(){\n  console.log(this.bar); // baz\n}\nlet foo={bar:\"\
    baz\")\nx.call(foo);\n```\n\nIn the above example we use the object \"foo\" as\
    \ the \"this\" value for the function \"x\" and pass it to the call function,\
    \ the \"x\" function uses which now refers to our foo object and the bar property\
    \ returns \"baz\". When the \"x\" function is called there are no arguments, if\
    \ you would like to pass arguments to the function then simply add them to the\
    \ call function like so:\n\n```javascript\nfunction x() {\n  console.log(arguments[0]);\
    \ // 1\n  console.log(arguments[1]); // 2\n  console.log(this); // [object Window]\n\
    }\n```\n\n```javascript\nx.call(null, 1, 2)\n```\n\nIf you don't pass a \"this\"\
    \ value to the call function it will use the window object if not in strict mode\
    \ because we use null in the first argument to the call function \"this\" will\
    \ default to the window object as we are not in strict mode. If you use the \"\
    strict\" directive \"this\" will be null instead of window:\n\n```javascript\n\
    function x() {\n  \"use strict\";\n  console.log(arguments[0]); // 1\n  console.log(arguments[1]);\
    \ // 2\n  console.log(this); // null\n}\n```\n\n```javascript\nx.call(null, 1,\
    \ 2)\n```\n\nThe apply function is pretty much exactly the same as the call function\
    \ with one important difference, you can pass an array of arguments in the second\
    \ argument:\n\n```javascript\nfunction x() {\n  console.log(arguments[0]); //\
    \ 1\n  console.log(arguments[1]); // 2\n  console.log(this); // [object Window]\n\
    }\n```\n\n```javascript\nx.apply(null, [1, 2])\n```\n\n## Summary\n\nIn this chapter\
    \ we've learned various techniques of call and apply. We've explored how to use\
