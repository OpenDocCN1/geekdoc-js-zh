    \ doesn't create false positives, for instance you can see there's a very deliberate\
    \ greater than the space and hyphen. This is to prevent the span being consumed\
    \ as a different tag by the various fuzzing characters. It's good to defensively\
    \ code like this as it will save you time.\n\n# Fuzzing known behaviours\n\nIf\
    \ you don't know where to start fuzzing for new browser behaviour, you can always\
    \ fuzz for existing behaviour and see if there are any deviations. One place to\
    \ start is whitespace, you just need to construct a fuzz string which will only\
    \ occur if the character is whitespace. The best way I found for this is to use\
    \ a function call. You can have whitespace between the function identifier and\
    \ the parentheses, so you can define a function within a try catch block and attempt\
    \ to call it with the identifier and the added character with eval."
