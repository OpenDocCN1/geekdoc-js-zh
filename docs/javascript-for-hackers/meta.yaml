    \ JSON 支持的类型。然而，你可以将此技术作为漏洞链的一部分，引导你走向不同的路径。\n\n## 原生浏览器 API\n\n令人惊讶的是，浏览器 API\
    \ 本身也容易受到原型污染的影响。只要 API 允许将对象字面量作为参数传递（常见于配置项），你通常可以使用原型污染来影响值。一个例子是 `fetch()`\
