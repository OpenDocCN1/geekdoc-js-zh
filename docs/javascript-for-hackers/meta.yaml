    \  for(let j=0;j<0xff;j++) {\n    try {\n      eval(`${String.fromCodePoint(i,j)}%$L234$`\\\
    )\n      log.push([i,j]);\n    } catch(e) {\n    }\n  }\n}\nconsole.log(log));//[35,\
    \ 33], [47, 47]\n```\n\nWe used nested loops for this time, we had to limit the\
    \ amount of characters as discussed for performance reasons. Then I used the fromCodePoint\
    \ method to add two characters from one code points in each loop and added some\
    \ jump after the comment to prove a comment was happening. We added an array of\
    \ both characters since both are required to produce a comment. We got an expected\
