    # Chapter four - DOM for hackers


    ```

    <iframe name=foo srcdoc="<a id=bar href=clobbered:1337></a></iframe>

    <script>

    alert(foo)/[object Window]

    alert(foo.bar)/undefined

    </script>

    ```


    The above example shows that ''foo'' has been clobbered but it''s been clobbered
    with the window object of the iframe and it''s the same origin allows us to do
    further clobbering using the inside of the iframe. But why is ''foo.bar'' undefined?
