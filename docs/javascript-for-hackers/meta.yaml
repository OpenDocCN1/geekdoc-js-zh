    # The six character wall


    After lots of hacking the slackers forum trying to discover what was possible
    with non-alpha code we all came to the conclusion that the minimum limit you could
    have for arbitrary JavaScript execution was six characters. This became known
    as the great character wall. The limit is because without ! you cannot create
    booleans without + you can''t convert into integers and concatenate strings using
    more characters. The most likely way of breaking this wall is to use the following
    charset ?* and discover a way of generating a boolean. They are important because
    false contains "s" and true contains "r". Without these you cannot construct the
    constructor property and therefore are unable to generate the required string
    to get access to it


    # Infinity and beyond


    If we are going to attempt breaking the wall you''d need to generate characters
    because you''be stuck with "NaN" and "undefined". Well with only [] it''s possible
    to generate Infinity! Let''s see how it''s done. First we are going to generate
    the number one before, then you need to generate an undefined string and need
    the "e" from that. After that you simply concatenate one''s to end the form "1e111"
    which produces Infinity.


    ```

    1 [] [{![[]]{}[+]{}[+]{+]+![[]]{}[+]{+}[+][+][+][+]

    2 //function at() { [native code] } as a string

    3 ++++[+[+[+[+][][+][+][+][+][+][+][+][+][+]//6

    ```


    First generate one:


    ```

    1 +{[]}[[]]//

    ```


    Then generate an undefined string:


    ```

    1 [][+]+[]//undefined as string

    ```


    We need to access the "e" from undefined:


    ```

    1 [][+][+][+][+]{++[+][+][+][+][+]]}[+][+]//e

    ```


    Combine them all together to form 1e1111:


    ![](img/b7416315b7c67652e77b6463939bc7af_65_0.png)'
