    \ `iframe` 内部进行进一步覆盖。但为什么 'foo.bar' 是 `undefined` 呢？这是因为 `iframe srcdoc` 渲染需要一些时间，没有足够的时间渲染框架的内容和锚点的属性。幸运的是，我发现如果引入一个跨域样式导入，会产生足够的延迟让元素在\
