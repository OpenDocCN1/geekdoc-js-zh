    Octal escapes aren''t allowed in template strings.


    # Eval and escapes


    Now you know the different escapes that are available you can use them with eval
    or other forms of eval like setTimeout. When using them with these functions you
    have to double escape or even if they are nested! The JavaScript is actually executed
    with strings it will attempt to decode the input passed to it, so when the engine
    executes the string this allows us to break some of the rules defined earlier.
    For example, remember that hex can only be used with strings? Well, if you use
    eval hex will be decoded first and then executed which means the following is
    perfectly valid:


    ```

    eval(''a=123'')/a = 123

    ```


    You can do the same with unicode escapes because they are allowed in identifiers
    you can double escape them:


    ```

    eval(\u0061=123'')

    //\u0061 = 123

    ///a = 123

    ```


    As the above example shows you can escape the backslash inside the string which
    produces a unicode escape which is then used as an identifier. The unicode escape
    effectively translates to a=123. You aren''t limited to escaping the backslash
    either; you can escape any part of the escape when using eval and can match the
    encodings. This is quite difficult to illustrate without being overly complex
    and confusing. So I''ll demonstrate in parts:


    ```

    eval(\u0061=123'')//unicode escape using "a" assignment

    eval(\ux3061=123'')//hex encode the first zero

    eval(\ux3066\61=123'')//octal encode the 6

    ```


    # Strings


    There are three forms of strings, you have single quoted, double quoted and template
    strings. As mentioned in the escapes section you can use various types of encoding
    within all the types of strings. In addition you can use single character escape
    sequences:'
