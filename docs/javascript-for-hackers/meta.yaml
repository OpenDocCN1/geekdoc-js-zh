  mdcn: "\n尝试新事物，而且这种方式也非常灵活。例如，我的目标之一是“不带括号执行 JavaScript”。如果你设定了一个良好的目标，它几乎永远不会结束，而且好的目标还会演变成另一个目标；我之前提到的目标演变为了“不带括号执行\
    \ JavaScript 函数并传递参数”。现在你可以看到这两个目标是有用的，因为现在你对要做什么有了清晰的思路，并且可以使用 JavaScript 特性来实现该目标。在上面，第二个目标比第一个更有挑战性，但第二个目标能让你获得实现更困难目标的知识。\n\
    \n## 模糊测试 (Fuzzing)\n\n模糊测试是 JavaScript 黑客工具箱中最重要的工具之一，它让你通过让计算机报告结果来快速回答问题并发现新事物。模糊测试简单来说就是编写枚举字符、代码或数据的以寻找行为。在二进制漏洞中，你会使用模糊器来寻找\
    \ DoS（拒绝服务）或利用程序崩溃。模糊测试黑客是通过回答问题来实现你的目标。例如，我给自己设定了一个目标，理解哪些字符允许作为空白符；你可能会想为什么不直接看规范？在尝试发现浏览器行为时，你不应该将规范作为唯一的信息源，因为浏览器有时并不遵循规范，这可能是因为它们犯了错，或者仅仅出于向后兼容等原因选择不遵守。\n\
    \n使用模糊测试是发现这些有趣边界情况的重要工具。你可能会好奇为什么边界情况很重要；在我提供的空白符示例中，我正在编写一个 JavaScript 解析器和沙箱，而空白符在解析\
    \ JavaScript 时非常关键，并可能导致沙箱绕过。通过确保我根据浏览的能力正确处理空白符，我确保了我的沙箱是安全的。在书的后面我将为你展示如何使用模糊测试来回答问题并发现有趣的行为。\n\
    \n## 坚持与运气\n\nJavaScript 黑客与 Web 安全研究非常相似，相似之处在于需要大量的坚持和运气才能发现有趣的行为。某些知识固然重要，但坚持能让你扩展知识并获得运气。如果你刚开始学习\
    \ JavaScript 且没有多少知识，只要你有足够的坚持，遵循此书的原则可以帮助你快速获取知识。如果你发现自己面对空白屏幕不知道该做什么，请尝试一个新目标或简化你的目标，以便能够继续进行。不要害怕尝试你认为可能无效的事物，只要你坚持，你的时间就不会被虚度，因为在寻找有趣事物的路上你会学很多小细节。记住，坚持并不意味着一直盯着同一件事做，你可以在几个月后回来尝试不同的技术。\n\
    \n## 社交媒体\n\n当我进行 JS 黑客活动时经常使用 Twitter。它很有用，因为你可以对你的技术获得即时反馈，无论是正面还是负面的。随着粉丝的增加，你会发现其他同样感兴趣的人，你会发现他们指出了变体或你忽略的某些东西。这非常好，因为不仅是你正在学习，看到对话的人也在学习。想象一下如果大家都采取这种方法，每个人都会以极快的速度学习，你会发现一些有趣的\
    \ JavaScript 行为。当我把内容存在脑中的某些文件中并忘记时，可以随时搜索 Twitter 或下载我的推文来寻找特定技术。但重要的一点是 Twitter\
    \ 不适合长期存储数据；如果你发现了特别自豪的内容，最好写一篇博客然后推文链接。\n\n## 基础\n\n在本节中我将介绍 JavaScript 黑客的基础，为你处理其他章节提供基础。如果你是经验丰富的开发者或\
    \ JS 黑客，可以跳过本节。如果你想学习更多关于 JavaScript 的知识，请关注我。JavaScript 支持多种类型的编码，你有十六进制、八进制和两种\
    \ Unicode 编码。\n\n### 十六进制\n\n首先处理十六进制编码，它只在字符串内部有效，如果你尝试将其作为标识符，它们将失败。十六进制使用 16\
    \ 进制，转义字符以 \"x\" 为缀。这里是一些示例：\n\n```javascript\n'\\x61' // a\n\"\\x61\" // a\n\
    '\\x61' // a\n\nfunction a(){\n  \\x61() // 失败\n```\n\n在上面的示例中，你可以看到前三个在字符串内部正常工作，但最后一个示例未能调用函数，因为那里不允许十六进制转义。另一个有趣的方面是十六进制转义必须使用小写的\
    \ \"x\"，如果你使用大写的 \"X\"，那么它不会被视为十六进制转义，JavaScript 引擎将仅仅把字符串处理为字面量 X 后跟着你指定的字符。\n\
    \n### Unicode\n\nUnicode 转义在字符串中有效，但也允许在标识符中使用。有两种形式的 Unicode 转义 \"\\u\" 和 \"\\\
    U\"。前者允许你产生范围内的字符，后者允许你指定更高的点。\n\n```javascript\n\"\\u0061\" // a\n\"\\u0061\"\
    \ // a\n\nfunction a(){\n  \\u0061() // 正确\n```\n\n上面的示例中，你可以看到前三个在字符串内部正常工作，但最后一个示例未能调用函数，因为那里不允许十六进制转义。（注：此处原文似乎有误，此处应指\
    \ Unicode 转义而非十六进制）\n"
