  md: '# Chapter six - Prototype pollution


    # Introduction


    Prototype pollution is a vulnerability that occurs when you do a vulnerable recursive
    merge and one or more objects are controllable. When a recursive merge happens
    the code often uses property keys in an unsafe way that can cause unintended property
    assignments. For example JavaScript has a magic property called __proto__ this
    is actually a getter/setter which allows you to obtain and set the object''s prototype.
    If your controllable object can use this the recursive merge function will actually
    manipulate the global prototypes commonly Object.prototype. This then allows you
    to have control over unexpected properties that the developer assumes are safe
    and therefore can lead to DOM XSS in the client or even RCE at the server level.


    Normally you can set an ordinary object called __proto__ as mentioned it''s really
    a getter/setter. However, when using JSON.parse a regular property is created
    if you use the __proto__ property, this is one of the components that can lead
    to prototype pollution. This can be demonstrated with the following code:


    ```

    1 ({__proto__":"foo"}).hasOwnProperty(''proto__'')//false

    2 (JSON.parse(''{"__proto__":"foo"'')).hasOwnProperty(''proto__''))//true

    ```


    When a vulnerable merge function the object, because __proto__ is a regular property
    this will allow it to be used but importantly when it is attempted to be assigned
    it becomes a setter again on the target object and this is what causes prototype
    pollution. It''s worth noting that __proto__ isn''t the only attack vector it''s
    the most common but there is an alternative __proto__ is essentially a shortcut
    to constructor.prototype and if a recursive merge allows you to use a lot of properties
    then you can use the constructor.prototype properties to cause prototype pollution.
    Now''ve got the basics of how it occurs out of the way look at how you can exploit
    it.


    # Technique


    The technique refers to how it pollutes the prototype. For example you are using
    __proto__ or constructor/prototype or another technique.


    # Source


    A prototype pollution source is the injection required to cause prototype pollution.
    This is made up of a technique the property name and the place it comes from example
    JSON query string or hash. When all those components are together I refer to it
    as a prototype pollution source:


    ```

    ?__proto__[property]=value

    ```'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Gadget


    A gadget means that the property you''ve polluted is used somewhere interesting
    like an eval function or other method or assignment that can result in a vulnerability.
    The property becomes a gadget when it reaches a vulnerable sink.


    # Potential gadget


    If you''ve found a property that is controllable via prototype pollution but you
    have yet to identify if it hits a sink then you can refer to this as a potential
    prototype pollution gadget.


    # Client-side prototype pollution


    There are two forms of prototype pollution: client and server side. This section
    deals with the client-side form. The goal of exploiting client-side prototype
    pollution is generally DOM XSS. You find if the site allows you to add properties
    to the Object prototype and then see if the property hits a sink results in controlling
    JavaScript or HTML.


    # Finding prototype pollution


    Now that we''ve defined the terms we can start to look for prototype pollution.
    You can do this by simply injecting a vector and then use the browser console
    to confirm that it worked. For example imagine a site allows you to use properties
    & values in the query string and has a vulnerable merge operation in a library
    they use. You could inject a probe in the query string that attempted to set a
    property on the Object prototype:


    ```

    __proto__[foo]=bar

    ```


    After the page has loaded you could use the browser console to inspect the Object
    prototype:


    ```

    1 console.log(Object.prototype)

    2 //(foo: ''bar'', constructor: f, __defineGetter__: f, __defineSetter__: f, hasOwnProp\)

    3 rty: f,)

    ```


    If the Object prototype contains any property you''ve successfully found client-side
    prototype pollution. Using the __proto__ property isn''t the only way of finding
    prototype pollution, you can use the constructor[prototype] properties which is
    essentially the same thing, it''s less common than the __proto__ property because
    it requires two key properties and often sites will generally use two. To test
    for this you can follow the process just replace __proto__ with constructor[prototype]:


    ```

    ?constructor[prototype][foo]=bar

    ```


    Which results in manipulation of the object prototype provided the site is vulnerable
    to this technique:'
