    # Fuzzing escapes


    In my effort to break JavaScript sandboxes I ventured into fuzzing different escapes
    such unicode escapes discussed in the introduction chapter. This led me to find
    interesting behaviour in various browsers. I found in Safari it wouldn''t throw
    an exception when encountering undefined unicode escapes in strings. When Old
    Opera (pre-Chrome) would also incorrectly parse unicode escapes when sent to evaluate.
    Old behaviours can be used for sandboxed escapes if you''re lucky how do we find
    them? Fuzzing of course! You have to be aware of the context you''re fuzzing in
    and if they require double encoding. Let''s fuzz a simple unicode escape:


    ```

    1 let a = 123;

    2 log=[];

    3 for(let i=0;i<0x1ffff;i++){

    4   try{

    5     eval(`\\u${String.fromCodePoint(i)}a`);

    6     log.push(i);

    7   } catch(e) {

    8 }

    9 console.log(log);//48

    ```


    In the code I fuzz for all the unicode characters as previously earlier in the
    chapter. This time I defined a variable "a" to see if eval throws or not. Eval
    will throw an exception if the code attempts to access an undefined variable.
    We want to know if "a" is successfully accessed or not. We do not use the escape
    format of "\u" and you have to escape the backslash because we want eval to interpret
    the unicode escape. We add our fuzz character. When fuzzing all characters we
    get one result of "48" which is the character code for zero. We have determined
    that this unicode format allows zero padding with pure fuzzing.'
  - "[PAGE 30]\n\n# Chapter three - Fuzzing\n\nNot only can you fuzz for characters\
    \ you could also fuzz hex by changing the placeholder. Each number literal has\
    \ a toString method that allows you to specify the radix which will convert the\
    \ integer into the base specified from 2-36. Hexadecimal uses base 16 so we have\
    \ to pass a radix of 16 to convert it hex:\n\n```\nlet a = 123;\nlog([]);\nfor(let\
    \ i=0;i<=0x1ffff;i++){\n  try {\n    eval(`\\u${i.toString(16)}`);\n    log.push(i);\n\
    \  } catch(e) {\n}\nconsole.log(log)//97,105\n```\n\nThe code above loops through\
    \ all code points and converts the value to hex to see if the unicode escape results\
    \ in a reference to a variable. We have two results: charcodes 97 and 105 which\
    \ are the \"a\" and the \"i\" characters declared by us. You can mix and match\
    \ fuzz strings with characters to see if the JavaScript engine allows characters\
    \ before, inside or after the hex value. Let's try now and see if the JavaScript\
    \ engine allows any character inside the hex value:\n\n```\nlet a = 123;\nlog([]);\n\
    for(let i=0;i<=0x1ffff;i++){\n  try {\n    eval(`\\u{String.fromCharCode(i)}61`);\n\
    \    log.push(i);\n  } catch(e) {\n}\nconsole.log(log)//48\n```\n\nThe code above\
    \ uses a placeholder to add a character before the hex value of the unicode escape.\
    \ We get a single result in Chrome which is character code 48 is the number zero\
    \ that is expected but it's worth trying on other browsers to see if you get the\
    \ same results.\n\n# Summary\n\nIn this chapter I hope I've taught you a new skill\
    \ of crafting fuzz vectors! We talked about not trusting specifications and seeking\
    \ your ways of finding how JavaScript works. I showed you how to use DOM properties\
    \ to fuzz JavaScript and HTTP URLs. We looked at how you can use innerHTML to\
    \ discover how HTML is parsed. We finished off with fuzzing known behaviours to"
