    \ `title` 属性导致图像元素被渲染。\n\n## SVG 脚本中的 HTML 实体 (HTML entities inside SVG script)\n\
    \n你可能认为只要正确转义，就能防止脚本块内部的 XSS。然而，在 SVG 内部情况完全不同。HTML 实体会被渲染，因为 SVG 是 XML 格式，这意味着当\
    \ SVG 解码实体时， JavaScript 将获得正确的未编码字符。\n\n```html\n<svg>\n<script>let foo = \"&quot;-alert(1)//\"\
    ;</script>\n</svg>\n```\n\n## 无闭合的脚本 (Script without closing script)\n\n你可能认为在使用脚本块时总是需要一个闭合脚本。至少在\
    \ Firefox 中你是错的。如果你使用 SVG，可以在 Firefox 中使用自闭合脚本：\n\n```html\n<svg><script href=data:,alert(1)\
    \ />\n```\n\n你必须使用 `href` 属性，因为你处于 SVG 而不是 HTML 中，且此处不支持 `src` 属性。\n\n## Window\
    \ name 载荷 (Window name payloads)\n\nXSS 库中的另一个常用技巧是使用 `window.name` 将 Payload\
