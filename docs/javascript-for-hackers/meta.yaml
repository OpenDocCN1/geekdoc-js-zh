  md: '# Has instance symbol


    The last method I want to discuss is using the has instance symbol. Symbols allow
    you to define a unique token in property keys. They are built in symbols that
    you can use to perform various operations. JavaScript uses symbols in this way
    to avoid using special properties that clash with existing code on the web. The
    "has instance" symbol allows you to customise the behaviour of the instanceof
    operator, if you set this symbol it will pass the left operand to the function
    defined by the symbol. This offers a neat way of executing JavaScript without
    parentheses:


    ```

    alert(''\x281337\x29''instanceof([Symbol[''hasInstance'']]):eval)//calls alert(1337)

    ```


    In the example above we define our payload in the string before the instanceof
    operator and use a new object literal with the "hasInstance" symbol and assign
    the eval operator, then when the instanceof operator runs with the string and
    object, the string gets passed to eval and the alert function will be called.
    You can use the symbol in this way without the square brackets:


    ```

    alert(''\x281337\x29''instanceof([Symbol.hasInstance]:eval)//calls alert(1337)

    ```


