    \ `Object` 原型添加属性，然后查看该属性触及汇点后是否会对 JavaScript 或 HTML 实现控制。\n\n## 寻找原型污染\n\n既然我们已经定义了术语，就可以开始寻找原型污染了。你可以通过简单注入向量（vector），然后使用浏览器控制台确认其是否生效。例如，假设一个网站允许你在查询字符串中使用属性和值，并且它们使用的库中有一个存在漏洞的合并操作。你可以在查询字符串中注入一个探测脚本，尝试在\
    \ `Object` 原型上设置属性：\n\n```\n__proto__[foo]=bar\n```\n\n在页面加载后，你可以使用浏览器控制台检查 `Object`\
    \ 原型：\n\n```javascript\n1 console.log(Object.prototype)\n2 //(foo: 'bar', constructor:\
    \ f, __defineGetter__: f, __defineSetter__: f, hasOwnProp\\)\n3 rty: f,)\n```\n\
    \n如果 `Object` 原型包含任何你成功找到的属性，说明你发现了客户端原型污染。使用 `__proto__` 属性并不是寻找原型污染的唯一方法，你可以使用\
    \ `constructor[prototype]` 属性，这本质上是一样的。它比 `__proto__` 属性不常见，因为它需要两个属性，而网站通常会使用这两个。要测试这一点，你可以遵循上述过程并将\
    \ `__proto__` 替换为 `constructor[prototype]`：\n\n```javascript\n?constructor[prototype][foo]=bar\n\
    ```\n\n如果网站对该技术敏感，这将导致对象原型的操纵：\n\n## 第六章 - 原型污染\n\n```javascript\n1 console.log(Object.prototype)\
    \ __Getter__: f, __define__: f, hasOwnProp\\\n2 //<foo:'bar', constructor: f,\
    \ __define__: f, __defineSetter__: f, hasOwnProp\\\n3 rty: f, _\n```\n\n不同的库解析查询字符串的方式不同，我遇到过在查询字符串中使用点（.）的网站，测试这种情况只需移除方括号并添加点来访问不同的属性键：\n\
    \n```\n?__proto__.foo=bar\n```\n\n检查哈希（hash）也是值得的，我见过有些网站会将 hash 解析为查询参数。如果你尝试查询字符串和\
    \ hash 的每种组合，那么应该可以找到 99% 的客户端原型污染漏洞。\n\n## 修改原生方法\n\n当网站易受到原型污染攻击时，你并不局限于操纵 `Object`\
