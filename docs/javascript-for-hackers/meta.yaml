    # Dynamic imports


    Javascript allows you to dynamically load a module using import() it''s like a
    regular function except it allows the JavaScript engine to choose if it''s actually
    needed. This function-like expression allows you to specify URLs to import it
    allows you to specify a data URL to execute arbitrary JavaScript:


    ```

    import(''data:text/javascript,alert(1)'')

    ```


    # XHTML namespace in XML


    If you have control over an XML file with a content type of text/xml it''s still
    possible to execute JavaScript if you provide an XHTML namespace. However, just
    adding a name to the img element will allow it to be rendered as XHTML:


    ```

    <xml>

    <text>hello<img src="1" onerror="alert(1)" /></text>

    </xml>

    ```


    Without a namespace the browser will render the above code as XML and show the
    XML view.


    ```

    <xml>

    <text>hello<img src="1" onerror="alert(1)" xmlns="http://www.w3.org/1999/xhtml"
    /> </text>

    </xml>

    ```


    This can be useful for file uploads or when you have control over a REST API response
    served with an XML content type.


    # SVG uploads


    It''s common to allow image file uploads on a web application but many forget
    you can use script inside the uploaded SVG documents. Unlike SVG the parsing is
    stricter when using an SVG with the correct mime type. This means you need to
    ensure the correct namespace attribute has been added and it should conform to
    XML parsing rules e.g all attributes should be quoted.'
