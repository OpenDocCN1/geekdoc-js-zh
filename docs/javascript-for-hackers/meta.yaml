  md: "# Filter exploitation\n\nThere are other ways of exploiting DOM clobbering.\
    \ controlling the value is just one way of exploitation. You can clobber the attributes\
    \ of a DOM node to fool a filter into removing no attributes at all. Consider\
    \ the following example which shows a form element with three attributes, the\
    \ script loops through the attributes to the first and checks if it begins with\
    \ \"on\" if it removes the attributes:\n\n```\n<form id=x onclick=alert(i) onmouseover=alert(2)>\n\
    <input>\n</form>\n<script>\nfor(let i=document.getElementById('x').attributes.length-1;i>=0;i--)\
    \ {\n  let attribute=document.getElementById('x').attributes[i];\n  if(/on/i.test(attribute.name))\
    \ {\n    continue;\n  }\n  document.getElementById('x').removeAttribute(attribute.name);\n\
    }\n</script>\n```\n\nThe script removes the attributes by looping through all\
    \ the attributes using the attributes property, unfortunately this property can\
    \ be clobbered by providing a child node with a name of \"attributes\". What happens\
    \ then the script uses the clobbered input as the attributes property and the\
    \ length of element is undefined and therefore the loop will not iterate anything.\
    \ an attacker to sneak their malicious events in and break the filter.\n\nYou\
    \ are not limited to attributes, other DOM properties like tagName/nodeName are\
    \ clobberable, imagine you have a list filter that contains tags such as form.\
    \ You can inject a form with an input element that has a name with tagName or\
    \ nodeName. When a filter accesses it will instead access the clobbered input\
    \ and therefore return the wrong value:\n\n```\n<form id=x>\n<input name=nodeName>\n\
    </form>\n<script>\nalert(document.getElementById('x').nodeName)//object HTMLInputElement\n\
    </script>\n```\n\nEven properties like parentNode are not safe. You canobber the\
    \ last of it just like the others which will return the incorrect parentNode for\
    \ a form element. If you had a DOM based filter that traversed elements using\
    \ DOM properties as parentNode, nextSibling, previousSibling etc. Your filter\
    \ would traverse the wrong elements and filter the incorrect DOM nodes."
