    ```


    ## 十进制实体


    十六进制实体与十进制实体有许多相似之处，但前缀略有不同。你使用 `&x` 作为前缀并将字符代码转换为十六进制。分号再次是可选的，如果后面有一个额外的有效的十六进制字符，它将产生一个不同的字符，因此你需要确保后续字符不是有效的：


