    # Unicode


    Unicode escapes also work in strings but are also allowed in identifiers. There
    are two forms of unicode escapes "\u" and "\U". The former allows you to produce
    a character within the range 0x00-FFFF the latter allows you to specify the entire
    range of unicode code points. There are some examples of unicode escapes:


    ```

    \u0061`//a

    \u0061`//a

    \u0061`//a


    function a(){

    \u0061()//correct calls the function

    ```


    The code above will execute perfectly fine, each string about this form of unicode
    escapes and the function will be called correctly. Some points about this type
    of unicode escapes you must specify four hexadecimal characters for example \u61
    is not allowed, most browsers will throw an exception: There were some browsers
    that allow invalid unicode escapes as \u61 but was a browser bug. You cannot encode
    parentheses or other characters only identifiers of strings. Next is another type
    of unicode escape that allows you to specify unicode code points for the entire
    range, they have similar characteristics as standard unicode escapes that you
    can use in strings and unlike standard unicode escapes they are not restricted
    to four hexadecimal characters. To use these escapes you use \U] inside the curly
    braces you specify a hex unicode code point. The following examples work fine
    with this type of unicode escape:


    ```

    \u{61}`//a

    \u{000000000061}`//a

    \u{0061}`//a


    function a(){

    \u{61}()//correct calls the function


    u{3134a}=123//unicode character "3134a" is allowed as a variable

    ```


    As the code demonstrates an unlimited amount of zero padding and the exclusion
    of zeros will be allowed. You can specify higher unicode characters as the last
    example shows. Those are the main differences between the two unicode escapes:


    # Octal


    Octal escapes use base 8 and can only be used strings. There is no prefix with
    octal escapes; you simply use a backslash followed by a base 8 number. If you
    try to use a number outside the octal range the JavaScript engine will just return
    the number:'
