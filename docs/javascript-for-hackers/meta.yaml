    - 1 <a href="&#x6a;javascript:alert(1)">test</a>a>


    ## 命名实体


    如你所知，HTML 也支持命名实体。


    ## HTML5 命名实体


    正如你所知，HTML5 引入了许多新的实体，这些对于非常有用。


    - 1 <a href="javascript:alert(1337)">test</a>a>

    - 2 <a href="javascript:alert(1337)">test</a>a>

