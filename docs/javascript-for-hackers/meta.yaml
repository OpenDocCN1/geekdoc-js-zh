    Other entities are &amp;&par; &bol;&lsq;&rsub;&rc; is a closing parenthesis. &l;
    translates to opening parenthesis and &amp; semicolon. &bol; is a backslash character
    and &amp;&sq; are square brackets and &lt;&rc; are right and left curly braces.
    Here''s how to use the &lt; &amp; &gt; entities:


    +   1. <a href="javascript:colon:alert&lpar;1337&rpar;">test</a>


    There are even entities for new line and tab which we learned in the fuzzing character
    can be used inside the JavaScript protocol:


    +   1. <a href="jav&NewLine;as&Tab;crit&colon;alert&lpar;1337&rpar;">test</a>


    If you can manage to inject a JavaScript URL but parentheses are being blocked
    by a WAF, you can use named entities for the backtick character, there are two
    of which become:


    +   1. <a href="javascript:alert&grave;1337&grave;">test</a>


    +   2. <a href="javascript:alert&DiacriticalGrave;1337&DiacriticalGrave;">test</a>


    # Events


    # onafterscriptexecute


    There are many notable events that fire without user interaction and these are
    most useful if you do not have to convince the victim to click on anything. I''m
    going to highlight the less known events since they will be most useful for bypassing
    filters and WAFs. The onafterscriptexecute is a Firefox only event and as the
    name suggests will fire after script is executed. It''s really cool about this
    event that it can be used on any tag, the only downside is it to be inside the
    tag you inject:'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# Chapter eight - XSS


    ```

    <xss onafterscriptexecute=alert(1)><script></script>

    ```


    You could use this to inject an opening tag and a pre-existing script could be
    loaded inside it, this would be enough to fire the event. There is a related event
    called onbeforescriptexecute again this Firefox only and requires an existing
    script.


    # ontoggle


    This is probably well known than the other tricks. You can get the ontoggle event
    to fire automatically if you force the details element to be expanded.


    ```

    <details ontoggle=alert(1) open>test</details>

    ```


    # unhandledrejection


    This is a relatively obscure event that only works on Firefox. It requires a promise
    without a catch clause. To exploit a site with what you need an existing script
    that has an unhandled rejection.


    ```

    <body>unhandledrejection=alert(1)><script>fetch(''//xyz'')</script>

    ```


    # onbegin


    SVG contains a lot of interesting events, onbegin will fire when an animation
    starts and is quite short which is always good for an XSS payload. To use it you
    have to use the animate tag and give it an attribute to animate and it''s duration:


    ```

    <svg><animate onbegin=alert(1) attributeName=x dur=is>

    ```


    This also has a related tag called once when the animation ends. It also requires
    an attribute to define its duration and an attribute to animate.


    # Navigation based events


    There are a few events you can use that sort of navigation to fire. One such event
    is onpoststate, this is fired when the history changes. In order to fire this
    event you have to change the URL of the target in some way. This most likely has
    to involve an iframe, one thing noting is that when using a cross origin iframe
    alert(1) won''t work, you have to use the print() function instead. Here are some
    examples:'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# Chapter eight - XSS


    ```

    <body>onpopstate=alert(1)<script>location.hash=1</script>

    ```


    ```

    <iframe src="/target?x=<body>onpopstate=print()" onload="this.src2b=''%23">

    ```


    You can use iframes again to gain modification to the hash portion of the URL
    to fire events like hashchange too:


    ```

    <iframe src="/target?x=<body>/onhashchange=print()" onload="this.src2b=''%23">

    ```


    # onmessage


    Using iframes again you can load an external URL for your injection of the onmessage
    handler and then using postMessage to fire the event:


    ```

    <iframe src="/target?x=<body>onmessage=print()" onload="this.contentWindow.postMessage(''x'',
    ''*'')">

    ```


    # ofocus


    Usually this can be fired using textarea or input using the autofocus attribute.
    It''s possible to get this event to work on other elements by using tabindexing
    and an id attribute. Tabindex is an accessibility attribute that lets you choose
    which element on the page are selected when you press tab. By combining this with
    an id attribute and using hash from the URL it will automatically focus the element:


    ```

    <x focus=alert(1) id=x tabindex=1>

    ```


    somepage.html#


    There''s another trick too, you can actually use the autofocus attribute on any
    element at least on Chrome, provided you use the tabindexing with it. This means
    you don''t need an id attribute or a hash:


    ```

    <x focus=alert(1) autofocus tabindex=1>

    ```


    Similarly there is a related event called ofocus which you can use to bypass a
    WAF and have the same behaviour described above.


    # Animation based events


    It''s quite well known that you can use CSS transitions/animations to fire events
    on any tag. If you''re not aware here''s how to do it:'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# Chapter eight - XSS


    ```

    <style>;target {color: red;}</style>

    <xss id=x style="transition:color 10s" ontrransitioncancel=print()></xss>

    ```


    homepage.html#x

    This works by using the target selector to change the styles on the element when
    it specified in the hash partition of the URL is found. This fires the event.
    The downside with this particular approach is that it requires a style block which
    would probably be blocked by a WAF or filter. There is another way, we can use
    the trick described earlier to cover the element and Chrome adds a CSS outline
    to elements focused you can use a transition that will fire the event because
    the outline change:


    ```

    <xss id=x style="transition:outline 1s" ontrransitionend=alert(1) tabindex=1></xss>

    ```


    homepage.html#x

    If you''re having trouble sneaking that there''s always the wekit variant you
    can use:


    ```

    <xss id=x style="transition:outline 1s" onwebkittrransitionend=alert(1) tabindex=1></xss>

    ```


    homepage.html#x


    # Summary


    We covered a lot in this chapter. I basically tried to do a brain dump of obscure
    tricks I could think of or answers to questions I''ve been asked on Twitter. First
    we covered how to close scripts without a closing tag. Then covered how to abuse
    HTML comments inside scripts, HTML entities inside SVG, how to abuse window.name
    to smuggle payloads and cookies. We learnt how to use source maps to send a ping
    to an attacker controlled server. After that we demonstrated a JavaScript script
    called navigate() that works in Chrome. Next we covered all the comments in JavaScript
    and the whitespace characters. Later we showed how to use dynamic imports with
    data URLs. Afterward we covered how to get HTML inside an XML document. Then we
    showed how to use SVG uploads and use elements. After that we covered HTML entities
    and finally finished off with lesser JavaScript events.'
  merge: -1
  pgno: 78
- img_proc: true
