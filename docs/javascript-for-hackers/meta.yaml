    \ the debugger will have gone past the part you want to debug. This is where the\
    \ second command line flag is useful -inspect-brk which will instruct the node\
    \ process to pause before the application is executed which is super when for\
    \ gadgets in node applications. You can then use Chrome again at the same URL\
    \ as mentioned earlier you can use the debugger to step or resume execution, even\
    \ add your own breakpoints.\n\nUsing devtools sitewide search is also super handy\
    \ for testing, once you have the remote console open as instructed earlier you\
    \ can perform a search on all the node apps running. Clicking on the three dots\
    \ at the right hand side of the devtools window and click the search option. You\
    \ can use this to look for potential gadgets. Combine this with the defineProperty()\
    \ technique mentioned earlier should help identify them.\n\n## Summary\n\nIn this\
    \ chapter we've introduced prototype pollution, defined what a technique, source\
    \ and gadget is. We've shown you how to find prototype pollution and how you can\
    \ modify native functions using a prototype pollution vulnerability. We then talked\
