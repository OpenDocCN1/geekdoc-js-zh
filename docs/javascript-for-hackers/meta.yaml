  md: '# Chapter six - Prototype pollution


    ```

    1 console.log(Object.prototype) __Getter__: f, __define__: f, hasOwnProp\

    2 //<foo:''bar'', constructor: f, __define__: f, __defineSetter__: f, hasOwnProp\

    3 rty: f, _

    ```


    Different libraries parse the query string in different ways, I have encountered
    sites that use dots in the query string, test for that simply remove the square
    brackets and add to access different property keys:


    ?__proto__.foo=bar


    It''s worth checking the hash, I''ve seen sites parsing the hash as query parameters.
    If you try each combination with both query string and hash then that should get
    99% of client-side prototype pollution vulnerabilities.


    # Modification of native methods


    When a site is vulnerable to prototype pollution you are not limited to just manipulating
