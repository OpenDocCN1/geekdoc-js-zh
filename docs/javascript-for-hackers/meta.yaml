  md: '# Chapter eight - XSS


    ```

    <svg id=''x'' xmlns=''http://www.w3.org/2000/svg'' xmlnslink=''http://www.w3.org/1999/x''

    link width=''100'' height=''100''>

    <image href="1" onerror=''alert(1)'' />

    </svg>

    ```


    You can prevent exploitation of this by obviously filtering the SVG but if you
    can''t do that you can always serve the file with a content disposition header
    and value attachment:


    Content-Disposition: attachment


    This should prevent the SVG from being rendered in a modern browser. There is
    a caveat though: if it is embedded via the <use> element it will still render.


    # SVG use elements


    As mentioned above you can use JavaScript execution by embedding an SVG document
    using the <use> element SVG. This works provided that the document is on the same
    domain. You can also use data URLs and I will demonstrate this below:


    ```

    <svg href="data:image/svg+xml,&lt;svg id=''x'' xmlns=''http://www.w3.org/2000/svg\n&gt;&lt;image
    href=''1'' onerror=''alert(1)''&gt;&lt;/svg&gt;*x" />

    ```


    Notice because the data URL using a valid SVG mime type follows the stricter rules.
    It''s also worth noting that even though this is a data URL it won''t be executed
    from a null origin, it will inherit the origin from the page.


    # HTML entities


    HTML has a wide range of encoding options. In this section I''m going to go through
    the various ways you can encode characters with entities and finish off section
    with a few examples.


    # Decimal entities


    You can use character codes to represent different characters, they are prefixed
    with &# and ends with an optional semicolon. For example the character "j" is
    represented as the character code 106. To produce this character simply have to
    combine the prefix with the code, followed by an optional semi-colon. You can
    also use many zeros as you like before the character code:'
