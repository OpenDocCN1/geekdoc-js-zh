    # Fuzzing escapes


    In my effort to break JavaScript sandboxes I ventured into fuzzing different escapes
    such unicode escapes discussed in the introduction chapter. This led me to find
    interesting behaviour in various browsers. I found in Safari it wouldn''t throw
    an exception when encountering undefined unicode escapes in strings. When Old
    Opera (pre-Chrome) would also incorrectly parse unicode escapes when sent to evaluate.
    Old behaviours can be used for sandboxed escapes if you''re lucky how do we find
    them? Fuzzing of course! You have to be aware of the context you''re fuzzing in
    and if they require double encoding. Let''s fuzz a simple unicode escape:


