    # 第一章 - 引言


    JavaScript 是我的热情所在，我对能够帮助我进一步理解 JS 的方法着迷。你经常能看到我推特介绍关于无括号调用函数的方法、疯狂的 XSS 向量以及寻找深层理解某个特性的通用方法。我经常被问及如何将一条推文应用于
    WAF 绕过或浏览器漏洞。这并不重要，诚然你可以使用无括号调用 JavaScript 函数的方法来绕过 WAF，但我推文的重点在于重复并快速获取可以应用的知识。


    其中例子是 `].sort`，`sort` 接受参数，我发现可以用它来实现我将讨论的目标。我正在尝试“黑进”我的大脑，让这些向量对我来说变得重要，你会看到我发布特定技术的变体，而我从这些技术中发现乐趣确实很有帮助。你有多少次发现自己读一本书或特定文章却无法留在脑子里？通过寻找黑进
    JavaScript 的方法，你正在学习一个特性，然后应用该知识来实现目标，无论那个目标是什么，只要你是一个目标，它就能帮助你记住。


    # 环境


    为了遵循这个流程，你需要一个快速的环境来进行测试。这意味着你需要一个可以执行代码并立即获得结果的地方。这可以是多种形式，浏览器控制台、本地服务器或像 JS
    Fiddle 这样的 Web 应用程序。我个人决定编写一个自己的 Web 应用“Hackvector”，赋予它评估代码、检查对象、编写 HTML 的功能，但其他方案也可以。我只是想要更多的功能，并确保你的输入不会被记录在某处。

    '
