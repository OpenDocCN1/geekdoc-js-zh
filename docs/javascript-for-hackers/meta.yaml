    # Hex entities


    There are a lot of similarities with hex entities as decimal but there''s a slightly
    different prefix. You use &xa as the prefix and convert the character code to
    hex. The semicolon is optional again if there is an extra character that is valid
    he''s going to produce a different character so you need to ensure the following
    character isn''t valid


    +   1 <a href="&#x6a;avascript:alert(1337)">test1</a>

    2 <a href="&#x7a;avascript:alert(1337)">test2</a>

    3 <a href="&#x00000000&#x6a;avascript:alert(1337)">test3</a>

    4 <a href="java&#x61;script:alert(1337)">test4</a>


    In the preceding second example will fail because "a" is valid hex and therefore
    produces a different character than the required "j". The last example works because
    "s" isn''t valid hex so the entity produces the correct character. To produce
    this encoding you just need to get the code point again but convert to hex like
    this:


    ```

    ''j''.codePoint(@).toString(16)

    ```


    It''s worth noting when you have a hex value with a leading zero you can actual
    it and it will still work:


    +   1 <a href="java&#x61;script:alert(1)">test</a>


    # Named entities


    As you are aware HTML also supports named entities; these allow you to represent
    different characters using a specific name. The most common named entities are
    probably &lt; and &gt;. For certain entities the semicolon is optional but will
    only be decoded depending what the next character is.'
