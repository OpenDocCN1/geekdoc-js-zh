    \ for the property is accessed:\n\n```javascript\nObject.defineProperty(Object.prototype,'potentialGadget',\
    \ {__proto__:null, get(){\n  console.trace();\n  return 'test';\n}})\n```\n\n\
    Using the stack trace you can identify the part of the source code that uses this\
    \ property and if the value ends up in a vulnerable sink. There are tools out\
    \ that automate this process. I've written a tool called DOM Invader that can\
    \ detect prototype pollution sources and gadgets. It's a browser extension as\
    \ part of the embedded browser in Burp Suite.\n\n## Server-side prototype pollution\n\
    \nClient-side prototype pollution is quite easy to detect since you have the source\
    \ code whereas server-side is much more difficult because the pollution happens\
    \ on the server and usually you won't have access to the source code. The problem\
    \ is escalated further when it comes to DoS, with client-side DoS you can refresh\
    \ the browser and things will work again whereas the DoS occurs at the server\
    \ level, the application can be broken and inaccessible to you or other users\
    \ and then the only solution is to restart the node process.\n\nIf you have the\
    \ source code things are even easier. The same principles apply to server side\
    \ prototype pollution, you and gadget. You can even apply the same way of detecting\
    \ prototype pollution was successful by using the browser console, provided you\
    \ have control over the node process and are hosting the application yourself.\
    \ There are two important command line flags to node that are super important:\n\
    \n- - inspect\n- -inspect-brk\n\nThe first option allows you to use devtools to\
    \ debug the node application, you simply add the command line flag when running\
    \ the application:\n\n```bash\nnode -inspect your-app.js\n```\n\nThen you can\
    \ use Chrome to debug node by visiting: chrome://inspect/\n\nIf you've started\
