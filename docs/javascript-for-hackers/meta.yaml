    parentheses:


    ```

    alert(''\x281337\x29''instanceof([Symbol[''hasInstance'']]):eval)//calls alert(1337)

    ```


    In the example above we define our payload in the string before the instanceof
    operator and use a new object literal with the "hasInstance" symbol and assign
    the eval operator, then when the instanceof operator runs with the string and
    object, the string gets passed to eval and the alert function will be called.
    You can use the symbol in this way without the square brackets:


    ```

    alert(''\x281337\x29''instanceof([Symbol.hasInstance]:eval)//calls alert(1337)

    ```


    # Summary


    This chapter showed you how to define a goal and subgoals within that goal. This
    enabled you to learn various JavaScript features at a rapid pace and made sure
    you are not staring at a blank screen. Having clear goals in mind helps you to
    focus on interesting features and ensure you are constantly learning. In this
    chapter we learnt about the onerror handler and how to abuse it for executing
    JavaScript without parentheses, we moved onto tagged template strings and uncovered
    surprising behaviour of using pass arguments to functions with their type and
    finally we covered the "hasInstance" symbol and how to abuse it for JavaScript
    hacking.'
