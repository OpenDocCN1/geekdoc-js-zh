  \      adapter.Update(ds, \"Customers\");\n\n      //Delete a row from the order\
  \ detail\n      //The row has OrderId of 1 and Product Id = 06897\n      adapter\
  \ = new SqlDataAdapter(\"SELECT * FROM\n                                   EmployeeTerritories\"\
  , conn);\n      adapter.MissingSchemaAction = MissingSchemaAction.Add\n        \
