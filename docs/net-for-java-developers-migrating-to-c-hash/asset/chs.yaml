  HelloWorld1 toString()\");\n     return \"Hello\";\n   }\n }\n```\n\n\n\n\n### 2.2.\
  \ 跨文件类访问\n\n使用命令行 `csc MyHelloWorldApp.cs` 编译 清单 2.7。然后在命令提示符下输入 `MyHelloWorldApp`\
  \ 运行程序。你将看到 清单 2.9 所示的输出。\n\n##### 清单 2.9. `MyHelloWorldApp` 程序的输出\n\n```\n Inside\
  \ HelloWorld\nHelloWorld1 ToString()\nHello\n```\n\n在 Java 中，如果你有两个类——A 和 B——编译到不同的文件中，只要默认的类加载器可以从指定的类路径加载各个\
  \ A 和 B 类，A 就可以调用 B 中的方法，反之亦然。对于 C# 中的相同情况，只要你在编译时指定包含类 A 的文件使用包含类 B 的文件中定义的命名空间中的类，类\
  \ A 就可以访问包含类 B 的文件中的方法。例如，一个源文件 (`MyHelloWorldApp2.cs`) 中的类 `HelloWorld2` 可以访问文件\
  \ `MyHelloWorldApp.cs` 中的类 `HelloWorld1`，条件是在编译 `MyHelloWorldApp2.cs` 时，你指定它使用 `MyHelloWorldApp.cs`\
  \ 定义的命名空间中的类。\n\n清单 2.10 展示了如何编写此代码的示例。请注意，生成的 `MyHelloWorldApp.exe` 文件包含定义 `MyHelloWorldApp.cs`\
  \ 中类所需的所有元数据。\n\n##### 清单 2.10. 访问不同命名空间中定义的另一个类的类 (C#)\n\n```csharp\n 1 namespace\
  \ Test2 {\n2   using System;\n3   using Test;\n4   public class HelloWorld2 {\n\
  5     public static void Main(string[] args){\n6       Console.WriteLine(\"Inside\
  \ HelloWorld2\");\n7       Console.WriteLine(new HelloWorld1());\n8     }\n9   }\n\
  10}\n```\n\n清单 2.11 展示了 清单 2.10 的 Java 等效代码。\n\n##### 清单 2.11. 清单 2.10 的 Java 等效代码\n\
  \n```java\n 1     package Test2;\n2     import Test.*;\n3     public class MyHelloWorldApp2{\n\
  4         public static void main(String[] args){\n5           System.out.println(new\
  \ HelloWorld1());\n6         }\n7       }\n```\n\n`MyHelloWorldApp2.java` 类导入 `Test`\
  \ 包中的类，然后访问该包的 `MyHelloWorldApp` 类。请注意，由于 `MyHelloWorldApp2` Java 类位于不同的包中，它无法访问其他包中的非公共类。\n\
  \n在 C# 中，要使 `MyHelloWorldApp2.cs` 运行，请使用以下命令编译它：\n\n```\n csc MyHelloWorldApp2.cs\
  \ /r:MyHelloWorldApp.exe\n```\n\n要运行它，请在提示符下调用 `MyHelloWorldApp2`。你将看到 清单 2.12 所示的输出。\n\
  \n##### 清单 2.12. 运行 `MyHelloWorldApp2.exe` 的输出\n\n```\n Inside HelloWorld2\nHelloWorld1\
  \ ToString()\nHello\n```\n\n一个有趣的点是，`HelloWorld2` 和 `HelloWorld` 类都定义了入口点。因此，当 清单\
  \ 2.10（包含 `HelloWorld2` 类）使用 `/r` 选项编译时，生成的 EXE 文件会优先选择正在编译的主类的入口点。另请注意，`HelloWorld`\
  \ 需要是公共的，`HelloWorld2` 才能访问它。有关类和方法访问修饰符的更多信息，请参见 第 4 章。\n\n从前面的示例中可以清楚地看出，C# EXE\
  \ 文件不等同于 Java 类文件。EXE 文件是一个自包含的文件，包含运行入口点的所有信息。它将识别并加载入口点所依赖的所有依赖类的元数据。这消除了对类路径的需求。在\
  \ Java 中，只要所有类都可以通过 `classpath` 变量被运行时访问，依赖于其他类的单个类就可以运行。你可以将多个具有入口点的 `.cs` 文件组合起来，并将它们编译成一个\
  \ EXE 文件；你可以使用编译器的 `/m` 选项在编译时指定哪个类用作入口点。\n\n### 2.3. C# 性能\n\nJava 程序员了解 Java 的性能问题，因此此时快速浏览一下\
  \ C# 的性能是公平的。\n\n测试语言性能的一个好方法是看两种语言迭代 `for` 循环 1000 万次需要多长时间。清单 2.13 展示了 C# 代码，清单\
  \ 2.14 展示了相应的 Java 代码。请注意，在 C# 中 `Environment.TickCount` 返回自系统启动以来经过的时间（以毫秒为单位）。这与\
  \ Java 的 `System.currentTimeMillis()` 函数非常接近。\n\n##### 清单 2.13. 迭代 1000 万次 (C#)\n\
  \n```csharp\n 1     using System;\n2     public class ForLoopTest {\n3       public\
  \ static void Main(string[] args) {\n4           long start = Environment.TickCount;\n\
  5           for (int i =0;i < 10000000; ++i) {\n6           }\n7            long\
  \ end = Environment.TickCount;\n8            Console.WriteLine((end-start));\n9\
  \           }\n10    }\n```\n\n##### 清单 2.14. 迭代 1000 万次 (Java)\n\n```java\n 1 \
  \    public class Performance {\n2     public static void main(String[] args) {\n\
  3          long start = System.currentTimeMillis();\n4          for (int i=0; i\
  \ < 10000000; ++i) {}\n5          long end = System.currentTimeMillis();\n6    \
  \        System.out.println(end-start);\n7     }\n8     }\n```\n\nC# 控制台打印 50，Java\
  \ 控制台打印 120。通过这个简单的测试，我们不能得出 C# 运行时比 Java 运行时更快的结论；这些结果取决于几个因素，例如硬件和软件配置。Java 程序员可能对看到这类性能测试感到好奇，但这超出了本书的范围，无法深入探讨性能测试。\n\
  \n### 2.4. C# 工具\n\n本节探讨 .NET SDK 提供的一些工具，这些工具可以提高你的 C# 编程效率。\n\n#### 2.4.1. Visual\
  \ Studio .NET\n\nMicrosoft 提供了一个用于使用 C# 进行快速高效开发的 IDE。Visual Studio .NET 是一个用于使用\
  \ Visual Basic、Visual C++ 和 C# 进行 .NET 开发的 IDE。图 2.1 展示了 Visual Studio .NET 的启动屏幕。\n\
