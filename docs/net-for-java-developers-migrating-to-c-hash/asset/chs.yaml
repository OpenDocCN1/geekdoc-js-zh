  ```\n\n### 19.3.5. 处理事务\n\n在 JDBC 中，你可以使用以下代码模拟本地数据库级别的事务：\n\n```java\nboolean originalAutoCommit\
  \ = conn.getAutoCommit();\ntry {\nconn.setAutoCommit(false);\nconn.commit();\n}\
  \ catch(Exception e) {\nconn.rollback();\n} finally {\nconn.setAutoCommit(originalAutoCommit);\n\
  }\n```\n\n你通过关闭连接的自动提交功能，然后将其恢复到原始状态来设置事务边界。当发生异常时，会调用 `rollback()` 方法，这会回滚在 `try`\
  \ 块中所做的更改。\n\n很明显，JDBC 中没有一等的 `Transaction` 对象。然而，C# 有一个 `Transaction` 对象和一个接口。清单\
  \ 19.7 展示了一个 C# 事务。\n\n#### 清单 19.7. ADO.NET 中的事务 (C#)\n\n```csharp\nusing System;\n\
  using System.Data;\nusing System.Data.OleDb;\nusing System.Data.SqlClient;\nclass\
  \ Test {\n\n  public static void Main(string[] args) {\n    Transaction();\n  }\n\
  \  private static void Transaction() {\n    SqlConnection conn = null;\n    SqlTransaction\
  \ trans = null;\n    try {\n      conn = GetConnection();\n      trans = conn.BeginTransaction();\n\
  \      SqlCommand command = new SqlCommand();\n      command.Connection = conn;\n\
  \      command.Transaction = trans;\n      command.CommandText = \"UPDATE CATEGORIES\n\
  \        SET CategoryName = 'Drink' WHERE CategoryID = 1\";\n      command.ExecuteNonQuery();\n\
  \      trans.Save(\"Savepoint1\");\n      command.CommandText = \"UPDATE CATEGORIES\n\
  \        SET CategoryName = 'Spices' WHERE CategoryID = 2\";\n      command.ExecuteNonQuery();\n\
  \      trans.Commit();\n    } catch(Exception e) {\n      trans.Rollback(\"Savepont1\"\
  );\n    } finally {\n       if (conn != null) conn.Close();\n    }\n  }\n\n  private\
  \ static SqlConnection GetConnection() {\n    SqlConnection conn = new SqlConnection\
  \ ();\n    conn.ConnectionString = \"Initial Catalog=Northwind;Data\n          \
  \         Source=localhost;Integrated Security=SSPI;\";\n    conn.Open();\n    return\
  \ conn;\n  }\n\n}\n```\n\nC# 支持六种事务隔离级别（参见 表 19.2）。默认的隔离级别是 `ReadCommitted`。\n\n\
  \n\n\n\n`Transaction` 类还指定了 `savepoint`，这是仅在 JDBC 3.0 中可用的功能。保存点提供了一种回滚事务部分的机制。你可以使用\
  \ `Save` 方法创建一个 `savepoint`，然后调用 `Rollback` 方法回滚到该保存点，而不是回滚到事务的开始。当错误不太可能发生时，保存点非常有用。在发生罕见错误的情况下，使用保存点回滚事务的一部分，可能比让每个事务在更新前测试更新是否有效更高效。更新和回滚是昂贵的操作，因此只有在遇到错误的概率较低且事先检查更新有效性的成本相对较高时，保存点才是有效的。\n\
  \n### 19.3.6. 探索数据库元数据\n\n元数据是一个指代“关于数据的数据”的术语，因此数据库元数据基本上是存储在数据库中关于数据库本身的信息。JDBC\
  \ API 提供了 `java.sql.DatabaseMetaData` 和 `java.sql.ResultSetMetaData` 接口，分别支持发现数据库组件和结果集的信息。元数据通常对编写数据库浏览器等工具的开发者很有用。在\
  \ C# 中，元数据信息分散在各个 API 对象中。当我们接下来讨论 `DataSet` 时，结果集元数据的等效概念将变得清晰。\n\n**表 19.2. ADO.NET\
  \ 事务隔离级别**\n\n| 成员名称 | 描述 |\n| --- | --- |\n| `Chaos` | 无法覆盖来自更高隔离级别事务的未决更改。 |\n\
  | `ReadCommitted` | 防止脏读；可能发生不可重复读和幻读。此级别仅禁止事务读取包含未提交更改的行。 |\n| `ReadUnCommitted`\
  \ | 可能发生脏读、不可重复读和幻读。此级别允许一个事务在另一事务的行更改被提交之前读取该行（脏读）。如果任何更改被回滚，第二个事务将检索到无效的行。 |\n\
  | `RepeatableRead` | 防止脏读和不可重复读；可能发生幻读。此级别禁止事务读取包含未提交更改的行，并且还禁止一个事务读取一行、第二个事务修改该行、然后第一个事务重新读取该行并获得不同值的情况（不可重复读）。\
  \ |\n| `Serializable` | 防止脏读、不可重复读和幻读。此级别包含 `RepeatableRead` 中的禁止项，并进一步禁止一个事务读取满足\
  \ `WHERE` 条件的所有行、第二个事务插入满足该 `WHERE` 条件的行、然后第一个事务重新读取相同条件并在第二次读取中检索到额外的幻影行的情况。 |\n\
  | `Unspecified` | 使用了与指定不同的隔离级别，但无法确定该级别。 |\n\n## 19.4. DataSets\n\nDataSets 提供了一种断开连接的内存中表示，其结构与底层\
  \ RDBMS 表非常相似。`DataSet` 对象可用于加载数据和将数据保存到 RDBMS，它甚至功能强大到可以通过编程方式生成一个完整的数据库，包括表、视图和约束定义。`DataSet`\
  \ 在概念上类似于 JDBC 的 `RowSet` 和 `CachedRowSet` 类。\n\n### 19.4.1. 将数据加载到 `DataSet` 中\n\
  \n清单 19.8 展示了如何将数据加载到 `DataSet` 对象中。\n\n#### 清单 19.8. 将数据加载到 `DataSet` 中 (C#)\n\n\
  ```csharp\nusing System;\nusing System.Data;\nusing System.Data.OleDb;\nusing System.Data.SqlClient;\n\
  class Test {\n\n  public static void Main(string[] args) {\n    ReadDataSet();\n\
  \  }\n\n  private static void ReadDataSet() {\n    SqlConnection conn = GetConnection();\n\
  \    DataSet ds = new DataSet(\"Test\");\n    try {\n      Fill(conn, ds, \"Products\"\
  , \"SELECT PRODUCTID,\n                                  PRODUCTNAME FROM PRODUCTS\
  \ \");\n      Fill(conn, ds, \"Customers\", \"SELECT CUSTOMERID,\n             \
  \                        CONTACTNAME FROM CUSTOMERS\n                          \
  \      WHERE UPPER(COUNTRY) ='USA'\" );\n    } finally {\n      conn.Close();\n\
  \    }\n    Browse(ds);\n  }\n\n  private static void Fill(SqlConnection conn, DataSet\
  \ ds,\n                                 String tableName, String sql) {\n    SqlDataAdapter\
  \ adapter = new SqlDataAdapter ();\n    adapter.TableMappings.Add(\"Table\", tableName);\n\
  \    SqlCommand command = new SqlCommand(sql, conn);\n    adapter.SelectCommand\
  \ = command;\n    adapter.Fill(ds);\n  }\n  private static void Browse(DataSet ds)\
  \ {\n    foreach (DataTable table in ds.Tables) {\n      BrowseTable(table);\n \
  \   }\n  }\n\n  private static void BrowseTable(DataTable table) {\n    Console.WriteLine(\"\
  Table name \"+table.TableName+\"\\n\");\n    Console.Write(\"Column Name,Column\
  \ Type,Ordinal\\n\");\n    foreach (DataColumn column in table.Columns) {\n    \
  \  Console.Write(column.ColumnName);\n      Console.Write(\",\");\n      Console.Write(column.DataType.FullName);\n\
  \      Console.Write(\",\");\n      Console.Write(column.Ordinal);\n      Console.Write(\"\
  \\n\");\n    }\n  }\n\n  private static SqlConnection GetConnection() {\n    SqlConnection\
  \ conn = new SqlConnection ();\n    conn.ConnectionString = \"Initial Catalog=Northwind;Data\n\
  \                   Source=localhost;Integrated Security=SSPI;\";\n    conn.Open();\n\
  \    return conn;\n  }\n\n}\n```\n\n清单 19.8 的输出如下：\n\n```\nTable name Products\n\
  Column Name,Column Type,Ordinal\nPRODUCTID,System.Int32,0\nPRODUCTNAME,System.String,1\n\
  \nTable name Customers\nColumn Name,Column Type,Ordinal\nCUSTOMERID,System.String,0\n\
  CONTACTNAME,System.String,1\n```\n\n程序首先创建一个 `DataSet`：\n\n```csharp\nDataSet ds\
  \ = new DataSet(\"Test\");\n```\n\n然后程序发出信号，用运行两个 `SELECT` 查询获得的结果填充 `DataSet`：\n\
  \n```csharp\nFill(conn, ds, \"Products\", \"SELECT PRODUCTID, PRODUCTNAME FROM\n\
  PRODUCTS \");\nFill(conn, ds, \"Customers\", \"SELECT CUSTOMERID, CONTACTNAME\n\
  \                 FROM CUSTOMERS WHERE UPPER(COUNTRY) ='USA'\" );\n```\n\n为了填充 `DataSet`，我们需要使用适当的适配器对象\
  \ `SqlAdapter`：\n\n```csharp\nSqlDataAdapter adapter = new SqlDataAdapter ();\n\
  adapter.TableMappings.Add(\"Table\", tableName);\nSqlCommand command = new SqlCommand(sql,\
  \ conn);\nadapter.SelectCommand = command;\nadapter.Fill(ds);\n```\n\n最后一行用查询内容填充数据集：\n\
  \n```csharp\nadapter.Fill(ds);\n```\n\n接下来，我们浏览 `DataSet` 的内容。我们遍历表和列。请注意，返回的列仅包含查询返回的列，而不是该表的所有列。\n\
  \n在我们的示例中，我们在浏览 `DataSet` 之前，在 `finally` 块中关闭了连接。因为 `DataSet` 是我们获取的任何数据的断开连接的内存中表示，所以连接不必保持打开状态我们就可以浏览\
  \ `DataSet`。\n\n### 19.4.2. 使用 `DataSet` 将数据保存到 RDBMS\n\n清单 19.9 展示了如何使用 `DataSet`\
  \ 插入、更新和删除行。\n\n#### 清单 19.9. 使用 `DataSet` 保存数据 (C#)\n\n\n\n\n\n# 使用 `DataSet` 进行数据操作\n\
  \n## 代码示例\n\n```csharp\nusing System;\nusing System.Data;\nusing System.Data.OleDb;\n\
  using System.Data.SqlClient;\nclass Test {\n\n  public static void Main(string[]\
