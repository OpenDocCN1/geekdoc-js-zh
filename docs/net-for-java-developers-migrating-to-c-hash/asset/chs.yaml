  IL 语言的详细信息可以在 `Ilinstrset.doc` 中找到，该文件位于 `C\\Program Files\\Microsoft.NET\\FrameworkSDK\\\
  Tool Developer Guide` 目录下。阅读 图 2.6 的屏幕转储，你可以看到 `Hello` 类有两个方法。一个是构造函数，它由运行时为任何类自动提供；另一个是\
  \ `Main` 方法。你可以看到 `Main` 方法包含入口点指令，向 CLR 表明它是入口点方法。`Main` 方法的下一条指令是 `ldstr`，它将字符串字面量加载到本地方法栈中。随后是对框架类\
  \ `System.Console` 的调用。最后一条指令是 `ret`（即 `Main` 方法的返回）。\n\n### 2.5. 总结\n\n你可以通过命令行或使用\
  \ Visual Studio .NET IDE 来编写 C# 程序。最简单的形式下，C# 应用程序是一个 EXE 文件，通过编译一个或多个类文件创建。要使程序执行，你必须定义一个入口点，而一个\
  \ C# EXE 文件只能有一个入口点。\n\nJava 程序员应该注意以下关键点。\n\n*   C# 中没有类路径。运行 EXE 文件所需的所有数据都定义在\
  \ EXE 文件中。\n\n*   C# 允许在一个源文件中有多个 `public` 类。\n\n*   C# 不要求你将类文件的名称与该文件中 `public`\
  \ 类的名称保持一致。\n\n*   C# 的 `Main` 方法必须是 `static` 的（就像在 Java 中一样）。\n\n*   C# 命名空间大致相当于\
  \ Java 包，但其结构与源文件在磁盘上的保存方式无关。Java 包决定了源文件在磁盘上的目录结构，而 C# 命名空间则不然。\n\n*   在 Java 中，你可以在同一个源文件中导入一个包或该包中的特定类（或两者）。在\
  \ C# 中，你不能将 `using` 关键字用于类。`using` 关键字只能用于命名空间。\n\n*   与 Java 一样，每个 C# 类都有一个默认的无参数公共构造函数（这从\
  \ IL 中可以明显看出）。\n\n## 第 3 章. C# 与 Java：有何不同？\n\n2000 年 6 月，微软推出了 .NET 平台和一种名为 C#\
  \ 的新编程语言。C# 语言是在吸取了多种语言（尤其是 Java 和 C++）的经验教训后构建的。因此，C# 与 Java 有许多相似之处。然而，这两种语言之间也存在一些差异——这些差异超越了语法和构造。为了真正理解这些语言的异同，我们鼓励你深入阅读后续章节。本章为你提供了一个关于异同点的概览，这些将在后续章节中详细解释。\n\
  \n我们将使用以下类别来比较 C# 和 Java：\n\n*   编程平台（.NET 和 Java）\n\n*   运行时架构\n\n*   面向对象编程（OOP）模型\n\
  \n*   语言构造、语法和应用程序编程接口\n\n### 3.1. 编程平台（.NET 和 Java）\n\n随着 C# 和 Java 的出现，程序员发现了一个新术语：编程平台。编程平台现在变得与你所使用的编程语言同等重要。\n\
  \n提供 Java 和 .NET 等平台的根本目的是让程序员更容易开发企业应用程序。企业应用程序往往很复杂，因为它们包含多个在各种操作系统和运行时条件下运行的组件（或子系统）。一个从头开始编写的企业应用程序将通过以下方式直接与外部代码交互：\n\
  \n*   组件或子系统（如数据库和图形）\n\n*   操作系统（如 Linux 和 Windows）\n\n*   运行时条件（如硬件、可用内存、处理器和服务器节点）\n\
  \n如果你从头开始编程，你的应用程序将直接与这三种外部代码源中的任何一种进行交互。外部代码的任何更改都将要求你重写应用程序。为了避免在外部代码更改时不得不更改应用程序，你需要一个位于外部代码和你的应用程序之间的软件层来处理外部代码的更改。编程平台提供了这种额外的间接层（和隔离层）。\n\
  \n平台还将常规的企业任务抽象出来，并将其打包成高级、易于使用的应用程序编程接口（API）。常规的企业任务可以包括访问数据库、消息传递、电子邮件、解析 XML、网络、支持电话、维护高级\
  \ GUI、运行 Web 应用程序等。平台提供基本的基础设施服务，开发者可以利用语言 API 来使用这些服务。\n\nC# 和 Java 都提供了一定程度的编程复杂性，这对于快速实现企业应用程序非常重要。这两种语言提供了一站式的高级\
  \ API，用于执行无数的企业级编程任务。然而，API 只是提供给开发者与平台交互的抽象；是平台将高级 API 调用转换为低级系统调用。\n\nC# 运行在 .NET\
  \ 平台上，而 Java 运行在 Java 平台上。请注意，“Java”既指平台也指语言。\n\n#### 3.1.1. Java 平台\n\nSun Microsystems\
  \ 将 Java 平台重组为三个主要类别：\n\n1.  J2SE：针对桌面机器的 Java 平台标准版\n\n2.  J2ME：针对手持设备的 Java 平台标准版\n\
  \n3.  J2EE：用于开发大型、服务器端企业应用程序的平台，通常部署在负载均衡的服务器集群上\n\n尽管有些简化，但你可以将 J2ME 视为 J2SE 的子集，并将\
  \ J2EE 视为 J2SE 的超集。J2EE 是一个基于 Java 的技术栈，构建在 J2SE 之上，J2EE 提供了开发者用于构建企业应用程序的开发和运行时工具。最新的\
  \ J2EE 技术栈（J2EE 1.3）包含以下组件：JavaServer 页面（JSP）、servlet、企业 JavaBeans（EJB）、Java 消息服务（JMS）、Java\
  \ 连接器架构（JCA）、Java 命名和目录接口（JNDI）以及 Java 管理扩展（JMX）。尽管 Java 数据库连接（JDBC）和 HotSpot VM\
  \ 定义在 J2SE 栈中，但它们也是 J2EE 栈不可或缺的一部分。\n\n需要注意的是，J2EE 是一个平台规范，而不是一个产品。Java 程序员可以从众多销售\
  \ J2EE 应用服务器的供应商中进行选择。这些服务器是构建在 J2EE 规范之上的产品。\n\n#### 3.1.2. .NET 套件\n\n如 第 1 章\
  \ 所述，“.NET”一词涵盖的内容非常广泛。与 J2EE（一组规范）不同，.NET 是一套产品（尽管 .NET 的某些部分已被批准为标准）。该套件包括以下内容：\n\
  \n*   在手持设备、PDA 和嵌入式系统上运行的智能客户端软件。\n\n*   XML Web 服务，用于集成应用程序。这些 Web 服务有商业实现。例如，MapPoint\
  \ 是一个用于在应用程序中提供地图和驾驶路线的 Web 服务。\n\n*   企业服务器，如 BizTalk 和 SQL Server。\n\n*   企业开发工具，如\
  \ Visual Studio .NET 和 .NET Framework。它们包括框架类、CLR、ASP.NET 和托管代码。\n\n作为 C# 程序员，你主要关注的是\
  \ .NET Framework。\n\n\n\n\n\n如前所述，Java 和 .NET 都为你提供了开发企业应用程序的工具。一种有些常规且无处不在的企业应用程序是任何非平凡的基于\
  \ Web 的应用程序（例如公司内网、电子商务网站或基于 Web 的协作工具）。\n\n一个应用程序通常由三层组成：表示层、业务逻辑层和数据层。下一节将比较 J2EE\
  \ 和 .NET Framework 中用于构建这三层的组件。\n\n### 3.1.3. 表示层\n\nJ2EE 规范提供了用于生成动态 HTML 的 servlet\
  \ 和 JSP。servlet 和 JSP 由 servlet 容器运行。这些容器提供对维护会话状态、安全性和配置的支持。标签库用于使 JSP 对 HTML 编码人员更具可读性。\n\
  \nASP.NET 使用 Microsoft 的 Internet 信息服务器 (`IIS`) 运行 Web 应用程序。ASP.NET 包含用于管理会话状态、安全性和使用\
  \ `ASPX` 生成 HTML 的设施。你可以使用自定义 ASP 标签来匹配服务器端 Web 控件。Web 控件封装了可重用的用户界面逻辑，并提供了许多高级功能以简化\
  \ Web 编程。\n\n### 3.1.4. 业务逻辑层\n\n术语“业务逻辑”没有标准定义，但任何包含常见企业计算任务（例如处理事务、创建 XML Web\
  \ 服务或调用分布式远程对象上的方法以基于触发的事件或消息执行业务规则）的内容都属于这一层。让我们看一些例子。\n\n#### 事务\n\nJ2EE 应用服务器通过\
  \ `EJB` 支持手动和容器维护的事务。在 .NET 中，事务可以是手动的或自动的。手动事务可能容易出错，但提供更精细的控制，而自动事务则简化了开发。\n\n\
  #### 调用远程对象\n\n基于特定事件或触发器执行业务规则通常包装在服务器端组件中，例如 `EJB`（Java）或 `JMS` 队列。`EJB` 是分布式组件，`JNDI`\
  \ 在识别用于执行特定业务规则的 `EJB` 时提供位置透明性。所有调用都通过接口进行。在实践中，应用程序服务器供应商倾向于优化 `EJB` 的分发和集群。这样，方法调用通常最终在同一个虚拟机实例内，从而避免了进程外方法调用。\n\
  \n通过 .NET 远程处理，开发人员可以调用分布在应用程序域、进程和机器边界上的远程对象。在 .NET 中，你不能像在 J2EE 中那样自动决定分发你的对象，因为这样做会付出网络延迟的代价。在\
  \ .NET 中，开发人员使用远程处理来提高安全性和简化维护，而不是为了提高可扩展性；你通常为此任务添加 Web 服务器。\n\n#### XML Web 服务\n\
  \n通过从 [`java.sun.com`](http://java.sun.com) 下载并安装 Java Web 服务开发包，你可以开始创建 Web 服务。Sun\
  \ 加入 Web 服务潮流的时间比 Microsoft 稍晚，这可以从 Sun 当前对 Web 服务的支持中看出。Microsoft 将 XML Web 服务置于\
  \ .NET 的核心，这一点显而易见。.NET 包含最新的公认 XML Web 服务标准。\n\n### 3.1.5. 数据层\n\n任何企业应用程序的命脉是数据，数据通常存储在关系数据库管理系统中，例如\
  \ Oracle 或 Microsoft SQL Server。\n\nJava 已将原始 SQL 调用抽象到任何数据库中，形成一个名为 `JDBC` 的出色抽象层。`JDBC`\
  \ API 提供了访问企业 API 所需的一切。该 API 用于与 `JDBC` 驱动程序交互，`JDBC` 驱动程序是你的 SQL 通往数据库服务器的管道。J2EE\
  \ 支持两种访问此数据的方法。一种是通过 bean 管理持久性 (`BMP`)，它本质上使用 `JDBC` 驱动程序对底层数据库进行原始 SQL 调用。在第二种方法中，容器管理持久性\
  \ (`CMP`)，你使用对象关系映射将对象映射到数据库表，从而提供到数据库的自动持久性，而无需生成原始 SQL。\n\n使用 .NET Framework，开发人员可以通过\
  \ .NET 的 `ADO.Net` 类访问各种数据源，包括 XML。`ADO.Net` 包含数据提供程序，允许你连接到数据库并执行命令。开发人员还可以通过 XML\
  \ Web 服务在 Web 上传输数据，或通过 .NET 远程处理跨进程边界传输数据。\n\n### 3.2. 运行时架构\n\n如前所述，Java 和 C#\
  \ 与传统语言（如 C、C++ 和 Visual Basic）不同，因为 Java 和 C# 生成的代码在受控执行环境中运行。此执行环境为编译或解释的代码提供基础设施服务，例如内存管理、安全检查和类型验证。表\
  \ 3.1 比较了 Java 和 .NET 的运行时环境。\n\n尽管 `CLR` 和 `JVM` 在其角色上看起来惊人地相似，但你应该注意一些关键区别。\n\n\
  #### 3.2.1. JVM\n\n`JVM` 仅运行字节码，也称为托管代码或安全代码（没有指针的代码）。\n\n通常，单个 `JVM` 实例映射到单个操作系统\
  \ (OS) 进程。多个应用程序可以在单个 `JVM` 上运行，但 `JVM` 内部的应用程序之间没有逻辑分区。`JVM` 内的所有应用程序共享相同的进程资源。这使得\
  \ `JVM` 内部的应用程序间通信（或进程内通信）快速而容易，但它有一个主要缺点：一个消耗大量内存的恶意应用程序可能会拖慢整个 `JVM` 实例，从而影响在同一\
  \ `JVM` 实例上运行的其他应用程序。进程外通信通过远程方法调用 (`RMI`) 和序列化实现，它们是 Java 中分布式计算的基础。分布在不同 `JVM`\
  \ 上的 `EJB` 通过 `RMI` 调用相互通信。`JVM` 实例比 OS 进程更轻量级，可以嵌入到设备中。或者，`JVM` 实例可以由应用程序服务器托管，也可以作为独立程序运行。\n\
  \n**表 3.1. Java 和 .NET 的运行时执行环境**\n\n| 环境元素 | Java | .NET |\n| --- | --- | --- |\n\
  | 执行环境 | Java 虚拟机 (`JVM`) | 公共语言运行时 (`CLR`) |\n| 执行的指令集 | 字节码 | 中间语言 (`IL`) |\n\
  | 运行什么？ | 托管代码 | 托管和非托管代码 |\n| 多编程语言支持 | 一些非商业实现，例如 `JPython` 和 `JACL`，它们编译为字节码\
  \ | Visual Basic、C++、C#、JScript、COBOL、Perl、FORTRAN 和其他语言 |\n| 运行时执行模式 | 部分解释模式和部分\
  \ JIT 编译器 | 始终运行编译的本机代码 |\n| 应用程序的隔离单元 | 多个应用程序可以在单个 `JVM` 上运行。同一 `JVM` 上的应用程序之间没有逻辑分区。它们都共享相同的公共\
  \ OS 进程资源。 | 多个应用程序在单个 OS 进程内通过应用程序域分隔。应用程序域在 OS 进程内提供应用程序的逻辑分区。 |\n| 操作系统 | 在各种操作系统上运行。\
  \ | 目前仅在 Windows 操作系统上支持，尽管有非商业选项可以在其他操作系统上运行 .NET（例如 Linux 上的 Mono）。 |\n\n####\
  \ 3.2.2. CLR\n\n\n\n\n\nCLR 运行托管的 MSIL 代码。非托管代码基于指针，在 CLR 之外运行。Windows 操作系统本身并不支持运行\
  \ CLR 应用程序。以 `.exe` 结尾的 CLR 应用程序，并非你作为 C、C++ 或 Visual Basic 程序员所熟知的那种真正的独立 EXE 应用程序。相反，该\
  \ EXE 能够运行，是因为它首先由可执行的 CLR 宿主加载，然后在该加载的 CLR 中运行用户程序。\n\nCLR 宿主是位于 CLR 应用程序和操作系统进程之间的应用程序。宿主负责将\
  \ CLR 加载到操作系统进程中，并在操作系统进程中创建逻辑分区，以便各个应用程序可以驻留在这些分区中。.NET Framework 附带了以下 CLR 宿主。\n\
  \n#### 3.2.3. ASP.NET\n\nASP.NET 附带的一个 ISAPI（Internet 服务器应用程序编程接口）筛选器会加载 CLR 并执行处理\
  \ Web 请求所需的初始化工作。（用 Java 的术语来说，ASP.NET 是一个 Servlet 引擎。）\n\n#### 3.2.4. Internet\
  \ Explorer\n\nInternet Explorer (IE) 相当于在浏览器内部拥有一个 JVM 来运行 Java Applet。类似地，IE 具有\
  \ CLR 宿主钩子，用于运行直接在 HTML 代码中引用的托管代码。\n\n#### 3.2.5. Shell 可执行文件\n\n当从 Shell 启动托管应用程序时，一小段非托管代码会加载\
  \ CLR 并将应用程序的控制权移交给 CLR。\n\n每个 CLR 宿主都附带一段非托管代码，必须在加载 CLR 之前运行。为了首次与操作系统交互，CLR 宿主必须运行一些非托管代码（基于指针的代码）。运行此代码后，CLR\
  \ 被加载，宿主会创建一个用于运行托管代码的默认分区。用户的应用程序并不在此默认分区中运行；相反，CLR 宿主会创建分区来运行这些最终用户程序。如 第 1 章\
  \ 所述，这些分区称为应用程序域。\n\n传统应用程序通过操作系统进程边界进行隔离，这意味着一个应用程序要与另一个应用程序共享资源，必须创建一个进程外应用程序。.NET\
  \ 应用程序域本质上是在单个进程内对应用程序进行分区的一种方式，使它们不直接共享任何资源，从而防止一个应用程序影响另一个应用程序的执行。应用程序域的灵活性在于，它们允许单独启动和停止应用程序，而不影响在同一\
  \ CLR 实例中运行的其他应用程序。\n\n应用程序域的概念在某种程度上等同于 J2EE Web 应用程序的隔离。J2EE 规范要求符合 J2EE 的应用程序服务器通过为\
  \ Web 应用程序分配不同的类加载器来对其进行分区。因此，即使两个 Web 应用程序位于同一个 JVM 实例中并共享相同的进程空间，它们也无法直接共享资源。这种在同一个进程空间中独立运行多个应用程序的能力，使得\
  \ .NET 和 Java 平台最适合开发可扩展的应用程序。\n\n### 3.3. 面向对象模型\n\nC# 和 Java 都是面向对象语言，它们在实现面向对象编程（OOP）模型方面存在一些显著的异同。表\
  \ 3.2 比较了 Java 和 C# 的面向对象编程模型。\n\nJava 和 C# 使用的 OOP 模型之间最重要的区别之一是，在 Java 中，所有方法默认都是虚拟的。这意味着方法调用总是在实例化的对象上进行。因此，\n\
  \n```\nA a = new B();\n```\n\n其中类 `B` 继承自 `A`。\n\n在引用 `a` 上调用方法将调用实例化类 `B` 上的方法。在\
  \ C# 中则不是这样。除非超类 `A` 显式地将方法标记为 `virtual`，并且子类 `B` 使用 `override` 关键字显式地重写了该方法，否则方法是在引用\
  \ `a` 上调用的。C# 的模型使得运行时行为不那么方便但更高效，因为调用虚拟方法总是比直接在引用上调用方法慢。由于重写超类行为的能力是显式的，子类不会无意中改变方法的预期行为。\n\
  \n表 3.2. Java 和 C# 的 OOP 模型\n\n| OOP 元素 | Java | C# |\n| --- | --- | --- |\n| 继承\
  \ | 单继承 | 单继承 |\n| 对象层次结构 | 单根。所有对象都派生自一个类（`java.lang.Object`），基本类型如 `int` 和 `float`\
  \ 除外。 | 单根。所有内容都派生自一个类（`System.Object`）。 |\n| | 使用 `new` 运算符创建对象。 | 使用 `new` 运算符创建对象。\
  \ |\n| | 使用“.”运算符访问成员。 | 使用“.”运算符访问成员。 |\n| 多态性 | 方法默认是虚拟的。防止子类覆盖超类实现的唯一方法是将超类方法设为\
  \ `private` 或 `final`。 | 方法默认是非虚拟的。你必须使用 `virtual` 和 `override` 关键字组合（分别在超类和子类上）来启动多态性。\
  \ |\n| 等效的访问修饰符 | `public` | `public` |\n| | `private` | `private` |\n| | `protected`\
  \ | `protected internal` |\n| | `package` | `internal` |\n| 默认访问级别 | `package` |\
  \ `private` |\n| 访问修饰符规则 | 子类只能访问超类的公共和受保护成员。 | 子类只能访问超类的公共和受保护成员。 |\n| | 子类不能限制从超类继承的方法的访问权限；公共超类方法不能在子类中设为私有。\
  \ | 子类可以限制超类方法的访问修饰符，只要子类没有重写该方法以激活虚拟分派。 |\n| 静态方法 | 公共和受保护的静态方法可以被继承。私有静态方法不能被继承。静态方法不激活虚拟分派。你可以通过非静态引用变量访问静态成员。\
  \ | 公共和受保护的静态方法可以被继承。私有静态方法不能被继承。静态方法不激活虚拟分派，因为 `virtual` 和 `override` 关键字不允许在静态上下文中使用。你不能使用非静态引用访问静态方法。\
  \ |\n| 抽象方法 | 抽象超类的所有非抽象子类必须实现所有超类抽象方法，或者必须标记为抽象。 | 抽象超类的所有非抽象子类必须实现所有超类抽象方法，或者必须标记为抽象。\
  \ |\n| 接口 | 类可以实现多个接口，接口可以相互继承。如果接口要被不同包中的类实现，则该接口必须是公共的。实现接口方法的类必须将其声明为公共。一个类可以实现具有相同方法名的多个接口。没有显式的接口声明，因此多个接口共享相同方法名的实现。\
  \ | 类可以实现多个接口，接口可以相互继承。一个类可以实现任何接口，即使它们位于不同的命名空间中。实现接口方法的类可以将方法声明为公共，也可以使用显式接口声明显式声明。这意味着你可以实现两个具有相同方法名的不同接口。存在\
  \ `as` 运算符，可减少类型转换。 |\n\n\n\n\n\n| 构造函数与析构函数 | 如果类未提供默认的无参公共构造函数，则提供一个。使用静态块代替静态构造函数。终结器类似于析构函数，但不如析构函数确定性强。无法保证它们何时会被调用。\
  \ | 如果类未提供默认的无参公共构造函数，则提供一个。使用静态构造函数。类似 C++的析构函数。析构函数只能用于引用类型，不能用于值类型，且析构函数不能被重写。不能显式调用析构函数，因为在由垃圾回收器管理对象生命周期的情况下，这样做没有太大意义。建议使用\
  \ `IDisposable` 接口来释放资源，而不是在析构函数中释放。 |\n\n| 其他特性 | 内部类和匿名类。 | 支持内部类，但不支持匿名类。支持匿名方法。\
  \ |\n\n### 3.4. 语言构造、语法与 API\n\n本节比较 C#和 Java 的基本构建块。我们使用以下类别：\n\n*   数据类型\n\n*\
  \   运算符\n\n*   控制流语句\n\n*   异常支持\n\n*   通用对象（`Object`、`String`）\n\n*   通用语言元素\n\n\
  *   集合库\n\n*   线程\n\n*   输入/输出\n\n*   命名空间与程序集\n\n*   Java 缺少什么？\n\n*   C#缺少什么？\n\
  \n#### 3.4.1. 数据类型\n\nC#允许安全代码和不安全代码。你可以使用不安全代码进行 C 和 C++支持的那种指针编程。安全代码是 Java 程序员所熟悉的，它被称为安全的原因之一是运行时保证了安全代码的类型安全。表\
  \ 3.3 比较了 Java 和 C#数据类型之间的一些关键相似点。\n\nC#的内置值类型与 Java 中的相同，除了 Java 中没有的无符号 `short`、`int`\
  \ 和 `long`。C#还提供了一个 12 字节的十进制类型，这在 Java 中也没有。\n\nC#和 Java 之间的一个主要区别是 C#根据上下文透明地互换基本类型及其对应的\
  \ `System` 类的方式。这种装箱（将基本类型转换为其 `System` 命名空间等效类型）和拆箱的过程对程序员是透明的。因此，与 Java 对基本类型及其包装类的严格处理不同，装箱非常方便。在\
  \ C++中，结构体和类（对象）都可以在栈上、内联或堆上分配。\n\n表 3.3. Java 与 C#数据类型\n\n| 数据类型 | Java | C# |\n\
  \n| --- | --- | --- |\n\n| 引用类型 | 类、接口和数组 | 类、接口、数组和委托 |\n\n| 值类型 | 仅基本类型。不能使用 `new`\
  \ 运算符实例化值类型 | 基本类型、结构体和枚举。所有值类型都在栈上分配。 |\n\n|   | 不支持无符号 `short`、`int` 或 `long`\
  \ | 可以使用 `new` 运算符实例化值类型 |\n\n|   |   | 支持无符号 `short`、`int` 和 `long` |\n\n| 指针类型\
  \ | 不支持 | 有限形式的 C 和 C++风格指针编程 |\n\n| 基本数据类型到其包装类的透明转换 | 不支持 | 通过装箱和拆箱支持。每个基本类型都映射到\
  \ `System` 命名空间中的一个类，因此可以像普通对象一样处理，无需任何额外包装。 |\n\n在 C#中，结构体总是在栈上或内联创建，而类（对象）总是在堆上创建。结构体确实能让你创建更高效的代码。\n\
  \nC#也保留了 C 和 C++的枚举构造。Java 程序员已经学会了通过手工制作的、类型安全的枚举类来应对缺少 `enum` 支持的情况，这些枚举类本质上是用于保存常量值的包装类。\n\
  \n在 C#中：\n\n```csharp\npublic enum Direction {North=1, East=2, West=4, South=8};\n\
  ```\n\n在 Java 中：\n\n```java\npublic class Direction {\n  public static Direction\
  \ North = new Direction(1);\n  public static Direction East = new Direction(2);\n\
  \  public static Direction West = new Direction(4);\n  public static Direction South\
  \ = new Direction(8);\n  private int type;\n  private Direction(int I) { this.type\
  \ = i; }\n}\n```\n\n#### 3.4.2. 运算符\n\n表 3.4 比较了不同类别的 Java 和 C#运算符。这些运算符在两种语言中具有相同的默认含义。\n\
  \n在 C#中，你可以重载运算符以自定义你的自定义类的含义。Java 不允许最终用户进行运算符重载，尽管 API 本身为了最终用户的便利重载了一些运算符（例如字符串上的\
  \ `+` 运算符）。用户定义的运算符声明不能修改运算符的语法、优先级或结合性，并且用户定义的运算符不能与预定义运算符具有相同的签名。\n\n表 3.4. Java\
  \ 与 C#运算符\n\n| 运算符类别 | Java | C# |\n\n| --- | --- | --- |\n\n| 算术 | `+`、`-`、`*`、`/`、`%`\
  \ | `+`、`-`、`*`、`/`、`%` |\n\n| 逻辑 | `&&`、`||`、`true`、`false`、`!` | `&&`、`||`、`true`、`false`、`!`\
  \ |\n\n| 位运算 | `&`、`|`、`^`、`/`、`~` | `&`、`|`、`^`、`~` |\n\n| 字符串连接 | `+` | `+` |\n\
  \n| 自增、自减 | `++`、`--` | `++`、`--` |\n\n| 移位 | `>>`、`<<` | `>>`、`<<` |\n\n| 关系 |\
  \ `==`、`<=`、`>=`、`<`、`>`、`!=` | `==`、`<=`、`>=`、`<`、`>`、`!=` |\n\n| 赋值 | `=`、`+=`、`-=`、`*=`、`/=`、`%=`、`&=`、`|=`、`^=`、`<<=`、`>>=`\
  \ | `=`、`+=`、`-=`、`*=`、`/=`、`%=`、`&=`、`|=`、`^=`、`<<=`、`>>=` |\n\n| 成员访问 | `.` |\
  \ `.` |\n\n| 类型转换 | `()` | `()` |\n\n| 索引 | `[]` | `[]` |\n\n| 条件 | `?:` | `?:`\
  \ |\n\n| 对象创建 | `new` | `new` |\n\n| 类型信息 | `instance of` | `is`、`as`、`sizeof`、`typeof`\
  \ |\n\n| 溢出异常控制 | 无 | `checked`、`unchecked` |\n\n| 基于指针 | 无 | `*`、`&`、`->`、`[]`\
  \ |\n\n用户定义的运算符（如果定义）优先于默认运算符。C#在编译时确保逻辑对中的两个运算符（`!=` 和 `==`、`>` 和 `<`、`>=` 和 `<=`）都已定义。\n\
  \n#### 3.4.3. 控制流语句\n\n表 3.5 比较了 Java 和 C#的控制流结构。请注意，所有控制流结构在两种语言中具有相同的含义。\n\n`foreach()`\
  \ 语句是 Java 不支持的新语句。它用于遍历类型为类、接口或结构体的对象集合。可以按如下方式使用：\n\n```csharp\nforeach (object\
  \ o in collection) {\n}\n```\n\n表 3.5. Java 与 C#控制流结构\n\n| 控制流语句 | Java | C# |\n\
  \n| --- | --- | --- |\n\n| 条件 |  \n\n```\nif-elseif-else\nswitch(condition)\n```\n\
  \n |  \n\n```\nif-elseif-else\nswitch (condition)\n```\n\n |\n\n| 迭代 |  \n\n```\n\
  while (condition) {}\ndo{ } while (condition)\nfor(start;condition;step)\nN/A\n\
  ```\n\n |  \n\n```\nwhile (condition) {}\ndo{ }while (condition)\nfor(start;condition;step)\n\
  foreach()\n```\n\n |\n\n| 跳转语句 | `break`、`continue` | `break`、`continue`、`goto`\
  \ |\n\n此语句遍历集合。\n\nC#的 `switch` 语句也与 Java 的 `switch-case` 构造略有不同。C#的 `switch` 语句允许你在\
  \ `switch` 语句的 `case` 块中使用字符串。此比较区分大小写。因此，以下代码在 C#中可行，但在 Java 中不可行：\n\n```csharp\n\
  switch (name) {\ncase \"Jack\":break;\ncase \"Jill\":break;\n};\n```\n\n\n\n\n\n\
  C# 的 `goto` 语句必须指向一个标签或 `switch` 语句中的一个选项。这与 Java 中的 `continue` 标签语句类似。`goto` 语句可以指向其作用域内的任何位置，这将其限制在同一个方法内（如果在\
  \ `finally` 块中声明，则限制在该块内）。它不能跳转到其外部的循环语句中，也不能在包围的 `finally` 块执行之前离开 `try` 块。C# 中的\
  \ `continue` 语句等同于 Java 中的 `continue` 语句，但 C# 版本不能指向标签。\n\n### 3.4.4. 异常支持\n\nJava\
  \ 和 C# 都支持 `try-catch-finally` 结构来处理异常情况。使用异常进行编程可以在程序出错时为执行流程提供方向。两种语言中的 `try-catch-finally`\
  \ 结构遵循相同的规则。表 3.6 列出了它们的异同点。\n\n**表 3.6. Java 和 C# 异常支持**\n\n| 异常元素 | Java | C#\
  \ |\n| --- | --- | --- |\n| 所有其他异常都派生自的单一异常类 | `java.lang.Throwable` | `System.Exception`\
  \ |\n| 异常和错误 | 区分异常 (`java.lang.Exception`) 和错误 (`java.lang.Error`)。错误通常表示更严重的故障。两者都继承自\
  \ `java.lang.Throwable`。 | 不区分错误和异常。 |\n| 受检异常和非受检异常 | 支持受检异常和非受检异常。 | 不支持受检异常和非受检异常。所有异常都是非受检的。\
  \ |\n| `throws` 子句 | `throws` 子句是方法签名的重要组成部分，明确指示抛出了哪些异常。 | 没有 `throws` 子句。了解抛出了哪些异常的唯一方法是阅读代码或信任文档！\
  \ |\n| | 实现具有 `throws` 子句的方法签名的接口的类必须仅遵守那些异常。 | 实现接口的类可以抛出接口方法中未明确声明的异常。 |\n| 继承\
  \ | 子类不能在重写超类方法时抛出新的异常。 | 由于方法隐藏，你可以让子类抛出超类方法未正式抛出的异常。 |\n\n### 3.4.5. 常用对象\n\n\
  `java.lang.Object` 和 `java.lang.String` 类是 Java API 中无处不在的两个类。它们在 C# 中的等效类同样无处不在。表\
  \ 3.7 和 3.8 比较了 `java.lang.Object` 和 `java.lang.String` 与它们在 C# 中的等效类。\n\n**表 3.7.\
  \ Java 和 C# 根对象类**\n\n| Java (`java.lang.Object`) | C# (`System.Object`) |\n| ---\
  \ | --- |\n| `toString()` | `ToString()` |\n| `equals()` | `Equals()` |\n| `Object()`\
  \ | `Object()` |\n| `hashCode()` | `GetHashCode()` |\n| `getClass()` | `GetType()`\
  \ |\n| `finalize()` | `Finalize()` |\n| `clone()` | `MemberWiseClone()` |\n\n**表\
  \ 3.8. Java 和 C# 字符串类**\n\n| 字符串类元素 | Java | C# |\n| --- | --- | --- |\n| 不可变 |\
  \ 是 | 是 |\n| 可以被继承吗？ | 否 (`final` 类) | 否 (`sealed` 类) |\n| 支持驻留 | 是 | 是 |\n| 比较字符串值\
  \ | `equals()` 方法 | == 运算符 |\n| 比较字符串对象实例 | == 运算符：`s` == `t` | 对转换后的对象使用 == 运算符：(`object`)\
  \ `s` == (`object`) `t` |\n| 字符串连接 | 如果其中一个连接的字符串不是字面量，则创建对象。 | 不创建对象。与使用 `StringBuilder`\
  \ 类一样安全。 |\n| 实现的接口 | `Comparable`, `Serializable` | `IComparable`, `ICloneable`,\
  \ `IConvertible`, `IEnumerable` |\n\nJava 的 `java.lang.Object` 类和 C# 的 `System.Object`\
  \ 类是所有其他类都继承的根类。从 表 3.7 可以明显看出，C# 和 Java 在方法名称、签名和功能上保持了惊人的相似性。请注意，C# 对象有一个别名关键字\
  \ `object`（小写 `o`），可以用来代替完全限定的 `System.Object`。此外，C# 中的所有值类型都通过装箱继承自 `System.Object`。\n\
  \n在这两种语言中，字符串对象都是不可变的。此外，由于它们无处不在，运行时通过驻留来优化字符串字面量：在堆上用同一个对象表示相同的字面量。C# 中的一个主要区别是，`System.String`\
  \ 的 == 运算符被重载以比较字符串的值，因此等同于 Java 的 `equals` 方法。另外，要比较两个字符串实例，你需要将它们转换为它们的 object\
  \ 等效形式，然后使用 == 运算符。\n\n### 3.4.6. 常用语言元素\n\n本节简要比较 C# 和 Java 共有的一些核心语言元素。\n\n####\
  \ 类\n\n类构成了 C# 和 Java 中基本的语言元素之一。这是一个典型的类签名：\n\n```\nattributes class-modifiers\
  \ class class-name class-base {}\n```\n\n签名的可选部分用斜体表示。注意，在这两种语言中，除了类名和关键字 `class`\
  \ 之外，几乎所有内容都是可选的。属性仅在 C# 中适用。在 Java 中，类与编写它们的实际文件（`.java` 文件）紧密相关；根据 Sun JDK，公共类必须在与其类名同名的\
  \ `.java` 文件中声明。在 C# 中，类与 `.cs` 文件的概念无关。一个 `.cs` 文件可以包含任意数量的公共类。\n\nC# 和 Java 中的类都可以嵌套内部类。类的可访问性由类上的访问修饰符决定，而类上可以使用的适用访问修饰符集由类声明的上下文决定。例如，在\
  \ Java 中，一个 `.java` 文件必须定义一个公共类。缺少访问修饰符会赋予类默认的可访问性。对于非嵌套的 C# 类，默认可访问性是 `internal`，对于嵌套的\
  \ C# 类是 `private`。对于嵌套和非嵌套的 Java 类，默认的类访问级别都是包级别（类似于字段和方法的默认访问级别）。除了访问修饰符，你还可以使用其他修饰符来指示正在创建哪种类型的类。表\
  \ 3.9 比较了 Java 和 C# 的类修饰符。\n\n在 Java 和 C# 中都可以嵌套类。Java 中的嵌套类可以是常规内部类或匿名类，它们可以拥有与非嵌套\
  \ Java 类相同的类访问修饰符。在 C# 中，嵌套类可以拥有与非嵌套类型相同的访问修饰符。在 C# 中，嵌套类可以访问其包含类可访问的所有成员，包括包含类中声明为\
  \ private 和 protected 可访问性的成员。嵌套类也可以访问其包含类的超类中定义的 protected 成员。\n\n**表 3.9. Java\
  \ 和 C# 类修饰符**\n\n| Java | C# | 含义 |\n| --- | --- | --- |\n| `public` | `public`\
  \ | `public` Java 类可以从任何包访问。`public` C# 类可以从任何命名空间访问。 |\n| `protected` | `protected`\
  \ | `protected` Java 类只能由该包内的类访问。`protected` C# 类被声明为 `protected`，其类型可由包含类型以及任何继承自此包含类型的类型访问。此修饰符应仅用于内部类。\
  \ |\n| 不适用 | `internal` | 如果一个类被声明为 `internal`，则它定义的类型只能由同一程序集内的类型访问。这是非嵌套类的默认访问级别。\
  \ |\n\n\n\n\n\n| 无 | `protected internal` | 此访问级别允许的权限是 `protected` 级别允许的权限加上 `internal`\
  \ 级别允许的权限。因此，该访问级别比其单独部分更为宽松。此修饰符应仅用于 `internal` 类（在其他类中声明的类）。 |\n\n| `private`\
  \ | `private` | 在 Java 中，`private` 类仅在其声明的文件中可见。`private` 类总是声明在另一个类内部。在 C# 中，当一个类被声明为\
  \ `private` 时，对其定义的类型的访问仅限于包含类型。此修饰符应仅用于 `internal` 类。 |\n\n| `static` | 无 | `static`\
  \ 类用于声明顶级类，而非 `inner` 类。 |\n\n| 无 | `new` | `new` 关键字可用于嵌套类。嵌套类是在另一个类的主体中定义的类；它在大多数方面与以正常方式定义的类相同，但其访问级别不能比定义它的类更宽松。嵌套类应使用\
  \ `new` 关键字声明，以防它与继承的类型同名（从而覆盖它）。 |\n\n| `final` | `sealed` | `final` Java 类和 `sealed`\
  \ C# 类不能有子类。 |\n\n| `abstract` | `abstract` | 在 C# 和 Java 中，`abstract` 类都有一个或多个\
  \ `abstract` 方法。`abstract` 类不能被实例化。 |\n\n##### 构造函数\n\n构造函数是用于创建特定类实例的特殊方法。构造函数可以是实例构造函数或静态构造函数。C#\
  \ 和 Java 都支持实例构造函数。静态构造函数是 C# 特有的，而 Java 中的静态块与静态构造函数有些相似。\n\n如果你没有为类提供实例构造函数，两种语言都会提供一个默认的无参数公共实例构造函数。但是，如果你提供了构造函数，则不会提供默认构造函数。构造函数可以有任何访问修饰符。当一个类只声明私有实例构造函数时，其他类就不可能从该类派生或创建该类的实例。\n\
  \n仅包含静态方法的实用程序类通常使用私有构造函数。私有构造函数也可用于创建单例类（只有一个实例对象的类）。\n\n静态构造函数类似于 Java 的静态块，用于初始化类。静态构造函数上可接受的修饰符是\
  \ `extern` 和 `static`。\n\n##### 析构函数\n\nC# 引入了析构函数的概念。与 C++ 不同，C# 析构函数不是确定性的。你不能调用\
  \ C# 析构函数并期望与对象关联的内存被回收。内存管理完全由垃圾回收器完成（与 Java 类似），但析构函数类似于 Java 的 `finalize` 方法。析构函数是自动调用的，不能显式调用。当实例被销毁时，该实例继承链中的析构函数会按从最派生到最少派生的顺序依次调用。你可以通过重写\
  \ `System.Object` 上的虚方法 `finalize` 来实现析构函数。无论如何，C# 程序不允许重写此方法或直接调用它（或其重写版本）。\n\n\
  ##### 类成员\n\nC# 中的类成员可以是字段、方法、常量、委托、运算符、索引器和属性。在 Java 中只有字段和方法。\n\n让我们比较一下字段和方法成员。Java\
  \ 和 C# 中的类字段和方法具有相似的声明语法。它们都有相关的修饰符，用于指定成员可以在何处（访问级别）以及如何（上下文）使用。成员静态修饰符使成员成为静态的，因此只能在静态上下文中访问。类似地，非静态成员只能从非静态上下文中访问。以下段落讨论变量（即类字段）和方法。\n\
  \n##### 变量\n\n变量表示存储位置。变量指向特定数据类型的值。为了表示变量与其值之间的这种关系，变量被声明为与其指向的值具有相同的类型。C# 和 Java\
  \ 都是类型安全的语言。运行时环境保证类型为 `T` 的变量始终指向相同类型 `T` 的值。\n\nC# 和 Java 不支持 C 和 C++ 中区分定义变量和声明变量的概念。在\
  \ C# 和 Java 中，你只需声明变量即可。\n\n变量的作用域取决于它们的声明位置。变量也必须初始化（同样，取决于它们声明的作用域）。变量具有默认值。\n\
  \n表 3.10 比较了 Java 和 C# 中的变量类别。无论 表 3.10 中的类别如何，对于指向值类型的变量，你通过调用值类型的构造函数来获取默认值。对于指向引用类型的变量，默认值是\
  \ `null` 引用。\n\n##### 方法\n\n典型的 Java 或 C# 方法声明如下所示：\n\n```\nattributes method-modifiers\
  \ return-type method-name (formal parameter list) throws exceptions\n```\n\n表 3.10.\
  \ Java 和 C# 中的变量\n\n| 变量类别 | Java | C# |\n| --- | --- | --- |\n| 静态变量 | 在静态上下文（静态块）或静态类成员中声明的字段。\
  \ | 在静态构造函数或静态类成员中声明的字段。 |\n|  | 自动初始化为变量类型的默认值。 | 自动初始化为变量类型的默认值。 |\n|  | 静态变量的修饰符：`private`、`public`、`protected`、`volatile`、`final`\
  \ | 静态变量的修饰符：`private`、`public`、`protected`、`internal`、`readonly`、`volatile` |\n\
  | 类实例变量 | 未使用 `static` 修饰符声明的字段是实例变量。 | 未使用 `static` 修饰符声明的字段是实例变量。 |\n|  | 自动初始化为变量类型的默认值。\
  \ | 自动初始化为变量类型的默认值。 |\n|  | 实例变量的修饰符：`private`、`public`、`protected`、`volatile`、`final`\
  \ | 实例变量的修饰符：`private`、`public`、`protected`、`internal`、`volatile`、`const`、`readonly`\
  \ |\n| 结构体实例变量 | 无 | 结构体的实例变量与其所属的结构体变量具有完全相同的生命周期。结构体实例变量的初始赋值状态与包含它的 `struct`\
  \ 变量相同。 |\n| 值参数变量 | 方法参数按值传递，称为值参数。 | 方法参数按值传递，称为值参数。 |\n|  | 值参数变量在方法调用后不再存在。\
  \ | 值参数变量在方法调用后不再存在。 |\n|  | 指向原始类型的变量不会保留方法内部所做的更改（按值传递）。 | 指向原始类型的变量不会保留方法内部所做的更改（按值传递）。\
  \ |\n|  | 这些变量使用调用方法传递的值进行初始化。 | 这些变量使用调用方法传递的值进行初始化。 |\n| 引用参数变量 | 无 | 允许方法参数按引用传递，而不是默认的按值传递。使用\
  \ `ref` 修饰符声明的参数是引用参数。引用参数的值与底层变量的值相同。变量在作为 `ref` 参数传入之前必须赋值。 |\n\n\n\n\n## 输出参数变量\n\
  \n使用 `ref` 修饰符声明的参数是引用参数。引用参数的值与底层变量的值相同。变量在作为 `ref` 参数传入时无需赋值，但必须在包含该参数的方法返回前完成赋值。此特性可用于从单次方法调用中返回多个值。\n\
  \n## 局部变量\n\n局部变量的作用域最窄，一旦其声明所在的代码块结束，变量即失效。\n\n局部变量默认不会被初始化，使用前必须进行初始化。\n\n有效修饰符：`volatile`、`final`（Java）；`const`（C#）。\n\
  \n## 表 3.11. Java 与 C# 方法修饰符\n\n| Java | C# | 含义 |\n| --- | --- | --- |\n| 不适用 |\
  \ `new` | 当基类方法标记了 `virtual` 修饰符，而对应的子类方法使用 `new` 修饰符时使用。子类隐藏了基类的实现。 |\n| 不适用 |\
  \ `override` | 当基类方法标记了 `virtual` 修饰符，而对应的子类方法使用 `override` 修饰符时使用。子类重写了基类的实现。 |\n\
  | 不适用 | `virtual` | 与 `new` 和 `override` 修饰符结合使用。 |\n| `public` | `public` | 使方法对其他命名空间或包中的类公开。\
  \ |\n| 不适用 | `internal` | 使成员可被同一程序集内的文件访问。 |\n| `protected` | `protected` | 使方法可被本类及其子类的对象访问。\
  \ |\n| 不适用 | `protected internal` | 此访问级别允许的权限是 `protected` 级别和 `internal` 级别所允许权限的并集。因此，其访问范围比单独使用任一修饰符更广。\
  \ |\n| `static` | `static` | 类级别方法。 |\n| `final` | `sealed` | 子类无法重写 `sealed` 或\
  \ `final` 方法。 |\n| `abstract` | `abstract` | 抽象方法不提供任何实现。 |\n| `native` | `extern`\
  \ | 这些修饰符用于标识使用外部库或代码的方法。 |\n\n请注意，`attributes`（C#）、`method-modifiers` 和 `parameter\
  \ list` 是方法签名的可选部分。方法签名的 `throws` 子句是可选的，且仅适用于 Java。\n\n方法修饰符可组合使用。表 3.11 比较了 Java\
  \ 和 C# 的方法修饰符。\n\nC# 中不允许某些方法修饰符组合：\n\n*   `abstract` 和 `sealed`\n*   `abstract`\
  \ 和 `static`\n*   `abstract` 和 `override`\n*   `static` 和 `override`\n*   `override`\
  \ 和 `new`\n*   `override` 和 `virtual`\n*   `abstract` 和 `extern`\n\nJava 中不允许以下方法修饰符组合：\n\
  \n*   `abstract` 和 `final`\n*   `abstract` 和 `static`\n*   `abstract` 和 `native`\n\
  \n在 Java 和 C# 中，可以通过更改方法签名的参数列表来重载方法。更改方法的返回类型或属性（C#）不会构成方法重载。重载的方法具有相同的方法修饰符。\n\
  \n### 接口\n\n与类构造类似，接口在 Java 和 C# 中都是一等类型。以下是一个典型的接口签名：\n\n```\nattributes modifiers\
  \ interface name interface-base body;\n```\n\n可选部分以斜体表示。属性仅适用于 C#。此外，Java 接口可以包含\
  \ `throws` 子句，用于指示方法抛出的受检异常。\n\n一个接口可以继承零个或多个接口，这些接口被称为该接口的显式基接口。接口的显式基接口的可访问性必须至少与接口本身相同（即，公共接口不能派生自私有接口）。实现接口的类也隐式实现了该接口的所有基接口。与类一样，接口可以嵌套其他接口。接口方法签名遵循与类方法签名相同的规则，但接口方法没有关联的主体。类可以声明显式接口成员实现。显式接口成员实现是引用完全限定接口成员名称的方法、属性、事件或索引器声明。显式接口实现仅存在于\
  \ C# 中。\n\n## 3.4.7. 集合库\n\nC# 语言在 `System.Collection` 命名空间中定义了其集合类和接口。C# 的 `ICollection`\
  \ 接口与 `java.util.Collection` 接口非常相似。`IList` 和 `IDictionary` 接口分别对应 `java.util.List`\
  \ 和 `java.util.Map` 接口。以下是 C# 和 Java 集合 API 之间的主要区别：\n\n*   C# 没有为线程安全和非线程安全集合提供单独的实现。默认情况下，所有集合都是非线程安全的，这遵循了\
  \ Java 2 集合范式。因此，C# 的 `Hashtable` 等同于 Java 的 `HashMap`，而非 `java.util.Hashtable`。\n\
  *   C# 没有与 `java.util.Collections` 类等效的类。这意味着 `Reverse`、`Sort` 和 `BinarySearch`\
  \ 等方法位于具体的集合实现（即 `ArrayList`、`Hashtable`）上，而不是被提取到一个只包含静态方法的类中。\n*   C# 没有与 `java.util.Set`\
  \ 等效的类型。\n*   C# 集合可以使用类似数组的索引语法进行访问。\n*   C# 支持不区分大小写的列表和 `Hashtable`。\n*   C#\
  \ 集合可以持有基本类型（由于装箱和拆箱机制）。\n\n## 3.4.8. 线程\n\n在 Java 中，可以通过继承 `java.lang.Thread` 类或实现\
  \ `java.lang.Runnable` 接口来创建线程。线程必须手动创建，程序员负责管理线程的生命周期（正确地终止它）。Java 还支持 `Timer`\
  \ 类来执行周期性的异步活动。多个线程可以同时访问和更改给定对象的状态。要使对象线程安全，应确保在任何给定时间只允许一个线程更改其状态。在 Java 中，通过使用\
  \ `synchronize` 关键字来实现线程安全。\n\n一次只能有一个线程访问对象的同步方法。你可以同步静态和非静态方法，甚至代码块，同步那些需要使其状态线程安全的对象。`java.lang.Object`\
  \ 上的 `wait()`、`notify()` 和 `notifyAll()` 方法用于通知调用线程进入等待状态并等待进一步的通知。\n\nC# 支持四种创建线程的方式：\n\
  \n1.  类似 Java 的手动构造和运行线程。推荐用于需要更精细控制线程生命周期的长时间运行、粗粒度线程。\n2.  使用 `System.Threading.ThreadPool`\
  \ 类。C# 提供了一个系统级的线程池类，用于管理 C# 分配给最终用户的线程的生命周期。推荐用于短时间运行、细粒度的任务。\n3.  使用 `System.Threading.Timer`\
  \ 类。这是执行周期性任务的推荐方法。\n4.  使用异步回调机制。虽然这种方法不直接创建线程，但它模拟了异步行为，并为调用线程和执行线程之间的信息共享提供了通用机制。\n\
  \n\n\n\n\n你可以通过使用 `lock` 关键字在 C# 中实现线程安全，这类似于 Java 的 `synchronize` 关键字。C# 还在 `System.Threading`\
  \ 命名空间中提供了可用于显式获取和释放锁的类。C# 提供了读写锁，这对于多线程尝试读取对象而只有一个线程尝试写入该对象的典型编程问题非常有用。C# 的 `Interlocked`\
  \ 类提供了可在 `int` 和 `long` 数据类型上执行的操作。这些操作不可中断；它们是原子的，因此无需为简单任务指定锁。\n\n### 3.4.9. 输入/输出\n\
  \nC# 和 Java 都通过 `Stream` 类处理输入/输出，而 Java 区分 `InputStream` 和 `OutputStream`。C# 只维护一个\
  \ `Stream` 类，该类有一个属性来指示它是用于输出还是输入。`Stream` 类的子类（`MemoryStream`、`FileStream`、`NetworkStream`\
  \ 和 `BufferedStream`）根据读取字节序列的底层介质进行区分。\n\n`Stream` 类对于从底层介质进行低级字节读取很有用。然而，使用相应的\
  \ `Reader/Writer` 类通常更方便，因为它们简化了方法调用。截至 JDK 1.3，Java 中没有非阻塞 I/O。要模拟非阻塞 I/O 行为，你必须启动一个执行实际\
  \ I/O 的线程。JDK 1.4 引入了 `java.nio` 包，它模拟了非阻塞行为。在 C# 中，非阻塞 I/O 不是一等概念（不同于 JDK 1.4）；相反，C#\
  \ 提供了一个方便的 API，使得编写非阻塞 I/O 相对容易。大多数 C# I/O 类都有接受异步回调委托的构造函数，因此消除了创建线程来模拟 I/O 的需要。\n\
  \nC# 提供了丰富的 API 来处理文件和目录。与 Java 不同，C# 确实区分文件和目录。请注意，在 C# 中，`IOException` 是一个未捕获的异常，因此不会在编译时被捕获。在\
  \ Java 中，`IOException` 是一个受检异常，大多数 `java.io` 类方法都会抛出它，从而迫使用户处理 I/O 故障。你可以通过使用 `Serializable`\
  \ 属性标记类或实现 `ISerializable` 接口来在 C# 中激活基本序列化。你可以使用自定义序列化来更精确地控制序列化和反序列化过程。\n\n###\
  \ 3.4.10. 命名空间和程序集\n\n在 Java 中，编译单元是单个源文件，通常包含一个公共类。实际上，源文件与其定义的单个类之间通常存在一一对应的关系。因为一个应用程序可以包含多个类，而且类名很可能冲突，所以习惯上将类安排在包中。类中缺少包声明则假定为默认包。\n\
  \n包在 Java 中具有特殊意义，因为它们与存储源文件和编译后类文件的磁盘结构紧密映射。包可以防止命名冲突，并提供了一个基于功能组织类的逻辑组织系统（例如，所有与\
  \ GUI 相关的类都集中在一个包中）。包还影响类的可访问性。包级别的类或接口只能被同一包中的其他类和接口访问。要引用其他包中的类和接口，你需要使用 `import`\
  \ 关键字。这使你无需指定完全限定名即可引用该类或接口。\n\n命名空间在 C# 中扮演着类似的角色。命名空间允许对 C# 类型进行逻辑组织。你可以通过 `using`\
  \ 关键字引用另一个命名空间，这与 `import` 关键字非常相似。但 `using` 更灵活，因为它可以用来将长的完全限定名别名为更用户友好的名称：\n\n\
  ```\nusing GUIToolKit = com.software.programmer.gui.toolkit;\n```\n\n这里，如果一个类 `SplashScreen`\
  \ 恰好在该命名空间中，那么在代码的其他地方可以将其引用为 `GUIToolKit.SplashScreen`。\n\n命名空间可以嵌套。命名空间没有访问限制。不能声明私有、受保护或内部命名空间，命名空间名称始终是公开可访问的。这与\
  \ Java 包类似。C# 中的编译单元是源文件。一个源文件可以包含多个命名空间和多个公共类。源文件中的命名空间和类可以相互交叉引用。与 Java 不同，C#\
  \ 命名空间并不表示文件系统上的任何目录结构。\n\n程序集是从项目文件编译生成的 EXE 或 DLL。为了大大简化部署，.NET 运行时使用了内置于程序集中的可配置属性和版本控制规则。程序集还构成了处理类型名称冲突的边界，使得同一进程中可以共存多个版本的程序集。每个文件可以包含多个类和多个命名空间。一个命名空间也可以分布在多个程序集中。一个程序集可以引用另一个程序集。Java\
  \ 中与程序集等价的是 `.jar` 文件。同一包中的类可以部署在不同的 `.jar` 文件中，尽管这样做并不直观。\n\n### 3.4.11. Java 缺少什么？\n\
  \n从目前的讨论应该可以清楚地看出，尽管 C# 和 Java 被宣传为相似，但它们在面向对象编程的方法上存在很大差异。然而，C# 中的某些元素在 Java 中没有任何等价物。请注意，以下讨论并不涵盖\
  \ Java 缺少的所有内容，只是一些关键概念。\n\n#### 结构体\n\nC# 结构体是从 C# 类 `System.Object` 派生的轻量级构造。与常规对象不同，结构体在栈上分配。结构体可以实现接口，并且可以拥有与类相同种类的成员。然而，结构体在几个重要方面与类不同：结构体是值类型而不是引用类型，并且不支持结构体的继承。虽然结构体可以在不需要完整类定义的地方提高性能，但结构体毕竟是值类型，当传递大量结构体作为方法参数时应该小心；后者在按值传递给方法时每次都会被复制，从而消耗更多内存。结构体在\
  \ 第 7 章 中有详细讨论。\n\n#### 常量\n\n常量是表示常量值的类成员：一个可以在编译时计算的值。只要没有循环依赖，常量可以依赖于同一程序中的其他常量。尽管常量被认为是静态成员，但常量声明既不需要也不允许使用\
  \ `static` 修饰符。以下是一个示例：\n\n```\npublic const int A = 1;\n```\n\n常量可以具有以下修饰符：`new`、`public`、`protected`、`private`\
  \ 和 `internal`。常量声明可以是以下类型：`sbyte`、`byte`、`short`、`ushort`、`int`、`uint`、`long`、`ulong`、`char`、`float`、`double`、`decimal`、`bool`、`string`、`enum`\
  \ 或引用类型。常量通常用于表达式中，而这些表达式又可以由其他常量组成。\n\n#### 属性\n\n属性是提供对对象或类特征访问的成员。属性的示例包括字符串的长度、字体的大小、窗口的标题、客户的名称等。属性是字段的自然扩展。与字段不同，属性不表示存储位置。相反，属性具有访问器，这些访问器指定了在读取或写入其值时要执行的语句。\n\
  \n\n\n\n\n属性上的访问修饰符同时适用于属性的 `get` 和 `set` 块。以下是一个属性示例：\n\n```csharp\npublic string\
  \ Name {\n    get {\n        return name;\n    }\n    set {\n        this.name =\
  \ value;\n    }\n}\nConsole.WriteLine(person.Name);\n```\n\n仅包含 `get` 块的属性是只读属性。属性可以是静态的或非静态的。它们可以通过\
  \ `name` 进行引用，并且由于 `get` 和 `set` 块是透明调用的，属性简化了语法。\n\n### 索引器\n\n索引器是一种成员，它使对象能够像数组一样被索引。索引器声明与属性声明类似。主要区别在于索引器是无名的，并且包含索引参数。索引参数在方括号之间提供。一个索引器定义示例如下：\n\
  \n```csharp\npublic class Stack {\n    public object this[int index] {\n       \
  \ get {\n        }\n        set {\n        }\n    }\n}\n```\n\n此代码允许调用 `Stack[i]`。\n\
  \n### 枚举\n\n`enum` 类型是一种独特的类型，它声明了一组命名常量。每个 `enum` 类型都有一个对应的整数类型，称为 `enum` 类型的底层类型。此底层类型必须能够表示枚举中定义的所有枚举器值。未显式声明底层类型的\
  \ `enum` 声明具有 `int` 底层类型。枚举可以具有以下修饰符：`new`、`public`、`protected`、`internal` 和 `private`。\n\
  \n### 委托\n\n事件编程在 GUI 应用程序中很典型，其中特定的用户交互会触发事件。每个事件都关联一个生成器（源）和一个接收器（目标）。事件编程的一般范式是接收器向生成器注册自身。注册后，生成器会将一个监听器添加到其维护的内部监听器列表中。生成器也可以从此列表中移除监听器。当事件被触发时，生成器会遍历此监听器列表并通知它们事件的发生。在\
  \ Java 中，生成器、监听器和事件本身都是类。然而，在 C# 中，事件是基于委托建模的。\n\nC# 委托可以被视为类型安全的函数指针。函数指针是对实际函数的引用。委托也可以包装对一系列函数的调用，这些函数可以动态添加或删除。由于函数调用的间接性质，委托对于模拟异步方法调用（例如，`System.Threading`\
  \ 和 `System.IO` 命名空间）很有用。委托也用于 C# 中的基于事件的编程。因此，C# 中的事件编程类似于 JavaBeans 属性更改监听器范式。由于你可以向委托添加或删除函数，而委托又指向多个函数，因此委托可以方便地模拟\
  \ JavaBeans 属性更改监听器范式。\n\n### 特性\n\n特性构成了 C# 语言的声明性元素。C# 允许程序员发明新的声明性信息类型，将此声明性信息附加到各种程序实体，并在运行时检索此声明性信息。程序通过定义和使用特性来指定此额外的声明性信息。可以创建自定义特性并将其附加到程序元素（类、方法、程序集等）。你可以创建一个自定义特性并将其附加到你的类，以便跟踪谁对类源代码做出了什么贡献。\n\
  \n除了我们讨论过的特性外，Java 还缺少以下内容：\n\n*   `ref` 和 `out` 方法参数\n\n*   基本类型的装箱和拆箱\n\n*   运算符重载\n\
  \n*   显式接口声明\n\n*   运行时代码生成\n\n*   对基于指针的代码的支持（内置于 API 中）\n\n*   `foreach` 语句和 `switch`\
  \ 语句中对字符串的支持\n\n*   确定性对象清理\n\n*   按引用传递\n\n*   可变长度方法参数列表\n\n*   版本控制\n\n为了更全面地了解\
  \ C# 和 Java 之间的差异，建议查看各章的摘要。为简洁起见，此处未重复这些内容。\n\n### 3.4.12. C# 缺少什么？\n\n尽管 C# 在\
  \ Java 的基础上改进了很多，但 Java 程序员会注意到 C# 缺少某些语言特性：\n\n*   受检异常\n\n*   类型化集合\n\n*   匿名内部类\n\
  \n*   动态类加载\n\n*   包含字段的接口\n\nC# 有其自身的一系列特性，作为 Java 程序员，你会希望它拥有这些特性。最明显的缺失之一是缺乏对受检异常的支持。处理受检异常在\
  \ Java 中就像声明变量一样常规，事实上，许多 Java API 通过抛出受检异常而不是返回 `null` 或静默忽略异常情况来强制执行可预测的执行路径。在\
  \ C# API 中，有很多地方方法返回 `null` 而不是抛出异常。这是 Java 程序员必须非常小心的地方。\n\n### 3.5. 总结\n\nC# 的创建旨在吸引\
  \ C、C++ 和 Visual Basic 程序员以及 Java 程序员。它是一种富有表现力的语言，它从其他语言中借鉴了多种构造，并将其整齐地打包在一个 API\
  \ 中。它对不安全代码、枚举、委托、运算符重载和确定性清理的支持，旨在吸引 C 和 C++ 程序员。同时，它对索引器、属性和基本类型装箱的使用，使得 Visual\
  \ Basic 程序员可以轻松学习这门语言。因此，C# 通常有多种构造来实现单个任务。这通常意味着程序员需要学习更多的构造。另一方面，Java 将所有内容都建模为类或接口，因此\
  \ Java 的学习曲线相当短。为了保持一致性，Java 牺牲了 C# 的大部分语法糖。\n\n然而，Java 通过其编写可移植、跨平台代码的能力弥补了表现力的不足。\n\
  \n## 第 4 章. 编写对象\n\n本章介绍 C# 对象和类。我们讨论对象创建、类设计、类成员的访问修饰符、重载和重写的概念以及一般的面向对象概念。基本的继承和多态性将在\
  \ 第 5 章 中讨论。\n\n### 4.1. 对象创建\n\n任何面向对象编程语言的基石都是对象的概念。对象是一个具有方法和字段的数据结构。字段维护对象的状态，方法查询或修改该状态。对象为存储数据提供了一个方便的容器。该容器上盖子的数量和类型决定了对数据的访问控制。例如，一个只有公共方法的对象就像一个打开的容器。对象可能会变得很重（消耗更多内存），具体取决于它们存储的数据。对象也用于抽象数据之间的关系。\n\
  \n在 C++、Java 和 C# 等面向对象语言中，对象是使用 `new` 运算符创建的。对象在内存中创建（通常是堆），并获得对该对象的引用，如下所示：\n\n\
  ```csharp\nobject o = new object();\n```\n\n左侧有引用 `o`，它被赋值给右侧新创建的对象。请注意，引用 `o` 只是指向堆上实际对象的指针。你可以通过调用对象的方法或设置其字段来使用引用来修改和查询实际对象的状态或数据：\n\
  \n```csharp\no.field = \"c#\";\no.sayHello();\n```\n\n\n\n\n\n当你将一个对象置空时，你只是将其引用设置为\
  \ `null`。关键字 `null` 在 C++、Java 和 C# 中用于将对象置空。请注意，`null` 并不是一个对象。相反，它是一个标准化的引用，像\
  \ `o` 这样的引用可以被设置为它，从而将对象置空。因此，以下语句只是让引用 `o` 指向 `null` 引用：\n\n```\no = null;\n```\n\
  \n在引用被设置为 `null` 后，对该引用调用方法或访问字段将导致经典的 `NullPointerException`（Java）。这是显而易见的，因为该引用现在没有指向任何底层对象。\n\
  \n请注意，引用是用来操作实际对象的“外观”。引用可以相互赋值。因此，以下语句将为之前创建的对象分配另一个引用 `o1`：\n\n```\nobject o1\
  \ = o;\n```\n\n将 `null` 赋给引用 `o` 不会影响引用 `o1`。后者仍将指向实际对象。当没有指向该对象的指针（引用）时，内存中的该对象就被视为垃圾，垃圾回收器（如果语言支持的话）将释放该对象占用的内存。\n\
  \n在 C# 和 Java 中，自动垃圾回收负责释放使用 `new` 运算符分配的内存。由于对象销毁不再是问题，程序员现在可以专注于正确的类设计和高效的对象创建，从而简化面向对象编程（OOP）。尽管如此，你确实需要一些关于内存管理和垃圾回收的知识，以避免阻碍垃圾回收过程的错误。第\
  \ 4.8 节 将更详细地讨论这些问题。\n\n#### 4.1.1. C# 中与 `java.lang.Object` 等效的类\n\nJava 和 C# 都有单根对象层次结构。所有对象始终扩展一个标准的根类。在\
  \ Java 中，这是 `java.lang.Object` 类；在 C# 中，这是 `System.Object` 类。表 4.1 比较了 `System.Object`\
  \ 和 `java.lang.Object` 及其近似的方法等效项。\n\n如果你对为什么 C# 的 `System.Object` 被称为 `object`\
  \ 感到困惑，那是因为 `object` 是 `System.Object` 的别名。为了说明 `System.Object` 的各种方法，让我们创建一个示例对象，如\
  \ 清单 4.1 所示。\n\n**表 4.1. C# 和 Java 的 `Object` 类**\n\n| `System.Object` (C#) | `java.lang.Object`\
  \ (Java) |\n| --- | --- |\n| `public object()` | `public Object()` |\n| `public\
  \ Equals(object o)` | `public equals(Object o)` |\n| `public static Equals(object\
  \ o1, object o2)` |   |\n| `GetHashCode()` | `hashCode()` |\n| `GetType` | `getClass()`\
  \ |\n| `ReferenceEquals(object a, object b)` |   |\n| `ToString()` | `toString()`\
  \ |\n| `Finalize()` | `finalize()` |\n| `MemberWiseClone()` |   |\n\n##### 清单 4.1.\
  \ 示例对象 (C#)\n\n```\nusing System;\npublic class Person {\n  string name;\n  public\
  \ Person (string name) {\n    this.name = name;\n  }\n  public override string ToString()\
  \ {\n    return this.name;\n  }\n  public override int GetHashCode() {\n    return\
  \ this.name.GetHashCode();\n  }\n  public override bool Equals(object o) {\n   \
  \ if (o != null && o.GetType().Equals(GetType())) {\n      return this.name.Equals(((Person)o).name);\n\
  \    }\n    return false;\n  }\n  public Person copy() {\n    return (Person)this.MemberwiseClone();\n\
  \  }\n}\n```\n\n清单 4.2 对 `Person` 对象运行了一些测试。\n\n##### 清单 4.2. 测试 `Person` 对象 (C#)\n\
  \n```\nusing System;\npublic class Test {\n  public static void Main(string[] args)\
  \ {\n\n    Person p1 = new Person(\"chris\");\n    Person p2 = new Person(\"chris\"\
  );\n    Person p3 = p1;\n\n    //Comparing p2 and p1;\n    Console.WriteLine(\"\
  Comparing p1 and p2\");\n    Console.WriteLine (p1.Equals(p2));\n    Console.WriteLine\
  \ (p1 == p2);\n    Console.WriteLine (Person.ReferenceEquals(p1, p2));\n\n    //Comparing\
  \ p3 and p1;\n    Console.WriteLine(\"Comparing p1 and p3\");\n    Console.WriteLine\
  \ (p1.Equals(p3));\n    Console.WriteLine (p1 == p3);\n    Console.WriteLine (Person.ReferenceEquals(p1,\
  \ p3));\n\n    //Comparing p4 and p1;\n    Console.WriteLine(\"Comparing p1 and\
  \ p4\");\n    Person p4 = p1.copy();\n    Console.WriteLine (p1.Equals(p4));\n \
  \   Console.WriteLine (p1 == p4);\n    Console.WriteLine (Person. ReferenceEquals\
  \ (p1, p4));\n\n    //Miscellaneous object methods\n    Console.WriteLine(p1.GetType());\n\
  \    Console.WriteLine(p1.ToString());\n    Console.WriteLine(p1.GetHashCode());\n\
  \  }\n}\n```\n\n清单 4.2 的输出如下：\n\n```\nComparing p1 and p2\nTrue\nFalse\nFalse\n\
  Comparing p1 and p3\nTrue\nTrue\nTrue\nComparing p1 and p4\nTrue\nFalse\nFalse\n\
  Miscellaneous object methods\nPerson\nchris\n177073830\n```\n\n对于大多数 Java 程序员来说，这个输出是显而易见的，因为它符合\
  \ Java 对象相等性的概念。以下是检查对象相等性的常用方法：\n\n*   `Equals` 方法 (`public virtual bool Equals\
  \ (object)`)。此代码确定两个 `Object` 实例是否相等。此方法等效于 `java.lang.Object` 类的 `equals` 方法。C#\
  \ 还提供了一个静态版本的 `Equals` 方法，该方法接受两个对象实例作为其参数。\n\n*   `==` 运算符。此运算符确定指定的 `Object` 实例是否为同一实例。`==`\
  \ 运算符类似于 Java 中的相同运算符，后者比较两个引用。因此，在示例中，`p3` 和 `p1` 相等，但 `p1` 和 `p2` 不相等，因为它们指向两个不同的对象实例。\n\
  \n*   `ReferenceEquals` 方法。此方法确定指定的 `Object` 实例是否为同一实例。其行为类似于 `==` 运算符。但是，请记住，运算符重载有时会改变\
  \ `==` 运算符的含义，因此使用 `ReferenceEquals` 方法检查引用相等性更安全。\n\n请注意，在我们创建的 `Person` 类中，有一个\
  \ `copy()` 方法包装了受保护的 `MemberwiseClone` 方法。`MemberwiseClone()` 是 `Object` 类的一个受保护方法，它创建对象的浅拷贝。该方法在内存中创建一个新对象，因此\
  \ `==` 运算符和 `ReferenceEquals` 方法在相等性检查时返回 `false`。`System.Object` 类的其他方法在本质上与 `java.lang.Object`\
  \ 类的方法相似。下一节将探讨编写 C# 类。\n\n### 4.2. 类\n\n尽管类构成了 Java 中的基本概念，但在 C# 中，它们是运行时支持的多种类型之一。`System.Type`\
  \ 类的实例可以是类、接口、值类型、数组、指针或枚举。第 7 章 讨论了 `System.Type`。\n\n类可以被视为对象的元数据或定义。类有成员，这些成员可以是其构造函数、方法、字段、属性和运算符。成员有助于维护和查询由类创建的对象的状态。维护任何单个对象状态的成员称为实例成员，而维护在该类上创建的所有对象状态的成员称为静态成员。在我们探讨类的实例和静态成员之前，我们将快速描述一些类访问修饰符。\n\
  \n因为本章是关于对象的，所以继承会自动介入。后面的章节将提到访问修饰符在继承上下文中的重要性。然而，第 5 章 对继承进行了更全面的论述。\n\n#### 4.2.1.\
  \ 类修饰符\n\n\n\n\n# 类修饰符\n\n类修饰符是可以放在类定义前面的关键字。修饰符可以表示访问权限或行为。类访问修饰符包括 `internal`、`public`、`private`\
  \ 和 `protected`。非访问修饰符包括 `sealed`、`abstract` 和 `new`。我们将首先探讨类访问修饰符。\n\n## `internal`\n\
  \n当一个类没有指定访问修饰符时，默认的访问级别是 `internal`。一个 `internal` 类只能在同一程序集内的文件中访问。\n\n## `public`\n\
  \n`public` 类对其可访问性没有限制。\n\n顶级类型（未嵌套在其他类型中的类型）只能具有 `internal` 或 `public` 的可访问性。这些类型的默认可访问性是\
  \ `internal`。\n\n嵌套类型（作为其他类型的成员的类型）可以具有如 表 4.2 所示的声明可访问性。\n\n### 表 4.2. 嵌套类型\n\n\
  | 成员所属类型 | 默认成员可访问性 | 允许的成员声明可访问性 |\n| --- | --- | --- |\n| `enum` | `public` |\
  \ 无 |\n| `class` | `private` | `public` `protected` `internal` |\n|  |  | `private`\
  \ `protected` `internal` |\n| `interface` | `public` | 无 |\n| `struct` | `private`\
  \ | `public` `internal` `private` |\n\n代码清单 4.3 和 4.4 说明了访问修饰符关键字。代码清单 4.3 在 `People`\
  \ 命名空间中定义了三个类。这三个类（`Developer`、`Actress` 和 `Scientist`）分别具有默认访问权限、公共访问权限和内部访问权限。代码清单\
  \ 4.4 中的 `Test` 类用于访问这些类。\n\n### 代码清单 4.3. 具有不同访问修饰符的示例类 (C#)\n\n```csharp\nusing\
  \ System;\nnamespace People {\n  public class Developer {\n    public void Fears\
  \ (Object o) {\n      Console.WriteLine(\"A developer fears \"+o);\n    }\n  }\n\
  \  class Actress {\n    public void Fears (Object o) {\n      Console.WriteLine(\"\
  An actress fears \"+o);\n    }\n  }\n  internal class Scientist {\n    public void\
  \ Fears (Object o) {\n      Console.WriteLine(\"A scientist fears \"+o);\n    }\n\
  \  }\n}\n```\n\n### 代码清单 4.4. 访问 代码清单 4.3 中定义的类的驱动程序类 (C#)\n\n```csharp\nusing People;\n\
  public class Test {\n  public static void Main(string[] args) {\n    Developer d\
  \ = new Developer();\n    d.Fears(new Actress());\n    Actress a = new Actress();\n\
  \    a.Fears(new Scientist());\n  }\n}\n```\n\n当你编译 代码清单 4.3 和 4.4 并在单个程序集中运行它们时，很明显，具有\
  \ `public`、`internal` 和默认访问修饰符的类可以被该程序集（C# 中的部署单元）中的任何类访问。请注意，即使类访问修饰符是限制性的，类的方法也可以具有更宽松的访问修饰符。因此，`Scientist`\
  \ 和 `Actress` 类可以拥有公共方法。\n\n为了快速证明 代码清单 4.3 中的 `Actress` 和 `Scientist` 类对于 代码清单\
  \ 4.4 中的 `Test` 类（如果它在不同的程序集中）是不可访问的，让我们使用 `csc /t:library Listing 4.3.cs` 编译 代码清单\
  \ 4.3。这将创建一个 `Listing 4.3.dll` 文件。现在尝试使用 `/r:Listing 4.3.dll` 选项编译 代码清单 4.4。编译器给出以下输出：\n\
  \n```\nListing4.4.cs(4,21): error CS0122: 'People.Actress' is inaccessible due to\
  \ its protection level\nListing4.4.cs(5,9): error CS0122: 'People.Actress' is inaccessible\
  \ due to its protection level\nListing4.4.cs(6,21): error CS0122: 'People.Scientist'\
  \ is inaccessible due to its protection level\n```\n\nJava 中的访问修饰符遵循大致相似的规则。\n\n\
  *   在 Java 中，`public` 类可以被任何包中的任何类访问。没有访问修饰符的类只能被同一包中的类访问。访问修饰符 `private` 和 `protected`\
  \ 仅允许用于内部类。多个包和类可以部署在单个 `.jar` 文件中。具有包级访问权限的 Java 类不能被 `.jar` 外部的类访问，也不能被同一 `.jar`\
  \ 中但不在同一包中的类访问。\n\n*   在 C# 中，默认和 `internal` 访问级别禁止程序集外部的类访问某个类。但是，程序集内部的类可以访问这些类。\n\
  \n## `private` 和 `protected`\n\n访问修饰符 `private` 和 `protected` 可以放在作为外部封闭类一部分的类上。这样的嵌套类的行为类似于类的任何其他成员（字段、方法、属性）。因此，嵌套类可以是\
  \ `private` 或 `protected`，并且只能被该类的对象访问，而不能被其他类或子类的对象访问。代码清单 4.5 展示了一个具有 `private`\
  \ 和 `protected` 访问权限的嵌套类。只有 `Developer` 类可以访问 `ApplicationDeveloper` 和 `WebDeveloper`\
  \ 类。\n\n### 代码清单 4.5. 访问私有和受保护的内部类 (C#)\n\n```csharp\nusing System;\nnamespace People\
  \ {\n  public class Developer {\n    public void Fears (Object o) {\n      Console.WriteLine(\"\
  A developer fears \"+o);\n      ApplicationDeveloper ad = new ApplicationDeveloper();\n\
  \      ad.Fears(o);\n      WebDeveloper wd = new WebDeveloper();\n      wd.Fears(o);\n\
  \    }\n    private class ApplicationDeveloper {\n      public void Fears (Object\
  \ o) {\n        Console.WriteLine(\"An application developer fears\"\n         \
  \                            +o+\" and software bugs \");\n      }\n    }\n    protected\
  \ class WebDeveloper {\n      public void Fears (Object o) {\n        Console.WriteLine(\"\
  A web developer fears \"\n                                       +o+\" and slow\
  \ modems \");\n      }\n    }\n  }\n  class Actress {\n    public void Fears (Object\
  \ o) {\n      Console.WriteLine(\"An actress fears \"\n                        \
  \                +o+\" a makeup famine\");\n    }\n  }\n  internal class Scientist\
  \ {\n    public void Fears (Object o) {\n      Console.WriteLine(\"A scientist fears\
  \ \"\n                                   +o+\" and loss of gravity \");\n    }\n\
  \  }\n}\n```\n\nC# 类的非访问修饰符可以是 `abstract`、`sealed` 或 `new`。\n\n## `abstract`\n\n\
  抽象类具有以下特征：\n\n*   抽象类不能被实例化。\n\n*   抽象类可以包含抽象方法和访问器。\n\n*   你不能使用 `sealed` 修饰符修改抽象类，这意味着该类不能被继承。\n\
  \n*   从抽象类派生的非抽象类必须包含所有继承的抽象方法和访问器的实际实现。\n\n*   抽象的 C# 类等同于抽象的 Java 类。\n\n当你想将大部分功能放在基类中，只留下一些方法供子类实现，以便它们可以插入特定行为时，抽象类是理想的选择。例如，一个模拟将对象状态持久化到数据库的类可以声明为抽象类。保存的一般逻辑可以在基类中捕获，而子类提供要存储数据的数据库表的名称。这种做法有助于将所有复杂代码保留在一个基类中，而子类最终变得相当简单。\n\
  \n```csharp\nabstract class PersistentObject {\n  public void Save() {\n    string\
  \ tableName = GetTableName();\n\n    //Do your saving here..\n  }\n  abstract public\
  \ string GetTableName();\n}\n\nclass Person : PersistentObject {\n  public string\
  \ GetTableName() { return \"PERSONS_TABLE\"; }\n}\n```\n\n## `sealed`\n\n\n\n\n\n\
  ### 密封类\n\n密封类不能被继承。将密封类用作基类是一个错误。在类声明中使用`sealed`修饰符可以防止类被意外继承。不允许将`abstract`修饰符与密封类一起使用。C#中的密封类类似于\
  \ Java 中的`final`类。\n\n##### `new`\n\n仅用于嵌套类，`new`表示该类隐藏了同名的继承成员。\n\n#### 4.2.2.\
  \ 类访问修饰符与继承\n\n继承对可以应用于类的访问修饰符类型施加了一些限制。在 Java 中，具有默认包级访问权限的类可以有一个公共的子类，如下所示：\n\n\
  ```\n //Test.java\npackage com.acme;\nclass Test {}\n//Test2.java\npackage com.acme;\n\
  public class Test2 extends Test {}\n```\n\n这两个类编译时没有任何错误。在 C#中，公共类的子类可以是公共的，也可以具有默认访问权限（未指定访问修饰符）。具有默认访问级别的类的子类不能是公共的。\n\
  \n类上的访问修饰符决定了类之间交互以及部署或暴露给最终用户的方式。在 Java 中，要成为公共 API 一部分的类被声明为公共的，大多数 Java API 类和任何作为`.jar`文件分发的第三方库都是如此。被这些公共类使用但不一定与最终用户相关的类具有包级访问权限。此外，一些类具有私有嵌套类，用于嵌套私有类仅在外层类范围内有意义的情况。\n\
  \n如果你预计你编写的类足够通用，可以作为库发布，你应该仔细考虑哪些类要暴露给库的用户。如果一个给定的类具有默认的类访问权限，其他程序集中的类将无法访问它。这种默认访问权限对于大多数应用程序来说应该足够了。\n\
  \n接下来，我们将讨论与类成员（如构造函数、方法、字段和属性）相关的关键字。我们简要看看继承如何影响这些成员。\n\n### 4.3. 构造函数\n\n构造函数是用于创建对象实例的特殊方法。在\
  \ C#和 Java 中，对象可以有多个构造函数。在没有构造函数的情况下，JVM 和 CLR 运行时提供一个默认的公共无参构造函数。构造函数可以相互调用。\n\n\
  在清单 4.6 中，该类有三个构造函数。最不具体的构造函数依次调用下一个更具体的构造函数，依此类推，从而将实际实现留在一个构造函数（最具体的那个）中。\n\n\
  ##### 清单 4.6. 多个构造函数（C#）\n\n|  \n\n```\n using System;\npublic class Cube {\n  int\
  \ width, height, length;\n\n  public Cube() : this(60,60,60) {}\n  public Cube(int\
  \ width, int length) : this(width,length,60) {}\n  public Cube(int width, int length,\
  \ int height) {\n    this.width = width;\n    this.length = length;\n    this.height\
  \ = height;\n  }\n  public override string ToString() {\n    return \"Volume is\
  \ \"+(this.width*this.height*this.length);\n  }\n  public static void Main(string[]\
  \ args) {\n    Console.WriteLine(new Cube());\n    Console.WriteLine(new Cube(10,20));\n\
  \    Console.WriteLine(new Cube(10,20,40));\n  }\n}\n```\n\n |\n\n`Cube`的子类可以使用`base`关键字引用其超类构造函数。这等同于\
  \ Java 的`super`关键字。因此，以下类将编译：\n\n```\n using System;\npublic class DerivedCube :\
  \ Cube{\n  public DerivedCube (int width, int length) : base (width, length){}\n\
  }\n```\n\n现在，让我们从清单 4.6 中移除默认构造函数`Cube()`，并从前面的代码中移除`DerivedCube`(`int width`, `int\
  \ length`)构造函数，然后尝试编译。编译器会报错。在没有为`DerivedCube`指定构造函数的情况下，运行时尝试分配默认的公共无参构造函数，并注意到超类没有指定该默认构造函数。但是，当`DerivedCube`(`int\
  \ width`, `int length`)构造函数放回原位而超类没有`Cube()`构造函数时，编译器不会报错。这种行为与 Java 类似。\n\n如果未指定构造函数，C#会为类提供一个默认的无参公共构造函数。但是，如果为类指定了构造函数，则运行时不会提供默认构造函数。运行时提供的默认构造函数会自动调用`base()`，在这种情况下，超类必须有一个默认的无参公共构造函数。构造函数可以是私有的。此修饰符通常用于实现单例模式的对象。将构造函数设为私有只允许存在一个对象副本（单例）：\n\
  \n```\n using System;\npublic class CubeFactory {\n  private static singleton =\
  \ new CubeFactory();\n  private CubeFactory(){}\n  public CubeFactory GetSingleton()\
  \ { return singleton; }\n}\n```\n\n此外，子类不能使用`base()`调用引用此私有基构造函数。\n\n构造函数可以是受保护的，在这种情况下，只要子类与超类在同一个程序集中，子类就可以使用`base`关键字访问它们。构造函数也可以是静态的。静态\
  \ C#构造函数等同于 Java 静态初始化块。静态构造函数不能有任何参数。它们指定如下：\n\n```\n using System;\npublic class\
  \ RubickCube : Cube {\n  static RubickCube() {\n    Console.WriteLine(\"Static block\"\
  );\n  }\n}\n```\n\n请注意，静态块不遵循典型的继承行为。子类的静态构造函数不会自动调用超类的静态构造函数。这种行为与 Java 的静态初始化器类似。\n\
  \n### 4.4. 方法\n\n你使用方法来查询和修改对象的状态。在 OOP 中，方法调用是与对象交互的首选方式。大多数类成员都是方法，因此我们从 Visual\
  \ Studio 帮助文件中调整了以下推荐的方法使用指南：\n\n*   方法名应为动词或动词短语，并使用 Pascal 大小写（与 Java 的 Camel\
  \ 大小写不同）。\n\n*   不要使用匈牙利命名法。\n\n*   默认情况下，方法是非虚拟的。\n\n方法签名指示返回类型、方法名称前的任何访问修饰符或限定符、方法参数以及方法抛出的任何异常。\n\
  \n以下访问修饰符通常用于 C#方法之前。\n\n#### 4.4.1. `public`\n\n对象的`public`方法可以被任何类调用。\n\n####\
  \ 4.4.2. `protected`\n\n`protected`成员可以从声明它的类内部以及从派生自声明该成员的任何类内部访问。基类的`protected`成员仅在通过派生类类型进行访问时，才可在派生类中访问。\n\
  \n#### 4.4.3. `private`\n\n`private`成员只能在声明它们的类或结构体的主体内访问。同一主体中的嵌套类型也可以访问这些`private`成员。\n\
  \n#### 4.4.4. `internal`\n\n`internal`方法可以被与定义该方法的类在同一程序集中的任何类调用。\n\n#### 4.4.5.\
  \ `static`\n\n`static`方法是类级方法，不需要对象实例即可访问该方法。\n\n#### 4.4.6. `sealed`\n\n`sealed`方法允许类重写虚拟函数，并防止派生类重写相同的函数。换句话说，在虚拟方法上使用`sealed`会停止虚拟分派。例如：\n\
  \n\n\n\n\n```csharp\nusing System;\nclass SuperClass {\n  public virtual string\
  \ DoIt () { return \"DoIt\"; }\n}\nclass SubClass : SuperClass {\n  public override\
  \ sealed string DoIt () { return \"DoIt \"; }\n  static void Main(string[] args)\
  \ {\n    SubClass sc = new SubClass();\n    Console.WriteLine(sc);\n  }\n}\n```\n\
  \n这里，子类将 `DoIt()` 方法定义为密封的。这允许它重写超类的虚方法，但 `SubClass` 的子类无法再重写该方法。\n\n#### 4.4.7.\
  \ `extern`\n\n在方法声明中使用 `extern` 修饰符，表示该方法是外部实现的。这等同于 Java 中的 `native` 关键字。由于外部方法声明不提供实际实现，因此没有方法体；方法声明仅以分号结尾，签名后没有花括号（`{\
  \ }`）。例如：\n\n```csharp\npublic static extern int MyMethod(int x);\n```\n\n#### 4.4.8.\
  \ `unsafe`\n\n`unsafe` 关键字表示一个不安全上下文，这是任何涉及指针的操作所必需的。`unsafe` 作为修饰符应用于可调用成员（如方法、属性、构造函数和扩展器，但不包括静态构造函数）的声明中：\n\
  \n```csharp\nstatic unsafe void FastCopy (byte[] src, byte[] dst, int count)\n{\n\
  \  // 不安全上下文：可以在这里使用指针\n}\n```\n\n不安全上下文的范围从参数列表延伸到函数末尾，因此也可以在参数列表中使用指针：\n\n```csharp\n\
  static unsafe void FastCopy ( byte* ps, byte* pd, int count )\n{ . . . }\n```\n\n\
  `unsafe` 关键字在 Java 中没有等价物。\n\n#### 4.4.9. `virtual`\n\n在 Java 中，给定类的所有方法默认都可以被子类重写，除非你在方法上使用\
  \ `final` 关键字。然而，在 C# 中，这不是默认行为。可能被子类重写的类方法必须标记为 `virtual`。子类可以使用 `override` 关键字来改变这些虚方法的实现，明确表示子类正在重写超类的行为。\n\
  \n当调用虚方法时，会检查对象的运行时类型是否有重写成员。将调用最派生类中的重写成员；如果没有派生类重写该成员，则该成员可能是原始成员。默认情况下，方法是非虚的。你不能重写非虚方法。然而，在\
  \ Java 中，除非另有说明，所有方法都是虚的。你不能将 `virtual` 修饰符与以下修饰符一起使用：`static`、`abstract`、`override`\
  \ 和 `private`。\n\n#### 4.4.10. `override`\n\n`override` 方法提供了从基类继承的成员的新实现。被 `override`\
  \ 声明重写的方法称为被重写的基方法。被重写的基方法必须与 `override` 方法具有相同的签名。你不能重写非虚或静态方法。被重写的基方法必须是虚的、抽象的或重写的。`override`\
  \ 声明不能更改虚方法的可访问性。`override` 方法和 `virtual` 方法必须具有相同级别的访问修饰符。你不能使用以下修饰符来修改重写方法：`new`、`static`、`virtual`\
  \ 和 `abstract`。\n\n#### 4.4.11. `abstract`\n\n在方法声明中使用 `abstract` 修饰符，表示该方法或属性不包含实现。抽象方法具有以下特点：\n\
  \n*   抽象方法隐式地是虚方法。\n\n*   抽象方法声明仅允许在抽象类中。\n\n*   由于抽象方法声明不提供实际实现，因此没有方法体；方法声明仅以分号结尾，签名后没有花括号（`{\
  \ }`）。例如：\n\n    ```csharp\n    public abstract void MyMethod();\n    ```\n\n* \
  \  实现由重写方法提供，该方法是非抽象类的成员。\n\n    在抽象方法声明中使用 `static`、`virtual`、`private` 或 `override`\
  \ 修饰符是错误的。\n\n#### 4.4.12. `new`\n\n使用 `new` 修饰符显式隐藏从基类继承的成员。要隐藏继承的成员，请在派生类中使用相同的名称声明它，并使用\
  \ `new` 修饰符进行修改。\n\n与访问修饰符（`internal`、`private`、`public` 和 `protected`）结合使用，关键字\
  \ `virtual`、`override`、`sealed`、`new` 和 `abstract` 为类提供了多个级别的可访问性和可扩展性。清单 4.7 展示了修改后的\
  \ `Person` 类，其中的方法具有多种访问修饰符和此处定义的关键字。\n\n##### 清单 4.7\\. 修改后的 `Person` 类 (C#)\n\n\
  ```csharp\nusing System;\n\nabstract public class Person {\n  string name;\n  string\
  \ ssn;\n  int age;\n  float salary;\n\n  public Person (string name, string ssn,\
  \ int age, float sal) {\n    this.name = name;\n    this.ssn = ssn;\n    this.age\
  \ = age;\n    this.salary = sal;\n  }\n  private void GetSSN() {\n    this.ssn =\
  \ ssn;\n  }\n  protected int GetAge() {\n    return age;\n  }\n  internal float\
  \ GetSalary() {\n    return salary;\n  }\n  string GetName() { return name; }\n\n\
  \  protected static String GetBloodColor() {\n    return \"Red\";\n  }\n  static\
  \ int GetNumberOfEyes() {\n    return 2;\n  }\n  public override String ToString()\
  \ { return name; }\n  public override int GetHashCode() { return 12222; }\n  public\
  \ override sealed bool Equals(Object o) {\n    Person p = o as Person;\n    if (p\
  \ == null) return false;\n    return this.name.Equals(p.GetName());\n  }\n  public\
  \ virtual void CalcInvestments() {\n    Console.WriteLine(\"Person funds\");\n \
  \ }\n  public virtual void CalcDebt() {\n    Console.WriteLine(\"Person debt\");\n\
  \  }\n  public abstract void Work();\n}\n```\n\n请注意关于我们的 `Person` 类的以下细节：\n\n* \
  \  该类被声明为抽象的，因为它包含抽象的 `Work` 方法。\n\n*   该类重写了 `System.Object` 的 `ToString()` 和 `GetHashCode()`\
  \ 方法。这些是基类的虚方法。\n\n*   该类重写并密封了 `Equals` 方法的实现。这意味着子类无法提供 `Equals` 方法的实现。\n\n* \
  \  方法 `GetAge()`、`GetSSN()`、`GetSalary()` 和 `GetName()` 是实例方法，分别具有 protected、private、internal\
  \ 和默认访问级别。\n\n*   `GetBloodColor()` 和 `GetNumberOfEyes()` 是静态方法，分别具有 protected 和默认访问级别。\n\
  \n*   `CalcInvestments()` 和 `CalcDebt()` 是虚方法。这些方法可以被子类重写或隐藏。\n\n清单 4.8 是 `Person`\
  \ 类的一个子类 `Man`。请注意，我们已注释掉无法编译的代码，并指明了原因。\n\n##### 清单 4.8\\. `Person` 类的子类 (C#)\n\
  \n\n\n\n\n```csharp\nusing System;\n\npublic class Man : Person {\n  public Man\
  \ (string name, string ssn, int age, float sal): base\n                     (name,\
  \ ssn, age, sal) {}\n  public override void Work() {\n    Console.WriteLine(\"Works\
  \ like a dog\");\n  }\n  public override void CalcInvestments() {\n    Console.WriteLine(\"\
  Man funds\");\n  }\n  public new void CalcDebt() {\n    Console.WriteLine(\"Man\
  \ debt\");\n  }\n\n  //Entry point\n  public static void Main(string[] args) {\n\
  \    Man m = new Man(\"Jack\", \"12354544\", 23, 40000f);\n\n    /******\n    *\
  \  Won't compile, cannot call static method using the\n    *  instance reference.\
  \ Can do this in Java though!\n    *****/\n    //Console.WriteLine(m.GetBloodColor());\n\
  \n    /******\n      Won't compile, improper access level.\n    *****/\n    //Console.WriteLine(m.GetNumberOfEyes());\n\
  \    //Console.WriteLine(m.GetSSN());\n    //Console.WriteLine(m.GetName());\n \
  \   Console.WriteLine(m.GetSalary());\n    Console.WriteLine(m.GetAge());\n\n  \
  \  /**\n      *  All print subclass's implementation of\n    CalcInvestments()*/\n\
  \    m.CalcInvestments();\n\n    Person p = m as Person;\n    p.CalcInvestments();\n\
  \n    ((Person)m).CalcInvestments();\n\n    m.CalcDebt();\n    p.CalcDebt();\n \
  \   ((Person)m).CalcDebt();\n  }\n}\n```\n\n请注意关于子类的以下细节。\n\n*   `GetBloodColor()`\
  \ 是一个静态方法。与 Java 不同，C# 不允许你使用对象实例来调用静态方法。\n\n*   具有默认访问级别的方法的行为与私有方法相同。\n\n*   `Man`\
  \ 类重写了基类的虚方法 `CalcInvestments()`。它通过提供 `override` 关键字来实现这一点。请注意，尽管我们努力将其转换为 `Person`\
  \ 对象，但调用的方法始终是子类上的方法。运行时总是将虚方法分派给重写它的子类。\n\n*   `Man` 类“隐藏”了基类的虚方法 `CalcDebt()`。它通过提供\
  \ `new` 关键字来实现这一点。请注意，可以通过转换引用来调用基类的实现。\n\n*   `Man` 类必须提供抽象方法 `Work()` 的实现。\n\n\
  *   一个类可以有一个方法，而不必隐藏任何超类实现。如果一个类使用 `override` 关键字，编译器在找不到要重写的虚方法时会报错。\n\n#### 4.4.13.\
  \ 方法继承\n\n基类中的虚方法可以被子类重写或隐藏。此外，如果子类不想成为抽象类，它必须实现基类中存在的任何抽象方法。在 Java 中，类的所有方法默认都是虚方法；此外，子类不必明确表示它们正在重写一个方法。与基类中具有相同签名的方法将在子类中被重写。事实上，你可以通过方法隐藏和使用\
  \ `new` 关键字在 C# 中模拟类似 Java 的行为。子类可以使用 `base` 关键字调用其超类的实现：\n\n```csharp\nclass Sub\
  \ : Super\n{\n  public void DoIt() {\n    base.Doit();\n  }\n}\n```\n\n方法签名通常包括抛出的任何异常。第\
  \ 10 章 讨论了继承和方法异常的详细信息。\n\n#### 4.4.14. 方法重载\n\n与 Java 一样，你不能仅通过返回值来区分一个方法。对于一个方法要被重载，它应该具有与任何同名方法不同的参数。以下来自\
  \ Visual Studio 帮助文件的方法重载推荐指南：\n\n*   使用方法重载来提供执行语义相同操作的不同方法。\n\n*   使用方法重载而不是允许默认参数。默认参数版本控制效果不佳，因此在公共语言规范\
  \ (CLS) 中不允许使用。以下代码示例说明了重载的 `String.IndexOf` 方法。\n\n    ```csharp\n    int String.IndexOf\
  \ (String name);\n    int String.IndexOf (String name, int startIndex);\n    ```\n\
  \n*   正确使用默认值。在一系列重载方法中，复杂方法应使用参数名称来表明与简单方法中假设的默认状态相比发生了变化。例如，在以下代码中，第一个方法假设搜索不区分大小写。第二个方法使用名称\
  \ `ignoreCase` 而不是 `caseSensitive` 来表明默认行为是如何被改变的。\n\n    ```csharp\n    // Method\
  \ #1: ignoreCase = false.\n    MethodInfo Type.GetMethod(String name);\n    // Method\
  \ #2: Indicates how the default behavior of method\n    // #1 is being changed.\n\
  \    MethodInfo Type.GetMethod (String name, Boolean ignoreCase);\n    ```\n\n*\
  \   对方法参数使用一致的排序和命名模式。通常提供一组参数数量递增的重载方法，以允许开发人员指定所需的信息级别。你指定的参数越多，开发人员可以指定的细节就越多。在以下代码示例中，重载的\
  \ `Execute` 方法具有一致的参数顺序和命名模式变化。每个 `Execute` 方法变体对共享的参数集使用相同的语义。\n\n    ```csharp\n\
  \    public class SampleClass {\n      readonly string defaultForA = \"default value\
  \ for a\";\n      readonly string defaultForB = \"default value for b\";\n     \
  \ readonly string defaultForC = \"default value for c\";\n\n      public void Execute()\
  \ {\n        Execute(defaultForA, defaultForB, defaultForC);\n      }\n\n      public\
  \ void Execute (string a) {\n        Execute(a, defaultForB, defaultForC);\n   \
  \   }\n\n      public void Execute (string a, string b) {\n        Execute (a, b,\
  \ defaultForC);\n      }\n\n      public virtual void Execute (string a, string\
  \ b, string c) {\n        Console.WriteLine(a);\n        Console.WriteLine(b);\n\
  \        Console.WriteLine(c);\n        Console.WriteLine();\n      }\n    }\n \
  \   ```\n\n    如果参数具有不同的类型，此一致模式也适用。请注意，组中唯一应该是 `virtual` 的方法是具有最多参数的那个。\n\n*  \
  \ 对可变数量的参数使用方法重载。在适合为方法指定可变数量参数的情况下，使用声明 n 个参数数量递增的方法的约定。对于大于 n 的数字，提供一个接受值数组的方法。例如，在大多数情况下，n=3\
  \ 或 n=4 是合适的。以下示例说明了此模式。\n\n    ```csharp\n    public class SampleClass {\n    \
  \  public void Execute(string a) {\n        Execute(new string[] {a});\n      }\n\
  \n      public void Execute(string a, string b) {\n        Execute(new string[]\
  \ {a, b});\n      }\n\n      public void Execute(string a, string b, string c) {\n\
  \        Execute(new string[] {a, b, c});\n      }\n\n      public virtual void\
  \ Execute(string[] args) {\n        foreach (string s in args) {\n          Console.WriteLine(s);\n\
  \        }\n      }\n    }\n    ```\n\n*   如果你必须提供重写方法的能力，请仅将最完整的重载设为 `virtual`，并根据它定义其他操作。以下示例说明了此模式。\n\
  \n    ```csharp\n    public class SampleClass {\n      private string myString;\n\
  \n      public MyClass(string str) {\n        this.myString = str;\n      }\n\n\
  \      public int IndexOf(string s) {\n        return IndexOf (s, 0);\n      }\n\
  \n      public int IndexOf(string s, int startIndex) {\n        return IndexOf(s,\
  \ startIndex, myString.Length —start\n        Index);\n      }\n\n      public virtual\
  \ int IndexOf(string s, int startIndex,\n    int count) {\n        return myString.IndexOf(s,\
  \ startIndex, count);\n      }\n    }\n    ```\n\n\n\n\n\n当方法被重载时，编译器会通过比较方法所接受的参数来调用正确的方法。方法不能仅根据其返回类型进行重载。如果存在从参数类型到形参类型的隐式转换，编译器将优先调用该方法。如果两个方法之间唯一的区别是一个方法的\
  \ `ref` 参数在另一个方法中是 `out` 参数，则这两个方法不能构成重载。如果一个方法通过值传递参数，而另一个方法通过引用传递参数，则这两个方法可以构成重载。\n\
  \n#### 4.4.15. 方法参数\n\n在 Java 中，方法参数的种类不多。Java 中的方法参数是按值传递的。对基本类型参数所做的更改在方法退出后会丢失。对象引用参数也是按值传递的。这意味着会创建引用的副本并传递给方法，但复制的引用所指向的对象保持不变。以下\
  \ Java 程序阐明了这一点：\n\n```java\nimport java.util.ArrayList;\nimport java.util.List;\n\
  \npublic class MethodParameterTest {\n    public static void main(String[] args)\
  \ {\n\n        //Testing primitives\n        int a = 3;\n        testPrimitive(a);\n\
  \        System.out.println(a);\n\n        //Testing testObjectList1\n        List\
  \ list1 = new ArrayList();\n        System.out.println(list1.size());\n        testObjectList1(list1);\n\
  \        System.out.println(list1.size());\n\n        //Testing testObjectList2\n\
  \        List list2 = new ArrayList();\n        list2.add(\"Major\");\n        testObjectList2(list2);\n\
  \        System.out.println( list2.size());\n\n        //Testing Strings\n     \
  \   String s = \"Jack\";\n        testString(s);\n        System.out.println(s);\n\
  \    }\n\n    private static void testPrimitive(int a) {\n        a *=2;\n    }\n\
  \n    private static void testObjectList1(List l ) {\n        l.add(\"Test\");\n\
  \    }\n\n    private static void testObjectList2(List l ) {\n        l = null;\n\
  \    }\n\n    private static void testString(String s) {\n        s = \"John\";\n\
  \    }\n}\n```\n\n上述程序输出如下：\n\n```\n3\n0\n1\n1\n1\nJack.\n```\n\n当 `testPrimitive()`\
  \ 方法退出时，基本类型的值并未改变。基本类型 `a` 在方法调用前是 3，在方法内部是 6，在方法外部又变回 3。变量 `list1` 是对实际 `ArrayList`\
  \ 对象的引用，它被传递给该方法。在方法调用时创建了引用的副本，但这个副本指向的是在方法之前创建的同一个 `ArrayList()` 对象。使用这个复制的引用，`list1`\
  \ 向 `ArrayList()` 对象添加了一个对象。方法退出后，`ArrayList()` 对象的大小已经改变。请注意，尽管引用是按值复制的，但实际指向的对象保持不变；因此，对该对象所做的任何更改都会在方法外部体现出来。\n\
  \n变量 `list2` 是对实际 `ArrayList()` 的引用，它被传递给该方法。在方法调用时创建了引用的副本，但这个副本指向的是在方法之前创建的同一个\
  \ `ArrayList()` 对象。然后，该引用被设置为 `null`。正如本章开头所述，`null` 是一个引用，而不是一个对象。因此，复制的引用被设置为\
  \ `null`，而指向方法外部创建的 `ArrayList` 的原始引用保持不变，并且在方法执行前后，`ArrayList()` 的大小保持不变。\n\n最后一个例子比较微妙。字符串是按值传递给方法的。创建了字符串引用的副本，这个副本也指向字符串字面量\
  \ `\"Jack\"`。在方法内部，复制的引用被指向另一个字面量。然而，这并不影响指向字面量 `\"Jack\"` 的原始字符串引用。因此，当方法退出时，该引用仍然指向同一个字面量。\n\
  \n在 Java 中，参数（无论是基本类型还是对象引用）始终是按值传递的。\n\n`清单 4.9` 展示了一个与刚才所示的 Java 程序类似的 C# 程序。毫不奇怪，C#\
  \ 遵循相同的原则，即基本类型和对象引用都是按值传递的。\n\n##### 清单 4.9. 按值传递方法参数 (C#)\n\n```csharp\nusing\
  \ System;\nusing System.Collections;\n\npublic class Test {\n\n    public static\
  \ void Main(string[] args) {\n\n        //Testing primitives\n        int a = 3;\n\
  \        TestPrimitive(a);\n        Console.WriteLine(a);\n\n        //Testing TestObjectList1\n\
  \        ArrayList l = new ArrayList();\n        Console.WriteLine(l.Count);\n \
  \       TestObjectList1(l);\n        Console.WriteLine(l.Count);\n\n        //Testing\
  \ testObjectList2\n        ArrayList ll = new ArrayList();\n        ll.Add(\"Major\"\
  );\n        Console.WriteLine(ll.Count);\n        TestObjectList2(ll);\n       \
  \ Console.WriteLine(ll.Count);\n\n        //Testing Strings\n        String s =\
  \ \"Jack\";\n        TestString(s);\n        Console.WriteLine(s);\n    }\n\n  \
  \  private static void TestPrimitive(int a) {\n        a *= 2;\n    }\n\n    private\
  \ static void TestObjectList1(ArrayList l) {\n        l.Add(\"Jumbo\");\n    }\n\
  \n    private static void TestObjectList2(ArrayList l) {\n        l = null;\n  \
  \  }\n\n    private static void TestString(String s) {\n        s = \"John\";\n\
  \    }\n}\n```\n\n`清单 4.9` 的输出如下：\n\n```\n3\n0\n1\n1\n1\nJack.\n```\n\n##### `ref`\
  \ 关键字\n\n然而，C# 允许你使用 `ref` 关键字来改变这种默认的按值传递行为。在 `清单 4.9` 的基础上，我们在所有方法和调用方法时的参数前都添加了\
  \ `ref` 关键字（参见 `清单 4.10`）。\n\n##### 清单 4.10. 使用 `ref` 关键字 (C#)\n\n```csharp\nusing\
  \ System;\nusing System.Collections;\n\npublic class Test {\n\n    public static\
  \ void Main(string[] args) {\n\n        //Testing primitives\n        int a = 3;\n\
  \        TestPrimitive(ref a);\n        Console.WriteLine(a);\n\n        //Testing\
  \ TestObjectList1\n        ArrayList l = new ArrayList();\n        Console.WriteLine(l.Count);\n\
  \        TestObjectList1(ref l);\n        Console.WriteLine(l.Count);\n\n      \
  \  //Testing testObjectList2\n        ArrayList ll = new ArrayList();\n        ll.Add(\"\
  Major\");\n        Console.WriteLine(ll.Count);\n        TestObjectList2(ref ll);\n\
  \        if (ll != null) {\n            Console.WriteLine(ll.Count);\n        }\n\
  \n        //Testing Strings\n        String s = \"Jack\";\n        TestString(ref\
  \ s);\n        Console.WriteLine(s);\n    }\n\n    private static void TestPrimitive(ref\
  \ int a) {\n        a *= 2;\n    }\n\n    private static void TestObjectList1(ref\
  \ ArrayList l) {\n        l.Add(\"Jumbo\");\n    }\n\n    private static void TestObjectList2(ref\
  \ ArrayList l) {\n        l = null;\n    }\n\n    private static void TestString(ref\
  \ String s) {\n        s = \"John\";\n    }\n}\n```\n\n以下是 `清单 4.10` 的输出：\n\n```\n\
  6\n0\n1\n1\nJohn\n```\n\n基本类型的值在方法中被改变了。因此，基本类型在方法调用前的值是 3，在方法内部是 6，在方法外部也是 6。\n\
  \n```csharp\n//Testing primitives\nint a = 3;\nTestPrimitive(ref a);\nConsole.WriteLine(a);\n\
  ```\n\n在这里添加 `ref` 关键字并没有改变这样一个事实：在方法中添加到 `ArrayList()` 的对象实际上被添加到了在方法之前创建的原始 `ArrayList()`\
  \ 对象中。因此，方法调用前后 `ArrayList()` 的大小与 `清单 4.9` 中的相同。\n\n```csharp\n//Testing TestObjectList1\n\
  ArrayList l = new ArrayList();\nConsole.WriteLine(l.Count);\nTestObjectList1(ref\
  \ l);\nConsole.WriteLine(l.Count);\n```\n\n在这里添加 `ref` 关键字会按原样传递对 `ArrayList` 的引用，而不会创建副本。结果，当引用被设置为\
  \ `null` 时，被设置为 `null` 的是实际的引用，而不是它的副本。因此，在方法调用之后，引用为 `null`，我们必须在调用其 `Count` 属性之前检查这一点。否则，我们会得到一个\
  \ `NullPointerException`。\n\n\n\n\n\n```csharp\n//测试字符串\nString s = \"Jack\";\n\
  TestString(ref s);\nConsole.WriteLine(s);\n```\n\n字符串引用按原样传递给方法。在方法内部，它被指向一个不同的字面量，因此该更改在方法调用后仍然保留。\n\
  \n## `out` 关键字\n\n以下关于 `out` 关键字的详细信息已从 Microsoft Visual Studio 帮助文件中复制于此。\n\n>\
  \ 方法参数上的 `out` 方法参数关键字导致方法引用与传入方法相同的变量。在方法中对参数进行的任何更改，在控制权返回调用方法时都将反映在该变量中。\n\n\
  > 当你希望方法返回多个值时，声明 `out` 方法非常有用。使用 `out` 参数的方法仍然可以返回一个值。一个方法可以有多个 `out` 参数。\n\n>\
  \ 要使用 `out` 参数，必须将参数显式地作为 `out` 参数传递给方法。`out` 参数的值不会传递给 `out` 参数。作为 `out` 参数传递的变量不需要初始化。但是，`out`\
  \ 参数必须在方法返回前被赋值。\n\n清单 4.11 展示了如何使用 `out` 参数来创建一个返回多个值的方法。\n\n### 清单 4.11. 使用 `out`\
  \ 关键字创建返回多个值的方法 (C#)\n\n```csharp\nusing System;\npublic class Test {\n  public\
  \ static void Main(string[] args) {\n\n    int a;\n    int b = DoIt(out a);\n  \
  \  Console.WriteLine(b);\n    Console.WriteLine(a);\n  }\n\n  private static int\
  \ DoIt(out int a) {\n    a = 2;\n    return 1;\n  }\n}\n```\n\n## `params` 关键字\n\
  \n`params` 关键字允许你指定一个方法参数，该参数接受一个参数数量可变的参数。在方法声明中，`params` 关键字之后不允许有其他参数，并且一个方法声明中只允许有一个\
  \ `params` 关键字。\n\n清单 4.12 展示了 `params` 关键字。\n\n### 清单 4.12. 使用 `params` 关键字 (C#)\n\
  \n```csharp\nusing System;\npublic class Test {\n  public static void Main(string[]\
  \ args) {\n      DoIt(1,2,3,4);\n\n  }\n  private static void DoIt(params int[]\
  \ list) {\n    foreach(int i in list)\n      Console.WriteLine(i);\n  }\n}\n```\n\
  \n## 4.5. 字段\n\n字段维护对象的状态。第 7 章 讨论了字段允许的数据类型。以下字段使用准则取自 Visual Studio 帮助文件：\n\n\
  *   不要使用 `public` 或 `protected` 的实例字段。如果你避免直接向开发人员暴露字段，类可以更容易地进行版本控制，因为字段无法在保持二进制兼容性的同时更改为属性。考虑为字段提供\
  \ `get` 和 `set` 属性访问器，而不是将它们设为公共。`get` 和 `set` 属性访问器中存在可执行代码，允许后续改进，例如在属性使用时按需创建对象，或在属性更改通知时进行改进。以下代码示例说明了正确使用带有\
  \ `get` 和 `set` 属性访问器的私有实例字段。\n\n    ```csharp\n    public struct Point\n    {\n\
  \      private int xValue;\n      private int yValue;\n\n      public Point(int\
  \ x, int y)\n      {\n        this.xValue = x;\n        this.yValue = y;\n     \
  \ }\n\n      public int X\n      {\n        get\n        {\n          return xValue;\n\
  \        }\n        set\n        {\n          xValue = value;\n        }\n     \
  \ }\n      public int Y\n      {\n        get\n        {\n          return yValue;\n\
  \        }\n        set\n        {\n          yValue = value;\n        }\n     \
  \ }\n    }\n    ```\n\n*   使用返回字段值的 `protected` 属性将字段暴露给派生类。以下代码示例说明了这一点。\n\n  \
  \  ```csharp\n    public class Control: Component\n    {\n      private int handle;\n\
  \      protected int Handle\n      {\n        get\n        {\n          return handle;\n\
  \        }\n      }\n    }\n    ```\n\n*   建议在值为全局常量时使用只读静态字段而不是属性。以下代码示例说明了此模式。\n\
  \n    ```csharp\n    public struct Int32\n    {\n      public static readonly int\
  \ MaxValue = 2147483647;\n      public static readonly int MinValue = 2147483648;\n\
  \      // 在此处插入其他成员。\n    }\n    ```\n\n*   拼写出字段名称中使用的所有单词。仅在开发人员普遍理解的情况下才使用缩写。不要对字段名称使用大写字母。以下是正确命名字段的示例。\n\
  \n    ```csharp\n    class SampleClass\n    {\n      string url;\n      string destinationUrl;\n\
  \    }\n    ```\n\n*   不要对字段名称使用匈牙利命名法。好的名称描述语义，而不是类型。\n\n*   不要对字段名称或静态字段名称应用前缀。具体来说，不要对字段名称应用前缀以区分静态和非静态字段。例如，应用\
  \ `g_` 或 `s_` 前缀是不正确的。\n\n*   对于预定义对象实例，使用公共静态只读字段。如果对象有预定义实例，请将它们声明为对象本身的公共静态只读字段。使用\
  \ Pascal 大小写，因为字段是公共的。以下代码示例说明了正确使用公共静态只读字段。\n\n    ```csharp\n    public struct\
  \ Color\n    {\n      public static readonly Color Red = new Color (0×0000FF);\n\
  \      public static readonly Color Green = new Color (0×00FF00);\n      public\
  \ static readonly Color Blue = new Color (0×FF0000);\n      public static readonly\
  \ Color Black = new Color (0×000000);\n      public static readonly Color White\
  \ = new Color (0×FFFFFF);\n\n      public Color(int rgb)\n      { // 在此处插入代码。}\n\
  \      public Color(byte r, byte g, byte b)\n      { // 在此处插入代码。}\n\n      public\
  \ byte RedValue\n      {\n        get\n        {\n          return Color;\n    \
  \    }\n      }\n      public byte GreenValue\n      {\n        get\n        {\n\
  \          return Color;\n        }\n      }\n      public byte BlueValue\n    \
  \  {\n        get\n        {\n          return Color;\n        }\n      }\n    }\n\
  \    ```\n\n以下关键字通常与字段一起使用。\n\n### 4.5.1. `public`\n\n公共字段与公共方法一样，可被任何类访问。强烈不鼓励使用公共静态或实例字段。\n\
  \n### 4.5.2. `private`\n\n私有字段只能被类的内部成员访问。私有字段可以在对象级别（实例）或类级别（静态）定义。\n\n### 4.5.3.\
  \ `protected`\n\n类的受保护字段可被该类的子类访问。\n\n### 4.5.4. `internal`\n\n内部字段可被同一程序集内的类访问。\n\
  \n### 4.5.5. `const`\n\n`const` 关键字用于修改字段或局部变量的声明。它指定字段或局部变量的值不能被修改。`const` 可以是以下任何类型：`byte`、`char`、`short`、`int`、`long`、`float`、`double`、`decimal`、`bool`、`string`、`enum`\
  \ 类型或引用类型。引用类型的常量唯一可能的值是 `string` 和 `null`。`const` 字段不能是 `static`。\n\n清单 4.13 展示了\
  \ `const` 的用法。请注意，允许多个 `const` 声明，并且 `const` 可以在表达式中使用。\n\n### 清单 4.13. 使用 `const`\
  \ 关键字 (C#)\n\n```csharp\nusing System;\npublic class Test {\n\n  public static void\
  \ Main(string[] args) {\n    const int a = 12;\n    const string b = \"Jack\";\n\
  \    const int c = a *2;\n\n    Modify (a, b);\n    Console.WriteLine(a+\" \"+b);\n\
  \    Console.WriteLine(c);\n  }\n  private static void Modify(int a, string b) {\n\
  \    a = 4;\n    b = \"John\";\n  }\n}\n```\n\n\n\n\n\n注意，当我们尝试第二次给常量赋值时（在`Modify`方法中），编译器不会报错。在\
  \ Java 中，模拟`const`的标准方式是将`const`声明为`final`。虽然`final`基本类型与 C#的`const`相似，但`final`对象引用与\
  \ C#的`const`并不相同。在 C#中，常量引用的有效值只能是`null`和字符串字面量。\n\nJava 的情况则不同。你可以声明一个`final`的`HashMap`，并在程序稍后初始化该`HashMap()`，如下方的\
  \ Java 代码片段所示。同时请注意，与 C#不同，当你尝试重新赋值一个`final`基本类型时，Java 编译器会报错。\n\n```\nimport java.util.HashMap;\n\
  public class ConstantTest {\n  public static void main(String[] args) {\n    final\
  \ HashMap map = new HashMap();\n    map.put(\"1\", \"1\");\n    final int java =\
  \ 2;\n    //java = 3;\n    System.out.println(java);\n    System.out.println(map);\n\
  \  }\n}\n```\n\n#### 4.5.6. `readonly`\n\n标记为`readonly`的字段表现出与 Java `final`字段相似的行为。`readonly`关键字是一个可用于字段的修饰符。当字段声明包含`readonly`修饰符时，对该声明引入的字段的赋值只能作为声明的一部分或在同一类的构造函数中进行。\n\
  \n你只能在以下上下文中为`readonly`字段赋值：\n\n*   当变量在声明中初始化时——例如：\n\n    ```\n    public readonly\
  \ int y = 5;\n    ```\n\n*   对于实例字段，在包含该字段声明的类的实例构造函数中；或者对于静态字段，在包含该字段声明的类的静态构造函数中。这些也是将`readonly`字段作为`out`或`ref`参数传递的唯一有效上下文。\n\
  \n在合格上下文之外尝试重新赋值`readonly`字段将导致类似于 Java 的编译器错误。清单 4.14 展示了`readonly`字段的使用。\n\n#####\
  \ 清单 4.14\\. 使用`readonly`关键字定义字段（C#）\n\n|  \n\n```\nusing System;\nclass Direction\
  \ {\n  int north;\n  int south;\n  int east;\n  int west;\n  public Direction (int\
  \ north, int south, int east, int west) {\n      this.north = north;\n      this.south\
  \ = south;\n      this.east = east;\n      this.west = west;\n  }\n      public\
  \ static readonly Direction North;\n      public static readonly Direction South;\n\
  \      public static readonly Direction East;\n      public static readonly Direction\
  \ West;\n  static Direction () {\n      North = new Direction(1,0,0,0);\n      South\
  \ = new Direction(0,1,0,0);\n      East = new Direction(0,0,1,0);\n      West =\
  \ new Direction(0,0,0,1);\n  }\n  static void Main(string[] args) {\n      Direction\
  \ coor = Direction.North;\n  }\n}\n```\n\n |\n\n注意，`readonly`字段是在静态构造函数中初始化的。\n\n\
  #### 4.5.7. `static`\n\n静态字段适用于整个类的对象，而不仅仅是特定对象的局部。在 C#中，强烈不鼓励使用公共静态字段。相反，应该使用公共属性（如第\
  \ 4.6 节所述）。\n\n#### 4.5.8. `volatile`\n\n`volatile`关键字表示一个字段可以被操作系统、硬件或并发执行的线程等在程序中修改。\n\
  \n### 4.6\\. 属性\n\n属性就像智能字段。属性通常有一个私有数据成员以及访问器函数，并在语法上作为类的字段进行访问。虽然属性可以有各种访问级别，但最常见和有用的访问级别是`public`访问。你应该从组件中公开属性而不是公共字段。属性可以进行版本控制，它们允许数据隐藏，并且访问器方法可以执行额外的逻辑。通常，由于\
  \ JIT 优化，属性的开销并不比字段大。属性相对于其他属性应该是无状态的。它们可以按任何顺序设置。属性在第 17 章中有进一步讨论。\n\n以下关键字适用于属性：\n\
  \n*   `public`。公共属性可被任何类访问。这是属性最常见的用法。属性通常是公共的，封装了更私有的字段。\n\n*   `private`。属性也可以是私有的。这种访问修饰符对属性来说很少有意义，但以防你需要私有属性时存在。\n\
  \n*   `protected`。属性可以是受保护的，在这种情况下，它们仅对该类的成员及其子类可用。\n\n*   `internal`。内部属性对程序集中的任何类都可用。\n\
  \n*   `override`。当子类选择重写属性时，它在属性定义前使用`override`修饰符。\n\n*   `new`。当子类选择隐藏超类的属性实现时，它在属性定义前使用`new`修饰符。\n\
  \n*   `abstract`。没有为`get`或`set`或两者提供实现的属性被认为是抽象的，此类属性应在抽象类中定义。\n\n*   `static`。属于对象类而不是特定对象实例的属性称为静态属性。\n\
  \n#### 4.6.1\\. 继承与属性\n\n属性包装了一个 getter 和一个 setter，因此应用于属性的访问修饰符适用于属性的`get`和`set`块。子类可以选择继承、隐藏或重写超类的属性。子类可以继承公共、受保护和内部属性。它不能继承超类的私有属性。隐藏超类属性实现的子类使用`new`关键字。如果超类缺少\
  \ getter 或 setter，这样的子类可以为该属性提供 getter 或 setter。因此，从技术上讲，子类可以使用`new`关键字将只读的超类属性转换为可变属性。\n\
  \n虚拟属性就像虚拟方法。它可以被子类重写。如果超类没有提供额外的`get`或`set`块，重写的属性就不能提供它们。也就是说，子类只能重写超类已经提供的行为，而不能添加新的行为。\n\
  \n密封属性遵循与密封方法相同的规则。密封属性通常允许超类的属性实现被重写，但不允许子类重写其密封属性。\n\n清单 4.15 展示了一个由子类定义的`abstract`属性。注意，子类不能为该属性提供\
  \ setter。\n\n##### 清单 4.15\\. 属性继承 C#\n\n|  \n\n```\nusing System;\nabstract class\
  \ SuperClass {\n  public abstract int Color {\n    get;\n  }\n}\nclass SubClass\
  \ : SuperClass {\n\n  int color;\n  public override int Color {\n    get {\n   \
  \   return color;\n    }\n  }\n  static void Main(string[] args) {\n    SubClass\
  \ sc = new SubClass();\n    Console.WriteLine(sc.Color);\n  }\n}\n```\n\n |\n\n\
  ### 4.7\\. 变量作用域\n\n在 C#中，局部变量只能被赋予那些允许它们在作用域内被唯一标识的名称。以下代码说明了变量作用域：\n\n```\nusing\
  \ System;\npublic class Test {\n  public static void Main(string[] args) {\n   \
  \ int i = 4;\n    for (int j = 0; j < 10; ++j) {\n      int i = 6 *j;\n    }\n \
  \ }\n}\n```\n\n如果你复制并粘贴此代码片段，编译器将报错，提示如下：\n\n> 无法在此作用域中声明名为'i'的局部变量，因为这会赋予'i'不同的含义，而'i'已经在'父级或当前'作用域中用于表示其他内容。\n\
  \n这个限制对 Java 程序员来说是新的，因为这段代码在 Java 中可以正常编译和运行。\n\n\n\n\n尽管创建具有相同变量名的嵌套作用域很容易，但这是一种不良实践。对于代码片段来说，缺乏可读性可能不是问题，但在大型项目中可能会令人抓狂。C#\
  \ 已采取措施来阻止这种做法，不允许使用相同的变量名。这并不意味着你不能使用类似以下的代码：\n\n```csharp\nusing System;\npublic\
  \ class Person {\n  string name;\n  int age;\n  public Person (string name, int\
  \ age) {\n    this.name = name;\n    this.age = age;\n  }\n}\n```\n\n在这里，`name`\
  \ 和 `age` 变量使用 `this` 关键字进行限定，编译器可以识别。\n\n在 C# 中，方法变量或类变量在访问之前必须初始化。因此，以下类无法编译：\n\
  \n```csharp\nusing System;\npublic class Test {\n  public static void Main(string[]\
  \ args) {\n    int n;\n    Console.WriteLine(\"Value of n is \", n);\n  }\n}\n```\n\
  \n这是因为局部变量 `n` 未初始化。类变量会假定一个默认值。在以下代码中，`int n` 的默认值为 0：\n\n```csharp\nusing System;\n\
  public class Test {\n  int n;\n  public static void Main(string[] args) {\n    Test\
  \ t = new Test();\n    Console.WriteLine(\"Value of n is \", t.n);\n  }\n}\n```\n\
  \n你不必在访问数组和结构体之前初始化它们。\n\n### 4.8. 对象销毁\n\n如 第 1 章 所述，Java 和 C# 提供自动垃圾回收。因此，分配在内存中的对象由运行时环境回收，无需程序员进行任何特殊编码。仅此一项就使得在\
  \ Java 和 C# 中编程比在 C++ 中更容易。然而，程序员需要了解一些内存管理和垃圾回收的知识，以避免犯下阻碍垃圾回收过程的错误。\n\n`java.lang.Object`\
  \ 类提供了一个 `finalize()` 方法，该方法在垃圾回收期间被调用。你无法控制此调用的顺序和时机。尽管如此，Java 程序员倾向于不使用终结器进行内存管理，原因如下：\n\
  \n*   通常不需要显式内存管理，因为责任通常在于智能垃圾回收器。\n\n*   有更好的构造来处理内存，例如软引用、弱引用。\n\n*   短期资源释放在\
  \ `try-finally` 块中处理。\n\n在内存管理方面，C# 也不例外。尽管你可以在析构函数中调用 `extern` DLL 来回收内存，但这种编码实践是例外而非常规。有时你需要更及时地释放非基于内存的资源。完全不建议在\
  \ `finalize()` 方法中释放此类资源。也不应在析构函数中释放这些资源（文件句柄、数据库连接）。在 Java 中，资源通常在 `finally` 块中释放：\n\
  \n```java\nResource res = null;\ntry {\n  res = getResource();\n} finally {\n  freeResource(res);\n\
  }\n```\n\nC# 提供了类似的范式，并通过 `IDisposable` 接口进一步促进了资源的释放。`IDisposable` 接口提供了一个 `Dispose()`\
  \ 方法，类可以通过该方法释放资源。清单 4.16 展示了一个实现 `IDisposable` 接口的类。\n\n#### 清单 4.16. 使用 `IDisposable`\
  \ 接口\n\n```csharp\nusing System;\nusing System.Runtime.InteropServices;\npublic\
  \ class DatabaseWrapper : IDisposable {\n\n  int handle = 0;\n  public DatabaseWrapper()\
  \ {\n    handle = GetNewHandle();\n  }\n  public void Dispose() {\n    FreeHandle(handle);\n\
  \    GC.SuppressFinalize(this);\n  }\n  [DllImport(\"dll.dll\")]\n  static extern\
  \ int GetNewHandle();\n  [DllImport(\"dll.dll\")]\n  static extern void FreeHandle(int\
  \ handle);\n  static void Main(string[] args) {\n    DatabaseWrapper dw = null;\n\
  \    try {\n      dw = new DatabaseWrapper();\n    } finally {\n      dw.Dispose();\n\
  \    }\n  }\n}\n```\n\nC# 还提供了 `using` 构造，让你可以避免使用 `try-finally` 块。因此，\n\n```csharp\n\
  using (DatabaseWrapper dw = new DatabaseWrapper()) {\n//在此处使用 dw 对象执行操作\n}\n```\n\
  \n`using` 块将负责正确调用 `Dispose()` 方法。\n\n### 4.9. 总结\n\n本章讨论了对象创建，并将 `System.Object`\
  \ 与 `java.lang.Object` 进行了比较。我们还了解了类成员，如方法、构造函数、字段和属性及其访问修饰符。以下是总结：\n\n*   公共类成员可被所有类访问。\n\
  \n*   私有类成员只能被该类访问。\n\n*   受保护成员可被该类及其子类访问。\n\n*   内部成员可被该程序集中的所有类访问。\n\n*   静态成员在类级别定义，不需要对象实例引用来访问它们。实际上，在\
  \ C# 中，你不能使用实例引用来调用静态方法。\n\n*   抽象方法和属性必须位于抽象类中。如果子类不是抽象的，则必须重写抽象方法和属性。\n\n*   密封方法和属性允许你重写虚方法和属性，但子类不能进一步重写密封方法和属性。你不能从密封类派生。\n\
  \n*   与 Java 不同，C# 中的方法和属性默认是非虚的。子类可以选择继承、隐藏或重写超类的方法和属性。\n\n*   你可以使用 `new` 关键字来隐藏方法和属性。\n\
  \n*   你可以使用 `override` 关键字来重写方法和属性。\n\n*   属性上的访问修饰符适用于 `set` 和 `get` 块。隐藏超类属性的子类可以在超类中缺少一个的情况下提供额外的\
  \ `get` 和 `set` 块。重写超类属性的子类不能在超类中缺少一个的情况下提供额外的 `get` 或 `set` 块。\n\n*   如果类中没有显式提供默认无参构造函数，C#\
  \ 会提供一个。\n\n*   局部变量在使用前必须初始化。类变量、引用和数组在使用前无需初始化。\n\n*   不鼓励使用终结器和析构函数来释放外部资源。\n\
  \n*   你可以通过使用 `IDisposable` 接口来一致地释放外部资源。\n\n## 第 5 章. 理解继承和多态\n\n本章深入探讨类继承和多态。你将了解基类和派生类对象引用的行为。在本章中，你将使用\
  \ 第 4 章 中讨论的访问修饰符来实际建模类。\n\n### 5.1. 继承\n\n继承允许一个类扩展和重用其祖先类（超类）中定义的行为。Java 和 C#\
  \ 仅支持单类继承，即一个给定的类只能从另一个类继承。这与 C++ 形成对比，C++ 允许一个类从多个类继承行为。\n\n继承在子类和超类之间创建了一种 is-a\
  \ 关系；换句话说，子类是超类的一种类型。由于 Java 和 C# 中的单类继承，你必须谨慎选择从哪个类继承你的类。例如，如果你有一个自定义的类似映射的数据结构，你应该从\
  \ `java.util.HashMap` 继承吗？这样做会立即使你的数据结构成为一个 `java.util.HashMap`，但假设将来你想维护你放入映射中的键值条目的顺序。在这种情况下，你将需要重写你的类，因为\
  \ `java.util.HashMap` 不维护键值条目放入其中的顺序。\n\n\n\n\n继承是一种利用和扩展现有代码库的有用机制。具体哪些类成员可以从超类继承，取决于其类成员上使用的访问修饰符。本章稍后我们将探讨控制继承机制的\
  \ C# 访问修饰符。\n\n### 5.2. 多态与虚方法\n\n顾名思义，多态是指具有多种（poly）形态（morphs）的能力。在面向对象编程语言的语境中，这意味着一个类的方法的行为可以在运行时根据调用它的对象而改变。在第\
  \ 4 章中，你学习了对象引用和实例的概念。引用是指向实际实例的指针。在面向对象编程中，你可以持有一个超类的引用，并将子类的实例赋值给该引用：\n\n```\n\
  Shape s = new Circle();\ns.draw();\n```\n\n这里，`Shape` 是一个超类，有一个子类 `Circle`。`Shape`\
  \ 类中有一个 `draw()` 方法，`Circle` 类中也有一个 `draw()` 方法。当你在引用 `s` 上调用 `draw()` 方法时，它实际上调用的是哪个类的方法？是调用\
  \ `Shape` 类的 `draw()` 方法，还是调用 `Circle` 类的 `draw()` 方法？在 Java 中，被实例化对象的 `draw()`\
  \ 方法会被调用——换句话说，是 `Circle` 类的 `draw()` 方法。在 C# 中，取决于超类方法是否有 `virtual` 关键字以及子类的相同方法是否有\
  \ `override` 关键字，`Circle` 类的 `draw()` 方法将被调用。\n\n类似地，你可以有 `Shape` 类的几个其他子类，每个子类都有自己的\
  \ `draw()` 方法实现。根据语言实现的多态机制，各个子类的 `draw()` 方法将被调用。最终效果是，相同的方法调用 `draw()` 在运行时具有多种行为。\n\
  \n运行时如何知道即使引用是 `Shape` 类的，也必须调用 `Circle` 类上的方法？所有这些魔法都可以归因于后期绑定（也称为动态绑定）和虚方法的机制。\n\
  \n将函数调用连接到函数体称为绑定。如果在程序运行之前（由编译器和链接器）执行绑定，则称为早期绑定或静态绑定。如果在运行时基于调用方法的对象类型执行绑定，则称为后期绑定或动态绑定。\n\
  \n当一种语言实现后期绑定时，必须有一种机制在运行时确定对象的类型并调用相应的成员函数。在编译语言中，编译器仍然不知道实际的对象类型，但它会插入代码来找出对象类型并调用正确的函数体。后期绑定机制因语言而异，但你可以想象，某种类型信息必须安装在对象中。\n\
  \n为了实现这一点，典型的编译器为每个包含虚方法的类创建一个表（称为 VTABLE）。编译器将该特定类的虚函数的地址放在 VTABLE 中。在每个具有虚函数的类中，编译器秘密地放置一个指针，称为\
  \ vpointer（缩写为 VPTR），它指向该对象的 VTABLE。当你通过基类指针进行虚函数调用（即进行多态调用）时，编译器会悄悄地插入代码来获取 VPTR\
  \ 并在 VTABLE 中查找方法地址，从而调用正确的方法并导致后期绑定发生。\n\n后期绑定总是比静态绑定慢，因为运行时必须进行额外的发现来找到对象的类型。考虑到这一点，让我们探讨\
  \ C# 和 Java 中的继承和多态。\n\n### 5.3. 探索 C# 多态\n\n假设我们正在为一家零售书店进行一些书籍利润的统计预测。在进行图形用户界面和后端数据库工作之前，我们为这个假想的应用程序建模核心组件。`Book`\
  \ 类似乎是一个显而易见的起点。清单 5.1 展示了 `Book` 类。\n\n##### 清单 5.1. `Book` 类 (C#)\n\n```\npublic\
  \ class Book {\n\n  protected string isbn;\n  protected float costprice;\n  protected\
  \ int copiessold;\n  protected float sellingprice;\n  protected float popularityfactor;\n\
  \n  public Book (string isbn, float costprice,\n      float sellingprice, int copiessold,\
  \ float popularityfactor)\n  {\n    this.isbn = isbn;\n    this.costprice = costprice;\n\
  \    this.sellingprice = sellingprice;\n    this.copiessold = copiessold;\n    this.popularityfactor\
  \ = popularityfactor;\n  }\n\n  public float EstimatedProfit() {\n    return TheoreticalProfit()\
  \ * popularityfactor;\n  }\n\n  protected float TheoreticalProfit() {\n    return\
  \ (sellingprice - costprice) * copiessold;\n  }\n\n  public string GetGenre() {\n\
  \    return \"Book\";\n  }\n\n  //static void Main(string[] args) {}\n}\n```\n\n\
  从这个第一个实现中可以观察到以下几点：\n\n*   `Book` 类被声明为 `public`。因为这个类是应用程序的核心组件，所以该类对应用程序的所有部分都是可访问的，这是合理的。`Book`\
  \ 类具有以下字段：`isbn`、`costprice`、`sellingprice`、`copiessold` 和 `popularityfactor`。这些字段都是\
  \ `protected` 的。我们预计子类将需要访问这些字段来进行各种计算。\n\n*   大多数方法是 `public` 的，除了 `TheoreticalProfit()`\
  \ 方法，它是 `protected` 的。\n\n*   `GetGenre()` 方法目前硬编码为返回字符串 `\"Book\"`。\n\n清单 5.2 展示了\
  \ `Book` 类的一个子类。\n\n##### 清单 5.2. `Book` 类的子类 (C#)\n\n```\npublic class RomanceNovel\
  \ : Book {\n\n  public RomanceNovel (string isbn, float costprice,\n         float\
  \ sellingprice, int copiessold,\n            float popularityfactor) :base (isbn,\n\
  \               costprice, sellingprice, copiessold,\n                         \
  \                     popularityfactor) {\n  }\n\n  public float EstimatedProfit()\
  \ {\n\n    if (popularityfactor < 0.5f) {\n      return TheoreticalProfit() * (1-popularityfactor);\n\
  \    } else {\n      return TheoreticalProfit() * (1-popularityfactor);\n    }\n\
  \  }\n  public string GetGenre() { return \"Romance\"; }\n}\n```\n\n方法 `TheoreticalProfit()`\
  \ 和字段是 `protected` 的，以便子类可以使用它们。请注意，子类使用 `base` 关键字调用超类构造函数。清单 5.3 展示了将作为入口点的驱动类。\n\
  \n##### 清单 5.3. 清单 5.1 和 5.2 的入口点 (C#)\n\n```\nusing System;\n\npublic class BookTest\
  \ {\n\n  static void Main(string[] args) {\n    Console.WriteLine(\"Reference =\
  \ Book, Object = Book\");\n    Book book = new Book(\"85745\", 45.6f, 65.5f, 200,\
  \ 0.2f);\n    Console.WriteLine(book.EstimatedProfit());\n    Console.WriteLine(\"\
  Reference = RomanceNovel,\n                                       Object = RomanceNovel\"\
  );\n    RomanceNovel novel = new RomanceNovel(\"85745\", 45.6f,\n              \
  \                               65.5f, 200, 0.2f);\n    Console.WriteLine(novel.EstimatedProfit());\n\
  \    Console.WriteLine(\"Reference = Book, Object = RomanceNovel\");\n    book =\
  \ new RomanceNovel(\"85745\", 45.6f, 65.5f, 200, 0.2f);\n    Console.WriteLine(book.EstimatedProfit());\n\
  \  }\n\n}\n```\n\n清单 5.3 的输出如下：\n\n\n\n\n\n```\n引用 = Book，对象 = Book\n调用 Book 类的构造函数\n\
  调用 Book 类的 EstimatedProfit 方法\n796.0001\n\n引用 = RomanceNovel，对象 = RomanceNovel\n\
  调用 Book 类的构造函数\n调用 RomanceNovel 类的构造函数\n调用 RomanceNovel 类的 EstimatedProfit 方法\n\
  3184\n\n引用 = Book，对象 = RomanceNovel\n调用 Book 类的构造函数\n调用 RomanceNovel 类的构造函数\n调用\
  \ Book 类的 EstimatedProfit 方法\n796.0001\n```\n\n第一个示例使用一个`Book`引用，并将一个`Book`对象赋值给它。因此，`Book`的构造函数被调用，`Book`的`EstimatedProfit()`方法也被调用。这没什么意外。\n\
  \n第二个示例将一个`RomanceNovel`对象赋值给一个`RomanceNovel`引用。`RomanceNovel`构造函数首先调用超类构造函数。`RomanceNovel`类的`EstimatedProfit()`方法被调用。到目前为止，行为与\
  \ Java 类似。\n\n第三个示例让 Java 程序员感到惊讶并想知道发生了什么。引用是`Book`类的，但创建的对象是`RomanceNovel`的；Java\
  \ 基础表明被调用的方法（`EstimatedProfit`）应该在实例化的对象上，而不是在赋值给它的引用上。\n\n这种明显差异的原因是，所有 C#方法默认都是非虚拟的。Java\
  \ 方法默认是虚拟的，这意味着虚拟分派机制将调用实例化对象上的方法，而不是赋值给它的引用上的方法。C#则不是这样。`EstimatedProfit()`方法不是虚拟的，因此被调用的方法将是在引用上。要获得类似\
  \ Java 的行为，你需要将`book`引用强制转换为`RomanceNovel`引用，然后在这个新引用上调用该方法：\n\n```\nRomanceNovel\
  \ rm = (RomanceNovel) book;\nrm.EstimatedProfit();\n```\n\n与 Java 不同，C#并不假设子类总是能够覆盖超类的方法。如前面章节所述，子类可以选择原样继承超类实现、隐藏实现或覆盖它。正如你从这个令人震惊的例子中看到的，默认行为是，子类在没有明确这样做时既不会隐藏也不会覆盖超类实现（稍后会详细介绍）。\n\
  \nC#和 Java 之间的这个重要差异有什么影响？假设你有一个`Account`对象数组，你通过将它们全部赋值给`Account`引用来进行泛型处理。`Account`类有一个方法`CalculateBalance`，对于所有类型的账户都保持不变。`Account`类和该方法多年来一直运行完美，一切顺利。现在假设有人决定为你宝贵的`Account`类编写一个子类。开发者覆盖了`CalculateBalance()`的实现，并编写了该方法的一个损坏版本。现在，仅仅因为一个子类决定改变做事的方式，你的应用程序在多年的一致性后突然表现不同。这个例子可能看起来牵强，但它始终是一种可能性。\n\
  \nC#和 Java 都是 C++语言的衍生品。C++有`virtual`关键字，用于表示显式虚拟分派。C#在这方面更接近 C++。在 Java 中，所有方法默认都是虚拟和多态的。这使得扩展更容易，但也更慢，因为后期绑定的虚拟方法调用通常比早期绑定的非虚拟方法调用慢。\n\
  \n### 5.3.1 使用`virtual`和`override`关键字\n\n在 OOP 中，`virtual`关键字意味着当对方法进行调用时，编译器应该查看对象的真实类型（而不仅仅是引用），然后应该在对象上调用适当的方法。为了激活`virtual`分派，我们现在在清单\
  \ 5.1 中添加`virtual`关键字，并在子类中添加`override`关键字，如清单 5.4 和 5.5 所示。\n\n#### 清单 5.4 带有`virtual`关键字的清单\
  \ 5.1 (C#)\n\n```\nusing System;\n\npublic class Book {\n\n  private string isbn;\n\
  \  protected float costprice;\n  protected int copiessold;\n  protected float sellingprice;\n\
  \  protected float popularityfactor;\n\n  public Book (string isbn, float costprice,\
  \ float sellingprice,\n                        int copiessold, float popularityfactor)\
  \ {\n    this.isbn = isbn;\n    this.costprice = costprice;\n    this.sellingprice\
  \ = sellingprice;\n    this.copiessold = copiessold;\n    this.popularityfactor\
  \ = popularityfactor;\n    Console.WriteLine(\"Calling Constructor of Book class\"\
  );\n  }\n\n  public virtual float EstimatedProfit() {\n    Console.WriteLine(\"\
  Calling EstimatedProfit of Book class\");\n    return TheoreticalProfit() * popularityfactor;\n\
  \  }\n\n  protected float TheoreticalProfit() {\n    return (sellingprice  costprice)*copiessold;\n\
  \  }\n\n  public string GetGenre() {\n    return \"Book\";\n  }\n}\n```\n\n####\
  \ 清单 5.5 带有`override`关键字的清单 5.2 (C#)\n\n```\nusing System;\n\npublic class RomanceNovel\
  \ : Book {\n\n  public RomanceNovel (string isbn, float costprice,\n         float\
  \ sellingprice, int copiessold,\n            float popularityfactor) : base (isbn,\n\
  \               costprice, sellingprice, copiessold,\n                         \
  \                     popularityfactor) {\n\n    Console.WriteLine(\"Calling Constructor\
  \ of RomanceNovel class\");\n  }\n\n  public override float EstimatedProfit() {\n\
  \    Console.WriteLine(\"Calling EstimatedProfit of RomanceNovel\n             \
  \                                           class\");\n    if (popularityfactor\
  \ < 0.5f) {\n      return TheoreticalProfit() * (1-popularityfactor);\n    } else\
  \ {\n      return TheoreticalProfit() * (1-popularityfactor);\n    }\n  }\n\n  public\
