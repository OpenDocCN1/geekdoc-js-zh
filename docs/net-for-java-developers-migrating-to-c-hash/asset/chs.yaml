  \ Manager\nToms Spezialitäten                Marketing Manager\nDie Wandernde Kuh\
  \                 Sales Representative\n————\nCustomer ID                      \
  \ Company Name\nAlfreds Futterkiste               Maria Anders\nBlauer See Delikatessen\
  \           Hanna Moos\nDrachenblut Delikatessen          Sven Ottlieb\nFrankenversand\
