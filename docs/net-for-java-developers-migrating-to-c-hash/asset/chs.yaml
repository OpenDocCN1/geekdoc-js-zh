  State of the cop \"+cop2.GetState());\n  }\n}\n```\n\n有两个 `Cop` 类，每个类都向 `Robber`\
  \ 线程发出 `Abort` 或 `Suspend` 信号。`Robber` 类的 `Terminate()` 方法被编码为检查底层线程是否已被挂起。这样做可以防止攻击者\
  \ `Cop` 向已被非攻击者 cop 挂起的线程发出 `Abort` 信号。这可以防止任何 `Robber` 线程同时处于 `AbortRequested`\
  \ 和 `Suspended` 状态。\n\n表 16.5 比较了关键的 Java 线程方法及其在 C# 中的等效方法。\n\n表 16.5 中的方法表明，C#\
  \ 的 `Thread` 类与 Java 类没有太大区别。事实上，Java 线程 `stop()` 方法的问题在 C# 中同样普遍存在。\n\n表 16.5.\
  \ Java 和 C# 中的关键线程方法\n\n| Java | C# | 描述 |\n| --- | --- | --- |\n| `Interrupt` |\
  \ `Interrupt` | 在 Java 中，这会将线程置于中断状态。在 C# 中，这会中断线程，但不会将其置于中断状态。如果在 C# 中调用此方法时线程未阻塞，则线程将在开始阻塞时被中断。\
  \ |\n| `Suspend` | `Suspend` | 功能相同：C# 方法表现出与 `java.lang.Thread` 中 `suspend()` 方法被弃用相同的特性。此方法容易导致死锁：如果持有系统关键资源锁的线程被挂起，则在该线程恢复之前，其他线程无法访问该资源。\
  \ |\n| `Resume` | `Resume` | 功能相同。 |\n| `Sleep` | `Sleep` | 在 C# 和 Java 中，sleep\
  \ 调用是重载的。在 C# 中，此方法将线程置于 `WaitSleepJoin` 状态。 |\n| `Join` | `Join` | 与 Java 的 join\
  \ 方法（仅是超时）不同，C# 版本在终止时返回一个布尔值，表示线程是死亡（`true`）还是超时已过（`false`）。 |\n\n### 16.3. 在 C#\
  \ 中安全地停止线程\n\n\n\n\n\nJava 的 `stop` 方法已被弃用，因为调用它时，一个未检查的 `java.lang.ThreadDeath`\
  \ 错误会沿着运行线程的调用栈向上传播，并在此过程中解锁任何已锁定的监视器。由于这些锁被不加区分地释放，它们所保护的数据可能会处于不一致的状态。同样的问题也适用于\
  \ C# 的 `Abort` 方法。因此，在 C# 中停止线程的推荐方式不是通过 `Abort` 方法。相反，推荐的方式是使用一个状态变量，另一个线程可以用它来向当前线程发出“该终止了”的信号。另一种方式是让一个线程自然运行完毕。\n\
  \n在前面的示例中，为了说明各种 C# 方法，我们使用了 `Abort` 方法来发出终止线程的信号。但我们建议您不要使用 `Abort` 方法来手动终止线程。更好的做法是，正如我们将要解释的，您应该避免手动创建线程，从而避免这个问题。\n\
  \n使用 `System.Threading.Thread` 类手动创建线程可以提供最大的灵活性，因为线程创建者可以设置线程的各种属性。然而，创建者必须确保创建的线程不会侵占系统资源，因此必须提供监控和管理线程的方法。此外，如前所述，许多应用程序创建的线程会花费大量时间处于休眠状态，等待事件发生。其他线程可能进入休眠状态，只是为了定期被唤醒以轮询变化或更新状态信息。\n\
  \n以下是关于何时使用和不使用 `System.Threading.Thread` 类创建线程的大致指导原则。\n\n在以下情况下，您应该使用手动创建的线程：\n\
  \n*   当您需要对线程进行更精细的控制以完成一项任务时\n\n*   用于粗粒度的任务，这些任务又会监控其他异步的、“批量的”细粒度任务\n\n*   用于长时间运行的异步任务\n\
  \n在以下情况下，您不应该使用手动创建的线程：\n\n*   用于处理批量的、细粒度的、短时运行的任务（例如，服务 10,000 个请求）\n\n*   用于处理重复的、时间控制的任务，对于这些任务，`System.Threading.Timer`\
  \ 类更合适\n\n*   用于可以封装为委托 `begininvoke` 或 `threadpool waitcallback` 的细粒度任务\n\n####\
  \ 16.3.1. 使用 `System.Threading.ThreadPool` 类创建线程\n\n如果创建的线程没有得到妥善管理，手动创建线程可能会占用系统资源。在\
  \ Java 中，维护线程生命周期的责任在于程序员。C# 通过提供一流的 `ThreadPool` 类消除了这种容易出错的方法。线程池能够更高效地使用线程，并且不需要程序员担心线程的生命周期，因为它由线程池维护。\n\
  \nC# 的 `ThreadPool` 提供了一个线程池，可用于发布工作项、处理异步 I/O、代表其他线程等待以及处理计时器。一个线程监控排队到线程池的多个等待操作的状态。当一个等待操作完成时，线程池中的一个工作线程执行相应的回调函数。\n\
  \n您也可以排队与等待操作无关的工作项。要请求线程池中的线程处理一个工作项，您可以调用 `QueueUserWorkItem` 方法。此方法接受一个参数，该参数是对将由从线程池中选择的线程调用的方法或委托的引用。工作项排队后无法取消。\n\
  \n计时器队列计时器和注册的等待操作也使用线程池。它们的回调函数被排队到线程池中。\n\n线程池在您第一次创建 `ThreadPool` 类的实例时创建。线程池的默认限制是每个可用处理器\
  \ 25 个线程，您可以使用 `CorSetMaxThreads`（在 `mscoree.h` 文件中定义）来更改此限制。每个线程使用默认堆栈大小并以默认优先级运行。每个进程只能有一个操作系统线程池。\n\
  \nListing 16.8 展示了如何使用 `ThreadPool` 类的 `QueueUserWorkItem` 方法。在线程 A 被生成并执行某些活动的场景中，通常需要线程\
  \ B（生成线程 A 的线程）知道线程 A 何时完成活动。为了在 Java 中实现这种通信，您会使用 wait/notify 机制，或者在某些情况下使用布尔标志来发出完成信号。C#\
  \ 提供了 `AutoResetEvent` 类的概念。`AutoResetEvent` 通知一个或多个等待线程某个事件已发生。`AutoResetEvent`\
  \ 保持 `signaled` 状态，直到一个等待线程被释放，此时系统自动将状态设置为 `nonsignaled`。如果没有线程在等待，状态将保持 `signaled`。\n\
  \n##### Listing 16.8. 使用 `ThreadPool` 排队回调 (C#)\n\n|  \n\n```\n using System;\n\
  using System.Threading;\n\npublic class Test {\n\n  public static void Main(string[]\
  \ args) {\n   for (int i =0; i < 50; ++i) {\n     AutoResetEvent notify = new AutoResetEvent(false);\n\
  \     ThreadPool.QueueUserWorkItem(\n     new WaitCallback(AsyncOper),false);\n\
  \     notify.WaitOne();\n   }\n  }\n\n  // The callback method's signature MUST\
  \ match that of a\n  //System.Threading.WaitCallback\n  // delegate (it takes an\
  \ Object parameter and returns void)\n\n  static void AsyncOper(Object state) {\n\
  \    Console.WriteLine(\"WorkItem thread:\n      Performing asynchronous operation.\"\
  );\n    // Sleep for 1000 milliseconds to simulate doing work\n    Thread.Sleep(1000);\n\
  \    // Signal that the async operation is now complete.\n    ((AutoResetEvent)state).Set();\n\
  \    Console.WriteLine(\"Finished the async operation\");\n  }\n\n}\n```\n\n |\n\
  \n在 Listing 16.8 中，异步调用的委托签名应与 `WaitCallBack` 委托的签名匹配。`notify.WaitOne` 会阻塞 `Main`\
  \ 线程，直到所有异步操作完成。\n\n请注意，我们向 `ThreadPool` 分派了 50 个操作，而其容量为 25 个线程。`ThreadPool` 类负责管理工作线程，我们只需要提供\
  \ `ThreadPool` 需要运行的回调方法。如果我们没有使用 `ThreadPool` 类，我们将不得不为每个分派的操作创建一个 `Thread`。如果此示例用于处理，例如，1,000\
  \ 个并发操作，这将是浪费的。\n\nListing 16.9 展示了 `Thread` 类和 `ThreadPool` 类的组合，描绘了一个有些现实的类，其中有一个\
  \ `Server` 类执行排队的作业。`Server` 本身运行一个线程，将排队的作业分配给 `ThreadPool`。一个主线程为 `Server` 入队作业。\n\
  \n##### Listing 16.9. 使用 `ThreadPool` 的 `Server` 类\n\n|  \n\n```\n using System;\n\
  using System.Collections;\nusing System.Threading;\n\npublic class Server {\n\n\
  \  public static int MAX = 1000;\n  Thread mainThread;\n  Queue jobs;\n  int dequeued\
  \ =0;\n\n  public Server() {\n    mainThread = new Thread(new ThreadStart(JobAllocate));\n\
  \    mainThread.Name = \"MyServer\";\n    jobs = new Queue();\n    mainThread.Start();\n\
  \  }\n\n  public void AddJobs(object job) {\n    lock (jobs) {\n      jobs.Enqueue(job);\n\
  \    }\n  }\n\n  public void JobAllocate() {\n    while (true) {\n      lock (jobs)\
  \ {\n          while (jobs.Count > 0) {\n            ThreadPool.QueueUserWorkItem(\n\
  \                new WaitCallback(DoJob), jobs.Dequeue());\n          }\n      }\n\
  \      if (dequeued >= MAX) break;\n    }\n  }\n\n  public void DoJob(Object state)\
  \ {\n    Console.WriteLine(\"Finished job \"+state);\n    ++dequeued;\n  }\n\n \
  \ public static void Main(string[] args) {\n    Server server = new Server();\n\
  \      for (int i = 0; i < Server.MAX; ++i) {\n        server.AddJobs(\"Job \"+i);\n\
  \      }\n  }\n}\n```\n\n |\n\n\n\n\n### 16.3.2. 使用 `System.Threading.Timer` 类创建线程\n\
  \n有时，某个活动必须在后台定期运行。例如，你的机器上运行一个脚本，每天午夜修剪应用程序日志文件的大小。你可以使用 `System.Threading.Timer`\
  \ 来创建线程，这些线程会定期运行并执行特定操作。这在功能上类似于 Java 的 `java.util.Timer` 类。\n\nListing 16.10 是我们\
  \ `Server` 类的一个略有不同的版本，它使用了 `Timer` 工具。在这里，服务器不是将作业交给线程池，而是由一个计时器线程定期执行排队的作业。\n\n\
  ##### 清单 16.10. 使用 `Timer` 工具的 `Server` 类 (C#)\n\n```\nusing System;\nusing System.Threading;\n\
  using System.Collections;\n\nclass Server {\n  Timer timer = null;\n  Queue jobs;\n\
  \n  public Server() {\n    jobs = new Queue();\n    TimerCallback timerDelegate\
  \ = new TimerCallback(DoJob);\n    timer = new Timer(timerDelegate, null, 1000,\
  \ 1000);\n  }\n\n  public int Count() {\n    lock(jobs) {\n      return jobs.Count;\n\
  \    }\n  }\n  public void Dispose() {\n      timer.Dispose();\n  }\n  public void\
  \ DoJob(object state) {\n    lock (jobs) {\n      if (jobs.Count > 0) {\n      \
  \  Console.WriteLine(\"Finished job \"+jobs.Dequeue());\n      }\n    }\n  }\n \
  \ public void AddJob(object job) {\n    lock (jobs) {\n      jobs.Enqueue(job);\n\
  \    }\n  }\n  public static void Main(string[] args) {\n    Server server = new\
  \ Server();\n    for (int i =0; i < 60; ++i) server.AddJob(\"Job \"+i);\n    while\
  \ (server.Count() > 0) {\n      Thread.Sleep(0);\n    }\n    server.Dispose();\n\
  \  }\n}\n```\n\n请注意，`timer` 在系统分配的线程上执行任务，这与 Java 的 `timer` 类类似。`Server` 在完成任务执行后会释放计时器线程。`timer`\
  \ 委托指示了需要定期执行的方法（在这种情况下，初始延迟 1 秒后，每 1 秒执行一次）。请注意，计时器启动的线程和主线程必须在作业队列上加锁，以获得可预测的结果。`timer`\
  \ 类应用于执行周期性任务。\n\n### 16.3.3. 使用异步回调创建线程\n\n`ThreadPool` 和 `Timer` 类都使用特定的回调委托作为在调用线程和执行线程之间传递信息的机制。相同的机制以通用方式为所有委托提供，可用于实现简单的异步处理（这本质上是线程编程的目标）。\n\
  \nListing 16.11 展示了如何使用一个简单的回调委托创建一个简单的异步类。回调函数可以通过将 `IAsyncResult` 转换为特定委托来获取委托的句柄。\n\
  \n##### 清单 16.11. 使用 C# 异步回调委托的 Hello World\n\n```\nusing System;\nusing System.Threading;\n\
  \npublic class MyAsyncCaller {\n\n  public delegate string MyDelegate(string s);\n\
  \n  public void MyCallback(IAsyncResult iar) {\n    MyDelegate del = (MyDelegate)\
  \ iar.AsyncState;\n    string result = del.EndInvoke(iar);\n    Console.WriteLine(result);\n\
  \  }\n\n  public void Test(MyDelegate func, string param) {\n    AsyncCallback cb\
  \ = new AsyncCallback(MyCallback);\n    func.BeginInvoke(\"World\", cb, func);\n\
  \  }\n\n  public static string SayHello(string s) {\n    return \"Hello \"+s;\n\
  \  }\n\n  static void Main(string[] args) {\n    MyAsyncCaller caller = new MyAsyncCaller();\n\
  \    caller.Test(new MyAsyncCaller.MyDelegate(SayHello),\n    \"World\");\n    Thread.Sleep(2000);\n\
  \  }\n}\n```\n\n`Main` 方法创建了 `MyAsyncCaller` 的一个实例，它是一个用于执行所有异步调用的包装类。该类的 `Test`\
  \ 方法接受委托和将传递给委托的参数。传递给 `Test` 方法的委托是 `MyAsyncCaller` 类的一个成员，名为 `MyDelegate`。传递的函数是\
  \ `SayHello` 函数，它与 `MyDelegate` 委托具有相同的签名。正是这个 `SayHello` 函数被异步调用。`AsyncCallback`\
  \ 是 C# 提供的一个委托。我们向这个委托传递我们的 `Callback` 方法，即 `MyCallback` 方法。\n\n在 `MyCallback` 方法内部，结果被转换为委托，`EndInvoke`\
  \ 本质上调用了 `SayHello` 方法。然后打印该方法的结果。因为此方法中没有同步，所以我们必须调用 `Thread.Sleep` 以确保回调在 `Main`\
  \ 结束之前执行。为了摆脱看似 hacky 的 `Thread.Sleep`，我们可以使用 `WaitHandle`，如 Listing 16.12 所示。\n\
  \n##### 清单 16.12. 使用 C# 异步回调委托和 `WaitHandle` 的 Hello World\n\n```\nusing System;\n\
  using System.Threading;\n\npublic class MyAsyncCaller {\n  public delegate string\
  \ MyDelegate(string s);\n\n  public void MyCallback(IAsyncResult iar) {\n    MyDelegate\
  \ del = (MyDelegate) iar.AsyncState;\n    string result = del.EndInvoke(iar);\n\
  \    Console.WriteLine(result);\n  }\n\n  public WaitHandle[] Test(MyDelegate func,\
  \ string param) {\n    AsyncCallback cb = new AsyncCallback(MyCallback);\n    IAsyncResult\
  \ res = func.BeginInvoke(\"World\", cb, func);\n    WaitHandle[] array = new WaitHandle[1];\n\
  \    array[0] = res.AsyncWaitHandle;\n    return array;\n  }\n\n  public static\
  \ string SayHello(string s) {\n    return \"Hello \"+s;\n  }\n  static void Main(string[]\
  \ args) {\n    MyAsyncCaller caller = new MyAsyncCaller();\n    WaitHandle[] arr\
  \ = caller.Test(new\n      MyAsyncCaller.MyDelegate(SayHello), \"World\");\n   \
  \ WaitHandle.WaitAll(arr);\n  }\n}\n```\n\n`WaitHandle.WaitAll()` 使 `Main` 线程等待，直到所有异步调用完成。\n\
  \n### 16.4. 线程同步\n\n某些编程指令保证在另一个线程 Y 正在运行它们时，永远不会被线程 X 抢占。这种原子操作具有内置的线程安全性。然而，在面向对象编程中，操作（方法调用）很少是原子的，对象的状态也很少像递增一个整数那样简单。\n\
  \n为线程安全设计的对象不允许多个线程同时更改其状态。此类对象将代码的某些部分标识为临界区，并在该代码周围放置适当的锁，以便在任何时间只有一个线程可以调用该代码块。运行该代码块要求调用线程获取一个锁，该锁阻止其他线程访问该代码。完成代码块后，调用线程会释放锁以供其他线程使用。获取锁的代码块越大，调用线程持有锁的时间就越长。\n\
  \nC# 提供了以下方式来实现线程同步：\n\n*   使用非常基本的同步原语，如 `WaitHandle`、`Mutex`、`ReaderWriterLock`\
  \ 和 `Interlocked`。这些构造可用于进程间同步。\n\n\n\n\n\n## 使用 `SynchronizedAttribute` 同步 `ContextBoundObject`\
  \ 对象\n\n使用 `SynchronizedAttribute` 可以启用 `ContextBoundObject` 对象的同步。此技术仅可用于同步实例字段和方法。同一上下文域中的所有对象共享同一个锁。\n\
  \n## 使用 `Monitor` 类\n\n这种方法更受 Java 程序员的青睐。`Monitor` 类由静态方法组成，你需要将要同步的对象传递给这些方法。C#\
  \ 提供了 `lock` 关键字。这类似于 Java 的 `synchronize` 关键字，但与 `synchronize` 不同，`lock` 关键字不能用于方法签名。程序员可以选择使用\
  \ `Monitor.Enter` 和 `Monitor.Exit` 方法，或者使用 `lock` 关键字。\n\n以下两种语法实现相同的结果。语法 1：\n\n\
  ```\nlock (this) {\n}\n```\n\n语法 2：\n\n```\ntry {\n  Monitor.Enter(this);\n} finally\
  \ {\n  Monitor.Exit(this);\n}\n```\n\n`Listing 16.13` 展示了四个线程尝试访问一个实例字段。在此示例中，`BloodBank`\
  \ 类中字段 `val` 的状态在任何给定时间都是不可预测的，因为它被四个线程修改而没有任何同步。`Listing 16.13` 的行为在不同系统上会有所不同。\n\
  \n### Listing 16.13. 无线程同步的多线程代码 (C#)\n\n```\nusing System;\nusing System.Threading;\n\
  \npublic class EntryPointClass {\n  public static void Main(string[] args) {\n \
  \   BloodBank bb = new BloodBank();\n    Donor d1 = new Donor(\"D1\",1000, bb);\n\
  \    Donor d2 = new Donor(\"D2\",2000, bb);\n    Taker t1 = new Taker(\"T1\",1000,\
  \ bb);\n    Taker t2 = new Taker(\"T2\",2000, bb);\n  }\n}\n\nclass Donor {\n  Thread\
  \ t;\n  BloodBank bb;\n  string name;\n  int sleep;\n\n  public Donor(string name,\
  \ int sleep, BloodBank bb) {\n    this.name = name;\n    this.bb = bb;\n    this.sleep\
  \ = sleep;\n    t = new Thread(new ThreadStart(Donate));\n    t.Start();\n  }\n\
  \  public void Donate() {\n    while (true) {\n      Thread.Sleep(this.sleep);\n\
  \      this.bb.add();\n    }\n  }\n}\nclass Taker {\n  Thread t;\n  BloodBank bb;\n\
  \  string name;\n  int sleep;\n\n  public Taker(string name, int sleep, BloodBank\
  \ bb) {\n    this.name = name;\n    this.bb = bb;\n    this.sleep = sleep;\n   \
  \ t = new Thread(new ThreadStart(Take));\n    t.Start();\n  }\n  public void Take()\
  \ {\n    while (true) {\n      Thread.Sleep(this.sleep);\n      Console.WriteLine(\"\
  Blood count \"+this.bb.remove());\n    }\n  }\n}\n\nclass BloodBank {\n\n  int val;\n\
  \  public void add() {\n    ++this.val;\n  }\n  public int remove() {\n    return—this.val;\n\
  \  }\n\n}\n```\n\n## 更安全的方法\n\n更安全的方法是在 `BloodBank` 对象的 `add` 和 `remove` 方法上进行同步。在\
  \ C# 中，你可以通过提供以下构造来实现：\n\n```\npublic void add() {\n  lock (this) {\n    ++this.val;\n\
  \  }\n}\n\npublic int remove() {\n  lock (this) {\n    return—this.val;\n  }\n}\n\
  ```\n\n这等同于在 Java 中拥有同步的 `add()` 和 `remove()` 方法。\n\n## 重要注意事项\n\n必须注意，线程总是通过同步方法相互阻塞。当一个线程持有对象的锁时，其他线程可以继续访问该对象的其他“非同步”方法。这意味着，如果有两个方法，如前面的\
  \ `add()` 和 `remove()`，在任何给定时间只能有一个线程调用这两个方法中的任何一个，尽管多个线程可以调用同一对象上的非同步方法。\n\n并非总是需要锁定对象的状态。有些对象被设计为线程不安全的，并将线程安全的责任留给对象的使用者。例如，Java\
  \ 中的 Servlet 可以被多个线程同时访问，只要这些线程彼此之间不共享 Servlet 状态。因为 Servlet 传统上没有任何关联的状态，多个线程可以调用它们的\
  \ `doGet()` 或 `doPost()` 方法。但是，可以通过实现 `SingleThreadModel` 使 Servlet 线程安全，这会自动为每个请求创建一个\
  \ Servlet 实例（这也会极大地减慢你的 Web 应用程序）。\n\n## 线程通信\n\nJava 的 `java.lang.Object` 的 `wait()`、`notify()`\
  \ 和 `notifyAll()` 方法在 C# 中有以下等效方法：`Monitor.Wait(object)`、`Monitor.Pulse(object)`\
  \ 和 `Monitor.PulseAll(object)`。这里，`object` 是要等待的对象（通常是获取锁的对象）。前面讨论的线程交互是使用 `Thread.Sleep()`\
  \ 进行的。这是一种使线程相互协作的粗糙方法。此外，通过查询线程的 `ThreadState` 来使线程相互协作并不总是可行的，尤其是在要管理的线程数量未知的情况下。\n\
  \n为了使线程通信，C# 提供了 `Monitor.Wait` 和 `Monitor.Pulse` 构造。`Listing 16.14` 展示了这两个以及 `lock`\
  \ 关键字的示例。\n\n### Listing 16.14. 使用 `Monitor.Wait()` 和 `Monitor.Pulse` 维护 `WaterQuality`\
  \ (C#)\n\n```\nusing System;\nusing System.Threading;\npublic class WaterQuality\
  \ {\n\n  private long PotableLimit;\n  private long PollutedLimit;\n  private long\
  \ pollution;\n\n  public WaterQuality(long PotableLimit, long PollutedLimit,\n \
  \                                      long currentPollution) {\n    this.PotableLimit\
  \ = PotableLimit;\n    this.PollutedLimit = PollutedLimit;\n    this.pollution =\
  \ currentPollution;\n  }\n\n  public void Purify() {\n    lock(this) {\n      while\
  \ (true) {\n        while (pollution < PotableLimit) {\n          Monitor.Wait(this);\n\
  \        }\n        — —pollution;\n        Console.WriteLine(\"Purifying = \"+pollution);\n\
  \        Monitor.PulseAll(this);\n      }\n    }\n  }\n\n  public void Pollute()\
  \ {\n    lock(this) {\n      while (true) {\n        while (pollution > = PollutedLimit)\
  \ {\n          Monitor.Wait(this);\n        }\n        ++pollution;\n        Console.WriteLine(\"\
  Polluting = \"+pollution);\n        Monitor.PulseAll(this);\n      }\n    }\n  }\n\
  \  static void Main(string[] args) {\n    WaterQuality ct = new WaterQuality (10,\
  \ 200, 3000);\n    Thread polluter = new Thread(new ThreadStart(ct.Pollute));\n\
  \    Thread purifier = new Thread(new ThreadStart(ct.Purify));\n    polluter.Start();\n\
  \    purifier.Start();\n\n  }\n\n}\n```\n\n`WaterQuality` 类通过 `Pollute()` 和 `Purify()`\
  \ 方法受到污染和净化，这两个方法由两个不同的线程调用。我们希望将水质维持在可饮用和污染的限制之间。`Pollute()` 和 `Purify()` 方法使用\
  \ `Wait()` 和 `PulseAll()` 方法使两个线程轮流进行污染和净化。请注意几点：\n\n*   `lock` 关键字锁定在对象实例 `this`\
  \ 上。这类似于在 Java 中对整个方法使用 `synchronize`。\n\n*   `Monitor.Wait()` 和 `Monitor.Pulse`\
  \ 必须在 `lock (this)` 块内调用。这类似于 Java 中的 `wait()` 和 `notify()`，它们必须在同步块内调用。\n\n\n\n\
  \n\n程序的执行过程可以解释如下。最初，污染者线程和净化者线程都启动。污染者线程获取了 `this`（`WaterQuality` 对象）的锁，从而阻止了 `Purifier`\
  \ 线程执行任何操作。此时，`Purifier` 线程处于 `Running` 状态，但并未进行任何净化工作。`Polluter` 线程在 `Monitor.Wait(this)`\
  \ 调用上阻塞，因为 `Pollute` 方法中 `while` 循环的条件为 `true`（初始污染值 3,000 大于 200）。`Polluter` 线程释放锁并进入对象的等待队列（一个等待获取锁的线程队列）。`Purifier`\
  \ 线程通过 `Monitor.PulseAll(this)` 方法被通知锁可用。`Purifier` 退出等待队列，然后进入就绪队列并接管，将水净化至饮用水标准（10），之后便不再净化。此时，它在\
  \ `WaterQuality` 对象上阻塞（通过 `Purify` 方法中的 `Monitor.Wait(this)` 调用，因为 `Purify` 方法中\
  \ `while` 循环的条件为 `true`）。\n\n随后，`Purifier` 线程释放之前从 `Polluter` 获取的锁，并通知 `Polluter`\
  \ 接管。`Polluter` 再次接管，现在将污染值增加到 200，之后再次阻塞，请求净化者开始净化。这个循环不断重复，两个线程无休止地工作，以将 `WaterQuality`\
  \ 的污染值保持在 10 到 200 之间。\n\n你可以通过改变饮用水标准、污染上限和当前污染值来改变线程间的交互。当前污染值小于 10 将触发 `Polluter`\
  \ 先工作，并将污染值提升到 200。\n\n如果我们在本例中没有使用 `Monitor.Wait` 和 `Monitor.Pulse` 方法，`Polluter`\
  \ 线程将会独占 CPU 时间，因为它在忙于污染水时永远不会释放对 `WaterQuality` 对象的锁。`Monitor.Wait(this)` 方法告诉调用线程在\
  \ `this` 上等待。然后调用线程进入等待队列，并停留在等待队列中，直到通过 `Monitor.Pulse(this)` 调用被告知移动到就绪队列。`Monitor.Pulse(this)`\
  \ 通知在此对象的锁上等待的线程。请注意，建议使用 `Monitor.PulseAll(this)` 而不是 `Monitor.Pulse()`。\n\n锁定可以在任何对象上进行。通常，你会锁定将被多个线程更改或访问的对象。你可以通过锁定静态对象来创建静态锁。这等同于在\
  \ Java 中对静态对象进行同步。\n\n## 16.4.1. `ReaderWriterLock` 类\n\n之前我们发现，在 C# 中，同步一段代码就像在代码周围包装一个锁构造一样简单。最线程安全的对象会将其所有方法同步。然而，同步所有方法也会减慢应用程序的速度，因为在任何给定时间只有一个线程可以操作该对象。有几种情况是你希望多个线程从对象读取，但只有一个线程修改对象。假设我们正在对如\
  \ 清单 16.15 所示的数据库表进行建模。\n\n### 清单 16.15. 数据库模型 (C#)\n\n```\npublic class Table {\n\
  \  public Row Read() {\n    lock (this) {\n    //Read\n    }\n  }\n  public void\
  \ Write(Row) {\n    lock (this) {\n    //Write\n    }\n  }\n}\n```\n\n如果我们有 100\
  \ 个线程试图访问 `Table` 对象，实际上一次只能有一个线程读取或写入表。我们想要的是一种允许多个线程从表读取，而只有一个线程能够写入的机制。C# 的 `ReaderWriterLock`\
  \ 类可用于允许多个读取和单个写入的类；这意味着只要没有线程试图改变对象的状态，对象的状态就可以被多个线程读取。\n\n清单 16.16 借鉴了随 .NET SDK\
  \ 附带的示例程序。该程序使用线程池模拟 20 个线程试图读写表。奇数线程从表读取，偶数线程写入表。注意使用 `AutoResetEvent` 来发出 `ThreadPool`\
  \ 线程执行完成的信号。一个新类 `Interlocked` 用于递减已访问表对象的线程数。我们将在 第 16.5 节 讨论 `Interlocked` 类。\n\
  \n### 清单 16.16. `ReaderWriterLock` 演示\n\n```\nusing System;\nusing System.Threading;\n\
  \npublic class Table {\n  ReaderWriterLock rwl = new ReaderWriterLock();\n\n  public\
  \ void Read(int threadNum) {\n    rwl.AcquireReaderLock(Timeout.Infinite);\n   \
  \ try {\n      Console.WriteLine(\"Start Resource reading\n                    \
  \           (Thread = {0})\", threadNum);\n      Thread.Sleep(1000);\n       Console.WriteLine(\"\
  Stop Resource reading\n                               (Thread = {0})\", threadNum);\n\
  \    }\n    finally {\n       rwl.ReleaseReaderLock();\n    }\n  }\n\n  public void\
  \ Write(Int32 threadNum) {\n    rwl.AcquireWriterLock(Timeout.Infinite);\n    try\
  \ {\n      Console.WriteLine(\"Start Resource\n          writing (Thread = {0})\"\
  , threadNum);\n      Thread.Sleep(750);\n      Console.WriteLine(\"Stop Resource\
  \ writing (Thread =\n{0})\", threadNum);\n    }\n    finally {\n       rwl.ReleaseWriterLock();\n\
  \    }\n  }\n}\n\npublic class Test {\n  static Int32 numThreads = 20;\n  static\
  \ AutoResetEvent done = new AutoResetEvent(false);\n  static Table table;\n\n  static\
  \ void Main(string[] args) {\n      table = new Table();\n      for (Int32 i = 0;\
  \ i < 20; i++) {\n        ThreadPool.QueueUserWorkItem(\n              new WaitCallback(UpdateResource),\
  \ i);\n      }\n      done.WaitOne();\n  }\n\n  static void UpdateResource(Object\
  \ state) {\n    Int32 threadNum = (Int32) state;\n    if ((threadNum % 2) ! = 0)\
  \ table.Read(threadNum);\n    else table.Write(threadNum);\n    if (Interlocked.Decrement(ref\
  \ numThreads)==0)\n         done.Set();\n  }\n}\n```\n\n清单 16.16 的输出如下：\n\n```\n\
  Start Resource writing (Thread=0)\nStop Resource writing (Thread=0)\nStart Resource\
  \ reading (Thread=1)\nStop Resource reading (Thread=1)\nStart Resource writing (Thread=2)\n\
  Stop Resource writing (Thread=2)\nStart Resource reading (Thread=7)\nStart Resource\
  \ reading (Thread=3)\nStart Resource reading (Thread=5)\nStop Resource reading (Thread=7)\n\
  Stop Resource reading (Thread=3)\nStop Resource reading (Thread=5)\nStart Resource\
  \ writing (Thread=4)\nStop Resource writing (Thread=4)\nStart Resource reading (Thread=15)\n\
  Start Resource reading (Thread=9)\nStart Resource reading (Thread=11)\nStart Resource\
  \ reading (Thread=13)\nStop Resource reading (Thread=15)\nStop Resource reading\
  \ (Thread=9)\nStop Resource reading (Thread=11)\nStop Resource reading (Thread=13)\n\
  Start Resource writing (Thread=6)\nStop Resource writing (Thread=6)\nStart Resource\
  \ reading (Thread=17)\nStart Resource reading (Thread=19)\nStop Resource reading\
  \ (Thread=17)\nStop Resource reading (Thread=19)\nStart Resource writing (Thread=8)\n\
  Stop Resource writing (Thread=8)\nStart Resource writing (Thread=10)\nStop Resource\
  \ writing (Thread=10)\nStart Resource writing (Thread=12)\nStop Resource writing\
  \ (Thread=12)\nStart Resource writing (Thread=14)\nStop Resource writing (Thread=14)\n\
  Start Resource writing (Thread=16)\nStop Resource writing (Thread=16)\nStart Resource\
  \ writing (Thread=18)\nStop Resource writing (Thread=18)\n```\n\n具有连续读取（多个线程同时读取）的块以粗体显示。请注意，多个线程可以同时读取，但一次只能有一个线程写入。\n\
  \n## 16.5. 原子操作\n\n\n\n\n许多处理器支持某些操作，这些操作由运行时保证不会被中断。当你处理线程时，这些操作非常有用，因为你可以使用它们而无需使用锁。在\
  \ CLR 中，这些操作被封装在 `Interlocked` 类中。该类公开了 `Increment()`、`Decrement()`、`Exchange()`\
  \ 和 `Compare Exchange()` 方法，这些方法可用于 `long` 和 `int` 数据类型。\n\n在 清单 16.16 中，`Interlocked.Decrement`\
  \ 操作用于以线程安全的方式递减访问的线程数。运行时保证互锁递减操作不会被中断。\n\n你应该使用互锁操作来提高性能，并避免对基本操作（如递增和递减 `int`\
  \ 和 `long` 数据类型）使用简单的锁。例如，我们可以通过在 `add()` 和 `remove()` 方法中使用 `Interlocked` 递增和递减操作，使\
  \ 清单 16.13 立即变得线程安全。\n\n### 16.6. 总结\n\n与线程相关的类和委托定义在 `System.Threading` 命名空间中。在\
  \ C# 中创建线程的四种方式如下：\n\n1.  手动创建线程。这种方法提供了最大的灵活性，因为线程的创建者可以控制线程的属性。这也是 Java 程序员创建线程的方式。但是，由于管理线程生命周期的责任在于程序员，因此应尽可能避免使用这种方法创建线程。不当地管理线程的生命周期可能会消耗系统资源。\n\
  \n2.  使用 `System.Threading.ThreadPool` 类。这是创建线程的推荐方法，因为它利用了系统指定的 `ThreadPool` 类，该类负责管理所创建线程的生命周期。\n\
  \n3.  使用 `System.Threading.Timer` 类。这是创建定期执行任务的线程的推荐方法。\n\n4.  使用异步回调机制。虽然这种方法不直接创建线程，但它模拟了异步行为，并为调用线程和执行线程之间的信息共享提供了通用机制。\n\
  \n在大多数情况下，你可以使用 `lock` 关键字来同步线程，这类似于 Java 的 `synchronized` 关键字。为了获得对同步块的更精细控制，C#\
  \ 提供了 `Monitor` 类。C# 提供了 `ReaderWriterLock`，这对于多线程尝试读取对象而只有一个线程尝试写入它的典型编程问题非常有用。C#\
  \ 的 `Interlocked` 类提供了可在 `int` 和 `long` 数据类型上执行的操作。这些操作不能被中断；它们是原子的，因此无需为简单任务指定锁。\n\
  \n## 第 17 章。使用 C# 属性、索引器和特性\n\n在过去的几章中，我们已经看到 C# 在许多方面与 Java 非常相似。C# 的创造者在 C# 中引入了许多新概念，这些概念对于编写良好的\
  \ C# 代码至关重要。Java 程序员可能会倾向于使用 Java 约定来编写 C# 代码，这没问题，但你可能会将 Java 的低效带入 C# 代码中。我们在本章讨论的构造专门用于解决这些低效问题。三种构造——属性、索引器和特性——在\
  \ Java 中没有等价物。\n\n### 17.1. 属性\n\n对象的属性可以直接访问（如果它们被声明为 `public`），或者通过 `get` 和 `set`\
  \ 方法（访问器和修改器）访问。这些方法为属性提供了单一的访问点。你可以更改这些方法的实现，而不会影响调用它们的代码。C# 提供了属性构造，这使得对最终用户来说，调用这些\
  \ `get` 和 `set` 方法是透明的。\n\n属性通常用于建模简单的属性。例如，你可以使用属性和方法来设置或获取汽车（一个对象）的颜色，如下所示。使用属性：\n\
  \n```\n1) car.Color = \"red\";\n2) string color = car.Color;\n```\n\n使用方法调用：\n\n\
  ```\n3) car.SetColor (\"red\");\n4) string color = car.GetColor();\n```\n\n属性语法更具可读性。在第\
  \ 1 行中，设置 `Color` 属性实际上调用了 `car` 对象内部的设置器，而最终用户无需知道这一点。同样，在第 2 行中，你只需通过检索属性并将其赋值给变量来隐式调用获取器。\n\
  \n让我们看一个例子。清单 17.1 显示了一个定义了各种属性的 `Student` 类。\n\n##### 清单 17.1。一个具有三个属性的 `Student`\
  \ 类 (C#)\n\n```\nusing System;\n\npublic class Student {\n\n  int size;\n  int count;\n\
  \  string name;\n  string id;\n\n  public int Count {\n    get {\n      return Int32.Parse(\"\
  te4t\");\n    }\n    set {\n      count = value;\n    }\n  }\n  public string ID\
  \ {\n    get {\n      return id;\n    }\n    set {\n      id = value;\n    }\n \
  \ }\n  public string Name {\n    get {\n      return name;\n    }\n  }\n  public\
  \ int Size {\n    get {\n      if (size == 1) calcSize();\n      return size;\n\
  \    }\n    set {\n      size = value;\n      calcCount();\n    }\n  }\n  private\
  \ void calcSize() {\n    //Do something with the size here.\n  }\n  private void\
  \ calcCount() {\n    //Do something with the count here.\n  }\n\n  public static\
  \ void Main(string[] args) {\n\n    Student s = new Student();\n    Console.WriteLine(\"\
  Name =\"+(s.Name == null));\n    s.Count = 2;\n    try {\n      Console.WriteLine(s.Count);\n\
  \    } catch (Exception e) {\n      Console.WriteLine(e.Message);\n    }\n    s.ID\
  \ = \"Test\";\n  }\n}\n```\n\n清单 17.1 的输出如下：\n\n```\nName =True\nInput string was\
  \ not in a correct format.\n```\n\n在 清单 17.1 中，`ID` 属性是一个简单属性，同时定义了 `get{}` 和 `set{}`\
  \ 块。请注意，在 `set{}` 块中，术语 `value` 是一个 C# 关键字。`value` 关键字应赋值给属性所包装的属性。CLR 足够智能，可以解析\
  \ `value` 关键字所赋值的属性的类型，因此你不必在 `set{}` 块中进行任何类型转换。`get{}` 块仅返回 `id` 属性的值。`ID` 属性是一个包装\
  \ `id` 属性的简单属性。外部代码可以通过操作 `ID` 属性来获取或设置属性 `id` 的值。请注意，`get` 和 `set` 锁具有相同的访问修饰符（`public`）。\n\
  \n`Size` 属性包装了对 `size` 属性的访问。该属性的 `get{}` 和 `set{}` 块涉及一些额外的处理。这是完全合法的。请记住，`get{}`\
  \ 和 `set{}` 块就像获取器和设置器方法。幸运的是，`get{}` 和 `set{}` 块中的处理由虚拟方法调用组成。实际上，处理可以是从简单的内存操作到数据库访问的任何内容。\n\
  \n如你所见，设置和获取属性的简单性可以包装许多复杂的、用户完全不知道的幕后操作。虽然属性旨在简化语法，但隐藏 CPU 和内存密集型操作的属性可能会被错误地使用，从而影响性能。例如，在以下代码片段中，`Balance`\
  \ 和 `Interest` 都是 `account` 对象的属性，并且两者都可以访问数据库：\n\n```\nfor (i =0; i < 100000; ++i)\
  \ {\n  sum += account.Balance + account.Interest;\n}\n```\n\n尽管语法看起来很简单，但在循环中访问数据库\
  \ 100,000 次可能会导致性能低下。\n\n\n\n\n\n`Name` 属性封装了对 `name` 属性的访问。`Name` 属性没有 `set{}`\
  \ 块。这使得该属性成为只读的。这类似于一个 Java 类只有一个属性的访问器。当你打印一个 `student` 的 `Name` 属性时，其值为 `null`。然而，与\
  \ Java 不同，单词 \"null\" 不会打印到控制台；相反，会打印一个空格（在输出中未显示）。\n\n`Count` 属性封装了对 `count` 属性的访问。`Count`\
  \ 属性将在 `get{}` 块中抛出一个 `Parsing` 异常，因为它试图将字母数字文本解析为 `int`。不幸的是，属性签名中并未指明存在异常被抛出的事实。因为\
  \ C# 没有 `throws` 子句，属性的使用者无法知道在使用该属性时必须处理哪些异常。\n\nVisual Basic 程序员将属性视为对象属性（如 `Color`、`Width`\
  \ 和 `Height`）的简单包装器。事实上，这正是 C# 属性构造背后的动机。然而，使用自定义代码重写 `get{}` 和 `set{}` 块的灵活性可能会被滥用。你绝不应该在属性的\
  \ `get{}` 和 `set{}` 块中放置复杂的、消耗 CPU 和内存的代码。属性应被视为对象属性的简单包装器。\n\n在 清单 17.1 中，所有的 `get{}`\
  \ 和 `set{}` 块都具有相同的访问修饰符。这正是属性不如方法灵活的地方。你可以更改 setter 或 getter 方法的访问修饰符，但一个 `public`\
  \ 属性将导致 `public get{}` 和 `set{}` 块。\n\n清单 17.2 表明，与成员函数一样，属性也可以使用 `virtual`、`override`\
  \ 或 `abstract` 修饰符进行声明。这些修饰符放在属性上，并影响 getter 和 setter。当派生类声明一个与基类同名的属性时，它会隐藏整个属性；不可能只隐藏\
  \ getter 或 setter。属性也可以是 `static` 的。`Static` 属性就像成员方法一样，不能使用 `virtual`、`abstract`\
  \ 或 `override` 修饰符进行声明。清单 17.2 展示了 `Graphic` 对象的一个 `abstract` 属性 `Area`，它被 `Circle`\
  \ 类的 `Area` 属性重写。\n\n##### 清单 17.2. 一个简单的抽象属性 (C#)\n\n```\nusing System;\n\npublic\
  \ abstract class Graphic {\n\n  public abstract double Area {\n    get;\n    set;\n\
  \  }\n}\n\nclass Circle : Graphic {\n  double area = 1;\n  double radius;\n  public\
  \ Circle(double rad) { radius = rad; }\n\n  public override double Area {\n    get\
  \ {\n      if (area == 1) {\n        area = Math.PI * Math.Pow(radius,2);\n    \
  \  }\n      return area;\n    }\n    set {\n      area = value;\n      radius =\
  \ Math.Sqrt((area/Math.PI));\n    }\n  }\n\n  public static void Main(string[] args)\
  \ {\n    Graphic g = new Circle(5.6);\n    Console.WriteLine(g.Area);\n  }\n}\n\
  ```\n\n清单 17.2 的输出如下：\n\n```\n98.5203456165759\n```\n\n总而言之，以下是 C# 属性构造的优缺点。优点：\n\
  \n*   语法简化。\n\n*   你无需了解方法签名即可使用它。\n\n*   属性可以抛出异常，而调用者无需知道该异常。\n\n缺点：\n\n*   因为属性看似简单，它们很可能在操作或循环中被当作常规变量使用。应注意属性在其\
  \ `get{}` 和 `set{}` 块中不会隐藏消耗 CPU 和内存的操作。\n\n*   属性强制 `get{}` 和 `set{}` 块使用相同的访问修饰符。\n\
  \n### 17.2. 索引器\n\n数组提供了一种获取和设置元素值的便捷方式。索引器允许将普通对象列表当作数组来访问。就像属性看起来像字段但具有执行 get\
  \ 和 set 操作的方法一样，索引器看起来像数组但具有执行数组索引操作的方法。\n\n#### 17.2.1. 具有整数索引的索引器\n\n清单 17.3 中的类展示了一个具有整数索引的索引器。索引器使用\
  \ `this[..]` 语法指定。索引器具有 `get` 和 `set` 块。如果你移除 `set` 块，索引器就变成只读的。返回类型是 `object`，并且关键字\
  \ `value` 再次出现在 `set` 块中。索引器的索引被指定为 `this[..]` 的参数。\n\n清单 17.3 展示了任何自定义对象如何定义索引器并可以像数组一样被处理。\n\
  \n##### 清单 17.3. 以整数为索引的索引器 (C#)\n\n```\nusing System;\nusing System.Collections;\n\
  \npublic class Rows {\n\n  ArrayList list;\n  public Rows(ArrayList param) {\n \
  \   list = new ArrayList(param);\n  }\n\n  public object this[int index] {\n   \
  \ get\n    {\n      return list[index];\n    }\n    set\n    {\n      list[index]\
  \ = value;\n    }\n  }\n  public static void Main(string[] args) {\n    ArrayList\
  \ list = new ArrayList();\n    list.Add(2);\n    list.Add(245);\n    list.Add(44);\n\
  \    Rows rows = new Rows(list);\n    for (int i =0; i < list.Count; ++i)\n    \
  \  Console.WriteLine(rows [i]);\n  }\n}\n```\n\n清单 17.3 的输出如下：\n\n```\n2\n245\n\
  44\n```\n\n在 清单 17.3 中，索引器由以下几行指定：\n\n```\npublic object this[int index] {\n  get\n\
  \  {\n    return list[index];\n  }\n  set\n  {\n    list[index] = value;\n  }\n\
  }\n```\n\n它是一个基于整数的索引，因为索引被声明为 `int`。本质上，我们知道 `ArrayList` 定义了一个索引器，使其可以像数组一样被访问。`Rows`\
  \ 类包装了一个 `ArrayList`，同时也包装了 `ArrayList` 的索引器功能。`Rows` 类只是将索引器调用委托给底层的 `ArrayList`\
  \ 对象。\n\n#### 17.2.2. 具有字符串索引的索引器\n\n与数组不同，索引器的索引可以是字符串。清单 17.4 展示了一个具有字符串索引的索引器。字符串索引维护为一个\
  \ `Hashtable`，两个索引从不同的来源检索数据。基于整数的索引从 `ArrayList` 获取数据，而基于字符串的索引从 `Hashtable` 获取数据。\n\
  \n##### 清单 17.4. 具有字符串索引的索引器 (C#)\n\n```\nusing System;\nusing System.Collections;\n\
  \npublic class RGBColorCodes {\n\n  Hashtable table;\n  public RGBColorCodes() {\n\
  \    table = new Hashtable();\n  }\n  public void Add(object key, object val) {\n\
  \    table.Add(key, val);\n  }\n\n  public object this[string key] {\n    get {\n\
  \      return table[key];\n    }\n    set {\n      table[key] = value;\n    }\n\
  \  }\n  public int Count {\n    get {\n      return table.Count;\n    }\n  }\n\n\
  \  public static void Main(string[] args) {\n    RGBColorCodes codes = new RGBColorCodes();\n\
  \    codes.Add(\"maroon\",\"800000\");\n    codes.Add(\"darkred\",\"8B0000\");\n\
  \    codes.Add(\"deeppink\",\"FF1493\");\n    codes.Add(\"mediumpurple\",\"9370DB\"\
  );\n    codes.Add(\"springgreen\",\"00FF7F\");\n    codes.Add(\"lavenderblush\"\
  ,\"FFF0F5\");\n    Console.WriteLine(codes[\"springgreen\"]);\n  }\n}\n```\n\n以下是\
  \ 清单 17.4 的输出：\n\n```\n00FF7F\n```\n\n`RGBColorCodes` 类将 RGB 颜色代码及其名称存储在 `Hashtable`\
  \ 中，该哈希表以颜色名称为索引。你可以使用索引器表示法获取特定颜色的颜色代码。清单中使用以下几行定义了索引器：\n\n```\npublic object this[string\
  \ key] {\n  get {\n    return table[key];\n  }\n  set {\n    table[key] = value;\n\
  \  }\n}\n```\n\n\n\n\n\n请注意，在清单 17.3 和清单 17.4 中，`get{}`和`set{}`块的实现都很简单；实际上，它们可能更复杂。同样，你应该小心，不要在这些块中隐藏复杂的\
  \ CPU 或内存密集型操作。索引器表示法最有可能在循环的上下文中使用，而在索引器的`get{}`和`set{}`块中拥有 CPU 密集型实现会减慢迭代速度。\n\
  \n#### 17.2.3. 多索引索引器\n\n索引器简化了 API。考虑一个复杂的数据结构，例如一个`Hashtable`的`ArrayList`。假设这个结构用于存储数据库行，其中主键存储为`Hashtable`键，列的值存储在`ArrayList`中。要基于主键或哈希表键访问此数据集的列，你可以选择以下示例方法调用（当然，如果你愿意，可以在方法签名中使用晦涩难懂的方式）：\n\
  \n```\nDataset.GetRow(int row).GetColumn(int col);\nDataset.GetData(int row, int\
  \ column);\n```\n\n你还需要提供 setter 方法。你可以使用一个索引器替换前面的混乱：\n\n```\nDataSet[int row,\
  \ int column]\n```\n\n国际象棋和跳棋玩家会立即欣赏这种索引器表示法。事实上，数据集本质上是一个表，那么为什么不使其可作为表结构访问呢？清单\
  \ 17.5 显示了一个具有多个索引器的`DataSet`对象。注意，在`Main`方法中，客户端对`DataSet`中`get`和`set`对象的调用已被简化。\n\
  \n##### 清单 17.5. 具有多索引的索引器 (C#)\n\n```\nusing System;\nusing System.Collections;\n\
  \npublic class DataSet {\n\n  ArrayList list;\n  Hashtable table;\n\n  public DataSet()\
  \ {\n    table = new Hashtable();\n    LoadData() {\n  }\n\n  private void LoadData(){\n\
  \    table.Add(1, GenerateList(1));\n    table.Add(2, GenerateList(2));\n    table.Add(3,\
  \ GenerateList(3));\n    table.Add(4, GenerateList(4));\n  }\n\n  private ArrayList\
  \ GenerateList(int j) {\n    ArrayList list = new ArrayList();\n    for (int i =0;\
  \ i < j; ++i) {\n      list.Add(i);\n    }\n    return list;\n  }\n\n  public object\
  \ this[int row, int column] {\n    get {\n      return ((ArrayList) table[row])[column];\n\
  \    }\n    set {\n      ((ArrayList) table[row])[column] = value;\n    }\n  }\n\
  \n  public void print() {\n    foreach (object o in table.Keys) {\n      ArrayList\
  \ list = (ArrayList) table[o];\n      Console.WriteLine(\"Key {0} has the following\
  \ values \", o);\n      for (int i =0 ; i < list.Count; ++i) {\n        Console.WriteLine(list[i]);\n\
  \      }\n    }\n  }\n\n  public static void Main(string[] args) {\n    DataSet\
  \ ds = new DataSet();\n    ds.print();\n    ds[2,0] = 3;\n    ds.print();\n  }\n\
  }\n```\n\n清单 17.5 的输出如下：\n\n```\nKey 4 has the following values\n0\n1\n2\n3\nKey\
  \ 3 has the following values\n0\n1\n2\nKey 2 has the following values\n0\n1\nKey\
  \ 1 has the following values\n0\nKey 4 has the following values\n0\n1\n2\n3\nKey\
  \ 3 has the following values\n0\n1\n2\nKey 2 has the following values\n3\n1\nKey\
  \ 1 has the following values\n0\n```\n\n在清单 17.5 中，索引器使用以下行定义：\n\n```\npublic object\
  \ this[int row, int column] {\n    get {\n      return ((ArrayList) table[row])[column];\n\
  \     }\n    set {\n      ((ArrayList) table[row])[column] = value;\n    }\n  }\n\
  ```\n\n具有多索引的索引器为你提供了自由，可以以与所解决问题域最相关的任何形式表示对数据的访问。例如，一个国际象棋方格可以称为`chessboard[row,\
  \ column]`，而不是`chessboard.getRow().getColumn()`。这样的索引器可以精简代码，使其更直观、更易读。\n\n### 17.3.\
  \ 特性\n\n现代编程语言通常使用声明性构造来改变程序的运行时行为。这些构造通常存在于属性文件、`.ini`文件或配置文件中。Java 的 Enterprise\
  \ JavaBeans 规范使用声明性语法来定义 EJB 的事务行为。JDK 发行版附带的标准策略文件包含与安全相关的声明性构造，这些构造规定了哪些 Java\
  \ 类在运行时获得哪些权限。\n\nC# 语言提供了`System.Attribute`类，用于对声明性构造进行建模。Java 没有用于对声明性构造建模的一等对象。C#\
  \ 特性可用于源代码中的特定代码元素，例如方法、类、构造函数和程序集。这些是可用于改变或定义对象运行时行为的注释。它们有一个 API，因此你可以以编程方式访问对象上定义的特性。通过明智地定义特性，你可以非常细粒度和具体地控制运行时行为。\n\
  \n通过将特性放在特定的代码元素上，你本质上定义了特性将应用的范围。特性应用的代码元素通常称为目标，通常包括以下内容：`Assembly`、`Module`、`Class`、`Struct`、`Enum`、`Constructor`、`Method`、`Property`、`Field`、`Event`、`Interface`、`Parameter`、`ReturnValue`、`Delegate`、`All`和`ClassMembers`。你通过将特性名称放在方括号中并将其放在应用它的代码元素前面来指定特性。例如，`[DllImport]`是一个标准特性，可以放在方法前面：\n\
  \n```\n[DllImport] public class WindowsFileReader{. . . }\n```\n\n特性可以有参数：\n\n```\n\
  [DllImport(\"user32.dll\", SetLastError=false, ExactSpelling=false)]\n```\n\n特性参数可以是以下类型：\n\
  \n*   `Bool`\n\n*   `Byte`\n\n*   `Char`\n\n*   `Double`\n\n*   `Float`\n\n*   `Int`\n\
  \n*   `Long`\n\n*   `Short`\n\n*   `String`\n\n*   `Object`\n\n*   `System.Type`\n\
  \n*   一个`public enum`\n\n*   任何这些类型的一维数组\n\n多个特性可以放在一个代码元素前面，并且一个特性可以在不同的代码元素上多次使用。这些称为多用途特性。在某些情况下，特性的目标（即特性应用的代码元素）似乎是不明确的。例如，在以下方法声明中，`SomeAttr`特性可以应用于方法或方法的返回值：\n\
  \n```\n[SomeAttr] int Method1( string s )\n```\n\n为了解决歧义，C# 为每种声明类型提供了一组默认目标。你可以通过显式指定特性目标来覆盖这些默认目标：\n\
  \n```\n[method: SomeAttr] int Method1( string s ) // 应用于方法\n[return: SomeAttr] int\
  \ Method1( string s ) // 应用于返回值\n[SomeAttr] int Method1( string s ) // 默认：应用于方法\n\
  ```\n\n表 17.1 列出了所有允许使用特性的声明；对于每个声明，第二列列出了该声明上特性的可能目标。\n\n目标为程序集或模块的特性被视为全局特性。`CLSCompliant`特性指示程序集中定义的所有类型是否符合\
  \ .NET Framework 公共语言规范：\n\n```\n[assembly: System.CLSCompliant(true)]\n```\n\n\
  表 17.1. 声明列表\n\n| 声明 | 可能的目标 |\n| --- | --- |\n| Assembly | assembly |\n| Module\
  \ | module |\n| Class | type |\n| Struct | type |\n| Interface | type |\n| Enum\
  \ | type |\n| Delegate | type, return |\n| Method | method, return |\n| Parameter\
  \ | param |\n| Field | field |\n| Property—indexer | property |\n| Property—get\
  \ accessor | method, return |\n| Property—set accessor | method, param, return |\n\
  \n\n\n\n\n| 事件—字段 | 事件、字段、方法 |\n| 事件—属性 | 事件、属性 |\n| 事件—添加 | 方法、参数 |\n| 事件—移除 |\
  \ 方法、参数 |\n\n在大多数情况下，我们将处理 .NET 环境中的预定义属性。但是，你也可以定义自定义属性。要定义一个属性，你需要扩展 `System.Attribute`\
  \ 类。最好在自定义属性类的类名后加上 `Attribute` 后缀，这样它就很容易被识别为属性类。\n\n属性类类似于常规类，但有一个预定义的属性 `[AttributeUsage]`，你的自定义属性必须在其类上指定它。这定义了你的自定义属性将被使用的方式。`[AttributeUsage]`\
  \ 属性是一个单次使用的属性。`[AttributeUsage]` 也是 `System.AttributeUsageAttribute` 的别名。`[AttributeUsage]`\
  \ 属性的语法是\n\n```\n[AttributeUsage(target,\nAllowMultiple=allowmultiple,Inherited=inherited)]\n\
  ```\n\n其中 `target` 指定属性可以放置的语言元素。`AllowMultiple` 的 `true` 值表示该属性是可多次使用的。`Inherited`\
  \ 的 `true` 值表示该属性会被派生类继承。\n\n清单 17.6 展示了一个自定义的 `Modified` 属性，你可以将其放置在类上，以指示该类何时被修改以及由谁修改。像\
  \ CVS 或 Visual SourceSafe 这样的源代码管理程序可以轻松跟踪所有这些信息。但是，如果你想以编程方式实现这一点，可以在 C# 中完成。`ClassModifiedAttribute`\
  \ 接受一个参数 (`modifiedby`)。该属性可以在类上多次使用，并且其唯一目标是一个类。然后该属性被用于一个名为 `Algorithm` 的自定义类上。通过反射，你可以获取类上定义的自定义属性并打印出属性的值。清单\
  \ 17.6 允许你收集关于类何时被修改的历史数据。\n\n##### 清单 17.6\\. 自定义属性 (C#)\n\n```\nusing System;\n\
  \n[AttributeUsage(AttributeTargets.Class, AllowMultiplerue)]\nclass ClassModifiedAttribute\
  \ : Attribute {\n  System.DateTime date;\n  string modifiedBy;\n  public ClassModifiedAttribute\
  \ (string modifiedBy) {\n    date = System.DateTime.Now;\n    this.modifiedBy =\
  \ modifiedBy;\n  }\n  public string ModifiedBy {\n    get {\n      return this.modifiedBy;\n\
  \    }\n  }\n  public System.DateTime ModifiedDate {\n    get {\n      return this.date;\n\
  \    }\n  }\n  public override string ToString() {\n    return \"The class was modified\
  \ by \"+ modifiedBy +\" on \"+\n                                               \
  \              date;\n  }\n}\n[ClassModified (\"John\")]\n[ClassModified (\"Damien\"\
  )]\n[ClassModified (\"Jack\")]\nclass Algorithm {\n  public static void Main (string[]\
  \ args) {\n      Type type = typeof (Algorithm);\n    foreach (ClassModifiedAttribute\
  \ att in\n    type.GetCustomAttributes(\n              typeof(ClassModifiedAttribute),false))\
  \ {\n      Console.WriteLine (\"Class was modified by \"+att.ModifiedBy + \" on\
  \ \" +att.ModifiedDate);\n    }\n  }\n}\n```\n\n清单 17.6 的输出如下：\n\n```\nClass was\
  \ modified by Damien on 11/2/2002 7:33:53 PM\nClass was modified by Jack on 11/2/2002\
  \ 7:33:53 PM\nClass was modified by John on 11/2/2002 7:33:53 PM\n```\n\n查看输出，你会很快发现这个属性的一个问题。因为你将日期设置为\
  \ `System.DateTime.Now`，所以每次尝试获取历史记录时，它都会给你程序运行时的当前时间，而不是类被修改的真实日期。为了解决这个问题，我们将属性改为接受一个字符串日期，由类的修改者指定。修改后的代码如清单\
  \ 17.7 所示。\n\n##### 清单 17.7\\. 修改后的 `ClassModified` 自定义属性 (C#)\n\n```\nusing System;\n\
  \n[AttributeUsage(AttributeTargets.Class, AllowMultiplerue)]\nclass ClassModifiedAttribute\
  \ : Attribute {\n  string date;\n  string modifiedBy;\n  public ClassModifiedAttribute\
  \ (string modifiedBy, string date ) {\n    this.date = date;\n    this.modifiedBy\
  \ = modifiedBy;\n  }\n  public string ModifiedBy {\n    get {\n      return this.modifiedBy;\n\
  \    }\n  }\n  public string ModifiedDate {\n    get {\n      return this.date;\n\
  \    }\n  }\n  public override string ToString() {\n    return \"The class was modified\
  \ by \"+ modifiedBy +\" on \"+\n                                               \
  \              date;\n  }\n}\n\n[ClassModified (\"John\", \"2/5/2002\")]\n[ClassModified\
  \ (\"Damien\", \"3/6/2002\")]\n[ClassModified (\"Jack\", \"4/7/2002\")]\nclass Algorithm\
  \ {\n  public static void Main (string[] args) {\n    Type type = typeof (Algorithm);\n\
  \    foreach (ClassModifiedAttribute att in\n             type.GetCustomAttributes(\n\
  \                  typeof(ClassModifiedAttribute),false)) {\n      Console.WriteLine\
  \ (\"Class was modified by \"+\n                att.ModifiedBy + \" on \" +att.ModifiedDate);\n\
  \    }\n  }\n}\n```\n\n清单 17.7 的输出如下：\n\n```\nClass was modified by Damien on 3/6/2002\n\
  Class was modified by Jack on 4/7/2002\nClass was modified by John on 2/5/2002\n\
  ```\n\n该类现在已修复，可以显示正确的历史数据。\n\n### 17.4\\. 总结\n\nC# 有三种编程构造在 Java 世界中没有直接等价物：属性、索引器和属性。\n\
  \n属性是对象属性或字段的外观。属性提供 `get{}` 和 `set{}` 块，类似于访问器和修改器方法。当属性的使用者设置或获取属性值时，运行时会透明地调用\
  \ `get{}` 和 `set{}` 块中的代码。属性的优缺点如表 17.2 所示。\n\n你应该只使用属性来包装对象的字段，以便 `get` 和 `set`\
  \ 块在获取和设置属性值时进行最少或不进行处理。\n\n索引器允许你使用类似数组的符号来访问对象集合。索引器可以是基于整数或字符串的。单个对象可以定义多个索引器，并且索引器可以定义多个索引。索引器具有与属性相同的优缺点。它们简化了代码的整体外观，但如果底层的\
  \ `get{}` 和 `set{}` 块中存在 CPU 或内存密集型代码，则根据索引器的使用方式，可能会对应用程序的性能产生负面影响。建议在索引器的 `get`\
  \ 和 `set` 块进行最少或不进行处理时使用索引器。\n\n表 17.2\\. C# 属性的优缺点\n\n| 优点 | 缺点 |\n| --- | ---\
  \ |\n| 简化语法。属性可以像普通编程变量一样被获取或设置，从而简化了代码的整体外观。属性不需要属性的使用者了解任何关于属性签名的信息，因为没有签名。 |\
  \ 属性通过隐藏对 `get{}` 和 `set{}` 块中代码的调用来简化语法。在这些块中放置任何 CPU 或内存密集型代码都可能导致最终应用程序的性能不佳，具体取决于属性的使用方式。属性不会抛出任何异常，因此使用者事先不知道在使用属性时要注意哪些异常。属性不允许在\
  \ `get{}` 和 `set{}` 块上使用不同的访问修饰符。 |\n\n属性提供了一种声明性的方式，在运行时动态更改代码的行为。`System.Attribute`\
  \ 类还提供了一个 API，用于以编程方式访问和更改属性。每个 C# 对象都关联着元数据（关于方法、字段、接口、类型的信息），属性允许你扩展该元数据。\n\n\
  ## 第 18 章\\. 委托和事件编程\n\n\n\n\n\n# 本章探讨了 C# 中一种在 Java 编程语言中没有等价物的新构造。C# 的语言 API 中遍布着这种构造的使用。如果你检查线程和\
  \ I/O API，你会发现整个异步回调机制都基于这种新构造，它被称为委托。\n\nC# 支持委托的另一个原因与函数指针有关，函数指针在 C++ 和 C 中一直是一种流行的构造，但在\
  \ Java 中不受支持。因为 Java 将一切都视为类，所以 Java 的创造者认为不需要一个单独的构造来表示函数指针。然而，C# 并非只为吸引 Java 程序员而设计。C#\
  \ 的委托让 C 和 C++ 程序员感到熟悉。委托本质上是对函数（而不是对象）的引用，可以被调用。就像普通的对象引用一样，对函数的引用可以是实例引用、静态引用或属性引用。\n\
  \n## 18.1 使用委托\n\n清单 18.1 展示了一个简单的委托。\n\n### 清单 18.1 一个简单的委托示例（C#）\n\n```\nusing\
  \ System;\npublic class Test {\n  public delegate float CalcIncome(float hourlyWages);\n\
  \  public static void Main(string[] args) {\n    CalcIncome del = new\n    CalcIncome(Person.CalcAnnualIncome);\n\
  \    Console.WriteLine(del(26));\n  }\n  public class Person {\n    public float\
  \ income;\n    public static float CalcMonthlyIncome(float hourlyWages) {\n    \
  \  return hourlyWages * 160;\n    }\n    public static float CalcAnnualIncome(float\
  \ hourlyWages) {\n      resturn hourlyWages * 160 * 12;\n    }\n  }\n}\n```\n\n\
  第一步是声明委托，这在第 3 行完成：\n\n```\npublic delegate float CalcIncome(float hourlyWages);\n\
  ```\n\n这声明了一个名为 `CalcIncome` 的公共委托，它接受一个 `float` 作为参数并返回一个 `float` 作为结果。\n\n入口点使用以下行实例化委托：\n\
  \n```\nCalcIncome del = new CalcIncome(Person.CalcAnnualIncome);\n```\n\n请注意，当你实例化委托时，你必须传递与委托签名匹配的函数名——即委托被激活后实际会被调用的函数名。委托就像一个函数指针；在前面的行中，我们只是获取了一个指向函数\
  \ `Person.CalcAnnualIncome` 的函数指针的引用 `del`。这个函数可以是任何函数，只要它的签名与委托的签名匹配（接受一个 `float`\
  \ 并返回一个 `float`）。`Person.CalcAnnualIncome` 和 `Person.CalcMonthlyIncome` 方法都在一个单独的\
  \ `Person` 类中定义。请注意，这两个方法不必是 `static` 的。\n\n以下行调用委托：\n\n```\nConsole.WriteLine(del(26));\n\
  ```\n\n本质上，运行时将参数 `26` 传递给我们委托 `del` 包装的实际函数，即 `Person.CalcAnnualIncome`，然后调用该方法。这返回一个值，然后打印为\
  \ `49920`。\n\n这就是委托的要点。\n\n此时你可能想知道委托如何处理它们指向的底层方法抛出的异常。清单 18.2 回答了这个问题。\n\n###\
  \ 清单 18.2 委托中的异常处理（C#）\n\n```\nusing System;\n\npublic class Test {\n\n  public\
  \ delegate float CalcIncome(string hourlyWages);\n\n  public static void Main(string[]\
  \ args) {\n    CalcIncome del = new CalcIncome(Person.CalcAnnualIncome);\n    Console.WriteLine(del(\"\
  hghg\"));\n  }\n}\n\npublic class Person {\n\n  public float income;\n  public static\
  \ float CalcMonthlyIncome(string hourlyWages) {\n    return (float) Double.Parse(hourlyWages)\
  \ * 160;\n  }\n  public static float CalcAnnualIncome(string hourlyWages) {\n  \
  \  return (float) Double.Parse(hourlyWages) * 160 * 12;\n  }\n}\n```\n\n在 清单 18.2\
  \ 中，委托被修改为接受一个字符串而不是浮点数作为参数。传递一个无效的数字字符串会导致 `System.FormatException`，然后由 CLR 抛出。\n\
  \n委托可以被封装为类的属性或 `static` 成员。在前面的清单中，委托是 `Test` 类的一个实例成员。清单 18.3 展示了作为 `Test` 类的\
  \ `static` 只读成员的委托。\n\n### 清单 18.3 作为 `static` 成员的委托（C#）\n\n```\nusing System;\n\
  \npublic class Test {\n\n  public delegate float CalcIncome(float hourlyWages);\n\
  \n  public static readonly CalcIncome MonthlyIncome = new\n                    \
  \      CalcIncome(Person.CalcMonthlyIncome);\n\n  public static readonly CalcIncome\
  \ AnnualIncome = new\n                           CalcIncome(Person.CalcAnnualIncome);\n\
  \n  public static void Main(string[] args) {\n\n    try {\n      Console.WriteLine(Test.MonthlyIncome(40));\n\
  \      Console.WriteLine(Test.AnnualIncome(40));\n    } catch(Exception e) {\n \
  \     Console.WriteLine(e.StackTrace);\n    }\n  }\n}\n\npublic class Person {\n\
  \n  public float income;\n\n  public static float CalcMonthlyIncome(float hourlyWages)\
  \ {\n    return hourlyWages * 160;\n  }\n  public static float CalcAnnualIncome(float\
  \ hourlyWages) {\n    return hourlyWages * 160 * 12;\n  }\n}\n```\n\n在 清单 18.3 中，委托被创建为两个\
  \ `static` 成员（`MonthlyIncome` 和 `AnnualIncome`），并调用了它们。\n\n## 18.2 多播\n\n到目前为止，我们已经看到委托封装了单个函数调用。然而，委托也可以引用多个函数。就像一个对象方法调用可以在其中封装多个方法调用一样，委托实际上可以调用多个函数。\n\
  \n你可以使用运算符“+”和“-”来添加和删除委托。每当委托指向多个函数时，所有函数都会按照它们被添加到调用列表中的顺序被调用。调用列表是 CLR 维护的一个委托需要被调用的函数列表。\n\
  \n清单 18.4 展示了一个指向多个函数调用的委托。\n\n### 清单 18.4 添加委托（C#）\n\n```\nusing System;\n\npublic\
  \ class Test {\n\n  public delegate float CalcIncome(float hourlyWages);\n\n  public\
  \ static readonly CalcIncome MonthlyIncome = new\n                          CalcIncome(Person.CalcMonthlyIncome);\n\
  \n  public static readonly CalcIncome AnnualIncome = new\n                     \
  \      CalcIncome(Person.CalcAnnualIncome);\n\n  public static readonly CalcIncome\
  \ AllIncomes = MonthlyIncome\n                                                 +\
  \ AnnualIncome;\n\n  public static void Main(string[] args) {\n\n    try {\n   \
  \   Console.WriteLine(Test.AllIncomes(40));\n    } catch(Exception e) {\n      Console.WriteLine(e.StackTrace);\n\
  \    }\n  }\n}\n\npublic class Person {\n\n  public float income;\n\n  public static\
  \ float CalcMonthlyIncome(float hourlyWages) {\n    Console.WriteLine(\" Monthly\
  \ income is \"+hourlyWages * 160);\n    return hourlyWages * 160;\n  }\n\n  public\
  \ static float CalcAnnualIncome(float hourlyWages) {\n    Console.WriteLine(\" Annual\
  \ income is \"+hourlyWages * 12*\n                                             \
  \             160);\n    return hourlyWages * 160 * 12;\n  }\n}\n```\n\n在 清单 18.4\
  \ 中，`AllIncomes` 委托是通过将 `MonthlyIncome` 和 `AnnualIncome` 相加获得的。因此，当调用 `AllIncomes`\
  \ 委托时，`MonthlyIncome` 和 `AnnualIncome` 都会被调用。如果任何方法抛出 `exception`，则后续方法不会被调用。你可以使用委托的调用列表来更精细地控制可以调用的函数列表，如\
  \ 清单 18.5 所示。\n\n### 清单 18.5 使用 `GetInvocationList`（C#）\n\n\n\n\n\n```\nusing System;\n\
  \npublic class Test {\n\n  public delegate float CalcIncome(float hourlyWages);\n\
  \n  public static readonly CalcIncome MonthlyIncome = new\n                    \
  \ CalcIncome(Person.CalcMonthlyIncome);\n\n  public static readonly CalcIncome AnnualIncome\
  \ = new\n                       CalcIncome(Person.CalcAnnualIncome);\n\n  public\
  \ static readonly CalcIncome AllIncomes = MonthlyIncome\n                      \
  \                           + AnnualIncome;\n\n  public static void Main(string[]\
  \ args) {\n    try {\n        foreach (CalcIncome del in\n          AllIncomes.GetInvocationList())\n\
  \        {\n          del(40);\n        }\n      } catch(Exception e) {\n      Console.WriteLine(e.StackTrace);\n\
  \    }\n  }\n}\n\npublic class Person {\n\n  public float income;\n  public static\
  \ float CalcMonthlyIncome(float hourlyWages) {\n    Console.WriteLine(\" Monthly\
  \ income is \" +hourlyWages *\n                                                \
  \          160);\n    return hourlyWages * 160;\n  }\n  public static float CalcAnnualIncome(float\
  \ hourlyWages) {\n    Console.WriteLine(\" Annual income is \"+hourlyWages * 12*\n\
  \                                                          160);\n    return hourlyWages\
  \ * 160 * 12;\n  }\n}\n```\n\n下一节将探讨如何在 C# 中使用委托进行基于事件的编程。\n\n### 18.3 事件编程\n\n\
  如果你做过基于 Win32 GUI 或 Java Swing/AWT 的编程，你可能对事件编程很熟悉。如果你接触过 JavaBeans，你可能熟悉监听器监听 JavaBeans\
  \ 属性变化的概念，并且知道如何动态地添加或删除这些监听器。Java 中的监听器本质上是当特定事件发生时其方法会被调用的类。事件也是一个类，它由另一个称为源的类生成。因为在\
  \ Java 中一切都是建模为类的，所以有时很难区分监听器（事件接收者）和源（事件生成者）。\n\n无论是在 Java 还是 C# 中，事件都是一个对象发送的消息，用于指示某个动作的发生。该动作可以由\
  \ GUI 控件或守护进程触发。每个事件都有一个事件发送者和一个或多个事件接收者。发送者和接收者彼此完全不知道对方的存在。\n\n在 C# 中，委托用于将发送者和接收者联系起来。正如本章前面所解释的，委托是一个类型安全的函数指针。当源生成一个事件时，会实例化一个事件对象，并填充称为事件参数的属性。然后，该事件对象被传递给一个委托，该委托被调用。事件监听器通过向事件处理委托添加或移除自己的委托来注册或注销其对事件的兴趣。.NET\
  \ Framework 提供了 `event` 关键字。因此，事件本质上是一个具有非常特定签名的委托。事件通常声明为 `public`，但也可以使用其他访问修饰符。\n\
  \n为了说明事件编程的基础，我们将介绍各个组件。清单 18.6 展示了一个事件源类。所有事件都源自一个源。\n\n#### 清单 18.6. 事件源 (C#)\n\
  \n```\nusing System;\n\npublic delegate void TornadoHandler(object sender, EventArgs\n\
  \                                                             e);\n\npublic delegate\
  \ void HurricaneHandler(object sender, EventArgs\n                             \
  \                                e);\n\n//The source of all events\nabstract public\
  \ class Weather {\n  abstract protected void OnEvent(EventArgs args);\n  public\
  \ void Happen() {\n    OnEvent(EventArgs.Empty);\n  }\n}\npublic class Tornado :\
  \ Weather {\n  public event TornadoHandler myEvent ;\n  protected override void\
  \ OnEvent(EventArgs args) {\n    if (myEvent != null) {\n        myEvent (this,\
  \ args);\n    }\n  }\n}\npublic class Hurricane : Weather {\n  public event HurricaneHandler\
  \ myEvent ;\n  protected override void OnEvent(EventArgs args) {\n    if (myEvent\
  \ != null) {\n        myEvent(this, args);\n    }\n  }\n}\n```\n\n在这个例子中，`Weather`\
  \ 类是事件的源。它是一个 `abstract` 类，有两个子类（`Tornado` 和 `Hurricane`），每个子类都指定了各自的事件。`Happen()`\
  \ 方法使用一个空的 `EventArgs` 参数调用 `OnEvent()` 方法。因为我们在子类中重写了该方法，所以子类的 `OnEvent` 方法被调用，并生成相应的\
  \ `event`。在这种情况下，没有实际的 `event` 对象；相反，通信是通过 `EventArgs` 参数完成的。\n\n事件的监听器如 清单 18.7\
  \ 所示，即 `BasicWeatherStation` 类。\n\n#### 清单 18.7. 事件监听器 (C#)\n\n```\nusing System;\n\
  public class BasicWeatherStation {\n\n  public BasicWeatherStation () {\n  }\n \
  \ public void AddWeather2Watch(Weather weather) {\n    Tornado tor = weather as\
  \ Tornado;\n    if (tor != null) {\n      tor.myEvent += new\n           TornadoHandler(BasicTornadoHandler);\n\
  \    }\n    Hurricane cane = weather as Hurricane;\n    if (cane != null) {\n  \
  \    cane.myEvent += new\n             HurricaneHandler(BasicHurricaneHandler);\n\
  \    }\n  }\n\n  public void BasicTornadoHandler(object sender, EventArgs e) {\n\
  \    Console.WriteLine(\"Station has issued a tornado watch\");\n}\n  public void\
  \ BasicHurricaneHandler(object sender, EventArgs e)\n{\n    Console.WriteLine(\"\
  Station has issued a hurricane warning\");\n  }\n\n  public static void Main(string[]\
  \ args) {\n\n    Weather tornado = new Tornado();\n    Weather hurricane = new Hurricane();\n\
  \    BasicWeatherStation station = new\n                 BasicWeatherStation();\n\
  \    station.AddWeather2Watch(tornado);\n    station.AddWeather2Watch(hurricane);\n\
  \    tornado.Happen();\n    hurricane.Happen();\n  }\n}\n```\n\n气象站类对了解各种天气感兴趣，因此为每种天气类型都设置了天气事件处理程序。`BasicWeatherStation`\
  \ 类通过将其事件处理程序 `BasicTornadoHandler` 和 `BasicHurricaneHandler` 添加到特定天气的相应事件委托中，来注册其对了解天气的兴趣，如\
  \ 清单 18.8 所示。\n\n#### 清单 18.8. 将事件处理程序添加到事件委托 (C#)\n\n```\nTornado tor = weather\
  \ as Tornado;\nif (tor != null) {\n  tor.myEvent += new\n  TornadoHandler(BasicTornadoHandler);\n\
  }\nHurricane cane = weather as Hurricane;\nif (cane != null) {\n  cane.myEvent +=\
  \ new\n  HurricaneHandler(BasicHurricaneHandler);\n}\n```\n\n清单 18.8 的输出如下：\n\n\
  ```\nStation has issued a tornado watch\nStation has issued a hurricane warning\n\
  ```\n\n在这个例子中，子类负责声明特定事件，并且必须在 `OnEvent` 方法中实现代码，即使两个子类的代码是相似的。\n\n`weather` 类可以维护一个内部委托映射，该映射将根据特定的键调用相应的委托。清单\
  \ 18.9 展示了一个更智能的 `Weather` 类，它不再是 `abstract` 的。`Weather` 类现在实现了一个从天气类型到实际处理程序的内部映射。所有龙卷风都由\
  \ `BasicWeatherStation.BasicTornadoHandler` 处理，所有飓风都由 `BasicWeatherStation.BasicHurricaneHandler`\
  \ 处理。\n\n#### 清单 18.9. 新的 `Weather` 类 (C#)\n\n\n\n\n\n# Weather 类与事件处理\n\n## Weather\
  \ 类实现\n\n```csharp\nusing System;\nusing System.Collections;\n\npublic delegate\
  \ void WeatherHandler(object sender, EventArgs e);\npublic class Weather {\n\n \
  \ string key;\n  static Hashtable weathers = new Hashtable();\n  public Weather\
  \ (string key, WeatherHandler wh) {\n    this.key = key;\n    weathers[key] = (WeatherHandler)weathers[key]\
  \ + wh;\n  }\n  public event WeatherHandler weatherEvent\n  {\n    add\n    {\n\
  \      weathers[key]\n        Delegate.Combine(( Delegate)weathers[key], value);\n\
  \    }\n    remove\n    {\n      weathers[key] = Delegate.Remove((\n        Delegate)weathers[key],\
  \ value);\n    }\n  }\n\n  public void Happen() {\n    OnEvent(EventArgs.Empty);\n\
  \  }\n  protected void OnEvent(EventArgs args) {\n    WeatherHandler wh = (WeatherHandler)\
  \ weathers[key];\n    wh(this, args);\n  }\n}\n```\n\n请注意，编译器为 `event` 关键字的 `add`\
  \ 和 `remove` 方法提供了默认实现。在 清单 18.9 中的类里，我们选择实现自己的版本，以便将委托实例存储在一个中央哈希表中。这个类还使用了 `Delegate`\
  \ 类的 `static` 方法，而不是使用“+”和“-”运算符。`Weather` 构造函数现在将传入的 `WeatherHandler` 注册到内部映射中。`Happen()`\
  \ 方法调用 `OnEvent` 方法，该方法根据 `Weather` 类的 `key` 字段，选取相应的事件委托并调用它。\n\n## BasicWeatherStation\
  \ 类\n\n清单 18.10 展示了对应的 `BasicWeatherStation` 类。委托的使用被简化了。大部分工作由 `Weather` 类完成。`BasicWeatherStation`\
  \ 仅用于回调方法。\n\n### 清单 18.10. 新的 BasicWeatherStation 类 (C#)\n\n```csharp\nusing System;\n\
  public class BasicWeatherStation {\n\n  public static void BasicTornadoHandler(object\
  \ sender,\n                                               EventArgs e) {\n    Console.WriteLine(\"\
  Station has issued a tornado watch\");\n  }\n  public static void BasicHurricaneHandler(object\
  \ sender,\n                                           EventArgs e) {\n    Console.WriteLine(\"\
  Station has issued a hurricane\n                                               \
  \      warning\");\n  }\n\n  public static void Main(string[] args) {\n\n    Weather\
  \ tornado = new Weather (\"Tornado\", new\n      WeatherHandler(BasicWeatherStation.BasicTornadoHandler));\n\
  \n    Weather hurricane = new Weather(\"Hurricane\", new\n    Weather(BasicWeatherStation.BasicHurricaneHandler));\n\
  \n    tornado.Happen();\n    hurricane.Happen();\n  }\n}\n```\n\n到目前为止，我们根据天气类型（龙卷风或飓风）注册了天气监听器。这可能不够具体，因为多个监听器可能对特定的龙卷风感兴趣，而一个监听器也可能对多个龙卷风感兴趣。此外，没有办法通知所有站点某个特定事件。清单\
  \ 18.11 展示了 `Weather` 类的修改版本。\n\n## 修改后的 Weather 类\n\n### 清单 18.11. 修改后的 Weather\
  \ 类 (C#)\n\n```csharp\nusing System;\nusing System.Collections;\n\npublic delegate\
  \ void WeatherHandler(object sender,\n                                       EventArgs\
  \ e);\n\npublic class Weather {\n\n  string key;\n  object station;\n  static Hashtable\
  \ weathers = new Hashtable();\n  private Weather(){}\n\n  public static void AddHandlers(string\
  \ key, IStation station) {\n    Hashtable stationHandlers = (Hashtable) weathers[station];\n\
  \    if (stationHandlers == null) {\n      stationHandlers = new Hashtable();\n\
  \      stationHandlers[key] = station.GetHandler(key);\n      weathers[station]\
  \ = stationHandlers;\n    } else {\n\n      stationHandlers[key] = (WeatherHandler)\n\
  \      stationHandlers[key] + station.GetHandler(key);\n    }\n  }\n\n  public static\
  \ void Happen(string key, IStation station) {\n\n    Hashtable stationHandlers =\
  \ (Hashtable) weathers[station];\n    if (stationHandlers == null) {\n      stationHandlers\
  \ = new Hashtable();\n      stationHandlers[key] = station.GetHandler(key);\n  \
  \    weathers[station] = stationHandlers;\n    }\n    WeatherHandler wh = (WeatherHandler)\
  \ stationHandlers[key];\n    wh(new Weather(), EventArgs.Empty);\n  }\n\n  public\
  \ static void Happen(string key) {\n    ICollection keys = weathers.Keys;\n    foreach\
  \ (object o in keys) {\n      Hashtable handlers = (Hashtable) weathers[o];\n  \
  \    WeatherHandler wh = (WeatherHandler) handlers[key];\n      wh(new Weather(),\
  \ EventArgs.Empty);\n    }\n    if (keys.Count == 0)\n      throw new ArgumentException(\"\
  No station is interested in\n                                                  \
  \ {0} \", key);\n  }\n\n}\n```\n\n为了维护天气类型和气象站之间的多对多关系，`Weather` 类维护了一个 `Hashtable`\
  \ 的 `static Hashtable`。主 `Hashtable` 以 `station` 对象为键。次级（或内部）`Hashtable` 以天气类型为键，其值是处理程序委托。这种数据结构允许我们查询以下内容：\n\
  \n*   无论站点如何，给定天气类型的所有处理程序\n*   特定站点和特定天气的处理程序\n*   特定站点和特定天气的所有处理程序\n\n特定站点和天气类型的处理程序使用\
  \ `AddHandlers` 方法注册。此方法负责根据站点和 `weather` 类型存储要调用的委托。`Happen` 方法被重载。双参数版本通知特定站点特定事件。单参数版本通知给定天气的所有站点的所有处理程序。\n\
  \n## 入口点与驱动程序\n\n清单 18.12 实现了监听器类。两个气象站实现了一个 `IStation` 接口，并指明哪个委托用于哪种天气类型。在 `Main`\
  \ 方法中，我们将站点（监听器）注册到 `Weather`。根据调用的 `Happen` 方法，气象站会被通知。\n\n### 清单 18.12. 清单 18.11\
  \ 的入口点和驱动程序 (C#)\n\n```csharp\n// 此处应为清单 18.12 的代码，但原文未提供具体内容。\n// 根据上下文，它可能包含 IStation\
  \ 接口定义和 BasicWeatherStation 的实现。\n```\n\n\n\n\n\n# 第二部分：高级 C# 主题\n\n## 第 19 章 访问数据库\n\
  \n企业应用程序通常使用关系数据库管理系统（RBDMS）作为其后端数据存储。大多数企业应用程序都包含一个与这些 RDBMS 系统交互的组件。毫不奇怪，Java\
  \ 和 C# 都配备了 API，使得访问和操作数据库变得轻而易举。C# 使用 ADO.NET API，它不仅限于访问关系数据库。事实上，该 API 根本不局限于访问数据库。理论上，你可以使用\
  \ ADO.NET 访问任何类型的数据存储，包括面向对象的数据库管理系统（OODBMS）、数据文件和电子邮件。Java 的 JDBC 3.0 API 则专注于访问\
  \ RDBMS。\n\n本章仅在访问 RDBMS 的背景下讨论 C# API。假设你熟悉 RDBMS 的概念以及结构化查询语言（SQL）语法。\n\n### 19.1.\
  \ ADO.NET 内部\n\nActiveX 数据对象（ADO）被设计为一个高级接口，旨在提供对各种数据源的轻松访问。ADO.NET 从 ADO 演化而来，已成为\
  \ Microsoft 访问数据源的标准 API。传统的数据库访问是一种两层方法，需要维护与数据库的实时连接。这种方法在多层应用程序中扩展性不佳，因为数据必须在层与层之间传输。通过使用从数据库获取的数据的\
  \ XML 表示或 XML 流，ADO.NET 提供了对数据的断开连接访问，从而在 n 层应用程序中具有更好的可扩展性。\n\nADO.NET 将数据存储的概念抽象为数据源。数据源的示例包括\
  \ RDBMS、OODBMS、数据文件和电子邮件。\n\n用于访问数据库的 C# API 打包在四个命名空间中（参见 表 19.1）。\n\nADO.NET 的两个关键概念是\
  \ .NET 数据提供程序和 `DataSet` 对象，如 图 19.1 所示。我们首先来看 .NET 数据提供程序，它是一组用于与数据源接口的类。.NET 数据提供程序包含连接到数据源、向数据源发出命令以及从数据源检索和更新数据所需的所有类。同样，典型的\
  \ .NET 数据提供程序的类可以分类如下：\n\n*   `Connection`。用于连接到数据库的类。\n\n*   `Command`。用于向底层 RDBMS\
  \ 源指定任意 SQL 命令及其参数的抽象。\n\n*   `DataReader`。一个轻量级类，用于对运行查询获得的结果集进行只读的前向移动。\n\n* \
  \  `DataAdapter`。一组用于选择数据或对数据源进行更新、插入和删除操作的类。\n\n##### 图 19.1. ADO.NET 对象模型\n\n\
  ![](img/0672324024_ch19lev1sec1_image01.gif)\n\n表 19.1. 用于访问数据库的 C# 命名空间\n\n| 命名空间\
  \ | 描述 |\n| --- | --- |\n| `System.Data` | 此命名空间包含用于访问数据库的大部分核心类。 |\n| `System.Data.SqlTypes`\
  \ | 此命名空间提供 SQL Server 中原生数据类型的类。这些类提供了比其他数据类型更安全、更快的替代方案。使用此命名空间中的类有助于防止在可能发生精度损失的情况下出现类型转换错误。由于其他数据类型在后台与\
  \ `SqlType` 进行相互转换，因此显式创建和使用此命名空间中的对象也会使代码运行更快。 |\n| `System.Data.Commons` | 此命名空间包含\
  \ .NET 数据提供程序共享的类。 |\n| `System.Data.OleDb` | 此命名空间包含 OLE DB 提供程序的所有类。 |\n| `System.Data.SqlClient`\
  \ | 此命名空间包含 SQL Server 提供程序的所有类。 |\n\n---\n\n清单 18.12 中预测的输出如下：\n\n```\nAdvanced\
  \ Station has issued a tornado watch\nStation has issued a tornado watch\nAdvanced\
  \ Station has issued a hurricane warning\n```\n\n根据之前的讨论，应该清楚 C# 中的事件编程范式类似于 JavaBeans\
  \ 编程。本质上，对属性更改感兴趣的监听器会向该属性注册自己。当属性更改时，每个注册的监听器都会收到更改通知。在 Java 中，事件接收器（监听器）、事件生成器（源）和事件本身都是类。在\
  \ C# 中，事件本身被建模为委托回调。\n\n### 18.4. 总结\n\nC# 委托可以被视为类型安全的函数指针。函数指针本质上是对实际函数的引用。委托也可以包装对一系列函数的调用，这些函数可以动态添加或删除。由于函数调用的间接性质，委托对于模拟异步方法调用（例如调用\
  \ `System.Threading` 和 `System.IO` 命名空间）很有用。委托也用于 C# 中的基于事件的编程。C# 中的事件编程类似于 JavaBeans\
  \ 属性更改监听器范式。由于你可以向委托添加或删除函数，而委托又指向多个函数，因此委托可以方便地模拟 JavaBeans 属性更改监听器范式。\n\n---\n\
  \n```csharp\nusing System;\n\npublic class BasicWeatherStation : IStation {\n\n\
  \  public void BasicTornadoHandler(object sender, EventArgs e) {\n    Console.WriteLine(\"\
  Station has issued a tornado watch\");\n  }\n\n  public void BasicHurricaneHandler(object\
  \ sender, EventArgs e) {\n    Console.WriteLine(\"Station has issued a hurricane\
  \ warning\");\n  }\n\n  public WeatherHandler GetHandler(string key) {\n    if (\"\
  Tornado\".Equals(key)) {\n      return new WeatherHandler(BasicTornadoHandler);\n\
  \    } else if (\"Hurricane\".Equals(key)) {\n      return new WeatherHandler(BasicHurricaneHandler);\n\
  \    }\n    throw new ArgumentException(\"Can handle only Tornadoes and Hurricanes\
  \ at this time\");\n  }\n\n  public static void Main(string[] args) {\n    BasicWeatherStation\
