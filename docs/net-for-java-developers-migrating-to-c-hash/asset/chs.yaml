  \n使用 IDE GUI 工具包相当直观。以下是快速创建控件并为其编码的总体步骤：\n\n1.  双击或将任何控件拖放到窗体上。\n\n2.  右键单击该控件并更改你想要的任何属性。属性框还显示了可以与该控件关联的事件。你指定当该控件上触发事件时被调用的方法的名称。\n\
  \n3.  向与该控件关联的相关事件方法添加代码。\n\n与 AWT 和 Swing 库不同——它们具有布局管理器，可以在容器大小调整时处理所包含控件的大小调整——Windows\
  \ 库没有布局管理器。控件的位置是相对于容器以绝对方式指定的。这类似于 Java 的绝对位置布局。因此，当你调整窗体窗口的大小时，该窗体窗口内的控件不会随窗体一起调整大小。在\
  \ 第 21.5 节 中，你将学习如何相对于容器停靠和锚定控件，从而允许控件随窗体一起调整大小。\n\n既然你已经看到使用 IDE GUI 工具包创建一个简单的应用程序是多么容易，我们鼓励你尽可能多地使用窗体设计器，并探索编辑代码和设计屏幕的不同途径。\n\
  \n# 21.3. Windows 窗体、组件控件及其关联的 .NET 类\n\n如 表 21.1 所示，四个命名空间包含所有与 GUI 相关的类。\n\n就我们的目的而言，本章仅探讨\
  \ `System.Windows.Form`s 命名空间中的那些类。此命名空间中的类可以分为控件、组件和公共对话框。控件是向用户显示信息的 GUI 小部件。它们通过键盘和定点设备处理用户输入。它们还处理消息路由和安全性。控件具有关联的属性和事件，并由继承自\
  \ `System.Windows.Form.Control` 类的类表示。\n\n表 21.2 显示了 Visual Studio .NET 默认工具箱中控件的一个子集，以及它们关联的\
  \ .NET 类。为了便于参考，给出了这些类的 Java Swing 等效项。\n\n组件类是辅助类，用于建模 Windows 应用程序中典型的 GUI 组件。组件类通常继承自\
  \ `System.ComponentModel.Component` 类。表 21.3 显示了组件及其关联的 .NET 类。\n\n##### 表 21.1.\
  \ .NET GUI 命名空间\n\n| 命名空间 | 描述 |\n| --- | --- |\n\n\n\n\n\n# `System.Windows.Forms`\
  \ 命名空间\n\n`System.Windows.Forms` 命名空间中的类可以分为控件、组件和对话框。控件是 GUI 小部件（如文本框和复选框）、MDI\
  \ 或 SDI 窗体，或自定义用户控件。组件是与控件结合使用以构建丰富 Windows 应用程序的类（如 `ToolTips`、Windows 帮助和菜单框架）。通用对话框模拟了用户在执行打开或保存文件、选择字体或打印等任务时显示的常见\
  \ Windows 弹出对话框。\n\n# 其他相关命名空间\n\n`System.Windows.Forms.ComponentModel`、`System.Windows.Forms.Design`、`System.Windows.Forms.PropertyGridInternal`\
  \ 等命名空间包含可用于扩展 Windows 窗体设计时支持的类。\n\n# `System.Drawing` 命名空间\n\n`System.Drawing`\
  \ 命名空间中的类提供对 GDI+ 基本图形功能的访问。\n\n# 通用对话框\n\n通用对话框代表 Windows 操作系统中常见的组件，可以在 C# 应用程序中利用。这些组件的类继承自\
  \ `System.Windows.Forms.CommonDialog` 类。表 21.4 显示了这些对话框及其 .NET 类。\n\n# 控件、组件和对话框的属性与事件\n\
  \n与每个控件、组件和对话框类相关联的是属性和事件。属性可以在设计时设置或动态设置。您通过指定事件执行时将使用的委托来指定事件。例如，窗体控件具有关联的 `Load`\
  \ 事件。每当加载窗体时，就会触发此事件，类似于 HTML body 标签的 `onload` 事件。使用 .NET IDE 或动态方式，您可以指定与此 `Load`\
  \ 事件关联的委托。您可以按如下方式指定事件委托：\n\n```\n this.Load += new System.EventHandler(this.\n\
  \  PersonDetailForm_Load);\n```\n\n# .NET GUI 控件及其 Java Swing 等效项\n\n**表 21.2**\
