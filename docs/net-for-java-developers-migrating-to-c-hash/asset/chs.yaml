  \   }\n  }\n}\n```\n\n## 应用程序入口点\n\n应用程序的入口点是 `Main` 方法，它实例化一个 `DrawingTest` 类的对象。构造函数采取了必要的步骤来避免闪烁：\n\
  \n```csharp\nSetStyle(ControlStyles.UserPaint|\nControlStyles.AllPaintingInWmPaint|\n\
  ControlStyles.DoubleBuffer, true);\n```\n\n## 工具栏与绘图操作\n\n顶部的工具栏由可绘制的形状组成。用户通过点击任意一个形状按钮来绘制形状。一旦按下，该按钮将保持按下状态，直到按下另一个工具栏按钮。通过这种方式，可以多次绘制相同的形状。`Clear`\
  \ 工具栏按钮用于清除绘图区域。\n\n绘图操作在 `toolBar_ButtonClick` 方法中启动，其中设置了应用程序的 `currentShape`。然后用户使用鼠标拖动形状。请注意，当用户移动鼠标时，形状会向鼠标方向拉伸，直到用户释放鼠标。\n\
  \n## 鼠标事件处理\n\n`DrawingTest_MouseDown`、`DrawingTest_MouseUp` 和 `DrawingTest_MouseMove`\
  \ 方法共同捕获整个绘图过程。在 `DrawingTest_MouseDown` 方法中，我们设置点击的初始位置并将 `dragging` 标志设置为 `true`：\n\
  \n```csharp\nPoint currentPoint = new Point(e.X, e.Y);\npreviousPoint = currentPoint;\n\
  dragging = true;\n```\n\n## 拉伸效果的实现\n\n为了实现拉伸效果，需要在鼠标移动时绘制多个相同类型的形状，使得下一个绘制的形状能够覆盖前一个形状。在\
  \ `DrawingTest_MouseMove` 方法中，我们首先获取鼠标指针的当前位置：\n\n```csharp\ncurrentPoint = new\
  \ Point(e.X, e.Y);\n```\n\n然后计算当前位置与 `DrawingTest_MouseDown` 方法中先前点击点之间的距离：\n\n\
  ```csharp\nCalculateWidthHeight();\n```\n\n这基本上将宽度设置为两个点（`DrawingTest_MouseMove`\
  \ 方法中移动的 `currentPoint` 和 `DrawingTest_MouseDown` 方法中固定的 `previousPoint`）的 X 和 Y\
  \ 坐标之差。如果处于拖动模式，我们使用 `DrawBackground()` 方法撤销之前的绘图。\n\n## 绘制形状\n\n然后我们设置 `Pen` 对象并在\
  \ `DrawShape(pen, g)` 方法中绘制相应的形状。`DrawShape` 方法是所有绘图发生的地方。\n\n```csharp\nprivate\
  \ void DrawShape(Pen pen, Graphics g) {\n  if (currentShape == Shape.Line) {\n \
  \   g.DrawLine(pen, previousPoint, currentPoint);\n  }\n  if (currentShape == Shape.Doodle)\
  \ {\n    g.DrawLine(pen, previousPoint, currentPoint);\n  }\n  if (currentShape\
  \ == Shape.Rectangle) {\n    g.DrawRectangle(pen, previousPoint.X, previousPoint.Y,\n\
  \           currentWidth, currentHeight);\n  }\n  if (currentShape == Shape.Square)\
  \ {\n    g.DrawRectangle(pen, previousPoint.X, previousPoint.Y,\n           currentWidth,\
  \ currentWidth);\n  }\n  if (currentShape == Shape.Circle) {\n    g.DrawEllipse(pen,\
  \ previousPoint.X,\n           previousPoint.Y, currentWidth, currentWidth);\n \
  \ }\n  if (currentShape == Shape.Ellipse) {\n    g.DrawEllipse(pen, previousPoint.X,\n\
  \          previousPoint.Y, currentWidth, currentHeight);\n  }\n}\n```\n\n\n\n\n\
  \n`DrawingTest_MouseUp` 和 `DrawingTest_MouseMove` 方法使用两个不同的 `Graphics` 对象调用 `DrawShape`\
  \ 方法。`DrawingTest_MouseUp` 方法使用内存中持有的 `Graphics` 对象将最终形状渲染到屏幕上。`DrawingTest_MouseMove`\
  \ 方法使用通过 `CreateGraphics` 方法获得的 `Graphics` 对象。这允许在鼠标移动时快速渲染相同的形状。\n\n请注意，我们使用程序化的双缓冲在\
  \ `DrawingTest_Load` 方法中创建一个基于内存的 `Graphics` 对象，然后在 `DrawingTest_Paint` 方法中使用此对象渲染所有内容。\n\
  \n### 21.7. 总结\n\nGUI 编程通常包括编写具有 GUI 前端的应用程序，例如二维和三维绘图应用程序、成像和打印实用程序。\n\n`System.Windows.Form`\
  \ 命名空间中的类用于编写具有由 .NET GUI 控件组成的 GUI 前端的应用程序。以下是您应该记住的要点：\n\n*   .NET GUI 组件库与 Visual\
  \ Basic 的窗体和事件世界非常相似。GUI 控件在窗体上组装，并通过用户操作或系统触发的事件进行连接。而 Java Swing 使用经典的模型-视图-控制器范式将\
  \ GUI 组件与非 GUI 组件分离，.NET 窗体不提供 GUI 和非 GUI 类之间的任何逻辑分离。这可能会诱使初学者 C# GUI 程序员混合这两种类型的组件，从而限制\
  \ GUI 应用程序的可扩展性和模块化。\n\n*   Visual Studio .NET 环境附带一个窗体设计器，使得制作控件丰富的屏幕变得轻而易举。这对于配置繁琐的设计时\
  \ GUI 设置非常有用。JDK 缺少内置的 GUI 设计器，这使得快速组装 Swing 应用程序变得繁琐。\n\n*   .NET Forms 库的默认布局机制是控件在窗体上的绝对定位。这意味着容器内的控件不会随着容器一起很好地调整大小。为了克服这一点，.NET\
  \ 引入了锚定和停靠的概念。在 Java AWT 和 Swing 中，容器内控件的定位是相对于容器的，并使用一套布局管理器来完成。因此，控件会自动随容器调整大小，无需任何额外步骤。\n\
  \n.NET GDI+ 库允许进行复杂的二维绘图操作。\n\n*   与 `java.awt.Graphics` 和 `java.awt.Graphics2D`\
  \ 非常相似，`System.Drawing.Graphics` 对象用于执行所有绘图操作。\n\n*   GDI+ 内置支持成像和打印，类似于 Java 的成像和打印包。\n\
  \n## 第 22 章. 反射\n\n本章介绍 C# 的 `System.Reflection` 命名空间中的类。我们假设您熟悉反射的一般概念，并且对 Java\
  \ 的反射有所了解。\n\n反射可以被视为一种获取对象信息的“后门”方式。在面向对象编程中，我们可以通过知道对象上存在某个方法来调用该方法。然而，通常当我们以通用方式处理对象时，我们事先并不知道它们的方法，有时我们甚至不知道对象的类型。要在没有事先了解对象或其方法的情况下调用任何对象上的方法，我们必须查询对象的所有方法，找到所需的方法，并在运行时通过传递参数来调用它。\n\
  \n为了适应这一点，Java 或 C# 对象具有关联的元数据，或关于其数据的信息，例如其字段、方法以及对象实现的构造函数和接口。反射是查询、搜索和使用此元数据的能力。由于您必须经过发现要调用的方法、字段或构造函数的额外步骤，反射总是比直接调用特定对象方法、设置字段或实例化对象慢。\n\
  \n反射有许多重要用途：\n\n*   查看和查询元数据。许多 IDE 使用反射来以图形化的树状格式对您的自定义方法和字段进行分类。\n\n*   动态调用。这允许您在运行时获取和设置对象的字段，并以通用方式调用该对象上的方法。许多对象关系工具定义了从对象字段和方法到数据库表列的映射。这些工具使用动态调用在对象状态从数据库加载后调用适当的方法来设置和获取对象上的字段。Java\
  \ 程序员会注意到，此技术也用于自定义 JSP 标签。\n\n*   创建自定义类型。Java 程序员可能熟悉反射的其他两种用途，但可能会惊讶地发现 C# 允许您以编程方式访问和修改\
  \ IL，并以编程方式创建新的类型或类。这将等同于两个 Java API：一个允许以编程方式访问字节码，第二个用于创建类和接口。核心 JDK 1.3.1 没有用于访问字节码的\
  \ API。\n\n### 22.1. 核心反射类\n\nC# 中反射的核心类存储在 `System.Reflection` 命名空间中。Java 中这些类的近似等价物可以在\
  \ `java.lang.reflect` 和 `java.lang` 包中找到。\n\n`System.Type` 是进行所有反射发现的核心 C# 类。此类大致等同于\
  \ `java.lang.Class` 类。然而，存在一个差异。在 Java 中，一切都是 `java.lang.Object`，所以 `java.lang.Class`\
  \ 是所有对象的元数据。在 C# 中，`System.Type` 可以表示以下任何类型：类、值类型、数组、指针、接口和枚举。C# 的 `typeof` 运算符在某种程度上等同于\
  \ Java 中的 `.class` 运算符。要获取有关 `System.String` 类的元数据，您将使用以下代码：\n\n```\nConsole.WriteLine(typeof(System.String).isInterface);\n\
  ```\n\n这与以下 Java 调用有些相似：\n\n```\nSystem.out.println(String.class.isInterface());\n\
  ```\n\n如果您使用 Visual Studio .NET，很容易看到 `System.Type` 类的成员。自动完成功能会显示一个填充了成员的弹出框。类型的成员包括其字段、属性、方法、构造函数（一种特殊的方法）、自定义属性、接口以及任何嵌套类型。\n\
