  :\n      currentShape = Shape.Square;\n      break;\n    case \"Clear\":\n     \
  \ gB.Clear(this.BackColor);\n      this.RaisePaintEvent(this, null);\n      this.currentShape\
  \ = Shape.Undefined;\n      break;\n\n    }\n  }\n\n  private void DrawingTest_MouseDown\
  \ (object sender,\n         System.Windows.Forms.MouseEventArgs e) {\n    Point\
  \ currentPoint = new Point(e.X, e.Y);\n    previousPoint = currentPoint;\n    dragging\
  \ = true;\n  }\n\n  private void DrawingTest_MouseMove(object sender,\n        \
  \ System.Windows.Forms.MouseEventArgs e) {\n    currentPoint = new Point(e.X, e.Y);\n\
  \    CalculateWidthHeight();\n    if (dragging) {\n      DrawBackground();\n   \
  \   Pen pen = new Pen(Color.Blue);\n      if (currentShape != Shape.Doodle) {\n\
  \        Graphics g = CreateGraphics();\n        DrawShape(pen, g);\n        g.Dispose();\n\
  \      } else {\n        DrawShape(pen, gB);\n        previousPoint = currentPoint;\n\
