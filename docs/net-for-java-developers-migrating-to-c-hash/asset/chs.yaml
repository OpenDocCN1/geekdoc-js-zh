  \ 2.3\\. 将第一个参数打印到控制台 (C#)\n\n```\npublic class HelloWorld {\n  public static void\
  \ Main(string[] args) {\n    System.Console.WriteLine(args[0]);\n  }\n}\n```\n\n\
  要在 Java 中编写前面的代码，请创建一个名为 `MySample1.java` 的文件（参见 清单 2.4）。（文件名的意义在于 Sun 的 JDK 不允许您编译包含与文件名不同的公共类的文件。此外，JDK\
  \ 1.3 不允许使用句点符号，因此类必须是 `MySample1` 而不是 `MySample.1`。）\n\n##### 清单 2.4\\. 将第一个参数打印到控制台\
  \ (Java)\n\n```\npublic class MySample1 {\n  public static void main(String[] args)\
  \ {\n    System.out.println(args[0]);\n  }\n}\n```\n\n清单 2.3 和 2.4 的第 2 行是入口点。在\
  \ Java 中，`public static void main` 由主线程调用，该线程由 JVM 启动。在 C# 中，入口点由 CLR 调用。\n\n以下观察结果适用于\
  \ C# 代码：\n\n*   在 C# 中，类名是 `HelloWorld`，它存储在具有不同名称的文件中。\n\n*   `Main` 方法必须是 `static`。\n\
  \n*   类上的 `public` 修饰符是可选的。但是，修饰符不能是 `private` 或 `protected`。\n\n*   `Main` 方法上的修饰符是可选的，可以是\
  \ `public`、`private` 或 `protected`。\n\n*   在 C# 中，`Main` 方法有些重载。有一个没有任何参数的 `Main`\
  \ 方法。因为 `Main` 方法是入口点，所以一个类中只能有一个。因此，即使有两个 `Main` 方法——一个带参数，一个不带参数——一个类也只能定义一个。\n\
  \n*   EXE 文件只能有一个入口点。因此，如果您的 `.cs` 文件（源代码）在同一文件中有多个类，则只有一个类可以定义 `Main` 方法。（我们将在本章稍后讨论这个主题。）\n\
  \n现在要运行 C# 程序，请在提示符下键入以下命令：\n\n```\nMySample.1 \"Hello World\"\n```\n\n`MySample.1.exe`\
  \ 的输出如下：\n\n```\nHello World\n```\n\n清单 2.3 的第 3 行看起来类似于 清单 2.4 的第 3 行。在 Java 中，`System`\
  \ 类位于 `java.lang` 包中，您无需显式导入。在 C# 中，Java 包的粗略等价物是命名空间概念。这里，`System` 是命名空间，`Console`\
  \ 是 `System` 命名空间的类之一。\n\n在 Java 中导入包在 C# 中由关键字 `using` 支持。指定 `using System` 意味着您的代码可以引用该命名空间中的所有类，而无需完全限定它们的名称。它类似于\
  \ Java 中的导入功能。导入越通用，您在代码中限定类名的次数就越多。随着您获得更具体的导入，您可以避免为变量提供完全限定的类名。在 C# 中，同样的规则适用于\
  \ `using` 关键字：您用 `using` 关键字指定的类越具体，您的代码就越不拥挤。\n\n清单 2.5 是 C# 中 `namespace` 和 `using`\
  \ 关键字的示例，清单 2.6 是等效的 Java 程序。\n\n##### 清单 2.5\\. `using` 和 `namespace` 关键字的使用 (C#)\n\
  \n```\nnamespace Test {\n    using System;\n    public class HelloWorld {\n    \
  \  public static void Main(string[] args) {\n        Console.WriteLine(args[0]);\n\
  \      }\n    }\n}\n```\n\n##### 清单 2.6\\. 在 Java 中使用包\n\n```\npackage Test;\nimport\
  \ java.io.*;\npublic class HelloWorld {\n    public static void main(String[] args)\
  \ {\n    PrintStream out = System.out;\n    out.println(args[0]);\n    }\n}\n```\n\
  \nJava 中的包结构对应于源文件在磁盘上的存储方式。因此，具有包 `Test` 的类将存储在 JVM 下的 `Test` 目录中。相比之下，C# 中的命名空间结构与源文件在磁盘上的存储方式无关。\n\
  \n另请注意，`using` 关键字仅适用于命名空间。您不能编写 `using System.Console` 并在其上调用 `WriteLine` 方法，因为\
