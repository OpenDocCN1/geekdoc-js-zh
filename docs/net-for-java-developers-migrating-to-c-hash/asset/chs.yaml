  \ =261\n  Form.Top - noResizeButton.Top =58\nForm.Bottom - noResizeButton.Bottom\
  \ =335\n\n  Form.Left - yesResizeButton.Left =58\nForm.Right - yesResizeButton.Right\
  \ =258\n  Form.Top - yesResizeButton.Top =8\nForm.Bottom - yesResizeButton.Bottom\
  \ =285\n\n  Form.Left - noResizeButton.Left =58\nForm.Right - noResizeButton.Right\
  \ =263\n  Form.Top - noResizeButton.Top =58\nForm.Bottom - noResizeButton.Bottom\
  \ =334\n```\n\n请注意，对于锚定的控件，其距离在所有调整大小事件中都保持不变。\n\n## 21.5.2. 停靠\n\n当控件停靠到其容器的某个边缘时，在容器调整大小时，它会保持与该边缘接触；控件的大小会调整，使其与停靠的边缘大小相同。所有控件都有一个\
  \ `Dock` 属性，该属性接受 `DockStyle` 枚举中的一个值。`DockStyle` 的值如 `表 21.7` 所示。\n\n### 21.6.\
  \ 使用 .NET GUI 类进行绘制\n\n.NET 中的绘制类分布在多个命名空间中，如 `表 21.8` 所列。\n\n**表 21.7. `DockStyle`\
  \ 枚举**\n\n| 位置 | 描述 |\n| --- | --- |\n| `Top` | 控件的顶部边缘停靠到容器的顶部。 |\n| `Bottom` |\
  \ 控件的底部边缘停靠到容器的底部。 |\n| `Left` | 控件的左侧边缘停靠到容器的左侧。 |\n| `Right` | 控件的右侧边缘停靠到容器的右侧。\
  \ |\n| `Fill` | 控件的所有边缘停靠到容器的所有边缘。 |\n| `None` | 没有控件边缘被停靠。 |\n\n**表 21.8. 包含绘制类的命名空间**\n\
  \n| 命名空间 | 描述 |\n| --- | --- |\n| `System.Drawing` | 此命名空间提供对 GDI+ 基本图形功能的访问。`Graphics`\
  \ 类提供了用于向显示设备绘制的方法。其他类包括 `Rectangle`、`Point`、`Brush`、`Pen` 等等。 |\n| `System.Drawing.Drawing2D`\
  \ | 此命名空间提供高级二维和矢量图形功能。 |\n| `System.Drawing.Imaging` | 此命名空间提供与图像处理相关的服务。 |\n|\
  \ `System.Drawing.Printing` | 此命名空间提供与打印相关的服务。 |\n| `System.Drawing.Text` | 此命名空间中的类允许用户创建和使用字体集合。\
  \ |\n| `System.Drawing.Design` | 此命名空间为开发设计时 UI 的扩展提供了基本框架。 |\n\n.NET GDI+ API 的功能与\
  \ Java 平台中包含的 Java 2D API 的功能相似。\n\n### 21.6.1. `System.Drawing`\n\n`System.Drawing`\
  \ 命名空间的核心类是 `System.Drawing.Graphics` 类，它类似于 `java.awt.Graphics` 和 `java.awt.Graphics2D`\
  \ 类。所有的绘制操作都在 `Graphics` 对象上完成。要获取 `Graphics` 对象的句柄，你可以重写控件的 `OnPaint` 事件处理程序方法。\n\
  \n`Graphics` 对象作为 `PaintEventArgs` 对象的属性获取：\n\n```csharp\nusing System.Windows.Forms;\n\
  using System.Drawing;\n\npublic class DrawingTest : Form {\n\n  protected void OnPaint(PaintEventArgs\
  \ e) {\n    Graphics g = e.Graphics;\n  }\n}\n```\n\n\n\n\n\n当组件需要手动重绘时，`Paint`事件会通过调用`Control.RaisePaintEvent`方法自动触发。你也可以通过调用`Control.CreateGraphics`方法获取`Graphics`对象的实例。一旦你拥有了`Graphics`对象的引用，就可以使用它的多种绘图方法在屏幕上渲染形状。表\
  \ 21.9 列出了`Graphics`对象的方法。\n\n除了`Graphics`对象，你还可以使用许多其他的绘图类和结构体。这些在表 21.10 中列出。\n\
  \n使用这些类和`Graphics`对象，你就可以开始在屏幕上绘制二维和三维对象了。\n\n以下代码片段展示了用于完成一些常规绘图任务的基本语法。这些片段可以放在你自定义的`System.Windows.Form`类的方法中。我们将使用`Form`控件的`CreateGraphics()`方法。\n\
  \n绘制矩形\n\n```\nGraphics g = CreateGraphics();\nRectangle rect = new Rectangle(50,\
  \ 30, 100, 100);\nPen pen = Pens.Black;\ng.DrawRectangle(pen, rect);\n```\n\n绘制椭圆\n\
  \n```\nGraphics g = CreateGraphics();\nRectangle rect = new Rectangle(50, 30, 100,\
  \ 100);\nPen pen = Pens.Black;\ng.DrawEllipse(pen, rect);\n```\n\n表 21.9. `System.Drawing.Graphics`\
  \ 方法\n\n| 方法 | 描述 |\n| --- | --- |\n| `DrawArc` | 从指定的椭圆绘制一段弧线 |\n| `DrawBezier`\
  \ | 绘制一条三次贝塞尔曲线 |\n| `DrawBeziers` | 绘制一系列三次贝塞尔曲线 |\n| `DrawClosedCurve` | 基于点数组绘制一条闭合曲线\
  \ |\n| `DrawCurve` | 基于点数组绘制一条曲线 |\n| `DrawEllipse` | 绘制一个椭圆 |\n| `DrawImage` |\
  \ 绘制一幅图像 |\n| `DrawLine` | 绘制一条直线 |\n| `DrawPath` | 绘制由图形路径定义的线条和曲线 |\n| `DrawPie`\
  \ | 绘制一个扇形轮廓 |\n| `DrawPolygon` | 绘制一个多边形轮廓 |\n| `DrawRectangle` | 绘制一个矩形 |\n| `DrawString`\
  \ | 绘制一个字符串 |\n| `FillEllipse` | 填充椭圆的内部 |\n| `FillPath` | 填充路径的内部 |\n| `FillPie`\
  \ | 填充扇形的内部 |\n| `FillPolygon` | 填充多边形的内部 |\n| `FillRectangle` | 填充矩形的内部 |\n| `FillRectangles`\
  \ | 填充一系列矩形的内部 |\n| `FillRegion` | 填充一个区域 |\n\n绘制弧线\n\n```\nGraphics g = pe.Graphics;\n\
  Pen pn = new Pen(Color.Green);\nRectangle rect = new Rectangle(50, 30, 100, 100);\n\
  g.DrawArc(pn, rect, 12, 84);\n```\n\n绘制直线\n\n```\nGraphics g = CreateGraphics();\n\
  Point pt1 = new Point(10, 10);\nPoint pt2 = new Point(100, 100);\ng.DrawLine(pn,\
  \ pt1, pt2);\n```\n\n表 21.10. 常用的 `System.Drawing` 类和结构体\n\n| .NET 类/结构体 | 描述 |\n\
  | --- | --- |\n| `Brush` | 用于使用图案、颜色或位图填充封闭表面 |\n| `Brushes` | 一组常用画刷对象的集合 |\n|\
  \ `Pen` | 用于绘制线条和多边形，包括矩形、弧线和扇形 |\n| `Pens` | 一组常用`Pen`对象的集合 |\n| `Font` | 描述用于渲染文本的字体\
  \ |\n| `Point` (结构体) | 表示一个有序的整数 x 和 y 坐标对，定义二维平面中的一个点 |\n| `Rectangle` (结构体) |\
  \ 存储矩形区域的位置和大小 |\n| `Color` (结构体) | 表示一个 ARGB 颜色 |\n| `Size` (结构体) | 表示矩形区域的大小，由宽度和高度的有序对定义\
  \ |\n\n`FillPath` 示例\n\n```\nGraphics g = CreateGraphics();\ng.FillRectangle(new\
  \ SolidBrush(Color.White),\n       ClientRectangle);\nGraphicsPath path = new GraphicsPath(new\
  \ Point[] {\n  new Point(105, 225), new Point(190, 300),\n  new Point(50, 350),\
  \ new Point(20, 180), },\n  new byte[] {\n    (byte)PathPointType.Start,\n    (byte)PathPointType.Bezier,\n\
  \    (byte)PathPointType.Line,\n    (byte)PathPointType.Line,\n});\nPathGradientBrush\
  \ pgb = new PathGradientBrush(path);\npgb.SurroundColors = new Color[] {\n    Color.Green,\
  \ Color.Yellow, Color.Red,\n    Color.Blue, Color.Orange, Color.White,\n};\ng.FillPath(pgb,\
  \ path);\n```\n\n绘制文本和字符串\n\n```\nGraphics g = CreateGraphics();\nFont fnt = new\
  \ Font(\"Helvetica\", 16);\ng.DrawString(\"Hello World\", fnt,\n    new SolidBrush(Color.Red),\
  \ 14, 10);\n}\n```\n\n绘制图像\n\n```\nGraphics g = CreateGraphics();\nBitmap img =\
  \ new Bitmap(\"myImage.jpg\");\ng.DrawImage(img, 0, 0);\n```\n\n#### 21.6.2. 双缓冲\n\
  \nGDI+ 使得`Graphics`类在每次绘图操作后都会更新屏幕，这可能导致屏幕闪烁。你可以通过使用双缓冲来消除这种闪烁。在这种技术中，你将绘图操作执行到内存中的`Graphics`对象，然后将绘图渲染到屏幕上作为一个单一操作。\n\
  \n你可以通过使用`System.Windows.Form.Control`类的`SetStyle`方法在 GDI+ 中启用双缓冲：\n\n```\nSetStyle(ControlStyles.DoubleBuffer,\
  \ true);\n```\n\n如果`Graphics`类的内容在组件被要求重绘自身之前被自动清除，也可能发生闪烁。以下语句可以完全消除闪烁：\n\n```\n\
  SetStyle(ControlStyles.UserPaintControlStyles.AllPaintingIn\nWm|Paint|ControlStyles.DoubleBuffer,\
  \ true);\n```\n\n你可以通过在内存位图上执行绘图操作，然后将该位图一次性绘制到`Graphics`对象来以编程方式实现双缓冲：\n\n```\n\
  Bitmap img = new Bitmap(Width, Height);\nGraphics g = Graphics.fromImage(img);\n\
  Event.Graphics.DrawImage(img, 0, 0);\nimg.Dispose();\n```\n\n#### 21.6.3. 示例绘图程序\n\
  \n图 21.8 展示了示例程序运行时的快照。该程序是一个简单的形状绘制应用程序，用户点击工具栏上显示的特定形状并开始绘制。\n\n##### 图 21.8.\
  \ 一个简单的 GDI+ 绘图应用程序\n\n![](img/0672324024_ch21lev1sec6_image01.gif)\n\n该应用程序的一个特点是它允许橡皮筋效果，这基本上是沿着鼠标移动的方向拉伸形状。当鼠标释放时，形状就形成了最终形式。虽然形状实际上并没有被拉伸，但通过多次绘制形状，使得后续的绘制抵消了之前的绘制，从而实现了这种视觉效果。\n\
  \n清单 21.10 展示了这个示例的代码清单。为了保持焦点，整个应用程序写在一个类中。\n\n##### 清单 21.10. 示例绘图应用程序 (C#)\n\n\
  |\n\n\n\n\n\n# DrawingTest 应用程序\n\n## 代码结构\n\n```csharp\nusing System;\nusing System.Drawing;\n\
  using System.Collections;\nusing System.ComponentModel;\nusing System.Windows.Forms;\n\
