  \ 中被抽象为一个 `Form` 类。窗体的控件构成了 `Form` 类的字段。`Form` 类的方法对应于可以与窗体及其控件关联的事件。\n\n`Form1.cs`\
  \ 文件中的某个特定部分对 Java 程序员来说可能比较陌生：即 `#region` 指令之间的代码。此指令告诉 IDE 折叠并隐藏代码的某些部分，如 图 21.5\
  \ 所示。最好不要随意修改此部分内的代码。\n\n##### 图 21.5. 代码折叠和隐藏部分的快照\n\n![](img/0672324024_ch21lev1sec2_image05.gif)\n\
  \n请注意，文本框和类的名称并不直观。当你尝试将字段 `textBox1` 的名称更改为 `txtFullName` 并编译时，你会得到错误。原因是你在 `.cs`\
  \ 文件中更改了字段的名称，而不是通过窗体设计器进行的。IDE 巧妙地隐藏了一小段样板代码（其中引用了字段名 `textBox1`）。要解决此问题，你必须使用窗体设计器来更改字段的名称。\n\
