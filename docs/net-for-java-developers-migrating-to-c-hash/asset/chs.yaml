  \    for (int i =0; i < 10; ++i) {\n      Robber rob = new Robber(\"Robber \"+i);\n\
  \      robbers[i] = rob;\n    }\n    Cop cop1 = new Cop(\"Cop 1\", robbers, true);\n\
