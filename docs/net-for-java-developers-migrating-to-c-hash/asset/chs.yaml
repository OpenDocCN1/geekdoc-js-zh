  \ 5.10）。\n\n\n\n\n\n## 表 5.2. 基于表 5.1 关键字组合调用的方法\n\n| 方法编号 | 层级 A | 层级 B | 层级 C\
  \ | 层级 D |\n| --- | --- | --- | --- | --- |\n| 1 | 1 | 1 | 1 | 1 |\n| 2 | 1 | 2\
  \ | 1 | 2 |\n| 3 | 1 | 3 | 1 | 2 |\n\n### 清单 5.10. 方法参数类型对方法调用的影响 (C#)\n\n```csharp\n\
  using System;\n\npublic class SuperClass {\n  public void SetVal(int i) {\n    Console.WriteLine(\"\
  SetVal Super class method\");\n  }\n\n  public void Calc(short i) {\n    Console.WriteLine(\"\
  Calc Super class method\");\n  }\n}\n\npublic class SubClass : SuperClass {\n  public\
  \ void SetVal(short i) {\n    Console.WriteLine(\"SetVal Sub class method\");\n\
  \  }\n\n  public void Calc(int i) {\n    Console.WriteLine(\"Calc Sub class method\"\
  );\n  }\n\n  static void Main(string[] args) {\n    int i = 7;\n    short j = 8;\n\
  \    SubClass sc = new SubClass();\n    sc.SetVal(i);\n    sc.Calc(i);\n    sc.SetVal(j);\n\
  \    sc.Calc(j);\n  }\n}\n```\n\n在 `清单 5.10` 中，一个子类对象被实例化并赋值给一个子类引用，因此对该引用的任何方法调用都应该调用子类方法。然而，实际情况并非如此；第一次方法调用\
  \ `sc.SetVal(i)` 是在超类上进行的，因为 `int` 参数无法转换为子类 `SetVal` 方法的 `short` 参数。运行时调用了该方法的下一个最佳版本，该版本存在于超类中。`清单\
  \ 5.10` 的输出如下：\n\n```\nSetVal Super class method\nCalc Sub class method\nSetVal\
  \ Sub class method\nCalc Sub class method\n```\n\n### 5.4. 方法与继承\n\n我们之前提到过，在 C#\
  \ 中可以通过对类成员使用各种访问修饰符来控制继承。本节将探讨 C# 的访问修饰符。\n\n#### 5.4.1. 访问修饰符\n\n在 Java 中，子类不能重写超类方法并使其访问级别更严格。也就是说，一个公共的超类方法不能变成私有或受保护的，一个受保护的超类方法也不能在子类中变成私有的。然而，子类可以使方法的限制性更小。C#\
  \ 没有这个限制；事实上，子类可以使方法比超类的限制性更小或更大，只要该方法可以在赋值给创建对象的引用上调用即可。在 `清单 5.11` 中，`SubClass`\
  \ 类使 `SetVal` 方法的限制性更小，但只要对 `SetVal` 的调用是在引用上进行的（这里是 `SuperClass` 引用），这就不是问题。如果将\n\
  \n```csharp\nSuperClass sc = new SubClass();\n```\n\n这行代码改为以下形式，编译器会因为 `protected`\
  \ 访问修饰符而报错，因为方法调用是在引用（`SubClass`）上进行的：\n\n```csharp\nSubClass sc = new SubClass();\n\
  ```\n\n请记住，为了使 C# 中的虚分派正常工作，你必须使用 `virtual–override` 修饰符组合；并且每当你使用它时，超类和子类方法上的访问修饰符应该是相同的。因此可以安全地说，C#\
  \ 中的重写方法不能被设置得限制性更小或更大。\n\n##### 清单 5.11. 继承中的访问修饰符 (C#)\n\n```csharp\nusing System;\n\
  \npublic class SuperClass {\n  public void SetVal() {\n    Console.WriteLine(\"\
  Super class method\");\n  }\n}\n\npublic class SubClass : SuperClass {\n  protected\
  \ void SetVal() {\n    base.SetVal();\n    Console.WriteLine(\"Sub class method\"\
  );\n  }\n\n  static void Main(string[] args) {\n    SubClass sc = new SubClass();\n\
  \    sc.SetVal();\n  }\n}\n```\n\n`清单 5.12` 展示了一个三层类层次结构。`Test` 类在对象上调用适当的方法。请注意，当我们尝试从\
  \ `Test` 类访问类的私有和受保护成员时，编译器会报错。\n\n##### 清单 5.12. 类层次结构与访问修饰符 (C#)\n\n```csharp\n\
  using System;\n\npublic class SuperClass {\n  public void PublicM () {\n      Console.WriteLine(\"\
  Public Super Class\");\n  }\n\n  protected void ProtectedM () {\n      Console.WriteLine(\"\
  Protected Super Class\");\n  }\n\n  private void PrivateM () {\n      Console.WriteLine(\"\
  Private Super Class\");\n  }\n}\n\npublic class SubClass : SuperClass {\n  public\
  \ void PublicM () {\n      Console.WriteLine(\"Public Sub Class\");\n  }\n\n  protected\
  \ void ProtectedM () {\n      Console.WriteLine(\"Protected Sub Class\");\n  }\n\
  \n  private void PrivateM () {\n      Console.WriteLine(\"Private Sub Class\");\n\
  \  }\n}\n\npublic class LeafClass : SubClass {\n  public void PublicM () {\n   \
  \   Console.WriteLine(\"Public Leaf Class\");\n  }\n\n  protected void ProtectedM\
  \ () {\n      Console.WriteLine(\"Protected Leaf Class\");\n  }\n\n  private void\
  \ PrivateM () {\n      Console.WriteLine(\"Private Leaf Class\");\n  }\n}\n\npublic\
  \ class Test {\n  static void Main(string[] args) {\n    LeafClass lc = new LeafClass();\n\
  \    lc.PublicM();\n    //lc.PrivateM();\n    //lc.ProtectedM();\n    SubClass sc\
  \ = new LeafClass();\n    sc.PublicM();\n    //sc.PrivateM();\n    //sc.ProtectedM();\n\
  \    SuperClass suc = new LeafClass();\n    suc.PublicM();\n    //suc.PrivateM();\n\
  \    //suc.ProtectedM();\n  }\n}\n```\n\n`清单 5.12` 的输出如下：\n\n```\nPublic Leaf Class\n\
  Public Sub Class\nPublic Super Class\n```\n\n现在，让我们将 `static Main` 方法从 `Test` 类移动到\
  \ `LeafClass`，并移除 `Test` 类。我们将测试当方法调用从类层次结构内部发起，调用同一层次结构中的类时，访问修饰符的效果（`清单 5.13`）。\n\
  \n##### 清单 5.13. 将 `Main` 方法移动到 `LeafClass` (C#)\n\n```csharp\nusing System;\n\n\
  public class SuperClass {\n  public void PublicM () {\n      Console.WriteLine(\"\
  Public Super Class\");\n  }\n  protected void ProtectedM () {\n      Console.WriteLine(\"\
