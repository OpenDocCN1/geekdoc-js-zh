  \nJava 和 C# API 比较\n\n\n\n\n.NET 中有两种数据提供程序。SQL Server 数据提供程序由专门为访问 Microsoft SQL\
  \ Server 数据库而优化的类组成。这些类位于 `System.Data.SqlClient` 命名空间中。OLE DB 数据提供程序则由用于访问任何其他数据库（如\
  \ Oracle、Sybase 等）的类组成。该数据提供程序的类可在 `System.Data.OleDb` 命名空间中找到。\n\nADO.NET 的另一个核心概念是\
  \ `DataSet` 对象。`DataSet` 对象是从数据库检索到的数据的内存缓存。`DataSet` 对象试图模拟底层数据库的表结构。`DataSet`\
  \ 对象由一组模拟关系数据库管理系统（RDBMS）概念的对象组成，例如表、表关系、列、行和约束。`DataSet` 以 XML 文档的形式读写数据和架构。这些数据和架构可以通过\
  \ HTTP 传输，并被任何支持 XML 的平台上的任何应用程序使用。\n\n### 19.2. JDBC 2.0+\n\nJava 数据库连接（JDBC）API\
  \ 包含两组主要的接口：面向应用程序开发者的 JDBC API，以及面向驱动程序开发者的底层 JDBC 驱动程序 API。\n\nJava 中数据库访问的核心是数据库驱动程序，它负责将应用程序的\
  \ JDBC 调用转换为数据库能够理解的本地调用。JDBC 驱动程序相当于 .NET 的数据提供程序，但与 .NET 数据提供程序不同的是，JDBC 驱动程序更像是一个位于数据库和应用程序之间的黑盒子。大多数应用程序开发者不需要了解驱动程序的内部细节，因为他们只通过\
  \ JDBC API 与其交互。各种 RDBMS 供应商（如 Oracle、IBM、Sybase 等）为其各自的数据库提供符合 JDBC 标准的驱动程序。\n\n\
  应用程序通常使用以下四种类型的数据库驱动程序之一：\n\n*   类型 1：JDBC-ODBC 桥接加 ODBC 驱动程序。这种组合通过 ODBC 驱动程序提供\
  \ JDBC 访问。\n\n*   类型 2：本地 API、部分 Java 技术实现的驱动程序。这种类型的驱动程序将 JDBC 调用转换为对 Oracle、Sybase、Informix、DB2\
  \ 或其他 DBMS 的客户端 API 的调用。这种驱动程序要求在每台客户端机器上加载一些二进制代码。\n\n*   类型 3：用于数据库中间件的纯 Java\
  \ 驱动程序。这种驱动程序将 JDBC 调用转换为中间件供应商的协议，然后由中间件服务器将其转换为 DBMS 协议。\n\n*   类型 4：直接连接数据库的纯\
  \ Java 驱动程序。这种驱动程序将 JDBC 调用转换为 DBMS 直接使用的网络协议，允许从客户端机器直接调用 DBMS 服务器，为内网访问提供了实用的解决方案。\n\
  \n现代驱动程序倾向于类型 4。JDBC API 提供了访问数据库所需的一切。该 API 并非针对任何特定数据库进行优化，因此你可以对不同的数据库使用相同的 JDBC\
  \ 代码。\n\nADO.NET 支持一个用于访问大多数数据源的 API；然而，它也提供了一组独立的、经过性能优化的类，用于访问 Microsoft SQL Server\
  \ 数据库。如果你的应用程序基本上绑定到 Microsoft SQL Server，并且代码可移植性对你来说不是问题，那么你可以利用这个以供应商为中心的 API\
  \ 来提升应用程序性能。\n\n### 19.3. ADO.NET 入门\n\n在理解 C# API 的功能之前，你需要一个数据库服务器和一个示例数据库来访问。本章的重点是演示\
  \ API，而不是工具，因此我们不描述设置数据库、数据库架构和表的细节。相反，我们使用所有 Microsoft RDBMS 都附带的标准 Northwind 数据库。我们使用\
  \ Microsoft SQL Server 作为我们的数据库。为了使示例能够运行，你需要在本地机器上运行一个 Microsoft SQL Server 实例。\n\
  \n我们首先探索如何完成这些常规的数据库任务：\n\n*   建立与数据库的连接\n\n*   运行 `SELECT` 查询并获取数据\n\n*   运行 `INSERT`、`UPDATE`\
  \ 或 `DELETE` 查询\n\n*   运行存储过程\n\n*   处理事务\n\n*   探索数据库元数据\n\n#### 19.3.1. 建立与数据库的连接\n\
  \n清单 19.1 展示了如何使用 `SqlClient` 提供程序和 `OleDb` 提供程序打开与数据库的连接。根据你想要使用的连接提供程序，你会使用不同的连接类。幸运的是，`IDbConnection`\
  \ 是这两个类都实现的公共接口，因此我们可以使用该接口来完成两个最重要的连接相关任务，即打开和关闭连接。\n\n请注意，我们使用连接对象的 `ConnectionString`\
  \ 属性来指定连接属性。`ConnectionString` 使用以下格式：\n\n```\n \"key1=valuel;key2=value2\";\n```\n\
  \n键名不区分大小写。如果某个键名在连接字符串中出现多次，则使用最后一次出现的值。请注意，对于已关闭的连接，`ConnectionString` 属性是可读写的；对于已打开的连接，则是只读的。\n\
  \n##### 清单 19.1. 使用 ADO.NET 建立与数据库的连接 (C#)\n\n```\n using System;\nusing System.Data;\n\
  using System.Data.OleDb;\nusing System.Data.SqlClient;\n\nclass Test {\n\n  public\
  \ static void Main(string[] args) {\n\n    IDbConnection conn = null;\n    try {\n\
  \      conn = new OleDbConnection();\n      conn.ConnectionString = \"Provider=SQLOLEDB;Initial\n\
  \        Catalog=Northwind;Data Source=localhost;Integrated\n                  \
  \                         Security=SSPI;\";\n      conn.Open();\n      Console.WriteLine(\"\
  Connection \"+conn);\n      conn = new SqlConnection();\n      conn.ConnectionString\
  \ = \"Initial Catalog=Northwind;Data\n                 Source=localhost;Integrated\
  \ Security=SSPI;\";\n      conn.Open();\n      Console.WriteLine(\"Connection \"\
  +conn);\n    } catch(Exception e) {\n      Console.WriteLine(e.StackTrace);\n  \
  \  } finally {\n      conn.Close();\n    }\n  }\n}\n```\n\n清单 19.1 的输出如下：\n\n```\n\
  \ Connection System.Data.OleDb.OleDbConnection\nConnection System.Data.SqlClient.SqlConnection\n\
  ```\n\n请注意，`IDbConnection` 接口在概念上等同于 `java.sql.Connection`。在 Java 中，你必须加载驱动程序类并指定数据库\
  \ URL、用户和密码才能连接到数据库：\n\n```\n Class.forName(driverClass).newInstance();\nConnection\
  \ conn = DriverManager.getConnection(url, user,\npassword);\n```\n\n与 Java 不同（Java\
  \ 没有内置的连接池支持），ADO.NET 提供了自动连接池功能。\n\n#### 19.3.2. 运行 `SELECT` 查询并获取数据\n\n清单 19.2\
  \ 展示了如何使用 `OleDb` 提供程序和 `SqlClient` 提供程序读取从 `SELECT` 查询返回的数据行的示例。\n\n##### 清单 19.2.\
  \ 运行 `SELECT` 查询以获取数据 (C#)\n\n\n\n\n\n# 使用 ADO.NET 进行数据访问\n\n## 基本查询与数据读取\n\n以下代码示例展示了如何使用\
  \ `OleDb` 和 `SqlClient` 从数据库中读取数据。\n\n```csharp\nusing System;\nusing System.Data;\n\
  using System.Data.OleDb;\nusing System.Data.SqlClient;\n\nclass Test {\n\n  public\
  \ static void Main(string[] args) {\n    GetDataUsingOleDb();\n    Console.WriteLine(\"\
  ————\");\n    GetDataUsingSqlClient();\n  }\n  private static void GetDataUsingOleDb()\
  \ {\n    OleDbConnection conn = null;\n    OleDbDataReader reader = null;\n    try\
  \ {\n      conn = GetOledbConnection();\n      OleDbCommand command = conn.CreateCommand();\n\
  \      command.CommandText = \"SELECT * FROM CUSTOMERS WHERE\n                 \
  \                 UPPER(COUNTRY) = 'GERMANY'\";\n      reader = command.ExecuteReader();\n\
  \      Console.Write(\"Customer ID \\t\\t Contact Name \\n\");\n      while (reader.Read())\
  \ {\n        Console.Write(reader.GetString(1));\n        Console.Write(\"\\t\\\
  t\\t\");\n        Console.WriteLine(reader.GetString(3));\n      }\n    } finally\
  \ {\n      if (reader != null) reader.Close();\n      if (conn != null) conn.Close();\n\
  \    }\n  }\n  private static void GetDataUsingSqlClient() {\n    SqlConnection\
  \ conn = null;\n    SqlDataReader reader = null;\n    try {\n      conn = GetSQLConnection();\n\
  \      SqlCommand command = conn.CreateCommand();\n      command.CommandText = \"\
  SELECT * FROM CUSTOMERS WHERE\n                                  UPPER(COUNTRY)\
  \ = 'GERMANY'\";\n      reader = command.ExecuteReader();\n      Console.Write(\"\
  Customer ID \\t\\t Company Name \\n\");\n      while (reader.Read()) {\n       \
  \ Console.Write(reader.GetString(1));\n        Console.Write(\"\\t\\t\\t\");\n \
  \       Console.WriteLine(reader.GetString(2));\n      }\n    } finally {\n    \
  \   if (reader != null) reader.Close();\n       if (conn != null) conn.Close();\n\
  \    }\n  }\n\n  private static OleDbConnection GetOledbConnection() {\n    OleDbConnection\
  \ conn = new OleDbConnection();\n    conn.ConnectionString = \"provider=SQLOLEDB;Initial\n\
  \      Catalog=Northwind;Data Source=localhost;Integrated\n                    \
  \                           Security=SSPI;\";\n    conn.Open();\n    return conn;\n\
  \  }\n  private static SqlConnection GetSQLConnection() {\n    SqlConnection conn\
  \ = new SqlConnection();\n    conn.ConnectionString = \"Initial Catalog=Northwind;Data\n\
  \                   Source=localhost;Integrated Security=SSPI;\";\n    conn.Open();\n\
  \    return conn;\n  }\n\n}\n```\n\n上述代码的输出如下：\n\n```\n Customer ID            \
