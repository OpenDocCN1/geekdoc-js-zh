  \ Security=SSPI;\";\n    conn.Open();\n    return conn;\n  }\n\n}\n```\n\n## 代码解析\n\
  \n`Listing 19.9` 更新并插入了 `Customers` 表中的行，并从 `EmployeeTerritories` 表中删除了一行。程序首先创建一个\
  \ `SqlDataAdapter` 和一个 `DataSet`。然后，使用 `Customers` 数据填充 `DataSet`：\n\n```csharp\n\
  SqlDataAdapter adapter = new SqlDataAdapter(\"SELECT * FROM\n                  \
  \                            CUSTOMERS\", conn);\nDataSet ds = new DataSet();\n\
  adapter.MissingSchemaAction =\nMissingSchemaAction.AddWithKey;\nadapter.Fill(ds,\
  \ \"Customers\");\n```\n\n请注意，我们必须指定以下内容，因为如果不指定，`Fill` 方法将不会检索表的主键和唯一键信息：\n\n```csharp\n\
  adapter.MissingSchemaAction = MissingSchemaAction.AddWithKey;\n```\n\n在数据集中插入一行很简单：\n\
  \n```csharp\nDataRow row = ds.Tables[\"Customers\"].NewRow();\nrow[\"CustomerId\"\
  ] = \"2ldID\";\nrow[\"ContactName\"] = \"2ld name\";\nrow[\"CompanyName\"] = \"\
  2ld company\";\nds.Tables[\"Customers\"].Rows.Add(row);\n```\n\n在这里，我们创建一个行，填写其相关信息，并将其添加到\
  \ `Customers` 表的 `row` 集合中。要更新表中的一行，我们使用以下代码：\n\n```csharp\nrow = ds.Tables[\"Customers\"\
  ].Rows.Find(\"ALFKI\");\nrow[\"ContactName\"] = \"Updated name\";\n```\n\n第一行找到主键为\
  \ `ALFKI` 的行。我们通过将其值更改为 `\"Updated name\"` 来修改该行的 `ContactName` 列。\n\n`DataSet`\
  \ 现在已准备好持久化到底层表。以下两行将 `DataSet` 的更改持久化到数据库：\n\n```csharp\nSqlCommandBuilder builder\
  \ = new SqlCommandBuilder(adapter);\nadapter.Update(ds, \"Customers\");\n```\n\n\
  `SqlCommandBuilder` 是一个实用工具，用于从 `DataSet` 自动生成简单的 SQL 语句。\n\n在 JDBC 中，`java.sql.DatabaseMetaData`\
  \ 和 `java.sql.ResultSetMetaData` 分别提供了数据库结构和表结构的只读视图。`DataSet` 对象具有浏览数据库或表结构以及创建包含表、视图、约束和表之间关系的新数据库的方法。我们留给您去探索\
  \ `DataSet` 对象的这些有助于定义数据库元数据的方法。\n\n.NET `DataSet` 是一个灵活的类，可用于在 RDBMS 上执行数据操作语言（DML）和数据定义语言（DDL）。在大型代码库中，在不同地方重复执行\
  \ DML 代码会变得乏味。需要的是对面向对象程序员更直观的抽象。`Listing 19.10` 和 `19.11` 展示了如何将 `DataSet` 操作封装在一个抽象对象中，以便逻辑可以为任何自定义对象重用。最终用户只需构建自定义对象，对象的加载和保存就会自动完成。\n\
  \n首先，`Listing 19.10` 展示了抽象的 `SqlPersistentObject`。\n\n### `Listing 19.10`：用于封装 `DataSet`\
  \ 操作的抽象类（C#）\n\n\n\n\n\n# `DietPersistentFrameWork` 命名空间\n\n```csharp\nnamespace\
  \ DietPersistentFrameWork {\n\n  using System;\n  using System.Collections;\n  using\
  \ System.Data;\n  using System.Data.SqlClient;\n\n  public abstract class SqlPersistentObject\
  \ {\n\n    public enum STATE {NEW, LOAD, DELETE, DELETED};\n\n    STATE state;\n\
  \n    SqlDataAdapter adapter;\n    DataSet ds;\n    object pk;\n    Hashtable columns\
  \ = new Hashtable();\n\n    public SqlPersistentObject() {\n      state = STATE.NEW;\n\
  \    }\n\n    public void save(SqlConnection conn) {\n      if (state == STATE.NEW)\
  \ {\n        Insert(conn);\n      } else if (state == STATE.LOAD) {\n        Update(conn);\n\
  \      } else if (state == STATE.DELETE) {\n        Delete(conn);\n      }\n   \
  \ }\n\n    public object GetField(string columnName) {\n      if (state != STATE.NEW)\
  \ {\n        DataRow row =\n        ds.Tables[GetTableName()].Rows.Find((string)pk);\n\
  \        return row[columnName];\n      }else {\n        return columns[columnName];\n\
  \      }\n    }\n\n    public void markDelete() {\n      if (state == STATE.LOAD)\
  \ {\n        state = STATE.DELETE;\n      }\n    }\n\n    //设置对象字段的值\n    public\
  \ void SetField(string columnName, object val) {\n      if (state != STATE.NEW )\
  \ {\n        DataRow row =\n        ds.Tables[GetTableName()].Rows.Find((string)pk);\n\
  \        row[columnName] = val;\n      } else {\n        columns.Remove(columnName);\n\
  \        columns.Add(columnName, val);\n      }\n    }\n\n    //从数据库中删除对象\n    protected\
  \ virtual void Delete(SqlConnection conn) {\n      object pk = GetField(GetPrimaryKey());\n\
  \n      try {\n        string query = \"DELETE * FROM \"+GetTableName() +\"\n  \
  \        WHERE\n          \"+GetPrimaryKey()+\" = '\"+pk+\"'\";\n        adapter.DeleteCommand\
  \ = new SqlCommand(query, conn);\n        DataRow row =\n          ds.Tables[GetTableName()].Rows.Find((string)pk);\n\
  \        row.Delete();\n        adapter.Update(ds, GetTableName());\n\n        adapter\
  \ = null;\n        ds = null;\n        state = STATE.DELETED;\n\n        } catch\
  \ (Exception e) {\n        Console.WriteLine(e.StackTrace);\n      }\n    }\n\n\
  \    public static void Load(SqlConnection conn,\n                          SqlPersistentObject\
  \ obj, string pk) {\n\n      try {\n        string query = \"SELECT * FROM \"+obj.GetTableName()\
  \ +\"\n                   WHERE \"+obj.GetPrimaryKey()+\" = '\"+pk+\"'\";\n    \
  \    obj.adapter = new SqlDataAdapter (query, conn);\n        obj.ds = new DataSet(obj.GetTableName());\n\
  \        obj.adapter.MissingSchemaAction =\n          MissingSchemaAction.AddWithKey;\n\
  \        obj.adapter.Fill(obj.ds, obj.GetTableName());\n        obj.state = STATE.LOAD;\n\
  \        obj.pk = pk;\n      } catch (Exception e) {\n        Console.WriteLine(e.StackTrace);\n\
  \      }\n    }\n\n    //更新对象\n    protected virtual void Update(SqlConnection conn)\
  \ {\n\n      try {\n        if (ds != null && adapter != null) {\n          SqlCommandBuilder\
  \ builder = new\n                                   SqlCommandBuilder(adapter);\n\
  \          adapter.Update(ds, GetTableName());\n        }\n      } catch (Exception\
  \ e) {\n        Console.WriteLine(e.StackTrace);\n      }\n    }\n\n    protected\
  \ void Insert(SqlConnection conn) {\n\n      try {\n\n        string query = \"\
  SELECT * FROM \"+GetTableName();\n        adapter = new SqlDataAdapter (query, conn);\n\
  \        ds = new DataSet();\n\n        adapter.MissingSchemaAction =\n        \
  \  MissingSchemaAction.AddWithKey;\n        adapter.Fill(ds, GetTableName());\n\
  \        DataRow row = ds.Tables[GetTableName()].NewRow();\n        foreach (object\
  \ key in columns.Keys) {\n          row[key.ToString()] = columns[key];\n      \
  \  }\n\n        ds.Tables[GetTableName()].Rows.Add(row);\n\n        SqlCommandBuilder\
  \ builder = new\n          SqlCommandBuilder(adapter);\n        adapter.Update(ds,\
  \ GetTableName());\n\n        state = STATE.LOAD;\n      } catch (Exception e) {\n\
  \    ds = null;\n    adapter = null;\n        Console.WriteLine(e.ToString());\n\
  \      }\n    }\n\n    //抽象方法\n    public abstract string GetTableName();\n    public\
  \ abstract string GetPrimaryKey();\n  }\n\n}\n```\n\n## `PersistentObject` 类的核心假设\n\
  \n`PersistentObject` 类背后的关键假设是它映射到关系数据库管理系统（RDBMS）中的单个表。当对象映射到 RDBMS 时，通常假设表的单行映射到对象的单个实例，并且该行的主键值成为该持久化对象的对象\
  \ ID。对象 ID 用于标识对象（例如，在对象缓存中），就像主键帮助标识表中的行一样。为简单起见，我们假设对象的主键或对象 ID 是一个简单的单列实体。\n\n\
  `PersistentObject` 类利用存储在 `DataSet` 和 `SqlDataAdapter` 对象中的信息，并提供面向对象的 API 来操作它们。\n\
  \n## 对象状态定义\n\n我们首先定义对象的状态：\n\n```csharp\npublic enum STATE {NEW, LOAD, DELETE,\
  \ DELETED};\n```\n\n当对象首次构造时，其状态为 `NEW`。当对象从数据库加载时，其状态为 `LOAD`。当对象被标记为删除时，其状态为 `DELETE`，当对象被删除后，其状态为\
  \ `DELETED`。对象的 `save` 方法驱动对象的主流程：\n\n```csharp\npublic void save(SqlConnection\
  \ conn) {\n  if (state == STATE.NEW) {\n    Insert(conn);\n  } else if (state ==\
  \ STATE.LOAD) {\n    Update(conn);\n  } else if (state == STATE.DELETE) {\n    Delete(conn);\n\
  \  }\n}\n```\n\n这个逻辑相当直观。对处于 `NEW` 状态的对象执行的任何 DML 操作都被解释为插入；对处于 `LOAD` 状态的对象执行的操作被解释为更新。`Insert`\
  \ 和 `Update` 方法在成功完成后设置对象的相应状态。`Update` 方法仅通过 `SetField` 方法更新对 `DataSet` 所做的更改：\n\
  \n```csharp\nprotected virtual void Update(SqlConnection conn) {\n  try {\n    if\
  \ (ds != null && adapter != null) {\n      SqlCommandBuilder builder = new SqlCommandBuilder(adapter);\n\
  \      adapter.Update(ds, GetTableName());\n    }\n  }catch (Exception e) {\n  \
  \  Console.WriteLine(e.StackTrace);\n  }\n}\n```\n\n`SetField` 方法很有趣，因为如果对象处于 `NEW`\
  \ 状态，`SetField` 仅将 `columnNames` 和值添加到 `Hashtable` 中。请注意，在 C# 中，对于 `Hashtable`，拥有键和值不会覆盖该键的旧值（如果存在）。为了模拟这种类似\
  \ Java 的行为，我们先移除键，然后重新添加它：\n\n```csharp\ncolumns.Remove(columnName);\ncolumns.Add(columnName,\
  \ val);\n```\n\n如果对象不处于 `NEW` 状态，则将值设置为 `DataSet` 的适当行/列组合。请记住，此对象对应的行是通过对象 ID 或主键获取的。\n\
  \n```csharp\nDataRow row = ds.Tables[GetTableName()].Rows.Find((string)pk);\nrow[columnName]\
  \ = val;\n```\n\n## 对象加载与缓存\n\n当使用 `Load` 静态方法加载对象时，它会将对象的状态标记为 `LOAD`。一旦加载，对象会缓存\
  \ `DataSet`、`SqlDataAdapter` 和主键值。每次检索这些信息开销相当大，因此在第一次加载对象时缓存它们是有意义的。\n\n```csharp\n\
  obj.adapter = new SqlDataAdapter (query, conn);\nobj.ds = new DataSet(obj.GetTableName());\n\
  obj.pk = pk;\n```\n\n## 对象插入\n\n对于对象的插入，你需要一个从列名到列值的 `Hashtable`。这在 `Insert` 方法中用于创建\
  \ `DataSet` 和 `SqlDataAdapter`。如果插入成功，`Hashtable` 可以重用 `DataSet` 和 `SqlDataAdapter`\
  \ 进行未来的更新。\n\n```csharp\nstring query = \"SELECT * FROM \"+GetTableName();\nadapter\
  \ = new SqlDataAdapter (query, conn);\nds = new DataSet();\nadapter.MissingSchemaAction\
  \ = MissingSchemaAction.AddWithKey;\nadapter.Fill(ds, GetTableName());\nDataRow\
  \ row = ds.Tables[GetTableName()].NewRow();\nforeach (object key in columns.Keys)\
  \ {\n  row[key.ToString()] = columns[key];\n}\nds.Tables[GetTableName()].Rows.Add(row);\n\
  SqlCommandBuilder builder = new SqlCommandBuilder(adapter);\nadapter.Update(ds,\
  \ GetTableName());\nstate = STATE.LOAD;\n```\n\n\n\n\n\n## 关于 `Insert` 方法的说明\n\n\
  请注意 `Insert` 方法如何将对象的状态设置为 `LOAD`。\n\n### 清单 19.11：`SqlPersistentObject` 的子类\n\n\
  清单 19.11 展示了一个映射到 `Customers` 表的子类，并演示了如何使用 `SqlPersistentObject` 来加载和保存对象。\n\n\
  ##### 清单 19.11\\. `SqlPersistentObject` 的子类，源自清单 19.10 (C#)\n\n```\nnamespace DietPersistentFrameWork\
  \ {\n\n  using System;\n  using System.Data;\n  using System.Data.SqlClient;\n\n\
  \  public class Customer : SqlPersistentObject {\n\n    public override string GetTableName()\
  \ { return \"CUSTOMERS\"; }\n\n    public override string GetPrimaryKey(){ return\n\
  \"CUSTOMERID\"; }\n\n    public static void Main(string[] args) {\n      SqlConnection\
  \ conn = GetConnection();\n      try {\n        //LOAD CUSTOMER\n        Customer\
  \ cust = new Customer();\n        SqlPersistentObject.Load(conn, cust, \"ANATR\"\
  );\n        Console.WriteLine(cust.GetField(\"CustomerId\"));\n        //UPDATE\
  \ CUSTOMER\n        SqlPersistentObject.Load(conn, cust, \"ANATR\");\n        cust.SetField(\"\
  ContactTitle\", \"CTO\");\n        cust.save(conn);\n        //INSERT NEW CUSTOMER\n\
  \        cust = new Customer();\n        cust.SetField(\"CustomerID\", \"C3P0\"\
  );\n        cust.SetField(\"CompanyName\", \"ACME\");\n        cust.SetField(\"\
  ContactTitle\", \"Super Owner\");\n        cust.save(GetConnection());\n\n     \
  \ } finally {\n         conn.Close();\n    }\n  }\n\n    public static SqlConnection\
  \ GetConnection() {\n      SqlConnection conn = new SqlConnection ();\n      conn.ConnectionString\
  \ = \"Initial Catalog=Northwind;Data\n                   Source=localhost;Integrated\
  \ Security=SSPI;\";\n      conn.Open();\n      return conn;\n    }\n  }\n}\n```\n\
  \n由于持久化和加载对象的大部分复杂性都由超类处理，因此子类的规范变得非常简单。事实上，`Customer` 对象只有两个方法，分别返回表名和主键列名：\n\n\
  ```\npublic void SetField(string columnName, object val) {\n  if (state != STATE.NEW\
  \ ) {\n    DataRow row = ds.Tables[GetTableName()].Rows.Find((\n               \
  \                                     string)pk);\n      row[columnName] = val;\n\
  \  } else {\n    columns.Remove(columnName);\n    columns.Add(columnName, val);\n\
  \  }\n}\n```\n\n如果对象不处于 `NEW` 状态，则返回 `DataSet` 中相应行/列组合的值。\n\n### 19.5\\. 总结\n\n\
  ADO.NET 和 JDBC 都提供了用于访问任何数据存储的统一 API。JDBC API 主要面向关系数据库管理系统（RDBMS），而 ADO.NET 可用于从文本或\
  \ XML 流访问数据。\n\nADO.NET 的两个关键概念是 .NET 数据提供程序和 `DataSet` 类。.NET 数据提供程序是一组用于与数据源交互的类。.NET\
  \ 数据提供程序包含所有用于连接数据库、检索数据以及在底层 RDBMS 上运行 DML 的类。\n\n`DataSet` 类是底层 RDBMS 的内存中非连接表示。`DataSet`\
  \ 对象可用于以编程方式运行数据定义语言（DDL）和数据修改语言（DML）的子集。您可以使用 `DataSet` 对象生成整个数据库。\n\n尽管本章没有讨论\
  \ JDBC，但可以对 JDBC 和 ADO.NET 进行以下观察。\n\n*   JDBC 和 ADO.NET 提供了用于抽象使用连接对象连接数据库概念的 API。两者都支持连接池。\n\
  *   JDBC 不区分不同的 RDBMS，而 .NET 为 Microsoft SQL Server 数据库提供了单独的提供程序，以便可以优化对该数据库的访问。\n\
  *   JDBC 和 ADO.NET 提供了一种用于分页和滚动浏览选择查询结果的数据结构。（`ResultSet` 是 Java 对象，`DataReader`\
  \ 是 ADO.NET 对象。）\n*   JDBC 和 ADO.NET 提供了用于编译 SQL 语句的对象，这些语句可用于运行选择、更新、插入和删除查询。（在\
  \ Java 中，该对象是 `PreparedStatement`；在 ADO.NET 中是 `Command`。）\n*   JDBC 3.0 的 `RowSet`\
  \ 对象大致等同于 `DataSet` 对象，尽管 `DataSet` 对象在详细定义表结构和表关系的元数据方面更进一步。\n*   JDBC 通过关闭连接对象上的自动提交来支持简单的数据库事务。ADO.NET\
  \ 提供了一个用于划分简单数据库事务的一流对象。两者都提供保存点。\n*   JDBC 通过单独的类支持数据库元数据和结果集元数据。ADO.NET 帮助您使用\
  \ `DataSet` 对象探索元数据。\n*   .NET `DataSet` 可以序列化为 XML 流。\n*   JDBC 和 .NET（通过 .NET\
  \ 的 `DataSet`）都支持批量更新。\n\n## 第 20 章\\. 处理 XML\n\n与流行的 HTML 一样，可扩展标记语言（XML）由标记的、人类可读的文本组成。与\
  \ HTML 不同，XML 文档中的标签遵循一个简单的规则：对于每个开始标签 `<tag>`，都有一个结束标签 `</tag>`。每个开始标签都有结束标签的 XML\
  \ 文档被称为格式良好的。\n\n只要 XML 文档格式良好，您可以以任何方式创建标签。XML 文档通常由 XML 解析器解析，该解析器创建一个内存中的逻辑数据结构来导航文档。有不同类型的\
  \ XML 解析器。最常见的解析器通常不关心标签是什么，只要它们格式良好。有时解析器可以根据一组规则验证 XML 文档，将文档限制为仅特定子集的标签。这种解析器称为验证解析器。\n\
  \n解析 XML 文档的两种最流行的机制是创建文档对象模型（DOM）树或使用基于事件的简单 XML API（SAX）模型。XML 文档可以针对 DTD（定义 XML\
  \ 标签类型和结构的规则集）或 XML 模式进行验证。\n\n本章介绍 C# 用于 DOM 和 SAX 解析 XML 文档的 API。我们研究针对 DTD 验证\
  \ XML 文档。我们还研究 .NET API 中内置的其他实用程序，如 XPath 和可扩展样式表转换（XSLT）。\n\n### 20.1\\. Java\
  \ 中的 XML 支持\n\n长期以来，XML 并未内置于 Java API 中。对 XML 的支持主要通过第三方库（如 Apache Xerces 或 JDOM）。幸运的是，这种情况已经改变，现在您可以获得\
  \ Java XML Pack，这是一个用于处理 Java 中所有 XML 的工具集。XML Pack 汇集了几个关键的行业 XML 标准，如 SAX、DOM、XSLT、SOAP、通用描述、发现和集成（UDDI）、使用可扩展标记语言的电子商务（ebXML）和\
  \ Web 服务描述语言（WSDL）。两种常见的编程 XML API（SAX 和 DOM）现在已内置于核心 Java API 中（从 J2SE 1.4.0 开始）。\n\
  \nSAX 解析器是一种事件驱动的解析器，当它遇到 XML 元素时会触发事件。用户编写内容处理程序，他们可以将其注册到解析器。内容处理程序类似于事件监听器，可以在遇到特定\
  \ XML 标签时采取适当的操作。SAX 解析器基于推送模型，其中解析器将事件推送到内容处理程序。\n\nDOM 解析器将 XML 解析为内存中的树数据结构（也称为\
  \ DOM 树）。文档对象模型（DOM）是用于有效 HTML 和格式良好的 XML 文档的 API。它定义了文档的逻辑结构以及文档的访问和操作方式。在 DOM\
  \ 规范中，“文档”一词被广泛使用；XML 越来越多地被用作表示可能存储在不同系统中的多种信息的方式。其中大部分传统上被视为数据而非文档。尽管如此，XML 将这些数据呈现为文档，DOM\
  \ 可用于管理这些数据。\n\n\n\n\n通过文档对象模型，程序员可以构建文档、导航其结构，并添加、修改或删除元素和内容。HTML 或 XML 文档中的任何内容都可以通过\
  \ DOM 进行访问、更改、删除或添加。DOM 是 W3C 规范（[`www.w3.org/TR/2000/REC-DOM-Level-2-Core-20001113/`](http://www.w3.org/TR/2000/REC-DOM-Level-2-Core-20001113/)）。JDOM（[`www.jdom.org`](http://www.jdom.org)）API\
  \ 是处理 XML DOM 的较简单 API 之一。\n\n### 20.2. XML 与.NET\n\n由于其可扩展性，XML 可用于多种用途。现代应用程序将\
  \ XML 用作消息协议、传输协议，甚至用于后端数据存储。.NET 平台在 ASP.NET、Web 服务等方面将 XML 作为其关键技术。.NET Framework\
  \ 的 XML 类也与托管数据访问（ADO.NET）紧密耦合。传统上，处理关系型数据与层次型数据总是有不同的编程模型。然而，.NET 平台允许将关系型数据透明地转换为\
  \ XML，反之亦然。这使得检索关系型 ADO.NET 数据集并使用 DOM 遍历它、使用 XPath 1.0 查询或导航它、以及使用 XSLT 1.0 转换它成为可能。\n\
  \n如前所述，用于解析 XML 文档的主要语言中立 API 是 DOM 和 SAX API。DOM API 将 XML 文档存储在树数据结构中，从而允许完全导航所有元素（无特定顺序）。用户可以修改\
  \ DOM 树。该 API 非常方便，但在处理大型文档时可能会消耗大量内存。\n\nSAX API 的开发是为了弥补 DOM API 的缺陷。SAX API 使用事件驱动模型，其中解析\
  \ XML 文档的每个字符都通过事件监听器处理。解析器仅单向解析文档。SAX API 将处理文档解析状态的责任放在最终用户身上，因此本质上难以使用且笨拙。\n\n\
  .NET XML 类支持 DOM 和类 SAX API。.NET 中的类 SAX API 是对传统 SAX 模型的改进，因为它在解析过程中给予最终用户更多控制权。.NET\
  \ 版本的 SAX 所使用的所谓拉取模型允许程序员跳过文档的某些部分，仅处理文档的某些元素，并与文档进行更多交互。可以说，.NET 的 SAX 介于 DOM 和纯\
  \ SAX 之间。它将 DOM 的便利性与纯 SAX API 的强大功能相结合。\n\n.NET XML 类分布在表 20.1 所示的命名空间中。\n\n我们将查看`System.Xml`和`System.Xml.XPath`命名空间中的类。\n\
  \n### 20.3. 读写 XML\n\n.NET Framework XML 类的核心是两个抽象类：`XmlReader`和`XmlWriter`。它们位于`System.Xml`命名空间中。\n\
  \n`XmlReader`提供了一个快速、只进、只读的游标，用于处理 XML 文档流。`XmlWriter`提供了一个用于生成 XML 文档流的接口。这两个类都暗示了一种流式模型，不需要昂贵的内存缓存。这使得它们都成为经典\
  \ DOM 方法的有吸引力的替代方案。`XmlReader`和`XmlWriter`都是抽象基类，定义了所有派生类必须支持的功能。\n\n表 20.1. .NET\
  \ XML 命名空间\n\n| 命名空间 | 描述 |\n| --- | --- |\n| `System.Xml` | 包含读写 XML 文档所需的核心类。\
  \ |\n| `System.Xml.Schema` | 包含提供基于标准的 XML Schema 定义语言（XSD）模式支持的 XML 类。支持的标准如下：<br>\
  \ *   XML 结构模式（[`www.w3.org/TR/xmlschema1/`](http://www.w3.org/TR/xmlschema1/)）支持模式映射和验证。<br>\
  \ *   XML 数据类型模式（[`www.w3.org/TR/xmlschema2/`](http://www.w3.org/TR/xmlschema2/)）支持\
  \ XML 模式定义的数据类型。 |\n| `System.Xml.Serialization` | 包含用于将对象序列化和反序列化为 XML 格式文档或流的类。\
  \ |\n| `System.Xml.XPath` | 包含 XPath 解析器和求值引擎。它支持 W3C XML 路径语言（XPath）1.0 推荐标准（[www.w3.org/TR/xpath](http://www.w3.org/TR/xpath)）。\
  \ |\n| `System.Xml.Xsl` | 提供对 XSLT 转换的支持。也支持 W3C XSL 转换（XSLT）1.0 推荐标准（[www.w3.org/TR/xslt](http://www.w3.org/TR/xslt)）。\
  \ |\n\n`XmlReader`有三个具体实现：\n\n1.  `XmlTextReader`。此类提供对基于文本的 XML 数据流的只进、只读访问。使用任何读取方法推进读取器，属性反映当前节点（读取器定位的节点）的值。此类不提供数据验证。它非常适合快速解析格式良好的\
  \ XML 文本。它使用 DTD 检查 XML 是否格式良好，但不使用 DTD 进行验证。\n2.  `XmlNodeReader`。此类读取 XML DOM\
  \ 子树。它不支持 DTD 或模式验证。\n3.  `XmlValidatingReader`。此类表示一个提供 DTD、XML 数据精简（XDR）模式和 XML\
  \ Schema 定义语言（XSD）模式验证的读取器。\n\n`XmlTextWriter`类是一个写入器，提供了一种快速、非缓存、只进的方式来生成包含 XML\
  \ 数据的流或文件。\n\n对于本章的示例，我们假设 XML 文档存储在名为`people.xml`的文件中，其内容如清单 20.1 所示。\n\n#####\
  \ 清单 20.1. 示例 XML 文档（C#）\n\n```\n<People>\n  <Person id=\"1\" ssn=\"555121212\"\
  >\n    <Name>\n      <FirstName>Joe</FirstName>\n      <LastName>Suits</LastName>\n\
  \    </Name>\n    <Address>\n      <Street>1800 Success Way</Street>\n      <City>Redmond</City>\n\
  \      <State>WA</State>\n      <ZipCode>98052</ZipCode>\n    </Address>\n    <Job>\n\
  \      <Title>CEO</Title>\n      <Description>Wears the nice suit</Description>\n\
  \    </Job>\n  </Person>\n\n  <Person id=\"2\" ssn=\"666131313\">\n    <Name>\n\
  \      <FirstName>Linda</FirstName>\n      <LastName>Sue</LastName>\n    </Name>\n\
  \    <Address>\n      <Street>1302 American St.</Street>\n      <City>Paso Robles</City>\n\
  \      <State>CA</State>\n      <ZipCode>93447</ZipCode>\n    </Address>\n    <Job>\n\
  \      <Title>Attorney</Title>\n      <Description>Stands up for justice</Description>\n\
  \    </Job>\n  </Person>\n\n  <Person id=\"3\" ssn=\"777141414\">\n    <Name>\n\
  \      <FirstName>Jeremy</FirstName>\n      <LastName>Boards</LastName>\n    </Name>\n\
  \    <Address>\n      <Street>34 Palm Avenue</Street>\n      <City>Waikiki</City>\n\
  \      <State>HI</State>\n      <ZipCode>98052</ZipCode>\n    </Address>\n    <Job>\n\
  \      <Title>Pro Surfer</Title>\n      <Description>Rides the big waves</Description>\n\
  \    </Job>\n  </Person>\n\n  <Person id=\"4\" ssn=\"888151515\">\n    <Name>\n\
  \      <FirstName>Joan</FirstName>\n      <LastName>Page</LastName>\n    </Name>\n\
