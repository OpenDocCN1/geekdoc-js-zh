  | 属性数量 | 47 |\n| 字段数量 | 6 |\n| 接口数量 | 2 |\n| 属性数量 | 1 |\n\n### 22.2. 浏览和查询成员\n\n\
  如你所见，有 124 个方法需要浏览，要找到具有正确签名的正确方法很快就会变得乏味。与 Java 不同，C#提供了一个 API，允许你根据某些标准选择和搜索一组成员。你指定的标准通常是成员定义之前的成员修饰符；例如`static`、`public`和`private`方法、字段和构造函数。\n\
  \n清单 22.2 展示了如何浏览和查询任何 C#类型的字段和方法。`MemberInfo`类的`FindMembers`方法可用于缩小搜索范围。该方法的参数是`MemberTypes`、`BindingFlags`、`MemberFilter`和`Object`。让我们进一步探讨这些参数的含义：\n\
  \n*   `MemberTypes`是一个对象，指示要搜索的成员类型。这些包括`All`、`Constructor`、`Custom`、`Event`、`Field`、`Method`、`Nestedtype`、`Property`和`TypeInfo`。我们还将使用`MemberTypes.Method`来查找方法。`BindingFlags`是一个枚举，控制反射进行搜索的方式。有非常多的`BindingFlag`值，包括`IgnoreCase`、`Instance`、`Public`、`Static`等等。`BindingFlags`的默认成员表示没有绑定标志，这正是我们想要的，因为我们不想限制绑定。\n\
  \n*   `MemberFilter`是一个委托，用于过滤`MemberInfo`对象数组中的成员列表。我们将使用的过滤器是`Type.FilterName`，这是`Type`类的一个字段，用于按名称过滤。\n\
  \n*   `Object`是一个字符串值，将由过滤器使用。在这种情况下，我们传递`\"Get*\"`以仅匹配以字母`Get`开头的方法。\n\n##### 清单\
  \ 22.2. 浏览和查询类型的字段和方法 (C#)\n\n|  \n\n\n\n\n\n# 22.2. 使用反射查询类型成员\n\n```csharp\nusing\
  \ System;\nusing System.Reflection;\n\nclass FieldTest {\n\n  public static void\
  \ Main(string[] args) {\n\n    Type t = Type.GetType(args[0]);\n    QueryFields(t);\n\
  \    QueryMethods(t);\n  }\n\n  private static void QueryFields(Type t) {\n    //获取字段\n\
  \    FieldInfo[] f = t.GetFields();\n    Display(\"获取字段 \", f);\n    //默认字段\n  \
  \  f = t.GetFields(BindingFlags.Default);\n    Display(\"默认 \", f);\n    //查找所有公共实例字段\n\
  \    f = t.GetFields(BindingFlags.Public | BindingFlags.Instance);\n    Display(\"\
  公共和实例 \", f);\n    //查找所有非公共实例字段\n    f = t.GetFields(BindingFlags.Instance | BindingFlags.NonPublic);\n\
  \    Display(\"非公共和实例 \", f);\n    //查找所有公共静态字段\n    f = t.GetFields(BindingFlags.Static\
  \ | BindingFlags.Public);\n    Display(\"静态和公共 \", f);\n    //查找所有非公共静态字段\n    f\
  \ = t.GetFields(BindingFlags.Static | BindingFlags.NonPublic);\n    Display(\"静态和非公共\
  \ \", f);\n    //查找所有公共的仅声明字段\n    f = t.GetFields(BindingFlags.DeclaredOnly | BindingFlags.NonPublic);\n\
  \    Display(\"公共和仅声明 \", f);\n    //查找所有字段\n    MemberInfo[] m =\n      t.FindMembers(MemberTypes.Field,\n\
  \        BindingFlags.Default, Type.FilterName, \"Get*\");\n    Display(\"找到的字段成员\"\
  , m);\n  }\n\n  private static void QueryMethods(Type t) {\n    //获取方法\n    MethodInfo[]\
  \ f = t.GetMethods();\n    Display(\"获取方法 \", f);\n    //默认方法\n    f = t.GetMethods(BindingFlags.Default);\n\
  \    Display(\"默认 \", f);\n    //查找所有公共实例方法\n    f = t.GetMethods(BindingFlags.Public\
  \ | BindingFlags.Instance);\n    Display(\"公共和实例 \", f);\n    //查找所有非公共实例方法\n  \
  \  f = t.GetMethods(BindingFlags.Instance | BindingFlags.NonPublic);\n    Display(\"\
  非公共和实例 \", f);\n    //查找所有公共静态方法\n    f = t.GetMethods(BindingFlags.Static | BindingFlags.Public);\n\
  \    Display(\"静态和公共 \", f);\n    //查找所有非公共静态方法\n    f = t.GetMethods(BindingFlags.Static\
  \ | BindingFlags.NonPublic);\n    Display(\"静态和非公共 \", f);\n    //查找所有公共的仅声明方法\n\
  \    f = t.GetMethods(BindingFlags.DeclaredOnly | BindingFlags.NonPublic);\n   \
  \ Display(\"公共和仅声明 \", f);\n    //查找所有方法\n    MemberInfo[] m =\n          t.FindMembers(MemberTypes.Method,\n\
  \            BindingFlags.Default, Type.FilterName, \"Get*\");\n    Display(\"找到的方法成员\"\
  , m);\n  }\n\n  private static void Display(String msg, MemberInfo[] fields) {\n\
  \    Console.WriteLine(\"--------\");\n    Console.WriteLine(msg);\n    Console.WriteLine(\"\
  --------\");\n    foreach (MemberInfo f in fields) {\n      Console.WriteLine(f.Name);\n\
  \    }\n  }\n\n}\n```\n\n要运行 清单 22.2，我们传递一个命令行参数：\n\n```\nC:\\>Reflection System.Type\n\
  ```\n\n以下是 清单 22.2 的输出摘录：\n\n```\n--------\n获取字段\n--------\nFilterAttribute\nFilterName\n\
  FilterNameIgnoreCase\nMissing\nDelimiter\nEmptyTypes\n...\n--------\n静态和非公共\n--------\n\
  ResolveTypeRelativeTo\nResolveTypeRelativeTo\nResolveTypeRelativeToBaseTypes\n--------\n\
  ```\n\n为了只打印名称，我们使用泛型 `MemberInfo[]` 来处理 `FieldInfo[]` 和 `MethodInfo[]` 集合。我们可以通过\
  \ `MemberInfo` 类的 `MemberType` 属性来找出成员的类型。\n\n清单 22.2 处理的是通过浏览或调用 `FindMembers`\
  \ 方法来获取成员（字段或方法）的集合。然而，有时需要深入到一个特定的方法。清单 22.3 展示了如何使用 `GetMethod` 来查找一个特定的方法。同样的调用也可以用来获取一个类型的特定字段、属性或构造函数。使用反射来获取一个类型的特定成员需要知道该成员的存在；否则，将会发生异常。\n\
  \n##### 清单 22.3. 获取类型的特定方法 (C#)\n\n```csharp\nusing System;\nusing System.Reflection;\n\
  \nclass SpecificMethodTest {\n\n  public static void Main(string[] args) {\n\n \
  \   Type t = typeof(System.String);\n    DoMethod(t);\n  }\n\n  private static void\
  \ DoMethod(Type t) {\n    //仅使用名称获取方法。\n    //这将引发异常\n    //因为 ToUpper 是重载的。下面的调用\n\
  \    //对于要返回哪个\n    //重载方法是模糊的。\n    MethodInfo m = null;\n    try {\n      m =\
  \ t.GetMethod(\"ToUpper\");\n    } catch (Exception e) {\n      Console.WriteLine(e.Message);\n\
  \    }\n    //仅使用名称获取方法。名称\n    //区分大小写，因此需要确切的名称。\n    //被调用的方法不能是重载的。\n    m =\
  \ t.GetMethod(\"Remove\");\n    Console.WriteLine(\"默认的 Remove 方法 \");\n    //使用名称及其\n\
  \    //接受的参数类型来获取重载方法。\n    Type[] ta = new Type[] { typeof(int), typeof(char) };\n\
  \    m = t.GetMethod(\"PadLeft\", ta);\n    Console.WriteLine(\"带参数的 PadLeft 方法\
  \ \");\n    //调用一个不带参数的方法\n    Type[] noparams = new Type[0];\n    m = t.GetMethod(\"\
  ToUpper\", noparams);\n    Console.WriteLine(\"不带参数的 ToUpper 方法 \");\n    //调用一个不带参数的方法\n\
  \    m = t.GetMethod(\"Remove\", noparams);\n    Console.WriteLine(\"不带参数的 Remove\
  \ 方法 \" + (m == null));\n  }\n\n}\n```\n\n清单 22.3 的输出如下：\n\n```\n找到歧义匹配。\n默认的 Remove\
  \ 方法 System.String Remove(Int32, Int32)\n带参数的 PadLeft 方法 System.String PadLeft(Int32,\
  \ Char)\n不带参数的 ToUpper 方法 System.String ToUpper()\n不带参数的 Remove 方法 True\n```\n\n\
  清单 22.3 中的以下摘录特别有趣。我们知道 `System.String` 类中只有一个 `Remove` 方法，它接受两个参数，而我们正试图获取一个不带参数的\
  \ `Remove` 方法。\n\n```csharp\n//调用一个不带参数的方法\nm = t.GetMethod(\"Remove\", noparams);\n\
  Console.WriteLine(\"不带参数的 Remove 方法 \" + (m == null));\n```\n\n`System.String` API\
  \ 中不存在这样的方法，运行时没有抛出异常，而是返回了一个“null”的 `MethodInfo` 对象。这对于习惯于在方法未找到时抛出异常的 Java 程序员来说可能有点令人困惑。\n\
  \n请注意，在反射 API 中，搜索和查询方法——例如 `GetMethod(s)`、`GetConstructor(s)`、`GetMember(s)`、`GetField(s)`\
  \ 和 `GetProperties`——不会抛出 `NoSuchMemberException` 或其派生类；相反，如果未找到成员或该类型未定义该成员，它们会返回一个\
  \ `null` 对象。这种方法与 Java 世界有些不同，在 Java 中，当找不到特定类的成员（字段、方法或构造函数）时，会抛出一个受检异常（`java.lang.NoSuchMethodException`\
  \ 或 `java.lang.NoSuchFieldException`）。我们将把哪种方式在哲学上更合理——返回 `null` 还是抛出异常——留给语言专家去辩论。习惯于使用异常进行控制流的\
  \ Java 程序员应该意识到 C# 中的这个细微差别。\n\n### 22.3. 调用方法以及设置字段和属性\n\n\n\n\n\n# 反射的真正力量：调用与设置\n\
  \n到目前为止，我们已经了解了如何查询、搜索和检索特定的类型成员或类型成员集合。反射的真正力量在于调用这些方法和构造函数，以及设置这些属性和字段。清单 22.4\
  \ 展示了对 `System.String` 类的调用操作。\n\n## 清单 22.4：使用反射进行调用操作 (C#)\n\n```csharp\nusing\
  \ System;\nusing System.Reflection;\n\nclass InvocationTest {\n\n  public static\
  \ void Main(string[] args) {\n\n    Type t = typeof (System.String);\n    CallConstructor(t);\n\
  \    CallMethod(t);\n    GetProperty(t);\n  }\n\n  private static void CallConstructor(Type\
  \ t) {\n    //Tried to get the default no-args public constructor.\n    // String\
  \ s = new String(char[] c);\n    ConstructorInfo constructor =null;\n    constructor\
  \ = t.GetConstructor(new Type[] {typeof\n                                      \
  \              (Char[])});\n    Char[] carr = new Char[] { 's', 'u', 'g', 'a', 'r'\
  \ };\n    object[] args = new object[1] {carr} ;\n    try {\n      Console.WriteLine(constructor.Invoke(args));\n\
  \    } catch (Exception e) {\n      Console.WriteLine(e.StackTrace);\n    }\n  }\n\
  \n  private static void CallMethod(Type t) {\n    MethodInfo method =null;\n   \
  \ String target = \"sugarless\";\n    method = t.GetMethod(\"Remove\");\n    object[]\
  \ args = new object[] {5,4};\n    Console.WriteLine(method.Invoke(target, args));\n\
  \  }\n\n  private static void GetProperty(Type t) {\n    PropertyInfo property =\
  \ null;\n    property = t.GetProperty(\"Length\");\n    String args = \"floccinaucinihipilification\"\
  ;\n    Console.WriteLine(property.GetValue(args, null));\n  }\n}\n```\n\n清单 22.4\
  \ 的输出如下：\n\n```\nsugar\nsugar\n27\n```\n\n## 使用反射查询内存中的集合\n\n为了真正领略反射的力量，我们将编写一个实用程序，让我们能够查询内存中的集合。`System.Collections`\
  \ 类（参见第 14 章）是类型无关的，因此它们可以用来保存任何类型的对象。使用反射，我们可以从集合中请求满足特定条件的对象。为简单起见，我们假设它是一个同构集合（只包含一种类型的对象）。清单\
  \ 22.5 展示了一个示例类，其对象将存储在集合中。\n\n### 清单 22.5：`Person` 类 (C#)\n\n```csharp\nusing System.Text;\n\
  \npublic class Person {\n\n  private string firstname;\n  private string lastname;\n\
  \  private int age;\n  private float salary;\n  private bool male;\n\n  public Person\
  \ (string fname, string lname,\n             int age, float salary, bool male) {\n\
  \    this.firstname = fname;\n    this.lastname = lname;\n    this.age = age;\n\
  \    this.salary = salary;\n    this.male = male;\n  }\n\n  public override string\
  \ ToString() {\n    StringBuilder builder = new StringBuilder();\n\n      builder.Append(firstname+\"\
  ,\"+lastname+\",\n                       \"+age+\",\"+salary+\",\"  ale);\n    return\
  \ builder.ToString();\n  }\n}\n```\n\n## `QueryList` 集合\n\n`QueryList` 集合背后的基本思想是能够从中查询满足特定条件的对象。例如，如果我们只在列表中存储\
  \ `Person` 对象，那么我们可以请求满足特定条件的 `Person`（例如，所有名字为 Jack 的人，所有工资 > $60000 的人，所有年龄在 40\
  \ 岁以下的男性）。清单 22.6 展示了 `QueryList` 类的主要部分。\n\n### 清单 22.6：`QueryList` 类 (C#)\n\n\
  ```csharp\nusing System;\nusing System.Collections;\nusing System.Reflection;\n\
  using System.Text;\npublic class QueryList : ArrayList {\n\npublic enum Operation\
  \ : int {\n    OBJECT_EQUALS = 1,\n    PRIMITIVE_EQUALS,\n    LESS_THAN_OR_EQUAL,\n\
  \    GREATER_THAN_OR_EQUAL,\n    LESS_THAN,\n    GREATER_THAN,\n    NOT_EQUALS\n\
  \  }\n\n  public QueryList() : base() {\n  }\n  public QueryList(ICollection coll):\
  \ base(coll) {\n  }\n  public QueryList(int size): base(size) {\n  }\n\n  public\
  \ QueryList GetList(string field, int val,\n                         Operation operation)\
  \ {\n    return _GetList(field, val, operation);\n  }\n  public QueryList GetList(string\
  \ field, bool val,\n                         Operation operation) {\n    return\
  \ _GetList(field, val, operation);\n  }\n  public QueryList GetList(string field,\
  \ float val,\n                                Operation operation) {\n    return\
  \ _GetList(field, val, operation);\n  }\n  public QueryList GetList(string field,\
  \ string val,\n                                Operation operation) {\n    return\
  \ _GetList(field, val, operation);\n  }\n  public QueryList GetList(string field,\
  \ int val) {\n    return _GetList(field, val, Operation.PRIMITIVE_EQUALS);\n  }\n\
  \  public QueryList GetList(string field, bool val) {\n    return _GetList(field,\
  \ val, Operation.OBJECT_EQUALS);\n  }\n  public QueryList GetList(string field,\
  \ float val ) {\n    return _GetList(field, val, Operation.PRIMITIVE_EQUALS);\n\
  \  }\n  public QueryList GetList(string field, string val) {\n    return _GetList(field,\
  \ val, Operation.OBJECT_EQUALS);\n  }\n  private QueryList _GetList(string field,\
  \ object val,\n                                       Operation oper) {\n    QueryList\
  \ list = new QueryList();\n    IEnumerator myEnumerator = GetEnumerator();\n   \
  \ while (myEnumerator.MoveNext()) {\n      object o = myEnumerator.Current;\n  \
  \    Type t = o.GetType();\n      FieldInfo info = t.GetField(field, BindingFlags.Public\
  \ &#124;\n          BindingFlags.NonPublic &#124; BindingFlags.Instance );\n   \
  \   object targetval = info.GetValue(o);\n      switch ((int)oper) {\n        case\
  \ (int)Operation.OBJECT_EQUALS: if\n          (val.Equals(targetval)) list.Add(o);\
  \ break;\n        case (int)Operation.PRIMITIVE_EQUALS : if\n          (val == targetval)\
  \ list.Add(o); break;\n        case (int)Operation.GREATER_THAN : if\n         \
  \ (!_IsBool(targetval.GetType()) &&\n          _GetDouble(targetval)\n         \
  \ > _GetDouble(val)) list.Add(o); break;\n        case (int)Operation.LESS_THAN\
  \ : if\n          (!_IsBool(targetval.GetType()) &&\n          _GetDouble(targetval)\
  \ < _GetDouble(val))list.Add(o);\n                                     break;\n\
  \        case (int)Operation.LESS_THAN_OR_EQUAL : if\n          (!_IsBool(targetval.GetType())\
  \ &&\n          _GetDouble(targetval) <=\n          _GetDouble(val)) list.Add(o);\
  \ break;\n        case (int)Operation.GREATER_THAN_OR_EQUAL : if\n          (!_IsBool(targetval.GetType())\
  \ &&\n          _GetDouble(targetval) >=\n          _GetDouble(val)) list.Add(o);\
  \ break;\n      }\n    }\n    return list;\n  }\n\n  private bool _IsBool(Type t)\
  \ {\n    return t.Equals(typeof (bool));\n  }\n\n  private double _GetDouble(object\
  \ o) {\n    return Double.Parse(o.ToString());\n  }\n\npublic override string ToString()\
  \ {\n  StringBuilder sbf = new StringBuilder();\n  IEnumerator myEnumerator = GetEnumerator();\n\
  \  while (myEnumerator.MoveNext()) {\n    sbf.Append(myEnumerator.Current.ToString()).Append(\"\
  \\n\");\n  }\n  return sbf.ToString();\n}\n}\n```\n\n`QueryList` 类扩展了 `ArrayList`。该类的\
  \ API 包含用于搜索集合的重载方法。调用的一般签名如下：\n\n```\nGetList ( String field, String value)\nGetList\
  \ ( String field, int value)\nGetList ( String field, float value)\nGetList ( String\
  \ field, bool value)\n```\n\n基本上，我们想要搜索集合中那些字段名 `\"field\"` 具有 value 参数指定值的对象。此调用可用于搜索简单条件。以下代码获取所有名字为\
  \ Jack 的人：\n\n```\nGetList (\"firstname\", \"jack\")\n```\n\n有一个三参数调用，如下所示：\n\n\
  ```\nGetList ( String field, int value, Operation oper)\nGetList ( String field,\
  \ float value, Operation oper)\n```\n\n其中 `Operation` 是一个公共枚举，指示支持的各种操作。\n\n因此，像所有工资\
  \ > 60000 的人这样的条件可以表示如下：\n\n```\nGetList (\"salary\", 60000, QueryList.Operation.GREATER_THAN);\n\
  ```\n\n\n\n\n\n## 22.3. 使用 `QueryList` 进行查询\n\n请注意，`GetList` 方法返回一个 `QueryList`。这意味着我们可以链式调用方法，从而组合查询条件。因此，要获取所有年龄小于\
  \ 40 岁的男性，我们首先找到所有男性，然后在该集合中找到年龄小于 40 岁的人：\n\n```\nGetList(\"male\", true).GetList(\"\
  age\", 40, QueryList.Operation.LESS_THAN);\n```\n\n这可能不是处理查询最高效的方式。然而，本练习的目的是展示反射如何使编写通用工具成为可能。\n\
  \n清单 22.7 展示了使用 `QueryList` 对象的驱动程序类。\n\n##### 清单 22.7. 执行 `QueryList` 工具的驱动程序类\
  \ (C#)\n\n```\nusing System;\nclass QueryListDriver {\n  public static void Main(string[]\
  \ args) {\n\n    QueryList list = new QueryList();\n    list.Add( new Person(\"\
  jack\", \"daniel\",26, 60000, true));\n    list.Add( new Person(\"bud\", \"weiser\"\
  ,33, 75000, true));\n    list.Add( new Person(\"jack\", \"monroe\",40, 150000, false));\n\
  \    list.Add( new Person(\"jack\", \"kennedy\",38, 100000, false));\n    list.Add(\
  \ new Person(\"ozzy\", \"ozbourne\",50, 200000, true));\n    list.Add( new Person(\"\
  pat\", \"boone\", 70, 40000, true));\n    list.Add( new Person(\"bill\", \"gates\"\
  , 45, 900000000,\n                                                        true));\n\
  \    list.Add( new Person(\"lady\", \"diana\", 36, 80000, false));\n\n    Console.WriteLine(\"\
  All people with firstname \\\"jack\\\"\");\n    Console.WriteLine(list.GetList(\"\
  firstname\",\"jack\"));\n\n    Console.WriteLine(\"All people with salary > 60000\
  \ \");\n    Console.WriteLine(list.GetList(\"salary\",60000,\n             QueryList.Operation.GREATER_THAN));\n\
  \    Console.WriteLine(\"All males less than 40 yrs of age \");\n    Console.WriteLine(list.GetList(\"\
  male\",true).GetList(\"age\",\n                        40, QueryList.Operation.LESS_THAN));\n\
  \  }\n}\n```\n\n清单 22.7 的输出如下：\n\n```\nAll people with firstname \"jack\"\njack,daniel,26,60000,True\n\
  jack,monroe,40,150000,False\njack,kennedy,38,100000,False\n\nAll people with salary\
  \ > 60000\nbud,weiser,33,75000,True\njack,monroe,40,150000,False\njack,kennedy,38,100000,False\n\
  ozzy,ozbourne,50,200000,True\nbill,gates,45,9E+08,True\nlady,diana,36,80000,False\n\
  \nAll males less than 40 yrs of age\njack,daniel,26,60000,True\nbud,weiser,33,75000,True\n\
  ```\n\n当你用数据库中的对象填充 `ArrayList`，并且不想为了获取同一列表的不同视图或子集而返回数据库时，可以使用 `QueryList` 类。例如，如果\
  \ `Person` 类映射到数据库行，一次性获取所有 `Person` 对象，然后使用 `QueryList` 类，将消除基于所用条件运行不同 select\
  \ 查询的需要。\n\n## 22.4. 使用反射发出生成动态 IL\n\n在 Java 中，可以动态生成源代码并将其编译为字节码。事实上，JSP 技术正是基于这一原理，JSP\
  \ 在运行时被编译为 servlet 类，然后由 JVM 运行。\n\n在 C# 中，你也可以在运行时生成代码并编译它。然而，C# 更进一步，提供了一个用于实际处理生成的\
  \ IL 的 API，这种能力被称为反射发出。这相当于一个操作字节码的 Java API。C# `System.Reflection.Emit` 命名空间中的类可用于以编程方式生成\
  \ IL 指令。\n\n为了更好地理解我们的意思，让我们看一个简单的例子。清单 22.8 是一个简单的类，运行时基本上在系统控制台上生成数字 3。这里我们实际上是在\
  \ IDE 中编写了 `SimpleClass` 类，编译并运行了它。\n\n##### 清单 22.8. 一个简单的类 (C#)\n\n```\nusing\
  \ System;\n\npublic interface ISimple {\n  int GetInt();\n}\n\npublic class SimpleClass\
  \ : ISimple {\n  public int GetInt() {\n    return 3;\n  }\n  public static void\
  \ Main(string[] args) {\n    ISimple sc = new SimpleClass();\n    Console.WriteLine(sc.GetInt());\n\
  \  }\n}\n```\n\n可以通过以编程方式定义 `SimpleClass` 而不是编写它来达到与清单 22.8 相同的结果。清单 22.9 展示了这样做的代码。\n\
  \n##### 清单 22.9. 使用反射发出以编程方式生成 `SimpleClass` (C#)\n\n```\nusing System;\nusing System.Diagnostics;\n\
  using System.Reflection;\nusing System.Threading;\nusing System.Reflection.Emit;\n\
  \npublic class Driver {\n  public interface ISimple {\n    int GetInt();\n  }\n\n\
  \  public static void Main(string[] args) {\n\n    AssemblyName assemblyName = new\
  \ AssemblyName( );\n    assemblyName.Name = \"GeneralAssembly\";\n    AssemblyBuilder\
  \ newAssembly =\n      Thread.GetDomain().DefineDynamicAssembly(\n      assemblyName,\
  \ AssemblyBuilderAccess.Run);\n    ModuleBuilder newModule =\n      newAssembly.DefineDynamicModule(\"\
  Simple\");\n\n    TypeBuilder myType =\n      newModule.DefineType(\n      \"SimpleClass\"\
  , TypeAttributes.Public);\n\n    myType.AddInterfaceImplementation(\n      typeof(ISimple));\n\
  \n    Type[] paramTypes = new Type[0];\n    Type returnType = typeof(int);\n   \
  \ MethodBuilder simpleMethod =\n      myType.DefineMethod(\n      \"GetInt\",\n\
  \      MethodAttributes.Public |\n      MethodAttributes.Virtual,\n      returnType,\n\
  \      paramTypes);\n    ILGenerator generator =\n      simpleMethod.GetILGenerator(\
  \ );\n\n    generator.Emit(OpCodes.Ldc_I4, 3);\n    generator.Emit(OpCodes.Ret);\n\
  \n    MethodInfo getIntInfo =\n      typeof(ISimple).GetMethod(\"GetInt\");\n\n\
  \    myType.DefineMethodOverride(simpleMethod, getIntInfo);\n    myType.CreateType(\
  \ );\n    ISimple sc =\n    (ISimple)newAssembly.CreateInstance(\"SimpleClass\"\
  );\n    Console.WriteLine(sc.GetInt());\n  }\n}\n```\n\n以编程方式定义类的第一步是定义将容纳该类的程序集和模块：\n\
  \n```\nAssemblyName assemblyName = new AssemblyName( );\nassemblyName.Name = \"\
  GeneralAssembly\";\n```\n\n`AssemblyName` 是一个完全描述程序集唯一标识的对象。程序集的标识由简单名称、版本号、加密密钥对和支持的区域性组成。\n\
  \n有了这个对象，我们就可以创建一个新的 `AssemblyBuilder` 对象。为此，我们在当前域上调用 `DefineDynamicAssembly`，该域通过调用\
  \ `Thread` 对象的静态 `GetDomain()` 方法获得。`GetDomain()` 方法的参数是我们刚刚创建的 `AssemblyName` 对象和一个\
  \ `AssemblyBuilderAccess` 枚举值（`Run`、`RunandSave` 或 `Save`）。在这种情况下，我们使用 `Run` 来表示程序集可以运行但不能保存：\n\
  \n```\nAssemblyBuilder newAssembly =\nThread.GetDomain().DefineDynamicAssembly(\n\
  assemblyName, AssemblyBuilderAccess.Run);\n```\n\n有了这个新创建的 `AssemblyBuilder` 对象，我们就可以创建一个\
  \ `ModuleBuilder` 对象。`ModuleBuilder` 的工作，顾名思义，是动态构建模块：\n\n```\nModuleBuilder newModule\
  \ =\nnewAssembly.DefineDynamicModule(\"Simple\");\n```\n\n接下来，我们定义类及其实现的接口：\n\n\
  ```\nTypeBuilder myType = newModule.DefineType(\"SimpleClass\",\n         TypeAttributes.Public);\n\
  myType.AddInterfaceImplementation(typeof(ISimple));\n```\n\n然后，按照如下方式编写类上唯一实例方法的详细信息：\n\
  \n```\nType[] paramTypes = new Type[0];\nType returnType = typeof(int);\nMethodBuilder\
  \ simpleMethod =\n  myType.DefineMethod(\"GetInt\",MethodAttributes.Public |\n \
  \   MethodAttributes.Virtual,returnType, paramTypes);\n```\n\n然后，我们使用创建的 `MethodBuilder`\
  \ 对象来获取一个 `ILGenerator` 对象：\n\n```\nILGenerator generator = simpleMethod.GetILGenerator(\
  \ );\n```\n\n\n\n\n\n有了`ILGenerator`对象，我们就可以开始发射`OpCodes`了。这些正是 C#编译器本会生成的`OpCodes`。首先，我们将值\
  \ 3 发射到堆栈上，然后返回它。现在，我们准备好创建一个`MethodInfo`对象来描述该方法：\n\n```\nMethodInfo getIntInfo\
  \ = typeof(ISimple).GetMethod(\"GetInt\");\n```\n\n现在，我们必须指定将实现该方法的实现。我们在之前创建的`TypeBuilder`对象上调用`DefineMethodOverride`，传入我们创建的`MethodBuilder`以及我们刚刚创建的`MethodInfo`对象：\n\
  \n```\nmyType.DefineMethodOverride(simpleMethod, getIntInfo);\n```\n\n程序集创建后，我们实例化一个`SimpleClass`类的实例，并在其上调用`GetInt`方法。输出将与清单\
  \ 22.8 相同。\n\n此示例说明了如何动态定义类，并使用反射发射 API 直接与类的 IL 进行交互。\n\n### 22.5. 总结\n\nC#的反射允许你查看和查询元数据，动态调用方法、设置字段以及在任何\
  \ C#类型上调用构造函数。你还可以定义自定义类型，并使用反射发射来动态操作生成的 IL。相比之下，Java 的反射 API 不允许你操作生成的字节码。\n\n\
  Java 和 C#反射 API 之间一个值得注意的区别是，在 C#中，根据签名搜索类型特定成员的反射方法返回`null`，而不是抛出异常。这在理念上与 Java\
  \ 世界不同，在 Java 中，某物不存在通常通过抛出已检查异常来表示，而不是返回`null`。习惯于使用已检查异常进行流程控制的 Java 程序员应该意识到\
  \ C#中的这个细微差别。\n\n## 第 23 章. 程序集、应用程序配置和进程管理\n\n到目前为止，在本书中，你已经学习了如何编写 C#程序。作为一名企业程序员，你应该知道编写应用程序代码只是程序员的职责之一。其他职责包括组装、部署、配置和监控应用程序。本章介绍\
  \ C#中的打包和管理应用程序。我们将探讨程序集、版本控制以及应用程序配置和管理——即进程管理。\n\n在 Java 世界中，应用程序不是打包为 EXE 文件，而是打包为由运行时`.java`可执行文件加载的类文件。许多\
  \ Java 应用程序将类文件捆绑在`.java`归档文件（或`.jar`文件）中。`.jar`文件是 Java 中应用程序和库的首选部署单元。Java 产品通常仅作为一组`.jar`文件发布。`.java`归档文件（`.jar`）的几种变体现在被用作新一代\
  \ J2EE 应用程序的部署单元。J2EE Web 应用程序部署为 Web 应用程序归档（`.war`）文件。类似地，EJB 组件捆绑在另一种`.jar`文件变体中，称为企业应用程序归档（`.ear`）文件。\n\
  \nJava 还提供了一个用于探索这些归档文件和部署单元的 API。然而，Java 环境并没有提供一套强大的应用程序监控和管理工具。这些工具往往与应用程序运行的操作系统紧密相关，而\
  \ Java 的 OS 中立性使其无法利用任何特定于操作系统的特性来与任何平台紧密集成。因此，JDK 附带了一套最小的可执行文件，可以帮助你调试应用程序的性能和内存消耗。此外，有助于监控内存分配和垃圾回收的\
  \ API 也不是核心 Java API 的一部分。Java 也没有内置对归档文件版本控制的支持。\n\n.NET Framework 则不同。它提供了工具和\
  \ API 来简化组装、部署和版本控制应用程序的任务。此外，它还提供了与 Windows 平台直接交互的 API，并通过操作系统进程管理来控制应用程序的状态。\n\
  \n### 23.1. .NET 程序集\n\n程序集是类型和资源的可重用、自描述、可版本控制的部署单元。由于它是自描述的，它允许.NET 运行时完全理解应用程序并强制执行依赖和版本控制规则。与\
  \ Java 不同——在 Java 中，独立应用程序和组件库都部署为`.jar`文件——程序集有四种类型或格式：\n\n1.  `exe`。控制台可执行文件。应用程序必须包含一个在`Main`方法中定义的入口点。\n\
  \n2.  库。可被其他程序集使用的库（DLL）。\n\n3.  模块。用于其他程序集的非可执行编译代码集合。\n\n4.  `winexe`。图形 Windows\
  \ 可执行文件。程序集必须包含一个入口点。\n\n程序集由以下组件组成：\n\n*   包含程序集元数据的清单\n\n*   一个或多个模块\n\n*   资源文件，例如\
  \ Windows 应用程序的图标\n\n让我们详细探讨每一个。\n\n#### 23.1.1. 程序集清单\n\n程序集清单包含描述程序集及其内部类型的元数据。清单在编译器创建程序集时自动创建。\n\
  \n清单由以下组件组成：\n\n*   关于名称、版本、区域性和强名称的信息，以及通用描述性信息（公司名称、产品名称、描述和版权）。区域信息指示程序集支持的语言。版本信息由主版本号、次版本号、内部版本号和修订号组成，运行时使用这些信息来强制执行版本控制策略。强名称是赋予程序集的全局唯一名称标签，以便在共享上下文中可以识别它。关于版权、产品和公司名称的通用描述性信息可以很容易地被最终用户更改（稍后显示）。\n\
  \n*   构成程序集的已编译代码文件列表。\n\n*   关于程序集导出的类型以及支持此程序集类型所需的任何其他程序集引用的信息。\n\n如果可移植可执行（PE）文件中的\
  \ Microsoft 中间语言（MSIL）代码没有关联的程序集清单，则不会执行。\n\n#### 23.1.2. 模块\n\n通常，一个复杂的应用程序可以由用不同语言编写的组件组成。模块旨在容纳不同的组件，以便它们可以在完全不同的语言中并行开发，然后集成到一个程序集中。模块包含一个或多个.NET\
  \ 类型。模块可以包含来自多个命名空间的类型，并且模块可以从一个或多个源文件编译。\n\n#### 23.1.3. 资源\n\n资源允许你将文本和图像（对于处理\
  \ Web 应用程序的人来说是静态内容）与应用程序逻辑分离，从而简化应用程序的维护。\n\n### 23.2. 创建程序集\n\n最简单的形式下，程序集是一个具有`.exe`、`.dll`或`.module`文件扩展名的单个文件。此文件包含一个模块和一个清单。\n\
  \n让我们创建一个`exe`类型的程序集。你需要两个源文件：`HelloWorld.cs`和`HelloWorldDriver.cs`。源文件的内容如清单 23.1\
  \ 和 23.2 所示。\n\n##### 清单 23.1. `HelloWorld.cs` (C#)\n\n```\npublic class HelloWorld\
  \ {\n  public override string ToString() {\n    return \"Hello World\";\n  }\n}\n\
  ```\n\n##### 清单 23.2. `HelloWorldDriver.cs` (C#)\n\n```\nusing System;\npublic class\
  \ HelloWorldDriver {\n  public static void Main(string[] args) {\n    HelloWorld\
  \ hw = new HelloWorld();\n    Console.WriteLine(hw.ToString());\n  }\n}\n```\n\n\
  \n\n\n接下来，我们使用以下命令创建一个 EXE 程序集：\n\n```\ncsc /target:exe /out:MyApp.exe *.cs\n```\n\
  \n我们使用 `/target` 选项来指定程序集的类型。`/out` 选项允许我们为 EXE 文件命名。\n\n请注意，要创建 EXE 文件，编译后的类必须在\
  \ `Main()` 方法中定义一个入口点（清单 23.2）。创建 EXE 程序集后，你可以通过右键单击文件名来查看其属性。显示的一些属性是前面讨论过的清单的常规信息部分。请注意，这些信息可以自定义，这样当你右键单击\
  \ EXE 文件时，可以查看根据你的需求定制的产品、版本和版权信息。\n\n要自定义此信息，我们编辑一个名为 `AssemblyInfo.cs` 的特殊文件，并将其与其他源文件一起编译。这是一个\
  \ `AssemblyInfo.cs` 的示例：\n\n```\nusing System.Reflection;\nusing System.Runtime.CompilerServices;\n\
  [assembly: AssemblyTitle(\"\")]\n[assembly: AssemblyDescription(\"This is test\"\
  )]\n[assembly: AssemblyCompany(\"Acme Inc\")]\n[assembly: AssemblyProduct(\"Acme\
  \ Product\")]\n[assembly: AssemblyCopyright(\"Buyer beware\")]\n[assembly: AssemblyTrademark(\"\
  \")]\n[assembly: AssemblyCulture(\"\")]\n[assembly: AssemblyVersion(\"1.0.0.1\"\
  )]\n```\n\n接下来，我们再次运行命令：\n\n```\ncsc /target:exe /out:MyApp.exe *.cs\n```\n\n运行\
  \ `MyApp.exe` 后，我们得到以下输出：\n\n```\nHello World\n```\n\n创建的 `MyApp.exe` 文件现在包含了在 `AssemblyInfo.cs`\
  \ 文件中指定的额外信息。你可以通过单击 `MyApp.exe` 属性框的“版本”选项卡来查看此信息。\n\n如前所述，程序集不一定是 `.exe` 类型。你可以使用适当的\
  \ `/target` 命令行选项创建 `.dll` 或 `.module` 模块：\n\n```\ncsc /target:library /out:MyApp.dll\
  \ *.cs\ncsc /target:module /out:MyApp.module *.cs\n```\n\n在这两种情况下，`AssemblyInfo.cs`\
  \ 中指定的元数据信息都会保留在最终产品（`MyApp.dll` 或 `MyApp.module`）中。\n\n程序集可以由一个或多个模块组成。这在复杂应用程序中很典型，其中的模块可能由不同的团队开发，可能使用不同的语言。为了说明这一点，我们需要另外两个源文件。清单\
  \ 23.3 和 23.4 展示了 `GoodByeWorld` 和 `GoodByeWorldDriver` 类。\n\n##### 清单 23.3. `GoodByeWorld.cs`\
  \ (C#)\n\n```\npublic class GoodByeWorld {\n  public override string ToString()\
  \ {\n    return \"Good Bye World\";\n  }\n}\n```\n\n##### 清单 23.4. `GoodByeWorldDriver.cs`\
  \ (C#)\n\n```\nusing System;\npublic class GoodByeWorldDriver {\n  public static\
  \ void Main(string[] args) {\n    GoodByeWorld hw = new GoodByeWorld ();\n    Console.WriteLine(hw.ToString());\n\
  \  }\n}\n```\n\n接下来，我们将 `Hello*.cs` 文件编译成一个 `Hello.module`，并将 `GoodBye*.cs` 文件编译成一个\
  \ `GoodBye.module`：\n\n```\ncsc /target:module /out:GoodBye.module Good*.cs\ncsc\
  \ /target:module /out:Hello.module Hello*.cs\n```\n\n然后我们将这两个模块组合成一个 `Greeting.exe`\
  \ 程序集：\n\n```\nal /target:exe /out:Greeting.exe /main:HelloWorldDriver.Main Hello.module\
  \ GoodBye.module\n```\n\n程序集链接器 EXE 文件（`al.exe`）用于将两个模块链接成一个 `Greeting.exe`。这种链接二进制代码以创建可执行文件的概念，类似于传统\
  \ C/C++ 环境中链接 `.obj` 文件以创建 `.exe` 文件。\n\n请注意，两个模块都定义了入口点，因此在构建 `Greeting.exe` 程序集时，我们指定希望使用哪个\
  \ `Main()` 方法作为该 EXE 的入口点。现在运行 `Greeting.exe` 程序会产生以下输出：\n\n```\nHello World\n```\n\
  \n现在我们再次运行命令，这次更改 `/main` 选项的值：\n\n```\nal /target:exe /out:Greeting.exe /main:GoodByeWorldDriver.Main\
  \ Hello.module GoodBye.module\n```\n\n现在运行 `Greeting.exe` 程序会产生以下输出：\n\n```\nGood\
  \ Bye World\n```\n\n因此，程序集可以是单文件程序集，也可以是多文件程序集（由相互链接的模块组成）。\n\n`Greeting.exe` 程序集现在由两个模块组成：`GoodBye.module`\
  \ 和 `Hello.module`。每个模块都定义了一个入口点，而 `Greeting.exe` 程序集可以采用其中任何一个模块的入口点。根据创建 `Greeting.exe`\
  \ 程序集时指定的入口点，`Greeting.exe` 的输出可以是 `Good Bye World` 或 `Hello World`。\n\n### 23.3.\
  \ 以编程方式访问程序集\n\n幸运的是，.NET 程序集不仅仅是黑盒子。.NET 程序集由 `System.Reflection` 命名空间的 `Assembly`\
  \ 类表示。你可以使用此类以编程方式访问程序集的组件。清单 23.5 展示了如何加载之前创建的程序集并对其进行探索。\n\n##### 清单 23.5. 在 C#\
  \ 中加载和浏览程序集\n\n```\nusing System;\nusing System.Reflection;\n\npublic class AssemblyExplore\
  \ {\n\n  public static void Main(string[] args) {\n\n    Assembly asm = Assembly.LoadFrom(\"\
  C:\\\\BOOK\\\\code\\\\Chapter 23\\\\Greeting.exe\");\n    //打印程序集的属性\n    PrintProperties(asm);\n\
  \    //浏览程序集的模块\n    BrowseModules(asm);\n  }\n\n  private static void PrintProperties(Assembly\
  \ asm) {\n    Console.WriteLine(\"CodeBase \"+asm.CodeBase);\n    Console.WriteLine(\"\
  Location \"+asm.Location);\n    Console.WriteLine(\"Global Assembly Cache \"+asm.GlobalAssemblyCache);\n\
  \    Console.WriteLine(\"EntryPoint \"+asm.EntryPoint.ToString());\n    Console.WriteLine(\"\
  FullName \"+asm.FullName);\n  }\n\n  private static void BrowseModules(Assembly\
  \ asm) {\n    foreach (Module m in asm.GetModules()) {\n      BrowseModule (m);\n\
  \    }\n  }\n\n  private static void BrowseModule(Module m) {\n    Console.WriteLine(\"\
  Module \"  .Name);\n    foreach (Type t in m.GetTypes()) {\n      Console.WriteLine(\"\
  \\tType \"+t.FullName);\n      foreach (MethodInfo method in t.GetMethods()) {\n\
  \        Console.WriteLine(\"\\t\\tMethod signature \"+method.ToString());\n   \
  \   }\n    }\n  }\n}\n```\n\n清单 23.5 的输出如下：\n\n```\nCodeBase file:///C:/BOOK/code/Chapter\
  \ 23/Greeting.exe\nLocation c:\\book\\code\\chapter 23\\greeting.exe\nGlobal Assembly\
  \ Cache False\nEntryPoint Void __EntryPoint(System.String[])\nFullName Greeting,\
  \ Version=0.0.0.0, Culture=neutral, PublicKeyToken=null\nModule greeting.exe\nModule\
  \ hello.module\nType HelloWorld\nMethod signature Int32 GetHashCode()\nMethod signature\
  \ Boolean Equals(System.Object)\nMethod signature System.String ToString()\nMethod\
  \ signature System.Type GetType()\nType HelloWorldDriver\nMethod signature Int32\
  \ GetHashCode()\nMethod signature Boolean Equals(System.Object)\nMethod signature\
  \ System.String ToString()\nMethod signature Void Main(System.String[])\nMethod\
  \ signature System.Type GetType()\nModule goodbye.module\nType GoodByeWorld\nMethod\
  \ signature Int32 GetHashCode()\nMethod signature Boolean Equals(System.Object)\n\
  Method signature System.String ToString()\nMethod signature System.Type GetType()\n\
  Type GoodByeWorldDriver\nMethod signature Int32 GetHashCode()\nMethod signature\
  \ Boolean Equals(System.Object)\nMethod signature System.String ToString()\nMethod\
  \ signature Void Main(System.String[])\nMethod signature System.Type GetType()\n\
  ```\n\n\n\n\n## 23.3. 程序集共享\n\nListing 23.5 的输出基于我们之前构建程序集时的操作，应该是不言自明的。有两个模块包含类型。`hello.module`\
  \ 文件包含 `HelloWorld` 和 `HelloWorldDriver` 类。`goodbye.module` 文件包含 `GoodByeWorld`\
  \ 和 `GoodByeWorldDriver` 类。这两个类的方法签名列在 Listing 23.5 生成的输出中。\n\n请注意，`HelloWorld`、`HelloWorldDriver`、`GoodByeWorld`\
  \ 和 `GoodByeWorldDriver` 都是简单的类；那么这些方法是从哪里来的呢？请记住，所有类都继承自 `System.Object`。你在输出中看到的是这些类继承的\
  \ `System.Object` 方法。\n\n`Assembly` 类提供了检索程序集信息的方法。没有提供修改程序集的方法。第 22 章 讨论了反射发射机制，该机制可用于创建动态程序集（参见\
  \ Listing 22.9）。\n\n到目前为止，我们创建的程序集都是私有程序集——即特定于相关应用程序的程序集。很多时候，应用程序依赖于共享程序集才能运行。当程序集是类型库（DLL\
  \ 文件）时，共享程序集的概念变得更加明显。想象一下多个 EXE 文件使用同一个 DLL（听起来很熟悉？）。.NET 共享程序集不仅仅是一个被应用程序引用的静态\
  \ DLL。\n\n考虑一个部署在符合 J2EE 标准的 Web 容器中的 Java Web 应用程序。该容器具有库文件，这些是用于该容器中部署的所有应用程序的基础设施\
  \ `.jar` 文件。每次部署新的 Web 应用程序时都部署这组公共的 `.jar` 文件是没有意义的。需要的是一种机制，使得容器在应用程序引用共享 `.jar`\
  \ 文件时自动知道使用它。Java 使用类加载器层次结构来处理此机制。由于应用程序在运行时引用共享 `.jar` 文件，因此应用程序在编译时需要引用该 `.jar`\
  \ 文件才有意义。编译时所需的 `.jar` 文件不必与运行时所需的文件位于同一位置。\n\n在 .NET 中，共享程序集在许多方面类似于 J2EE 基础设施\
  \ `.jar` 文件。但 .NET 没有类加载器或类路径的概念，那么当应用程序引用在其程序集中找不到的 DLL 时，CLR 如何知道去哪里查找呢？全局程序集缓存（GAC）是一个目录（通常是\
  \ `C:\\Windows\\assembly` 或 `C:\\WINNT\\assembly`），CLR 可以在其中定位此类共享程序集。虽然不一定要将共享程序集放入\
  \ GAC，但如果将共享程序集保存在那里，会使部署更容易。.NET Framework 提供了一个名为 GAC 工具（`gacutil.exe`）的工具，用于将共享程序集安装到\
  \ GAC 中。\n\n共享程序集意味着该程序集应具有全局唯一的名称。这样的名称称为程序集的强名称。它由名称、版本信息、文化和用于加密的公钥组成。`AssemblyInfo.cs`\
  \ 文件可用于修改程序集的强名称组件。要创建公钥，.NET Framework 提供了一个名为 `sn.exe` 的强名称工具，该工具创建一个可以在 `AssemblyInfo.cs`\
  \ 中引用的密钥文件。以下命令创建一个包含加密公钥的 `Hello.snk` 密钥文件：\n\n```\nsn–k Hello.snk\n```\n\n接下来，我们创建\
  \ `AssemblyInfo.cs` 文件，并指定所有强名称组件，如 Listing 23.6 中的粗体所示。\n\n##### Listing 23.6.\
  \ 带有强名称组件的 `AssemblyInfo` (C#)\n\n```\nusing System.Reflection;\nusing System.Runtime.CompilerServices;\n\
  \n[assembly: AssemblyTitle(\"MyApp\")]\n[assembly: AssemblyDescription(\"A simple\
  \ app\")]\n[assembly: AssemblyCompany(\"MyCompany.com\")]\n[assembly: AssemblyProduct(\"\
  MyApp\")]\n[assembly: AssemblyCopyright(\"This is the property of\nMyCompany.com\"\
  )]\n[assembly: AssemblyTrademark(\"\")]\n[assembly: AssemblyCulture(\"\")]\n[assembly:\
  \ AssemblyVersion(\"1.0.0.0\")]\n[assembly: AssemblyKeyFile(\"Hello.snk\")]\n```\n\
  \n如果运行以下命令，将创建带有强名称的 `Hello.dll`：\n\n```\ncsc /target:library /out:Hello.dll HelloWorld.cs\
  \ AssemblyInfo.cs\n```\n\n接下来，我们使用以下命令将其存储在 GAC 中：\n\n```\ngacutil /i Hello.dll\n\
  ```\n\n当 DLL 安装在 GAC 中时，应用程序可以在运行时自由使用它。但首先，应用程序必须在编译时使用该 DLL 来编译自身。为此，我们将 DLL 从\
  \ GAC 复制到编译应用程序的目录中。让我们使用这个新的 DLL 编译 `HelloWorldDriver`：\n\n```\ncsc /target:exe\
  \ /out:MyApp.exe HelloWorldDriver.cs\n/reference:Hello.dll\n```\n\n现在从本地目录中删除 `Hello.dll`。当我们运行\
  \ `MyApp` 时，它应该打印以下输出：\n\n```\nHello World\n```\n\n我们刚刚创建了一个引用共享程序集（`Hello.dll`）的\
  \ EXE（`MyApp.exe`）。\n\n### 23.4. 版本控制\n\n在 第 23.3 节 中，你学习了如何创建一个引用 GAC 程序集的应用程序。\n\
  \n在应用程序之间共享库带来了关于哪个应用程序使用哪个版本的公共库的古老问题。使用同一 DLL 的两个不同版本的应用程序能否共存？如何升级应用程序以使用新版本的\
  \ DLL？幸运的是，.NET 回答了所有这些问题。\n\n为了说明版本控制，我们将创建一个新的 `Hello.dll`，它包含一个具有不同强名称的 `AssemblyInfo.cs`（Listing\
  \ 23.7）和一个不同的 `HelloWorld.cs`（Listing 23.8）。\n\n##### Listing 23.7. 修改后的带有强名称组件的\
  \ `AssemblyInfo` (C#)\n\n```\nusing System.Reflection;\nusing System.Runtime.CompilerServices;\n\
  \n[assembly: AssemblyTitle(\"MyApp\")]\n[assembly: AssemblyDescription(\"A simple\
  \ app\")]\n[assembly: AssemblyCompany(\"MyCompany.com\")]\n[assembly: AssemblyProduct(\"\
  MyApp\")]\n[assembly: AssemblyCopyright(\"This is the property of\nMyCompany.com\"\
  )]\n[assembly: AssemblyTrademark(\"\")]\n[assembly: AssemblyCulture(\"\")]\n[assembly:\
  \ AssemblyVersion(\"2.0.0.0\")]\n[assembly: AssemblyKeyFile(\"Hello.snk\")]\n```\n\
  \n请注意，在 Listing 23.7 中，我们只需要更改版本号即可更改程序集的强名称。接下来，我们创建一个略有不同的 `HelloWorld` 类。\n\n\
  ##### Listing 23.8. 一个略有不同的 `HelloWorld` 类 (C#)\n\n```\npublic class HelloWorld\
  \ {\n  public override string ToString() {\n  return \"A slightly different Hello\
  \ World\";\n  }\n}\n```\n\n接下来，我们快速创建 `Hello.dll`，将其注册到 GAC 中，并使用这个新的 DLL 编译 `HelloWorldDriver`\
  \ 类。\n\n```\ncsc /target:library /out:Hello.dll HelloWorld.cs AssemblyInfo.cs\n\
  gacutil /i Hello.dll\ncsc /target:exe /out:MyApp.exe HelloWorldDriver.cs\n/reference:Hello.dll\n\
  ```\n\n现在输入 `MyApp`，你应该会看到以下输出：\n\n```\nA slightly different Hello World\n```\n\n\
  要列出 GAC 的内容，请输入 `gacutil /l`。这将输出你环境中的所有共享程序集。你将在输出中看到两个版本的 `Hello.dll`：\n\n```\n\
  Hello, Version=1.0.0.0, Culture=neutral,\nPublicKeyToken=cc6fce1c7117f564om=null\n\
  \nHello, Version=2.0.0.0, Culture=neutral,\nPublicKeyToken=cc6fce1c7117f564om=null\n\
  ```\n\n请注意，两个程序集的版本信息是不同的。\n\n\n\n\n\n既然我们已经在 GAC 中有了两个程序集，如何强制应用程序使用所需版本的程序集呢？.NET\
  \ Framework 支持程序集策略文件，这些是 XML 文件，用于指示如何升级程序集。一个示例策略文件如清单 23.9 所示。\n\n##### 清单 23.9.\
  \ 一个示例.NET 策略文件 (C#)\n\n```\n<configuration>\n  <runtime>\n    <assemblyBinding>\n\
  \      <dependentAssembly>\n        <assemblyIdentity name=\"Hello\"\n         \
  \ publicKeyToken=\"cc6fce1c7117f564\"\n                              culture=\"\"\
  />\n          <bindingRedirect oldVersion=\"1.0.0.0\"\n                        newVersion=\"\
  2.0.0.0\"/>\n      </dependentAssembly>\n    </assemblyBinding>\n  </runtime>\n\
  </configuration>\n```\n\n然后使用以下命令创建新的基于策略的`Hello.dll`：\n\n```\nal /link:policy.xml\
  \ /keyfile:Hello.snk /out:policy.1.0.Hello.dll\n```\n\n请注意，新的`Hello.dll`的名称格式包含单词`policy`和一个数字，清楚地表明该程序集强制执行策略。下一步是在\
  \ GAC 中注册这个基于策略的 DLL：\n\n```\ngacutil /i policy.1.0.Hello.dll\n```\n\n### 23.5.\
  \ 应用程序配置\n\n许多应用程序依赖于在执行有用操作之前读取的外部静态设置。这些设置永远不会在应用程序本身中硬编码，因为这样做会迫使应用程序在简单的静态设置更改时重新编译。\n\
  \n一种传统方法是将这些静态设置存储在静态配置文件中。Java 程序员可能想到的是`.properties`文件。Java 属性文件是一个包含名称/值对的文件，可以在运行时由应用程序使用。JDK\
  \ 1.4 引入了一种更结构化的方式来将这些设置存储在名为`java.util.Preferences`的类中。\n\n.NET Framework 自带了自己的类库，允许配置应用程序。由于.NET\
  \ Framework 中一切都是基于 XML 的，因此不需要学习特殊语法。该框架提供了丰富的 API 来读取这些配置文件。\n\n.NET 配置文件以`.config`文件扩展名结尾。对于应用程序`MyApp.exe`，配置文件将是`MyApp.exe.config`。对于多文件程序集，配置文件以包含清单的文件命名。CLR\
  \ 确保配置文件自动加载，因此程序员不需要特别努力。配置文件必须包含根 XML 节点`<configuration>`。\n\n在其最简单的形式中，自定义应用程序设置在配置文件的`<appSettings>`部分中定义。设置定义为键值对。\n\
  \n```\n<configuration>\n  <appSettings>\n  <add key=\"Key1\" value=\"Value1\"/>\n\
  \  <add key=\"Key2\" value=\"Value2\"/>\n  <add key=\"Key3\" value=\"Value3\"/>\n\
  </appSettings>\n```\n\n您还可以在配置文件中指定节。节用于定义复杂设置。根据为每个节指定的处理程序，有三种类型的节：单标签节、名称/值节和字典节。\n\
  \n#### 23.5.1. 单标签节\n\n单标签节允许您将键值对定义为单个 XML 标签的属性：\n\n```\n<configuration>\n  <configSections>\n\
  \  <section name=\"Single\"\n    type=\"System.Configuration.SingleTagSectionHandler\"\
  />\n  </configSections>\n  <Single Key1 = \"Value1\"\n          Key2 = \"Value2\"\
  \n          Key3 = \"Value3\"></Single>\n</configuration>\n```\n\n#### 23.5.2. 名称/值节\n\
  \n名称/值节允许您以与简单设置定义相同的方式定义键值对：\n\n```\n<configuration>\n  <configSections>\n  <section\
  \ name=\"NameValue\"\n    type=\"System.Configuration.NameValueSectionHandler\"\
  \ />\n  </configSections>\n  <NameValue>\n    <add key=\"Key1\" value=\"Value1\"\
  />\n    <add key=\"Key2\" value=\"Value2\"/>\n    <add key=\"Key3\" value=\"Value3\"\
  />\n  </NameValue>\n</configuration>\n```\n\n#### 23.5.3. 字典节\n\n字典节与名称/值节类似，不同之处在于字典节使用不同的节处理程序：\n\
  \n```\n<configuration>\n  <configSections>\n    <section name=\" Dictionary\"\n\
  \      type=\"System.Configuration.DictionarySectionHandler\" />\n  </ configSections\
  \ >\n  <Dictionary>\n    <add key=\"Key1\" value=\"Value1\"/>\n    <add key=\"Key2\"\
  \ value=\"Value2\"/>\n    <add key=\"Key3\" value=\"Value3\"/>\n  </Dictionary>\n\
  </configuration>\n```\n\n您甚至可以通过将节处理程序设置为`IgnoreSectionHandler`来通知配置文件解析器忽略某些节。\n\
  \n```\n<configuration>\n  <configSections>\n<section name=\"Advanced\"\ntype=\"\
  System.Configuration.IgnoreSectionHandler\" />\n  </configSections>\n<Advanced>\n\
  <add key=\"Key1\" value=\"Value1\"/>\n<add key=\"Key2\" value=\"Value2\"/>\n<add\
  \ key=\"Key3\" value=\"Value3\"/>\n</Advanced>\n</configuration>\n```\n\n#### 23.5.4.\
  \ 一个示例配置文件\n\n清单 23.10 和 23.11 展示了如何处理简单的应用程序设置以及我们讨论过的节设置。清单 23.10 显示了完整的`MyApp.config`文件。\n\
  \n##### 清单 23.10. 一个示例.NET 配置文件 (C#)\n\n```\n<configuration>\n  <configSections>\n\
  \    <section name=\"Single\"\n    type=\"System.Configuration.SingleTagSectionHandler\"\
  \ />\n\n    <section name=\"NameValue\"\n    type=\"System.Configuration.NameValueSectionHandler\"\
  \ />\n\n    <section name=\"Dictionary\"\n    type=\"System.Configuration.DictionarySectionHandler\"\
  \ />\n  </configSections>\n\n<appSettings>\n  <add key=\"SimpleKey1\" value=\"SimpleValue1\"\
  />\n  <add key=\"SimpleKey2\" value=\"SimpleValue2\"/>\n  <add key=\"SimpleKey3\"\
  \ value=\"SimpleValue3\"/>\n</appSettings>\n  <Single SingleKey1 = \"SingleValue1\"\
  \n    SingleKey2 = \"SingleValue2\"\n    SingleKey3 = \"SingleValue3\" />\n\n  <NameValue>\n\
  \  <add key=\"NameValueKey1\" value=\"NameValueValue1\"/>\n  <add key=\"NameValueKey2\"\
  \ value=\"NameValueValue2\"/>\n  <add key=\"NameValueKey3\" value=\"NameValueValue3\"\
  />\n  </NameValue>\n\n  <Dictionary>\n    <add key=\"DictionaryKey1\" value=\"DictionaryValue1\"\
  />\n    <add key=\"DictionaryKey2\" value=\"DictionaryValue2\"/>\n    <add key=\"\
  DictionaryKey3\" value=\"DictionaryValue3\"/>\n  </Dictionary>\n\n</configuration>\n\
  ```\n\n请注意，`<configuration>`根节点下只能有一个`<configSections>`元素，并且它必须是根节点的第一个子节点。清单 23.11\
  \ 展示了如何读取配置文件的不同设置。\n\n##### 清单 23.11. 一个读取应用程序设置的简单 C#类\n\n```\nusing System;\n\
  using System.Collections;\nusing System.Collections.Specialized;\nusing System.Configuration;\n\
  \npublic class MyApp {\n\n  public static void Main(string[] args) {\n    //Read\
  \ simple settings\n    ReadSimpleSettings();\n    //Read single-tag settings\n \
  \   ReadSingleTagSettings();\n    //Read single-tag settings\n    ReadNameValueSettings();\n\
  \    //Read single-tag settings\n    ReadDictionarySettings();\n  }\n\n  private\
  \ static void ReadSimpleSettings() {\n    Console.WriteLine(\n    ConfigurationSettings.AppSettings[\"\
  SimpleKey1\"]);\n  }\n\n  private static void ReadSingleTagSettings() {\n    IDictionary\
  \ dict = (IDictionary)\n    ConfigurationSettings.GetConfig(\"Single\");\n    Console.WriteLine(dict[\"\
  SingleKey2\"]);\n  }\n\n  private static void ReadNameValueSettings() {\n    NameValueCollection\
  \ dict = (NameValueCollection)\n    ConfigurationSettings.GetConfig(\"NameValue\"\
  );\n    Console.WriteLine(dict[\"NameValueKey3\"]);\n  }\n\n  private static void\
  \ ReadDictionarySettings() {\n    Hashtable dict = (Hashtable)\n    ConfigurationSettings.GetConfig(\"\
  Dictionary\");\n    Console.WriteLine(dict[\"DictionaryKey1\"]);\n  }\n}\n```\n\n\
  清单 23.11 的输出如下：\n\n```\nSimpleValue1\nSingleValue2\nNameValueValue3\nDictionaryValue1\n\
  ```\n\n\n\n\n\n清单 23.11 中的代码是不言自明的。`System.Configuration` 命名空间中的 `ConfigurationSettings`\
  \ 类包含了解析配置文件所需的所有方法。请注意，`GetConfig` 方法返回的对象会根据所读取的节被转换为相应的集合。\n\n还需注意，`ConfigurationSettings`\
  \ 类返回的集合是只读的。你不能使用此类来修改配置文件。你应该手动进行修改。\n\n### 23.6. 进程管理\n\n传统上，应用程序的隔离单元是在进程级别。每个运行的应用程序实例都会分配一个专用的操作系统用户进程，停止应用程序意味着终止操作系统进程。.NET\
  \ Framework 引入了应用程序域的概念，这是一种新的、更轻量级的隔离单元。CLR 允许一个进程包含多个应用程序域，每个应用程序域彼此独立。因此，应用程序域为应用程序在同一操作系统进程内共存创建了一个边界。所以，应用程序间的方法调用是在同一操作系统进程内进行的，这比进行进程间方法调用更轻量。应用程序可以彼此独立地停止，并且一个应用程序中的故障不会影响同一操作系统进程中的其他应用程序。\n\
  \n.NET 应用程序域的概念让人联想到基于 Java 的应用程序服务器提供的 Web 应用程序隔离。J2EE 规范要求 Web 应用程序彼此独立，即使它们是在同一个\
  \ JVM 实例中创建的。在一个 Web 应用程序中加载的类对另一个 Web 应用程序不可用。这种隔离是通过为每个 Web 应用程序使用不同的类加载器来实现的。\n\
  \n每个应用程序都与一个应用程序域相关联。当你从命令行启动一个 .NET shell 可执行文件时，一段软件会创建默认应用程序域和你的应用程序特定域。这段软件就是\
  \ CLR 宿主。CLR 负责将 CLR 加载到操作系统进程中，在操作系统进程中创建一个逻辑分区，以便你的应用程序可以驻留在该分区中。运行 .NET shell\
  \ 可执行文件会自动调用与 shell 可执行文件关联的 CLR 宿主。在 .NET 中，应用程序域使用 `System.AppDomain` 类建模。\n\n\
  #### 23.6.1. 查询当前应用程序域\n\n清单 23.12 展示了 shell 可执行文件如何查询其当前应用程序域并获取其属性。\n\n##### 清单\
  \ 23.12. 当前应用程序域属性 (C#)\n\n```\nusing System;\nusing System.Threading;\npublic class\
  \ Test {\n\n  public static void Main(string[] args) {\n\n    AppDomain domain =\
  \ Thread.GetDomain();\n    Console.WriteLine(\"Friendly name \"+domain.FriendlyName);\n\
  \    Console.WriteLine(\"Base directory \"+domain.BaseDirectory);\n\n    AppDomainSetup\
  \ setup = domain.SetupInformation;\n    Console.WriteLine(\"ApplicationBase \"+setup.\n\
  \                        ApplicationBase);\n    Console.WriteLine(\"ApplicationName\
  \ \"+setup.\n                        ApplicationName);\n    Console.WriteLine(\"\
  Config file \"+setup.ConfigurationFile);\n  }\n}\n```\n\n清单 23.12 的输出如下：\n\n```\n\
  Friendly name Deployment.exe\nBase directory C:\\BOOK\\code\\Chapter 23\\Deployment\\\
  bin\\Debug\\\nApplicationBase C:\\BOOK\\code\\Chapter 23\\Deployment\\bin\\Debug\\\
  \nApplicationName\nConfig file C:\\BOOK\\code\\Chapter\n23\\Deployment\\bin\\Debug\\\
  Deployment.exe.config\n```\n\n你可以通过调用当前线程的 `GetDomain` 方法来获取应用程序的应用程序域。`AppDomain`\
  \ 类定义了几个值得关注的属性。\n\n#### 23.6.2. 在远程应用程序域中执行应用程序\n\n要在另一个应用程序域中执行应用程序，你必须首先创建该应用程序域。清单\
  \ 23.13 展示了如何操作。\n\n##### 清单 23.13. 在自定义应用程序域中执行程序集 (C#)\n\n```\nusing System;\n\
  \npublic class Test {\n\n  public static void Main(string[] args) {\n\n    AppDomainSetup\
  \ info = new AppDomainSetup();\n    info.ApplicationBase = System.Environment.CurrentDirectory;\n\
  \    AppDomain dom = AppDomain.CreateDomain(\n           \"RemoteDomain\", null,info);\n\
  \    dom.ExecuteAssembly(\"c:\\\\book\\\\code\\\\Chapter 23\\\\MyApp.exe\");\n \
  \   AppDomain.Unload(dom);\n  }\n}\n```\n\n清单 23.13 的输出如下：\n\n```\nA slightly different\
  \ Hello World\n```\n\n清单 23.13 创建了一个名为 `RemoteDomain` 的自定义应用程序域，并执行和运行了一个先前开发的程序集\
  \ (`MyApp.exe`)。请注意，在这种情况下运行的应用程序很简单，但在实践中应用程序可能很复杂，因此卸载程序集很重要。没有直接卸载程序集的 API，但你可以通过卸载其运行的应用程序域来实现：\n\
  \n```\nAppDomain.Unload(dom);\n```\n\n#### 23.6.3. 在远程应用程序域中调用方法\n\n如前所述，在没有应用程序域的情况下，调用其他应用程序的方法通常意味着进行进程间调用，这比进行进程内调用要慢。为了演示如何调用在另一个应用程序域中加载的类的方法，我们首先创建一个简单的类，并将其编译为库类型程序集\
  \ (DLL)。清单 23.14 展示了我们将用于创建 DLL 的 `RemoteHello` 类。\n\n##### 清单 23.14. `RemoteHello.cs`\
  \ (C#)\n\n```\nusing System;\n\npublic class RemoteHello : MarshalByRefObject {\n\
  \n  string greeting;\n  public RemoteHello(string greeting) {\n    this.greeting\
  \ = greeting;\n  }\n\n  public void Greet() {\n    Console.WriteLine(\"Hello \"\
  +greeting);\n  }\n}\n```\n\n`MarshalByRefObject` 是一个抽象类，它允许跨应用程序域边界访问对象。\n\n接下来，我们将\
  \ `RemoteHello.cs` 编译为 `RemoteHello.dll`：\n\n```\ncsc /target:library /out:RemoteHello.dll\
  \ RemoteHello.cs\n```\n\n现在我们有了 DLL，清单 23.15 展示了如何通过在自定义应用程序域中加载 DLL 来调用 `Greet()`\
  \ 方法。\n\n##### 清单 23.15. `RemoteHelloDriver.cs` (C#)\n\n```\nusing System;\nusing\
  \ System.Reflection;\nusing System.Runtime.Remoting;\n\npublic class Test {\n\n\
  \  public static void Main(string[] args) {\n\n    //Set up information regarding\
  \ the application domain\n    AppDomainSetup info = new AppDomainSetup();\n    info.ApplicationBase\
  \ = System.Environment.CurrentDirectory;\n\n    // Create an application domain\
  \ with null evidence\n    AppDomain dom = AppDomain.CreateDomain(\n           \"\
  RemoteDomain\", null,info);\n    BindingFlags flags = (BindingFlags.Public |\n \
  \     BindingFlags.Instance | BindingFlags.CreateInstance);\n    ObjectHandle objh\
  \ = dom.CreateInstance(\"RemoteHello\",\n      \"RemoteHello\", false, flags, null,\
  \ new String[]{\"Hello\n      World!\"}, null, null, null);\n    Object obj = objh.Unwrap();\n\
  \    // Cast to the actual type\n\n    RemoteHello h = (RemoteHello)obj;\n    //\
  \ Invoke the method\n\n    h.Greet();\n\n    // Clean up by unloading the application\
  \ domain\n    AppDomain.Unload(dom);\n  }\n}\n```\n\n因为 清单 23.15 引用了 `RemoteHello`\
  \ 类，我们必须使用以下命令行进行编译：\n\n```\ncsc /r:RemoteHello.dll RemoteHelloDriver.cs\n```\n\n\
  如果我们现在运行 `RemoteHelloDrive.exe`，我们将看到以下输出：\n\n```\nHello Hello World!\n```\n\n\n\
  \n\n\n# .NET Framework 中的应用程序域与进程管理\n\n能够在不降低执行速度的情况下执行其他应用程序，甚至调用其他应用程序中定义的类型的方法，是\
  \ .NET Framework 的一个巨大优势。它允许企业开发人员在一个程序集中开发和部署通用的企业组件，并在其他应用程序中重用这些组件。\n\n我们之前提到，可以使用应用程序域作为隔离单元，在单个操作系统进程中运行多个应用程序，并且可以在不影响其他应用程序的情况下停止其中一个应用程序。为了说明这一点，我们创建了\
  \ `Application1.cs`（清单 23.16）和 `Application2.cs`（清单 23.17），然后分别从这两个清单创建程序集 `Application1.exe`\
  \ 和 `Application2.exe`。\n\n##### 清单 23.16. `Application1.cs` (C#)\n\n```\nusing\
  \ System;\nusing System.Threading;\n\npublic class Test {\n\n  static void Main(string[]\
  \ args) {\n    Thread t = new Thread(new ThreadStart(new Test().Run));\n    t.Start();\n\
  \  }\n\n  public void Run() {\n    while (true) {\n      Thread.Sleep(400);\n  \
  \    Console.WriteLine(\"Running App 1\");\n    }\n  }\n}\n```\n\n运行以下命令以创建 `Application1.exe`\
  \ 程序集：\n\n```\ncsc Application1.cs\n```\n\n接下来，我们创建 `Application2.cs`（清单 23.17）。\n\
  \n##### 清单 23.17. `Application2.cs` (C#)\n\n```\nusing System;\nusing System.Threading;\n\
  \npublic class Test{\n\n  static void Main(string[] args) {\n    Thread t = new\
  \ Thread(new ThreadStart(new Test().Run));\n    t.Start();\n  }\n\n  public void\
  \ Run() {\n    while (true) {\n      Thread.Sleep(500);\n      Console.WriteLine(\"\
  Running App 2\");\n    }\n  }\n}\n```\n\n运行以下命令以创建 `Application2.exe` 程序集：\n\n```\n\
  csc Application2.cs\n```\n\n现在，我们创建源文件，用于创建两个应用程序域，并在这两个域中运行 `Application1.exe`\
  \ 和 `Application2.exe`。我们将这个类命名为 `Monitor.cs`（清单 23.18）。\n\n##### 清单 23.18. `Monitor.cs`\
  \ (C#)\n\n```\nusing System;\nusing System.Threading;\nusing System.Reflection;\n\
  \npublic class Test {\n\n  AppDomain dom1, dom2;\n\n  public Test() {\n\n    AppDomainSetup\
  \ info = new AppDomainSetup();\n    info.ApplicationBase = System.Environment.CurrentDirectory;\n\
  \n    dom1 = AppDomain.CreateDomain(\"RemoteDomain1\", null, info);\n    dom2 =\
  \ AppDomain.CreateDomain(\"RemoteDomain2\", null, info);\n    dom1.ExecuteAssembly(\"\
  c:\\\\book\\\\code\\\\Chapter23\n          \\\\Deployment\\\\Application1.exe\"\
  );\n    dom2.ExecuteAssembly(\"c:\\\\book\\\\code\\\\Chapter23\n          \\\\Deployment\\\
  \\Application2.exe\");\n\n    public static void Main(string[] args) {\n    Thread\
  \ t = new Thread(new ThreadStart(new Test().Run));\n    t.Start();\n  }\n\n    public\
  \ void Run() {\n      Thread.Sleep(1000);\n      Console.WriteLine(\"Unloading dom1\"\
  );\n      AppDomain.Unload(dom1);\n      Thread.Sleep(1000);\n      Console.WriteLine(\"\
  Unloading dom2\");\n      AppDomain.Unload(dom2);\n        }\n}\n```\n\n当我们运行 `Monitor.exe`\
  \ 时，会得到以下输出：\n\n```\nRunning App 1\nRunning App 2\nRunning App 1\nUnloading dom1\n\
  Running App 2\nRunning App 2\nRunning App 2\nUnloading dom2\n```\n\n清单 23.18 的内容不言自明。该类实例化一个线程，并在其构造函数中创建两个应用程序域，并在这些域中执行\
  \ `Application1.exe` 和 `Application2.exe`。接下来，实例化的线程休眠 1000 毫秒，然后卸载运行 `Application1.exe`\
  \ 的应用程序域。请注意，在此语句之后，`Application2.exe` 是唯一正在运行和打印的程序集。主线程再休眠一段时间，然后卸载第二个应用程序域，从而停止所有应用程序。\n\
  \n##### `System.Diagnostics`\n\n`System.Diagnostics` 命名空间包含许多有用的类，可帮助您的应用程序代码与操作系统交互。尽管可以使用此命名空间中的类执行一些有趣的\
  \ Windows 特定操作，但其中更重要的（或许对 Java 程序员更熟悉）是监控操作系统进程。在 Java 中，这通过 `java.lang.Process`\
  \ 类建模。该类仅提供只读方法。您无法使用此类的方法在 Java 中创建进程。在 .NET 中，此命名空间的 `Process` 类可用于查询现有进程详细信息以及创建新进程。\n\
  \n#### 23.6.4. 查询进程\n\n清单 23.19 展示了如何查询现有进程。该应用程序反复打印其运行所在的当前进程的详细信息。由于该应用程序创建了一个线程，它会保持进程运行，因此您将获得无尽的输出流，直到终止该进程。\n\
  \n##### 清单 23.19. 获取当前 .NET 进程详细信息 (C#)\n\n```\nusing System;\nusing System.Threading;\n\
  using System.Diagnostics;\n\npublic class OSProcessApp {\n\n  Process p;\n\n  public\
  \ OSProcessApp() { p = Process.GetCurrentProcess(); }\n\n    static void Main(string[]\
  \ args) {\n      Thread t = new Thread(new ThreadStart(new\n      OSProcessApp().Run));\n\
  \      t.Start();\n  }\n\n  public void Run() {\n    while (true) {\n      Thread.Sleep(400);\n\
  \      Console.WriteLine(p.BasePriority);\n      Console.WriteLine(p.Id);\n    \
  \  Console.WriteLine(p.TotalProcessorTime);\n      Console.WriteLine(p.UserProcessorTime);\n\
  \      Console.WriteLine(p.VirtualMemorySize);\n      Console.WriteLine(p.MachineName);\n\
  \    }\n  }\n}\n```\n\n清单 23.19 的输出将取决于您的机器，但这里是一个示例摘录：\n\n```\nPriority 8\nId 1380\n\
  Total processor time 00:00:00.5007200\nUser processor time 00:00:00.2303312\nVirtual\
  \ memory size 90882048\nMachine name .\nPriority 8\nId 1380\nTotal processor time\
  \ 00:00:00.5007200\nUser processor time 00:00:00.2303312\nVirtual memory size 90882048\n\
  ```\n\n#### 23.6.5. 创建和终止进程\n\n清单 23.20 展示了如何创建一个新进程然后终止它。我们创建并终止了运行本章前面创建的 `Application1.exe`\
  \ 所需的进程。\n\n##### 清单 23.20. 创建和终止进程 (C#)\n\n```\nusing System;\nusing System.Threading;\n\
  using System.Diagnostics;\n\npublic class Test {\n\n  static void Main(string[]\
  \ args) {\n\n    try {\n      Process p = Process.Start(\"C:\\\\BOOK\\\\code\\\\\
  Chapter\n      23\\\\Deployment\\\\Application1.exe\");\n      Thread.Sleep(5000);\n\
  \      p.Kill();\n    } catch (Exception e) {\n      Console.WriteLine(e.StackTrace);\n\
  \      }\n\n  }\n}\n```\n\n当您从命令行运行 清单 23.20 时，会弹出第二个控制台窗口并打印以下内容：\n\n```\nRunning\
  \ App 1\nRunning App 1\nRunning App 1\nRunning App 1\nRunning App 1\nRunning App\
  \ 1\n```\n\n大约 5 秒后，第二个弹出的控制台窗口会自动关闭。\n\n清单 23.20 使用 `Process` 类的 `static` 方法来创建进程。您也可以使用构造函数，并指定与此进程对应的\
  \ `ProcessStartInfo` 参数。\n\n#### 23.6.6. 重定向进程输出\n\n有时需要重定向特定进程生成的输出。试图获取 UNIX 进程\
  \ ID (PID) 的 Java 程序员可能熟悉这种方法：运行一个 UNIX 命令，然后解析该命令的输出。清单 23.21 展示了如何在 C# 中实现这一点。\n\
  \n##### 清单 23.21. 重定向进程输出 (C#)\n\n\n\n\n\n#### 23.6.6. 检测进程完成\n\n之前我们创建了一个进程，然后在不关心进程是否执行完毕的情况下将其终止。然而在实践中，你可能希望知道进程是否已完成。.NET\
  \ 框架提供了一个事件处理程序钩子，让你知道进程何时退出。清单 23.22 在清单 23.21 的示例基础上增加了事件处理。\n\n##### 清单 23.22.\
  \ 检测进程完成 (C#)\n\n```csharp\nusing System;\nusing System.Diagnostics;\n\npublic class\
  \ Test {\n\n  public static void Main() {\n\n    Process p = new Process();\n  \
  \  p.StartInfo.FileName = \"cmd.exe\";\n    p.StartInfo.Arguments = \"/c dir *.exe\"\
  ;\n    p.StartInfo.UseShellExecute = false;\n    p.StartInfo.RedirectStandardOutput\
  \ = true;\n\n    p.EnableRaisingEvents = true;\n    p.Exited += new EventHandler(ProcessDone);\n\
  \n    p.Start();\n\n    string output = p.StandardOutput.ReadToEnd();\n    Console.WriteLine(\"\
  Output of command \"+output);\n\n    p.WaitForExit();\n  }\n\n  private static void\
  \ ProcessDone(object sender, EventArgs e) {\n    Console.WriteLine(\"Process Exited\"\
  );\n  }\n}\n```\n\n清单 23.22 的输出如下：\n\n```\nVolume Serial Number is 50DD-3A83\nDirectory\
  \ of C:\\BOOK\\code\\Chapter 23\\Deployment\\bin\\Debug\n01/05/2003 10:13p  5,632\
  \ Deployment.exe\n1 File(s) 5,632 bytes\n0 Dir(s) 14,532,866,048 bytes free\n```\n\
  \n#### 23.6.7. 终止进程\n\n请注意，在清单 23.22 中，我们提供了两种检测进程完成的方法。一种是注册`ProcessDone`事件处理程序，另一种是`WaitForExit`方法，该方法在进程结束时返回。\n\
  \n`Process`类提供了几个有趣的方法，与 Java 的对应类相比，其 API 更为丰富。例如，如果你最近经常上网冲浪，想一键快速关闭所有 IE 浏览器实例，你只需创建一个包含清单\
  \ 23.23 所示代码的 EXE 程序集即可。\n\n##### 清单 23.23. 摆脱所有 IE 实例 (C#)\n\n```csharp\nusing\
  \ System;\nusing System.Diagnostics;\n\npublic class Test {\n  public static void\
  \ Main() {\n    Process[] processes = Process.GetProcessesByName(\"IEXPLORE\");\n\
  \    foreach (Process p in processes) {\n      p.Kill();\n    }\n  }\n}\n```\n\n\
  C#还提供了用于查询服务和操作系统（Windows）日志文件的 API。用于操作系统级别报告的类位于`System.Diagnostics`命名空间中。\n\n\
  ### 23.7. 总结\n\nC#和 Java 都提供了用于打包和管理应用程序的工具和 API。\n\n*   Java 中的应用程序是类文件或其打包的归档（`.jar`）文件。根据应用程序类型，Java\
  \ 提供不同风格的`.jar`文件（`.war`和`.ear`文件）。这些归档文件仅仅是磁盘文件的集合。.NET 中的部署单元是程序集。程序集可以是 EXE、模块或库（DLL）类型。一个程序集可以包含单个文件或多个模块（可能用不同语言编写）。程序集由`System.Reflection.Assembly`类表示。你可以使用此类来探索程序集，或者使用反射动态创建程序集。程序集具有全局唯一的强名称。与`.jar`、`.war`或`.ear`文件不同，程序集可以进行版本控制。一个程序集可以有一个关联的版本策略文件，该文件可以规定程序集的升级路径。两个不同版本的相似程序集可以共存。\n\
  \n*   应用程序配置内置于.NET 中。与 Java 属性文件不同，.NET 配置文件基于 XML。配置文件由 CLR 自动识别。配置文件可以包含名称/值对的节，这些节可以通过`System.Collections`类访问。\n\
  \n*   在.NET 中，应用程序隔离的单元是应用程序域。在 Java 中，根据应用程序的不同，应用程序隔离的单元是 JVM 实例；或者，在现代符合 J2EE\
  \ 规范的应用程序服务器中，它可以是特定于 Web 应用程序的类加载器，这允许两个 Web 应用程序之间存在相似的类。在.NET 中，单个操作系统进程可以包含多个应用程序域，每个应用程序域映射到一个应用程序。这些应用程序彼此独立运行。你可以停止应用程序而不影响在同一进程中运行的同级应用程序。一个应用程序中的故障不会影响其他应用程序。应用程序域内置了加载和执行远程程序集的支持。你可以调用在远程应用程序中定义的类型上的方法，而不会产生任何性能损失，因为方法调用是进程内的，而不是进程间的。\n\
  \n*   .NET 的`System.Diagnostics`命名空间提供了多个用于与操作系统交互的类。其中一个类是`Process`类，它类似于`java.lang.Process`类。然而，与\
  \ Java 对应类不同，.NET 的`Process`类让你能做很多事情。你可以查询、创建和终止进程。\n\n## 附录. Java 与 C# API 对比\n\
  \nJava 和.NET C#中的类在企业计算的多个领域提供了相当的功能。这些语言内置了对数据库访问、图形处理、XML 处理、网络、反射以及许多其他企业任务的支持。这些语言还提供了一组基本的实用程序类和接口，构成了用户构建的基础。本附录提供了\
  \ Java 和 C#类库功能的快速参考。\n\n我们主要列出了 JDK 1.4 中的类及其在企业计算不同领域的 C#对应类。列出了常用的包和命名空间及其类。请注意，我们没有显示在.NET\
  \ 中没有明确对应物的类，也没有显示在.NET 中没有等效概念的类。\n\n### A.1. `java.lang`包\n\n这是 Java 的核心包，由构成其余语言\
