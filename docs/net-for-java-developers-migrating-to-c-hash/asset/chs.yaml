  \ \"EmployeeTerritories\");\n\n      row = ds.Tables[\"EmployeeTerritories\"].Rows.Find(new\n\
  \                                         object[] {1, 06897} );\n      row.Delete();\n\
  \n      adapter.Update(ds, \"EmployeeTerritories\");\n\n    } finally {\n      \
  \ conn.Close();\n    }\n\n  }\n\n  private static SqlConnection GetConnection()\
