  \ () {\n      Console.WriteLine(\"Protected Leaf Class\");\n  }\n\n  private void\
  \ PrivateM () {\n      Console.WriteLine(\"Private Leaf Class\");\n  }\n\n  static\
  \ void Main(string[] args) {\n    LeafClass lc = new LeafClass();\n    lc.PublicM();\n\
  \    lc.PrivateM();\n    lc.ProtectedM();\n    SubClass sc = new LeafClass();\n\
  \    sc.PublicM();\n    //sc.PrivateM();\n    //sc.ProtectedM();\n    SuperClass\
