  \ 方法组成。\n\n### 20.4. 在 .NET 中使用 DOM API\n\n.NET 的 DOM 实现（`System.Xml.XmlDocument`）支持所有\
  \ DOM Level 1 和所有 DOM Level 2 Core，但有一些细微的命名更改。DOM 加载建立在 `XmlReader` 之上，DOM 序列化建立在\
  \ `XmlWriter` 之上。\n\n如前所述，DOM API 的核心是 DOM 树数据结构。该树由节点或元素组成。典型 XML 文档的所有节点（元素、处理指令、属性、文本、注释等）都在\
  \ DOM 树中表示。因为 DOM 树是在内存中为整个文档构建的，所以你可以自由地在文档中的任何位置导航（不同于 `XmlReader` 类，它有一个仅向前的游标）。\n\
  \n构成此树根的核心类是 `XmlDocument` 类。你通过加载任何格式正确的 XML 数据流来创建 `XmlDocument` 对象。清单 20.8 展示了如何从\
  \ `people.xml` 文件加载 `XmlDocument` 以及如何遍历文档。遍历树数据结构的最佳方式是通过递归。清单 20.8 展示了如何使用递归来遍历\
  \ XML DOM 树。\n\n##### 清单 20.8. 遍历 DOM 树 (C#)\n\n```\nusing System;\nusing System.Xml;\n\
  \npublic class Test {\n\n  public static void Main(string[] args) {\n\n    XmlDocument\
  \ doc = new XmlDocument();\n    doc.Load(\"c:\\\\people.xml\");\n    PrintNodeDetail(doc.GetElementsByTagName(\"\
  People\")[0]);\n  }\n\n  private static void PrintNodeDetail (XmlNode node) {\n\n\
  \    //Print the node type, node\n      //name and node value (if any) of the node\n\
  \    if (node.NodeType == XmlNodeType.Text) {\n      Console.WriteLine(\"Type= [\"\
  \ ode.NodeType+\"]\n                                            Value=\" ode.Value);\n\
  \n    } else {\n      Console.WriteLine(\"Type= [\" ode.NodeType+\"]\n         \
  \                                     Name=\" ode.Name);\n    }\n\n    //Print attributes\
  \ of the node\n    if (node.Attributes != null) {\n      XmlAttributeCollection\
  \ attrs = node.Attributes;\n      foreach (XmlAttribute attr in attrs) {\n     \
  \   Console.WriteLine(\"\\tAttribute Name =\"+attr.Name+\"\n                   \
  \             Attribute Value =\"+attr.Value);\n      }\n    }\n    //Print individual\
  \ children of the node\n    XmlNodeList children = node.ChildNodes;\n    foreach\
  \ (XmlNode child in children) {\n      PrintNodeDetail (child);\n    }\n  }\n}\n\
  ```\n\n以下是清单 20.8 的部分输出：\n\n\n\n# XML DOM 操作示例\n\n```\nType= [Element] Name=People\n\
