- "# Java 开发者的 .NET 指南：迁移至 C#\n\n\n\n\n\n## 前言\n\nC# 语言由微软发布，作为开发 .NET 应用程序的核心语言之一。C#\
  \ 与 Sun Microsystems 的 Java 编程语言有着惊人的相似之处。但除了相似之处，在整体编程方法、语法和构造方面也存在大量差异和偏差。在您热衷于将\
  \ Java 技能转移到 C# 时，很容易忽视这些差异。每种语言都有其良好的编码实践，而良好的 Java 编码实践不一定就是良好的 C# 编码实践。本书的目的是从\
  \ Java 程序员的角度阐述 C# 的基础知识。我们在强调良好 C# 编码实践的同时，也揭示了两种语言之间的差异。\n\n### 本书有何不同\n\n本书由程序员为程序员编写，因此您会发现本书描述较少，代码较多。您会注意到大量的完整代码示例，用于说明\
  \ C# 的概念、构造、语法和理念。在可能的情况下，我们提供了 Java 代码清单。代码清单有时相当复杂，我们试图通过逐步讲解代码来解释概念。这种方法类似于一些\
  \ Java 开源项目教程。\n\n作为 Java 程序员，您会注意到我们研究了 Java 的特性和惯用法，以探讨它们是否也存在于 C# 中。我们还研究了 C#\
  \ 的一些特性，以发现它们为何不存在于 Java 中，以及为何在 C# 中设计不同。在某些地方，我们给出了在 C# 中变得多余的 Java 编码实践。例如，在\
  \ Java 世界中，使用 `+` 运算符连接字符串和创建大字符串一直受到强烈批评，但在 C# 中这并不一定是坏事。\n\n我们为每一章提供了其独特的代码清单，而不是在整个书中构建一个庞大的应用程序。另请注意，本书侧重于讨论\
  \ C# 语言，而不是 .NET 开发环境附带的相关工具。\n\n### 谁应该阅读本书？\n\n正如标题所示，本书是为典型的 Java 程序员量身定制的。那些经常使用\
  \ Java 编程的人在阅读本书后，应该能快速掌握 C#。如果您没有使用 Java 编程，您应该熟悉面向对象编程（OOP）的基础知识，并且应该使用过 OOP 语言（如\
  \ C++ 或 Smalltalk）进行编程。如果您不熟悉 OOP，我们建议您磨练 OOP 技能，熟悉使用类、接口、对象和多态，然后再学习 C#。\n\n###\
  \ 章节概览\n\n虽然欢迎您随时查阅任何章节作为理解其 C# 概念的参考，但我们建议按顺序阅读各章。这样，在讨论更晦涩的 API 时，您就不会被语法和构造问题所困扰。以下是每章的简要描述。\n\
  \n第 1 章，.NET 框架，概述了 .NET 框架的各个组成部分。渴望编码的读者可以跳过本章。\n\n第 2 章，C# 入门，探讨了著名的 Hello World\
  \ 程序——首先不使用 Visual Studio .NET 集成开发环境（IDE），然后使用 IDE。我们简要解释了 IDE 的组成部分。如果您要开发大型企业应用程序，了解\
  \ IDE 很重要。但是，要理解语言概念，您不需要精通 IDE。\n\n第 3 章，C# 与 Java：有何不同？，列出了 C# 的特性，并将其与 Java 中的等效特性进行了比较。本章适合那些想快速了解\
  \ C# 与 Java 区别的人阅读。\n\n第 4 章，编写对象，深入探讨 OOP 的核心：编写对象。Java 编程就是编写类。\n\n第 5 章，理解继承和多态，探讨了任何\
  \ OOP 语言的基石。Java 和 C# 都使用单根类层次结构并具有多态性。作为 Java 程序员，您可能已经习惯了 Java 始终开启的自动虚拟分派。C#\
  \ 的方法是默认关闭虚拟分派。这对您作为 Java 程序员意味着什么？本章说明了如果 Java 程序员不小心可能会陷入的一些 C# 陷阱。\n\n第 6 章，实现接口，解释了\
  \ Java 和 C# 都允许一个类实现多个接口。我们讨论了 C# 接口的几个方面。\n\n第 7 章，数据类型，探讨了构成编程语言的元素。C# 提供了比 Java\
  \ 更多的数据类型和构造。如果您想利用 C# 特有的构造，而不是最终在 C# 中将所有内容都编写为类，您应该阅读本章。\n\n第 8 章，运算符，涵盖了一个相当普通但重要的话题。您可能会惊讶地发现\
  \ C# 支持运算符重载。\n\n第 9 章，基本控制流，讨论了控制流语句，如 `if-then-else`、`switch`、`for`、`foreach`\
  \ 等等。C# 是一种非常富有表现力的语言，包含一些构造的内置优化。您将了解到 C# 允许在 `switch` 语句中使用字符串，以及许多其他令人惊讶的细节。\n\
  \n\n\n\n\n## 第 10 章，使用异常进行编程\n\n第 10 章，使用异常进行编程，探讨了在 C++中曾经是一个可选项，而现在已成为 Java 语言主要组成部分的内容。幸运的是，C#和\
  \ Java 都同意将异常处理作为语言的核心部分。不幸的是，C#中没有`throws`子句。那么，你如何知道你调用的方法会抛出哪些异常呢？作为 Java 程序员，你可能会发现\
  \ C#宽松的异常处理既是福音也是诅咒。\n\n## 第 11 章，使用数组\n\n第 11 章，使用数组，解释了这种在任何编程语言中都能找到的基本数据结构。C#比大多数语言更进一步，为数组提供了一个特殊的类。\n\
  \n## 第 12 章，处理字符串\n\n第 12 章，处理字符串，涉及 Java 中最普遍存在的类之一，它在 C#中同样司空见惯。本章讨论了字符串相等性、驻留和优化的基本概念。\n\
  \n## 第 13 章，格式化数字、字符串和日期\n\n第 13 章，格式化数字、字符串和日期，讨论了 C#中与`java.text.*`包等效的功能。\n\n\
  ## 第 14 章，使用集合\n\n第 14 章，使用集合，解释了 Java 和 C#的集合如何让你无需重新发明轮子就能构建一辆汽车。不幸的是，C#的集合库目前还无法与\
  \ Java 提供的功能相媲美。\n\n## 第 15 章，使用 C# I/O API\n\n第 15 章，使用 C# I/O API，讨论了 I/O 流、文件、目录和序列化。C#区分文件和目录，并提供了多种方式使类可序列化。\n\
  \n## 第 16 章，线程编程\n\n第 16 章，线程编程，向你展示 C#如何简化了线程处理。你终于可以在 C#中关闭线程了，它还为你提供了一个系统提供的线程池——这意味着不再需要费力寻找第三方实现。你可以对资源使用读写锁，这是\
  \ JDK 开箱即不提供的功能。C#还为你提供了四种编写多线程类的不同方式。本章还有更多惊喜等待揭晓。\n\n## 第 17 章，使用 C#属性、索引器和特性\n\
  \n第 17 章，使用 C#属性、索引器和特性，可能会唤起那些曾经是 Visual Basic 程序员的 Java 程序员久已遗忘的记忆。属性通过消除 getter\
  \ 和 setter 调用来减少代码冗余。索引器让你可以将集合当作数组来处理，而特性则让你可以调整代码的元数据。Java 不支持这些特性中的任何一个。\n\n\
  ## 第 18 章，委托和事件编程\n\n第 18 章，委托和事件编程，解释了在 Java 中被放弃的函数指针如何在 C#中以委托的形式回归。这是 C#如何不将每个概念或构造都建模为类的又一个例子。\n\
  \n## 第 19 章，访问数据库\n\n第 19 章，访问数据库，涉及.NET 核心 API 的一部分功能。一个独特的 C#数据结构是`RowSet`对象，它基本上是\
  \ RDBMS 表或视图的内存表示。本章讨论了你将需要执行的一些常规数据库操作。\n\n## 第 20 章，处理 XML\n\n第 20 章，处理 XML，揭示了在\
  \ Java 1.4 中终于进入核心 API 的 XML 处理，在 C#中是一等公民。C#的核心库为 XML、XSL 转换和 XPath 提供了内置支持。\n\n\
  ## 第 21 章，C#中的 GUI 编程\n\n第 21 章，C#中的 GUI 编程，充满了为 GUI 构建者提供的实用建议。Java Swing 库已成为构建客户端\
  \ Java GUI 应用程序的首选 API。Swing 库由遵循 MVC（模型-视图-控制器）模式的类组成。虽然非常模块化，但 Swing 使用起来可能很繁琐，因为\
  \ JDK 不附带 GUI 设计器。这使得设计丰富的交互式屏幕成为一件苦差事，因为一切都必须手工编码。直到最近，才出现了第三方 Java IDE 来简化 Swing\
  \ 编程。相比之下，.NET Windows Forms 库让人想起 Visual Basic 的拖放窗体，以及与窗体控件关联的事件驱动代码。如果你手头有 Visual\
  \ Studio .NET，那么 C#中的 GUI 编程就简化为拖放和添加基于事件的代码。Visual Studio .NET 窗体设计器对于苦苦挣扎的 Swing\
  \ 程序员来说是一个受欢迎的改变。\n\n## 第 22 章，反射\n\n第 22 章，反射，解释了反射能力与托管代码和类型安全数据类型密不可分。反射允许你探测各种语言构造背后的元数据。C#和\
  \ Java 都提供了一套很棒的反射 API 类。但 C#的反射发射功能更胜一筹，因为它允许你动态生成和运行 MSIL 代码。\n\n## 第 23 章，程序集、应用程序配置和进程管理\n\
  \n第 23 章，程序集、应用程序配置和进程管理，认为打包就是一切。即使对于计算机应用程序来说也是如此。打包和部署不当的应用程序要么无法运行，要么会在运行时给你带来麻烦。C#程序集允许你将复杂的应用程序作为一个可版本控制的单元进行部署。C#还提供了多个深入挂钩到\
  \ Windows 操作系统进程管理的功能。在本章中，你将全面了解程序集和进程。\n\n### 本书使用的代码风格\n\n代码约定各不相同，你应该坚持你的编程团队或组织遵循的约定。在这里，我们通过使用不同的字体样式（`code`）来区分代码和普通文本。我们避免使用匈牙利命名法来命名变量，而是使用\
  \ Java 风格。例如，我们使用\n\n```\n int count;\n```\n\n而不是\n\n```\n int m_IntCount;\n```\n\
  \n方法名遵循帕斯卡命名法，而不是 Java 的驼峰命名法。因此，Java 方法名\n\n```\n getName()\n```\n\n将被翻译为\n\n```\n\
  \ GetName()\n```\n\n循环和控制流语句遵循倾斜风格，其中左大括号出现在行尾，右大括号出现在行首：\n\n```\n for (int  i =\
  \ 0; i < 100; i++) {\n//Code goes here\n}\n```\n\n我们在代码中不明显的地方进行了注释。我们认为代码应该尽可能地不言自明。这可以通过给变量和方法赋予有意义的名称来实现，这样方法的意图无需额外注释就能传达。例如，以下方法的意图是显而易见的：\n\
  \n```\n public void PrintProperties(object o)\n```\n\n代码清单围绕解释一两个概念展开。我们试图在保持代码清单趣味性的同时，保持其焦点。当一个概念不值得一个完整的类时，我们使用代码片段。\n\
  \n### 作者致读者\n\n写这本书对我们来说是一次很棒的学习经历。我们惊喜地发现 C#与 Java 并没有太大不同，只有少数例外。作为 Java 程序员，你应该认为自己已经掌握了在\
  \ Java 世界中编码所习惯的基本策略、模式和惯用法，因为你可以轻松地将这些实践中的大部分转移到 C#世界。\n\n我们发现这两种语言之间的主要区别在于，Java\
  \ 通过将所有内容建模为类来强调一致性，而 C#则有许多不是类的编程构造：枚举、结构体、属性、索引器、委托和指针。这意味着你可以在 C#中继续将所有内容建模为类，但如果你这样做，你将失去利用某些\
  \ C#构造中内置效率的好处。这些构造也使生成的代码更具表现力。考虑到这一点，我们鼓励你在可能的情况下使用 C#风格。\n\n\n\n\n最后，我们鼓励你尝试使用\
  \ Visual Studio .NET IDE。虽然并非必须用它来编写 C# 程序，但我们推荐使用，因为它能帮助你快速构建应用程序，并减少快速设计大型应用程序时的一些繁琐工作。\n\
