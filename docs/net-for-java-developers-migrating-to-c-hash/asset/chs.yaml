  ### 21.5. 锚定与停靠\n\n.NET GUI 类与 Java AWT 和 Swing 类之间的一个关键区别在于它们在容器对象内布局控件的方式。在 .NET\
  \ 中，容器内控件的默认定位是绝对的。这意味着在决定将控件放置在容器上的确切位置时，必须指定具体的数值。这也意味着当容器调整大小时，控件不会随之调整大小。在 Java\
  \ AWT 和 Swing 中，控件的定位是相对于容器的，并使用可用的布局管理器来指定。因此，控件会随容器一起调整大小。\n\n在 .NET 中，如果没有调整控件大小的代码，当容器调整大小时，控件将会重叠。然而，.NET\
  \ Windows 库提供了两个概念——锚定和停靠——允许控件随容器自动调整大小。\n\n# 21.5.1. 锚定\n\n当控件锚定到容器的边缘时，控件边缘与容器边缘之间的距离在容器调整大小时保持不变。控件可以锚定到任意组合的边缘，这会导致控件根据需要调整大小以保持边缘之间的距离。清单\
  \ 21.9 清楚地说明了这一点。\n\n##### 清单 21.9. 锚定控件\n\n\n\n\n\n# 21.5.1. 锚定\n\n```csharp\n\
  using System;\nusing System.IO;\nusing System.Drawing;\nusing System.Windows.Forms;\n\
  \npublic class TestForm : Form {\n\n  Button noResizeButton;\n  Button yesResizeButton;\n\
  \  StreamWriter logger = null;\n\n  public TestForm () {\n    noResizeButton = new\
  \ Button();\n    noResizeButton.Text = \"Not anchored\";\n    noResizeButton.Width\
  \ = 100;\n    noResizeButton.Location = new Point(30, 30);\n\n    yesResizeButton=\
  \ new Button();\n    yesResizeButton.Text = \"Anchored\";\n    yesResizeButton.Anchor\
  \ = AnchorStyles.Left |\n                             AnchorStyles.Right |\n   \
  \                          AnchorStyles.Bottom |\n                             AnchorStyles.Top;\n\
  \    yesResizeButton.Width = 100;\n    yesResizeButton.Location = new Point(30,\
  \ 80);\n    yesResizeButton.Layout +=\n        new LayoutEventHandler(YesLayoutEvent);\n\
  \    Controls.Add(noResizeButton);\n    Controls.Add(yesResizeButton);\n    InitLogger();\n\
  \  }\n\n  private void YesLayoutEvent(object source,\n           LayoutEventArgs\
  \ args) {\n    logger.WriteLine(\"Form.Left - yesResizeButton.Left\n        =\"\
  +(this.Left-yesResizeButton.Left));\n    logger.WriteLine(\"Form.Right - yesResizeButton.Right\n\
  \        =\"+(this.Right-yesResizeButton.Right));\n    logger.WriteLine(\"Form.Top\
  \ - yesResizeButton.Top\n        =\"+(this.Top -yesResizeButton.Top ));\n    logger.WriteLine(\"\
  Form.Bottom - yesResizeButton.Bottom\n        =\"+(this.Bottom -yesResizeButton.Bottom));\n\
  \    logger.WriteLine(\"Form.Left - noResizeButton.Left\n        =\"+(this.Left-noResizeButton.Left));\n\
  \    logger.WriteLine(\"Form.Right - noResizeButton.Right\n        =\"+(this.Right-noResizeButton.Right));\n\
  \    logger.WriteLine(\"Form.Top - noResizeButton.Top\n        =\"+(this.Top -noResizeButton.Top\
  \ ));\n    logger.WriteLine(\"Form.Bottom - noResizeButton.Bottom\n        =\"+(this.Bottom\
  \ -noResizeButton.Bottom));\n  }\n\n  static void Main() {\n    Application.Run(new\
  \ TestForm());\n  }\n\n  public void InitLogger() {\n    FileStream fs = new\n \
  \     FileStream(\"c:\\\\anchor.txt\",FileMode.OpenOrCreate,\n      FileAccess.ReadWrite,\
  \ FileShare.None);\n    logger = new StreamWriter(fs);\n  }\n\n}\n```\n\n`清单 21.9`\
  \ 是一个包含两个按钮控件的简单窗体。其中一个按钮被锚定，另一个则没有。这两个按钮在窗体的构造函数中初始化：\n\n```csharp\nnoResizeButton\
  \ = new Button();\nnoResizeButton.Text = \"Not anchored\";\nnoResizeButton.Width\
  \ = 100;\nnoResizeButton.Location = new Point(30, 30);\n\nyesResizeButton= new Button();\n\
  yesResizeButton.Text = \"Anchored\";\nyesResizeButton.Anchor = AnchorStyles.Left\
  \ |\n                         AnchorStyles.Right |\n                         AnchorStyles.Bottom\
  \ |\n                         AnchorStyles.Top;\nyesResizeButton.Width = 100;\n\
  yesResizeButton.Location = new Point(30, 80);\nyesResizeButton.Layout +=\n     \
  \  new LayoutEventHandler(YesLayoutEvent);\n\nControls.Add(noResizeButton);\nControls.Add(yesResizeButton);\n\
  InitLogger();\n```\n\n`yesResizeButton` 按钮被锚定，这通过指定其锚定的边缘来表示。在 `清单 21.9` 中，该按钮被锚定到窗体的所有边缘。这意味着当窗体调整大小时，该按钮的边缘与窗体边缘之间的距离应保持不变。\n\
  \n为了证明这一点确实发生了，我们将控件边缘与窗体边缘之间的距离记录到一个名为 `anchor.txt` 的文本文件中。`InitLogger` 方法初始化将写入此日志的文件：\n\
  \n```csharp\npublic void InitLogger() {\n  FileStream fs = new\n    FileStream(\"\
  c:\\\\anchor.txt\",FileMode.OpenOrCreate,\n    FileAccess.ReadWrite, FileShare.None);\n\
  \  logger = new StreamWriter(fs);\n}\n```\n\n当窗体调整大小时，CLR 会广播可以由事件处理程序处理的事件。`清单\
  \ 21.9` 的事件处理程序指定如下：\n\n```csharp\nyesResizeButton.Layout +=\n    new LayoutEventHandler(YesLayoutEvent);\n\
  ```\n\n在 `YesLayoutEvent` 方法中，我们记录两个按钮的边缘与窗体之间的距离。当你运行应用程序并调整窗体大小时，应用程序会记录每一次调整大小的事件。生成的文本文件示例如下：\n\
  \n```\nForm.Left - yesResizeButton.Left =58\nForm.Right - yesResizeButton.Right\
  \ =258\n  Form.Top - yesResizeButton.Top =8\nForm.Bottom - yesResizeButton.Bottom\
