  \ GUI 范式等同于 Visual Basic 的窗体、属性和事件模型。\n\n## 21.4 综合应用\n\n在本节中，我们将演示一个简单的 GUI 前端。我们将使用\
  \ .NET IDE 来组装 GUI 控件，省去指定其设计时显示属性的繁琐工作。然后，我们将向相关部分添加代码，使这些控件具有交互性。图 21.7 显示了应用程序的快照。\n\
  \n##### 图 21.7 People Browser\n\n![](img/0672324024_ch21lev1sec4_image01.gif)\n\n\
  #### 21.4.1 应用程序功能\n\n该应用程序允许用户打开并加载一个包含 `Person` 对象数据的特定格式 XML 文件。然后，它在 GUI 控件中显示解析后的数据，以便于浏览。\n\
  \n#### 21.4.2 应用程序源文件\n\n要查看构成应用程序的源文件列表，请在 .NET IDE 中单击“视图”，然后单击“解决方案资源管理器”。为简单起见，我们采用了\
  \ Java 风格，即每个源文件只指定一个类，并将源文件命名为与类文件相同的名称。构成应用程序的类列在 表 21.5 中。\n\n**表 21.5** 示例 GUI\
  \ 应用程序中的类\n\n| 源文件 | 描述 |\n| --- | --- |\n| `Person.cs` | 建模 `Person` 类。`Person`\
  \ 对象由几个属性以及地址和联系信息对象列表组成。`Person` 对象在 XML 文件中存储为 `<Person>` 标签。 |\n| `Address.cs`\
  \ | 建模 `Address` 类。`Address` 对象由几个属性组成。地址对象在 XML 文件中存储为 `<Address>` 标签。 |\n| `ContactInfo.cs`\
  \ | 建模一个人的电话号码或电子邮件地址。`Person` 对象维护电话号码和电子邮件地址的列表。尽管在 GUI 中我们区分电话和电子邮件，但用于存储这两者的数据结构是\
  \ `ContactInfo` 对象。 |\n| `MainForm.cs` | 这是应用程序的主窗口。主窗体将窗口分为人员树（在窗口左侧）和右侧面板，右侧面板由\
  \ `PersonDetailForm` 组成。 |\n\n\n\n\n\n### 21.4.3. 应用程序控件\n\n| `PersonDetailForm.cs`\
  \ | 此窗体显示一个 `Person` 对象的详细信息。这些详细信息进一步分为两个水平面板。上方面板显示该人的 `姓氏`、`名字`、`用户名`、`密码` 和\
  \ `性别`，下方面板则显示一个选项卡控件，包含该人的地址、电子邮件和电话信息。 |\n\n| `PersonNode.cs` | 这是 `Person` 类的一个包装类，代表主窗口中显示的\
