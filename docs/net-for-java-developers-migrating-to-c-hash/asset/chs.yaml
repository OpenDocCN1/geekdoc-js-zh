  \ Java 的 `java.sql.PreparedStatement` 类。然后，该命令使用 `ExecuteQuery` 方法执行查询。该方法分别返回一个\
  \ `SqlDataReader` 或 `OleDbDataReader`。这在概念上等同于 `java.sql.ResultSet` 类的作用。\n\n一个可能对\
  \ Java 开发者有帮助的相似之处是，这些读取器不提供根据列名检索列数据的方法。这意味着你不必熟悉查询返回的列的顺序。请注意，第一列是通过索引 `0` 而不是\
  \ `1`（如 Java 中那样）获取的。`java.sql.ResultSet` 允许通过列顺序或列名进行访问。\n\n## 使用 `ExecuteScalar`\
  \ 方法\n\n`清单 19.3` 展示了如何使用命令的 `ExecuteScalar` 方法。当你知道查询只获取单列数据时，这是一个便捷的方法。Java 没有提供这样的便捷方法，因此你必须使用类似这样的代码：\n\
  \n```java\n ResultSet rs = stmt.executeQuery();\nIf (rs.next()) {\n  int count =\
  \ rs.getInt(1);\n}\n```\n\n`清单 19.3` 还展示了如何使用接口而不是具体类来编写与提供程序无关的代码。\n\n### 清单 19.3.\
  \ 使用 `ExecuteScalar` 函数 (C#)\n\n```csharp\nusing System;\nusing System.Data;\nusing\
  \ System.Data.OleDb;\nusing System.Data.SqlClient;\n\nclass Test {\n\n  public static\
  \ void Main(string[] args) {\n    GetData();\n  }\n  private static void GetData()\
  \ {\n    IDbConnection conn = null;\n    try {\n      conn = GetConnection();\n\
  \      IDbCommand command = conn.CreateCommand();\n      command.CommandText = \"\
  SELECT COUNT(*) FROM CUSTOMERS\n                            WHERE UPPER(COUNTRY)\
  \ = 'GERMANY'\";\n      Console.WriteLine(\"Number of customers from Germany =\n\
  \                                    \"+command.ExecuteScalar());\n    } finally\
  \ {\n      if (conn != null) conn.Close();\n    }\n  }\n\n  private static IDbConnection\
  \ GetConnection()\n\n    SqlConnection conn = new SqlConnection();\n    conn.ConnectionString\
  \ = \"Initial Catalog=Northwind;Data\n                   Source=localhost;Integrated\
  \ Security=SSPI;\";\n    conn.Open();\n    return conn;\n  }\n\n}\n```\n\n`清单 19.3`\
  \ 的输出如下：\n\n```\n Number of customers from Germany = 11\n```\n\n## 运行时参数绑定\n\n到目前为止，我们看到的\
  \ `SELECT` 查询都是完整的，意味着在运行时没有绑定参数。`清单 19.4` 展示了如何在运行时绑定参数。\n\n### 清单 19.4. 运行时参数绑定\
