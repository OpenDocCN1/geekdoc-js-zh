  ### 关于作者\n\nJawahar Puvvala 在过去五年中，一直在为多家高科技公司开发基于 Sun 和 Microsoft 技术的企业应用程序。Jawahar\
  \ 是北卡罗来纳州夏洛特市 Nucor 公司的顾问。是结构工程让 Jawahar 成为编程专家；他的教育背景是用 C++ 为机械和结构工程系统编写矩阵分析软件。如今，他专注于使用各种技术和语言（包括\
  \ COM+、MFC、ATL、ASP、MSMQ、XML、XSLT、DCOM、SOAP、C++、C#、Java 和 Visual Basic）进行客户端-服务器和分布式应用程序开发。他发表了几篇关于结构工程的期刊和会议论文。\n\
  \nJawahar 用 Java 为纺织行业编写了他的第一个企业级应用程序。虽然他不是一个痴迷于 100% 纯 Java 的程序员，但他认为正是 Java 中的接口编程概念为他成功掌握\
  \ Microsoft 技术中的 COM/DCOM 奠定了基础。\n\n不工作的时候，他会花时间打理房子和家庭网络。可以通过 jawahar@carolina.rr.com\
  \ 联系他。\n\nAlok Pota 是一个 Java 迷，目前在德克萨斯州奥斯汀市的 Digital Motorworks (DMi) 担任 J2EE 应用程序开发人员。Alok\
  \ 在过去五年中一直使用 J2EE 技术开发服务器端企业应用程序，并始终寻求 Java 技术中最新和最好的东西。在使用 Java 之前，他的专长是用 Visual\
  \ C++、Visual Basic 和 FORTRAN 编写科学数值分析和可视化软件。Alok 发表的作品包括大量关于数学建模和专家系统的科学文章。\n\n\
  Alok 的编程生涯始于用 C++ 编写数值建模软件。结合他的建模技能和对人工智能领域的兴趣，这段经历帮助他编写了一个基于专家系统外壳 CLIPS（C 语言集成生产系统）的决策支持系统。当他接触\
  \ Java 后，他从编写科学软件转向编写与业务相关的软件。\n\n不研究 Java 或摆弄最新 API 的时候，Alok 喜欢和他的儿子 Rajiv 玩耍。可以通过\
  \ apota@austin.rr.com 联系 Alok。\n\n### 关于技术审阅者\n\nMark Burhop 是俄亥俄州辛辛那提市的一名高级软件工程师，也是辛辛那提大学的兼职教员。他在计算机辅助工程和产品数据管理领域拥有超过\
  \ 15 年的软件开发经验，使用的技术范围从 Microsoft .NET (C#) 到 Java 再到 C++。作为一名作者，他目前专注于展示如何编写高性能的\
  \ C# 应用程序。更多关于 Mark 及其工作的信息，请访问 [`www.markburhop.com`](http://www.markburhop.com)。\n\
  \nHoward Lee Harkness 在近三十年的时间里，靠用十几种不同的语言编写软件以及教授其他程序员谋生。他拥有德克萨斯大学的计算机科学学位，曾参与过各种软件工作，从军事和汽车应用中的嵌入式系统到基于\
  \ Web 的物料清单系统。业余时间，他在爱尔兰音乐会上拉小提琴。\n\nKevin T. Price 是弗吉尼亚州维也纳市的一名高级技术专家，专注于安全性和可扩展性，多年来一直在\
  \ Microsoft 工具集内从事应用程序开发的各个方面工作。他还为几本与 XML、安全性和 .NET 技术相关的书籍撰写过章节或进行过编辑。不坐在电脑前时，Kevin\
  \ 经常出现在厨房或彩弹射击场。可以通过 kpcrash@patriot.net 联系他。\n\n# 第一章 .NET Framework\n\n本章探讨 .NET\
  \ Framework 的组成部分，它由公共语言运行时（CLR）环境和 .NET Framework 类库构成。.NET Framework 本身只是微软 .NET\
  \ 技术的一小部分。.NET 技术包含一系列技术、服务、工具和概念。我们将首先了解 .NET 的全貌，然后讨论框架组件。\n\n## 1.1. 什么是 .NET？\n\
  \n.NET 是微软用于开发可扩展标记语言（XML）Web 服务的平台，这些服务允许应用程序通过互联网进行通信和共享数据。.NET 平台包含五个方面：\n\n\
  1.  .NET 体验：这些是 XML Web 服务，允许你以集成的方式从互联网和独立应用程序中访问信息。.NET 体验的例子包括 MSN、bCentral、Passport\
  \ 和 Microsoft Visual Studio .NET。\n\n2.  客户端：这些是 PC、笔记本电脑、工作站、电话、手持电脑、平板电脑、游戏机和其他智能设备。使这些设备“智能”的是它们访问\
  \ XML Web 服务的能力。智能客户端使用支持 XML Web 服务的软件，使你能够无论使用何种位置、类型和数量的客户端都能访问你的数据。\n\n3.  XML\
  \ Web 服务：这些为应用程序与其他应用程序交互提供了直接手段。托管在内部以及远程系统上的应用程序可以通过使用 XML 和简单对象访问协议（SOAP）消息通过互联网进行通信。除了开发人员创建\
  \ XML Web 服务外，微软还在创建一组核心的构建块服务，这些服务执行日常任务，并作为开发人员构建的基础。正在构建的第一组 XML Web 服务被称为 .NET\
  \ My Services，它们是以用户为中心的服务：面向人而非设备、网络或应用程序的服务。\n\n4.  服务器：微软 .NET 企业服务器，包括微软 Windows\
  \ 2000 服务器系列，构成了用于部署、管理和协调 XML Web 服务的微软 .NET 服务器基础设施。\n\n5.  工具：Microsoft Visual\
  \ Studio .NET 和 Microsoft .NET Framework 为开发人员构建、部署和运行 XML Web 服务提供了完整的解决方案。这些工具最大化了\
  \ XML Web 服务的性能、可靠性和安全性。Visual Studio .NET 是微软流行的多语言开发工具的下一代版本，专为 .NET 构建。.NET Framework\
  \ 是一个高生产力、基于标准的多语言应用程序执行环境，它处理基本的管道工作并简化部署。它提供了一个应用程序执行环境，管理内存、解决版本控制问题，并提高应用程序的可靠性、可扩展性和安全性。\n\
  \n本章主要探讨框架组件。\n\n## 1.2. .NET Framework 术语和核心概念\n\n与任何其他平台一样，.NET Framework 引入了一些你需要了解的术语。以下是其中一些术语的列表。\n\
  \n### 1.2.1. CLR\n\n公共语言运行时（CLR）是 .NET Framework 的关键组件。CLR 是所有托管代码运行的容器或执行环境。CLR\
  \ 的名称源于 .NET 提供了一个二进制标准，任何遵循该二进制标准的编程语言都可以用于编写可由 CLR 运行的代码。在功能和性质上，CLR 类似于 Java\
  \ 虚拟机（JVM）。CLR 提供基础设施服务以支持托管代码的执行。这些服务包括自动内存管理、类型安全、线程和进程管理、安全性和版本控制。CLR 位于托管代码和操作系统之间，使你的代码与直接与操作系统交互隔离开来。这种安排使你的代码在一定程度上可移植，并使你免于执行系统级任务，从而可以专注于编写应用程序代码。本章稍后将详细讨论\
  \ CLR。\n\n### 1.2.2. 托管代码\n\n托管代码在与 CLR 的合作契约下运行。这意味着托管代码必须提供运行时提供服务所需的元数据，例如内存管理、跨语言集成、代码访问安全性和对象生命周期的自动控制。（有关元数据的更多信息，请参见\
  \ 第 1.3.1 节。）\n\n### 1.2.3. MSIL\n\n微软中间语言（MSIL）相当于 Java 字节码。MSIL 执行托管代码。支持生成 MSIL\
  \ 的语言可以利用 CLR 的基础设施服务。\n\n### 1.2.4. 程序集\n\n程序集是 .NET Framework 的可版本控制的部署单元。它相当于\
  \ Java 的 `.jar`、`.war` 和 `.ear` 文件格式，但功能要丰富得多。程序集执行以下功能：\n\n*   它包含运行时执行的代码。可移植可执行（PE）文件中的\
  \ MSIL 代码如果没有关联的程序集清单将不会被执行。请注意，每个程序集只能有一个入口点。\n\n*   它形成一个安全边界。程序集是请求和授予权限的单位。程序集之于\
  \ .NET 安全，就像保护域之于 Java 安全。\n\n*   它形成一个类型边界。每个类型的标识包括其所在程序集的名称。在一个程序集范围内加载的类型 `MyType`\
  \ 与在另一个程序集范围内加载的类型 `MyType` 不同。\n\n*   它形成一个引用范围边界。程序集的清单包含用于解析类型和满足资源请求的程序集元数据。清单指定了在程序集外部公开的类型和资源。清单还枚举了它所依赖的其他程序集。\n\
  \n*   它形成一个版本边界。程序集是 CLR 中最小的可版本控制单元；同一程序集中的所有类型和资源都作为一个单元进行版本控制。程序集的清单描述了你为任何依赖程序集指定的版本依赖关系。\n\
  \n*   它形成一个部署单元。当应用程序启动时，只有应用程序最初调用的程序集必须存在。其他程序集，例如本地化资源或包含实用程序类的程序集，可以按需检索。通过这种方式，应用程序在首次下载时可以保持简单和轻量。\n\
  \n程序集可以是静态的或动态的。静态程序集可以包括 .NET Framework 类型（接口和类）以及程序集的资源（位图、JPEG 文件、资源文件等）。静态程序集以\
  \ PE 文件的形式存储在磁盘上。\n\n你也可以使用 .NET Framework 创建动态程序集，这些程序集直接从内存运行，在执行前不会保存到磁盘。你可以在动态程序集执行后将其保存到磁盘。\n\
  \n\n\n\n\n创建程序集有多种方式。你可以使用过去常用的开发工具（如 Visual Studio .NET）来创建`.dll`或`.exe`文件。也可以使用\
  \ .NET Framework 软件开发工具包（SDK）提供的工具，通过引用其他开发环境中创建的模块来生成程序集。此外，还可以使用 CLR 应用程序编程接口（API）来创建动态程序集。\n\
  \n### 1.2.5. 应用程序域\n\n应用程序域为 CLR 提供了一种安全且多功能的处理单元，可用于实现应用程序之间的隔离。你可以在单个进程中运行多个应用程序域，其隔离级别与独立进程相同，但无需承担跨进程调用或进程切换的额外开销。在单个进程中运行多个应用程序的能力显著提升了服务器的可扩展性。应用程序域提供的隔离具有以下优势：\n\
  \n*   一个应用程序中的故障不会影响其他应用程序。由于类型安全的代码不会导致内存错误，使用应用程序域可确保在一个域中运行的代码不会影响进程中的其他应用程序。\n\
  \n*   你可以停止单个应用程序而无需停止整个进程。使用应用程序域可以卸载在单个应用程序中运行的代码。\n\n*   在一个应用程序中运行的代码不能直接访问另一个应用程序中的代码或资源。CLR\
  \ 通过阻止不同应用程序域中的对象直接调用来强制实施这种隔离。跨域调用使用与两个进程之间或两台机器之间调用相同的远程调用基础设施。\n\n*   代码的行为由其运行的应用程序限定。换句话说，应用程序域提供配置设置，例如应用程序版本策略、其访问的任何远程程序集的位置，以及有关如何定位加载到该域中的程序集的信息。\n\
  \n*   你可以根据代码运行的应用程序域来控制授予代码的权限。\n\n应用程序域有助于隔离在单个进程上运行的多个应用程序。与现代 Java 2 企业版（J2EE）应用程序服务器类似（它们使用动态类加载器将应用程序彼此隔离），应用程序域将应用程序隔离在自己的小世界中。\n\
  \n### 1.2.6. 运行时宿主\n\n运行时宿主将运行时加载到进程中，在该进程中创建应用程序域，并将用户代码加载到应用程序域中。各种运行时宿主如下：\n\n\
  *   ASP.NET 将运行时加载到处理 Web 请求的进程中。ASP.NET 还为将在 Web 服务器上运行的每个 Web 应用程序创建一个应用程序域。\n\
  \n*   Shell 可执行文件在每次从 Shell 启动可执行文件时，都会调用运行时宿主代码以将控制权转移给运行时。\n\n*   Microsoft Internet\
  \ Explorer 创建应用程序域以运行托管控件。.NET Framework 支持基于浏览器的控件的下载和执行。运行时通过多用途 Internet 邮件扩展（MIME）过滤器与\
  \ Microsoft Internet Explorer 的扩展机制交互，以创建用于运行托管控件的应用程序域。默认情况下，每个网站会创建一个应用程序域。\n\n\
  ### 1.2.7. 公共类型系统\n\n如前所述，CLR 可以为任何编程语言生成的 MSIL 提供基础设施服务（只要该语言能生成有效的 MSIL）。当处理多种语言的标准时，数据类型的统一性就成为一个问题。公共类型系统（CTS）旨在简化\
  \ .NET 世界中支持的类型。CTS 定义了类型在运行时中的声明、使用和管理方式，它也是运行时支持跨语言集成的重要组成部分。CTS 执行以下功能：\n\n*\
  \   建立一个框架，支持跨语言集成、类型安全和高性能代码执行。\n\n*   提供一个面向对象的模型，支持多种编程语言的完整实现。\n\n*   定义语言必须遵循的规则，这有助于确保用不同语言编写的对象可以相互交互。\n\
  \n图 1.1 展示了各种 .NET 类型。\n\n#### 图 1.1. .NET 类型系统\n\n![](img/0672324024_ch01lev1sec2_image01.gif)\n\
  \n一个类型可以有多个成员：\n\n*   事件：定义可以响应的事件，并定义用于订阅、取消订阅和触发事件的方法。事件通常用于通知其他类型状态的变化。\n\n*\
  \   字段：描述并包含类型的值。字段可以是运行时支持的任何类型。\n\n*   嵌套类型：在封闭类型的作用域内定义的类型。\n\n*   方法：描述类型上可用的操作。方法的签名指定了其所有参数和返回值的允许类型。构造函数是一种特殊的方法，用于初始化类型的新实例。\n\
  \n*   属性：命名类型的逻辑值或状态，并定义用于获取或设置属性值的方法。属性通常用于使类型的公共接口独立于其实际表示。\n\n类型成员具有签名，并从其基类继承。诸如方法之类的成员可以被重载和重写。\n\
  \n### 1.2.8. 公共语言规范\n\n公共语言规范（CLS）定义了一组用于不同语言组件之间互操作的规则。遵循这组规则的其他语言编写的组件被称为 CLS\
  \ 兼容的，并且可以从其他 CLS 兼容的语言访问。CLS 规则定义了 CTS 的一个子集；所有适用于公共类型系统的规则也适用于 CLS，除非 CLS 中定义了更严格的规则。.NET\
  \ Framework 中类型定义的大多数成员都是 CLS 兼容的。（这些成员将在本章后面讨论。）任何会使快速验证代码类型安全变得不可能的语言构造都已被排除在\
  \ CLS 之外。因此，所有 CLS 兼容的语言都可以生成可验证的代码。\n\nCLS 兼容性通常指遵循 CLS 规则和限制的声明。然而，根据你描述的是 CLS\
  \ 兼容代码还是 CLS 兼容开发工具（如编译器），这个概念具有更具体的含义。\n\n如果你希望你的代码是 CLS 兼容的，你必须在以下位置以 CLS 兼容的方式公开功能：\n\
  \n*   你的公共类的定义\n\n*   公共类的公共成员的定义，以及可从派生类访问的成员的定义\n\n*   公共类的公共方法以及可从派生类访问的方法的参数和返回类型\n\
  \n你在私有类的定义中、公共类的私有方法的定义中以及局部变量中使用的功能不必遵循 CLS 规则。你也可以在实现类的代码中使用任何你想要的语言特性，同时仍然拥有一个\
  \ CLS 兼容的组件。代码兼容性将在后面讨论各种代码组件（如程序集、方法和类型）时详细讨论。现在请注意，本书所讨论的 C# 语言拥有使你的代码 CLS 兼容所需的所有工具。\n\
  \n### 1.3. CLR 与 JVM\n\n\n\n\n\n.NET 和 Java 都使用托管执行环境来运行二进制代码。这两个托管执行环境——.NET CLR\
  \ 和 Java 的 JVM——在运行代码时所扮演的角色非常相似。表 1.1 展示了 JVM 和 CLR 之间的一些相似之处。\n\n在 Java 中，代码被编译成字节码，然后由\
  \ JVM 运行。为了获得更好的性能，HotSpot JVM 会将字节码中经常执行的部分编译成本地机器代码。在 .NET 中，源代码首先被编译成 MSIL 和元数据，然后链接形成程序集。程序集可以是可执行文件（EXE）、动态链接库文件（DLL）或模块。在执行时，MSIL\
  \ 和其他相关信息被发送到类加载器。组合后的代码首先被发送到验证器，以检查类型安全性，然后即时编译器（JIT 编译器）将 MSIL 编译成原生托管代码。.NET\
  \ 与 Java 的不同之处在于，.NET 代码总是被编译成原生代码。\n\n表 1.1. CLR 与 JVM 对比\n\n| CLR | JVM |\n| ---\
  \ | --- |\n| .NET Framework 的代码管理和执行环境 | J2EE 平台的代码管理和执行环境 |\n| 将应用程序代码编译为 IL（中间语言）\
  \ | 将 Java 代码编译为字节码 |\n| 执行即时编译；在执行时将 IL 编译为原生代码 | 一些基于 JIT 的 JVM 在执行时将字节码编译为原生代码\
  \ |\n| 单一部署单元（程序集） | 单一部署单元（`.jar` 文件） |\n| 通过异步垃圾回收、自动序列化、异常处理、代码验证和安全管理、调试和分析实现自动内存管理\
  \ | 通过异步垃圾回收、序列化、异常处理、可编程和可脚本化的安全模型、调试和分析实现自动内存管理 |\n\n### 1.3.1. .NET MSIL\n\n\
  MSIL 是一组与 CPU 无关的指令集。该指令集包括用于加载、存储、初始化和调用对象方法的指令，以及用于算术和逻辑运算、控制流、直接内存访问、异常处理和其他操作的指令。当编译器生成\
  \ MSIL 时，它也会生成元数据。元数据描述代码中的类型，包括每个类型的定义、每个类型成员的签名、代码引用的成员以及运行时在执行时使用的其他数据。MSIL 和元数据包含在一个基于并扩展了\
  \ Microsoft 公开的 PE 和通用对象文件格式（COFF）的 PE 文件中，该格式历史上用于可执行内容。这种文件格式可以容纳 MSIL 或原生代码以及元数据，使操作系统能够识别\
  \ CLR 映像。文件中的元数据与 MSIL 一起，使你的代码能够自我描述。\n\n### 1.3.2. .NET JIT\n\nJIT 编译器将 MSIL 转换为特定于\
  \ CPU 的代码，然后才能执行。它不会花费时间和内存将 PE 文件中的所有 MSIL 转换为原生代码，而是在执行过程中根据需要转换 MSIL，并将生成的原生代码存储起来，以便后续调用可以访问。加载器在加载类型时为该类型的每个方法创建并附加一个存根。在首次调用该方法时，存根将控制权传递给\
  \ JIT 编译器，JIT 编译器将该方法的 MSIL 转换为原生代码，并修改存根以将执行定向到原生代码的位置。后续对 JIT 编译方法的调用将直接进入先前生成的原生代码，从而减少\
  \ JIT 编译和执行代码所需的时间。\n\n代码必须通过验证过程。验证检查 MSIL 和元数据，以确定代码是否可以被确定为类型安全的，这意味着已知它只访问其被授权访问的内存位置。运行时依赖于以下陈述对于可验证类型安全的代码是真实的：\n\
  \n*   对类型的引用与被引用的类型严格兼容。\n\n*   只在对象上调用适当定义的操作。\n\n*   身份与其声称的一致。\n\n在验证期间，会检查 MSIL\
  \ 代码，试图确认代码只能通过正确定义的类型访问内存位置和调用方法。例如，代码不能允许以导致内存位置溢出的方式访问对象的字段。此外，验证会检查代码以查看 MSIL\
  \ 是否已正确生成，因为不正确的 MSIL 可能导致违反类型安全规则。验证过程通过一组定义良好的类型安全代码，并且只通过类型安全的代码。然而，由于验证过程的限制，一些类型安全的代码可能无法通过验证，并且一些语言在设计上不会生成可验证的类型安全代码。如果安全策略要求类型安全的代码，并且代码未通过验证，则在执行代码时会抛出异常。\n\
  \n第 2 章 讨论了在编写第一个 C# 程序时 MSIL 和 JIT 的技术细节。但首先让我们讨论一下 Java 世界中 MSIL 和 JIT 的等效物。乍一看的比较是，MSIL\
  \ 在功能和职责方面等同于字节码。此外，Java 中的 JIT 编译器与 CLR 中的 JIT 编译器具有相同的目的，尽管它们的架构非常不同。如果不查看特定的代码片段，对\
  \ Java 字节码和 MSIL 以及 Java 和 CLR JIT 编译器之间的彻底比较将没有太大帮助。因此，该讨论被推迟到 第 2 章，其中包含许多代码示例。\n\
  \n### 1.3.3. Java 虚拟机\n\n使用 `javac` 编译器，Java 源代码被编译成字节码，这也是一种类似程序集的指令集。早期版本的 Java\
  \ 虚拟机仅在运行时解释此字节码，从而实现真正的平台无关执行。较新版本的 Java 运行时现在使用 JIT 编译器编译字节码的部分内容。然后 JVM 运行此原生代码。\n\
  \nSun Microsystems 的 HotSpot 编译器是先进的 JIT 编译器，它分析字节码的执行情况并识别热点：频繁执行且对性能至关重要的代码段。通过仅编译一小部分关键的字节码，HotSpot\
  \ 编译器加快了执行启动时间，减少了内存消耗，并改善了整体用户体验。\n\nJava 语言具有一些内置的优化功能，无需在编译时和运行时对字节码进行完全优化。大多数\
  \ Java 方法调用是虚拟（多态）调用，频繁调用这些方法会损害性能；因此，HotSpot 将方法调用内联，使频繁的方法调用更快。因为 Java 代码可以动态加载和运行类，所以在编译时对字节码进行完全优化几乎没有好处。因此，HotSpot\
  \ 基于运行时分析进行自适应字节码编译。\n\n\n\n\n\n.NET Framework 和 Java 环境的一个关键特性，使其区别于其他传统编程语言（如\
  \ C、C++、Fortran 和 Pascal），在于这些框架使用受控执行环境来运行二进制代码。相比之下，传统语言通常创建与操作系统直接交互的库或可执行文件。.NET\
  \ Framework 提供了 CLR，它为运行二进制代码提供了基本的基础设施服务。CLR 是一个位于你的应用程序代码和操作系统之间的软件层。它负责处理进程、内存、线程、类型安全和安全管理等许多系统级细节，从而使你能够专注于应用程序代码。我们将探讨\
  \ CLR 的一些基础设施服务。\n\n### 1.4. 内存管理\n\n现代执行环境（如 JVM 和 CLR）的一个关键特性是通过垃圾回收实现自动内存管理。CLR\
  \ 提供了一个垃圾回收器（GC），类似于 JVM 的 GC，它在后台运行，通过释放和销毁未使用的对象来释放被锁定的内存。运行时使用元数据来定位和加载类、在内存中布局实例、解析方法调用、生成本机代码、强制执行安全性以及设置运行时上下文边界。运行时自动处理对象布局并管理对对象的引用，在对象不再被使用时释放它们。以这种方式管理生命周期的对象称为托管数据。自动内存管理消除了内存泄漏。让我们简要探讨一下\
  \ CLR 和 JVM 中的垃圾回收机制。\n\n#### 1.4.1. CLR 中的垃圾回收\n\nCLR 在托管堆上分配新对象，托管堆是一块连续的地址空间。托管堆还有一个指针\
  \ `P`，最初指向堆的基地址。当应用程序调用 new 运算符创建新对象时，CLR 会确定新对象是否适合放入地址空间。CLR 将对象的大小（以字节为单位）加到指针\
  \ `P` 上。如果相加后 `P` 指向地址空间之外，则无法立即分配该对象，必须扫描堆并清除垃圾。然后在托管堆上创建空间，分配新对象并返回地址。识别和移除堆上垃圾的过程就是垃圾回收，有多种算法可用于执行此过程。\n\
  \n##### 什么是垃圾？\n\n每个应用程序都有一组根。根标识存储位置，这些位置引用托管堆上的对象或设置为 `null` 的对象。例如，应用程序中所有全局和静态对象指针都被视为应用程序根的一部分，线程栈上的任何局部变量或参数对象指针也是如此。最后，任何包含指向托管堆中对象指针的\
  \ CPU 寄存器也被视为应用程序根的一部分。活动根列表由 JIT 编译器和 CLR 维护，垃圾回收器的算法可以访问此列表。因此，垃圾被定义为堆上无法从此活动根列表中访问到的对象。\n\
  \n##### 垃圾回收如何工作？\n\n当垃圾回收器开始运行时，它假设堆中的所有对象都是垃圾。换句话说，它假设应用程序的根都不引用堆中的任何对象。GC 开始遍历根，并构建从根可达的所有对象的图。例如，GC\
  \ 可能会找到一个指向堆中对象的全局变量。GC 继续递归遍历所有可达对象。当这部分图完成后，GC 检查下一个根并再次遍历对象。\n\n当垃圾回收器从一个对象遍历到另一个对象时，如果它尝试将一个对象添加到图中并发现该对象已被添加，GC\
  \ 就会停止遍历该路径。这个序列有两个目的。首先，它显著提高了性能，因为 GC 只遍历任何对象集合一次。其次，它防止了在存在循环链接的对象列表时出现无限循环。\n\
  \n当所有根都被检查后，GC 的图包含了从应用程序根以某种方式可达的所有对象集合；不在图中的任何对象都无法被应用程序访问，因此被视为垃圾。GC 现在线性遍历堆，寻找连续的垃圾对象块并移除堆中的所有间隙。当然，在内存中移动对象会使所有指向这些对象的指针失效。这意味着\
  \ GC 必须修改应用程序的根，使指针指向对象的新位置。此外，如果任何对象包含指向另一个对象的指针，GC 也负责更正这些指针。\n\n##### 垃圾回收性能\n\
  \n垃圾回收的性能取决于托管堆的大小以及其中有多少是垃圾，还取决于托管堆中是否有任何对象定义了 `finalize` 方法。就像在 Java 中一样，对象可以定义一个\
  \ `finalize` 方法，该方法可用作释放资源的最后手段。如果定义了此方法，它会在对象的内存被回收之前被调用。\n\n在所有可回收对象上调用 `finalize`\
  \ 方法会减慢垃圾回收的速度。因此，正如后面章节将解释的，`finalize` 方法不应用于常规资源管理。\n\n另一个性能瓶颈是堆上的大对象。想象一下你的 C:\
  \ 驱动器的结构以树的形式存储在内存中。如果一个应用程序在其执行过程中持续引用此树，该树将继续留在堆上，并且永远不会被垃圾回收。为了处理这样的大对象，最好让这些对象在被垃圾回收的同时也能被应用程序访问，这是通过弱引用实现的。此机制基于访问和回收的时机。如果一个对象只存在弱引用，并且\
  \ GC 运行，则该对象会被回收；当应用程序稍后尝试访问该对象时，访问将失败。另一方面，要访问一个弱引用的对象，应用程序必须获取对该对象的强引用。如果应用程序在\
  \ GC 回收对象之前获得了这个强引用，那么 GC 就无法回收该对象，因为存在对该对象的强引用。\n\n你还可以通过使 GC 分代化并仅压缩堆的一部分来提高 GC\
  \ 的性能。分代 GC 基于三个假设：较新的对象生命周期较短，较旧的对象生命周期较长，以及较新的对象关系更紧密且通常在大约相同的时间被频繁访问。初始化时，托管堆由第\
  \ 0 代对象组成。当需要进行垃圾回收时，第 0 代中的对象成为第 1 代对象，而由于释放空间而分配的新对象现在成为第 0 代。这种将存活对象推到后续代的循环工作方式使得\
  \ GC 只需扫描最年轻的代即可回收空间。如果 GC 通过检查第 0 代对象无法获得所需空间，它就会转向较旧的代。因此，GC 最终只扫描堆的一部分。\n\n请注意，GC\
  \ 算法并非一成不变。这是 CLR 中保证会更频繁调整的部分之一，以最大化性能。\n\n#### 1.4.2. JVM 中的垃圾回收\n\n\n\n\n\nHotSpot\
  \ JVM 对其托管堆上的年轻对象和老年代对象采用了多种算法。对于年轻代对象，它使用复制收集器；对于老年代对象，则使用压缩收集器。\n\n年轻对象通常生命周期较短且彼此紧密相关，正如前文所述，即使对于基于\
  \ Java 的托管堆对象也是如此。HotSpot GC 对这一代使用复制收集器。复制收集器适用于小型、更频繁的回收，这正是年轻对象的典型特征。对于老年代对象，只有在回收年轻对象无法释放足够内存时才需要回收它们，因此使用压缩收集器，因为它在处理大量数据时效率更高，尽管它比复制收集器慢。\n\
  \nHotSpot GC 还提供了增量收集器，它对于高可用性应用程序以及需要在没有用户可察觉暂停的情况下执行的应用程序非常有用。\n\n与 JDK 1.1 的第一代垃圾收集器相比，HotSpot\
  \ JVM 已经有了显著的发展。同样，CLR 垃圾收集器也肯定会为未来版本进行微调。有趣的是，尽管 JVM 和 CLR 可能使用不同的垃圾收集算法，但在识别和定义什么是垃圾以及堆上的对象分配方面，它们共享非常相似的概念。它们都有托管堆的概念，将堆划分为几代，并基于从根集的可达性来识别垃圾。此外，两种\
  \ GC 都支持弱引用。\n\n### 1.5. 安全管理\n\n.NET Framework 中的安全性可以通过声明式和编程式两种方式定义。声明式安全使程序员能够直接在程序集代码的元数据中指定该程序集的安全要求。权限请求和所有其他形式的声明式安全都以代码中的自定义属性形式指定。类、属性和方法的注解用于微调权限。由于声明式属性成为程序集元数据的一部分，因此更容易识别程序集的安全需求。当请求的操作和权限在编译时已知时，声明式检查是首选解决方案。\n\
  \n编程式安全直接在代码中实现。程序员以编程方式采取安全操作，权限是根据安全栈的状态授予或拒绝的。例如，当一个方法发出访问特定文件的请求时，如果该方法的调用者未被授予必要的权限，该请求将失败。\n\
  \n#### 1.5.1. 基于代码证据的策略驱动安全\n\n.NET Framework 引入了基于证据的安全概念。证据是指关于代码的安全策略输入。程序集是收集证据的代码单元。当程序集被加载时，CLR\
  \ 策略系统确定应授予哪些权限。它通过收集程序集的证据并在安全策略的上下文中评估它来实现这一点。\n\n然后，CLR 策略系统根据评估的证据以及程序集可能提出的任何权限请求，向程序集授予一组权限。在没有任何权限请求的情况下，程序集永远不会被分配超过策略系统会授予它的权限；请求仅用于进一步限制授予。安全策略由许多可自定义的代码组组成，这些代码组包含基于证据授予的权限。代码组可能描述从特定安全区域获取的程序集可用的权限，或由特定发布者签名的程序集可用的权限，等等。\n\
  \n重要的是要记住，你可以将任何内容作为证据提交——前提是安全策略有其用途——通过定义与证据相关的代码组。授予权限的过程涉及评估证据，以确定在三个级别（企业、计算机和用户）上哪些代码组适用。策略按此顺序评估这三个级别，然后创建一个权限集，该权限集是所有三个级别的交集。在运行时，权限基于代码的执行进行评估。\n\
  \n举个例子。假设程序集 `A3` 提供其证据，连同主机的证据以及任何特定的权限请求，交给策略评估器。然后，评估器为程序集 `A3` 创建一组权限授予 `G3`。程序集\
  \ `A3` 被 `A2` 调用，而 `A2` 又被程序集 `A1` 调用。策略评估器已经为程序集 `A1` 和 `A2` 分别创建了权限授予 `G1` 和 `G2`。当程序集\
  \ `A3` 中的代码触发安全检查时，`G1`、`G2` 和 `G3` 都会被检查，以查看每个授予是否包含安全检查中请求的权限。如果任何一个授予不包含该权限，则运行时会抛出安全异常。所有授予都必须包含被检查的权限，该调用才能成功。\n\
  \n诸如读写文件、显示对话框以及读写环境变量等操作是使用包含在框架安全基础设施中的 .NET Framework 方法实现的。通过这种方式，.NET Framework\
  \ 可以根据安全策略允许或禁止操作，而无需程序员进行任何额外的工作。虽然公开受保护资源的托管类的作者必须在其库中提出适当的安全请求，但使用 .NET Framework\
  \ 类库访问受保护资源的开发人员可以“免费”获得代码访问安全系统的好处；他们不需要进行任何显式的安全调用。\n\n#### 1.5.2. 基于角色的安全、身份验证和授权\n\
  \n代码执行安全也是基于经过身份验证的身份或与代码执行上下文关联的角色来强制执行的。.NET Framework 提供了编程式和声明式方法来定义身份和主体，这些是基于角色的安全系统的核心。身份可以映射到登录到操作系统的用户，也可以由应用程序定义。相应的主体封装了身份以及任何相关的角色信息。\n\
  \n身份验证是接受用户凭据并根据某个权威机构验证它们的过程。如果凭据有效，则称用户具有经过身份验证的身份。授权是确定该经过身份验证的身份是否有权访问给定资源的过程。身份验证可以通过系统或业务逻辑完成，并通过单个\
  \ API 提供。身份验证 API 是完全可扩展的，因此开发人员可以根据需要使用自己的业务逻辑。\n\n#### 1.5.3. 隔离存储\n\n.NET Framework\
  \ 提供了一种特殊的设施——隔离存储，用于在不允许文件访问时存储数据。例如，当从 Internet 下载并运行托管控件时，它被授予一组有限的权限，但没有读写文件的权利。隔离存储是\
  \ .NET Framework 支持的一组用于本地存储的新类型和方法。本质上，每个程序集都被授予对磁盘上隔离存储的访问权限。不允许访问其他数据，并且隔离存储仅对为其创建的特定程序集可用。\n\
  \n应用程序可以使用隔离存储来保存活动日志、保存设置或将状态数据保存到磁盘以供以后使用。由于隔离存储的位置是预先确定的，因此它提供了一种方便的方式来指定唯一的存储空间，而无需确定文件路径。\n\
  \n#### 1.5.4. 密码学\n\n\n\n\n\n.NET 框架提供了一组支持加密、数字签名、哈希处理和随机数生成的加密对象，所有这些都通过众所周知的算法实现，例如\
  \ RSA、DSA、Rijndael/AES、Triple DES、DES 和 RC2，以及 MD5、SHA1、SHA-256、SHA-384 和 SHA-512\
  \ 哈希算法。该框架还支持由互联网工程任务组（IETF）和万维网联盟（W3C）制定的 XML 数字签名规范。.NET 框架使用加密对象来支持内部服务。这些对象也作为托管代码提供给需要加密支持的开发人员。\n\
  \n### 1.5.5. Java 中的安全性\n\nJava 在多个层面支持安全性。Java 语言保证类型安全和明确定义的执行流程。JVM 随后通过字节码验证器仅执行合法的字节码。对系统资源的访问由\
  \ JVM 调解，并由 SecurityManager 预先检查，该管理器将不受信任代码的操作限制在最低限度。JDK 1.3 采用易于配置的安全策略、可扩展的访问控制结构，以及无需用户端任何额外编程即可创建和处理新类型权限的能力。\n\
  \nJava 安全系统的构建块是保护域：一组可由具有所需权限的访问者访问的对象。保护域概念为分组和隔离保护单元提供了一种便捷机制。例如，你可以禁止保护域之间相互交互，从而任何允许的交互要么必须通过受信任的系统代码发生，要么必须由相关域明确允许。\n\
  \n保护域通常分为两类：系统域和应用域（另请参阅第 1.2.5 节）。重要的是，所有受保护的外部资源——例如文件系统、网络设施以及屏幕和键盘——只能通过系统域访问。一个域在概念上包含一组类，其实例被授予相同的权限集。保护域由当前生效的策略决定。Java\
  \ 应用程序环境维护从代码（类和实例）到其保护域再到其权限的映射。\n\n权限较少的域不能因为被权限更多的域调用而获得额外的权限。这种安全策略类似于 CLR 安全策略，其中权限较低的程序集不能仅仅因为与权限较高的程序集共同执行而获得额外的权限。执行线程可能完全发生在单个保护域内，也可能涉及应用域以及系统域。执行线程的权限集被视为该执行线程所遍历的所有保护域权限的交集。在执行期间，当请求访问关键系统资源（如文件\
  \ I/O 和网络 I/O）时，资源处理代码直接或间接调用一个特殊的 `AccessController` 类方法，该方法评估请求并决定是授予还是拒绝。\n\n\
  Java 提供了丰富的安全 API，允许以编程方式定义、访问和评估一段代码的权限。安全策略具有用于声明性定义安全权限的特定语法。Java 还具有基于角色的安全性以及用于加密、身份验证和授权的\
  \ API。密钥、证书和签名代码的概念在 CLR 和 JVM 中是通用的。但是，JDK 1.3 不提供隔离存储。\n\n### 1.6. 异常管理\n\n针对异常和错误的编程是托管执行环境的一个关键概念。只要应用程序成功执行，就可以实现可预测的执行流程。但是，这种明确定义的路径可能会在发生错误或异常时被打扰。良好的异常管理服务允许开发人员捕获这些异常和错误，从而简化其处理，即使应用程序在走向失败的道路上，也能保持其可预测性。这样的管理服务允许从故障中恢复并发现应用程序中可复制的错误路径。了解应用程序如何失败与了解应用程序如何成功执行同样重要。它使应用程序故障排除变得非常容易。\n\
  \n异常代表了代码中隐含假设的违反。例如，如果你的代码尝试访问一个假定存在的文件，但该文件缺失，则会引发异常。但是，如果你的代码不假定文件存在，因此首先检查其是否存在，则此场景不一定会生成异常。\n\
  \n#### 1.6.1. CLR 中的异常管理\n\n.NET CLR 通过处理异常、记录异常以及生成用于通知的事件来提供异常管理，这些事件可以被外部监控以协助系统操作。异常可以由程序员通过编码显式处理（类似于\
  \ Java 中的受检异常），也可以由运行时处理（类似于 Java 中的非受检异常和错误）。\n\n图 1.2 显示了检测和传播异常过程的流程图。如果当前方法检测到异常，那么它可以选择在自身内部处理异常并从中恢复，或者它可以向异常添加任何上下文信息，并让其传播到方法的调用者。处理异常的责任随后落在方法的调用者身上。因此，异常可以“冒泡”到最顶层的方法调用，在该点应用程序可以在将异常返回给用户之前处理它（类似于\
  \ Java 中的堆栈跟踪）。应用程序无法从此异常中恢复。它必须收集信息、记录信息、执行任何清理、发送通知，并在向用户显示异常之前执行任何其他异常处理。\n\n\
  ##### 图 1.2. 异常检测和传播流程图\n\n![](img/0672324024_ch01lev1sec6_image01.gif)\n\n你可以使用\
  \ `try-catch-finally` 结构来编码异常检测。`try` 块包含可能引发异常的代码。当在此块内引发异常时，第一个过滤器与异常类匹配的 `catch`\
  \ 块会捕获它。请注意，过滤器在 `catch` 关键字后的括号中指定。如果你有多个 `catch` 块，应确保它们从最具体的类型到最通用的类型排序。这种安排确保对于任何给定的异常，都会执行最具体的\
  \ `catch` 块。`finally` 语句会执行，允许执行清理和其他代码，无论是否引发异常。\n\n你只应在需要专门执行以下任何操作时才捕获异常：\n\n\
  *   收集用于记录的信息\n\n*   向异常添加任何相关信息\n\n*   执行清理代码\n\n*   尝试恢复\n\n如果特定方法不需要执行这些操作中的任何一个，则不应捕获异常；相反，应允许其沿调用栈向上传播。这使你的代码保持清晰和明确，因为你只捕获需要在特定方法范围内处理的异常，并允许所有其他异常继续传播。在某些场景中，你引发的异常可能被运行时捕获，并且另一种类型的异常可能沿调用栈向上传播以替代原始异常。在这些场景中，你的原始异常不会丢失。相反，它被设置为原始异常的\
  \ `InnerException` 属性。\n\n\n\n\n异常传播有三种方式：\n\n1.  让异常自动传播。采用此方法时，你无需做任何事，而是故意忽略异常。这会导致控制权立即从当前代码块沿调用栈向上移动，直到找到一个过滤器与异常类型匹配的`catch`块。\n\
  \n2.  捕获并重新抛出异常。采用此方法时，你会捕获并响应异常，并在当前方法的作用域内进行清理或执行任何其他必需的处理。如果你无法从异常中恢复，则会将相同的异常重新抛出给调用者。\n\
  \n3.  捕获、包装并抛出包装后的异常。当异常沿调用栈向上传播时，其类型变得不那么重要。当异常被包装后，可以向调用者返回一个更相关的异常。\n\n.NET Framework\
  \ 提供了将异常记录到 Windows 日志、数据库或日志文件的 API；提供了将异常作为异步消息发送到消息队列或简单邮件传输协议（SMTP）邮件的 API；还提供了将异常创建为事件并发送到与主应用程序解耦的外部监控系统的\
  \ API。然后，监控系统会通知相关方采取适当措施。这种对日志记录、监控和通知的支持已内置于 .NET Framework 中。\n\n#### 1.6.2.\
  \ Java 中的异常管理\n\n上述大部分 CLR 异常管理机制在 Java 环境中也存在。然而，Java 区分了受检异常和非受检异常。受检异常是那些被显式编码处理的异常。非受检（运行时）异常和错误不必被捕获，它们会自动沿方法调用栈向上传播。\n\
  \nJava 有一个 `try-catch-finally` 结构，可用于检测、抛出和传播异常。当前 JDK 1.3 缺少的是任何对将异常记录到操作系统日志、数据库和文件系统的内置支持。此外，也没有对将这些异常作为消息异步或同步传递到消息队列或\
  \ SMTP 邮件的内置支持。这些功能缺失的原因可能是 Java 设计者不希望将异常日志记录和通知作为 JDK 1.3 核心异常管理服务的一部分。对于受检异常，通过第三方日志\
  \ API（如 `log4j`）、`JavaMail` 和 Java 消息服务（JMS）相对容易模拟任何类型的日志记录和通知。未来版本的 Java 可能会为非受检运行时异常和错误提供与外部日志记录和监控系统的挂钩。\n\
  \n### 1.7. .NET Framework 类库概述\n\n本书旨在探索 .NET Framework C# 类库。与 Java API 类似，.NET\
  \ Framework 提供了包含可用于编码各种企业任务的类的命名空间。.NET Framework 类库可以帮助你实现许多任务，包括访问数据库、创建图形、XML\
  \ 处理、网络、反射、消息传递、安全和目录服务。该框架非常庞大，讨论所有命名空间超出了本书的范围。相反，在探索 C# 基础知识时，你将遇到一些常用的命名空间。此外，我们将查看一些用于实现某些企业任务（数据库访问、图形、XML\
  \ 处理）的示例命名空间。\n\n表 1.2. 本书涵盖的 .NET 命名空间\n\n| .NET Framework 命名空间 | 描述 |\n| --- |\
  \ --- |\n| `System` | 包含核心类 |\n| `System.Collections` | 集合类（类似于 Java 集合） |\n| `System.Data`,\
  \ `System.Data.Common`, `System.Data.OleDb`, `System.Data.SqlClient`, `System.Data.SqlTypes`\
  \ | 用于访问数据库的类 |\n| `System.Windows.Forms`, `System.Windows.ComponentModel`, `System.Drawing`\
  \ | 用于图形和 Windows 窗体设计的类 |\n| `System.IO`, `System.IO.IsolatedStorage` | 用于磁盘 I/O\
  \ 的类 |\n| `System.Reflection`, `System.Reflection.Emit` | 用于反射的类 |\n| `System.Text`\
  \ | 字符串处理类 |\n| `System.Threading` | .NET 中的线程支持 |\n| `System.Xml`, `System.Xml.Schema`,\
  \ `System.Xml.XPath`, `System.Xml.Xsl` | 用于 XML 处理的类。 |\n| `System.Diagnostics`\
  \ | 用于执行操作系统级任务的类 |\n\n表 1.2 展示了本书中探讨的命名空间。\n\n### 1.8. 总结\n\n.NET Framework 是微软为其\
  \ .NET 计划所构想的宏伟愿景的一小部分。该框架通过提供一个称为公共语言运行时的托管运行时执行环境来支持代码管理服务。CLR 是语言中立的，因此，任何用某种语言编写并使用符合公共语言规范合规性规则的编译器编译的组件，都可以被用完全不同的语言编写的组件使用或扩展，只要该语言也符合\
  \ CLS。CLR 通过公共类型系统（CTS）和元数据实现了这一神奇效果，元数据是将一切粘合在一起的无形粘合剂。CLR 提供的一些重要代码管理服务包括内存、安全、异常、序列化和线程管理、调试和分析、版本控制以及多语言组件的自动集成。\n\
  \nCLR 在某些方面与 Java 虚拟机相似。JVM 和 CLR 提供某些共同的代码管理服务，并且两者都通过将托管代码转换为中间二进制形式来执行代码，然后使用动态即时编译器（JITer）将其转换为机器代码。\n\
  \n## 第 2 章. 从 C# 开始\n\n学习一门新编程语言的最佳方式是开始使用它，因此本章将深入探讨编程的实践部分。我们介绍了经典的 C# Hello World\
  \ 程序——首先不使用 Visual Studio .NET IDE，然后使用 IDE。我们还探索了 .NET SDK 附带的一些其他工具。\n\n### 2.1.\
  \ .NET SDK\n\n.NET SDK 相当于 Java 的 JDK，可从 JavaSoft 网站（[`www.javasoft.com`](http://www.javasoft.com)）获取。.NET\
  \ SDK 可从网络下载，也可以 CD 格式获取（参见 [`www.microsoft.com`](http://www.microsoft.com)）。.NET\
  \ SDK 附带了一个编译器、运行时引擎以及一系列用于 C# 编程的其他工具。这些工具是你编写 C# 程序所需的一切。.NET SDK 目前仅可在以下 Windows\
  \ 平台上使用：Windows 2003、Windows 2000、Windows XP、Windows 98 和 Windows NT。\n\n传统上，微软的编程语言与提供的\
  \ IDE 紧密集成。这意味着你必须使用该 IDE 来用该语言编写程序。C# 打破了这一传统，在编写代码方面与 Java 非常相似。你可以使用简单的文本编辑器编写\
  \ C# 程序，并且可以顺利运行。\n\n### 2.2. 编写你的第一个 C# 程序\n\n我们在此假设你已成功下载并安装了基础的 .NET SDK 到你的\
  \ C: 驱动器。要编译你的 C# 程序，你需要编译器，即一个名为 `csc.exe` 的文件。默认情况下，编译器将 C# 代码转换为一个可执行文件，该文件可以像任何\
  \ EXE 文件一样运行。可以将此 EXE 文件视为 Java 运行时，所有要运行的类都放在一个文件中。要从任何位置编译代码，你必须设置目录，使 `csc.exe`\
  \ 文件位于你的系统 `PATH` 环境变量中。你可以通过在命令提示符下输入 `csc` 来检查这一点，如清单 2.1 所示。请注意，`fatal error\
  \ CS2008` 实际上是在提醒你编译器没有要编译的文件。\n\n##### 清单 2.1. 在命令提示符下输入 `csc` 的输出\n\n```\n```\n\
  \n\n\n\n```\nMicrosoft (R) Visual C# .NET 编译器版本 7.00.9466\n适用于 Microsoft (R) .NET\
  \ Framework 版本 1.0.3705\n版权所有 (C) Microsoft Corporation 2001。保留所有权利。\n致命错误 CS2008：未指定输入\n\
  ```\n\n您可以通过在命令提示符下输入 `csc /?` 来获取各种编译器选项。默认命令 `csc` 应足以让您开始编写和编译程序。\n\n让我们编写第一个\
  \ C# 程序。打开您的文本编辑器。在不输入任何内容的情况下，将程序文件保存为 `MySample.1.cs`。这里的 `.cs` 是文件扩展名。在命令提示符下，输入\
  \ `csc MySample.1.cs`。\n\n清单 2.2 显示了编译器的输出。编译器抱怨程序缺少入口点。它没有像您预期的那样创建 `Listing.EXE`\
  \ 文件。这种行为类似于 JDK，当您尝试编译一个大小为 0 字节的 Java 文件时，它不会创建类文件（尽管它不会发出抱怨）。EXE 文件是一个独立的可执行文件。为了使其执行，运行时线程或进程必须在特定点进入，以便从该点继续执行。\n\
  \n##### 清单 2.2\\. 在命令提示符下输入 `csc MySample.1.cs`（空文件）的输出 (C#)\n\n```\nMicrosoft (R)\
