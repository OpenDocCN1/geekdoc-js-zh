  Type= [Text] Value=Joe\nType= [Element] Name=LastName\nType= [Text] Value=Suits\n\
  Type= [Element] Name=Address\nType= [Element] Name=Street\nType= [Text] Value=1800\
  \ Success Way\nType= [Element] Name=City\nType= [Text] Value=Redmond\nType= [Element]\
  \ Name=State\nType= [Text] Value=WA\nType= [Element] Name=ZipCode\nType= [Text]\
  \ Value=98052\nType= [Element] Name=Job\nType= [Element] Name=Title\nType= [Text]\
  \ Value=CEO\nType= [Element] Name=Description\nType= [Text] Value=Wears the nice\
  \ suit\n```\n\n`XmlDocument` 首先被实例化，并传入一个包含格式良好 XML 的文件 URL。文档从文件加载 XML 并自动生成 DOM\
  \ 树：\n\n```csharp\nXmlDocument doc = new XmlDocument();\ndoc.Load(\"c:\\\\people.xml\"\
  );\n```\n\n接下来，我们获取文档树的第一个节点的句柄：\n\n```csharp\ndoc.GetElementsByTagName(\"People\"\
  )[0]\n```\n\n如果你接触过 DHTML 或 JavaScript，你会认出方法名 `GetElementsByTagName`。\n\n获取第一个节点后，我们使用\
  \ `PrintNodeDetail` 方法递归遍历该节点的所有子节点。`PrintNodeDetail` 足够通用，可以打印任何节点类型的详细信息。请记住，DOM\
  \ 树由不同类型的节点（元素、属性、处理指令、注释、文本节点等）组成。我们首先打印节点的通用信息（名称、类型）；如果是文本节点，我们打印节点的值：\n\n```csharp\n\
  if (node.NodeType == XmlNodeType.Text) {\n    Console.WriteLine(\"Type= [\"+node.NodeType+\"\
  ]\n                               Value=\"+node.Value);\n  } else {\n    Console.WriteLine(\"\
  Type= [\"+node.NodeType+\"] Name=\"+node.\nName);\n  }\n```\n\n接下来，我们打印与节点关联的任何属性：\n\
  \n```csharp\nif (node.Attributes != null) {\n  XmlAttributeCollection attrs = node.Attributes;\n\
  \  foreach (XmlAttribute attr in attrs) {\n    Console.WriteLine(\"\\tAttribute\
  \ Name =\"+attr.Name+\n                    \" Attribute Value =\"+attr.Value);\n\
  \  }\n}\n```\n\n最后一步获取当前节点的所有子节点，并对每个子节点调用 `PrintNodeDetail`。\n\n请注意，`ChildNodes`\
  \ 方法只获取节点的直接子节点。要获取节点的所有子节点，必须使用递归代码：\n\n```csharp\nXmlNodeList children = node.ChildNodes;\n\
  foreach (XmlNode child in children) {\n  PrintNodeDetail (child);\n}\n```\n\n如果你使用过用于在\
  \ Java 中解析 DOM 树的 JDOM 库（[www.jdom.org](http://www.jdom.org)），那么 .NET DOM API 应该很容易理解。\n\
  \n由于其将整个 XML 文档存储在内存中，DOM API 提供了一种便捷的方式来查询匹配特定条件的节点。清单 20.9 展示了查询特定节点的方法。\n\n#####\
  \ 清单 20.9\\. 查询特定节点 (C#)\n\n|  \n\n```csharp\nusing System;\nusing System.Xml;\n\
  \npublic class Test {\n  public static void Main(string[] args) {\n\n    XmlDocument\
  \ doc = new XmlDocument();\n    doc.Load(\"c:\\\\people.xml\");\n\n    //Get all\
  \ job titles in the people.xml\n    XmlNodeList list = doc.GetElementsByTagName(\"\
  Title\");\n    foreach (XmlNode node in list) {\n      Console.WriteLine(node.FirstChild.Value);\n\
  \    }\n\n    //Get the last name of the first person\n    XmlNode nn = doc.GetElementsByTagName(\"\
  Person\")[0];\n    Traverse(nn);\n  }\n\n  private static void Traverse(XmlNode\
  \ node) {\n    foreach (XmlNode child in node.ChildNodes) {\n      if (\"LastName\"\
  .Equals(child.Name) && child.NodeType ==\n                                     \
  \    XmlNodeType.Element) {\n        Console.WriteLine(child.FirstChild.Value);\n\
  \      }\n      Traverse(child);\n    }\n  }\n}\n```\n\n |\n\n清单 20.9 的输出如下：\n\n\
  ```\nCEO\nAttorney\nPro Surfer\nWeb Site Developer\nSuits\n```\n\n`XmlDocument`\
  \ 对象支持两种方法：`GetElementsByTagName` 和 `GetElementByID`。这些方法名在定位 XML 文件中的特定位置时非常高效。例如，要获取\
  \ XML 文档中所有职位的列表，你可以搜索所有标签名为 `\"Title\"` 的元素：\n\n```csharp\nXmlNodeList list = doc.GetElementsByTagName(\"\
  Title\");\nforeach (XmlNode node in list) {\n  Console.WriteLine(fnode.FirstChild.Value);\n\
  }\n```\n\n尽管 DOM 树提供了对 XML 文档的双向导航，但对特定细节的搜索仍然是顺序的，如 清单 20.9 中的 `Traverse(..)` 方法所示。在\
  \ `Traverse` 方法中，我们必须递归地遍历第一个 `Person` 节点的每个子节点，并检查该节点是否为 `LastName` 节点。DOM API\
  \ 不是进行 XML 文档高级数据挖掘的最有效方式。你应该为此目的使用 XPath。\n\nDOM API 也可以用来编写 XML 文档。清单 20.10 展示了使用\
  \ DOM API 编写的 `Person` 对象的 `ToXml()` 方法。\n\n##### 清单 20.10\\. 使用 DOM 编写 XML (C#)\n\
  \n|  \n\n\n\n\n## 20.4.1. XPath\n\n在 XML 文档中搜索有意义的数据，如果没有某种宏语言来简洁地指定搜索内容，可能会变得具有挑战性。如前面的示例所示，尽管\
  \ DOM API 提供了遍历节点的方法，但它不足以进行高级查询，并且需要加载整个文档。\n\nXPath 规范提供了一种标准语法，用于构建查询和提取 XML\
  \ 文档数据的搜索表达式。XPath 表达式在 XML 中的作用类似于 SQL 在关系数据库管理系统数据存储中的作用。本章不讨论 XPath 语言的语法。\n\n\
  .NET Framework 将所有与 XPath 相关的类捆绑在 `System.Xml.XPath` 命名空间中。该命名空间的核心类是 `XPathNavigator`，它具有运行\
  \ XPath 表达式、提取数据和在数据中导航的方法。在接下来的几个示例中，我们将使用 .NET 类对 `people.xml` 文件运行有用的查询。\n\n\n\
  \n\n## 20.4.1. XPath\n\n`清单 20.11` 是第一个 XPath 示例。在此，我们创建并运行一个简单的 XPath 表达式，并从中提取数据。\n\
  \n### 清单 20.11. 使用 XPath (C#)\n\n```csharp\nusing System;\nusing System.Xml;\nusing\
  \ System.Xml.XPath;\n\npublic class Test {\n\n  public static void Main(string[]\
  \ args) {\n\n    XPathDocument doc = new XPathDocument(\"c:\\\\people.xml\");\n\
  \    XPathNavigator navig = doc.CreateNavigator();\n    //获取所有 FirstName\n    RunQuery(navig,\
  \ \"//FirstName/text()\");\n    //获取 SSN = 666131313 的人的职位\n    RunQuery(navig,\
  \ \"//Person[@ssn='666131313']/Job/Title\");\n    //获取州为 WA 的地址对应的城市\n    RunQuery(navig,\
  \ \"//*[text()='WA']/parent::Address/City\");\n    //计算所有 id 的总和。\n    EvaluateQuery(navig,\
  \ \"sum(//@id)\");\n    //获取州为 CA 的地址对应的城市。\n                            //使用编译后的表达式\n\
  \    XPathExpression cachedExpr =\n        navig.Compile(\"//*[text()='CA']/parent::Address/City\"\
  );\n    RunQuery(navig, cachedExpr);\n\n  }\n\n  private static void RunQuery(XPathNavigator\
  \ navig,\n                                           string expression) {\n    XPathNodeIterator\
  \ itr = navig.Select(expression);\n    while (itr.MoveNext()) {\n      XPathNavigator\
  \ currNode = itr.Current;\n      Console.WriteLine(currNode.Value);\n    }\n  }\n\
  \  private static void RunQuery(XPathNavigator navig,\n                        \
  \          XPathExpression expression) {\n    XPathNodeIterator itr = navig.Select(expression);\n\
  \    while (itr.MoveNext()) {\n      XPathNavigator currNode = itr.Current;\n  \
  \    Console.WriteLine(currNode.Value);\n    }\n  }\n  private static void EvaluateQuery(XPathNavigator\
  \ navig,\n                                           string expression) {\n    Console.WriteLine(navig.Evaluate(expression));\n\
  \  }\n}\n```\n\n`清单 20.11` 的输出如下：\n\n```\nJoe\nLinda\nJeremy\nJoan\nAttorney\nRedmond\n\
  Redmond\n10\nPaso Robles\n```\n\n如前所述，`XPathNavigator` 类是 C# 中 XPath 类的核心。要获取导航器的句柄，你需要实例化一个\
  \ `XPathDocument` 对象，然后创建导航器对象：\n\n```csharp\nXPathDocument doc = new XPathDocument(\"\
  c:\\\\people.xml\");\nXPathNavigator navig = doc.CreateNavigator();\n```\n\n导航器对象可用于遍历\
  \ XPath 表达式返回的 `NodeSet`。\n\n如你所见，使用 XPath 表达式语法，你可以使搜索条件非常具体。查询可以返回一个可迭代的节点集，也可以返回由\
  \ XPath 语言计算出的对象值。为了提高性能，你还可以预编译 XPath 表达式并将其缓存以供将来计算：\n\n```csharp\nXPathExpression\
  \ cachedExpr =\nnavig.Compile(\"//*[text()='CA']/parent::Address/City\");\n```\n\
  \n`清单 20.12` 展示了如何遍历所有 `Person` 节点，以查看是否有任何节点匹配某个条件。\n\n### 清单 20.12. 在 XPath 中匹配节点\
  \ (C#)\n\n```csharp\nusing System;\nusing System.Xml;\nusing System.Xml.XPath;\n\
  \npublic class Test {\n\n  public static void Main(string[] args) {\n\n    XPathDocument\
  \ doc = new XPathDocument(\"c:\\\\people.xml\");\n    XPathNavigator nav = doc.CreateNavigator();\n\
  \    XPathNodeIterator ni = nav.SelectDescendants(\"Person\",\n                \
  \                                    \"\", false);\n    XPathExpression expr = nav.Compile(\"\
  Person[@id='2']\");\n    while (ni.MoveNext()) {\n      XPathNavigator nav2 = ni.Current.Clone();\n\
  \      if (nav2.Matches(expr)){\n        nav2.MoveToFirstChild();\n        Console.WriteLine(nav2.Value);\n\
  \      }\n    }\n  }\n}\n```\n\n以下是 `清单 20.12` 的输出：\n\n```\nLindaSue\n```\n\n有时需要将文档从一种形式转换为另一种形式。例如，在一个由不同组件组成、通过\
  \ XML 相互通信的工作流系统中，有必要将一个组件的输出 XML 转换为另一个组件的输入 XML。XSLT 语言是将 XML 文档转换为其他格式（不一定仅限于\
  \ XML）的常用工具。下一节将探讨 .NET 中的 XSLT 支持。\n\n## 20.4.2. XSLT\n\n.NET XML 类也提供了对 XSLT 转换的支持。`XslTransform`\
  \ 类在新框架中管理 XSLT 转换。`XslTransform` 位于 `System.Xml.Xsl` 命名空间中，并在转换过程中使用 `XmlNavigator`。\n\
  \n与所有 XSLT 处理器一样，`XslTransform` 接受一个 XML 文档、一个 XSLT 文档和一些可选参数作为输入。它可以生成任何类型的基于文本的输出（XML、HTML\
  \ 等）。\n\n要使用 `XslTransform` 执行转换，你首先创建一个 `XslTransform` 对象，然后调用 `Load` 来加载所需的 XSLT\
  \ 文档。接着，你创建一个 `XmlNavigator` 对象，并用要转换的源 XML 文档初始化它。最后，你调用 `Transform` 来开始该过程。\n\n\
  `清单 20.13` 和 `20.14` 展示了一个 XSLT 转换的示例。示例 XSL 文件存储在 `people.xsl` 中，如 `清单 20.13` 所示。\n\
  \n### 清单 20.13. `People.xsl` 文件\n\n```xml\n<?xml version=\"1.0\"?>\n<?xml version=\"\
  1.0\"?>\n<xsl:stylesheet xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\" version=\"\
  1.0\">\n<xsl:output method=\"html\"/>\n\n<xsl:template match=\"/\">\n<html>\n  \
  \    <xsl:apply-templates/>\n</html>\n</xsl:template>\n<xsl:template match=\"People\"\
  >\n  <table>\n    <xsl:apply-templates select=\"Person\" />\n  </table>\n</xsl:template>\n\
  <xsl:template match=\"Person\">\n  <tr>\n<xsl:apply-templates select=\"Name\" />\n\
  \  </tr>\n</xsl:template>\n\n<xsl:template match=\"Name\">\n<td>\n<xsl:value-of\
  \ select=\"LastName\" />,<xsl:value-of\nselect=\"FirstName\" />\n</td>\n</xsl:template>\n\
  \n</xsl:stylesheet>\n```\n\n`清单 20.14` 以 `people.xml` 文件作为输入，并通过 `people.xsl` 文件运行它，将其转换为\
  \ HTML 输出。\n\n### 清单 20.14. 使用 XSLT 转换 (C#)\n\n```csharp\nusing System;\nusing System.Xml;\n\
  using System.Xml.XPath;\nusing System.Xml.Xsl;\n\npublic class Test {\n\n  public\
  \ static void Main(string[] args) {\n\n    //创建一个新的 XslTransform 对象。\n    XslTransform\
  \ trans = new XslTransform();\n    //加载样式表。\n    trans.Load(\"c:\\\\people.xslt\"\
  );\n\n    XPathDocument doc = new XPathDocument(\"c:\\\\people.xml\");\n    XmlWriter\
  \ tw = new XmlTextWriter(Console.Out);\n    trans.Transform(doc,null,tw);\n  }\n\
  \n}\n```\n\n`清单 20.14` 的输出如下：\n\n```\n<html><table><tr><td>Suits,Joe</td></tr><tr><td>Sue,Linda</td>\n\
  </tr><tr><td>Boards,Jeremy</td></tr><tr><td>Page,Joan</td></tr>\n</table></html>\n\
  ```\n\nXML 文档的 XSLT 转换是一种强大的机制，常用于将内容与视图分离。只需更改 XSL 文件，你就可以用几种不同的格式呈现给定的 XML 文档。\n\
  \n## 20.5. 总结\n\n以下总结了 .NET Framework XML 类：\n\n*   .NET Framework 内置了对 XML 处理的支持，这是\
  \ Java 直到 1.4 版本之前所缺乏的。\n\n*   .NET 类同时支持 DOM 和 SAX API。\n\n*   与处理 XML 文档每个标签的\
  \ Java SAX 解析器不同，.NET SAX 解析器使用灵活的拉取模型来提取数据，并且只解析你感兴趣的那些标签。你可以在解析时跳过文档的某些部分。\n\n\
  *   Java SAX 解析器使用事件编程范式；因此，解析过程的状态由一组类维护。.NET SAX 解析器允许使用简单的 `while` 循环结构来对 XML\
  \ 文档进行条件解析。\n\n\n\n\n\n## 第 21 章 C#中的 GUI 编程\n\n.NET Framework 包含用于创建充分利用 Microsoft\
  \ Windows 操作系统丰富用户界面功能的 Windows 应用程序的类。使用 Visual Studio .NET IDE，你可以通过流行的拖放机制创建\
  \ GUI 应用程序。我们将从简要概述两种语言为开发 GUI 应用程序提供的功能开始，讨论这个复杂的话题。\n\n### 21.1. 选择 GUI 库：Java\
  \ 还是 .NET？\n\n作为 GUI 应用程序的程序员，在评估 GUI 库时，你应该问自己这些关键问题：\n\n*   该库是否允许开发模块化 GUI？\n\
  *   它是否提供了一个将 GUI 应用程序行为与 GUI 应用程序设计和配置分离的工具包？\n*   它是否利用平台特定的 GUI 控件？它应该这样做吗？\n\
  *   在自定义默认行为方面，它有多灵活？\n\n模块化 GUI 让你可以通过将相关的 GUI 组件插入基本 GUI 框架来简单地扩展应用程序。模块化 GUI\
  \ 的一个很好的例子是 NetBeans Java IDE，这是一个用于构建 Java 应用程序的开源 IDE。NetBeans 是用 Java Swing 编写的。该\
  \ IDE 的用户可以编写自定义组件，将其插入主 IDE 框架以自定义其行为。并非所有 GUI 应用程序都必须是模块化的。\n\n要开发 GUI 应用程序，你需要创建屏幕和显示控件，然后编写它们之间的交互代码。GUI\
  \ 工具包应该让你能够将 GUI 组件的组装与编码它们的交互分开。Visual Studio .NET IDE 附带了一个类似 Visual Basic 的窗体设计器，允许你使用\
  \ WYSIWIG 编辑器设计屏幕。然后你可以使用 C# 来编码控件之间的交互。你也可以编写代码来修改可视组件的属性。像 Visual Studio .NET\
  \ 这样的工具包可以通过免除程序员编写繁琐的设计时控件设置的需要来快速启动应用程序开发。\n\n有时，你的应用程序运行的平台提供了一系列常用组件供你的应用程序使用。在\
  \ Windows 世界中，用户习惯于屏幕和对话框中的某种外观、感觉和行为。如果你的 GUI 工具包让你能够以最少的配置利用这些预构建的组件，那将非常有用。\n\
  \nGUI 工具包还应该允许你修改默认行为和属性。Java 的 Swing 和抽象窗口工具包（AWT）库在这方面表现出色，因为它们允许你以跨平台的方式自定义应用程序的外观、感觉和行为。\n\
  \nJava Swing 和 AWT 以及 .NET GUI 工具包都提供了我们提到的所有功能。然而，.NET 的支持更强。例如，.NET GUI 工具包允许拖放组装\
  \ GUI 屏幕，这是 Java Swing 程序员自支持 Swing 的 JDK 发布以来一直渴望的。目前，Swing 中的拖放窗体设计是通过第三方 IDE\
  \ 提供的，并未随 JDK 一起提供。此外，许多 Java Swing 程序员抱怨 Swing 的平台中立方法，这使他们无法利用一些 Windows 特定的功能。例如，鼠标滚轮支持只是最近才在\
  \ Swing 中添加。\n\n### 21.2. 使用 IDE 开发小型应用程序\n\nVisual Studio .NET IDE 提供了一个内置工具箱，用于快速开发\
  \ GUI 应用程序。以下部分探讨了使用 IDE 设置 Windows 应用程序和组装一些 GUI 组件所需的步骤。\n\n#### 21.2.1. 步骤 1：创建新项目\n\
