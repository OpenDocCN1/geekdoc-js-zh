  \ |\n\n\n\n\n\n### 12.2. 初始化字符串\n\n如前所述，初始化字符串的最佳方式是将字符串引用赋值给字符串字面量。由于运行时执行的透明优化，了解两个字符串何时相等至关重要。字符串的相等性语义存在于不同层面。可以通过比较字符串实例、对象实例及其值来比较字符串。C#\
  \ 和 Java 中的默认比较操作比较的是字符串的值，而不是对象引用。考虑到字符串的常用性以及驻留机制，将字符串作为字符串实例或对象实例进行比较意义不大，这是一个合理的特性。清单\
  \ 12.4 展示了其中一些语义差异。\n\n#### 清单 12.4. 初始化和比较 C# 字符串\n\n```csharp\nusing System;\n\
  \npublic class StringTest {\n\n  public static void Main(string[] args) {\n    char[]\
  \ c = new char[] {'H','e','l','l','o'};\n    string[] strings = new string[4];\n\
  \    strings[0] = \"Hello\";\n    strings[1] = \"World\";\n    strings[2] = \"Hello\"\
  ;\n    strings[3] = new string(c);\n\n    Console.WriteLine(\"-----[ Comparing strings\
  \ using ==\n                     operator of System.String ]-----\");\n    for (int\
  \ i =0; i < strings.Length; ++i) {\n      for (int j = i+1; j < strings.Length;\
  \ ++j) {\n        Console.WriteLine(\"{0} = {1} {2}\",i,j,strings[i] ==\n      \
  \                                            strings[j]);\n      }\n    }\n    Console.WriteLine(\"\
  -----[ Comparing strings using ==\n                     operator of System.Object\
  \ ]-----\");\n    for (int i =0; i < strings.Length; ++i) {\n      for (int j =\
  \ i+1; j < strings.Length; ++j) {\n          Console.WriteLine(\"{0} = {1}\n   \
  \          {2}\",i,j,(object)strings[i] ==\n               (object)strings[j]);\n\
  \      }\n    }\n    Console.WriteLine(\"-----[ Comparing String using the Equals\n\
  \                     method ]-----\");\n    for (int i =0; i < strings.Length;\
  \ ++i) {\n      for (int j = i+1; j < strings.Length; ++j) {\n        Console.WriteLine(\"\
  {0} = {1}\n            {2}\",i,j,strings[i].Equals(strings[j]));\n      }\n    }\n\
  \  }\n}\n```\n\n清单 12.4 的输出如下：\n\n```\nUsing == operator of System.String]\n0=1\
  \ False\n0=2 True\n0=3 True\n1=2 False\n1=3 False\n2=3 True\nUsing == operator of\
  \ System.Object ]\n0=1 False\n0=2 True\n0=3 False\n1=2 False\n1=3 False\n2=3 False\n\
  Using the String.Equals method\n0=1 False\n0=2 True\n0=3 True\n1=2 False\n1=3 False\n\
  2=3 True\n```\n\n在 C# 中，`System.Object` 方法的 `==` 运算符比较对象的引用，如果两个引用指向同一个对象则返回 `true`，否则返回\
  \ `false`。`System.String` 类重载了 `==` 运算符，用于比较字符串的值，而不是它们引用的实际对象。因此，在清单 12.4 中，`strings[3]\
  \ == strings[0]` 返回 `true`，因为它们具有相同的字符串值。然而，当 `strings[0]` 和 `strings[3]` 都被强制转换为\
  \ `object` 并使用 `==` 运算符进行比较时，它们返回 `false`。这是因为 `strings[3]` 指向一个不同的字符串对象。\n\nC#\
  \ 还有 `Equals` 方法，其行为与 `==` 运算符类似。注意在清单 12.4 的输出中，使用 `Equals` 方法和重载的 `==` 运算符比较字符串得到的结果是相同的。\n\
  \nJava 程序员在处理 `==` 运算符和 C# 字符串时必须特别小心。\n\n请注意，在 Java 中，`equals` 方法的功能与 C# 的 `==`\
  \ 运算符相同。`equals` 方法定义在 `java.lang.Object` 上，默认比较对象引用。然而，`java.lang.String` 类重写了\
  \ `equals` 方法，比较的是 `String` 的值。Java 和 C# 都支持 `String` 驻留，因此 JVM 和 CLR 都只为具有相同值的\
  \ `String` 创建一个对象。这是一个优化特性，使得指向相同字面值的不同 `String` 引用在内部存储为指向同一个 `String` 对象。驻留过程在\
  \ C# 和 Java 中都是透明的。\n\n### 12.3. `+` 运算符与字符串\n\n在 C# 中，你可以使用 `StringBuilder` 类来操作字符串，它等同于\
  \ Java 的 `java.lang.StringBuffer` 类。`StringBuilder` 是一个 `sealed` 类，因此不能被子类化。同样，`StringBuffer`\
  \ 类是 `final` 的，也不能被子类化。但是，`StringBuilder` 类的实例不保证是线程安全的。在 Java 中，`StringBuffer`\
  \ 的方法在必要时是同步的。清单 12.5 展示了 `StringBuilder` 的实际使用。\n\n#### 清单 12.5. 一个简单的 `StringBuilder`\
  \ 用法 (C#)\n\n```csharp\nusing System;\nusing System.Text;\npublic class StringTest\
  \ {\n  public static void Main(string[] args) {\n    StringBuilder t = new\nStringBuilder().Append(\"\
  It's\").Append(\"My\").Append(\"Life\");\n    Console.WriteLine(t);\n  }\n}\n```\n\
  \n清单 12.5 的输出是\n\n```\nIt'sMyLife\n```\n\n`Console.WriteLine()` 方法接受 `StringBuilder`\
  \ 对象作为参数，运行时在 `StringBuilder` 实例上调用 `ToString()` 方法。`StringBuilder` 的 `ToString()`\
  \ 方法返回构建器存储的实际字符串。\n\nJava 开发者经常断言 Java 优化了字符串连接。在 Java 中，对字符串使用 `+` 运算符是浪费的，特别是当要添加的字符串是动态的。除非所有要添加的字符串都是静态的，否则\
  \ Java 中的 `+` 运算符每次都会创建一个新字符串并将其添加到旧字符串上，因此通过添加多个动态字符串组成的长字符串最终会创建许多临时字符串（这些字符串最终会被垃圾回收）。然而，Java\
  \ 编译器足够智能，当所有要添加的字符串都是字面量时，它会优化加法运算符。\n\n清单 12.6 是一个 Java 程序，展示了三种添加字符串的方法。在第一种方法中，所有要添加的字符串都是字面量。在幕后，编译器将方法\
  \ 1 转换为方法 2，因此这两种方法是相同的。方法 1 更具可读性，因此如果你的字符串仅由字面量组成，则首选方法 1。方法 3 是 `StringBuffer`\
  \ 有用的地方，因为在这种情况下，对于每个 `+` 运算符，运行时都会通过连接前一个字符串来创建一个新的 `String` 实例。\n\n#### 清单 12.6.\
  \ 添加字符串 (Java)\n\n\n\n\n\n## 12.4. 正则表达式\n\n使用正则表达式进行模式匹配是一种强大的技术，可用于从字符串中进行高级分割和内容提取。C#\
  \ 在 `System.Text` 命名空间中提供了用于模式匹配的类。\n\n请注意，本节假设您了解模式匹配的基础知识。如果您是模式匹配的新手，建议您访问 [perl.com](http://www.perl.com)\
  \ 查看入门材料。对正则表达式技术的详细讨论超出了本书的范围。如果您想深入探索正则表达式，我们推荐 Jeffrey E.F. Friedl 所著的《*精通正则表达式*》（O'Reilly,\
  \ 2002）。\n\n截至 JDK 1.3，Java 尚未内置模式匹配 API。然而，JDK 1.4 已支持模式匹配。C# 的模式匹配类不会为每次匹配都解释模式；相反，它会编译一个小程序，然后运行该程序来执行模式匹配。这种在内存中编译小程序的神奇机制是通过\
  \ `System.Reflection.Emit` 命名空间中的类实现的。（反射在 第 22 章 中有详细讨论。）使用 `Reflection.Emit` 命名空间中的类，您可以直接为该类的函数编写\
  \ IL 代码。这是 `System.Text.RegularExpressions` 类用来创建自定义匹配引擎的强大技术。\n\n正则表达式（`System.Text.RegularExpressions.Regex`）由编译器使用\
  \ `System.Text.RegularExpressions.RegexCompilationInfo` 中的信息编译成独立的程序集。表 12.6 列出了该命名空间的一些关键类。\n\
  \n#### 清单 12.7. 清单 12.6 的 C# 版本\n\n```csharp\nusing System;\nusing System.Text;\n\
  public class StringTest {\n  public static void Main(string[] args) {\n    //Approach\
  \ 1\n    String s1 = \"It's \"+\"My \"+\"Life\";\n    //Approach 2\n    String s2\
  \ = new StringBuilder() .Append(\"It's\")\n                .Append(\"My\") .Append(\"\
  Life\") .ToString();\n    //Approach 3\n    String s3 = \"It's\";\n    String s4\
  \ = s3 + \"My \"+\"Life\";\n  }\n}\n```\n\n通常，方法调用被认为是开销较大的操作；因此，如果某件事能用更少的方法调用来完成，那么这种方法就更快。我们将通过比较每种方法转换成多少方法调用来比较连接字符串的三种方法（清单\
  \ 12.7）。为此，我们需要查看 清单 12.7 生成的中间语言（IL），如 清单 12.8 所示。\n\n#### 清单 12.8. 清单 12.7 的 IL\
  \ 代码\n\n```il\n1 // Code size 66 (0x42)\n2 .maxstack 2\n3 .locals init ([0] string\
  \ s1,\n          [1] string s2,\n          [2] string s3,\n          [3] string\
  \ s4)\n4 IL_0000: ldstr \"It's My Life \"\n5 IL_0005: stloc.0\n6 IL_0006: newobj\
  \ instance void\n[mscorlib]System.Text.StringBuilder::.ctor()\n7 IL_000b: ldstr\
  \ \"It's \"\n8 IL_0010: call instance class\n[mscorlib]System.Text.StringBuilder\n\
  [mscorlib]System.Text.StringBuilder::Append(string)\n9 IL_0015: ldstr \"My \"\n\
  10 IL_001a: callvirt instance class\n[mscorlib]System.Text.StringBuilder\n[mscorlib]System.Text.StringBuilder::Append(string)\n\
  11 IL_001f: ldstr \"Life\"\n12 IL_0024: callvirt instance class\n[mscorlib]System.Text.StringBuilder\n\
  [mscorlib]System.Text.StringBuilder::Append(string)\n13 IL_0029: callvirt instance\
  \ string\n[mscorlib]System.Text.StringBuilder::ToString()\n14 IL_002e: stloc.1\n\
  15 IL_002f: ldstr \"It's \"\n16 IL_0034: stloc.2\n17 IL_0035: ldloc.2\n18 IL_0036:\
  \ ldstr \"My Life\"\n19 IL_003b: call string mscorlib]System.String::Concat(string,\n\
