  \ {\n      g.DrawEllipse(pen, previousPoint.X, previousPoint.Y,\n          currentWidth,\
  \ currentWidth);\n    }\n    if (currentShape == Shape.Ellipse) {\n      g.DrawEllipse(pen,\
