  \      <State>WA</State>\n      <ZipCode>98073</ZipCode>\n    </Address>\n    <Job>\n\
  \      <Title>Web Site Developer</Title>\n      <Description>Writes the pretty pages</Description>\n\
  \    </Job>\n  </Person>\n</People>\n```\n\n我们将在后续示例中使用清单 20.1 中的 XML。\n\n#### 20.3.1.\
  \ 在.NET 中读取 XML\n\n清单 20.2 展示了`XmlTextReader`的用法。\n\n##### 清单 20.2. 使用`XmlTextReader`浏览\
  \ XML 文件（C#）\n\n\n\n\n\n# 使用 `XmlTextReader` 读取 XML 文件\n\n```csharp\nusing System;\n\
  using System.Xml;\n\npublic class Test {\n  public static void Main(string[] args)\
  \ {\n    XmlTextReader reader = new XmlTextReader(\"c:\\\\people.xml\");\n    reader.WhitespaceHandling\
  \ = WhitespaceHandling.None;\n    //Moves the reader to the root element.\n    reader.MoveToContent();\n\
  \    Console.WriteLine(\"Name,Value,Type \");\n    while (reader.Read()) {\n   \
  \   Console.Write(reader.Name+\",\");\n      Console.Write(reader.Value+\",\");\n\
  \      Console.Write(reader.NodeType);\n      Console.WriteLine();\n    }\n  reader.Close();\n\
  \  }\n}\n```\n\n以下是 清单 20.2 的部分输出：\n\n```\nName,Value,Type\nPeople,,Element\nPerson,,Element\n\
  Name,,Element\nFirstName,,Element\n,Joe,Text\nFirstName,,EndElement\nLastName,,Element\n\
  ,Suits,Text\nLastName,,EndElement\nName,,EndElement\nAddress,,Element\nStreet,,Element\n\
  ,1800 Success Way,Text\nStreet,,EndElement\nCity,,Element\n,Redmond,Text\nCity,,EndElement\n\
  ```\n\n我们首先通过传递 XML 文件的 URL 来初始化一个 `XmlTextReader`：\n\n```csharp\nXmlReader reader\
  \ = new XmlTextReader(\"c:\\\\people.xml\");\n```\n\n接下来，我们告诉 `XmlTextReader` 在解析\
  \ XML 时忽略空白节点：\n\n```csharp\nreader.WhitespaceHandling = WhitespaceHandling.None;\n\
  ```\n\n然后我们将读取器定位到根内容节点。在 XML 中，以下类型的节点被视为非内容节点：`ProcessingInstruction`、`DocumentType`、`Comment`、`Whitespace`\
  \ 和 `SignificantWhitespace`。以下代码跳过文件开头的任何前导非内容节点，并将读取器定位到第一个内容节点 `<People>`：\n\n\
  ```csharp\n//Moves the reader to the root element.\nreader.MoveToContent();\n```\n\
  \n当 `XmlTextReader` 首次初始化时，没有当前节点，因此第一次调用 `Read` 会移动到文档中的第一个节点。当 `XmlReader` 到达文档末尾时，它不会越过末尾，使文档处于不确定状态；相反，当没有更多节点要处理时，它只是返回\
  \ `false`。\n\n在 `while` 循环中调用 `reader.Read()` 会将光标向前移动，遍历所有节点。在每次循环调用结束时，光标移动到下一个节点。请注意，`while`\
  \ 循环内的任何代码仅应用于当前访问的节点。\n\n到目前为止，我们已经了解了如何浏览文件。清单 20.3 展示了如何从文件中收集有用信息。假设我们想知道 `people.xml`\
  \ 文件中的所有职位名称。清单 20.3 展示了如何实现这一点。\n\n##### 清单 20.3. 获取所有名为 \"Title\" 的文本节点的值 (C#)\n\
  \n```csharp\nusing System;\nusing System.Xml;\n\npublic class Test {\n  public static\
  \ void Main(string[] args) {\n    XmlTextReader reader = new XmlTextReader(\"c:\\\
  \\people.xml\");\n    //Moves the reader to the root element.\n    reader.MoveToContent();\n\
  \    while (reader.Read()) {\n      if (reader.Name.Equals(\"Title\") && reader.NodeType\
  \ ==\n          XmlNodeType.Element) {\n        Console.WriteLine(reader.ReadElementString(\"\
  Title\"));\n      }\n    }\n    reader.Close();\n  }\n}\n```\n\n清单 20.3 的输出如下：\n\
  \n```\nCEO\nAttorney\nPro Surfer\nWeb Site Developer\n```\n\n`<Title>` 节点是一个纯文本元素，因此我们使用\
  \ `reader` 方法。`ReadElementString` 方法是一个辅助方法，用于获取该节点的文本和值。为正确的节点调用此方法很重要。请注意，我们首先检查封闭节点名称是否为\
  \ \"Title\" 且其类型是否为 `Element`。在确认当前访问的节点是 `<Title>` 而不是 `</Title>` 后，我们调用 `ReadElementString`。\n\
  \n`XmlReader` 类提供了一个仅向前的游标，因此所有节点都是按顺序访问并检查是否满足条件的。虽然这种方法有效，但对于任何适度的数据挖掘工作来说，它是低效的。XPath\
  \ API（在 第 20.4.1 节 中讨论）提供了对搜索过程的更多控制，应用于 XML 搜索。\n\n`Read()` 不会遇到属性节点，因为它们不被视为文档层次结构的一部分。属性通常被视为附加到结构元素的元数据。当当前节点是元素时，可以通过按名称或索引调用\
  \ `GetAttribute` 来访问其属性。清单 20.4 展示了如何访问节点的属性。\n\n##### 清单 20.4. 显示节点的属性 (C#)\n\n\
  ```csharp\nusing System;\nusing System.Xml;\n\npublic class Test {\n  public static\
  \ void Main(string[] args) {\n    XmlTextReader reader = new XmlTextReader(\"c:\\\
  \\people.xml\");\n    //Moves the reader to the root element.\n    reader.MoveToContent();\n\
  \    while (reader.Read()) {\n      if (reader.HasAttributes) {\n        Console.WriteLine(\"\
  Id = \"+reader.GetAttribute(\"id\")+\"\n                            SSN =\"+reader.GetAttribute(\"\
  ssn\"));\n      }\n    }\n  reader.Close();\n  }\n}\n```\n\n清单 20.4 的输出如下：\n\n```\n\
  Id = 1 SSN =555121212\nId = 2 SSN =666131313\nId = 3 SSN =777141414\nId = 4 SSN\
  \ =888151515\n```\n\n并非 XML 文件中的所有节点都有属性，因此我们使用节点的 `HasAttributes` 属性来检查节点是否定义了属性。\n\
  \nXML 文档包含数据，就像 RDBMS 表包含行一样，但 RDBMS 提供 SQL 来访问这些数据。为了高效地查询和搜索 XML 文档中的数据，你应该使用\
  \ XPath API（稍后讨论）。虽然 `XmlReader` 提供了一个访问所有节点的 API，但单独使用它对 XML 文档进行任何适度的数据挖掘工作都是低效的。\n\
  \n与 SAX 事件模型（在遇到标签时触发事件，并要求你拥有具有特殊方法签名的 `ContentHandler` 类）不同，.NET API 允许你在单个 `while`\
  \ 循环中方便地扫描整个 XML 文档。虽然你可以在此循环中解析整个文档，但建议将文档分解为可管理的块，并将这些块交给可以解析它们的类或方法。当 XML 数据映射到代码元素（如类）时，此技术特别有用。\n\
  \n例如，假设我们使用 `people.xml` 来创建 `Person` 对象。清单 20.5 展示了如何解析 XML 以创建有意义的数据。\n\n#####\
  \ 清单 20.5. 解析 XML 以创建对象 (C#)\n\n\n\n\n\n# 20.3.1. 在 .NET 中读取 XML\n\n```csharp\n\
  using System;\nusing System.IO;\nusing System.Xml;\nusing System.Collections;\n\n\
  public class PersonReader {\n\n  private XmlTextReader reader;\n  public PersonReader\
  \ (string url) {\n    reader = new XmlTextReader (url);\n    reader.MoveToContent();\n\
  \  }\n  public bool NextPerson() { return reader.Read(); }\n  public Person GetPerson()\
  \ { return new Person(reader); }\n\n  public static void Main(string[] args) {\n\
  \n    PersonReader reader = new PersonReader(\"c:\\\\people.xml\");\n    while (reader.NextPerson())\
  \ {\n      Person p = reader.GetPerson();\n      if (p != null) {\n        Console.WriteLine(p.GetZip());\n\
  \      }\n    }\n\n  }\n}\n\npublic class Person {\n\n  Hashtable attributes;\n\n\
  \  public Person (XmlTextReader reader) {\n\n    attributes = new Hashtable();\n\
  \    attributes.Add(\"id\", null);\n    attributes.Add(\"ssn\", null);\n    attributes.Add(\"\
  FirstName\", null);\n    attributes.Add(\"LastName\", null);\n    attributes.Add(\"\
  City\", null);\n    attributes.Add(\"State\", null);\n    attributes.Add(\"Street\"\
  , null);\n    attributes.Add(\"ZipCode\", null);\n    attributes.Add(\"Title\",\
  \ null);\n    attributes.Add(\"Description\", null);\n\n    while (reader.Read())\
  \ {\n\n      if (reader.NodeType == XmlNodeType.EndElement &&\n        reader.Name.Equals(\"\
  Person\")) break;\n\n      if (reader.HasAttributes) {\n        attributes[\"id\"\
  ] = reader.GetAttribute(\"id\");\n        attributes[\"ssn\"] = reader.GetAttribute(\"\
  ssn\");\n      }\n      string name = reader.Name;\n      if (attributes.ContainsKey(name))\
  \ {\n        attributes[name] = reader.ReadElementString(name);\n      }\n    }\n\
  \  }\n  public object GetID() { return attributes[\"id\"]; }\n  public object GetFirstName()\
  \ { return attributes\n                                             [\"FirstName\"\
  ]; }\n  public object GetLastName() { return attributes[\"LastName\"];\n}\n  public\
  \ object GetSSN() { return attributes[\"ssn\"]; }\n  public object GetCity() { return\
  \ attributes[\"City\"]; }\n  public object GetState() { return attributes[\"State\"\
  ]; }\n  public object GetStreet() { return attributes[\"Street\"]; }\n  public object\
  \ GetZip() { return attributes[\"ZipCode\"]; }\n  public object GetTitle() { return\
  \ attributes[\"Title\"]; }\n  public object GetDescription() {\n    return attributes[\"\
  Description\"];\n  }\n}\n```\n\n清单 20.5 的输出如下：\n\n```\n98052\n93447\n98052\n98073\n\
  ```\n\n我们首先创建一个 `PersonReader`，它封装了 `XmlTextReader`。然后，`NextPerson` 和 `GetPerson`\
  \ 封装了对 `XmlTextReader` 的导航操作。`Person` 对象包含一个属性的 `Hashtable`。`Person` 对象的构造函数只是遍历\
  \ reader 对象，检索其感兴趣的标签值，并将其状态设置在属性 `Hashtable` 中。在 `Person` 对象的状态初始化之后，访问器方法（getter\
  \ 方法）就可以访问 `Person` 对象的状态了。\n\n到目前为止，解析的 XML 都是格式良好的，但不一定是有效的。`XmlTextReader` 支持针对\
  \ DTD、XML-Data Reduced (XDR) 架构和 XSD 架构进行验证。使用者可以使用 `Validation` 属性来控制 reader 执行验证的方式。在默认状态下，`XmlTextReader`\
  \ 会自动检测 DTD 和架构以处理实体和默认属性值。要启用验证，必须提供一个 `ValidationHandler`。当设置为 `Validation.Schema`\
  \ 时，reader 会自动检测使用的是 XDR 还是 XSD 架构。`Validation Handler` 是 reader 在遇到验证错误时使用的事件处理程序。回调方法通过\
  \ `ValidationEventHandler` 事件属性与 reader 关联。\n\n`people.xml` 的 DTD 存储在一个名为 `people.dtd`\
  \ 的文件中：\n\n```\n<!ELEMENT People (Person+)>\n<!ELEMENT Person (Name,Address*,Job*)>\n\
  <!ELEMENT Name (FirstName,LastName)>\n<!ELEMENT FirstName (#PCDATA)>\n<!ELEMENT\
  \ LastName (#PCDATA)>\n<!ELEMENT Address (Street,ZipCode,City,State)>\n<!ELEMENT\
  \ Street (#PCDATA)>\n<!ELEMENT ZipCode (#PCDATA)>\n<!ELEMENT City (#PCDATA)>\n<!ELEMENT\
  \ State (#PCDATA)>\n<!ELEMENT Job (Title,Description)>\n<!ELEMENT Title (#PCDATA)>\n\
  <!ELEMENT Description (#PCDATA)>\n```\n\n请注意，我们有意省略了 `Person` 节点的属性定义。\n\n接下来，我们在\
  \ `people.xml` 文件的顶部添加以下行：\n\n```\n<!DOCTYPE people SYSTEM \"people.dtd\">\n```\n\
  \n清单 20.6 展示了如何使用一个验证 XML reader。\n\n##### 清单 20.6. 针对 DTD 验证 XML (C#)\n\n```csharp\n\
  using System;\nusing System.Xml;\nusing System.Xml.Schema;\n\npublic class Test\
  \ {\n\n  public static void Main(string[] args) {\n\n    XmlValidatingReader reader\
  \ = new XmlValidatingReader (\n                          new XmlTextReader(\"c:\\\
  \\people.xml\"));\n    reader.ValidationType = ValidationType.DTD;\n    reader.ValidationEventHandler\
  \ += new\n      ValidationEventHandler (CallBack);\n\n    //Moves the reader to\
  \ the root element.\n    reader.MoveToContent();\n    while (reader.Read()) {\n\
  \    }\n    reader.Close();\n\n  }\n\n  public static void CallBack (Object obj,\n\
  \    ValidationEventArgs args) {\n    Console.WriteLine(args.Message);\n  }\n}\n\
  ```\n\n清单 20.6 的输出如下：\n\n```\nThe root element name must match the DocType name.\
  \ An error occurred at file:///c:/people\n.xml(2, 2).\nThe 'id' attribute is not\
  \ declared. An error occurred at file:///c:/people.xml(3, 13).\nThe 'ssn' attribute\
  \ is not declared. An error occurred at file:///c:/people.xml(3, 20).\nElement 'Address'\
  \ has invalid child element 'City'. Expected 'ZipCode'. An error occurred\n at file:///c:/people.xml(10,\
  \ 14).\nThe 'id' attribute is not declared. An error occurred at file:///c:/people.xml(20,\
  \ 13).\nThe 'ssn' attribute is not declared. An error occurred at file:///c:/people.xml(20,\
  \ 20).\nElement 'Address' has invalid child element 'City'. Expected 'ZipCode'.\
  \ An error occurred\n at file:///c:/people.xml(27, 14).\nThe 'id' attribute is not\
  \ declared. An error occurred at file:///c:/people.xml(37, 13).\nThe 'ssn' attribute\
  \ is not declared. An error occurred at file:///c:/people.xml(37, 20).\nElement\
  \ 'Address' has invalid child element 'City'. Expected 'ZipCode'. An error occurred\n\
  \ at file:///c:/people.xml(44, 14).\nThe 'id' attribute is not declared. An error\
  \ occurred at file:///c:/people.xml(54, 13).\nThe 'ssn' attribute is not declared.\
  \ An error occurred at file:///c:/people.xml(54, 20).\nElement 'Address' has invalid\
  \ child element 'City'. Expected 'ZipCode'. An error occurred\n at file:///c:/people.xml(61,\
  \ 14).\n```\n\n清单 20.6 首先创建一个验证 reader：\n\n```csharp\nXmlValidatingReader reader\
  \ = new XmlValidatingReader (new\n    XmlTextReader(\"c:\\\\people.xml\"));\n```\n\
  \n然后我们设置要验证 XML 的目标。这可以是 XSD 架构或 DTD。因为我们是针对 DTD 进行验证，所以按如下方式指定：\n\n```csharp\n\
  reader.ValidationType = ValidationType.DTD;\n```\n\n接下来，我们指定在验证过程中将被调用的回调处理程序。请注意，`ValidationEventHandler`\
  \ 是 `reader` 对象的一个委托。\n\n```csharp\nreader.ValidationEventHandler += new ValidationEventHandler\
  \ (CallBack);\n```\n\n我们在解析 XML 时遇到了错误，如输出所示。我们在 DTD 中省略了属性定义，解析器在验证 XML 时清楚地指出了这一点。这些错误之所以被打印出来，要归功于\
  \ `CallBack` 方法中的以下行：\n\n```csharp\nConsole.WriteLine(args.Message);\n```\n\n####\
  \ 20.3.2. 在 .NET 中写入 XML\n\n\n\n\n到目前为止，我们已经了解了如何从数据流中读取 XML；现在我们将探讨如何将 XML 写入文件或内存流。`XmlTextWriter`\
  \ 是一个具体类，派生自 `XmlWriter`，用于编写字符流。它支持多种不同的输出流类型（文件 URI、流和 `TextWriter`），并且是可配置的。你可以指定诸如是否提供命名空间支持、缩进选项、用于属性值的引号字符，甚至用于类型化值的词法表示等设置。\n\
  \n清单 20.5 中显示的 `Person` 类现在有一个 `ToXml()` 方法，用于打印 `Person` 对象的 XML 表示（参见清单 20.7）。\n\
  \n##### 清单 20.7. 以 XML 格式打印对象状态 (C#)\n\n```\nusing System;\nusing System.Text;\n\
  using System.IO;\nusing System.Xml;\nusing System.Collections;\n\npublic class Person\
