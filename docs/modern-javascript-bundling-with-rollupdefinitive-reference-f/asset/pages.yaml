  md: "By understanding and applying these principles, production bundles can be considerably\
    \ leaner, reducing load times, improving runtime performance, and contributing\
    \ to maintainable, modular codebases.\n\n# 5.5 Multiple Output Formats: CJS, ESM,\
    \ UMD, and IIFE\n\nModern JavaScript projects often need to support diverse runtime\
    \ environments and consumption workflows. Achieving broad compatibility requires\
    \ producing builds that target multiple formats, each with distinct loading characteristics,\
    \ interoperability features, and deployment scenarios. The primary output formats\
    \ are CommonJS (CJS), ES Modules (ESM), Universal Module Definition (UMD), and\
    \ Immediately Invoked Function Expressions (IIFE). These formats reflect different\
    \ stages in the evolution of JavaScript module systems and vary in terms of browser\
    \ and server support, tree-shaking capabilities, and bundle compatibility.\n\n\
    # CommonJS (CJS)\n\nCommonJS is the module standard traditionally supported by\
    \ Node.js environments. In this format, modules are defined using synchronous\
    \ require and export objects via exports. This synchronous loading paradigm aligns\
    \ well with server-side usage but is ill-suited for browsers without a bundle\
    \ or loader shim.\n\nA typical CJS output in a build tool configuration specifies\n\
    \n```\n{\n  format: 'cjs',\n  exports: 'auto',\n  dir: 'dist/cjs'\n}\n```\n\n\
    Because CJS modules are executed immediately and operate synchronously, they do\
    \ not facilitate static analysis. Consequently, modern bundles cannot perform\
    \ effective tree-shaking on CJS outputs, potentially resulting in larger bundles.\
    \ For server-oriented deployments or Node.js CLI tools, CJS remains the most compatible\
    \ and straightforward choice, especially where legacy Node.js versions are concerned.\n\
    \n# ES Modules (ESM)\n\nES Modules represent the standardized JavaScript module\
    \ system introduced in2015. They use import and export statements, enabling static\
    \ analysis of dependencies which in turn facilitate advanced optimizations such\
    \ as tree-shaking and scope hoisting. ESM modules execute asynchronously and support\
    \ top-level await.\n\nA build configuration targeting ESM typically specifies:\n\
    \n```\n{\n  format: 'esm',\n  dir: 'dist/esm',\n  exports: 'named'\n}\n```\n\n\
    ESM modules can be consumed natively in modern browsers and Node.js versions 12\
    \ and above, making them the preferred format for web applications and modern\
    \ JavaScript packages. However, earlier Node.js versions or tooling ecosystems\
    \ not supporting ESM may require transpilation or dual publishing alongside CJS."
