  md: "Production of pure ESM output promotes distribution models that enable efficient\
    \ client-side loading and minimal runtime overhead. However, it necessitates clear\
    \ package metadata, such as the \"module\" field in package.json, to guide bundlers\
    \ and runtimes on module resolution.\n\n# Universal Module Definition (UMD)\n\n\
    UMD surfaced as an interoperable format to bridge module loading across browsers\
    \ and Node.js. It wraps the module definition in a factory function that detects\
    \ the environment, loading as AMD, CommonJS, or assigning the exports to a global\
    \ object.\n\nA typical UMD build configuration resembles:\n\n```\n{\n  format:\
    \ 'umd',\n  name: 'MyLibrary',\n  file: 'dist/umd/my-library.js',\n  exports:\
    \ 'named'\n}\n```\n\nUMD outputs are particularly suitable for libraries intended\
    \ for use directly in browsers via script tags or older environments lacking native\
    \ module support. They offer a single file compatible with multiple loaders and\
    \ global usage contexts. The presence of the name option defines the global namespace\
    \ under which the module exports be attached.\n\nOne key trade-off is that UMD\
    \ needs to be larger due to wrapper overhead and lack the static analyability\
    \ present in ESM, limiting tree-shaking effectiveness. Additionally, UMD modules\
    \ rely on a global variable, which potentially cause namespace collisions in complex\
    \ applications.\n\n# Immediately Invoked Function Expression (IIFE)\n\nThe IIFE\
    \ format encapsulates the entire module inside a self-executing function, exposing\
    \ the module's public API on a global variable explicitly defined by the name\
    \ option. Unlike other systems, IIFE outputs do not export or import dependencies;\
    \ instead, any external logic must be provided as global variables or inline.\n\
    \nA canonical IIFE configuration is:\n\n```\n{\n  format: 'iife',\n  name: 'MyLibrary',\n\
    \  file: 'dist/iife/my-library.js'\n}\n```\n\nIIFE builds are useful for embedding\
    \ libraries directly within browsers, especially when integrating with legacy\
    \ applications or simple HTML pages that do not employ module loaders or bundlers.\
