  md: "```\nentry: {\n  index: './src/index.js',\n  utils: './src/utils.js',\n  widget:\
    \ './src/widget/main.js'\n}\n```\n\nEach defined entry generates an independent\
    \ output artifact, which can then be configured further to emit different module\
    \ formats.\n\n# Output Formats: CommonJS, ESM Modules, and Beyond\n\nModern JavaScript\
    \ projects generally target at least two primary module formats:\n\n+   - **CommonJS\
    \ (CJS):** Predominantly used in Node.js environments and legacy bundlers. It\
    \ employs synchronous 'require' semantics and a single 'module.exports' object.\n\
    - **ES Modules (ESM):** The standardized module format with static 'import'/'export'\
    \ syntax, enabling advanced features like tree-shaking and improved static analysis.\n\
    \nSupporting both formats allows a library or application to serve legacy and\
    \ modern environments transparently. Additionally, projects sometimes offer UMD\
    \ or IIFE bundles for direct browser script inclusion or more specialized formats\
    \ for specific runtimes.\n\n# Configuring Bundlers for Multi-format Output\n\n\
    To generate multiple output formats from a single build configuration, bundlers\
    \ must be configured for output arrays or repeated builds targeting distinct formats\
    \ with potentially different optimization strategies.\n\nConsider a Rollup configuration\
    \ where the same input(s) emit both CJS and ESM outputs:\n\n```\nexport default\
    \ {\n  input: {\n    index: './src/index.js',\n    utils: './src/utils.js'\n \
    \ },\n  output: [\n    dir: 'dist/cjs',\n    format: 'cjs',\n  ]\n}\n```"
