    By contrast, ES Modules'' static import/export declarations allow bundlers to
    more precisely analyze dependency graphs and perform tree shaking with higher
    confidence. Modern bundlers exploit this to produce minimal bundles, reducing
    payload size and improving application startup times. Tools thus increasingly
    promote ES Module usage and incorporate transforms to convert legacy CommonJS
    dependencies into ESM-compatible forms transparently.'
