    and various flags indicating side effects or dynamic imports. The Module object
    contains fields for its unique identifier (usually the resolved file path), a
    set of importedModules, and a record of importers, which are other modules that
    depend on it. This bidirectional linkage facilitates quick traversal of the module
    graph in either direction.


    To track module dependencies, Rollup constructs a directed acyclic graph (DAG)
    called the ModuleGraph. The nodes correspond to Module instances, and each represent
    import statements from one module to another. Each edge is annotated with metadata
    about the import type (static, dynamic, or side-effect-only), the imported bindings,
    and any plugins that might affect its behavior. Dependency information is thus
    fully resolved and cached, enabling granular dependency tracking and invalidation
    in incremental builds.


    Each module''s code is parsed into an ESTree-compliant AST, stored within the
    Module object. This AST facilitates precise static analysis and advanced tree-shaking.
    The data structure maintains detailed information about declared imports and exports,
    including re-exports and namespace objects. Dynamic imports introduce non-deterministic
    edges in the dependency graph, which are flagged within the ModuleGraph to inform
    asynchronous chunk strategies.


    Chunking in Rollup is controlled internally via Chunk objects. A chunk represents
    a generated output bundle, comprising one or more modules bundled together. The
    rollup core maintains a ChunkGraph, a structure that maps modules to their assigned
    chunks and tracks chunk-to-chunk dependencies. The chunking process hinges on
    analyzing the ModuleGraph with heuristics and user configuration to determine
    optimal split points based on import patterns, dynamic imports, and manual split
    points specified.


    Internally, each Chunk maintains a list of contained modules, ordered by a topological
    sort to ensure correct execution order within the chunk. Alongside module references,
    chunks hold the generated code, source maps, and references to runtime helpers
    used by modules within the chunk. A critical aspect managed by these structures
    is the prevention of duplicated code between chunks achieved through shared extraction
    and manifest tracking. Shared dependencies between chunks lead to the creation
    of common chunks, avoiding redundancy and minimizing output size.'
