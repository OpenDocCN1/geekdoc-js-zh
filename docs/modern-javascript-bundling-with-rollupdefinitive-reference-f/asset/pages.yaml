  md: "At the heart of Rollup's tree shaking is the concept of static ES module structure.\
    \ Rollup benefits from the ES module syntax's static nature-imports and exports\
    \ must be declared at the top level and cannot be altered at runtime. This declarative\
    \ structure allows Rollup to construct a comprehensive dependency graph of modules,\
    \ tracking which exports are referenced and which unused. Only the latter are\
    \ considered for removal, assuming their elimination does not introduce side effects.\n\
    \nRollup processes with a node-by-node analysis of the Abstract Syntax Tree (AST)\
    \ for each module. When a module is imported, Rollup identifies the named exports\
    \ that are actually used downstream. Unused exports are flagged. The bundler subsequently\
    \ applies a form of code elimination by excluding these exports and all associated\
    \ internal bindings and code paths from the final output. This mechanism is recursive;\
    \ if a symbol in A is unused and another symbol in B is solely used by the former,\
    \ both are candidates for removal.\n\nHowever, not all code patterns are tree-shakeable.\
    \ The key criterion is that Rollup must determine at build time whether an export\
    \ or statement has side effects. When side effects are uncertain or unavoidable,\
    \ Rollup errs on the side of caution and preserves the code. Common scenarios\
    \ that tree shaking includes:\n\n+   **Dynamic Exports and Side Effects:** Usage\
    \ of computed export names or accessing properties via dynamic strings complicates\
    \ static analysis. Rollup treats such cases conservatively, retaining entire modules\
    \ or exports.\n**Top-Level Side Effects:** Executable code outside function scope-such\
    \ as global variables, assignments, functions, or class instantiations-must be\
    \ preserved if they produce side effects. If an exported function is used, if\
    \ it executes side-effect code at load time, the module cannot be fully eliminated.\n\
    **Re-exported Modules:** Modules that re-export from other modules introduce complexity.\
    \ While Rollup attempts to strip unused-exports, certain re-export patterns, such\
    \ as 'export from' combined with side-effect imports, reduce shakeability\n**CommonJS\
    \ Compatibility:** Rollup is optimized for ES modules. CommonJS lacks static structure,\
    \ so Rollup employs heuristics (via plugins like @rollup/plugin-commonjs) but\
    \ these often leave dead code.\n\nBeyond this, Rollup incorporates several heuristics\
    \ and options to maximize code elimination:\n\n+   1. Making Pure Functions and\
    \ Statements: Developers can annotate functions or expressions to indicate the\
    \ absence of side effects. This is typically done via special comments /*@PURE__\
    \ */ recognized by Rollup and terser. Such annotations enable more aggressive\
    \ pruning of functions or IIFEs that would otherwise be retained.\n\n+   2. PreserveEntry\
    \ and Treeshake Configuration: Rollup's configuration allows fine-grained control\
    \ over treesaking behavior. For example:\n\n```\nexport default {\n  input: 'src/index.js',\n\
    \  output: {\n    file: 'bundle.js',\n  },\n  treeshake: {\n    moduleSideEffects:\
    \ false,\n    propertyReadSideEffects: false,\n```"
