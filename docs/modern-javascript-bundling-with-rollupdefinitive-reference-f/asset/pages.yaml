  md: "# # Chapter 8\nIntegrating Non-JavaScript Assets and Universal Applications\n\
    \nJavaScript is only part of the story when building sophisticated applications—assets\
    \ like stylesheets, images, and even custom elements are just as critical. Whether\
    \ you're targeting browsers, servers, or multi-platform apps, managing these resources\
    \ gracefully is key to a seamless experience. This chapter pulls back the curtain\
    \ on how Rollup integrates a world of assets, supporting everything from framework-agnostic\
    \ components to server-side rendering and dynamic deployments.\n\n# ## 8.1 Stylesheets,\
    \ Images, and Static Files\n\nEffective management of stylesheets, images, fonts,\
    \ and other static assets is critical to building maintainable, high-performance\
    \ web applications. When using Rollup as a module bundler, integrating these assets\
    \ alongside JavaScript requires understanding specialized plugins, proper configuration,\
    \ and optimization strategies to ensure cohesive output and streamlined development\
    \ workflows.\n\nCSS and Sass (SCSS) are typically imported directly into JavaScript\
    \ modules to enable scoped, modular styling. Rollup design is optimized for JavaScript\
    \ and ES modules, managing stylesheets demands external plugins such as rollup-plugin-postcss,\
    \ which combines CSS processing, bundling, and injection capabilities. This plugin\
    \ supports importing CSS and SASS files seamlessly and can be configured with\
    \ PostCSS processors to enable autoprefixing, minification, and custom transformations.\n\
    \nA minimal configuration snippet to handle SASS files looks like this:\n\n```\n\
    import postcss from 'rollup-plugin-postcss';\n\nexport default {\n  input: 'src/main.js',\n\
    \  output: 'dist/bundle.js',\n  format: 'esm',\n  plugins: [\n    postcss({\n\
    \      extensions: ['.css', '.scss'],    // Extract CSS to a separate file\n \
    \     extract: true,\n      minimize: true,                               // Minify\
    \ the resulting CSS\n      sourceMap: true,\n      use: ['sass']\n    ])\n  ]\n\
    };\n```\n\nHere, the extract option generates a separate CSS file rather than\
    \ injecting styles inline in JavaScript, which is preferred in production for\
    \ better caching and performance. By enabling minimize and source maps, the outputted\
    \ CSS is both compact and debuggable, aligning with best practices."
  merge: -1
