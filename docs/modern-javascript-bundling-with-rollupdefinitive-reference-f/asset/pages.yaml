  md: "# Rollup Configuration for the Main Process\n\nThe main process requires bundling\
    \ code that targets Node.js, often in CommonJS or ES modules format, while preserving\
    \ or externalizing native dependencies to prevent bundling errors or inflated\
    \ binary sizes. Rollup's external option is critical here to exclude Node.js built-ins\
    \ and native modules such as electron, fs, path, and others from the bundle. This\
    \ ensures the bundled output properly references these at runtime without duplication.\n\
    \n```\nexport default {\n  input: 'src/main/index.js',\n  output: {\n    file:\
    \ 'dist/main.js',\n    format: 'cjs', // Node.js environment format\n  },\n  external:\
    \ [\n    'electron',\n    'fs',\n    'path',\n    // other native Node or Electron\
    \ modules\n  ],\n  plugins: [\n    // CommonJS plugin to support dependencies\
    \ exporting CJS modules\n    commonjs(),\n    // Node resolve plugin to locate\
    \ modules in node_modules\n    nodeResolve({ preferredBuiltins: true, babelHelpers:\
    \ 'bundled' })\n  ]\n};\",\n```\n\nThe preferredBuiltins: true option in nodeResolve\
    \ allows Rollup to resolve Node.js built-ins without replacing them with browser-compatible\
    \ shims, important for native Electron modules to function correctly.\n\n# Rollup\
    \ Configuration for the Renderer Process\n\nThe renderer process bundles code\
    \ that targets the browser environment inside Electron's Chrome content, using\
    \ ES modules or IIFE format. This configuration enables typical web-centric optimizations\
    \ such as code splitting, CSS extraction, and asset inlining.\n\nSince the renderer\
    \ can interact with the main process through electron.ipcRenderer and custom preload\
    \ scripts, externalization of the electron module must be carefully considered.\
