    \n# 12 From CommonJS to ES Modules\n\nJavaScript module systems have undergone\
    \ a fundamental transformation, transitioning from the initially dominant CommonJS\
    \ (CJS) format to the standardized ECMAScript Modules (ESM). This evolution reflects\
    \ both technical design improvements and philosophical shifts in how modular code\
    \ is conceived and executed. The distinctions between CommonJS and ES Modules\
    \ influence syntax, environment compatibility, and module loading strategies,\
    \ each affecting the structure of applications and the bundling workflows required\
    \ for efficient distribution.\n\nCommonJS was designed pragmatically to enable\
    \ modularity on the server side, especially within Node.js environments. It employs\
    \ a synchronous loading model and leverages imperative syntax, characterized by\
    \ the use of require() for importing dependencies and module.exports for exporting\
    \ functionality. An example illustrates this pattern:\n\n```\nconst fs = require('fs');\n\
    function readTextFile(path) {\n  return fs.readFileSync(path, 'utf-8');\n}\n```"
