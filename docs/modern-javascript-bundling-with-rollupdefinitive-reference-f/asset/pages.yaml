  md: "Typical structures employ tools like Yarn Workspaces or PNPM to link packages\
    \ locally, but Rollup's resolver must be conscious of virtualized paths and symlinks.\n\
    \nTo handle monorepos effectively, the following techniques are employed:\n\n\
    # **Workspace Awareness** Rollup's resolver can be augmented with plugins as @rollup/plugin-node-resolve\
    \ configured with preserveSymlinks: true to properly resolve symlinked packages:\n\
    \n```\nimport resolve from '@rollup/plugin-node-resolve';\n\nexport default {\n\
    \  // plugins:\n    resolve({preserveSymlinks: true}),\n    // other plugins...\n\
    \  }\n}\n```\n\nThis ensures that references to workspace packages resolve to\
    \ their original sources rather than their built distributions, enabling immediate\
    \ feedback loops during development.\n\n# **Package-Level Configuration** Each\
    \ package in the monorepo can define rollup configs individually, or a root-level\
    \ configuration can dynamically generate inputs and outputs based on the workspace\
    \ layout. The latter typically leverages Node.js APIs or external tools to programmatically\
    \ discover packages:\n\n```\nimport fs from 'fs';\nimport path from 'path';\n\
    ```\n\n```\nconst packagesDir = path.resolve(__dirname, 'packages');\n\nfunction\
    \ getPackageEntries() {\n  return fs.readdirSync(packagesDir).map(name => path.join(packagesDir,\
    \ name, 'src', 'index.js'));\n}\n```\n\n```\nexport default {\n  input: getPackageEntries(),\n\
    \  output: {\n    dir: 'dist',\n    format: 'esm',\n    preserveModules: true,\n\
    \  },\n  // plugin configuration...\n}\n```\n\nThis strategy combined with preserveModules\
    \ output promotes maintainable codebases with clean mapping between source modules\
    \ and outputs.\n\n# **Aliasing Among Packages** Peer interactions in a monorepo\
    \ often require alias configuration to resolve intra-workspace shared dependencies\
    \ explicitly to source code rather than built artifacts. For example:\n\n```\n\
    alias({\n  entries: [\n    find: '@myorg/package-a', replacement: path.resolve(__dirname,\
