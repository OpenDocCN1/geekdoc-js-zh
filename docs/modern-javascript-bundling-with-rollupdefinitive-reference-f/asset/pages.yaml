  md: "environments, often ES modules or immediately invoked function expression (IIFE),\
    \ with all dependencies included for runtime completeness.\n\nHydration serves\
    \ as the bridge between server-rendered markup and fully interactive client-side\
    \ applications. It rehydrates static HTML by attaching event listeners and restoring\
    \ application state. This is crucial because the server bundle delivers only inert\
