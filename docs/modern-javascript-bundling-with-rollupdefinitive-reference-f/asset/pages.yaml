    This avoids using unused polyfills inadvertently.


    +   **Build-time analysis:** Tools such as Babel presets configure with useBuiltIns
    option enable static analysis of code to automatically inject polyfill imports
    with the target runtime environment.


    +   **CDN and runtime polyfills:** Serving polyfills through a CDN or service
    like polyfill.io can dynamically deliver code only for browsers that need it,
    decreasing initial bundle payload on modern browsers.


    +   **Tree shaking:** Whether polyfill code is modular and side-effect free, modern
    bundlers eliminate unused exports, further reducing final bundle size.


