  md: "# Use Cases for Externalizing Dependencies\n\n+   1. **Library Development**:\
    \ Libraries typically mark peer dependencies as external to prevent bundling versions\
    \ that might conflict with the consuming application's versions. This preserves\
    \ version consistency and avoids code duplication.\n\n+   2. **Microfrontend Architectures**:\
    \ Multiple independently deployed microfrontends share common dependencies. By\
    \ externalizing shared libraries, one can ensure these dependencies are loaded\
    \ once, fostering efficient caching and reducing overhead.\n\n+   3. **Environments\
    \ with Native Modules**: Node.js applications exclude Node's built-in modules\
    \ (e.g., path) by marking them external, as these are resolved at runtime by the\
    \ environment.\n\n# Mechanisms to Mark Dependencies as External\n\nModern bundlers\
    \ expose configuration options to declare modules as external. Below demonstrates\
    \ typical approaches using Rollup configuration:\n\n```\nexport default {\n  input:\
    \ './src/index.js',\n  output: {\n    file: 'dist/bundle.js',\n    format: 'cjs',\n\
    \  },\n  external: ['lodash', 'react']\n};\n```\n\nIn this example, lodash and\
    \ react are specified as external. Rollup will omit bundling them and generate\
    \ calls instead. When the bundle executes, the runtime must provide these modules.\n\
    \nBeyond string arrays, the external key can accept an array of patterns or a\
    \ predicate to function-tune externalization:\n\n```\nexport default {\n  external:\
    \ id => /^babel\\/..test(id)\n};\n```\n\nHere, any dependency matching the regular\
    \ expression is treated as external. This pattern is useful when numerous modules\
    \ in a namespace should be externalized.\n\n# Impact on Output and Module Resolution\n\
    \nMarking dependencies as directly influences both bundle content and the generated\
    \ import/require statements:\n\n+   **ES Modules Output**: External imports remain\
    \ as import statements pointing to the module name or path, relying on host module\
    \ resolution. **CommonJS Output**: Imports are translated into require calls with\
    \ the external module's identifier.\n\nThis design preserves semantic clarity.\
    \ External dependencies are referenced but not included, mandating their presence\
    \ at runtime.\n\n# Handling Peer Dependencies in Package Publishing"
