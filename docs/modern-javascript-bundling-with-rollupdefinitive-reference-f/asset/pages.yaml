  md: "```\nmodule.exports = {\n  optimization: {\n    splitChunks: {\n      cacheGroups:\
    \ {\n        vendors: {\n          test: /\\\\\\/]node_modules\\\\\\/,\n     \
    \     name: 'vendors',\n          chunks: 'all',\n        },\n        features:\
    \ {\n          test: /\\\\\\/]src\\\\\\/]features\\\\\\/,\n          name: 'features',\n\
    \          chunks: 'all',\n          minSize: 20000,\n        }\n      }\n   \
    \ }\n  }\n}\n```\n\nThis configuration separates third-party dependencies into\
    \ a vendors chunk and individual application features into distinct features chunks\
    \ if they meet the size threshold. Manual chunking exports deep knowledge of application\
    \ architecture to optimize load time and caching, but it requires ongoing maintenance\
    \ as the codebase evolves.\n\n**Dynamic Imports** import a more declarative and\
