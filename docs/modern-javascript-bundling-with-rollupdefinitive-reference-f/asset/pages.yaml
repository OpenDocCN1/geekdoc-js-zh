  md: "For images and fonts-static files that are referenced in CSS or JavaScript\
    \ modules-Rollup plugins such as rollup-plugin-url or @rollup/plugin-url allow\
    \ importing files as data URIs or emitting them as separate files depending on\
    \ their sizes. Embedding small files as data URIs reduces HTTP requests but can\
    \ bloat the JS bundle if overused; typically, a limit of 8-10 KB is applied.\n\
    \nExample configuration to handle images and fonts:\n\n```\nimport url from '@rollup/plugin-url';\n\
    \nexport default {\n  plugins: [\n    url({\n      include: ['**/*.svg', '**/*.png',\
    \ '**/*.jpg', '**/*.woff', '**/*.woff2'],\n      limit: 8192, // KB limit for\
    \ inlining\n      emitFiles: true, // Allows files > limit to be copied to output\
    \ dir\n      filename: '[name][hash]' // Naming pattern for emitted files\n  \
    \  })\n  ]\n}\n```\n\nUsing hashed filenames improves cache invalidation by ensuring\
    \ that file names change when content changes. This approach is essential when\
    \ static assets are served by CDNs or aggressive HTTP caching.\n\nWhen combining\
    \ plugin functionalities, the order of plugins in the Rollup configuration matters.\
    \ Processing stylesheets with postcss should come after static asset plugins so\
    \ CSS can correctly reflect emitted image or font assets. For example, referencing\
    \ an image in Sass file:\n\n```\n.logo {\n  background: url('../logo.png') no-repeat\
    \ center;\n  width: 120px;\n  height: 40px;\n}\n```\n\nHere, the image is imported\
    \ through the URL plugin during bundling, adjusting the path appropriately in\
    \ the output CSS. This guarantees asset URLs are accurate and accessible post-build.\n\
    \nFor advanced optimization, integrate postcss with additional PostCSS plugins\
    \ as autoprefixer, which adds necessary vendor prefixes ensuring cross-browser\
    \ compatibility, and cssnano for aggressive CSS minification. This chain is configured\
    \ inside the PostCSS plugin declaration:\n\n```\nimport autoprefixer from 'autoprefixer';\n\
    import cssnano from 'cssnano';\n```\n\n```\npostcss({\n  plugins: [autoprefixer(),\
    \ cssnano()],\n  extract: true,\n  sourceMap: true,\n  use: ['sass']\n});\n```"
