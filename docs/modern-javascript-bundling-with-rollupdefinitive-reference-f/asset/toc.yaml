  - 10.4 与构建工具及包管理器的相互性
- - '###'
  - 与工作区编排器的集成：Turborepo
- - '###'
  - 高级包管理器：pnpm 和 Yarn Plug'n/Play
- - '###'
  - Yarn Plug/nP
- - '###'
  - 大规模仓库的跨工具自动化模式
- - '###'
  - 统一流水线：使用如 'Makefile' 风格的编排器或基于 JavaScript 的运行器（例如 Babel, Nx, Turbapo）来定义构建图，其中
    Rollup 构建与 TypeScript 编译、测试和静态分析协同编排。这些编排器促进了并行执行和增量构建，通过协调 Rollup 与与其他进程最大限地减少延迟。
- - '###'
  - 缓存层：在 Rollup 与其它工具（例如 Babel, TypeScript）之间共享产物 Turborepo 和 Nx 原生支持分布式缓存，涵盖 Rollup
    输出目录和中间构建产物。这防止了冗余的重新编译并加速了开发者的迭代。
- - '###'
  - 自定义流水线：在 monorepo 中，Rollup 插件通常需要感知空间边界。例如，自定义插件可能会替换内部导入端口，或从包管理的锁文件或工作空间清单中注入版本元数据。这种自动化同步确保了构建包和上游部署目标的一致性。
