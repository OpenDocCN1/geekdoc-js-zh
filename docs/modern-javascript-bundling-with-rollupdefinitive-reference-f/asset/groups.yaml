    ## 5.5 Multiple Output Formats: CJS, ESM, UMD, and IIFE\n\nModern JavaScript projects\
    \ often need to support diverse runtime environments and consumption workflows.\
    \ Achieving broad compatibility requires producing builds that target multiple\
    \ formats, each with distinct loading characteristics, interoperability features,\
    \ and deployment scenarios. The primary output formats are CommonJS (CJS), ES\
    \ Modules (ESM), Universal Module Definition (UMD), and Immediately Invoked Function\
    \ Expressions (IIFE). These formats reflect different stages in the evolution\
    \ of JavaScript module systems and vary in terms of browser and server support,\
    \ tree-shaking capabilities, and bundle compatibility.\n\n## CommonJS (CJS)\n\n\
    CommonJS is the module standard traditionally supported by Node.js environments.\
    \ In this format, modules are defined using synchronous require and export objects\
    \ via exports. This synchronous loading paradigm aligns well with server-side\
    \ usage but is ill-suited for browsers without a bundle or loader shim.\n\nA typical\
    \ CJS output in a build tool configuration specifies\n\n```javascript\n{\n  format:\
    \ 'cjs',\n  exports: 'auto',\n  dir: 'dist/cjs'\n}\n```\n\nBecause CJS modules\
    \ are executed immediately and operate synchronously, they do not facilitate static\
    \ analysis. Consequently, modern bundles cannot perform effective tree-shaking\
    \ on CJS outputs, potentially resulting in larger bundles. For server-oriented\
    \ deployments or Node.js CLI tools, CJS remains the most compatible and straightforward\
    \ choice, especially where legacy Node.js versions are concerned.\n\n## ES Modules\
    \ (ESM)\n\nES Modules represent the standardized JavaScript module system introduced\
    \ in 2015. They use import and export statements, enabling static analysis of\
    \ dependencies which in turn facilitate advanced optimizations such as tree-shaking\
    \ and scope hoisting. ESM modules execute asynchronously and support top-level\
    \ await.\n\nA build configuration targeting ESM typically specifies:\n\n```javascript\n\
    {\n  format: 'esm',\n  dir: 'dist/esm',\n  exports: 'named'\n}\n```\n\nESM modules\
    \ can be consumed natively in modern browsers and Node.js versions 12 and above,\
    \ making them the preferred format for web applications and modern JavaScript\
    \ packages. However, earlier Node.js versions or tooling ecosystems not supporting\
    \ ESM may require transpilation or dual publishing alongside CJS.\n\nProduction\
    \ of pure ESM output promotes distribution models that enable efficient client-side\
    \ loading and minimal runtime overhead. However, it necessitates clear package\
    \ metadata, such as the \"module\" field in package.json, to guide bundlers and\
    \ runtimes on module resolution.\n\n## Universal Module Definition (UMD)\n\nUMD\
    \ surfaced as an interoperable format to bridge module loading across browsers\
    \ and Node.js. It wraps the module definition in a factory function that detects\
    \ the environment, loading as AMD, CommonJS, or assigning the exports to a global\
    \ object.\n\nA typical UMD build configuration resembles:\n\n```javascript\n{\n\
    \  format: 'umd',\n  name: 'MyLibrary',\n  file: 'dist/umd/my-library.js',\n \
    \ exports: 'named'\n}\n```\n\nUMD outputs are particularly suitable for libraries\
    \ intended for use directly in browsers via script tags or older environments\
    \ lacking native module support. They offer a single file compatible with multiple\
    \ loaders and global usage contexts. The presence of the name option defines the\
    \ global namespace under which the module exports will be attached.\n\nOne key\
    \ trade-off is that UMD needs to be larger due to wrapper overhead and lack of\
    \ the static analyzability present in ESM, limiting tree-shaking effectiveness.\
    \ Additionally, UMD modules rely on global variables.\n\n## Immediately Invoked\
    \ Function Expression (IIFE)\n\nThe IIFE format encapsulates the module within\
    \ a self-executing function, useful for direct browser inclusion without a module\
    \ loader. A typical IIFE configuration is:\n\n```javascript\n{\n  format: 'iife',\n\
    \  name: 'MyLibrary',\n  file: 'dist/iife/my-library.js'\n}\n```\n\n## Trade-offs\
    \ and Combination Strategies\n\nConsidering the target environments and consumer\
    \ preferences, projects often adopt multi-format publishing to maximize reach:\n\
    \n- **Node.js Applications**: Prefer CJS for backward compatibility.\n- **Browser\
    \ Libraries**: UMD for legacy support and IIFE for simple script inclusion.\n\
    - **Modern Web Applications**: ESM to leverage tree-shaking.\n\nA common pattern\
    \ is to provide both CJS and ESM builds, referencing them in \"main\" and \"module\"\
    \ fields, respectively. This enables Node.js environments to load CJS by default\
    \ while browsers consume the ESM version.\n\n# Summary of Characteristics\n\n\
    | Format | Environment | Loading | Tree-Shaking | Server-side |\n|---|---|---|---|---|\n\
    | CJS | Node.js (legacy) | Synchronous | Limited | Full |\n| ESM | Modern browsers,\
    \ Node.js | Asynchronous | Full | Moderate |\n| UMD | Browsers, Node.js | Conditional\
    \ | Limited | Universal |\n| IIFE | Browsers (script tags) | None (immediate)\
    \ | None | Simple |\n\nIncorporating multiple output formats within a build pipeline\
    \ allows library authors and application developers to address varied ecosystem\
    \ demands without fragmenting the codebase. Understanding the trade-offs between\
    \ module loading behavior, compatibility, optimization potential, and ecosystem\
    \ tooling is essential for effective multi-format publishing and distribution.\n\
    \n## 5.6 Optimizing for Modern Browsers and Edge Delivery\n\nModern browsers have\
    \ evolved significantly, incorporating sophisticated features that enable enhanced\
    \ performance, security, and developer tooling. For applications to fully leverage\
    \ these advancements, it is essential to build processes and delivery strategies\
    \ accordingly. At the same time, the emergence of content delivery networks (CDNs)\
    \ and edge computing infrastructures demands a re-evaluation of traditional deployment\
    \ paradigms to minimize latency and maximize responsiveness. This section explores\
    \ techniques tailored for modern browsers and advanced delivery models, focusing\
    \ on build customization, runtime performance, and the intricacies of edge deployment.\n\
    \n# Tailoring Builds for Browser Capabilities\n"
