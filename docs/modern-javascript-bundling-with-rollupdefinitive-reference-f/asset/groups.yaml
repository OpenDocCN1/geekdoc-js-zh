    # 使用 Rollup 进行现代 JavaScript 打包


    面向开发者与工程师的权威指南


    Richard Johnson


    © 2025 by NOBTREX LLC. 版权所有。

    未经出版者书面许可，不得以任何形式或手段（电子或机械）对本书进行复制、分发或传输。评论或学术批判中的简短引言除外。


    ![](img/f00fffabc7890dab24f64c61c54e268f_1_0.png)


    # 目录


    - 1 JavaScript 打包的演进

    - 1.1 模块化 JavaScript：起源与增长

    - 1.2 从 CommonJS 到 ES Modules

    - 1.3 为什么要打包？性能、可维护性与部署

    - 1.4 JavaScript 生态系统中的打包工具

    - 1.5 现代应用模式

    - 1.6 大规模 JavaScript 应用的挑战


    - 2 Rollup 基础与架构

    - 2.1 Rollup 的设计哲学

    - 2.2 核心概念：输入、输出与插件

    - 2.3 Rollup 流水线

    - 2.4 Rollup CLI 与 API

    - 2.5 Rollup 内部数据结构

    - 2.6 诊断与日志


    - 3 高级配置技术

    - 3.1 rollup.config.js 剖析

    - 3.2 动态与条件性配置

    - 3.3 多入口与多格式输出

    - 3.4 可复用与共享配置

    - 3.5 集成外部工具与脚本

    - 3.6 自定义 CLI 集成


    - 4 插件生态系统与扩展模式

    - 4.1 深度解析：官方插件与社区插件

    - 4.2 开发自定义插件

