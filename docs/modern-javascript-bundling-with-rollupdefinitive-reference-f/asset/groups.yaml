    \n# 外部依赖的概念 (Concept of External Dependencies)\n\n外部依赖指的是被明确排除在包之外并假设在执行环境中可包或模块。通过将依赖标记为外部，打包工具会避免嵌入其代码，从而减小包体积并交由主机环境进行解析。在集成多个包之间共享的大型库，或者运行时（如浏览器或\
    \ Node.js 环境）已经原生提供某些模块时，这种方法是不可或缺的。\n\n# 外部化的使用场景\n\n- 1. **库开发**：库通常将同级依赖（peer\
    \ dependencies）标记为外部，以防止打包可能与消费应用程序版本冲突的版本。这保持了版本一致性并避免了代码重复。\n\n- 2. **微前端架构**：多个独立部署的微前端共享共同依赖。通过外部化共享库，可以确保这些依赖只加载一次，促进高效缓存并减少开销。\n\
    \n- 3. **具有原生模块的环境**：Node.js 应用通过将 Node 的内置模块（例如 `path`）标记为外部来排除它们，因为这些模块在运行时由环境进行解析。\n\
    \n# 将依赖标记为外部的机制\n\n现代打包工具提供了配置选项来声明模块为外部。以下演示了使用 Rollup 配置的典型方法：\n\n```javascript\n\
    export default {\n  input: './src/index.js',\n  output: {\n    file: 'dist/bundle.js',\n\
    \    format: 'cjs',\n  },\n  external: ['lodash', 'react']\n};\n```\n\n在此示例中，lodash\
    \ 和 react 被指定为外部。Rollup 将跳过对它们的打包并改为相应的调用。当包执行时，运行时必须提供这些模块。\n\n除了字符串数组外，`external`\
    \ 键还可以接受模式数组或谓词函数来精细调整外部化逻辑：\n\n```javascript\nexport default {\n  external: id\
    \ => /^babel\\/..test(id)/,\n};\n```\n\n在这里，任何匹配正则表达式的依赖都被视为外部。当命名空间中的许多模块需要外部化时，这种模式非常有用。\n\
    \n# 对输出和模块解析的影响\n\n将依赖标记为外部会直接影响包的内容以及生成的 import/require 语句：\n\n- **ES Modules\
    \ 输出**：外部导入保持为指向模块名或路径的 import 语句，依赖主机的模块解析。\n- **CommonJS 输出**：导入被翻译为带有外部模块标识符的\
    \ require 调用。\n\n这种设计保持了语义的清晰性。外部依赖被引用但未被包含，因此要求在运行时必须存在。\n\n# 在发布发布时处理同级依赖\n\n\
    包清单（`package.json`）通过 `peerDependencies` 定义预期由消费方提供的包。打包工具通过外部化同级依赖来遵循这一概念。\n\
    例如：\n\n```json\n{\n  \"name\": \"my-library\",\n  \"peerDependencies\": {\n  \
    \  \"react\": \"17.0.0\"\n  }\n}\n```\n\n工具会自动将同级依赖与外部配置匹配，确保它们不会进入包中。这种遵循性提升了兼容性并防止了多个版本之间的重复。\n\
    \n# 陷阱与最佳实践\n\n**版本不匹配**：外部化依赖假设运行时环境提供了兼容的版本。预期版本与安装版本之间的偏差可能会导致意外的运行时错误。在多包环境中维护严格的语义版本（semver）和沟通可以降低这种风险。\n\
    \n**打包导入**：引用外部模块的动态导入可能会解析上带来挑战，并需要详尽的包支持或手动干预以维护完整性。\n\n**共享模块的显式导出**：在复杂项目中识别共享依赖需要细致的分析。依赖分析器或构建时可视化等工具可以明确哪些应该是外部的。\n\
    \n**避免过度外部化**：将过多的依赖标记为外部可能会将依赖管理的负担完全转移给消费方，这与简化部署的目标相冲突。\n\n# 与模块格式和环境的互操作\n\
    \n诸如 Node.js、支持原生 ES 模块的浏览器或 webpack 等打包器在解析外部项时表现出不同的行为：\n\n- Node.js 依赖 `node_modules`\
    \ 解析，根据配置支持 CommonJS 和 ES 模块。\n- 浏览器要求外部依赖独立提供，通常通过 CDN 或本地托管。\n\n"
