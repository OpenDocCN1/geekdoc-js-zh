    \ and package robustness across diverse contexts.\n\n# 7.3 Handling Mixed ESM/CJS/Other\
    \ Syntax\n\nModern JavaScript development frequently involves projects that intermix\
    \ multiple module systems, primarily ECMAScript Modules (ESM) and CommonJS (CJS),\
    \ alongside less common or legacy formats such as AMD or global scripts. Bundling\
    \ these heterogeneous codebases into coherent deployable artifacts presents a\
    \ nuanced set of technical challenges, requiring careful attention to interoperability,\
    \ plugin selection, and configuration strategies to ensure both correctness and\
    \ maintainability.\n\nAt the crux of this interoperability challenge lies the\
    \ fundamental difference in module semantics and loading mechanisms. ES Modules\
    \ employ static analysis and tree shaking, while CommonJS modules are dynamic,\
    \ executing imperative code over 'require' with mutable exports. Consequently,\
    \ bundlers must reconcile these discrepancies to produce predictable and performant\
    \ outputs.\n\n# Interoperability seamlessness\n\nAchieving seamless interoperability\
    \ begins with proper recognition and treatment of each module by the bundler.\
    \ Most contemporary bundlers distinguish modules by file extension and /package.json\
    \ 'type' fields, or explicit loader configurations. For an example, .mjs extension\
    \ or 'type':'module' directive signals ESM, .cjs or absence of 'type':'module'\
    \ implies CommonJS.\n\nTo enable compatibility, bundlers often implement specialized\
    \ interop wrappers. For instance, when importing a CommonJS module into an ESM\
    \ context, the bundler may generate synthetic namespace objects where the default\
    \ export corresponds to module.exports, while named exports represent individual\
    \ properties. Conversely, importing ESM into CommonJS necessitates async-aware\
    \ patterns or dynamic 'import()' to maintain semantics and avoid circular dependency\
    \ pitfalls.\n\nAn essential consideration is the handling of 'default' exports\
    \ and module.exports assignments. Misalignment frequently results in runtime errors\
    \ or unexpected namespace shapes. Bundlers typically use heuristics or configuration\
    \ flags to control default interoperability, such as Rollup/plugin-commonjs /defaultModuleExports\
    \ or Webpack's esmodule flag in module.rules. Understanding and tuning these parameters\
    \ can resolve subtle bugs caused by mismatched expectations.\n\n# Plugin Selection\
    \ and Configuration Patterns\n\nThe choice of plugins is pivotal for managing\
    \ mixed module types. Native bundlers like ESBuild or Vite inherently support\
    \ seamless ESM handling but rely heavily on plugins for CJS interpretation. Plugins\
    \ designed specifically for CommonJS are indispensable. For instance, Rollup's\
    \ @rollup/plugin-commonjs is the facto solution for converting CJS to ESM during\
    \ the bundling phase, enabling static analysis and optimization.\n\nPlugin integration\
    \ should be ordered deliberately. Typically, the CommonJS plugin must be applied\
    \ after the node resolution plugin (@rollup/plugin-node-resolve) to ensure dependencies\
    \ are located before transformation. Incorrect order can cause unresolved imports\
    \ or import conflicts.\n\nConfiguration patterns also emphasize explicitness.\
    \ Enabling shape maps for intermediate transforms aids in debugging complex interoperability\
    \ issues. Precise inclusion and exclusion patterns to limit CommonJS wrapping\
    \ only to necessary modules, reducing bundle size and potential overhead. For\
    \ monorepos or multi-package projects, configuring per-package build steps with\
    \ explicit module boundaries can prevent inadvertent module-type mixing.\n\n#\
    \ Handling Other Module Types and Legacy Code\n\nBeyond ESM and CJS, legacy scripts\
    \ or AMD modules necessitate additional accommodations. Bundlers often provide\
    \ dedicated plugins for AMD or SystemJS, enabling their gradual integration without\
    \ wholesale rewrites. Alternatively, shimming legacy globals using plugins or\
    \ manual wrapper modules facilitates incremental modernization.\n\nFor example,\
    \ AMD modules which rely on 'define' and asynchronous loading are converted by\
    \ plugins or loaders that simulate the module definition and registration in the\
    \ target bundler's format. Care must be taken to preserve execution order in dependencies\
    \ with indirect references.\n\nLegacy scripts that pollute the global namespace\
    \ require isolation strategies. Employing bundle scopes or IIFE wrappers encapsulate\
    \ side effects, preventing namespace collisions or order-dependent bugs. This\
    \ is especially critical when mixing third-party libraries distributed in various\
    \ module forms.\n\n# Maintaining Flexibility and Correctness\n\nBalancing flexibility\
    \ with correctness demands disciplined configuration management. Employing explicit\
    \ entry points and spacing modules by directory structures or naming conventions\
    \ clarifies bundle behavior and enhances maintainability. Adopting incremental\
    \ migration, where legacy or CommonJS modules are progressively converted to ESM\
    \ supports eventual unification on a modern standard without disrupting functionality.\n\
    \nRigorous integration testing is indispensable. Verify runtime behavior with\
    \ both production and development builds, scenarios involving dynamic imports,\
    \ circular dependencies, and namespace imports. Observing warning logs and enabling\
    \ diagnostic output from plugins helps identify incompatible constructs.\n\nTo\
    \ illustrate, consider a Rollup-based project mixing ESM and CJS dependencies:\n\
    \n```javascript\nimport resolve from '@rollup/plugin-node-resolve'\nimport commonjs\
    \ from '@rollup/plugin-commonjs';\n\nexport default {\n  input: './src/index.js',\n\
