    结合 Cache API 使用 IndexedDB 可以优化检索时间，并支持数据新鲜性的后台同步。\n\n## HTTP/2 与 HTTP/3 协议特性\n\
    现代浏览器通过支持多路复用、头部压缩和服务器推送的协议进行通信。必须配置服务器基础设施以最大化 HTTP/2 或 HTTP/3 的优势，例如并行提供较小资源而不会产生多个\
    \ TCP 连接。此外，服务器推送（Server Push）可以在浏览器请求之前主动发送关键资源，从而减少延迟：\n\n```http\nhttp2_push\
    \ /styles/main.css;\nhttp2_push /scripts/runtime.js;\n```\n\n## 关键渲染路径优化\n通过资源优先级排序和消除阻塞渲染的资产来分析并减少关键渲染路径，可以显著缩短交互时间（TTI）。提取并内联关键\
    \ JavaScript 脚本，可以缩短页面加载时间，特别是在计算能力有限的移动设备上。\n\n## 高级交付模型：CDN 与边缘部署\n\n虽然现代浏览器提供了客户端优化，但服务器端从根本上塑造了用户体验。CDN\
