    \n## 5.5 多输出格式：CJS, ESM, UMD 和 IIFE\n\n现代 JavaScript 项目通常需要支持不同的运行时环境和消费工作流。实现广泛的兼容性需要生成针对多种格式的，每种格式都有独特的加载特性、互操作功能和部署场景。主要的输出格式有\
