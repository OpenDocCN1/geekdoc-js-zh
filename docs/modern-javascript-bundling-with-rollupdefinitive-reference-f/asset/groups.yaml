    # 10.1 浏览器和 Node.js 中的原生 ESM


    浏览器和 Node.js 中原生 ECMA Script 模块 (ESM) 的出现标志着现代 JavaScript 开发格局的重大转变。从历史上看，模块系统和打包器在为库和应用程序构建、优化和交付
    JavaScript 代码方面起着不可缺的作用。然而，随着浏览器和 Node.js 现在支持原生 ESM，这些工具背后的原理和架构正在经历重大评估。


    浏览器最初缺乏任何内置模块系统，主要依赖全局作用域和脚本竞争。开发者采用了 RequireJS (AMD) 和 CommonJS 等库来使 JavaScript
    现代化，这些都在原生支持之前模拟模块范式。尽管这些系统有效，但它们需要 Webpack、Rollup 和 Parcel 等打包器来生成紧凑且高效的单个或少量包。打包器擅长处理复杂的相互依赖关系、转换模块语法，并通过树摇优化（tree-shaking）、代码分割和资源内联来优化交付。


    直接在浏览器中引入原生 ESM 支持（在现代 Chrome、Firefox、Edge 和 Safari 版本中实现），允许使用由环境本身解释和管理的标准化、声明式模块语法。随后是
    `<script type="module">` 标签。以这种方式执行的模块默认开启严格模式，具有顶层导入和导出语句，并且在异步获取的同时根据依赖关系维持执行顺序。考虑嵌入
    HTML 页面中的以下代码片段：


    ```

    <script type="module">

    import { greet } from ''./greeting.js'';

    greet(''World'');

    </script>

    ```


    浏览器将把 greeting.js 作为 ES 模块加载，解析其导出，并自主执行导入序列。


    原生支持扩展到相对于文档解析模块规范，支持 HTTP/HTTPS 协议和对模块脚本响应的严格 MIME 类型检查。这种原生集成简化了开发工作流，允许未打包或轻量打包的部署策略，提高了了缓存粒度，并通过保留模块边界改进了调试。开发者现在可以交付模块化的库和应用程序，而不必在构建时始终依赖于大的打包步骤，特别是在开发或对性能不敏感的场景下。


    在 Node.js 侧，由于其根深蒂固的 AngularJS (JS) 模块系统和服务器端限制，向 ESM 的演进更为缓慢且复杂。从 Node.js 版本
    12（以及 14 及以上版本的 LTS）开始，通过特性标志以及后的完全取消引入了对 ES 模块的原生支持。与浏览器不同，Node.js 采用双模块系统，通过文件扩展名和
    `package.json` 元数据识别模块。具有 .js 扩展名或在 `package.json` 中 `type="module"` 的文件被视为 ESM，而
    `.cjs` 和默认的 `.js`（无包设置）被视为 CommonJS。


    Node.js ESM 加载器根据标准导入机制解析并执行模块，支持模块加载、通过静态分析暴露的树摇能力，以及通过桥接 API 与 CommonJS 模块协作。Node.js
    中的新模块加载器允许应用程序逐步迁移到 ESM 或使用混合方法，但初始挑战包括 `__dirname`、`require()` 和动态导入的语义差异。


    打包器在 Node.js 中继续具有价值，特别是通过合并依赖项、最小化负载大小以及启用填充（（polyfilling）和压缩化等高级转换来优化生产应用程序。然而，原生
    ESM 日益受到接受减少了开发周期中打包的必要性，实现了更快的迭代和更透明的代码执行模型。


    原生 ESM 支持对打包器的影响可以从几个维度进行总结。首先，打包器正在从强制工具转变为可选的性能和兼容性增强器。原生 ESM 构建的简化模块图使包更加专注于高级资源管理——处理
    CSS 等。其次，原生 ESM 实现了精确的 HTTP 缓存，因为模块是逐个获取的，允许浏览器单独缓存模块并在发布期间仅更新增量。第三，原生 ESM 提供了更清晰的关注点分离；库可以直接发布供终端用户和工具链直接使用的
    ES 模块，而无需经过转换。


    现代打包器已采用将原生 ESM 同时作为输入和输出格式。它们现在接受 ES 模块作为输入而无需额外转换，并尽可能输出保留 ESM 语义的包，改进了与原生环境的互操作性。这种转变还催了通过原生
    ESM 异步模块加载实现的细粒度代码分割能力的改进，优化了启动性能和带宽使用。

