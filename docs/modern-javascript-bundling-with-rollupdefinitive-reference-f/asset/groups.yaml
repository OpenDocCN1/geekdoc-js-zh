    \ 构建流水线，提升了不同场景下的开发者生产力和包健壮性。\n\n# 7.3 处理混合 ESM/CJS/其他语法\n\n现代 JavaScript 开发经常涉及混合多种模块系统的项目，主要是\
    \ ECMAScript 模块 (ESM) 和 CommonJS (CJS)，以及不常见或旧的格式（如 AMD 或全局脚本）。将这些异构代码库打包成一致的可部署产物面临着一系列细微的技术挑战，需要注意互操作性、插件选择和配置策略，以确保正确性和可维护性。\n\
    \n这种互操作性挑战的核心在于模块语义和加载机制的根本差异。ES Modules 使用静态分析和树摇优化，而 CommonJS 模块是动态的，通过 'require'\
    \ 执行命令式代码并带有可变导出。因此，打包工具必须协调这些差异，以产生可预测且高性能的输出。\n\n# 互操作无无缝\n\n实现无缝互操作始于打包工具对每个模块的正确识别和处理。大多数现代打包工具通过文件扩展名和\
    \ `/package.json` 中的 'type' 字段或显式的加载器配置来区分模块。例如，`.mjs` 扩展名或 `'type':'module'`\
    \ 指令表示 ESM，`.cjs` 或缺失 `'type':'module'` 则意味着 CommonJS。\n\n为了实现兼容性，打包工具通常会实现专门的互操作包装器。例如，当在\
    \ ESM 上文中导入 CommonJS 模块时，打包工具可能会生成合成命名空间对象，其中默认导出对应于 `module.exports`，而命名导出则代表单个属性。相反，将\
    \ ESM 导入 CommonJS 则需要感知异步的模式或动态 `'import()'` 以保持语义并避免循环依赖的陷阱。\n\n一个关键的考虑因素是对 'default'\
    \ 导出和 `module.exports` 赋值的处理。不匹配经常会导致运行时错误或意外之外的命名空间结构。打包工具通常使用启发式方法或配置标志来控制默认互操作性，例如\
    \ Rollup/`plugin-commonjs` 的 `defaultModuleExports` 或 Webpack 在 `module.rules`\
    \ 中的 `esmodule` 标志。理解并调整这些参数可以解决由预期不匹配引起的细微算术。\n\n# 插件选择与配置模式\n\n插件的选择对于管理混合模块类型至关重要。像\
    \ ESBuild 或 Vite 这样的原生打包工具固有支持无缝的 ESM 处理，但严重依赖插件来解释 CJS。专门为 CommonJS 设计的插件是必不可少的。例如，Rollup\
    \ 的 `@rollup/plugin-commonjs` 是打包阶段将 CJS 转换为 ESM 的事实解决方案，能够实现静态分析和优化。\n\n插件的集成应该有选择地安排顺序。通常，CommonJS\
    \ 插件必须在节点解析插件（`@rollup/plugin-node-resolve`）之后应用，以确保在转换之前定位依赖。顺序错误可能导致未解析的导入或导入冲突。\n\
    \n配置模式也强调显式化。为中间转换启用形状映射（shape maps）有助于调试复杂的互操作问题。通过精确的包含和排除模式将 CommonJS 包装限制在必要的模块中，从而减小包大小和潜在的开销。对于单体仓库或多包项目，通过显式的模块边界配置每个包的构建步骤可以防止意外的模块类型混合。\n\
    \n# 处理其他模块类型和旧代码\n\n除了 ESM 和 CJS 之外，遗留脚本或 AMD 模块还需要额外的适应。打包工具通常为 AMD 或 SystemJS\
    \ 提供专用插件，允许其渐进集成而无需全盘重写。或者，使用插件或手动包装模块对遗留全局变量进行填充（shimming），有助于实现渐进现代化。\n\n例如，依赖\
    \ 'define' 和异步加载的 AMD 模块由插件或加载器转换，这些工具会在目标打包器的格式中模拟模块定义和注册。在具有间接引用的依赖中，必须注意保持执行顺序。\n\
    \n污染全局命名空间的遗留脚本需要隔离策略。使用包范围（scopes）或 IIFE 包装器封装副作用，防止命名空间冲突或依赖顺序的错误。当混合以各种模块形式分发的第三方库时，这一点尤为关键。\n\
    \n# 维护灵活性与正确性\n\n平衡灵活性与正确性需要规范的配置管理。使用显式入口点并根据目录结构或命名约定对模块进行划分可以明确打包行为并增强可维护性。采用增量迁移（将遗留或\
    \ CommonJS 模块逐步转换为 ESM）支持在不破坏功能的情况下统一到现代标准。\n\n严格的集成测试是必不可少的。在生产和开发构建中验证运行时行为，包括涉及动态导入、循环依赖和命名空间导入的情况。观察警告日志并启用诊断输出有助于识别不兼容的结构。\n\
    \n为了说明，考虑一个混合了 ESM 和 CJS 依赖的 Rollup 项目：\n\n```javascript\nimport resolve from\
    \ '@rollup/plugin-node-resolve'\nimport commonjs from '@rollup/plugin-commonjs';\n\
    \nexport default {\n  input: './src/index.js',\n  output: {\n    file: 'dist/bundle.js',\n\
    \    format: 'esm',\n    sourcemap: true\n  },\n  plugins: [\n    resolve({\n\
    \      extensions: ['.mjs', '.js', '.cjs']\n    }),\n    commonjs({\n      include:\
    \ 'node_modules/**',\n      defaultIsModuleExports: true\n    })\n  ]\n};\n```\n\
    \n这种模式确保解析器能够正确定位混合模块文件，而 CommonJS 插件将 CJS 依赖转换为兼容 ESM 的格式，将 `module.exports`\
    \ 视为默认导出。\n\n"
