  - "[PAGE 95]\n\n# Chapter 5\nModule Resolution, Code Splitting, and Tree Shaking\n\
    \nEfficient delivery of modern JavaScript depends on smart decisions about what's\
    \ included, excluded, and how code is organized as bundles. This chapter takes\
    \ you behind the curtain to explore how Rollup utilizes dependency graphs, slices\
    \ code into optimal chunks, and eliminates dead weight—supporting flexible delivery\
    \ strategies from libraries to cutting-edge apps. Del into fine-grained control\
    \ over your builds and discover the techniques that separate fast, lean applications\
    \ from the rest.\n\n# 5.1 Advanced Module Resolution\n\nRollup's module resolution\
    \ process serves as a foundational mechanism to locate and bundle JavaScript and\
    \ TypeScript modules into optimized output. While Rollup's default efficiently\
    \ handles standard ES modules, complex project requirements—such as aliasing,\
    \ multi-entry packages, and monorepo structures—necessitate a more customizable\
    \ approach. This section delves into advanced configuration strategies for controlling\
    \ module resolution within Rollup, enabling flexibility and maintainability in\
    \ diverse codebases.\n\n# Aliasing Modules\n\nAliasing enables the mapping of\
    \ import paths to alternative locations or modules, which is vital for simplifying\
    \ import statements and overriding default dependencies. Common use cases include\
    \ redirecting or deeply nested imports to simpler, flatter paths, or substituting\
    \ mocks or shims during development and testing.\n\nRollup achieves aliasing through\
    \ the @rollup/plugin-alias plugin. The configuration involves mapping namespace\
    \ strings to absolute or relative paths. For example:\n\n```\nimport alias from\
    \ \"@rollup/plugin-alias\";\nimport path from 'path';\n\nconst projectRoot = path.resolve(__dirname,\
    \ 'src');\n\nexport default {\n  // ...\n  plugins: [\n    alias({\n      entries:\
    \ {\n        { find: '@components', replacement: path.resolve(projectRoot, 'components')\
    \ },\n        { find: '@utils', replacement: path.resolve(projectRoot, 'utils')\
    \ },\n      }\n    })\n  ]\n};\n```\n\nThis setup allows imports such as import\
    \ Button from '@components/Button', resolving\\ directly to src/components/Button.\
    \ The aliasing system supports exact string matches, regular expressions, and\
    \ multiple entries, granting granular control.\n\n# Handling Peer Dependencies"
  - "[PAGE 96]\n\nPeer dependencies present a nuanced challenge for module resolution\
    \ because they are expected to be provided by the consumer of a package, not bundled.\
    \ Rollup excludes peer dependencies by default through the external option, which\
    \ marks specific modules to be left as external imports in the final bundle.\n\
    \nA practical pattern involves reading peerDependencies from a package's package.json\
    \ and dynamically mapping all listed peers as external:\n\n```\nimport peerDeps\
    \ from 'rollup-plugin-peer-deps-external';\n\nexport default {\n  // ...\n  plugins:\
    \ [\n    peerDeps(),\n    // other plugins...\n  ]\n};\n```\n\nThe rollup-plugin-peer-deps-external\
    \ automates this process, ensuring that peer dependencies are neither resolved\
    \ nor in the build step. This method preserves semantic versioning boundaries\
    \ and avoids duplication of shared dependencies, which is critical for libraries\
    \ distributing packages on npm.\n\n# Supporting Multiple Package Entry Points\n\
    \nSophisticated libraries export multiple entry points to facilitate modular consumption\
    \ and reduce bundle size for consumers. A single package may designate a primary\
    \ entry point and secondary named exports or submodules, commonly defined in the\
    \ \"exports\" field of package.json.\n\nRollup does not intrinsically support\
    \ multi-entry output; however, the @rollup/plugin-multi-entry plugin or configuration\
    \ of multiple build inputs provides a pathway:\n\n```\nexport default {\n  input:\
    \ ['src/index.js', 'src/utils/index.js'],\n  output: {\n    dir: 'dist',\n   \
    \ format: 'esm'\n  },\n  // other configuration...\n};\n```\n\nThis approach builds\
    \ bundles for each entry point, preserving logical module boundaries. In conjunction\
    \ with namespace exports via index files and re-exporting, users receive fine-grained\
    \ control over module import granularities.\n\nManaging different entry points\
    \ also requires consistent module resolution across shared dependencies to prevent\
    \ code duplication. Configuring the external option judiciously, particularly\
    \ when secondary entry points access common internals, preserves bundle optimization.\n\
    \n# Monorepo Project Structures\n\nMonorepos-repositories managing multiple packages\
    \ within a single repository-introduce particular module resolution challenges\
    \ due to interdependencies and package isolation."
