    \n## # Chapter 8\nIntegrating Non-JavaScript Assets and Universal Applications\n\
    \nJavaScript is only part of the story when building sophisticated applications—assets\
    \ like stylesheets, images, and even custom elements are just as critical. Whether\
    \ you're targeting browsers, servers, or multi-platform apps, managing these resources\
    \ gracefully is key to a seamless experience. This chapter pulls back the curtain\
    \ on how Rollup integrates a world of assets, supporting everything from framework-agnostic\
    \ components to server-side rendering and dynamic deployments.\n\n## ## 8.1 Stylesheets,\
    \ Images, and Static Files\n\nEffective management of stylesheets, images, fonts,\
    \ and other static assets is critical to building maintainable, high-performance\
    \ web applications. When using Rollup as a module bundler, integrating these assets\
    \ alongside JavaScript requires understanding specialized plugins, proper configuration,\
    \ and optimization strategies to ensure cohesive output and streamlined development\
    \ workflows.\n\nCSS and Sass (SCSS) are typically imported directly into JavaScript\
    \ modules to enable scoped, modular styling. Rollup design is optimized for JavaScript\
    \ and ES modules; managing stylesheets demands external plugins such as rollup-plugin-postcss,\
    \ which combines CSS processing, bundling, and injection capabilities. This plugin\
    \ supports importing CSS and SASS files seamlessly and can be configured with\
    \ PostCSS processors to enable autoprefixing, minification, and custom transformations.\n\
    \nA minimal configuration snippet to handle SASS files looks like this:\n\n```javascript\n\
    import postcss from 'rollup-plugin-postcss';\n\nexport default {\n  input: 'src/main.js',\n\
    \  output: 'dist/bundle.js',\n  format: 'esm',\n  plugins: [\n    postcss({\n\
    \      extensions: ['.css', '.scss'],    // Extract CSS to a separate file\n \
    \     extract: true,\n      minimize: true,                               // Minify\
    \ the resulting CSS\n      sourceMap: true,\n      use: ['sass']\n    ])\n  ]\n\
    };\n```\n\nHere, the extract option generates a separate CSS file rather than\
    \ injecting styles inline in JavaScript, which is preferred in production for\
    \ better caching and performance. By enabling minimize and source maps, the outputted\
    \ CSS is both compact and debuggable, aligning with best practices.\n\nFor images\
    \ and fonts—static files that are referenced in CSS or JavaScript modules—Rollup\
    \ plugins such as rollup-plugin-url or @rollup/plugin-url allow importing files\
    \ as data URIs or emitting them as separate files depending on their sizes. Embedding\
    \ small files as data URIs reduces HTTP requests but can bloat the JS bundle if\
    \ overused; typically, a limit of 8-10 KB is applied.\n\nExample configuration\
    \ to handle images and fonts:\n\n```javascript\nimport url from '@rollup/plugin-url';\n\
    \nexport default {\n  plugins: [\n    url({\n      include: ['**/*.svg', '**/*.png',\
    \ '**/*.jpg', '**/*.woff', '**/*.woff2'],\n      limit: 8192, // KB limit for\
    \ inlining\n      emitFiles: true, // Allows files > limit to be copied to output\
    \ dir\n      filename: '[name][hash]' // Naming pattern for emitted files\n  \
    \  })\n  ]\n}\n```\n\nUsing hashed filenames improves cache invalidation by ensuring\
    \ that file names change when content changes. When combining plugins, the order\
    \ of plugins matters. Processing stylesheets with postcss ensures, for example:\n\
    \n```css\n.logo {\n  background: url('../logo.png') no-repeat center;\n  width:\
    \ 120px;\n  height: 40px;\n}\n```\n\nFor advanced optimization, integrate postcss\
    \ with additional plugins as autoprefixer, which adds necessary prefixes, and\
    \ cssnano for aggressive minification.\n\n```javascript\nimport autoprefixer from\
    \ 'autoprefixer';\nimport cssnano from 'cssnano';\n```\n\n```javascript\npostcss({\n\
    \  plugins: [autoprefixer(), cssnano()],\n  extract: true,\n  sourceMap: true,\n\
    \  use: ['sass']\n});\n```\n\nFonts often require special handling due to varying\
    \ formats and licensing constraints. When importing fonts through CSS, ensure\
    \ corresponding formats are included in the asset plugin. Consider subsetted font\
    \ files to reduce payloads and dynamic loading strategies for non-critical fonts\
    \ to further enhance performance. Image optimization can be automated within the\
    \ build pipeline. \n\nIn summary, managing stylesheets, images, fonts, and other\
    \ static files alongside JavaScript in Rollup hints the use of dedicated plugins\
    \ configured for modular and performance. Extracting styles into separate files\
    \ with source maps, inlining small assets for fewer requests, utilizing hashed\
    \ filenames for caching, and employing PostCSS-based transformations collectively\
    \ yield maintainable and performant frontend.\n\n## 8.2 Web Components and Custom\
    \ Elements\n\nWeb Components constitute a suite of standardized technologies that\
    \ enable the creation of reusable\n\nThe foundation for building Custom Elements\
    \ is the HTMLElement class in the DOM API. Defining a custom element requires\
    \ extending this base class and implementing lifecycle callbacks such as connectedCallback,\
    \ disconnectedCallback, attributeCallback, and adoptedCallback. This architecture\
    \ supports the monitoring and management of an element's presence in the DOM:\n\
    \n```javascript\nclass MyElement extends HTMLElement {\n  constructor() {\n  \
    \  super();\n    // Attach shadow root for encapsulation\n    this.attachShadow({mode:\
    \ 'open'});\n  }\n\n  connectedCallback() {\n    this.shadowRoot.innerHTML = '<p>Hello,\
    \ Custom Element!</p>';\n  }\n}\n\ncustomElements.define('my-element', MyElement);\n"
