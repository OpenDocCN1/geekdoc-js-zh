    高级包通过树摇优化（Tree Shaking）移除死代码，从而显著减小包体积。代码分割允许关键代码立即加载，同时延迟不重要的代码。此外，动态 `import()`\
    \ 语法允许按需加载模块，从而增加了初始加载时间：\n\n```javascript\nbutton.addEventListener('click', async\
