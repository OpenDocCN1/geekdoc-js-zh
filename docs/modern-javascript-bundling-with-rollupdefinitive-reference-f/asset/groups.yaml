    \ bundles.\n\n**Shared Constants and Utilities** Frequently used paths, file extensions,\
    \ and helper functions are extracted into separate utility files, creating a single\
    \ source of truth and simplifying updates.\n\n# **Conventions Promoting Clarity\
    \ and Maintainability**\n\nAdopting conventions in naming, structure, and commenting\
    \ reduces cognitive load on developers and improves collaboration across all teams:\n\
    \n**Consistent Naming** Using clear and consistent names for variables, plugins,\
    \ environment flags, and output builds enhances navigability. Prefixes like isProd\
    \ or isDev explicitly communicate build contexts.\n\n**Lazy Evaluation and Dynamic\
    \ Configuration** When configuration depends on runtime context, exporting a function\
    \ instead of a plain object helps:\n\n```\nexport default commandLineArgs => {\n\
    const isProduction = commandLineArgs.configProduction;\n\nreturn {\n  input: 'src/main.js',\n\
    \  output: {\n    file: isProduction ? 'dist/bundle.min.js' : 'dist/bundle.js',\n\
    \    format: 'es',\n    sourcemap: isProduction\n  },\n  plugins: createPlugins(isProduction)\n\
    };\n}\n```\n\nThis method leverages Rollup's ability to interpret configuration\
    \ as a function, giving maximum flexibility while avoiding duplication."
