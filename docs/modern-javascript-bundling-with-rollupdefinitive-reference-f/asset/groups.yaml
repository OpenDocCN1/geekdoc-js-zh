    \ true\n  },\n  plugins: [\n    resolve({\n      extensions: ['.mjs', '.js', '.cjs']\n\
    \    }),\n    commonjs({\n      include: 'node_modules/**',\n      defaultIsModuleExports:\
    \ true\n    })\n  ]\n};\n```\n\nThis pattern ensures the resolver properly locates\
    \ mixed module files, while the CommonJS plugin transforms CJS dependencies into\
    \ an ESM-compatible format, treating 'module.exports' as the default export.\n"
