    \n## 9.4 发布管理与版本控制\n\n有效的发布管理和版本控制是健壮软件交付线的关键组件，特别是当使用 Rollup 构建库和应用程序时。这些实践确保了每次发布都是一致、可靠且透明的，允许开发者和用户准确跟踪更改并维护跨版本的兼容性。在\
    \ Rollup 工作流中集成版本方案、自动生成更新日志和发布流程，可以提高软件分发的整体生产力和质量。\n\n### 健壮的版本方案\n\n语义版本（SemVer）是库和应用程序版本控制的事实标准。SemVer\
    \ 采用三部分版本标识：MAJOR.MINOR.PATCH。每个组件的增加都传达了重要性：\n\n- MAJOR 版本：发生兼容的 API 更改时增加。\n\
    - MINOR 版本：发生向后兼容的功能新增时增加。\n- PATCH 版本：发生向后兼容的错误修复时增加。\n\n正确集成 SemVer 有助于依赖管理和兼容性保证。使用\
    \ Rollup 时，版本号通常定义在中心元数据文件（例如 `package.json`）中，它是发布的真实事实来源。\n\n为了自动化版本增量，可以集成\
    \ standard-version、semantic-release 和 changets 等工具。例如，semantic-release 分析根据 Conventional\
    \ Commit 规范结构化的提交消息，以根据条件更新版本号并触发后续的发布步骤。这种集成可以通过在持续集成（CI）工作流中配置发布插件来实现。\n\n##\
    \ 自动生成更新日志\n\n更新日志提供了发布版本之间更改的高级摘要，对于开发者和终端用户都至关重要。手动维护更新日志容易出错且繁琐。自动化确保了更新日志能够准确反映代码库的演进并与版本号保持一致。\n\
    \n像 conventional-changelog 等工具遵循严格的消息约定（例如 `feat; fix:`）提取提交历史，并将其转换为格式化的更新日志。与\
    \ semantic-release 配合使用时，更新日志更新将随新版本自动发布。\n\nRollup 工作流中典型的自动生成更新日志脚本可以集成到 `package.json`\
    \ 脚本中：\n\n```json\n\"scripts\": {\n  \"changelog\": \"conventional-changelog -p\
    \ angular -i CHANGELOG.md -s\"\n}\n```\n\n该命令根据遵循 Angular 预设的提交历史生成或更新 CHANGELOG.md，兼容绝大多数\
    \ Conventional Commit 消息样式。\n\n### 将版本控制集成到 Rollup 构建中\n\n虽然 Rollup 的主要职责是打包 JavaScript\
    \ 和相关资源，但将版本信息直接嵌入输出产物中可以增强可追溯性。这可以通过向构建文件注入版本常量或横幅注释（banner）来实现。\n\nRollup 配置中的\
    \ `banner` 属性允许附加包含版本号、构建日期和作者等元数据的注释。例如：\n\n```javascript\nimport pkg from './package.json';\n\
    \nexport default {\n  input: 'src/index.js',\n  output: {\n    file: 'dist/bundle.js',\n\
    \    format: 'esm',\n    banner: `/*! ${pkg.name} v$${pkg.version} | (c) 2024\
    \ MyCompany | Released under MIT License */`,\n  },\n  plugins: [\n    // ...other\
    \ plugins\n  ]\n}\n```\n\n在发布的包中嵌入版本细节有助于调试、支持审计追踪并提高用户对发布真实性的信心。\n\n## 自动化发布流程\n\
    \n自动化发布过程可以减少人为错误、加快发布频率并确保跨环境的一致性。以 Rollup 为中心的项目通常将包发布到 npm 或制品存储库。\n\n典型的自动化发布工作流涉及在\
    \ CI/CD 流水线执行以下步骤：\n\n1. 使用 Rollup 运行测试。\n2. 根据提交历史增加版本号。\n3. 生成或更新更新日志。\n4. 提交任何生成的文件（CHANGELOG.md、版本更新）。\n\
    5. 发布新包版本。\n\n集成 semantic-release 等工具可以封装这些步骤。使用 GitHub Actions 语法的最小示例如下：\n\n\
    ```yaml\nname: Release\n\non:\n  push:\n    branches:\n      - main\n\njobs:\n\
    \  release:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v3\n\
    \      - name: Setup Node.js\n        uses: actions/setup-node@v3\n        with:\n\
    \          node-version: 16\n          registry-url: https://registry.npmjs.org/\n\
    \      - name: Install dependencies\n        run: npm install\n      - name: Run\
    \ build\n        run: npm run build\n      - name: Semantic Release\n        env:\n\
    \          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}\n          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN\
    \ }}\n        run: npx semantic-release\n```\n\n此工作流会自动检测新更改，分析它们以确定发布类型，更新版本和更新日志文件，提交这些更改，并在无需人工干预的情况下将包发布到\
    \ npm。\n\n"
