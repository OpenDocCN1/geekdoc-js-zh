    interfaces enables developers to optimize their build processes and seamlessly
    integrate Rollup into diverse development environments.


    The Rollup CLI offers a user-friendly command-line tool that encapsulates most
    bundling operations. It is ideal for quick builds, prototyping, and integration
    with existing shell scripts or package.json scripts. The canonical usage of the
    CLI involves invoking the rollup command followed by entry file(s) and various
    flags to customize output and behavior.


    Typical CLI usage to bundle a single entry module might look like this:


    ```

    rollup src/main.js --file dist/bundle.js --format iife

    ```


    Here, src/main.js is the entry point, the bundled output is written to dist/bundle.js,
    and the output format is set to Immediately-Invoked Function Expression (IIFE)
    suitable for direct use in browsers.


    The CLI supports a rich set of options to control external dependencies, enable
    source maps, manage plugins, and specify output formats such as esm, cjs, and
    umd. Flags like --watch enable file watching to trigger incremental rebuilds,
    facilitating efficient development cycles.


    For example, to enable source maps and watch files continuously:


    ```

    rollup -c --sourcemap --watch

    ```


