    \ bundle 避免针对浏览器的 CSS 提取插件。（此处原文存在重复逻辑）\n\nElectron 项目由两个进程组成：管理操作系统交互的进程进程，以及一个或多个渲染进程，后者在\
    \ Chromium 中执行代码。每个进程都需要定制的 Rollup 工作流，以反映不同的运行时环境和 API 依赖。主进程在 Node.js 上运行并访问原生模块，而渲染进程则像浏览器环境一样，通过\
    \ Electron 的 IPC（进程间通信）访问原生 API。\n\n### 主进程的 Rollup 配置\n\n主进程需要打包目标 Node.js 的代码，通常采用\
    \ CommonJS 或 ES 模块格式，同时外部化原生依赖以防止包体积膨。Rollup 的 `external` 选项在这里至关重要，用于排除 Node.js\
    \ 内置模块和如 `electron`、`fs`、`path` 等原生模块，确保在运行时正确引用。\n\n```javascript\nexport default\
    \ {\n  input: 'src/main/index.js',\n  output: {\n    file: 'dist/main.js',\n \
    \   format: 'cjs', // Node.js 环境\n  },\n  external: [\n    'electron',\n    'fs',\n\
    \    'path',\n    // 其他原生模块\n  ],\n  plugins: [\n    // 支持 CJS 模块的 CommonJS 插件\n\
    \    commonjs(),\n    // 在 node_modules 中定位模块的 Node 解析插件\n    nodeResolve({ preferredBuiltins:\
    \ true, babelHelpers: 'bundled' })\n  ]\n};\n```\n\n`nodeResolve` 中的 `preferredBuiltins:\
    \ true` 允许 Rollup 在解析 Node.js 内置模块时将其替换为浏览器兼容的 shim，这对于原生模块正确运行非常重要。\n\n### 渲染进程的\
    \ Rollup 配置\n\n渲染进程打包目标浏览器环境的代码，使用 ES 模块或 IIFE 格式。这种配置启用了以 Web 为中心的优化，如代码分割、CSS\
    \ 提取和资源内联。由于渲染进程可以通过 ipcRenderer 与主进程交互，必须仔细考虑将 `electron` 模块标记为外部以防止打包必要的代码。\n\
    \n```javascript\nexport default {\n  input: 'src/renderer/main.js',\n  output:\
    \ {\n    file: 'dist/renderer.js',\n    format: 'esm',\n    sourcemap: true\n\
    \  },\n  external: ['electron'],\n  plugins: [\n    nodeResolve(),\n    commonJS(),\n\
    \    postcss({ extract: true, minimize: true }),\n    terser(), // 用于代码压缩\n  ]\n\
    };\n```\n\n这种设置利用 PostCSS 进行高级 CSS 处理——提取样式表并应用优化——以及使用 Terser 进行激进压缩。还可以通过如 `url`\
    \ 的 Rollup 插件启用小型图像或字体的内联支持，从而减少渲染进程中的 HTTP 请求。\n\n### 资源打包与原生集成\n\n跨平台一致性必须仔细管理资源（图像、字体、静态文件），以确保无论目标平台如何保持一致。`rollup-plugin-url`\
    \ 和 `rollup-plugin-copy` 等 Rollup 插件便于将小资源嵌入 base64 URL 或将静态存储拷贝到输出目录。\n\nElectron\
    \ 的原生集成需要特别关注原生 API 或外部系统库。打包原生模块（例如 SQLite、串口库）可能会由于平台特定的二进制文件和 ABI 不匹配导致问题。被接受的最佳实践是将这些原生模块视为外部依赖，并使用\
    \ Electron 的打包格式将其与应用包一同包含。\n\n此外，在渲染进程和维护进程中执行的预加载脚本通常需要专用 Rollup 配置来生成权限限制的构建版本。\n\
    \n### 性能优化策略\n\n优化性能始于树摇、代码分割和压缩。通过消除死代码，开发者可以减小包体积。感知上下文的代码路径区分了执行环境，允许实现同构代码库。\n\
    \n### 集成考虑总结\n\n- **每个上下文分离 bundle**：确保进程之间的模块化和隔离。\n-   **外部化原生模块**：通过将它们标记为外部来防止打包原生依赖。\n\
    - **优化渲染进程**：利用树摇、代码分割和压缩提升性能。\n- **资源管理**：对小型资源使用内联，对较大资源使用拷贝。\n- **通过预加载脚本实现安全**：配置权限范围化的构建版本以管理访问。\n\
    \n## 8.5 微前端和模块化部署\n\n现代应用不仅在功能和用户群方面需要扩展性，在开发和部署方面也是如此。微前端和模块化部署已成为基本的架构模式，通过允许独立部署、以团队为导向且可组合的用户界面组件来解决这些需求。微前端方法将单体前端分解为一系列较小的、自包含的应用程序或组件，每个组件由独立团队拥有和开发。这些组件非常符合业务需求，允许特定领域的部署计划和技术共存。\n\
    \n该架构中的一个关键技术考虑是代码包的设计，使其能够在独立部署的同时保持互操作性和运行效率。用于构建的 bundle 必须封装所有必要的依赖，以确保隔离并减少运行时冲突。通过采用如作用域化依赖管理或利用\
    \ Webpack Module Federation 等策略，这种封装可以最小化依赖冲突（特别是与共享库）。\n\n此外，bundle 设计应显式考虑微前端之间的接口边界，以促进独立的生命周期管理。这通常涉及为组件交互暴露良好的\
    \ API 或合约，这些合约可能基于框架或应用级别实现的自定义事件、状态管理抽象或发布/订阅机制。\n\n从部署的角度来看，模块化 bundle 必须支持版本控制和向后兼容，以适应异步发布周期。语义版本化结合运行时能力检测允许托管容器或外壳应用程序\n\
    \n"
