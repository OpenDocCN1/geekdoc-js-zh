    # Global Cloud Provider: Balancing Cost Efficiency and Query Performance


    A major cloud service provider faced the challenge of processing petabytes of
    telemetry data generated from distributed centers worldwide. The primary goals
    were to reduce storage overheads and accelerate multi-dimensional analytics queries
    without sacrificing freshness beyond an acceptable threshold.


    The adopted rollup strategy consisted of a multi-tier hierarchical aggregation
    pipeline that processed streaming data in real-time. Rollups were applied at incremental
    time granules: per-minute aggregates were compacted into hourly summaries, daily
    aggregates, and ultimately monthly rollups. This multilevel rollup structure enabled
    the system to answer a broad spectrum of analytical queries by dynamically selecting
    the most relevant granularity based on query performance.


    Key technical innovations included:


    +   - **Adaptive Rollup Windowing:** The rollup intervals were dynamically adjusted
    based on data ingestion rate and workload patterns using a feedback loop embedded
    in the ingestion pipeline.

    - **Probabilistic Errorounding:** To reduce storage cost, approximate rollups
    used sketch-based data structures like HyperLogLog and Count-Min Sketch, providing
    accuracy guarantees suitable for exploratory queries.

    - **Rollup Consistency Guarantees:** By employing watermark-based event-time semantics
    and exactly-once processing through distributed stream processors, the rollup
    results maintained strong consistency despite intermittent data reprocessing.


    This approach resulted in a 60% reduction in storage costs and a 4x improvement
    in query latency compared to baseline architectures lacking multi-tier rollups.
    Furthermore, the system''s flexibility to tune rollup parameters based on workload'
