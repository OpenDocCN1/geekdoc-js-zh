    \n快速失败（Fail-fast）配置和详细的失败报告增强了开发者反馈循环，强调在生产环境中执行的精确代码的测试可靠性。\n\n## # 最佳实践总结\n\n\
    - 针对源代码编写测试，以最大化清晰度和可维护性。\n- 在转换期间开启 source maps，并配置测试运行器以消费 source map。\n- 利用支持源码映射的\
    \ IDE 和调试器集成来实现高效的调试工作流。\n- 设计 CI 流水线按顺序执行转换和测试，保留制品和日志。\n- 利用选择性测试执行和详细日志来快速隔离并解决问题。\n\
    \n整合这些实践可以确保测试在转换后的构建环境中保持有效性、透明且高性能，最终交付可靠、可维护的软件系统。\n\n## # 第 8 章\n集成非 JavaScript\
    \ 资源与通用应用程序\n\n在构建复杂的应用时，JavaScript 只是故事的一部分——样式表、图像甚至自定义元素等资源同样关重要。无论你的目标是浏览器、服务器还是多平台应用，优雅地管理这些资源是实现无缝体验的关键。本章将揭示\
    \ Rollup 如何整合各种资源，支持从框架无关的组件到服务器端渲染和动态部署的所有内容。\n\n## ## 8.1 样式表、图像和静态文件\n\n样式表、图像、字体和其他静态资源的有效管理对于构建可维护、高性能的\
    \ Web 应用至关重要。当使用 Rollup 作为模块打包器时，将这些资源与 JavaScript 整合需要理解专门插件、适当的配置和优化策略，以确保输出的一致性和精简开发工作流。\n\
    \nCSS 和 Sass (SCSS) 通常直接导入到 JavaScript 模块中，以启用作用域模块化的样式。Rollup 的设计针对 JavaScript\
    \ 和 ES 模块进行了优化；管理样式表需要外部插件，如 rollup-plugin-postcss，它结合了 CSS 处理、打包和注入能力。该插件支持无缝导入\
    \ CSS 和 SASS 文件，并可以配置 PostCSS 处理器以启用自动加前缀、压缩和自定义转换。\n\n处理 SASS 文件的最小配置片段如下：\n\n\
    ```javascript\nimport postcss from 'rollup-plugin-postcss';\n\nexport default\
    \ {\n  input: 'src/main.js',\n  output: 'dist/bundle.js',\n  format: 'esm',\n\
    \  plugins: [\n    postcss({\n      extensions: ['.css', '.scss'],    // 将 CSS\
    \ 提取到单独的文件中\n      extract: true,\n      minimize: true,                     \
    \          // 压缩生成的 CSS\n      sourceMap: true,\n      use: ['sass']\n    ])\n\
    \  ]\n};\n```\n\n在这里，`extract` 选项生成一个单独的 CSS 文件而不是将样式内联注入到 JavaScript 中，这在生产环境中为了更好的缓存和性能是更优的。通过启用\
    \ `minimize` 和 `source maps`，输出的 CSS 既紧凑可调试，符合最佳实践。\n\n对于图像和字体——在 CSS 或 JavaScript\
    \ 模块中引用的静态文件——Rollup 插件如 `rollup-plugin-url` 或 `@rollup/plugin-url` 允许将文件作为 data\
    \ URI 导入或根据其大小作为单独文件输出。将小文件嵌入为 data URI 可以减少 HTTP 请求，但如果过度使用会导致 JS 包膨胀；通常会应用 8-10\
    \ KB 的限制。\n\n处理图像和字体的示例配置：\n\n```javascript\nimport url from '@rollup/plugin-url';\n\
    \nexport default {\n  plugins: [\n    url({\n      include: ['**/*.svg', '**/*.png',\
    \ '**/*.jpg', '**/*.woff', '**/*.woff2'],\n      limit: 8192, // 内联的 KB 限制\n \
    \     emitFiles: true, // 允许大于限制的文件被复制到输出目录\n      filename: '[name][hash]' //\
    \ 输出文件的命名模式\n    })\n  ]\n}\n```\n\n使用哈希文件名通过确保在内容发生变化时文件名也发生变化，从而改进了缓存失效。当组合插件时，插件的顺序很重要。例如，使用\
    \ postcss 处理样式表可以：\n\n```css\n.logo {\n  background: url('../logo.png') no-repeat\
    \ center;\n  width: 120px;\n  height: 40px;\n}\n```\n\n对于高级优化，将 postcss 与额外的插件（如\
    \ autoprefixer 用于添加必要的前缀，以及 cssnano 用于激进压缩）集成。\n\n```javascript\nimport autoprefixer\
    \ from 'autoprefixer';\nimport cssnano from 'cssnano';\n```\n\n```javascript\n\
    postcss({\n  plugins: [autoprefixer(), cssnano()],\n  extract: true,\n  sourceMap:\
    \ true,\n  use: ['sass']\n});\n```\n\n由于格式不同和许可限制，字体通常需要特殊处理。通过 CSS 导入字体时，确保资源插件中包含了相应的格式。考虑使用子集字体文件以减少负载，并对非关键字体采用动态加载策略以进一步增强性能。图像优化可以在构建流水线内自动化。\n\
    \n总结，在 Rollup 中与 JavaScript 同时管理样式表、图像、字体和其他静态文件意味着使用了专为模块化和性能配置的专用插件。将样式提取到带有\
    \ source maps 的单独文件中、内联小资源以减少请求、利用哈希文件名进行缓存以及采用基于 PostCSS 的转换，共同产生了可维护且高性能的前端。\n\
    \n## 8.2 Web Components 和自定义元素\n\nWeb Components 构成了一套标准的化的，能够创建可复用的\n\n构建自定义元素的基础是\
    \ DOM API 中的 HTMLElement 类。定义自定义元素需要扩展此基类并实现生命周期回调，如 connectedCallback、disconnectedCallback、attributeCallback\
    \ 和 adoptedCallback。这种架构支持监控和管理元素在 DOM 中的存在情况：\n\n```javascript\nclass MyElement\
    \ extends HTMLElement {\n  constructor() {\n    super();\n    // 挂载影子根以封装\n  \
    \  this.attachShadow({mode: 'open'});\n  }\n\n  connectedCallback() {\n    this.shadowRoot.innerHTML\
    \ = '<p>Hello, Custom Element!</p>';\n  }\n}\n\ncustomElements.define('my-element',\
    \ MyElement);\n```\n\n"
