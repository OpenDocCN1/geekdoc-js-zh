    # Best Practices Achieving effective and efficient code splitting requires adherence
    to several practices:


    +   1. **Granularity and Thresholds**: Granularity must balance chunk size and
    request overhead. Very small chunks increase network requests, which can negate
    performance gains. Establish minimum size thresholds in bundler configurations
    to avoid excessive fragmentation.


    +   2. **Predictable and Logical Boundaries**: Define chunks based on user interaction
    patterns, feature sets, or boundaries to improve cacheability and user experience.
    Grouping view dependencies separately improves usability across pages.


    +   3. **Avoiding Splitting Critical Code**: Core libraries and application bootstrap
    code should remain in the initial bundle to ensure rapid first paint. Splitting
    these may create dependency delays causing jank or errors.


    +   4. **Error Handling and Fallbacks**: When using dynamic imports, implement
    robust error handling and UI fallbacks. Network failures or chunk loading errors
    must not degrade the user experience.


    +   5. **Prefetching and Preloading**: Modern browsers support resource hints
    like `<link rel="prefetch"> and `<link rel="preload">` which can be leveraged
    to proactively fetch chunks likely needed after initial interaction, further reducing
    perceived latency.


    +   6. **Monitoring and Profiling**: Use performance profiling to measure the
    impact of code splitting strategies, continuously iterating to refine chunks based
    on usage data.


    Interplay Between Manual and Automatic Code Splitting While manual chunking grants
    fine over bundling, it often increases complexity. Dynamic imports simply splitting
    may introduce unpredictability in chunk boundaries. Both techniques are frequently
    used: static manual chunk definitions for large, stable libraries, complemented
    by dynamic imports for conditionally used features.


    Effective pipelines integrate tooling that analyzes dependency graphs and usage
    statistics to optimize chunking strategies. For instance, Webpack’s SplitChunksPlugin
    can be configured to automatically extract common dependencies, reducing duplication
    with minimal manual tuning. Meanwhile, dynamic imports serve as the on-demand
    mechanism to activate features per user interaction.


    **Conclusion of Principles** Code splitting requires strategic partitioning of
    application code to deliver efficient, user-centric loading experiences. By leveraging
    manual chunking for stable modules and dynamic imports for conditional loading,
    developers can achieve highly responsive and scalable applications. Adherence
    to best practices for chunking delivers performance gains without maintaining
    complexity or runtime errors. This principled approach to breaking large applications
    into manageable chunks is where speed and agility are paramount.


    # 5.4 Tree Shaking Deep Dive


    Tree shaking is a cornerstone technique employed by Rollup to analyze and eliminate
    code, producing leaner production bundles. Unlike traditional bundlers that primarily
    concatenate and minify JavaScript modules, Rollup harnesses static analysis to
    prune unused exports at the module level. Understanding its advanced mechanisms
    reveals both the capabilities and limitations of tree shaking as well as best
    practices to maximize its efficacy.'
  - "[PAGE 104]\n\nAt the heart of Rollup's tree shaking is the concept of static\
    \ ES module structure. Rollup benefits from the ES module syntax's static nature-imports\
    \ and exports must be declared at the top level and cannot be altered at runtime.\
    \ This declarative structure allows Rollup to construct a comprehensive dependency\
    \ graph of modules, tracking which exports are referenced and which unused. Only\
    \ the latter are considered for removal, assuming their elimination does not introduce\
    \ side effects.\n\nRollup processes with a node-by-node analysis of the Abstract\
    \ Syntax Tree (AST) for each module. When a module is imported, Rollup identifies\
    \ the named exports that are actually used downstream. Unused exports are flagged.\
    \ The bundler subsequently applies a form of code elimination by excluding these\
    \ exports and all associated internal bindings and code paths from the final output.\
    \ This mechanism is recursive; if a symbol in A is unused and another symbol in\
    \ B is solely used by the former, both are candidates for removal.\n\nHowever,\
    \ not all code patterns are tree-shakeable. The key criterion is that Rollup must\
    \ determine at build time whether an export or statement has side effects. When\
    \ side effects are uncertain or unavoidable, Rollup errs on the side of caution\
    \ and preserves the code. Common scenarios that tree shaking includes:\n\n+  \
    \ **Dynamic Exports and Side Effects:** Usage of computed export names or accessing\
    \ properties via dynamic strings complicates static analysis. Rollup treats such\
    \ cases conservatively, retaining entire modules or exports.\n**Top-Level Side\
    \ Effects:** Executable code outside function scope-such as global variables,\
    \ assignments, functions, or class instantiations-must be preserved if they produce\
    \ side effects. If an exported function is used, if it executes side-effect code\
    \ at load time, the module cannot be fully eliminated.\n**Re-exported Modules:**\
