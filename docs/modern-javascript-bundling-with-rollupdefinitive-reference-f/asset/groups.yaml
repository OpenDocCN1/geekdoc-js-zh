    使用内联 source maps 可以改进开发工作流但会膨胀包的大小，这对生产环境是有害的。外部 source maps 实现了一种务实的平衡，允许压缩和压缩后的包保持小，同时允许调试器在需要时获取映射。\n\
    \n在对旧浏览器兼容性至关重要的情况下，某些压缩选项（如激进混淆或保留箭头函数）应该有选择地禁用或自定义。例如，Terser 的 `ie8` 兼容性标志可以避免不支持旧浏览器的转换：\n\
    \n```javascript\nterserOptions: {\n  ie8: true,\n  compress: {\n    arrows: false,\n\
    \  },\n}\n```\n"
