    Rollup''s build pipeline orchestrates a systematic transformation of source modules
    into optimized bundles, designed for both modular codebases and stringent performance
    requirements. Understanding this pipeline''s sequence and the role of plugins
    and configuration at each stage is essential for harnessing Rollup''s full capabilities.


    # Module Resolution


    The pipeline begins with Rollup identifying the entry point of the application,
    typically specified as input in the configuration. From this entry, Rollup''s
    module resolver initiates a recursive traversal to locate all imported modules.
    Unlike traditional bundlers, Rollup prioritizes ES module semantics, leveraging
    static import and export statements to construct a precise module dependency graph.'
