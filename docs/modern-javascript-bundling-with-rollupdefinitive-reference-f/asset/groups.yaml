    \ 插件通常需要感知工作空间边界。例如，自定义插件可能会替换内部导入端口，或从包管理的锁文件或工作空间清单中注入版本元数据。这种自动化同步确保了构建包和上游部署目标的一致性。\n\
    \n## 实际配置考虑\n\n在配置 Rollup 以实现互操作性时，有几个实际点可以增强工具协同效应：\n\n- **显式外部化**：仔细定义外部依赖以利用包管理器的提升（hoisting），并避免不打包调试器或工作空间依赖。\n\
    - **一致的模块解析**：将 Rollup 解析器插件与包管理的解析算法对齐，以保持依赖图的纯洁。\n- **增量构建**：同时启用 Rollup 的监听模式和编排器的增量构建功能；通过\
    \ IPC 或文件监听器协调更新。\n- **确定性输出**：确保 Rollup 的输出哈希或分块策略是确定性的，以充分利用缓存共享和产物复用。\n\n```json\n\
    {\n  \"pipeline\": {\n    \"build\": {\n      \"dependsOn\": [\"build\"],\n  \
    \    \"outputs\": [\"dist/*\"]\n    },\n    \"lint\": {},\n    \"test\": {}\n\
    \  }\n}\n\nimport resolve from '@rollup/plugin-node-resolve';\n\nexport default\
    \ {\n  input: 'src/index.ts',\n  output: { file: 'dist/index.js', format: 'esm'\
