    \ mapping of component-level boundaries, furthering the user experience by avoiding\
    \ unnecessary computation.\n\nAchieving efficient splitting within SSR contexts\
    \ involves careful delineation of environment-specific modules. Shared modules\
    \ that do not have state effects and are required on both server and client can\
    \ be factored out into common chunks. Meanwhile, environment-specific code such\
    \ as API calls or file system operations present exclusively on the server must\
    \ be segregated to avoid runtime errors on the client. Rollup's manual chunks\
    \ enable manual deciding, while dynamic import() facilitate asynchronous loading\
    \ at runtime, underpinned by optimized chunks generated during the build.\n\n\
    Asset delivery plays a significant role in SSR performance, particularly with\
