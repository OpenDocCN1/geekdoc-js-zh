  - "[PAGE 106]\n\nBy understanding and applying these principles, production bundles\
    \ can be considerably leaner, reducing load times, improving runtime performance,\
    \ and contributing to maintainable, modular codebases.\n\n# 5.5 Multiple Output\
    \ Formats: CJS, ESM, UMD, and IIFE\n\nModern JavaScript projects often need to\
    \ support diverse runtime environments and consumption workflows. Achieving broad\
    \ compatibility requires producing builds that target multiple formats, each with\
    \ distinct loading characteristics, interoperability features, and deployment\
    \ scenarios. The primary output formats are CommonJS (CJS), ES Modules (ESM),\
    \ Universal Module Definition (UMD), and Immediately Invoked Function Expressions\
    \ (IIFE). These formats reflect different stages in the evolution of JavaScript\
    \ module systems and vary in terms of browser and server support, tree-shaking\
    \ capabilities, and bundle compatibility.\n\n# CommonJS (CJS)\n\nCommonJS is the\
    \ module standard traditionally supported by Node.js environments. In this format,\
    \ modules are defined using synchronous require and export objects via exports.\
    \ This synchronous loading paradigm aligns well with server-side usage but is\
    \ ill-suited for browsers without a bundle or loader shim.\n\nA typical CJS output\
    \ in a build tool configuration specifies\n\n```\n{\n  format: 'cjs',\n  exports:\
    \ 'auto',\n  dir: 'dist/cjs'\n}\n```\n\nBecause CJS modules are executed immediately\
    \ and operate synchronously, they do not facilitate static analysis. Consequently,\
    \ modern bundles cannot perform effective tree-shaking on CJS outputs, potentially\
    \ resulting in larger bundles. For server-oriented deployments or Node.js CLI\
    \ tools, CJS remains the most compatible and straightforward choice, especially\
    \ where legacy Node.js versions are concerned.\n\n# ES Modules (ESM)\n\nES Modules\
    \ represent the standardized JavaScript module system introduced in2015. They\
    \ use import and export statements, enabling static analysis of dependencies which\
    \ in turn facilitate advanced optimizations such as tree-shaking and scope hoisting.\
    \ ESM modules execute asynchronously and support top-level await.\n\nA build configuration\
    \ targeting ESM typically specifies:\n\n```\n{\n  format: 'esm',\n  dir: 'dist/esm',\n\
    \  exports: 'named'\n}\n```\n\nESM modules can be consumed natively in modern\
    \ browsers and Node.js versions 12 and above, making them the preferred format\
    \ for web applications and modern JavaScript packages. However, earlier Node.js\
    \ versions or tooling ecosystems not supporting ESM may require transpilation\
    \ or dual publishing alongside CJS."
  - "[PAGE 107]\n\nProduction of pure ESM output promotes distribution models that\
    \ enable efficient client-side loading and minimal runtime overhead. However,\
    \ it necessitates clear package metadata, such as the \"module\" field in package.json,\
    \ to guide bundlers and runtimes on module resolution.\n\n# Universal Module Definition\
    \ (UMD)\n\nUMD surfaced as an interoperable format to bridge module loading across\
    \ browsers and Node.js. It wraps the module definition in a factory function that\
    \ detects the environment, loading as AMD, CommonJS, or assigning the exports\
    \ to a global object.\n\nA typical UMD build configuration resembles:\n\n```\n\
    {\n  format: 'umd',\n  name: 'MyLibrary',\n  file: 'dist/umd/my-library.js',\n\
    \  exports: 'named'\n}\n```\n\nUMD outputs are particularly suitable for libraries\
    \ intended for use directly in browsers via script tags or older environments\
    \ lacking native module support. They offer a single file compatible with multiple\
    \ loaders and global usage contexts. The presence of the name option defines the\
    \ global namespace under which the module exports be attached.\n\nOne key trade-off\
    \ is that UMD needs to be larger due to wrapper overhead and lack the static analyability\
    \ present in ESM, limiting tree-shaking effectiveness. Additionally, UMD modules\
    \ rely on a global variable, which potentially cause namespace collisions in complex\
    \ applications.\n\n# Immediately Invoked Function Expression (IIFE)\n\nThe IIFE\
    \ format encapsulates the entire module inside a self-executing function, exposing\
    \ the module's public API on a global variable explicitly defined by the name\
    \ option. Unlike other systems, IIFE outputs do not export or import dependencies;\
    \ instead, any external logic must be provided as global variables or inline.\n\
    \nA canonical IIFE configuration is:\n\n```\n{\n  format: 'iife',\n  name: 'MyLibrary',\n\
    \  file: 'dist/iife/my-library.js'\n}\n```\n\nIIFE builds are useful for embedding\
    \ libraries directly within browsers, especially when integrating with legacy\
    \ applications or simple HTML pages that do not employ module loaders or bundlers.\
    \ They represent the lightweight, immediately executable format but provide no\
    \ module isolation beyond their scope, potentially increasing the risk of global\
    \ namespace pollution.\n\nTheir inherent lack of dependency management means IIFE\
    \ bundles include all dependencies inline, contributing to larger file sizes if\
    \ the library depends on external modules."
  - '[PAGE 108]


    # Trade-offs and Combination Strategies


    Considering the target distribution platforms and consumer preferences, projects
    often adopt multi-format publishing strategies CJS to maximize reach:


    +   - **Node.js Applications:** Prefer for backward compatibility; ESM may be
    used for modern deployments.

    - **Browser Libraries:** UMD for legacy support and IIFE for simple script inclusion
    cases.

    - **Modern Web Applications:** ESM to leverage tree-shaking and native imports.


    A common pattern is to provide both CJS and ESM builds simultaneously, referencing
    them in package."main" and "module" fields, respectively. This enables Node.js
    environments to load CJS by default while browsers consume the ESM version.


    UMD and IIFE distributions are often placed under a dist/ directory for direct
    browser inclusion, useful for CDN hosting or legacy applications. It is crucial
    to ensure that these global outputs are properly named to prevent collisions.


    During build orchestration, care must be taken to manage external dependencies
    differently for each format. For example, ESM builds mark dependencies as external
    if the environment supports them natively, but UMD and IIFE often require bundling
    dependencies to function independently in browsers.


    # Summary of Characteristics


    | Format | Environment | Dynamic Loading | Tree-Shaking | Server-side app |

    |---|---|---|---||

    | CJS | Node.js (legacy) | Synchronous | Limited | Full |

    | ESM | Modern browsers, Node.js | Asynchronous | Full | Moder |

    | UMD | Browsers, Node.js | Conditional | Limited | Universal library |

    | IIFE | Browsers (script tags) | None (immediate) | None | Simple browse |


    Incorporating multiple output formats within a build pipeline allows library authors
    and application developers to address varied ecosystem demands without fragmenting
    the codebase. Understanding the trade-offs between module loading behavior, compatibility,
    optimization potential, and ecosystem tooling is essential for effective multi-format
    publishing and distribution.


    # 5.6 Optimizing for Modern Browsers and Edge Delivery


    Modern browsers have evolved significantly, incorporating sophisticated features
    that enable enhanced performance, security, and developer tooling. For applications
    to fully leverage these advancements, it is essential to build processes and delivery
    strategies accordingly. At the same time, the emergence of content delivery networks
    (CDNs) and edge computing infrastructures demands a re-evaluation of traditional
    deployment paradigms to minimize latency and maximize responsiveness. This section
    explores techniques tailored for modern browsers and advanced delivery models,
    focusing on build customization, runtime performance, and the intricacies of edge
    deployment.


    # Tailoring Builds for Browser Capabilities'
- md: "\nContemporary browsers support a diverse set of JavaScript features, including\
    \ ES6 modules, WebAssembly, HTTP/2, and advanced caching mechanisms. Exploiting\
    \ these requires differentiated build outputs and judicious use of feature detection.\n\
    \n## Differential Serving toolchains enable differentiated serving by generating\
    \ multiple bundles for various browsers or runtime capabilities. For instance,\
    \ one bundle may be transpiled to ES5 for legacy support, while another embraces\
    \ ES6+ features for type=\"module\" and nomodule attributes:\n\n```html\n<script\
    \ type=\"module\" src=\"app.module.js\"></script>\n<script nomodule src=\"app.legacy.js\"\
    ></script>\n```\n\nThis strategy reduces payload size and execution overhead on\
    \ capable browsers. Combined with appropriate feature detection and polyfilling,\
    \ it balances performance with compatibility.\n\n## Tree Shaking and Code Splitting\
    \ Advanced bundles perform tree shaking to remove dead code, significantly reducing\
    \ bundle size. Code splitting enables critical code to load immediately while\
    \ deferring less essential. Moreover, dynamic import() syntax allows on-demand\
    \ module loading, increasing initial loading time:\n\n```javascript\nbutton.addEventListener('click',\
    \ async () => {\n  const module = await import('./heavyFeature.js');\n  module.runFunction();\n\
    });\n```\n\nUsing native ES modules supports better caching and parallel loading\
    \ due to HTTP/2 multiplexing.\n\n## Resource Hints Employ browser resource hints\
    \ such as preload, prefetch, and prerender further resource fetching:\n\n```html\n\
    <link rel=\"preload\" href=\"critical.css\" as=\"style\">\n<link rel=\"prefetch\"\
    \ href=\"nextPage.js\">\n```\n\nThese influence the browser's priority queue,\
    \ ensuring critical resources are fetched promptly while urgent assets are fetched\
    \ opportunistically.\n\n## Performance Strategies in Evolving Runtime Environments\n\
    \nRuntime performance depends heavily on execution context and network conditions.\
    \ The following advanced strategies improve responsiveness and reduce bottlenecks.\n\
    \n## Service Workers and Caching Strategies Service workers enable programmable\
    \ network intersection, allowing sophisticated caching policies and offline capabilities.\
    \ Fine-tuned caching strategies—such as cache-first for static assets or network-first\
    \ for dynamic APIs improve both speed and reliability:\n\n```javascript\nself.addEventListener('fetch',\
    \ event => {\n  event.respondWith(\n    caches.match(event.request).then(response\
    \ => {\n      return response || fetch(event.request);\n    })\n  );\n});\n```\n\
    \nLeveraging the Cache API in conjunction with IndexedDB can optimize retrieval\
    \ times and support background synchronization of data freshness.\n\n## HTTP/2\
    \ and HTTP/3 Protocol Features Modern browsers communicate over protocols multiplexing,\
    \ header compression, and server push. Server infrastructure must be configured\
    \ to maximize HTTP/2 or HTTP/3 benefits, such as serving small assets in parallel\
    \ without incurring multiple TCP connections. Additionally, server push can proactively\
    \ send critical resources before the browser requests them, reducing latency:\n\
    \n```http\nhttp2_push /styles/main.css;\nhttp2_push /scripts/runtime.js;\n```\n\
    \n## Critical Rendering Path Optimization Analyzing and reducing the critical\
    \ rendering path through resource prioritization and eliminating render-blocking\
    \ assets significantly shorten Time to Interactive (TTI). Extracting and inlining\
    \ critical JavaScript page load times, especially on mobile devices with limited\
    \ compute power.\n\n## Advanced Delivery Models: CDN and Edge Deployments\n\n\
    While modern browsers provide client-side optimizations, server-side fundamentally\
    \ shapes user experience. CDNs and emerging edge computing frameworks bring content\
    \ and logic closer to users, enhancing performance and resilience.\n\n### Geographically\
    \ Distributed Caching\nCDNs distribute static and dynamic assets across multiple\
    \ points of presence (PoPs) worldwide. Intelligent routing ensures user requests\
    \ are served from the nearest PoP, reducing latency and network congestion. Content\
    \ invalidation and cache-control policies tune freshness and bandwidth utilization:\n\
    \n```http\nCache-Control: max-age=3600, must-revalidate\n```\n\nMulti-tier cache\
    \ hierarchies often supplement global CDNs with regional and local caches for\
    \ optimal response times.\n\n### Edge Computing Paradigms\nModern edge platforms\
    \ extend beyond static asset caching by enabling server-side logic on the edge\
    \ nodes. Deployments can include API gateways, authentication, personalization,\
    \ A/B testing, and even data transformation:\n\n```javascript\naddEventListener('fetch',\
    \ event => {\n  event.respondWith(handleRequest(event.request));\n});\n\nasync\
    \ function handle(request) {\n  const url = new URL(request.url);\n  if (url.pathname.startsWith('/api/'))\
    \ {\n    // API logic at the edge\n    return new Response(JSON.stringify({message:\
    \ \"Hello from edge\"}), {\n      headers: {'Content-Type': 'application/json'}\n\
    \    });\n  }\n  // Default fetch to origin\n  return fetch(request);\n}\n```\n\
    \nBecause edge functions run geographically closer to clients, they reduce round-trip\
    \ time and backend load, resulting in superior application responsiveness.\n\n\
    ## Build and Deployment Strategies for Edge\nEdge architectures impose constraints\
    \ such as execution time limits, restricted environment APIs, and smaller storage\
    \ footprints. Build tools must create lightweight bundles, often using platform-specific\
    \ SDKs or runtimes. Modules intended for edge execution should avoid synchronous\
    \ blocking calls and large library dependencies.\n\nCI/CD pipelines should automate\
    \ multi-target builds with seamless integration into edge deployment. Strategies\
    \ for canary testing and traffic routing ensure smooth rollouts and rollback capabilities\
    \ across edge nodes.\n\n## Security and Privacy Considerations\nLeveraging distributed\
    \ execution at the edge raises security requirements. Content Security Policy\
    \ (CSP) headers, and encryption of sensitive data in transit and at rest is critical.\
    \ Privacy regulations may also affect data locality decisions within distributed\
    \ deployments.\n\n## Integrating Browser and Edge Optimization\n\nMaximizing application\
    \ performance mandates tight integration between client-side tailoring and server-side\
    \ delivery mechanisms. For example, server-driven rendering combined with streamed\
    \ hydration can optimize Time to First Paint (TTFP). Coordinating cache invalidation\
    \ between edge and client further enhances consistency and user experience.\n\n\
    Monitoring and telemetry tools deployed both in-browser and at edge nodes provide\
    \ comprehensive visibility into bottlenecks and anomalies. This data informs iterative\
    \ refinement of build targets.\n"
  mdcn: "\n现代浏览器支持多种 JavaScript 特性，包括 ES6 模块、WebAssembly、HTTP/2 以及高级缓存机制。利用这些特性需要差异化的构建输出以及明智地使用特性检测。\n\
