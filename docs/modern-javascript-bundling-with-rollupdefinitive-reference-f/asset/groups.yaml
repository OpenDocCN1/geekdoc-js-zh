- md: "\n```javascript\nplugins: {\n  /* plugins for client build, such as postcss,\
    \ terser */\n  manualChunks(id) {\n    if (id.includes('node_modules')) {\n  \
    \    return 'vendor';\n    }\n  }\n}\n```\n\nThis dual configuration facilitates\
    \ generation of a server bundle responsible for static HTML rendering and a client\
    \ bundle primed for hydration. The manualChunks function isolates vendor to enable\
    \ long-term caching, minimizing redundant data transfer. Plugins applied conditionally\
    \ per bundle accommodate environment-specific needs - for instance, server bundles\
    \ avoid CSS extraction plugins that target browsers.\n\nIn the runtime environment,\
    \ the server bundle generates the initial HTML string, embedding references to\
    \ the client-side JavaScript and critical CSS assets. The client bundle executes\
    \ hydration scripts that reconcile the server-rendered DOM with the interactive\
    \ application state. Techniques such as lazy loading chunks upon user navigation\
    \ optimize resource usage by reducing upfront download sizes and deferring non-essential\
    \ scripts.\n\nHowever, it is important to exclude modules reliant on browser APIs\
    \ (e.g., window, document) judiciously. Server bundles often exclude client-side\
    \ modules using Rollup's external configuration or dynamic imports to prevent\
    \ server-side runtime errors. Context-aware code paths distinguish execution environments,\
    \ allowing isomorphic codebases.\n\nOverall, mastering SSR with Rollup requires\
    \ delicate orchestration of build pipelines that serve server and client concerns\
    \ while maximizing code reuse and performance. The synergy between hydration,\
    \ code splitting, and asset management culminates in universal applications that\
    \ leverage server's speed with client-side interactivity, achieving responsive,\
    \ scalable, and robust user experiences.\n\n## 8.4 Electron and Hybrid Applications\n\
    \nConfiguring Rollup to successfully bundle cross-platform applications for Electron\
    \ or hybrid environments requires a nuanced approach that addresses both the unique\
    \ constraints of these runtimes and their performance demands. Electron applications\
    \ connect front-end web technologies with native APIs via Node.js integration,\
    \ while hybrid applications offer native web views with native mobile frameworks.\
    \ The bundling strategy must balance modularity, tree-shaking code, handling platform-specific\
    \ assets, and ensuring native module compatibility for optimal performance.\n\n\
    Electron projects consist of two processes: the main process, which manages native\
    \ operating system interactions, and one or more renderer processes, which execute\
    \ application code within Chromium. Each process demands a tailored Rollup workflow,\
    \ reflecting their disparate runtime environments and API dependencies. The main\
    \ process runs on Node.js with access to native modules, whereas the renderer\
    \ process operates like a browser environment but often requires the ability to\
    \ call native functions exposed through Electron's IPC (inter-process communication).\n\
    \n### Rollup Configuration for the Main Process\n\nThe main process requires bundling\
    \ code that targets Node.js, often in CommonJS or ES modules format, while preserving\
    \ or externalizing native dependencies to prevent bundling errors or inflated\
    \ binary sizes. Rollup's external option is critical here to exclude Node.js built-ins\
    \ and native modules such as electron, fs, path, and others from the bundle. This\
    \ ensures the bundled output properly references these at runtime without duplication.\n\
    \n```javascript\nexport default {\n  input: 'src/main/index.js',\n  output: {\n\
    \    file: 'dist/main.js',\n    format: 'cjs', // Node.js environment format\n\
    \  },\n  external: [\n    'electron',\n    'fs',\n    'path',\n    // other native\
    \ Node or Electron modules\n  ],\n  plugins: [\n    // CommonJS plugin to support\
    \ dependencies exporting CJS modules\n    commonjs(),\n    // Node resolve plugin\
    \ to locate modules in node_modules\n    nodeResolve({ preferredBuiltins: true,\
    \ babelHelpers: 'bundled' })\n  ]\n};\n```\n\nThe `preferredBuiltins: true` option\
    \ in nodeResolve allows Rollup to resolve Node.js built-ins without replacing\
    \ them with browser-compatible shims, important for native Electron modules to\
    \ function correctly.\n\n### Rollup Configuration for the Renderer Process\n\n\
    The renderer process bundles code that targets the browser environment inside\
    \ Electron's Chrome content, using ES modules or IIFE format. This configuration\
    \ enables typical web-centric optimizations such as code splitting, CSS extraction,\
    \ and asset inlining.\n\nSince the renderer can interact with the main process\
    \ through electron.ipcRenderer and custom preload scripts, externalization of\
    \ the electron module must be carefully considered. Generally, electron should\
    \ be marked as external and provided at runtime by the Electron environment to\
    \ prevent bundling unnecessary code.\n\n```javascript\nexport default {\n  input:\
    \ 'src/renderer/main.js',\n  output: {\n    file: 'dist/renderer.js',\n    format:\
    \ 'esm',\n    sourcemap: true\n  },\n  external: ['electron'],\n  plugins: [\n\
    \    nodeResolve(),\n    commonJS(),\n    postcss({ extract: true, minimize: true\
    \ }),\n    terser(), // for minification\n  ]\n};\n```\n\nThis setup leverages\
    \ PostCSS for advanced CSS handling-extracting stylesheets and applying optimizations-well\
    \ as Terser for aggressive minification. Inline asset support can also be enabled\
    \ with Rollup plugins as url for small images or fonts, reducing HTTP requests\
    \ within the renderer process.\n\n### Asset Bundling and Native Integration\n\n\
    Cross-platform consistency must carefully manage assets (images, fonts, static\
    \ files) to ensure consistent regardless of the target platform. Rollup plugins\
    \ such as rollup-plugin-url and rollup-plugin-copy facilitate embedding small\
    \ assets as base64 URLs or copying static storage to the output directory.\n\n\
    Electron's native integration requires special attention to communicate with native\
    \ APIs or external system libraries. Bundling native modules (e.g., SQLite, serial\
    \ port libraries) can cause issues due to platform-specific binaries and ABI mismatches.\
    \ The accepted best practice is to treat these native modules as external dependencies\
    \ and use Electron's as packaging format to include them alongside the application\
    \ bundle without modification.\n\nAdditionally, preload scripts, executed in a\
    \ context renderer and maintain processes, often require dedicated Rollup configurations\
    \ to produce lightweight, permission-restricted builds.\n\n### Performance Optimization\
    \ Strategies\n\nOptimizing performance begins with tree shaking, code splitting,\
    \ and minification. By eliminating dead code, developers can reduce the bundle\
    \ size. Context-aware code paths distinguish execution environments, allowing\
    \ isomorphic codebases.\n\n### Summary of Integration Considerations\n\n- **Separate\
    \ Bundles per Context**: Ensure modularity and isolation between processes.\n\
    - **Externalize Native Modules**: Prevent bundling native dependencies by marking\
    \ them as external.\n- **Optimize Renderer**: Leverage tree shaking, code splitting,\
    \ and minification for performance.\n- **Asset Management**: Use inlining for\
    \ small assets and copying for larger resources.\n- **Security via Preload Scripts**:\
    \ Configure lightweight, permission-scoped builds to manage access.\n\n## 8.5\
    \ Micro Frontends and Modular Deployments\n\nModern apps frequently demand scalability\
    \ not only in terms of features and user base but also in development and deployment.\
