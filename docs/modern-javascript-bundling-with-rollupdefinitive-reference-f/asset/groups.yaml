    });\n```\n\n在此类框架中集成 Rollup API 允许根据特定项目需求定制模块化、健壮的 CLI 接口。例如，传递环境变量或标记可以触发不同的插件配置、多个入口点或备输出目标。\n\
    \n最大化开发效率还涉及自动化构建过程中的重复任务、错误报告和状态反馈。Rollup 的程序化 API 提供了自定义 CLI 可以使用的事件钩子（event\
