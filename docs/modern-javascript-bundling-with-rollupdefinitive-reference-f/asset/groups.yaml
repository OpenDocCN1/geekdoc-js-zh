    \ `package.json` 或中心流水配置中定义 Rollup 任务，让 Turborepo 通过 `turbo run` 命令调度执行。Turborepo\
    \ 内置的哈希算法仔细跟踪文件输入、配置更改和环境变量，确保仅在需要时运行 Rollup。这种集成中的关键细节是显式声明 Rollup 的“输入”、“插件”和外部依赖作为缓存键的一部分。这保证了缓存的完整性和可重复性。\n\
    \n以下是 Turborepo 处理单体仓库中 Rollup 构建的示意：\n\n- 每个包使用 Rollup CLI 或 API 暴露‘build’脚本。\n\
