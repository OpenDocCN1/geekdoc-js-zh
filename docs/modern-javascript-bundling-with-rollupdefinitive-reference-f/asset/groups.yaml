    \ polyfill 策略。\n\n处理复杂的项目需求可能需要在单个 CLI 调用中组合多个 Rollup 构建。程序化 API 支持顺序或并行打包，实现了诸如生成多个入口包或同时进行现代和旧版构建的场景：\n\
