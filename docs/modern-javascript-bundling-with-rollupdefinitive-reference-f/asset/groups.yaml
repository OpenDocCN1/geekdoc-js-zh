    \ By importing the rollup function, one can control bundling comprehensively,\
    \ including input options, output format control, and watch mode integration.\
    \ The simplest form of invoking Rollup is\n\n```javascript\nimport { rollup }\
    \ from 'rollup';\n\nasync function build() {\n  const bundle = await rollup({\n\
    \  input: 'src/index.js',\n  plugins: [\n    // Plugin instances here\n  ]\n});\n\
    \n  await bundle.write({\n  file: 'dist/bundle.js',\n  format: 'cjs',\n  sourcemap:\
    \ true\n  });\n}\n\nbuild();\n```\n\nThis code demonstrates direct control over\
    \ bundling steps without external configuration files or CLI conventions. Developers\
    \ can extend this pattern by embedding conditional logic, dynamic option generation,\
    \ or integrating it within larger build orchestration scripts or task runners.\n\
    \nFor building a custom CLI, the first consideration is user input handling. While\
    \ Rollup’s CLI provides arguments for configuration and output control, a custom\
    \ CLI written in Node.js can interpret parameters in arbitrary ways. Packages\
    \ such as commander, yargs, or oclif can parse command-line arguments efficiently,\
