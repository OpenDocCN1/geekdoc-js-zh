- md: "\n# Chapter 1\nThe Evolution of JavaScript Bundling\n\nFrom the early days\
    \ of single-file scripts to the sophisticated bundling strategies that power modern\
    \ applications, JavaScript's journey has been driven by the need for scalability,\
    \ modularity, and performance. This chapter charts the forces and breakthroughs\
    \ that have turned bundling into a cornerstone of robust web development. Uncover\
    \ how shifting patterns, growing codebases, and distinct module systems led to\
    \ an ecosystem where bundlers are not just tools—but essential infrastructure\
    \ in the world’s largest software projects.\n\n## 1.1 Modular JavaScript: Origins\
    \ and Growth\n\nThe inception of JavaScript in the mid-1990s introduced a dynamic\
    \ scripting language into browsers, distinguished by ease of use and immediate\
    \ feedback with minimal setup. Initially designed to enhance web pages by manipulating\
    \ the Document Object Model (DOM), early JavaScript embraced a simple architecture\
    \ predominantly relying on global script files. Developers injected inline scripts\
    \ or linked single monolithic files, exploiting the browser’s global namespace\
    \ for variables and functions. While expedient, this model introduced critical\
    \ limitations as applications grew in size and complexity.\n\nA primary challenge\
    \ was the global namespace pollution. With all declarations residing in a shared\
    \ global scope, the risk of identifier collisions increased dramatically. Diverse\
    \ scripts loaded from multiple sources, libraries, and plugins often inadvertently\
    \ overwrote or conflicted with one another. This situation severely hindered maintainability\
    \ and predictability of behavior, forcing developers to devise local scoping hacks,\
    \ such as immediately invoked function expressions (IIFEs), to simulate private\
    \ scopes. These patterns helped reduce direct namespace conflicts but lacked formal\
    \ structure and scalability.\n\nReusability also suffered under this architecture.\
    \ Code sharing generally amounted to copying and pasting common routines, which\
    \ invited duplication, inconsistent updates, and bloated bundle sizes. The absence\
    \ of explicit dependency management meant that script loading order determined\
    \ functionality correctness—a brittle approach vulnerable to subtle errors and\
    \ cumbersome debugging. Consequently, the traditional flat file inclusion model\
    \ impaired incremental development and the modular composition of software components.\n\
    \nRecognizing these deficiencies, the JavaScript community began advocating for\
    \ modular programming paradigms analogous to those established in other languages\
    \ and systems. The primary goals were encapsulation, explicit dependencies, clear\
    \ interfaces, and composable units of functionality, allowing applications to\
    \ scale effectively, foster code reuse, and enhance developer collaboration.\n\
    \nEarly community initiatives utilized document-level script loading patterns,\
    \ evolving into conventions such as the Asynchronous Module Definition (AMD) and\
    \ CommonJS standards emerging in the late 2000s. AMD, exemplified by libraries\
    \ like RequireJS, introduced asynchronous script loading with explicit dependency\
    \ declaration, enabling modular development tailored for browsers. CommonJS, originally\
    \ devised for server-side JavaScript environments like Node.js, emphasized synchronous\
    \ module loading and exports with require and module.exports syntax. Each initiative\
    \ addressed segments of the modularity problem but operated within varied environments,\
    \ leading to fragmentation.\n\nThe limitations of global scripts and informal\
    \ modularity spawned a broader ecosystem of build tools and module bundlers such\
    \ as Webpack, Browserify, and Rollup to reconcile differing module formats and\
    \ optimize delivery. These tools transformed modular source files into browser-ready\
    \ bundles, incorporating static analysis and dependency graphs to automate inclusion\
    \ order and overhead.\n\nA pivotal milestone was the introduction of the ECMAScript\
    \ 2015 (ES6) specification with native import and export statements, embedding\
    \ module constructs directly into the language. This standard formalized module\
    \ syntax and semantics, promoting static analysis, tree shaking, and runtime efficiency.\
    \ ES6 modules eliminated reliance on the global scope, enforcing file-level scope\
    \ by default and defining clear interfaces to export and import bindings natively.\
    \ Native browser support for modules further eased adoption, removing the dependency\
    \ on external loaders or bundlers for many use cases.\n\nThe rise of modular JavaScript\
    \ transformed web development. It encouraged the decomposition of functionality\
    \ into self-contained units, enabling parallel development, easier testing, and\
    \ cleanly abstracted interfaces. The explicit dependency graph facilitated precise\
    \ code delivery and optimization, enhancing both performance and maintainability.\
    \ Emergent frameworks and libraries embraced modularity as a foundational principle,\
    \ leveraging ES6 modules or compatible systems, thereby streamlining complex application\
    \ architecture for modern users.\n\nFrom a historical perspective, the journey\
    \ from global script files to modular programming in JavaScript embodies the maturation\
    \ of the language and its ecosystem. It reflects the community-driven response\
    \ to scaling challenges and clarity in software design. Modular JavaScript heralded\
    \ a new era where code organization became first-class, setting a foundation that\
    \ continues to evolve with ongoing innovations in package management, dynamic\
    \ imports, and component-based frameworks.\n\n## 1.2 From CommonJS to ES Modules\n\
    \nJavaScript module systems have undergone a fundamental transformation, transitioning\
    \ from the initially dominant CommonJS (CJS) format to the standardized ECMAScript\
    \ Modules (ESM). This evolution reflects both technical design improvements and\
    \ philosophical shifts in how modular code is conceived and executed. The distinctions\
    \ between CommonJS and ES Modules influence syntax, environment compatibility,\
    \ and module loading strategies, each affecting the structure of applications\
    \ and the bundling workflows required for efficient distribution.\n\nCommonJS\
    \ was designed pragmatically to enable modularity on the server side, especially\
    \ within Node.js environments. It employs a synchronous loading model and leverages\
    \ imperative syntax, characterized by the use of require() for importing dependencies\
    \ and module.exports for exporting functionality. An example illustrates this\
    \ pattern:\n\n```javascript\nconst fs = require('fs');\nfunction readTextFile(path)\
    \ {\n  return fs.readFileSync(path, 'utf-8');\n}\n```\n\nmodule.exports = { readTextFile\
    \ };\n```\n\nThe synchronous nature stems from the fact that CommonJS modules\
    \ are loaded and executed at runtime, blocking subsequent code until the module\
    \ is available. This approach suits server environments where filesystem access\
    \ is rapid and reliable but imposes constraints in browser environments, where\
    \ network latency necessitates asynchronous loading mechanisms.\n\nIn contrast,\
    \ ES Modules were introduced into the ECMAScript specification to provide a native,\
    \ asynchronous, and declarative module system compatible with both browsers and\
    \ server platforms. The syntax embraces static structure and explicit declarations,\
    \ as shown by the equivalent example:\n\n```javascript\nimport { readFileSync\
    \ } from 'fs';\n\nexport function readText(path) {\n  return readFileSync(path,\
    \ 'utf-8');\n}\n```\n\nHere, the import and export statements are statically analyable,\
    \ enabling advanced optimizations at compile time, such as tree shaking, where\
    \ unused exports are eliminated. The static structure also mandates module dependencies\
    \ are determined before execution begins, facilitating an asynchronous loading\
    \ strategy that can leverage network requests concurrently rather than sequentially.\n\
    \nPhilosophically, CommonJS modules embody a runtime-bound, imperative style:\
    \ modules are loaded and executed on demand, and export objects may be mutated\
    \ after initialization. ES Modules enforce immutability of exported\n"
  mdcn: "\n\n# 第 1 章\nJavaScript 打包的演变\n\n从早期的单文件脚本到驱动现代应用的复杂打包策略，JavaScript 的历程受扩展性、模块化和性能需求的驱动。本章将阐述那些使打包技术成为稳健\
    \ Web 开发基石的力量与突破。揭示了不断变化的模式、日益扩大的代码库以及不同的模块系统如何构建出一个生态系统——在这个生态系统中，打包器不仅是工具，更是全球最大软件项目中不可缺的基础设施。\n\
    \n## 1.1 模块化 JavaScript：起源与增长\n\nJavaScript 在 20 世纪 90 年代中期诞生，为浏览器引入了一种动态脚本语言，其特点是易用且无需配置即可获得即时反馈。早期\
    \ JavaScript 设计旨在通过操作文档对象模型（DOM）来增强网页，它最初采用了一种主要依赖于全局脚本文件的简单架构。开发者注入内联脚本或链接单个单体文件，利用浏览器的全局命名空间来处理变量和函数。虽然这种模型很方便，但随着应用程序规模和复杂性的增加，它引入了关键的局限性。\n\
    \n一个首要挑战是全局命名空间污染。由于所有声明都位于共享的全局作用域中，标识符冲突的风险急剧增加。从多个源、库和插件加载的各种脚本往往会无意中相互覆盖或发生冲突。这种情况严重阻碍了代码的可维护性和行为的可预测性，迫使开发者设计局部作用域的“黑科技”，例如立即调用函数表达式（IIFE），以模拟私有作用域。这些模式有助于减少直接的命名空间冲突，但缺乏正式结构和可扩展性。\n\
    \n可复用性在这种架构下也遭受了影响。代码共享通常等同于复制粘贴常用程序，这导致了代码重复、更新不一致以及包体积的膨胀。缺乏显式的依赖管理意味着脚本的加载顺序决定了功能的正确性——这种脆弱的方法容易产生细微错误，且调试繁琐。因此，传统的扁平化文件包含模型阻碍了增量开发和软件组件的模块化组合。\n\
    \n在意识到这些缺陷后，JavaScript 社区开始提倡类似于其他语言和系统中建立的模块化编程范式。其主要目标是封装、显式依赖、清晰的接口以及可组合的功能单元，使应用程序能够有效扩展、促进代码复用并增强开发者协作。\n\
    \n早期的社区倡议利用文档级脚本加载模式，演变为 2000 年代后期出现的约定，如异步模块定义（AMD）和 CommonJS 标准。以 RequireJS\
    \ 等库为代表的 AMD 引入了带有显式依赖声明的异步脚本加载，为浏览器定制的模块化开发提供了可能。CommonJS 最初为 Node.js 等服务器端 JavaScript\
    \ 环境设计，强调同步模块加载，并使用 `require` 和 `module.exports` 语法进行导入和导出。每项倡议都解决了模块化问题的部分，，但运行在不同的环境中，导致了碎片化。\n\
    \n全局脚本和非正式模块化的局限性催生了更广泛的构建工具和模块打包器生态系统，如 Webpack、Browserify 和 Rollup，以协调不同的模块格式并优化交付。这些工具将模块化的源文件转换为浏览器就绪的包，结合静态分析和依赖图来自动处理包含顺序和开销。\n\
    \n一个关键里程碑是 ECMAScript 2015 (ES6) 规范的引入，它通过原生的 `import` 和 `export` 语句将模块构造直接嵌入语言中。这一标准正式化了模块语法和语义，促进了静态分析、摇优化（tree\
    \ shaking）和运行时效率。ES6 模块消除了对全局作用域的依赖，默认强制文件级作用域，并定义了清晰的接口来原生导出和导入绑定。浏览器对模块的原生支持进一步促进了采用，使得许多用例不再需要对外部加载器或打包器的依赖。\n\
    \n模块化 JavaScript 的兴改变了 Web 开发。它鼓励将功能分解为自包含的单元，实现了并行开发、更易于测试以及清晰的抽象接口。显式的依赖图有助于了精确的代码交付和优化，提升了性能和可维护性。新兴的框架和库将模块化作为基础原则，利用\
    \ ES6 模块或兼容系统，为现代用户简化了复杂的应用架构。\n\n从历史角度看，JavaScript 从全局脚本文件到模块化编程的历程体现了语言及其生态系统的成熟。它反映了社区对扩展性挑战和软件设计清晰度需求的响应。模块化\
    \ JavaScript 开启了一个新时代，代码组织成为一等公民，并为包管理、动态导入和基于组件的框架的持续创新奠定了基础。\n\n## 1.2 从 CommonJS\
    \ 到 ES Modules\n\nJavaScript 模块系统经历了根本性的转变，从最初主导的 CommonJS (CJS) 格式过渡到标准的 ECMAScript\
    \ Modules (ESM)。这种演变反映了技术设计的改进，也反映了模块化代码构思和执行方面的哲学转变。CommonJS 和 ES Modules 之间的区别影响了语法、环境兼容性和模块加载策略，每都会影响应用程序结构以及高效分发所需的打包工作流。\n\
    \nCommonJS 的设计非常实用，旨在实现服务器端的模块化，特别是在 Node.js 环境中。它采用同步加载模型并利用命令式语法，特点是使用 `require()`\
    \ 导入依赖，使用 `module.exports` 导出功能。以下示例说明了这种模式：\n\n```javascript\nconst fs = require('fs');\n\
    function readTextFile(path) {\n  return fs.readFileSync(path, 'utf-8');\n}\n\n\
    module.exports = { readTextFile };\n```\n\n同步性源于 CommonJS 模块是在运行时加载和执行的，在模块可用之前会阻塞后续代码。这种方法适用于文件系统访问快速可靠的服务器环境，但在浏览器环境中构成了限制，因为网络延迟需要异步加载机制。\n\
    \n相比之下，ES Modules 被引入 ECMAScript 规范，旨在为浏览器和服务器平台提供一种原生的、异步的声明式模块系统。其语法采用了静态结构和显式声明，如下等示例所示：\n\
    \n```javascript\nimport { readFileSync } from 'fs';\n\nexport function readText(path)\
    \ {\n  return readFileSync(path, 'utf-8');\n}\n```\n\n在这里，`import` 和 `export`\
    \ 语句是静态可分析的，允许在编译时进行高级优化（例如摇优化，即消除未使用的导出内容）。静态结构还要求在执行开始之前确定模块依赖，从而有助于实现异步加载策略，可以并发而非顺序地利用网络请求。\n\
    \n从哲学上讲，CommonJS 模块体现了运行时绑定的命令式风格：模块按需加载和执行，导出对象在初始化后可能会被修改。ES Modules 则强制执行导出内容的不可变性\n\
    \n"
