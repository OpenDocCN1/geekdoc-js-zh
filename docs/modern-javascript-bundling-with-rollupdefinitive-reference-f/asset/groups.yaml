  - "[PAGE 148]\n\n# # Chapter 8\nIntegrating Non-JavaScript Assets and Universal\
    \ Applications\n\nJavaScript is only part of the story when building sophisticated\
    \ applications—assets like stylesheets, images, and even custom elements are just\
    \ as critical. Whether you're targeting browsers, servers, or multi-platform apps,\
    \ managing these resources gracefully is key to a seamless experience. This chapter\
    \ pulls back the curtain on how Rollup integrates a world of assets, supporting\
    \ everything from framework-agnostic components to server-side rendering and dynamic\
    \ deployments.\n\n# ## 8.1 Stylesheets, Images, and Static Files\n\nEffective\
    \ management of stylesheets, images, fonts, and other static assets is critical\
    \ to building maintainable, high-performance web applications. When using Rollup\
    \ as a module bundler, integrating these assets alongside JavaScript requires\
    \ understanding specialized plugins, proper configuration, and optimization strategies\
    \ to ensure cohesive output and streamlined development workflows.\n\nCSS and\
    \ Sass (SCSS) are typically imported directly into JavaScript modules to enable\
    \ scoped, modular styling. Rollup design is optimized for JavaScript and ES modules,\
    \ managing stylesheets demands external plugins such as rollup-plugin-postcss,\
    \ which combines CSS processing, bundling, and injection capabilities. This plugin\
    \ supports importing CSS and SASS files seamlessly and can be configured with\
    \ PostCSS processors to enable autoprefixing, minification, and custom transformations.\n\
    \nA minimal configuration snippet to handle SASS files looks like this:\n\n```\n\
    import postcss from 'rollup-plugin-postcss';\n\nexport default {\n  input: 'src/main.js',\n\
    \  output: 'dist/bundle.js',\n  format: 'esm',\n  plugins: [\n    postcss({\n\
    \      extensions: ['.css', '.scss'],    // Extract CSS to a separate file\n \
    \     extract: true,\n      minimize: true,                               // Minify\
    \ the resulting CSS\n      sourceMap: true,\n      use: ['sass']\n    ])\n  ]\n\
    };\n```\n\nHere, the extract option generates a separate CSS file rather than\
    \ injecting styles inline in JavaScript, which is preferred in production for\
    \ better caching and performance. By enabling minimize and source maps, the outputted\
    \ CSS is both compact and debuggable, aligning with best practices."
  - "[PAGE 149]\n\nFor images and fonts-static files that are referenced in CSS or\
    \ JavaScript modules-Rollup plugins such as rollup-plugin-url or @rollup/plugin-url\
    \ allow importing files as data URIs or emitting them as separate files depending\
    \ on their sizes. Embedding small files as data URIs reduces HTTP requests but\
    \ can bloat the JS bundle if overused; typically, a limit of 8-10 KB is applied.\n\
    \nExample configuration to handle images and fonts:\n\n```\nimport url from '@rollup/plugin-url';\n\
    \nexport default {\n  plugins: [\n    url({\n      include: ['**/*.svg', '**/*.png',\
    \ '**/*.jpg', '**/*.woff', '**/*.woff2'],\n      limit: 8192, // KB limit for\
    \ inlining\n      emitFiles: true, // Allows files > limit to be copied to output\
    \ dir\n      filename: '[name][hash]' // Naming pattern for emitted files\n  \
    \  })\n  ]\n}\n```\n\nUsing hashed filenames improves cache invalidation by ensuring\
    \ that file names change when content changes. This approach is essential when\
    \ static assets are served by CDNs or aggressive HTTP caching.\n\nWhen combining\
    \ plugin functionalities, the order of plugins in the Rollup configuration matters.\
    \ Processing stylesheets with postcss should come after static asset plugins so\
    \ CSS can correctly reflect emitted image or font assets. For example, referencing\
    \ an image in Sass file:\n\n```\n.logo {\n  background: url('../logo.png') no-repeat\
    \ center;\n  width: 120px;\n  height: 40px;\n}\n```\n\nHere, the image is imported\
    \ through the URL plugin during bundling, adjusting the path appropriately in\
    \ the output CSS. This guarantees asset URLs are accurate and accessible post-build.\n\
    \nFor advanced optimization, integrate postcss with additional PostCSS plugins\
    \ as autoprefixer, which adds necessary vendor prefixes ensuring cross-browser\
    \ compatibility, and cssnano for aggressive CSS minification. This chain is configured\
    \ inside the PostCSS plugin declaration:\n\n```\nimport autoprefixer from 'autoprefixer';\n\
    import cssnano from 'cssnano';\n```\n\n```\npostcss({\n  plugins: [autoprefixer(),\
    \ cssnano()],\n  extract: true,\n  sourceMap: true,\n  use: ['sass']\n});\n```"
  - "[PAGE 150]\n\nFonts often require special handling due to varying formats (woff,\
    \ ttf, eot) and licensing constraints. When importing fonts through CSS, ensure\
    \ corresponding file formats are included in the asset plugin configuration and\
    \ emitted consistently. Consider subsetted font files to reduce payloads and dynamic\
    \ loading strategies for non-critical fonts to further enhance performance.\n\n\
    Image optimization can be automated within the build pipeline plugins such as\
    \ rollup-plugin-imagemin, which uses underlying libraries like imagemin-pngquant\
    \ or imageminjpeg for lossy and lossless compression. aggressive optimization\
    \ is better applied as a separate step in continuous integration pipelines or\
    \ asset production workflows to avoid build-time penalty.\n\nBeyond bundling,\
    \ deploying static assets efficiently impacts runtime performance. Leveraging\
    \ HTTP/2 server push, content delivery networks with edge caching, and proper\
    \ cache-control headers further complements bundling.\n\nIn summary, managing\
    \ stylesheets, images, fonts, and other static files alongside JavaScript in Rollup\
    \ hints the use of dedicated plugins configured for modular and performance. Extracting\
    \ styles into separate files with source maps, inlining small assets for fewer\
    \ requests, utilizing hashed filenames for caching, and employing PostCSS-based\
    \ transformations collectively yield maintainable and performant frontend. These\
    \ practices bridge the gap between JavaScript-centric bundling workflows and non-JavaScript\
    \ static content, ensuring a unified build process aligned with modern web application\
    \ demands.\n\n# 8.2 Web Components and Custom Elements\n\nWeb Components constitute\
    \ a suite of standardized technologies that enable the creation of reusable\n\n\
    The foundation for building Custom Elements is the HTMLElement class in the DOM\
    \ API. Defining a custom element requires extending this base class and implementing\
    \ lifecycle callbacks such as connectedCallback, disconnectedCallback, attributeCallback,\
    \ and adoptedCallback. This architecture supports the monitoring and management\
    \ of an element's presence in the DOM:\n\n```\nclass MyElement extends HTMLElement\
    \ {\n  constructor() {\n    super();\n    // Attach shadow root for encapsulation\n\
    \    this.attachShadow({mode: 'open'});\n  }\n\n  connectedCallback() {\n    this.shadowRoot.innerHTML\
    \ = '<p>Hello, Custom Element!</p>';\n  }\n}\n```\n\ncustomElements.define('my-element',\
    \ MyElement);"
- md: "\nThe Shadow DOM is central to encapsulation, providing scoped styles and DOM\
    \ structure inaccessible to the global document, preventing style leakage or collision.\
    \ Utilizing the Shadow DOM ensures components behave correctly regardless of the\
    \ external page's framework's styles. The mode parameter controls whether the\
    \ shadow root is accessible via JavaScript ('mode': 'open') or entirely encased\
    \ ('mode': 'closed'), offering fine-grained control over encapsulation.\n\nFramework-agnostic\
    \ development requires framework-specific APIs or templating engines built within\
    \ components. Instead, templating should rely on native capabilities or lightweight,\
    \ framework-independent libraries. Data binding complexities are simplified by\
    \ event dispatching and attribute/property observation, which preserves portability\
    \ across different environments.\n\nInteroperability across frameworks such as\
    \ React, Angular, or Vue hinges on recognizing the Custom Element's lifecycle\
    \ and how each framework interacts with DOM Elements. For example, React requires\
    \ careful handling of custom element properties and event listeners; the underlying\
    \ element dispatches native Custom Events that can be listened to with prefix\
    \ (e.g., 'onChange' binds to a change event).\n\nBundling Components for wide\
    \ usage presents challenges:\n\n- **Module compatibility**: Web Components typically\
    \ leverage ES Modules (ESM) for import/export semantics. Bundlers like Rollup\
    \ or Webpack can be configured to output ESM, or UMD/IIFE formats for broader\
    \ compatibility. Supporting Node.js-style CommonJS is generally unnecessary unless\
    \ components are server-side rendered.\n- **Dependency management**: Minimizing\
    \ extremal dependencies lowers lightweight distribution and reduces version conflicts.\
    \ Inlining critical dependencies or marking them as peerDependencies enables components\
    \ to manage library versions consistently.\n- **Polyfill**: Legacy support (e.g.,\
    \ IE11) demands polyfills for Custom Elements, Shadow DOM, and ES Modules. Bundling\
    \ can conditionally include polyfills or document necessary imports separately\
    \ to prevent bloat.\n- **CSS encapsulation**: Styling inside Shadow DOM avoids\
    \ global CSS conflicts. However, adopting CSS variables and adopting stylesheets\
    \ enhances themability without sacrificing encapsulation.\n\nAn advanced bundling\
    \ strategy involves generating multiple entry points:\n\n- A standard ESM bundle\
    \ with ES6+ syntax to optimize for modern browsers and tools like Rollup and Vite.\n\
    - An ESM-compatible UMD bundle including relevant polyfills for legacy environments.\n\
    - A single-file UMD/IIFE bundle for direct injection script tags.\n\nExample configuration\
    \ for Rollup bundling a Web Component:\n\n```javascript\nexport default {\n  input:\
    \ 'src/my-element.js',\n  output: {\n    file: 'dist/my-element.js',\n    format:\
    \ 'esm',\n  },\n  plugins: [babel({ babelHelpers: 'bundled', presets: ['@babel/preset-env']})],\n\
    },\n{\n  input: 'src/my-element.js',\n  output: {\n    file: 'dist/my-element.umd.js',\n\
    \    format: 'umd',\n  },\n  plugins: [babel({ babelHelpers: 'bundled', presets:\
    \ [['@babel/preset-env', { targets: '> 0.25%, no }]})],\n};\n```\n\nEncapsulation\
    \ within components can be further tightened using private class fields and methods\
    \ introduced in modern ECMAScript specifications. These features protect the internals\
    \ from accidental external mutation, a vital consideration in library-grade component\
    \ design.\n\nInteroperability also extends to communication patterns beyond basic\
    \ attributes and events. The CustomEvent interface supports detailed payloads,\
    \ enabling components to broadcast rich data without changing API signature, the\
    \ adoption of slots for content projection enhancement without violating encapsulation,\
    \ allowing users to inject arbitrary markup while preserving style and logic isolation.\n\
    \nExtending Custom Elements with mixins or decorators facilitates code reuse and\
    \ domain-specific extensions without sacrificing modularity. For instance, applying\
    \ a localization mixin encapsulates translation while keeping the core element\
    \ focused on structural concerns.\n\nThe emergence of standards such as Declarative\
    \ Shadow DOM further enhances the HTML markup ability to specify Shadow DOM content,\
    \ simplifying server-side rendering and hydration while preserving encapsulation\
    \ and interoperability.\n\nOverall, the strategically composed Web Components\
    \ and Custom Elements enable scalable, performant, and maintainable UI architectures\
    \ that gracefully integrate into heterogeneous front-end ecosystems. Employing\
    \ best practices in encapsulation, bundling, and cross-framework communication\
    \ ensures maximal reuse without sacrificing the integrity or style isolation in\
    \ component-based design.\n\n## 8.3 Server-Side Rendering and SSR Bundles\n\n\
    Universal applications demand a bifurcated approach to bundling, requiring both\
    \ server and client to coexist harmoniously. The server-side rendering (SSR) process,\
    \ facilitated through this for enhanced performance. SSR bundles, ensures that\
    \ an application's initial HTML is generated on the server, and for a better user\
    \ experience through faster time-to-content. Achieving this with Rollup requires\
    \ hydration mechanisms, executing code splitting tactics, and optimizing asset\
    \ delivery.\n\nAt the core of SSR bundling lies the concept of two distinct yet\
    \ interdependent outputs: the server bundle, which executes in a Node.js environment\
    \ to produce HTML markup, and the client bundle, which subsequently updates this\
    \ markup with interactivity. Rollup's flexible configuration permits the creation\
    \ of parallel bundles by leveraging multiple input and output options. Typically,\
    \ the server bundle is compiled as a CommonJS or ES module format with external\
    \ dependencies excluded to reduce bundle size and preserve native Node.js modules.\
    \ In contrast, the client bundle is crafted in a format suitable for browser environments,\
    \ often ES modules or immediately invoked function expression (IIFE), with all\
    \ dependencies included for runtime completeness.\n\nHydration serves as the bridge\
    \ between server-rendered markup and fully interactive client-side applications.\
    \ It rehydrates static HTML by attaching event listeners and restoring application\
    \ state. This is crucial because the server bundle delivers only inert markup\
    \ without client-side control. Rollup simplifies hydration through code splitting,\
    \ enabling logically isolated chunks to load on demand. This segmented output\
    \ ensures that the minimal necessary JavaScript is shipped initially, deferring\
    \ critical scripts until interaction or navigation demands them. It also allows\
    \ mapping of component-level boundaries, furthering the user experience by avoiding\
    \ unnecessary computation.\n\nAchieving efficient splitting within SSR contexts\
    \ involves careful delineation of environment-specific modules. Shared modules\
    \ that do not have state effects and are required on both server and client can\
    \ be factored out into common chunks. Meanwhile, environment-specific code such\
    \ as API calls or file system operations present exclusively on the server must\
    \ be segregated to avoid runtime errors on the client. Rollup's manual chunks\
    \ enable manual deciding, while dynamic import() facilitate asynchronous loading\
    \ at runtime, underpinned by optimized chunks generated during the build.\n\n\
    Asset delivery plays a significant role in SSR performance, particularly with\
    \ static assets like CSS, images, and fonts referenced in both server and client\
    \ bundles. Inline CSS extracted during the server render phase can markedly reduce\
    \ render-blocking resources, improving load times. Rollup plugins such as rollup-plugin-postcss\
    \ and rollup-plugin-url are instrumental in handling style extraction and asset\
    \ embedding or emission. For assets that cannot be inlined, generating hashed\
    \ filenames and corresponding manifest files ensures efficient client cache invalidation\
    \ and consistent asset referencing across server and client outputs.\n\nAn exemplary\
    \ Rollup configuration template encapsulates these principles. The server build\
    \ entry point includes the main application rendering logic and indicates externalization\
    \ of node modules. For example:\n\n```javascript\nexport default [\n// Server\
    \ bundle\n{\n  input: 'src/entry-server.js',\n  output: {\n    dir: '/dist/server/',\n\
    \    format: 'cjs',\n    exports: 'auto',\n  },\n  external: ['express', 'fs',\
    \ 'path', /* other node externals *],\n  plugins: ['/* plugins for server build\
    \ */'],\n},\n// Client bundle\n{\n  input: 'src/entry-client.js',\n  output: {\n\
    \    dir: '/dist/client/',\n    format: 'esm',\n    sourcemap: true,\n  },\n}\n\
    ];\n```\n"
  mdcn: "\n\nShadow DOM 是封装的核心，它提供了全局文档无法访问的作用域样式和 DOM 结构，防止了样式泄漏或冲突。利用 Shadow DOM\
    \ 可以确保组件无论外部页面的框架样式如何，都能正常运行。`mode` 参数控制 shadow 根节点是否可以通过 JavaScript 访问（`'mode':\
    \ 'open'`）或被完全封装（`'mode': 'closed'`），从而提供了对封装的细粒度控制。\n\n框架无关的开发并不需要在组件内部构建特定框架的\
    \ API 或模板引擎。相反，模板化应该依赖原生能力或轻量级、独立于库。通过事件分发和属性/属性观察简化了数据绑定的复杂性，从而保留了跨不同环境的可移植性。\n\
    \nReact、Angular 或 Vue 等框架之间的互操作性取决于对自定义元素（Custom Element）生命周期以及每个框架如何与 DOM 元素交互的理解。例如，React\
    \ 需要处理自定义元素的属性和事件监听器；底层元素分发原生自定义事件（Custom Events），这些事件可以通过映射进行监听（例如，'onChange'\
    \ 绑定到 change 事件）。\n\n为了广泛使用，打包组件面临着挑战：\n\n- **模块兼容性**：Web Components 通常利用 ES 模块（ESM）进行导入/导出语义。Rollup\
    \ 或 Webpack 等打包器可以配置为输出 ESM 或 UMD/IIFE 格式以获得更广泛的兼容性。除非组件服务器端渲染，否则通常没有必要支持 Node.js\
    \ 风格的 CommonJS。\n- **依赖管理**：最小化极端依赖可以降低分体积并减少版本冲突。内联关键依赖或将其标记为 `peerDependencies`\
    \ 可以让组件一致地管理库版本。\n- **Polyfill（垫填充）**：对旧版设备的支持（如 IE11）需要自定义元素、Shadow DOM 和 ES模块的\
    \ polyfill。打包可以有条件地包含 polyfill 或单独记录必要的导入，以防止包膨胀。\n- **CSS 封装**：Shadow DOM 内部的样式避免了全局\
    \ CSS 冲突。然而，采用 CSS 变量和样式表可以在不牺牲封装性的前提下增强其可维护性。\n\n一种高级的打包策略涉及生成多个入口点：\n\n- 一个带有\
    \ ES6+ 语法的标准 ESM 包，以针对现代浏览器和 Rollup、Vite 等工具优化。\n- 一个兼容 ESM 的 UMD 包，包含针对旧版环境的相关\
    \ polyfill。\n- 一个用于直接注入 script 标签的单文件 UMD/IIFE 包。\n\n使用 Rollup 打包 Web Component的示例配置：\n\
    \n```javascript\nexport default {\n  input: 'src/my-element.js',\n  output: {\n\
    \    file: 'dist/my-element.js',\n    format: 'esm',\n  },\n  plugins: [babel({\
    \ babelHelpers: 'bundled', presets: ['@babel/preset-env']})],\n},\n{\n  input:\
    \ 'src/my-element.js',\n  output: {\n    file: 'dist/my-element.umd.js',\n   \
    \ format: 'umd',\n  },\n  plugins: [babel({ babelHelpers: 'bundled', presets:\
    \ [['@babel/preset-env', { targets: '> 0.25%, no }]})])],\n};\n```\n\n可以使用现代 ECMAScript\
    \ 规范中引入的私有类字段和方法进一步紧固组件的封装。这些特性保护内部实现不受意外的外部变异，这是库级组件设计中的关键考量。\n\n互操作性还扩展到了基础属性和事件之外的通信模式。CustomEvent\
    \ 接口支持详细的有效负载，使组件能够在不更改 API 签名的情况下广播丰富的数据；采用插槽（slots）增强了内容投影而不违反封装，允许用户在注入任意标记的同时保留样式和逻辑的隔离。\n\
    \n通过混入函数（mixins）或装饰器（decorators）扩展自定义元素有助于代码复用和特定领域的扩展，而不会牺牲模块化。例如，应用本地化混入函数可以封装翻译，同时让核心元素专注于结构性问题。\n\
    \n声明性 Shadow DOM（Declarative Shadow DOM）等标准的出现进一步增强了 HTML 标记指定 Shadow DOM 内容的能力，简化了服务器端渲染和注水（hydration），同时保留了封装和互操作性。\n\
    \n总的来说，策略性组合的 Web Components 和自定义元素实现了可扩展、高性能且可维护的 UI 架构，能够优雅地集成到异构的前端生态系统中。在封装、打包和跨通信中采用最佳实践，确保了在不牺牲组件设计完整性或样式隔离的情况下实现最大化复用。\n\
    \n## 8.3 服务器端渲染与 SSR 打包\n\n通用应用需要打包的二分方法，要求服务器端和客户端和谐共存。通过这种方式实现的服务端渲染（SSR）过程增强了性能。SSR\
    \ 包确保了应用程序的初始 HTML 在服务器上生成，并通过更快的内容呈现时间提供更好的用户体验。使用 Rollup 实现这一目标需要注水机制、执行代码分割策略并优化资源交付。\n\
    \nSSR 打包的核心在于两个独立但相互依赖的输出概念：服务器包（它在 Node.js 环境中执行以生成 HTML 标记）和客户端包（其随后通过交互性更新这些标记）。Rollup\
    \ 灵活的配置允许通过利用多个输入和输出选项来创建并行包。通常，服务器包被编译为 CommonJS 或 ES 模块格式，并排除外部依赖，以减小包体积并保留原生\
    \ Node.js 模块。相比之下，客户端包是为适用于浏览器环境的格式制作的，通常是 ES 模块或立即调用函数表达式（IIFE），并包含所有依赖以确保运行时的完整性。\n\
    \n注水（Hydration）充当服务器渲染的标记与完全交互的客户端应用程序之间的桥梁。它通过附加事件监听器和恢复应用状态来对静态 HTML 进行“重新注水”。这至关重要，因为服务器包交付的只是无交互的标记，没有客户端控制。Rollup\
    \ 通过代码分割简化了注水过程，使得逻辑隔离的块可以按需加载。这种分段输出确保了初始仅传输最少的 JavaScript，将关键脚本推迟到交互或导航需要时加载。它还允许映射组件级边界，通过避免不必要的计算进一步提升用户体验。\n\
    \n在 SSR 上下文中实现高效分割涉及对环境特定模块进行仔细的界定。没有状态影响且在服务器和客户端都需要的共享模块可以提取到公共块（common chunks）。同时，仅存在服务器上的环境特定代码（如\
    \ API 调用或文件系统操作）必须隔离，以避免在客户端出现运行时错误。Rollup 的手动块（manual chunks）允许手动决策，而动态 `import()`\
    \ 则促进了运行时的异步加载，并以构建期间生成的优化块为支撑。\n\n资源交付在 SSR 性能中起着重要作用，特别是服务器和客户端包中引用的 CSS、图像和字体等静态资源。在服务器渲染阶段提取的内联\
    \ CSS 可以显著减少阻塞资源，提高加载速度。Rollup 插件（如 `rollup-plugin-postcss` 和 `rollup-plugin-url`）在处理样式提取和资源嵌入或输出方面起着关键作用。对于无法内联的资源，生成哈希文件名和相应的清单文件可以确保高效的客户端缓存失效以及跨服务器和客户端输出的资源引用。\n\
    \n一个示例性的 Rollup 配置模板封装了这些原则。服务器构建入口点包含主应用程序渲染逻辑，并指示了 node 模块的外部化。例如：\n\n```javascript\n\
    export default [\n// 服务器包\n{\n  input: 'src/entry-server.js',\n  output: {\n \
    \   dir: '/dist/server/',\n    format: 'cjs',\n    exports: 'auto',\n  },\n  external:\
    \ ['express', 'fs', 'path', /* other node externals *],\n  plugins: ['/* plugins\
    \ for server build */'],\n},\n// 客户端包\n{\n  input: 'src/entry-client.js',\n  output:\
    \ {\n    dir: '/dist/client/',\n    format: 'esm',\n    sourcemap: true,\n  },\n\
    }\n];\n```\n\n"
