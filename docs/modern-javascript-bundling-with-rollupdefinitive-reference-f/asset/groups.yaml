    Rollup 开发视角视角。


    ## 9.1 审计与供应链安全


    现代软件开发高度依赖于复杂的软件供应链，其中依赖经常跨越多个组织、平台和语言。随着软件供应链复杂性的增加，风险面也随之扩大，因此需要严谨的方法来审计依赖、检测漏洞并保护整个构建和部署生态系统。有效的审计和供应链实践必须集成先进工具、自动化和策略执行，以确保持续保障并缓解威胁。


    依赖引入了潜在的漏洞，攻击者可以利用这些漏洞破坏系统或注入恶意代码。因此，管理依赖需要一种多层策略，结合出处验证、漏洞扫描和依赖卫生。出处验证确保来自受信任源的组件保持不变。软件包的密码签名和可重现构建是该领域的的基础技术。可重现构建允许验证二进制产物与源代码完全对应，防止在编译或打包期间插入未经授权的修改。


    漏洞扫描通过查询漏洞数据库（如国家漏洞数据库 NVD、GitHub 安全公告或供应商特定的存储库）分析依赖项的已知安全问题。扫描器通过解析依赖清单文件和锁文件工作，将软件包版本与报告的告警进行匹配。高保真度的漏洞检测受益于最新的数据库、上下文感知匹配（例如考虑已修补的提交和反向移植的修复）以及持续集成/部署（CI/CD）流水线的集成。现代扫描器通过静态应用安全测试
    (SAST) 扩展了功能，通过检查源代码来发现表面枚举之外的潜在安全弱点。


    维护准确且精简的依赖图可以减少攻击面。这涉及定期审计由直接依赖间接引入的传递依赖、识别遗弃或未维护的包，并消除不必要的组件。自动化工具可以通过生成详细的依赖树、突出过时的包以及执行策略（例如禁止具有高风险漏洞或与组织标准不兼容许可的包）来促进这一过程。


    安全的供应链架构集成了自动化监控和执行机制，以确保构建过程的完整性。这些方法的核心是持续监控——对依赖变化、安全告警和构建产物的持续自动化观察。持续监控系统消耗安全馈、存储库元数据和构建日志以检测偏差或异常。例如，依赖版本的突然变化或意外的外部拉取可能会触发告警或预防措施。


    为了锁定构建过程，某些组织采用了声明式构建规范模型，其中所有依赖、构建指令和环境配置都编码在版本控制的清单中。这种方法确保了可重现性和追溯性。与 CI/CD
    流水线的集成会在每次构建期间调用自动审计，如果检测到阈值漏洞或违反策略，则停止部署。此外，密闭环境（hermetic environments）封装了整个构建过程，限制了外部网络访问并使用产物缓存防止未经验证的代码进入构建。


    若干开源和商业解决方案促进了依赖审计和供应链安全的自动化：


    ```

    # Install Trivy

    curl -sf https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh
    | sh -

    ```


    ```

    # Scan application dependencies

    trivy fs --severity HIGH,CRITICAL --exit-code 1

    ```


    ```

    # Integrate as a CI step

    trivy fs /src --severity HIGH,CRITICAL --exit-code 1

    ```


