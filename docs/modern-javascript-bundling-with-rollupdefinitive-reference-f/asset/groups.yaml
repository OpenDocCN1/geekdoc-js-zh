    # 第 2 章

    ## Rollup 基础与架构


    Rollup 不仅仅是一个工具——它是一种 JavaScript 交付的哲学，旨在让 ES （ES modules）成为一等公民，并为开发者提供精简、预测的构建。在本章中，我们将揭秘
    Rollup 的基础，揭示其设计动机和架构决策。探索输入、输出和插件如何在 Rollup 流水线中汇聚，并深入底层，查看 Rollup 如何在现代 JavaScript
    生态系统中实现速度、灵活性和精准。


    ## 2.1 Rollup 的设计哲学


    Rollup 架构的核心是一组旨在最大化包效率和开发者体验的指导原则。这些原则源于对现代 JavaScript 打包工具固有权衡的仔细考虑，这些工具传统上在可配置性、性能和输出质量之间寻求平衡。Rollup
    通过强调原生 ES 模块支持并保持简单性脱颖而出，优先考虑那些可能导致复杂性和次优默认值的广泛配置选项。


    Rollup 的设计哲学锚定于对 ECMAScript 模块（ESM）的一等支持，反映了 JavaScript 生态系统不断发展的格局。与从 CommonJS
    或其他模块格式开始早期构建器不同，Rollup 的构建是为了利用 ES 模块的静态结构来实现更有效的优化。这种对原生 ESM 的理解允许 Rollup 对模块依赖进行精确的静态分析，从而促进树摇优化（tree-shaking）等高级技术。


    树摇优化（移除未使用的代码）关键取决于 ES 模块提供的导入和导出的静态可分析性。Rollup 的静态分析解析每个模块的语法树，以精确识别哪些导出被下游引用。这与动态或不透明的模块系统形成对比，在这些系统中，导入和导出只能在运行时解析。通过完全遵循
    ECMAScript 标准指定的 ES 模块语义，Rollup 确保了可以可靠地消除未使用的代码，从而产生更小、更高效的包。


    此外，专注于 ES 模块使 Rollup 的输出与现代浏览器和 JavaScript 运行环境轨迹一致，这些环境越来越多地原生支持 ES 模块而无需转换。这种前瞻性的方法减少了补丁（polyfills）或模块封装引入的运行时开销，增强了运行时性能和可调试性。


    Rollup 设计的另一个基石是刻意避免过度可配置。虽然其他打包工具提供了无数选项和插件钩子，旨在处理极其广泛场景，但 Rollup 选择了精简的配置表面，坚持合理的默认值和清晰、最小的配置需求。


    这种简单性带来了多优势。从开发者的角度来看，它降低了入门门槛。用户无需花费数小时调整复杂的配置对象并与插件不兼容问题作斗，而是可以用最少的设置获得最佳结果。这减少了认知负荷并加速了开发周期。


    从架构角度来看，简单使得 Rollup 能够优化核心编译路径，而不会被适应每个边缘情况或遗留模块系统集成所负担。通过限制其范围，Rollup 避免了配置膨胀的陷阱，这通常会导致性能下降和构建流水线脆弱。


    这种哲学延伸到插件生态系统，Rollup 在其中鼓励使用可组合、专注的插件，增强核心能力的同时不会让系统负担不堪。插件的模块化和可组合性平衡了扩展性与核心稳定性，允许开发者在不牺牲可维护性的情况下高效地定制工具。


    对原生 ES 模块和简单性的双重承诺带来了了包质量的切实改进。通过精确的树摇，Rollup 生成的包排除了死代码，减小了负载大小并缩短了网络传输时间。消除影响遗留模块封装的必要样板代码进一步精简了包的内容。


    除了尺寸减小，Rollup 的输出往往更具可读性和可维护性。由于它默认生成符合 ES 模块规范的包，输出保持了模块边界，并在适用处保持了表达性的导入/导出语句。这种行为有助于调试和构建后检查，不像那些经常输出不透明运行时代码或阻碍可追踪性的单体包的打包器。


    此外，Rollup 的静态链接能力允许跨模块常量折叠（constant folding）和内联等高级优化，进一步提高了运行时效率。生成的包不仅更小，而且通过减少间接和不必要的抽象而运行得更快。


    Rollup 对简单性和符合标准的关注显著提升了开发者体验。开发者受益于基于 ES 模块规范的可预测行为，减少了打包过程中的意外。直截了当的配置和更少的活动部分意味着更少的构建错误和更更容易的故障排除。


    Rollup 提供的高效且最小的快速迭代反馈循环缩短了构建时间，特别是在较小项目或强调模块化开发的场景中。这种速度允许集成到开发工作流和持续集成流水线中，而不牺牲性能。


    Rollup 还与现代 JavaScript 语言特性集成，包括静态导入、动态导入和代码分割，且无需复杂的配置。这种兼容性确保开发者可以自然地利用尖端语言语法和模块模式，而不损害打包质量或代码连贯性。


    虽然强调了简单性，但 Rollup 并不灵活。它基于插件的系统提供了一种优雅的机制来扩展功能，而不会使核心设计复杂。插件实现了转换、处理、与 Babel 或
    TypeScript 等转换器的集成以及环境嵌入。这些能力允许 Rollup 优雅地适应各种项目需求，同时保留其极简的核心。


    这种严谨的设计鼓励 Rollup 作者专注于定义明确的职责，培养了一个插件可组合且保持高代码质量的生态系统。这种模块化防止了核心部分被小众功能过度拥挤，同时允许用户根据需要定制构建。


    Rollup 的设计是一种经过仔细权衡的折中，将输出质量和开发者清晰度优于详尽的可配置性。这种选择接受了 Rollup 可能无法开箱即覆盖所有的遗留用例或工作流，但为采用现代
    JavaScript 范式的项目提供了卓越的结果。


