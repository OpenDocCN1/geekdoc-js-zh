    \ 'runtime'` 可以通过 `@babel/runtime` 避免重复内联辅助函数。`manualChunks` 函数显式地将 polyfills\
    \ 分到 `vendor-polyfills` 块中，实现了缓存并减少了重复交付。\n\n## 处理项目特定的转换\n\n许多项目需要自定义 Babel 插件或特定的转换逻辑，以反映独特的领域或架构模式。在\
    \ Rollup 中集成此类 polyfills 需要仔细的执行顺序。通常，项目特定的 Babel 转换应该放置在更通用的预设（presets）之前，以实现细粒度控制并避免冲突。\n\
    \n此外，从 Babel 转换流水线中排除外部依赖（例如通过 `exclude: 'node_modules/**'`）如果依赖项包含了现代语法，可能会导致问题。在这种情况下，显式的包含列表或针对性的覆盖可以在构建速度和兼容性之间取得平衡：\n\
    \n```javascript\nbabel({\n  babelHelpers: 'bundled',\n  include: ['src/**', 'node_modules/some-esm-package/**'],\n\
    \  extensions: ['.js', '.jsx']\n});\n```\n\n这种包含处理选择性地转换了具有现代语法的特定依赖，消除了在缺乏原生支持的环境中的运行时错误。\n\
    \n## 性能考虑与陷阱\n\n对于大型代码库，转换和打包时间可能会显著增加。缓解这一问题需要多层层的方法：\n\n- **缓存**：利用 Rollup 的缓存和\
    \ Babel 的缓存目录选项来高效复用构建。\n- **并发处理**：使用工作线程或并行化的 Babel 转换（通过社区插件）来分配 CPU 负载。\n\
    - **依赖分析**：修剪或懒加载很少使用的依赖项，以减少整体转换代码的占用。\n- **跳过不必要的转换**：调整 `preset-env` 目标和插件配置，以避免不必要的\
    \ polyfills 和转换。\n\n一个常见的陷阱源于无意的双重转换，特别是在 Babel 配置多变的 monorepo 或多包语文中。这可能导致冲突的转换、意想不到的\
    \ bug 或膨胀的包。统一 Babel 配置或合并包之间的插件版本可以防止异常。\n\nRollup 的树摇优化（tree-shaking）也高度依赖 Babel\
    \ 保留的 ES 模块语义。因此，在转换到 CommonJS 时，确保输出为纯 ESM 对于有效的死代码消除至关重要。这通常通过将 `@babel/preset-env`\
    \ 中的 `modules` 选项设置为 `false` 来实现：\n\n```javascript\n['babel/preset-env', { modules:\
    \ 'false', targets: { ... } }]\n```\n\n未这样做会导致 Rollup 的静态分析失效，抵消了其核心优势之一。\n\n\
    ## 高级集成模式总结\n\n在 Rollup 中深度集成 Babel 继续于在转换保真度、polyfill 管理和构建性能之间维持微妙的平衡。谨慎使用 Babel\
    \ 的自动 polyfill 注入、利用运行时辅助函数并结构化 Rollup 的手动块，可以优化输出大小和运行时效率。选择性包含依赖项和项目特定的 Babel\
    \ 插件确保了在不牺牲扩展性的情况下保持兼容性。\n\n对构建时间和包大小进行持续分析，并对生成的代码进行警惕检查，提供了必要的反馈以最终确定配置。最终，Babel\
    \ 和 Rollup 的这种复杂编排提升了大规模现代 JavaScript 应用的稳健性和可维护性。\n\n## 7.2 全面 TypeScript 工作流\n\
    \n高效集成基于 Rollup 的 TypeScript 项目需要一种多方面的方法，解决转换、类型检查、声明文件生成以及在各种工具生态系统中维持兼容性的问题。本节详细分析了每个关键组件，阐明了驱动生产级配置并实现和谐开发与构建流水线的策略。\n\
    \n## 使用 Rollup 和 TypeScript 进行无缝转换\n\n启用 TypeScript 的 Rollup 的基石是转换过程，将 '.ts'\
    \ 源码转换为浏览器或 Node.js 兼容的 JavaScript。虽然 Rollup 擅长打包，但它天生缺乏对 TypeScript 的原生理解。因此，委托的插件（主要是\
    \ `rollup-plugin-typescript2` 或官方的 `@rollup/plugin-typescript`）的作用至关重要。\n\n对于健壮的项目，推荐的插件仍然是\
    \ `rollup-plugin-typescript2`，因为它具有增量构建、错误报告和支持声明文件提取等高级功能。其配置集中于指定项目的 `tsconfig.json`\
    \ 以保持一致性：\n\n```javascript\nimport typescript from 'rollup-plugin-typescript2';\n\
    \nexport default {\n  input: 'src/index.ts',\n  output: {\n    file: 'dist/bundle.js',\n\
    \    format: 'esm',\n    sourcemap: true,\n  },\n  plugins: [\n    typescript({\n\
    \      tsconfig: './tsconfig.json',\n      clean: true,\n    }),\n  ]\n}\n```\n\
    \n关键在于，`config` 选项触发缓存失效，且 `declarationDir` 使输出与工具的预期保持一致。\n\n## 健壮的类型检查集成\n\n\
    虽然许多工具可以实时转换 TypeScript，但利用 Rollup 插件进行完全类型检查对于大型项目来说是不切实际的性能限制。因此，常见且推荐的方法是将类型检查与打包解耦：\n\
    \n- **基于 CLI 的类型检查**：直接运行 TypeScript 编译器。\n- **IDE 集成**：如 VS Code 等编辑器持续调用语言服务，提供实时反馈。\n\
    - **持续集成检查**：在 CI 流水线中嵌入 `tsc --noEmit` 以强制严格性。\n\n通过从 Rollup 运行时卸载类型检查，可以在开发期间实现快速增量构建。\n\
    \n## 声明文件生成与发布策略\n\n生成声明文件 (.d.ts）对于任何依赖静态信息的 TypeScript 项目都是必不可少的。Rollup 插件可以生成这些文件，但通常依赖\
    \ TypeScript 编译器的内置机制：\n\n```json\n{\n  \"compilerOptions\": {\n    \"declaration\"\
