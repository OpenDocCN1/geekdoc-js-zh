    \ 模块系统演化的不同阶段，并在浏览器和服务器支持、tree shaking 能力以及包兼容性方面有所不同。\n\n## CommonJS (CJS)\n\n\
    CommonJS 是 Node.js 环境传统上支持的模块标准。在这种格式中，模块使用同步 `require` 和通过 `exports` 导出对象来定义。这种同步加载范式非常适合服务器端使用，但对于没有打包工具或加载器\
    \ shim 的浏览器并不适用。\n\n构建工具配置中的典型 CJS 输出指定：\n\n```javascript\n{\n  format: 'cjs',\n\
    \  exports: 'auto',\n  dir: 'dist/cjs'\n}\n```\n\n由于 CJS 模块是立即执行并同步运行的，它们不利于静态分析。因此，现代包无法对\
    \ CJS 输出执行有效的 tree shaking，可能导致包体积较大。对于面向服务器的部署或 Node.js CLI 工具，CJS 仍然是最兼容且最简单直接的选择，特别是在涉及旧版本\
    \ Node.js 时。\n\n## ES Modules (ESM)\n\nES Modules 是 2015 年引入的标准化 JavaScript 模块系统。它们使用\
    \ `import` 和 `export` 语句，能够对依赖进行静态分析，从而促进高级优化（如 tree shaking 和作用域提升）。ESM 模块异步异步执行并支持顶层\
    \ `await`。\n\n针对 ESM 的构建配置通常指定：\n\n```javascript\n{\n  format: 'esm',\n  dir:\
    \ 'dist/esm',\n  exports: 'named'\n}\n```\n\nESM 模块可以在现代浏览器和 Node.js 12 及以上版本中原生消费，使其成为\
    \ Web 应用和现代 JavaScript 包的优选格式。然而，早期 Node.js 版本或不支持 ESM 的工具生态系统可能需要转换或与 CJS 并行发布。\n\
    \n生产纯 ESM 输出促进了能够实现高效客户端加载和最小运行时开销的分发模型。然而，它需要清晰的包元数据（例如 package.json 中的 \"module\"\
    \ 字段），以引导打包器和运行时进行模块解析。\n\n## 通用模块定义 (UMD)\n\nUMD 作为一种互操作格式出现，用于桥接浏览器和 Node.js\
    \ 之间的模块加载。它将模块定义封装在一个工厂函数中，该函数检测环境，作为 AMD、CommonJS 加载，或将导出赋值给全局对象。\n\n典型的 UMD\
    \ 构建配置类似于：\n\n```javascript\n{\n  format: 'umd',\n  name: 'MyLibrary',\n  file:\
    \ 'dist/umd/my-library.js',\n  exports: 'named'\n}\n```\n\nUMD 输出特别适用于旨在通过 `<script>`\
    \ 标签直接在浏览器中使用或在缺乏原生模块支持的旧环境中的库。它们提供了兼容多个加载器和全局使用上下文的单文件。`name` 选项定义了导出将挂载的全局命名空间。\n\
    \n一个关键的权衡是，由于封装器的的开销且缺乏 ESM 中那样的静态分析能力，UMD 需要更大的体积，限制了 tree shaking 的效果。此外，UMD\
    \ 模块依赖全局变量。\n\n## 立即调用函数表达式 (IIFE)\n\nIIFE 格式将模块封装在一个自执行函数中，适用于在没有加载器的情况下在浏览器中使用。典型的\
    \ IIFE 配置为：\n\n```javascript\n{\n  format: 'iife',\n  name: 'MyLibrary',\n  file:\
    \ 'dist/iife/my-library.js'\n}\n```\n\n## 权衡与策略\n\n考虑到目标环境和消费偏好，项目通常采用多格式发布以最大化覆盖：\n\
    \n- **Node.js 应用**：优先选择 CJS 以保持兼容性。\n- **浏览器库**：UMD 用于旧支持，IIFE 用于简单的脚本引入。\n- **现代\
    \ Web 应用**：ESM 用于 tree shaking。\n\n一种常见的模式是同时提供 CJS 和 ESM 构建，分别在 \"main\" 和 \"\
    module\" 字段中引用。这使得 Node.js 环境默认加载 CJS，而浏览器消费 ESM 版本。\n\n# 特性总结\n\n| 格式 | 环境 |\
    \ 加载 | Tree-Shaking | 服务器端 |\n|---|---|---|---|---|\n| CJS | Node.js (旧版) | 同步\
    \ | 有限 | 完全 |\n| ESM | 现代浏览器, Node.js | 异步 | 完整 | 中等 |\n| UMD | 浏览器, Node.js |\
    \ 条件加载 | 有限 | 通用 |\n| IIFE | 浏览器 (script 标签) | 无 (立即) | 无 | 简单 |\n\n在构建流水线中整合多种输出格式允许库作者和应用开发者应对各种生态系统需求，而无需碎片化代码。理解模块加载行为、兼容性、优化潜力和生态工具之间的权衡，对于有效的多格式发布和分发至关重要。\n\
    \n## 5.6 针对现代浏览器和边缘交付进行优化\n\n# 针对浏览器能力的定制构建\n\n"
