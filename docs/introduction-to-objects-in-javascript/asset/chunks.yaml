  trans: "\n随着你的 JavaScript 应用复杂性增加，你可能会遇到希望防止对对象进行修改的情况。JavaScript 提供了两种强大的方法来控制对象的可变性：`Object.freeze()`\
    \ 和 `Object.seal()`。这些方法允许你从不同程度上锁定对象，提供不可变性并防止意外的更改。\n\n### `Object.freeze()`：创建不可变对象\n\
    \n`Object.freeze()` 是使对象变得不可变的最严格的方法。当封冻结一个对象时：\n\n1. 你不能向其添加新属性。\n2. 你不能删除现已的属性。\n\
    3. 你不能修改现有属性的值。\n4. 你不能更改现有属性的配置性、可写性或枚举性。\n\n这里是 `Object.freeze()` 工作原理的示例：\n\
    \n```\nconst person = {name: 'John Doe',\n  age: 30,\n  address: {street: '123\
    \ Main St',\n    city: 'Anytown' }\n};\nObject.freeze(person);\n// 尝试修改被冻结的对象\n\
    person.name = 'Jane Doe'; // 在非严格模式下这将会静默失败\nperson.newProperty = 'This won't\
    \ be added';\ndelete person.age; // 这也会失败\nconsole.log(person); // 输出: { name:\
    \ 'John Doe', age: 30, address: { street: '123 Main St', city: 'Anytown' } }\n\
    ```\n\n在此示例中，在冻结 `person` 对象后，所有修改尝试都会被忽略。该对象保持其原始状态。\n\n需要注意的是，`Object.freeze()`\
    \ 执行的是浅层冻结。如果对象包含嵌套对象或数组，它们的属性仍然可以被修改：\n\n```\nperson.address.street = '456 Elm\
    \ St'; // 这将生效\nconsole.log(person.address.street); // 输出: '456 Elm St'\n```\n\
    \n要实现深层冻结，你需要递归地对所有嵌套对象应用 `Object.freeze()`。\n\n### `Object.seal()`：防止扩展和删除\n\n\
    与 `Object.freeze()` 相比，`Object.seal()` 是一个限制稍小的方法。当你密封一个对象时：\n\n1. 你不能向其添加新属性。\n\
    2. 你不能删除现已的属性。\n3. 你可以修改现有属性的值。\n4. 你不能更改现有属性的配置性或枚举性。\n\n这里是 `Object.seal()`\
    \ 工作原理的示例：\n\n```\nconst car = {make: 'Toyota',\n  model: 'Corolla',\n  year:\
    \ 2020\n};\nObject.seal(car);\n// 允许修改现有属性\ncar.year = 2021;\n// 尝试添加或删除属性\ncar.color\
    \ = 'red'; // 在非严格模式下这将会静默失败\ndelete car.model; // 这也会失败\nconsole.log(car); //\
    \ 输出: { make: 'Toyota', model: 'Corolla', year: 2021 }\n```\n\n在此示例中，我们可以修改被密封的\
    \ `car` 对象的 `year` 属性，但不能添加新属性或删除现有属性。\n\n### 检查对象状态\n\nJavaScript 提供了方法来检查对象是否被冻结或密封：\n\
    \n```\nconst frozenObj = Object.freeze({});\nconst sealedObj = Object.seal({});\n\
    const normalObj = {};\nconsole.log(Object.isFrozen(frozenObj)); // true\nconsole.log(Object.isSealed(frozenObj));\
    \ // true (冻结的对象也是密封的)\nconsole.log(Object.isSealed(sealedObj)); // true\nconsole.log(Object.isFrozen(sealedObj));\
    \ // false\nconsole.log(Object.isSealed(normalObj)); // false\nconsole.log(Object.isFrozen(normalObj));\
    \ // false\n```\n\n### 冻结和密封对象的用例\n\n1. **常量**：当你有在程序执行期间永远不更改的配置对象或设置时。\n2. **防止意外修改**：在大型代码库中，冻结对象可以帮助防止代码部分的意外修改。\n\
    3. **API 响应**：当处理 API 响应时，你想确保它们在整个应用程序中保持不被修改。\n4. **不可变数据结构**：在你的应用中实现不可变数据模式，这可以导致更可预测的状态管理。\n\
    5. **安全性**：在某些情况下，冻结对象可以防止某些依赖于修改对象属性的攻击。\n\n通过理解并利用 `Object.freeze()` 和 `Object.seal()`，你可以对对象的可变性进行细粒度的控制，从而编写出更健壮、更可预测的代码。\n\
    \n## 理解属性的枚举性和配置性\n\n在 JavaScript 中处理对象时，理解属性描述的概念至关重要。对象中的每个属性不仅有一个值，还有一组定义其行为的属性。两个重要的属性是枚举性和配置性。这些属性对属性在各种语境和操作中的行为起着重要作用。\n\
    \n### 属性描述\n\n在深入研究枚举性和配置性之前，让我们回顾对象属性的四个主要属性：\n\n1. **值 (Value)**：存储在属性中的实际数据。\n\
    2. **可写性 (Writable)**：决定属性的值是否可以更改。\n3. **枚举性 (Enumerable)**：决定属性是否会出现在 `for...in`\
    \ 循环或 `Object.keys()` 等操作中。\n4. **配置性 (Configurable)**：决定属性是否可以被删除或其属性是否可以被修改。\n\
    \n### 枚举性\n\n属性的枚举性决定了在枚举对象属性时是否会被包含在内。这影响了 JavaScript 中的许多操作：\n\n1. `for...in`\
    \ 循环\n2. `Object.keys()`\n3. `JSON.stringify()`\n4. `Object.assign()`\n\n默认情况下，通过赋值或对象字面量创建的属性是枚举的。然而，JavaScript\
    \ 中的许多内置属性不是枚举的。\n\n这里有一个演示枚举性的示例：\n\n```\nconst person = {name: 'John Doe',\n\
    \  age: 30\n};\nObject.defineProperty(person, 'ssn', {\n  value: '123-45-6789',\n\
    \  enumerable: false\n});\nconsole.log(Object.keys(person)); // ['name', 'age']\n\
    for (let prop in person) {\n  console.log(prop); // name, age\n}\nconsole.log(person.ssn);\
    \ // '123-45-6789'\n```\n\n在此示例中，`ssn` 属性不是枚举的，所以它不会出现在 `Object.keys()` 或 `for...in`\
    \ 循环中，尽管我们仍然可以直接访问它的值。\n\n### 配置性\n\n属性的配置性决定了是否可以从对象删除删除删除以及其属性是否可以修改。\n\n当属性是不可配置的时：\n\
    \n1. 它无法从对象中删除。\n2. 它的属性（枚举性和配置性外）无法被更改。\n3. 对于数据属性，它无法转换为访问器属性，反之亦然。\n4. 对于数据属性，可写属性只能从\
    \ `true` 更改为 `false`。\n\n这里有一个演示配置性的示例：\n\n```\nconst config = {apiKey: 'abc123'};\n\
    Object.defineProperty(config, 'apiKey', {\n  configurable: false\n});\ndelete\
    \ config.apiKey; // 在非严格模式下这将静默失败\nconsole.log(config.apiKey); // 'abc123'\n//\
    \ 尝试重新定义属性将抛出错误\nObject.defineProperty(config, 'apiKey', {\n  enumerable: false\n\
    }); // 抛出 TypeError\n```\n\n在此示例中，将 `apiKey` 设置不可配置后，我们无法删除它或更改其属性。\n\n### 检查和修改属性描述\n\
    \nJavaScript 提供了检查和修改属性的方法：\n\n1. `Object.getOwnPropertyDescriptor()`：返回对象上指定属性的属性描述符。\n\
    \n```\nconst person = { name: 'John' };\nconsole.log(Object.getOwnPropertyDescriptor(person,\
    \ 'name'));\n// 输出: { value: 'John', writable: true, enumerable: true, configurable:\
    \ true }\n```\n\n2. `Object.defineProperty()`：直接在对象上定义新属性，或修改现有属性，并返回该对象。\n\n\
    ```\nconst car = {};\nObject.defineProperty(car, 'model', {\n  value: 'Toyota',\n\
    \  writable: false,\n  enumerable: true,\n  configurable: false\n});\ncar.model\
    \ = 'Honda'; // 在非严格模式下这将静默失败\nconsole.log(car.model); // 'Toyota'\n```\n"
- fmt: "\n## Object.defineProperties()\n\nDefines new or modifies existing properties\
    \ directly on an object, returning the object.\n\n```javascript\nconst  product\
    \  = {}; Object.defineProperties(product, {\n\n  name: { value:  'Laptop', writable:\
    \  true },price: { value:  1000, writable:  false }\n\n}); console.log(product.name);\
    \ // 'Laptop' product.price  =  1200; // This will fail silently in non-strict\
    \ mode console.log(product.price); // 1000 \n```\n\n## Practical Applications\n\
    \nUnderstanding and leveraging enumerability and configurability can be beneficial\
    \ in several scenarios:\n\n1. API Design: When creating objects that represent\
    \ public APIs, you can use these attributes to control which properties are visible\
    \ and modifiable.\n\n2. Data Privacy: By making certain properties non-enumerable,\
    \ you can create \"hidden\" properties that don't show up in general property\
    \ listings.\n\n3. Preventing Modifications: Making properties non-configurable\
    \ can protect critical object properties from being accidentally deleted or modified.\n\
    \n4. Performance Optimization: In some cases, making properties non-enumerable\
    \ can slightly improve performance in operations that enumerate object properties.\n\
    \n5. Implementing Getter-only Properties: By combining non-writable and non-configurable\
    \ attributes with a getter, you can create read-only computed properties.\n\n\
    ```javascript\nconst  circle  = {radius:  5 }; Object.defineProperty(circle, 'area',\
    \ {\n\n  get: function() { return  Math.PI  *  this.radius  *  this.radius; },\n\
    \n  enumerable:  true,\n\n  configurable:  false }); console.log(circle.area);\
    \ // ~78.54 circle.area  =  100; // This will be ignored \n```\n\nBy mastering\
    \ the concepts of enumerability and configurability, you gain finer control over\
    \ your objects' behavior and structure. This knowledge allows you to create more\
    \ robust, secure, and performant code, especially when designing complex systems\
    \ or libraries meant for wider use.\n\nIn conclusion, advanced object features\
    \ like getters and setters, freezing and sealing objects, and understanding property\
    \ attributes provide powerful tools for creating sophisticated and well-controlled\
    \ JavaScript applications. By leveraging these features, you can write more maintainable,\
    \ secure, and efficient code, enhancing your ability to design complex systems\
    \ and APIs.\n\n# Chapter 9: Working with Built-In Objects\n\nJavaScript provides\
    \ a rich set of built-in objects that offer powerful functionality out of the\
    \ box. These objects are an integral part of the language and are designed to\
    \ handle common programming tasks efficiently. In this chapter, we'll explore\
    \ some of the most frequently used built-in objects in JavaScript, focusing on\
    \ `Math`, `Date`, and `JSON`. We'll delve into their properties and methods, and\
    \ provide practical examples to illustrate their usage in real-world scenarios.\n\
    \n## Overview of Common Built-In Objects in JavaScript\n\nBefore we dive into\
    \ specific built-in objects, let's take a moment to understand what built-in objects\
    \ are and why they're important. Built-in objects are predefined objects that\
    \ come with JavaScript and are available for use in your code without the need\
    \ for additional imports or installations. They provide a standardized way to\
    \ perform common operations, ensuring consistency across different JavaScript\
    \ environments.\n\nSome of the advantages of using built-in objects include:\n\
    \n1. Consistency: Built-in objects behave the same way across different browsers\
    \ and JavaScript environments, reducing cross-platform compatibility issues.\n\
    \n2. Efficiency: These objects are optimized for performance, often leveraging\
    \ native implementations for better speed.\n\n3. Convenience: They save developers\
    \ time by providing ready-to-use methods for common tasks, reducing the need to\
    \ reinvent the wheel.\n\n4. Standardization: Built-in objects are part of the\
    \ ECMAScript specification, ensuring a common baseline of functionality across\
    \ all JavaScript implementations.\n\nNow, let's explore three of the most commonly\
    \ used built-in objects: `Math`, `Date`, and `JSON`.\n\n## Math Object\n\nThe\
    \ `Math` object in JavaScript is a static object that provides properties and\
    \ methods for mathematical constants and functions. It's particularly useful for\
    \ performing mathematical operations that go beyond basic arithmetic.\n\n### Properties\
    \ of the Math Object\n\nThe `Math` object includes several mathematical constants\
    \ as properties. Here are some of the most commonly used ones:\n\n1. `Math.PI`:\
    \ Represents the ratio of a circle's circumference to its diameter (approximately\
    \ 3.14159).\n\n2. `Math.E`: Represents Euler's number, the base of natural logarithms\
    \ (approximately 2.718).\n\n3. `Math.LN2`: Represents the natural logarithm of\
    \ 2 (approximately 0.693).\n\n4. `Math.LN10`: Represents the natural logarithm\
    \ of 10 (approximately 2.303).\n\n### Methods of the Math Object\n\nThe `Math`\
    \ object provides a wide array of mathematical functions. Let's explore some of\
    \ the most frequently used methods:\n\n1. `Math.abs(x)`: Returns the absolute\
    \ value of a number.\n\n```javascript\nconsole.log(Math.abs(-5)); // Output: 5\
    \ console.log(Math.abs(3.14)); // Output: 3.14 \n```\n\n2. `Math.round(x)`: Rounds\
    \ a number to the nearest integer.\n\n```javascript\nconsole.log(Math.round(4.7));\
    \ // Output: 5 console.log(Math.round(4.4)); // Output: 4 \n```\n\n3. `Math.ceil(x)`:\
    \ Rounds a number up to the nearest integer.\n\n```javascript\nconsole.log(Math.ceil(4.1));\
    \ // Output: 5 console.log(Math.ceil(4.9)); // Output: 5 \n```\n\n4. `Math.floor(x)`:\
    \ Rounds a number down to the nearest integer.\n\n```javascript\nconsole.log(Math.floor(4.9));\
    \ // Output: 4 console.log(Math.floor(4.1)); // Output: 4 \n```\n\n5. `Math.max(x,\
    \ y, ...)`: Returns the largest of zero or more numbers.\n\n```javascript\nconsole.log(Math.max(5,\
    \ 10, 15)); // Output: 15 console.log(Math.max(-5, -10, -15)); // Output: -5 \n\
    ```\n\n6. `Math.min(x, y, ...)`: Returns the smallest of zero or more numbers.\n\
    \n```javascript\nconsole.log(Math.min(5, 10, 15)); // Output: 5 console.log(Math.min(-5,\
    \ -10, -15)); // Output: -15 \n```\n\n7. `Math.pow(x, y)`: Returns the base to\
    \ the exponent power, that is, x^y.\n\n```javascript\nconsole.log(Math.pow(2,\
    \ 3)); // Output: 8 console.log(Math.pow(4, 0.5)); // Output: 2 (square root of\
    \ 4) \n```\n\n8. `Math.random()`: Returns a pseudo-random number between 0 and\
    \ 1.\n\n```javascript\nconsole.log(Math.random()); // Output: A random number\
    \ between 0 and 1 \n```\n\n9. `Math.sqrt(x)`: Returns the square root of a number.\n\
    \n```javascript\nconsole.log(Math.sqrt(16)); // Output: 4 console.log(Math.sqrt(2));\
    \ // Output: 1.4142135623730951 \n```\n\nThese methods provide a solid foundation\
    \ for performing various mathematical operations in JavaScript. They're particularly\
    \ useful in scenarios involving geometry, statistics, or any application that\
    \ requires complex mathematical calculations.\n\n## Date Object\n\nThe `Date`\
    \ object is used for working with dates and times in JavaScript. It allows you\
    \ to create, manipulate, and format dates, making it an essential tool for any\
    \ application that deals with time-based operations.\n\n### Creating Date Objects\n\
    \nThere are several ways to create a `Date` object:\n\n1. Current date and time:\n\
    \n```javascript\nlet  now  =  new  Date(); console.log(now); // Output: Current\
    \ date and time \n```\n\n2. Specific date and time:\n\n```javascript\nlet  specificDate\
    \  =  new  Date(2023, 5, 15, 20, 30, 0); console.log(specificDate); // Output:\
    \ 2023-06-15T20:30:00 (Note: months are zero-indexed) \n```\n\n3. From a date\
    \ string:\n\n```javascript\nlet  dateFromString  =  new  Date(\"2023-06-15T20:30:00\"\
    ); console.log(dateFromString); // Output: 2023-06-15T20:30:00 \n```\n\n4. From\
    \ timestamp (milliseconds since January 1, 1970):\n\n```javascript\nlet  dateFromTimestamp\
    \  =  new  Date(1623789000000); console.log(dateFromTimestamp); // Output: 2021-06-15T20:30:00\
    \ \n```\n\n### Methods of the Date Object\n\nThe `Date` object provides numerous\
    \ methods for getting and setting various components of a date. Here are some\
    \ commonly used methods:\n\n1. Getting date components:\n"
