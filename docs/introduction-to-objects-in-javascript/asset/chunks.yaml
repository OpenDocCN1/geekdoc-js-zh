    \            }));\n        } catch (error) {\n            console.error('Error\
    \ fetching forecast:', error);\n            return null;\n        }\n    }\n};\n\
    \n// Usage\nasync function displayWeather() {\n    let currentWeather = await\
    \ weatherService.getWeather('London');\n    console.log('Current weather in London:',\
    \ currentWeather);\n    let forecast = await weatherService.getForecast('London');\n\
    \    console.log('3-day forecast for London:', forecast);\n}\ndisplayWeather();\n\
    ```\n\nThis `weatherService` object encapsulates the logic for making API calls\
    \ to a weather service. It provides methods that abstract away the complexities\
    \ of working with the API directly, making it easier to use in other parts of\
    \ the application.\n\n### 5. Mixins and Composition\n\n`Object` methods can be\
    \ used to implement mixins, a way of adding functionality to objects through composition\
    \ rather than inheritance.\n\nExample: Mixin for adding logging capabilities\n\
    \n```javascript\nlet loggableMixin = {\n    log(message) {\n        console.log(`[${new\
    \ Date().toISOString()}] ${this.name || 'Unknown'}: ${message}`);\n    },\n  \
    \  error(message) {\n        console.error(`[${new Date().toISOString()}] ERROR\
    \ - ${this.name || 'Unknown'}: ${message}`);\n    }\n};\n\nlet userService = {\n\
    \    name: 'UserService',\n    users: [],\n    addUser(user) {\n        this.users.push(user);\n\
    \        this.log(`Added user: ${user.name}`);\n    },\n    removeUser(userId)\
    \ {\n        let index = this.users.findIndex(u => u.id === userId);\n       \
    \ if (index !== -1) {\n            this.users.splice(index, 1);\n            this.log(`Removed\
    \ user with ID: ${userId}`);\n        } else {\n            this.error(`User with\
    \ ID ${userId} not found`);\n        }\n    }\n};\n\n// Adding logging capabilities\
    \ to userService\nObject.assign(userService, loggableMixin);\n\n// Usage\nuserService.addUser({\
    \ id: 1, name: 'Alice' });\nuserService.removeUser(2);\n```\n\nIn this example,\
    \ we define a `loggableMixin` with logging methods. We then use `Object.assign()`\
    \ to add these methods to our `userService` object, enhancing its functionality\
    \ without changing its core implementation.\n\nThese practical use cases demonstrate\
    \ the versatility and power of object methods in JavaScript. They allow for clean,\
    \ modular, and maintainable code by encapsulating related functionality within\
    \ objects. As you continue to work with JavaScript, you'll find many more situations\
    \ where object methods provide elegant solutions to complex programming challenges.\n\
    \n## Conclusion\n\nIn this chapter, we've explored the world of methods in JavaScript\
