    \n## `JSON` 对象\n\n`JSON`（JavaScript 对象表示法）是一种轻量级的数据交换格式，易于人类读写，也易于机器解析和生成。`JavaScript`\
    \ 中的 `JSON` 对象提供了解析 `JSON` 字符串以及将值转换为 `JSON`的方法。\n\n### `JSON` 对象的方法\n\n`JSON`\
    \ 对象有两个主要方法：\n\n1.  `JSON.parse()`：解析 `JSON` 字符串并构建由字符串描述的 `JavaScript` 值或对象。\n\
    \n```javascript\nlet jsonString = '{\"name\":\"John\",\"age\":30,\"city\":\"New\
    \ York\"}'; let obj = JSON.parse(jsonString); console.log(obj.name); // Output:\
    \ John console.log(obj.age); // Output: 30 console.log(obj.city); // Output: New\
    \ York\n```\n\n2.  `JSON.stringify()`：将 `JavaScript` 值转换为 `JSON` 字符串。\n\n```javascript\n\
    let obj = {name: \"John\",\n  age: 30,\n  city: \"New York\" }; let jsonString\
    \ = JSON.stringify(obj); console.log(jsonString); // Output: {\"name\":\"John\"\
    ,\"age\":30,\"city\":\"New York\"}\n```\n\n### 处理复杂对象\n\n`JSON` 可以处理嵌套对象和数组：\n\
    \n```javascript\nlet complexObj = {name: \"John\",\n  age: 30,\n  address: {street:\
    \ \"123 Main St\",\n    city: \"New York\",\n    country: \"USA\" },hobbies: [\"\
    reading\", \"swimming\", \"coding\"]\n}; let jsonString = JSON.stringify(complexObj);\
    \ console.log(jsonString); // Output: {\"name\":\"John\",\"age\":30,\"address\"\
    :{\"street\":\"123 Main St\",\"city\":\"New York\",\"country\":\"USA\"},\"hobbies\"\
    :[\"reading\",\"swimming\",\"coding\"]}   let parsedObj = JSON.parse(jsonString);\
    \ console.log(parsedObj.address.city); // Output: New York console.log(parsedObj.hobbies[1]);\
    \ // Output: swimming\n```\n\n### 使用 Replacer 和 Space 的 `JSON.stringify()`\n\n\
    `JSON.stringify()` 方法可以接受额外的参数来自定义字符串化过程：\n\n```javascript\nlet obj = {name: \"\
    John\",\n  age: 30,\n  city: \"New York\" }; // 使用 replacer 函数 let jsonString1\
    \ = JSON.stringify(obj, (key, value) => {if(typeof value === \"string\") {\n \
    \   return value.toUpperCase();\n  }\n  return value;\n}, 2); console.log(jsonString1);\
    \ /* Output:\n{\n  \"name\": \"JOHN\",\n  \"age\": 30,\n  \"city\": \"NEW YORK\"\
    \n}\n*/  // 使用数组作为 replacer let jsonString2 = JSON.stringify(obj, [\"name\", \"\
    city\"], 2); console.log(jsonString2); /* Output:\n{\n  \"name\": \"John\",\n\
    \  \"city\": \"New York\"\n}\n*/\n```\n\n在处理 API、存储数据或在服务器与 Web 之间传输数据时，`JSON`\
    \ 对象至关重要。它的简单性和通用性使其成为现代 Web 开发中数据交换的热门。\n\n## 内置对象的实际示例\n\n现在我们已经详细探索了 `Math`、`Date`\
    \ 和 `JSON` 对象，让我们来看一些演示这些对象如何在现实场景中使用的实际示例。\n\n### 示例 1：随机密码生成器\n\n此示例使用 `Math`\
    \ 对象来创建一个随机密码生成器：\n\n```javascript\nfunction generatePassword(length) {\n  const\
    \ charset = \"abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+\"\
    ;\n  let password = \"\";\n  for (let i = 0; i < length; i++) {\n    let randomIndex\
    \ = Math.floor(Math.random() * charset.length);\n    password += charset[randomIndex];\n\
    \  }\n  return password;\n} console.log(generatePassword(12)); // Output: 一个随机的\
    \ 12 位密码\n```\n\n### 示例 2：年龄计算器\n\n此示例使用 `Date` 对象来计算一个人的年龄：\n\n```javascript\n\
    function calculateAge(birthdate) {\n  const today = new Date();\n  const birthDate\
    \ = new Date(birthdate);\n  let age = today.getFullYear() - birthDate.getFullYear();\n\
    \  const monthDiff = today.getMonth() - birthDate.getMonth();\n  if (monthDiff\
    \ < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {\n    age--;\n\
    \  }\n  return age;\n} console.log(calculateAge(\"1990-05-15\")); // Output: 基于出生日的当前年龄\n\
    ```\n\n### 示例 3：JSON 数据持久化\n\n此示例演示了如何在本地存储中使用 `JSON` 进行数据持久化：\n\n```javascript\n\
    // 用户数据 let user = {name: \"John Doe\",\n  age: 30,\n  email: \"john@example.com\"\
    ,\n  preferences: {theme: \"dark\",\n    fontSize: \"medium\" }\n}; // 保存用户数据到本地存储\
    \ function saveUserData(user) {\n  localStorage.setItem(\"userData\", JSON.stringify(user));\n\
    } // 从本地存储获取用户数据 function getUserData() {\n  let userData = localStorage.getItem(\"\
    userData\");\n  return userData ? JSON.parse(userData) : null;\n} // 使用 saveUserData(user);\
    \ let retrievedUser = getUserData(); console.log(retrievedUser.name); // Output:\
    \ John Doe console.log(retrievedUser.preferences.theme); // Output: dark\n```\n\
    \n### 示例 4：倒计时器\n\n此示例结合了 `Math` 和 `Date` 对象来创建一个倒计时器：\n\n```javascript\nfunction\
    \ countdownTimer(targetDate) {\n  const now = new Date().getTime();\n  const target\
    \ = new Date(targetDate).getTime();\n  const difference = target - now;\n  const\
    \ days = Math.floor(difference / (1000 * 60 * 60 * 24));\n  const hours = Math.floor((difference\
    \ % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));\n  const minutes = Math.floor((difference\
    \ % (1000 * 60 * 60)) / (1000 * 60));\n  const seconds = Math.floor((difference\
    \ % (1000 * 60)) / 1000);\n  return `${days} days, ${hours} hours, ${minutes}\
    \ minutes, ${seconds} seconds`;\n} console.log(countdownTimer(\"2023-12-31\"));\
    \ // Output: 到指定日期的倒计时\n```\n\n### 示例 5：使用 Math 和 JSON 进行数据分析\n\n此示例同时使用 `Math`\
    \ 和 `JSON` 对象对 `JSON` 数据集进行简单的数据分析：\n\n"
