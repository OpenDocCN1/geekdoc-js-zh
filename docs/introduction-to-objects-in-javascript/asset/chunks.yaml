    \ car model let  sedan  =  Object.create(car); sedan.model  =  \"Sedan\"; sedan.passengers\
    \  =  5; console.log(sedan.type);  // vehicle (inherited from vehicle) sedan.start();\
    \  // The vehicle is starting... (inherited from vehicle) sedan.drive();  // The\
    \ car is driving... (inherited from car) console.log(sedan.wheels);  // 4 (inherited\
    \ from car) console.log(sedan.model);  // Sedan (own property) \n```\n\nIn this\
    \ example, we've created a chain of inheritance: `sedan` inherits from `car`,\
    \ which inherits from `vehicle`. This demonstrates how `Object.create()` can be\
    \ used to create multi-level inheritance structures.\n\n### Advantages of Using\
    \ `Object.create()`\n\n1. Direct Prototype Assignment: `Object.create()` allows\
    \ you to directly specify an object as the prototype of another object, making\
    \ the inheritance relationship explicit and easy to understand.\n\n2. No Constructor\
    \ Invocation: Unlike the `new` keyword with constructor functions, `Object.create()`\
    \ doesn't invoke a constructor function, giving you more control over object initialization.\n\
    \n3. Flexibility: You can easily create objects with any other object as their\
    \ prototype, not just constructor function prototypes.\n\n4. Pure Prototypal Inheritance:\
    \ It aligns well with JavaScript's prototypal nature, avoiding confusion that\
    \ can arise from trying to emulate class-based inheritance.\n\n### Using the Second\
    \ Parameter of `Object.create()`\n\nThe second parameter of `Object.create()`\
    \ allows you to define properties for the new object using property descriptors:\n\
    \n```javascript\nlet  person  =  Object.create(null, {\n\n    firstName: {value:\
    \  \"John\",\n\n        writable:  true,\n\n        enumerable:  true },lastName:\
    \ {value:  \"Doe\",\n\n        writable:  true,\n\n        enumerable:  true },fullName:\
    \ {get: function() {\n\n            return  this.firstName  +  \" \"  +  this.lastName;\n\
    \n        },\n\n        enumerable:  true }\n\n}); console.log(person.fullName);\
    \  // John Doe \n```\n\nThis approach gives you fine-grained control over property\
    \ attributes like writability, enumerability, and configurability.\n\n### Combining\
    \ `Object.create()` with Constructor Functions\n\nYou can also use `Object.create()`\
    \ in combination with constructor functions for a hybrid approach:\n\n```javascript\n\
    function  Animal(name) {\n\n    this.name  =  name;\n\n} Animal.prototype.speak\
    \  =  function() {\n\n    console.log(this.name  +  \" makes a sound.\");\n\n\
    }; function  Dog(name) {\n\n    Animal.call(this, name);\n\n} Dog.prototype  =\
    \  Object.create(Animal.prototype); Dog.prototype.constructor  =  Dog; Dog.prototype.bark\
    \  =  function() {\n\n    console.log(this.name  +  \" barks!\");\n\n}; let  dog\
    \  =  new  Dog(\"Buddy\"); dog.speak();  // Buddy makes a sound. dog.bark(); \
    \  // Buddy barks! \n```\n\nThis pattern allows you to leverage the benefits of\
    \ both constructor functions and `Object.create()`.\n\n### Limitations and Considerations\n\
    \nWhile `Object.create()` is powerful, it's important to be aware of its limitations:\n\
    \n1. Performance: Creating objects with `Object.create()` can be slightly slower\
    \ than object literals or constructor functions in some cases.\n\n2. Clarity:\
    \ For developers more accustomed to class-based languages, the prototypal inheritance\
    \ model might be less intuitive.\n\n3. Lack of Constructor Invocation: If you\
    \ need constructor-like initialization, you'll need to call methods explicitly\
    \ or combine with constructor functions.\n\n`Object.create()` offers a flexible\
    \ and powerful way to implement inheritance in JavaScript. It provides a clear\
    \ and direct method for creating objects with specific prototypes, aligning well\
    \ with JavaScript's prototypal nature. By understanding and utilizing `Object.create()`,\
    \ you can create more flexible and maintainable inheritance structures in your\
    \ JavaScript code, leveraging the full power of prototypal inheritance.\n\n# Chapter\
    \ 8: Advanced Object Features\n\n# ​❧​\n\n## Using Getters and Setters for Controlled\
    \ Property Access\n\nIn JavaScript, objects are the cornerstone of the language,\
    \ serving as the building blocks for complex data structures and providing a way\
    \ to encapsulate related functionality. As we delve deeper into the world of objects,\
    \ we encounter more advanced features that allow for greater control and flexibility\
    \ in how we interact with object properties. One such feature is the use of getters\
    \ and setters.\n\nGetters and setters are special methods that allow you to define\
    \ how a property is accessed or modified. They provide a way to execute code on\
    \ the reading or writing of a property, enabling you to add logic, validation,\
    \ or computed values without changing the way the property is used externally.\n\
    \n### Defining Getters\n\nA getter is a method that gets the value of a specific\
    \ property. When you access the property, the getter function is called, and the\
    \ returned value is used as the value of the property. Here's an example of how\
    \ to define a getter:\n\n```javascript\nconst  person  = {firstName:  'John',\n\
    \n  lastName:  'Doe',\n\n  get  fullName() {\n\n    return  `${this.firstName}\
    \  ${this.lastName}`;\n\n  }\n\n}; console.log(person.fullName); // Output: \"\
    John Doe\" \n```\n\nIn this example, `fullName` is a getter that combines `firstName`\
    \ and `lastName`. When we access `person.fullName`, the getter function is called,\
    \ and it returns the concatenated string.\n\nGetters are particularly useful for\
    \ computed properties or for providing read-only access to a property. They allow\
    \ you to encapsulate the logic for retrieving a value, which can be beneficial\
    \ for maintaining clean and organized code.\n\n### Defining Setters\n\nA setter\
    \ is a method that sets the value of a specific property. When you assign a value\
    \ to the property, the setter function is called with the new value as an argument.\
    \ Here's an example of how to define a setter:\n\n```javascript\nconst  person\
    \  = {firstName:  'John',\n\n  lastName:  'Doe',\n\n  set  fullName(name) {\n\n\
    \    const  parts  =  name.split(' ');\n\n    this.firstName  =  parts[0];\n\n\
    \    this.lastName  =  parts[1];\n\n  }\n\n}; person.fullName  =  'Jane Smith';\
    \ console.log(person.firstName); // Output: \"Jane\" console.log(person.lastName);\
    \  // Output: \"Smith\" \n```\n\nIn this example, the `fullName` setter takes\
    \ a full name as input, splits it into `firstName` and `lastName` properties,\
    \ and updates them accordingly.\n\nSetters are valuable for validating or transforming\
    \ data before it's assigned to a property. They provide a clean way to ensure\
    \ that the object's state remains consistent and valid.\n\n### Combining Getters\
    \ and Setters\n\nYou can use both getters and setters for the same property name,\
    \ creating a computed property with both read and write access:\n\n```javascript\n\
    const  circle  = {_radius:  5,\n\n  get  diameter() {\n\n    return  this._radius\
    \  *  2;\n\n  },\n\n  set  diameter(value) {\n\n    if (value  <=  0) {\n\n  \
    \    throw  new  Error('Diameter must be positive');\n\n    }\n\n    this._radius\
    \  =  value  /  2;\n\n  }\n\n}; console.log(circle.diameter); // Output: 10 circle.diameter\
    \  =  14; console.log(circle._radius); // Output: 7 \n```\n\nIn this example,\
    \ `diameter` is a computed property based on `_radius`. The getter calculates\
    \ the diameter, while the setter updates `_radius` based on the new diameter value,\
    \ including validation.\n\n### Benefits of Getters and Setters\n\n1. Encapsulation:\
    \ They allow you to hide the internal implementation details of how a property\
    \ is computed or stored.\n\n2. Validation: Setters can include logic to ensure\
    \ that only valid values are assigned to properties.\n\n3. Computed Properties:\
    \ Getters can return calculated values based on other properties.\n\n4. Backwards\
    \ Compatibility: You can start with simple properties and later add getters and\
    \ setters without changing the public interface of your objects.\n\nBy leveraging\
    \ getters and setters, you can create more robust and flexible objects that maintain\
    \ control over how their properties are accessed and modified, leading to cleaner\
    \ and more maintainable code.\n\n## Freezing and Sealing Objects with `Object.freeze()`\
    \ and `Object.seal()`\n"
