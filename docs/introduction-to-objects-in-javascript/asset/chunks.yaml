  trans: "\n3. 性能：对于简单的浅拷贝，性能差异可以忽略不计。但是，对于更复杂的操作或处理大量属性时，`Object.assign()` 可能稍微更快。\n\
    \n4. 原型：`Object.assign()` 复制可枚举的自身属性和原型链上的可枚举属性，而展开运算符只复制自身的可枚举属性。\n\n下面是一个说明处理原型属性差异的示例：\n\
    \n```\nlet  proto  = { x:  1 };\nlet  obj  =  Object.create(proto);\nobj.y  =\
    \  2;\nlet  copy1  =  Object.assign({}, obj);\nlet  copy2  = { ...obj };\nconsole.log(copy1.x);\
    \ // Output: 1\nconsole.log(copy2.x); // Output: undefined\n```\n\n### 何时使用每种方法\n\
    \n选择使用 `Object.assign()` 的场景：\n\n*   你想要原地修改现有对象。\n*   你需要从原型链复制属性。\n*   你所在的环境不支持展开运算符（尽管这种情况越来越少见）。\n\
    \n选择使用展开运算符的场景：\n\n*   你想要创建新对象而不修改原始对象。\n*   你更喜欢更简洁的语法，尤其是在合并多个对象时。\n*   你只想复制自身的可枚举属性。\n\
    *   你正在使用 React 或其他强调不可变性的库。\n\n实际上，由于展开运算符语法更简洁，并且非常适合不可变编程模式，因此在现代 JavaScript\
    \ 中通常更受欢迎。但是，了解这两种方法可以让你灵活地为特定用例选择最合适的工具。\n\n请记住，这两种方法都执行浅拷贝。对于嵌套对象的深拷贝，你需要使用其他技术或实现自定义深拷贝函数，如上一节所述。\n\
    \n掌握这些拷贝技术，你将能更好地处理 JavaScript 中的对象操作，从而编写更清晰、更可预测的代码，并减少应用程序中意外的副作用。\n\n# 第 7\
    \ 章：原型与继承\n\n# ​❧​   （这是章节分隔符，保持原样。）\n\n## 什么是原型？\n\n在 JavaScript 的广阔领域中，原型是一个基本概念，支撑着语言面向对象编程的方法。从本质上讲，原型是一种允许对象从其他对象继承属性和方法的机制。这个概念在\
    \ JavaScript 中如此重要，以至于人们常说\"JavaScript 中一切皆对象\"，进而延伸为每个对象都有一个原型。\n\n要真正理解原型，让我们深入探讨它们的本质和目的：\n\
    \n### 原型的本质\n\n想象你正在构建一个庞大的知识库。在这个图书馆里，你有大量的书籍，每本书代表 JavaScript 中的一个对象。现在，你不必在每本书中写入所有信息，而是创建一个参考系统。这个参考系统允许书籍在需要时\"\
    借用\"其他书籍的信息。在 JavaScript 中，这个参考系统就是原型。\n\nJavaScript 中的每个对象都有一个内部属性，通常表示为 `[[Prototype]]`。这个属性是对另一个对象的引用，也就是当前对象的原型。当你尝试访问对象上的属性或方法时，JavaScript\
    \ 首先直接在对象上查找。如果找不到，它会沿着原型链向上查找，检查对象的原型，然后是原型的原型，以此类推，直到找到该属性或到达链的末端。\n\n### 可视化原型\n\
    \n让我们用一个简单的例子来可视化这个概念：\n\n```\nlet  animal  = {eats:  true,\n    sleep: function()\
    \ {\n        console.log(\"Zzz...\");\n    }\n};\nlet  rabbit  = {jumps:  true\
    \ };\nrabbit.__proto__  =  animal;\nconsole.log(rabbit.eats);  // true\nrabbit.sleep();\
    \  // Zzz...\n```\n\n在这个例子中，rabbit 是一个具有自身属性 jumps 的对象。但是，我们已经将它的原型设置为 animal\
    \ 对象。这意味着 rabbit 现在可以像访问自己的属性和方法一样访问 animal 的属性和方法。\n\n### 构造函数的作用\n\n原型与 JavaScript\
    \ 中的构造函数密切相关。当你使用构造函数创建对象时，该对象会自动获得一个指向构造函数 prototype 属性的原型。\n\n```\nfunction\
    \  Dog(name) {\n    this.name  =  name;\n}\nDog.prototype.bark  =  function()\
    \ {\n    console.log(this.name  +  \" says Woof!\");\n};\nlet  rover  =  new \
    \ Dog(\"Rover\");\nrover.bark();  // Outputs: Rover says Woof!\n```\n\n在这个例子中，rover\
    \ 是 Dog 的一个实例，它从 `Dog.prototype` 继承了 bark 方法。\n\n### 原型的威力\n\n原型提供了几个优势：\n\n1.\
    \  内存效率：每个对象不必携带所有方法的副本，它们可以通过原型链共享方法。\n2.  动态特性：你可以通过修改共享原型来改变多个对象的行为。\n3.  灵活性：原型允许一种不同于基于类的语言的灵活继承形式。\n\
    \n当我们更深入地研究 JavaScript 中的原型和继承时，请记住，这个系统构成了语言中对象交互和共享功能的基础。这是一个强大的工具，当被正确理解和使用时，可以带来更高效、更灵活\
    \ code 结构。\n\n## JavaScript 中的原型链\n\n原型链是 JavaScript 中一个基本概念，它建立在原型概念的基础上。它是一种允许对象从其他对象继承属性和方法的机制，创建了一条可以延伸多层的继承链。\n\
    \n### 理解原型链\n\n把原型链想象成一系列相连的链接，其中每个链接代表一个对象。当你尝试访问对象上的属性或方法时，JavaScript 会沿着这些链接前进，在每一步搜索请求的属性或方法。\n\
    \n让我们分解这个过程：\n\n1.  JavaScript 首先直接在对象上查找属性或方法。\n2.  如果找不到，它会在对象的原型上查找。\n3.  如果仍然找不到，它会在原型的原型上查找。\n\
    4.  这个过程会持续进行，直到找到该属性或到达链的末端（通常是 `Object.prototype`）。\n5.  如果到达链末端后仍未找到该属性，JavaScript\
    \ 返回 undefined。\n\n### 可视化原型链\n\n为了更好地理解这个概念，让我们创建一个更复杂的例子：\n\n```\n// Base object\n\
    let  animal  = {eats:  true,\n    sleep: function() {\n        console.log(\"\
    Zzz...\");\n    }\n};\n// Object inheriting from animal\nlet  mammal  =  Object.create(animal);\n\
    mammal.warmBlooded  =  true;\n// Object inheriting from mammal\nlet  dog  =  Object.create(mammal);\n\
    dog.bark  =  function() {\n    console.log(\"Woof!\");\n};\n// Instance of dog\n\
    let  rover  =  Object.create(dog);\nrover.name  =  \"Rover\";\nconsole.log(rover.name);\
    \        // Rover (own property)\nconsole.log(rover.bark());      // Woof! (inherited\
    \ from dog)\nconsole.log(rover.warmBlooded); // true (inherited from mammal)\n\
    console.log(rover.eats);        // true (inherited from animal)\nrover.sleep();\
    \                  // Zzz... (inherited from animal)\n```\n\n在这个例子中，我们有一个原型链：rover\
    \ -> dog -> mammal -> animal -> `Object.prototype` -> null。\n\n### Object.prototype\
    \ 的作用\n\n每个原型链的末端都是 `Object.prototype`。这是 JavaScript 中最基本的原型，所有对象最终都从它继承。它提供了几个对所有对象都可用的有用方法：\n\
    \n*   `toString()`\n*   `valueOf()`\n*   `hasOwnProperty()`\n*   `isPrototypeOf()`\n\
    \n例如：\n\n```\nconsole.log(rover.hasOwnProperty('name'));  // true\nconsole.log(rover.toString());\
    \  // [object Object]\n```\n\n### 性能考虑\n\n"
- fmt: "\nWhile the prototype chain is powerful, it's important to be aware of its\
    \ performance implications. The longer the prototype chain, the more time it takes\
    \ for JavaScript to look up properties. This is especially true for properties\
    \ that don't exist, as JavaScript has to traverse the entire chain before returning\
    \ undefined.\n\n### Breaking the Chain\n\nIt's possible to create objects with\
    \ no prototype by passing `null` to `Object.create()`:\n\n```javascript\nlet noProto\
    \ = Object.create(null); console.log(noProto.toString); // undefined \n```\n\n\
    This creates an object that doesn't inherit from `Object.prototype`, which can\
    \ be useful in certain scenarios where you want a truly \"blank\" object.\n\n\
    ### The instanceof Operator\n\nThe `instanceof` operator uses the prototype chain\
    \ to determine if an object is an instance of a particular constructor function:\n\
    \n```javascript\nfunction Cat() {} let whiskers = new Cat(); console.log(whiskers\
    \ instanceof Cat); // true console.log(whiskers instanceof Object); // true console.log(whiskers\
    \ instanceof Array); // false \n```\n\nUnderstanding the prototype chain is crucial\
    \ for mastering JavaScript. It's the foundation of inheritance in the language\
    \ and plays a key role in how objects behave and interact. As you work with JavaScript,\
    \ you'll find that a solid grasp of the prototype chain will help you write more\
    \ efficient and powerful code, leveraging the full potential of JavaScript's object-oriented\
    \ capabilities.\n\n## Adding Properties and Methods to Prototypes\n\nOne of the\
    \ most powerful features of JavaScript's prototype system is the ability to dynamically\
    \ add properties and methods to existing objects and constructors. This capability\
    \ allows for flexible and efficient code organization, as well as the ability\
    \ to extend and modify behavior across multiple instances of an object.\n\n###\
    \ Adding to Constructor Prototypes\n\nWhen you add a property or method to a constructor's\
    \ prototype, all instances of that constructor will have access to the new property\
    \ or method. This is particularly useful for adding shared functionality to multiple\
    \ objects.\n\nLet's explore this with an example:\n\n```javascript\nfunction Book(title,\
    \ author) {\n    this.title = title;\n    this.author = author;\n} // Adding a\
    \ method to the prototype\nBook.prototype.getSummary = function() {\n    return\
    \ `${this.title} was written by ${this.author}.`;\n}; // Creating instances\n\
    let book1 = new Book(\"The Great Gatsby\", \"F. Scott Fitzgerald\");\nlet book2\
    \ = new Book(\"To Kill a Mockingbird\", \"Harper Lee\");\nconsole.log(book1.getSummary());\
    \ // The Great Gatsby was written by F. Scott Fitzgerald.\nconsole.log(book2.getSummary());\
    \ // To Kill a Mockingbird was written by Harper Lee. \n```\n\nIn this example,\
    \ we've added the `getSummary` method to `Book.prototype`. Now, all instances\
    \ of `Book` have access to this method, without the need to define it separately\
    \ for each instance.\n\n### Benefits of Adding to Prototypes\n\n1. **Memory Efficiency**:\
    \ By adding methods to the prototype instead of the constructor, we ensure that\
    \ the method is created only once and shared among all instances, rather than\
    \ being recreated for each instance.\n2. **Dynamic Updates**: Changes to the prototype\
    \ affect all instances, even those created before the change.\n3. **Inheritance**:\
    \ Prototypes form the basis of inheritance in JavaScript, allowing objects to\
    \ inherit properties and methods from other objects.\n\n### Adding Properties\
    \ to Prototypes\n\nWhile it's more common to add methods to prototypes, you can\
    \ also add properties:\n\n```javascript\nBook.prototype.genre = \"Fiction\"; console.log(book1.genre);\
    \ // Fiction console.log(book2.genre); // Fiction \n```\n\nHowever, be cautious\
    \ when adding primitive values to prototypes, as they are shared across all instances.\
    \ This can lead to unexpected behavior if you're not careful.\n\n### Extending\
    \ Built-in Objects\n\nJavaScript allows you to extend the prototypes of built-in\
    \ objects like `Array`, `String`, or `Object`. While this can be powerful, it's\
    \ generally considered a risky practice known as \"monkey-patching\":\n\n```javascript\n\
    Array.prototype.first = function() {\n    return this[0];\n}; let numbers = [1,\
    \ 2, 3, 4, 5]; console.log(numbers.first()); // 1 \n```\n\nWhile this works, it\
    \ can lead to naming conflicts and unexpected behavior in other parts of your\
    \ code or third-party libraries. It's generally recommended to avoid modifying\
    \ built-in prototypes unless you have a very good reason to do so.\n\n### The\
    \ Object.create() Method\n\n`Object.create()` provides another way to implement\
    \ inheritance and add properties to prototypes:\n\n```javascript\nlet animalMethods\
    \ = {eat: function() {\n        console.log(`${this.name} is eating.`);\n    },\n\
    \    sleep: function() {\n        console.log(`${this.name} is sleeping.`);\n\
    \    }\n}; function createAnimal(name) {\n    let animal = Object.create(animalMethods);\n\
    \    animal.name = name;\n    return animal;\n} let dog = createAnimal(\"Buddy\"\
    ); dog.eat(); // Buddy is eating. dog.sleep(); // Buddy is sleeping. \n```\n\n\
    This approach allows for explicit control over the prototype.\n\n### Best Practices\n\
    \nWhen adding to prototypes, keep these best practices in mind:\n\n1. **Don't\
    \ Overwrite the Prototype**: Instead of completely overwriting a prototype (e.g.,\
    \ `Constructor.prototype = {...}`), add to it to preserve the constructor.\n2.\
    \ **Use Descriptive Names**: Choose clear, descriptive names for methods to avoid\
    \ conflicts.\n3. **Be Consistent**: If you're adding methods to prototypes, do\
    \ so consistently across your codebase.\n4. **Consider Performance**: While prototypes\
    \ are generally efficient, be mindful of the impact when adding many properties.\n\
    5. **Document Your Changes**: Especially when working in a team, make sure to\
    \ document any additions to prototypes.\n\nAdding properties and methods to prototypes\
    \ is a powerful technique in JavaScript. By understanding and judiciously applying\
    \ this, you can create more flexible and maintainable code.\n\n## Using Object.create()\
    \ for Inheritance\n\n`Object.create()` is a powerful method in JavaScript that\
    \ provides a clean and flexible way to implement inheritance. Introduced in ECMAScript\
    \ 5, this method allows you to create a new object with a specified prototype,\
    \ offering a more direct approach to setting up prototype chains compared to constructor\
    \ functions.\n\n### The Basics of Object.create()\n\nThe `Object.create()` method\
    \ takes two parameters:\n\n1. The object that should be the prototype of the newly\
    \ created object.\n2. (Optional) An object whose enumerable own properties specify\
    \ property descriptors to be added to the created object.\n\nHere's a basic example:\n\
    \n```javascript\nlet animal = {eats: true,\n    sleep: function() {\n        console.log(\"\
    Zzz...\");\n    }\n}; let rabbit = Object.create(animal); rabbit.jumps = true;\
    \ console.log(rabbit.eats); // true rabbit.sleep(); // Zzz... console.log(rabbit.jumps);\
    \ // true \n```\n\nIn this example, `rabbit` is created with `animal` as its prototype.\
    \ It inherits the `eats` property and `sleep` method from `animal`, and has its\
    \ own `jumps` property.\n\n### Implementing Inheritance with Object.create()\n\
    \n`Object.create()` provides a straightforward way to implement inheritance in\
    \ JavaScript. Let's look at a more complex example:\n\n```javascript\n// Base\
    \ object let vehicle = {type: \"vehicle\",\n    start: function() {\n        console.log(\"\
    The vehicle is starting...\");\n    }\n}; // Creating a car object that inherits\
    \ from vehicle\nlet car = Object.create(vehicle); car.wheels = 4; car.drive =\
    \ function() {\n    console.log(\"The car is driving...\");\n};\n```\n"
