  trans: "\n\n## Object.defineProperties()\n\n直接在对象上定义新属性或修改现有属性，并返回该对象。\n\n```javascript\n\
    const  product  = {}; Object.defineProperties(product, {\n\n  name: { value: \
    \ 'Laptop', writable:  true },price: { value:  1000, writable:  false }\n\n});\
    \ console.log(product.name); // 'Laptop' product.price  =  1200; // 在非严格模式下这将静默失败\
    \ console.log(product.price); // 1000 \n```\n\n## 实际应用\n\n理解并利用枚举性（enumerability）和可性（configurability）在多种场景中都有益：\n\
    \n1. API 设计：在创建代表公共 API 的对象时，你可以使用这些属性来控制哪些属性是可见且可修改的。\n\n2. 数据隐私：通过将某些属性设置为不可枚举，你可以创建出不会在常规属性列表中显示的“隐藏”属性。\n\
    \n3. 防止修改：将属性设置为不可配置，可以保护关键对象属性不被意外删除或修改。\n\n4. 性能优化：在某些情况下，将属性设置为不可枚举可以略微提高枚举对象属性的操作性能。\n\
    \n5. 实现仅 Getter 的属性：通过将不可写和不可配置属性与 getter 结合，你可以创建只读的计算属性。\n\n```javascript\n\
    const  circle  = {radius:  5 }; Object.defineProperty(circle, 'area', {\n\n  get:\
    \ function() { return  Math.PI  *  this.radius  *  this.radius; },\n\n  enumerable:\
    \  true,\n\n  configurable:  false }); console.log(circle.area); // ~78.54 circle.area\
    \  =  100; // 这将被忽略 \n```\n\n通过掌握枚举性和可配置性的概念，你对对象的行为和结构获得了更精细的控制。这些知识允许你创建更健壮、更安全且高效的代码，特别是在设计供更广泛使用的复杂系统或库时。\n\
    \n总之，高级对象特性（如 getters 和 setters、冻结和密封对象）以及理解属性为创建复杂且受控的 JavaScript 应用程序提供了强大的工具。通过利用这些特性，你可以编写出更具维护性、安全且高效的代码，增强你设计复杂系统和\
    \ API 的能力。\n\n# 第 9 章：使用内置对象\n\nJavaScript 提供了一组丰富的内置对象，它们开箱即提供了强大的功能。这些对象是语言不可或缺的一部分，设计用于高效处理常见的编程任务。在本章中，我们将探索\
    \ JavaScript 中最常用的内置对象，重点关注 `Math`、`Date` 和 `JSON`。我们将深入研究它们的属性和方法，并提供实际示例来说明它们在现实场景中的用法。\n\
    \n## JavaScript 常用内置对象概述\n\n在深入特定的内置对象之前，让我们花一点时间了解什么是内置对象以及它们为什么重要。内置对象是随 JavaScript\
    \ 一带的预定义对象，无需额外导入或安装即可在你的代码中使用。它们提供了一种执行常见操作的标准化方式，确保了在不同 JavaScript 环境下的一致性。\n\
    \n使用内置对象的某些优势包括：\n\n1. 一致性：内置对象在不同浏览器和 JavaScript 环境中的行为相同，减少了跨平台的兼容性问题。\n\n2.\
    \ 效率：这些对象针对性能进行了优化，通常利用原生实现以获得更好的速度。\n\n3. 便利性：它们通过为常见任务提供即插即用的方法为开发者节省了时间，减少了重复造轮子的需求。\n\
    \n4. 标准化：内置对象是 ECMAScript 的一部分，确保了所有 JavaScript 实现之间通用的功能基准。\n\n现在，让我们探索三个最常用的内置对象：`Math`、`Date`\
    \ 和 `JSON`。\n\n## Math 对象\n\nJavaScript 中的 `Math` 对象是一个静态对象，为数学常数和函数提供了属性和方法。它对于执行超出基础算术的数学运算特别有用。\n\
    \n### Math 对象的属性\n\n`Math` 对象包含了几个数学常量作为属性。以下是最常用的几个：\n\n1. `Math.PI`：代表圆周长与直径的比率（约\
    \ 3.14159）。\n\n2. `Math.E`：代表欧拉数，自然对数的底（约 2.718）。\n\n3. `Math.LN2`：代表 2 的自然对数（约\
    \ 0.693）。\n\n4. `Math.LN10`：代表 10 的自然对数（约 2.303）。\n\n### Math 对象的方法\n\n`Math`\
    \ 对象提供了大量的数学函数。让我们探索一些最常用的方法：\n\n1. `Math.abs(x)`：返回数字的绝对值。\n\n```javascript\n\
    console.log(Math.abs(-5)); // 输出: 5 console.log(Math.abs(3.14)); // 输出: 3.14 \n\
    ```\n\n2. `Math.round(x)`：将数字四舍五入到最近的整数。\n\n```javascript\nconsole.log(Math.round(4.7));\
    \ // 输出: 5 console.log(Math.round(4.4)); // 输出: 4 \n```\n\n3. `Math.ceil(x)`：将数字向上取整到最近的整数。\n\
    \n```javascript\nconsole.log(Math.ceil(4.1)); // 输出: 5 console.log(Math.ceil(4.9));\
    \ // 输出: 5 \n```\n\n4. `Math.floor(x)`：将数字向下取整到最近的整数。\n\n```javascript\nconsole.log(Math.floor(4.1));\
    \ // 输出: 5 console.log(Math.floor(4.9)); // 输出: 5 \n```\n*(注：原文示例中 Math.ceil(4.1)\
    \ 和 Math.floor(4.9) 的输出逻辑与方法名不符，此处按原文内容翻译)*\n\n5. `Math.max(x, ...)`：返回多个数字中的最大值。\n\
    \n```javascript\nconsole.log(Math.max(1, 5, 3)); // 输出: 5 \n```\n\n6. `Math.min(x,\
    \ ...)`：返回多个数字中的最小值。\n\n```javascript\nconsole.log(Math.min(1, 5, 3)); // 输出:\
    \ 1 \n```\n\n7. `Math.pow(x, y)`：返回 x 的幂，即 x^y。\n\n```javascript\nconsole.log(Math.pow(2,\
    \ 3)); // 输出: 8 console.log(Math.pow(4, 0.5)); // 输出: 2 \n```\n\n8. `Math.random()`：返回一个\
    \ 0 到 1 之间的随机数。\n\n```javascript\nconsole.log(Math.random()); // 输出: 0 到 1 之间的随机数\n\
    ```\n\n9. `Math.sqrt(x)`：返回数字的平方根。\n\n```javascript\nconsole.log(Math.sqrt(16));\
    \ // 输出: 4 console.log(Math.sqrt(2)); // 输出: 1.4142135623730951 \n```\n\n这些方法为\
    \ JavaScript 中的各种数学运算提供了基础。它们对于涉及几何、统计或任何需要复杂数学计算的应用特别有用。\n\n## Date 对象\n\n`Date`\
    \ 对象用于处理 JavaScript 中的日期和时间。它允许你创建、操作和格式化日期，是任何处理时间操作应用程序的必备工具。\n\n### 创建 Date\
    \ 对象\n\n有几种方法创建 `Date` 对象：\n\n1. 当前日期和时间：\n\n```javascript\nlet  now  =  new \
    \ Date(); console.log(now); // 输出: 当前日期和时间\n```\n\n2. 特定的日期和时间：\n\n```javascript\n\
    let  specificDate  =  new  Date(2023, 5, 15, 20, 30, 0); console.log(specificDate);\
    \ // 输出: 2023-06-15T20:30:00（注意：月份从 0 开始计数）\n```\n\n3. 从日期字符串：\n\n```javascript\n\
    let  dateFromString  =  new  Date(\"2023-06-15T20:30:00\"); console.log(dateFromString);\
    \ // 输出: 2023-06-15T20:30:00\n```\n\n4. 从时间戳（自 1970 年 1 月 1 日以来的毫秒）：\n\n```javascript\n\
    let  dateFromTimestamp  =  new  Date(1623789000000); console.log(dateFromTimestamp);\
    \ // 输出: 2021-06-15T20:30:00\n```\n\n### Date 对象的方法\n\n`Date` 对象提供了许多用于获取和设置日期各个组成部分的方法。以下是一些常用的方法：\n\
    \n1. 获取日期组件：\n\n"
- fmt: "\n# JavaScript Built-in Objects\n\n## Date Object\n\n### Basic Date Usage\n\
    \n```javascript\nlet date = new Date(2023, 5, 15, 20, 30, 0); console.log(date.getFullYear());\
    \ // Output: 2023 console.log(date.getMonth()); // Output: 5 (June, zero-indexed)\
    \ console.log(date.getDate()); // Output: 15 console.log(date.getHours()); //\
    \ Output: 20 console.log(date.getMinutes()); // Output: 30 console.log(date.getSeconds());\
    \ // Output: 0 console.log(date.getDay()); // Output: 4 (Thursday, 0 is Sunday)\n\
    ```\n\n### Setting Date Components\n\n```javascript\nlet date = new Date(2023,\
    \ 5, 15, 20, 30, 0); date.setFullYear(2024); date.setMonth(7); // August (zero-indexed)\
    \ date.setDate(20); date.setHours(10); date.setMinutes(45); date.setSeconds(30);\
    \ console.log(date); // Output: 2024-08-20T10:45:30\n```\n\n### Formatting Dates\n\
    \n```javascript\nlet date = new Date(2023, 5, 15, 20, 30, 0); console.log(date.toDateString());\
    \ // Output: Thu Jun 15 2023 console.log(date.toTimeString()); // Output: 20:30:00\
    \ GMT+0000 (Coordinated Universal Time) console.log(date.toISOString()); // Output:\
    \ 2023-06-15T20:30:00.000Z console.log(date.toLocaleString()); // Output: 6/15/2023,\
    \ 8:30:00 PM\n```\n\n### Comparing Dates\n\n```javascript\nlet date1 = new Date(2023,\
    \ 5, 15); let date2 = new Date(2023, 5, 20); console.log(date1 < date2); // Output:\
    \ true console.log(date1 > date2); // Output: false console.log(date1.getTime()\
    \ === date2.getTime()); // Output: false\n```\n\nThe `Date` object is invaluable\
    \ when working with time-based operations in `JavaScript`. It's commonly used\
    \ in applications that require scheduling, time tracking, or any functionality\
    \ that involves dates and times.\n\n## `JSON` Object\n\n`JSON` (`JavaScript` Object\
    \ Notation) is a lightweight data interchange format that is easy for humans to\
    \ read and write and easy for machines to parse and generate. The `JSON` object\
    \ in `JavaScript` provides methods for parsing `JSON` strings and converting values\
    \ to `JSON`.\n\n### Methods of the `JSON` Object\n\nThe `JSON` object has two\
    \ primary methods:\n\n1.  `JSON.parse()`: Parses a `JSON` string and constructs\
    \ the `JavaScript` value or object described by the string.\n\n```javascript\n\
    let jsonString = '{\"name\":\"John\",\"age\":30,\"city\":\"New York\"}'; let obj\
    \ = JSON.parse(jsonString); console.log(obj.name); // Output: John console.log(obj.age);\
    \ // Output: 30 console.log(obj.city); // Output: New York\n```\n\n2.  `JSON.stringify()`:\
    \ Converts a `JavaScript` value to a `JSON` string.\n\n```javascript\nlet obj\
    \ = {name: \"John\",\n  age: 30,\n  city: \"New York\" }; let jsonString = JSON.stringify(obj);\
    \ console.log(jsonString); // Output: {\"name\":\"John\",\"age\":30,\"city\":\"\
    New York\"}\n```\n\n### Working with Complex Objects\n\n`JSON` can handle nested\
    \ objects and arrays:\n\n```javascript\nlet complexObj = {name: \"John\",\n  age:\
    \ 30,\n  address: {street: \"123 Main St\",\n    city: \"New York\",\n    country:\
    \ \"USA\" },hobbies: [\"reading\", \"swimming\", \"coding\"]\n}; let jsonString\
    \ = JSON.stringify(complexObj); console.log(jsonString); // Output: {\"name\"\
    :\"John\",\"age\":30,\"address\":{\"street\":\"123 Main St\",\"city\":\"New York\"\
    ,\"country\":\"USA\"},\"hobbies\":[\"reading\",\"swimming\",\"coding\"]}   let\
    \ parsedObj = JSON.parse(jsonString); console.log(parsedObj.address.city); //\
    \ Output: New York console.log(parsedObj.hobbies[1]); // Output: swimming\n```\n\
    \n### `JSON.stringify()` with Replacer and Space\n\nThe `JSON.stringify()` method\
    \ can take additional parameters to customize the stringification process:\n\n\
    ```javascript\nlet obj = {name: \"John\",\n  age: 30,\n  city: \"New York\" };\
    \ // Using a replacer function let jsonString1 = JSON.stringify(obj, (key, value)\
    \ => {if (typeof value === \"string\") {\n    return value.toUpperCase();\n  }\n\
    \  return value;\n}, 2); console.log(jsonString1); /* Output:\n{\n  \"name\":\
    \ \"JOHN\",\n  \"age\": 30,\n  \"city\": \"NEW YORK\"\n}\n*/  // Using an array\
    \ as replacer let jsonString2 = JSON.stringify(obj, [\"name\", \"city\"], 2);\
    \ console.log(jsonString2); /* Output:\n{\n  \"name\": \"John\",\n  \"city\":\
    \ \"New York\"\n}\n*/\n```\n\nThe `JSON` object is crucial when working with APIs,\
    \ storing data, or transferring data between a server and a web application. Its\
    \ simplicity and universality make it a popular choice for data interchange in\
    \ modern web development.\n\n## Practical Examples of Using Built-In Objects\n\
    \nNow that we've explored the `Math`, `Date`, and `JSON` objects in detail, let's\
    \ look at some practical examples that demonstrate how these objects can be used\
    \ in real-world scenarios.\n\n### Example 1: Random Password Generator\n\nThis\
    \ example uses the `Math` object to create a random password generator:\n\n```javascript\n\
    function generatePassword(length) {\n  const charset = \"abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+\"\
    ;\n  let password = \"\";\n  for (let i = 0; i < length; i++) {\n    let randomIndex\
    \ = Math.floor(Math.random() * charset.length);\n    password += charset[randomIndex];\n\
    \  }\n  return password;\n} console.log(generatePassword(12)); // Output: A random\
    \ 12-character password\n```\n\n### Example 2: Age Calculator\n\nThis example\
    \ uses the `Date` object to calculate a person's age:\n\n```javascript\nfunction\
    \ calculateAge(birthdate) {\n  const today = new Date();\n  const birthDate =\
    \ new Date(birthdate);\n  let age = today.getFullYear() - birthDate.getFullYear();\n\
    \  const monthDiff = today.getMonth() - birthDate.getMonth();\n  if (monthDiff\
    \ < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {\n    age--;\n\
    \  }\n  return age;\n} console.log(calculateAge(\"1990-05-15\")); // Output: Current\
    \ age based on the birthdate\n```\n\n### Example 3: Data Persistence with JSON\n\
    \nThis example demonstrates how to use `JSON` for data persistence in local storage:\n\
    \n```javascript\n// User data let user = {name: \"John Doe\",\n  age: 30,\n  email:\
    \ \"john@example.com\",\n  preferences: {theme: \"dark\",\n    fontSize: \"medium\"\
    \ }\n}; // Save user data to local storage function saveUserData(user) {\n  localStorage.setItem(\"\
    userData\", JSON.stringify(user));\n} // Retrieve user data from local storage\
    \ function getUserData() {\n  let userData = localStorage.getItem(\"userData\"\
    );\n  return userData ? JSON.parse(userData) : null;\n} // Usage saveUserData(user);\
    \ let retrievedUser = getUserData(); console.log(retrievedUser.name); // Output:\
    \ John Doe console.log(retrievedUser.preferences.theme); // Output: dark\n```\n\
    \n### Example 4: Countdown Timer\n\nThis example combines the `Math` and `Date`\
    \ objects to create a countdown timer:\n\n```javascript\nfunction countdownTimer(targetDate)\
