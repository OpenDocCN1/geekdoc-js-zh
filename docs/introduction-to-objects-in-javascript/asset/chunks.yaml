    \nThis behavior has important implications. If we modify the object through one\
    \ reference, the changes will be reflected when we access the object through any\
    \ other reference:\n\nanotherBook.year  =  2023; console.log(book.year); // Output:\
    \ 2023 \n\nEven though we changed the year property through anotherBook, the change\
    \ is visible when we access book.year. This is because both variables are referencing\
    \ the same object in memory.\n\nUnderstanding objects as reference types is crucial\
    \ for avoiding unexpected behavior in your code. It's especially important when\
    \ passing objects as arguments to functions or when comparing objects. For instance:\n\
    \nfunction  modifyBook(bookObj) {\n\n    bookObj.title  =  \"Modified Title\"\
    ;\n\n} modifyBook(book); console.log(book.title); // Output: \"Modified Title\"\
    \ \n\nIn this example, the function modifyBook receives a reference to the book\
    \ object, not a copy of it. Any modifications made inside the function affect\
    \ the original object.\n\nWhen it comes to comparing objects, you need to be aware\
    \ that the comparison is based on references, not the content of the objects:\n\
    \nlet  book1  = { title:  \"1984\", author:  \"George Orwell\" }; let  book2 \
    \ = { title:  \"1984\", author:  \"George Orwell\" }; console.log(book1  === \
    \ book2); // Output: false \n\nEven though book1 and book2 have the same properties\
    \ and values, they are considered different objects because they are separate\
    \ instances with different references in memory.\n\nUnderstanding objects as reference\
    \ types is fundamental to working effectively with JavaScript. It influences how\
    \ you handle object manipulation, comparison, and function arguments, and it's\
    \ a key concept for more advanced topics like object-oriented programming and\
    \ memory management in JavaScript.\n\n## Copying Objects vs. Referencing Them\n\
    \nWhen working with objects in JavaScript, it's crucial to understand the difference\
    \ between copying an object and creating a new reference to an existing object.\
    \ This distinction can have significant implications for how your code behaves\
    \ and can be a source of subtle bugs if not properly understood.\n\nLet's start\
    \ by revisiting the concept of object references:\n\nlet  originalObj  = { name:\
    \  \"Alice\", age:  30 }; let  referencedObj  =  originalObj;\n\nIn this case,\
    \ referencedObj is not a copy of originalObj. Instead, it's a new variable that\
    \ points to the same object in memory. Any changes made to referencedObj will\
    \ affect originalObj, and vice versa, because they are essentially two names for\
    \ the same object.\n\nNow, let's explore the process of actually copying an object:\n\
    \nlet  originalObj  = { name:  \"Bob\", age:  25 }; let  copiedObj  = { ...originalObj\
    \ };\n\nHere, we've used the spread operator (...) to create a new object copiedObj\
    \ with the same properties as originalObj. This is a form of shallow copying,\
    \ which we'll discuss in more detail later.\n\nThe key difference is that copiedObj\
    \ is a new, separate object in memory. Modifying copiedObj will not affect originalObj:\n\
    \ncopiedObj.age  =  26; console.log(originalObj.age); // Output: 25 console.log(copiedObj.age);   //\
    \ Output: 26 \n\nUnderstanding when to copy an object versus when to use a reference\
    \ is crucial for writing efficient and bug-free code. Here are some scenarios\
    \ to consider:\n\n1.  When you need independent objects: If you want to create\
    \ a modified version of an object without affecting the original, you should create\
    \ a copy.\n\n2.  When passing objects to functions: If a function might modify\
    \ an object and you don't want those changes to affect the original, pass a copy\
    \ of the object instead of a reference.\n\n3.  When you need to preserve the original\
    \ state: In state management (like in React applications), it's often necessary\
    \ to create copies of objects to maintain immutability.\n\n4.  When performance\
    \ is critical: Creating copies of large objects can be memory-intensive. In performance-critical\
    \ sections of your code, you might choose to work with references instead of copies,\
    \ but be very careful about unintended side effects."
