    \ // This will fail silently in non-strict mode console.log(product.price); //\
    \ 1000 \n\n### Practical Applications\n\nUnderstanding and leveraging enumerability\
    \ and configurability can be beneficial in several scenarios:\n\n1.  API Design:\
    \ When creating objects that represent public APIs, you can use these attributes\
    \ to control which properties are visible and modifiable.\n\n2.  Data Privacy:\
    \ By making certain properties non-enumerable, you can create \"hidden\" properties\
    \ that don't show up in general property listings.\n\n3.  Preventing Modifications:\
    \ Making properties non-configurable can protect critical object properties from\
    \ being accidentally deleted or modified.\n\n4.  Performance Optimization: In\
    \ some cases, making properties non-enumerable can slightly improve performance\
    \ in operations that enumerate object properties.\n\n5.  Implementing Getter-only\
    \ Properties: By combining non-writable and non-configurable attributes with a\
    \ getter, you can create read-only computed properties.\n\nconst  circle  = {radius:\
    \  5 }; Object.defineProperty(circle, 'area', {\n\n  get: function() { return\
    \  Math.PI  *  this.radius  *  this.radius; },\n\n  enumerable:  true,\n\n  configurable:\
    \  false }); console.log(circle.area); // ~78.54 circle.area  =  100; // This\
    \ will be ignored \n\nBy mastering the concepts of enumerability and configurability,\
    \ you gain finer control over your objects' behavior and structure. This knowledge\
    \ allows you to create more robust, secure, and performant code, especially when\
    \ designing complex systems or libraries meant for wider use.\n\nIn conclusion,\
    \ advanced object features like getters and setters, freezing and sealing objects,\
    \ and understanding property attributes provide powerful tools for creating sophisticated\
    \ and well-controlled JavaScript applications. By leveraging these features, you\
    \ can write more maintainable, secure, and efficient code, enhancing your ability\
    \ to design complex systems and APIs.\n\n# Chapter 9: Working with Built-In Objects\n\
    \n# ​❧​\n\nJavaScript provides a rich set of built-in objects that offer powerful\
    \ functionality out of the box. These objects are an integral part of the language\
    \ and are designed to handle common programming tasks efficiently. In this chapter,\
    \ we'll explore some of the most frequently used built-in objects in JavaScript,\
    \ focusing on Math, Date, and JSON. We'll delve into their properties and methods,\
    \ and provide practical examples to illustrate their usage in real-world scenarios.\n\
    \n## Overview of Common Built-In Objects in JavaScript\n\nBefore we dive into\
    \ specific built-in objects, let's take a moment to understand what built-in objects\
    \ are and why they're important. Built-in objects are predefined objects that\
    \ come with JavaScript and are available for use in your code without the need\
    \ for additional imports or installations. They provide a standardized way to\
    \ perform common operations, ensuring consistency across different JavaScript\
    \ environments.\n\nSome of the advantages of using built-in objects include:\n\
    \n1.  Consistency: Built-in objects behave the same way across different browsers\
    \ and JavaScript environments, reducing cross-platform compatibility issues.\n\
    \n2.  Efficiency: These objects are optimized for performance, often leveraging\
    \ native implementations for better speed.\n\n3.  Convenience: They save developers\
    \ time by providing ready-to-use methods for common tasks, reducing the need to\
    \ reinvent the wheel.\n\n4.  Standardization: Built-in objects are part of the\
    \ ECMAScript specification, ensuring a common baseline of functionality across\
    \ all JavaScript implementations.\n\nNow, let's explore three of the most commonly\
    \ used built-in objects: Math, Date, and JSON.\n\n## Math Object\n\nThe Math object\
    \ in JavaScript is a static object that provides properties and methods for mathematical\
    \ constants and functions. It's particularly useful for performing mathematical\
    \ operations that go beyond basic arithmetic.\n\n### Properties of the Math Object\n\
    \nThe Math object includes several mathematical constants as properties. Here\
    \ are some of the most commonly used ones:\n\n1.  Math.PI: Represents the ratio\
    \ of a circle's circumference to its diameter (approximately 3.14159).\n\n2. \
    \ Math.E: Represents Euler's number, the base of natural logarithms (approximately\
    \ 2.718).\n\n3.  Math.LN2: Represents the natural logarithm of 2 (approximately\
    \ 0.693).\n\n4.  Math.LN10: Represents the natural logarithm of 10 (approximately\
    \ 2.303).\n\n### Methods of the Math Object\n\nThe Math object provides a wide\
    \ array of mathematical functions. Let's explore some of the most frequently used\
    \ methods:\n\n1.  Math.abs(x): Returns the absolute value of a number.\n\nconsole.log(Math.abs(-5));\
    \ // Output: 5 console.log(Math.abs(3.14)); // Output: 3.14 \n\n2.  Math.round(x):\
    \ Rounds a number to the nearest integer.\n\nconsole.log(Math.round(4.7)); //\
    \ Output: 5 console.log(Math.round(4.4)); // Output: 4 \n\n3.  Math.ceil(x): Rounds\
    \ a number up to the nearest integer.\n\nconsole.log(Math.ceil(4.1)); // Output:\
    \ 5 console.log(Math.ceil(4.9)); // Output: 5 \n\n4.  Math.floor(x): Rounds a\
    \ number down to the nearest integer.\n\nconsole.log(Math.floor(4.9)); // Output:\
    \ 4 console.log(Math.floor(4.1)); // Output: 4 \n\n5.  Math.max(x, y, ...): Returns\
    \ the largest of zero or more numbers.\n\nconsole.log(Math.max(5, 10, 15)); //\
    \ Output: 15 console.log(Math.max(-5, -10, -15)); // Output: -5 \n\n6.  Math.min(x,\
    \ y, ...): Returns the smallest of zero or more numbers.\n\nconsole.log(Math.min(5,\
    \ 10, 15)); // Output: 5 console.log(Math.min(-5, -10, -15)); // Output: -15 \n\
    \n7.  Math.pow(x, y): Returns the base to the exponent power, that is, x^y.\n\n\
    console.log(Math.pow(2, 3)); // Output: 8 console.log(Math.pow(4, 0.5)); // Output:\
    \ 2 (square root of 4) \n\n8.  Math.random(): Returns a pseudo-random number between\
    \ 0 and 1.\n\nconsole.log(Math.random()); // Output: A random number between 0\
    \ and 1 \n\n9.  Math.sqrt(x): Returns the square root of a number.\n\nconsole.log(Math.sqrt(16));\
    \ // Output: 4 console.log(Math.sqrt(2)); // Output: 1.4142135623730951 \n\nThese\
    \ methods provide a solid foundation for performing various mathematical operations\
    \ in JavaScript. They're particularly useful in scenarios involving geometry,\
    \ statistics, or any application that requires complex mathematical calculations.\n\
    \n## Date Object\n\nThe Date object is used for working with dates and times in\
    \ JavaScript. It allows you to create, manipulate, and format dates, making it\
    \ an essential tool for any application that deals with time-based operations.\n\
    \n### Creating Date Objects\n\nThere are several ways to create a Date object:\n\
    \n1.  Current date and time:\n\nlet  now  =  new  Date(); console.log(now); //\
    \ Output: Current date and time \n\n2.  Specific date and time:\n\nlet  specificDate\
    \  =  new  Date(2023, 5, 15, 20, 30, 0); console.log(specificDate); // Output:\
    \ 2023-06-15T20:30:00 (Note: months are zero-indexed) \n\n3.  From a date string:\n\
    \nlet  dateFromString  =  new  Date(\"2023-06-15T20:30:00\"); console.log(dateFromString);\
    \ // Output: 2023-06-15T20:30:00 \n\n4.  From timestamp (milliseconds since January\
    \ 1, 1970):\n\nlet  dateFromTimestamp  =  new  Date(1623789000000); console.log(dateFromTimestamp);\
    \ // Output: 2021-06-15T20:30:00 \n\n### Methods of the Date Object\n\nThe Date\
    \ object provides numerous methods for getting and setting various components\
    \ of a date. Here are some commonly used methods:\n\n1.  Getting date components:"
