    Let''s start by creating a function that parses JSON data:


    function  parseJSON(jsonString) {


        try {return  JSON.parse(jsonString);


        } catch (error) {


            console.error("Error parsing JSON:", error.message);


            return  null;


        }


    }


    This function uses JavaScript''s built-in JSON.parse() method to convert a JSON
    string into a JavaScript object. It''s wrapped in a try-catch block to handle
    any parsing errors.


    ### Creating a Data Processor


    Now, let''s create a DataProcessor class that will handle our parsed data:


    class  DataProcessor {constructor() {


            this.data  =  null;


        }


        loadData(jsonString) {


            this.data  =  parseJSON(jsonString);


            if (this.data) {


                console.log("Data loaded successfully.");


            }


        }


        displayData() {


            if (this.data) {


                console.log("Parsed Data:");


                console.log(JSON.stringify(this.data, null, 2));


            } else {console.log("No data loaded.");


            }


