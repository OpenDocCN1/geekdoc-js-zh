    # Chapter 10: Hands-On Mini Projects


    # ​❧​


    Welcome to Chapter 10, where we''ll dive into three exciting hands-on mini projects
    that will help solidify your understanding of objects in JavaScript. These projects
    are designed to be both challenging and rewarding, allowing you to apply the concepts
    you''ve learned in practical, real-world scenarios. By the end of this chapter,
    you''ll have created three functional applications that demonstrate the power
    and versatility of JavaScript objects.


    ## Project 1: A Simple Address Book Using Objects


    In this first project, we''ll create a simple yet effective address book application
    using JavaScript objects. This project will demonstrate how objects can be used
    to store and manipulate structured data, making it an excellent starting point
    for our hands-on exploration.


    ### Setting Up the Address Book


    Let''s begin by creating an array to hold our address book entries. Each entry
    will be an object containing information about a contact:


    let  addressBook  = [];


    Now, let''s create a function to add new contacts to our address book:


    function  addContact(name, email, phone, address) {


        let  contact  = {name:  name,


            email:  email,


            phone:  phone,


            address:  address };addressBook.push(contact);


        console.log(`Contact ${name} has been added to the address book.`);


    }


    This function takes four parameters: name, email, phone, and address. It creates
    a new object with these properties and adds it to our addressBook array.


    ### Displaying Contacts


    Next, let''s create a function to display all contacts in our address book:


    function  displayContacts() {


        if (addressBook.length  ===  0) {


            console.log("The address book is empty.");


        } else {console.log("Address Book Contacts:");


            addressBook.forEach((contact, index) => {console.log(`Contact #${index  +  1}:`);


                console.log(`Name: ${contact.name}`);


                console.log(`Email: ${contact.email}`);


                console.log(`Phone: ${contact.phone}`);


                console.log(`Address: ${contact.address}`);


                console.log("------------------------");


            });


        }


    }


    This function checks if the address book is empty. If it''s not, it loops through
    each contact and displays their information.


    ### Searching for Contacts


    Let''s add a search function to find contacts by name:


    function  searchContact(name) {


        let  foundContacts  =  addressBook.filter(contact  => contact.name.toLowerCase().includes(name.toLowerCase())


        );


        if (foundContacts.length  ===  0) {


            console.log(`No contacts found with the name "${name}".`);


        } else {console.log(`Found ${foundContacts.length} contact(s):`);


            foundContacts.forEach(contact  => {console.log(`Name: ${contact.name}`);


                console.log(`Email: ${contact.email}`);


                console.log(`Phone: ${contact.phone}`);


                console.log(`Address: ${contact.address}`);


                console.log("------------------------");


            });


        }


    }


    This function uses the filter method to find contacts whose names include the
    search term (case-insensitive). It then displays the found contacts or a message
    if no contacts are found.


    ### Testing the Address Book


    Let''s add some contacts and test our functions:


    addContact("John Doe", "john@example.com", "123-456-7890", "123 Main St, Anytown,
    USA"); addContact("Jane Smith", "jane@example.com", "987-654-3210", "456 Elm St,
    Othertown, USA"); addContact("Bob Johnson", "bob@example.com", "555-555-5555",
    "789 Oak St, Somewhere, USA"); displayContacts(); searchContact("john"); searchContact("smith");
    searchContact("alice");


    This code adds three contacts to our address book, displays all contacts, and
    then performs three searches.


    ### Enhancing the Address Book


    To make our address book more robust, we could add features like:


    1.  Editing existing contacts


    2.  Deleting contacts


    3.  Sorting contacts by different criteria (e.g., name, email)


    4.  Saving the address book to local storage


    5.  Loading the address book from local storage


    These enhancements would make the address book more useful and demonstrate more
    advanced object manipulation techniques.


    ## Project 2: Managing a Product Inventory with Object Methods


    For our second project, we''ll create a product inventory management system. This
    project will showcase how object methods can be used to encapsulate behavior related
    to the object''s data.


    ### Creating the Product Class


    Let''s start by defining a Product class:


    class  Product {constructor(name, price, quantity) {


            this.name  =  name;


            this.price  =  price;


            this.quantity  =  quantity;


        }


        getTotalValue() {


            return  this.price  *  this.quantity;


        }


        sell(amount) {


            if (amount  <=  this.quantity) {


                this.quantity  -=  amount;


                return  true;


            } else {console.log(`Error: Not enough ${this.name} in stock.`);


                return  false;


            }


        }


        restock(amount) {


            this.quantity  +=  amount;


            console.log(`Restocked ${amount}  ${this.name}(s). New quantity: ${this.quantity}`);


        }


        describe() {


            return  `${this.name}: $${this.price} - ${this.quantity} in stock. Total
    value: $${this.getTotalValue()}`;


        }


    }


