    \ 'b', 'c']; arr.customProp  =  'custom'; console.log(\"Using for...in:\"); for\
    \ (let  key  in  arr) {\n\n    console.log(key);\n\n} // Output:\n\n// 0\n\n//\
    \ 1\n\n// 2\n\n// customProp   console.log(\"Using for...of:\"); for (let  value\
    \  of  arr) {\n\n    console.log(value);\n\n} // Output:\n\n// a\n\n// b\n\n//\
    \ c \n\nNotice how for...in includes the index and the custom property, while\
    \ for...of only iterates over the array elements.\n\n## Extracting Keys, Values,\
    \ and Entries with Object Methods\n\nJavaScript provides several built-in methods\
    \ for working with object properties. These methods offer more control and specificity\
    \ when iterating over objects.\n\n### Object.keys()\n\nThe Object.keys() method\
    \ returns an array of a given object's own enumerable property names.\n\nconst\
    \  person  = {name:  \"Bob\",\n\n    age:  35,\n\n    job:  \"Designer\" }; const\
    \  keys  =  Object.keys(person); console.log(keys); // Output: [\"name\", \"age\"\
    , \"job\"] \n\nThis method is particularly useful when you need to perform array\
    \ operations on the keys of an object:\n\nObject.keys(person).forEach(key  =>\
    \ {console.log(`${key}: ${person[key]}`);\n\n}); // Output:\n\n// name: Bob\n\n\
    // age: 35\n\n// job: Designer \n\n### Object.values()\n\nObject.values() returns\
    \ an array of a given object's own enumerable property values.\n\nconst  values\
    \  =  Object.values(person); console.log(values); // Output: [\"Bob\", 35, \"\
    Designer\"] \n\nThis method is handy when you're interested in the values of an\
    \ object without needing to know the corresponding keys:\n\nObject.values(person).forEach(value\
    \  => {console.log(value);\n\n}); // Output:\n\n// Bob\n\n// 35\n\n// Designer\
    \ \n\n### Object.entries()\n\nObject.entries() returns an array of a given object's\
    \ own enumerable string-keyed property [key, value] pairs.\n\nconst  entries \
    \ =  Object.entries(person); console.log(entries); // Output: [[\"name\", \"Bob\"\
    ], [\"age\", 35], [\"job\", \"Designer\"]] \n\nThis method is particularly useful\
    \ for converting objects to Maps or for when you need both the keys and values:\n\
    \nObject.entries(person).forEach(([key, value]) => {console.log(`${key}: ${value}`);\n\
    \n}); // Output:\n\n// name: Bob\n\n// age: 35\n\n// job: Designer \n\n### Practical\
    \ Applications\n\nThese methods open up new possibilities for working with objects:\n\
    \n1.  Object Transformation\n\nYou can use these methods to easily transform objects:\n\
    \nconst  scores  = { John:  85, Alice:  92, Bob:  78 }; // Get an array of names\
    \ of students who scored 80 or above const  highScorers  =  Object.entries(scores)\n\
    \n    .filter(([name, score]) =>  score  >=  80)\n\n    .map(([name]) =>  name);\
    \ console.log(highScorers); // Output: [\"John\", \"Alice\"] \n\n2.  Object to\
    \ Map Conversion\n\nObject.entries() makes it easy to convert an object to a Map:"
