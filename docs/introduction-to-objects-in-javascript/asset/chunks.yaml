    \ 防止对对象的所有更改，而 `seal` 允许修改现有属性，但阻止添加或删除属性。\n\n理解 JavaScript 中对象语法和操作的这些各个方面为你提供了强大的工具包，用于处理复杂数据结构并创建更有条理、更高效的代码。随着你继续使用对象，你会发现更多方法来发挥它们在\
    \ JavaScript 程序中的灵活性和强大功能。\n\n总之，JavaScript 中的对象是多功能且基础的结构，它们允许我们表示复杂的实体、组织相关的数据和功能，并创建更直观、更易维护的代码。通过掌握对象的创建、操作和高级特性，你将能够很好地应对\
    \ JavaScript 中各种编程挑战。\n\n# 第 2 章：创建和访问对象\n\n在 JavaScript 编程的广阔领域中，对象作为基本构建块而存在，作为构建和组织数据的基石。当我们踏上第\
    \ 2 章的旅程时，我们将深入探讨创建和访问对象的复杂性，揭示它们在塑造代码方面的强大力量。\n\n把对象想象成数字容器，能够保存各种信息和功能。就像一个工具箱为不同目的存放不同的工具一样，JavaScript\
    \ 中的对象可以包含属性（数据）和方法（函数），它们共同协作来表示程序中的现实世界实体或抽象概念。\n\n当我们浏览本章时，我们将探索为这些数字容器注入生命、填充数据并与其内容交互的各种方法。从对象字面量的简单性到属性访问的细微差别，我们将为你配备知识和技能，以充分发挥\
    \ JavaScript 中对象的全部潜力。\n\n那么，让我们卷起袖子，深入对象创建和操作的世界，在那里可能性像你的想象力一样无限。\n\n## 使用对象字面量声明对象\n\
    \n在 JavaScript 中，对象创建的核心是对象字面量表示法——这是一种简单但强大的方式来创建对象。把它想象成一块空白的画布，等待你用赋予它意义和目的的属性和值来描绘它。\n\
    \n对象字面量语法以花括号 `{}` 为特征，它们作为对象内容的容器。在这些花括号内，我们定义键值对，其中每个键代表一个属性名，每个值代表与该属性关联的数据。\n\
    \n让我们从一个基本示例开始：\n\n```javascript\nlet person = {name: \"Alice\",\n    age: 30,\n\
    \    city: \"New York\" };\n```\n\n在这个代码片段中，我们创建了一个名为 `person` 的对象，包含三个属性：`name`、`age`\
    \ 和 `city`。每个属性后面跟着冒号 `:` 及其对应的值。属性之间用逗号分隔，允许我们在同一个对象中定义多个键值对。\n\n但对象并不局限于存储简单数据类型。它们可以包含丰富的值，包括其他对象、数组，甚至函数。让我们扩展我们的\
    \ `person` 对象来展示这种多功能性：\n\n```javascript\nlet person = {name: \"Alice\",\n   \
    \ age: 30,\n    city: \"New York\",\n    hobbies: [\"reading\", \"painting\",\
    \ \"hiking\"],\n    address: {street: \"123 Main St\",\n        zipCode: \"10001\"\
    \ },greet: function() {\n        console.log(\"Hello, I'm \" + this.name + \"\
    !\");\n    }\n};\n```\n\n现在我们的 `person` 对象已经发展成为一个更复杂的实体。它包含一个爱好数组、一个嵌套的 `address`\
    \ 对象和一个 `greet` 方法。这展示了对象在表示多样化数据结构和行为方面的灵活性。\n\n对象字面量的优点之一是它们的可读性和简洁性。它们提供了对象结构的清晰视觉表示，使开发者能够一目了然地理解数据。\n\
    \n此外，对象字面量提供了即时创建对象的优势，无需显式的构造函数或类。这使得它们在创建一次性对象或需要快速定义数据结构而无需更正式的对象创建模式的开销时特别有用。\n\
    \n考虑这个场景，我们使用对象字面量来表示一本书：\n\n```javascript\nlet book = {title: \"The Great Gatsby\"\
    ,\n    author: \"F. Scott Fitzgerald\",\n    year: 1925,\n    genre: \"Novel\"\
    ,\n    summary: \"A tale of the American Dream gone awry\",\n    characters: [\"\
    Jay Gatsby\", \"Daisy Buchanan\", \"Nick Carraway\"],\n    isClassic: true,\n\
    \    getInfo: function() {\n        return `${this.title} by ${this.author}, published\
    \ in ${this.year}`;\n    }\n};\n```\n\n这个 `book` 对象封装了一部文学作品的各个方面，从基本元数据到角色列表，甚至还有一个检索格式化书籍信息字符串的方法。对象字面量语法允许我们以紧凑和直观的方式创建这种丰富的表示。\n\
    \n当你越来越熟悉对象字面量时，你会发现它们是你 JavaScript 工具包中不可或缺的工具。它们作为更高级的面向对象编程概念的基础，并在许多 JavaScript\
    \ 设计模式和框架中发挥着关键作用。\n\n请记住，对象字面量的力量不仅在于它们的简单性，还在于它们能够随着数据需求的变化而成长和适应。随着我们本章的进展，我们将探索如何与这些对象交互和修改它们，释放你在\
    \ JavaScript 程序中的全部潜力。\n\n## 添加、访问和修改属性\n\n一旦我们创建了一个对象，旅程才刚开始。JavaScript 中的对象是动态的，允许我们轻松地添加、访问和修改它们的属性。这种灵活性是\
    \ JavaScript 对象系统的标志之一，使我们能够随着程序的演进来塑造和重塑我们的数据结构。\n\n### 添加属性\n\n向现有对象添加新属性就像给一个新键赋值一样简单。让我们回顾一下我们的\
    \ `person` 对象并添加一些新信息：\n\n```javascript\nperson.occupation = \"Software Developer\"\
    ; person[\"years of experience\"] = 5;\n```\n\n在这个例子中，我们向 `person` 对象添加了两个新属性。第一个是\
    \ `occupation`，使用点号表示法添加，而第二个是 `years of experience`，使用方括号表示法（我们稍后会详细探讨）。两种方法都达到了相同的结果：一个新属性被添加到对象中。\n\
    \n我们甚至可以添加更复杂的属性，如嵌套对象或函数：\n\n```javascript\nperson.skills = {programming: [\"\
    JavaScript\", \"Python\", \"Java\"],\n    languages: [\"English\", \"Spanish\"\
    ]\n}; person.introduce = function() {\n    console.log(`Hi, I'm ${this.name},\
    \ a ${this.occupation} with ${this[\"years of experience\"]} years of experience.`);\n\
    };\n```\n\n这展示了 JavaScript 动态特性的强大——对象可以根据需要成长和演变，随时容纳新的数据和功能。\n\n### 访问属性\n\n\
    访问对象属性是一项基本操作，允许我们检索存储在对象中的值。访问对象属性主要有两种方式：点号表示法和方括号表示法。\n\n点号表示法是最常见和直接的方法：\n\
    \n```javascript\nconsole.log(person.name); // Output: Alice console.log(person.age);\
    \  // Output: 30\n```\n\n另一方面，方括号表示法允许我们使用字符串表达式来访问属性：\n\n```javascript\nconsole.log(person[\"\
    city\"]); // Output: New York console.log(person[\"years of experience\"]); //\
    \ Output: 5\n```\n\n"
- fmt: "\nBracket notation is particularly useful when the property name is stored\
    \ in a variable or when the property name contains special characters or spaces.\n\
    \nWe can also access nested properties by chaining the dot or bracket notations:\n\
    \n```\nconsole.log(person.address.street); // Output: 123 Main St \nconsole.log(person.skills.programming[0]);\
    \ // Output: JavaScript\n```\n\n### Modifying Properties\n\nModifying existing\
    \ properties is just as straightforward as adding new ones. We simply assign a\
    \ new value to the existing property:\n\n```\nperson.age  =  31; // Happy birthday,\
    \ Alice! \nperson[\"city\"] =  \"San Francisco\"; // Alice moved to a new city\
    \ \n```\n\nWe can also modify nested properties:\n\n```\nperson.address.zipCode\
    \  =  \"94105\"; // Updated zip code for San Francisco \nperson.skills.programming.push(\"\
    TypeScript\"); // Added a new programming skill \n```\n\nThe ability to modify\
    \ properties allows our objects to reflect changing states or updated information\
    \ in our programs.\n\n### Deleting Properties\n\nSometimes, we may want to remove\
    \ a property from an object entirely. For this, we use the `delete` operator:\n\
    \n```\ndelete  person.occupation; \nconsole.log(person.occupation); // Output:\
    \ undefined \n```\n\nIt's worth noting that the `delete` operator only works on\
    \ object properties. It cannot delete variables declared with `var`, `let`, or\
    \ `const`.\n\n### Property Existence and Undefined Values\n\nWhen accessing object\
    \ properties, it's important to understand the difference between a property that\
    \ doesn't exist and a property that exists but has an undefined value.\n\n```\n\
    console.log(person.salary); // Output: undefined \nconsole.log(person.age); //\
    \ Output: 31   \nperson.salary  =  undefined; \nconsole.log(person.salary); //\
    \ Output: undefined \nconsole.log(\"salary\"  in  person); // Output: true \n\
    console.log(\"gender\"  in  person); // Output: false \n```\n\nIn this example,\
    \ both `person.salary` and `person.gender` return `undefined`, but for different\
    \ reasons. `salary` exists as a property but has an undefined value, while `gender`\
    \ doesn't exist as a property at all.\n\nThe `in` operator can help us distinguish\
    \ between these cases, returning `true` if the property exists in the object (or\
    \ the prototype chain) and `false` otherwise.\n\nUnderstanding these nuances of\
    \ property manipulation is crucial for effective object handling in JavaScript.\
    \ As we continue to explore objects, we'll delve deeper into advanced techniques\
    \ for property access and management, equipping you with the tools to create robust\
    \ and flexible object-oriented code.\n\n## Dot Notation vs. Bracket Notation\n\
    \nIn the realm of JavaScript object manipulation, two notations reign supreme:\
    \ dot notation and bracket notation. While both serve the purpose of accessing\
    \ and modifying object properties, they each have their own strengths and use\
    \ cases. Understanding when and how to use each notation is crucial for writing\
    \ clear, efficient, and flexible code.\n\n### Dot Notation\n\nDot notation is\
    \ the more commonly used and syntactically simpler of the two. It involves using\
    \ a dot (`.`) followed by the property name to access or modify an object's property.\n\
    \n```\nlet  car  = {make:  \"Toyota\",\n    model:  \"Corolla\",\n    year:  2022\
    \ }; \nconsole.log(car.make);  // Output: Toyota \ncar.color  =  \"Blue\"; \n\
    console.log(car.color); // Output: Blue \n```\n\nDot notation is straightforward\
    \ and easy to read, making it the preferred choice when working with known, valid\
    \ identifier names. It's particularly useful when you're dealing with properties\
    \ that you've defined explicitly in your code.\n\nHowever, dot notation has some\
    \ limitations:\n\n1. It can only be used with property names that are valid JavaScript\
    \ identifiers. This means the property name must start with a letter, underscore\
    \ (`_`), or dollar sign (`$`), and can only contain letters, numbers, underscores,\
    \ or dollar signs.\n2. It cannot be used with property names that are stored in\
    \ variables or expressions.\n3. It cannot be used with property names that start\
    \ with a number or contain special characters or spaces.\n\n### Bracket Notation\n\
    \nBracket notation offers more flexibility in property access. It involves using\
    \ square brackets `[]` with a string or expression inside to access or modify\
    \ an object's property.\n\n```\nconsole.log(car[\"model\"]); // Output: Corolla\
    \ \ncar[\"manufacturing date\"] =  \"2022-03-15\"; \nconsole.log(car[\"manufacturing\
    \ date\"]); // Output: 2022-03-15 \n```\n\nBracket notation shines in several\
    \ scenarios:\n\n1. When property names contain spaces or special characters:\n\
    ```\nlet  person  = {\"first name\": \"John\",\n    \"last name\": \"Doe\",\n\
    \    \"age\": 30 }; \nconsole.log(person[\"first name\"]); // Output: John \n\
    ```\n\n2. When property names are stored in variables or are the result of an\
    \ expression:\n```\nlet  propertyName  =  \"make\"; \nconsole.log(car[propertyName]);\
    \ // Output: Toyota   \nlet  i  =  0; \nlet  propertyArray  = [\"make\", \"model\"\
    , \"year\"]; \nconsole.log(car[propertyArray[i]]); // Output: Toyota \n```\n\n\
    3. When you need to access properties dynamically:\n```javascript\nfunction getProperty(obj,\
    \ prop) {\n    return  obj[prop];\n} \nconsole.log(getProperty(car, \"year\"));\
    \ // Output: 2022 \n```\n\n4. When working with property names that start with\
    \ numbers (though this is generally not recommended):\n```javascript\nlet  weirdObject\
    \  = {\"123\": \"one two three\" }; \nconsole.log(weirdObject[\"123\"]); // Output:\
    \ one two three \n```\n\n### Comparing Dot and Bracket Notation\n\nTo illustrate\
    \ the differences and use cases of dot and bracket notation, let's consider a\
    \ more complex example:\n\n```javascript\nlet  company  = {name:  \"Tech Innovations\
    \ Inc.\",\n    \"founding year\": 2010,\n    departments: [\"R&D\", \"Marketing\"\
    , \"HR\"],\n    \"chief officers\": {\n        CEO:  \"Jane Smith\",\n       \
    \ CTO:  \"Bob Johnson\"\n    },\n    getInfo: function() {\n        return  `${this.name},\
    \ founded in ${this[\"founding year\"]}`;\n    }\n};\n\n// Using dot notation\n\
    console.log(company.name); // Output: Tech Innovations Inc. \nconsole.log(company.departments[1]);\
    \ // Output: Marketing   \n\n// Using bracket notation\nconsole.log(company[\"\
    founding year\"]); // Output: 2010 \nconsole.log(company[\"chief officers\"][\"\
    CEO\"]); // Output: Jane Smith   \n\n// Mixing dot and bracket notation\nconsole.log(company.getInfo());\
    \ // Output: Tech Innovations Inc., founded in 2010   \n\n// Dynamic property\
    \ access\nlet  departmentIndex  =  2; \nconsole.log(company.departments[departmentIndex]);\
    \ // Output: HR   \nlet  officerRole  =  \"CTO\"; \nconsole.log(company[\"chief\
    \ officers\"][officerRole]); // Output: Bob Johnson \n```\n\nThis example showcases\
    \ how dot notation and bracket notation can be used in various scenarios, sometimes\
    \ in combination. It demonstrates the flexibility of bracket notation in handling\
    \ property names with spaces, accessing nested properties, and allowing for dynamic\
    \ property access.\n\n### Performance Considerations\n\nWhile both notations serve\
    \ similar purposes, it's worth noting that dot notation generally has a slight\
    \ performance advantage over bracket notation. This is because dot notation can\
    \ be optimized by JavaScript engines more easily. However, the difference is usually\
    \ negligible in most real-world scenarios, and the choice between the two should\
    \ primarily be based on readability and the specific requirements of your code.\n\
    \nIn conclusion, mastering both dot notation and bracket notation is essential\
    \ for effective object manipulation in JavaScript. Dot notation offers simplicity\
    \ and readability for straightforward property access, while bracket notation\
    \ provides the flexibility needed for more complex scenarios. By understanding\
    \ the strengths and use cases of each, you can write more expressive and powerful\
    \ JavaScript code, adapting to various property access needs with ease.\n"
