    };\n\n// Usage\ngameCharacter.takeDamage(30);\ngameCharacter.heal(20);\ngameCharacter.gainExperience(120);\n\
    console.log(gameCharacter.getStatus());\n```\n\nThis `gameCharacter` object manages\
    \ its own state (`health`, `level`, `experience`) and provides methods to interact\
    \ with and modify that state. The methods ensure that the state remains consistent\
    \ (e.g., `health` never goes below 0 or above 100) and handle complex logic like\
    \ leveling up.\n\n### 3. Event Handling and Callbacks\n\n`Object` methods are\
    \ often used in event-driven programming, where they can be assigned as event\
    \ handlers or callbacks.\n\nExample: A simple UI component\n\n```javascript\n\
    let button = {\n    element: document.createElement('button'),\n    text: 'Click\
