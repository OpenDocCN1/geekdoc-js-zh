    \nCreate a nested object structure representing a library with `books`. Each `book`\
    \ should have properties for `title`, author, and publication year.\n\n#### Solution:\n\
    \n```javascript\nconst library = {\n  books: [\n    {\n      title: \"To Kill\
    \ a Mockingbird\",\n      author: \"Harper Lee\",\n      year: 1960\n    },\n\
    \    {\n      title: \"1984\",\n      author: \"George Orwell\",\n      year:\
    \ 1949\n    },\n    {\n      title: \"Pride and Prejudice\",\n      author: \"\
    Jane Austen\",\n      year: 1813\n    }\n  ],\n  getTitles: function() {\n   \
    \ return this.books.map(book => book.title);\n  }\n};\nconsole.log(library.getTitles());\
    \ // Output: [\"To Kill a Mockingbird\", \"1984\", \"Pride and Prejudice\"]\n\
    ```\n\n### Exercise 6: Object.entries() and Object.fromEntries()\n\nGiven an object,\
    \ use `Object.entries()` to convert it to an array of key-value pairs. Then, modify\
    \ the array and use `Object.fromEntries()` to convert it back to an object.\n\n\
    #### Solution:\n\n```javascript\nconst original = { a: 1, b: 2, c: 3 };\nconst\
    \ entries = Object.entries(original);\nconst modified = entries.map(([key, value])\
    \ => [key, value * 2]);\nconst result = Object.fromEntries(modified);\nconsole.log(result);\
    \ // Output: { a: 2, b: 4, c: 6 }\n```\n\n### Exercise 7: Object Property Shorthand\n\
    \nCreate a function that takes `name` and `age` as parameters and returns an object\
    \ using property shorthand.\n\n#### Solution:\n\n```javascript\nfunction createPerson(name,\
    \ age) {\n  return { name, age };\n}\nconst person = createPerson(\"John Doe\"\
    , 30);\nconsole.log(person); // Output: { name: \"John Doe\", age: 30 }\n```\n\
    \n### Exercise 8: Computed Property Names\n\nCreate an object with computed property\
    \ names based on an array of `keys`.\n\n#### Solution:\n\n```javascript\nconst\
    \ keys = ['name', 'age', 'profession'];\nconst values = ['Sarah', 35, 'Designer'];\n\
    const person = keys.reduce((obj, key, index) => {\n  obj[key] = values[index];\n\
    \  return obj;\n}, {});\nconsole.log(person); // Output: { name: \"Sarah\", age:\
    \ 35, profession: \"Designer\" }\n```\n\nThese exercises cover a wide range of\
    \ object-related concepts in JavaScript. Practice them thoroughly to gain a solid\
    \ understanding of how to work with objects effectively in your code.\n\n## C:\
    \ Common Interview Questions on Objects in JavaScript\n\nWhen preparing for a\
    \ JavaScript interview, it's crucial to understand objects. Here are some common\
    \ interview questions related to objects:\n\n### 1. What is the difference between\
    \ dot notation and bracket notation when accessing properties?\n\nAnswer:\n\n\
    Dot notation is used when the property name is a valid identifier. Bracket notation\
    \ is used when the property name contains special characters, or is stored in\
    \ a variable.\n\nExample:\n\n```javascript\nconst person = { name: \"John\", age:\
    \ 30 };\nconst key = \"name\";\nconsole.log(person.name); // Dot notation\nconsole.log(person[key]);\
    \ // Bracket notation\nconsole.log(person[\"age\"]); // Bracket notation \n```\n\
    \n### 2. How do you check if a property exists in an object?\n\nAnswer:\n\nThere\
    \ are several ways to check if a property exists:\n\n- Using the `in` operator:\
    \ checks both the object and its prototype chain.\n  ```javascript\n  const person\
    \ = { age: 30 };\n  console.log(\"age\" in person); // true\n  console.log(\"\
    gender\" in person); // false\n  ```\n- Using `hasOwnProperty()`: checks only\
    \ the object's own properties.\n  ```javascript\n  const person = { age: 30 };\n\
    \  console.log(person.hasOwnProperty(\"age\")); // true\n  console.log(person.hasOwnProperty(\"\
    toString\")); // false\n  ```\n- Using `Object.hasOwn()` (ES2022): the modern\
    \ alternative to `hasOwnProperty()`.\n  ```javascript\n  const person = { age:\
    \ 30 };\n  console.log(Object.hasOwn(person, \"age\")); // true\n  console.log(Object.hasOwn(person,\
    \ \"toString\")); // false\n  ```\n\n### 3. What is the difference between `Object.freeze()`\
    \ and `Object.seal()`?\n\nAnswer:\n\nBoth `Object.freeze()` and `Object.seal()`\
    \ are used to restrict modifications to objects, but they differ in the level\
    \ of restriction:\n\n- `Object.freeze()`: prevents adding, removing, or modifying\
    \ existing properties.\n- `Object.seal()`: prevents adding or removing properties,\
    \ but allows existing properties to be modified.\n\nExample:\n\n```javascript\n\
    const frozenObj = Object.freeze({ x: 1, y: 2 });\nfrozenObj.x = 10; // Fails silently\
    \ (or error in strict mode)\nfrozenObj.z = 3; // Fails silently\n\nconst sealedObj\
    \ = Object.seal({ a: 1, b: 2 });\nsealedObj.a = 10; // Allowed\nsealedObj.c =\
    \ 3; // Fails silently\ndelete sealedObj.b; // Fails silently\n```\n\nNote that\
    \ both methods perform shallow freezing/sealing, meaning nested objects can still\
    \ be modified.\n\n### 4. Explain the concept of prototypal inheritance in JavaScript.\n\
    \nAnswer:\n\nPrototyp inheritance is a fundamental concept in JavaScript that\
    \ allows objects to inherit properties and methods from other objects. Each object\
    \ has an internal link to another object called its prototype. When a property\
    \ is accessed on an object, JavaScript first looks for it on the object. If not\
    \ found, it looks up the prototype chain until it finds the property or reaches\
    \ the end of the chain (usually `Object.prototype`).\n\nKey points:\n\n- Every\
    \ object in JavaScript has a prototype, except for the base `Object.prototype`.\n\
    - The prototype of an object is accessible via `Object.getPrototypeOf(obj)` or\
    \ the deprecated `__proto__` property.\n- Constructor functions can set the prototype\
    \ of objects created with the `new` keyword.\n- The `prototype` property of a\
    \ constructor function becomes the prototype of objects created with that constructor.\n\
    \nExample:\n\n```javascript\nfunction Animal(name) {\n  this.name = name;\n}\n\
    Animal.prototype.speak = function() {\n  console.log(`${this.name} makes a sound.`);\n\
    };\n\nfunction Dog(name) {\n  Animal.call(this, name);\n}\nDog.prototype = Object.create(Animal.prototype);\n\
    Dog.prototype.constructor = Dog;\nDog.prototype.bark = function() {\n  console.log(`${this.name}\
    \ barks.`);\n};\n\nconst dog = new Dog('Rex');\ndog.speak(); // Rex makes a sound.\n\
    dog.bark(); // Rex barks.\n```\n\nIn this example, `Dog` inherits from `Animal`\
    \ through prototypal inheritance.\n\n### 5. What is the purpose of the `this`\
    \ keyword in JavaScript objects?\n\nAnswer:\n"
