    \ 永远不会低于 0 或高于 100），并处理升级等复杂逻辑。\n\n### 3. 事件处理与回调\n\n`Object` 方法常用于事件驱动编程，在其中它们可以被指定为事件处理器或回调函数。\n\
    \n示例：一个简单的 UI 组件\n\n```javascript\nlet button = {\n    element: document.createElement('button'),\n\
