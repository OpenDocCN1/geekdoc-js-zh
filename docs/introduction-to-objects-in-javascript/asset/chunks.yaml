    \ apply Object.freeze() to all nested objects.\n\n### Object.seal(): Preventing\
    \ Extensions and Deletions\n\nObject.seal() is a slightly less restrictive method\
    \ compared to Object.freeze(). When you seal an object:\n\n1.  You can't add new\
    \ properties to it.\n\n2.  You can't remove existing properties.\n\n3.  You can\
    \ modify the values of existing properties.\n\n4.  You can't change the configurability\
    \ or enumerability of existing properties.\n\nHere's an example of how Object.seal()\
    \ works:\n\nconst  car  = {make:  'Toyota',\n\n  model:  'Corolla',\n\n  year:\
    \  2020 }; Object.seal(car); // Modifying existing properties is allowed car.year\
    \  =  2021; // Attempting to add or delete properties car.color  =  'red'; //\
    \ This will fail silently in non-strict mode delete  car.model; // This will also\
    \ fail   console.log(car); // Output: { make: 'Toyota', model: 'Corolla', year:\
    \ 2021 } \n\nIn this example, we can modify the year property of the sealed car\
    \ object, but we can't add new properties or delete existing ones.\n\n### Checking\
    \ Object Status\n\nJavaScript provides methods to check whether an object is frozen\
    \ or sealed:\n\nconst  frozenObj  =  Object.freeze({}); const  sealedObj  =  Object.seal({});\
    \ const  normalObj  = {}; console.log(Object.isFrozen(frozenObj)); // true console.log(Object.isSealed(frozenObj));\
    \ // true (frozen objects are also sealed) console.log(Object.isSealed(sealedObj));\
    \ // true console.log(Object.isFrozen(sealedObj)); // false console.log(Object.isSealed(normalObj));\
    \ // false console.log(Object.isFrozen(normalObj)); // false \n\n### Use Cases\
    \ for Freezing and Sealing Objects\n\n1.  Constants: When you have configuration\
    \ objects or settings that should never change during the execution of your program.\n\
    \n2.  Preventing Accidental Modifications: In large codebases, freezing objects\
    \ can help prevent unintended modifications by other parts of the code.\n\n3.\
    \  API Responses: When working with API responses that you want to ensure remain\
    \ unmodified throughout your application.\n\n4.  Immutable Data Structures: For\
    \ implementing immutable data patterns in your application, which can lead to\
    \ more predictable state management.\n\n5.  Security: In some cases, freezing\
    \ objects can prevent certain types of attacks that rely on modifying object properties.\n\
    \nBy understanding and utilizing Object.freeze() and Object.seal(), you can exert\
    \ fine-grained control over the mutability of your objects, leading to more robust\
    \ and predictable code.\n\n## Understanding Enumerability and Configurability\
    \ of Properties\n\nWhen working with objects in JavaScript, it's crucial to understand\
    \ the concept of property attributes. Each property in an object has not only\
    \ a value but also a set of attributes that define its behavior. Two important\
    \ attributes are enumerability and configurability. These attributes play a significant\
    \ role in how properties behave in various contexts and operations.\n\n### Property\
    \ Attributes\n\nBefore diving into enumerability and configurability, let's review\
    \ the four main attributes of object properties:\n\n1.  Value: The actual data\
    \ stored in the property.\n\n2.  Writable: Determines if the property's value\
    \ can be changed.\n\n3.  Enumerable: Determines if the property shows up in certain\
    \ operations like for...in loops or Object.keys().\n\n4.  Configurable: Determines\
    \ if the property can be deleted or its attributes modified.\n\n### Enumerability\n\
    \nThe enumerability of a property determines whether it will be included when\
    \ the object's properties are enumerated. This affects several operations and\
    \ methods in JavaScript:\n\n1.  for...in loops\n\n2.  Object.keys()\n\n3.  JSON.stringify()\n\
    \n4.  Object.assign()\n\nBy default, properties created by simple assignment or\
    \ with object literal notation are enumerable. However, many of the built-in properties\
    \ in JavaScript objects are not enumerable.\n\nHere's an example demonstrating\
    \ the effect of enumerability:\n\nconst  person  = {name:  'John Doe',\n\n  age:\
    \  30 }; Object.defineProperty(person, 'ssn', {\n\n  value:  '123-45-6789',\n\n\
      enumerable:  false }); console.log(Object.keys(person)); // ['name', 'age']\
    \ for (let  prop  in  person) {\n\n  console.log(prop); // Outputs: name, age\
    \ } console.log(person.ssn); // '123-45-6789' \n\nIn this example, the ssn property\
    \ is not enumerable, so it doesn't show up in Object.keys() or the for...in loop,\
    \ even though we can still access its value directly.\n\n### Configurability\n\
    \nThe configurability of a property determines whether the property can be deleted\
    \ from the object and whether its attributes (other than value and writable) can\
    \ be modified.\n\nWhen a property is non-configurable:\n\n1.  It cannot be deleted\
    \ from the object.\n\n2.  Its attributes (enumerable and configurable) cannot\
    \ be changed.\n\n3.  For data properties, it cannot be converted to an accessor\
    \ property, and vice versa.\n\n4.  For data properties, the writable attribute\
    \ can only be changed from true to false.\n\nHere's an example demonstrating configurability:\n\
    \nconst  config  = {apiKey:  'abc123' }; Object.defineProperty(config, 'apiKey',\
    \ {\n\n  configurable:  false }); delete  config.apiKey; // This will fail silently\
    \ in non-strict mode console.log(config.apiKey); // 'abc123'   // Attempting to\
    \ redefine the property will throw an error Object.defineProperty(config, 'apiKey',\
    \ {\n\n  enumerable:  false }); // Throws TypeError \n\nIn this example, after\
    \ making apiKey non-configurable, we can't delete it or change its attributes.\n\
    \n### Checking and Modifying Property Attributes\n\nJavaScript provides methods\
    \ to check and modify property attributes:\n\n1.  Object.getOwnPropertyDescriptor():\
    \ Returns a property descriptor for a named property on an object.\n\nconst  person\
    \  = { name:  'John' }; console.log(Object.getOwnPropertyDescriptor(person, 'name'));\
    \ // Output: { value: 'John', writable: true, enumerable: true, configurable:\
    \ true } \n\n2.  Object.defineProperty(): Defines a new property directly on an\
    \ object, or modifies an existing property, and returns the object.\n\nconst \
    \ car  = {}; Object.defineProperty(car, 'model', {\n\n  value:  'Toyota',\n\n\
      writable:  false,\n\n  enumerable:  true,\n\n  configurable:  false }); car.model\
    \  =  'Honda'; // This will fail silently in non-strict mode console.log(car.model);\
    \ // 'Toyota' "
