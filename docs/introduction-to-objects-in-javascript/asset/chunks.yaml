  trans: "\n## Object.create() 与继承\n\n```javascript\n}; // Creating a specific car\
    \ model let  sedan  =  Object.create(car); sedan.model  =  \"Sedan\"; sedan.passengers\
    \  =  5; console.log(sedan.type);  // vehicle (inherited from vehicle) sedan.start();\
    \  // The vehicle is starting... (inherited from vehicle) sedan.drive();  // The\
    \ car is driving... (inherited from car) console.log(sedan.wheels);  // 4 (inherited\
    \ from car) console.log(sedan.model);  // Sedan (own property) \n```\n\n在这个例子中，我们创建了一个继承链：`sedan`\
    \ 继承自 `car`，`car` 继承自 `vehicle`。这展示了如何使用 `Object.create()` 创建多级继承结构。\n\n### 使用\
    \ `Object.create()` 的优点\n\n1. 直接指定原型：`Object.create()` 允许你直接将一个对象指定为另一个对象的原型，使继承关系明确且易于理解。\n\
    \n2. 不调用构造函数：与使用 `new` 关键字调用构造函数不同，`Object.create()` 不会调用构造函数，使你可以更好地控制对象初始化。\n\
    \n3. 灵活性：你可以轻松地以任何其他对象作为原型创建对象，而不仅限于构造函数的原型。\n\n4. 纯原型继承：它很好地符合 JavaScript 的原型本质，避免了试图模拟类继承时可能产生的混淆。\n\
    \n### 使用 `Object.create()` 的第二个参数\n\n`Object.create()` 的第二个参数允许你使用属性描述符为新对象定义属性：\n\
    \n```javascript\nlet  person  =  Object.create(null, {\n\n    firstName: {value:\
    \  \"John\",\n\n        writable:  true,\n\n        enumerable:  true },lastName:\
    \ {value:  \"Doe\",\n\n        writable:  true,\n\n        enumerable:  true },fullName:\
    \ {get: function() {\n\n            return  this.firstName  +  \" \"  +  this.lastName;\n\
    \n        },\n\n        enumerable:  true }\n\n}); console.log(person.fullName);\
    \  // John Doe \n```\n\n这种方法使你可以细粒度地控制属性的特性，如可写性、可枚举性和可配置性。\n\n### 将 `Object.create()`\
    \ 与构造函数结合使用\n\n你也可以将 `Object.create()` 与构造函数结合使用，采用混合方式：\n\n```javascript\nfunction\
    \  Animal(name) {\n\n    this.name  =  name;\n\n} Animal.prototype.speak  =  function()\
    \ {\n\n    console.log(this.name  +  \" makes a sound.\");\n\n}; function  Dog(name)\
    \ {\n\n    Animal.call(this, name);\n\n} Dog.prototype  =  Object.create(Animal.prototype);\
    \ Dog.prototype.constructor  =  Dog; Dog.prototype.bark  =  function() {\n\n \
    \   console.log(this.name  +  \" barks!\");\n\n}; let  dog  =  new  Dog(\"Buddy\"\
    ); dog.speak();  // Buddy makes a sound. dog.bark();   // Buddy barks! \n```\n\
    \n这种模式使你可以利用构造函数和 `Object.create()` 两者的优势。\n\n### 局限性和注意事项\n\n虽然 `Object.create()`\
    \ 功能强大，但了解其局限性也很重要：\n\n1. 性能：在某些情况下，使用 `Object.create()` 创建对象可能比对象字面量或构造函数稍慢。\n\
    \n2. 清晰度：对于更习惯于类语言开发者来说，原型继承模型可能不那么直观。\n\n3. 缺少构造函数调用：如果需要类似构造函数的初始化，你需要显式调用方法或与构造函数结合使用。\n\
    \n`Object.create()` 提供了一种灵活而强大的方式在 JavaScript 中实现继承。它提供了一种清晰直接的方法来创建具有特定原型的对象，很好地符合\
    \ JavaScript 的原型本质。通过理解和运用 `Object.create()`，你可以在 JavaScript 代码中创建更灵活、更易维护的继承结构，充分利用原型继承的强大功能。\n\
    \n# 第 8 章：高级对象特性\n\n# ​❧​\n\n## 使用 getter 和 setter 实现受控的属性访问\n\n在 JavaScript 中，对象是语言的基石，作为复杂数据结构的构建块，并提供封装相关功能的方式。随着深入探索对象的世界，我们会遇到更高级的特性，这些特性允许我们对对象属性的交互方式进行更大的控制和灵活性。其中一个特性就是\
    \ getter 和 setter 的使用。\n\nGetter 和 setter 是特殊的方法，允许你定义属性的访问或修改方式。它们提供了一种在读取或写入属性时执行代码的途径，使你能够添加逻辑、验证或计算值，而无需改变属性在外部的使用方式。\n\
    \n### 定义 getter\n\nGetter 是一个获取特定属性值的方法。当你访问该属性时，getter 函数被调用，返回值作为属性的值。以下是定义\
    \ getter 的示例：\n\n```javascript\nconst  person  = {firstName:  'John',\n\n  lastName:\
    \  'Doe',\n\n  get  fullName() {\n\n    return  `${this.firstName}  ${this.lastName}`;\n\
    \n  }\n\n}; console.log(person.fullName); // Output: \"John Doe\" \n```\n\n在这个例子中，`fullName`\
    \ 是一个 getter，它将 `firstName` 和 `lastName` 合并。当我们访问 `person.fullName` 时，getter 函数被调用，返回拼接后的字符串。\n\
    \nGetter 对于计算属性或提供只读访问特别有用。它们允许你封装检索值的逻辑，这有助于保持代码的整洁和有序。\n\n### 定义 setter\n\n\
    Setter 是一个设置特定属性值的方法。当你为属性赋值时，setter 函数被调用，传入新值作为参数。以下是定义 setter 的示例：\n\n```javascript\n\
    const  person  = {firstName:  'John',\n\n  lastName:  'Doe',\n\n  set  fullName(name)\
    \ {\n\n    const  parts  =  name.split(' ');\n\n    this.firstName  =  parts[0];\n\
    \n    this.lastName  =  parts[1];\n\n  }\n\n}; person.fullName  =  'Jane Smith';\
    \ console.log(person.firstName); // Output: \"Jane\" console.log(person.lastName);\
    \  // Output: \"Smith\" \n```\n\n在这个例子中，`fullName` setter 接收一个全名作为输入，将其拆分为 `firstName`\
    \ 和 `lastName` 属性，并相应地更新它们。\n\nSetter 对于在数据赋值给属性之前进行验证或转换非常有用。它们提供了一种简洁的方式确保对象的状态保持一致和有效。\n\
    \n### 结合 getter 和 setter\n\n你可以对同一个属性名同时使用 getter 和 setter，创建一个同时具有读写访问的计算属性：\n\
    \n```javascript\nconst  circle  = {_radius:  5,\n\n  get  diameter() {\n\n   \
    \ return  this._radius  *  2;\n\n  },\n\n  set  diameter(value) {\n\n    if (value\
    \  <=  0) {\n\n      throw  new  Error('Diameter must be positive');\n\n    }\n\
    \n    this._radius  =  value  /  2;\n\n  }\n\n}; console.log(circle.diameter);\
    \ // Output: 10 circle.diameter  =  14; console.log(circle._radius); // Output:\
    \ 7 \n```\n\n在这个例子中，`diameter` 是一个基于 `_radius` 的计算属性。getter 计算直径，setter 根据新的直径值更新\
    \ `_radius`，并包含验证。\n\n### getter 和 setter 的优势\n\n1. 封装：它们允许你隐藏属性如何计算或存储的内部实现细节。\n\
    \n2. 验证：Setter 可以包含逻辑以确保只有有效的值被赋给属性。\n\n3. 计算属性：Getter 可以基于其他属性返回计算值。\n\n4. 向后兼容：你可以从简单属性开始，然后在不改变对象公共接口的情况下添加\
    \ getter 和 setter。\n\n通过利用 getter 和 setter，你可以创建更健壮、更灵活的对象，保持对属性访问和修改的控制，从而产生更简洁、更易维护的代码。\n\
    \n## 使用 `Object.freeze()` 和 `Object.seal()` 冻结和密封对象\n\n"
- fmt: "\nAs your JavaScript applications grow in complexity, you may find situations\
    \ where you want to prevent modifications to objects. JavaScript provides two\
    \ powerful methods for controlling the mutability of objects: `Object.freeze()`\
    \ and `Object.seal()`. These methods allow you to lock down objects to various\
    \ degrees, providing immutability and protecting against unintended changes.\n\
    \n### `Object.freeze()`: Creating Immutable Objects\n\n`Object.freeze()` is the\
    \ strictest way to make an object immutable. When you freeze an object:\n\n1.\
    \ You can't add new properties to it.\n2. You can't remove existing properties.\n\
    3. You can't modify the values of existing properties.\n4. You can't change the\
    \ configurability, writability, or enumerability of existing properties.\n\nHere's\
    \ an example of how `Object.freeze()` works:\n\n```\nconst person = {name: 'John\
    \ Doe',\n  age: 30,\n  address: {street: '123 Main St',\n    city: 'Anytown' }\n\
    };\nObject.freeze(person);\n// Attempting to modify the frozen object\nperson.name\
    \ = 'Jane Doe'; // This will fail silently in non-strict mode\nperson.newProperty\
    \ = 'This won't be added';\ndelete person.age; // This will also fail\nconsole.log(person);\
    \ // Output: { name: 'John Doe', age: 30, address: { street: '123 Main St', city:\
    \ 'Anytown' } }\n```\n\nIn this example, after freezing the `person` object, all\
    \ attempts to modify it are ignored. The object remains in its original state.\n\
    \nIt's important to note that `Object.freeze()` performs a shallow freeze. If\
    \ the object contains nested objects or arrays, their properties can still be\
    \ modified:\n\n```\nperson.address.street = '456 Elm St'; // This will work\n\
    console.log(person.address.street); // Output: '456 Elm St'\n```\n\nTo achieve\
    \ a deep freeze, you would need to recursively apply `Object.freeze()` to all\
    \ nested objects.\n\n### `Object.seal()`: Preventing Extensions and Deletions\n\
    \n`Object.seal()` is a slightly less restrictive method compared to `Object.freeze()`.\
    \ When you seal an object:\n\n1. You can't add new properties to it.\n2. You can't\
    \ remove existing properties.\n3. You can modify the values of existing properties.\n\
    4. You can't change the configurability or enumerability of existing properties.\n\
    \nHere's an example of how `Object.seal()` works:\n\n```\nconst car = {make: 'Toyota',\n\
    \  model: 'Corolla',\n  year: 2020\n};\nObject.seal(car);\n// Modifying existing\
    \ properties is allowed\ncar.year = 2021;\n// Attempting to add or delete properties\n\
    car.color = 'red'; // This will fail silently in non-strict mode\ndelete car.model;\
    \ // This will also fail\nconsole.log(car); // Output: { make: 'Toyota', model:\
    \ 'Corolla', year: 2021 }\n```\n\nIn this example, we can modify the `year` property\
    \ of the sealed `car` object, but we can't add new properties or delete existing\
    \ ones.\n\n### Checking Object Status\n\nJavaScript provides methods to check\
    \ whether an object is frozen or sealed:\n\n```\nconst frozenObj = Object.freeze({});\n\
    const sealedObj = Object.seal({});\nconst normalObj = {};\nconsole.log(Object.isFrozen(frozenObj));\
    \ // true\nconsole.log(Object.isSealed(frozenObj)); // true (frozen objects are\
    \ also sealed)\nconsole.log(Object.isSealed(sealedObj)); // true\nconsole.log(Object.isFrozen(sealedObj));\
    \ // false\nconsole.log(Object.isSealed(normalObj)); // false\nconsole.log(Object.isFrozen(normalObj));\
    \ // false\n```\n\n### Use Cases for Freezing and Sealing Objects\n\n1. **Constants**:\
    \ When you have configuration objects or settings that should never change during\
    \ the execution of your program.\n2. **Preventing Accidental Modifications**:\
    \ In large codebases, freezing objects can help prevent unintended modifications\
    \ by other parts of the code.\n3. **API Responses**: When working with API responses\
    \ that you want to ensure remain unmodified throughout your application.\n4. **Immutable\
    \ Data Structures**: For implementing immutable data patterns in your application,\
    \ which can lead to more predictable state management.\n5. **Security**: In some\
    \ cases, freezing objects can prevent certain types of attacks that rely on modifying\
    \ object properties.\n\nBy understanding and utilizing `Object.freeze()` and `Object.seal()`,\
    \ you can exert fine-grained control over the mutability of your objects, leading\
    \ to more robust and predictable code.\n\n## Understanding Enumerability and Configurability\
    \ of Properties\n\nWhen working with objects in JavaScript, it's crucial to understand\
    \ the concept of property attributes. Each property in an object has not only\
    \ a value but also a set of attributes that define its behavior. Two important\
    \ attributes are enumerability and configurability. These attributes play a significant\
    \ role in how properties behave in various contexts and operations.\n\n### Property\
    \ Attributes\n\nBefore diving into enumerability and configurability, let's review\
    \ the four main attributes of object properties:\n\n1. **Value**: The actual data\
    \ stored in the property.\n2. **Writable**: Determines if the property's value\
    \ can be changed.\n3. **Enumerable**: Determines if the property shows up in certain\
    \ operations like `for...in` loops or `Object.keys()`.\n4. **Configurable**: Determines\
    \ if the property can be deleted or its attributes modified.\n\n### Enumerability\n\
    \nThe enumerability of a property determines whether it will be included when\
    \ the object's properties are enumerated. This affects several operations and\
    \ methods in JavaScript:\n\n1. `for...in` loops\n2. `Object.keys()`\n3. `JSON.stringify()`\n\
    4. `Object.assign()`\n\nBy default, properties created by simple assignment or\
    \ with object literal notation are enumerable. However, many of the built-in properties\
    \ in JavaScript objects are not enumerable.\n\nHere's an example demonstrating\
    \ the effect of enumerability:\n\n```\nconst person = {name: 'John Doe',\n  age:\
    \ 30\n};\nObject.defineProperty(person, 'ssn', {\n  value: '123-45-6789',\n  enumerable:\
    \ false\n});\nconsole.log(Object.keys(person)); // ['name', 'age']\nfor (let prop\
    \ in person) {\n  console.log(prop); // Outputs: name, age\n}\nconsole.log(person.ssn);\
    \ // '123-45-6789'\n```\n\nIn this example, the `ssn` property is not enumerable,\
    \ so it doesn't show up in `Object.keys()` or the `for...in` loop, even though\
    \ we can still access its value directly.\n\n### Configurability\n\nThe configurability\
    \ of a property determines whether the property can be deleted from the object\
    \ and whether its attributes (other than value and writable) can be modified.\n\
    \nWhen a property is non-configurable:\n\n1. It cannot be deleted from the object.\n\
    2. Its attributes (enumerable and configurable) cannot be changed.\n3. For data\
    \ properties, it cannot be converted to an accessor property, and vice versa.\n\
    4. For data properties, the writable attribute can only be changed from `true`\
    \ to `false`.\n\nHere's an example demonstrating configurability:\n\n```\nconst\
    \ config = {apiKey: 'abc123'};\nObject.defineProperty(config, 'apiKey', {\n  configurable:\
    \ false\n});\ndelete config.apiKey; // This will fail silently in non-strict mode\n\
    console.log(config.apiKey); // 'abc123'\n// Attempting to redefine the property\
    \ will throw an error\nObject.defineProperty(config, 'apiKey', {\n  enumerable:\
    \ false\n}); // Throws TypeError\n```\n\nIn this example, after making `apiKey`\
    \ non-configurable, we can't delete it or change its attributes.\n\n### Checking\
    \ and Modifying Property Attributes\n\nJavaScript provides methods to check and\
    \ modify property attributes:\n\n1. `Object.getOwnPropertyDescriptor()`: Returns\
    \ a property descriptor for a named property on an object.\n\n```\nconst person\
    \ = { name: 'John' };\nconsole.log(Object.getOwnPropertyDescriptor(person, 'name'));\n\
    // Output: { value: 'John', writable: true, enumerable: true, configurable: true\
    \ }\n```\n\n2. `Object.defineProperty()`: Defines a new property directly on an\
    \ object, or modifies an existing property, and returns the object.\n\n```\nconst\
    \ car = {};\nObject.defineProperty(car, 'model', {\n  value: 'Toyota',\n  writable:\
    \ false,\n  enumerable: true,\n  configurable: false\n});\ncar.model = 'Honda';\
    \ // This will fail silently in non-strict mode\nconsole.log(car.model); // 'Toyota'\n\
    ```\n"
