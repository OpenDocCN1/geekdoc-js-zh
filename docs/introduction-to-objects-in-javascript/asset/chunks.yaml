    # 数组和对象


    ## 概述


    ```javascript

    let person = {name: "Alice", age: 28}; console.log(person.name); // Outputs: Alice
    console.log(person["age"]); // Outputs: 28

    ```


    ## 比较


    ### 使用场景


    数组适用于以下情况：


    *   你需要一个有序的同类元素集合。

    *   元素的顺序很重要。

    *   你想对整个集合执行操作（如映射或过滤）。


    对象更适合以下情况：


    *   你需要将值与特定的名称或键关联。

    *   你想表示一个具有多种属性的实体。

    *   你需要根据键快速查找值。


    ### 灵活性与方法


    数组内置了常用操作的方法：


    ```javascript

    let numbers = [1, 2, 3, 4, 5]; numbers.push(6); // Adds 6 to the end numbers.pop();
    // Removes the last element let doubled = numbers.map(n => n * 2); // Creates
    a new array with doubled values

    ```


    对象在可容纳的数据类型方面更加灵活：


    ```javascript

    let mixed = {number: 42, string: "Hello", array: [1, 2, 3], nestedObject: {x:
    1, y: 2}, function: function() { console.log("I''m a method!"); } };

    ```


    ### 性能考量


    *   数组针对数值索引进行了优化，遍历所有元素通常更快。

    *   对象在通过键检索特定属性时提供更快的访问。


    ### 迭代


    遍历数组非常直接：


    ```javascript

    let colors = ["red", "green", "blue"]; for (let i = 0; i < colors.length; i++)
    { console.log(colors[i]); } // or colors.forEach(color => console.log(color));

    ```


    遍历对象需要特定的方法或循环：


    ```javascript

    let person = {name: "Bob", age: 30, city: "New York"}; for (let key in person)
    { console.log(key + ": " + person[key]); } // or Object.keys(person).forEach(key
    => console.log(key + ": " + person[key]));

    ```


    ### 转换与操作


    数组拥有强大的内置转换方法：


    ```javascript

    let numbers = [1, 2, 3, 4, 5]; let evenNumbers = numbers.filter(n => n % 2 ===
    0); let sum = numbers.reduce((acc, curr) => acc + curr, 0);

    ```


    对象需要自定义逻辑或工具库来完成类似操作：


    ```javascript

    let scores = {Alice: 95, Bob: 80, Carol: 90}; let highScores = Object.entries(scores).filter(([name,
    score]) => score >= 90).reduce((obj, [name, score]) => {obj[name] = score; return
    obj; }, {});

    ```


    理解这些差异能让你根据具体的编程需求选择最合适的数据结构，从而编写出更高效、更易读的代码。


    ## 对象语法与示例


    现在我们已经探讨了对象的概念以及它们与数组的区别，接下来深入了解 JavaScript 中对象的具体语法。理解创建和操作对象的各种方式对于高效编写 JavaScript
    程序至关重要。


    ### 对象字面量表示法


    创建对象最常见、最直接的方式是使用对象字面量表示法：


    ```javascript

    let car = {make: "Honda", model: "Civic", year: 2022, isElectric: false, colors:
    ["red", "blue", "white"], displayInfo: function() { console.log(`This is a ${this.year}
    ${this.make} ${this.model}.`); } };

    ```


    在这个例子中：


    *   我们创建了一个 `car` 对象，包含多个属性和一个方法。

    *   属性使用键:值对定义，用逗号分隔。

    *   `displayInfo` 属性保存了一个函数，因此它成为 `car` 对象的一个方法。


    ### 访问对象属性


    访问对象属性主要有两种方式：


    1.  点表示法：


    ```javascript

    console.log(car.make); // Outputs: Honda car.displayInfo(); // Calls the method

    ```


    2.  方括号表示法：


    ```javascript

    console.log(car["model"]); // Outputs: Civic let propertyName = "year"; console.log(car[propertyName]);
    // Outputs: 2022

    ```


    当属性名存储在变量中，或者属性名包含特殊字符或空格时，方括号表示法特别有用。


    ### 添加和修改属性


    JavaScript 中的对象是动态的，你可以随时添加或修改属性：


    ```javascript

    // Adding a new property car.mileage = 5000; // Modifying an existing property
    car.year = 2023; // Adding a new method car.honk = function() { console.log("Beep
    beep!"); }; car.honk(); // Outputs: Beep beep!

    ```


    ### 嵌套对象


    对象可以包含其他对象，从而构建复杂的数据结构：


    ```javascript

    let student = {name: "Emma", age: 20, grades: {math: 95, science: 88, history:
    92}, address: {street: "123 College Ave", city: "University Town", country: "Educationland"
    } }; console.log(student.grades.math); // Outputs: 95 console.log(student.address.city);
    // Outputs: University Town

    ```


    ### 对象构造函数


    虽然对象字面量很常见，但你也可以使用构造函数来创建对象：


    ```javascript

    function Person(name, age, occupation) { this.name = name; this.age = age; this.occupation
    = occupation; this.introduce = function() { console.log(`Hi, I''m ${this.name},
    a ${this.age}-year-old ${this.occupation}.`); }; } let john = new Person("John
    Doe", 30, "Engineer"); john.introduce(); // Outputs: Hi, I''m John Doe, a 30-year-old
    Engineer.

    ```


    当你需要创建多个具有相同结构的对象时，这种方法非常有用。


    ### Object.create() 方法


    另一种创建对象的方式是使用 `Object.create()` 方法：


    ```javascript

    let personPrototype = {introduce: function() { console.log(`Hi, I''m ${this.name},
    a ${this.age}-year-old ${this.occupation}.`); } }; let sarah = Object.create(personPrototype);
    sarah.name = "Sarah Johnson"; sarah.age = 25; sarah.occupation = "Designer"; sarah.introduce();
    // Outputs: Hi, I''m Sarah Johnson, a 25-year-old Designer.

    ```


    此方法会创建一个具有指定原型对象的新对象。


    ### 计算属性名


    ES6 引入了计算属性名，允许你使用表达式作为属性名：


    ```javascript

    let propName = "color"; let item = {name: "Box", [propName]: "blue" }; console.log(item.color);
    // Outputs: blue

    ```


    ### 简写属性名


    当属性值是一个与属性键同名的变量时，可以使用简写语法：


    ```javascript

    let name = "Alice"; let age = 28; let person = { name, age }; console.log(person);
    // Outputs: { name: "Alice", age: 28 }

    ```


    ### 对象解构


    解构允许你从一个对象中提取多个属性，并在一条语句中赋值给变量：


    ```javascript

    let { name, age, occupation } = john; console.log(name); // Outputs: John Doe
    console.log(age); // Outputs: 30

    ```


    ### 对象的展开运算符


    展开运算符（...）可用于将一个对象的属性复制到另一个对象：


    ```javascript

    let basicInfo = { name: "Tom", age: 25 }; let detailedInfo = { ...basicInfo, occupation:
    "Teacher", city: "New York" }; console.log(detailedInfo); // Outputs: { name:
    "Tom", age: 25, occupation: "Teacher", city: "New York" }

    ```


    ### 对象方法


    JavaScript 中的对象自带几个内置方法：


    1.  `Object.keys()`：


    ```javascript

    let keys = Object.keys(car); console.log(keys); // Outputs an array of the object''s
    keys

    ```


    2.  `Object.values()`：


    ```javascript

    let values = Object.values(car); console.log(values); // Outputs an array of the
    object''s values

    ```


    3.  `Object.entries()`：


    ```javascript

    let entries = Object.entries(car); console.log(entries); // Outputs an array of
    [key, value] pairs

    ```


    4.  `Object.assign()`：


    ```javascript

    let target = { a: 1, b: 2 }; let source = { b: 3, c: 4 }; let result = Object.assign(target,
    source); console.log(result); // Outputs: { a: 1, b: 3, c: 4 }

    ```


    这些方法提供了与对象交互和操作对象的强大方式。


    ### 冻结与密封对象


    JavaScript 提供了使对象不可变的方法：


    1.  `Object.freeze()`：


    ```javascript

    let frozenCar = Object.freeze(car); frozenCar.make = "Toyota"; // This change
    will be ignored in strict mode

    ```


