    \ // Output: { name: \"Sarah\", age: 35, profession: \"Designer\" } \n\nThese\
    \ exercises cover a wide range of object-related concepts in JavaScript. Practice\
    \ them thoroughly to gain a solid understanding of how to work with objects effectively\
    \ in your code.\n\n## C: Common Interview Questions on Objects in JavaScript\n\
    \nWhen preparing for a JavaScript interview, it's crucial to have a strong grasp\
    \ of objects, as they are a fundamental concept in the language. Here are some\
    \ common interview questions related to objects in JavaScript, along with detailed\
    \ answers and explanations.\n\n### 1\\. What is the difference between dot notation\
    \ and bracket notation when accessing object properties?\n\nAnswer:\n\nDot notation\
    \ and bracket notation are two ways to access object properties in JavaScript:\n\
    \n1.  Dot Notation:\n\n*   Syntax: object.property\n\n*   Used when the property\
    \ name is a valid identifier (no spaces, doesn't start with a number, etc.)\n\n\
    *   More concise and commonly used\n\n*   Cannot be used with dynamic property\
    \ names\n\n2.  Bracket Notation:\n\n*   Syntax: object['property']\n\n*   Can\
    \ be used with any string (including those with spaces or starting with numbers)\n\
    \n*   Allows for dynamic property access using variables\n\n*   Necessary when\
    \ property names are not valid identifiers\n\nExample:\n\nconst  person  = {name:\
    \  'John',\n\n    'age': 30,\n\n    'favorite color': 'blue' }; console.log(person.name);\
    \ // Dot notation console.log(person['age']); // Bracket notation console.log(person['favorite\
    \ color']); // Bracket notation (required for property with space)   const  key\
    \  =  'name'; console.log(person[key]); // Dynamic property access using bracket\
    \ notation \n\n### 2\\. How do you check if a property exists in an object?\n\n\
    Answer:\n\nThere are several ways to check if a property exists in an object:\n\
    \n1.  Using the in operator:\n\nconst  person  = { name:  'John', age:  30 };\
    \ console.log('name'  in  person); // true console.log('gender'  in  person);\
    \ // false \n\n2.  Using the hasOwnProperty() method:\n\nconsole.log(person.hasOwnProperty('name'));\
    \ // true console.log(person.hasOwnProperty('toString')); // false (inherited\
    \ property) \n\n3.  Using the Object.hasOwn() method (introduced in ES2022):\n\
    \nconsole.log(Object.hasOwn(person, 'name')); // true console.log(Object.hasOwn(person,\
    \ 'toString')); // false \n\n4.  Comparing with undefined:\n\nconsole.log(person.name\
    \  !==  undefined); // true console.log(person.gender  !==  undefined); // false\
    \ \n\nNote that the in operator checks both own properties and inherited properties,\
    \ while hasOwnProperty() and Object.hasOwn() only check own properties. Comparing\
    \ with undefined can sometimes give false negatives if a property is explicitly\
    \ set to undefined.\n\n### 3\\. What is the difference between Object.freeze()\
    \ and Object.seal()?\n\nAnswer:\n\nBoth Object.freeze() and Object.seal() are\
    \ methods used to restrict modifications to objects, but they differ in the level\
    \ of restriction:\n\n1.  Object.freeze():\n\n*   Prevents adding new properties\n\
    \n*   Prevents removing or modifying existing properties\n\n*   Makes the object\
    \ immutable (except for nested objects)\n\n*   Returns the frozen object\n\n2.\
    \  Object.seal():\n\n*   Prevents adding new properties\n\n*   Allows modifying\
    \ existing properties\n\n*   Prevents removing existing properties\n\n*   Returns\
    \ the sealed object\n\nExample:\n\nconst  frozenObj  =  Object.freeze({ x:  1,\
    \ y:  2 }); frozenObj.x  =  10; // Fails silently in non-strict mode frozenObj.z\
    \  =  3; // Fails silently in non-strict mode console.log(frozenObj); // { x:\
    \ 1, y: 2 }   const  sealedObj  =  Object.seal({ a:  1, b:  2 }); sealedObj.a\
    \  =  10; // Allowed sealedObj.c  =  3; // Fails silently in non-strict mode delete\
    \  sealedObj.b; // Fails silently in non-strict mode console.log(sealedObj); //\
    \ { a: 10, b: 2 } \n\nNote that both methods perform shallow freezing/sealing,\
    \ meaning nested objects can still be modified unless they are also frozen or\
    \ sealed.\n\n### 4\\. Explain the concept of prototypal inheritance in JavaScript.\n\
    \nAnswer:\n\nPrototypal inheritance is a fundamental concept in JavaScript that\
    \ allows objects to inherit properties and methods from other objects. Each object\
    \ has an internal link to another object called its prototype. When a property\
    \ is accessed on an object, JavaScript first looks for it on the object itself.\
    \ If not found, it looks up the prototype chain until it finds the property or\
    \ reaches the end of the chain (usually Object.prototype).\n\nKey points:\n\n\
    1.  Every object in JavaScript has a prototype, except for the base Object.prototype.\n\
    \n2.  The prototype of an object is accessible via Object.getPrototypeOf(obj)\
    \ or the deprecated __proto__ property.\n\n3.  Constructor functions can set the\
    \ prototype of objects created with the new keyword.\n\n4.  The prototype property\
    \ of a constructor function becomes the prototype of objects created with that\
    \ constructor.\n\nExample:\n\nfunction  Animal(name) {\n\n    this.name  =  name;\n\
    \n} Animal.prototype.speak  =  function() {\n\n    console.log(`${this.name} makes\
    \ a sound.`);\n\n}; function  Dog(name) {\n\n    Animal.call(this, name);\n\n\
    } Dog.prototype  =  Object.create(Animal.prototype); Dog.prototype.constructor\
    \  =  Dog; Dog.prototype.bark  =  function() {\n\n    console.log(`${this.name}\
    \ barks.`);\n\n}; const  dog  =  new  Dog('Rex'); dog.speak(); // Rex makes a\
    \ sound. dog.bark(); // Rex barks. \n\nIn this example, Dog inherits from Animal\
    \ through prototypal inheritance. The Dog prototype is set to an object that has\
    \ Animal.prototype as its prototype, creating the inheritance chain.\n\n### 5\\\
    . What is the purpose of the this keyword in JavaScript objects?\n\nAnswer:"
