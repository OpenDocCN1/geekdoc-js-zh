  md: '# # 2 | How to Create an Extension


    Like a plug-in, an extension provides new capabilities to its host environment.
    With the GoLive CS2 SDK, you can use ExtendScript (Adobe''s ECMAScript-compliant
    version of JavaScript) and HTML to create extensions that extend and customize
    the Adobe GoLive web-design environment.


    # ## About Adobe GoLive CS2 SDK Extensions


    An extension that you create for Adobe GoLive CS2 SDK using the SDK is actually
    an HTML file that GoLive uses in a special way. Creating an extension is similar
    to creating a web page: you add tags and scripts to this file to define content.
    Instead of defining content for a web page, however, you use tags that define
    menus, dialogs, palettes, inspectors, and additional objects in the GoLive design
    environment. You can also create custom tags to define objects of your own.


    When GoLive loads an extension, it makes the object defined in that extension
    available to GoLive users through the GoLive UI and through UI elements that you
    define.


    +   - You can add to the GoLive menus, and create your own menus.

    - You can add to GoLive windows—for example, add custom components to the Objects
    palette—or create your own dialogs and palettes.

    - You can create custom elements, to extend the kind of markup a user can add
    to a page with GoLive''s simple drag-and-drop technique, and customize the GoLive
    Inspector to make it display and modify your component''s attributes.

    - You can extend GoLive to integrate with other applications, web services, and
    more.


    # ## What can extensions do?


    One of the most popular uses of an extension is the programmatic editing of files
    written in HTML, XML, ASP, JSP, and other markup languages.


    To ease your learning curve, GoLive allows you to use familiar tools for this
    task. The JavaScript DOM in GoLive works just like the one in a web browser, providing
    programmatic access to the markup elements in an HTML file through the markup
    object. You can edit HTML files just as a browser or other HTML editor would.'
  merge: -1
  pgno: 72
- img_proc: false
  md: 'The SDK can operate directly on documents in Layout view, allowing you to create
    extensions that automate the creation or modification of HTML pages. The SDK can
    also operate on documents without displaying them, enabling extensions to process
    batches of files rapidly.


    In addition to supporting standard JavaScript DOM events, GoLive provides additional
    events that support the programmatic modification of documents and sites in the
    GoLive design environment. Responding to an event in your extension is similar
    to responding to one in a web page: you define an appropriately named JavaScript
    function within the HTML file''s `<script>` element. For example, to respond to
    the `selection` event, you define and register a handler function for that event
    inside a `<script>` element in the Main.html file that defines the extension.


    The GoLive DOM supports not just HTML, but XML (Extensible Markup Language). This
    ability enables GoLive to recognize other markup languages, such as those that
    define server-side tags, as well as the special `<jsx... >` tags that the SDK
    provides. As a result, you can edit an extension''s Main.html file (or any of
    the other file types noted) in a GoLive document window, just like any other markup
    document.


    GoLive CS2 SDK provides enhanced support for site-level operations, including
    notification of changes in the content or organization of the Site window, and
    programmatic selection of site assets according to criteria you specify. For example,
    an extension can select all files in the site that would take longer than a minute
    to download at 56 kbps. You can then process each selected file in some way. For
    example, you might compress it, downsample it, or reformat it in some way that
    would reduce the time required to download it.


    In addition to its extended DOM and event model, the GoLive object model provides
    access to the GoLive application itself, which in turn makes available a host
    of other services and content.


    The GoLive application provides access to:


    +   - The GoLive user interface (Menus, Dialogs, Palettes, Inspectors, Site window,
    Document windows, Site reports, built-in localization).

    - User settings, global stylesheets, preferences, shared data, other extensions.

    - Custom/server tag support and special parsing behavior.

    - You can create extensions that provide your own customized tags and content
    as icons in the Objects palette. You can also preprocess documents before the
    GoLive parser reads them, to deal with encoding issues or to mimic the effects
    of server-side code in Layout view, which is the graphical editing view in GoLive.'
  merge: -1
  pgno: 73
- img_proc: false
  md: '+   * Automation and macros: apply automated edits to every file in a site,
    or generate entire sites programmatically.

    * Dynamic Content database content.

    * Resources on network and WebDAV servers.


    The typical extension can and does, of course, define things for itself in its
    own code, such as its own user interface items, custom functions, custom tags,
    SDK-provided tags, HTML tags, localization, source translation, and more. To accomplish
    this, you just add tags and functions to an extension''s Main.html file as you
    might add them to a web page: tags go in the file''s `<head>` and `<body>` elements,
    and JavaScript functions go in the file''s `<script>` elements.


    XML support enables even further extensibility, allowing GoLive to grow rapidly
    and conform easily to new standards that might emerge in the future.


    # Anatomy of an Extension


    At its most basic, an extension consists of a Main.html file in a subfolder of
    the Extend Scripts folder, called the extension folder. The extension folder can
    contain other files that the extension requires, such as images. These additional
    files can be kept in subfolders. For example, the Custom Box extension''s folder
    contains the extension''s Main.html file, and also an Images subfolder that holds
