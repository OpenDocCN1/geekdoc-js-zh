  md: '# # bounds Object


    Class: Bounds


    This object encapsulates a set of bounding dimensions for an interface element
    (window or control), together with its position with respect to its parent window
    or the screen. Dimensions are measured in pixels, and a window''s upper left corner
    is considered the origin (0,0).


    (Introduced in 8.0)


    # ## Acquiring a bounds object


    Get this object from a control Object Types (page 78) or window Object (page 313):


    ```

    var myBounds = controlObj.bounds;

    ```


    # ## bounds object properties


    This object has the following properties:


    | Property | Type | Description |

