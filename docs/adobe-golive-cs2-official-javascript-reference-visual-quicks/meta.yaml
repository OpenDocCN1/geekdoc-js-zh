  md: '# 4 Objects


    This chapter describes the JavaScript objects that the SDK supplies. Some of these
    objects are created when GoLive interprets a Main.html file, while others, such
    as the Application object, are always available.


    # Global Properties and Functions


    This section describes properties and methods available within the global JavaScript
    namespace.


    # Global properties


    Global properties provide access to the Application object, the Module object,
    the Common object, and all currently available Dialogs, Palettes, Boxes, and Menus.


    Various global properties provide access to collections of Dialogs, Palettes,
    Boxes, and Menus. A collection Object (page 72) is like an array that enables
    you retrieve objects by name as well as by integer index. (When two or more objects
    in a collection have the same name value, those objects cannot be retrieved by
    name reliably.)


    | Name | Type | Description |

    | :--- | :--- | :--- |

    | app | App | The app Object (page 53) for the GoLive application. Read-only.
    |

    | boxes | Box Collection | A read-only array box Objects (page 64) for all custom
    boxes running in the current document. You can retrieve boxes from this array
    by name or by numeric index. |

    | common | Common | The common Object (page 77) allows modules to share and exchange
    data. All properties of the common object are shared among all modules. Unlike
    the prefs object, properties are not persistent. They can hold anything except
    objects, which cannot be shared among extension modules. |

    | controls | Control Collection | Deprecated in 8.0. A read-only array of control
    Object Types (page 78) for all controls that have run at least once in the current
    user session, and of dynamic controls. You can retrieve controls from this array
    by name. |

    | dialogs | Window Collection | A read-only array of all window Objects (page
    313) that have run at least once in the current user session. You can retrieve
    dialogs from this array by name or by numeric index. |

    | document | Document | The document Object (page 138) for the current document.
    Read-only. |'
