  md: '# # comment Object


    Class: JSXComment


    The `comment` object represents a markup comment. When you load an HTML document,
    GoLive generates a tree of markup objects to represent the contents. The objects
    have a tree structure that matches that in the source HTML. The markup objects
    are of various types: the element Object (page 156) for elements, the text Object
    (page 276) for text items, the comment Object (page 75) for comments, and the
    markup Object (page 215) for all other kinds of markup.


    +   - This object includes the Node Interface (page 229), whose properties and
    functions allow you to traverse the node tree.

    - This object includes the Markup Interface (page 209), whose properties and functions
    allow you to directly access document content.

    - In addition, it defines some properties and functions of its own, as shown here.


    (Introduced in 7.0)


    # # Acquiring comment objects


    +   - Create a new `comment` object using the document Object''s createComment
    (page 142) function.

    - For a markup document, the document Object''s documentElement (page 138) property
    holds the root object of the markup tree. The page''s content is represented by
    nodes in the tree. To retrieve the root of the markup tree for a document:


    ```

    var tree = document.documentElement;

    ```


    You can traverse the markup tree using the Node Interface (page 229) properties
    and functions of any object in the tree. In a `comment` object:


    ```

    elementType=comment

    nodeType=8

    nodeName=#comment

    ```


    # # comment object properties


    In addition to those of the Node Interface (page 229) and Markup Interface (page
    209), a `comment` object has these properties:


    | Property | Type | Description |

    |---|---|---|

    | data | String | The text of the comment. |

    | length | Number | Length of the text in characters. |

    | nodeValue | String | Content of the comment. |'
  merge: -1
