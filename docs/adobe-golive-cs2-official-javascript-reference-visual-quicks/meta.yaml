  md: "```\n<script>\n    // functions that provide your extension's behavior go here\n\
    </script>\n// Tags that define your extension go here.\n</body>\n</html>\n```\n\
    \nWhen GoLive loads this `Main.html` file, it creates a `module` object to represent\
    \ this extension and sets the value of the object's `name` property to the `HelloModule`\
    \ string. The presence of the `debug` attribute enables debugging services in\
    \ the JavaScript Debugger window. Always remove the `debug` attribute from commercial\
    \ versions of your extension.\n\nThe `<jsxmodule>` tag and all of its attributes\
    \ are optional. If you do not supply this tag, or if this tag's `name` attribute\
    \ is missing, GoLive assigns a default value to the `name` property of the `module`\
    \ object it creates to represent your extension. However, it is recommended that\
    \ you explicitly define your own `<jsxmodule>`'s `name` attribute so you can use\
    \ it for debugging purposes.\n\n# Adding event-handling functions\n\nThe JavaScript\
    \ functions that provide an extension's behavior reside within its `<script>`\
    \ tags (page 323). Many of these functions are event handlers, which you register\
    \ for particular event target objects. GoLive calls these functions in response\
    \ to specific events, such as the GoLive user clicking something or entering text.\
    \ Your extension can provide a handler to respond to a specific event in a specific\
    \ object, such as the selection of a menu item or the opening of a document. When\
    \ the event occurs in a target object, GoLive looks for all registered handlers\
    \ for that event in that object, and if it finds one, executes it.\n\nThe `GoLive\
    \ CS2 SDK Programmer's Reference` provides the names and syntax of all the event\
    \ and event target objects, and describes the handlers that you can define. Most\
    \ of them are optional; you only need to supply handlers for the events you need\
    \ to respond to.\n\nModule startup and termination events are handled by functions\
    \ with predefined names. For example, on startup, GoLive checks all loaded modules\
    \ for implementations of the `initializeModule` and `startModule` functions (page\
    \ 359). If your module needs to perform any initialization, it can do it in these\
    \ functions. The `initializeModule` function is called as soon as the module is\
    \ loaded, and can perform any initialization that does not depend on other modules,\
    \ and the `startModule` function is called after all modules are loaded. Similarly,\
    \ your implementation of the"
