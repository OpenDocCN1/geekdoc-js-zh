  md: "GoLive waits for a response. Each extension can specify its own timeout that\
    \ GoLive uses to execute that extension's scripts.\n\nTo set the script execution\
    \ timeout, your extension's `Main.html` file must include a `<jsxmodule>` tag\
    \ (page 321) that provides a `timeout` attribute. The value of this attribute\
    \ is the number of seconds GoLive waits for a script to return control before\
    \ it exits the script. Values of `0` or `false` restore the default behavior of\
    \ never timing out.\n\n```\n<html>\n<body>\n    // give scripts ten seconds to\
    \ complete before unconditional exit\n    <jsxmodule timeout=10>\n        // scripts\
    \ and SDK tags go here\n    </jsxmodule>\n</body>\n</html>\n```\n\n**Note:** An\
    \ external library that calls an extension can specify a separate temporary script\
    \ execution timeout for each JavaScript call.\n\n# Progress bars\n\nTo provide\
    \ user feedback during lengthy operations, your extension can display a progress\
    \ bar dialog or busy bar dialog. You can specify the title and the text to be\
    \ shown while processing. For example:\n\n```\napp.startProgress( 'Please wait',\
    \ 'Progress: 0%', false); //show bar\napp.setProgress(0.6, 'Progress: 60%'); //update\
    \ periodically\n```\n\n![](bbox=[0.18, 0.6, 0.65, 0.7])\n\nA busy bar does not\
    \ display a progress value; instead, it rotates the spiral indicator about once\
    \ a second. For example:\n\n```\napp.startProgress( 'Please wait', 'Processing',\
