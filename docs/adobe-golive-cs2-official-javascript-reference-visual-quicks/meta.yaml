    and a palette entry, as specified by the classid attributes of the `<jsxelement>`,
    `<jsxpaletteentry>` and `<jsxinspector>` elements associated with this box.

    In GoLive 6 or higher, set this value to activate an alternate Inspector for this
    box. |'
