    \ | dialogs global variable | The current document's windows and dialogs that\
    \ have run at least once. Read-only. |\n| documentCollection | documents global\
    \ property | Documents open in GoLive. |\n| history | document.history property\
    \ | Undo actions for the document. |\n| htmlStyleSetCollection | app.htmlStyles\
