  md: '# # box Object


    Class: JSXBox


    A box object manages the visual representation of a custom element in Layout view.


    The box object itself provides only a few convenience functions. Handlers that
    you register for the parseBox (page 366), drawBox (page 362), boxResized (page
    360), and inspectBox (page 363) events implement the object’s basic functionality.
    To use a box object, your extension must provide these methods, as described in
    Chapter 6, “Events and Event Handlers.”


    # ## Acquiring box objects


    GoLive creates a box object whenever the user drags a custom element’s icon from
    the Objects palette to the Layout view of a GoLive document window, or when GoLive
    reads a document that contains a custom tag. GoLive does not create box objects
    when interpreting documents opened by the openMarkup method.


    # ## box object properties


    Most of the box object’s properties describe its visual representation. You can
    set these values to change the box’s appearance in Layout view. To update the
    affected HTML, call methods of the markup object that the box.element property
    provides.


    | alignment | String | Gets or sets the alignment of the box. Possible values
    are:

    bottom

    middle

    top

    line

    left

    right

    absBottom

    absTop |

