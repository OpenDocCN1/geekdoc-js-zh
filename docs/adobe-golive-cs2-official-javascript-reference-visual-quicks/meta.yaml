  md: '# # 1 Installing and Configuring the GoLive SDK


    The first part of this chapter describes how to install the GoLive CS2 SDK and
    introduces the JavaScript environment that GoLive provides for extensions. The
    next part specifies the file and folder structure you must use to create an extension.
    This chapter concludes with an example of a simple extension that writes messages
    in the JavaScript Debugger window.


    # ## Installing the GoLive CS2 SDK


    The GoLive CS2 SDK requires version 8.0 of Adobe GoLive CS2 and is included in
    the default installation. Updates to the SDK and to this documentation set are
    available at http://partners.adobe.com/asn.


    # ### Installing the core set of tools and sample extensions


    This section describes how to install an extension in GoLive. GoLive CS2 SDK files
    are initially installed in a subfolder of the Adobe application folder called
    `Adobe GoLive SDK 8.0r1`. The extensions provided with the SDK are in the `Samples`
    and `Tools` folders.


    Each sub-folder in the `Samples` and `Tools` folders holds a different example
    of an extension. It is recommended that you install the core set of sample extensions
    and tools, and use them to help learn about and create your own extensions.


    When you have become familiar with the use of the tags, scripts, and objects these
    samples illustrate, you can remove any or all of them, as you prefer.


    # #### Installing the core extensions


    To install an existing extension, in most cases you simply copy or move the folder
    to the `GoLive_dir/Modules/Extend Scripts` folder. See the Release Notes for a
    list of samples whose installation requires more than this; in these cases, the
    installation instructions are included in the extension''s `Main.html` file or
    in the Release Notes.


    +   > The following steps make the core extensions available to GoLive:

    1. Quit GoLive if it is running.

    2. Copy at least the following extension folders from the `GoLiveSDK_dir/Samples`
    folder to the `Adobe GoLive 8.0/Modules/Extend Scripts` folder:'
  merge: -1
  pgno: 66
- img_proc: false
  md: '+   - Custom Box

    - KeyMap

    - Markup Tree

    - Menus and Dialogs

    - Palettes


    3. Copy the contents of the GoLiveSDK_dir/Samples/Common folder to the Adobe GoLive
    8.0/Modules/Extend Scripts/Common folder.


    4. Copy the following folders from the GoLiveSDK_dir/Tools folder to the GoLive_dir/Modules/Extend
    Scripts folder:


    +   - Dialog Editor

    - Edit Extension

    - Extension Builder


    5. Start GoLive.


    When GoLive starts, it loads all of the extensions present in the Extend Scripts
    folder.


    # Uninstalling an extension


    To remove an extension from GoLive, remove its folder from the Extend Scripts
    folder and restart GoLive.


    You can deactivate an extension without removing it; see "Enabling and disabling
    modules" on page 11.


    # Configuring GoLive for Extension Development


    Developing GoLive extensions is an iterative process that generally requires you
    to restart GoLive whenever you need to load a new version of the extension you
    are developing. JavaScript-only changes can be reloaded from the **JavaScript
    Debugger** without restarting GoLive.


    # Enabling the Extend Script module


    The built-in Extend Script module must be enabled before you can load or run any
    extensions. The module is enabled by default. Disabling this module disables all
    GoLive extension capabilities, which you normally do not want to do.


    ➤ If this module has become disabled, you can re-enable it as follows:

    1. Select Edit > Preferences.'
