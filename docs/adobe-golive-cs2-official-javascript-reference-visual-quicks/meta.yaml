  md: '# changeMarkup Object


    Class: JSXChangeMarkup


    This object encapsulates predefined actions that change the markup of documents.
    Each of the predefined actions performs a particular type of transformation, according
    to properties that you set. The predefined actions are:


    +   - ChangeDoctype: Changes the document type of an XML or HTML document.

    - ChangeEncoding: Changes the encoding of XML or HTML document.

    - ConvertMarkup: Converts between HTML and XHTML.

    - RewriteSource: Rewrites the document source according to various options.


    For each supported action, you can set specific properties to control the behavior;
    see setProperty (page 68).


    To use the object, create it with one of these action names, set the properties
    that control how the action is performed, and pass the object to the changeMarkup
    (page 141) function of a document Object (page 138). For example:


    ```

    changeEncoding = new JSXChangeMarkup("ChangeEncoding",

    1);

    changeEncoding.setProperty("encoding", "utf-8");

    document.changeMarkup(changeEncoding);

    ```


    (Introduced in 7.0)


    # Acquiring a changeMarkup object


    Create a changeMarkup object using the changeMarkup Constructor (page 68).


    # changeMarkup object properties


    | name | String | The name of the action encapsulated by this object. Pass this
    to the document Object''s changeMarkup (page 141) function to execute the action.
    |

    | version | Number | The version number of this action. |'
  merge: -1
