    4. Click **OK** to confirm your changes and dismiss the Preferences panel.


    5. Quit GoLive and restart it.


    # Enabling and disabling modules


    GoLive packages much of its functionality in units known as *modules*. An extension
    that you develop using the SDK is simply another kind of module that GoLive can
    use. To add some particular new functionality to GoLive, you can install and enable
    the module that provides it. You can also disable or remove a module to remove
    its associated features and behaviors.


    To turn off an extension but leave the extension in the Extend Scripts folder,
    use the **Edit > Preferences** dialog to display Modules, as shown in the figure
    above. In the list of modules, uncheck the modules of any extensions you want
    to turn off. The change takes effect when you restart GoLive.


    The precise set of modules you can disable successfully depends on the features
    your extension or site uses—you cannot disable a module your site or your extension
    requires for its functionality.'
