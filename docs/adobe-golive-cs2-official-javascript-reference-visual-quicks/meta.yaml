    The GoLive JavaScript Debugger and ExtendScript Toolkit are described in the full
    written version of the reference on the Adobe GoLive CS2 CD.


    These tools are complete development environments that allow you do more than
    just test your code—you can use them, for example, to edit documents interactively.
    To become familiar with the JavaScript environment in GoLive, try entering some
    JavaScript expressions into the Command field of a Debugger window; press ENTER
