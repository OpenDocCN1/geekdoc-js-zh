  md: '# Case sensitivity


    The HTML specification specifies that attribute and element names are not case
    sensitive; the following HTML statements are equivalent:


    ```

    <img ALT="graphics.tif">

    <img alt="graphics.tif">

    <Img Alt="graphics.tif">

    ```


    In contrast, access to JavaScript property names is case sensitive; the following
    statements are not equivalent.


    ```

    img.alt = "graphics.tif";

    img.ALT = "graphics.tif";

    ```


    In accordance with the JavaScript standard, GoLive always evaluates JavaScript
    property names case-sensitively. For example, GoLive does not consider `img.alt`
    and `img.ALT` to be equivalent. It is recommended that you adopt the convention
    of always using lowercase names to define HTML attributes. For example, the GoLive
    DOM implements the all-lowercase `bgcolor` attribute, not the mixed-case `bgColor`
    attribute.


    # Where to go for more information


    This book documents the Adobe GoLive CS2 SDK only. It does not describe the full
    JavaScript language or the use of the GoLive CS2 application.


    For instructions on how to use Adobe GoLive CS2, see GoLive Help.


    For documentation of the JavaScript language or descriptions of how to use it,
    see any of numerous works on this subject, including the following:


    +   - *JavaScript: The Definitive Guide, 4th Edition*; Flanagan, D.; O''Reilly
    2001; ISBN 0-596-00048-0

    - *JavaScript Programmer''s Reference*; Wootton, C.; Wrox 2001; ISBN 1-861004-59-1

    - *JavaScript Bible, 5th Edition*; Goodman, D. and Morrison, M.; John Wiley and
    Sons 1998; ISBN 0-7645-57432

    - *JavaScript for the World Wide Web, Fifth Edition: Visual QuickStart Guide*;
    Negrino, Tom and Smith, Dori; Peachpit 2003; ISBN 0-321-19439-X'
  merge: -1
