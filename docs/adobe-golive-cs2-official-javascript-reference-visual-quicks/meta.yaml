  md: "+   - The *value* argument is a value between 0 and 1 that specifies the portion\
    \ of the progress bar to be drawn. For example, the value .50 specifies that 50\
    \ percent of the progress bar is drawn to indicate a task half completed.\n- The\
    \ optional *message* argument is the string to display as the new status message.\
    \ You can update a busy bar with a new status message; it ignores the *value*\
    \ argument.\n\nThe setProgress method returns false when the user clicks **Stop**\
    \ in the dialog. Your code should respond to this condition by aborting the operation\
    \ that is in progress and closing the dialog. During lengthy operations, it is\
    \ especially important to call the setProgress method regularly, so that your\
    \ extension can respond quickly if the user clicks **Stop**.\n\nWhen the lengthy\
    \ operation is completed (or the user clicks **Stop**), call the stopProgress\
    \ method to close the dialog.\n\n# Progress bar example\n\nThis example displays\
    \ a progress bar. The doSomeWork function is your own code that performs the task\
