  md: "# Control: button Object\n\nThis object represents a button control. It inherits\
    \ all properties and functions of the control Object Types (page 78). (Introduced\
    \ in 7.0)\n\n# Acquiring a button object\n\n+   * The SDK creates a button object\
    \ when it interprets a <jsxcontrol> (page 337) tag with type=\"button\". You can\
    \ obtain the object by name or index from the parent window's children collection:\n\
    \  `windowObj.children[controlName];`\n  `panelObj.children[controlName];`\n*\
    \ To create a new button object dynamically, call a panel Object (page 233) or\
    \ window Object's add (page 317) function with type=\"button\". Pass an object\
    \ containing these optional creation parameters:\n\n| name | Unique JavaScript\
    \ name of the control. |\n| --- | --- |\n| helptip | A descriptive string that\
    \ appears when the mouse pointer hovers over the control. |\n| alignment | An\
    \ array containing the horizontal and vertical alignment string values for the\
    \ control. See <jsxcontrol> halign (page 339) and valign (page 339) attributes.\
    \ Default is [\"left\", \"top\"]. |\n| icon | The name of an image defined in\
    \ the extension file, to use as an icon in the button in place of a text label.\
    \ |\n\n# Example\n\n```\nmyWin.add ( \"button\", [left, top, right, bottom],\n\
    \ \"buttonlabel\",\n { name:\"myButton1\", alignment:[\"left\", \"top\"] } );\n\
    ```"
  merge: -1
