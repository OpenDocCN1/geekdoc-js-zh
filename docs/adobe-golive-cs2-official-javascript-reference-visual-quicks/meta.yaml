  md: '# general control object functions


    These convenience functions are available for all control types. A control''s
    most important behaviors are provided by the event-handling functions that you
    register for the object. The GoLive SDK calls your registered handler when the
    user interacts with the control. To use an interactive control object, your extension
    must provide an event handler, as described in Chapter 6, “Events and Event Handlers.”


    | Method | Description |

    | :--- | :--- |

    | `add`<br>`controlObj.add(type, text [, index, creationProperties])` | Adds a
    new item to the items array of a list control (list, combobox, filelist, or hierarchy).
    Creates a control object of type item or node.<br>All other types of controls
    ignore this method. (Introduced in 8.0) |

    | `type` | The type of the new item. One of:<br>`item`: For any list control,
    a selectable item. Creates an item object.<br>`node`: For a hierarchy control,
    an item that can contain subitems. Creates a node object. |

    | `text` | The display label for the new item. |

    | `index` | Optional. The 0-based index position of this item in the parent control''s
    items list. If not specified, new items are appended to the list. |

    | `creationProperties` | Optional. For hierarchy controls, an object that can
    contain these properties:<br>`icon`: The name of an image defined in extension
    file, to display in the item or node to the left of the text label.<br>`expandIcon`:
    The image name for an icon to indicate that the node is in its expanded state.<br>`deleteable`:
    When true, the user can delete the item or node.<br>`editable`: When true, the
    user can modify the item or node. |

    | `addItem` | Deprecated in 8.0. Use the `add` method. |

    | `awaitDrag`<br>`controlObj.awaitDrag()` | Reports whether the user is dragging
    a custom control. Returns true if the user is dragging the custom control. See
    the example under dispatchEvent (page 83). (Introduced in 7.0) |'
  merge: -1
  pgno: 139
- img_proc: false
  md: "beginDraw controlObj.beginDraw()\nCreates and returns a temporary draw Object\
    \ (page 152) that you can call to refresh a custom control's appearance immediately\
    \ in response to a change in its state. Use this method when you need to draw\
    \ the appearance outside the context of the drawBox or drawControl (page 362)\
    \ handler.\n\nWhen these drawing operations are complete, call the endDraw (page\
    \ 84) method to terminate the temporary draw object. The temporary draw object\
    \ this method returns is not valid after the endDraw method is called. Do not\
    \ call the temporary draw object from outside the calls to the beginDraw and endDraw\
    \ methods that create it and terminate it.\n\nOnly one temporary draw object can\
    \ exist at any time. You cannot nest calls to the beginDraw method. Never call\
    \ the beginDraw method more than once before calling the endDraw method.\n\nchangeItem\
    \ controlObj.changeItem(index, newText)\nChanges the label text of an existing\
    \ entry item in the items array of a list control (list, combobox, filelist, or\
    \ hierarchy). All other types of controls ignore this method call. (Introduced\
    \ in 7.0)\n\nindex: The 0-based index of the item to change.\nnewText: The new\
    \ label text for the specified item.\n\ndispatchEvent controlObj.dispatchEvent(dragDropEventObj[,\
    \ pictureObj])\nStarts a drag action. Returns true if the dragged object is received\
    \ somewhere. Call this method after awaitDrag() returns true. (Introduced in 7.0)\n\
    \ndragDropEventObj: A dragDropEvent (page 380) object that contains all relevant\
    \ information for the drag action.\npictureObj: Optional. A picture Object (page\
    \ 237) to be used as the image displayed during dragging.\n\n```\n▶ Example\n\n\
    function mouseControl(control, x, y, state) {\n    switch (state) {\n        case\
    \ 0: {\n            if (control.awaitDrag() ) {\n                var dragInfo\
    \ = new JSXDragDropInfo;\n                dragInfo.flavor  = \"html\";\n     \
    \           dragInfo.content = \"<img src=\\\"\\\" width=\\\"100\\\"\n       \
    \         height=\\\"100\\\">\";\n                var image = createPicture(\"\
    dragImage.gif\");\n                var didDrop = control.dispatchEvent(dragInfo,\
    \ image);\n            }\n        }\n        break;\n    }\n}\n```"
  merge: -1
  pgno: 140
- img_proc: false
  md: '| **Method** | **Description** |

    | :--- | :--- |

    | `endDraw`<br>`controlObj.endDraw()` | Terminates the drawing operation the `beginDraw`
    (page 83) method began. This method invalidates the temporary draw Object (page
    152) that the `beginDraw` (page 83) method created. |

    | `find`<br>`controlObj.find (text)` | Finds and returns the `item` control object
    for the specified `item` if it is the `items` array of a list control (`list`,
    `combobox`, `filelist`, or `hierarchy`). All other control types ignore this method
    call. (Introduced in 8.0)<br><br>`text`: The value of the `text` property of the
    list item to find. |

    | `hide`<br>`hide()` | Hides the control by setting the `visible` property to
    `false`. (Introduced in 7.0) |

    | `refresh`<br>`controlObj.refresh()` | Redraws this control. Call this method
    to repaint an owner-draw custom control in response to user input. |

    | `remove`<br>`controlObj.remove (text)`<br>`controlObj.remove (index)`<br>`controlObj.remove
    (item)` | Removes a specified item from the `items` array of a list control (`list`,
    `combobox`, `filelist`, or `hierarchy`). All other control types ignore this method
    call. (Introduced in 8.0)<br><br>`text`: The value of the `text` property of the
    list item to remove.<br>`index`: The 0-based index of the list item to remove.<br>`item`:
    The `item` or `node` control object for the list item to remove. |

    | `removeAll`<br>`controlObj.removeAll()` | Removes all item entries from the
    `items` array of a list control (`list`, `combobox`, `filelist`, or `hierarchy`).
    All other control types ignore this method call. |

    | `removeItem` | Deprecated in 8.0. Use `remove()` instead. |

    | `show`<br>`show()` | Shows the control by setting the `visible` property to
    `true`. (Available in 7.0, 8.0) |'
  merge: -1
