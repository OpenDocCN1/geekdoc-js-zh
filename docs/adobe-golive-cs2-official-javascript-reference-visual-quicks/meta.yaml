  md: "It is possible to register an event handler at any time. You can, for convenience,\
    \ use your extension's initialization function to register your handlers:\n\n\
    ```\n// Register event handler\nfunction initializeModule() {\n\n    menubar['Hello'].items['doThisItem'].addEventListener(\n\
    \        'menuEvent',\n        doThisHandler)\n}\n```\n\nIt is not necessary to\
    \ unregister handlers on termination; the shutdown process does so automatically.\
    \ To unregister a handler before termination, use the target object's `removeEventListener`\
    \ function (page 373).\n\n# Nesting Event Handlers\n\nWhen an event is generated\
    \ for a child object in a hierarchy (such as a control in a tab panel in a window),\
    \ GoLive goes through an event capture phase before executing the handler registered\
    \ with the event trigger object, and then goes through a \"bubbling\" phase after\
    \ executing that handler.\n\nDuring the capture phase, GoLive looks for handlers\
    \ for the event that are registered with ancestor objects of the target. It starts\
    \ at the topmost level and runs the first handler it finds. It then runs any handler\
    \ that is registered with the target object itself. After executing the target's\
    \ handler, it bubbles back out through the ancestor objects, running the first\
    \ registered handler that it finds on the way out.\n\nFor example, suppose a dialog\
    \ window contains a panel that contains a button. A script registers an event\
    \ handler function for the `mouseEvent` at the `window` object, another handler\
    \ at the `panel` object, and a third handler at the `button` object (the actual\
    \ target). In this case, when the user clicks the button, the handler for the\
    \ topmost parent (the `window` object) is called first, during the capture phase,\
    \ then the target `button` object's local handler. Finally, during the bubbling\
    \ phase, GoLive calls the handler registered with the immediate parent, the `panel`\
    \ object.\n\nThis allows you to execute multiple handlers for the same event occurrence,\
    \ or to handle events at a higher level. For example, you could register a `mouseEvent`\
    \ handler with a parent `window` object, instead of or in addition to handlers\
    \ registered with the individual controls in the window."
