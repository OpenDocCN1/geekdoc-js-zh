  md: "# Defining and Registering Event Handlers\n\nYou must register a handler for\
    \ a specific event in each event target object that should respond to that event.\
    \ For example, if your extension defines two menu items, you could register a\
    \ handler to respond to the menuSignal (page 363) in each of the menuItem Objects\
    \ (page 225). Use the event target object's addEventListener function (page 373)\
    \ to register for a specific event in that object.\n\nAn event handler takes a\
    \ single argument, the event object. You can define an event handler as a separate\
    \ named function, or you can define it inline during registration. Inline code\
    \ can be a locally defined function that takes the event-object argument, or a\
    \ simple statement.\n\nFor example, supposing that your extension adds a menu\
    \ item with the name doThisItem to the Hello menu, you can register an event handler\
    \ for the item in any of the following ways:\n\n▶ To define the handler as a separate\
    \ function:\n\n```\n//define the handler function\nfunction doThisHandler (menuEvt)\
    \ {\n    Window.alert (\"You chose\" + menuEvt.name);\n}\n//register the handler\
    \ for a target\nfunction initializeModule() {\n    menubar['Hello'].items['doThisItem'].addEventListener(\n\
    \    'menuSignal',\n        doThisHandler)\n}\n```\n\n▶ To define the handler\
    \ inline during registration:\n\n```\n// register a locally-defined function\n\
    function initializeModule() {\n    menubar['Hello'].items['doThisItem'].addEventListener(\n\
    \    'menuSignal',\n        function (e) {'Window.alert (\"You chose\" + e.name);'})\n\
    }\n-or-\n// register inline source code\nfunction initializeModule() {\n    menubar['Hello'].items['doThisItem'].addEventListener(\n\
    \    'menuSignal',\n        'Window.alert (\"You chose the Do This menu item\"\
    )')\n}\n```"
