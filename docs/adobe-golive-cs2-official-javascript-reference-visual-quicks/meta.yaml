  md: "# Sending messages to other extension modules\n\nThe `broadcast` method sends\
    \ its argument to the `broadcastSignal` method of any or all running extension\
    \ modules.\n\n```\n`broadcast(argument [, targets]);`\n```\n\nThis method converts\
    \ the `argument` value to a string, stores the name of the calling module and\
    \ the `argument` string to a `broadcastEvent` object, and generates this event\
    \ in the target module or modules. The optional `targets` value is a list of modules\
    \ to call, in calling order. By default, the `broadcast` method generates the\
    \ event in every extension module.\n\nEach called module's registered `broadcastEvent`\
    \ handler must return a string value or `undefined`. Broadcasting terminates as\
    \ soon as any extension's handler returns a value. (The handler can also store\
    \ a response in the `answer` property of the event object.)\n\nThis method's result\
    \ is the return value supplied by the last handler. If none of the called modules\
    \ supply a return value, the `broadcast` method's return value is `undefined`.\n\
    \n# Responding to a broadcast\n\nTo receive and respond to messages from other\
    \ extensions, your extension must define a handler for the broadcast event (page\
    \ 360) and register it with the `app` object. A called module's handler determines\
    \ its actions according to the `message` and `sender` values in the passed `broadcastEvent`\
    \ object (page 378). The value the handler sets in the object's `answer` property\
    \ is returned as the `broadcast` method's return value. For example:\n\n```\n\
    function handleBroadcast(bcastEvt) {\n    switch (bcastEvt.message)\n    {\n \
    \       case thisValue:\n            bcastEvt.answer=5;\n        case thatValue:\n\
    \            bcastEvt.answer=\"Yes\";\n        case anotherValue: {\n        \
    \    var myResult = myFunction();\n            if (myResult)\n               \
    \ bcastEvt.answer=myResult.toString()\n            else\n                bcastEvt.answer=\"\
    undefined\";\n        }\n        default:\n            bcastEvt.answer=\"undefined\"\
    ;\n    }\n}\n```"
