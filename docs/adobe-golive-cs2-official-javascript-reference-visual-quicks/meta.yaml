  md: '# collection Object


    Class: `JSXCollection`


    A collection object acts like an array that provides access to its elements by
    name. Like an array, a collection associates a set of objects or values as a logical
    group and provides random access to them.


    Most collection objects are read-only. You do not assign objects to them yourself—the
    SDK updates their contents automatically as objects are created or deleted.


    Collection objects are not actually arrays.


    +   * An array places no restrictions on the type of data its elements store,
    while a collection object always holds the type of data indicated by its object
    name: a `BoxCollection` object holds box objects, a `ControlCollection` object
    holds control objects, and so on.

    * Array members can always be accessed by numeric index. Some, but not all collections
    allow this.


    # Acquiring collection objects


    You do not create collection objects yourself. The SDK creates collections when
    the GoLive application opens. This table describes the various collections the
    SDK provides, and shows how to access each of these objects in JavaScript.


    | Object | JavaScript Access | Contents |

    | :--- | :--- | :--- |

    | `BoxCollection` | `boxes` global variable (page 47) | All boxes in the active
    document. Read-only. |

    | `ControlCollection` | `window` Object children property (page 313) | Controls
    that have run at least once in this session. |

    | `CSSMediaList` | `CSSImportRule` Object (page 120) or `CSSMediaRule` Object
    `media` (page 122) property | Media values associated with an import or media
    rule, in a CSS style sheet associated with a document. |

    | `CSSRuleCollection` | `CSSStyleSheet` Object (page 129) `cssRules` (page 130)
    property | Rules in a CSS style sheets associated with a document, or collected
    into sets in a `CSSMediaRule` Object (page 122). Rules can be `CSSStyleRule` Objects
    (page 127) or any of the rule subtypes. |

    | `CSSStyleSheetCollection` | `document` Object `styleSheets` property (page 140)
    | The internal and external style sheets for a markup document, or the single
    style sheet for a style-sheet document. |'
