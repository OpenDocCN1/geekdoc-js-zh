  md: "# Creating an Extension Module\n\nEvery extension takes the form of a Main.html\
    \ file that resides in its own uniquely named folder in the Extend Scripts folder.\
    \ This section describes how to create the file and folder structure GoLive expects\
    \ extensions to have.\n\nTo begin creating an extension, first create the extension\
    \ folder. Create a folder with a unique name and place it in the Adobe GoLive\
    \ CS_Lang/Modules/Extend Scripts/ folder.\n\nIn this folder, create a new file\
    \ named Main.html. You can use any text or HTML editor to edit this file, including\
    \ Adobe GoLive CS2 SDK itself.\n\n# Creating the Main.html file\n\nThe Main.html\
    \ file contains the markup tags and JavaScript that define an extension.\n\n+\
    \   To create a Main.html file:\n1. In GoLive, create a new page, using File >\
    \ New Document. In the dialog, select Favorites and HTML Page, then click OK.\n\
    \nThis automatically creates and displays an HTML document with basic page elements\
    \ such as <head> and <body>.\n\n2. Switch to Source view and add a <jsxmodule>\
    \ tag in the <body> element before the <p> start tag:\n\nFor more information\
    \ on this tag, see \"Adding the module tag\" on page 22.\n\n3. Add a <script>\
    \ element after <jsxmodule>:\n\nTypically, the <script> element is placed inside\
    \ the <body> element, but you can put it inside the <head> element.\n\n```\n<body>\n\
    \    <jsxmodule name=\"My First Extension\">\n        <p>\n        </p>\n</body>\n\
    ```\n\n```\n<body>\n    <jsxmodule name=\"My First Extension\">\n        <script>\n\
    \        </script>\n        <p>\n        </p>\n</body>\n```"
