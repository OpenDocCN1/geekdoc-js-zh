    # Error logs


    All script errors are written to a log that is displayed in the Log window, which
    you can access through the **File >Log** command. Double click a script error
    entry in the log window to open the script file in the debugger and go to the
    error line. If an extension file contains a script tag that refers to an non-existing
    file, a warning is written to the log.


    When a run-time error occurs in an extension script, an alert window displays
    the error message before the error is written to the log. Run-time errors in other
    scripts, such as startup scripts, are written to the log without an alert message.'
