    # Sharing Data


    You can get GoLive user preferences programmatically, and also create your own
    extension preferences. You can set values that persist across user sessions, or
    that are available to other extension only during a single session. You can also
    communicate with other running extensions and share data with them.


    +   - Extension modules can use a prefs Object (page 240) to store persistent
    user preference data that is available to all extensions. The attribute Object
    (page 62) provides read-only access to a subset of GoLive''s global preferences.

    - The common Object (page 77) provides a place to share non-persistent data with
    other extensions.

    - The app Object''s broadcast method (page 56) allows one extension to send a
    message to another, and optionally receive a reply from that extension''s broadcast
    event handler (page 360).


    You cannot share or save objects, which are ephemeral. The `broadcast` method
    can only exchange strings with other extensions.


    # Persistent shared data


    Extensions can create their own preference data, which persists across between
    user sessions and is available to all extension modules. This feature enables
    all extensions to share a common set of preferences and to store persistent data.


    The prefs Object (page 240) in the prefs global variable (page 48) makes preference
    data available to all extensions. Preferences are stored as properties of this
    object. Create a new preference value simply by writing to a `prefs` property.
    For example, this creates a `myModule` preference that holds "Version 1.0" as
    its value:


    ```

    prefs.myModule = "Version 1.0";

    ```'
