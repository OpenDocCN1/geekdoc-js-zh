  md: '# # Handling Events


    GoLive 8 implements a WC3-compliant event-handling mechanism. THis mechanism defines
    *event* objects of various types, which encapsulate information about events,
    and *event targets*, GoLive objects in which events can occur. The following GoLive
    objects act as event targets:


    +   - app

    - module

    - document

    - box

    - menu

    - menuItem

    - window

    - control


    Each of these objects inherits the `addEventListener` function (page 373), which
    allows you to register a handler for a type of event that can occur in that object.
    When the event occurs in that object, your handler is passed a single argument,
    one of the Event Object Types (page 377), which encapsulates information about
    the event, such as where and when it occurred.


    For example, a `menuSignal` event can occur in a `menuItem` object, and you can
    register a handler for that event that responds to the selection of a menu item
    that your extension added. Your handler is passed a `menuEvent` object (page 382).


    +   - Your handlers for the `menuSignal` (page 363) and control events such as
    `onClick` (page 364) implement much of the UI functionality.

    - Register handlers with the document Object (page 138) for document events such
    as `selection` and `save` (page 366).

    - Register handlers with the app Object (page 53) for the `open` and `new` events
    (page 364), which occur when the user opens or creates a new document.

    - Terminating the GoLive application generates the `appterm` event (page 360)
    in the app Object (page 53). You can register a handler for this event to do any
    cleanup that your extension requires.

    - Other events allow more specialized responses, such as defining the appearance
    of a custom control when it needs to be redrawn.


    For a complete list of events and the circumstances that generate them, see Chapter
    6, "Events and Event Handlers."


    > **Note:** Event handling has changed significantly in this release. See "Compatibility
    with Previous Event Handlers" on page 395 in Part 2 of this book.'
