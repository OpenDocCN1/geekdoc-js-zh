    Congratulations! You have just created your first extension to GoLive. That is\
    \ really all there is to creating a basic extension using the GoLive CS2 SDK.\n\
    \n# Adding SDK Tags and JavaScript Functions to the Module\n\nThis section illustrates\
    \ some development techniques by walking you through a simple extension that writes\
    \ a message in the JavaScript Debugger window and displays a user alert. In this\
    \ exercise, you add tags and scripts to the body of a Main.html file such as the\
    \ one you created above.\n\n# Adding the module tag\n\nGoLive packages much of\
    \ its functionality in units known as modules. To add some particular new functionality\
    \ to GoLive, a user can install and enable the module that provides it. A GoLive\
    \ user can also disable or remove a module to remove its associated features and\
    \ behaviors.\n\nAn extension that you develop using the SDK is simply another\
    \ kind of module that GoLive can use. Like the built-in modules, extensions can\
    \ be enabled and disabled in the Preferences dialog.\n\nEach module must have\
    \ a unique name that represents it in the global JavaScript namespace. To define\
    \ the name of your extension's module, add to your extension's Main.html file\
    \ a <jsxmodule> tag (page 321) that provides a name property:\n\n```\n// Main.html\
    \ file for Hello example\n<html>\n    <body>\n        <jsxmodule name=\"HelloModule\"\
    \ debug>\n```"
