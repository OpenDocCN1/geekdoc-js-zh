  md: 'All other modules can check for the presence of this module:


    ```

    if (prefs.myModule == "Version 1.0")...

    ```


    When GoLive quits, it saves the `prefs` values along with all other preference
    data. The next time GoLive starts, it makes this data available to all modules
    again.


    **Note:** You cannot save JavaScript objects as `pref` values.


    # Non-persistent shared data


    The common Object (page 77) provides a means of sharing non-persistent string
    and primitive data among all currently running extensions. You cannot store objects
    in the `common` object.


    The `common` object provides no predefined properties. Your extension can call
    the `common` object''s `create` method to create a new namespace for shared properties
    in the `common` object; the namespace is then available to all extensions as a
    property of the `common` object.


    For example, the following creates a namespace to hold properties of a particular
    extension, then adds a property with an assigned value:


    ```

    common.create("myExt");

    common.myExt.myProperty = myValue;

    ```


    # Communicating with other extensions


    The broadcasting mechanism enables an extension to send a message to another extension
    requesting that it perform a task. Optionally, the called extension can return
    a result string.


    When one extension module needs to communicate with another extension module,
    it calls the app Object''s `broadcast` method (page 56). This method generates
    a `broadcastEvent` (page 378), containing the message argument. An extension that
    responds to messages from other extensions defines a handler for the `broadcastEvent`
    and registers it in the module Object (page 227).


    Your handler for the `broadcastEvent` checks the `message` property, performs
    any tasks necessary to respond to the broadcast message, and optionally returns
    a result string in the `answer` property of the event object.


    Use of the broadcast mechanism is entirely optional. If your extension does not
    need to communicate with other extensions, it need not implement a `broadcastEvent`
    handler.'
