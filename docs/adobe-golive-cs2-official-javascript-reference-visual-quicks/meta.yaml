  md: '# # common Object


    Class: *JSXCommon*


    The `common` object provides a means of sharing non-persistent string and primitive
    data among all currently running extensions. It is intended for sharing preference
    data and the like. You cannot store objects in the `common` object.


    The `common` object provides no predefined properties. An extension calls the
    `common` object''s `create` method to create a new namespace for shared properties
    in the `common` object; the namespace is then available to all extensions as a
    property of the `common` object.


    For example, the following creates a namespace to hold properties of a particular
    extension, then adds a property with an assigned value:


    ```

    common.create("myExt");

    common.myExt.myProperty = myValue;

    ```


    # ## Acquiring the common object


    The `common` global property makes this object available to all Extend Script
    extensions.


    `common`


    # ## common object functions


    | | |

    |---|---|

    | `create` | Creates a new shared property namespace in the global `common` object.
    Returns a reference to the data object for the namespace. |

    | `common.create (*namespace*)` | |

    | *namespace* | The name of a new shared property namespace. |

    | **Example** | |

    | The `create` method returns a reference to the namespace it creates, so you
    can access properties in the namespace directly: | |

    | `var myCommon = common.create("myExt");` | |

    | `myCommon.myProperty = myValue;` | |

    | Properties can hold only string or primitive values. You cannot assign any kind
    of object to a property of the `common` object. Because the property is itself
    an object, you cannot add properties directly to other properties. To create properties
    of properties, like `customer.first` and `customer.last`, for example, you must
    create the `customer` namespace, as follows: | |

    | `var myCommon = common.create("myExt");` | |

    | `myCommon.create("customer");` | |

    | `myCommon.customer.first = "John";` | |

    | `myCommon.customer.last = "Perry";` | |

    | `writeln(common.myExt.customer.first);` | |

    | `writeln(common.myExt.customer.last);` | |'
