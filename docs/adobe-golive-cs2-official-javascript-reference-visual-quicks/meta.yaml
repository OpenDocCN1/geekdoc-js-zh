  md: '# general control object properties


    The value of a control''s `type` property defines its appearance and behavior.
    Some control properties are type-specific; they are not valid for all controls
    but only for those of certain types.


    | Property | Type | Description |

    | --- | --- | --- |

    | `active` | Boolean | When `true`, the control has the current keyboard focus.
    Read/write. (Introduced in 7.0) |

    | `bounds` | Bounds | A bounds Object (page 63) for the size and location of this
    control within its parent window. |

    | `enabled` | Boolean | When `true`, the control accepts user input as appropriate
    to the type, and is displayed normally. When `false`, the control does not accept
    input and is displayed in a special mode. Read/write. |

    | `height`, `width` | — | Deprecated in 8.0. Use `bounds` and `size` instead.
    |

    | `helpTip` | String | A short descriptive string that appears as a tooltip for
    this control. Read/write. (Introduced in 8.0) |

    | `itemCount` | — | Deprecated in 8.0. Use `items` instead. |

    | `items` | Array of Item and Node | The item list of a list control (`list`,
    `combobox`, `filelist`, or `hierarchy`) as an array of item control objects. To
    add and remove items, use the control''s `add` (page 82) and `remove` (page 84)
    methods. To clear the list, use the `removeAll` (page 84) method. See Control:
    item Object (page 100) and Control: node Object (page 105). For other control
    types, this property is not present. (Introduced in 8.0) |

    | `location` | Point | A point Object (page 239) for the position of this control
    within its parent window. |

    | `multi` | Boolean | When `true`, allows selection of multiple entries in a list
    control, and `selection` contains an Array. For other control types, this property
    is not used. |

    | `name` | String | The control''s JavaScript name, as specified by the `name`
    attribute of the `<jsxcontrol>` element that defines this control. Read-only.
    |

    | `parent` | Window Panel Control | For an `item` or `node` control, the parent
    list control (`list`, `combobox`, `filelist`, or `hierarchy`). For other control
    types, the parent of the control, a window Object (page 313) or panel Object (page
    233). Read only. |

    | `placement`<br>`posx`, `posy` | — | Deprecated in 8.0. Use `bounds` and `location`
    instead. |'
