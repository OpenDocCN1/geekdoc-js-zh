  md: 'The following retrieves the **Sample** menu from the `menuCollection` object
    in the `menubar` global variable, and stores the retrieved menu object in the
    `sampleMenu` variable:


    ```

    var sampleMenu = menubar["sample"]

    ```


    In this case, "Sample" is the title of the menu, as displayed to the user, while
    "sample" is the name of the menu object, which you use to access it programmatically.


    The following retrieves the menu item by name from the collection in the `items`
    property the `sample` menu:


    ```

    menubar["sample"].items["item1"]

    ```


    Alternatively, you can retrieve the menu item directly, using its name as a property
    name of the `sample` menu:


    ```

    menubar["sample"].item1

    ```


    GoLive also makes each menu available as a JavaScript object in the global namespace.
    Thus, the following simple line of JavaScript retrieves the menu item from the
    `sample` menu.


    ```

    sample.item1

    ```


    Many collections can be accessed by numeric index as well as by name. For example,
    if `item1` is the first menu item:


    ```

    menubar["sample"].items[0] // 0-based index of first item

    ```


    This is only reliable for the items, not for menus; because other extensions can
    also add menus, you cannot rely on the order. Some collections, like the `controls`
    collection, do not support numeric access at all. Most of the time, an object''s
    unique `name` property provides the most reliable way to retrieve it.


    # Comparing objects


