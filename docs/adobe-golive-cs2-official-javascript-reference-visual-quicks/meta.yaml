    These are the same dialogs GoLive displays as part of its own user interface.
    Three methods of the app Object (page 53) make these dialogs available to extensions:


    +   - The `startProgress` method (page 61) initializes and displays the progress
    dialog.

    - The `setProgress` method (page 60) updates the status bar or busy bar display.

    - The `stopProgress` method (page 61) hides the progress dialog.


    As an alternative to these globally available predefined dialogs, you can define
    a progress-bar control in your own window.


    # Starting a progress or busy bar


    The `startProgress` method has this syntax:

    `app.startProgress(title [, message, doBusy, seconds])`


    +   - You must specify the string that appears in the progress window''s title
    bar, such as "Please wait" in the examples.

    - The optional `message` argument provides the initial status message displayed
    when the dialog opens.

    - The method opens a progress bar, unless you pass `true` for the optional `doBusy`
    argument.

    - The optional `seconds` argument is a number of seconds to delay before Golive
    displays the dialog. For example, a value of 2 means that Golive displays the
    dialog only for operations that take more than 2 seconds to complete.


    # Updating a progress or busy bar


    While the progress window is displayed, your code must update the position of
    the progress bar. It can optionally update the message text as well. Your code
    must also determine whether the user clicked the **Stop** button and act accordingly
    to abort the operation in progress. To perform these tasks, call the `setProgress`
    method periodically:

    `setProgress(value, [message])`'
