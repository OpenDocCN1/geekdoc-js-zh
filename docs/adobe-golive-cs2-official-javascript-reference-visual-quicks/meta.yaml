  md: '| selection | Array, Item, Node | Gets or sets the currently selected list
    item in a list control (list, combobox, filelist, or hierarchy). Each item is
    an item or node object.


    For a list box, file list, or hierarchy, if multi=true, an array of the item objects
    for all selected entries. You can set the value to a single item object, an array
    of item objects, or an array of items index values. When you set this value for
    a multi-selectable list, it turns on the specified selection without deselecting
    the other entries.


    Set to -1 to deselect all entries for list controls. Value is -1 for all other
    control types. |

    | size | Dimension | A dimension Object (page 137) for the size of the bounding
    box of this control. |

    | state | — | Deprecated in 8.0. Use value instead. |

    | text | String | The text displayed in the control such as the label string of
    a button. For controls with editable text, contains the current text. Read/write.
    (Introduced in 7.0) |

    | textselection | String | The currently selected text in controls that allow
    text selection. Read/write. (Introduced in 8.0) |'
  merge: -1
  pgno: 137
- img_proc: false
  md: '| type | String | The type of the control. One of: button: Pushbutton buttonedit:
    Edit field with onEnter property set to true. Optional Enter button, controlled
    by a user preference. colorfield: Color select field custom: Custom control checkbox:
    Checkbox combobox: Combo box (popup menu), contains item objects edittext: Edit
    field. Signals changes depending on property values for onEnter, onChange, and
    onNoChanged. editarea: Multiline edit field. Signals changes for each keystroke
    and loss of focus. filelist: A hierarchical view of files and folders, with a
    configurable popup list of local and remote filesystem locations. frame: Horizontal
    line, vertical line, or frame box hierarchy: A hierarchical view of item and node
    objects item: A selectable list item line: Pane separator line list: List box,
    contains item objects node: A list item that can contain subitems panel: A container
    with a frame that groups additional controls (see "panel Object" on page 233)
    password: Password-entry field, does not display user input preview: HTML browser
    window progressbar: Progress bar radiobutton: Radio button scrollbar: Scrollbar
    slider: Slider source: JavaScript editor with syntax checking splitpanel: A container
    with two subpanels (see "splitpanel Object" on page 271) statictext: Static text
    field tabpanel: A tab-grouping frame (see "tabpanel Object" on page 274) tree:
    Deprecated in 8.0. Use hierarchy or filelist instead. urlgetter: URL entry field.
    | value | Boolean | For check box and radio button controls, true if the control
    is selected (checked), false if it is not. For other control types, this property
    is not used. (Usage changed in 8.0. Used differently in earlier versions, generally
    replaced by text.) | values | — | Deprecated in 8.0. Use text, items, and textselection
    instead. | visible | Boolean | When true, the control is visible. When false,
    it is hidden. Read/write. (Introduced in 7.0) |'
  merge: -1
