  md: '# Preface


    This book is divided into two parts. Part 1 provides an abbreviated introduction
    to scripting Adobe® GoLive CS2. Part 2 is a complete reference of the objects
    and commands in the Adobe GoLive CS2 JavaScript type library.


    # Advisory of previous publication


    This book represents a subset of material included in the product CD for Adobe
    GoLive CS2. If you have the product CD, you already have access to a PDF version
    of this material.


    # About the Adobe GoLive CS2 SDK


    The Software Developer''s Kit (SDK) enables you to extend the behavior and user
    interface of Adobe GoLive CS2. Using the GoLive CS2 SDK, you can create tools
    tailored to your specific GoLive tasks. Using the SDK, you can create, customize,
    and extend most aspects of the GoLive user interface, such as:


    +   - Menus and menu items

    - Floating palettes and task-specific dialogs that include text, graphics, and
    controls

    - Custom HTML elements, such as `<mytag>`, that can be edited in an Inspector
    palette

    - Custom controls, that you can add as drag-and-drop items in the Objects palette

    - Custom columns in the Site window


    In addition, the SDK gives you programmatic options for working with Adobe GoLive
    CS2:


    +   - Programmatic file and web-site resource manipulation, both local and remote

    - Programmatic manipulation of the content of HTML and other markup documents

    - Document parsing options for encoding, translation, localization, and non-HTML
    tags


    The GoLive CS2 SDK defines a version of JavaScript called ExtendScript. It is
    very similar to the standard JavaScript, with some additional tags as'
  merge: -1
  pgno: 58
- img_proc: false
  md: 'described in this document. This documents generally refers simply to JavaScript
    and the SDK.


    When the user interacts with one of your extension''s user interface items, the
    SDK calls one or more JavaScript functions that you have created to provide the
    extension item''s behavior. However, you don''t need to be a JavaScript expert
    to use this SDK. If you''ve used HTML to create web page content, and perhaps
    added some interactivity to that page with JavaScript, you''re already familiar
    with the concepts behind these extensions.


    The SDK enables even inexperienced JavaScript users to create simple extensions
    easily with custom menus and dialogs—but it is also comprehensive and powerful.
    The SDK provides many JavaScript objects and methods to perform tasks on a document,
    on a site, in the GoLive environment, and on local and remote file systems. Nearly
    all of the user commands in GoLive are made available in JavaScript. Using JavaScript
    to automate repetitive tasks, you can, for example, edit all the documents on
    your site programmatically.


    Because the files that define extensions use HTML syntax, you can use GoLive itself—including
    your own custom extensions—to create additional extensions to the GoLive design
    environment. In the same way that you can create JavaScript scripts to generate
    and manipulate HTML files, you can write JavaScript scripts to generate and manipulate
    GoLive extensions. Using this technique you could, for example, use JavaScript
    scripts to customize menu items in GoLive according to the contents of a database.


    Optionally, extensions can call custom libraries written in the C and JavaScript
    programming languages. You can even use XML to define entirely new structured
    markup languages and documents to GoLive. In effect, GoLive''s extensibility is
    unlimited.


    # About This Book


    Part 1 of this book, the Programmer''s Guide, describes how to use the SDK to
    add functionality and custom user interface elements to version 8.0 of Adobe GoLive
    CS2.


    Part 2, the Programmer''s Reference, provides complete reference information for
    the markup tags, JavaScript objects, properties, and functions, and C-language
    data structures and functions provided by the GoLive CS2 SDK.


    This book does not document the JavaScript language nor how to use the GoLive
    CS2 application. For a listing of some helpful publications, see "Where to go
    for more information" on page 5.'
  merge: -1
  pgno: 59
- img_proc: false
  md: '# Who should read this book


    This book is for developers who want to extend the capabilities of Adobe GoLive
    using JavaScript and the special markup tags that the GoLive CS2 SDK provides.
    It assumes a general familiarity with the following:


    +   - Adobe GoLive

    - JavaScript

    - C and C++ programming


    # What is in this book


    Part 1 describes techniques for using the GoLive CS2 SDK to extend and customize
    the application. It contains the following chapters:


    +   - Chapter 1, "Installing and Configuring the GoLive SDK," describes how to
    install the GoLive CS2 SDK and enable the appropriate modules.

    - Chapter 2, "How to Create an Extension," describes what an extension is and
    what extensions can do. It provides a tutorial that creates a simple "Hello, World"
    extension.

    - Chapter 3, "The JavaScript Environment," describes how GoLive makes JavaScript
    objects available to extensions and discusses other application-level considerations
    such as variable scoping, data sharing and communication among extensions, and
    timing issues.


    The full Programmer''s Guide on the product CD explains how to create and add
    menus, toolbars, windows, controls, and custom elements, and describes many tasks
    that can be done programmatically.


    Part 2 provides detailed reference information about the markup tags and JavaScript
    objects that the GoLive CS2 SDK provides.


    Part 2 contains the following chapters:


    +   - Chapter 4, "Objects," describes the JavaScript objects, properties, and
    functions in the GoLive environment. This chapter does not describe objects that
    are standard parts of the JavaScript language or its Document Object Model.

    - Chapter 5, "Tags," describes markup tags that the GoLive CS2 SDK supplies. You
    use these tags to define dialogs, palettes, controls, and custom elements your
    extension adds to the GoLive environment.

    - Chapter 6, "Events and Event Handlers," describes optional callback functions
    your extension can implement to respond to events such as those generated by the
    user''s interaction with your extension''s controls.

    - Chapter 7, "Defining a Syntax Scheme," describes how to write a source-code
    syntax scheme that a source control can use to check the syntax of source code
    you are editing in that control.'
  merge: -1
  pgno: 60
- img_proc: false
  md: '+   - Appendix A, "Object Palette Sort Order," provides the numeric values
    GoLive uses to sort icons and menu items.

    - Appendix B, "Menu Names," lists the JavaScript names of existing menu items,
    which you can use to place new items in the menus.

    - Appendix C, "Managed Layout Tags," lists the markup tags that you can manipulate
    without reparsing a document in Layout view.

    - Appendix D, "C API for External Binary Libraries," describes data types and
    utility functions for creating external binary libraries that GoLive extensions
    can use.

    - Appendix E, "Scoping in JavaScript," discusses the scoping of name attributes
    defined by extensions.


    # Document conventions


    # Typographical conventions


    | Monospaced font | Literal values and code, such as JavaScript code, HTML code,
    filenames, and pathnames. |

    |---|---|

    | *Italics* | Variables or placeholders in code. For example, in `name="myName"`,
    the text `myName` represents a value you are expected to supply, such as `name="Fred"`.
    Also indicates the first occurrence of a new term. |

    | **Sans-serif bold font** | The names of GoLive UI elements (menus, menu items,
    and buttons). The `>` symbol is used as shorthand notation for navigating to menu
    items. For example, **Edit** > **Cut** refers to the **Cut** item in the **Edit**
    menu. |


    > **Note:** Notes highlight important points that deserve extra attention.


    # JavaScript conventions


    This book does not list properties and methods provided by the JavaScript language
    itself. For example, it is common for JavaScript objects to provide a `toString`
    method, and many of the objects the SDK supplies implement this method. However,
    this book does not describe such methods unless they differ from the standard
    JavaScript implementation.


    Similarly, because most objects provided by the SDK have a `name` property, the
    reference does not list `name` properties explicitly.


    When a JavaScript function returns a value, it is listed. When there is no return
    value listed, the function does not return a value.'
  merge: -1
