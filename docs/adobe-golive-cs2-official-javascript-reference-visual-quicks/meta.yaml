  md: '# attribute Object


    Class: JSXAttribute


    This object represents an element attribute. This object includes the Node Interface
    (page 229), whose properties and functions allow you to traverse the node tree.
    It defines additional properties, but no additional functions.


    (Introduced in 7.0)


    # Acquiring an attribute object


    Get this object from an element Object (page 156), using getAttributeNode (page
    157):


    ```

    var myAttrObj = elementObj.getAttributeNode("myAttrName");

    ```


    # attribute object properties


    In addition to those of the Node Interface (page 229), this object has the following
    properties:


    | name | String | The attribute name. For example, an `<img>` tag has an attribute
    `src`, for which the `attribute.name` value is `src`. |

    | --- | --- | --- |

    | specified | Boolean | When `true`, the value is specified by an HTML tag attribute.
    |

    | value | String | The value of the attribute, as a string. |'
