  md: '# # The JavaScript Environment


    This chapter discusses JavaScript and ECMAScript/ExtendScript concepts and usage
    in GoLive, including:


    +   - JavaScript Objects in the GoLive Environment

    - Scope of Variables and Functions

    - Handling Events

    - Sharing Data

    - Delays and Timeouts


    # ## JavaScript Objects in the GoLive Environment


    GoLive provides access to data and objects in a way that JavaScript programmers
    will find familiar. Those new to JavaScript will discover that the GoLive environment
    usually provides multiple ways to access data and objects. This section describes
    various ways an extension''s JavaScript code can access data and objects in the
    GoLive environment.


    # ### Objects, elements, and properties


    GoLive JavaScript objects can represent parts of a document, or GoLive components:


    +   - When GoLive loads a markup document, it generates objects to represent the
    markup tree of a document. Collectively, the objects that represent portions of
    the markup document are known as *markup objects*. Markup objects can represent
    HTML markup elements (as defined by a tag and its attributes), and also comments,
    text blocks, and other types of markup such as entities or `CDATA` sections.

    - When GoLive loads an extension definition file (that is, the `Main.html` file
    for your extension), it creates JavaScript objects to represent the GoLive components
    you define, such as windows, UI controls, and menu items. For example, a `<jsxdialog>`
    element in your extension definition results in a window Object (page 313).


    There are various ways to obtain a reference to a JavaScript object, depending
    on the object''s type.


    +   - You can retrieve most component objects by name from global properties,
    such as the `menus` and `dialogs` collections.

    - Objects that represent HTML page content are available from the markup tree;
    you get the root object from the document Object (page 138) for'
  merge: -1
  pgno: 84
- img_proc: false
  md: 'the page (`document.documentElement`), and that object''s properties and methods
    allow you to navigate the tree.


    +   - GoLive passes relevant objects as event-object property values to event-handling
    functions.


    For information on retrieving a particular object, see that object''s description
    in the GoLive CS2 SDK Programmer''s Reference.


    # Accessing attribute values


    The attributes of an element (whether it is a document markup element or an element
    in your extension definition) appear as the properties of the corresponding JavaScript
    object. For example, the `name` attribute of the element becomes the `name` property
    of the object. Access to JavaScript properties is case-sensitive; that is, the
    `Thing` attribute creates the `Thing` property, not the `thing` property. When
    writing JavaScript code, observe case accordingly.


    JavaScript uses the symbol `undefined` to indicate a null state. When a property
    exists, but no value has been explicitly set, that property has a value of `undefined`.
    If a property has never been defined, its state (rather than its value) is `undefined`.
    To test whether a property exists in JavaScript, you must test the state (not
    the value), by checking whether the name has a defined type; for example:


    ```

    // correct test

    if (typeof (myProperty) != undefined)

    // do something

    ```


    Do not use the following test. This tests the property''s value, rather than its
    state, and results in a run-time error if the property does not exist:


    ```

    // incorrect test

    if (myProperty != undefined)

    // if myProperty does not exist, an error occurs

    ```


    When you must test a property''s value with a case-sensitive comparison, you can
    use the `toLowerCase` method of the JavaScript `String` object. For example, this
    tests an `element` object''s `tagName` property, disregarding the value''s case:


    ```

    if (currElt.tagName.toLowerCase()) ==

    (tagToGet.toLowerCase())

    ```


    For element Objects (page 156), attributes are also represented by objects, which
    are themselves nodes in the markup tree. Use an `element` object''s `getAttributeNode`
    and `setAttributeNode` functions (page 157) to access the attribute object, rather
    than accessing the attribute directly by name, as a property of the `element`
    object. By using these methods, you avoid'
  merge: -1
  pgno: 85
- img_proc: false
  md: "potential problems with referencing names that contain special characters,\n\
    such as hyphens.\n\n# Naming objects and attributes\n\nThe value of an element's\
    \ name attribute must follow JavaScript naming\nconventions. If more than one\
    \ element or object uses the same name, the\nresults of name-based object retrieval\
    \ are unpredictable, so you must take\ncare to ensure that your names are unique.\
    \ One way to do this is to use a\nunique prefix or postfix in all of your extension's\
    \ names. For example, the\nfollowing element definitions begin the value of each\
    \ element's name\nattribute with the letters ADBE.\n\n```\n<jsxmenubar> // opens\
    \ definition of all menus\n    <jsxmenu name=\"Hello\" title=\"Hello, GoLive!\"\
    > // Hello menu\n        <jsxitem name=\"This\" title=\"Do Something\"> // menu\
    \ item\n        <jsxitem name=\"That\" title=\"Do Something Else\" > menu item\n\
    \    </jsxmenu> // closes definition of Hello menu\n</jsxmenubar> // closes definition\
    \ of all menus\n```\n\nWhen the SDK loads an extension containing these elements,\
    \ it creates a\nmenu object that appears in the JavaScript global menus collection.\
    \ You can\nuse the name to retrieve this menu from the collection:\n\n```\nvar\
    \ myMenu = menubar[\"ADBEHello\"];\n```\n\n# JavaScript object collections\n\n\
    The SDK makes commonly used objects available as the elements of\narray-like structures\
    \ that all extensions can access. GoLive updates the\ncontents of these structures\
    \ dynamically as these objects are created and\ndeleted.\n\nThe SDK implements\
    \ many of these structures as collection Objects\n(page 72). This is like an array\
    \ that provides access to its elements by name or\nindex; however, collections\
    \ are not actually arrays; not every collection\nprovides numeric access to its\
    \ elements, as an array object does.\n\nEach of these global properties contains\
    \ a collection object that GoLive\nupdates dynamically:\n\n| Object | JavaScript\
    \ Access | Contents |\n| :--- | :--- | :--- |\n| boxCollection | boxes global\
    \ property | Read-only array of all boxes in the current document. |\n| controlCollection\
    \ | controls global property<br>windowObj.controls property | Controls. |"
