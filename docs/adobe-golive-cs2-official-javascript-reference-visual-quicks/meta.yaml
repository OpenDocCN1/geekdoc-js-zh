  md: '# app Object


    Class: JSXApplication


    The app object represents the GoLive application. It enables programmatic access
    to data and functionality that the GoLive application provides. The properties
    provide access to information about the environment in which the extension is
    running. The methods can create documents, open existing documents, display progress
    bars, broadcast a message string to all running extensions, and quit the GoLive
    application.


    Note: When the GoLive application quits, it closes all open documents, prompting
    the user to save or discard each document''s changes as necessary, and creates
    disk files as necessary.


    # Acquiring the app object


    The app global variable makes this object available.

    app


    # app object properties


    Properties of the app object provide access to information about the environment
    in which the extension is running, such as:


    +   - Current HTML parser preferences

    - Information about the currently running GoLive application, such as its version
    and whether it is currently displaying a modal dialog

    - Paths to commonly used folders such as the current site''s folder, the system
    trash, the folder that holds the GoLive application, the default HTML browser
    application, and so on

    - Shared data and user preference data provided by extensions


    | Property | Type | Description |

    | :--- | :--- | :--- |

    | appSettingsFolder | File | The file Object (page 158) for the GoLive Settings
    folder, which holds GoLive application settings. Read-only. See also userSettingsFolder
    (page 56). |

    | asymmetricTokens | String | A string specifying all delimiters the GoLive scanner
    uses with the < character to recognize asymmetric tags. By default, the string
    is set to "!", which means that SGML-style tags, <!tag>, are recognized. This
    value reflects the setting inside the web database. The value of this property
    is not persistent unless the web database is saved manually. Read-only. |'
