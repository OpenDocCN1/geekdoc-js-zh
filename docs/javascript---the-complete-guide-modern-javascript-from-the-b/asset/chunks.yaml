- fmt: "\n# JavaScript Classes and Prototypes\n\n## Online Course Introduction\n\n\
    This online course to learn JavaScript is offered by Lynda and focuses on teaching\
    \ the fundamentals piece by piece. This is a beginner level course without any\
    \ prerequisites, and topics are explained in a concise manner.\n\n## Why JavaScript\
    \ Needs Classes?\n\nWhy do some people think that JavaScript needs classes? Classes\
    \ serve several purposes. If you do not understand those purposes, you do not\
    \ understand why people need classes.\n\n## Purposes of Classes\n\n### Encapsulation\n\
    \nOne of the purposes of classes is to encapsulate behavior. This means that a\
    \ class can implement many behaviors desired in your applications, and the actual\
    \ implementation of those behaviors are hidden inside the classes.\n\nIn practice,\
    \ if you have two objects of different classes that implement a behavior of showing\
    \ themselves, you can implement a function named `show()` for each of them.\n\n\
    The advantage of encapsulating the functions named `show()` inside the classes\
    \ is that different objects of different classes may have that same function and\
    \ there is no chance of name collision. The scope of each object class prevents\
    \ the `show()` function of one object from being confused with the `show()` function\
    \ of another object.\n\nThis is called encapsulation. The benefit of encapsulation\
    \ is that in the same JavaScript program you can combine objects of different\
    \ classes, each class may have functions with the same names, and there is no\
    \ collision of names.\n\n### Reuse\n\nAnother benefit of using classes is to promote\
    \ reuse. If you encapsulate behaviors in classes, you can easily reuse the objects\
    \ in different applications.\n\n### Specialization through Inheritance\n\nAnother\
    \ benefit of using classes is to implement specialization through inheritance.\
    \ If you have a class object with a certain behavior, through inheritance you\
    \ can create objects with specialized behavior by creating a sub-class that alters\
    \ part of the behavior to address your needs.\n\n## Classes in ECMAScript 5 and\
    \ 6\n\nKeep in mind that until ECMAScript 5, which is what most common JavaScript\
    \ implementations are using, classes are not really supported. Until ECMAScript\
    \ 6 is available, you need to emulate classes with object constructor functions.\
    \ In this article you may see one approach to implement classes in JavaScript\
    \ with public and private variables and functions.\n\n## Objects and Classes in\
    \ JavaScript\n\n### Difference between Objects and Classes in JavaScript\n\nJavaScript\
    \ does not really have classes. The reason for this distinction is because the\
    \ `class` keyword creates confusion for many who are more familiar with object-oriented\
    \ programming.\n\nIn OOP, a class is a type that sets the rules for how an object\
    \ instance is going to behave. In short, it's like a mold or a factory for creating\
    \ objects.\n\nIn JavaScript, a prototype is an actual thing. In most cases, it\
    \ is an instance of an actual object. Rather than being a blueprint for creating\
    \ a new object, we just copy the existing one and add on to it. An object instance\
    \ in JS can be the prototype for a different object instance. It can, itself,\
    \ be based on a different prototype, which can be based on another, etc., until\
    \ you get down to the `Object` prototype itself.\n\nThese objects are not bound\
    \ by the typical rules of classes. You can change, add, and delete properties\
    \ and methods from any object instance in JS, and you can use that modification\
    \ as a prototype for a new instance of objects.\n\nPrototype-based inheritance\
    \ does not work like object-oriented inheritance despite the similarities. Unless\
    \ you can keep your objects very simple and don't try to do anything fancy with\
    \ them, using inheritance will eventually cost you your hair and possibly some\
    \ of your sanity.\n\nLuckily, there are many more and much easier ways to do the\
    \ same kinds of things you'd want to do with inheritance without all the extra\
    \ baggage in JS. Once understood and applied, it will help quickly get new developers\
    \ who join the team from an OOP background to realize that JS isn't OOP.\n\nFocus\
    \ your learning on composition. This is just as easy as inheritance and way more\
    \ flexible. If you learn a few other concepts such as how closures work, dependency\
    \ injection, test-first development, and understanding variable scope in JS, you'll\
    \ find that JS can actually be a real pleasure to work with.\n\nIf you decide\
    \ to try out the inheritance model, you'll quickly find why so many people think\
    \ JavaScript is the worst language.\n\nI've learned to avoid these three keywords\
    \ in JavaScript as much as I possibly can: `class`, `this`, and `new`. If you\
    \ can learn to code in JS with a minimal use of these, you'll be much happier.\n\
    \n## Constructor Functions\n\n### What is a Constructor in JavaScript?\n\nA constructor\
    \ is used to create an Object, with some values or can be a default/empty constructor\
    \ in an OOP language. In JavaScript, a constructor is used when you are working\
    \ with prototype objects or object-oriented JavaScript. It can be viewed as a\
    \ normal function which initializes a value or sets the default values.\n\n####\
    \ Example\n\n```javascript\nfunction person(first, last, age, eye) {\n  this.firstName\
    \ = first;\n  this.lastName = last;\n  this.age = age;\n  this.eyeColor = eye;\n\
    }\nvar myFather = new person(\"John\", \"Doe\", 50, \"blue\");\nvar myMother =\
    \ new person(\"Sally\", \"Rally\", 48, \"green\");\n```\n\nIn the above example,\
    \ `person(first, last, age, eye)` is your constructor function. `new person(\"\
    John\", \"Doe\", 50, \"blue\")` calls the constructor function with the `new`\
    \ keyword, which creates an object of the constructor. `var myFather = new person(\"\
    John\", \"Doe\", 50, \"blue\")` creates an object `myFather` of the `person()`\
    \ constructor.\n\n### Constructor Functions in JavaScript\n\nThe code `var that\
    \ = this` is used when a helper function or a callback within a method is trying\
    \ to access the properties of the object. You can make these values available\
    \ from a closure unless the access depends on local variables within the callback.\
    \ In such cases, define your helper/callback as a named function or a named function\
    \ expression and bind it to the `this` in the method. In environments that support\
    \ arrow functions, prefer them over these approaches.\n\n### Arrow Functions\n\
    \nA constructor is a function which delegates from the object it creates to a\
    \ prototype that you specify on the constructor. It is also one of the very few\
    \ places where the word `this` has a concrete meaning in JavaScript, the other\
    \ being when you need to access a property on the object from a method.\n\n###\
    \ When to Use Constructor Functions\n\nFirstly, use constructor functions sparingly.\
    \ Before you create a constructor function, consider the following:\n\n- If an\
    \ object is meant to be used only once, just use an object literal.\n- If an object\
    \ needs to be used many times, create a factory function.\n- If an object needs\
    \ a functionality from another object, single time use, use a mixin.\n- If an\
    \ object needs to be extensible with a standard interface and/or a plugin ecosystem,\
    \ you can use a constructor function.\n\nSecondly, have a good understanding of\
    \ prototypical inheritance. An object has a prototype (which is another object)\
    \ from which it borrows methods that it does not have. The prototype might have\
    \ a prototype of its own to borrow behavior off of.\n\nGenerally, when inheriting,\
    \ to mimic the behaviour of class-based OOP, programmers often call the constructor\
    \ of the parent object's constructor, which also creates the data from the parent.\n\
    \nTo take a look at a real-world use case, see the code from the Mongoose ODM\
    \ which creates a constructor function for Model: [Automattic/mongoose](https://github.com/Automattic/mongoose).\n\
    \nAlso, it is highly unlikely that you will be creating constructor functions,\
    \ as a lot of libraries provide their own utilities for extending their libraries:\
    \ [Leaflet](https://leafletjs.com/) (a JavaScript library for interactive maps)\
    \ and [Backbone.js](https://backbonejs.org/) & Inheritance.\n\nFinally, classes\
    \ are in ES6, which will put an end to this practice of creating a utility function\
    \ for inheritance. To see a real example of classes in JavaScript from the Sequelize\
    \ ORM, take a look at: [sequelize/sequelize](https://github.com/sequelize/sequelize).\
    \ Classes in JavaScript desugar to constructor functions. If you need to write\
    \ a constructor function, consider writing a class instead.\n\nLastly, do not\
    \ go crazy on the inheritance chain. Extending more than a couple of levels deep\
    \ is not considered a good practice in JavaScript.\n\n## Simple Scripts vs Complex\
    \ Apps\n\n### Simple Scripts\n\nIn simple scripts, you will almost never need\
    \ constructor functions. Mostly, simple scripts are meant to manipulate the DOM.\
    \ You make a function and then call it.\n\n### Complex Apps\n\nLet's say that\
    \ you have to make the front-end for a library, and they need to be able to add\
    \ books, delete, rename, etc. Here, you can make a constructor function called\
    \ `Book` where you have all the public/private methods associated with the book,\
    \ let's say a public method `rename`.\n\nLater on in the app, you will have an\
    \ array of `Book` objects. When you would like to rename one of the books, you'll\
    \ simply get the book you need from the array and call `Book.rename(\"new name\"\
    )`.\n\n## Importance of Constructors\n\nA constructor helps in guaranteed initialization\
    \ of instance variables. Suppose if I am creating an object `CAR` and have given\
    \ some properties/characteristics to it, say, colour, type, mileage, etc.\n\n\
    Let's take the worse-case scenario: I have forgotten to initialize all these properties\
    \ for my CAR. Then there will be an error in my program. This is just a small\
    \ scenario and it can be easily rectified. But think about creating an application\
    \ for real-time; it will be more complex and there will be zillion lines of code.\
    \ A small mistake could break the application.\n\nSo to avoid this, whenever we\
    \ create an object in Java, it is a good approach to always initialize our object's\
    \ properties/behaviors using constructors. Take a look at the program below:\n\
    \n```java\npublic class Car {\n    String name, type, colour;\n    int mileage;\n\
    \    public Car(String name, String type, String colour, int mileage) {\n    \
    \    this.name = name;\n        this.type = type;\n        this.colour = colour;\n\
    \        this.mileage = mileage;\n    }\n}\n```\n\n## Prototypes\n\n### Introducing\
    \ Prototypes\n\n### Built-in Prototypes in JavaScript\n\n### Classes & Prototypes\n\
    \n### Constructor Functions & Prototypes\n\n### Methods in Classes & In Constructors\n\
    \n### Prototypes - Summary\n\n### Setting & Getting Prototypes\n\n### The Prototype\
    \ Chain and the Global Object\n\n### Working with Prototypes\n\n## DOM and Browser\
    \ API\n\n### Why DOM is Useful\n\nThe Document Object Model (DOM) is an application\
    \ programming interface (API) for HTML and XML documents. It defines the logical\
    \ structure of documents and the way a document is accessed and manipulated. In\
    \ the DOM specification, the term \"document\" is used in the broad sense. Increasingly,\
    \ XML is being used as a way of representing many different kinds of information\
    \ that may be stored in diverse systems, and much of this would traditionally\
    \ be seen as data rather than as documents. XML presents this data as documents,\
    \ and the DOM may be used to manage this data.\n\n### Data Preservation in Memory\n\
    \n### Tree Structure\n\nYou can go forwards and backwards in the tree structure.\
    \ You can make changes directly to the tree (in any document) in memory.\n\n###\
    \ DOM Document\n\nThe DOM Document is the owner of all other objects in your webpage.\
    \ This means if you want to access any object on your webpage, you always have\
    \ to start with the document. It also contains many important properties and methods\
    \ that enable us to access and modify our website.\n\n### Finding HTML Elements\n\
    \nNow that we understand what the DOM document is, we can start getting our first\
    \ HTML elements. There are many different ways to do so using the JavaScript DOM.\
    \ Here are the most common:\n\n#### Get Element by ID\n\nThe `getElementById()`\
    \ method is used to get a single element by its id. Let's look at an example:\n"
