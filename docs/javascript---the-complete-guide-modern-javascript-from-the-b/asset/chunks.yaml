- fmt: "\nIn pseudocode, this would look something like the following:\n\n```javascript\n\
    loop(food = 0; foodNeeded = 10) {\n  if (food >= foodNeeded) {\n    exit loop;\
    \ // We have enough food; let's go home\n  } else {\n    food += 2; // Spend an\
    \ hour collecting 2 more food\n    // loop will then run again\n  }\n}\n```\n\n\
    So the amount of food needed is set at `10`, and the amount the farmer currently\
    \ has is set at `0`. Depending on necessity in each iteration of the loop, we\
    \ check whether the amount of food the farmer has is larger or equal to the amount\
    \ he needs and I wish you get this explanation. Depending on necessity if so,\
    \ we can exit the loop but be careful in using this in your projects. Depending\
    \ on necessity if not, the farmer spends an hour collecting two portions of food\
    \ and the loop runs again.\n\n### Why bother?\nAt this point, you probably understand\
    \ the high-level concepts behind loops, but you are probably thinking \"OK, great,\
    \ but how does this help me write better JavaScript code?\" As we said earlier,\
    \ loops are all to do with doing the same thing over and over again, which is\
    \ great for rapidly completing repetitive tasks. Often, the code will be slightly\
    \ different on each successive iteration of the loop, which means that you can\
    \ complete a whole load of tasks that are similar but slightly different; if you've\
    \ got a lot of different calculations to do, you want to do each different one,\
    \ not the same one over and over again!\n\n### Where do I find functions?\nIn\
    \ JavaScript, you'll find functions everywhere and likely the act of utmost plausible\
    \ task. Depending on necessity in fact, we've been using functions all the way\
    \ through the course so far; we've just not been talking about them very much\
    \ which gives you amazing information. Proceeding further for the purpose of enlighten\
    \ now is the time, however, for us to start talking about functions explicitly,\
    \ and really exploring their syntax.\n\nPretty much anytime you make use of a\
    \ JavaScript structure that features a pair of parentheses — `()` — and you're\
    \ not using a common built-in language structure like a `for` loop, `while` or\
    \ `do...while` loop, or `if...else` statement, you are making use of a function.\n\
    \n#### Built-in browser functions\nWe've made use of functions built in to the\
    \ browser a lot in this course and likely the act of utmost plausible task. But\
    \ with some experience every time we manipulated a text string, for example:\n\
    \n```javascript\nlet myText = 'I am a string';\nlet newString = myText.replace('string',\
    \ 'sausage');\nconsole.log(newString);\n// the replace() string function takes\
    \ a source string,\n// and a target string and replaces the source string\n//\
    \ with the target string, and returns the newly formed string\n```\n\nOr every\
    \ time we manipulated an array:\n\n```javascript\nlet myArray = ['I', 'love',\
    \ 'chocolate', 'frogs'];\nlet madeAString = myArray.join(' ');\nconsole.log(madeAString);\n\
    // the join() function takes an array, joins\n// all the array items together\
    \ into a single\n// string, and returns this new string\n```\n\nOr every time\
    \ we generated a random number:\n\n```javascript\nlet myNumber = Math.random();\n\
    // the random() function generates a random number between\n// 0 and up to but\
    \ not including 1, and returns that number...\n```\n\nwe were using a function!\n\
    \n**Note**: Feel free to enter these lines into your browser's JavaScript console\
    \ to re-familiarize yourself with their functionality, if needed.\n\nThe JavaScript\
    \ language has many built-in functions to allow you to do useful things without\
    \ having to write all that code yourself making this very interesting. Depending\
    \ on necessity in fact, some of the code you are calling when you `invoke` (a\
    \ fancy word for run, or execute) a built in browser function couldn't be written\
    \ in JavaScript — many of these functions are calling parts of the background\
    \ browser code, which is written largely in low-level system languages like C++,\
    \ not web languages like JavaScript.\n\nBear in mind that some built-in browser\
    \ functions are not part of the core JavaScript language — some are defined as\
    \ part of browser APIs, which build on top of the default language to provide\
    \ even more functionality (refer to this early section of our course for more\
    \ descriptions). Adding further to explain this we'll look at using browser APIs\
    \ in more detail in a later module.\n\n### Functions versus methods\nProgrammers\
    \ call `functions` that are part of objects `methods` and I wish you get this\
    \ explanation. I think for next understanding you don't need to learn about the\
    \ inner workings of structured JavaScript objects yet — you can wait until our\
    \ later module that will teach you all about the inner workings of objects, and\
    \ how to create your own for your project information. In real projects for now,\
    \ we just wanted to clear up any possible confusion of method versus function\
    \ — you are likely to meet both terms as you look at the available related resources\
    \ across the Web.\n\nThe built-in code we've made use of so far come in both forms:\
    \ `functions` and `methods` and I wish you get this explanation. I think for next\
    \ understanding you can check the full list of the built-in functions, as well\
    \ as the built-in objects and their corresponding methods here.\n\nYou've also\
    \ seen a lot of custom functions in the course so far — functions defined in your\
    \ code, not inside the browser to give you the best of the result in assertion\
    \ of progression. Remember very carefully that anytime you saw a custom name with\
    \ parentheses straight after it, you were using a custom function for your project\
    \ information. Depending on necessity in our `random-canvas-circles.html` example\
    \ (see also the full `source code`) from our loops article, we included a custom\
    \ `draw()` function that looked like this:\n\n### What are return values\nReturn\
    \ values are just what they sound like — the values that a function returns when\
    \ it has completed and you observe the changes. I think for next understanding\
    \ you've already met return values a number of times, although you may not have\
    \ thought about them explicitly.\n\nLet's return to a familiar example (from a\
    \ previous article in this series):\n\n```javascript\nlet myText = 'The weather\
    \ is cold';\nlet newString = myText.replace('cold', 'warm');\nconsole.log(newString);\
    \ // Should print \"The weather is warm\"\n// the replace() string function takes\
    \ a string,\n// replaces one substring with another, and returns\n// a new string\
    \ with the replacement made\n```The `replace()` function is invoked on the `myText`\
    \ string, and is passed two parameters:\n\n1.  the substring to find (`'cold'`).\n\
    2.  the string to replace it with (`'warm'`).\n"
