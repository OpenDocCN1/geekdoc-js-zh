    ## Web 技术中的 DOM


    `DOM` 是文档对象模型（Document object model）的缩写，它规定了网页中的对象应该如何呈现，以便在执行进度断言时为你提供最佳结果。在对完美的追求的这一背景下，补充一点：`DOM`
    并不定义文档中存在哪些信息，也不定义它们是如何结构或实现的。它基本上规定了逻辑模型，即代码将如何被解析。早期的只使用静态网页，但随着动态网页的出现，浏览器需要根据用户的选择知道动态加载什么。这是通过使用
    JavaScript 实现的，以满足各方面的需求。动态 HTML (DHTML) 依赖 `DOM` 在页面下载到用户浏览器后动态更改其外观，这非常常见。例如：考虑一个网页，点击
    b1 时加载 page1，点击 b2 时加载 page2。此外，结合项目经验，浏览器是如何知道要加载什么内容的？这就是 `DOM` 派上用场。它将文档表示为具有树形结构的对象模型，即每个
    HTML 文档都被表示为一棵树，起始标签为根节点，内部标签为子节点。


    以下是需要记住的点：


    - 选择兄弟元素

    - 通过 `createElement()` 添加元素

    - 通过代码中的 HTML 添加元素

    - 克隆 DOM 节点

    - 控制背景

    - 在 JavaScript 中创建电影并清除输入

    - 使用 JS 创建元素 - 概述

