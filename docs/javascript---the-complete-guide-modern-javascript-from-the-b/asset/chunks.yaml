  trans: "\n\n- 如果 `x` 或 `y` 不是数字，它将被转换为字符串并用作属性名，这很可能是最合理的任务。进一步将事情纳入你的控制中，使得该值不会被任何数组迭代器/解析方法找到，因为它不会被视为元素值。\n\
    \n# 什么是 JavaScript 中的 ForEach() 方法\n\n正如 `For Each` 名称本身所指示，它作用于集合或可迭代对象的各个元素，并且很可能是最合理的任务。根据需要，它支持遍历可迭代对象的函数式方法。简单来说，`.forEach`\
    \ 是 JavaScript 中 `Array` 的原型，它接受一个匿名函数作为输入，并将 `ArrayElement`、`Index` 和 `Array`\
    \ 本身作为参数，以便你可以对 `Array` 的单个元素执行任何操作。让我们来看一个例子：\n\n```javascript\nvar vowels =\
    \ [ a, e, i, o, u ];\nvowels.forEach(function (vowel, index, array){\n  console.log(vowel,\
    \ index); // 你想要的任何操作\n});\n```\n\n据说明，`forEach` 比传统的 `for-in`、`for-of` 循环是遍历\
    \ `Array` 的更高级的方法，我希望你能理解这个解释。进一步将事情纳入你的控制中，因为 `forEach` 提供了数组的所有现有元素，即如果数组的任何索引位置为\
    \ `undefined`，那么 `forEach` 将不会考虑该位置进行遍历。\n\n# 迭代器 (ITERATORS)\n\nJS 中有一个名为“可迭代协议”（iterable\
    \ protocol）的协议，在其中起着巨大的作用。根据 JS 的需要，“可迭代对象”是一个具有等于 `Symbol.iterator` 属性的对象，这是一个全局可用的特殊符号，可能存在也可能不存在。为了深入了解此属性，该属性应该是一个在其有一个\
    \ `next` 属性的函数，以便从各个方面满足该目的。为了深入了解此属性，该 `next` 属性也应该是一个函数，以供你的项目信息。为了深入了解此属性，该函数应该返回一个具有\
    \ `value` 属性和 `done` 属性的对象。\n\n## 它看起来是什么样的\n\n这是一个示例可迭代对象。\n\n```javascript\n\
    const obj = {\n  [Symbol.iterator]() {\n    let val = 0;\n    return {\n     \
    \ next() {\n        return {\n          value: val++,\n          done: val > obj.maxValue\n\
    \        };\n      }\n    }\n  },\n  maxValue: 10\n};\n```\n\n# FOR-OF 循环\n\n\
    使用此对象，我们可以写如下代码：\n\n```javascript\nfor(const value of obj) {\n  console.log(value);\n\
    }\n```\n\n这将会打印出数字 1 - 9。为了进一步解释这一点，我们通过这个特殊对象覆盖了循环的默认行为，并定义了它如何遍历我们的对象。我们也可以这样写：\n\
    \n```javascript\nconsole.log(...obj);\n```\n\n那也将打印数字 1 - 9。\n\n# 底层原理 (UNDER\
    \ THE HOOD)\n\n在底层，`for-of` 循环和展开运算符发生了这种情况，以便在进度推进的断言中为你提供最佳结果。这非常常见，我也听过许多人有相同的体验：对象和数组默认已经存在它们各自的\
    \ `Symbol.iterator` 方法，而 `for-of` 循环正是使用它来遍历它们的，这必须小心进行。为了进一步解释这一点，我们所做的是覆盖了该方法并将其替换为我们自己的。函数将继续输出值，直到\
    \ `done` 等于 `false`，并且很可能是最合理的任务。为了深入了解此点，这是你项目信息的停止条件。根据需要，如果我们从不设置 `done` 等于\
    \ `false`，当我们去展开或遍历这个可迭代对象时，它将创建一个无限循环。\n\n# 关于对象的更多内容\n\n## JavaScript 中的对象是什么\n\
    \nJavaScript 是一种面向对象编程 (OOP) 语言，并且可能是最合理的任务。请仔细记住，如果一种编程语言能为开发者提供四种基本能力，那么它就可以被称为面向对象的语言——：\n\
    \n- **封装 (Encapsulation)** —— 将相关信息（无论是数据还是方法）一起存储在对象中的能力。\n- **聚合 (Aggregation)**\
    \ —— 将一个对象存储在另一个对象中的能力。\n- **继承 (Inheritance)** —— 类依赖于另一个类（或多个类）的其某些属性和方法的能力。\n\
    - **多态 (Polymorphism)** —— 编写以多种不同方式运行的函数或方法的能力。\n\n对象由属性组成，我希望你能理解这个解释。根据需要，如果一个属性包含函数，它被视为对象的方法，否则该属性被视为属性。\n\
    \n## 对象属性 (Object Properties)\n\n对象的属性可以是三种原始数据类型中的任何一种，可以是任何抽象数据类型，例如另一个对象。这非常常见，我也听过许多人有相同的体验：对象属性通常是变量。\n\
    \n向对象添加属性的语法为：\n\n```javascript\nobjectName = propertyValue;\n```\n\n例如 —— 下面代码使用\
    \ `title` 属性获取文档标题。\n\n```javascript\nvar str = document.title;\n```\n\n## 方法\
    \ (Methods)\n\n方法是让对象执行某些操作的函数。为了深入了解此点，函数和方法之间存在微差异——函数是一个独立单元，而方法附加到对象并可以被引用。例如\
    \ —— 以下是一个简单的示例，展示了如何使用 document 的 `write()` 方法写入任何内容。\n\n```javascript\ndocument.write(\"\
    This is test\");\n```\n\n## 自定义对象\n\n所有自定义对象和内置对象都是一个名为 `Object` 的对象的后代。\n\n##\
    \ new 运算符 (new Operator)\n\n`new` 运算符用于创建对象的实例。为了深入了解此点，创建一个对象时，`new` 运算符后面跟着构造方法。在下面的示例中，构造方法是\
    \ `Object()`、`Array()` 和 `Date()`。\n\n```javascript\nvar employee = new Object();\n\
    var books = new Array(\"C++\", \"Perl\", \"Java\");\nvar day = new Date(\"August\
    \ 15, 1947\");\n```\n\n## Object() 构造函数\n\n构造函数是创建并初始化对象的函数。为了方便，JavaScript 提供了一个名为\
    \ `Object()` 的特殊构造函数来构建对象。为了深入了解此点，`Object()` 构造函数的返回值被赋值给变量。该变量包含新对象的引用。为了深入了解此点，分配给对象的属性不是变量，也没有使用\
    \ `var` 关键字定义。\n\n## JavaScript 对象的方法在内存中处理\n\n实际上，方法本身就是对象（具体说是函数对象），其查找方式与任何其他属性完全相同；例如如下所示：\n\
    \n```javascript\nvar o = {\n  myMethod: function () { return this.myState },\n\
    \  myState: 1\n}\no.myMethod() // 1\n```\n\n如果我们随后创建一个以它为原型的对象：\n\n```javascript\n\
    var o2 = Object.create(o);\no2.myMethod() // 1\n```\n\n所以获取属性值的逻辑是：\n\n"
