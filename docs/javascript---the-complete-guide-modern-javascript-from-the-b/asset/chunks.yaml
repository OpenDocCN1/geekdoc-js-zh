    \nfor (x in mycars)\n{\ndocument.write(mycars[x] + \"<br />\")\n}\n</script>\n\
    </body>\n</html>\n```\n\n"
- fmt: '

    # Control Structures


    ## What is a control structure


    A control structure is the nervous system of a control system, representing the
    sequencing of message/data flow from one controller to another. It determines
    the progression of actions.


    Control structures can be hierarchical (event-based), where child controllers
    propagate messages/data to parent controllers, which then take actions based on
    the received data. Alternatively, they can be peer-to-peer, allowing any controller
    to interact or actuate any other controller without restriction. These patterns
    are common in modern IoT systems.


    There are also hybrid control structures that combine the above two types. Based
    on the criticality of the scenario, control structures can be designed to strictly
    adhere to a certain type of event or data, maximizing capabilities.


    Control structures are a major aspect of designing control systems, and the reliability
    of the system depends largely on the control structure.


    ## Why are control structures necessary in programming languages


    Control structures are not necessary if the language has a sufficiently flexible
    evaluation strategy. However, most languages include them for one or more of the
    following reasons:


    - Familiarity and tradition

    - Better clarity by expressing patterns that match their structure

    - Improved performance

    - Easy handling of important abstractions (e.g., concurrency)


    ### Procedural languages


    Procedural languages (e.g., C, ANSI Pascal) require control structures to give
    shape to programs and allow multiple execution paths. Without control structures,
    there would be no loops or optional code paths.


    ### Object-oriented languages


    Object-oriented languages do not inherently need control structures; the object
    graph can model desired control flow. However, most OO languages include control
    structures because they are often hybrids and for performance reasons.


    ### Lisp and macros


    Lisp has no built-in control structures—only nested lists and an evaluation strategy.
    However, Lisp macros allow you to define any control structure. For example, `cond`
    is a macro for branching control.


    ### Functional languages and non-strict evaluation


    Languages with non-strict evaluation (e.g., Haskell) can shape control flow using
    functions and expressions, so control structures are not required. However, they
    often include a few (e.g., `if/else` for boolean branching and `case` for pattern
    matching).


    ### Concurrency in Go


    Some languages (e.g., Go) have built-in control structures for concurrency, making
    it central to program design. Other languages rely on libraries for concurrency
    models.


    ## Logical Operators


    Logical operators determine the logic between variables or values.


    ## Conditional (Ternary) Operator


    JavaScript contains a conditional operator that assigns a value to a variable
    based on a condition.


    ## Comparing Different Types


    Comparing data of different types may give unexpected results. When comparing
    a string with a number, JavaScript converts the string to a number. An empty string
    converts to 0, and a non-numeric string converts to NaN, which is always false.


    ## Precedence and Associativity


    Operator precedence and associativity determine the order of evaluation in expressions.


    ### Operator precedence


    In the expression `a OP1 b OP2 c`, if `OP1` and `OP2` have different precedence
    levels, the operator with higher precedence is evaluated first. For example, multiplication
    has higher precedence than addition:


    ```javascript

    console.log(3 + 10 * 2);   // logs 23

    console.log(3 + (10 * 2)); // logs 23 because parentheses are superfluous

    console.log((3 + 10) * 2); // logs 26 because parentheses change the order

    ```


    ### Associativity


    Left-associativity (left-to-right) means the expression is processed as `(a OP1
    b) OP2 c`. Right-associativity (right-to-left) means it is interpreted as `a OP1
    (b OP2 c)`. Assignment operators are right-associative, so:


    ```javascript

    a = b = 5; // same as a = (b = 5)

    ```


    Both `a` and `b` get the value 5 because the assignment operator returns the assigned
    value.


    ## Note on grouping and short-circuiting


    Grouping has the highest precedence, but expressions inside grouping symbols may
    not be evaluated first due to short-circuiting.


    Short-circuiting is conditional evaluation. For example, in the expression `a
    && (b + c)`, if `a` is falsy, the sub-expression `(b + c)` is not evaluated, even
    if it is in parentheses.


    Other short-circuited operators include logical disjunction ("OR"), logical conjunction
    ("AND"), nullish-coalescing, optional chaining, and the conditional operator.


    ## The for statement


    JavaScript has two methods for running the same code several times. The `for`
    statement is mainly used for iterating over arrays or objects.

