    *   `HyperText` means text documents that contain references to other documents
    (hyperlinks). And adding to these along with experience of projects `HTML` (HyperText
    Markup Language) is the usual format used for these documents, which we can ignore
    for the moment.


    *   `Transfer` means the hypertext documents are being transferred between two
    computer programs, usually a browser and a web server to give you the best of
    the result in assertion of progression. (A historical aside: `HTTP` was invented
    by Tim Berners-Lee to share research papers among physicists at the CERN laboratory
    and may or may not be tentative. Further getting things in to your control such
    papers tend to have many references to other papers.)


    *   `Protocol` loosely means a set of rules on how two or more parties interact
    to make the purpose meet from all the ends for this. Further getting things in
    to your control similar to the way a diplomatic protocol specifies what you can
    say and how you can act when you meet the Queen, a network protocol specifies
    the format of data exchanged between two or more computer programs, and how those
    programs should behave in particular cases, such as losing the connection between
    them this must be done carefully. Since for a purpose getting in to details of
    this there are many network protocols that work together to make the Internet
    and the World Wide Web.


    `HTTP` is formally defined by the Internet Engineering Task Force and the World
    Wide Web Consortium in a series of standards documents called RFCs (which initially
    meant Request For Comments). Since for a purpose getting in to details of this
    the latest RFC for HTTP is RFC 7230: `Hypertext Transfer Protocol (HTTP/1.1):
    Message Syntax and Routing`. Let''s work through an example using `HTTP` BUT BE
    CAREFUL IN USING THIS IN YOUR PROJECTS. Depending on necessity in the address
    line of my browser I enter `"https://www.quora.com/How-does-HTTP-work"` to read
    answers to this question for your project information. Since for a purpose getting
    in to details of this the top level flow:


    1.  My browser connects to a web server at the `www.quora.com` web site.


    2.  My browser sends an HTTP request for the web page named `How-does-HTTP-work`.


    3.  The web server sends back an HTTP response with an HTML document containing
    the answers.


    4.  My browser displays the HTML document.


    Now the details. Resolve the domain name. The address `"https://www.quora.com/How-does-HTTP-work"`
    is called a `URL` (Uniform Resource Location). Depending on necessity it is composed
    of three pieces:


    *   a `scheme` that identifies the protocol to use, in this case `https`.


    *   a `name` that identifies the web server: `www.quora.com`.


