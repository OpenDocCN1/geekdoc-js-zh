  trans: "\n\n# JavaScript 类与原型\n\n## 在线课程介绍\n\n这门由 Lynda 提供的 JavaScript 在线学习课程侧重于逐个讲解基础知识。这是一门入门级课程，不需要任何先决条件，并且主题都以简洁的方式进行了解释。\n\
    \n## 为什么 JavaScript 需要类？\n\n为什么有些人认为 JavaScript 需要类呢？类有几个用途。如果你不理解这些用途，你就不理解为什么人们需要类。\n\
    \n## 类的用途\n\n### 封装\n\n类的目的之一是封装行为。这意味着一个类可以实现应用程序所需的许多行为，而这些行为的实际实现被隐藏在类内部。\n\
    \n在实践中，如果你有两个不同类的对象，它们都实现了显示此身份的行为，你可以为它们中的每一个实现一个名为 `show()` 的函数。\n\n将名为 `show()`\
    \ 的函数封装在类内部的优势是，不同类的不同对象可能具有相同的函数，且不会发生命名冲突。每个对象类的作用域防止了一个对象的 `show()` 函数与另一个对象的\
    \ `show()` 函数发生混淆。\n\n这被称为封装。封装的好处是，在同一个 JavaScript 程序中，你可以组合不同类的对象，每个类可以有同名的函数，但不会发生命名冲突。\n\
    \n### 重用\n\n使用类的另一个好处是促进重用。如果你将行为封装在类中，就可以在不同的应用程序中轻松重用这些对象。\n\n### 通过继承实现特化\n\
    \n使用类的另一个好处是通过继承实现特化。如果你有一个具有特定行为的类对象，通过继承，你可以创建一个修改部分行为以满足需求的子类，从而创建特殊行为的对象。\n\
    \n## ECMAScript 5 和 6 中的类\n\n请记住，在 ECMAScript 5（大多数常用 JavaScript 实现所使用的版本）之前，并没有真正支持类。在\
    \ ECMAScript 6 出现之前，你需要用对象构造函数来模拟类。在本文中，你可能会看到一种使用私有变量和函数在 JavaScript 中实现类的方法。\n\
    \n## JavaScript 中的对象与类\n\n### JavaScript 中对象与类的区别\n\nJavaScript 并没有真正的类。产生这种区别的原因是\
    \ `class` 关键字给许多熟悉面向对象编程（OOP）的人造成了困扰。\n\n在 OOP 中，类是一种类型，规定了对象实例如何行为的规则。简单来说，它就像是创建对象的模具或工厂。\n\
    \n在 JavaScript 中，原型是一个真实的实体。在大多数情况下，它是某个真实对象的实例。我们并不是作为创建新对象的蓝图，而是复制现有的并在其基础上添加。JS\
    \ 中的对象实例可以作为另一个对象实例的原型。它本身可以基于另一个原型，而该原型又基于另一个，以此此类推，直到达到 `Object` 原型本身。\n\n这些对象不受典型类规则的限制。你可以从\
    \ JS 中的任何对象实例更改、添加和删除属性和方法，并可以将该修改作为新对象实例的原型。\n\n尽管相似之处，但基于原型的继承工作方式与面向对象的继承不同。除非你能保持对象非常简单并且不尝试对它们做任何花哨，否则使用继承最终会让你掉头发，甚至可能让你失去理智。\n\
    \n幸运的是，在 JS 中有更多更简单的方法来实现你想通过继承完成的各种工作，而不需要所有这些额外负担。一旦理解并应用，它将帮助加入团队的具有 OOP 背景的新开发者快速意识到\
    \ JS 并不是 OOP。\n\n将学习重点放在组合上。这和继承一样简单，但要灵活得多。如果你学习了其他几个概念，例如闭包如何工作、依赖注入、测试驱动开发以及理解\
    \ JS 中的变量作用域，你会发现 JS 编写起来实际上是一件乐事。\n\n如果你决定尝试继承模型，你很快就会发现为什么这么多人认为 JavaScript\
    \ 是最糟糕的语言。\n\n我已经学会了尽可能地在 JavaScript 中避免这三个关键字：`class`、`this` 和 `new`。如果你能学习在极少使用这些的情况下编写\
    \ JS 代码，你会快乐得多。\n\n## 构造函数\n\n### 什么是 JavaScript 构造函数？\n\n构造函数用于创建对象，并带有某些值，或者作为\
    \ OOP 语言中的默认/空构造函数。在 JavaScript 中，当你处理原型对象或面向对象的 JavaScript 时，就会使用构造函数。它可以被视为一个初始化值或设置默认值的普通函数。\n\
    \n#### 示例\n\n```javascript\nfunction person(first, last, age, eye) {\n  this.firstName\
    \ = first;\n  this.lastName = last;\n  this.age = age;\n  this.eyeColor = eye;\n\
    }\nvar myFather = new person(\"John\", \"Doe\", 50, \"blue\");\nvar myMother =\
    \ new person(\"Sally\", \"Rally\", 48, \"green\");\n```\n\n在上面的示例中，`person(first,\
    \ last, age, eye)` 是你的构造函数。`new person(\"John\", \"Doe\", 50, \"blue\")` 使用 `new`\
    \ 关键字调用构造函数，从而创建一个该构造函数的对象。`var myFather = new person(\"John\", \"Doe\", 50, \"\
    blue\")` 创建了 `person()` 构造函数的对象 `myFather`。\n\n### JavaScript 中的构造函数\n\n代码 `var\
    \ that = this` 用于方法内部的辅助函数或回调尝试访问对象的属性的场景。你可以通过闭包使这些值可用，除非访问依赖于回调内部的局部变量。在这种情况下，将辅助/回调定义为命名函数或函数表达式，并绑定到\
    \ `this`。在支持箭头函数的环境中，优先使用箭头函数而不是这些方法。\n\n### 箭头函数\n\n构造函数是一个将它创建的对象委托给构造函数指定的函数。在\
    \ JavaScript 中，`this` 词具有具体含义的少数地方之一是当我们需要从方法访问属性时。\n\n### 何时使用构造函数\n\n首先，节节使用构造函数。在创建构造函数之前，考虑以下情况：\n\
    \n- 如果对象只使用一次，直接使用对象字面量。\n- 如果对象需要多次使用，创建一个工厂函数。\n- 如果对象需要另一个对象的功能，使用混入（mixin）。\n\
    - 如果对象需要具有标准接口的插件生态系统的扩展性，可以使用构造函数。\n\n其次，良好理解原型继承。对象有一个原型（即另一个对象），它从中借用自己没有的方法。通常在继承时，为了模拟基于类的\
    \ OOP，程序员经常调用父类对象的构造函数，从父类继承数据。\n\n要查看真实世界的用例，请查看 [Automattic/mongoose](https://github.com/Automattic/mongoose)。此外，你不太可能创建构造函数，因为许多库提供了它们自己的扩展工具：[Leaflet](https://leafletjs.com/)（一个用于交互地图的\
    \ JavaScript 库）和 [Backbone.js](https://backbonejs.org/) & 继承。\n\n最后，ES6 中的类将结束这种为了继承创建工具函数的做法。要查看\
    \ JavaScript 中类的真实示例，请查看 [sequelize/sequelize](https://github.com/sequelize/sequelize)。JavaScript\
    \ 中的类解糖为构造函数。如果你需要编写构造函数，考虑改写类。最后，不要在原型链上过度。深度超过几层的扩展在 JavaScript 中不认为是一种良好的做法。\n\
    \n## 简单脚本 vs 复杂应用程序\n\n### 简单脚本\n\n在简单脚本中，你几乎不需要构造函数。简单脚本主要操作 DOM。你编写一个函数然后调用它。\n\
    \n### 复杂应用程序\n\n假设你需要为库制作前端，并且它们需要添加、删除、重命名等。在这里，你可以创建一个名为 `Book` 的构造函数，其中拥有与书籍相关的公共/私有方法，假设有一个公共方法\
    \ `rename`。在应用程序的后期，你将有一个 `Book` 对象数组。当你想要重命名其中一个书籍时，只需从数组中获取所需的书籍并调用 `Book.rename(\"\
    new name\")`。\n\n## 构造函数的重要性\n\n构造函数有助于实例变量的初始化。假设我正在创建一个对象 `CAR` 并赋予一些属性/特征，例如颜色、类型、里程。考虑糟糕的情况：我忘记为我的\
    \ CAR 初始化这些属性。那么我的程序就会出错。这只是一个小场景，可以很容易修复。但考虑创建一个实时应用程序；它会变得复杂，会有无数行代码。一个小错误就会破坏应用程序。\n\
    \n为了避免这种情况，我们在 Java 中创建对象时，始终使用构造函数来初始化对象的属性/行为是一个良好的方法。看看下面的程序：\n\n```java\n\
    public class Car {\n    String name, type, colour;\n    int mileage;\n    public\
    \ Car(String name, String type, String colour, int mileage) {\n        this.name\
    \ = name;\n        this.type = type;\n        this.colour = colour;\n        this.mileage\
    \ = mileage;\n    }\n}\n```\n\n## 原型\n\n### 原型简介\n\n### JavaScript 中的内置原型\n\n\
    ### 类与原型\n\n### 构造函数与原型\n\n### 类和构造函数中的方法\n\n### 原型 - 总结\n\n### 设置与获取原型\n\n###\
    \ 原型链与全局对象\n\n### 使用原型\n\n## DOM 和浏览器 API\n\n### 为什么 DOM 有用\n\n文档对象模型（DOM）是用于\
    \ HTML 和 XML 文档的应用程序编程接口（API）。它定义了文档的逻辑结构以及访问和操作文档的方式。在 DOM 规范中，“文档”一词具有广义。。XML\
    \ 越来越多地被用作表示存储在不同系统中的各种信息，其中许多内容传统上被视为数据而非文档。XML 将这些数据呈现为文档，DOM 可以被用于管理这些数据。\n\
    \n### 内存中的数据保留\n\n### 树形结构\n\n你可以在树形结构中向前或向后移动。你可以直接对内存中的树（任何文档）更改。\n\n### DOM\
    \ 文档\n\nDOM 文档是你网页中所有其他对象的拥有者。这意味着如果你想访问网页上的任何对象，始终必须从文档开始。它还包含许多重要的属性和方法，使我们能够访问和修改网站。\n\
    \n### 查找 HTML 元素\n\n现在我们理解了 DOM 文档是什么，可以开始获取我们的第一个 HTML 元素了。使用 JavaScript DOM\
    \ 有许多不同的方法。以下是最常见的：\n\n#### 通过 ID 获取元素\n\n`getElementById()` 方法用于通过 id 获取单个元素。让我们看一个示例：\n\
    \n"
