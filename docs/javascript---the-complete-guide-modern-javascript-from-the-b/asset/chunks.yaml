    ## DOM in web technologies


    `DOM` which is short for Document object model is the specification for how objects
    in a web page should appear to give you the best of the result in assertion of
    progression. And in a bit of rage for perfection in this pretext pS: `DOM` does
    not define what information in a document exists and how it is structured or implemented.
    It basically specifies the logical model, how the code will be parsed. Earlier
    only static web pages were in use, however as the use of dynamic web pages came
    in to existence, browser needs to know what to load dynamically according to user''s
    choice. This was achieved using javascript to make the purpose meet from all the
    ends for this. That’s pretty common that dynamic HTML (DHTML) relies on the `DOM`
    to dynamically change the appearance of Web pages after they have been downloaded
    to a user''s browser. Eg: consider a web page which loads page1 on clicking b1
    and page2 on clicking b2. And adding to these along with experience of projects
    how does the browser know what to load? This is where `DOM` comes in. It represents
    the document as an object model having a tree like structure i.e., each HTML document
    is represented as a tree with the opening tag as the root and inner tags as its
    children.


    These are the things to remember:


