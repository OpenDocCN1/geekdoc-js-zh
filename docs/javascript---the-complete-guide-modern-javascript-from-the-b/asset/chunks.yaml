  trans: "\n\n# `for...in` 语句\n\n## 概述\n根据需要，`for...in` 语句用于循环（迭代）遍历数组的元素或 `object`\
    \ 的属性。`variable` 参数可以是一个命名变量、一个数组元素或一个 `object` 的属性。\n\n## 语法\n```javascript\n\
    for (variable in object) {\n    // 要执行的代码\n}\n```\n\n## 示例\n使用 `for...in` 遍历数组：\n\
    \n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar x\nvar mycars\
