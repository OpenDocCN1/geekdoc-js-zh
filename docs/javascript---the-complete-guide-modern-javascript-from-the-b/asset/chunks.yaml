- fmt: "\n# JavaScript Loops and Functions\n\n## The `for` Loop\n\n### Basic `for`\
    \ Loop\n\n```javascript\nvar i;\nfor (i = 0; i < 3; i = i + 1) {\n    console.log(i);\n\
    }\n```\n\nOutput: `0`, `1`, `2`.\n\nThe `for` statement has three parts:\n\n1.\
    \ **Initialization**: Initializes the iterator variable `i`. In this example,\
    \ `i` is set to `0`.\n2. **Condition**: The loop continues as long as the condition\
    \ is true. In this example, we check that `i` is less than `3`.\n3. **Increment**:\
    \ The iterator is incremented on each iteration. In this example, we increment\
    \ `i` by `1`.\n\n### Shorter Notation\n\nWe can also write a shorter notation\
    \ using the `++` operator:\n\n```javascript\nfor (var i = 0; i < 3; i++) {\n \
    \   console.log(i);\n}\n```\n\n### Iterating Over an Array\n\nTo iterate over\
    \ an array:\n\n```javascript\nvar myArray = [\"A\", \"B\", \"C\"];\nfor (var i\
    \ = 0; i < myArray.length; i++) {\n    console.log(\"The member of myArray in\
    \ index \" + i + \" is \" + myArray[i]);\n}\n```\n\nOutput:\n\n```\nThe member\
    \ of myArray in index 0 is A\nThe member of myArray in index 1 is B\nThe member\
    \ of myArray in index 2 is C\n```\n\nWe used the `length` property of an array\
    \ to determine when to stop.\n\n## The `while` Loop\n\nThe `while` statement is\
    \ a simpler version of the `for` statement. It checks if an expression evaluates\
    \ to `true` and runs as long as it is `true`.\n\nExample:\n\n```javascript\nvar\
    \ i = 99;\nwhile (i > 0) {\n    console.log(i + \" bottles of beer on the wall\"\
    );\n    i -= 1;\n}\n```\n\n## Error Handling\n\n- Error Handling with `try-catch`\
    \ - An Introduction\n- Throwing Custom Errors\n- Working with `try-catch` to Catch\
    \ & Handle Errors\n\n## Functions\n\n### Function Declarations\n\nA function definition\
    \ (also called a function declaration) consists of:\n\n- The `function` keyword.\n\
    - The name of the function.\n- A list of parameters enclosed in parentheses and\
    \ separated by commas.\n- The JavaScript statements enclosed in curly brackets\
    \ `{...}`.\n\nExample:\n\n```javascript\nfunction square(number) {\n    return\
    \ number * number;\n}\n```\n\nThe function `square` takes one parameter, `number`,\
    \ and returns the number multiplied by itself.\n\nPrimitive parameters (such as\
    \ a number) are passed to functions by value. If the function changes the value\
    \ of the parameter, the change is not reflected globally or in the calling function.\n\
    \n### Function Expressions\n\nA function can also be created using a function\
    \ expression. Such a function can be anonymous (without a name).\n\nExample:\n\
    \n```javascript\nconst square = function(number) {\n    return number * number;\n\
    };\nvar x = square(4); // x gets the value 16\n```\n\nA name can be provided with\
    \ a function expression, allowing the function to refer to itself and making it\
    \ easier to identify in debugger stack traces.\n\n### Calling Functions\n\nDefining\
    \ a function does not execute it. Calling the function performs the specified\
    \ actions with the indicated parameters.\n\nExample:\n\n```javascript\nsquare(5);\n\
    ```\n\nThis calls `square` with an argument of `5`. The function executes its\
    \ statements and returns `25`.\n\n### Function Scope\n\nVariables defined inside\
    \ a function cannot be accessed from outside the function. A function can access\
    \ all variables and functions defined in the scope in which it is defined.\n\n\
    A function defined in the global scope can access all variables defined in the\
    \ global scope. A function defined inside another function can also access all\
    \ variables defined in its parent function and any other variables to which the\
    \ parent function has access.\n\n### Recursion\n\nA function can refer to and\
    \ call itself. There are three ways:\n\n1. The function's name\n2. `arguments.callee`\n\
    3. An in-scope variable that refers to the function\n\n### Nested Functions and\
    \ Closures\n\nYou may nest a function within another function. The nested (inner)\
    \ function is private to its containing (outer) function.\n\nIt also forms a closure.\
    \ A closure is an expression (most commonly, a function) that can have free variables\
    \ together with an environment that binds those variables.\n\nSince a nested function\
    \ is a closure, it can inherit the arguments and variables of its containing function.\
    \ The inner function contains the scope of the outer function.\n\n## DOM in JavaScript\n\
    \n### What is the DOM\n\nAt the most basic level, a website consists of an HTML\
    \ and CSS document. The browser creates a representation of the document known\
    \ as the Document Object Model (DOM). This document enables JavaScript to access\
    \ and manipulate the elements and styles of a website.\n\nThe model is built in\
    \ a tree structure of objects and defines:\n\n- HTML elements as objects\n- Properties\
    \ and events of the HTML elements\n- Methods to access the HTML elements\n"
