    \ * param1;  \n9.  }  \n10.  }  \n```\n\n等等于：\n\n```\n1.  function Polygon(height,\
    \ width) { \n2.  this.height = height;  \n3.  this.width = width;  \n4.  }  \n\
    6.  Polygon.prototype.someMethod = function(param1) { \n7.  return this.height\
    \ * param1;  \n8.  }  \n```\n"
