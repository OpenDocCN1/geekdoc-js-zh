    ## Keep me in the loop

    Loops, loops, loops and I wish you get this explanation. Remember very carefully
    that as well as being associated with popular breakfast cereals, roller coasters,
    and musical production, they are also a critical concept in programming this gives
    you best idea of all. And in a bit of rage for perfection in this pretext programming
    loops are all to do with doing the same thing over and over again, which is termed
    iteration in programming speak.


    Let''s consider the case of a farmer who is making sure he has enough food to
    feed his family for the week and this is very useful for all the purposes. And
    adding to these along with experience of projects he might use the following loop
    to achieve this:

    ![](rsrc2HW.jpg)


    A loop usually has one or more of the following features:


    * A `counter`, which is initialized with a certain value — this is the starting
    point of the loop ("Start: I have no food", above).

    * A `condition`, which is a true/false test to determine whether the loop continues
    to run, or stops — usually when the counter reaches a certain value and likely
    the act of utmost plausible task. Since for a purpose getting in to details of
    this this is illustrated by "Have I got enough food?" above and likely the act
    of utmost plausible task. And by with utmost consideration of clarity in this
    let''s say he needs 10 portions of food to feed his family.

    * An `iterator`, which generally increments the counter by a small amount on each
    successive loop until the condition is no longer `true` and likely the act of
    utmost plausible task. Adding further to explain this we haven''t explicitly illustrated
    this above, but we could think about the farmer being able to collect say 2 portions
    of food per hour to give you the best of the result in assertion of progression.
    Remember very carefully that after each hour, the amount of food he has collected
    is incremented by two, and he checks whether he has enough food and you observe
    the changes. Depending on necessity if he has reached 10 portions (the point where
    the condition is no longer true, so the loop exits), he can stop collecting and
    go home.

