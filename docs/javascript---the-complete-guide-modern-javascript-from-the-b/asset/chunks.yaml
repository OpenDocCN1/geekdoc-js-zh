    ## 数组与迭代器


    JavaScript 中的 `Array.from()` 是干什么用的？在 JavaScript 中 `Array.from` 的主要用途是将可迭代对象（一种不是
    Array 但具有可以进行循环或迭代的枚举项的值）转换为更熟悉的 `Array` 类型，并且这很可能是最合理的任务操作。为了详细介绍这一点，使用 `Array`
    相比“类数组对象”的优势在于数组上的函数迭代方法：[1] `map`、`filter`、`reduce`、`every`、`some` 等。JavaScript
    DOM 产生了许多不是 Array 的可迭代对象示例，例如 `NodeList`（`getElementsByClassName` 和 `querySelectorAll`
    的返回值）[2] 等，我希望你理解这个解释。我真的发现使用 `Array.from` 非常有趣，我们可以将这些“类数组”值转换为原生 `Array` 类型，并在结果上应用
    `map`、`filter`、`reduce` 等方法。我们还可以在 ES6 中[3] 自定义自己的可迭代对象，`Array.from` 可以将其转换为数组，例如一个根据输入或内部状态程序化生成唯一项的容器对象，这可能也是非常合理的任务。为了进一步解释这一点，我们可以使用
    `for...of` 来迭代该对象[4]，考虑每个项目并将其推入一个单独的数组，这可能是暂时的也可能不是。这非常常见，而且我听很多人都有同样的经历，或者我们可以使用
    `Array.from` 将序列转换为数组，并立即链式 `filter`、`map` 和 `reduce` 以产生派生值。让我说，可迭代对象的示例仅仅是你可以迭代的东西（……它在
    js 中有某些精确含义，基本上它让你能够写 `for(let c of iterable)`，这是它的主要成名）。在实际项目中，例如 `Set` 对象是可迭代的。`arrayLike`
    的是指像数组但不是数组的东西，这可能让你感到难过，因为你想做 `.map` 或 `.filter` 之类的操作，这给了你最好的思路。请仔细记住，`arrayLike`
    的非常常见，尽管现在由于 react 等工具你可能不会遇到它们，但如果你执行类似 `document.getElementsByClassName` 的操作，返回的不是数组而只是
    `arrayLike`。


    ## JavaScript 可迭代器与迭代器


    非常有用，尽管许多相关的库和框架仍需追赶以充分利用它们。迭代器与（例如）数组之间最大的区别之一是，它们不一定定是有限的，且它们不需要同步产生值，并且可能是暂时的也可能不是。这非常常见，而且我听很多人都有同样的经历，这最自然的应用之一是流处理（值得查看
    Highland.js 作为示例）。迭代器还是生成器函数（Generator Functions）的构建块之一，生成器反过来允许像 `suspend` 和
    `co` 这样的库支持连续异步操作的“更扁平”语法，我希望你理解这个解释。根据需要，我实际上写了一篇博客，涵盖了迭代器如何与生成器函数相关：生成器有什么大不了的？当你加入一些迭代器也拥有的头等公民语法糖时，例如
    `for...of`，你最终会得到许多日常编程任务的优雅解决方案。尽管如此，此时你质疑它们的价值是可以被原谅的，因为它们相对新，没有许多库和框架对它们提供原生支持，这必须谨慎进行。由于为了详细介绍这一点，像
    `babel` 这样的工具正在加速新语言特征的采纳率，所以现在是掌握它们的好时机。


    ## JavaScript 中的数组数组（Array of arrays）与对象


    记住 JavaScript 是无类型的，并且你观察这些的变化。请仔细记住， JavaScript 的变量或属性可以更改类型（除非该属性被设置为只读或密封）。ECMAScript
    6 引入了类型数组（Typed Arrays）的支持，但它们与核心 JavaScript 数组非常不同（它们使用缓冲区/视图），并且限于数字类型（符号/无符号，整数/浮点，8/16/32/64
    位）：


    - `Int8Array`, `Uint8Array`, `Uint8ClampedArray`,

    - `Int16Array`, `Uint16Array`,

    - `Int32Array`, `Uint32Array`,

    - `Float32Array`, `Float64Array`


    点 2：JavaScript 数组是 `Array` 构造函数的实例。此类对象：


    - 在获取/设置其 `length` 属性上有专用行为

    - 继承自 `Array.prototype` 的专用数组方法

    - 将数字兼容键（属性名）视为索引，并将关联的值视为元素

    - 是可迭代对象（自 ES6）


    除此之外，它们是普通的 JS 对象，所以：


    - 添加/删除元素就像添加/删除属性，元素的索引可以非常分散，JS 数组通常被称为稀疏数组，它们的解析方法（`forEach`/`map`/`reduce`/`find`/`some`……）只迭代已定义的元素

    - 元素的值类型是混合的


    所以：


    - 数组数组是元素都是数组对象的数组

    - 对象数组是元素都是对象的数组，但不知道它们是从哪个构造函数创建的，因此其中一些可能是 `Array` 对象，其他可能是 `RegExp` 对象、`Promise`
    对象或任何自定义的


    构建数组数组是构建二维数组的一种方法，正如你也可以构建 n 维数组。在 JS 中访问二维数组元素，你可以这样做：


    ```

    myArray[x][y] = 42;

    ```


    但要注意：


    - 如果 `myArray[x]` 没有经过良好初始化，`myArray[x][y]` 可能会报错（例如 undefined）

    - 注意，由于 JS 是无类型的，这取决于你的代码如何设置正确类型的值


