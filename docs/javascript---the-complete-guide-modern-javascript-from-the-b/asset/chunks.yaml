    *   `HyperText`（超文本）意味着包含其他文档引用（超链接）的文本文档。结合项目经验，`HTML`（超文本标记语言）是这些文档的常用格式，我们暂时可以忽略它。


    *   `Transfer`（传输）意味着超文本正在两个计算机程序之间传输，通常是浏览器和 Web 服务器，以给你提供结果结果。（顺带一提：`HTTP` 是蒂姆·伯纳斯-李（Tim
    Berners-Lee）在 CERN 实验室为了在物理学家之间共享论文而发明的，它可能指向许多其他引用。）


    *   `Protocol`（协议）大致意味着一组规则，规定了两个或多个双方如何交互以实现目的。为了了解细节，协议规定了你能够说什么以及如何操作，规定了两个或多个程序之间交换的数据格式，以及这些程序在特定情况下如何表现，例如它们之间的连接必须仔细完成。为了了解细节，有许多协议共同构建了互联网和万维网。`HTTP`
    是由互联网工程任务组（IETF）和万维网联盟（W3C）正式定义的系列被称为 `RFC`（请求意见）的文档。为了了解细节，最新的 HTTP 是 RFC 7230：`Hypertext
    Transfer Protocol (HTTP/1.1)`：消息语法。为了了解细节，让我们通过一个例子来查看 `HTTP` 的工作原理：你在浏览器地址栏输入
    `"https://www.quora.com/How-does-HTTP-work"` 来读取答案。为了了解细节，顶级流程如下：


    1. 我的浏览器连接到 `www.quora.com` Web 服务器。

    2. 我的浏览器发送一个名为 `How-does-HTTP-work` 的 HTTP 请求。

    3. Web 服务器返回一个包含 HTML 文档的 HTTP 响应。

    4. 我的浏览器显示 HTML 文档。


    现在解析域名。地址 `"https://www.quora.com/How-does-HTTP-work"` 被称为 `URL`（统一资源定位）。根据需要，它由三部分组成：


    *   `scheme`（方案），标识使用的协议，在本例中为 `https`。

    *   `name`（名称），标识 Web 服务器`www.quora.com`。

    *   `path`（路径），指定文档：`/How-does-HTTP-work`。


    我使用 `www.quora.com` 来标识网站，但互联网使用 IP 地址来标识 Web 服务器（以及其他）。为了了解细节，Quora 网站的 IP 地址是
    `151.101.41.2`（至少目前如此；它们会经常变化）。根据需要，我肯定不会记住！当我使用 `www.quora.com` 时，我的浏览器使用域名系统（`DNS`），它可以被看作一本电话簿（如果你还记得的话），将名称映射为
    IP 地址。希望你理解这个解释。为了进一步，我们可以忽略 `DNS` 的细节。但请记住，你可以使用一个名为 `ping` 的程序来查看域名的 IP 地址，这是一个非常可能的任务。在追求完美的环境下，`ping`
    也用于检查你是否实际上能连接到该地址的程序，它能给你一个连接速度的概念：


    ```

    1.  ping http://www.quora.com

    2.  PING http://quora.map.fastly.net (151.101.41.2): 56 data bytes

    3.  64 bytes from 151.101.41.2: icmp_seq=0 ttl=56 time=6.084 ms

    4.  64 bytes from 151.101.41.2: icmp_seq=1 ttl=56 time=5.056 ms

    5.  64 bytes from 151.101.41.2: icmp_seq=2 ttl=56 time=9.173 ms

    ```


    这表示 `www.quora.com` 被映射到 `151.101.41.2`，从我的计算机到 `151.101.41.2` 发送一个 64 字节数据包并获得响应需要
    6 到 9 毫秒，这对所有目的都非常有用。根据需要，它还告诉你还有另一个域名 `quora.map.fastly.net` 也映射到同一个地址，希望你理解这个解释。这是
    Quora 内容托管的线索。


    连接到 Web 服务器。一旦浏览器获取了服务器的 IP 地址，它就可以使用 `TCP`（传输控制协议）连接到 Web 服务器。为了了解细节，`TCP` 是互联网的基础之一，以确保所有端都能目的。根据需要，它确保发送到连接的数据以正确的顺序且无丢失地到达连接的另一端，希望你理解这个解释。为了进一步解释，我们也可以忽略该协议的细节。但注意我使用的是
    `"https"` 而不是 `"http"`。


