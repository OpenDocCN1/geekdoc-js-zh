    学习使用纯 JavaScript 操作 DOM 并非必须，但我推荐这样做，原因如下：


    - jQuery 是一个库，并非项目规范的一部分。jQuery 不会随浏览器自带，你必须将 jQuery 发送给客户端才能使用。请牢记：为了偶尔使用 jQuery
    而向网站添加 80+ KB 的代码可能效率低下。

    - 在现代框架（如 Vue.js 或 React）中，jQuery 并不常用。如果你正朝着 Web 开发者的道路前进，你很可能会使用框架，而这些框架及其组件/库通常会避免使用
    jQuery。

    - jQuery 已不如从前重要。不过，jQuery 解决了前端开发者曾经（以及现在）面临的一个重要问题。然而，浏览器兼容性并不一致。如果你想使用 `classList`，可能需要查看兼容性表，以确保它在
    IE8 中可用。如今，浏览器的兼容性已经更加一致。


    ## DOM 与原型


    - 处理滚动

    - 动态加载脚本

    - 定位工具提示

    - 设置定时器与间隔

    - `location` 和 `history` 对象

    - `navigator` 对象

    - 使用 `<template>` 标签

    - 处理日期

    - 处理事件


    ## JavaScript 中的事件


    JavaScript 与 HTML 的交互是通过事件来处理的，这些事件发生在用户或浏览器操作页面时。当页面加载时，会触发一个事件；当用户点击按钮时，该点击也是一个事件。其他示例包括按下任意键、关闭窗口、调整窗口大小等。开发者可以利用这些事件执行
    JavaScript 代码响应，从而关闭窗口、向用户显示消息、验证数据以及实现几乎任何其他类型的响应。


    事件是文档对象模型（DOM）Level 3 的一部分，每个 HTML 元素都包含一组可以触发 JavaScript 代码的事件。


    ## 事件处理


    事件处理是控制事件并决定事件发生时应该做什么的机制。该机制包含的代码称为事件处理器，当事件发生时会被执行。Java 使用委托事件模型来处理事件。该模型定义了生成和处理事件的标准机制。下面简要介绍该模型。


    ### 委托事件模型的关键参与者


    - **源（Source）**：源是事件发生的对象。源负责向处理器提供所发生事件的信息。Java 为源对象提供了类。

