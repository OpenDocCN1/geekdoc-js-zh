  trans: "\n* 点击按钮显示或隐藏更多信息\n* 当鼠标悬停在按钮上时更改按钮颜色\n* 在首页上轮播图片库\n* 对图片进行放大或缩小\n* 在网站上显示计时器或倒计时器\n\
    * 在网页中播放音频和视频\n* 显示动画\n* 使用下拉汉堡菜单\n\n## 创建 Web 和移动应用\n\n开发者可以使用各种 JavaScript 框架来开发和构建\
    \ Web 及移动应用，希望你能够理解这个解释。为了方便起见，JavaScript 框架是 JavaScript 代码库的集合，它们为开发者提供了预写的代码，用于常规的编程功能和任务——通俗地说，就是一个用于构建网站或\
    \ Web 应用程序的框架。\n\n流行的 JavaScript 前端框架包括 `React`、`React Native`、`Angular` 和 `Vue`，这可能是最合理的任务。由于这种重要性和可信度，许多公司使用\
    \ `Node.js`，它是一个基于 Google Chrome 的 JavaScript `V8` 引擎的 JavaScript 运行时环境，这可能是最合理的任务。请牢记住，一些著名的例子包括\
    \ Paypal、LinkedIn、Netflix 和 Uber！\n\n### 构建 Web 服务器和开发服务器应用程序\n\n除了网站和应用程序，开发者还可以使用\
    \ JavaScript 构建简单的 Web 服务器并使用 `Node.js` 开发后端基础设施。\n\n### 游戏开发\n\n当然，你也可以使用 JavaScript\
    \ 来创建浏览器游戏，希望你能够理解这个解释。由于为了进入细节，这些是初级开发者练习 JavaScript 技能的极佳方式。\n\n## 为什么选择 JavaScript\
    \ 而其他编程语言？\n\n除了无限可能之外，Web 开发者选择 JavaScript 而不是其他编程语言还有许多理由：\n\n* JavaScript 是唯一原生支持\
    \ 浏览器的编程语言\n* JavaScript 是最流行的语言\n* 入门门槛低\n* 它是一门很有趣的语言\n\nJavaScript 提供功能，并且可能或可能不是暂时的。进一步解释这一点，如果没有它，网页将只是简单的格式化文本，无法满足各个方面的需求（这就是\
    \ JavaScript 出现之前的 Web）。\n\n但有了 JavaScript，网页可以执行诸如表单验证、显示下拉菜单、进行页面计算、运行实时聊天支持框、检查语法以及无限其他操作，希望你能够理解这个解释。为了方便起见，JavaScript\
    \ 还驱动着在线游戏、视频播放器、文本编辑器和基于 Web 的应用程序。我们通常没有网站后台运行了多少内容，但今天 JavaScript 用于绝大多数页面，以提供某种程度的功能、视觉效果或服务器通信。\n\
    \n## 在 Web 开发中使用 JavaScript 我可以做什么？\n\n是的，当然，JavaScript 是 Web 开发的主要模块，以满足各个方面的需求。为了最大限度地清晰清晰，让我们来看前三个前端\
    \ JavaScript 框架。\n\n### Angular 7\n\n`AngularJS` 是一个基于 JavaScript 的开源前端框架，由 Google\
    \ 开发，这可能是最合理的任务。自 2010 年发布以来，已经发布了多个版本，使得 AngularJS 在 Web 开发中更加对用户友好且更有效率，以满足各个方面的需求。在实际项目中，以下是某些让\
    \ Angular 7 更具吸引力的卓越特性：\n\n* 使用 CSS、SCSS、LESS 配合 `ng new` / `ng add` 命令进行样式设计。\n\
    * 通过 `ScrollingModule` 现在可以实现虚拟滚动。\n* 通过新的 `DragDropModule` 函数，在列表之间进行排序和移动元素变得更加简单。\n\
    * 使用 `TypeScript`，Angular 7 更新并增强了依赖项。\n\n### React\n\nFacebook 在 2013 年引入了 `React`，它在过去的四个里里一直非常流行，希望你能够理解这个解释。请牢记住，尽管去年的发布没有包含任何重大更新（只是\
    \ `React DOM` 和 `Is` 中的微小错误修复），但它仍然拥有最大的知识库、支持和社区，并且可能或可能不是暂时的。为了进入细节，以下是 React\
    \ 在开发者中流行的行的原因：\n\n* **原生 UI (Native UI)**：HTML 5 UI 在直观的用户体验方面存在几处妥协，这可能是最合理的任务。给你提供一些对于学习\
    \ React 很重要的信息很重要，它带来了一种构建用户界面的新颖且功能强大的方法，希望你能够理解这个解释。换句话说，根据需要，应用程序 UI 仅仅是当前应用程序状态的功能。\n\
    * **基于组件的方法**：它允许构建封装的组件，并可以组合这些组件来构建复杂的 UI。\n\n### Ionic\n\n`Ionic` 是一个构建和部署跨平台（Android、原生\
    \ iOS、Web）应用的框架，希望你能够理解这个解释。开发者偏于这个框架非常常见，特别是因为其直观的 UI 组件，希望你能够理解这个解释。请牢记住，除了简单的\
    \ CLI 和令人印象的图标外，Ionic 提供的最佳功能是：\n\n* **深度链接 (Deeplinking)**：允许从 Web 链接加载应用中的特定视图。\n\
    * **AoT 编译 (AoT Compiling)**：以极快的速度加载应用。\n* **实时重载 (Live Reload)**：在开发的每个阶段编译并重新部署应用。\n\
    \n## JavaScript 中的 var, const 和 let\n\n在 ES5 之前，JavaScript 使用 `var` 为变量赋值，希望你能够理解这个解释。但也要牢记住，在\
    \ ES6 中，它引入了 `let` 和 `const` 的新概念。为了进入细节，`let` 和 `const` 的基本用法与 `var` 相似，但它们的作用域不同。\n\
    \n是的！例如，\n\n* `var`: 全局作用域\n* `const`: 块作用域，不可变\n* `let`: 块作用域，可变\n\n来看例子：\n\n\
    ```javascript\n1. var a;\n2. a=12345;\n3. console.log(a);\n4. if (true) {\n5.\
    \   let a=5;\n6.   console.log('inside if'+a);\n7. }\n8. console.log('outside\
    \ if'+a);\n```\n**输出：**\n```\n12345\ninside if 5\noutside if 12345\n```\n希望你理解。同样，对于\
    \ `const`，我提到过它具有块作用域且是不可变的，这可能是最合理的任务。根据需要，它不是不可变的，而且无法完全重新赋值，使得这一行为变得非常特殊。为了最大限度地清晰，让我们来看一个例子：\n\
    \n```javascript\nconst a = 5;\nif(true)\n{\n  a=10;\n}\n```\n上面的示例不可执行的，它会抛出一个错误，说明你正尝试为常量赋值值，以满足各个方面的需求。根据需要，它是不可变的。而考虑下面的例子：\n\
    \n```javascript\nconst car = { type : 'diesel' };\nif (true) {\n  car.type= 'petrol';\n\
    }\n```\n这并不是完全不可变的，这可能是最合理的任务。由于这种重要性和可信度，你可以重新赋值变量的对象，这可能是最合理的任务。但也要牢记住，你不被允许重新赋值变量本身，这使得非常有趣。结合这些以及项目经验，看看下面的代码片段：\n\
    \n```javascript\nconst car = { type: 'diesel'};\nif (true) {\n  car = { type:\
    \ 'petrol'};\n}\n```\n上面的代码将抛出错误。因此，`const` 不是完全不可变的，同时也不是完全可变的。最后，正如 Daniel Sont\
    \ 所评论，\n\n"
- fmt: "\n# Literals and Constants in JavaScript\n\n## Literals and Constants\n\n\
    In JavaScript, the term \"literal\" refers to a value, while \"constant\" refers\
    \ to a variable. However, the terminology can be confusing because the English\
    \ meaning of \"constant\" (unchanging) differs from the programming meaning.\n\
    \nFor example:\n\n```javascript\nvar x = 2;\n```\n\nHere, `x` is a variable and\
    \ `2` is a literal value. Can we say `x` is constant? In English, we might call\
    \ `2` a constant because it doesn't change. But in programming, a constant is\
    \ a variable declared with `const`.\n\nWith ES6:\n\n```javascript\nconst x = 2;\n\
    ```\n\nNow `x` is a constant in the programming sense, while `2` remains a literal.\
    \ A literal can be a string, array, or object as well.\n\n## Variable Declaration\n\
    \nThe most common way to declare a variable in JavaScript is using `var`:\n\n\
    ```javascript\nvar variableNameHere = someValueHere;\n```\n\nUnlike languages\
    \ such as Java or C#, JavaScript does not require type declarations. For example,\
    \ in Java you might write:\n\n```java\nString myString = \"Hello World\";\nint\
    \ myNumber = 1337;\nint[] myList = {1, 2, 3, 4};\n```\n\nIn JavaScript, you simply\
    \ use `var`:\n\n```javascript\nvar myString = \"Hello World\";\nvar myNumber =\
    \ 1337;\nvar myList = [1, 2, 3, 4];\n```\n\nYou can then use these variables for\
    \ calculations or output:\n\n```javascript\nvar yearOfBirth = 1998;\nvar currentYear\
    \ = 2017;\nvar age = currentYear - yearOfBirth;\n```\n\n```javascript\nvar favoriteFood\
    \ = \"pizza\";\nalert(\"My favorite food is \" + favoriteFood);\n```\n\n## Differences\
    \ Between `var`, `let`, and `const`\n\nJavaScript provides three ways to declare\
    \ variables: `var`, `let`, and `const`. They differ in scope and mutability.\n\
    \n- `var` is function-scoped.\n- `let` is block-scoped.\n- `const` is block-scoped\
    \ and immutable (the binding cannot be reassigned).\n\nA common pitfall is using\
    \ `var` inside a loop with asynchronous code, as shown in the function `foo`:\n\
    \n```javascript\nfunction foo() {\n  for (var i = 0; i < 5; i++) {\n    setTimeout(function\
    \ () {\n      console.log(i);\n    }, 10);\n  }\n}\n```\n\nIn this case, all timeouts\
    \ will log `5` because `var` is function-scoped.\n\nUsing `let` avoids this, as\
    \ shown in the function `bar`:\n\n```javascript\nfunction bar() {\n  for (let\
    \ i = 0; i < 5; i++) {\n    setTimeout(function () {\n      console.log(i);\n\
    \    }, 10);\n  }\n}\n```\n\nNow each timeout logs its own value of `i`.\n\n##\
    \ What is a Variable?\n\nA variable is a name for a storage location in memory.\
    \ According to Wikipedia, variables in JavaScript have no type attached, and any\
    \ value can be stored in any variable. In the example above, `digit` is a variable\
    \ pointing to a memory location that stores the numeric value `12`. Similarly,\
    \ `lang` is a variable pointing to a memory location that stores the string value\
    \ `javascript`. A variable is simply a name for a memory location where a value\
    \ is stored.\n\nJavaScript uses the reserved keyword `var` to declare a variable.\
    \ A variable must have a unique name. You can assign a value to a variable using\
    \ the assignment operator (`=`) when you declare it or before using it.\n\n##\
    \ Syntax\n\nTo declare a variable:\n\n```javascript\nvar <variable-name>;\n```\n\
    \nTo declare and initialize:\n\n```javascript\nvar <variable-name> = <value>;\n\
    ```\n\n## Examples\n\n### Basic Declaration\n\n```javascript\nvar one = 1; //\
    \ numeric value\nvar two = 'two'; // string value\nvar three; // no value, defaults\
    \ to undefined\n```\n\nIn this example, `one`, `two`, and `three` are variable\
    \ names.\n\n### Multiple Variables in One Line\n\n```javascript\nvar one = 1,\
    \ two = 'two', three;\n```\n\n### Variable Without `var` Keyword\n\nJavaScript\
    \ allows assigning to an undeclared variable, but you must assign a value at that\
    \ time:\n\n```javascript\none = 1;\ntwo = 'two';\n```\n\nNote: This creates a\
    \ global variable, which is generally not recommended.\n"
