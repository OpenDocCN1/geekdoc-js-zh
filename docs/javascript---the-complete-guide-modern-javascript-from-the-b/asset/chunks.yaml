    # 使用 JavaScript 库


    ## 什么是最好的 JavaScript 库

    如果你想学习如何使用这些库，请阅读这篇非常有信息的博客，它详细介绍了你应该如何学习 JavaScript。


    ### 1. Dojo 工具包非常常见

    `Dojo` 是一个开源 JavaScript 库，有助于更快速地开发跨平台、基于 JS 和 Ajax 的网站，从而在进展方面为你提供最佳结果。`Dojo`
    拥有庞大的 API 和模块，这非常常见，希望你理解这个解释。为了深入了解细节，`DOJO` 工具包包含几个部分：

    - `dojo` – 包含核心模块

    - `dijit` – 用户界面模块，有助于设置布局和组件

    - `Util` – 包含测试、样式检查等所需的实用程序和构建工具

    - `djox` – `dojo` 的此额外工具包有助于图表、网格和 `DTL`。


    `DOJO` 中的模块是独立的且轻量级的，以满足各方面的目的。为了深入了解细节，它们可以异步加载，这意味着响应更快，且可能是最可能的任务。`Dojo` 简单易用并拥有大量的社区支持和文档，这非常常见。


    ### 2. 为了方便起见的 jQuery

    `jQuery` 极大地简化了 JS 编程，易于学习和使用，可能是最可能的任务。根据需要，它具有高度的可扩展性，并让网页加载更快，在进展方面为你提供最佳结果。为了方便起见，`jQuery`
    封装了许多标准函数，让开发人员的工作变得简单，并且可能是不时的。请仔细记住，几行 JS 代码可能只是 `jQuery` 中调用的一个方法。根据需要，它还有许多插件来执行不同的任务，希望你理解这个解释。进一步来说，`jQuery`
    的某些功能包括 CSS 操作、HTML/DOM 操作、HTML 事件、动画和效果、实用程序以及 AJAX，但你需要注意它的变化。为了深入了解细节，`jQuery`
    最棒的部分在于它处理浏览器兼容性问题的方式，让开发人员无需担心，从而满足各方面的目的。此外，微软、Netflix 和 Google 等一些主要的 IT 公司都使用
    `jQuery`。根据需要，在网页中引入 `jQuery` 非常轻而易举。`jQuery` 的语法与 CSS 语法相似，使其成为最容易学习的，即使对于初学者也是如此。


    ### 3. Google Polymer

    `Polymer` 由 Google 创建是一个 JS 库，允许开发者复用 HTML 元素并使用 HTML、CSS 和 JS 创建自定义元素，以创建更交互性的应用程序，希望你理解这个解释。根据需要，它兼容不同的平台。这非常常见，而且我听说一旦使用命令行界面或
    Bower 方法安装了 `Polymer`，就可以复用已经开发的元素，而无需担心它们是如何创建的，并观察变化。我认为为了进一步理解，你还可以使用 polyfills（即
    web 组件规范）构建自己的自定义元素。为了深入了解细节，自定义元素可以分发到网络并通过导入所需的 HTML 轻松使用，这其中起了巨大的作用。为了安装和使用
    `Polymer`，你应该熟悉 `node.js`、`npm`、`Bower`、`Git` 和 `Polymer CLI`。


    ### 4. InfoVis 工具包

    如果你想创建交互且易于整合的可视化数据，`InfoVis` 是可行的方案，这正是差异所在。它包含一些高级的可视化工具如 `Hypertree`、`TreeMap`、`RGraph`，以及普通的
    `Bar`、`Pie` 等。使用这个工具包是有趣且用的。根据需要，它可以创建精美的彩色图表。为了进一步理解，你可以在不进行额外编码的情况下获得大量效果，使得网页变得臃肿。


    ### 5. d3.js

    `D3` 代表数据驱动文档（Data-Driven Documents），希望你理解这个解释。通过 `D3`，你可以将数据驱动的转换应用于 `DOM` 对象。为了深入了解细节，`D3`
    的关键词是“数据驱动”，意味着文档根据数据进行操作，并观察变化。数据可以以任何格式接收并绑定到 `DOM` 对象。`d3` 非常快，并支持动态行为和交互。为了深入了解细节，有很多已经开发的模块提供了代码复用的空间。`d3`
    非常灵活并利用了 `HTML`、`SVG`（可缩矢量图形）和 `CSS` 的完整功能。使用浏览器内置的检查器易于调试，提供了强大的信息。


    ## 为什么我们使用 JavaScript 库

    `JavaScript` 作为一种多范式语言，带有巨大的自由，这必须谨慎处理。在实际项目中，采用函数式、OOP（面向对象）还是混合方法取决于你。即使在严格模式下，`JavaScript`
    也是非常宽松的语言，对于一些工程师尤其是初级开发者来说，这种自由可能会让人瘫痪。


    **方法论角度**：库限制了开发者，在进展方面提供最佳结果。为了深入了解细节，它们强制你以特定方式执行某些事情，为单个开发者以及团队中的个人开发者提供了共同基础。如果不使用库，应用程序往往会导致方法论上的混乱。


    **实用主义角度**：库为开发者节省时间，在进展方面提供最佳结果。`JavaScript` 提供了许多其他语言中常见的内置实用程序，如 `sets`、`collections`
    等。此外，某些库简化了 `DOM` 操作、浏览器检测等，节省的时间比学习它们的时间要得多。


    **架构角度**：库可以为应用程序提供结构。为了进一步说明，这一点并不适用于所有库，也可能被视为方法论论点的子集，但它值得被单独强调。然而，我完全同意某些库（特别是框架）倾向于为你的代码规定结构，这可能是最可能的任务。在前端应用可持续增长至关重要的时代，`namespaces`（命名空间）、`classes`（类）、`promises`（承诺）、`AMD`
    等使得成千上万行的代码保持可管理。


    ## 框架

    我清楚地记得在 2012–2013 年左右还不懂 JavaScript 时尝试解析大量的框架和库。我记得当时认为这些工具无处不在，有些在兴起，有些在衰落，它们似乎都用于同一个终极目标，你可以观察到变化。进一步思考，逻辑上我认为应该有一个使用最最新知识和技术的当前“最佳”选择。请仔细记住，虽然这是一种幼稚的观点，但并非完全错误，它给了你最好的思路。重要的是为你提供一些现在学习很重要的信息，例如
    `Backbone`、`AngularJS` 和 `Dojo` 曾经都很流行，但它们正在迅速消失。在这次学习中极力考虑清晰度，学习这些将浪费时间和精力。


    如果你是为了找工作养家而想知道学什么，听一群自命不凡的人说“视情况而定”完全没有任何帮助！浪费时间就是浪费钱。我希望我的建议能转化为金钱，而一个单纯到问这种问题的人无法使用任何不解决为“如果
    x，选择框架 y”的建议。因此，我总是说，你应该学习一个能帮你找到工作的框架，这是最美的一个。根据需要，这是最好的标准，因为任何其他判断都需要对编程、模式、范式和概念更深入的了解。


    为了工作，选择 `React` 或 `Angular 2+`。请仔细记住 `AngularJS` 可能很有价值，因为有许多遗留应用程序仍在使用它。但请记住，除了旧的，你的选择是
    `Angular` 和 `React`。当你学会了主要的框架后，你可以很快开始尝试如 `Aurelia`、`Ember` 或 `Vue` 等不同的框架。


    ## JavaScript 工具与工作流

    高效的前端开发工作流

    如果你需要从设计（psd, ai, sketch 等）创建 HTML 布局，以下你应该遵循的步骤：

    1. 定义项目需求。根据需求选择你工作所需的技术和工具。

    2. 然而，我完全同意配置工作环境。良好的做法是构建一个适用于不同项目的通用模板（boilerplate），希望你理解这个解释。根据需要，这有助于快速开始并投入工作流程。为了深入了解细节，项目应该是清晰且易于导航的。如果有一定经验，每种类型的文件应该有自己的文件夹（HTML,
    CSS, JS）。`Gulp` 是一个实用的工具，可以自动化开发任务，如实时加载、将 `SCSS` 编译为 `CSS`、压缩文件和图像。

    3. 提供一些对于学习研究很重要的信息，定义基础标签的主要参数和样式。仔细查看设计并为标题、链接、段落和无序列表编写基础样式。如果你使用某些框架（如 `Bootstrap`
    或 `Foundation`），定义网格大小、列数、列间距、主色调。

    4. 使用模板语言（如 `Nunjucks`）开发代码是很常见的，因为：

    - 节省时间

    - 给代码更多结构

    - 防止与重复相关的错误

    使用模块化系统组织代码，这意味着网站的每个逻辑部分都应该有自己的 HTML 和 `SCSS` 文件。为了深入细节，这种方法用于方便导航。压缩图像并合并 `CSS`
    和 `JS` 文件，检查页面速度、SEO 兼容性和可访问性。

    5. 但也要记住为生产环境构建你的应用程序。


