  trans: "\n\n2.  对 `conditionExpression` 表达式进行求值，并观察其变化。根据需求，如果 `conditionExpression`\
    \ 的值为 `true`，则执行循环语句，并可能执行最合理的任务。根据需求，如果 `condition` 的值为 `false`，则 `for` 循环终止，希望你能理解这个解释。（如果完全省略\
    \ `condition` 表达式，则默认条件为 `true`。）\n\n3.  执行 `statement`，希望你能理解这个解释。为了深入细节以执行多条语句，请使用块语句（`{\
    \ ... }`）将这些语句组合起来。\n\n4.  如果存在，则执行更新表达式 `incrementExpression`。\n\n5.  控制权返回步骤\
    \ 2。\n\n## 示例\n\n在下面的示例中，函数包含一个 `for` 语句，用于统计滚动列表中选定选项的数量（一个允许多项选择的 `<select>`\
    \ 元素）。为了深入细节，`for` 语句声明了变量 `i` 并将其初始化为 `0`。根据需求，它检查 `i` 是否小于 `<select>` 元素中的选项数量，执行后续的\
    \ `if` 语句，并在每次循环后递增 `i`。\n\n```\n<form name=\"selectForm\">\n  <p>\n    <label\
    \ for=\"musicTypes\">选择一些音乐类型，然后点击下面的按钮：</label>\n    <select id=\"musicTypes\"\
    \ name=\"musicTypes\" multiple=\"multiple\">\n      <option selected=\"selected\"\
    >R&B</option>\n      <option>Jazz</option>\n      <option>Blues</option>\n   \
    \   <option>New Age</option>\n      <option>Classical</option>\n      <option>Opera</option>\n\
    \    </select>\n  </p>\n  <p>\n    <input id=\"btn\" type=\"button\" value=\"\
    选中了多少个？\" />\n  </p>\n</form>\n<script>\nfunction howMany(selectObject) {\n  let\
    \ numberSelected = 0;\n  for (let i = 0; i < selectObject.options.length; i++)\
    \ {\n    if (selectObject.options[i].selected) {\n      numberSelected++;\n  \
    \  }\n  }\n  return numberSelected;\n}\nlet btn = document.getElementById('btn');\n\
    btn.addEventListener('click', function() {\n  alert('选中的选项数量：' + howMany(document.selectForm.musicTypes));\n\
    });\n</script>\n```\n\n## `do...while` 语句\n\n`do...while` 语句会重复执行，直到指定的条件求值为 `false`。\n\
    \n`do...while` 语句的语法如下：\n\n```\ndo\n  statement\nwhile (condition);\n```\n\n`statement`\
    \ 在条件检查之前至少执行一次，并观察其变化。（要执行多条语句，请使用块语句（`{ ... }`）将这些语句组合起来。）\n\n如果 `condition`\
    \ 为 `true`，则再次执行 `statement`，用于你的项目信息。请务必记住，每次执行结束时都会检查条件，并观察其变化。进一步解释，当条件为 `false`\
    \ 时，执行停止，控制权传递给 `do...while` 之后的语句。\n\n### 示例\n\n在下面的示例中，`do` 循环至少迭代一次，并重复直到 `i`\
    \ 不再小于 `5`。\n\n```\nlet i = 0;\ndo {\n  i += 1;\n  console.log(i);\n} while (i\
    \ < 5);\n```\n\n## `while` 语句\n\n`while` 语句会在指定条件求值为 `true` 时执行其语句，并可能执行最合理的任务。请务必记住，`while`\
    \ 语句的语法如下：\n\n```\nwhile (condition)\n  statement\n```\n\n如果 `condition` 变为 `false`，则循环内的\
    \ `statement` 停止执行，控制权传递给循环之后的语句。\n\n条件测试在循环中的 `statement` 执行*之前*进行，并观察其变化。根据需求，如果条件返回\
    \ `true`，则执行 `statement`，并再次测试 `condition`，用于你的项目信息。根据需求，如果条件返回 `false`，则执行停止，控制权传递给\
    \ `while` 之后的语句。\n\n要执行多条语句，请使用块语句（`{ ... }`）将这些语句组合起来。\n\n### 示例 1\n\n以下 `while`\
    \ 循环在 `n` 小于 `3` 时重复执行：\n\n```\nlet n = 0;\nlet x = 0;\nwhile (n < 3) {\n  n++;\n\
    \  x += n;\n}\n```\n\n每次迭代中，循环递增 `n` 并将该值加到 `x` 上，但你需要留意其变化。为了深入细节，因此 `x` 和 `n`\
    \ 的值如下：\n\n*   第一次循环后：`n = 1` 且 `x = 1`\n*   第二次循环后：`n = 2` 且 `x = 3`\n*   第三次循环后：`n\
    \ = 3` 且 `x = 6`\n\n完成第三次循环后，条件 `n < 3` 不再为 `true`，因此循环终止。\n\n### 示例 2\n\n避免无限循环，希望你能理解这个解释。由于其重要性和可信度，请确保循环中的条件最终变为\
    \ `false`——否则循环将永远不会终止！以下 `while` 循环中的语句会永远执行，因为条件永远不会变为 `false`：\n\n```\n// 无限循环是不好的！\n\
    while (true) {\n  console.log('Hello, world!');\n}\n```\n\n## 标记语句\n\n`label`\
    \ 为语句提供了一个标识符，使你能够在程序的其他地方引用它，这一点必须谨慎处理。在实际项目中，例如，你可以使用标签来标识一个循环，然后使用 `break`\
    \ 或 `continue` 语句来指示程序是否应中断循环或继续执行。\n\n标记语句的语法如下：\n\n```\nlabel :\n  statement\n\
    ```\n\n`label` 的值可以是任何不是保留字的 JavaScript 标识符，并观察其变化。为了深入细节，你用标签标识的 `statement`\
    \ 可以是任何语句。\n\n### 示例\n\n在此示例中，标签 `markLoop` 标识了一个 `while` 循环。\n\n```\nmarkLoop:\n\
    while (theMark === true) {\n  doSomething();\n}\n```\n\n## `break` 语句\n\n使用 `break`\
    \ 语句来终止循环、`switch` 或与标记语句结合使用。\n\n*   当你在没有标签的情况下使用 `break` 时，它会立即终止最内层的 `while`、`do-while`、`for`\
    \ 或 `switch`，并将控制权传递给后续语句。\n*   当你在有标签的情况下使用 `break` 时，它会终止指定的标记语句。\n\n`break`\
    \ 语句的语法如下：\n\n```\nbreak;\nbreak [label];\n```\n\n1.  第一种语法形式终止最内层的循环或 `switch`。\n\
    2.  第二种语法形式终止指定的外层标记语句。\n\n### 示例 1\n\n以下示例遍历数组中的元素，直到找到值为 `theValue` 的元素的索引：\n\
    \n```\nfor (let i = 0; i < a.length; i++) {\n  if (a[i] === theValue) {\n    break;\n\
    \  }\n}\n```\n\n### 示例 2：带标签的 break\n\n```\nlet x = 0;\nlet z = 0;\nlabelCancelLoops:\n\
    while (true) {\n  console.log('外层循环：' + x);\n  x += 1;\n  z = 1;\n  while (true)\
    \ {\n    console.log('内层循环：' + z);\n    z += 1;\n    if (z === 10 && x === 10)\
    \ {\n      break labelCancelLoops;\n    } else if (z === 10) {\n      break;\n\
    \    }\n  }\n}\n```\n\n## `continue` 语句\n\n`continue` 语句可用于重新开始 `while`、`do-while`、`for`\
    \ 或标签语句。\n\n*   当你在没有标签的情况下使用 `continue` 时，它会终止最内层 `while`、`do-while` 或 `for`\
    \ 语句的当前迭代，并继续执行循环的下一次迭代，用于你的项目信息。根据需求，与 `break` 语句不同，`continue` 不会完全终止循环的执行，可能具有试探性。根据需求，在\
    \ `while` 循环中，它会跳回条件判断，用于你的项目信息。根据需求，在 `for` 循环中，它会跳转到 `increment-expression`。\n\
    *   当你在有标签的情况下使用 `continue` 时，它适用于该标签标识的循环语句。\n\n"
- fmt: "\nThe syntax of the `continue` statement looks like the following:\n\n`continue\
    \ [label ];`\n\n### Example 1\nThe following example shows a `while` loop with\
    \ a `continue` statement that executes when the value of `i` is 3. Since for a\
    \ purpose getting in to details of this thus, `n` takes on the values 1, 3, 7,\
    \ and 12.\n\n```javascript\nlet i = 0;\nlet n = 0;\nwhile (i < 5) {\n  i++;\n\
    \  if (i === 3) {\n    continue;\n  }\n  n += i;\n  console.log(n);\n}\n// 1,3,7,12\n\
    \nlet i = 0;\nlet n = 0;\nwhile (i < 5) {\n  i++;\n  if (i === 3) {\n    // continue;\n\
    \  }\n  n += i;\n  console.log(n);\n}\n// 1,3,6,10,15\n```\n\n### Example 2\n\
    A statement labeled `checkiandj` contains a statement labeled `checkj` with great\
    \ object and scope of fulfilment. Depending on necessity if `continue` is encountered,\
    \ the program terminates the current iteration of `checkj` and begins the next\
    \ iteration for your project information. But with some experience each time `continue`\
    \ is encountered, `checkj` reiterates until its condition returns `false` and\
    \ likely the act of utmost plausible task. Adding further to explain this when\
    \ `false` is returned, the remainder of the `checkiandj` statement is completed,\
    \ and `checkiandj` reiterates until its condition returns `false` and likely the\
    \ act of utmost plausible task. Adding further to explain this when `false` is\
    \ returned, the program continues at the statement following `checkiandj`. If\
    \ `continue` had a label of `checkiandj`, the program would continue at the top\
    \ of the `checkiandj` statement.\n\n```javascript\nlet i = 0;\nlet j = 10;\ncheckiandj:\
    \ while (i < 4) {\n  console.log(i);\n  i += 1;\n  checkj: while (j > 4) {\n \
    \   console.log(j);\n    j -= 1;\n    if ((j % 2) === 0) {\n      continue checkj;\n\
    \    }\n    console.log(j + ' is odd.');\n  }\n  console.log('i = ' + i);\n  console.log('j\
    \ = ' + j);\n}\n```\n\n### for...in statement\nThe `for...in` statement iterates\
    \ a specified variable over all the enumerable properties of an object to make\
    \ the purpose meet from all the ends for this. In real projects for each distinct\
    \ property, JavaScript executes the specified statements and I wish you get this\
    \ explanation. Remember very carefully that a `for...in` statement looks as follows:\n\
    \n`for (variable in object) statement`\n\n### Example\nThe following function\
    \ takes as its argument an object and the object's name and likely the act of\
    \ utmost plausible task. Depending on necessity it then iterates over all the\
    \ object's properties and returns a string that lists the property names and their\
    \ values.\n\n```javascript\nfunction dump_props(obj, obj_name) {\n  let result\
    \ = '';\n  for (let i in obj) {\n    result += obj_name + '.' + i + ' = ' + obj[i]\
    \ + '<br>';\n  }\n  result += '<hr>';\n  return result;\n}\n```\n\nFor an object\
    \ `car` with properties `make` and `model`, result would be:\n`car.make = Ford`\n\
    `car.model = Mustang`\n\n### Arrays\nAlthough it may be tempting to use this as\
    \ a way to iterate over `Array` elements, the `for...in` statement will return\
    \ the name of your user-defined properties in addition to the numeric indexes.\
    \ Therefore, it is better to use a traditional `for` loop with a numeric index\
    \ when iterating over arrays, because the `for...in` statement iterates over user-defined\
    \ properties in addition to the array elements, if you modify the `Array` object\
    \ (such as adding custom properties or methods).\n\n### for...of statement\nThe\
    \ `for...of` statement creates a loop iterating over `iterable objects` (including\
    \ `Array`, `Map`, `Set`, `arguments` object and so on), invoking a custom iteration\
    \ hook with statements to be executed for the value of each distinct property.\n\
    \n`for (variable of object ) statement`\n\n### Example\nThe following example\
    \ shows the difference between a `for...of` loop and a `for...in` loop but be\
    \ careful in using this in your projects. Adding further to explain this while\
    \ `for...in` iterates over property names, `for...of` iterates over property values:\n\
    \n```javascript\nconst arr = [3, 5, 7];\narr.foo = 'hello';\nfor (let i in arr)\
    \ {\n  console.log(i); // logs \"0\", \"1\", \"2\", \"foo\"\n}\nfor (let i of\
    \ arr) {\n  console.log(i); // logs 3, 5, 7\n}\n```\n\n# Efficient Development\
    \ & Debugging\n\n## What is the way to debug a JavaScript?\n\n### Use JavaScript\
    \ Validator\n- **Validating parsers or just validators**: Checks code to make\
    \ sure it is valid.\n- **Douglas Crockford’s JavaScript Lint**: Add debugging\
    \ code to the program: use the `alert()` or `document.write()` method examines\
    \ the health of your program very easily.\n\n### Use JavaScript Debugger:\nProvide\
    \ fine-grained control over the script. run one line at a time. You can setup\
    \ breakpoints and use developer tools on browser by pressing `F12`. Depending\
    \ on necessity if you are using some API calls, you can go to network tab on developer\
    \ tools and check whether you are getting some error or 200 response.\n\nAlso\
    \ you can get help from Alerts, example. Suppose you want to debug that your code\
    \ is getting to that point or not, just put `alert('Something')` and while executing\
    \ you will get an alert popup on browser. Suppose you need to check, the value\
    \ is changing or getting set or not, you can use `alert(object)` after setting\
    \ that and you will get alert with that value.\n\nJavaScript debugging tools firstly,\
    \ use either Chrome or Firefox - both have excellent features. I use Chrome -\
    \ drop down the Chrome menu from the top-right of the window select \"Developer\
    \ Tools\".\n\n- **Elements**: gives you a collapsed diagram of HTML/CSS - you\
    \ can expand and collapse individual elements - see what attributes, what has\
    \ been provided by CSS.\n- **Console**: lets you see any error messages - reloading\
    \ web page will see any loading errors.\n- **Sources**: lets you see where in\
    \ source code the error happened (click on the error message). I think for next\
    \ understanding you can also create \"breakpoints\" - let you click on a particular\
    \ line of JavaScript and have the debugger pause your script when reaches that\
    \ line so you can see what had values, etc., You can also \"watch\" a particular\
    \ variable, and see whenever changes.\n- **Network**: lets you see messages sent\
    \ back and forth between server, what files were loaded and how long server took\
    \ to deliver.\n- **Performance**: lets you get timings from code - have to turn\
    \ on this facility, reload your page and interact with it - lets see where time\
    \ was spent, so if something is running slower like you can see which pieces of\
    \ code were responsible. You can also record memory usage.\n\n### Debug JavaScript\
    \ code using the browser’s console\nIn almost all major browsers based on Windows\
    \ platform, developer tool can be accessed by pressing `F12`, or `Ctrl+Shift+I`,\
    \ or by right clicking on an element and navigating to `Inspect`. Depending on\
    \ necessity if you are using Mac, Developer tools can be accessed in browser by\
    \ pressing `Cmd+Opt+I`. If library handles the exception, code execution will\
    \ not be paused in that case. Feature is available in Firefox and Chrome and not\
    \ in IE.\n\n### A Typical Scenario\nLet’s think about a typical scenario where\
    \ your JS code is throwing an exception. Depending on necessity if you are using\
    \ Chrome, the first thing to do is enable the \"Pause on exceptions\" icon. But\
    \ also remember that by enabling it, browser stops code execution whenever an\
    \ exception is caught.\n\n### Inspecting the Code\nWith the execution paused,\
    \ we can now observe the code and find out what is wrong this gives you best idea\
    \ of all. Since for a purpose getting in to details of this is one of the biggest\
    \ benefit of using the debugger to give you the best of the result in assertion\
    \ of progression. But with some experience everything script has access to is\
    \ visible to the developer.\n\nIn the code view, wherever the exception is thrown,\
    \ there is a red icon at the end of that line. We can see the error message by\
    \ either hovering on the icon or by looking at the error message on the console.\
    \ allow further inspection. I really find this interesting under the `scope` tab\
    \ we can also find more information on variables. Depending on necessity in the\
    \ `scope` tab, variables are ordered by scope. In real projects for example, all\
    \ local variables are arranged under the \"local\" section.\n\n### Figuring Out\
    \ the Problem\nIn case of small errors, the error message gives us clear idea\
    \ on what is causing the exception. In real projects for example, if `forEach`\
    \ function is used and the url has an incorrect value we will get error message\
    \ like \"forEach is not a function\". The bug can be fixed by using an `if` statement\
    \ and checking the variable type. But also remember that as an experienced front-end\
    \ developer, you need to detect the root cause of the problem before fixing it.\n\
    \n### Root Cause Analysis\nThe root cause of the error can be searched by inspecting\
    \ `Call Stack` tab. It shows parent elements of current function.\n\n### Debugging\
    \ A Complicated Problem Using Breakpoints\nThe script debugger has another interesting\
    \ feature called breakpoints, that can help the developer to figure out more complex\
    \ problems. Breakpoints can be set by adding a `debugger;` statement inline or\
    \ by clicking the line number at script debugger. Let you click on a particular\
    \ line of JavaScript and have the debugger pause your script when reaches that\
    \ line so you can see what values, etc., You can also \"watch\" a particular variable,\
    \ and see whenever changes.\n"
