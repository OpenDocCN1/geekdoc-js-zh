    # Overview

    ## What is JavaScript

    JavaScript is a dynamic computer programming language and likely the act of utmost
    plausible task. Depending on necessity it is lightweight and most commonly used
    as a part of web pages, whose implementations allow client-side script to interact
    with the user and make dynamic pages and I wish you get this explanation. Depending
    on necessity it is an interpreted programming language with object-oriented capabilities.
    JavaScript was first known as `LiveScript`, but Netscape changed its name to JavaScript,
    possibly because of the excitement being generated by Java and this is really
    best of the capabilities. Henceforth for the example of your convenience javaScript
    made its first appearance in Netscape 2.0 in 1995 with the name `LiveScript`,
    The general-purpose core of the language has been embedded in Netscape, Internet
    Explorer, and other web browsers. The ECMA-262 Specification defined a standard
    version of the core JavaScript language.

    (1)JavaScript is a lightweight, interpreted programming language.

    (2)Designed for creating network-centric applications.

    (3)Complementary to and integrated with Java.

    (4)Complementary to and integrated with HTML.

    (5)Open and cross-platform.


    ## Client-Side JavaScript

    Client-side JavaScript is the most common form of the language and likely the
    act of utmost plausible task. Depending on necessity it is lightweight and most
    commonly used as a part of web pages, whose implementations allow client-side
    script to interact with the user and make dynamic pages and I wish you get this
    explanation. It means that a web page need not be a static HTML, but can include
    programs that interact with the user, control the browser, and dynamically create
    HTML content.


    ## Advantages of JavaScript

    The merits of using JavaScript are —(1)Less server interaction — You can validate
    user input before sending the page off to the server to give you the best of the
    result in assertion of progression. Since for purpose getting in details of this
    this saves server traffic, which means less load on your server.

    (2)Immediate feedback to the visitors — They don''t have to wait for a page reload
    to see if they have forgotten to enter something.

    (3)Increased interactivity — You can create interfaces that react when the user
    hovers over them with a mouse or activates them via the keyboard.

    (4)Richer interfaces — You can use JavaScript to include such items as drag-and-drop
    components and sliders to give a Rich Interface to your site visitors.


