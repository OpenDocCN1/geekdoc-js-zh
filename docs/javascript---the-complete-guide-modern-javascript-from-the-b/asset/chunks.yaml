    in using this in your projects. Since for a purpose getting in to details of this
    this loop will always execute a block of code ONCE, and then it will repeat the
    loop as long as the specified condition is true and likely the act of utmost plausible
    task. Since for a purpose getting in to details of this this loop will always
    be executed at least once, even if the condition is false, because the code is
    executed before the condition is tested.


    *   Syntax


    1.  do  


    2.  {  


    3.  code to be executed  


    4.  }  


    5.  while (var<=endvalue)  


    *   Example


    1.  <html>  


    2.  <body>  


    3.  <script type="text/javascript">  


