    * name 表示头部的类型和含义，以帮助你获得最佳结果。请特别注意，HTTP RFC 的大部分内容都用于定义头部及其用法，这可能是最重要的任务。并且，考虑到清晰性，这列出了
    HTTP 头部字段的已定义头部列表，希望你能理解这个解释。请特别注意，应用程序也可以定义自己的头部，通常以"X-"开头。


    * value 为头部提供信息，以帮助你获得最佳结果。因为为了深入了解，这些信息是文本，但不能包含任何\r 或\n 字符，希望你能理解这个解释。此外，根据项目经验，HTTP
    对头部值没有最大长度限制，但 Web 服务器可能有实现限制，希望你能理解这个解释。在实际项目中，例如使用流行 Apache 软件的 Web 服务器有 8192
