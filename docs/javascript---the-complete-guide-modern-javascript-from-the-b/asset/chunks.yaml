    - `Int16Array`, `Uint16Array`,

    - `Int32Array`, `Uint32Array`

    - `Float32Array`, `Float64Array`


    Point 2: In JavaScript arrays are objects which are instances of the `Array` Constructor.
    Such objects:


    - have a dedicated behavior on get/set or their `length` property

    - have dedicated Array methods inherited from the `Array.prototype`

    - consider number compatible keys (property names) as indexes and their associated
    value as elements

    - are Iterable objects (since ES6)


    Other than that they are plain JS Object so:


    - adding/removing elements is like adding/removing properties, then elements can
    have very disparate indexes, JS Arrays are often called sparse arrays and theirs
    parsing methods (`forEach`/`map`/`reduce`/`find`/`some`/…) only iterate on defined
    elements

    - elements value type is mixed


    So:


    - arrays of arrays are arrays for which all elements are array objects

    - array of objects are arrays for which all elements are objects, but it doesn’t
    from which constructor they were created, so some of them may be `Array` objects,
    while others `RegExp` objects, or `Promise` objects, or any custom ones


    Building array of arrays are a way to build a 2-dimensions array, as you could
    build n-dimensions ones. To access a 2-dimension array element in JS you could
    do:


    ```

    myArray[x][y] = 42;

    ```


    but beware:


    - the `myArray[x][y]` could break if `myArray[x]` has not been well initialised
    (ex undefined)

    - beware that as JS is typeless it is up to your code to get/set values with the
    right type

