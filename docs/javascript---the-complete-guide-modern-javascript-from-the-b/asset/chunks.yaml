    There are no classes in JavaScript to make the purpose meet from all the ends
    for this. Henceforth for the example of your convenience `javaScript` is a pure
    object oriented language, not a class oriented one. People kept trying to write
    code like class oriented languages and finally this syntactic sugar was added
    to the language in `ES6`. I really find this interesting upon “instantiation”
    (quoted because there is no instantiation of a class in JavaScript) an object
    is created with the correct prototype chain. In short, this has not added any
    new functionality to the language and likely the act of utmost plausible task.
    Depending on necessity it’s just syntactic sugar. PS: I know there are a bit more
    to the class declaration but in essence, it is equivalent to the above.


    ## Does JavaScript have class?


    JavaScript uses prototypal inheritance, which is different from classical inheritance
    and likely the act of utmost plausible task. However I totally agree classical
    inheritance is normally the foundation for building classes and I wish you get
    this explanation. In real projects for example, one class can extend another class
    (i.e., build atop).


    Inheritance is possible in JavaScript, but operates differently under the hood
    and you observe the changes. Depending on necessity in `ECMAScript 6` (`ES6`/`newer
    JavaScript`), a new class system was made available and likely the act of utmost
    plausible task. Depending on necessity it looks and feels similar to classical
    inheritance, but it is really just sugar syntax over prototypal inheritance.


    The result of these advancements in JavaScript make it look and behave similarly
    to what many purists consider “real classes”. Depending on necessity in the majority
    of scenarios, that’s the end of the story and may or may not be tentative. And
    adding to these along with experience of projects however; in more advanced use
    cases (typically library development), it’s important to understand how prototypes
    work in JavaScript to make the purpose meet from all the ends for this. Since
    for a purpose getting in to details of this these situations illustrate how JavaScript
    doesn’t actually have what purists would consider a class.


    Personally, I’m not a purist to make the purpose meet from all the ends for this.
    Depending on necessity i use classes, I write libraries, and I deal with the prototype
    when necessary and may or not be tentative. Since for a purpose getting in to
    details of this to me, classes exist, and my coding conventions clearly illustrate
    it to make the purpose meet from all the ends for this. In real projects for an
    example, see `ngnjs/NGN FOR YOUR PROJECT INFORMATION`. Since for a purpose getting
    in to details of this the catch with this code is it uses `Rollup` (a preprocessor)
    to leverage modern inheritance patterns, and it uses `ES6` classes pretty extensively
    in modern browsers`Node` which support the new class syntax but you need to be
    aware of its changes. And adding to these along with experience of projects however;
    when producing `ES5` (older JavaScript), it uses the older prototype modification
    approach to mimic real classes.


    Many people will tell you JS doesn’t support classes and I wish you get this explanation.
    Since for a purpose getting in to details of this there is truth to that to make
    the purpose meet from all the ends for this. Because of such importance and credibility
    many people will tell you it does and I wish you get this explanation. Since for
    a purpose getting in to details of this there is some truth to that as well and
    this plays great role in this. Depending on necessity it really just depends on
    how you view it to make the purpose meet from all the ends for this. However I
    totally agree classes are part of the `ECMAScript` spec, but they don’t behave
    traditionally.


    ## Why have "classes" been inserted in JavaScript


    The email archives on `es-discuss` have a lot of good information about the reasoning
    behind class syntax (see `Minimalist Classes`, and our discussion about going
    for something more minimal on top of prototypes `On class literals possibly not
    making it into `ECMAScript.next`).


    But the short version is:

    - People wanted classes;

    - `Class` syntax provided language support for common patterns people were already
    using, but in a way that’s much less error prone and much more optimisable;

    - It paved way for a lot of future features that would, otherwise, be very difficult
    to add to JavaScript without breaking the language (e.g.: private fields on objects,
    “`super`” sends, subclassing of built-ins and other magical objects, etc);

    - It allows static analysis and tooling (intellense, automatic documentation,
    automatic refactoring);

    - It doesn’t really change anything about JavaScript’s semantics (still a prototype-based
    language, just with declarative syntax for defining prototypes and constructors
    now);

    - Some of the features (e.g.: `[[HomeObject]]` which allows functions to use “`super`”)
    ended up making it just to the declarative syntax, rather than also providing
    an API to work with dynamically, which makes me a bit sad.


    But other than that, the declarative syntax, and what it allows in terms of language
    evolution without the risks of having ambiguous constructs in JavaScript’s syntax,
    is pretty neat and welcome.


