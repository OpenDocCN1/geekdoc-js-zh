    # HTML DOM Model


    ![https://qphs.fsusercontent.net/mainображ-7e5c867e3f4730997c5338648c6a1594](rsrc2J3.jpg)


    The places of the elements are referred to as nodes. Proceeding further, not only
    elements get nodes but also the attributes of elements and text get their own
    node (attribute-nodes and text-nodes).


    # DOM Document


    The DOM Document is the owner of all other objects in your webpage. If you want
    to access any object on your webpage you always have to start with the `document`.
    It also contains many important properties and methods that enable us to access
    and modify our website.


    # Finding HTML Elements


    Now that we understand what the DOM document is, we can start getting our first
    HTML elements. There are many different ways to do so using the JavaScript DOM.
    Here are the most common:


    ## Get Element by ID


    The `getElementById()` method is used to get a single element by its id. Let''s
    look at an example:


    ```javascript

    var title = document.getElementById(''header-title'');

    ```


    Here we get the element with the id of `header-title` and save it into a variable.


    ## Get Elements by Class Name


    We can also get more than one object using the `getElementsByClassName()` method
    which returns an array of elements.


    ```javascript

    var items = document.getElementsByClassName(''list-items'');

    ```


    Here we get all items with the class `list-items` and save them into a variable.


    ## Get Element by Tag Name


    We can also get our elements by tag name using the `getElementsByTagName()` method.


    ```javascript

    var listItems = document.getElementsByTagName(''li'');

    ```


    Here we get all `li` elements of our HTML document and save them into a variable.


    ## querySelector


    The `querySelector()` method returns the first element that matches a specified
    CSS selector. This means that you can get elements by id, class, tag and all other
    valid CSS selectors. Here are a few of the most popular options:


    Get by id:

    ```javascript

    var header = document.querySelector(''#header'');

    ```


    Get by class:

    ```javascript

    var items = document.querySelector(''.list-items'');

    ```


    Get by tag:

    ```javascript

    var headings = document.querySelector(''h1'');

    ```


    Get more specific elements:

    ```javascript

    document.querySelector("h1.heading");

    ```


    In this example we search for a tag and a class at the same time and return the
    first element that matches the CSS selector.


    ## querySelectorAll


    The `querySelectorAll()` method is completely the same as `querySelector()` except
    that it returns all elements that match the CSS selector.


    ```javascript

    var heading = document.querySelectorAll(''h1.heading'');

    ```


    In this example, we get all `h1` tags that have a class of `heading` and store
    them in an array.


    # Changing HTML Elements


    The HTML DOM allows us to change the content and style of an HTML element by changing
    its properties.


    ## Changing the HTML


    The `innerHTML` property can be used to change the content of an HTML element.


    ```javascript

    document.getElementById("header").innerHTML = "Hello World!";

    ```


    In this example we get the element with an id of `header` and set the inner content
    to "Hello World!".


    `innerHTML` can also be used to put tags inside another tag.


    ```javascript

    document.getElementsByTagName("div").innerHTML = "<h1>Hello World!</h1>";

    ```


    Here we put an `h1` tag into all existing `div` elements.


    ## Changing a Value of an Attribute


    You can also change the value of an attribute using the DOM.


    ```javascript

    document.getElementsByTag("img").src = "test.jpg";

    ```


    In this example we change the `src` of all `img` tags to `test.jpg`.


    ## Changing the Style


    To change the style of an HTML element we need to change the `style` property
    of our elements. Here is an example syntax for changing styles:


    ```javascript

    document.getElementById(id).style.property = new style;

    ```


    Now let''s look at an example where we get an element and change the bottom border
    to a solid black line:


    ```javascript

    document.getElementsByTag("h1").style.borderBottom = "solid 3px #000";

    ```


    The CSS properties need to be written in camelCase instead of the normal CSS property
    name. In this example we used `borderBottom` instead of `border-bottom`.


    # Adding and Deleting Elements


    Now we will take a look at how we can add new elements and delete existing ones.


    ## Adding Elements


    ```javascript

    var div = document.createElement(''div'');

    ```


    Here we just create a `div` element using the `createElement()` method which takes
    a tag name as a parameter and saves it into a variable. Remember that after that
    we just need to give it some content and then insert it into our DOM document.


    ```javascript

    var content = document.createTextNode("Hello World!");

    div.appendChild(content);

    document.body.insertBefore(div, currentDiv);

    ```


    Here we create content using the `createTextNode()` method which takes a string
    as a parameter and then we insert our new `div` element before a `div` that already
    exists in our document.


    ## Deleting Elements


    ```javascript

    var elem = document.querySelector(''#header'');

    elem.parentNode.removeChild(elem);

    ```


    Here we get an element and delete it using the `removeChild()` method.


    ## Replacing Elements


    Now let''s take a look at how we can replace items.


    ```javascript

    var div = document.querySelector(''#div'');

    var newDiv = document.createElement(''div'');

    newDiv.innerHTML = "Hello World2";

    div.parentNode.replaceChild(newDiv, div);

    ```


    Here we replace an element using the `replaceChild()` method. The first argument
    is the new element and the second argument is the element which we want to replace.


    # Writing Directly into the HTML Output Stream


    We can also write HTML expressions and JavaScript directly into the HTML output
    stream using the `write()` method.


    ```javascript

    document.write("<h1>Hello World!</h1><p>This is a paragraph!</p>");

    ```


    We can also pass JavaScript expressions like a date object.


    ```javascript

    document.write(Date());

    ```


    The `write()` method can also take multiple arguments that will be appended to
    the document in order of their occurrence.


    # Event Handlers


    The HTML DOM also allows JavaScript to react to HTML events. Here are some of
    the most important ones:


    - mouse click

    - page load

    - mouse move

    - input field change

