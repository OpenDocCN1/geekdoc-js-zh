    11.  while (i<0)  


    12.  </script>  


    13.  </body>  


    14.  </html>  


    *   Result


    1.  The number is 0 


    .Break and ContinueThere are two special statements that can be used inside loops:
    break and continue.


    *   Break


    The break command will break the loop and continue executing the code that follows
    after the loop (if any).


    *   Example


    1.  <html>  


    2.  <body>  


    3.  <script type="text/javascript">  


    4.  var i=0  


    5.  for (i=0;i<=10;i++)  


