    # JavaScript 的能力与限制


    所以，JavaScript 允许：

    - 添加各种动画效果。

    - 响应事件以处理鼠标移动、按下键盘。

    - 在发送数据到服务器之前验证表单输入，从而减少了服务器的额外负载。

    - 创建和读取 `cookie`。

    - 获取有关访问者计算机的数据。

    - 识别浏览器。

    - 修改 HTML 元素的内容，添加新标签并编辑样式。


    为了详细说明这一点，这并不限于上述列表，因为 JavaScript 允许你做更多事情。


    ## 限制与安全


    此外，JavaScript 也有一些限制，这是为了安全考虑。例如，`JavaScript` 无法关闭打开的标签，这非常有趣。根据需要，它无法保护页面的源代码并防止从页面复制文本或图像。


    请记住，它无法对另一个域执行跨源查询。即使不同域的页面在不同的浏览器标签页中显示，同域的 JavaScript 代码也不会访问另一个域的网页。为了详细说明这一点，这确保了页面所有者可以知的隐私信息。


    此外，它无法访问用户计算机上的文件，除了网页本身之外，唯一的例外是 `cookie`，它是 `JavaScript` 可以读写的小文本文件。这种设计是为了确保攻击者无法使用
    `JavaScript` 获取个人数据或损害用户的计算机。


    安全很重要。在当前的技术，最重要的一点是保持在线安全，这可能是尝试性的。请记住，我们需要保护我们的数据和个人信息。根据 O''Reilly 的《JavaScript
    安全》：“在许多浏览器中，`JavaScript` 被用作其他软件的脚本引擎，例如 Internet Explorer 中的 `ActiveX` 控制和 Netscape
    中的插件。为了详细说明这一点，这些组件可能具有文件系统网络能力，而 `JavaScript` 程序可以控制它们的事实模糊了界限并引发了安全担忧。对于 `ActiveX`
    控制来说，微软有时不得不发布安全补丁以防止 `JavaScript` 代码利用可脚本的 `ActiveX` 对象。”


    `JavaScript` 不支持某些功能。在实际项目中，例如，客户端没有在客户端计算机上记录或删除文件或目录的能力，以便给你进展的最佳结果。为了详细说明这一点，因此没有访问对象的
    `JavaScript` 无法删除病毒，因为这是可能的。例如，`JavaScript` 无法使用客户端计算机黑进另一台机器。


    请记住，所有在客户端执行的操作都具有潜在危险性。在实际项目中，首先给客户验证代码，我们提供一个绕过验证的工具，这其中起了很大作用。为了详细说明这一点，源代码比服务器上普通的验证器更容易学习，后者对客户来说是“黑盒”。


    `JavaScript` 和 `DOM` 为恶意软件作者提供了巨大的机会，他们希望通过互联网交付脚本来管理客户端计算机。但请记住，浏览器制造者意识到存在风险，并使用上述两种限制来消除它。进一步地，你控制的脚本“运行在沙箱中”，在那种情况下，它们只能执行有限范围的动作，而不是通用的编程任务。在实际项目中，例如文件创建等，脚本遵循同源策略，根据该策略，嵌入页面的脚本无法访问用户名、密码、cookie
    和第二个页面等信息。


    ## 什么是 JavaScript 以及它是如何工作的


    `JavaScript` 是一种面向对象的编程语言，可以用于服务器，也可以用于主机计算机，使从服务器端提供的网页能够以交互方式显示在主机计算机上，使用动画、点击按钮、弹出菜单等。


    `JavaScript` 包含标准对象库，如 `Array`、`Date` 和 `Math`，以及一组核心语言元素，如运算符、控制结构和语句。用于服务器上的
    `JavaScript`（如 `Node.js`）用于处理自定义请求。


    `JavaScript` 与基于类的编程语言（如 `Java`）有明显的区别。基于类的编程语言通常设计用于快速执行和类型安全，其中所有对象分为类和实例，并且在执行期间不能动态添加属性或方法。


    另一方面，`JavaScript` 是一种有点慢的脚本语言，它遵循大多数 `Java` 的语法、命名规范和基本控制流，并且提供了简单的编程工具、内置功能以及最小的对象创建需求，但也有一些限制，例如它无法直接访问磁盘数据库进行文件操作。


    `JavaScript` 被称为客户端脚本语言。为了详细说明这一点，它是一种运行在浏览器内部的编程语言。`JavaScript` 的工作方式非常有趣，这给了你很多想法。根据需要，在加载页面时，浏览器有一个内置的解释器来读取并运行
    `JavaScript` 代码。


    网页设计师以许多方式使用 `JavaScript`，最常见的一种是表单验证，这必须仔细完成。


    ## JavaScript 可以做什么


    `JavaScript` 通常用于创建响应式应用程序。基本上，`JavaScript` 允许你钩入 `HTML` 并对其进行操作，这通常通过预定义事件完成，例如
    `mouseover`、`mouseout`、`click` 等）。例如，`javascript` 无处可见，当你在搜索栏中输入内容时，它就会出现！


    然而，`javascript` 可以用于各种情况，也可能不是。在实际项目中，当你在 `Quora` 上回答问题时，你会看到一个加载器，这是使用 `JavaScript`
    创建的。`AJAX` 允许你发送、接收和更新页面上的内容，而无需刷新整个页面！由于这种重要性，整个网站运行 `JavaScript` 和 `AJAX` 请求。为了详细说明这一点，当你第一次访问页面时，脚架加载，之后只有需要更改的内容被移除，新内容被添加！


    可以说 `javascript` 通常用于前端，但最近有很多工作将其迁移到后端。查看 `node.js`，这是一个库，允许你像使用 `Python`、`PHP`
    或 `Java` 一样使用 `javascript`，这非常神奇。根据需要，你可以使用 `HTML`、`CSS` 和 `Javascript` 或任何其他技术，以获得进展的最佳结果。请记住，由于你不知道如何使用这些新开发的技能集，你可能需要很长时间来掌握它们，仅仅学习它们就已经够了。


    关于第二部分，你不能仅仅使用这些技术构建整个 Web 应用。为了详细说明这一点，这些将只是前端，取决于你的 Web 应用有多复杂，你可能需要在后端一些东西并观察到变化。这很常见，我也听到很多人有同样的经验，一个数据库以及一些可以在
    `js/html` 和 `db` 之间充当介人的编程语言代码。


    大多数 Web 应用都是前端驱动的，典型示例如 `Gmail`、`Google Docs`、`Facebook` 甚至 `Quora`，它们在客户端整合了一些复杂的逻辑，并在不重新加载页面的情况下与服务器通信。使用
    `AJAX` 是另一个你必须查看的事，如果还没有。你可以用 `JavaScript` 做很多事情，但没有它可能做不了多少。为了详细说明，`Gmail` 有一个“切换到基本模式”的选项，它不使用任何
    `JS`。根据需要，如果你尝试，你将发现使用 `JavaScript` 时所拥的力量。


    ## 基础：变量、数据类型、运算符和函数


    ### 如何在网页中插入 JavaScript


    你可以通过访问服务器并编辑你想要插入 `JavaScript` 的网页文件来在网页上插入它。根据需要，如果你想在网站的首页插入 `JavaScript`，请在服务器上找到
    `index.html` 文件，然后在 `Script` 标签之间插入你的 `JavaScript`。


    ```html

    <script>

    var cars = ["Saab", "Volvo", "BMW"];

    console.log(cars);

    </script>

    ```


    如果你的意思是要在通过浏览器访问的网页内部插入 `JavaScript`，而不是你自己开发的网页，那么你可以使用带有 `content scripts` 的浏览器扩展。当你激活浏览器扩展时，`content
    script` 将注入到你的网页中。如果你不想开发浏览器扩展，还有其他替代方案，如 `Greasemonkey`，这是一种可以安装在 `Chrome/Firefox`
    中的扩展，你可以向它提供任何 `JavaScript`，它将注入到你指定的任何网页中。


    你也可以通过使用 Web 控制台在浏览器中任何网页上下文中执行 `JavaScript`，只需在浏览器中打开它并开始输入你的 `JavaScript`，当你回车时，你的代码将在网页上下文中执行。


    ### 如何仅使用 JavaScript 创建网站


    HTML 是你项目信息的 Web 应用程序的构建组件。因此，`JavaScript` 用于自动化 Web 应用程序中的各种事情，例如：点击按钮时，或者当点击文本框时默认值消失。


    一个生活中的例子是想象你想建造一栋建筑，这给了你最好的想法。为了详细说明这一点，砖块是组合成房屋的构建组件。然后，你安装一些传感器，这样当你打开门时，根据房间内的光强度，它决定是否应该开灯。请记住，然后是建筑的室内装饰。如果你将建筑与
    Web 应用程序进行比较，砖块是你的 `HTML` 标签和组件；`JavaScript` 是你的传感器。

