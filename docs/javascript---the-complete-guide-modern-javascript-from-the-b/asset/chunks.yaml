  trans: "\n# JavaScript 中的字面量和常量\n\n## 字面量和常量\n\n在 JavaScript 中，术语“字面量”（literal）指的是一个值，而“常量”（constant）指的是一个变量。然而，这种术语可能会造成混淆，因为英语中“constant”（不变）的含义与编程中的含义不同。\n\
    \n例如：\n\n```javascript\nvar x = 2;\n```\n\n在这里，`x` 是一个变量，而 `2` 是一个字面量值。我们可以说 `x`\
    \ 是常量吗？在英语中，我们可能会称 `2` 为常量，因为它不会改变。但在编程中，常量是用 `const` 声明的变量。\n\n使用 ES6：\n\n```javascript\n\
    const x = 2;\n```\n\n现在 `x` 在编程意义上是一个常量，而 `2` 仍然是字面量。字面量也可以是字符串、数组或对象。\n\n## 变量声明\n\
    \n在 JavaScript 中声明变量最常用的方式是使用 `var`：\n\n```javascript\nvar variableNameHere =\
    \ someValueHere;\n```\n\n与 Java 或 C# 等语言不同，JavaScript 不需要类型声明。例如，在 Java 中你可以这样写：\n\
    \n```java\nString myString = \"Hello World\";\nint myNumber = 1337;\nint[] myList\
    \ = {1, 2, 3, 4};\n```\n\n在 JavaScript 中，你只需使用 `var`：\n\n```javascript\nvar myString\
    \ = \"Hello World\";\nvar myNumber = 1337;\nvar myList = [1, 2, 3, 4];\n```\n\n\
    然后你可以使用这些变量进行计算或输出：\n\n```javascript\nvar yearOfBirth = 1998;\nvar currentYear\
    \ = 2017;\nvar age = currentYear - yearOfBirth;\n```\n\n```javascript\nvar favoriteFood\
    \ = \"pizza\";\nalert(\"My favorite food is \" + favoriteFood);\n```\n\n## `var`、`let`\
    \ 和 `const` 的区别\n\nJavaScript 提供了三种声明变量的方式：`var`、`let` 和 `const`。它们在作用域和可变性方面有所不同。\n\
    \n- `var` 是函数作用域的。\n- `let` 是块作用域的。\n- `const` 是块作用域的且不可变（绑定不能被重新赋值）。\n\n一个常见的陷阱是在循环中使用\
    \ `var` 配合异步代码，如函数 `foo` 所示：\n\n```javascript\nfunction foo() {\n  for (var i\
    \ = 0; i < 5; i++) {\n    setTimeout(function () {\n      console.log(i);\n  \
    \  }, 10);\n  }\n}\n```\n\n在这种情况下，所有的 setTimeout 都会打印 `5`，因为 `var` 是函数作用域的。\n\n\
    使用 `let` 可以避免这个问题，如函数 `bar` 所示：\n\n```javascript\nfunction bar() {\n  for (let\
    \ i = 0; i < 5; i++) {\n    setTimeout(function () {\n      console.log(i);\n\
    \    }, 10);\n  }\n}\n```\n\n现在每个 setTimeout 都会打印自己对应的 `i` 值。\n\n## 什么是变量？\n\n\
    变量是内存中存储位置的一个名称。根据维基百科，JavaScript 中的变量没有类型绑定，任何值都可以存储在任何变量中。在上面的例子中，`digit` 是一个变量，指向存储数值\
    \ `12` 的内存位置。同样，`lang` 是一个变量，指向存储字符串值 `javascript` 的内存位置。变量只是存储值的内存位置的名称。\n\n\
    JavaScript 使用保留关键字 `var` 来声明变量。变量必须有一个唯一的名称。你可以在声明时或使用前使用赋值运算符（`=`）为变量赋值。\n\n\
    ## 语法\n\n声明变量：\n\n```javascript\nvar <variable-name>;\n```\n\n声明并初始化：\n\n```javascript\n\
    var <variable-name> = <value>;\n```\n\n## 示例\n\n### 基本声明\n\n```javascript\nvar\
    \ one = 1; // numeric value\nvar two = 'two'; // string value\nvar three; // no\
    \ value, defaults to undefined\n```\n\n在这个例子中，`one`、`two` 和 `three` 是变量名。\n\n\
    ### 在一行中声明多个变量\n\n```javascript\nvar one = 1, two = 'two', three;\n```\n\n###\
    \ 省略 `var` 关键字的变量\n\nJavaScript 允许对未声明的变量进行赋值，但你必须在那时赋值：\n\n```javascript\none\
    \ = 1;\ntwo = 'two';\n```\n\n注意：这会创建一个全局变量，通常不推荐这样做。\n\n"
