    * 动词表示你想要 Web 服务器执行的操作，这正是关键所在。根据本例的需求，动词是`GET`，它应该是自解释的，可能是也可能不是试探性的。因为为了深入了解，还有许多其他动词，其中最重要的是`POST`，用于向
