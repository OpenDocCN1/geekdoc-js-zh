  trans: "\n\n# JavaScript 调试\n\n## 使用 Console 方法\n\n- 如果一个过程花费了很长时间，可以使用 `console.time()`\
    \ 启动倒计时计时器，以便在断言进度时获得最佳结果。在对完美的追求下，在此背景下通过 `console.timeEnd()` 打印值可以让你获得执行特定函数所需的时间信息。\n\
    - 对于更棘手的性能问题，为了查找内存泄漏，可以使用 `console.memory` 来显示堆大小。\n- 对于反复出现的代码，可以使用 `console.count()`\
    \ 来查找脚本读取你代码的次数。\n- 如果你想在条件为假时记录一个值，可以使用 `console.assert(condition, msg)` 并观察其变化。然而，结合项目经验，在在使用\
    \ `NodeJS` 时，这可能会抛出断言错误（Assertion error）。\n- 打印的对象可以使用 `console.table()` 以整齐排列的表格格式进行显示。\n\
    - 最后，如果你的控制台中有很多日志，并且你想从一个干净的视图重新开始，可以使用 `console.clear()`。\n\n![image](img/rsrc2J2.jpg)\n\
    \n## 浏览器兼容性\n\n`JavaScript` 并不是跨浏览器兼容的。并非所有浏览器都对 `JavaScript` 有完全支持，早期的浏览器对某些非常常用的\
    \ `JS` 标签完全没有支持。在实际项目中，发现并调试跨浏览器兼容性问题是一项巨大的挑战。但请记住，在 `LambdaTest`，我们提供了一个包含 2000\
    \ 多种浏览器和操作系统组合的平台，每个组合都配备了强大的调试工具。它是发现和调试跨浏览器兼容性问题的完美平台，特别是在你没有原生访问权限的浏览器版本或操作系统上。我们还在移动浏览器上提供了调试工具，为你提供了调试移动\
    \ Web 问题的完美工具集。\n\n## 调试服务端 JavaScript\n\n使用 `Visual Studio Code` 和 `NodeJS`，在配置文件中我指定了脚本页面并排除了扫描的无用页面。我在代码中添加了断点。我点击左侧的调试选项卡，以便从各个方面确保目的实现。根据需要，我右键点击我想要“观察”（watch）的变量。我还在代码中添加了\
    \ `console.log()`。我编写了自己的模块来从我的代码中写入日志。然后，我逐步调试，并重启以从各个方面确保目的实现。\n\n我不使用环境变量。我不使用\
    \ `dotenv` 包，因为我倾向于总是回到代码中，永远忘记参数是在代码的哪里添加的。根据需要，我认为当你使用 `.env` 时，你不会回到代码中。根据需要，我也尝试保持尽可能少的包和文件。\n\
    \n我调试服务端 `JavaScript` (`NodeJS`) 的方法简单就是记录代码中由任何条件捕获的所有错误。在编写/调试代码时，最实用的命令就是直接执行这段代码，我只是为我的示例片段使用了\
    \ `nodemon`。在我看来，这比使用 `Chrome` 要好得多，因为为了调试服务端 `JavaScript` 使用 `Chrome` 非常消耗资源。\n\
    \n## 额外资源\n\n- 错误信息！无需恐慌！\n- 在 `VS Code` 直接调试代码\n- 调试 `JavaScript` - 概述\n- 查找帮助与使用\
    \ `MDN` 工作\n- 如何正确地“谷歌”\n- 使用 `Chrome Devtools` 和断点进行进阶调试\n- 在 Devtools 中直接测试代码更改\n\
    - `ECMAScript` 标准\n- 使用 `console.log()` 观察“代码内部”\n- 利用不同的 `IDE` 视图\n- 使用控制结构工作\n\
    - `JavaScript` 中所有的循环结构是什么\n\n## JavaScript 中的循环\n\n`JavaScript` 循环用于按指定的次数执行相同的代码块，或者在指定的条件为真时持续执行。\n\
    \n### For 循环\n\n当你预先脚本应该运行多少次时，使用 for 循环。\n\n**语法**\n\n```javascript\nfor (var=startvalue;\
    \ var<=endvalue; var=var+increment) {\n    // 要执行的代码\n}\n```\n\n**示例**\n\n```html\n\
    <html>\n<body>\n<script type=\"text/javascript\">\nvar i=0;\nfor (i=0; i<=10;\
    \ i++) {\n    document.write(\"The number is \" + i);\n    document.write(\"<br\
    \ />\");\n}\n</script>\n</body>\n</html>\n```\n\n### While 循环\n\n当你希望循环在指定的条件为真时执行并继续执行时，使用\
    \ while 循环。\n\n**语法**\n\n```javascript\nwhile (var<=endvalue) {\n    // 要执行的代码\n\
    }\n```\n\n**示例**\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\"\
    >\nvar i=0;\nwhile (i<=10) {\n    document.write(\"The number is \" + i);\n  \
    \  document.write(\"<br />\");\n    i=i+1;\n}\n</script>\n</body>\n</html>\n```\n\
    \n**结果**\n\n```\nThe number is 0\nThe number is 1\nThe number is 2\nThe number\
    \ is 3\nThe number is 4\nThe number is 5\nThe number is 6\nThe number is 7\nThe\
    \ number is 8\nThe number is 9\nThe number is 10\n```\n\n### do...while 循环\n\n\
    do...while 循环是 while 循环的变体，但在项目中使用时要小心。此循环始终会执行一次代码块，然后只要指定的条件为真，它就会重复循环。即使条件为假，该循环也会执行一次，因为代码是在测试条件之前执行的。\n\
    \n**语法**\n\n```javascript\ndo {\n    // 要执行的代码\n} while (var<=endvalue);\n```\n\
    \n**示例**\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar i=0;\n\
    do {\n    document.write(\"The number is \" + i);\n    document.write(\"<br />\"\
    );\n    i=i+1;\n} while (i<0);\n</script>\n</body>\n</html>\n```\n\n**结果**\n\n\
    ```\nThe number is 0\n```\n\n### Break 和 Continue\n\n循环内部可以使用两个特殊语句：`break` 和\
    \ `continue`。\n\n#### Break\n\n`break` 命令将终止循环并继续执行循环之后的代码（如果有的话）。\n\n**示例**\n\
    \n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar i=0;\nfor (i=0;\
    \ i<=10; i++) {\n    if (i==3){break}\n    document.write(\"The number is \" +\
    \ i);\n    document.write(\"<br />\");\n}\n</script>\n</body>\n</html>\n```\n\n\
    **结果**\n\n```\nThe number is 0\nThe number is 1\nThe number is 2\n```\n\n####\
    \ Continue\n\n`continue` 命令将跳过当前循环并处理下一个值继续。\n\n**示例**\n\n```html\n<html>\n<body>\n\
    <script type=\"text/javascript\">\nvar i=0;\nfor (i=0; i<=10; i++) {\n    if (i==3){continue}\n\
    \    document.write(\"The number is \" + i);\n    document.write(\"<br />\");\n\
    }\n</script>\n</body>\n</html>\n```\n\n**结果**\n\n```\nThe number is 0\nThe number\
    \ is 1\nThe number is 2\nThe number is 4\nThe number is 5\nThe number is 6\nThe\
    \ number is 7\nThe number is 8\nThe number is 9\nThe number is 10\n```\n\n"
- fmt: "\n# `for...in` Statement\n\n## Overview\nDepending on necessity, the `for...in`\
    \ statement is used to loop (iterate) through the elements of an array or through\
    \ the properties of an `object`. The `variable` argument can be a named variable,\
    \ an array element, or a property of an `object`.\n\n## Syntax\n```javascript\n\
    for (variable in object) {\n    // code to be executed\n}\n```\n\n## Example\n\
    Using `for...in` to loop through an array:\n\n```html\n<html>\n<body>\n<script\
    \ type=\"text/javascript\">\nvar x\nvar mycars = new Array()\nmycars[0] = \"Saab\"\
    \nmycars[1] = \"Volvo\"\nmycars[2] = \"BMW\"\nfor (x in mycars)\n{\ndocument.write(mycars[x]\
    \ + \"<br />\")\n}\n</script>\n</body>\n</html>\n```\n"
