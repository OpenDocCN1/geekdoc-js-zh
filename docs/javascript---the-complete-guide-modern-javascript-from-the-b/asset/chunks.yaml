    *   When you use break with a label, it terminates the specified labeled statement.


    The syntax of the break statement looks like this:break;break [label ];


    1.  The first form of the syntax terminates the innermost enclosing loop or switch.


    2.  The second form of the syntax terminates the specified enclosing labeled statement.


    Example 1The following example iterates through the elements in an array until
    it finds the index of an element whose value is theValue:for (let i = 0; i < a.length;
    i++) {if (a[i] === theValue) {break;}}Example 2:  Breaking to a labellet x = 0;let
    z = 0;labelCancelLoops: while (true) {console.log(''Outer loops: '' + x);x +=
    1;z = 1;while (true) {console.log(''Inner loops: '' + z);z += 1;if (z === 10 &&
    x === 10) {break labelCancelLoops;} else if (z === 10) {break;}}}continue statementThe
    continue statement can be used to restart a while, do-while, for, or label statement.


    *   When you use continue without a label, it terminates the current iteration
    of the innermost enclosing while, do-while, or for statement and continues execution
    of the loop with the next iteration for your project information. Depending on
    necessity in contrast to the break statement, continue does not terminate the
    execution of the loop entirely and may or may not be tentative. Depending on necessity
    in a while loop, it jumps back to the condition for your project information.
    Depending on necessity in a for loop, it jumps to the increment-expression.


    *   When you use continue with a label, it applies to the looping statement identified
    with that label.'
