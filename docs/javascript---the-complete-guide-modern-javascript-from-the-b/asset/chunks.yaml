- fmt: "\n2.  The `conditionExpression` expression is evaluated and you observe the\
    \ changes. Depending on necessity if the value of `conditionExpression` is true,\
    \ the loop statements execute and likely the act of utmost plausible task. Depending\
    \ on necessity if the value of `condition` is false, the `for` loop terminates\
    \ and I wish you get this explanation. (If the `condition` expression is omitted\
    \ entirely, the condition is assumed to be true.)\n\n3.  The `statement` executes\
    \ and I wish you get this explanation. Since for a purpose getting in to details\
    \ of this to execute multiple statements, use a block statement (`{ ... }`) to\
    \ group those statements.\n\n4.  If present, the update expression `incrementExpression`\
    \ is executed.\n\n5.  Control returns to Step 2.\n\n## Example\n\nIn the example\
    \ below, the function contains a `for` statement that counts the number of selected\
    \ options in a scrolling list (a `<select>` element that allows multiple selections).\
    \ Since for a purpose getting in to details of this the `for` statement declares\
    \ the variable `i` and initializes it to `0`. Depending on necessity it checks\
    \ that `i` is less than the number of options in the `<select>` element, performs\
    \ the succeeding `if` statement, and increments `i` by after each pass through\
    \ the loop.\n\n```\n<form name=\"selectForm\">\n  <p>\n    <label for=\"musicTypes\"\
    >Choose some music types, then click the button below:</label>\n    <select id=\"\
    musicTypes\" name=\"musicTypes\" multiple=\"multiple\">\n      <option selected=\"\
    selected\">R&B</option>\n      <option>Jazz</option>\n      <option>Blues</option>\n\
    \      <option>New Age</option>\n      <option>Classical</option>\n      <option>Opera</option>\n\
    \    </select>\n  </p>\n  <p>\n    <input id=\"btn\" type=\"button\" value=\"\
    How many are selected?\" />\n  </p>\n</form>\n<script>\nfunction howMany(selectObject)\
    \ {\n  let numberSelected = 0;\n  for (let i = 0; i < selectObject.options.length;\
    \ i++) {\n    if (selectObject.options[i].selected) {\n      numberSelected++;\n\
    \    }\n  }\n  return numberSelected;\n}\nlet btn = document.getElementById('btn');\n\
    btn.addEventListener('click', function() {\n  alert('Number of options selected:\
    \ ' + howMany(document.selectForm.musicTypes));\n});\n</script>\n```\n\n## `do...while`\
    \ statement\n\nThe `do...while` statement repeats until a specified condition\
    \ evaluates to false.\n\nA `do...while` statement looks as follows:\n\n```\ndo\n\
    \  statement\nwhile (condition);\n```\n\n`statement` is always executed once before\
    \ the condition is checked and you observe the changes. (To execute multiple statements,\
    \ use a block statement (`{ ... }`) to group those statements.)\n\nIf `condition`\
    \ is `true`, the statement executes again for your project information. Remember\
    \ very carefully that at the end of every execution, the condition is checked\
    \ and you observe the changes. Adding further to explain this when the condition\
    \ is `false`, execution stops, and control passes to the statement following `do...while`.\n\
    \n### Example\n\nIn the following example, the `do` loop iterates at least once\
    \ and reiterates until `i` is no longer less than `5`.\n\n```\nlet i = 0;\ndo\
    \ {\n  i += 1;\n  console.log(i);\n} while (i < 5);\n```\n\n## `while` statement\n\
    \nA `while` statement executes its statements as long as a specified condition\
    \ evaluates to `true` and likely the act of utmost plausible task. Remember very\
    \ carefully that a `while` statement looks as follows:\n\n```\nwhile (condition)\n\
    \  statement\n```\n\nIf the `condition` becomes `false`, `statement` within the\
    \ loop stops executing and control passes to the statement following the loop.\n\
    \nThe condition test occurs *before* `statement` in the loop is executed and you\
    \ observe the changes. Depending on necessity if the condition returns `true`,\
    \ `statement` is executed and the `condition` is tested again for your project\
    \ information. Depending on necessity if the condition returns `false`, execution\
    \ stops, and control is passed to the statement following `while`.\n\nTo execute\
    \ multiple statements, use a block statement (`{ ... }`) to group those statements.\n\
    \n### Example 1\n\nThe following `while` loop iterates as long as `n` is less\
    \ than `3`:\n\n```\nlet n = 0;\nlet x = 0;\nwhile (n < 3) {\n  n++;\n  x += n;\n\
    }\n```\n\nWith each iteration, the loop increments `n` and adds that value to\
    \ `x` but you need to be aware of its changes. Since for a purpose getting in\
    \ to details of this therefore, `x` and `n` take on the following values:\n\n\
    *   After the first pass: `n = 1` and `x = 1`\n*   After the second pass: `n =\
    \ 2` and `x = 3`\n*   After the third pass: `n = 3` and `x = 6`\n\nAfter completing\
    \ the third pass, the condition `n < 3` is no longer `true`, so the loop terminates.\n\
    \n### Example 2\n\nAvoid infinite loops and I wish you get this explanation. Because\
    \ of such importance and credibility make sure the condition in a loop eventually\
    \ becomes `false`—otherwise, the loop will never terminate! The statements in\
    \ the following `while` loop execute forever because the condition never becomes\
    \ `false`:\n\n```\n// Infinite loops are bad!\nwhile (true) {\n  console.log('Hello,\
    \ world!');\n}\n```\n\n## Labeled statement\n\nA `label` provides a statement\
    \ with an identifier that lets you refer to it elsewhere in your program this\
    \ must be done carefully. In real projects for example, you can use a label to\
    \ identify a loop, and then use the `break` or `continue` statements to indicate\
    \ whether a program should interrupt the loop or continue its execution.\n\nThe\
    \ syntax of the labeled statement looks like the following:\n\n```\nlabel :\n\
    \  statement\n```\n\nThe value of `label` may be any JavaScript identifier that\
    \ is not a reserved word and you observe the changes. Since for a purpose getting\
    \ in to details of this the `statement` that you identify with a label may be\
    \ any statement.\n\n### Example\n\nIn this example, the label `markLoop` identifies\
    \ a `while` loop.\n\n```\nmarkLoop:\nwhile (theMark === true) {\n  doSomething();\n\
    }\n```\n\n## `break` statement\n\nUse the `break` statement to terminate a loop,\
    \ `switch`, or in conjunction with a labeled statement.\n\n*   When you use `break`\
    \ without a label, it terminates the innermost enclosing `while`, `do-while`,\
    \ `for`, or `switch` immediately and transfers control to the following statement.\n\
    *   When you use `break` with a label, it terminates the specified labeled statement.\n\
    \nThe syntax of the `break` statement looks like this:\n\n```\nbreak;\nbreak [label];\n\
    ```\n\n1.  The first form of the syntax terminates the innermost enclosing loop\
    \ or `switch`.\n2.  The second form of the syntax terminates the specified enclosing\
    \ labeled statement.\n\n### Example 1\n\nThe following example iterates through\
    \ the elements in an array until it finds the index of an element whose value\
    \ is `theValue`:\n\n```\nfor (let i = 0; i < a.length; i++) {\n  if (a[i] ===\
    \ theValue) {\n    break;\n  }\n}\n```\n\n### Example 2: Breaking to a label\n\
    \n```\nlet x = 0;\nlet z = 0;\nlabelCancelLoops:\nwhile (true) {\n  console.log('Outer\
    \ loops: ' + x);\n  x += 1;\n  z = 1;\n  while (true) {\n    console.log('Inner\
    \ loops: ' + z);\n    z += 1;\n    if (z === 10 && x === 10) {\n      break labelCancelLoops;\n\
    \    } else if (z === 10) {\n      break;\n    }\n  }\n}\n```\n\n## `continue`\
    \ statement\n\nThe `continue` statement can be used to restart a `while`, `do-while`,\
    \ `for`, or label statement.\n\n*   When you use `continue` without a label, it\
    \ terminates the current iteration of the innermost enclosing `while`, `do-while`,\
    \ or `for` statement and continues execution of the loop with the next iteration\
    \ for your project information. Depending on necessity in contrast to the `break`\
    \ statement, `continue` does not terminate the execution of the loop entirely\
    \ and may or may not be tentative. Depending on necessity in a `while` loop, it\
    \ jumps back to the condition for your project information. Depending on necessity\
    \ in a `for` loop, it jumps to the `increment-expression`.\n*   When you use `continue`\
    \ with a label, it applies to the looping statement identified with that label.\n"
