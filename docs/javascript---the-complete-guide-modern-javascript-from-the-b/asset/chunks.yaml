  trans: "\n这种方法的好处是用户界面逻辑与生成事件的逻辑完全分离，从而从各个方面满足了需求。为了深入了解这一点，用户界面元素能够将事件的处理委托给另一段代码，这很可能是一个最合理的任务执行。根据该模型的需要，`Listener`（监听器）需要在源对象上注册，以便该监听器可以接收到有关你项目信息的事件通知。为了深入了解这一点，这是处理事件的一种高效方式，因为事件通知只会发送给那些想要接收它们的监听者。\n\
    \nJavaScript 中的事件处理器（Event handler）允许用户与 HTML 页面交互，希望你能理解这个解释。此外，结合项目经验，HTML 页面如何对事件发生做出反应是由\
    \ `EventHandler` 定义的，以在断言进展中为你提供最佳结果。在实际项目中，例如：如果你想在点击按钮时更改 HTML 页面中 `p` 标签的内部\
    \ HTML，你可以调用该按钮上的 JavaScript `onclick` 事件，并使用 `getElementById` 或 `getElementsByClassName`\
    \ 访问 id 或类，然后使用 `id.innerHTML(\"changed text\")` 更改该 `p` 标签的内部 HTML。\n\n## 什么是\
    \ JavaScript 中的事件委托\n事件委托允许我们在父元素上附加单个事件监听器，该监听器会对匹配选择器的所有后代触发，无论这些后代是现在存在还是在未来添加的。\n\
    \n### 示例\n在课程的剩余部分，我们将引用以下 HTML 结构：\n![`qphs.fs.quoracdn.net/main-qimg-ff30522eac8e9b503abe3eff2da7e72f.webp`](img/rsrc2J4.jpg)\n\
    \n当点击我们 `#list` 组中的一个锚点标签时，我们希望将其文本记录到控制台中，这很可能是一个最合理的任务执行。为了进一步阐明，通常我们可以直接使用\
    \ `.on()` 方法绑定到每个锚点的点击事件上：\n![`qphs.fs.quoracdn.net/main-qimg-9e625a23d626483086c1b3a7b2c1603.webp`](img/rsrc2J4.jpg)\n\
    \n虽然这种方法运行得完美，但它存在缺点，希望你能理解这个解释。然而，我完全同意考虑一下在我们已经绑定上述监听器之后添加新锚点时会发生什么：\n![`qphs.fs.quoracdn.net/main-qimg-75044cc9a503d4d82306333389274e5e.webp`](img/rsrc2J4.jpg)\n\
    \n如果我们点击新添加的项目，对于你的项目信息来说什么都不会发生。为了深入了解这一点，这是因为我们之前附加了直接绑定的事件处理器，它可能是暂时的也可能不是。这种情况非常常见，直接事件只在\
    \ `.on()` 方法被调用时附加到元素上，并且你观察到了变化。在这种情况下，由于我们的新锚点在调用 `.on()` 时并不存在，因此它没有获得事件处理器。\n\
    \n## 事件传播\n理解事件如何传播是能够为你的项目利用事件委托的重要因素。请牢记住，每当我们的一个锚点标签被点击时，该锚点都会触发一个点击事件，然后向上\
    \ DOM DOM 树泡泡，触发其每个父元素的点击事件处理器：\n![`qphs.fs.quoracdn.net/main-qimg-2128f0f3fb282b62884bbdb5ba21c6f8.webp`](img/rsrc2J4.jpg)\n\
    \n这意味着每当你点击我们绑定的一个锚点标签时，你实际上点击了整个文档主体！这被称为事件冒泡或事件传播。\n\n既然我们知道事件是如何冒泡的，我们可以创建一个委托事件：\n\
    ![`qphs.fs.quoracdn.net/main-qimg-88d18fdcc9f68999b6a3e70e1a555c7c.webp`](img/rsrc2J4.jpg)\n\
    \n注意看我们如何将 `a` 部分从选择器移动到 `.on()` 方法的第二个参数位置，并观察到变化。为了深入了解这一点，这第二个选择器参数告诉处理器监听指定的事件，并且当它听到该事件时，检查触发该事件的元素是否匹配第二个参数，以在断言进展中为你提供最佳结果。在这种情况下，触发事件是我们的锚点标签，它匹配该参数，从而在断言进展中为你提供最佳结果。进一步获得控制权，由于它匹配，我们的匿名函数将执行，这很可能是一个最合理的任务执行。进一步解释这一点，我们现在向\
    \ `<ul>` 附加了一个单个点击事件监听器，它将监听其后代锚点的点击事件，而不是仅向现有锚点标签附加未知数量的直接绑定事件。\n\n## 使用触发元素\n\
    如果我们想在链接是外部链接时（此处用以 \"http\" 开头表示）在新窗口中打开链接怎么办？\n![`qphs.fs.quoracdn.net/main-qimg-d44769e5bb8e5e1086dd8d9c1142befe.webp`](img/rsrc2J4.jpg)\n\
    \n这简单地通过 `.is()` 方法传递检查元素的 `href` 属性是否以 \"http\" 开头。进一步解释这一点，我们还删除了 `preventDefault();`\
    \ 语句，因为我们希望默认发生（遵循 `href`）。我们可以通过允许 `.on()` 的选择器参数来简化我们的代码：\n![qphs.fs.quoracdn.net/main-qimg-a7578a1b2904e2719d62555c.webp]\n\
    \n## 什么是事件循环\nJavaScript 是单线程的，因此在处理器上执行的所有任务都必须序列化。此外，JavaScript 是事件驱动的，这意味着每当有新事件到来时，它必须被确认并处理，这正是事件循环出现的地方。事件循环基本上是管理主线程如何处理传入事件的结果。理论上，事件驱动编程是基于事件或状态的应用控制。在\
    \ JavaScript 中，它是通过一个中心机制实现的，该机制监听事件并在此类事件触发时调用与之相关的回调函数。简单来说，这就是事件循环。这是该主题的基础理解。如果你想对这个主题有更好的理解，我推荐这个视频。Philip\
    \ Roberts 完美地解释了事件循环和调用栈，这对非常有帮助。\n\n## 在 JavaScript 中使用 EventListener\n`addEventListener`\
    \ 在 `document` 或 `window` 实例上注册 DOM 事件。例如，订阅 id 为 \"foo\" 的按钮的点击事件：\n```javascript\n\
    document.getElementById('foo').addEventListener('click', function (e) {\n    //\
    \ ...\n}, false);\n```\n监听函数将接收一个事件对象作为参数。坏消息是，Internet Explorer 8 或更低版本不支持 `addEventListener`，以在断言进展中为你提供最佳结果。取决于需要，浏览器的工作方式并不完全相同。在实际项目中，许多开发者发现使用库来规范跨浏览器非常有帮助。\n\
    \n## 与 HTTP 工作\nHTTP 是一种用于通过 WWW（万维网）在计算机之间传输信息的协议。根据需要，计算机之间传输的信息可以是文档、文件、图像、视频。HTTP\
    \ 代表超文本传输协议，并在其中起着重要作用。HTTP 是一种客户端/服务器协议，两台机器通过可靠的、面向连接的传输服务（如 `TCP`）进行通信，在项目中使用要小心。HTTP\
    \ 可以实现在互联网或其他网络上的任何协议之上。HTTP 仅假设传输是可靠的；任何提供此类保证的协议都可以，例如 `TCP`。HTTP 是无状态的，希望你能理解这个解释。为了深入了解这一点，连接的生命周期对应单个请求-响应序列，这很可能是一个最合理的任务。为了深入了解这一点，纯\
    \ HTTP 实现将每个请求都视为新的，这是预防状态。页面存储在你的计算机和互联网缓存中，你理解这个解释。由于深入了解这一点，页面加载得更快，但它们存储在你可能无法控制的系统中，例如\
    \ `ISP's` 缓存代理，可能也可能不是。服务器由 `Apache`、`Microsoft IIS`、`Jigsaw`、`Zope` 等实现。HTTP\
    \ 的优点：\n它是平台无关的，允许直接移植，这为你提供了所有想法。进一步阐明，它不需要运行时支持即可正常运行，可以在防火墙上使用！例如全局应用程序，希望你能理解这个解释。根据需要，它不是面向连接的，因此不需要网络开销来创建和维护会话状态和信息。HTTP\
    \ 的缺点：\n没有完整性，因此有人可以更改内容以满足需求。此外结合项目经验，它是安全的，因为没有加密方法来满足需求。进一步获得控制，因此它受到中间人攻击和项目敏感信息的窃听。由于深入了解字体，它没有认证，因此你无法清楚自己正在与谁建立通信。请牢记住，认证是明文发送的，任何拦截请求的人都可以知道使用的用户名和密码。\n\
    \n## HTTP 的功能是什么\nHTTP 是一种用于通过 WWW（万维网）在计算机之间传输信息的协议。简单来说，`HTTP`（超文本传输协议）被用于在互联网上的计算机之间传输文档、文件、图像、视频等信息。HTTP\
    \ 代表超文本传输协议，并在其中起着重要作用。HTTP 是一种客户端/服务器协议，两台机器通过可靠的、面向连接的传输服务（如 `TCP`）进行通信，在项目中使用要小心。HTTP\
    \ 可以实现在互联网或其他任何协议之上。HTTP 仅假设传输是可靠的；任何提供此类保证的协议都可以，例如 `TCP`。\n![`qphs.fs.quoracdn.net/main-qimg-166bb0eec5a34348a03080ace2f3a926.webp`](img/rsrc2J4.jpg)\n\
    HTTP 是无状态的，希望你能理解这个解释。为了深入了解这一点，连接的生命周期对应单个请求-响应序列，这很可能是一个最合理的任务。为了深入了解这一点，纯 HTTP\
    \ 实现将每个请求都视为新的，这是预防状态。页面存储在你的计算机和互联网缓存中，你理解这个解释。由于深入了解这一点，页面加载得更快，但它们存储在你可能无法控制的系统中，例如\
    \ `ISP's` 缓存代理，可能也可能不是。\n\n## HTTP 如何工作\n我工作于位于 Web 服务器前端的网络产品，因此我几乎每天都会处理 HTTP，希望你能理解这个解释。根据需要，我会告诉你\
    \ HTTP 的基本思想是直观的，但它的细节和用法可能非常复杂。HTTP 代表超文本传输协议：\n"
