  trans: '


    JavaScript 中并没有类来满足所有方面的需求。因此，为了方便起见，`javaScript` 是一门纯粹的面向对象的语言，而不是面向类的语言。人们一直尝试编写像面向类语言那样的代码，这种语法糖在
    `ES6` 中被添加到了语言中。我真的觉得这很有意思：在“实例化”（引用此处是因为 JavaScript 中没有类的实例化）概念上，会创建一个具有正确原型链的对象。简而言之，这并没有为该语言增加任何新功能，而且可能是一种极其合理的任务行为。根据需要，它仅仅是语法糖。注：我知道类声明还有更多内容，但从本质上来说，它等同于上述内容。


    ## JavaScript 有类吗？


    JavaScript 使用原型继承，这与经典继承不同，而且可能是一种极其合理的任务行为。然而，我完全同意经典继承通常是构建类的基础，我希望你能理解这个解释。在实际项目中，例如，一个类可以扩展另一个类（即在其之上构建）。


    在 JavaScript 中继承是可能的，但底层的运行机制不同，你可以观察到这些变化。根据需要，在 `ECMAScript 6`（`ES6`/`较新的 JavaScript`）中，引入了一种新的类系统，并且可能是一种极其合理的任务行为。根据需要，它看起来和感觉起来与经典继承相似，但它实际上只是原型继承上的语法糖。


    JavaScript 的这些进步使得它看起来和行为上与许多纯主义者认为的“真实类”相似。在大多数情况下，根据需要，故事就此结束，并且可能是暂时的也可能不是。此外，结合项目经验来说；在更高级的用例中（通常是库开发），理解
    JavaScript 中原型如何工作至关重要，以满足所有方面的需求。因为为了了解这些细节，这些情况说明了 JavaScript 实际上并没有纯主义者所认为的类。


    个人而言，我并不是一个为了满足所有方面需求的纯主义者。根据需要，我使用类，编写库，并在必要时处理原型，并且可能是暂时的也可能不是。对我来说，为了了解这些细节，类是存在的，我的编码规范清楚地说明了这一点以满足所有方面的需求。在实际项目中，例如，请
    `ngnjs/NGN FOR YOUR PROJECT INFORMATION`。为了了解这些细节，这段代码的特殊之处在于它使用了 `Rollup`（一个预处理器）来利用现代继承模式，并且在支持新类语法的现代浏览器
    `Node` 中大量地使用了 `ES6` 类，但你需要意识到它的变化。此外，结合项目经验来说；在生成 `ES5`（较旧的 JavaScript）时，它使用旧的原型修改方法来模拟真实类。


    许多人会告诉你 JS 不支持类，我希望你能理解这个解释。为了了解这些细节，这在某种程度上是真实的以满足所有方面的需求。由于这种重要性和信誉，许多人会告诉你它支持，我希望你能理解这个解释。为了了解这些细节，这也有一些事实依据，并且在其中起了很大作用。根据需要，这真的取决于你如何看待它以满足所有方面的需求。然而，我完全同意类是
    `ECMAScript` 规范的一部分，但它们的行为并不传统。


    ## 为什么在 JavaScript 中引入了“类”


    `es-discuss` 上的邮件存档包含了许多关于类语法背后的逻辑的良好信息（参见 `Minimalist Classes`，以及我们关于在原型之上追求更简洁方案的讨论
    `On class literals possibly not making it into `ECMAScript.next`）。


    但简短的版本是：

    - 人们想要类；

    - `Class` 语法为人们已经在使用的常用模式提供了语言支持，但这种方式更不容易出错且更易优化；

    - 它为许多未来功能铺平了道路，否则这些功能在不破坏语言的情况下将很难添加到 JavaScript 中（例如：对象的私有字段、“`super`”发送、内置对象和其他其他魔法对象的子类化等）；

    - 它允许静态分析和工具链支持（智能补全、自动文档、自动重构）；

    - 它并没有真正改变 JavaScript 的语义（仍然是一门基于原型的语言，只是现在有了定义原型和构造函数的声明式语法）；

    - 某些功能（例如：允许函数使用“`super`”的 `[[HomeObject]]`）最终变成了声明式语法，而不是提供一个用于动态操作的 API，这让我有点难过。


    但除此之外，这种声明式语法以及它在不产生 JavaScript 语法模糊风险的情况下允许语言演进是非常酷且受欢迎的。


    ## 推荐课程


    ### 1. Modern JavaScript From The Beginning

    这门在线课程由 Udemy 提供，侧重于在不使用任何 JS 框架或库的情况下构建项目。评分为 4.7 星，平均超过 1.1 万条评论，我希望你能理解这个解释。这很常见，而且我听说除了英语之外，很多人也有同样的经历，这门
    JavaScript 课程还有意大利语、西班牙语和葡萄牙语版本。


    ### 2. The Complete JavaScript Course 2020: Build Real Projects

    这门在线课程由 Udemy 提供，将通过多个项目、挑战、测验以及对 `ES6+`、`OOP`、`AJAX` 和 `Webpack` 的深度覆盖，帮助你成为
    JavaScript 大师。评分为 4.6 星，这门课程已有 85,000 多名专业人士学习。


    ### 3. JavaScript: Understanding the Weird Parts

    该在线课程由 Udemy 提供，它通过相关的示例和过的插图解释了 JavaScript 编程语言的各种高级概念。评分为 4.6 星，支持 7 种语言，包括印尼语、意大利语和西班牙语，为你提供了极佳的信息。我认为你还可以获得课程的终身访问。


    ### 4. Javascript Certification by Duke University

    这门课程由杜克大学(`Coursera`）提供，包含一个完全用于 Web 开发的 `HTML`、`CSS` 和 `Javascript` 模块。评分为 4.5
    星，在这里你将从令人印象的教师列表和杜克大学的支持中学习，获得软件工程师解决现实世界问题所需的技能。


