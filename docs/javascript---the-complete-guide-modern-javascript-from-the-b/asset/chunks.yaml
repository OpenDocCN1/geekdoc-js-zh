    (Object Literal)


    `var obj = {};` 这是一个基础的空对象；但有多种方法：使用 `new` 关键字


    ```

    1.  var obj = new Object();

    2.  obj.name = ''john doe'';

    3.  obj.phone = ''8885551212'';

    ```


    在 JavaScript 中，变量都是对象。你也可以执行以下操作：对象字面量：


    ```

    1.  var obj = { ''name'': ''john doe'', ''phone'': ''8885551212'' };

    ```


    你也可以使用 `function` 关键字定义一种对象类型：


    ```javascript

    // 定义一个人类型对象

    1.  function person() {

    2.  name = ''john doe'';

    3.  phone = ''8885551212'';

    4.  }

    5.  // 然后你可以使用原型属性来

    6.  // 为 person 类型添加新属性：

    7.  // 我们正在构造一个 person 类型的对象

    8.  person.prototype.callme = function() {

    9.  return "Hey You";

    10.  };

    12.  var someone = new person();

    13.  使用 console:

    14.  console.log(someone.name);

    15.  输出: john doe

    16.  console.log(someone.callme());

    17.  输出: Hey You

    ```


    在 `person` 构造函数中，我们定义了这种人类型对象将有一个 `name` 和 `phone` 变量，以及可能执行的最合理的任务。这非常常见，我也听过很多人有同样的经历，当然，正如我们之前提到的，“变量是一个对象”。作为额外奖励：我们还可以考虑
