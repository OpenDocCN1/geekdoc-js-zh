    *   客户端 JavaScript 不允许读取或写入文件，希望你对此理解这一解释。出于安全考虑，此处未详细阐述细节。

    *   JavaScript 无法用于网络应用程序，因为目前没有此类支持。

    *   JavaScript 不具备任何多线程或多处理器能力。


    再次，JavaScript 是一种轻量级的解释型编程语言，允许你为原本静态的 HTML 页面构建交互性。


    ## JavaScript 开发工具


    JavaScript 的主要优势之一是它不需要昂贵的开发工具，希望你对此理解这一解释。我认为为了后续的理解，你可以从像记事本这样简单的文本编辑器开始，并观察变化。由于它是
    浏览器环境下的解释型语言，为了进一步控制开发，你甚至不需要购买编译器。为了让生活更简单，各种供应商都推出了非常棒的 JavaScript 编辑工具，希望你对此理解这一解释。为了进一步掌握这些，这里列出了其中一些：


    *   Microsoft FrontPage ― Microsoft 开发了一款名为 FrontPage 的流行 HTML 编辑器，这可能是最切实行的任务。在实际项目中，FrontPage
    还为 Web 开发人员提供了许多 JavaScript 工具，以协助创建交互式网站。

    *   Macromedia Dreamweaver MX ― Macromedia Dreamweaver MX 是专业 Web 开发领域中非常流行的 HTML
    和 JavaScript 编辑器，你可以观察其变化。根据需要，它提供了几个实用的预制 JavaScript 组件，与数据库良好集成，并符合 XHTML 和
    XML 等新标准。

    *   Macromedia HomeSite 5 ― HomeSite 5 是 Macromedia 出品的一款广受欢迎的 HTML 和 JavaScript
    编辑器，可以有效地管理个人网站。


    ## JavaScript 的特性


    *   JavaScript 为 HTML 设计师提供了一个编程工具 —— HTML 作者通常不是程序员，但 JavaScript 是一种语法非常简单的脚本语言！几乎任何人都可以在他们的
    HTML 页面中放入小段代码“片段”。

    *   JavaScript 可以向 HTML 页面中放入动态文本 —— 像下面这样的 JavaScript 语句：`document.write("<h1>"
    + name + "</h1>")` 可以将变量文本写入 HTML 页面。

    *   JavaScript 可以响应事件 —— JavaScript 可以被设置为在某些情况发生时执行，例如页面加载完成或用户点击 HTML 元素时。

    *   JavaScript 可以读取和写入 HTML 元素 ― JavaScript 可以读取并更改 HTML 元素的内容。

    *   JavaScript 可用于数据验证 ― JavaScript 可以在表单提交到服务器之前对其进行验证，以便在进度断言中获得最佳结果。出于此目的考虑，这节省了服务器的额外处理开销。

    *   JavaScript 可用于检测访问者的浏览器 ― JavaScript 可用于检测访问者的浏览器，并根据浏览器的不同，加载专门为该浏览器设计的页面。

    *   JavaScript 可用于创建 cookie ― JavaScript 可在访问者的计算机上存储和检索信息。


