  trans: "\n# JavaScript 循环与函数\n\n## `for` 循环\n\n### 基本的 `for` 循环\n\n```javascript\n\
    var i;\nfor (i = 0; i < 3; i = i + 1) {\n    console.log(i);\n}\n```\n\n输出：`0`、`1`、`2`。\n\
    \n`for` 语句有三个部分：\n\n1. **初始化**：初始化迭代变量 `i`。在本例中，`i` 被设置为 `0`。\n2. **条件**：只要条件为真，循环就会继续。在本例中，我们检查\
    \ `i` 是否小于 `3`。\n3. **增量**：每次迭代时递增迭代变量。在本例中，我们将 `i` 增加 `1`。\n\n### 更简短的写法\n\n\
    我们也可以使用 `++` 运算符来写更简短的写法：\n\n```javascript\nfor (var i = 0; i < 3; i++) {\n  \
    \  console.log(i);\n}\n```\n\n### 遍历数组\n\n要遍历数组：\n\n```javascript\nvar myArray\
    \ = [\"A\", \"B\", \"C\"];\nfor (var i = 0; i < myArray.length; i++) {\n    console.log(\"\
    The member of myArray in index \" + i + \" is \" + myArray[i]);\n}\n```\n\n输出：\n\
    \n```\nThe member of myArray in index 0 is A\nThe member of myArray in index 1\
    \ is B\nThe member of myArray in index 2 is C\n```\n\n我们使用数组的 `length` 属性来确定何时停止。\n\
    \n## `while` 循环\n\n`while` 语句是 `for` 语句的更简单版本。它检查表达式是否求值为 `true`，只要为 `true` 就继续运行。\n\
    \n示例：\n\n```javascript\nvar i = 99;\nwhile (i > 0) {\n    console.log(i + \" bottles\
    \ of beer on the wall\");\n    i -= 1;\n}\n```\n\n## 错误处理\n\n- 使用 `try-catch`\
    \ 进行错误处理 - 简介\n- 抛出自定义错误\n- 使用 `try-catch` 捕获并处理错误\n\n## 函数\n\n### 函数声明\n\n函数定义（也称为函数声明）由以下部分组成：\n\
    \n- `function` 关键字。\n- 函数的名字。\n- 用逗号分隔、括在括号中的参数列表。\n- 用大括号 `{...}` 括起来的 JavaScript\
    \ 语句。\n\n示例：\n\n```javascript\nfunction square(number) {\n    return number *\
    \ number;\n}\n```\n\n函数 `square` 接受一个参数 `number`，并返回该参数与自身的乘积。\n\n原始类型参数（如数字）按值传递给函数。如果函数更改了参数的值，这种更改不会在全局或调用函数中反映出来。\n\
    \n### 函数表达式\n\n函数也可以通过函数表达式来创建。这样的函数可以是无名的（没有名字）。\n\n示例：\n\n```javascript\nconst\
    \ square = function(number) {\n    return number * number;\n};\nvar x = square(4);\
    \ // x gets the value 16\n```\n\n可以为函数表达式提供一个名字，使函数能够引用自身，也便于在调试器的堆栈跟踪中识别。\n\n\
    ### 调用函数\n\n定义函数并不会执行它。调用函数会使用指定的参数执行相应的操作。\n\n示例：\n\n```javascript\nsquare(5);\n\
    ```\n\n调用 `square` 并传入参数 `5`。函数执行其语句并返回 `25`。\n\n### 函数作用域\n\n在函数内部定义的变量无法从函数外部访问。函数可以访问在其定义所在作用域中定义的所有变量和函数。\n\
    \n在全局作用域中定义的函数可以访问全局作用域中定义的所有变量。在另一个函数内部定义的函数也可以访问其父函数中定义的所有变量以及父函数所能访问的其他变量。\n\
    \n### 递归\n\n函数可以引用并调用自身。有三种方式：\n\n1. 函数的名字\n2. `arguments.callee`\n3. 一个指向函数的作用域内的变量\n\
    \n### 嵌套函数与闭包\n\n你可以在一个函数内部嵌套另一个函数。嵌套的（内部的）函数对其包含的（外部）函数是私有的。\n\n它也形成了一个闭包。闭包是一个表达式（通常是一个函数），它可以拥有自由变量以及绑定这些变量的环境。\n\
    \n由于嵌套函数是一个闭包，它可以继承其包含函数的参数和变量。内部函数包含外部函数的作用域。\n\n## JavaScript 中的 DOM\n\n###\
    \ 什么是 DOM\n\n在最基本的层面上，网站由 HTML 和 CSS 文档组成。浏览器生成文档的表示形式，称为文档对象模型（DOM）。该文档使 JavaScript\
