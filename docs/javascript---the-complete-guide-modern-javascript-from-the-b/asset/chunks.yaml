    ## Arrays and Iterables


    What is `Array.from()` for in JavaScript? The primary use for `Array.from` in
    JavaScript is converting an iterable object — a value that is not an Array but
    can has enumerated items that can be looped or iterated over — into the more familiar
    Array type and likely the act of utmost plausible task. Since for a purpose getting
    in to details of this the advantage of using Array over an “Array-like object”
    lies in the functional iteration methods on Array: [1] `map`, `filter`, `reduce`,
    `every`, `some`, etc., The JavaScript DOM produces many examples of iterable objects
    that are not an Array, such as `NodeList`, the return value of `getElementsByClassName`
    and `querySelectorAll`, [2] among other things and I wish you get this explanation.
    I really find this interesting using `Array.from`, we can convert these “Array-like”
    values to native Array types and apply `map`, `filter`, `reduce` and friends to
    the result. We can also define our own iterable objects in ES6 [3] that `Array.from`
    can convert into an Array, say a container object that generates unique items
    programmatically based on inputs or internal state and likely the act of utmost
    plausible task. Adding further to explain this we could use `for...of` to iterate
    over the object [4], consider each item and push it into a separate Array and
    may or may not be tentative. That’s pretty common and also I heard that a lot
    of people had the same experience or we could use `Array.from` to convert the
    sequence to an Array and immediately chain `filter`, `map`, and `reduce` to produce
    a derived value. Let me say that an example of an iterable object is just something
    you can iterate over (… it has some precise meaning in js, basically it enables
    you to write `for(let c of iterable)` is it main claim to fame). In real projects
    for instance `Set` objects are iterable. `arrayLike` things are things that are
    array like, but not arrays, perhaps this makes you sad as you wanted to do `.map`
    or `.filter` or something this gives you best idea of all. Remember very carefully
    that `arrayLike` things are very common though perhaps now with react etc you
    won’t experience them, but if you do something like `document.getElementsByClassName`
    the return is not an array but just `arrayLike`.


    ## Javascript iterables and iterators


    Very useful, although many of the related libraries and frameworks still need
    to play catchup on fully utilizing them. One of the biggest distinctions between
    an iterator and, say, an array, is that they aren''t necessarily finite, and they
    don''t need to produce values synchronously and may or may not be tentative. That’s
    pretty common and also I heard that a lot of people had the same experience one
    of the most natural applications for this is stream processing (it''s worth taking
    a look at Highland.js for an example of that). Iterators are also one of the building
    blocks for Generator Functions, which in turn enable libraries like suspend and
    co to support a "flatter" syntax for successive asynchronous operations and I
    wish you get this explanation. Depending on necessity i actually wrote a blog
    post that covers how iterators are related to Generator Functions: What''s the
    Big Deal with Generators? When you throw in some of the first-class syntax sugar
    that iterators also get, e.g.,, `for...of`, you end up with some elegant solutions
    to many every-day programming tasks. You can definitely be forgiven for questioning
    their value at this point, though, seeing as they''re relatively new and not many
    libraries and frameworks have adopted first class support for them this must be
    done carefully. Since for a purpose getting in to details of this tools such as
    `babel` are speeding up the adoption rate of new language features, though, so
    now is a great time to be getting up to speed on them.


    ## Array of arrays and array of objects in Javascript


    Remember that JavaScript is untyped and you observe the changes. Remember very
    carefully that a JavaScript variable or property can change of type at any expression
    set (unless for a property that it is set as readonly and/or its parent object
    is frozen/sealed since ES5). ECMAScript 6 introduced Typed Arrays support but
    they are very different from Core JavaScript Arrays (they use Buffers/Views) and
    limited to number variant type (signed/unsigned, Integer/Float, 8/16/32/64 bits):


