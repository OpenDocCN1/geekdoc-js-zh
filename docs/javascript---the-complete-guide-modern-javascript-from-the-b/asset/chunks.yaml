  trans: "\n`continue` 语句的语法如下：\n\n`continue [label ];`\n\n### 示例 1\n下面的示例展示了一个带有\
    \ `continue` 语句的 `while` 循环，该语句在 `i` 的值为 3 时执行。为了深入研究此问题的细节，`n` 取了 1, 3, 7 和 12\
    \ 的值。\n\n```javascript\nlet i = 0;\nlet n = 0;\nwhile (i < 5) {\n  i++;\n  if\
    \ (i === 3) {\n    continue;\n  }\n  n += i;\n  console.log(n);\n}\n// 1,3,7,12\n\
    \nlet i = 0;\nlet n = 0;\nwhile (i < 5) {\n  i++;\n  if (i === 3) {\n    // continue;\n\
    \  }\n  n += i;\n  console.log(n);\n}\n// 1,3,6,10,15\n```\n\n### 示例 2\n一个标记为\
    \ `checkiandj` 的语句包含一个标记为 `checkj` 的语句，具有良好的对象和作用域。根据需要，遇到 `continue` 会终止 `checkj`\
    \ 的当前迭代并开始下一次迭代。每当遇到 `continue`，`checkj` 都会迭代直到条件返回 `false`。当返回 `false` 时，`checkiandj`\
    \ 语句完成。如果 `continue` 带有 `checkiandj` 标签，程序将在 `checkiandj` 语句顶部继续。\n\n```javascript\n\
    let i = 0;\nlet j = 10;\ncheckiandj: while (i < 4) {\n  console.log(i);\n  i +=\
    \ 1;\n  checkj: while (j > 4) {\n    console.log(j);\n    j -= 1;\n    if ((j\
    \ % 2) === 0) {\n      continue checkj;\n    }\n    console.log(j + ' is odd.');\n\
    \  }\n  console.log('i = ' + i);\n  console.log('j = ' + j);\n}\n````for...in`\
    \ 语句遍历对象的所有可枚举属性以实现特定目的。在实际项目中，JavaScript 会为每个属性执行指定的语句，以便你获得解释。请记住，`for...in`\
    \ 语句看起来如下：\n\n`for (variable in object)` 语句\n\n### 示例\n下面的函数接受一个对象和对象的名称作为参数，根据需要，它遍历对象的所有属性并返回一个列出属性名称及其值的字符串。\n\
    \n```javascript\nfunction dump_props(obj, obj_name) {\n  let result = '';\n  for\
    \ (let i in obj) {\n    result += obj_name + '.' + i + ' = ' + obj[i] + '<br>';\n\
    \  }\n  result += '<hr>';\n  return result;\n}\n```对于具有 `make` 和 `model` 属性的对象\
    \ `car`，结果将是：\n`car.make = Ford`\n`car.model = Mustang`\n\n### 数组\n虽然可能想用这种方法遍历\
    \ `Array` 元素，但 `for...in` 语句除了数字索引还会返回用户定义的属性。因此，在遍历数组时，使用传统的 `for` 循环配合数字索引更好，因为\
    \ `for...in` 语句会遍历 `Array` 对象的用户定义属性（例如添加自定义属性或方法）。\n\n### for...of 语句\n`for...of`\
    \ 语句创建一个遍历迭代对象（包括 `Array`、`Map`、`Set`、`arguments` 对象等）的循环，调用指定的语句来执行每个属性的值。\n\n\
    `for (variable of object )` 语句\n\n### 示例\n下面的示例展示了 `for...of` 循环和 `for...in` 循环之间的区别，但在项目中使用时要小心。此外，`for...in`\
    \ 遍历属性名，而 `for...of` 遍历属性值：\n\n```javascript\nconst arr = [3, 5, 7];\narr.foo\
    \ = 'hello';\nfor (let i in arr) {\n  console.log(i); // 打印 \"0\", \"1\", \"2\"\
    , \"foo\"\n}\nfor (let i of arr) {\n  console.log(i); // 打印 3, 5, 7\n}\n```\n\n\
    # 高效开发与调试\n\n## 如何调试 JavaScript？\n\n### 使用 JavaScript 验证器\n- **验证解析器或简单的验证器**：检查代码以确保其有效。\n\
    - **Douglas Crockford 的 JavaScript Lint**：在程序中添加调试代码：使用 `alert()` 或 `document.write()`\
    \ 方法可以轻松检查程序的健康状况。\n\n### 使用 JavaScript 调试器：\n对脚本提供细粒度的控制。一次运行一行。你可以设置断点并通过按 `F12`\
    \ 使用浏览器开发者工具。根据需要，如果你在使用某些 API 调用，可以进入开发者工具的网络标签页检查你是否收到错误或 200 响应。\n\n你也可以从 Alert\
    \ 中获得帮助，例如。假设你想调试代码是否到达了某一点，只需放置 `alert('Something')`，执行时你会在浏览器上弹出警告。假设你需要检查值是否改变或被设置，可以在设置后使用\
    \ `alert(object)`，即可获得带有该值的警告。\n\nJavaScript 调试工具首先使用 Chrome 或 Firefox ——两者都具有优秀的功能。我使用\
    \ Chrome —— 从窗口右上角的 Chrome 菜单中选择“开发者工具”。\n\n- **Elements（元素）**：提供一个 HTML/CSS 的折叠图表——你可以展开和折叠单个元素——查看哪些属性以及\
    \ CSS 提供了什么。\n- **Console（控制台）**：让你看到任何错误消息——刷新页面将看到任何加载错误。\n- **Sources（源代码）**：让你看到错误发生在源代码的何处（点击错误消息）。我想为了接下来的理解，你也可以创建“断点”——让你点击\
    \ JavaScript 的特定行，并在调试器到达该处时暂停你的脚本。\n"
- fmt: "\n# Debugging JavaScript\n\n## Using Console Methods\n\n- If a process is\
    \ taking quite a lot of time, `console.time()` can be used to start a countdown\
    \ timer to give you the best of the result in assertion of progression. And in\
    \ a bit of rage for perfection in this pretext printing the value with `console.timeEnd()`\
    \ will give you the information of time taken to execute a certain function.\n\
    - For a trickier performance issue, in order to look for a memory leak, `console.memory`\
    \ can be used to displays the heap size.\n- In case of a recurring code, `console.count()`\
    \ can be used to find out how many times the script reads your code.\n- If you\
    \ want to log a value when the condition is false `console.assert(condition, msg)`\
    \ can be used and you observe the changes. And adding to these along with experience\
    \ of projects however, while using `NodeJS`, this may throw an Assertion error.\n\
    - The objects which are logged can be displayed in a nicely arranged table format\
    \ using `console.table()`.\n- Finally if there are a number of logs in your console\
    \ and you want to start over in a clean view use `console.clear()`.\n\n![image](rsrc2J2.jpg)\n\
    \n## Browser Compatibility\n\n`JavaScript` is not cross browser compatible. Not\
    \ all browsers have complete support for `JavaScript` and earlier browsers outright\
    \ do not have any support for some very commonly used `JS` tags. In real projects\
    \ finding cross browser compatibility issues and debugging them is quite a challenge.\
    \ But also remember that at `LambdaTest` we provide a platform with 2000+ browser\
    \ and operating system combinations, each equipped with robust debugging tools.\
    \ It’s a perfect platform to find and debug cross browser compatibility issues\
    \ especially on browser versions or operating systems you don’t have native access\
    \ to. We also have debugging tools on mobile browsers, giving you a perfect tool-set\
    \ to debug mobile web issues.\n\n## Debug Server-Side JavaScript\n\nUsing `Visual\
    \ Studio Code` and `NodeJS`, in the config file I mention my script page and exclude\
    \ the useless pages to scan. I add breakpoints to my code. I click on the debug\
    \ tab, on the left to make the purpose meet from all the ends for this. Depending\
    \ on necessity I right click on the variables that I want to “watch”. I also add\
    \ `console.log()` to my code. I have coded my own module to write a log from my\
    \ code. Then, I debug step by step, I restart to make the purpose meet from all\
    \ the ends for this.\n\nI don’t use environment variables. I don’t use `dotenv`\
    \ package because I prefer always coming back to my code and never forget where\
    \ the parameters are added in my code. Depending on necessity I think that when\
    \ you use a `.env`, you don’t come back to your code. Depending on necessity I\
    \ also try to keep the smallest number of packages and files possible.\n\nThe\
    \ way I debug server side `JavaScript` (`NodeJS`) is simply by logging every errors\
    \ catch by any condition on my code. And the most useful command while working/debugging\
    \ on my code is simply executing this code, I just use `nodemon` for my example\
    \ snippet. It’s way better than using `Chrome` which is resource hungry in my\
    \ opinion, just to debug a server side `JavaScript`.\n\n## Additional Resources\n\
    \n- An Error Message! No Reason To Panic!\n- Debugging Code directly Inside `VS\
    \ Code`\n- Debugging `JavaScript` - An Overview\n- Finding Help & Working with\
    \ `MDN`\n- How to \"google\" Correctly\n- Next-Level Debugging with the `Chrome\
    \ Devtools` & Breakpoints\n- Testing Code Changes Directly in the Devtools\n-\
    \ The `ECMAScript` Standard\n- Using `console.log()` to look \"into the Code\"\
    \n- Utilizing Different `IDE` Views\n- Working with control structures\n- What\
    \ are all the looping structures in `JavaScript`\n\n## Loops in JavaScript\n\n\
    `JavaScript` loops are used to execute the same block of code a specified number\
    \ of times or while a specified condition is true.\n\n### For Loop\n\nThe for\
    \ loop is used when you know in advance how many times the script should run.\n\
    \n**Syntax**\n\n```javascript\nfor (var=startvalue; var<=endvalue; var=var+increment)\
    \ {\n    // code to be executed\n}\n```\n\n**Example**\n\n```html\n<html>\n<body>\n\
    <script type=\"text/javascript\">\nvar i=0;\nfor (i=0; i<=10; i++) {\n    document.write(\"\
    The number is \" + i);\n    document.write(\"<br />\");\n}\n</script>\n</body>\n\
    </html>\n```\n\n### While Loop\n\nThe while loop is used when you want the loop\
    \ to execute and continue executing while the specified condition is true.\n\n\
    **Syntax**\n\n```javascript\nwhile (var<=endvalue) {\n    // code to be executed\n\
    }\n```\n\n**Example**\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\"\
    >\nvar i=0;\nwhile (i<=10) {\n    document.write(\"The number is \" + i);\n  \
    \  document.write(\"<br />\");\n    i=i+1;\n}\n</script>\n</body>\n</html>\n```\n\
    \n**Result**\n\n```\nThe number is 0\nThe number is 1\nThe number is 2\nThe number\
    \ is 3\nThe number is 4\nThe number is 5\nThe number is 6\nThe number is 7\nThe\
    \ number is 8\nThe number is 9\nThe number is 10\n```\n\n### do...while Loop\n\
    \nThe do...while loop is a variant of the while loop but be careful in using this\
    \ in your projects. This loop will always execute a block of code ONCE, and then\
    \ it will repeat the loop as long as the specified condition is true. This loop\
    \ will always be executed at least once, even if the condition is false, because\
    \ the code is executed before the condition is tested.\n\n**Syntax**\n\n```javascript\n\
    do {\n    // code to be executed\n} while (var<=endvalue);\n```\n\n**Example**\n\
    \n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar i=0;\ndo {\n\
    \    document.write(\"The number is \" + i);\n    document.write(\"<br />\");\n\
    \    i=i+1;\n} while (i<0);\n</script>\n</body>\n</html>\n```\n\n**Result**\n\n\
    ```\nThe number is 0\n```\n\n### Break and Continue\n\nThere are two special statements\
    \ that can be used inside loops: `break` and `continue`.\n\n#### Break\n\nThe\
    \ `break` command will break the loop and continue executing the code that follows\
    \ after the loop (if any).\n\n**Example**\n\n```html\n<html>\n<body>\n<script\
    \ type=\"text/javascript\">\nvar i=0;\nfor (i=0; i<=10; i++) {\n    if (i==3){break}\n\
    \    document.write(\"The number is \" + i);\n    document.write(\"<br />\");\n\
    }\n</script>\n</body>\n</html>\n```\n\n**Result**\n\n```\nThe number is 0\nThe\
    \ number is 1\nThe number is 2\n```\n\n#### Continue\n\nThe `continue` command\
    \ will break the current loop and continue with the next value.\n\n**Example**\n\
    \n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar i=0;\nfor (i=0;\
    \ i<=10; i++) {\n    if (i==3){continue}\n    document.write(\"The number is \"\
    \ + i);\n    document.write(\"<br />\");\n}\n</script>\n</body>\n</html>\n```\n\
    \n**Result**\n\n```\nThe number is 0\nThe number is 1\nThe number is 2\nThe number\
    \ is 4\nThe number is 5\nThe number is 6\nThe number is 7\nThe number is 8\nThe\
    \ number is 9\nThe number is 10\n```\n"
