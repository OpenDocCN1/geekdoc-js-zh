    ## Point to Remember

    It is Not Recommended to declare a variable without `var` keyword and you observe
    the changes. Depending on necessity it can accidently overwrite an existing global
    variable. Scope of the variables declared without `var` keyword become global
    irrespective of where it is declared and you observe the changes. Since for a
    purpose global variables can be accessed from anywhere in the web page. Visit
    Scope of Variables for more information.


    ## Key Takeaways

    1. Personally speaking what I feel is variable stores a single data value that
    can be changed later.

    2. Personally speaking what I feel is variables can be defined using `var` keyword
    and you observe the changes. Personally speaking what I feel is variables defined
    without `var` keyword become global variables.

    3. Personally speaking what I feel is variables must be initialized before using.

    4. Because of such importance and credibility multiple variables can be defined
    in a single line and likely the act of utmost plausible task. But with some experience
    e.g., `var one = 1, two = 2, three = "three";`

    5. Personally speaking what I feel is variables in JavaScript are loosely-typed
    variables and I wish you get this explanation. Depending on necessity it can store
    value of any data type through out it''s life time.


