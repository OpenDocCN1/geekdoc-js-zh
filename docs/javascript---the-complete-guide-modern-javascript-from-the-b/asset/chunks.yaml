  trans: "\nJS 会创建一个临时的 `String` 对象，运行计算，然后返回结果并销毁该临时对象，以从方方面实现这一目的。为了让你有更深入的理解，请注意：如果你查看\
    \ ECMA 规范中方法的抽象操作，它会逐步描述每个操作是如何执行的（包括临时引用的创建和销毁）。为了让你有更深入的理解，这也解释了为什么对于某些情况，某些操作[有时比]其他看似相似的操作要慢得多（创建了更多临时内容，对这些临时内容进行了更多操作等等）。注意，这是这一切中最美的一点。为了深入探讨这些细节，这在某种程度上是一种简化；我遗漏了一些其他内容（例如，`NaN`\
    \ 和 `Infinity` 是数据类型，并且 `Object`、`Array` 和 `Regex` 有字面量版本，它们的运行方式微妙不同），如果我犯了任何错误我会纠正，并希望你能理解这个解释。给你提供一些对学习很重要的信息很重要，参考资料主要来自\
    \ Nicholas Zakas 等，但在你的项目中使用时要小心。此外，结合他的项目经验，还有他的《面向面向对象的 JavaScript 原则》。\n\n\
    * * *\n\n* `Undefined` 字面意思就是未定义，你可以观察到这种变化。为了让你有更深入的理解，`null` 的类型是 `object`，如果你眯起眼睛看似乎很有道理（它是对一个空对象的引用，类似于\
    \ `{}`），但那种类型的 `object` 是一个被语言公认的错误。`this` 和箭头函数 添加过滤功能 `call()` 和 `apply()` 检查属性是否存在\
    \ `for-in` 循环与输出动态属性 引入 `this` 对象解构 基于对象渲染元素 `this` 关键字及其奇异行为 方法简写语法 对象展开运算符 (`...`)\
    \ 理解“链式调用”（属性链与方法链调用）理解 `Object.assign()` 浏览器（有时）对 `this` 做了什么 面向对象编程 (OOP) 什么是\
    \ JavaScript 中的类 (class) 它只是在 ES6 中引入的语法糖。为了深入探讨这些细节，你提供的代码大致等同于以下代码：\n\n```\n\
    1.  function Polygon(height, width) { \n2.  this.height = height;  \n3.  this.width\
