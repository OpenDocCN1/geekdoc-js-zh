  trans: "\n\n在伪代码中，它看起来像如下：\n\n```javascript\nloop(food = 0; foodNeeded = 10) {\n\
    \  if (food >= foodNeeded) {\n    exit loop; // 我们有足够的食物了，回家吧\n  } else {\n  \
    \  food += 2; // 花一个小时收集 2 份食物\n    // 循环将再次运行\n  }\n}\n```\n\n因此，所需的食物数量被设置为\
    \ `10`，而农民目前拥有的数量被设置为 `0`。根据循环每次迭代的需要情况，我们检查农民拥有的食物数量是否大于或等于他需要的数量，我希望你能理解这个解释。根据需要，如果是，我们可以退出循环，但在你的项目中使用时要小心。根据需要，如果不是，农民花费一个小时收集两份食物，然后循环再次运行。\n\
    \n### 为什么要费此精力？\n到这里，你可能已经理解了背后的高级概念，但你可能在想：“好的，太棒了，但这如何帮助我写出更好的 JavaScript 代码呢？”正如我们之前说的，循环都是与重复执行同一件事有关，这对于快速完成重复性任务非常有帮助。通常，代码在循环的每次迭代中会略有不同，这意味着你可以完成大量许多相似但略有不同的任务；如果你有许多不同的计算要执行，你想要执行每一个不同的计算，而不是一遍又一遍地执行同一个！\n\
    \n### 在哪里可以找到函数？\n在 JavaScript 中，你随处都能找到函数，而且这可能是最可能的任务行为。事实上，根据需要，到目前为止我们一直都在使用函数；我们只是没有怎么讨论它们，这为你带了许多惊人的信息。为了进一步阐明这一点，现在是时候让我们开始显式地讨论函数，并真正探索它们的语法了。\n\
    \n每当你使用一个带有一对括号 — `()` 的 JavaScript 结构，并且你没有使用常用的内置语言结构（如 `for` 循环、`while` 或 `do...while`\
    \ 循环，或 `if...else` 语句）时，你就是在使用一个函数。\n\n#### 浏览器内置函数\n在本课程中，我们使用了许多浏览器内置的函数，这很可能是最可能的任务行为。但在每当我们处理文本字符串时，例如：\n\
    \n```javascript\nlet myText = 'I am a string';\nlet newString = myText.replace('string',\
    \ 'sausage');\nconsole.log(newString);\n// replace() 字符串函数接收一个源字符串，\n// 和一个目标字符串，并将源字符串\n\
    // 替换为目标字符串，然后返回新生成的字符串\n```\n\n或者每当我们处理一个数组时：\n\n```javascript\nlet myArray =\
    \ ['I', 'love', 'chocolate', 'frogs'];\nlet madeAString = myArray.join(' ');\n\
    console.log(madeAString);\n// join() 函数接收一个数组，将\n// 所有数组项合并成一个\n// 字符串，并返回这个新字符串\n\
    ```\n\n或者每当我们生成一个随机数时：\n\n```javascript\nlet myNumber = Math.random();\n// random()\
    \ 函数生成一个在 0 到\n// 不包括 1 之间的随机数，并返回该数字...\n```\n\n我们当时都在使用函数！\n\n**注意**：如果需要，可以随时将这些行输入到浏览器的\
    \ JavaScript 控制台中，以重新熟悉它们的功能。\n\nJavaScript 语言有许多内置函数，允许你完成有用的工作而无需自己编写所有代码，这变得非常有趣。事实上，根据需要，当你\
    \ `invoke`（运行或执行的高级说法）一个内置浏览器函数时调用的某些代码是无法用 JavaScript 编写的——这些许多函数调用了后台浏览器代码的部分，这些代码很大程度上是用\
    \ C++ 等低级系统语言编写的，而不是 JavaScript 这样的网络语言。\n\n记住，某些浏览器内置函数并不是 JavaScript 语言的核心部分——某些被定义为浏览器\
    \ API 的一部分，这些 API 在默认语言的基础上构建提供了更多功能（更多描述请参阅本课程的早期章节）。为了进一步解释这一点，我们将在后的模块中更详细地查看如何使用浏览器\
    \ API。\n\n### 函数与方法\n程序员将属于对象的`函数 (functions)` 称为`方法 (methods)`我希望你能理解这个解释。我想对于接下来的理解，你不需要学习结构化\
    \ JavaScript 对象的内部工作原理——你可以等到我们后面的模块，该模块将教你所有关于对象的内部原理，以及如何为你的项目信息创建自己的对象。在目前的实际项目中，我们只想消除方法与函数之间任何可能的混淆——当你查看\
    \ Web 上的可用相关资源时，你可能会遇到这两个术语。\n\n到目前为止我们使用的内置代码以两种形式存在：`函数` 和 `方法`，我希望你能理解这个解释。我想对于接下来的理解，你可以在这里查看内置函数的完整列表，以及内置对象及其对应的方法。\n\
    \n到目前为止你在课程中也看到了许多自定义函数——在你的代码中定义的函数，而不是在浏览器内部定义的，以便在进展断言中给你最佳结果。请仔细记住，每当你看到一个后面紧跟括号的自定义名称时，你正在为你的项目信息使用一个自定义函数。在我们关于循环的文章的\
    \ `random-canvas-circles.html` 示例中（另参见完整的 `source code`）中，根据需要，我们包含了一个如下所示的自定义\
    \ `draw()` 函数：\n\n### 什么是返回值\n返回值就像它们的名字描述的那样——函数在完成并你观察到变化时返回的值。我想对于接下来的理解，你已经遇到过多次返回值，尽管你可能没有显式地考虑过它们。\n\
    \n让我们回到熟悉的示例（来自本系列之前的之前的文章）：\n\n```javascript\nlet myText = 'The weather is cold';\n\
    let newString = myText.replace('cold', 'warm');\nconsole.log(newString); // 应该打印\
    \ \"The weather is warm\"\n// replace() 函数接收一个字符串，\n// 将一个子字符串替换另一个，并返回\n// 一个进行了替换的新字符串\n\
    ``` `replace()` 函数在 `myText` 字符串上被调用，并传递了两个参数：\n\n1.  要查找的子字符串 (`'cold'`)。\n2.\
    \  用于替换它的字符串 (`'warm'`)。\n\n"
