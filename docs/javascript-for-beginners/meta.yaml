  md: "# 6.3 CALLING FUNCTIONS FROM EVENTS\n\nJavascript is often called an event-driven\
    \ language. With Javascript, you can respond to events that the user causes in\
    \ the user interface or events that occur naturally during the program's execution.\n\
    \nFour events will be covered in this section: onclick, onload, onmouseover and\
    \ onload and each of these events will be discussed accordingly.\n\nLet's start\
    \ with onclick. We're going to create a basic button in HTML that contains an\
    \ onclick event. The onclick event will cause a Javascript function to execute\
    \ when the button is clicked.\n\n```\n<input type=\"button\" value=\"Press Me\"\
    \ onclick=\"onButtonClick()/>\n```\n\nOnce this button is clicked, the function\
    \ onButtonClick() will be executed.\nNow we need to create the actual function\
    \ that will run when the button is clicked. We will write the function in <script>\
    \ tags in the head of the document.\n\n> When writing Javascript functions on\
    \ a single page, it is always a good idea to keep them in the head of the document.\n\
    \nIn this case, we are simply going to display a text alert that will say that\
    \ the button has been pressed. The function is:\n\n```\nfunction onButtonClick()\
    \ {\n\talert(\"You have successfully pressed the button!\");\n}\n```"
