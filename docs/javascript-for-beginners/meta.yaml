  md: "# 9.2 Window Objects\n\nNow we'll examine the window object. The properties\
    \ under the window object are: **document**, which specifies the document type\
    \ but does not return a value; **innerWidth**, which tells the browser window's\
    \ inner width in pixels; **innerHeight**, which tells the inner height of the\
    \ browser window in pixels; **location**, which tells the URL where the current\
    \ webpage or document page is stored or located; and **protocol**, a property\
    \ of “location”, which indicates the web page protocol used, whether it's http\
    \ or https.\n\nBoth dimension and location objects return a value when called\
    \ or implemented.\n\nThe first window object we will demonstrate is `document`.\
    \ The command syntax for the `document` object would be:\n\n```\ndocument.write(window.document);\n\
    ```\n\nSome strings may be concatenated for use with the window.document. For\
