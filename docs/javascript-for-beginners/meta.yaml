    # 6.2 FUNCTIONS, PARAMETERS, AND RETURNS


    One of the goals of writing functions in Javascript is to write functions that
    are both flexible and reusable. A good way to meet these goals is by creating
    functions that can both take parameters and return a value. In this section, we
    are going to discuss how to implement display passing parameters and returning
    values.


    In the previous section, we created a function called displayPlayerScore which
    contained a variable that was set at 1000, then we displayed the value of the
    variable.


    This time, instead of having the value of the variable set inside the function,
    we will pass a value to the function and have that value used by a function.


    For example, if we want to pass the value 14000 to the function, we would write:


    ```

    displayPlayerScore(14000);

    ```


    Now, the function displayPlayerScore, receives the value 14000 and assigns it
    to a variable. Let us call the variable theScore; we declare the complete function
    as:


    ```

    function displayPlayerScore(theScore);

    ```


    Oftentimes, you want to be able to manipulate the variable within the function
    and return a new value to the function caller. For example, within the function
    you can write:


    ```

    theScore += 1000;

    ```


    This will add 1000 to the value that was passed to the function, known as theScore,
    then when called, it will return a new value as a result.


    To clarify, the function is passed an initial value of 14000. The function assigns
    that value to the variable theScore.'
