  - '[PAGE 102]


    # 5.2 FOR-LOOPS AND PRACTICAL APPLICATION OF A LOOP


    For-loops are compact loops that allow you to set the variable, the condition,
    and the continuation condition (or counter) within the loop command itself. They
    save time, are easy to decipher and create less code in the long run.


    This is what a for-loop looks like:


    ```

    for(var i=100; i > -1; i=i-5)

    ```


    There are three elements to a for-loop command.


    +   First is the declaration of the counter variable and the assignment of its
    initial value.


    > In the above example, it is var i=100;


    +   The second part of the for-loop is the continuation condition which will determine
    how many times the loop will iterate; here, the loop will iterate as long as the
    variable is greater than -1, that is i >-1 in the above example.


    +   The third and last element of a for-loop is the “counter”. The counter determines
    how the counter variable will change with each iteration of the loop. In the above
    example, the loop will start from 100 and count down by fives, i=i-5, for each
    iteration. Based on this, the loop will iterate—or loop—21 times.


    Care must be observed when using for-loops, as it is very easy to create an infinite
    loop if you set the counter incorrectly.'
