    \ 15000 |\n| 29 |\n\n# QUESTIONS FOR Help\n\n- 1. How do you pass the value of\
    \ a function?\n  a. Put it in parentheses at the function call.\n  b. Put it next\
    \ to the function.\n  c. Define it in the HTML.\n  d. Play \"pass the ball\".\n\
    \n- 2. How do you return a value to a function call?\n  a. return()\n  b. sendback()\n\
    \  c. functionReturn()\n  d. returnValue()\n\n- 3. What is needed to hold the\
    \ value of the return command?\n  a. A new function.\n  b. A loop.\n  c. A script.\n\
    \  d. A variable.\n\n# 6.3 CALLING FUNCTIONS FROM EVENTS\n\nJavascript is often\
    \ called an event-driven language. With Javascript, you can respond to events\
    \ that the user causes in the user interface or events that occur naturally during\
    \ the program's execution.\n\nFour events will be covered in this section: onclick,\
    \ onload, onmouseover and onload and each of these events will be discussed accordingly.\n\
    \nLet's start with onclick. We're going to create a basic button in HTML that\
    \ contains an onclick event. The onclick event will cause a Javascript function\
    \ to execute when the button is clicked.\n\n```html\n<input type=\"button\" value=\"\
    Press Me\" onclick=\"onButtonClick()\"/>\n```\n\nOnce this button is clicked,\
    \ the function onButtonClick() will be executed.\nNow we need to create the actual\
    \ function that will run when the button is clicked. We will write the function\
    \ in <script> tags in the head of the document.\n\n> When writing Javascript functions\
    \ on a single page, it is always a good idea to keep them in the head of the document.\n\
    \nIn this case, we are simply going to display a text alert that will say that\
    \ the button has been pressed. The function is:\n\n```javascript\nfunction onButtonClick()\
    \ {\n\talert(\"You have successfully pressed the button!\");\n}\n```\n\nWhen the\
    \ code runs in the browser the following output is displayed:\n\n![](img/c922782503c42c65b3a7c97e4fad8964_140_0.png)\n\
    \nOnce the “Press Me” button is clicked, the function is called causing an “alert\
    \ box” to appear on the webpage.\n\n![](img/c922782503c42c65b3a7c97e4fad8964_140_1.png)\n\
    \nFollowing is the complete code listing for *onclick* event:\n\n# CODE LISTING:\
    \ ONCLICK EVENT – WITH Alert BOX\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title>onButtonClick</title>\n<script language=\"javascript\" type=\"text/javascript\"\
    >\n function onButtonClick() {\n    alert(\"You pressed the button!\");\n  }\n\
    </script>\n</head>\n<body>\n<input type=\"button\" value=\"Press Me!\" onclick=\"\
    onButtonClick()\">\n</body>\n</html>\n```\n\nThe next event we will introduce\
    \ is the **onload** event. This event triggers a function to be executed once\
    \ the page has loaded.\n\nThere are a variety of ways to implement the onload.\
    \ A common method is to place *onload* inside the `<body>` tag. The complete tag\
    \ for the onload event is:\n\n```html\n<body onload=\"whenPageLoads()\">\n```\n\
    \nIn the `<body>` tag shown, the page is finishing loading, the function *whenPageLoads()*\
    \ will be executed. This function will give an *alert* message welcoming the user\
    \ to the page.\n\n# Chapter 6: Coding Javascript Functions\n\nthe alert box was\
    \ immediately displayed as soon as the page has loaded.\n\n![](img/c922782503c42c65b3a7c97e4fad8964_142_0.png)\n\
    \n![](img/c922782503c42c65b3a7c97e4fad8964_142_1.png)\n\nFIGURE 6-9\n\nFollowing\
    \ is the complete code listing demonstrating onload event:\n\n# CODE LISTING:\
    \ ONLOAD EVENT – WITH Alert Box\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title>onload Event</title>\n<script language=\"javascript\" type=\"text/javascript\"\
    >\n  function onload () {\n    alert(\"Welcome To Simple Page!\");\n  }\n</script>\n\
    </head>\n<body onload=\"onload()\">\nHello and Welcome Again!\n</body>\n</html>\n\
    ```\n\nOnload can be used in conjunction with onclick. You may have separate functions\
    \ for each event, like whenPageLoads() for the onload event and onclick event.\
    \ These functions are individually called as each event occurs. It is also possible\
    \ to have multiple events pointing to the same function. This is more common if\
    \ you have multiple buttons or other elements in your GUI that have a similar\
    \ function.\n\nIn this next example, a “Welcome to my Page” alert box will be\
    \ displayed once the page has loaded:\n\n![](img/c922782503c42c65b3a7c97e4fad8964_143_0.png)\n\
    \nAfter clicking “OK”, the alert box clears out, displaying the page with a “Press\
    \ Me” button.\n\n![](img/c922782503c42c65b3a7c97e4fad8964_144_0.png)\n\nWhen the\
    \ “Press Me” button is clicked, another alert box with the message “You have successfully\
    \ pressed the button!” appears.\n\n![](img/c922782503c42c65b3a7c97e4fad8964_144_1.png)\n\
    \nClicking “OK” will clear out the alert box from the display.\n\nFollowing is\
    \ the complete code listing for onclick and onload events:\n\n# CODE LISTING:\
