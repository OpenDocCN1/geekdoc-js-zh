  md: '# # CHAPTER 10

    DOCUMENT OBJECT AND INNERHTML PROPERTIES


    +   CHAPTER OBJECTIVES:

    - You will be able to extract text from text boxes and display extracted text
    using alert box.

    - You will learn how to highlight texts using color background.

    - You will be able to change page content within a page without popping out a
    new window.

    - You will learn how to install Firebug and how it is used to see the changes
    in codes place in a page.


    # ## 10.1 DOCUMENT OBJECT


    In this final chapter (whew!), we will present the overview of the document object
    and innerHTML properties. We will also introduce a Firefox utility called Firebug,
    which enables you to view changes in the page content changes.


    Let''s first discuss document object. When we say document object, we''re referring
    to both internal browser settings and the elements that are found or placed within
    an HTML page document. The document object is stored in the browser in a hierarchical
    format and effectively serves as memory or RAM for your Javascript programs. The
    entire state of the browser is stored in the document object—including its HTML,
    JavaScript, and CSS code. There are standardized ways of working with the document
    object and its various properties (hundreds of them). This standardized model—which
    is fairly consistent across browsers—is known as the document object model.


    > Some examples of document objects: text fields, reply buttons, hyperlinks, etc.


    The innerHTML property provides a way to access different facets of the document
    object—specifically those that are designed to hold HTML code. The innerHTML property
    allows you both to retrieve and set the'
  merge: -1
