  md: "# 10.2 THE INNERHTML PROPERTY\n\nThe innerHTML property is used to access the\
    \ HTML inside any element within the HTML code. For example, a <p> paragraph element\
    \ may have text and other HTML tags inside it. By using the innerHTML property,\
    \ we can access the content to both retrieve and modify it.\n\nhttp://www.w3.org/TRdom06.html\
    \ uses this explanation of what innerHTML is:\n\nThe most useful property of our\
    \ web page objects... The innerHTML property was introduced by Microsoft in Internet\
    \ Explorer as a convenient way of being able to access the entire content of the\
    \ HTML container all at once. It turned out to be so convenient that all of the\
    \ other browsers quickly added support for this property.\n\nWe can use innerHTML\
    \ either to retrieve the current content of the container or to insert new content\
    \ into that container.\n\nLet's dig in and start modifying content in an HTML\
    \ document through Javascript. First, we create a basic HTML document, then add\
    \ a logical division. Then, place script tags in the head of the document:\n\n\
    ```\n<!DOCTYPE html>\n<html>\n<head>\n<title>\n</title>\n  <script language=\"\
    javascript\" type=\"text/javascript\">\n\n  </script>\n</head>\n```\n\nNow, we'll\
    \ make the div accessible through the document object and Javascript by adding\
    \ an id attribute and value. We'll make the value \"content\":\n\n```\n<body>\n\
    \  <div id=\"content\">\n```"
  merge: -1
  pgno: 254
- img_proc: true
  md: "Next, let's add a paragraph element. Of course, it must be enclosed by paragraph\
    \ tags. Then we'll close the “div\":\n\n```\n<p>This paragraph will change when\
    \ the document object's innerHTML property is accessed.</p>\n<div>\n```\n\nTo\
    \ make it a little more interesting, let's add a button that, when clicked, will\
    \ call a function that will contain the code that will dynamically alter the HTML.\
    \ The segment code for the button is as follows:\n\n```\n<input type=\"button\
    \ \" value=\"Press Me! \" onclick=\"changeContent()\"/>\n</body>\n</html>\n```\n\
    \nLet's go back to the head of the document—right between the script tags—and\
    \ insert the function changeContent() inside the tags, thereby forming an element.\n\
    \nThis is how the inserted code should look:\n\n```\nfunction changeContent()\
    \ {\n  document.getElementById('content').innerHTML = \"<h3>See? The content has\
    \ changed!</h3>\";\n}\n```"
  merge: -1
  pgno: 255
- img_proc: true
