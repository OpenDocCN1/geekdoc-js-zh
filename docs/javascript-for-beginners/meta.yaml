    > Even though this method doesn''t assign numbers to the list of arrays, you should
    know that the first array is always index number zero by default.


    var animals = new Array("dog", "cat", "mouse", "hamster", "toad");


    Index Numbers:


    +   [0] [1] [2] [3] [4]


    The third and final method of creating an array is the literal array method. In
    this method, an array is created by declaring a variable and setting the values
    in square brackets separated by commas. The difference lies in the instantiation
    where the new variable and data type declaration "new Array" are no longer included
    in the code:


    ```

    <html>

    <head>

    <title></title>

