- md: "3. What does the comparison operator \"!=\" mean?\na. Not equal to. \nc. Equivalent.\n\
    b. Equal to. \nd. Greater than.\n\n4. What comparison operator would you use to\
    \ create a compound statement which will logically “AND” two statements?\na. ++\
    \ \nc. ==\nb. -- \nd. &&\n\n1) Create a standard HTML document containing the\
    \ necessary Javascript <script> tags and attributes.\n\n2) You will implement\
    \ a program that uses an if-statement. You will evaluate two variables: citizenship,\
    \ a Boolean; and age, an integer. It will display a message based on evaluation\
    \ of the variables.\n\nThe program must be able to decide whether the user is\
    \ of voting age and a US citizen and if both conditions are TRUE, will display\
    \ the first message \"You can vote. You are 18 and above a citizen.\".\n\n3) If\
    \ only one condition is TRUE, say age, and then citizenship is FALSE, the message\
    \ \"Sorry, you cannot vote. You are 18 but you are not a citizen.\" is displayed\
    \ as second.\n\n4) If both variables for age and citizenship yield FALSE, then\
    \ the message \"Sorry, you cannot vote. You are below 18 and you are not a citizen.\"\
    \ is displayed as third.\n\n5) Include another conditional statement that will\
    \ test if a variable’s value is equal to \"Mark\" and if TRUE, will display the\
    \ fourth message. \"You are the course instructor!\",\n\nFollowing is the expected\
