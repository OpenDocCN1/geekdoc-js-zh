    \ {\n  theScore += 1000;\n  document.write(theScore);\n}\n```\n\nThe function\
    \ call would look like this:\n\n```\ndisplayPlayerScore(14000);\n```\n\nYou may\
    \ also pass multiple values to a function.\n\nSuppose we have the values 100 and\
    \ 17. In this example we will create a new function named addTheseNumbers, which\
