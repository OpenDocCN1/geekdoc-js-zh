    >\n>\n<html lang=\"en\">\n<head>\n  <title>Conditional & Logical Operators</title>\n\
    </head>\n<body>\n  <script language=\"javascript\" type=\"text/javascript\">\n\
    \    var age = 18;\n    // Variable declaration and initialization\n    var citizen\
    \ = true;\n    //Boolean variable TRUE\n\n    if(age>=18 && citizen==true) {\n\
    \      document.write(\"You can vote. You are 18 and above and a citizen.\");\n\
    ```\n\n```\nvar age = 18;\n// Variable declaration and initialization\nvar citizen\
    \ = false;\n//Boolean variable FALSE\n\nif(age>=18 && citizen!=true)\n//Conditional\n\
    {\n    document.write(\"Sorry, you cannot vote. You are 18 but you are not a citizen.<br/>\"\
    );\n}\n```\n\n```\nvar age = 18;\n// Variable declaration and initialization\n\
    var citizen = false;\n//Boolean Variable FALSE\n\nif(age<=18 && citizen==false)\n\
    //Conditional\n{\n    document.write(\"Sorry, you cannot vote. Either you are\
    \ below 18 and you are not a citizen.<br/>\");\n}\n```\n\n```\nvar name=\"Mark\"\
    ;\n\nif(name == \"Mark\")\n{\n    document.write(\"You are the instructor!\");\n\
    }\n</script>\n</body>\n</html>\n```\n\n# 3.2 If-Else-If Statements\n\nWe are going\
    \ to continue our look at conditionals in this section as we use conditionals\
    \ with the Else statements.\n\nThe if-statement can run through a series of nested\
    \ conditions that are carried out by setting up the If-Else-If which accommodates\
    \ more complex branching.\n\nLet's create a game score scenario where there is\
    \ a variable for the highest score and another variable containing the player\
    \ score.\n\nThe if-statement will be:\n\n```\nif (playerScore > highScore)\n```\n\
    \nNow, if the playerScore is greater than the highScore, we also want to change\
    \ highScore to the playerScore value. So, if the if statement is true, we change\
    \ the value of highScore with:\n\n```\nhighScore = playerScore;\n```\n\nHowever,\
    \ if the initial condition is FALSE, we need to use the else statement to output\
    \ the other message. Using our else statement, the code should be:\n\n```\nif(playerScore\
    \ > highScore)\n{\n    //Player has high score\n    highScore = playerScore;\n\
    ```\n\n```\ndocument.write(\"You attained the high score!\");\n  } else\n{\n \
    \ document.write(\"You did not attain the high score.\");\n}\n```\n\nUsing this\
    \ conditional, the program will evaluate the condition as TRUE; display the string,\
    \ and change the highScore variable to the playerScore. If the playerScore variable\
    \ is lower than 10,000, the if-statement would evaluate as FALSE and the string\
    \ would output the message within the else statement. The complete code listing\
    \ is as follows:\n\n```\n<!DOCTYPE HTML PUBLIC \"//W3C//DTD HTML 4.01//EN\"\n\
    \ \"http://www.w3.org/TR/html4/strict.dtd\">\n>\n<html lang=\"en\">\n<head>\n\
