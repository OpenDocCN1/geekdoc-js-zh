    element in the document head.


    ```

    <script language="javascript" type="text/">

    function add(x,y)

    {

    document.write(x + "+" + y + "=" + (x+y));

    }

    function subtract(x,y)

    {

    document.write(x + "-" + y + "=" + (x-y));

    }

    function multiply(x,y)

    {

    document.write(x + "*" + y + "=" + (x*y));

    }

    function divide(x,y)

    {

