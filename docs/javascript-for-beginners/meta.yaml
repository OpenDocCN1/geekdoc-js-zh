    \ In the previous example, they are the numbers enclosed in the square brackets:\
    \ [0], [1], [2], [3], [4].\n\nArrays always start with the position 0; therefore\
    \ when populating your array, you must always start with the \"0\" index. A common\
    \ error developers make when working with Arrays is known as the \"one-off error.\"\
    \ Because the first member of an array is in index 0 and the second member is\
    \ in index 1, it is common for programmers to be \"one off\" when selecting an\
