    \n## CHAPTER 4 SUMMARY\n\nIn this chapter, we discussed how to use Javascript\
    \ to create dialog boxes that pop up in a browser window. You learned how to implement\
    \ the `prompt`, `confirm` and `alert` boxes.\n\nWe also discussed how to use the\
    \ user-supplied data in the `prompt` and `confirm` boxes to output strings on\
    \ the website. You learned how to use conditional statements to display string\
    \ outputs in the browser after clicking a response in the confirm box.\n\nIn chapter\
    \ 5 we will be discussing how to create loops using Javascript. Loops are one\
    \ of the most important aspects of programming in any language.\n\n## CHAPTER\
    \ 5: NOW WE'RE ITERATING! LOOPS IN JAVASCRIPT\n\nCHAPTER OBJECTIVES:\n\n- You\
    \ will be able to implement while and do-while loops.\n- You will be able to create\
    \ for-loops.\n- You will be able to apply loops in practical situations or cases.\n\
    \n## 5.1 WHILE-LOOPS AND DO-WHILE LOOPS\n\nIn this section we will be discussing\
    \ loops. Loops are important facets of any programming language. With loops you\
    \ can repeat a certain code block, allowing code to repeatedly execute until a\
    \ satisfactory condition is met. Every time the code is executed, it is referred\
    \ to as an iteration through the loop.\n\nLoops are great for a number of tasks\
    \ when programming, including receiving user-input data or causing a program to\
    \ read, parse, and output a lengthy document.\n\nIn this section we are going\
    \ to review while-loops and do-while loops. To demonstrate loops, let's create\
    \ a loop that will output the series of numbers from one to 100.\n\nWe'll start\
    \ with the while-loop.\n\nA while-loop is similar to a conditional statement in\
    \ the sense that it evaluates a condition in the program and if the condition\
    \ is \"TRUE\", the code block associated with the loop will run.\n\nWe must start\
    \ by identifying a loop counter variable. Let's use x. With each iteration of\
    \ the loop, the counter will be compared within a continuation condition. If that\
    \ condition evaluates as TRUE, the loop will continue to iterate. If it evaluates\
    \ as FALSE the loop will cease running. If you set up a loop where the continuation\
    \ condition is always true, you would be creating an infinite loop that will eventually\
    \ crash your program. For this example, the variable declared is x and its value\
    \ set to so that the loop iterates 100 times. The syntax for the while-loop is:\n\
    \n```javascript\nvar x=1;\nwhile (continuation condition)\n{\n  ...code to execute\n\
    }\n```\n\nA specific example it is:\n\n```javascript\nwhile (x < 101)\n```\n\n\
    Following this line is a code block which describes what to do if the condition\
    \ in the while-statement is \"TRUE\". Let us instruct the program to write or\
    \ display the value of the variable x. The command set would look like this:\n\
    \n```javascript\n{\ndocument.write (x + \"<br/>\");\n```\n\nWe concatenated a\
    \ line break tag to the output to keep it readable and neat.\n\nIncreasing the\
    \ value of the variable x by one will change the value of the variable with each\
    \ iteration of the loop. To increment x, the code should read:\n\n```javascript\n\
    x++;\n```\n\nAfter each iteration of the loop, the Javascript interpreter will\
    \ test the value of x in the continuation condition. In this case, the loop will\
    \ continue iterate if x < 101 evaluates as true. Once the value of x reaches 101,\
    \ the continuation condition will evaluate as FALSE and the loop will cease.\n\
    \nThis is how the complete loop is coded:\n\n## CODE LISTING: WHILE-LOOP\n\n```javascript\n\
    var x=1;\nwhile(x < 101)\n  {\n    document.write(x + \"<br/>\");\n    x++;\n\
    \  }\n```\n\nThe value for x is being compared to 101 because if it is compared\
    \ to 100, the loop will only iterate to 99. The complete code follows:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <title>While-Loop</title>\n</head>\n<body>\n\
    \  <script language=\"javascript\" type=\"text/javascript\">\n    var x = 1;\n\
    \    while (x < 101)\n    {\n      document.write(x + \"<br/>\");\n      x++;\n\
    \    }\n  </script>\n</body>\n</html>\n```\n\nThe value for x is being compared\
    \ to 101 because if it is compared to 100, the loop will only iterate to 99. The\
    \ complete code follows:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>While-Loop</title>\n\
    </head>\n<body>\n  <script language=\"javascript\" type=\"text/javascript\">\n\
    \    var x = 1;\n    while (x < 101)\n    {\n      document.write(x + \"<br/>\"\
    );\n      x++;\n    }\n  </script>\n</body>\n</html>\n```\n\nThe value for x is\
    \ being compared to 101 because if it is compared to 100, the loop will only iterate\
    \ to 99. The complete code follows:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <title>While-Loop</title>\n</head>\n<body>\n  <script language=\"javascript\"\
    \ type=\"text/javascript\">\n    var x = 1;\n    while (x < 101)\n    {\n    \
    \  document.write(x + \"<br/>\");\n      x++;\n    }\n  </script>\n</body>\n</html>\n\
    ```\n\n## While-Loop\n\n```\n1\n2\n3\n4\n5\n6\n7\n8\n9\n```\n\n![](img/c922782503c42c65b3a7c97e4fad8964_97_0.png)\n\
    \nScroll down and this is what you will see at the bottom of the browser:\n\n\
    ```javascript\n1\n2\n3\n4\n5\n6\n7\n8\n9\n```\n\nDo-while loops function in a\
    \ similar manner as while-loops, the one difference of a do-while loop is that\
    \ the condition is tested at the end of the loop. This means it is guaranteed\
    \ to iterate at least once, even if the condition is initially false.\n\n## CHAPTER\
    \ 5: Now We're Iterating! Loops in Javascript\n\n## CODE LISTING: DO-WHILE\n\n\
    ```javascript\nwindow.onload = function() {\n  var y=0;\n  do {\n    document.write(y\
    \ + \"<br/>\");\n    y++;\n  } while (y < 101);\n}\n```\n\nHere is the result\
    \ of the do-while loop executing in Firefox:\n\n![](img/c922782503c42c65b3a7c97e4fad8964_98_0.png)\n\
    \nScroll down and this is what you will see at the bottom of the browser:\n\n\
    ![](img/c922782503c42c65b3a7c97e4fad8964_98_1.png)\n\nIn this example, the loop\
    \ will iterate, then the condition will be evaluated. When the while-loop's continuation\
    \ condition yields FALSE, the code block will not be executed for further iterations.\n\
    \n```html\n<!DOCTYPE HTML PUBLIC \"//W3C//DTD HTML\n4.01//EN\"\n  \"http://www.w3.org/TR/html4/strict.dtd\"\
