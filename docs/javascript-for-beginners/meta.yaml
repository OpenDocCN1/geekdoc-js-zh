- md: "# QUESTIONS FOR REVIEW\n\n1. How does the while-loop function?\n\n   - a. Loops\
    \ while a certain condition is \"TRUE\".\n   - b. Loops while a certain condition\
    \ is \"FALSE\".\n   - c. Loops when the program is over.\n   - d. Loops while\
    \ another program is running.\n\n2. What loop do you use if you want to guarantee\
    \ the loop will iterate at least once before it tests the condition?\n\n   - a.\
    \ While-loop.\n   - b. Do-while loop.\n   - c. For-loop.\n   - d. If-then loop.\n\
    \n3. How does a do-while loop differ from a while-loop?\n\n   - a. The condition\
    \ is set at the beginning.\n   - b. The condition is set at the end.\n   - c.\
    \ There is no condition.\n   - d. There is no difference.\n\n# 5.2 FOR-LOOPS AND\
    \ PRACTICAL APPLICATION OF A LOOP\n\nFor-loops are compact loops that allow you\
    \ to set the variable, the condition, and the continuation condition (or counter)\
    \ within the loop command itself. They save time, are easy to decipher and create\
    \ less code in the long run.\n\nThis is what a for-loop looks like:\n\n```\nfor(var\
    \ i=100; i > -1; i=i-5)\n```\n\nThere are three elements to a for-loop command.\n\
    \n- First is the declaration of the counter variable and the assignment of its\
    \ initial value.\n\n  > In the above example, it is var i=100;\n\n- The second\
    \ part of the for-loop is the continuation condition which will determine how\
    \ many times the loop will iterate; here, the loop will iterate as long as the\
    \ variable is greater than -1, that is i >-1 in the above example.\n\n- The third\
    \ and last element of a for-loop is the “counter”. The counter determines how\
    \ the counter variable will change with each iteration of the loop. In the above\
    \ example, the loop will start from 100 and count down by fives, i=i-5, for each\
    \ iteration. Based on this, the loop will iterate—or loop—21 times.\n\nCare must\
    \ be observed when using for-loops, as it is very easy to create an infinite loop\
    \ if you set the counter incorrectly.\n\nHere is the complete code for the previous\
    \ for-loop example:\n\n# CODE LISTING: For LOOPS\n\n```\n<!DOCTYPE HTML PUBLIC\
    \ \"//W3C//DTD HTML 4.01//EN\"\n \"http://www.w3.org/TR/html4/strict.dtd\">\n\
    <html lang=\"en\">\n<head>\n <title>For Loops</title>\n</head>\n<body>\n  <script\
    \ language=\"javascript\" type=\"text/javascript\">\n    for(var i=100; i > -1;\
    \ i=i-5)\n    {\n      document.write(i + \"<br>\");\n    }\n\n    /* Endless\
    \ Loop\n    for(var i = 0; i >= 0; i++)\n    {\n      document.write(i + \"<br>\"\
    );\n    }\n    */\n  </script>\n</body>\n</html>\n```\n\nA break has been included\
    \ in the output command so that each number is displayed on the next line. Notice\
    \ in the comment portion where an example of an endless loop code is shown.\n\n\
    This is how the output will appear in a browser:\n\n| For Loops |\n|---|\n| 100\
