    );\n}\n</script>\n</body>\n</html>\n```\n\n# CHAPTER 3 SUMMARY\n\nIn chapter 3\
    \ we discussed conditional statements. We talked about the simple if condition,\
    \ the if-else-if condition and the switch-case-break statement.\n\nIn the next\
    \ chapter we will be explaining how to create dialog boxes in Javascript. Dialog\
    \ boxes can alert the user and also allow a user to enter data.\n\n# CHAPTER 4:\
    \ DIALOG BOXES\n\n- CHAPTER OBJECTIVES:\n- You will be able to create \"alert\"\
    , \"prompt\" and \"confirm\" dialog boxes.\n- You will be able to use data entered\
    \ in a dialog box in an application.\n\n## 4.1 THREE TYPES OF DIALOG BOXES\n\n\
    In this section, we are going to review the three types of dialog boxes that are\
    \ available to Javascript programmers. These dialog boxes pop up in front of the\
    \ browser windows and force the user to acknowledge them before they can continue\
    \ using the web application. Javascript dialogs are sometimes referred to as modal\
    \ dialogs since they require the user to respond before doing anything else within\
    \ the browser.\n\nThe first dialog box that we'll look at is the alert box, which\
    \ is the easiest to implement. An alert box displays a message window that shows\
    \ the strings placed or value assigned to the variable within the Javascript alert\
    \ command.\n\nThe alert box is set up by using the command alert, followed by\
    \ parentheses:\n\n```\nalert(\"Have a nice day!\");\n```\n\nCreating the alert\
    \ box is really very simple. In fact, below is the complete code listing for a\
    \ \"Have a nice day!\" alert box:\n\n```html\n<!DOCTYPE HTML PUBLIC \"//W3C//DTD\
    \ HTML 4.01//EN\"\n  \"http://www.w3.org/TR/html4/strict.dtd\"\n>\n<html lang=\"\
    en\">\n<head>\n  <title>Dialog Box - Alert</title>\n</head>\n<body>\n<script language=\"\
    javascript\" type=\"text/javascript\">\n  alert(\"Have a nice day!\");\n</script>\n\
    </body>\n</html>\n```\n\nIn the Firefox browser the alert dialog will appear as\
    \ follows:\n\n![](img/c922782503c42c65b3a7c97e4fad8964_81_0.png)\n\nIn Chrome:\n\
    \n![](img/c922782503c42c65b3a7c97e4fad8964_81_1.png)\n\nIn Internet Explorer:\n\
    \n![](img/c922782503c42c65b3a7c97e4fad8964_82_0.png)\n\nIn Opera:\n\n![](img/c922782503c42c65b3a7c97e4fad8964_82_1.png)\n\
    \nAside from the straightforward use of the alert command, an \"alert\" box can\
    \ also display string values or text through the use of a variable. Rather than\
    \ writing the string or text inside the parentheses after the *alert* function,\
    \ you instead designate the string as the value of a variable and call the variable\
    \ from the *alert* command.\n\nThe alert box in this code example displays a string\
    \ stored in a variable:\n\n```html\n<!DOCTYPE HTML PUBLIC \"//W3C//DTD HTML 4.01//EN\"\
    \n  \"http://www.w3.org/TR/html4/strict.dtd\">\n<html lang=\"en\">\n<head>\n \
    \ <title>Dialog Box - Alert</title>\n</head>\n<body>\n  <script language=\"javascript\"\
    \ type=\"text/javascript\">\n  var message= \"Have a nice day !\";\n  alert(message);\n\
    </script>\n</body>\n</html>\n```\n\nThe previous code listing will show exactly\
    \ the same output as the previous example. The second type of dialog box we'll\
    \ examine is the confirm box. A confirm box asks the user a question and then\
    \ the user supplies the answer by clicking the okay or cancel button displayed\
    \ in the dialog box. This box is a little more complicated to code than the alert\
    \ box because the user's response must be stored in a variable. Commonly this\
    \ is done via variable assignment. The variable stores TRUE or FALSE based on\
    \ the user's response. To demonstrate, let's use a variable called confirmation;\
    \ initialize its value using confirm(\" \"). Inside the double quotes, put the\
    \ text you want displayed to the user. The code looks like:\n\n```javascript\n\
    var confirmation = confirm(\"Do you want to exit?\");\n```\n\n# Chapter 4: Dialog\
    \ Boxes\n\nIf the user clicks \"OK\", the value \"TRUE\" will be stored to the\
    \ variable; conversely, if the user clicks \"Cancel\", the value \"FALSE\" will\
    \ be stored to the variable confirmation.![](img/c922782503c42c65b3a7c97e4fad8964_84_0.png)\
    \ Let's use a condition to evaluate the user's response and display a message.\
    \ We're going to create a routine that will display the string \"Exiting Application...\"\
    \ when the user selects \"OK\", and will display the string \"Staying on the Application...\"\
    \ if the user selects \"Cancel\". This is the complete code:\n\n```html\n<!DOCTYPE\
    \ HTML PUBLIC \"//W3C//DTD HTML 4.01//EN\"\n  \"http://www.w3.org/TR/html4/strict.dtd\"\
    >\n<html lang=\"en\">\n<head>\n    <title>Dialog Boxes</title>\n</head>\n<body>\n\
    \  <script language=\"javascript\" type=\"text/javascript\">\n    var confirmation\
    \ = confirm(\"Are you sure you want to exit?\");\n\n    if(confirmation)\n   \
    \ {\n      document.write(\"Exiting Application...\");\n    }\n    else\n    {\n\
    \      document.write(\"Staying on the Application...\");\n    }\n  </script>\n\
    </body>\n</html>\n```\n\nThis is a screenshot of the confirm box in Chrome:![](img/c922782503c42c65b3a7c97e4fad8964_85_0.png)\
    \ This is the result when “OK” is clicked:![](img/c922782503c42c65b3a7c97e4fad8964_85_1.png)\
    \ This is the result when “Cancel” is clicked:![](img/c922782503c42c65b3a7c97e4fad8964_85_2.png)\n\
    \nThe third type of dialog box is called a **prompt dialog box**. The prompt dialog\
    \ box allows the user to input data. Similar to a confirm dialog box, the prompt\
    \ dialog box will also require the use of a variable to store the user’s response.\n\
    \nFor our example, we can use the prompt dialog box to ask the user's age. The\
    \ user then types their response inside the dialog box. The variable age will\
    \ hold the value of whatever the user input. The command to implement the prompt\
    \ dialog box would be:\n\n```javascript\nvar age = prompt(\"What is your age\"\
    , \"\");\n```\n\nNotice that there are two sets of quotation marks inside the\
    \ parentheses. (These are sometimes referred to as arguments.) The second set\
    \ of quotations allows the developer to supply a default value for the dialog\
    \ box if they desire. After the user responds to the prompt dialog, the program\
    \ should display the string \"You are _ years old\", the blank being replaced\
    \ by the value the user enters. Secondly, we'd like it to display on the next\
    \ line \"You can vote\" if the age entered is 18 and above. The complete code\
    \ listing looks like this:\n\n# CODE LISTING: DIALOG BOXES\n\n```html\n<!DOCTYPE\
    \ HTML PUBLIC \"//W3C//DTD HTML 4.01//EN\"\n  \"http://www.w3.org/TR/html4/strict.dtd\"\
    >\n<html lang=\"en\">\n<head>\n  <title>Dialog Boxes</title>\n</head>\n<body>\n\
    \  <script language=\"javascript\" type=\"text/javascript\">\n\n    var age =\
    \ prompt(\"What is your age\", \"\");\n    document.write(\"You are \" + age +\
    \ \" years old\");\n\n    if(age >18)\n    {\n      document.write(\"<br/>You\
    \ can vote!\");\n    }\n  </script>\n</body>\n</html>\n```\n\nThis is how the\
    \ output of the above code will appear:![](img/c922782503c42c65b3a7c97e4fad8964_87_0.png)\
    \ After keying in the value, this is what gets displayed:![](img/c922782503c42c65b3a7c97e4fad8964_87_1.png)\n\
    \n# Chapter 4: Dialog Boxes\n\n# QUESTIONS FOR REVIEW\n\n- 1. What does the alert\
    \ box do?\n   - a. Sends a message in the browser that requires no response from\
    \ the user.\n   - b. Sends a message in the browser that requires a response from\
    \ the user.\n   - c. Sends a message in the webpage that requires a response from\
    \ the user.\n   - d. Sends a message in the webpage that requires no response\
    \ from the user.\n\n- 2. Which dialog box gives users the ability to respond by\
    \ clicking the \"okay\" or \"cancel\" buttons?\n   - a. Alert\n   - b. Confirm\n\
    \   - c. True\n   - d. Prompt\n\n- 3. What box allows the user to enter a string\
    \ of data?\n   - a. Alert\n   - b. Confirm\n   - c. True\n   - d. Prompt\n\n#\
    \ CHAPTER 4 LAB EXERCISE\n\nCreate a basic HTML document structure. In the document\
    \ body, add script tags with the appropriate attributes to add Javascript code.\n\
    \n1) Using the correct dialog box code, create a box that contains the text \"\
    What is your dog's age in human years?\" The user should be able to type their\
    \ response directly into the dialog box.\n\nStore the user's response in a variable\
    \ called dogAgeInHumanYears.\n\nMultiply the dogAgeInHumanYears value by seven\
    \ and store in a variable dogAgeInDogYears.\n\n2) Use an alert() dialog box to\
    \ output the result with the text \"Your dog is X years old in dog years.\"\n\n\
    3) After the user acknowledges the alert() box, another dialog should appear and\
    \ ask the user \"Shall I exit the program?\" This dialog should display two buttons\
    \ allowing the user to either confirm or cancel."
