    # 5.1 WHILE-LOOPS AND DO-WHILE LOOPS


    In this section we will be discussing loops. Loops are important facets of any
    programming language. With loops you can repeat a certain code block, allowing
    code to repeatedly execute until a satisfactory condition is met. Every time the
    code is executed, it is referred to as an iteration through the loop.


    Loops are great for a number of tasks when programming, including receiving user-input
    data or causing a program to read, parse, and output a lengthy document.


    In this section we are going to review while-loops and do-while loops. To demonstrate
    loops, let''s create a loop that will output the series of numbers from one to
    100.


    We''ll start with the while-loop.


    A while-loop is similar to a conditional statement in the sense that it evaluates
    a condition in the program and if the condition is "TRUE", the code block associated
    with the loop will run.


    We must start by identifying a loop counter variable. Let''s use x. With each
    iteration of the loop, the counter will be compared within a continuation condition.
    If that condition evaluates as TRUE, the loop will continue to iterate. If it
    evaluates as FALSE the loop will cease running. If you set up a loop where the
    continuation condition is always true, you would be creating an infinite loop
    that will eventually crash your program. For this example, the variable declared
    is x and its value set to'
  merge: -1
  pgno: 94
- img_proc: true
  md: "so that the loop iterates 100 times. The syntax for the while-loop is:\n\n\
    ```\nvar x=1;\nwhile (continuation condition)\n{\n  ...code to execute\n}\n```\n\
    \nA specific example it is:\n\n```\nwhile (x < 101)\n```\n\nFollowing this line\
    \ is a code block which describes what to do if the condition in the while-statement\
    \ is \"TRUE\". Let us instruct the program to write or display the value of the\
    \ variable x. The command set would look like this:\n\n```\n{\ndocument.write\
    \ (x + \"<br/>\");\n```\n\nWe concatenated a line break tag to the output to keep\
    \ it readable and neat.\n\nIncreasing the value of the variable x by one will\
    \ change the value of the variable with each iteration of the loop. To increment\
    \ x, the code should read:\n\n```\nx++;\n```\n\nAfter each iteration of the loop,\
    \ the Javascript interpreter will test the value of x in the continuation condition.\
    \ In this case, the loop will continue iterate if x < 101 evaluates as true. Once\
    \ the value of x reaches 101, the continuation condition will evaluate as FALSE\
    \ and the loop will cease.\n\nThis is how the complete loop is coded:"
