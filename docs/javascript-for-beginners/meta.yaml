    \ to discuss comparison operators and how they work in conjunction with the if-statement\n\
    \nThis is how the if-statement condition is written:\n\n```\nif (age >= 18)\n\
    ```\n\nIn the above if-statement, the >= symbols found is what we call **comparison\
    \ operator**. It is read as \"greater than or equal to\". We used the \"greater\
