  md: '# Splice


    The final array method we will discuss splice. Splice allows removal of objects
    or array members anywhere within the array. Using this function, the index location
    of the first object and number of items to be removed must be indicated. The syntax
    for use with the splice function is:


    ```

    arrayName.splice(index number of first item to be removed, number of objects to
    be removed);

    ```


    Example:


    ```

    placesToVisit.splice(0, 2);

    ```


    The example shown will access the array named placesToVisit and will perform the
    function splice on the first and second element of the array: placesToVisit[0]
    and placesToVisit[1].


    The chapter lab exercise will demonstrate the combined use of array methods. It
    is a good idea to try practicing with your own array data so you can get used
    to manipulating arrays.'
