  md: '# ANSWER KEY: JAVASCRIPT FOR BEGINNERS


    # Chapter 1.1 Introducing the Course


    +   1. Is Javascript run on Client side or Server side?

    Answer: b. Client side


    +   2. Javascript is defined as:

    Answer: c. A scripting language used to add interactivity to web pages


    # Chapter 1.2 Hello World in Javascript


    +   1. What two items do you need to begin programming in Javascript?

    Answer: d. A web browser and a text editor.


    +   2. What command in Javascript outputs text to the browser?

    Answer: b. document.write


    +   3. What tag do you use within the Javascript command to separate lines in
    the browser?

    Answer: a. <br>


    # Chapter 1.3 Where to Put Javascript


    +   1. What''s the best Javascript component to put into the head of your document?

    Answer: c. A function


    +   2. When If wanted to create a Javascript function called sayGo, where would
    you have to put it into the code?

    Answer: a. function sayGo()


    +   3. What attribute do you use to load an external Javascript file?

    Answer: a. src=***js


    +   4. Which of the following is not a place you can put Javascript?

    Answer: d. foot of the document'
