    # CHAPTER 6 SUMMARY


    In Chapter 6, we discussed functions in Javascript. Functions are blocks of code
    that can be called from a page and reused as many times as needed. You learned
    how to create functions within a page and attach them in a separate file, which
    allowed greater flexibility in using functions across multiple web pages.


    You also learned how to pass values to a function and return values to the function
    caller. We discussed how to manipulate the values that were sent to the function
    and return the new values.


    We also covered how to use events to trigger functions. Here, we taught how to
    use the onclick, onload, onmouseover and onunload events.


    In the next chapter, we will be focusing on creating and manipulating arrays.'
