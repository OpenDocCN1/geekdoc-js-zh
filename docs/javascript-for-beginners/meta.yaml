  md: '# APPENDIX A:

    SUMMARY OF COMMANDS AND FUNCTIONS TABLE


    | Command/Function Listed by Category | Description |

    |---|---|

    | HTML tags: | |

    | `<html> </html>` | HTML root tag |

    | `<head> </head>` | used to indicate that the tag pertains to the head of the
    HTML page |

    | `<title> </title>` | used to contain the title of the document and found within
    the head |

    | `<body> </body>` | used to indicate that the tag pertains to the body of the
