    # # CHAPTER 3 CONDITIONAL STATEMENTS


    +   CHAPTER OBJECTIVES:

    * You will understand how conditional statements work.

    * You will be able to use if-statements.

    * You will be able to implement if-else-if statements.

    * You will be able to create switch-case-break statements.


    # ## 3.1 Simple Conditionals


    As you develop more complex Javascript programs, it will become important that
    your programs are able to make decisions. These decisions are expressed as condicionals.
    In this chapter, we are going to create programs with condicionals.


    Conditional statements let your program make some basic criteria-based decisions
    and do what is called branching. Conditional statements simply allow the program
    to run certain code testing whether a condition is either true or false and react
    accordingly.


    Let''s start with the simplest conditionals set, the if-statement.


    The if conditionals works this way: if the condition is true, the program will
    run a selected code block; if the condition is false, the code is not executed.


    > Conditional Statements:

    - If true, the select code will run.

    - If false, the select code will NOT run.


    Create a basic HTML document and include the <script> tags. Next, within the script
    tags, declare a variable named age and initialize its value to 18.


    We''re going to write a short Javascript program that determine whether someone
    is eligible to vote. In the US, the voting age is 18. We''re going to test the
    variable age for voting eligibility. The condition should be: if the age is equal
    to 18 or above, the program will execute code to display the output "You can vote".
    If the age is less than 18, the code will not be executed. The basic document
    structure with the script tags should look like this:'
