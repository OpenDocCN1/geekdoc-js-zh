    \ type=\"text/javascript\">\n\n  var playerScore=25000;\n  var highScore=10000;\n\
    \n  if(playerScore > highScore) {\n    //Player has high score\n    highScore\
    \ = playerScore;\n  }\n  document.write(\"You attained the high score!\");\n \
    \ } else\n```\n\n```\n{\n  document.write(\"You did not attain the high score.\"\
    );\n}\n</script>\n</body>\n</html>\n```\n\nThis is how the output of the above\
    \ code will look when viewed in the browser:\n\n![](img/c922782503c42c65b3a7c97e4fad8964_64_0.png)\n\
    \nThe if-else combination is very useful when you have an either/or situation.\
    \ However, if you want to create a situation that contains several conditions,\
    \ you can use a series of if-else-if statements.\n\nIn this example, we will practice\
    \ the use of several conditions. The best practice set for this is a grading scheme.\n\
    \nCase 1: Create a program that will display the equivalent letter grade of students.\n\
    \nYou will need two variables: numericalGrade and letterGrade. numericalGrade\
    \ will be a numerical variable and letterGrade will carry a string.\n\nThis is\
    \ how the conditional statement should be written:\n\n```\nif(numericalGrade >=\
    \ 90)\n{\n  letterGrade = \"A\";\n}\nelse if(numericalGrade >= 80)\n```\n\nFirst,\
    \ the numericalGrade >= 90 is being evaluated. If it is TRUE, the value \"A\"\
    \ will be placed in letterGrade. However, if the numericalGrade is FALSE, the\
    \ program moves on to the next statement. This is because the numericalGrade >=\
    \ 90 is the only option for \"A\". This is displayed to the user.\n\n# CODE LISTING:\
    \ IF-ELSE EXAMPLES\n\n```\n<!DOCTYPE HTML PUBLIC \"//W3C//DTD HTML 4.01//EN\"\n\
    \"http://www.w3.org/TR/html4/strict.dtd\">\n<html lang=\"en\">\n<head>\n  <title>Conditionals\
    \ with Else</title>\n</head>\n<body>\n  <script language=\"javascript\" type=\"\
    text/javascript\">\n    var numericalGrade=95;\n    var letterGrade;\n\nif(numericalGrade\
    \ >= 90)\n{\n    letterGrade = \"A\";\n} else if(numericalGrade >= 80)\n{\n  \
    \  letterGrade = \"B\";\n} else if(numericalGrade >= 70)\n{\n    letterGrade =\
    \ \"C\";\n} else if(numericalGrade >= 60)\n{\n    letterGrade = \"D\";\n} else\n\
    {\n    letterGrade = \"F\";\n}\n\ndocument.write(\"<br/>Your grade is \" + letterGrade);\n\
    \n</script>\n</body>\n</html>\n```\n\nThis is how the output will appear when\
    \ viewed:\n\n![](img/c922782503c42c65b3a7c97e4fad8964_66_0.png)\n\nCreate a program\
    \ that will determine and display a student's equivalent letter grade followed\
    \ by the remark if the student passed, is conditional or failed. Use the following\
    \ grades obtained and table of equivalent grades and remarks:\n\nGrades obtained:\
    \ 88, 75, 40, 65, 95.\n\n| Grade | Equivalent Letter Grade | Remarks |\n|---|---|---|\n\
    | 90 & up | A | Passed |\n| 80-89.99 | B | Passed |\n| 70-79.99 | C | Passed |\n\
    | 60-69.99 | D | Conditional |\n| 59 & below | F | Failed |\n\nThis is how the\
    \ output should look when viewed in the browser:\n\nWhen numericalGrade is 88:\n\
    \n```\nYour grade is B and you Passed.\n```\n\nWhen numericalGrade is 75:\n\n\
    ```\nYour grade is C and you Passed.\n```\n\nWhen numericalGrade is 40:\n\n```\n\
    Your grade is F and you Failed.\n```\n\nWhen numericalGrade is 65:\n\n```\nYour\
    \ grade is D and you are Conditional.\n```\n\nWhen numericalGrade is 95.6:\n\n\
    ```\nConditionals with Else\nYour grade is A and you Passed.\n```\n\nFIGURE 3\n\
    \n# CODE LISTING: LAB SOLUTION\n\n```\n<!DOCTYPE HTML PUBLIC \"//W3C//DTD HTML\
    \ 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html lang=\"en\">\n\
