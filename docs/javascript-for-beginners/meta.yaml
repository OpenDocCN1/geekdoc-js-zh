    Iteration: 4\n55\nIteration: 5\n92\nIteration: 6\n88\nIteration: 7\n77\nIteration:\
    \ 8\n91\nIteration: 9\n91\n```\n\nLet's take a look at some of the methods you\
    \ can use with array objects. If you want more complete reference for the array\
    \ object, visit javascript which contains comprehensive listing of properties\
    \ and methods.\n\nWe'll take a look at the push method first. Push is a function\
