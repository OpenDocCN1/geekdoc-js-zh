    # 关于作者


    Mark Lassoff 的父母经常声称 Mark 天生就是当程序员。在 20 世纪 80 年代中期，社区的孩子在外面玩踢球和扔雪球时，Mark 正埋头于在他的
    Commodore 64 上用 BASIC 编程语言编写游戏。计算机和编程在大学期间仍然是他浓厚的兴趣，他在大学主修传播学和计算机科学。完成大学学业后，Mark
    曾在几家大型企业的软件和 Web 开发部门工作过。


    2001 年，出于一时兴起，当他的同龄人都在征服互联网世界时，Mark 接受了一个职位——在德克萨斯州奥斯汀的一家技术培训中心培训程序员。正是在那里他爱上了教授编程。


    过去的 10 年里，教授编程一直是 Mark 的热情所在。如今，Mark 是一位顶尖的技术培训师，在全国为软件和 Web 开发人员提供培训。Mark 的培训客户包括国防部、洛克希德·马丁、发现卡服务公司和凯平永久医疗。Mark
    的客户给他的课程评分为 9.81/10，在参与者评估中一直获得满分。


    除了传统的课堂培训外，Mark 还是备受青睐视频培训师和主持人。他曾为多家出版社编写并主持视频课程，包括他自己的公司 LearnToProgram.tv,
    Inc.。Mark 编写了 15 多门在线课程，学生来自美国全部 50 个州和 47 多个国家。


    他住在康涅狄格州哈特福德附近一个有 150 年历史的改造纺织厂里。


