    More than one condition can also be associated with the if-statement. When you
    have multiple conditions within an if-statement, the statement is known as a complex
    conditional. There are two logical comparison operators that can be used to join
    conditions together.


    The first logical comparison operator is the double ampersand && which evaluates
    a logical AND comparison. It tests whether the value of the two conditions are
    both true. If they are, then the if-statement is evaluated as TRUE and the code
    following the if-statement is executed.


    Here is how the logical AND operator looks when used in conjunction with the if-statement.'
