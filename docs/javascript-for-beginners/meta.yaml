    | Iteration 5 | 92 |\n| Iteration 6 | 88 |\n| Iteration 7 | 77 |\n| Iteration\
    \ 8 | 91 |\n| Iteration 9 | 91 |\n| Iteration 10 | 100 |\n| Iteration 11 | 63\
    \ |\n| Array length after PUSH | 12 |\n\nNotice the two new values—100 and 63,\
    \ added at the end of the list—and the new array length at the bottom that indicates\
    \ 12.\n\nClosely related to the push method is another function called pop. Pop\
    \ simply removes the last element of the array. In the previous example, if the\
    \ code `grades.push(100, 63)` added 100 and 63 to the bottom list of the array\
    \ (63 being the last entry), the instruction `grades.pop()` right after `grades.push(100,\
    \ 63)` will bump off 63 from the array list, leaving 100 as the last entry and\
    \ leaving \"63\" in a temporary memory storage, awaiting a \"return\".\n\nAssigning\
    \ the popped object to a declared variable will catch the awaiting value which\
    \ later may be reused for another purpose or routine. To demonstrate how that\
