    \ is TRUE, then we want the string \"You can vote\" to be displayed.\n\nBelow\
    \ is the code set that will display the message \"You can vote\" followed by a\
    \ line break. This is executed when the condition evaluates to a TRUE value.\n\
    \n```\nif (age>=18)\n{\n  document.write(\"You can vote<br/>\");\n}\n```"
