  md: "# 7.2 Manipulating Arrays\n\nAs you work with arrays you'll frequently find\
    \ it necessary to manipulate the data stored within the array. In Javascript,\
    \ as with most contemporary programming languages, an array is an object. Language\
    \ objects have properties that describe the object—like length—and they have methods\
    \ (sometimes also called functions—just to confuse you) that allow you to manipulate\
    \ the object. In this section we'll look at some of the available properties and\
    \ methods of the array object.\n\nTake a look at the following example. We have\
    \ an array that contains 10 values representing test grades. For simplicity, we\
    \ use the variable name grades. The values contained by the variable grades are\
    \ as follows: 85, 92, 70, 63, 55, 92, 88, 77, 91, and 91, for a total of 10 array\
    \ members.\n\nLet's see what happens when we attempt to display the 12th member\
    \ of the array—which would be located in the non-existent 11th index—expressed\
    \ in code as grades[11].\n\nType the following code listing in your editor and\
    \ view the output.\n\n# CODE LISTING: LITERAL ARRAY DISPLAYING AN OBJECT IN THE\
    \ ARRAY—OBJECT OUT OF RANGE\n\n```\n<DOCTYPE html>\n<html>\n<head>\n<title>Literal\
    \ Array</title>\n</head>\n<body>\n<script language=\"javascript\" type=\"text/javascript\"\
    >\n  var grades = [85, 92, 70, 63, 55, 92, 88, 77, 91, 91]\n  document.write (grades[11]);\n\
    </script>\n</body>\n</html>\n```"
