- md: "The second method we are going to examine is charCodeAt(), which is used to\
    \ display the Unicode value for a character at a particular index within a string.\
    \ To demonstrate this, we simply append the following additional document.write\
    \ command, containing the charCodeAt() function, right underneath the first document.write\
    \ line in the for-loop routine:\n\n```\ncharCodeAt()\n```\n\n```javascript\ndocument.write(\"\
    \ | \" + phrase.\ncharCodeAt(i);\n```\n\nThis method will display the Unicode\
    \ value for each of the characters, including the space. Here is what the complete\
    \ code should look like:\n\n# CODE LISTING: THE STRING OBJECT charCodeAt()\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>The String Method charCodeAt()</title>\n\
    </head>\n<body>\n<script language=\"javascript\" type=\"text/javascript\">\nvar\
    \ phrase = \"If you are strong enough, there are no precepts.\";\n\nfor (var i=0;\
    \ i < phrase.length; i++) {\n  document.write(i + \": \" + phrase.charCodeAt(i));\n\
    \  document.write(\" | \" + phrase.charCodeAt(i));\n  document.write(\"</br>\"\
    );\n}\n</script>\n</body>\n</html>\n```\n\nNotice that the output displayed the\
    \ letter at the string index first, followed by the pipe symbol (|) then by the\
    \ corresponding Unicode of the character string:\n\n| 0: I | 73 | 25: i | 32 |\n\
    | 1: f | 102 | 26: t | 116 |\n| 2: l | 32 | 27: h | 104 |\n| 3: y | 121 | 28:\
    \ e | 101 |\n| 4: o | 111 | 29: r | 114 |\n| 5: u | 117 | 30: c | 101 |\n| 6:\
    \ l | 32 | 31: l | 32 |\n| 7: a | 97 | 32: a | 97 |\n| 8: r | 101 | 33: r | 114\
    \ |\n| 9: e | 102 | 34: c | 101 |\n| 10: l | 32 | 35: l | 32 |\n| 11: s | 115\
    \ | 36: n | 110 |\n| 12: t | 116 | 37: o | 111 |\n| 13: r | 114 | 38: l | 32 |\n\
    | 14: o | 111 | 39: p | 112 |\n| 15: n | 110 | 40: r | 114 |\n| 16: g | 103 |\
    \ 41: e | 101 |\n| 17: t | 32 | 42: c | 99 |\n| 18: e | 101 | 43: e | 101 |\n\
    | 19: n | 110 | 44: d | 100 |\n| 20: o | 111 | 45: e | 101 |\n| 21: u | 117 |\
    \ 46: n | 110 |\n| 22: g | 103 | 47: t | 116 |\n| 23: h | 104 | 48: s | 115 |\n\
    | 24: l | 44 | 49: l | 146 |\n\nUnicode values can be used if one plans to alphabetize\
    \ a series of string characters. Hint: lowercase characters have lower values\
    \ than their uppercase counterparts.\n\nA third method that we're going to look\
    \ at is indexOf(), which is used to find the first occurrence of a particular\
    \ character within a string. For example, let's find out the index of the first\
    \ lowercase \"s\" in the quote \"If you are strong enough, there are no precedents.\"\
    \n\nUsing document.write, the command line for the function would be:\n\n```javascript\n\
    document.write(\"Index of s: \" + phrase.indexOf('s'));\n```\n\nWrite this command\
    \ line just outside the function routine before the closing script tag. The complete\
    \ code listing is:\n\n# CODE LISTING: THE STRING OBJECT INDEXOF()\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>The String Method indexOf()</title>\n\
    </head>\n<body>\n<script language=\"javascript\" type=\"text/javascript\">\nvar\
    \ phrase = \"If you are strong enough, there are no precepts.\";\n\nfor (var i=0;\
    \ i < phrase.length; i++) {\n  document.write(i + \": \" + phrase.charAt(i));\n\
    \  document.write(\" | \" + phrase.charCodeAt(i));\n}\ndocument.write(\"<br>\"\
    );\ndocument.write(\"Index of s: \" + phrase.indexOf('s'));\n</script>\n</body>\n\
    </html>\n```\n\nThe upper portion of the output would still look the same since\
    \ we did not change the program. However, you will notice that at the bottom,\
    \ a new output line is displayed. This is the output of the indexOf() method.\
    \ See the following images:\n\nThis image shows what you see when you scroll further:\n\
    \n| 31: | 32 | 32: a | 97 |\n| 33: r | 114 | 34: c | 101 |\n| 35: | 32 | 36: n\
    \ | 110 |\n| 37: o | 111 | 38: | 32 |\n| 39: p | 112 | 40: r | 114 |\n| 41: c\
    \ | 101 | 42: c | 99 |\n| 43: c | 101 | 44: d | 100 |\n| 45: c | 101 | 46: n |\
    \ 110 |\n| 47: t | 116 | 48: s | 115 |\n| 49: | 46 | Index of s: 11 |\n\nNotice\
    \ that the result of the indexOf() command is shown at the bottom of the display\
    \ window. The method returns -1 if the specified text is not found.\n\nThe fourth\
    \ method we will introduce is **replace()**. This is used to replace a selected\
    \ set of characters with a set of different characters, but does not alter the\
    \ original string in the memory.\n\n```javascript\nreplace()\n```\n\nFrom the\
    \ previous example, let's replace the word \"strong\" with \"attractive\". The\
    \ command syntax for replace() when used in the example would be:\n\nThe complete\
    \ code listing using replace() would be:\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>The String Method replace()</title>\n</head>\n<body>\n  <script\
    \ language=\"javascript\" type=\"text/javascript\">\n    var phrase = \"If you\
    \ are strong enough, there are no precedents.\";\n    document.write(phrase);\n\
    \    document.write(\"</br><br>\");\n    document.write(\"After using the replace()\
    \ method:<br><br>\");\n    document.write(phrase.replace(\"strong\",\"attractive\"\
    ));\n    document.write(\"</br><br>\");\n    document.write(\"Invoking the command\
    \ document.write(phrase) without another replace() instruction, the result is:</br><br>\"\
    );\n    document.write(phrase);\n  </script>\n</body>\n</html>\n```\n\nThe output\
    \ might look like this:\n\nNotice how the content of the variable *phrase* was\
    \ left unchanged even if the method `replace()` has been introduced. It did not\
    \ change the variable's content in the memory, but instead merely affected the\
    \ displayed value superficially.\n\nThis time, let's create a string variable\
    \ *names* whose value is a series of names separated by commas:\n\n```javascript\n\
    var names = \"Jack, Jill, John, Jane, Johnny\";\n```\n\nThis is just a string\
    \ with commas in it. Using this string set, let us introduce and demonstrate the\
    \ last method we're going to look at called split(), which we will use to convert\
    \ the string contained by *names* into an array.\n\nTo split the string, another\
    \ variable must be introduced to hold the resulting array. Let us use *moreNames*\
    \ to catch the returned array after implementing the `split()` method on the original\
    \ string variable *names*. This is how the code should appear:\n\n```javascript\n\
    var names = \"Jack, Jill, John, Jane, Johnny\"; var moreNames = names.split(\"\
    ,\");\n```\n\nNotice that within the split method's parentheses we placed a comma.\
    \ This argument indicates to the split method what character we want as a delimiter.\
    \ The elements of the resulting array will be split on the limiting character.\n\
    \nNext, we'll introduce a for-loop to iterate through the new moreNames array.\
