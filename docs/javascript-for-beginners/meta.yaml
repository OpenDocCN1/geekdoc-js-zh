  md: '2. What does the comparison operator ">=" mean?

    Answer: b. Greater than or equal to


    3. What does the comparison operator "!=" mean?

    Answer: a. Not equal to


    4. What comparison operator would you use to create a compound statement which
    will logically "AND” two statements?

    Answer: d. &&


    # Chapter 3.2 If-Else-If Statements


    1. What does an else statement do?

    Answer: c. Execute the next statement if the original conditional statement is
    false.


    2. If you create an if-else-if statement, what happens when the conditional statement
    is true?

    Answer: c. The program stops evaluating other conditionals and moves on


    3. Using variable studentgrade, how would you write a statement that tells us
    a student with a grade higher than 59 passes and those with a grade of 59 or lower
    fails?

    Answer: c. if (studentgrade>=59) {document.write("You passed"); } else {document.write("You
    failed"); };


    # Chapter 3.3 Switch-Case-Break Statements


    1. What is a good definition of what a switch statement does?

    Answer: b. Tests one condition case to see if it is true, else it seeks other
    conditions down the series until it encounters the default case.


    2. What does the default case do?

    Answer: c. Runs when nothing matches.


    3. What happens if you forget a break statement after a case?

    Answer: d. The program executes the other cases until a break is reached.'
