    \n## 第 4 章总结\n\n在本章中，我们讨论了如何使用 Javascript 创建在浏览器窗口中弹出的对话框。你学习了如何实现 `prompt`、`confirm`\
    \ 和 `alert` 框。\n\n我们还讨论了如何使用 `prompt` 和 `confirm` 框中用户提供的数据在网站上输出字符串。你学习了如何使用条件语句，在点击\
    \ confirm 框中的响应后在浏览器中显示字符串输出。\n\n在第 5 章中，我们将讨论如何使用 Javascript 创建循环。循环是任何语言编程中最重要的方面之一。\n\
    \n## 第 5 章：我们现在开始迭代了！Javascript 中的循环\n\n章节目标：\n\n- 你将能够实现 while 循环和 do-while 循环。\n\
    - 你将能够创建 for 循环。\n- 你将能够在实际情况或案例中应用循环。\n\n## 5.1 WHILE 循环和 DO-WHILE 循环\n\n在本节中，我们将讨论循环。循环是任何编程语言的重要方面。通过循环，你可以重复某个代码块，允许代码重复执行直到满足满意的条件。代码每执行一次，就被称为循环的一次迭代。\n\
    \n在编程时，循环对于许多任务都非常有用，包括接收用户输入数据或导致程序读取、解析和输出一份长篇文档。\n\n在本节中，我们将回顾 while 循环和 do-while\
    \ 循环。为了演示循环，让我们创建一个输出从 1 到 100 数字序列的循环。\n\n我们将从 while 循环开始。\n\nwhile 循环与条件语句相似之处在于，它会评估程序中的一个条件，如果条件为“TRUE”，则运行与循环相关的代码块。\n\
    \n我们必须首先识别一个循环计数器变量。让我们使用 x。在循环的每次迭代中，计数器将在持续条件内进行比较。如果该条件评估为 TRUE，循环将继续迭代。如果评估为\
    \ FALSE，循环将停止运行。如果你设置了一个持续条件始终为真的循环，你就会创建一个无限循环，最终会导致你的程序崩溃。在这个示例中，声明的变量是 x，其值设置为，以便循环迭代\
    \ 100 次。while 循环的语法如下：\n\n```javascript\nvar x=1;\nwhile (continuation condition)\n\
    {\n  ...要执行的代码\n}\n```\n\n一个具体的例子是：\n\n```javascript\nwhile (x < 101)\n```\n\n\
    紧接这一行之后是一个代码块，描述了如果 while 语句中的条件为“TRUE”时该做什么。让我们指示程序写入或显示变量 x 的值。命令集如下：\n\n```javascript\n\
    {\ndocument.write (x + \"<br/>\");\n```\n\n我们在输出中拼接了一个换行标签以保持其整洁。\n\n在循环的每次迭代中增加变量\
    \ x 的值。要递增 x，代码应该是：\n\n```javascript\nx++;\n```\n\n在循环的每次迭代后，Javascript 解释器将测试持续条件中的\
    \ x。在这种情况下，如果 x < 101 为真，循环将继续迭代。当 x 的值达到 101 时，持续条件将评估为 FALSE，循环将停止。\n\n这是完整循环的代码方式：\n\
    \n## 代码列表：WHILE 循环\n\n```javascript\nvar x=1;\nwhile(x < 101)\n  {\n    document.write(x\
    \ + \"<br/>\");\n  }\n```\n\nx 的值与 101 进行比较，因为如果它是 100，循环将迭代到 99。完整代码如下：\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <title>While-Loop</title>\n</head>\n<body>\n\
    \  <script language=\"javascript\" type=\"text/javascript\">\n    var x = 1;\n\
    \    while (x < 101)\n    {\n      document.write(x + \"<br/>\");\n      x++;\n\
    \    }\n  </script>\n</body>\n</html>\n```\n\nx 的值与 101 进行比较，因为如果它是 100，循环将迭代到\
    \ 99。完整代码如下：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>While-Loop</title>\n\
    </head>\n<body>\n  <script language=\"javascript\" type=\"text/javascript\">\n\
    \    var x = 1;\n    while (x < 101)\n    {\n      document.write(x + \"<br/>\"\
    );\n      x++;\n    }\n  </script>\n</body>\n</html>\n```\n\nx 的值与 101 进行比较，因为如果它是\
    \ 100，循环将迭代到 99。完整代码如下：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>While-Loop</title>\n\
    </head>\n<body>\n  <script language=\"javascript\" type=\"text/javascript\">\n\
    \    var x = 1;\n    while (x < 101)\n    {\n      document.write(x + \"<br/>\"\
    );\n      x++;\n    }\n  </script>\n</body>\n</html>\n```\n\n## While-循环\n\n```\n\
    1\n2\n3\n4\n5\n6\n7\n8\n9\n```\n\n![](img/c922782503c42c65b3a7c97e4fad8964_97_0.png)\n\
    \n向下滚动，你会在浏览器底部看到：\n\n```javascript\n1\n2\n3\n4\n5\n6\n7\n8\n9\n```\n\ndo-while\
    \ 循环的工作方式与 while 循环相似，do-while 循环的区别在于是在循环结束测试条件。这意味着即使初始条件为假，它也保证至少迭代一次。\n\n\
    ## 第 5 章：我们现在开始迭代了！Javascript 中的循环\n\n## 代码列表：DO-WHILE\n\n```javascript\nwindow.onload\
    \ = function() {\n  var y=0;\n  do {\n    document.write(y + \"<br/>\");\n   \
