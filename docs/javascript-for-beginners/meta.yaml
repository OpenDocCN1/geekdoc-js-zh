  md: '# 2.2 Variable Operators


    In this section we are going to discuss variable operators. Once again, start
    with an HTML 4.01 file, and make sure you include a <script> tag to indicate to
    the browser that we are using Javascript. First, we need to declare two variables
    as `operandOne` and `operandTwo`. These two variables will be assigned the values
    125 and 15.371, respectively.


    Note that they are two distinct value types. The variable `operandOne` holds the
    **integer number** 125, while the variable `operandTwo` contains the **floating
    point number** 15.371. A floating point number is capable of holding numbers with
    decimal points.


    ```

    operandOne = 125;

    operandTwo = 15.371;

    ```


    In other programming languages, you would normally have to declare the specific
    variable type—you have to tell the program if you are using an integer or a floating
    point number. However, Javascript automatically understands what variable type
    you are creating the moment you assign its value. There is no need to explicitly
    specify which type of variable you are using.


    With our variables defined and initialized, we can have them displayed as output
    using the `document.write()` command. Since you are instructing that the program''s
    output be whatever the variable contains, you do not need quotation marks. Let
    us display the two values on two different lines. The code should be written as
    follows:


    ```

    document.write (operandOne);

    document.write("<br/>");

    document.write (operandTwo);

    ```


    We can also perform arithmetic operations with our variables. To add the two numbers
    together, we use the addition operator "+". If we want the sum of the two variables
    displayed, then our code should be:


    ```

    document.write("The sum is " + (operandOne + operandTwo))

    ```'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'The addition operator is used twice in this example. The plus (+) sign has
    two purposes in JavaScript—it can be used as a string concatenation operator,
    and also as an addition operator. When we write operandOne + operandTwo, we are
    using it to add the two variables.


    Concatenation, on the other hand, is also an important operation in any programming
    language. In JavaScript, concatenation joins two strings or values. In the context
    of this example, we are concatenating (placing next to each other) the string
    value “The sum is” to the sum of the two variables. The addition operator is placed
    within its own parentheses so the program understands that it is a separate operation
    from the concatenation.


    Here is a list of the variable operators you can use and how they function:


    | Operator | Symbol | Function |

    | --- | --- | --- |

    | Addition | + | Adds variables together and concatenates strings and other values.
    |

    | Subtraction | - | Subtracts the value of one variable from another. |

    | Multiplication | * | Multiplies variables. |

    | Division | / | Divide one variable from another. |

    | Modulus | % | Outputs the remainder of the division operation. |

    | Increment | ++ | Adds one to the value of the variable. |

    | Decrement | -- | Subtracts one from the value of the variable. |


    The increment and decrement operators function by increasing and decreasing, respectively,
    the value of the variable by one.


    There are two ways to use the increment and decrement operators. When the operator
    is placed after the variable, it is called a postfix operator. This means that
    the mathematical expression is evaluated and then the increment takes place.


    The second method is when the operator is placed before the variable; it is called
    a prefix operator. In this situation, the increment takes place first, after which
    the mathematical operation is performed. Prefix and'
