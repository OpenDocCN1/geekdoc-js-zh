    either side of the OR operator is TRUE; if yes, the whole statement is TRUE |

    | Conditionals: | |

    | If | If the conditions/expressions are TRUE, then the codes/program routine
    below the if statement are run/executed, otherwise, they are not executed |

    | If-Else | If the conditions/expressions are TRUE, then the codes/program routine
    below the if statement are run/executed, otherwise it executes the other code/program
    routine |

    | If-Else-If | If the conditions/expressions are TRUE, then the codes/program
    routine below the if statement are run/executed, otherwise it executes the rest
    of the other code/program routines until it finds a condition that satisfies |

