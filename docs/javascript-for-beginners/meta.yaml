    \ and server side technologies.\n\n**Client Side Technologies:** These refer to\
    \ computer languages that are run and interpreted by the client's browser. Client\
    \ side technologies include HTML, Javascript and CSS or Cascading Style Sheet\
    \ Language.\n\n**Server Side Technologies:** Server side technologies, on the\
    \ other hand, are a set of applications and software that store the web page code\
    \ and send it to the user's web browser when requested. These include Java Enterprise\
    \ Edition, .net, Ruby on Rails, PHP/MySQL, and Perl. These server side technologies\
    \ usually create HTML code and dispatch that code to the client's browser.\n\n\
    Client and server side technologies often interact with one another to produce\
    \ the completed web page or application while each performs a distinct role in\
    \ the process.\n\nIn order to succeed in this course, you must already be familiar\
    \ with HTML. If you are not, it is recommended that you either take a course on\
    \ HTML or review an HTML book or manual.\n\nA summary of technologies and languages\
