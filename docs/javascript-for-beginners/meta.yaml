  md: '# CHAPTER 8 SUMMARY


    In this chapter, we discussed the string property length which is used to count
    the number of characters contained by a string.


    We also discussed five string manipulation methods:


    | charAt() | which is used to display the specific location of a character in
    the set of strings |

    | charCodeAt() | which returns the Unicode value of a string character |

    | indexOf() | which is used to find out where something occurs in the string |

    | replace() | which is used to replace a selected set of strings with different
    string values |

    | split() | which is used to convert strings separated by commas into an array
    |


    We also showed how string characters can be manipulated using iterations and how
    certain string sets can be replaced with another character and display the results
    or changes.


    In the next chapter, we will be discussing how to obtain and manipulate user''s
    browser window information.'
