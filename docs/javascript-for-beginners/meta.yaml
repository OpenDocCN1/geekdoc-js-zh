    \ to be so convenient that all of the other browsers quickly added support for\
    \ this property.\n\nWe can use innerHTML either to retrieve the current content\
    \ of the container or to insert new content into that container.\n\nLet's dig\
    \ in and start modifying content in an HTML document through Javascript. First,\
    \ we create a basic HTML document, then add a logical division. Then, place script\
    \ tags in the head of the document:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title></title>\n  <script language=\"javascript\" type=\"text/javascript\">\n\
    \n  </script>\n</head>\n```\n\nNow, we'll make the div accessible through the\
    \ document object and Javascript by adding an id attribute and value. We'll make\
    \ the value \"content\":\n\n```html\n<body>\n  <div id=\"content\">\n```\n\nNext,\
    \ let's add a paragraph element. Of course, it must be enclosed by paragraph tags.\
    \ Then we'll close the \"div\":\n\n```html\n<p>This paragraph will change when\
    \ the document object's innerHTML property is accessed.</p>\n</div>\n```\n\nTo\
    \ make it a little more interesting, let's add a button that, when clicked, will\
