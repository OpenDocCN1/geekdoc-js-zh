    \ 2);\n    document.write(\"<br>\");\n    outputArray();\n    placesToVisit.sort();\n\
    \    document.write(\"<br>\");\n    outputArray();\n  </script>\n</body>\n</html>\n\
    ```\n\n## 第 7 章总结\n\n在本章中，我们讨论了数组的操作以及如何访问和操纵数组。\n\n我们检查了定义数组的基础知识、创建和声明数组，以及使用\
    \ `for` 循环对数组进行索引。\n\n本章还涵盖了 `push`、`pop`、`sort` 和 `splice`，这些都是操作数组的方法。\n\n在下一章中，我们将介绍字符串对象。\n\
    \n## 第 8 章\n## 字符串对象\n\n章节目标：\n\n- 你将能够理解字符串对象的属性和方法。\n- 你将学习如何使用方法修改字符串属性。\n\
    - 你将能够通过循环将字符串替换为其他字符串。\n- 你将学习如何计算字符串包含的字符数量以及结果。\n- 你还将学习如何将逗号分隔的字符串转换为数组。\n\
    \n## 8.1 对象属性和方法\n\n在本章中，我们将重点讨论字符串对象。这是一个关于我们讨论内容的非常棒的网站参考：\n\n![](img/c922782503c42c65b3a7c97e4fad8964_202_0.png)\n\
    \n建议你在学习本章课程时打开此网页。\n\n我们在书的早早部分讨论过字符串，并将其定义为字母和数字的序列。在处理字符串工作时，我们通常会在字符串本身周围加上双引号。字符串对象也不何不同——事实上，所有的字符串都是对象。这意味着，就像\
    \ JavaScript 中所有的对象一样，字符串具有描述它们的属性和操纵它们的方法（函数）。\n\n当我们说属性时，它是与对象相关联的描述对象本身的属性。在本节中，我们将讨论\
    \ `length` 属性。在继续之前，让我们简要描述一下方法。方法是可以应用或执行于对象上的动作或过程。对于字符串对象，例如从小写转换为大写、替换为另一个字符串、删除字符串以及在字符串末尾追加。\n\
    \n当我们在 JavaScript 中创建一个字符串时，我们是在创建一个字符串对象。你已经知道如何做了。我们将一个字符串赋值给变量 `message`。\n\
    \n```\nvar message=\"Hello World\"\n```\n\n接下来，我们将创建另一个变量，使用 `x`，它将存储变量 `message`\
    \ 的长度：\n\n```\nvar x = message.length\n```\n\n在这个例子中，`message` 是字符串的名称，`length`\
    \ 是属性。如果你显示 `x` 的值，将得到结果 12。\n\n![](img/c922782503c42c65b3a7c97e4fad8964_203_0.png)\n\
    \n这里是显示 \"Hello World!\" 字符串长度的完整代码：\n\n## 代码列表：字符串属性–长度\n\n```html\n<html\n<head>\n\
    <title>Hello World--Length</title>\n</head>\n<body>\n<script language=\"javascript\"\
    \ type=\"text/javascript\">\n    var message = \"Hello World!\";\n    var x=message.length;\n\
    \n    document.write(\"Length: \" + x);\n    document.write(\"<br>\");\n</script>\n\
    </body>\n</html>\n```\n\n这是上述代码在以下处的输出：\n\n![](img/c922782503c42c65b3a7c97e4fad8964_204_0.png)\n\
    \n作为另一个例子，让我们使用 F. 斯科特·菲杰拉德的名言，“If you are strong enough, there are no precedents.”创建一个基础\
    \ HTML 文档并在 `body` 中包含 `script` 元素：\n\n```html\n<script language=\"javascript\"\
    \ type=\"text/javascript\">\n```\n\n将引言赋值给变量 `phrase` 并关闭 script 标签：\n\n```html\n\
    var phrase = \"If you are strong enough, there are no precedents.\";\n</script>\n\
    ```\n\n使用 `length` 属性计算字符串中的字符数量。使用 `document.write()` 显示引言，正确的语法是：\n\n```\ndocument.write(\"\
    length: \" + phrase.length)\n```\n\n## 代码列表：显示长度\n\n```html\n<html\n<head>\n<title>String\
    \ Object--Length</title>\n</head>\n<body>\n  <script language=\"javascript\" type=\"\
    text/javascript\">\n    var phrase = \"If you are strong enough, there are no\
    \ precedents.\";\n\n    document.write(\"Length: \" + phrase.length);\n    document.write(\"\
    <br>\");\n  </script>\n</body>\n</html>\n```\n\n此代码的输出应该是：\n\n| Length: 50 |\n\
    \n由于空格和特殊字符被计入内，所以结果是 50。\n\n现在让我们讨论字符串对象可用的一些方法。我们将讨论的方法是 `charAt()`。`charAt()`\
    \ 方法显示字符串中字符的位置。就像 JavaScript 数组一样，也是从 0 开始索引的。\n\n使用之前的代码显示对象的长度，我们将修改代码引入 `charAt()`。我们将使用\
    \ `for` 循环逐字符遍历字符串。该函数的正确用法确保在遍历整个字符串时扫描每个字符位置。`for` 循环应该是：\n\n```\nfor (var i=0;\
    \ i < phrase.length; i++) {\n    document.write(i + \": \" + phrase.charAt(i));\n\
    \    document.write(\"<br>\");\n}\n```\n\n该练习的完整代码为：\n\n## 代码列表：字符串方法charAt\n\n\
    ```html\n<html\n<head>\n<title>String Method charAt()</title>\n</head>\n<body>\n\
    \    <script language=\"javascript\" type=\"text/javascript\">\n        var phrase\
    \ = \"If you are strong enough, there are no precedents.\";\n\n        for (var\
    \ i=0; i < phrase.length; i++) {\n            document.write(i + \": \" + phrase.charAt(i));\n\
    \        }\n    </script>\n</body>\n</html>\n```\n\n输出将如下所示：\n\n![](img/c922782503c42c65b3a7c97e4fad8964_207_0.png)\n\
    \n+ 0:I\n1:f\n2:\n3:y\n4:o 25:\n5:u 26:t\n6: 27:h\n7:a 28:c\n8:r 29:r\n9:e 30:c\n\
    10: 31:\n11:s 32:a\n12:t 33:r\n13:r 34:e\n14:o 35:\n15:n 36:n\n16:g 37:o\n17:\
    \ 38:\n18:c 39:p\n19:n 40:r\n20:o 41:e\n21:u 42:c\n22:g 43:d\n23:h 44:e\n24:.\
    \ 45:e\n46:n\n47:t\n48:s\n49:.\n\n字符串对象像字符数组一样进行处理。\n"
