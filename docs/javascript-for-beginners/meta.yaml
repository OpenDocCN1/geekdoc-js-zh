  md: '# # CHAPTER 8

    THE STRING OBJECT


    CHAPTER OBJECTIVES:


    +   * You will be able to understand what string object properties and methods.

    * You will learn how to alter string properties using methods.

    * You will be able to replace strings with other strings via loops.

    * You will learn how to count the number of characters a string has and the result.

    * You will also learn how to convert a comma separated string into an array.


    # 8.1 OBJECT PROPERTIES AND METHODS


    In this chapter we will concentrate on string objects. A great website reference
    for our discussion:


    ![](img/c922782503c42c65b3a7c97e4fad8964_202_0.png)


    It is recommended that you open this webpage as you learn the lessons in this
    chapter.

    We discussed strings earlier in the book and defined them as a series of letters
    and numbers. When working with strings we have generally surrounded the string
    itself with double quotes. String objects are no different—in fact, all strings
    are objects. This means, like all objects in Javascript, strings have properties
    that describe them and methods (a.k.a.: functions) that manipulate them.


    When we say property, this is the attribute that is associated with the object
    that describes the object itself. In this lesson we will discuss the length property.
    Before moving on to that, let''s briefly describe methods.


    Methods are the actions or processes that can be applied or performed to the object.
    For a string object, examples would be changing from lowercase to uppercase, replacing
    with another string, removing a string and appending to the string.'
