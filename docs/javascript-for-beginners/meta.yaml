  md: '# # CHAPTER 1

    HELLO JAVASCRIPT!


    # ## CHAPTER OBJECTIVES:


    +   - You will be able to understand client and server side technologies of web
    applications.

    - You will be able to create Javascript within an HTML document.

    - You will be able to use the document.write command in Javascript.

    - You will understand the different places where you can place Javascript within
    a document.


    # ## 1.1 Introducing THE TECHNOLOGIES


    Before we begin this course, let us discuss the technologies used in web design
    and development. There are two types of technologies used within web development.
    They are client side technologies and server side technologies.


    **Client Side Technologies:** These refer to computer languages that are run and
    interpreted by the client''s browser. Client side technologies include HTML, Javascript
    and CSS or Cascading Style Sheet Language.


    **Server Side Technologies:** Server side technologies, on the other hand, are
    a set of applications and software that store the web page code and send it to
    the user''s web browser when requested. These include Java Enterprise Edition,
    .net. Ruby on Rails, PHP/MySQL, and Perl. These server side technologies usually
    create HTML code and dispatch that code to the client''s browser.


    Client and server side technologies often interact with one another to produce
    the completed web page or application while each performs a distinct role in the
    process.


    In order to succeed in this course, you must already be familiar with HTML. If
    you are not, it is recommended that you either take a course on HTML or review
    an HTML book or manual.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'A summary of technologies and languages you will likely encounter while learning
    Javascript is listed below, briefly outlining each role.


    | Technology/ Language | Role |

    |---|---|

    | HTML | HTML is used to structure web pages. It not used to create a design or
    the look and feel of a website. HTML markup indicates the purpose of each element—not
    its page position or appearance. The current standards of HTML are HTML 4.01 and
    XHTML5 will be the standard in 2014. HTML is not a programming language, but is
    a markup language that consists of tags, attributes and content. |

    | CSS | CSS was derived to add a design component to HTML. It allows typography
    control, color control, layout and design features like margins, padding and borders.
    |

    | Javascript | Javascript is a client side technology that adds interactivity
    to web pages. Javascript code can be used to validate user input, create dropdown
    effects, switch CSS styles dynamically and even make complex calculations. Javascript
    has become more important lately as more processing moves from the server side
    to the client side processing is more efficient. leads to a better user experience
    and is event based. Javascript is not compiled, but is interpreted by the browser.
    |

    | AJAX | AJAX (Asynchronous Javascript and XML) is an application of Javascript
    that allows communication between the client and server to take place “behind
    the scenes.” This results in a smoother, more desktop-like interface for web applications.
    |'
