    # 2.1 LEARNING TO USE VARIABLES


    In this chapter we are going to discuss variables. Variables are important elements
    of any programming language, and Javascript is no exception.


    Variables are memory allocations used to hold values. They are called variables
    because their value may vary over time throughout the execution of the program.


    You can use variables to hold text values (also known as alphabetic or string
    values) such as a person''s name, company name or any other text content in your
    program. Variables may also hold numerical values.


    To show you how variables are used, let''s start with an HTML document page. For
    this example, we will use an HTML 4.01 document. To insert Javascript, a script
    tag is used with attributes as follows:


    ```

    <script language="javascript" type="text/javascript">

    ```


    All Javascript commands must be placed within the script element. The first Javascript
    element that must be identified is the variable to be used. We need to name the
    variable and declare it.


    When you declare a variable in Javascript, you use the var statement followed
    by the name of the variable. It is ideal that the name of the variable is something
    that describes what the variable represents.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'variable name can be any alphanumeric set of characters, and should be treated
    as case sensitive. No punctuation marks or special characters are allowed, except
    for underscore.


    An example of a variable declaration is:


    ```

    var userName;

    ```


    It''s not required to use the var statement when declaring a variable in Javascript,
    however, it is a good idea always to do so. Consistently using var when declaring
    variables avoids difficulties with variable scope.


    We''ll be discussing variable scope later in the course, but the short explanation
    is that there are variables that are only within a certain segment of your program,
    such as a function. Variables can be declared so that their value is only retrievable
    within that scope.


    Now that we have declared our variable, we can assign it a value. This is called
    variable assignment. When we set the initial value of the variable, it is known
    as initialization. Once you have declared your variable, you no longer need to
    use the var statement. All you need is the name of the variable followed by the
    equal sign and the value of the variable. In this example, our variable initialization
    is:


    ```

    userName="Mark Lassoff";

    ```


    The value assigned in the above example is a string, also known as text, which
    is why it was enclosed with quotes. If you are assigning a numerical value to
    a variable, you do not need to enclose the value with quotes. For example:


    ```

    age = 39;

    ```


    A shortcut method for simultaneously declaring and initializing variables is to
    combine declaration and initialization on the same line. This is a more efficient
    way of initializing and declaring a variable. Declaring and initializing a variable
    concurrently is as follows:


    ```

    var userName="Mark Lassoff";

    ```


    We can now display the variable''s value. To display the value of the'
