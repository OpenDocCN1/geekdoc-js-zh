  md: '# CHAPTER 9

    OBTAINING AND MANIPULATING USER INFORMATION


    CHAPTER OBJECTIVES:


    +   - You will learn how to obtain user''s browser window information and manipulate
    this information.

    - You will be able to use the navigator object.

    - You will learn how to use the windows object.

    - You will be able to manipulate information using screen object.


    # 9.1 NAVIGATOR OBJECT


    In this chapter, you will learn how to use Javascript to obtain information about
    the user''s browser such as code, name, and version. You will also learn about
    the window properties, inner width and inner height. We will also talk about the
    screen information—height and color depth, and how to manipulate all these javascript
    objects using methods.


    Oftimes when developing web applications it is useful to gather information about
    the user''s environment. This information is often used to optimize the user''s
    experience or execute processes specific to the user''s environment. Javascript
    has a rich set of objects and methods to help us do that.


    The first object we will discuss is the navigator object. The keyword used to
    work with this object is navigator (surprise!). Along with this object, we can
    employ the following properties:


    +   - appCodename, which is used to disclose the browser''s codename, (for example,
    Mozilla)


    +   - appName, which identifies the name of the browser used, for example, Netscape


    +   - appVersion, which reports the current version of the browser used'
  merge: -1
