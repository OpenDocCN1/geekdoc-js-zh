    \ outputs the result as the function is called.\n\nFunctions can also return a\
    \ value when called. To demonstrate this, let's create a routine which will return\
    \ the sum of x instead of displaying it with document.write().\n\nThe command\
    \ that will make this possible is the return statement.\nInstead of using document.write(),\
    \ we use return. The code is written as:\n\n```\nreturn(x+y);\n```\n\nOnce the\
    \ value is returned, the calling function must have a way of “catching” the returned\
    \ value. The function call needs to be modified so that a variable will serve\
    \ as recipient of the value being returned. The moment the value is returned by\
    \ the function, it is then immediately assigned to a variable. The variable assignment\
    \ for the function addTheseNumbers is sum and the function call should be written:\n\
    \n```\nvar sum = addTheseNumbers(100,17);\n```\n\nRemember, the right side of\
    \ the assignment operator is always evaluated first; the two values, 100 and 17,\
    \ will be passed to the function addTheseNumbers and the sum of the numbers will\
    \ be returned and consequently, assigned to the variable sum.\n\nOnce the value\
    \ is contained inside the variable. the variable output can then be generated.\n\
    \nKeep in mind that when you are passing values to a function and returning values\
    \ from a function, you always need a way of containing those values."
