    \ if 条件、if-else-if 条件以及 switch-case-break 语句。\n\n在下接章中，我们将解释如何在 Javascript 中创建对话框。对话框可以提示用户，也可以允许用户输入数据。\n\
    \n# 第 4 章：对话框\n\n- 本章目标：\n- 你将能够创建 \"alert\"、prompt\" 和 \"confirm\" 对话框。\n- 你将能够在应用程序中使用对话框中输入的数据。\n\
    \n## 4.1 三种类型的对话框\n\n在本节中，我们将回顾 Javascript 程序员可以使用的三种对话框。这些对话框会出现在浏览器窗口的前，并强制用户在继续使用\
    \ Web 应用程序之前对其进行确认。Javascript 对话框有时被称为模态对话框（modal dialogs），因为它们要求用户在执行浏览器中的任何其他操作之前必须做出响应。\n\
    \n我们将看到的第一个对话框是 alert 框（警告框），它是最容易实现的。alert 框会显示一个消息窗口，显示放置在 Javascript alert\
    \ 命令中的字符串或赋值给变量的值。\n\nalert 框通过使用 alert 命令并后跟括号来设置：\n\n```\nalert(\"Have a nice\
    \ day!\");\n```\n\n创建 alert 框非常简单。事实上，下面是一个“Have a nice day!” alert 对话框的完整代码列表：\n\
    \n```html\n<!DOCTYPE HTML PUBLIC \"//W3C//DTD HTML 4.01//EN\"\n  \"http://www.w3.org/TR/html4/strict.dtd\"\
    \n>\n<html lang=\"en\">\n<head>\n  <title>Dialog Box - Alert</title>\n</head>\n\
    <body>\n<script language=\"javascript\" type=\"text/javascript\">\n  alert(\"\
    Have a nice day!\");\n</script>\n</body>\n</html>\n```\n\n在 Firefox 浏览器中，alert\
    \ 对话框将如下所示：\n\n![](img/c922782503c42c65b3a7c97e4fad8964_81_0.png)\n\n在 Chrome\
    \ 中：\n\n![](img/c922782503c42c65b3a7c97e4fad8964_81_1.png)\n\n在 Internet Explorer\
    \ 中：\n\n![](img/c922782503c42c65b3a7c97e4fad8964_82_0.png)\n\n在 Opera 中：\n\n![](img/c922782503c42c65b3a7c97e4fad8964_82_1.png)\n\
    \n除了直接使用 alert 命令外，“alert\" 框还可以通过使用变量显示字符串值或文本。与其在 *alert* 函数的括号内编写字符串或文本，不如将字符串指定为变量的值，并从\
    \ *alert* 命令中调用该变量。\n\n此代码示例中的 alert 框显示了存储在变量中的字符串：\n\n```html\n<!DOCTYPE HTML\
    \ PUBLIC \"//W3C//DTD HTML 4.01//EN\"\n  \"http://www.w3.org/TR/html4/strict.dtd\"\
    >\n<html lang=\"en\">\n<head>\n  <title>Dialog Box - Alert</title>\n</head>\n\
    <body>\n  <script language=\"javascript\" type=\"text/javascript\">\n  var message=\
    \ \"Have a nice day !\";\n  alert(message);\n</script>\n</body>\n</html>\n```\n\
    \n之前的代码列表将显示与上示例完全相同的输出。我们将检查的第二种对话框是 confirm 框（确认框）。confirm 框向用户提一个问题，然后用户通过点击对话框中显示的确定或取消按钮来提供答案。这个框的代码编写比\
    \ alert 框稍微复杂一点，因为用户的响应必须存储在变量中。通常这是通过变量赋值完成的。变量根据用户的响应存储 TRUE 或 FALSE。为了演示，让我们使用一个名为\
    \ confirmation 的变量；使用 confirm(\" \") 初始化其值。在双引号内，放入你想向用户显示的文本。代码看起来如下：\n\n```javascript\n\
    var confirmation = confirm(\"Do you want to exit?\");\n```\n\n# 第 4 章：对话框\n\n\
    如果用户点击“确定”，值“TRUE”将存储在变量中；反之，如果用户点击“取消”，值“FALSE”将存储在变量 confirmation 中。![](img/c922782503c42c65b3a7c97e4fad8964_84_0.png)\
    \ 让我们使用一个条件来评估用户的响应。我们将创建一个条件程序，当用户选择“确定”时显示“退出...”，当用户选择“取消”时显示“留在应用程序...”。这是使用\
    \ confirmation = confirm(\"Do you want to exit?\"); 后的完整代码：\n\n```html\n<!DOCTYPE\
    \ HTML PUBLIC \"//W3C//DTD HTML 4.01//EN\"\n  \"http://www.w3.org/TR/html4/strict.dtd\"\
    >\n<html lang=\"en\">\n<head>\n  <title>Dialog Boxes</title>\n</head>\n<body>\n\
    \  <script language=\"javascript\" type=\"text/javascript\">\n    var confirmation\
