    # 第 1 章：你好 JAVASCRIPT！


    ## 本章目标：


    - 你将能够理解 Web 程序的客户端和服务器端技术。

    - 你能够在 HTML 文档中创建 Javascript。

    - 你能够在 Javascript 中使用 `document.write` 命令。

    - 你将理解在文档中放置 Javascript 的不同位置。


    ## 1.1 介绍技术


    在开始课程之前，让我们讨论一下 Web 设计和开发中使用的技术。Web 开发中使用了两种类型的技术：客户端技术和服务器端技术。


    **客户端技术：** 这些指的是由客户端浏览器运行和解释的计算机语言。客户端技术包括 HTML、Javascript 和 CSS 或级联样式表语言。


    **服务器端技术：** 而言，服务器端技术是一系列应用程序和软件，它们存储网页代码并在请求时将其发送给用户的 Web 浏览器。这些包括 Java 企业版、.net、Ruby
    on Rails、PHP/MySQL 和 Perl。这些服务器端技术通常创建 HTML 代码并将该代码发送到客户端浏览器。


    客户端和服务器端技术经常相互作用，以生成完整的网页或应用程序，而每个技术在过程中都承担着不同的角色。


    为了在本课程中取得成功，你必须已经熟悉 HTML。如果你不熟悉，建议你参加一个 HTML 课程或复习 HTML 书或手册。


    下面列出了你在学习 Javascript 时可能会遇到的技术和语言总结，简要概述了每个技术的角色。


    | 技术/语言 | 角色 |

    | :--- | :--- |

    | HTML | HTML 用于构建网页结构。它不用于创建网站的设计或视觉效果。HTML 标记指示了每个元素的用途——而不是它在页面上的位置或外观。目前的
    HTML 节点是 HTML 4.01，XHTML 将是 2014 年的标准。HTML 不是一门编程语言，而是一种由标签、属性和内容组成的标记语言。 |

    | CSS | CSS 的产生是为了给 HTML 添加设计组件。它允许对排版、颜色进行控制，并提供布局和如外边距、内边距和边框等设计功能。 |

    | Javascript | Javascript 是一种客户端技术，用于为网页添加交互性。Javascript 代码可用于验证用户输入、创建下拉效果、动态切换
    CSS 样式，甚至进行复杂的计算。随着越来越多的处理从服务器端转移到客户端，Javascript 最近来变得越来越重要，因为客户端处理更高效，能带来更好的用户体验并且是基于事件的。Javascript
    不是编译的，而是由浏览器解释的。 |

    | AJAX | AJAX（异步 Javascript 和 XML）是 Javascript 的应用，允许客户端和服务器之间的通信在“后台”进行。这为 Web
    应用程序提供了更流畅、类桌面的界面。 |


    ## 问卷复习


    - 1. Javascript 是运行在客户端还是服务器端？

    a. 服务器端。

    b. 客户端。

    c. 两者都是。

    d. 都不是。


    - 2. Javascript 定义为：

    a. 一种允许你在网页上玩游戏和运行程序的编程语言。

