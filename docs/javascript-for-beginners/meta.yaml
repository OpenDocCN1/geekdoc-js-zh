  mdcn: "\n输出结果应该是这样的：\n\n![](img/c922782503c42c65b3a7c97e4fad8964_253_0.png)\n\n\
    ```\nstyle.fontWeight = \"bold\";\n```\n\n使用 CSS 更改文档对象和元素的视觉效果是一项强大的能力。它增强了网页开发人员有效交付一系列事件或网页更改的能力，而无需修改服务器端代码，从而在\
    \ Javascript 中创建动态样式。\n\n如果你熟悉 CSS，可能已经注意到，当通过文档对象和 style 属性进行修改时，通常会遵循 CSS 语法。你可以在样式表中创建的任何\
    \ CSS 规则，都可以通过文档对象和 style 属性动态创建。\n\n# 10.2 innerHTML 属性\n\n`innerHTML` 属性用于访问\
    \ HTML 代码中任何元素内部的 HTML。例如，一个 `<p>` 段落元素内部可能包含文本和其他 HTML 标签。通过使用 `innerHTML` 属性，我们可以访问内容并进行检索和修改。\n\
    \nhttp://www.w3.org/TR/dom06.html 对 `innerHTML` 的定义有如下解释：\n\n我们网页对象中最有用的属性……`innerHTML`\
    \ 属性由微软在 Internet Explorer 中引入，作为一种一次性访问 HTML 容器全部内容的方便方法。事实证明它是如此方便，所有其他浏览器都很快增加了对该属性的支持。\n\
    \n我们可以使用 `innerHTML` 来检索容器的当前内容，也可以向该容器中插入新内容。\n\n让我们深入研究并开始通过 Javascript 修改 HTML\
    \ 文档中的内容。首先，我们创建一个基础 HTML 文档，然后添加一个逻辑分区。接着在文档的 `<head>` 中放置 `<script>` 标签：\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<title></title>\n  <script language=\"\
    javascript\" type=\"text/javascript\">\n\n  </script>\n</head>\n```\n\n现在，我们将通过添加\
    \ `id` 属性和值，使 `div` 可以通过对象和 Javascript 访问。我们将值设置为 \"content\"：\n\n```html\n<body>\n\
    \  <div id=\"content\">\n```\n\n接下来，让我们添加一个段落元素。当然，它必须被段落标签包围。然后我们关闭 \"div\"：\n\
    \n```html\n<p>当访问文档对象的 innerHTML 属性时，此段落将会改变。</p>\n</div>\n```\n\n为了让它更有趣，让我们添加一个按钮，点击它时将调用一个函数，该函数包含动态更改\
    \ HTML 的代码。按钮的段代码如下：\n\n```html\n<input type=\"button\" value=\"点击我!\" onclick=\"\
    changeContent()\"/>\n</body>\n</html>\n```\n\n让我们回到文档的头部——就在两个 `<script>` 标签之间——并向标签内部插入函数\
    \ `changeContent()`，从而形成一个元素。\n\n插入的代码看起来应该是这样的：\n\n```javascript\nfunction changeContent()\
    \ {\n  document.getElementById('content').innerHTML = \"<h3>看到吗？内容已经改变了！</h3>\"\
    ;\n}\n```\n\n我们对内容使用了 `<h3>` 标题 3标签，这样一旦变化发生，就会变得非常明显。完整的代码列表现在应该像所示：\n\n# 代码列表：innerHTML\
    \ 更改 \"div\" 内容\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Inner HTML\
    \ - 更改 \"div\" 内容</title>\n  <script language=\"javascript\" type=\"text/javascript\"\
    >\n    function changeContent() {\n      document.getElementById('content').innerHTML\
    \ = \"<h3>看到吗？内容已经改变了！</h3>\";\n    }\n  </script>\n</head>\n<body>\n  <div id=\"\
    content\">\n    <p>当访问文档对象的 innerHTML 属性时，此段落将会改变，即当你按下按钮时。</p>\n  </div>\n  <input\
    \ type=\"button\" value=\"点击我!\" onclick=\"changeContent()\"/>\n</body>\n</html>\n\
    ```\n\n输出应该像这样：\n\n![](img/c922782503c42c65b3a7c97e4fad8964_257_0.png)\n\n点击按钮后：\n\
    \n![](img/c922782503c42c65b3a7c97e4fad8964_257_1.png)\n\n我们可以使用一个名为 Firebug 的插件来查看浏览器内部正在发生的情况。Firebug\
    \ 可以向你展示在按下按钮时文档内部实际上发生了什么。首先，你必须下载 Firebug 并将其添加到 Firefox 浏览器中。该插件可以从此网站下载：http://www.firebug.org\n\
    \n# 第 10 章：文档对象和 innerHTML 属性\n\n下载后，你将看到如下提示符：\n\n![](img/c922782503c42c65b3a7c97e4fad8964_258_0.png)\n\
    \n下面的图片描绘了如何使用 Firebug 追踪我们程序内部发生的情况。注意 Firefox 浏览器右上角那个像圆的小图标。这确认了 Firefox 插件\
    \ Firebug 已安装在浏览器中。\n\n![](img/c922782503c42c65b3a7c97e4fad8964_258_1.png)\n\n\
    点击小虫虫（Firebug图标你就可以看到在浏览器中发生了什么：\n\n![](img/c922782503c42c65b3a7c97e4fad8964_259.png)\n\
    \n当你将鼠标悬停在 `<body>` 行上时，你会看到网页内部的情况：\n\n![](img/c922782503c42c65b3a7c97e4fad8964_259.png)\n\
    \n当你将鼠标悬停在 HTML 元素上时，你会看到：\n\n![](img/c922782503c42c65b3a7c97e4fad8964_260.png)\n\
    \n当你拉伸窗口时，你会看到显示：\n\n![](img/c922782503c42c65b3a7c97e4fad8964_261.png)\n\n当你悬停在段落元素时，你会看到黄色背景：\n\
    \n![](img/c922782503c42c65b3a7c97e4fad8964_262.png)\n\n我们之所以想探索 Firebug 是为了看到当\
    \ `innerHTML` 属性触发事件时发生了什么：\n\n![](img/c922782503c42c65b3a7c97e4fad8964_263.png)\n\
    \n点击“点击我”按钮后，你会看到如下结果：\n\n![](img/c922782503c42c65b3a7c97e4fad8964_264.png)\n\n\
    # 文档对象和 innerHTML 属性\n\n现在点击“点击我”按钮。你会看到 HTML 代码发生了变化：\n\n![](img/c922782503c42c65b3a7c97e4fad8964_265.png)\n\
    \n"
