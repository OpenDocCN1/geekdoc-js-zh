    \ \" + grades.length + \"<br/>\");\ngrades.push(100,63);\n\nfor(x in grades) {\n\
    \  document.write(\"Iteration \" + x + \" \");\n  document.write(grades[x] + \"\
    <br/>\");\n}\n</script>\n```\n\nThe values 100 and 63 found inside the parentheses\
    \ with the push method are added to the end of the array. We can now modify the\
