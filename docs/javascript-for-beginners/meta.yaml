- img_proc: true
  md: 'you can use the document.write() command, followed by the name of the variable
    in parentheses. The command syntax is:


    ```

    document.write(userName);

    ```


    When you want to display the variable''s value, you do not need to put quotes
    around the variable name (like you if you were outputting text). Instead you simply
    write the variable name in parentheses. If it is the actual string value you want
    to print, then surrounding the string value with quotes is a must. For example:


    ```

    document.write("Austin, Texas");

    ```


    This will display Austin, Texas.


    We can also change the value of a variable during the program''s execution. Suppose
    you have displayed the first value assigned to your variable. You then assign
    another value to the same variable name and then have it displayed. The second
    value assigned to userName replaces the initial value.


    So far, we have been assigning values to our variable with the equal sign. However,
    the equal sign does not mean "equal to" in the context of Javascript. In Javascript,
    the equal sign is known as the assignment operator. The assignment operator merely
    assigns a value to the variable.


    We will discuss more operators and their functions in greater detail later on.
    The way we read the variable initialization in the previous example is that the
    variable userName was assigned the value Mark Lassoff. The value being in quotes
    indicates it is a string value.


    When a number is assigned as the value of a variable, it is referred to as a numeric
    variable. This is an example of declaring and assigning a numeric variable:


    ```

    var userAge= 37;

    ```


    In the next section, we will use numeric variables to perform some arithmetic
    operations.'
