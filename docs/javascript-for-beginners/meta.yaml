    button\" value=\"Press Me!\" onclick=\"changeContent()\"/>\n</body>\n</html>\n\
    ```\n\nThe output should look like this:\n\n![](img/c922782503c42c65b3a7c97e4fad8964_257_0.png)\n\
    \nAfter clicking on the button:\n\n![](img/c922782503c42c65b3a7c97e4fad8964_257_1.png)\n\
    \nWe can get an insider view of what's happening in the browser with a plug called\
