- img_proc: true
  md: "# HTML in a document node.\n\nBy taking advantage of the document object model,\
    \ you can adjust almost anything within the browser—including the CSS that is\
    \ styling your content. It is important to understand that what is stored in the\
    \ document object is dynamic, so the values may change as the user interacts with\
    \ the website. For example, if the user types information into a form, the information\
    \ is stored in the document object where you may access it—before it is submitted\
    \ to the server.\n\nFirst, let us create a HTML document that will have three\
    \ elements in it: two text input fields and a button. These elements will be manipulated\
    \ using the innerHTML property and document object.\n\nIn our HTML document body,\
    \ include the elements first and last as text boxes and a button labeled with\
    \ the text \"Press Me\". The button will trigger a function called processName()\
    \ via the onclick event. This is how the body element will be coded:\n\n```\n\
    <body>\n  First: <input type=\"text\" id=\"first/>\n  <br/>\n  Last: <input type=\"\
    text\" id=\"last/>\n  <input type=\"button\" value=\"Press Me\" onclick=\"processName()/>\n\
    </body>\n```\n\nThe function processName() will extract the values input in the\
    \ first and last text box elements. Before we get to that, make sure that you\
    \ write the script tag in the head element of the HTML document like so:\n\n```\n\
    <script language=\"javascript\" type=\"text/javascript>\n```\n\nThen let's declare\
    \ two local variables—first and last—which will be used to hold or contain the\
    \ values that will be extracted from the text box elements.\n\n```\nvar first;\n\
    var last;\n```"
  merge: -1
  pgno: 245
- img_proc: true
  md: "Now initialize these variables by assigning the method getElementById().value,\
    \ to extract the values from the text boxes. The code should look like this:\n\
    \n```\ndocument.getElementById('first').value;\nlast=document.getElementById('last').value;\n\
    ```\n\n> Be sure to include .value because without it, only the text box will\
    \ be extracted—not the values inside the text box elements.\n\nHere's all the\
    \ code we've written so far:\n\n```\n<script language=\"javascript\" type=\"text/javascript\"\
    >\n  function processName() {\n    var first;\n    var last;\n    first=document.getElementById('first').value;\n\
    \    last=document.getElementById('last').value;\n  }\n```\n\nTo make it easy,\
    \ we'll use an alert box to display the extracted values. Here is the alert code:\n\
    \n```\nalert(first + \" \" + last);\n```"
