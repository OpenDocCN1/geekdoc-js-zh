    # 3.3 Switch-Case-Break Statements


    Another way you can test multiple conditions is by using a switch statement. A
    switch statement allows you to test a number of conditions and see if they are
    true very quickly.


    For this section, we will display a string of text based on the conditions by
    a variable. We will test the variable letterGrade.


    The switch-case-break series starts with a switch statement. The switch determines
    which variable will be evaluated for equality. This is done by writing the code:


    ```

    switch (letterGrade)

    ```


    Once the switch is created, you may list a number of cases that can be tested
    against the value of the switch variable. If any of the cases are determined to
    be equivalent to the switch variable, the subsequent case code will be executed
    and switch-case-break block will be terminated.


    > Each case should have its own code block that is terminated with a break statement.


    If two different cases are supposed to yield the same result, they can be written
    in series, followed by the code block to be executed. This is a good trapping
    technique that will ensure all possible cases are accounted for.


    It is possible to list multiple cases in a series prior to an associated code
    block and the following code listing will show how it''s done. If the value of
    the switch variable is "a" or "A", the program will execute the corresponding
    document.write() statement.


    ```

    case "A":ncase "a":

    document.write("A is an excellent grade!");

    break;

    ```


    Any unlimited number of cases may be written and associated with a single switch.
    One final element of switch-case-break is the default block. The default block
    can be used to execute the code if the switch variable is not equal to the value
    of any of the cases.'
