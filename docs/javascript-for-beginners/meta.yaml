  md: '# 1.2 HELLO WORLD IN JAVASCRIPT


    Let''s go ahead and create your first Javascript program. You will need two items
    to create your first Javascript. You will need a web browser. It is highly recommended
    that you use multiple web browsers in order to make sure your program works in
    different browsers. You also need a text editor, which is usually preinstalled
    in your computer. However, you can also use one of the more sophisticated text
    editors, such as ActiveState''s Komodo Edit or Notepad++. The one you should not
    use is a word processor, as they insert formatting that a web browser will not
    understand.


    You will write your first Javascript program within a basic HTML document. Create
    a document structure with a head and a body and title your document "First Javascript".


    ```

    <html>

    <head>

    <title>First Javascript</title>

    </head>

    <body>

    </body>

    </html>

    ```


    Then insert a script tag to tell your browser that you will be using Javascript.
    Set the script language attribute to Javascript and assign the attribute type
    to "text/javascript". The complete script tag for including Javascript in HTML
    is:


    ```

    <script language="javascript" type="text/javascript">

    ```


    Next we are going to use the document.write command in Javascript. This basic
    command will output the specified text on the web page. If you are displaying
    text, enclose your text output in parentheses, followed by quotation marks. This
    is how the document.write command is written:'
  merge: -1
  pgno: 17
- img_proc: true
  md: "```\ndocument.write(\"Hello World from Javascript\");\n```\n\nIt's a good idea\
    \ to end your Javascript commands with a semi-colon. Many programming languages\
    \ require a semi-colon at the end of each command. In Javascript, the semi-colon\
    \ is optional, but even so, it is a good idea to use it to keep your code organized\
    \ and develop best practices for writing programming code.\n\nYou may also want\
    \ to add comments to your code. Comments are an extremely useful way of keeping\
    \ your code organized and neat. Imagine the inconvenience when you need to revise\
    \ your code but can't remember how your code was structured. You will definitely\
    \ have to take the time to review and figure out your code before you can edit\
    \ it. Comments help you quickly and efficiently label and review your code. In\
    \ Javascript, you put comments in your code by preceding your line with //. An\
    \ example of a comment would be:\n\n```\n//This is a comment in Javascript\n```\n\
    \nJavascript allows the developer to write multiline comments. Within the browser,\
    \ the Javascript interpreter ignores any content between the opening multiline\
    \ comment symbol and the closing symbol. An example of a multiline comment appears\
    \ below:\n\n```\n/*\n This is an example of a multiline\n comment\n Mark Lassoff\n\
