- img_proc: true
  md: '# # CHAPTER 7

    WORKING WITH ARRAYS


    +   CHAPTER OBJECTIVES:

    * You will be able to create and declare arrays.

    * You will learn how to use the for-loop to index arrays.

    * You will be able to manipulate arrays via the push and pop functions.

    * You will learn how to sort and splice arrays.


    # ## 7.1 DECLARING ARRAYS


    In chapter 7 we will be discussing arrays. Arrays are objects that are capable
    of holding a series of values all at one time. For example, if you need to keep
    a list of all the products a company offers within one variable, an array may
    contain all these values or a series of values.


    Creating an array is fairly straightforward. There are three methods of creating
    arrays in Javascript.


    > The first one is the standard method, which is accomplished by creating a variable
    and assigning a new Array() object to the variable. This process is known as instantiation
    of an array object. For example:


    ```

    var firstNames = new Array();

    ```


    Populating the standard array is done by writing the variable name followed by
    the array index and using the assignment operator as you would with a variable.
    For example:


    ```

    firstNames[0] = "John";nfirstNames[1] = "Mary";nfirstNames[2] = "Jane"

    firstNames[3] = "Sam"

    firstNames[4] = "Johnny";

    ```'
  merge: -1
  pgno: 172
- img_proc: true
  md: "The **array index** is the position of the value in the array. In the previous\
    \ example, they are the numbers enclosed in the square brackets: [0], [1], [2],\
    \ [3], [4].\n\nArrays always start with the position 0; therefore when populating\
    \ your array, you must always start with the \"0\" index. A common error developers\
    \ make when working with Arrays is known as the \"one-off error.\" Because the\
    \ first member of an array is in index 0 and the second member is in index 1,\
    \ it is common for programmers to be \"one off\" when selecting an index from\
    \ the array.\n\nFollowing is the HTML code listing that shows the standard assignment\
    \ for arrays. The array variable *firstNames* has been assigned five values:\n\
    \n```\n<html>\n<head>\n<title>\n</title>\n</head>\n<body>\n  <script language=\"\
    javascript\" type=\"text/javascript\">\n    var firstNames = new Array();\n  \
    \  firstNames[0] = \"John\";\n    firstNames[1] = \"Mary\";\n    firstNames[2]\
    \ = \"Jane\";\n    firstNames[3] = \"Sam\";\n    firstNames[4] = \"Johnny\";\n\
    \  </script>\n</body>\n</html>\n```\n\nAnother way of creating an array is by\
    \ using the **condensed method**. The condensed method is simply a truncated way\
    \ of assigning values to the array. Instead of assigning values individually,\
    \ we write out the members of the array within the instantiation, putting the\
    \ array objects all in the same line of code as follows:"
