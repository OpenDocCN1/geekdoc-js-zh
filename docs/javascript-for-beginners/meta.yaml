    \ is \" + difference);\n      }\n      else if (z == \"*\")\n      {\n       \
    \ var product = x*y;\n        alert(\"Product is \" + product);\n      }\n   \
    \   else if (z == \"/\")\n      {\n        var quotient = x/y;\n        alert(\"\
    Quotient is \" + quotient);\n      }\n    }\n  </script>\n</head>\n<body>\n  <input\
    \ type=\"button\" value=\"Simple Arithmetic... please click here to continue\"\
    \ onclick=\"mathProb()\" />\n</body>\n</html>\n```\n\n## CHAPTER 6 SUMMARY\n\n\
    In Chapter 6, we discussed functions. Functions are blocks of code that can be\
    \ called from a page and reused many times as needed. You learned how to create\
    \ functions within a page and attach them, which allowed greater flexibility in\
    \ using multiple pages. You also learned how to pass values to a function and\
    \ return values to the function. We discussed how to manipulate the values that\
    \ were sent to the function. We also covered how to use events. Here, we taught\
    \ how to use onclick, onmouseover events. In the next chapter, we will be focusing\
    \ on creating and manipulating arrays.\n\n## CHAPTER 7 WORKING WITH ARRAYS\n\n\
    OBJECTIVES:\n- You will be able to create and declare arrays.\n- You will learn\
    \ how to use for loop to index arrays.\n- You will be able to manipulate arrays\
    \ via the push functions.\n- You will learn how to sort and splice arrays.\n\n\
    ## 7.1 DECLARING ARRAYS\n\nIn chapter 7 we will be discussing arrays. Arrays are\
    \ objects capable of holding a series of values all at once. For example, if you\
    \ need a list of products, an array may contain these values. Creating an array\
    \ is straightforward. There are three methods of creating arrays in Javascript.\n\
    \nThe first one is the standard method, which is accomplished by creating a variable\
    \ and assigning new Array() object to the variable. This process is known as instantiation\
    \ of an array. For example:\n\n```javascript\nvar firstNames = new Array();\n\
    ```\n\nPopulating the standard array is done by writing the variable name followed\
    \ by the array index and using the assignment operator as you would with a variable.\
    \ For example:\n\n```javascript\nfirstNames[0] = \"John\";\nfirstNames[1] = \"\
    Mary\";\nfirstNames[2] = \"Jane\";\nfirstNames[3] = \"Sam\";\nfirstNames[4] =\
    \ \"Johnny\";\n```\n\nThe **array index** is the position of the value in the\
    \ array. In the previous example, they are the numbers enclosed in square brackets:\
    \ [0], [1], [2], [3], [4]. Arrays always start with position 0; therefore when\
    \ populating your array, you must always start with the \"0\" index. A common\
    \ error developers make when working with Arrays is known as the \"one off error.\"\
    \ Because the first member of an array is in index 0 and the second member is\
    \ in index 1, it is common for programmers to be \"one off\" when selecting an\
    \ index from the array.\n\nFollowing is the HTML code that shows the standard\
    \ assignment for arrays. The array variable *firstNames* has been assigned five\
    \ values:\n\n```html\n<html>\n<head>\n<title></title>\n</head>\n<body>\n  <script\
    \ language=\"javascript\" type=\"text/javascript\">\n    var firstNames = new\
    \ Array();\n    firstNames[0] = \"John\";\n    firstNames[1] = \"Mary\";\n   \
    \ firstNames[2] = \"Jane\";\n    firstNames[3] = \"Sam\";\n    firstNames[4] =\
    \ \"Johnny\";\n  </script>\n</body>\n</html>\n```\n\nAnother way of creating an\
    \ array is by using the **condensed method**. The condensed method is simply a\
    \ truncated way of assigning values to the array. Instead of assigning values\
    \ individually, we write out the members of the array within the instantiation,\
    \ putting the array objects all in the same line of code as follows:\n\n```html\n\
    <html>\n<head>\n<title></title>\n</head>\n<body>\n  <script language=\"javascript\"\
    \ type=\"text/javascript\">\n    var animals = new Array(\"dog\", \"cat\", \"\
    mouse\", \"hamster\", \"toad\");\n  </script>\n</body>\n</html>\n```\n\nEven though\
    \ this method doesn't assign numbers to the list of arrays, you should know that\
    \ the first array is always index number zero by default.\n\nvar animals = new\
    \ Array(\"dog\", \"cat\", \"mouse\", \"hamster\", \"toad\");\n\nIndex Numbers:\n\
    [0] [1] [2] [3] [4]\n\nThe third and final method of creating an array is the\
    \ literal array method. In this method, an array is created by declaring a variable\
    \ and setting the values in square brackets separated by commas. The difference\
    \ lies in the instantiation where the new variable and data type declaration \"\
    new Array\" are no longer included in the code:\n\n```html\n<html>\n<head>\n<title></title>\n\
    </head>\n<body>\n  <script language=\"javascript\" type=\"text/javascript\">\n\
    \    var companies = [\"Apple\", \"Google\", \"Cnet\", \"Udemy\", \"GE\"];\n \
    \ </script>\n</body>\n</html>\n```\n\nThe same index numbering scheme applies\
    \ to this method well.\n\nIndex Numbers: [0] [1] [2] [3] [4]\n\nThese three methods\
    \ work essentially the same way and the results are the same. Once the array is\
    \ created the Javascript interpreter within the browser makes no distinction on\
    \ how the array was created. In the three examples above, all of the arrays have\
    \ five members that can be accessed by their index number. The dialogue box \"\
    alert\" can be used to display any member of the array.\n\n## CODE LISTING: STANDARD\
    \ METHOD\nARRAY DECLARATION\nDISPLAY ARRAY MEMBER\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>Standard Array</title>\n</head>\n<body>\n  <script language=\"\
    javascript\">\n    var firstNames = new Array();\n    firstNames[0] = \"John\"\
    ;\n    firstNames[1] = \"Mary\";\n    firstNames[2] = \"Jane\";\n    firstNames[3]\
    \ = \"Sam\";\n    firstNames[4] = \"Johnny\";\n    alert(firstNames[3]);\n  </script>\n\
    </body>\n</html>\n```"
