    \ The segment code for the button is as follows:\n\n```html\n<input type=\"button\"\
    \ value=\"Press Me!\" onclick=\"changeContent()\"/>\n</body>\n</html>\n```\n\n\
    Let's go back to the head of the document—right between the script tags—and insert\
