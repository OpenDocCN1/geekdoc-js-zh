- md: "# CHAPTER 10\nDOCUMENT OBJECT AND INNERHTML PROPERTIES\n\n## CHAPTER OBJECTIVES:\n\
    - You will be able to extract text from text boxes and display extracted text\
    \ using alert box.\n- You will learn how to highlight texts using color background.\n\
    - You will be able to change page content within a page without popping out a\
    \ new window.\n- You will learn how to install Firebug and how it is used to see\
    \ the changes in codes place in a page.\n\n## 10.1 DOCUMENT OBJECT\n\nIn this\
    \ final chapter (whew!), we will present the overview of the document object and\
    \ innerHTML properties. We will also introduce a Firefox utility called Firebug,\
    \ which enables you to view changes in the page content changes.\n\nLet's first\
    \ discuss document object. When we say document object, we're referring to both\
    \ internal browser settings and the elements that are found or placed within an\
    \ HTML page document. The document object is stored in the browser in a hierarchical\
    \ format and effectively serves as memory or RAM for your Javascript programs.\
    \ The entire state of the browser is stored in the document object—including its\
    \ HTML, JavaScript, and CSS code. There are standardized ways of working with\
    \ the document object and its various properties (hundreds of them). This standardized\
    \ model—which is fairly consistent across browsers—is known as the document object\
    \ model.\n\n> Some examples of document objects: text fields, reply buttons, hyperlinks,\
    \ etc.\n\nThe innerHTML property provides a way to access different facets of\
    \ the document object—specifically those that are designed to hold HTML code.\
    \ The innerHTML property allows you both to retrieve and set the HTML in a document\
    \ node.\n\nBy taking advantage of the document object model, you can adjust almost\
    \ anything within the browser—including the CSS that is styling your content.\
    \ It is important to understand that what is stored in the document object is\
    \ dynamic, so the values may change as the user interacts with the website. For\
    \ example, if the user types information into a form, the information is stored\
    \ in the document object where you may access it—before it is submitted to the\
    \ server.\n\nFirst, let us create a HTML document that will have three elements\
    \ in it: two text input fields and a button. These elements will be manipulated\
    \ using the innerHTML property and document object.\n\nIn our HTML document body,\
    \ include the elements first and last as text boxes and a button labeled with\
    \ the text \"Press Me\". The button will trigger a function called processName()\
    \ via the onclick event. This is how the body element will be coded:\n\n```html\n\
    <body>\n  First: <input type=\"text\" id=\"first\"/>\n  <br/>\n  Last: <input\
    \ type=\"text\" id=\"last\"/>\n  <input type=\"button\" value=\"Press Me\" onclick=\"\
    processName()\"/>\n</body>\n```\n\nThe function processName() will extract the\
    \ values input in the first and last text box elements. Before we get to that,\
    \ make sure that you write the script tag in the head element of the HTML document\
    \ like so:\n\n```html\n<script language=\"javascript\" type=\"text/javascript\"\
    >\n```\n\nThen let's declare two local variables—first and last—which will be\
    \ used to hold or contain the values that will be extracted from the text box\
    \ elements.\n\n```javascript\nvar first;\nvar last;\n```\n\nNow initialize these\
    \ variables by assigning the method getElementById().value, to extract the values\
    \ from the text boxes. The code should look like this:\n\n```javascript\ndocument.getElementById('first').value;\n\
    last=document.getElementById('last').value;\n```\n\n> Be sure to include .value\
    \ because without it, only the text box will be extracted—not the values inside\
    \ the text box elements.\n\nHere's all the code we've written so far:\n\n```html\n\
    <script language=\"javascript\" type=\"text/javascript\">\n  function processName()\
    \ {\n    var first;\n    var last;\n    first=document.getElementById('first').value;\n\
    \    last=document.getElementById('last').value;\n  }\n</script>\n\n\nTo make\
    \ it easy, we'll use an alert box to display the extracted values. Here is the\
    \ alert code:\n\n```javascript\nalert(first + \" \" + last);\n```\n\n# CODE LISTING:\
    \ The DOCUMENT OBJECT WITH Alert Box\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <title>The Document Object </title>\n  <script language=\"javascript\" type=\"\
    text/javascript\">\n    function processName() {\n      var first;\n      var\
    \ last;\n      first = document.getElementById('first').value;\n      last = document.getElementById('last').value;\n\
    \n      alert(first + \" \" + last);\n    }\n  </script>\n</head>\n<body>\n  First:\
    \ <input type=\"text\" id=\"first\"/>\n  <br/>\n  Last: <input type=\"text\" id=\"\
    last\"/>\n  <input type=\"button\" value=\"Press Me\" onclick=\"processName()\"\
    />\n</body>\n</html>\n```"
  mdcn: "\n# 第 10 章\n文档对象与 innerHTML 属性\n\n## 章节目标：\n- 你将能够从文本框中提取文本，并使用警告框显示提取的文本。\n\
    - 你将学习如何使用背景颜色来高亮文本。\n- 你将能够在不弹出新窗口的情况下更改页面内的内容。\n- 你将学习如何安装 Firebug 以及如何使用它来查看页面中代码的变化。\n\
    \n## 10.1 文档对象 (DOCUMENT OBJECT)\n\n在最后一章中（呼！），我们将介绍文档对象和 innerHTML 属性的概述。我们还将介绍一个名为\
    \ Firebug 的 Firefox 扩展，它可以让你查看页面内容的变化。\n\n让我们先讨论文档对象。当我们说文档对象时，我们指的是浏览器的内部设置，以及发现或放置在\
    \ HTML 页面文档中的元素。文档对象以分级格式存储在浏览器中，有效地充当你的 JavaScript 程序的内存或 RAM。浏览器的整个状态都存储在文档对象中——包括它的\
    \ HTML、JavaScript 和 CSS 代码。处理文档对象及其各种属性（数百个）有标准化的方法。这种在不同浏览器之间保持相当一致的标准模型被称为文档对象模型（DOM）。\n\
    \n> 文档对象的示例：文本字段、回复按钮、超链接等。\n\ninnerHTML 属性提供了一种访问文档对象不同方面的方法——特别是那些设计用于存放 HTML\
    \ 代码的部分。innerHTML 属性允许你同时检索和设置文档节点中的 HTML。\n\n通过利用文档对象模型，你可以调整浏览器中的几乎任何内容——包括用于设置内容的\
    \ CSS。重要的是要理解存储在文档对象中的内容是动态的，因此值可能会随着用户与网站的交互而改变。例如，如果用户在表单中输入信息，这些信息将存储在文档对象中，你可以在它们提交到服务器之前对它们进行访问。\n\
    \n首先，让我们创建一个 HTML 文档，其中包含三个元素：两个文本输入字段和一个按钮。这些元素将使用 innerHTML 属性和文档对象进行操作。\n\n\
    在我们的 HTML 文档体中，将第一个和最后一个元素包含为文本框，以及一个标记为“Press Me”的按钮。按钮将通过 `onclick` 事件触发名为 `processName()`\
    \ 的函数。body 元素的编码方式如下：\n\n```html\n<body>\n  First: <input type=\"text\" id=\"\
    first\"/>\n  <br/>\n  Last: <input type=\"text\" id=\"last\"/>\n  <input type=\"\
    button\" value=\"Press Me\" onclick=\"processName()\"/>\n</body>\n```\n\n`processName()`\
    \ 函数将提取第一个和最后一个文本框元素中输入的值。在开始之前，请确保你在 HTML 文档的 head 元素中这样编写 `script` 标签：\n\n```html\n\
    <script language=\"javascript\" type=\"text/javascript\">\n```\n\n然后让我们声明两个局部变量——`first`\
    \ 和 `last`——它们将用于存储或包含从文本框元素中提取的值。\n\n```javascript\nvar first;\nvar last;\n```\n\
    \n现在，通过分配 `getElementById().value` 方法来初始化这些变量，从文本框中提取值。代码所示：\n\n```javascript\n\
    document.getElementById('first').value;\nlast=document.getElementById('last').value;\n\
    ```\n\n> 确保包含 `.value`，因为没有它，提取的只是文本框而不是文本框元素内部的值。\n\n这里是我们到为止编写的所有代码：\n\n```html\n\
    <script language=\"javascript\" type=\"text/javascript\">\n  function processName()\
    \ {\n    var first;\n    var last;\n    first=document.getElementById('first').value;\n\
    \    last=document.getElementById('last').value;\n  }\n</script>\n```\n\n为了方便起见，我们将使用警告框（alert\
    \ box）来显示提取的值。这是警告代码：\n\n```javascript\nalert(first + \" \" + last);\n```\n\n\
    # 代码列表：带警告框的文档对象\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>The Document\
    \ Object </title>\n  <script language=\"javascript\" type=\"text/javascript\"\
    >\n    function processName() {\n      var first;\n      var last;\n      first\
    \ = document.getElementById('first').value;\n      last = document.getElementById('last').value;\n\
    \n      alert(first + \" \" + last);\n    }\n  </script>\n</head>\n<body>\n  First:\
    \ <input type=\"text\" id=\"first\"/>\n  <br/>\n  Last: <input type=\"text\" id=\"\
    last\"/>\n  <input type=\"button\" value=\"Press Me\" onclick=\"processName()\"\
    />\n</body>\n</html>\n```\n"
