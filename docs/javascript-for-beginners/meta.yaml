    \ \" + grades.length + \"<br/>\");\ngrades.push(100,63);\n//Display iteration\
    \ and grades.\nfor(x in grades) {\n  document.write(\"Iteration \" + x + \": \"\
    );\n  document.write(grades[x] + \"<br/>\");\n}\n\ndocument.write(\"<br/> Array\
    \ length after PUSH: \" + grades.length + \"<br/>\");\n</script>\n</body>\n</html>\n\
    ```\n\nThe output will look like this:\n\n| Literal Array For-In-loop with Push\
    \ |\n| :--- | :--- |\n| Array length | 10 |\n| Iteration 0 | 85 |\n| Iteration\
