    javascript\" type=\"text/javascript\">\n\n  var numericalGrade=88;\n  var letterGrade;\n\
    \  var remark;\n\n  if (numericalGrade >= 90)\n  {\n    letterGrade = \"A\";\n\
    \    remark = \"Passed\";\n  }\n```"
