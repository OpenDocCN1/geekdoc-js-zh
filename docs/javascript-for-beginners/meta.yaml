  md: "Now let's discuss some methods available with the string object. The first\
    \ method we will talk about is charAt(). The charAt() method displays the character's\
    \ position in the string. Like Javascript arrays, all strings are zero indexed.\n\
    \nUsing the same previous code line, Display Object's Length, we will tweak the\
    \ code that charAt() is included.\n\nWe'll use a for-loop to iterate through the\
    \ string one character at a time. Proper use of this function will ensure that\
    \ every character position is scanned while going through the complete string\
    \ set. The for-loop routine should look like:\n\n```\nfor (var i=0; i < phrase.length;\
    \ i++) {\n    document.write(i + \": \" + phrase.charAt(i));\n    document.write(\"\
    <br>\");\n}\n```\n\nThe complete code routine for this exercise would be:\n\n\
    # CODE LISTING: THE STRING OBJECT METHOD CHARAT()\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>The String Method charAt()</title>\n</head>\n<body>\n    <script\
    \ language=\"javascript\" type=\"text/javascript\">\n        var phrase = \"If\
    \ you are strong enough, there are no precedents.\";\n\n        for (var i=0;\
    \ i < phrase.length; i++) {\n            document.write(i + \": \" + phrase);\n\
    \        }\n    </script>\n</body>\n</html>\n```"
