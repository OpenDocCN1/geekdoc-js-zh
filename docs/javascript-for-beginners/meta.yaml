    \ to use data entered in a dialog box in an application.\n\n# 4.1 THREE TYPES\
    \ OF DIALOG BOXES\n\nIn this section, we are going to review the three types of\
    \ dialog boxes that are available to Javascript programmers. These dialog boxes\
    \ pop up in front of the browser windows and force the user to acknowledge them\
    \ before they can continue using the web application. Javascript dialogs are sometimes\
    \ referred to as modal dialogs since they require the user to respond before doing\
    \ anything else within the browser.\n\nThe first dialog box that we'll look at\
    \ is the alert box, which is the easiest to implement. An alert box displays a\
    \ message window that shows the strings placed or value assigned to the variable\
    \ within the Javascript alert command.\n\nThe alert box is set up by using the\
    \ command alert, followed by parentheses:\n\n```\nalert(\"Have a nice day!\");\n\
    ```\n\nCreating the alert box is really very simple. In fact, below is the complete\
    \ code listing for a \"Have a nice day!\" alert box:\n\n```\n<!DOCTYPE HTML PUBLIC\
    \ \"//W3C//DTD HTML 4.01//EN\"\n  \"http://www.w3.org/TR/html4/strict.dtd\"\n\
    >\n<html lang=\"en\">\n<head>\n  <title>Dialog Box - Alert</title>\n```"
