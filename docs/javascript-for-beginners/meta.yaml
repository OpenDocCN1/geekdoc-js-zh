  mdcn: "\n# 复习题\n\n1. while 循环是如何运作的？\n\n   - a. 当某个条件为“TRUE”（真）时循环执行。\n   - b. 当某个条件为“FALSE”（假）时循环执行。\n\
    \   - c. 当程序结束时循环执行。\n   - d. 当另一个程序在运行时循环执行。\n\n2. 如果你想保证循环在测试条件之前至少执行一次迭代，你应该使用哪种循环？\n\
    \n   - a. while 循环。\n   - b. do-while 循环。\n   - c. for 循环。\n   - d. if-then 循环。\n\
    \n3. do-while 循环与 while 循环有何区别？\n\n   - a. 条件在开始时设置。\n   - b. 条件在结束设置。\n   - c.\
    \ 没有条件。\n   - d. 没有区别。\n\n# 5.2 FOR 循环与循环的实际应用\n\nfor 循环（for-loops）是紧凑的循环，允许你在循环命令本身中设置变量、条件和继续条件（或计数器）。它们可以节省时间，易于理解，并且从长远来看可以产生更少的代码。\n\
    \nfor 循环的写法如下：\n\n```\nfor(var i=100; i > -1; i=i-5)\n```\n\nfor 循环命令包含三个元素。\n\
    \n- 第一是计数器变量的声明及其初始值的赋值。\n\n  > 在上面的示例中，它是 `var i=100;`。\n\n- for 循环的第二部分是继续条件，它将决定循环迭代的次数；在这里，只要变量大于\
    \ -1，循环就会一直迭代，即上面示例中的 `i >-1`。\n\n- for 循环的第三个也是最后一个元素是“计数器（counter）”。计数器决定了计数器变量如何随着循环的每次迭代而变化。在上面的示例中，循环将从\
    \ 100 开始，每次迭代递减 5，即 `i=i-5`。基于此，循环将迭代（或循环）21 次。\n\n在使用 ways for 循环时必须小心，因为如果错误地设置了计数器，很容易创建死循环。\n\
    \n以下是上一个 for 循环示例的完整代码：\n\n# 代码列表：for 循环\n\n```\n<!DOCTYPE HTML PUBLIC \"//W3C//DTD\
    \ HTML 4.01//EN\"\n \"http://www.w3.org/TR/html4/strict.dtd\">\n<html lang=\"\
    en\">\n<head>\n <title>For Loops</title>\n</head>\n<body>\n  <script language=\"\
    javascript\" type=\"text/javascript\">\n    for(var i=100; i > -1; i=i-5)\n  \
    \  {\n      document.write(i + \"<br>\");\n    }\n\n    /* Endless Loop\n    for(var\
    \ i = 0; i >= 0; i++)\n    {\n      document.write(i + \"<br>\");\n    }\n   \
    \ */\n  </script>\n</body>\n</html>\n```\n\n输出命令中包含了一个 `break`，以便每个数字都显示在下一行。请注意注释部分，那里展示了死循环代码的示例。\n\
    \n这是输出在浏览器中的样式：\n\n| For 循环 |\n|---|\n| 100 |\n| 95 |\n| 90 |\n| 85 |\n| 80 |\n\
    | 75 |\n| 70 |\n| 65 |\n| 60 |\n| 55 |\n| 50 |\n| 45 |\n| 40 |\n| 35 |\n| 30 |\n\
    | 25 |\n| 20 |\n| 15 |\n| 10 |\n| 5 |\n| 0 |\n\n循环是编程中最有结构之一。它们可以用于各种实际应用。\n\n\
    在这一节中，我们将循环与提示对话框（prompt dialog）概念结合。提示对话框概念在上一章中引入，用于创建一个允许用户输入他们喜爱的乐队的程序。循环的这种应用有助于演示循环的一个实际用途。\n\
    \n让我们使用叙述性算法来展示程序中将发生事件。\n\n声明一个接收用户输入的变量。将其命名为 `ui`。\n分配一个空值（意味着内部不放入任何字符串或数值，只留空格）。第1\
    \ 步和第 2 步的代码应该是：\n\n```\nvar ui = \"\";\n```\n\n引入循环。如果 `ui` 的值不是 \"xxx\"，循环将继续运行。代码如下：\n\
    \n```javascript\nwhile(ui != \"xxx\")\n```\n\n编写当继续条件被求为 TRUE 时将执行的代码，并将代码放在 `while`\
    \ 循环内部。\n在循环中嵌套一个条件，用以测试用户输入并做出相应响应。第4 步和第 5 步的合并代码应该是：\n\n```javascript\n{\n\
    \  ui = prompt(\"输入一个你喜爱的乐队的名称。输入 xxx 停止\");\n  if(ui != \"xxx\")\n  {\n    document.write(ui\
    \ + \"<br>\");\n  }\n}\n```\n\n结束程序代码。\n上述算法的完整代码列表为：\n\n# 代码列表：循环输入\n\n```html\n\
    <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
    >\n<html lang=\"en\">\n<head>\n<title>Looping Input</title>\n</head>\n<body>\n\
    ```\n(注：由于原文未提供后续 body 标签内的内容，翻译处保持逻辑完整)\n"
