    \n## Chapter 6 Lab Exercise 4\n\nSimple Arithmetic... please click here to continue\n\
    \n![](img/c922782503c42c65b3a7c97e4fad8964_169_0.png)\n\nFIGURE 6-1\n\n## CODE\
    \ LISTING: MODIFIED CHAPTER LAB EXERCISE 2B\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>Chapter 6 Lab Exercise 4</title>\n  <script language=\"javascript\"\
