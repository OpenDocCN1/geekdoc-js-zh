    <br>\");\n    outputArray();\n    placesToVisit.sort();\n    document.write(\"\
    <br>\");\n    outputArray();\n  </script>\n</body>\n</html>\n```\n\n## CHAPTER\
    \ 7 SUMMARY\n\nIn this chapter, we discussed working with arrays and how they\
    \ can be accessed and manipulated.\n\nWe examined the basics of defining arrays,\
    \ creating and declaring arrays and using for-loops to index arrays.\n\nAlso covered\
    \ in this chapter are push, pop, sort and splice, which are methods for manipulating\
    \ arrays.\n\nIn the next chapter we will be covering the string object.\n\n##\
    \ CHAPTER 8\n## THE STRING OBJECT\n\nCHAPTER OBJECTIVES:\n\n- You will be able\
    \ to understand what string object properties and methods.\n- You will learn how\
    \ to alter string properties using methods.\n- You will be able to replace strings\
    \ with other strings via loops.\n- You will learn how to count the number of characters\
    \ a string has and the result.\n- You will also learn how to convert a comma separated\
    \ string into an array.\n\n## 8.1 OBJECT PROPERTIES AND METHODS\n\nIn this chapter\
    \ we will concentrate on string objects. A great website reference for our discussion:\n\
    \n![](img/c922782503c42c65b3a7c97e4fad8964_202_0.png)\n\nIt is recommended that\
    \ you open this webpage as you learn the lessons in this chapter.\n\nWe discussed\
    \ strings earlier in the book and defined them as a series of letters and numbers.\
    \ When working with strings we have generally surrounded the string itself with\
    \ double quotes. String objects are no different—in fact, all strings are objects.\
    \ This means, like all objects in Javascript, strings have properties that describe\
    \ them and methods (functions) that manipulate them.\n\nWhen we say property,\
    \ this is the attribute that is associated with the object that describes the\
    \ object itself. In this lesson we will discuss the length property. Before moving\
    \ on to that, let's briefly describe methods. Methods are the actions or processes\
    \ that can be applied or performed to the object. For a string object, examples\
    \ would be changing from lowercase to uppercase, replacing with another string,\
    \ removing a string and appending to the string.\n\nWhen we create a string in\
    \ Javascript we are creating a string object. You already know how to do this.\
    \ We'll assign a string to the variable `message`.\n\n```\nvar message=\"Hello\
    \ World\"\n```\n\nNext, we'll create another variable, we'll use `x`, which will\
    \ hold length of the variable `message`:\n\n```\nvar x = message.length\n```\n\
    \nIn this example, `message` is the name of the string and length is the property.\
    \ If you display the value of `x`, you get the result 12.\n\n![](img/c922782503c42c65b3a7c97e4fad8964_203_0.png)\n\
    \nHere is the complete code for displaying the length of \"Hello World!\" string:\n\
    \n## CODE LISTING: STRING PROPERTY–LENGTH\n\n```html\n<html>\n<head>\n<title>Hello\
    \ World--Length</title>\n</head>\n<body>\n<script language=\"javascript\" type=\"\
    text/javascript\">\n    var message = \"Hello World!\";\n    var x=message.length;\n\
    \n    document.write(\"Length: \" + x);\n    document.write(\"<br>\");\n</script>\n\
    </body>\n</html>\n```\n\nThis is the output of the above code displayed in:\n\n\
    ![](img/c922782503c42c65b3a7c97e4fad8964_204_0.png)\n\nAs another example, let's\
    \ use the quote, \"If you are strong enough, there are no precedents.\" from F.\
    \ Scott Fitzgerald. Create a basic HTML document and include the script element\
    \ in the body:\n\n```html\n<script language=\"javascript\" type=\"text/javascript\"\
    >\n```\n\nAssign the quote to the variable phrase and close the script tag:\n\n\
    ```html\nvar phrase = \"If you are strong enough, there are no precedents.\";\n\
    </script>\n```\n\nUsing length property, count the number of characters in the\
    \ declared string. Display the quote using document.write() command, the correct\
    \ syntax is:\n\n```\ndocument.write(\"length: \" + phrase.length)\n```\n\n## CODE\
    \ LISTING: DISPLAY OBJECT’S LENGTH\n\n```html\n<html>\n<head>\n<title>The String\
    \ Object--Length</title>\n</head>\n<body>\n  <script language=\"javascript\" type=\"\
    text/javascript\">\n    var phrase = \"If you are strong enough, there are no\
    \ precedents\";\n\n    document.write(\"Length: \" + phrase.length);\n    document.write(\"\
    <br>\");\n  </script>\n</body>\n</html>\n```\n\nThe output of this code should\
    \ look like:\n\n| Length: 50 |\n\nThe spaces and special characters were included\
    \ when the characters were counted, that is why the result is 50.\n\nNow let's\
    \ discuss some methods available with the string object. The first method we will\
    \ talk about is charAt(). The charAt() method displays the character's position\
    \ in the string. Like Javascript arrays, all strings are zero indexed.\n\nUsing\
    \ the same previous code line, Display Object's Length, we will tweak the code\
    \ that charAt() is included. We'll use a for-loop to iterate through the string\
    \ one character at a time. Proper use of this function will ensure that every\
    \ character position is scanned while going through the complete string set. The\
    \ for-loop routine should look like:\n\n```\nfor (var i=0; i < phrase.length;\
    \ i++) {\n    document.write(i + \": \" + phrase.charAt(i));\n    document.write(\"\
    <br>\");\n}\n```\n\nThe complete code routine for this exercise would be:\n\n\
    ## CODE LISTING: THE STRING METHOD CHARAT()\n\n```html\n<html>\n<head>\n<title>The\
    \ String Method charAt()</title>\n</head>\n<body>\n    <script language=\"javascript\"\
    \ type=\"text/javascript\">\n        var phrase = \"If you are strong enough,\
    \ there are no precedents.\";\n\n        for (var i=0; i < phrase.length; i++)\
    \ {\n            document.write(i + \": \" + phrase.charAt(i));\n        }\n \
    \   </script>\n</body>\n</html>\n```\n\nThe output will look like this:\n\n![](img/c922782503c42c65b3a7c97e4fad8964_207_0.png)\n\
    \n+ 0:I\n1:f\n2:\n3:y\n4:o 25:\n5:u 26:t\n6: 27:h\n7:a 28:c\n8:r 29:r\n9:e 30:c\n\
    10: 31:\n11:s 32:a\n12:t 33:r\n13:r 34:e\n14:o 35:\n15:n 36:n\n16:g 37:o\n17:\
    \ 38:\n18:c 39:p\n19:n 40:r\n20:o 41:e\n21:u 42:c\n22:g 43:c\n23:h 44:d\n24:.\
    \ 45:e\n46:n\n47:t\n48:s\n49:.\n\nWe used the for-loop technique to treat the\
    \ string object like an array of characters."
