    \ loop through the members of the array. The beauty of this looping method is\
    \ that it will automatically loop through each member of the array based on its\
    \ length property without needing to know what the actual length of the array\
    \ is. The length is used implicitly without being explicitly stated. (Mention\
    \ that tonight at the dinner table and see what kind of reaction you get...)\n\
    \nWe'll write the code that will display the length of the *array* grades and\
    \ its iteration number on the next line; this will happen for each of the array\
    \ members successively and on separate lines. The code listing is as follows:\n\
    \n## CODE LISTING: FOR-IN-LOOP\n\n```html\n<!DOCTYPE html>\n\n<html>\n<head>\n\
    \  <title>Literal Array For-In-Loop</title>\n</head>\n\n<body>\n  <script language=\"\
    javascript\" type=\"text/javascript\">\n    var grades = [85,92,70,63, 55, 92,88,77,91,91];\n\
    \    //Display array length\n    document.write(\"Array length: \" + grades.length\
    \ + \"<br/>\");\n    //Display Iteration then the grade\n    for(x in grades)\
