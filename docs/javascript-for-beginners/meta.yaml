    time, let us practice with "===", called "equal to", as the comparison operator.


    ![](img/c922782503c42c65b3a7c97e4fad8964_51_0.png)


    > By the way—it’s a common mistake to confuse the assignment operator "=" with
    the comparison equality operator "==". When I teach classroom Javascript courses
    in front of live students, it is one of the most common errors I see them make
    on the lab assignments. Be careful!


    Adding to the confusion is that Javascript has an "==" operator that means equal
    in value and type. I’ve never actually used this operator in live production Javascript
    code that I have written; however, it does have a distinct meaning. Examine the
    following:


    ![](img/c922782503c42c65b3a7c97e4fad8964_51_1.png)


    ```

    "1" == 1 TRUE

    "1" === 1 FALSE

    ```


    Essentially, the first statement above is evaluated as TRUE because both sides
    of the statement have the same value: 1. The "===" operator tests value only.
    You will note that the first 1 is a string because it is encased in quotes. The
    second 1 is a pure number value. Since "===" tests for type'
