    Do-while loops function in a similar manner as while-loops, they only follow a
    different syntax. The one functional difference of a do-while loop is that it
    is guaranteed to iterate at least once—even if the continuation condition is initially
    false.


    You start a do-while loop with the do-statement and end the loop with the while-statement.
    This means that the condition is tested at the end of the loop, and if it is evaluated
    as TRUE, the loop will continue to iterate. This is an example of a do-while loop.'
