    \ the document object and the style property. Any CSS rule that you can create\
    \ in a style sheet can be created dynamically with the document object and style\
    \ property.\n\n# 10.2 THE INNERHTML PROPERTY\n\nThe innerHTML property is used\
    \ to access the HTML inside any element within the HTML code. For example, a <p>\
    \ paragraph element may have text and other HTML tags inside it. By using the\
    \ innerHTML property, we can access the content to both retrieve and modify it.\n\
    \nhttp://www.w3.org/TR/dom06.html uses this explanation of what innerHTML is:\n\
