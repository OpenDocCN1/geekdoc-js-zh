    \ pass two values to a function, write the values within the function call inside\
    \ the parentheses and then separate them with a comma:\n\n```\naddTheseNumbers(100,\
    \ 17);\n```\n\nThe function declaration must also accommodate two variables. If\
    \ we used x and y as the variables within the function, the function declaration\
    \ might be written as:\n\n```\nfunction addTheseNumbers(x, y)\n```\n\nWhat we\
