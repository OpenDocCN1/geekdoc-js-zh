    \ above a citizen.\nSorry, you cannot vote. You are 18 but you are not a citizen.\n\
    Sorry, you cannot vote. Either you are below 18 or you are not a citizen.\nYou\
    \ are the course instructor!\n\n# CODE LISTING: LAB ACTIVITY SOLUTION\n\n```\n\
