    window.innerHeight=200;\ndocument.write(\"Width: \" + window.innerWidth);\ndocument.write(\"\
    <br/>\");\ndocument.write(\"Height: \" + window.innerHeight);\n</script>\n</body>\n\
    </html>\n```\n\nHere is the output when viewed in the browser:\n\n![](img/c922782503c42c65b3a7c97e4fad8964_232_0.png)\n\
    \nCare must be observed when using dimension properties (innerWidth and innerHeight)\
    \ as they exhibit varied reactions and implement differently in different browsers.\
    \ There are instances that browsers do not respond accordingly with these inner\
    \ window settings.\n\nThe third object we will discuss is location. This object\
    \ can do one of two things: get the current page address or URL, or redirect the\
    \ browser to a new page location. The command syntax for getting the location\
    \ object is:\n\n```\ndocument.write(window.location);\n```\n\nIntegrating the\
    \ code in a complete code listing:\n\n# CODE LISTING: WINDOW OBJECT – GETTING\
    \ THE LOCATION\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Window Object--Location</title>\n\
    </head>\n<body>\n  <script language=\"javascript\" type=\"text/javascript\">\n\
    \    document.write(\"Location: \" + window.location);\n  </script>\n</body>\n\
    </html>\n```\n\nHere is what the output will look like when viewed in a browser\
    \ window:\n\n![](img/c922782503c42c65b3a7c97e4fad8964_233_0.png)\n\nNow let's\
    \ discuss how to set the location object.\nThe command syntax for setting the\
    \ location object would be:\n\n```\nwindow.location = \"page URL\";\n```\n\nFor\
    \ example:\n\n```javascript\nwindow.location = \"http://www.cnn.com\";\n```\n\n\
    Integrating the code in a complete code listing:\n\n# CODE LISTING: WINDOW OBJECT\
    \ – SETTING THE LOCATION\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Window\
    \ Object--Setting the Location</title>\n</head>\n<body>\n  <script language=\"\
    javascript\" type=\"text/javascript\">\n    window.location=\"http://www.cnn.com\"\
    ;\n  </script>\n</body>\n</html>\n```\n\nFollowing is the output when viewed in\
    \ the browser:\n\n![](img/c922782503c42c65b3a7c97e4fad8964_235_0.png)\n\nA property\
    \ that can be used along with the location object is **protocol**. See the following\
    \ code listing where the *location* referred to is a file:\n\n### CODE LISTING:\
    \ WINDOW OBJECT – LOCATION PROTOCOL\n\n```html\n<!DOCTYPE html>\n\n<html>\n<head>\n\
    \  <title>Window Object--Location Protocol</title>\n</head>\n<body>\n<script language=\"\
    javascript\" type=\"text/javascript\">\ndocument.write(\"Location protocol: \"\
    \ + window.location.protocol);\n</script>\n</body>\n</html>\n```\n\nFollowing\
    \ is the output when viewed in the browser:\n\n![](img/c922782503c42c65b3a7c97e4fad8964_236_0.png)\n\
    \n> Notice in this example that the returned value is \"file:\" because the source\
    \ page being viewed is from a local file. If it was a browser being viewed, it\
    \ would return either \"http:\" or \"https:\".\n\nLet's see how the returned value\
    \ changes when a location object is changed to a web page.\n\n# CODE LISTING:\
    \ WEB LOCATION PROTOCOL\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n</head>\n\
    <body>\n<script>\n  document.write(\"Location protocol: \" + window.location.protocol);\n\
    </script>\n</body>\n</html>\n```\n\nIn the event that the browser you are using\
    \ does not display the output as expected, try running the code in editor \"Tryit\
    \ Editor v 1.6\", and the output will be displayed as:\n\n![](img/c922782503c42c65b3a7c97e4fad8964_237_0.png)\n\
    \n# 9.3 SCREEN OBJECT\n\nLet's look at the **screen object**, which returns information\
    \ about the actual monitor being used. Using the screen object, we can determine\
    \ the screen height in pixels and color depth of the user's display.\n\nThe command\
    \ syntax for implementing the screen object height and color depth is:\n\n```javascript\n\
    document.write(\"Screen Height: \" + screen.height);\ndocument.write(\"Color Depth:\
    \ \" + screen.colorDepth);\n```\n\nIntegrating the code in the complete listing,\
    \ we have:\n\n# CODE LISTING: SCREEN OBJECT\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>Screen Object</title>\n</head>\n<body>\n  <script language=\"\
    javascript\" type=\"text/javascript\">\n    document.write(\"Screen Height: \"\
    \ + screen.height);\n    document.write(\"<br/>\");\n    document.write(\"Screen\
    \ Color Depth: \" + screen.colorDepth);\n  </script>\n</body>\n</html>\n```\n\n\
    This is how the output will look:\n\n![](img/c922782503c42c65b3a7c97e4fad8964_239_0.png)\n\
    \nThe screen height value that was returned came from the monitor's height setting\
    \ where the above code was run. See the following image:\n\n![](img/c922782503c42c65b3a7c97e4fad8964_239_1.png)\n\
    \nThe color depth value came from the monitor’s display settings. It can be verified\
    \ that it refers to the color setting of the monitor. Refer to the following image:\n\
    \n![](img/c922782503c42c65b3a7c97e4fad8964_240_0.png)\n\nAs you can see, information\
    \ such as window settings and user screen information can be obtained through\
    \ properties and methods in Javascript. This is very helpful when trying to identify\
    \ the browser window and screen attributes of a user’s environment. It helps us\
    \ adjust the window display so that an application can give the user the best\
    \ possible experience.\n\n# CHAPTER 9 EXERCISE\n\n- 1) Create a new HTML document.\
    \ Include the Javascript tags.\n- 2) Using the navigator object and document.write(),\
    \ display the browser name, browser version, and if cookies are enabled or not.\n\
    - 3) Using the screen object properties and document.write(), display the height\
    \ and width of the screen.\n- 4) Examine the documentation for the window object\
    \ located at http://www.w3schools.com/js/ref_window.asp. Identify and select the\
    \ appropriate method(s) and move the window to the top left-hand corner of the\
    \ screen. Change the window size to 300 pixels by 300 pixels.\n- 5) Run your Chapter\
    \ Exercise Solution in at least three different browsers. Take note of any differences.\n\
    \n# CODE LISTING: CHAPTER 9 EXERCISE SOLUTION\n\n```html\n<!DOCTYPE html>\n\n\
    <html>\n<head>\n<title>Chapter 9 Lab Solution</title>\n</head>\n<body>\n  <script\
    \ language=\"javascript\" type=\"text/javascript\">\n    document.write(\" Name:\
    \ \" + navigator.appName);\n    document.write(\"<br>Browser Version: \" + navigator.appVersion);\n\
    \    document.write(\"<br>Cookies: \" + navigator.cookieEnabled);\n    document.write(\"\
    <br>Screen Width: \" + screen.width);\n    document.write(\"<br>Screen Height:\
    \ \" + screen.height);\n\n    window.moveTo(0,0);\n    window.resizeTo(300,300);\n\
    \    document.write(\"<br>Window Inner Width: \" + window.innerWidth);\n    document.write(\"\
    <br>Window Inner Height: \" + window.innerHeight);\n  </script>\n</body>\n</html>\n\
    ```\n\nThis is how the output will appear in a web browser:\n\n![](img/c922782503c42c65b3a7c97e4fad8964_242_0.png)\n\
    \nMost browsers claim they already support *moveTo* and the *innerHeight* and\
    \ *innerWidth* properties, but in actuality, they are still having some errors\
    \ displaying/implementing them. As of this writing, only Firefox had consistent\
    \ results compared to other browsers.\n\n# CHAPTER 9 SUMMARY\n\nIn this chapter,\
    \ we discussed obtaining and manipulating a user's browser and screen information.\n\
    \nWe talked about the following navigator objects:\n\n| Property | Description\
    \ |\n| :--- | :--- |\n| appCodename | which is used to disclose the browser's\
    \ codename |\n| appName | which identifies the name of the browser used |\n| appVersion\
    \ | which reports the current version of the browser used |\n\nTABLE 9-1\n\nWe\
    \ discussed the window objects which are used to manipulate the browser's inner\
    \ width and inner height.\n\nAlso discussed was the window location object which\
    \ is used to obtain the current page address/URL or to redirect the browser to\
    \ a new page. Another window location property presented is protocol. This property\
    \ tells the protocol used—file, http or https.\n\nWe also covered the screen object,\
    \ which is used to obtain the screen height of the actual monitor in pixel units\
    \ and the color depth or resolution in bits.\n\nIn the next and final chapter\
    \ we will talk about the document object."
