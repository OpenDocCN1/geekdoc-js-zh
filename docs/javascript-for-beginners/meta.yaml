  md: "# CODE LISTING: WHILE-LOOP\n\n```\nvar x=1;\nwhile(x < 101)\n  {\n    document.write(x\
    \ + \"<br/>\");\n    x++;\n  }\n```\n\nThe value for x is being compared to 101\
    \ because if it is compared to 100, the loop will only iterate up to 99 and not\
    \ 100.\n\nThe complete code set to run the routine follows:\n\nCode Listing: Display\
    \ 1 to 100\n\n> In this example, the loop is going to count to 100, so we want\
    \ to make sure it only iterates through the loop 100 times.\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <title>While-Loop</title>\n</head>\n<body>\n  <script\
    \ language=\"Javascript\" type=\"text/javascript\">\n    var x = 1;\n    while(x\
    \ < 101)\n      {\n        document.write(x + \"<br/>\");\n        x++;\n    \
    \  }\n  </script>\n</body>\n</html>\n```"
