    - You will be able to use a function to trigger a function.\n\n# 6.1 Function\
    \ Introduction\n\nIn this chapter, we are going to discuss how to create and use\
    \ functions. Functions are small blocks of code that can be called and reused\
    \ within the program and by external routines as well.\n\nThere are two components\
    \ of a function. There is the **function declaration**, which defines the function\
    \ and its code. Then there is the **function call**. The function call is the\
    \ instance the function is directed to run or be executed.\n\nTo use a function,\
    \ first it must be defined and given a name. An example of a function name is\
    \ `displayName`.\n\nThe syntax for defining a function is:\n\n```\nfunction displayName()\n\
    ```\n\nThe actual code associated with the function is written in a code block\
    \ surrounded by curly brackets.\n\n```\n{\n  document.write(\"John Doe\");\n}\n\
    ```\n\nFunctions may be created within the same file in which they are called."
