    \ return 命令的值？\n  a. 一个新函数。\n  b. 一个循环。\n  c. 一个脚本。\n  d. 一个变量。\n\n# 6.3 从事件调用函数\n\
    \nJavascript 经常被称为事件驱动型语言。通过 Javascript，你可以响应用户在界面中触发的事件，或程序执行过程中自然发生的事件。\n\n\
    本节将涵盖四种事件：onclick、onload、onmouseover 和 onload，并对这些每种事件进行相应的讨论。\n\n让我们从 onclick\
    \ 开始。我们将在 HTML 中创建一个包含 `onclick` 事件的简单按钮。当按钮被点击时，`onclick` 事件将触发一个 Javascript\
    \ 函数的执行。\n\n```html\n<input type=\"button\" value=\"Press Me\" onclick=\"onButtonClick()\"\
    />\n```\n\n一旦点击此按钮，`onButtonClick()` 函数将执行执行。\n现在我们需要创建一个在按钮被点击时运行的实际函数。我们将在文档的\
    \ head 部分的 `<script>` 标签中编写该函数。\n\n> 在单个页面上编写 Javascript 函数时，将它们保留在文档的 head 部分中始终是一个好主意。\n\
    \n在这种情况下，我们只是要显示一个文本警框，提示按钮已被按下。该函数是：\n\n```javascript\nfunction onButtonClick()\
    \ {\n\talert(\"You have successfully pressed the button!\");\n}\n```\n\n当代码在浏览器中运行时，将显示以下输出：\n\
    \n![](img/c922782503c42c65b3a7c97e4fad8964_140_0.png)\n\n一旦点击“Press Me”按钮，该函数就会调用，导致网页上出现一个“警报框”。\n\
    \n![](img/c922782503c42c65b3a7c97e4fad8964_140_1.png)\n\n以下是 *onclick* 事件的完整代码列表：\n\
    \n# 代码列表：onclick 事件 – 带有警报框\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>onButtonClick</title>\n\
    <script language=\"javascript\" type=\"text/javascript\">\n function onButtonClick()\
    \ {\n    alert(\"You pressed the button!\");\n  }\n</script>\n</head>\n<body>\n\
    <input type=\"button\" value=\"Press Me!\" onclick=\"onButtonClick()\">\n</body>\n\
    </html>\n```\n\n我们将介绍的下一个事件是 **onload** 事件。该事件会在页面加载后触发一个函数的执行。\n\n实现 onload 有多种方法。一种常见的方法是将\
    \ *onload* 放在 `<body>` 标签内部。onload 事件的完整标签为：\n\n```html\n<body onload=\"whenPageLoads()\"\
    >\n```\n\n在所示的 `<body>` 标签中，页面正在完成加载，函数 *whenPageLoads()* 将被执行。此函数将发出 *alert*\
    \ 消息，欢迎用户访问页面。\n\n# 第 6 章：编写 Javascript 函数\n\n页面一加载，警报框立即显示。\n\n![](img/c922782503c42c65b3a7c97e4fad8964_142_0.png)\n\
    \n![](img/c922782503c42c65b3a7c97e4fad8964_142_1.png)\n\n以下是 *onclick* 事件的完整代码列表\n\
    \n"
