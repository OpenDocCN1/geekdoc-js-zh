    \n第 7 章 数组操作\n\n目标：\n- 能够创建数组。\n- 学习如何使用 `push`。\n- 能够排序数组。\n\n7.1 声明数组\n\n在第\
    \ 7 章中，我们将讨论数组。数组可以一次性包含多个值。使用标准方法创建数组的方式如下：\n\n```javascript\nvar firstNames\
    \ = Array();\n```\n\n通过索引赋值来填充数组是常见的做法，下文所示：\n\n```javascript\nfirstNames[0] =\
    \ \"John\";\nfirstNames[1] = \"Mary\";\nfirstNames[2] = \"Jane\";\nfirstNames[3]\
    \ = \"Sam\";\nfirstNames[4] = \"Johnny\";\n```\n\n另一种创建数组的方法是紧凑方法。这种方法不需要逐个赋值，如下所示：\n\
    \n```javascript\nvar animals = Array(\"dog\", \"cat\", \"mouse\", \"hamster\"\
    , \"toad\");\n```\n\n即使这种方法没有显式赋值索引，数组的索引也是从 0 开始的：\n\n```javascript\nvar animals\
    \ = [\"dog\", \"cat\", \"mouse\", \"hamster\", \"toad\"];\n```\n\n最后一种创建数组的方法是字面量方法。在这种方法中，不再需要\
    \ `new Array` 数据类型声明：\n\n```javascript\nvar companies = [\"Apple\", \"Google\"\
    , \"Cnet\", \"Udemy\", \"GE\"];\n```\n\n这种方法同样适用于索引编号方案。\n\n索引号：[0] [1] [2] [3]\
    \ [4]\n\n这三种方法在本质上是相同的，结果也是相同的。一旦数组创建，浏览器中的 JavaScript 解释器就不会区分它是如何创建的。在上述三个示例中，所有数组都可以通过其索引访问。可以使用对话框\
    \ `alert` 显示数组的任何成员。\n\n标准方法\n数组声明\n显示数组成员\n\n```html\n<!DOCTYPE html>\n<html>\n\
