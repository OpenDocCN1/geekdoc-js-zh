  md: '# Chapter 2.1 Learning to Use Variables


    1. In Javascript, what statement do you use to declare a variable??

    Answer: c. var


    2. What happens if you don''t put quotes around a variable''s text assigned vaue?

    Answer: c. The script does not output the value.


    3. What is known as the assignment operator in Javascript?

    Answer: b. The = sign


    4. Which one is a combined initialization/declaration?

    Answer: d. var Size = 0;


    5. Why is it important to use the var statement everytime?

    Answer: a. You will have trouble with variable scope if you don''t.


    # Chapter 2.2 Variable Operators


    1. What does the "+\ symbol mean when you place it next to a variable?

    Answer: a. Add the values together


    2. What does the "+" symbol mean when you place it between two strings values?

    Answer: c. Concatenate the values


    3. What does the % operator do?

    Answer: b. Gives you the remainder after division.


    4. Which is the increment operator?

    Answer: c. ++


    5. How does a prefix increment operator function?

    Answer: d. The increment takes place and then the rest of the expression is evaluated.


    # Chapter 3.1 Simple Conditionals


    1. What would be a good definition of a conditional statement?

    Answer: b. A statement that make sthe program branch based on a condition.'
