    \ // Outputs: There was an error.\n```\n\n### Bad Code\n```javascript\n// Chaining\
    \ multiple ternary operators\nfunction getStatusMessage(status) {\n    return\
    \ status === 'success' ? 'Operation was successful.' :\n           status ===\
    \ 'error' ? 'There was an error.' :\n           status === 'loading' ? 'Loading...'\
    \ :\n           'Unknown status.';\n}\n\nconst status = 'error';\nconsole.log(getStatusMessage(status));\
    \ // Outputs: There was an error.\n```\n\nIn the good example, the use of `if-else`\
    \ statements makes the logic clear and easy to follow. In the bad example, chaining\
    \ multiple ternary operators makes the code harder to read and understand, especially\
    \ for those unfamiliar with the syntax.\n\n**Memo:**\nTernary operators are useful\
    \ for simple conditional assignments, but for more complex logic, `if-else` statements\
    \ are generally preferred for better readability.\n\n---\n\n# Use parentheses\
    \ to make the order of operations explicit\n\nUsing parentheses in your code helps\
    \ clarify the order of operations, making it easier for others to understand and\
    \ maintain.\n\nWhen writing complex expressions, the order in which operations\
    \ are performed can sometimes be unclear. Using parentheses ensures that the intended\
    \ order is explicit, reducing the likelihood of errors and improving readability.\n\
    \n### Good Code\n```javascript\n// Good: The use of parentheses makes the order\
    \ of operations clear\nlet result = (a + b) * (c - d); // Addition and subtraction\
    \ are done first, then multiplication\n```\n\n### Bad Code\n```javascript\n//\
    \ Bad: The order of operations is not immediately clear\nlet result = a + b *\
    \ c - d; // Multiplication is done first, but it's not obvious at a glance\n```\n\
    \nIn the good example, parentheses are used to explicitly define the order in\
    \ which operations should be performed, making the code easier to read and understand.\
    \ In the bad example, the lack of parentheses makes it harder to determine the\
    \ order of operations, which can lead to misunderstandings and potential bugs.\n\
    \n**Memo:**\nIn JavaScript, the order of operations follows standard mathematical\
    \ rules: multiplication and division are performed before addition and subtraction.\
    \ However, using parentheses can override this order to ensure clarity.\n\n---\n\
    \n# Encapsulate unrelated functionality into separate functions\n\nEncapsulating\
    \ unrelated functionality into separate functions improves code modularity, readability,\
    \ and maintainability.\n\nWhen different parts of your code perform distinct tasks,\
    \ it's best to encapsulate these tasks into separate functions. This practice\
    \ makes your code more modular, easier to read, and simpler to maintain or debug.\n\
    \n### Good Code\n```javascript\n// Good: Separate functions for unrelated tasks\n\
    function calculateSum(a, b) {\n    return a + b;\n}\n\nfunction printMessage(message)\
    \ {\n    console.log(message);\n}\n\nlet sum = calculateSum(5, 10);\nprintMessage(`The\
    \ sum is ${sum}`);\n```\n\n### Bad Code\n```javascript\n// Bad: Unrelated tasks\
    \ are combined in a single function\nfunction calculateAndPrint(a, b) {\n    let\
    \ sum = a + b;\n    console.log(`The sum is ${sum}`);\n}\n\ncalculateAndPrint(5,\
    \ 10);\n```\n\nIn the good example, the `calculateSum` and `printMessage` functions\
    \ each perform a single, well-defined task. This separation makes the code easier\
    \ to understand and maintain. In the bad example, combining calculation and printing\
    \ in a single function makes the code less modular and harder to reuse or test.\n\
    \n**Memo:**\nModular code is a key principle in software engineering. It allows\
    \ developers to reuse functions across different parts of an application, reducing\
    \ redundancy and improving maintainability.\n\n---\n\n# Use utility libraries\
    \ for common tasks\n\nLeverage utility libraries like `Lodash` for common operations\
    \ on arrays, objects, strings, etc.\n\nInstead of writing custom functions for\
    \ common tasks, use utility libraries which provide optimized and well-tested\
    \ implementations.\n\n### Good Code\n```javascript\n// Using Lodash\nconst _ =\
    \ require('lodash');\nconst numbers = [1, 2, 3, 4, 5];\nconst doubledNumbers =\
    \ _.map(numbers, n => n * 2); // [2, 4, 6, 8, 10]\n\nconst users = [\n  { name:\
    \ 'Alice', age: 25 },\n  { name: 'Bob', age: 30 },\n  { name: 'Charlie', age:\
    \ 35 }\n];\nconst userNames = _.map(users, 'name'); // ['Alice', 'Bob', 'Charlie']\n\
    ```\n\n### Bad Code\n```javascript\n// Custom implementation\nconst numbers =\
    \ [1, 2, 3, 4, 5];\nconst doubledNumbers = [];\nfor (let i = 0; i < numbers.length;\
    \ i++) {\n  doubledNumbers.push(numbers[i] * 2);\n}\n\nconst users = [\n  { name:\
    \ 'Alice', age: 25 },\n  { name: 'Bob', age: 30 },\n  { name: 'Charlie', age:\
    \ 35 }\n];\nconst userNames = [];\nfor (let i = 0; i < users.length; i++) {\n\
    \  userNames.push(users[i].name);\n}\n```\n\nUtility libraries like `Lodash` provide\
    \ a wide range of functions for common operations, saving development time and\
    \ reducing code duplication. They are optimized for performance and thoroughly\
    \ tested, ensuring reliable behavior.\n\n**Memo:**\n`Lodash` is a popular utility\
    \ library for JavaScript, but there are alternatives like `Ramda` and `Underscore.js`.\n\
    \n---\n\n# Abstract repetitive code into reusable functions\n\nIdentify repetitive\
    \ code patterns and extract them into reusable functions for better code organization\
    \ and maintainability.\n\nRepetitive code can make the codebase harder to read\
    \ and maintain. By abstracting such code into reusable functions, you can improve\
    \ code clarity and reduce duplication.\n\n### Good Code\n```javascript\nfunction\
    \ calculateTotal(items, taxRate) {\n  let total = 0;\n  for (const item of items)\
    \ {\n    total += item.price;\n  }\n  return total * (1 + taxRate);\n}\n\nconst\
    \ cart1 = [\n  { name: 'Item 1', price: 10 },\n  { name: 'Item 2', price: 20 }\n\
    ];\nconst cart2 = [\n  { name: 'Item 3', price: 15 },\n  { name: 'Item 4', price:\
    \ 25 },\n  { name: 'Item 5', price: 5 }\n];\n\nconst total1 = calculateTotal(cart1,\
    \ 0.08); // 32.4\nconst total2 = calculateTotal(cart2, 0.1); // 49.5\n```\n\n\
    ### Bad Code\n```javascript\nconst cart1 = [\n  { name: 'Item 1', price: 10 },\n\
    \  { name: 'Item 2', price: 20 }\n];\nconst cart2 = [\n  { name: 'Item 3', price:\
    \ 15 },\n  { name: 'Item 4', price: 25 },\n  { name: 'Item 5', price: 5 }\n];\n\
    \nlet total1 = 0;\nfor (const item of cart1) {\n  total1 += item.price;\n}\ntotal1\
    \ *= 1.08; // 32.4\n\nlet total2 = 0;\nfor (const item of cart2) {\n  total2 +=\
    \ item.price;\n}\ntotal2 *= 1.1; // 49.5\n```\n\nBy extracting the repetitive\
    \ code into a function, you can reuse it across multiple places in your codebase.\
    \ This not only reduces duplication but also makes the code more readable and\
    \ easier to maintain. If the logic needs to be updated, you only need to change\
    \ it in one place.\n\n**Memo:**\nThe principle of \"Don't Repeat Yourself\" (DRY)\
    \ is a fundamental concept in software engineering that encourages code reuse\
    \ and abstraction to reduce redundancy.\n\n---\n\n# Separate data fetching logic\
    \ from UI rendering logic\n\nKeep data fetching and UI rendering in separate functions\
    \ or components.\n\nSeparating data fetching from UI rendering helps maintain\
    \ a clean and manageable codebase. It allows for easier testing, debugging, and\
    \ reusability of components.\n\n### Good Code\n```javascript\n// Data fetching\
    \ function\nasync function fetchData(url) {\n  const response = await fetch(url);\n\
    \  const data = await response.json();\n  return data;\n}\n\n// UI rendering function\n\
    function renderUI(data) {\n  const container = document.getElementById('container');\n\
    \  container.innerHTML = data.map(item => `<p>${item.name}</p>`).join('');\n}\n\
    \n// Main function\nasync function main() {\n  const data = await fetchData('https://api.example.com/data');\n\
    \  renderUI(data);\n}\n\nmain();\n```\n\n### Bad Code\n```javascript\nasync function\
    \ main() {\n  const response = await fetch('https://api.example.com/data');\n\
    \  const data = await response.json();\n  const container = document.getElementById('container');\n\
    \  container.innerHTML = data.map(item => `<p>${item.name}</p>`).join('');\n}\n\
    \nmain();\n```\n"
