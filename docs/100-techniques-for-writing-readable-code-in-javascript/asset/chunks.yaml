  trans: "\n好的示例使用了展开运算符，它更简洁且易于阅读。差的示例使用了较旧的方法，如数组的 `concat` 和对象的 `Object.assign`，这些方法更冗长且不够直观。\n\
    \n<Memo>\n\n展开运算符在 ES6（ECMAScript 2015）中引入，此后成为以更可读、更高效的方式处理数组和对象的流行特性。\n\n# 6.\
    \ 使用有意义的变量名来描述其用途。\n\n* * *\n\n选择能够清晰描述其用途和内容的变量名。\n\n* * *\n\n有意义的变量名使代码更易读、更易维护。它们能帮助其他开发者理解变量的用途，而无需额外的注释。\n\
    \n< Good Code >\n\n```javascript\n// 良好的变量名\nconst totalPrice = 100;\nconst userAge\
    \ = 25;\nconst isUserLoggedIn = true;\n```\n\n<Bad Code>\n\n```javascript\n//\
    \ 糟糕的变量名\nconst x = 100;\nconst y = 25;\nconst z = true;\n```\n\n好的示例使用了描述性名称，指明了变量所代表的内容，使代码不言自明。差的示例使用了像\
    \ `x`、`y` 和 `z` 这样的通用名称，没有传达任何关于变量用途的有意义信息。\n\n<Memo>\n\n使用有意义的变量名是整洁代码原则中的基本实践，正如软件工程专家\
    \ Robert C. Martin 在其著作《代码整洁之道》中所倡导的那样。\n\n# 7. 布尔变量以 is、has 或 can 作为前缀。\n\n*\
    \ * *\n\n对布尔变量使用 \"is\"、\"has\" 或 \"can\" 等前缀，以明确其用途。\n\n* * *\n\n布尔变量表示真/假值。使用\
    \ \"is\"、\"has\" 或 \"can\" 等前缀有助于表明布尔值的性质，使代码更易读、更易理解。\n\n< Good Code >\n\n```javascript\n\
    // 良好的布尔变量名示例\nlet isUserLoggedIn = true;\nlet hasAdminPrivileges = false;\nlet\
    \ canEditProfile = true;\n```\n\n<Bad Code>\n\n```javascript\n// 糟糕的布尔变量名示例\n\
    let loggedIn = true;\nlet admin = false;\nlet edit = true;\n```\n\n在好的示例中，前缀 \"\
    is\"、\"has\" 和 \"can\" 清楚地表明这些变量是布尔类型。这使得其他开发者一眼就能理解这些变量的用途。在差的示例中，变量名含义模糊，没有明确传达它们是布尔类型，这可能导致混淆。\n\
    \n<Memo>\n\n为布尔变量使用描述性前缀是许多编程语言中的常见做法，而不仅仅是 JavaScript。它提高了不同代码库中代码的可读性和可维护性。\n\
    \n# 8. 在表示测量值的变量名中包含单位。\n\n* * *\n\n始终在变量名中包含测量单位，以避免混淆。\n\n* * *\n\n当处理存储测量值的变量时，在变量名中包含单位有助于明确该值代表什么，从而降低出错和误解的风险。\n\
    \n< Good Code >\n\n```javascript\n// 变量名中包含单位的良好示例\nlet distanceInMeters = 500;\n\
    let weightInKilograms = 70;\nlet timeInSeconds = 120;\n```\n\n<Bad Code>\n\n```javascript\n\
    // 变量名中不含单位的糟糕示例\nlet distance = 500;\nlet weight = 70;\nlet time = 120;\n```\n\
    \n在好的示例中，变量名包含了单位（米、千克、秒），清楚地表明了每个值代表什么。这种做法有助于防止错误，例如混淆不同的测量单位。在差的示例中，变量名中缺少单位可能导致混淆和潜在错误，因为无法立即清楚这些值代表什么。\n\
    \n<Memo>\n\n在科学和工程应用中，精确测量至关重要，因此在变量名中包含单位尤为重要。这种做法有助于确保计算和数据表示的准确性和清晰度。\n\n#\
    \ 9. 变量使用名词，函数使用动词。\n\n* * *\n\n变量使用名词，函数使用动词，使代码更易读、更直观。\n\n* * *\n\n这种技巧确保变量清晰地表示实体或对象，而函数表示动作或过程。这种命名约定有助于其他人快速理解代码中每个元素的用途和用法。\n\
    \n< Good Code >\n\n```javascript\n// 良好示例\nlet userName = \"John\"; // 变量使用名词\n\
    let age = 30; // 变量使用名词\nfunction calculateAge(birthYear) { // 函数使用动词\n  return\
    \ new Date().getFullYear() - birthYear;\n}\nfunction printGreeting(name) { //\
    \ 函数使用动词\n  console.log(`Hello, ${name}!`);\n}\n```\n\n<Bad Code>\n\n```javascript\n\
    // 糟糕示例\nlet calc = \"John\"; // 令人困惑的变量名\nlet calcAge = 30; // 令人困惑的变量名\nfunction\
    \ user(name) { // 令人困惑的函数名\n  console.log(`Hello, ${name}!`);\n}\nfunction age(birthYear)\
    \ { // 令人困惑的函数名\n  return new Date().getFullYear() - birthYear;\n}\n```\n\n在好的示例中，`userName`\
    \ 和 `age` 是清晰的名词，明显表示数据。函数 `calculateAge` 和 `printGreeting` 以动词命名，表示动作。在差的示例中，像\
    \ `calc` 和 `user` 这样的名称含义模糊，难以理解它们代表什么或做什么。\n\n<Memo>\n\n你知道吗？遵循一致的命名约定不仅能提高可读性，还能帮助高效地维护和调试代码，尤其是在大型项目中。\n\
    \n# 10. 避免使用非通用理解的缩写。\n\n* * *\n\n使用清晰的全名而非缩写，可以提高代码的可读性并减少混淆。\n\n* * *\n\n在代码中避免使用非通用缩写，确保任何阅读代码的人都能轻松理解每个变量或函数的作用，而无需猜测或查找其含义。\n\
    \n< Good Code >\n\n```javascript\n// 良好示例\nlet totalPrice = 150.00; // 清晰且具有描述性\n\
    function calculateTotalPrice(price, tax) { // 清晰且具有描述性\n  return price + (price\
    \ * tax);\n}\nfunction displayProductDetails(product) { // 清晰且具有描述性\n  console.log(`Product:\
    \ ${product.name}, Price: ${product.price}`);\n}\n```\n\n<Bad Code>\n\n```javascript\n\
    // 糟糕示例\nlet tp = 150.00; // 含义不明的缩写\nfunction calcTP(p, t) { // 含义不明的缩写\n  return\
    \ p + (p * t);\n}\nfunction dspPD(p) { // 含义不明的缩写\n  console.log(`Product: ${p.n},\
    \ Price: ${p.p}`);\n}\n```\n\n在好的示例中，像 `totalPrice`、`calculateTotalPrice` 和 `displayProductDetails`\
    \ 这样的名称不言自明。在差的示例中，像 `tp`、`calcTP` 和 `dspPD` 这样的缩写含义不清，使代码更难理解和维护。\n\n<Memo>\n\
    \n你知道吗？在代码中始终使用清晰且描述性的名称，可以显著缩短新团队成员的入职时间，因为他们无需解读晦涩的缩写。\n\n# 11. 避免使用像 data、item\
    \ 或 thing 这样的通用名称。\n\n* * *\n\n使用具体名称使代码更易读、更易维护。\n\n* * *\n\n在本节中，我们将说明为什么使用具体的变量名对于代码清晰度至关重要。\n\
    \n< Good Code >\n\n```javascript\n// 根据用户 ID 获取用户资料\nfunction getUserProfile(userId)\
    \ {\n    // 从数据库获取用户资料\n    let userProfile = database.fetchProfileById(userId);\n\
    \    return userProfile;\n}\n```\n\n<Bad Code>\n\n```javascript\n// 根据 ID 获取某些内容\n\
    function getData(id) {\n    // 从数据库获取数据\n    let data = database.fetch(id);\n\
    \    return data;\n}\n```\n\n在好的代码示例中，`userProfile` 和 `userId` 清楚地表明了函数处理的内容，使代码更易于理解和维护。在差的代码示例中，`data`\
    \ 和 `id` 过于通用，可能导致对正在处理的数据类型产生混淆。\n\n<Memo>\n\n良好的命名约定可以显著降低开发者的认知负荷，帮助他们快速掌握代码的功能。\n\
    \n# 12. 命名要具体，避免歧义。\n\n* * *\n\n"
- fmt: "\n# Naming and Code Quality Best Practices\n\nSpecific names help in understanding\
    \ the exact purpose and usage of variables and functions. This section demonstrates\
    \ how specificity in naming can prevent misunderstandings and improve code clarity.\n\
    \n### Good Code\n```javascript\n// Adds a product to the shopping cart\nfunction\
    \ addProductToCart(productId, quantity) {\n    // Ensure the product exists\n\
    \    let product = productCatalog.getProductById(productId);\n    if (product)\
    \ {\n        cart.addItem(product, quantity);\n    }\n}\n```\n\n### Bad Code\n\
    ```javascript\n// Adds an item\nfunction addItem(id, num) {\n    // Ensure the\
    \ item exists\n    let item = catalog.get(id);\n    if (item) {\n        cart.add(item,\
    \ num);\n    }\n}\n```\n\nIn the good code example, `addProductToCart`, `productId`,\
    \ and `quantity` clearly define the function's purpose and its parameters, making\
    \ it easy to understand and maintain. In the bad code example, `addItem`, `id`,\
    \ and `num` are ambiguous, making it unclear what is being added and in what context.\n\
    \n**Memo:** Specific names not only help in understanding the code but also aid\
    \ in debugging, as it's easier to trace the flow of specific entities through\
    \ the application.\n\n## Use consistent naming conventions throughout the codebase\n\
    \nAdopt a uniform naming convention for variables, functions, and classes to enhance\
    \ code readability and maintainability. Consistent naming conventions help developers\
    \ understand the purpose of variables and functions quickly, reducing the cognitive\
    \ load when reading and maintaining the code.\n\n### Good Code\n```javascript\n\
    // Using camelCase for variables and functions, PascalCase for classes\nlet userName\
    \ = 'JohnDoe';\n\nfunction getUserName() {\n    return userName;\n}\n\nclass UserProfile\
    \ {\n    constructor(name) {\n        this.name = name;\n    }\n}\n```\n\n###\
    \ Bad Code\n```javascript\n// Inconsistent naming conventions\nlet User_name =\
    \ 'JohnDoe';\n\nfunction GetuserName() {\n    return User_name;\n}\n\nclass userprofile\
    \ {\n    constructor(Name) {\n        this.Name = Name;\n    }\n}\n```\n\nIn the\
    \ good example, `camelCase` is used for variables and functions, and `PascalCase`\
    \ is used for classes, making the code more predictable and easier to read. In\
    \ the bad example, inconsistent naming conventions make the code harder to follow\
    \ and maintain.\n\n**Memo:** JavaScript does not enforce any specific naming conventions,\
    \ but following a consistent style, such as `camelCase` for variables and functions\
    \ and `PascalCase` for classes, is a widely accepted best practice.\n\n## Avoid\
    \ using magic numbers; use named constants instead\n\nReplace magic numbers with\
    \ named constants to make the code more understandable and easier to maintain.\
    \ Magic numbers are hard-coded values that lack context. Using named constants\
    \ provides meaningful names that explain the purpose of these values.\n\n### Good\
    \ Code\n```javascript\n// Using named constants\nconst MAX_USERS = 100;\nconst\
    \ TIMEOUT_DURATION = 5000;\n\nfunction canAddUser(currentUserCount) {\n    return\
    \ currentUserCount < MAX_USERS;\n}\n\nsetTimeout(() => {\n    console.log('Timeout\
    \ reached');\n}, TIMEOUT_DURATION);\n```\n\n### Bad Code\n```javascript\n// Using\
    \ magic numbers\nfunction canAddUser(currentUserCount) {\n    return currentUserCount\
    \ < 100;\n}\n\nsetTimeout(() => {\n    console.log('Timeout reached');\n}, 5000);\n\
    ```\n\nIn the good example, named constants like `MAX_USERS` and `TIMEOUT_DURATION`\
    \ provide context and make the code self-explanatory. In the bad example, the\
    \ magic numbers `100` and `5000` do not convey any meaning, making the code harder\
    \ to understand and maintain.\n\n**Memo:** The term \"magic number\" refers to\
    \ the use of numeric literals directly in the code. This practice is discouraged\
    \ because it can lead to errors and make the code less readable. Using named constants\
    \ is a simple yet effective way to improve code quality.\n\n## Ensure function\
    \ names clearly describe their action\n\nUse descriptive function names that clearly\
    \ convey the purpose and action of the function. Functions should have names that\
    \ make their purpose and behavior immediately clear to other developers reading\
    \ the code.\n\n### Good Code\n```javascript\n// Good example\nfunction calculateCircleArea(radius)\
    \ {\n  return Math.PI * radius * radius;\n}\n```\n\n### Bad Code\n```javascript\n\
    // Bad example\nfunction doSomething(x) {\n  return Math.PI * x * x;\n}\n```\n\
    \nThe good example uses a descriptive name `calculateCircleArea` that clearly\
    \ explains what the function does. The bad example uses a vague name `doSomething`\
    \ that provides no information about the function's purpose or behavior.\n\n**Memo:**\
    \ Descriptive function names improve code readability and maintainability.\n\n\
    ## Utilize default function parameters for cleaner code\n\nUse default parameter\
    \ values in function definitions to handle undefined or missing arguments. Default\
    \ function parameters allow you to provide default values for arguments, making\
    \ the code more robust and easier to read.\n\n### Good Code\n```javascript\n//\
    \ Good example\nfunction greetUser(name = 'User') {\n  console.log(`Hello, ${name}!`);\n\
    }\n\ngreetUser('Alice'); // Output: Hello, Alice!\ngreetUser(); // Output: Hello,\
    \ User!\n```\n\n### Bad Code\n```javascript\n// Bad example\nfunction greetUser(name)\
    \ {\n  const userName = name || 'User';\n  console.log(`Hello, ${userName}!`);\n\
    }\n\ngreetUser('Alice'); // Output: Hello, Alice!\ngreetUser(); // Output: Hello,\
    \ undefined!\n```\n\nIn the good example, the `greetUser` function uses a default\
    \ parameter value of `'User'` for the `name` argument. This ensures that the function\
    \ behaves correctly even when called without an argument. The bad example uses\
    \ a logical OR operator to handle the missing argument, but it can lead to unexpected\
    \ behavior (e.g., Hello, undefined!) and is less readable.\n\n**Memo:** Default\
    \ function parameters were introduced in ECMAScript 2015 (ES6) and provide a more\
    \ concise and readable way to handle optional arguments.\n\n## Use async/await\
    \ for asynchronous code for better readability\n\n`async/await` simplifies the\
    \ syntax of asynchronous code, making it easier to read and maintain. Using `async/await`\
    \ in JavaScript can improve code readability and structure, making it more understandable\
    \ than traditional promise chaining.\n\n### Good Code\n```javascript\n// Fetching\
    \ data with async/await\nasync function fetchData() {\n  try {\n    const response\
    \ = await fetch('https://api.example.com/data');\n    const data = await response.json();\n\
    \    console.log(data); // Output the fetched data\n  } catch (error) {\n    console.error('Error\
    \ fetching data:', error);\n  }\n}\n\nfetchData();\n```\n\n### Bad Code\n```javascript\n\
    // Fetching data with promises\nfunction fetchData() {\n  fetch('https://api.example.com/data')\n\
    \    .then(response => response.json())\n    .then(data => {\n      console.log(data);\
    \ // Output the fetched data\n    })\n    .catch(error => {\n      console.error('Error\
    \ fetching data:', error);\n    });\n}\n\nfetchData();\n```\n\nThe good example\
    \ uses `async/await`, making the asynchronous flow linear and easy to follow.\
    \ The bad example uses promise chaining, which can become difficult to read and\
    \ manage as the complexity increases. `async/await` syntax makes error handling\
    \ more straightforward and the code cleaner.\n\n**Memo:** `async/await` is syntactic\
    \ sugar built on top of promises. It was introduced in ES2017 (ES8) and has since\
    \ become the standard for writing asynchronous code in JavaScript.\n\n## Employ\
    \ Map and Set for collections instead of plain objects and arrays\n\n`Map` and\
    \ `Set` offer more efficient and clearer ways to handle collections of data compared\
    \ to plain objects and arrays. Using `Map` and `Set` in JavaScript can provide\
    \ better performance and functionality for collections, such as ensuring unique\
    \ elements in `Set` or maintaining key-value pairs in `Map`.\n\n### Good Code\n\
    ```javascript\n// Using Map for key-value pairs\nconst userRoles = new Map();\n\
    userRoles.set('Alice', 'Admin');\nuserRoles.set('Bob', 'User');\nconsole.log(userRoles.get('Alice'));\
    \ // Output: Admin\n\n// Using Set for unique values\nconst uniqueNumbers = new\
    \ Set([1, 2, 3, 3, 4]);\nuniqueNumbers.add(5);\nuniqueNumbers.add(1); // Duplicate,\
    \ won't be added\n```\n"
