    ![](img/cover.jpeg)


    # 索引


    ## 现代 JavaScript 语法

    -   使用 `const` 和 `let` 代替 `var` 来声明块级作用域变量。

    -   利用箭头函数获得更简洁的语法和词法 `this`。

    -   利用模板字面量简化字符串拼接。

    -   使用解构赋值处理对象和数组，编写更清晰的代码。

    -   应用展开运算符合并数组和对象。


    ## 命名规范

    -   使用有意义的变量名来描述其用途。

    -   布尔变量以 `is`、`has` 或 `can` 开头。

    -   在表示测量值的变量名中包含单位。

    -   变量使用名词，函数使用动词。

    -   避免使用不被普遍理解的缩写。

    -   避免使用像 `data`、`item` 或 `thing` 这样的通用名称。

    -   命名要具体，避免歧义。

    -   在整个代码库中使用一致的命名规范。


    ## 函数最佳实践

    -   确保函数名清晰描述其行为。

    -   利用默认函数参数编写更简洁的代码。

    -   使用 `async`/`await` 处理异步代码，提高可读性。

    -   保持函数简短，专注于单一任务。

    -   使用描述性的函数名来传达其用途。

    -   编写没有副作用的纯函数。

    -   将执行多项任务的函数拆分为更小的函数。

    -   限制函数参数的数量。

    -   使用辅助函数封装复杂逻辑。

    -   编写单元测试以确保函数正确完成单一任务。

    -   使用 `async` 函数编写更清晰的异步代码。


    ## 数据结构与集合

    -   使用 `Map` 和 `Set` 作为集合，而不是普通对象和数组。

    -   利用可选链处理嵌套对象属性。

    -   使用 `Array.prototype.map` 和 `Array.prototype.filter` 进行数组转换。

    -   利用 `Object.keys` 和 `Object.values` 遍历对象。

    -   使用 `fetch` 发起网络请求，而不是像 `XMLHttpRequest` 这样的旧方法。

    -   利用 `WeakMap` 和 `WeakSet` 管理对象键，同时不阻止垃圾回收。

    -   使用 `Proxy` 对象为基本操作定义自定义行为。

    -   利用 `Symbol` 创建唯一的属性键以避免冲突。

    -   使用带标签的模板字面量实现安全的 HTML 或 SQL 模板。

    -   使用 `Reflect` API 执行对象操作。

    -   使用 `Array.prototype.reduce` 累加数组值。

    -   使用 `Object.assign` 合并对象。

    -   使用 `JSON.stringify` 和 `JSON.parse` 进行深拷贝。

    -   利用 `Array.prototype.some` 和 `Array.prototype.every` 进行条件检查。

    -   利用 `Array.prototype.find` 在数组中查找元素。

    -   对于有序数据集合，选择数组。

    -   对于键值对，使用对象。

    -   当需要有序键值对时，选择 `Map`。

    -   利用 `Set` 存储唯一值，避免重复。

    -   优先使用 `WeakMap` 和 `WeakSet` 以高效管理内存。


    ## 文档与注释

    -   对复杂函数或代码块的用途进行注释。

    -   在注释中解释不明显的代码逻辑。

    -   记录函数的预期输入和输出。

    -   用注释标记临时性解决方案。

    -   使用注释指示代码的重要部分。

    -   保持注释简洁明了。

    -   代码变更时更新注释以保持准确性。

    -   避免冗余的注释，不要说明显而易见的内容。

    -   用注释解释“为什么”，而不是“是什么”。

    -   使用语法正确的规范英语编写注释。


    ## 代码组织与格式化

    -   避免使用魔法数字；改用命名常量。

    -   使用像 `ESLint` 这样的 linter 统一格式化代码。

    -   使用 `Prettier` 自动格式化代码。

    -   使用一致的缩进组织代码。

    -   将相关代码逻辑分组在一起。

    -   限制行长度以提高可读性。

    -   在尽可能靠近使用位置的地方声明变量。

    -   为循环计数器使用有意义的名称。

    -   避免为不同目的重复使用变量。

    -   在声明变量时进行初始化。

    -   对配置值使用常量。

    -   通过将代码划分为模块来分离关注点。

    -   利用 JavaScript 模块（`ES6 import/export`）更好地组织代码。

    -   对可迭代对象使用 `for...of`。


    ## 逻辑与控制流

    -   使用提前返回来避免嵌套的 `if` 语句。

    -   在多个条件判断时优先使用 `switch` 语句。

    -   避免深层嵌套的循环，将其拆分为函数。

    -   使用 `try`/`catch` 块进行错误处理。

    -   避免使用全局变量。

    -   对不会变化的值使用常量。

    -   将长的条件表达式拆分为多行。

    -   使用临时变量保存表达式中的中间结果。

    -   将复杂表达式重构为辅助函数。

    -   避免链式使用多个三元运算符。

    -   使用括号明确运算顺序。

    -   使用 `??`（空值合并运算符）设置默认值。


    ## 高级模式与面向对象编程

    -   利用 ES6 类进行面向对象编程。

    -   使用 `Promise.all` 并发运行多个 Promise。

    -   利用异步生成器处理异步迭代。

    -   将不相关的功能封装到独立的函数中。

    -   对常见任务使用工具库。

    -   将重复代码抽象为可复用的函数。

    -   将数据获取逻辑与 UI 渲染逻辑分离。

    -   使用设计模式解决常见问题。

    -   对异步函数使用 `async` 关键字。

    -   利用 `await` 关键字处理 Promise。

    -   编写可在不同项目中复用的模块化代码。

    -   使用高阶函数创建可复用的函数模式。

    -   使用混入（mixin）在多个类中复用代码。

    -   使用继承扩展现有类。

    -   利用函数组合从简单函数构建复杂功能。


    ## 错误处理

    -   使用 `try`/`catch` 块处理异常。

    -   提供有意义的错误消息。

    -   将错误记录到控制台或日志服务。

    -   使用 `.catch` 优雅地处理被拒绝的 Promise。

    -   验证函数输入以防止错误。


