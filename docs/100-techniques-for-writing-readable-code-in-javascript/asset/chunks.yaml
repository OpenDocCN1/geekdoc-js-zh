  trans: "\n\n当你实现临时解决方案或权宜之计（hack）时，务必添加注释说明其存在的原因以及未来需要如何替换它。\n\n### 良好代码示例\n```javascript\n\
    // 针对问题 #123 的临时解决方案\n// 这是绕过第三方库中 Bug 的权宜之计\n// TODO: 待库更新后移除该代码\nfunction fetchData()\
    \ {\n    // Hack: 手动设置超时以避免 Bug\n    setTimeout(() => {\n        // 原始代码\n   \
    \     console.log('Fetching data...');\n    }, 1000);\n}\n```\n\n### 不良代码示例\n\
    ```javascript\nfunction fetchData() {\n    setTimeout(() => {\n        console.log('Fetching\
    \ data...');\n    }, 1000);\n}\n```\n\n在良好示例中，注释明确指出了 `setTimeout` 是针对已知问题（#123）的临时解决方案，并包含\
    \ `TODO` 注释，提示问题解决后移除该代码。这有助于其他开发者理解代码的上下文和临时性。而在不良示例中，没有任何注释，导致其他开发者不清楚 `setTimeout`\
    \ 背后的原因以及未来可能需要重新审视这段代码。\n\n**备忘录：** 使用 `TODO` 注释是跟踪临时解决方案并确保其在未来更新中得到处理的好习惯。许多代码编辑器和\
    \ IDE 可以高亮显示 `TODO` 注释，使其更易于查找。\n\n# 使用注释标记代码的重要部分\n\n注释有助于突出和解释代码中的重要部分。使用注释标记重要部分可以使代码更易于导航和理解。\n\
    \n### 良好代码示例\n```javascript\n// 初始化变量\nlet total = 0;\nlet count = 0;\n\n// 遍历数组\n\
    for (let i = 0; i < numbers.length; i++) {\n  total += numbers[i];\n  count++;\n\
    }\n\n// 计算平均值\nlet average = total / count;\nconsole.log(average);\n```\n\n###\
    \ 不良代码示例\n```javascript\nlet total = 0;\nlet count = 0;\nfor (let i = 0; i < numbers.length;\
    \ i++) {\n  total += numbers[i];\n  count++;\n}\nlet average = total / count;\n\
    console.log(average);\n```\n\n在良好示例中，注释清晰地说明了每个部分的目的，使他人更容易理解逻辑。不良示例缺少注释，导致代码结构和目的难以理解。\n\
    \n**备忘录：** 注释不会影响代码的执行，但对于维护和理解代码库至关重要，尤其是在协作环境中。\n\n# 保持注释简洁明了\n\n注释应简短且直接与所描述的代码相关。简洁的注释可以避免混乱，确保代码保持可读性和可维护性。\n\
    \n### 良好代码示例\n```javascript\n// 对数组中的值求和\nlet sum = numbers.reduce((acc, num)\
    \ => acc + num, 0);\n// 输出结果\nconsole.log(sum);\n```\n\n### 不良代码示例\n```javascript\n\
    // 这是一个循环，遍历名为 numbers 的数组中的每个元素，并将每个元素加到累加器上，累加器初始值为 0，然后返回数组中所有元素的总和\nlet sum\
    \ = numbers.reduce((acc, num) => acc + num, 0);\n// 这行代码将总和打印到控制台\nconsole.log(sum);\n\
    ```\n\n良好示例使用了简短清晰的注释，直接解释了代码的用途。不良示例的注释过于冗长，添加了不必要的细节，使代码更难阅读。\n\n**备忘录：** 过度注释与没有注释同样有害。力求在注释增加价值的同时不使读者感到负担。\n\
    \n# 代码变更时更新注释以保持准确性\n\n始终更新注释以反映代码的变更，确保其准确且有用。修改代码时，务必更新相关注释，防止给未来的读者带来错误信息和困惑。\n\
    \n### 良好代码示例\n```javascript\n// 计算矩形的面积\nfunction calculateArea(width, height)\
    \ {\n    return width * height; // 面积 = 宽 × 高\n}\n\n// 更新为包含验证\n// 计算矩形的面积（带验证）\n\
    function calculateArea(width, height) {\n    if (width <= 0 || height <= 0) {\n\
    \        throw new Error('宽度和高度必须为正数');\n    }\n    return width * height; //\
    \ 面积 = 宽 × 高\n}\n```\n\n### 不良代码示例\n```javascript\n// 计算矩形的面积\nfunction calculateArea(width,\
    \ height) {\n    return width * height; // 面积 = 宽 × 高\n}\n\n// 更新为包含验证，但注释未更新\n\
    function calculateArea(width, height) {\n    if (width <= 0 || height <= 0) {\n\
    \        throw new Error('宽度和高度必须为正数');\n    }\n    return width * height; //\
    \ 面积 = 宽 × 高\n}\n```\n\n在良好示例中，注释已更新以反映新的验证逻辑，确保任何阅读代码的人都能理解当前功能。在不良示例中，注释仍然过时，可能会误导读者对代码行为的理解。\n\
    \n**备忘录：** 持续更新注释有助于维护代码质量，并减少因误解代码目的和功能而导致的 Bug 风险。\n\n# 避免冗余注释，不要陈述显而易见的内容\n\
    \n避免编写仅仅复述代码功能的注释，因为它们没有增加价值，反而使代码变得杂乱。注释应提供代码本身无法立即明确的额外上下文或解释，而不是陈述显而易见的内容。\n\
    \n### 良好代码示例\n```javascript\n// 计算矩形的面积\nfunction calculateArea(width, height)\
    \ {\n    return width * height; // 面积 = 宽 × 高\n}\n\n// 检查用户是否为成年人\nfunction isAdult(age)\
    \ {\n    return age >= 18; // 如果年龄为 18 岁或以上，返回 true\n}\n```\n\n### 不良代码示例\n```javascript\n\
    // 此函数计算矩形的面积\nfunction calculateArea(width, height) {\n    return width * height;\
    \ // 此函数返回面积\n}\n\n// 此函数检查用户是否为成年人\nfunction isAdult(age) {\n    return age >=\
    \ 18; // 如果年龄为 18 岁或以上，返回 true\n}\n```\n\n在良好示例中，注释提供了有意义的上下文，补充了代码。在不良示例中，注释是冗余的，仅仅复述了代码已经清晰表达的内容，增加了不必要的杂乱。\n\
    \n**备忘录：** 有效的注释应通过提供代码中不明显的见解来增强代码的可读性，而不是重复代码已经传达的信息。\n\n# 使用注释解释“为什么”，而不是“是什么”\n\
    \n注释应提供代码背后的上下文和理由，而不仅仅是描述代码的功能。\n\n### 良好代码示例\n```javascript\n// 计算折扣后的总价\n//\
    \ 这是为了给忠实客户提供更好的优惠\nfunction calculateTotalPrice(price, discount) {\n    return\
    \ price - (price * discount);\n}\n```\n\n### 不良代码示例\n```javascript\n// 从价格中减去折扣\n\
    function calculateTotalPrice(price, discount) {\n    return price - (price * discount);\n\
    }\n```\n\n在良好示例中，注释解释了计算折扣后总价的原因，为未来的读者提供了上下文。在不良示例中，注释仅仅描述了代码的功能，而代码本身已经足够清晰。\n\
    \n**备忘录：** 有效的注释可以显著提高代码的可维护性，并帮助新开发者更快地理解代码库。\n\n# 使用语法正确的规范英语编写注释\n\n注释应使用清晰、语法正确的规范英语编写，以确保所有读者都能轻松理解。\n\
    \n### 良好代码示例\n```javascript\n// 应用折扣后计算总价。\n// 这确保忠实客户获得最佳优惠。\nfunction calculateTotalPrice(price,\
    \ discount) {\n    return price - (price * discount);\n}\n```\n\n### 不良代码示例\n\
    ```javascript\n// 计算折扣后总价\n```\n\n"
