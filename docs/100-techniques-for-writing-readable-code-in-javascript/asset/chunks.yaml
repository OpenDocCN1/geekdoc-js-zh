    In the good example, `userName` and `age` are clear nouns, making it obvious that
    they represent data. The functions `calculateAge` and `printGreeting` are named
    with verbs, indicating actions. In the bad example, names like `calc` and `user`
    are ambiguous, making it hard to understand what they represent or do.


    <Memo>


    Did you know? Following a consistent naming convention not only improves readability
    but also helps in maintaining and debugging code efficiently, especially in larger
    projects.


