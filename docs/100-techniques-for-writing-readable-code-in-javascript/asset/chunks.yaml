    function calcTP(p, t) { // Unclear abbreviation


      return p + (p * t);


    }


    function dspPD(p) { // Unclear abbreviation


      console.log(`Product: ${p.n}, Price: ${p.p}`);


    }


    ```


    In the good example, names like `totalPrice`, `calculateTotalPrice`, and `displayProductDetails`
    are self-explanatory. In the bad example, abbreviations like `tp`, `calcTP`, and
    `dspPD` are unclear, making the code harder to understand and maintain.


