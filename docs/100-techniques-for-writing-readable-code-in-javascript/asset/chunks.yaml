    arrays or creating lookup tables from arrays.


    70


    # Use Object.assign for merging objects.


    * * *


    Use Object.assign to merge multiple objects into one for better code clarity and
    efficiency.


    * * *


    Object.assign is a method that copies all enumerable own properties from one or
    more source objects to a target object. It is useful for merging objects and creating
    a new object with combined properties.


    < Good Code >


    // Good example: Using Object.assign to merge objects


    const obj1 = { a: 1, b: 2 };


    const obj2 = { b: 3, c: 4 };


    const mergedObj = Object.assign({}, obj1, obj2);


    console.log(mergedObj); // Output: { a: 1, b: 3, c: 4 }


    <Bad Code>


    // Bad example: Manually merging objects


    const obj1 = { a: 1, b: 2 };


    const obj2 = { b: 3, c: 4 };


    const mergedObj = {};


    for (let key in obj1) {


      mergedObj[key] = obj1[key];


    }


    for (let key in obj2) {


      mergedObj[key] = obj2[key];


    }


    console.log(mergedObj); // Output: { a: 1, b: 3, c: 4 }


    The good example uses Object.assign, which is more concise and avoids potential
    errors in manual merging. The bad example uses for loops, which are more verbose
    and error-prone.


    <Memo>


    Object.assign performs a shallow copy, meaning it only copies properties at the
    first level. For deep cloning, other methods or libraries like lodash are needed.


    71


    # Break down long conditional expressions into multiple lines.


    * * *


    Simplify complex conditional expressions by breaking them into multiple lines
    for better readability.


    * * *


    Long conditional expressions can be difficult to read and understand. Breaking
    them into multiple lines makes the code more readable and maintainable.


    < Good Code >


    // Good example: breaking down a long conditional expression


    if (


        user.isActive &&


        user.isVerified &&


        user.hasSubscription &&


        user.subscription.isValid


    ) {


        // Perform some action


        console.log("User is active, verified, and has a valid subscription.");


    }


    <Bad Code>


    // Bad example: long conditional expression in a single line


    if (user.isActive && user.isVerified && user.hasSubscription && user.subscription.isValid)
    {


        // Perform some action


        console.log("User is active, verified, and has a valid subscription.");


    }


    In the good example, the conditional expression is broken down into multiple lines,
    making it easier to read and understand each condition. In the bad example, the
    entire expression is on a single line, which can be hard to read and debug.


    <Memo>


    Breaking down long conditional expressions is not only a good practice in JavaScript
    but also in other programming languages. It helps in maintaining the code and
    makes it easier for others to understand the logic.


    72


    # Use temporary variables to hold intermediate results in expressions.


    * * *


    Store intermediate results in temporary variables to simplify complex expressions
    and improve readability.


    * * *


    Complex expressions can be simplified by storing intermediate results in temporary
    variables. This makes the code easier to read and debug.


    < Good Code >


    // Good example: using temporary variables for intermediate results


    const isUserActive = user.isActive;


    const isUserVerified = user.isVerified;


    const hasValidSubscription = user.hasSubscription && user.subscription.isValid;


    if (isUserActive && isUserVerified && hasValidSubscription) {


        // Perform some action


        console.log("User is active, verified, and has a valid subscription.");


    }


    <Bad Code>


    // Bad example: complex expression without temporary variables


    if (user.isActive && user.isVerified && user.hasSubscription && user.subscription.isValid)
    {


        // Perform some action


        console.log("User is active, verified, and has a valid subscription.");


    }


    In the good example, intermediate results are stored in temporary variables, making
    the final conditional expression simpler and more readable. In the bad example,
    the complex expression is written directly in the conditional statement, which
    can be harder to read and maintain.


    <Memo>


    Using temporary variables not only improves readability but also can help in debugging
    by allowing you to log intermediate results and understand where the logic might
    be failing.


    73


    # Refactor complex expressions into helper functions.


    * * *


    Simplify complex expressions by breaking them into smaller, reusable helper functions.


    * * *


    Complex expressions can be difficult to read and maintain. Refactoring them into
    helper functions improves readability and reusability.


    < Good Code >


    // Helper function to calculate discount


    function calculateDiscount(price, discountRate) {


        return price * (discountRate / 100);


    }


    // Main function using the helper function


    function getTotalPrice(price, discountRate) {


        const discount = calculateDiscount(price, discountRate);


        return price - discount;


    }


    const price = 100;


    const discountRate = 10;


    console.log(getTotalPrice(price, discountRate)); // Outputs: 90


    <Bad Code>


    // Complex expression directly in the main function


    function getTotalPrice(price, discountRate) {


        return price - (price * (discountRate / 100));


    }


    const price = 100;


    const discountRate = 10;


    console.log(getTotalPrice(price, discountRate)); // Outputs: 90


    In the good example, the complex discount calculation is refactored into a helper
    function calculateDiscount, making the main function getTotalPrice easier to read
    and understand. In the bad example, the complex expression is embedded directly
    in the main function, making it harder to read and maintain.


    <Memo>


    Refactoring complex expressions into helper functions not only improves readability
    but also makes it easier to test individual parts of your code.


    74


    # Avoid chaining multiple ternary operators.


    * * *


    Use if-else statements instead of chaining multiple ternary operators for better
    readability.


    * * *


    Chaining multiple ternary operators can make code difficult to read and understand.
    Using if-else statements can improve clarity.


