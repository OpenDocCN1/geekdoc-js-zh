    * @param {number} a - The first number.\n* @param {number} b - The second number.\n\
    * @returns {number} The sum of the two numbers.\n*/\nfunction add(a, b) {\n  \
    \  return a + b;\n}\n```\n\n### Bad Code\n```javascript\nfunction add(a, b) {\n\
    \    return a + b;\n}\n```\n\nIn the good example, the function `add` is documented\
    \ with comments that describe the input parameters `a` and `b` as numbers and\
