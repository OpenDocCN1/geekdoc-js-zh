    # Use constants for values that do not change.


    * * *


    Using constants for values that do not change improves code readability and maintainability.


    * * *


    When a value is not supposed to change throughout the execution of a program,
    it is best to declare it as a constant. This practice helps other developers understand
    that the value is fixed and should not be modified.


    < Good Code >


    // Good example: Using constants for fixed values


    const MAX_USERS = 100;


    const API_URL = ''https://api.example.com/data'';


    function fetchData() {


      fetch(API_URL)


        .then(response => response.json())


        .then(data => console.log(data));


    }


