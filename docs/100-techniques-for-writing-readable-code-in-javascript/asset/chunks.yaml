    }


    In the good example, the function names clearly indicate their purpose, making
    the code easier to read and understand. In the bad example, the names are vague
    and do not provide enough context about what the functions do.


    <Memo>


    Using descriptive names is part of the Clean Code principles, which emphasize
    writing code that is easy to read and understand.


    47


    # Write pure functions that do not have side effects.


