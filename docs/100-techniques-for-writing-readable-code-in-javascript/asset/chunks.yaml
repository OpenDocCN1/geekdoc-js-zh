  trans: "\n\n在好的示例中，数据获取逻辑与 UI 渲染逻辑分离，使代码更具模块化且更易于维护。在坏的示例中，两种逻辑被混合在单个函数中，这可能会导致测试和调试困难。\n\
    \n> **Memo**：这种关注点分离（Separation of Concerns）是软件工程中的一个基本原则，通常被称为单一职责原则（SRP）。\n\n\
    # 使用设计模式解决常见问题\n\n实现设计模式，以标准化的方式解决重复出现的问题。设计模式为软件设计中的常见问题提供了经过验证的解决方案。使用它们可以提高代码的可读性、可重用性和可维护性。\n\
    \n### 好的代码\n```javascript\n// Singleton Pattern\nclass Singleton {\n  constructor()\
    \ {\n    if (!Singleton.instance) {\n      Singleton.instance = this;\n    }\n\
    \    return Singleton.instance;\n  }\n  // Example method\n  log() {\n    console.log('Singleton\
    \ instance');\n  }\n}\nconst instance1 = new Singleton();\nconst instance2 = new\
    \ Singleton();\nconsole.log(instance1 === instance2); // true\n```\n\n### 坏的代码\n\
    ```javascript\nclass Singleton {\n  constructor() {\n    // No instance check\n\
    \  }\n  // Example method\n  log() {\n    console.log('Singleton instance');\n\
    \  }\n}\nconst instance1 = new Singleton();\nconst instance2 = new Singleton();\n\
    console.log(instance1 === instance2); // false\n```\n\n在好的示例中，`Singleton` 模式确保该类仅创建一个实例，这对于管理全局状态非常有用。在坏的示例中，`Singleton`\
    \ 模式未被正确实现，导致创建了多个实例，并可能引发状态管理问题。\n\n> **Memo**：`Singleton` 模式是“四人帮”（Gang of Four）在其开创性著作《设计模式：可复用面向对象软件的基础》中介绍的\
    \ 23 种设计模式之一。\n\n# 为异步函数利用 async 关键字\n\n使用 `async` 关键字使函数返回一个 promise，从而实现异步操作。`async`\
    \ 关键字用于定义异步函数，允许你以更具可读性和可维护性的方式编写异步代码。\n\n### 好的代码\n```javascript\n// Good example\
    \ using async keyword\nasync function fetchData() {\n  try {\n    const response\
    \ = await fetch('https://api.example.com/data');\n    const data = await response.json();\n\
    \    console.log(data);\n  } catch (error) {\n    console.error('Error fetching\
    \ data:', error);\n  }\n}\nfetchData();\n```\n\n### 坏的代码\n```javascript\n// Bad\
    \ example without async keyword\nfunction fetchData() {\n  fetch('https://api.example.com/data')\n\
    \    .then(response => response.json())\n    .then(data => {\n      console.log(data);\n\
    \    })\n    .catch(error => {\n      console.error('Error fetching data:', error);\n\
    \    });\n}\nfetchData();\n```\n\n好的示例使用 `async` 关键字定义 `fetchData` 函数，使其返回一个 promise\
    \ 并允许使用 `await` 进行异步操作。这使得代码更具可读性且更易于维护。坏的示例使用了传统的 promise 链式调用，这在处理更复杂的异步操作时会变得难以阅读和管理。\n\
    \n> **Memo**：`async` 关键字在 ECMAScript 2017 (ES8) 中引入，此后成为了 JavaScript 处理异步操作的标准方式。\n\
    \n# 利用 await 关键字处理 promise\n\n`await` 关键字会暂停 `async` 函数的执行，直到 promise 被解析（resolved），使异步代码看起来像同步代码。`await`\
    \ 关键字在 `async` 函数内部使用，用于等待 promise 解析，从而简化异步操作的处理。\n\n### 好的代码\n```javascript\n\
    // Good example using await keyword\nasync function getUserData(userId) {\n  try\
    \ {\n    const response = await fetch(`https://api.example.com/users/${userId}`);\n\
    \    const user = await response.json();\n    console.log(user);\n  } catch (error)\
    \ {\n    console.error('Error fetching user data:', error);\n  }\n}\ngetUserData(1);\n\
    ```\n\n### 坏的代码\n```javascript\n// Bad example without await keyword\nfunction\
    \ getUserData(userId) {\n  fetch(`https://api.example.com/users/${userId}`)\n\
    \    .then(response => response.json())\n    .then(user => {\n      console.log(user);\n\
    \    })\n    .catch(error => {\n      console.error('Error fetching user data:',\
    \ error);\n    });\n}\ngetUserData(1);\n```\n\n好的示例使用 `await` 关键字等待 `fetch` 操作和\
    \ JSON 解析完成，使代码更具可读性且更容易理解。坏的示例使用 promise 链式调用，这可能会导致代码嵌套且难以阅读，尤其是在有多个异步操作时。\n\
    \n> **Memo**：`await` 关键字只能在标记有 `async` 关键字的函数内部使用。它与 `async` 关键字一起在 ECMAScript\
    \ 2017 (ES8) 中引入。\n\n# 使用 JSON.stringify 和 JSON.parse 对对象进行深拷贝\n\n利用 `JSON.stringify`\
    \ 和 `JSON.parse` 创建对象的深拷贝，确保嵌套的对象和数组也被复制。\n\n在 JavaScript 中处理对象时，理解浅拷贝（shallow\
    \ copy）和深拷贝（deep copy）之间的区别至关重要。浅拷贝创建一个新对象，但该对象与原对象引用相同的嵌套对象和数组。相比之下，深拷贝创建一个新对象，其中嵌套的对象和数组都是全新的实例。\n\
    \n### 好的代码\n```javascript\n// Original object\nconst original = {\n  name: 'John',\n\
    \  age: 30,\n  hobbies: ['reading', 'hiking'],\n  address: {\n    street: '123\
    \ Main St',\n    city: 'Anytown'\n  }\n};\n// Deep copy using JSON.stringify and\
    \ JSON.parse\nconst deepCopy = JSON.parse(JSON.stringify(original));\n// Modify\
    \ the nested object in the original\noriginal.address.city = 'New City';\nconsole.log('Original:',\
    \ original);\n// Output: Original: { name: 'John', age: 30, hobbies: ['reading',\
    \ 'hiking'], address: { street: '123 Main St', city: 'New City' } }\nconsole.log('Deep\
    \ Copy:', deepCopy);\n// Output: Deep Copy: { name: 'John', age: 30, hobbies:\
    \ ['reading', 'hiking'], address: { street: '123 Main St', city: 'Anytown' } }\n\
    ```\n\n### 坏的代码\n```javascript\n// Original object\nconst original = {\n  name:\
    \ 'John',\n  age: 30,\n  hobbies: ['reading', 'hiking'],\n  address: {\n    street:\
    \ '123 Main St',\n    city: 'Anytown'\n  }\n};\n// Shallow copy using spread operator\n\
    const shallowCopy = { ...original };\n// Modify the nested object in the original\n\
    original.address.city = 'New City';\nconsole.log('Original:', original);\n// Output:\
    \ Original: { name: 'John', age: 30, hobbies: ['reading', 'hiking'], address:\
    \ { street: '123 Main St', city: 'New City' } }\nconsole.log('Shallow Copy:',\
    \ shallowCopy);\n// Output: Shallow Copy: { name: 'John', age: 30, hobbies: ['reading',\
    \ 'hiking'], address: { street: '123 Main St', city: 'New City' } }\n```\n\n`JSON.stringify`\
    \ 方法将 JavaScript 对象或值转换为 JSON 字符串，而 `JSON.parse` 将 JSON 字符串转换回 JavaScript 对象。通过结合这两个方法，我们可以创建对象的深拷贝。\n\
    \n在好的代码示例中，我们首先创建了一个包含嵌套对象和数组的原对象。然后我们使用 `JSON.parse(JSON.stringify(original))`\
    \ 来创建原对象的深拷贝。当我们修改原对象中的嵌套属性 `address.city` 时，深拷贝不受影响，证明它是一个独立的实例。\n\n在坏的代码示例中，我们尝试使用展开运算符\
    \ (`{ ...original }`) 来创建副本。然而，这种方法仅创建了浅拷贝，其中嵌套的对象和数组仍然引用原对象。因此，当我们修改原对象中的嵌套属性\
    \ `address.city` 时，浅拷贝也会受到影响，因为它们共享同一个嵌套 `address` 对象的引用。\n\n"
- fmt: "\nIt's important to note that the `JSON.stringify` and `JSON.parse` approach\
    \ has limitations. It cannot handle circular references, functions, or certain\
    \ data types like `undefined`, `Infinity`, and `NaN`. Additionally, it may cause\
    \ issues with object properties that have special characters or are not valid\
    \ JSON keys.\n\n> **Memo**\n> The `JSON.stringify` and `JSON.parse` approach for\
    \ deep copying objects is a widely used technique in JavaScript, but it's not\
    \ the only way to achieve deep copying. Other methods include using libraries\
    \ like Lodash's `_.cloneDeep` function or implementing a custom deep copying function\
    \ that recursively copies nested objects and arrays.\n\n# Leverage Array.prototype.some\
    \ and Array.prototype.every for conditional checks\n\nUtilize the `Array.prototype.some`\
    \ and `Array.prototype.every` methods to perform efficient conditional checks\
    \ on arrays, reducing the need for complex loops and conditional statements.\n\
    \nIn JavaScript, you often need to perform conditional checks on arrays, such\
    \ as checking if at least one element in an array satisfies a certain condition\
    \ or if all elements satisfy a condition. The `Array.prototype.some` and `Array.prototype.every`\
    \ methods provide a concise and readable way to perform these checks without the\
    \ need for complex loops and conditional statements.\n\n### Good Code\n```javascript\n\
    const numbers = [1, 2, 3, 4, 5];\n\n// Check if at least one number is greater\
    \ than 3\nconst hasGreaterThanThree = numbers.some(num => num > 3);\nconsole.log(hasGreaterThanThree);\
    \ // Output: true\n\n// Check if all numbers are positive\nconst allPositive =\
    \ numbers.every(num => num > 0);\nconsole.log(allPositive); // Output: true\n\n\
    const users = [\n  { name: 'John', age: 25, active: true },\n  { name: 'Jane',\
    \ age: 30, active: false },\n  { name: 'Bob', age: 35, active: true }\n];\n\n\
    // Check if at least one user is active\nconst hasActiveUser = users.some(user\
    \ => user.active);\nconsole.log(hasActiveUser); // Output: true\n\n// Check if\
    \ all users are over 18\nconst allOverEighteen = users.every(user => user.age\
    \ > 18);\nconsole.log(allOverEighteen); // Output: true\n```\n\n### Bad Code\n\
    ```javascript\nconst numbers = [1, 2, 3, 4, 5];\n\n// Check if at least one number\
    \ is greater than 3\nlet hasGreaterThanThree = false;\nfor (let i = 0; i < numbers.length;\
    \ i++) {\n  if (numbers[i] > 3) {\n    hasGreaterThanThree = true;\n    break;\n\
    \  }\n}\nconsole.log(hasGreaterThanThree); // Output: true\n\n// Check if all\
    \ numbers are positive\nlet allPositive = true;\nfor (let i = 0; i < numbers.length;\
    \ i++) {\n  if (numbers[i] <= 0) {\n    allPositive = false;\n    break;\n  }\n\
    }\nconsole.log(allPositive); // Output: true\n```\n\nThe `Array.prototype.some`\
    \ method tests whether at least one element in the array passes the test implemented\
    \ by the provided function. It executes the provided function once for each element\
    \ of the array until it finds one where the function returns a truthy value, at\
    \ which point it returns `true` and stops iterating. If no elements pass the test,\
    \ it returns `false`.\n\nThe `Array.prototype.every` method tests whether all\
    \ elements in the array pass the test implemented by the provided function. It\
    \ executes the provided function once for each element of the array until it finds\
    \ one where the function returns a falsy value, at which point it returns `false`\
    \ and stops iterating. If all elements pass the test, it returns `true`.\n\nIn\
    \ the good code example, we demonstrate the use of `some` and `every` to perform\
    \ conditional checks on arrays of numbers and objects. The code is concise, readable,\
    \ and avoids the need for complex loops and conditional statements.\n\nIn the\
    \ bad code example, we achieve the same functionality using traditional `for`\
    \ loops and conditional statements. While this approach works, it is more verbose,\
    \ harder to read, and more prone to errors.\n\nUsing `some` and `every` not only\
    \ makes the code more readable but also provides better performance in certain\
    \ cases, as these methods can short-circuit.\n\n> **Memo**\n> The `Array.prototype.some`\
    \ and `Array.prototype.every` methods are part of the ECMAScript 5 (ES5) specification.\
    \ They are widely supported in modern browsers and can be used in older environments\
    \ with the help of polyfills or transpilers like `Babel`.\n\n# Utilize Array.prototype.find\
    \ for locating elements in arrays\n\nUse `Array.prototype.find` to locate elements\
    \ in arrays efficiently.\n\nThe `find` method in JavaScript arrays helps you locate\
    \ the first element that satisfies a given condition, making your code cleaner\
    \ and more readable.\n\n### Good Code\n```javascript\n// Good example: Using Array.prototype.find\
    \ to locate an element\nconst users = [\n  { id: 1, name: 'Alice' },\n  { id:\
    \ 2, name: 'Bob' },\n  { id: 3, name: 'Charlie' }\n];\nconst user = users.find(user\
    \ => user.id === 2);\nconsole.log(user); // { id: 2, name: 'Bob' }\n```\n\n###\
    \ Bad Code\n```javascript\n// Bad example: Using a for loop to locate an element\n\
    const users = [\n  { id: 1, name: 'Alice' },\n  { id: 2, name: 'Bob' },\n  { id:\
    \ 3, name: 'Charlie' }\n];\nlet user;\nfor (let i = 0; i < users.length; i++)\
    \ {\n  if (users[i].id === 2) {\n    user = users[i];\n    break;\n  }\n}\nconsole.log(user);\
    \ // { id: 2, name: 'Bob' }\n```\n\nThe good example uses `Array.prototype.find`,\
    \ which is more concise and easier to read compared to the `for` loop in the bad\
    \ example. The `find` method abstracts the iteration logic, making the code cleaner\
    \ and reducing the potential for errors.\n\n> **Memo**\n> The `find` method returns\
    \ `undefined` if no elements satisfy the condition, so it's important to handle\
    \ this case in your code.\n\n# Choose arrays for ordered collections of data\n\
    \nUse arrays when you need to maintain an ordered collection of data.\n\nArrays\
    \ in JavaScript are ideal for storing ordered collections of data, allowing you\
    \ to access elements by their index and perform various operations like sorting\
    \ and filtering.\n\n### Good Code\n```javascript\n// Good example: Using an array\
    \ to store ordered data\nconst fruits = ['Apple', 'Banana', 'Cherry'];\nconsole.log(fruits[0]);\
    \ // 'Apple'\nconsole.log(fruits[1]); // 'Banana'\nconsole.log(fruits[2]); //\
    \ 'Cherry'\n```\n\n### Bad Code\n```javascript\n// Bad example: Using an object\
    \ to store ordered data\nconst fruits = {\n  0: 'Apple',\n  1: 'Banana',\n  2:\
    \ 'Cherry'\n};\nconsole.log(fruits[0]); // 'Apple'\nconsole.log(fruits[1]); //\
    \ 'Banana'\nconsole.log(fruits[2]); // 'Cherry'\n```\n\nThe good example uses\
    \ an array, which is the appropriate data structure for ordered collections. Arrays\
    \ provide built-in methods for iteration, sorting, and other operations. The bad\
    \ example uses an object, which is not intended for ordered collections and lacks\
    \ these convenient methods.\n\n> **Memo**\n> Arrays in JavaScript are zero-indexed,\
    \ meaning the first element is accessed with index `0`. This is a common feature\
    \ in many programming languages.\n\n# Use objects for key-value pairs\n\nObjects\
    \ are ideal for storing key-value pairs where the keys are strings.\n\nUsing objects\
    \ to store key-value pairs is a common practice in JavaScript. It allows for easy\
    \ access and manipulation of data.\n\n### Good Code\n```javascript\n// Good example:\
    \ Using an object for key-value pairs\nconst user = {\n  name: 'John Doe',\n \
    \ age: 30,\n  email: 'john.doe@example.com'\n};\n// Accessing values\nconsole.log(user.name);\
    \ // Output: John Doe\nconsole.log(user.age);  // Output: 30\n```\n\n### Bad Code\n\
    ```javascript\n// Bad example: Using separate variables for each key-value pair\n\
    const userName = 'John Doe';\nconst userAge = 30;\nconst userEmail = 'john.doe@example.com';\n\
    // Accessing values\nconsole.log(userName); // Output: John Doe\nconsole.log(userAge);\
    \  // Output: 30\n```\n"
  raw: 'It''s important to note that the JSON.stringify and JSON.parse approach has
    limitations. It cannot handle circular references, functions, or certain data
    types like undefined, Infinity, and NaN. Additionally, it may cause issues with
    object properties that have special characters or are not valid JSON keys.


    <Memo>


    The JSON.stringify and JSON.parse approach for deep copying objects is a widely
    used technique in JavaScript, but it''s not the only way to achieve deep copying.
    Other methods include using libraries like Lodash''s _.cloneDeep function or implementing
    a custom deep copying function that recursively copies nested objects and arrays.


    84


    # Leverage Array.prototype.some and Array.prototype.every for conditional checks


    * * *


    Utilize the Array.prototype.some and Array.prototype.every methods to perform
    efficient conditional checks on arrays, reducing the need for complex loops and
    conditional statements.


    * * *


    In JavaScript, you often need to perform conditional checks on arrays, such as
    checking if at least one element in an array satisfies a certain condition or
    if all elements satisfy a condition. The Array.prototype.some and Array.prototype.every
    methods provide a concise and readable way to perform these checks without the
    need for complex loops and conditional statements.


    < Good Code >


    const numbers = [1, 2, 3, 4, 5];


    // Check if at least one number is greater than 3


    const hasGreaterThanThree = numbers.some(num => num > 3);


    console.log(hasGreaterThanThree); // Output: true


    // Check if all numbers are positive


    const allPositive = numbers.every(num => num > 0);


    console.log(allPositive); // Output: true


    const users = [


      { name: ''John'', age: 25, active: true },


      { name: ''Jane'', age: 30, active: false },


      { name: ''Bob'', age: 35, active: true }


    ];


    // Check if at least one user is active


    const hasActiveUser = users.some(user => user.active);


    console.log(hasActiveUser); // Output: true


    // Check if all users are over 18


    const allOverEighteen = users.every(user => user.age > 18);


    console.log(allOverEighteen); // Output: true


    <Bad Code>


    const numbers = [1, 2, 3, 4, 5];


    // Check if at least one number is greater than 3


    let hasGreaterThanThree = false;


    for (let i = 0; i < numbers.length; i++) {


      if (numbers[i] > 3) {


        hasGreaterThanThree = true;


        break;


      }


    }


    console.log(hasGreaterThanThree); // Output: true


    // Check if all numbers are positive


    let allPositive = true;


    for (let i = 0; i < numbers.length; i++) {


      if (numbers[i] <= 0) {


        allPositive = false;


        break;


      }


    }


    console.log(allPositive); // Output: true


    The Array.prototype.some method tests whether at least one element in the array
    passes the test implemented by the provided function. It executes the provided
    function once for each element of the array until it finds one where the function
    returns a truthy value (a value that is considered true when encountered in a
    boolean context), at which point it returns true and stops iterating over the
    remaining elements. If no elements pass the test, it returns false.


    The Array.prototype.every method tests whether all elements in the array pass
    the test implemented by the provided function. It executes the provided function
    once for each element of the array until it finds one where the function returns
    a falsy value (a value that is considered false when encountered in a boolean
    context), at which point it returns false and stops iterating over the remaining
    elements. If all elements pass the test, it returns true.


    In the good code example, we demonstrate the use of some and every to perform
    conditional checks on arrays of numbers and objects. The code is concise, readable,
    and avoids the need for complex loops and conditional statements.


    In the bad code example, we achieve the same functionality using traditional for
    loops and conditional statements. While this approach works, it is more verbose,
    harder to read, and more prone to errors, especially as the conditions become
    more complex.


    Using some and every not only makes the code more readable but also provides better
    performance in certain cases, as these methods can short-circuit and stop iterating
    over the remaining elements once the condition is met or violated.


    <Memo>


    The Array.prototype.some and Array.prototype.every methods are part of the ECMAScript
    5 (ES5) specification, which was released in 2009. They are widely supported in
    modern browsers and can be used in older environments with the help of polyfills
    or transpilers like Babel.


    85


    # Utilize Array.prototype.find for locating elements in arrays.


    * * *


    Use Array.prototype.find to locate elements in arrays efficiently.


    * * *


    The find method in JavaScript arrays helps you locate the first element that satisfies
    a given condition, making your code cleaner and more readable.


    < Good Code >


    // Good example: Using Array.prototype.find to locate an element


    const users = [


      { id: 1, name: ''Alice'' },


      { id: 2, name: ''Bob'' },


      { id: 3, name: ''Charlie'' }


    ];


    const user = users.find(user => user.id === 2);


    console.log(user); // { id: 2, name: ''Bob'' }


    <Bad Code>


    // Bad example: Using a for loop to locate an element


    const users = [


      { id: 1, name: ''Alice'' },


      { id: 2, name: ''Bob'' },


      { id: 3, name: ''Charlie'' }


    ];


    let user;


    for (let i = 0; i < users.length; i++) {


      if (users[i].id === 2) {


        user = users[i];


        break;


      }


    }


    console.log(user); // { id: 2, name: ''Bob'' }


    The good example uses Array.prototype.find, which is more concise and easier to
    read compared to the for loop in the bad example. The find method abstracts the
    iteration logic, making the code cleaner and reducing the potential for errors.


    <Memo>


    The find method returns undefined if no elements satisfy the condition, so it''s
    important to handle this case in your code.


    86


    # Choose arrays for ordered collections of data.


    * * *


    Use arrays when you need to maintain an ordered collection of data.


    * * *


    Arrays in JavaScript are ideal for storing ordered collections of data, allowing
    you to access elements by their index and perform various operations like sorting
    and filtering.


    < Good Code >


    // Good example: Using an array to store ordered data


    const fruits = [''Apple'', ''Banana'', ''Cherry''];


    console.log(fruits[0]); // ''Apple''


    console.log(fruits[1]); // ''Banana''


    console.log(fruits[2]); // ''Cherry''


    <Bad Code>


    // Bad example: Using an object to store ordered data


    const fruits = {


      0: ''Apple'',


      1: ''Banana'',


      2: ''Cherry''


    };


    console.log(fruits[0]); // ''Apple''


    console.log(fruits[1]); // ''Banana''


    console.log(fruits[2]); // ''Cherry''


    The good example uses an array, which is the appropriate data structure for ordered
    collections. Arrays provide built-in methods for iteration, sorting, and other
    operations. The bad example uses an object, which is not intended for ordered
    collections and lacks these convenient methods.


    <Memo>


    Arrays in JavaScript are zero-indexed, meaning the first element is accessed with
    index 0\. This is a common feature in many programming languages.


    87


    # Use objects for key-value pairs.


    * * *


    Objects are ideal for storing key-value pairs where the keys are strings.


    * * *


    Using objects to store key-value pairs is a common practice in JavaScript. It
    allows for easy access and manipulation of data.


    < Good Code >


    // Good example: Using an object for key-value pairs


    const user = {


      name: ''John Doe'',


      age: 30,


      email: ''john.doe@example.com''


    };


    // Accessing values


    console.log(user.name); // Output: John Doe


    console.log(user.age);  // Output: 30


    <Bad Code>


    // Bad example: Using separate variables for each key-value pair


    const userName = ''John Doe'';


    const userAge = 30;


    const userEmail = ''john.doe@example.com'';


    // Accessing values


    console.log(userName); // Output: John Doe


    console.log(userAge);  // Output: 30'
