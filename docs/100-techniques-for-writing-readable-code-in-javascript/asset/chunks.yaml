  trans: "\n模块化编程提倡使用模块来改善代码的组织和管理。JavaScript 的 ES6 引入了模块，有助于封装代码和依赖关系。\n\n# 限制函数参数数量\n\
    \n减少函数中的参数数量，以提高可读性和可维护性。\n\n参数过多的函数会变得难以阅读和维护。通过限制参数数量，你可以让代码更易于理解和使用。\n\n###\
    \ 良好代码\n```javascript\n// 良好示例：使用选项对象来限制参数\nfunction createUser({ name, age, email\
    \ }) {\n  // 函数实现\n  console.log(`Name: ${name}, Age: ${age}, Email: ${email}`);\n\
    }\n\ncreateUser({ name: \"John\", age: 30, email: \"john@example.com\" });\n```\n\
    \n### 糟糕代码\n```javascript\n// 糟糕示例：参数过多\nfunction createUser(name, age, email,\
    \ address, phone, isAdmin) {\n  // 函数实现\n  console.log(`Name: ${name}, Age: ${age},\
    \ Email: ${email}`);\n}\n\ncreateUser(\"John\", 30, \"john@example.com\", \"123\
    \ Main St\", \"555-5555\", false);\n```\n\n在良好示例中，使用选项对象封装了参数，使函数调用更简洁、更灵活。在糟糕示例中，参数过多导致函数调用混乱且难以管理。\n\
    \n**提示：** 使用选项对象不仅能提高可读性，还能在不改变函数签名的情况下，更轻松地在未来添加新参数。\n\n# 使用辅助函数封装复杂逻辑\n\n将复杂逻辑封装在辅助函数中，以提高可读性和可重用性。\n\
    \n函数中的复杂逻辑会使其难以阅读和理解。将复杂逻辑拆分为更小、可复用的辅助函数，能增强清晰度和可维护性。\n\n### 良好代码\n```javascript\n\
    // 良好示例：使用辅助函数\nfunction calculateTotal(items) {\n  return items.reduce((total,\
    \ item) => total + calculateItemPrice(item), 0);\n}\n\nfunction calculateItemPrice(item)\
    \ {\n  const tax = calculateTax(item.price);\n  return item.price + tax;\n}\n\n\
    function calculateTax(price) {\n  return price * 0.1;\n}\n\nconst items = [\n\
    \  { name: \"Book\", price: 15 },\n  { name: \"Pen\", price: 5 },\n];\n\nconsole.log(calculateTotal(items));\
    \ // 输出: 22\n```\n\n### 糟糕代码\n```javascript\n// 糟糕示例：所有逻辑都在一个函数中\nfunction calculateTotal(items)\
    \ {\n  return items.reduce((total, item) => {\n    const tax = item.price * 0.1;\n\
    \    const itemPrice = item.price + tax;\n    return total + itemPrice;\n  },\
    \ 0);\n}\n\nconst items = [\n  { name: \"Book\", price: 15 },\n  { name: \"Pen\"\
    , price: 5 },\n];\n\nconsole.log(calculateTotal(items)); // 输出: 22\n```\n\n在良好示例中，逻辑被拆分为更小、可复用的函数：`calculateItemPrice`\
    \ 和 `calculateTax`。这使得 `calculateTotal` 函数更简洁、更易于理解。在糟糕示例中，所有逻辑都塞进一个函数，导致代码难以阅读和维护。\n\
    \n**提示：** 使用辅助函数不仅能提高代码可读性，还能促进代码复用和测试，使调试和扩展功能更加容易。\n\n# 编写单元测试以确保函数正确执行单一职责\n\
    \n单元测试有助于验证各个函数是否正确执行其预期任务。\n\n编写单元测试可以确保代码库中的每个函数都按预期工作，使代码更可靠、更易于维护。\n\n###\
    \ 良好代码\n```javascript\n// 两数相加的函数\nfunction add(a, b) {\n  return a + b;\n}\n\n\
    // 针对 add 函数的单元测试\nfunction testAdd() {\n  console.assert(add(2, 3) === 5, '测试失败：2\
    \ + 3 应等于 5');\n  console.assert(add(-1, 1) === 0, '测试失败：-1 + 1 应等于 0');\n  console.assert(add(0,\
    \ 0) === 0, '测试失败：0 + 0 应等于 0');\n}\n\ntestAdd();\n```\n\n### 糟糕代码\n```javascript\n\
    // 两数相加的函数\nfunction add(a, b) {\n  return a + b;\n}\n// 未提供单元测试\n```\n\n良好代码：良好示例包含一个简单的\
    \ `add` 函数和对应的 `testAdd` 函数，该函数检查多个用例以确保 `add` 函数正确工作。这便于验证函数的正确性并及早发现错误。\n\n\
    糟糕代码：糟糕示例缺少任何单元测试，难以确保 `add` 函数按预期工作。没有测试，对函数的任何修改都可能引入未被发现的错误。\n\n**提示：** 单元测试是测试驱动开发（TDD）的基础部分，这是一种在实际代码编写之前先编写测试的软件开发流程。\n\
    \n# 利用 JavaScript 模块（ES6 import/export）实现更好的代码组织\n\n使用 JavaScript 模块有助于将代码组织成可复用且易于维护的部分。\n\
    \nJavaScript 模块允许你将代码拆分为多个文件，每个文件负责特定功能。这提高了代码的可读性和可维护性。\n\n### 良好代码\n```javascript\n\
    // math.js - 模块文件\nexport function add(a, b) {\n  return a + b;\n}\n\nexport function\
    \ subtract(a, b) {\n  return a - b;\n}\n\n// main.js - 主文件\nimport { add, subtract\
    \ } from './math.js';\n\nconsole.log(add(2, 3)); // 5\nconsole.log(subtract(5,\
    \ 2)); // 3\n```\n\n### 糟糕代码\n```javascript\n// 所有函数都在一个文件中\nfunction add(a, b)\
    \ {\n  return a + b;\n}\n\nfunction subtract(a, b) {\n  return a - b;\n}\n\nconsole.log(add(2,\
    \ 3)); // 5\nconsole.log(subtract(5, 2)); // 3\n```\n\n良好代码：良好示例使用 ES6 模块将 `add`\
    \ 和 `subtract` 函数分离到 `math.js` 文件中，然后导入到 `main.js` 文件中。这种关注点分离使代码更具模块化，更易于阅读和维护。\n\
    \n糟糕代码：糟糕示例将所有函数放在一个文件中，随着代码库的增长，这会变得难以管理。它使得代码更难管理和理解，尤其是在大型项目中。\n\n**提示：** ES6\
    \ 模块是静态分析的，这意味着 `import`/`export` 语句在编译时就会被检查，这有助于及早发现错误。\n\n# 使用 async 函数编写更清晰的异步代码\n\
    \nAsync 函数为编写异步代码提供了更简洁的语法，使其更易于阅读和维护。\n\n与使用回调或 Promise 链不同，async 函数允许你编写看起来和行为类似于同步代码的异步代码。\n\
    \n### 良好代码\n```javascript\nasync function fetchData() {\n  try {\n    const response\
    \ = await fetch('https://api.example.com/data');\n    const data = await response.json();\n\
    \    console.log(data);\n  } catch (error) {\n    console.error('获取数据时出错：', error);\n\
    \  }\n}\n\nfetchData();\n```\n\n### 糟糕代码\n```javascript\nfunction fetchData()\
    \ {\n  fetch('https://api.example.com/data')\n    .then(response => response.json())\n\
    \    .then(data => console.log(data))\n    .catch(error => console.error('获取数据时出错：',\
    \ error));\n}\n\nfetchData();\n```\n\n函数前的 `async` 关键字使其成为异步函数。在异步函数内部，你可以使用 `await`\
    \ 关键字暂停执行，等待 `Promise` 解析后再继续。这使得代码更易读、更易推理，因为它避免了深层嵌套的回调或 Promise 链。`try...catch`\
    \ 块用于处理异步操作期间可能发生的任何错误。\n\n**提示：** Async 函数是在 ECMAScript 2017（ES8）中引入的，为 `Promises`\
    \ 提供了语法糖。\n\n# 利用 for...of 遍历可迭代对象\n\n`for...of` 循环提供了一种简洁的方式来遍历可迭代对象，使代码更具可读性和表现力。\n\
    \n`for...of` 循环专为遍历可迭代对象而设计，例如数组、字符串、Map、Set 以及其他实现了可迭代协议的对象。\n\n### 良好代码\n```javascript\n\
    const fruits = ['apple', 'banana', 'orange'];\n\nfor (const fruit of fruits) {\n\
    \  console.log(fruit);\n}\n```\n\n### 糟糕代码\n```javascript\nconst fruits = ['apple',\
    \ 'banana', 'orange'];\n\nfor (let i = 0; i < fruits.length; i++) {\n  console.log(fruits[i]);\n\
    }\n```\n\n"
- fmt: "\nThe `for...of` loop is more concise and expressive than the traditional\
    \ `for` loop when iterating over arrays or other iterable objects. It automatically\
    \ retrieves the values from the iterable object, eliminating the need for manual\
    \ indexing. This makes the code more readable and less prone to off-by-one errors.\
    \ Additionally, the `for...of` loop can be used with other iterable objects like\
    \ strings, maps, and sets.\n\n<Memo>\nThe `for...of` loop was introduced in ECMAScript\
    \ 2015 (ES6) and is part of the new iteration protocols in JavaScript.\n</Memo>\n\
    \n69\n\n# Employ `Array.prototype.reduce` for accumulating array values.\n\nUse\
    \ `Array.prototype.reduce` to accumulate values in an array for better readability\
    \ and maintainability.\n\n`Array.prototype.reduce` is a powerful method that allows\
    \ you to accumulate values in an array into a single result. It is particularly\
    \ useful for summing numbers, concatenating strings, or merging objects.\n\n<Good\
    \ Code>\n```javascript\n// Good example: Using reduce to sum array values\nconst\
    \ numbers = [1, 2, 3, 4, 5];\nconst sum = numbers.reduce((accumulator, currentValue)\
    \ => accumulator + currentValue, 0);\nconsole.log(sum); // Output: 15\n```\n</Good\
    \ Code>\n\n<Bad Code>\n```javascript\n// Bad example: Using a for loop to sum\
    \ array values\nconst numbers = [1, 2, 3, 4, 5];\nlet sum = 0;\nfor (let i = 0;\
    \ i < numbers.length; i++) {\n  sum += numbers[i];\n}\nconsole.log(sum); // Output:\
    \ 15\n```\n</Bad Code>\n\nThe good example uses `reduce`, which is more concise\
    \ and expressive. It clearly shows the intent of accumulating values. The bad\
    \ example uses a `for` loop, which is more verbose and less declarative.\n\n<Memo>\n\
    `Array.prototype.reduce` can also be used for more complex operations, such as\
    \ flattening arrays or creating lookup tables from arrays.\n</Memo>\n\n70\n\n\
    # Use `Object.assign` for merging objects.\n\nUse `Object.assign` to merge multiple\
    \ objects into one for better code clarity and efficiency.\n\n`Object.assign`\
    \ is a method that copies all enumerable own properties from one or more source\
    \ objects to a target object. It is useful for merging objects and creating a\
    \ new object with combined properties.\n\n<Good Code>\n```javascript\n// Good\
    \ example: Using Object.assign to merge objects\nconst obj1 = { a: 1, b: 2 };\n\
    const obj2 = { b: 3, c: 4 };\nconst mergedObj = Object.assign({}, obj1, obj2);\n\
    console.log(mergedObj); // Output: { a: 1, b: 3, c: 4 }\n```\n</Good Code>\n\n\
    <Bad Code>\n```javascript\n// Bad example: Manually merging objects\nconst obj1\
    \ = { a: 1, b: 2 };\nconst obj2 = { b: 3, c: 4 };\nconst mergedObj = {};\nfor\
    \ (let key in obj1) {\n  mergedObj[key] = obj1[key];\n}\nfor (let key in obj2)\
    \ {\n  mergedObj[key] = obj2[key];\n}\nconsole.log(mergedObj); // Output: { a:\
    \ 1, b: 3, c: 4 }\n```\n</Bad Code>\n\nThe good example uses `Object.assign`,\
    \ which is more concise and avoids potential errors in manual merging. The bad\
    \ example uses `for` loops, which are more verbose and error-prone.\n\n<Memo>\n\
    `Object.assign` performs a shallow copy, meaning it only copies properties at\
    \ the first level. For deep cloning, other methods or libraries like `lodash`\
    \ are needed.\n</Memo>\n\n71\n\n# Break down long conditional expressions into\
    \ multiple lines.\n\nSimplify complex conditional expressions by breaking them\
    \ into multiple lines for better readability.\n\nLong conditional expressions\
    \ can be difficult to read and understand. Breaking them into multiple lines makes\
    \ the code more readable and maintainable.\n\n<Good Code>\n```javascript\n// Good\
    \ example: breaking down a long conditional expression\nif (\n    user.isActive\
    \ &&\n    user.isVerified &&\n    user.hasSubscription &&\n    user.subscription.isValid\n\
    ) {\n    // Perform some action\n    console.log(\"User is active, verified, and\
    \ has a valid subscription.\");\n}\n```\n</Good Code>\n\n<Bad Code>\n```javascript\n\
    // Bad example: long conditional expression in a single line\nif (user.isActive\
    \ && user.isVerified && user.hasSubscription && user.subscription.isValid) {\n\
    \    // Perform some action\n    console.log(\"User is active, verified, and has\
    \ a valid subscription.\");\n}\n```\n</Bad Code>\n\nIn the good example, the conditional\
    \ expression is broken down into multiple lines, making it easier to read and\
    \ understand each condition. In the bad example, the entire expression is on a\
    \ single line, which can be hard to read and debug.\n\n<Memo>\nBreaking down long\
    \ conditional expressions is not only a good practice in JavaScript but also in\
    \ other programming languages. It helps in maintaining the code and makes it easier\
    \ for others to understand the logic.\n</Memo>\n\n72\n\n# Use temporary variables\
    \ to hold intermediate results in expressions.\n\nStore intermediate results in\
    \ temporary variables to simplify complex expressions and improve readability.\n\
    \nComplex expressions can be simplified by storing intermediate results in temporary\
    \ variables. This makes the code easier to read and debug.\n\n<Good Code>\n```javascript\n\
    // Good example: using temporary variables for intermediate results\nconst isUserActive\
    \ = user.isActive;\nconst isUserVerified = user.isVerified;\nconst hasValidSubscription\
    \ = user.hasSubscription && user.subscription.isValid;\nif (isUserActive && isUserVerified\
    \ && hasValidSubscription) {\n    // Perform some action\n    console.log(\"User\
    \ is active, verified, and has a valid subscription.\");\n}\n```\n</Good Code>\n\
    \n<Bad Code>\n```javascript\n// Bad example: complex expression without temporary\
    \ variables\nif (user.isActive && user.isVerified && user.hasSubscription && user.subscription.isValid)\
    \ {\n    // Perform some action\n    console.log(\"User is active, verified, and\
    \ has a valid subscription.\");\n}\n```\n</Bad Code>\n\nIn the good example, intermediate\
    \ results are stored in temporary variables, making the final conditional expression\
    \ simpler and more readable. In the bad example, the complex expression is written\
    \ directly in the conditional statement, which can be harder to read and maintain.\n\
    \n<Memo>\nUsing temporary variables not only improves readability but also can\
    \ help in debugging by allowing you to log intermediate results and understand\
    \ where the logic might be failing.\n</Memo>\n\n73\n\n# Refactor complex expressions\
    \ into helper functions.\n\nSimplify complex expressions by breaking them into\
    \ smaller, reusable helper functions.\n\nComplex expressions can be difficult\
    \ to read and maintain. Refactoring them into helper functions improves readability\
    \ and reusability.\n\n<Good Code>\n```javascript\n// Helper function to calculate\
    \ discount\nfunction calculateDiscount(price, discountRate) {\n    return price\
    \ * (discountRate / 100);\n}\n\n// Main function using the helper function\nfunction\
    \ getTotalPrice(price, discountRate) {\n    const discount = calculateDiscount(price,\
    \ discountRate);\n    return price - discount;\n}\n\nconst price = 100;\nconst\
    \ discountRate = 10;\nconsole.log(getTotalPrice(price, discountRate)); // Outputs:\
    \ 90\n```\n</Good Code>\n\n<Bad Code>\n```javascript\n// Complex expression directly\
    \ in the main function\nfunction getTotalPrice(price, discountRate) {\n    return\
    \ price - (price * (discountRate / 100));\n}\n\nconst price = 100;\nconst discountRate\
    \ = 10;\nconsole.log(getTotalPrice(price, discountRate)); // Outputs: 90\n```\n\
    </Bad Code>\n\nIn the good example, the complex discount calculation is refactored\
    \ into a helper function `calculateDiscount`, making the main function `getTotalPrice`\
    \ easier to read and understand. In the bad example, the complex expression is\
    \ embedded directly in the main function, making it harder to read and maintain.\n\
    \n<Memo>\nRefactoring complex expressions into helper functions not only improves\
    \ readability but also makes it easier to test individual parts of your code.\n\
    </Memo>\n\n74\n\n# Avoid chaining multiple ternary operators.\n\nUse `if-else`\
    \ statements instead of chaining multiple ternary operators for better readability.\n\
    \nChaining multiple ternary operators can make code difficult to read and understand.\
    \ Using `if-else` statements can improve clarity.\n\n<Good Code>\n```javascript\n\
    // Using if-else statements for clarity\nfunction getStatusMessage(status) {\n\
    \    if (status === 'success') {\n        return 'Operation was successful.';\n\
    \    } else if (status === 'error') {\n        return 'There was an error.';\n\
    \    } else if (status === 'loading') {\n        return 'Loading...';\n    } else\
    \ {\n        return 'Unknown status.';\n    }\n}\n```\n</Good Code>\n"
