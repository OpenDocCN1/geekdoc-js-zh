    \ `map` 和 `filter` 使代码更具声明性且更容易理解。\n\n**备忘**\n`map` 和 `filter` 方法是 ECMAScript\
    \ 5.1 (ES5) 标准的一部分，该标准于 2011 年发布。它们现在是 JavaScript 函数式编程的基础工具。\n\n## 21. 为复杂函数或代码块注释其目的。\n\
    \n添加注释来解释复杂函数或代码块的目的，有助于他人理解代码的意图和功能。\n\n在编写复杂函数或代码块时，包含描述其目的的注释至关重要。这种做法有助于代码的维护和调试。\n\
    \n### 好的代码\n```javascript\n// This function calculates the factorial of a number\
    \ using recursion\nfunction factorial(n) {\n    // Base case: if n is 0, return\
    \ 1\n    if (n === 0) {\n        return 1;\n    }\n    // Recursive case: n *\
    \ factorial of (n-1)\n    return n * factorial(n - 1);\n}\n```\n\n### 糟糕的代码\n\
    ```javascript\nfunction factorial(n) {\n    if (n === 0) {\n        return 1;\n\
    \    }\n    return n * factorial(n - 1);\n}\n```\n\n在好的示例中，注释清晰地解释了函数的目的以及基础情况（base\
    \ case）和递归情况（recursive case）背后的逻辑。这使得代码更容易理解和维护。在糟糕的示例中，缺乏注释使得他人难以把握函数的意图和逻辑。\n\
    \n**备忘**\n为复杂代码编写注释是软件开发中的最佳实践，并且在编码标准和指南中经常被强调。\n\n## 22. 在注释中解释非显而易见的代码逻辑。\n\
    \n使用注释来阐明代码中非显而易见或棘手的部分，以帮助他人理解逻辑。\n\n当代码逻辑不能立即被看清时，添加注释来解释推理过程或方法可以防止在未来的维护过程中产生混淆和错误。\n\
    \n### 好的代码\n```javascript\n// Check if the user is an admin or has a premium account\n\
    function hasAccess(user) {\n    // Admins have full access\n    if (user.role\
    \ === 'admin') {\n        return true;\n    }\n    // Premium users have access\
    \ if their subscription is active\n    if (user.subscription === 'premium' &&\
    \ user.isActive) {\n        return true;\n    }\n    // All other users do not\
    \ have access\n    return false;\n}\n```\n\n### 糟糕的代码\n```javascript\nfunction\
    \ hasAccess(user) {\n    if (user.role === 'admin') {\n        return true;\n\
    \    }\n    if (user.subscription === 'premium' && user.isActive) {\n        return\
    \ true;\n    }\n    return false;\n}\n```\n\n在好的示例中，注释解释了每个条件背后的逻辑，明确了为什么某些用户拥有访问权限。这有助于其他开发人员理解决策过程。在糟糕的示例中，缺乏注释使得逻辑容易被误解，从而导致错误或错误的假设。\n\
    \n**备忘**\n清晰简洁的注释可以显著减少代码审查和调试所需的时间，从而提高开发效率。\n\n## 23. 为函数的预期输入和输出编写文档。\n\n清晰地记录函数的预期输入参数和输出结果。\n\
    \n为函数的预期输入和输出提供清晰的文档，有助于其他开发人员了解如何正确使用该函数以及对其结果的预期。\n\n### 好的代码\n```javascript\n\
    /**\n* Calculates the sum of two numbers.\n* @param {number} a - The first number.\n\
    * @param {number} b - The second number.\n* @returns {number} The sum of the two\
    \ numbers.\n*/\nfunction add(a, b) {\n    return a + b;\n}\n```\n\n### 糟糕的代码\n\
    ```javascript\nfunction add(a, b) {\n    return a + b;\n}\n```\n\n在好的示例中，函数 `add`\
    \ 使用注释进行了记录，将输入参数 `a` 和 `b` 描述为数字，将输出描述为数字。这向其他开发人员明确了函数需要什么以及返回什么。在糟糕的示例中，没有文档，使得他人难以理解函数的目的和用法。\n\
    \n**备忘**\n使用 JSDoc 注释是 JavaScript 中的常见做法，用于为函数、类和方法提供详细文档。它有助于自动生成 API 文档。\n\n\
    ## 24. 用注释标出临时的权宜之计。\n\n使用注释来标出代码中任何临时的权宜之计（workarounds）或黑客技巧（hacks）。\n\n"
- fmt: "\nWhen you implement a temporary workaround or hack, it's important to leave\
    \ a comment explaining why it's there and what needs to be done to replace it\
    \ in the future.\n\n### Good Code\n```javascript\n// Temporary workaround for\
    \ issue #123\n// This is a hack to bypass the bug in the third-party library.\n\
    // TODO: Remove this once the library is updated.\nfunction fetchData() {\n  \
    \  // Hack: Manually setting the timeout to avoid the bug\n    setTimeout(() =>\
    \ {\n        // Original code\n        console.log('Fetching data...');\n    },\
    \ 1000);\n}\n```\n\n### Bad Code\n```javascript\nfunction fetchData() {\n    setTimeout(()\
    \ => {\n        console.log('Fetching data...');\n    }, 1000);\n}\n```\n\nIn\
    \ the good example, the comment clearly indicates that the `setTimeout` is a temporary\
    \ workaround for a known issue (#123) and includes a `TODO` note to remove it\
    \ once the issue is resolved. This helps other developers understand the context\
    \ and the temporary nature of the code. In the bad example, there is no comment,\
    \ leaving other developers unaware of the reason behind the `setTimeout` and the\
    \ potential need to revisit this code.\n\n**Memo:** Using `TODO` comments is a\
    \ good practice to keep track of temporary solutions and ensure they are addressed\
    \ in future updates. Many code editors and IDEs can highlight `TODO` comments,\
    \ making them easier to find.\n\n# Use comments to indicate important sections\
    \ of code.\n\nComments help to highlight and explain significant parts of the\
    \ code. Using comments to mark important sections makes the code easier to navigate\
    \ and understand.\n\n### Good Code\n```javascript\n// Initialize variables\nlet\
    \ total = 0;\nlet count = 0;\n\n// Loop through array\nfor (let i = 0; i < numbers.length;\
    \ i++) {\n  total += numbers[i];\n  count++;\n}\n\n// Calculate average\nlet average\
    \ = total / count;\nconsole.log(average);\n```\n\n### Bad Code\n```javascript\n\
    let total = 0;\nlet count = 0;\nfor (let i = 0; i < numbers.length; i++) {\n \
    \ total += numbers[i];\n  count++;\n}\nlet average = total / count;\nconsole.log(average);\n\
    ```\n\nIn the good example, comments clearly indicate the purpose of each section,\
    \ making it easier for others to follow the logic. The bad example lacks comments,\
    \ making it harder to understand the structure and purpose of the code.\n\n**Memo:**\
    \ Comments do not affect the execution of the code but are crucial for maintaining\
    \ and understanding the codebase, especially in collaborative environments.\n\n\
    # Keep comments concise and to the point.\n\nComments should be brief and directly\
    \ related to the code they describe. Concise comments prevent clutter and ensure\
    \ that the code remains readable and maintainable.\n\n### Good Code\n```javascript\n\
    // Sum the values in the array\nlet sum = numbers.reduce((acc, num) => acc + num,\
    \ 0);\n// Output the result\nconsole.log(sum);\n```\n\n### Bad Code\n```javascript\n\
    // This is a loop that goes through each element in the array called numbers and\
    \ adds each element to the accumulator, which starts at 0, and then it returns\
    \ the total sum of all the elements in the array\nlet sum = numbers.reduce((acc,\
    \ num) => acc + num, 0);\n// This line prints the sum to the console\nconsole.log(sum);\n\
    ```\n\nThe good example uses short, clear comments that directly explain the code's\
    \ purpose. The bad example has overly verbose comments that add unnecessary detail,\
    \ making the code harder to read.\n\n**Memo:** Excessive commenting can be as\
    \ detrimental as no commenting. Aim for a balance where comments add value without\
    \ overwhelming the reader.\n\n# Update comments when code changes to maintain\
    \ accuracy.\n\nAlways update comments to reflect changes in the code to ensure\
    \ they remain accurate and helpful. When you modify your code, it's crucial to\
    \ update the associated comments to prevent misinformation and confusion for future\
    \ readers.\n\n### Good Code\n```javascript\n// Calculate the area of a rectangle\n\
    function calculateArea(width, height) {\n    return width * height; // Area =\
    \ width * height\n}\n\n// Updated to include validation\n// Calculate the area\
    \ of a rectangle with validation\nfunction calculateArea(width, height) {\n  \
    \  if (width <= 0 || height <= 0) {\n        throw new Error('Width and height\
    \ must be positive numbers');\n    }\n    return width * height; // Area = width\
    \ * height\n}\n```\n\n### Bad Code\n```javascript\n// Calculate the area of a\
    \ rectangle\nfunction calculateArea(width, height) {\n    return width * height;\
    \ // Area = width * height\n}\n\n// Updated to include validation, but comment\
    \ not updated\nfunction calculateArea(width, height) {\n    if (width <= 0 ||\
    \ height <= 0) {\n        throw new Error('Width and height must be positive numbers');\n\
    \    }\n    return width * height; // Area = width * height\n}\n```\n\nIn the\
    \ good example, the comment is updated to reflect the new validation logic, ensuring\
    \ that anyone reading the code understands the current functionality. In the bad\
    \ example, the comment remains outdated, which can mislead readers about the code's\
    \ behavior.\n\n**Memo:** Consistently updating comments helps maintain code quality\
    \ and reduces the risk of bugs caused by misunderstandings of the code's purpose\
    \ and functionality.\n\n# Avoid redundant comments that state the obvious.\n\n\
    Avoid writing comments that simply restate what the code is doing, as they add\
    \ no value and clutter the code. Comments should provide additional context or\
    \ explanations that are not immediately clear from the code itself, rather than\
    \ stating the obvious.\n\n### Good Code\n```javascript\n// Calculate the area\
    \ of a rectangle\nfunction calculateArea(width, height) {\n    return width *\
    \ height; // Area = width * height\n}\n\n// Check if the user is an adult\nfunction\
    \ isAdult(age) {\n    return age >= 18; // Returns true if age is 18 or older\n\
    }\n```\n\n### Bad Code\n```javascript\n// This function calculates the area of\
    \ a rectangle\nfunction calculateArea(width, height) {\n    return width * height;\
    \ // This returns the area\n}\n\n// This function checks if the user is an adult\n\
    function isAdult(age) {\n    return age >= 18; // This returns true if the age\
    \ is 18 or older\n}\n```\n\nIn the good example, comments provide meaningful context\
    \ that complements the code. In the bad example, comments are redundant and merely\
    \ restate what the code already clearly expresses, adding unnecessary clutter.\n\
    \n**Memo:** Effective comments should enhance the readability of the code by providing\
    \ insights that are not immediately obvious, rather than repeating what the code\
    \ already conveys.\n\n# Use comments to explain the why, not the what.\n\nComments\
    \ should provide context and reasoning behind the code, not just describe what\
    \ the code does.\n\n### Good Code\n```javascript\n// Calculate the total price\
    \ after discount\n// This is necessary to provide a better deal for loyal customers\n\
    function calculateTotalPrice(price, discount) {\n    return price - (price * discount);\n\
    }\n```\n\n### Bad Code\n```javascript\n// Subtract discount from price\nfunction\
    \ calculateTotalPrice(price, discount) {\n    return price - (price * discount);\n\
    }\n```\n\nIn the good example, the comment explains the reason for calculating\
    \ the total price after discount, providing context for future readers. In the\
    \ bad example, the comment merely describes what the code does, which is already\
    \ clear from the code itself.\n\n**Memo:** Effective comments can significantly\
    \ improve code maintainability and help new developers understand the codebase\
    \ more quickly.\n\n# Write comments in proper English with correct grammar.\n\n\
    Comments should be written in clear, proper English with correct grammar to ensure\
    \ they are easily understood by all readers.\n\n### Good Code\n```javascript\n\
    // Calculate the total price after applying the discount.\n// This ensures that\
    \ loyal customers receive the best possible deal.\nfunction calculateTotalPrice(price,\
    \ discount) {\n    return price - (price * discount);\n}\n```\n\n### Bad Code\n\
    ```javascript\n// calc total price after discount\n```\n"
