    # Break down functions that do multiple things into smaller ones.


    * * *


    Simplify functions by breaking them into smaller, single-purpose functions.


    * * *


    When functions try to accomplish too much, they become hard to read, understand,
    and maintain. Breaking them into smaller functions improves clarity and reusability.


    < Good Code >


    // Good example: Functions are broken down into smaller, single-purpose ones.


    function getUserData(userId) {


        // Fetch user data


        return fetch(`/api/user/${userId}`)


            .then(response => response.json());


    }


    function renderUserData(userData) {


        // Render user data to the UI


        const userDiv = document.getElementById(''user'');


        userDiv.innerHTML = `<h2>${userData.name}</h2><p>${userData.email}</p>`;


    }


    function loadUser(userId) {


        getUserData(userId)


            .then(userData => {


                renderUserData(userData);


            });


    }


    <Bad Code>


    // Bad example: Single function does too much.


    function loadUser(userId) {


        // Fetch user data


        fetch(`/api/user/${userId}`)


            .then(response => response.json())


            .then(userData => {


                // Render user data to the UI


                const userDiv = document.getElementById(''user'');


                userDiv.innerHTML = `<h2>${userData.name}</h2><p>${userData.email}</p>`;


            });


    }


    In the good example, getUserData and renderUserData are single-purpose functions.
    loadUser coordinates these smaller functions, making the code easier to understand
    and maintain. In the bad example, one function does both data fetching and rendering,
    making it harder to read and modify.


    <Memo>


    The Single Responsibility Principle (SRP) is a fundamental concept in software
    engineering that states that a function or class should have only one reason to
    change, which is achieved by making functions do just one thing.


    62


    # Separate concerns by dividing code into modules.


    * * *


    Organize code by dividing it into modules, each responsible for a specific part
    of the functionality.


    * * *


    Separating concerns means dividing your code into distinct sections (modules),
    each handling a specific aspect of the application. This enhances code maintainability,
    reusability, and readability.


    < Good Code >


    // Good example: Code is divided into modules.


    // userData.js


    export function getUserData(userId) {


        return fetch(`/api/user/${userId}`)


            .then(response => response.json());


    }


    // render.js


    export function renderUserData(userData) {


        const userDiv = document.getElementById(''user'');


        userDiv.innerHTML = `<h2>${userData.name}</h2><p>${userData.email}</p>`;


    }


    // main.js


    import { getUserData } from ''./userData.js'';


    import { renderUserData } from ''./render.js'';


    function loadUser(userId) {


        getUserData(userId)


            .then(userData => {


                renderUserData(userData);


            });


    }


    <Bad Code>


    // Bad example: All code in a single file.


    function loadUser(userId) {


        // Fetch user data


        fetch(`/api/user/${userId}`)


            .then(response => response.json())


            .then(userData => {


                // Render user data to the UI


                const userDiv = document.getElementById(''user'');


                userDiv.innerHTML = `<h2>${userData.name}</h2><p>${userData.email}</p>`;


            });


    }


    In the good example, functionality is split into different modules (userData.js,
    render.js, and main.js). This makes the codebase more modular and easier to manage.
    The bad example keeps all functionality in one place, making it harder to maintain
    and scale.


