  trans: "\n\n使用对象存储键值对可以使代码更有序且更易读。它将相关数据分组在一起，便于管理和访问。相比之下，为每条数据使用单独的变量会导致代码库杂乱且难以维护。\n\
    \n<Memo>\n\nJavaScript 中的对象是无序的键值对集合，其中键是字符串或符号，值可以是任何类型。\n\n88\n\n# 当需要有序的键值对时，选择\
    \ `Map`\n\n* * *\n\n`Map` 维护键值对的顺序，并允许使用任何类型的键。\n\n* * *\n\n当键值对的顺序很重要，或者需要使用非字符串键时，使用\
    \ `Map` 比使用对象更合适。\n\n< Good Code >\n\n```javascript\n// 好例子：使用 Map 存储有序的键值对\n\
    const userMap = new Map();\nuserMap.set('name', 'John Doe');\nuserMap.set('age',\
    \ 30);\nuserMap.set('email', 'john.doe@example.com');\n\n// 访问值\nconsole.log(userMap.get('name'));\
    \ // 输出: John Doe\nconsole.log(userMap.get('age'));  // 输出: 30\n```\n\n<Bad Code>\n\
    \n```javascript\n// 坏例子：在顺序重要时使用对象\nconst user = {\n  name: 'John Doe',\n  age:\
    \ 30,\n  email: 'john.doe@example.com'\n};\n\n// 访问值（顺序无法保证）\nconsole.log(user.name);\
    \ // 输出: John Doe\nconsole.log(user.age);  // 输出: 30\n```\n\n`Map` 维护键值对的插入顺序，这在某些应用中至关重要。它们还允许使用任何类型的键，而不仅仅是字符串。这使得\
    \ `Map` 在处理有序数据或非字符串键时比对象更灵活。\n\n<Memo>\n\n`Map` 是 ES6（ECMAScript 2015）规范的一部分，在频繁添加和删除键值对时，其性能优于对象。\n\
    \n89\n\n# 使用 `Set` 存储唯一值，避免重复\n\n* * *\n\n使用 `Set` 对象存储唯一值，确保没有重复项。\n\n* * *\n\
    \nJavaScript 中的 `Set` 对象允许你存储任何类型的唯一值，无论是原始值还是对象引用。当你需要确保集合中不包含重复项时，这尤其有用。\n\n\
    < Good Code >\n\n```javascript\n// 使用 Set 存储唯一值\nconst numbers = [1, 2, 2, 3,\
    \ 4, 4, 5];\nconst uniqueNumbers = new Set(numbers);\nconsole.log(uniqueNumbers);\
    \ // 输出: Set { 1, 2, 3, 4, 5 }\n```\n\n<Bad Code>\n\n```javascript\n// 使用数组存储唯一值（效率低）\n\
    const numbers = [1, 2, 2, 3, 4, 4, 5];\nconst uniqueNumbers = [];\nnumbers.forEach((num)\
    \ => {\n  if (!uniqueNumbers.includes(num)) {\n    uniqueNumbers.push(num);\n\
    \  }\n});\nconsole.log(uniqueNumbers); // 输出: [1, 2, 3, 4, 5]\n```\n\n好例子使用 `Set`\
    \ 自动处理重复项，使代码更简洁高效。坏例子手动使用数组检查重复项，效率较低且代码冗长。\n\n<Memo>\n\n`Set` 对象在 ECMAScript\
    \ 2015（ES6）中引入，相比传统数组，它提供了一种更高效的方式来处理唯一值集合。\n\n90\n\n# 优先使用 `WeakMap` 和 `WeakSet`\
    \ 以高效管理内存\n\n* * *\n\n使用 `WeakMap` 和 `WeakSet` 通过允许垃圾回收未使用的对象来高效管理内存。\n\n* * *\n\
    \n`WeakMap` 和 `WeakSet` 类似于 `Map` 和 `Set`，但它们通过持有对象的“弱”引用来实现高效的内存管理。这意味着如果存储在\
    \ `WeakMap` 或 `WeakSet` 中的对象没有其他引用，它就可以被垃圾回收。\n\n< Good Code >\n\n```javascript\n\
    // 使用 WeakMap 高效管理内存\nlet obj = { name: 'John' };\nconst weakMap = new WeakMap();\n\
    weakMap.set(obj, 'some value');\n\n// 之后，如果不再需要 obj\nobj = null; // obj 可以被垃圾回收\n\
    // weakMap 不再持有对 obj 的强引用\n```\n\n<Bad Code >\n\n```javascript\n// 使用 Map 持有强引用\n\
    let obj = { name: 'John' };\nconst map = new Map();\nmap.set(obj, 'some value');\n\
    \n// 之后，如果不再需要 obj\nobj = null; // obj 无法被垃圾回收，因为 map 持有强引用\n// map 仍然持有对 obj\
    \ 的强引用\n```\n\n好例子使用 `WeakMap`，允许对象在不再需要时被垃圾回收，从而更高效地管理内存。坏例子使用 `Map`，它持有对对象的强引用，阻止了垃圾回收。\n\
    \n<Memo>\n\n`WeakMap` 和 `WeakSet` 在 ECMAScript 2015（ES6）中引入，特别适用于希望将数据与对象关联而不阻止其垃圾回收的场景。\n\
    \n91\n\n# 使用 `try`/`catch` 块处理异常\n\n* * *\n\n使用 `try`/`catch` 块有助于优雅地管理错误，确保程序能够处理意外情况而不会崩溃。\n\
    \n* * *\n\n在 JavaScript 代码中实现 `try`/`catch` 块可以让你捕获并处理异常，从而提供一种管理错误并维持程序流程的方式。\n\
    \n< Good Code >\n\n```javascript\ntry {\n  // 尝试解析 JSON\n  let data = JSON.parse(jsonString);\n\
    \  console.log(data);\n} catch (error) {\n  // 处理错误\n  console.error(\"解析 JSON\
    \ 失败:\", error.message);\n}\n```\n\n<Bad Code>\n\n```javascript\n// 尝试解析 JSON\
    \ 但没有错误处理\nlet data = JSON.parse(jsonString);\nconsole.log(data);\n```\n\n在好例子中，`try`/`catch`\
    \ 块用于处理 JSON 解析过程中可能发生的任何错误。如果发生错误，它会被捕获并记录，防止程序崩溃。在坏例子中，没有错误处理，因此如果 JSON 解析失败，程序将抛出未捕获的异常并可能崩溃。\n\
    \n<Memo>\n\nJavaScript 在 ECMAScript 3 中引入了 `try`/`catch` 块，使开发者更容易处理运行时错误并提高代码的健壮性。\n\
    \n92\n\n# 提供有意义的错误信息\n\n* * *\n\n有意义的错误信息有助于开发者理解出了什么问题以及如何修复，从而提高代码的可维护性和调试效率。\n\
    \n* * *\n\n在处理错误时，提供清晰且信息丰富的错误消息可以显著帮助快速诊断和解决问题。\n\n< Good Code >\n\n```javascript\n\
    try {\n  // 尝试访问未定义对象的属性\n  let value = obj.property;\n} catch (error) {\n  //\
    \ 提供有意义的错误信息\n  console.error(\"访问属性时出错：对象 'obj' 未定义。\");\n}\n```\n\n<Bad Code>\n\
    \n```javascript\ntry {\n  // 尝试访问未定义对象的属性\n  let value = obj.property;\n} catch\
    \ (error) {\n  // 提供通用的错误信息\n  console.error(\"发生了一个错误。\");\n}\n```\n\n在好例子中，错误消息清楚地说明了问题所在，并提供了关于未定义对象的上下文。这有助于开发者快速识别并修复问题。在坏例子中，通用的错误消息没有提供任何有用信息，使得诊断问题更加困难。\n\
    \n<Memo>\n\n提供有意义的错误信息是软件开发中的最佳实践，对于有效的调试和维护至关重要。在大型代码库和协作项目中尤其重要。\n\n93\n\n#\
    \ 将错误记录到控制台或日志服务\n\n* * *\n\n始终将错误记录到控制台或日志服务，以帮助调试和监控。\n\n* * *\n\n记录错误有助于开发者理解出了什么问题以及在哪里发生。这对于调试和维护代码质量至关重要。\n\
    \n< Good Code >\n\n```javascript\ntry {\n  // 可能抛出错误的代码\n  let result = riskyOperation();\n\
    } catch (error) {\n  console.error('发生了一个错误:', error); // 将错误记录到控制台\n  // 可选：将错误发送到日志服务\n\
    \  sendErrorToLoggingService(error);\n}\n```\n\n<Bad Code>\n\n```javascript\n\
    try {\n  // 可能抛出错误的代码\n  let result = riskyOperation();\n} catch (error) {\n \
    \ // 对错误不做任何处理\n}\n```\n\n在好例子中，错误被记录到控制台，并可选择发送到日志服务，从而更容易诊断问题。在坏例子中，错误被捕获但没有记录，导致难以理解发生了什么问题。\n\
    \n<Memo>\n\n"
- fmt: "\n# 94 Gracefully handle rejected promises with .catch.\n\n---\n\nAlways handle\
    \ rejected promises using the `.catch` method to prevent unhandled promise rejections.\n\
    \nHandling rejected promises ensures that errors are managed properly, preventing\
    \ unexpected crashes and improving code reliability.\n\n< Good Code >\n\n```javascript\n\
    fetch('https://api.example.com/data')\n  .then(response => response.json())\n\
    \  .then(data => {\n    console.log('Data received:', data);\n  })\n  .catch(error\
    \ => {\n    console.error('Failed to fetch data:', error); // Handles the rejected\
    \ promise\n  });\n```\n\n<Bad Code>\n\n```javascript\nfetch('https://api.example.com/data')\n\
    \  .then(response => response.json())\n  .then(data => {\n    console.log('Data\
    \ received:', data);\n  });\n// No .catch to handle potential errors\n```\n\n\
    In the good example, the `.catch` method is used to handle any errors that occur\
    \ during the fetch operation, ensuring that the error is logged and can be addressed.\
    \ In the bad example, there is no `.catch` method, so any errors will result in\
    \ unhandled promise rejections, which can lead to application crashes.\n\n<Memo>\n\
    \nUnhandled promise rejections can be caught globally in Node.js using the `process.on('unhandledRejection',\
    \ handler)` event, but it is better practice to handle them locally with `.catch`.\n\
    \n# 95 Validate function inputs to prevent errors.\n\n---\n\nEnsure that function\
    \ inputs are validated to avoid unexpected errors and improve code reliability.\n\
    \nValidating inputs in functions helps catch errors early and ensures that the\
    \ function behaves as expected. This practice is crucial for maintaining robust\
    \ and error-free code.\n\n< Good Code >\n\n```javascript\n// Function to add two\
    \ numbers with input validation\nfunction add(a, b) {\n  if (typeof a !== 'number'\
    \ || typeof b !== 'number') {\n    throw new Error('Both arguments must be numbers');\n\
    \  }\n  return a + b;\n}\n\ntry {\n  console.log(add(2, 3)); // 5\n  console.log(add(2,\
    \ '3')); // Error: Both arguments must be numbers\n} catch (e) {\n  console.error(e.message);\n\
    }\n```\n\n<Bad Code>\n\n```javascript\n// Function to add two numbers without\
    \ input validation\nfunction add(a, b) {\n  return a + b;\n}\n\nconsole.log(add(2,\
    \ 3)); // 5\nconsole.log(add(2, '3')); // '23' (unexpected result)\n```\n\nIn\
    \ the good example, the function checks if the inputs are numbers and throws an\
    \ error if they are not. This prevents unexpected behavior and makes the code\
    \ more robust. In the bad example, the function does not validate inputs, leading\
    \ to potential errors and unexpected results.\n\n<Memo>\n\nInput validation is\
    \ a common practice in many programming languages and is essential for writing\
    \ secure and reliable code. It helps prevent bugs and security vulnerabilities\
    \ by ensuring that inputs meet the expected criteria.\n\n# 96 Write modular code\
    \ that can be reused in different projects.\n\n---\n\nCreate modular code by breaking\
    \ down functionality into small, reusable functions or modules.\n\nModular code\
    \ is easier to maintain, test, and reuse across different projects. By encapsulating\
    \ functionality into small, independent units, you can improve code organization\
    \ and reduce duplication.\n\n< Good Code >\n\n```javascript\n// Utility module\
    \ for mathematical operations\nconst MathUtils = {\n  add: function(a, b) {\n\
    \    return a + b;\n  },\n  subtract: function(a, b) {\n    return a - b;\n  }\n\
    };\n\n// Using the utility module in different parts of the project\nconsole.log(MathUtils.add(5,\
    \ 3)); // 8\nconsole.log(MathUtils.subtract(5, 3)); // 2\n```\n\n<Bad Code>\n\n\
    ```javascript\n// Non-modular code with repeated logic\nfunction add(a, b) {\n\
    \  return a + b;\n}\n\nfunction subtract(a, b) {\n  return a - b;\n}\n\n// Repeating\
    \ the same logic in different parts of the project\nconsole.log(add(5, 3)); //\
    \ 8\nconsole.log(subtract(5, 3)); // 2\nconsole.log(add(10, 7)); // 17\nconsole.log(subtract(10,\
    \ 7)); // 3\n```\n\nIn the good example, mathematical operations are encapsulated\
    \ in a utility module, making the code reusable and easier to manage. In the bad\
    \ example, the same logic is repeated in different parts of the project, leading\
    \ to code duplication and making maintenance more difficult.\n\n<Memo>\n\nModular\
    \ programming is a software design technique that emphasizes separating functionality\
    \ into independent, interchangeable modules. This approach is widely used in modern\
    \ software development to enhance code maintainability and scalability.\n\n# 97\
    \ Use higher-order functions to create reusable function patterns.\n\n---\n\n\
    Higher-order functions are functions that take other functions as arguments or\
    \ return them as results, enabling reusable and modular code.\n\nHigher-order\
    \ functions can simplify code by abstracting common patterns, making it more readable\
    \ and maintainable.\n\n< Good Code >\n\n```javascript\n// Higher-order function\
    \ that takes a function and a value, and applies the function to the value\nfunction\
    \ applyFunction(fn, value) {\n  return fn(value);\n}\n\n// Example functions to\
    \ be used with the higher-order function\nfunction double(x) {\n  return x * 2;\n\
    }\n\nfunction square(x) {\n  return x * x;\n}\n\n// Using the higher-order function\n\
    console.log(applyFunction(double, 5)); // 10\nconsole.log(applyFunction(square,\
    \ 5)); // 25\n```\n\n<Bad Code>\n\n```javascript\n// Repeating similar code without\
    \ using higher-order functions\nfunction double(x) {\n  return x * 2;\n}\n\nfunction\
    \ square(x) {\n  return x * x;\n}\n\nfunction applyDouble(value) {\n  return double(value);\n\
    }\n\nfunction applySquare(value) {\n  return square(value);\n}\n\nconsole.log(applyDouble(5));\
    \ // 10\nconsole.log(applySquare(5)); // 25\n```\n\nThe good example uses a higher-order\
    \ function `applyFunction` to apply different functions (`double` and `square`)\
    \ to a value, making the code more reusable and concise. The bad example repeats\
    \ similar code for each function application, making it less maintainable.\n\n\
    <Memo>\n\nJavaScript's built-in array methods like `map`, `filter`, and `reduce`\
    \ are examples of higher-order functions.\n\n# 98 Employ mixins for reusing code\
    \ in multiple classes.\n\n---\n\nMixins are a way to include reusable code in\
    \ multiple classes without using inheritance.\n\nMixins allow you to share functionality\
    \ between classes by copying methods from one object to another, promoting code\
    \ reuse and reducing duplication.\n\n< Good Code >\n\n```javascript\n// Mixin\
    \ for reusable methods\nconst canEat = {\n  eat: function() {\n    console.log('Eating...');\n\
    \  }\n};\n\nconst canWalk = {\n  walk: function() {\n    console.log('Walking...');\n\
    \  }\n};\n\n// Class that uses mixins\nclass Person {\n  constructor(name) {\n\
    \    this.name = name;\n  }\n}\n\n// Copy methods from mixins to the class prototype\n\
    Object.assign(Person.prototype, canEat, canWalk);\n\nconst person = new Person('John');\n\
    person.eat(); // Eating...\nperson.walk(); // Walking...\n```\n\n<Bad Code>\n\n\
    ```javascript\n// Repeating similar methods in multiple classes without using\
    \ mixins\nclass Person {\n  constructor(name) {\n    this.name = name;\n  }\n\
    \  eat() {\n    console.log('Eating...');\n  }\n  walk() {\n    console.log('Walking...');\n\
    \  }\n}\n\nclass Animal {\n  constructor(type) {\n    this.type = type;\n  }\n\
    \  eat() {\n    console.log('Eating...');\n  }\n  walk() {\n    console.log('Walking...');\n\
    \  }\n}\n\nconst person = new Person('John');\nperson.eat(); // Eating...\nperson.walk();\
    \ // Walking...\n\nconst animal = new Animal('Dog');\nanimal.eat(); // Eating...\n\
    animal.walk(); // Walking...\n```\n\nIn the good example, mixins (`canEat` and\
    \ `canWalk`) are used to add reusable methods to the `Person` class, reducing\
    \ code duplication. The bad example repeats the same methods in multiple classes\
    \ (`Person` and `Animal`), making the code harder to maintain.\n\n<Memo>\n\nMixins\
    \ can be particularly useful in languages that do not support multiple inheritance,\
    \ like JavaScript.\n\n# 99 Use inheritance for extending existing classes\n\n\
    ---\n\nInheritance allows creating new classes based on existing ones, reusing\
    \ code and promoting modularity.\n\n"
  raw: 'Logging services like Sentry, Loggly, and Datadog can provide more advanced
    error tracking and alerting capabilities compared to simple console logging.


    94


    # Gracefully handle rejected promises with .catch.


    * * *


    Always handle rejected promises using the .catch method to prevent unhandled promise
    rejections.


    * * *


    Handling rejected promises ensures that errors are managed properly, preventing
    unexpected crashes and improving code reliability.


    < Good Code >


    fetch(''https://api.example.com/data'')


      .then(response => response.json())


      .then(data => {


        console.log(''Data received:'', data);


      })


      .catch(error => {


        console.error(''Failed to fetch data:'', error); // Handles the rejected promise


      });


    <Bad Code>


    fetch(''https://api.example.com/data'')


      .then(response => response.json())


      .then(data => {


        console.log(''Data received:'', data);


      });


    // No .catch to handle potential errors


    In the good example, the .catch method is used to handle any errors that occur
    during the fetch operation, ensuring that the error is logged and can be addressed.
    In the bad example, there is no .catch method, so any errors will result in unhandled
    promise rejections, which can lead to application crashes.


    <Memo>


    Unhandled promise rejections can be caught globally in Node.js using the process.on(''unhandledRejection'',
    handler) event, but it is better practice to handle them locally with .catch.


    95


    # Validate function inputs to prevent errors.


    * * *


    Ensure that function inputs are validated to avoid unexpected errors and improve
    code reliability.


    * * *


    Validating inputs in functions helps catch errors early and ensures that the function
    behaves as expected. This practice is crucial for maintaining robust and error-free
    code.


    < Good Code >


    // Function to add two numbers with input validation


    function add(a, b) {


      if (typeof a !== ''number'' || typeof b !== ''number'') {


        throw new Error(''Both arguments must be numbers'');


      }


      return a + b;


    }


    try {


      console.log(add(2, 3)); // 5


      console.log(add(2, ''3'')); // Error: Both arguments must be numbers


    } catch (e) {


      console.error(e.message);


    }


    <Bad Code>


    // Function to add two numbers without input validation


    function add(a, b) {


      return a + b;


    }


    console.log(add(2, 3)); // 5


    console.log(add(2, ''3'')); // ''23'' (unexpected result)


    In the good example, the function checks if the inputs are numbers and throws
    an error if they are not. This prevents unexpected behavior and makes the code
    more robust. In the bad example, the function does not validate inputs, leading
    to potential errors and unexpected results.


    <Memo>


    Input validation is a common practice in many programming languages and is essential
    for writing secure and reliable code. It helps prevent bugs and security vulnerabilities
    by ensuring that inputs meet the expected criteria.


    96


    # Write modular code that can be reused in different projects.


    * * *


    Create modular code by breaking down functionality into small, reusable functions
    or modules.


    * * *


    Modular code is easier to maintain, test, and reuse across different projects.
    By encapsulating functionality into small, independent units, you can improve
    code organization and reduce duplication.


    < Good Code >


    // Utility module for mathematical operations


    const MathUtils = {


      add: function(a, b) {


        return a + b;


      },


      subtract: function(a, b) {


        return a - b;


      }


    };


    // Using the utility module in different parts of the project


    console.log(MathUtils.add(5, 3)); // 8


    console.log(MathUtils.subtract(5, 3)); // 2


    <Bad Code>


    // Non-modular code with repeated logic


    function add(a, b) {


      return a + b;


    }


    function subtract(a, b) {


      return a - b;


    }


    // Repeating the same logic in different parts of the project


    console.log(add(5, 3)); // 8


    console.log(subtract(5, 3)); // 2


    console.log(add(10, 7)); // 17


    console.log(subtract(10, 7)); // 3


    In the good example, mathematical operations are encapsulated in a utility module,
    making the code reusable and easier to manage. In the bad example, the same logic
    is repeated in different parts of the project, leading to code duplication and
    making maintenance more difficult.


    <Memo>


    Modular programming is a software design technique that emphasizes separating
    functionality into independent, interchangeable modules. This approach is widely
    used in modern software development to enhance code maintainability and scalability.


    97


    # Use higher-order functions to create reusable function patterns.


    * * *


    Higher-order functions are functions that take other functions as arguments or
    return them as results, enabling reusable and modular code.


    * * *


    Higher-order functions can simplify code by abstracting common patterns, making
    it more readable and maintainable.


    < Good Code >


    // Higher-order function that takes a function and a value, and applies the function
    to the value


    function applyFunction(fn, value) {


      return fn(value);


    }


    // Example functions to be used with the higher-order function


    function double(x) {


      return x * 2;


    }


    function square(x) {


      return x * x;


    }


    // Using the higher-order function


    console.log(applyFunction(double, 5)); // 10


    console.log(applyFunction(square, 5)); // 25


    <Bad Code>


    // Repeating similar code without using higher-order functions


    function double(x) {


      return x * 2;


    }


    function square(x) {


      return x * x;


    }


    function applyDouble(value) {


      return double(value);


    }


    function applySquare(value) {


      return square(value);


    }


    console.log(applyDouble(5)); // 10


    console.log(applySquare(5)); // 25


    The good example uses a higher-order function applyFunction to apply different
    functions (double and square) to a value, making the code more reusable and concise.
    The bad example repeats similar code for each function application, making it
    less maintainable.


    <Memo>


    JavaScript''s built-in array methods like map, filter, and reduce are examples
    of higher-order functions.


    98


    # Employ mixins for reusing code in multiple classes.


    * * *


    Mixins are a way to include reusable code in multiple classes without using inheritance.


    * * *


    Mixins allow you to share functionality between classes by copying methods from
    one object to another, promoting code reuse and reducing duplication.


    < Good Code >


    // Mixin for reusable methods


    const canEat = {


      eat: function() {


        console.log(''Eating...'');


      }


    };


    const canWalk = {


      walk: function() {


        console.log(''Walking...'');


      }


    };


    // Class that uses mixins


    class Person {


      constructor(name) {


        this.name = name;


      }


    }


    // Copy methods from mixins to the class prototype


    Object.assign(Person.prototype, canEat, canWalk);


    const person = new Person(''John'');


    person.eat(); // Eating...


    person.walk(); // Walking...


    <Bad Code>


    // Repeating similar methods in multiple classes without using mixins


    class Person {


      constructor(name) {


        this.name = name;


      }


      eat() {


        console.log(''Eating...'');


      }


      walk() {


        console.log(''Walking...'');


      }


    }


    class Animal {


      constructor(type) {


        this.type = type;


      }


      eat() {


        console.log(''Eating...'');


      }


      walk() {


        console.log(''Walking...'');


      }


    }


    const person = new Person(''John'');


    person.eat(); // Eating...


    person.walk(); // Walking...


    const animal = new Animal(''Dog'');


    animal.eat(); // Eating...


    animal.walk(); // Walking...


    The good example uses mixins (canEat and canWalk) to add reusable methods to the
    Person class, reducing code duplication. The bad example repeats the same methods
    in multiple classes (Person and Animal), making the code harder to maintain.


    <Memo>


    Mixins can be particularly useful in languages that do not support multiple inheritance,
    like JavaScript.


    99


    # Use inheritance for extending existing classes


    * * *


    Inheritance allows creating new classes based on existing ones, reusing code and
    promoting modularity.


