    type


    function calculateArea(shape, width, height, radius) {


        if (shape === ''rectangle'') {


            return width * height;


        } else if (shape === ''circle'') {


            return Math.PI * radius * radius;


        }


        return 0;


    }


    In the good example, each function has a single responsibility, making it clear
    what each function does. In the bad example, the function tries to handle multiple
    shapes, making it more complex and harder to understand.


    <Memo>


    The Single Responsibility Principle (SRP) is one of the SOLID principles of object-oriented
    design, which states that a class or function should have only one reason to change.


    46


