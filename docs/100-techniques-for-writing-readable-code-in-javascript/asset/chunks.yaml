    # Leverage optional chaining to handle nested object properties.


    * * *


    Use optional chaining to safely access deeply nested object properties without
    causing errors.


    * * *


    Optional chaining allows you to access nested properties of an object without
    having to check each level for existence, making your code cleaner and more readable.


    < Good Code >


    // Good example using optional chaining


    const user = {


      profile: {


        address: {


          city: ''New York''


        }


      }


    };


    // Safely access nested property


    const city = user?.profile?.address?.city; // ''New York''


    <Bad Code>


    // Bad example without optional chaining


    const user = {


      profile: {


        address: {


          city: ''New York''


        }


      }


    };


    // Manually checking each level


    let city;


    if (user && user.profile && user.profile.address) {


      city = user.profile.address.city; // ''New York''


    }


    The good example uses optional chaining (?.) to access the nested property city
    safely. If any part of the chain is null or undefined, it will return undefined
    instead of throwing an error. The bad example manually checks each level, making
    the code verbose and harder to read.


    <Memo>


    Optional chaining was introduced in ECMAScript 2020 (ES11) and is now widely supported
    in modern JavaScript environments.


    20


    # Use Array.prototype.map and Array.prototype.filter for array transformations.


    * * *


    Utilize map and filter methods to transform and filter arrays in a concise and
    readable manner.


    * * *


    The map method creates a new array populated with the results of calling a provided
    function on every element in the calling array. The filter method creates a new
    array with all elements that pass the test implemented by the provided function.


    < Good Code >


    // Good example using map and filter


    const numbers = [1, 2, 3, 4, 5];


    // Double each number


    const doubled = numbers.map(num => num * 2); // [2, 4, 6, 8, 10]


    // Filter out odd numbers


    const evens = numbers.filter(num => num % 2 === 0); // [2, 4]


    <Bad Code>


    // Bad example using for loops


    const numbers = [1, 2, 3, 4, 5];


    // Double each number


    const doubled = [];


    for (let i = 0; i < numbers.length; i++) {


      doubled.push(numbers[i] * 2);


    }


    // Filter out odd numbers


    const evens = [];


    for (let i = 0; i < numbers.length; i++) {


      if (numbers[i] % 2 === 0) {


        evens.push(numbers[i]);


      }


    }


    The good example uses map and filter to transform and filter the array in a concise
    and readable way. The bad example uses for loops, which are more verbose and error-prone.
    Using map and filter makes the code more declarative and easier to understand.


    <Memo>


    The map and filter methods are part of the ECMAScript 5.1 (ES5) standard, which
    was released in 2011\. They are now fundamental tools for functional programming
    in JavaScript.


    21


    # Comment on the purpose of complex functions or blocks of code.


    * * *


    Adding comments to explain the purpose of complex functions or blocks of code
    helps others understand the code''s intent and functionality.


    * * *


    When writing complex functions or blocks of code, it''s crucial to include comments
    that describe their purpose. This practice aids in maintaining and debugging the
    code.


    < Good Code >


    // This function calculates the factorial of a number using recursion


    function factorial(n) {


        // Base case: if n is 0, return 1


        if (n === 0) {


            return 1;


        }


        // Recursive case: n * factorial of (n-1)


        return n * factorial(n - 1);


    }


    <Bad Code>


