    \ of the promises failed:', error);\n  });\n```\n\n### 差的代码\n```javascript\n//\
    \ Bad example without using Promise.all\nconst promise1 = fetch('https://api.example.com/data1');\n\
    const promise2 = fetch('https://api.example.com/data2');\nconst promise3 = fetch('https://api.example.com/data3');\n\
    \npromise1\n  .then(response1 => response1.json())\n  .then(data1 => {\n    console.log(data1);\n\
    \    return promise2;\n  })\n  .then(response2 => response2.json())\n  .then(data2\
    \ => {\n    console.log(data2);\n    return promise3;\n  })\n  .then(response3\
    \ => response3.json())\n  .then(data3 => {\n    console.log(data3);\n  })\n  .catch(error\
    \ => {\n    console.error('One of the promises failed:', error);\n  });\n```\n\
    \n好的示例使用 `Promise.all` 并发运行所有 `fetch` 请求，效率更高且代码更简洁。差的示例顺序执行 Promise，效率较低且难以阅读。\n\
    \n**备忘录**\n如果任何一个输入的 Promise 拒绝，`Promise.all` 会立即拒绝；只有当所有输入的 Promise 都解决时，它才会解决。\n\
    \n# 利用 Object.keys 和 Object.values 遍历对象。\n\n使用 `Object.keys` 和 `Object.values`\
    \ 高效地遍历对象的属性和值。\n\n在 JavaScript 中处理对象时，使用 `Object.keys` 和 `Object.values` 可以更清晰、更易读地遍历其属性和值。\n\
    \n### 好的代码\n```javascript\nconst user = {\n  name: 'Alice',\n  age: 25,\n  city:\
    \ 'Wonderland'\n};\n\n// Iterating over keys\nObject.keys(user).forEach(key =>\
    \ {\n  console.log(`${key}: ${user[key]}`);\n});\n\n// Iterating over values\n\
    Object.values(user).forEach(value => {\n  console.log(value);\n});\n```\n\n###\
    \ 差的代码\n```javascript\nconst user = {\n  name: 'Alice',\n  age: 25,\n  city: 'Wonderland'\n\
    };\n\n// Using for...in loop\nfor (let key in user) {\n  if (user.hasOwnProperty(key))\
    \ {\n    console.log(`${key}: ${user[key]}`);\n  }\n}\n\n// Using for...in loop\
    \ for values\nfor (let key in user) {\n  if (user.hasOwnProperty(key)) {\n   \
    \ console.log(user[key]);\n  }\n}\n```\n\n好的示例使用 `Object.keys` 和 `Object.values`\
    \ 遍历对象的属性和值，使代码更易读，并避免了 `hasOwnProperty` 检查。差的示例使用 `for...in` 循环，需要额外检查以确保只遍历对象自身的属性，代码不够简洁。\n\
    \n**备忘录**\n`Object.entries` 也可用于同时遍历键和值，返回键值对数组。\n\n# 使用 ??（空值合并）运算符设置默认值。\n\n\
    `??` 运算符提供了一种简洁的方式，在处理 `null` 或 `undefined` 时分配默认值。\n\n空值合并运算符（`??`）是 JavaScript\
    \ 中一个有用的工具，用于在变量为 `null` 或 `undefined` 时设置默认值，使代码更易读，并避免与假值相关的常见陷阱。\n\n### 好的代码\n\
    ```javascript\nlet userInput = null;\nlet defaultText = 'Default text';\n\n//\
    \ Using ?? operator\nlet displayText = userInput ?? defaultText;\nconsole.log(displayText);\
    \ // Output: 'Default text'\n```\n\n### 差的代码\n```javascript\nlet userInput = null;\n\
    let defaultText = 'Default text';\n\n// Using || operator\nlet displayText = userInput\
    \ || defaultText;\nconsole.log(displayText); // Output: 'Default text'\n```\n\n\
    好的示例使用 `??` 运算符仅在 `userInput` 为 `null` 或 `undefined` 时分配 `defaultText`，确保其他假值如\
    \ `0` 或 `''` 不会被错误替换。差的示例使用 `||` 运算符，它会替换任何假值，而不仅仅是 `null` 或 `undefined`，可能导致意外行为。\n\
    \n**备忘录**\n`??` 运算符在 ECMAScript 2020（ES11）中引入，特别适用于 `0`、`false` 或 `''` 是有效值且不应触发默认赋值的情况。\n\
    \n# 使用 fetch 进行网络请求，而非 XMLHttpRequest 等旧方法。\n\n使用现代的 `fetch` API 进行网络请求，以编写更清晰、更易读的代码。\n\
    \n`fetch` API 是一种基于 Promise 的现代 JavaScript 网络请求方式。它比旧的 `XMLHttpRequest` 方法更强大、更灵活，并且能带来更易读、更易维护的代码。\n\
    \n### 好的代码\n```javascript\n// Good example using fetch\nfetch('https://api.example.com/data')\n\
    \  .then(response => {\n    if (!response.ok) {\n      throw new Error('Network\
    \ response was not ok');\n    }\n    return response.json();\n  })\n  .then(data\
    \ => {\n    console.log(data); // Handle the data from the API\n  })\n  .catch(error\
    \ => {\n    console.error('There was a problem with the fetch operation:', error);\n\
    \  });\n```\n\n### 差的代码\n```javascript\n// Bad example using XMLHttpRequest\n\
    var xhr = new XMLHttpRequest();\nxhr.open('GET', 'https://api.example.com/data',\
    \ true);\nxhr.onreadystatechange = function () {\n  if (xhr.readyState === 4)\
    \ {\n    if (xhr.status === 200) {\n      var data = JSON.parse(xhr.responseText);\n\
    \      console.log(data); // Handle the data from the API\n    } else {\n    \
    \  // ...\n    }\n  }\n};\n```\n\n"
