    # Favor switch statements for multiple condition checks.


    * * *


    Use switch statements instead of multiple if-else statements for better readability
    and maintainability.


    * * *


    When dealing with multiple conditions that depend on the same variable, switch
    statements provide a clearer and more organized way to handle the logic.


    < Good Code >


    function getFruitColor(fruit) {


