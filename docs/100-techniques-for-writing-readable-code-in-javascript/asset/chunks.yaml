    # Leverage async generators for handling async iteration.


    * * *


    Async generators provide a powerful way to handle asynchronous iteration, making
    code more readable and efficient.


    * * *


    Async generators allow you to iterate over asynchronous data sources using the
    for await...of loop. This technique simplifies the handling of asynchronous operations,
    such as fetching data from an API, by allowing you to process each piece of data
    as it becomes available.


    < Good Code >


    // Good example: Using async generators for async iteration


    async function* fetchData() {


      const urls = [''https://api.example.com/data1'', ''https://api.example.com/data2''];


      for (const url of urls) {


        const response = await fetch(url);


        const data = await response.json();


        yield data;


      }


    }


    (async () => {


      for await (const data of fetchData()) {


        console.log(data);


      }


    })();


    <Bad Code>


    // Bad example: Using Promises without async generators


    const urls = [''https://api.example.com/data1'', ''https://api.example.com/data2''];


    function fetchData() {


      return Promise.all(urls.map(url => fetch(url).then(response => response.json())));


    }


    fetchData().then(dataArray => {


      dataArray.forEach(data => console.log(data));


    });


    In the good example, an async generator function fetchData is used to fetch data
    from multiple URLs. The for await...of loop allows processing each piece of data
    as it is fetched, making the code more readable and efficient. In the bad example,
    Promise.all is used to fetch all data at once, which can be less efficient and
    harder to read.


    <Memo>


    Async generators were introduced in ECMAScript 2018 (ES9). They combine the capabilities
    of generators and async functions, allowing you to work with asynchronous data
    streams in a more natural and readable way.


    51


    # Utilize WeakMap and WeakSet for managing object keys without preventing garbage
    collection.


    * * *


    WeakMap and WeakSet allow you to manage object keys without preventing their garbage
    collection, enhancing memory efficiency.


    * * *


    Using WeakMap and WeakSet can help manage object keys and references while ensuring
    that these objects can be garbage collected when no longer needed. This is especially
    useful for caching or tracking objects in a way that avoids memory leaks.


