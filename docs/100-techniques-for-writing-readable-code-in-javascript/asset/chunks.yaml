    the lack of units in the variable names can lead to confusion and potential errors,
    as it is not immediately clear what the values represent.


    <Memo>


    Including units in variable names is especially important in scientific and engineering
    applications, where precise measurements are crucial. This practice helps ensure
    accuracy and clarity in calculations and data representation.


    9


    # Use nouns for variables and verbs for functions.


    * * *


    Using nouns for variables and verbs for functions makes the code more readable
    and intuitive.


    * * *


    This technique ensures that variables clearly represent entities or objects, while
    functions represent actions or processes. This naming convention helps others
    quickly understand the purpose and usage of each element in your code.


    < Good Code >


    ```javascript


    // Good Example


    let userName = "John"; // Noun for a variable


    let age = 30; // Noun for a variable


    function calculateAge(birthYear) { // Verb for a function


      return new Date().getFullYear() - birthYear;


    }


    function printGreeting(name) { // Verb for a function


      console.log(`Hello, ${name}!`);


    }


