    <Bad Code>


    // Bad example: Using variables for fixed values


    let maxUsers = 100;


    let apiUrl = ''https://api.example.com/data'';


    function fetchData() {


      fetch(apiUrl)


        .then(response => response.json())


        .then(data => console.log(data));


    }


    console.log(`The maximum number of users is ${maxUsers}`);


    In the good example, MAX_USERS and API_URL are declared as constants using const,
    indicating that their values should not change. This makes the code easier to
    understand and maintain. In the bad example, maxUsers and apiUrl are declared
    using let, which implies that their values might change, potentially causing confusion.


    <Memo>


    In JavaScript, constants are block-scoped, similar to variables declared using
    let. They cannot be reassigned, but if the constant is an object or array, the
    contents can still be modified.


