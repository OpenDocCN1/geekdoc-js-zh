  trans: "\n\n当创建一个与现有类共享属性或方法的新类时，请考虑扩展现有类，而不是重复代码。\n\n< 好代码 >\n\n```javascript\n\
    class Animal {\n  constructor(name) {\n    this.name = name;\n  }\n  speak() {\n\
    \    console.log(`${this.name} makes a sound.`);\n  }\n}\n\nclass Dog extends\
    \ Animal {\n  constructor(name) {\n    super(name); // 调用父类构造函数\n  }\n  speak()\
    \ {\n    console.log(`${this.name} barks.`); // 重写父类方法\n  }\n}\n\nconst animal\
    \ = new Animal('Generic Animal');\nconst dog = new Dog('Buddy');\nanimal.speak();\
    \ // Output: Generic Animal makes a sound.\ndog.speak(); // Output: Buddy barks.\n\
    ```\n\n< 坏代码 >\n\n```javascript\nclass Animal {\n  constructor(name) {\n    this.name\
    \ = name;\n  }\n  speak() {\n    console.log(`${this.name} makes a sound.`);\n\
    \  }\n}\n\nclass Dog {\n  constructor(name) {\n    this.name = name;\n  }\n  speak()\
    \ {\n    console.log(`${this.name} barks.`);\n  }\n}\n\nconst animal = new Animal('Generic\
    \ Animal');\nconst dog = new Dog('Buddy');\nanimal.speak(); // Output: Generic\
    \ Animal makes a sound.\ndog.speak(); // Output: Buddy barks.\n```\n\n在好代码示例中，`Dog`\
    \ 类扩展了 `Animal` 类，继承了其属性和方法。`super()` 方法用于调用父类构造函数并初始化 `name` 属性。`speak()` 方法在\
    \ `Dog` 类中被重写，以提供针对狗的具体实现。\n\n在坏代码示例中，`Dog` 类被单独定义，重复了 `name` 属性和 `speak()` 方法。这违反了\
    \ DRY（不要重复自己）原则，并使代码库更难以维护和扩展。\n\n继承促进了代码复用、模块化和可扩展性，使得基于现有类创建新类更加容易，同时避免了重复。\n\
    \n< 备忘录 >\n\n继承是面向对象编程（OOP）的核心原则之一，与封装和多态并列。\n\n100\n\n# 利用函数组合从简单函数创建复杂功能\n\n\
    * * *\n\n函数组合允许将多个简单函数组合起来，以创建更复杂的功能，促进代码复用和模块化。\n\n* * *\n\n在处理复杂操作时，考虑将其分解为更小、可复用的函数，并将它们组合起来以实现所需功能。\n\
    \n< 好代码 >\n\n```javascript\nconst addTax = (amount) => amount * 1.08;\nconst formatCurrency\
    \ = (amount) => `$${amount.toFixed(2)}`;\n\nconst calculateTotal = (items) =>\n\
    \  items\n    .map((item) => item.price)\n    .reduce((total, price) => total\
    \ + price, 0)\n    .then(addTax)\n    .then(formatCurrency);\n\nconst items =\
    \ [\n  { name: 'Item 1', price: 10 },\n  { name: 'Item 2', price: 20 },\n  { name:\
    \ 'Item 3', price: 30 },\n];\n\nconst total = calculateTotal(items);\nconsole.log(total);\
    \ // Output: $64.80\n```\n\n< 坏代码 >\n\n```javascript\nconst calculateTotal = (items)\
    \ => {\n  let total = 0;\n  for (const item of items) {\n    total += item.price;\n\
    \  }\n  total *= 1.08;\n  return `$${total.toFixed(2)}`;\n};\n\nconst items =\
    \ [\n  { name: 'Item 1', price: 10 },\n  { name: 'Item 2', price: 20 },\n  { name:\
    \ 'Item 3', price: 30 },\n];\n\nconst total = calculateTotal(items);\nconsole.log(total);\
    \ // Output: $64.80\n```\n\n在好代码示例中，`calculateTotal` 函数由三个更小的函数组成：`map` 用于提取商品价格，`reduce`\
    \ 用于求和，`addTax` 用于应用税率，`formatCurrency` 用于将总额格式化为货币字符串。每个函数都有单一职责，使代码更易读、可测试和可维护。\n\
    \n在坏代码示例中，`calculateTotal` 函数将所有逻辑放在一个函数中，使得读取、测试和复用部分功能变得更加困难。\n\n函数组合促进了代码复用、模块化和可测试性，使得通过组合更小、更专注的函数来创建复杂功能变得更加容易。\n\
    \n< 备忘录 >\n\n函数组合是函数式编程中的一个基本概念，其中函数被视为一等公民，可以作为参数传递给其他函数，或从函数中返回。\n\n101\n\n\
    # 使用默认参数处理缺失参数\n\n* * *\n\n为函数参数提供默认值，以处理参数缺失或为 `undefined` 的情况。\n\n* * *\n\n\
    当调用函数时未提供所有必需参数，JavaScript 会将缺失参数赋值为 `undefined`。这可能导致错误或意外行为。默认参数允许你为缺失参数指定一个回退值。\n\
    \n< 好代码 >\n\n```javascript\nfunction greet(name = 'Guest') {\n  console.log(`Hello,\
    \ ${name}!`);\n}\n\ngreet('John'); // Output: Hello, John!\ngreet(); // Output:\
    \ Hello, Guest!\n```\n\n< 坏代码 >\n\n```javascript\nfunction greet(name) {\n  const\
    \ nameToUse = name || 'Guest';\n  console.log(`Hello, ${nameToUse}!`);\n}\n\n\
    greet('John'); // Output: Hello, John!\ngreet(); // Output: Hello, Guest!\ngreet(undefined);\
    \ // Output: Hello, Guest!\n```\n\n在好代码示例中，`name` 参数有一个默认值 `'Guest'`。如果调用 `greet()`\
    \ 时未提供参数，则使用默认值。这种方法比坏代码示例更简洁、更易读，坏代码示例使用逻辑或运算符来处理缺失参数的情况。\n\n< 备忘录 >\n\n默认参数是在\
    \ ECMAScript 2015（ES6）中引入的。\n\n102\n\n# 避免副作用以使函数可复用\n\n* * *\n\n编写不修改外部状态或数据的纯函数，以确保它们可复用且可预测。\n\
    \n* * *\n\n纯函数是指给定相同输入，总是返回相同输出且没有副作用的函数。副作用是对函数作用域之外的外部状态或数据的更改。避免副作用使函数更容易推理、测试和在不同上下文中复用。\n\
    \n< 好代码 >\n\n```javascript\nconst addNumbers = (a, b) => a + b;\nconst result\
    \ = addNumbers(2, 3); // result 为 5\n```\n\n< 坏代码 >\n\n```javascript\nlet counter\
    \ = 0;\nconst incrementCounter = () => {\n  counter++;\n  return counter;\n}\n\
    \nconst result = incrementCounter(); // result 为 1\nconst anotherResult = incrementCounter();\
    \ // anotherResult 为 2\n```\n\n在好代码示例中，`addNumbers` 是一个纯函数，它接受两个数字作为输入并返回它们的和，而不修改任何外部状态。在坏代码示例中，`incrementCounter`\
    \ 修改了外部的 `counter` 变量，使其不纯，更难单独推理和测试。\n\n< 备忘录 >\n\n纯函数是函数式编程的核心概念，常用于响应式编程以及像\
    \ React 和 Redux 这样的状态管理库中。\n\n后记\n\n◆\n\n感谢您花时间阅读这本包含 100 种提升 JavaScript 代码可读性技巧的合集。\n\
    \n在本书中，我们探讨了多种利用 JavaScript 独特特性和语法编写更清晰、更易理解代码的方法。\n\n我们的目标是为您提供实用的策略，使您的代码不仅功能完备，而且易于他人阅读和维护。\n\
    \n每项技巧都包含好与坏的示例，通过清晰的对比帮助您掌握编写可读代码的原则。\n\n我们希望这些示例具有启发性，并为您改进编码实践奠定了坚实的基础。\n\n\
    我们相信，本书中分享的见解和技巧将在您的编程之旅中发挥重要作用，让您的代码对每个遇到它的人来说都更易理解、更令人愉悦。\n\n祝编码愉快！\n\n"
