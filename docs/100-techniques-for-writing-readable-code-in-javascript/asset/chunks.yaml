  trans: "\n\n```javascript\n    console.log(`属性 ${property} 已被访问。`);\n    return\
    \ target[property];\n  }\n};\n\nconst obj = { name: 'John', age: 30 };\nconst\
    \ proxy = new Proxy(obj, handler);\n\nconsole.log(proxy.name); // 日志：属性 name 已被访问。输出：John\n\
    console.log(proxy.age);  // 日志：属性 age 已被访问。输出：30\n```\n\n### 糟糕的代码\n```javascript\n\
    // 糟糕示例：在每个属性访问中直接添加日志\nconst obj = { name: 'John', age: 30 };\n\nfunction getName()\
    \ {\n  console.log('属性 name 已被访问。');\n  return obj.name;\n}\n\nfunction getAge()\
    \ {\n  console.log('属性 age 已被访问。');\n  return obj.age;\n}\n\nconsole.log(getName());\
    \ // 日志：属性 name 已被访问。输出：John\nconsole.log(getAge());  // 日志：属性 age 已被访问。输出：30\n\
    ```\n\n在优秀示例中，使用 `Proxy` 拦截属性访问操作，提供了一种干净且可复用的方式来添加自定义行为。而在糟糕示例中，日志被直接添加到函数中，导致代码可维护性差，且随着属性增多难以扩展。\n\
    \n**备忘录：**\nProxy 还可用于创建虚拟对象，这些对象没有真实属性，但能动态响应属性访问。这在实现基于数据库的对象或复杂缓存机制等场景中非常有用。\n\
    \n---\n\n# 利用 Symbol 创建唯一属性键以避免冲突\n\n使用 `Symbols` 在对象中创建唯一的属性键，防止键冲突。\n\nJavaScript\
    \ 中的 `Symbols` 提供了一种为对象属性创建唯一标识符的方法，确保这些键是唯一的，并避免与其他键发生潜在冲突。\n\n### 优秀代码\n```javascript\n\
    // 创建一个唯一的 Symbol\nconst uniqueKey = Symbol('uniqueKey');\n\n// 将 Symbol 用作对象的属性键\n\
    const myObject = {\n  [uniqueKey]: '这是一个唯一的属性值',\n  commonKey: '这是一个普通的属性值'\n\
    };\n\nconsole.log(myObject[uniqueKey]); // 输出：这是一个唯一的属性值\n```\n\n### 糟糕的代码\n```javascript\n\
    // 使用字符串作为属性键\nconst myObject = {\n  uniqueKey: '这应该是唯一的',\n  commonKey: '这是一个普通的属性值',\n\
    \  uniqueKey: '这被覆盖了'\n};\n\nconsole.log(myObject.uniqueKey); // 输出：这被覆盖了\n```\n\
    \n使用 `Symbols` 作为属性键可以确保每个键都是唯一的，且不会被意外覆盖。在糟糕示例中，使用字符串键导致 `uniqueKey` 属性被覆盖，而在优秀示例中，`Symbol`\
    \ 确保了键的唯一性。\n\n**备忘录：**\n`Symbols` 是 ECMAScript 2015（ES6）引入的原始数据类型，且不可枚举，这意味着它们不会出现在\
    \ `for...in` 循环中。\n\n---\n\n# 使用带标签的模板字面量创建安全的 HTML 或 SQL 模板\n\n使用带标签的模板字面量创建安全且格式良好的\
    \ HTML 或 SQL 模板。\n\nJavaScript 中的带标签模板字面量提供了一种强大的方式来处理和净化模板字面量，这对于创建安全的 HTML 或\
    \ SQL 模板尤其有用。\n\n### 优秀代码\n```javascript\n// 用于转义 HTML 的标签函数\nfunction escapeHTML(literals,\
    \ ...placeholders) {\n  let result = '';\n  // 遍历每个字面量和占位符\n  for (let i = 0;\
    \ i < placeholders.length; i++) {\n    result += literals[i] + String(placeholders[i]).replace(/&/g,\
    \ '&amp;')\n                                                   .replace(/</g,\
    \ '&lt;')\n                                                   .replace(/>/g, '&gt;')\n\
    \                                                   .replace(/\"/g, '&quot;')\n\
    \                                                   .replace(/'/g, '&#39;');\n\
    \  }\n  result += literals[literals.length - 1];\n  return result;\n}\n\n// 使用带标签的模板字面量\n\
    const name = '<script>alert(\"xss\")</script>';\nconst safeHTML = escapeHTML`<div>Hello,\
    \ ${name}!</div>`;\nconsole.log(safeHTML); // 输出：<div>Hello, &lt;script&gt;alert(&quot;xss&quot;)&lt;/script&gt;!</div>\n\
    ```\n\n### 糟糕的代码\n```javascript\n// 直接将变量嵌入 HTML 模板\nconst name = '<script>alert(\"\
    xss\")</script>';\nconst unsafeHTML = `<div>Hello, ${name}!</div>`;\nconsole.log(unsafeHTML);\
    \ // 输出：<div>Hello, <script>alert(\"xss\")</script>!</div>\n```\n\n带标签的模板字面量允许你在嵌入值之前使用标签函数处理模板字面量。这对安全性至关重要，如优秀示例所示，`escapeHTML`\
    \ 函数对输入进行了净化。而在糟糕示例中，直接嵌入可能导致 XSS 等安全漏洞。\n\n**备忘录：**\n带标签的模板字面量是 ECMAScript 2015（ES6）引入的高级特性，允许使用标签函数对模板字面量进行自定义处理。\n\
    \n---\n\n# 使用 Reflect API 执行对象操作\n\n`Reflect` API 提供了执行对象操作的方法，避免了使用变通方法。\n\n\
    与其直接使用对象属性访问器，不如使用 `Reflect` API 以更清晰的方式执行对象操作。\n\n### 优秀代码\n```javascript\nconst\
    \ obj = { x: 1, y: 2 };\n\n// 获取属性值\nconsole.log(Reflect.get(obj, 'x')); // 输出：1\n\
    \n// 设置属性值\nReflect.set(obj, 'x', 3);\nconsole.log(obj.x); // 输出：3\n\n// 检查属性是否存在\n\
    console.log(Reflect.has(obj, 'y')); // 输出：true\n```\n\n### 糟糕的代码\n```javascript\n\
    const obj = { x: 1, y: 2 };\n\n// 获取属性值\nconsole.log(obj['x']); // 输出：1\n\n//\
    \ 设置属性值\nobj['x'] = 3;\nconsole.log(obj.x); // 输出：3\n\n// 检查属性是否存在\nconsole.log('y'\
    \ in obj); // 输出：true\n```\n\n`Reflect` API 提供了一种更函数式的方式来处理对象，使代码更易读、更易维护。它还允许更好地处理边界情况，并提供一致的对象操作方式。\n\
    \n**备忘录：**\n`Reflect` API 在 ECMAScript 6（ES6）中引入，是标准库的一部分。\n\n---\n\n# 尽可能在变量使用处附近声明变量\n\
    \n尽可能在变量使用处附近声明变量，以提高代码的可读性和可维护性。\n\n通过将变量声明在靠近其使用的位置，可以更好地理解变量的作用域和用途，使代码更易读、更易维护。\n\
    \n### 优秀代码\n```javascript\nfunction calculateArea(radius) {\n  const PI = 3.14159;\
    \ // 将 PI 常量声明在靠近其使用的位置\n  const area = PI * radius ** 2;\n  return area;\n}\n\
    \nconst radius = 5;\nconst circleArea = calculateArea(radius);\nconsole.log(circleArea);\
    \ // 输出：78.53975\n```\n\n### 糟糕的代码\n```javascript\nconst PI = 3.14159; // 将 PI\
    \ 常量声明在远离其使用的位置\n\nfunction calculateArea(radius) {\n  const area = PI * radius\
    \ ** 2;\n  return area;\n}\n\nconst radius = 5;\nconst circleArea = calculateArea(radius);\n\
    console.log(circleArea); // 输出：78.53975\n```\n\n将变量声明在靠近其使用的位置，通过提供上下文并减少理解代码所需的认知负荷，提高了代码的可读性。它还有助于防止命名冲突，并使变量的作用域推理更加容易。\n\
    \n**备忘录：**\n这一原则在软件工程中常被称为“最小惊讶原则”或“就近原则”。\n\n---\n\n# 为循环计数器使用有意义的名称\n\n为循环计数器使用描述性名称，可以提高代码的可读性和可维护性。\n\
    \n编写循环时，通常使用单字母变量如 `i`、`j` 或 `k` 作为循环计数器。然而，使用更具描述性的名称可以使代码更易于理解，尤其是对于不熟悉代码库的人。\n\
    \n### 优秀代码\n```javascript\n// 遍历学生数组\nfor (let studentIndex = 0; studentIndex\
    \ < students.length; studentIndex++) {\n    console.log(students[studentIndex].name);\n\
    }\n```\n\n### 糟糕的代码\n```javascript\n// 遍历学生数组\nfor (let i = 0; i < students.length;\
    \ i++) {\n    console.log(students[i].name);\n}\n```\n\n"
- fmt: "\nIn the good example, `studentIndex` clearly indicates that the loop counter\
    \ is related to the index of students in the array. This makes the code more readable\
    \ and understandable. In the bad example, `i` is less descriptive, making it harder\
    \ to understand the purpose of the loop at a glance.\n\n> **Memo**: Using meaningful\
    \ names for loop counters is especially important in nested loops, where multiple\
    \ counters are used. Descriptive names help avoid confusion and potential errors.\n\
    \n# Avoid reusing variables for different purposes\n\nReusing variables for different\
    \ purposes can lead to confusion and bugs. Always use separate variables for different\
    \ tasks.\n\nReusing the same variable for different purposes within the same scope\
    \ can make the code difficult to read and maintain. It can also introduce hard-to-find\
    \ bugs. Instead, use distinct variables for different tasks to keep the code clean\
    \ and understandable.\n\n### Good Code\n```javascript\nlet totalScore = 0;\nlet\
    \ averageScore = 0;\n\n// Calculate total score\nfor (let i = 0; i < scores.length;\
    \ i++) {\n    totalScore += scores[i];\n}\n\n// Calculate average score\naverageScore\
    \ = totalScore / scores.length;\n\nconsole.log(\"Total Score:\", totalScore);\n\
    console.log(\"Average Score:\", averageScore);\n```\n\n### Bad Code\n```javascript\n\
    let score = 0;\n\n// Calculate total score\nfor (let i = 0; i < scores.length;\
    \ i++) {\n    score += scores[i];\n}\n\n// Calculate average score\nscore = score\
    \ / scores.length;\n\nconsole.log(\"Total Score:\", score); // Incorrectly labeled\
    \ as total score\nconsole.log(\"Average Score:\", score);\n```\n\nIn the good\
    \ example, `totalScore` and `averageScore` are used for their specific purposes,\
    \ making the code clear and easy to follow. In the bad example, the variable `score`\
    \ is reused for both the total and average score calculations, which can lead\
    \ to confusion and potential errors in understanding the code's intent.\n\n> **Memo**:\
    \ Reusing variables can also lead to unintended side effects, especially in larger\
    \ codebases where the variable's value might be changed unexpectedly. Always aim\
    \ for clarity and separation of concerns in your code.\n\n# Initialize variables\
    \ when they are declared\n\nAlways initialize variables at the time of declaration\
    \ to avoid undefined values and improve code readability.\n\nInitializing variables\
    \ when they are declared helps prevent bugs related to undefined values and makes\
    \ the code easier to understand.\n\n### Good Code\n```javascript\n// Good example:\
    \ Variables are initialized at the time of declaration\nlet count = 0; // count\
    \ is initialized to 0\nlet name = 'John'; // name is initialized to 'John'\nlet\
    \ isActive = true; // isActive is initialized to true\n```\n\n### Bad Code\n```javascript\n\
    // Bad example: Variables are declared without initialization\nlet count; // count\
    \ is undefined\nlet name; // name is undefined\nlet isActive; // isActive is undefined\n\
    ```\n\nIn the good example, each variable is given an initial value, which makes\
    \ the code more predictable and easier to debug. In the bad example, the variables\
    \ are declared without initialization, which can lead to unexpected behavior if\
    \ they are used before being assigned a value.\n\n> **Memo**: JavaScript variables\
    \ that are declared but not initialized are automatically assigned the value `undefined`.\n\
    \n# Use constants for configuration values\n\nUse constants to store configuration\
    \ values that do not change, ensuring they are easily identifiable and maintainable.\n\
    \nStoring configuration values in constants makes the code more maintainable and\
    \ reduces the risk of accidental changes to these values.\n\n### Good Code\n```javascript\n\
    // Good example: Configuration values are stored in constants\nconst MAX_USERS\
    \ = 100; // Maximum number of users\nconst API_URL = 'https://api.example.com';\
    \ // Base URL for API\nconst TIMEOUT = 5000; // Timeout duration in milliseconds\n\
    ```\n\n### Bad Code\n```javascript\n// Bad example: Configuration values are hard-coded\
    \ in the code\nlet users = 100; // Maximum number of users\nlet url = 'https://api.example.com';\
    \ // Base URL for API\nlet timeout = 5000; // Timeout duration in milliseconds\n\
    ```\n\nIn the good example, configuration values are stored in constants, making\
    \ them easy to identify and change if needed. In the bad example, the values are\
    \ hard-coded, which can make the code harder to maintain and more prone to errors\
    \ if the values need to be updated.\n\n> **Memo**: Using constants for configuration\
    \ values can also improve performance, as the values are not re-evaluated each\
    \ time they are used.\n\n# Break down functions that do multiple things into smaller\
    \ ones\n\nSimplify functions by breaking them into smaller, single-purpose functions.\n\
    \nWhen functions try to accomplish too much, they become hard to read, understand,\
    \ and maintain. Breaking them into smaller functions improves clarity and reusability.\n\
    \n### Good Code\n```javascript\n// Good example: Functions are broken down into\
    \ smaller, single-purpose ones.\nfunction getUserData(userId) {\n    // Fetch\
    \ user data\n    return fetch(`/api/user/${userId}`)\n        .then(response =>\
    \ response.json());\n}\n\nfunction renderUserData(userData) {\n    // Render user\
    \ data to the UI\n    const userDiv = document.getElementById('user');\n    userDiv.innerHTML\
    \ = `<h2>${userData.name}</h2><p>${userData.email}</p>`;\n}\n\nfunction loadUser(userId)\
    \ {\n    getUserData(userId)\n        .then(userData => {\n            renderUserData(userData);\n\
    \        });\n}\n```\n\n### Bad Code\n```javascript\n// Bad example: Single function\
    \ does too much.\nfunction loadUser(userId) {\n    // Fetch user data\n    fetch(`/api/user/${userId}`)\n\
    \        .then(response => response.json())\n        .then(userData => {\n   \
    \         // Render user data to the UI\n            const userDiv = document.getElementById('user');\n\
    \            userDiv.innerHTML = `<h2>${userData.name}</h2><p>${userData.email}</p>`;\n\
    \        });\n}\n```\n\nIn the good example, `getUserData()` and `renderUserData()`\
    \ are single-purpose functions. `loadUser()` coordinates these smaller functions,\
    \ making the code easier to understand and maintain. In the bad example, one function\
    \ does both data fetching and rendering, making it harder to read and modify.\n\
    \n> **Memo**: The Single Responsibility Principle (SRP) is a fundamental concept\
    \ in software engineering that states that a function or class should have only\
    \ one reason to change, which is achieved by making functions do just one thing.\n\
    \n# Separate concerns by dividing code into modules\n\nOrganize code by dividing\
    \ it into modules, each responsible for a specific part of the functionality.\n\
    \nSeparating concerns means dividing your code into distinct sections (modules),\
    \ each handling a specific aspect of the application. This enhances code maintainability,\
    \ reusability, and readability.\n\n### Good Code\n```javascript\n// userData.js\n\
    export function getUserData(userId) {\n    return fetch(`/api/user/${userId}`)\n\
    \        .then(response => response.json());\n}\n\n// render.js\nexport function\
    \ renderUserData(userData) {\n    const userDiv = document.getElementById('user');\n\
    \    userDiv.innerHTML = `<h2>${userData.name}</h2><p>${userData.email}</p>`;\n\
    }\n\n// main.js\nimport { getUserData } from './userData.js';\nimport { renderUserData\
    \ } from './render.js';\n\nfunction loadUser(userId) {\n    getUserData(userId)\n\
    \        .then(userData => {\n            renderUserData(userData);\n        });\n\
    }\n```\n\n### Bad Code\n```javascript\n// Bad example: All code in a single file.\n\
    function loadUser(userId) {\n    // Fetch user data\n    fetch(`/api/user/${userId}`)\n\
    \        .then(response => response.json())\n        .then(userData => {\n   \
    \         // Render user data to the UI\n            const userDiv = document.getElementById('user');\n\
    \            userDiv.innerHTML = `<h2>${userData.name}</h2><p>${userData.email}</p>`;\n\
    \        });\n}\n```\n\nIn the good example, functionality is split into different\
    \ modules (`userData.js`, `render.js`, and `main.js`). This makes the codebase\
    \ more modular and easier to manage. The bad example keeps all functionality in\
    \ one place, making it harder to maintain and scale.\n"
