  trans: "\n\n# 引言\n\n可读性强的代码是高效编程的基石。\n\n本电子书介绍了 100 种技巧，帮助你编写更好的 JavaScript 代码。这些方法利用\
    \ JavaScript 的独特特性和语法，旨在让你的代码对他人尽可能易读。\n\n每种技巧都通过好代码和坏代码的示例进行说明，确保清晰易懂。深入探索，你将发现如何改进编码实践，编写更简洁、更易维护的\
    \ JavaScript 代码。\n\n## 1. 使用 `const` 和 `let` 代替 `var` 实现块级作用域变量\n\n使用 `const`\
    \ 和 `let` 可以确保变量具有块级作用域，从而减少错误并提高代码可读性。`const` 和 `let` 提供块级作用域，有助于防止 `var` 常见的变量提升和作用域泄漏问题。\n\
    \n### 好代码\n```javascript\n// 使用 const 定义常量\nconst MAX_USERS = 100;\n\n// 使用 let\
    \ 定义可能变化的变量\nlet userCount = 0;\n\nif (userCount < MAX_USERS) {\n  let newUser\
    \ = 'John Doe';\n  userCount++;\n  console.log(newUser); // John Doe\n}\nconsole.log(userCount);\
    \ // 1\n```\n\n### 坏代码\n```javascript\n// 使用 var，它是函数作用域的，可能引发问题\nvar MAX_USERS\
    \ = 100;\nvar userCount = 0;\n\nif (userCount < MAX_USERS) {\n  var newUser =\
    \ 'John Doe';\n  userCount++;\n  console.log(newUser); // John Doe\n}\nconsole.log(userCount);\
    \ // 1\nconsole.log(newUser); // John Doe（此处 newUser 可访问，可能带来问题）\n```\n\n使用 `const`\
    \ 和 `let` 有助于避免 `var` 的陷阱，例如意外创建全局变量以及因提升导致的意外行为。`const` 用于不应重新赋值的变量，而 `let` 用于可能变化的变量。\n\
    \n**备忘：**\n`var` 声明会被提升到其所在函数或全局作用域的顶部，这可能导致令人困惑的错误。`const` 和 `let` 声明也会被提升，但在其定义被求值之前不会被初始化，从而产生“暂时性死区”，在初始化之前访问它们会抛出错误。\n\
    \n## 2. 利用箭头函数实现更简洁的语法和词法 `this`\n\n箭头函数提供了简洁的语法，并词法绑定 `this` 值，非常适合回调函数和方法。与传统函数表达式相比，它们语法更短，并自动将\
    \ `this` 绑定到周围上下文，从而简化代码并避免 `this` 相关的常见陷阱。\n\n### 好代码\n```javascript\n// 使用箭头函数实现简洁语法和词法\
    \ this\nconst users = ['Alice', 'Bob', 'Charlie'];\nusers.forEach(user => console.log(user));\
    \ // Alice, Bob, Charlie\n\nconst user = {\n  name: 'John Doe',\n  greet: () =>\
    \ {\n    console.log(`Hello, my name is ${this.name}`); // 'this' 是词法绑定的，因此指向全局对象\n\
    \  }\n};\nuser.greet(); // Hello, my name is undefined\n```\n\n### 坏代码\n```javascript\n\
    // 使用传统函数表达式\nconst users = ['Alice', 'Bob', 'Charlie'];\nusers.forEach(function(user)\
    \ {\n  console.log(user); // Alice, Bob, Charlie\n});\n\nconst user = {\n  name:\
    \ 'John Doe',\n  greet: function() {\n    console.log(`Hello, my name is ${this.name}`);\
    \ // 'this' 指向 user 对象\n  }\n};\nuser.greet(); // Hello, my name is John Doe\n\
    ```\n\n箭头函数特别适用于编写更短、更易读的代码，尤其是在回调函数和方法中。然而，它们没有自己的 `this` 上下文，这在某些情况下可能有利，也可能带来问题。当需要动态\
    \ `this` 上下文时，应使用传统函数表达式。\n\n**备忘：**\n箭头函数不能用作构造函数，也没有自己的 `arguments` 对象。它们最适合用于非方法函数和需要词法\
    \ `this` 的回调函数。\n\n## 3. 利用模板字面量简化字符串拼接\n\n使用模板字面量简化字符串拼接并提高可读性。ES6 引入的模板字面量通过反引号和嵌入表达式，使字符串拼接更简单、更易读。\n\
    \n### 好代码\n```javascript\n// 使用模板字面量进行字符串拼接\nconst name = \"John\";\nconst age\
    \ = 30;\nconst greeting = `Hello, my name is ${name} and I am ${age} years old.`;\n\
    console.log(greeting); // 输出：Hello, my name is John and I am 30 years old.\n```\n\
    \n### 坏代码\n```javascript\n// 使用传统字符串拼接\nconst name = \"John\";\nconst age = 30;\n\
    const greeting = \"Hello, my name is \" + name + \" and I am \" + age + \" years\
    \ old.\";\nconsole.log(greeting); // 输出：Hello, my name is John and I am 30 years\
    \ old.\n```\n\n模板字面量使用反引号（`` ` ``）代替引号，并允许通过 `${expression}` 嵌入表达式。与使用 `+` 运算符的传统字符串拼接相比，这使代码更易读、更易维护。\n\
    \n**备忘：**\n模板字面量还支持多行字符串，这对于格式化长字符串或 HTML 片段非常有用。\n\n## 4. 使用对象和数组的解构赋值编写更简洁的代码\n\
    \n解构赋值允许以简洁易读的方式从对象和数组中提取值。ES6 引入的解构赋值可以将数组中的值或对象中的属性解包到不同的变量中。\n\n### 好代码\n```javascript\n\
    // 使用对象解构赋值\nconst person = { name: \"Alice\", age: 25, city: \"Wonderland\" };\n\
    const { name, age, city } = person;\nconsole.log(name); // 输出：Alice\nconsole.log(age);\
    \ // 输出：25\nconsole.log(city); // 输出：Wonderland\n\n// 使用数组解构赋值\nconst numbers\
    \ = [1, 2, 3, 4];\nconst [first, second, , fourth] = numbers;\nconsole.log(first);\
    \ // 输出：1\nconsole.log(second); // 输出：2\nconsole.log(fourth); // 输出：4\n```\n\n\
    ### 坏代码\n```javascript\n// 不使用对象解构赋值\nconst person = { name: \"Alice\", age: 25,\
    \ city: \"Wonderland\" };\nconst name = person.name;\nconst age = person.age;\n\
    const city = person.city;\nconsole.log(name); // 输出：Alice\nconsole.log(age); //\
    \ 输出：25\nconsole.log(city); // 输出：Wonderland\n\n// 不使用数组解构赋值\nconst numbers =\
    \ [1, 2, 3, 4];\nconst first = numbers[0];\nconst second = numbers[1];\nconst\
    \ fourth = numbers[3];\nconsole.log(first); // 输出：1\nconsole.log(second); // 输出：2\n\
    console.log(fourth); // 输出：4\n```\n\n解构赋值通过减少重复代码使代码更简洁、更易读。它允许直接从对象和数组中提取值，使代码更清晰、更易理解。\n\
    \n**备忘：**\n解构赋值也可以用于函数参数，从而实现更灵活、更易读的函数签名。\n\n## 5. 应用展开运算符合并数组和对象\n\n使用展开运算符（`...`）轻松合并\
    \ JavaScript 中的数组和对象。展开运算符允许展开数组的元素或对象的属性，从而无需复杂方法即可轻松合并它们。\n\n### 好代码\n```javascript\n\
    // 合并数组\nconst array1 = [1, 2, 3];\nconst array2 = [4, 5, 6];\nconst mergedArray\
    \ = [...array1, ...array2]; // [1, 2, 3, 4, 5, 6]\n\n// 合并对象\nconst object1 =\
    \ { a: 1, b: 2 };\nconst object2 = { c: 3, d: 4 };\nconst mergedObject = { ...object1,\
    \ ...object2 }; // { a: 1, b: 2, c: 3, d: 4 }\n```\n\n### 坏代码\n```javascript\n\
    // 合并数组\nconst array1 = [1, 2, 3];\nconst array2 = [4, 5, 6];\nconst mergedArray\
    \ = array1.concat(array2); // [1, 2, 3, 4, 5, 6]\n\n// 合并对象\nconst object1 = {\
    \ a: 1, b: 2 };\nconst object2 = { c: 3, d: 4 };\nconst mergedObject = Object.assign({},\
    \ object1, object2); // { a: 1, b: 2, c: 3, d: 4 }\n```\n\n"
- fmt: "\nThe good example uses the spread operator, which is more concise and easier\
    \ to read. The bad example uses older methods like `concat` for arrays and `Object.assign`\
    \ for objects, which are more verbose and less intuitive.\n\n<Memo>\n\nThe spread\
    \ operator was introduced in ES6 (ECMAScript 2015) and has since become a popular\
    \ feature for handling arrays and objects in a more readable and efficient manner.\n\
    \n# 6. Use meaningful variable names that describe their purpose.\n\n* * *\n\n\
    Choose variable names that clearly describe their purpose and content.\n\n* *\
    \ *\n\nMeaningful variable names make your code more readable and maintainable.\
    \ They help other developers understand the purpose of the variables without needing\
    \ additional comments.\n\n< Good Code >\n\n```javascript\n// Good variable names\n\
    const totalPrice = 100;\nconst userAge = 25;\nconst isUserLoggedIn = true;\n```\n\
    \n<Bad Code>\n\n```javascript\n// Poor variable names\nconst x = 100;\nconst y\
    \ = 25;\nconst z = true;\n```\n\nThe good example uses descriptive names that\
    \ indicate what the variables represent, making the code self-explanatory. The\
    \ bad example uses generic names like `x`, `y`, and `z`, which do not convey any\
    \ meaningful information about the variables' purposes.\n\n<Memo>\n\nUsing meaningful\
    \ variable names is a fundamental practice in clean code principles, as advocated\
    \ by software engineering experts like Robert C. Martin in his book \"Clean Code\"\
    .\n\n# 7. Prefix boolean variables with is, has, or can.\n\n* * *\n\nUse prefixes\
    \ like \"is\", \"has\", or \"can\" for boolean variables to make their purpose\
    \ clear.\n\n* * *\n\nBoolean variables represent true/false values. Using prefixes\
    \ like \"is\", \"has\", or \"can\" helps indicate the nature of the boolean value,\
    \ making the code more readable and understandable.\n\n< Good Code >\n\n```javascript\n\
    // Good example with clear boolean variable names\nlet isUserLoggedIn = true;\n\
    let hasAdminPrivileges = false;\nlet canEditProfile = true;\n```\n\n<Bad Code>\n\
    \n```javascript\n// Bad example with unclear boolean variable names\nlet loggedIn\
    \ = true;\nlet admin = false;\nlet edit = true;\n```\n\nIn the good example, the\
    \ prefixes \"is\", \"has\", and \"can\" clearly indicate that the variables are\
    \ boolean. This makes it easier for other developers to understand the purpose\
    \ of these variables at a glance. In the bad example, the variable names are ambiguous\
    \ and do not clearly convey that they are boolean, which can lead to confusion.\n\
    \n<Memo>\n\nUsing descriptive prefixes for boolean variables is a common practice\
    \ in many programming languages, not just JavaScript. It enhances code readability\
    \ and maintainability across different codebases.\n\n# 8. Include the unit in\
    \ variable names that hold measurements.\n\n* * *\n\nAlways include the unit of\
    \ measurement in the variable name to avoid confusion.\n\n* * *\n\nWhen dealing\
    \ with variables that store measurements, including the unit in the variable name\
    \ helps clarify what the value represents, reducing the risk of errors and misunderstandings.\n\
    \n< Good Code >\n\n```javascript\n// Good example with units in variable names\n\
    let distanceInMeters = 500;\nlet weightInKilograms = 70;\nlet timeInSeconds =\
    \ 120;\n```\n\n<Bad Code>\n\n```javascript\n// Bad example without units in variable\
    \ names\nlet distance = 500;\nlet weight = 70;\nlet time = 120;\n```\n\nIn the\
    \ good example, the variable names include the units (meters, kilograms, seconds),\
    \ making it clear what each value represents. This practice helps prevent mistakes,\
    \ such as mixing up different units of measurement. In the bad example, the lack\
    \ of units in the variable names can lead to confusion and potential errors, as\
    \ it is not immediately clear what the values represent.\n\n<Memo>\n\nIncluding\
    \ units in variable names is especially important in scientific and engineering\
    \ applications, where precise measurements are crucial. This practice helps ensure\
    \ accuracy and clarity in calculations and data representation.\n\n# 9. Use nouns\
    \ for variables and verbs for functions.\n\n* * *\n\nUsing nouns for variables\
    \ and verbs for functions makes the code more readable and intuitive.\n\n* * *\n\
    \nThis technique ensures that variables clearly represent entities or objects,\
    \ while functions represent actions or processes. This naming convention helps\
    \ others quickly understand the purpose and usage of each element in your code.\n\
    \n< Good Code >\n\n```javascript\n// Good Example\nlet userName = \"John\"; //\
    \ Noun for a variable\nlet age = 30; // Noun for a variable\nfunction calculateAge(birthYear)\
    \ { // Verb for a function\n  return new Date().getFullYear() - birthYear;\n}\n\
    function printGreeting(name) { // Verb for a function\n  console.log(`Hello, ${name}!`);\n\
    }\n```\n\n<Bad Code>\n\n```javascript\n// Bad Example\nlet calc = \"John\"; //\
    \ Confusing variable name\nlet calcAge = 30; // Confusing variable name\nfunction\
    \ user(name) { // Confusing function name\n  console.log(`Hello, ${name}!`);\n\
    }\nfunction age(birthYear) { // Confusing function name\n  return new Date().getFullYear()\
    \ - birthYear;\n}\n```\n\nIn the good example, `userName` and `age` are clear\
    \ nouns, making it obvious that they represent data. The functions `calculateAge`\
    \ and `printGreeting` are named with verbs, indicating actions. In the bad example,\
    \ names like `calc` and `user` are ambiguous, making it hard to understand what\
    \ they represent or do.\n\n<Memo>\n\nDid you know? Following a consistent naming\
    \ convention not only improves readability but also helps in maintaining and debugging\
    \ code efficiently, especially in larger projects.\n\n# 10. Avoid abbreviations\
    \ that are not universally understood.\n\n* * *\n\nUsing clear, full names instead\
    \ of abbreviations enhances code readability and reduces confusion.\n\n* * *\n\
    \nAvoiding non-universal abbreviations in your code ensures that anyone reading\
    \ it can easily understand what each variable or function does, without needing\
    \ to guess or look up the meaning.\n\n< Good Code >\n\n```javascript\n// Good\
    \ Example\nlet totalPrice = 150.00; // Clear and descriptive\nfunction calculateTotalPrice(price,\
    \ tax) { // Clear and descriptive\n  return price + (price * tax);\n}\nfunction\
    \ displayProductDetails(product) { // Clear and descriptive\n  console.log(`Product:\
    \ ${product.name}, Price: ${product.price}`);\n}\n```\n\n<Bad Code>\n\n```javascript\n\
    // Bad Example\nlet tp = 150.00; // Unclear abbreviation\nfunction calcTP(p, t)\
    \ { // Unclear abbreviation\n  return p + (p * t);\n}\nfunction dspPD(p) { //\
    \ Unclear abbreviation\n  console.log(`Product: ${p.n}, Price: ${p.p}`);\n}\n\
    ```\n\nIn the good example, names like `totalPrice`, `calculateTotalPrice`, and\
    \ `displayProductDetails` are self-explanatory. In the bad example, abbreviations\
    \ like `tp`, `calcTP`, and `dspPD` are unclear, making the code harder to understand\
    \ and maintain.\n\n<Memo>\n\nDid you know? Consistently using clear and descriptive\
    \ names in your code can significantly reduce the onboarding time for new team\
    \ members, as they won't have to decipher cryptic abbreviations.\n\n# 11. Avoid\
    \ generic names like data, item, or thing.\n\n* * *\n\nUsing specific names makes\
    \ your code more readable and maintainable.\n\n* * *\n\nIn this section, we'll\
    \ illustrate why using specific variable names is essential for code clarity.\n\
    \n< Good Code >\n\n```javascript\n// Retrieves a user's profile by their ID\n\
    function getUserProfile(userId) {\n    // Fetch user profile from the database\n\
    \    let userProfile = database.fetchProfileById(userId);\n    return userProfile;\n\
    }\n```\n\n<Bad Code>\n\n```javascript\n// Retrieves something by its ID\nfunction\
    \ getData(id) {\n    // Fetch data from the database\n    let data = database.fetch(id);\n\
    \    return data;\n}\n```\n\nIn the good code example, `userProfile` and `userId`\
    \ clearly indicate what the function handles, making the code easier to understand\
    \ and maintain. In the bad code example, `data` and `id` are too generic, leading\
    \ to potential confusion about what kind of data is being handled.\n\n<Memo>\n\
    \nGood naming conventions can significantly reduce the cognitive load on developers,\
    \ helping them to quickly grasp the functionality of the code.\n\n# 12. Be specific\
    \ with names to avoid ambiguity.\n\n* * *\n"
