    # Declare variables as close as possible to their usage


    * * *


    Declare variables as close as possible to where they are used to improve code
    readability and maintainability.


    * * *


    By declaring variables closer to their usage, you can better understand the scope
    and purpose of the variable, making the code easier to read and maintain.


    < Good Code >


    jsfunction calculateArea(radius) {


      const PI = 3.14159; // Declare PI constant close to its usage


      const area = PI * radius ** 2;


      return area;


    }


    const radius = 5;


    const circleArea = calculateArea(radius);


    console.log(circleArea); // Output: 78.53975


    <Bad Code>


    jsconst PI = 3.14159; // Declare PI constant far from its usage


    function calculateArea(radius) {


      const area = PI * radius ** 2;


      return area;


    }


    const radius = 5;


    const circleArea = calculateArea(radius);


    console.log(circleArea); // Output: 78.53975


    Declaring variables closer to their usage improves code readability by providing
    context and reducing the cognitive load required to understand the code. It also
    helps prevent naming conflicts and makes it easier to reason about the scope of
    variables.


    <Memo>


    This principle is often referred to as the "Principle of Least Surprise" or the
    "Principle of Proximity" in software engineering.


