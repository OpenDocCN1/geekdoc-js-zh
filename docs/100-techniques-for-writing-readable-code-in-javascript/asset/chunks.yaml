  trans: "\n\n# 94 优雅地使用 .catch 处理被拒绝的 Promise。\n\n---\n\n始终使用 `.catch` 方法处理被拒绝的 Promise，以防止未处理的\
    \ Promise 拒绝。\n\n处理被拒绝的 Promise 可以确保错误得到妥善管理，避免意外崩溃，并提高代码的可靠性。\n\n< Good Code\
    \ >\n\n```javascript\nfetch('https://api.example.com/data')\n  .then(response\
    \ => response.json())\n  .then(data => {\n    console.log('Data received:', data);\n\
    \  })\n  .catch(error => {\n    console.error('Failed to fetch data:', error);\
    \ // 处理被拒绝的 Promise\n  });\n```\n\n<Bad Code>\n\n```javascript\nfetch('https://api.example.com/data')\n\
    \  .then(response => response.json())\n  .then(data => {\n    console.log('Data\
    \ received:', data);\n  });\n// 没有 .catch 来处理潜在的错误\n```\n\n在好的示例中，使用了 `.catch`\
    \ 方法来处理 fetch 操作期间发生的任何错误，确保错误被记录并可被处理。在坏的示例中，没有使用 `.catch` 方法，因此任何错误都会导致未处理的\
    \ Promise 拒绝，进而可能导致应用程序崩溃。\n\n<Memo>\n\n在 Node.js 中，可以使用 `process.on('unhandledRejection',\
    \ handler)` 事件全局捕获未处理的 Promise 拒绝，但更好的做法是使用 `.catch` 在本地处理它们。\n\n# 95 验证函数输入以防止错误。\n\
    \n---\n\n确保对函数输入进行验证，以避免意外错误并提高代码可靠性。\n\n在函数中验证输入有助于及早发现错误，并确保函数按预期运行。这一实践对于维护健壮且无错误的代码至关重要。\n\
    \n< Good Code >\n\n```javascript\n// 带输入验证的加法函数\nfunction add(a, b) {\n  if (typeof\
    \ a !== 'number' || typeof b !== 'number') {\n    throw new Error('Both arguments\
    \ must be numbers');\n  }\n  return a + b;\n}\n\ntry {\n  console.log(add(2, 3));\
    \ // 5\n  console.log(add(2, '3')); // Error: Both arguments must be numbers\n\
    } catch (e) {\n  console.error(e.message);\n}\n```\n\n<Bad Code>\n\n```javascript\n\
    // 不带输入验证的加法函数\nfunction add(a, b) {\n  return a + b;\n}\n\nconsole.log(add(2,\
    \ 3)); // 5\nconsole.log(add(2, '3')); // '23'（意外结果）\n```\n\n在好的示例中，函数检查输入是否为数字，如果不是则抛出错误。这可以防止意外行为，使代码更加健壮。在坏的示例中，函数没有验证输入，导致潜在的错误和意外结果。\n\
    \n<Memo>\n\n输入验证是许多编程语言中的常见实践，对于编写安全可靠的代码至关重要。它通过确保输入符合预期标准，有助于防止错误和安全漏洞。\n\n\
    # 96 编写可在不同项目中复用的模块化代码。\n\n---\n\n通过将功能拆分为小型、可复用的函数或模块，创建模块化代码。\n\n模块化代码更易于维护、测试和跨项目复用。通过将功能封装到独立的小单元中，可以改善代码组织并减少重复。\n\
    \n< Good Code >\n\n```javascript\n// 数学运算工具模块\nconst MathUtils = {\n  add: function(a,\
    \ b) {\n    return a + b;\n  },\n  subtract: function(a, b) {\n    return a -\
    \ b;\n  }\n};\n\n// 在项目的不同部分使用工具模块\nconsole.log(MathUtils.add(5, 3)); // 8\nconsole.log(MathUtils.subtract(5,\
    \ 3)); // 2\n```\n\n<Bad Code>\n\n```javascript\n// 非模块化代码，逻辑重复\nfunction add(a,\
    \ b) {\n  return a + b;\n}\n\nfunction subtract(a, b) {\n  return a - b;\n}\n\n\
    // 在项目的不同部分重复相同的逻辑\nconsole.log(add(5, 3)); // 8\nconsole.log(subtract(5, 3));\
    \ // 2\nconsole.log(add(10, 7)); // 17\nconsole.log(subtract(10, 7)); // 3\n```\n\
    \n在好的示例中，数学运算被封装在一个工具模块中，使代码可复用且易于管理。在坏的示例中，相同的逻辑在项目的不同部分重复出现，导致代码重复，增加了维护难度。\n\
    \n<Memo>\n\n模块化编程是一种软件设计技术，强调将功能分离为独立、可互换的模块。这种方法在现代软件开发中被广泛使用，以增强代码的可维护性和可扩展性。\n\
    \n# 97 使用高阶函数创建可复用的函数模式。\n\n---\n\n高阶函数是接受其他函数作为参数或返回函数作为结果的函数，能够实现可复用和模块化的代码。\n\
    \n高阶函数可以通过抽象常见模式来简化代码，使其更易读、更易维护。\n\n< Good Code >\n\n```javascript\n// 高阶函数，接受一个函数和一个值，并将该函数应用于该值\n\
    function applyFunction(fn, value) {\n  return fn(value);\n}\n\n// 用于高阶函数的示例函数\n\
    function double(x) {\n  return x * 2;\n}\n\nfunction square(x) {\n  return x *\
    \ x;\n}\n\n// 使用高阶函数\nconsole.log(applyFunction(double, 5)); // 10\nconsole.log(applyFunction(square,\
    \ 5)); // 25\n```\n\n<Bad Code>\n\n```javascript\n// 不使用高阶函数，重复类似代码\nfunction\
    \ double(x) {\n  return x * 2;\n}\n\nfunction square(x) {\n  return x * x;\n}\n\
    \nfunction applyDouble(value) {\n  return double(value);\n}\n\nfunction applySquare(value)\
    \ {\n  return square(value);\n}\n\nconsole.log(applyDouble(5)); // 10\nconsole.log(applySquare(5));\
    \ // 25\n```\n\n好的示例使用高阶函数 `applyFunction` 将不同的函数（`double` 和 `square`）应用于一个值，使代码更可复用和简洁。坏的示例为每个函数应用重复了类似的代码，降低了可维护性。\n\
    \n<Memo>\n\nJavaScript 内置的数组方法如 `map`、`filter` 和 `reduce` 就是高阶函数的例子。\n\n# 98 使用混入（Mixins）在多个类中复用代码。\n\
    \n---\n\n混入是一种在不使用继承的情况下，在多个类中包含可复用代码的方式。\n\n混入允许通过将方法从一个对象复制到另一个对象来在类之间共享功能，促进代码复用并减少重复。\n\
    \n< Good Code >\n\n```javascript\n// 可复用方法的混入\nconst canEat = {\n  eat: function()\
    \ {\n    console.log('Eating...');\n  }\n};\n\nconst canWalk = {\n  walk: function()\
    \ {\n    console.log('Walking...');\n  }\n};\n\n// 使用混入的类\nclass Person {\n  constructor(name)\
    \ {\n    this.name = name;\n  }\n}\n\n// 将混入的方法复制到类的原型上\nObject.assign(Person.prototype,\
    \ canEat, canWalk);\n\nconst person = new Person('John');\nperson.eat(); // Eating...\n\
    person.walk(); // Walking...\n```\n\n<Bad Code>\n\n```javascript\n// 不使用混入，在多个类中重复相同的方法\n\
    class Person {\n  constructor(name) {\n    this.name = name;\n  }\n  eat() {\n\
    \    console.log('Eating...');\n  }\n  walk() {\n    console.log('Walking...');\n\
    \  }\n}\n\nclass Animal {\n  constructor(type) {\n    this.type = type;\n  }\n\
    \  eat() {\n    console.log('Eating...');\n  }\n  walk() {\n    console.log('Walking...');\n\
    \  }\n}\n\nconst person = new Person('John');\nperson.eat(); // Eating...\nperson.walk();\
    \ // Walking...\n\nconst animal = new Animal('Dog');\nanimal.eat(); // Eating...\n\
    animal.walk(); // Walking...\n```\n\n在好的示例中，混入（`canEat` 和 `canWalk`）被用来向 `Person`\
    \ 类添加可复用的方法，减少了代码重复。坏的示例在多个类（`Person` 和 `Animal`）中重复了相同的方法，使代码更难维护。\n\n<Memo>\n\
    \n混入在像 JavaScript 这样不支持多重继承的语言中特别有用。\n\n# 99 使用继承来扩展现有类\n\n---\n\n继承允许基于现有类创建新类，复用代码并促进模块化。\n\
    \n"
- fmt: "\nWhen creating a new class that shares properties or methods with an existing\
    \ class, consider extending the existing class instead of duplicating code.\n\n\
    < Good Code >\n\n```javascript\nclass Animal {\n  constructor(name) {\n    this.name\
    \ = name;\n  }\n  speak() {\n    console.log(`${this.name} makes a sound.`);\n\
    \  }\n}\n\nclass Dog extends Animal {\n  constructor(name) {\n    super(name);\
    \ // Call the parent constructor\n  }\n  speak() {\n    console.log(`${this.name}\
    \ barks.`); // Override the parent method\n  }\n}\n\nconst animal = new Animal('Generic\
    \ Animal');\nconst dog = new Dog('Buddy');\nanimal.speak(); // Output: Generic\
    \ Animal makes a sound.\ndog.speak(); // Output: Buddy barks.\n```\n\n<Bad Code>\n\
    \n```javascript\nclass Animal {\n  constructor(name) {\n    this.name = name;\n\
    \  }\n  speak() {\n    console.log(`${this.name} makes a sound.`);\n  }\n}\n\n\
    class Dog {\n  constructor(name) {\n    this.name = name;\n  }\n  speak() {\n\
    \    console.log(`${this.name} barks.`);\n  }\n}\n\nconst animal = new Animal('Generic\
    \ Animal');\nconst dog = new Dog('Buddy');\nanimal.speak(); // Output: Generic\
    \ Animal makes a sound.\ndog.speak(); // Output: Buddy barks.\n```\n\nIn the good\
    \ code example, the `Dog` class extends the `Animal` class, inheriting its properties\
    \ and methods. The `super()` method is used to call the parent constructor and\
    \ initialize the `name` property. The `speak()` method is overridden in the `Dog`\
    \ class to provide a specific implementation for dogs.\n\nIn the bad code example,\
    \ the `Dog` class is defined separately, duplicating the `name` property and the\
    \ `speak()` method. This violates the DRY (Don't Repeat Yourself) principle and\
    \ makes it harder to maintain and extend the codebase.\n\nInheritance promotes\
    \ code reuse, modularity, and extensibility, making it easier to create new classes\
    \ based on existing ones while avoiding duplication.\n\n<Memo>\n\nInheritance\
    \ is one of the core principles of Object-Oriented Programming (OOP), along with\
    \ encapsulation and polymorphism.\n\n100\n\n# Leverage function composition for\
    \ creating complex functionality from simple functions\n\n* * *\n\nFunction composition\
    \ allows combining multiple simple functions to create more complex functionality,\
    \ promoting code reusability and modularity.\n\n* * *\n\nWhen dealing with complex\
    \ operations, consider breaking them down into smaller, reusable functions and\
    \ composing them together to achieve the desired functionality.\n\n< Good Code\
    \ >\n\n```javascript\nconst addTax = (amount) => amount * 1.08;\nconst formatCurrency\
    \ = (amount) => `$${amount.toFixed(2)}`;\n\nconst calculateTotal = (items) =>\n\
    \  items\n    .map((item) => item.price)\n    .reduce((total, price) => total\
    \ + price, 0)\n    .then(addTax)\n    .then(formatCurrency);\n\nconst items =\
    \ [\n  { name: 'Item 1', price: 10 },\n  { name: 'Item 2', price: 20 },\n  { name:\
    \ 'Item 3', price: 30 },\n];\n\nconst total = calculateTotal(items);\nconsole.log(total);\
    \ // Output: $64.80\n```\n\n<Bad Code>\n\n```javascript\nconst calculateTotal\
    \ = (items) => {\n  let total = 0;\n  for (const item of items) {\n    total +=\
    \ item.price;\n  }\n  total *= 1.08;\n  return `$${total.toFixed(2)}`;\n};\n\n\
    const items = [\n  { name: 'Item 1', price: 10 },\n  { name: 'Item 2', price:\
    \ 20 },\n  { name: 'Item 3', price: 30 },\n];\n\nconst total = calculateTotal(items);\n\
    console.log(total); // Output: $64.80\n```\n\nIn the good code example, the `calculateTotal`\
    \ function is composed of three smaller functions: `map` to extract the prices\
    \ from the items, `reduce` to sum the prices, `addTax` to apply the tax rate,\
    \ and `formatCurrency` to format the total as a currency string. Each function\
    \ has a single responsibility, making the code more readable, testable, and maintainable.\n\
    \nIn the bad code example, the `calculateTotal` function contains all the logic\
    \ in a single function, making it harder to read, test, and reuse parts of the\
    \ functionality.\n\nFunction composition promotes code reusability, modularity,\
    \ and testability, making it easier to create complex functionality by combining\
    \ smaller, focused functions.\n\n<Memo>\n\nFunction composition is a fundamental\
    \ concept in functional programming, where functions are treated as first-class\
    \ citizens and can be passed as arguments to other functions or returned from\
    \ functions.\n\n101\n\n# Use default parameters to handle missing arguments\n\n\
    * * *\n\nProvide default values for function parameters to handle cases where\
    \ arguments are missing or undefined.\n\n* * *\n\nWhen calling a function without\
    \ providing all required arguments, JavaScript will assign `undefined` to the\
    \ missing parameters. This can lead to errors or unexpected behavior. Default\
    \ parameters allow you to specify a fallback value for missing arguments.\n\n\
    < Good Code >\n\n```javascript\nfunction greet(name = 'Guest') {\n  console.log(`Hello,\
    \ ${name}!`);\n}\n\ngreet('John'); // Output: Hello, John!\ngreet(); // Output:\
    \ Hello, Guest!\n```\n\n<Bad Code>\n\n```javascript\nfunction greet(name) {\n\
    \  const nameToUse = name || 'Guest';\n  console.log(`Hello, ${nameToUse}!`);\n\
    }\n\ngreet('John'); // Output: Hello, John!\ngreet(); // Output: Hello, Guest!\n\
    greet(undefined); // Output: Hello, Guest!\n```\n\nIn the good code example, the\
    \ `name` parameter has a default value of `'Guest'`. If no argument is provided\
    \ when calling `greet()`, the default value is used. This approach is more concise\
    \ and easier to read than the bad code example, which uses a logical OR operator\
    \ to handle the missing argument case.\n\n<Memo>\n\nDefault parameters were introduced\
    \ in ECMAScript 2015 (ES6).\n\n102\n\n# Avoid side effects to make functions reusable\n\
    \n* * *\n\nWrite pure functions that don't modify external state or data to ensure\
    \ they are reusable and predictable.\n\n* * *\n\nA pure function is a function\
    \ that, given the same inputs, will always return the same output and has no side\
    \ effects. Side effects are changes to external state or data outside the function's\
    \ scope. Avoiding side effects makes functions easier to reason about, test, and\
    \ reuse in different contexts.\n\n< Good Code >\n\n```javascript\nconst addNumbers\
    \ = (a, b) => a + b;\nconst result = addNumbers(2, 3); // result is 5\n```\n\n\
    <Bad Code>\n\n```javascript\nlet counter = 0;\nconst incrementCounter = () =>\
    \ {\n  counter++;\n  return counter;\n}\n\nconst result = incrementCounter();\
    \ // result is 1\nconst anotherResult = incrementCounter(); // anotherResult is\
    \ 2\n```\n\nIn the good code example, `addNumbers` is a pure function that takes\
    \ two numbers as input and returns their sum without modifying any external state.\
    \ In the bad code example, `incrementCounter` modifies the external `counter`\
    \ variable, making it impure and harder to reason about and test in isolation.\n\
    \n<Memo>\n\nPure functions are a core concept in functional programming and are\
    \ often used in reactive programming and state management libraries like React\
    \ and Redux.\n\nAfterword\n\n◆\n\nThank you for taking the time to read through\
    \ this collection of 100 techniques aimed at enhancing the readability of your\
    \ JavaScript code.\n\nThroughout this book, we have explored various methods to\
    \ write cleaner and more understandable code by leveraging JavaScript's unique\
    \ features and syntax.\n\nOur goal has been to equip you with practical strategies\
    \ that make your code not only functional but also easy for others to read and\
    \ maintain.\n\nEach technique presented includes both good and bad examples, providing\
    \ clear contrasts to help you grasp the principles of writing readable code.\n\
    \nWe hope these examples have been instructive and have given you a solid foundation\
    \ to improve your coding practices.\n\nWe trust that the insights and tips shared\
    \ in this book will serve you well in your programming journey, making your code\
    \ more accessible and enjoyable for everyone who encounters it.\n\nHappy coding!\n"
  raw: 'When creating a new class that shares properties or methods with an existing
    class, consider extending the existing class instead of duplicating code.


    < Good Code >


    class Animal {


      constructor(name) {


        this.name = name;


      }


      speak() {


        console.log(`${this.name} makes a sound.`);


      }


    }


    class Dog extends Animal {


      constructor(name) {


        super(name); // Call the parent constructor


      }


      speak() {


        console.log(`${this.name} barks.`); // Override the parent method


      }


    }


    const animal = new Animal(''Generic Animal'');


    const dog = new Dog(''Buddy'');


    animal.speak(); // Output: Generic Animal makes a sound.


    dog.speak(); // Output: Buddy barks.


    <Bad Code>


    class Animal {


      constructor(name) {


        this.name = name;


      }


      speak() {


        console.log(`${this.name} makes a sound.`);


      }


    }


    class Dog {


      constructor(name) {


        this.name = name;


      }


      speak() {


        console.log(`${this.name} barks.`);


      }


    }


    const animal = new Animal(''Generic Animal'');


    const dog = new Dog(''Buddy'');


    animal.speak(); // Output: Generic Animal makes a sound.


    dog.speak(); // Output: Buddy barks.


    In the good code example, the Dog class extends the Animal class, inheriting its
    properties and methods. The super() method is used to call the parent constructor
    and initialize the name property. The speak() method is overridden in the Dog
    class to provide a specific implementation for dogs.


    In the bad code example, the Dog class is defined separately, duplicating the
    name property and the speak() method. This violates the DRY (Don''t Repeat Yourself)
    principle and makes it harder to maintain and extend the codebase.


    Inheritance promotes code reuse, modularity, and extensibility, making it easier
    to create new classes based on existing ones while avoiding duplication.


    <Memo>


    Inheritance is one of the core principles of Object-Oriented Programming (OOP),
    along with encapsulation and polymorphism.


    100


    # Leverage function composition for creating complex functionality from simple
    functions


    * * *


    Function composition allows combining multiple simple functions to create more
    complex functionality, promoting code reusability and modularity.


    * * *


    When dealing with complex operations, consider breaking them down into smaller,
    reusable functions and composing them together to achieve the desired functionality.


    < Good Code >


    const addTax = (amount) => amount * 1.08;


    const formatCurrency = (amount) => `$${amount.toFixed(2)}`;


    const calculateTotal = (items) =>


      items


        .map((item) => item.price)


        .reduce((total, price) => total + price, 0)


        .then(addTax)


        .then(formatCurrency);


    const items = [


      { name: ''Item 1'', price: 10 },


      { name: ''Item 2'', price: 20 },


      { name: ''Item 3'', price: 30 },


    ];


    const total = calculateTotal(items);


    console.log(total); // Output: $64.80


    <Bad Code>


    const calculateTotal = (items) => {


      let total = 0;


      for (const item of items) {


        total += item.price;


      }


      total *= 1.08;


      return `$${total.toFixed(2)}`;


    };


    const items = [


      { name: ''Item 1'', price: 10 },


      { name: ''Item 2'', price: 20 },


      { name: ''Item 3'', price: 30 },


    ];


    const total = calculateTotal(items);


    console.log(total); // Output: $64.80


    In the good code example, the calculateTotal function is composed of three smaller
    functions: map to extract the prices from the items, reduce to sum the prices,
    addTax to apply the tax rate, and formatCurrency to format the total as a currency
    string. Each function has a single responsibility, making the code more readable,
    testable, and maintainable.


    In the bad code example, the calculateTotal function contains all the logic in
    a single function, making it harder to read, test, and reuse parts of the functionality.


    Function composition promotes code reusability, modularity, and testability, making
    it easier to create complex functionality by combining smaller, focused functions.


    <Memo>


    Function composition is a fundamental concept in functional programming, where
    functions are treated as first-class citizens and can be passed as arguments to
    other functions or returned from functions.


    101


    # Use default parameters to handle missing arguments


    * * *


    Provide default values for function parameters to handle cases where arguments
    are missing or undefined.


    * * *


    When calling a function without providing all required arguments, JavaScript will
    assign undefined to the missing parameters. This can lead to errors or unexpected
    behavior. Default parameters allow you to specify a fallback value for missing
    arguments.


    < Good Code >


    function greet(name = ''Guest'') {


      console.log(`Hello, ${name}!`);


    }


    greet(''John''); // Output: Hello, John!


    greet(); // Output: Hello, Guest!


    <Bad Code>


    function greet(name) {


      const nameToUse = name || ''Guest'';


      console.log(`Hello, ${nameToUse}!`);


    }


    greet(''John''); // Output: Hello, John!


    greet(); // Output: Hello, Guest!


    greet(undefined); // Output: Hello, Guest!


    In the good code example, the name parameter has a default value of ''Guest''.
    If no argument is provided when calling greet(), the default value is used. This
    approach is more concise and easier to read than the bad code example, which uses
    a logical OR operator to handle the missing argument case.


    <Memo>


    Default parameters were introduced in ECMAScript 2015 (ES6).


    102


    # Avoid side effects to make functions reusable


    * * *


    Write pure functions that don''t modify external state or data to ensure they
    are reusable and predictable.


    * * *


    A pure function is a function that, given the same inputs, will always return
    the same output and has no side effects. Side effects are changes to external
    state or data outside the function''s scope. Avoiding side effects makes functions
    easier to reason about, test, and reuse in different contexts.


    < Good Code >


    const addNumbers = (a, b) => a + b;


    const result = addNumbers(2, 3); // result is 5


    <Bad Code>


    let counter = 0;


    const incrementCounter = () => {


      counter++;


      return counter;


    }


    const result = incrementCounter(); // result is 1


    const anotherResult = incrementCounter(); // anotherResult is 2


    In the good code example, addNumbers is a pure function that takes two numbers
    as input and returns their sum without modifying any external state. In the bad
    code example, incrementCounter modifies the external counter variable, making
    it impure and harder to reason about and test in isolation.


    <Memo>


    Pure functions are a core concept in functional programming and are often used
    in reactive programming and state management libraries like React and Redux.


    Afterword


    ◆


    Thank you for taking the time to read through this collection of 100 techniques
    aimed at enhancing the readability of your JavaScript code.


    Throughout this book, we have explored various methods to write cleaner and more
    understandable code by leveraging JavaScript''s unique features and syntax.


    Our goal has been to equip you with practical strategies that make your code not
    only functional but also easy for others to read and maintain.


    Each technique presented includes both good and bad examples, providing clear
    contrasts to help you grasp the principles of writing readable code.


    We hope these examples have been instructive and have given you a solid foundation
    to improve your coding practices.


    We trust that the insights and tips shared in this book will serve you well in
    your programming journey, making your code more accessible and enjoyable for everyone
    who encounters it.


    Happy coding!'
