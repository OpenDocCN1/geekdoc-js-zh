    // Unit test for the add function


    function testAdd() {


      console.assert(add(2, 3) === 5, ''Test failed: 2 + 3 should equal 5'');


      console.assert(add(-1, 1) === 0, ''Test failed: -1 + 1 should equal 0'');


      console.assert(add(0, 0) === 0, ''Test failed: 0 + 0 should equal 0'');


    }


    testAdd();


    <Bad Code>


    // Function to add two numbers


    function add(a, b) {


      return a + b;


    }


    // No unit tests provided


    Good Code: The good example includes a simple add function and a corresponding
    testAdd function that checks multiple cases to ensure the add function works correctly.
    This makes it easy to verify the function''s correctness and catch any errors
    early.


    Bad Code: The bad example lacks any unit tests, making it difficult to ensure
    the add function works as expected. Without tests, any changes to the function
    could introduce bugs that go unnoticed.


    <Memo>


    Unit tests are a fundamental part of Test-Driven Development (TDD), a software
    development process where tests are written before the actual code.


    66


    # Leverage JavaScript modules (ES6 import/export) for better code organization.


    * * *


    Using JavaScript modules helps in organizing code into reusable and maintainable
    pieces.


    * * *


    JavaScript modules allow you to split your code into separate files, each responsible
    for a specific functionality. This improves code readability and maintainability.


    < Good Code >


    // math.js - Module file


    export function add(a, b) {


      return a + b;


    }


    export function subtract(a, b) {


      return a - b;


    }


    // main.js - Main file


    import { add, subtract } from ''./math.js'';


    console.log(add(2, 3)); // 5


    console.log(subtract(5, 2)); // 3


    <Bad Code>


    // All functions in one file


    function add(a, b) {


      return a + b;


    }


    function subtract(a, b) {


      return a - b;


    }


    console.log(add(2, 3)); // 5


    console.log(subtract(5, 2)); // 3


    Good Code: The good example uses ES6 modules to separate the add and subtract
    functions into a math.js file, which is then imported into the main.js file. This
    separation of concerns makes the code more modular, easier to read, and maintain.


    Bad Code: The bad example places all functions in a single file, which can become
    unwieldy as the codebase grows. It makes it harder to manage and understand the
    code, especially in larger projects.


    <Memo>


    ES6 modules are statically analyzed, meaning that the import/export statements
    are checked at compile time, which can help catch errors early.


    67


    # Use async functions for cleaner asynchronous code


    * * *


    Async functions provide a cleaner syntax for writing asynchronous code, making
    it easier to read and maintain.


    * * *


    Instead of using callbacks or Promise chains, async functions allow you to write
    asynchronous code that looks and behaves similar to synchronous code.


    < Good Code >


    async function fetchData() {


      try {


        const response = await fetch(''https://api.example.com/data'');


        const data = await response.json();


        console.log(data);


      } catch (error) {


        console.error(''Error fetching data:'', error);


      }


    }


    fetchData();


    <Bad Code>


    function fetchData() {


      fetch(''https://api.example.com/data'')


        .then(response => response.json())


        .then(data => console.log(data))


        .catch(error => console.error(''Error fetching data:'', error));


    }


    fetchData();


    The async keyword before a function makes it an async function. Inside an async
    function, you can use the await keyword to pause the execution and wait for a
    Promise to resolve before continuing. This makes the code more readable and easier
    to reason about, as it avoids deeply nested callbacks or Promise chains. The try...catch
    block is used to handle any errors that may occur during the asynchronous operation.


    <Memo>


    Async functions were introduced in ECMAScript 2017 (ES8) and provide syntactic
    sugar over Promises.


    68


    # Take advantage of for...of for iterable objects


    * * *


    The for...of loop provides a concise way to iterate over iterable objects, making
    your code more readable and expressive.


    * * *


    The for...of loop is designed to iterate over iterable objects, such as arrays,
    strings, maps, sets, and other objects that implement the iterable protocol.


    < Good Code >


    const fruits = [''apple'', ''banana'', ''orange''];


    for (const fruit of fruits) {


      console.log(fruit);


    }


