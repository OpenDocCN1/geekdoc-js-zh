  trans: "\n\n```javascript\n    }\n}\n\nconst status = 'error';\nconsole.log(getStatusMessage(status));\
    \ // 输出：There was an error.\n```\n\n### 糟糕的代码\n```javascript\n// 链式使用多个三元运算符\n\
    function getStatusMessage(status) {\n    return status === 'success' ? '操作成功。'\
    \ :\n           status === 'error' ? '出现错误。' :\n           status === 'loading'\
    \ ? '加载中...' :\n           '未知状态。';\n}\n\nconst status = 'error';\nconsole.log(getStatusMessage(status));\
    \ // 输出：出现错误。\n```\n\n在好的示例中，使用 `if-else` 语句使逻辑清晰易懂。在糟糕的示例中，链式使用多个三元运算符使代码更难阅读和理解，尤其对于不熟悉该语法的人。\n\
    \n**备忘：**\n三元运算符适用于简单的条件赋值，但对于更复杂的逻辑，通常更推荐使用 `if-else` 语句以提高可读性。\n\n---\n\n# 使用括号明确运算顺序\n\
    \n在代码中使用括号有助于明确运算顺序，使他人更容易理解和维护。\n\n编写复杂表达式时，运算的执行顺序有时可能不清晰。使用括号可以确保意图明确，减少出错的可能性并提高可读性。\n\
    \n### 好的代码\n```javascript\n// 好：使用括号使运算顺序清晰\nlet result = (a + b) * (c - d); //\
    \ 先做加法和减法，再做乘法\n```\n\n### 糟糕的代码\n```javascript\n// 差：运算顺序不直观\nlet result = a\
    \ + b * c - d; // 乘法先执行，但一眼看不出来\n```\n\n在好的示例中，使用括号明确指定了运算的执行顺序，使代码更易读易懂。在糟糕的示例中，缺少括号使得确定运算顺序更加困难，可能导致误解和潜在错误。\n\
    \n**备忘：**\n在 JavaScript 中，运算顺序遵循标准数学规则：乘法和除法优先于加法和减法。然而，使用括号可以覆盖此顺序以确保清晰。\n\n\
    ---\n\n# 将无关功能封装到独立函数中\n\n将无关功能封装到独立函数中可以提高代码的模块化、可读性和可维护性。\n\n当代码的不同部分执行不同任务时，最好将这些任务封装到独立的函数中。这种做法使代码更模块化、更易读，也更易于维护或调试。\n\
    \n### 好的代码\n```javascript\n// 好：将无关任务分离到独立函数\nfunction calculateSum(a, b) {\n\
    \    return a + b;\n}\n\nfunction printMessage(message) {\n    console.log(message);\n\
    }\n\nlet sum = calculateSum(5, 10);\nprintMessage(`总和是 ${sum}`);\n```\n\n### 糟糕的代码\n\
    ```javascript\n// 差：无关任务混合在单个函数中\nfunction calculateAndPrint(a, b) {\n    let\
    \ sum = a + b;\n    console.log(`总和是 ${sum}`);\n}\n\ncalculateAndPrint(5, 10);\n\
    ```\n\n在好的示例中，`calculateSum` 和 `printMessage` 函数各自执行单一、定义明确的任务。这种分离使代码更易于理解和维护。在糟糕的示例中，将计算和打印合并到一个函数中，降低了模块化程度，也更难复用或测试。\n\
    \n**备忘：**\n模块化代码是软件工程中的关键原则。它允许开发者在应用程序的不同部分复用函数，减少冗余并提高可维护性。\n\n---\n\n# 使用工具库处理常见任务\n\
    \n利用像 `Lodash` 这样的工具库来处理数组、对象、字符串等常见操作。\n\n与其为常见任务编写自定义函数，不如使用提供优化且经过充分测试实现的工具库。\n\
    \n### 好的代码\n```javascript\n// 使用 Lodash\nconst _ = require('lodash');\nconst numbers\
    \ = [1, 2, 3, 4, 5];\nconst doubledNumbers = _.map(numbers, n => n * 2); // [2,\
    \ 4, 6, 8, 10]\n\nconst users = [\n  { name: 'Alice', age: 25 },\n  { name: 'Bob',\
    \ age: 30 },\n  { name: 'Charlie', age: 35 }\n];\nconst userNames = _.map(users,\
    \ 'name'); // ['Alice', 'Bob', 'Charlie']\n```\n\n### 糟糕的代码\n```javascript\n//\
    \ 自定义实现\nconst numbers = [1, 2, 3, 4, 5];\nconst doubledNumbers = [];\nfor (let\
    \ i = 0; i < numbers.length; i++) {\n  doubledNumbers.push(numbers[i] * 2);\n\
    }\n\nconst users = [\n  { name: 'Alice', age: 25 },\n  { name: 'Bob', age: 30\
    \ },\n  { name: 'Charlie', age: 35 }\n];\nconst userNames = [];\nfor (let i =\
    \ 0; i < users.length; i++) {\n  userNames.push(users[i].name);\n}\n```\n\n像 `Lodash`\
    \ 这样的工具库提供了大量用于常见操作的函数，节省开发时间并减少代码重复。它们针对性能进行了优化，并经过全面测试，确保行为可靠。\n\n**备忘：**\n\
    `Lodash` 是 JavaScript 中流行的工具库，但也有其他替代方案，如 `Ramda` 和 `Underscore.js`。\n\n---\n\n\
    # 将重复代码抽象为可复用函数\n\n识别重复的代码模式，并将其提取为可复用的函数，以改善代码组织和可维护性。\n\n重复的代码会使代码库更难阅读和维护。通过将此类代码抽象为可复用的函数，可以提高代码清晰度并减少重复。\n\
    \n### 好的代码\n```javascript\nfunction calculateTotal(items, taxRate) {\n  let total\
    \ = 0;\n  for (const item of items) {\n    total += item.price;\n  }\n  return\
    \ total * (1 + taxRate);\n}\n\nconst cart1 = [\n  { name: '商品 1', price: 10 },\n\
    \  { name: '商品 2', price: 20 }\n];\nconst cart2 = [\n  { name: '商品 3', price:\
    \ 15 },\n  { name: '商品 4', price: 25 },\n  { name: '商品 5', price: 5 }\n];\n\n\
    const total1 = calculateTotal(cart1, 0.08); // 32.4\nconst total2 = calculateTotal(cart2,\
    \ 0.1); // 49.5\n```\n\n### 糟糕的代码\n```javascript\nconst cart1 = [\n  { name: '商品\
    \ 1', price: 10 },\n  { name: '商品 2', price: 20 }\n];\nconst cart2 = [\n  { name:\
    \ '商品 3', price: 15 },\n  { name: '商品 4', price: 25 },\n  { name: '商品 5', price:\
    \ 5 }\n];\n\nlet total1 = 0;\nfor (const item of cart1) {\n  total1 += item.price;\n\
    }\ntotal1 *= 1.08; // 32.4\n\nlet total2 = 0;\nfor (const item of cart2) {\n \
    \ total2 += item.price;\n}\ntotal2 *= 1.1; // 49.5\n```\n\n通过将重复代码提取到函数中，可以在代码库的多个地方复用该函数。这不仅减少了重复，还使代码更易读、更易维护。如果逻辑需要更新，只需在一个地方修改即可。\n\
    \n**备忘：**\n“不要重复自己”（DRY）原则是软件工程中的一个基本概念，它鼓励代码复用和抽象以减少冗余。\n\n---\n\n# 将数据获取逻辑与\
    \ UI 渲染逻辑分离\n\n将数据获取和 UI 渲染放在独立的函数或组件中。\n\n将数据获取与 UI 渲染分离有助于维护清晰且易于管理的代码库。它使组件更易于测试、调试和复用。\n\
    \n### 好的代码\n```javascript\n// 数据获取函数\nasync function fetchData(url) {\n  const\
    \ response = await fetch(url);\n  const data = await response.json();\n  return\
    \ data;\n}\n\n// UI 渲染函数\nfunction renderUI(data) {\n  const container = document.getElementById('container');\n\
    \  container.innerHTML = data.map(item => `<p>${item.name}</p>`).join('');\n}\n\
    \n// 主函数\nasync function main() {\n  const data = await fetchData('https://api.example.com/data');\n\
    \  renderUI(data);\n}\n\nmain();\n```\n\n### 糟糕的代码\n```javascript\nasync function\
    \ main() {\n  const response = await fetch('https://api.example.com/data');\n\
    \  const data = await response.json();\n  const container = document.getElementById('container');\n\
    \  container.innerHTML = data.map(item => `<p>${item.name}</p>`).join('');\n}\n\
    \nmain();\n```\n\n"
- fmt: "\nIn the good example, the data fetching logic is separated from the UI rendering\
    \ logic, making the code more modular and easier to maintain. In the bad example,\
    \ both logics are mixed in a single function, which can lead to difficulties in\
    \ testing and debugging.\n\n> **Memo**: This separation of concerns is a fundamental\
    \ principle in software engineering, often referred to as the Single Responsibility\
    \ Principle (SRP).\n\n# Use design patterns to solve common problems\n\nImplement\
    \ design patterns to address recurring problems in a standardized way. Design\
    \ patterns provide proven solutions to common problems in software design. Using\
    \ them can improve code readability, reusability, and maintainability.\n\n###\
    \ Good Code\n```javascript\n// Singleton Pattern\nclass Singleton {\n  constructor()\
    \ {\n    if (!Singleton.instance) {\n      Singleton.instance = this;\n    }\n\
    \    return Singleton.instance;\n  }\n  // Example method\n  log() {\n    console.log('Singleton\
    \ instance');\n  }\n}\nconst instance1 = new Singleton();\nconst instance2 = new\
    \ Singleton();\nconsole.log(instance1 === instance2); // true\n```\n\n```\n\n\
    ### Bad Code\n```javascript\nclass Singleton {\n  constructor() {\n    // No instance\
    \ check\n  }\n  // Example method\n  log() {\n    console.log('Singleton instance');\n\
    \  }\n}\nconst instance1 = new Singleton();\nconst instance2 = new Singleton();\n\
    console.log(instance1 === instance2); // false\n```\n\nIn the good example, the\
    \ `Singleton` pattern ensures that only one instance of the class is created,\
    \ which is useful for managing global state. In the bad example, the `Singleton`\
    \ pattern is not correctly implemented, leading to multiple instances and potential\
    \ issues with state management.\n\n> **Memo**: The `Singleton` pattern is one\
    \ of the 23 design patterns introduced by the \"Gang of Four\" in their seminal\
    \ book \"Design Patterns: Elements of Reusable Object-Oriented Software.\"\n\n\
    # Utilize the async keyword for asynchronous functions\n\nUsing the `async` keyword\
    \ makes a function return a promise, enabling asynchronous operations. The `async`\
    \ keyword is used to define an asynchronous function, which allows you to write\
    \ asynchronous code in a more readable and maintainable way.\n\n### Good Code\n\
    ```javascript\n// Good example using async keyword\nasync function fetchData()\
    \ {\n  try {\n    const response = await fetch('https://api.example.com/data');\n\
    \    const data = await response.json();\n    console.log(data);\n  } catch (error)\
    \ {\n    console.error('Error fetching data:', error);\n  }\n}\nfetchData();\n\
    ```\n\n### Bad Code\n```javascript\n// Bad example without async keyword\nfunction\
    \ fetchData() {\n  fetch('https://api.example.com/data')\n    .then(response =>\
    \ response.json())\n    .then(data => {\n      console.log(data);\n    })\n  \
    \  .catch(error => {\n      console.error('Error fetching data:', error);\n  \
    \  });\n}\nfetchData();\n```\n\nThe good example uses the `async` keyword to define\
    \ the `fetchData` function, making it return a promise and allowing the use of\
    \ `await` for asynchronous operations. This makes the code more readable and easier\
    \ to maintain. The bad example uses traditional promise chaining, which can become\
    \ harder to read and manage, especially with more complex asynchronous operations.\n\
    \n> **Memo**: The `async` keyword was introduced in ECMAScript 2017 (ES8) and\
    \ has since become a standard way to handle asynchronous operations in JavaScript.\n\
    \n# Make use of the await keyword for handling promises\n\nThe `await` keyword\
    \ pauses the execution of an `async` function until the promise is resolved, making\
    \ asynchronous code look synchronous. The `await` keyword is used inside an `async`\
    \ function to wait for a promise to resolve, simplifying the handling of asynchronous\
    \ operations.\n\n### Good Code\n```javascript\n// Good example using await keyword\n\
    async function getUserData(userId) {\n  try {\n    const response = await fetch(`https://api.example.com/users/${userId}`);\n\
    \    const user = await response.json();\n    console.log(user);\n  } catch (error)\
    \ {\n    console.error('Error fetching user data:', error);\n  }\n}\ngetUserData(1);\n\
    ```\n\n### Bad Code\n```javascript\n// Bad example without await keyword\nfunction\
    \ getUserData(userId) {\n  fetch(`https://api.example.com/users/${userId}`)\n\
    \    .then(response => response.json())\n    .then(user => {\n      console.log(user);\n\
    \    })\n    .catch(error => {\n      console.error('Error fetching user data:',\
    \ error);\n    });\n}\ngetUserData(1);\n```\n\nThe good example uses the `await`\
    \ keyword to wait for the `fetch` operation and the JSON parsing to complete,\
    \ making the code more readable and easier to follow. The bad example uses promise\
    \ chaining, which can lead to nested and harder-to-read code, especially with\
    \ multiple asynchronous operations.\n\n> **Memo**: The `await` keyword can only\
    \ be used inside functions marked with the `async` keyword. It was also introduced\
    \ in ECMAScript 2017 (ES8) along with the `async` keyword.\n\n# Use JSON.stringify\
    \ and JSON.parse for deep copying objects\n\nUtilize `JSON.stringify` and `JSON.parse`\
    \ to create a deep copy of an object, ensuring that nested objects and arrays\
    \ are also copied.\n\nWhen working with objects in JavaScript, it's important\
    \ to understand the difference between shallow and deep copying. A shallow copy\
    \ creates a new object with references to the same nested objects and arrays as\
    \ the original. In contrast, a deep copy creates a new object with entirely new\
    \ instances of nested objects and arrays.\n\n### Good Code\n```javascript\n//\
    \ Original object\nconst original = {\n  name: 'John',\n  age: 30,\n  hobbies:\
    \ ['reading', 'hiking'],\n  address: {\n    street: '123 Main St',\n    city:\
    \ 'Anytown'\n  }\n};\n// Deep copy using JSON.stringify and JSON.parse\nconst\
    \ deepCopy = JSON.parse(JSON.stringify(original));\n// Modify the nested object\
    \ in the original\noriginal.address.city = 'New City';\nconsole.log('Original:',\
    \ original);\n// Output: Original: { name: 'John', age: 30, hobbies: ['reading',\
    \ 'hiking'], address: { street: '123 Main St', city: 'New City' } }\nconsole.log('Deep\
    \ Copy:', deepCopy);\n// Output: Deep Copy: { name: 'John', age: 30, hobbies:\
    \ ['reading', 'hiking'], address: { street: '123 Main St', city: 'Anytown' } }\n\
    ```\n\n### Bad Code\n```javascript\n// Original object\nconst original = {\n \
    \ name: 'John',\n  age: 30,\n  hobbies: ['reading', 'hiking'],\n  address: {\n\
    \    street: '123 Main St',\n    city: 'Anytown'\n  }\n};\n// Shallow copy using\
    \ spread operator\nconst shallowCopy = { ...original };\n// Modify the nested\
    \ object in the original\noriginal.address.city = 'New City';\nconsole.log('Original:',\
    \ original);\n// Output: Original: { name: 'John', age: 30, hobbies: ['reading',\
    \ 'hiking'], address: { street: '123 Main St', city: 'New City' } }\nconsole.log('Shallow\
    \ Copy:', shallowCopy);\n// Output: Shallow Copy: { name: 'John', age: 30, hobbies:\
    \ ['reading', 'hiking'], address: { street: '123 Main St', city: 'New City' }\
    \ }\n```\n\nThe `JSON.stringify` method converts a JavaScript object or value\
    \ to a JSON string, while `JSON.parse` takes a JSON string and transforms it into\
    \ a JavaScript object. By combining these two methods, we can create a deep copy\
    \ of an object.\n\nIn the good code example, we first create an original object\
    \ with nested objects and arrays. We then use `JSON.parse(JSON.stringify(original))`\
    \ to create a deep copy of the original object. When we modify the nested `address.city`\
    \ property in the original object, the deep copy remains unaffected, demonstrating\
    \ that it is a separate instance.\n\nIn the bad code example, we attempt to create\
    \ a copy using the spread operator (`{ ...original }`). However, this approach\
    \ only creates a shallow copy, where nested objects and arrays are still referenced\
    \ from the original object. As a result, when we modify the nested `address.city`\
    \ property in the original object, the shallow copy is also affected because it\
    \ shares the same reference to the nested `address` object.\n"
  raw: 'In the good example, the data fetching logic is separated from the UI rendering
    logic, making the code more modular and easier to maintain. In the bad example,
    both logics are mixed in a single function, which can lead to difficulties in
    testing and debugging.


    <Memo>


    This separation of concerns is a fundamental principle in software engineering,
    often referred to as the Single Responsibility Principle (SRP).


    80


    # Use design patterns to solve common problems


    * * *


    Implement design patterns to address recurring problems in a standardized way.


    * * *


    Design patterns provide proven solutions to common problems in software design.
    Using them can improve code readability, reusability, and maintainability.


    < Good Code >


    // Singleton Pattern


    class Singleton {


      constructor() {


        if (!Singleton.instance) {


          Singleton.instance = this;


        }


        return Singleton.instance;


      }


      // Example method


      log() {


        console.log(''Singleton instance'');


      }


    }


    const instance1 = new Singleton();


    const instance2 = new Singleton();


    console.log(instance1 === instance2); // true


    <Bad Code>


    class Singleton {


      constructor() {


        // No instance check


      }


      // Example method


      log() {


        console.log(''Singleton instance'');


      }


    }


    const instance1 = new Singleton();


    const instance2 = new Singleton();


    console.log(instance1 === instance2); // false


    In the good example, the Singleton pattern ensures that only one instance of the
    class is created, which is useful for managing global state. In the bad example,
    the Singleton pattern is not correctly implemented, leading to multiple instances
    and potential issues with state management.


    <Memo>


    The Singleton pattern is one of the 23 design patterns introduced by the "Gang
    of Four" in their seminal book "Design Patterns: Elements of Reusable Object-Oriented
    Software."


    81


    # Utilize the async keyword for asynchronous functions.


    * * *


    Using the async keyword makes a function return a promise, enabling asynchronous
    operations.


    * * *


    The async keyword is used to define an asynchronous function, which allows you
    to write asynchronous code in a more readable and maintainable way.


    < Good Code >


    // Good example using async keyword


    async function fetchData() {


      try {


        const response = await fetch(''https://api.example.com/data'');


        const data = await response.json();


        console.log(data);


      } catch (error) {


        console.error(''Error fetching data:'', error);


      }


    }


    fetchData();


    <Bad Code>


    // Bad example without async keyword


    function fetchData() {


      fetch(''https://api.example.com/data'')


        .then(response => response.json())


        .then(data => {


          console.log(data);


        })


        .catch(error => {


          console.error(''Error fetching data:'', error);


        });


    }


    fetchData();


    The good example uses the async keyword to define the fetchData function, making
    it return a promise and allowing the use of await for asynchronous operations.
    This makes the code more readable and easier to maintain. The bad example uses
    traditional promise chaining, which can become harder to read and manage, especially
    with more complex asynchronous operations.


    <Memo>


    The async keyword was introduced in ECMAScript 2017 (ES8) and has since become
    a standard way to handle asynchronous operations in JavaScript.


    82


    # Make use of the await keyword for handling promises.


    * * *


    The await keyword pauses the execution of an async function until the promise
    is resolved, making asynchronous code look synchronous.


    * * *


    The await keyword is used inside an async function to wait for a promise to resolve,
    simplifying the handling of asynchronous operations.


    < Good Code >


    // Good example using await keyword


    async function getUserData(userId) {


      try {


        const response = await fetch(`https://api.example.com/users/${userId}`);


        const user = await response.json();


        console.log(user);


      } catch (error) {


        console.error(''Error fetching user data:'', error);


      }


    }


    getUserData(1);


    <Bad Code>


    // Bad example without await keyword


    function getUserData(userId) {


      fetch(`https://api.example.com/users/${userId}`)


        .then(response => response.json())


        .then(user => {


          console.log(user);


        })


        .catch(error => {


          console.error(''Error fetching user data:'', error);


        });


    }


    getUserData(1);


    The good example uses the await keyword to wait for the fetch operation and the
    JSON parsing to complete, making the code more readable and easier to follow.
    The bad example uses promise chaining, which can lead to nested and harder-to-read
    code, especially with multiple asynchronous operations.


    <Memo>


    The await keyword can only be used inside functions marked with the async keyword.
    It was also introduced in ECMAScript 2017 (ES8) along with the async keyword.


    83


    # Use JSON.stringify and JSON.parse for deep copying objects


    * * *


    Utilize JSON.stringify and JSON.parse to create a deep copy of an object, ensuring
    that nested objects and arrays are also copied.


    * * *


    When working with objects in JavaScript, it''s important to understand the difference
    between shallow and deep copying. A shallow copy creates a new object with references
    to the same nested objects and arrays as the original. In contrast, a deep copy
    creates a new object with entirely new instances of nested objects and arrays.


    < Good Code >


    // Original object


    const original = {


      name: ''John'',


      age: 30,


      hobbies: [''reading'', ''hiking''],


      address: {


        street: ''123 Main St'',


        city: ''Anytown''


      }


    };


    // Deep copy using JSON.stringify and JSON.parse


    const deepCopy = JSON.parse(JSON.stringify(original));


    // Modify the nested object in the original


    original.address.city = ''New City'';


    console.log(''Original:'', original);


    // Output: Original: { name: ''John'', age: 30, hobbies: [''reading'', ''hiking''],
    address: { street: ''123 Main St'', city: ''New City'' } }


    console.log(''Deep Copy:'', deepCopy);


    // Output: Deep Copy: { name: ''John'', age: 30, hobbies: [''reading'', ''hiking''],
    address: { street: ''123 Main St'', city: ''Anytown'' } }


    <Bad Code>


    // Original object


    const original = {


      name: ''John'',


      age: 30,


      hobbies: [''reading'', ''hiking''],


      address: {


        street: ''123 Main St'',


        city: ''Anytown''


      }


    };


    // Shallow copy using spread operator


    const shallowCopy = { ...original };


    // Modify the nested object in the original


    original.address.city = ''New City'';


    console.log(''Original:'', original);


    // Output: Original: { name: ''John'', age: 30, hobbies: [''reading'', ''hiking''],
    address: { street: ''123 Main St'', city: ''New City'' } }


    console.log(''Shallow Copy:'', shallowCopy);


    // Output: Shallow Copy: { name: ''John'', age: 30, hobbies: [''reading'', ''hiking''],
    address: { street: ''123 Main St'', city: ''New City'' } }


    The JSON.stringify method converts a JavaScript object or value to a JSON string,
    while JSON.parse takes a JSON string and transforms it into a JavaScript object.
    By combining these two methods, we can create a deep copy of an object.


    In the good code example, we first create an original object with nested objects
    and arrays. We then use JSON.parse(JSON.stringify(original)) to create a deep
    copy of the original object. When we modify the nested address.city property in
    the original object, the deep copy remains unaffected, demonstrating that it is
    a separate instance.


    In the bad code example, we attempt to create a copy using the spread operator
    ({ ...original }). However, this approach only creates a shallow copy, where nested
    objects and arrays are still referenced from the original object. As a result,
    when we modify the nested address.city property in the original object, the shallow
    copy is also affected because it shares the same reference to the nested address
    object.'
