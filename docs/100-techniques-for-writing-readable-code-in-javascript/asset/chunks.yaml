    \ 自动强制执行唯一性。\n\n## 19. 利用可选链（optional chaining）处理嵌套对象属性。\n\n使用可选链安全地访问深层嵌套的对象属性，而不会导致程序报错。\n\
    \n可选链允许你在无需检查每一层是否存在的情况下访问对象的嵌套属性，使你的代码更简洁、更具可读性。\n\n### 好的代码\n```javascript\n\
    // Good example using optional chaining\nconst user = {\n  profile: {\n    address:\
