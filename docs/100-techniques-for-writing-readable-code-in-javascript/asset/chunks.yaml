    # Use consistent naming conventions throughout the codebase.


    * * *


    Adopt a uniform naming convention for variables, functions, and classes to enhance
    code readability and maintainability.


    * * *


    Consistent naming conventions help developers understand the purpose of variables
    and functions quickly, reducing the cognitive load when reading and maintaining
    the code.


    < Good Code >


    // Using camelCase for variables and functions, PascalCase for classes


    let userName = ''JohnDoe'';


    function getUserName() {


        return userName;


    }


    class UserProfile {


        constructor(name) {


            this.name = name;


        }


    }


    <Bad Code>


    // Inconsistent naming conventions


    let User_name = ''JohnDoe'';


    function GetuserName() {


        return User_name;


    }


    class userprofile {


        constructor(Name) {


            this.Name = Name;


        }


    }


    In the good example, camelCase is used for variables and functions, and PascalCase
    is used for classes, making the code more predictable and easier to read. In the
    bad example, inconsistent naming conventions make the code harder to follow and
    maintain.


    <Memo>


    JavaScript does not enforce any specific naming conventions, but following a consistent
    style, such as camelCase for variables and functions and PascalCase for classes,
    is a widely accepted best practice.


    14


    # Avoid using magic numbers; use named constants instead.


    * * *


    Replace magic numbers with named constants to make the code more understandable
    and easier to maintain.


    * * *


    Magic numbers are hard-coded values that lack context. Using named constants provides
    meaningful names that explain the purpose of these values.


    < Good Code >


    // Using named constants


    const MAX_USERS = 100;


    const TIMEOUT_DURATION = 5000;


    function canAddUser(currentUserCount) {


        return currentUserCount < MAX_USERS;


    }


    setTimeout(() => {


        console.log(''Timeout reached'');


    }, TIMEOUT_DURATION);


    <Bad Code>


    // Using magic numbers


    function canAddUser(currentUserCount) {


        return currentUserCount < 100;


    }


    setTimeout(() => {


        console.log(''Timeout reached'');


    }, 5000);


    In the good example, named constants like MAX_USERS and TIMEOUT_DURATION provide
    context and make the code self-explanatory. In the bad example, the magic numbers
    100 and 5000 do not convey any meaning, making the code harder to understand and
    maintain.


    <Memo>


    The term "magic number" refers to the use of numeric literals directly in the
    code. This practice is discouraged because it can lead to errors and make the
    code less readable. Using named constants is a simple yet effective way to improve
    code quality.


    15


    # Ensure function names clearly describe their action.


    * * *


    Use descriptive function names that clearly convey the purpose and action of the
    function.


    * * *


    Functions should have names that make their purpose and behavior immediately clear
    to other developers reading the code.


    < Good Code >


    // Good example


    function calculateCircleArea(radius) {


      return Math.PI * radius * radius;


    }


    <Bad Code>


    // Bad example


    function doSomething(x) {


      return Math.PI * x * x;


    }


    The good example uses a descriptive name calculateCircleArea that clearly explains
    what the function does. The bad example uses a vague name doSomething that provides
    no information about the function''s purpose or behavior.


    <Memo>


    Descriptive function names improve code readability and maintainability.


    16


    # Utilize default function parameters for cleaner code.


    * * *


    Use default parameter values in function definitions to handle undefined or missing
    arguments.


    * * *


    Default function parameters allow you to provide default values for arguments,
    making the code more robust and easier to read.


    < Good Code >


    // Good example


    function greetUser(name = ''User'') {


      console.log(`Hello, ${name}!`);


    }


    greetUser(''Alice''); // Output: Hello, Alice!


    greetUser(); // Output: Hello, User!


    <Bad Code>


    // Bad example


    function greetUser(name) {


      const userName = name || ''User'';


      console.log(`Hello, ${userName}!`);


    }


    greetUser(''Alice''); // Output: Hello, Alice!


    greetUser(); // Output: Hello, undefined!


    In the good example, the greetUser function uses a default parameter value of
    ''User'' for the name argument. This ensures that the function behaves correctly
    even when called without an argument. The bad example uses a logical OR operator
    to handle the missing argument, but it can lead to unexpected behavior (e.g.,
    Hello, undefined!) and is less readable.


    <Memo>


    Default function parameters were introduced in ECMAScript 2015 (ES6) and provide
    a more concise and readable way to handle optional arguments.


    17


    # Use async/await for asynchronous code for better readability.


    * * *


    Async/await simplifies the syntax of asynchronous code, making it easier to read
    and maintain.


    * * *


    Using async/await in JavaScript can improve code readability and structure, making
    it more understandable than traditional promise chaining.


    < Good Code >


    // Fetching data with async/await


    async function fetchData() {


      try {


        const response = await fetch(''https://api.example.com/data'');


        const data = await response.json();


        console.log(data); // Output the fetched data


      } catch (error) {


        console.error(''Error fetching data:'', error);


      }


    }


    fetchData();


    <Bad Code>


    // Fetching data with promises


    function fetchData() {


      fetch(''https://api.example.com/data'')


        .then(response => response.json())


        .then(data => {


          console.log(data); // Output the fetched data


        })


        .catch(error => {


          console.error(''Error fetching data:'', error);


        });


    }


    fetchData();


    The good example uses async/await, making the asynchronous flow linear and easy
    to follow. The bad example uses promise chaining, which can become difficult to
    read and manage as the complexity increases. Async/await syntax makes error handling
    more straightforward and the code cleaner.


    <Memo>


    Async/await is syntactic sugar built on top of promises. It was introduced in
    ES2017 (ES8) and has since become the standard for writing asynchronous code in
    JavaScript.


    18


    # Employ Map and Set for collections instead of plain objects and arrays.


    * * *


    Maps and Sets offer more efficient and clearer ways to handle collections of data
    compared to plain objects and arrays.


    * * *


    Using Map and Set in JavaScript can provide better performance and functionality
    for collections, such as ensuring unique elements in Sets or maintaining key-value
    pairs in Maps.


    < Good Code >


    // Using Map for key-value pairs


    const userRoles = new Map();


    userRoles.set(''Alice'', ''Admin'');


    userRoles.set(''Bob'', ''User'');


    console.log(userRoles.get(''Alice'')); // Output: Admin


    // Using Set for unique values


    const uniqueNumbers = new Set([1, 2, 3, 3, 4]);


    uniqueNumbers.add(5);


    uniqueNumbers.add(1); // Duplicate, won''t be added'
