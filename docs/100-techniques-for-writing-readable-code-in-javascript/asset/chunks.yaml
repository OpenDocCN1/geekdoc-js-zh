    In the good example, the use of if-else statements makes the logic clear and easy
    to follow. In the bad example, chaining multiple ternary operators makes the code
    harder to read and understand, especially for those unfamiliar with the syntax.


    <Memo>


    Ternary operators are useful for simple conditional assignments, but for more
    complex logic, if-else statements are generally preferred for better readability.


    75


    # Use parentheses to make the order of operations explicit.


    * * *


    Using parentheses in your code helps clarify the order of operations, making it
    easier for others to understand and maintain.


    * * *


    When writing complex expressions, the order in which operations are performed
    can sometimes be unclear. Using parentheses ensures that the intended order is
    explicit, reducing the likelihood of errors and improving readability.


    < Good Code >


    // Good: The use of parentheses makes the order of operations clear


    let result = (a + b) * (c - d); // Addition and subtraction are done first, then
    multiplication


    <Bad Code>


    // Bad: The order of operations is not immediately clear


    let result = a + b * c - d; // Multiplication is done first, but it''s not obvious
    at a glance


    In the good example, parentheses are used to explicitly define the order in which
    operations should be performed, making the code easier to read and understand.
    In the bad example, the lack of parentheses makes it harder to determine the order
    of operations, which can lead to misunderstandings and potential bugs.


    <Memo>


    In JavaScript, the order of operations follows standard mathematical rules: multiplication
    and division are performed before addition and subtraction. However, using parentheses
    can override this order to ensure clarity.


    76


    # Encapsulate unrelated functionality into separate functions.


    * * *


    Encapsulating unrelated functionality into separate functions improves code modularity,
    readability, and maintainability.


    * * *


    When different parts of your code perform distinct tasks, it''s best to encapsulate
    these tasks into separate functions. This practice makes your code more modular,
    easier to read, and simpler to maintain or debug.


    < Good Code >


    // Good: Separate functions for unrelated tasks


    function calculateSum(a, b) {


        return a + b;


    }


    function printMessage(message) {


        console.log(message);


    }


    let sum = calculateSum(5, 10);


    printMessage(`The sum is ${sum}`);


    <Bad Code>


    // Bad: Unrelated tasks are combined in a single function


    function calculateAndPrint(a, b) {


        let sum = a + b;


        console.log(`The sum is ${sum}`);


    }


    calculateAndPrint(5, 10);


    In the good example, the calculateSum and printMessage functions each perform
    a single, well-defined task. This separation makes the code easier to understand
    and maintain. In the bad example, combining calculation and printing in a single
    function makes the code less modular and harder to reuse or test.


    <Memo>


    Modular code is a key principle in software engineering. It allows developers
    to reuse functions across different parts of an application, reducing redundancy
    and improving maintainability.


    77


    # Use utility libraries for common tasks


    * * *


    Leverage utility libraries like Lodash for common operations on arrays, objects,
    strings, etc.


    * * *


    Instead of writing custom functions for common tasks, use utility libraries which
    provide optimized and well-tested implementations.


    < Good Code >


    js// Using Lodash


    const _ = require(''lodash'');


    const numbers = [1, 2, 3, 4, 5];


    const doubledNumbers = _.map(numbers, n => n * 2); // [2, 4, 6, 8, 10]


    const users = [


      { name: ''Alice'', age: 25 },


      { name: ''Bob'', age: 30 },


      { name: ''Charlie'', age: 35 }


    ];


    const userNames = _.map(users, ''name''); // [''Alice'', ''Bob'', ''Charlie'']


    <Bad Code>


    js// Custom implementation


    const numbers = [1, 2, 3, 4, 5];


    const doubledNumbers = [];


    for (let i = 0; i < numbers.length; i++) {


      doubledNumbers.push(numbers[i] * 2);


    }


    const users = [


      { name: ''Alice'', age: 25 },


      { name: ''Bob'', age: 30 },


      { name: ''Charlie'', age: 35 }


    ];


    const userNames = [];


    for (let i = 0; i < users.length; i++) {


      userNames.push(users[i].name);


    }


    Utility libraries like Lodash provide a wide range of functions for common operations,
    saving development time and reducing code duplication. They are optimized for
    performance and thoroughly tested, ensuring reliable behavior.


    <Memo>


    Lodash is a popular utility library for JavaScript, but there are alternatives
    like Ramda and Underscore.js.


    78


    # Abstract repetitive code into reusable functions


    * * *


    Identify repetitive code patterns and extract them into reusable functions for
    better code organization and maintainability.


    * * *


    Repetitive code can make the codebase harder to read and maintain. By abstracting
    such code into reusable functions, you can improve code clarity and reduce duplication.


    < Good Code >


    jsfunction calculateTotal(items, taxRate) {


      let total = 0;


      for (const item of items) {


        total += item.price;


      }


      return total * (1 + taxRate);


    }


    const cart1 = [


      { name: ''Item 1'', price: 10 },


      { name: ''Item 2'', price: 20 }


    ];


    const cart2 = [


      { name: ''Item 3'', price: 15 },


      { name: ''Item 4'', price: 25 },


      { name: ''Item 5'', price: 5 }


    ];


    const total1 = calculateTotal(cart1, 0.08); // 32.4


    const total2 = calculateTotal(cart2, 0.1); // 49.5


    <Bad Code>


    jsconst cart1 = [


      { name: ''Item 1'', price: 10 },


      { name: ''Item 2'', price: 20 }


    ];


    const cart2 = [


      { name: ''Item 3'', price: 15 },


      { name: ''Item 4'', price: 25 },


      { name: ''Item 5'', price: 5 }


    ];


    let total1 = 0;


    for (const item of cart1) {


      total1 += item.price;


    }


    total1 *= 1.08; // 32.4


    let total2 = 0;


    for (const item of cart2) {


      total2 += item.price;


    }


    total2 *= 1.1; // 49.5


    By extracting the repetitive code into a function, you can reuse it across multiple
    places in your codebase. This not only reduces duplication but also makes the
    code more readable and easier to maintain. If the logic needs to be updated, you
    only need to change it in one place.


    <Memo>


    The principle of "Don''t Repeat Yourself" (DRY) is a fundamental concept in software
    engineering that encourages code reuse and abstraction to reduce redundancy.


    79


    # Separate data fetching logic from UI rendering logic


    * * *


    Keep data fetching and UI rendering in separate functions or components.


    * * *


    Separating data fetching from UI rendering helps maintain a clean and manageable
    codebase. It allows for easier testing, debugging, and reusability of components.


    < Good Code >


    // Data fetching function


    async function fetchData(url) {


      const response = await fetch(url);


      const data = await response.json();


      return data;


    }


    // UI rendering function


    function renderUI(data) {


      const container = document.getElementById(''container'');


      container.innerHTML = data.map(item => `<p>${item.name}</p>`).join('''');


    }


    // Main function


    async function main() {


      const data = await fetchData(''https://api.example.com/data'');


      renderUI(data);


    }


    main();


    <Bad Code>


    async function main() {


      const response = await fetch(''https://api.example.com/data'');


      const data = await response.json();


      const container = document.getElementById(''container'');


      container.innerHTML = data.map(item => `<p>${item.name}</p>`).join('''');


    }


    main();'
