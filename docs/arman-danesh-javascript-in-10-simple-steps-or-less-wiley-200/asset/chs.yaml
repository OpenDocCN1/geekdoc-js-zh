  \n### 以编程方式切换图像\n\n本任务演示如何将基于 JavaScript 的图像加载与 `onMouseOver` 事件处理程序结合，以创建翻转效果。这种翻转效果通常用于基于图像的按钮以及由图像构建的菜单项。\n\
  \n请考虑图 61-1。这里网页中显示了一张图像，鼠标指针不在图像上。当鼠标指针移到图像上时，翻转图像会替换原始图像，如图 61-2 所示。当鼠标指针移出图像时，图像恢复为图\
  \ 61-1 所示的原始图像。\n\n> ***注意***\n> - 在生成这些翻转效果时，请记住，图像及其备用翻转图像通常应具有相同的像素宽度和高度。否则会出现两个问题之一。首先，如果您没有使用\
  \ `img` 标签的 `width` 和 `height` 属性强制指定图像大小，那么当鼠标滚过图像时，图像所占用的空间可能会发生变化，导致图像周围的页面元素移动。其次，如果您强制指定了图像大小，则其中一张图像需要被拉伸以匹配另一张图像的大小。\n\
  > - `onMouseOver` 事件处理程序与 `onMouseOut` 事件处理程序类似。它允许程序员指定当鼠标指针离开页面元素（如图像）所占区域时要执行的\
  \ JavaScript 代码，而 `onMouseOver` 则指定当鼠标指针进入页面元素所占空间时要执行的代码。\n\n**图 61-1：** 当鼠标指针不在图像上时，显示原始图像。\n\
  \n**图 61-2：** 当鼠标指针在图像上时，显示备用图像。\n\n在 JavaScript 中生成翻转效果的原理很简单，涉及三个关键部分：\n\n- 在\
  \ `img` 标签中指定默认图像。\n- 创建两个 `Image` 对象；一个加载默认图像，另一个加载翻转图像。\n- 指定 `onMouseOver` 和\
  \ `onMouseOut` 事件处理程序，以管理鼠标移入或移出图像时显示的图像变化。\n\n以下步骤概述了如何为页面中的单个图像创建简单的翻转效果：\n\n\
  **1.** 在页面的头部，创建一个带有开始和结束 `script` 标签的脚本块。\n\n**2.** 在脚本中，创建一个名为 `rollImage` 的 `Image`\
  \ 对象，并通过将图像赋值给 `rollImage` 对象的 `src` 属性来加载备用翻转图像：\n\n```javascript\nrollImage =\
  \ new Image;\nrollImage.src = \"rollImage1.jpg\";\n```\n\n> ***提示***\n> - 翻转效果旨在为用户提供上下文，让他们知道该图像构成一个可点击的元素，并准确显示他们点击的内容（尤其是在多个图像紧密排列的情况下）。\n\
  \n**3.** 在脚本中，创建一个名为 `defaultImage` 的 `Image` 对象，并加载要显示的默认图像。\n\n**4.** 在脚本的正文中，使用\
  \ `img` 标签放置默认图像。使用标签的属性控制图像的大小和边框。\n\n\n\n\n根据需要，使用 `name` 属性为图像分配名称 `myImage`，使它们彼此靠近（在复杂布局中）。\n\
  \n**5.** 将 `img` 标签包裹在成对的 `a` 开始和结束标签中，并在 `a` 标签的 `href` 属性中指定用户点击图像时希望跳转的 URL。为\
  \ `a` 标签添加一个 `onMouseOver` 属性，并用它来向 `myImage` 对象显示翻转图像。这样当鼠标移动到图像上时，就会显示翻转图像。同时，为\
  \ `a` 标签添加一个 `onMouseOut` 属性，并用它来在鼠标移出图像时显示默认图像。最终的脚本应如下所示：\n\n```html\n<head>\n\
  <script language=”JavaScript”>\nrollImage = new Image;\nrollImage.src = “rollImage1.jpg”;\n\
  defaultImage = new Image;\ndefaultImage.src = “image1.jpg”;\n</script>\n</head>\n\
  <body>\n<a href=” *myUrl*” onMouseOver=”document.myImage.src = rollImage.src;”\n\
  onMouseOut=”document.myImage.src = defaultImage.src;”>\n<img src=”image1.jpg” name=”myImage”\
  \ width=100 height=100 border=0>\n</a>\n</body>\n```\n\n**7.** 将代码保存为 HTML 文件，并在浏览器中加载。当鼠标滑过图像时，翻转效果会将其替换为翻转图像，当鼠标指针离开图像所占区域时，再切换回默认图像。\n\
  \n### 任务 62：在单个页面中使用多个翻转效果\n\n在任务 61 演示的翻转效果基础上，本任务展示了如何将该原理扩展到支持单个页面中的多个翻转效果。这在用翻转图像构建菜单时非常有用。\n\
  \n以下步骤演示了在单个页面上创建两个翻转图像的过程：\n\n***注意***\n\n- 在最基本的形式中，多个翻转效果要求每个图像具有唯一的名称，每个图像具有唯一命名的\
  \ `Image` 对象，并且每个翻转图像具有唯一命名的 `Image` 对象。\n- `onMouseOver` 事件处理程序与 `onMouseOut` 事件处理程序类似。它允许程序员指定当鼠标指针离开页面元素（如图像）所占区域时要执行的\
  \ JavaScript 代码，而 `onMouseOver` 则指定当鼠标指针进入页面元素所占区域时要执行的代码（参见步骤 4）。\n- 在生成这些翻转效果时，请记住，图像及其备用翻转图像通常应具有相同的像素宽度和高度；否则会出现两个问题之一。首先，如果不使用\
  \ `img` 标签的 `width` 和 `height` 属性强制指定图像大小，则图像所占空间可能会随鼠标滑过而改变，导致图像周围的页面元素移动。其次，如果强制指定图像大小，则其中一个图像需要变形以匹配另一个图像的大小（参见图示）。\n\
  \n![Image 178](img/index-152_1.jpg)\n![Image 179](img/index-152_2.jpg)\n\n**1.**\
  \ 在新页面头部的脚本块中，创建一个名为 `rollImage1` 的 `Image` 对象，并通过将图像赋值给 `rollImage1` 对象的 `src`\
  \ 属性，将第一个图像的备用翻转图像加载到其中。同时创建一个名为 `defaultImage1` 的 `Image` 对象，并通过将图像赋值给 `defaultImage1`\
  \ 对象的 `src` 属性，将第一个图像的默认图像加载到其中：\n\n```javascript\nrollImage1 = new Image; rollImage1.src\
  \ = “rollImage1.jpg”;\ndefaultImage1 = new Image; defaultImage1.src = “image1.jpg”;\n\
  ```\n\n**2.** 对第二个图像重复该过程，创建并加载 `rollImage2` 和 `defaultImage2`，使生成的脚本如下：\n\n```javascript\n\
  rollImage2 = new Image; rollImage2.src = “rollImage2.jpg”;\ndefaultImage2 = new\
  \ Image; defaultImage2.src = “image2.jpg”;\n```\n\n**3.** 在脚本的正文中，使用 `img` 标签放置两个默认图像；使用标签的属性根据需要控制图像的大小和边框，并使用\
  \ `name` 属性为图像分配名称 `myImage1` 和 `myImage2`：\n\n```html\n<img src=”image1.jpg” name=”myImage1”\
  \ width=100 height=100 border=0>\n<img src=”image2.jpg” name=”myImage2” width=100\
  \ height=100 border=0>\n```\n\n**4.** 将每个 `img` 标签包裹在成对的 `a` 开始和结束标签中，并在 `a` 标签的\
  \ `href` 属性中指定用户点击图像时希望跳转的 URL。为每个 `a` 标签添加一个 `onMouseOver` 属性，并用它来显示翻转图像。这样当鼠标移动到相关图像上时，就会显示翻转图像。同时，为每个\
  \ `a` 标签添加一个 `onMouseOut` 属性，并用它来在鼠标移出相关图像时显示默认图像。最终的脚本应如下所示：\n\n```html\n<head>\n\
  <script language=”JavaScript”>\nrollImage1 = new Image; rollImage1.src = “Tellers1.jpg”;\n\
  defaultImage1 = new Image; defaultImage1.src = “lotus.jpg”;\nrollImage2 = new Image;\
  \ rollImage2.src = “hedi.jpg”;\ndefaultImage2 = new Image; defaultImage2.src = “ArcRV1.1.jpg”;\n\
  </script>\n</head>\n<body>\n<a href=”#” onMouseOver=”document.myImage1.src = rollImage1.src;”\n\
  onMouseOut=”document.myImage1.src = defaultImage1.src;”>\n<img src=”lotus.jpg” name=”myImage1”\
  \ width=100 height=100 border=0>\n</a>\n<a href=”#” onMouseOver=”document.myImage2.src\
  \ = rollImage2.src;”\nonMouseOut=”document.myImage2.src = defaultImage2.src;”>\n\
  <img src=”ArcRV1.1.jpg” name=”myImage2” width=100 height=100 border=0>\n</a>\n</body>\n\
  ```\n\n**5.** 将代码保存为 HTML 文件，并在浏览器中加载。存在两种可能的状态：鼠标不在图像上时（图 62-1）和鼠标位于第一个图像上时（图 62-2）。\n\
  \n**图 62-1：** 鼠标不在任何图像上。\n\n**图 62-2：** 鼠标位于第一个图像上。\n\n### 任务 63：显示随机图像\n\nJavaScript\
  \ 与图像结合的一种应用是在页面上的某个位置加载随机图像，而不是每次都加载同一张图像。\n\n一种方法是完全使用 JavaScript 来显示图像。也就是说，你需要使用\
  \ JavaScript 指定一个可能的图像列表，随机选择一张，然后生成 `img` 标签来显示该图像。\n\n***注意***\n\n- 数组中的每个槽位都有编号；编号从零开始。这意味着一个有四个条目的数组，其条目编号为\
  \ 0 到 3。\n- `Math` 对象提供了许多用于处理数字和数学运算的有用方法。\n- `Array` 对象的 `length` 属性提供了数组中的条目数。这意味着如果一个数组有四个条目（编号\
  \ 0 到 3），那么该数组的 `length` 属性值为 4。\n- `Math.floor` 执行类似于取整的功能，它会去掉数字的小数部分。不同之处在于，取整的结果可能是下一个最高或最低的整数值，具体取决于小数部分的大小。\n\
  \n以下步骤创建的脚本演示了这一过程：\n\n**1.** 创建一个带有开始和结束 `script` 标签的脚本块；该脚本块应位于 HTML 文档中希望显示图像的位置的正文中：\n\
  \n```html\n<script language=”JavaScript”>\n</script>\n```\n\n**2.** 在脚本中，创建一个名为\
  \ `imageList` 的数组：\n\n```javascript\nvar imageList = new Array;\n```\n\n**3.** 为每个希望用于随机选择的图像在数组中创建一个条目。例如，如果有四张图像，则将它们的路径和名称分配给数组的前四个条目：\n\
  \n```javascript\nimageList[0] = “image1.jpg”;\nimageList[1] = “image2.jpg”;\nimageList[2]\
  \ = “image3.jpg”;\nimageList[3] = “image4.jpg”;\n```\n\n**4.** 创建一个名为 `imageChoice`\
  \ 的变量：\n\n```javascript\nvar imageChoice;\n```\n\n\n\n\n## 图像与翻转效果\n\n**5.** 使用\
  \ `Math.random` 方法为 `imageChoice` 分配一个随机数，该方法返回一个 0 到 1 之间的随机数（即该数大于等于 0 但小于 1）：\n\
  \n```\nvar imageChoice = Math.random();\n```\n\n**6.** 扩展赋给 `imageChoice` 的表达式，将随机数乘以\
  \ `imageList` 数组中的条目数，得到一个大于等于 0 但小于 4 的数：\n\n```\nvar imageChoice = Math.random()\
  \ * imageList.length;\n```\n\n**7.** 进一步扩展赋给 `imageChoice` 的表达式，使用 `Math.floor`\
  \ 方法去除小数点后的部分；结果是一个从 0 到数组条目数减 1 的整数——在本例中，即从 0 到 3 的整数：\n\n```\nvar imageChoice\
  \ = Math.floor(Math.random() * imageList.length);\n```\n\n**8.** 使用 `document.write`\
  \ 方法在发送给浏览器的 HTML 数据流中放置一个 `<img>` 标签。作为 `<img>` 标签的 `src` 属性值，随机图像被指定为 `imageList[imageChoice]`。最终的脚本如下所示：\n\
  \n```javascript\n<script language=\"JavaScript\">\nvar imageList = new Array;\n\
  imageList[0] = \"image1.jpg\";\nimageList[1] = \"image2.jpg\";\nimageList[2] = \"\
  image3.jpg\";\nimageList[3] = \"image4.jpg\";\nvar imageChoice = Math.floor(Math.random()\
  \ * imageList.length);\ndocument.write('<img src=\"' + imageList[imageChoice] +\
  \ '\">');\n</script>\n```\n\n**9.** 将代码保存到 HTML 文件中，并在浏览器中显示该文件。将显示一张随机图像，如图 63-1\
  \ 所示。重新加载文件应显示不同的图像，如图 63-2 所示（尽管连续两次选中相同随机数的可能性很小）。\n\n**图 63-1：** 显示一张随机图像。\n\n\
  ***交叉引用***\n- *数组*是一种包含多个编号槽位的数据类型，你可以在其中放置任何值。有关数组的讨论，请参见任务 20。\n- `document.write`\
  \ 方法在任务 45 中介绍。它允许 JavaScript 代码生成输出，这些输出构成浏览器渲染的 HTML 的一部分。\n\n**图 63-2：** 重新加载页面通常会显示不同的随机图像。\n\
  \n---\n\n### 任务 64：显示多张随机图像\n\n在网页中显示一张随机图像的过程可以轻松扩展为从同一组随机图像中显示多张随机图像。结果是一个类似下面的脚本，它显示三张随机图像：\n\
  \n**1.** 在新文档的头部脚本块中，创建一个名为 `imageList` 的数组：\n\n```javascript\nvar imageList = new\
  \ Array;\n```\n\n**2.** 为每个希望用于随机选择的图像在数组中创建一个条目。例如，以下代码指定了四张图像的路径：\n\n```javascript\n\
  imageList[0] = \"image1.jpg\";\nimageList[1] = \"image2.jpg\";\nimageList[2] = \"\
  image3.jpg\";\nimageList[3] = \"image4.jpg\";\n```\n\n**3.** 使用 `function` 关键字创建一个名为\
  \ `showImage` 的函数：\n\n```javascript\nfunction showImage() {\n}\n```\n\n**4.** 在函数中，创建一个名为\
  \ `imageChoice` 的变量。使用 `Math.random` 方法为 `imageChoice` 分配一个随机数，该方法返回一个 0 到 1 之间的随机数（即该数大于等于\
  \ 0 但小于 1）。扩展赋给 `imageChoice` 的表达式，将随机数乘以 `imageList` 数组中的条目数，得到一个大于等于 0 但小于 4 的数：\n\
  \n```javascript\nvar imageChoice = Math.random() * imageList.length;\n```\n\n**5.**\
  \ 进一步扩展赋给 `imageChoice` 的表达式，使用 `Math.floor` 方法去除小数点后的部分。结果是一个从 0 到数组条目数减 1 的整数——在本例中，即从\
