  \n**图 235-2：** 背景图片被移除后的页面。\n\n### 任务 236：使用小书签隐藏图片\n\n本任务展示了如何使用小书签隐藏页面中的图片。当页面上的图片使显示变得杂乱，你需要移除它们以获得清晰视图，或者在测试自己的页面时查看图片确切出现和未出现的位置时，这非常有用。\n\
  \n本示例利用了 `document.images` 数组包含当前页面中每个图片的对象这一事实。每个 `Image` 对象都有一个 `style` 属性，该属性指向包含该图片样式设置的\
  \ `style` 对象。此 `style` 对象的属性之一是 `visibility` 属性，当设置为 `hidden` 时，会使相关对象呈现为不可见。\n\n\
  > **注意：** `for` 循环允许你在每次循环迭代中执行循环内的代码，并且在每次循环迭代中，计数器变量的值都会调整。在本例中，计数器变量是 `i`，初始值为零。每次循环迭代，`i`\
  \ 增加 1，直到达到与文档中图片总数相同的值。\n\n结果是，可以使用一个简单的循环遍历 `document.images` 数组来隐藏文档中的所有图片，步骤如下：\n\
  \n1. 打开你通常用于编写 JavaScript 的文本编辑器。\n2. 使用 `for` 循环从 0 循环到 `document.images` 数组的长度：\n\
  \   ```\n   for (i = 0; i < document.images.length; i ++) {\n   ```\n3. 在循环中，将 `'hidden'`\
  \ 赋值给给定图片的 `style` 对象的 `visibility` 属性：\n   ```\n   document.images[i].style.visibility\
  \ = 'hidden';\n   ```\n4. 将上一条命令包含在 `void` 语句中；否则，浏览器在将 `'hidden'` 字符串赋值给 `visibility`\
  \ 属性后会尝试显示该字符串，这将导致一个包含文本“hidden”的空白页面替换当前页面：\n   ```\n   void(document.images[i].style.visibility\
  \ = 'hidden');\n   ```\n5. 关闭 `for` 循环，使最终脚本如下所示：\n   ```\n   for (i = 0; i < document.images.length;\
  \ i ++) {\n       void(document.images[i].style.visibility = 'hidden');\n   }\n\
  \   ```\n6. 移除脚本中的换行和空白空格，并在脚本开头添加 `javascript:` 协议，使结果成为一行 URL，并移除所有多余空格：\n   ```\n\
  \   javacript:for(i=0;i<document.images.length;i++){void(document.images[i].style.visibility='hidden'};\n\
  \   ```\n7. 使用此代码作为 URL 创建书签或收藏夹。要测试该小书签，请在浏览器中打开一个包含图片的网页，如图 236-1 所示。选择你创建的新书签或收藏夹，图片消失，如图\
  \ 236-2 所示。\n\n![Image 599](img/index-514_1.jpg)\n![Image 600](img/index-514_2.jpg)\n\
  \n> **提示：** 为了便于开发小书签，最好先在常规代码编辑器中编辑代码，最后再将小书签复制粘贴到你的收藏夹或书签列表中。\n\n**图 236-1：**\
  \ 带有图片的网页。\n\n> **交叉引用：**\n> - 本书第 3 部分讨论了如何处理图片，包括使用 `document.images` 数组和图片对象。\n\
  > - 本书第 7 部分讨论了如何使用样式表和 `style` 对象。\n\n**图 236-2：** 图片被隐藏后的同一页面。\n\n### 任务 237：使用小书签隐藏横幅广告\n\
  \n本任务是任务 236 的一个变体。这里不是隐藏所有图片，而是只隐藏可能为横幅广告的图片。如果你希望避免横幅图片，这是一个不错的工具。\n\n本任务背后的原理是，横幅广告通常具有相同的大小：468\
  \ x 60 像素。这是因为这是大多数主要广告网络和销售横幅广告位的网站所规定的大小。\n\n> **注意：** 此脚本并非移除横幅广告的万无一失的方法，原因有几个：如今，并非所有横幅广\n\
  \n\n\n\n\n## 书签小工具\n\n### 任务 237\n\n在隐藏横幅广告之前，你需要知道图片的高度和宽度。这很容易做到，因为 `document.images`\
  \ 数组中的每个 `Image` 对象都有 `height` 和 `width` 属性，可以检查以确定图片的大小。如今有些横幅广告并不都遵循 468×60 像素的尺寸。有些横幅广告是用\
  \ Flash 实现的，无法在 `document.images` 数组中访问，而其他广告则没有采用传统横幅的简单水平形状；例如，如今许多广告是垂直而非水平的。\n\
  \n以下步骤展示了如何创建一个书签小工具来隐藏横幅广告：\n\n1. 打开你通常用于编写 JavaScript 的文本编辑器。\n\n2. 使用 `for` 循环从\
  \ 0 循环到 `document.images` 数组的长度：\n   ```\n   for (i = 0; i < document.images.length;\
  \ i ++) {\n   ```\n\n3. 在循环中，使用 `if` 语句检查每个图片的大小是否为 468×60 像素：\n   ```\n   if (document.images[i].width\
  \ == 468 && document.images[i].height == 60) {\n   ```\n\n4. 如果图片是 468×60 像素，则将\
  \ `'hidden'` 赋值给该图片的 `style` 对象的 `visibility` 属性：\n   ```\n   document.images[i].style.visibility\
  \ = 'hidden';\n   ```\n\n5. 将最后一条命令包含在 `void` 语句中；否则，浏览器在将 `'hidden'` 赋值给 `visibility`\
  \ 属性后会尝试显示该字符串，这将导致当前页面被一个只显示文本“hidden”的空白页面替换：\n   ```\n   void(document.images[i].style.visibility\
