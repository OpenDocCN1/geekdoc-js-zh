  \ `document.cookie =`\n\n2. 输入一个左双引号，后跟 cookie 的名称，再跟一个等号。在本例中，名称为 `myFirstCookie`：\n\
  \n   `document.cookie = “myFirstCookie=”`\n\n3. 关闭双引号并输入一个加号：\n\n   `document.cookie\
  \ = “myFirstCookie=” +`\n\n4. 输入要分配给第一个 cookie 的值，作为 `escape` 函数的参数。在本例中，cookie\
  \ 的值为“This is my first Cookie”：\n\n   `document.cookie = “myFirstCookie=” + escape(“This\
  \ is my first Cookie”)`\n\n5. 输入一个分号结束该命令。对于第一个 cookie，你的 JavaScript 代码应如清单 153-1\
  \ 所示。\n\n   `document.cookie = “myFirstCookie=” + escape(“This is my first Cookie”);`\n\
  \n**清单 153-1：** 在 JavaScript 中创建第一个 cookie。\n\n## 操作 Cookie\n\n6. 继续在脚本的新行上创建第二个\
  \ cookie，输入 `document.cookie` 后跟一个等号，开始为 `document.cookie` 对象赋值：\n\n   `document.cookie\
  \ =`\n\n7. 输入一个左双引号，后跟 cookie 的名称，再跟一个等号。在本例中，名称为 `mySecondCookie`：\n\n   `document.cookie\
