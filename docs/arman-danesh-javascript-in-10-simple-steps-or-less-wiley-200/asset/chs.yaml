  \n#### 任务 25：向用户发出警报\n\n25 `window` 对象提供了 `alert` 方法，该方法允许你显示一个简单的对话框，其中包含一条文本消息，后跟一个按钮，用户可以使用该按钮确认消息并关闭对话框。\n\
