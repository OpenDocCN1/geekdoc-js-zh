  \ src=\"140code.html\">\n```\n\n要调用的函数。\n\n3. 在框架集中，创建第二个和第三个框架标签，以加载可见的左侧和右侧框架的文档：\n\
  \n```\n<frameset cols=\"0,50%,*\">\n<frame name=\"codeFrame\" src=\"140code.html\"\
  >\n<frame name=\"frame1\" src=\"140a.html\">\n<frame name=\"frame2\" src=\"140b.html\"\
