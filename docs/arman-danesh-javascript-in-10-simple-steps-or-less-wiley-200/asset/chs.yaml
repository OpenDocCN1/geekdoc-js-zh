  \n**第 5 部分**\n\n### 任务 114：使用 Window 对象\n\n`window` 对象提供了对属性和方法的访问，这些属性和方法可用于获取有关打开窗口的信息，以及操作这些窗口甚至打开新窗口。\n\
  \n该对象提供的属性允许你访问窗口中的框架、访问窗口名称、操作状态栏中的文本，以及检查窗口的打开或关闭状态。这些方法允许用户显示各种对话框，以及打开新窗口和关闭已打开的窗口。\n\
  \n***注意***\n\n• `window.status` 属性反映当前窗口底部状态栏中的当前文本。通过向此属性分配新的文本字符串，你可以用自己的文本覆盖状态栏中显示的默认文本。\n\
  \n`window` 对象的功能包括：\n\n• 创建警告对话框\n• 创建确认对话框\n• 创建提示用户输入信息的对话框\n• 在新窗口中打开页面\n• 确定窗口大小\n\
  • 控制窗口中显示文档的滚动\n• 安排函数的执行\n\n`window` 对象可以通过多种方式引用：\n\n• 使用关键字 `window` 或 `self`\
  \ 来引用执行 JavaScript 代码的当前窗口。例如，`window.alert` 和 `self.alert` 引用的是同一个方法。\n• 使用另一个打开窗口的对象名称。例如，如果一个窗口与名为\
  \ `myWindow` 的对象关联，那么 `myWindow.alert` 将引用该窗口中的 `alert` 方法。\n\n以下步骤说明了如何通过更改当前窗口状态栏中显示的文本来访问\
  \ `window` 对象：\n\n**1.** 在文档的正文中，创建一个带有开始和结束 script 标签的脚本块：\n\n```html\n<script\
  \ language=\"JavaScript\">\n</script>\n```\n\n**2.** 在脚本块中，访问 `window.status` 属性：\n\
  \n```html\n<script language=\"JavaScript\">\nwindow.status\n</script>\n```\n\n**3.**\
  \ 以与将文本字符串分配给变量相同的方式，将新文本分配给 `window.status` 属性进行显示，使最终文档看起来像清单 114-1。\n\n![Image\
  \ 297](img/index-260_1.jpg)\n\n06 542419 Ch05.qxd 11/19/03 10:33 AM Page 237\n\n\
  **操作浏览器窗口**\n\n**237**\n\n```html\n<body>\n<script language=\"JavaScript\">\nwindow.status\
  \ = \"一条新的状态消息\";\n</script>\n</body>\n```\n\n**清单 114-1：** 在状态栏中显示文本。\n\n**4.**\
  \ 保存文件。\n\n**5.** 在浏览器中打开页面。会出现一个空白 HTML 页面，状态栏中显示“一条新的状态消息”，如图 114-1 所示。\n\n**图\
  \ 114-1：** 在状态栏中显示自定义文本。\n\n***交叉引用***\n\n• 各种类型的对话框在任务 25、26 和 117 中讨论。\n\n![Image\
  \ 298](img/index-261_1.jpg)\n![Image 299](img/index-261_2.jpg)\n\n06 542419 Ch05.qxd\
  \ 11/19/03 10:33 AM Page 238\n\n\n\n\n\n## 第 5 部分\n\n### 任务 115：弹出警告对话框\n\n`window`\
  \ 对象提供了 `alert` 方法，用于显示一个简单的对话框，其中包含一条文本消息和一个按钮，用户可通过该按钮确认消息并关闭对话框。\n\n**图 115-1**\
  \ 展示了 Microsoft Internet Explorer 中的警告对话框；**图 115-2** 展示了 Netscape 中的相同对话框。\n\n\
  ***注释***\n\n- `window.alert` 方法接受一个参数：一个包含要在对话框中显示的文本的字符串。你可以将其作为字面字符串或任何计算结果为字符串的表达式传入。\n\
  - 当警告对话框显示时，浏览器窗口的交互会被阻塞，直到用户单击对话框中的按钮将其关闭。\n\n**图 115-1：** Internet Explorer 中的警告对话框。\n\
  \n**图 115-2：** Netscape 中的警告对话框。\n\n创建警告对话框是 `window` 对象的众多功能之一，该对象还可用于创建确认对话框和提示对话框，以及其他功能。这些功能包括：\n\
  \n- 在新窗口中打开页面\n- 确定窗口大小\n- 控制窗口中显示的文档的滚动\n- 调度函数的执行\n\n以下步骤展示了如何连续显示两个警告对话框：\n\n\
  1. 在新的 HTML 文档的 body 中，创建一个带有开始和结束 script 标签的脚本块：\n\n```\n<script language=”JavaScript”>\n\
  </script>\n```\n\n2. 使用 `window.alert` 方法显示第一个对话框：\n\n```\nwindow.alert(“This is\
  \ a dialog box”);\n```\n\n3. 使用 `window.alert` 方法显示第二个对话框，最终脚本如下所示：\n\n```\n<script\
  \ language=”JavaScript”>\nwindow.alert(“This is a dialog box”);\nwindow.alert(“This\
  \ is another dialog box”);\n</script>\n```\n\n4. 保存文件。\n\n5. 在 Web 浏览器中打开该文件。第一个对话框出现，如**图\
  \ 115-3**所示。用户关闭第一个对话框后，第二个对话框显示，如**图 115-4**所示。\n\n**图 115-3：** 第一个对话框。\n\n![Image\
  \ 302](img/index-263_1.jpg)\n\n**图 115-4：** 第二个对话框。\n\n![Image 303](img/index-263_2.jpg)\n\
  \n***交叉引用***\n\n- 关于函数自动执行的调度，在任务 38、39 和 40 中讨论。\n\n### 任务 116：弹出确认对话框\n\n除了任务\
  \ 115 中讨论的 `alert` 方法外，`window` 对象还提供了 `confirm` 方法，用于显示一个对话框，其中包含一条文本消息和两个按钮，用户可通过这两个按钮确认或拒绝消息并关闭对话框。通常这些按钮标记为“确定”和“取消”。\n\
  \n**图 116-1** 展示了 Microsoft Internet Explorer 中的确认对话框；**图 116-2** 展示了 Netscape 中的相同对话框。\n\
  \n***注释***\n\n- `window.confirm` 方法返回一个值：如果用户单击“确定”则返回 `true`，如果用户单击“取消”则返回 `false`。这使得测试用户对对话框的响应变得容易。\n\
  - `if` 语句需要一个计算结果为 `true` 或 `false` 的表达式。这里，`userChoice` 是一个变量，其值为 `true` 或 `false`，因为这是\
  \ `confirm` 方法返回的值。这意味着表达式可以仅仅是变量名本身。\n\n**图 116-1：** Internet Explorer 中的确认对话框。\n\
  \n**图 116-2：** Netscape 中的确认对话框。\n\n以下步骤展示了如何显示一个确认对话框，然后根据用户的选择在页面 body 中显示该选择：\n\
  \n1. 在新的 HTML 文档的 body 中，创建一个带有开始和结束 script 标签的脚本块：\n\n```\n<script language=”JavaScript”>\n\
  </script>\n```\n\n2. 使用 `window.confirm` 方法显示第一个对话框；对话框返回的值存储在变量 `userChoice` 中：\n\
  \n```\nvar userChoice = window.confirm(“Click OK or Cancel”);\n```\n\n3. 使用 `if`\
  \ 语句通过检查 `userChoice` 变量来测试用户对对话框的响应：\n\n```\nif (userChoice) {\n```\n\n4. 如果用户选择了“确定”按钮，使用\
  \ `document.write` 方法显示相应的消息：\n\n```\ndocument.write(“You chose OK”);\n```\n\n5.\
  \ 如果用户选择了“取消”按钮，显示相应的消息。最终页面应如下所示：\n\n```\n<body>\n<script language=”JavaScript”>\n\
  var userChoice = window.confirm(“Click OK or Cancel”);\nif (userChoice) {\n    document.write(“You\
  \ chose OK”);\n} else {\n    document.write(“You chose Cancel”);\n}\n</script>\n\
  </body>\n```\n\n6. 保存文件并在浏览器中打开。浏览器显示一个确认对话框，如**图 116-3**所示。根据用户在对话框中的选择，浏览器窗口将包含相应的消息，如**图\
  \ 116-4**所示，其中用户选择了“确定”按钮。\n\n**图 116-3：** 确认对话框。\n\n![Image 306](img/index-265_1.jpg)\n\
  \n**图 116-4：** 用户选择了“确定”。\n\n![Image 307](img/index-265_2.jpg)\n\n***交叉引用***\n\n\
  - `window` 对象在任务 114 中介绍。\n\n### 任务 117：弹出 JavaScript 提示框\n\n除了任务 115 中讨论的 `alert`\
  \ 方法和任务 116 中讨论的 `confirm` 方法外，`window` 对象还提供了 `prompt` 方法，用于显示一个对话框，其中包含一条文本消息和一个文本字段，用户可以在关闭对话框之前提供一些输入。\n\
  \n**图 117-1** 展示了 Microsoft Internet Explorer 中的提示对话框；**图 117-2** 展示了 Netscape 中的相同对话框。\n\
  \n***注释***\n\n- `window.prompt` 方法返回用户在对话框的文本字段中输入的值。通过将方法返回的结果存储在变量中，你可以在页面后续部分使用该值。\n\
  - `document.write` 方法期望一个字符串作为参数。在此示例中，两个字符串使用 `+` 运算符连接（或组合）成一个字符串。\n\n**图 117-1：**\
  \ Internet Explorer 中的提示对话框。\n\n**图 117-2：** Netscape 中的提示对话框。\n\n`window.prompt`\
  \ 方法接受两个参数：第一个是要显示的文本消息，第二个是文本字段中显示的默认文本。如果你希望文本字段为空，只需使用空字符串。例如，以下 `window.prompt`\
  \ 方法的示例显示了**图 117-1**中所示的对话框：\n\n```\nwindow.prompt(“Enter a value from 1 to 10”,””);\n\
  ```\n\n以下步骤展示了如何使用提示对话框询问用户输入其姓名，然后在 HTML 页面的 body 中显示该姓名：\n\n1. 在新的 HTML 文档的 body\
  \ 中，创建一个带有开始和结束 script 标签的脚本块：\n\n```\n<script language=”JavaScript”>\n</script>\n\
  ```\n\n2. 使用 `window.prompt` 方法显示对话框；对话框返回的值存储在变量 `userName` 中：\n\n```\nvar userName\
  \ = window.prompt(“Please Enter Your Name”,”Enter Your Name Here”);\n```\n\n3. 使用\
  \ `document.write` 方法显示用户的姓名，最终页面如下所示：\n\n```\n<body>\n<script language=”JavaScript”>\n\
  var userName = window.prompt(“Please Enter Your Name”,”Enter Your Name Here”);\n\
  document.write(“Your Name is “ + userName);\n</script>\n</body>\n```\n\n4. 保存文件。\n\
  \n![Image 308](img/index-266_1.jpg)\n\n![Image 309](img/index-266_2.jpg)\n\n\n\n\
  \n\n## 第 5 部分\n\n### 任务 118：创建新的浏览器窗口\n\n`window` 对象提供了 `open()` 方法，可用于打开一个新的浏览器窗口并在该窗口中显示一个\
  \ URL。在最基本的形式下，`open()` 方法的工作方式如下：\n\n```\nwindow.open( url, window name );\n```\n\
  \n***注意*** 这里的 URL 是一个文本字符串，表示要在窗口中显示的相对或绝对 URL。窗口名称是窗口的名称，稍后可在 `a` 标签的 `target`\
  \ 属性中使用，以将链接指向该窗口。\n\n打开新窗口是 `window` 对象的众多功能之一，该对象还可用于其他几个目的：\n\n- 显示各种对话框\n- 确定窗口大小\n\
  - 控制窗口中显示文档的滚动\n- 调度函数的执行\n\n以下步骤说明了如何使用 JavaScript 打开一个窗口。主文档将在当前浏览器窗口中打开，新窗口将打开并显示另一个\
  \ URL：\n\n1. 在一个新 HTML 文档的头部，创建一个脚本块：\n\n```\n<head>\n<script language=\"JavaScript\"\
  >\n</script>\n</head>\n```\n\n2. 在脚本块中，使用 `window.open()` 方法在新窗口中显示你选择的 URL，并将窗口命名为\
  \ `myNewWindow`：\n\n```\n<head>\n<script language=\"JavaScript\">\nwindow.open(\"\
  http://www.bahai.org/\",\"myNewWindow\");\n</script>\n</head>\n```\n\n3. 在文档的主体中，输入你希望在初始窗口中显示的任何\
  \ HTML 或文本，使最终页面看起来像清单 118-1。\n\n![Image 310](img/index-268_1.jpg)\n\n**清单 118-1：**\
  \ 打开一个新窗口。\n\n4. 保存文件。\n\n5. 在浏览器中打开该文件。页面显示后，一个新窗口将打开，显示 `window.open()` 方法中指定的\
  \ URL，如图 118-1 所示。\n\n**图 118-1：** 打开一个新窗口。\n\n***提示*** 请记住，使用本任务中的技术无法控制新窗口的大小。通常，新窗口的大小将与浏览器中打开的初始窗口相同。\n\
  \n### 任务 119：从链接打开新的浏览器窗口\n\n任务 118 中描述的 `window.open()` 方法的一个应用是，当用户点击链接时用它打开一个新窗口。虽然可以通过在\
  \ `a` 标签的 `target` 属性中简单地指定一个新窗口名称来实现这一点，但有时这样做可能不够。例如，你可能需要以编程方式构建需要在新窗口中显示的 URL，而在用户点击链接时用\
  \ JavaScript 实现这一点更容易。\n\n为此，你可以在 `a` 标签的 `onClick` 事件处理程序中使用 `window.open()` 命令：\n\
  \n```\n<a href=\"#\" onClick=\"window.open( url, window name )\"> 链接文本</a>\n```\n\
  \n***注意*** 注意示例中使用了 `#` 作为 URL。当使用 `onClick` 事件处理程序触发打开新窗口时，你不希望点击链接导致当前窗口的位置发生变化；这是一种避免这种情况的简单方法。\n\
  \n以下任务说明了如何使用 JavaScript 从链接打开一个窗口：\n\n1. 在一个新 HTML 文档的主体中，创建一个链接：\n\n```\n<body>\n\
  <a href=\"\">点击此处</a> 在新窗口中打开一个网站\n</body>\n```\n\n2. 在 `a` 标签中使用 `#` 作为链接的 URL：\n\
  \n```\n<body>\n<a href=\"#\">点击此处</a> 在新窗口中打开一个网站\n</body>\n```\n\n3. 指定一个 `onClick`\
