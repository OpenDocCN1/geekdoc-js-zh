  \ Date();\n   </script>\n   </head>\n   ```\n\n3. 将过期时间设置为过去的某个时间；例如，你可以将日期设置为过去的一天。通过使用`newDate`对象的`setTime`方法来实现。该方法以毫秒数作为时间参数。要设置过去的时间，先用`getTime`方法获取当前时间，然后减去毫秒数。例如，一天是\
  \ 86400000 毫秒：\n\n   ```html\n   <head>\n   <script language=\"JavaScript\">\n \
  \  var newDate = new Date();\n   newDate.setTime(newDate.getTime() - 86400000);\n\
  \   </script>\n   </head>\n   ```\n\n4. 输入`document.cookie`后跟等号，开始为`document.cookie`对象赋值：\n\
  \n   ```javascript\n   document.cookie =\n   ```\n\n5. 输入一个开头的双引号，后跟 Cookie 的名称，再跟一个等号。在此例中，名称为`myCookie`：\n\
  \n   ```javascript\n   document.cookie = \"myCookie=\n   ```\n\n6. 输入一个分号，后跟`expires`，再跟一个等号和一个结束双引号，然后是一个加号：\n\
  \n   ```javascript\n   document.cookie = \"myCookie=;expires=\" +\n   ```\n\n7.\
  \ 输入`newDate.toGMTString()`，将指定的日期和时间作为格式正确的字符串添加到 Cookie 中，并以分号结束命令。你的 JavaScript\
  \ 代码应如清单 152-1 所示。\n\n   **清单 152-1：** 删除 Cookie。\n\n   ```html\n   <head>\n   <script\
  \ language=\"JavaScript\">\n   var newDate = new Date();\n   newDate.setTime(newDate.getTime()\
  \ - 86400000);\n   document.cookie = \"myCookie=;expires=\" + newDate.toGMTString();\n\
  \   </script>\n   </head>\n   ```\n\n8. 为了测试，你可以使用`window.alert`方法显示当前 Cookie，以确保不存在名为`myCookie`的\
  \ Cookie：\n\n   ```html\n   <head>\n   <script language=\"JavaScript\">\n   var\
