  \n**7.** 保存文件并在浏览器中打开。你应该会看到一个空窗口，因为所有命令现在都包含在一个多行注释中。\n\n### 使用花括号\n\n除了像任务 7 中看到的以分号结尾的简单命令外，JavaScript\
  \ 还支持复合命令的概念。*复合命令*是一组命令，它们被当作单个命令处理，可以在 JavaScript 需要单个命令的任何地方使用。\n\n例如，考虑 JavaScript\
  \ 中的一个条件。你可以按如下方式构建一个条件操作：\n\n```\nif (condition) command\n```\n\n这条语句的基本逻辑是：如果条件为真，则执行该命令。\n\
  \n对于命令，你有两种选择：使用一个以分号结尾的单个命令，或者使用多个捆绑在一起的命令作为一个整体。\n\n使用单个命令时，你可能会有如下代码：`if (condition)\
  \ document.write(\"Hello\");`\n\n这里，如果条件为真，则执行 `document.write`。\n\n类似地，下面的示例将三条\
  \ `document.write` 命令组合成一个复合命令：\n\n```\nif (condition) {\n    document.write(\"\
  Hello\");\n    document.write(\" there\");\n    document.write(\".\");\n}\n```\n\
  \n***注意***\n* 入门源代码中的复合命令以左花括号开始，以右花括号结束。从开括号到闭括号的整个包被视为一个单一命令，用于诸如 `if` 语句等场合。\n\
  \n以下示例展示了如何使用花括号构建复合命令：\n\n**1.** 在你喜欢的 HTML 或文本编辑器中打开一个新的 HTML 文档。\n\n**2.** 使用开闭的\
  \ body 标签创建文档的主体：\n\n```\n<body>\n</body>\n```\n\n**3.** 在文档主体中插入一个脚本块：\n\n```\n\
  <script>\n</script>\n```\n\n**4.** 为 script 标签指定 JavaScript 作为语言：\n\n```\n<script\
  \ language=\"JavaScript\">\n```\n\n**5.** 在脚本块中放置开闭的 HTML 注释：\n\n```\n<!--\n// -->\n\
  ```\n\n**6.** 在脚本块中创建第一条命令。确保命令以分号结尾：\n\n```\ndocument.write(\"Hello\");\n```\n\n\
  **7.** 创建第二条命令，以分号结尾：\n\n```\ndocument.write(\"Hello\");\ndocument.write(\" there\"\
  );\n```\n\n**8.** 最后，在两条命令前后分别放置开闭的花括号，使最终脚本如清单 8-1 所示：\n\n```\n<body>\n<script\
  \ language=\"JavaScript\">\n<!--\n{\ndocument.write(\"Hello\");\ndocument.write(\"\
  \ there\");\n}\n// -->\n</script>\n</body>\n```\n\n**清单 8-1：** 由两条命令构建的复合命令。\n\n\
  **9.** 保存文件。\n\n**10.** 在支持 JavaScript 的浏览器中打开该文件。你应该会在浏览器中看到短语“Hello there”。\n\n\
  ***交叉引用***\n* 条件和 `if` 语句在任务 34 中介绍。这里我们不讨论具体的条件。\n\n### 向浏览器输出内容\n\nJavaScript\
  \ 最实用的方面之一，是能够从脚本中将文本和 HTML 输出到浏览器的输出流中，从而使这些文本和 HTML 像文档实际 HTML 的一部分一样显示在浏览器中。\n\
  \n实现这一点的关键是 `document.write` 方法。`document.write` 方法将其参数中包含的任何文本或 HTML 输出到浏览器。\n\n\
  ***备注***\n* *参数*是传递给方法的任何值。*方法*是与对象关联的函数；当你使用它时，它会根据你提供的参数执行某些指定的功能。`document` 对象是与当前正在浏览器窗口中渲染的文档相关联的对象。\n\
  * 重要的是，无论\n\n例如，如果你发出以下 `document.write` 命令：\n\n```\ndocument.write(\"<strong>Hello</strong>\"\
  );\n```\n\n浏览器会接收到以下 HTML 并进行渲染：\n\n```\n<strong>Hello</strong>\n```\n\n需要记住的一个重要点是，`document.write`\
  \ 在显示文本后不会输出任何换行类字符。这意味着如果你有\n\n\n\n\n\n## JavaScript 基础\n\n连续两条 `document.write`\
  \ 命令，这两条命令的输出会紧挨在一起。为了说明这一点，请看下面这对命令：\n\n```\ndocument.write(“Hello”);\ndocument.write(“Good-bye”);\n\
  ```\n\n发送到浏览器的只是参数中的文本，而 `document.write` 不会在输出的文本后添加任何换行符。\n\n你可能会认为这会导致以下内容被发送到浏览器：\n\
  \n```\nHello\nGood-bye\n```\n\n但实际上并非如此。发送的内容是：`HelloGood-bye`\n\n为了解决这个问题，`document`\
  \ 对象还提供了 `writeln` 方法。该方法会在输出文本后添加一个换行符。请看以下 JavaScript 代码：\n\n```\ndocument.writeln(“a”);\n\
  document.write(“b”);\n```\n\n这段代码发送到浏览器的内容为：\n\n```\na\nb\n```\n\n- 如果你查看介绍材料的末尾，就会发现关键在于使用\
  \ `document.writeln` 来输出字母 a。\n\n### 任务 9：使用 document.write 和 document.writeln\n\
  \n以下任务演示了 `document.write` 和 `document.writeln` 方法的使用：\n\n1. 在你偏好的 HTML 或文本编辑器中打开一个新的\
  \ HTML 文档。\n2. 使用开始和结束的 body 标签创建文档主体，并在其中指定 pre 标签：\n\n```\n<body><pre>\n</pre></body>\n\
  ```\n\n3. 在文档主体中插入一个脚本块：\n\n```\n<script>\n</script>\n```\n\n4. 为 script 标签指定 JavaScript\
  \ 作为语言：\n\n```\n<script language=”JavaScript”>\n```\n\n5. 在脚本块中放置开始和结束的 HTML 注释：\n\
  \n```\n<!--\n// -->\n```\n\n6. 在脚本块中创建一系列 `document.write` 和 `document.writeln`\
  \ 命令。最终页面应如清单 9-1 所示。\n\n```\n<body><pre>\n<script language=”JavaScript”>\n<!--\n\
  document.write(“He”);\ndocument.writeln(“llo”);\ndocument.write(“there”);\n// -->\n\
  </script>\n</pre></body>\n```\n\n**清单 9-1：** 使用 `document.write` 和 `document.writeln`。\n\
  \n7. 保存文件。\n8. 在支持 JavaScript 的浏览器中打开该文件。你应该会在浏览器中看到短语“Hello there”。\n\n### 任务 10：创建变量\n\
  \n编程中的一个关键概念是*变量*。与许多其他编程语言一样，JavaScript 也有变量。变量可以看作是有名称的容器。你可以将数据放入这些容器中，然后只需通过容器的名称来引用数据。通过一个简单的赋值操作即可创建变量：\n\
  \n```\n变量名 = 一些数据;\n```\n\n例如，你可以创建一个名为 `day` 的变量，并将值 `Tuesday` 赋给它：\n\n```\nday\
  \ = “Tuesday”;\n```\n\n作为良好的编程实践，你还应该在首次使用变量时声明它。声明变量有助于浏览器高效准确地处理和管理变量。要声明变量，只需使用\
  \ JavaScript 语句 `var`：\n\n```\nvar myVariable;\n```\n\n这声明了一个名为 `myVariable` 的变量，但没有给它赋值。你可以在后续的\
  \ JavaScript 命令中为其赋值：\n\n```\nvar myVariable;\n...\nmyVariable = “*某个值*”;\n```\n\
  \n如果你想立即声明变量并赋值，可以使用快捷方式一步完成：\n\n```\nvar myVariable = “*某个值*”;\n```\n\n你也可以多次给变量赋值，每次赋值都会用新值替换变量的旧值。例如，考虑以下代码：\n\
  \n```\nvar day = “Tuesday”;\nday = “Thursday”;\nday = “Monday”;\n```\n\n这段代码执行完毕后，`day`\
  \ 变量的值为 `Monday`。\n\n***注意***\n- 在此脚本中，你没有向浏览器生成输出。你只是创建了一个变量（参见步骤 3）。通常的做法是将所有\
  \ JavaScript 脚本放在 HTML 文档的头部，而只将用于向浏览器生成输出的 JavaScript 代码放在文档主体中。\n\n***警告***\n\
  - 在选择变量名时需要小心。名称可以包含字母、数字和下划线字符（`_`）。并且名称应以字母开头。\n\n***提示***\n- 虽然不声明变量也能运行，但声明变量并无坏处，而且是一种良好的编程实践（参见介绍段落）。\n\
  \n以下步骤展示了如何在 HTML 文档的头部创建一个实际的变量：\n\n1. 在编辑器中创建一个新的 HTML 文档。\n\n![Image 69](img/index-44_1.jpg)\n\
  \n2. 在文档的头部创建一个脚本块：\n\n```\n<head>\n<script language=”JavaScript”>\n</script>\n\
  </head>\n```\n\n3. 在脚本块中创建名为 `myVariable` 的变量并为其赋值：\n\n```\nvar myVariable = “Hello”;\n\
  ```\n\n4. 为文档创建一个主体，以显示你想在浏览器中呈现的任何 HTML。最终页面如清单 10-1 所示。\n\n```\n<head>\n<script\
  \ language=”JavaScript”>\nvar myVariable = “Hello”;\n</script>\n</head>\n<body>\n\
  我们在头部创建了一个变量。\n</body>\n```\n\n**清单 10-1：** 创建变量。\n\n5. 保存文件并关闭。\n6. 在浏览器中打开该文件。你应该只会看到文档的主体，如图\
  \ 10-1 所示。\n\n**图 10-1：** 在 JavaScript 中创建变量不会向浏览器产生任何输出。\n\n### 任务 11：输出变量\n\n\
  变量（在任务 10 中介绍）是存储值的容器。你可以在任何通常使用这些值的地方使用它们。文本字符串就是一个很好的例子。\n\n例如，你可以使用 `document.write`\
  \ 方法向浏览器输出文本字符串。完全可以将一个文本字符串赋值给一个变量，然后使用该变量来输出这段文本。你只需将变量作为参数传递给 `document.write`\
  \ 方法，代替原来的文本字符串：\n\n```\ndocument.write(myVariable);\n```\n\n这将输出变量 `myVariable`\
  \ 的内容。\n\n***注意***\n- 变量是命名的容器，你可以在其中存储数据。然后你可以通过容器的名称在脚本中引用这些数据。\n\n***交叉引用***\n\
  - 你会注意到 `myVariable` 周围没有引号（参见介绍段落）。如任务 12 所述，引号表示文本字符串；当输出变量的内容时，不要使用引号。否则，输出的是变量名。\n\
  \n以下示例展示了如何设置变量并在脚本中输出它：\n\n1. 在你偏好的 HTML 或文本编辑器中打开一个新的 HTML 文档。\n2. 使用开始和结束的 body\
  \ 标签创建文档主体：\n\n```\n<body>\n</body>\n```\n\n3. 在文档主体中插入一个脚本块：\n\n```\n<body>\n<script>\n\
  </script>\n</body>\n```\n\n4. 为 script 标签指定 JavaScript 作为语言：\n\n```\n<body>\n<script\
  \ language=”JavaScript”>\n</script>\n</body>\n```\n\n5. 在脚本块中放置开始和结束的 HTML 注释：\n\
  \n```\n<body>\n<script language=”JavaScript”>\n<!--\n// -->\n</script>\n</body>\n\
  ```\n\n![Image 70](img/index-46_1.jpg)\n\n6. 创建一个名为 `myVariable` 的变量，并为其赋一个文本字符串：\n\
  \n```\n<body>\n<script language=”JavaScript”>\n<!--\nvar myVariable = “Hello”;\n\
  // -->\n</script>\n</body>\n```\n\n7. 使用 `document.write` 输出变量的内容，使最终代码如清单 11-1\
  \ 所示。\n\n```\n<body>\n<script language=”JavaScript”>\n<!--\nvar myVariable = “Hello”;\n\
  document.write(myVariable);\n// -->\n</script>\n</body>\n```\n\n**清单 11-1：** 输出变量。\n\
  \n8. 保存文件。\n9. 在支持 JavaScript 的浏览器中打开该文件。你应该会在浏览器中看到单词“Hello”，如图 11-1 所示。\n\n**图\
  \ 11-1：** 输出的是变量的内容，而不是它的名称。\n\n\n\n\n\n## 第一部分\n\n## JavaScript 基础\n\n#### 任务 12：创建字符串\n\
  \n在 JavaScript 中处理数据和变量时，需要注意所使用的数据类型。不同的数据类型以不同的方式管理，理解一些基本数据类型非常重要。\n\n其中一种数据类型是字符串。*字符串*指的是任何可以包含字母、数字和标点符号的文本序列。在\
  \ JavaScript 中指定文本字符串时，需要用单引号或双引号将字符串括起来。例如，以下是有效的字符串：\n\n`\"Hello there\"`\n`'My\
  \ Phone number is 123-456-7890'`\n\n但以下不是有效的文本字符串：\n\n`\"Hello'`\n`What is your\
  \ name?`\n\n在第一种情况下，开头的引号是双引号，但结尾的是单引号；你可以使用单引号或双引号，但开头和结尾必须匹配。\n\n你在不同的上下文中使用这些字符串——例如，作为函数或方法的参数：\n\
  \n`document.write(\"This is a string\");`\n\n你也将它们用作赋给变量的值：\n\n`var aVar = \"This\
  \ is a string\";`\n\n在这两种情况下，如果没有用引号将字符串括起来，浏览器实际上会显示错误，因为它会将字符串视为 JavaScript 代码，而字符串中的文本不是有效的\
  \ JavaScript 代码。\n\n**注意：** JavaScript 中有多种不同的数据类型。最基本的类型是数字（数值）、字符串（文本）和布尔值（二元的、非此即彼的值，通常表示为\
  \ true/false 或 1/0）。\n\n以下任务展示了在脚本中创建包含字符串值的变量：\n\n1. 在你喜欢的 HTML 或文本编辑器中打开一个新的 HTML\
