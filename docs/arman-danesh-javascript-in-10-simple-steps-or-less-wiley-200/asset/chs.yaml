  \ false`。这个示例中的条件表达的意思是：“如果 `window.innerWidth` 存在，则将该值赋给 `width`；否则，将 `document.body.clientWidth`\
  \ 赋给 `width`。”\n\n- 将页面元素水平居中的公式需要确定对象左边缘的位置。你知道对象占据一定空间，而窗口剩余空间的一半应该位于对象的左侧。因此，从窗口宽度中减去对象宽度，再除以二，即可确定页面元素左边缘的位置（参见步骤\
  \ 5）。\n\n以下任务在页面上创建一个图层以及一个链接。当用户点击链接时，对象将在浏览器窗口中水平居中。\n\n### 任务 167\n\n**1.** 在新文档的头部，创建一个包含名为\
  \ `centerHorizontally` 函数的脚本块。该函数应接受一个名为 `objectID` 的参数，其中包含要操作的元素的 ID。\n\n**2.**\
  \ 创建一个名为 `thisObj` 的变量，并将其与函数参数中指定的对象 ID 关联。使用 `document.getElementById`：\n\n```\n\
  var thisObj = document.getElementById(objectID);\n```\n\n**3.** 创建一个名为 `width` 的变量，并将浏览器窗口工作区域的高度存储在该变量中：\n\
  \n```\nvar width = (window.innerWidth) ? window.innerWidth : document.body.clientWidth;\n\
  ```\n\n**4.** 将对象的宽度赋给名为 `objectWidth` 的变量：\n\n```\nvar objectWidth = parseInt(thisObj.style.width);\n\
  ```\n\n**5.** 计算对象左边缘的正确位置，并将其存储在变量 `newLocation` 中：\n\n```\nvar newLocation = (width\
  \ - objectWidth) / 2;\n```\n\n**6.** 将这个新位置赋给元素样式对象的 `left` 属性：\n\n```\nthisObj.style.left\
  \ = newLocation;\n```\n\n**7.** 创建一个图层，并使用 `div` 标签的 `style` 属性将其放置在你想要的任何位置。将图层的\
  \ ID 指定为 `myObject`：\n\n```\n<div id=\"myObject\" style=\"position: absolute; left:\
  \ 50px; top: 200px; background-color: #cccccc;\">My Object</div>\n```\n\n**8.**\
  \ 创建一个用户可点击的链接，用于调用 `centerHorizontally` 函数，最终页面应如清单 167-1 所示。\n\n```\n<head>\n\
  <script language=\"JavaScript\">\nfunction centerHorizontally(objectID) {\n    var\
  \ thisObj = document.getElementById(objectID);\n    var width = (window.innerWidth)\
  \ ? window.innerWidth : document.body.clientWidth;\n    var objectWidth = parseInt(thisObj.style.width);\n\
  \    var newLocation = (width - objectWidth) / 2;\n    thisObj.style.left = newLocation;\n\
  }\n</script>\n</head>\n<body>\n<div id=\"myObject\" style=\"position: absolute;\
  \ left: 50px; top: 200px; background-color: #cccccc;\">My Object</div>\n<a href=\"\
  javascript:centerHorizontally('myObject');\">Center object horizontally.</a>\n</body>\n\
  ```\n\n**清单 167-1：** 水平居中对象。\n\n**9.** 在浏览器中打开该文件，你现在会看到链接和对象。点击链接，对象将重新定位到浏览器窗口文档区域的水平中心。\n\
  \n---\n\n### 任务 168：在 CSS 中控制行高\n\n随着浏览器对层叠样式表支持的改进，网页设计师通过动态 HTML 控制页面外观各个方面的能力也随之增强。\n\
