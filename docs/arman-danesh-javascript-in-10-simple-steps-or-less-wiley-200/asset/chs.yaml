  \ 228：下载和安装书签工具  \n\n*书签工具*是简短的单行 JavaScript 脚本，以`javascript:JavaScript 代码`形式的 URL\
  \ 呈现。它们可以作为书签或收藏夹添加到浏览器中，然后通过从浏览器的书签或收藏夹列表中选择来调用。  \n\n网络上有许多书签工具的来源。这些网站将书签工具作为链接提供，您可以通过右键单击链接并从弹出菜单中选择“添加到收藏夹”（Internet\
  \ Explorer）或“为此链接添加书签”（Netscape）来将它们安装到浏览器中。  \n\n如果您想创建自己的书签工具（正如本书这一部分所做的那样），那么您需要知道如何轻松安装自己的书签工具。\
  \  \n\n对于 Internet Explorer，您可以使用以下步骤：  \n\n1. 在您喜欢的编辑器中创建书签工具。  \n2. 将书签工具复制到剪贴板。\
  \  \n3. 在浏览器中，选择菜单中的“收藏夹” ➪ “添加到收藏夹”。  \n4. 在“添加收藏夹”对话框（图 228-1）中，为收藏夹命名，然后单击“确定”按钮。\
  \  \n\n**图 228-1：** 添加收藏夹对话框。  \n\n5. 在“收藏夹”菜单中，右键单击您创建的新收藏夹，然后从出现的上下文菜单中选择“属性”。\
  \  \n6. 在“属性”对话框（图 228-2）中，将书签工具粘贴到 URL 字段中，然后单击“确定”按钮。  \n\n![Image 583](img/index-498_1.jpg)\
  \  \n![Image 584](img/index-498_2.jpg)  \n\n11 542419 Ch10.qxd 11/19/03 10:22 AM\
