  - 验证被分成两个函数，以便可以扩展到包含多个字段的表单。例如，您可以通过添加其他函数并从 `checkForm` 中调用它们来执行其他类型的验证。不过，从表单中仍然只调用\
  \ `checkForm`。\n- 注意，`this` 作为参数传递给 `checkForm` 函数。在表单标签的事件处理程序中，`this` 指的是表单本身的对象。\n\
  - 此处使用的 `onSubmit` 事件处理程序需要特别注意。不是简单地调用 `checkForm`，而是返回 `checkForm` 返回的值。由于 `checkForm`\
  \ 在表单正常时返回 `true`，否则返回 `false`，因此如果表单不正常，可以取消提交；如果表单正常，则允许继续提交。\n\n**1.** 在新 HTML\
  \ 文档中，创建一个包含 `checkCheckbox` 函数的脚本块，该函数接收一个复选框对象：\n\n```\nfunction checkCheckbox(check)\
