  \n#### 任务 243：在 Internet Explorer 中使用书签小程序搜索 Yahoo!\n\n用户常执行的一项操作是，在网页中找到某个单词或短语后，在\
  \ Yahoo! 等流行搜索引擎中进行搜索。通常的做法是选中该单词或短语，复制，打开 Yahoo!，然后将单词或短语粘贴到搜索框中。\n\n***注释***\n\
  • `document.selection` 对象仅在 Internet Explorer 中可用。此任务在 Netscape Navigator 中无效。\n\
  • `location.href` 属性反映当前页面的 URL。当为其分配新 URL 时，浏览器将显示该新 URL。\n\n在 Internet Explorer\
  \ 中使用 JavaScript，你可以构建一个书签小程序，使用户只需选中单词或短语，然后选择书签小程序，即可自动在 Yahoo! 上触发相应的搜索。\n\n\
  此书签小程序依赖于以下内容：\n\n- `location.href` 属性反映当前页面的 URL。当为其分配新 URL 时，浏览器将显示该新 URL。\n-\
  \ Internet Explorer 提供 `document.selection` 对象，用于反映网页中当前选中的文本。\n- `document.selection`\
  \ 对象的 `createRange` 方法返回一个指向选中范围的指针，该范围具有一个包含选中文本的 `text` 属性。\n- Yahoo! 期望在 URL\
  \ 中以 `http://search.yahoo.com/bin/search?p=搜索查询` 的形式提供搜索查询。\n\n以下步骤展示了如何创建此书签小程序：\n\
  \n**1.** 打开你通常用于编写 JavaScript 的文本编辑器。\n\n**2.** 将当前选中的文本保存在变量 `searchQuery` 中：`searchQuery\
  \ = document.selection.createRange().text;`\n\n**3.** 使用 `escape` 函数将选中的文本转换为 URL\
  \ 编码格式，并将结果保存回 `searchQuery`：`searchQuery = escape(searchQuery);`\n\n**4.** 将 `location.href`\
  \ 设置为 Yahoo! 搜索 URL，并将 `searchQuery` 的值附加到 URL 末尾；最终脚本如下所示：\n\n```\nsearchQuery\
