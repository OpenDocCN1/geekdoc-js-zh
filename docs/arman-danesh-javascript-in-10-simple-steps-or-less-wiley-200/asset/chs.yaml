  \ 移除脚本中的换行和空白，并在脚本开头添加 `javascript:` 协议，最终得到一个去除所有多余空格的单行 URL：\n   ```\n   javascript:for(i=0;i<document.links.length;i++){void(document.links[i].target='_blank');}\n\
  \   ```\n\n7. 使用此代码作为 URL 创建一个书签或收藏夹。要测试该书签小工具，请在浏览器中打开一个网页，如图 238-1 所示，然后选择你创建的新书签或收藏夹。如果你点击一个链接，它应该会在新窗口中打开，如图\
