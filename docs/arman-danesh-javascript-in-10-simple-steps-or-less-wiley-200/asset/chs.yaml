  \ 任务 157：允许 Cookie 在网站的所有页面中可见\n\n\n\n\n\n当通过 JavaScript 创建 cookie 时，默认情况下，只有服务器上同一目录下的其他页面才能访问该\
  \ cookie。不过，你可以定义服务器上允许访问你所创建 cookie 的目录路径。\n\n**注意**\n\n例如，你可以在页面 `/dir/subdir/mypage`\
  \ 中创建一个 cookie。\n\n- `escape` 函数接受一个字符串，并转义 URL 中无效的任何字符。转义过程是将字符替换为以百分号开头的数字代码。例如，空格变为\
  \ `%20`（参见步骤 5）。\n- 该 cookie 可从父目录及其所有子目录访问（换句话说，即 `/dir` 下的所有位置）。\n- 表示该 cookie\
