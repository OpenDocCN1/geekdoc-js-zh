  \ 任务 37：遍历数组\n\n任务 22 介绍了数组的概念：一组用于存储值的编号容器。有时你可能希望遍历数组中的每个元素。这可以通过使用 `for` 循环来实现，使得循环的索引变量在每次迭代中与数组的某个索引相匹配。`for`\
