  \ 222：使用 `onFocus` 响应表单字段获得焦点**\n\n使用 `onFocus` 事件处理程序，你可以在表单字段获得焦点时触发 JavaScript\
  \ 代码执行。获得焦点意味着，例如，光标被放置在文本字段中。\n\n***注意***\n此事件处理程序通常用于表单中，表单设计者在字段内显示提示文本；当用户点击字段时，提示文本消失，用户可以开始输入他或她想要的输入。\n\
  \n- 在处理文本字段的表单字段对象时，请记住 `value` 属性包含字段中的当前文本（参见步骤 4）。\n\n`onFocus` 事件处理程序也可用于在表单的其他部分处于特定状态时阻止编辑文本字段。例如，你可以使一个表单字段不可编辑，除非第二个文本字段包含适当的值。\n\
  \n以下示例展示了如何创建一个带有提示文本的文本字段，当用户将光标放入文本字段时，提示文本消失：\n\n1. 使用适当的 `form` 标签开始你的表单：\n\n\
  ```\n<form method=\"post\" action=\"http://my.url/\">\n```\n\n2. 创建一个具有默认初始值的文本字段；此初始值应为该字段的提示文本。表单字段可以有任何名称；文本字段首次显示给用户时应如图\
  \ 222-1 所示。\n\n```\n<input type=\"text\" name=\"myField\" value=\"Enter Your Name\"\
  >\n```\n\n**图 222-1：** 在文本字段中显示提示。\n\n![Image 545](img/index-484_1.jpg)\n\n3. 向文本字段添加一个\
  \ `onFocus` 属性：\n\n```\n<input type=\"text\" name=\"myField\" value=\"Enter Your\
  \ Name\" onFocus=\"\">\n```\n\n4. 将 `onFocus` 属性的值设置为 `this.value = ''`，以便在字段获得焦点时清除文本字段；当用户点击字段时，提示文本将消失，如图\
  \ 222-2 所示。\n\n***提示***\n- 文本字段中存储的值是字符串。当你想更改文本字段的值时，需要将一个字符串值赋给文本字段的 `value` 属性。在这种情况下，你分配一个空字符串来清除文本字段。\n\
  \n```\n<input type=\"text\" name=\"myField\" value=\"Enter Your Name\" onFocus=\"\
  this.value = ''\">\n```\n\n**图 222-2：** 当用户将光标焦点放入时，文本字段被清除。\n\n5. 添加任何其他字段，并使用结束的\
  \ `form` 标签关闭表单；你的最终表单可能如下所示：\n\n```\n<form method=\"post\" action=\"http://my.url/\"\
  >\n<input type=\"text\" name=\"myField\" value=\"Enter Your Name\" onFocus=\"this.value\
  \ = ''\">\n<input type=\"submit\" value=\"Submit\">\n</form>\n```\n\n***交叉引用***\n\
  - 任务 79 和 80 讨论了如何访问表单文本字段中显示的值。\n\n---\n\n**任务 223：使用 `onBlur` 在表单字段失去焦点时采取行动**\n\
  \n`onFocus` 的一个推论是 `onBlur` 事件处理程序。当表单字段失去光标焦点时，会调用此事件处理程序。使用此事件处理程序，你可以在用户输入数据后立即验证表单字段数据，并在用户输入的数据无效时阻止用户继续操作。类似地，你可以扩展任务\
  \ 222 中的示例，当用户从表单字段移除光标焦点时，如果用户没有输入任何自己的文本，你可以重新显示原始提示。\n\n***注意***\n- 在处理文本字段的表单字段对象时，请记住\
  \ `value` 属性包含字段中的当前文本（参见步骤 4）。\n- `if` 语句的逻辑如下：如果焦点移除时字段中的值是空字符串，则表示用户没有在文本字段中输入任何值，因此会在字段中重新显示提示（参见步骤\
  \ 6）。\n\n这种字段内提示的逻辑如下：\n\n- 首次显示时，文本字段包含作为提示的默认文本。\n- 当用户将光标放入文本字段时，默认文本消失。\n- 当用户从文本字段移除光标时，如果用户没有输入任何文本，则默认文本重新出现。\n\
  \n以下示例扩展了任务 222 中的示例，以提供完整的逻辑：\n\n1. 使用适当的 `form` 标签开始你的表单：\n\n```\n<form method=\"\
  post\" action=\"http://my.url/\">\n```\n\n\n\n\n\n## 处理事件\n\n2. 创建一个带有默认初始值的文本字段；该初始值应为字段的提示文本。表单字段可以有任何名称：\n\
  \n`<input type=\"text\" name=\"myField\" value=\"Enter Your Name\">`\n\n3. 为文本字段添加一个\
  \ `onFocus` 属性：\n\n`<input type=\"text\" name=\"myField\" value=\"Enter Your Name\"\
  \ onFocus=\"\">`\n\n4. 将 `onFocus` 属性的值设置为 `this.value = ''`，以便在字段获得焦点时清空文本字段；当用户点击该字段时，提示文本将消失：\n\
  \n`<input type=\"text\" name=\"myField\" value=\"Enter Your Name\" onFocus=\"this.value\
  \ = ''\">`\n\n5. 为文本字段添加一个 `onBlur` 属性：\n\n`<input type=\"text\" name=\"myField\"\
  \ value=\"Enter Your Name\" onFocus=\"this.value = ''\" onBlur=\"\">`\n\n![Image\
  \ 546](img/index-486_1.jpg)\n\n6. 将 `onBlur` 属性的值设置为 `if (this.value == '') { this.value\
  \ = 'Enter Your Name' }`，以便在用户离开字段且未输入任何文本时重新显示原始提示：\n\n`<input type=\"text\" name=\"\
  myField\" value=\"Enter Your Name\" onFocus=\"this.value = ''\" onBlur=\"if (this.value\
  \ == '') { this.value = 'Enter Your name' }\">`\n\n7. 添加任何其他字段，并使用闭合表单标签关闭表单；最终页面应如清单\
  \ 223-1 所示。当用户点击字段外部且未在字段中输入任何文本时，提示将重新出现，如图 223-1 所示。\n\n```\n<form method=\"post\"\
  \ action=\"http://my.url/\">\n<input type=\"text\" name=\"myField\" value=\"Enter\
  \ Your Name\" onFocus=\"this.value = ''\" onBlur=\"if (this.value == '') { this.value\
  \ = 'Enter Your name' }\">\n<input type=\"submit\" value=\"Submit\">\n</form>\n\
  ```\n\n**清单 223-1：** 字段内提示。\n\n**图 223-1：** 当字段失去焦点且仍为空时，提示重新出现。\n\n***交叉引用***\n\
  \n- 任务 222 提供了 `onFocus` 事件处理程序的示例。\n\n### 任务 224：使用 onSubmit 对表单数据进行后处理\n\nJavaScript\
  \ 事件处理程序的一个强大应用是在表单数据提交之前对其进行处理，以确保数据的有效性。通过这种方式，你可以确保必填字段已填写完毕，并且字段包含有效的数据类型（例如，如果你在文本字段中要求输入电话号码，则不应包含普通字符串）。通过在客户端使用\
  \ JavaScript 验证数据，你可以在提交表单之前提示用户修复问题，从而消除与服务器之间不必要的交互，这种交互会消耗带宽和服务器资源。\n\n对表单数据进行后处理的最简单方法是使用表单标签中的\
  \ `onSubmit` 事件处理程序来拦截表单提交。由 `onSubmit` 事件处理程序执行的 JavaScript 代码必须返回 `true` 或 `false`\
  \ 值。\n\n***注意***\n\n- 使用 `onSubmit` 时，如果事件触发时运行的 JavaScript 返回 `true`，则表单将被提交；否则，表单将不会被提交。这允许你执行表单字段验证，并在出现问题时返回\
  \ `false`，这意味着用户可以在尝试再次提交之前继续编辑表单。\n- 在表单标签内的事件处理程序中，`this` 关键字指的是与表单本身关联的对象。在这种情况下，它允许你将与表单关联的对象传递给\
  \ `processForm` 函数（参见步骤 9）。\n\n以下示例演示了一个包含两个文本字段的表单。在表单提交之前对字段进行验证，以确保第一个字段不为空，第二个字段不为空且包含数值。\n\
  \n1. 使用脚本标签开始一个脚本块：\n\n`<script language=\"JavaScript\">`\n\n2. 创建一个名为 `processForm`\
  \ 的函数，该函数接受一个名为 `targetForm` 的参数，该参数包含要处理的表单对象：\n\n```\nfunction processForm(targetForm)\
  \ {\n```\n\n3. 设置一个临时变量来跟踪表单是否验证成功；最初，假设验证将成功：\n\n`var success = true;`\n\n4. 测试名为\
  \ `text1` 的第一个表单字段是否为空，如果为空，则提醒用户并将 `success` 设置为 `false`：\n\n```\nif (targetForm.text1.value\
  \ == \"\") {\n    success = false;\n    window.alert(\"第一个表单字段不能为空\");\n}\n```\n\
  \n5. 测试名为 `text2` 的第二个表单字段是否包含数字，如果不包含，则提醒用户并将 `success` 设置为 `false`：\n\n```\nif\
  \ (typeof(targetForm.text2.value) != \"number\") {\n    success = false;\n    window.alert(\"\
  第二个表单字段必须包含数字\");\n}\n```\n\n![Image 547](img/index-488_1.jpg)\n\n6. 返回 `success`\
  \ 值，并关闭函数和脚本块，使脚本块如下所示：\n\n```\n<script language=\"JavaScript\">\nfunction processForm(targetForm)\
  \ {\n    var success = true;\n    if (targetForm.text1.value == \"\") {\n      \
  \  success = false;\n        window.alert(\"第一个表单字段不能为空\");\n    }\n    if (typeof(targetForm.text2.value)\
  \ != \"number\") {\n        success = false;\n        window.alert(\"第二个表单字段必须包含数字\"\
  );\n    }\n    return success;\n}\n</script>\n```\n\n7. 在文档的主体中，创建包含两个文本字段的表单：\n\
  \n```\n<form method=\"post\" action=\"http://my.url\">\n第一个字段：\n<input type=\"text\"\
  \ name=\"text1\"><br>\n第二个字段：\n<input type=\"text\" name=\"text2\"><br>\n<input\
  \ type=\"submit\" value=\"提交\">\n</form>\n```\n\n8. 为表单标签添加一个 `onSubmit` 属性：\n\n\
  `<form method=\"post\" action=\"http://my.url\" onSubmit=\"\">`\n\n9. 将 `onSubmit`\
  \ 属性的值设置为 `return processForm(this)`：\n\n`<form method=\"post\" action=\"http://my.url\"\
  \ onSubmit=\"return processForm(this)\">`\n\n10. 当用户提交表单时，如果表单未正确填写，用户将看到一个或两个错误消息，如图\
  \ 224-1 所示，并且表单将不会提交到服务器。\n\n**图 224-1：** 不完整的表单在提交时会产生错误。\n\n### 任务 225：使用 onLoad\
  \ 创建页面加载时执行的代码\n\n通常，你需要在页面加载后立即执行一些 JavaScript 代码，但要确保代码在页面完全加载之前不会执行。在加载时执行代码的最简单形式是将其放在脚本块中，但不在函数内部，如下面的\
  \ HTML 页面高级概述所示：\n\n```\n<head>\n<script language=\"JavaScript\">\n*在加载时执行的代码*\n\
  </script>\n</head>\n<body>\n*文档主体*\n</body>\n```\n\n这里的问题是，JavaScript 可能在文档主体加载完成之前执行。如果你的代码引用了执行时尚未加载的页面元素，这可能会导致问题；实际上，在这种情况下代码会抛出错误。\n\
  \n解决这个问题的方法在于使用 `onLoad` 事件处理程序。与 body 标签结合使用时，`onLoad` 事件处理程序会在文档的整个主体加载完成后执行。如果你将要在加载时执行的代码放在一个函数中，那么前面的代码使用\
  \ `onLoad` 转换为以下形式：\n\n```\n<head>\n<script language=\"JavaScript\">\nfunction startFunction()\
  \ {\n    *在加载时执行的代码*\n}\n</script>\n</head>\n<body onLoad=\"startFunction()\">\n\
  *文档主体*\n</body>\n```\n\n以下示例使用 `onLoad` 在页面被客户端加载到浏览器时，用当前日期填充表单文本字段：\n\n1. 使用脚本标签开始一个脚本块：\n\
  \n`<script language=\"JavaScript\">`\n\n![Image 548](img/index-490_1.jpg)\n\n\n\n\
  \n\n## 第 9 部分\n\n### 任务 225：当用户离开当前页面前往其他页面时执行代码\n\n2. 创建一个名为 `start` 的函数，该函数不接受任何参数：\n\
  \n```javascript\nfunction start() {\n```\n\n3. 创建一个新的日期对象，并将其赋值给变量 `now`：\n\n```javascript\n\
  var now = new Date();\n```\n\n4. 将文档中第一个表单的日期文本字段的值设置为当前日期：\n\n```javascript\ndocument.forms[0].date.value\
  \ = now.getFullYear() + \"/\" + now.getMonth() + \"/\" + now.getDay();\n```\n\n\
  > **提示：** 当你按照步骤 3 所示的方式创建一个新的 `Date` 对象时，该对象会被初始化为当前的日期和时间。\n\n5. 用花括号关闭函数：\n\n\
  ```javascript\n}\n```\n\n6. 在 HTML 文档的 `body` 标签中，添加一个值为 `start()` 的 `onLoad` 属性：\n\
  \n```html\n<body onLoad=\"start()\">\n```\n\n7. 创建一个包含名为 `date` 的文本字段的表单，该字段没有初始默认值：\n\
  \n```html\n<form method=\"post\" action=\"http://my.url\">\n  <input type=\"text\"\
  \ name=\"date\">\n</form>\n```\n\n8. 在浏览器中加载该页面；表单字段应包含当前日期，如图 225-1 所示。\n\n**图\
  \ 225-1：** 文档加载时，日期被放入文本字段中。\n\n---\n\n### 任务 226：当用户离开当前页面前往其他页面时执行代码\n\n正如可以在页面加载完成时执行代码一样，也可以指定在页面卸载时执行的\
  \ JavaScript 代码。当用户输入新的 URL 进行访问或点击链接跳转到其他页面时，就会发生页面卸载。\n\n> **注意：** 弹出式广告在互联网上已经成为一个严重的问题，以至于一些流行的\
  \ PC 安全软件会自动阻止弹出窗口的出现。\n\n你可以通过在文档的 `body` 标签中使用 `onUnload` 事件处理程序来指定这段代码。这个事件处理程序最常见的用途或许也是最令人讨厌的：那些不会消失的弹出式广告。有些网站只在你离开页面时弹出广告，并且每当你关闭一个窗口，它就会继续弹出一个新的广告。\n\
  \n尽管如此，使用 `onUnload` 事件处理程序也有一些合理的理由：\n\n- 让用户停留在应用程序的某个页面上，直到他/她完成一项重要或必需的任务\n\
  - 显示告别信息\n- 执行一些清理任务，例如在用户离开你的网站时立即删除你想要清除的 cookie\n\n下面的示例使用 `onUnload` 在一个简单的对话框中向用户显示告别信息：\n\
  \n1. 像平常一样创建你的 HTML 文档。一个简单的 HTML 文档可能如下所示：\n\n```html\n<html>\n  <head>\n    <title>Simple\
  \ HTML</title>\n  </head>\n  <body>\n    Hello World\n  </body>\n</html>\n```\n\n\
  2. 将 `onUnload` 属性添加到 `body` 标签中：\n\n```html\n<body onUnload=\"\">\n```\n\n3. 输入\
  \ `window.alert`，后跟一个左括号和一个单引号，作为属性值的第一部分：\n\n```html\n<body onUnload=\"window.alert('\"\
  >\n```\n\n![Image 549](img/index-492_1.jpg)\n![Image 550](img/index-492_2.jpg)\n\
  \n4. 输入你的告别信息；这里的信息是“Goodbye World”：\n\n```html\n<body onUnload=\"window.alert('Goodbye\
  \ World\n```\n\n5. 用单引号和右括号结束函数调用：\n\n```html\n<body onUnload=\"window.alert('Goodbye\
  \ World')\">\n```\n\n6. 在浏览器中打开此页面，你会看到如图 226-1 所示的页面。接着打开另一个 URL；浏览器会在一个对话框中显示“Goodbye\
  \ World”信息，如图 226-2 所示。\n\n> **提示：** `window.alert` 方法接受一个参数：一个字符串。然后它会将该字符串作为对话框的内容显示出来。该对话框将包含一个按钮，用户可以用它来关闭对话框（参见步骤\
  \ 3）。\n\n**图 226-1：** 初始页面。\n\n> **交叉引用：** 有关如何创建警告对话框的信息，请参阅任务 25。\n\n**图 226-2：**\
  \ 使用 `onUnload` 事件处理程序显示告别信息。\n\n![Image 551](img/index-493_1.jpg)\n\n---\n\n###\
  \ 任务 227：当用户在选项列表中进行选择时执行操作\n\n当今许多 Web 应用程序提供的动态表单中，一个常见功能是：用户在表单的一个选项列表中的选择，决定了其他表单字段的值，甚至决定了另一个选项列表中的可用选项。为此，你需要能够在列表中的选定项发生变化时调用特定的\
  \ JavaScript 代码。这可以通过 `onChange` 事件处理程序来实现，该处理程序在 `select` 标签中指定。\n\n> **注意：** 在\
  \ `form` 标签内部的事件处理程序中，`this` 关键字指的是与表单本身关联的对象。选项列表的对象有一个 `form` 属性，该属性指向包含该选项列表的表单对象（参见步骤\
  \ 8）。\n\n下面的示例创建了一个简单的表单，其中用户在选项列表中选择的值会显示在选项列表旁边的文本字段中：\n\n1. 使用适当的表单标签开始你的表单：\n\
  \n```html\n<form method=\"post\" action=\"http://my.url/\">\n```\n\n2. 使用 `select`\
  \ 标签开始你的选项列表，并将字段命名为 `myList`：\n\n```html\n<select name=\"myList\">\n```\n\n3. 通过一系列\
  \ `option` 标签提供列表的条目；确保显示的文本和条目的值不同：\n\n```html\n<option value=\"1\">One</option>\n\
  <option value=\"2\">Two</option>\n<option value=\"3\">Three</option>\n```\n\n4.\
  \ 使用结束的 `select` 标签关闭选项列表；这将生成一个如图 227-1 所示的选项列表：\n\n```html\n</select>\n```\n\n\
  **图 227-1：** 创建一个选项列表。\n\n![Image 552](img/index-494_1.jpg)\n\n5. 创建一个名为 `myText`\
  \ 的空文本字段：\n\n```html\n<input type=\"text\" name=\"myText\">\n```\n\n6. 使用结束的 `form`\
  \ 标签关闭表单，使表单看起来像这样：\n\n```html\n<form method=\"post\" action=\"http://my.url/\"\
  >\n  <select name=\"myList\">\n    <option value=\"1\">One</option>\n    <option\
  \ value=\"2\">Two</option>\n    <option value=\"3\">Three</option>\n  </select>\n\
  \  <input type=\"text\" name=\"myText\">\n</form>\n```\n\n7. 在表单的 `select` 标签中添加\
  \ `onChange` 属性：\n\n```html\n<select name=\"myList\" onChange=\"\">\n```\n\n8. 为\
  \ `onChange` 标签分配以下值：`this.form.myText.value = this.value`，以便在选择新项目时将选定项的值赋给 `myText`\
  \ 文本字段：\n\n```html\n<select name=\"myList\" onChange=\"this.form.myText.value =\
  \ this.value\">\n```\n\n9. 在浏览器中打开页面，并在列表中选择一个项目；其值会显示在文本字段中，如图 227-2 所示。\n\n> **交叉引用：**\
