  \ JavaScript，通过 `a` 标签的 `onClick` 属性将 `document.location` 属性设置为新 URL 的 URL。例如：\n\
  \n```\n<a href=\"#\" onClick=\"document.location = *新 URL*;\"> *链接文本*</a>\n```\n\
  \n> **注意：** `document.location` 属性反映当前加载的文档。通过将此属性的值更改为另一个 URL，浏览器窗口将重定向到该新 URL\
  \ 并显示它。\n\n本任务使用 JavaScript 重定向用户的浏览器，展示了如何构建一个简单的页面，当用户点击链接时，该页面会将用户带到新页面：\n\n\
  1. 在一个新 HTML 文档的正文中，创建一个链接：\n\n   `<a href=\"\">打开新文档</a>`\n\n2. 在 `a` 标签中使用 `#`\
