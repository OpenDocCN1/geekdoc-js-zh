  \ JavaScript，并撰写了一些最早的相关书籍，包括《一周学会 JavaScript》和《JavaScript 开发者指南》。阿尔曼已撰写了 20 多本技术书籍，包括《ColdFusion\
  \ MX 开发者手册》（Sybex）、《精通 ColdFusion MX》（Sybex）、《SAIR Linux 与 Gnu 认证管理员全合一考试指南》（Osborne/McGraw-Hill）以及《安全无忧：保护家庭网络与在线隐私》（Sams）。他正在不列颠哥伦比亚省温哥华附近的西蒙弗雷泽大学攻读计算机科学高级学位。\n\
