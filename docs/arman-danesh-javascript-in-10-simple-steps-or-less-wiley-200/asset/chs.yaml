  \ 任务 20：创建数组\n\n除了文本字符串和数字等简单数据类型外，JavaScript 还支持一种更复杂的数据类型，称为数组。*数组* 是将多个独立值组合在一起的集合。数组本质上包含一系列带编号的容器，你可以将值放入其中。每个容器可以包含字符串、数字或任何其他数据类型。\n\
  \n**注意**\n\n- 数组中的容器通过 `arrayName[0]`、`arrayName[1]`、`arrayName[2]` 等来引用。每个单独的容器都可以像普通变量一样被操作和使用。你可以将数组想象成图\
  \ 20-1 所示的样子：这里有一组盒子，每个盒子都有编号，每个盒子里面都有东西。盒子的编号就是每个盒子的索引，里面的值就是每个数组元素的值。\n- 你可能已经注意到第一个容器的编号是\
  \ 0。与许多编程语言一样，JavaScript 从零开始计数，因此数组中的第一个容器编号为 0。\n- 数组中每个容器对应的数字（例如 0、1 或 2）称为\
  \ *索引*。\n- 如果你创建一个包含 5 个元素的数组，那么这些元素的索引分别是 0、1、2、3 和 4。\n\n**图 20-1：** 数组的可视化表示。\n\
  \n要创建一个新数组，你需要创建 `Array` 对象的一个新实例：\n\n```javascript\nvar arrayName = new Array(number\
  \ of elements);\n```\n\n其中元素数量只是数组中元素的初始数量；在操作数组时，你可以随时动态添加更多元素，但最好在初始化时指定可能用到的元素数量。然后通过\
  \ `arrayName` 来访问该数组。\n\n以下任务在文档头部的一个脚本中创建了一个数组：\n\n**任务 20**\n\n1. 在你喜欢的 HTML 或文本编辑器中打开一个新的\
  \ HTML 文档。\n2. 使用开始和结束 head 标签创建文档的头部：\n   ```html\n   <head>\n   </head>\n   ```\n\
  3. 在文档头部插入一个脚本块：\n   ```html\n   <head>\n   <script language=\"JavaScript\">\n \
  \  <!--\n   // -->\n   </script>\n   </head>\n   ```\n4. 创建一个名为 `myArray` 的变量，并将其初始化为一个包含五个元素的新数组：\n\
  \   ```html\n   <body>\n   <script language=\"JavaScript\">\n   <!--\n   var myArray\
  \ = new Array(5);\n   // -->\n   </script>\n   </body>\n   ```\n5. 保存文件并关闭。\n\n\
  ### 任务 21：填充数组\n\n任务 21 向你展示了如何创建数组。然而，除非你能用值填充数组的元素，否则数组并不是很有用。你可以通过向数组元素赋值来填充它们，就像向普通变量赋值一样：\n\
  \n```javascript\narrayName[0] = value 1;\narrayName[1] = value 2;\n// 等等。\n```\n\
  \n**注意：** 数组中每个容器的数值称为 *索引*。\n\n此外，你实际上可以在创建数组的同时填充它；在创建数组时，你可以不指定要创建的元素数量，而是指定一个逗号分隔的值列表作为数组的元素：\n\
  \n```javascript\nvar arrayName = new Array(value 1, value 2, value 3, etc.)\n```\n\
  \n以下任务演示了如何创建两个包含相同五个元素的数组。这两个数组使用两种不同的技术创建并填充。\n\n1. 在你喜欢的 HTML 或文本编辑器中打开一个新的 HTML\
  \ 文档。\n2. 使用开始和结束 head 标签创建文档的头部：\n   ```html\n   <head>\n   </head>\n   ```\n3.\
  \ 在文档头部插入一个脚本块：\n   ```html\n   <head>\n   <script language=\"JavaScript\">\n  \
  \ <!--\n   // -->\n   </script>\n   </head>\n   ```\n4. 创建一个名为 `myArray` 的变量，并将其初始化为一个包含五个元素的新数组：\n\
  \   ```javascript\n   var myArray = new Array(5);\n   ```\n5. 为五个元素赋值：\n   ```javascript\n\
  \   myArray[0] = \"First Entry\";\n   myArray[1] = \"Second Entry\";\n   myArray[2]\
  \ = \"Third Entry\";\n   myArray[3] = \"Fourth Entry\";\n   myArray[4] = \"Fifth\
  \ Entry\";\n   ```\n6. 创建第二个名为 `anotherArray` 的数组，并在创建时为其赋予五个值。最终的脚本应如清单 21-1 所示。\n\
  \n   **提示：**\n   - 你不必按顺序填充元素，也可以将某些元素留空。例如，你可以按顺序填充数组的第五个、第一个和第二个元素，而将第三个和第四个元素留空。这完全没问题。\n\
  \   - 除了字符串之外，你还可以将其他类型的值赋给数组元素。本例中我们恰好使用了字符串。如果你愿意，也可以将数字甚至其他数组作为数组元素的值。\n\n  \
  \ ```html\n   <head>\n   <script language=\"JavaScript\">\n   <!--\n   var myArray\
  \ = new Array(5);\n   myArray[0] = \"First Entry\";\n   myArray[1] = \"Second Entry\"\
  ;\n   myArray[2] = \"Third Entry\";\n   myArray[3] = \"Fourth Entry\";\n   myArray[4]\
  \ = \"Fifth Entry\";\n\n   var anotherArray = new Array(\"First Entry\", \"Second\
  \ Entry\", \"Third Entry\", \"Fourth Entry\", \"Fifth Entry\");\n   // -->\n   </script>\n\
  \   </head>\n   ```\n\n   **清单 21-1：** 创建数组的两种方法。\n\n7. 保存文件并关闭。\n\n### 任务 22：对数组进行排序\n\
  \n一旦你按照任务 21 所述填充了数组，你可能会发现对数组中的元素进行排序很有用。有时你可能希望按照元素创建并添加到数组的顺序输出它们，但其他时候你可能希望它们按排序顺序输出。\n\
  \n数组对象提供了一个 `sort` 方法来实现这一点：它返回一个按排序顺序排列的逗号分隔的元素列表。排序按字母顺序或数字顺序升序进行，视情况而定。\n\n要使用该方法，只需调用它：\n\
