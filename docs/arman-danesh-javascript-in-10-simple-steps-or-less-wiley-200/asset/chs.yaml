  \n## 操作浏览器窗口\n\n#### 任务 142\n\n## 在 JavaScript 中动态创建框架\n\n#### 任务 143\n\n在前面处理框架的任务中，所有示例都静态定义了一个框架集。本任务展示了如何使用\
  \ JavaScript 创建框架集，从而最终能够以编程方式决定框架集中显示的布局和文档。\n\n***注意***\n\n• 在使用 `document.write`\
  \ 输出 HTML 时，请小心使用引号。如果用双引号括起输出的字符串，那么属性应使用单引号。否则，需要使用反斜杠（`\\\"`）转义双引号。\n\n原理很简单：在脚本中使用\
  \ `document.write` 输出框架集和框架标签，并在必要时动态指定属性。例如，如果要在框架中显示的文档名称包含在变量中，则可以使用以下代码输出该框架的标签：\n\
  \n```\ndocument.write(“<frame src=’” + frameUrl + “‘>”);\n```\n\n以下步骤演示了如何在 JavaScript\
  \ 中创建框架集，然后在框架中显示两个简单的 HTML 文件：\n\n**1.** 创建一个新文档来存放框架集代码。在该文档中，创建一个脚本块：\n\n```\n\
  <script language=”JavaScript”>\n```\n\n**2.** 在脚本中，使用 `document.open` 打开一个新的文档输出流：\n\
  \n```\ndocument.open();\n```\n\n**3.** 使用 `document.write` 将框架集代码输出到浏览器，并使用 `document.close`\
  \ 关闭流，因此脚本如清单 143-1 所示。\n\n```\n<script language=”JavaScript”>\ndocument.open();\n\
  document.write(“<frameset cols=’50%,*’>”);\ndocument.write(“<frame src=’143a.html’>”);\n\
  document.write(“<frame src=’143b.html’>”);\ndocument.write(“</frameset>”);\ndocument.close();\n\
  </script>\n```\n\n**清单 143-1：** 使用 JavaScript 创建框架集。\n\n**4.** 保存文件并关闭。\n\n![Image\
  \ 345](img/index-318_1.jpg)\n\n**5.** 创建一个用于在左侧框架中显示的 HTML 文档：\n\n```\n<body>\n\
  这是 frame 1。\n</body>\n```\n\n**6.** 将文件保存在框架集中为左侧框架指定的位置，然后关闭。\n\n***提示***\n\n•\
  \ 这种在 JavaScript 中动态创建 HTML 的技术非常灵活，不仅限于框架。任何 HTML 标签都可以动态交付，以便其属性可以在 JavaScript\
  \ 中动态指定。\n\n**7.** 创建一个用于在左侧框架中显示的 HTML 文档：\n\n```\n<body>\n这是 frame 2。\n</body>\n\
