  \n### 任务 56：创建“页面加载中...”占位符\n\n**90**  \n**第 2 部分**\n\n### 任务 44：访问 document 对象\n\
  \n`document` 对象是 JavaScript 中一个极其强大且重要的对象，它允许您将数据输出到浏览器的文档流中，以及访问浏览器中当前渲染文档中的元素。\n\
  \n使用此对象，您可以在文档中生成动态输出，并且可以在文档渲染后操作其状态。`document` 对象提供了大量信息、方法以及对反映当前文档的对象的访问，包括以下内容：\n\
  \n- 包含当前文档中的锚点、小程序、嵌入对象、表单、层、链接和插件的数组。\n- 提供当前页面信息的属性，包括链接颜色、页面背景颜色、关联的 cookie、页面域、修改日期、引用文档、标题以及当前文档的\
  \ URL。\n- 允许将文本输出到文档流的方法、处理事件的事件，以及返回文档中当前选中文本的事件。\n\n***注意***  \n`window.alert`\
  \ 方法接受一个字符串作为参数；该字符串应为要在对话框中显示的消息。在本例中，您要显示的是当前文档的 URL，该 URL 已存储在 `myURL` 变量中，因此您只需将该变量作为参数传递给该方法。\n\
  \n以下示例通过在一个对话框中显示当前页面的域，说明了 `document` 对象的简单用法：\n\n1. 创建一个脚本块，包含开闭脚本标签：\n\n```html\n\
  <script language=\"JavaScript\">\n</script>\n```\n\n2. 使用以下命令将当前 URL 赋值给一个名为 `myURL`\
  \ 的临时变量：\n\n```html\n<script language=\"JavaScript\">\nvar myURL = document.URL;\n\
  </script>\n```\n\n![Image 123](img/index-114_1.jpg)\n\n**输出到浏览器**  \n**91**  \n\
  **任务 44**\n\n3. 包含 `window.alert` 方法以显示一个对话框：\n\n```html\n<script language=\"JavaScript\"\
  >\nvar myURL = document.URL;\nwindow.alert();\n</script>\n```\n\n4. 将 `myURL` 变量作为参数传递给\
  \ `window.alert`，使最终脚本如清单 44-1 所示。\n\n```html\n<script language=\"JavaScript\">\n\
  var myURL = document.URL;\nwindow.alert(myURL);\n</script>\n```\n\n**清单 44-1:**\
  \ 用于显示当前 URL 的脚本。\n\n5. 将脚本保存到 HTML 文件中，并在浏览器中打开该 HTML。您应该会看到一个如图 44-1 所示的对话框。\n\
  \n**图 44-1:** 在对话框中显示当前 URL。\n\n***交叉引用***  \n- 变量的创建（包括变量名的适当选择）在任务 10 中讨论。  \n\
  - `window.alert` 方法显示一个包含单条文本消息和一个用于关闭对话框的按钮的对话框。该方法在任务 25 中讨论。\n\n**92**  \n**第\
  \ 2 部分**\n\n### 任务 45：输出动态 HTML\n\n每当您需要将动态 HTML 内容输出到文档流中时，可以使用 `document.write`\
  \ 方法。该方法允许您指定要包含在浏览器渲染的文档流中的任何文本。\n\n概念很简单。考虑以下简单的部分 HTML 文档：\n\n```html\n<p>以下值来自\
  \ JavaScript 的动态输出：</p>\n<script language=\"JavaScript\">\ndocument.write(\"<p><strong>动态内容</strong></p>\"\
  );\n</script>\n<p>动态输出示例到此结束。</p>\n```\n\n结果是浏览器将渲染输出，就好像以下纯 HTML 源代码已发送到浏览器：\n\n\
  ```html\n<p>以下值来自 JavaScript 的动态输出：</p>\n<p><strong>动态内容</strong></p>\n<p>动态输出示例到此结束。</p>\n\
  ```\n\n使用 `document.write` 方法，您可以将 HTML 中生成的任何动态字符串输出到文档流中。以下示例使用 `document` 对象的属性获取引用页面、当前文档的域以及当前文档的\
  \ URL，并输出它们：\n\n***注意***  \n- 在本任务中，您会看到连接的使用。*连接* 是使用 `+` 运算符将一个或多个字符串组合成一个长字符串的操作。\
  \  \n- `document.write` 方法接受一个参数。该参数必须是一个字符串。步骤 4 和 5 中使用的连接操作会计算成一个字符串，因此整个连接表达式可以作为参数传递给\
  \ `document.write`。\n\n1. 使用脚本标签开始一个脚本块：\n\n```html\n<script language=\"JavaScript\"\
  >\n```\n\n2. 使用 `document.write` 显示一条介绍性消息：\n\n```javascript\ndocument.write(\"\
  <p>以下是关于本文档的一些信息：</p>\");\n```\n\n3. 输出一个 `ul` 标签以开始一个无序列表：\n\n```javascript\ndocument.write(\"\
  <ul>\");\n```\n\n4. 将引用文档作为列表项输出：\n\n```javascript\ndocument.write(\"<li>引用文档：\"\
  \ + document.referrer + \"</li>\");\n```\n\n![Image 124](img/index-116_1.jpg)\n\n\
  **输出到浏览器**  \n**93**  \n**任务 45**\n\n5. 将当前文档的域作为列表项输出：\n\n```javascript\ndocument.write(\"\
  <li>域：\" + document.domain + \"</li>\");\n```\n\n6. 将当前文档的 URL 作为列表项输出：\n\n```javascript\n\
  document.write(\"<li>URL：\" + document.URL + \"</li>\");\n```\n\n7. 通过输出一个闭合的 `ul`\
  \ 标签来关闭脚本；生成的脚本应如清单 45-1 所示。\n\n```html\n<script language=\"JavaScript\">\ndocument.write(\"\
  <p>以下是关于本文档的一些信息：</p>\");\ndocument.write(\"<ul>\");\ndocument.write(\"<li>引用文档：\"\
  \ + document.referrer + \"</li>\");\ndocument.write(\"<li>域：\" + document.domain\
  \ + \"</li>\");\ndocument.write(\"<li>URL：\" + document.URL + \"</li>\");\ndocument.write(\"\
  </ul>\");\n</script>\n```\n\n**清单 45-1:** 在文档流中动态输出信息的脚本。\n\n\n\n\n\n**8.** 将脚本保存为\
  \ HTML 文件，并在浏览器中打开该文件。结果应如图 45-1 所示。\n\n***交叉引用***\n\n- `document.write` 方法用于从 JavaScript\
  \ 脚本中向浏览器窗口输出内容。该方法在 **图 45-1：** 浏览器中显示的动态内容中介绍。\n\n任务 9.\n\n![Image 125](img/index-117_1.jpg)\n\
  \n## 第 2 部分\n\n### 任务 46：在输出中包含换行符\n\n`document.write` 方法很有用，但有时也存在局限性。特别是，`document.write`\
  \ 方法不会在每个输出的字符串末尾输出换行符。\n\n考虑以下 JavaScript 代码片段：\n\n```\ndocument.write(“<strong>a</strong>”);\n\
  document.write(“b”);\n```\n\n实际上，这与以下 HTML 代码相同：\n\n```\n<strong>a</strong>b\n```\n\
  \n请注意，“b”与“a”在同一行，尽管它们是在 JavaScript 代码的不同行中通过两个 `document.write` 命令输出的。这意味着输出时字母之间没有空格，如图\
  \ 46-1 所示。\n\n**图 46-1：** `document.write` 不输出换行符\n\n当然，这与将 HTML 写在两行的情况略有不同，例如：\n\
  \n```\n<strong>a</strong>\nb\n```\n\n在这种情况下，第一行代码后的换行符会被浏览器渲染为一个空格。\n\n在预格式化文本块（`pre`\
  \ 标签内的文本）中，这个问题变得更加突出。\n\n为了解决这个问题，`document` 对象还提供了 `document.writeln` 方法。该方法与\
  \ `document.write` 方法完全相同，不同之处在于它会在字符串末尾向浏览器输出一个换行符。这意味着以下代码\n\n```\ndocument.writeln(“<strong>a</strong>”);\n\
  document.writeln(“b”);\n```\n\n本质上与以下 HTML 代码相同：\n\n```\n<strong>a</strong>\nb\n\
  ```\n\n![Image 126](img/index-118_1.jpg)\n\n这在换行符很重要，并且您希望确保通过 JavaScript 显示的每行文本末尾都输出一个换行符的情况下非常有用。\n\
  \n为了说明 `document.writeln` 的用法，以下示例是任务 45 中示例的变体，不同之处在于数据使用 `document.writeln` 方法作为预格式化文本输出：\n\
  \n1. 使用 `script` 标签开始一个脚本块：\n\n   ```\n   <script language=”JavaScript”>\n   ```\n\
  \n2. 使用 `document.write` 显示一条介绍性消息：\n\n   ```\n   document.writeln(“<p>Here’s some\
  \ information about this document:</p>”);\n   ```\n\n3. 输出一个 `pre` 标签以开始预格式化文本部分：\n\
  \n   ```\n   document.writeln(“<pre>”);\n   ```\n\n4. 输出引用文档：\n\n   ```\n   document.writeln(“\
  \ Referring Document: “ + document.referrer);\n   ```\n\n5. 输出当前文档的域：\n\n   ```\n\
  \   document.writeln(“ Domain: “ + document.domain);\n   ```\n\n6. 输出当前文档的 URL：\n\
  \n   ```\n   document.writeln(“ URL: “ + document.URL);\n   ```\n\n7. 通过输出一个结束的\
  \ `pre` 标签，后跟一个结束的 `script` 标签来关闭脚本：\n\n   ```\n   document.writeln(“</pre>”);\n\
  \   </script>\n   ```\n\n8. 将脚本保存为 HTML 文件，并在浏览器中打开该文件。结果如图 46-2 所示。\n\n**图 46-2：**\
  \ 在预格式化文本块中浏览器显示的动态内容。\n\n***注释***\n- 通常情况下，`document.write` 不输出换行符这一事实对代码的影响很小（如果有的话）。毕竟，标准\
  \ HTML 中的换行符实际上并不会在浏览器中渲染。尽管如此，这并不意味着您可以简单地忽略缺少换行符的问题。\n- 在预格式化代码块中，换行符实际上会被渲染为换行符。这意味着，如果您期望将两个输出行放在不同行的\
  \ `document.write` 命令中会使它们在不同行上渲染，那么您会对结果感到惊讶。\n\n***提示***\n- 使用 `document.write`\
  \ 和 `document.writeln` 时需要小心。特别是，如果作为参数传递的字符串包含在双引号中，那么您不能在字符串中直接包含双引号。您需要将字符串中的双引号转义为\
  \ `\\\"`。如果不这样做，双引号将结束字符串，其后的所有内容都不会被视为参数的一部分，从而导致 JavaScript 生成错误消息。如果字符串用单引号括起来，同样适用：您需要将字符串中的单引号转义为\
  \ `\\'`。\n\n### 任务 47：向浏览器输出日期\n\n当确实需要在浏览器中显示无法预先生成、必须在文档显示时生成的动态内容时，使用 `document.write`\
  \ 和 `document.writeln` 就变得很有用。\n\n一个很好的例子是在页面中显示当前日期和时间。例如，一个发布时效性新闻的网站可能希望人们知道该网站上的新闻是截至当前时间的最新消息，并且可以通过在页面中始终显示当前时间来实现这一点。\n\
  \n幸运的是，JavaScript 提供了一个 `Date` 对象，您可以使用它快速轻松地获取当前日期，然后将该日期输出到浏览器。为此目的而基本使用 `Date`\
  \ 对象非常简单，以下脚本可以插入到 HTML 文件中您想要显示当前日期和时间的任何位置：\n\n1. 使用 `script` 标签开始一个脚本块：\n\n \
  \  ```\n   <script language=”JavaScript”>\n   ```\n\n2. 创建一个新的 `Date` 对象并将其赋值给变量\
  \ `thisDate`：\n\n   ```\n   var thisDate = new Date();\n   ```\n\n3. 使用 `Date` 对象的\
  \ `toString` 方法显示日期：\n\n   ```\n   document.write(thisDate.toString());\n   ```\n\
  \n4. 使用结束的 `script` 标签关闭脚本；此脚本的最终源代码应如清单 47-1 所示。\n\n   ```\n   <script language=”JavaScript”>\n\
  \   var thisDate = new Date();\n   document.write(thisDate.toString());\n   </script>\n\
  \   ```\n\n   **清单 47-1：** 用于显示当前日期的脚本。\n\n![Image 127](img/index-120_1.jpg)\n\n\
  5. 在 HTML 文档中任何您想要显示当前日期的位置包含此脚本。例如，清单 47-2 是一个包含该脚本的简单 HTML 文档；在浏览器中显示时，该页面如图 47-1\
  \ 所示。\n\n   ```\n   <html>\n   <body>\n   <p>\n   The current date is:\n   <script\
  \ language=”JavaScript”>\n   var thisDate = new Date();\n   document.write(thisDate.toString());\n\
  \   </script>\n   </p>\n   </body>\n   </html>\n   ```\n\n   **清单 47-2：** 在文档正文中包含脚本。\n\
  \n**图 47-1：** HTML 文档中显示的日期。\n\n***注释***\n- 这里使用的 `Date` 方法被称为*构造函数方法*。大多数对象都有一个构造函数方法，用于创建该对象的新实例。在这里，使用不带参数的\
  \ `Date` 构造函数方法会得到一个 `Date` 对象，其日期设置为当前日期和时间。\n- `Date` 对象的 `toString` 方法以标准格式返回当前日期和时间的字符串。您无法直接控制该格式。\n\
  \n### 任务 48：在选定的时区中输出日期和时间\n\n以格林威治标准时间（也称为协调世界时）作为共同起点，您可以创建一个脚本，无论用户计算机的时区如何，该脚本始终能够显示您所在时区的时间。这之所以成为可能，是因为两个事实：\n\
  \n- `Date` 对象可以告诉您用户时区相对于 GMT 的偏移量。\n- 默认情况下，当您输出时间时，JavaScript 使用当前的本地时间。\n\n\n\
  \n\nGMT 时间。因此，如果用户比 GMT 早五个小时，你可以发现这一点。浏览器在生成和处理所有时间时都使用自己的时区。\n\n- 在编写脚本时，你就知道自己与\
  \ GMT 的偏移量。\n\n然而，这可能会引发问题。例如，假设你想展示你的支持部门是否开放的信息。理想情况下，你希望基于公司所在地的时间，而不是用户的时间。但在编写脚本时，你无法预先确定用户所在的时区。\n\
  \n结合这些信息，你总能计算出你的时区与用户时区之间的小时差，并可以在处理数据或向用户显示之前，将时间从用户时区调整到你的时区。\n\n要做到这一点，需要使用\
  \ `Date` 对象的两个方法：\n\n- `getTimezoneOffset`：该方法返回当前浏览器时区与 GMT 时间之间的分钟差。\n- `setHours`：该方法用于设置当前\
  \ `Date` 对象中的小时部分。使用它可以将时间重置为你所在时区的时间。\n\n作为计算时区偏移量的示例，请考虑以下情况：如果用户位于北美太平洋时间，比 GMT\
  \ 早七个小时，那么 `userOffset` 将为 7，`myOffset` 将为 7 – (-2)，即 9，这是太平洋时间与 CET 之间的小时差。类似地，如果用户位于以色列时区（比\
  \ GMT 晚三个小时），那么 `userOffset` 将为 -3，差值为 -3 – (-2)，即 -1。\n\n以下脚本显示中欧时间（比格林威治标准时间晚两个小时）的当前时间。无论用户计算机的时区如何，它都能正常工作。\n\
  \n### 任务 48：在另一个时区显示日期\n\n**1.** 使用脚本标签开始一个脚本块：`<script language=\"JavaScript\"\
  >`\n\n**2.** 在 `myOffset` 变量中设置与 GMT 的时区偏移量。该值应为将目标时区转换为 GMT 所需的小时数变化。对于中欧时间（夏季比\
  \ GMT 晚两个小时），这意味着值为 -2，表示需要从中欧时间往回拨两个小时才能到达 GMT：\n\n`var myOffset = -2;`\n\n**3.**\
  \ 创建一个新的 `Date` 对象，包含当前日期和时间，并将其赋值给 `currentDate` 变量：\n\n`var currentDate = new\
  \ Date();`\n\n![Image 128](img/index-122_1.jpg)\n\n**4.** 使用 `getTimezoneOffset`\
  \ 提取用户时区的偏移量；由于该值以分钟为单位，而此脚本以小时为单位工作，因此该值应除以 60。最终值存储在 `userOffset` 变量中：\n\n`var\
  \ userOffset = currentDate.getTimezoneOffset()/60;`\n\n**5.** 计算目标时区与用户时区之间的时区差，并将小时差赋值给变量\
  \ `timeZoneDifference`：\n\n`var timeZoneDifference = userOffset - myOffset;`\n\n\
  > **提示：** 要使清单 48-1 中的脚本显示中欧以外的时区的时间和日期，只需适当更改 `myOffset` 的值。\n\n**6.** 使用 `setHours`\
  \ 方法重置时间的小时部分。新时间应为当前小时（使用 `getHours`）加上时区差。幸运的是，像这样使用 `setHours` 可以处理时区差将日期推至前一天或后一天的情况，并相应地调整日期。\n\
  \n`currentDate.setHours(currentDate.getHours() + timeZoneDifference);`\n\n**7.**\
  \ 使用 `document.write` 方法在浏览器窗口中显示当前日期和时间：\n\n`document.write(\"The time and date\
  \ in Central Europe is: \" + currentDate.toLocaleString());`\n\n**8.** 使用结束脚本标签关闭脚本块。最终脚本如清单\
  \ 48-1 所示。\n\n```javascript\n<script language=\"JavaScript\">\nvar myOffset = -2;\n\
  var currentDate = new Date();\nvar userOffset = currentDate.getTimezoneOffset()/60;\n\
  var timeZoneDifference = userOffset - myOffset;\ncurrentDate.setHours(currentDate.getHours()\
  \ + timeZoneDifference);\ndocument.write(\"The time and date in Central Europe is:\
  \ \" + currentDate.toLocaleString());\n</script>\n```\n\n**清单 48-1：** 用于在另一个时区显示日期的脚本。\n\
  \n**9.** 将脚本保存到 HTML 文件中，并在浏览器中打开该文件，即可看到中欧的日期和时间，如图 48-1 所示。\n\n**图 48-1：** 显示中欧的日期和时间。\n\
  \n---\n\n### 任务 49：控制日期输出的格式\n\n除了 `toString` 方法外，`Date` 对象还提供以下方法，用于快速输出当前日期和时间：\n\
  \n- `toGMTString`：将时间转换为格林威治标准时间字符串。结果如下所示：\n\n  `Thu, 17 Apr 2003 17:47:44 UTC`\n\
  \n- `toLocaleString`：使用当前区域设置的日期格式约定将时间转换为字符串。在加拿大，结果如下所示：\n\n  `April 17, 2003\
  \ 10:47:44 AM`\n\n- `toUTCString`：将时间转换为协调世界时字符串。在北美，结果如下所示：\n\n  `Thu, 17 Apr 2003\
  \ 17:47:44 UTC`\n\n> **注意：** UTC 代表协调世界时（Coordinated Universal Time 或 Universal\
  \ Time Coordinate）。UTC 与格林威治标准时间相同，但已成为此默认标准时区的首选名称。使用 JavaScript 事件模型，你可以在用户单击对象时运行\
  \ JavaScript 代码。这是通过 `onClick` 事件处理程序实现的。`onClick` 事件处理程序通常用于表单按钮和链接，但也可以应用于其他对象。\n\
  \n此外，`Date` 对象还提供了一系列方法，用于返回当前日期的特定信息，你可以将这些信息组合成完全自定义的日期和时间显示：\n\n- `getDate`：返回当前月份中的日期（数字）\n\
  - `getDay`：返回当前星期几（数字，0 表示星期日，6 表示星期六）\n- `getFullYear`：返回四位数的年份\n- `getHours`：返回当前时间的小时（数字，0\
  \ 到 23）\n- `getMinutes`：返回当前时间的分钟（数字，0 到 59）\n- `getMonth`：返回当前月份（数字，0 表示一月，11 表示十二月）\n\
