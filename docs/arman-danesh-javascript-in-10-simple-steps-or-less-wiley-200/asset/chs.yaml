  \ 使用 JavaScript 检查 Java 是否已启用\n\n有时了解 Java 是否已启用，并在构建页面时使用该信息是很有用的。例如，基于该信息，你可以动态调整页面内容，以包含或不包含基于\
  \ Java 的内容。\n\n***注意***\n• 为什么你可能想测试浏览器中是否启用了 Java？一个原因是，如果你计划输出 HTML 代码以在浏览器中嵌入\
  \ Java 小程序：通过先进行测试，如果浏览器不支持 Java，你可以输出替代的 HTML。\n\n幸运的是，JavaScript 提供了一种简单的机制来确定这一点：`navigator.javaEnabled`\
  \ 方法。如果浏览器中启用了 Java，该方法返回 `true`，否则返回 `false`。\n\n以下任务在浏览器窗口中显示一条消息，指示 Java 是否已启用：\n\
  \n1. 创建一个新的 HTML 文档。\n2. 在文档的正文中，创建一个脚本块：\n   ```html\n   <body>\n   <script language=\"\
  JavaScript\">\n   <!--\n   // -->\n   </script>\n   </body>\n   ```\n3. 在脚本块中，调用\
  \ `navigator.javaEnabled` 并将结果赋值给一个变量：\n   ```html\n   <body>\n   <script language=\"\
  JavaScript\">\n   <!--\n   var haveJava = navigator.javaEnabled();\n   // -->\n\
  \   </script>\n   </body>\n   ```\n   ![图 93](img/index-110_1.jpg)\n   02 542419\
  \ Ch01.qxd 11/19/03 10:01 AM Page 87\n   **JavaScript 基础** **87**\n4. 使用 `document.write`\
  \ 向用户显示相关消息：\n   ```html\n   <body>\n   <script language=\"JavaScript\">\n   <!--\n\
  \   var haveJava = navigator.javaEnabled();\n   document.write(\"Java is enabled:\
  \ \" + haveJava);\n   // -->\n   </script>\n   </body>\n   ```\n5. 保存文件并关闭。\n\n\n\
