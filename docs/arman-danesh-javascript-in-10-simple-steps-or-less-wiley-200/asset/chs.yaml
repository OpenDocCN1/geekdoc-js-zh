  \n3. 将文件保存为 `4a.js` 并关闭文件。\n\n4. 在编辑器中，创建一个新文件，用于存放 HTML 文件。\n\n5. 使用开始和结束的 `body`\
  \ 标签创建文档主体：\n\n```\n<body>\n</body>\n```\n\n6. 在文档主体中，创建一个脚本块：\n\n```\n<body>\n\
  <script></script>\n</body>\n```\n\n![图片 64](img/index-32_1.jpg)\n\n7. 在 `script`\
  \ 标签的 `language` 属性中指定 JavaScript：\n\n```\n<body>\n<script language=\"JavaScript\"\
