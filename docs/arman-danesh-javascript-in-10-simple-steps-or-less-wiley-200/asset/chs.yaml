  > * 链接样式将叠加在包含链接的元素本身的任何外观属性之上。因此，如果你只指定一种特殊颜色作为链接样式，那么在标题中，链接将具有该颜色，并且大小与标题相同；然而在普通文本中，链接将与该文本大小相同，同时采用链接样式的颜色。\n\
