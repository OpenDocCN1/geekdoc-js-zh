  \ 任务 38：调度函数在未来执行\n\n有时你会希望以自动化的、计划的方式执行一个函数。JavaScript 提供了在未来的指定时间调度函数执行的能力。当指定时间到达时，函数会自动执行，无需任何用户干预。\n\
  \n调度通过 `window.setTimeout` 方法完成：\n\n```javascript\nwindow.setTimeout(\"要执行的函数\"\
  , 调度时间);\n```\n\n要执行的函数以文本字符串的形式指定，就像你正常调用函数一样；该文本字符串包含要执行命令的实际文本。调度时间指定了执行函数前等待的毫秒数。例如，如果你想在函数执行前等待\
  \ 10 秒，你需要指定 10000 毫秒。\n\n> **注意**\n> - 指定要执行的函数的参数应作为文本字符串提供，并且该字符串应包含对函数的完整调用，包括传递给函数的任何参数。\n\
  \n为了说明这一点，以下脚本创建了一个显示警告对话框的函数，然后将其调度为五秒后执行：\n\n1. 在你喜欢的编辑器中创建一个新的 HTML 文档。\n2. 在文档的头部，创建一个脚本块：\n\
  \n```html\n<head>\n<script>\n<!--\n// -->\n</script>\n</head>\n```\n\n3. 在脚本块中，创建一个名为\
  \ `hello` 且不带参数的函数：\n\n```html\n<head>\n<script>\n<!--\nfunction hello() {\n}\n\
  // -->\n</script>\n</head>\n```\n\n![Image 89](img/index-100_1.jpg)\n\n4. 在函数中，使用\
  \ `window.alert` 显示一个对话框：\n\n```html\n<head>\n<script>\n<!--\nfunction hello() {\n\
  \  window.alert(\"Hello\");\n}\n// -->\n</script>\n</head>\n```\n\n5. 在函数之后，将函数调度为五秒后执行：\n\
  \n```html\n<head>\n<script>\n<!--\nfunction hello() {\n  window.alert(\"Hello\"\
  );\n}\nwindow.setTimeout(\"hello()\", 5000);\n// -->\n</script>\n</head>\n```\n\n\
  6. 保存文件并关闭。\n7. 在浏览器中打开文件。等待五秒，然后应出现一个警告对话框，如图 38-1 所示。\n\n> **交叉引用**\n> - 创建函数的过程在任务\
  \ 27 到 30 中讨论。\n\n**图 38-1：** 调度函数执行。\n\n### 任务 39：调度函数重复执行\n\n任务 38 向你展示了如何调度一个函数在未来单次自动执行。但如果你希望以固定的时间间隔重复调度同一个函数呢？\n\
  \n要做到这一点，你需要做两件事：\n\n- 在函数的最后一条命令中，使用 `window.setTimeout` 重新调度函数再次执行。\n- 在函数外部使用\
  \ `window.setTimeout` 来调度函数的首次执行。\n\n> **注意**\n> - 警告对话框将每五秒无限期地出现（参见步骤 8）。要退出此循环，只需在对话框之间的某个间隔内关闭浏览器窗口。\n\
  \n结果看起来像这样：\n\n```javascript\nfunction functionName() {\n  // 一些 JavaScript 代码\n\
  \  window.setTimeout(\"functionName()\", 调度时间);\n}\nwindow.setTimeout(\"functionName()\"\
  , 调度时间);\n```\n\n为了说明这一点，以下脚本创建了一个显示警告对话框的函数，然后将其调度为每五秒执行一次：\n\n1. 在你喜欢的编辑器中创建一个新的\
  \ HTML 文档。\n2. 在文档的头部，创建一个脚本块。\n3. 在脚本块中，创建一个名为 `hello` 且不带参数的函数：\n\n```javascript\n\
  function hello() {\n}\n```\n\n4. 在函数中，使用 `window.alert` 显示一个对话框：\n\n```javascript\n\
  function hello() {\n  window.alert(\"Hello\");\n}\n```\n\n5. 通过使用 `window.setTimeout`\
  \ 将函数调度为每五秒运行一次，完成函数：\n\n```javascript\nfunction hello() {\n  window.alert(\"Hello\"\
  );\n  window.setTimeout(\"hello()\", 5000);\n}\n```\n\n![Image 90](img/index-102_1.jpg)\n\
  \n6. 在函数之后，将函数调度为五秒后执行。最终页面应如清单 39-1 所示。\n\n```html\n<head>\n<script>\n<!--\nfunction\
  \ hello() {\n  window.alert(\"Hello\");\n  window.setTimeout(\"hello()\", 5000);\n\
  }\nwindow.setTimeout(\"hello()\", 5000);\n// -->\n</script>\n</head>\n```\n\n**清单\
  \ 39-1：** 调度函数执行。\n\n7. 保存文件并关闭。\n8. 在浏览器中打开文件。等待五秒，然后应出现一个警告对话框，如图 39-1 所示。关闭对话框后，五秒后应再次出现另一个对话框。这应无限期地持续下去。\n\
