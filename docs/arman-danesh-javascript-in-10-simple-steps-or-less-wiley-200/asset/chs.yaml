  ```\n\n### 任务 52：使用 URL 变量自定义输出\n\n当你为页面构建 URL 时，可以在 URL 末尾添加一系列名称-值对，格式如下：\n\n\
  `http://my.url/somepage.html?name1=value1&name2=value2&...`\n\n***注意***\n\n- 本任务中代码的逻辑很简单：在问号处分割字符串，取问号右侧的部分并在每个\
  \ & 符号处分割，然后对每个结果子串在等号处分割，从而将 URL 参数拆分为名称和值两部分。使用 `string` 对象的 `split` 方法可以轻松实现这一过程。\n\
  \n本质上，这些参数就像变量：用于存储值的命名容器。在 JavaScript 中，`document` 对象提供了 `URL` 属性，该属性包含文档的完整 URL，通过对该属性进行一些操作，你可以提取\
  \ URL 中包含的部分或全部 URL 参数。以下代码显示当前文档的所有 URL 参数：\n\n**1.** 在文档正文的脚本块中，在问号处分割当前文档的 URL，并将两部分存储在数组\
  \ `urlParts` 中：\n\n```\nvar urlParts = document.URL.split(“?”);\n```\n\n**2.** 在\
  \ & 符号处将 URL 中问号右侧的部分分割成一个或多个部分。这将每个名称-值对放入 `parameterParts` 数组的一个数组条目中。\n\n```\n\
  var parameterParts = urlParts[1].split(“&”);\n```\n\n**3.** 使用 `document.write`\
  \ 方法输出 HTML 代码以设置表格并显示表格的列标题：\n\n```\ndocument.write(“<table border=1 cellpadding=3\
  \ Æ\ncellspacing=0>”);\ndocument.write(“<tr>”);\ndocument.write(“<td><strong>Name</strong></td><td>Æ\n\
  <strong>Value</strong></td>”);\n```\n\n**4.** 启动一个 `for` 循环，遍历 `parameterParts`\
  \ 数组中的每个元素。这意味着循环应从 0 开始，计数到数组长度减一；因为在包含 10 个元素的数组中，第一个索引是 0，最后一个索引是 9。\n\n***警告***\n\
  \n- 本任务中的代码仅在至少有一个 URL 参数传递给脚本时才能正常工作。执行此操作时，请记住两点：首先，必须通过 Web 服务器访问文件，而不是作为本地文件打开；其次，必须在\
  \ URL 中的问号后至少包含一个名称-值对。\n\n```\nfor (i = 0; i < parameterParts.length; i ++) {\n\
  ```\n\n**5.** 为每个名称-值对输出 HTML 以开始一个表格行：\n\n```\ndocument.write(“<tr>”);\n```\n\n\
  **6.** 在等号处分割名称-值对，并将结果存储在 `pairParts` 数组中。第一个条目（索引 0）包含名称，第二个条目（索引 1）包含值：\n\n```\n\
  var pairParts = parameterParts[i].split(“=”);\n```\n\n**7.** 在表格单元格中显示名称和值。确保使用\
  \ `unescape` 函数对值进行解码：\n\n```\ndocument.write(“<td>” + pairParts[0] + “</td>”);\n\
  document.write(“<td>” + unescape(pairParts[1]) + “</td>”);\n```\n\n**8.** 输出 HTML\
  \ 以关闭表格行，并用右花括号关闭循环：\n\n```\ndocument.write(“</tr>”);\n}\n```\n\n***提示***\n\n- 任何用于网页的动态编程语言（包括\
  \ JavaScript）的强大功能之一，是能够在页面之间传递数据，然后在目标页面中对这些数据进行操作。页面之间传递数据最常见的方法之一是使用 URL 参数。\n\
  - 并非所有字符在 URL 中都有效。例如，不允许使用空格。为了处理这种情况，URL 参数值会被转义，其中这些特殊字符被替换为代码；例如，空格变为 `%20`。要真正处理\
  \ URL 参数，你需要对每个参数的值进行解码，将这些特殊代码转换回正确的字符。`unescape` 函数以这种方式返回一个解码后的字符串。\n- 要在问号处分割\
  \ URL，请使用 `string` 对象的 `split` 方法，该方法将返回问号左侧的部分作为数组的第一个条目（条目 0），而包含 URL 参数的问号右侧部分作为数组的第二个条目（条目\
  \ 1）。\n\n**9.** 输出 HTML 以完成表格，然后用闭合的 `script` 标签关闭脚本。最终的源代码应如清单 52-1 所示，当在浏览器中查看时，如果\
  \ URL 包含参数，它们将显示在表格中，如图 52-1 所示。\n\n```\n<script language=”JavaScript”>\nvar urlParts\
  \ = document.URL.split(“?”);\nvar parameterParts = urlParts[1].split(“&”);\ndocument.write(“<table\
  \ border=1 cellpadding=3 Æ\ncellspacing=0>”);\ndocument.write(“<tr>”);\ndocument.write(“<td><strong>Name</strong></td><td>Æ\n\
  <strong>Value</strong></td>”);\nfor (i = 0; i < parameterParts.length; i ++) {\n\
  document.write(“<tr>”);\nvar pairParts = parameterParts[i].split(“=”);\ndocument.write(“<td>”\
  \ + pairParts[0] + “</td>”);\ndocument.write(“<td>” + unescape(pairParts[1]) + Æ\n\
  “</td>”);\ndocument.write(“</tr>”);\n}\ndocument.write(“</table>”);\n</script>\n\
  ```\n\n**清单 52-1：** 在表格中显示 URL 参数的脚本。\n\n**图 52-1：** 在表格中以名称-值对形式显示 URL 参数。\n\n\
