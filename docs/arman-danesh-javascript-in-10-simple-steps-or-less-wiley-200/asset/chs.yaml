  \n**1.** 在您喜欢的编辑器中创建一个新的 HTML 文档。\n\n**2.** 在文档的 body 中创建一个表单：\n\n```\n<body>\n\
  <form name=\"myForm\" action=\"target.html\">\n</form>\n</body>\n```\n\n**3.** 在表单中，创建一个常规按钮：\n\
