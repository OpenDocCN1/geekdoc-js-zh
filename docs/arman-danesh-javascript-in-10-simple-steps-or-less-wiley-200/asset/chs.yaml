  \ `value` 属性指定的值。JavaScript 跟踪和操作的是值而非文本，提交表单时提交的也是值。\n\n**图 91-1：** 使用复选框处理长列表。\n\
  \n复选框通过 `input` 标签创建，并将 `checkbox` 作为 `type` 属性的值：\n\n```html\n<input type=\"checkbox\"\
