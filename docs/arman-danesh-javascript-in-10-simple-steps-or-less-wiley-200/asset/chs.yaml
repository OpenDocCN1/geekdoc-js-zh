  \ X 滑动元素\n任务 268：使用 X 改变层的大小\n\n### 任务 245：检测浏览器类型\n\n使用 JavaScript，您可以确定用户正在运行的浏览器类型。如果您希望在应用程序中实现需要不同浏览器使用不同代码的功能，这将非常有用。通过检测用户使用的浏览器，您可以在用户实际运行的代码中对此加以考虑。\n\
  \n确定用户所用浏览器的关键在于 `navigator` 对象。\n\n***注释***\n\n• 在应用程序中考虑用户浏览器版本的原因有很多。例如，某些浏览器对层叠样式表的高级功能支持较差，您可能希望避免在这些浏览器上使用这些功能。\n\
  • 浏览器常常会声称自己是另一种浏览器。例如，Internet Explorer 和 Netscape 都声称自己是 Mozilla，以确保网站向它们发送相同版本的代码。这可能会带来问题，因为\
  \ Internet Explorer 和 Mozilla 实际上并不具有完全相同的 JavaScript 实现。\n\n`navigator` 对象提供了几个属性，可用于告知您正在使用的浏览器类型：\n\
  \n• `navigator.appName`：此属性返回一个字符串，指示正在使用的浏览器。例如，该字符串可能是“Microsoft Internet Explorer”或“Netscape”。\n\
  • `navigator.appCodeName`：此属性返回浏览器声称的浏览器名称。例如，在 Internet Explorer 6 中，它实际上会返回“Mozilla”，在\
  \ Netscape 7 中也是如此。\n• `navigator.userAgent`：此属性返回完整的用户代理字符串。用户代理字符串是浏览器发送给服务器以标识自身的字符串。应用程序名称和代码名称正是从用户代理字符串中派生出来的。\n\
  \n以下是用户代理字符串的示例：\n\n• Internet Explorer 6：Mozilla/4.0 (compatible; MSIE 6.0; Windows\
  \ NT 5.0; .NET CLR 1.0.3705)\n• Netscape 7：Mozilla/5.0 (Windows; U; Windows NT 5.0;\
  \ en-US; rv:1.0.2) Gecko/20030208 Netscape/7.02\n\n以下任务展示了如何向用户显示浏览器的应用程序名称、代码名称和用户代理：\n\
  \n**1.** 在您偏好的编辑器中创建一个新文档。\n\n**2.** 在文档的 body 中，创建一个带有开始和结束 script 标签的脚本块：\n\n\
  ```html\n<body>\n<script language=\"JavaScript\">\n</script>\n</body>\n```\n\n**3.**\
  \ 使用 `document.write` 方法输出应用程序名称：\n\n```javascript\ndocument.write(\"Browser Type:\
  \ \" + navigator.appName + \"<br>\");\n```\n\n![Image 647](img/index-534_1.jpg)\n\
  \n**4.** 使用 `document.write` 方法输出代码名称：\n\n```javascript\ndocument.write(\"Code Name:\
  \ \" + navigator.appCodeName + \"<br>\");\n```\n\n**5.** 使用 `document.write` 方法输出用户代理字符串。最终页面应如清单\
  \ 245-1 所示。\n\n```html\n<body>\n<script language=\"JavaScript\">\ndocument.write(\"\
  Browser Type: \" + navigator.appName + \"<br>\");\ndocument.write(\"Code Name: \"\
  \ + navigator.appCodeName + \"<br>\");\ndocument.write(\"User Agent: \" + navigator.userAgent\
  \ + \"<br>\");\n</script>\n</body>\n```\n\n**清单 245-1：** 显示浏览器版本信息。\n\n**6.** 保存文件并关闭。\n\
  \n**7.** 在浏览器中打开该文件。在 Internet Explorer 中，显示效果应类似于图 245-1。\n\n***交叉引用***\n\n• 任务\
  \ 9 讨论了如何使用 `document.write` 方法从 JavaScript 生成输出到浏览器。该方法接受一个字符串参数。在本例中，您通过连接两个字符串来构建一个字符串。\n\
  \n**图 245-1：** 在 Internet Explorer 6 中显示浏览器信息。\n\n### 任务 246：检测浏览器版本\n\n在任务 245\
  \ 中，您了解了如何通过 `navigator` 对象检测浏览器类型。除了这些信息之外，`navigator` 对象还可以告诉您正在使用的是特定浏览器的哪个版本。这一点很重要，因为不同版本之间可能存在显著的功能差异。例如，Netscape\
  \ 4.7x 与 Netscape 7 浏览器之间的差异比 Netscape 7 与 Internet Explorer 6 之间的差异更大。\n\n***注释***\n\
  \n• 请注意，Internet Explorer 声称自己是 4.0 版本。这实际上反映了代码名称中所代表的浏览器版本。也就是说，Internet Explorer\
  \ 6 声称与 Mozilla 4.0 相同。在括号内，Internet Explorer 则提供了其真实版本的准确表示。\n• Netscape 6 及更高版本实际上是真正的基于\
  \ Mozilla 的浏览器。\n\n要检查特定浏览器的版本，您需要使用 `navigator.appVersion` 属性。在 Internet Explorer\
  \ 6 中，该属性会返回以下内容：\n\n`4.0 (compatible; MSIE 6.0; Windows NT 5.0; .NET CLR 1.0.3705)`\n\
  \n在 Netscape 7 中，该属性返回以下内容：\n\n`5.0 (Windows; en-US)`\n\n这些版本字符串为您提供了有关所涉及平台和版本的信息。\n\
  \n\n\n\n\n### 跨浏览器兼容性与问题\n\n### 任务 246\n\n因此，Netscape 7 会将自己报告为 Mozilla（作为代码名称和应用程序名称），然后提供一个版本号以将其归入\
  \ Mozilla 系列。这个版本号并不反映 Netscape 浏览器中使用的 Mozilla 版本的发布号，而是当你实际在 Mozilla 浏览器中检查浏览器版本时也会报告的一个内部编号。\n\
  \n以下任务展示了如何在浏览器窗口中显示浏览器版本和用户代理字符串：\n\n请注意，`navigator.appVersion` 报告的浏览器版本包含用户代理字符串中括号内的部分。在\
  \ Internet Explorer 中，这可能是用户代理字符串中括号内的整个部分，而在 Mozilla 和 Netscape 中，这只是该部分的一个子集。\n\
  \n1. 在你偏好的编辑器中创建一个新文档。\n2. 在文档的正文中，创建一个包含开始和结束 script 标签的脚本块。\n3. 使用 `document.write`\
  \ 方法输出浏览器版本：`document.write(\"Browser Version: \" + navigator.appVersion + \"<br>\"\
  );`\n4. 使用 `document.write` 方法输出用户代理字符串。\n5. 保存文件并关闭。\n6. 在浏览器中打开该文件。在 Internet\
  \ Explorer 中，显示效果应类似于图 246-1。在 Mozilla 中，应类似于图 246-2。\n\n![图 246-1](img/index-536_1.jpg)\n\
  **图 246-1：** 在 Internet Explorer 6 中显示浏览器信息。\n\n![图 246-2](img/index-536_2.jpg)\n\
  **图 246-2：** 在 Mozilla 1.2.1 中显示浏览器信息。\n\n**清单 246-1：** 显示浏览器的用户代理字符串。\n\n```html\n\
  <body>\n<script language=\"JavaScript\">\ndocument.write(\"Browser Version: \" +\
  \ navigator.appVersion + \"<br>\");\ndocument.write(\"User Agent: \" + navigator.userAgent\
  \ + \"<br>\");\n</script>\n</body>\n```\n\n### 任务 247：使用对象测试进行浏览器检测\n\n在前面的任务中，我们给出了如何通过检查\
  \ `navigator` 对象的属性来确定用户使用的浏览器和版本的示例。然而，在实际应用中，使用这些属性通常非常困难。因此，对象测试技术已成为确定当前使用浏览器的首选方法。这意味着你可以通过测试这些对象是否存在来简单地确定浏览器版本：`if\
  \ (object name) { object exists }`\n\n**注意：** 不同浏览器的用户代理表示方式意味着你需要进行复杂的字符串分析才能确定用户实际运行的浏览器。还有其他浏览器，例如\
  \ Opera，其中一些测试在某些版本中也会为真。然而，绝大多数用户要么使用 Netscape，要么使用 Internet Explorer，因此在某些应用中，考虑这些边缘浏览器可能得不偿失；你需要针对每个应用自行判断。本任务提供了\
  \ Internet Explorer 和 Netscape 的示例，但你也可以查看其他浏览器的 JavaScript 文档，识别适合在测试中使用的对象，从而将概念扩展到其他浏览器。\n\
  \n以下列出了可用于确定浏览器版本的关键对象：\n\n- `document.all`：IE4+\n- `document.getElementById`：IE5+/NS6+\n\
  - `document.layers`：NS4\n- `document.fireEvent`：IE5.5+\n- `document.createComment`：IE6+\n\
  \n利用这些对象，你可以构建测试各种浏览器环境的条件：\n\n- `NS4/IE4+： (document.all || document.layers)`\n\
  - `NS4+： (!document.all)`\n- `IE4+： (document.all)`\n- `仅 NS4： (document.layers\
  \ && !document.getElementById)`\n- `仅 IE4： (document.all && !document.getElementById)`\n\
  - `NS6+/IE5+： (document.getElementById)`\n- `NS6+： (document.getElementById && !document.all)`\n\
  - `IE5+： (document.all && document.getElementById)`\n- `IE5.5+： (document.all &&\
  \ document.fireEvent)`\n- `仅 IE6： (document.all && document.createComment)`\n- `仅\
  \ IE5： (document.all && document.getElementById && !document.fireEvent)`\n- `仅 IE5.5：\
  \ (document.all && document.fireEvent && !document.createComment)`\n\n以下任务构建了一个页面，该页面基于其中一些对象测试条件显示当前浏览器的信息：\n\
  \n1. 在新文档的正文中，创建一个脚本块。\n2. 在脚本中，使用 `if` 语句测试 `document.all` 是否存在，以区分 Internet Explorer\
  \ 浏览器和 Netscape 浏览器。\n3. 根据初始测试，显示浏览器类型，然后测试并显示浏览器版本，使最终页面看起来像清单 247-1。\n\n**提示：**\
  \ 对象测试的前提很简单：每个浏览器至少有一些其他浏览器未实现的对象。你可以通过将对象用作 `if` 语句的条件来轻松测试对象是否存在。例如，你可以使用 `if\
  \ (document.all)` 测试 `document.all` 是否存在。\n\n**清单 247-1：** 使用对象测试确定浏览器版本。\n\n```html\n\
  <body>\n<script language=\"JavaScript\">\nif (document.all) {\n    document.write(\"\
  Microsoft IE.<br>\");\n    if (!document.getElementById) {\n        document.write(\"\
  Version 4.\");\n    }\n    if (document.getElementById && !document.fireEvent) {\n\
  \        document.write(\"Version 5.\");\n    }\n    if (document.fireEvent && !document.createComment)\
  \ {\n        document.write(\"Version 5.5.\");\n    }\n    if (document.createComment)\
  \ {\n        document.write(\"Version 6.\");\n    }\n} else {\n    document.write(\"\
  Netscape.<br>\");\n    if (document.getElementById) {\n        document.write(\"\
  Version 6+.\");\n    } else {\n        document.write(\"Version 4.\");\n    }\n\
  }\n</script>\n</body>\n```\n\n4. 保存文件并关闭。\n5. 在浏览器中打开该文件。你会看到一条关于你正在使用的浏览器类型的消息。\n\
  \n### 任务 248：创建浏览器检测变量\n\n在任务 247 中，你看到了如何使用对象测试来构建条件以确定当前使用的浏览器。然而，在实际应用中，你通常不会希望在代码的多个位置使用这些复杂条件来确定用户正在使用什么浏览器来查看你的页面。相反，常见的做法是在脚本开头构建一个变量列表。\n\
  \n**注意：** 此脚本中创建的变量被赋予了表达式。每个表达式都会计算为一个布尔值（true 或 false），因此例如 `ie4` 在 Internet Explorer\
  \ 4 上为 true，但在 Netscape 6 上为 false。\n\n这些变量各自代表一个特定的浏览器和版本，并取值为 true 或 false。例如，变量\
  \ `ie4` 可以为 true 或 false，以指示用户是否正在使用 Internet Explorer 4。然后你可以在代码中测试用户是否正在使用该浏览器，如下所示：\n\
  \n```\nif (ie4) {\n    // 如果用户正在使用 Internet Explorer 4，则执行的代码\n}\n```\n\n你可以通过将布尔表达式赋值给这些变量来创建它们；这些条件已在任务\
  \ 247 中概述：\n\n- `NS4/IE4+： (document.all || document.layers)`\n- `NS4+： (!document.all)`\n\
  - `IE4+： (document.all)`\n- `仅 NS4： (document.layers && !document.getElementById)`\n\
  - `仅 IE4： (document.all && !document.getElementById)`\n- `NS6+/IE5+： (document.getElementById)`\n\
  - `NS6+： (document.getElementById && !document.all)`\n- `IE5+： (document.all &&\
  \ document.getElementById)`\n- `IE5.5+： (document.all && document.fireEvent)`\n\
  - `仅 IE6： (document.all && document.createComment)`\n\n\n\n\n\n### 跨浏览器兼容性与问题\n\n\
  ### 任务 248：创建浏览器检测变量\n\n以下任务展示了如何构建 JavaScript 代码，为 Internet Explorer 和 Netscape\
