  \ 的参数：\n\n   `function getCookie(cookieName) {`\n\n2. 基于任务 154 中概述的技术，检索 `cookieName`\
  \ 参数所指定名称的 Cookie 文本，如清单 156-1 所示。\n\n```javascript\nfunction getCookie(cookieName)\
