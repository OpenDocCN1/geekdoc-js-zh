  \ 任务 200：使用函数生成下拉菜单\n\n本任务展示了如何通过将大部分工作封装到函数中，然后简单地调用函数来简化菜单的创建。以下步骤概述了如何扩展任务 197\
  \ 中的基本菜单，以使用函数创建菜单：\n\n***注意***\n- 本任务允许你避免创建创建菜单标题和菜单块所需的繁琐 HTML 代码。相反，目标是在数组中定义菜单项，然后简单地调用一个函数来创建菜单。这种方法的优点是减轻了开发者正确指定菜单\
  \ HTML 的负担，并确保 HTML 代码正确生成。\n- 注意 `menuEntries[i].entry` 和 `menuEntries[i].url`\
  \ 的使用。稍后当你创建数组时，你会看到数组中的每个条目都是一个具有两个属性（名为 `entry` 和 `url`）的对象。\n- 你可以使用 `{ propertyName:\
  \ propertyValue, propertyName: propertyValue, etc. }` 的形式创建一个具有一个或多个命名属性的对象。\n\n\
  **1.** 在 HTML 文档的头部，创建一个脚本块，并将任务 197 中的 `menuToggle` 函数放入其中：\n\n```html\n<script\
  \ language=\"JavaScript\">\n<!--\nfunction menuToggle(target) {\ntargetMenu = (document.getElementById)\
  \ ? document.getElementById(target).style : eval(\"document.\" + target);\ntargetMenu.top\
  \ = (parseInt(targetMenu.top) == 22) ? -2000 : 22;\n}\n// -->\n</script>\n```\n\n\
  **2.** 在脚本块中，创建第二个名为 `createMenu` 的函数。该函数接受五个参数：菜单对象的名称、菜单的显示标题、包含菜单项的数组、菜单的水平位置和宽度（以像素为单位）：\n\
  \n```javascript\nfunction createMenu(menuName, menuTitle, menuEntries, left, width)\
  \ {\n}\n```\n\n**3.** 在函数中，创建一个名为 `numEntries` 的变量，其中包含 `menuEntries` 数组中的条目数：\n\
  \n```javascript\nnumEntries = menuEntries.length;\n```\n\n**4.** 使用 `document.write`\
  \ 方法输出菜单标题块；在 `onMouseover` 和 `onMouseout` 事件处理程序中对 `menuToggle` 的调用中使用 `menuName`\
  \ 变量传递菜单对象的名称，并使用 `menuTitle` 作为块中的标题文本：\n\n```javascript\ndocument.write('<div\
  \ class=\"menuTitle\" style=\"left:0px; width:100px;\">');\ndocument.write('onMouseover=\"\
  menuToggle(\\'' + menuName + '\\');\"');\ndocument.write('onMouseout=\"menuToggle(\\\
  '' + menuName + '\\');\">');\ndocument.write(menuTitle);\ndocument.write('</div>');\n\
  ```\n\n![Image 484](img/index-438_1.jpg)\n\n\n\n\n\n### 任务 200\n\n**5.** 要完成该函数，请使用\
  \ `document.write` 方法输出任务菜单块。你需要使用 `for` 循环为 `menuEntries` 数组中的每个条目输出一个链接：\n\n```javascript\n\
  document.write('<div id=\"myMenu\" class=\"menu\" style=\"left:0px; width:100px;\"\
  >');\ndocument.write('onMouseout=\"menuToggle(\\'' + menuName + '\\')\">');\nfor\
  \ (i = 0; i < numEntries; i++) {\n    document.write('<a href=\"' + menuEntries[i].url\
  \ + '\" class=\"menuEntry\">' + menuEntries[i].entry + '</a><br>');\n}\ndocument.write('</div>');\n\
