  \ 95-2 所示，然后焦点将返回到该字段。\n\n**图 95-2：** 强制用户在字段中输入文本。\n\n---\n\n### 任务 96：使用表单标签的\
  \ onSubmit 属性验证表单字段\n\nJavaScript 的主要应用之一是对表单中输入的数据进行验证。一种表单验证方法是在用户尝试提交表单时检查输入的数据。该方法很简单：\n\
  \n- 在要验证的表单中，使用 `onSubmit` 事件处理程序调用一个 JavaScript 函数，在提交时测试表单。\n- 在该函数中，检查表单中输入的数据是否有效。如果数据无效，则通知用户并取消表单提交。\n\
  \n以下任务提供了此类验证的示例。如果用户尝试提交表单但未在单个文本字段中输入文本，则会通知用户必须输入文本，否则提交将被取消。\n\n***注释***\n-\
  \ 此过程依赖于以下事实：如果 `onSubmit` 事件处理程序中的 JavaScript 代码返回 `false`，则提交本身会被取消。\n- 注意，`this`\
  \ 作为参数传递给了 `checkForm` 函数。在表单标签的事件处理程序中，`this` 指向表单本身的对象。\n- 此处使用的 `onSubmit` 事件处理程序需要特别注意。不是简单地调用\
  \ `checkForm`，而是 `return` `checkForm` 返回的值。由于 `checkForm` 在表单正常时返回 `true`，否则返回 `false`，因此如果表单不正常，你可以取消提交；如果正常，则允许继续提交。\n\
  - 此过程依赖于表单字段对象可用的 `focus` 方法。该方法将鼠标焦点设置到之前没有焦点的字段。\n- “拥有焦点”的字段是当前活动的字段。当用户点击或按\
  \ Tab 键进入字段时，该字段通常会获得焦点。在此任务中，你将看到如何强制将焦点设置到特定字段。\n- 将 `formOK` 字段设置为 `true` 表示假设表单可以正常提交。\n\
  \n**1.** 在新 HTML 文档的头部，创建一个包含名为 `checkForm` 函数的脚本块，该函数接收表单对象（`formObj`）：\n\n```javascript\n\
  function checkForm(formObj) {\n}\n```\n\n**2.** 在函数中，创建一个名为 `formOK` 的变量，并将其设置为\
  \ `true`：\n\n```javascript\nvar formOK = true;\n```\n\n**3.** 在函数中，检查字段是否为空字符串：\n\
  \n```javascript\nif (formObj.myField.value == \"\") {\n}\n```\n\n**4.** 如果字段不包含文本，则提醒用户必须输入文本才能继续。将焦点返回到该字段，并将\
  \ `formOK` 设置为 `false`：\n\n```javascript\nwindow.alert(\"You must enter a value\
  \ in the field\");\nformObj.myField.focus();\nformOK = false;\n```\n\n**5.** 从函数返回\
  \ `formOK` 的值：\n\n```javascript\nreturn formOK;\n```\n\n**6.** 在文档正文中，创建一个名为 `myForm`\
  \ 的表单，其中包含一个名为 `myField` 的文本字段和一个提交按钮：\n\n**7.** 在表单的 `onSubmit` 事件处理程序中调用 `checkForm`\
  \ 函数。最终页面如清单 96-1 所示。\n\n```html\n<head>\n<script language=\"JavaScript\">\nfunction\
  \ checkForm(formObj) {\n    var formOK = true;\n    if (formObj.myField.value ==\
  \ \"\") {\n        window.alert(\"You must enter a value in the field\");\n    \
  \    formObj.myField.focus();\n        formOK = false;\n    }\n    return formOK;\n\
  }\n</script>\n</head>\n<body>\n<form name=\"myForm\" action=\"target.html\" onSubmit=\"\
  return checkForm(this);\">\nText Field: <input type=\"text\" name=\"myField\"><br>\n\
  <input type=\"submit\">\n</form>\n</body>\n```\n\n**清单 96-1：** 在用户提交表单时验证表单。\n\n\
  **8.** 将文件保存为 `target.html` 并关闭。\n\n**9.** 在浏览器中打开该文件，将出现图 96-1 中的表单。\n\n![图 252](img/index-222_1.jpg)\n\
  \n**图 96-1：** 包含文本字段的表单。\n\n***交叉引用***\n- 任务 95 展示了当用户离开字段时如何验证单个字段。\n\n**10.**\
  \ 尝试在不输入任何文本的情况下提交表单。你将看到一个警告，然后焦点将返回到该字段。\n\n---\n\n### 任务 97：使用 INPUT TYPE=\"\
  button\" 代替 TYPE=\"submit\" 验证表单字段\n\nJavaScript 的主要应用之一是对表单中输入的数据进行验证。一种方法是在用户尝试提交表单时检查输入的数据，但不使用实际的提交按钮。该方法很简单：\n\
  \n- 在要验证的表单中，使用普通按钮代替提交按钮来控制表单提交。\n- 在按钮的 `onClick` 事件处理程序中，调用一个 JavaScript 函数，在提交时测试表单。\n\
