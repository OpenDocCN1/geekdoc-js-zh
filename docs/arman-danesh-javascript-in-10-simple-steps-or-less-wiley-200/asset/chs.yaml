  \n### 任务 106：使用正则表达式验证电话号码\n\n在任务 100 中，您看到了一个如何在 JavaScript 中验证电话号码的示例。其核心是 `checkPhone`\
  \ 函数。不幸的是，这个函数展示了一种冗长、复杂且迂回的电话号码验证方式。它的好处是只使用了一小组简单、常见的 JavaScript 命令和结构（如 if 语句和\
  \ for 循环），但需要太多步骤，因此容易出错：如果逻辑出错，验证就会不正确。\n\n使用正则表达式，您可以大大简化此任务所需的代码量。正则表达式提供了通配符概念的强大扩展，允许您指定文本模式并搜索匹配该模式的文本。不幸的是，正则表达式是一个高级主题，超出了本任务的范围，但我将向您展示如何使用正则表达式执行电话号码验证。\n\
  \n一旦创建了正则表达式，使用它就很简单了。您将按以下格式使用它：\n\n```\nvar someString = \"要测试的字符串\";\nvar regularExpression\
  \ = /要匹配的模式/修饰符;\nif (regularExpression.test(someString)) {\n  匹配时执行的代码;\n}\n```\n\
  \n- 当您将正则表达式赋值给变量时，您正在创建一个正则表达式对象。该对象有一个 `test` 方法，允许您针对作为参数提供的字符串测试表达式。如果匹配，该方法返回\
  \ `true`，否则返回 `false`。\n- 验证被分为两个函数，以便可以扩展到包含多个字段的表单。例如，您可以通过从 `checkForm` 多次调用\
  \ `checkPhone` 来验证多个电话号码字段，或者通过添加其他函数并从 `checkForm` 调用它们来执行其他类型的验证。不过，从表单中仍然只调用\
  \ `checkForm`。\n\n**1.** 在新的 HTML 文档的头部，创建一个包含 `checkPhone` 函数的脚本块，该函数返回一个文本字符串：\n\
  \n```\nfunction checkPhone(phone) {\n}\n```\n\n**2.** 在函数中，创建一个用于匹配电话号码的正则表达式。请完全按照以下所示输入：\n\
  \n\n\n\n\n## 使用表单\n\n### 任务 106：使用正则表达式验证电话号码\n\n只需调用 `checkForm`。定义正则表达式：\n\n```\n\
  var check = /^\\({0,1}[0-9]{3}\\){0,1}[ \\-\\.]{0,1}[0-9]{3}[ \\-\\.]{0,1}[0-9]{4}$/;\n\
  ```\n\n注意，这作为参数传递给 `checkForm` 函数。接下来，测试电话号码是否与该模式匹配失败。对于表单标签的事件处理程序，`this` 指向表单对象本身。注意，`test`\
  \ 方法返回的结果被取反。这样，只有当未找到匹配时，`if` 语句才为真：\n\n```\nif (!check.test(phone)) {\n\n}\n```\n\
  \n**4.** 如果未找到匹配，通知用户并从函数返回 `false`：\n\n```\nif (!check.test(phone)) {\n    window.alert(\"\
  您必须提供一个有效的电话号码。\");\n    return false;\n}\n```\n\n**5.** 最后，如果电话号码通过了测试，则从函数返回 `true`，这样完整的函数如下所示：\n\
  \n```\nfunction checkPhone(phone) {\n    var check = /^\\({0,1}[0-9]{3}\\){0,1}[\
  \ \\-\\.]{0,1}[0-9]{3}[ \\-\\.]{0,1}[0-9]{4}$/;\n    if (!check.test(phone)) {\n\
  \        window.alert(\"请提供一个有效的电话号码。\");\n        return false;\n    }\n    return\
  \ true;\n}\n```\n\n**提示：** 用于验证电话号码的正则表达式如下：`/^\\({0,1}[0-9]{3}\\){0,1}[ \\-\\.]{0,1}[0-9]{3}[\
  \ \\-\\.]{0,1}[0-9]{4}$/`\n\n**6.** 创建另一个名为 `checkForm` 的函数，该函数接受一个表单对象作为参数。该函数应调用\
  \ `checkPhone`，并将包含电话号码的字段的值传递给它，然后返回 `checkPhone` 函数返回的结果：\n\n```\nfunction checkForm(formObj)\
  \ {\n    return checkPhone(formObj.myField.value);\n}\n```\n\n**7.** 在文档的 body 中，创建一个包含用于输入电话号码的字段的表单，并使用\
  \ `onSubmit` 事件处理程序调用 `checkForm` 函数：\n\n```\n<body>\n<form name=\"myForm\" action=\"\
  target.html\" onSubmit=\"return checkForm(this);\">\n    电话：<input type=\"text\"\
  \ name=\"myField\"><br>\n    <input type=\"submit\">\n</form>\n</body>\n```\n\n\
  **8.** 将文件保存为 `target.html` 并在浏览器中打开。\n\n**9.** 尝试在没有有效电话号码的情况下提交表单，您应该会看到相应的错误消息。\n\
  \n**交叉引用：**\n- 在任务 100 中，您看到了一个如何在 JavaScript 中不使用正则表达式验证电话号码的示例。\n- 任务 111 展示了如何使用正则表达式验证数值。\n\
  \n### 任务 107：使用 INPUT TYPE=\"button\" 按钮创建多个表单提交按钮\n\n在某些网站上，您会看到一个包含多个看似提交按钮的表单。一个常见的例子是登录表单：一个按钮用于登录用户，一个按钮使用用户输入的用户名创建新用户账户，第三个按钮将用户的密码通过电子邮件发送给用户（以防用户忘记密码）。\n\
  \n在所有情况下，使用的都是同一个表单，但表单被提交到不同的 URL。\n\n默认情况下，无论表单中有多少个提交按钮，它们都会将表单提交到表单标签的 `action`\
  \ 属性中指定的 URL。解决方法是使用常规按钮作为额外按钮，并为这些按钮使用 `onClick` 事件处理程序来重置表单的目标 URL，然后提交表单。\n\n\
  表单对象有一个 `action` 属性，指示表单将被提交到的 URL。您可以通过为该属性分配一个新的 URL 来更改此 URL：\n\n```\ndocument.formName.action\
  \ = \"new URL\";\n```\n\n表单对象还有 `submit` 方法，该方法会提交表单，就像用户点击了提交按钮一样。\n\n以下步骤使用这些原则创建一个包含三个按钮的登录表单，就像前面描述的那样：\n\
  \n**1.** 在您喜欢的编辑器中创建一个新文档。\n\n**2.** 在文档的 body 中，创建一个表单；将 `action` 指定为用户登录时表单应提交到的页面：\n\
  \n```\n<body>\n<form name=\"myForm\" action=\"login.html\">\n</form>\n</body>\n\
  ```\n\n**3.** 在表单中创建一个用户名字段：\n\n```\n用户名：<input type=\"text\" name=\"username\"\
  ><br>\n```\n\n**4.** 在表单中创建一个密码字段：\n\n```\n密码：<input type=\"password\" name=\"password\"\
  ><br>\n```\n\n**5.** 为登录过程创建一个提交按钮：\n\n```\n<input type=\"button\" value=\"登录\"\
  \ onClick=\"this.form.submit();\">\n```\n\n**6.** 为想要注册新账户的用户创建一个常规按钮：\n\n```\n\
  <input type=\"button\" value=\"注册\">\n```\n\n**7.** 在该按钮的 `onClick` 事件处理程序中，将 action\
  \ URL 设置为注册页面，然后提交表单：\n\n```\n<input type=\"button\" value=\"注册\" onClick=\"this.form.action\
  \ = 'register.html'; this.form.submit();\">\n```\n\n**8.** 为想要找回密码的用户创建一个常规按钮：\n\
