  \n### 任务 91：创建复选框\n\n与单选按钮类似，复选框允许进行是/否类型的选择：要么选中，要么未选中。但与单选按钮不同的是，复选框组之间不是互斥的：可以一个都不选，可以全选，也可以选择任意子集。\n\
  \n复选框通常用于允许用户从长列表中进行选择，用户可以选择任意数量的选项。这些列表的外观如图 91-1 所示。\n\n***注释***\n- 对于复选框，你可以在复选框的\
