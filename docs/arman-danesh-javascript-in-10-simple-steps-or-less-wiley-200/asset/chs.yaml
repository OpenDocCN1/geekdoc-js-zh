  \ 而不是列表中当前选中选项的显示文本。\n\n`</select>`\n\n`</form>`\n\n`<a href=\"#\">检查选择列表</a>`\n\
  \n`</body>`\n\n**5.** 使用 `onClick` 事件处理程序指定用户点击链接时要执行的 JavaScript 代码。在本例中，`document.myForm.mySelect.value`（表示列表中选中选项的值）作为参数传递给\
