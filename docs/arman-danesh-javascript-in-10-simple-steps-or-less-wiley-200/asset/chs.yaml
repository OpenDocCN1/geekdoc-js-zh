  \   ```\n   <body>\n   <script>\n   </script>\n   </body>\n   ```\n4. 将 JavaScript\
  \ 指定为 script 标签的语言：\n   ```\n   <body>\n   <script language=\"JavaScript\">\n  \
  \ </script>\n   </body>\n   ```\n5. 在脚本块中放置开始和结束的 HTML 注释：\n   ```\n   <body>\n\
  \   <script language=\"JavaScript\">\n   <!--\n   // -->\n   </script>\n   </body>\n\
  \   ```\n6. 创建一个名为`myVariable`的变量，并为其分配一个文本字符串：\n   ```\n   <body>\n   <script language=\"\
  JavaScript\">\n   <!--\n   var myVariable = \"Hello\";\n   // -->\n   </script>\n\
  \   </body>\n   ```\n7. 保存文件并关闭。\n\n**交叉引用：** 任务 10 介绍了变量的创建。\n\n#### 任务 13：创建数字变量\n\
  \n在 JavaScript 中处理数据和变量时，需要注意所使用的数据类型。不同的数据类型以不同的方式管理，理解一些基本数据类型非常重要。\n\n其中一种数据类型是数字。*数字*指的是任何正数或负数，只包含数字、负号和小数点。在\
  \ JavaScript 中指定数字时，不应使用单引号或双引号将其括起来；如果这样做，它将被视为文本字符串而不是数字。例如，以下是有效的数字：\n\n`100`\n\
