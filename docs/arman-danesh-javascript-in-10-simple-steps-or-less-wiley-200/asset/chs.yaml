  \ HTML 文件，右键单击链接，并像对待其他链接一样将书签工具安装为收藏夹或书签。  \n- 书签工具也可以在 Internet Explorer 和 Netscape\
  \ 以外的其他浏览器中工作。支持 JavaScript（无论程度如何）的浏览器应该能够运行本部分中介绍的一些书签工具。创建书签工具的方法因浏览器而异；如果您使用其他浏览器，请查阅其文档。\
