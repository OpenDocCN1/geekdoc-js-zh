  </body>\n```\n\n**3.** 在表单中创建一系列复选框：\n\n```html\n<body>\n<form>\n<input type=\"\
  checkbox\" value=\"1\"> 第一选项<br>\n<input type=\"checkbox\" value=\"2\"> 第二选项<br>\n\
  <input type=\"checkbox\" value=\"3\"> 第三选项\n</form>\n</body>\n```\n\n**4.** 设置 `checked`\
  \ 属性，使第三个选项默认被选中。最终页面看起来如清单 91-1 所示。\n\n```html\n<body>\n<form>\n<input type=\"\
