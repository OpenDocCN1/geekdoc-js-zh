  \ `/` 下的所有位置）。\n\n你可以通过在创建 cookie 时扩展 cookie 定义，并添加一个路径子句来实现这一点，这样 cookie 现在看起来像这样：`name=value;expires=expiryDate;path=accessPath`\n\
