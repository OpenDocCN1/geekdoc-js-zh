  \n01 542419 FM.qxd 11/19/03 10:28 AM 第 x 页\n\n## 引言\n\n自 20 世纪 90 年代中期 Netscape\
  \ 推出其旗舰浏览器 Netscape Navigator 2.0 以来，JavaScript 一直是 Web 开发领域的一部分。它提供了一种在浏览器中实现动态交互的机制，无需连接服务器，是动态\
  \ HTML 模型的核心，使得现代浏览器能够承载复杂的应用程序和用户界面。\n\n本书是一本食谱式的书籍，为您提供快速、易于理解的示例，展示如何使用 JavaScript\
  \ 执行特定任务。这些任务从简单的（如在浏览器窗口中显示动态输出）到复杂的（如创建动态交互式菜单系统）不等。\n\n本书并非 JavaScript 教程。它旨在成为您在积极构建\
  \ Web 应用程序时，需要快速回答“如何在 JavaScript 中实现这个功能？”这一问题的实用参考。对于大多数低至中等复杂度的任务，您很可能在本书中找到示例。\n\
  \n完成复杂任务通常可以通过组合书中的多个示例任务来实现。\n\n***提示*** 如果您没有任何 JavaScript 经验，您可能需要用一本 JavaScript\
  \ 编程入门教程来补充本书。例如，您可以考虑 Emily A. Vander Veer 所著的《JavaScript 傻瓜书》（John Wiley & Sons，ISBN\
  \ 0-7645-0633-1）。\n\n### 关于本书\n\n本书分为 11 个部分：\n\n### 第 1 部分：JavaScript 基础\n\n本部分提供了一些说明基本\
  \ JavaScript 技术和技能的任务。如果您从未使用过 JavaScript，本部分适合您。它提供了说明创建脚本和使用 JavaScript 基础的示例。\n\
  \n### 第 2 部分：向浏览器输出\n\n本部分涵盖了一些核心技巧，用于使用 JavaScript 向浏览器窗口生成动态输出，包括输出动态值（如日期）。\n\
  \n\n\n\n\n## 10 步以内掌握 JavaScript\n\n## 第 3 部分：图像与悬停效果\n\n使用 JavaScript，你可以操控图像，实现诸如悬停效果和随机幻灯片等效果。本部分的任务将演示如何通过\
  \ JavaScript 处理图像。\n\n## 第 4 部分：处理表单\n\n表单不仅仅是向服务器提交数据。本部分将演示如何在浏览器中创建动态客户端表单，以及如何构建无需与服务器交互即可与用户协作的表单。\n\
  \n## 第 5 部分：操控浏览器窗口\n\n本部分提供了一些任务，演示如何创建和关闭窗口、如何管理窗口的属性，以及如何处理框架。所有这些特性都是使用 JavaScript\
  \ 开发复杂用户界面的关键。\n\n## 第 6 部分：操控 Cookie\n\n通常，Cookie 由你的服务器创建并发送到浏览器存储。当用户连接到该服务器时，浏览器会将\
  \ Cookie 发送回服务器。现在，借助 JavaScript，你可以在不与服务器交互的情况下创建 Cookie 并在之后访问它们。\n\n## 第 7 部分：DHTML\
  \ 与样式表\n\nJavaScript 是构成动态 HTML 的三要素之一。另外两个要素是文档对象模型（DOM）和层叠样式表（CSS）。本部分的任务将演示如何使用\
  \ DOM 和样式表。\n\n## 第 8 部分：动态用户交互\n\n本部分提供了一些任务，演示 JavaScript 在动态用户交互中最流行的用途——从创建下拉菜单到生成浮动窗口，再到处理拖放式用户交互。\n\
  \n### 第 9 部分：处理事件\n\nJavaScript 是一种事件驱动的脚本语言。这意味着你无需创建线性程序，而是可以编写程序来响应事件。事件可能是用户点击按钮，也可能是浏览器完成某项任务（例如完成当前文档的加载）。\n\
  \n## 第 10 部分：书签小程序\n\n书签小程序是 JavaScript 的一个有趣应用，它将 JavaScript 与浏览器的书签或收藏夹功能相结合。书签小程序是简短、自包含的\
  \ JavaScript 脚本，可执行某些有用的任务，你可以将其添加到收藏夹或书签中，然后随时通过选择相应的收藏或书签来运行。\n\n### 第 11 部分：跨浏览器兼容性与问题\n\
  \n随着 JavaScript 变得越来越高级，其功能不断扩展，浏览器兼容性也成了一个难题。可以预见，不同的浏览器厂商对于在其 JavaScript 实现中采用何种正确方式有着不同的看法。结果导致大量浏览器在\
  \ JavaScript 工作方式上存在细微差异。本部分的任务将为你提供一些在应用程序中处理这些浏览器差异的技巧。\n\n附录提供了 JavaScript 和层叠样式表的快速参考，你可以在开发应用程序时查阅，以便快速回忆起正确的属性、方法或样式属性名称。\n\
  \n最后，每个任务的完整源代码都可以在配套网站 www.wiley.com/10stepsorless 上找到。这让你可以轻松尝试任务中演示的代码，或根据自己的需求改编代码。\n\
  \n## 本书使用的约定\n\n在阅读本书的过程中，你会发现一些独特的元素。我们在此对这些元素进行说明，以便你在遇到时能够理解。\n\n### 代码\n\n如果一行代码太长，无法在印刷书中以一行显示，我们将添加以下符号来表示该行继续：Æ\n\
  \n### 需要输入的文字及屏幕上的文字\n\n当要求你输入文本时，需要输入的文字将以粗体显示，例如：输入此地址：**111 River Street**。\n\
  \n当提及 URL 或你在屏幕上看到的其他文本时，我们将使用等宽字体，例如：\n\n查看 www.wiley.com。\n\n### 图标\n\n每个任务的页边空白处会出现一些特殊图标，提供你可能觉得有用的额外信息。\n\
  \n***注意***：注意图标用于提供有关 JavaScript 工作的额外信息或帮助。\n\n***提示***：提示图标用于指出一个有趣的想法或技巧，可以节省你的时间、精力、金钱，或三者兼得。\n\
  \n***警告***：警告图标用于提醒你在使用 JavaScript 时可能遇到的潜在问题。\n\n***交叉引用***：尽管本书按任务划分，以便你轻松找到所需内容，但很少有任务是完全独立的。交叉引用图标为我们提供了机会，指出本书中你可能想查看的其他任务（如果你对此任务感兴趣）。\n\
