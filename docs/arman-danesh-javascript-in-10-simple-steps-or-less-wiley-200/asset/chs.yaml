  \n\n\n\n\n## 图像与翻转效果\n\n### 任务 65\n\n1. 在脚本中，创建两个变量：`source` 和 `replacement`，分别包含值\
  \ `0` 和 `1`。这些变量允许通过名称引用每个翻转数组的 `Image` 对象：`source` 表示默认图像，`replacement` 表示翻转图像。\n\
  \n   ```javascript\n   var source = 0;\n   var replacement = 1;\n   ```\n\n2. 使用\
  \ `function` 关键字创建一个名为 `createRollOver` 的函数。该函数应接受两个参数——`originalImage`（包含默认图像的路径和名称）和\
  \ `replacementImage`（包含翻转图像的路径和名称）：\n\n   ```javascript\n   function createRollOver(originalImage,\
  \ replacementImage) {\n   }\n   ```\n\n3. 在函数中，创建一个名为 `imageArray` 的数组：\n\n   ```javascript\n\
  \   var imageArray = new Array;\n   ```\n\n4. 在数组的第一个元素中创建一个新的 `Image` 对象，使用 `source`\
  \ 指定索引，并将 `originalImage` 赋值给该图像的源：\n\n   ```javascript\n   imageArray[source] =\
  \ new Image;\n   imageArray[source].src = originalImage;\n   ```\n\n5. 在数组的第二个元素中创建一个新的\
  \ `Image` 对象，使用 `replacement` 指定索引，并将 `replacementImage` 赋值给该图像的源：\n\n   ```javascript\n\
  \   imageArray[replacement] = new Image;\n   imageArray[replacement].src = replacementImage;\n\
  \   ```\n\n6. 返回该数组作为函数的返回值：\n\n   ```javascript\n   return imageArray;\n   ```\n\
  \n7. 在函数之后，调用 `createRollOver` 函数创建所需的翻转数组，并将函数返回的数组赋值给 `rollImage1`。最终的脚本如下所示：\n\
  \n   ```html\n   <script language=\"JavaScript\">\n   var source = 0;\n   var replacement\
  \ = 1;\n\n   function createRollOver(originalImage, replacementImage) {\n      \
  \ var imageArray = new Array;\n       imageArray[source] = new Image;\n       imageArray[source].src\
  \ = originalImage;\n       imageArray[replacement] = new Image;\n       imageArray[replacement].src\
  \ = replacementImage;\n       return imageArray;\n   }\n\n   var rollImage1 = createRollOver(\"\
