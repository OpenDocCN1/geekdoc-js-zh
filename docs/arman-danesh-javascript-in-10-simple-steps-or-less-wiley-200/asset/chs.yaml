  \n**图 55-2:** 重定向到新的 URL。\n\n## 第 2 部分\n\n### 任务 56：创建“页面加载中...”占位符\n\n本任务介绍如何创建一个“页面加载中”占位符，该占位符在主文档加载时弹出一个单独的窗口。当主文档加载完成时，占位符窗口将关闭。\n\
  \n***注释***\n\n本任务使用了 `window` 对象的两个方法以及一个事件处理程序：\n\n• 一些网站会创建“页面加载中”占位页面。这些页面通常用于加载需要较长时间才能完成的页面，原因可能是加载的内容量较大，或者更常见的是在动态内容的情况下，处理页面以交付给用户需要较长时间。\n\
  \n• `window.open`：打开一个新窗口并在该窗口中加载文档\n\n• `window.close`：关闭一个窗口\n\n• `onLoad`：在 `body`\
  \ 标签中使用，用于在文档加载完成时触发 JavaScript 执行\n\n以下步骤创建占位符窗口：\n\n• 你可以使用多种策略来创建“页面加载中”占位符。这些策略可以涉及从服务器推送内容，也可以完全在客户端用\
  \ JavaScript 实现。本任务采用后一种方法。\n\n**1.** 创建一个 HTML 文件，作为“页面加载中”占位符窗口的内容。你希望用户在该窗口中看到的任何内容都应放在此文件中。将文件命名为\
  \ `holder.html`。以下是一个简单的文件，告知用户主页面正在加载：\n\n```html\n<html>\n<head>\n<title>页面加载中...</title>\n\
  </head>\n<body>\n<strong>\n页面加载中... 请稍候\n</strong>\n</body>\n</html>\n```\n\n**2.**\
  \ 在同一目录中创建主文档的 HTML 文件。在本任务中，文件命名为 `mainpage.html`。一个简单的 `mainpage.html` 文件可能如下所示：\n\
  \n```html\n<html>\n<head>\n<title>主页面</title>\n</head>\n<body>\n<p>这是主页面</p>\n</body>\n\
  </html>\n```\n\n**3.** 在 `mainpage.html` 中，向文档的头部添加一个脚本块：\n\n```html\n<script language=”JavaScript”>\n\
  </script>\n```\n\n**4.** 在脚本块中，使用 `window.open` 打开一个新窗口。该方法接受三个参数：要在窗口中加载的文件、窗口的名称以及定义窗口特性的一系列参数——在本例中，窗口的宽度和高度设置为\
  \ 200 像素。该方法返回对窗口对象的引用，以便稍后可以操作该窗口。该引用存储在变量 `placeHolder` 中：\n\n```javascript\n\
  var placeHolder = window.open(“holder.html”,”Æ\nholderWindow,”width=200,height=200”);\n\
  ```\n\n***提示***\n\n• 对于像 `mainpage.html` 这样短的文档，这种占位符意义不大。在这种情况下，占位符几乎会立即出现并消失。你需要一个很长、很复杂的\
  \ HTML 文档，或者一个需要时间生成的动态文档，才能使这种占位符有价值。\n\n**5.** 向 `body` 标签添加一个 `onLoad` 属性：\n\n\
  ```html\n<body onLoad=””>\n```\n\n**6.** 将 `placeHolder.close()` 作为 `onLoad` 属性的值。这会在主文档加载完成后关闭占位符窗口。最终的\
  \ `mainpage.html` 代码如清单 56-1 所示。\n\n```html\n<html>\n<head>\n<script language=”JavaScript”>\n\
  var placeHolder = Æ\nwindow.open(“holder.html”,”placeholder”,”width=200,Æ\nheight=200”);\n\
  </script>\n<title>主页面</title>\n</head>\n<body onLoad=”placeHolder.close()”>\n<p>这是主页面</p>\n\
  </body>\n</html>\n```\n\n**清单 56-1:** 将占位符代码集成到 HTML 文档中。\n\n**7.** 确保 `holder.html`\
  \ 和 `mainpage.html` 位于同一目录，然后在浏览器窗口中加载 `mainpage.html`。应该会出现一个包含 `holder.html` 内容的窗口，位于主窗口之上，并在主窗口加载完成后立即消失。\n\
