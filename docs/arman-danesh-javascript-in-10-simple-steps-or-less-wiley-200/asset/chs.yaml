  \ && !document.getElementById);\n   var ns6 = document.getElementById && !document.all);\n\
  \   </script>\n   ```\n\n   **清单 248-1：** 创建浏览器检测变量。\n\n### 任务 249：处理新浏览器中对象位置的差异\n\
  \n当在 JavaScript 中直接操作页面元素时，需要注意 Internet Explorer 和 Netscape 浏览器之间的一些关键差异。回想一下，可以通过`id`属性为\
  \ HTML 中的任何对象分配 ID。例如，以下 HTML 创建了一个 ID 为`myText`的文本跨度：\n\n```html\n<span id=\"myText\"\
  >此处显示一些文本</span>\n```\n\n> **注意：** span 标签有三个主要用途：为页面元素分配 ID、为页面元素分配类、或直接为页面元素分配一个或多个样式属性。在文档中，分配给标签的所有\
  \ ID 都应是唯一的，但类可以共享。ID 和标签都可以与样式定义关联，这些样式定义随后会应用于匹配的页面元素。\n\n如果你想在 JavaScript 中引用这个文本跨度，在两个浏览器中引用方式不同。Netscape\
  \ 通过`document`对象下的 ID 来引用页面元素。这意味着该文本可以用以下方式引用：\n\n```javascript\ndocument.myText\n\
  ```\n\n相比之下，在 Internet Explorer 中，你通过`document.all`下的 ID 来引用页面元素：\n\n```javascript\n\
  document.all.myText\n```\n\n幸运的是，你可以使用`document.getElementById`方法来解决这个差异：给定页面元素的\
  \ ID 字符串，该方法返回与该元素关联的对象的引用，并且 Internet Explorer 5 及以上版本和 Netscape 6 及以上版本都支持该方法。\n\
  \n> **注意：** 需要特别指出的是，`document.getElementById`方法在 Internet Explorer 4 或 Netscape\
  \ 4 系列浏览器中不可用；此处提供的解决方案适用于较新的浏览器。\n\n要使用此方法引用之前的文本跨度，你可以这样写：\n\n```javascript\n\
  document.getElementById(\"myText\");\n```\n\n以下任务说明了此方法的使用。用户会看到一个链接；当点击该链接时，文本会被替换为新文本：\n\
  \n1. 在编辑器中创建一个新文档。\n\n2. 在文档的正文中，创建一个新的文本跨度：\n\n   ```html\n   <body>\n   <span>\n\
  \   </span>\n   </body>\n   ```\n\n3. 使用 span 标签的`id`属性为跨度指定一个 ID：\n\n   ```html\n\
  \   <span id=\"mySpan\">\n   ```\n\n   ![Image 650](img/index-542_1.jpg)\n\n4. 在文本跨度中，创建一个供用户点击以更改跨度内文本的链接：\n\
  \n   ```html\n   <a href=\"\">更改此文本</a>\n   ```\n\n5. 作为链接的 URL，使用`javascript:`\
  \ URL 来更改与文本跨度页面元素关联的对象的`text`属性。最终页面如清单 249-1 所示。\n\n   ```html\n   <body>\n  \
  \ <span id=\"mySpan\">\n   <a href=\"javascript:document.getElementById('mySpan').text\
  \ = 'New Text';\">更改此文本</a>\n   </span>\n   </body>\n   ```\n\n   **清单 249-1：**\
  \ 访问页面元素。\n\n6. 保存文件并关闭。\n\n7. 在浏览器中打开文件，你会看到一个链接。\n\n8. 点击链接，链接消失并被新文本替换，如图 249-1\
