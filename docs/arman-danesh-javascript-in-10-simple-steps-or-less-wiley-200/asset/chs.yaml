  \n**1.** 创建或选择一个用于图像按钮的图像文件。\n\n**2.** 在你偏好的编辑器中创建一个新的 HTML 文档。\n\n**3.** 在文档的正文中，创建一个表单。\n\
  \n**4.** 在表单中放置你想要的任何字段；不要包含提交按钮：\n\n```\n<body>\n<form name=\"myForm\" action=\"\
