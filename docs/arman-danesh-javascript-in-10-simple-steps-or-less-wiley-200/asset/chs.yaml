  \n**图 109-2：** 响应用户点击图像。\n\n### 任务 110：控制表单提交 URL\n\n在 HTML 中创建表单时，你可以使用 `form`\
  \ 标签的 `action` 属性指定表单应提交到的页面：\n\n`<form action=\"要提交表单的 URL\">`\n\n这在 JavaScript\
  \ 中表现为表单对象的 `action` 属性：\n\n`document.formName.action`\n\n你可以通过为该属性分配一个新的 URL 来动态更改此目标\
  \ URL：\n\n`document.formName.action = \"*新 URL*\";`\n\n***注意***\n• 注意示例中使用了 `#`\
  \ 作为 URL。当使用 `onClick` 事件处理程序触发新窗口的打开时，你不希望点击链接导致当前窗口的位置发生变化；这是一种简单的避免方法（参见步骤 5）。\n\
  \n以下任务创建了一个表单以及一个链接。如果点击链接，表单的目标操作 URL 会被更改。当用户提交表单时，目标 URL 会在表单提交前显示在一个对话框中。\n\n\
  **1.** 在新文档中创建一个名为 `myForm` 的表单：\n\n```\n<body>\n<form name=\"myForm\" action=\"\
  target.html\">\n</form>\n</body>\n```\n\n**2.** 在表单中，创建你需要的任何字段以及一个提交按钮：\n\n```\n\
  <body>\n<form name=\"myForm\" action=\"target.html\">\n输入一些文本：<input type=\"text\"\
  \ name=\"myField\"><br>\n<input type=\"submit\">\n</form>\n</body>\n```\n\n**3.**\
  \ 在提交按钮中，使用 `onClick` 事件处理程序在提交表单前将操作 URL 显示在一个对话框中：\n\n```\n<input type=\"submit\"\
  \ onClick=\"window.alert(this.form.action);\">\n```\n\n**4.** 在表单之后，创建一个以 `#` 为\
  \ URL 的链接：\n\n`<a href=\"#\">更改表单操作目标</a>`\n\n**5.** 使用 `onClick` 事件处理程序在点击链接时更改目标\
  \ URL。完整的页面如清单 110-1 所示。\n\n```\n<body>\n<form name=\"myForm\" action=\"target.html\"\
  >\n输入一些文本：<input type=\"text\" name=\"myField\"><br>\n<input type=\"submit\" onClick=\"\
  window.alert(this.form.action);\">\n</form>\n<a href=\"#\" onClick=\"document.myForm.action\
  \ = 'alternate.html';\">更改表单操作目标</a>\n</body>\n```\n\n**清单 110-1：** 完成的页面。\n\n**6.**\
  \ 保存文件并关闭。\n\n**7.** 在浏览器中打开该文件，你会看到创建的表单。\n\n**8.** 在不点击链接的情况下提交表单。它将提交到原始 URL，如图\
  \ 110-1 所示。\n\n***交叉引用***\n• 在任务 224 中了解更多关于提交表单的信息。\n\n**图 110-1：** 将表单提交到原始 URL。\n\
  \n**9.** 在浏览器中重新加载文件。点击链接，然后提交表单，表单将提交到新的 URL。\n\n### 任务 111：使用正则表达式验证数字文本字段\n\n\
  有时你会遇到一个表单，需要将文本字段中输入的内容限制为特定字符。例如，你可能希望将文本限制为数字。使用正则表达式，你可以在用户提交表单时轻松执行此检查。\n\n\
  ***备注***\n• 当你将正则表达式赋值给一个变量时，你正在创建一个正则表达式对象。该对象有一个 `test` 方法，允许你针对作为参数提供给该方法的字符串测试表达式。如果匹配，该方法返回\
  \ `true`，否则返回 `false`。\n• 用于验证数字值的正则表达式如下：`/^[0-9]+\\.?[0-9]+$/`\n• 正则表达式功能强大，但需要你具备大量经验才能熟练使用。\n\
  \n正则表达式提供了通配符概念的强大扩展，允许你指定文本模式并搜索匹配这些模式的文本。不幸的是，正则表达式是一个高级主题，超出了本书的范围；然而，本任务展示了如何使用正则表达式进行数字验证。\n\
  \n以下步骤创建了一个表单，其中包含一个用于输入电话号码的字段，该字段使用正则表达式进行验证：\n\n**1.** 在新 HTML 文档的头部，创建一个包含函数\
  \ `checkNumber` 的脚本块，该函数接收一个文本字符串：\n\n```\n<script language=\"JavaScript\">\nfunction\
  \ checkNumber(number) {\n}\n</script>\n```\n\n**2.** （原始文本中未提供其余步骤；内容到此结束。）\n\n\n\
  \n\n\n**2.** 在函数中，创建一个用于匹配数值的正则表达式：\n\n```javascript\nvar check = /^[0-9]+\\.?[0-9]+$/;\n\
  ```\n\n你可以在 `http://www.linuxpcug.org/lessons/regex.htm` 找到关于正则表达式的入门教程。\n\n**3.**\
  \ 接下来，测试该模式是否与数字不匹配：\n\n```javascript\nif (!check.test(number)) {\n```\n\n注意，你对\
  \ `test` 方法返回的结果进行了取反。这样，只有当没有找到匹配时，`if` 语句才为真。\n\n**4.** 如果没有找到匹配，则通知用户并从函数返回 `false`：\n\
  \n```javascript\nif (!check.test(number)) {\n  window.alert(\"You must provide a\
  \ valid number.\");\n  return false;\n}\n```\n\n**5.** 最后，如果数字通过了测试，则从函数返回 `true`，这样完整的函数如下所示：\n\
  \n```javascript\nfunction checkNumber(number) {\n  var check = /^[0-9]+\\.?[0-9]+$/;\n\
  \  if (!check.test(number)) {\n    window.alert(\"You must provide a valid number.\"\
  );\n    return false;\n  }\n  return true;\n}\n```\n\n**6.** 创建另一个名为 `checkForm`\
  \ 的函数，它接受一个表单对象作为参数。该函数应调用 `checkNumber`，并将包含数字的字段的值传递给它，然后返回 `checkNumber` 函数返回的结果：\n\
  \n```javascript\nfunction checkForm(formObj) {\n  return checkNumber(formObj.myField.value);\n\
  }\n```\n\n**7.** 创建一个包含用于输入电话号码的字段的表单，并使用 `onSubmit` 事件处理程序调用 `checkForm` 函数：\n\n\
  ```html\n<body>\n<form name=\"myForm\" action=\"target.html\" onSubmit=\"return\
  \ checkForm(this);\">\n  Enter a number: <input type=\"text\" name=\"myField\"><br>\n\
  \  <input type=\"submit\">\n</form>\n</body>\n```\n\n**8.** 保存文件并在浏览器中打开。将出现图 111-1\
  \ 中的表单。\n\n***交叉引用***  \n任务 106 提供了使用正则表达式验证电话号码的代码。\n\n**图 111-1：** 带有文本字段的表单。\n\
  \n**9.** 尝试在没有有效数字的情况下提交表单，你应该会看到相应的错误消息。\n\n---\n\n### 任务 112：在提交前加密数据\n\n通过在通过互联网提交表单之前对表单中的数据进行加密，可以为正在传输的数据增加一层隐私保护。如果需要，可以在\
  \ JavaScript 中通过在提交表单之前将每个表单字段传递给加密函数来实现这一点。原理很简单：\n\n**1.** 在表单标签中，使用 `onSubmit`\
  \ 在提交表单之前调用加密函数。\n\n***注释***  \n- 字符串有一个 `length` 属性，返回字符串中的字符数。如果字符串为空，则长度为 0。\
  \  \n- `charCodeAt` 方法返回字符串中指定索引位置的字符的 Unicode 表示。  \n- 数组有一个名为 `length` 的属性，返回数组中的项数，在此循环中使用。由于数组是从零开始索引的，长度为\
  \ 5 的数组（包含五个元素）将包含索引从 0 到 4 的元素。这就是为什么循环条件为 `i` 小于数组长度，而不是小于等于。  \n- 关键字 `this`\
  \ 用于将表单传递给函数。在表单本身的事件处理程序中，`this` 指向表单对象本身。  \n- 在 `onSubmit` 事件处理程序中添加了一个警告框，以便在提交表单之前查看加密文本字段的值。这允许你检查加密是否正常工作。在实际应用中你不会包含这个。\n\
  \n**2.** 加密表单应遍历表单中的每个字段，并加密每个字段的值。加密过程可以使用表单标签的 `elements` 属性轻松访问表单中的所有字段，而无需事先知道这些字段是什么。该属性是一个数组，包含表单中每个对象的一个条目。因此，表单中的第一个字段可以引用为：\n\
  \n```javascript\ndocument.formName.elements[0]\n```\n\n以下任务创建一个表单，该表单在传输前使用一个简单的算法进行加密。加密算法只是将表单字段中的每个字母转换为其对应的数字\
  \ Unicode 值：\n\n**1.** 在新 HTML 文档的头部，创建一个包含名为 `encrypt` 函数的脚本块。该函数应接受一个文本字符串作为唯一参数。该字符串将被加密：\n\
  \n```html\n<script language=\"JavaScript\">\nfunction encrypt(item) {\n}\n</script>\n\
  ```\n\n**2.** 在函数中，创建一个名为 `newItem` 的变量，用于保存加密后的字符串。最初它应该是一个空字符串：\n\n```javascript\n\
  var newItem = \"\";\n```\n\n**3.** 遍历原始文本字符串中的每个字符：\n\n```javascript\nfor (i = 0;\
  \ i < item.length; i++) {\n}\n```\n\n**4.** 对于字符串中的每个字符，使用字符串对象的 `charCodeAt` 方法获取该字母的数字\
  \ Unicode 表示，并将其添加到 `newItem` 字符串中。注意，每个字符后添加了一个点号。这样可以清晰地分隔字符，以便以后更容易解密。\n\n**5.**\
  \ 从函数返回加密后的字符串。`encrypt` 函数应如下所示：\n\n```javascript\nfunction encrypt(item) {\n \
  \ var newItem = \"\";\n  for (i = 0; i < item.length; i++) {\n    newItem += item.charCodeAt(i)\
  \ + \".\";\n  }\n  return newItem;\n}\n```\n\n***提示***  \n- 在 JavaScript 中加密数据在安全性方面的实用性有限。因为用户可以通过在浏览器中查看源代码来读取\
  \ JavaScript 代码，任何人都可以确定你如何加密表单，并可以轻松解密数据。然而，这种方法确实提供了一层隐私保护；在用户提交表单后，通过互联网传输的数据对于任何在数据流经互联网时拦截数据的人来说并不是立即显而易见的。这在某些应用中可能有所帮助。\
  \  \n- 这不是真正的加密；它只是说明如何将加密函数与表单提交过程结合起来。要实现另一种加密算法，你需要编写自己的加密函数，然后在需要时调用该函数。\n\n\
  ***交叉引用***  \n注意这里使用的简写连接运算符：`+=`。使用 `a += b` 等同于 `a = a + b`。有关在 JavaScript 中进行数学运算的更多信息，请参见任务\
  \ 14。\n\n**6.** 创建第二个名为 `encryptForm` 的函数，它接受一个表单对象作为参数。\n\n**7.** 在函数中，遍历 `elements`\
  \ 数组。对于每个元素，使用 `encrypt` 函数加密字段的值，并将结果存回字段的 value 中：\n\n```javascript\nfunction\
  \ encryptForm(myForm) {\n  for (i = 0; i < myForm.elements.length; i++) {\n    myForm.elements[i].value\
  \ = encrypt(myForm.elements[i].value);\n  }\n}\n```\n\n**8.** 在文档的正文中，创建一个包含所需字段的表单。使用\
  \ `onSubmit` 事件处理程序将表单提交给 `encryptForm` 函数：\n\n```html\n<form name=\"myForm\" action=\"\
  target.html\" onSubmit=\"encryptForm(this); window.alert(this.myField.value);\"\
  >\n  Enter Some Text: <input type=\"text\" name=\"myField\"><br>\n  <input type=\"\
  submit\">\n</form>\n```\n\n**9.** 保存文件并在浏览器中打开。\n\n**10.** 点击提交按钮。表单被加密，并且在表单提交之前，加密后的字段值会显示在一个对话框中。\n\
  \n---\n\n### 任务 113：使用表单进行自动导航跳转\n\n有时你会看到表单选择列表被用作提供页面不同 URL 导航的机制。下拉列表将包含多个 URL，如图\
  \ 113-1 所示。当用户选择列表中的某个条目时，浏览器会自动跳转到该 URL。\n\n***注释***  \n`window` 的值。\n\n\n\n\n\n\
  `location` 决定了调用时打开哪个窗口。将其设置为某个 URL 的值会打开指定的 URL。将其设置为 `#` 则会使用当前窗口。\n\n• 在选项列表改变时跳转到新\
  \ URL 的另一种方法是结合按钮使用选项列表。当用户点击按钮时，浏览器会跳转到列表中当前选中的 URL。\n\n**图 113-1：** 用于导航到 URL\
  \ 的选项列表。\n\n这种导航通过两个原则实现：\n\n• `onChange` 事件处理程序可以检测选项列表中选中项的变化。\n• 将 `window.location`\
  \ 设置为新的 URL 会重定向浏览器。\n\n以下任务展示了如何构建一个包含 URL 的简单选项列表。JavaScript 代码会将用户重定向到选中的 URL。\n\
  \n**1.** 在新文档的正文中创建一个表单。\n\n**2.** 创建一个包含你想要允许用户导航到的 URL 的选项列表：\n\n```html\n<select\
  \ name=\"url\">\n  <option></option>\n  <option value=\"http://www.juxta.com/\"\
  >www.juxta.com</option>\n  <option value=\"http://www.anis.cc/\">www.anis.cc</option>\n\
  \  <option value=\"http://www.hatcher.org/\">www.hatcher.org</option>\n</select>\n\
  ```\n\n![Image 267](img/index-256_1.jpg)\n\n05 542419 Ch04.qxd 11/19/03 10:00 AM\
  \ Page 233\n\n**处理表单**\n\n**233**\n\n**3.** 使用 select 标签的 `onChange` 事件处理程序将浏览器重定向到选中条目的\
  \ URL（URL 是每个条目的值）。清单 113-1 显示了代码。\n\n```html\n<body>\n<form>\n选择站点：\n<select name=\"\
  url\" onChange=\"window.location = this.value;\">\n  <option></option>\n  <option\
  \ value=\"http://www.juxta.com/\">www.juxta.com</option>\n  <option value=\"http://www.anis.cc/\"\
  >www.anis.cc</option>\n  <option value=\"http://www.hatcher.org/\">www.hatcher.org</option>\n\
  </select>\n</form>\n</body>\n```\n\n**清单 113-1：** 包含 URL 的选项列表。\n\n**4.** 保存文件并关闭。\n\
  \n**5.** 在浏览器中打开文件。会出现一个选项列表，如图 113-2 所示。\n\n***交叉引用***\n\n• 任务 227 展示了当用户做出选择时如何执行其他操作。\n\
