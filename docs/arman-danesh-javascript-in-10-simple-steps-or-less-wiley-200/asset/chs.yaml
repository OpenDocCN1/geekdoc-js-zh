  \ `myText`，该\n\n\n\n\n\n## 处理表单\n\n### 任务 80：为表单文本字段赋值\n\n以下是完成的表单：\n\n```html\n\
  <body>\n<form name=\"myForm\">\nEnter some Text: <input type=\"text\" name=\"myText\"\
  ><br>\nCopy Text: <input type=\"text\" name=\"copyText\">\n</form>\n</body>\n```\n\
  \n**提示**\n- 如果表单没有命名，则每个表单都可以通过 `document.forms` 数组访问，因此文档中的第一个表单是 `document.forms[0]`，第二个是\
  \ `document.forms[1]`，以此类推。\n- 如果字段没有命名，则表单中的每个字段都可以通过 `document.formName.elements`\
  \ 数组访问，因此表单中的第一个字段是 `document.formName.elements[0]`，第二个是 `document.formName.elements[1]`，以此类推。\n\
  \n**4.** 创建一个用于动态更改文本的链接。用户可以在 `myText` 字段中输入文本，然后点击链接将该文本复制到第二个文本字段中；复制操作通过 JavaScript\
  \ 完成。虽然本例中使用的是链接，但你也可以轻松地使用按钮点击或其他任何事件来动态更改文本。将 `#` 指定为链接的 URL。\n\n**5.** 为链接添加一个\
  \ `onClick` 事件处理程序。这将指定用户点击链接时要执行的 JavaScript 代码。属性 `document.formName.formField.value`\
  \ 包含表单中某个字段的值，该值是一个文本字符串。如果你为 `value` 属性赋值，新值将显示在文本字段中。在本例中，`myText` 字段的值将被赋给 `copyText`\
  \ 字段。这是通过将 `document.myForm.myText.value` 赋值给 `document.myForm.copyText.value` 来实现的。清单\
  \ 80-1 显示了添加了链接和 JavaScript 后的最终表单。图 80-1 显示了该表单。\n\n```html\n<body>\n<form name=\"\
  myForm\">\nEnter some Text: <input type=\"text\" name=\"myText\"><br>\nCopy Text:\
  \ <input type=\"text\" name=\"copyText\">\n</form>\n<a href=\"#\" onClick=\"document.myForm.copyText.value\
  \ = document.myForm.myText.value;\">Copy Text Field</a>\n</body>\n```\n\n**清单 80-1：**\
  \ 为表单文本字段赋值。\n\n![Image 229](img/index-190_1.jpg)\n![Image 230](img/index-190_2.jpg)\n\
  \n**图 80-1：** 包含两个文本字段的表单。\n\n**6.** 保存文件并关闭。\n\n**7.** 在浏览器中打开该文件。你应该会看到如图 80-1\
  \ 所示的表单和链接。在第一个文本字段中输入一些文本，然后点击链接，即可看到文本被复制并显示在第二个字段中，如图 80-2 所示。\n\n***交叉引用***\n\
  - 有关命名元素和表单的更多信息，请参见任务 78。\n\n**图 80-2：** 为文本字段赋值。\n\n---\n\n### 任务 81：检测文本字段中的更改\n\
  \n当你创建 HTML 表单时，实际上是在创建一系列可以从 JavaScript 中访问的对象。利用这些对象，你可以检测文本输入字段等表单字段中的更改。\n\n\
  本任务将向你展示如何响应文本输入字段中的更改。文本输入字段通过 `input` 标签并将 `type` 属性设置为 `text` 来创建。为了使该字段在 JavaScript\
  \ 中可访问，最好还使用 `name` 属性为字段指定一个名称：\n\n```html\n<input type=\"text\" name=\"myField\"\
  >\n```\n\n你可以使用 `onChange` 事件处理程序指定当字段发生更改时要执行的代码：\n\n```html\n<input type=\"text\"\
  \ name=\"myField\" onChange=\"JavaScript code to execute when the value of the field\
  \ changes\">\n```\n\n以下步骤创建一个包含文本字段的表单。当检测到字段中的更改时，会显示一个对话框，告知用户该字段中的值。\n\n**1.**\
  \ 在你喜欢的编辑器中创建一个新文档。\n\n**2.** 在文档的 body 中，创建一个名为 `myForm` 的表单。\n\n```html\n<body>\n\
  <form name=\"myForm\">\n</form>\n</body>\n```\n\n**3.** 在表单中，创建一个名为 `myText` 的文本输入字段：\n\
  \n```html\n<body>\n<form name=\"myForm\">\nEnter some Text: <input type=\"text\"\
  \ name=\"myText\">\n</form>\n</body>\n```\n\n**4.** 为该字段分配一个 `onChange` 事件处理程序。该处理程序应使用\
  \ `window.alert` 方法在对话框中显示 `this.value`。最终页面应如清单 81-1 所示。\n\n**5.** 保存文件并关闭。\n\n\
  **6.** 在浏览器中打开该文件。你应该会看到如图 81-1 所示的表单。\n\n**7.** 在文本字段中输入一些文本，然后点击字段外部以移除焦点。你应该会看到如图\
  \ 81-2 所示的对话框。\n\n```html\n<body>\n<form name=\"myForm\">\nEnter some Text: <input\
  \ type=\"text\" name=\"myText\" onChange=\"window.alert(this.value);\">\n</form>\n\
  </body>\n```\n\n**清单 81-1：** 检测文本字段中的更改。\n\n![Image 231](img/index-192_1.jpg)\n\
  ![Image 232](img/index-192_2.jpg)\n\n**图 81-1：** 包含一个文本字段的表单。\n\n***注释***\n- 对于更改的检测，大多数浏览器（包括所有主流浏览器）实际上只有在焦点离开该字段时（例如用户点击表单中的另一个字段）才认为发生了更改。如果用户没有这样做，那么每次输入一个字符时，`onChange`\
  \ 事件处理程序中的代码都会执行。相反，代码仅在发生更改且焦点离开该字段时执行。\n- 在表单字段的事件处理程序中工作时，`this` 关键字指向与该字段本身关联的对象，这允许你在\
  \ `onChange` 事件处理程序中使用 `this.value` 而不是 `document.myForm.myText.value` 来引用文本字段的值（参见步骤\
  \ 4）。\n\n***交叉引用***\n- 了解如何在任务 78 中命名字段。\n\n**图 81-2：** 检测文本字段中的更改。\n\n---\n\n###\
  \ 任务 82：访问选择列表\n\n当你创建 HTML 表单时，实际上是在创建一系列可以从 JavaScript 中访问的对象。表单本身是一个对象，而每个表单字段在\
  \ JavaScript 中由一个对象表示。利用这些对象，你可以访问存储在表单字段（如选择列表）中的值。\n\n本任务将向你展示如何检查选择列表中的当前选项。以下步骤创建一个包含单个选择列表的表单，然后提供一个链接，用户点击该链接即可在对话框中显示当前选中选项的值。JavaScript\
  \ 用于在对话框中显示此信息。\n\n**1.** 在你喜欢的编辑器中创建一个新文档。\n\n**2.** 在文档的 body 中，创建一个名为 `myForm`\
  \ 的表单。\n\n**3.** 在表单中，创建一个名为 `mySelect` 的选择列表，并添加多个选项：\n\n```html\n<body>\n<form\
  \ name=\"myForm\">\n<select name=\"mySelect\">\n<option value=\"First Choice\">1</option>\n\
  <option value=\"Second Choice\">2</option>\n<option value=\"Third Choice\">3</option>\n\
  </select>\n</form>\n</body>\n```\n\n**4.** 在表单之后，创建一个 URL 为 `#` 的链接。该链接将用于在对话框中显示表单字段的选中值：\n\
  \n```html\n<body>\n<form name=\"myForm\">\n<select name=\"mySelect\">\n<option value=\"\
  First Choice\">1</option>\n<option value=\"Second Choice\">2</option>\n<option value=\"\
  Third Choice\">3</option>\n</select>\n</form>\n<a href=\"#\">Display Selected Value</a>\n\
  </body>\n```\n\n注意示例中使用了 `#` 作为 URL。当使用 `onClick` 事件处理程序触发打开新窗口时，你不希望点击链接导致当前窗口的位置发生变化；这是一种简单的避免方法。\n\
  \n***注释***\n- 选择列表通过 `select` 标签创建。你可以使用 `option` 标签填充列表：\n  ```html\n  <select\
