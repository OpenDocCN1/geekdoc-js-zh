  \n**图 85-2:** 检测新选择。\n\n### 任务 86：根据一个选择列表中的选择更新另一个选择列表\n\n在一些交互式 Web 表单中，一个常见功能是：在一个选择列表中的选择会导致第二个选择列表中出现动态条目。这允许你创建智能表单，用户在一个选择列表中的选择可以决定第二个选择列表中的可用选项。\n\
