  \ JavaScript 中引用这两个窗口。\n\n### 任务 131：在 JavaScript 中关闭窗口\n\n每个浏览器窗口都有一个与之关联的 `window`\
  \ 对象。如任务 114 所述，该对象提供了允许你访问窗口中的框架、访问窗口名称、操作状态栏文本以及检查窗口打开或关闭状态的属性。这些方法允许你显示各种对话框，以及打开新窗口和关闭已打开的窗口。\n\
  \n`window` 对象的功能包括：\n\n- 创建警告对话框\n- 创建确认对话框\n- 创建提示用户输入信息的对话框\n- 在新窗口中打开页面\n- 确定窗口大小\n\
  - 控制窗口中显示的文档的滚动\n- 调度函数的执行\n\n可以通过以下几种方式引用 `window` 对象：\n\n- 使用关键字 `window` 或 `self`\
  \ 来引用当前执行 JavaScript 代码的窗口。例如，`window.alert` 和 `self.alert` 引用的是同一个方法。\n- 使用另一个已打开窗口的对象名称。例如，如果一个窗口与名为\
  \ `myWindow` 的对象关联，那么 `myWindow.alert` 将引用该窗口中的 `alert` 方法。\n\n关闭窗口很简单；只需调用 `close`\
  \ 方法。例如：`self.close();`\n\n本任务通过创建一个页面来演示这一点，该页面在打开后立即关闭当前窗口：\n\n\n\n\n\n## 操作浏览器窗口\n\
  \n### 任务 131：文档加载后立即关闭窗口\n\n1. 创建一个新的 HTML 文档。\n2. 在文档的头部，创建一个带有开始和结束 script 标签的脚本块：\n\
  \n```html\n<script lanauge=”JavaScript”>\n</script>\n```\n\n3. 在脚本中调用 `window.close`\
  \ 方法。页面应如清单 131-1 所示。\n\n```html\n<head>\n  <script lanauge=”JavaScript”>\n    window.close();\n\
  \  </script>\n</head>\n<body>\n  此页面将在你看到之前被关闭。\n</body>\n```\n\n**清单 131-1：** 文档加载后立即关闭窗口。\n\
  \n4. 保存文件并关闭。\n5. 在浏览器窗口中打开该文件；窗口会立即关闭。\n\n> **交叉引用**\n> * 各种类型的对话框在任务 25、26 和 117\
  \ 中讨论。\n\n![Image 327](img/index-295_1.jpg)\n\n### 任务 132：通过链接关闭窗口\n\n每个浏览器窗口都有一个与之关联的\
  \ `window` 对象。如任务 114 所述，该对象提供了允许你访问窗口中的框架、访问窗口名称、操作状态栏文本以及检查窗口打开或关闭状态的属性。这些方法允许你显示各种对话框，以及打开新窗口和关闭已打开的窗口。\n\
  \n`window` 对象的特性包括：\n\n* 创建警告对话框\n* 创建确认对话框\n* 创建提示用户输入信息的对话框\n* 在新窗口中打开页面\n* 确定窗口大小\n\
  * 控制窗口中显示文档的滚动\n* 调度函数的执行\n\n`window` 对象可以通过以下几种方式引用：\n\n* 使用关键字 `window` 或 `self`\
  \ 来引用当前执行 JavaScript 代码的窗口。例如，`window.alert` 和 `self.alert` 指向同一个方法。\n* 使用另一个打开窗口的对象名称。例如，如果一个窗口与名为\
  \ `myWindow` 的对象关联，那么 `myWindow.alert` 将引用该窗口中的 `alert` 方法。\n\n有时，网页会在页面上包含一个链接，以便用户可以通过点击链接来关闭页面，而不是使用窗口自身的关闭控件。这在网站为了特定目的弹出新窗口并希望用户能轻松关闭该新窗口的情况下尤为常见。图\
  \ 132-1 展示了一个带有此类链接的窗口（来自互联网）。\n\n**图 132-1：** 在窗口内提供关闭链接。\n\n![Image 328](img/index-296_1.jpg)\n\
  \n提供这样一个“关闭窗口”链接很容易，只需在链接中使用 `javascript:` URL 来调用 `window.close` 方法：\n\n```html\n\
  <a href=”javascript:window.close();”>\n```\n\n以下步骤展示了如何创建一个带有关闭窗口链接的简单页面：\n\n1.\
  \ 创建一个新的 HTML 文档。\n2. 在文档的正文中，创建一个用于关闭窗口的链接。\n3. 在 `a` 标签的 `href` 属性中使用 `javascript:`\
  \ URL，当用户点击链接时调用 `window.close` 方法，使最终页面如清单 132-1 所示。\n\n```html\n<body>\n  <a href=”javascript:window.close();”>关闭此窗口</a>\n\
  </body>\n```\n\n**清单 132-1：** 通过链接关闭窗口。\n\n4. 保存文件并在浏览器中打开。页面将显示一个如图 132-2 所示的链接。\n\
