  \ `a` 开始和结束标签内的任何内容时，将执行 JavaScript 代码；在此情况下，只有图像位于 `a` 块内。\n> - `onClick` 事件在支持\
  \ JavaScript 的浏览器中可用于 `a` 标签，但仅在新版浏览器（Netscape 6 及以上或 Internet Explorer 4 及以上）中可用于\
  \ `img` 标签。\n\n以下展示了在 `img` 和 `a` 标签中使用 `onClick` 的方法，并在鼠标点击图像时在对话框中显示相应的消息：\n\n\
