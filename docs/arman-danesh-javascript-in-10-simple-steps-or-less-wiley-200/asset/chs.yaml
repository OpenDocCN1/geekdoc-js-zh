  \ == \"\") { }`\n\n4. 如果字段为空，则提醒用户必须输入文本才能继续，然后将鼠标焦点返回到该字段，并将 `formOK` 设置为 false：`window.alert(\"\
  You must enter a value in the field\"); formObj.myField.focus(); formOK = false;`\n\
  \n5. 检查 `formOK` 是否为 true，如果是，则提交表单：`if (formOK) { formObj.submit(); };`\n\n6. 在文档的正文中，创建一个名为\
  \ `myForm` 的表单，其中包含一个名为 `myField` 的文本字段和一个普通按钮（不是提交按钮）：\n\n```\n<form name=\"myForm\"\
  \ action=\"target.html\">\n  Text Field: <input type=\"text\" name=\"myField\"><br>\n\
  \  <input type=\"button\" value=\"Submit\">\n</form>\n```\n\n7. 在按钮的 `onClick` 事件处理程序中，调用\
