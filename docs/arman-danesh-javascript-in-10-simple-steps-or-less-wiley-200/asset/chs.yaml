  07 542419 Ch06.qxd 11/19/03 10:34 AM 第 308 页\n\n**308** **第 6 部分**\n\n### 任务 149：控制\
  \ Cookie 的过期时间\n\n创建 Cookie 时，你可能希望设置过期日期和时间。如果设置 Cookie 时不指定过期时间，该 Cookie 将在用户浏览器会话结束时过期，你将无法跨多个用户会话访问该\
  \ Cookie。要创建带有过期日期的 Cookie，你需要在 Cookie 字符串中附加一个过期日期，使其看起来像下面这样：\n\n`name=value;expires=date`\n\
  \n过期日期是可选的，通常表示为格林威治标准时间的字符串，你可以使用 `Date` 对象的 `toGMTString` 方法生成该字符串。\n\n***注意***\n\
  - 使用 `toGMTString` 方法时，返回的日期将类似于：“Fri, 28-Mar-03 10:05:32 UTC”。UTC 是协调世界时的国际标准代码，也是格林威治标准时间的另一种称呼。\n\
  \n以下步骤概述了创建带有过期日期的 Cookie 的过程：\n\n1. 创建一个 `Date` 对象，用于指定 Cookie 过期的日期和时间；这通过将 `Date`\
  \ 对象的新实例赋值给一个变量，并将日期信息作为参数传递给 `Date` 对象来完成。在此例中，生成的 `Date` 对象存储在变量 `myDate` 中，并将该对象的日期设置为\
  \ 2005 年 4 月 14 日下午 1:15：\n\n   ```\n   var myDate = new Date(2005,03,14,13,15,00);\n\
  \   ```\n\n2. 输入 `document.cookie` 后跟等号，开始为 `document.cookie` 对象赋值：\n\n   ```\n\
  \   document.cookie =\n   ```\n\n3. 输入一个开头的双引号，后跟 Cookie 的名称，再跟一个等号。在此例中，名称为 `myCookie`：\n\
  \n   ```\n   document.cookie = \"myCookie=\n   ```\n\n4. 关闭双引号，并输入一个加号：\n\n   ```\n\
  \   document.cookie = \"myCookie=\" +\n   ```\n\n5. 输入要赋给 Cookie 的值作为 `escape` 函数的参数，并在\
  \ `escape` 函数后跟一个加号。在此例中，Cookie 的值为“This is my Cookie”：\n\n   ```\n   document.cookie\
  \ = \"myCookie=\" + escape(\"This is my Cookie\") +\n   ```\n\n6. 输入一个开头的双引号，后跟一个分号，再跟\
  \ `expires`，然后跟一个等号、一个闭双引号，再跟另一个加号：\n\n   ```\n   document.cookie = \"myCookie=\"\
  \ + escape(\"This is my Cookie\") + \";expires=\" +\n   ```\n\n   ![Image 383](img/index-332_1.jpg)\n\
  \n7. 输入 `myDate.toGMTString()`，将指定的日期和时间作为格式正确的字符串添加到 Cookie 中，并以分号结束命令。你的代码现在应如清单\
  \ 149-1 所示。\n\n   ```\n   <head>\n   <script language=\"JavaScript\">\n   var myDate\
  \ = new Date(2005,03,14,13,15,00);\n   document.cookie = \"myCookie=\" + escape(\"\
  This is my Cookie\") + \";expires=\" + myDate.toGMTString();\n   </script>\n   </head>\n\
  \   ```\n\n   **清单 149-1：** 在 JavaScript 中创建 Cookie。\n\n8. 为了测试，你可以使用 `window.alert`\
  \ 方法在简单对话框中显示相同的字符串，从而查看赋给 `document.cookie` 对象的确切字符串。结果如图 149-1 所示。\n\n   ```\n\
  \   <head>\n   <script language=\"JavaScript\">\n   var myDate = new Date(2005,03,14,13,15,00);\n\
  \   document.cookie = \"myCookie=\" + escape(\"This is my Cookie\") + \";expires=\"\
  \ + myDate.toGMTString();\n   window.alert(\"myCookie=\" + escape(\"This is my Cookie\"\
  ) + \";expires=\" + myDate.toGMTString());\n   </script>\n   </head>\n   ```\n\n\
  \   **图 149-1：** 在对话框中显示 Cookie。\n\n***提示***\n- 创建日期时，请记住在 JavaScript 中月份从 0 开始编号。这意味着一月是月份\
  \ 0，二月是月份 1，三月是月份 2，四月是月份 3，依此类推（参见步骤 1）。\n\n### 任务 150：使用 Cookie 跟踪用户会话\n\nCookie\
  \ 的一个常见应用是在用户与网站的会话期间跟踪用户特定信息。这可能意味着跟踪用户的最新偏好选择、用户的搜索查询或会话 ID，从而允许你的脚本确定附加信息，以便为用户适当地显示页面。在所有情况下，会话在用户不活动一段时间后即被视为结束。\n\
  \n实现方法是设置一个带有过期日期和时间的 Cookie，该过期时间将使 Cookie 在会话应结束时失效。例如，如果会话在 20 分钟不活动后结束，则 Cookie\
  \ 的过期时间应设置为未来的 20 分钟。然后，在用户访问网站的每个页面上，会话 Cookie 应重置为新的未来 20 分钟过期时间。\n\n为此，请在 Web\
  \ 应用程序的每个页面开头包含以下代码；此示例是通用的，适用于任何需要在用户会话期间维护的单个 Cookie：\n\n1. 按照任务 147 中的说明获取 Cookie\
  \ 的名称和值；此处名称和值将存储在变量 `cookieName` 和 `cookieValue` 中：\n\n   ```\n   var newCookie\
  \ = document.cookie;\n   var cookieParts = newCookie.split(\"=\");\n   var cookieName\
  \ = cookieParts[0];\n   var cookieValue = unescape(cookieParts[1]);\n   ```\n\n\
  2. 创建一个新的 `Date` 对象，但不要设置日期。此处将 `Date` 对象赋值给变量 `newDate`：\n\n   ```\n   var newDate\
  \ = new Date();\n   ```\n\n3. 将过期日期设置为未来的适当分钟数。通过使用 `newDate` 对象的 `setTime` 方法来实现。该方法以毫秒数作为时间参数。要设置未来的时间，请使用\
  \ `getTime` 方法获取当前时间，然后加上毫秒数。例如，20 分钟等于 1200000 毫秒：\n\n   ```\n   newDate.setTime(newDate.getTime()\
  \ + 1200000);\n   ```\n\n4. 输入 `document.cookie` 后跟等号，开始为 `document.cookie` 对象赋值：\n\
  \n   ```\n   document.cookie =\n   ```\n\n5. 输入 `cookieName` 后跟一个加号，再跟一个用引号括起来的等号：\n\
  \n   ```\n   document.cookie = cookieName + \"=\"\n   ```\n\n6. 输入一个加号，后跟以 `cookieValue`\
  \ 为参数的 `escape` 函数，再跟一个加号：\n\n   ```\n   document.cookie = cookieName + \"=\" +\
  \ escape(cookieValue) +\n   ```\n\n7. 输入一个开头的双引号，后跟一个分号，再跟 `expires`；然后跟一个等号、一个闭双引号，再跟另一个加号：\n\
  \n   ```\n   document.cookie = cookieName + \"=\" + escape(cookieValue) + \";expires=\"\
  \ +\n   ```\n\n8. 输入 `newDate.toGMTString()`，将指定的日期和时间作为格式正确的字符串添加到 Cookie 中，并以分号结束命令。你的\
  \ JavaScript 代码应如清单 150-1 所示。\n\n   ```\n   <head>\n   <script language=\"JavaScript\"\
  >\n   var newCookie = document.cookie;\n   var cookieParts = newCookie.split(\"\
  =\");\n   var cookieName = cookieParts[0];\n   var cookieValue = unescape(cookieParts[1]);\n\
  \   var newDate = new Date();\n   newDate.setTime(newDate.getTime() + 1200000);\n\
  \   document.cookie = cookieName + \"=\" + escape(cookieValue) + \";expires=\" +\
  \ newDate.toGMTString();\n   </script>\n   </head>\n   ```\n\n   **清单 150-1：** 在应用程序的每个页面开头创建新的会话\
  \ Cookie。\n\n***交叉引用***\n- 任务 47 讨论了使用 `Date` 对象获取和显示当前日期。\n- 任务 146 讨论了 Cookie\
  \ 的创建以及 `document.cookie` 对象的使用。\n\n\n\n\n\n## 第 6 部分\n\n### 使用 Cookie 统计页面访问次数\n\
  \nCookie 的一个用途是提供个人页面计数器。这与全局访问计数器不同，后者显示任何访问者对网站的访问总次数。而个人访问计数器则显示用户个人的访问次数。方法很简单：创建一个具有较长过期时间的\
  \ Cookie，每次用户访问页面时，读取该 Cookie，将其值加 1，显示该值，然后使用新的过期时间重新保存 Cookie。\n\n以下使用名为`myHits`的\
  \ Cookie 生成一个个人访问计数器：\n\n1. 在页面开头创建一个脚本块，以开始脚本标签开头：\n\n   ```javascript\n   <script\
  \ language=\"JavaScript\">\n   ```\n\n2. 按照任务 147 所述获取 Cookie 的名称和值；此处名称和值将存储在变量`cookieName`和`cookieValue`中：\n\
  \n   ```javascript\n   var newCookie = document.cookie;\n   var cookieParts = newCookie.split(\"\
  =\");\n   var cookieName = cookieParts[0];\n   var cookieValue = unescape(cookieParts[1]);\n\
  \   ```\n\n3. 将 Cookie 值赋给名为`previousCount`的变量：\n\n   ```javascript\n   var previousCount\
  \ = cookieValue;\n   ```\n\n4. 使用`if`语句检查`cookieName`是否不是`myHits`，或者`cookieValue`是否为空值（换句话说，不存在\
  \ Cookie），如果任一条件为真，则将`previousCount`设置为零：\n\n   ```javascript\n   if (cookieName\
  \ != \"myHits\" || cookieValue == null) {\n       previousCount = 0;\n   }\n   ```\n\
  \n5. 将`previousCount`的值加 1，并将其赋给变量`newCount`：\n\n   ```javascript\n   var newCount\
  \ = parseInt(previousCount) + 1;\n   ```\n\n6. 创建一个新的`Date`对象，但不设置日期。此处将`Date`对象赋给变量`newDate`：\n\
  \n   ```javascript\n   var newDate = new Date();\n   ```\n\n7. 将过期时间设置为未来适当的分钟数。通过使用`newDate`对象的`setTime`方法来实现。该方法以毫秒数作为时间参数。要设置未来的时间，先用`getTime`方法获取当前时间，然后加上毫秒数。例如，30\
  \ 天等于 30 天乘以每天 24 小时乘以每小时 60 分钟乘以每分钟 60 秒乘以每秒 1000 毫秒，即 2592000000 毫秒：\n\n   ```javascript\n\
  \   newDate.setTime(newDate.getTime() + 2592000000);\n   ```\n\n8. 通过将`newCount`的值赋给`document.cookie`对象，并指定`newDate`中的过期时间来重置\
  \ Cookie。（此过程已在任务 149 中描述。）\n\n   ```javascript\n   document.cookie = \"myHits=\"\
  \ + newCount + \";expires=\" + newDate.toGMTString();\n   ```\n\n9. 使用结束脚本标签关闭脚本块，使生成的脚本块如清单\
  \ 151-1 所示。\n\n   **清单 151-1：** 在页面开头递增并重新保存计数器 Cookie。\n\n   ```javascript\n  \
  \ <script language=\"JavaScript\">\n   var newCookie = document.cookie;\n   var\
  \ cookieParts = newCookie.split(\"=\");\n   var cookieName = cookieParts[0];\n \
  \  var cookieValue = unescape(cookieParts[1]);\n   var previousCount = cookieValue;\n\
  \   if (cookieName != \"myHits\" || cookieValue == null) {\n       previousCount\
  \ = 0;\n   }\n   var newCount = parseInt(previousCount) + 1;\n   var newDate = new\
  \ Date();\n   newDate.setTime(newDate.getTime() + 2592000000);\n   document.cookie\
  \ = \"myHits=\" + newCount + \";expires=\" + newDate.toGMTString();\n   </script>\n\
  \   ```\n\n10. 在正文中，当需要显示当前计数时，创建一个新的脚本块，并使用`document.write`方法显示`newCount`变量的值。你将在浏览器中看到结果。\n\
  \n    ```javascript\n    <script language=\"JavaScript\">\n    document.write(\"\
  您已访问此页面 \" + newCount + \" 次。\");\n    </script>\n    ```\n\n***交叉引用***\n- 任务 9\
