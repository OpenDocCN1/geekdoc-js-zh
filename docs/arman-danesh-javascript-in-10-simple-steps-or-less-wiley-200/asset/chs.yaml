  \n### 任务 193：检测窗口大小\n\n使用 JavaScript，你可以确定浏览器窗口工作区域的尺寸。具体方法取决于你使用的浏览器：\n\n- 在 Netscape\
  \ 6 及更高版本中，`window.innerHeight` 属性表示浏览器窗口工作区域的高度（以像素为单位）。类似地，`window.innerWidth`\
  \ 表示宽度。\n- 在 Internet Explorer 中，`document.body.clientHeight` 属性表示高度（以像素为单位）。类似地，`document.body.clientWidth`\
  \ 属性表示宽度。\n\n> **注意：** 在第 4 步中，你可以看到一个简写条件求值的示例。其形式为 `(condition) ? value if true\
  \ : value if false`。此示例中的条件表达的意思是：“如果 `window.innerWidth` 存在，则将该值赋给 `width`；否则，将\
  \ `document.body.clientWidth` 赋给 `width`。”\n\n以下任务展示了如何在浏览器窗口中显示此信息：\n\n1. 在你喜欢的编辑器中创建一个新的\
  \ HTML 文档。\n\n2. 在文档的主体中，包含一些介绍性文本：\n\n   ```html\n   <body>\n   The window has\
  \ the following dimensions:\n   </body>\n   ```\n\n3. 在介绍性文本之后创建一个脚本块：\n\n   ```html\n\
  \   <script language=\"JavaScript\">\n   </script>\n   ```\n\n4. 在脚本中，创建一个名为 `width`\
  \ 的变量，并将窗口的宽度赋给它：\n\n   ```javascript\n   var width = (window.innerWidth) ? window.innerWidth\
  \ : document.body.clientWidth;\n   ```\n\n5. 接下来，创建名为 `height` 的变量，并将窗口的高度赋给它：\n\
  \n   ```javascript\n   var height = (window.innerHeight) ? window.innerHeight :\
  \ document.body.clientHeight;\n   ```\n\n6. 最后，使用 `document.write` 方法在浏览器窗口中显示尺寸。最终页面应如清单\
  \ 193-1 所示。\n\n   ```html\n   <body>\n   The window has the following dimensions:\n\
  \   <script language=\"JavaScript\">\n   var width = (window.innerWidth) ? window.innerWidth\
  \ : document.body.clientWidth;\n   var height = (window.innerHeight) ? window.innerHeight\
  \ : document.body.clientHeight;\n   document.write(width + \" by \" + height + \"\
  \ pixels\");\n   </script>\n   </body>\n   ```\n\n   **清单 193-1：** 获取浏览器的尺寸。\n\n\
  7. 保存文件并关闭。\n\n8. 在浏览器中打开文件，你现在会看到窗口的尺寸，如图 193-1 所示。\n\n   *提示*：你可以使用本任务中提供的信息来做一些有趣的事情。例如，利用任务\
