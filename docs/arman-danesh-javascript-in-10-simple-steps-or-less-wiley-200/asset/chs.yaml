  ;\n```\n\n以下步骤展示了如何创建这个小书签：\n\n1. 打开你通常用于编写 JavaScript 的文本编辑器。\n2. 将空字符串赋值给 `document.body.background`\
  \ 属性：\n   ```\n   document.body.background = '';\n   ```\n3. 将上一条命令包含在 `void` 语句中；否则，浏览器在将空字符串赋值给\
  \ `document.body.background` 属性后会尝试显示该空字符串，这将导致一个空白页面替换当前页面：\n   ```\n   void(document.body.background\
  \ = '');\n   ```\n4. 移除脚本中的空白空格，并在脚本开头添加 `javascript:` 协议，使结果成为一行 URL，并移除所有多余空格：\n\
  \   ```\n   javascript:void(document.body.background='');\n   ```\n5. 使用此代码作为 URL\
  \ 创建书签或收藏夹。要测试该小书签，请在浏览器中打开一个包含背景图片的网页，如图 235-1 所示。选择你创建的新书签或收藏夹，背景图片消失，如图 235-2\
