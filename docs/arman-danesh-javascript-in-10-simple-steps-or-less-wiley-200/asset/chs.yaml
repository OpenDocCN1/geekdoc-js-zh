  \ 任务 77：显示随机横幅广告\n\n### 任务 57：在 JavaScript 中访问 HTML 嵌入的图像\n\nJavaScript 使得访问和操作\
  \ HTML 页面中的图像变得非常容易。在 JavaScript 中访问图像是通过 `Image` 对象完成的。对于你在 HTML 代码中包含的每个图像，都会创建一个\
  \ `Image` 对象。你可以通过 `document` 对象的 `images` 数组或直接按名称访问这些 `Image` 对象。\n\n***注释***\n\
  \n• `images` 数组包含每个图像的条目，顺序与代码中指定的顺序相同。因此，第一个图像的对象是 `document.images[0]`，第二个是 `document.images[1]`，依此类推。\n\
  \n如果你使用 `img` 标签的 `name` 属性为图像指定了名称，那么你可以直接引用该图像为 `document.imageName`。例如，考虑 HTML\
  \ 文档中的以下图像：\n\n```html\n<img src=”myImage.jpg” name=”myImage”>\n```\n\n你可以在 JavaScript\
  \ 中通过 `document.myImage` 引用它。\n\n\n\n\n\n## 图像与鼠标悬停效果\n\n每个 `Image` 对象都拥有众多属性，可用于获取图像的相关信息。这些属性包括\
  \ `height`（图像的高度，以像素为单位）、`width`（图像的宽度，以像素为单位）、`src`（`img` 标签中 `src` 属性的值）、`hspace`（图像水平内边距的大小，以像素为单位）以及\
  \ `vspace`（图像垂直内边距的大小，以像素为单位）。\n\n以下任务演示了如何使用这些属性来显示图像，并提供链接以在对话框中显示图像的宽度和高度：\n\n\
  **1.** 使用 `img` 标签在页面中包含一张图像；通过 `name` 属性将图像命名为 `myImage`：\n\n```\n<img src=\"image1.jpg\"\
  \ name=\"myImage\">\n```\n\n**2.** 添加一个用于显示宽度的链接，并在 `a` 标签中添加 `onClick` 事件处理程序；该事件处理程序将使用\
  \ `window.alert` 方法在对话框中显示图像的宽度。注意，通过引用 `document.myImage.width` 来获取图像的宽度：\n\n```\n\
  <a href=\"#\" onClick=\"window.alert(document.myImage.width)\">宽度</a><br>\n```\n\
  \n**3.** 添加一个用于显示高度的链接，并在 `a` 标签中添加 `onClick` 事件处理程序；该事件处理程序将使用 `window.alert` 方法在对话框中显示图像的高度。注意，通过引用\
  \ `document.myImage.height` 来获取图像的高度。根据需要添加任何 HTML 布局代码，最终代码可能如下所示：\n\n```\n<img\
  \ src=\"image1.jpg\" name=\"myImage\">\n<br>\n<a href=\"#\" onClick=\"window.alert(document.myImage.width)\"\
  >宽度</a><br>\n<a href=\"#\" onClick=\"window.alert(document.myImage.height)\">高度</a>\n\
  ```\n\n**4.** 将代码保存为 HTML 文件，并在 Web 浏览器中打开；你应该会看到一个包含用于显示宽度和高度的链接的页面。\n\n**5.**\
  \ 点击“宽度”链接，将出现如图 57-1 所示的对话框。\n\n***提示***  \n• 利用 JavaScript 操作图像的能力，你可以实现许多不同的效果。这些效果包括动态更改图像以创建幻灯片、在图像上创建鼠标悬停效果，甚至使用\
