  \ 262：使用 X 控制堆叠顺序\n\n任务 260 中介绍的 `X` 跨浏览器函数库简化了控制页面元素（如图层）堆叠顺序的过程。\n\n使用 `X` 库更改元素的堆叠顺序需要两个步骤：\n\
  \n**1.** 在文档的头部包含 `x.js` 脚本库文件。\n\n***注意***\n\n**2.** 使用 `xZIndex` 函数指定新的堆叠顺序值：\n\
  \n- 堆叠顺序应为整数值；数值较小的元素堆叠在数值较大的元素下方。\n\n`xZIndex(\"元素 ID\", 堆叠顺序值);`\n\n以下任务演示了如何使用此函数显示两个重叠的图层，然后提供链接供用户选择将哪个图层显示在堆叠顶部：\n\
  \n**1.** 在你偏好的编辑器中创建一个新文档。\n\n**2.** 在文档的头部，包含 `x.js` 脚本库文件：\n\n```html\n<script\
  \ language=\"JavaScript\" src=\"x.js\"></script>\n```\n\n**3.** 在文档的主体中，创建一个 ID\
  \ 为 `firstLayer` 的图层。该图层应包含一个链接，该链接调用 `xZIndex` 两次，为两个图层设置适当的堆叠顺序：\n\n```html\n\
  <div id=\"firstLayer\" style=\"position: absolute; width: 100px; height: 100px;\
  \ left: 10px; top: 10px; background-color: lightgrey; z-index: 1;\">\n  <a href=\"\
  #\" onClick=\"xZIndex('firstLayer',2);xZIndex('secondLayer',1); return false;\"\
  >移至顶层</a>\n</div>\n```\n\n**4.** 创建另一个与第一个图层重叠的图层，ID 为 `secondLayer`。该图层应包含一个链接，该链接调用\
  \ `xZIndex` 两次，为两个图层设置适当的堆叠顺序。最终页面应如清单 262-1 所示。\n\n**5.** 保存文件并关闭。\n\n**6.** 在浏览器中打开该文件。你应该会看到两个包含链接的图层，如图\
  \ 262-1 所示。\n\n**7.** 点击“移至顶层”链接，底部的图层应移动到顶部。\n\n```html\n<head>\n  <script language=\"\
  JavaScript\" src=\"x.js\"></script>\n</head>\n<body>\n  <div id=\"firstLayer\" style=\"\
  position: absolute; width: 100px; height: 100px; left: 10px; top: 10px; background-color:\
  \ lightgrey; z-index: 1;\">\n    <a href=\"#\" onClick=\"xZIndex('firstLayer',2);xZIndex('secondLayer',1);\
  \ return false;\">移至顶层</a>\n  </div>\n  <div id=\"secondLayer\" style=\"position:\
  \ absolute; width: 100px; height: 100px; left: 60px; top: 60px; background-color:\
  \ yellow; z-index: 2;\">\n    <a href=\"#\" onClick=\"xZIndex('secondLayer',2);xZIndex('firstLayer',1);\
  \ return false;\">移至顶层</a>\n  </div>\n</body>\n```\n\n**清单 262-1:** 使用 `xZIndex`。\n\
