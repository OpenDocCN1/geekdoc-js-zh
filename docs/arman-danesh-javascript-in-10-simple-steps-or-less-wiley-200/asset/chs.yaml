  \ 10:33 AM Page 290\n\n**290**\n\n## 第 5 部分\n\n#### 任务 141：使用嵌套框架\n\n本书这一部分中所有关于框架的示例都涉及单层框架。也就是说，窗口要么被分成行，要么被分成列，仅此而已。但可以嵌套框架集。例如，首先考虑一个简单的框架集：\n\
  \n```\n<frameset cols=\"50%,*\">\n<frame src=\"frame1.html\" name=\"frame1\">\n\
  <frame src=\"frame2.html\" name=\"frame2\">\n</frameset>\n```\n\n这会创建两个简单的垂直框架。但如果你希望右侧框架进一步分成两个水平框架呢？这可以通过将\
  \ `frame2.html` 本身变成一个框架集来实现：\n\n```\n<frameset rows=\"50%,*\">\n<frame src=\"subframe1.html\"\
  \ name=\"subframe1\">\n<frame src=\"subframe2.html\" name=\"subframe2\">\n</frameset>\n\
  ```\n\n一旦开始以这种方式嵌套框架集，使用 JavaScript 在框架之间进行交叉引用的工作就比在简单的单层框架集中更复杂了。例如，要从 `frame1`\
  \ 引用 `subframe2`，你需要使用以下代码：\n\n```\nparent.frame2.subframe2\n```\n\n本任务演示了创建如上所述的嵌套框架布局的步骤。在\
  \ `subframe2` 中，你将放置一个名为 `doAlert` 的函数，然后在 `frame1` 中提供一个链接，供用户调用该函数。\n\n1. 为顶层框架集创建一个新文档。在该文档中，创建一个包含两个垂直框架的框架集，分别命名为\
  \ `frame1` 和 `frame2`：\n\n```\n<frameset cols=\"50%,*\">\n<frame src=\"frame1.html\"\
  \ name=\"frame1\">\n<frame src=\"frame2.html\" name=\"frame2\">\n</frameset>\n```\n\
  \n2. 保存文件并关闭。\n\n3. 为 `frame1.html` 创建一个新文档。在该文档的正文中放置一个链接，用于调用 `subframe2` 中的 `doAlert`\
  \ 函数：\n\n```\n<body>\n这是 frame1。\n<a href=\"#\" onClick=\"parent.frame2.subframe2.doAlert();\"\
  >点击查看来自 subframe2 的提示。</a>\n</body>\n```\n\n![Image 342](img/index-314_1.jpg)\n\n\
  06 542419 Ch05.qxd 11/19/03 10:33 AM Page 291\n\n**操作浏览器窗口**\n\n**291**\n\n4. 保存文件并关闭。\n\
  \n5. 为 `frame2.html` 创建一个新文档。在该文档中，为右侧框架中的嵌套水平框架创建一个框架集，并将框架命名为 `subframe1` 和 `subframe2`：\n\
  \n```\n<frameset rows=\"50%,*\">\n<frame src=\"subframe1.html\" name=\"subframe1\"\
  >\n<frame src=\"subframe2.html\" name=\"subframe2\">\n</frameset>\n```\n\n> **提示**\
  \  \n> - 实际上，对于框架的嵌套层数没有理论上的限制。但存在实际限制；例如，在小窗口中列数过多会导致列变得太窄而无法显示任何内容。  \n> - 如果有多个嵌套层，你可以将语法扩展为\
  \ `parent.parent.frameX.subframeX.subsubframeX`，依此类推，具体取决于嵌套深度以及你从哪个框架进行引用和引用哪个框架。\n\
  \n6. 保存文件并关闭。\n\n7. 为 `subframe1.html` 创建一个新文档，并包含要在该框架中显示的任何内容：\n\n```\n<body>\n\
  这是 subframe1。\n</body>\n```\n\n8. 保存文件并关闭。\n\n9. 为 `subframe2.html` 创建一个新文档。在文档的头部，创建一个包含函数\
  \ `doAlert` 的脚本块，该函数向用户显示一个警告对话框，指示其执行所在的框架：\n\n```\n<head>\n<script language=\"\
  JavaScript\">\nfunction doAlert() { window.alert(\"这是 subframe2。\"); }\n</script>\n\
  </head>\n<body>\n这是 subframe2。\n</body>\n```\n\n10. 保存文件并关闭。在浏览器中打开顶层框架集，你将看到框架布局。如果用户单击左侧框架中的链接，将看到如图\
  \ 141-1 所示的对话框。\n\n**图 141-1：** 在嵌套框架中调用函数。\n\n06 542419 Ch05.qxd 11/19/03 10:33\
  \ AM Page 292\n\n**292**\n\n## 第 5 部分\n\n#### 任务 142：从链接更新多个框架\n\n如果你有一个包含多个框架的框架集布局，你可能希望当用户单击链接时，多个框架能够更新。在这种情况下，无法使用简单的链接同时将两个\
  \ URL 定位到两个框架。相反，需要利用 JavaScript 通过设置每个框架的 `document.location` 属性来将 URL 加载到框架中。本任务演示如何构建一个包含三个水平框架的框架集。顶部框架中的链接会导致新文档加载到两个底部框架中。\n\
  \n> **注意**  \n> - 通常，如果你想使用一个框架中的链接导致另一个框架加载新文档，可以使用 `a` 标签的 `target` 属性来指定 URL\
