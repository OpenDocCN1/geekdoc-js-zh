  - 任务 91 至 94 介绍了处理复选框的多种方法。\n\n**图 104-2：** 验证用户的选择。\n\n### 任务 105：验证密码\n\n在某些情况下，验证表单时可能需要测试用户提供的密码。一种常见的方法是要求用户两次输入指定长度的密码，以确保其输入正确。\n\
