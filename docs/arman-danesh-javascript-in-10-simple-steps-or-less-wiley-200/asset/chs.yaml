  \ 文件：\n\n```\n<body>\n<script language=\"JavaScript\" src=\"4a.js\"></script>\n\
  </body>\n```\n\n> **提示：** 约定是使用 `.js` 扩展名来命名 JavaScript 文件。\n\n9. 保存文件并关闭它。\n\n\
