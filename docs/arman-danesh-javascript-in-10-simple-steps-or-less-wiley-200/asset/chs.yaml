  \n### 任务 138：使用框架存储伪持久数据\n\n通常，如果你在某个框架的文档中使用 JavaScript 代码存储变量，当用户离开该文档并导航到该框架中的另一个文档时，变量会丢失。\n\
  \n**注意：**\n\n- 在使用框架时，能够以某种方式在 JavaScript 变量中存储信息通常很有用，这样即使用户在窗口中的任何框架中的文档之间导航，这些变量仍然可用。\n\
  \n- 幸运的是，使用框架，你有一个文档即使在用户在单个框架中的文档之间导航时也持续存在。这个持久文档就是框架集文档本身。\n\n- 由于框架集文档是一个 HTML\
  \ 文档，你可以像其他文档一样在其中使用 JavaScript，因此可以创建变量。\n\n然而，考虑一个包含两个框架的框架集。在这种情况下，有三个文档：框架集文档和每个框架中加载的两个文档。无论用户如何在两个文档中导航，框架集文档都会持续存在。从单个框架中的代码引用框架集中的变量很简单：\n\
  \n`parent.variableName`\n\n本示例通过创建一个框架集并在其中定义一个变量，说明了框架集文档中持久变量的使用。在左侧框架中，你显示一个文档，该文档仅使用\
  \ JavaScript 输出持久变量。在右侧框架中，你显示一个带有链接的文档，该链接将用户带到另一个输出持久变量的文档：\n\n1. 创建一个新的 HTML\
  \ 文档来容纳框架集。以脚本块开始文档，并在脚本中设置一个名为`persistentVariable`的变量，其内容为你选择的文本：\n\n   ```\n \
  \  <script language=\"JavaScript\">\n   var persistentVariable = \"This is a persistent\
  \ value\";\n   </script>\n   ```\n\n\n\n\n其中有一些变量不会受到导航的影响。\n\n2. 按照脚本，创建一个包含两个垂直框架的框架集。在左侧框架中加载一个文档，在右侧框架中加载另一个文档；稍后你将创建这些文档。最终页面如下所示：\n\
  \n```html\n<script language=”JavaScript”>\nvar persistentVariable = “This is a persistent\
  \ value”;\n</script>\n\n<frameset cols=”50%,*”>\n<frame name=”frame1” src=”138a.html”>\n\
  <frame name=”frame2” src=”138b.html”>\n</frameset>\n```\n\n3. 保存文件并关闭。创建一个新的 HTML\
  \ 文件，用于加载到左侧框架中。在文档的 `<body>` 中，创建一个脚本，并使用 `document.write` 方法输出框架集中的 `persistentVariable`\
  \ 值：\n\n```html\n<body>\nThis is frame 1. The persistent variable contains:\n<p>\n\
  <script language=”JavaScript”>\ndocument.write(parent.persistentVariable);\n</script>\n\
  </body>\n```\n\n4. 将文件保存到框架集中为左侧框架指定的位置，然后关闭。创建一个新的 HTML 文件，用于初始加载到右侧框架中。文档的 `<body>`\
  \ 应仅包含一个指向第三个文档的链接：\n\n```html\n<body>\nThis is frame 2.\n<a href=”138c.html”>Click\
  \ here</a> to load a new document in this frame\n</body>\n```\n\n5. 将文件保存到框架集中为右侧框架指定的位置，然后关闭。创建一个新的\
  \ HTML 文件，当用户点击右侧框架中的链接时显示该文件。文档的 `<body>` 应与左侧框架中加载的文档类似，并使用 `document.write` 方法显示持久变量：\n\
  \n```html\n<body>\nThis is a new document in frame 2. The persistent variable contains:\n\
  <p>\n<script language=”JavaScript”>\ndocument.write(parent.persistentVariable);\n\
  </script>\n</body>\n```\n\n6. 将文件保存到步骤 4 中链接指定的位置，然后关闭文件。\n\n7. 在浏览器中打开框架集。初始时，左侧框架中显示持久变量，右侧框架中显示一个链接。当用户点击右侧框架中的链接时，该变量的值也会显示在那里，如图\
