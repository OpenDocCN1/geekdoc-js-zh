  ```\n\n7. 使用这段代码作为 URL 创建一个书签。要测试该书签小工具，请在浏览器中打开一个网页并选中一些文本，如图 232-1 所示。选择你创建的新书签，你的电子邮件客户端应会打开，并将邮件正文设置为选中的文本，如图\
