  \n# 第 6 部分：操作 Cookie\n\n- 任务 146：在 JavaScript 中创建 Cookie\n- 任务 147：在 JavaScript\
  \ 中访问 Cookie\n- 任务 148：显示 Cookie\n- 任务 149：控制 Cookie 的过期时间\n- 任务 150：使用 Cookie 跟踪用户会话\n\
  - 任务 151：使用 Cookie 统计页面访问次数\n- 任务 152：删除 Cookie\n- 任务 153：创建多个 Cookie\n- 任务 154：访问多个\
  \ Cookie\n- 任务 155：使用 Cookie 为新访客呈现不同的首页\n- 任务 156：创建 Cookie 函数库\n- 任务 157：允许 Cookie\
  \ 在网站的所有页面中可见\n\n### 任务 146：在 JavaScript 中创建 Cookie\n\nJavaScript Cookie 存储在 `document.cookie`\
  \ 对象中，并通过给该对象赋值来创建。创建 Cookie 时，通常需要指定该 Cookie 的名称、值和过期日期与时间。此后，每次用户返回你的网站时，你的脚本都可以访问该\
  \ Cookie，直到 Cookie 过期。每次用户请求你网站上的页面时，这些 Cookie 也会被发送到你的服务器。\n\n***注释***\n- 通常，Cookie\
  \ 是由服务器在浏览器中设置的简单变量，并在浏览器每次访问同一服务器上的页面时返回给服务器。它们通常用于在用户会话期间跨页面携带持久信息，或在用户会话之间记住数据。不过，使用\
  \ JavaScript，你可以在客户端创建和读取 Cookie，而无需任何服务器端编程。\n- `escape` 函数接受一个字符串，并对 URL 中无效的任何字符进行转义。转义涉及用百分号后跟数字代码替换该字符。例如，空格变为\
  \ `%20`（参见步骤 5）。\n\n创建 Cookie 的最简单方法是向 `document.cookie` 对象分配一个字符串值，如下所示：\n```\n\
  name=value;expires=date\n```\n其中 name 是你分配给 Cookie 的名称，以便以后访问时可以引用它。value 是任何文本字符串，已像要出现在\
  \ URL 中一样被转义（在 JavaScript 中，你可以使用 `escape` 函数进行转义）。\n\n以下步骤概述了如何在 JavaScript 中创建新的\
  \ Cookie：\n\n**1.** 在新文档的头部，创建一个带有开始和结束脚本标签的脚本块：\n```\n<head>\n<script language=\"\
  JavaScript\">\n</script>\n</head>\n```\n**2.** 在脚本中，输入 `document.cookie` 后跟等号，开始为\
  \ `document.cookie` 对象赋值：\n```\ndocument.cookie =\n```\n**3.** 输入一个开头的双引号，后跟 Cookie\
  \ 的名称，再跟一个等号。在本例中，名称为 `myCookie`：\n```\ndocument.cookie = \"myCookie=\n```\n**4.**\
  \ 关闭双引号，并输入一个加号：\n```\ndocument.cookie = \"myCookie=\" +\n```\n**5.** 输入要分配给 Cookie\
  \ 的值，作为 `escape` 函数的参数。在本例中，Cookie 的值为 \"This is my Cookie\"：\n```\ndocument.cookie\
  \ = \"myCookie=\" + escape(\"This is my Cookie\")\n```\n**6.** 输入分号结束命令。最终结果是你将得到类似清单\
  \ 146-1 中的 JavaScript 代码。\n```\n<head>\n<script language=\"JavaScript\">\n```\n\
  ![图 379](img/index-326_1.jpg)\n\n\n\n\n\n### 任务 146：创建 Cookie\n\n```javascript\n\
  document.cookie = \"myCookie=\" + escape(\"This is my Æ\nCookie\");\n</script>\n\
  </head>\n```\n\n**清单 146-1：** 创建 Cookie。\n\n**7.** 出于测试目的，你可以通过使用 `window.alert`\
  \ 方法在简单对话框中显示相同的字符串，来查看你分配给 `document.cookie` 对象的确切字符串。结果如图 146-1 所示。\n\n```javascript\n\
  <head>\n<script language=\"JavaScript\">\ndocument.cookie = \"myCookie=\" + escape(\"\
  This is my Æ\nCookie\");\nwindow.alert(\"myCookie=\" + escape(\"This is my\nÆ\n\
  Cookie\"));\n</script>\n</head>\n```\n\n**图 146-1：** 在对话框中显示 Cookie。\n\n***交叉引用***\n\
  \n- 任务 25 讨论了使用 `window.alert` 方法创建警告对话框。该方法接受一个字符串参数。在此例中，你通过连接两个字符串来构建一个字符串。\n\
  \n### 任务 147：在 JavaScript 中访问 Cookie\n\n如果当前文档关联了一个单独的 Cookie，那么 `document.cookie`\
  \ 对象会包含一个包含该 Cookie 所有详细信息的字符串。一个典型的 `document.cookie` 字符串如下所示：`myCookie=This%20is%20my%20Cookie`\n\
  \n***注意***\n\n你可能已经注意到，其中没有显示过期日期。当你访问 `document.cookie` 对象时，只有当该站点存在一个尚未过期的 Cookie\
  \ 时，它才会包含该 Cookie。这一判断在后台自动处理，无需在 `document.cookie` 对象返回的字符串中包含实际的过期日期。\n\n- Cookie\
  \ 只是浏览器存储的小型文本文件，在需要时返回给服务器或 JavaScript 脚本。有人抱怨 Cookie 会带来安全或隐私风险。Cookie 实际上并非安全风险，其隐私影响也存在争议。然而，对于任何跨越多个页面的\
  \ Web 应用程序来说，它们非常有用（参见步骤 5）。\n\n要访问 Cookie，你需要使用 `String` 对象的 `split` 方法将名称和值分开，具体步骤如下：\n\
  \n**1.** 在一个新 HTML 文档的头部，创建一个带有开始和结束脚本标签的脚本块：\n\n```html\n<head>\n<script language=\"\
  JavaScript\">\n</script>\n</head>\n```\n\n**2.** 将 `document.cookie` 对象赋值给一个新变量。在此例中，该对象被赋值给字符串\
  \ `newCookie`：\n\n```javascript\nvar newCookie = document.cookie;\n```\n\n**3.**\
  \ 在等号处拆分 Cookie，并将结果数组赋值给一个新变量。你可以使用 `String` 对象的 `split` 方法，该方法接受一个字符作为参数，该字符作为分隔符用于拆分字符串。拆分后的字符串部分以数组形式返回。在此例中，数组存储在名为\
  \ `cookieParts` 的变量中：\n\n```javascript\nvar cookieParts = newCookie.split(\"=\"\
  );\n```\n\n**4.** 将数组中的第一个条目赋值给一个变量；该条目包含 Cookie 的名称。在此例中，名称存储在变量 `cookieName` 中：\n\
  \n```javascript\nvar cookieName = cookieParts[0];\n```\n\n**5.** 将数组中的第二个条目赋值给一个变量；该条目包含\
  \ Cookie 的值。同时，使用 `unescape` 函数对字符串进行反转义。在此例中，最终结果是存储在 `cookieValue` 变量中的 Cookie\
  \ 值的反转义版本。生成的 JavaScript 代码如清单 147-1 所示。\n\n![Image 380](img/index-328_1.jpg)\n\
  ![Image 381](img/index-328_2.jpg)\n\n```javascript\n<head>\n<script language=\"\
  JavaScript\">\nvar newCookie = document.cookie;\nvar cookieParts = newCookie.split(\"\
  =\");\nvar cookieName = cookieParts[0];\nvar cookieValue = unescape(cookieParts[1]);\n\
  </script>\n</head>\n```\n\n**清单 147-1：** 将 Cookie 拆分为名称和值部分。\n\n**6.** 你可以通过使用 `window.alert`\
  \ 方法在简单对话框中依次显示每个变量来测试 Cookie 结果；这些对话框如图 147-1 和 147-2 所示。\n\n```javascript\n<head>\n\
  <script language=\"JavaScript\">\nvar newCookie = document.cookie;\nvar cookieParts\
  \ = newCookie.split(\"=\");\nvar cookieName = cookieParts[0];\nvar cookieValue =\
  \ unescape(cookieParts[1]);\nwindow.alert(cookieName);\nwindow.alert(cookieValue);\n\
  </script>\n</head>\n```\n\n**图 147-1：** 在对话框中显示 Cookie 名称。\n\n**图 147-2：** 在对话框中显示\
  \ Cookie 值。\n\n### 任务 148：显示 Cookie\n\nCookie 的一个常见用途是将值包含在正在显示的网页中。如果 Cookie 存储了用户的用户名，你可能希望显示一个登录表单，其中用户名字段已填入用户的用户名。以下通过创建一个简单的登录表单（包含用户名和密码两个字段）并在用户名字段中显示用户名（如果可用）来说明这一点。\n\
  \n用户名将存储在一个名为 `loginName` 的 Cookie 中（如果已设置）：\n\n***注意***\n\n- 如任务 146 所述，最好对 Cookie\
  \ 的名称和值进行转义，以移除 Cookie 中无效的字符。这意味着在访问 Cookie 时需要对其进行反转义，以便最终得到原始、预期的值，而不是包含多个转义字符的值。\n\
  \n**1.** 在页面正文开头的一个单独脚本块中，将 Cookie 值提取到两个变量中；有关此过程的总结，请参考任务 147。在此例中，Cookie 的名称存储在\
  \ `cookieName` 中，值存储在 `cookieValue` 中，脚本块应如清单 148-1 所示。\n\n```javascript\n<script\
  \ language=\"JavaScript\">\nvar newCookie = document.cookie;\nvar cookieParts =\
  \ newCookie.split(\"=\");\nvar cookieName = cookieParts[0];\nvar cookieValue = unescape(cookieParts[1]);\n\
  </script>\n```\n\n**清单 148-1：** 在单独的脚本块中提取 Cookie 的名称和值。\n\n**2.** 在脚本之后，输入一个表单标签以开始表单；确保表单提交到适当的位置进行处理：\n\
