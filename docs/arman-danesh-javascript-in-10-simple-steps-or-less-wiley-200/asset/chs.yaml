  \">\n```\n\n**3.** 将 `window.alert` 方法作为 `onClick` 属性的值，当鼠标指针移到图像上时显示一条消息：\n\n```html\n\
  <img src=\"image1.jpg\" onClick=\"window.alert('Clicked on Æ the Image');\">\n```\n\
