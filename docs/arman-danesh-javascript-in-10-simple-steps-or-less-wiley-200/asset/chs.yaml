  \n### 任务 226：当用户离开当前页面前往其他页面时执行代码\n\n### 任务 227：当用户在选项列表中进行选择时执行操作\n\n10 542419\
  \ Ch09.qxd 11/19/03 10:22 AM Page 454\n\n**454** **第 9 部分**\n\n### 任务 219：响应 onMouseOver\
  \ 事件\n\nJavaScript 提供了一种事件模型，允许你编写脚本以响应事件。这些事件处理程序由仅在事件发生时执行的 JavaScript 代码组成。大多数事件与用户在可见\
  \ HTML 页面上对元素执行的操作相关联，并且大多数事件处理程序可以通过 HTML 标签的属性来指定。\n\n***注意*** JavaScript 中常用的事件之一是\
  \ `onMouseOver` 事件。当用户将鼠标指针移动到页面中的某个元素（如链接或图像）上时，会触发此事件。通常将 `onMouseOver` 事件与图像一起使用。\n\
  \n事件处理程序的基本结构如下所示，以 `a` 标签为例：\n\n```\n<a href=\"some url\" onMouseOver=\"some JavaScript\"\
  >link text</a>\n```\n\n虽然你可以在 `onMouseOver` 属性中用逗号分隔多个 JavaScript 命令，但通常你会希望在文档的其他位置创建一个\
  \ JavaScript 函数，然后从 `onMouseOver` 属性中调用该函数，以保持 HTML 代码的简洁和易于理解。\n\n以下步骤在用户将鼠标悬停在\
  \ HTML 文档中的链接上时显示一个警告对话框：\n\n1. 使用 `script` 标签开始一个脚本块：\n\n   ```\n   <script language=\"\
  JavaScript\">\n   ```\n\n2. 启动一个名为 `doMouseOver` 的函数，该函数将在用户触发 `onMouseOver` 事件时被调用；该函数接受一个名为\
  \ `message` 的参数，该参数包含一个字符串，用于在警告对话框中显示：\n\n   ```\n   function doMouseOver(message)\
  \ {\n   ```\n\n3. 使用 `window` 对象的 `alert` 方法在警告对话框中显示消息：\n\n   ```\n   window.alert(message);\n\
  \   ```\n\n4. 用右花括号结束函数：\n\n   ```\n   }\n   ```\n\n![Image 538](img/index-478_1.jpg)\n\
  \n![Image 539](img/index-478_2.jpg)\n\n10 542419 Ch09.qxd 11/19/03 10:22 AM Page\
  \ 455\n\n**处理事件** **455**\n\n5. 使用结束的 `script` 标签关闭脚本块：\n\n   ```\n   </script>\n\
  \   ```\n\n6. 在 HTML 文档的主体中，向要触发 `onMouseOver` 事件的 `a` 标签添加一个 `onMouseOver` 属性。将属性的值设置为\
  \ `doMouseOver('You Rolled Over the Link')`，如下代码所示。图 219-1 显示了一个包含脚本块和指定了 `onMouseOver`\
  \ 事件的链接的简单文档。当鼠标移动到链接上时，会显示一个如图 219-2 所示的警告对话框。\n\n   ***提示*** `window.alert` 方法接受一个参数，该参数应为文本字符串。然后它会在一个对话框中显示该文本字符串（参见步骤\
  \ 6）。\n\n   ```\n   <a href=\"http://my.url/\" onMouseOver=\"doMouseOver('You Rolled\
  \ Over the Link')\">Roll Over this Link</a>\n   ```\n\n**图 219-1：** 为链接使用 `onMouseOver`\
  \ 事件。\n\n***交叉引用*** 有关如何创建警告对话框的信息，请参阅任务 25。\n\n**图 219-2：** 当用户将鼠标移动到链接上时显示警告对话框。\n\
  \n![Image 540](img/index-479_1.jpg)\n\n![Image 541](img/index-479_2.jpg)\n\n10 542419\
  \ Ch09.qxd 11/19/03 10:22 AM Page 456\n\n**456** **第 9 部分**\n\n### 任务 220：当用户点击对象时执行操作\n\
  \n使用 JavaScript 事件模型，你可以在用户点击对象时运行 JavaScript 代码。这是通过使用 `onClick` 事件处理程序实现的。`onClick`\
  \ 事件处理程序通常用于表单按钮和链接，但也可以应用于其他对象。\n\n***注意*** 当你在链接中使用 `onClick` 事件时，如果你希望用户跟随链接，事件处理程序的\
  \ JavaScript 代码必须返回 `true`；如果你希望取消用户对链接的点击，则返回 `false`。由于 `window.confirm` 方法在用户肯定回答提示时返回\
  \ `true`，否则返回 `false`，你可以简单地将此方法的返回值作为事件处理程序的返回值（参见步骤 2）。\n\n`onClick` 事件处理程序通常用于表单中，在允许提交表单之前对表单数据进行验证。这是通过在提交表单的按钮的\
  \ `input` 标签中使用 `onClick` 属性来实现的。\n\n该事件处理程序的另一个常见用途是在点击链接时执行操作。例如，你可以在允许用户跟随链接之前确认用户是否想要跟随。如果某个链接会将用户带到一个执行某种不可逆操作（如删除数据）的页面，你可以在允许用户继续之前确认用户的选择。\n\
  \n在链接中使用时，`onClick` 事件处理程序如下所示：\n\n```\n<a href=\"some url\" onClick=\"some JavaScript\"\
  >link text</a>\n```\n\n以下示例说明了如何在允许用户的浏览器实际跟随链接之前确认用户是否想要跟随。为此，你将使用 `window.confirm`\
  \ 方法，该方法在 Internet Explorer 中如图 220-1 所示，在 Netscape 中如图 220-2 所示。\n\n**图 220-1：**\
  \ Internet Explorer 中的确认对话框。\n\n**图 220-2：** Netscape 中的确认对话框。\n\n以下步骤展示了如何使用 `window.confirm`\
  \ 方法确认用户是否想要跟随链接：\n\n1. 创建一个常规链接，如下所示：\n\n   ```\n   <a href=\"http://my.url/\"\
  >Click Here</a>\n   ```\n\n![Image 542](img/index-480_1.jpg)\n\n10 542419 Ch09.qxd\
  \ 11/19/03 10:22 AM Page 457\n\n**处理事件** **457**\n\n2. 向 `a` 标签添加 `onClick` 属性：\n\
  \n   ```\n   <a href=\"http://my.url/\" onClick=\"\">Click Here</a>\n   ```\n\n\
  3. 作为 `onClick` 属性的值，首先输入 **\"return\"**：\n\n   ```\n   <a href=\"http://my.url/\"\
  \ onClick=\"return\">Click Here</a>\n   ```\n\n4. 要返回的值是 `window.confirm` 方法的返回值。因此，`return`\
  \ 命令后面应跟 `window.confirm` 方法：\n\n   ***提示*** `window.confirm` 方法接受一个参数，该参数应为文本字符串。然后它会在一个对话框中显示该文本字符串，并附带“确定”和“取消”按钮。它根据用户点击的按钮返回一个布尔值（参见步骤\
  \ 4）。\n\n   ```\n   <a href=\"http://my.url/\" onClick=\"return window.confirm('Do\
  \ you want to follow the link?')\">Click Here</a>\n   ```\n\n5. 当用户点击链接时，浏览器会显示一个确认对话框，如图\
  \ 220-3 所示。\n\n**图 220-3：** 当用户点击链接时显示确认对话框。\n\n***交叉引用*** 有关如何使用 `window.confirm`\
  \ 方法创建确认对话框的信息，请参阅任务 26。\n\n10 542419 Ch09.qxd 11/19/03 10:22 AM Page 458\n\n**458**\
  \ **第 9 部分**\n\n### 任务 221：响应表单文本字段的变化\n\n将 JavaScript 的事件处理程序与表单结合使用，提供了一种强大而简单的机制，用于创建动态表单，这些表单可以在客户端响应用户输入，而无需提交到服务器。这类表单可用于创建计算器应用程序、提示用户输入数据以及其他应用。\n\
  \n***注意*** 每个表单字段都有一个与之关联的对象，在 `doSquare`\n\n\n\n\n你可以用来创建响应用户操作的动态表单的事件处理程序之一是\
  \ `onChange` 事件处理程序。当与文本字段一起使用时，每次字段中的文本发生变化且光标离开文本字段时，都会调用 `onChange` 事件处理程序。与文本字段一起使用时，`onChange`\
  \ 事件处理程序如下所示：\n\n- 在处理文本字段的表单字段对象时，请记住 `value` 属性包含字段中的当前文本（参见步骤 3）。\n\n```\n<input\
  \ type=\"text\" name=\"textField\" onChange=\"*Some JavaScript*\">\n```\n\n以下示例演示了一个动态表单，用户在一个文本字段中输入数字，一旦用户的光标离开第一个文本字段，该数字的平方就会自动显示在第二个文本字段中：\n\
  \n- 在表单字段内部的事件处理程序中，`this` 关键字引用与事件发生字段关联的对象。在这种情况下，这允许你将与文本字段关联的对象传递给 `doSquare`\
  \ 函数（参见步骤 8）。\n\n1. 使用 `script` 标签开始一个脚本块：\n\n```\n<script language=\"JavaScript\"\
  >\n```\n\n2. 启动一个名为 `doSquare` 的函数，该函数接受一个参数，该参数包含指向发生更改的字段的指针：\n\n```\nfunction\
  \ doSquare(formField) {\n```\n\n3. 计算数字的平方，并将该值赋给一个名为 `square` 的临时变量：\n\n```\nvar\
  \ square = formField.value * formField.value;\n```\n\n4. 将变量 `square` 的值赋给名为 `squareValue`\
  \ 的表单字段：\n\n```\nformField.form.squareValue.value = square;\n```\n\n5. 用右花括号结束函数：\n\
  \n```\n}\n```\n\n6. 用结束的 `script` 标签关闭脚本块：\n\n```\n</script>\n```\n\n7. 在 HTML 文档的正文中，开始一个表单；表单标签不需要有\
  \ `method` 或 `action` 属性：\n\n```\n<form>\n```\n\n![Image 543](img/index-482_1.jpg)\n\
  \n8. 创建一个名为 `number` 的文本字段，该字段应具有一个 `onChange` 事件处理程序，调用函数 `doSquare` 并传入指向此表单字段的指针：\n\
  \n```\n<input type=\"text\" name=\"number\" onChange=\"doSquare(this)\">\n```\n\n\
  9. 创建一个名为 `squareValue` 的文本字段，用于显示用户输入值的平方：\n\n```\n<input type=\"text\" name=\"\
  squareValue\">\n```\n\n10. 添加任何描述性文本以帮助用户理解表单，并使用结束的 `form` 标签关闭表单。最终页面应如下所示：\n\n\
  ```\n<script language=\"JavaScript\">\nfunction doSquare(formField) {\n  var square\
  \ = formField.value * formField.value;\n  formField.form.squareValue.value = square;\n\
  }\n</script>\n<body>\n<form>\n<input type=\"text\" name=\"number\" onChange=\"doSquare(this)\"\
  >\nsquared is\n<input type=\"text\" name=\"squareValue\">\n</form>\n</body>\n```\n\
  \n图 221-1 展示了一个包含实际值的示例表单。\n\n***交叉引用***\n- 任务 81 讨论了 `onChange` 事件处理程序以及检测表单中文本字段的变化。\n\
