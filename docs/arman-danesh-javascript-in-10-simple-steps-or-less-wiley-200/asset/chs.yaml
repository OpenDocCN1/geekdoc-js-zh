  ```javascript\nfunction deleteCookie(cookieName) {\n    var newDate = new Date();\n\
  \    newDate.setTime(newDate.getTime() - 86400000);\n    document.cookie = cookieName\
  \ + \"=deleted;expires=\" + newDate.toGMTString();\n}\n```\n\n**清单 156-3：** `deleteCookie`\
