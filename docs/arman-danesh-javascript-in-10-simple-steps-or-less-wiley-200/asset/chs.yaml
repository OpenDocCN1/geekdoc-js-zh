  \n> **注意**\n> * 此任务仅在 Netscape 7 中有效。\n\n利用此功能，当你无法确定内容在渲染前会占用多少空间时，可以将窗口缩小到其内容的大小。当你希望内容完美地嵌入窗口，但无法预测用户浏览器中使用的字体大小时，这非常有用。\n\
