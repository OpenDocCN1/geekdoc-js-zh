  \n### 任务 238：使用书签小工具在新窗口中打开所有链接\n\n本任务展示了如何构建一个书签小工具，用于调整页面中的链接，使得点击链接时每个链接都在新窗口中打开。这在你想跟随页面中的链接但又想保持对原页面的访问时特别有用。这样你就可以自由点击链接，而无需右键单击并从上下文菜单中选择在新窗口中打开链接。\n\
  \n本任务利用了 `document.links` 数组为页面中的每个链接提供一个对象，并且每个对象都有一个 `target` 属性，该属性指定并可用于设置链接的目标窗口。将\
  \ `target` 设置为 `_blank` 会使链接在新窗口中打开。\n\n以下步骤展示了如何构建这个书签小工具：\n\n1. 打开你通常用于编写 JavaScript\
