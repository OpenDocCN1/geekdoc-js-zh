  ;\nmyArray[1] = \"Item 1\";\nmyArray[2] = \"Item 2\";\n```\n\n5. 创建一个 `for` 循环来遍历数组：\n\
  \n```javascript\nfor (i = 0; i < myArray.length; i++) {\n}\n```\n\n![Image 88](img/index-98_1.jpg)\n\
  \n6. 在循环中，使用 `document.write` 将数组的当前元素显示到浏览器窗口。最终页面应如清单 37-1 所示。\n\n```html\n<body>\n\
  <script>\n<!--\nvar myArray = new Array(3);\nmyArray[0] = \"Item 0\";\nmyArray[1]\
