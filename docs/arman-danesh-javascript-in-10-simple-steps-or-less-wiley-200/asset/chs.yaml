  \ Ch08.qxd 11/19/03 10:21 AM Page 408\n\n**408**\n\n**第 8 部分**\n\n### 任务 197：创建一个简单的下拉菜单\n\
  \n使用 JavaScript，你可以创建动态用户界面。其中一种界面是下拉菜单，它在网页中最初可能显示为关闭状态。但当用户将鼠标指针移到菜单上时，下拉菜单就会出现，如图\
  \ 197-1 所示。\n\n***注释***\n\n- 下拉菜单的工作方式与大多数 Windows 应用程序中的菜单非常相似；当用户将鼠标移到菜单上（或在某些情况下点击菜单）时，菜单就会出现。\n\
  \n**图 197-1：** 菜单处于打开状态。\n\n- 注意使用了基于`document.getElementById`的条件判断。在 Internet Explorer\
  \ 中，此方法可用，你可以用它来访问目标对象的`style`属性。但在 Netscape 中，此方法不可用，正确的操作对象是对象本身，而不是`style`属性。通过测试`getElementById`方法是否存在，你可以确定正在使用哪个浏览器。\n\
  \n本任务概述了如何构建一个极其简单的下拉菜单。原理很简单。给定一个名为`myObject`的对象，你可以通过以下方式指定对象顶部相对于浏览器窗口的像素位置：\n\
  \n```\nmyObject.top = 相对于窗口顶部的像素位置;\n```\n\n以下步骤展示了如何在浏览器窗口左上角创建一个包含三个菜单项的简单下拉菜单：\n\
  \n1. 在 HTML 文档的头部，创建一个带有开始和结束 script 标签的脚本块。\n\n2. 在脚本块中，创建一个名为`menuToggle`的函数，该函数接受一个名为`target`的属性，即包含菜单的对象的名称：\n\
  \n   ```\n   function menuToggle(target) {\n   }\n   ```\n\n3. 在函数中，创建一个名为`targetMenu`的变量，并将其设置为具有`target`中指定对象名称的适当对象：\n\
  \n   ```\n   targetMenu = (document.getElementById) ? document.getElementById(target).style\
  \ : eval(\"document.\" + target);\n   ```\n\n4. 通过将适当的顶部值赋给`targetMenu`对象的`top`属性来完成函数：\n\
  \n   ```\n   targetMenu.top = (parseInt(targetMenu.top) == 22) ? -2000 : 22;\n \
  \  ```\n\n5. 同样在头部，创建一个带有开始和结束 style 标签的样式表块。\n\n6. 创建三个样式类：`.menu`、`.menuTitle`和`.menuEntry`。`.menu`用于菜单块本身，其绝对顶部位置应为-2000\
  \ 像素，以便菜单最初隐藏。`.menuTitle`用于菜单标题，其绝对位置应为 0 像素，以便将菜单标题放置在屏幕顶部。最后，`.menuEntry`指定菜单中各个项目的外观和行为。\n\
  \n   ```\n   .menu { position:absolute;\n   font:15px arial, helvetica, sans-serif;\n\
  \   background-color:#020A33;\n   line-height: 20px; top: -2000px; }\n   .menuTitle\
  \ { position:absolute;\n   font:15px arial, helvetica, sans-serif;\n   background-color:#020A33;\n\
  \   line-height: 21px; top: 0px;\n   text-decoration:none; color:#FFFFFF; }\n  \
  \ .menuEntry { text-decoration:none; color:#FFFFFF; }\n   .menuEntry:link { color:#FFFFFF;\
  \ }\n   .menuEntry:hover { background-color:#CCCCCC; color:#020A33; }\n   ```\n\n\
  7. 在文档的正文中，使用开始和结束 div 标签创建菜单标题块：\n\n   ```\n   <div class=\"menuTitle\" style=\"\
  left:0px; width:100px;\"\n   onMouseover=\"menuToggle('myMenu');\"\n   onMouseout=\"\
  menuToggle('myMenu');\">我的菜单</div>\n   ```\n\n8. 在文档的正文中，使用开始和结束 div 标签创建菜单块：\n\n\
  \   ```\n   <div id=\"myMenu\" class=\"menu\" style=\"left:0px; width:100px;\"\n\
  \   onMouseout=\"menuToggle('myMenu')\">\n   </div>\n   ```\n\n9. 在 div 块中，为每个条目创建一个链接。链接应使用`.menuEntry`样式类，并且后面应跟一个`br`标签。此\
  \ div 块可以放置在文档正文的任何位置：\n\n   ```\n   <div id=\"myMenu\" class=\"menu\" style=\"\
  left:0px; width:100px;\"\n   onMouseout=\"menuToggle('myMenu')\">\n   <a href=\"\
  http://someurl/\" class=\"menuEntry\">第一个条目</a><br>\n   <a href=\"http://anotherurl/\"\
  \ class=\"menuEntry\">第二个条目</a><br>\n   <a href=\"http://onemoreurl/\" class=\"\
  menuEntry\">第三个条目</a>\n   </div>\n   ```\n\n![图片 481](img/index-433_1.jpg)\n\n09\
  \ 542419 Ch08.qxd 11/19/03 10:21 AM Page 410\n\n### 任务 198：创建两个下拉菜单\n\n在任务 197 中，你了解了如何创建一个简单的下拉菜单。在本任务中，将其扩展为同时显示两个下拉菜单。这里重复了相同的原理，允许相同的\
