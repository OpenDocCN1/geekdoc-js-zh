  \ 任务 78：为 JavaScript 准备表单\n\n在 JavaScript 中，你可以访问并操作页面上表单中字段的内容和状态。为此，你需要关注使表单在\
  \ JavaScript 中易于访问的最低要求。\n\n\n\n\n\n## 第 4 部分\n## 处理表单\n\n首先，你必须专注于为表单及其元素提供名称。以下步骤将引导你完成命名表单和元素的过程，以便你可以使用\
  \ JavaScript 访问它们：\n\n**注意：**\n- 要访问表单中的字段，可以在 JavaScript 中使用以下引用：`document.forms[0].elements[0]`。\n\
  - 文档中的每个表单都按其在文档中出现的顺序包含在 `forms` 数组中。类似地，`elements` 数组按字段在给定表单中出现的顺序为每个字段提供一个条目。\n\
  - 如果表单未命名，则每个表单都可以通过 `document.forms` 数组访问，因此文档中的第一个表单是 `document.forms[0]`，第二个是\
  \ `document.forms[1]`，依此类推。\n- 如果字段未命名，则表单中的每个字段都可以通过 `document.formName.elements`\
  \ 数组访问，因此表单中的第一个字段是 `document.formName.elements[0]`，第二个是 `document.formName.elements[1]`，依此类推。\n\
  - 本部分中的大多数任务都使用 `name` 属性来操作表单的内容。\n\n**1.** 在你偏好的编辑器中创建一个新文档。\n\n**2.** 在文档的正文中创建一个表单。向表单中添加一个输入文本字段、一个选择列表和一个命令按钮：\n\
  \n```html\n<body>\n<form method=\"post\" action=\"target.html\">\n<input type=\"\
  text\">\n<select>\n<option value=\"1\">第一选择</option>\n<option value=\"2\">第二选择</option>\n\
  </select>\n<br>\n<input type=\"submit\" value=\"提交我\">\n</form>\n</body>\n```\n\n\
  该表单如图 78-1 所示。\n\n**图 78-1：** 一个标准的 HTML 表单。\n\n**3.** 通过添加 `name` 属性来命名表单。以下代码将表单命名为\
  \ `thisForm`。如粗体所示，`name` 属性被添加到表单标签内：\n\n```html\n<body>\n<form method=\"post\"\
  \ action=\"target.html\" name=\"thisForm\">\n<input type=\"text\">\n<select>\n<option\
  \ value=\"1\">第一选择</option>\n<option value=\"2\">第二选择</option>\n</select>\n<br>\n\
  <input type=\"submit\" value=\"提交我\">\n</form>\n</body>\n```\n\n**提示：**\n- 为字段和表单命名可以更容易地引用它们，并确保你在代码中引用的是正确的字段。\n\
  - 在命名表单及其中的元素时，应使用描述性名称。\n\n**4.** 命名表单中的元素。与命名表单类似，这是通过向每个字段的标签添加一个名为 `name` 的属性来完成的。然后将此属性设置为元素的名称，如清单\
  \ 78-1 所示。一旦分配了 name 属性，你的表单就可以轻松地与 JavaScript 一起使用了。\n\n```html\n<body>\n<form\
  \ method=\"post\" action=\"target.html\" name=\"thisForm\">\n<input type=\"text\"\
  \ name=\"myText\">\n<select name=\"mySelect\">\n<option value=\"1\">第一选择</option>\n\
  <option value=\"2\">第二选择</option>\n</select>\n<br>\n<input type=\"submit\" value=\"\
  提交我\">\n</form>\n</body>\n```\n\n**清单 78-1：** 一个已准备好与 JavaScript 配合使用的表单。\n\n**交叉引用：**\n\
  - 任务 79 展示了如何使用分配的名称访问文本字段。\n\n### 访问文本字段内容\n\n当你创建 HTML 表单时，你实际上是在创建一系列对象，这些对象可以从\
  \ JavaScript 内部访问。表单本身是一个对象，而表单中的每个字段在 JavaScript 中也都由一个对象表示。利用这些对象，你可以访问存储在表单字段（如文本输入字段）中的值。\n\
  \n**注意：**\n- 以下是创建文本字段所需的最少 HTML 代码：`<input type=\"text\">`\n- 注意示例中使用了 `#` 作为 URL。当使用\
  \ `onClick` 事件处理程序触发打开新窗口时，你不希望点击链接导致当前窗口的位置发生变化；这是一种避免这种情况的简单方法。\n- 如果表单未命名，则每个表单都可以通过\
  \ `document.forms` 数组访问，因此文档中的第一个表单是 `document.forms[0]`，第二个是 `document.forms[1]`，依此类推。\n\
  - 如果字段未命名，则表单中的每个字段都可以通过 `document.formName.elements` 数组访问，因此表单中的第一个字段是 `document.formName.elements[0]`，第二个是\
  \ `document.formName.elements[1]`，依此类推。\n\n你可以检查文本输入字段中显示的文本——无论是表单自带的文本还是用户输入的文本。要在\
  \ JavaScript 中访问字段，请使用以下步骤：\n\n**1.** 在你偏好的编辑器中创建一个新文档。\n\n**2.** 在文档的正文中，创建一个名为\
  \ `myForm` 的表单，其中包含一个名为 `myText` 的文本输入字段：\n\n```html\n<body>\n<form name=\"myForm\"\
  >\n<input type=\"text\" name=\"myText\">\n</form>\n</body>\n```\n\n**3.** 在表单中创建一个链接。此链接用于在对话框中显示文本输入元素的值。将\
  \ `#` 指定为链接的 URL：\n\n```html\n<body>\n<form name=\"myForm\">\n<input type=\"text\"\
  \ name=\"myText\">\n</form>\n<a href=\"#\">检查文本字段</a>\n</body>\n```\n\n**4.** 在链接元素中使用\
  \ `onClick` 事件处理程序来指定当用户点击链接时要执行的 JavaScript 代码。要访问表单字段，请使用以下语法：\n\n`document.formName.fieldName`\n\
  \n这会引用与该字段关联的对象。该对象具有多个属性，包括：\n- `name`：字段的名称（如 `name` 属性中所指定）\n- `value`：字段中显示的文本\n\
  - `form`：对字段所在表单的表单对象的引用\n\n因此，属性 `document.formName.formField.value` 将包含字段中显示的文本字符串。\n\
  \n在此示例中，`document.myForm.myText.value` 表示文本输入字段中的文本，因此将其作为参数传递给 `window.alert`。结果是\
  \ `myText` 文本输入框中的文本会显示在一个对话框中。清单 79-1 显示了添加了 JavaScript 后的完整代码。\n\n```html\n<body>\n\
  <form name=\"myForm\">\n<input type=\"text\" name=\"myText\">\n</form>\n<a href=\"\
  #\" onClick=\"window.alert(document.myForm.myText.value);\">检查文本字段</a>\n</body>\n\
  ```\n\n**清单 79-1：** 访问表单文本字段的值。\n\n![图片 228](img/index-188_1.jpg)\n\n**提示：**\n-\
  \ 为表单和字段命名可以更容易地引用它们，并确保你在代码中引用的是正确的字段。\n- 在步骤 4 的代码清单中，将 `document.myForm.myText.value`\
  \ 改为 `document.myForm.myText.name`。你会看到结果变成了显示文本输入字段的名称而不是值。\n\n**5.** 保存文件并关闭它。\n\
  \n**6.** 在浏览器中打开该文件。在文本字段中输入一些文本，然后点击链接，即可看到该文本显示在对话框中，如图 79-1 所示。\n\n**图 79-1：**\
  \ 显示文本字段的值。\n\n**交叉引用：**\n- 参见任务 200 以了解更多关于 `onClick` 事件处理程序的信息。\n- 有关命名元素和表单的更多信息，请参见任务\
  \ 78。\n\n### 动态更新文本字段\n\n使用 JavaScript，你可以更改文本输入字段中的值。最合适的更新时机是用户在表单上执行某个操作时。本任务将向你展示如何动态更新文本输入字段中显示的文本：\n\
