  \ 在脚本中放置三条命令。\n\n**9.** 保存文件。\n\n**10.** 在支持 JavaScript 的浏览器中打开该文件。你应该会在浏览器中看到短语“Hello\
  \ there.”，如图 6-1 所示。\n\n**图 6-1：** 三条命令按顺序执行。\n\n### 临时从脚本中移除命令\n\n有时，当你处理一些特别复杂的\
  \ JavaScript 代码，或者遇到一个难以定位的 bug 时，你需要逐行删除代码，直到找出导致问题的代码行。\n\n***备注***\n* 调试是指查找并消除代码中问题的行为；这些问题被称为\
  \ bug，可能从简单的拼写错误到脚本逻辑中难以察觉的问题。\n* 注释掉代码行并不是唯一的调试技术。还有许多其他调试方法，包括使用专门设计的调试工具。这些是本书未涉及的高级主题。\n\
  \n然而，你并不想真正删除那一行，因为一旦你找到并修复了问题，你需要重新创建所有删除的行。这时注释就派上用场了。\n\n例如，在以下代码中，第二行不会被执行，因为\
  \ `document.write` 命令位于双斜杠之后：\n\n```\nvar myVariable = \"Hello\";\n//document.write(\"\
