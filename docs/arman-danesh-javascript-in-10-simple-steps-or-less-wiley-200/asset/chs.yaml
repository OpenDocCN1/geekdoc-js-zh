  \ 方法被用作 `document.write` 方法的参数。后者期望一个字符串值作为参数，而前者正好返回这样一个字符串：包含排序后的元素列表。\n\n以下任务创建一个包含五个元素的数组，然后按排序顺序显示这些元素：\n\
