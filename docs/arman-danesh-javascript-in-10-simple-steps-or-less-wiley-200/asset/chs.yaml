  \n### 创建多个 Cookie\n\n在限制范围内，可以为网页创建多个 Cookie。这允许你在整个 Web 应用程序中或用户会话之间设置和跟踪多个值。但存在一些限制。大多数\
  \ Web 浏览器对可以设置的 Cookie 数量或来自同一站点的 Cookie 可以消耗的总字节数设置了限制。当达到这些阈值时，即使尚未达到过期时间，站点中最旧的\
  \ Cookie 也会在你尝试创建新 Cookie 时自动过期。\n\n***注意***\n- `escape`函数接受\n\n\n\n\n一个字符串，并转义任何在\
  \ URL 中无效的字符。转义操作是将字符替换为以百分号开头的数字代码。例如，空格会变成 `%20`。\n\n要从 JavaScript 创建多个 cookie，只需依次将每个\
  \ cookie 赋值给 `document.cookie` 对象，并确保每个 cookie 有不同的名称。每个 cookie 都可以像设置单个 cookie\
  \ 一样设置过期日期和时间，并且每个 cookie 可以有不同的过期日期和时间。\n\n以下示例演示了如何创建两个名为 `myFirstCookie` 和 `mySecondCookie`\
