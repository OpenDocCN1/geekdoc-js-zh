  \ `result` 的变量中：\n\n```javascript\nvar result = window.confirm(\"Choose OK or Cancel\"\
  );\n```\n\n4. 创建一个 `while` 循环：\n\n```javascript\nwhile () {\n}\n```\n\n5. 作为循环的条件，通过将\
  \ `result` 与 `false` 比较来测试用户是否点击了“取消”：\n\n```javascript\nwhile (result == false)\
  \ {\n}\n```\n\n6. 在循环内部，再次调用 `window.confirm`，并将用户的选择保存到 `result` 中：\n\n```javascript\n\
  while (result == false) {\n  result = window.confirm(\"Choose OK or Cancel\");\n\
  }\n```\n\n![Image 87](img/index-96_1.jpg)\n\n7. 循环结束后，输出一条消息，表明用户最终点击了“确定”。最终页面应如清单\
  \ 36-1 所示。\n\n**清单 36-1：** 使用条件循环。\n\n```html\n<body>\n<script>\n<!--\nvar result\
  \ = window.confirm(\"Choose OK or Cancel\");\nwhile (result == false) {\n  result\
