  ![Image 59](img/index-24_28.png)\n![Image 60](img/index-24_29.png)\n\n### 第 1 部分：JavaScript\
  \ 基础\n\n### 任务 1：创建脚本块\n\nJavaScript 是一种动态脚本语言，允许你在原本静态的 HTML 页面中构建交互性。这可以通过在网页的几乎任何位置嵌入\
  \ JavaScript 代码块来实现。\n\n### 任务 2：隐藏你的 JavaScript 代码\n\n### 任务 3：为你的 JavaScript 代码提供替代方案\n\
  \n### 任务 4：引入外部源代码\n\n### 任务 5：为脚本添加注释\n\n### 任务 6：编写 JavaScript 命令\n\n### 任务 7：临时从脚本中移除命令\n\
  \n### 任务 8：使用花括号\n\n### 任务 9：向浏览器输出内容\n\n### 任务 10：创建变量\n\n### 任务 11：输出变量\n\n####\
  \ 任务 12：创建字符串\n\n### 任务 13：创建数值变量\n\n#### 任务 14：执行数学运算\n\n### 任务 15：拼接字符串\n\n###\
  \ 任务 16：在字符串中搜索文本\n\n### 任务 17：替换字符串中的文本\n\n### 任务 18：格式化字符串\n\n### 任务 19：对字符串应用多个格式化函数\n\
  \n### 任务 20：创建数组\n\n### 任务 21：填充数组\n\n### 任务 22：对数组排序\n\n### 任务 23：按分隔符拆分字符串\n\n\
  #### 任务 24：调用函数\n\n### 任务 25：向用户发出警告\n\n#### 任务 26：向用户确认\n\n### 任务 27：创建自己的函数\n\n\
  #### 任务 28：向函数传递参数\n\n### 任务 29：从函数返回值\n\n### 任务 30：向函数传递多个参数\n\n### 任务 31：从标签中调用函数\n\
  \n### 任务 32：在页面加载后调用 JavaScript 代码\n\n### 任务 33：使用 for 循环\n\n### 任务 34：使用 if 测试条件\n\
  \n### 任务 35：使用简写条件测试\n\n### 任务 36：按条件循环\n\n### 任务 37：遍历数组\n\n### 任务 38：安排函数在未来执行\n\
  \n### 任务 39：安排函数重复执行\n\n### 任务 40：取消已安排执行的函数\n\n### 任务 41：在页面中添加多个脚本\n\n### 任务 42：在页面加载后调用\
  \ JavaScript 代码\n\n### 任务 43：使用 JavaScript 检查 Java 是否启用\n\n\n\n\n\n## JavaScript\
  \ 基础\n\n为了让代码生效，JavaScript 代码块由开始和结束的 `<script>` 标签界定：\n\n**注意**\n\n- 为简单起见，本书中所有\
  \ `<script>` 标签的语言属性值均使用 `JavaScript`。JavaScript 代码写在这里 `</script>`\n\n`<script>`\
  \ 标签有一个重要属性：`language`。该属性指定你使用的脚本语言。通常，其值为 `JavaScript` 或 `JavaScript1.0`、`JavaScript1.1`、`JavaScript1.2`\
  \ 等。通过指定特定的 JavaScript 版本号，你向浏览器表明此脚本只能在支持该版本 JavaScript 的浏览器上运行。如果不指定，所有支持 JavaScript\
  \ 的浏览器都会认为该脚本是它们应该尝试运行的。\n\n- 最新浏览器中 JavaScript 的当前版本是 `JavaScript 1.5`。\n\n例如，下面是一个完整的\
  \ `<script>` 标签示例：\n\n```html\n<script language=\"JavaScript\">\nJavaScript code\
  \ goes here\n</script>\n```\n\n以下步骤概述了如何创建一个包含单个嵌入脚本块的简单 HTML 文档。该脚本负责在用户浏览器中输出单词“Hello”：\n\
  \n**1.** 在你偏好的 HTML 或文本编辑器中打开一个新的 HTML 文档。\n\n**2.** 使用开始和结束的 `<body>` 标签创建文档主体：\n\
  \n```html\n<body>\n</body>\n```\n\n**3.** 在文档主体中插入一个脚本块：\n\n```html\n<body>\n<script>\n\
  </script>\n</body>\n```\n\n![图 61](img/index-26_1.jpg)\n\n**4.** 为 `<script>` 标签指定\
  \ JavaScript 作为语言：\n\n```html\n<body>\n<script language=\"JavaScript\">\n</script>\n\
  </body>\n```\n\n**5.** 在脚本块中放置任意 JavaScript 代码，使最终代码如清单 1-1 所示。\n\n```html\n<body>\n\
  <script language=\"JavaScript\">\ndocument.write(\"Hello\");\n</script>\n</body>\n\
  ```\n\n**清单 1-1：** 创建脚本块。\n\n**6.** 保存文件。\n\n**7.** 在浏览器中打开该文件。你应该能在浏览器中看到单词“Hello”，如图\
  \ 1-1 所示。\n\n***交叉引用***\n\n- 此处的 JavaScript 代码使用 `document.write` 向浏览器窗口输出文本。`document.write`\
  \ 将在任务 9 中更深入地介绍，并在任务 45 中更详细地讨论。\n\n**图 1-1：** 脚本代码可以放置在文档中的任何位置，包括文档主体中。\n\n###\
  \ 任务 2：隐藏你的 JavaScript 代码\n\n任务 1 展示了如何将 JavaScript 代码嵌入到文档中。例如，以下代码在 HTML 文档主体中嵌入了一行\
  \ JavaScript 代码：\n\n```html\n<body>\n<script language=\"JavaScript\">\ndocument.write(\"\
  Hello\");\n</script>\n</body>\n```\n\n**注意**\n\n- 幸运的是，JavaScript 使用与 HTML 不同的注释语法，因此你可以使用\
  \ HTML 注释来隐藏 JavaScript 代码，而不会阻止支持 JavaScript 的浏览器执行该代码。\n- 在开头源代码的结束 `-->` 中（在步骤\
  \ 5 中讨论），你会看到它前面有两个斜杠。这表示一个 JavaScript 注释。这里发生的情况是，一旦脚本块中出现第一行 JavaScript，后续所有行都被假定为\
  \ JavaScript 代码。双斜杠是一个 JavaScript 注释，用于隐藏结束的 HTML 注释，使其不被当作 JavaScript 处理；否则，由于浏览器会将结束的\
  \ HTML 注释视为 JavaScript，就会发生 JavaScript 错误。JavaScript 注释将在任务 5 中讨论。\n\n然而，这段代码存在一个根本问题：如果页面在不支持\
  \ JavaScript 的浏览器中打开，或者用户在其浏览器中禁用了 JavaScript，则用户可能会看到代码本身，具体取决于其使用的浏览器。\n\n为了解决这个问题，你需要在脚本块中使用\
  \ HTML 注释来对这些浏览器隐藏代码。\n\nHTML 注释的工作方式如下：\n\n```html\n<!-- 一行或多行注释写在这里 -->\n```\n\
  \n在 JavaScript 脚本的上下文中使用时，你会看到以下内容：\n\n```html\n<body>\n<script language=\"JavaScript\"\
  >\n<!--\ndocument.write(\"Hello\");\n// -->\n</script>\n</body>\n```\n\n以下步骤展示了如何在文档主体中创建一个包含这些注释的脚本块：\n\
  \n**1.** 在你偏好的 HTML 或文本编辑器中打开一个新的 HTML 文档。\n\n**2.** 使用开始和结束的 `<body>` 标签创建文档主体：\n\
  \n```html\n<body>\n</body>\n```\n\n**3.** 在文档主体中插入一个脚本块：\n\n```html\n<script>\n\
  </script>\n```\n\n![图 62](img/index-28_1.jpg)\n\n**4.** 为 `<script>` 标签指定 JavaScript\
  \ 作为语言：\n\n```html\n<script language=\"JavaScript\">\n```\n\n**5.** 在脚本块中放置开始和结束的\
  \ HTML 注释：\n\n```html\n<!--\n// -->\n```\n\n**6.** 在脚本块中放置任意 JavaScript 代码，使最终代码如清单\
  \ 2-1 所示。\n\n```html\n<body>\n<script language=\"JavaScript\">\n<!--\ndocument.write(\"\
  Hello\");\n// -->\n</script>\n</body>\n```\n\n**清单 2-1：** 创建脚本块。\n\n**7.** 保存文件。\n\
  \n**8.** 在支持 JavaScript 的浏览器中打开该文件。你应该能在浏览器中看到单词“Hello”。在不支持 JavaScript 的浏览器中打开，你应该什么也看不到，如图\
  \ 2-1 所示。\n\n**图 2-1：** 脚本代码对不支持 JavaScript 的浏览器隐藏，并且不显示。\n\n### 任务 3：为你的 JavaScript\
  \ 代码提供替代方案\n\n在任务 2 中，你了解了如何通过使用 HTML 注释对不支持 JavaScript 的浏览器隐藏 JavaScript 代码。结果是，不支持\
  \ JavaScript 的浏览器在原本脚本块的位置什么也看不到。然而，在某些情况下，JavaScript 代码的目的对页面至关重要，需要告知不支持 JavaScript\
  \ 的浏览器的用户他们错过了页面的这一重要部分。\n\n幸运的是，有一个解决方案：`<noscript>` 标签。`<noscript>` 标签允许你指定仅在不支持\
  \ JavaScript 的浏览器中显示的 HTML。如果浏览器支持 JavaScript，它将忽略 `<noscript>` 块中的文本。\n\n要使用它，你只需将任何为不支持\
  \ JavaScript 的浏览器准备的 HTML 放在开始和结束的 `<noscript>` 标签之间。以下步骤展示了如何在文档主体中嵌入脚本，并为不支持 JavaScript\
  \ 的浏览器提供替代 HTML 显示：\n\n**注意**\n\n- `<noscript>` 标签的工作原理很简单：支持 JavaScript 的浏览器会识别该标签，并遵守它，不显示块内的文本。另一方面，较旧的不支持\
  \ JavaScript 的浏览器不会将该标签识别为有效的 HTML。按照浏览器的设计，它们会忽略不认识的标签，但开始和结束标签之间的所有内容不会被忽略，因此会在浏览器中显示。\n\
  \n**1.** 在你偏好的 HTML 或文本编辑器中打开一个新的 HTML 文档。\n\n**2.** 使用开始和结束的 `<body>` 标签创建文档主体：\n\
  \n```html\n<body>\n</body>\n```\n\n**3.** 在文档主体中插入一个脚本块：\n\n```html\n<script>\n\
  </script>\n```\n\n**4.** 为 `<script>` 标签指定 JavaScript 作为语言：\n\n```html\n<script\
  \ language=\"JavaScript\">\n```\n\n**5.** 在脚本块中放置开始和结束的 HTML 注释：\n\n```html\n<!--\n\
  // -->\n```\n\n**警告**\n\n- 仔细考虑是否要将页面限制为仅支持 JavaScript 的浏览器用户，这一点很重要。无论使用这些较旧浏览器的用户比例有多小，如果你这样做，都会排除一部分受众。\n\
  \n![图 63](img/index-30_1.jpg)\n\n**6.** 在脚本块中放置任意 JavaScript 代码：\n\n```javascript\n\
  document.write(\"Hello\");\n```\n\n**7.** 在脚本块之后立即添加一个 `<noscript>` 块：\n\n```html\n\
  <noscript>\n</noscript>\n```\n\n\n\n\n\n8. 在 `noscript` 块中，放置要显示给不支持 JavaScript\
  \ 的浏览器的文本：\n\n```\n<noscript>\nHello to the non-JavaScript browser.\n</noscript>\n\
  ```\n\n9. 保存文件。\n\n10. 在支持 JavaScript 的浏览器中打开该文件。你应该能在浏览器中看到单词“Hello”。在不支持 JavaScript\
  \ 的浏览器中打开它，你应该会看到替代消息，如图 3-1 所示。\n\n**图 3-1：** 其他浏览器会显示 `noscript` 块中的文本。\n\n###\
  \ 任务 4：包含外部源代码\n\n当你开始更广泛地使用 JavaScript 时，你可能会发现有些情况下，你会在网站的多个页面上重复使用相同的 JavaScript\
  \ 代码。例如，你可能正在用 JavaScript 创建一个所有页面通用的动态菜单。\n\n在这些情况下，你肯定不希望在多份 HTML 文件中维护相同的代码。幸运的是，`script`\
  \ 标签提供了一种机制，允许你将 JavaScript 存储在外部文件中，并将其包含到你的 HTML 文件中。这样，你可以构建并维护一个包含通用代码的 JavaScript\
  \ 文件，然后简单地将其包含到多个 HTML 文件中。\n\n这是通过 `script` 标签的 `src` 属性实现的，该属性允许你指定一个 JavaScript\
  \ 文件的相对或绝对 URL，如下所示：\n\n```\n<script language=\"JavaScript\" src=\"filename.js\"\
  ></script>\n```\n\n下面的示例使用这种技术将一个外部 JavaScript 文件包含到 HTML 文档中：\n\n> **注意：**\n> -\
  \ 即使脚本块中没有 JavaScript 代码，你仍然需要关闭 `script` 标签。否则，脚本标签之后的所有 HTML 代码都会被浏览器视为 JavaScript\
  \ 而非 HTML。这可能会导致浏览器出错，并且你的页面肯定无法按预期显示。\n> - 请注意，这个文件没有 `script` 标签。这将是一个外部 JavaScript\
  \ 文件，而不是 HTML 文件。`script` 标签是一个 HTML 文件，用于标记 JavaScript 代码的位置。在 JavaScript 文件中，不需要这样的标记。\n\
  \n1. 在编辑器中，创建一个新文件，用于存放 JavaScript 文件的代码。\n\n2. 在此文件中，输入你想要包含在外部 JavaScript 文件中的任何\
