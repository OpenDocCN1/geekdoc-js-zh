  \ 158 展示了如何使用 JavaScript 控制行间距。\n\n---\n\n### 任务 169：使用 CSS 创建投影\n\n随着浏览器对层叠样式表支持的改进，你纯粹通过动态\
  \ HTML 代码实现特殊视觉效果的能力也随之增强。其中一种效果就是投影，如图 169-1 所示。\n\n**图 169-1：** 使用绝对定位的投影。\n\n\
  矩形页面元素的投影很简单：你需要将一个图层放置在另一个图层的后面并稍微偏移。例如，以下代码创建了一个带有 5 像素宽灰色阴影的块状盒子：\n\n```\n<div\
