  \ 125-2 所示。\n\n**图 125-2：** 使用 JavaScript 将用户引导至新页面。\n\n> **交叉引用：** `document` 对象在任务\
  \ 44 中介绍和讨论。\n\n\n\n\n## 第 5 部分\n\n### 任务 126：使用 JavaScript 控制窗口滚动\n\n控制文档的滚动位置需要根据所使用的浏览器采用不同的方法。在\
  \ Internet Explorer 中，滚动位置通过`document.body.scrollTop`属性控制。该属性指定滚动条在文档中向下滚动的像素数。设置该属性的方式如下：`document.body.scrollTop\
  \ = *像素数*;` 在 Netscape 中，滚动位置同样以像素为单位设置，但控制该位置的属性是`window.pageYOffset`：`window.pageYOffset\
  \ = *像素数*;`\n\n> **注意：**\n> - 使用 JavaScript 可以控制垂直滚动位置。也就是说，你可以控制当前窗口中长文档的哪一部分可见。\n\
  > - 作为控制滚动位置的示例，假设页面深度为 1000 像素。在这种情况下，将`document.body.scrollTop`设置为 500 将滚动到文档的一半位置。\n\
  > - `document.all`对象存在于 Internet Explorer 中，但不存在于 Netscape 中。测试该对象是否存在是一种快速简便的方法，用于判断用户的浏览器是否为\
  \ Internet Explorer。\n> - 在`if`语句中，只需将条件表达式设置为对象名称，即可测试对象是否存在。\n\n为了说明这一点，以下步骤展示了如何在页面加载后自动向下滚动\
  \ 200 像素：\n\n1. 在新文档的头部脚本中，创建一个名为`scrollDocument()`的函数，该函数不接受参数：\n   ```javascript\n\
  \   function scrollDocument() {\n   }\n   ```\n\n2. 在函数语句中，使用`if`语句测试`document.all`对象是否存在：\n\
  \   ```javascript\n   if (document.all) {\n   }\n   ```\n\n3. 如果浏览器是 Internet Explorer，则将`document.body.scrollTop`设置为\
  \ 200 像素：\n   ```javascript\n   if (document.all) {\n       document.body.scrollTop\
  \ = 200;\n   }\n   ```\n\n4. 如果浏览器不是 Internet Explorer，则将`window.pageYOffset`设置为\
  \ 200 像素，最终函数如下所示：\n   ```javascript\n   if (document.all) {\n       document.body.scrollTop\
  \ = 200;\n   } else {\n       window.pageYOffset = 200;\n   }\n   ```\n\n5. 在`body`标签中，使用`onLoad`事件处理程序调用`scrollDocument()`函数：\n\
  \   ```html\n   <body onLoad=\"scrollDocument();\">\n   ```\n\n![Image 321](img/index-284_1.jpg)\n\
  \n6. 在文档的正文中，放置页面内容；内容应足够多，无法在一个浏览器屏幕中完全显示。最终页面应如清单 126-1 所示。\n   ```html\n   <html>\n\
  \   <head>\n   <script language=\"JavaScript\">\n   function scrollDocument() {\n\
  \       if (document.all) {\n           document.body.scrollTop = 200;\n       }\
  \ else {\n           window.pageYOffset = 200;\n       }\n   }\n   </script>\n \
  \  </head>\n   <body onLoad=\"scrollDocument();\">\n   <p>\n   在此处放置大量文本。\n   在此处放置大量文本。\n\
  \   在此处放置大量文本。\n   *等等*\n   </p>\n   </body>\n   </html>\n   ```\n\n7. 保存文件并在浏览器中打开。页面应显示并自动向下跳转\
  \ 200 像素，如图 126-1 所示。\n\n**图 126-1：** 加载时向下滚动 200 像素。\n\n### 任务 127：在 Internet Explorer\
  \ 中打开全屏窗口\n\nInternet Explorer 支持一些有趣的附加属性，可以在使用`window.open()`方法打开新窗口时使用。其中一个属性允许创建全屏窗口。\n\
