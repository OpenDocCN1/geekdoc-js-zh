  \n**图 127-2：** 打开全屏窗口。\n\n### 任务 128：处理窗口的父子关系\n\n当使用`window.open()`方法从 JavaScript\
  \ 打开一个新窗口时，原始窗口和新窗口之间存在一种关系，使得可以在 JavaScript 中引用这两个窗口。\n\n> **注意：** 本任务的原理很简单。首先，考虑调用`window.open()`方法的原始窗口。该方法返回一个窗口对象，可以将其存储在变量中，然后在原始窗口的\
  \ JavaScript 代码中使用该变量引用新窗口。\n\n为此，只需将`window.open()`方法返回的对象赋值给一个变量：`var newWindow\
  \ = window.open(*URL*, *窗口名称*);` 完成后，`newWindow`引用新窗口的窗口对象。同时，在新窗口中，`window.opener`属性引用调用`window.open()`的原始窗口的窗口对象。\n\
  \n为了说明这一点，以下示例从第一个页面打开一个新窗口，然后提供链接，以便你可以从原始窗口关闭新窗口，或从新窗口关闭原始窗口：\n\n1. 在新文档头部的脚本块中，在新窗口中打开第二个文档，并将返回的对象赋值给`newWindow`对象。最终脚本如下所示：\n\
  \   ```html\n   <script language=\"JavaScript\">\n   var newWindow = window.open(\"\
  128a.html\",\"newWindow\");\n   </script>\n   ```\n\n2. 在文档的正文中，创建一个用于关闭新窗口的链接：\n\
  \   ```html\n   <a href=\"#\">关闭新窗口</a>\n   ```\n\n3. 在链接的`onClick`事件处理程序中，调用`newWindow`对象的`close()`方法：\n\
  \   ```html\n   <a href=\"#\" onClick=\"newWindow.close();\">关闭新窗口</a>\n   ```\n\
  \n4. 保存文件并关闭。\n\n5. 在第二个新文件中，在正文中创建一个用于关闭原始窗口的链接：\n   ```html\n   <a href=\"#\"\
  >关闭原始窗口</a>\n   ```\n\n![Image 324](img/index-288_1.jpg)\n![Image 325](img/index-288_2.jpg)\n\
  \n6. 在链接的`onClick`事件处理程序中，调用`window.opener`对象的`close()`方法：\n   ```html\n   <a href=\"\
  #\" onClick=\"window.opener.close();\">关闭原始窗口</a>\n   ```\n\n7. 将文件保存在步骤 2 中`window.open()`方法指定的位置。\n\
  \n\n\n\n\n**8.** 在浏览器中打开第一个文件。第二个新窗口会自动打开。第一个窗口中包含一个用于关闭新窗口的链接，如图 128-1 所示。第二个窗口中包含一个用于关闭原始窗口的链接，如图\
