  \n**图 64-1：** 显示三张随机图像。\n\n**图 64-2：** 图像可能重复。\n\n---\n\n### 任务 65：使用函数创建翻转效果\n\n\
  本任务展示如何将创建翻转图像所需的 `Image` 对象封装到一个函数中。以下步骤展示了如何创建必要的函数，并使用它为图像创建翻转效果：\n\n**1.** 在文档的头部，创建一个带有开始和结束脚本标签的脚本块：\n\
