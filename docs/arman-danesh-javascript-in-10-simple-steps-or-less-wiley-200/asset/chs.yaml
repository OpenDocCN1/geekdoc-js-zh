  \ document.write(\"Hello\"); result = window.confirm(a);\n```\n\n- 任意组合：\n\n```\n\
  var a = \"Yes\"; document.write(\"Hello\");\nresult = window.confirm(a);\n```\n\n\
  > **注意：**\n> - JavaScript 程序（或脚本）本质上是一系列按顺序或按特定顺序执行的命令。\n> - 命令没有特定的格式。它们可能像第一个示例那样赋值，可能像第二个示例那样简单地调用方法，也可能像第三个示例那样为了赋值而调用方法。但它们都是\
