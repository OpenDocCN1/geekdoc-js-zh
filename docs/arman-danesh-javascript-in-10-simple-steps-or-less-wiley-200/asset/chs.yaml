  ### 任务 211：在双框架页面中检查滚动位置\n\n`scroll distance` 与窗口的大小有关。\n\n当处理框架时，请记住框架中的父对象指的是父框架集。该对象有一个\
  \ `frames` 属性，它是一个包含框架集中所有框架对象的数组。对于两个水平框架，顶部框架将是 `frames[0]`，底部框架将是 `frames[1]`。\n\
  \n**图 211-1：** 窄窗口中的长文档。\n\n要确定滚动条的垂直位置，需要在 Internet Explorer 和 Netscape 中使用不同的技术。在\
  \ Internet Explorer 中，`body` 对象的 `scrollTop` 属性指向当前滚动位置：`document.body.scrollTop`。在\
  \ Netscape 中，`window` 对象的 `pageYOffset` 属性提供相同的信息：`window.pageYOffset`。\n\n以下步骤说明了如何利用此功能创建一个双框架\
  \ HTML 页面，其中底部框架包含用户可以滚动的文档，顶部框架包含一个按钮，用户单击该按钮可以在对话框中查看当前滚动位置：\n\n1. 创建一个新文档来保存底部框架的内容。\n\
  2. 在文档的头部，创建一个脚本块。在脚本块中，创建一个名为 `scrollCheck` 的函数，该函数不接受任何参数：\n   ```\n   function\
  \ scrollCheck() {\n   }\n   ```\n3. 在函数中，使用 `if` 语句检查用户是否在使用 Internet Explorer；这通过检查\
  \ `document.all` 是否存在来实现（在 Netscape 中不存在）。基于此，使用 `alert` 方法显示当前垂直滚动位置：\n   ```\n\
  \   function scrollCheck() {\n     if (document.all) {\n       alert(document.body.scrollTop);\n\
  \     } else {\n       alert(window.pageYOffset);\n     }\n   }\n   ```\n4. 在文档的主体中，放入大量文本，以便文档可能超出普通浏览器窗口的底部。\n\
  5. 将文件保存为 `scrollFrame.html` 并关闭。创建另一个新文件来保存顶部框架。\n6. 在文档的主体中，使用 `input` 标签创建一个按钮，并显示文本“滚动位置”。\n\
  \   ```\n   <input type=\"button\" value=\"Scroll Position\">\n   ```\n7. 为按钮添加一个\
  \ `onClick` 事件处理程序，并使用它来调用另一个框架中的 `scrollCheck` 函数：\n   ```\n   <input type=\"button\"\
  \ value=\"Scroll Position\" onClick=\"parent.frames[1].scrollCheck();\">\n   ```\n\
  8. 将文件保存为 `scrollButton.html` 并关闭。创建另一个新文件来保存框架集。\n9. 创建一个框架集，顶部框架为 `scrollButton.html`，底部框架为\
  \ `scrollFrame.html`：\n   ```\n   <frameset rows=\"50,*\">\n     <frame src=\"scrollButton.html\"\
  >\n     <frame src=\"scrollFrame.html\" id=\"mainFrame\">\n   </frameset>\n   ```\n\
  10. 保存文件并在浏览器中打开。显示两个框架。将底部框架滚动到所需位置，然后单击顶部框架中的“滚动位置”按钮。底部框架的当前滚动位置将显示在对话框中，如图 211-2\
  \ 所示。\n\n**图 211-2：** 检查底部框架的滚动位置。\n\n### 任务 212：创建展开/折叠菜单\n\n此任务展示了如何使用最少的 JavaScript\
  \ 代码快速构建一个简单的展开/折叠菜单。您将构建的菜单允许将分层菜单定义为一组嵌入的无序列表。在完全展开的形式下，菜单可能如图 212-1 所示，但可以展开或折叠层次结构中的任何树。\n\
  \n**图 212-1：** 菜单完全展开。\n\n此任务背后的原理有两个：\n\n1. 页面上的对象有父对象和子对象。如果一个对象包含在另一个对象的开始和结束标签内，则该对象是子对象。\n\
  2. 对象可以有一个名为 `display` 的样式属性，用于控制对象是否显示。\n\n**注意：**\n\n- 在父子关系中，当子对象隐藏时，子对象所占用的空间会被移除；这允许上述菜单自动折叠。`display`\
  \ 属性使用简单：没有值表示对象显示；`none` 表示对象隐藏。\n- 注意基于 `document.getElementById` 的条件使用。在 Internet\
  \ Explorer 中，此方法可用，您可以使用它来访问目标对象的 `style` 属性。但在 Netscape 中，此方法不可用，正确的操作对象是对象本身，而不是\
  \ `style` 属性。通过测试 `getElementById` 方法是否存在，您可以确定正在使用的浏览器。\n\n以下任务构建了一个包含此类展开和折叠菜单的页面：\n\
  \n1. 创建一个新文件，并在文档的头部放置一个脚本块，使用开始和结束脚本标签：\n   ```\n   <script type=\"text/javascript\"\
  >\n   </script>\n   ```\n2. 在脚本块中，创建一个名为 `toggleMenu` 的函数，该函数接受一个参数——要显示或隐藏的对象的名称：\n\
  \   ```\n   function toggleMenu(target) {\n   }\n   ```\n3. 在函数中，创建一个名为 `targetLayer`\
  \ 的变量，用于选择适当的对象来操作 `display` 样式属性：\n   ```\n   targetLayer = (document.getElementById)\
  \ ? document.getElementById(target).style : eval(\"document.\" + target);\n   ```\n\
  4. 使用条件表达式来隐藏或显示相关对象。这是通过检查 `display` 属性是否设置为 `none` 来实现的。如果是，则将属性设置为空字符串。否则，将其设置为\
  \ `none`。此逻辑的结果是，每次调用函数时，`display` 属性在 `none` 和空字符串之间切换。生成的函数如下：\n   ```\n   function\
  \ toggleMenu(target) {\n     targetLayer = (document.getElementById) ? document.getElementById(target).style\
  \ : eval(\"document.\" + target);\n     targetLayer.display = (targetLayer.display\
  \ == \"none\") ? \"\" : \"none\";\n   }\n   ```\n5. 在文档的主体中，使用无序列表创建菜单层次结构：\n  \
  \ ```\n   <ul>\n     <li>\n       Menu 1\n       <ul>\n         <li>Entry 1</li>\n\
  \         <li>Entry 2</li>\n       </ul>\n     </li>\n     <li>\n       Menu 2\n\
  \       <ul>\n         <li>Entry 1</li>\n         <li>Entry 2</li>\n       </ul>\n\
  \     </li>\n   </ul>\n   ```\n6. 在子列表的 `ul` 标签中，使用 `id` 属性分配名称，并使用 `style` 属性将\
  \ `display` 设置为 `none`。对于第一个菜单，您可以使用以下内容：\n   ```\n   <ul id=\"menu1\" style=\"\
  display:none\">\n   ```\n7. 将父列表中的条目转换为链接。每个链接应使用 `javascript:` URL 来调用 `toggleMenu`\
  \ 并传递相应子列表的名称。例如，第一个菜单的条目可能如下：\n   ```\n   <a href=\"javascript:toggleMenu('menu1');\"\
  >Menu 1</a>\n   ```\n8. 保存文件并在浏览器中打开以测试菜单。\n\n### 任务 213：仅使用文本和 CSS 创建高亮菜单——无需 JavaScript\n\
  \n有时最简单的交互式菜单是那些创建起来最省力的菜单。此任务展示了如何创建一个简单的菜单栏，当鼠标悬停在菜单项上时，菜单项会高亮显示——无需任何 JavaScript\
  \ 或其他动态脚本。相反，仅使用动态 HTML 中的层叠样式表部分。\n\n此任务依赖于样式表的有效使用。关键在于，任何样式条目（例如类）都可以定义一个特殊情况，用于当鼠标悬停在页面上的元素（作为链接）上时。例如，考虑以下简单示例：\n\
  \n```\n<head>\n  <style type=\"text/css\">\n    .item { text-decoration: none; }\n\
  \    .item:hover {text-decoration: underline; }\n  </style>\n</head>\n<body>\n \
  \ <a href=\"http://someurl\" class=\"item\">The Link</a>\n</body>\n```\n\n\n\n\n\
  \n这里创建了一个名为 `item` 的样式类。它的定义是：当使用该类的链接处于正常状态时，不会显示下划线，如图 213-1 所示。然而，当鼠标悬停在链接上时，下划线会出现。\n\
  \n**图 213-1：** 链接通常不显示下划线。\n\n## 动态用户交互\n\n### 任务 213\n\n以下步骤展示了如何创建一个由三个灰色按钮组成的菜单栏。\n\
  \n**1.** 在编辑器中创建一个新的 HTML 文档。\n\n**2.** 在文档的头部，创建一个带有开始和结束 style 标签的样式块。\n\n**3.**\
  \ 在样式块中，创建一个名为 `menuEntry` 的样式类。确保指定了该样式的高度、宽度和背景颜色。\n\n***提示***\n\n这里按钮的尺寸为 100×25\
  \ 像素，背景为灰色。此外，你可以选择设置边框样式、文本样式等。\n\n• 在定义 `menuEntry` 的样式时，你可以自由使用任何有效的样式属性和设置来实现你想要的效果。\n\
  \n```\n.menuEntry {\nwidth: 100px;\nheight: 25px;\nbackground-color: #CCCCCC;\n\
  border-style: solid;\nborder-width: 1px;\nborder-color: black;\ntext-align: center;\n\
  text-decoration: none;\ncolor: #020A33;\n}\n```\n\n**4.** 在样式块中，为 `menuEntry` 类创建一个特殊的悬停样式。该样式应改变背景和文本的颜色，以产生高亮效果：\n\
  \n```\n.menuEntry:hover {\nbackground-color: #020A33;\ncolor: yellow;\n}\n```\n\n\
  **5.** 在文档的主体中，创建三个使用 `menuEntry` 类的链接。使用 style 属性将这些链接均匀地放置在页面顶部：\n\n```\n<a href=”http://someurl/”\
  \ class=”menuEntry” style=Æ\n”top: 1; left: 1;”>Entry 1</a>\n<a href=”http://someurl/”\
  \ class=”menuEntry” style=Æ\n”top: 1; left: 52;”>Entry 2</a>\n<a href=”http://someurl/”\
  \ class=”menuEntry” style=Æ\n”top: 1; left: 103;”>Entry 3</a>\n```\n\n***交叉引用***\n\
  \n• 样式表是第 7 部分的主要主题之一。\n\n**6.** 保存文件并在浏览器中打开，以使用该菜单。\n\n![Image 504](img/index-465_1.jpg)\n\
  \n## 第 8 部分\n\n### 任务 214：使用文本、CSS 和 JavaScript 创建高亮菜单\n\n本任务展示了如何使用 JavaScript\
  \ 实现悬停效果，而不是仅仅使用 CSS。这样做的好处包括：当鼠标指针悬停在菜单项上时，可以执行任何必要的 JavaScript 代码。\n\n***注意***\n\
  \n• 注意基于 `document.getElementById` 的条件判断的使用。在 Internet Explorer 中，该方法可用，你可以用它来访问目标对象的\
  \ `style` 属性。但在 Netscape 中，该方法不可用，正确的操作对象是对象本身，而不是 `style` 属性。通过测试 `getElementById`\
  \ 方法是否存在，你可以判断当前使用的浏览器。\n\n本任务依赖于 JavaScript 中对象的 `borderStyle` 属性，它允许你在代码中以编程方式重置对象的边框样式。当设置为\
  \ `outset` 时，对象将具有三维边框，如图 214-1 所示。将属性设置为 `none` 则会移除边框。\n\n**图 214-1：** 使用三维边框高亮显示菜单元素。\n\
  \n以下步骤构建了前面展示的菜单：\n\n**1.** 创建一个新文档。\n\n**2.** 在文档的头部，创建一个样式块。在样式块中，定义一个 `menuItems`\
  \ 类，并设置所需的视觉样式。确保指定了边框颜色和大小，但将边框样式设置为 `none`：\n\n```\n<style type=”text/css”>\n\
  .menuitems {\nborder-size:2.5px;\nborder-style:none;\nborder-color:#FFF2BF;\ntext-decoration:none;\n\
  color:blue;\nfont-family:Arial,Helvetica,SANS-SERIF;\n}\n</style>\n```\n\n**3.**\
  \ 在文档的头部，创建一个带有开始和结束 script 标签的脚本块。\n\n**4.** 在脚本中，创建一个名为 `toggleMenu` 的函数。该函数应接受两个参数：`target`（包含要切换的对象名称）和\
  \ `border`（包含所需的边框样式字符串）：\n\n```\nfunction toggleMenu(target,border) {\n}\n```\n\
  \n**5.** 在函数中，定义一个名为 `targetLayer` 的变量，该变量将指向可用于操作 `target` 中指定对象的视觉样式的对象：\n\n```\n\
  targetLayer = (document.getElementById) ? Æ\ndocument.getElementById(target).style\
  \ : evalÆ\n(“document.” + target); @\n```\n\n**6.** 通过将对象的边框样式设置为 `border` 参数中指定的样式来完成函数：\n\
  \n```\nfunction toggleMenu(target,border) {\ntargetLayer = (document.getElementById)\
  \ ? Æ\ndocument.getElementById(target).style : evalÆ\n(“document.” + target);\n\
  targetLayer.borderStyle = border;\n}\n```\n\n**7.** 在文档的主体中，使用 `div` 标签创建一个层：\n\n\
  ```\n<div style=”background-color:#FFF2BF;”>\n</div>\n```\n\n**8.** 在该层内部，创建一个或多个使用\
  \ `menuItems` 类并通过 `id` 属性命名的链接。使用 `onMouseover` 和 `onMouseout` 事件处理程序调用 `toggleMenu`\
  \ 来切换边框样式：\n\n```\n<div style=”background-color:#FFF2BF;”>\n<a href=”http://someurl/”\
  \ class=”menuItems” id=Æ\n”entry1” onMouseover=”toggleMenu(‘entry1’,’outset’);”\
  \ Æ\nonMouseout=”toggleMenu(‘entry1’,’none’);”>Entry 1</a>\n&nbsp;&nbsp;\n<a href=”http://someurl/”\
  \ class=”menuItems” id=Æ\n”entry2” onMouseover=”toggleMenu(‘entry2’,’outset’);”\
  \ Æ\nonMouseout=”toggleMenu(‘entry2’,’none’);”>Entry 2</a>\n&nbsp;&nbsp;\n<a href=”http://someurl/”\
  \ class=”menuItems” id=Æ\n”entry3” onMouseover=”toggleMenu(‘entry3’,’outset’);”\
  \ Æ\nonMouseout=”toggleMenu(‘entry3’,’none’);”>Entry 3</a>\n</div>\n```\n\n***交叉引用***\n\
  \n• `div` 标签的使用在任务 169 中讨论过。\n\n**9.** 保存文件并在浏览器中打开，以测试该菜单。\n\n### 任务 215：将内容放置在屏幕外\n\
  \n使用 JavaScript，可以轻松地将内容隐藏在屏幕外，直到需要时才显示。这是使用层的可见性来隐藏和显示内容的一种替代方法。\n\n实际上，使用 JavaScript，你可以控制页面上任何元素的\
  \ `top` 和 `left` 位置。基于此，你可以使用负像素值将元素放置在屏幕顶部之外。\n\n***注释***\n\n• 注意基于 `document.getElementById`\
  \ 的条件判断的使用。在 Internet Explorer 中，该方法可用，你可以用它来访问目标对象的 `style` 属性。但在 Netscape 中，该方法不可用，正确的操作对象是对象本身，而不是\
  \ `style` 属性。通过测试 `getElementById` 方法是否存在，你可以判断当前使用的浏览器。\n\n• 要隐藏菜单，将菜单对象的 `top`\
  \ 设置为 -2000 像素。这个值应该足够大，可以隐藏任何适合屏幕的菜单。\n\n原理很简单。给定一个名为 `myObject` 的对象，你可以使用以下代码指定该对象相对于浏览器窗口的\
  \ `top` 像素位置：\n\n```\nmyObject.top = *相对于窗口顶部的像素位置*;\n```\n\n例如，如果你希望对象位于窗口顶部下方\
  \ 100 像素处，可以使用：\n\n```\nmyObject.top = 100;\n```\n\n类似地，你可以指定对象的 `left`，如下例所示，它将对象放置在浏览器窗口左侧\
  \ 2000 像素之外：\n\n```\nmyObject.left = -2000;\n```\n\n当前的问题是如何识别要应用 `top` 或 `left`\
  \ 属性的适当对象。在 Internet Explorer 中，对象有一个包含样式对象的 `style` 属性。因此，对于页面上名为 `myObject` 的对象，在\
  \ Internet Explorer 中，你需要引用 `myObject.style.top` 和\n\n\n\n\n\n`myObject.style.left`。在\
  \ Netscape 中，`top` 和 `left` 属性可以直接从对象中访问，如 `myObject.top` 和 `myObject.left`，因为大多数屏幕分辨率不超过\
  \ 2000 像素深度。\n\n以下任务展示了如何在层中显示文本，并允许用户点击链接时隐藏文本：\n\n1. 创建一个新文档。\n2. 在文档的头部，创建带有开始和结束\
  \ `script` 标签的脚本块。\n3. 在脚本中，创建一个名为 `hideLayer` 的函数，该函数接受一个参数 `target`；`target` 将表示用户点击链接时要隐藏的对象名称：\n\
  \   ```javascript\n   function hideLayer(target) {\n   }\n   ```\n4. 在函数中，创建一个名为\
  \ `targetLayer` 的变量来保存要操作的对象；这将取决于所使用的浏览器：\n   ```javascript\n   targetLayer = (document.getElementById)\
  \ ? document.getElementById(target).style : eval(\"document.\" + target);\n   ```\n\
  \   ![图片 505](img/index-468_1.jpg)\n5. 使用 `targetLayer` 对象将对象的 `top` 设置为 -2000 像素，以将其移出屏幕。函数如下所示：\n\
  \   ```javascript\n   function hideLayer(target) {\n       targetLayer = (document.getElementById)\
  \ ? document.getElementById(target).style : eval(\"document.\" + target);\n    \
  \   targetLayer.top = -2000;\n   }\n   ```\n6. 在文档的正文中，使用开始和结束 `div` 标签创建一个名为 `myLayer`\
  \ 的层：\n   ```html\n   <div id=\"myLayer\" style=\"position: absolute;\">\n   </div>\n\
  \   ```\n7. 在层中，放置任何要显示的文本，后跟一个使用 `javascript:` URL 调用 `hideLayer` 函数并传递层名称作为字符串的链接：\n\
  \   ```html\n   <div id=\"myLayer\" style=\"position: absolute;\">\n       <p>Here\
  \ is some text in a layer.</p>\n       <p><a href=\"javascript:hideLayer('myLayer')\"\
  >Click here to hide the layer</a></p>\n   </div>\n   ```\n8. 保存文件并在浏览器中打开。文本和链接出现，如图\
  \ 215-1 所示。\n   **图 215-1:** 在层中显示文本。\n9. 点击链接，层中的文本和链接消失。\n\n## 第 8 部分\n\n####\
  \ 任务 215\n\n#### 任务 216：将内容滑入视图\n\n通过扩展将对象隐藏到屏幕外的原理，可以构建一个系统，使对象从浏览器窗口外部滑入视图。思路很简单：将对象放置在屏幕外，然后逐渐改变其位置，直到它完全显示在窗口中。\n\
  \n简单的方法是将对象放置在屏幕外，然后使用循环逐像素地将对象移动到屏幕上。例如，可以使用一个简单的 `for` 循环将对象 `myObject` 从窗口顶部上方\
  \ 200 像素处移动到窗口内。\n\n问题在于循环移动速度太快，对象实际上会瞬间出现在屏幕上。因此，可能需要在对象位置的每次更改之间暂停。这可以通过 `setTimeout`\
  \ 方法实现，该方法允许调度对函数的调用。例如，以下代码使每次移动相隔十分之一秒：\n\n```javascript\nfunction moveLayer(target,\
  \ newTop) {\n    targetLayer = (document.getElementById) ? document.getElementById(target).style\
  \ : eval(\"document.\" + target);\n    targetLayer.top = newTop;\n    if (newTop\
  \ < 0) {\n        setTimeout(\"moveLayer('\" + target + \"',\" + (newTop + 1) +\
  \ \")\", 100);\n    }\n}\nmoveLayer('myObject', -200);\n```\n\n以下任务展示了使用此技术将页面文本滚动到屏幕上的完整页面：\n\
  \n1. 在编辑器中创建一个新文档。\n2. 在文档的头部，创建带有开始和结束 `script` 标签的脚本块。\n3. 在脚本中，创建一个名为 `slideSpeed`\
  \ 的变量，表示内容滑入屏幕的速度。`slideSpeed` 的值越小，内容滑动越快：\n   ```javascript\n   var slideSpeed\
  \ = 1;\n   ```\n4. 创建前面任务中概述的 `moveLayer` 函数。注意，`setTimeout` 函数中指定的时间使用 `slideSpeed`\
  \ 作为乘数来设置每次调用 `moveLayer` 函数之间的毫秒数：\n   ```javascript\n   function moveLayer(target,\
  \ newTop) {\n       targetLayer = (document.getElementById) ? document.getElementById(target).style\
  \ : eval(\"document.\" + target);\n       targetLayer.top = newTop;\n       if (newTop\
  \ < 0) {\n           setTimeout(\"moveLayer('\" + target + \"',\" + (newTop + 1)\
  \ + \")\", slideSpeed * 25);\n       }\n   }\n   ```\n   ![图片 506](img/index-470_1.jpg)\n\
  5. 在 `body` 标签中，使用 `onLoad` 事件处理程序在页面加载时调用 `moveLayer`。滑动动画将从窗口顶部上方 100 像素处开始，因为相关层最初将放置在此处：\n\
  \   ```html\n   <body onLoad=\"moveLayer('myLayer', -100);\">\n   ```\n6. 使用开始和结束\
  \ `div` 标签创建一个层，并使用 `id` 属性将层命名为 `myLayer`。\n7. 将 `div` 标签的 `style` 属性设置为绝对定位，并将层定位在窗口顶部上方\
  \ 100 像素处：\n   ```html\n   <div id=\"myLayer\" style=\"position: absolute; top:\
  \ -100;\">\n   ```\n8. 在层中放置任何所需的文本：\n   ```html\n   <div id=\"myLayer\" style=\"\
  position: absolute; top: -100;\">\n       <p>\n           Place the text of the\
  \ page here.\n           Place the text of the page here.\n           Place the\
  \ text of the page here.\n           Place the text of the page here.\n        \
  \   Place the text of the page here.\n       </p>\n   </div>\n   ```\n9. 保存文件并在浏览器中打开。最初不会显示任何内容。页面内容将逐渐向下滑入窗口，如图\
  \ 216-1 所示。最后，整个文本将显示出来，当文本到达窗口顶部时，滑动停止。\n   **图 216-1:** 内容将向下滑动。\n   ![图片 507](img/index-471_1.jpg)\n\
  \n#### 任务 217：创建滑动菜单\n\n扩展任务 216 中介绍的技术，可以创建一个在需要时滑入视图、不需要时隐藏的菜单。\n\n此任务展示了如何创建一个最初只显示一个小链接的菜单。当用户点击链接时，菜单水平滑入视图，如图\
  \ 217-2 所示。当用户完成菜单操作后，可以点击最右侧的链接隐藏菜单，菜单将向左滑回隐藏状态。\n\n**图 217-1:** 菜单在需要时滑入视图。\n\n\
  **注释：**\n- 在此任务中实现结果需要一些简单的原则：菜单将隐藏在屏幕左侧，一个函数用于将菜单滑入视图，另一个函数用于将菜单滑出视图。\n- 注意 `setTimeout`\
  \ 函数的使用。这里本质上是调度对同一函数的递归调用，并使用新的 `top` 点（比当前调用低 1 像素）重建函数参数。此过程重复，直到对象的 `top` 达到\
  \ 0 像素，即刚好在窗口内。\n- 注意基于 `document.getElementById` 的条件判断。在 Internet Explorer 中，此方法可用，并使用它访问目标对象的\
  \ `style` 属性。但在 Netscape 中，此方法不可用，正确的操作对象是对象本身而不是 `style` 属性。通过测试 `getElementById`\
  \ 方法是否存在，可以确定所使用的浏览器。\n\n\n\n\n\n以下步骤创建一个实现此菜单的页面：\n\n- 请注意，在 `if` 语句中，菜单最终定位的控制是通过比较三个变量完成的：`slideSpeed`（滑动增量之间的延迟因子；数值越小，滑动效果越快）、`menuWidth`（菜单所需的宽度，以像素为单位）和\
  \ `leftPosition`（菜单滑入窗口后应到达的左侧位置）：\n\n1. 在 HTML 文件的头部，创建一个脚本块并定义三个变量：`slideSpeed`（滑动增量之间的延迟因子；数值越小，滑动效果越快）、`menuWidth`（菜单所需的宽度，以像素为单位）和\
  \ `leftPosition`（菜单滑入窗口后应到达的左侧位置）：\n\n```\nvar slideSpeed = 1;\nvar menuWidth =\
  \ 300;\nvar leftPosition = 51;\n```\n\n- 此函数与 `showLayer` 相同，但有两个关键区别：在通过 `setTimeout`\
  \ 重新调用函数时，你将左侧位置减少 1 而不是增加；并且在 `if` 语句中，你将位置与 `menuWidth` 的负值进行比较，以确保它移出窗口足够远以被隐藏。\n\
  \n2. 创建一个名为 `showLayer` 的函数，用于将菜单滑入视图；此函数将类似于任务 216 中使用的函数。该函数接受两个参数——包含菜单的层的名称以及该层应移动到的左侧位置：\n\
  \n```\nfunction showLayer(target, newLeft) {\n    targetLayer = (document.getElementById)\
  \ ? document.getElementById(target).style : eval(\"document.\" + target);\n    targetLayer.left\
  \ = newLeft;\n    if (newLeft < leftPosition) {\n        setTimeout(\"showLayer('\"\
  \ + target + \"',\" + (newLeft + 1) + \")\", slideSpeed * 10);\n    }\n}\n```\n\n\
  - 使用标签的 `style` 属性执行以下操作：将层放置在窗口的左上角，启用绝对定位，最后设置 `z-index` 以将对象相对于其他层放置。\n\n3. 创建一个名为\
  \ `hideLayer` 的函数，用于将菜单滑出视图：\n\n```\nfunction hideLayer(target, newLeft) {\n   \
  \ targetLayer = (document.getElementById) ? document.getElementById(target).style\
  \ : eval(\"document.\" + target);\n    targetLayer.left = newLeft;\n    if (newLeft\
  \ > -menuWidth) {\n        setTimeout(\"hideLayer('\" + target + \"',\" + (newLeft\
  \ - 1) + \")\", slideSpeed * 10);\n    }\n}\n```\n\n- 使用 `style` 属性，将层放置在浏览器窗口左侧，偏移像素数等于层的宽度，并将\
  \ `z-index` 设置为 0，以将该层放置在前一个层之下。\n\n4. 在文档的正文中，使用 `div` 标签创建一个层，以显示用户用来将菜单滑入视图的链接：\n\
  \n```\n<div style=\"position: absolute; top: 0; left: 0; width: 50; background:\
  \ #020A33; z-index: 1;\">\n</div>\n```\n\n5. 在该层中，创建一个链接，当点击时调用 `showLayer` 函数；从\
  \ `menuWidth` 的负值开始移动：\n\n```\n<div style=\"position: absolute; top: 0; left: 0;\
  \ width: 50; background: #020A33; z-index: 1;\">\n    <a style=\"color: yellow;\
  \ text-decoration: none;\" href=\"javascript:showLayer('myLayer',-menuWidth);\"\
  >SHOW</a>\n</div>\n```\n\n6. 使用 `div` 标签创建一个层来容纳菜单本身。该层应命名为 `myLayer`：\n\n```\n\
  <div id=\"myLayer\" style=\"position: absolute; top: 0; left: -300; width: 300;\
  \ background: #CCCCCC; color: black; z-index: 0;\">\n</div>\n```\n\n7. 在该层中，创建你的菜单并包含一个使用\
  \ `javascript:` URL 调用 `hideLayer` 函数的链接，以便用户可以隐藏菜单：\n\n```\n<div id=\"myLayer\"\
  \ style=\"position: absolute; top: 0; left: -300; width: 300; background: #CCCCCC;\
  \ color: black; z-index: 0;\">\n    My Menu Goes Here. Place all links here.\n \
  \   <a style=\"text-decoration: none;\" href=\"javascript:hideLayer('myLayer',leftPosition);\"\
  >HIDE</a>\n</div>\n```\n\n8. 保存文件并在浏览器中打开以使用菜单。\n\n### 任务 218\n\n此任务扩展了任务 211 中概述的读取页面滚动位置的能力，并提供了一种简单的机制，使页面在加载后自动从顶部滚动到底部。此任务基于一个原则：滚动位置不仅可以读取，还可以写入。\n\
  \n在 Internet Explorer 中，滚动位置通过 `document.body.scrollTop` 属性控制，而在 Netscape 中，则通过\
  \ `window.pageYOffset` 控制。\n\n- 比较 `newScroll` 和 `origScroll` 背后的理念是：即使当前滚动位置增加了\
  \ 1，如果页面已到达底部，滚动位置值实际上也不会改变。\n\n以下步骤设置一个页面，该页面在加载后自动从顶部滚动到底部：\n\n1. 创建一个新文档，并在文档的头部放置一个脚本块：\n\
  \n```\n<script language=\"JavaScript\">\n</script>\n```\n\n- `setTimeout` 函数允许你安排一个函数或方法调用在将来执行。该函数接受两个参数：要调用的函数或方法调用，以及执行该函数调用前等待的毫秒数。\n\
  \n2. 在脚本中，创建一个名为 `scrollPage` 的函数，该函数不接受任何参数。此函数将滚动条向下移动 1 像素，如果页面尚未到达底部，它将再次调用自身以进一步向下移动滚动条：\n\
  \n```\nfunction scrollPage() {\n}\n```\n\n3. 通过创建变量 `origScroll` 和 `newScroll` 来开始滚动，以便稍后在函数中保存值：\n\
  \n```\nvar origScroll = 0;\nvar newScroll = 0;\n```\n\n4. 测试 `document.all` 是否存在，以确定浏览器是否为\
  \ Internet Explorer：\n\n```\nif (document.all) {\n```\n\n5. 如果浏览器是 Internet Explorer，首先将当前滚动位置存储在\
  \ `origScroll` 中，然后将 `document.body.scrollTop` 加 1 以将滚动条向下移动 1 像素，最后将新的滚动位置存储在 `newScroll`\
  \ 中：\n\n```\nif (document.all) {\n    origScroll = document.body.scrollTop;\n  \
  \  document.body.scrollTop += 1;\n    newScroll = document.body.scrollTop;\n}\n\
  ```\n\n![Image 508](img/index-474_1.jpg)\n\n6. 如果浏览器是 Netscape，则执行与 Internet Explorer\
  \ 相同的步骤，但使用 `window.pageYOffset` 作为滚动位置：\n\n```\nif (document.all) {\n    origScroll\
  \ = document.body.scrollTop;\n    document.body.scrollTop += 1;\n    newScroll =\
  \ document.body.scrollTop;\n} else {\n    origScroll = window.pageYOffset;\n   \
  \ window.pageYOffset += 1;\n    newScroll = window.pageYOffset;\n}\n```\n\n7. 测试\
  \ `newScroll` 是否大于 `origScroll`。如果是，则说明滚动尚未到达页面底部，并使用 `setTimeout` 安排对 `scrollPage`\
  \ 函数的新调用：\n\n```\nif (newScroll > origScroll) {\n    setTimeout(\"scrollPage()\"\
  , 25);\n}\n```\n\n8. 在 `body` 标签中，使用 `onLoad` 事件处理程序在页面加载时调用 `scrollPage` 函数：\n\n\
  ```\n<body onLoad=\"scrollPage()\">\n```\n\n9. 在文档正文中放置页面的任何文本，并保存页面。\n\n10. 在浏览器中加载页面，它将自动开始滚动，如图\
