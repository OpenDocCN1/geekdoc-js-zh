  <script language=\"JavaScript\">\n<!--\n// -->\n</script>\n```\n\n4. 创建一个名为 `hello`\
  \ 的函数，它不接受任何参数：\n```\nfunction head() {\n}\n```\n\n5. 在函数中，使用 `document.write` 向浏览器输出“Hello”：\n\
  ```\ndocument.write(\"Hello\");\n```\n\n6. 使用开始和结束的 body 标签创建文档的主体：\n```\n<body>\n\
  </body>\n```\n\n7. 在文档主体中插入一个脚本块：\n```\n<script language=\"JavaScript\">\n<!--\n\
