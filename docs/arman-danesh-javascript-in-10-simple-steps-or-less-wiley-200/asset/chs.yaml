  \   </script>\n   </body>\n   ```\n7. 保存文件并关闭。\n\n#### 任务 14：执行数学运算\n\n在 JavaScript\
  \ 中处理数值时，你可以对数字进行数学运算。你不仅可以进行加、减、乘、除，还可以执行其他高级数学计算。\n\n四种基本数学运算如下：\n\n- **加法：**\
