  \n### 任务 178：使用 CSS 控制绝对定位\n\n（原文中未提供此任务的内容。）\n\n\n\n\n\n### 任务 178：使用 CSS 控制绝对定位\n\
  \n随着浏览器对层叠样式表的支持不断改进，网页设计师通过动态 HTML 控制页面外观各个方面的能力也随之增强。\n\n**注释**\n\n- 动态 HTML 是\
  \ JavaScript、层叠样式表和文档对象模型的结合，它们共同使得构建在浏览器中运行的复杂交互式用户界面和应用程序成为可能。\n- 图层通过 `div` 标签创建，并且可以包含任何有效的\
  \ HTML 内容。它们只是 HTML 的容器，你可以对整个图层应用样式。\n- 使用绝对定位时，图层的顺序实际上并不重要。在此示例中，第二个图层在页面流中视觉上出现在第一个图层之前。\n\
  \n可以通过样式表控制的页面外观方面之一是图层的放置。你可以使用 `position: absolute` 样式设置以绝对方式放置图层。然后使用 `left`\
  \ 和 `top` 样式属性来指定图层相对于浏览器窗口文档区域左上角的位置。通常，你会以像素为单位设置这些值。例如，考虑以下图层：\n\n```\n<div style=\"\
  position: absolute; left: 100px; right: 100px;\"> 文本放在这里 </div>\n```\n\n这将使文本位于左上角下方\
  \ 100 像素和右侧 100 像素的位置，如图 178-1 所示。\n\n**图 178-1：** 更改图层定位。\n\n以下任务通过显示两个绝对定位的图层来说明绝对定位：\n\
  \n1. 在你喜欢的编辑器中创建一个新的 HTML 文档。\n2. 在文档的正文中，创建一个包含文本的图层，并将其放置在距左上角 200 像素的位置：\n\n\
  ```\n<div style=\"position: absolute; top: 200px; left: 200px;\">此文本放置在距窗口顶部 200\
  \ 像素、左侧 300 像素的位置</div>\n```\n\n![Image 432](img/index-392_1.jpg)\n\n3. 创建另一个包含文本的图层，并将其放置在左上角。最终页面应如清单\
  \ 178-1 所示。\n\n```\n<body>\n<div style=\"position: absolute; top: 200px; left: 200px;\"\
  >此文本放置在距窗口顶部 200 像素、左侧 300 像素的位置</div>\n<div style=\"position: absolute; top: 0px;\
  \ left: 0px;\">此文本放置在窗口的左上角</div>\n</body>\n```\n\n**清单 178-1：** 控制图层定位。\n\n4. 保存文件并关闭。\n\
  5. 在浏览器中打开该文件，你应该会看到两个图层，如图 178-2 所示。\n\n**图 178-2：** 使用绝对定位控制图层定位。\n\n**交叉引用**\n\
  \n- 有关控制图层顺序的更多信息，请参见任务 173。\n\n---\n\n### 任务 179：使用 CSS 控制相对定位\n\n随着浏览器对层叠样式表的支持不断改进，网页设计师通过动态\
  \ HTML 控制页面外观各个方面的能力也随之增强。\n\n**注释**\n\n- 动态 HTML 是 JavaScript、层叠样式表和文档对象模型的结合，它们共同使得构建在浏览器中运行的复杂交互式用户界面和应用程序成为可能。\n\
  - 使用相对定位时，图层的顺序确实很重要。在此示例中，如果你在文件中交换图层和段落的位置，最终结果将会不同。\n\n可以通过样式表控制的页面外观方面之一是图层的放置。图层通过\
  \ `div` 标签创建，并且可以包含任何有效的 HTML 内容。它们只是 HTML 的容器，你可以对整个图层应用样式。\n\n你可以使用 `position:\
  \ relative` 样式设置以相对方式放置图层。这意味着你指定的任何定位都是相对于图层在文档中根据其在 HTML 流中的位置通常应出现的位置。\n\n然后使用\
  \ `left` 和 `top` 样式属性来指定图层相对于其在文档流中正常位置的位置。通常，你会以像素为单位设置这些值。例如，考虑以下图层：\n\n```\n\
  <div style=\"position: relative; left: 100px; right: 100px;\"> 文本放在这里 </div>\n```\n\
  \n以下任务通过创建一个以段落开头、随后跟随一个相对定位图层的文档来说明相对定位：\n\n1. 在你喜欢的编辑器中创建一个新的 HTML 文档。\n2. 在文档的正文中，创建一个段落：\n\
  \n```\n<p>\n这里有一些文本\n</p>\n```\n\n3. 创建一个相对定位的图层，放在段落之后。最终页面应如清单 179-1 所示。\n\n![Image\
  \ 433](img/index-394_1.jpg)\n\n```\n<body>\n<p>这里有一些文本</p>\n<div style=\"position:\
  \ relative;\nleft: 50px;\ntop: 100px;\">\n此文本相对于前面的文本缩进 50 像素，并向下移动 100 像素\n</div>\n\
  </body>\n```\n\n**清单 179-1：** 控制图层定位。\n\n4. 保存文件并关闭。\n5. 在浏览器中打开该文件，你应该会看到两个图层，如图\
  \ 179-1 所示。\n\n**图 179-1：** 使用相对定位控制图层定位。\n\n**交叉引用**\n\n- 相对定位也可用于创建阴影。有关阴影的更多信息，请参见任务\
  \ 169 至 172。\n\n---\n\n### 任务 180：使用 CSS 调整边距\n\n随着浏览器对层叠样式表的支持不断改进，你通过动态 HTML 控制页面外观各个方面的能力也随之增强。可以通过样式表控制的页面外观方面之一是图层的边距。\n\
  \n要理解边距及其在样式表中的含义，你需要了解层叠样式表中使用的盒模型。盒模型定义了图层的外部组件，如图 180-1 所示。\n\n**注释**\n\n- 图层通过\
  \ `div` 标签创建，并且可以包含任何有效的 HTML 内容。它们只是 HTML 的容器，你可以对整个图层应用样式。\n- 当你使用 `margin` 属性指定所有四个边距宽度时，第一个值是上边距，然后按顺时针顺序依次是右边距、下边距，最后是左边距。\n\
  - 此处带有边框的外层仅用于视觉展示。它让你能够看到边距作为内层可见边缘与边框之间的空间（参见步骤 2）。\n- 内层具有背景色，以显示图层可见部分的结束位置和边距的开始位置（参见步骤\
  \ 3）。\n- 默认情况下，图层没有边距；因此如果你不需要边距，则无需指定任何与边距相关的样式属性（参见步骤 5）。\n\n**图 180-1：** CSS\
  \ 盒模型。\n\n你可以通过以下几种方式之一控制边距的宽度：\n\n- 使用 `margin` 属性为所有边设置相同的边距宽度。以下代码在图层所有边上创建 5\
  \ 像素的边距：\n\n```\n<div style=\"margin: 5px;\">\n文本放在这里\n</div>\n```\n\n- 使用 `margin`\
  \ 属性为不同边设置不同的宽度：\n\n```\n<div style=\"margin: 5px 10px 15px 20px;\">\n文本放在这里\n</div>\n\
  ```\n\n- 分别使用 `margin-top`、`margin-bottom`、`margin-right` 和 `margin-left` 属性单独指定不同的边距。\n\
  \n\n\n\n\n## DHTML 与样式表\n\n### 任务 180：使用边距\n\n例如，以下代码仅在层的顶部和右侧创建边距：\n\n```html\n\
  <div style=\"margin-top: 5px; margin-right: 5px;\"> 文本在此处\n</div>\n```\n\n![Image\
  \ 434](img/index-396_1.jpg)\n\n以下任务通过显示具有两种不同边距设置的同一层来说明边距的工作方式：\n\n1. 在文档的正文中，创建一个带边框的层：\n\
  \n```html\n<div style=\"border-style: solid; border-width: 1px;\">\n</div>\n```\n\
  \n2. 在此层中，创建另一个带边距的层：\n\n```html\n<div style=\"background-color: #cccccc; margin:\
  \ 10px;\">10 像素边距</div>\n```\n\n3. 创建另一个带边框的层，并在其内部创建一个没有边距的层，使最终页面看起来如清单 180-1\
  \ 所示。\n\n```html\n<body>\n<div style=\"border-style: solid; border-width: 1px;\"\
  >\n<div style=\"background-color: #cccccc; margin: 10px;\">10 像素边距</div>\n</div>\n\
  <br>\n<div style=\"border-style: solid; border-width: 1px;\">\n<div style=\"background-color:\
  \ #cccccc;\">无边距</div>\n</div>\n</body>\n```\n\n**清单 180-1：** 使用边距。\n\n4. 保存文件并关闭。\n\
  5. 在浏览器中打开文件，您应该会看到两个层，如图 180-2 所示。\n\n**图 180-2：** 控制边距。\n\n### 任务 181：应用内联样式\n\
  \n使用层叠样式表，有多种方式可以将样式应用于文本。一种方式是使用内联样式定义。这些定义允许您在任意 HTML 标签的 `style` 属性中指定样式。\n\n\
  例如，您可以专门为一个段落指定 `style` 属性：\n\n*注*\n- `div` 标签中的样式定义将应用于该层的所有内容，除非被层内的设置覆盖。因此，级别标题将保留其正常字体和大小，但会采用样式定义中指定的颜色。\n\
  \n```html\n<p style=\"style definition\">一个段落</p>\n```\n\n类似地，您可以为包含大量 HTML 的层指定样式设置：\n\
  \n```html\n<div style=\"style definition\">大量 HTML</div>\n```\n\n最后，您可以指定内联样式来覆盖仅针对给定文本范围的样式，如下所示：\n\
  \n- 层内 span 块的样式将覆盖 `div` 标签中指定的颜色，仅针对该文本跨度中包含的文本。\n\n```html\n<p>\n这是文本，而<span\
  \ style=\"style definition\">这是内联</span>\n</p>\n```\n\n以下任务说明了内联样式分配的使用：\n\n1. 在您喜欢的编辑器中创建一个新的\
  \ HTML 文档。\n2. 在文档的正文中，创建一个一级标题：\n\n```html\n<h1>一个风格化的标题</h1>\n```\n\n3. 将样式应用于标题：\n\
  \n```html\n<h1 style=\"font-family: Arial; font-size: 18px;\">一个风格化的标题</h1>\n```\n\
  \n4. 在标题之后，创建一个包含一些 HTML 的层：\n\n```html\n<div>\n<h1>一个层</h1>\n这个层有<strong>样式</strong>。它还有一些内联文本。\n\
  </div>\n```\n\n5. 向该层添加样式规范：\n\n```html\n<div style=\"background-color: #cccccc;\
  \ color: red;\">\n<h1>一个层</h1>\n这个层有<strong>样式</strong>。它还有一些内联文本。\n</div>\n```\n\
  \n![Image 435](img/index-398_1.jpg)\n\n6. 使用 `span` 标签为层中的部分文本指定样式定义，使最终文档看起来如清单\
  \ 181-1 所示。\n\n```html\n<body>\n<h1 style=\"font-family: Arial; font-size: 18px;\"\
  >一个风格化的标题</h1>\n<div style=\"background-color: #cccccc; color: red;\">\n<h1>一个层</h1>\n\
  这个层有<strong>样式</strong>。它还有一些<span style=\"color: white; background-color: black;\"\
  >内联文本</span>。\n</div>\n</body>\n```\n\n**清单 181-1：** 使用内联样式定义。\n\n7. 保存文件并关闭。\n\
  8. 在浏览器中打开文件以查看样式，如图 181-1 所示。\n\n*交叉引用*\n- 您可以设置多种不同的样式值。例如，任务 174 和 175 向您展示如何设置某些文本特性，任务\
  \ 176 向您展示如何控制对齐。\n\n**图 181-1：** 应用内联样式。\n\n### 任务 182：使用文档样式表\n\n使用层叠样式表，有多种方式可以将样式应用于文本。一种方式是使用在文档头部指定的样式表。然后您可以在整个文档中引用并重用这些样式。\n\
  \n文档样式表在文档头部的 `<style>` 开始和结束标签之间指定：\n\n*注*\n- 您可以根据需要将任意多个不同的样式定义组合到一个样式表中。\n-\
  \ 您必须在 `style` 标签中指定 `type`，并且类型应始终为 `text/css`。\n\n```html\n<head>\n<style type=\"\
  text/css\">\n</style>\n</head>\n```\n\n要构建样式表，只需在 `style` 块中定义样式。您可以定义三种类型的样式定义：\n\
  \n- HTML 元素定义，为不同的 HTML 元素（即不同的 HTML 标签）指定默认样式\n- 类定义，可以通过 `class` 属性应用于任何 HTML\
  \ 标签\n- ID 定义，应用于任何具有匹配 ID 的页面元素\n\n- 使用类会覆盖 HTML 元素的任何现有默认值。因此，浏览器为一级标题使用的默认字体、大小等在此情况下将被完全忽略，只有指定的样式规则会影响标题的视觉外观。\n\
  \n以下步骤向您展示如何在文档中创建样式表，然后使用这些样式：\n\n1. 在新文档的头部，创建一个 `style` 块：\n\n```html\n<style\
  \ type=\"text/css\">\n</style>\n```\n\n2. 在 `style` 块中，为 `p` 标签创建一个样式定义：\n\n```css\n\
  P {\n  font-family: Arial, Helvetica, SANS-SERIF;\n  color: #ff0000;\n}\n```\n\n\
  3. 接下来，为 `myClass` 类创建一个样式定义：\n\n```css\n.myClass {\n  font-size: 24pt;\n  font-style:\
  \ italic;\n}\n```\n\n4. 最后，为具有 `myID` ID 的元素创建一个样式定义：\n\n```css\n#myID { background-color:\
  \ #cccccc; }\n```\n\n5. 在文档的正文中，创建一个一级标题并将 `myClass` 类应用于它：\n\n```html\n<h1 class=\"\
  myClass\">这是一个标题</h1>\n```\n\n![Image 436](img/index-400_1.jpg)\n\n6. 创建一个段落：\n\n\
  ```html\n<p>这是一个普通的段落。</p>\n```\n\n7. 最后，创建一个 ID 为 `myID` 的层，并在其中放置一些 HTML，使最终页面看起来如清单\
  \ 182-1 所示。\n\n```html\n<head>\n<style type=\"text/css\">\nP { font-family: Arial,\
  \ Helvetica, SANS-SERIF;\n    color: #ff0000; }\n.myClass { font-size: 24pt;\n \
  \          font-style: italic; }\n#myID { background-color: #cccccc; }\n</style>\n\
  </head>\n<body>\n<h1 class=\"myClass\">这是一个标题</h1>\n<p>这是一个普通的段落。</p>\n<div id=\"\
  myID\">\n这个层的 ID 是 myID。\n</div>\n</body>\n```\n\n**清单 182-1：** 使用文档样式表。\n\n8. 保存文件并关闭。\n\
  9. 在浏览器中打开文件，您现在会看到文档样式应用于显示的文本，如图 182-1 所示。\n\n*交叉引用*\n- 在任务 183 中，您将学习如何创建可供多个文档使用的全局样式表文件。\n\
  - 任务 190 展示了如何使用 JavaScript 操作样式表设置。任务 189 展示了如何使用 JavaScript 访问这些设置。\n\n**图 182-1：**\
  \ 使用文档样式表。\n\n### 任务 183：创建全局样式表文件\n\n通常，您不仅希望在同一页面的不同元素中重用样式，还希望在不同的文档中使用相同的样式定义。您可以通过在全局样式表文件中定义样式，然后将该文件包含在站点中需要使用这些样式的任何文档中来实现这一点。\n\
  \n\n\n\n\n### 任务 183：DHTML 与样式表\n\n**注意：**\n\n- 你可以根据需要将任意多个定义合并到一个样式表文件中。\n- 通常，你会将样式表文件保存为\
  \ `.css` 扩展名。\n- HTML 元素定义，为不同的 HTML 元素（即不同的 HTML 标签）指定默认样式。例如，以下定义为 HTML 中的一级标题定义了样式：\n\
  \  ```css\n  h1 {\n    font-family: Arial, Helvetica, SANS-SERIF;\n    font-size:\
  \ 18px;\n  }\n  ```\n- 类定义，可通过所有标签共有的 `class` 属性应用于任何 HTML 标签：\n  ```css\n  .className\
  \ {\n    font-family: Arial, Helvetica, SANS-SERIF;\n    font-size: 18px;\n  }\n\
  \  ```\n- 标识定义，适用于任何具有匹配 ID 的页面元素：\n  ```css\n  #ID {\n    font-family: Arial, Helvetica,\
  \ SANS-SERIF;\n    font-size: 18px;\n  }\n  ```\n\n一旦你有了样式表文件，将其包含到文档中最简单的方法是在文档头部使用\
  \ `link` 标签：\n\n```html\n<link rel=\"stylesheet\" href=\"样式表文件路径\">\n```\n\n以下步骤展示了如何创建一个全局样式表文件，然后将其包含到\
  \ HTML 文件中并使用：\n\n1. 在你喜欢的编辑器中创建一个新文档。该文件将成为样式表文件。\n2. 在文件中，为 `p` 标签创建一个样式定义：\n\
  \   ```css\n   P { background-color: #cccccc;\n   font-size: 24pt; }\n   ```\n3.\
  \ 在文件中，还要为名为 `myClass` 的类创建一个样式定义：\n   ```css\n   .myClass {\n     font-weight:\
  \ bold;\n     font-family: Arial, Helvetica, SANS-SERIF;\n   }\n   ```\n   ![Image\
  \ 437](img/index-402_1.jpg)\n4. 将文件保存为 `style.css`。\n5. 在一个新的 HTML 文件中，在头部创建一个 `link`\
  \ 标签以包含你刚刚保存的样式表文件：\n   ```html\n   <head>\n   <link rel=\"stylesheet\" href=\"\
  style.css\">\n   </head>\n   ```\n6. 在文档正文中，创建一个普通的文本段落：\n   ```html\n   <p>This\
  \ is a paragraph with some style.</p>\n   ```\n7. 在该段落之后，添加一个使用 `myClass` 类的层，使最终页面看起来如清单\
  \ 183-1 所示。\n   ```html\n   <head>\n   <link rel=\"stylesheet\" href=\"style.css\"\
  >\n   </head>\n   <body>\n   <p>This is a paragraph with some style.</p>\n   <div\
  \ class=\"myClass\">This is a layer with some style.</div>\n   </body>\n   ```\n\
  \   **清单 183-1：** 使用全局样式表文件。\n8. 保存文件并关闭。\n9. 打开 HTML 文件，你应该会看到全局样式表中的样式已应用到文档中，如图\
  \ 183-1 所示。\n\n**交叉引用：**\n\n- 参见任务 184，了解如何覆盖已设置的样式。\n\n**图 183-1：** 全局样式表中的样式应用于你的文档。\n\
  \n### 任务 184：为局部实例覆盖全局样式表\n\n通常，你不仅希望在不同页面元素上复用样式，还希望在不同文档中使用相同的样式定义。你可以通过在全局样式表文件中定义样式，然后将该文件包含到站点中需要使用这些样式的任何文档中来实现这一点。\n\
  \n**注意：**\n\n- 通常，你会将样式表文件保存为 `.css` 扩展名。\n- 你可以根据需要将任意多个定义合并到一个样式表文件中。\n- HTML\
  \ 元素定义，为不同的 HTML 元素（即不同的 HTML 标签）指定默认样式。\n- 类定义，可通过所有标签共有的 `class` 属性应用于任何 HTML\
  \ 标签。\n- 标识定义，适用于具有匹配 ID 的页面元素。\n\n一旦你有了样式表文件，将其包含到文档中最简单的方法是在文档头部使用 `link` 标签：\n\
  \n```html\n<link rel=\"stylesheet\" href=\"样式表文件路径\">\n```\n\n然后你可以在文档中使用这些样式，同时也可以通过在任何标签中使用\
  \ `style` 属性来根据需要覆盖单个样式属性。例如，以下层使用了一个样式类，但随后指定了一个局部字体大小，该大小会覆盖类中可能指定的任何字体大小：\n\n\
  ```html\n<div class=\"类名\" style=\"font-size: 24pt;\"> 文本内容 </div>\n```\n\n以下步骤展示了如何创建一个全局样式表文件，然后将其包含到\
  \ HTML 文件中并使用，并覆盖单个样式属性：\n\n1. 在一个新文件中，为 `p` 标签创建一个样式定义：\n   ```css\n   P { background-color:\
  \ #cccccc;\n   font-size: 24pt; }\n   ```\n2. 在文件中，还要为名为 `myClass` 的类创建一个样式定义：\n\
  \   ```css\n   .myClass {\n     font-weight: bold;\n     font-family: Arial, Helvetica,\
  \ SANS-SERIF;\n   }\n   ```\n3. 将文件保存为 `style.css`。这将是你的样式表文件。\n4. 在一个新的 HTML 文件中，在头部创建一个\
  \ `link` 标签以包含你刚刚保存的样式表文件：\n   ```html\n   <head><link rel=\"stylesheet\" href=\"\
  style.css\"></head>\n   ```\n   ![Image 438](img/index-404_1.jpg)\n5. 在文档正文中，创建一个普通的文本段落：\n\
