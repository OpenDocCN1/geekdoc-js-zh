  \n![图片 234](img/index-195_1.jpg)\n\n---\n\n### 任务 83：以编程方式填充选择列表\n\n你可以通过 JavaScript\
  \ 动态地向选择列表添加条目，而无需在 HTML 中使用 `option` 标签来创建选择条目。原理很简单。选择列表对象有一个 `length` 属性，表示选择列表中的条目数。将该值增加\
  \ 1 会在列表末尾创建一个空条目，如图 83-1 所示。\n\n***注释***\n- 这里的关键点：`length` 属性包含列表中的元素数量。例如，如果有三个元素，则值为\
  \ 3。但是，`options` 数组（与所有数组一样）从零开始计数。因此，最后一个（第三个）元素的索引是 2。在通过 JavaScript 动态操作选择列表时，需要牢记这一点。\n\
  - 使用简写形式的 `++` 运算符会将其前面的操作数增加 1。例如，`a++` 等同于 `a = a + 1`。\n- `text` 属性用于保存将在表单上显示的文本。`value`\
  \ 属性用于保存条目的值。\n\n**图 83-1：** 向选择列表添加新条目。\n\n创建新条目后，使用选择列表的 `options` 属性为新条目分配显示文本和值。该属性是一个数组，其中每个元素对应一个对象。每个对象都有\
  \ `text` 和 `value` 属性。要为条目填充值，可以使用以下代码：\n\n```\ndocument.formName.selectionObject.options[新条目的索引].text\
  \ = \"显示文本\";\ndocument.formName.selectionObject.options[新条目的索引].value = \"条目值\"\
  ;\n```\n\n以下任务创建了一个包含两个条目的选择列表的表单，并紧接着使用 JavaScript 代码创建第三个元素：\n\n**1.** 在你喜欢的编辑器中创建一个新文档。\n\
