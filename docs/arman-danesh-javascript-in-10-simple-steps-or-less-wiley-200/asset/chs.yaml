  \ 168-1 所示。\n\n**图 168-1：** 更改行间距\n\n***注释***\n- 动态 HTML 是 JavaScript、层叠样式表和文档对象模型的组合，它们共同使得构建在浏览器中运行的复杂交互式用户界面和应用程序成为可能。\n\
