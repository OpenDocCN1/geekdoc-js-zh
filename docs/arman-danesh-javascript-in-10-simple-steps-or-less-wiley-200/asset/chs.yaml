  \ JavaScript 代码的框架中导航离开文档，则可能会失去对 JavaScript 代码的访问权限。\n- `parent.codeFrame.functionName`\
  \ 引用的工作方式如下：从当前框架内部，`parent` 指向包含框架集的窗口的 window 对象。在该 window 对象中，`codeFrame` 指向隐藏框架。\n\
  \n1. 创建一个新的 HTML 文档来存放框架集，并创建一个框架集块，将 `cols` 属性设置为创建两个等宽的列：\n\n```html\n<frameset\
  \ cols=”0,50%,*”>\n```\n\n2. 在框架集中，创建一个框架标签，用于加载包含 JavaScript 代码的文档到隐藏框架。\n\n\n\n\
