  \n**图 5-1：** 只有不属于注释的 JavaScript 代码才会被执行。\n\n### 任务 6：编写 JavaScript 命令\n\n在之前的任务中，你已经看到了\
  \ JavaScript 命令的示例。所有 JavaScript 脚本都由一系列命令组成。在最基本的形式中，命令是一组以分号结尾的 JavaScript 代码。例如，以下所有内容都可以被视为命令：\n\
