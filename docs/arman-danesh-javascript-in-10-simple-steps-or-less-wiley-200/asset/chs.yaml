  alert('Over the Æ 59 Image');\"><br>\n<a href=\"#\" onMouseOver=\"window.alert('Over\
  \ the Æ Link');\"><img src=\"image2.jpg\"></a>\n</body>\n```\n\n**6.** 将代码保存为 HTML\
  \ 文件，并在浏览器中打开该文件。页面将如图 59-1 所示。\n\n**图 59-1：** 显示两张图像。\n\n**7.** 将鼠标指针移到第一张图像上，将出现一个如图\
  \ 59-2 所示的对话框。将鼠标移到第二张图像上，将出现一个提示您位于链接上的对话框。\n\n**图 59-2：** 当鼠标移到图像上时显示对话框。\n\n\
  ### 检测图像上的点击事件\n\n与指定代码响应 `onMouseOver` 事件（参见任务 59）的方式类似，您可以指定仅在用户点击图像时执行的操作。这通过\
  \ `img` 标签或 `a` 标签的 `onClick` 事件处理程序实现，具体取决于情况。\n\n您可以为 `img` 标签指定 `onClick` 属性：\n\
  \n```html\n<img src=\"image file\" onClick=\"JavaScript code\">\n```\n\n当您将图像用作链接时（例如在菜单中作为按钮的图像），通常将\
  \ `onClick` 属性放在包含 `img` 标签的 `a` 标签中：\n\n```html\n<a href=\"*URL*\" onClick=\"*JavaScript\
