  \n### 任务 257：在 JavaScript 中更改图层顺序\n\n任务 254 展示了如何使用样式属性控制图层的堆叠顺序。然而，一旦页面渲染完成，除非使用\
  \ JavaScript，否则无法调整这些样式属性。\n\n例如，考虑以下图层：\n\n```html\n<div id=\"mylayer\" style=\"\
  z-index: 1;\">此图层的堆叠顺序为 1</div>\n```\n\n你可以通过以下代码将 `z-index` 值更改为 2：\n\n```javascript\n\
  document.getElementById(\"myLayer\").style.zIndex = 2;\n```\n\n> **注意：** 仅重置一个图层的堆叠顺序不会改变其他页面元素的堆叠顺序。要像本例中那样使图层在堆叠中翻转位置，你需要同时更改两个图层的堆叠顺序位置。\n\
  \n以下任务创建两个重叠的图层；每个图层都有一个链接，点击后将该图层置于堆叠顶部：\n\n1. 在新文档头部的脚本中，创建一个名为 `swapLayer` 的函数，该函数接受两个参数\
  \ `topTarget` 和 `bottomTarget`（分别表示要移到顶部和底部的图层的 ID）：\n\n   ```javascript\n   function\
  \ swapLayer(topTarget, bottomTarget) {\n   ```\n\n\n\n\n\n### 跨浏览器兼容性与问题\n\n###\
  \ 任务 257：使用 JavaScript 更改层叠顺序\n\n**2.** 在函数中，将目标顶层元素的层叠顺序设置为 2：`document.getElementById(topTarget).style.zIndex\
  \ = 2;`  \n**3.** 将目标底层元素的层叠顺序设置为 1：`document.getElementById(bottomTarget).style.zIndex\
  \ = 1;`  \n**4.** 在文档主体中，创建一个名为 `firstLayer` 的层，其层叠顺序为 1：\n\n```html\n<div id=\"\
  firstLayer\" style=\"position: absolute; left: 10px; top: 10px; width: 100px; height:\
  \ 100px; background-color: yellow; z-index: 1;\">\n```\n\n**5.** 在该层中，创建一个链接，用于调用\
  \ `swapLayer` 函数，该函数旨在将该层移至堆栈顶部；将 `'firstLayer'` 作为第一个参数，`'secondLayer'` 作为第二个参数：\n\
  \n```html\n<p><a href=\"javascript:swapLayer('firstLayer','secondLayer')\">移至顶部</a></p>\n\
  ```\n\n**6.** 创建第二个名为 `secondLayer` 的层，其层叠顺序为 2：\n\n```html\n<div id=\"secondLayer\"\
  \ style=\"position: absolute; left: 60px; top: 60px; width: 100px; height: 100px;\
  \ background-color: lightgrey; z-index: 2;\">\n```\n\n**7.** 在该层中，创建一个链接，用于调用 `swapLayer`\
  \ 函数，该函数旨在将该层移至堆栈顶部；将 `'secondLayer'` 作为第一个参数，`'firstLayer'` 作为第二个参数。最终页面应如清单 257-1\
  \ 所示。\n\n```html\n<head>\n<script language=\"JavaScript\">\nfunction swapLayer(topTarget,bottomTarget)\
  \ {\n    document.getElementById(topTarget).style.zIndex = 2;\n    document.getElementById(bottomTarget).style.zIndex\
  \ = 1;\n}\n</script>\n</head>\n<body>\n<div id=\"firstLayer\" style=\"position:\
  \ absolute; left: 10px; top: 10px; width: 100px; height: 100px; background-color:\
  \ yellow; z-index: 1;\">\n<p><a href=\"javascript:swapLayer('firstLayer','secondLayer')\"\
  >移至顶部</a></p>\n</div>\n<div id=\"secondLayer\" style=\"position: absolute; left:\
  \ 60px; top: 60px; width: 100px; height: 100px; background-color: lightgrey; z-index:\
  \ 2;\">\n<p><a href=\"javascript:swapLayer('secondLayer','firstLayer')\">移至顶部</a></p>\n\
  </div>\n</body>\n```\n\n**清单 257-1：** 使用 JavaScript 更改层叠顺序。\n\n**8.** 保存文件并关闭。在浏览器中打开该文件，您将看到两个重叠的层。\n\
  \n**9.** 单击底层中的“移至顶部”链接，该层将移至堆栈顶部。单击另一层中的“移至顶部”链接，页面应恢复到初始状态。\n\n### 任务 258：淡入淡出对象\n\
  \n在较新版本的 Internet Explorer 和 Netscape 中，提供了样式表扩展来控制页面对象的透明度。不幸的是，在 Internet Explorer\
  \ 和 Netscape 中控制透明度的方法不同。在 Internet Explorer 中，您可以通过样式定义中的以下滤镜来控制透明度：`filter:alpha(opacity=*透明度值*);`\n\
  \n***注释***\n- 透明度控制对象的淡出程度，并允许对象背后的内容透出。通过使用透明度，您可以堆叠层，并允许堆栈中较低的层以不同程度透过上方的层显示出来。\n\
  - Internet Explorer 有 `document.all` 方法；Netscape 没有。将层的 ID 传递给此方法，会像 `document.getElementById`\
  \ 一样返回该层的对象。通过检测 `document.all` 是否存在，您可以快速确定需要使用哪种方法来设置透明度。\n\n相比之下，在 Netscape 中，您按如下方式控制透明度：`-moz-opacity:\
  \ *透明度值*;`\n\n由于每个浏览器都会忽略其样式定义中不理解的属性，您实际上可以在样式中同时组合这两个样式属性。以下任务创建了两个层。提供了一个表单，允许用户调整顶层的不透明度。\n\
  \n***警告***\n- 在 Internet Explorer 中，您需要设置目标层的 `filters.alpha.opacity` 属性（即 `document.all(层\
  \ ID).filters.alpha.opacity`）。相比之下，在 Netscape 中，您需要设置层对象的 `style.MozOpacity` 属性（即\
  \ `document.getElementById(层 ID).style.MozOpacity`）。\n\n**1.** 在新文档的头部脚本块中，创建一个名为\
  \ `setOpacity` 的新函数，该函数接受两个参数（层的 ID 和以百分比表示的透明度）：\n\n```javascript\nfunction setOpacity(target,percentage)\
  \ {\n```\n\n**2.** 在函数中，检测 `document.all` 是否存在，并使用它来设置层对象的相应属性值：\n\n```javascript\n\
  if (document.all) {\n    document.all(target).filters.alpha.opacity = percentage;\n\
  } else if (document.getElementById) {\n    document.getElementById(target).style.MozOpacity\
  \ = percentage/100;\n}\n```\n\n**3.** 在文档主体中，创建底层：\n\n```html\n<div id=\"backLayer\"\
  \ style=\"position: absolute; font-size: 60pt; left: 10px; top: 10px;\">\n```\n\n\
  **4.** 创建顶层，该层与底层重叠并遮挡底层：\n\n```html\n<div id=\"topLayer\" style=\"position: absolute;\
  \ left: 200px; top: 10px; width: 100px; height: 100px; background-color: yellow;\
  \ filter:alpha(opacity=100); -moz-opacity:1;\">\n```\n\n**5.** 创建一个 ID 为 `buttonForm`\
  \ 的表单，并将该表单放置在前两个层下方：\n\n```html\n<form id=\"buttonForm\" style=\"position: absolute;\
  \ left: 200px; top: 200px;\">\n```\n\n**6.** 在表单中，创建两个表单元素：第一个是名为 `opacity` 的文本字段，用户可以在其中输入顶层透明度的百分比值；第二个是一个按钮，单击该按钮时调用\
  \ `setOpacity`。最终页面应如清单 258-1 所示。\n\n```html\n<head>\n<script language=\"JavaScript\"\
  >\nfunction setOpacity(target,percentage) {\n    if (document.all) {\n        document.all(target).filters.alpha.opacity\
  \ = percentage;\n    } else if (document.getElementById) {\n        document.getElementById(target).style.MozOpacity\
  \ = percentage/100;\n    }\n}\n</script>\n</head>\n<body>\n<div id=\"backLayer\"\
  \ style=\"position: absolute; font-size: 60pt; left: 10px; top: 10px;\">\n此文本位于背景中\n\
  </div>\n<div id=\"topLayer\" style=\"position: absolute; left: 200px; top: 10px;\
  \ width: 100px; height: 100px; background-color: yellow; filter:alpha(opacity=100);\
  \ -moz-opacity:1;\">\n此层位于顶部\n</div>\n<form id=\"buttonForm\" style=\"position:\
  \ absolute; left: 200px; top: 200px;\">\n透明度：<input type=\"text\" name=\"opacity\"\
  >%<br>\n<input type=\"button\" value=\"设置透明度\" onClick=\"setOpacity('topLayer',this.form.opacity.value)\"\
  >\n</form>\n</body>\n```\n\n**清单 258-1：** 控制层透明度。\n\n***提示***\n- 在 Internet Explorer\
  \ 中，透明度值范围是 0 到 100，其中 100 表示层完全不透明，您无法看到层背后隐藏的任何内容。值为 0 时，层完全透明，您无法看到层本身。\n- 在\
  \ Netscape 中，透明度值是 0 到 1 之间的数值，其中 1 表示完全不透明，0 表示完全透明。\n\n**7.** 保存文件并在浏览器中打开。初始时，顶层完全遮挡了底层的部分内容。\n\
  \n**8.** 在表单字段中输入一个透明度值，然后单击“设置透明度”按钮。顶层将淡出到您指定的透明度。\n\n### 任务 259：在 Internet Explorer\
  \ 中创建页面过渡效果\n\n***注释***\n- 例如，当用户单击链接时，新页面可能从右侧滑入以替换当前页面。\n\n自版本 4 起，Internet Explorer\
  \ 提供了一项功能，允许您指定特殊效果的页面过渡，以控制一个页面替换另一个页面的方式。您可以通过放置在 HTML 文档头部的 meta 标签来控制页面过渡效果。这些标签用于设置\
  \ `Page-Enter` 或 `Page-Exit` HTTP 头，以指定进入和离开页面的过渡效果。\n\n\n\n\n页面。作为这些 HTTP 头的值，你可以指定以下内容：浏览器，或者类似于垂直百叶窗旋转的效果，可能会导致一个页面在浏览器窗口中替换另一个页面。\n\
  \n`RevealTrans(Duration: *秒数*, Transition: *过渡类型*)`\n\n`Duration` 表示完成过渡所需的秒数，而\
  \ `Transition` 是一个数值，用于指定二十多种可用效果中的一种。这些效果包括：\n\n- 0：盒状收缩\n- 1：盒状展开\n- 2：圆形收缩\n\
  - 3：圆形展开\n- 4：向上擦除\n- 5：向下擦除\n- 6：向右擦除\n- 7：向左擦除\n- 8：垂直百叶窗\n- 9：水平百叶窗\n- 10：棋盘格横向\n\
  - 11：棋盘格纵向\n\n> **注意：** 这些页面过渡效果在任何版本的 Netscape 中均不可用。此处描述的技术不适用于 Netscape。\n\n\
  `meta` 标签允许你指定额外的信息，这些信息将包含在从服务器到浏览器的响应头中。如果存在 `Page-Enter` 和 `Page-Exit` 头，Internet\
  \ Explorer 会处理它们，但其他浏览器会忽略它们不理解的 HTTP 头。\n\n以下任务通过创建一个具有退出和进入页面效果的页面来演示页面过渡：\n\n\
  **1.** 在新文档的头部，创建一个 `meta` 标签，用于指定用户进入页面时的过渡效果。指定的过渡效果是棋盘格横向效果：\n\n```html\n<meta\
  \ http-equiv=\"Page-Enter\" content=\"RevealTrans(Duration=3, Transition=10)\">\n\
  ```\n\n![Image 658](img/index-562_1.jpg)\n\n**跨浏览器兼容性与问题**\n\n**2.** 为页面退出指定第二个\
  \ `meta` 标签，并使用垂直百叶窗过渡效果：\n\n```html\n<meta http-equiv=\"Page-Exit\" content=\"\
  RevealTrans(Duration=2, Transition=1)\">\n```\n\n**3.** 指定你希望在页面中显示的任何正文文本，使最终页面看起来像清单\
  \ 259-1。\n\n```html\n<head>\n<meta http-equiv=\"Page-Enter\" content=\"RevealTrans(Duration=3,\
  \ Transition=10)\">\n<meta http-equiv=\"Page-Exit\" content=\"RevealTrans(Duration=2,\
  \ Transition=11)\">\n</head>\n<body>\nThis is the new page.\n</body>\n```\n\n**清单\
  \ 259-1：** 指定页面过渡。\n\n**4.** 保存文件并关闭。在浏览器中打开你最喜欢的网站。\n\n**5.** 在同一个浏览器窗口中，打开你刚刚创建的文件。你应该会看到页面使用棋盘格横向效果过渡到新页面，如图\
  \ 259-1 所示。在同一个浏览器窗口中，打开其他网页，你应该会看到退出过渡效果为垂直百叶窗。\n\n**图 259-1：** 页面进入时的棋盘格横向效果。\n\
  \n![Image 659](img/index-563_1.jpg)\n\n---\n\n### 安装 X 跨浏览器兼容性库\n\n正如本部分大部分内容所示，构建跨浏览器兼容的代码是一项艰巨的任务，尤其是当你计划从\
  \ JavaScript 内部操作页面元素（如层）时。幸运的是，许多人已经提供了免费可用的跨浏览器动态 HTML 库，你可以使用它们来简化这一过程。\n\n>\
  \ **注意：**\n> - 确保 `script` 标签中 `x.js` 的路径正确。如果 `x.js` 与 HTML 文件不在同一目录中，请指定文件的相对路径。\n\
  > - `x.js` 文件是使用 X 跨浏览器函数库所需的唯一文件。\n\n使用这些库时，你通常调用库中的函数来操作对象，而不是使用通常的直接 JavaScript\
  \ 方法。有时你甚至可以通过调用库中的函数来创建所有页面元素。\n\n这些库包括：\n\n- CBE：www.cross-browser.com\n- X：www.cross-browser.com\n\
  - DynAPI：http://dynapi.sourceforge.net/dynapi/\n- Glimmer：www.inkless.com/glimmer\n\
  - DHTML Library：www.dhtmlcentral.com/projects/lib\n\nX 库的网站如图 260-1 所示。\n\n**图 260-1：**\
  \ X 跨浏览器兼容性库的网站。\n\n为了本书本部分及后续任务的目的，你将使用 X 库。与这里列出的一些大型、功能齐全的库不同，X 只是一系列函数，这些函数以浏览器兼容的方式封装了对现有页面元素的操作任务。\n\
  \n本任务演示如何将库安装到你正在构建的任何应用程序中：\n\n**1.** 从 www.cross-browser.com 下载最新版本的 X 库。本书出版时的最新版本位于名为\
  \ `x38.zip` 的文件中。\n\n> **提示：** 如果你希望构建适度使用动态 HTML 的页面和网站，并且希望这些页面在大多数用户中运行良好，你应该认真考虑使用库，而不是自己编写动态\
  \ HTML 代码。这将使你更容易专注于页面的功能，而不是为在每个浏览器中实现功能而需要生成的代码。\n\n**2.** 将 ZIP 存档文件的内容解压到你希望存储库文件以供将来参考的目录中。\n\
  \n**3.** 将 `x.js` 文件复制到你正在构建 JavaScript 应用程序文件的目录中。\n\n**4.** 在每个需要执行跨浏览器页面元素操作的页面中，在\
  \ HTML 文件的头部包含以下行：\n\n```html\n<script language=\"JavaScript\" src=\"x.js\"></script>\n\
  ```\n\n**5.** 在这些页面中调用 X 库的任何方法，如本书本部分剩余任务所示。\n\n---\n\n### 使用 X 显示和隐藏元素\n\n任务 260\
  \ 中介绍的 X 跨浏览器函数库简化了显示和隐藏页面元素（如层）的过程。使用 X 库显示或隐藏层需要两个步骤：\n\n**1.** 在文档的头部包含 `x.js`\
  \ 脚本库文件。\n\n**2.** 使用 `xShow` 和 `xHide` 函数来显示和隐藏页面元素：\n\n```javascript\nxShow(\"\
  元素 ID\");\nxHide(\"元素 ID\");\n```\n\n以下任务演示了如何使用这些函数来显示一个层，然后为用户提供显示和隐藏该层的链接：\n\n\
  **1.** 在你偏好的编辑器中创建一个新文档。\n\n**2.** 在文档的头部，包含 `x.js` 脚本库文件：\n\n```html\n<script language=\"\
  JavaScript\" src=\"x.js\"></script>\n```\n\n**3.** 在文档的正文中，创建一个 ID 为 `myLayer` 的层：\n\
  \n```html\n<div id=\"myLayer\" style=\"width: 100px; height: 100px; background-color:\
  \ lightgrey;\">\n这是一个层\n</div>\n```\n\n**4.** 创建一个用于显示层的链接；当用户点击该链接时，应调用 `xShow`：\n\
  \n```html\n<a href=\"javascript:xShow('myLayer');\">显示层</a>\n```\n\n**5.** 创建一个用于隐藏层的链接；当用户点击该链接时，应调用\
  \ `xHide`。最终页面应类似于清单 261-1。\n\n```html\n<head>\n<script language=\"JavaScript\"\
  \ src=\"x.js\"></script>\n</head>\n<body>\n<div id=\"myLayer\" style=\"width: 100px;\
  \ height: 100px; background-color: lightgrey;\">\n这是一个层\n</div>\n<a href=\"javascript:xShow('myLayer');\"\
  >显示层</a>\n<br>\n<a href=\"javascript:xHide('myLayer');\">隐藏层</a>\n</body>\n```\n\
  \n**清单 261-1：** 使用 `xShow` 和 `xHide`。\n\n> **警告：** 虽然跨浏览器库提供了轻松开发适用于多种浏览器的动态 HTML\
  \ 应用程序的好处，但它们可能会影响页面的大小和下载时间。请记住，库被包含在每个页面中。作为一种通用工具，库必然包含比你自己处理跨浏览器兼容性代码并使其特定于你的需求更多的代码。\n\
