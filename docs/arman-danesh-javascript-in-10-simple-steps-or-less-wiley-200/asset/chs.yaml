  \ AM Page 478  \n\n**478**  \n\n**第 10 部分**  \n\n### 任务 230：使用书签工具检查电子邮件链接  \n\n\
  此任务概述了如何搜索页面中的电子邮件链接，然后在对话框中显示这些地址——全部通过书签工具完成。其原理很简单。`document.links`数组提供了对文档中所有链接的访问。电子邮件链接会出现在此列表中，形式为`mailto:电子邮件地址`。基于此，任何对电子邮件链接的检查都涉及遍历`document.links`数组，检查链接的协议，然后，如果链接的协议是`mailto:`，则输出链接的地址。\
  \  \n\n此任务使用此逻辑构建一个书签工具，将所有此类地址收集到一个列表中，然后在对话框中显示该列表。  \n\n1. 打开您通常用于编写 JavaScript\
  \ 的文本编辑器。  \n2. 创建一个名为`emailList`的空字符串变量，用于保存脚本结束时找到的所有地址列表：  \n\n   `var emailList\
  \ = \"\";`  \n\n3. 遍历`document.links`数组：  \n\n   ```javascript\n   for (var i =\
  \ 0; i < document.links.length; i++) {\n     var link = document.links[i];\n   \
  \  if (link.toString().substring(0, 7) == \"mailto:\") {\n       emailList += link.toString().substring(7)\
  \ + \"\\n\";\n     }\n   }\n   ```  \n\n4. 使用`window.alert`显示列表：  \n\n   `window.alert(emailList);`\
  \  \n\n5. 在代码开头添加`javascript:`以创建书签工具 URL：  \n\n   `javascript:var emailList=\"\"\
  ;for(var i=0;i<document.links.length;i++){var link=document.links[i];if(link.toString().substring(0,7)==\"\
  mailto:\"){emailList+=link.toString().substring(7)+\"\\n\";}}window.alert(emailList);`\
  \  \n\n6. 使用此代码作为 URL 创建书签或收藏夹。  \n7. 要测试书签工具，请选择您创建的新书签或收藏夹，应会显示一个包含页面上所有电子邮件地址的对话框。\
  \  \n\n***注意***  \n\n- `document.links`数组中的每个链接都是一个对象，而不是字符串。使用对象的`toString`方法会返回\
  \ URL 字符串。  \n- `String`对象的`substring`方法返回字符串的一部分。两个参数分别是第一个字符索引和最后一个字符索引。  \n\n\
  \n\n\n\n## 书签小程序\n\n### 任务 230\n\n`emailList = \"\";`\n\n**3.** `substring` 方法要返回的字符串部分的索引。\n\
  \n启动一个 `for` 循环。从 0 循环到 `document.links` 数组的长度：\n\n- 换行符是 JavaScript 中使用所谓“转义”编写的几个特殊字符之一。通过转义，反斜杠字符表示反斜杠后面的字符应被解释，而不是正常使用。在这种情况下，`\\\
  n` 表示换行符，而不是字母 n。\n\n```\nfor (i = 0; i < document.links.length; i++) {\n```\n\n\
  **4.** 使用 `if` 语句检查 `document.links` 数组中的当前条目是否使用了 `mailto:` 协议：\n\n```\nif (document.links[i].protocol\
  \ == \"mailto:\") {\n```\n\n**5.** 如果该链接是电子邮件地址，则从链接中提取该链接并将其保存在名为 `thisEmail` 的临时变量中：\n\
  \n```\nthisEmail = document.links[i].toString();\n```\n\n**6.** 使用 `substring` 方法删除链接的前\
  \ 7 个字符，从而移除字符串中的 `mailto:` 部分，并将结果存回 `thisEmail`：\n\n```\nthisEmail = thisEmail.substring(7,\
  \ thisEmail.length);\n```\n\n**7.** 将电子邮件地址追加到 `emailList` 字符串的末尾，并在电子邮件地址后添加一个换行符：\n\
  \n```\nemailList += thisEmail + \"\\n\";\n```\n\n![图片 588](img/index-502_1.jpg)\n\
  \n**8.** 关闭 `if` 和 `for` 块，然后使用 `window.alert` 方法显示 `emailList` 字符串的值，使脚本如下所示：\n\
  \n```\nemailList = \"\";\nfor (i = 0; i < document.links.length; i++) {\n  if (document.links[i].protocol\
  \ == \"mailto:\") {\n    thisEmail = document.links[i].toString();\n    thisEmail\
  \ = thisEmail.substring(7, thisEmail.length);\n    emailList += thisEmail + \"\\\
  n\";\n  }\n}\nwindow.alert(emailList);\n```\n\n***提示***\n- 你可以通过链接的 `protocol` 属性来识别\
  \ `links` 数组中链接的协议。例如，文档中第一个链接的协议是 `document.links[0].protocol`。`mailto:` 链接的协议值将为\
  \ `mailto`。\n\n**9.** 移除脚本中的换行和空白，并在脚本开头添加 `javascript:` 协议，使结果成为一行 URL，并移除所有多余的空白：\n\
  \n```\njavascript:emailList=\"\";for(i=0;i<document.links.length;i++){if(document.links[i].protocol==\"\
  mailto:\"){thisEmail=document.links[i].toString();thisEmail=thisEmail.substring(7,thisEmail.length);emailList+=thisEmail+\"\
  \\n\";}}window.alert(emailList);\n```\n\n**10.** 使用此代码作为 URL 创建书签或收藏夹。要测试书签小程序，请在浏览器中打开一个网页。例如，打开\
  \ Yahoo! 主页。选择你创建的新书签或收藏夹，应会显示一个包含页面中电子邮件地址的对话框，如图 230-1 所示。\n\n**图 230-1：** 在对话框中显示\
  \ Yahoo! 主页中的电子邮件地址。\n\n***交叉引用***\n- 任务 228 讨论了如何为 JavaScript 书签小程序创建书签或收藏夹。\n\n\
  ### 任务 231：在 Internet Explorer 中使用书签小程序通过电子邮件发送选中的文本\n\nWeb 用户常见的一项操作是将页面的一部分通过电子邮件发送给他人。通常的方法是选中文本、复制、粘贴到电子邮件中，然后发送。\n\
  \n在 Internet Explorer 中使用 JavaScript，你可以构建一个书签小程序，通过调用用户的默认电子邮件客户端并将选中的文本预填入电子邮件，来发送用户在页面中选中的文本。\n\
  \n***注意***\n- 此书签小程序仅适用于 Internet Explorer。\n- `location.href` 属性反映当前页面的 URL。当为其分配新\
  \ URL 时，浏览器将显示该新 URL。\n\n此书签小程序依赖于以下内容：\n\n- Internet Explorer 提供 `document.selection`\
  \ 对象来反映网页中当前选中的文本。\n- `document.selection` 对象的 `createRange` 方法返回一个指向选中范围的指针，该范围具有一个包含选中文本的\
  \ `text` 属性。\n- 使用 `mailto:` 链接会触发使用用户默认邮件客户端的传出邮件。邮件的正文可以通过 `mailto:?BODY=文档正文`\
  \ 形式的 URL 进行设置。\n\n以下步骤展示了如何创建此书签小程序：\n\n**1.** 打开你通常用于编写 JavaScript 的文本编辑器。\n\n\
  **2.** 将当前选中的文本保存在变量 `selectedText` 中：\n\n```\nselectedText = document.selection.createRange().text;\n\
  ```\n\n**3.** 使用 `escape` 函数将选中的文本转换为 URL 编码格式，并将结果存回 `selectedText`：\n\n```\nselectedText\
  \ = escape(selectedText);\n```\n\n**4.** 将 `location.href` 设置为适当的 `mailto:` URL，并将选中的文本作为邮件正文，使最终脚本如下所示：\n\
  \n```\nselectedText = document.selection.createRange().text;\nselectedText = escape(selectedText);\n\
  location.href = 'mailto:?BODY=' + selectedText;\n```\n\n**5.** 将最后一个命令包含在 `void`\
  \ 语句中；否则，浏览器在将 URL 字符串分配给 `location.href` 属性后会尝试显示该字符串，这将导致显示 URL 的空页面替换当前页面：\n\n\
  ```\nselectedText = document.selection.createRange().text;\nselectedText = escape(selectedText);\n\
  void(location.href = 'mailto:?BODY=' + selectedText);\n```\n\n![图片 589](img/index-504_1.jpg)\n\
