  \ 220 中介绍。\n\n**图 54-1：** 原始 HTML 页面。\n\n## 将用户重定向到新页面\n\n与静态的`document.URL`属性不同，`window.location`属性允许你实际重置与窗口关联的位置，并有效地将用户重定向到新的\
