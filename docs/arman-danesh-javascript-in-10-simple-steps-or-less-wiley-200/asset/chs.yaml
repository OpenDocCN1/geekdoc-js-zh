  \ 投影阴影可以放置在元素的任意角落。\n\n### 任务 173：在 JavaScript 中管理 Z-Index\n\n使用层叠样式表，你可以控制层的相对堆叠顺序。层的堆叠顺序决定了当层相互重叠时，哪些层显示在其他层之上。你可以通过\
  \ `z-index` 样式属性来控制这个堆叠顺序，该属性接受一个数值。数值越大，层在堆叠中的位置越高。\n\n**注意：**\n\n- 默认情况下，层按照它们在\
  \ HTML 文件中出现的顺序依次堆叠。\n- 要引用元素的对象，请使用 `document.getElementById` 方法：\n\n**1.** 在新文档的头部，创建一个包含名为\
  \ `swapLayer` 函数的脚本块，该函数接受两个参数，名为\n\n\n\n\n\n### 任务 173\n\n`topTarget`（将包含要移至顶层的图层\
  \ ID）和 `bottomTarget`（将包含要移至底层的图层 ID）：`var objectRef = document.getElementById(\"\
  element ID\");` `function swapLayer(topTarget, bottomTarget) { }` 变量 `objectRef`\
  \ 随后引用与 ID 中指定元素关联的对象。\n\n**2.** 在函数中，将目标顶层图层的堆叠顺序设置为 2，底层图层设置为 1：\n\n`document.getElementById(topTarget).style.zIndex\
  \ = 2;` `document.getElementById(bottomTarget).style.zIndex = 1;`\n\n- 步骤 3 和 5\
  \ 中定义的其他样式属性请参见清单 173-1。\n\n**3.** 在文档正文中，创建一个名为 `firstLayer` 的图层，堆叠顺序为 1：\n\n`<div\
  \ id=\"firstLayer\" style=\"... z-index: 1;\"> </div>`\n\n- 此处引用的样式对象和 `document.getElementById`\
  \ 方法仅在对文档对象模型有强大支持的较新浏览器中可用。这意味着此任务仅在 Internet Explorer 5 及更高版本或 Netscape 6 及更高版本中有效。\n\
  \n**4.** 在该图层中，创建一个链接以调用 `swapLayer`，旨在将该图层移至堆叠顶部；将 `'firstLayer'` 指定为第一个参数，`'secondLayer'`\
  \ 指定为第二个参数：\n\n`<p><a href=\"javascript:swapLayer('firstLayer','secondLayer')\"\
  >移至顶部</a></p>`\n\n- 仅重置一个图层的堆叠顺序不会改变其他页面元素的堆叠顺序。要像本例中那样使图层在堆叠中交换位置，需要同时更改两个图层的堆叠顺序位置。\n\
  \n**5.** 创建第二个名为 `secondLayer` 的图层，堆叠顺序为 2：\n\n`<div id=\"secondLayer\" style=\"\
  ... z-index: 2;\"> </div>`\n\n**6.** 在该图层中，创建一个链接以调用 `swapLayer`，旨在将该图层移至堆叠顶部；将\
  \ `'secondLayer'` 指定为第一个参数，`'firstLayer'` 指定为第二个参数。最终页面应如清单 173-1 所示。\n\n![图片 424](img/index-382_1.jpg)\n\
  \n```\n<head>\n<script language=\"JavaScript\">\nfunction swapLayer(topTarget,bottomTarget)\
  \ {\ndocument.getElementById(topTarget).style.zIndex = 2;\ndocument.getElementById(bottomTarget).style.zIndex\
  \ = 1;\n}\n</script>\n</head>\n<body>\n<div id=\"firstLayer\" style=\"position:\
  \ absolute; left: 10px; top: 10px; width: 100px; height: 100px; background-color:\
  \ yellow; z-index: 1;\">\n<p><a href=\"javascript:swapLayer('firstLayer','secondLayer')\"\
  >移至顶部</a></p>\n</div>\n<div id=\"secondLayer\" style=\"position: absolute; left:\
  \ 60px; top: 60px; width: 100px; height: 100px; background-color: lightgrey; z-index:\
  \ 2;\">\n<p><a href=\"javascript:swapLayer('secondLayer','firstLayer')\">移至顶部</a></p>\n\
  </div>\n</body>\n```\n\n**清单 173-1：** 使用 JavaScript 更改堆叠顺序。\n\n**7.** 保存文件并关闭。在浏览器中打开该文件，现在可以看到两个重叠的图层，如图\
  \ 173-1 所示。\n\n**图 173-1：** 重叠的图层。\n\n**8.** 单击底部图层中的“移至顶部”链接，它将移至堆叠顶部。单击另一个图层中的“移至顶部”链接，页面应恢复到原始状态。\n\
  \n![图片 425](img/index-383_1.jpg)\n\n### 任务 174：使用 CSS 为文本设置字体\n\n随着浏览器对层叠样式表的支持不断增强，通过动态\
  \ HTML 控制页面外观各个方面的能力也随之提升。可以通过样式表控制的页面外观之一就是文本所使用的字体。你可以使用 `font-family` 样式属性来控制这一点。例如，以下代码将图层中的所有文本设置为\
  \ Arial：\n\n```\n<div style=\"font-family: Arial;\">\n文本在此处\n</div>\n```\n\n***注释***\n\
  - 动态 HTML 是 JavaScript、层叠样式表和文档对象模型的组合，它们共同使得构建在浏览器中运行的复杂交互式用户界面和应用程序成为可能。\n- 最好在\
  \ `font-family` 规范中将一种特殊字体作为最后一个字体，这样如果首选字体缺失，浏览器可以回退到默认字体。否则，原本打算以无衬线字体显示的文本可能会以衬线字体显示，反之亦然。\n\
  \n类似地，你可以使用 `span` 标签内联更改字体：\n\n```\n<p>\n这是文本。其中一部分<span style=\"font-family: Arial;\"\
  >是 Arial 字体。</span>\n</p>\n```\n\n结果如图 174-1 所示。\n\n**图 174-1：** 使用样式表内联更改字体。\n\n\
  指定字体时，无法保证用户浏览器中一定安装了这些字体。因此，通常需要指定一个字体列表，例如：\n\n`font-family: Arial, Helvetica,\
  \ SANS-SERIF;`\n\n这里，如果用户没有安装 Arial，浏览器将使用 Helvetica。如果 Helvetica 也未安装，则使用 SANS-SERIF。`SANS-SERIF`\
  \ 是层叠样式表中提供的一组特殊字体名称之一。它指示浏览器使用其默认的无衬线字体，而不是特定字体。\n\n![图片 426](img/index-384_1.jpg)\n\
