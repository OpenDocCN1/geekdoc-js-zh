  \ 93-1 所示。\n   ![图 93-1](img/index-216_1.jpg)\n9. 点击第一个链接以选中复选框。点击第二个链接以取消选中复选框。\n\
  \n> **注释**\n> - `checked` 属性在复选框当前被选中时值为 `true`，未选中时值为 `false`。\n> - 注意示例中使用了 `#`\
  \ 作为 URL。当使用 `onClick` 事件处理程序触发新窗口打开时，你不希望点击链接导致当前窗口的位置发生变化；这是一种简单的避免方法。\n> - 如果字段没有命名，则表单中的每个字段都可以通过\
