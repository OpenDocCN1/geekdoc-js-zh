  \ 基础\n\n### 任务 37：遍历数组元素\n\n- 注意，计数从 1 开始。这是因为任何数组的第一个索引都是 0。同样，你测试的是 `i` 是否小于（而不是小于或等于）数组的长度。这是因为如果数组长度为\
  \ 5，那么最后一个索引是 4。如果你测试的是小于或等于数组长度，那么循环会计数到 5，而不是像应该的那样停在 4。\n\n你可以通过数组对象的 `length`\
  \ 属性来实现这一点。例如，下面的循环遍历了 `myArray` 数组中的每一个索引：\n\n```\nfor (i = 0; i < myArray.length;\
  \ i++)\n```\n\n下面的任务创建了一个数组，然后遍历它，在浏览器窗口中显示数组的每个元素：\n\n1. 在你喜欢的编辑器中创建一个新的 HTML 文档。\n\
