  \ 233：使用书签小工具显示页面中的图片\n\n本任务演示如何构建一个书签小工具，将网页中包含的所有图片以列的形式显示在浏览器窗口中央。这在自行构建网页时进行测试和调试非常有用。\n\
  \n本任务依赖于 `document.images` 数组，该数组包含页面中每张图片对应的 `Image` 对象。这些对象有一个 `src` 属性，指向图片的源文件。\n\
  \n以下步骤展示了如何构建此书签小工具：\n\n1. 打开你通常用于编写 JavaScript 的文本编辑器。\n\n2. 创建一个名为 `imageList`\
  \ 的变量，并将其赋值为空字符串：`imageList = '';`\n\n3. 使用 `for` 循环遍历 `document.images` 数组：`for\
  \ (i = 0; i < document.images.length; i ++) {`\n\n4. 对于每张图片，使用其源文件构建一个新的 `img` 标签，并将其添加到\
  \ `imageList` 字符串中：\n\n```\nimageList += '<img src=' + document.images[i].src +\
  \ '><br>';\n```\n\n5. 关闭 `for` 循环：`}`\n\n6. 使用 `document.write` 方法将图片列表居中输出到页面：`document.write('<center>'\
  \ + imageList + '</center>');`\n\n7. 使用 `document.close` 方法关闭文档流：`document.close();`\n\
  \n8. 将最后一条命令包裹在 `void` 语句中，最终脚本如下：\n\n```\nimageList = '';\nfor (i = 0; i < document.images.length;\
  \ i ++) {\n    imageList += '<img src=' + document.images[i].src + '><br>';\n}\n\
  document.write('<center>' + imageList + '</center>');\nvoid(document.close());\n\
  ```\n\n9. 移除脚本中的换行和空白，并在脚本开头添加 `javascript:` 协议，最终得到一个去除了所有多余空格的单行 URL：\n\n```\n\
  javascript:imageList='';for(i=0;i<document.images.length;i++){imageList+='<img src='+document.images[i].src+'><br>';}document.write('<center>'+imageList+'</center>');void(document.close());\n\
  ```\n\n10. 使用这段代码作为 URL 创建一个书签或收藏夹。要测试该书签小工具，请在浏览器中打开一个网页。例如，图 233-1 显示了在浏览器中打开的\
  \ Juxta Publishing 主页。选择你创建的新书签或收藏夹，图片应如图 233-2 所示显示。\n\n***提示***\n• 为了便于开发书签小工具，最好先在常规代码编辑器中编辑代码，最后再将书签小工具复制粘贴到收藏夹或书签列表中。\n\
  • `void` 函数用于防止代码返回任何值。对于你的书签小工具，URL 中最后一个函数或方法调用返回的任何值都可能导致浏览器出现意外行为。你并不关心 `document.close`\
  \ 返回的值，因此使用 `void` 函数隐藏该值。\n\n**图 233-1：** Juxta Publishing 主页。\n\n***交叉引用***\n\
