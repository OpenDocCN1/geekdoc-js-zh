  \n**3.** 如果复选框被选中，则检查文本字段文本的长度。如果长度为 0，则通知用户并从函数返回 `false`：\n\n```\nif (check.checked)\
  \ {\n  if (check.form.myText.value.length == 0) {\n    window.alert(\"您已选中复选框；必须提供您的姓名。\"\
  );\n    return false;\n  }\n}\n```\n\n**4.** 最后，如果表单通过了测试，则从函数返回 `true`，使完整的函数如下所示：\n\
  \n```\nfunction checkCheckbox(check) {\n  if (check.checked) {\n    if (check.form.myText.value.length\
  \ == 0) {\n      window.alert(\"您已选中复选框；必须提供您的姓名。\");\n      return false;\n   \
  \ }\n  }\n  return true;\n}\n```\n\n**5.** 创建另一个名为 `checkForm` 的函数，该函数接收一个表单对象。该函数调用\
  \ `checkCheckbox`，并将选中的复选框的值传递给它。`checkCheckbox` 函数返回结果：\n\n```\nfunction checkForm(formObj)\
  \ {\n  return checkCheckbox(formObj.myField.value);\n}\n```\n\n**6.** 创建一个包含复选框和文本字段的表单，并使用\
  \ `onSubmit` 事件处理程序调用 `checkForm` 函数：\n\n```\n<body>\n<form name=\"myForm\" action=\"\
  target.html\" onSubmit=\"return checkForm(this);\">\n<input type=\"checkbox\" name=\"\
