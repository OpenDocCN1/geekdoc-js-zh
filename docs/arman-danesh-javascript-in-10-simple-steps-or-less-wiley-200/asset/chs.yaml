  \n### 任务 59：检测图像上的鼠标悬停事件\n\n使用 `onMouseOver` 事件处理程序，你可以检测鼠标指针何时位于图像上方。然后，你可以触发仅在鼠标移入图像所占空间时发生的操作。通常，这用于创建悬停效果，如下面的任务所示。\n\
  \n要指定事件处理程序，你需要使用 `img` 标签的 `onMouseOver` 属性来指定鼠标悬停在图像上时要执行的 JavaScript。例如：\n\n\
  ```\n<img src=\"图像文件\" onMouseOver=\"JavaScript 代码\">\n```\n\n当图像作为链接使用时（例如，图像作为菜单中的按钮），你通常将\
  \ `onMouseOver` 属性放在包含 `img` 标签的 `a` 标签中：\n\n```\n<a href=\"URL\" onMouseOver=\"\
  JavaScript 代码\">\n  <img src=\"图像文件\">\n</a>\n```\n\n以下展示了在 `img` 和 `a` 标签中使用 `onMouseOver`，并在鼠标指针移动到图像上时在对话框中显示相应消息：\n\
  \n**1.** 在文档的正文中，放置一个 `img` 标签以显示第一张图像：\n\n```\n<img src=\"image1.jpg\">\n```\n\n\
  ***注释***  \n• 在此示例中，当鼠标指针移动到开始和结束 `a` 标签内的任何内容上时，JavaScript 代码都会执行；在本例中，只有图像位于 `a`\
  \ 块内。  \n• `onMouseOver` 事件通常用于悬停效果。如果你将图像用作菜单按钮，并希望在鼠标悬停在按钮上时显示一个替代的高亮图像，你将使用 `onMouseOver`。在这些情况下，图像将是链接的一部分，你将在\
  \ `a` 标签中使用 `onMouseOver`。这是 `onMouseOver` 事件最常见的用法，很少在 `img` 标签本身中使用。\n\n\n\n\n\
  \n## 图像与翻转效果\n\n### 为 `img` 标签添加 `onMouseOver` 属性\n\n**2.** 为 `img` 标签添加一个 `onMouseOver`\
  \ 属性：\n\n```html\n<img src=\"image1.jpg\" onMouseOver=\"\">\n```\n\n该属性在支持 JavaScript\
  \ 的浏览器中可用于 `a` 标签，但仅在新版浏览器（Netscape 6 及以上或 Internet Explorer 4 及以上）中可用于 `img` 标签。\n\
  \n**3.** 将 `window.alert` 方法作为 `onMouseOver` 属性的值，当鼠标指针移到图像上时显示一条消息：\n\n```html\n\
  <img src=\"image1.jpg\" onMouseOver=\"window.alert('Over Æ the Image');\">\n```\n\
  \n**4.** 添加第二个 `img` 标签以显示另一张图像：\n\n```html\n<img src=\"image2.jpg\">\n```\n\n**5.**\
