  ### 任务 250：使用 div 标签创建层\n\n动态 HTML 作为 JavaScript 和层叠样式表的强大组合的出现，为页面开发打开了新的大门。这些发展的核心是层的概念。\n\
  \n层通过`div`标签创建。它们的初始位置和外观使用样式表指定：要么在文档范围的样式表中定义一个样式表类，然后通过`div`标签的`class`属性将其与层关联，要么在`div`标签的`style`属性中为层指定特定的样式属性。\n\
  \n> **注意：** 注意`z-index`样式属性的使用。该属性指定了层之间的堆叠顺序。如果层的定位重叠，具有较大`z-index`值的层将出现在具有较小值的层之上。有关此属性的更多讨论，请参见任务\
  \ 254。\n>\n> 在本任务中，你将使用`top`和`left`样式属性来调整层相对于浏览器在渲染页面时通常放置位置的位置。当你为`top`属性使用负值时，层会向上移动，覆盖第一个层所占的部分空间。这些样式属性将在任务\
  \ 251 中进一步讨论。\n\n例如，在以下示例中，在样式表中定义了一个简单的类，然后将其应用于一个层：\n\n```html\n<head>\n<style\
  \ type=\"text/css\">\n.myStyle {\n  background-color: lightgrey;\n  width: 100px;\n\
  \  height: 100px;\n}\n</style>\n</head>\n<body>\n<div class=\"myStyle\">这是一个层</div>\n\
  </body>\n```\n\n以下示例演示了两个层的创建。第一个层实际上位于第二个层之上，并遮挡了第二个层的一部分：\n\n1. 在你偏好的编辑器中创建一个新文档。\n\
