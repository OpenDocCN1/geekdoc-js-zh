  \ 事件处理程序。在事件处理程序中，使用 JavaScript 将新文档的 URL 赋值给 `document.location` 属性。最终文档应如下所示：\n\
  \n   ```\n   <body>\n   <a href=\"#\" onClick=\"document.location = '125a.html';\"\
  >打开新文档</a>\n   </body>\n   ```\n\n4. 保存文件并关闭它。\n\n5. 创建一个新文件，包含用户点击第一个文档中的链接后将访问的第二个页面的\
  \ HTML：\n\n   ```\n   <body>\n   这是一个新文档。\n   </body>\n   ```\n\n6. 将此文件保存在步骤 3\
  \ 中 URL 指定的位置。\n\n7. 在浏览器中打开第一个文件。浏览器显示一个包含链接的页面，如图 125-1 所示。\n\n   ![图 319](img/index-282_1.jpg)\n\
