  \ 显示第一个 cookie。\n\n**图 154-2：** 显示第二个 cookie。\n\n### 任务 155：使用 Cookie 为新访客呈现不同的首页\n\
  \n通过 cookie，你可以跟踪用户之前是否访问过你的网站（或者至少最近是否访问过）。这可以通过简单地设置一个指示用户已访问过的 cookie，并为其设置较长的过期时间来实现。然后，每次用户返回网站时，你可以更新过期时间，以确保该\
  \ cookie 不太可能过期。\n\n\n\n\n\n## 操作 Cookie\n\n同时，每当用户访问你网站中的某个页面时，你可以检测该 Cookie 是否存在；如果不存在，你可以将用户引导至一个默认起始页面，让新用户从那里开始体验你的网站。或者，你也可以仅在用户访问首页时检测\
  \ Cookie，并将新用户引导至一个专门为他们定制的首页。\n\n以下概述了为实现这一目的，你需要嵌入到网站每个页面（或仅首页）中的代码。在此示例中，如果用户之前访问过该网站，名为\
  \ `visitCookie` 的 Cookie 将存在并被设置为值 `1`。\n\n1. 创建一个新的 `Date` 对象，但不要设置日期。这里将 `Date`\
  \ 对象赋值给变量 `newDate`：\n\n   `var newDate = new Date();`\n\n2. 将过期日期设置为未来一个合适的时间；例如，你可以将日期设置为六个月后。通过使用\
  \ `newDate` 对象的 `setTime` 方法来实现。该方法以毫秒数作为时间参数。要设置未来的时间，先用 `getTime` 方法获取当前时间，然后加上毫秒数。例如，六个月（即\
  \ 26 周）等于 26 周 × 7 天/周 × 24 小时/天 × 60 分钟/小时 × 60 秒/分钟 × 1000 毫秒/秒，总计 15724800000\
  \ 毫秒：\n\n   `newDate.setTime(newDate.getTime() + 15724800000);`\n\n3. 搜索 `document.cookie`\
  \ 字符串，查看是否存在 `\"visitCookie=\"`。这通过 `String` 对象的 `indexOf` 方法完成，返回值是 `\"visitCookie=\"\
  ` 首次出现的位置索引，此处存储在变量 `firstVisit` 中：\n\n   `var firstVisit = document.cookie.indexOf(\"\
  visitCookie=\");`\n\n4. 使用 `if` 命令检测 `visitCookie` Cookie 是否存在：\n\n   `if (firstVisit\
  \ == -1) {`\n\n5. 如果 Cookie 不存在，你需要设置一个 `visitCookie` Cookie，使用存储在 `newDate` 中的日期和时间来设置\
  \ Cookie 的过期日期：\n\n   `document.cookie = \"visitCookie=1;expires=\" + newDate.toGMTString();`\n\
  \n6. 为新访客设置 `visitCookie` Cookie 后，通过为 `window.location` 属性设置新值，将他们重定向到新访客专属首页：\n\
  \n   `window.location = \"http://myurl.com/new.html\"`\n\n   ***提示*** 这种基于 Cookie\
  \ 判断用户是否曾访问过网站的方法存在一些缺陷。即，用户可能会选择在浏览器中明确关闭 Cookie。\n\n7. 用右花括号关闭 `if` 块：\n\n   `}`\n\
  \n8. 如果处理流程到达此点，则说明用户是回访用户，且未被重定向到新页面。在这种情况下，需要使用 `newDate` 中指示的新过期日期和时间重置 `visitCookie`。最终脚本如清单\
  \ 155-1 所示。\n\n```javascript\n<script language=\"JavaScript\">\nvar newDate = new\
  \ Date();\nnewDate.setTime(newDate.getTime() + 15724800000);\nvar firstVisit = document.cookie.indexOf(\"\
  visitCookie=\");\nif (firstVisit == -1) {\n    document.cookie = \"visitCookie=1;expires=\"\
  \ + newDate.toGMTString();\n    window.location = \"http://myurl.com/new.html\"\n\
  }\ndocument.cookie = \"visitCookie=1;expires=\" + newDate.toGMTString();\n</script>\n\
  ```\n\n**清单 155-1：** 将新用户重定向到自定义首页。\n\n***交叉引用***\n- 任务 154 说明了如何在可访问的 Cookie 集合中搜索并识别特定\
  \ Cookie。\n- 任务 55 展示了如何使用 `window.location` 对象将用户浏览器重定向到另一个 URL。\n\n### 任务 156：创建\
  \ Cookie 函数库\n\n正如你在之前处理 Cookie 的任务中可能注意到的，操作 Cookie 需要大量的字符串和日期处理，尤其是在访问多个已设置的\
