  \   ```javascript\n   var myArray = new Array(5);\n   ```\n5. 为五个元素赋值：\n   ```javascript\n\
  \   myArray[0] = \"z\";\n   myArray[1] = \"c\";\n   myArray[2] = \"d\";\n   myArray[3]\
  \ = \"a\";\n   myArray[4] = \"q\";\n   ```\n6. 使用 `document.write` 方法和 `sort` 方法输出排序后的元素列表，使最终的脚本如清单\
  \ 22-1 所示。\n\n   **交叉参考：** 创建数组的技术在任务 20 中讨论过。创建数组是向数组填充值的第一步，而填充值正是任务 21 的主题。\n\
