  **图 108-1：** 表单中的按钮。\n\n**7.** 点击按钮，会出现图 108-2 中的对话框。\n\n**交叉引用：**\n- `onClick`\
  \ 方法在本节的许多任务中都有使用。\n\n\n\n\n• 本节中的许多任务都使用了 `onClick` 方法。**图 108-2：** 当用户点击按钮时做出响应。\n\
  • 你可以通过 `onClick` 事件向用户发出警报。有关警报用户的更多信息，请参见任务 25。\n\n### 任务 109：在 JavaScript 中使用图形按钮\n\
  \nHTML 提供了一种名为 `image` 的表单元素类型，允许你在表单中放置图像作为元素。你可以为这些图像应用事件处理程序，使其成为表单中动态且不可或缺的一部分。要将图像作为表单元素包含在表单中，请使用\
  \ `input` 标签的 `type` 属性的 `image` 值：\n\n`<input type=\"image\" src=\"*图像路径*\">`\n\
  \n与其他表单按钮一样，你可以在图像按钮中指定事件处理程序。例如，以下按钮使用 `onClick` 事件处理程序来指定当用户点击图像时要执行的 JavaScript\
