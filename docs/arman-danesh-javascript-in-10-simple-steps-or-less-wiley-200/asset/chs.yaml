  >\n    function checkForm(formObj) {\n      var formOK = true;\n      if (formObj.myField.value\
  \ == \"\") {\n        window.alert(\"You must enter a value in the field\");\n \
  \       formObj.myField.focus();\n        formOK = false;\n      }\n      if (formOK)\
  \ { formObj.submit(); }\n    }\n  </script>\n</head>\n<body>\n  <form name=\"myForm\"\
  \ action=\"target.html\">\n    Text Field: <input type=\"text\" name=\"myField\"\
  ><br>\n    <input type=\"button\" value=\"Submit\" onClick=\"checkForm(this.form);\"\
  >\n  </form>\n</body>\n```\n\n**清单 97-1：** 用户提交表单时验证表单。\n\n8. 将文件保存为 `target.html`\
