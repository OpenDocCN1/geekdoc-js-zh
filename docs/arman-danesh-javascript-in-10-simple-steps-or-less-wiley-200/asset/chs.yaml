  - 冒号将条件为 `true` 时返回的值与条件为 `false` 时返回的值分隔开。`true` 的值始终在冒号左侧。\n\n为了说明简写条件测试的有效使用，下面展示一个对话框，要求用户点击“确定”或“取消”，并将选择存储在一个变量中。基于此，创建第二个变量，其中包含一个根据用户选择而定的输出消息；这是通过简写测试完成的。最后，向用户显示该消息。\n\
