  ### 任务 69：用 JavaScript 创建幻灯片\n\n除了图片的悬停效果外，JavaScript 在图片方面的另一个常见用途是在 HTML 页面中创建幻灯片。这些幻灯片可以是自动播放的，也可以由用户手动控制。\n\
  \n本任务演示了如何创建一个自动播放的幻灯片，其中图片每三秒切换一次。最终效果是：幻灯片从初始图片开始，然后每三秒切换一次。幻灯片运行六秒后，显示第三张图片。\n\
  \n**注意：**\n\n- `Array`对象的`length`属性提供了数组中的条目数。这意味着，如果一个数组有四个条目（编号 0 到 3），那么该数组的`length`属性值为\
  \ 4（参见步骤 6）。\n- `window.setTimeout`方法接受两个参数：要调用的函数和时间（以毫秒为单位）。该函数会在指定的毫秒数过后，自动调用指定的函数。3000\
  \ 毫秒等于 3 秒（参见步骤 7）。\n- `body`标签的`onLoad`事件处理程序用于指定在 HTML 文档完成初始加载时要执行的 JavaScript（参见步骤\
