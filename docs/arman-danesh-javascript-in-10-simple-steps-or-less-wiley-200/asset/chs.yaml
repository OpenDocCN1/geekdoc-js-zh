  \ i ++) {\n   ```\n\n3. 对于每个链接，将 `target` 设置为 `_blank`：\n   ```\n   document.links[i].target\
  \ = '_blank';\n   ```\n\n4. 将最后一条命令包含在 `void` 语句中；否则，浏览器在将 `_blank` 赋值给 `target`\
  \ 属性后会尝试显示该字符串，这将导致当前页面被一个只显示“_blank”的页面替换：\n   ```\n   void(document.links[i].target\
  \ = '_blank');\n   ```\n\n5. 关闭 `for` 循环，使脚本如下所示：\n   ```\n   for (i = 0; i < document.links.length;\
