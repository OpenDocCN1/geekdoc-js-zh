  \ Explorer 4，并将 Internet Explorer 4 测试条件的结果赋值给该变量：\n\n   ```javascript\n   var ie4\
  \ = (document.all && !document.getElementById);\n   ```\n\n3. 在脚本中，创建一个名为`ie5`的变量来表示\
  \ Internet Explorer 5，并将 Internet Explorer 5 测试条件的结果赋值给该变量：\n\n   ```javascript\n\
  \   var ie5 = (document.all && document.getElementById && !document.fireEvent);\n\
  \   ```\n\n   > **提示：** 这些条件使用了对象测试。对象测试的前提很简单：每个浏览器至少有一些其他浏览器未实现的对象。你可以通过将对象作为`if`语句的条件来轻松测试对象是否存在。例如，你可以用`if\
  \ (document.all)`来测试`document.all`是否存在。\n\n4. 在脚本中，创建一个名为`ie55`的变量来表示 Internet Explorer\
  \ 5.5，并将 Internet Explorer 5.5 测试条件的结果赋值给该变量：\n\n   ```javascript\n   var ie55 =\
  \ (document.all && document.fireEvent && !document.createComment);\n   ```\n\n5.\
  \ 在脚本中，创建一个名为`ie6`的变量来表示 Internet Explorer 6，并将 Internet Explorer 6 测试条件的结果赋值给该变量：\n\
  \n   ```javascript\n   var ie6 = (document.all && document.createComment);\n   ```\n\
