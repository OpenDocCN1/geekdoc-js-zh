  \ 5 及以上版本或 Netscape 6 及以上版本。\n- `div` 标签用于创建图层。你可以使用 `div` 标签的 `style` 属性为图层指定内联样式。\n\
  - `position` 样式属性允许你为图层指定相对或绝对定位。使用相对定位时，图层会根据前面的 HTML 在文档流中按预期定位，然后相对于该位置实现任何偏移。使用绝对定位时，图层相对于文档窗口的左上角定位，无论它在\
  \ HTML 代码中出现的位置如何。\n- 当图层被嵌入时\n\n\n\n文档流中的相对定位是不可行的。在另一层中，相对定位是指将层相对于其包含层的位置进行定位。这意味着内层始终相对于外层阴影层定位，因此你可以使用相对或绝对定位来定位外层阴影层，而内层的前景层会随之移动（参见步骤\
