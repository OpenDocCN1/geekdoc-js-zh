  \ `firstFunction` 的函数，该函数不接受参数。\n\n6. 在函数中，使用 `window.alert` 向用户显示他们已调用第一个函数：\n\n\
  ```\nfunction firstFunction() {\nwindow.alert(\"This is the first function\");\n\
  }\n```\n\n![Image 340](img/index-312_1.jpg)\n![Image 341](img/index-312_2.jpg)\n\
