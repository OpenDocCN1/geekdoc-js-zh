  \n### 任务 239：使用书签小工具更改页面字体\n\n有时网页使用了难以阅读的字体。另一些时候，它们指定了你的系统中缺失的字体，而你的系统默认使用了一种较差的替代字体。针对这些情况，本任务展示了如何使用书签小工具将默认字体样式设置为你偏好的字体。\n\
  \n本任务依赖于文档主体由 `document.body` 对象表示这一事实。该对象有一个 `style` 属性，其中包含一个反映文档主体样式属性的对象。该对象的\
  \ `fontFamily` 属性可用于按名称指定新字体。\n\n例如，要将文档的默认主体字体设置为 Times，你可以使用以下代码：\n```\ndocument.body.style.fontFamily\
  \ = \"Times\";\n```\n\n你也可以像在样式表中一样指定一个字体列表。浏览器将使用列表中第一个可用的字体：\n```\ndocument.body.style.fontFamily\
  \ = \"Garamond, Times, SERIF\";\n```\n\n有几个通用字体名称可用，包括：`SERIF`（表示浏览器中的默认衬线字体）、`SANS-SERIF`（表示浏览器中的默认无衬线字体）和\
  \ `MONOSPACE`（表示浏览器中的默认等宽字体）。\n\n以下步骤展示了如何构建一个书签小工具，将默认字体设置为 Arial：\n\n1. 打开你通常用于编写\
