  \ 方法获取与特定图层 ID 关联的对象，然后按如下方式操作样式属性：`document.getElementById(\"图层 ID\").style.styleProperty\
  \ = new value`。通常，这些样式属性与样式表定义中的样式属性名称相同。\n\n> **注意：** 请注意，在 `div` 标签的样式定义中，你指定了\
  \ `px` 作为单位。在 JavaScript 中，`style.height` 属性是一个数值，你只需指定像素数，无需指定单位。\n\n以下任务创建了两个图层：第一个图层包含一个链接，点击后图层会移动；第二个图层包含一个链接，点击后图层会调整大小。\n\
