  \n### 删除 Cookie\n\n有时你需要删除一个 Cookie，以便后续读取 Cookie 的尝试返回空值。例如，如果用户注销或明确要求不保存其用户名\
  \ Cookie，你可能需要移除该用户名 Cookie。为此，你需要重置 Cookie，但将过期时间设置为过去的时间。这会使浏览器丢弃该 Cookie，并且该\
  \ Cookie 将不再被返回，从而有效删除它。\n\n***注意***\n- 任务 146 讨论了 Cookie 的创建以及在此过程中`document.cookie`属性的使用。删除\
  \ Cookie 涉及设置一个过期时间不在未来的 Cookie。\n\n以下示例说明如何删除名为`myCookie`的 Cookie：\n\n1. 在新 HTML\
