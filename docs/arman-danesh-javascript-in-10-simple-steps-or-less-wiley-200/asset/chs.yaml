  \n**7.** 点击链接，阴影消失。\n\n### 任务 172：在非标准角落放置阴影\n\n随着浏览器对层叠样式表（CSS）支持的改进，你完全通过动态 HTML\
  \ 代码实现特殊视觉效果的能力也增强了。其中一种效果就是投影阴影。在本任务中，你将看到如何仅通过调整分配给投影阴影效果内层的样式属性，使“投影”阴影实际上从元素的任意角落突出。\n\
  \n**注意：**\n\n- 动态 HTML 是 JavaScript、层叠样式表和文档对象模型（DOM）的结合，它们共同使得在浏览器中构建复杂的交互式用户界面和应用程序成为可能。\n\
  - 本任务描述的投影阴影效果适用于较新的浏览器，如 Internet Explorer 5 及以上版本或 Netscape 6 及以上版本。\n\n任务 169\
  \ 展示了如何创建典型的投影阴影效果。在该任务中，你可以看到控制投影阴影工作方式的关键属性是内层 `div` 标签上的 `left` 和 `top` 样式属性。内层\
  \ `div` 标签指定了前景层，该层相对于阴影的位置进行定位。因此，以下定位规则适用于这两个属性：\n\n- 使用 `left` 属性的负值可使阴影出现在元素的右侧。\n\
  - 使用 `left` 属性的正值可使阴影出现在元素的左侧。\n- 使用 `top` 属性的负值可使阴影出现在元素的底部。\n- 使用 `top` 属性的正值可使阴影出现在元素的顶部。\n\
  \n**1.** 创建一个元素，其投影阴影位于左上角，内层使用 `left` 和 `top` 样式属性的正值：\n\n```\n<div style=\"width:\
  \ 100px; height: 100px;\nposition: relative; background: #cccccc;\">\n<div style=\"\
  width: 100px; height: 100px;\nbackground: #00ffff; position: relative; left: 4px;\
