    \ ...\n   \\`\\`\\`\n   \n   These code chunks hook up JavaScript functions and\
    \ objects to the HTML `hello` template. Meteor's built-in `Template` object makes\
    \ this possible, and we're going to follow the same pattern, that is, to hook\
    \ up our `categories` template.\n\n+   2. We want to declare that the `categories`\
    \ template has a `lists` collection. We do this by entering the following code,\
    \ just below the `Template.hello.events()` block:\n   \\`\\`\\`\n     Template.hello.events({\n\
    \       ...\n     });\n     Template.categories.helpers({\n       lists : function(){\n\
    \       }\n     });\n   }\n   \\`\\`\\`\n\n> The `Template` declaration *must*\
    \ be inside of the `if (Meteor.isClient){...}` code block so that the client will\
