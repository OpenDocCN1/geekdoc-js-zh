- md: " ## 1 Setup and Installation\n\nUnder the hood, Meteor is really just a bunch\
    \ of files and scripts, which are designed to make the building of a web application\
    \ easier. That's a terrible way to describe something so elegant, but it helps\
    \ us to better understand what we're using.\n\nAfter all, Mila Kunis is really\
    \ just a bunch of tissue wrapped around bone, with some vital organs inside. I\
    \ know you hate me now for that description, but you get the point. She's beautiful.\
    \ So is Meteor. But it doesn't do us any good to just leave it at that. If we\
    \ want to reproduce that type of beauty on our own, we have to understand what's\
    \ really going on.\n\nSo, files and scripts... We're going to walk you through\
    \ how to get the Meteor package properly installed on your Linux or Mac OS X system,\
    \ and then see the package of files and scripts in action.\n\n> Windows is now\
    \ officially supported (Yay!) so you can follow along using the new Windows installation\
    \ if you would like. Information can be found at https://www.meteor.com/install.\n\
    \nIn this chapter, you will learn the following topics:\n\n- Downloading and installing\
    \ Meteor via curl\n- Loading an example application\n- Making changes and watching\
    \ Meteor in action\n\n## Setup and Installation\n\n### Installing using curl\n\
    \nThere are several ways to install a package of files and scripts. You can manually\
    \ download and transfer files, you can use a pretty installation wizard/package\
    \ with lots of **Next** buttons, or you can do what *real* developers do and use\
    \ the command line. It puts hair on your chest. Which, now that I think about\
    \ it, may not be a very desirable thing. Okay, no hair; we lied. But still, you\
    \ want to use the command line, trust us. Trust the people that just lied to you.\n\
    \n`curl` (or cURL if you want to get fancy) is a command-line tool used to transfer\
    \ files and run scripts using standard URL locations. You probably already knew\
    \ that, or you probably don't care. Either way, we've described it and we're now\
    \ moving on to using it.\n\nOpen a terminal window or the command line, and enter\
    \ the following command:\n\n```\ncurl https://install.meteor.com/ | sh\n```\n\n\
    This will install Meteor on your system. `curl` is the command to go and fetch\
    \ the script. `https://install.meteor.com` is the URL/location of the script,\
    \ and `sh` is, of course, the location of the script interpreter \"Shell\", which\
    \ will fetch the script.\n\nOnce you've run this script, assuming you have an\
    \ Internet connection and the proper permissions, you will see the Meteor package\
    \ downloaded and installed:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_18_0.png)\n\
    \nThe key thing that we're looking for in the preceding installation text is the\
    \ launcher script location:\n\n```\nWriting a launcher script to /usr/local/bin/meteor\n\
    ```\n\nThis location could vary depending on whether you're running this script\
    \ in Linux or Mac OS X, but it puts Meteor into a location where you can then\
    \ access the Meteor script from anywhere else. This will become important in a\
    \ minute. For now, let's see what kind of friendly message we get when the Meteor\
    \ installation is finished:\n\nTo get started fast:\n\n```\n$ meteor create ~/my_cool_app\n\
    $ cd ~/my_cool_app\n$ meteor\n```\n\nOr see the docs at:\n\n```\ndocs.meteor.com\n\
    ```\n\nGreat! You've successfully installed Meteor, and you're on your way to\
    \ create your first Meteor web application!\n\n> You should bookmark http://docs.meteor.com,\
    \ an invaluable reference moving forward.\n\n### Loading an example application\n\
    \nThe wonderful people at Meteor have included several example applications, which\
    \ you can quickly create and play with; these help you to get a better idea of\
    \ what Meteor is capable of.\n\nWe want to use the simplest possible example,\
    \ just to get an idea of how Meteor works, so we will be creating the leaderboard\
    \ example. We'll be using the command line again. This is awesome news if you\
    \ still have it open! If not, open a terminal window and follow these steps.\n\
    \n### Selecting your file's location\n\nSo that we can remember where they are\
    \ later, we'll put all the files for this book in the ~/Documents/Meteor folder.\
    \ We will create this folder as follows:\n\n```\n$ mkdir ~/Documents/Meteor\n\
    ```\n\nNow, we need to get to that directory. Use the following command:\n\n```\n\
    $ cd ~/Documents/Meteor\n```\n\n### Loading the example application\n\nWe can\
    \ now use the Meteor `create` command with the `--example` parameter to create\
    \ a local copy of the `leaderboard` example application:\n\n```\n$ meteor create\
    \ --example leaderboard\n```\n\nAs with the Meteor installation itself, the `create`\
    \ command script has a friendly success message:\n\n```\nleaderboard: created.\n\
    To run your new app:\n  cd leaderboard\n  meteor\n```\n\nThere are even instructions\
    \ on what to do next. How handy! Let's go ahead and do what our good command-line\
    \ friend is telling us.\n\n### Starting the example application\n\nTo start up\
    \ a Meteor application, we need to be in the application directory itself. This\
    \ is because Meteor looks for the startup files, HTML, and JavaScript that are\
    \ needed to run the application. These are all found in the application folder,\
    \ so let's go there:\n\n```\n$ cd leaderboard\n```\n\nThis puts us in the ~/Documents/Meteor/leaderboard\
    \ folder, and we're ready to run the application:\n\n```\n$ meteor\n```\n\nYes,\
    \ that's it. Meteor takes care of everything for us; it reads all the files and\
    \ scripts, and sets up the HTTP listener:\n\n```\n[[[[ ~/Documents/Meteor/leaderboard\
    \ ]]]]\n\nRunning on: http://localhost:3000/\n```\n\nWe can now take the URL we've\
    \ been given (`http://localhost:3000/`) and check out the example application\
    \ in a web browser.\n\n### Previewing the application\n\nOpen your favorite web\
    \ browser (we'll be using Chrome, but any modern, updated browser will work) and\
    \ navigate to `http://localhost:3000/`.\n\nYou should see a screen with a list\
    \ containing the names of scientists, similar to the following screenshot:\n\n\
    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_21_0.png)\n\nYou can go ahead and poke\
    \ around the application a bit, if you want to. Click on Nikola Tesla's name and\
    \ add 5 points to his score about 20 bajillion times, because he deserves it.\
    \ Give some love to Marie Curie because she was so radioactive that she actually\
    \ made up the word. Go nuts, friend!\n\n### Help! I made too many changes!\n\n\
    Do you fear change and want to reset the scores? No problem, we can start with\
    \ a clean database instance; to do this, perform the following steps:\n\n1. Open\
    \ the command line, and press Ctrl + C.\n\n2. This stops the running application.\
    \ Now, enter the following command:\n\n```\n$ meteor reset\n```\n\n3. Restart\
    \ your app, and you're good to go. Just type the following command:\n\n```\n$\
    \ meteor\n```\n\nNote that the initial scores are random, so it won't look exactly\
    \ like it did before. The meteor reset command resets all the data collections\
    \ and whatnot; so in a non-random app, the command will indeed reset the app cleanly.\n\
    \n## Making code changes\n\nOkay, we've got our application up and running in\
    \ the browser, and we now want to see what happens when we make some code changes.\n\
    \nOne of the best features of Meteor is reactive programming. The following extract\
    \ is taken from http://docs.meteor.com/#/full/reactivity:\n\n> Meteor embraces\
    \ the concept of reactive programming. This means that you can write your code\
    \ in a simple imperative style, and the result will be automatically recalculated\
    \ whenever data changes that your code depends on.\n\nThis principle applies to\
    \ code changes too, which means that any changes that you make to the HTML, JavaScript,\
    \ or database are automatically picked up and propagated.\n\nYou don't have to\
    \ restart the application or even refresh your browser. All changes are incorporated\
    \ in real time, and the application reactively accepts the changes.\n\nLet's see\
    \ an example.\n\n---\n\n## Customer support\n\nNow that you are the proud owner\
    \ of a Packt book, we have a number of things to help you to get the most from\
    \ your purchase.\n\n### Downloading the example code\n\nYou can download the example\
    \ code files for all Packt books you have purchased from your account at http://www.packtpub.com.\
    \ If you purchased this book elsewhere, you can visit http://www.packtpub.com/support\
    \ and register to have the files e-mailed directly to you.\n\n### Errata\n\nAlthough\
    \ we have taken every care to ensure the accuracy of our content, mistakes do\
    \ happen. If you find a mistake in one of our books — maybe a mistake in the text\
    \ or the code — we would be grateful if you would report this to us. By doing\
    \ so, you can save other readers from frustration and help us improve subsequent\
    \ versions of this book. If you find any errata, please report them by visiting\
    \ http://www.packtpub.com/support, selecting your book, clicking on the errata\
    \ submission form link, and entering the details of your errata. Once your errata\
    \ are verified, your submission will be accepted and the errata will be uploaded\
    \ to our website, or added to any list of existing errata, under the Errata section\
    \ of that title.\n\n### Piracy\n\nPiracy of copyright material on the Internet\
    \ is an ongoing problem across all media. At Packt, we take the protection of\
    \ our copyright and licenses very seriously. If you come across any illegal copies\
    \ of our works, in any form, on the Internet, please provide us with the location\
    \ address or website name immediately so that we can pursue a remedy.\n\nPlease\
    \ contact us at copyright@packtpub.com with a link to the suspected pirated material.\n\
    \nWe appreciate your help in protecting our authors, and our ability to bring\
    \ you valuable content.\n\n### Questions\n\nYou can contact us at questions@packtpub.com\
    \ if you are having a problem with any aspect of the book, and we will do our\
    \ best to address it."
  mdcn: "\n ## 1 安装与设置\n\n从本质上讲，Meteor 只是一堆文件和脚本，设计这些的目的在于简化 Web 应用的构建过程。这样描述如此优雅的工具简直糟糕透了，但这有助于我们更好地理解自己正在使用的东西。\n\
    \n毕竟，米拉·库尼斯也只不过是一层包裹骨骼的组织，里面装着一些重要器官罢了。我知道你现在一定很讨厌这种描述，但你明白我的意思。她很美。Meteor 也一样。但仅仅停留在表面是远远不够的。如果我们想要在自己的项目中重现那种美，就必须理解其背后的运作机制。\n\
    \n那么，文件和脚本……我们将引导你如何在你的 Linux 或 Mac OS X 系统上正确安装 Meteor，然后看看这些文件和脚本包是如何实际运作的。\n\
    \n> Windows 现在也已获得官方支持（耶！），所以如果你愿意，也可以按照新的 Windows 安装流程来操作。相关信息请访问 https://www.meteor.com/install。\n\
    \n在本章中，你将学习以下主题：\n\n- 通过 curl 下载并安装 Meteor\n- 加载示例应用\n- 进行修改并观察 Meteor 的实际运作\n\
    \n## 安装与设置\n\n### 使用 curl 安装\n\n安装文件和脚本包有多种方式。你可以手动下载并传输文件，可以使用带有多个**下一步**按钮的精美安装向导/安装包，也可以像*真正的*开发者那样使用命令行。这能让你胸有成竹。不过现在想想，长头发可能并不是件好事。好吧，不长头发；我们刚才是吹牛。但无论如何，你要相信我们，相信命令行。相信那些刚对你撒过谎的人。\n\
    \n`curl`（如果你想显得高级一点，也可以叫 cURL）是一个命令行工具，用于通过标准 URL 位置传输文件和运行脚本。你可能早就知道这些了，或者你根本不在乎。无论如何，我们已经介绍过了，现在继续用它。\n\
    \n打开终端窗口或命令行，输入以下命令：\n\n```\ncurl https://install.meteor.com/ | sh\n```\n\n这将在你的系统上安装\
    \ Meteor。`curl` 是获取脚本的命令。`https://install.meteor.com` 是脚本所在的 URL/位置，`sh` 则是脚本解释器\
    \ \"Shell\" 的位置，它负责获取脚本。\n\n运行此脚本后，假设你已有网络连接并具备适当权限，你将看到 Meteor 包被下载并安装：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_18_0.png)\n\
    \n在上面的安装文本中，我们需要关注的关键信息是启动器脚本的位置：\n\n```\nWriting a launcher script to /usr/local/bin/meteor\n\
    ```\n\n这个位置可能会因你运行脚本时使用的是 Linux 还是 Mac OS X 而有所不同，但它将 Meteor 放到了你可以从任何其他地方访问 Meteor\
    \ 脚本的位置。这在稍后就会变得重要。现在，让我们看看 Meteor 安装完成后会显示什么样的友好信息：\n\n快速入门：\n\n```\n$ meteor\
    \ create ~/my_cool_app\n$ cd ~/my_cool_app\n$ meteor\n```\n\n或查看文档：\n\n```\ndocs.meteor.com\n\
    ```\n\n太棒了！你已成功安装 Meteor，可以开始创建你的第一个 Meteor Web 应用了！\n\n> 你应该将 http://docs.meteor.com\
    \ 加入书签，这将是后续非常宝贵的参考资料。\n\n### 加载示例应用\n\nMeteor 的开发者们很贴心地为我们准备了一些示例应用，你可以快速创建并尝试；这有助于你更好地了解\
    \ Meteor 的功能。\n\n我们想使用最简单的示例，来了解一下 Meteor 的工作原理，因此我们将创建排行榜示例。我们又将使用命令行了。如果你还开着终端窗口，这真是太好了！如果没有，打开终端窗口并按照以下步骤操作。\n\
    \n### 选择文件存放位置\n\n为了方便日后查找，我们将本书的所有文件都放在 ~/Documents/Meteor 文件夹中。我们按如下方式创建这个文件夹：\n\
    \n```\n$ mkdir ~/Documents/Meteor\n```\n\n现在，我们需要进入该目录。使用以下命令：\n\n```\n$ cd ~/Documents/Meteor\n\
    ```\n\n### 加载示例应用\n\n现在我们可以使用 Meteor 的 `create` 命令，并配合 `--example` 参数，创建 `leaderboard`\
    \ 示例应用的本地副本：\n\n```\n$ meteor create --example leaderboard\n```\n\n和 Meteor 的安装过程一样，`create`\
    \ 命令脚本也有一条友好的成功信息：\n\n```\nleaderboard: created.\nTo run your new app:\n  cd leaderboard\n\
    \  meteor\n```\n\n甚至还有下一步的操作说明。多方便啊！我们就按照命令行朋友的指示来做吧。\n\n### 启动示例应用\n\n要启动一个 Meteor\
    \ 应用，我们需要处于应用目录本身。这是因为 Meteor 会查找启动文件、HTML 和运行应用所需的 JavaScript。这些都在应用文件夹中，所以我们进入该目录：\n\
    \n```\n$ cd leaderboard\n```\n\n这样我们就进入了 ~/Documents/Meteor/leaderboard 文件夹，可以运行应用了：\n\
    \n```\n$ meteor\n```\n\n没错，就是这样。Meteor 为我们处理好了一切；它读取所有文件和脚本，并设置好 HTTP 监听器：\n\n\
    ```\n[[[[ ~/Documents/Meteor/leaderboard ]]]]\n\nRunning on: http://localhost:3000/\n\
    ```\n\n现在我们可以使用给定的网址（`http://localhost:3000/`），在 Web 浏览器中查看示例应用。\n\n### 预览应用\n\
    \n打开你常用的 Web 浏览器（我们将使用 Chrome，但任何现代、已更新的浏览器都可以），然后导航到 `http://localhost:3000/`。\n\
    \n你应该会看到一个屏幕，上面列出了一些科学家的 names，类似于下面的截图：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_21_0.png)\n\
    \n如果你想，可以随便在应用里点一点。点击尼古拉·特斯拉的名字，把他的分数加他个约 200 亿次 5 分，因为他值得。再给玛丽·居里一些爱，因为她如此具有放射性，以至于\"\
    放射性\"这个词就是因她而生的。尽情玩吧，朋友！\n\n### 救命！我修改得太多了！\n\n你害怕变化，想重置分数吗？没问题，我们可以从一个全新的数据库实例开始；为此，请执行以下步骤：\n\
    \n1. 打开命令行，按 Ctrl + C。\n\n2. 这将停止正在运行的应用。现在，输入以下命令：\n\n```\n$ meteor reset\n```\n\
    \n3. 重新启动应用，就可以了。只需输入以下命令：\n\n```\n$ meteor\n```\n\n注意，初始分数是随机的，所以看起来不会和之前完全一样。meteor\
    \ reset 命令会重置所有数据集合等；因此在非随机的应用中，该命令确实会干净地重置应用。\n\n## 进行代码修改\n\n好了，我们的应用已经在浏览器中运行起来了，现在我们想看看进行一些代码修改后会发生什么。\n\
    \nMeteor 的最佳特性之一就是响应式编程。以下摘录自 http://docs.meteor.com/#/full/reactivity：\n\n> Meteor\
    \ 拥抱响应式编程的理念。这意味着你可以用简单的命令式风格编写代码，而结果会在你的代码所依赖的数据发生变化时自动重新计算。\n\n这一原则也适用于代码修改，也就是说，你对\
    \ HTML、JavaScript 或数据库所做的任何更改都会被自动捕捉并传播。\n\n你不必重新启动应用，甚至不必刷新浏览器。所有更改都会实时融入，应用会以响应式的方式接受这些更改。\n\
    \n让我们来看一个例子。\n\n---\n\n## 客户支持\n\n现在你是 Packt 图书的骄傲拥有者了，我们准备了多项服务来帮助你最大限度地利用你的购买。\n\
    \n### 下载示例代码\n\n你可以从你的账户 http://www.packtpub.com 下载你所购买的所有 Packt 图书的示例代码文件。如果你是在其他地方购买的本书，你可以访问\
    \ http://www.packtpub.com/support 并注册，让文件直接通过电子邮件发送给你。\n\n### 勘误\n\n尽管我们已经尽了最大努力确保内容的准确性，但错误仍时有发生。如果你在我们的某本书中发现错误——无论是文字错误还是代码错误——如果你能向我们报告，我们将不胜感激。通过这样做，你可以帮助其他读者避免困扰，并帮助我们改进本书的后续版本。如果你发现任何勘误，请访问\
    \ http://www.packtpub.com/support，选择你的图书，点击勘误提交表单链接，并输入你的勘误详情。一旦你的勘误被核实，你的提交将被接受，勘误将被上传到我们的网站，或添加到该书目现有勘误列表的\"\
    勘误\"部分。\n\n### 反盗版\n\n互联网上的版权资料盗版是所有媒体都面临的持续问题。在 Packt，我们非常重视版权和许可证的保护。如果你在互联网上以任何形式发现我们的作品的非法副本，请立即向我们提供地址或网站名称，以便我们采取补救措施。\n\
    \n请通过 copyright@packtpub.com 联系我们，并附上疑似盗版材料的链接。\n\n我们感谢你在保护我们的作者以及我们为你提供有价值内容的能力方面所给予的帮助。\n\
    \n### 问题\n\n如果你在本书的任何方面遇到问题，可以通过 questions@packtpub.com 联系我们，我们将尽最大努力为你解决。\n"
