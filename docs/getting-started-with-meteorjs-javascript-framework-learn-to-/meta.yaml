    \    {{#if list_adding}}\n          <input class=\"span-4\" id=\"item_to_add\"\
    \n          size=\"32\" type=\"text\">\n```\n\n```\n{{/if}}\n    </div>\n    {{/if}}\n\
    \  </div>\n</template>\n```\n\n让我们逐步讲解，以便理解每一行的作用。\n\n```\n<template name=\"list\"\
    >\n  <div id=\"lending_list\" class=\"list-group\">\n    {{#each items}}\n```\n\
    \n在这里，我们声明了名为 `list` 的 `<template>` 标签，以匹配我们在 body 中对 `list` 模板的调用。我们创建了一个 Bootstrap\
    \ 的 `list-group`，并给它一个 `id` 值，以便将来需要时可以引用它。\n\n然后，我们启动了一个模板化的 `each` 语句。这次，我们将遍历\
