  md: 'So, we see our first `if`, which is conditioned on whether we''re displaying
    any list items. If we are, this means that we have selected a list, or that we
    are in the `list_selected` mode. Keeping track of this is the Blaze rendering
    engine''s job, so `Template.list.list_selected` is found inside `LendLib.js`.


    We then create a plus sign using the Bootstrap `glyphicon-plus` class.


    Next is our nested (second) `if`. This `if` is checking to see whether we are
    making additions to the list of items. If we are, we are in the `list_adding`
    mode, so we''ll display a textbox in the form of an `<input>` element. If not,
    we''ll just leave the plus sign all by its lonesome.


    Finally, we end our nested `{{/if}}`, our `</div>`, our parent `{{/if}}`, our
    `</ul>`, and our `</template>`.


    # Gluing it all together


    In an MVC or MV* model, the controller (in this case, the Blaze rendering engine)
    is sometimes called the **glue**. That''s because it "glues" together all the
    view items, such as buttons or textboxes, to the model. Blaze does this reactively,
    using reactive contexts and reactive computations, vastly simplifying the "gluing"
    process for you, the developer.


    Pretty fancy explanation, eh? Well, you try to come up with a better explanation
    for what it does. It really does fill in the cracks and keeps the model and the
    view together. Someone else invented the term, not us; so, let''s continue without
    the Judgy McJudgerson viewpoint, mmmkay?


    In this section, we''ll go through all the changes that need to happen inside
    `~/Documents/Meteor/LendLib/LendLib.js` step by step in order to glue the template
    and the data model together.


