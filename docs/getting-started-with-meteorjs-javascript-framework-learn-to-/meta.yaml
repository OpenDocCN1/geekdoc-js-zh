- md: " ## Why Meteor Rocks!\n\nIn other words, the traditional concept of having\
    \ a single server for a single client goes away. You can hook multiple servers\
    \ together, each serving a discreet purpose, or you can have a client connect\
    \ to multiple servers, interacting with each one differently. Think about what\
    \ you can do with a system like that:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_50_0.png)\n\
    \nImagine multiple systems all coming together to create, for example, a health\
    \ monitoring system. Some systems are built with C++, some with Arduino, some\
    \ with...well, we don't really care. They all speak DDP. They send and receive\
    \ data on the wire and decide individually what to do with that data. Suddenly,\
    \ very difficult and complex problems become much easier to solve. DDP has been\
    \ implemented in pretty much every major programming language, allowing you true\
    \ freedom to architect an enterprise application.\n\n## Latency Compensation\n\
    \nMeteor employs a very clever technique called **Mini Databases**. A mini database\
    \ is a \"lite\" version of a normal database that lives in the memory on the client\
    \ side. Instead of the client sending requests to a server, it can make changes\
    \ directly to the mini database on the client. This mini database then automatically\
    \ syncs with the server (using DDP of course), which has the actual database.\n\
    \nOut of the box, Meteor uses MongoDB and Minimongo:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_51_0.png)\n\
    \nWhen the client notices a change, it first executes that change against the\
    \ client-side **Minimongo** instance. The client then goes on its merry way and\
    \ lets the Minimongo handlers communicate with the server over DDP. If the server\
    \ accepts the change, it then sends out a \"changed\" message to all connected\
    \ clients, including the one that made the change. If the server rejects the change,\
    \ or if a newer change has come in from a different client, the Minimongo instance\
    \ on the client is corrected, and any affected UI elements are updated as a result.\n\
    \nAll of this doesn't seem very groundbreaking, but here's the thing—it's all\
    \ asynchronous, and it's done using DDP. This means that the client doesn't have\
    \ to wait until it gets a response back from the server. It can immediately update\
    \ the UI based on what is in the Minimongo instance. What if the change was illegal\
    \ or other changes have come in from the server? This is not a problem as the\
    \ client is updated as soon as it gets word from the server.\n\n## Why Meteor\
    \ Rocks!\n\nNow, what if you have a slow internet connection or your connection\
    \ goes down temporarily? In a normal client/server environment, you couldn't make\
    \ any changes, or the screen would take a while to refresh while the client waits\
    \ for permission from the server. However, Meteor compensates for this. Since\
    \ the changes are immediately sent to Minimongo, the UI gets updated immediately.\
    \ So, if your connection is down, it won't cause a problem:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_52_0.png)\n\
    \nAll the changes you make are reflected in your UI, based on the data in Minimongo.\
    \ When your connection comes back, all the queued changes are sent to the server,\
    \ and the server will send authorized changes to the client.\n\nBasically, Meteor\
    \ lets the client take things on faith. If there's a problem, the data coming\
    \ in from the server will fix it, but for the most part, the changes you make\
    \ will be ratified and broadcast by the server immediately.\n\nCoding this type\
    \ of behavior in Meteor is crazy easy (although you can make it more complex and\
    \ therefore more controlled if you like):\n\n```\nlists = new Mongo.Collection(\"\
    lists\");\n```\n\nThis one line declares that there is a `lists` data model. Both\
    \ the client and server will have a version of it, but they treat their versions\
    \ differently. The client will subscribe to changes announced by the server and\
    \ update its model accordingly. The server will publish changes, listen to change\
    \ requests from the client, and update *its* model (its master copy) based on\
    \ these change requests.\n\nWow, one line of code that does all that! Of course,\
    \ there is more to it, but that's beyond the scope of this chapter, so we'll move\
    \ on.\n\n> To better understand Meteor data synchronization, see the Publish and\
    \ subscribe section of the meteor documentation at http://docs.meteor.com/#/full/meteor_publish.\n\
    \n## Full Stack Reactivity\n\nReactivity is integral to every part of Meteor.\
    \ On the client side, Meteor has the Blaze library, which uses HTML templates\
    \ and JavaScript helpers to detect changes and render the data in your UI. Whenever\
    \ there is a change, the helpers re-run themselves and add, delete, and change\
    \ UI elements, as appropriate, based on the structure found in the templates.\
    \ These functions that re-run themselves are called **reactive computations**.\n\
    \nOn both the client and the server, Meteor also offers reactive computations\
    \ without having to use a UI. Called the **Tracker** library, these helpers also\
    \ detect any data changes and re-run themselves accordingly. Because both the\
    \ client and the server are JavaScript-based, you can use the Tracker library\
    \ anywhere. This is defined as isomorphic or **full stack reactivity** because\
    \ you're using the same language (and in some cases the same code!) on both the\
    \ client and the server.\n\nRe-running functions on data changes has a really\
    \ amazing benefit for you, the programmer: you get to write code declaratively,\
    \ and Meteor takes care of the reactive part automatically. Just tell Meteor how\
    \ you want the data displayed, and Meteor will manage any and all data changes.\
    \ This declarative style is usually accomplished through the use of **templates**.\n\
    \nTemplates work their magic through the use of **view data bindings**. Without\
    \ getting too deep, a view data binding is a shared piece of data that will be\
    \ displayed differently if the data changes.\n\nLet's look at a very simple data\
    \ binding — one for which you don't technically need Meteor — to illustrate the\
    \ point. Let's perform the following set of steps to understand the concept in\
    \ detail:\n\n- 1. In LendLib.html, you will see an HTML-based template expression:\n\
    \n```\n<div id=\"categories-container\">\n    {{> categories}}\n</div>\n```\n\n\
    2. This expression is a placeholder for an HTML template that is found just below\
    \ it:\n\n```\n<template name=\"categories\">\n    <h2 class=\"title\">my stuff</h2>..\n\
    ```\n\n## Zagłębie Siarki (Sulfur Pits) – natura i przemysł.\n***\n> **EPUB Archiwa**\n\
    \n- learn meteor czy node.js : boilerplate ?\n\nNow, inside the `{{#each lists}}`\
    \ expression, there is one more Spacebars expression:\n\n```\n{{Category}}\n```\n\
    \nSince the expression is found inside the `#each` expression, it is considered\
    \ a property. That is to say that `{{Category}}` is the same as saying `this.Category`,\
    \ where `this` is the current item in the for-each loop. So, the placeholder is\
    \ saying, \"add the value of the `Category` property for the current record.\"\
    \n\nNow, if we look in `LendLib.js`, we will see the reactive values (called **reactive\
    \ contexts**) behind the templates:\n\n```\nlists : function () {\n    return\
    \ lists.find(...\n```\n\nHere, Meteor is declaring a template helper named `lists`.\
    \ The helper, `lists`, is found inside the template helpers belonging to `categories`.\
    \ The `lists` helper happens to be a function that returns all the data in the\
    \ `lists` collection, which we defined previously. Remember this line?\n\n```\n\
    lists = new Mongo.Collection(\"lists\");\n```\n\nThis `lists` collection is returned\
    \ by the above-mentioned helper. When there is a change to the `lists` collection,\
    \ the helper gets updated and the template's placeholder is changed as well.\n\
    \nLet's see this in action. On your web page pointing to `http://localhost:3000`,\
    \ open the browser console and enter the following line:\n\n```\n> lists.insert({Category:\"\
    Games\"});\n```\n\n## Why Meteor Rocks!\n\nThis will update the `lists` data collection.\
    \ The template will see this change and update the HTML code/placeholder. Each\
    \ of the placeholders will run one additional time for the new entry in `lists`,\
    \ and you'll see the following screen:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_56_0.png)\n\
    \nWhen the `lists` collection was updated, the `Template.categories.lists` helper\
    \ detected the change and reran itself (recomputed). This changed the contents\
    \ of the code meant to be displayed in the `{{> categories}}` placeholder. Since\
    \ the contents were changed, the affected part of the template was re-run.\n\n\
    Now, take a minute here and think about how little we had to do to get this reactive\
    \ computation to run: we simply created a template, instructing Blaze how we want\
    \ the `lists` data collection to be displayed, and we put in a placeholder. This\
    \ is simple, declarative programming at its finest!\n\n## Let's create some templates\n\
    \nWe'll now see a real-life example of reactive computations and work on our Lending\
    \ Library at the same time. Adding categories through the console has been a fun\
