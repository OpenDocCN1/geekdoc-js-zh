  md: "# Listing items\n\nThis is no good because we want to see our items. So, let's\
    \ add items back in and grab the appropriate list of items whenever a category\
    \ is selected. In `LenLib.js`, just below our first `Meteor.publish()` function\
    \ and inside the `if (Meteor.isServer)` block, add the following function:\n\n\
    ```\nMeteor.publish(\"listdetails\", function(category_id){\n  return lists.find({_id:category_id});\n\
    });\n```\n\nThis `publish` function will publish on the `listdetails` channel.\
    \ Any listener/subscriber will need to provide the `category_id` variable so that\
    \ our `find()` function returns a leaner recordset.\n\nNotice that nothing has\
    \ changed in our client yet (your items still aren't visible). This is because\
    \ we need to create the `subscribe` function.\n\nJust below our first `Meteor.subscribe()`\
    \ function, add the following function:\n\n```\nTracker.autorun(function() {\n\
    \  Meteor.subscribe(\"listdetails\", Session.get('current_list'));\n});\n```\n\
    \nSave your changes and check out your swag **Clothes** collection!\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_95_0.png)"
