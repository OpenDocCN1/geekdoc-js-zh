  md: '# Application Structure – Client, Server, and Public (oh my!)


    To allow you to jump right in, Meteor creates a default set of libraries, a default
    folder structure, and default permissions. This default configuration works great
    for quick development, testing, and learning as you go. It does not, however,
    make for a great production environment.


    In this chapter, we''ll go over the changes that you''ll want to make to the default
    configuration so that your app will be performant, secure, and easier to manage.
    Specifically, you will learn about the following topics:


    +   - Separating the client, server, and public files of your application

    - Enabling database security and user login

    - Tailoring display results to protect privacy


    # The client and server folders


    Up to this point, we''ve put all of our JavaScript code in one file: `LendLib.js`.


    Inside `LendLib.js`, we have two sections that are separated by `if` statements.
    The client-facing code is found inside the `if (Meteor.isClient) {...}` block,
    and the server-side code is found inside the `if (Meteor.isServer) {...}` block.


    This structure works fine for a very simple application, but when we are writing
    a more complex application, or we have multiple people working on the same app,
    trying to share one file with conditional statements will quickly turn into a
    nightmare situation.'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# Application Structure – Client, Server, and Public (oh my!)


    Additionally, Meteor will read any and all files in our application folders and
    try to apply JavaScript to both the client and the server. This makes for a sort
    of strange situation if we want to use a client-facing JavaScript library (for
    example, Twitter Bootstrap or jQuery). If we add the library to the root folder,
    Meteor will try to implement that file on both the client and the server. This
    either creates performance issues because we''re loading files to the server that
    it doesn''t need, or it produces errors because the server doesn''t know what
    to do with display objects (the server doesn''t display anything.)


    Conversely, if there is server-side code in files that are accessible by both
    the client and the server, the client may try to implement that code, which can
    cause all kinds of problems, or it will at the very least make the code available
    to the client, which could quickly become a security issue. There are some files
    and code that we don''t want the client to see or have access to.


    Let''s see an example of the client code being processed by the server, and then
    let''s move that code to a place where only the client will try to execute it.
    To do this, create a new file in `~/Documents/Meteor/` called `LendLibClient.js`.
    Then, open `LendLib.js` and cut the entire client code block from it, which is
    highlighted here:


    ```

    lists = new Mongo.Collection(''lists);


    [CUT ALL THIS CODE]


    if (Meteor.isServer){...

    ```


    > You should have to cut well over 175 lines of code. Make sure that you get the
    ending } bracket!


    Now, paste the code that you just cut into `LendLibClient.js` and save the changes
    to both files. You''ll notice that this makes no visual changes to your running
    application. This is because Meteor is processing both files, and the `if (Meteor.isClient)`
    condition stops the server from executing the code.


    But let''s see what happens when we remove the `if` condition. In `LendLibClient.js`,
    remove the first line containing the `if (Meteor.isClient) {` condition. Additionally,
    make sure that you remove the last line, containing the ending bracket (`)`),
    all the way at the bottom. Save `LendLibClient.js` and then take a look at your
    console where Meteor is running.'
  merge: -1
  pgno: 100
