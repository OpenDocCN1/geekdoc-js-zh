    # ## Summary


    In this chapter, you learned how Meteor compiles and searches for JavaScript and
    CSS code, and how you can optimize that search. You also learned how to protect
    your server code and keep things running smoothly and efficiently. In addition,
    you learned how to secure your database through the use of Meteor''s built-in
    `accounts` packages, and you closed some of the security loopholes in your application.
    Finally, you enabled multiple accounts, so anybody can use your Lending Library
    to keep track of their items, and you did this without compromising on the privacy
    of the end user.


    In the next chapter, you will learn how to deploy a Meteor application to a production
