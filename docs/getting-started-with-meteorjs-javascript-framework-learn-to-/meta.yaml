    \ `Template` object makes this possible, and we're going to follow the same pattern,\
    \ that is, to hook up our `categories` template.\n\n+   2. We want to declare\
    \ that the `categories` template has a `lists` collection. We do this by entering\
    \ the following code, just below the `Template.hello.events()` block:\n   \\`\\\
