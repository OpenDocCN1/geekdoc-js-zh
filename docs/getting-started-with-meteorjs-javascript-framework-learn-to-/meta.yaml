- img_proc: true
  md: "# Data – Meteor Style!\n\nThe preceding snippet of JSON tells the selector\
    \ that we want to get the `Category` field (`1` = `true` and `0` = `false`). Since\
    \ this is the only field mentioned and it's set to `1` (`true`), Meteor assumes\
    \ that you want to *exclude* all other properties. If you had only fields set\
    \ to `0` (`false`), Meteor would assume that you want to *include* all the other\
    \ fields that you didn't mention.\n\n> For more information on the `find()` function,\
    \ consult the MongoDB documentation at `http://docs.mongodb.org/manual/applications/crud/`.\n\
    \nSo, if you save this change, your browser will refresh and nothing will happen\
