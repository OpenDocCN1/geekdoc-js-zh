- md: " ## Templates\n\nWe need to represent this items array to our HTML template,\
    \ but we need a couple of extra properties so that the view knows what to do with\
    \ it. Specifically, we need to do the following things:\n\n- Return the name of\
    \ the lendee or return \"free\" if there is no lendee (item.Lendee)\n- Return\
    \ the CSS class (red or green), depending on whether the item is lent out (item.LendClass)\n\
    \nSo, we're going to get the items collection from the currently selected list,\
    \ add the Lendee and LendClass properties, and make the template available as\
    \ follows:\n\n1. Open the LendLib.js file under ~/Documents/Meteor/LendLib/.\n\
    2. Immediately after the closing \"}\" curly bracket of the focusText() function,\
    \ add the following highlighted code:\n\n```\nfunction focusText(i) {\n  ...\n\
    };\nTemplate.list.helpers({\n  items: function () {\n    if (Session.equals('current_list',\
    \ null))\n      return null;\n    else {\n      var cats = lists.findOne({\n \
    \       _id: Session.get('current_list')\n      });\n      if (cats && cats.items)\
    \ {\n        for (var i = 0; i < cats.items.length; i++) {\n          var itm\
    \ = cats.items[i];\n          itm.Lendee = itm.LentTo ? itm.LentTo :\n       \
    \   \"free\";\n          itm.LendClass = itm.LentTo ?\n            \"label-danger\"\
    \ : \"label-success\";\n        }\n        return cats.items;\n      };\n    }\n\
    \  }\n});\n```\n\nNow, we'll walk through this step by step. Consider the following\
    \ code snippet:\n\n```\nitems: function () {\n  if (Session.equals('current_list',null))\n\
    \    return null;\n```\n\nHere, we're declaring the `Template.list.items` helper\
    \ and checking to see whether a `list` is selected. If a `list` is selected, the\
    \ session variable, `current_list`, will have a value in it. If it's `null`, there's\
    \ no reason to return anything; so, we'll just return `null`.\n\n> This is the\
    \ glue at work. It is reactively reading the contents of a given category and\
    \ incorporating it into the current state of the UI, depending on whether the\
    \ user has selected a list.\n\nIf something is selected, we need to first find\
    \ the category. We'll call it `cats` because it's shorter even though it's not\
    \ strictly speaking the best naming convention. But what do we care? We're doing\
    \ this for fun, and cats are awesome!\n\n```\nelse {\n  var cats = lists.findOne({_id:Session.get('current_list')});\n\
    ```\n\nWe are using the MongoDB command, `findOne()`, and passing the `current_list`\
    \ session parameter as `_id` in the selector/query. If something is selected,\
    \ we will get a single category/list back. Let's check to make sure that we do\
    \ and we also get `items`.\n\nIf nothing returns, or there are no `items` in the\
    \ category, we don't really need to figure out the `Lendee` or the `LendClass`,\
    \ do we? So, let's create an `if` statement and a `for` statement inside the `if`\
    \ that will only get executed if we have something worth iterating over:\n\n```\n\
    if (cats && cats.items) {\n  for (var i = 0; i < cats.items.length; i++) {\n \
    \   var itm = cats.items[i];\n    itm.Lendee = itm.LentTo ? itm.LentTo :\n   \
    \ \"free\";\n    itm.LendClass = itm.LentTo ?\n      \"label-danger\" : \"label-success\"\
    ;\n  }\n  return cats.items;\n};\n```\n\nFirst, we check to see whether `cats`\
    \ and `cats.items` are not `undefined`/`null`.\n\nNext, we iterate over all the\
    \ values in `items` (`items` is an array, if you recall). To make it easier, we\
    \ declare the variable `itm = cats.item[i]`.\n\n## Templates\n\nThen, we add the\
    \ `Lendee` property, checking to see whether the item is lent to anyone with the\
    \ `LentTo` property. If it isn't (if `LentTo` doesn't exist), we'll assign the\
    \ \"free\" string instead.\n\nLikewise, if `LentTo` exists, we declare the red\
    \ bootstrap label class, `label-important`, as the `LendClass`. If the item is\
    \ not lent out, we'll use the green bootstrap class, `label-success`, instead.\n\
    \nFinally, with our new `Lendee` and `LendClass` properties assigned, we'll return\
    \ `cats.items`. We didn't save these properties to our data collection. This is\
    \ because they're not part of the data collection. They're used by the Blaze to\
    \ modify the look and feel of our UI, so we'll only need to make them available\
    \ via the template helper.\n\n## Additional view states\n\nWe now need to declare\
    \ the templates for all the different view states. That is, we need to add properties\
    \ to our templates that will let us know what we're looking at, what we're editing,\
    \ and what should be hidden/visible. Specifically, we need to access the state\
    \ value in four situations:\n\n- What list are we looking at? (`list_status`)\n\
    - Are we looking at a list? (`list_selected`)\n- Are we adding an item to a list?\
    \ (`list_adding`)\n- Are we updating the lendee? (`lendee_editing`)\n\nThe `list_status`\
    \ property will be attached to each category. If the category is selected (if\
    \ `current_id` is set to that category's `id`), we will change the color from\
    \ `btn-primary` (blue) to `btn-info` (light blue). Since it's a property on the\
    \ category, we need to add it to the `Template.categories.helpers()` section.\
    \ To do this, add the following code just below the `new_cat` template helper:\n\
    \n```\nnew_cat: function () {\n  ...\n},\nlist_status: function () {\n  if (Session.equals('current_list',\
    \ this._id))\n    return \" btn-info\";\n  else\n    return \" btn-primary\";\n\
    }\n```\n\nThe rest of the properties belong to `lists` and `list items`, so we\
    \ will add the following to the `Template.lists.helpers()` method, just below\
    \ the `items` template helper:\n\n```\nitems: function () {\n  ...\n},\nlist_selected:\
    \ function () {\n  return ((Session.get('current_list') != null) && (!Session.equals(\n\
    \    'current_list', null)));\n},\nlist_adding: function () {\n  return (Session.equals('list_adding',\
    \ true));\n},\nlendee_editing: function () {\n  return (Session.equals('lendee_input',\
    \ this.Name));\n}\n```\n\nLet's go over each of these template functions.\n\n\
    ```\nlist_selected: function () {\n  return ((Session.get('current_list') != null)\
    \ && (\n    !Session.equals('current_list', null)));\n},\n```\n\nThe session variable,\
    \ `current_list`, can be either `undefined` or `null`. If it's `undefined`, then\
    \ `Session.equals('current_list', null)` will return `true`. So, we need to check\
    \ both cases unfortunately.\n\n```\nlist_status: function () {\n  if (Session.equals('current_list',\
    \ this._id))\n    return \" btn-info\";\n  else\n    return \" btn-primary\";\n\
    }\n```\n\nNow, `list_status` is used to tell the category button whether it should\
    \ show as selected. The easiest way to do this is via a CSS class. Bootstrap uses\
    \ `btn-primary` to show white-on-blue text but that's the default look and feel.\
    \ For the selected category, we will change the background color to a lighter\
    \ blue, using the `btn-info` class.\n\nIn other words, for the `current_list`,\
    \ we'll return `btn-info`. For all the other `lists`/categories, we'll return\
    \ `\"btn-inverse\"` to change the CSS style.\n\n## Templates\n\nYou may be wondering\
    \ about `this._id`. Now, `this`, in this instance, refers to the MongoDB record\
    \ (technically the __document cursor__), and `._id` is the unique MongoDB identifier\
    \ for that record. This is called the __context__, and in this case, when using\
    \ the HTML template, the context is implied to be the list/category element from\
    \ where the template was called.\n\n```\nlist_adding: function () {\n  return\
    \ (Session.equals('list_adding', true));\n},\n```\n\nThis one's really straightforward.\
    \ If the `Session` variable, `list_adding`, is `true`, we'll add it to the list.\
    \ If it isn't, we won't.\n\n```\nlendee_editing: function () {\n  return (Session.equals('lendee_input',\
    \ this.Name));\n}\n```\n\nTo check and see whether we should be in the \"lendee\
    \ editing\" mode, we'll check the `Session` variable, `lendee_input`, to see whether\
    \ it has a value and if that value is the `Name` of the item on which we just\
    \ clicked. Once again, this is the implied context. This time, it's not the list,\
    \ it's the item. How do we know this? Because of where this function is called\
    \ from. Remember the HTML code?\n\n```\n<div class=\"lending_item list-group-item\"\
    >\n  <button type=\"button\"\n  class=\"close delete_item\">×</button>\n  {{Name}}\n\
    \  {{#if lendee_editing}}\n```\n\nNotice how we use `lendee_editing` in the `if`\
    \ statement, right after we use `{{Name}}`. This shows us the context. The `this.Name`\
    \ statement in `LendLib.js` has the same context as `{{Name}}` in `LendLib.html`.\
    \ In other words, `this.Name` is referencing the same property as `{{Name}}`.\n\
    \nWhile we're here in the HTML templates, there's one change that we need to make\
    \ to the HTML `categories` template. We waited until now so that the change would\
    \ make sense. When you make the following code change, you'll see how the `{{list_status}}`\
    \ and `{{_id}}` templates are used, and why the context for `this._id` suddenly\
    \ makes sense.\n\nLocate the following lines in `LendLib.html` (they should begin\
    \ from the 27th line or so):\n\n```\n{{#each lists}}\n  <div class=\"category\
    \ btn btn-primary\">\n    {{Category}}\n```"
