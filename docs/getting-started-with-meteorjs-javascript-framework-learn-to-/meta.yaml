  - "[PAGE 115]\n\n> If you want to clear out all users as well, you can do this by\
    \ stopping the Meteor application, then running `meteor reset` in the terminal\
    \ window, and finally, restarting the Meteor application. *Be careful!* There's\
    \ no warning and no takebacks!\n\n# Adding owner privileges\n\nAdding an owner\
    \ to any new categories is pretty simple. We just need to update our `lists.insert()`\
    \ function and add the owner field. To do this, open `LendLibClient.js` and locate\
    \ the `Templates.categories.events` declaration. Inside the event delegate for\
