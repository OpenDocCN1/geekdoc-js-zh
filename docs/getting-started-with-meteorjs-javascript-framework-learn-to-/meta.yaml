    \ is the closing bracket for if(Meteor.is_client) ----\n```\n\nSix events! It\
    \ looks more monstrous than it is. As usual, let's break it down, step by step.\n\
    \n```\nTemplate.list.events({\n  'click #btnAddItem': function (e,t){\n    Session.set('list_adding',true);\n\
    \    Tracker.flush();\n    focusText(t.find(\"#item_to_add\"));\n  },\n```\n\n\
    We declare `Template.lists.events` and enumerate our events. The first one is\
