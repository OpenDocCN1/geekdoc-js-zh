  md: "# Application Structure – Client, Server, and Public (oh my!)\n\n# The public\
    \ folder\n\nIt's pretty logical that the `client` folder will only be processed\
    \ by the client, and the `server` folder will only be processed by the server.\
    \ However, there's one more consideration that we need to make, and that's for\
    \ **assets** (images, text/content files, and so on).\n\nThe assets are only needed\
    \ at runtime. We don't depend on them for any logic or processing. So, if we can\
    \ get them out of the way, the Meteor compiler can ignore them, which will speed\
    \ up the processing and delivery of our application.\n\nThat's where the `public`\
    \ folder comes into play. When Meteor is compiling CSS or JavaScript for both\
    \ the client and the server, it ignores anything inside the `public` folder. Then,\
    \ after all the compiling is done, it will use the `public` folder to access any\
    \ asset it may need to deliver.\n\nLet's add a \"Created with Meteor\" badge at\
    \ the bottom of our app. The handsome and generous people at MDG have created\
    \ a great new logo, and it just so happens to be available on Wikimedia. You can\
    \ navigate to `http://upload.wikimedia.org/wikipedia/en/a/a4/Meteor-logo.png`\
    \ and download the image.\n\nBefore we can use our downloaded image, we need to\
    \ make a quick change to `LendLib.css` and create a `public` folder:\n\n+   1.\
    \ Open `LendLib.css` (which can be found in `~/Documents/Meteor/LendLib/` unless\
    \ you moved it to the `client` folder, which is totally fine) and add the following\
    \ CSS declaration:\n\n```\n.madewith img{\n  width:15rem;\n}\n```\n\n+   2. Now,\
    \ open `LendLib.html` and find the `<body>` element. Just before the last `</div>`\
    \ tag, insert the following code:\n\n```\n<body>\n  <div id=\"lendlib\" class=\"\
    container\">\n    ...\n    <div class=\"madewith pull-right\">\n      Made with\
    \ <img src=\"Meteor-logo.png\" alt=\"\">\n    </div>\n  </div>\n</body>\n```"
  merge: -1
