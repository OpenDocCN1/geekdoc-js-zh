    \nSave your changes and check out your swag **Clothes** collection!\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_95_0.png)"
  - "[PAGE 96]\n\nLet's look under the hood here for a minute and figure out what\
    \ just happened. Notice that the subscription uses `Session.get('current_list')`.\
    \ This is a reactive context. The `Tracker.autorun()` method is a reactive computation.\
    \ This means that, any time the `current_list` variable changes, `Tracker.autorun()`\
    \ re-runs itself and the subscription is updated with the new ID found in the\
