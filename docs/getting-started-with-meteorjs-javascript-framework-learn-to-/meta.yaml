- md: " # Application Structure – Client, Server, and Public (oh my!)\n\nYou will\
    \ now be logged in as admin, as shown in the following screenshot, and we can\
    \ proceed with configuring permissions.\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_110_0.png)\n\
    \n## Granting admin permissions\n\nNow that we have our admin account, let's allow\
    \ the account to make any changes that are needed in the UI. At the same time,\
    \ we'll remove the ability of the user to make changes in the browser console\
    \ if they are not logged in as admin.\n\nOur original `LendLibServer.js` file\
    \ currently only has a `Meteor.startup()` method in it. We will add some account\
    \ checking code to it, ensuring that only the admin account can make changes.\n\
    \nAdd the following code to the very bottom of `LendLibServer.js` and save your\
    \ changes:\n\n```\n/*checks to see if the current user making the request to update\
    \ is the admin user */\n\nfunction adminUser(userId) {\n  var adminUser = Meteor.users.findOne({username:\"\
    admin\"});\n  return (userId && adminUser && userId === adminUser._id);\n}\n\n\
    lists.allow({\n  insert: function(userId, doc){\n    return adminUser(userId);\n\
    \  },\n  update: function(userId, docs, fields, modifier){\n    return adminUser(userId);\n\
    \  },\n  remove: function (userId, docs){\n    return adminUser(userId);\n  }\n\
    });\n```\n\nNow, at this moment, we have a very interesting situation; if you\
    \ save all of your changes and refresh your browser, you'll receive an error message:\n\
    \n```\nReferenceError: lists is not defined\n    at app/server/LendLibServer.js:15:1\n\
    \    at app/server/LendLibServer.js:27:3\n    at\n```\n\nWe know that we created\
    \ a `lists` collection. We've been using it for a while now. So, what gives? Meteor\
    \ has a certain order of invocation for the files, and as a general rule, any\
    \ files in a child directory are executed first. Since we moved our `LendLibServer.js`\
    \ file into the `server/` subfolder, it is being executed before our `LendLib.js`\
    \ file that is found in the project's root folder.\n\nTo fix this, we need to\
    \ create a new subfolder:\n\n```\n$ mkdir ~/Documents/Meteor/LendLib/both\n```\n\
    \nNow, move `LendLib.js` into the `both/` subfolder. Refresh your application,\
    \ and everything will work again.\n\nGetting back to the code, the `adminUser`\
    \ function is used in multiple places; so, it makes sense to create a common function\
    \ that simply checks to see whether the `userId` making the request is the same\
    \ as the `_id` of the admin account.\n\n`lists.allow` sets up the conditions upon\
    \ which operations are allowed, with each operation having a function that returns\
    \ `true` to allow execution and `false` to deny it. We could, for example, set\
    \ the `remove` function check to always return `false` if we never wanted to let\
    \ anyone (including the admin account) delete categories.\n\nFor now, we simply\
    \ want to make the operations conditional on whether the admin account is logged\
    \ in and is making the request, so we will set each function to `return adminUser(userId);`.\n\
    \nIn our browser, we can now test our permissions. Add a new category (anything\
    \ you'd like, but we'll add `Glassware`), add a new item, change an owner, and\
    \ so on; all operations should now be allowed, provided you're logged in as admin.\n\
    \nLet's make sure that the access is indeed linked to our admin account. Log out\
    \ of the app by clicking on **admin** in the top-left corner and then the **Sign\
    \ out** button:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_112_0.png)\n\nNow,\
    \ in the browser console, enter the following command (or equivalent for the category\
    \ you added):\n\n```\n> lists.remove(lists.findOne({Category:\"Glassware\"})._id)\n\
    ```\n\nYou will again receive an **Access denied** message:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_112_1.png)\n\
    \nLog back in as admin and run the command again. This time the category will\
    \ be removed. By setting the permissions and permitted actions on the `lists`\
    \ level using `lists.allow()`, we've made it impossible for anyone to make changes\
    \ without being logged in as admin. Both the UI and the browser console are now\
    \ secure from the evil machinations of one STEVE, the wrench thief!\n\n## Customizing\
    \ results\n\nThere is one more thing we should take into consideration when it\
    \ comes to security and usability of our app. What if we could enable multiple\
    \ users to use the Lending Library, with each user only able to see the items\
    \ that belong to them? If we did this, we could stop people from being able to\
    \ see what kinds of things other people own, and at the same time, we could allow\
    \ each person to track their own stuff. We originally set out to just create an\
    \ app for ourselves, but with a little tweaking, we can let anyone use it, and\
    \ they'll think we're awesome and maybe buy us lunch! Or...a new wrench!\n\n###\
    \ Modifying Meteor.publish()\n\nIn preparation for multiple people using our application,\
    \ we need to make sure that no one can see anyone else's stuff. This is done inside\
    \ the `Meteor.publish()` declaration for **categories**. Logically, if we limit\
    \ which categories can be seen by a user, this limitation will cascade to the\
    \ visible **items** because items are found inside `categories`.\n\nOpen `LendLibServer.js`\
    \ and modify the `find({})` block for the `Meteor.publish(\"Categories\")` method,\
    \ similar to the following code:\n\n```\nMeteor.publish(\"Categories\", function()\
    \ {\n  return lists.find({owner:this.userId},{fields:{Category:1}});\n});\n```\n\
    \nAdding the `owner:this.userId` selector will check each list in our `lists`\
    \ repository and return the value under `Category` for each instance where the\
    \ currently logged in user is the owner of the list. Save this change, and you'll\
    \ notice that all of the current categories have disappeared!\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_114_0.png)\n\
    \nThis is because the categories that we created already don't have any `owner`,\
    \ and we're logged in as admin; so, the owner property (`undefined`) doesn't match.\
    \ We're going to experience similar problems when we go to try and modify existing\
    \ items because no `items` have any owner either.\n\nWe have several options to\
    \ fix this, including manually adding the admin account as the owner, letting\
    \ the admin account see all unclaimed `lists`, or we can just start with a clean\
    \ slate. Since we only lent out one item (dang it, STEVE! We want our wrench back!),\
    \ now is a good time to clear out our database and add back our linear compression\
    \ wrench, before we forget who has it (yeah, right!)\n\nOpen a new terminal window\
    \ (keep your app running) and navigate to the root folder of your app. Once there,\
    \ we're going to run the `meteor shell` command:\n\n```\n$ cd ~/Documents/Meteor/LendLib\n\
    $ meteor shell\n```\n\nThis will start up the server-side equivalent of the browser\
    \ console. In this server console, enter the following command:\n\n```\n> lists.remove({})\n\
    ```\n\nThis will remove all of our categories, and we can start over once we've\
    \ added an owner for newly-created categories.\n\n> If you want to clear out all\
    \ users as well, you can do this by stopping the Meteor application, then running\
    \ `meteor reset` in the terminal window, and finally, restarting the Meteor application.\
    \ *Be careful!* There's no warning and no takebacks!\n\n## Adding owner privileges\n\
    \nAdding an owner to any new categories is pretty simple. We just need to update\
    \ our `lists.insert()` function and add the owner field. To do this, open `LendLibClient.js`\
    \ and locate the `Templates.categories.events` declaration. Inside the event delegate\
    \ for `keyup #add-category`, you will see the `lists.insert()` function call.\
    \ Modify this call as follows:\n\n```\n'keyup #add-category': function (e, t)\
    \ {\n   ...\n   lists.insert({\n      Category: catVal,\n      owner: Meteor.userId()\n\
    \   });\n   ...\n},\n```\n\nNow, whenever a new list is added, instead of just\
    \ adding a `Category` field, we will also add an owner field. This allows our\
    \ `Meteor.publish()` code to work correctly for any new `lists` that we make.\n\
    \nLet's add back the **Tools** Category, enter the item **Linear Compression Wrench**\
    \ and assign the Lendee as **STEVE**:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_115_0.png)"
  mdcn: "\n # 应用结构——客户端、服务器和公共资源（天哪！）\n\n你现在将以管理员身份登录，如下截图所示，然后我们就可以继续配置权限了。\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_110_0.png)\n\
    \n## 授予管理员权限\n\n现在我们有了管理员账户，接下来让这个账户能够在 UI 中进行任何必要的更改。同时，如果用户没有以管理员身份登录，我们将移除其在浏览器控制台中进行更改的能力。\n\
    \n我们原来的 `LendLibServer.js` 文件目前只有一个 `Meteor.startup()` 方法。我们将为它添加一些账户检查代码，确保只有管理员账户才能进行更改。\n\
    \n在 `LendLibServer.js` 的最底部添加以下代码并保存更改：\n\n```\n/*检查发起更新请求的当前用户是否为管理员用户*/\n\n\
    function adminUser(userId) {\n  var adminUser = Meteor.users.findOne({username:\"\
    admin\"});\n  return (userId && adminUser && userId === adminUser._id);\n}\n\n\
    lists.allow({\n  insert: function(userId, doc){\n    return adminUser(userId);\n\
    \  },\n  update: function(userId, docs, fields, modifier){\n    return adminUser(userId);\n\
    \  },\n  remove: function (userId, docs){\n    return adminUser(userId);\n  }\n\
    });\n```\n\n现在，此时此刻，我们面临一个非常有趣的情况；如果你保存所有更改并刷新浏览器，你会收到一条错误信息：\n\n```\nReferenceError:\
    \ lists is not defined\n    at app/server/LendLibServer.js:15:1\n    at app/server/LendLibServer.js:27:3\n\
    \    at\n```\n\n我们知道我们创建了一个 `lists` 集合。我们已经使用它有一段时间了。那么，问题出在哪里？Meteor 对文件有特定的调用顺序，一般来说，子目录中的任何文件都会先执行。由于我们将\
    \ `LendLibServer.js` 文件移动到了 `server/` 子文件夹中，它会先于项目根文件夹中的 `LendLib.js` 文件执行。\n\n\
    为了解决这个问题，我们需要创建一个新的子文件夹：\n\n```\n$ mkdir ~/Documents/Meteor/LendLib/both\n```\n\
    \n现在，将 `LendLib.js` 移动到 `both/` 子文件夹中。刷新你的应用，一切就会恢复正常。\n\n回到代码本身，`adminUser` 函数在多处被使用；因此，创建一个通用函数来简单检查发起请求的\
    \ `userId` 是否与管理员账户的 `_id` 相同，是很有意义的。\n\n`lists.allow` 设置了允许操作的条件，每个操作都有一个函数，返回\
    \ `true` 表示允许执行，返回 `false` 表示拒绝执行。例如，我们可以将 `remove` 函数的检查设置为始终返回 `false`，这样无论谁（包括管理员账户）都无法删除类别。\n\
    \n目前，我们只想让操作以管理员账户是否登录并发起请求为条件，所以我们将每个函数设置为 `return adminUser(userId);`。\n\n在我们的浏览器中，我们现在可以测试权限了。添加一个新类别（任何你喜欢的，但我们会添加\
    \ `Glassware`），添加一个新项目，更改所有者，等等；只要你以管理员身份登录，所有操作现在都应该被允许。\n\n让我们确保访问确实与我们的管理员账户关联。点击左上角的\
    \ **admin**，然后点击 **Sign out** 按钮退出应用：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_112_0.png)\n\
    \n现在，在浏览器控制台中，输入以下命令（或你添加的类别的等效命令）：\n\n```\n> lists.remove(lists.findOne({Category:\"\
    Glassware\"})._id)\n```\n\n你会再次收到 **Access denied** 消息：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_112_1.png)\n\
    \n重新以管理员身份登录并再次运行该命令。这次类别将被删除。通过在 `lists` 级别使用 `lists.allow()` 设置权限和允许的操作，我们让任何未以管理员身份登录的人都无法进行更改。无论是\
    \ UI 还是浏览器控制台，现在都免受某个叫 STEVE 的扳手大盗的邪恶图谋了！\n\n## 自定义结果\n\n关于应用的安全性和可用性，还有一件事我们需要考虑。如果我们能让多个用户使用借阅图书馆，每个用户只能看到属于自己的物品，会怎样呢？如果这样做了，我们可以阻止人们看到其他人拥有什么样的东西，同时让每个人都能追踪自己的物品。我们最初只是想为自己创建一个应用，但只需稍作调整，我们就可以让任何人使用它，他们会觉得我们很了不起，也许会请我们吃午饭！或者……一把新扳手！\n\
    \n### 修改 Meteor.publish()\n\n为了准备多人使用我们的应用，我们需要确保没有人能看到其他人的东西。这是在 **categories**\
    \ 的 `Meteor.publish()` 声明中完成的。从逻辑上讲，如果我们限制用户能看到哪些类别，这个限制将级联到可见的 **items**，因为物品都在\
    \ `categories` 里面。\n\n打开 `LendLibServer.js` 并修改 `Meteor.publish(\"Categories\"\
    )` 方法的 `find({})` 块，类似于以下代码：\n\n```\nMeteor.publish(\"Categories\", function()\
    \ {\n  return lists.find({owner:this.userId},{fields:{Category:1}});\n});\n```\n\
    \n添加 `owner:this.userId` 选择器会检查我们 `lists` 仓库中的每个列表，并返回当前登录用户作为列表所有者的每个实例中 `Category`\
    \ 的值。保存此更改后，你会注意到所有当前类别都消失了！\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_114_0.png)\n\
    \n这是因为我们已经创建的类别没有任何 `owner`，而我们登录的是管理员账户；因此，owner 属性（`undefined`）不匹配。当我们尝试修改现有项目时，也会遇到类似的问题，因为也没有任何\
    \ `items` 拥有所有者。\n\n我们有几种修复方案，包括手动将管理员账户添加为所有者、让管理员账户查看所有未认领的 `lists`，或者我们可以直接从头开始。既然我们只借出了一件物品（该死，STEVE！把扳手还给我们！），现在是清空数据库并重新添加线性压缩扳手的好时机，趁我们还没忘记谁拿着它（是啊，才怪！）\n\
    \n打开一个新的终端窗口（保持你的应用运行）并导航到你应用的根文件夹。到了那里后，我们将运行 `meteor shell` 命令：\n\n```\n$ cd\
    \ ~/Documents/Meteor/LendLib\n$ meteor shell\n```\n\n这将启动浏览器控制台的服务器端等效版本。在这个服务器控制台中，输入以下命令：\n\
    \n```\n> lists.remove({})\n```\n\n这将移除我们所有的类别，一旦我们为新建类别添加了所有者，我们就可以重新开始了。\n\n\
    > 如果你想同时清空所有用户，可以通过停止 Meteor 应用，然后在终端窗口中运行 `meteor reset`，最后重新启动 Meteor 应用来实现。*小心！*\
    \ 没有警告，也没有撤销！\n\n## 添加所有者权限\n\n为任何新类别添加所有者非常简单。我们只需要更新 `lists.insert()` 函数并添加\
    \ owner 字段。为此，打开 `LendLibClient.js` 并找到 `Templates.categories.events` 声明。在 `keyup\
    \ #add-category` 的事件委托中，你会看到 `lists.insert()` 函数调用。按如下方式修改此调用：\n\n```\n'keyup\
    \ #add-category': function (e, t) {\n   ...\n   lists.insert({\n      Category:\
    \ catVal,\n      owner: Meteor.userId()\n   });\n   ...\n},\n```\n\n现在，每当添加新列表时，我们不仅添加\
    \ `Category` 字段，还会添加 owner 字段。这让我们的 `Meteor.publish()` 代码对我们创建的任何新 `lists` 都能正确工作。\n\
    \n让我们重新添加 **Tools** 类别，输入物品 **Linear Compression Wrench** 并将借用人指定为 **STEVE**：\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_115_0.png)\n"
