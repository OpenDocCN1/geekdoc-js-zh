    *Data – Meteor Style!*


    # # Configuring publishers


    Up to this point, we have been using a Meteor package named **autopublish**. This
    means that we haven''t had to code specific `publish` events for changes to be
    broadcast from the server to the client. This is great for testing, but we want
    to have a bit more control over what events and documents get published so that
    we that can improve both performance and security.


    If we have a large dataset, we may not want to return the entire collection every
    time. If `autopublish` is being used, the entire collection will return, and this
    can slow things down or expose data that we don''t want to expose.


    # # Turning off autopublish


    The time has come to turn off `autopublish`. Temporarily stop your Meteor application
    (if it''s still running) by opening the terminal window from which you ran the
    `meteor` command. You can stop it by pressing *Ctrl* + *C*. Once it''s stopped,
    enter the following command:


    ```

    > meteor remove autopublish

    ```


    This removes the `autopublish` package, which is responsible for all the automatic
    publishing of all events inside Meteor.


    > > It''s considered a best practice to remove `autopublish` from your project.
    The `autopublish` package is for developing and debugging and should be turned
    off when you''re ready to start using your application in earnest.


    By turning this off, you''ve effectively disabled your application from doing
    anything! Congratulations! You can see your amazing progress by starting up your
    Meteor service again (to do this, enter the `meteor` command and press *Enter*)
    and by opening/navigating to `http://localhost:3000`. You will then see the following
    screen:


    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_90_0.png)


