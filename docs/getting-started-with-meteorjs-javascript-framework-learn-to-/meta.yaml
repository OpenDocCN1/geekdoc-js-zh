    button\"\n  class=\"close delete_item\">×</button>\n  {{Name}}\n  {{#if lendee_editing}}\n\
    ```\n\nNotice how we use `lendee_editing` in the `if` statement, right after we\
    \ use `{{Name}}`. This shows us the context. The `this.Name` statement in `LendLib.js`\
