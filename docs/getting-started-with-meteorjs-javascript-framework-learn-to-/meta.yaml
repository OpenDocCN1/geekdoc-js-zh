- md: " Let's check the browser console:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_103_0.png)\n\
    \nYes! We did do something naughty! The reason this (unfortunately) didn't interfere\
    \ with or affect the rest of the application is two-fold:\n\n- It's the client\
    \ side (browser) that threw the error, which won't affect the server application.\n\
    - The only code in `LendLibServer.js` is the server code; if this code breaks\
    \ on the client side, it will be no big deal because it wasn't supposed to run\
    \ on the client anyway.\n\nThe end user will never know that the error is there,\
    \ but we will; so, let's fix it. Move `LendLibServer.js` to `~/Documents/Meteor/LendLib/server/`.\
    \ The error will go away and all will be right again in our tiny little Meteor\
    \ kingdom.\n\n## Application Structure – Client, Server, and Public (oh my!)\n\
    \n### The public folder\n\nIt's pretty logical that the `client` folder will only\
    \ be processed by the client, and the `server` folder will only be processed by\
    \ the server. However, there's one more consideration that we need to make, and\
    \ that's for **assets** (images, text/content files, and so on).\n\nThe assets\
    \ are only needed at runtime. We don't depend on them for any logic or processing.\
    \ So, if we can get them out of the way, the Meteor compiler can ignore them,\
    \ which will speed up the processing and delivery of our application.\n\nThat's\
    \ where the `public` folder comes into play. When Meteor is compiling CSS or JavaScript\
    \ for both the client and the server, it ignores anything inside the `public`\
    \ folder. Then, after all the compiling is done, it will use the `public` folder\
    \ to access any asset it may need to deliver.\n\nLet's add a \"Created with Meteor\"\
    \ badge at the bottom of our app. The handsome and generous people at MDG have\
    \ created a great new logo, and it just so happens to be available on Wikimedia.\
    \ You can navigate to `http://upload.wikimedia.org/wikipedia/en/a/a4/Meteor-logo.png`\
    \ and download the image.\n\nBefore we can use our downloaded image, we need to\
    \ make a quick change to `LendLib.css` and create a `public` folder:\n\n1. Open\
    \ `LendLib.css` (which can be found in `~/Documents/Meteor/LendLib/` unless you\
    \ moved it to the `client` folder, which is totally fine) and add the following\
    \ CSS declaration:\n\n```\n.madewith img{\n  width:15rem;\n}\n```\n\n2. Now, open\
    \ `LendLib.html` and find the `<body>` element. Just before the last `</div>`\
    \ tag, insert the following code:\n\n```\n<body>\n  <div id=\"lendlib\" class=\"\
    container\">\n    ...\n    <div class=\"madewith pull-right\">\n      Made with\
    \ <img src=\"Meteor-logo.png\" alt=\"\">\n    </div>\n  </div>\n</body>\n```\n\
    \nSave these changes. Nothing much should have happened (yet), but we'll take\
    \ care of that right now.\n\n3. Create a folder named `public` under `~/Documents/Meteor/LendLib/`.\
    \ Now, move the downloaded `Meteor-logo.png` image into the newly-created `public`\
    \ folder:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_105_0.png)\n\nYou now have\
    \ a snazzy \"made with Meteor\" badge in the bottom-right corner.\n\nThis file\
    \ is safely tucked away in the `public` folder, so the Meteor compiler doesn't\
    \ have to deal with it. However, it's still available and ready to go when it\
    \ needs to be served to a client for display purposes.\n\n> \U0001F4A1 Other folders\
    \ exist, which have varying effects and purposes. For a full explanation, consult\
    \ the Meteor documentation at `http://docs.meteor.com/#/full/structuringyourapp`.\n\
    \n## The security and accounts\n\nAt this point, our Lending Library app does\
    \ exactly what we want it to do. It keeps track of all our stuff and to whom we've\
    \ lent items. However, if we were to put this app into use, there are some security\
    \ issues inside the app itself that we'd have to deal with first.\n\nFirst and\
    \ foremost, what's to stop someone from accessing our app and erasing their name\
    \ from an item they borrowed? That scumbag STEVE might just keep our linear compression\
    \ wrench forever if he were so inclined, and we'd have no way of proving whether\
    \ or not he still had it.\n\nWe cannot let such thievery and dishonesty go unpunished!\
    \ STEVE must be held accountable! So, we need to implement security. Specifically,\
    \ we need to perform two actions:\n\n- Only allow editing in the UI by the owner\
    \ of the items\n- Secure the database so that changes can't be made using the\
    \ web console\n\n### Removing insecure\n\nThe first step in accomplishing these\
    \ two goals is to remove the `insecure` library from Meteor. By default, the `insecure`\
    \ library is included so that we can go about building our application without\
    \ having to worry about security until we've got our security strategy in place\
    \ and written most of our code.\n\nThe time has come. We know what we want security-wise,\
    \ so let's go ahead and get rid of that library. Stop the Meteor application (press\
    \ Ctrl + C in the terminal window) and enter the following command (you need to\
    \ be in the `LendLib/` directory):\n\n```\n$ meteor remove insecure\n```\n\nThis\
    \ will generate the following message:\n\n```\nChanges to your project's package\
    \ version selections:\ninsecure removed from your project\ninsecure: removed dependency\n\
    ```\n\nOur application is now secure. In fact, it's actually too secure. Start\
    \ *Meteor* again (type *meteor* in the terminal and press *Enter*) and navigate\
    \ to our app in a browser window using `http://localhost:3000`. Once there, try\
    \ to add a new item, add a lendee, or even delete an item. We'll try to lend our\
    \ favorite shirt to our significant other, but nothing will happen—no deletions,\
    \ no additions, and no changes. Nothing will work! If you open the browser console,\
    \ you'll see that every attempt to update the database will be met with the **update\
    \ failed: Access denied** message:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_107_0.png)\n\
    \nThese messages are displayed because we removed the *insecure* package. Put\
    \ another way, no client-initiated changes are allowed anymore. When the change\
    \ request goes from the client to the server, there are no *allow* conditions;\
    \ therefore, the request will be denied.\n\n### Adding an admin account\n\nTo\
    \ re-enable the update functionality, we need to be able to create an admin account,\
    \ give the admin account permissions to make changes, and provide the user with\
    \ a way to recover a lost password.\n\nWe'll first need to add three built-in\
    \ Meteor packages. Stop the Meteor application, and in the terminal window, enter\
    \ the following command:\n\n```\n$ meteor add accounts-password\n```\n\nThis commands\
    \ will add the necessary package (and dependency packages) to our Meteor application,\
    \ enabling us to administer accounts.\n\nMeteor also has a UI package that will\
    \ create the login logic for us automatically so that we don't have to write any\
    \ custom accounts' UI code. Let's add this package while we're at it:\n\n```\n\
    $ meteor add accounts-ui\n```\n\nNow that we've added the `accounts-ui` package,\
    \ we just need to quickly configure the fields to be displayed and update our\
    \ HTML template. To do so, perform the following steps:\n\n1. Open `LendLibClient.js`\
    \ and append the following code to the very bottom of the file:\n\n```\nAccounts.ui.config({\n\
    \    passwordSignupFields: 'USERNAME_AND_OPTIONAL_EMAIL'\n});\n```\n\nThis tells\
    \ the `accounts-ui` package that we want to display the `username` and `email`\
    \ fields in the sign-up form, with the `email` field being optional (as we would\
    \ only need it to recover a lost password).\n\n2. Now, open `LendLib.html` and\
    \ enter the following code directly below the `<body>` tag:\n\n```\n<body>\n \
    \ <div class=\"container\">\n    {{> loginButtons}}\n  </div>\n```\n\nThis HTML\
    \ code will add a login link and context menu box to the top left of our screen.\
    \ Let's see this in action. Save all your changes, start your Meteor app, and\
    \ navigate to `http://localhost:3000` in a browser. Notice the top left of the\
    \ following screenshot:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_109_0.png)\n\
    \n3. Click on **Sign in** and then click on **Create account** in the bottom right\
    \ of the pop up window:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_109_1.png)\n\
    \n4. Fill in the form, making sure to a username of admin and a valid email address\
    \ so that you can recover your password, if needed. Enter and confirm your new\
    \ password and then click on **Create account**:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_109_2.png)"
  mdcn: "\n让我们检查一下浏览器控制台：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_103_0.png)\n\
    \n是的！我们确实做了一些“不该做”的事情！这个错误（很遗憾地）没有干扰或影响应用程序的其余部分，原因有两点：\n\n- 是客户端（浏览器）抛出了这个错误，这不会影响服务器端应用。\n\
    - `LendLibServer.js` 中的代码只是服务器端代码；如果这段代码在客户端执行时出问题，也不会造成太大影响，因为它本来就不该在客户端运行。\n\
    \n最终用户永远不会知道这个错误的存在，但我们会知道；所以，让我们来修复它。将 `LendLibServer.js` 移动到 `~/Documents/Meteor/LendLib/server/`\
    \ 目录下。错误就会消失，我们小小的 Meteor 王国里一切又将恢复正常。\n\n## 应用程序结构——客户端、服务器和公共文件夹（天哪！）\n\n###\
    \ 公共文件夹\n\n`client` 文件夹只由客户端处理，而 `server` 文件夹只由服务器处理，这是很合乎逻辑的。然而，我们还需要考虑另一件事，那就是**静态资源**（图片、文本/内容文件等）。\n\
    \n这些资源只在运行时需要。我们不依赖它们进行任何逻辑或处理。因此，如果我们能把它们“挪开”，Meteor 编译器就可以忽略它们，这将加快我们应用程序的处理和交付速度。\n\
    \n这就是 `public` 文件夹发挥作用的地方。当 Meteor 为客户端和服务器编译 CSS 或 JavaScript 时，它会忽略 `public`\
    \ 文件夹内的任何内容。然后，在所有编译完成后，它会使用 `public` 文件夹来访问任何可能需要交付的资源。\n\n让我们在应用底部添加一个“使用 Meteor\
    \ 构建”的徽章。MDG 公司慷慨大方的伙伴们创建了一个很棒的新 logo，它恰好可以在 Wikimedia 上找到。你可以导航到 `http://upload.wikimedia.org/wikipedia/en/a/a4/Meteor-logo.png`\
    \ 并下载这张图片。\n\n在使用我们下载的图片之前，我们需要对 `LendLib.css` 做一个快速修改，并创建一个 `public` 文件夹：\n\n\
    1.  打开 `LendLib.css`（它应该在 `~/Documents/Meteor/LendLib/` 下，除非你已将其移到 `client` 文件夹，这也是完全可以的），并添加以下\
    \ CSS 声明：\n\n```\n.madewith img{\n  width:15rem;\n}\n```\n\n2.  现在，打开 `LendLib.html`\
    \ 并找到 `<body>` 元素。就在最后一个 `</div>` 标签之前，插入以下代码：\n\n```\n<body>\n  <div id=\"lendlib\"\
    \ class=\"container\">\n    ...\n    <div class=\"madewith pull-right\">\n   \
    \   Made with <img src=\"Meteor-logo.png\" alt=\"\">\n    </div>\n  </div>\n</body>\n\
    ```\n\n保存这些更改。目前应该还不会有太大变化，但我们马上就会处理。\n\n3.  在 `~/Documents/Meteor/LendLib/` 下创建一个名为\
    \ `public` 的文件夹。现在，将下载的 `Meteor-logo.png` 图片移动到新创建的 `public` 文件夹中：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_105_0.png)\n\
    \n现在你的应用右下角就有了一个漂亮的“使用 Meteor 构建”徽章。\n\n这个文件安全地存放在 `public` 文件夹中，因此 Meteor 编译器不必处理它。然而，当需要将其交付给客户端进行显示时，它仍然可用并随时待命。\n\
    \n> \U0001F4A1 还存在其他文件夹，它们有各自不同的效果和用途。完整说明请参阅 Meteor 文档：`http://docs.meteor.com/#/full/structuringyourapp`。\n\
    \n## 安全性和账户管理\n\n到目前为止，我们的借阅库应用完全按照我们的预期运行。它追踪我们所有的物品以及借给了谁。但是，如果我们打算将这个应用投入使用，应用内部本身还有一些安全问题需要首先处理。\n\
    \n首先，是什么阻止某人访问我们的应用并从借来的物品中抹去自己的名字？那个无赖 STEVE 可能会一直霸占着我们的线性压缩扳手，如果我们无法证明他是否仍然持有它的话。\n\
    \n我们不能让这种盗窃和不诚实的行为不受惩罚！必须追究 STEVE 的责任！所以，我们需要实施安全措施。具体来说，我们需要执行两项操作：\n\n- 仅允许物品所有者在用户界面中进行编辑\n\
    - 保护数据库，使得无法通过网络控制台进行更改\n\n### 移除不安全包\n\n实现这两个目标的第一步是从 Meteor 中移除 `insecure` 库。默认情况下，Meteor\
    \ 包含 `insecure` 库，以便我们可以在构建应用程序时无需担心安全性，直到我们制定好安全策略并编写了大部分代码。\n\n是时候了。我们已经知道安全方面的需求，所以让我们着手移除这个库。停止\
    \ Meteor 应用程序（在终端窗口中按 Ctrl + C），然后输入以下命令（你需要在 `LendLib/` 目录中）：\n\n```\n$ meteor\
    \ remove insecure\n```\n\n这将生成以下消息：\n\n```\nChanges to your project's package\
    \ version selections:\ninsecure removed from your project\ninsecure: removed dependency\n\
    ```\n\n我们的应用程序现在安全了。实际上，它可能过于安全了。重新启动 *Meteor*（在终端中输入 *meteor* 并按 *Enter*），然后在浏览器窗口中使用\
    \ `http://localhost:3000` 导航到我们的应用。到达后，尝试添加一个新物品、添加一个借阅者，甚至删除一个物品。我们将尝试把我们最喜欢的衬衫借给我们的重要另一半，但什么都不会发生——没有删除，没有添加，也没有更改。什么都不起作用！如果你打开浏览器控制台，你会看到每次尝试更新数据库都会遇到\
    \ **update failed: Access denied** 消息：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_107_0.png)\n\
    \n这些消息之所以显示，是因为我们移除了 *insecure* 包。换句话说，客户端发起的更改不再被允许。当更改请求从客户端发送到服务器时，没有 *allow*\
    \ 条件；因此，请求将被拒绝。\n\n### 添加管理员账户\n\n为了重新启用更新功能，我们需要能够创建一个管理员账户，赋予该管理员账户进行更改的权限，并为用户提供一种恢复丢失密码的方法。\n\
    \n我们首先需要添加三个内置的 Meteor 包。停止 Meteor 应用程序，然后在终端窗口中输入以下命令：\n\n```\n$ meteor add accounts-password\n\
    ```\n\n此命令将为我们的 Meteor 应用程序添加必要的包（及依赖包），使我们能够管理账户。\n\nMeteor 还有一个 UI 包，它将自动为我们创建登录逻辑，这样我们就不必编写任何自定义的账户\
    \ UI 代码。让我们趁机添加这个包：\n\n```\n$ meteor add accounts-ui\n```\n\n现在我们已经添加了 `accounts-ui`\
    \ 包，我们只需要快速配置要显示的字段并更新我们的 HTML 模板。为此，请执行以下步骤：\n\n1.  打开 `LendLibClient.js`，并在文件末尾追加以下代码：\n\
    \n```\nAccounts.ui.config({\n    passwordSignupFields: 'USERNAME_AND_OPTIONAL_EMAIL'\n\
    });\n```\n\n这告诉 `accounts-ui` 包我们想在注册表单中显示 `username` 和 `email` 字段，其中 `email`\
    \ 字段是可选的（因为我们只有在需要恢复丢失密码时才会用到它）。\n\n2.  现在，打开 `LendLib.html`，在 `<body>` 标签正下方输入以下代码：\n\
    \n```\n<body>\n  <div class=\"container\">\n    {{> loginButtons}}\n  </div>\n\
    ```\n\n这段 HTML 代码将在我们屏幕的左上角添加一个登录链接和上下文菜单框。让我们看看实际效果。保存所有更改，启动你的 Meteor 应用，并在浏览器中导航到\
    \ `http://localhost:3000`。注意以下截图的左上角：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_109_0.png)\n\
    \n3.  点击 **Sign in**，然后在弹出窗口的右下角点击 **Create account**：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_109_1.png)\n\
    \n4.  填写表单，确保使用 admin 作为用户名，并提供一个有效的电子邮件地址，以便在需要时恢复密码。输入并确认你的新密码，然后点击 **Create\
    \ account**：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_109_2.png)\n"
