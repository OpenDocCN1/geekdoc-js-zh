  md: '# About the Author


    **Isaac Strack** is a design technologist and STEM education advocate, currently
    working as a solutions consultant for Adobe Systems. With more than 15 years of
    experience in management information systems and web and creative technologies,
    Isaac has a strong background in modern web application development. He is the
    author of the Packt Publishing book *Meteor Cookbook* and the Packt Publishing
    video series *Learning Meteor Application Development*; he also assisted recently
    as a technical reviewer for another Packt Publishing book named *Building Single-page
    Web Apps with Meteor*. He holds a patent for online fraud detection and is a co-captain
    of the Salt Lake City Meteor Meetup group. He is an experienced lecturer/speaker.
    Isaac regularly mentors others at boot camps, training events, and conferences,
    such as UtahJS, DevMountain Meteor Day, NMC Summer Conference, Adobe workshops/events,
    and the Consumer Electronics Show (CES).


    > A huge thank you to my family, especially my mom, who have loved me despite
    instead of because. A shout out to my amazing daughters, without whom I wouldn''t
    be long for this world. Sunshine, Monkey, Boogers, Pig, this one is for you.'
