- md: " # Table of Contents\n\n## Chapter 3: Why Meteor Rocks!\n\n### Modern web applications\n\
    \n- The origin of the web app (client/server)\n- The rise of the machines (MVC)\n\
    - The browser grows up\n\n### A giant Meteor appears!\n\n- Data On The Wire\n\
    - Latency Compensation\n- Full Stack Reactivity\n\n### Let's create some templates\n\
    \n### Summary\n\n## Chapter 4: Templates\n\n### A new HTML template\n\n### Gluing\
    \ it all together\n\n- Displaying items\n- Additional view states\n- Adding events\n\
    - Model updates\n- Style updates\n\n### Summary\n\n## Chapter 5: Data – Meteor\
    \ Style!\n\n### Document-oriented storage\n\n- Why not use a relational database?\n\
    - MongoDB\n- Using direct commands\n\n### Broadcasting changes\n\n### Configuring\
    \ publishers\n\n- Turning off autopublish\n- Listing Categories\n- Listing items\n\
    - Checking your streamlined data\n\n### Summary\n\n## Chapter 6: Application Structure\
    \ – Client, Server, and Public (oh my!)\n\n- The client and server folders\n-\
    \ The public folder\n- The security and accounts\n  - Removing insecure\n  - Adding\
    \ an admin account\n  - Granting admin permissions\n- Customizing results\n  -\
    \ Modifying Meteor.publish()\n  - Adding owner privileges\n  - Enabling multiple\
    \ users\n\n### Summary\n\n## Chapter 7: Packaging and Deploying\n\n- Third-party\
    \ packages\n  - Finding the available packages\n- Bundling your application\n\
    - Deploying your application to Meteor's servers\n  - Updating Meteor's servers\n\
    \  - Using your own hostname\n- Deploying your application to a custom server\n\
    \  - The server setup\n  - Installing and configuring MUP\n  - Deploying your\
    \ app using MUP\n\n### Summary\n\n## Index\n\n---\n\n## Preface\n\nWe live in\
    \ amazing times. Advances in medicine, communication, physics, and all other scientific\
    \ fields provide us with opportunities to create things that were literally impossible\
    \ to create only a short while ago.\n\nYet, we aren't easily amazed. Moore's law\
    \ has not only affected how fast our computers are, it has significantly increased\
    \ our expectations as well. We've come to expect wondrous advances, and therefore,\
    \ what was once amazing has become...well...expected. It's a rare thing, indeed,\
    \ to find something that takes us by surprise—something that renews that childhood\
    \ sense of wonder we all secretly want back because it was stolen from us.\n\n\
    Well, get ready to regain some of that wonder. A dedicated group of computer scientists,\
    \ who were determined to make something wondrous, have created a new JavaScript\
    \ framework called Meteor. You may be thinking, \"A new JavaScript framework?\
    \ That's nothing special.\" And, if that's all Meteor is, you'd be correct. However,\
    \ fortunately for you, that's not the end of the story.\n\nMeteor is a reactive,\
    \ simple, and powerful application platform, capable of producing sophisticated,\
    \ robust web and mobile applications with just a few lines of code.\n\nIn the\
    \ context of modern web applications, it is state-of-the-art. Using established,\
    \ proven development design patterns, Meteor takes all the mundane parts of building\
    \ an app and does them all for you. Therefore, you get to focus on building a\
    \ solid application without getting bogged down with the usual time-wasting activities,\
    \ such as writing yet another database interface or learning a new templating\
    \ engine.\n\nAnd the best part is, it's simple to learn, amazingly simple! You\
    \ will see an application come to life right before your eyes, and when you look\
    \ back at the number of lines of code it took to create and compare it to the\
    \ traditional methods of development, you may actually find yourself saying \"\
    wow\" or \"how did they do that?\"\n\nThis book will walk you through the major\
    \ features of Meteor and show you how to create an application from scratch. By\
    \ the end of the book, you will have created a working, useful application, and\
    \ you will have a solid understanding of what makes Meteor different. This may\
