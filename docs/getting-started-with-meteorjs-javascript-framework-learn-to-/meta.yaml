    \ console and press `Enter`:\n\n> `lists.findOne({Category:\"Clothes\"})`\n\n\
    Expand `Object`, and you'll see your three items in an array:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_97_0.png)\n\
    \nClick around in the app, add items to categories, add new categories, and check\
    \ the underlying data model that's visible on the client. You'll see that your\
    \ `lists` are now much less visible; therefore, they are more secure and discreet.\
    \ This probably won't be a problem for your own personal Lending Library application;\
    \ however, as we expand this in the next chapter so that multiple people can use\
    \ the app, the streamlined and discreet data will improve performance.\n\n## Summary\n\
    \nIn this chapter, you learned what MongoDB is, how a document-oriented database\
    \ works, and you performed direct queries in the command line. This enabled you\
    \ to become familiar with Meteor's default data repository system. You also streamlined\
    \ your application by removing `autopublish` and gained a firm understanding of\
    \ the publish/subscribe design pattern built into Meteor.\n\nIn the next chapter,\
    \ we'll really tighten up security on your app, allowing multiple users to keep\
    \ track of and control their own `lists` of items. You'll also see how to further\
    \ streamline your client and server code through the use of folders.\n\n## Application\
    \ Structure – Client, Server, and Public (oh my!)\n\nTo allow you to jump right\
    \ in, Meteor creates a default set of libraries, a default folder structure, and\
    \ default permissions. This default configuration works great for quick development,\
    \ testing, and learning as you go. It does not, however, make for a great production\
    \ environment.\n\nIn this chapter, we'll go over the changes that you'll want\
    \ to make to the default configuration so that your app will be performant, secure,\
    \ and easier to manage. Specifically, you will learn about the following topics:\n\
    \n- Separating the client, server, and public files of your application\n- Enabling\
    \ database security and user login\n- Tailoring display results to protect privacy\n\
    \n### The client and server folders\n\nUp to this point, we've put all of our\
    \ JavaScript code in one file: `LendLib.js`.\n\nInside `LendLib.js`, we have two\
    \ sections that are separated by `if` statements. The client-facing code is found\
    \ inside the `if (Meteor.isClient) {...}` block, and the server-side code is found\
    \ inside the `if (Meteor.isServer) {...}` block.\n\nThis structure works fine\
    \ for a very simple application, but when we are writing a more complex application,\
    \ or we have multiple people working on the same app, trying to share one file\
    \ with conditional statements will quickly turn into a nightmare situation.\n\n\
    Additionally, Meteor will read any and all files in our application folders and\
    \ try to apply JavaScript to both the client and the server. This makes for a\
    \ sort of strange situation if we want to use a client-facing JavaScript library\
    \ (for example, Twitter Bootstrap or jQuery). If we add the library to the root\
    \ folder, Meteor will try to implement that file on both the client and the server.\
    \ This either creates performance issues because we're loading files to the server\
    \ that it doesn't need, or it produces errors because the server doesn't know\
    \ what to do with display objects (the server doesn't display anything.)\n\nConversely,\
    \ if there is server-side code in files that are accessible by both the client\
    \ and the server, the client may try to implement that code, which can cause all\
    \ kinds of problems, or it will at the very least make the code available to the\
    \ client, which could quickly become a security issue. There are some files and\
    \ code that we don't want the client to see or have access to.\n\nLet's see an\
    \ example of the client code being processed by the server, and then let's move\
    \ that code to a place where only the client will try to execute it. To do this,\
    \ create a new file in `~/Documents/Meteor/` called `LendLibClient.js`. Then,\
    \ open `LendLib.js` and cut the entire client code block from it, which is highlighted\
    \ here:\n\n```\nlists = new Mongo.Collection('lists');\n\n[CUT ALL THIS CODE]\n\
    \nif (Meteor.isServer){...\n```\n\n> You should have to cut well over 175 lines\
    \ of code. Make sure that you get the ending } bracket!\n\nNow, paste the code\
    \ that you just cut into `LendLibClient.js` and save the changes to both files.\
    \ You'll notice that this makes no visual changes to your running application.\
    \ This is because Meteor is processing both files, and the `if (Meteor.isClient)`\
    \ condition stops the server from executing the code.\n\nBut let's see what happens\
    \ when we remove the `if` condition. In `LendLibClient.js`, remove the first line\
    \ containing the `if (Meteor.isClient) {` condition. Additionally, make sure that\
    \ you remove the last line, containing the ending bracket (`}`), all the way at\
    \ the bottom. Save `LendLibClient.js` and then take a look at your console where\
    \ Meteor is running.\n\nYou will see the following error message, or something\
    \ similar to it:\n\n```\napp/LendLibClient.js:21\n  Meteor.subscribe(\"Categories\"\
    );\n         ^\nTypeError: Object #<Object> has no method 'subscribe'\n    at\
    \ app/LendLibClient.js:21:11\n...\nExited with code: 8\nYour application is crashing.\
    \ Waiting for file change.\n```\n\nRemoving the `if` condition has created a situation\
    \ where the server part of Meteor is trying to run the client-facing code. It\
    \ doesn't know what to do with it, so the app is crashing. We're going to fix\
    \ the situation by using a folder structure.\n\nIf you recall, when we implemented\
    \ Twitter Bootstrap, we created the `client` folder. Meteor identifies the `client`\
    \ folder, and it will run any JavaScript files it finds there exclusively as client-facing\
    \ code and not on the server side.\n\nMove (cut-paste, click-drag, or using mv)\
    \ the `LendLibClient.js` file from `~/Documents/Meteor/LendLib/` to `~/Documents/Meteor/LendLib/client/`.\
    \ This will instantly fix our crashing app, and Meteor will be happy again! You'll\
    \ see the following message in the console:\n\n```\n=> Modified -- restarting.\n\
    ```\n\nSince we moved `LendLibClient.js` to the `client` folder, the `if` condition\
    \ is no longer needed. Due to the file location, Meteor knows that the code is\
    \ only intended to be run on the client, so it doesn't try to run it on the server.\n\
    \n> You may want to refresh your browser that is pointing to `http://localhost:3000`.\n\
    > This is because you crashed the application. Repent of your evil ways and refresh\
    \ your page to ensure that everything runs as it should.\n\nLet's now do the same\
    \ thing with the server code. Create a new folder named `server`. You can do this\
    \ through a Finder window or directly in the command line as follows:\n\n```\n\
    $ mkdir ~/Documents/Meteor/LendLib/server\n```\n\nWe know that we should create\
    \ our JavaScript file directly in the new `server` folder. However, we are also\
    \ pathologically curious, and we enjoy breaking things, so we're going to create\
    \ it where it can cause problems.\n\nCreate a new file named `LendLibServer.js`\
    \ in the `LendLib` folder under `~/Documents/Meteor/`. Cut the `if (Meteor.isServer)\
    \ { … }` block from `LendLib.js`, paste it into `LendLibServer.js`, and save both\
    \ files.\n\n> At this point, there should be only one line of code left in LendLib.js:\n\
    >\n> `Lists = new Meteor.Collection('lists');`\n\nJust like when we moved the\
    \ client code, nothing adverse will happen here at this point, because we still\
    \ have the `if` condition. Let's remove this and let the app crashing continue!\n\
    \nIn `LendLibServer.js`, remove the first line containing `if (Meteor.isServer)\
    \ {` and the last line containing the end bracket (`}`).\n\nThen, save your changes\
    \ and let's see the carnage!\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_102_0.png)\n\
    \nHuh. No crashes. The app still works fine. What a letdown..."
  mdcn: "\n没有显示条目的原因是因为我们的`Session`变量`current_list`被设置为`Clothes`而不是`DVDs`。`find()`函数只会获取`current_list`的完整记录。\n\
    \n现在，在浏览器控制台中输入以下命令并按`Enter`：\n\n> `lists.findOne({Category:\"Clothes\"})`\n\n\
    展开`Object`，你会看到你的三个条目在一个数组中：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_97_0.png)\n\
    \n在应用中四处点击，向分类中添加条目，添加新分类，并检查客户端可见的底层数据模型。你会看到你的`lists`现在不再那么显眼了；因此，它们更加安全和隐蔽。对于你自己的个人借阅库应用来说，这可能不会成为问题；然而，当我们在下一章中扩展应用以允许多人使用时，精简且隐蔽的数据将提升性能。\n\
    \n## 总结\n\n在本章中，你了解了什么是MongoDB，面向文档的数据库如何工作，并在命令行中执行了直接查询。这使你熟悉了Meteor的默认数据存储系统。你还通过移除`autopublish`精简了应用程序，并深入理解了Meteor内置的发布/订阅设计模式。\n\
    \n在下一章中，我们将真正加强应用的安全性，允许多个用户各自管理和控制自己的条目`lists`。你还将了解如何通过使用文件夹进一步精简客户端和服务器代码。\n\
    \n## 应用结构——客户端、服务器和公共文件（哦，天哪！）\n\n为了让你能够快速上手，Meteor创建了一组默认库、默认文件夹结构和默认权限。这种默认配置非常适合快速开发、测试和边学边用。然而，它并不适合作为正式的生产环境。\n\
    \n在本章中，我们将介绍你想要对默认配置进行的更改，使你的应用性能更好、更安全且更易于管理。具体来说，你将学习以下主题：\n\n- 将应用程序的客户端、服务器和公共文件分离\n\
    - 启用数据库安全性和用户登录\n- 定制显示结果以保护隐私\n\n### 客户端和服务器文件夹\n\n到目前为止，我们已经将所有JavaScript代码放在一个文件中：`LendLib.js`。\n\
    \n在`LendLib.js`中，我们有两个由`if`语句分隔的部分。面向客户端的代码位于`if (Meteor.isClient) {...}`块中，服务器端代码位于`if\
    \ (Meteor.isServer) {...}`块中。\n\n这种结构对于非常简单的应用来说没有问题，但当我们编写更复杂的应用，或者有多个人在同一个应用上协作时，试图在一个文件中共享带有条件语句的代码很快就会变成一场噩梦。\n\
    \n此外，Meteor会读取应用文件夹中的所有文件，并尝试将JavaScript同时应用到客户端和服务器。如果我们想要使用面向客户端的JavaScript库（例如Twitter\
    \ Bootstrap或jQuery），这会造成一种奇怪的情况。如果我们把库添加到根文件夹中，Meteor会尝试在客户端和服务器上都应用该文件。这要么会产生性能问题（因为我们将服务器不需要的文件加载到了服务器上），要么会产生错误（因为服务器不知道如何处理显示对象——服务器不显示任何内容）。\n\
    \n相反，如果在客户端和服务器都可以访问的文件中存在服务器端代码，客户端可能会尝试执行该代码，这会导致各种各样的问题，或者至少会使代码对客户端可见，这可能会迅速成为安全问题。有一些文件和代码我们不希望客户端看到或访问。\n\
    \n让我们看看客户端代码被服务器处理的示例，然后将该代码移到只有客户端才会尝试执行它的地方。为此，请在`~/Documents/Meteor/`中创建一个名为`LendLibClient.js`的新文件。然后，打开`LendLib.js`，从其中剪切整个客户端代码块，即此处高亮显示的部分：\n\
    \n```\nlists = new Mongo.Collection('lists');\n\n[CUT ALL THIS CODE]\n\nif (Meteor.isServer){...\n\
    ```\n\n> 你需要剪切远超过175行的代码。确保剪切到最后的`}`括号！\n\n现在，将你刚刚剪切的代码粘贴到`LendLibClient.js`中，并保存两个文件的更改。你会注意到这不会对正在运行的应用产生任何视觉上的变化。这是因为Meteor正在处理两个文件，而`if\
    \ (Meteor.isClient)`条件阻止了服务器执行该代码。\n\n但让我们看看当我们移除`if`条件时会发生什么。在`LendLibClient.js`中，移除包含`if\
    \ (Meteor.isClient) {`条件的第一行。此外，确保移除包含结束括号（`}`）的最后一行，也就是最底部的那一行。保存`LendLibClient.js`，然后查看Meteor运行的控制台。\n\
    \n你将看到以下错误信息，或类似的信息：\n\n```\napp/LendLibClient.js:21\n  Meteor.subscribe(\"Categories\"\
    );\n         ^\nTypeError: Object #<Object> has no method 'subscribe'\n    at\
    \ app/LendLibClient.js:21:11\n...\nExited with code: 8\nYour application is crashing.\
    \ Waiting for file change.\n```\n\n移除`if`条件导致Meteor的服务器部分试图运行面向客户端的代码。它不知道如何处理这些代码，所以应用崩溃了。我们将通过使用文件夹结构来解决这个问题。\n\
    \n如果你还记得，当我们实现Twitter Bootstrap时，我们创建了`client`文件夹。Meteor会识别`client`文件夹，并将其中找到的所有JavaScript文件仅作为面向客户端的代码运行，而不会在服务器端运行。\n\
    \n将`LendLibClient.js`文件从`~/Documents/Meteor/LendLib/`移动（剪切-粘贴、点击拖拽或使用mv）到`~/Documents/Meteor/LendLib/client/`。这将立即修复我们崩溃的应用，Meteor又会正常运行了！你会在控制台中看到以下消息：\n\
    \n```\n=> Modified -- restarting.\n```\n\n由于我们将`LendLibClient.js`移到了`client`文件夹，`if`条件不再需要了。根据文件位置，Meteor知道该代码仅打算在客户端运行，因此它不会尝试在服务器上运行它。\n\
    \n> 你可能需要刷新指向`http://localhost:3000`的浏览器。\n> 这是因为你使应用崩溃了。放下屠刀，立地成佛，刷新你的页面以确保一切正常运行。\n\
    \n现在让我们对服务器代码做同样的事情。创建一个名为`server`的新文件夹。你可以通过Finder窗口或直接在命令行中执行以下操作：\n\n```\n\
    $ mkdir ~/Documents/Meteor/LendLib/server\n```\n\n我们知道应该直接在新的`server`文件夹中创建JavaScript文件。然而，我们天生好奇心强，喜欢搞破坏，所以我们要把它创建在可能引发问题的位置。\n\
    \n在`~/Documents/Meteor/`下的`LendLib`文件夹中创建一个名为`LendLibServer.js`的新文件。从`LendLib.js`中剪切`if\
    \ (Meteor.isServer) { … }`块，粘贴到`LendLibServer.js`中，并保存两个文件。\n\n> 此时，`LendLib.js`中应该只剩一行代码：\n\
    >\n> `Lists = new Meteor.Collection('lists');`\n\n就像我们移动客户端代码时一样，此时不会发生任何不良情况，因为我们仍然有`if`条件。让我们移除它，让崩溃继续！\n\
    \n在`LendLibServer.js`中，移除包含`if (Meteor.isServer) {`的第一行和包含结束括号（`}`）的最后一行。\n\n\
    然后，保存你的更改，让我们看看后果！\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_102_0.png)\n\n\
    嗯。没有崩溃。应用仍然正常工作。真是令人失望……\n"
