    \       ...\n     });\n     Template.categories.helpers({\n       lists : function(){\n\
    \       }\n     });\n   }\n   ```\n\n> The `Template` declaration *must* be inside\
    \ of the `if (Meteor.isClient){...}` code block so that the client will pick up\
