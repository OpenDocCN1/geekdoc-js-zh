    \ 键（`e.which === 13`），就会使用 `updateLendee()` 更新数据模型中的 `LentTo` 属性。然后我们通过将 `lendee_input`\
    \ 设为 `null` 来隐藏文本框。将 `lendee_input` 设为 `null` 是对响应式变量的更改，这会触发响应式计算并更新 UI。\n\n\
    如果我们决定不喜欢这些更改，可以按 *Esc* 键（`e.which === 27`）；在这种情况下，我们将 `lendee_input` 设为 `null`，让响应式编程来隐藏文本框。\n\
    \n## 更新模型\n\n我们还剩两件事要做。我们需要用一点 CSS 来美化我们的应用（不过还不是时候），还需要创建 `addItem()`、`removeItem()`\
    \ 和 `updateLendee()` 函数，我们刚才在 `events` 部分已经引用了它们。\n\n## 模板\n\n那么，开始工作吧！在 `LendingLib.js`\
    \ 中，就在 `selectCategory()` 函数下方，创建 `addItem()` 函数：\n\n```\nfunction selectCategory(e,t){\n\
    \ ...\n};\nfunction addItem(list_id,item_name){\n if (!item_name&&!list_id) return;\n\
    \ lists.update({_id:list_id},\n               {$addToSet:{items:{Name:item_name}}});\n\
    };\n```\n\n首先我们检查确保 `item_name` 和 `list_id` 都有值。如果没有，就直接返回。\n\n现在，我们对 `lists`\
    \ 集合调用 MongoDB 的 `update()` 函数。`{_id:list_id}` 是选择器。我们告诉 MongoDB 找到 `_id = list_id`\
    \ 的记录。然后我们告诉 MongoDB 我们要执行什么类型的更新。这里我们使用 `$addToSet`，它会追加到数组中。那么，我们要追加什么呢？\n\n\
    {`items`:...} 表示我们正在更新 `items[]` 数组。`{Name:item_name}` 就是我们要添加的内容，也就是 `Name` 属性。这相当于说\
    \ `item.Name = item_name`。\n\n一旦我们添加了这个，正如你现在可能已经猜到的，模板会自动更新，因为 `lists` 是一个响应式变量。停一秒钟，想想这一点。用六行代码，我们执行了一个更新查询\
    \ *并且* 将变化传播到了 UI。六行！很神奇，不是吗？\n\n接下来处理 `removeItem()`：\n\n```\nfunction addItem(list_id,item_name){\n\
    \ ...};\nfunction removeItem(list_id,item_name){\n if (!item_name&&!list_id)\n\
    \   return;\n lists.update({_id:list_id},\n               {$pull:{items:{Name:item_name}}});\n\
    };\n```\n\n哇，这和 `addItem()` 函数看起来非常相似。事实上，我们使用的是同一个 `update()` 函数，只是这次使用了不同的操作。这次我们使用\
    \ `$pull`，它会从 `items[]` 数组中拉出 `Name == item_name` 的元素。再一次，六行代码就足够了。一旦我们更新了 `lists`\
    \ 集合，UI 就会响应式地更新。\n"
