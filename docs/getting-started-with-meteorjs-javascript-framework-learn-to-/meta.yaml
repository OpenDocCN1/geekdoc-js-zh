    \ **Tools** Category, enter the item **Linear Compression Wrench** and assign\
    \ the Lendee as **STEVE**:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_115_0.png)"
- md: " ## Application Structure – Client, Server, and Public (oh my!)\n\nThere, we're\
    \ up and running! Inside each item, we now have an `owner` property. This becomes\
    \ important when we enable others to create and maintain their own `lists` of\
    \ `items`.\n\n## Enabling multiple users\n\nOkay, everything is in place now for\
    \ us to have a customized, private view of our own stuff, but currently, only\
    \ the admin account can add `lists` or `items` and assign a Lendee to an item.\n\
    \nWe'll fix this by going back to `LendLibServer.js` and adding some logic to\
    \ check whether the currently logged-in user owns the list or is an admin. Inside\
    \ `LendLib.js`, in the `lists.allow()` code block, make the following additions:\n\
    \n```\nlists.allow({\n  insert: function(userId, doc){\n    return (adminUser(userId)\
    \ || (userId && doc.owner === userId));\n  },\n  update: function(userId, docs,\
    \ fields, modifier){\n    return (adminUser(userId) || (userId && docs.owner ===\n\
    \    userId));\n  },\n  remove: function (userId, docs){\n    return (adminUser(userId)\
    \ || (userId && docs.owner ===\n    userId));\n  }\n});\n```\n\nInside `insert`,\
    \ we check to see whether the current `doc.owner` user is the logged-in user.\
    \ In `update` and `remove`, the name of the parameter changes to `docs`, but the\
    \ check is the same since we are only updating one record at a time. We, therefore,\
    \ check the `docs.owner` property.\n\nYou will now want to save your changes and\
    \ create a new account on `http://localhost:3000`. You can add categories and\
    \ items to your heart's content. You can switch between users and add as many\
    \ users and categories as you like.\n\nYou'll notice that there's no visibility\
    \ from one person's lists to another, and consequently, there is no way for someone\
    \ to manipulate or delete another person's lists and records. Now, when STEVE\
    \ finally gets his grubby little hands on your application, he can only see his\
    \ stuff (none of which is worth borrowing by the way!):\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_117_0.png)\n\
    \n## Summary\n\nIn this chapter, you learned how Meteor compiles and searches\
    \ for JavaScript and CSS code, and how you can optimize that search. You also\
    \ learned how to protect your server code and keep things running smoothly and\
    \ efficiently. In addition, you learned how to secure your database through the\
    \ use of Meteor's built-in `accounts` packages, and you closed some of the security\
    \ loopholes in your application. Finally, you enabled multiple accounts, so anybody\
    \ can use your Lending Library to keep track of their items, and you did this\
    \ without compromising on the privacy of the end user.\n\nIn the next chapter,\
    \ you will learn how to deploy a Meteor application to a production environment\
    \ and learn techniques on how to start coding fast, robust, production-ready Meteor\
    \ applications.\n\n# 7\n\n# Packaging and Deploying\n\nOur application is looking\
    \ great. We've made it secure, easy to use, and with the addition of multiple\
    \ logins, anybody can now use the Lending Library to keep track of their stuff.\n\
    \nIn this final chapter, we'll go over Meteor's amazing package system, which\
    \ will speed up future code projects, and we'll talk about the options for deploying\
    \ your applications. You will learn how to:\n\n- Add and configure third-party\
    \ packages such as JQueryUI, Backbone, and Bootstrap\n- Bundle your entire application\
    \ so that it can be deployed\n- Deploy your app using Meteor's public servers\n\
    - Deploy your app to a custom server\n\n## Third-party packages\n\nThrough a thriving,\
    \ growing community, Meteor is rapidly gaining packages for all major JavaScript\
    \ and Preprocessing libraries. These packages are intelligent in that they contain\
    \ the base JavaScript or Preprocessing libraries, but they are also configured\
    \ to interact directly with the Meteor code base.\n\nWhat this means for you is\
    \ that adding your favorite library involves almost no effort, and you can be\
    \ confident that it will work with your Meteor application.\n\n# Packaging and\
    \ Deploying\n\n## Finding the available packages\n\nThe best way to find new packages\
    \ is through a web interface called Atmosphere. If you navigate to `https://atmospherejs.com`,\
    \ you will be prompted with a search box:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_120_0.png)\n\
    \nType in the names of some popular frameworks (such as `bootstrap`, `iron router`,\
    \ `react`, and so on) and the chances are that you will be able to see multiple\
    \ libraries to choose from. You can explore the most popular or most used packages\
    \ as well by scrolling down on the home page:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_120_1.png)\n\
    \nThe **Trending**, **Recent**, **Most Used**, and **Top Searches** divisions\
    \ as seen on the home page\n\nAs you can see, quite a few of the most popular\
    \ frameworks are available, including Polymer, Angular, underscore, and... Twitter's\
    \ Bootstrap! We spent a good amount of time manually downloading Bootstrap, creating\
    \ the `client` folder, and extracting the Bootstrap files. That was a good exercise\
    \ in how to manually install a framework, but now, we're going to learn how to\
    \ install it as a package.\n\nFirst, let's remove the existing Bootstrap installation.\
    \ To do this, navigate to `~/Documents/Meteor/LendLib/client/` and delete the\
    \ `bootstrap` directory. It doesn't matter whether or not your Meteor app is running\
    \ (remember, Meteor updates dynamically!). After removing the `bootstrap` directory,\
    \ either start your app and then navigate to `http://localhost:3000`, or just\
    \ navigate there if your app is already running. You will see that all of our\
    \ pretty formatting is gone!\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_121_0.png)\n\
    \nWe'll now add the official Meteor bootstrap package. Again, because Meteor updates\
    \ dynamically, so we don't have to stop the Meteor app unless we want to. Either\
    \ open a new terminal window or temporarily stop your Meteor application, and\
    \ make sure that you are in the `LendLib` folder under `~/Documents/Meteor/`.\
    \ Once there, enter the following command:\n\n```\n$ meteor add twbs:bootstrap\n\
    ```\n\n# Packaging and Deploying\n\nYou will receive a very short message, as\
    \ follows:\n\n```\nChanges to your project's package version selections:\n\ntwbs:bootstrap\
    \  added, version 3.3.2\n\ntwbs:bootstrap: Bootstrap (official): the most popular\
    \ HTML/CSS/JS framework for responsive, mobile first projects\n```\n\nIf you used\
    \ a second terminal window, just head to your browser (you don't even have to\
    \ refresh the page). If you stopped your Meteor application, start it up again\
    \ and navigate to `http://localhost:3000`. You will be able to see that the Bootstrap\
    \ formatting is now back, and everything is back to normal:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_122_0.png)\n\
    \nThis is literally all there is to it. By using a single command in your terminal,\
    \ you can add a library or framework to your project without having to worry about\
    \ linking, downloading, making sure that the files are in the right location,\
    \ and so on. Just run `meteor add` and off you go!\n\n> You can get a list of\
    \ the packages that you're already using by entering the following command in\
    \ the terminal:\n> `meteor list`\n\nSince the Meteor community is adding packages\
    \ so rapidly, it's a good idea to stay current with your Meteor installation.\
    \ From time to time, run the following command in the terminal:\n\n```\n$ meteor\
    \ update\n```\n\nIf you're on the latest version, it will tell you so, and what\
    \ version you're running. If there's a new version, it will download and install\
    \ it for you and update any packages as well.\n\n## Bundling your application\n\
    \nIn usual Meteor fashion, bundling your application so that it can be deployed\
    \ is incredibly simple. Stop your Meteor application if it's running, make sure\
    \ you are in your application folder (for the Lending Library, this is `LendLib`\
    \ folder under `~/Documents/Meteor/`), and enter the following command in the\
    \ terminal:\n\n```\n$ meteor bundle ~/Documents/Meteor/builds/\n```\n\nThis will\
    \ take a little bit to run, but when it's finished, you'll have a `LendLib.tar.gz`\
    \ tarball in the `builds/` folder, and you'll be ready to deploy it wherever you\
    \ like. This is a complete Node package/bundle. The machine to which you deploy\
    \ this bundle only needs to have **Node.js** and **MongoDB** installed on it.\
    \ Everything else that you need is included in the bundle.\n\n## Deploying your\
    \ application to Meteor's servers\n\nThe folks at Meteor have taken deployment\
    \ one step further - above and beyond what you'd expect from even a paid product,\
    \ much less a free one. Meteor allows you to deploy your application directly\
    \ on their deployment servers. Pick a name for your app (we'll use `packt.lendlib`,\
    \ but you'll need to come up with your own) and enter the following command in\
    \ the terminal:\n\n```\n$ meteor deploy [your app name].meteor.com\n```\n\nSo,\
    \ in our case, we entered `meteor deploy packt.lendlib.meteor.com`. The console\
    \ will give you status updates as it bundles, uploads, and deploys your application.\
    \ Once it's finished, it will give you a message similar to this:\n\n```\nNow\
    \ serving at [your app name].meteor.com\n```"
  mdcn: "\n ## 应用程序结构——客户端、服务器和公开（天哪！）\n\n好了，我们已经启动并运行了！在每个条目中，我们现在都有一个 `owner` 属性。当我们允许其他人创建和维护他们自己的\
    \ `items` 列表时，这一点变得非常重要。\n\n## 支持多用户\n\n好的，现在一切都已就位，我们可以拥有自己物品的定制化、私密视图，但目前，只有管理员账户才能添加\
    \ `lists` 或 `items`，并为物品指定借出对象（Lendee）。\n\n我们将通过回到 `LendLibServer.js` 并添加一些逻辑来解决这个问题，用于检查当前登录的用户是否是列表的所有者或是管理员。在\
    \ `LendLib.js` 中，找到 `lists.allow()` 代码块，进行如下添加：\n\n```\nlists.allow({\n  insert:\
    \ function(userId, doc){\n    return (adminUser(userId) || (userId && doc.owner\
    \ === userId));\n  },\n  update: function(userId, docs, fields, modifier){\n \
    \   return (adminUser(userId) || (userId && docs.owner ===\n    userId));\n  },\n\
    \  remove: function (userId, docs){\n    return (adminUser(userId) || (userId\
    \ && docs.owner ===\n    userId));\n  }\n});\n```\n\n在 `insert` 中，我们检查当前 `doc.owner`\
    \ 是否是已登录用户。在 `update` 和 `remove` 中，参数名称变为 `docs`，但检查逻辑相同，因为我们一次只更新一条记录。因此，我们检查\
    \ `docs.owner` 属性。\n\n现在你需要保存更改，并在 `http://localhost:3000` 上创建一个新账户。你可以尽情添加类别和物品。你可以在用户之间切换，添加任意数量的用户和类别。\n\
    \n你会注意到，一个人的列表对另一个人是不可见的，因此，没有人能够操纵或删除另一个人的列表和记录。现在，当 **STEVE** 终于用他肮脏的小手伸向你的应用程序时，他只能看到自己的东西（顺便说一句，没有一样值得借！）：\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_117_0.png)\n\n## 小结\n\n在本章中，你学习了 Meteor\
    \ 如何编译和搜索 JavaScript 和 CSS 代码，以及如何优化该搜索。你还学习了如何保护服务器代码，使一切顺畅高效地运行。此外，你学习了如何通过使用\
    \ Meteor 内置的 `accounts` 包来保护数据库，并堵住了应用程序中的一些安全漏洞。最后，你启用了多账户功能，这样任何人都可以使用你的借阅图书馆来跟踪他们的物品，而且这样做并没有牺牲最终用户的隐私。\n\
    \n在下一章中，你将学习如何将 Meteor 应用程序部署到生产环境，并学习如何开始编写快速、健壮、可用于生产的 Meteor 应用程序的技巧。\n\n#\
    \ 7\n\n# 打包与部署\n\n我们的应用程序看起来很棒。我们已经让它变得安全、易用，并且随着多登录功能的加入，任何人现在都可以使用借阅图书馆来跟踪他们的物品。\n\
    \n在这最后一章中，我们将介绍 Meteor 出色的包系统，它将加速未来的代码项目，我们还将讨论部署应用程序的选项。你将学习如何：\n\n- 添加和配置第三方包，如\
    \ JQueryUI、Backbone 和 Bootstrap\n- 打包你的整个应用程序，以便进行部署\n- 使用 Meteor 的公共服务器部署你的应用程序\n\
    - 将应用程序部署到自定义服务器\n\n## 第三方包\n\n通过一个蓬勃发展、不断壮大的社区，Meteor 正在为所有主要的 JavaScript 和预处理库快速吸纳包。这些包非常智能，它们包含基础的\
    \ JavaScript 或预处理库，而且还被配置为直接与 Meteor 代码库交互。\n\n这对你来说意味着，添加你喜欢的库几乎不需要任何功夫，田径场，你可以确信它将与你的\
    \ Meteor 应用程序协同工作。\n\n# 打包与部署\n\n## 查找可用包\n\n寻找新包的最佳方式是通过一个名为 Atmosphere 的 Web\
    \ 界面。如果你访问 `https://atmospherejs.com`，会看到一个搜索框：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_120_0.png)\n\
    \n输入一些流行框架的名称（例如 `bootstrap`、`iron router`、`react` 等），你很可能就能看到多个可供选择的库。你也可以通过向下滚动主页来探索最受欢迎或最常用的包：\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_120_1.png)\n\n主页上的 **Trending**（热门趋势）、**Recent**（最新）、**Most\
    \ Used**（最常用）和 **Top Searches**（热搜）分类\n\n如你所见，相当多的流行框架都已可用，包括 Polymer、Angular、underscore\
    \ 以及…… Twitter 的 Bootstrap！我们之前花了不少时间手动下载 Bootstrap、创建 `client` 文件夹并解压 Bootstrap\
    \ 文件。那是手动安装框架的好练习，但现在，我们要学习如何将其作为包来安装。\n\n首先，让我们移除现有的 Bootstrap 安装。为此，导航到 `~/Documents/Meteor/LendLib/client/`\
    \ 并删除 `bootstrap` 目录。你的 Meteor 应用是否在运行并不重要（记住，Meteor 是动态更新的！）。删除 `bootstrap` 目录后，启动你的应用然后访问\
    \ `http://localhost:3000`，或者如果你的应用已经在运行，直接访问即可。你会发现我们漂亮的格式化样式全部消失了！\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_121_0.png)\n\
    \n我们现在要添加官方的 Meteor bootstrap 包。同样，由于 Meteor 是动态更新的，所以我们不必停止 Meteor 应用，除非你想这样做。要么打开一个新的终端窗口，要么暂时停止你的\
    \ Meteor 应用，并确保你在 `~/Documents/Meteor/` 下的 `LendLib` 文件夹中。到达那里后，输入以下命令：\n\n```\n\
    $ meteor add twbs:bootstrap\n```\n\n# 打包与部署\n\n你会收到一条非常简短的消息，如下所示：\n\n```\nChanges\
    \ to your project's package version selections:\n\ntwbs:bootstrap  added, version\
    \ 3.3.2\n\ntwbs:bootstrap: Bootstrap (official): the most popular HTML/CSS/JS\
    \ framework for responsive, mobile first projects\n```\n\n如果你使用了第二个终端窗口，只需前往浏览器（你甚至不必刷新页面）。如果你停止了\
    \ Meteor 应用，重新启动它并导航到 `http://localhost:3000`。你会看到 Bootstrap 格式化样式现在又回来了，一切都恢复正常：\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_122_0.png)\n\n从字面上讲，就是这么简单。只需在终端中使用一条命令，你就可以将一个库或框架添加到你的项目中，而无需担心链接、下载、确保文件在正确的位置等等问题。只需运行\
    \ `meteor add`，然后就可以开始了！\n\n> 你可以通过在终端中输入以下命令来获取你正在使用的包列表：\n> `meteor list`\n\n\
    由于 Meteor 社区添加包的速度如此之快，保持你的 Meteor 安装处于最新状态是个好主意。不时地在终端中运行以下命令：\n\n```\n$ meteor\
    \ update\n```\n\n如果你已经是最新版本，它会告诉你，以及你正在运行的版本号。如果有新版本，它会为你下载并安装，同时更新所有包。\n\n##\
    \ 打包你的应用程序\n\n按照 Meteor 一贯的风格，将应用程序打包以便部署非常简单。如果你的 Meteor 应用正在运行，请停止它，确保你在你的应用程序文件夹中（对于借阅图书馆，这是\
    \ `~/Documents/Meteor/` 下的 `LendLib` 文件夹），然后在终端中输入以下命令：\n\n```\n$ meteor bundle\
    \ ~/Documents/Meteor/builds/\n```\n\n这需要一点时间来运行，但完成后，你将在 `builds/` 文件夹中拥有一个 `LendLib.tar.gz`\
    \ 压缩包，你可以在任意你喜欢的地方部署它。这是一个完整的 Node 包/捆绑包。你部署此捆绑包的机器只需要安装 **Node.js** 和 **MongoDB**\
    \ 即可。你需要的其他所有内容都已包含在捆绑包中。\n\n## 将应用程序部署到 Meteor 的服务器\n\nMeteor 的开发者们将部署推向了一个新的高度——超出了你对付费产品的预期，更不用说免费产品了。Meteor\
    \ 允许你直接在其部署服务器上部署你的应用程序。为你的应用起一个名字（我们将使用 `packt.lendlib`，但你需要想一个你自己的），然后在终端中输入以下命令：\n\
    \n```\n$ meteor deploy [your app name].meteor.com\n```\n\n因此，在我们的例子中，我们输入了 `meteor\
    \ deploy packt.lendlib.meteor.com`。控制台会在捆绑、上传和部署你的应用程序时提供状态更新。完成后，它会给出类似这样的消息：\n\
    \n```\nNow serving at [your app name].meteor.com\n```\n"
