    _id\":list_id ,\n                         \"items.Name\":item_name});\n  \n  if\
    \ (l&&l.items)\n  {\n    for (var i = 0; i<l.items.length; i++)\n    {\n     \
    \ if (l.items[i].Name === item_name)\n      {\n        var updateItem = {};\n\
    \        updateItem['items.'+i+'.LentTo'] = lendee_name;\n        lists.update({'_id':list_id},{$set:updateItem});\n\
    \        break;\n      }\n    }\n  }\n};\n```\n\n我们获取 `list_id`、`item_name` 和\
    \ `lendee_name`，这样我们就能识别正确的记录（为此我们使用 `list_id` 和 `item_name`），然后用 `lendee_name`\
    \ 中的值更新 `LentTo` 属性。\n\n为了省些打字，我们使用 MongoDB 的 `findOne()` 函数声明 `l` 变量。它接受一个两部分的选择器语句：`_id:list_id`\
    \ 和 `\"items.Name\":item_name`。这个选择器基本上是在说，*给我找一条 _id == list_id 且 items[] 数组中有\
    \ Name == item_name 的记录*。\n\n如果 `l` 有值并且它也有 `items`，我们就会进入 `for` 循环。在这里，我们专门检查哪个数组元素的\
    \ `Name == item_name`。如果找到了，我们首先将想要做的更改创建为一个对象。例如，如果我们想要更改的项是在 `items` 数组的第一个元素中找到的，我们的\
    \ `updateItem` 对象看起来会是这样的：\n\n```\n{ 'items.0.LentTo' : lendee_name }\n```\n\n\
    ## 模板\n\n创建好对象后，我们调用 `lists.update()` 方法，用 `$set` 命令传入 `updateItem`，就像这样：\n\n\
    ```\nlists.update({...},{$set : updateItem});\n```\n\n这个 `update()` 方法会更新 `lists`\
    \ 集合。如你所记得的，`lists` 集合是一个响应式上下文，因此 UI 会随更改而更新。\n\n## 样式更新\n\n现在，我们有一个可以工作的应用程序了！我们还没有完善\
    \ CSS，但让我们快速处理一下。确保你的应用程序正在运行（在终端窗口中运行 `meteor` 命令）并导航到 `http://localhost:3000`：\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_80_0.png)\n\n点击 **DVDs**，你应该能看到 **Mission\
    \ Impossible** 的一条记录：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_80_1.png)\n\n\
    除了一些宽度/高度问题以及可能的一些字体大小问题外，还不算太糟，但那是因为 Bootstrap 帮了我们很多忙。让我们从稍微增加项目的字体大小开始。为此，打开\
    \ `LendLib.css` 并添加以下声明：\n\n```\n.lending_item {\n  font-size:1.8rem;\n}\n```\n\
    \n接下来，我们的 `btnAddItem` 按钮对我们来说有点太\"Bruce Banner\"（布鲁斯·班纳，即变身前的绿巨人）了。让我们让它更\"Hulk\"\
    （浩克）一点，把它变大变绿。为此，在 LendLib.css 底部添加以下声明：\n\n```\n#btnAddItem span{\n  color:#5cb85c;\n\
    \  font-size:4rem;\n}\n```\n\n最后，我们将添加一个小改进。打开 `LendLib.js` 并修改以下 `focusText()`\
    \ 函数，从这样：\n\n```\n//this function puts our cursor where it needs to be.\nfunction\
    \ focusText(i) {\n  i.focus();\n  i.select();\n};\n```\n\n改成这样：\n\n```\n//this\
    \ function puts our cursor where it needs to be.\nfunction focusText(i,val) {\n\
    \  i.focus();\n  i.value = val ? val : \"\";\n  i.select();\n};\n```\n\n这个改动使得当我们去编辑一个已经有值的东西时（比如借入者），该值会传递到文本框中。这让用户更容易看到当前的借入者是谁。`val\
    \ ? val : \"\"` 条件语句是必要的，因为如果 val 没有传入或为 null，**undefined** 会被放入文本框中。\n\n保存所有更改，让我们预览一下我们的应用看起来如何：\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_82_0.png)\n\n一切似乎都正常。摆弄一下你的应用——添加一些新类别，借点东西给你的朋友（除了\
    \ STEVE！），完成后，继续下一章。\n\n## 总结\n\n在本章中，你完成了借阅图书馆应用程序的模板、事件和数据模型部分。你创建了添加、删除和更新记录的语句，并实现了\
    \ UI 状态更改。你亲眼看到了响应式编程是如何工作的，并对上下文有了扎实的理解。现在你已经具备了从零开始创建应用程序的能力，使用 Meteor 的核心功能快速开发具有强大功能的应用程序。\n\
    \n在下一章中，我们将更深入地研究 Meteor 的数据缓存和同步方法，并加固你的应用程序。\n\n# 5\n数据——Meteor 风格！\n\n我们几乎已经完成了\
    \ **借阅图书馆** 应用程序，而无需过多担心我们的数据是如何存储的。Meteor 的数据缓存和同步方法是有意为之，以使构建应用程序的这部分尽可能简单，这样你就不需要花费大量时间处理数据库连接、查询和缓存，而是可以专注于编写出色的程序。\n\
    \n然而，我们确实想要了解这个方法论，并且我们必须确保对 Meteor 如何处理数据有扎实的理解，这样我们才能执行一些常见的优化，更快地构建我们的应用程序。\n\
    \n在本章中，你将学习以下主题：\n\n- MongoDB 和面向文档的存储\n- 广播更改——Meteor 如何使你的 Web 应用程序具有响应性\n-\
    \ 配置发布者——如何精简和保护你的数据\n\n## 面向文档的存储\n\nMeteor 在服务器端使用 MongoDB，在客户端使用 MongoDB 的一个版本\
    \ **Minimongo**。它能够使用任何其他 NoSQL/面向文档的数据库，但 MongoDB 默认随 Meteor 安装提供。这个功能使你的程序更加简单、更容易编写，并且对于快速、轻量级的数据存储非常有效。\n\
    \n## 为什么不使用关系型数据库？\n\n传统上，大多数数据使用关系模型存储。关系模型及其所有相关的规则、关系、逻辑和语法，是现代计算中不可或缺且宝贵的部分。关系数据库的刚性结构，对每个记录、关系和关联的精确要求，为我们提供了快速搜索、可扩展性以及深度分析的潜力。\n\
    \n然而，这种精确性并不总是必要的。例如，在我们的借阅图书馆应用程序中，一个成熟的关系数据库就会过于复杂了。事实上，在某些情况下，拥有一个灵活的数据存储系统更为有效——一个你可以快速扩展而无需大量重新编码的系统。\n\
    \n例如，如果你想给你的 `list` 对象添加一个新属性，直接添加新属性让数据库去处理要比重构你的数据库代码、添加新列、更新所有 SQL 语句和触发器、确保所有以前的记录都有新属性简单得多。\n\
    \n这就是面向文档的存储发挥作用的地方。在面向文档的存储系统中，你的数据存储由一堆键值对文档组成。那么，那个文档的结构是什么？数据存储其实并不关心。它可以包含几乎任何东西，只要每个记录都有一个唯一的键以便检索。\n\
    \n所以，在一个文档条目中，你可以有一个非常简单的文档——也许是一个键值对：\n\n```\n{name:phone_number}\n```\n\n然后，在另一个文档条目（在同一个数据存储中）中，你可以有一个包含嵌套数组、嵌套对象等的复杂对象：\n\
    \n```\n{ people: [\n  {firstname:\"STEVE\", lastname:\"Scuba\", phones :[\n  \
    \  {type:cell, number:8888675309},\n    {type:home, number:8005322002}]\n  },\n\
    \  {firstname:...\n    ...\n  }]\n}\n```\n\n哎呀，它甚至可以是威廉·莎士比亚的完整作品。这并不重要。只要数据存储能够接受该文档并为其分配一个唯一的键，它就可以被存储。\n"
