    \       Session.set('list_adding',false);\n    }\n },\n```\n\n> You can learn\
    \ more about what `Tracker.flush()` does in the Meteor documentation at http://docs.meteor.com/#/full/tracker_flush.\n\
    \n## Templates\n\nThe next event is based on the `keyup` event for our `item_to_add`\
    \ textbox (`e.which === 13`). If we hit *Enter* or *Return*, we'll call the `addItem()`\
    \ function to update the data model, and then we'll hide the textbox. How do we\
    \ do this? Set `list_adding = false` of course. Again, doing it through `Session.set()`\
    \ will cascade the change through our templates.\n\nThere is something else that\
    \ you may have missed. Remember when we manually added a category/list in *Chapter\
    \ 2, Reactive Programming... It's Alive!* The change was instantly reflected in\
    \ the HTML DOM. The same thing is true here. When `addItem()` updates the data\
    \ model, that change will trigger a template refresh for `Template.list.items`.\n\
    \n```\n'focusout #item_to_add': function(e,t){\n  Session.set('list_adding',false);\n\
    },\n```\n\nThis event handler creates a situation so that, if we were to change\
    \ our minds about adding an `item`, all we have to do is click away from it. If\
    \ the `item_to_add` textbox triggers the `focusout` event, we'll set the `Session`\
    \ variable, `list_adding`, to `false`, and the template will cascade.\n\n```\n\
    'click .delete_item': function(e,t){\n  removeItem(Session.get('current_list'),e.target.id);\n\
    },\n```\n\nRemember, when we created the little x button in our HTML `lists` template?\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_76_0.png)\n\nThat button belongs to\
    \ the CSS class, `delete_item`; when the user clicks on it, we will call the `removeItem()`\
    \ function and pass `current_list` and `id` from the HTML element that was clicked,\
    \ which happens to be the `Name` item (we added `id=\"{{Name}}\"` on the 29th\
    \ line of `LendingLib.html`).\n\n```\n'click .lendee' : function(e,t){\n  Session.set('lendee_input',this.Name);\n\
    \  Tracker.flush();\n  focusText(t.find(\" #edit_lendee\"),this.LentTo);\n},\n\
    ```\n\nWe now focus on the `lendee` section/button. If you recall, we set up a\
    \ `<div>` element with the `lendee` CSS class in `LendingLib.html`. We are now\
    \ declaring that whenever one of those `<div>` elements is clicked, we'll perform\
    \ actions very similar to those we used when we wanted to add an `item` to a `list`:\n\
    \n1. Set the `Session` variable that controls textbox visibility to `true` (`lendee_input`).\n\
    2. Refresh the UI (`Tracker.flush()`).\n3. Set the focus on the textbox (`focusText()`).\n\
    \nLet's consider one more event handler:\n\n```\n'keyup #edit_lendee': function\
    \ (e,t){\n    if (e.which === 13)\n    {\n      updateLendee(Session.get('current_list'),this.Name,\n\
    \      e.target.value);\n      Session.set('lendee_input',null);\n    }\n    if\
    \ (e.which === 27)\n    {\n      Session.set('lendee_input',null);\n    }\n  }\n\
    });\n```\n\nThe textbox with `id=\"edit_lendee\"` has two `keyup` conditions attached\
    \ to it.\n\nIf we hit *Enter* or *Return* (`e.which === 13`), we'll update the\
    \ `LentTo` property on the data model using `updateLendee()`. We'll then hide\
    \ the textbox by setting `lendee_input` to `null`. Setting `lendee_input` to `null`\
    \ is a change to a reactive variable, which triggers the reactive computations\
    \ and updates the UI.\n\nIf we instead decide that we don't like the changes,\
    \ we can hit the *Esc* key (`e.which === 27`); in this case, we'll set `lendee_input`\
    \ to `null` and let the reactive programming hide the textbox.\n\n## Model updates\n\
    \nWe have two things left to do. We need to polish up our app with a bit of CSS\
    \ (not just yet though), and we need to create the `addItem()`, `removeItem()`,\
    \ and `updateLendee()` functions to which we just referred in the `events` section.\n\
    \n## Templates\n\nSo, let's get to work! In `LendingLib.js`, just below the `selectCategory()`\
    \ function, let's create the `addItem()` function:\n\n```\nfunction selectCategory(e,t){\n\
    \ ...\n};\nfunction addItem(list_id,item_name){\n if (!item_name&&!list_id) return;\n\
    \ lists.update({_id:list_id},\n               {$addToSet:{items:{Name:item_name}}});\n\
    };\n```\n\nThe first thing that we do is check to make sure that we have values\
    \ for `item_name` and `list_id`. If we don't, we'll just return.\n\nNow, we'll\
    \ call the MongoDB `update()` function on the `lists` collection. `{_id:list_id}`\
    \ is the selector. We tell MongoDB to find us the record with `_id = list_id`.\
    \ We then tell MongoDB what kind of update we're going to perform. In this case,\
    \ we'll use `$addToSet`, which will append to an array. And, what are we going\
    \ to append?\n\n{`items`:...} indicates that we're updating the `items[]` array.\
    \ `{Name:item_name}` is what we're adding, and it's the `Name` property. This\
    \ is equivalent to saying `item.Name = item_name`.\n\nOnce we add this, as you\
    \ might have guessed by now, the templates will automatically update because `lists`\
    \ is a reactive variable. Stop for a second and think about this. In six lines\
    \ of code, we performed an update query *and* propagated the change to our UI.\
    \ Six lines! Pretty magical, isn't it?\n\nLet's handle `removeItem()` next:\n\n\
    ```\nfunction addItem(list_id,item_name){\n ...};\nfunction removeItem(list_id,item_name){\n\
    \ if (!item_name&&!list_id)\n   return;\n lists.update({_id:list_id},\n      \
    \         {$pull:{items:{Name:item_name}}});\n};\n```\n\nWow, this looks really\
    \ similar to the `addItem()` function. We are, in fact, using the same `update()`\
    \ function, just with a different action this time. This time, we'll use `$pull`,\
    \ which pulls an element out of the `items[]` array, where `Name == item_name`.\
    \ Once again, six lines are all we need. Once we update the `lists` collection,\
    \ the UI will update reactively.\n```"
