    But the true beauty of DDP lies in the generic nature of the communication. It
    doesn''t matter what kind of system sends or receives data over DDP — it can be
    a server, a web service, or a client app — they all use the same protocol to communicate.
    This means that none of the systems know (or care) whether the other systems are
