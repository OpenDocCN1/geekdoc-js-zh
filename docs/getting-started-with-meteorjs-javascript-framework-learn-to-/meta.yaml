    < ► Mongo.Collection {_makeNewID: LocalCollection, _name: \"lists\"…\n> \n```\n\
    \n## Adding some data\n\nThe previous output means that our changes were accepted,\
    \ and we have a new persistent collection! It's empty, but let's do something\
