    but unless you''re some weirdo collector, you don''t need *two* categories. So,
    let''s remove them. However, we can''t just erase whatever we want on the client
    side. This is a basic safety feature, and if we just let it happen, things could
    get quite chaotic. For instance, if we tried to just remove the records using
    the following command:


    ```

    > lists.remove({Category:"Fraggles"});

    ```'
