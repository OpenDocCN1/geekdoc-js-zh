- md: ' ## Reactive Programming...It''s Alive!


    You will notice that the change propagates to both browsers, without a page refresh:


    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_44_0.png)


    Feel free to make any extra collections, to remove or rename them, and so on.
    Experiment a little and notice how these changes can be instantly made to every
    listening client. Meteor operates under a very powerful paradigm, and in the next
    chapter, you''ll be able to see exactly why this is such an important and disruptive
    change to web application development.


    ## Summary


    In this chapter, you successfully created the framework for your new Meteor application.
    You saw firsthand how quickly a new project can be created, and you created database
    and template functionality with just a few lines of code. You saw live HTML and
    reactive programming in action, and you are now ready to go even deeper into the
    Meteor engine. You''ve conquered the tip of the iceberg, my friend. Take a break,
    have a cold one, and get ready for even more Meteor awesomeness!


    ## Why Meteor Rocks!


    Meteor is a disruptive (in a good way!) technology. It enables a new type of web
    application that is faster, easier to build, and takes advantage of modern techniques,
    such as **Full Stack Reactivity**, **Latency Compensation**, and **Data On The
    Wire**.


    This chapter explains how web applications have changed over time, why that matters,
    and how Meteor specifically enables modern web apps through the above-mentioned
    techniques.


    By the end of this chapter, you will have learned:


    - What a modern web application is

    - What Data On The Wire means and how it''s different

    - How Latency Compensation can improve your app experience

    - Templates and Reactivity—programming the reactive way!


    ### Modern web applications


    Our world is changing. With continual advancements in displays, computing, and
    storage capacities, things that weren''t even possible a few years ago are now
    not only possible but are critical to the success of a good application. The Web
    in particular has undergone significant change.


    ### The origin of the web app (client/server)


    From the beginning, web servers and clients have mimicked the **dumb terminal**
    approach to computing where a server with significantly more processing power
    than a client will perform operations on data (writing records to a database,
    math calculations, text searches, and so on), transform the data and render it
    (turn a database record into HTML and so on), and then serve the result to the
    client, where it is displayed for the user.


    In other words, the server does all the work, and the client acts as more of a
    display, or a dumb terminal. This design pattern for this is called...wait for
    it...the **client/server** design pattern. The diagrammatic representation of
    the client-server architecture is shown in the following diagram:


    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_46_0.png)


    This design pattern, borrowed from the dumb terminals and mainframes of the 60s
    and 70s, was the beginning of the Web as we know it and has continued to be *the*
    design pattern that we think of when we think of the Internet.


    ### The rise of the machines (MVC)


    Before the Web (and ever since), desktops were able to run a program such as a
    spreadsheet or a word processor without needing to talk to a server. This type
    of application could do everything it needed to, right there on the big and beefy
    desktop machine.


    During the early 90s, desktop computers got even more beefy. At the same time,
    the Web was coming alive, and people started having the idea that a hybrid between
    the beefy desktop application (a **fat app**) and the connected client/server
    application (a **thin app**) would produce the best of both worlds. This kind
    of hybrid app—quite the opposite of a dumb terminal—was called a **smart app**.


    Many business-oriented smart apps were created, but the easiest examples can be
    found in computer games. **Massively Multiplayer Online** games (MMOs), first-person
    shooters, and real-time strategies are smart apps where information (the data
    **model**) is passed between machines through a server. The client in this case
    does *a lot* more than just display the information. It performs most of the processing
    (or acts as a **controller**) and transforms the data into something to be displayed
    (the **view**).


    This design pattern is simple but very effective. It''s called the **Model View
    Controller (MVC)** pattern.


    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_47_0.png)


    The **model** is essentially the data for an application. In the context of a
    smart app, the model is provided by a server. The client makes requests to the
    server for data and stores that data as the model. Once the client has a model,
    it performs actions/ logic on that data and then prepares it to be displayed on
    the screen. This part of the application (talking to the server, modifying the
    data model, and preparing data for display) is called the **controller**.


    The controller sends commands to the **view**, which displays the information.
    The view also reports back to the controller when something happens on the screen
    (a button click, for example). The controller receives the feedback, performs
    the logic, and updates the model. Lather, rinse, repeat!


    Since web browsers were built to be "dumb clients", the idea of using a browser
    as a smart app back then was out of question. Instead, smart apps were built on
    frameworks such as Microsoft .NET, Java, or Macromedia (now Adobe) Flash. As long
    as you had the framework installed, you could visit a web page to download/run
    a smart app.


    Sometimes, you could run the app inside the browser, and sometimes, you would
    download it first, but either way, you were running a new type of web app where
    the client application could talk to the server and share the processing workload.


    ### The browser grows up


    Beginning in the early 2000s, a new twist on the MVC pattern started to emerge.
    Developers started to realize that, for connected/enterprise "smart apps", there
    was actually a nested MVC pattern.


    The server code (controller) was performing business logic against the database
    (model) through the use of business objects and then sending processed/rendered
    data to the client application (a "view").


    The client was receiving this data from the server and treating it as its own
    personal "model". The client would then act as a proper controller, perform logic,
    and send the information to the view to be displayed on the screen.


    So, the "view" for the server MVC was the "model" for the client MVC.


    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_48_0.png)


    As browser technologies (HTML and JavaScript) matured, it became possible to create
    smart apps that used the Nested MVC design pattern directly inside an HTML web
    page. This pattern makes it possible to run a full-sized application using only
    JavaScript. There is no longer any need to download multiple frameworks or separate
    apps. You can now get the same functionality from visiting a URL as you could
    previously by buying a packaged product.


    ### A giant Meteor appears!


    Meteor takes modern web apps to the next level. It enhances and builds upon the
    nested MVC design pattern by implementing three key features:


    - Data On The Wire through the Distributed Data Protocol (**DDP**)

    - Latency Compensation with **Mini Databases**

    - Full Stack Reactivity with **Blaze** and **Tracker**


    Let''s walk through these concepts to see why they''re valuable, and then, we''ll
    apply them to our Lending Library application.


    ### Data On The Wire


    The concept of Data On The Wire is very simple and in tune with the nested MVC
    pattern; instead of having a server process everything, render content, and then
    send HTML across the wire, why not just send the data across the wire and let
    the client decide what to do with it?


    This concept is implemented in Meteor using the Distributed Data Protocol, or
    **DDP**. DDP has a JSON-based syntax and sends messages similar to the REST protocol.
    Additions, deletions, and changes are all sent across the wire and handled by
    the receiving service/client/device. Since DDP uses WebSockets rather than HTTP,
    the data can be pushed whenever changes occur.


    But the true beauty of DDP lies in the generic nature of the communication. It
    doesn''t matter what kind of system sends or receives data over DDP — it can be
    a server, a web service, or a client app — they all use the same protocol to communicate.
    This means that none of the systems know (or care) whether the other systems are
    clients or servers. With the exception of the browser, any system can be a server,
    and without exception, any server can act as a client. All the traffic looks the
    same and can be treated in a similar manner.'
  mdcn: "\n ## 响应式编程……它是活的！\n\n你会发现，变更会同时传播到两个浏览器，而且无需刷新页面：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_44_0.png)\n\
    \n你可以随意创建额外的集合，删除或重命名它们，等等。多尝试一番，注意这些变更是如何实时同步到每一个监听客户端的。Meteor 遵循的是一种非常强大的范式，在下一章中，你将确切地了解到它为何对\
    \ Web 应用开发而言是如此重要且颠覆性的变革。\n\n## 小结\n\n在本章中，你成功地为新的 Meteor 应用创建了框架。你亲眼见证了创建一个新项目的速度有多快，而且只用了几行代码就实现了数据库和模板功能。你见识了实时的\
    \ HTML 和响应式编程的实际应用，现在你已经准备好更深入地探索 Meteor 引擎了。我的朋友，你才刚刚触及冰山一角。休息一下，来杯冰饮，准备好迎接更多\
    \ Meteor 的精彩吧！\n\n## Meteor 为何如此出色！\n\nMeteor 是一项颠覆性的技术（褒义的！）。它实现了一种新型的 Web 应用：速度更快、更易构建，并充分利用了现代技术，例如**全栈响应式（Full\
    \ Stack Reactivity）**、**延迟补偿（Latency Compensation）**和**数据在途（Data On The Wire）**。\n\
    \n本章将解释 Web 应用是如何随时间演变的、为何这很重要，以及 Meteor 具体如何通过上述技术来实现现代 Web 应用。\n\n学完本章后，你将掌握：\n\
    \n- 什么是现代 Web 应用\n- 数据在途（Data On The Wire）的含义及其独特之处\n- 延迟补偿如何改善你的应用体验\n- 模板与响应式——用响应式的方式编程！\n\
    \n### 现代 Web 应用\n\n我们的世界正在变化。随着显示技术、计算能力和存储容量的持续进步，几年前还不可能实现的事情，如今不仅成为可能，而且对优秀应用的成功至关重要。尤其是\
    \ Web，已经发生了显著的变化。\n\n### Web 应用的起源（客户端/服务器）\n\n从一开始，Web 服务器和客户端就模拟了**哑终端（dumb\
    \ terminal）**的计算方式——服务器拥有比客户端强得多的处理能力，负责对数据执行操作（将记录写入数据库、数学计算、文本搜索等）、转换数据并渲染（将数据库记录转为\
    \ HTML 等），然后将结果提供给客户端显示给用户。\n\n换句话说，服务器包揽了所有工作，而客户端更像是一个显示器，或者说哑终端。这种设计模式叫做……等着瞧……**客户端/服务器（client/server）**设计模式。客户端-服务器架构的图示如下：\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_46_0.png)\n\n这种设计模式借鉴了 60 到 70 年代的哑终端和大型机，是我们所熟知的\
    \ Web 的开端，并且一直延续至今，成为我们想到互联网时默认的设计模式。\n\n### 机器崛起（MVC）\n\n在 Web 出现之前（以及之后），桌面电脑无需与服务器通信，就能运行电子表格或文字处理程序等应用。这类应用可以在本地强大而健壮的台式机上完成所有需要的工作。\n\
    \n90 年代早期，台式电脑变得更加强劲。与此同时，Web 开始兴起，人们开始构想一种介于健壮的桌面应用（**胖应用，fat app**）和联网的客户端/服务器应用（**瘦应用，thin\
    \ app**）之间的混合体，以兼取两者之长。这种混合应用——与哑终端截然相反——被称为**智能应用（smart app）**。\n\n许多面向企业的智能应用被开发出来，但最容易理解的例子是电脑游戏。**大型多人在线（Massively\
    \ Multiplayer Online）**游戏（MMO）、第一人称射击和即时战略游戏都是智能应用，其中信息（即数据**模型，model**）通过服务器在机器之间传递。在这种情况下，客户端所做的*远不止*显示信息。它执行了大部分处理（或者说充当**控制器，controller**），并将数据转换成可供显示的形式（即**视图，view**）。\n\
    \n这种设计模式简单但非常有效。它被称为**模型-视图-控制器（Model View Controller，MVC）**模式。\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_47_0.png)\n\
    \n**模型**本质上是应用的数据。在智能应用的语境中，模型由服务器提供。客户端向服务器请求数据，并将这些数据存储为模型。一旦客户端拥有了模型，它就会对数据执行操作/逻辑，然后准备将其显示在屏幕上。应用的这一部分（与服务器通信、修改数据模型、准备数据进行显示）被称为**控制器**。\n\
    \n控制器向**视图**发送指令，由视图来显示信息。视图还会在屏幕上发生某些事情时（例如按钮点击）向控制器反馈。控制器接收反馈，执行逻辑，并更新模型。如此循环往复！\n\
    \n由于 Web 浏览器被设计为\"哑客户端\"，当时使用浏览器作为智能应用的想法是无稽之谈。相反，智能应用是基于 Microsoft .NET、Java\
    \ 或 Macromedia（现为 Adobe）Flash 等框架构建的。只要你安装了相应的框架，就可以访问网页来下载/运行智能应用。\n\n有时，你可以在浏览器内运行应用；有时，你需要先下载它。但无论如何，你都在运行一种新型的\
    \ Web 应用——客户端应用可以与服务器通信，并分担处理工作负载。\n\n### 浏览器长大了\n\n进入 21 世纪初，MVC 模式出现了一种新的变体。开发人员开始意识到，对于联网/企业级\"\
    智能应用\"来说，实际上存在着一种嵌套的 MVC 模式。\n\n服务器代码（控制器）通过业务对象对数据库（模型）执行业务逻辑，然后将处理/渲染后的数据发送给客户端应用（一个\"\
    视图\"ṇ）。\n\n客户端接收来自服务器的数据，并将其视为自己的\"模型\"。然后客户端充当真正的控制器，执行逻辑，并将信息发送给视图以显示在屏幕上。\n\
    \n因此，服务器 MVC 的\"视图\"就是客户端 MVC 的\"模型\"。\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_48_0.png)\n\
    \n随着浏览器技术（HTML 和 JavaScript）的成熟，创建直接在 HTML 网页内使用嵌套 MVC 设计模式的智能应用成为可能。这种模式使得仅用\
    \ JavaScript 就能运行全尺寸的应用。不再需要下载多个框架或单独的应用。现在，你只需访问一个 URL，就能获得以往只有购买打包产品才能享有的功能。\n\
    \n### 一颗巨大的 Meteor 出现了！\n\nMeteor 将现代 Web 应用提升到了新的高度。它通过实现三个关键特性，增强并拓展了嵌套 MVC\
    \ 设计模式：\n\n- 通过分布式数据协议（**DDP**）实现数据在途（Data On The Wire）\n- 通过**迷你数据库（Mini Databases）**实现延迟补偿（Latency\
    \ Compensation）\n- 通过 **Blaze** 和 **Tracker** 实现全栈响应式（Full Stack Reactivity）\n\
    \n让我们来了解这些概念，看看它们为何有价值，然后将它们应用到我们的 Lending Library 应用中。\n\n### 数据在途（Data On The\
    \ Wire）\n\n数据在途的概念非常简单，而且与嵌套 MVC 模式一脉相承：与其让服务器处理所有事情、渲染内容，然后再把 HTML 送到线上，何不把数据直接送到线上，让客户端来决定如何处理呢？\n\
    \n这个概念在 Meteor 中通过分布式数据协议，即 **DDP** 来实现。DDP 采用基于 JSON 的语法，发送类似 REST 协议的消息。增加、删除和变更都会通过网络发送，并由接收端的服务/客户端/设备处理。由于\
    \ DDP 使用 WebSocket 而非 HTTP，数据可以在变更发生时实时推送。\n\n但 DDP 真正的美妙之处在于其通信的通用性。通过 DDP 发送或接收数据的系统类型并不重要——无论是服务器、Web\
    \ 服务还是客户端应用——它们都使用相同的协议进行通信。这意味着任何系统都不知道（或不关心）其他系统是客户端还是服务器。除了浏览器之外，任何系统都可以充当服务器；而且毫无例外，任何服务器都可以充当客户端。所有流量看起来都一样，可以以类似的方式处理。\n"
