    # Summary


    In this chapter, you learned about the history of web applications and saw how
    we''ve moved from a traditional client/server model to a nested MVC design pattern.
    You learned what smart apps are, and you also saw how Meteor has taken smart apps
    to the next level with Data On The Wire, Latency Compensation, and Full Stack
    Reactivity. You saw how Meteor uses templates and helpers to automatically update
    content, using reactive variables and reactive computations. Lastly, you added
    more functionality to the Lending Library. You made a button and an input field
    to add categories, and you did it all using reactive programming rather than directly
    editing the HTML code. In the next chapter, we''ll really get to work and add
    all kinds of templates and logic, bringing our Lending Library to life!'
- md: " ## Templates\n\nWe've gotten just a taste of templates so far and are now\
    \ ready to dive in to create a working application using reactive programming.\
    \ This chapter will take us through the template system in depth and show us how\
    \ to implement display logic and take care of data flow.\n\nIn this chapter, you\
    \ will complete the following tasks:\n\n- Complete the Lending Library core functionality\n\
    - Create multiple templates and template logic\n- Add, delete, and update entries\
    \ in the data model\n- See reactivity in action and use it in your application\n\
    \n## A new HTML template\n\nWe've already created our categories through the use\
    \ of the `categories` template. Now, we want to take this to the next level and\
    \ display the actual items that we may want to let people (except STEVE!) borrow\
    \ so that when we click on a category, we get a list of items.\n\nLet's use that\
    \ terminology. We need a place to display a list. So, let's modify our LendLib.html\
    \ file at ~/Documents/Meteor/LendLib/ just a bit at the top:\n\n```\n<body>\n\
    \    <div id=\"lendlib\" class=\"container\">\n        <div id=\"categories-container\"\
    \ class=\"container\">\n            {{> categories}}\n        </div>\n       \
    \ <div id=\"list\">\n            {{> list}}\n        </div>\n    </div>\n</body>\n\
    ```\n\n```\n</div>\n</div>\n</body>\n```\n\nWe did two things by adding this code:\n\
    \n1. We wrapped the div element with `id=\"categories-container\"` inside the\
    \ `div` element called `lendlib`, and we moved `class=\"container\"` to the new\
    \ `div` element. This is for stylistic purposes so that our list will more or\
    \ less line up with the `categories` template.\n\n2. We added a `div` element\
    \ with `id=\"list\"` just below it and also added a call to a new template: `{{>\
    \ list}}`. This is our template/placeholder for the list of items, which we'll\
    \ see shortly in the sections that follow.\n\nAnd, there you have it. We've created\
    \ a very easy-to-maintain structure with definite boundaries in the document.\
    \ We know where our categories are going to go, and we know where our list of\
    \ items is going to go.\n\nNow, let's see about the `list` template itself. Not\
    \ so simple, but still not bad. At the very end of `LendLib.html`, below the closing\
    \ `</template>` tag for our `categories` template, place the following code:\n\
    \n```\n<template name=\"list\">\n  <div id=\"lending_list\" class=\"list-group\"\
    >\n    {{#each items}}\n      <div class=\"lending_item list-group-item\">\n \
    \       <button type=\"button\"\n          class=\"close delete_item\" id=\"{{Name}}\"\
    >×</button>\n        {{Name}}\n        {{#if lendee_editing}}\n          <input\
    \ type=\"text\" id=\"edit_lendee\"\n          class=\"span-2\" value=\"\"/>\n\
    \        {{else}}\n          <div class=\"lendee label {{LendClass}}\">\n    \
    \        {{Lendee}}\n          </div>\n        {{/if}}\n      </div>\n    {{/each}}\n\
    \    {{#if list_selected}}\n      <div class=\"list-group-item\" id=\"btnAddItem\"\
    >\n        <span class=\"glyphicon glyphicon-plus\"></span>\n        {{#if list_adding}}\n\
    \          <input class=\"span-4\" id=\"item_to_add\"\n          size=\"32\" type=\"\
    text\">\n```\n\n```\n{{/if}}\n    </div>\n    {{/if}}\n  </div>\n</template>\n\
    ```\n\nLet's go through this step by step so that we understand what each line\
    \ does.\n\n```\n<template name=\"list\">\n  <div id=\"lending_list\" class=\"\
    list-group\">\n    {{#each items}}\n```\n\nHere, we declare the `<template>` tag\
    \ with the name `list` to match the call to the `list` template that we made in\
    \ the body. We create a Bootstrap `list-group` and give it an `id` value so that\
    \ we can refer to it later if need be.\n\nThen, we start a templated `each` statement.\
    \ This time, we're going to iterate through `items`. We haven't created the Meteor\
    \ `items` template just yet, but we'll get there soon enough.\n\n```\n<div class=\"\
    lending_item list-group-item\">\n  <button type=\"button\"\n    class=\"close\
    \ delete_item\">x</button>\n  {{Name}}\n```\n\nNow, under the `each` statement,\
    \ we create a `div` element and give it two class names. The `lending_item` class\
    \ name is added so that we can refer to it in our reactive templates. The `list-group-item`\
    \ class name is for Bootstrap so that it will display all nice and pretty.\n\n\
    Next, we create a `button` that we can use should we choose to delete the item.\
    \ There are also two class names on this one. The `close` class is added for Bootstrap,\
    \ and `delete_item` is added so that we can refer to it in our helpers when the\
    \ time comes.\n\nNow, just below that we have another template placeholder for\
    \ `{{Name}}`. This is so that we can use the title of the item (for example, on\
    \ a DVD item the title could be **Mission Impossible**) inside our display element.\
    \ We'll see this in action very soon.\n\nNow, we begin a series of conditional\
    \ statements. The first conditional statement lets us edit the **lendee** (the\
    \ person who borrowed the item):\n\n```\n{{#if lendee_editing}}\n  <input type=\"\
    text\" id=\"edit_lendee\"\n    class=\"span-2\" value=\"\"/>\n{{else}}\n  <div\
    \ class=\"lendee label {{LendClass}}\">\n    {{Lendee}}\n```\n\n```\n        </div>\n\
    \        {{/if}}\n        </div>\n        {{/each}}\n```\n\nWe are first using\
    \ an *if* statement to see whether our *current mode* for this `item` is `lendee_editing`.\
    \ That is to say, if we wanted to edit the lendee, we would be in \"lendee editing\"\
    \ mode, and therefore, (in our JavaScript file) `Template.list.lendee_editing`\
    \ would return as `true`. If this is the case, we need a textbox; therefore, we\
    \ included the `<input>` element with its associated `id`.\n\nAlternately — and\
    \ this is the default — we just want to display who the lendee is, if there is\
    \ one. If there isn't one, we'll want to maybe change the color or something,\
    \ but we still want to display it. So, we create a bootstrap-styled `label` in\
    \ the form of a `<div>` element.\n\nAt the end of the classes' declarations, we\
    \ see a template variable, ...`{{LendClass}}\"`. This class addition is stylistic.\
    \ It will tell your CSS template whether to show it as **free** (someone can borrow\
    \ it) or **lent out**. If it's green, it's free; however, if it's red, someone\
    \ has borrowed it. The CSS class name used to represent the color will be determined\
    \ in `LendLib.js`, by the `item.LendClass` property, which we will create shortly.\n\
    \nThen, we have the value inside the div, `{{Lendee}}`. This will also be a property\
    \ in `LendLib.js`, as the `item.Lendee` property, and it will display either the\
    \ name of the lendee or the word **free**, if no one has borrowed it.\n\nWe then\
    \ have the ending `</div>` tag, and our `each` comes to an end with `{{/each}}`.\n\
    \nNow, we have our second *if* statement, and this one is actually a nested *if*.\
    \ This one is outside the `each` statement, so it's not specific to items. This\
    \ *if* statement displays either a plus (+) sign or a textbox in the form of an\
    \ `<input>` element so that we can add items to our list:\n\n```\n        {{#if\
    \ list_selected}}\n            <div class=\"list-group-item\" id=\"btnAddItem\"\
    >\n                <span class=\"glyphicon glyphicon-plus\"></span>\n        \
    \        {{#if list_adding}}\n                    <input class=\"span-4\" id=\"\
    item_to_add\"\n                           size=\"32\" type=\"text\">\n       \
    \         {{/if}}\n            </div>\n        {{/if}}\n    </div>\n</template>\n\
    ```\n\nSo, we see our first `if`, which is conditioned on whether we're displaying\
    \ any list items. If we are, this means that we have selected a list, or that\
    \ we are in the `list_selected` mode. Keeping track of this is the Blaze rendering\
    \ engine's job, so `Template.list.list_selected` is found inside `LendLib.js`.\n\
    \nWe then create a plus sign using the Bootstrap `glyphicon-plus` class.\n\nNext\
    \ is our nested (second) `if`. This `if` is checking to see whether we are making\
    \ additions to the list of items. If we are, we are in the `list_adding` mode,\
    \ so we'll display a textbox in the form of an `<input>` element. If not, we'll\
    \ just leave the plus sign all by its lonesome.\n\nFinally, we end our nested\
    \ `{{/if}}`, our `</div>`, our parent `{{/if}}`, our `</ul>`, and our `</template>`.\n\
    \n## Gluing it all together\n\nIn an MVC or MV* model, the controller (in this\
    \ case, the Blaze rendering engine) is sometimes called the **glue**. That's because\
    \ it \"glues\" together all the view items, such as buttons or textboxes, to the\
    \ model. Blaze does this reactively, using reactive contexts and reactive computations,\
    \ vastly simplifying the \"gluing\" process for you, the developer.\n\nPretty\
    \ fancy explanation, eh? Well, you try to come up with a better explanation for\
    \ what it does. It really does fill in the cracks and keeps the model and the\
    \ view together. Someone else invented the term, not us; so, let's continue without\
    \ the Judgy McJudgerson viewpoint, mmmkay?\n\nIn this section, we'll go through\
    \ all the changes that need to happen inside `~/Documents/Meteor/LendLib/LendLib.js`\
    \ step by step in order to glue the template and the data model together.\n\n\
    ### Displaying items\n\nIn our data collection that we created in *Chapter 2,\
    \ Reactive Programming...It's Alive!*, we added some sample `items` when we created\
    \ a couple of `lists`. We did so, if you recall, using the browser console, as\
    \ follows:\n\n```\n> lists.insert({Category:\"DVDs\", items: [{Name:\"Mission\
    \ Impossible\",Owner:\"me\",LentTo:\"Alice\"}]});\n```\n\nYou'll notice that we\
    \ have a hierarchy here. Every `list` in the `lists` collection has an `items`\
    \ object, which is an array:\n\n```\nItems: [...]\n```"
  mdcn: "\n ## 模板\n\n到目前为止，我们只是初步了解了模板，现在准备深入使用响应式编程来创建一个可运行的应用。本章将带我们深入了解模板系统，并展示如何实现显示逻辑以及处理数据流。\n\
    \n在本章中，你将完成以下任务：\n\n- 完成借阅图书馆（Lending Library）的核心功能\n- 创建多个模板及模板逻辑\n- 在数据模型中添加、删除和更新条目\n\
    - 见证响应式编程的实际效果，并将其应用到你的应用中\n\n## 一个新的 HTML 模板\n\n我们已经通过使用 `categories` 模板创建了分类。现在，我们想在此基础上更进一步，显示我们可能想让人们（除了\
    \ **STEVE** 之外！）借阅的实际物品，这样当我们点击某个分类时，就能看到一个物品列表。\n\n让我们使用这个术语。我们需要一个地方来显示列表。因此，我们稍微修改一下\
    \ ~/Documents/Meteor/LendLib/ 目录下的 LendLib.html 文件，在顶部添加以下内容：\n\n```\n<body>\n\
    \    <div id=\"lendlib\" class=\"container\">\n        <div id=\"categories-container\"\
    \ class=\"container\">\n            {{> categories}}\n        </div>\n       \
    \ <div id=\"list\">\n            {{> list}}\n        </div>\n    </div>\n</body>\n\
    ```\n\n```\n</div>\n</div>\n</body>\n```\n\n通过添加这段代码，我们做了两件事：\n\n1. 我们将 `id=\"\
    categories-container\"` 的 div 元素包裹在一个名为 `lendlib` 的 `div` 元素内部，并将 `class=\"container\"\
    ` 移动到了这个新的 `div` 元素上。这是出于样式考虑，以便我们的列表大致能与 `categories` 模板对齐。\n\n2. 我们在其下方添加了一个\
    \ `id=\"list\"` 的 `div` 元素，并调用了一个新的模板：`{{> list}}`。这是我们用于物品列表的模板/占位符，稍后我们将在后续章节中看到它。\n\
    \n就这样。我们在文档中创建了一个易于维护的结构，具有明确的边界。我们知道分类将放在哪里，也知道物品列表将放在哪里。\n\n现在，让我们看看 `list`\
    \ 模板本身。虽然不是那么简单，但也并不难。在 `LendLib.html` 的末尾，在我们 `categories` 模板的闭合 `</template>`\
    \ 标签下方，放置以下代码：\n\n```\n<template name=\"list\">\n  <div id=\"lending_list\" class=\"\
    list-group\">\n    {{#each items}}\n      <div class=\"lending_item list-group-item\"\
    >\n        <button type=\"button\"\n          class=\"close delete_item\" id=\"\
    {{Name}}\">×</button>\n        {{Name}}\n        {{#if lendee_editing}}\n    \
    \      <input type=\"text\" id=\"edit_lendee\"\n          class=\"span-2\" value=\"\
    \"/>\n        {{else}}\n          <div class=\"lendee label {{LendClass}}\">\n\
