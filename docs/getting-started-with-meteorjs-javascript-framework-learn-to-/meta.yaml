  md: '# 5

    Data – Meteor Style!


    We''ve nearly completed the **Lending Library** application, without having to
    worry much about how our data is being stored. Meteor''s data caching and synching
    methodology is intentionally built to make that part of building the application
    as simple as possible so that, instead of spending a lot of time messing around
    with database connections, queries, and caching, you can concentrate on writing
    a great program.


    However, we do want to go over the methodology, and we''ll have to make sure we
    have a solid understanding of how Meteor handles data so that we can perform some
    common optimizations and build our applications even more quickly.


    In this chapter, you will learn about the following topics:


    +   - MongoDB and document-oriented storage

    - Broadcasting changes—how Meteor makes your web application reactive

    - Configuring publishers—how to streamline and protect your data


    # Document-oriented storage


    Meteor uses MongoDB on the server side, and a version of MongoDB, **Minimongo**,
    on the client side. It''s capable of using any other NoSQL/document-oriented database,
    but MongoDB comes by default with the Meteor installation. This feature makes
    your programs much simpler and easier to write and works really well for quick,
    lightweight data storage.'
  merge: -1
  pgno: 83
- img_proc: true
  md: "# Data – Meteor Style!\n\n# Why not use a relational database?\n\nTraditionally,\
    \ most data is stored using a relational model. The relational model, with all\
    \ of its associated rules, relations, logic, and syntax, is an integral and invaluable\
    \ part of modern computing. The rigid structure of a relational database, with\
    \ exact requirements for each record, relation, and association, provides us with\
    \ quick searches, scalability, and the potential for deep analytics.\n\nThis type\
    \ of exactness, however, isn't always necessary. In the case of our Lending Library\
    \ app, for example, a full-fledged relational database would be overkill. In fact,\
    \ in some cases, it's more effective to have a flexible data storage system—one\
    \ that you can extend quickly and without significant recoding.\n\nFor example,\
    \ if you wanted to add a new property to your `list` object, it would be much\
    \ simpler to just add the new property and let the database worry about it rather\
    \ than having to refactor your database code, add a new column, update all of\
    \ your SQL statements and triggers, and make sure that all previous records have\
    \ the new property.\n\nThis is where document-oriented storage comes into play.\
    \ In a document-oriented storage system, your data store is made up of a bunch\
    \ of key-value-paired documents. So, what's the structure of that document? The\
    \ data store doesn't really care. It could contain pretty much anything as long\
    \ as each record has a unique key so that it can be retrieved.\n\nSo, in one document\
    \ entry, you could have a very simple document—maybe a key-value pair:\n\n```\n\
    {name:phone_number}\n```\n\nAnd then, in another document entry (in the same data\
    \ store), you could have a complex object with nested arrays, nested objects,\
    \ and so on:\n\n```\n{ people: [\n  {firstname:\"STEVE\", lastname:\"Scuba\",\
    \ phones :[\n    {type:cell, number:8888675309},\n    {type:home, number:8005322002}]\n\
    \  },\n  {firstname:...\n    ...\n  }]\n}\n```\n\nHeck, it could be the unabridged\
    \ works of William Shakespeare. It doesn't really matter. As long as the data\
    \ store can take the document and assign a unique key to it, it can be stored."
  merge: -1
  pgno: 84
- img_proc: true
  md: 'As you may have guessed, the lack of structure *can* make querying, sorting,
    and manipulating documents less efficient. But that''s okay because our primary
    concern is with ease of coding and development speed, not efficiency.


    In addition, since our application only has a few core functions, we can quickly
    identify what queries we''ll be using most often and optimize our document schema
    around that. This makes a document-oriented database actually perform *better*
    in some cases than a traditional relational database.


    > There are some pretty sophisticated document-oriented storage solutions out
    there that some would argue are as efficient as, or more efficient than, a standard
    relational database; but that discussion is beyond the scope of this book.


    Given the flexible nature of a document-oriented storage system, it is perfect
    for making quick changes, and the foundation libraries that Meteor provides make
    it so that we don''t have to worry about the connection or the structure. All
    we have to do is have a high-level understanding of how to retrieve, add, and
    modify the documents, and we can leave the rest to Meteor.


    # MongoDB


    MongoDB—a play on the word "humongous"—is an open source NoSQL (Not Only SQL)
    database. It provides sophisticated features such as indexing, linking, atomic
    operations, and so on, but at its heart it is a document-oriented storage solution.


    > To learn more about MongoDB, visit its official site at http://www.mongodb.org.


    Using simple commands, we can see what records (what documents) are available,
    convert the records into JavaScript objects, and then save the changed objects.
    Think of MongoDB records in the same way you would think about an actual text
    document:


    +   1. Locate the document and open it for editing: (Meteor equivalent: `lists.find()`).

    2. Make changes to the document (Meteor equivalent: `lists.update({})`).

    3. Save the document (automatically done with the `.update()` function).


    It''s not as simple as that, and there''s a lot of syntax that you''ll need to
    learn if you want to consider yourself proficient in MongoDB, but you can clearly
    see the simple, clean document-oriented approach: find/create a record, make changes,
    and save/update the record to the data store.'
  merge: -1
  pgno: 85
