  md: '# Why Meteor Rocks!


    This will update the `lists` data collection. The template will see this change
    and update the HTML code/placeholder. Each of the placeholders will run one additional
    time for the new entry in `lists`, and you''ll see the following screen:


    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_56_0.png)


    When the `lists` collection was updated, the `Template.categories.lists` helper
    detected the change and reran itself (recomputed). This changed the contents of
    the code meant to be displayed in the `{{> categories}}` placeholder. Since the
    contents were changed, the affected part of the template was re-run.


    Now, take a minute here and think about how little we had to do to get this reactive
    computation to run: we simply created a template, instructing Blaze how we want
    the `lists` data collection to be displayed, and we put in a placeholder. This
    is simple, declarative programming at its finest!


