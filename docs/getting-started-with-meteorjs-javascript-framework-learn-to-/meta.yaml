- md: " ## Reactive Programming...It's Alive!\n\nThis code will find every record\
    \ in the `lists` collection and will sort the results by the `Category` (name).\
    \ Save these changes, and you will now see a populated list of categories:\n\n\
    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_38_0.png)\n\n## Cleaning up\n\nWe're\
    \ fast approaching a working application, and we want it to look super-shiny and\
    \ clean. Let's do a bit of clean up in our code and add some CSS to make things\
    \ more readable. To do this, perform the following steps:\n\n1. We don't need\
    \ the greeting anymore. So, let's get rid of it. To do this, remove the following\
    \ lines from `LendLib.html` and save the page:\n\n```\n<body>\n  <h1>Lending Library</h1>\n\
    \  {{> hello}}\n  <div id=\"categories-container\" class=\"container\">\n    {{>\
    \ categories}}\n  </div>\n</body>\n\n<template name=\"hello\">\n  <h2>My Library</h2>\n\
    \  <button>Click Me</button>\n  <p>You've pressed the button {{counter}} times.</p>\n\
    </template>\n```\n\n2. We'll keep the `Template.hello` declarations in `LendLib.js`\
    \ for now, as a reference. We'll comment them out for now and remove them later\
    \ when they're no longer needed:\n\n```\n/* Template.hello.helpers({\n   ...\n\
    ```\n\n```\n});\n```\n\n```\nTemplate.hello.events({\n```\n\n```\n...\n```\n\n\
    ```\n});\n```\n\n```\n*/\n```\n\n3. Now, let's add the Twitter Bootstrap framework,\
    \ which gives us a lot of style without much effort. Using a terminal window,\
    \ create a `client` folder in `/LendLib/`:\n\n```\n$ mkdir ~/Documents/Meteor/LendLib/client\n\
    ```\n\n> Download the latest Bootstrap framework at `http://getbootstrap.com/getting-started/`\
    \ and extract the archive into the `client` folder under `~/Documents/Meteor/LendLib/`.\n\
    \nSince Meteor will read and use every file put into the application folder, we\
    \ want to eliminate the redundant files. We don't have to worry too much about\
    \ efficiency, but some things are just shameful and leaving that much extraneous\
    \ code lying around is right up there with enjoying deep-fried carnival food.\n\
    \nSo, let's perform the following set of steps:\n\n1. Navigate to the Bootstrap\
    \ folder (the name will vary) using the following command:\n\n```\n$ cd ~/Documents/Meteor/LendLib/client/[bootstrap]/\n\
    ```\n\n2. Once you've entered the folder, delete the unneeded files:\n\n```\n\
    $ rm css/bootstrap-theme.c*\n\n$ rm css/bootstrap.c*\n\n$ rm js/npm.js\n\n$ rm\
    \ js/bootstrap.js\n```\n\n> If you know what you're doing with Bootstrap, you\
    \ can just copy the `fonts`, `min.js`, and `min.css` files instead of performing\
    \ the preceding instructions.\n\n## *Reactive Programming...It's Alive!*\n\nAfter\
    \ all these changes, your UI should be really clean and simple:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_40_0.png)\n\
    \nLet's quickly make the UI more distinct and readable. To do this, we must perform\
    \ the following set of steps:\n\n1. In `LendLib.html`, let's change our header\
    \ from a `<div>` tag to an `<h2>` tag, and change the text from **categories**\
    \ to **my stuff**:\n\n```\n<template name=\"categories\">\n<h2 class=\"title\"\
    >my stuff</h2>\n```\n\n2. Let's turn categories into a pretty button group:\n\n\
    ```\n<div id=\"categories\" class=\"btn-group\">\n    {{#each lists}}\n      <div\
    \ class=\"category btn btn-primary\">\n            {{Category}}\n      </div>\n\
    \    {{/each}}\n```\n\nThis gives us a distinct, clean-looking page:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_40_1.png)\n\
    \n## Creating a reaction\n\nFollowing the creation of our basic template and collection,\
    \ and with Meteor putting our `lists` collection into the reactive context, we\
    \ can now proceed to watch the reactive programming model in action.\n\nNavigate\
    \ to our Lending Library page at `http://localhost:3000/` and open the browser\
    \ console window.\n\nIn the console, enter the following command:\n\n```\n> lists.insert({Category:\"\
    Fraggles\"});\n```\n\nYou will instantly see the page update. Note that, this\
    \ time, the full page didn't refresh! This is because, under the hood, Meteor\
    \ is tracking changes to our reactive context (in this case, the `lists` collection)\
    \ and the template is being updated immediately after a change is made.\n\nLet's\
    \ make a few more changes. To do this, enter the same `Fraggles` command again:\n\
    \n```\n> lists.insert({Category:\"Fraggles\"});\n```\n\nJust as before, a new\
    \ **Fraggles** button will instantly appear:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_41_0.png)\n\
    \nBut we have too many `Fraggles` categories now. There *are* a lot of Fraggles,\
    \ but unless you're some weirdo collector, you don't need *two* categories. So,\
    \ let's remove them. However, we can't just erase whatever we want on the client\
    \ side. This is a basic safety feature, and if we just let it happen, things could\
    \ get quite chaotic. For instance, if we tried to just remove the record using\
    \ the following command:\n\n```\n> lists.remove({Category:\"Fraggles\"});\n```\n\
    \n...then that's quite a no-no. Meteor detects stuff like this and will give us\
    \ a 403 error as follows:\n\n```\n> lists.remove({Category:\"Fraggles\"});\n✖\
    \ ▶ Uncaught\n  ▶ Meteor.makeErrorType.errorClass {error: 403, reason: \"Not permitted.\
    \ Untrusted code may only remove documents by ID.\", details: undefined, message:\
    \ \"Not permitted. Untrusted code may only remove documents by ID. [403]\", errorType:\
    \ \"Meteor.Error\"…}\n```\n\nThere are three ways in which we can manually delete\
    \ or modify records.\n\n- The first is on the client side, by finding the ID of\
    \ the record. In your browser console, run the following command:\n\n  ```\n \
    \ > lists.findOne({Category:\"Fraggles\"});\n  ```\n\n  This will return a single\
    \ record, including an `_id` property, similar to the following screenshot:\n\n\
    \  ```\n  > lists.findOne({Category:\"Fraggles\"});\n  < Object {_id: \"Jz68JR4gBbiBcbLPt\"\
    , Category: \"Fraggles\"}\n  ```\n\n  If we take this `_id` and execute `lists.remove()`,\
    \ the extra Fraggles category will be removed:\n\n  ```\n  > lists.remove({_id:\"\
    Jz68JR4gBbiBcbLPt\"});\n  ```\n\n- The second way is to use `meteor shell`. In\
    \ a new terminal window (keep your app running!), navigate to ~/Documents/Meteor/LendLib/\
    \ and enter the following command:\n\n  ```\n  $ meteor shell\n  ```\n\n  This\
    \ will open a console that is directly connected to the server so that we can\
    \ run commands as if they were server code; for example:\n\n  ```\n  > lists.remove({Category:\"\
    Fraggles\"});\n  ```\n\n  This will remove all categories that are named Fraggles.\
    \ The `meteor shell` command comes in handy when we need to run tests or debug,\
    \ so keep this command in your pocket to use when you need it.\n\n- The final\
    \ way to delete records is how we did it in the previous chapter, with `meteor\
    \ reset`. In fact, let's do that right now. Stop your application from running\
    \ (Ctrl + C) and execute the following command in the terminal:\n\n  ```\n  $\
    \ meteor reset\n  ```\n\nStart Meteor again with the `meteor` command, and your\
    \ application screen should be nice and clean:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_43_0.png)\n\
    \nIt would probably be good to have a couple of categories, so let's create them\
    \ really quickly. In the browser console, enter the following commands:\n\n```\n\
    > lists.insert({Category:\"Collectibles\"});\n> lists.insert({Category:\"DVDs\"\
    });\n> lists.insert({Category:\"Tools\"});\n```\n\nAs you can see, the changes\
    \ are made instantly, with no page refresh.\n\n## Multiple clients\n\nGood things\
    \ should be shared. Meteor gets this, and as we're about to see for ourselves,\
