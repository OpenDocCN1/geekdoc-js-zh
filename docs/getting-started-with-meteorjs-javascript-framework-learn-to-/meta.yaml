    \ under `~/Documents/Meteor/LendLib/`, and we can see some `Template` functions:\n\
    \n   ```\n   Template.hello.helpers({ ...\n   \n   ...\n   \n   Template.hello.events({\
    \ ...\n   ```\n   \n   These code chunks hook up JavaScript functions and objects\
    \ to the HTML `hello` template. Meteor's built-in `Template` object makes this\
