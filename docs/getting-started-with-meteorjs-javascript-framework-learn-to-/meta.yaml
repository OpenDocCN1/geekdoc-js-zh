    # 2


    Reactive Programming…

    It''s Alive!


    As we learned in *Chapter 1, Setup and Installation*, Meteor operates on a reactive
    programming model. This means that your templates aren''t only concerned with
    displaying data, but they are also listening for changes to that data so that
    they can "react" to those changes. These areas of data where the templates look
    for changes are called **reactive contexts**.


    We will now start developing a Lending Library application, lay the framework
    for future chapters, and use Meteor''s built-in reactive model to track and propagate
    changes to our application to all clients that are listening.


    In this chapter, you will learn about:


    +   - Creating your first real application

    - Using reactive programming to track and automatically update changes

    - Exploring and testing changes made to your data from multiple browser windows


    # Creating the Lending Library


    There are two kinds of people in this world — those who remember who they lent
    something to and those who buy a *lot* of stuff twice. If you''re one of the people
    who is on a first-name basis with your UPS delivery driver, this application is
    for you!


    Using Meteor, we''re going to build a Lending Library. We''ll keep track of all
    our stuff and who we lent it to, so that the next time we can''t remember where
    we put our linear compression wrench, we can simply look up who we lent it to
    last and get it back from them.'
