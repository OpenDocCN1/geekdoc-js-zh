  - '[PAGE 85]


    As you may have guessed, the lack of structure *can* make querying, sorting, and
    manipulating documents less efficient. But that''s okay because our primary concern
    is with ease of coding and development speed, not efficiency.


    In addition, since our application only has a few core functions, we can quickly
    identify what queries we''ll be using most often and optimize our document schema
    around that. This makes a document-oriented database actually perform *better*
    in some cases than a traditional relational database.


    > There are some pretty sophisticated document-oriented storage solutions out
    there that some would argue are as efficient as, or more efficient than, a standard
    relational database; but that discussion is beyond the scope of this book.


    Given the flexible nature of a document-oriented storage system, it is perfect
    for making quick changes, and the foundation libraries that Meteor provides make
    it so that we don''t have to worry about the connection or the structure. All
    we have to do is have a high-level understanding of how to retrieve, add, and
    modify the documents, and we can leave the rest to Meteor.


    # MongoDB


    MongoDB—a play on the word "humongous"—is an open source NoSQL (Not Only SQL)
    database. It provides sophisticated features such as indexing, linking, atomic
    operations, and so on, but at its heart it is a document-oriented storage solution.


    > To learn more about MongoDB, visit its official site at http://www.mongodb.org.


    Using simple commands, we can see what records (what documents) are available,
    convert the records into JavaScript objects, and then save the changed objects.
    Think of MongoDB records in the same way you would think about an actual text
    document:


    +   1. Locate the document and open it for editing: (Meteor equivalent: `lists.find()`).

    2. Make changes to the document (Meteor equivalent: `lists.update({})`).

    3. Save the document (automatically done with the `.update()` function).


    It''s not as simple as that, and there''s a lot of syntax that you''ll need to
    learn if you want to consider yourself proficient in MongoDB, but you can clearly
    see the simple, clean document-oriented approach: find/create a record, make changes,
    and save/update the record to the data store.'
