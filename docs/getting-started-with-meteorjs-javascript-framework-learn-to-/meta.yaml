  md: "We need to discuss one final concept to help you better understand how MongoDB\
    \ works. MongoDB is called a database, but it's easier to conceptualize as a collection\
    \ of documents. The collection is indexed and quickly accessible, but it's still\
    \ a collection rather than a group of relational tables/entities. In just the\
    \ same way you'd think about a folder on your hard drive where you keep all of\
    \ your text documents, think about MongoDB as a collection of documents, all of\
    \ which are accessible and can be opened, changed, and saved.\n\n# Using direct\
    \ commands\n\nTo gain a better understanding of how MongoDB works, let's have\
    \ some fun in the command line. Perform the following set of steps:\n\n+   1.\
