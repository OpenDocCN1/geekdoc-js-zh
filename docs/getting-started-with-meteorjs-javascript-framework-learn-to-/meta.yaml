    Meteor script from anywhere else. This will become important in a minute. For
    now, let''s see what kind of friendly message we get when the Meteor installation
    is finished:


    To get started fast:


    ```

    $ meteor create ~/my_cool_app

    $ cd ~/my_cool_app

    $ meteor

    ```


    Or see the docs at:


    ```

    docs.meteor.com

    ```


    Great! You''ve successfully installed Meteor, and you''re on your way to create
    your first Meteor web application!


    > You should bookmark http://docs.meteor.com, an invaluable reference moving forward.


    # Loading an example application


    The wonderful people at Meteor have included several example applications, which
    you can quickly create and play with; these help you to get a better idea of what
    Meteor is capable of.


    We want to use the simplest possible example, just to get an idea of how Meteor
    works, so we will be creating the leaderboard example. We''ll be using the command
    line again. This is awesome news if you still have it open! If not, open a terminal
    window and follow these steps.'
  - "[PAGE 20]\n\n# Selecting your file's location\n\nSo that we can remember where\
    \ they are later, we'll put all the files for this book in the ~/Documents/Meteor\
    \ folder. We will create this folder as follows:\n\n```\n$ mkdir ~/Documents/Meteor\n\
    ```\n\nNow, we need to get to that directory. Use the following command:\n\n```\n\
    $ cd ~/Documents/Meteor\n```\n\n# Loading the example application\n\nWe can now\
    \ use the Meteor `create` command with the `--example` parameter to create a local\
    \ copy of the `leaderboard` example application:\n\n```\n$ meteor create --example\
    \ leaderboard\n```\n\nAs with the Meteor installation itself, the `create` command\
    \ script has a friendly success message:\n\n```\nleaderboard: created.\nTo run\
    \ your new app:\n  cd leaderboard\n  meteor\n```\n\nThere are even instructions\
    \ on what to do next. How handy! Let's go ahead and do what our good command-line\
    \ friend is telling us.\n\n# Starting the example application\n\nTo start up a\
    \ Meteor application, we need to be in the application directory itself. This\
    \ is because Meteor looks for the startup files, HTML, and JavaScript that are\
    \ needed to run the application. These are all found in the application folder,\
    \ so let's go there:\n\n```\n$ cd leaderboard\n```\n\nThis puts us in the ~/Documents/Meteor/leaderboard\
    \ folder, and we're ready to run the application:\n\n```\n$ meteor\n```"
