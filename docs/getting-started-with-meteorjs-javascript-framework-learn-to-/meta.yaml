    # 7

    Packaging and Deploying


    Our application is looking great. We''ve made it secure, easy to use, and with
    the addition of multiple logins, anybody can now use the Lending Library to keep
    track of their stuff.


    In this final chapter, we''ll go over Meteor''s amazing package system, which
    will speed up future code projects, and we''ll talk about the options for deploying
    your applications. You will learn how to:


    +   - Add and configure third-party packages such as JQueryUI, Backbone, and Bootstrap

    - Bundle your entire application so that it can be deployed

    - Deploy your app using Meteor''s public servers

    - Deploy your app to a custom server


    # Third-party packages


    Through a thriving, growing community, Meteor is rapidly gaining packages for
    all major JavaScript and Preprocessing libraries. These packages are intelligent
    in that they contain the base JavaScript or Preprocessing libraries, but they
    are also configured to interact directly with the Meteor code base.


    What this means for you is that adding your favorite library involves almost no
    effort, and you can be confident that it will work with your Meteor application.'
  - '[PAGE 120]


    # Packaging and Deploying


    # Finding the available packages


    The best way to find new packages is through a web interface called Atmosphere.
    If you navigate to `https://atmospherejs.com`, you will be prompted with a search
    box:


    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_120_0.png)


    Type in the names of some popular frameworks (such as `bootstrap`, `iron router`,
    `react`, and so on) and the chances are that you will be able to see multiple
    libraries to choose from. You can explore the most popular or most used packages
    as well by scrolling down on the home page:


    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_120_1.png)


    The **Trending**, **Recent**, **Most Used**, and **Top Searches** divisions as
    seen on the home page'
  - '[PAGE 121]


    As you can see, quite a few of the most popular frameworks are available, including
    Polymer, Angular, underscore, and... Twitter''s Bootstrap! We spent a good amount
    of time manually downloading Bootstrap, creating the `client` folder, and extracting
    the Bootstrap files. That was a good exercise in how to manually install a framework,
    but now, we''re going to learn how to install it as a package.


    First, let''s remove the existing Bootstrap installation. To do this, navigate
    to `~/Documents/Meteor/LendLib/client/` and delete the `bootstrap` directory.
    It doesn''t matter whether or not your Meteor app is running (remember, Meteor
    updates dynamically!). After removing the `bootstrap` directory, either start
    your app and then navigate to `http://localhost:3000`, or just navigate there
    if your app is already running. You will see that all of our pretty formatting
    is gone!


    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_121_0.png)


    We''ll now add the official Meteor bootstrap package. Again, because Meteor updates
    dynamically, so we don''t have to stop the Meteor app unless we want to. Either
    open a new terminal window or temporarily stop your Meteor application, and make
    sure that you are in the `LendLib` folder under `~/Documents/Meteor/`. Once there,
    enter the following command:


    ```

    $ meteor add twbs:bootstrap

    ```'
  - '[PAGE 122]


    # Packaging and Deploying


    You will receive a very short message, as follows:


    ```

    Changes to your project''s package version selections:


    tws:bootstrap  added, version 3.3.2


    tws:bootstrap: Bootstrap (official): the most popular HTML/CSS/JS framework for
    responsive, mobile first projects

    ```


    If you used a second terminal window, just head to your browser (you don''t even

    have to refresh the page). If you stopped your Meteor application, start it up
    again

    and navigate to `http://localhost:3000`. You will be able to see that the Bootstrap

    formatting is now back, and everything is back to normal:


    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_122_0.png)


    This is literally all there is to it. By using a single command in your terminal,
    you can

    add a library or framework to your project without having to worry about linking,

    downloading, making sure that the files are in the right location, and so on.
    Just run

    `meteor add` and off you go!


    > You can get a list of the packages that you''re already using

    by entering the following command in the terminal:

    `meteor list`


    Since the Meteor community is adding packages so rapidly, it''s a good idea to

    stay current with your Meteor installation. From time to time, run the following

    command in the terminal:


    ```

    $ meteor update

    ```'
  - '[PAGE 123]


    If you''re on the latest version, it will tell you so, and what version you''re
    running.

    If there''s a new version, it will download and install it for you and update
    any packages as well.


    # Bundling your application


    In usual Meteor fashion, bundling your application so that it can be deployed
    is incredibly simple. Stop your Meteor application if it''s running, make sure
    you are in your application folder (for the Lending Library, this is `LendLib`
    folder under `~/Documents/Meteor/`), and enter the following command in the terminal:


    ```

    $ meteor bundle ~/Documents/Meteor/builds/

    ```


    This will take a little bit to run, but when it''s finished, you''ll have a `LendLib.tar.tgz`
    tarball in the `builds/` folder, and you''ll be ready to deploy it wherever you
    like. This is a complete Node package/bundle. The machine to which you deploy
    this bundle only needs to have **Node.js** and **MongoDB** installed on it. Everything
    else that you need is included in the bundle.


    # Deploying your application to Meteor''s servers


    The folks at Meteor have taken deployment one step further - above and beyond
    what you''d expect from even a paid product, much less a free one. Meteor allows
    you to deploy your application directly on their deployment servers. Pick a name
    for your app (we''ll use `packt.lendlib`, but you''ll need to come up with your
    own) and enter the following command in the terminal:


    ```

    $ meteor deploy [your app name].meteor.com

    ```


    So, in our case, we entered `meteor deploy packt.lendlib.meteor.com`. The console
    will give you status updates as it bundles, uploads, and deploys your application.
    Once it''s finished, it will give you a message similar to this:


    ```

    Now serving at [your app name].meteor.com

    ```'
- md: " ## Packaging and Deploying\n\nIf you navigate to that URL in your browser\
    \ (for example `http://packt.lendlib.meteor.com`), you will see that your application\
    \ has been deployed and is running!\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_124_0.png)\n\
    \n> You will probably want to create the admin login before you start using the\
    \ application, or to tell others about it. You don't want sneaky STEVE to have\
    \ control of your app!\n\n## Updating Meteor's servers\n\nWhat if you make changes,\
    \ or you had a bug, and you want to update the code for your app on Meteor's servers?\
    \ As you probably guessed, this is super simple. Just re-run your deploy command:\n\
    \n```\n$ meteor deploy [your app name].meteor.com\n```\n\nThis not only updates\
    \ your app, but it preserves your data as well so that you don't have to start\
    \ from scratch if you've entered a lot of information already. Pretty slick, right?\
    \ The people at Meteor really know what makes developing enjoyable, and they've\
    \ gone out of their way to provide an environment where you can just code, play,\
    \ and receive instant feedback on your application.\n\n## Using your own hostname\n\
    \nBut wait, there's more! You can even use one of your own hostnames with an app\
    \ that you deploy on Meteor's servers. Set up a CNAME pointing to `origin.meteor.com`\
    \ using your host provider, and you can then deploy your app to that hostname.\
    \ For example, if we had the `meteor.tool1.com` subdomain pointing as a CNAME\
    \ to `origin.meteor.com`, we would run the following command in the terminal:\n\
    \n```\n$ meteor deploy meteor.tool1.com\n```\n\nIf your CNAME is set up properly,\
    \ the app will deploy just as it would if you were to deploy directly to `[your\
    \ app name].meteor.com` and will be available with your customized hostname!\n\
    \n> Check with your host provider about setting up a CNAME route. It varies from\
    \ provider to provider, but it's pretty easy to do.\n\n## Deploying your application\
    \ to a custom server\n\nAt the time of writing, deploying a Meteor application\
    \ to either a hosting service or to your own personal machine is a pretty hefty\
    \ task. There are versioning issues with deployment, and most hosting services\
    \ are still in the early stages of supporting Meteor bundles.\n\nThat being said,\
    \ Meteor is working on a really slick deployment service (nicknamed Galaxy), and\
    \ we have a pretty great third-party plugin available with us called Meteor Up\
    \ (MUP), which was developed by the incomparable Arunoda Susiripala at `http://meteorhacks.com`.\
    \ Let's walk you through deploying our Meteor application to a custom server using\
    \ MUP.\n\n## The server setup\n\nThe server from which you'll be hosting your\
    \ application needs to have the latest *stable* version of Node.\n\nTo Install\
    \ Node.js, go to `http://nodejs.org/` and follow the instructions for either Linux\
    \ or Mac OS X installation.\n\nMUP will install the correct MongoDB version that\
    \ we need on our remote server, so we don't need to worry about that, at least\
    \ not for testing purposes.\n\nAlternatively, you could set up MongoDB on a remote\
    \ server or use a hosting service such as MongoHQ (`https://www.mongohq.com`).\
    \ If you do use a remote service, set up a new database and note the URI that\
    \ you'll need. An example from MongoHQ is shown here:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_126_0.png)\n\
    \n## Installing and configuring MUP\n\nYou will need Meteor Up installed on your\
    \ client machine, and that's super easy to do, so let's make it happen!\n\nIn\
    \ a terminal window, execute the following command:\n\n```\n$ npm install -g mup\n\
    ```\n\nNote that you may need to use the `sudo` command, depending on your user\
    \ permission settings. The preceding command installs the MUP module globally,\
    \ so we can use it wherever we like. After the installation is finished, make\
    \ sure that your application is stopped and that you are in the root folder of\
    \ your project (`~/Documents/Meteor/LendLib`). We will now initialize MUP in our\
    \ project. In the terminal, execute the following command:\n\n```\n$ mup init\n\
    ```\n\nThis will generate a configuration file named `mup.json` in the root directory.\
    \ Go ahead and open the file. You will see the name of the server to which you'd\
    \ like to deploy your app at the top. You will also see a username / password\
    \ / pem properties section. These fields are necessary so that MUP can log into\
    \ your remote hosting server and configure it properly.\n\nYou will need to fill\
    \ in the fields with your SSH login information. If the address for your remote\
    \ server were `http://myserver.com`, you would enter the following code snippet:\n\
    \n```\n{\n    \"host\": \"myserver.com\",\n    \"username\": \"root\",\n    \"\
    password\": \"SUPERHARDTOGUESpassword\"\n    // or pem file (ssh based authentication)\n\
    \    //\"pem\": \"~/.ssh/id_rsa\"\n}\n```\n\nThe next section asks us whether\
    \ we want to set up MongoDB and Node. If your remote server is already running\
    \ these, there's no need to install them now; so, you can turn the values to `false`.\
    \ If you leave the values as `true`, it will re-install both Node and MongoDB.\
    \ It's up to you. Here, we will leave the values as true:\n\n```\n\"setupMongo\"\
    : true,\n\n\"setupNode\": true,\n\n\"nodeVersion\": \"0.10.33\",\n```\n\nPhantomJS\
    \ is also a necessary component. During the first deployment of the app, we will\
    \ leave the `setupPhantom` property set to `true` so that PhantomJS will be installed.\
    \ However, on subsequent deployments, it's entirely up to you. Here's how we used\
    \ it for the first run:\n\n```\n\"setupPhantom\": true,\n```\n\nSince the name\
    \ of our app is Lending Library, we will be changing the `appName` property to\
    \ the following:\n\n```\n\"appName\": \"LendLib\",\n```\n\nThe next property tells\
    \ MUP where to look on your client machine for the source files so that they can\
    \ be bundled and uploaded to your remote server. In our case, we would enter the\
    \ following line of code:\n\n```\n\"app\": \"~/Documents/Meteor/LendLib\",\n```\n\
    \n## Packaging and Deploying\n\nThe last property is the `env` property, which\
    \ specifies how to reach your app once it's deployed. Usually, the `env.ROOT_URL`\
    \ property will be set to the `localhost` address: `http://localhost`. We can\
    \ then specify a `PORT` property if we like. If our `ROOT_URL` is set to `http://myserver.com`\
    \ and the `PORT` property is set to `8080`, our declaration would look like this:\n\
    \n```\n\"env\": {\n  \"ROOT_URL\": \"http://myserver.com\",\n  \"PORT\": 8080\n\
    },\n```\n\n> If you want to deploy your app using port `80`, you must have root\
    \ privileges on the remote server, for security reasons.\n\n## Deploying your\
    \ app using MUP\n\nWith our `mup.json` file in place, it's time to initialize\
    \ our remote server and let it install the software as needed. In the terminal\
    \ window, enter the following command:\n\n```\n$ mup setup\n```\n\nThis will install\
    \ MongoDB, Node, and PhantomJS on the remote server. It will also configure our\
    \ remote server environment and install some helper NPM packages, such as `upstart`.\n\
    \nOnce the `mup setup` command completes, we will be ready to deploy your app.\
    \ Execute the following command in the terminal window:\n\n```\n$ mup deploy\n\
    ```\n\nMUP will bundle your app locally, upload the build, configure the requisite\
    \ NPM packages on the remote server, and then serve up your app. As it runs through\
    \ this process, MUP will give you status updates in the terminal.\n\nOnce the\
    \ app is deployed, we can navigate in a browser to your app's URL and check out\
    \ your brand new, fully deployed app, which will look similar to the following\
    \ screenshot:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_129_0.png)\n\nAs we\
    \ rushed through the basics of using MUP, there were several topics that we didn't\
    \ cover, including setting up a reverse-proxy, load balancing, and DNS entries.\
    \ We are making the assumption that if you want to deploy your app manually, you\
    \ have some prior experience with setting up your server environment properly.\n\
    \n> All MUP configuration settings and more detailed instructions for a MUP installation\
    \ can be found at `https://github.com/arunoda/meteor-up`.\n\nYou can go even further\
    \ with deployment, such as setting up environment variables, running your app\
    \ as a daemon/service, or even using remote servers to publicly host your application.\
    \ What we've done so far should be sufficient to get you started and be well on\
    \ your way to use Meteor in a production environment."
  mdcn: "\n ## 打包与部署\n\n如果你在浏览器中导航到该 URL（例如 `http://packt.lendlib.meteor.com`），你会看到你的应用已经部署并正在运行！\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_124_0.png)\n\n> 在开始使用应用或告诉其他人之前，你可能需要先创建管理员登录账号。你不会希望让狡猾的史蒂夫掌控你的应用吧！\n\
    \n## 更新 Meteor 的服务器\n\n如果你做了更改，或者出现了 bug，想要更新 Meteor 服务器上的应用代码，该怎么办呢？正如你可能已经猜到的，这超级简单。只需重新运行你的部署命令：\n\
    \n```\n$ meteor deploy [your app name].meteor.com\n```\n\n这不仅能更新你的应用，还能保留你的数据，这样即使你之前已经录入了大量信息，也无需从头开始。相当简洁吧？Meteor\
    \ 的开发者真的了解什么能让开发变得愉快，他们竭尽所能提供了一个让你只需编码、尝试，并即时获得应用反馈的环境。\n\n## 使用你自己的主机名\n\n等等，还有更多！你可以在\
    \ Meteor 服务器上部署应用时，使用你自己的主机名。通过你的主机提供商设置一个指向 `origin.meteor.com` 的 CNAME，然后你就可以将应用部署到该主机名。例如，如果我们的\
    \ `meteor.tool1.com` 子域作为 CNAME 指向 `origin.meteor.com`，我们将在终端中运行以下命令：\n\n```\n\
    $ meteor deploy meteor.tool1.com\n```\n\n如果你的 CNAME 设置正确，应用将会部署得就像你直接部署到 `[your\
    \ app name].meteor.com` 一样，并且可以通过你自定义的主机名访问！\n\n> 请向你主机提供商咨询如何设置 CNAME 路由。不同提供商的操作方式有所不同，但通常都很简单。\n\
    \n## 将应用部署到自定义服务器\n\n在撰写本文时，将 Meteor 应用部署到托管服务或你自己的个人机器上是一项相当繁重的任务。部署过程中存在版本控制问题，而且大多数托管服务对\
    \ Meteor 包的支持仍处于早期阶段。\n\n话虽如此，Meteor 正在开发一个真正简洁的部署服务（代号为 Galaxy），而且我们有一个非常棒的第三方插件\
    \ Meteor Up（MUP），由 `http://meteorhacks.com` 的了不起的 Arunoda Susiripala 开发。让我们指导你使用\
    \ MUP 将 Meteor 应用部署到自定义服务器。\n\n## 服务器设置\n\n用于托管应用的服务器需要安装最新*稳定*版本的 Node。\n\n要安装\
    \ Node.js，请访问 `http://nodejs.org/`，并按照 Linux 或 Mac OS X 的安装说明进行操作。\n\nMUP 会在我们的远程服务器上安装正确版本的\
    \ MongoDB，所以我们无需为此担心，至少测试用途上不需要。\n\n另外，你也可以在远程服务器上设置 MongoDB，或使用 MongoHQ（`https://www.mongohq.com`）等托管服务。如果使用远程服务，请设置一个新的数据库并记下你需要的\
    \ URI。以下是从 MongoHQ 获取的示例：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_126_0.png)\n\
    \n## 安装和配置 MUP\n\n你需要在客户端机器上安装 Meteor Up，这非常简单，让我们开始吧！\n\n在终端窗口中，执行以下命令：\n\n```\n\
    $ npm install -g mup\n```\n\n请注意，根据你的用户权限设置，你可能需要使用 `sudo` 命令。上述命令会全局安装 MUP 模块，这样我们可以在任何位置使用它。安装完成后，确保你的应用已停止，并且你处于项目的根文件夹中（`~/Documents/Meteor/LendLib`）。现在我们将在项目中初始化\
    \ MUP。在终端中，执行以下命令：\n\n```\n$ mup init\n```\n\n这将在根目录中生成一个名为 `mup.json` 的配置文件。继续并打开该文件。你会在顶部看到你要部署应用的服务器名称。你还会看到一个用户名\
    \ / 密码 / pem 属性部分。这些字段是必需的，以便 MUP 能够登录到你的远程托管服务器并正确配置它。\n\n你需要用 SSH 登录信息填写这些字段。如果你的远程服务器地址是\
    \ `http://myserver.com`，你会输入以下代码片段：\n\n```\n{\n    \"host\": \"myserver.com\"\
    ,\n    \"username\": \"root\",\n    \"password\": \"SUPERHARDTOGUESpassword\"\n\
    \    // or pem file (ssh based authentication)\n    //\"pem\": \"~/.ssh/id_rsa\"\
    \n}\n```\n\n下一部分询问我们是否要设置 MongoDB 和 Node。如果你的远程服务器已经在运行这些，现在无需安装；可以将值设置为 `false`。如果你保留值为\
    \ `true`，它会重新安装 Node 和 MongoDB。这取决于你。这里，我们将保留值为 true：\n\n```\n\"setupMongo\":\
    \ true,\n\n\"setupNode\": true,\n\n\"nodeVersion\": \"0.10.33\",\n```\n\nPhantomJS\
    \ 也是必需的组件。在应用的首次部署中，我们将保留 `setupPhantom` 属性设置为 `true`，以便安装 PhantomJS。然而，在后续部署中，这完全取决于你。以下是我们首次运行时的设置：\n\
    \n```\n\"setupPhantom\": true,\n```\n\n由于我们的应用名称是 Lending Library，我们将 `appName`\
    \ 属性更改为以下内容：\n\n```\n\"appName\": \"LendLib\",\n```\n\n下一个属性告诉 MUP 在你的客户端机器上查找源文件的位置，以便它们可以被打包并上传到你的远程服务器。在我们的例子中，我们会输入以下代码行：\n\
    \n```\n\"app\": \"~/Documents/Meteor/LendLib\",\n```\n\n## 打包与部署\n\n最后一个属性是 `env`\
    \ 属性，它指定部署后如何访问你的应用。通常，`env.ROOT_URL` 属性会设置为 `localhost` 地址：`http://localhost`。然后我们可以根据需要指定\
    \ `PORT` 属性。如果我们的 `ROOT_URL` 设置为 `http://myserver.com`，且 `PORT` 属性设置为 `8080`，我们的声明将如下所示：\n\
    \n```\n\"env\": {\n  \"ROOT_URL\": \"http://myserver.com\",\n  \"PORT\": 8080\n\
    },\n```\n\n> 如果你想使用端口 `80` 部署应用，出于安全原因，你必须拥有远程服务器的 root 权限。\n\n## 使用 MUP 部署你的应用\n\
    \n有了 `mup.json` 文件，现在是时候初始化我们的远程服务器，让它按需安装软件了。在终端窗口中，输入以下命令：\n\n```\n$ mup setup\n\
    ```\n\n这将在远程服务器上安装 MongoDB、Node 和 PhantomJS。它还会配置我们的远程服务器环境，并安装一些辅助的 NPM 包，例如\
    \ `upstart`。\n\n`mup setup` 命令完成后，我们将准备就绪部署你的应用。在终端窗口中执行以下命令：\n\n```\n$ mup deploy\n\
    ```\n\nMUP 会在本地打包你的应用，上传构建版本，在远程服务器上配置必需的 NPM 包，然后提供你的应用。在此过程中，MUP 会在终端中给你状态更新。\n\
    \n应用部署完成后，我们可以在浏览器中导航到你应用的 URL，查看你全新的、完全部署的应用，它将类似于以下截图：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_129_0.png)\n\
    \n由于我们快速浏览了使用 MUP 的基础知识，有几个主题没有涵盖，包括设置反向代理、负载均衡和 DNS 条目。我们假设如果你想手动部署应用，你有一定的服务器环境设置经验。\n\
    \n> 所有 MUP 配置设置和更详细的 MUP 安装说明可以在 `https://github.com/arunoda/meteor-up` 找到。\n\n\
    你还可以进一步深入部署，例如设置环境变量、将应用作为守护进程/服务运行，甚至使用远程服务器公开托管你的应用。到目前为止我们所做的应该足以让你入门，并顺利地在生产环境中使用\
    \ Meteor。\n"
