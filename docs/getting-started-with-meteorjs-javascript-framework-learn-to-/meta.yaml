  mdcn: "\n ## 为什么 Meteor 如此出色！\n\n换句话说，传统的单一服务器对应单一客户端的概念消失了。你可以将多个服务器连接在一起，每个服务器服务于特定的用途，或者让一个客户端连接多个服务器，与每个服务器进行不同的交互。想想有了这样的系统你能做什么：\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_50_0.png)\n\n想象多个系统共同协作，例如创建一个健康监控系统。有些系统用\
    \ C++ 构建，有些用 Arduino，有些用……好吧，我们并不关心。它们都使用 DDP 协议。它们通过网络发送和接收数据，并各自决定如何处理这些数据。突然间，非常困难复杂的问题变得容易解决多了。DDP\
    \ 几乎已经在所有主要编程语言中实现，让你能够真正自由地构建企业级应用。\n\n## 延迟补偿\n\nMeteor 采用了一种非常巧妙的技术，称为**迷你数据库**。迷你数据库是正常数据库的\"\
    轻量\"版本，驻留在客户端的内存中。客户端不再向服务器发送请求，而是可以直接在客户端的迷你数据库中进行更改。然后这个迷你数据库会自动与服务器同步（当然使用\
    \ DDP），服务器上有实际的数据库。\n\n开箱即用，Meteor 使用 MongoDB 和 Minimongo：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_51_0.png)\n\
    \n当客户端检测到更改时，它首先针对客户端的 **Minimongo** 实例执行该更改。然后客户端继续愉快地运行，让 Minimongo 的处理程序通过\
    \ DDP 与服务器通信。如果服务器接受更改，它会向所有连接的客户端发送\"已更改\"消息，包括发起更改的那个客户端。如果服务器拒绝更改，或者来自不同客户端的更新更改已经到达，客户端上的\
    \ Minimongo 实例会被修正，任何受影响的 UI 元素也会相应更新。\n\n所有这一切看起来似乎并不 groundbreaking，但关键在于——它全部是异步的，而且使用\
    \ DDP 完成。这意味着客户端不必等待服务器的响应。它可以立即根据 Minimongo 实例中的内容更新 UI。如果更改是非法的，或者服务器端有其他更改进来怎么办？这不是问题，因为客户端会在收到服务器消息时立即更新。\n\
    \n## 为什么 Meteor 如此出色！\n\n那么，如果你的网络连接很慢，或者连接暂时中断呢？在正常的客户端/服务器环境中，你无法进行任何更改，或者屏幕会在客户端等待服务器许可时刷新缓慢。然而，Meteor\
    \ 对此进行了补偿。由于更改会立即发送到 Minimongo，UI 会立即更新。所以，如果你的连接中断，也不会造成问题：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_52_0.png)\n\
    \n你所做的所有更改都会反映在 UI 中，基于 Minimongo 中的数据。当你的连接恢复时，所有排队的更改都会发送到服务器，服务器会将授权的更改发送给客户端。\n\
    \n基本上，Meteor 让客户端基于信任进行。如果有问题，来自服务器的数据会修复它，但大多数情况下，你所做的更改会被服务器立即批准并广播。\n\n用 Meteor\
    \ 编码这种行为非常容易（尽管如果你愿意，也可以让它更复杂、更受控）：\n\n```\nlists = new Mongo.Collection(\"lists\"\
    );\n```\n\n这一行代码声明了一个 `lists` 数据模型。客户端和服务器都会有它的一个版本，但它们对自己的版本处理方式不同。客户端会订阅服务器宣布的更改，并相应地更新其模型。服务器会发布更改，监听来自客户端的更改请求，并根据这些更改请求更新*它的*模型（它的主副本）。\n\
    \n哇，一行代码就能做到所有这些！当然，还有更多内容，但这超出了本章的范围，所以我们继续。\n\n> 要更好地理解 Meteor 的数据同步，请参阅 Meteor\
    \ 文档中的 Publish and subscribe 部分，网址为 http://docs.meteor.com/#/full/meteor_publish。\n\
    \n## 全栈响应性\n\n响应性是 Meteor 每个部分不可或缺的部分。在客户端，Meteor 有 Blaze 库，它使用 HTML 模板和 JavaScript\
    \ 助手来检测更改并在 UI 中渲染数据。每当有更改时，助手会重新运行自己，并根据模板中的结构适当地添加、删除和更改 UI 元素。这些自动重新运行的函数被称为**响应式计算**。\n\
    \n在客户端和服务器端，Meteor 也提供了无需使用 UI 的响应式计算。这就是 **Tracker** 库，这些助手也能检测任何数据更改并相应地重新运行自己。由于客户端和服务器都基于\
    \ JavaScript，你可以在任何地方使用 Tracker 库。这被称为同构或**全栈响应性**，因为你在客户端和服务器端使用相同的语言（在某些情况下甚至是相同的代码！）。\n\
    \n在数据更改时重新运行函数对程序员来说有一个非常惊人的好处：你可以用声明式的方式编写代码，而 Meteor 会自动处理响应式部分。只需告诉 Meteor\
    \ 你希望数据如何显示，Meteor 就会管理所有数据更改。这种声明式风格通常通过**模板**来实现。\n\n模板通过**视图数据绑定**来施展魔法。不用太深入，视图数据绑定是一段共享数据，如果数据发生变化，它的显示方式也会不同。\n\
    \n让我们看一个非常简单的数据绑定——一个技术上不需要 Meteor 的例子——来说明这一点。让我们执行以下步骤来详细理解这个概念：\n\n- 1. 在 LendLib.html\
    \ 中，你会看到一个基于 HTML 的模板表达式：\n\n```\n<div id=\"categories-container\">\n    {{> categories}}\n\
    </div>\n```\n\n2. 这个表达式是位于其正下方的 HTML 模板的占位符：\n\n```\n<template name=\"categories\"\
    >\n    <h2 class=\"title\">my stuff</h2>..\n```\n\n## 扎格隆比耶·西亚基（硫磺坑）——自然与工业。\n\
    ***\n> **EPUB 档案**\n\n- learn meteor 还是 node.js：boilerplate？\n\n现在，在 `{{#each\
    \ lists}}` 表达式内部，还有一个 Spacebars 表达式：\n\n```\n{{Category}}\n```\n\n由于这个表达式位于 `#each`\
    \ 表达式内部，它被视为一个属性。也就是说，`{{Category}}` 等同于 `this.Category`，其中 `this` 是 for-each\
    \ 循环中的当前项。所以，这个占位符的意思是\"添加当前记录的 `Category` 属性的值。\"\n\n现在，如果我们查看 `LendLib.js`，我们会看到模板背后的响应值（称为**响应式上下文**）：\n\
    \n```\nlists : function () {\n    return lists.find(...\n```\n\n这里，Meteor 声明了一个名为\
    \ `lists` 的模板助手。这个 `lists` 助手位于 `categories` 的模板助手中。`lists` 助手是一个函数，返回我们之前定义的\
    \ `lists` 集合中的所有数据。还记得这一行吗？\n\n```\nlists = new Mongo.Collection(\"lists\");\n\
    ```\n\n这个 `lists` 集合由上述助手返回。当 `lists` 集合发生更改时，助手会更新，模板的占位符也会更改。\n\n让我们看看实际效果。在指向\
    \ `http://localhost:3000` 的网页上，打开浏览器控制台并输入以下行：\n\n```\n> lists.insert({Category:\"\
    Games\"});\n```\n\n## 为什么 Meteor 如此出色！\n\n这会更新 `lists` 数据集合。模板会检测到这个更改并更新 HTML\
    \ 代码/占位符。每个占位符会为 `lists` 中的新条目额外运行一次，你会看到以下屏幕：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_56_0.png)\n\
    \n当 `lists` 集合更新时，`Template.categories.lists` 助手检测到更改并重新运行自己（重新计算）。这改变了要在 `{{>\
    \ categories}}` 占位符中显示的代码内容。由于内容发生了变化，模板的受影响部分会重新运行。\n\n现在，在这里花一分钟想想，我们为了让这个响应式计算运行所做的是多么少：我们只是创建了一个模板，告诉\
    \ Blaze 我们希望 `lists` 数据集合如何显示，然后放了一个占位符。这就是最简单的声明式编程！\n\n## 让我们创建一些模板\n\n我们现在将看到一个响应式计算的真实示例，同时继续处理我们的借阅图书馆。通过控制台添加类别是个有趣的练习，但这不是长久之计。让我们改为在页面上实现这个功能，如下所示：\n"
