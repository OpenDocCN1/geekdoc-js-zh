    \ 还有最后一件事要做，那就是快速添加 `focusText()` 辅助函数。为此，就在 `if (Meteor.isClient)` 函数的结束标签之前，添加以下代码：\n\
    \n```\n/////Generic Helper Functions/////\n//this function puts our cursor where\
    \ it needs to be.\nfunction focusText(i) {\n  i.focus();\n  i.select();\n};\n\
    } //<-----closing bracket for if(Meteor.isClient){}\n```\n\n## 为什么 Meteor 如此棒！\n\
    \n现在，当你保存更改并点击加号按钮时，你将看到输入框：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_60_0.png)\n\
    \n真棒！它仍然没有实际作用，但我们想暂停一下，反思一下刚才发生的事情；我们在 HTML 页面中创建了一个条件模板，它将根据一个*变量*的值来显示输入框或加号按钮。\n\
    \n这个变量是一个响应式变量，称为**响应式上下文**。这意味着如果我们改变这个变量的值（就像我们使用 `click` 事件处理程序所做的那样），那么视图会自动更新，因为\
    \ `new_cat` 辅助函数（一个响应式计算）将重新运行。恭喜，你刚刚使用了 Meteor 的响应式编程模型！\n\n为了真正理解这一点，让我们对 `lists`\
    \ 集合（记住，它也是一个响应式上下文）进行更改，并想办法在完成后隐藏 `input` 字段。\n\n首先，我们需要为 `keyup` 事件添加一个监听器。或者换句话说，我们希望在用户在框中键入某些内容并按*回车键*时进行监听。当发生这种情况时，我们希望根据用户输入的内容添加一个类别。为此，让我们首先声明事件处理程序。在\
    \ `#btnNewCat` 的 `click` 处理程序之后，添加另一个事件处理程序：\n\n```\n'click #btnNewCat': function\
    \ (e, t) {\n   ...\n},\n'keyup #add-category': function (e,t){\n if (e.which ===\
    \ 13)\n {\n   var catVal = String(e.target.value || \"\");\n   if (catVal)\n \
    \  {\n     lists.insert({Category:catVal});\n     Session.set('adding_category',\
    \ false);\n   }\n }\n}\n```\n\n我们在第一个 `click` 处理程序末尾添加一个“，”字符，然后添加 `keyup` 事件处理程序。现在，让我们检查一下前面代码中的每一行：\n\
    \n这行代码检查我们是否按下了*回车/返回*键。\n\n```\nif (e.which === 13)\n```\n\n这行代码检查输入字段是否有任何值：\n\
    \n```\nvar catVal = String(e.target.value || \"\");\nif (catVal)\n```\n\n如果有，我们希望向\
    \ `lists` 集合添加一个条目：\n\n```\nlists.insert({Category:catVal});\n```\n\n然后，我们希望隐藏输入框，我们可以通过简单地修改\
    \ `adding_category` 的值来做到这一点：\n\n```\nSession.set('adding_category', false);\n\
    ```\n\n还有一件事需要添加，然后我们就完成了。当我们点击输入框外部时，我们希望隐藏它并恢复加号按钮。我们已经知道如何以响应式方式做到这一点，所以让我们添加一个快速函数来改变\
    \ `adding_category` 的值。为此，在 `keyup` 事件处理程序之后再添加一个逗号，并插入以下事件处理程序：\n\n```\n'keyup\
    \ #add-category': function (e,t){\n    ...\n},\n'focusout #add-category': function(e,t){\n\
    \    Session.set('adding_category',false);\n}\n```\n\n保存你的更改，让我们看看实际效果！在你的网络浏览器中访问\
    \ http://localhost:3000，点击加号，输入单词 `Clothes`，然后按*回车键*。\n\n你的屏幕现在应该类似于以下截图：\n\n\
    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_62_0.png)\n\n如果你想的话，可以随意添加更多类别。另外，尝试点击加号按钮，输入一些内容，然后点击输入框外部来试验。\n\
    \n## 总结\n\n在本章中，你了解了 Web 应用程序的历史，并看到了我们如何从传统的客户端/服务器模型发展到嵌套的 MVC 设计模式。你了解了什么是智能应用程序，还看到了\
    \ Meteor 如何通过数据在线传输、延迟补偿和全栈响应性将智能应用程序提升到一个新的水平。你看到了 Meteor 如何使用模板和辅助函数，利用响应式变量和响应式计算来自动更新内容。最后，你为借阅库添加了更多功能。你创建了一个按钮和一个输入字段来添加类别，并且你完全是使用响应式编程而不是直接编辑\
    \ HTML 代码来完成的。在下一章中，我们将真正开始工作，添加各种模板和逻辑，让我们的借阅库真正“活”起来！\n"
