  md: 'Application Structure – Client, Server, and Public (oh my!)


    Adding the `owner:this.userId` selector will check each list in our `lists` repository
    and return the value under `Category` for each instance where the currently logged
    in user is the owner of the list. Save this change, and you''ll notice that all
    of the current categories have disappeared!


    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_114_0.png)


    This is because the categories that we created already don''t have any `owner`,
    and we''re logged in as admin; so, the owner property (`undefined`) doesn''t match.
    We''re going to experience similar problems when we go to try and modify existing
    items because no `items` have any owner either.


    We have several options to fix this, including manually adding the admin account
    as the owner, letting the admin account see all unclaimed `lists`, or we can just
    start with a clean slate. Since we only lent out one item (dang it, STEVE! We
    want our wrench back!), now is a good time to clear out our database and add back
    our linear compression wrench, before we forget who has it (yeah, right!)


    Open a new terminal window (keep your app running) and navigate to the root folder
    of your app. Once there, we''re going to run the `meteor shell` command:


    ```

    $ cd ~/Documents/Meteor/LendLib

    $ meteor shell

    ```


    This will start up the server-side equivalent of the browser console. In this
    server console, enter the following command:


    ```

    > lists.remove({})

    ```


    This will remove all of our categories, and we can start over once we''ve added
    an owner for newly-created categories.'
