    # Summary


    In this chapter, you learned what MongoDB is, how a document-oriented database
    works, and you performed direct queries in the command line. This enabled you
    to become familiar with Meteor''s default data repository system. You also streamlined
    your application by removing `autopublish` and gained a firm understanding of
    the publish/subscribe design pattern built into Meteor.


