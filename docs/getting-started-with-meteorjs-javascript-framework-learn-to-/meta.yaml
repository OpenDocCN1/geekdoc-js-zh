  md: '# # The security and accounts


    At this point, our Lending Library app does exactly what we want it to do. It
    keeps track of all our stuff and to whom we''ve lent items. However, if we were
    to put this app into use, there are some security issues inside the app itself
    that we''d have to deal with first.


    First and foremost, what''s to stop someone from accessing our app and erasing
    their name from an item they borrowed? That scumbag STEVE might just keep our
    linear compression wrench forever if he were so inclined, and we''d have no way
    of proving whether or not he still had it.


    We cannot let such thievery and dishonesty go unpunished! STEVE must be held accountable!
    So, we need to implement security. Specifically, we need to perform two actions:


    +   - Only allow editing in the UI by the owner of the items

    - Secure the database so that changes can''t be made using the web console


    # # Removing insecure


    The first step in accomplishing these two goals is to remove the `insecure` library
    from Meteor. By default, the `insecure` library is included so that we can go
    about building our application without having to worry about security until we''ve
    got our security strategy in place and written most of our code.


    The time has come. We know what we want security-wise, so let''s go ahead and
    get rid of that library. Stop the Meteor application (press Ctrl + C in the terminal
    window) and enter the following command (you need to be in the `LendLib/` directory):


    ```

    $ meteor remove insecure

    ```


    This will generate the following message:


    ```

    Changes to your project''s package version selections:

    insecure removed from your project

    insecure: removed dependency

    ```'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'Our application is now secure. In fact, it''s actually too secure. Start *Meteor*
    again (type *meteor* in the terminal and press *Enter*) and navigate to our app
    in a browser window using `http://localhost:3000`. Once there, try to add a new
    item, add a lendee, or even delete an item. We''ll try to lend our favorite shirt
    to our significant other, but nothing will happen—no deletions, no additions,
    and no changes. Nothing will work! If you open the browser console, you''ll see
    that every attempt to update the database will be met with the **update failed:
    Access denied** message:


    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_107_0.png)


    These messages are displayed because we removed the *insecure* package. Put another
    way, no client-initiated changes are allowed anymore. When the change request
    goes from the client to the server, there are no *allow* conditions; therefore,
    the request will be denied.


    # Adding an admin account


    To re-enable the update functionality, we need to be able to create an admin account,
    give the admin account permissions to make changes, and provide the user with
    a way to recover a lost password.


    We''ll first need to add three built-in Meteor packages. Stop the Meteor application,
    and in the terminal window, enter the following command:


    ```

    $ meteor add accounts-password

    ```'
