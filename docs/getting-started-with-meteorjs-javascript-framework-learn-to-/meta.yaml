    \ it based on the value of a variable in the template.\n\n4. Add the following\
    \ {{#if...else}} conditionals around our new button:\n\n```\n<div id=\"categories\"\
    \ class=\"btn-group\">\n  {{#if new_cat}}\n  {{else}}\n    <div class=\"category\
    \ btn btn-primary\" id=\"btnNewCat\">\n      <span class=\"glyphicon glyphicon-plus\"\
    ></span>\n    </div>\n  {{/if}}\n  {{#each lists}}\n```\n\n5. The first line,\
    \ {{#if new_cat}}, checks to see whether new_cat is true or false. If it's false,\
    \ the {{else}} section is triggered, and it means that we haven't yet indicated\
    \ that we want to add a new category, so we should be displaying the button with\
    \ the plus sign. In this case, since we haven't defined it yet, new_cat will always\
    \ be false, and so the display won't change. Now, let's add the HTML code to display\
    \ when we want to add a new category:\n\n```\n{{#if new_cat}}\n  <div class=\"\
    category form-group\" id=\"newCat\">\n    <input type=\"text\" id=\"add-category\"\
    \n      class=\"form-control\" value=\"\" />\n  </div>\n{{else}}\n  ...\n{{/if}}\n\
    ```\n\nThere's the smallest bit of CSS we need to take care of as well. Open ~/Documents/Meteor/LendLib/LendLib.css\
    \ and add the following declaration:\n\n```\n#newCat {\n  max-width: 250px;\n\
    }\n```\n\n6. Okay, so now we've added an input field, which will show up when\
    \ `new_cat` is true. The input field won't show up unless it is set to `true`;\
    \ so, for now, it's hidden. So, how do we make `new_cat` equal to `true`?\n\n\
    7. Save your changes if you haven't already done so, and open LendLib.js. First,\
    \ we'll declare a Session variable, just below our Meteor.isClient check function,\
    \ at the top of the file:\n\n```\nif (Meteor.isClient) {\n  // We are declaring\
    \ the 'adding_category' flag\n  Session.set('adding_category', false);\n}\n```\n\
    \n8. Now, we'll declare the new template helper new_cat, which will be a function\
    \ returning the value of adding_category. We need to place the new helper in the\
    \ Template.categories.helpers() method, just below the declaration for lists:\n\
    \n```\nTemplate.categories.helpers({\n  lists: function () {\n    ...\n  },\n\
    \  new_cat: function(){\n    //returns true if adding_category has been assigned\n\
    \    //a value of true\n    return Session.equals('adding_category',true);\n \
    \ }\n});\n```\n\n> Note the comma (,) on the line above new_cat. It's important\
    \ that you add that comma, or your code will not execute.\n\nSave these changes,\
    \ and you'll see that nothing has changed. Ta-da! In reality, this is exactly\
    \ as it should be because we haven't done anything to change the value of `adding_category`\
    \ yet. Let's do this now:\n\n- 1. First, we'll declare our `click` event handler,\
    \ which will change the value in our `Session` variable. To do this, add the following\
    \ highlighted code just below the `Template.categories.helpers()` block:\n\n```\n\
    Template.categories.helpers({\n  ...\n});\nTemplate.categories.events({\n  'click\
    \ #btnNewCat': function (e, t) {\n    Session.set('adding_category', true);\n\
    \    Tracker.flush();\n    focusText(t.find(\"#add-category\"));\n  }\n});\n```\n\
    \n- 2. Now, let's take a look at the following line of code:\n\n```\nTemplate.categories.events({\n\
    ```\n\nThis line declares that events will be found in the `categories` template.\n\
    \n- 3. Now, let's take a look at the next line:\n\n```\n'click #btnNewCat': function\
    \ (e, t) {\n```\n\nThis tells us that we're looking for a click event on the HTML\
    \ element with an `id=\"btnNewCat\"` statement (which we already created in `LendLib.html`).\n\
    \n```\nSession.set('adding_category', true);\nTracker.flush();\nfocusText(t.find(\"\
    #add-category\"));\n```\n\n- 4. Next, we set the `Session` variable, `adding_category\
    \ = true`, flush the DOM (to clear up anything wonky), and then set the focus\
    \ onto the input box with the `id=\"add-category\"` expression.\n\n- 5. There\
    \ is one last thing to do, and that is to quickly add the `focusText()` helper\
    \ function. To do this, just before the closing tag for the `if (Meteor.isClient)`\
    \ function, add the following code:\n\n```\n/////Generic Helper Functions/////\n\
    //this function puts our cursor where it needs to be.\nfunction focusText(i) {\n\
    \  i.focus();\n  i.select();\n};\n} //<-----closing bracket for if(Meteor.isClient){}\n\
    ```\n\n## Why Meteor Rocks!\n\nNow, when you save the changes and click on the\
    \ plus button, you will see the input box:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_60_0.png)\n\
    \nFancy! It's still not useful, but we want to pause for a second and reflect\
    \ on what just happened; we created a conditional template in the HTML page that\
    \ will either show an input box or a plus button, depending on the value of a\
    \ *variable*.\n\nThis variable is a reactive variable, called a **reactive context**.\
    \ This means that if we change the value of the variable (like we do with the\
    \ `click` event handler), then the view automatically updates because the `new_cat`\
    \ helpers function (a reactive computation) will re-run. Congratulations, you've\
    \ just used Meteor's reactive programming model!\n\nTo really bring this home,\
    \ let's add a change to the `lists` collection (which is also a reactive context,\
    \ remember?) and figure out a way to hide the `input` field when we're done.\n\
    \nFirst, we need to add a listener for the `keyup` event. Or, to put it another\
    \ way, we want to listen when the user types something in the box and hits *Enter*.\
    \ When this happens, we want to add a category based on what the user typed. To\
    \ do this, let's first declare the event handler. Just after the `click` handler\
    \ for `#btnNewCat`, let's add another event handler:\n\n```\n'click #btnNewCat':\
    \ function (e, t) {\n   ...\n},\n'keyup #add-category': function (e,t){\n if (e.which\
    \ === 13)\n {\n   var catVal = String(e.target.value || \"\");\n   if (catVal)\n\
    \   {\n     lists.insert({Category:catVal});\n     Session.set('adding_category',\
    \ false);\n   }\n }\n}\n```\n\nWe add a \",\" character at the end of the first\
    \ `click` handler, and then add the `keyup` event handler. Now, let's check each\
    \ of the lines in the preceding code:\n\nThis line checks to see whether we hit\
    \ the *Enter/Return* key.\n\n```\nif (e.which === 13)\n```\n\nThis line of code\
    \ checks to see whether the input field has any value in it:\n\n```\nvar catVal\
    \ = String(e.target.value || \"\");\nif (catVal)\n```\n\nIf it does, we want to\
    \ add an entry to the `lists` collection:\n\n```\nlists.insert({Category:catVal});\n\
    ```\n\nThen, we want to hide the input box, which we can do by simply modifying\
    \ the value of `adding_category`:\n\n```\nSession.set('adding_category', false);\n\
    ```\n\nThere is one more thing to add and then we'll be done. When we click away\
    \ from the input box, we want to hide it and bring back the plus button. We already\
    \ know how to do this reactively, so let's add a quick function that changes the\
    \ value of `adding_category`. To do this, add one more comma after the `keyup`\
    \ event handler and insert the following event handler:\n\n```\n'keyup #add-category':\
    \ function (e,t){\n    ...\n},\n'focusout #add-category': function(e,t){\n   \
    \ Session.set('adding_category',false);\n}\n```\n\nSave your changes, and let's\
    \ see this in action! In your web browser on http://localhost:3000, click on the\
    \ plus sign, add the word `Clothes`, and hit *Enter*.\n\nYour screen should now\
    \ resemble the following screenshot:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_62_0.png)\n\
    \nFeel free to add more categories if you like. Also, experiment by clicking on\
    \ the plus button, typing something in, and then clicking away from the input\
    \ field.\n\n## Summary\n\nIn this chapter, you learned about the history of web\
    \ applications and saw how we've moved from a traditional client/server model\
    \ to a nested MVC design pattern. You learned what smart apps are, and you also\
    \ saw how Meteor has taken smart apps to the next level with Data On The Wire,\
    \ Latency Compensation, and Full Stack Reactivity. You saw how Meteor uses templates\
    \ and helpers to automatically update content, using reactive variables and reactive\
    \ computations. Lastly, you added more functionality to the Lending Library. You\
    \ made a button and an input field to add categories, and you did it all using\
    \ reactive programming rather than directly editing the HTML code. In the next\
    \ chapter, we'll really get to work and add all kinds of templates and logic,\
    \ bringing our Lending Library to life!"
