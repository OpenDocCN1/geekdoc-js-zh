  md: "> To better understand Meteor data synchronization, see the Publish and subscribe\
    \ section of the meteor documentation at http://docs.meteor.com/#/full/meteor_publish.\n\
    \n# Full Stack Reactivity\n\nReactivity is integral to every part of Meteor. On\
    \ the client side, Meteor has the Blaze library, which uses HTML templates and\
    \ JavaScript helpers to detect changes and render the data in your UI. Whenever\
    \ there is a change, the helpers re-run themselves and add, delete, and change\
    \ UI elements, as appropriate, based on the structure found in the templates.\
    \ These functions that re-run themselves are called **reactive computations**.\n\
    \nOn both the client and the server, Meteor also offers reactive computations\
    \ without having to use a UI. Called the **Tracker** library, these helpers also\
    \ detect any data changes and re-run themselves accordingly. Because both the\
    \ client and the server are JavaScript-based, you can use the Tracker library\
    \ anywhere. This is defined as isomorphic or **full stack reactivity** because\
    \ you're using the same language (and in some cases the same code!) on both the\
    \ client and the server.\n\nRe-running functions on data changes has a really\
    \ amazing benefit for you, the programmer: you get to write code declaratively,\
    \ and Meteor takes care of the reactive part automatically. Just tell Meteor how\
    \ you want the data displayed, and Meteor will manage any and all data changes.\
    \ This declarative style is usually accomplished through the use of **templates**.\n\
    \nTemplates work their magic through the use of **view data bindings**. Without\
    \ getting too deep, a view data binding is a shared piece of data that will be\
    \ displayed differently if the data changes.\n\nLet's look at a very simple data\
    \ binding — one for which you don't technically need Meteor — to illustrate the\
    \ point. Let's perform the following set of steps to understand the concept in\
    \ detail:\n\n+   1. In LendLib.html, you will see an HTML-based template expression:\n\
    \    <div id=\"categories-container\">\n        {{> categories}}\n    </div>\n\
    2. This expression is a placeholder for an HTML template that is found just below\
    \ it:\n    <template name=\"categories\">\n        <h2 class=\"title\">my stuff</h2>.."
