    # 5

    Data – Meteor Style!


    We''ve nearly completed the **Lending Library** application, without having to
    worry much about how our data is being stored. Meteor''s data caching and synching
    methodology is intentionally built to make that part of building the application
    as simple as possible so that, instead of spending a lot of time messing around
    with database connections, queries, and caching, you can concentrate on writing
    a great program.


    However, we do want to go over the methodology, and we''ll have to make sure we
    have a solid understanding of how Meteor handles data so that we can perform some
    common optimizations and build our applications even more quickly.


    In this chapter, you will learn about the following topics:


    +   - MongoDB and document-oriented storage

    - Broadcasting changes—how Meteor makes your web application reactive

    - Configuring publishers—how to streamline and protect your data


    # Document-oriented storage


    Meteor uses MongoDB on the server side, and a version of MongoDB, **Minimongo**,
    on the client side. It''s capable of using any other NoSQL/document-oriented database,
    but MongoDB comes by default with the Meteor installation. This feature makes
    your programs much simpler and easier to write and works really well for quick,
    lightweight data storage.'
  - "[PAGE 84]\n\n# Data – Meteor Style!\n\n# Why not use a relational database?\n\
    \nTraditionally, most data is stored using a relational model. The relational\
    \ model, with all of its associated rules, relations, logic, and syntax, is an\
    \ integral and invaluable part of modern computing. The rigid structure of a relational\
    \ database, with exact requirements for each record, relation, and association,\
    \ provides us with quick searches, scalability, and the potential for deep analytics.\n\
    \nThis type of exactness, however, isn't always necessary. In the case of our\
    \ Lending Library app, for example, a full-fledged relational database would be\
    \ overkill. In fact, in some cases, it's more effective to have a flexible data\
    \ storage system—one that you can extend quickly and without significant recoding.\n\
    \nFor example, if you wanted to add a new property to your `list` object, it would\
    \ be much simpler to just add the new property and let the database worry about\
    \ it rather than having to refactor your database code, add a new column, update\
    \ all of your SQL statements and triggers, and make sure that all previous records\
    \ have the new property.\n\nThis is where document-oriented storage comes into\
    \ play. In a document-oriented storage system, your data store is made up of a\
    \ bunch of key-value-paired documents. So, what's the structure of that document?\
    \ The data store doesn't really care. It could contain pretty much anything as\
    \ long as each record has a unique key so that it can be retrieved.\n\nSo, in\
    \ one document entry, you could have a very simple document—maybe a key-value\
    \ pair:\n\n```\n{name:phone_number}\n```\n\nAnd then, in another document entry\
    \ (in the same data store), you could have a complex object with nested arrays,\
    \ nested objects, and so on:\n\n```\n{ people: [\n  {firstname:\"STEVE\", lastname:\"\
    Scuba\", phones :[\n    {type:cell, number:8888675309},\n    {type:home, number:8005322002}]\n\
    \  },\n  {firstname:...\n    ...\n  }]\n}\n```\n\nHeck, it could be the unabridged\
    \ works of William Shakespeare. It doesn't really matter. As long as the data\
    \ store can take the document and assign a unique key to it, it can be stored."
- md: " As you may have guessed, the lack of structure *can* make querying, sorting,\
    \ and manipulating documents less efficient. But that's okay because our primary\
    \ concern is with ease of coding and development speed, not efficiency.\n\nIn\
    \ addition, since our application only has a few core functions, we can quickly\
    \ identify what queries we'll be using most often and optimize our document schema\
    \ around that. This makes a document-oriented database actually perform *better*\
    \ in some cases than a traditional relational database.\n\n> There are some pretty\
    \ sophisticated document-oriented storage solutions out there that some would\
    \ argue are as efficient as, or more efficient than, a standard relational database;\
    \ but that discussion is beyond the scope of this book.\n\nGiven the flexible\
    \ nature of a document-oriented storage system, it is perfect for making quick\
    \ changes, and the foundation libraries that Meteor provides make it so that we\
    \ don't have to worry about the connection or the structure. All we have to do\
    \ is have a high-level understanding of how to retrieve, add, and modify the documents,\
    \ and we can leave the rest to Meteor.\n\n## MongoDB\n\nMongoDB—a play on the\
    \ word \"humongous\"—is an open source NoSQL (Not Only SQL) database. It provides\
    \ sophisticated features such as indexing, linking, atomic operations, and so\
    \ on, but at its heart it is a document-oriented storage solution.\n\n> To learn\
    \ more about MongoDB, visit its official site at http://www.mongodb.org.\n\nUsing\
    \ simple commands, we can see what records (what documents) are available, convert\
    \ the records into JavaScript objects, and then save the changed objects. Think\
    \ of MongoDB records in the same way you would think about an actual text document:\n\
    \n1. Locate the document and open it for editing: (Meteor equivalent: `lists.find()`).\n\
    2. Make changes to the document (Meteor equivalent: `lists.update({})`).\n3. Save\
    \ the document (automatically done with the `.update()` function).\n\nIt's not\
    \ as simple as that, and there's a lot of syntax that you'll need to learn if\
    \ you want to consider yourself proficient in MongoDB, but you can clearly see\
    \ the simple, clean document-oriented approach: find/create a record, make changes,\
    \ and save/update the record to the data store.\n\nWe need to discuss one final\
    \ concept to help you better understand how MongoDB works. MongoDB is called a\
    \ database, but it's easier to conceptualize as a collection of documents. The\
    \ collection is indexed and quickly accessible, but it's still a collection rather\
    \ than a group of relational tables/entities. In just the same way you'd think\
    \ about a folder on your hard drive where you keep all of your text documents,\
    \ think about MongoDB as a collection of documents, all of which are accessible\
    \ and can be opened, changed, and saved.\n\n## Using direct commands\n\nTo gain\
    \ a better understanding of how MongoDB works, let's have some fun in the command\
    \ line. Perform the following set of steps:\n\n1. First, make sure that your application\
    \ is up and running (open a terminal window, `cd` to the `~/Documents/Meteor/LendLib`\
    \ directory, and execute the `meteor` command).\n2. Next, open your browser and\
    \ point it to `http://localhost:3000`.\n3. Now, you will need to open an *additional*\
    \ terminal window, `cd` to the `~/Documents/Meteor/LendLib` directory, and run\
    \ the following command:\n\n   `meteor mongo`\n\nYou should see a message similar\
    \ to the following screenshot:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_86_0.png)\n\
    \nYou have now connected to the running MongoDB database for your Lending Library\
    \ application. Let's poke around with a couple of commands.\n\n1. First, let's\
    \ bring up the help screen. Enter the following command and hit *Enter*:\n\n \
    \  `> help`\n\n   We'll get a list of commands and a brief explanation of what\
    \ each one does. One in particular will show us even *more* commands that we can\
    \ use; for example, `db.help()` will give us a list of JavaScript database-related\
    \ commands.\n2. Type the following into your terminal window and press *Enter*:\n\
    \n   `> db.help()`\n\nDon't get overwhelmed by the number of possible commands.\
    \ You don't need to know all of these unless you'd like to become an expert in\
    \ MongoDB. You only need to know a few but having a look around never hurt anybody,\
    \ so let's proceed.\n\nAs mentioned previously, documents are stored in MongoDB\
    \ in a logical grouping called a collection. We can see this firsthand and take\
    \ a look at our `lists` collection directly in the terminal window. Run the following\
    \ set of commands to see their distinct output:\n\n1. To see a list of all available\
    \ collections, enter the following command:\n\n   `> db.getCollectionNames()`\n\
    \n   In the response, you will find the name of your Lending Library collection—`lists`.\n\
    \n2. Let's go ahead and take a look at the `lists` collection. To do this, enter\
    \ the following command:\n\n   `> db.getCollection('lists')`\n\n   Well, that\
    \ wasn't very exciting. All we got back was `meteor.lists`. We want to be able\
    \ to perform some queries on that collection. So, this time, let's assign the\
    \ collection to a variable:\n\n   `> myLists = db.getCollection('lists')`\n\n\
    \   It appears that we have the same result as last time, but we have a lot more\
    \ than that. We've now assigned the `lists` collection to the `myLists` variable.\
    \ Therefore, we can run commands in the terminal window just like we would inside\
    \ our Meteor code.\n\n3. Let's get the `Clothes` list, which probably doesn't\
    \ have any items in it but still exists. To do this, enter the following command:\n\
    \n   `> Clothes = myLists.findOne({Category:\"Clothes\"})`\n\n   This will return\
    \ some very basic JSON. You will notice an `_id` key with a long number next to\
    \ it, similar to this:\n\n   `\"_id\" : \"vqWrHqMTBdYjggsco\"`\n\nWe didn't add\
    \ `_id`; MongoDB created it for us. It's a unique key so that, if we know it,\
    \ we can make changes to a document without disturbing any of the other documents.\
    \ We actually use this inside our Lending Library application in multiple locations.\n\
    \n## Data – Meteor Style!\n\nIf you look inside the `LendLib.js` file by navigating\
    \ to `~/Documents/Meteor/LendLib/`, you'll see the following function for adding\
    \ an item to a list:\n\n```\nfunction addItem(list_id,item_name){\n  if (!item_name&&!list_id)\n\
    \    return;\n  lists.update({_id:list_id}, {\n    $addToSet:{items:{Name:item_name}}});\n\
    };\n```\n\nNote that when we call the `lists.update()` function, we identify which\
    \ document we're going to update by the `_id`. This ensures that we're not updating\
    \ multiple documents accidentally. If, for example, you were to give two `lists`\
    \ the same `Category` name (for example, `DVDs`), and used `Category` as the selector\
    \ (`{Category:\"DVDs\"}`), you would be taking action on both `lists`. If, instead,\
    \ you use the `_id`, it will only update the unique document with the matching\
    \ value of `_id`.\n\nGetting back to the terminal, we now have the `myLists` variable\
    \ assigned to our `lists` collection, and we've assigned the `Clothes` variable\
    \ to the document in our `lists` collection that represents the `Clothes` list.\n\
    \nTake note of what the **Clothes** list currently looks like in our browser:\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_88_0.png)\n\nLet's go ahead and add\
    \ our favorite shirt to the `Clothes` list. We'll do this directly in the terminal\
    \ window. To do this, enter the following command:\n\n```\n>myLists.update({_id:Clothes._id},{$addToSet:{items:{Name:\"\
    Favorite Shirt\"}}})\n```\n\nThis command updates `myLists`, using `Clothes._id`\
    \ as the selector, and calls `$addToSet`, adding an item with `Name:\"Favorite\
    \ Shirt\"`. It might take a few moments for Meteor to update, but you will soon\
    \ see your favorite shirt added to the list:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_89_0.png)\n\
    \nIf you re-run the `Clothes` assignment command as follows, you will now see\
    \ that there is an `items` array, with an entry for your favorite shirt:\n\n`Clothes\
    \ = myLists.findOne({Category:\"Clothes\"})`\n\nWe can just as easily update or\
    \ remove an item by using the `.update()` function with different arguments (`$pull`\
    \ for removing and `$set` for updating).\n\n> For code examples, review the `removeItem()`\
    \ and `updateLendee()` functions in `LendLib.js`.\nFor a more in-depth tutorial\
    \ on MongoDB commands, visit `http://mongodb.org` and click on **Try It Out**.\n\
    \nNow that we've gone through some of the commands that we can implement directly,\
    \ let's revisit some of our `LendLib.js` code and discuss the reactive code that\
    \ tracks changes to our collection.\n\n## Broadcasting changes\n\nAs mentioned\
    \ in *Chapter 3, Why Meteor Rocks!*, communicating changes between the client-side\
    \ Minimongo and the server-side MongoDB instances happens over DDP. The requests\
    \ from the client to the server happen automatically when you update a collection\
    \ on the client. The server to client communication, however, uses a publish/subscribe\
    \ model that, until now, we have let Meteor take care for us."
  mdcn: "\n正如你可能已经猜到的那样，缺乏结构可能会使查询、排序和操作文档的效率降低。但这没关系，因为我们的首要关注点是编程的便捷性和开发速度，而不是效率。\n\
    \n此外，由于我们的应用程序只有几个核心功能，我们可以快速识别出最常用的查询，并围绕这些查询优化我们的文档模式。这使得在某些情况下，文档型数据库的性能实际上比传统的关系型数据库更好。\n\
    \n> 市面上有一些非常复杂的文档型存储解决方案，有人认为它们的效率与标准关系型数据库相当，甚至更高；但这方面的讨论超出了本书的范围。\n\n鉴于文档型存储系统的灵活性，它非常适合快速进行更改，而\
    \ Meteor 提供的基础库使我们无需担心连接或结构问题。我们只需要对如何检索、添加和修改文档有一个高层次的了解，其余的就可以交给 Meteor 了。\n\
    \n## MongoDB\n\nMongoDB——这个名字来自单词\"humongous\"（巨大的）——是一个开源的 NoSQL（Not Only SQL，不仅限于\
    \ SQL）数据库。它提供了索引、链接、原子操作等高级功能，但其核心是一种文档型存储解决方案。\n\n> 要了解更多关于 MongoDB 的信息，请访问其官方网站\
    \ http://www.mongodb.org。\n\n使用简单的命令，我们可以查看有哪些记录（哪些文档）可用，将记录转换为 JavaScript 对象，然后保存更改后的对象。将\
    \ MongoDB 的记录想象成实际的文本文档：\n\n1. 找到文档并打开进行编辑：（Meteor 等价命令：`lists.find()`）。\n2. 对文档进行更改（Meteor\
    \ 等价命令：`lists.update({})`）。\n3. 保存文档（由 `.update()` 函数自动完成）。\n\n事情并非那么简单，如果你想精通\
    \ MongoDB，还需要学习很多语法，但你可以清楚地看到这种简单、干净的文档型方法：查找/创建记录、进行更改、保存/更新记录到数据存储。\n\n我们需要讨论最后一个概念，以帮助你更好地理解\
    \ MongoDB 的工作原理。MongoDB 被称为数据库，但将其概念化为一个文档集合会更容易理解。这个集合被索引且可以快速访问，但它仍然是一个集合，而不是一组关系表/实体。就和你硬盘上存放所有文本文档的文件夹一样，将\
    \ MongoDB 视为一个文档集合，所有文档都可以被访问、打开、更改和保存。\n\n## 使用直接命令\n\n为了更好地理解 MongoDB 的工作原理，让我们在命令行中找点乐子。执行以下步骤：\n\
    \n1. 首先，确保你的应用程序正在运行（打开一个终端窗口，`cd` 到 `~/Documents/Meteor/LendLib` 目录，然后执行 `meteor`\
    \ 命令）。\n2. 接下来，打开浏览器并访问 `http://localhost:3000`。\n3. 现在，你需要打开一个*额外的*终端窗口，`cd`\
    \ 到 `~/Documents/Meteor/LendLib` 目录，然后运行以下命令：\n\n   `meteor mongo`\n\n你应该会看到一个类似下图的消息：\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_86_0.png)\n\n你现在已连接到你的借阅图书馆应用程序正在运行的\
    \ MongoDB 数据库。让我们用几个命令来探索一下。\n\n1. 首先，让我们调出帮助屏幕。输入以下命令并按 *Enter*：\n\n   `> help`\n\
    \n   我们会得到一个命令列表以及每个命令的简要说明。其中一个命令甚至会向我们展示*更多*可以使用的命令；例如，`db.help()` 将为我们提供一系列与\
    \ JavaScript 数据库相关的命令。\n2. 在你的终端窗口中输入以下内容并按 *Enter*：\n\n   `> db.help()`\n\n不要被可能的命令数量所压倒。除非你想成为\
    \ MongoDB 专家，否则你不需要知道所有这些命令。你只需要知道几个，但四处看看永远不会伤害任何人，所以我们继续吧。\n\n如前所述，文档以逻辑分组的形式存储在\
    \ MongoDB 中，称为集合。我们可以亲自看到这一点，并在终端窗口中直接查看我们的 `lists` 集合。运行以下一组命令以查看它们各自的输出：\n\n\
    1. 要查看所有可用集合的列表，请输入以下命令：\n\n   `> db.getCollectionNames()`\n\n   在响应中，你会找到你的借阅图书馆集合的名称——`lists`。\n\
    \n2. 让我们继续查看 `lists` 集合。为此，请输入以下命令：\n\n   `> db.getCollection('lists')`\n\n  \
    \ 嗯，这没什么意思。我们得到的只是 `meteor.lists`。我们希望能够对这个集合执行一些查询。所以，这次让我们将集合赋值给一个变量：\n\n  \
    \ `> myLists = db.getCollection('lists')`\n\n   看起来我们得到了和上次一样的结果，但我们得到的远不止这些。我们现在已经将\
    \ `lists` 集合赋值给了 `myLists` 变量。因此，我们可以在终端窗口中运行命令，就像在 Meteor 代码中一样。\n\n3. 让我们获取\
    \ `Clothes` 列表，它可能没有任何项目，但仍然存在。为此，请输入以下命令：\n\n   `> Clothes = myLists.findOne({Category:\"\
    Clothes\"})`\n\n   这将返回一些非常基本的 JSON。你会注意到有一个 `_id` 键，旁边跟着一个很长的数字，类似这样：\n\n   `\"\
    _id\" : \"vqWrHqMTBdYjggsco\"`\n\n我们没有添加 `_id`；是 MongoDB 为我们创建的。它是一个唯一的键，这样如果我们知道它，就可以对文档进行更改而不会干扰其他任何文档。我们实际上在借阅图书馆应用程序的多个位置使用了这一点。\n\
    \n## 数据——Meteor 风格！\n\n如果你通过导航到 `~/Documents/Meteor/LendLib/` 来查看 `LendLib.js`\
    \ 文件内部，你会看到以下用于将项目添加到列表中的函数：\n\n```\nfunction addItem(list_id,item_name){\n  if\
    \ (!item_name&&!list_id)\n    return;\n  lists.update({_id:list_id}, {\n    $addToSet:{items:{Name:item_name}}});\n\
    };\n```\n\n请注意，当我们调用 `lists.update()` 函数时，我们通过 `_id` 来识别要更新的文档。这确保了我们不会意外更新多个文档。例如，如果你要给两个\
    \ `lists` 相同的 `Category` 名称（例如，`DVDs`），并使用 `Category` 作为选择器（`{Category:\"DVDs\"\
    }`），你将对两个 `lists` 都执行操作。相反，如果你使用 `_id`，它只会更新具有匹配 `_id` 值的唯一文档。\n\n回到终端，我们现在已经将\
    \ `myLists` 变量赋值给了我们的 `lists` 集合，并且我们已经将 `Clothes` 变量赋值给了 `lists` 集合中代表 `Clothes`\
    \ 列表的文档。\n\n注意一下我们的**Clothes**列表目前在浏览器中的样子：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_88_0.png)\n\
    \n让我们继续将最喜欢的衬衫添加到 `Clothes` 列表中。我们将直接在终端窗口中执行此操作。为此，请输入以下命令：\n\n```\n>myLists.update({_id:Clothes._id},{$addToSet:{items:{Name:\"\
    Favorite Shirt\"}}})\n```\n\n此命令更新 `myLists`，使用 `Clothes._id` 作为选择器，并调用 `$addToSet`，添加一个\
    \ `Name:\"Favorite Shirt\"` 的项目。Meteor 可能需要一些时间来更新，但你很快就会看到最喜欢的衬衫被添加到列表中：\n\n\
    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_89_0.png)\n\n如果你重新运行 `Clothes` 赋值命令如下，你现在会看到有一个\
    \ `items` 数组，其中包含你最喜欢的衬衫的条目：\n\n`Clothes = myLists.findOne({Category:\"Clothes\"\
    })`\n\n我们可以同样轻松地使用 `.update()` 函数配合不同的参数来更新或删除项目（`$pull` 用于删除，`$set` 用于更新）。\n\n\
    > 有关代码示例，请查看 `LendLib.js` 中的 `removeItem()` 和 `updateLendee()` 函数。\n> 有关 MongoDB\
    \ 命令的更深入的教程，请访问 `http://mongodb.org` 并点击 **Try It Out**。\n\n既然我们已经介绍了一些可以直接实现的命令，让我们重新审视一下我们的\
    \ `LendLib.js` 代码，并讨论跟踪集合更改的响应式代码。\n\n## 广播更改\n\n正如在*第 3 章，Why Meteor Rocks!*\
    \ 中提到的，客户端 Minimongo 和服务器端 MongoDB 实例之间的通信更改通过 DDP 进行。当你更新客户端上的集合时，从客户端到服务器的请求会自动发生。然而，服务器到客户端的通信使用发布/订阅模型，到目前为止，我们让\
    \ Meteor 为我们处理了这一切。\n"
