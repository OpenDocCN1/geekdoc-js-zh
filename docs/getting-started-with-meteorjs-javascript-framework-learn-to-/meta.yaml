    \ and unexpected can qualify as amazing, then prepare to be amazed!\n\n### What\
    \ this book covers\n\n*Chapter 1, Setup and Installation*, gets you up and running\
    \ with Meteor in just a few minutes, and you'll see how quickly and easily you\
    \ can build a fully functional and useful application.\n\n*Chapter 2, Reactive\
    \ Programming…It's Alive!*, teaches you all about reactive programming, and how\
    \ you can leverage reactivity in Meteor to create amazing responsive applications.\n\
    \n*Chapter 3, Why Meteor Rocks!*, helps you to gain an understanding of the design\
    \ patterns that Meteor uses and see examples of these powerful patterns in action.\n\
    \n*Chapter 4, Templates*, teaches you about Meteor Templates in depth and uses\
    \ templates to lay the groundwork for your Lending Library application.\n\n*Chapter\
    \ 5, Data – Meteor Style!*, helps you to discover how Meteor handles data, making\
    \ an enterprise-level application incredibly simple and robust. Implement Meteor's\
    \ data handling quickly and effectively in your application.\n\n*Chapter 6, Application\
    \ Structure – Client, Server, and Public (oh my!)*, shows you what changes you\
