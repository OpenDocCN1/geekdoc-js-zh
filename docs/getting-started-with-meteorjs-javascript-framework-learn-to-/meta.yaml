  - "[PAGE 78]\n\n# Templates\n\nSo, let's get to work! In `LendingLib.js`, just below\
    \ the `selectCategory()` function, let's create the `addItem()` function:\n\n\
    ```\nfunction selectCategory(e,t){\n ...\n};\nfunction addItem(list_id,item_name){\n\
    \ if (!item_name&&!list_id) return;\n lists.update({_id:list_id},\n          \
    \     {$addToSet:{items:{Name:item_name}}});\n};\n```\n\nThe first thing that\
    \ we do is check to make sure that we have values for `item_name` and `list_id`.\
    \ If we don't, we'll just return.\n\nNow, we'll call the MongoDB `update()` function\
    \ on the `lists` collection. `{_id:list_id}` is the selector. We tell MongoDB\
    \ to find us the record with `_id = list_id`. We then tell MongoDB what kind of\
    \ update we're going to perform. In this case, we'll use `$addToSet`, which will\
    \ append to an array. And, what are we going to append?\n\n{`items`:...} indicates\
    \ that we're updating the `items[]` array. `{Name:item_name}` is what we're adding,\
    \ and it's the `Name` property. This is equivalent to saying `item.Name = item_name`.\n\
    \nOnce we add this, as you might have guessed by now, the templates will automatically\
    \ update because `lists` is a reactive variable. Stop for a second and think about\
    \ this. In six lines of code, we performed an update query *and* propagated the\
    \ change to our UI. Six lines! Pretty magical, isn't it?\n\nLet's handle `removeItem()`\
    \ next:\n\n```\nfunction addItem(list_id,item_name){\n ...\n};\nfunction removeItem(list_id,item_name){\n\
    \ if (!item_name&&!list_id)\n   return;\n lists.update({_id:list_id},\n      \
    \         {$pull:{items:{Name:item_name}}});\n};\n```\n\nWow, this looks really\
    \ similar to the `addItem()` function. We are, in fact, using the same `update()`\
    \ function, just with a different action this time. This time, we'll use `$pull`,\
    \ which pulls an element out of the `items[]` array, where `Name == item_name`.\
    \ Once again, six lines are all we need. Once we update the `lists` collection,\
    \ the UI will update reactively."
- md: " Now, we tackle `updateLendee()`, which is a little more complex, but only\
    \ because we are updating a property in an array rather than a direct property\
    \ of an item. It's not too bad though. The only real difficulty is in finding\
    \ the right item in the array. Let's begin by adding the following function just\
    \ below the `removeItem()` function:\n\n```\nfunction removeItem(list_id,item_name){\n\
    \  ...\n};\nfunction updateLendee(list_id,item_name,lendee_name){\n  var l = lists.findOne({\"\
    _id\":list_id ,\n                         \"items.Name\":item_name});\n  \n  if\
    \ (l&&l.items)\n  {\n    for (var i = 0; i<l.items.length; i++)\n    {\n     \
    \ if (l.items[i].Name === item_name)\n      {\n        var updateItem = {};\n\
    \        updateItem['items.'+i+'.LentTo'] = lendee_name;\n        lists.update({'_id':list_id},{$set:updateItem});\n\
    \        break;\n      }\n    }\n  }\n};\n```\n\nWe get the `list_id`, the `item_name`,\
    \ and the `lendee_name`, so we can identify the right record (we use `list_id`\
    \ and `item_name` for this) and then update the `LentTo` property with the value\
    \ in `lendee_name`.\n\nTo save some typing, we declare the `l` variable using\
    \ the MongoDB `findOne()` function. This takes a two-part selector statement:\
    \ `_id:list_id` and `\"items.Name\":item_name`. This selector is basically saying,\
    \ *find me ONE record where the _id == list_id and the items[] array has a record\
    \ where Name == item_name*.\n\nIf `l` has a value and it also has `items`, we'll\
    \ go into our `for` loop. Here, we check specifically for whichever array element\
    \ had `Name == item_name`. If we find one, we'll first create the change we want\
    \ as an object. If, for example, the item we want to change is found in the first\
    \ element in the `items` array, our `updateItem` object would look like this:\n\
    \n```\n{ 'items.0.LentTo' : lendee_name }\n```\n\n## Templates\n\nWith the object\
    \ created, we call the `lists.update()` method, passing the `updateItem` in with\
    \ the `$set` command like this:\n\n```\nlists.update({...},{$set : updateItem});\n\
    ```\n\nThis `update()` method will update the `lists` collection. As you recall,\
    \ the `lists` collection is a reactive context, and therefore, the UI will update\
    \ with the changes.\n\n## Style updates\n\nRight now, we have a working application!\
    \ We haven't polished up our CSS yet, but let's go ahead and do that real quickly.\
    \ Make sure your application is running (run the `meteor` command in a terminal\
    \ window) and navigate to `http://localhost:3000`:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_80_0.png)\n\
    \nClick on **DVDs**, and you should see the one entry for **Mission Impossible**:\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_80_1.png)\n\nIt's not all that bad\
    \ besides some width/height issues and maybe some issues with the font sizing,\
    \ but that's because Bootstrap gives us a lot of help. Let's start by slightly\
    \ increasing the font size of our items. To do this, open `LendLib.css` and add\
    \ the following declaration:\n\n```\n.lending_item {\n  font-size:1.8rem;\n}\n\
    ```\n\nNext, our `btnAddItem` button is a little too \"Bruce Banner\" for our\
    \ liking. Let's Hulk it up a bit by making it big and green. To do this, add the\
    \ following declaration to the bottom of LendLib.css:\n\n```\n#btnAddItem span{\n\
    \  color:#5cb85c;\n  font-size:4rem;\n}\n```\n\nFinally, we will add a small creature\
    \ comfort. Open `LendLib.js` and modify the following `focusText()` function from\
    \ this:\n\n```\n//this function puts our cursor where it needs to be.\nfunction\
    \ focusText(i) {\n  i.focus();\n  i.select();\n};\n```\n\nto this:\n\n```\n//this\
    \ function puts our cursor where it needs to be.\nfunction focusText(i,val) {\n\
    \  i.focus();\n  i.value = val ? val : \"\";\n  i.select();\n};\n```\n\nThis change\
    \ just makes it so that when we go to edit something with a value already in it\
    \ (such as the lendee), the value will transfer to the textbox. This makes it\
    \ easier for the user to see who the current lendee is. The `val ? val : \"\"\
    ` conditional statement is necessary, because if val isn't passed or is null,\
    \ **undefined** gets put into the textbox.\n\nSave all your changes and let's\
    \ preview what our app looks like:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_82_0.png)\n\
    \nEverything seems to be in order. Play around with your app for a bit—add some\
    \ new categories, lend some stuff out to your friends (except STEVE!) and, once\
    \ you're done, move on to the next chapter.\n\n## Summary\n\nIn this chapter,\
    \ you completed the templates, events, and data model sections for your Lending\
    \ Library application. You created statements to add, delete, and update your\
    \ records and implemented UI state changes. You saw firsthand how reactive programming\
    \ works and gained a solid understanding of context. You are now equipped to create\
    \ an application from scratch, using the core functionality of Meteor to develop\
    \ an app quickly and with robust functionality.\n\nIn the next chapter, we'll\
    \ dive ever more deeply into Meteor's data caching and synching methodology and\
    \ harden your application.\n\n# 5\nData – Meteor Style!\n\nWe've nearly completed\
    \ the **Lending Library** application, without having to worry much about how\
    \ our data is being stored. Meteor's data caching and synching methodology is\
    \ intentionally built to make that part of building the application as simple\
    \ as possible so that, instead of spending a lot of time messing around with database\
    \ connections, queries, and caching, you can concentrate on writing a great program.\n\
    \nHowever, we do want to go over the methodology, and we'll have to make sure\
    \ we have a solid understanding of how Meteor handles data so that we can perform\
    \ some common optimizations and build our applications even more quickly.\n\n\
    In this chapter, you will learn about the following topics:\n\n- MongoDB and document-oriented\
    \ storage\n- Broadcasting changes—how Meteor makes your web application reactive\n\
    - Configuring publishers—how to streamline and protect your data\n\n## Document-oriented\
    \ storage\n\nMeteor uses MongoDB on the server side, and a version of MongoDB,\
    \ **Minimongo**, on the client side. It's capable of using any other NoSQL/document-oriented\
    \ database, but MongoDB comes by default with the Meteor installation. This feature\
    \ makes your programs much simpler and easier to write and works really well for\
    \ quick, lightweight data storage.\n\n## Why not use a relational database?\n\n\
    Traditionally, most data is stored using a relational model. The relational model,\
    \ with all of its associated rules, relations, logic, and syntax, is an integral\
    \ and invaluable part of modern computing. The rigid structure of a relational\
    \ database, with exact requirements for each record, relation, and association,\
    \ provides us with quick searches, scalability, and the potential for deep analytics.\n\
    \nThis type of exactness, however, isn't always necessary. In the case of our\
    \ Lending Library app, for example, a full-fledged relational database would be\
    \ overkill. In fact, in some cases, it's more effective to have a flexible data\
    \ storage system—one that you can extend quickly and without significant recoding.\n\
    \nFor example, if you wanted to add a new property to your `list` object, it would\
    \ be much simpler to just add the new property and let the database worry about\
    \ it rather than having to refactor your database code, add a new column, update\
    \ all of your SQL statements and triggers, and make sure that all previous records\
    \ have the new property.\n\nThis is where document-oriented storage comes into\
    \ play. In a document-oriented storage system, your data store is made up of a\
    \ bunch of key-value-paired documents. So, what's the structure of that document?\
    \ The data store doesn't really care. It could contain pretty much anything as\
    \ long as each record has a unique key so that it can be retrieved.\n\nSo, in\
    \ one document entry, you could have a very simple document—maybe a key-value\
    \ pair:\n\n```\n{name:phone_number}\n```\n\nAnd then, in another document entry\
    \ (in the same data store), you could have a complex object with nested arrays,\
    \ nested objects, and so on:\n\n```\n{ people: [\n  {firstname:\"STEVE\", lastname:\"\
    Scuba\", phones :[\n    {type:cell, number:8888675309},\n    {type:home, number:8005322002}]\n\
    \  },\n  {firstname:...\n    ...\n  }]\n}\n```\n\nHeck, it could be the unabridged\
    \ works of William Shakespeare. It doesn't really matter. As long as the data\
    \ store can take the document and assign a unique key to it, it can be stored."
  mdcn: "\n现在，我们来处理 `updateLendee()`，它稍微复杂一些，但这只是因为我们正在更新数组中的属性，而不是项目的直接属性。不过也不算太糟。唯一真正的难点在于找到数组中正确的项。让我们从在\
    \ `removeItem()` 函数下方添加以下函数开始：\n\n```\nfunction removeItem(list_id,item_name){\n\
