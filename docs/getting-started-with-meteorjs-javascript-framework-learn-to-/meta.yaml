    If you re-run the `Clothes` assignment command as follows, you will now see that
    there is an `items` array, with an entry for your favorite shirt:


    `Clothes = myLists.findOne({Category:"Clothes"})`


    We can just as easily update or remove an item by using the `.update()` function
    with different arguments (`$pull` for removing and `$set` for updating).


    > For code examples, review the `removeItem()` and `updateLendee()` functions
    in `LendLib.js`.

    For a more in-depth tutorial on MongoDB commands, visit `http://mongodb.org` and
    click on **Try It Out**.


    Now that we''ve gone through some of the commands that we can implement directly,
    let''s revisit some of our `LendLib.js` code and discuss the reactive code that
    tracks changes to our collection.


    # # Broadcasting changes


    As mentioned in *Chapter 3, Why Meteor Rocks!*, communicating changes between
    the client-side Minimongo and the server-side MongoDB instances happens over DDP.
    The requests from the client to the server happen automatically when you update
    a collection on the client. The server to client communication, however, uses
    a publish/subscribe model that, until now, we have let Meteor take care for us.'
