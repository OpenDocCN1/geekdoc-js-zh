    \ in there:\n\n```\n<template name=\"categories\">\n<div class=\"title\">categories</div>\n\
    <div id=\"categories\">\n\n</div>\n</template>\n```\n\nThis creates the `div`\
    \ categories which we can then go through and list all of our categories. If we\
    \ only had one record to deal with, the code would look like this:\n\n```\n<div\
    \ class=\"category\">\n{{Category}}\n</div>\n```\n\n# Reactive Programming...It's\
    \ Alive!\n\n+   5. But, we need to wrap this into a loop (in this case, an #each\
    \ statement) so that we get all the categories:\n\n```\n<template name=\"categories\"\
    >\n<div class=\"title\">categories</div>\n<div id=\"categories\">\n  {{#each lists}}\n\
    \    <div class=\"category\">\n      {{Category}}\n    </div>\n  {{/each}}\n</div>\n\
    ```\n\nNotice that we are telling the template \"for each record in the lists\
    \ collection\" with our `{{#each lists}}` command, and then, \"display the Category\"\
    \ with `{{Category}}`.\n\n+   6. If you save these changes and look at the web\
    \ page, you will see something like the following screenshot:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_36_0.png)\n\
    \nThis doesn't look much different. Yes, we have our header (**categories**),\
    \ but where are the categories for which we just created our template?\n\nThere's\
    \ one more step we need to complete for the categories to show up. Currently,\
    \ the template that we just created isn't pointing towards anything. In other\
