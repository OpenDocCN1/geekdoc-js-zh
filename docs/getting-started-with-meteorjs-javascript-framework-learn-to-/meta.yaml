    ```\nfunction selectCategory(e,t){\n  Session.set('current_list',this._id);\n\
    }\n```\n\nWith the `Session` variable changed, the subscription is re-run. This\
    \ leads to the `lists` collection being modified (different records for a different\
    \ `Category`), which then cascades to the helpers templates. Everything reacts\
    \ to the changes.\n\nIn other words, the following actions take place:\n\n+  \
    \ 1. `Session.set()` modifies the `current_list` variable.\n2. `Tracker.autorun()`\
    \ re-runs, causing the `Meteor.subscribe()` function to refresh the `lists` collection.\n\
    3. Any templates or template helpers that contain the `lists` collection are re-run,\
