    - 打包你的应用\n- 将应用部署到 Meteor 的服务器\n  - 更新 Meteor 的服务器\n  - 使用你自己的域名\n- 将应用部署到自定义服务器\n\
    \  - 服务器设置\n  - 安装和配置 MUP\n  - 使用 MUP 部署你的应用\n\n### 本章小结\n\n## 索引\n\n---\n\n##\
    \ 前言\n\n我们生活在一个令人惊叹的时代。医学、通信、物理学以及所有其他科学领域的进步为我们创造了机会，去打造在不久之前还几乎不可能创造出来的东西。\n\
    \n然而，我们不会轻易感到惊叹。摩尔定律不仅影响了我们计算机的运行速度，也显著提高了我们的期望值。我们已经对神奇的进步习以为常，因此，曾经令人惊叹的事物已经变得……好吧……司空见惯。确实，很难找到一些让我们感到意外的东西——一些能够重新唤起我们儿时那种惊奇感的东西，我们内心都渴望找回这种感觉，因为它曾被人从我们身边夺走。\n\
    \n那么，准备好重新获得一些那种惊奇感吧。一群 determined 的计算机科学家，他们决心创造出一些令人惊叹的东西，创造了一个新的 JavaScript\
    \ 框架，叫做 Meteor。你可能在想：\"一个新的 JavaScript 框架？这有什么特别的。\" 如果 Meteor 只是这样，那你是对的。不过，幸运的是，故事并没有就此结束。\n\
    \nMeteor 是一个响应式、简单且强大的应用平台，只需几行代码，就能够构建出复杂、健壮的 Web 和移动应用。\n\n在现代 Web 应用的背景下，它是**最先进的**。Meteor\
    \ 使用成熟、经过验证的开发设计模式，将构建应用时所有繁琐的部分都替你完成了。因此，你可以专注于构建稳固的应用，而不会被那些通常浪费时间的活动所拖累，比如再写一个新的数据库接口或者学习一个新的模板引擎。\n\
    \n而最好的部分是，它学起来很简单， amazingly 简单！你会亲眼看到一个应用在你面前栩栩如生，而当你回头看创建它所写的代码行数，并将其与传统的开发方法进行比较时，你可能会发现自己真的在说\"\
    \ wow \"或者\"他们是怎么做到的？\"\n\n本书将带你了解 Meteor 的主要特性，并向你展示如何从零开始创建一个应用。到本书结束时，你将创建一个可用的、实用的应用，并且你会对\
    \ Meteor 的独特之处有扎实的理解。这听起来可能像夸张，但如果你愿意接受创新和意想不到的事物可以被称为 amazing ，那么准备好被 amazed\
    \ 吧！\n\n### 本书内容\n\n*第 1 章，安装与设置*，让你在几分钟内启动并运行 Meteor，你会看到构建一个功能完整、实用的应用是多么快速和容易。\n\
    \n*第 2 章，响应式编程……它是活的！*，教你关于响应式编程的所有知识，以及如何在 Meteor 中利用响应式来创建 amazing 的响应式应用。\n\
    \n*第 3 章，为什么 Meteor 如此出色！*，帮助你理解 Meteor 使用的设计模式，并看到这些强大模式的实际应用。\n\n*第 4 章，模板*，深入教你关于\
    \ Meteor 模板的知识，并使用模板为 你的借阅图书馆应用 打下基础。\n\n*第 5 章，数据——Meteor 风格！*，帮助你发现 Meteor 如何处理数据，使企业级应用变得令人难以置信的简单和健壮。在你的应用中快速有效地实现\
    \ Meteor 的数据处理。\n\n*第 6 章，应用结构——客户端、服务器和公共文件（天哪！）*，向你展示可以对默认配置进行哪些更改，以使你的应用更加安全、可扩展和用户友好。\n\
    \n*第 7 章，打包与部署*，帮助你成为 Meteor 打包系统的专家，包括如何包含许多流行的第三方框架。你将学习如何将 Meteor 应用部署到你的开发、测试和生产环境。\n\
    \n### 阅读本书的要求\n\n要运行本书中的示例，需要以下软件：\n\n- 操作系统：\n  - Mac OS X 10.7（Lion）及以上版本\n\
    \  - Linux x86 或 x86_64 架构\n  - Windows 7 及以上版本\n- Meteor：\n  - Meteor 1.1 或更高版本\n\
    \n下表将引导你访问包含更多信息的网站：\n\n| # | 软件名称 | 网址 |\n|---|----------|------|\n| 1 | Mac\
    \ OS X | http://www.apple.com |\n| 2 | Linux | http://www.debian.org <br> http://www.redhat.com\
    \ |\n| 3 | Windows | https://www.microsoft.com |\n| 4 | Meteor | https://www.meteor.com/install\
    \ |\n\n### 本书适合谁\n\n本书适合具有一定 HTML 和 JavaScript 基础的应用开发者、设计师或分析师，他们希望学习 Meteor\
    \ 以及 JavaScript 社区向全栈 Web 和移动应用发展的新趋势。\n\n如果你正在寻找一种循序渐进的方法来了解如何以及何时使用最流行和创新的应用开发框架之一，那么这本书就是为你准备的。\n\
    \n### 排版约定\n\n在本书中，你会发现一些文本样式，用于区分不同类型的信息。以下是这些样式的一些示例，以及对其含义的解释。\n\n文本中的代码词显示如下：\"\
    \ `WebElement` 类也支持查找方法来查找子元素。\"\n\n代码块设置如下：\n\n```\n<form name=\"loginForm\"\
    >\n    <label for=\"username\">UserName: </label> <input type=\"text\"\n     \
    \   class=\"username\" /><br>\n    <label for=\"password\">Password: </label>\
    \ <input\n        type=\"password\" class=\"password\" /><br>\n    <input name=\"\
    login\" type=\"submit\" value=\"Login\" />\n</form>\n```\n\n当我们希望将注意力引向代码块的某个特定部分时，相关行或项目会以粗体显示：\n\
    \n```\n//Locate all the Checkbox which are checked by calling jQuery\n    find()\
    \ method.\n//find() method returns elements in array\nList<WebElement> elements\
    \ = (List<WebElement>)\n    js.executeScript(\"return jQuery.find(':checked')\"\
    );\n```\n\n任何命令行输入或输出都写为如下形式：\n\n```\nmvn clean test\n```\n\n**新术语**和**重要的词**以粗体显示。你在屏幕上看到的词，例如菜单或对话框中的词，在文本中显示如下：\"\
    右键单击打开弹出菜单，然后选择 **检查元素** 选项。\"\n\n> 警告或重要的注释出现在这样的方框中。\n\n> 提示和技巧显示如下。\n\n###\
    \ 读者反馈\n\n我们始终欢迎读者的反馈。请告诉我们你对这本书的看法——你喜欢什么，或者可能不喜欢什么。读者反馈对我们开发能够让你真正受益的图书非常重要。\n\
    \n要向我们发送一般反馈，只需发送电子邮件至 feedback@packtpub.com，并在邮件主题中注明书名。\n\n如果你对某个主题有专业知识，并且有兴趣撰写或参与一本书的创作，请访问\
    \ www.packtpub.com/authors 查看我们的作者指南。\n"
