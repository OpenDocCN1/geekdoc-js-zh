    Tools\"})` 命令来检查我们的工具集合，但这次我们不需要这样做。我们这次会相信 Meteor 已经正确输入了。但是，我们*确实*想检查一下这些对象是否是持久化的。为此，执行以下步骤：\n\
    \n+   1. 刷新网页。你的控制台会清空，但我们输入的 `类别` 已经被保存在持久化的 Meteor 集合中，所以我们可以再次检查它们是否还在。\n\n\
    2. 在控制台中输入以下命令：\n\n    > `lists.find({}).count();`\n\n    此命令会查找 `lists` 集合中的所有记录并给出总数。如果一切按计划进行，你应该得到\
    \ **2** 的计数结果。\n\n我们正在顺利前进！我们创建了两个类别，每个类别中有一个条目。我们还验证了 `lists` 集合在每次会话后都被保存了。现在，让我们看看如何在页面中显示它。\n\
    \n## 在 HTML 中显示集合\n\n现在我们将在项目初始化时创建的 HTML 页面中看到我们的集合活起来。这个页面将使用响应式模板，使我们对集合所做的更改能够立即显示，而无需刷新页面。这些响应式模板的类型——页面的\
    \ DOM 可以在不刷新的情况下更新——被称为 **Live HTML 模板**。\n\n> 要了解更多关于 Live HTML 模板的内容，请查阅 Meteor\
    \ 文档 http://docs.meteor.com/#/full/livehtmltemplates。\n\n让我们执行以下一组步骤：\n\n+   1.\
    \ 在仍然打开的 `~/Documents/Meteor/LendLib/` 下的 LendLib.html 文件中，找到 `<body>` 标签并添加一个新的模板包含：\n\
    \n```\n<body>\n  <h1>Lending Library</h1> {{> hello}}\n  <div id=\"categories-container\"\
    \ class=\"container\">\n    {{> categories}}\n  </div>\n</body>\n```\n\n这创建了一个新的\
    \ `div` 元素，其内容由一个名为 categories 的 **模板局部** 填充。\n\n+   2. 现在，在页面的最底部，添加 categories\
    \ 的骨架：\n\n```\n<template name=\"categories\">\n</template>\n```\n\n这不会改变页面的外观，但现在我们有了一个可以列出类别的模板局部。\n\
    \n+   3. 让我们在前面的代码行中放入我们的章节标题：\n\n```\n<template name=\"categories\">\n<div class=\"\
    title\">categories</div>\n</template>\n```\n\n+   4. 现在，让我们把类别加进去：\n\n```\n<template\
    \ name=\"categories\">\n<div class=\"title\">categories</div>\n<div id=\"categories\"\
    >\n\n</div>\n</template>\n```\n\n这创建了 `div` categories，我们可以在其中遍历并列出所有类别。如果我们只有一条记录要处理，代码看起来会是这样的：\n\
    \n```\n<div class=\"category\">\n{{Category}}\n</div>\n```\n\n# 响应式编程……它是活的！\n\
    \n+   5. 但是，我们需要将此包装在一个循环中（在本例中是 #each 语句），以便获取所有类别：\n\n```\n<template name=\"\
    categories\">\n<div class=\"title\">categories</div>\n<div id=\"categories\">\n\
    \  {{#each lists}}\n    <div class=\"category\">\n      {{Category}}\n    </div>\n\
    \  {{/each}}\n</div>\n```\n\n注意，我们通过 `{{#each lists}}` 命令告诉模板\"遍历 lists 集合中的每条记录\"\
    ，然后通过 `{{Category}}` \"显示 Category\"。\n\n+   6. 如果你保存这些更改并查看网页，你会看到类似以下截图的内容：\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_36_0.png)\n\n这看起来没太大变化。是的，我们有了标题（**categories**），但我们刚刚创建了模板的类别在哪里呢？\n\
    \n还有一步需要完成才能让类别显示出来。目前，我们刚创建的模板还没有指向任何东西。换句话说，我们有一个 `lists` 集合，我们有一个模板，但我们没有将它们关联起来的底层\
    \ JavaScript 函数。让我们通过执行以下步骤来解决这个问题：\n\n+   1. 打开 `~/Documents/Meteor/LendLib/`\
    \ 下的 `LendLib.js` 文件，我们可以看到一些 `Template` 函数：\n\n   ```\n   Template.hello.helpers({\
    \ ...\n   \n   ...\n   \n   Template.hello.events({ ...\n   ```\n   \n   这些代码块将\
    \ JavaScript 函数和对象挂载到 HTML `hello` 模板上。Meteor 内置的 `Template` 对象使这成为可能，我们将遵循相同的模式，即挂载我们的\
    \ `categories` 模板。\n\n+   2. 我们想声明 `categories` 模板有一个 `lists` 集合。我们通过在 `Template.hello.events()`\
    \ 代码块下方输入以下代码来实现：\n\n   ```\n     Template.hello.events({\n       ...\n     });\n\
    \     Template.categories.helpers({\n       lists : function(){\n       }\n  \
    \   });\n   }\n   ```\n\n> `Template` 声明*必须*在 `if (Meteor.isClient){...}` 代码块内，这样客户端才会获取到更改，而服务器端会忽略它。\n\
    \n+   3. 我们现在已经为所有模板声明了 `lists` 集合，我们可以让函数返回 `Meteor.Collection` 查询的结果。我们可以使用\
    \ `find()` 命令来实现：\n\n   ```\n   lists : function(){\n     return lists.find({},\
    \ { sort: { Category : 1 }});\n   }\n   ```\n"
