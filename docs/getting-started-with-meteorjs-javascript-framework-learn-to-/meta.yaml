    \ `id` 的 `<input>` 元素。\n\n另一种情况——这也是默认情况——我们只是想显示借出人是谁，如果有的话。如果没有，我们可能想改变颜色之类的，但我们仍然想显示它。所以，我们创建了一个\
    \ Bootstrap 样式的 `label`，以 `<div>` 元素的形式呈现。\n\n在类声明的末尾，我们看到一个模板变量 `{{LendClass}}`。这个类的添加是样式上的，它会告诉你的\
    \ CSS 模板是显示为 **free**（有人可以借阅）还是 **lent out**（已借出）。如果是绿色，表示可借；然而，如果是红色，则表示有人已经借走了。用于表示颜色的\
    \ CSS 类名将在 `LendLib.js` 中由 `item.LendClass` 属性决定，我们稍后会创建这个属性。\n\n然后，我们有 div 内部的值\
    \ `{{Lendee}}`。这也将是 `LendLib.js` 中的一个属性，即 `item.Lendee` 属性，它将显示借出人的名字，如果没有借出人的话则显示\
    \ **free** 一词。\n\n接着是闭合的 `</div>` 标签，我们的 `each` 以 `{{/each}}` 结束。\n\n现在，我们有第二个\
    \ *if* 语句，而这个实际上是嵌套的 *if*。这个在 `each` 语句之外，所以它不是特定于物品的。这个 *if* 语句显示一个加号（+）或一个以\
    \ `<input>` 元素形式的文本框，以便我们能向列表中添加物品：\n\n```\n        {{#if list_selected}}\n  \
    \          <div class=\"list-group-item\" id=\"btnAddItem\">\n               \
    \ <span class=\"glyphicon glyphicon-plus\"></span>\n                {{#if list_adding}}\n\
    \                    <input class=\"span-4\" id=\"item_to_add\"\n            \
    \               size=\"32\" type=\"text\">\n                {{/if}}\n        \
    \    </div>\n        {{/if}}\n    </div>\n</template>\n```\n\n所以，我们看到第一个 `if`，它的条件是我们是否正在显示任何列表项。如果是，这意味着我们已选择了一个列表，或者我们处于\
    \ `list_selected` 模式。跟踪这个是 Blaze 渲染引擎的工作，所以 `Template.list.list_selected` 可以在\
    \ `LendLib.js` 中找到。\n\n然后我们使用 Bootstrap 的 `glyphicon-plus` 类来创建一个加号。\n\n接下来是我们的嵌套（第二个）`if`。这个\
    \ `if` 检查我们是否正在向物品列表中添加内容。如果是，我们就处于 `list_adding` 模式，所以我们会显示一个以 `<input>` 元素形式的文本框。如果不是，我们就让加号孤零零地待着。\n\
    \n最后，我们结束嵌套的 `{{/if}}`、`</div>`、父级的 `{{/if}}`、`</ul>` 以及 `</template>`。\n\n##\
    \ 将所有内容粘合起来\n\n在 MVC 或 MV* 模型中，控制器（在本例中是 Blaze 渲染引擎）有时被称为 **glue**（胶水）。这是因为它将所有视图项（如按钮或文本框）\"\
    粘合\"到模型上。Blaze 通过响应式上下文和响应式计算来做到这一点，极大地简化了\"粘合\"过程，这对开发者来说是非常有利的。\n\n很华丽的解释，对吧？好吧，你试着想出一个更好的解释来描述它的作用。它确实填补了裂缝，让模型和视图保持在一起。这个术语是别人发明的，不是我们；所以，让我们继续，不带那种爱评判的视角，好吗？\n\
    \n在本节中，我们将逐步讲解 `~/Documents/Meteor/LendLib/LendLib.js` 中需要进行的全部更改，以便将模板和数据模型粘合在一起。\n\
    \n### 显示物品\n\n在我们在 *第 2 章，响应式编程……它是活的！* 中创建的数据集合里，我们在创建几个 `lists` 时添加了一些示例 `items`。如果你还记得的话，我们是通过浏览器控制台来完成的，如下所示：\n\
