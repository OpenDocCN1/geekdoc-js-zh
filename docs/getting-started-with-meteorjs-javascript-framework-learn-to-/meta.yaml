    \ This chapter will take us through the template system in depth and show us how\
    \ to implement display logic and take care of data flow.\n\nIn this chapter, you\
    \ will complete the following tasks:\n\n+   - Complete the Lending Library core\
    \ functionality\n- Create multiple templates and template logic\n- Add, delete,\
    \ and update entries in the data model\n- See reactivity in action and use it\
    \ in your application\n\n# ## A new HTML template\n\nWe've already created our\
    \ categories through the use of the `categories` template. Now, we want to take\
    \ this to the next level and display the actual items that we may want to let\
