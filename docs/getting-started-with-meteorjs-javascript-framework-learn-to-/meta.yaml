  - "[PAGE 116]\n\n# Application Structure – Client, Server, and Public (oh my!)\n\
    \nThere, we're up and running! Inside each item, we now have an `owner` property.\
    \ This becomes important when we enable others to create and maintain their own\
    \ `lists` of `items`.\n\n# Enabling multiple users\n\nOkay, everything is in place\
    \ now for us to have a customized, private view of our own stuff, but currently,\
    \ only the admin account can add `lists` or `items` and assign a Lendee to an\
    \ item.\n\nWe'll fix this by going back to `LendLibServer.js` and adding some\
    \ logic to check whether the currently logged-in user owns the list or is an admin.\
    \ Inside `LendLib.js`, in the `lists.allow()` code block, make the following additions:\n\
    \n```\nlists.allow({\n  insert: function(userId, doc){\n    return (adminUser(userId)\
    \ || (userId && doc.owner === userId));\n  },\n  update: function(userId, docs,\
    \ fields, modifier){\n    return (adminUser(userId) || (userId && docs.owner ===\n\
    \    userId));\n  },\n  remove: function (userId, docs){\n    return (adminUser(userId)\
    \ || (userId && docs.owner ===\n    userId));\n  }\n});\n```\n\nInside `insert`,\
    \ we check to see whether the current `doc.owner` user is the logged-in user.\
    \ In `update` and `remove`, the name of the parameter changes to `docs`, but the\
    \ check is the same since we are only updating one record at a time. We, therefore,\
    \ check the `docs.owner` property.\n\nYou will now want to save your changes and\
    \ create a new account on `http://localhost:3000`. You can add categories and\
    \ items to your heart's content. You can switch between users and add as many\
    \ users and categories as you like."
