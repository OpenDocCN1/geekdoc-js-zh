    Yes, that''s it. Meteor takes care of everything for us; it reads all the files
    and scripts, and sets up the HTTP listener:


    ```

    [[[[ ~/Documents/Meteor/leaderboard ]]]]


    Running on: http://localhost:3000/

    ```


    We can now take the URL we''ve been given (`http://localhost:3000/`) and check
    out the example application in a web browser.


    # Previewing the application


    Open your favorite web browser (we''ll be using Chrome, but any modern, updated
    browser will work) and navigate to `http://localhost:3000/`.


    You should see a screen with a list containing the names of scientists, similar
    to the following screenshot:


    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_21_0.png)'
  - '[PAGE 22]


    You can go ahead and poke around the application a bit, if you want to. Click
    on Nikola Tesla''s name and add 5 points to his score about 20 bajillion times,
    because he deserves it. Give some love to Marie Curie because she was so radioactive
    that she actually made up the word. Go nuts, friend!


    # ## Help! I made too many changes!


    Do you fear change and want to reset the scores? No problem, we can start with
    a clean database instance; to do this, perform the following steps:


    +   1. Open the command line, and press Ctrl + C.


    +   2. This stops the running application. Now, enter the following command:


    ```

    $ meteor reset

    ```


    +   3. Restart your app, and you''re good to go. Just type the following command:


    ```

    $ meteor

    ```


    Note that the initial scores are random, so it won''t look exactly like it did
    before. The meteor reset command resets all the data collections and whatnot;
    so in a non-random app, the command will indeed reset the app cleanly.


    # # Making code changes


    Okay, we''ve got our application up and running in the browser, and we now want
    to see what happens when we make some code changes.


    One of the best features of Meteor is reactive programming. The following extract
    is taken from http://docs.meteor.com/#/full/reactivity:


    > Meteor embraces the concept of reactive programming. This means that you can
    write your code in a simple imperative style, and the result will be automatically
    recalculated whenever data changes that your code depends on.


    This principle applies to code changes too, which means that any changes that
    you make to the HTML, JavaScript, or database are automatically picked up and
    propagated.


    You don''t have to restart the application or even refresh your browser. All changes
    are incorporated in real time, and the application reactively accepts the changes.


    Let''s see an example.'
- md: " Chapter 1\n\n## Changing from Leaderboard to Yay Science!\n\nAs you become\
    \ more familiar with Meteor, you will come to learn that you can make changes\
    \ and add files pretty much whenever you want. You don't have to link anything\
    \ up, and you certainly don't have to redeploy before you can see the results.\
    \ You get to just play around, build wonderful things, and let Meteor take care\
    \ of all the crunchy stuff.\n\nTo see what we mean, let's change the title of\
    \ this application from **Leaderboard** to **Yay Science!** because, well, yay\
    \ science!\n\nFirst, make sure that the application is up and running. You can\
    \ do this by having an open browser window that is pointing to `http://localhost:3000/`.\
    \ If the app is running, you'll see your `leaderboard` application. If your application\
    \ isn't running, make sure to follow the steps previously given in the *Starting\
    \ the example application* section.\n\nNow, we need to open and edit the `leaderboard.html`\
    \ file. With your favorite text/code editor, open the `leaderboard.html` file\
    \ under the location, `~/Documents/Meteor/leaderboard/client/`, and change `title`\
    \ in the `head` section using the following lines of code:\n\n```\n<head>\n  \
    \  <title>Yay Science!</title>\n</head>\n```\n\nGo ahead and save the file, and\
    \ then look at your web browser. The page will automatically update, and you'll\
    \ see the title change. Earlier, it displayed the word **Leaderboard**:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_23_0.png)\n\
    \nHowever, now, after the execution of the preceding code, the title will display\
    \ our spiffy new **Yay Science!** page:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_23_1.png)\n\
    \n[ 7 ]\n\n## Setup and Installation\n\nThis is Meteor in action! It monitors\
    \ any changes to files, and when it sees that a file has changed, it tells your\
    \ browser that a change has been made and that it should refresh itself to get\
    \ the latest version.\n\nMoving forward, we're going to build an application from\
    \ scratch, so we don't want to make too many changes to this example application.\
    \ However, we still want to stay with our new theme rather than that generic old\
    \ leaderboard stuff. So, to do so, perform the following steps:\n\n- Back in your\
    \ text editor, on about the tenth line or so, we have the title label for our\
    \ leaderboard. Make the following change to the `<h1>` tag:\n\n  `<h1 class=\"\
    title\">Yay Science!</h1>`\n\n  Save this change, and you'll see the change reflected\
    \ in your browser. The title in our page will now look like this:\n\n  ![YAY SCIENCE!](image)\n\
    \n- Likewise, we don't give \"points\" to scientists. They're not trained monkeys,\
    \ dancing around for our amusement. They're scientists! We give them mad props\
    \ instead. In the `<div>` tag just below our title, make the following text change:\n\
    \n  `<div class=\"subtitle\">Select a scientist to give them **props**</div>`\n\
    \n  We also need to change the button text from the word points to the word props.\
    \ Towards the bottom half of the file, you'll find a `<button>` tag. Change the\
    \ text in that tag to the following:\n\n  `<button class=\"inc\">Give props</button>`\n\
    \n```\n<h1 class=\"title\">Yay Science!</h1>\n```\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_24_0.png)\n\
    \n```\n<div class=\"subtitle\">Select a scientist to give them **props**</div>\n\
    ```\n\n```\n<button class=\"inc\">Give props</button>\n```\n\nSave your changes,\
    \ and you will see the application update almost immediately:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_25_0.png)\n\
    \n- Just below the `<button>` tag, there is a message displayed if no scientist's\
    \ name is selected. It currently uses the word \"players\". We want to change\
    \ that to something a little more specific. To do this, make the following change\
    \ to the `<div>` message tag:\n\n```\n<div class=\"message\">Click a <strong>name</strong>\
    \ to select</div>\n```\n\nSave this change, and this time, refresh your browser.\
    \ Not because we need the change to take effect, but because we want to make sure\
    \ no scientist is highlighted so that we can verify our message text:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_25_1.png)\n\
    \n*Setup and Installation*\n\n## Summary\n\nGreat success! In this chapter, you've\
    \ successfully installed the Meteor framework, loaded an example application,\
    \ and made changes to that application by becoming familiar with file changes\
    \ and the reactive nature of Meteor.\n\nYou are now ready to start building your\
    \ very own Meteor application, and learn more about the elegant features and advantages\
    \ that come from developing with Meteor in the coming chapters.\n\n# 2\n\n## Reactive\
    \ Programming…\nIt's Alive!\n\nAs we learned in *Chapter 1, Setup and Installation*,\
    \ Meteor operates on a reactive programming model. This means that your templates\
    \ aren't only concerned with displaying data, but they are also listening for\
    \ changes to that data so that they can \"react\" to those changes. These areas\
    \ of data where the templates look for changes are called **reactive contexts**.\n\
    \nWe will now start developing a Lending Library application, lay the framework\
    \ for future chapters, and use Meteor's built-in reactive model to track and propagate\
    \ changes to our application to all clients that are listening.\n\nIn this chapter,\
    \ you will learn about:\n\n- Creating your first real application\n- Using reactive\
    \ programming to track and automatically update changes\n- Exploring and testing\
    \ changes made to your data from multiple browser windows\n\n## Creating the Lending\
    \ Library\n\nThere are two kinds of people in this world — those who remember\
    \ who they lent something to and those who buy a *lot* of stuff twice. If you're\
    \ one of the people who is on a first-name basis with your UPS delivery driver,\
    \ this application is for you!\n\nUsing Meteor, we're going to build a Lending\
    \ Library. We'll keep track of all our stuff and who we lent it to, so that the\
    \ next time we can't remember where we put our linear compression wrench, we can\
    \ simply look up who we lent it to last and get it back from them.\n\n# *Reactive\
    \ Programming...It's Alive!*\n\nAnd when that same friend says, \"Are you sure\
    \ you lent it to me?\", you can say, \"Yeah, STEVE, I'm sure I lent it to you!\
    \ I see you're enjoying your digital cable, thanks to my generous lending of said\
    \ linear compression wrench. Why don't you go find it so that I too can enjoy\
    \ the benefits of digital cable in my own home!\"\n\nOkay, okay, maybe STEVE forgot\
    \ too. Maybe he's a dirty liar, and he sold your wrench to pay for his deep-fried\
    \ Oreo® habit. Either way, you'll have your very own custom Meteor app that gives\
    \ you proof that you're not going crazy. And, if he did sell it for deep-fried\
    \ carnival food, at least you can make him share his stash with you while you\
    \ watch the game at his house.\n\n## Creating the base application\n\nThe first\
    \ thing we want to do is create the base application, similarly to what we did\
    \ in the first chapter, and we can then expand the base application to fit our\
    \ needs:\n\n- Start by navigating to your applications folder. This can be anywhere,\
    \ but as mentioned in our earlier chapter, we'll be working out of `~/Documents/Meteor`\
    \ as our root folder:\n\n  `$ cd ~/Documents/inės\n`: `,: `,: `\n'$ `,: ``, $\
    \ meteor\n```\n\nThis navigates to the Lending Library folder under `~/Documents/Meteor/LendLib`\
    \ and runs the application.\n\n- Open a browser and navigate to `http://localhost:3000/`.\
    \ You should see the following screen:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_29_0.png)\n\
    \n- **Welcome to Meteor!** is nice and all, but we are going to change this to\
    \ **Lending Library**. Open the `LendLib.html` file under `~/Documents/Meteor/LendLib/`\
    \ in your favorite editor. Towards the top (the sixth line or so), you'll see\
    \ the HTML code snippet that's responsible for our greeting. Go ahead and change\
    \ `Welcome to Meteor!` to `Lending Library`:\n\n```\n<body>\n  <h1>Lending Library</h1>\n\
    ```\n\n- Save the change. The page will refresh and will look like the following\
    \ screenshot:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_29_1.png)\n\nYou may\
    \ have noticed a reference to a template called `hello`, just below the title:\n\
    \n```\n{{> hello}}\n```\n\nThis is called the **template inclusion** because we\
    \ are including a template. By adding this to the body of our code, we instruct\
    \ Meteor to include the template named `hello` and append its contents inside\
    \ our `<body>` tag."
  mdcn: "\n 第1章\n\n## 从 Leaderboard 改为 Yay Science!\n\n随着你对 Meteor 越来越熟悉，你会了解到你可以在任何想要的时候进行更改和添加文件。你不需要链接任何东西，当然也不需要在看到结果之前重新部署。你只需要随意尝试，构建美好的事物，让\
    \ Meteor 来处理所有繁琐的事情。\n\n为了理解我们的意思，让我们把这个应用程序的标题从 **Leaderboard** 改为 **Yay Science!**，因为，嗯，科学万岁！\n\
    \n首先，确保应用程序正在运行。你可以通过打开一个浏览器窗口并指向 `http://localhost:3000/` 来实现。如果应用程序正在运行，你会看到你的\
    \ `leaderboard` 应用程序。如果你的应用程序没有运行，请务必按照前面 *Starting the example application* 部分给出的步骤操作。\n\
    \n现在，我们需要打开并编辑 `leaderboard.html` 文件。使用你喜欢的文本/代码编辑器，打开位于 `~/Documents/Meteor/leaderboard/client/`\
    \ 的 `leaderboard.html` 文件，并在 `head` 部分使用以下代码行更改 `title`：\n\n```\n<head>\n    <title>Yay\
    \ Science!</title>\n</head>\n```\n\n继续保存文件，然后查看你的网络浏览器。页面会自动更新，你会看到标题发生了变化。之前，它显示的是\
    \ **Leaderboard**：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_23_0.png)\n\n然而现在，在执行上述代码之后，标题将显示我们崭新的\
    \ **Yay Science!** 页面：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_23_1.png)\n\
    \n[ 7 ]\n\n## 设置与安装\n\n这就是 Meteor 的实际运作！它会监控文件的任何更改，当检测到文件发生变化时，它会告诉你的浏览器已经发生了更改，应该刷新以获取最新版本。\n\
    \n接下来，我们将从头开始构建一个应用程序，所以我们不想对这个示例应用程序做太多更改。不过，我们仍然希望保持我们的新主题，而不是那个老式的通用排行榜。因此，请执行以下步骤：\n\
    \n- 回到你的文本编辑器，在大约第十行左右，我们有排行榜的标题标签。对 `<h1>` 标签进行以下更改：\n\n  `<h1 class=\"title\"\
    >Yay Science!</h1>`\n\n  保存此更改，你会看到浏览器中反映出的变化。我们页面中的标题现在看起来像这样：\n\n  ![YAY SCIENCE!](image)\n\
    \n- 同样，我们不会给科学家\"分数\"。他们不是为我们表演而跳舞的训练有素的猴子。他们是科学家！相反，我们给予他们*狂热的支持*。在我们的标题下方的 `<div>`\
    \ 标签中，进行以下文本更改：\n\n  `<div class=\"subtitle\">Select a scientist to give them\
    \ **props**</div>`\n\n  我们还需要将按钮文本从单词 points 改为单词 props。在文件的下半部分，你会找到一个 `<button>`\
    \ 标签。将该标签中的文本更改为以下内容：\n\n  `<button class=\"inc\">Give props</button>`\n\n```\n\
    <h1 class=\"title\">Yay Science!</h1>\n```\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_24_0.png)\n\
    \n```\n<div class=\"subtitle\">Select a scientist to give them **props**</div>\n\
    ```\n\n```\n<button class=\"inc\">Give props</button>\n```\n\n保存你的更改，你会看到应用程序几乎立即更新：\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_25_0.png)\n\n- 在 `<button>` 标签下方，如果没有选择科学家的名字，会显示一条消息。它目前使用单词\
    \ \"players\"。我们想把它改成更具体一些的内容。为此，请对 `<div>` 消息标签进行以下更改：\n\n```\n<div class=\"\
    message\">Click a <strong>name</strong> to select</div>\n```\n\n保存此更改，这次，刷新你的浏览器。不是因为我们需要这个更改生效，而是因为我们想确保没有科学家被选中，以便我们可以验证我们的消息文本：\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_25_1.png)\n\n*设置与安装*\n\n## 小结\n\n大获成功！在本章中，你成功安装了\
    \ Meteor 框架，加载了一个示例应用程序，并通过熟悉文件更改和 Meteor 的响应式特性，对该应用程序进行了更改。\n\n你现在准备好开始构建你自己的\
    \ Meteor 应用程序了，并在接下来的章节中了解更多来自使用 Meteor 开发的优雅特性和优势。\n\n# 2\n\n## 响应式编程…\n它活了！\n\
    \n正如我们在 *第1章，设置与安装* 中学到的，Meteor 采用响应式编程模型运作。这意味着你的模板不仅负责显示数据，还会监听数据的变化，以便对这些变化\"\
    做出反应\"。模板寻找变化的这些数据区域称为 **响应式上下文**。\n\n我们现在将开始开发一个借阅图书馆应用程序，为未来的章节奠定基础，并使用 Meteor\
    \ 内置的响应式模型来跟踪和 propagate 更改到所有正在监听的客户端。\n\n在本章中，你将学习：\n\n- 创建你的第一个真正的应用程序\n- 使用响应式编程来跟踪和自动更新更改\n\
    - 从多个浏览器窗口探索并测试对你的数据所做的更改\n\n## 创建借阅图书馆\n\n这个世界上有两种人——那些记得把东西借给谁的人，和那些*大量*重复购买东西的人。如果你是那种与\
    \ UPS 送货司机以名字相称的人，这个应用程序就是为你准备的！\n\n使用 Meteor，我们将构建一个借阅图书馆。我们将跟踪我们所有的物品以及我们借给了谁，这样下次我们记不起把线性压缩扳手放在哪里时，我们只需查找上次借给了谁，然后从他们那里拿回来。\n\
    \n# *响应式编程…它活了！*\n\n当那个朋友说，\"你确定借给我了吗？\"，你可以说，\"是的，STEVE，我确定借给你了！我看到你正在享受你的数字有线电视，多亏了我慷慨借出的那个线性压缩扳手。你为什么不去找找呢，这样我也可以在我自己家里享受数字有线电视的好处！\"\
    \n\n好吧好吧，也许 STEVE 也忘了。也许他是个肮脏的骗子，把你的扳手卖了来支付他对油炸奥利奥®的嗜好。不管怎样，你将拥有你自己的定制 Meteor\
    \ 应用程序，证明你没有发疯。而且，如果他确实把它卖给了油炸嘉年华食品，至少你可以让他在他家看比赛的时候分你一些。\n\n## 创建基础应用程序\n\n我们首先要做的是创建基础应用程序，类似于我们在第一章中所做的，然后我们可以扩展基础应用程序以满足我们的需求：\n\
    \n- 首先导航到你的应用程序文件夹。这可以在任何地方，但正如我们在前面的章节中提到的，我们将在 `~/Documents/Meteor` 作为我们的根文件夹工作：\n\
    \n  `$ cd ~/Documents/Meteor/LendLib`\n  `$ meteor`\n\n  这会导航到 `~/Documents/Meteor/LendLib`\
    \ 下的借阅图书馆文件夹并运行应用程序。\n\n- 打开浏览器并导航到 `http://localhost:3000/`。你应该会看到以下屏幕：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_29_0.png)\n\
    \n- **Welcome to Meteor!** 很好，但我们要把它改成 **Lending Library**。在你喜欢的编辑器中打开 `~/Documents/Meteor/LendLib/`\
    \ 下的 `LendLib.html` 文件。在顶部（大约第六行），你会看到负责我们问候语的 HTML 代码片段。继续将 `Welcome to Meteor!`\
    \ 改为 `Lending Library`：\n\n```\n<body>\n  <h1>Lending Library</h1>\n```\n\n- 保存更改。页面将刷新，看起来会像下面的截图：\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_29_1.png)\n\n你可能注意到标题下方有一个名为 `hello`\
    \ 的模板引用：\n\n```\n{{> hello}}\n```\n\n这被称为 **模板包含**，因为我们正在包含一个模板。通过将其添加到代码的 body\
    \ 中，我们指示 Meteor 包含名为 `hello` 的模板，并将其内容附加到我们的 `<body>` 标签内。\n"
