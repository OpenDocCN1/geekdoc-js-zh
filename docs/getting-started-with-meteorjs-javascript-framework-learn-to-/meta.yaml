- img_proc: true
  md: "# Setup and Installation\n\nThis is Meteor in action! It monitors any changes\
    \ to files, and when it sees that a file has changed, it tells your browser that\
    \ a change has been made and that it should refresh itself to get the latest version.\n\
    \nMoving forward, we're going to build an application from scratch, so we don't\
    \ want to make too many changes to this example application. However, we still\
    \ want to stay with our new theme rather than that generic old leaderboard stuff.\
    \ So, to do so, perform the following steps:\n\n+   1. Back in your text editor,\
    \ on about the tenth line or so, we have the title label for our leaderboard.\
    \ Make the following change to the `<h1>` tag:\n\n   `<h1 class=\"title\">Yay\
    \ Science!</h1>`\n\n   Save this change, and you'll see the change reflected in\
    \ your browser. The title in our page will now look like this:\n\n   ![YAY SCIENCE!](image)\n\
    \n2. Likewise, we don't give \"points\" to scientists. They're not trained monkeys,\
    \ dancing around for our amusement. They're scientists! We give them mad props\
    \ instead. In the `<div>` tag just below our title, make the following text change:\n\
    \n   `<div class=\"subtitle\">Select a scientist to give them **props**</div>`\n\
    \n   We also need to change the button text from the word points to the word props.\
    \ Towards the bottom half of the file, you'll find a `<button>` tag. Change the\
    \ text in that tag to the following:\n\n   `<button class=\"inc\">Give props</button>`\n\
    \n```\n<h1 class=\"title\">Yay Science!</h1>\n```\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_24_0.png)\n\
    \n```\n<div class=\"subtitle\">Select a scientist to give them **props**</div>\n\
    ```\n\n```\n<button class=\"inc\">Give props</button>\n```"
