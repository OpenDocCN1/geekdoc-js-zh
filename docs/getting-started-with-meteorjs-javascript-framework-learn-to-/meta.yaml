    \ `LendLib.js` file under `~/Documents/Meteor/LendLib/`, and we can see some `Template`\
    \ functions:\n   \\`\\`\\`\n   Template.hello.helpers({ ...\n   \n   ...\n   \n\
    \   Template.hello.events({ ...\n   \\`\\`\\`\n   \n   These code chunks hook\
