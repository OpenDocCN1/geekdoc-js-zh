    ## About the Author


    **Isaac Strack** is a design technologist and STEM education advocate, currently
    working as a solutions consultant for Adobe Systems. With more than 15 years of
    experience in management information systems and web and creative technologies,
    Isaac has a strong background in modern web application development. He is the
    author of the Packt Publishing book *Meteor Cookbook* and the Packt Publishing
    video series *Learning Meteor Application Development*; he also assisted recently
    as a technical reviewer for another Packt Publishing book named *Building Single-page
    Web Apps with Meteor*. He holds a patent for online fraud detection and is a co-captain
    of the Salt Lake City Meteor Meetup group. He is an experienced lecturer/speaker.
    Isaac regularly mentors others at boot camps, training events, and conferences,
    such as UtahJS, DevMountain Meteor Day, NMC Summer Conference, Adobe workshops/events,
    and the Consumer Electronics Show (CES).


    > A huge thank you to my family, especially my mom, who have loved me despite
    instead of because. A shout out to my amazing daughters, without whom I wouldn''t
    be long for this world. Sunshine, Monkey, Boogers, Pig, this one is for you.


    ---


    ## About the Reviewers


    **Netanel Gilad** is an enthusiastic developer with expertise in web development.
    He loves to learn everything, from new web development frameworks to setting up
    a Continuous Integration environment to creating the ultimate application architecture.
    He has led a team and worked on a mission-critical C2 web application with high-performance
    requirements and an emphasis on UX. Netanel is currently working on multiple web-related
    projects and is a coauthor of the popular Meteor package angular-meteor, which
    brings the worlds of Angular and Meteor together.


    **Flávio Juvenal da Silva Junior** is a Brazilian software developer. He works
    at Vinta Software Studio (`http://www.vinta.com.br`), a software shop that uses
    state-of-the-art tools such as Django or Meteor to build web and mobile products
    from the backend to UX.


    He believes that programming is a mix of art and engineering; therefore, the programmer
    has the right to choose the best tools (such as Meteor) to transform clients''
    expectations into elegant solutions.


    **Arthur Pham** has been working for Thomson Reuters as a lead quantitative engineer
    since 2006. He has spent many years designing and implementing derivative pricing
    models and still loves to learn new programming languages such as F#, C++, Python,
    Flex/ActionScript, C#, Ruby, and JavaScript.


    He currently lives in New York, USA, and can be contacted on twitter at `@arthurpham`.


