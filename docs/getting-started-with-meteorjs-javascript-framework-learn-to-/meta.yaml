    \ library did more than get rid of the `publish` events. It also got rid of the\
    \ listeners/subscribers. We don't have any subscriber set up to listen on the\
    \ `Categories` publication channel. So, we need to add a subscriber event that\
    \ is tuned in to the `Categories` channel.\n\nWithin the `if (Meteor.isClient)`\
    \ function, at the very top just inside the opening bracket, enter the following\
