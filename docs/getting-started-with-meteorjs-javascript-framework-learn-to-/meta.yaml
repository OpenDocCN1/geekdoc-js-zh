    \ call as follows:\n\n```\n'keyup #add-category': function (e, t) {\n   ...\n\
    \   lists.insert({\n      Category: catVal,\n      owner: Meteor.userId()\n  \
    \ });\n   ...\n},\n```\n\nNow, whenever a new list is added, instead of just adding\
    \ a `Category` field, we will also add an owner field. This allows our `Meteor.publish()`\
    \ code to work correctly for any new `lists` that we make.\n\nLet's add back the\
    \ **Tools** Category, enter the item **Linear Compression Wrench** and assign\
