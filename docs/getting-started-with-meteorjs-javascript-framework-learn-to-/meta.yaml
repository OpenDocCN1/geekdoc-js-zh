    \ null;\n```\n\n在这里，我们声明了 `Template.list.items` 辅助函数，并检查是否选中了一个 `list`。如果选中了某个\
    \ `list`，会话变量 `current_list` 就会有值。如果它是 `null`，那就没有必要返回任何东西；所以我们直接返回 `null`。\n\n\
    > 这就是粘合剂在工作。它以反应式的方式读取给定类别的内容，并根据用户是否选择了列表，将其整合到 UI 的当前状态中。\n\n如果有选中内容，我们首先需要找到该类别。我们将其命名为\
    \ `cats`，因为它更短，尽管严格来说这并不是最佳的命名规范。但我们又何必在意呢？我们是出于乐趣才做这件事的，而且猫很棒！\n\n```\nelse {\n\
    \  var cats = lists.findOne({_id:Session.get('current_list')});\n```\n\n我们使用了\
    \ MongoDB 命令 `findOne()`，并将 `current_list` 会话参数作为 `_id` 传递给选择器/查询。如果有选中的内容，我们会得到一个类别/列表。让我们确认确实返回了结果，并且我们也得到了\
    \ `items`。\n\n如果没有返回结果，或者该类别中没有 `items`，我们实际上就不需要去确定 `Lendee` 或 `LendClass` 了，对吧？所以，让我们创建一个\
    \ `if` 语句，并在 `if` 内部添加一个 `for` 语句，只有在有值得迭代的内容时才会执行：\n\n```\nif (cats && cats.items)\
    \ {\n  for (var i = 0; i < cats.items.length; i++) {\n    var itm = cats.items[i];\n\
    \    itm.Lendee = itm.LentTo ? itm.LentTo :\n    \"free\";\n    itm.LendClass\
    \ = itm.LentTo ?\n      \"label-danger\" : \"label-success\";\n  }\n  return cats.items;\n\
    };\n```\n\n首先，我们检查 `cats` 和 `cats.items` 是否不是 `undefined`/`null`。\n\n接下来，我们遍历\
    \ `items` 中的所有值（如果你还记得的话，`items` 是一个数组）。为了方便起见，我们声明变量 `itm = cats.item[i]`。\n\n\
    ## 模板\n\n然后，我们添加 `Lendee` 属性，检查该物品是否通过 `LentTo` 属性借给了某人。如果没有（如果 `LentTo` 不存在），我们将改为分配字符串\
    \ \"free\"。\n\n同样，如果 `LentTo` 存在，我们将红色的 bootstrap 标签类 `label-important` 声明为 `LendClass`。如果物品未借出，我们将改用绿色的\
    \ bootstrap 类 `label-success`。\n\n最后，在我们为新的 `Lendee` 和 `LendClass` 属性赋值后，我们返回\
    \ `cats.items`。我们没有将这些属性保存到数据集合中。这是因为它们不是数据集合的一部分。它们被 Blaze 用于修改我们 UI 的外观和感觉，所以我们只需要通过模板辅助函数使它们可用即可。\n\
    \n## 额外的视图状态\n\n我们现在需要为所有不同的视图状态声明模板。也就是说，我们需要向模板添加属性，以便让我们知道正在查看什么、正在编辑什么，以及什么应该隐藏/显示。具体来说，我们需要在四种情况下访问状态值：\n\
    \n- 我们正在查看哪个列表？（`list_status`）\n- 我们是否正在查看一个列表？（`list_selected`）\n- 我们是否正在向列表添加项目？（`list_adding`）\n\
    - 我们是否正在更新借入者？（`lendee_editing`）\n\n`list_status` 属性将附加到每个类别上。如果该类别被选中（如果 `current_id`\
    \ 被设置为该类别的 `id`），我们将颜色从 `btn-primary`（蓝色）改为 `btn-info`（浅蓝色）。由于它是类别上的一个属性，我们需要将其添加到\
    \ `Template.categories.helpers()` 部分。为此，请在 `new_cat` 模板辅助函数下方添加以下代码：\n\n```\n\
    new_cat: function () {\n  ...\n},\nlist_status: function () {\n  if (Session.equals('current_list',\
    \ this._id))\n    return \" btn-info\";\n  else\n    return \" btn-primary\";\n\
    }\n```\n\n其余的属性属于 `lists` 和 `list items`，因此我们将以下代码添加到 `Template.lists.helpers()`\
    \ 方法中，就在 `items` 模板辅助函数的下方：\n\n```\nitems: function () {\n  ...\n},\nlist_selected:\
    \ function () {\n  return ((Session.get('current_list') != null) && (!Session.equals(\n\
    \    'current_list', null)));\n},\nlist_adding: function () {\n  return (Session.equals('list_adding',\
    \ true));\n},\nlendee_editing: function () {\n  return (Session.equals('lendee_input',\
    \ this.Name));\n}\n```\n\n让我们逐一了解这些模板函数。\n\n```\nlist_selected: function () {\n\
    \  return ((Session.get('current_list') != null) && (\n    !Session.equals('current_list',\
    \ null)));\n},\n```\n\n会话变量 `current_list` 可能是 `undefined` 或 `null`。如果是 `undefined`，那么\
    \ `Session.equals('current_list', null)` 将返回 `true`。所以很遗憾，我们需要检查这两种情况。\n\n```\n\
    list_status: function () {\n  if (Session.equals('current_list', this._id))\n\
    \    return \" btn-info\";\n  else\n    return \" btn-primary\";\n}\n```\n\n现在，`list_status`\
    \ 用于告诉类别按钮它是否应该显示为选中状态。最简单的方法是通过 CSS 类来实现。Bootstrap 使用 `btn-primary` 来显示白字蓝底，但这是默认的外观和感觉。对于选中的类别，我们将使用\
    \ `btn-info` 类将背景色改为浅蓝色。\n\n换句话说，对于 `current_list`，我们将返回 `btn-info`。对于所有其他的 `lists`/类别，我们将返回\
    \ `\"btn-inverse\"` 来更改 CSS 样式。\n\n## 模板\n\n你可能对 `this._id` 感到好奇。在这个实例中，`this`\
    \ 指的是 MongoDB 记录（技术上称为 **文档游标**），而 `._id` 是该记录的唯一 MongoDB 标识符。这被称为 **上下文**，在这种情况下，当使用\
    \ HTML 模板时，上下文被隐含为调用模板的列表/类别元素。\n\n```\nlist_adding: function () {\n  return (Session.equals('list_adding',\
    \ true));\n},\n```\n\n这个非常简单。如果 `Session` 变量 `list_adding` 为 `true`，我们就将它添加到列表中。如果不是，就不添加。\n\
    \n```\nlendee_editing: function () {\n  return (Session.equals('lendee_input',\
    \ this.Name));\n}\n```\n\n要检查我们是否处于\"借入者编辑\"模式，我们将检查 `Session` 变量 `lendee_input`，看看它是否有值，以及该值是否是我们刚刚点击的物品的\
    \ `Name`。同样，这是隐含的上下文。这一次，它不是列表，而是物品。我们如何知道这一点？因为这个函数是从哪里调用的。还记得 HTML 代码吗？\n\n\
    ```\n<div class=\"lending_item list-group-item\">\n  <button type=\"button\"\n\
    \  class=\"close delete_item\">×</button>\n  {{Name}}\n  {{#if lendee_editing}}\n\
    ```\n\n注意我们在 `if` 语句中使用 `lendee_editing` 的位置，就在我们使用 `{{Name}}` 之后。这向我们展示了上下文。`LendLib.js`\
    \ 中的 `this.Name` 语句与 `LendLib.html` 中的 `{{Name}}` 具有相同的上下文。换句话说，`this.Name` 引用的是与\
    \ `{{Name}}` 相同的属性。\n\n既然我们讲到了 HTML 模板，还有一个对 HTML `categories` 模板的更改需要完成。我们等到现在才讲，是为了让这次更改更容易理解。当你进行以下代码更改时，你会看到\
    \ `{{list_status}}` 和 `{{_id}}` 模板是如何使用的，以及为什么 `this._id` 的上下文突然变得合理了。\n\n请在 `LendLib.html`\
    \ 中找到以下行（大约从第 27 行开始）：\n\n```\n{{#each lists}}\n  <div class=\"category btn btn-primary\"\
    >\n    {{Category}}\n```\n"
