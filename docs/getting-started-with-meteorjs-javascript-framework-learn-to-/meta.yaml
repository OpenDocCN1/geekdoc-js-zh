- img_proc: true
  md: '# Using your own hostname


    But wait, there''s more! You can even use one of your own hostnames with an app
    that you deploy on Meteor''s servers. Set up a CNAME pointing to `origin.meteor.com`
    using your host provider, and you can then deploy your app to that hostname. For
    example, if we had the `meteor.tool1.com` subdomain pointing as a CNAME to `origin.meteor.com`,
    we would run the following command in the terminal:


    ```

    $ meteor deploy meteor.tool1.com

    ```


    If your CNAME is set up properly, the app will deploy just as it would if you
    were to deploy directly to `[your app name].meteor.com` and will be available
    with your customized hostname!


    > Check with your host provider about setting up a CNAME route. It varies from
    provider to provider, but it''s pretty easy to do.


    # Deploying your application to a custom server


    At the time of writing, deploying a Meteor application to either a hosting service
    or to your own personal machine is a pretty hefty task. There are versioning issues
    with deployment, and most hosting services are still in the early stages of supporting
    Meteor bundles.


    That being said, Meteor is working on a really slick deployment service (nicknamed
    Galaxy), and we have a pretty great third-party plugin available with us called
    Meteor Up (MUP), which was developed by the incomparable Arunoda Susiripala at
    `http://meteorhacks.com`. Let''s walk you through deploying our Meteor application
    to a custom server using MUP.


    # The server setup


    The server from which you''ll be hosting your application needs to have the latest
    *stable* version of Node.


    To Install Node.js, go to `http://nodejs.org/` and follow the instructions for
    either Linux or Mac OS X installation.


    MUP will install the correct MongoDB version that we need on our remote server,
    so we don''t need to worry about that, at least not for testing purposes.'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# Packaging and Deploying


    Alternatively, you could set up MongoDB on a remote server or use a hosting service
    such as MongoHQ (`https://www.mongohq.com`). If you do use a remote service, set
    up a new database and note the URI that you''ll need. An example from MongoHQ
    is shown here:


    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_126_0.png)


    # Installing and configuring MUP


    You will need Meteor Up installed on your client machine, and that''s super easy
    to do, so let''s make it happen!


    In a terminal window, execute the following command:


    ```

    $ npm install -g mup

    ```


    Note that you may need to use the `sudo` command, depending on your user permission
    settings. The preceding command installs the MUP module globally, so we can use
    it wherever we like. After the installation is finished, make sure that your application
    is stopped and that you are in the root folder of your project (`~/Documents/Meteor/LendLib`).
    We will now initialize MUP in our project. In the terminal, execute the following
    command:


    ```

    $ mup init

    ```


    This will generate a configuration file named `mup.json` in the root directory.
    Go ahead and open the file. You will see the name of the server to which you''d
    like to deploy your app at the top. You will also see a username / password /
    pem properties section. These fields are necessary so that MUP can log into your
    remote hosting server and configure it properly.'
  merge: -1
  pgno: 126
- img_proc: true
  md: "You will need to fill in the fields with your SSH login information. If the\
    \ address for your remote server were `http://myserver.com`, you would enter the\
    \ following code snippet:\n\n```\n{\n    \"host\": \"myserver.com\",\n    \"username\"\
    : \"root\",\n    \"password\": \"SUPERHARDTOGUESpassword\"\n    // or pem file\
    \ (ssh based authentication)\n    //\"pem\": \"~/.ssh/id_rsa\"\n}\n```\n\nThe\
    \ next section asks us whether we want to set up MongoDB and Node. If your remote\
    \ server is already running these, there's no need to install them now; so, you\
    \ can turn the values to `false`. If you leave the values as `true`, it will re-install\
    \ both Node and MongoDB. It's up to you. Here, we will leave the values as true:\n\
    \n```\n\"setupMongo\": true,\n\n\"setupNode\": true,\n\n\"nodeVersion\": \"0.10.33\"\
    ,\n```\n\nPhantomJS is also a necessary component. During the first deployment\
    \ of the app, we will leave the `setupPhantom` property set to `true` so that\
    \ PhantomJS will be installed. However, on subsequent deployments, it's entirely\
    \ up to you. Here's how we used it for the first run:\n\n```\n\"setupPhantom\"\
    : true,\n```\n\nSince the name of our app is Lending Library, we will be changing\
    \ the `appName` property to the following:\n\n```\n\"appName\": \"LendLib\",\n\
    ```\n\nThe next property tells MUP where to look on your client machine for the\
    \ source files so that they can be bundled and uploaded to your remote server.\
    \ In our case, we would enter the following line of code:\n\n```\n\"app\": \"\
    ~/Documents/Meteor/LendLib\",\n```"
  merge: -1
  pgno: 127
- img_proc: true
  md: "# *Packaging and Deploying*\n\nThe last property is the `env` property, which\
    \ specifies how to reach your app once it's deployed. Usually, the `env.ROOT_URL`\
    \ property will be set to the `localhost` address: `http://localhost`. We can\
    \ then specify a `PORT` property if we like. If our `ROOT_URL` is set to `http://myserver.com`\
    \ and the `PORT` property is set to `8080`, our declaration would look like this:\n\
    \n```\n\"env\": {\n  \"ROOT_URL\": \"http://myserver.com\",\n  \"PORT\": 8080\n\
    },\n```\n\n> If you want to deploy your app using port `80`, you must have root\
    \ privileges on the remote server, for security reasons.\n\n# **Deploying your\
    \ app using MUP**\n\nWith our `mup.json` file in place, it's time to initialize\
    \ our remote server and let it install the software as needed. In the terminal\
    \ window, enter the following command:\n\n```\n$ mup setup\n```\n\nThis will install\
    \ MongoDB, Node, and PhantomJS on the remote server. It will also configure our\
    \ remote server environment and install some helper NPM packages, such as `upstart`.\n\
    \nOnce the `mup setup` command completes, we will be ready to deploy your app.\
    \ Execute the following command in the terminal window:\n\n```\n$ mup deploy\n\
    ```\n\nMUP will bundle your app locally, upload the build, configure the requisite\
    \ NPM packages on the remote server, and then serve up your app. As it runs through\
    \ this process, MUP will give you status updates in the terminal."
  merge: -1
  pgno: 128
- img_proc: true
  md: 'Once the app is deployed, we can navigate in a browser to your app''s URL and
    check out your brand new, fully deployed app, which will look similar to the following
    screenshot:


    ![](img/7f7e12e0d033ce0da0b4cc264e74d883_129_0.png)


    As we rushed through the basics of using MUP, there were several topics that we
    didn''t cover, including setting up a reverse-proxy, load balancing, and DNS entries.
    We are making the assumption that if you want to deploy your app manually, you
    have some prior experience with setting up your server environment properly.


    > All MUP configuration settings and more detailed instructions for a MUP installation
    can be found at `https://github.com/arunoda/meteor-up`.


    You can go even further with deployment, such as setting up environment variables,
    running your app as a daemon/service, or even using remote servers to publicly
    host your application. What we''ve done so far should be sufficient to get you
    started and be well on your way to use Meteor in a production environment.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# Packaging and Deploying


    # Summary


    You made it! In no time at all, you built a working application and, hopefully,
    had fun doing it! You now know how to build an application in Meteor from the
    ground up. You understand the design patterns and development principles behind
    Meteor, and you can tailor, optimize, and secure your application to do anything
    you want. You can also deploy Meteor to multiple environments. You are well on
    your way to writing productive, efficient, and rock-solid web applications.


    The very best way to gain more knowledge about Meteor is to use it. We suggest
    using Meteor in your upcoming development projects, contributing to the Meteor
    community through code contributions, answering questions on the forums, and making
    tutorials of your own.


    Meteor is a breakthrough technology, which is gaining more and more momentum.
    You now have the knowledge and experience that you need to use this breakthrough
    technology in your personal and professional development projects, keeping you
    well ahead of the curve and making your life as a developer that much more rewarding.'
  merge: -1
