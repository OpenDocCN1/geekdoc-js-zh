  md: "You will see the following error message, or something similar to it:\n\n```\n\
    app/LendLibClient.js:21\n  Meteor.subscribe(\"Categories\");\n         ^\nTypeError:\
    \ Object #<Object> has no method 'subscribe'\n    at app/LendLibClient.js:21:11\n\
    ...\nExited with code: 8\nYour application is crashing. Waiting for file change.\n\
    ```\n\nRemoving the `if` condition has created a situation where the server part\
    \ of Meteor is trying to run the client-facing code. It doesn't know what to do\
    \ with it, so the app is crashing. We're going to fix the situation by using a\
    \ folder structure.\n\nIf you recall, when we implemented Twitter Bootstrap, we\
    \ created the `client` folder. Meteor identifies the `client` folder, and it will\
    \ run any JavaScript files it finds there exclusively as client-facing code and\
    \ not on the server side.\n\nMove (cut-paste, click-drag, or using mv) the `LendLibClient.js`\
    \ file from `~/Documents/Meteor/LendLib/` to `~/Documents/Meteor/LendLib/client/`.\
    \ This will instantly fix our crashing app, and Meteor will be happy again! You'll\
    \ see the following message in the console:\n\n```\n=> Modified -- restarting.\n\
    ```\n\nSince we moved `LendLibClient.js` to the `client` folder, the `if` condition\
    \ is no longer needed. Due to the file location, Meteor knows that the code is\
    \ only intended to be run on the client, so it doesn't try to run it on the server.\n\
    \n> You may want to refresh your browser that is pointing to `http://localhost:3000`.\n\
    This is because you crashed the application. Repent of your evil ways and refresh\
    \ your page to ensure that everything runs as it should.\n\nLet's now do the same\
    \ thing with the server code. Create a new folder named `server`. You can do this\
    \ through a Finder window or directly in the command line as follows:\n\n```\n\
