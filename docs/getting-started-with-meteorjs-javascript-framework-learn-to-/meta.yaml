- md: " *Data – Meteor Style!*\n\n## Configuring publishers\n\nUp to this point, we\
    \ have been using a Meteor package named **autopublish**. This means that we haven't\
    \ had to code specific `publish` events for changes to be broadcast from the server\
    \ to the client. This is great for testing, but we want to have a bit more control\
    \ over what events and documents get published so that we can improve both performance\
    \ and security.\n\nIf we have a large dataset, we may not want to return the entire\
    \ collection every time. If `autopublish` is being used, the entire collection\
    \ will return, and this can slow things down or expose data that we don't want\
    \ to expose.\n\n## Turning off autopublish\n\nThe time has come to turn off `autopublish`.\
    \ Temporarily stop your Meteor application (if it's still running) by opening\
    \ the terminal window from which you ran the `meteor` command. You can stop it\
    \ by pressing *Ctrl* + *C*. Once it's stopped, enter the following command:\n\n\
    ```\n> meteor remove autopublish\n```\n\nThis removes the `autopublish` package,\
    \ which is responsible for all the automatic publishing of all events inside Meteor.\n\
    \n> It's considered a best practice to remove `autopublish` from your project.\
    \ The `autopublish` package is for developing and debugging and should be turned\
    \ off when you're ready to start using your application in earnest.\n\nBy turning\
    \ this off, you've effectively disabled your application from doing anything!\
    \ Congratulations! You can see your amazing progress by starting up your Meteor\
    \ service again (to do this, enter the `meteor` command and press *Enter*) and\
    \ by opening/navigating to `http://localhost:3000`. You will then see the following\
    \ screen:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_90_0.png)\n\n[74]\n\nThe\
    \ `categories`/`lists` are gone! You can even check the console if you like. To\
    \ do this, enter the following command:\n\n```\n> lists.find().count()\n```\n\n\
    You should see a count value of 6 or more, but you will instead see a count of\
    \ 0:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_91_0.png)\n\nWhat gives? Well,\
    \ it's pretty simple actually. Since we removed the `autopublish` library, the\
    \ server is no longer able to broadcast changes to the client.\n\nWhy, again,\
    \ did we do this? What's the purpose of breaking our application? Ah! Because\
    \ we want to make our application more efficient and secure. Instead of getting\
    \ every record automatically, we're going to just get the records that we need\
    \ and the minimum set of data fields from those records.\n\n### Listing Categories\n\
    \nIn `LendLib.js`, inside the `if (Meteor.isServer)` block, create the following\
    \ `Meteor.publish` function:\n\n```\nMeteor.startup(function () {\n  Meteor.publish(\"\
    Categories\", function() {\n    return lists.find({},{fields:{Category:1}});\n\
    \  });\n});\n```\n\nThis tells the server to create a `Categories` publication.\
    \ The server will publish this whenever a change is made to the variables found\
    \ inside the function; in this case, it's `lists.find()`. Whenever a change is\
    \ made that would affect the results of `lists.find()`, Meteor will trigger/update\
    \ the publication.\n\nIf you noticed, the `lists.find()` call isn't empty. There's\
    \ a selector, `{fields:{Category:1}}`. This selector tells the `lists.find()`\
    \ call to only return the specified `fields:`. And only one field is specified\
    \ — `{Category:1}`.\n\nThe preceding snippet of JSON tells the selector that we\
    \ want to get the `Category` field (`1` = `true` and `0` = `false`). Since this\
    \ is the only field mentioned and it's set to `1` (`true`), Meteor assumes that\
    \ you want to *exclude* all other properties. If you had only fields set to `0`\
    \ (`false`), Meteor would assume that you want to *include* all the other fields\
    \ that you didn't mention.\n\n> For more information on the `find()` function,\
    \ consult the MongoDB documentation at `http://docs.mongodb.org/manual/applications/crud/`.\n\
    \nSo, if you save this change, your browser will refresh and nothing will happen\
    \ to the display!\n\nWhy? As you may have guessed, removing the `autopublish`\
    \ library did more than get rid of the `publish` events. It also got rid of the\
    \ listeners/subscribers. We don't have any subscriber set up to listen on the\
    \ `Categories` publication channel. So, we need to add a subscriber event that\
    \ is tuned in to the `Categories` channel.\n\nWithin the `if (Meteor.isClient)`\
    \ function, at the very top just inside the opening bracket, enter the following\
    \ highlighted line of code_stub_0 fof code:\n\n```\nif (Meteor.isClient) {\n \
    \ Meteor.subscribe(\"Categories\");\n```\n\nSave this change and you will now\
    \ see your `Categories` back where they belong:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_92_0.png)\n\
    \nBefore we celebrate, go ahead, and click on the **Clothes** category:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_93_0.png)\n\
    \nOur favorite shirt is missing! As you probably figured out by now, this is because\
    \ the publish event that we set up was very specific. The only field in the `Categories`\
    \ channel that is being published is the `Category` field. All the other fields,\
    \ including our `items` (and therefore, our favorite shirt), are not being broadcast.\n\
    \nLet's double-check this. Click on the `+` button inside the **Clothes** category\
    \ in your browser, type **Red Hooded Sweatshirt**, and *press Enter*. The new\
    \ entry will appear for a split second, and then, it will disappear. This is because\
    \ of local caching and server sync.\n\nWhen you enter the new `item`, the local\
    \ cache contains a copy. This `item` is temporarily visible to your client. However,\
    \ when the sync with the server occurs, the server update only publishes the `Category`\
    \ field; so, when the server model updates the local model, the `item` is no longer\
    \ included.\n\nLet's do one more test, just for funzies. In your terminal window,\
    \ stop the Meteor service (*Ctrl + C*). Now, in your browser, enter another `item`\
    \ in the **Clothes** category (we'll use `Pumped Up Kicks`). Since the service\
    \ is stopped, no sync happens with the server, so you're using your local cache\
    \ and there is your `item`:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_94_0.png)\n\
    \nNow, start your server again. Your client will sync with the server, and poof!\
    \ Your item will be gone again:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_94_1.png)\n\
    \n## Listing items\n\nThis is no good because we want to see our items. So, let's\
    \ add items back in and grab the appropriate list of items whenever a category\
    \ is selected. In `LendLib.js`, just below our first `Meteor.publish()` function\
    \ and inside the `if (Meteor.isServer)` block, add the following function:\n\n\
    ```\nMeteor.publish(\"listdetails\", function(category_id){\n  return lists.find({_id:category_id});\n\
    });\n```\n\nThis `publish` function will publish on the `listdetails` channel.\
    \ Any listener/subscriber will need to provide the `category_id` variable so that\
    \ our `find()` function returns a leaner recordset.\n\nNotice that nothing has\
    \ changed in our client yet (your items still aren't visible). This is because\
    \ we need to create the `subscribe` function.\n\nJust below our first `Meteor.subscribe()`\
    \ function, add the following function:\n\n```\nTracker.autorun(function() {\n\
    \  Meteor.subscribe(\"listdetails\", Session.get('current_list'));\n});\n```\n\
    \nSave your changes and check out your swag **Clothes** collection!\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_95_0.png)\n\
    \nLet's look under the hood here for a minute and figure out what just happened.\
    \ Notice that the subscription uses `Session.get('current_list')`. This is a reactive\
    \ context. The `Tracker.autorun()` method is a reactive computation. This means\
    \ that, any time the `current_list` variable changes, `Tracker.autorun()` re-runs\
    \ itself and the subscription is updated with the new ID found in the `current_list`\
    \ variable.\n\nIf you remember from *Chapter 4, Templates*, we have a `click`\
    \ event handler set up to listen for `Category` changes. When you click on **Clothes**,\
    \ for example, an event fires. The `selectCategory()` function inside `LendLib.js`\
    \ handles the event and changes our `Session` variable:\n\n```\nfunction selectCategory(e,t){\n\
    \  Session.set('current_list',this._id);\n}\n```\n\nWith the `Session` variable\
    \ changed, the subscription is re-run. This leads to the `lists` collection being\
    \ modified (different records for a different `Category`), which then cascades\
    \ to the helpers templates. Everything reacts to the changes.\n\nIn other words,\
    \ the following actions take place:\n\n1. `Session.set()` modifies the `current_list`\
    \ variable.\n2. `Tracker.autorun()` re-runs, causing the `Meteor.subscribe()`\
    \ function to refresh the `lists` collection.\n3. Any templates or template helpers\
    \ that contain the `lists` collection are re-run, and the UI is updated.\n\n##\
    \ Checking your streamlined data\n\nThe display is now no different from when\
    \ we started this chapter. However, underneath the display, the model is much\
    \ leaner. With the **Clothes** category selected, run the following command in\
    \ the browser console:\n\n```\n> lists.findOne({Category:\"DVDs\"})\n```\n\nExpand\
    \ `Object`, and you'll see that no items are listed:\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_96_0.png)"
  mdcn: "\n *数据——Meteor 风格！*\n\n## 配置发布者\n\n到目前为止，我们一直在使用一个名为 **autopublish** 的 Meteor\
    \ 包。这意味着我们无需编写特定的 `publish` 事件，变更就能从服务器广播到客户端。这对于测试来说非常方便，但我们需要对发布的事件和文档有更强的控制力，以提升性能和安全性。\n\
    \n如果我们有一个大型数据集，可能不想每次都返回整个集合。如果使用 `autopublish`，整个集合都会返回，这会拖慢速度或暴露我们不想暴露的数据。\n\
    \n## 关闭 autopublish\n\n是时候关闭 `autopublish` 了。暂时停止你的 Meteor 应用（如果它还在运行），打开你运行 `meteor`\
    \ 命令的终端窗口。你可以通过按 *Ctrl* + *C* 来停止。停止后，输入以下命令：\n\n```\n> meteor remove autopublish\n\
    ```\n\n这移除了 `autopublish` 包，它负责 Meteor 中所有事件的自动发布。\n\n> 最佳实践是从项目中移除 `autopublish`。`autopublish`\
    \ 包用于开发和调试，当你准备认真使用应用时应该关闭它。\n\n关闭之后，你的应用实际上就什么都做不了了！恭喜你！你可以再次启动 Meteor 服务（要做到这一点，输入\
    \ `meteor` 命令并按 *Enter*），然后打开/导航到 `http://localhost:3000` 来查看你惊人的进展。然后你会看到以下界面：\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_90_0.png)\n\n[74]\n\n`categories`/`lists`\
    \ 不见了！如果你愿意，甚至可以检查控制台。要做到这一点，输入以下命令：\n\n```\n> lists.find().count()\n```\n\n你应该看到\
    \ 6 或更大的计数值，但你会看到计数为 0：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_91_0.png)\n\
    \n怎么回事？其实非常简单。因为我们移除了 `autopublish` 库，服务器就无法再向客户端广播变更了。\n\n为什么，再说一遍，我们要这样做？破坏我们的应用有什么目的？啊！因为我们想让应用更高效、更安全。与其自动获取每条记录，我们只获取需要的记录以及这些记录中最低限度的数据字段。\n\
    \n### 列出分类\n\n在 `LendLib.js` 中，在 `if (Meteor.isServer)` 代码块内，创建以下 `Meteor.publish`\
    \ 函数：\n\n```\nMeteor.startup(function () {\n  Meteor.publish(\"Categories\", function()\
    \ {\n    return lists.find({},{fields:{Category:1}});\n  });\n});\n```\n\n这告诉服务器创建一个\
    \ `Categories` 发布。每当函数内的变量发生变更时，服务器就会发布这个；在本例中，是 `lists.find()`。每当发生可能影响 `lists.find()`\
    \ 结果的变更时，Meteor 就会触发/更新该发布。\n\n你可能注意到了，`lists.find()` 调用不是空的。有一个选择器 `{fields:{Category:1}}`。这个选择器告诉\
    \ `lists.find()` 调用只返回指定的 `fields:`。而只指定了一个字段 — `{Category:1}`。\n\n前面这段 JSON 告诉选择器，我们想要获取\
    \ `Category` 字段（`1` = `true`，`0` = `false`）。由于这是唯一提到的字段且设置为 `1`（`true`），Meteor\
    \ 假设你想*排除*所有其他属性。如果你只有字段设置为 `0`（`false`），Meteor 会假设你想*包含*所有你没提到的其他字段。\n\n> 有关\
    \ `find()` 函数的更多信息，请查阅 MongoDB 文档：`http://docs.mongodb.org/manual/applications/crud/`。\n\
    \n所以，如果你保存这个变更，浏览器会刷新，但显示上不会有任何变化！\n\n为什么？如你所猜测的，移除 `autopublish` 库不仅仅是去掉了 `publish`\
    \ 事件。它还去掉了监听器/订阅者。我们没有设置任何监听器来监听 `Categories` 发布频道。因此，我们需要添加一个订阅事件，使其调谐到 `Categories`\
    \ 频道。\n\n在 `if (Meteor.isClient)` 函数中，在紧接开始括号的最顶部，输入以下高亮显示的代码行：\n\n```\nif (Meteor.isClient)\
    \ {\n  Meteor.subscribe(\"Categories\");\n```\n\n保存这个变更，你现在会看到 `Categories` 回到它们应该在的位置：\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_92_0.png)\n\n在我们庆祝之前，继续点击 **Clothes**\
    \ 分类：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_93_0.png)\n\n我们最喜欢的衬衫不见了！正如你现在可能已经明白的，这是因为我们设置的发布事件非常具体。`Categories`\
    \ 频道中正在发布的唯一字段是 `Category` 字段。所有其他字段，包括我们的 `items`（因此，我们最喜欢的衬衫），都不会被广播。\n\n让我们再确认一下。点击浏览器中\
    \ **Clothes** 分类内的 `+` 按钮，输入 **Red Hooded Sweatshirt**，然后 *按 Enter*。新条目会出现一瞬间，然后消失。这是因为本地缓存和服务器同步。\n\
    \n当你输入新的 `item` 时，本地缓存包含一份副本。这个 `item` 对你的客户端暂时可见。然而，当与服务器同步时，服务器更新只发布 `Category`\
    \ 字段；所以当服务器模型更新本地模型时，`item` 不再被包含。\n\n让我们再做一次测试，只是为了好玩。在你的终端窗口中，停止 Meteor 服务（*Ctrl\
    \ + C*）。现在，在你的浏览器中，在 **Clothes** 分类中输入另一个 `item`（我们用 `Pumped Up Kicks`）。由于服务已停止，不会发生与服务器的同步，所以你使用的是本地缓存，你的\
    \ `item` 就在那里：\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_94_0.png)\n\n现在，再次启动你的服务器。你的客户端将与服务器同步，噗！你的条目又会消失：\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_94_1.png)\n\n## 列出品目\n\n这不好，因为我们想看到我们的品目。所以，让我们把品目加回来，并在选择分类时获取适当的品目列表。在\
    \ `LendLib.js` 中，在我们的第一个 `Meteor.publish()` 函数下方，且在 `if (Meteor.isServer)` 代码块内，添加以下函数：\n\
    \n```\nMeteor.publish(\"listdetails\", function(category_id){\n  return lists.find({_id:category_id});\n\
    });\n```\n\n这个 `publish` 函数将在 `listdetails` 频道上发布。任何监听器/订阅者都需要提供 `category_id`\
    \ 变量，这样我们的 `find()` 函数才能返回更精简的记录集。\n\n注意，客户端还没有任何变化（你的品目仍然不可见）。这是因为我梦需要创建 `subscribe`\
    \ 函数。\n\n在我们的第一个 `Meteor.subscribe()` 函数下方，添加以下函数：\n\n```\nTracker.autorun(function()\
    \ {\n  Meteor.subscribe(\"listdetails\", Session.get('current_list'));\n});\n\
    ```\n\n保存你的更改，看看你的酷炫 **Clothes** 集合！\n\n![](img/7f7e12e0d033ce0da0b4cc264e74d883_95_0.png)\n\
    \n让我们在这里深入了解一下刚刚发生了什么。注意订阅使用了 `Session.get('current_list')`。这是一个响应式上下文。`Tracker.autorun()`\
    \ 方法是响应式计算。这意味着，每当 `current_list` 变量发生变化时，`Tracker.autorun()` 会重新运行自身，订阅也会用 `current_list`\
    \ 变量中找到的新 ID 更新。\n\n如果你还记得 *第 4 章，模板*，我们设置了一个 `click` 事件处理器来监听 `Category` 变化。例如，当你点击\
    \ **Clothes** 时，会触发一个事件。`LendLib.js` 中的 `selectCategory()` 函数处理该事件并更改我们的 `Session`\
    \ 变量：\n\n```\nfunction selectCategory(e,t){\n  Session.set('current_list',this._id);\n\
    }\n```\n\n随着 `Session` 变量的变化，订阅重新运行。这导致 `lists` 集合被修改（不同 `Category` 的不同记录），然后级联到辅助模板。所有内容都对变化作出响应。\n\
    \n换句话说，以下动作会发生：\n\n1. `Session.set()` 修改 `current_list` 变量。\n2. `Tracker.autorun()`\
    \ 重新运行，导致 `Meteor.subscribe()` 函数刷新 `lists` 集合。\n3. 任何包含 `lists` 集合的模板或模板辅助函数都会重新运行，UI\
    \ 也会被更新。\n\n## 检查你精简后的数据\n\n现在的显示与本章开始时并无不同。然而，在显示之下，模型精简多了。在选中 **Clothes** 分类的情况下，在浏览器控制台中运行以下命令：\n\
    \n```\n> lists.findOne({Category:\"DVDs\"})\n```\n\n展开 `Object`，你会看到没有列出任何品目：\n\
    \n![](img/7f7e12e0d033ce0da0b4cc264e74d883_96_0.png)\n"
