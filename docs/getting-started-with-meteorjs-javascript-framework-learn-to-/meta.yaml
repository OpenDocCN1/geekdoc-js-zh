  - "[PAGE 72]\n\n# Templates\n\nYou may be wondering about `this._id`. Now, `this`,\
    \ in this instance, refers to the MongoDB record (technically the __document cursor__),\
    \ and `._id` is the unique MongoDB identifier for that record. This is called\
    \ the __context__, and in this case, when using the HTML template, the context\
    \ is implied to be the list/category element from where the template was called.\n\
    \n```\nlist_adding: function () {\n  return (Session.equals('list_adding', true));\n\
    },\n```\n\nThis one's really straightforward. If the `Session` variable, `list_adding`,\
    \ is `true`, we'll add it to the list. If it isn't, we won't.\n\n```\nlendee_editing:\
    \ function () {\n  return (Session.equals('lendee_input', this.Name));\n}\n```\n\
    \nTo check and see whether we should be in the \"lendee editing\" mode, we'll\
    \ check the `Session` variable, `lendee_input`, to see whether it has a value\
