    在开始编码之前，我们将使用 Foundation 框架设置我们的项目。在第 1 章中，我们看到根据需要决定哪个版本的 Foundation。为了方便在书中理解
    Foundation，我们将使用静态的[Complete Foundation 5 版本]，它包含了所有静态编译后的 CSS 文件。让我们在系统中创建一个名为
    Foundation Grid System Lessons 的新文件夹。将下载的 Foundation 项目中的所有文件复制到文件夹中，然后使用你喜欢的代码编辑器打开
    `index.html`。我最喜欢的是 GitHub 的 [Atom 编辑器](https://atom.io)，但你可以使用任何你喜欢的。


