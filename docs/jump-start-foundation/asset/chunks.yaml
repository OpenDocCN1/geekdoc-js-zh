    \n    *   labels\n\n    *   keystrokes\n\n*   Callouts and prompts―components\
    \ that will help in gaining the user’s attention to convey important messages:\n\
    \n    *   reveal modal\n\n    *   alerts\n\n    *   panels\n\n    *   tooltips\n\
    \n    *   Joyride\n\n*   Content―useful components that are commonly found on\
    \ the Web:\n\n    *   drop-downs\n\n    *   pricing tables\n\n    *   progress\
    \ bars\n\n    *   tables\n\n    *   accordion\n\n    *   tabs\n\n    *   equalizer\n\
    \nAs you can see, Foundation comes equipped with a lot of useful components out\
    \ of the box! We’ll go through many of these components in detail in later chapters,\
    \ understanding how they are made and what HTML markup is needed to create them\
    \ on our web pages.\n\nThese components come prebuilt and configured to be inserted\
    \ seamlessly into a Foundation-enabled web project. All that’s required of you,\
    \ beyond the few lines of code needed to include these components, is to customize\
    \ them as you see fit. Which brings me to my next point on Foundation: just about\
    \ everything within the Foundation framework is completely customizable, from\
    \ global styles to the minutiae of component behavior. You can change everything\
    \ about it to tailor it for your own needs.\n\nWith all these impressive features\
    \ going for it, how can the Foundation framework have any competition? Well, I’m\
    \ glad you asked. Today, there are many open-source front-end frameworks available\
    \ for us to use. Some of the most popular ones are:\n\n*   [Bootstrap](http://getbootstrap.com)\n\
    \n*   [Yahoo Pure](http://purecss.io/)\n\n*   [Google Web Starter Kit](https://developers.google.com/web/starter-kit/)\n\
    \n*   [UIkit](http://getuikit.com/)\n\n*   [Semantic UI](http://semantic-ui.com/)\n\
    \n*   [Ink](http://ink.sapo.pt/)\n\n*   [Concise](http://concisecss.com/)\n\n\
    Feel free to browse each of the above frameworks to discover what predeveloped\
    \ components they have to offer.\n\nLet’s compare Foundation with arguably its\
    \ biggest competitor, Bootstrap. Like a fine scotch whiskey, the question of which\
    \ framework reigns supreme can largely be boiled down to personal preference.\
    \ Once you know one framework, there is little difference compared to the others.\
    \ Many classes used in these frameworks are intuitive; you just have to recognize\
    \ their naming scheme.\n\nHere’s a quick rundown of the major attributes of the\
    \ two most popular CSS frameworks:\n\n|   | Foundation | Bootstrap |\n\n| ---\
    \ | --- | --- |\n\n| **Basic structure** | grid | grid |\n\n| **Sizing units**\
    \ | rem | pixel |\n\n| **License** | Open source (MIT) | Open source (MIT) |\n\
    \n| **CSS preprocessor** | Sass | LESS/Sass |\n\n| **Grid columns** | 12 | 12\
    \ |\n\n| **Number of components** | a whole lot | Also a whole lot |\n\nThough\
    \ this is admittedly a basic overview of the two frameworks, it’s evident that\
    \ they share more in common than not. Just about anything you can do with Bootstrap\
    \ you can just as easily accomplish with Foundation, and vice versa. The biggest\
    \ points of difference revolve around CSS compilation and the way they approach\
    \ grid layouts.\n\nWe should remember that customization is an important factor\
    \ in selecting a framework. Foundation provides customization through Sass only\
    \ whereas Bootstrap lets you customize its CSS through both Sass and LESS. If\
    \ you are unfamiliar with LESS/Sass, they are CSS preprocessors that bring logic\
    \ and functional ability to CSS. The preprocesser code needs to compiled into\
    \ static CSS files that will be used in our websites. We’ll learn more about customizing\
    \ Foundation frameworks through Sass in [Chapter 7.](#ch07.html \"Chapter 7Customizing\
    \ Foundation Using Sass\") Meanwhile, check out the official websites of [LESS](http://lesscss.org/)\
    \ and [Sass](http://sass-lang.com) to learn more about them.\n\nUp until version\
    \ 3 of Bootstrap, if you preferred Sass you were forced to use Foundation, while\
    \ LESS devotees were ushered towards Bootstrap. As of version 3, Bootstrap has\
    \ successfully been ported to Sass. Foundation, however, still relies upon the\
    \ Sass language for compiling CSS. If all this talk of CSS compilation makes you\
    \ dizzy, worry not―we’ll cover it in-depth later on. For now, you should simply\
    \ understand that both frameworks are designed to work with CSS compilers.\n\n\
    Similarly, both CSS frameworks make use of a grid layout for their most basic\
    \ structure. This means that web projects built with either framework will be\
    \ equally responsive with only minor syntax differences. Both frameworks default\
    \ to a 12-column layout that can be extensively customized via Sass or LESS. We\
    \ will learn more about grid systems in [Chapter 2](#ch02.html \"Chapter 2Getting\
    \ Started With Foundation's Grid System\").\n\nIn the end, with so much feature\
    \ overlap, choosing between Foundation and Bootstrap is akin to deciding between\
    \ red or blue. It all comes down to personal taste. At least it’s comforting to\
    \ know you have options, right? If you do decide ultimately to select Bootstrap\
    \ over Foundation, you could check out the SitePoint book [*Jump Start Bootstrap*](https://learnable.com/books/jump-start-bootstrap)\
    \ by Syed Fazle Rahman.\n\n## Setting up a Foundation Project\n\nInstalling and\
    \ configuring Foundation for use in your own projects is as easy as making a few\
    \ decisions followed by a few clicks. To start, head over to the Zurb Foundation\
    \ website and locate the [downloads page.](http://foundation.zurb.com/develop/download.html)\
    \ Once there, you’ll find a few options that are shown in [Figure 1.1](#ch01.html_ch1-dl-opts\
    \ \"Figure 1.1. Foundation download options\").\n\n![Foundation download options](figures/1-downloadOptions.png)\n\
    \nFigure 1.1. Foundation download options\n\nFor those just starting out with\
    \ Foundation, the “Complete” option provides a Foundation package that includes\
    \ all available components. Think of this option as the most comprehensive Foundation\
    \ package. Next up, the “Essential” package is a pared-down version of the Foundation\
    \ experience for those with less ambitious needs of the framework. Included is\
    \ a much smaller collection of features covering the bare essentials of web development\
    \ with Foundation. Then again, if you know exactly what you need from the Foundation\
    \ framework, the “Custom” option will likely serve you well. As its name implies,\
    \ with this option you can choose which elements you’d like to include in your\
    \ Foundation package and those you’d like to do without. Not only that, you can\
    \ also define some global styles such as color, font size, and column size to\
    \ be built into the resulting package. Finally, those looking to tap into the\
    \ power and convenience of CSS preprocessing, the “Sass” option will take you\
    \ to a page with detailed instructions for getting started with Sass.\n\nIf you\
    \ download the “Essential” package, upgrading to the “Complete” package would\
    \ require including the missing JavaScript files and recompiling the Sass files\
    \ into CSS. Hence, you need to make sure which version you’d like to go with for\
    \ your web project before downloading."
