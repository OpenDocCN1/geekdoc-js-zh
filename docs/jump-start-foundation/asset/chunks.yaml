    \ screen](figures/Image-2-10.png)\n\nFigure 2.11. Our example on a smartphone-size\
    \ screen\n\nFoundation also has offset classes that you can use to define specific\
    \ offsets on small- and medium-sized screens: `small-offset-*` and `medium-offset-*`\
    \ respectively.\n\n## Summary\n\nIn this chapter, we went over the basics of site\
    \ layouts with Foundation. You learned all about the grid system and how to use\
    \ its row and column structure to lay an inherently responsive foundation for\
    \ your designs. Not only that, but you also learned how to take advantage of row\
    \ nesting to squeeze the most out of your Foundation grid layouts. The knowledge\
    \ you’ve gained will be used at the core of each and every Foundation project\
    \ you create and is critical in the production of well-executed designs.\n\nIn\
    \ the latter half of this chapter, we also dived headfirst into Foundation’s responsive\
    \ nature and the ideas and methodologies behind it.\n\n# Chapter 3\n\nLaying Out\
    \ a Prototype\n\nIn the [previous chapter,](#ch02.html \"Chapter 2Getting Started\
    \ With Foundation's Grid System\") we covered the basics of web design with the\
    \ Zurb Foundation framework. These included structuring with grid layouts, nesting\
    \ rows, and responsive design using mobile-first practices and media queries.\n\
    \nHere in Chapter 3, we’ll see how to create a simple prototype in Foundation.\
    \ At the end of this chapter you’ll understand why prototyping is useful and know\
    \ how to prototype effectively with Foundation. You’ll also have learned the best\
    \ practices of web development for multiple screen sizes. Ready?\n\n## The Importance\
