  raw: "The first part of this section will serve as a photo diary of sorts with an\
    \ image in the five-columns-wide element accompanying a journal entry in the seven-columns-wide\
    \ element. All we have to do is add the desired content between these divs and\
    \ we’re good to go. Let’s add a couple more rows underneath to fill out the page.\
    \ For our second row, we’ll do the inverse of what we did in the first. Simply\
    \ split the row by seven columns, then five columns:\n\n```\n<div class=\"medium-7\
    \ columns\">\n</div>\n<div class=\"medium-5 columns\">\n</div>\n```\n\nThis arrangement\
    \ of vertical elements will help break up our grid and create a more interesting\
    \ content flow. Let’s now edit our last row in this first section and use all\
    \ twelve columns of the grid width:\n\n```\n<div class=\"large-12 columns\">\n\
    </div>\n```\n\nFor this row, we’ll use Foundation block grid elements to evenly\
    \ space horizontal content within the row. To do this we create an unordered list\
    \ with a list item for each element in the row. When we create the list we specify\
    \ a class of `\"small-block-grid-1 medium-block-grid-3\"`, which tells the framework\
    \ to split the row into three columns on medium and large screen sizes and one\
    \ column on small screens. Here’s the resulting code:\n\n```\n<ul class=\"small-block-grid-1\
    \ medium-block-grid-3\">\n    <li></li>\n    <li></li>\n    <li></li>\n</ul>\n\
    ```\n\nAnd with that we’re done with our first content section! The final code\
    \ should look like this (filler content has been added to the elements):\n\n*index.html\
    \ (excerpt)*\n\n```\n<div class=\"section\">\n    <div class=\"row\">\n      \
    \  <div class=\"medium-5 columns\">\n            <img src=\"http://placehold.it/500x300\"\
    >\n        </div>\n        <div class=\"medium-7 columns\">\n            <h5>On\
    \ this day...</h5>\n            <p>Lorem ipsum dolor sit amet, cu case duis pri,\
    \ vide \n↵ melius an per. Ad sed ignota nominavi reprimique. ...</p>\n       \
    \ </div>\n    </div>\n    <div class=\"row\">\n        <div class=\"medium-7 columns\"\
    >\n            <h5>One year ago...</h5>\n            <p>Lorem ipsum dolor sit\
    \ amet, cu case duis pri, vide\n↵ melius an per. Ad sed ignota nominavi reprimique.\
    \ ...</p>\n        </div>\n        <div class=\"medium-5 columns\">\n        \
    \    <img src=\"http://placehold.it/500x300\">\n        </div>\n    </div>\n \
    \   <div class=\"row\">\n        <div class=\"large-12 columns\">\n          \
    \  <ul class=\"small-block-grid-1 medium-block-grid-3\">\n                <li><h5>Day\
    \ One</h5><img src=\"\n↵http://placehold.it/300x150\"></li>\n                <li><h5>Day\
    \ Two</h5><img src=\"\n↵http://placehold.it/300x150\"></li>\n                <li><h5>Day\
    \ Three</h5><img src=\"\n↵http://placehold.it/300x150\"></li>\n            </ul>\n\
    \        </div>\n    </div>\n</div>\n```\n\nTo ensure that the rows within our\
    \ section have plenty of breathing room, let’s add some `margin-top` space in\
    \ our app.css:\n\n*css/app.css (excerpt)*\n\n```\n.section .row {\n    margin-top:\
    \ 50px;\n}\n```\n\nThe rendered index.html should now give you a sight similar\
    \ to [Figure 3.4](#ch03.html_ch3ex4 \"Figure 3.4. Our first content section\"\
    ).\n\n![Our first content section](figures/Image-3-4.png)\n\nFigure 3.4. Our first\
    \ content section\n\nKeeping our brisk pace, let’s go ahead and add our second\
    \ section now. For this section, we’ll see how easy it is to create responsive\
    \ media elements; in this case, a video section. We’ll make use of Foundation’s\
    \ flex-video component, which lets the framework deal with tasks such as handling\
    \ aspect ratio and video scaling as screen sizes change (we’ll take a closer look\
    \ at flex video in [Chapter 5](#ch05.html \"Chapter 5Handling Media\")). We can\
    \ start by adding a new row to the second `section` div:\n\n```\n<div class=\"\
    section\">\n    <div class=\"row\">\n    </div>\n</div>\n```\n\nWith our empty\
    \ section and row set up, let’s add a full 12-column-wide element with a new flex-video\
    \ component inside:\n\n```\n<div class=\"large-12 columns\">\n    <div class=\"\
    flex-video widescreen vimeo\">\n        <iframe src=\"http://player.vimeo.com/video/23205323\"\
    \ \n↵width=\"400\" height=\"225\" frameborder=\"0\" webkitAllowFullScreen \n↵mozallowfullscreen\
    \ allowFullScreen></iframe>\n    </div>\n</div>\n```\n\nIf you’re wondering right\
    \ now if that’s all the code necessary to add responsive video to your Foundation\
    \ project, let me put your thoughts at ease. It certainly is! All we had to do\
    \ was create a new div element with a class of `flex-video` (the `widescreen`\
    \ and `vimeo` attributes are simply for styling purposes) and add an iframe for\
    \ the video content within.\n\nLooking at our second content section in the browser\
    \ reveals a clean video element that responds accurately to screen size changes,\
    \ as shown in [Figure 3.5](#ch03.html_ch3ex5 \"Figure 3.5. Our second content\
    \ section\").\n\n![Our second content section](figures/Image-3-5.png)\n\nFigure 3.5. Our\
    \ second content section\n\nWe’ve now created two content sections underneath\
    \ our full-page header, but we still need to direct the flow of our content. Let’s\
    \ create a new content element to separate the sections of our page. To do this\
    \ we’ll create a div with the class `separator`, which will serve as our container.\
    \ Within this separator element we’ll add a new row with a full 12-column container.\
    \ The idea of these separators is to create a simple block of visual real estate\
    \ with text describing the section that follows\n\nHere’s the index.html code\
    \ for the separator between our two main sections:\n\n*index.html (excerpt)*\n\
    \n```\n<div class=\"separator\">\n    <div class=\"row\">\n            <div class=\"\
    large-12 columns\">\n                <h3>Pictures in motion</h3>\n           \
    \     <p>Lorem ipsum dolor sit amet, cu case duis pri,  \n↵ vide melius an per.\
    \ Ad sed ignota nominavi reprimique. ... </p>\n            </div>\n    </div>\n\
    </div>\n```\n\nLet’s make sure this new separator element of ours has an appropriate\
    \ height and stretches the full width of the page and add a couple styles to our\
    \ app.css. We’ll add some breathing room for our separator row, as well as adjust\
    \ the text color. Then we’ll set the `max-width` and `min-height` of our separator\
    \ container, and set a background color to help differentiate the sections. You’ll\
    \ notice that we steer clear of specifying exact widths and heights, instead relying\
    \ on relative percentages and min/max values. This is in an effort to preserve\
    \ the responsiveness of our site:\n\n*css/app.css (excerpt)*\n\n```\n.separator\
    \ .row {\n    margin-top: 50px;\n    padding-top: 50px;\n    color: #ffffff;\n\
    }\n\n.separator {\n    max-width: 100%;\n    min-height: 50%;\n    background-color:\
    \ #cccccc;\n}\n```\n\nOpening up our new index.html in the browser should yield\
    \ the same two sections as before; however, they're now separated by a new element\
    \ with some text giving context to the section that follows, shown in [Figure 3.6](#ch03.html_ch3ex6\
    \ \"Figure 3.6. Our separator element in place\"). Remember, this is just a prototype\
    \ we're building, so production content is the last thing on our minds. Simple\
    \ filler images and text are all that's required to give us a good idea of what\
    \ the page will look like.\n\n![Our separator element in place](figures/Image-3-6.png)\n\
    \nFigure 3.6. Our separator element in place\n\nAnd with that we’ve finished both\
    \ the header and main content sections of our prototype. All that’s left is to\
    \ add a footer element to the bottom of our page. For our footer, we’ll make use\
    \ of the Foundation icon bar component to place a ribbon at the bottom of our\
    \ page with universal icons directing users towards forms of site communication.\
    \ The beauty of the icon bar lies in its ability to present navigation with images\
    \ instead of text. Not only that, but it’s incredibly easy to set up. All we do\
    \ is create a new icon bar div with an attribute telling Foundation how many elements\
    \ to display:\n\n```\n<div class=\"icon-bar five-up\">\n</div>\n```\n\nIn our\
    \ case we’ll be using five icons, so we add the `five-up` attribute to divide\
    \ the space into five equal parts. To add icons to the bar, we create a new anchor\
    \ with a class item inside this div:"
