  trans: "\n准备好用 Zurb Foundation 提供的所有功能大显身手了吗？这种热情绝对值得称赞，如果你和我一样对 CSS 框架感到兴奋，那么直接投入其中可能就是你来到此此。在我们深入学习之前，让我们花一点时间了解情况，确保我们对背后的思想和概念有良好的掌握。\n\
    \n通过阅读本章的章节，你将对什么是 框架以及它如何对你的项目有所益获得良好的理解。你将在三个章节中找到这些有用信息。第一部分将从总体上涵盖 CSS 框架：它们是什么、为什么有用以及一些重要概念。在第二部分，你将找到编写本书的\
    \ CSS 框架高级概述。在这里你将发现 Foundation 区别于同类产品的特性。最后，第三部分将让你卷起袖子，通过设置基础项目开始你的 `Foundation\
    \ 之旅`。\n\n准备好投入了吗？让我们开始吧！\n[/content]\n\n[content]\n## CSS 框架简介\n\n如果你从未用过软件`框架`，那么从建筑的角度来考虑它可能会有用。在建造房屋时，实际施工的第一步之一就是搭建框架。由许多基础元素组成的框架，作为一个统一的结构支撑着房子的其他部分。如果没有它，你将无处可以固定门框或放置墙壁。同样，一个\
    \ CSS 框架提供了一个样式结构，你可以从中更轻松地构建你的 Web 项目。\n\n我知道这些听起来对总承包来说很好，但它如何帮助你构建更好的 Web 项目呢？CSS\
    \ 框架赋予了你使用预开发的 CSS 组件快速开发 Web 项目的能力。每当你开始一个新项目时不需要重新发明轮子。要使用这些大多数组件，你只需要编写所需的\
    \ HTML 标记即可。它让创建基础的 Web 用户界面变得更容易，而无需编写许多 CSS 或 JavaScript 代码。\n\n我将给你一个关于 CSS\
    \ 框架在实践中如何运作的快速示例。在没有 CSS 框架帮助的情况下创建一个新的 Web 项目时，在创建样式表来定义最简单的元素之前，你的页面看起来只会比用打字机创建的好一点点。当到了开始设置样式的时候时，页面结构的每个方面都必须经过考虑并进行适当设置——从最基础的段落到完全自定义的\
    \ div 容器。不仅这些基础样式需要从零开始，像图像库或 JavaScript 功能等更高级的组件也必须手动开发或集成到项目中。\n\n你可以想象（如果你曾花过相当的时间从零开始开发\
    \ Web 项目的话）这个过程如何迅速变得耗费时间。但有了 CSS 框架，通过使用许多内置的 CSS 和 JavaScript 组件，这个过程变得极其简单了。\n\
    \n与其乏味地定义新 Web 项目的每个基础元素，你只需要担心你想要进一步自定义的样式。这可以从 Web 开发方程式中去掉大量的手动样式，让你更多地专注于精炼项目的外观，而不是定义它外观的每一个部分。\n\
    \n此外，它减少了为了添加花哨效果而费时调试复杂的 JavaScript 的小时。例如，在没有使用预构建库的情况下，为你的项目添加一个简单的缩略图功能可能需要几十行代码。嘿，即使使用\
    \ jQuery，你也需要包含所需的脚本，设置一个带有操作的锚点，最后对缩略图本身进行样式。\n\n使用像 Foundation 这样的 CSS 框架，只需如下：\n\
    \n```html\n<a class=\"th\" href=\"../img/image.png\">\n    <img src=\"../img/image.png\"\
    >\n</a\n```\n\n只需指定缩略图类（在 Foundation 中为 `th`），图像就会自动设置样式并应用所需的 JavaScript 来创建一个精美的缩略图图像。再次，这只是\
    \ CSS 框架如何让你这个 Web 开发者的生活更简单的例子之一。我们将学习更多关于 Foundation 组件以及如何在我们的网站中轻松地使用它们，从第\
    \ 4 章开始；然而，\n"
