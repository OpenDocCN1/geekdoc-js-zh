    </html>\n```\n\n这是用于 Foundation 的推荐标记结构。每当你开始一个新项目时，都应该按照这种方式设置你的 `index.html`\
    \ 文件，以确保它具有正确的结构。\n\n这段代码中第一个需要注意的项是开头的注释标记 `<html>` 标签。这是检测旧版 Internet Explorer\
    \ 浏览器的方法，因为 Foundation 不兼容 IE9 以下的浏览器。该标签为 `<html>` 标签添加了类 `lt-ie10`，因此如果你想为旧版本的\
    \ IE 添加自定义 CSS 样式，可以将它们附加到这个 CSS 类上。\n\n接下来，我们有两个 meta 标签，告诉浏览器如何解释和表示特定的网站。第一个\
    \ meta 标签告诉浏览器该网站使用的文本字符集。在这种情况下，我们使用的是字符集 [UTF-8](http://en.wikipedia.org/wiki/UTF-8)。\n\
    \n第二个 meta 标签是 `viewport` 标签，它告诉浏览器如何渲染特定的网站。在我们的案例中，我们指示浏览器使用所有可用的浏览器空间并使我们的网站宽度等于浏览器宽度。这非常重要，因为某些移动浏览器在渲染响应式网站时存在问题；即会根据浏览器的大小修改其布局的网站。\n\
    \n然后，我们通过指定 `<link>` 标签的路径，引入了 Foundation 的默认 CSS 文件。我们还添加了一个名为 `modernizr.js`\
    \ 的第三方 JavaScript 库。由于 Foundation 框架使用了许多新的 HTML5 标签和 CSS3 特性，该库有助于检测浏览器是否支持这些特性，然后向网站添加条件代码。你可以在它的[官方网站](http://modernizr.com)上阅读更多关于\
    \ Modernizr 的信息。\n\n在 `<body>` 部分，我们包含了两个 JavaScript 文件：`jquery.js` 和 `foundation.min.js`。由于\
    \ Foundation 依赖于 jQuery，你必须始终在包含 Foundation 的 JavaScript 文件之前包含 jQuery。最后，我们通过调用\
    \ `foundation()` 方法初始化了 Foundation 脚本。此函数会初始化 Foundation 中所有预定义的 JavaScript 组件，我们将在后续章节中介绍这些内容。\n\
    \n## 练上手网格系统\n\n在创建任何列（columns）之前，我们首先需要承载它们的行（rows）。让我们先创建一个行：\n\n```\n<div class=\"\
    row\">\n</div>\n```\n\n就这么简单。你只需要向 `<div>` 元素添加类 `row` 来创建一个行。\n\nFoundation 网格系统默认将屏幕划分为\
    \ 12 个等宽的列。这些被称为**虚拟列**（virtual columns），它们的宽度会根据设备的宽度而变化。真实的列是通过指定你的列想要跨越 12\
    \ 个 Foundation 虚拟列中的多少个来创建的。假设我们只需要一个列。那么我们将跨越所有 12 个可用的 Foundation 虚拟列。为此，我们将使用类\
    \ `large-12`。（你可以暂时忽略类名中的 `large` 一词；我们稍后会讨论）。\n\n创建一个跨越所有 12 个 Foundation 虚拟列的单列的代码如下：\n\
    \n```\n<div class=\"row\">\n    <div class=\"column large-12\">\n</div>\n</div>\n\
    ```\n\n在 Foundation 中，必须为每个列元素附加额外的类 `column`，因为这有助于 Foundation 轻松识别列。你也可以使用类\
    \ `columns` 代替 `column`，Foundation 会为你创建相同的列。`columns` 和 `column` 之间没有区别。\n\n\
    让我们继续创建一个双列布局。如果我们要有两个等宽的列，那么每列将将占据六个 Foundation 虚拟列：\n\n*index.html (节选)*\n\n\
    ```\n<div class=\"row\">\n    <div class=\"large-6 column\" style=\"background:\
    \ #aaaaaa; height: 100px;\">\n        Column 1\n    </div>\n    <div class=\"\
    large-6 column\" style=\"background: #cccccc; height: 100px;\">\n        Column\
    \ 2\n    </div>\n</div>\n```\n\n我为每一列添加了背景颜色和高度，以便我们清楚地区分它们。让我们看看它在浏览器中的外观，参见图\
    \ 2.4。\n\n![基础双列布局](img/Image-2-4.png)\n\n图 2.4. 基础双列布局\n\n足够简单吧？让我们再添加另一行，这次在其中创建三个不同宽度的列。你可以在图\
    \ 2.5 中看到结果：\n\n*index.html (节选)*\n\n```\n<div class=\"row\">\n    <div class=\"\
    large-2 column\" style=\"background: #bbbbbb;height: 100px;\">\n        Column\
    \ 3\n    </div>\n    <div class=\"large-7 column\" style=\"background: #dddddd;height:\
    \ 100px;\">\n        Column 4\n    </div>\n    <div class=\"large-3 column\" style=\"\
    background: #aaaaaa;height: 100px;\">\n        Column 5\n    </div>\n</div>\n\
    ```\n\n![两行：其一行有两个等宽的列，另一行有三个不同宽度的列](img/Image-2-5.png)\n\n图 2.5. 两行：其一行有两个等宽的列，另一行有三个不同宽度的列\n\
    \n### 注意：每行仅 12 个虚拟列\n\n每行中分配给每个列的虚拟列数量总和应始终等于 12。如果总和超过 12，Foundation 会自动创建一个新行并将多出的列移动到这个新行。你可以尝试一下，为上一个示例中的最后一列分配更大数量的虚拟列。\n\
    \nFoundation 还允许你嵌套这些列；换句话说，在列内部插入一个新行。你所做的是在任何 `column` 元素内部创建一个新的 `row`，然后开始向其中插入列。这里的唯一区别是，行的宽度将取决于父列的宽度。让我们编写一个嵌套列：\n\
    \n*index.html (节选)*\n\n```\n<div class=\"row\">\n    <div class=\"large-6 column\"\
    \ style=\"background: #aaaaaa;height: 100px;\">\n        Column 1\n\n        <!--\
    \ Nested Columns -->\n        <div class=\"row\">\n            <div class=\"large-8\
    \ column\" style=\"background: #888;height: 60px;\">\n                Nested Column\
    \ 1\n            </div>\n            <div class=\"large-4 column\" style=\"background:\
    \ #999;height: 60px;\">\n                Nested Column 2\n            </div>\n\
    \        </div>\n\n    </div>\n    <div class=\"large-6 column\" style=\"background:\
    \ #cccccc;height: 100px;\">\n        Column 2\n    </div>\n</div>\n```\n\n这段代码看起来将如图\
    \ 2.6 所示。\n\n![嵌套列](img/Image-2-6.png)\n\n图 2.6. 嵌套列\n\n### 偏移 (Offsets)\n\n关于\
    \ Foundation 网格最后一个要讨论的话题是使用**偏移**（offsets）。Foundation 允许将任何列向右移动最多 11 个虚拟列。现在让我们想象一种新情况：我们想要创建一个跨越六个\
    \ Foundation 虚拟列的单列，并且它相对于浏览器窗口居中对齐。因此，为了让一个占据六个虚拟列的列居中，我们需要将其向右移动三个虚拟列。这是通过向列元素添加诸如\
    \ `.large-offset-*` 的类来实现的，其中 `*` 代表你想要偏移的 Foundation 虚拟列数量。以下是居中跨越六个 Foundation\
    \ 虚拟列的单列的代码：\n\n*index.html (节选)*\n"
- fmt: "\n```\n<div class=\"row\">\n    <div class=\"large-6 large-offset-3 column\"\
    \ style=\"background: \n#ddd;height: 200px; margin-top: 50px;\">\n        Hello\
    \ World.\n    </div>\n</div>\n```\n\nThis will create a centered column, as shown\
    \ in [Figure 2.7](#ch02.html_ch2ex11 \"Figure 2.7. A column centered using offsets\"\
    ).\n\n![A column centered using offsets](figures/Image-2-11.png)\n\nFigure 2.7.\
    \ A column centered using offsets\n\n## Foundation’s Responsive Nature\n\nThe\
    \ world of web design is quite different today than it was even five years ago.\
    \ A few factors have played prominent roles in ushering the sweeping changes to\
    \ the design landscape that we’ve seen, but the most conspicuous is the natural\
    \ progression of technology. Web technologies are refined, bandwidth increases,\
    \ and the devices we use to consume web content become more capable. In recent\
    \ times, this change has presented a unique challenge. For a long time, the interfaces\
    \ (or screens) we used to view web content steadily grew in size, the modern proliferation\
    \ of mobile devices has lead to increased browsing on considerably smaller screens.\n\
    \nInstead of focusing on a select few popular and large desktop screen sizes,\
    \ modern developers have had to produce equally capable designs for small screens\
    \ as well. The difficulties in translating media-rich large-screen experiences\
    \ to the much smaller mobile screen led to the development of `Responsive Web\
    \ Design` (RWD). In short, web content that is designed responsively will react\
    \ intelligently and dynamically to differing screen sizes. Pages dynamically restructure\
    \ themselves to present content in the most meaningful way based on the user’s\
    \ screen size.\n\nWith the Foundation framework, each page you design will be\
    \ inherently responsive when built within the grid layout. To prove that I’m not\
    \ just pulling your leg, let’s take a look at the two-row grid-layout examples\
    \ we created in the previous section. You’ll remember that we didn’t explicitly\
    \ define any responsive style or behavior in either grid example; we simply added\
    \ rows and columns. Let’s take a look at [Figure 2.8](#ch02.html_ch2ex7 \"Figure\
    \ 2.8. Our two-row layout on a smaller screen\") to see what happens when we shrink\
    \ the screen size.\n\n![Our two-row layout on a smaller screen](figures/Image-2-7.png)\n\
    \nFigure 2.8. Our two-row layout on a smaller screen\n\nWithout adding any custom\
    \ styles, our simple grid layouts have automatically responded to the changing\
    \ screen size, and the rows and columns have stacked on top of each other. This\
    \ again illustrates the power of using a framework such as Foundation. Time-consuming\
    \ aspects of the web development process are made automatic. Yet as well as being\
    \ automatic, they’re also robust, leaving plenty of room for customization and\
    \ expansion.\n\nAlthough by default Foundation was able to take care of mobile\
    \ compatibility, that design might not be what we’re after. We may want our columns\
    \ to adapt differently according to whether the website is to be displayed on\
    \ mobiles, tablets, and desktop displays. For this situation, Foundation has defined\
    \ a set of classes for mobiles and tablets. Let’s examine them carefully.\n\n\
    For devices with screens less than 640px in width, Foundation has a set of classes\
    \ that start with `small-#`. And for devices whose widths are more than 640px\
    \ and less than 1024px, it has classes `medium-#`. The `large-#` classes that\
    \ we used in the previous section are applicable for devices that are above 1024px\
    \ in width. This means that it’s unnecessary to modify the code we wrote in the\
    \ previous section to cater for tablets and smartphones separately. We simply\
    \ add more sizing classes to make columns display differently.\n\nLet’s modify\
    \ the code of the first row as follows:\n\n*index.html (excerpt)*\n\n```\n<div\
    \ class=\"row\">\n    <div class=\"large-6 medium-4 small-12 column\" style=\"\
    background:\n#aaaaaa; height: 100px;\">\n        Column 1\n    </div>\n    <div\
    \ class=\"large-6 medium-8 small-12 column\" style=\"background:\n#cccccc; height:\
    \ 100px;\">\n        Column 2\n    </div>\n</div>\n```\n\nHere are screenshots\
    \ on three browser widths.\n\n[Figure 2.9](#ch02.html_ch2ex8 \"Figure 2.9. Our\
    \ modified example on a larger screen\") shows that on a desktop screen, it looks\
    \ the same as previously.\n\n![Our modified example on a larger screen](figures/Image-2-8.png)\n\
    \nFigure 2.9. Our modified example on a larger screen\n\nIn [Figure 2.10](#ch02.html_ch2ex9\
    \ \"Figure 2.10. Our modified example on a tablet-size screen\"), we can see what\
    \ it looks like on a tablet-size browser. The first column is slightly smaller\
    \ than the second column.\n\n![Our modified example on a tablet-size screen](figures/Image-2-9.png)\n\
    \nFigure 2.10. Our modified example on a tablet-size screen\n\nOn a mobile-size\
    \ browser, it looks like [Figure 2.11](#ch02.html_ch2ex10 \"Figure 2.11. Our example\
    \ on a smartphone-size screen\"). Both columns occupy all the portions of a row,\
    \ and hence they stack on top of each other.\n\n![Our example on a smartphone-size\
    \ screen](figures/Image-2-10.png)\n\nFigure 2.11. Our example on a smartphone-size\
    \ screen\n\nFoundation also has offset classes that you can use to define specific\
    \ offsets on small- and medium-sized screens: `small-offset-*` and `medium-offset-*`\
    \ respectively.\n\n## Summary\n\nIn this chapter, we went over the basics of site\
    \ layouts with Foundation. You learned all about the grid system and how to use\
    \ row nesting to squeeze the most out of your designs. Not only that, but you\
    \ also learned the mobile-first practices and media queries. In the latter half\
    \ of this chapter, we also dived headfirst into Foundation’s responsive nature\
    \ and the ideas and methodologies behind it.\n\n# Chapter 3: Laying Out a Prototype\n\
    \nIn the previous chapter, we covered the basics of web design with the Zurb framework.\
    \ These included structuring with grid layouts. Here in Chapter 3, we’ll see how\
    \ to create a simple prototype in Foundation. At the end of this chapter you’ll\
    \ understand why prototyping is useful and know how to prototype effectively with\
    \ Foundation. You’ll also have learned the best practices of web development for\
    \ multiple screen sizes.\n\n## The Importance of a Good Prototype\n\nPrototyping,\
    \ the process of creating a sample or model to test concepts, is a technique used\
    \ to speed up the development process. It is far from unique to the web development\
    \ industry. On the contrary, it’s been widely used in nearly every industry with\
    \ development processes for hundreds of years.\n\nSo why is it such an important\
    \ aspect of web development? The answer is twofold: The first reason has everything\
    \ to do with speeding up the development cycle. The second (and equally important)\
    \ reason involves improving the quality of your resultant applications and designs.\n\
    \nA good way to conceptualize prototyping is to think about the car sitting in\
    \ your garage and how it came to be. Through the diligent work of many people,\
    \ a concept was devised, sketched, modeled, prototyped, and after numerous revisions,\
    \ produced. Can you imagine if they’d jumped straight from the conceptual model\
    \ to production? Consider the ensuing recalls and lawsuits! Fortunately, car manufacturers\
    \ work in a much more intelligent way, using prototyping to work out the bugs\
    \ before you jump behind the wheel.\n\n## Building a Basic Prototype\n\nIn this\
    \ chapter, we’ll apply the concepts we learn by building a fictitious website\
    \ for an online photo journal.\n"
