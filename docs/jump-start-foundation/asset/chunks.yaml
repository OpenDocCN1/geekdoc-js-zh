    ></i>\n</a>\n<a class=\"item\">\n    <i class=\"fi-like\"></i>\n</a>\n```\n\n\
    [Figure 3.7](#ch03.html_ch3ex7 \"Figure 3.7. The footer in our prototype\") shows\
