  trans: "\n\n图 4.3 显示了它在浏览器中的外观。\n\n![默认 Foundation 表格](img/Image-4-3.png)\n\n图 4.3.\
    \ 默认 Foundation 表格\n\n你可以看到 Foundation 为表头和交替行（斑马纹样式）应用了浅灰色。它还默认为表格添加了边框。\n\n\
    与许多其他 CSS 框架不同，Foundation 不提供各种类型的预样式表格；相反，你可以自定义默认表格。\n\n## 响应式 Foundation 表格\n\
    \n这种默认 Foundation 表格的主要问题之一是无法通过响应式测试。当表格中的列较多时，它在较小的屏幕上可能会显示异常。默认 Foundation\
    \ 框架也不支持响应式表格；但是，Foundation 作为 [Foundation Playground](http://zurb.com/playground)网站（该网站分享技术实验）的一部分发布了一个独立的响应式表格包。该包可以从\
    \ [`zurb.com/playground/responsive-tables`](http://zurb.com/playground/responsive-tables)\
    \ 下载。从该包中将 `responsive-tables.css` 和 `responsive-tables.js` 文件复制到你的项目目录，然后如下所示将\
    \ CSS 文件链接到 HTML 文件的 `<head>` 部分：\n\n```\n<link type=\"text/css\" media=\"screen\"\
    \ rel=\"stylesheet\" \nhref=\"css/responsive-tables.css\" />\n```\n\n现在按照如下所示将\
    \ JavaScript 文件插入 HTML 文件中：\n\n```\n<script type=\"text/javascript\" src=\"js/responsive-tables.js\"\
    >\n</script>\n```\n\n确保你将 JavaScript 添加在 jQuery 文件之后，否则它将无法工作。\n\n链接这两个文件后，为 `<table>`\
    \ 元素添加一个名为 `responsive` 的类。表格将神奇地变成响应式的！\n\n现在继续为最近创建的表格添加 `responsive` 类吧。尝试调整浏览器窗口大小到较小尺寸，或使用\
    \ Chrome 的移动仿真模式在较小设备上检查表格。你可以看到表格被添加了水平滚动条，让你能够查看其全部内容。之前损坏的表格现在看起来好多了，并且完全可访问。\n\
    \n## 警框 (Alerts)\n\n顾如名，`Alert` 组件用于在 Web 应用中显示提示消息。它们通常用于传递成功、失败或警告消息。首先，让我们创建一个基础警框框：\n\
    \n```\n<div data-alert class=\"alert-box\">\n  这里是警框内容。\n  <a href=\"#\" class=\"\
    close\">&times;</a>\n</div>\n```\n\n图 4.4 显示了此警框在浏览器中的外观。\n\n![基础警框](img/Image-4-4.png)\n\
    \n图 4.4. 基础警框\n\n在这里，自定义数据属性 `data-alert` 将警框 div 与 Foundation 的 JavaScript 绑定。你还需要添加一个名为\
    \ `alert-box` 的类来应用适当的 CSS 样式。此警框组件可以包含任意数量的内容；但是，你需要在结尾添加一个带有 `close` 类的锚点标签。该标签包含用于显示\
    \ `x` 符号的 HTML 代码 `&times;`，用于关闭警框组件。你也可以将其替换为你选择的任何字体图标。\n\n警框可以用于传递成功、失败或警告消息，以及显示任何通用消息。因此，Foundation\
    \ 提供了类来根据警框类型更改警框框的颜色。\n\n你可以配合默认类 `alert-box` 添加各种类来对警框进行样式设置。类及其颜色如下：\n\n* `success`:\
    \ 绿色\n* `warning`: 橙色\n* `alert`: 红色\n* `info`: 浅蓝色\n* `secondary`: 灰色\n\n这是一个带有颜色类的警框示例：\n\
    \n```\n<div data-alert class=\"alert-box success\">\n  支付成功！\n  <a href=\"#\"\
    \ class=\"close\">&times;</a>\n</div>\n```\n\n你可以通过更改角落的圆角半径进一步增强警框框的外观。Foundation\
    \ 提供了两个与警框框工作的边界类：`radius` 和 `round`。\n\n正如我们在面板部分看到的，`radius` 类添加了 `3px` 的圆角半径，而\
    \ `round` 类为警框框添加了 `1000px` 的圆角半径。图 4.5 显示了它们的样子：\n\n*alerts.html (节选)*\n\n```\n\
    <div data-alert class=\"alert-box success radius\">\n  带有 .radius 类的警框。\n  <a\
    \ href=\"#\" class=\"close\">&times;</a>\n</div>\n\n<div data-alert class=\"alert-box\
    \ warning round\">\n  带有 .round 类的警框。\n  <a href=\"#\" class=\"close\">&times;</a>\n\
    </div>\n```\n\n![使用 round 和 radius 辅助类的警框框](img/Image-4-5.png)\n\n图 4.5. 使用 `round`\
    \ 和 `radius` 辅助类的警框框\n\n正如提到的，你始终可以在 `app.css` 文件中覆盖 `round` 类的 `1000px` 圆角值。\n\
    \nFoundation 还提供了一个自定义事件 `close.fndtn.alert`，它在警框关闭时触发。该事件可以用于在警框关闭后执行 Ajax 调用或客户端端操作。其用法如下：\n\
    \n```\n$(document).on('close.fndtn.alert', function(event) {\n  console.log('警框已关闭！');\n\
    });\n```\n\n## 组织内容\n\n良好的内容组织至关重要。你需要易于使用的导航，以便用户浏览你的内容。在本节中，我们将学习如何使用 Foundation\
    \ 创建标签 (Tabs)、下拉列表和导航栏。\n\n### 标签 (Tabs)\n\n`Tabs` 是 Foundation 的 JavaScript 组件之一。它允许你在单个容器中组织多个项目，并让你轻松在它们之间切换。就像任何其他组件一样，创建标签组件只需要添加\
    \ HTML 标记。\n\n创建标签组件需要两个 HTML 元素：**标签部分**和**标签内容**。\n\n标签部分使用带有 `tabs` 类的无列表 `<ul>`\
    \ 元素创建，并带有 `data-tab` 的自定义属性。该自定义属性将 HTML 标记与 Foundation 的 JavaScript 绑定：\n\n\
    ```\n<ul class=\"tabs\" data-tab>\n    <li></li>\n</ul>\n```\n\n无列表中的每个子 `<li>`\
    \ 元素代表界面中的标签。这些 `<li>` 元素应该包含一个链接到特定内容标签。为每个 `<li>` 元素添加 `tab-title` 类以继承 Foundation\
    \ 的 CSS 样式。标签部分的标记应该如下所示：\n\n*tabs.html (节选)*\n\n```\n<ul class=\"tabs\" data-tab>\n\
    \    <li class=\"tab-title active\"><a href=\"#panel1\">标签 1</a></li>\n    <li\
    \ class=\"tab-title\"><a href=\"#panel2\">标签 2</a></li>\n    <li class=\"tab-title\"\
    ><a href=\"#panel3\">标签 3</a></li>\n    <li class=\"tab-title\"><a href=\"#panel4\"\
    >标签 4</a></li>\n</ul>\n```\n\n你应该为其中一个 `<li>` 元素放置一个额外的 `active` 类；这将是页面在浏览器加载时被选中的标签。此外，锚点标签的\
    \ `href` 属性应设置为它们相应的标签内容 div 的 ID，我们接下来将创建它们。\n\n创建标签内容需要创建一个带有 `tabs-content`\
    \ 类的简单 `<div>` 元素。该元素作为所有子内容区域的父容器。每个子 `<div>` 元素都应该具有 `content` 类和一个唯一的 ID，与标签部分的链接相对应。\n\
    \n"
- fmt: "\n```html\n<div class=\"tabs-content\">\n    <div class=\"content active\"\
    \ id=\"panel1\">\n        <p>Lorem ipsum dolor sit amet, consectetur adipiscing\
    \ elit.\nDuis vel aliquet augue.</p>\n    </div>\n    <div class=\"content\" id=\"\
    panel2\">\n        <p>Mauris ornare quam a lorem interdum, condimentum porta\n\
    eros bibendum.</p>\n    </div>\n    <div class=\"content\" id=\"panel3\">\n  \
    \      <p>Cras bibendum vehicula turpis a mollis. Pellentesque\ntincid semper\
    \ nunc, non porta massa volutpat quis.</p>\n    </div>\n    <div class=\"content\"\
    \ id=\"panel4\">\n        <p>Pellentesque accumsan tortor ut tincidunt sollicitudin.\n\
    </p>\n    </div>\n</div>\n```\n\nStraightforward, isn’t it? You have to ensure\
    \ that one of the `content` elements has an `active` class to help Foundation\
    \ identify the initial content to display.\n\n### Note: Don’t Forget the `active`\
    \ Class\n\nIf you forget to add the class `active` to one of the child elements\
    \ of both `tabs` and `tabs-content` elements, then none of the tabs will be shown.\
    \ You have to add the `active` class to the same positioned child element in both\
    \ `tabs` and `tabs-content` elements.\n\nThis tabs component will look like [Figure\
    \ 4.6](#ch04.html_ch4ex6 \"Figure 4.6. A tabs component\").\n\n![A tabs component](figures/Image-4-6.png)\n\
    \nFigure 4.6. A tabs component\n\nFoundation also lets you create an alternative-b\
    \ type of the tabs component where the tabs are present on the left side and the\
    \ content is present on the right side. This is called **vertical tabs**. Just\
    \ insert an additional class of `vertical` and Foundation will magically convert\
    \ the basic tabs component into a vertical tabs component, as shown in [Figure\
    \ 4.7](#ch04.html_ch4ex13 \"Figure 4.7. A vertical tabs component\"):\n\n```html\n\
    <ul class=\"tabs vertical\" data-tab>\n    …\n</ul>\n<div class=\"tabs-content\"\
    >\n    …\n</div>\n```\n\n![A vertical tabs component](figures/Image-4-13.png)\n\
    \nFigure 4.7. A vertical tabs component\n\n**Deep linking** is a Foundation Tabs\
    \ feature that gives a unique URL for each tab. For example, if your website URL\
    \ is `www.mysite.com`, the URL for “tab 2” might be `www.mysite.com/#panel2`.\
    \ Here `#panel2` is the ID of one of the child `content` elements in the `tabs-content`\
    \ element. When a user navigates to this URL, “tab 2” will be selected by default.\n\
    \nTo enable deep linking, pass a particular parameter to Foundation’s JavaScript\
    \ through the tabs component’s `data-option` attribute. Here’s how to do it:\n\
    \n```html\n<ul class=\"tabs\" data-tab data-options=\"deep_linking: true\">\n\
    \ …\n</ul>\n```\n\nThe value passed here is `deep_linking: true`. You’ll find\
    \ many Foundation components that come with several `data-options` parameters\
    \ through which you can customize the default behaviors; check these out in the\
    \ [Foundation documentation.](http://foundation.zurb.com/docs/) We’ll learn about\
    \ more of them as we proceed through this book.\n\n### Top Bar\n\n**Top bar**\
    \ is mainly used for navigation and other website links. Foundation’s top bar\
    \ component works well in all devices sizes by default (small, medium, and large\
    \ screens).\n\nTo create a top bar, we need an HTML `<nav>` element with the class\
    \ `top-bar`. It should also have a custom data attribute called `data-topbar`\
    \ that will bind its HTML to Foundation’s JavaScript:\n\n```html\n<nav class=\"\
    top-bar\" data-topbar>\n</nav>\n```\n\nThis top bar will have two sections—**branding**\
    \ and **content**. Branding is where the website’s title or logo goes. Content\
    \ contains all the links and drop-down menus that you want in the navigation bar.\
    \ Let’s see how to create them.\n\nThe branding section is created using an unordered\
    \ list `<ul>` with the class `title-area`. It has an `<li>` element with a class\
    \ `name` that contains the title of the website:\n\n```html\n<nav class=\"top-bar\"\
    \ data-topbar>\n    <ul class=\"title-area\">\n        <li class=\"name\">\n \
    \           <h1><a href=\"#\">My Site</a></h1>\n        </li>\n    </ul>\n</nav>\n\
    ```\n\nThe navigation bar should look like [Figure 4.8](#ch04.html_ch4ex7 \"Figure\
    \ 4.8. The branding section on our top bar\").\n\n![The branding section on our\
    \ top bar](figures/Image-4-7.png)\n\nFigure 4.8. The branding section on our top\
    \ bar\n\nLet’s add a hamburger icon that will be visible only when the browser\
    \ width is too small to display the complete navigation bar. This icon goes inside\
    \ the `title-area` element:\n\n*top-bar.html (excerpt)*\n\n```html\n<nav class=\"\
    top-bar\" data-topbar>\n    <ul class=\"title-area\">\n        <li class=\"name\"\
    >\n            <h1><a href=\"#\">My Site</a></h1>\n        </li>\n        <!--\
    \ Hamburger icon -->\n        <li class=\"toggle-menu\"><a href=\"#\" data-toggle=\"\
    menu\">Menu</a></li>\n    </ul>\n\n    <ul class=\"menu\">\n        <li><a href=\"\
    #\">Home</a></li>\n        <li><a href=\"#\">Products</a></li>\n        <li><a\
    \ href=\"#\">Services</a></li>\n        <li><a href=\"#\">Consulting</a></li>\n\
    \    </ul>\n</nav>\n```\n"
  raw: "```\n<div class=\"tabs-content\">\n\n    <div class=\"content active\" id=\"\
    panel1\">\n        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.\n\
    ↵ Duis vel aliquet augue.</p>\n    </div>\n\n    <div class=\"content\" id=\"\
    panel2\">\n        <p>Mauris ornare quam a lorem interdum, condimentum porta\n\
    ↵ eros bibendum.</p>\n    </div>\n\n    <div class=\"content\" id=\"panel3\">\n\
    \        <p>Cras bibendum vehicula turpis a mollis. Pellentesque\n↵ tincidunt\
    \ semper nunc, non porta massa volutpat quis.</p>\n    </div>\n\n    <div class=\"\
    content\" id=\"panel4\">\n        <p>Pellentesque accumsan tortor ut tincidunt\
    \ sollicitudin.\n↵</p>\n    </div>\n\n</div>\n```\n\nStraightforward, isn’t it?\
    \ You have to ensure that one of the `content` elements has an `active` class\
    \ to help Foundation identify the initial content to display.\n\n### Note: Don’t\
    \ Forget the `active` Class\n\nIf you forget to add the class `active` to one\
    \ of the child elements of both `tabs` and `tabs-content` elements, then none\
    \ of the tabs will be shown. You have to add the `active` class to the same positioned\
    \ child element in both `tabs` and `tabs-content` elements.\n\nThis tabs component\
    \ will look like [Figure 4.6](#ch04.html_ch4ex6 \"Figure 4.6. A tabs component\"\
    ).\n\n![A tabs component](figures/Image-4-6.png)\n\nFigure 4.6. A tabs component\n\
    \nFoundation also lets you create an alternativeb type of the tabs component where\
    \ the tabs are present on the left side and the content is present on the right\
    \ side. This is called **vertical tabs**. Just insert an additional class of `vertical`\
    \ and Foundation will magically convert the basic tabs component into a vertical\
    \ tabs component, as shown in [Figure 4.7](#ch04.html_ch4ex13 \"Figure 4.7. A\
    \ vertical tabs component\"):\n\n```\n<ul class=\"tabs vertical\" data-tab>\n\
    \    …\n</ul>\n<div class=\"tabs-content\">\n    …\n</div>\n```\n\n![A vertical\
    \ tabs component](figures/Image-4-13.png)\n\nFigure 4.7. A vertical tabs component\n\
    \n**Deep linking** is a Foundation Tabs feature that gives a unique URL for each\
    \ tab. For example, if your website URL is `www.mysite.com`, the URL for “tab\
    \ 2” might be `www.mysite.com/#panel2`. Here `#panel2` is the ID of one of the\
    \ child `content` elements in the `tabs-content` element. When a user navigates\
    \ to this URL, “tab 2” will be selected by default.\n\nTo enable deep linking,\
    \ pass a particular parameter to Foundation’s JavaScript through the tabs component’s\
    \ `data-option` attribute. Here’s how to do it:\n\n```\n<ul class=\"tabs\" data-tab\
    \ data-options=\"deep_linking: true\">\n …\n</ul>\n```\n\nThe value passed here\
    \ is `deep_linking: true`. You’ll find many Foundation components that come with\
    \ several `data-options` parameters through which you can customize the default\
    \ behaviors; check these out in the [Foundation documentation.](http://foundation.zurb.com/docs/)\
    \ We’ll learn about more of them as we proceed through this book.\n\n### Top Bar\n\
    \n**Top bar** is mainly used for navigation and other website links. Foundation’s\
    \ top bar component works well in all devices sizes by default (small, medium,\
    \ and large screens).\n\nTo create a top bar, we need an HTML `<nav>` element\
    \ with the class `top-bar`. It should also have a custom data attribute called\
    \ `data-topbar` that will bind its HTML to Foundation’s JavaScript:\n\n```\n<nav\
    \ class=\"top-bar\" data-topbar>\n</nav>\n```\n\nThis top bar will have two sections—**branding**\
    \ and **content**. Branding is where the website’s title or logo goes. Content\
    \ contains all the links and drop-down menus that you want in the navigation bar.\
    \ Let’s see how to create them.\n\nThe branding section is created using an unordered\
    \ list `<ul>` with the class `title-area` . It has an `<li>` element with a class\
    \ `name` that contains the title of the website:\n\n```\n<nav class=\"top-bar\"\
    \ data-topbar>\n    <ul class=\"title-area\">\n        <li class=\"name\">\n \
    \           <h1><a href=\"#\">My Site</a></h1>\n        </li>\n    </ul>\n</nav>\n\
    ```\n\nThe navigation bar should look like [Figure 4.8](#ch04.html_ch4ex7 \"Figure 4.8. The\
    \ branding section on our top bar\").\n\n![The branding section on our top bar](figures/Image-4-7.png)\n\
    \nFigure 4.8. The branding section on our top bar\n\nLet’s add a hamburger icon\
    \ that will be visible only when the browser width is too small to display the\
    \ complete navigation bar. This icon goes inside the `title-area` element:\n\n\
    *top-bar.html (excerpt)*\n\n```\n<nav class=\"top-bar\" data-topbar>\n    <ul\
    \ class=\"title-area\">\n        <li class=\"name\">\n            <h1><a href=\"\
    #\">My Site</a></h1>\n        </li>\n\n        <!-- Hamburger icon -->\n     \
    \   <li class=\"toggle-topbar menu-icon\"><a href=\"#\"><span>Menu\n↵</span></a></li>\n\
    \n    </ul>\n</nav>\n```\n\nThe hamburger icon should have the classes `toggle-topbar`\
    \ and `menu-icon`. The first class binds the click operation on the top bar, and\
    \ the second class is used to add CSS styling. It also has a `<span>` element\
    \ with the text “Menu.” Now when the browser width is too small, we’ll see the\
    \ icon as shown in [Figure 4.9](#ch04.html_ch4ex8 \"Figure 4.9. Our top bar component\
    \ on a smaller screen, diplaying the hamburger icon\").\n\n![Our top bar component\
    \ on a smaller screen, diplaying the hamburger icon](figures/Image-4-8.png)\n\n\
    Figure 4.9. Our top bar component on a smaller screen, diplaying the hamburger\
    \ icon\n\nNext we have the main content section of the navigation bar. This is\
    \ defined using HTML's `<section>` element with a class `of top-bar-section`.\
    \ This section is divided into two categories of links: right-side links and left-side\
    \ links. Let's check them out:\n\n```\n<section class=\"top-bar-section\">\n \
    \   <ul class=\"right\">\n        …\n    </ul>\n    <ul class=\"left\">\n    \
    \    …\n    </ul>\n</section>\n```\n\nBoth left- and right-side links are defined\
    \ using the `<ul>` elements. The right-side elements have a class of `right` while\
    \ the left-side elements have a class of `left`. Now you can insert as many links\
    \ using `<li>` and `<a>` elements inside them. Here’s the final markup for the\
    \ top bar:\n\n*top-bar.html (excerpt)*\n\n```\n<nav class=\"top-bar\" data-topbar>\n\
    \    <ul class=\"title-area\">\n        <li class=\"name\">\n            <h1><a\
    \ href=\"#\">My Site</a></h1>\n        </li>\n        <li class=\"toggle-topbar\
    \ menu-icon\"><a href=\"#\"><span>Menu\n↵</span></a></li>\n    </ul>\n\n    <section\
    \ class=\"top-bar-section\">\n      <ul class=\"left\">\n          <li class=\"\
    active\"><a href=\"#\">Home</a></li>\n          <li><a href=\"#\">Products</a></li>\n\
    \          <li><a href=\"#\">Services</a></li>\n          <li><a href=\"#\">Consulting</a></li>\n\
    \      </ul>\n      <ul class=\"right\">\n          <li><a href=\"#\">Our team</a></li>\n\
    \          <li><a href=\"#\">Contact us</a></li>\n          <li><a href=\"#\"\
    >About us</a></li>\n      </ul>\n\n  </section>\n</nav>\n```\n\n[Figure 4.10](#ch04.html_ch4ex9\
    \ \"Figure 4.10. Our navigation on larger screens\") shows how the top bar looks\
    \ in larger screens.\n\n![Our navigation on larger screens](figures/Image-4-9.png)\n\
    \nFigure 4.10. Our navigation on larger screens\n\n[Figure 4.11](#ch04.html_ch4ex10\
    \ \"Figure 4.11. Our navigation on smaller screens\") shows how the top bar looks\
    \ when the hamburger icon is tapped on mobile devices.\n\n![Our navigation on\
    \ smaller screens](figures/Image-4-10.png)\n\nFigure 4.11. Our navigation on smaller\
    \ screens\n\nAmazing, isn’t it? We didn’t have to write a single line of JavaScript\
    \ code to make a working, responsive navigation bar. That’s the beauty of using\
    \ the Foundation framework.\n\nLet’s add a drop-down menu in this navigation bar.\
    \ First we’ll add a special class `has-dropdown` to the `<li>` element with the\
    \ nested links. Then we add an anchor tag `<a>` along with a nested unordered\
    \ list `<ul>` inside the `has-dropdown` element:\n\n*top-bar.html (excerpt)*\n\
    \n```\n <li class=\"has-dropdown\">\n            <a href=\"#\">Our network</a>\n\
    \            <ul class=\"dropdown\">\n                    <li><a href=\"#\">Learnable</a></li>\n\
    \                    <li><a href=\"#\">SitePoint</a></li>\n            </ul>\n\
    \    </li>\n```\n\nYou should have a similar result to [Figure 4.12](#ch04.html_ch4ex11\
    \ \"Figure 4.12. The drop-down menu\").\n\n![The drop-down menu](figures/Image-4-11.png)"
