  trans: "\n\n![我们的示例表单增加了单选按钮和复选框进行演变。](img/Image-6-4.png)\n\n图 6.4。我们的示例表单增加了单选按钮和复选框进行演变。\n\
    \n### 前缀和后缀输入字段\n\nFoundation 有两种类型的输入字段：前缀（可以添加如 `$` 和 `€` 等符号）和后缀（可以添加如 `.com`\
    \ 的文本）。可以在 图 6.5）中看到这一点。\n\n![前缀和后缀输入字段。](img/Image-6-5.png)\n\n图 6.5. 前缀和后缀输入字段。\n\
    \n要创建一个前缀或后缀输入字段，首先使用 Foundation 网格系统构建一个双列布局。然后生成一个具有 `row` 和 `collapse` 类的 `<div>`\
    \ 元素。在这里，`collapse` 将有助于移除列与列之间的默认内边距和外边距：\n\n```\n<div class=\"row collapse\"\
    >\n</div>\n```\n\n接下来，我们在这个 `row` 元素内部添加列。要创建一个前缀输入框，先构建一个窄列，一个宽列。让我们为窄列选择 `small-3`，为宽列选择\
    \ `small-9`：\n\n```\n<div class=\"row collapse\">\n  <div class=\"small-3 columns\"\
    >\n  </div>\n  <div class=\"small-9 columns\">\n  </div>\n</div>\n```\n\n记得在添加列宽的同时添加\
    \ `columns` 或 `column` 类。在窄列内部，使用 `<span>` 标签添加你所需的的前缀文本（例如 `$`）。它应该具有 `prefix`\
    \ 类以应用 CSS 样式：\n\n```\n<div class=\"small-3 columns\">\n    <span class=\"prefix\"\
    >$</span>\n</div>\n```\n\n现在在宽列内部添加输入字段：\n\n```\n<div class=\"small-9 columns\"\
    >\n    <input type=\"text\" placeholder=\"Enter Amount\"/>\n</div>\n```\n\n尝试在浏览器中检查此代码的运行。你应该会看到一个带有前缀的输入框，提示你应该输入美元金额。\n\
    \n对于后缀输入框，只需交换窄列和宽列的位置即可。然后对 `<span>` 标签使用 `postfix` 类而不是 `prefix`。以下是后缀输入框的代码：\n\
    \n```\n<div class=\"row collapse\">\n    <div class=\"small-9 columns\">\n   \
    \     <input type=\"text\" placeholder=\"example\" />\n    </div>\n    <div class=\"\
    small-3 columns\">\n        <span class=\"postfix\">.com</span>\n    </div>\n\
    </div>\n```\n\n### 内联标签和输入字段\n\n有时你可能需要将标签放置在输入字段的左侧，而不是上方。你可以借助网格系统和一些额外的 CSS\
    \ 类来实现。\n\n我们必须创建两列，一窄一宽。我们将使用 `small-3` 类作为窄列，使用 `small-9` 类作为宽列：\n\n```\n<div\
    \ class=\"row collapse\">\n    <div class=\"small-3 columns\">\n    </div>\n \
    \   <div class=\"small-9 columns\">\n    </div>\n</div>\n```\n\n如下所示在窄列中添加 `<label>`\
    \ 标签：\n\n```\n<div class=\"small-3 columns\">\n    <label for=\"nameField\">Enter\
    \ Name</label>\n</div>\n```\n\n现在在宽列中放置输入字段：\n\n```html\n<div class=\"small-9\
    \ columns\">\n    <input type=\"text\" id=\"nameField\" placeholder=\"John Doe\"\
    \ />\n</div>\n```\n\n让我们在浏览器中查看。它看起来会像 图 6.6。\n\n![一个内联标签](img/Image-6-6.png)\n\
    \n图 6.6. 内联标签\n\n但是，这里有一个小问题。标签相对于输入框在垂直方向上没有对齐。我们需要添加一些 CSS 类来让它看起来很完美。在标签文本上添加\
    \ `right` 类将使其向右浮动。这会让它更靠近输入字段。添加另一个 CSS 类 `inline` 会为它添加一些内边距和外边距。\n\n```\n<div\
    \ class=\"small-3 columns\">\n    <label for=\"nameField\" class=\"right inline\"\
    >Enter Name</label>\n</div>\n```\n\n如果你重新加载浏览器页面，你应该能看到如 图 6.7 所示的完美对齐的标签文本。\n\
    \n![我们调整后的内联标签](img/Image-6-7.png)\n\n图 6.7. 我们调整后的内联标签\n\n### 错误状态\n\n在 Foundation\
    \ 中，指示输入字段是否有无效条目非常简单。只需在标签文本上添加 `error` 类即可变为红色。你还可以在输入字段下方放置额外的文本作为错误消息。此文本使用带有\
    \ `error` 类的 `<small>` 标签添加。以下是一个带有错误状态的输入字段示例：\n\n*index.html (节录)*\n\n```\n\
    <div class=\"small-12 columns\">\n    <label class=\"error\">Name\n        <input\
    \ type=\"text\" placeholder=\"Name\" />\n    </label>\n    <small class=\"error\"\
    >Invalid entry</small>\n</div>\n```\n\n这看起来会像 图 6.8。\n\n![带有错误状态的输入字段](img/Image-6-8.png)\n\
    \n图 6.8. 带有错误状态的输入字段\n\n这在 Foundation 中指示一个输入字段是否有无效条目是极其直接的。只需在标签文本上添加 `error`\
    \ 类即可使其变为红色。你还可以在输入字段下方放置额外的文本作为错误消息。此文本使用带有 `error` 类的 `<small>` 标签添加。以下是一个带有错误状态的输入字段示例：\n\
    \n### 使用 Abide 验证表单\n\nAbide 是一个提供客户端验证支持的库。在上一节中，我们看到了如何 *指示* 错误状态，但我们尚未学习如何\
    \ *调用* 那些错误状态。现在我们将使用 Abide 来验证表单。这是一个使用 Abide 的示例表单：\n\n```\n<form>\n  <div class=\"\
    name-field\">\n    <label>Your name\n      <input type=\"text\"/>\n    </label>\n\
    \    <small class=\"error\">Name is required and must be a string.</small>\n \
    \ </div>\n  <div class=\"email-field\">\n    <label>Email\n      <input type=\"\
    email\"/>\n    </label>\n    <small class=\"error\">An email address is required.</small>\n\
    \  </div>\n  <button type=\"submit\">Submit</button>\n</form>\n```\n\n这个基础表单看起来会像\
    \ 图 6.9。\n\n![没有验证的表单](img/Image-6-9.png)\n\n图 6.9. 没有验证的表单\n\n如果你提交此表单，你会发现验证不起作用。这是因为我们还没有告诉\
    \ Abide 库要验证哪些字段。最基本的验证要求是表单字段不能为空。我们将使用 HTML5 的 `required` 属性为表单输入字段添加必要的验证。为了做到这一点，我们在\
    \ `index.html` 文件中包含一个额外的 JavaScript 文件。该文件名为 `foundation.abide.js`，位于 `js/foundation/`\
    \ 文件夹中。位于 Foundation 文件的下方：\n\n接下来，我们通过在 `<form>` 标签上添加 `data-abide` 属性来在表单上初始化\
    \ Abide 库：\n\n```\n<form data-abide>\n...\n</form>\n```\n\n现在，当你刷新页面后，错误状态应该是隐藏的，如\
    \ 图 6.10 所示。\n\n![隐藏错误状态的表单](img/Image-6-15.png)\n\n图 6.10. 隐藏错误状态的表单\n\n现在如果你尝试提交此表单——当然是在刷新页面之后——你将看到验证正在工作，且空字段是不接受的，如\
    \ 图 6.11 所示。\n\n![表单现在拒绝空字段](img/Image-6-11.png)\n\n图 6.11. 表单现在拒绝空字段。\n\n"
- fmt: "\n![The form now rejects empty fields](figures/Image-6-16.png)\nFigure 6.11.\
    \ The form now rejects empty fields\n\nWe'll refine our form validation by adding\
    \ more details. Abide validation enables you add patterns to each input field\
    \ so that it will accept only particular values. For example, if you want the\
    \ name fields to accept only characters and exclude numbers, there's a specific\
    \ pattern that you must supply to the Abide library. The patterns are also known\
    \ as `regular expressions` or `RegEx`. You can read more about [RegEx on the Mozilla\
    \ Developer Network.](https://developer.mozilla.org/en/docs/Web/JavaScript/Guide/Regular_Expressions)\
    \ Another cool online tool that lets you grab a pattern easily is [HTML5Pattern.](https://html5pattern.com)\
    \ You can also refer to Foundation's documentation for some [predefined patterns.](http://foundation.zurb.com/docs/components/abide.html#predefined-patterns)\n\
    \nLet's add the pattern `[a-zA-Z]+` to the name field. This will force just alphabetical\
    \ characters to be submitted:\n\n```\n<input type=\"text\" required pattern=\"\
    [a-zA-Z]+\"/>\n```\n\nIf you now try to submit the form with an invalid entry,\
    \ such as numbers, you'll receive an error in the name field.\n\n### Warning:\
    \ One-sided Error Checking\n\nThe Abide validation library provides client-side\
    \ validation only. It checks for errors on the browser using `JavaScript`, so\
    \ if JavaScript is disabled on the user's browser, it will fail to work. We recommend\
    \ that you always validate forms on the server side as well, using a programming\
    \ language such as `PHP` or `Ruby`.\n\n## Switches\n\nSwitches are a toggle element\
    \ that change between an on-and-off state on tap or click, as shown in [Figure\
    \ 6.12](#ch06.html_ch6ex13 \"Figure 6.12. A switch\").\n\n![A switch](figures/Image-6-13.png)\n\
    Figure 6.12. A switch\n\nWhat’s best about the switches in the Foundation framework\
    \ is that they’re made using regular checkbox and radio button HTML elements.\
    \ Hence, you can use traditional JavaScript methods to detect the state of these\
    \ elements.\n\nTo create a switch, set up a `<div>` element with the class `switch`.\
    \ Then insert an HTML checkbox with label markup inside of it:\n\n```\n<div class=\"\
    switch\">\n  <input id=\"exampleCheckboxSwitch\" type=\"checkbox\">\n  <label\
    \ for=\"exampleCheckboxSwitch\"></label>\n</div>\n```\n\nYou need to ensure that\
    \ the `for` attribute of the label element contains the ID value of the input\
    \ checkbox element.\n\n[Figure 6.13](#ch06.html_ch6ex9 \"Figure 6.13. A basic\
    \ toggle switch\") shows how this should look.\n\n![A basic toggle switch](figures/Image-6-9.png)\n\
    Figure 6.13. A basic toggle switch\n\nYou can also create a set of radio button\
    \ switches using the same markup. Make sure you give all the switches the same\
    \ `name` attribute, as shown in the code. With radio-button-powered switches,\
    \ you ensure that only one switch at a time can be selected:\n\n```\n<div class=\"\
    switch\">\n  <input id=\"exampleRadioSwitch1\" type=\"radio\" checked name=\"\
    testGroup\">\n  <label for=\"exampleRadioSwitch1\"></label>\n</div>\n\n<div class=\"\
    switch\">\n  <input id=\"exampleRadioSwitch2\" type=\"radio\" name=\"testGroup\"\
    >\n  <label for=\"exampleRadioSwitch2\"></label>\n</div>\n\n<div class=\"switch\"\
    >\n  <input id=\"exampleRadioSwitch3\" type=\"radio\" name=\"testGroup\">\n  <label\
    \ for=\"exampleRadioSwitch3\"></label>\n</div>\n```\n\nThe result will look like\
    \ [Figure 6.14](#ch06.html_ch6ex10 \"Figure 6.14. Radio-button-powered switches\"\
    ).\n\n![Radio-button-powered switches](figures/Image-6-10.png)\nFigure 6.14. Radio-button-powered\
    \ switches\n\n### Sizing Switches\n\nYou can also control the shape and size of\
    \ switches using a few CSS classes:\n\n* `large`: for a larger switch\n* `small`:\
    \ for a smaller switch\n* `tiny`: for an extra small switch\n\nYou can also add\
    \ the following classes to change the shape of your switches:\n\n* `radius`: adds\
    \ a border radius of `4px`\n* `round`: adds a border radius of `2rem`\n\nHere’s\
    \ an example of these classes in use:\n\n```\n<div class=\"switch large radius\"\
    >\n  <input id=\"exampleRadioSwitch4\" type=\"radio\" name=\"testGroup\">\n  <label\
    \ for=\"exampleRadioSwitch4\"></label>\n</div>\n```\n\nThis will create a large\
    \ switch with a border radius of `4px`.\n\n[Figure 6.15](#ch06.html_ch6ex11 \"\
    Figure 6.15. A smorgasbord of switch sizes and styling\") shows all the shapes\
    \ and sizes of switches.\n\n![A smorgasbord of switch sizes and styling](figures/Image-6-11.png)\n\
    Figure 6.15. A smorgasbord of switch sizes and styling\n\n### Disabling Switch\n\
    \nThere may be cases where you’ll want to disable switches so that they cannot\
    \ be selected. The easiest way to do this is to use HTML5’s default `disabled`\
    \ attribute. It can be added to any HTML tag so that the click event will fail\
    \ on that tag. By default, Foundation provides no classes for styling checkbox\
    \ and radio switches with the `disabled` attribute set.\n\nHowever, if you add\
    \ the `disabled` attribute to the switch markup in the previous section, you’ll\
    \ find that the switch’s toggling animation still works; however, the checkbox\
    \ or radio button won’t actually be functional in the background. We need to fix\
    \ this by writing our own CSS styles for the disabled state of the switch.\n\n\
    Add the following CSS code to your custom CSS file:\n\n```\n.switch.disabled {\n\
    \  opacity: 0.25;\n  pointer-events: none; // Prevents click events from working\n\
    }\n```\n\nThen add the class `disabled` to the `switch` element, and the attribute\
    \ `disabled` to the `<input>` element; for example:\n\n```\n<div class=\"switch\
    \ large round disabled\">\n  <input id=\"exampleSwitch\" type=\"radio\" disabled=\"\
    \" name=\"testGroup\">\n  <label for=\"exampleSwitch\"></label>\n</div>\n```\n\
    \nYou should see a similar sight to [Figure 6.16](#ch06.html_ch6ex12 \"Figure\
    \ 6.16. A disabled switch\").\n\n![A disabled switch](figures/Image-6-12.png)\n\
    Figure 6.16. A disabled switch\n\n## Summary\n\nI trust you had fun learning about\
    \ forms in Foundation. In this chapter, we learned that the secret to creating\
    \ beautiful forms is all about mastering Foundation’s grid system and adding a\
    \ few CSS classes. We also explored how to create prefix and postfix input fields\
    \ and how to inline labels with respect to input fields, and how to indicate errors\
    \ and validate our forms. Finally, we saw how to build an intuitive switches element.\n\
    \nIn the next chapter, we’ll discover how to customize Foundation’s default CSS\
    \ styles using the Sass CSS preprocessor. So take a quick break, and then buckle\
    \ yourself in for this exciting final chapter of this book.\n\n# Chapter 7\n\n\
    ## Customizing Foundation Using Sass\n\nOne of the major problems with CSS frameworks\
    \ is that the component design can become al-too common on websites as more developers\
    \ start using the framework, making websites look very, well, same-y. Those in\
    \ the know can easily identify whether a website is using a particular framework.\
    \ This is why it’s important to customize our frameworks. The more customization\
    \ support a framework provides, the easier it is for developers to make changes\
    \ to the base design.\n\nFoundation’s CSS was created using `Sass`. Now you might\
    \ be wondering just what the heck Sass is? Well, it's a CSS `preprocessor` that\
    \ brings dynamic components such as variables to CSS. As the name suggests, it\
    \ preprocesses these dynamic CSS files into static CSS files that will be used\
    \ in the websites you create. We'll understand it better by looking at an example.\
    \ Imagine you have selected a particular shade of blue and used it at various\
    \ places in your stylesheet. Then later on, you decide to go with green instead\
    \ of blue. Ordinarily, to make this change, you'd have to manually edit the color\
    \ value at every place it appears in your stylesheet; however, Sass solves this\
    \ problem by providing variables. You simply change the value of the variable\
    \ and recompile the file, and the change will be reflected everywhere the variable\
    \ was used. Here’s an example Sass code snippet:\n\n```\n$primary-color: #00f;\
    \ // first variable\n$white: #fff; // second variable\n\n.button{\n  background:\
    \ $primary-color; // first variable used\n  color: $white; // second variabled\
    \ used\n}\n```\n"
  raw: "![The form now rejects empty fields](figures/Image-6-16.png)\n\nFigure 6.11. The\
    \ form now rejects empty fields\n\nWe'll refine our form validation by adding\
    \ more details. Abide validation enables you add patterns to each input field\
    \ so that it will accept only particular values. For example, if you want the\
    \ name fields to accept only characters and exclude numbers, there's a specific\
    \ pattern that you must supply to the Abide library. The patterns are also known\
    \ as **regular expressions** or **RegEx**. You can read more about [RegEx on the\
    \ Mozilla Developer Network.](https://developer.mozilla.org/en/docs/Web/JavaScript/Guide/Regular_Expressions)\
    \ Another cool online tool that lets you grab a pattern easily is [HTML5Pattern.](https://html5pattern.com)\
    \ You can also refer to Foundation's documentation for some [predefined patterns.](http://foundation.zurb.com/docs/components/abide.html#predefined-patterns)\n\
    \nLet's add the pattern `[a-zA-Z]+` to the name field. This will force just alphabetical\
    \ characters to be submitted:\n\n```\n<input type=\"text\" required pattern=\"\
    [a-zA-Z]+\"/>\n```\n\nIf you now try to submit the form with an invalid entry,\
    \ such as numbers, you'll receive an error in the name field.\n\n### Warning:\
    \ One-sided Error Checking\n\nThe Abide validation library provides client-side\
    \ validation only. It checks for errors on the browser using JavaScript, so if\
    \ JavaScript is disabled on the user's browser, it will fail to work. We recommend\
    \ that you always validate forms on the server side as well, using a programming\
    \ language such as PHP or Ruby.\n\n## Switches\n\nSwitches are a toggle element\
    \ that change between an on-and-off state on tap or click, as shown in [Figure 6.12](#ch06.html_ch6ex13\
    \ \"Figure 6.12. A switch\").\n\n![A switch](figures/Image-6-13.png)\n\nFigure 6.12. A\
    \ switch\n\nWhat’s best about the switches in the Foundation framework is that\
    \ they’re made using regular checkbox and radio button HTML elements. Hence, you\
    \ can use traditional JavaScript methods to detect the state of these elements.\n\
    \nTo create a switch, set up a `<div>` element with the class `switch`. Then insert\
    \ an HTML checkbox with label markup inside of it:\n\n```\n<div class=\"switch\"\
    >\n  <input id=\"exampleCheckboxSwitch\" type=\"checkbox\">\n  <label for=\"exampleCheckboxSwitch\"\
    ></label>\n</div>\n```\n\nYou need to ensure that the `for` attribute of the label\
    \ element contains the ID value of the input checkbox element.\n\n[Figure 6.13](#ch06.html_ch6ex9\
    \ \"Figure 6.13. A basic toggle switch\") shows how this should look.\n\n![A basic\
    \ toggle switch](figures/Image-6-9.png)\n\nFigure 6.13. A basic toggle switch\n\
    \nYou can also create a set of radio button switches using the same markup. Make\
    \ sure you give all the switches the same `name` attribute, as shown in the code.\
    \ With radio-button-powered switches, you ensure that only one switch at a time\
    \ can be selected:\n\n```\n<div class=\"switch\">\n  <input id=\"exampleRadioSwitch1\"\
    \ type=\"radio\" checked name=\"\n↵testGroup\">\n  <label for=\"exampleRadioSwitch1\"\
    ></label>\n</div> \n\n<div class=\"switch\">\n  <input id=\"exampleRadioSwitch2\"\
    \ type=\"radio\" name=\"testGroup\">\n  <label for=\"exampleRadioSwitch2\"></label>\n\
    </div> \n\n<div class=\"switch\">\n  <input id=\"exampleRadioSwitch3\" type=\"\
    radio\" name=\"testGroup\">\n  <label for=\"exampleRadioSwitch3\"></label>\n</div>\n\
    ```\n\nThe result will look like [Figure 6.14](#ch06.html_ch6ex10 \"Figure 6.14. Radio-button-powered\
    \ switches\").\n\n![Radio-button-powered switches](figures/Image-6-10.png)\n\n\
    Figure 6.14. Radio-button-powered switches\n\n### Sizing Switches\n\nYou can also\
    \ control the shape and size of switches using a few CSS classes:\n\n*   `large`:\
    \ for a larger switch\n\n*   `small`: for a smaller switch\n\n*   `tiny`: for\
    \ an extra small switch\n\nYou can also add the following classes to change the\
    \ shape of your switches:\n\n*   `radius`: adds a border radius of `4px`\n\n*\
    \   `round`: adds a border radius of `2rem`\n\nHere’s an example of these classes\
    \ in use:\n\n```\n<div class=\"switch large radius\">\n  <input id=\"exampleRadioSwitch4\"\
    \ type=\"radio\" name=\"testGroup\">\n  <label for=\"exampleRadioSwitch4\"></label>\n\
    </div>\n```\n\nThis will create a large switch with a border radius of `4px`.\n\
    \n[Figure 6.15](#ch06.html_ch6ex11 \"Figure 6.15. A smorgasbord of switch sizes\
    \ and styling\") shows all the shapes and sizes of switches.\n\n![A smorgasbord\
    \ of switch sizes and styling](figures/Image-6-11.png)\n\nFigure 6.15. A smorgasbord\
    \ of switch sizes and styling\n\n### Disabling Switch\n\nThere may be cases where\
    \ you’ll want to disable switches so that they cannot be selected. The easiest\
    \ way to do this is to use HTML5’s default `disabled` attribute. It can be added\
    \ to any HTML tag so that the click event will fail on that tag. By default, Foundation\
    \ provides no classes for styling checkbox and radio switches with the `disabled`\
    \ attribute set.\n\nHowever, if you add the `disabled` attribute to the switch\
    \ markup in the previous section, you’ll find that the switch’s toggling animation\
    \ still works; however, the checkbox or radio button won’t actually be functional\
    \ in the background. We need to fix this by writing our own CSS styles for the\
    \ disabled state of the switch.\n\nAdd the following CSS code to your custom CSS\
    \ file:\n\n```\n.switch.disabled {\n  opacity: 0.25;\n  pointer-events: none;\
    \ // Prevents click events from working\n}\n```\n\nThen add the class `disabled`\
    \ to the `switch` element, and the attribute `disabled` to the `<input>` element;\
    \ for example:\n\n```\n<div class=\"switch large round disabled\">\n  <input id=\"\
    exampleSwitch\" type=\"radio\" disabled=\"\" name=\"\n↵testGroup\">\n  <label\
    \ for=\"exampleSwitch\"></label>\n</div>\n```\n\nYou should see a similar sight\
    \ to [Figure 6.16](#ch06.html_ch6ex12 \"Figure 6.16. A disabled switch\").\n\n\
    ![A disabled switch](figures/Image-6-12.png)\n\nFigure 6.16. A disabled switch\n\
    \n## Summary\n\nI trust you had fun learning about forms in Foundation. In this\
    \ chapter, we learned that the secret to creating beautiful forms is all about\
    \ mastering Foundation’s grid system and adding a few CSS classes. We also explored\
    \ how to create prefix and postfix input fields and how to inline labels with\
    \ respect to input fields, and how to indicate errors and validate our forms.\
    \ Finally, we saw how to build an intuitive switches element.\n\nIn the next chapter,\
    \ we’ll discover how to customize Foundation’s default CSS styles using the Sass\
    \ CSS preprocessor. So take a quick break, and then buckle yourself in for this\
    \ exciting final chapter of this book.\n\n# Chapter 7\n\nCustomizing Foundation\
    \ Using Sass\n\nOne of the major problems with CSS frameworks is that the component\
    \ design can become al-too common on websites as more developers start using the\
    \ framework, making websites look very, well, same-y. Those in the know can easily\
    \ identify whether a website is using a particular framework. This is why it’s\
    \ important to customize our frameworks. The more customization support a framework\
    \ provides, the easier it is for developers to make changes to the base design.\n\
    \nFoundation’s CSS was created using **Sass.** Now you might be wondering just\
    \ what the heck Sass is? Well, it's a CSS **preprocessor** that brings dynamic\
    \ components such as variables to CSS. As the name suggests, it preprocesses these\
    \ dynamic CSS files into static CSS files that will be used in the websites you\
    \ create. We'll understand it better by looking at an example. Imagine you have\
    \ selected a particular shade of blue and used it at various places in your stylesheet.\
    \ Then later on, you decide to go with green instead of blue. Ordinarily, to make\
    \ this change, you'd have to manually edit the color value at every place it appears\
    \ in your stylesheet; however, Sass solves this problem by providing variables.\
    \ You simply change the value of the variable and recompile the file, and the\
    \ change will be reflected everywhere the variable was used. Here’s an example\
    \ Sass code snippet:\n\n```\n$primary-color: #00f; // first variable\n$white:\
    \ #fff; // second variable\n\n.button{\n  background: $primary-color; // first\
    \ variable used\n  color: $white; // second variabled used\n}\n```"
