    \    </div>\n    <div class=\"row\">\n        <div class=\"medium-7 columns\"\
    >\n            <h5>One year ago...</h5>\n            <p>Lorem ipsum dolor sit\
    \ amet, cu case duis pri, vide\nmelius an per. Ad sed ignota nominavi reprimique.\
    \ ...</p>\n        </div>\n        <div class=\"medium-5 columns\">\n        \
    \    <img src=\"http://placehold.it/500x300\">\n        </div>\n    </div>\n \
    \   <div class=\"row\">\n        <div class=\"large-12 columns\">\n          \
    \  <ul class=\"small-block-grid-1 medium-block-grid-3\">\n                <li><h5>Day\
    \ One</h5><img src=\"\nhttp://placehold.it/300x150\"></li>\n                <li><h5>Day\
    \ Two</h5><img src=\"\nhttp://placehold.it/300x150\"></li>\n                <li><h5>Day\
    \ Three</h5><img src=\"\nhttp://placehold.it/300x150\"></li>\n            </ul>\n\
    \        </div>\n    </div>\n</div>\n```\n\n为了确保我们区块内的行有足够的呼吸空间，让我们在 `app.css`\
    \ 中添加一些 `margin-top` 空间：\n\n`css/app.css`（节选）\n\n```css\n.section .row {\n   \
    \ margin-top: 50px;\n}\n```\n\n渲染后的 `index.html` 现在应该给你提供与图 3.4 类似的视图。\n\n![我们的第一个内容区块](img/Image-3-4.png)\n\
    \n图 3.4 我们的第一个内容区块\n\n保持节奏，让我们现在继续添加第二个区块。对于这一部分，我们将看到创建响应式媒体元素多么简单；在这种情况下，是一个视频区块。我们将利用\
    \ Foundation 的 flex-video 组件，它让框架处理诸如随屏幕尺寸变化的宽高比例和视频缩放等任务（我们将在第 5 章）中详细查看 flex\
