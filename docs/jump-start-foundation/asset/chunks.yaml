  trans: "\n\n```\n{\n  \"name\": \"foundation-compass-app\",\n  \"version\": \"0.0.1\"\
    ,\n  \"private\": \"true\",\n  \"dependencies\": {\n    \"foundation\": \"zurb/bower-foundation\"\
    ,\n    \"angular\": \"~1.4.1\"\n  }\n}\n```\n\nBower 的方便之处在于，在共享项目时，你可以简单地忽略 `bower_components`\
    \ 文件夹。无论你与谁分享项目，他们只需运行以下命令即可快速安装依赖项：\n\n```\nbower install\n```\n\n这将为他们创建一个 `bower_components`\
    \ 文件夹，其中包含所有所需的依赖项。\n\n`config.rb` 是一个 Compass ，用于指示 Compass 在项目的何处查找适当的文件。例如，它告诉\
    \ Compass 在何处定位 Sass 文件，以及在编译后将静态 CSS 文件存储在哪里。如果你打开这个文件，它的内容应该如下：\n\n```\nadd_import_path\
    \ \"bower_components/foundation/scss\"\nhttp_path = \"/\"\ncss_dir = \"stylesheets\"\
    \nsass_dir = \"scss\"\nimages_dir = \"images\"\njavascripts_dir = \"js\"\n```\n\
    \n`scss` 文件夹包含了用于 Foundation 自定义的文件。它包含两个主要文件，即 `_settings.scss` 和 `app.scss`。我们将在下一节介绍这些文件的细节。\n\
    \n`stylesheet` 文件夹包含了所有的静态和编译后的 CSS 文件。默认情况下，它有一个名为 `app.css` 的文件，该文件必须包含在我们 Web\
    \ 应用的每个 HTML 文件中。如果你使用 Sass 进行自定义，建议不要对 `app.css` 文件进行任何更改，因为当 Compass 重新编译 Sass\
    \ 文件时，更改会被覆盖。\n\n好了，现在我们安装了所需的所有内容并查看了目录结构，让我们进入有趣的部分：查看一些 Foundation 的 Sass 自定义。\n\
    \n## 使用 Sass 自定义 Foundation\n\n在本节中，我们将学习一些 Sass 知识以及如何使用它来自定义 Foundation 的默认样式。我们将涵盖\
    \ Sass 的基础知识，如创建变量、CSS 嵌套和函数。然而，涵盖 Sass 本身的完整细节超出了本书的范围，但你始终可以[官方文档](http://sass-lang.com/documentation/file.SASS_REFERENCE.html)\
    \ 来深入研究 Sass。你也可以参考 SitePoint 的教程[“Sass 入门”](http://www.sitepoint.com/getting-started-sass-bourbon/)\
    \ 和文章[“Rails 中的 Sass 简介”](http://www.sitepoint.com/an-introduction-to-sass-in-rails/)\
    \ 获取更多关于 Sass 的见解。\n\n对 Foundation 的所有 Sass 自定义都是通过 `scss` 文件夹内的两个文件完成的：`_settings.scss`\
    \ 和 `app.scss`。让我们来看看每个文件的作用。\n\n### 使用 _settings.scss\n\n第一个文件 `_settings.scss`\
    \ 包含了 Foundation 中每个预定义 CSS 和 JavaScript 组件的注释变量。要自定义一个组件，你只需要使用 `Ctrl + F` 或\
    \ `Cmd + F` 找到特定的变量，取消它的注释，然后更改文件中的值即可。\n\n一旦你保存了文件，Compass 将重新编译 Sass 并生成一个新的\
    \ `app.css` 文件，该文件将位于 `stylesheet` 文件夹中。\n\n让我们尝试一些 Sass 自定义。导航到 `First_project`\
    \ 并在浏览器中加载 `index.html` 文件。你可以看到文件中显示了许多默认的 Foundation 组件，如图 7.2 所示。\n\n![Example\
    \ index.html](img/Image-7-2.png)\n\n图 7.2. Example index.html\n\n让我们对默认按钮样式进行一些修改。打开\
    \ `_settings.scss` 并在文件中搜索 `Buttons`。你会遇到一组用于按钮样式的注释变量，如图 7.3 所示。\n\n![Commented\
    \ variables for styling buttons](img/Image-7-3.png)\n\n图 7.3. Commented variables\
    \ for styling buttons\n\n现在取消以下行的注释：\n\n```\n// $button-font-align: center;\n\
    ```\n\n将其更改为：\n\n```scss\n$button-font-align: left;\n```\n\nCompass 将覆盖 `app.css`\
    \ 中 `button` 类的默认 `text-align` 属性：\n\n```css\n.button{\n    …\n    text-align:\
    \ left; //从 center 改为 left\n    …\n}\n```\n\n接下来，取消此行的注释：\n\n```\n// $button-margin-bottom:\
    \ rem-calc(20);\n```\n\n将其更改为：\n\n```css\n$button-margin-bottom: rem-calc(40);\n\
    ```\n\nCompass 将覆盖 `app.css` 中 `button` 类的默认 `margin` 属性：\n\n```css\n.button{\n\
    \    …\n    margin: 0 0 2.5rem; //原本是 0 0 1.5rem\n    …\n}\n```\n\n### 注意：引入 rem\n\
    \n`Rem-calc` 是一个 Foundation Sass 函数，它将像素测量转换为 rem，这样你仍然可以以像素为单位思考，并获得可缩放的 em。如果你不熟悉这个新的\
    \ rem CSS 单位，请参考 CSS-Tricks 的文章[“对 REM 和 EM 感到惑？”](https://css-tricks.com/confused-rem-em/)。\n\
    \n我们已经看到了如何在 Sass 中定义变量。你可以使用此类变量为你的网站定义颜色方案。让我们创建一个新文件，为我们的网站存储一些可用的颜色。\n\n在\
    \ `sass` 文件夹内创建一个新文件 `_colors.scss`，并在其中添加三个新变量：\n\n`_colors.scss`\n\n```\n$theme-primary-color:\
    \ #009688;\n$theme-secondary-color: #4DB6AC;\n$theme-text-color: #212121;\n```\n\
    \n现在，编辑 `sass` 文件夹内的 `app.scss` 文件。我们将此文件的顶部添加以下代码以包含我们新创建的 `colors.scss` 文件：\n\
    \n```scss\n@import \"colors\";\n```\n\n### 注意：文件名开头的下划线是什么？\n\n以下划线开头的 Sass 文件称为**部分文件\
    \ (partials)**。这表示它们是不完整的 Sass 文件，因为它们依赖其他 Sass 文件中的变量和函数。如果你从文件名中删除下划线，Compass\
    \ 将生成一个同名的新静态 CSS 文件。\n\n现在我们已经定义了主题颜色，让我们创建一个新类，当它附加到任何段落元素时，将使该元素从其他元素中脱颖而出。我们将在类定义中使用我们的主题颜色。编辑\
    \ `_settings.scss` 文件，并在文件底部添加以下 Sass 代码：\n\n```scss\n.standout-paragraph{\n \
    \   color: $theme-text-color;\n    padding: 20px;\n    background-color: $theme-secondary-color;\n\
    }\n```\n\n编译后，上述代码将具有如下值：\n\n```css\n.standout-paragraph{\n    color: #212121;\n\
    \    padding: 20px;\n    background-color: #4DB6AC;\n}\n```\n\n**嵌套**是组织和维护 CSS\
    \ 样式的一种极方法。让我们通过修改 `.standout-paragraph` 的 Sass 代码来查看 Sass 中的嵌套：\n\n```css\n.standout-paragraph{\n\
    \    color: $theme-text-color;\n    padding: 20px;\n    background-color: $theme-secondary-color;\n\
    \    //嵌套类型 1\n    a{\n        color: #FFFFFF;\n        text-decoration: none;\n\
    \    }\n    //嵌套类型 2\n    &.white-text{\n        color: #FFFFFF;\n    }\n}\n```\n\
    \n在这段代码中嵌套了两个新定义：针对 `<a>` 元素和 `white-text` 类。让我们查看生成的输出：\n\n```css\n.standout-paragraph{\n\
    \    color: #212121;\n    padding: 20px;\n    background-color: #4DB6AC;\n}\n\n\
    //嵌套类型 1 的结果为\n.standout-paragraph a{\n    color: #FFFFFF;\n}\n\n//嵌套类型 2 的结果为\n\
    .standout-paragraph.white-text{\n    color: #FFFFFF;\n}\n```\n\n如 CSS 代码所示，嵌套类型\
    \ 1 产生的 CSS 层级结构为 `.standout-paragraph a`。然而，嵌套类型 2 是通过 `&` 符号引用父选择器的一种方法。\n\n\
    希望这让你对 Sass 中的嵌套有了基本的了解。如需进一步阅读，请参考 Sass 文档的[嵌套章节。](http://sass-lang.com/documentation/file.SASS_REFERENCE.html#nested_rules)\n\
    \n### 理解 app.scss\n\n我们将移动到 `scss` 文件夹中的下一个重要文件，`app.scss`。它是项目的父 Sass 文件，通过该文件创建主\
    \ `app.`css 文件，它也是引入所有部分文件（partials）的地方。如上面提到的，部分文件是无法独立编译的 Sass 文件。\n\n"
- fmt: "\nIf you open the `app.scss` file, it should have three import statements\
    \ at the top:\n\n```\n@import \"colors\";\n@import \"settings\";\n@import \"foundation\"\
    ;\n```\n\nThe first two files are present in the `scss` folder; however, the last\
    \ file, `foundation.scss`, is imported from the `/bower_components/foundation/scss/foundation.scss`\
    \ location.\n\nYou will also find many commented import statements in this `app.scss`\
    \ file, such as:\n\n```\n// @import\n//   \"foundation/components/accordion\"\
    ,\n//   \"foundation/components/alert-boxes\",\n//   \"foundation/components/block-grid\"\
    ,\n```\n\nThey are mainly provided so that you can select to include just the\
    \ components that are required for your application. You can do so by commenting\
    \ out the `@import \"foundation\";` line and uncommenting individual components\
    \ from line five onwards.\n\nFor example, if you choose to skip the `accordion`,\
    \ `flex-video`, and `joyride` components, you can uncomment the rest of the components\
    \ and leave these components commented. To do so, you need to comment this line:\n\
    \n```\n// @import \"foundation\";\n```\n\nAnd uncomment these lines as follows:\n\
    \n```\n@import\n  \"foundation/components/accordion\",\n  \"foundation/components/flex-video\"\
    ,\n  \"foundation/components/joyride\";\n```\n\nThe `app.scss` file is also the\
    \ place to include new styles for your project. In the previous section, we had\
    \ created a definition for `standout-paragraph` and its children elements inside\
    \ the `settings.scss` file. As `settings.scss` file is imported at the top of\
    \ `app.scss` file, there is the possibility of it being overridden by other imports\
    \ below it. Hence, it is highly recommended that you write new Sass code at the\
    \ end of the `app.scss` file.\n\n## Summary\n\nIn this chapter, we learned how\
    \ to set up the Sass version of Foundation through Foundation CLI. We also covered\
    \ how to install and set up Bower and Compass. Once Sass is set up, you can do\
    \ so much more than mere customization. You can create new Sass partials and import\
    \ them into `app.scss`, as well as add fresh classes and styles through new Sass\
    \ files for your project.\n\nAnd so we've reached the end of our journey exploring\
    \ the Foundation framework, although I'd prefer to think of it as laying the foundations\
    \ for future travels. I trust after this introduction that you're as excited as\
    \ I am about the potential of the Foundation framework. If you're still keen to\
    \ seek out more, you can also refer to the [Foundation articles on SitePoint](http://www.sitepoint.com/?s=foundation)\
    \ to learn more about what you can do with the Foundation framework. Here are\
    \ a few other useful links:\n\n* [Semantic Markup with Foundation 5 and Sass](http://www.sitepoint.com/semantic-markup-foundation-5-sass/)\n\
    * [Foundation 5 documentation](http://foundation.zurb.com/docs/)\n* [Example websites\
    \ built using Foundation](http://foundation.zurb.com/learn/website-examples.html)\n\
    * [Free Foundation templates](http://foundation.zurb.com/templates.html)\n* [Foundation\
    \ font icons](http://zurb.com/playground/foundation-icon-fonts-3)\n\nI hope you\
    \ enjoyed reading this book and trying out Foundation. Best of luck with your\
    \ future web projects, and your journey with Foundation!\n"
