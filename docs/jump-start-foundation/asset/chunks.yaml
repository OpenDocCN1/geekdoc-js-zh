    针对我们的需求，我们将坚持第一种方案并下载“Complete”（完整）包。点击下载链接后，你将得到一个包含整个 Foundation 框架的 ZIP 文件。要安装该框架，只需将压缩包解压到你
    Web 项目根目录下。解压后，你会发现 `css`、`img` 和 `js` 文件夹以及包括至关重要的 `index.html` 在内的几个文件，如图 1.3
    所示。在编写本书时，Foundation 5.5.2 版本是最新发布版本，书中也一直使用了该版本。


    ![解压后的 Foundation 包](img/1-extractedFiles.png)


    图 1.2. 解压后的 Foundation 包


    默认 Foundation 包中包含的文件夹非常是不言自喻的。`css` 文件夹包含了预定义的 Foundation 样式以及你决定添加的任何自定义样式表；`js`
    文件夹同样包含了所有 Foundation 组件所需的脚本；最后，`img` 文件夹将包含你将引入 Web 项目的图像。当这些文件就绪后，你就可以开始了。是的，真的就这么简单！如果你不信，尽管将
    Web 浏览器指向你刚刚解压 Foundation 包的目录。如果运气好的，它看起来应该像图 1.3 所示。


    ![Foundation 的默认索引页](img/1-defaultIndex.png)


    图 1.3. Foundation 的默认索引页


    ## 总结


    至此，你已经完全准备好应对本书的其余内容了。我们相信你不会被刚刚接收到的丰富信息所压倒，但牢牢掌握什么是 CSS 框架以及它们为什么对 Web 开发者很有用是有用的。


    在本章中，我们涵盖了 Foundation 框架的基础知识，包括一个展示了如何快速使用 Foundation 搭建原型网站的示例。我们还学习了什么是 Zurb
    Foundation。随后，你看到了了 Foundation 与 CSS 框架领域另一大巨头 Bootstrap 的快速对比。最后，我们通过概述使用 Foundation
    框架建立第一个项目的步骤来结束了本章。说实话，步骤并不多，但这是一件好事！你现在准备好大显身手，开始利用 Foundation 框架构建一个基础网站了。还在等什么？快进入第
    2 章吧！


    # 第 2 章：网格系统的入门


    谁不希望自己的网站在移动设备上看起来美观且结构良好呢？考虑到竞争用户关注的众多网站，我们的网站应该准备好针对任何显示设备进行自动调整。但这种网站设计具有挑战性，需要许多小时的
    HTML 和 CSS 代码编写。相反，Foundation 框架赋予了你随时创建此类响应式网站的能力。你不需要编写单行 CSS 代码即可创建一个响应式网站。


    在本章中，我们将探索 Foundation 的核心概念之一：网格系统——一种可以缩放到任何尺寸的 12 列灵活网格。我们将看到如何实现它，并让我们的网站对移动友好且结构良好。


    ## 奠定基础


    正如你在第 1 章中学到的，Foundation 的主要目标是为你提供一个可以在其基础上构建的框架。Foundation 实现这一目标的方法是使用网格布局。在继续之前之前，让我们后退一步，看看
    Web 设计是如何结构的。


    在很久以前的一个遥远的银河系，当 Web 开发还处于婴儿时期时，设计通常由自由流动的段落元素组成。结果看起来更像凌乱的报纸页面，而不是我们今天看到的复杂的、多媒体丰富的的设计。


    为了给混乱带来秩序，HTML 表格被使用了。虽然它们确实有助于清理混乱，但它们的僵硬给早期 Web 的面貌增添了明显的冷酷感。以下是 HTML 表格不适用于布局的几个原因：


    *   像这样使用表格描述的是呈现而非内容，因此使用表格布局的网站在语义上是不正确的。

    *   屏幕阅读器用户很难理解使用表格进行布局的网站。

    *   使用表格布局重新设计网站是非常困难的。

    *   表格可能会破坏文本复制，这对于某些用户来说非常困扰。


    抱歉讲了一堂关于 Web 设计的历史课，但它很好地说明了为什么 Foundation（以及其他流行的 CSS 框架）选择网格布局作为其最基本的构建模块。你会发现，通常情况下，Web
    是一个用于消费内容的巨大仓库。作为人类，我们习惯以有序的方式消费内容。网格布局以一种非常灵活的方式赋予了这种能力。


    在表格的僵硬与自定义 CSS 的自由之间取得了极佳的，网格代表了 Foundation 框架的基石。图 2.1 展示了网格布局在实践中样子的快速示例：


    ![Foundation 网格系统的基本示例](img/Image-2-1.png)


    图 2.1. Foundation 网格系统的基本示例


    你可以看到有一单行，包含三个不同颜色和宽度的列。这是 Foundation 网格系统最基本的用法。让我们添加一个新行并在其中插入两个不同宽度的列，如图 2.2
    所示。


    ![为示例添加两行](img/Image-2-2.png)


    图 2.2. 为示例添加两行


    这里需要注意的是，我们的网站是在桌面尺寸浏览器上显示的。如果我们缩小浏览器窗口（例如在移动设备上），会发生什么？图 2.3 中的截图显示了我们在较小窗口中的网站。


    ![较窄窗口下的简单示例](img/Image-2-3.png)


    图 2.3. 在较窄窗口下的简单示例


    噢。这出乎意料。这两个包含多个列的两个行是如何堆叠在一起的？让我们通过查看后续章节的代码来尝试理解。


