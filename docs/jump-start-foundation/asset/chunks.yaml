    \ this library helps to detect if the browser supports these features and then\
    \ adds conditional code to the website. You can read more about Modernizr on its\
    \ [official website](http://modernizr.com).\n\nInside the `<body>` section, we’ve\
    \ included two JavaScript files: `jquery.js` and `foundation.min.js`. Since Foundation\
    \ depends on jQuery, you must always include jQuery before including Foundation’s\
    \ JavaScript file. Finally, we have initialized Foundation’s script by calling\
    \ the `foundation()` method. This function initializes all the predefined JavaScript\
    \ components in Foundation that we’ll cover in future chapters.\n\n## Getting\
    \ Our Hands Dirty with the Grid System\n\nBefore creating any columns, we first\
    \ need the rows that will hold them. Let’s create a row first:\n\n```\n<div class=\"\
    row\">\n</div>\n```\n\nIt’s that simple. You just add the class `row` to the `<div>`\
    \ element to create a row.\n\nThe Foundation grid system divides the screen into\
    \ 12 equally sized columns by default. These are called **virtual columns** and\
    \ their widths vary as per the width of the device. The real columns are created\
    \ by specifying how many of the 12 Foundation virtual columns you wish to span\
    \ with your columns. Suppose we want only a single column. Then we’ll span all\
    \ the 12 available virtual Foundation columns. For this we’ll use the class `large-12`.\
    \ (You can ignore the `large` term in the class name for now; we’ll discuss that\
    \ later).\n\nThe code for creating a single column that spans all twelve virtual\
    \ Foundation columns looks like this:\n\n```\n<div class=\"row\">\n    <div class=\"\
    column large-12\">\n</div>\n</div>\n```\n\nIn Foundation, it’s mandatory to attach\
    \ an additional class `column` to every column element, as it helps Foundation\
    \ to easily identify a column. You can also use the class `columns` instead of\
    \ `column` and Foundation will create the same column for you. There’s no difference\
    \ between `columns` and `column`.\n\nLet’s proceed to create a two-column layout.\
    \ if we want to have two equal-width columns, each will occupy six virtual Foundation\
    \ columns:\n\n*index.html (excerpt)*\n\n```\n<div class=\"row\">\n    <div class=\"\
    large-6 column\" style=\"background: #aaaaaa; height: 100px;\">\n        Column\
    \ 1\n    </div>\n    <div class=\"large-6 column\" style=\"background: #cccccc;\
    \ height: 100px;\">\n        Column 2\n    </div>\n</div>\n```\n\nI have added\
    \ background colors and height to each column so that we can clearly distinguish\
    \ between them. Let’s check out how this looks in a browser, in [Figure 2.4](#ch02.html_ch2ex4\
    \ \"Figure 2.4. A basic two-column layout\").\n\n![A basic two-column layout](figures/Image-2-4.png)\n\
