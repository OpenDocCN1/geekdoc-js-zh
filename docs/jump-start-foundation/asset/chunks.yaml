  trans: "\n\n```\n<div class=\"row\">\n    <div class=\"large-6 large-offset-3 column\"\
    \ style=\"background: \n#ddd;height: 200px; margin-top: 50px;\">\n        Hello\
    \ World.\n    </div>\n</div>\n```\n\n这将创建一个居中的列，如图 2.7 所示。\n\n![使用偏移量居中的列](img/Image-2-11.png)\n\
    \n图 2.7. 使用偏移量居中的列\n\n## Foundation 的响应式特性\n\n如今的网页设计世界与五年前已完全不同。有几个因素在推动我们所看到的设计格局的剧变中发挥了重要作用，但最引而注目的是技术的自然演进。网络技术不断完善，带宽不断增加，而我们用于消费网页内容的设备变得越来越强大。最近，这种变化带来了一个独特的挑战。长期以来，我们查看网页内容的界面（或屏幕）尺寸稳步增长，而现代移动设备的普及导致了人们在小得多的屏幕上浏览的频率增加。\n\
    \n现代开发者不再仅仅关注少数流行的大型桌面屏幕尺寸，还必须为小屏幕制作同样出色的设计。将富媒体的大屏体验转化到小得多的移动屏幕的困难导致了`响应式网页设计`（RWD）的发展。简而言之，以响应式方式设计的网页内容会对不同的屏幕尺寸产生智能且动态的反应。页面会动态重构自身，根据用户的屏幕尺寸以最有意义的方式呈现内容。\n\
    \n使用 Foundation 框架，你设计的每个页面在网格布局中构建时将天生具有响应性。为了证明我不是在开你玩笑，让我们看看在上一节中创建的两个行网格布局示例。你可能记得，我们在两个网格示例中都没有显式地定义任何响应式样式或行为；我们只是添加了行和列。让我们来看图\
    \ 2.8，看看当我们缩小屏幕尺寸时会发生什么。\n\n![较小屏幕上的双行布局](img/Image-2-7.png)\n\n图 2.8. 较小屏幕上的双行布局\n\
    \n在不添加任何自定义样式的情况下，我们简单的网格布局自动响应了屏幕尺寸的变化，行和列堆叠了一起。这再次说明了使用 Foundation 等框架的力量。网页开发过程中耗时的方面已变得自动化。然而，它们不仅是自动的，而且是健的，为定制和扩展留下了大量空间。\n\
    \n尽管 Foundation 默认能够处理移动兼容性，但那种设计可能不是我们想要的。我们可能希望列根据网站显示在手机、平板电脑还是桌面显示器上有不同的适应。针对这种情况，Foundation\
    \ 定义了一组用于手机和平板电脑的类。让我们仔细检查它们。\n\n对于宽度小于 640px 的设备，Foundation 有一组以 `small-#` 开头的类。对于宽度大于\
    \ 640px 且小于 1024px 的设备，它有 `medium-#` 类。我们在上一节中使用的 `large-#` 类适用于宽度大于 1024px 的设备。这意味着没有必要修改上一节中编写的代码来分别适应平板电脑和智能手机。我们只需要添加更多尺寸类来让列以不同的方式显示。\n\
    \n让我们如下修改第一行的代码：\n\n*index.html (节选)*\n\n```\n<div class=\"row\">\n    <div class=\"\
    large-6 medium-4 small-12 column\" style=\"background:\n#aaaaaa; height: 100px;\"\
    >\n        Column 1\n    </div>\n    <div class=\"large-6 medium-8 small-12 column\"\
    \ style=\"background:\n#cccccc; height: 100px;\">\n        Column 2\n    </div>\n\
    </div>\n```\n\n这里是三种浏览器宽度下的截图。\n\n图 2.9 显示，在桌面屏幕上，它看起来和之前一样。\n\n![较大屏幕上的修改后示例](img/Image-2-8.png)\n\
    \n图 2.9. 较大屏幕上的修改后示例\n\n在图 2.10 中，我们可以看到它在平板电脑尺寸浏览器上的样子。第一列比第二列略小。\n\n![平板尺寸屏幕上的修改后示例](img/Image-2-9.png)\n\
    \n图 2.10. 平板尺寸屏幕上的修改后示例\n\n在手机尺寸浏览器上，它看起来像图 2.11。两个列都占据了行的所有部分，因此它们堆叠在起。\n\n![智能手机尺寸屏幕上的示例](img/Image-2-10.png)\n\
    \n图 2.11. 智能手机尺寸屏幕上的示例\n\nFoundation 还有偏移量类，你可以使用它们来在小型和中型屏幕上定义特定的偏移量：`small-offset-*`\
