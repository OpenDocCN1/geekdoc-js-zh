  trans: "\n\n![表单现在拒绝空字段](img/Image-6-16.png)\n图 6.11. 表单现在拒绝空字段\n\n我们将通过添加更多细节来完善我们的表单验证。Abide\
    \ 验证允许你为每个输入字段添加模式，以便它只接受特定的值。例如，如果你想让名称字段只接受字符而排除数字，那么有一个你必须向 Abide 库提供的特定模式。这些模式也也被称为\
    \ `regular expressions`（正则表达式）或 `RegEx`。你可以在 [MDN 开发者网络上阅读更多关于 RegEx 的知识](https://developer.mozilla.org/en/docs/Web/JavaScript/Guide/Regular_Expressions)。另一个可以让你轻松获取模式的酷炫在线工具是\
    \ [HTML5Pattern.](https://html5pattern.com) 你也可以参考 Foundation 的文档获取一些 [预定义模式。](http://foundation.zurb.com/docs/components/abide.html#predefined-patterns)\n\
    \n让我们在名称字段中添加模式 `[a-zA-Z]+`。这将强制只提交字母字符：\n\n```\n<input type=\"text\" required\
    \ pattern=\"[a-zA-Z]+\"/>\n```\n\n如果你现在尝试使用无效输入（如数字）提交表单，你将在名称字段中收到错误。\n\n###\
    \ 警告：单向错误检查\n\nAbide 验证库仅提供客户端验证。它使用 `JavaScript` 在浏览器中检查错误，因此如果用户的浏览器上禁用了 JavaScript，它将无法工作。我们建议你始终在服务器端也对表单进行验证，使用\
    \ `PHP` 或 `Ruby` 等编程语言。\n\n## 开关 (Switches)\n\n开关是一种切换元素，点击或触摸时可以在开启和关闭状态之间切换，如图图\
    \ 6.12 所示。\n\n![开关](img/Image-6-13.png)\n图 6.12. 开关\n\nFoundation 框架中开关最好的地方在于它们是使用普通的复选框和单选按钮\
    \ HTML 元素生成的。因此，你可以使用传统的 JavaScript 方法检测这些元素的状态。\n\n要创建一个开关，设置一个具有类 `switch` 的\
    \ `<div>` 元素。然后在它内部插入一个带有标签标记的 HTML 复选框：\n\n```\n<div class=\"switch\">\n  <input\
    \ id=\"exampleCheckboxSwitch\" type=\"checkbox\">\n  <label for=\"exampleCheckboxSwitch\"\
    ></label>\n</div>\n```\n\n你需要确保标签元素的 `for` 属性包含输入复选框元素的 ID 值。\n\n图 6.13 显示了它看起来应该是什么样。\n\
    \n![基础切换开关](img/Image-6-9.png)\n图 6.13. 基础切换开关\n\n你也可以使用相同的标记创建一组单选按钮开关。请确保你为所有开关都设置了相同的\
    \ `name` 属性，如代码所示。通过单选按钮驱动的开关，你可以确保一次只有一个开关被选中：\n\n```\n<div class=\"switch\"\
    >\n  <input id=\"exampleRadioSwitch1\" type=\"radio\" checked name=\"testGroup\"\
    >\n  <label for=\"exampleRadioSwitch1\"></label>\n</div>\n\n<div class=\"switch\"\
    >\n  <input id=\"exampleRadioSwitch2\" type=\"radio\" name=\"testGroup\">\n  <label\
    \ for=\"exampleRadioSwitch2\"></label>\n</div>\n\n<div class=\"switch\">\n  <input\
    \ id=\"exampleRadioSwitch3\" type=\"radio\" name=\"testGroup\">\n  <label for=\"\
    exampleRadioSwitch3\"></label>\n</div>\n```\n\n结果将看起来像图 6.14 所示。\n\n![单选按钮驱动的开关](img/Image-6-10.png)\n\
    图 6.14. 单选按钮驱动的开关\n\n### 开关尺寸\n\n你还可以使用几个 CSS 类来控制开关的形状和大小：\n\n* `large`: 用于较大的开关\n\
    * `small`: 用于较小的开关\n* `tiny`: 用于极小的开关\n\n你还可以添加以下类来更改你开关的形状：\n\n* `radius`: 添加\
    \ `4px` 的边圆角\n* `round`: 添加 `2rem` 的边圆角\n\n以下是这些类的用法示例：\n\n```\n<div class=\"\
    switch large radius\">\n  <input id=\"exampleRadioSwitch4\" type=\"radio\" name=\"\
    testGroup\">\n  <label for=\"exampleRadioSwitch4\"></label>\n</div>\n```\n\n这将创建一个具有\
    \ `4px` 边圆角的大开关。\n\n图 6.15 显示了开关的所有形状和尺寸。\n\n![各种尺寸和样式的开关](img/Image-6-11.png)\n\
    图 6.15. 各种尺寸和样式的开关\n\n### 禁用开关\n\n在某些情况下，你可能想要禁用开关使其无法被选中。最简单的方法是使用 HTML5 默认的\
    \ `disabled` 属性。它可以添加到任何 HTML 标签中，以便该标签上的点击事件将失效。默认情况下，Foundation 不为禁用状态提供样式。\n\
    \n但是，如果你在开关上添加 `disabled` 属性，我们需要通过编写自定义 CSS 来解决这个问题：\n\n```css\nswitch.disabled\
    \ {\n  opacity: 0.25;\n  pointer-events: none; // 阻止点击事件\n}\n```\n\n然后为 `<input>`\
    \ 元素添加 `disabled` 类，例如：\n\n```\n<div class=\"switch large radius\">\n  <input\
    \ id=\"exampleSwitch\" type=\"radio\" name=\"testGroup\" disabled>\n  <label for=\"\
    exampleSwitch\"></label>\n</div>\n```\n\n你应该能看到像图 6.16 所示的效果。\n\n## 总结\n\n我希望你学习\
    \ Foundation 中的表单觉得很有趣。在本章中，我们学习了通过掌握网格系统和添加 CSS 类来创建漂亮的表单。我们还探索了如何创建前缀和后缀输入字段，如何将标签与输入字段内联，以及如何指示错误。最后，我们看到了直观的开关元素。\n\
    \n在下一章中，我们将发现如何使用 Sass 预处理器来自定义 Foundation 的默认样式。所以请休息一下，然后准备好进入这本书精彩的最后一章。\n\n"
- fmt: "\nCompiling this Sass code will generate the following output:\n\n```\n.button{\n\
    \  background: #00f;\n  color: #fff;\n}\n```\n\nYou can also create functions\
    \ in Sass that help you separate repeatable CSS properties. Nested-rule capabilities\
    \ are yet another advantage of using Sass. We’ll cover some of these features\
    \ as we proceed through the chapter. If you are keen to learn more about Sass,\
    \ visit [the official website.](http://sass-lang.com/)\n\nCustomizing Foundation\
    \ is very easy using Sass, as Foundation gives you access to the Sass variables\
    \ and functions that were used to generate the default CSS file. For this we’ll\
    \ download the Sass version of Foundation, which contains all the Sass files used\
    \ to generate the CSS file, as well as some other files that we’ll cover very\
    \ soon.\n\nThe best way to create a Sass version of a Foundation project is to\
    \ use Foundation’s command line interface, or `CLI` for short. It gives you the\
    \ option to create new Foundation projects by writing a single command-line statement.\
    \ If you’re planning to use Foundation and customize it with Sass, we’d recommend\
    \ that you download Foundation `CLI`, which we’ll cover shortly.\n\n### Tip: If\
    \ You Prefer Vanilla\n\nWe’re going to be working with a number of different tools\
    \ and using the command line in this chapter. Although we’ll be providing step-by-step\
    \ instructions, if you find it too tricky you can always stick with vanilla Foundation\
    \ and use your `app.css` to customize the framework instead.\n\n## Installing\
    \ Foundation CLI\n\nWe’ll require some tools installed on our machines before\
    \ we can install Foundation CLI:\n\n* `Git`\n* `Node.js`\n* `Ruby 1.9+`\n\nHere’s\
    \ some help should you need it.\n\n### Installing Git\n\nThe easiest way to install\
    \ Git is to [download the installer.](http://git-scm.com/download) Click on the\
    \ appropriate operating system and, once downloaded, double-click on it and follow\
    \ the instructions.\n\nTo check if you have successfully installed Git, open a\
    \ terminal (Terminal in OS X, Command Prompt in Windows) and type `git --version`.\
    \ It should display the installed version of Git.\n\n### Installing Node.js\n\n\
    To install Node.js download its package from [nodejs.org,](https://nodejs.org)\
    \ then double-click on the package and follow the instructions.\n\nYou can check\
    \ if Node.js was installed successfully by typing `node -v` in your system terminal.\
    \ It should display the currently installed version of Node.js.\n\n### Installing\
    \ Ruby\n\nIf you’re using a Macintosh machine, you’ll probably have Ruby pre-installed.\
    \ Go to the terminal and run the command `ruby -v`. It should display the version\
    \ number of the currently installed version.\n\nFor different operating systems,\
    \ appropriate Ruby installers can be found at [https://www.ruby-lang.org/en/documentation/installation/#installers](https://www.ruby-lang.org/en/documentation/installation/#installers).\n\
    \n### Installing Foundation CLI\n\nTo manage its own updates—as well as those\
    \ for third-party libraries—Foundation uses [Bower.](http://bower.io/) If you’re\
    \ unfamiliar with Bower, it’s a client-side package manager that keeps track of\
    \ packages that a developer uses. In this case, the package we need is the Foundation\
    \ framework. We also require `grunt-cli`, a JavaScript program that runs various\
    \ predefined tasks for Foundation CLI. You can read more about Grunt at [http://gruntjs.com](http://gruntjs.com).\n\
    \nOpen the terminal and type the following command:\n\n```\nnpm install -g bower\
    \ grunt-cli\n```\n\nNow let’s install Foundation CLI using the following command:\n\
    \n```\ngem install foundation\n```\n\n### Note: Permission Errors\n\nIf you run\
    \ into any permission errors using these two commands, add the word `sudo` in\
    \ front of them and enter your system password if prompted. This should fix your\
    \ problem. If you experience other issues, we’d recommend that you head over to\
    \ the [SitePoint Forums.](http://community.sitepoint.com/)\n\nAfter you’re done\
    \ executing the commands, type the following to check if Foundation was installed\
    \ properly\n\n```\nfoundation version\n```\n\nIt should return a version number.\
    \ In my case it returned `v1.0.4`, which means Foundation CLI v1.0.4` was installed\
    \ on my system.\n\nNow we’re done installing the Foundation CLI. In the next section,\
    \ we’ll install a Sass compiler that will recompile the Sass file whenever we\
    \ modify the Foundation’s default Sass files.\n\n## Installing Compass and Creating\
    \ a Sass Foundation Project\n\nCompass is an open-source CSS authoring framework\
    \ that uses the Sass stylesheet language. It compiles Sass into static CSS stylesheets.\n\
    \nInstalling Compass is extremely straightforward. You simply type the following\
    \ command:\n\n```\ngem install compass\n```\n\nOnce installed, navigate to a folder\
    \ where you generally keep all your projects using the terminal; for example,\
    \ `cd Documents`. Next, type the following command to generate your first Sass-compatible\
    \ Foundation project:\n\n```\nfoundation new First_project\n```\n\nThis will create\
    \ a new project called `First_project`. We’ll cover every folder and file in this\
    \ project in the section that follows.\n\nThere’s another step to perform after\
    \ creating a new Foundation project: running the `bundle` command. This command\
    \ ensures that we’re using the correct libraries mentioned in the `Gemfile` file\
    \ that’s present in the root folder. If you open this file, you’ll see that it\
    \ has the version of `sass` and `compass` included in it. The `bundle` command\
    \ is very useful when you are changing the environment of the project, such as\
    \ switching to a new system.\n\n### Note: What’s the Gemfile?\n\nGemfile keeps\
    \ the list of gem dependencies of your Rails application. The dependencies are\
    \ met by Bundler by running `bundle`.\n\nYou have to run this `bundle` command\
    \ once for new project. Install Bundler using this command:\n\n```\ngem install\
    \ bundler\n```\n\nYou can read more about bundler on its [official website.](http://bundler.io/)\n\
    \nOnce bundler is installed, navigate to the newly created folder `First_project`\
    \ and run the `bundle` command:\n\n```\ncd First_project\nbundle\n```\n\nAfter\
    \ the `bundle` command installs everything, run the following to make Compass\
    \ watch for any changes we make to our Sass files, and compile them instantaneously:\n\
    \n```\nbundle exec compass watch\n```\n\nLet’s check to see if Compass is really\
    \ working. Just to test it out, open the `scss/app.scss` file and define a new\
    \ Sass variable at the bottom:\n\n```\n$mycolor: #FFF;\n```\n\nOnce the file is\
    \ saved, you should see Compass executing some commands in the terminal:\n\n```\n\
    modified scss/app.scss\nwrite stylesheets/app.css\n```\n\nMake sure you delete\
    \ the `$mycolor` variable that was defined previously and save the file again.\n\
    \n## Understanding Foundation’s Project Structure\n\nThe contents of the `First_project`\
    \ folder should look a little like [Figure 7.1](#ch07.html_ch7ex1 \"Figure 7.1.\
    \ Foundation’s Sass structure\").\n\n![Foundation’s Sass structure](figures/Image-7-1.png)\n\
    \nFigure 7.1. Foundation’s Sass structure\n\nIt’s time to understand some of the\
    \ important files and folders inside this project. The first is the folder `bower_components`,\
    \ with Bower managing its contents. It contains various third-party libraries\
    \ such as `fastclick.js`, `jquery`, `Modernizr`, and so on. It’s recommended that\
    \ you avoid changing anything inside this folder as it could result in conflicts.\n\
    \n`bower.json` is a manifest file that's used by Bower to keep track of the various\
    \ third-party libraries used by a particular project. If you open this file, it\
    \ should look similar to this:\n\n`bower.json`\n\n```\n{\n  \"name\": \"foundation-compass-app\"\
    ,\n  \"version\": \"0.0.1\",\n  \"private\": \"true\",\n  \"dependencies\": {\n\
    \    \"foundation\": \"zurb/bower-foundation\"\n  }\n}\n```\n\nSuppose that you\
    \ want to install AngularJS in this project. You can download it using a Bower\
    \ command such as:\n\n```\nbower install angular --save\n```\n\nBower will download\
    \ the AngularJS package in the folder `bower_components/angular` and create a\
    \ new entry in the `bower.json` file.\n"
