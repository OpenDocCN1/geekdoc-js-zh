  trans: "\n\n通过 `Clearing` 组件，可以创建一个以全屏模式显示图片的幻灯片，并妥善处理高度可变的图片。它的外观类似于 Google+ 的照片灯箱，显示一组较小的图片缩略图，点击后即可全屏显示该图片。让我们来看看如何创建一个\
    \ `Clearing` 组件：\n\n*clearing.html (节选)*\n\n```html\n<ul class=\"clearing-thumbs\"\
    \ data-clearing>\n  <li><a href=\"path/to/your/img\"><img src=\"path/to/your/img-th\"\
    ></a\n↵</li>\n  <li><a href=\"path/to/your/img\"><img src=\"path/to/your/img-th\"\
    ></a\n↵</li>\n  <li><a href=\"path/to/your/img\"><img src=\"path/to/your/img-th\"\
    ></a\n↵</li>\n</ul\n```\n\n如你所见，你需要设置一个带有 `.clearing-thumbs` 的无序列表并添加 `data-clearing`\
    \ 属性。列表中的每个 `<li>` 元素代表一个缩略图图像，其中包含一个包裹着图像标签的锚点标签。锚点标签链接到原始图片，而图像标签则包含图片缩略图的路径。\n\
    \n与 `Orbit` 组件相比，选择 `Clearing` 组件的唯一缺点是你必须为所包含的每张图片创建两个不同尺寸——缩略图和全尺寸图片。\n\n我们创建的\
    \ `Clearing` 组件看起来像图 5.4。\n\n![Clearing 组件的示例](img/Image-5-4.png)\n\n图 5.4. Clearing\
    \ 组件的示例\n\n当你点击这些缩略图中的任何一个时，全尺寸将在灯箱中显示，所示图 5.5。\n\n![点击缩略图后，显示全尺寸图片。](img/Image-5-5.png)\n\
    \n图 5.5. 点击缩略图后，显示全尺寸图片。\n\n如果你想对缩略图进行样式处理，请为列表中的每个 `<li>` 元素添加 `th` 类：\n\n*clearing.html\
    \ (节选)*\n\n```html\n<ul class=\"clearing-thumbs\" data-clearing>\n  <li class=\"\
    th\"><a href=\"path/to/your/img\"><img src=\"path/to/your/\n↵img-th\"></a></li>\n\
    \ …\n</ul\n```\n\n现在，每张缩略图都有了带有内边距的边框，使它们看起来更像缩略图。\n\n对于图片说明，在图像标签上添加 `data-caption`\
    \ 属性，并将你的说明文本作为值：\n\n*clearing.html (节选)*\n\n```html\n<ul class=\"clearing-thumbs\"\
    \ data-clearing>\n  <li class=\"th\"><a href=\"path/to/your/img\"><img src=\"\
    path/to/your/\n↵img-th\" data-caption=\"First image caption\"></a></li>\n …\n\
    </ul\n```\n\n## 总结\n\n在本章中，我们使用 Foundation 中的各种组件处理了两种重要的媒体类型——视频和图像。首先，我们看到了如何使用\
    \ flex 视频创建响应式图像。然后，我们看到了如何使用 `Orbit` 组件创建一个精美的图像幻灯片。最后，我们学习了 `Clearing` 组件，这是在任何网站中显示图片的最佳方法之一。\n\
    \n在下一章中，我们将学习在 Foundation 中创建和样式化表单是多么简单。我们还将看到如何创建直观的切换按钮和范围滑块，并通过 Abide 验证库讨论\
    \ Foundation 中的客户端侧表单验证。\n\n# 第 6 章：处理表单\n\n表单是任何网站至关重要的组件。登录页面、注册页面、评论框、反馈部分和问卷都是\
    \ HTML 表单。虽然使用基础 HTML 标记创建表单很容易，但为每个表单元素设置样式可能是一个无聊的任务。\n\n在本章中，我们将学习如何使用 Foundation\
    \ 框架创建美观、响应式的表单。我们将探索 Foundation 的表单验证类，以及如何使用 `Abide` 验证表单。最后，我们将发现如何使用 Foundation\
    \ 的切换开关（例如 iOS 设备中的开启/关闭按钮）。最后，我们将探索 Foundation 的表单验证类。。让我们开始吧。\n\n## 构建基础表单\n\
    \n与许多其他前端框架（如 Bootstrap）不同，Foundation 没有为 HTML 表单提供特定的 CSS 类。Foundation 的主 CSS\
    \ 文件包含了每个基础 HTML 元素的默认样式。一如既往，如果你想覆盖某种样式或使用新样式，可以在你的 `app.css` 文件中自由进行。\n\nFoundation\
    \ 网格系统在表单中用于控制表单输入元素的宽度，并将表单元素放置在正确的位置。让我们检查如何在 Foundation 中将两个不同的 HTML 输入元素并排放置：\n\
    \n```html\n<form>\n    <div class=\"row\">\n        <div class=\"small-6 columns\"\
    >\n            <input type=\"text\" placeholder=\"First Name\" />\n        </div>\n\
    \        <div class=\"small-6 columns\">\n            <input type=\"text\" placeholder=\"\
    Last Name\"/>\n        </div>\n    </div>\n</form>\n```\n\n在这里我们有两个使用 `small-6`\
    \ 和 `columns` 类的不同列。每个列中都放置了一个输入元素，占据 `columns` 的宽度。这种表单所示图 6.1。\n\n![基础布局](img/Image-6-1.png)\n\
    \n图 6.1. 基础布局\n\n要为输入标签添加标签，如所示用 `<label>` 标签包裹它：\n\n```html\n<label>First Name\n\
    \    <input type=\"text\" placeholder=\"First Name\" />\n</label>\n```\n\n将 `<label>`\
    \ 包裹在输入元素周围将其关联。如果用 `<label>` 标签包裹表单不符合你的需求，可以使用 `<label>` 标签上的 `for` 属性。表单所示图\
    \ 6.2。\n\n![带有标签的表单](img/Image-6-2.png)\n\n图 6.2. 带有标签的表单\n\n你还可以为 `<select>`\
    \ 和 `<textarea>` 元素添加标签。让我们为现有表单添加 `<select>` 和 `<textarea>` 元素：\n\n*index.html\
    \ (节选)*\n\n```html\n<form>\n    <div class=\"row\">\n        <div class=\"small-6\
    \ columns\">\n            <input type=\"text\" placeholder=\"First Name\" />\n\
    \        </div>\n        <div class=\"small-6 columns\">\n            <input type=\"\
    text\" placeholder=\"Last Name\"/>\n        </div>\n    </div>\n    <div class=\"\
    row\">\n        <div class=\"large-12 columns\">\n            <label>Select Place\n\
    \                <select>\n                    <option value=\"husker\">Alabama</option>\n\
    \                    <option value=\"starbuck\">Alaska</option>\n            \
    \        <option value=\"hotdog\">Arizona</option>\n                    <option\
    \ value=\"apollo\">California</option>\n                </select>\n          \
    \  </label>\n        </div>\n    </div\n    <div class=\"row\">\n        <div\
    \ class=\"large-12 columns\">\n            <label>Add comment\n              \
    \  <textarea placeholder=\"Write something\"></textarea>\n            </label>\n\
    \        </div>\n    </div>\n</form>\n```\n\n表单现在图 6.3 所示。\n\n![带有 select 和 textarea\
    \ 元素的表单。](img/Image-6-3.png)\n\n图 6.3. 带有 select 和 textarea 元素的表单。\n\n现在为我们的示例表单添加一些单选按钮和复选框：\n\
    \n*index.html (节选)*\n\n```html\n<div class=\"row\">\n    <div class=\"large-6\
    \ columns\">\n        <label>Select Gender</label>\n        <input type=\"radio\"\
    \ name=\"gender\" value=\"male\" id=\"\n↵maleRadio\"><label for=\"maleRadio\"\
    >Male</label>\n        <input type=\"radio\" name=\"gender\" value=\"female\"\
    \ id=\"\n↵femaleRadio\"><label for=\"femaleRadio\">Female</label>\n    </div\n\
    \n    <div class=\"large-6 columns\">\n        <label>Preferred Color</label>\n\
    \        <input id=\"blueCheckbox\" type=\"checkbox\"><label for=\"\n↵blueCheckbox\"\
    >Blue</label>\n        <input id=\"redCheckbox\" type=\"checkbox\"><label for=\"\
    \n↵redCheckbox\">Red</label>\n    </div\n</div>\n```\n\n结果应该类似于图 6.4。\n\n"
- fmt: "\n![Our example form evolves with radio buttons and checkboxes added.](figures/Image-6-4.png)\n\
    \nFigure 6.4. Our example form evolves with radio buttons and checkboxes added.\n\
    \n### Prefix and Postfix Input Fields\n\nFoundation has two types of input fields:\
    \ prefix (in which symbols such as `$` and `€` can be added) and postfix (where\
    \ text such as ‘.com’ can be added). This can be seen in [Figure 6.5](#ch06.html_ch6ex5\
    \ \"Figure 6.5. Prefix and postfix input fields.\").\n\n![Prefix and postfix input\
    \ fields.](figures/Image-6-5.png)\n\nFigure 6.5. Prefix and postfix input fields.\n\
    \nTo create a prefix or postfix input field, first build a two-column layout using\
    \ the Foundation grid system. Then produce a `<div>` element with the classes\
    \ `row` and `collapse`. Here, `collapse` will help in removing the default padding\
    \ and margin between columns:\n\n```\n<div class=\"row collapse\">\n</div>\n```\n\
    \nNext, we add columns inside this `row` element. To create a prefix input box,\
    \ construct a thin column and then a wide column. Let’s select `small-3` for the\
    \ thin column and `small-9` for the wide column:\n\n```\n<div class=\"row collapse\"\
    >\n  <div class=\"small-3 columns\">\n  </div>\n  <div class=\"small-9 columns\"\
    >\n  </div>\n</div>\n```\n\nRemember to add the class `columns` or `column` along\
    \ with the column widths. Add your desired prefix text, such as ‘$’, with the\
    \ help of a `<span>` tag inside the thin column. It should have the class `prefix`\
    \ to apply the CSS style:\n\n```\n<div class=\"small-3 columns\">\n    <span class=\"\
    prefix\">$</span>\n</div>\n```\n\nNow add the input field inside the wide column:\n\
    \n```\n<div class=\"small-9 columns\">\n    <input type=\"text\" placeholder=\"\
    Enter Amount\"/>\n</div>\n```\n\nTry checking this code in the browser. You should\
    \ have a prefix input box indicating that you should enter a dollar amount.\n\n\
    For a postfix input box, simply exchange the positions of the thin and wide columns.\
    \ Then use the class `postfix` for the `<span>` tag instead of `prefix`. Here’s\
    \ the code for a postfix input box:\n\n```\n<div class=\"row collapse\">\n   \
    \ <div class=\"small-9 columns\">\n        <input type=\"text\" placeholder=\"\
    example\" />\n    </div>\n    <div class=\"small-3 columns\">\n        <span class=\"\
    postfix\">.com</span>\n    </div>\n</div>\n```\n\n### Inlining Label and Input\
    \ Fields\n\nSometimes you may need to place the label left of the input field\
    \ instead of on top of it. You can do this with the help of the grid system and\
    \ some additional CSS classes.\n\nWe have to create two columns, one thin and\
    \ one wide. We’ll use the class `small-3` for the thin column and `small-9` for\
    \ the wide column:\n\n```\n<div class=\"row collapse\">\n    <div class=\"small-3\
    \ columns\">\n    </div>\n    <div class=\"small-9 columns\">\n    </div>\n</div>\n\
    ```\n\nAdd a `<label>` tag to the thin column as follows:\n\n```\n<div class=\"\
    small-3 columns\">\n    <label for=\"nameField\">Enter Name</label>\n</div>\n\
    ```\n\nNow place an input field in the wide column:\n\n```\n<div class=\"small-9\
    \ columns\">\n    <input type=\"text\" id=\"nameField\" placeholder=\"John Doe\"\
    \ />\n</div>\n```\n\nLet’s check it out on the browser. It will look like [Figure\
    \ 6.6](#ch06.html_ch6ex6 \"Figure 6.6. An inline label\").\n\n![An inline label](figures/Image-6-6.png)\n\
    \nFigure 6.6. An inline label\n\nThere’s a small issue here, however. The label\
    \ looks vertically misaligned with respect to the input box. We need to add some\
    \ CSS classes to make it look perfect. Adding the class `right` to the label text\
    \ will make it float right. This will bring it closer to the input field. Adding\
    \ another CSS class `inline` will add some padding and margin to it.\n\n```\n\
    <div class=\"small-3 columns\">\n    <label for=\"nameField\" class=\"right inline\"\
    >Enter Name</label>\n</div>\n```\n\nIf you reload the browser page, you should\
    \ see a perfectly aligned label text as shown in [Figure 6.7](#ch06.html_ch6ex7\
    \ \"Figure 6.7. Our adjusted inline label\").\n\n![Our adjusted inline label](figures/Image-6-7.png)\n\
    \nFigure 6.7. Our adjusted inline label\n\n### Error States\n\nIndicating whether\
    \ an input field has an invalid entry is extremely straightforward in Foundation.\
    \ Simply add the class `error` to the label text to make it red. You can also\
    \ place additional text below the input field for an error message. This text\
    \ is added using a `<small>` tag with a class `error`. Here’s an example of an\
    \ input field with an error state:\n\n*index.html (excerpt)*\n\n```\n<div class=\"\
    small-12 columns\">\n    <label class=\"error\">Name\n        <input type=\"text\"\
    \ placeholder=\"Name\" />\n    </label>\n    <small class=\"error\">Invalid entry</small>\n\
    </div>\n```\n\nThis will look similar to [Figure 6.8](#ch06.html_ch6ex8 \"Figure\
    \ 6.8. Indicating an error state on the form\").\n\n![Indicating an error state\
    \ on the form](figures/Image-6-8.png)\n\nFigure 6.8. Indicating an error state\
    \ on the form\n\nNote that we’ve yet to actually carry out any validation of the\
    \ form here. A simple way to do this is to use the Abide validation library, which\
    \ we'll cover next.\n\n### Validating Forms Using Abide\n\nAbide is a library\
    \ that Foundation supports to provide client-side form validation, and comes preloaded\
    \ in Foundation's complete package. In the previous section, we saw how to *indicate*\
    \ an error state in a form but we're yet to learn when and how to *invoke* those\
    \ error states. We'll now use Abide to add client-side validation to our form.\n\
    \nHere’s a demo form that we’ll use:\n\n```\n<form>\n  <div class=\"name-field\"\
    >\n    <label>Your name\n      <input type=\"text\"/>\n    </label>\n    <small\
    \ class=\"error\">Name is required and must be a string.\n↵</small>\n  </div>\n\
    \  <div class=\"email-field\">\n    <label>Email\n      <input type=\"email\"\
    />\n    </label>\n    <small class=\"error\">An email address is required.</small>\n\
    \  </div>\n  <button type=\"submit\">Submit</button>\n</form>\n```\n\nThis basic\
    \ form asks for the name and email address of the user, and will look like the\
    \ form in [Figure 6.9](#ch06.html_ch6ex14 \"Figure 6.9. Our form without validation\"\
    ).\n\n![Our form without validation](figures/Image-6-14.png)\n\nFigure 6.9. Our\
    \ form without validation\n\nThe error states are visible up-front because we're\
    \ yet to set up Abide validation. To do so, we include an additional JavaScript\
    \ file into our index.html file. This file is called `foundation.abide.js` and\
    \ is present inside the `js/foundation/` folder. Place this file at the bottom\
    \ of the index.html file, just below the Foundation line as follows:\n\n```\n\
    ...\n<script src=\"js/vendor/jquery.js\"></script>\n<script src=\"js/foundation.min.js\"\
    ></script>\n<script src=\"js/foundation/foundation.abide.js\"></script>\n...\n\
    ```\n\nNext, we initialize the Abide library on our form by adding the attribute\
    \ `data-abide` to the `<form>` tag:\n\n```\n<form data-abide>\n...\n</form>\n\
    ```\n\nThe error states should now be hidden after you reload the page, as shown\
    \ in [Figure 6.10](#ch06.html_ch6ex15 \"Figure 6.10. The form with error states\
    \ hidden by Abide\").\n\n![The form with error states hidden by Abide](figures/Image-6-15.png)\n\
    \nFigure 6.10. The form with error states hidden by Abide\n\nIf you submit this\
    \ form, you'll see that the validation fails to work. This is because we haven't\
    \ told Abide library which fields to validate. The most basic validation requirement\
    \ is for the form fields not being empty. Well use HTML5's `required` attribute\
    \ to add the necessary validation to the form input fields:\n\n*index.html (excerpt)*\n\
    \n```\n<form data-abide>\n  <div class=\"name-field\">\n    <label>Your name\n\
    \      <input type=\"text\" required/>\n    </label>\n    <small class=\"error\"\
    >Name is required and must be a string.\n↵</small>\n  </div>\n  <div class=\"\
    email-field\">\n    <label>Email\n      <input type=\"email\" required/>\n   \
    \ </label>\n    <small class=\"error\">An email address is required.</small>\n\
    \  </div>\n  <button type=\"submit\">Submit</button>\n</form>\n```\n\nNow if you\
    \ try to submit the form—after reloading the page, of course—you'll see that validation\
    \ is working and empty fields aren't accepted, as shown in [Figure 6.11](#ch06.html_ch6ex16\
    \ \"Figure 6.11. The form now rejects empty fields\").\n"
