    - interchange responsive component

    - utility classes

    - JavaScript utilities

    - right-to-left support


    ### Navigation

    components that will help in providing effective naviagtion:

    - off-canvas

    - top bar

    - icon bar

    - side nav

    - Magellan sticky nav

    - sub nav

    - breadcrumbs

    - pagination


    ### Media

    components that will be used to hold images and videos:

    - Orbit slider

    - thumbnails

    - clearing lightbox

    - flex video


    ### Forms

    Foundation provides many pre-styled form elements that will help in enhacing the
    user experience of our web forms:

    - forms

    - switches

    - range sliders

    - Abide validation


    ### Buttons

    beautifully designed action elements (links and buttons):

    - buttons

    - button groups

    - split buttons

    - drop-down buttons


    ### Typography

    components that will help to enhance the look of some text elements such as important
    notices, list items, and so on in our web pages:

    - type

    - inline lists

    - labels

    - keystrokes


    ### Callouts and prompts

    components that will help in gaining the user’s attention to convey important
    messages:

    - reveal modal

    - alerts

    - panels

    - tooltips

    - Joyride


    ### Content

    useful components that are commonly found on the Web:

    - drop-downs

    - pricing tables

    - progress bars

    - tables

    - accordion

    - tabs

    - equalizer


    As you can see, Foundation comes equipped with a lot of useful components out
    of the box! We’ll go through many of these components in detail in later chapters,
    understanding how they are made and what HTML markup is needed to create them
    on our web pages.


    These components come prebuilt and configured to be inserted seamlessly into a
    Foundation-enabled web project. All that’s required of you, beyond the few lines
    of code needed to include these components, is to customize them as you see fit.
    Which brings me to my next point on Foundation: just about everything within the
    Foundation framework is completely customizable, from global styles to the minutiae
    of component behavior. You can change everything about it to tailor it for your
    own needs.


    With all these impressive features going for it, how can the Foundation framework
    have any competition? Well, I’m glad you asked. Today, there are many open-source
    front-end frameworks available for us to use. Some of the most popular ones are:


    - [Bootstrap](http://getbootstrap.com)

    - [Yahoo Pure](http://purecss.io/)

    - [Google Web Starter Kit](https://developers.google.com/web/starter-kit/)

    - [UIkit](http://getuikit.com/)

    - [Semantic UI](http://semantic-ui.com/)

    - [Ink](http://ink.sapo.pt/)

    - [Concise](http://concisecss.com/)


    Feel free to browse each of the above frameworks to discover what predeveloped
    components they have to offer.


    Let’s compare Foundation with arguably its biggest competitor, Bootstrap. Like
    a fine scotch whiskey, the question of which framework reigns supreme can largely
    be boiled down to personal preference. Once you know one framework, there is little
    difference compared to the others. Many classes used in these frameworks are intuitive;
    you just have to recognize their naming scheme.


    Here’s a quick rundown of the major attributes of the two most popular CSS frameworks:


    | | Foundation | Bootstrap |

    | --- | --- | --- |

    | **Basic structure** | grid | grid |

    | **Sizing units** | rem | pixel |

    | **License** | Open source (MIT) | Open source (MIT) |

    | **CSS preprocessor** | Sass | LESS/Sass |

    | **Grid columns** | 12 | 12 |

    | **Number of components** | a whole lot | Also a whole lot |


    Though this is admittedly a basic overview of the two frameworks, it’s evident
    that they share more in common than not. Just about anything you can do with Bootstrap
    you can just as easily accomplish with Foundation, and vice versa. The biggest
    points of difference revolve around CSS compilation and the way they approach
    grid layouts.


    We should remember that customization is an important factor in selecting a framework.
    Foundation provides customization through Sass only whereas Bootstrap lets you
    customize its CSS through both Sass and LESS. If you are unfamiliar with LESS/Sass,
    they are CSS preprocessors that bring logic and functional ability to CSS. The
    preprocesser code needs to be compiled into static CSS files that will be used
    in our websites. We’ll learn more about customizing Foundation frameworks through
    Sass in [Chapter 7.](#ch07.html "Chapter 7Customizing Foundation Using Sass")
    Meanwhile, check out the official websites of [LESS](http://lesscss.org/) and
    [Sass](http://sass-lang.com) to learn more about them.


    Up until version 3 of Bootstrap, if you preferred Sass you were forced to use
    Foundation, while LESS devotees were ushered towards Bootstrap. As of version
    3, Bootstrap has successfully been ported to Sass. Foundation, however, still
    relies upon the Sass language for compiling CSS. If all this talk of CSS compilation
    makes you dizzy, worry not―we’ll cover it in-depth later on. For now, you should
    simply understand that both frameworks are designed to work with CSS compilers.


    Similarly, both CSS frameworks make use of a grid layout for their most basic
    structure. This means that web projects built with either framework will be responsive
    with only minor differences. Both frameworks default to 12-column layout. We will
    learn more about grid systems in Chapter 2.


    ## Setting up a Foundation Project


    Installing and configuring Foundation for use in your own projects is as easy
    as making a few decisions followed by a few clicks. To start, head over to the
    Zurb Foundation website and locate the [downloads page.](http://foundation.zurb.com/develop/download.html)
    Once there, you’ll find a few options that are shown in [Figure 1.1](#ch01.html_ch1-dl-opts
    "Figure 1.1. Foundation download options").


    ![Foundation download options](figures/1-downloadOptions.png)


    Figure 1.1. Foundation download options


    For those just starting out with Foundation, the `Complete` option provides a
    Foundation package that includes all components. Think of this option as the most
    comprehensive Foundation package. Next up, the `Essential` package is a pared-down
    version of the Foundation experience for those with less ambitious needs of the
    framework. Included is a much smaller collection of features covering the bare
    essentials of web development with Foundation. Then again, if you know exactly
    what you need from the Foundation framework, the `Custom` option will likely serve
    you well. As its name implies, with this option you can choose which elements’d
    like to include in your Foundation package and those you’d like to do without.
    Not only that, you can also define some global styles such as color, font size,
    and column size to be built into the resulting package. Finally, those looking
    to tap into the power and convenience of CSS preprocessing, the `Sass` option
    will take you to a page with detailed instructions for getting started with Sass.


    If you download the `Essential` package, upgrading to the `Complete` package would
    require including the missing JavaScript files and recompiling the Sass files
    into CSS. Hence, you need to make sure which version you’d like to go with for
    your web project before downloading.

