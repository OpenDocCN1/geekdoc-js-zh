    \ allowFullScreen></iframe>\n    </div>\n</div>\n```\n\n如果你现在怀疑这是否就是为你的 Foundation\
    \ 项目添加响应式视频所需的全部代码，请宽宽心。确实如此！我们所做的只是创建一个带有类的新 `div` 元素。我们所做的只是创建一个类为 `flex-video`\
    \ 的新 `div` 元素。生成的 `index.html` 现在应该给你提供与图 3.5 类似的视图。\n\n![我们的内容区块](img/Image-3-5.png)\n\
    \n图 3.5 我们的内容区块\n\n我们已经建立了两个区块，但我们仍然需要为页面添加一个分隔符元素。为了做到这一点，我们将创建一个类为 `separator`\
    \ 的 `div`，并向其添加一些文本。你会注意到我们没有指定固定的宽度和高度，而是使用百分比。这是为了保持网站的响应性。\n\n`index.html`（节选）\n\
    \n```html\n<div class=\"separator\">\n    <div class=\"row\">\n        <div class=\"\
    large-12 columns\">\n            <h3>Pictures in motion</h3>\n            <p>Lorem\
    \ ipsum dolor sit amet, cu case duis pri, vide \nmelius an per. Ad sed ignota\
    \ nominavi reprimique. ...</p>\n        </div>\n    </div>\n</div>\n```\n\n让我们在\
    \ `app.css` 中为分隔符添加一些样式。我们将为分隔符行添加一些呼吸空间，并调整字体颜色。我们将设置分隔符容器的 `max-width` 和 `min-height`，并设置背景颜色以区分区块。\n\
    \n`css/app.css`（节选）\n\n```css\n.separator .row {\n    margin-top: 50px;\n    padding-top:\
    \ 50px;\n    color: #ffffff;\n}\n\n.separator {\n    max-width: 100%;\n    min-height:\
    \ 50%;\n    background-color: #cccccc;\n}\n```\n\n在浏览器中打开新的 `index.html` 应该产生与之前相同的两个区块；然而，它们现在被一个带有描述后续区块的新元素隔开了，如图\
    \ 3.6 所示。记住，我们构建的只是一个原型，所以生产内容是我们最后考虑的事情。简单的填充图像和文本就能让我们对页面外观有一个良好的了解。\n\n![我们的分隔符元素](img/Image-3-6.png)\n\
    \n图 3.6 我们的分隔符元素\n\n到此，我们已经完成了原型的头部和主要内容区块。剩下的就是在页面底部添加一个页脚元素了。对于页脚，我们将利用 Foundation\
    \ 的图标栏组件在页面底部放置一个带，使用通用图标引导用户进行网站的沟通形式。图标栏的优势在于它能够以图像而不是文本呈现导航。不仅如此，它的设置也非常简单。我们只需要创建一个新的图标栏\
    \ `div`，并带上属性告诉 Foundation 显示多少元素：\n\n```html\n<div class=\"icon-bar five-up\"\
    >\n</div>\n```\n\n在我们案例中我们将使用五个图标，因此我们添加了 `five-up` 属性将空间分为五个等份。为了向图标栏添加图标，我们在这个\
    \ `div` 内部创建一个带有类的列表项：\n\n"
