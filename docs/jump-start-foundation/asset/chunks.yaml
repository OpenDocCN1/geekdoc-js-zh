    For our needs, we’ll stick with the first option and download the “Complete” package.
    What you should end up with after clicking the download link is a ZIP file containing
    the entire Foundation framework. To install the framework, simply extract the
    archive to the root directory of your web project. Once extracted, you’ll find
    `css`, `img`, and `js` folders along with a few files including the all-important
    `index.html`, as shown in [Figure 1.3](#ch01.html_ch1-defaultindex "Figure 1.3.
    Foundation’s default index page"). At the time of writing this book, Foundation
    version 5.5.2 was the latest release, and it is also used throughout this book.


    ![The extracted Foundation package](figures/1-extractedFiles.png)


    Figure 1.2. The extracted Foundation package


    The folders included in the default Foundation package are fairly self-explanatory.
    The `css` folder contains the predefined Foundation styles as well as any custom
    stylesheets you decide to add; the `js` folder likewise contains the necessary
    scripts for all Foundation components; and lastly the `img` folder will contain
    the images you’ll be including in your web project. With those files in place,
    you’re set to go. Yep, it really is that easy! If you don’t believe me, go ahead
    and point your web browser at the directory in which you just extracted the Foundation
    package. With any luck it should look like [Figure 1.3](#ch01.html_ch1-defaultindex
    "Figure 1.3. Foundation’s default index page").


    ![Foundation’s default index page](figures/1-defaultIndex.png)


    Figure 1.3. Foundation’s default index page


    ## Summary


    With that, you’re fully equipped to tackle the rest of this book. We trust you’re
    not overwhelmed with the wealth of information you’ve just received, but it is
    useful to have a firm grasp on what CSS frameworks are and why they’re useful
    to you as a web developer.


    Throughout this chapter we’ve covered the basics of the the Foundation framework,
    including an example that showed just hwo quickly Foundation can be used to set
    up a prototype website. We also learned what the Zurb Foundation is. You then
    saw a quick comparison of Foundation to the other giant in the CSS framework arena,
    Bootstrap. Finally, we concluded the chapter with a rundown of the steps to set
    up your first project with the Foundation framework. In truth, it wasn''t that
    many steps at all, but that''s a good thing! You''re now ready to get your hands
    dirty and make use of the Foundation framework to build a basic website. What
    are you waiting for? Head on to Chapter 2!


    # Chapter 2: Getting Started With Foundation''s Grid System


    Who doesn’t want their websites to look beautiful and well-structured in mobile
    devices? Considering the plethora of sites vying for users'' attention, our website
    should be ready to modify itself automatically for any kind of display devices.
    But this sort of website design is challenging and requires many hours of HTML
    and CSS coding. Foundation framework, on the other hand, gives you the ability
    to create such responsive websites on the go. You don''t have to write a single
    line of CSS code to make a responsive website.


    In this chapter, we are going to explore one of the main concepts in Foundation:
    the grid system—a 12-column flexible grid that can scale to any size. We’ll see
    how to implement it and make our websites mobile-friendly and well-structured.


    ## Laying the Foundation


    As you learned in [Chapter 1](#ch01.html "Chapter 1Building a Foundation"), Foundation’s
    main goal is to provide you with a framework from which to build upon. The way
    that Foundation accomplishes this goal is with the grid layout. Before we go any
    further, let’s take a step back and look at how web designs are structured.


    Long ago in a galaxy far, far away, when web development was very much in its
    infancy, designs typically consisted of free-flowing paragraph elements. The result
    looked more like a dishevelled newspaper page than the sophisticated, media-rich
    designs we see today.


    In an attempt to bring order to the chaos, HTML tables were utilized. While they
    certainly helped clean up the mess, their rigidity cast a distinct coldness to
    the face of the early Web. Here are a few reasons why HTML tables are bad for
    layouts:


    * Tables used this way describe presentation rather than content, hence a website
    laid out using tables is semantically incorrect.

    * Screen-reader users find it difficult to understand websites that use tables
    for layout.

    * It is very difficult to redesign a website using a table layout.

    * Tables can break text copying, which can be very annoying for some users.


    Apologies for the history lesson on web design, but it serves as a good illustration
    for why Foundation (as well as other popular CSS frameworks) chose a grid layout
    for its most basic building block. You see, in general the Web is a giant repository
    for content to be consumed. As humans we''re used to consuming our content in
    an orderly fashion. Grid layouts grant that ability in a very flexible way.


    Striking a wonderful balance between the rigidity of tables and the freedom of
    home-grown CSS, the grid represents the bedrock of the Foundation framework. [Figure
    2.1](#ch02.html_ch2ex1 "Figure 2.1. A basic example of the Foundation grid system")
    shows a quick example of what the grid layout looks like in practice:


    ![A basic example of the Foundation grid system](figures/Image-2-1.png)


    Figure 2.1. A basic example of the Foundation grid system


    You can see there is a single row containing three columns of different colors
    and widths. This is the most basic use of Foundation’s grid system. Let’s add
    a new row and insert two columns of different widths within it, seen in [Figure
    2.2](#ch02.html_ch2ex2 "Figure 2.2. Extending our example with two rows").


    ![Extending our example with two rows](figures/Image-2-2.png)


    Figure 2.2. Extending our example with two rows


    The point to be noted here is that our website is shown on a desktop-sized browser.
    What will happen once we reduce the size of the browser window, such as on a mobile
    device? The screenshot in [Figure 2.3](#ch02.html_ch2ex3 "Figure 2.3. Our simple
    example in a narrower window") shows our website in a smaller browser window.


    ![Our simple example in a narrower window](figures/Image-2-3.png)


    Figure 2.3. Our simple example in a narrower window


    Oh. That was unexpected. How did two different rows with multiple columns end
    up stacked on top of each other? Let’s aim to understand by checking out the code
    in the following sections.


    ## Setting up a Foundation Project


    Before we start coding, we’ll set up our project with the Foundation framework.
    In [Chapter 1](#ch01.html "Chapter 1Building a Foundation"), we saw that we determine
    what version of Foundation to download depending on our need. For the sake of
    understanding Foundation in this book, we’ll use the static [Complete Foundation
    5 version,](http://foundation.zurb.com/develop/download.html) which has all the
    static, compiled CSS files. Let’s create a new folder called Foundation Grid System
    Lessons in our system. Copy all the files from the downloaded Foundation project
    into this folder, then open `index.html` using your favorite code editor. My favorite
    is GitHub’s [Atom editor,](https://atom.io) but you can use whatever you like.


    index.html should look like this:


    ```

    index.html (excerpt)

    ```

