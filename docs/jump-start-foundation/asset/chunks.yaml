    >Submit</button>\n</form>\n```\n\nThis basic form asks for the name and email\
    \ address of the user, and will look like the form in [Figure 6.9](#ch06.html_ch6ex14\
    \ \"Figure 6.9. Our form without validation\").\n\n![Our form without validation](figures/Image-6-14.png)\n\
    \nFigure 6.9. Our form without validation\n\nThe error states are visible up-front\
    \ because we're yet to set up Abide validation. To do so, we include an additional\
    \ JavaScript file into our index.html file. This file is called foundation.abide.js\
    \ and is present inside the js/foundation/ folder of your project. Place this\
    \ file at the bottom of the index.html file, just below the Foundation JavaScript\
    \ line as follows:\n\n```\n …\n<script src=\"js/vendor/jquery.js\"></script>\n\
