    \nFigure 2.5. Two rows: one with two equal-width columns, one with three columns\
    \ of different widths\n\n### Note: Only 12 Virtual Columns Per Row\n\nThe sum\
    \ total of the number of virtual columns allocated to each column should always\
    \ be equal to 12 in every row. If the sum exceeds 12, Foundation automatically\
