- fmt: "\nAs explained in [Chapter 2](#ch02.html \"Chapter 2\\n0Getting Started With\
    \ Foundation's Grid System\"), we’ll use the basic Foundation markup to start\
    \ this project:\n\n```\n<!doctype html>\n<html class=\"no-js\" lang=\"en\">\n\
    \    <head>\n        <meta charset=\"utf-8\" />\n        <meta name=\"viewport\"\
    \ content=\"width=device-width,\n↵ initial-scale=1.0\" />\n        <title>Foundation\
    \ | Welcome</title>\n        <link rel=\"stylesheet\" href=\"css/foundation.css\"\
    \ />\n        <script src=\"js/vendor/modernizr.js\"></script>\n    </head>\n\
    \    <body>\n\n        <script src=\"js/vendor/jquery.js\"></script>\n       \
    \ <script src=\"js/foundation.min.js\"></script>\n        <script>\n         \
    \   $(document).foundation();\n        </script>\n    </body>\n</html>\n```\n\n\
    Let’s begin using the framework by adjusting the title of our prototype in the\
    \ `<head>` element. We’ll name it “Photo Journal” to better reflect the purpose\
    \ of our project.\n\nLoading up our project in the browser at this point would\
    \ yield a rather empty page with a simple title in the page’s tab, so let’s fix\
    \ that. We’ll start by tackling the first section of our prototype: an attention-grabbing\
    \ full-screen image with overlaying text. We should be sure to make the image\
    \ height and width fill the entire screen, as we want our users to experience\
    \ a page-turning effect when they first land onat site. Regardless of the size\
    \ of their own screens, when users scroll down they should immediately see content\
    \ revealed underneath this section. If that doesn’t quite make sense, you’ll get\
    \ the idea soon enough when we edit the governing CSS.\n\nAs was mentioned earlier,\
    \ to build web projects with Foundation one need only add rows, columns, and content.\
    \ It’s that easy. So let’s add our first row in a div with the class `header`.\
    \ This is the basic code for creating rows in Foundation:\n\n```\n<div class=\"\
    header\">\n    <div class=\"row\">\n    </div>\n</div>\n```\n\nIn truth, this\
    \ page would look no different in a browser than it did before we added the row,\
    \ which is why we’ll add the columns and content now. As we know, the default\
    \ width for a row is twelve virtual columns. You can use as many or as few of\
    \ those columns as you’d like.\n\nRemember, the goal for our header is to create\
    \ a full-page image with overlayed text. We’ll accomplish the full-page image\
    \ by specifying a background in the CSS, but to accommodate the overlay text we’ll\
    \ need to make use of Foundation’s columns with an offset to push it to the right\
    \ of the image. Here’s the code we’ll use:\n\n```\n<div class=\"medium-4 medium-offset-8\
    \ columns\">\n    <h4>Photo Journey</h4>\n    <p>Picturing the world one photo\
    \ at a time.</p>\n</div>\n```\n\nAs shown in [Figure 3.1](#ch03.html_ch3ex1 \"\
    Figure 3.1.\\�Our header overlay in place\"), we created a four-virtual-column-wide\
    \ element with the class `medium-4`, and used an offset to tell Foundation to\
    \ push that four-column-wide element eight columns to the right with `medium-offset-8`.\
    \ This essentially creates an element that is one-third the width of our page,\
    \ aligned to the right.\n\n![Our header overlay in place](figures/Image-3-1.png)\n\
    \nFigure 3.1. Our header overlay in place\n\nNow that the overlay text is in place,\
    \ let’s add the full-page image beneath it. To accomplish this, we’ll work some\
    \ CSS magic to ensure that the image always fills the width and height of the\
    \ page, regardless of the screen’s actual size. I’ll also take this opportunity\
    \ to cover best practices for editing the CSS of your Foundation projects.\n\n\
    If you take a look at the root directory where you extracted the Foundation package,\
    \ you’ll notice an aptly named `css` folder containing predefined styles for the\
    \ Foundation framework. While you could, in theory, edit these rather large stylesheets\
    \ directly to add your own custom stylings, it’s far easier and prudent to add\
    \ a new stylesheet called `app.css` to this folder. It’s in this file that you\
    \ should add all custom stylings, as encouraged by the folks at Zurb. Keeping\
    \ custom CSS styles separate also makes upgrading the Foundation Framework easier\
    \ and hassle-free.\n\nLet’s do this now. Open up the created `app.css` file and\
    \ add the following:\n\n```\n.header {\n    height: 100%;\n    background: url(\"\
    http://placehold.it/1920x1080\") center\n↵ no-repeat;\n}\n\n.header .row {\n \
    \   padding-top: 30%;\n    color: #ffffff;\n}\n```\n\nThe first CSS rule in this\
    \ code creates a new background for our `header` div. It sets the height to fill\
    \ the entirety of the page as well as a background image to go with it. Here we’re\
    \ using the [placehold.it](http://placehold.it/) tool that returns an image of\
    \ the specified size. You can replace this with an image of your choice.\n\nThe\
    \ second CSS rule modifies the rows we create within our `header` div. In this\
    \ case it’s the overlay text. We set some breathing room at the top and change\
    \ the color of our text to white so that it stands out over the background image.\
    \ Before we load this into the browser, here is our `index.html`:\n\n*index.html\
    \ (excerpt)*\n\n```\n<!doctype html>\n<html class=\"no-js\" lang=\"en\">\n   \
    \ <head>\n        <meta charset=\"utf-8\" />\n        <meta name=\"viewport\"\
    \ content=\"width=device-width,\n↵ initial-scale=1.0\" />\n        <title>Photo\
    \ Journal</title>\n        <link rel=\"stylesheet\" href=\"css/foundation.css\"\
    \ />\n        <link rel=\"stylesheet\" href=\"css/app.css\" />\n        <script\
    \ src=\"js/vendor/modernizr.js\"></script>\n    </head>\n    <body>\n        <div\
    \ class=\"header\">\n            <div class=\"row\">\n                <div class=\"\
    medium-4 medium-offset-8 columns\">\n                    <h4>Photo Journey</h4>\n\
    \                    <p>Picturing the world one photo at a time.</p>\n       \
    \         </div>\n            </div>\n        </div>\n\n        <script src=\"\
    js/vendor/jquery.js\"></script>\n        <script src=\"js/foundation.min.js\"\
    ></script>\n        <script>\n            $(document).foundation();\n        </script>\n\
    \    </body>\n</html>\n```\n\nIf you take a look at our prototype in the browser,\
    \ you should see a similar sight to [Figure 3.2](#ch03.html_ch3ex2 \"Figure 3.2.\\\
    �Our prototype showing background image and overlay\").\n\n![Our prototype showing\
    \ background image and overlay](figures/Image-3-2.png)\n\nFigure 3.2. Our prototype\
    \ showing background image and overlay\n\nNotice that as you resize the browser\
    \ window, the background image responds and the overlay floats neatly in the lower\
    \ right-side of the screen.\n\nWe’re making great progress so far, so let’s move\
    \ right along to the part of the prototype where the bulk of our content will\
    \ live. We’ll start by adding that content into two new div elements with the\
    \ class `section`. These elements will house the actual content of our page, and\
    \ we’ll leverage these elements in our `app.css` to customize our content accordingly.\n\
    \nGo ahead and add two of these divs to your `index.html`, just underneath the\
    \ `header` div:\n\n```\n<div class=\"section\">\n</div>\n\n<div class=\"section\"\
    >\n</div>\n```\n\n[Figure 3.3](#ch03.html_ch3ex3 \"Figure 3.3.\\�A wireframe of\
    \ our first content section\") shows a wireframe of how we’ll lay out the first\
    \ section.\n\n![A wireframe of our first content section](figures/Image-3-3.jpg)\n\
    \nFigure 3.3. A wireframe of our first content section\n\nAs shown in [Figure\
    \ 3.3](#ch03.html_ch3ex3 \"Figure 3.3.\\�A wireframe of our first content section\"\
    ), for our first `section` element, we’ll add three rows that each hold a different\
    \ set of content. Just as before, adding new rows to our grid is as easy as this:\n\
    \n```\n<div class=\"row\">\n</div>\n```\n\nInside the first row let’s create a\
    \ new five-columns-wide element, along with one that’s seven columns wide to fill\
    \ out the width of the row:\n\n```\n<div class=\"medium-5 columns\">\n</div>\n\
    <div class=\"medium-7 columns\">\n</div>\n```\n"
  raw: "As explained in [Chapter 2](#ch02.html \"Chapter 2Getting Started With Foundation's\
    \ Grid System\"), we’ll use the basic Foundation markup to start this project:\n\
    \n```\n<!doctype html>\n<html class=\"no-js\" lang=\"en\">\n    <head>\n     \
    \   <meta charset=\"utf-8\" />\n        <meta name=\"viewport\" content=\"width=device-width,\n\
    ↵ initial-scale=1.0\" />\n        <title>Foundation | Welcome</title>\n      \
    \  <link rel=\"stylesheet\" href=\"css/foundation.css\" />\n        <script src=\"\
    js/vendor/modernizr.js\"></script>\n    </head>\n    <body>\n\n        <script\
    \ src=\"js/vendor/jquery.js\"></script>\n        <script src=\"js/foundation.min.js\"\
    ></script>\n        <script>\n            $(document).foundation();\n        </script>\n\
    \    </body>\n</html>\n```\n\nLet’s begin using the framework by adjusting the\
    \ title of our prototype in the `<head>` element. We’ll name it “Photo Journal”\
    \ to better reflect the purpose of our project.\n\nLoading up our project in the\
    \ browser at this point would yield a rather empty page with a simple title in\
    \ the page’s tab, so let’s fix that. We’ll start by tackling the first section\
    \ of our prototype: an attention-grabbing full-screen image with overlaying text.\
    \ We should be sure to make the image height and width fill the entire screen,\
    \ as we want our users to experience a page-turning effect when they first land\
    \ onat our site. Regardless of the size of their own screens, when users scroll\
    \ down they should immediately see content revealed underneath this section. If\
    \ that doesn’t quite make sense, you’ll get the idea soon enough when we edit\
    \ the governing CSS.\n\nAs was mentioned earlier, to build web projects with Foundation\
    \ one need only add rows, columns, and content. It’s that easy. So let’s add our\
    \ first row in a div with the class `header`. This is the basic code for creating\
    \ rows in Foundation:\n\n```\n<div class=\"header\">\n    <div class=\"row\">\n\
    \    </div>\n</div>\n```\n\nIn truth, this page would look no different in a browser\
    \ than it did before we added the row, which is why we’ll add the columns and\
    \ content now. As we know, the default width for a row is twelve virtual columns.\
    \ You can use as many or as few of those columns as you’d like.\n\nRemember, the\
    \ goal for our header is to create a full-page image with overlayed text. We’ll\
    \ accomplish the full-page image by specifying a background in the CSS, but to\
    \ accommodate the overlay text we’ll need to make use of Foundation’s columns\
    \ with an offset to push it to the right of the image. Here’s the code we’ll use:\n\
    \n```\n<div class=\"medium-4 medium-offset-8 columns\">\n    <h4>Photo Journey</h4>\n\
    \    <p>Picturing the world one photo at a time.</p>\n</div>\n```\n\nAs shown\
    \ in [Figure 3.1](#ch03.html_ch3ex1 \"Figure 3.1. Our header overlay in place\"\
    ), we created a four-virtual-column-wide element with the class `medium-4`, and\
    \ used an offset to tell Foundation to push that four-column-wide element eight\
    \ columns to the right with `medium-offset-8`. This essentially creates an element\
    \ that is one-third the width of our page, aligned to the right.\n\n![Our header\
    \ overlay in place](figures/Image-3-1.png)\n\nFigure 3.1. Our header overlay in\
    \ place\n\nNow that the overlay text is in place, let’s add the full-page image\
    \ beneath it. To accomplish this, we’ll work some CSS magic to ensure that the\
    \ image always fills the width and height of the page, regardless of the screen’s\
    \ actual size. I’ll also take this opportunity to cover best practices for editing\
    \ the CSS of your Foundation projects.\n\nIf you take a look at the root directory\
    \ where you extracted the Foundation package, you’ll notice an aptly named css\
    \ folder containing predefined styles for the Foundation framework. While you\
    \ could, in theory, edit these rather large stylesheets directly to add your own\
    \ custom stylings, it’s far easier and prudent to add a new stylesheet called\
    \ app.css to this folder. It’s in this file that you should add all custom stylings,\
    \ as encouraged by the folks at Zurb. Keeping custom CSS styles separate also\
    \ makes upgrading the Foundation Framework easier and hassle-free.\n\nLet’s do\
    \ this now. Open up the created app.css file and add the following:\n\n```\n.header\
    \ {\n    height: 100%;\n    background: url(\"http://placehold.it/1920x1080\"\
    ) center\n↵ no-repeat;\n}\n\n.header .row {\n    padding-top: 30%;\n    color:\
    \ #ffffff;\n}\n```\n\nThe first CSS rule in this code creates a new background\
    \ for our `header` div. It sets the height to fill the entirety of the page as\
    \ well as a background image to go with it. Here we’re using the [placehold.it](http://placehold.it/)\
    \ tool that returns an image of the specified size. You can replace this with\
    \ an image of your choice.\n\nThe second CSS rule modifies the rows we create\
    \ within our `header` div. In this case it’s the overlay text. We set some breathing\
    \ room at the top and change the color of our text to white so that it stands\
    \ out over the background image. Before we load this into our browser, we need\
    \ to ensure that our new stylesheet is loaded correctly in our index.html. Here’s\
    \ our index.html so far:\n\n*index.html (excerpt)*\n\n```\n<!doctype html>\n<html\
    \ class=\"no-js\" lang=\"en\">\n    <head>\n        <meta charset=\"utf-8\" />\n\
    \        <meta name=\"viewport\" content=\"width=device-width,\n↵ initial-scale=1.0\"\
    \ />\n        <title>Photo Journal</title>\n        <link rel=\"stylesheet\" href=\"\
    css/foundation.css\" />\n        <link rel=\"stylesheet\" href=\"css/app.css\"\
    \ />\n        <script src=\"js/vendor/modernizr.js\"></script>\n    </head>\n\
    \    <body>\n        <div class=\"header\">\n            <div class=\"row\">\n\
    \                <div class=\"medium-4 medium-offset-8 columns\">\n          \
    \          <h4>Photo Journey</h4>\n                    <p>Picturing the world\
    \ one photo at a time.</p>\n                </div>\n            </div>\n     \
    \   </div>\n\n        <script src=\"js/vendor/jquery.js\"></script>\n        <script\
    \ src=\"js/foundation.min.js\"></script>\n        <script>\n            $(document).foundation();\n\
    \        </script>\n    </body>\n</html>\n```\n\nIf you take a look at our prototype\
    \ in the browser, you should see a similar sight to [Figure 3.2](#ch03.html_ch3ex2\
    \ \"Figure 3.2. Our prototype showing background image and overlay\").\n\n![Our\
    \ prototype showing background image and overlay](figures/Image-3-2.png)\n\nFigure 3.2. Our\
    \ prototype showing background image and overlay\n\nNotice that as you resize\
    \ the browser window, the background image responds accordingly and the overlay\
    \ floats neatly in the lower right-hand side of the screen.\n\nWe’re making great\
    \ progress so far, so let’s move right along to the part of the prototype where\
    \ the bulk of our content will live. We’ll start by adding that content into two\
    \ new div elements with the class `section`. These elements will house the actual\
    \ content of our page, and we’ll leverage these elements in our app.css to customize\
    \ our content accordingly.\n\nGo ahead and add two of these divs to your index.html,\
    \ just underneath the `header` div:\n\n```\n<div class=\"section\">\n</div>\n\n\
    <div class=\"section\">\n</div>\n```\n\n[Figure 3.3](#ch03.html_ch3ex3 \"Figure 3.3. A\
    \ wireframe of our first content section\") shows a wireframe of how we’ll lay\
    \ out the first section.\n\n![A wireframe of our first content section](figures/Image-3-3.jpg)\n\
    \nFigure 3.3. A wireframe of our first content section\n\nAs shown in [Figure 3.3](#ch03.html_ch3ex3\
    \ \"Figure 3.3. A wireframe of our first content section\"), for our first `section`\
    \ element, we’ll add three rows that each hold a different set of content. Just\
    \ as before, adding new rows to our grid is as easy as this:\n\n```\n<div class=\"\
    row\">\n</div>\n```\n\nInside the first row let’s create a new five-columns-wide\
    \ element, along with one that’s seven columns wide to fill out the width of the\
    \ row:\n\n```\n<div class=\"medium-5 columns\">\n</div>\n<div class=\"medium-7\
    \ columns\">\n</div>\n```"
