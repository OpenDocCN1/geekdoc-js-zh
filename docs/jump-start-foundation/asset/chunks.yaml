    \ `bower_components`, with Bower managing its contents. It contains various third-party\
    \ libraries such as fastclick.js, jQuery, Modernizr, and so on. It’s recommended\
    \ that you avoid changing anything inside this folder as it could result in conflicts.\n\
    \nbower.json is a manifest file that's used by Bower to keep track of the various\
    \ third-party libraries used by a particular project. If you open this file, it\
    \ should look similar to this:\n\n*bower.json*\n\n```\n{\n  \"name\": \"foundation-compass-app\"\
    ,\n  \"version\": \"0.0.1\",\n  \"private\": \"true\",\n  \"dependencies\": {\n\
    \    \"foundation\": \"zurb/bower-foundation\"\n  }\n}\n```\n\nSuppose that you\
    \ want to install AngularJS in this project. You can download it using a Bower\
    \ command such as:\n\n```\nbower install angular --save\n```\n\nBower will download\
    \ the AngularJS package in the folder bower_components/angular and create a new\
    \ entry in the bower.json file:"
