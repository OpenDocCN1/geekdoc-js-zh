    - 切换响应式组件

    - 工具类

    - JavaScript 工具类

    - 从右向左语言（RTL）支持


    ### 导航

    有助于提供有效导航的组件：

    - 离线画布 (off-canvas)

    - 顶部栏 (top bar)

    - 图标栏

    - 侧边导航

    - Magellan 吸粘导航

    - 子导航

    - 面包屑导航

    - 分页器


    ### 媒体

    用于存放图像和视频的组件：

    - 轨道滑块器 (Orbit slider)

    - 缩略图

    - 清除灯箱 (clearing lightbox)

    - 弹性布局视频


    ### 表单

    Foundation 提供了许多预定义的表单元素，有助于增强我们网页表单的用户体验：

    - 表单样式

    - 开关 (switches)

    - 范围滑块

    -  验证 (Abide validation)


    ### 按钮

    设计精美的操作元素（链接和按钮）：

    - 按钮

    - 按钮组

    - 拆分按钮

    - 下拉按钮


    ### 字体

    有助于增强我们网页中某些文本元素（如重要通知、列表项等）外观的组件：

    - 字体类型

    - 内联列表

    - 标签

    - 击键组合


    ### 提示与引导

    有助于吸引用户注意力以传达重要信息的组件：

    - 展开模态框 (reveal modal)

    - 警报 (alerts)

    - 面板

    - 提示框 (tooltips)

    - 引导之旅 (Joyride)


    ### 内容

    网页上常见的实用组件：

    - 下拉菜单

    - 价格表格

    - 进度条

    - 表格

    - 折叠面板 (accordion)

    - 选项卡 (tabs)

    - 均衡均衡器


    如你所见，Foundation 开箱即提供了许多实用的组件！我们将在后面的章节中详细介绍其中许多组件，了解它们是如何制作的，以及在网页上创建它们需要哪些 HTML
    标记。


    这些组件是预构建并配置好的，可以无缝地插入到启用了 Foundation 的 Web 项目中。除了包含这些组件所需的几行代码外，你只需要根据自己的喜好对它们进行自定义。这引出了我关于
    Foundation 的下一点：Foundation 框架内的几乎所有内容都是完全自定义的，从全局样式到组件行为的细节。你可以更改它的一切以满足你自己的需求。


    拥有这些令人印象深刻的功能，Foundation 框架如何会有竞争力呢？嗯，我很高兴你提问。今天，有很多开源前端框架供我们使用。其中最流行的有：


    - [Bootstrap](http://getbootstrap.com)

    - [Yahoo Pure](http://purecss.io/)

    - [Google Web Starter Kit](https://developers.google.com/web/starter-kit/)

    - [UIkit](http://getuikit.com/)

    - [Semantic UI](http://semantic-ui.com/)

    - [Ink](http://ink.sapo.pt/)

    - [Concise](http://concisecss.com/)


    可以浏览上述每个框架，发现它们提供了哪些预开发的组件。


    让我们把 Foundation 与其可以说是是最大的竞争对手 Bootstrap 进行比较。就像精美的苏格兰威士忌一样，哪个框架占据主导地位的问题在很大程度上取决于个人偏好。一旦你了解了一个框架，与其他框架的区别并不大。这些框架中使用的许多类名都是直观的；你只需要识别它们的命名方案即可。


    以下是这两个流行的 CSS 框架主要属性的简要介绍：


    | | Foundation | Bootstrap |

    | --- | --- | --- |

    | **基础结构** | 网格 | 网格 |

    | **尺寸单位** | rem | 像素 (pixel) |

    | **许可证** | 开源 (MIT) | 开源 (MIT) |

    | **CSS 预处理器** | Sass | LESS/Sass |

    | **网格列数** | 12 | 12 |

    | **组件数量** | 很多 | 很多 |


