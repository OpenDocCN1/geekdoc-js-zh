  trans: "\n\n正如第 2 章 所示，我们将使用基础 Foundation 标记来启动此项目：\n\n```\n<!doctype html>\n<html\
    \ class=\"no-js\" lang=\"en\">\n    <head>\n        <meta charset=\"utf-8\" />\n\
    \        <meta name=\"viewport\" content=\"width=device-width,\n↵ initial-scale=1.0\"\
    \ />\n        <title>Foundation | Welcome</title>\n        <link rel=\"stylesheet\"\
    \ href=\"css/foundation.css\" />\n        <script src=\"js/vendor/modernizr.js\"\
    ></script>\n    </head>\n    <body>\n\n        <script src=\"js/vendor/jquery.js\"\
    ></script>\n        <script src=\"js/foundation.min.js\"></script>\n        <script>\n\
    \            $(document).foundation();\n        </script>\n    </body>\n</</html>\n\
    ```\n\n让我们通过调整 `<head>` 元素中原型的标题来开始使用该框架。我们将它命名为“Photo Journal”（照片日志），以更好地反映我们项目的目的。\n\
    \n此时在浏览器中加载我们的项目将得到一个相当空的页面，标签页上仅有一个简单的标题，所以让我们修复它。我们将从处理原型的第一部分开始：一个带有叠加文本的引人全屏图像。我们应该确保图像的高度和宽度填充整个屏幕，因为我们希望用户在首次进入网站时能体验到翻页效果。无论他们的屏幕大小如何，当用户向下滚动时，他们应该立即看到此部分下方揭露的内容。如果这听起来不太通顺，当我们编辑控制它的\
    \ CSS 时，你很快就会明白意思了。\n\n正如前面提到的，使用 Foundation 构建 Web 项目只需要添加行（rows）、列（columns）和内容（content）。如此简单。所以让我们在一个类名为\
    \ `header` 的 `div` 中添加我们的第一行。这是在 Foundation 中创建行的基础代码：\n\n```\n<div class=\"header\"\
    >\n    <div class=\"row\">\n    </div>\n</div>\n```\n\n事实上，这个页面在浏览器中看起来与我们添加行之前并无异，这就是为什么我们现在要添加列和内容。正如我们所知，行的默认宽度是十二个虚拟列。你可以根据需要使用任意数量或少量的列。\n\
    \n记住，我们页头的目标是创建一个带有叠加文本的全屏图像。我们将通过在 CSS 中指定背景来实现全屏图像，但为了适应叠加文本，我们需要利用 Foundation\
    \ 带有偏移（offset）的列，将其推到图像的右侧。我们将使用的代码如下：\n\n```\n<div class=\"medium-4 medium-offset-8\
    \ columns\">\n    <h4>Photo Journey</h4>\n    <p>Picturing the world one photo\
    \ at a time.</p>\n</div>\n```\n\n正如图 3.1 所示，我们创建了一个类为 `medium-4` 的四虚拟列宽的元素，并使用偏移\
    \ `medium-offset-8` 告诉 Foundation 将这个四列宽的元素向右移动八列。这本质上创建了一个宽度为页面三分之一且向右对齐的元素。\n\
    \n![已就位的头部叠加层](img/Image-3-1.png)\n\n图 3.1. 已就位的头部叠加层\n\n现在叠加文本已经就位，让我们在它下方添加全屏图像。为了实现这一点，我们将运用一些\
    \ CSS 魔法，确保图像始终填充页面的宽度高度，无论屏幕的实际大小如何。我还将借此机会介绍编辑 Foundation 项目 CSS 的最佳实践。\n\n\
    如果你查看解压 Foundation 程序包的根目录，你会注意到一个命名恰当的 `css` 文件夹，其中包含了 Foundation 框架的预定义样式。虽然在理论上，你可以直接编辑这些较大的样式表来添加你自己的自定义样式，但向此文件夹添加一个名为\
    \ `app.css` 的新样式表要简单且明智得多。正如 Zurb 团队建议的那样，你应该在该文件中添加所有自定义样式。将自定义 CSS 样式分离还能让 Foundation\
    \ 框架的升级变得简单且无忧。\n\n我们现在就开始这样做。打开创建的 `app.css` 文件并添加以下内容：\n\n```\n.header {\n \
    \   height: 100%;\n    background: url(\"http://placehold.it/1920x1080\") center\n\
    ↵ no-repeat;\n}\n\n.header .row {\n    padding-top: 30%;\n    color: #ffffff;\n\
    }\n```\n\n这段代码中的第一个 CSS 规则为我们的 `header` `div` 创建了一个新背景。它将高度设置为填充整个页面，并配有一个背景图像。在这里我们使用了\
    \ [placehold.it](http://placehold.it/) 工具，它可以返回指定尺寸的图像。你可以将其替换为你选择的图像。\n\n第二个\
    \ CSS 规则修改了我们在 `header` `div` 中创建的行。在这种情况下，它是叠加文本。我们在顶部留了一些空间，并将文本颜色改为白色，以便它在背景图像上突出显示。在将其加载到浏览器之前，这是我们的代码：\n\
    \n*index.html（节选）*\n\n```\n<!doctype html>\n<html class=\"no-js\" lang=\"en\"\
    >\n    <head>\n        <meta charset=\"utf-8\" />\n        <meta name=\"viewport\"\
    \ content=\"width=device-width,\n↵ initial-scale=1.0\" />\n        <title>Photo\
    \ Journal</title>\n        <link rel=\"stylesheet\" href=\"css/foundation.css\"\
    \ />\n        <link rel=\"stylesheet\" href=\"css/app.css\" />\n        <script\
    \ src=\"js/vendor/modernizr.js\"></script>\n    </head>\n    <body>\n        <div\
    \ class=\"header\">\n            <div class=\"row\">\n                <div class=\"\
    medium-4 medium-offset-8\">\n                    <h4>Photo Journey</h4>\n    \
    \                <p>Picturing the world one photo at a time.</p>\n           \
    \     </div>\n            </div>\n        </div>\n\n        <script src=\"js/vendor/jquery.js\"\
    ></script>\n        <script src=\"js/foundation.min.js\"></script>\n        <script>\n\
    \            $(document).foundation();\n        </script>\n    </body>\n</html>\n\
    ```\n\n如果你在浏览器中查看我们的原型，你应该能看到类似于图 3.2 的效果。\n\n![显示背景图像的叠加层](img/Image-3-2.png)\n\
    \n图 3.2. 显示背景图像的叠加层\n\n注意，当你调整浏览器窗口时，背景图像会有响应，叠加层整齐地浮动在屏幕右侧。\n\n我们目前进展顺利，让我们继续处理原型中包含大部分内容的区域。我们将通过添加两个类为\
    \ `section` 的新 `div` 元素来开始。这些元素将容载页面的实际内容，我们将在 `app.css` 中利用这些元素进行相应的自定义。\n\n\
    请在 `index.html` 中 `header` `div` 下方添加这两个 `div`：\n\n```\n<div class=\"section\"\
    >\n</div>\n\n<div class=\"section\">\n</div>\n```\n\n图 3.3 显示了我们将如何布局第一部分的线图。\n\
    \n![第一部分内容的框图](img/Image-3-3.jpg)\n\n图 3.3. 第一部分内容的框图\n\n正如图 3.3 所示，对于我们的第一个 `section`\
    \ 元素，我们将添加三行，每行包含一组不同的内容。与之前一样，在网格中添加新行只需如下：\n\n```\n<div class=\"row\">\n</div>\n\
    ```\n\n在第一行内部，让我们创建一个新的五列宽元素，以及一个七列宽的元素以填满行的宽度：\n\n```\n<div class=\"medium-5\
    \ columns\">\n</div>\n<div class=\"medium-7 columns\">\n</div>\n```\n\n"
- fmt: "\nThe first part of this section will serve as a photo diary of sorts with\
    \ an image in the five-columns-wide element accompanying a journal entry in the\
    \ seven-columns-wide element. All we have to do is add the desired content between\
    \ these divs and we’re good to go. Let’s add a couple more rows underneath to\
    \ fill out the page. For our second row, we’ll do the inverse of what we did in\
    \ the first. Simply split the row by seven columns, then five columns:\n\n```\n\
    <div class=\"medium-7 columns\">\n</div>\n<div class=\"medium-5 columns\">\n</div>\n\
    ```\n\nThis arrangement of vertical elements will help break up our grid and create\
    \ a more interesting content flow. Let’s now edit our last row in this first section\
    \ and use all twelve columns of the grid width:\n\n```\n<div class=\"large-12\
    \ columns\">\n</div>\n```\n\nFor this row, we’ll use Foundation block grid elements\
    \ to evenly space horizontal content within the row. To do this we create an unordered\
    \ list with a list item for each element in the row. When we create the list we\
    \ specify a class of `\"small-block-grid-1 medium-block-grid-3\"`, which tells\
    \ the framework to split the row into three columns on medium and large screen\
    \ sizes and one column on small screens. Here’s the resulting code:\n\n```\n<ul\
    \ class=\"small-block-grid-1 medium-block-grid-3\">\n    <li></li>\n    <li></li>\n\
    \    <li></li>\n</ul>\n```\n\nAnd with that we’re done with our first content\
    \ section! The final code should look like this (filler content has been added\
    \ to the elements):\n\n`index.html` (excerpt)\n\n```\n<div class=\"section\">\n\
    \    <div class=\"row\">\n        <div class=\"medium-5 columns\">\n         \
    \   <img src=\"http://placehold.it/500x300\">\n        </div>\n        <div class=\"\
    medium-7 columns\">\n            <h5>On this day...</h5>\n            <p>Lorem\
    \ ipsum dolor sit amet, cu case duis pri, vide \nmelius an per. Ad sed ignota\
    \ nominavi reprimique. ...</p>\n        </div>\n    </div>\n    <div class=\"\
    row\">\n        <div class=\"medium-7 columns\">\n            <h5>One year ago...</h5>\n\
    \            <p>Lorem ipsum dolor sit amet, cu case duis pri, vide\nmelius an\
    \ per. Ad sed ignota nominavi reprimique. ...</p>\n        </div>\n        <div\
    \ class=\"medium-5 columns\">\n            <img src=\"http://placehold.it/500x300\"\
    >\n        </div>\n    </div>\n    <div class=\"row\">\n        <div class=\"\
    large-12 columns\">\n            <ul class=\"small-block-grid-1 medium-block-grid-3\"\
    >\n                <li><h5>Day One</h5><img src=\"\nhttp://placehold.it/300x150\"\
    ></li>\n                <li><h5>Day Two</h5><img src=\"\nhttp://placehold.it/300x150\"\
    ></li>\n                <li><h5>Day Three</h5><img src=\"\nhttp://placehold.it/300x150\"\
    ></li>\n            </ul>\n        </div>\n    </div>\n</div>\n```\n\nTo ensure\
    \ that the rows within our section have plenty of breathing room, let’s add some\
    \ `margin-top` space in our `app.css`:\n\n`css/app.css` (excerpt)\n\n```css\n\
    .section .row {\n    margin-top: 50px;\n}\n```\n\nThe rendered `index.html` should\
    \ now give you a sight similar to [Figure 3.4](#ch03.html_ch3ex4 \"Figure 3.4.\
    \ Our first content section\").\n\n![Our first content section](figures/Image-3-4.png)\n\
    \nFigure 3.4. Our first content section\n\nKeeping our brisk pace, let’s go ahead\
    \ and add our second section now. For this section, we’ll see how easy it is to\
    \ create responsive media elements; in this case, a video section. We’ll make\
    \ use of Foundation’s flex-video component, which lets the framework deal with\
    \ tasks such as handling aspect ratio and video scaling as screen sizes change\
    \ (we’ll take a closer look at flex video in [Chapter 5](#ch05.html \"Chapter\
    \ 5Handling Media\")). We can start by adding a new row to the second `section`\
    \ div:\n\n```\n<div class=\"section\">\n    <div class=\"row\">\n    </div>\n\
    </div>\n```\n\nWith our empty section and row set up, let’s add a full 12-column-wide\
    \ element with a new flex-video component inside:\n\n```html\n<div class=\"large-12\
    \ columns\">\n    <div class=\"flex-video widescreen vimeo\">\n        <iframe\
    \ src=\"http://player.vimeo.com/video/23205323\" \nwidth=\"400\" height=\"225\"\
    \ frameborder=\"0\" webkitAllowFullScreen \nmozallowfullscreen allowFullScreen></iframe>\n\
    \    </div>\n</div>\n```\n\nIf you’re wondering right now if that’s all the code\
    \ necessary to add responsive video to your Foundation project, let me put your\
    \ thoughts at ease. It certainly is! All we had to do was create a new div element\
    \ with a class of `flex-video` (the `widescreen` and `vimeo` attributes are simply\
    \ for styling purposes) and add an iframe for the video content within.\n\nLooking\
    \ at our second content section in the browser reveals a clean video element that\
    \ responds accurately to screen size changes, as shown in [Figure 3.5](#ch03.html_ch3ex5\
    \ \"Figure 3.5. Our second content section\").\n\n![Our second content section](figures/Image-3-5.png)\n\
    \nFigure 3.5. Our second content section\n\nWe’ve now created two content sections\
    \ underneath our full-page header, but we still need to direct the flow of our\
    \ content. Let’s create a new content element to separate the sections of our\
    \ page. To do this we’ll create a div with the class `separator`, which will serve\
    \ as our container. Within this separator element we’ll add a new row with a full\
    \ 12-column container. The idea of these separators is to create a simple block\
    \ of visual real estate with text describing the section that follows\n\nHere’s\
    \ the `index.html` code for the separator between our two main sections:\n\n`index.html`\
    \ (excerpt)\n\n```html\n<div class=\"separator\">\n    <div class=\"row\">\n \
    \           <div class=\"large-12 columns\">\n                <h3>Pictures in\
    \ motion</h3>\n                <p>Lorem ipsum dolor sit amet, cu case duis pri,\
    \  \nvide melius an per. Ad sed ignota nominavi reprimique. ... </p>\n       \
    \     </div>\n    </div>\n</div>\n```\n\nLet’s make sure this new separator element\
    \ of ours has an appropriate height and stretches the full width of the page and\
    \ add a couple styles to our `app.css`. We’ll add some breathing room for our\
    \ separator row, as well as adjust the text color. Then we’ll set the `max-width`\
    \ and `min-height` of our separator container, and set a background color to help\
    \ differentiate the sections. You’ll notice that we steer clear of specifying\
    \ exact widths and heights, instead relying on relative percentages and min/max\
    \ values. This is in an effort to preserve the responsiveness of our site:\n\n\
    `css/app.css` (excerpt)\n\n```css\n.separator .row {\n    margin-top: 50px;\n\
    \    padding-top: 50px;\n    color: #ffffff;\n}\n\n.separator {\n    max-width:\
