    To my lovely parents, troublesome brother, cute sister, and my best buddy, Sandeep.\n\
    \n—Syed\n\nTo all those still hungry for knowledge, may this book only whet your\
    \ appetite.\n\n—Joe\n\n# Preface\n\nCrafting a modern, professional website from\
    \ scratch takes a lot of time and effort. Sites today need to be responsive, mobile\
    \ first, slickly designed, and fast. That's where Zurb's Foundation framework\
    \ can help you. It provides a vast array of HTML components and a grid system\
    \ that makes creating professional, responsive templates a snap, significantly\
    \ cutting down development time.\n\nFrameworks such as Foundation are useful for\
    \ everyone, but are a blessing for novice developers. All the intricate CSS and\
    \ JavaScript required to create complex web components are prewritten. Only some\
    \ HTML markup is needed to make them work. More experienced developers can customize\
    \ the framework with Sass.\n\nThroughout this book, our aim is to provide a complete\
    \ guide to the Foundation framework. We'll cover how we can build beautiful responsive\
    \ websites without needing to gain expertise in advanced web development techniques.\
    \ We'll also discuss the various useful components that Foundation provides out\
    \ of the box, and explore ways of customizing the look and feel of Foundation\
    \ to generate completely unique designs.\n\n## Who Should Read This Book\n\nThis\
    \ book is suitable for beginner- to intermediate-level web designers and developers.\
    \ Experience of HTML and CSS is assumed, while some knowledge of JavaScript is\
    \ helpful.\n\n## Conventions Used\n\nYou'll notice that we've used certain typographic\
    \ and layout styles throughout this book to signify different types of information.\
    \ Look out for the following items.\n\n### Code Samples\n\nCode in this book will\
    \ be displayed using a fixed-width font, like so:\n\n```\n<h1>A Perfect Summer's\
    \ Day</h1>\n<p>It was a lovely day for a walk in the park. The birds \nwere singing\
    \ and the kids were all back at school.</p>\n```\n\nIf the code is to be found\
    \ in the book's code archive, the name of the file will appear at the top of the\
    \ program listing, like this:\n\n*example.css*\n\n```\n.footer {\n  background-color:\
    \ #CCC;\n  border-top: 1px solid #333;\n}\n```\n\nIf only part of the file is\
    \ displayed, this is indicated by the word *excerpt*:\n\n*example.css (excerpt)*\n\
    \n```\n border-top: 1px solid #333;\n```\n\nIf additional code is to be inserted\
    \ into an existing example, the new code will be displayed in bold:\n\n```\nfunction\
    \ animate() {\n  new_variable = \"Hello\";\n}\n```\n\nWhere existing code is required\
    \ for context, rather than repeat all of it, … will be displayed:\n\n```\nfunction\
    \ animate() {\n  …\n  return new_variable;\n}\n```\n\nSome lines of code should\
