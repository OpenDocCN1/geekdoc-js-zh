  trans: "\n编译这段 Sass 代码将生成以下输出：\n\n```\n.button{\n  background: #00f;\n  color: #fff;\n\
    }\n```\n\n你还可以在 Sass 中创建函数，帮助你分离可重复的 CSS 属性。嵌套规则的能力是使用 Sass 的另一个优势。随着本章的进行，我们将介绍其中的一些功能。如果你想学习更多关于\
    \ Sass 的知识，请访问[官方网站](http://sass-lang.com/)。使用 Sass 自定义 Foundation 非常简单，因为 Foundation\
    \ 允许你访问生成默认 CSS 文件时使用的 Sass 变量和函数。为了这一点，我们将下载 Sass 版本的 Foundation，它包含了生成 CSS 文件所需的所有\
    \ Sass 文件，以及我们很快就会介绍的一些其他文件。\n\n创建 Sass 版本的 Foundation 项目的最佳方法是使用 Foundation 的命令行界面，简称为\
    \ `CLI`。它让你能够通过编写单条命令行语句来创建新的 Foundation 项目。如果你计划使用 Foundation 并使用 Sass 对其进行自定义，我们建议你下载\
    \ Foundation `CLI`，我们稍后会介绍。\n\n### 提示：如果你更倾向于原生（Vanilla）\n\n在本章中，我们将使用许多不同的工具并使用命令行。尽管我们会提供逐步的说明，但如果你发现它太复杂，你也可以坚持使用原生\
    \ Foundation，并使用你的 `app.css` 来自定义框架。\n\n## 安装 Foundation CLI\n\n在安装 Foundation\
    \ CLI 之前，我们需要在机器上安装一些工具：\n\n* `Git`\n* `Node.js`\n* `Ruby 1.9+`\n\n如果需要，这里可以提供一些帮助。\n\
    \n### 安装 Git\n\n安装 Git 最简单的方法是[下载安装程序。](http://git-scm.com/download) 点击相应的操作系统，下载完成后，双击它并按照说明操作。\n\
    \n要检查是否已成功安装 Git，请打开终端（OS X 中使用 Terminal，Windows 中使用命令提示符）并输入 `git --version`。它应该显示已安装的\
    \ Git 版本。\n\n### 安装 Node.js\n\n要安装 Node.js，请从[nodejs.org](https://nodejs.org)\
    \ 下载其包，然后双击该包并按照说明操作。\n\n你可以在系统终端中输入 `node -v` 来检查 Node.js 是否安装成功。它应该显示当前安装的 Node.js\
    \ 版本。\n\n### 安装 Ruby\n\n如果你使用的是 Macintosh 电脑，可能已经预装了 Ruby。进入终端运行命令 `ruby -v`。它应该显示当前安装版本的版本号。\n\
    \n对于不同的操作系统，可以在 [`www.ruby-lang.org/en/documentation/installation/#installers`](https://www.ruby-lang.org/en/documentation/installation/#installers)\
    \ 找到相应的 Ruby 安装程序。\n\n### 安装 Foundation CLI\n\n为了管理自身的更新——以及第三方库的更新——Foundation\
    \ 使用 [Bower。](http://bower.io/) 如果你不熟悉 Bower，它是一个客户端包管理器，用于跟踪开发者使用的包。在这种情况下，我们需要的包是\
    \ Foundation 框架。我们还需要 `grunt-cli`，这是一个为 Foundation CLI 运行各种预定义任务的 JavaScript 程序。可以在\
    \ [`gruntjs.com`](http://gruntjs.com) 了解更多关于 Grunt 的信息。\n\n打开终端并输入以下命令：\n\n```\n\
    npm install -g bower grunt-cli\n```\n\n现在让我们使用以下命令安装 Foundation CLI：\n\n```\n\
    gem install foundation\n```\n\n### 注意：权限错误\n\n如果你在运行这两个命令时遇到任何权限错误，请在它们前面添加 `sudo`\
    \ 单词，并在提示时输入你的系统密码。这应该解决你的问题。如果你遇到其他问题，我们建议你前往 [SitePoint 论坛。](http://community.sitepoint.com/)\n\
    \n执行完命令后，输入以下内容以检查 Foundation 是否安装正确：\n\n```\nfoundation version\n```\n\n它应该返回一个版本号。在我的情况下，它返回了\
    \ `v1.0.4`，这意味着我的系统中安装了 Foundation CLI v1.0.4。\n\n现在我们完成了 Foundation CLI 的安装。在下一节，我们将安装一个\
    \ Sass 编译器，每当我们修改 Foundation 的默认 Sass 文件时，它就会重新编译 Sass 文件。\n\n## 安装 Compass 并创建\
    \ Sass Foundation 项目\n\nCompass 是一个开源 CSS 编写框架，使用 Sass 样式表语言。它将 Sass 编译为静态 CSS\
    \ 样式表。\n\n安装 Compass 非常简单。你只需要输入以下命令：\n\n```\ngem install compass\n```\n\n安装完成后，使用终端导航到通常存放所有项目的文件夹；例如，`cd\
    \ Documents`。接下来，输入以下命令生成你的第一个兼容 Sass 的 Foundation 项目：\n\n```\nfoundation new\
    \ First_project\n```\n\n这将创建一个名为 `First_project` 的新项目。将在接下来的章节中介绍该项目中的每个文件夹和文件。\n\
    \n在创建新的 Foundation 项目后还有一步要执行：运行 `bundle` 命令。该命令确保我们在使用根目录下的 `Gemfile` 文件中提到的正确库。如果你打开此文件，你会发现它包含了\
    \ `sass` 和 `compass` 的版本。当你更改项目环境（例如切换到新系统）时，`bundle` 命令非常有用。\n\n### 注意：什么是 Gemfile？\n\
    \nGemfile 保留了你的 Rails 程序的 gem 依赖项列表。通过运行 `bundle` 来满足这些依赖项。\n\n你必须为新项目运行一次 `bundle`\
    \ 命令。使用此命令安装 Bundler：\n\n```\ngem install bundler\n```\n\n你可以在[官方网站](http://bundler.io/)阅读更多关于\
    \ bundler 的信息。\n\n安装 bundler 后，进入新创建的文件夹 `First_project` 并运行 `bundle` 命令：\n\n\
    ```\ncd First_project\nbundle\n```\n\n在 bundle 安装所有内容后，运行以下命令让 Compass 监听对 Sass\
    \ 文件的更改并进行编译：\n\n```\nbundle exec compass watch\n```\n\n让我们检查 Compass 是否真的在工作。为了测试，打开\
    \ `scss/app.scss` 文件并在底部定义一个新的 Sass 变量：\n\n```\n$mycolor: #FFF;\n```\n\n一旦保存文件，你应该会在终端中看到\
    \ Compass 执行了某些命令：\n\n```\nmodified scss/app.scss\nwrite stylesheets/app.css\n\
    ```\n\n确保删除之前定义的 `$mycolor` 变量并再次保存。\n\n## 理解 Foundation 项目结构\n\n`First_project`\
    \ 文件夹的内容应该类似于图 7.1。\n\n![Foundation 结构](img/Image-7-1.png)\n\n图 7.1. Sass 结构\n\
    \n现在是理解该项目内部的一些重要文件和文件夹了。第一个是 `bower_components` 文件夹，由 Bower 管理其内容。它包含了各种第三方库，如\
    \ `fastclick.js`、`jquery`、`Modernizr` 等。建议不要更改文件夹中的任何内容，因为可能会导致冲突。\n\n`bower.json`\
    \ 是一个清单文件，用于 Bower 跟踪特定项目使用的各种第三方库。如果你打开此文件，它看起来像这样：\n\n`bower.json`\n\n```json\n\
    {\n  \"name\": \"foundation-compass-app\",\n  \"version\": \"0.0.1\",\n  \"private\"\
    : \"true\",\n  \"dependencies\": {\n    \"foundation\": \"zurb/bower-foundation\"\
    \n  }\n}\n```\n\n假设你想在这个项目中安装 AngularJS。你可以使用类似的 Bower 命令下载它：\n\n```\nbower install\
    \ angular --save\n```\n\nBower 会在 `bower_components/angular` 文件夹中下载 AngularJS\
    \ 包，并在 `bower.json` 文件中创建一个新条目。\n"
- fmt: "\n```\n{\n  \"name\": \"foundation-compass-app\",\n  \"version\": \"0.0.1\"\
    ,\n  \"private\": \"true\",\n  \"dependencies\": {\n    \"foundation\": \"zurb/bower-foundation\"\
    ,\n    \"angular\": \"~1.4.1\"\n  }\n}\n```\n\nBower is convenient because you\
    \ can simply ignore the folder `bower_components` while sharing your project.\
    \ Whoever you share the project with simply runs the following command, which\
    \ promptly installs the dependencies:\n\n```\nbower install\n```\n\nThis creates\
    \ the `bower_components` folder for them, with all the required dependencies inside.\n\
    \n`config.rb` is a Compass configuration file that directs Compass where to look\
    \ for appropriate files in the project. For example, it tells Compass where to\
    \ locate the Sass files and where to store the static CSS files after compiling.\
    \ If you open this file, it should look as follows:\n\n```\nadd_import_path \"\
    bower_components/foundation/scss\"\nhttp_path = \"/\"\ncss_dir = \"stylesheets\"\
    \nsass_dir = \"scss\"\nimages_dir = \"images\"\njavascripts_dir = \"js\"\n```\n\
    \nThe `scss` folder contains files for Foundation customization. It has two main\
    \ files, namely `_settings.scss` and `app.scss`. We will cover the details of\
    \ these files in the next section.\n\nThe `stylesheet` folder contains all the\
    \ static and compiled CSS files. By default, it has a file called `app.css` that\
    \ has to be included in every HTML file of our web app. It’s recommended to not\
    \ make any changes to `app.css` file if you are customizing using Sass as they\
    \ will be overridden when Compass recompiles Sass files.\n\nOkay, now that we’ve\
    \ installed everything we need and had a look at the directory structure, let’s\
    \ proceed to the fun part: looking at some Sass customization of Foundation.\n\
    \n## Customizing Foundation Using Sass\n\nIn this section, we’ll learn a bit about\
    \ Sass and how to use it to customize Foundation’s default styles. We’ll cover\
    \ the basics of Sass such as creating variables, nesting CSS, and functions. Covering\
    \ the full details of Sass itself, however, is outside the scope of this book,\
    \ but you can always refer to the [official documentation](http://sass-lang.com/documentation/file.SASS_REFERENCE.html)\
    \ to dive deeper into Sass. You can also refer to the SitePoint tutorial [“Getting\
    \ Started with Sass”](http://www.sitepoint.com/getting-started-sass-bourbon/)\
    \ and article [“An Introduction to Sass in Rails”](http://www.sitepoint.com/an-introduction-to-sass-in-rails/)\
    \ for more Sass insights.\n\nAll Sass customizations to Foundation are done using\
    \ two files present inside the `scss` folder: `_settings.scss` and `app.scss`.\
    \ Let’s see what each one does.\n\n### Working With _settings.scss\n\nThe first\
    \ file `_settings.scss` contains commented variables for every predefined CSS\
    \ and JavaScript component in Foundation. To customize a component, you just need\
    \ to find a particular variable using `Ctrl + F` or `Cmd + F`, uncomment it, and\
    \ then change the value in the file.\n\nOnce you save the file, Compass will recompile\
    \ the Sass and generate a new `app.css` file, which will go in the `stylesheet`\
    \ folder.\n\nLet’s try out some Sass customization. Navigate to `First_project`\
    \ and load the `index.html` file in your browser. You can see that there are many\
    \ default Foundation components displayed in this file, as shown in [Figure 7.2](#ch07.html_ch7ex2\
    \ \"Figure 7.2. Example index.html\").\n\n![Example index.html](figures/Image-7-2.png)\n\
    \nFigure 7.2. Example index.html\n\nLet’s make some modifications to the default\
    \ button style. Open `_settings.scss` and search for `Buttons` in this file. You\
    \ will come across a set of commented variables used for styling buttons, as seen\
    \ in [Figure 7.3](#ch07.html_ch7ex3 \"Figure 7.3. Commented variables for styling\
    \ buttons\").\n\n![Commented variables for styling buttons](figures/Image-7-3.png)\n\
    \nFigure 7.3. Commented variables for styling buttons\n\nNow uncomment the following\
    \ line:\n\n```\n// $button-font-align: center;\n```\n\nAnd change it to:\n\n```\n\
    $button-font-align: left;\n```\n\nCompass will override the default `text-align`\
    \ property from the `button` class in `app.css`:\n\n```css\n.button{\n    …\n\
    \    text-align: left; //changed from center to left\n    …\n}\n```\n\nNext, uncomment\
    \ this line:\n\n```\n// $button-margin-bottom: rem-calc(20);\n```\n\nChanging\
    \ it to:\n\n```css\n$button-margin-bottom: rem-calc(40);\n```\n\nCompass will\
    \ override the default `margin` property of the `button` class in `app.css`:\n\
    \n```css\n.button{\n    …\n    margin: 0 0 2.5rem; // originally it was 0 0 1.5rem\n\
    \    …\n}\n```\n\n### Note: Introducing rems\n\n`Rem-calc` is a Foundation Sass\
    \ function that converts pixel measurements to rem-s, so you can still think in\
    \ pixels and end up with scalable ems. If you're unfamiliar with this new rem\
    \ CSS unit, refer to the CSS-Tricks article [“Confused about REM and EM?”](https://css-tricks.com/confused-rem-em/).\n\
    \nWe’ve already seen how to define a variable in Sass. You can use such variables\
    \ to define a color scheme for your website. Let’s create a new file that will\
    \ store some re-useable colors for our website.\n\nCreate a new file `_colors.scss`\
    \ inside the folder `sass` and add three new variables into it:\n\n`_colors.scss`\n\
    \n```\n$theme-primary-color: #009688;\n$theme-secondary-color: #4DB6AC;\n$theme-text-color:\
    \ #212121;\n```\n\nNow, edit the file `app.scss`, which is inside the `sass` folder.\
    \ We’ll add the following code to the top of this file to include our newly created\
    \ `colors.scss` file:\n\n```scss\n@import \"colors\";\n```\n\n### Note: What’s\
    \ with the underscores at the start of filenames?\n\nSass filenames that start\
    \ with an underscore are called **partials**. This indicates that they are incomplete\
    \ Sass files as they depend on other Sass files for variables and functions. If\
    \ you remove the underscore from a filename, Compass will generate a new static\
    \ CSS file of the same name.\n\nNow that we have our theme colors defined, let’s\
    \ create a new class which, when attached to any paragraph element, will make\
    \ it stand out from the rest. We’ll use our theme colors in this class definition.\
    \ Edit the `_settings.scss` file and add the following Sass code at the bottom\
    \ of the file:\n\n```scss\n.standout-paragraph{\n    color: $theme-text-color;\n\
    \    padding: 20px;\n    background-color: $theme-secondary-color;\n}\n```\n\n\
    Once compiled, the aforementioned code will have values such as:\n\n```css\n.standout-paragraph{\n\
    \    color: #212121;\n    padding: 20px;\n    background-color: #4DB6AC;\n}\n\
    ```\n\n**Nesting** is a great way of organizing and maintaining CSS styles. Let’s\
    \ look at nesting in Sass by modifying the Sass code of `.standout-paragraph`:\n\
    \n```css\n.standout-paragraph{\n    color: $theme-text-color;\n    padding: 20px;\n\
    \    background-color: $theme-secondary-color;\n    //Nested Type 1\n    a{\n\
    \        color: #FFFFFF;\n        text-decoration: none;\n    }\n    //Nested\
    \ Type 2\n    &.white-text{\n        color: #FFFFFF;\n    }\n}\n```\n\nIn this\
    \ code, we have nested two new definitions: for `<a>` elements and for the `white-text`\
    \ class. Let’s check out the resulting output:\n\n```css\n.standout-paragraph{\n\
    \    color: #212121;\n    padding: 20px;\n    background-color: #4DB6AC;\n}\n\n\
    //Nested type 1 results in the following\n.standout-paragraph a{\n    color: #FFFFFF;\n\
    }\n\n//Nested type 2 results in the following\n.standout-paragraph.white-test{\n\
    \    color: #FFFFFF;\n}\n```\n\nAs seen in the CSS code, the nested type 1 results\
    \ in CSS hierarchy that is `.standout-paragraph a`. However, nested type 2 is\
    \ a way of referencing the parent selector with the help of the `&` symbol.\n\n\
    Hopefully this has given you a basic understanding of nesting in Sass. For further\
    \ reading, refer to the Sass documentation’s [nesting section.](http://sass-lang.com/documentation/file.SASS_REFERENCE.html#nested_rules)\n\
    \n### Understanding app.scss\n\nWe’ll move to the next important file in the `scss`\
    \ folder, which is `app.scss`. This is the parent Sass file from which the main\
    \ `app.`css file is created for the project, and is also where all the partial\
    \ Sass files get imported. As mentioned above, partials are Sass files which cannot\
    \ be compiled independently. They may have variables and functions that are defined\
    \ in other Sass files.\n"
