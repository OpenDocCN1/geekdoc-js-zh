  trans: "\n\n```html\n<div class=\"tabs-content\">\n    <div class=\"content active\"\
    \ id=\"panel1\">\n        <p>Lorem ipsum dolor sit amet, consectetur adipiscing\
    \ elit.\nDuis vel aliquet augue.</p>\n    </div\n    <div class=\"content\" id=\"\
    panel2\">\n        <p>Mauris ornare quam a lorem interdum, condimentum porta\n\
    eros bibendum.</p>\n    </div\n    <div class=\"content\" id=\"panel3\">\n   \
    \     <p>Cras bibendum vehicula turpis a mollis. Pellentesque\ntincid semper nunc,\
    \ non porta massa volutpat quis.</p>\n    </div\n    <div class=\"content\" id=\"\
    panel4\">\n        <p>Pellentesque accumsan tortor ut tincidunt sollicitudin.\n\
    </p>\n    </</div>\n</div>\n```\n\n很直观，不是吗？你必须确保 `content` 元素中的一个具有 `active` 类，以帮助\
    \ Foundation 识别要显示的初始内容。\n\n### 注意：不要忘记 `active` 类\n\n如果你忘记在 `tabs` 和 `tabs-content`\
    \ 元素的子元素之一中添加 `active` 类，那么所有标签卡将不会显示。你必须在 `tabs` 和 `tabs-content` 元素中相同位置的子元素上添加\
    \ `active` 类。\n\n这个标签卡组件看起来就像图 4.6。\n\n![一个标签卡组件](img/Image-4-6.png)\n\n图 4.6.\
    \ 一个标签卡组件\n\nFoundation 还允许你创建另一种类型的标签卡组件，其中标签卡位于左侧，内容位于右侧。这被称为**垂直标签卡**。只需插入一个额外的\
    \ `vertical` 类，Foundation 就会神奇地将基础标签卡组件转换为垂直标签卡组件，如图图 4.7 所示：\n\n```html\n<ul\
    \ class=\"tabs vertical\" data-tab>\n    …\n</ul>\n<div class=\"tabs-content\"\
    >\n    …\n</</div>\n```\n\n![一个垂直标签卡组件](img/Image-4-13.png)\n\n图 4.7. 一个垂直标签卡组件\n\
    \n**深度链接**是 Foundation Tabs 的一个功能，它为每个标签卡提供一个唯一的 URL。例如，如果你的网站 URL 是 `www.mysite.com`，那么“标签\
    \ 2”的 URL 可能可能是 `www.mysite.com/#panel2`。这里的 `#panel2` 是 `tabs-content` 元素中子 `content`\
    \ 元素的 ID。当用户导航到此 URL 时，“标签 2”将被默认选中。\n\n要启用深度链接，请通过标签卡组件的 `data-option` 属性向 Foundation\
    \ 的 JavaScript 传递特定参数。方法如下：\n\n```html\n<ul class=\"tabs\" data-tab data-options=\"\
    deep_linking: true\">\n …\n</ul\n```\n\n这里传递的值是 `deep_linking: true`。你会发现许多 Foundation\
    \ 组件带有多个 `data-options` 参数，通过这些参数你可以自定义默认行为；请在[Foundation 文档](http://foundation.zurb.com/docs/)中查看这些内容。随着本书的进行，我们将学习更多内容。\n\
    \n### 顶部栏 (Top Bar)\n\n**顶部栏**主要用于导航和其他网站链接。Foundation 的顶部栏组件默认在所有设备尺寸上（小、中、大屏幕）运行良好。\n\
    \n要创建一个顶部栏，我们需要一个带有 `top-bar` 类的 HTML `<nav>` 元素。它应该还有一个名为 `data-topbar` 的自定义数据属性，将其\
    \ HTML 绑定到 Foundation 的 JavaScript 中：\n\n```html\n<nav class=\"top-bar\" data-topbar>\n\
    </nav\n```\n\n这个顶部栏将有两个部分——**品牌标识 (branding)** 和**内容 (content)**。品牌标识是放置网站标题或\
    \ Logo 的地方。内容包含你在导航栏中所需的所有链接和下拉菜单。让我们如何创建它们。\n\n品牌标识部分使用带有 `title-area` 类的无序列表\
    \ `<ul>` 创建。它包含一个带有 `name` 类的 `<li>` 元素，其中包含网站标题：\n\n```html\n<nav class=\"top-bar\"\
    \ data-topbar>\n    <ul class=\"title-area\">\n        <li class=\"name\">\n \
    \           <h1><a href=\"#\">My Site</a></h1>\n        </li>\n    </ul\n</nav>\n\
    ```\n\n导航栏看起来应该像图 4.8。\n\n![我们顶部栏上的品牌标识部分](img/Image-4-7.png)\n\n图 4.8. 我们顶部栏上的品牌标识部分\n\
    \n让我们添加一个汉堡图标，它仅在浏览器宽度窄到无法显示完整导航栏时可见。该图标位于 `title-area` 元素内部：\n\n*top-bar.html\
    \ (节选)*\n\n```html\n<nav class=\"top-bar\" data-topbar>\n    <ul class=\"title-area\"\
    >\n        <li class=\"name\">\n            <h1><a href=\"#\">My Site</a></h1>\n\
    \        </li>\n        <!-- 汉堡图标 -->\n        <li class=\"toggle-menu\"><a href=\"\
    #\" data-toggle=\"menu\">Menu</a></li>\n    </ul>\n\n    <ul class=\"menu\">\n\
    \        <li><a href=\"#\">Home</a></li>\n        <li><a href=\"#\">Products</a></li>\n\
    \        <li><a href=\"#\">Services</a></li>\n        <li><a href=\"#\">Consulting</a></li>\n\
    \    </ul>\n</nav>\n```\n"
- fmt: "\n## Figure 4.12. The drop-down menu\n\nThe menu is responsive. When collapsed\
    \ onto smaller screens, it appears sideways with an arrow icon indication, as\
    \ seen in [Figure 4.13](#ch04.html_ch4ex12 \"Figure 4.13. The drop-down menu on\
    \ a smaller screen\").\n\n![The drop-down menu on a smaller screen](figures/Image-4-12.png)\n\
    \nFigure 4.13. The drop-down menu on a smaller screen\n\nThere are a few additional\
    \ useful and interesting things that you can do with the top bar component:\n\n\
    - **Fixed top bar**: For the top bar to stay fixed as you scroll, wrap the whole\
    \ `<nav>` element inside a `<div>` element with the class `fixed`. The top bar\
    \ takes the width of the browser window and stays fixed to the window’s ceiling.\n\
    - **Contain to grid**: By default, the top bar takes the browser width. If you\
    \ want your navigation to be set to your grid width, wrap it in a `<div>` element\
    \ with the class `contain-to-grid`.\n- **Sticky top bar**: Suppose you have a\
    \ navigation bar in the middle of the web page and you want it to float and stick\
    \ to the top when it touches the browser ceiling. This can be achieved by wrapping\
    \ the navigation bar in a `<div>` element with the class `sticky`.\n- **Respond\
    \ to click**: By default, the drop-down menu in th top bar component responds\
    \ to the mouse hover. You can override this functionality and make it respond\
    \ to the mouse click instead by passing a parameter `is_hover: false` to the `data-option`\
    \ attribute.\n\n  For example:\n\n```\n<nav class=\"top-bar\" data-topbar data-options=\"\
    is_hover: false\">\n  …\n</nav>\n```\n\n## Summary\n\nThroughout this chapter,\
    \ we learned how to create and organize the content of our website. First we saw\
    \ how to create Foundation panels, alerts, and tables. We took a step further\
    \ and made the table responsive by placing an additional stylesheet to our project.\
    \ Then we proceeded to create intuitive tabs and saw how to make these vertical\
    \ by adding just a single class. Finally, we learned how to create amazing top\
    \ bars (navigation bars) and add a drop-down menu to it.\n\nIn the next chapter,\
    \ we’ll check out how to manage and organize pictures and videos by creating sliders\
    \ and thumbnails.\n\n# Chapter 5: Handling Media\n\nIn this chapter, we’re going\
    \ to learn some ways to to add snazzy videos and images to our sites using Foundation\
    \ and then add some styling. We’ll discover some handy components that add to\
    \ the user experience, such as image slideshows and lightboxes. So, let’s take\
    \ a look.\n\n## Integrating Video into Your Page\n\nWhat do you do when you need\
    \ to integrate a YouTube video into your web page? You grab the HTML embed code\
    \ from YouTube and paste it into your HTML file, right? However, these embed codes\
    \ usually come with a predefined height and width, so making such videos responsive\
    \ can be difficult.\n\nFortunately, Foundation gives us a component called flex-video\
    \ that wraps the embed code of any video source and makes it responsive. Creating\
    \ a flex video is extremely easy. You just have to add the class `flex-video`\
    \ to the `<div>` element and you’re done. Here’s an example of flex video that\
    \ contains a YouTube embed code:\n\n```\n<div class=\"flex-video\">\n      <iframe\
    \ width=\"420\" height=\"315\" src=\"//www.youtube.com/\nembed/k85mRPqvMbE\" frameborder=\"\
    0\" allowfullscreen></iframe>\n</div>\n```\n\nNote that this YouTube embed code\
    \ comes with a height and a width attribute hardcoded from YouTube. Yet Foundation’s\
    \ flex video component will just ignore them and make the video fit the parent\
    \ grid container.\n\nUsing Foundation, let’s create a grid system with a centered\
    \ central column that’s six virtual columns wide on large screens and eight virtual\
    \ columns wide on small screens. Then we’ll insert a flex video component into\
    \ it:\n\n*flex-video.html (excerpt)*\n\n```\n<div class=\"large-6 large-offset-3\
    \ small-8 small-offset-2 columns\">\n    <div class=\"flex-video\">\n        <iframe\
    \ width=\"420\" height=\"315\" src=\"//www.youtube.com/\nembed/k85mRPqvMbE\" frameborder=\"\
    0\" allowfullscreen></iframe>\n    </div>\n</div>\n```\n\nYou should see a similar\
    \ sight to [Figure 5.1](#ch05.html_ch5ex1 \"Figure 5.1. A flex video component\"\
    ) in your browser.\n\n![A flex video component](figures/Image-5-1.png)\n\nFigure\
    \ 5.1. A flex video component\n\nNow if you try to resize the browser width, you’ll\
    \ see that the width of the video also changes. It takes the full width of the\
    \ centered grid column.\n\nFoundation provides two additional CSS classes for\
    \ styling flex video: `widescreen` and `vimeo`. Normally, embedded videos are\
    \ square in shape. If you want to make it look wider or rectangular, add the class\
    \ `widescreen` to the `flex-video` element. This will add a `padding-bottom` of\
    \ `56.34%` to the flex video. The class `vimeo` can also be added to the flex\
    \ video when Vimeo videos are embedded. This removes extra padding from embedded\
    \ Vimeo videos.\n\n## Creating a Responsive Image Slideshow\n\nI can still remember\
    \ the huge amount of CSS and JavaScript code I had to write to create my first\
    \ image slideshow. Well, things are much simpler now, thanks to Foundation’s image\
    \ slideshow component called Orbit.\n\nA basic Orbit component is created using\
    \ a single unordered list `<ul>` tag with the `data-orbit` attribute:\n\n```\n\
    <ul data-orbit>\n</ul>\n```\n\nEvery `<li>` tag inside this list will represent\
    \ a slide in your slideshow, with each `<li>` element containing an `<img>` tag;\
    \ for example:\n\n```\n<ul data-orbit>\n    <li>\n        <img src=\"[path to\
    \ image 1]\"/>\n    </li>\n    <li>\n        <img src=\"[path to image 1]\"/>\n\
    \    </li>\n</ul>\n```\n\nIf you try this out, you'll see a fully fledged image\
    \ slideshow in your browser, as shown in [Figure 5.2](#ch05.html_ch5ex2 \"Figure\
    \ 5.2. An example of the Orbit image slider\").\n\n![An example of the Orbit image\
    \ slider](figures/Image-5-2.png)\n\nFigure 5.2. An example of the Orbit image\
    \ slider\n\nLooks great, doesn’t it? Let’s add some more features to this slider.\n\
    \nFor captions, add a `<div>` element with the class `orbit-caption` in each `<li>`\
    \ element:\n\n*orbit.html (excerpt)*\n\n```\n<ul data-orbit>\n    <li>\n     \
    \   <img src=\"[path to image 1]\"/>\n        <div class=\"orbit-caption\">\n\
    \            First slide caption. Lorem ipsum dolor sit amet,\nconsectetur adipiscing\
    \ elit.\n        </div>\n    </li>\n    <li>\n        <img src=\"[path to image\
    \ 1]\"/>\n        <div class=\"orbit-caption\">\n            Second slide caption.\
    \ Lorem ipsum dolor sit amet,\nconsectetur adipiscing elit.\n        </div>\n\
    \    </li>\n</ul>\n```\n\nIf you refresh the browser, you’ll see text appearing\
    \ below each image, as shown in [Figure 5.3](#ch05.html_ch5ex3 \"Figure 5.3. Captions\
    \ added to our slideshow\").\n\n![Captions added to our slideshow](figures/Image-5-3.png)\n\
    \nFigure 5.3. Captions added to our slideshow\n\nFoundation’s Orbit component\
    \ is responsive by default but also responds to mobile touch gestures. If you\
    \ swipe left or right on mobile devices, the slides will change accordingly.\n\
    \n### Note: Orbit is Marked for Deprecation\n\nFoundation’s Orbit component has\
    \ been marked for deprecation. While it’s still included in the Foundation package,\
    \ it’s likely that it will be removed in the future. We’ve included it here because\
    \ it’s still a useful way to easily add a slideshow to your page, and it’s included\
    \ with the Foundation package by default. Alternative third-party slideshow components,\
    \ such as [Slick Carousel](http://kenwheeler.github.io/slick/), can also be used\
    \ to add image slideshows to your page instead. In the next section, we’ll discuss\
    \ the Clearing component, which provides an alternative way to present images\
    \ that's included in the default Foundation package.\n\n## Creating Image Lightboxes\
    \ with the Clearing Component\n\nWhile making slideshows using Orbit is easy,\
    \ it can be unsuitable for creating certain image slideshows. One of the major\
    \ problems of Orbit is its inability to handle variable height images.\n"
