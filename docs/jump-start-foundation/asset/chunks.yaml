  trans: "\n本节的第一部分将作为一种照片日志的形式，在五列宽的元素中包含图像，并在七列宽的元素中配有日志条目。我们只需要在这些 `div` 之间添加所需的内容即可。让我们在下方再添加几行来填满页面。对于第二行，我们将采取与第一行相反的操作。简单地将该行分为七列，然后是分为五列：\n\
    \n```\n<div class=\"medium-7 columns\">\n</div>\n<div class=\"medium-5 columns\"\
    >\n</div>\n```\n\n这种垂直元素的排列将有助于打破我们的网格，并创造出更有趣的内容流。现在，让我们来编辑本节的最后一行，并使用整个网格宽度的全部十二列：\n\
    \n```\n<div class=\"large-12 columns\">\n</div>\n```\n\n对于这一行，我们将使用 Foundation\
    \ 块级网格元素在行内均匀地分布水平内容。为了做到这一点，我们创建一个无序列表，并为行中的每个元素创建一个列表项。当我们创建列表时，我们指定类名为 `\"\
    small-block-grid-1 medium-block-grid-3\"`，这告诉框架在中等和大型屏幕尺寸上将行分为三列，在小屏幕上分为一列。以下是生成的代码：\n\
    \n```\n<ul class=\"small-block-grid-1 medium-block-grid-3\">\n    <li></li>\n\
    \    <li></li>\n    <li></li>\n</ul>\n```\n\n到此，我们就完成了第一个内容区块！最终代码应该是这样的（元素中已添加了填充内容）：\n\
    \n`index.html`（节选）\n\n```\n<div class=\"section\">\n    <div class=\"row\">\n\
