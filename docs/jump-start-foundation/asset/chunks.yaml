  trans: "\n\n![](img/cover.png)\n\n# 目录\n\n- 序言\n- 1. 基础\n- 2. 快速上手 Foundation 网格系统\n\
    - 3. 原型布局\n- 4. 内容为王\n- 5. 处理媒体\n- 6. 使用表单\n- 7. 使用 Sass 定制 Foundation\n\n![SitePoint®](img/sitepoint-logo-2012.png)\n\
    \n# 快速上手 Foundation\n\n#### 作者：SYED FAZLE RAHMAN\n\n### & JOE HEWITSON\n\n# 快速上手\
    \ Foundation\n\n作者：Syed Fazle Rahman 和 Joe Hewitson\n\n版权 © 2015 SitePoint Pty.\
    \ Ltd.\n\n产品经理：Simon Mackie\n技术审核员：Ryan Reese\n英语编辑：Kelly Steele\n封面设计：Alex Walker\n\
    \n## 权利声明\n\n保留所有权利。未经出版者书面许可，不得以任何形式或通过任何手段复制、存储在检索系统中或传输本书的任何部分，但文章或评论中的简短引用除外。\n\
    \n## 免责声明\n\n作者和出版者已尽力确保书中信息的准确性。然而，本书包含的信息按现状出售，不提供任何明示或暗示的保证。作者、SitePoint Pty.\
    \ Ltd. 及其经销商或分销商对书中包含的指令或此处描述的软件或硬件产品所直接或间接造成的任何损害不承担责任。\n\n## 商标说明\n\n本书并未对每个商标名称的出现进行标注，仅以编辑方式使用这些名称，旨在维护所有者的利益，无侵权意图。\n\
    \n![SitePoint®](img/sitepoint-logo-2012.png)\n\nSitePoint Pty. Ltd. 出版\n\n48 Cambridge\
    \ StreetCollingwood VIC Australia 3066\n\n网站：www.sitepoint.com\n邮箱：business@sitepoint.com\n\
    \n***\n\n## 关于 Syed Fazle Rahman\n\nSyed Fazle Rahman 是一位来自印度的热情 Web 开发者和技术作家。他是\
    \ `devmag.io` 的联合创始人，这是一个软件开发者聚会和讨论编程的社区。Syed 还是 SitePoint 出版的书籍 [快速上手 Bootstrap](http://www.sitepoint.com/store/jump-start-bootstrap/)\
    \ 的作者。在不编程时，你可以发现他在看书或玩游戏。\n\n## 关于 Joe Hewitson\n\nJoe 从小就热爱编码，乐于留存在软件开发的前沿，尤其是\
    \ Web 技术。这使他在专业领域取得了成功，从创建基于 Web 的医疗应用程序到动态 CMS 框架。他花费大量的空闲时间探索新的 Web 技术，并将所学知识分享给那些愿意倾听的人。\n\
    \n## 关于 SitePoint\n\nSitePoint 专门为 Web 专业人士出版幽有趣、实用且易于理解的内容。访问 [`www.sitepoint.com/`](http://www.sitepoint.com/)\
    \ 获取我们的博客、书籍、通讯、文章和社区论坛。你可以在这里找到关于 JavaScript、PHP、Ruby、移动开发、设计等大量信息。\n\n***\n\n\
    送给我亲爱的父母、麻烦的哥哥、可爱的妹妹，以及我最好的朋友 Sandeep。\n\n—Syed\n\n送给所有对知识充满渴望的人，愿这本书能进一步增加你们的胃口。\n\
    \n—Joe\n\n# 序言\n\n从零开始构建现代、专业的网站需要花费大量精力和。今天的网站需要是响应式的、移动优先的、设计精美的且快速的。这正是 Zurb\
    \ Foundation 框架可以帮助你的地方。它提供了大量的 HTML 组件和一个网格系统，让创建专业的响应式模板变得轻而易举，显著缩短了开发时间。\n\n\
    Foundation 这样的框架对所有人都有用，但对于初学者来说是一个福音。创建复杂 Web 组件所需的复杂 CSS 和 JavaScript 都已经编写完成。只需要一些\
    \ HTML 标记即可使其运行。经验丰富的开发者可以使用 Sass 对框架进行定制。\n\n在整本书中，我们的目标是提供 Foundation 框架的完整指南。我们将介绍如何在不需要掌握高级\
    \ Web 开发技术的情况下构建精美的响应式网站。我们还将讨论 Foundation 提供的各种有用组件，并探索定制 Foundation 外观和体验的方法以生成完全独特的设计。\n\
    \n## 谁应该读这本书\n\n本书适合初级到中级的 Web 设计师和开发者。假设读者具有 HTML 和 CSS 经验，具备一些 JavaScript 知识会有帮助。\n\
    \n## 使用规范\n\n你会发现我们在整本书中使用了特定的排版和布局样式来表示不同类型的信息。请关注以下内容。\n\n### 代码示例\n\n书中的代码将使用等宽字体显示，如下：\n\
    \n```\n<h1>A Perfect Summer's Day</h1>\n<p>It was a lovely day for a walk in the\
    \ park. The birds \nwere singing and the kids were all back at school.</p>\n```\n\
    \n如果代码位于代码存档中，文件名将出现在程序列表顶部：\n\n`example.css`\n\n```\n.footer {\n  background-color:\
    \ #CCC;\n  border-top: 1px solid #333;\n}\n```\n\n如果只显示文件的部分内容，用单词 `excerpt`（节选）表示：\n\
    \n`example.css` (excerpt)\n\n```css\nborder-top: 1px solid #333;\n```\n\n↵ 表示为了格式需要而存在的换行，应该忽略：\n\
    \n```javascript\nfunction animate() {\n  return new_variable;\n}\n```\n\n### 提示、注意和警告\n\
    \n### 提示：嘿，你过来！\n\n提示将给你提供有用的小建议。\n\n### 注意：啊，打扰一下\n\n注意是与当前主题相关但并非关重要的补充说明。将它们视为额外的信息碎片。\n\
    \n### 重要：务必始终\n\n关注这些重要要点。\n\n### 警告：小心！\n\n警告将突出你在过程中可能会遇到的任何坑（陷阱）。\n\n## 补充材料\n\
    \n- [`www.sitepoint.com/store/jump-start-foundation/`](http://www.sitepoint.com/store/jump-start-foundation/)：书籍的网站，包含链接、更新、资源等。\n\
    - [`github.com/spbooks/jsfoundation1`](https://github.com/spbooks/jsfoundation1)：本书的可下载代码存档。\n\
    - [`community.sitepoint.com/c/html-css`](http://community.sitepoint.com/c/html-css)：SitePoint\
    \ 论坛，用于解决任何棘手的 Web 问题。\n- `books@sitepoint.com`：我们的邮箱地址，如果您需要寻求支持、报告问题或出于其他原因联系我们可以使用。\n\
    \n## 想进一步学习吗？\n\n感谢你购买 SitePoint 的书籍。你想继续学习吗？现在你可以在 [SitePoint Premium](https://www.sitepoint.com/premium/home)\
    \ 无限制访问所有的 SitePoint 书和课程，以及来自我们精选合作伙伴的高质量书籍。现在注册，从今天开始学习！\n\n# 第 1 章\n\n基础\n\n"
- fmt: "\nReady to get your hands dirty with all that the Zurb Foundation framework\
    \ has to offer? Such enthusiasm is certainly commendable, and if you’re as excited\
    \ about CSS frameworks as I am, jumping in headfirst is likely why you’re here\
    \ in the first place. Diving right in is exactly what we’ll do ... in a moment.\
    \ Before we get too far ahead of ourselves, let’s take a second to get our bearings\
    \ and make sure we have a firm grasp on the ideas and concepts behind the Foundation\
    \ framework.\n\nAs you read through the sections of this chapter, you’ll gain\
    \ a solid understanding of what the Foundation framework is and how it can be\
    \ of benefit to your web projects. You’ll find this genuinely useful information\
    \ presented in three sections. The first will cover foundational aspects of CSS\
    \ frameworks in a general sense. What they are, why they’re useful, and some important\
    \ concepts. In the second section you’ll find a high-level overview describing\
    \ the CSS framework for which this book was written. It’s here that you’ll discover\
    \ the main intricacies that set the Zurb Foundation framework apart from its peers.\
    \ Finally, the third section will have you roll up your sleeves and begin your\
    \ `Jump Start Foundation` journey by setting up a basic project with Zurb’s CSS\
    \ framework.\n\nReady to dive in? Let’s get started!\n\n## Introduction to CSS\
    \ Frameworks\n\nIf you’ve never used a software `framework` before, it might be\
    \ beneficial to think of it in the construction sense. When building a house,\
    \ one of the first steps of actual construction is the development of the frame.\
    \ Built out of any number of basic elements, it serves as a unified structure\
    \ supporting the rest of the house. Without it, you’d have nothing to hinge your\
    \ doors on or place your walls against. Similarly, a CSS framework provides a\
    \ styling structure from which you can more easily build your web projects.\n\n\
    I know this all sounds well and good for a general contractor, but how can it\
    \ help you build a better web project? CSS frameworks grant you the ability to\
    \ develop web projects quickly using predeveloped CSS components. There’s no need\
    \ to reinvent the wheel every time you start a new project. To use most of these\
    \ components, you simply write down the required HTML markup and you’re done.\
    \ It makes it easier to create a basic web user interface prototype without having\
    \ to write down many CSS or JavaScript codes.\n\nI’ll give you a quick example\
    \ of how CSS frameworks work in practice. When creating a new web project without\
    \ the aid of a CSS framework, until stylesheets are created to define even the\
    \ simplest of elements, your resulting pages will look little better than if they\
    \ were created with a typewriter. When the time comes to begin styling, every\
    \ facet of the page structure must be considered and styled appropriately―everything\
    \ from the most basic paragraphs to fully customized div containers. Not only\
    \ do these basic styles need to be developed from scratch, but also more advanced\
    \ components such as image galleries or JavaScript features must likewise be manually\
    \ developed or integrated into the project.\n\nYou can imagine (if you’ve spent\
    \ any appreciable amount of time developing web projects from scratch) how this\
    \ process can quickly become time consuming. But with a CSS framework, this process\
    \ is made drastically easier by using many of its built-in CSS and JavaScript\
    \ components.\n\nInstead of tediously defining each basic element of a new web\
    \ project, you only need to worry about styles you’d like to customize further.\
    \ This can cut large amounts of hand-styling out of the web development equation,\
    \ letting you focus more on refining the look of your project rather than defining\
    \ every piece of its appearance.\n\nFurthermore, it reduces countless hours tinkering\
    \ with fussy JavaScript with the hope of adding fancy effects. For example, adding\
    \ a simple thumbnail feature to your project would likely require dozens of lines\
    \ of code without having use of prebuilt libraries. Heck, even with jQuery you’d\
    \ need to include the requisite scripts, set up an anchor with a call to the action,\
    \ and finally style the thumbnail itself.\n\nWith a CSS framework such as Foundation,\
    \ it’s as simple as this:\n\n```html\n<a class=\"th\" href=\"../img/image.png\"\
    >\n    <img src=\"../img/image.png\">\n</a\n```\n\nBy simply specifying the thumbnail\
    \ class, `th` in the case of Foundation, the image is automatically styled and\
    \ the required JavaScript applied to create a polished thumbnail image. Again,\
    \ this is just one example of how CSS frameworks can make your life easier as\
    \ a web developer. We’ll be learning more about Foundation components and how\
    \ it is easy it is to employ them in our websites from [Chapter 4](#ch04.html\
    \ \"Chapter 4Content Is King\") onwards; however, to check out the complete list\
    \ of components and their usages, you can always refer to the [Foundation documentation.](http://foundation.zurb.com/docs/)\n\
    \n## Becoming Acquainted with Foundation\n\nThe Foundation framework began as\
    \ a humble style guide used by the folk at [Zurb,](http://zurb.com/) a product\
    \ design company, back in 2008 for all their client projects. It wasn’t long before\
    \ they realized that their development methods were much too slow and inefficient.\
    \ What they needed was a library of frequently used tools that they could reimplement\
    \ in a quick and easy fashion. Sounds like a CSS framework, doesn’t it? That’s\
    \ exactly what they built, and presumably realizing that it would be useful for\
    \ others too, decided to release it to the world.\n\nBringing together their most\
    \ commonly utilized CSS, jQuery plugins, elements, and best practices, Zurb released\
    \ the Foundation framework in 2011. With its release came a couple of firsts:\
    \ the first open-source front-end framework to be `responsive`, and the first\
    \ to take a `mobile-first` approach, and the first to be `semantic`.\n\nImpressive,\
    \ right? But what does all that mean? Well, being the `responsive` framework that\
    \ it is, Foundation-enabled websites have the ability to respond to different\
    \ screen sizes correctly and smoothly right out of the box. With Foundation, there’s\
    \ no need to worry about styles breaking or elements disappearing when the user’s\
    \ screen size strays from that which you had in mind when developing. Of course,\
    \ this assumes you’ve stayed within the comforting arms of the grid layout (more\
    \ on that [later in the book](#ch02.html \"Chapter 2Getting Started With Foundation's\
    \ Grid System\")).\n\nAlong with the ease of building responsively, Foundation\
    \ takes a `mobile-first` approach to web design. This means that when you develop\
    \ projects with the Foundation framework, your design elements are built first\
    \ with small screens in mind. It then gives you various choices to tweak the layout\
    \ and rearrange components in larger screens easily without writing much code.\
    \ With the ever-increasing popularity of mobile browsing, this makes good practice\
    \ for web development in general.\n\nFinally, as a `semantic` framework, Foundation\
    \ allows you to use markup that just makes plain sense. This is an often overlooked\
    \ benefit of the framework, but for a web developer who spends large amounts of\
    \ time sifting through HTML selectors, having easily readable markup can make\
    \ a world of difference. In addition, being among the top 15 open-source projects\
    \ with over 500 contributors at the time of writing, Foundation maintains good\
    \ code quality and uses the easiest markup for its components.\n\nProof of Zurb’s\
    \ diligent innovations is evident when browsing the [components section of the\
    \ Foundation documentation.](http://foundation.zurb.com/docs/components/kitchen_sink.html)\
    \ Humorously termed the “kitchen sink,” the default Foundation package includes\
    \ the following components, allowing you to add some traditionally advanced functionality\
    \ with only a few lines of code:\n\n*   Structure―Foundation components that will\
    \ help in defining the structure of web pages:\n    *   media queries\n    * \
    \  visibility\n    *   grid\n    *   block grid\n"
