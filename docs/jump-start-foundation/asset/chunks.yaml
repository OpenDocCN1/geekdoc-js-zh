    \ to define a color scheme for your website. Let’s create a new file that will\
    \ store some re-useable colors for our website.\n\nCreate a new file _colors.scss\
    \ inside the folder sass and add three new variables into it:\n\n*_colors.scss*\n\
    \n```\n$theme-primary-color: #009688;\n$theme-secondary-color: #4DB6AC;\n$theme-text-color:\
    \ #212121;\n```\n\nNow, edit the file app.scss, which is inside the sass folder.\
    \ We’ll add the following code to the top of this file to include our newly created\
    \ colors.scss file:\n\n```\n@import \"colors\";\n```\n\n### Note: What’s with\
    \ the underscores at the start of filenames?\n\nSass filenames that start with\
    \ an underscore are called **partials**. This indicates that they are incomplete\
    \ Sass files as they depend on other Sass files for variables and functions. If\
    \ you remove the underscore from a filename, Compass will generate a new static\
    \ CSS file of the same name.\n\nNow that we have our theme colors defined, let’s\
    \ create a new class which, when attached to any paragraph element, will make\
    \ it stand out from the rest. We’ll use our theme colors in this class definition.\
    \ Edit the _settings.scss file and add the following Sass code at the bottom of\
    \ the file:\n\n```\n.standout-paragraph{\n    color: $theme-text-color;\n    padding:\
    \ 20px;\n    background-color: $theme-secondary-color;\n}\n```\n\nOnce compiled,\
    \ the aforementioned code will have values such as:\n\n```\n.standout-paragraph{\n\
    \    color: #212121;\n    padding: 20px;\n    background-color: #4DB6AC;\n}\n\
    ```\n\n**Nesting** is a great way of organizing and maintaining CSS styles. Let’s\
    \ look at nesting in Sass by modifying the Sass code of `.standout-paragraph`:\n\
    \n```\n.standout-paragraph{\n    color: $theme-text-color;\n    padding: 20px;\n\
    \    background-color: $theme-secondary-color;\n    //Nested Type 1\n    a{\n\
    \        color: #FFFFFF;\n        text-decoration: none;\n    }\n    //Nested\
    \ Type 2\n    &.white-text{\n        color: #FFFFFF;\n    }\n}\n```\n\nIn this\
    \ code, we have nested two new definitions: for `<a>` elements and for the `white-text`\
    \ class. Let’s check out the resulting output:\n\n```\n.standout-paragraph{\n\
    \    color: #212121;\n    padding: 20px;\n    background-color: #4DB6AC;\n}\n\n\
    //Nested type 1 results in the following\n.standout-paragraph a{\n    color: #FFFFFF;\n\
    }\n\n//Nested type 2 results in the following\n.standout-paragraph.white-test{\n\
    \    color: #FFFFFF;\n}\n```\n\nAs seen in the CSS code, the nested type 1 results\
    \ in CSS hierarchy that is `.standout-paragraph a`. However, nested type 2 is\
    \ a way of referencing the parent selector with the help of the `&` symbol.\n\n\
    Hopefully this has given you a basic understanding of nesting in Sass. For further\
    \ reading, refer to the Sass documentation’s [nesting section.](http://sass-lang.com/documentation/file.SASS_REFERENCE.html#nested_rules)\n\
    \n### Understanding app.scss\n\nWe’ll move to the next important file in the scss\
    \ folder, which is app.scss. This is the parent Sass file from which the main\
    \ `app.`css file is created for the project, and is also where all the partial\
    \ Sass files get imported. As mentioned above, partials are Sass files which cannot\
    \ be compiled independently. They may have variables and functions that are defined\
    \ in other Sass files."
