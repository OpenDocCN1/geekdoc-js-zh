    ></script>\n …\n```\n\nNext, we initialize the Abide library on our form by adding\
    \ the attribute `data-abide` to the `<form>` tag:\n\n```\n<form data-abide>\n\
    \ …\n</form>\n```\n\nThe error states should now be hidden after you reload the\
    \ page, as shown in [Figure 6.10](#ch06.html_ch6ex15 \"Figure 6.10. The form with\
    \ error states hidden by Abide\").\n\n![The form with error states hidden by Abide](figures/Image-6-15.png)\n\
    \nFigure 6.10. The form with error states hidden by Abide\n\nIf you submit this\
    \ form, you'll see that the validation fails to work. This is because we haven't\
    \ told Abide library which fields to validate. The most basic validation requirement\
    \ is for the form fields not being empty. We'll use HTML5's `required` attribute\
    \ to add the necessary validation to the form input fields:\n\n*index.html (excerpt)*\n\
    \n```\n<form data-abide>\n  <div class=\"name-field\">\n    <label>Your name\n\
    \      <input type=\"text\" required/>\n    </label>\n    <small class=\"error\"\
    >Name is required and must be a string.\n↵</small>\n  </div>\n  <div class=\"\
    email-field\">\n    <label>Email\n      <input type=\"email\" required/>\n   \
    \ </label>\n    <small class=\"error\">An email address is required.</small>\n\
    \  </div>\n  <button type=\"submit\">Submit</button>\n</form>\n```\n\nNow if you\
    \ try to submit the form—after reloading the page, of course—you'll see that validation\
    \ is working and empty fields aren't accepted, as shown in [Figure 6.11](#ch06.html_ch6ex16\
    \ \"Figure 6.11. The form now rejects empty fields\")."
