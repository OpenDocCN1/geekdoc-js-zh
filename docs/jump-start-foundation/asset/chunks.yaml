    \ space and make our website width equal to the browser width. This is important\
    \ because some mobile browsers have problems rendering websites that are responsive;\
    \ that is, websites that modify their layout with respect to the size of the browser.\n\
    \nThen we include Foundation’s default CSS file by specifying the path to the\
