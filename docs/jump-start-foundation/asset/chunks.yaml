    ![SitePoint®](images/sitepoint-logo-2012.png)\n\n# JUMP START FOUNDATION\n\n###\
    \ BY SYED FAZLE RAHMAN\n\n### & JOE HEWITSON\n\n# Jump Start Foundation\n\nby\
    \ Syed Fazle Rahman and Joe Hewitson\n\nCopyright © 2015 SitePoint Pty. Ltd.\n\
    \nProduct Manager: Simon MackieTechnical Reviewer: Ryan ReeseEnglish Editor: Kelly\
