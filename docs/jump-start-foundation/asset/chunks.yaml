  trans: "\n如果你打开 `app.scss` 文件，它的顶部应该有三个 `import` 语句：\n\n```\n@import \"colors\"\
    ;\n@import \"settings\";\n@import \"foundation\";\n```\n\n前两个文件存在 `scss` 文件夹中；然而，最后一个文件\
    \ `foundation.scss` 是从 `/bower_components/foundation/scss/foundation.scss` 导入的。\n\
    \n你会在这个 `app.scss` 文件中发现许多被注释的 `import` 语句，例如：\n\n```\n// @import\n//   \"foundation/components/accordion\"\
    ,\n//   \"foundation/components/alert-boxes\",\n//   \"foundation/components/block-grid\"\
    ,\n```\n\n提供这些语句主要是为了让你能够选择仅包含应用程序所需的组件。你可以通过注释掉 `@import \"foundation\";` 这一行，并取消从第五行开始的各个组件的注释来实现。\n\
    \n例如，如果你选择跳过 `accordion`、`flex-video` 和 `joyride` 组件，你可以取消其余组件的注释，并保持这些组件处于注释状态。为此，你需要注释掉这一行：\n\
    \n```\n// @import \"foundation\";\n```\n\n并按照如下方式取消这些行的注释：\n\n```\n@import\n \
    \ \"foundation/components/accordion\",\n  \"foundation/components/flex-video\"\
    ,\n  \"foundation/components/joyride\";\n```\n\n`app.scss` 文件也是为你的项目引入新样式的地方。在上一节中，我们在\
    \ `settings.scss` 文件中内部创建了 `standout-paragraph` 及其子元素的定义。由于 `settings.scss` 文件在\
    \ `app.scss` 文件的顶部导入，它可能会被下方的其他 `import` 覆盖。因此，强烈建议你在 `app.scss` 文件的末尾编写新的 Sass\
    \ 代码。\n\n## 总结\n\n在本章中，我们学习了如何通过 Foundation CLI 设置 Sass 版本的 Foundation。我们涵盖了如何安装和设置\
    \ Bower 以及 Compass。一旦 Sass 设置完成，你可以做的远不止于简单的自定义。你可以创建新的 Sass 局部文件并将其导入 `app.scss`\
    \ 中，还可以通过新的 Sass 文件为你的项目添加新的类和样式。\n\n到此，我们探索 Foundation 框架的旅程就结束了，但我更倾向于认为这是为未来的旅行奠定基础。我相信在这次介绍之后，你和我一样，对\
    \ Foundation 框架的潜力感到兴奋。如果你仍然热于探索更多，也可以参考 [SitePoint 上的 Foundation 相关文章](http://www.sitepoint.com/?s=foundation)\
    \ 来了解更多关于使用 Foundation 框架可以做。这里是其他实用的链接：\n\n* [使用 Foundation 5 和 Sass 进行语义化标记](http://www.sitepoint.com/semantic-markup-foundation-5-sass/)\n\
    * [Foundation 5 文档](http://foundation.zurb.com/docs/)\n* [使用 Foundation 构建的示例网站](http://foundation.zurb.com/learn/website-examples.html)\n\
    * [免费的 Foundation 模板](http://foundation.zurb.com/templates.html)\n* [Foundation\
    \ 字体图标](http://zurb.com/playground/foundation-icon-fonts-3)\n\n我希望你喜欢这本书并尝试 Foundation。祝你未来的\
    \ Web 项目以及 Foundation 之之旅好运！\n"
