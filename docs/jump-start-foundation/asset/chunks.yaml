    \n## Trademark Notice\n\nRather than indicating every occurrence of a trademarked\
    \ name as such, this book uses the names only in an editorial fashion and to the\
    \ benefit of the trademark owner with no intention of infringement of the trademark.\n\
    \n![SitePoint®](images/sitepoint-logo-2012.png)\n\nPublished by SitePoint Pty.\
    \ Ltd.\n\n48 Cambridge StreetCollingwood VIC Australia 3066\n\nWeb: www.sitepoint.comEmail:\
    \ business@sitepoint.com\n\n***\n\n## About Syed Fazle Rahman\n\nSyed Fazle Rahman\
    \ is a passionate web developer and technical writer from India. He is the co-founder\
    \ of `devmag.io`, a community for software developers to hang out and talk about\
    \ programming. Syed is also the author of the book [Jump Start Bootstrap](http://www.sitepoint.com/store/jump-start-bootstrap/),\
    \ published by SitePoint. When not programming, Syed can be found reading books\
    \ and playing games.\n\n## About Joe Hewitson\n\nGrowing up with a love for coding,\
    \ Joe delights in staying on the cutting edge of software development, especially\
    \ web technology. This has led him to professional success ranging from the creation\
    \ of web based, healthcare applications to dynamic CMS frameworks. He spends much\
    \ of his free time exploring new web technologies and sharing the knowledge he's\
    \ gained with those kind enough to listen.\n\n## About SitePoint\n\nSitePoint\
    \ specializes in publishing fun, practical, and easy-to-understand content for\
    \ web professionals. Visit [http://www.sitepoint.com/](http://www.sitepoint.com/)\
    \ to access our blogs, books, newsletters, articles, and community forums. You’ll\
    \ find a stack of information on JavaScript, PHP, Ruby, mobile development, design,\
    \ and more.\n\n***\n\nTo my lovely parents, troublesome brother, cute sister,\
    \ and my best buddy, Sandeep.\n\n—Syed\n\nTo all those still hungry for knowledge,\
    \ may this book only whet your appetite.\n\n—Joe\n\n# Preface\n\nCrafting a modern,\
    \ professional website from scratch takes a lot of time and effort. Sites today\
    \ need to be responsive, mobile first, slickly designed, and fast. That's where\
    \ Zurb's Foundation framework can help you. It provides a vast array of HTML components\
    \ and a grid system that makes creating professional, responsive templates a snap,\
    \ significantly cutting down development time.\n\nFrameworks such as Foundation\
    \ are useful for everyone, but are a blessing for novice developers. All the intricate\
    \ CSS and JavaScript required to create complex web components are prewritten.\
    \ Only some HTML markup is needed to make them work. More experienced developers\
    \ can customize the framework with Sass.\n\nThroughout this book, our aim is to\
    \ provide a complete guide to the Foundation framework. We'll cover how we can\
    \ build beautiful responsive websites without needing to gain expertise in advanced\
    \ web development techniques. We'll also discuss the various useful components\
    \ that Foundation provides out of the box, and explore ways of customizing the\
    \ look and feel of Foundation to generate completely unique designs.\n\n## Who\
    \ Should Read This Book\n\nThis book is suitable for beginner- to intermediate-level\
    \ web designers and developers. Experience of HTML and CSS is assumed, while some\
    \ knowledge of JavaScript is helpful.\n\n## Conventions Used\n\nYou'll notice\
    \ that we've used certain typographic and layout styles throughout this book to\
    \ signify different types of information. Look out for the following items.\n\n\
    ### Code Samples\n\nCode in this book will be displayed using a fixed-width font,\
    \ like so:\n\n```\n<h1>A Perfect Summer's Day</h1>\n<p>It was a lovely day for\
    \ a walk in the park. The birds \nwere singing and the kids were all back at school.</p>\n\
    ```\n\nIf the code is to be found in the book's code archive, the name of the\
    \ file will appear at the top of the program listing, like this:\n\n`example.css`\n\
    \n```\n.footer {\n  background-color: #CCC;\n  border-top: 1px solid #333;\n}\n\
    ```\n\nIf only part of the file is displayed, this is indicated by the word `excerpt`:\n\
    \n`example.css` (excerpt)\n\n```css\nborder-top: 1px solid #333;\n```\n\nA ↵ indicates\
    \ a line break that exists for formatting purposes, and should be ignored:\n\n\
    ```javascript\nfunction animate() {\n  return new_variable;\n}\n```\n\n### Tips,\
    \ Notes, and Warnings\n\n### Tip: Hey, You!\n\nTips will give you helpful little\
    \ pointers.\n\n### Note: Ahem, Excuse Me\n\nNotes are useful asides that are related—but\
    \ not critical—to the topic at hand. Think of them as extra tidbits of information.\n\
    \n### Important: Make Sure You Always\n\nattention to these important points.\n\
    \n### Warning: Watch Out!\n\nWarnings will highlight any gotchas that are likely\
    \ to trip you along the way.\n\n## Supplementary Materials\n\n- [http://www.sitepoint.com/store/jump-start-foundation/](http://www.sitepoint.com/store/jump-start-foundation/):\
    \ The book's website, containing links, updates, resources, and more.\n- [https://github.com/spbooks/jsfoundation1](https://github.com/spbooks/jsfoundation1):\
    \ The downloadable code archive for this book.\n- [http://community.sitepoint.com/c/html-css](http://community.sitepoint.com/c/html-css):\
    \ SitePoint's forums, for help on any tricky web problems.\n- [`books@sitepoint.com`](mailto:books@sitepoint.com):\
    \ Our email address, should you need to contact us for support, to report a problem,\
    \ or for any other reason.\n\n## Want to take your learning further?\n\nThanks\
    \ for choosing to buy a SitePoint book. Would you like to continue learning? You\
    \ can now gain unlimited access to ALL SitePoint books and courses, plus high-quality\
    \ books from our selected partners, at [SitePoint Premium](https://www.sitepoint.com/premium/home).\
    \ Enroll now and start learning today!\n\n# Chapter 1\n\nBuilding a Foundation\n"
