  trans: "\n\n## 图 4.12. 下拉菜单\n\n该菜单是响应式的。当在较小的屏幕上折叠时，它侧侧显示并带有箭头图标指示，如图 4.13 所示。\n\
    \n![较小屏幕上的下拉菜单](img/Image-4-12.png)\n\n图 4.13. 较小屏幕上的下拉菜单\n\n你可以对顶栏组件进行一些额外有用且有趣的操作：\n\
    \n- **固定顶栏 (Fixed top bar)**：若要让顶栏在滚动时保持固定，请将整个`<nav>` 元素封装在类为 `fixed` 的 `<div>`\
    \ 元素中。顶栏将占据浏览器窗口的宽度，并固定在窗口顶部。\n- **对齐网格 (Contain to grid)**：默认情况下，顶栏占据浏览器宽度。如果你想让导航栏设置为你的网格宽度，请将其封装在类为\
    \ `contain-to-grid` 的 `<div>` 元素中。\n- **粘性顶栏 (Sticky top bar)**：假设你在页面中间有一个导航栏，并希望它在触碰浏览器顶部时悬浮并固定在顶部。这可以通过将导航栏封装在类为\
    \ `sticky` 的 `<div>` 元素中实现。\n- **响应点击 (Respond to click)**：默认情况下，顶栏组件中的下拉菜单对鼠标悬停有响应。你可以覆盖此功能，通过向\
    \ `data-option` 属性传递参数 `is_hover: false` 来让它对鼠标点击做出响应。\n\n  例如：\n\n```\n<nav class=\"\
    top-bar\" data-topbar data-options=\"is_hover: false\">\n  …\n</nav>\n```\n\n\
    ## 总结\n\n在本章中，我们学习了如何创建和组织网站的内容。首先，我们看到了如何创建 Foundation 面板、警报和表格。我们更进了一步，通过向项目添加额外的样式表来使表格具有响应式。接着，我们创建了直观的标签页（tabs），并看到如何通过添加单个类名将其变为垂直排列。最后，我们学习了如何创建精妙的顶栏（导航栏）并向其添加下拉菜单。\n\
    \n在下一章中，我们将查看如何通过创建轮播和缩略图来管理和组织图片视频。\n\n# 第 5 章：处理媒体\n\n在本章中，我们将学习如何使用 Foundation\
    \ 为我们的网站添加酷炫的视频和图像，然后添加一些样式。我们将发现一些增加用户体验的实用组件，例如图片幻灯片和灯箱（lightboxes）。那么，让我们来看看吧。\n\
    \n## 将视频集成到你的页面\n\n当你需要在网页中集成 YouTube 视频时该怎么办？你从 YouTube 获取 HTML 嵌入代码并将其粘贴到你的\
    \ HTML 文件中，对吧？然而，这些嵌入代码通常带有预定义的高度和宽度，因此让此类视频具有响应式可能会困难。\n\n幸运的是，Foundation 为我们提供了名为\
    \ `flex-video` 的组件，它可以封装任何视频源的嵌入代码并使其变为响应式。创建一个 flex 视频非常简单。你只需要为 `<div>` 元素添加类\
    \ `flex-video` 即可。这是一个包含 YouTube 嵌入代码的 flex 视频示例：\n\n```\n<div class=\"flex-video\"\
    >\n      <iframe width=\"420\" height=\"315\" src=\"//www.youtube.com/\nembed/k85mRPqvMbE\"\
    \ frameborder=\"0\" allowfullscreen></iframe>\n</div>\n```\n\n注意，此 YouTube 嵌入代码带有来自\
    \ YouTube 硬编码的高度和宽度属性。然而，Foundation 的 flex video 组件将忽略这些属性，并让视频适应父网格容器。\n\n使用\
    \ Foundation，让我们创建一个网格系统，其中有一个居中的中央列，在大屏幕上为 6 个虚拟列宽，在小屏幕上为 8 个虚拟列宽。然后我们在其中插入一个\
    \ flex 视频组件：\n\n*flex-video.html (片段)*\n\n```\n<div class=\"large-6 large-offset-3\
    \ small-8 small-offset-2 columns\">\n    <div class=\"flex-video\">\n        <iframe\
    \ width=\"420\" height=\"315\" src=\"//www.youtube.com/\nembed/k85mRPqvMbE\" frameborder=\"\
    0\" allowfullscreen></iframe>\n    </div>\n</div>\n```\n\n你应该在浏览器中看到类似于图 5.1 的画面。\n\
    \n![flex 视频组件](img/Image-5-1.png)\n\n图 5.1. flex 视频组件\n\n现在如果你尝试调整浏览器宽度，你会发现视频宽度也随之变化。它占据了居中网格列的全宽。\n\
    \nFoundation 提供了两个额外的 CSS 类来样式化 flex ：`widescreen` 和 `vimeo`。通常，嵌入视频是正方形的。如果你想让它看起来更宽或呈矩形，请为\
    \ `flex-video` 元素添加类 `widescreen`。这将为 flex 视频添加 `56.34%` 的 `padding-bottom`。当嵌入\
    \ Vimeo 视频时，也可以为 flex 视频添加类 `vimeo`。这会移除嵌入 Vimeo 视频的额外内边距。\n\n## 创建响应式图片幻灯片\n\n\
    我还记得为了创建我的第一个图片幻灯片而编写了大量的 CSS 和 JavaScript 代码。现在，得益于 Foundation 名为 Orbit 的图片幻灯片组件，事情变得简单多了。\n\
    \n基础的 Orbit 组件是使用单个无序列表 `<ul>` 标签并带有 `data-orbit` 属性创建的：\n\n```\n<ul data-orbit>\n\
    ```\n\n列表中的每个 `<li>` 标签代表幻灯片中的幻灯片，每个 `<li>` 包含一个 `<img>` 标签；例如：\n\n```\n<ul data-orbit>\n\
    \    <li>\n        <img src=\"path to image 1\"/>\n    </li>\n    <li>\n     \
    \   <img src=\"path to image 2\"/>\n    </li>\n</ul>\n```\n\n如果你尝试一下，你将在浏览器中看到一个完整的图片幻灯片，如图\
    \ 5.2 所示。\n\n![Orbit 幻灯器示例](img/Image-5-2.png)\n\n图 5.2. Orbit 幻灯器示例\n\nFoundation\
    \ Orbit 组件默认是响应式的，而且对移动设备手势有响应。如果你在移动设备上向左或向右滑动，幻灯片就会随之切换。\n\n### 注意：Orbit 已标记为废弃\n\
    \n看起来看起来很棒，不是吗？让我们为这个幻灯器添加一些功能。\n\n对于字幕，在每个 `<li>` 元素中添加类为 `orbit-caption` 的 `<div>`\
    \ 元素：\n\n*orbit.html (片段)*\n\n```\n<ul data-orbit>\n    <li>\n        <img src=\"\
    path to image 1\"/>\n        <div class=\"orbit-caption\">\n            First\
    \ slide caption. Lorem ipsum dolor amet,\n            consectetur adipiscing elit.\n\
    \        </div>\n    </li>\n    <li>\n        <img src=\"path to image 2\"/>\n\
    \        <div class=\"orbit-caption\">\n            Second slide caption. Lorem\
    \ ipsum dolor amet,\n            consectetur adipiscing elit.\n        </div>\n\
    \    </li>\n</ul>\n```\n\n如果你刷新浏览器，你会在图片下方看到文字，如图 5.3 所示。\n\n![为我们的幻灯片添加了字幕](img/Image-5-3.png)\n\
    \n图 5.3. 为我们的幻灯片添加了字幕\n\n虽然使用 Orbit 创建幻灯片很容易，但它可能不适用于某些图片幻灯片。Orbit 的主要问题之一是无法处理高度异的图片。\n\
    \n### 注意：Orbit 已标记为废弃\n\nFoundation 的 Orbit 组件已被标记为废弃。虽然它仍然包含在 Foundation 软件包中，但它可能会在未来被移除。我们在这里包含它是因为它仍然是为页面轻松添加幻灯片的有效方法，而且它是\
    \ Foundation 软件包默认包含的。替代第三方幻灯片组件，例如 [Slick Carousel](http://kenwheeler.github.io/slick/)，也可以用于为你的页面添加图片幻灯片。在下一节中，我们将讨论\
    \ Clearing 组件，它提供了一种展示图片的替代方式，包含在默认 Foundation 软件包中。\n\n## 使用 Clearing 组件创建图片灯箱\n\
    \n虽然使用 Orbit 创建幻灯片很容易，但它可能不适用于创建某些图片幻灯片。Orbit 的主要问题之一是无法处理高度异的图片。\n\n"
- fmt: "\nWith the `Clearing` component, it’s possible to create an image slideshow\
    \ that displays images in full-screen mode and handles variable height images\
    \ properly. It looks similar to the photo lightbox of Google+, showing a set of\
    \ small image thumbnails that when clicked display the image full screen. Let’s\
    \ check out how to create a `Clearing` component:\n\n*clearing.html (excerpt)*\n\
    \n```html\n<ul class=\"clearing-thumbs\" data-clearing>\n  <li><a href=\"path/to/your/img\"\
    ><img src=\"path/to/your/img-th\"></a\n↵</li>\n  <li><a href=\"path/to/your/img\"\
    ><img src=\"path/to/your/img-th\"></a\n↵</li>\n  <li><a href=\"path/to/your/img\"\
    ><img src=\"path/to/your/img-th\"></a\n↵</li>\n</ul\n```\n\nAs you can see, you\
    \ need to set up an unordered list with the class `.clearing-thumbs` and add the\
    \ `data-clearing` attribute. Every `<li>` element in the list represents a thumbnail\
    \ image containing an anchor tag that wraps an image tag. The anchor tag links\
    \ to the original image while the image tag contains the path to the image thumbnail.\n\
    \nThe only disadvantage in opting for the `Clearing` component over an `Orbit`\
    \ component is that you have to create two different image sizes―thumbnail and\
    \ full-size image―for each image that you include.\n\nThe `Clearing` component\
    \ we created will look like [Figure 5.4](#ch05.html_ch5ex4 \"Figure 5.4. An example\
    \ of a Clearing component\").\n\n![An example of a Clearing component](figures/Image-5-4.png)\n\
    \nFigure 5.4. An example of a Clearing component\n\nWhen you click on any of these\
    \ thumbnails, you’ll have the full-size image shown in a lightbox as shown in\
    \ [Figure 5.5](#ch05.html_ch5ex5 \"Figure 5.5. After clicking a thumbnail, the\
    \ full-size image is shown.\").\n\n![After clicking a thumbnail, the full-size\
    \ image is shown.](figures/Image-5-5.png)\n\nFigure 5.5. After clicking a thumbnail,\
    \ the full-size image is shown.\n\nIf you want to style the thumbnails, add the\
    \ class `th` to every `<li>` element in the list:\n\n*clearing.html (excerpt)*\n\
    \n```html\n<ul class=\"clearing-thumbs\" data-clearing>\n  <li class=\"th\"><a\
    \ href=\"path/to/your/img\"><img src=\"path/to/your/\n↵img-th\"></a></li>\n …\n\
    </ul\n```\n\nNow every thumbnail image has a border with some padding, making\
    \ them look more like thumbnails.\n\nFor an image caption, add the `data-caption`\
    \ attribute with your caption text as the value to the image tag:\n\n*clearing.html\
    \ (excerpt)*\n\n```html\n<ul class=\"clearing-thumbs\" data-clearing>\n  <li class=\"\
    th\"><a href=\"path/to/your/img\"><img src=\"path/to/your/\n↵img-th\" data-caption=\"\
    First image caption\"></a></li>\n …\n</ul\n```\n\n## Summary\n\nIn this chapter,\
    \ we’ve handled two important types of media—videos and images—using various components\
    \ in Foundation. First, we saw how to create responsive images using flex videos.\
    \ Then we saw how to create a beautiful image slideshow using the `Orbit` component.\
    \ Finally, we learned about the `Clearing` component, one of the best ways to\
    \ display images in any website.\n\nIn the next chapter, we’ll learn how easy\
    \ it is to create and style forms in Foundation. We’ll also see how to create\
    \ intuitive switch buttons and range sliders, and talk about client-side form\
    \ validations in Foundation through the Abide validation library.\n\n# Chapter\
    \ 6: Working With Forms\n\nForms are a crucial component of any website. Sign-in\
    \ pages, registration pages, comment boxes, feedback sections and surveys are\
    \ all HTML forms. While using basic HTML markup to create forms is easy, styling\
    \ every form element can be a tedious task.\n\nIn this chapter, we’ll learn how\
    \ to create beautiful, responsive forms using the Foundation framework. We’ll\
    \ explore Foundation’s form validation classes, and how to validate our forms\
    \ with `Abide`. Finally, we'll discover how to use the Foundation toggle switches\
    \ such as the on/off buttons in iOS devices. Finally, we’ll explore Foundation’s\
    \ form validation classes. So, let's get started.\n\n## Building a Basic Form\n\
    \nUnlike many other front-end frameworks, such as Bootstrap, Foundation provides\
    \ no specific CSS classes for HTML forms. Foundation’s main CSS file includes\
    \ default styles for every basic HTML element. As always, if you want to override\
    \ a style or use a new style, you are free to do it in your `app.css` file.\n\n\
    The Foundation grid system is used in forms to control the width of the form’s\
    \ input elements, as well as to place the form elements at the right place. Let’s\
    \ examine how to place two different HTML input elements side by side in Foundation:\n\
    \n```html\n<form>\n    <div class=\"row\">\n        <div class=\"small-6 columns\"\
    >\n            <input type=\"text\" placeholder=\"First Name\" />\n        </div>\n\
    \        <div class=\"small-6 columns\">\n            <input type=\"text\" placeholder=\"\
    Last Name\"/>\n        </div>\n    </div>\n</form>\n```\n\nHere we have two different\
    \ columns using the classes `small-6` and `columns`. An input element has been\
    \ placed into each column that takes the width of each of the columns. This form\
    \ appears in [Figure 6.1](#ch06.html_ch6ex1 \"Figure 6.1. A basic form layout\"\
    ).\n\n![A basic form layout](figures/Image-6-1.png)\n\nFigure 6.1. A basic form\
    \ layout\n\nTo add a label to an input tag, wrap a `<label>` tag around the `<input/>`\
    \ tag as follows:\n\n```html\n<label>First Name\n    <input type=\"text\" placeholder=\"\
    First Name\" />\n</label>\n```\n\nWrapping a label around the input element associates\
    \ it with the corresponding input element. If wrapping a `<label>` tag around\
    \ the form is not suitable for your application, you can use the `for` attribute\
    \ on the `<label>` tag. The `for` attribute should have the ID of the `<input>`\
    \ element.\n\n[Figure 6.1](#ch06.html_ch6ex1 \"Figure 6.1. A basic form layout\"\
    ) will look like [Figure 6.2](#ch06.html_ch6ex2 \"Figure 6.2. Our form with labels\
    \ added\") after adding a label to each input tag.\n\n![Our form with labels added](figures/Image-6-2.png)\n\
    \nFigure 6.2. Our form with labels added\n\nYou can also wrap `<select>` and `<textarea>`\
    \ elements with labels. Let’s add `<select>` and `<textarea>` elements to our\
    \ existing form:\n\n*index.html (excerpt)*\n\n```html\n<form>\n    <div class=\"\
    row\">\n        <div class=\"small-6 columns\">\n            <input type=\"text\"\
    \ placeholder=\"First Name\" />\n        </div>\n        <div class=\"small-6\
    \ columns\">\n            <input type=\"text\" placeholder=\"Last Name\"/>\n \
    \       </div>\n    </div>\n    <div class=\"row\">\n        <div class=\"large-12\
    \ columns\">\n            <label>Select Place\n                <select>\n    \
    \                <option value=\"husker\">Alabama</option>\n                 \
    \   <option value=\"starbuck\">Alaska</option>\n                    <option value=\"\
    hotdog\">Arizona</option>\n                    <option value=\"apollo\">California</option>\n\
    \                </select>\n            </label>\n        </div>\n    </div>\n\
    \    <div class=\"row\">\n        <div class=\"large-12 columns\">\n         \
    \   <label>Add comment\n                <textarea placeholder=\"Write something\"\
    ></textarea>\n            </label>\n        </div>\n    </div>\n</form>\n```\n\
    \nThe form now should look as [Figure 6.3](#ch06.html_ch6ex3 \"Figure 6.3. Our\
    \ form with <select> and <textarea> elements added.\") does.\n\n![Our form with\
    \ <select> and <textarea> elements added.](figures/Image-6-3.png)\n\nFigure 6.3.\
    \ Our form with `<select>` and `<textarea>` elements added.\n\nNow let’s add some\
    \ radio buttons and checkboxes to our example form:\n\n*index.html (excerpt)*\n\
    \n```html\n<div class=\"row\">\n    <div class=\"large-6 columns\">\n        <label>Select\
    \ Gender</label>\n        <input type=\"radio\" name=\"gender\" value=\"male\"\
    \ id=\"\n↵maleRadio\"><label for=\"maleRadio\">Male</label>\n        <input type=\"\
    radio\" name=\"gender\" value=\"female\" id=\"\n↵femaleRadio\"><label for=\"femaleRadio\"\
    >Female</label>\n    </div\n\n    <div class=\"large-6 columns\">\n        <label>Preferred\
    \ Color</label>\n        <input id=\"blueCheckbox\" type=\"checkbox\"><label for=\"\
    \n↵blueCheckbox\">Blue</label>\n        <input id=\"redCheckbox\" type=\"checkbox\"\
    ><label for=\"\n↵redCheckbox\">Red</label>\n    </div>\n</div\n```\n\nThe result\
    \ should be similar to [Figure 6.4](#ch06.html_ch6ex4 \"Figure 6.4. Our example\
    \ form evolves with radio buttons and checkboxes added.\").\n"
