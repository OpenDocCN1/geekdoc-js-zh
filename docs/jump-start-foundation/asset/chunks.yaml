    \n## Summary\n\nWe meant to suggest that you start a timer or stopwatch at the\
    \ beginning of this chapter and stop it the second you finished the footer. There’s\
    \ no doubt you’d surprise yourself with just how quickly you set up a fully functional\
    \ prototype with minimal styling. In fact, most of your time would have been spent\
    \ reading with actual coding taking up only a fraction of the final time. Regardless,\
    \ I think it’s clear how you can benefit from the Foundation framework in how\
    \ it speeds up development.\n\nIn this chapter, you started with nothing and created\
    \ a fully styled prototype. You learned how to use the Foundation grid layout\
    \ and add rows and columns. You even learned how to offset columns to achieve\
    \ specific horizontal positioning. You had your first encounter with Foundation\
    \ components and used block grids, flex video, and the icon bar to add advanced\
    \ functionality.\n\nAs one last exercise and illustration of the value Foundation\
    \ adds to you web projects, go ahead and pull up the prototype in your favorite\
    \ browser. Looks good, right? Now shrink the right side of your browser window\
    \ until it’s as narrow as it can be. Better yet, bring up the page in your phone’s\
    \ browser. What you see now is a great example of Foundation’s inherent responsiveness.\
    \ Even though we did next to nothing to build in responsive stylings, our prototype\
    \ is fully functional—even on mobile screens. And we accomplished this with writing\
    \ only twenty-five lines of CSS!\n\nNow that you have a good idea of how powerful\
    \ and useful Foundation can be, let’s dig into some more advanced components in\
    \ Chapter 4!\n\n# Chapter 4\n\nContent Is King\n\nSo far in this book, we have\
    \ learned how to create various types of website layouts using the grid system\
    \ and have built a simple website prototype.\n\nThis chapter is going to be mostly\
    \ practical. We’ll learn how to style and organize the content of our website\
    \ using alerts, panels, responsive tables, tabs, and navigation bars.\n\nMaking\
    \ the content presentable is a vitally important factor you should consider when\
    \ building any website. Foundation provides us with many useful pre-built components\
    \ such as zebra-highlighted tables, beautiful buttons, tooltips, alerts, and panels\
    \ that we can directly use in our website to showcase and make the most of our\
    \ content.\n\n## Containing Content\n\nThis chapter is broadly classified into\
    \ two categories: Foundation components that **contain content** and components\
    \ that help in **organizing content**, such as tabs and navigation bars. In this\
    \ section, we will focus on creating and understanding three CSS components of\
    \ the Foundation framework that are used for containing content:\n\n1.  panels\n\
    \n2.  tables\n\n3.  alerts\n\n### Panels\n\nFoundation’s **Panel** component helps\
    \ in prominently highlighting announcements on a web page. You can use it to deliver\
    \ notices to the website’s visitors. Panels are designed to stand out from the\
    \ rest of the web page’s content.\n\nPanels are one of the simplest CSS components\
    \ in Foundation. You just add a single CSS class, `panel`, to make a `div` element\
    \ into a Foundation panel. Here’s an example of a panel:\n\n```\n<div class=\"\
    panel\">\n    <p>Some dummy content. Lorem ipsum dolor sit amet, consectetur \n\
    ↵ adipiscing elit. Pellentesque nec turpis ex. Sed venenatis magna\n↵ ac risus\
    \ aliquet placerat. </p>\n</div>\n```\n\nThis markup will look similar to [Figure 4.1](#ch04.html_ch4ex1\
    \ \"Figure 4.1. A basic example of a panel\") in a browser.\n\n![A basic example\
    \ of a panel](figures/Image-4-1.png)\n\nFigure 4.1. A basic example of a panel\n\
    \nThere’s absolutely no restriction to the type of content you can add inside\
    \ a panel component. Try adding images and heading tags in it.\n\nFoundation also\
    \ provides a panel component with a blue background called a **callout panel**.\
    \ It has a light blue background and a slightly dark blue border around it.\n\n\
    To create a callout panel, you need to add an additional class, `callout`, along\
    \ with the class `panel`. Let’s modify our existing default panel into a callout\
    \ panel:\n\n```\n<div class=\"panel callout\">\n    <p>Some dummy content. Lorem\
    \ ipsum dolor sit amet, consectetur\n↵ adipiscing elit. Pellentesque nec turpis\
    \ ex. Sed venenatis magna\n↵ ac risus aliquet placerat. </p>\n</div> \n```\n\n\
    You can see that the default gray-colored panel is now a blue-colored panel. A\
    \ callout panel will be useful in situations where the default panel fails to\
    \ grab your users’ attention, perhaps getting lost in your website's color theme.\n\
    \nThe border radius of the panel component can be modified by adding Foundation’s\
    \ helper class named `radius`. This adds a border radius of `3px` to all corners\
    \ of the panel component. [Figure 4.2](#ch04.html_ch4ex2 \"Figure 4.2. A callout\
    \ panel with a border radius\") presents the result of:\n\n*panel.html (excerpt)*\n\
    \n```\n<div class=\"panel callout radius\">\n    <p>Some dummy content. Lorem\
    \ ipsum dolor sit amet, consectetur\n↵ adipiscing elit. Pellentesque nec turpis\
    \ ex. Sed venenatis magna\n↵ ac risus aliquet placerat. </p>\n</div>\n```\n\n\
    ![A callout panel with a border radius](figures/Image-4-2.png)\n\nFigure 4.2. A\
    \ callout panel with a border radius\n\n### Note: Panels are Fluid\n\nPanel components\
    \ have fluid width by default. Their widths are controlled by the grid columns\
    \ in which they are present.\n\n### Note: Radius Won’t Work Everywhere\n\nIt's\
    \ worth noting that the useful `radius` helper class won’t work for all of Foundation's\
    \ components. In Foundation, this class works for panels, buttons, and form input\
    \ elements only. You can, however, create your own custom style by overriding\
    \ default properties or adding new properties in your app.css file.\n\n### Tables\n\
    \nFoundation provides some basic styling for the default HTML tables. You don’t\
    \ have to add any classes to apply these styles as this is done by default. Let’s\
    \ create a basic HTML table and check out how it looks in the Foundation framework:\n\
    \n*tables.html (excerpt)*\n\n```\n<table>\n  <thead>\n    <tr>\n      <th width=\"\
    200\">Table Header</th>\n      <th>Table Header</th>\n      <th width=\"150\"\
    >Table Header</th>\n      <th width=\"150\">Table Header</th>\n    </tr>\n  </thead>\n\
    \  <tbody>\n    <tr>\n      <td>Content Goes Here</td>\n      <td>This is longer\
    \ content Donec id elit non mi porta gravida\n↵ at eget metus.</td>\n      <td>Content\
    \ Goes Here</td>\n      <td>Content Goes Here</td>\n    </tr>\n    <tr>\n    \
    \  <td>Content Goes Here</td>\n      <td>This is longer Content Goes Here Donec\
    \ id elit non mi \n↵ porta gravida at eget metus.</td>\n      <td>Content Goes\
    \ Here</td>\n      <td>Content Goes Here</td>\n    </tr>\n    <tr>\n      <td>Content\
    \ Goes Here</td>\n      <td>This is longer Content Goes Here Donec id elit non\
    \ mi \n↵ porta gravida at eget metus.</td>\n      <td>Content Goes Here</td>\n\
    \      <td>Content Goes Here</td>\n    </tr>\n  </tbody>\n</table>\n```"
