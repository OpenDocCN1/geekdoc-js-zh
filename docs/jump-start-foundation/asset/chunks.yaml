  trans: "\n```html\n<a class=\"item\">\n    <i class=\"fi-mail\"></i>\n</a>\n<a class=\"\
    item\">\n    <i class=\"fi-bookmark\"></i>\n</a>\n<a class=\"item\">\n    <i class=\"\
    fi-social-tumblr\"></i>\n</a>\n<a class=\"item\">\n    <i class=\"fi-social-twitter\"\
    ></i>\n</a>\n<a class=\"item\">\n    <i class=\"fi-like\"></i>\n</a>\n```\n\n\
    图 3.7 显示了渲染后的结果。\n\n![我们原型中的页脚](img/Image-3-7.png)\n\n图 3.7. 我们原型中的页脚\n\n在这些每一个\
    \ `item` 锚点中，我们都添加了项目本身，它们仅仅是空白元素，其类名与我们想要使用的 Foundation 图标对应。这些图标是 Zurb 免费提供的字体图标。使用字体图标的优势是它们在任何显示分辨率下看起来都非常清晰。这些图标可以在\
    \ [Foundation 网站，](http://zurb.com/playground/foundation-icon-fonts-3) 找到，只需要下载并将它们存储在根目录的\
    \ `img` 文件夹中。通过向锚点标签添加 `href=\"\"` 属性，我们可以将这些图标引导到我们想要的任何地方。就这样，我们的页脚就拥有了一个漂亮的图标栏，带有优雅（更不用说可扩展）的图标引导用户访问各种联系链接。\n"
- fmt: "\n[Figure 4.3](#ch04.html_ch4ex3 \"Figure 4.3. A default Foundation table\"\
    ) shows what it looks like in the browser.\n\n![A default Foundation table](figures/Image-4-3.png)\n\
    \nFigure 4.3. A default Foundation table\n\nYou can see that Foundation applies\
    \ a light gray color to the table headers and alternative rows (zebra-style).\
    \ It also adds a border around the table by default.\n\nUnlike many other CSS\
    \ frameworks, Foundation doesn’t provide various types of pre-styled tables; instead,\
    \ you can customize the default one.\n\n## Responsive Foundation Tables\n\nOne\
    \ of the major problems with this default Foundation table is that it fails the\
    \ responsive test. When there are many columns in the table, it may look broken\
    \ on smaller screens. There’s also no support for responsive tables in the default\
    \ Foundation framework; however, Foundation has released a separate package for\
    \ responsive tables as a part of the [Foundation Playground](http://zurb.com/playground)\
    \ website, where they share technical experiments. The package can be downloaded\
    \ from [http://zurb.com/playground/responsive-tables](http://zurb.com/playground/responsive-tables).\
    \ Copy the files `responsive-tables.css` and `responsive-tables.js` from this\
    \ package to your project directory, then link the CSS file into the `<head>`\
    \ section of the HTML file as follows:\n\n```\n<link type=\"text/css\" media=\"\
    screen\" rel=\"stylesheet\" \nhref=\"css/responsive-tables.css\" />\n```\n\nNow\
    \ insert the JavaScript file into the HTML file as follows:\n\n```\n<script type=\"\
    text/javascript\" src=\"js/responsive-tables.js\">\n</script>\n```\n\nMake sure\
    \ that you add the JavaScript just after the jQuery file, otherwise it will fail\
    \ to work.\n\nAfter you have linked these two files, add a class named `responsive`\
    \ to the `<table>`` element. The table will become responsive magically!\n\nGo\
    \ ahead and add the class `responsive` to the recently created table. Try to resize\
    \ the browser screen to a smaller size or use Chrome’s Mobile Emulation Mode to\
    \ check the table in smaller devices. You can see that there’s a horizontal scroll\
    \ added to the table that lets you view its whole content. The previously broken\
    \ table now looks a lot better and is completely accessible.\n\n## Alerts\n\n\
    As the name suggests, `Alert` components are used to display alert messages in\
    \ web applications. They are generally used to communicate success, failure, or\
    \ warning messages. First, let’s create a basic alert box:\n\n```\n<div data-alert\
    \ class=\"alert-box\">\n  Alert content goes here.\n  <a href=\"#\" class=\"close\"\
    >&times;</a>\n</div>\n```\n\n[Figure 4.4](#ch04.html_ch4ex4 \"Figure 4.4. A basic\
    \ alert box\") shows what this alert box looks like in the browser.\n\n![A basic\
    \ alert box](figures/Image-4-4.png)\n\nFigure 4.4. A basic alert box\n\nHere,\
    \ the custom data attribute `data-alert` binds the alert div with Foundation’s\
    \ JavaScript. You also have to add a class named `alert-box` to apply the appropriate\
    \ CSS styles. Any amount of content can be included inside this alert component;\
    \ however, you need to add an anchor tag with the class `close` at the end. This\
    \ tag contains the HTML code `&times;` for displaying an `x` symbol, which is\
    \ used to close the alert component. You can also replace it with any font icon\
    \ of your choice.\n\nAlerts can be used to convey success, failure, or warning\
    \ messages, as well as display any generic message. Hence, Foundation provides\
    \ classes to change the color of the alert boxes based on the type of alert.\n\
    \nYou can add various classes along with the default class `alert-box` to style\
    \ the alert. The classes and their colors are as follows:\n\n* `success`: green\n\
    * `warning`: orange\n* `alert`: red\n* `info`: light blue\n* `secondary`: gray\n\
    \nHere’s an example of an alert box with a color class:\n\n```\n<div data-alert\
    \ class=\"alert-box success\">\n  Payment Successful!\n  <a href=\"#\" class=\"\
    close\">&times;</a>\n</div>\n```\n\nYou can further enhance the look of the alert\
    \ box by changing the border radius of the corners. Foundation provides two border\
    \ classes that work with alert box: `radius` and `round`.\n\nThe `radius` class,\
    \ as we saw in the panels section, adds a border-radius of `3px`, while the `round`\
    \ class adds a `1000px` border-radius to the alert box. [Figure 4.5](#ch04.html_ch4ex5\
    \ \"Figure 4.5. Alert boxes using the round and radius helper classes\") shows\
    \ how they look:\n\n*alerts.html (excerpt)*\n\n```\n<div data-alert class=\"alert-box\
    \ success radius\">\n  Alert with .radius class.\n  <a href=\"#\" class=\"close\"\
    >&times;</a>\n</div>\n\n<div data-alert class=\"alert-box warning round\">\n \
    \ Alert with .round class.\n  <a href=\"#\" class=\"close\">&times;</a>\n</div>\n\
    ```\n\n![Alert boxes using the round and radius helper classes](figures/Image-4-5.png)\n\
    \nFigure 4.5. Alert boxes using the `round` and `radius` helper classes\n\nAs\
    \ has been mentioned, you can always override the `1000px` border-radius value\
    \ `round` class in your `app.css` file.\n\nFoundation also provides a custom event,\
    \ `close.fndtn.alert`, which is fired when the alert is closed. This event can\
    \ be used to make Ajax calls or perform perform client-side operations after the\
    \ alert is closed. Here's how it is used:\n\n```\n$(document).on('close.fndtn.alert',\
    \ function(event) {\n  console.log('Alert closed!');\n});\n```\n\n## Organizing\
    \ Content\n\nHaving well-organized content is vital. You need clean and easy-to-use\
    \ navigation so that your users can navigate your content. In this section, we\
    \ are going to learn how to create tabs, drop-downs, and navigation bars using\
    \ Foundation.\n\n### Tabs\n\n`Tabs` is one of the JavaScript components of Foundation.\
    \ It allows you to create and organize multiple items in a single container and\
    \ lets you switch between them easily. Creating a tabs component, just like any\
    \ other component in Foundation, requires adding only HTML markup.\n\nTo create\
    \ a tabs component, you need two HTML elements: the **tabs section** and the **tabs\
    \ content**.\n\nThe tabs section is created using an unordered list `<ul>` element\
    \ with the class `tabs` and a custom data attribute named `data-tab`. This custom\
    \ attribute binds the HTML markup with Foundation’s JavaScript:\n\n```\n<ul class=\"\
    tabs\" data-tab>\n    <li></li>\n</ul>\n```\n\nEvery child `<li>` element in this\
    \ unordered list represents tabs in the user interface. These `<li>` elements\
    \ should contain an anchor tag, which will link a tab to a particular content\
    \ div section. Add the class `tab-title` to each of the `<li>` elements to inherit\
    \ Foundation’s CSS styles. The markup for the tabs section should look a little\
    \ like this:\n\n*tabs.html (excerpt)*\n\n```\n<ul class=\"tabs\" data-tab>\n \
    \   <li class=\"tab-title active\"><a href=\"#panel1\">Tab 1</a></li>\n    <li\
    \ class=\"tab-title\"><a href=\"#panel2\">Tab 2</a></li>\n    <li class=\"tab-title\"\
    ><a href=\"#panel3\">Tab 3</a></li>\n    <li class=\"tab-title\"><a href=\"#panel4\"\
    >Tab 4</a></li>\n</ul>\n```\n\nYou-you should place an additional class of `active`\
    \ to one of the `<li>` elements; that will be the tab that’s selected when the\
    \ page loads in the browser. Additionally, the anchor tags should have their `href`\
    \ attribute set to the IDs of their respective tabs content div sections, which\
    \ we’ll create next.\n\nCreating tabs content requires creating a simple `<div>`\
    \ element with the class `tabs-content`. This element serves as a parent wrapper\
    \ for all the child content sections. Each child `<div>` element should have a\
    \ class `content` and a unique ID, corresponding to the links in the tabs section.\
    \ Here’s the markup for the tabs content:\n\n*tabs.html (excerpt)*\n"
