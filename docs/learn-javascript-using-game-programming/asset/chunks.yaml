    ## Understanding the HTML boilerplate code\n\nIf you don’t know anything about\
    \ HTML, It would be useful to search online for a basic tutorial on what HTML\
    \ is, such as searching for \"basic html\", this comes up: [https://www.w3schools.com/html/html_basic.asp](https://www.w3schools.com/html/html_basic.asp)\n\
    \n### Basics of html tags\n\nA html tag will usually be in this format: `<atag>\
    \ some info</atag>`. The `atag` here is a predefined word, which you can look\
    \ up by looking for \"html tags\" in the search engine.\n\nBut a html tag is always\
    \ wrapped in triangle like brackets, one \"opening the tag\": `<anothertag>`,\
    \ followed by information you want in the tag: \"this is in the tag\", and finally\
    \ closing the tag, which is just the same as the opening tag, but with a forward\
    \ slash in front of the words (indicating you’re closing the tag): `</anothertag>`.\n\
    \n#### How is this useful?\n\nThe tags in html let the browser know what is going\
