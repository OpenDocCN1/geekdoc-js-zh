- fmt: "\nFinally, we also handle `onerror`, which will only fire if it has trouble\
    \ loading our image (if the source file path doesn’t exist, or other issues).\n\
    \nNow we can add below the last function (inside the `AssetLoader` class):\n\n\
    ```javascript\nImageLoaded(img_container)\n{\n  console.log(\"image loaded! \"\
    , img_container.src);\n  img_container.loaded=true;\n  if(this.CheckIfAllImagesLoaded())\n\
    \  {\n    console.log(\"all images loaded!\");\n    this.callback();\n  }\n}\n\
    \nImageError(img_container, error)\n{\n  console.log(\"Couldn't load an image,\
    \ check above for an error, probably the wrong path\", img_container.src, error);\n\
    }\n```\n\nThe function `ImageLoaded` gets fired for each image when it gets loaded.\
    \ We pass over our custom `img_container` object, so that we can set its `loaded`\
    \ property to `true`. Then we run a function (we’ll define next) to check if all\
    \ the images are loaded, and if so, we’ll print out that all are loaded, and fire\
    \ the callback to let the rest of the program know the images are loaded, and\
    \ we can start the game (which we’ll show soon).\n\nNow we can add below the last\
    \ function (inside the `AssetLoader` class):\n\n```javascript\nCheckIfAllImagesLoaded()\n\
    {\n  let num_imgs_loaded=0;\n  for (let i = 0; i < this.image_containers.length;\
    \ i++)\n  {\n    let img_container = this.image_containers[i];\n    if(img_container.loaded)\n\
    \      num_imgs_loaded++;\n  }\n  if(num_imgs_loaded == this.image_containers.length)\n\
    \    return true;\n  else\n    return false;\n}\n\nGetImage(name)\n{\n  for (let\
    \ i = 0; i < this.image_containers.length; i++)\n  {\n    let img_container =\
    \ this.image_containers[i];\n    if(img_container.name==name)\n      return img_container;\n\
    \  }\n  return null;\n}\n```\n\nThe function `CheckIfAllImagesLoaded` will be\
    \ run for every image that gets loaded. Since they probably will get loaded out\
    \ of order (the larger files will take longer, and load last), we have to check\
    \ for every image if it’s the last of the images to be loaded.\n\nSo here we just\
    \ start with “0 images loaded before checking”, go through all the images, and\
    \ count how many have been loaded. Afterwards, if the number of images loaded\
    \ is the same as the total images we tried to load, it means we’re finished loading\
    \ all of them, and can return that it is true/ finished loading! If not, we’ll\
    \ return `false`, and keep waiting until all the images have had `onload` called.\n\
    \nWe create a `GetImage` function, which will be passed in a name for one of the\
    \ tiles, and will look through all of our custom `img_container` objects, look\
    \ if the name matches what we’re looking for, and return it if it was found (or\
    \ return `null` if nothing was found).\n\nWe’re done with our `AssetLoader` class,\
    \ but below that class (outside of it), add a new class:\n\n```javascript\nclass\
    \ Level\n{\n  constructor(tile_images)\n  {\n    this.tile_images = tile_images;\n\
    \  }\n} //end of class Level\n```\n\nThis will be used to house our level- but\
    \ right now it will just be used to store the tile images, in order (so 0 for\
    \ dirt, 1 for stone, etc- the stuff defined in the `Tile` class).\n\nWe also should\
    \ add our tile width and height on our tile class as a static property, instead\
    \ of having it on our `TileCreator` object, since we won’t be using it anymore:\n\
    \n```javascript\nclass Tile\n{\n  static width=64;\n  static height=64;\n}\n```\n\
    \nNow, at the bottom of our program, we’re going to change how we generate tiles.\
    \ Delete all the tile generation code (everything related to tiles, starting at\
    \ `new TileImageCreator()` at the bottom of the program), and replace it with:\n\
    \n```javascript\nlet last_width=window.innerWidth;\nlet last_height=window.innerHeight;//existing\
    \ code\nlet asset_loader = new AssetLoader();\nasset_loader.AddImageToQueue(\"\
    dirt\", \"assets/imgs/dirt.jpg\");\nasset_loader.AddImageToQueue(\"stone\", \"\
    assets/imgs/stone.jpg\");\nasset_loader.AddImageToQueue(\"water\", \"assets/imgs/water.jpg\"\
    );\nasset_loader.AddImageToQueue(\"grass\", \"assets/imgs/grass.jpg\");\nasset_loader.AddImageToQueue(\"\
    bush\", \"assets/imgs/bush.jpg\");\nasset_loader.LoadImages(AllAssetsLoaded);\n\
    \nfunction AllAssetsLoaded()\n{\n  CreateTileMap();\n}\n```\n\nWe create a new\
    \ `AssetLoader`, and we queue up all of our images we want to load. Next, we actually\
    \ run the function to load the images, passing in our `callback` as `AllAssetsLoaded`,\
    \ which will get called after all the images have finished loading. Finally, it\
    \ will call a new function to generate the tiles `CreateTileMap`:\n\n```javascript\n\
    let last_width=window.innerWidth;\nlet last_height=window.innerHeight;\nlet tiles\
    \ = new Array();\nfunction CreateTileMap()\n{\n  let level = new Level();\n  let\
    \ num_tiles_x = Math.floor(last_width / Tile.width);\n  let num_tiles_y = Math.floor(last_height\
    \ / Tile.height);\n  for (let x = 0; x < num_tiles_x; x++)\n  {\n    for (let\
    \ y = 0; y < num_tiles_y; y++)\n    {\n      // tile generation logic\n    }\n\
    \  }\n}\n```\n*(Note: The provided text for `CreateTileMap` was fragmented in\
    \ the source; I have reconstructed the logic flow based on the context provided\
    \ in the snippet.)*\n"
