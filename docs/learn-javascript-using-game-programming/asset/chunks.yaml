- fmt: "\nWe also made it white, since our background is blue, and it's hard to see\
    \ if it is set to normal black. We made it as bold as possible by setting `font-weight`\
    \ to `900`- you can set it from `100` to `900`, increasing by `100` each time.\
    \ We set it to font size of `20px`, and made a `text-shadow` that is made up of\
    \ 4 different shadows- to the right by `2px`, and up by `2px`, then one to the\
    \ right `2px`, but down to `-2px`, and the other 2 sides- so there are 4 text\
    \ shadows surrounding the text on all corners. This makes a black \"stroke\"/\
    \ line around our white text, which will make it readable even on a white background.\
    \ That way, no matter what background we have, we should be able to read the FPS\
    \ text.\n\nLastly, since we don't want the FPS text blocking us from being able\
    \ to click on the part of the canvas it will cover, we set `pointer-events: none;`,\
    \ so it won't be clickable.\n\nNow let's actually connect this text to our JavaScript,\
    \ so it can output the actual FPS to the screen.\n\n## Connecting FPS text to\
    \ JavaScript\n\nWe were already seeing the actual FPS in the code, and in the\
    \ console, but not on the screen before, let's connect the two.\n\nBelow all your\
    \ functions, where we start declaring our variables outside the functions/ classes\
    \ (also known as \"global\" variables), add this new top line above the existing\
    \ `last_time_ms`:\n\n```javascript\nlet fps_txt_element = document.getElementById(\"\
    fps\");\nlet last_time_ms = 0;\n...\n```\n\nHere, we're getting an element on\
    \ the page with the id of `\"fps\"` (our fps text we created in the last section).\
    \ Next, we assign it to the variable name `fps_txt_element`, because we'll want\
    \ to use it every frame to update the current FPS.\n\nNext, we'll actually want\
    \ to update/ change the text out. In your `Update` function, add the following\
    \ line:\n\n```javascript\nfps_txt_element.innerHTML=Math.round(fps);\nconsole.log(\"\
    Update: delta time: \"+frame_delta_ms+\", fps: \"+fps);\n…\n```\n\nHere we're\
    \ just using the `fps_txt_element` variable we created above (which is the paragraph\
    \ tag with the id of `\"fps\"` on the html page), and we change out its `innerHTML`\
    \ (which we initially had set to `\"120\"`) with our `fps` variable we declared\
    \ right above. We'll also call `Math.round()` to round our `fps` to a whole number,\
    \ instead of a decimal, since it's harder to read with the decimal changing constantly.\n\
    \nIf you check out the page, you'll see our fps text updating in real-time, when\
    \ the frame updates!\n\nYou can check it changes by switching between the 2 below\
    \ lines in the `Update` function:\n\n```javascript\nsetTimeout(function(){window.requestAnimationFrame(Update)},\
    \ 100 );\n// window.requestAnimationFrame(Update);\n// setTimeout(function(){window.requestAnimationFrame(Update)},\
    \ 100 );\n\nwindow.requestAnimationFrame(Update);\n```\n\nThe first line artificially\
    \ delays the next call of the `Update` function by `100ms` (`0.1s`), which slows\
    \ it down to around `10fps`. The second is our actual update call, which should\
    \ run a lot faster than that (`60fps` on my screen).\n\nWhen you're finished,\
    \ comment out the first line, and keep the second, and we can move forward!\n\n\
    We now can see the FPS on screen, which is our first piece of UI. It will also\
    \ help us quickly see if we do something wrong, that severely brings down the\
    \ FPS on our system. We can also comment out the `console.log` logging out the\
    \ FPS and `deltatime` in `Update`, so we don't clog up our console (and leave\
    \ it clear to debug statements, warnings or errors).\n\n```javascript\n// console.log(\"\
    Update: delta time: \"+frame_delta_ms+\", fps: \"+fps);\n```\n\nLet's finally\
    \ make the game take up the full size, so it's not the default little `300x150`\
    \ canvas anymore.\n\n## Making the canvas take up the entire screen\n\nLet's modify\
    \ our canvas to actually take up the full screen.\n\nFirst remove the style attribute\
    \ with the border from your canvas tag:\n\n```html\n<canvas></canvas>\n```\n\n\
    Next modify your style tag to add canvas, and modify `game_container`:\n\n```css\n\
    canvas {\n    display: block;\n}\n\n#game_container {\n    position: relative;\n\
    }\n```\n\nOur canvas element by default is set to `\"inline\"`- meaning it allows\
    \ it to be placed in the middle of a sentence/ inside a line, and allows other\
    \ things to be placed on both sides. But we instead want it to be displayed like\
    \ a `\"block\"` have it not allow other stuff to be placed beside it, take up\
    \ the entire width, which will again make sure we don't get ugly scroll bars on\
    \ top of our game.\n\nWe also get rid of the code setting our `game_container`\
    \ to be `inline-block`- because otherwise we'll get scrollbars, and now the canvas\
    \ is going to be the full width and height of the page, so the FPS will be positioned\
    \ correctly.\n\nWe still have to set the canvas to be `100%` of the width of our\
    \ window and the height. If we use CSS, it scales up the canvas 100x100.\n\n##\
    \ Fixing issue with resizing screen\n\nIf you resizing your window, to make it\
    \ smaller, you'll see you get scroll bars. This is because we set the canvas size\
    \ to whatever the window is when we first load- so if the window then gets smaller,\
    \ the canvas will remain the original size.\n\nSo, we just have to detect when\
    \ the size changes, and resize the canvas at the same time.\n\nAbove where we\
    \ declare Timmy, add:\n\n```javascript\nlet last_width=window.innerWidth;\nlet\
    \ last_height=window.innerHeight;\n```\n\nWe'll store what the last/current width\
    \ and height of the window is, so that we can check if it changed in our update\
    \ function (that runs every frame).\n\nNext create a new function under the `Update`\
    \ function:\n\n```javascript\nfunction Resize() {\n    if(window.innerWidth !=\
    \ last_width || window.innerHeight != last_height) {\n        my_canvas.setAttribute('width',\
    \ window.innerWidth);\n        my_canvas.setAttribute('height', window.innerHeight);\n\
    \        last_width=window.innerWidth;\n        last_height=window.innerHeight;\n\
    \    }\n}\n```\n\nFirst we created a function like normal. But then we declare\
    \ an `if` statement. This lets you check if something is true, and to run the\
    \ code inside if it is.\n\nIF `window.innerWidth != last_width || window.innerHeight\
    \ != last_height`\n"
  raw: 'We also made it white, since our background is blue, and it''s hard to see
    if it is set to normal black. We made it as bold as possible by setting font-weight
    to 900- you can set it from 100 to 900, increasing by 100 each time. We set it
    to font size of 20px, and made a text-shadow that is made up of 4 different shadows-
    to the right by 2px, and up by 2px, then one to the right 2px, but down to -2px,
    and the other 2 sides- so there are 4 text shadows surrounding the text on all
    corners.  This makes a black "stroke"/ line around our white text, which will
    make it readable even on a white background. That way, no matter what background
    we have, we should be able to read the FPS text.


    Lastly, since we don''t want the FPS text blocking us from being able to click
    on the part of the canvas it will cover, we set "pointer-events: none;", so it
    won''t be clickable.


    Now let''s actually connect this text to our JavaScript, so it can output the
    actual FPS to the screen.


    ## Connecting FPS text to JavaScript


    We were already seeing the actual FPS in the code, and in the console, but not
    on the screen before, let''s connect the two.


    Below all your functions, where we start declaring our variables outside the functions/
    classes (also known as "global" variables), add this new top line above the existing
    “last_time_ms”:


    let fps_txt_element = document.getElementById("fps");


    let last_time_ms = 0; 


    ...


    Here, we''re getting an element on the page with the id of "fps" (our fps text
    we created in the last section). Next, we assign it to the variable name "fps_txt_element",
    because we''ll want to use it every frame to update the current FPS.


    Next, we''ll actually want to update/ change the text out. In your "Update" function,
    add the following line:


    fps_txt_element.innerHTML=Math.round(fps);


    console.log("Update: delta time: "+frame_delta_ms+", fps: "+fps);


    …


    Here we''re just using the fps_txt_element variable we created above (which is
    the paragraph tag with the id of "fps" on the html page), and we change out its
    innerHTML (which we initially had set to "120") with our fps variable we declared
    right above. We''ll also call "Math.round()" to round our fps to a whole number,
    instead of a decimal, since it''s harder to read with the decimal changing constantly.


    If you check out the page, you''ll see our fps text updating in real-time, when
    the frame updates!


    You can check it changes by switching between the 2 below lines in the “Update”
    function:


    setTimeout(function(){window.requestAnimationFrame(Update)}, 100 );


    // window.requestAnimationFrame(Update);


    // setTimeout(function(){window.requestAnimationFrame(Update)}, 100 );


    window.requestAnimationFrame(Update);


    The first line artificially delays the next call of the "Update" function by 100ms
    (0.1s), which slows it down to around 10fps. The second is our actual update call,
    which should run a lot faster than that (60fps on my screen).


    When you''re finished, comment out the first line, and keep the second, and we
    can move forward!


    We now can see the FPS on screen, which is our first piece of UI. It will also
    help us quickly see if we do something wrong, that severely brings down the FPS
    on our system. We can also comment out the console.log logging out the FPS and
    deltatime in “Update”, so we don''t clog up our console (and leave it clear to
    debug statements, warnings or errors).


    // console.log("Update: delta time: "+frame_delta_ms+", fps: "+fps);


    Let''s finally make the game take up the full size, so it''s not the default little
    300x150 canvas anymore.


    ## Making the canvas take up the entire screen


    Let''s modify our canvas to actually take up the full screen.


    First remove the style attribute with the border from your canvas tag:


    <canvas></canvas>


    Next modify your style tag to add canvas, and modify "game_container":


    canvas


    {


        display: block;


    }


    #game_container


    {


        position: relative;


    }


    Our canvas element by default is set to "inline"- meaning it allows it to be placed
    in the middle of a sentence/ inside a line, and allows other things to be placed
    on both sides. But we instead want it to be displayed like a "block"- have it
    not allow other stuff to be placed beside it, take up the entire width, which
    will again make sure we don''t get ugly scroll bars on top of our game.


    We also get rid of the code setting our "game_container" to be inline-block- because
    otherwise we''ll get scrollbars, and now the canvas is going to be the full width
    and height of the page, so the FPS will be positioned correctly.


    We still have to set the canvas to be 100% of the width of our window and the
    height. If we use CSS to do it, it just stretches out our canvas in an ugly way-
    scaling up everything we draw in it, without giving us more room to draw.


    That might be fine when we''re done with our game- to scale it up or down to any
    resolution, and have the game draw the same way. But we want to take advantage
    of the extra room we have, so we''re going to change the size of the canvas using
    the width and height attribute on the tag, not the width and height of the style/CSS.


    To do this, we''re going to add the following code above where we create our friends
    in our JavaScript:


    //change the width and height of the canvas to be the same size as the window


    my_canvas.setAttribute(''width'', window.innerWidth);


    my_canvas.setAttribute(''height'', window.innerHeight);


    let timmy = …


    This will just change the width and height attribute of the canvas tag (instead
    of the style width and height) to the inner height/width of the window (the height
    and width without scrollbars).


    What this does is actually change the resolution (how many pixels) the canvas
    "image" has, and allows us to draw more pixels in the canvas than we could before.


    By default, when you create a canvas tag without a width and height set, it creates
    what you can draw on with a 300 pixel width, and 150 height resolution. This is
    a good safe, small size, that you can see on any screen, but would be pretty blurry
    if you scaled it up on most screens (1080p standard screens are 1920 width x 1080
    height).


    If we had instead set it with CSS, it would scale up the 300x150 image, making
    it 10x blurrier on a 1080p screen. We would still only have a 300x150 area to
    draw in, so it wouldn''t help us out with what we''re trying to do.


    ## Fixing issue with resizing screen


    If you try resizing your window, to make it smaller, you''ll see that you get
    scroll bars. This is because we set the canvas size to whatever the window is
    when we first load up- so if the window then gets smaller, the canvas will just
    remain the original size, and be larger than the page.


    So, we just have to detect when the screen size changes, and resize the canvas
    at the same time.


    Above where we declare Timmy, add:


    let last_width=window.innerWidth;


    let last_height=window.innerHeight;


    We''ll store what the last/current width and height of the window/ page is, so
    that we can check if it changed in our update function (that runs every frame,
    where we can catch if the size has changed).


    Next create a new function under the Update function:


    function Resize()


    {


        if(window.innerWidth != last_width || window.innerHeight != last_height)


        {


            my_canvas.setAttribute(''width'', window.innerWidth);


            my_canvas.setAttribute(''height'', window.innerHeight);


            last_width=window.innerWidth;


            last_height=window.innerHeight;


        }


    }


    First, we created a function like normal. But then we declare an "if" statement.
    This lets you check if something is true, and to run the code inside if it is.


    We want to check to see when the window/page “innerwidth” is not equal to the
    value of the “innerwidth” we stored earlier.


    The characters "!=" mean "not equal". The characters "||" mean "OR". So, in plain
    English we are doing:


    IF window.innerWidth "IS NOT EQUAL TO" last_width "OR IF" window.innerHeight "IS
    NOT EQUAL TO" last_height)'
