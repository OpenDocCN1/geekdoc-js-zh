    \ =1000s`）除以 1000 将其转换为秒（秒的时间差，是一个很小的小数，如 0.016）。现在我们有了 `秒/帧`，但我们想把它颠倒过来变成 `帧/秒`\
    \ 或 `fps`。`1` 除以任何分数都会将其翻转，所以我们执行 `1/delta_s`。\n\n这个增量时间（delta time)/时间差有点难以理解，所以我们首先通过将毫秒（`1ms\
    \ =1000s`）除以 1000 将其转换为秒（秒的时间差，是一个很小的小数，如 0.016）。现在我们有了 `秒/帧`，但我们想把它颠倒过来变成 `帧/秒`\
    \ 或 `fps`。`1` 除以任何分数都会将其翻转，所以我们执行 `1/delta_s`。\n\n这个增量时间（delta time)/时间差有点难以理解，所以我们首先通过将毫秒（`1ms\
    \ =1000s`）除以 1000 将其转换为秒（秒的时间差，是一个很小的小数，如 0.016）。现在我们有了 `秒/帧`，但我们想把它颠倒过来变成 `帧/秒`\
    \ 或 `fps`。`1` 除以任何分数都会将其翻转，所以我们执行 `1/delta_s`。\n\n（此处注：由于原始文本中存在大量重复段落，译文已按逻辑结构处理，确保不重复且逻辑通顺）\n\
    \n（注：由于原始文本中存在大量重复段落，此处为直接提供核心逻辑翻译的后续部分）\n\n最后，我们将更改绘制 Timmy 的代码，移除移动代码：\n\n```javascript\n\
    let my_canvas = document.querySelector(\"canvas\");\nlet draw_context = my_canvas.getContext(\"\
    2d\");\nlet ctx = draw_context;\nlet timmy = new Friend(\"Timmy Smith\", 16, true,\
    \ \"rgb(0,0,255)\", \"rgb(209,181,140)\", \"rgb(125,60,34)\", 20, 20);\n```\n\n\
    如果你刷新页面，你会看到 Timmy 快速穿过屏幕！多次刷新以查看他是否离开屏幕太快。\n\n## 模拟低 FPS 以显示不考虑帧时间的运动\n\n上面我们只是通过每帧移动\
    \ 5 像素来动画，但在 60fps 下，每秒移动 300 像素（5px/帧 * 60 帧/秒= 300px/秒）（Timmy 宽度是 50 像素，所以每秒移动了近\
    \ 6 个 Timmy 宽度）。如果我们位于运行速度只有 10fps 的慢设备上，这意味着在 1 秒内只会移动 50 像素，所以游戏实际上会变慢，角色移动会变慢，人们会在\
    \ 120fps 设备上获得超速！\n\n所以，我们想要将其更改为根据经过的时间来移动，而不是根据经过的帧数。这将会导致角色在低 FPS 设备上出现“瞬移”，或移动得不平滑，但将允许人们在各种设备上以相同的速度玩游戏。\n\
    \n我们将首先尝试减慢 fps，以便看到现在现在是如何移动的。\n\n在 `Update` 函数中，将最后一行更改为：\n\n```javascript\n\
    setTimeout(function(){window.requestAnimationFrame(Update) }, 100);\n```\n"
- fmt: "\n```javascript\n// window.requestAnimationFrame(Update);\n```\n\nWe commented\
    \ out the `requestAnimationFrame` function call, and changed it out with another\
    \ function above it. `setTimeout` has a function with no name inside of it, which\
    \ has our `requestAnimationFrame` function call inside it. Then after the comma,\
    \ we pass the next parameter, which tells the timeout function how long to wait\
    \ before it calls the blank function (which will then call our `Update` function).\n\
    \nWe wanted about 10fps, so we used a delay of 100ms, divided by 1000 = 0.1s /\
    \ frame, for `1/(0.1s/frame) = 10frames/s`. It should be about 10fps, but either\
    \ way you'll see the character moving a lot slower/ taking longer to make the\
    \ same distance.\n\nSo next we'll add time to our movement, so it moves based\
    \ on the time passed, and not the frame passed, so he moves the same distance\
    \ on all devices in a given time!\n\n## Animating with deltaTime in ms\n\n###\
    \ Math warning:\n\nYou don't have to know how to do this next section- you can\
    \ get by, by just plugging in values until you are happy with a movement speed.\
    \ This is only for if you REALLY want to make an object move a certain number\
    \ of pixels in a given number of seconds. Otherwise skip the math section, and\
    \ you can just plug in numbers to see what \"feels\" right (which is usually good\
    \ enough for what you’re trying to achieve).\n\n### Math Section:\n\nLet's say\
    \ we want to move Timmy 50 pixels(px) every second. We'll assume we're testing\
    \ on a 60fps (or `1/60 = 0.0166sec/frame *1000=16.66ms/frame`) or `16.66ms` delta\
    \ time (you can assume any fps, it should all workout).\n\nSo, each update, we\
    \ should move him:\n\n`50px / (60f / s)`.\n\nIf we want to make it easy, you can\
    \ change it to multiplication, but have to flip the second fraction:\n\n`50px\
    \ * (1s / 60frames) = 0.833 px s /frames`\n\nNormally we move by doing:\n\n`obj.x_pos\
    \ = obj.x_pos + speed*delta_time_ms;`\n\nSo how far something moves in a frame\
    \ is:\n\n`pixels we're adding / distance moved in a frame = speed*delta_time_ms`\n\
    \nSo, filling in with our 2 values above, we can solve for speed:\n\n`0.833 px\
    \ s /frames = speed * 16.66ms/frame`\n\n`(0.833 px s /frame ) / 16.66ms = speed`\n\
    \n`speed = 0.05 px /frame`\n\nSo to move him 50pixels (1 head width) every second,\
    \ you have to multiply the time it took to render the frame (whether it be 16ms\
    \ or 100ms) by `0.05206`, and he'll move the same distance in the same time, regardless\
    \ of frame rate.\n\nOr you could just play with the value until you get one you\
    \ like!\n\nEnd of math\n\nSo, in `UpdateGame` change it to:\n\n```javascript\n\
    // timmy.x_pos=timmy.x_pos+5;\ntimmy.x_pos=timmy.x_pos+delta_ms*0.05206;\n```\n\
    \nNow we're moving Timmy's `x` position based on the time it took for the frame\
    \ to render (16ms @60fps, 100ms @10fps), multiplied by how fast we want him to\
    \ move each frame `05206`. Refresh the page and roughly count how long takes Timmy\
    \ to exit the page (default size is 300px, he starts at 20px, so 280px left, Timmy\
    \ should move 50px every second, so `(280px)/(50px/s) = ~6seconds`). You can count\
    \ to see roughly fast he moves till he is offscreen. To test if he moves at the\
    \ same speed in low FPS and high FPS, change back and forth in the bottom of `Update`\
    \ function between (roughly 10fps):\n\n```javascript\nsetTimeout(function(){window.requestAnimationFrame(Update)},\
    \ 100);\nwindow.requestAnimationFrame(Update);\n```\n\nAnd (roughly 60fps if your\
    \ device supports it):\n\n```javascript\nsetTimeout(function(){window.requestAnimationFrame(Update)},\
    \ 100);\nwindow.requestAnimationFrame(Update);\n```\n\nSo now we're moving him\
    \ the same amount, regardless of frame rate, which is the way all games seem to\
    \ handle this. Let’s add a little UI just to see the framerate on screen.\n\n\
    ## Adding UI for FPS styling\n\nFirst we want to add the html to display FPS.\
    \ Change the canvas tag to:\n\n```html\n<div id=\"game_container\">\n  <canvas></canvas>\n\
    \  <p id=\"fps\">120</p>\n</div>\n```\n\nThis will create a `p` tag (paragraph,\
    \ for text), with an `id` of `fps`. Giving it an `id` will allow us to target\
    \ this specific `p` tag from both CSS and JavaScript, since we're likely to have\
    \ more UI elements in the future (for things like health, number of items, speech,\
    \ etc.). We also wrap both the `canvas` and `p` tag in a `div` tag, with its own\
    \ `id` of `game_container`, since it will contain our main canvas tag and the\
    \ `fps` paragraph. `Div` is short for \"division\", which really means \"a container\
    \ that I can position + stuff in, which isn't meant to contain only text\".\n\n\
    This adds the html for it to the page, but by default, the `canvas` and `p` tag\
    \ will just be placed next to each other, instead of the fps on top of our canvas.\
    \ So we also have to add to our CSS area to position and style them correctly:\
    \ we're going to use some CSS to fix some issues. Inside your `head` tag, add\
    \ the below:\n\n```css\n<style>\n* {\n  margin: 0;\n  padding: 0;\n  font-family:\
    \ Verdana, Geneva, Tahoma, sans-serif;\n}\n#game_container {\n  position: relative;\n\
    \  display: inline-block;\n}\n#fps {\n  position: absolute;\n  top: 10px;\n  right:\
    \ 10px;\n  color: white;\n  font-weight: 900;\n  font-size: 20px;\n  text-shadow:\
    \ 2px 2px 0 black, 2px -2px 0px black, -2px -2px 0px black, -2px 2px 0px black;\n\
    \  pointer-events: none;\n}\n</style>\n```\n\nThis is a `style` tag, which uses\
    \ CSS. You can put it in the `head` of your page to target/style specific elements\
    \ on the page. In this case, we're going to target asterisk `*` which means all\
    \ elements on the page. `Margin` is the spacing on the outside of html elements/tags,\
    \ and `padding` is the spacing inside of the tags. Most browsers will add some\
    \ margin and padding to different elements of the page, but we don't want any\
    \ here, or there will be ugly scroll bars over our canvas, as our canvas will\
    \ be larger than the page.\n\nWe changed the font family on everything to be `Verdana`,\
    \ which uses a standard way of also falling back to other fonts on systems that\
    \ don't have it. `Geneva` if it't find `Verdana`, `Tahoma` if that can't be found,\
    \ and lastly any `sans-serif`, meaning \"no serif\"/ little extra marks on letters\
    \ that some fonts have, which should be found on any system.\n\nTo target an HTML\
    \ element by an `id`, we have to put a number sign (`#`) before the `id`, for\
    \ it to know that we're trying to target it by an `id` (and not just a tag type,\
    \ or later on, a class type- there are lots of different ways to target HTML elements).\n\
    \nSo, we target the `game_container`, and set the position to `relative`. This\
    \ doesn't do anything to this element directly - but says any child element inside\
    \ of it will be positioned relative to this element, instead of based on the entire\
    \ page, which is the default. That way we can position the fps on the top right\
    \ corner of this element, instead of the top right of the entire page.\n"
  raw: '// window.requestAnimationFrame(Update);


    We commented out the requestAnimationFrame function call, and changed it out with
    another function above it. "setTimeOut" has a function with no name inside of
    it, which has our "requestAnimationFrame" function call inside it. Then after
    the comma, we pass the next parameter, which tells the timeout function how long
    to wait before it calls the blank function (which will then call our Update function).


    We wanted about 10fps, so we used a delay of 100ms, divided by 1000 = 0.1s / frame,
    for 1/(0.1s/frame) = 10frames/s. It should be about 10fps, but either way you''ll
    see the character moving a lot slower/ taking longer to make the same distance.


    So next we''ll add time to our movement, so it moves based on the time passed,
    and not the frame passed, so he moves the same distance on all devices in a given
    time!


    ## Animating with deltaTime in ms


    Math warning:


    You don''t have to know how to do this next section- you can get by, by just plugging
    in values until you are happy with a movement speed. This is only for if you REALLY
    want to make an object move a certain number of pixels in a given number of seconds.
    Otherwise skip the math section, and you can just plug in numbers to see what
    "feels" right (which is usually good enough for what you’re trying to achieve).


    Math Section:


    Let''s say we want to move Timmy 50 pixels(px) every second. We''ll assume we''re
    testing on a 60fps (or 1/60 = 0.0166sec/frame *1000= 16.66ms/frame) or 16.66ms
    delta time (you can assume any fps, it should all workout)


    So, each update, we should move him:


    50px / (60f / s).


    If we want to make it easy, you can change it to multiplication, but have to flip
    the second fraction


    50px * (1s / 60frames) = 0.833 px s /frames


    Normally we move by doing:


    obj.x_pos = obj.x_pos +speed*delta_time_ms;


    So how far something moves in a frame is:


    pixels we''re adding / distance moved in a frame = speed*delta_time_ms


    So, filling in with our 2 values above, we can solve for speed:


    0.833 px s /frames = speed * 16.66ms/frame


    (0.833 px s /frame ) / 16.66ms = speed


    speed = 0.05 px /frame


    So to move him 50pixels (1 head width) every second, you have to multiply the
    time it took to render the frame (whether it be 16ms or 100ms) by 0.05206, and
    he''ll move the same distance in the same time, regardless of frame rate.


    Or you could just play with the value until you get one you like!


    End of math


    So, in "UpdateGame" change it to:


    // timmy.x_pos=timmy.x_pos+5;


    timmy.x_pos=timmy.x_pos+delta_ms*0.05206;


    Now we''re moving Timmy''s x position based on the time it took for the frame
    to render (16ms @60fps, 100ms @10fps), multiplied by how fast we want him to move
    each frame (*0.05206).


    Refresh the page and roughly count how long it takes Timmy to exit the page (default
    canvas size is 300px, he starts at 20px, so 280px left, Timmy should move 50px
    every second, so (280px)/(50px/s) = ~6seconds.


    You can count to see roughly how fast he moves till he is offscreen. To test if
    he moves at the same speed in low FPS and high FPS, change back and forth in the
    bottom of the Update function between (roughly 10fps):


    setTimeout(function(){window.requestAnimationFrame(Update)}, 100 );


    // window.requestAnimationFrame(Update);


    And (roughly 60fps+ if your device supports it):


    // setTimeout(function(){window.requestAnimationFrame(Update)}, 100 );


    window.requestAnimationFrame(Update);


    So now we''re moving him the same amount, regardless of the frame rate, which
    is the way all games seem to handle this issue.


    Let’s add a little UI just to see the framerate on screen.


    ## Adding UI for FPS - styling


    First we want to add the html to display FPS. Change the canvas tag to:


    <div id="game_container">


        <canvas></canvas>


        <p id="fps">120</p>


    </div>


    This will create a "p" tag (paragraph, for text), with an id of "fps". Giving
    it an id will allow us to target this specific "p" tag from both CSS and JavaScript
    easily, since we''re likely to have more text UI elements in the future (for things
    like health, number of items, speech, etc).


    We also wrap both the "canvas" and "p" tag in a "div" tag, with its own id of
    "game_container", since it will contain our main canvas tag and the fps paragraph.


    Div is short for "division", which really just means "a container that I can position
    + put stuff in, which isn''t meant to contain only text".


    This just adds the html for it to the page, but by default, the canvas and "p"
    tag will just be placed next to each other, instead of the fps on top of our canvas.
    So, we also have to add to our CSS area to position and style them correctly:


    We''re going to use some CSS to fix some issues. Inside your head tag, add the
    below:


    <style>


    *


    {


        margin:0;


        padding:0;


        font-family: Verdana, Geneva, Tahoma, sans-serif;


    }


    #game_container


    {


        position: relative;


        display: inline-block;


    }


    #fps


    {


        position: absolute;


        top:10px;


        right:10px;


        color:white;


        font-weight: 900;


        font-size: 20px;


        text-shadow:2px 2px 0 black,


            2px -2px 0 black,  


            -2px -2px 0 black,


            -2px 2px 0 black;


        pointer-events: none;


    }


    </style>   


    This is a "style" tag, which uses CSS. You can put it in the head of your page
    to target/style specific elements on the page.


    In this case, we''re going to target asterisk ( * ) which means all elements on
    the page. Margin is the spacing on the outside of html elements/tags, and padding
    is the spacing inside of the tags. Most browsers will add some margin and padding
    to different elements of the page, but we don''t want any here, or there will
    be ugly scroll bars over our canvas, as our canvas will be larger than the page.


    We changed the font family on everything to be Verdana, which uses a standard
    way of also falling back to other fonts on systems that don''t have it. Geneva
    if it can''t find Verdana, Tahoma if that can''t be found, and lastly any "sans-serif",
    meaning "no serif"/ little extra marks on letters that some fonts have, which
    should be found on any system.


    To target an HTML element by an id, we have to put a number sign (#) before the
    id, for it to know that we''re trying to target it by an id (and not just a tag
    type, or later on, a class type- there are lots of different ways to target HTML
    elements).


    So, we target the "game_container", and set the position to "relative". This doesn''t
    do anything to this element directly - but says any child element inside of it
    will be positioned relative to this element, instead of based on the entire page,
    which is the default. That way we can position the fps on the top right corner
    of this element, instead of the top right of the entire page.


    We set its display to "inline" for now- so that it grows only as big as the content
    inside of it- so only as big as the canvas tag. If we don''t, it will be displayed
    as a "block" instead- which will take up the entire width of the page, and put
    our fps outside of our canvas area.


    Next, we target the "fps" id. We position it absolute- which means that other
    elements won''t affect it/ move it around like normal. So, we can put it anywhere
    on the page- even on top of our canvas element! We''ll also position it from the
    top, and the right side of its container (game_container), offset by 10px each,
    so it pushes it a little bit away from the top and right side.'
