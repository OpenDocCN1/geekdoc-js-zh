    \    SayHi()\n        {\n            console.log(\"Hi, my name is \"+this.name+\"\
    , my age is: \"+this.age+\", and do I love spinach? \"+this.loves_spinach+\".\"\
    );\n        }\n    }\n    let my_new_friend = new Friend(\"Steve Gutenberg\",\
