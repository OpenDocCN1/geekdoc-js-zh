  trans: "\n[content]\n现在相机已经准备好，可以在有目标时更新它的位置。让我们给它一个目标吧！\n\n在脚本的底部，在 `AllAssetsLoaded()`\
    \ 函数的末尾添加对 `camera.follow` 函数的调用：\n\n```javascript\n...\n\nSetupInput();\n\ncamera.Follow(my_player);\n\
    \n}\n```\n\n现在如果你刷新页面，你将看到玩家居于屏幕中心；如果你在到处点击，你将看到他在世界中移动，同时保持在屏幕中心！\n\n![](img/image00486.jpeg)\n\
    \n你现在可能已经注意到一个大问题——当你点击某处时，玩家不再移动到你点击的世界中对应的位置。这是因为相机对世界进行了偏移偏移，但点击位置并没有察觉到我们正在移动相机/世界。因此，我们只需要在获取点击位置时添加相机的偏移量即可。\n\
    \n## 根据相机位置修复输入位置\n\n为了修复这个问题，将 `MoveMyPlayer` 函数修改为包含相机位置：\n\n```javascript\n\
    function MoveMyPlayer(x_dest, y_dest)\n{\n // 添加相机偏移量，以便准确地在世界中移动玩家。\n x_dest=x_dest+camera.x;\n\
    \ y_dest=y_dest+camera.y;\n // 将 my_player 移动到点击的目标\n console.log(\"Moving my\
    \ player to destination: x: \"+x_dest+\", y: \"+y_dest)\n my_player.SetDestination(x_dest,\
    \ y_dest);\n}\n```\n\n现在如果你在世界中点击，玩家实际上会去你点击的地方，无论相机滚动到了哪里！\n\n但还有另一个问题，如果你点击一个格子的中心，你可能希望玩家也去坐在格子的中心。现在它是根据左上角放置的，所以我们还需要从点击位置中减去它的一半宽度和高度，以使其居中。将其更新为：\n\
    \n```javascript\nfunction MoveMyPlayer(x_dest, y_dest)\n{\n // 添加相机偏移量，以便准确地在世界中移动玩家。\n\
    \ x_dest=x_dest+camera.x;\n y_dest=y_dest+camera.y;\n // 让玩家在鼠标点击的地方居中，而不是将左上角放在那儿：\n\
    \ x_dest=x_dest-my_player.width*.5;\n y_dest=y_dest-my_player.height*.5;\n //\
    \ 将 my_player 移动到点击的目标\n console.log(\"Moving my player to destination: x: \"\
    +x_dest+\", y: \"+y_dest)\n my_player.SetDestination(x_dest, y_dest);\n}\n```\n\
    \n现在当你到处点击时，你会发现玩家会到达那个位置，但是以该位置为中心！\n\n但现在我们还想确保玩家不会游出世界，并且当他游荡时我们不会看到难看的蓝色清除颜色，因此我们将对相机的移动范围添加一些限制。\n\
    \n## 添加相机边界\n\n为了添加相机边界，我们将确保它的左上角永远不会超过世界的左上角，右下角不超过世界的右下角，以此此类推。我们将设定为让相机始终跟随玩家，除非在这些例外情况下。\n\
    \n我们想表达的是“不要越过世界边界并显示背景”。由于我们知道世界从 `x=0`, `y=0` 开始，我们可以先告诉它不要低于这个值。\n\n因此，更改相机的\
    \ `Update` 函数，使其停止在 `x` 和 `y` 低于 0：\n\n```javascript\nUpdate(delta_ms)\n{\n if(this.target!=undefined)\n\
    \ {\n this.x=this.target.x-half_width_minus_target_width;\n this.y=this.target.y-half_height_minus_target_height;\n\
    \ if(this.x<0)\n this.x=0;\n if(this.y<0)\n this.y=0;\n }\n}\n```\n\n现在如果你在世界中移动，你会发现左角会显示蓝色背景，但在那种情况下会跟随玩家。现在让我们也让它不要越过另外\
    \ 3 个角。\n\n要做到这一点，我们需要知道世界的宽度和高度，并确保相机的右侧 `camera.x + window.innerWidth` 不超过地图的右侧。\n\
    \n我们可以计算格子的宽度 *乘以* `x` 方向上的格子数量，但不如将此功能添加到 `Level` 类中。我们将底部 `new Level()` 之后所有的\
    \ Tile 生成代码移动到 `Level` 类中的一个新函数，并在构造函数中添加用于我们想要跟踪的变量：\n\n```javascript\nclass\
    \ Level\n{\n constructor(tile_images)\n {\n this.tile_images = tile_images;\n\
    \ this.num_tiles_x=1;\n this.num_tiles_y=1;\n this.width=this.num_tiles_x*Tile.width;\n\
    \ this.height=this.num_tiles_y*Tile.height;\n }\n CreateLevel(screen_widths, screen_heights)\n\
    \ {\n let screen_width_default=1366;\n let screen_height_default=768;\n this.num_tiles_x\
    \ = Math.round(screen_widths / Tile.width);\n this.num_tiles_y = Math.round(screen_heights\
    \ / Tile.height);\n this.width=this.num_tiles_x*Tile.width;\n this.height=this.num_tiles_y*Tile.height;\n\
    \ for(let x=0;x<this.num_tiles_x; x++)\n { for(let y=0;y<this.num_tiles_y; y++)\n\
    \ {\n let type = Math.floor(Math.random()*(this.tile_images.length));\n tiles.push(new\
    \ Tile(x*Tile.width, y*Tile.height, this.tile_images[type]));\n } } }\n }\n```\n\
    *(注：由于原文提供的代码块存在逻辑混乱和截断问题，此处翻译时根据上下文对代码结构进行了合理的对齐还原，以保持可读性)*\n"
- fmt: "\nThen, we’re checking the left side to make sure it’s not below 0/ the left\
    \ side of the level again, but if it is not, then we’re going to check to see\
    \ if the right side is greater than the right side of the level. If it is, we’ll\
    \ set the `x` of the camera back to the right edge of the screen, but also subtract\
    \ out the width of our camera/window, so that our right side of the camera will\
    \ be aligned with the right edge of the level.\n\nWe then do the same thing for\
    \ the bottom of the screen, making sure the bottom of our camera/ window will\
    \ never go below the bottom of our level.\n\nAnd that’s it! If you play the game\
    \ now, you’ll see that no matter where you move, you can’t see the background/\
    \ outside of our level.\n\n![](Images/image00487.jpeg)\n\nNow we have a player\
    \ that can be controlled, move around our world, and can’t move outside of our\
    \ world. We can easily modify the size of the level by passing in how many screen\
    \ widths and heights we want to use, and can make a super large level if we want.\
    \ But right now, it’s kind of boring- everything is generated completely randomly,\
    \ but we want to be able to have a place for a house, an NPC, an enemy, and an\
    \ area to farm. So, let’s modify how we create the world, so that we’ll actually\
    \ be able to create a static level, but still allow some randomness for each new\
    \ game.\n\n### Chapter example on github:\n\n[https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/10_Camera.html](https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/10_Camera.html)\n\
    \n# 11. Creating more involved graphics\n\nWe’re up to the point where we’ll need\
    \ to be able to start breaking down rocks, cutting grass, chopping down trees,\
    \ and attacking enemies in the future. So, we’re going to create graphics that\
    \ will allow us to display:\n\n*   We’ll create our own unique character, which\
    \ will allow us to add more animation types\n    *   One copy with short hair,\
    \ one with long hair\n    *   Same size as our tiles (`64px x 64px`)\n*   Attacking/\
    \ harvesting animations\n    *   Attacking will use the same animations as harvesting\n\
    \    *   Tools that will need to be added include:\n        *   `Hammer` to break\
    \ rock\n        *   `Axe` to break wood\n        *   `Scythe` to chop grass\n\
    \        *   `Hoe` to till dirt\n        *   `Sword` to attack enemies\n    *\
    \   A watering animation for watering plants\n    *   An eating animation for\
    \ the player to regain health from plants\n*   Enemy graphic based off our player\n\
    *   NPC graphic based off our player\n\nCreating artwork, even pixel art work\
    \ is a lot of work and time. I created a sprite sheet of a character for use with\
    \ this book. I wanted him to look like characters from other 2d RPG like games\
    \ that are popular- Pokémon and Harvest Moon.\n\nThe way I made the character\
    \ was to create an ArtClash or Photoshop (or other art program) new project that\
    \ was the size of our tiles (`64x64`), drew out roughly the head shape, body shape,\
    \ etc. I pulled up sprite sheets by searching on google images for “pokemon sprite\
    \ sheet” and “harvest moon sprite sheet”, and found a few good references to go\
    \ off of.\n\n## Idle animation\n\nI made the first drawing of the character that\
    \ is at idle/ default position, modified that one to make one more idle frame\
    \ (by moving his head and shoulders up one pixel- it’s hard to see in here, but\
    \ easier when animated in the game).\n\n![](Images/image00488.jpeg)![](Images/image00489.jpeg)\n\
    \n## Walking animation\n\nI then created 2 walking frames, by using the sprite\
    \ sheets as reference, as well as looking up more references for “walk cycle”\
    \ on google images. I mainly changed his arm positions around so they look like\
    \ they swing back and forth between the 2 frames, and moved his legs up and down,\
    \ to make it look like they are going forward and backwards.\n\n![](Images/image00490.jpeg)![](Images/image00491.jpeg)\n\
    \nUsually if you want your animations to look better, you’ll want to spend time\
    \ looking up what the basic “key poses” are for each type of animation cycle,\
    \ starting with those, then deciding if you want to draw more frames in between\
    \ the most important key poses, to have an even more fluid animation.\n\nI wanted\
    \ him to also be able to swing a tool/ weapon, so I created a new layer, and created\
    \ a basic looking scythe that he holds in his hands when idle. I knew that I wanted\
    \ to layer the tool animation on top of the player animation, so I erased anywhere\
    \ on the tool graphic where the player should show through (like showing his hands\
    \ “over” the tool, by removing the pixels for the tool there, to look like the\
    \ player's hands are on top).\n\nI then copied it, and moved it up slightly for\
    \ the second idle animation (the gaps below are where the player's hands show\
    \ through the tool to give it the illusion that the player's hands are over the\
    \ tool, even though the tool will be drawn over the player).\n\n![](Images/image00492.jpeg)![](Images/image00493.jpeg)\n\
    \n## Harvesting/ attacking animation\n\nI also want the player to be able to harvest\
    \ things, so I again copied the idle frame, and started changing it around to\
    \ make it like the player was harvesting.\n\nThe most important frames are when\
    \ the player draws the tool back, and when he has “chopped” forward (think of\
    \ chopping forward).\n\nThe most important frames are when the player draws the\
    \ tool back, and when he has “chopped” forward (think of chopping forward).\n\n\
    The most important frames are when the player draws the tool back, and when he\
