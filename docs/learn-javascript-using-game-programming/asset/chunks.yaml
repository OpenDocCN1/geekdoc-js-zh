    \ 函数，用于检查是否设置了 x 或 y 目标，并根据目标的位置让它移动。我们基本上只是将在 x 方向移动的移动代码复制了一份，用于在 y 方向移动的移动。\n\
    \n首先，我们检查它是否正在向 `x_dir` 移动：`if(this.moving_x)`。如果是，我们将研究如何移动它；之后，我们会检查它在 y 方向上是否设置了目标。\n\
    \n但假设它正在向 x 方向移动，我们将检查 `x_dest` 是否大于当前位置 `if(this.x_dest>this.x_pos)`，这意味着我们的\
    \ x 目标在右侧，因此我们需要给当前位置增加一些值，以让它向右移动 `this.x_pos+=this.move_speed*delta_ms;`。\n\n\
    相反，如果 `x_dest` 在左侧，它将小于当前的 `x_pos`（`else //x_dest < x_pos - 所以需要向左移动/ -x`），我们将执行相同的操作，但根据速度进行减法\
    \ `this.x_pos -= this.move_speed*delta_ms;`。\n\n这样我们就可以让他向右或向左移动，我们还会检查它是否需要向上或向下移动，并以相同的方式移动它，只是将\
    \ x 替换为 y，其他操作完全相同。\n\n最后，我们需要修改 `UpdateGame` 代码，不再让我们的朋友自动移动，而是在他确实获得了要移动的目标时对其进行更新。\n\
