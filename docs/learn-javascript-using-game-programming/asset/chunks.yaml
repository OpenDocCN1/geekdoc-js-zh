    \n            {\n\n                x=0;\n\n                y+=height_frame;\n\n\
                }\n\n        }\n\n    }\n\n} //end of class FlipBookAnimation\n\n\
    First, we pass in everything that we’ll need to figure out where our frames will\
    \ be, and what we need to be able to draw a frame out.\n\nWe pass in the sprite\
    \ sheet image, the width and height of each frame, the start column and row of\
    \ the animation we’re looking for, and how many frames long the animation goes\
    \ for. We also pass in what we’ll scale the original frame size to when we draw\
    \ the frames out on screen; in case the sprite sheet uses smaller/ larger sprites\
    \ than we want to use in our game. Lastly, we pass in the delay we want between\
    \ changing frames, so we can slow down animations by increasing the delay, or\
    \ speed them up by decreasing the delay.\n\nWe assign all the variables passed\
    \ in to the object’s variables (“this” to assign it to the current object). We\
    \ figure out the width and height of what we’ll draw to screen (scale * frame\
    \ width and height).\n\nWe set the timer to 0, which will be used to count how\
    \ long the total time has been between each frame change. We set the current frame\
    \ to be 0/ the first one.\n\nWe’re going to have x and y offsets to position the\
    \ animation differently, depending on the dimensions of the parent. For instance,\
    \ if the parent/player is less wide than the animation (which is the case for\
    \ the animations), we’ll want to center the animations so it looks more correct.\n\
    \nWe also assume the user will give us the column and row the animation is in\
    \ starting at “the first column/ row” / 1, instead of “the 0 column or row”, so\
    \ we have to minus 1 to change it to start with 0, since that is the way they’ll\
    \ be taken out of the main image (the left top is 0,0, the next frame would be\
    \ 0+width, next 0+width*2, etc.).\n\nNext, we’re going to start grabbing the frame\
    \ positions out of the overall image. We set the start row and column to be whichever\
    \ one they gave us (but starting at 0), and multiply it by the width and height\
    \ of each frame to go to the correct starting position for the frame in the image.\n\
    \nNow, we check “while” we haven’t gotten all the frames yet (the length of our\
    \ frames array is less than the number of frames we’re looking for), we’ll keep\
    \ grabbing more frames. We’ll push in the current frame position (the start position\
    \ initially), and then move one frame to the right (by adding in the width of\
    \ the frame). If the current position + the width of the frame is greater than\
    \ the full image width, we’ve gone too far over to the right side/ off the image,\
    \ so we need to reset x back to 0, so it will be on the left side of the image,\
    \ and increase y by one frame height, to go onto the next row.\n\nWe then repeat\
    \ this until we have all of our frames!\n\nWe also need to add a function into\
    \ this class to be able to draw out our animation. So, add this function to the\
    \ “FlipBookAnimation” class:\n\nDraw(ctx, delta_ms, x, y, flip_x)\n\n{\n\n //if\
    \ flipped, have to save, then flip the entire canvas, draw, then restore the original\
    \ canvas drawing\n\n if(!flip_x)\n\n    {\n\n debug_boxes.DrawDebugBox(ctx, x+this.offset_x,\
    \ y+this.offset_y, this.width_drawn, this.height_drawn, 2, \"#0000ff\");\n\n ctx.drawImage(this.image,\n\
    \n this.frames[this.frame].x, this.frames[this.frame].y,\n\n this.width_frame,\
    \ this.height_frame,\n\n x+this.offset_x+this.offset_x_extra, y+this.offset_y+this.offset_y_extra,\n\
    \n this.width_drawn, this.height_drawn);\n\n    }\n\n else\n\n    {\n\n ctx.save();\n\
    \n ctx.scale(-1, 1);\n\n debug_boxes.DrawDebugBox(ctx, -x-(this.width_drawn+this.offset_x),\
    \ y, this.width_drawn, this.height_drawn, 2, \"#0000ff\");\n\n ctx.drawImage(this.image,\n\
    \n this.frames[this.frame].x, this.frames[this.frame].y,\n\n this.width_frame,\
    \ this.height_frame,\n\n                    -(x+this.offset_x-this.offset_x_extra+this.width_drawn),\
    \ y+this.offset_y+this.offset_y_extra,\n\n this.width_drawn, this.height_drawn);\n\
    \n ctx.restore();\n\n    }\n\n this.timer+=delta_ms;\n\n if(this.timer>this.delay_ms)\n\
    \n    {\n\n this.timer=0;\n\n this.frame++;\n\n if(this.frame==this.num_frames)//the\
    \ maximum frame should be 1 less than the number of frames, since frames start\
    \ at 0\n\n this.frame=0;\n\n    }        \n\n}\n\nThe “Draw” function takes in\
    \ the canvas context, the delta_ms/ how much time has passed since the last frame\
    \ in ms, and the x and y position to draw the animation at, as well as if we want\
    \ to try “flipping” the animation. By default, they drew out all the animations\
    \ facing right, but we can flip them to face left instead. We’ll check to draw\
    \ the “not flipped”/ “!flipped” version first, since that’s more straightforward.\n\
    \nWe’ll add a new class later on to draw debug boxes (boxes that let us see where\
    \ our player, or the animation are being rendered). But we’ll call the drawing\
    \ function now, passing in the context, the x position we’re drawing to + whatever\
    \ offset we are drawing the animation off (to center it inside our player object),\
    \ the same thing with the y position, the width and height of the animation being\
    \ drawn, how big we want the borders of our box, and the color we want the box\
    \ to be drawn.\n\nNext, we actually call the drawing function, passing in the\
    \ overall image, the x and y position of the current frame, the width and height\
    \ of the frame, the x and y position on screen to draw it at, and finally, the\
    \ width and height to draw the frame on screen.\n\nTo flip the image, it’s more\
    \ difficult than a lot of other interfaces/ game engines. Normally we just draw\
    \ it with a negative width, which flips it, then have to move it to the right\
    \ by its width, to make up for drawing it in a negative direction.\n\nBut for\
    \ drawing with the canvas, we need to save the current state, scale the canvas\
    \ in the negative direction (-1 or 100% negative in the x direction), then we\
    \ can draw with everything backwards. The only thing that changes what we draw\
    \ when flipped is we have to draw the x position negative, and minus out the width\
    \ to have it drawn in the same spot as when facing right. Lastly, we restore the\
    \ canvas, to unflip it/ scale it back to 1 in the x direction."
