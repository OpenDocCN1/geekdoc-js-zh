    \n    tile_ctx.arc(this.width_tile*.5, this.height_tile*.5, this.width_tile*.5, 0, 2 * Math.PI);\n\
    \n    tile_ctx.fill();\n\n    tile_ctx.fillStyle = dark_grey;\n\n    tile_ctx.beginPath();\n\
    \n    tile_ctx.arc(this.width_tile*.3, this.height_tile*.45, this.width_tile*.2, 0, 2 * Math.PI);\n\
    \n    tile_ctx.arc(this.width_tile*.5, this.height_tile*.4, this.width_tile*.3, 0, 2 * Math.PI);\n\
    \n    tile_ctx.fill();\n\n    tile_ctx.fillStyle = light_grey;\n\n    tile_ctx.beginPath();\n\
    \n    tile_ctx.arc(this.width_tile*.3, this.height_tile*.3, this.width_tile*.1, 0, 2 * Math.PI);\n\
    \n    tile_ctx.fill();\n\n    this.stone_tile.src = tile_canvas.toDataURL(\"image/png\"\
    );\n\n}\n\nThe major difference is we’re using canvas’s “arc” function to be able\
    \ to draw circles. The format for it is the x position, y position, radius (half\
    \ the circle width), starting angle, and ending angle (both in “radians”, not\
    \ degrees).\n\nWe draw it at half the width and height for x and y, which puts\
    \ it right in the center of our tile. We also make the radius half the width and\
    \ height, which makes it have the full width of our tile size (radius is half\
    \ the total width/ diameter of a circle). We start at angle 0 (which points to\
    \ the right side of our tile), all the way to Math.PI (which goes around the entire\
    \ circle, and comes back to 0, drawing a full circle).\n\nWe then create some\
    \ extra circles, with different colors of grey below, to add some details.\n\n\
    If you run this now, you’ll see the rock being drawn on the dirt tile, but it\
    \ looks a little bit like an eyeball with the perfect circle. ![](Images/image00478.jpeg)\n\
    \nSo, we’re going to change it to use custom curves, to get a more “rock like”\
    \ shape to it. Bezier curves are curves that let you create more custom shapes,\
    \ and are one of the main ways of drawing using vector programs like Adobe Illustrator\
    \ or Inkscape.\n\nYou can even “save as” your vector art from Inkscape, and save\
    \ it as “HTML5 canvas”, so that you can actually work with an art program, instead\
    \ of having to guess and test manually using each command. Just create your vector\
    \ art in Inkscape, save it as an html canvas, open the html file up with a text\
    \ editor/ visual code, and copy the drawing code into your program.\n\nI created\
    \ this using Inkscape, setting the document properties (file->document properties)\
    \ to 64x64 width and height, scale to 1.0.\n\nThen I created a roughly rock shape:\n\
    \nCreateStoneTileImage(tile_canvas, tile_ctx)\n\n{\n\n    //format for arc(angles in \"\
    radians\"/ Math.PI):  arc(x, y, radius, startAngle, endAngle)\n\n    let ctx = tile_ctx;\n\
    \n    ctx.beginPath();\n\n    ctx.fillStyle = 'rgb(125, 125, 125)';\n\n    ctx.strokeStyle = 'rgb(0, 0, 0)';\n\
    \n    ctx.lineWidth = 2.000000;\n\n    ctx.lineCap = 'butt';\n\n    ctx.lineJoin = 'miter';\n\
    \n    ctx.moveTo(0.430373, 53.826145);\n\n    ctx.bezierCurveTo(2.211780, 43.734546, 10.769525, 1.063608, 31.308098, 0.400035);\n\
    \n    ctx.bezierCurveTo(46.271642, -0.083416, 62.638869, 44.648782, 63.729706, 51.926548);\n\
    \n    ctx.bezierCurveTo(65.826382, 65.915002, 43.669500, 63.520649, 30.595534, 63.324116);\n\
    \n    ctx.bezierCurveTo(17.638494, 63.129345, 0.192852, 64.392639, 0.430373, 53.826145);\n\
    \n    ctx.fill();\n\n    ctx.stroke();\n\n    this.stone_tile.src = tile_canvas.toDataURL(\"\
    image/png\");\n\n}\n\nI ended up creating a variable alias “ctx” in the function\
    \ from the tile_ctx, because Inkscape generates the canvas context variable with\
    \ that name by default, and it’s quicker than needing to rename it every time\
    \ I save it out.\n\nA Bezier curve is a point that has 2 handles on each side\
    \ of a point, that lets us smooth/ modify that point by changing those handles.\
    \ It’s the main tool pretty much all vector graphics use to create vector art.\n\
    \nYou can learn more about it here:\n\n[https://en.wikipedia.org/wiki/B%C3%A9zier_curve](https://en.wikipedia.org/wiki/B%C3%A9zier_curve)\n\
    \nMozilla has a good article on how to use the curves to draw:\n\n[https://developer.mozilla.org/en-US/docs/Web/API/Canvas_API/Tutorial/Drawing_shapes#bezier_and_quadratic_curves](https://developer.mozilla.org/en-US/docs/Web/API/Canvas_API/Tutorial/Drawing_shapes#bezier_and_quadratic_curves)\n\
    \nThis is what the rock looks like in the game:\n\n![](Images/image00479.jpeg)\n\
