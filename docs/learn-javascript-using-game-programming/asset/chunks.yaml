  trans: "\n\n```javascript\nmy_player.SetDestination(x_dest, y_dest);\n\n}\n```\n\
    \n`SetDestination` 函数是我们的 `Entity` 类拥有的函数，它允许我们让实体向某个点移动。\n\n去检查一下游戏吧，当你点击时，玩家将能够移动到点击发生的位置，就像之前的\
    \ `Friend` 类能够做到的那样！\n\n![](img/image00485.jpeg)\n\n现在，我们有了一个可以在世界中移动、由用户控制、并在移动时改变状态、方向和动画的角色。但我们可以发现，目前可见的世界范围只有屏幕那么宽，尽管我们已经把世界做得得比屏幕宽得多。因此，在下一节中，我们将添加一个\
    \ `Camera` 来跟随玩家，这样他们就可以探索更大的地图！\n\n### GitHub 上的章节示例：\n\n[`doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/9_Animated_graphics.html`](https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/9_Animated_graphics.html)\n\
    \n# 10. 制作一个跟随玩家的“相机”\n\n## 创建相机\n\n我们想要创建一个相机，以便能够在周围移动并查看角色周围更广的世界，并在角色靠近屏幕边缘时跟随他。\n\
    \n因此，我们将创建一个 `Camera` 类，并知道我们想要使用 `x` 和 `y` 来对它进行定位：\n\n```javascript\nclass Camera\n\
    {\n  // 相机通过其 x 和 y 位置移动，以显示它在世界中的位置\n  constructor(x,y)\n  {\n    this.x=x;\n\
    \    this.y=y;\n  }\n}//end of class Camera\n```\n\n接下来，我们实际上想让相机成为绘制世界和角色的主体（这样当我们的角色移动时，它可以移动我们角色周围的世界）。将\
    \ `update game` 中所有的绘图代码移动到我们 `Camera` 类下的一个新函数 `Draw` 下。\n\n```javascript\nclass\
    \ Camera\n{\n  // 相机通过其 x 和 y 位置移动，以显示它在世界中的位置\n  constructor(x,y)\n  {\n    if(x==undefined)\n\
    \      {\n        x=0;\n        y=0;\n      }\n    this.x=x;\n    this.y=y;\n\
    \  }\n  // 相机根据自己的位置绘制所有内容\n  Draw(ctx, delta_ms)\n  {\n    for (let i=0; i <\
    \ tiles.length; i++)\n      {\n        tiles[i].Draw(ctx);\n      }\n    if(sprites!=undefined)\n\
    \      {\n        for (let i = 0; i < sprites.length; i++)\n          {\n    \
    \        const sprite = sprites[i];\n            //为每个 sprite 在其 x、y、宽度和高度处绘制一个红色的调试框\n\
    \            debug_boxes.DrawDebugBox(ctx, sprite.x, sprite.y, sprite.width, sprite.height,\
    \ 2, \"#FF0000\");\n            sprite.Draw(ctx, delta_ms);\n          }\n   \
    \   }\n  }\n}//end of class Camera\n```\n\n现在，我们实际上想从 `UpdateGame` 函数中调用这个绘图代码，所以我们本质上是在做和之前相同的事情：\n\
    \n```javascript\nfunction UpdateGame(delta_ms)\n{\n  ClearCanvas(ctx, \"rgba(0,0,255,255)\"\
    ); // 清空画布，以免出现“重影”\n  camera.Draw(ctx, delta_ms);\n}\n```\n\n最后，在脚本文件的底部创建我们的相机，在\
    \ `SetupInput` 之后，`let fps_txt_element = document.getElementById(\"fps\");` 之前。\n\
    \n```javascript\nlet camera = new Camera(0, 0);\n```\n\n如果你现在运行它，一切看起来应该一样，这意味着我们只是把绘图功能放进了相机类中。所以现在我们想要能够移动相机的位置，这将导致屏幕向相反的方向移动。让我们把相机移动\
    \ `-window.innerWidth / 2`（向左移动半屏宽）：\n\n```javascript\nlet camera = new Camera(-window.innerWidth/2,\
    \ 0);\n```\n\n目前还不应该有任何变化，因为我们还没有真正使用相机的 x 和 y 值。因此，我们将根据相机的位置在瓦片和实体的绘制函数中移动所有内容。\n\
    \n因此，在你的 `class Tile` 中，更新你的绘制函数以根据相机的位置进行绘制：\n\n```javascript\nDraw(ctx)\n{\n\
    \  ctx.drawImage(this.image, this.x-camera.x, this.y-camera.y);\n}\n```\n\n如果你现在运行它，你会看到你的瓦片偏移了半屏宽，这正是它应该是。但现在我们还必须偏移我们的\
    \ sprite。在你的 sprite 类中，更改你的绘制函数以加上相机位置：\n\n```javascript\nDraw(ctx, delta_ms)\n\
    {\n  if(x!=undefined)\n    ctx.drawImage(this.image, this.x-camera.x, this.y-camera.y);\n\
    }\n```\n\n"
- fmt: "\nNow the camera is ready to be able to update its position when it has a\
    \ target. Let’s give it one!\n\nAt the bottom of your script, in the `AllAssetsLoaded()`\
    \ function, at the bottom add the call to the `camera.follow` function:\n\n```javascript\n\
    ...\n\nSetupInput();\n\ncamera.Follow(my_player);\n\n}\n```\n\nNow if you refresh,\
    \ you’ll see the player centered on the screen, and if you click around, you’ll\
    \ see him move around the world, while also staying in the center of the screen!\n\
    \n![](Images/image00486.jpeg)\n\nYou’ve probably noticed one major issue now-\
    \ when you click somewhere, the player no longer goes to the correct position\
    \ in the world where you clicked. This is because the camera is offsetting the\
    \ world, but the click position is not aware that we’re moving the camera/ world\
    \ around. So we just need to add our camera offset when we get the click position.\n\
    \n## Fixing input position based on camera position\n\nTo fix this, change the\
    \ function `MoveMyPlayer` to include the camera position as follows:\n\n```javascript\n\
    function MoveMyPlayer(x_dest, y_dest)\n{\n //add in the offset of the camera to\
    \ accurately move our player around the world.\n x_dest=x_dest+camera.x;\n y_dest=y_dest+camera.y;\n\
    \ //move my_player to the destination clicked\n console.log(\"Moving my player\
    \ to destination: x: \"+x_dest+\", y: \"+y_dest)\n my_player.SetDestination(x_dest,\
    \ y_dest);\n}\n```\n\nNow if you click around the world, the player actually goes\
    \ to where you clicked, regardless of where the camera is scrolled!\n\nBut one\
    \ other issue, if you click the center of a tile, you would expect your player\
    \ to also go and sit in the center of the tile. Right now he is being placed based\
    \ on the top left, so we’ll also want to subtract out half his width and height\
    \ from the click position, to get him centered. So update it to:\n\n```javascript\n\
    function MoveMyPlayer(x_dest, y_dest)\n{\n //add in the offset of the camera to\
    \ accurately move our player around the world.\n x_dest=x_dest+camera.x;\n y_dest=y_dest+camera.y;\n\
    \ //center player on where mouse click happened, instead of positioning the top\
    \ left there:\n x_dest=x_dest-my_player.width*.5;\n y_dest=y_dest-my_player.height*.5;\n\
    \ //move my_player to the destination clicked\n console.log(\"Moving my player\
    \ to destination: x: \"+x_dest+\", y: \"+y_dest)\n my_player.SetDestination(x_dest,\
    \ y_dest);\n}\n```\n\nNow when you click around, you’ll see that the player goes\
    \ to that position, but centers themselves on it!\n\nBut now we also want to make\
    \ sure the player can’t wander off the world, and that we don’t see the ugly blue\
    \ clear color when he’s wandering around, so we’re going to add some limits to\
    \ how far the camera can move.\n\n## Adding in camera boundaries\n\nTo add in\
    \ camera boundaries, we’re going to make sure the top left of it never goes past\
    \ the top left of the world, the bottom right doesn’t go the bottom right of our\
    \ world, and so on. We’ll set it up so that the camera will always follow the\
    \ player, except in these cases.\n\nWhat we want to say is “don’t go past our\
    \ world boundaries and show the background”. Since we know our world starts at\
    \ `x=0`, `y=0`, we can first tell it to not go below this.\n\nSo, change our cameras\
    \ `Update` function to stop it from going below 0 in the `x` and `y`:\n\n```javascript\n\
    Update(delta_ms)\n{\n if(this.target!=undefined)\n {\n this.x=this.target.x-half_width_minus_target_width;\n\
    \ this.y=this.target.y-half_height_minus_target_height;\n if(this.x<0)\n this.x=0;\n\
    \ if(this.y<0)\n this.y=0;\n }\n}\n```\n\nNow if you move around the world, you’ll\
    \ see that it’t show the blue background in the left corner, but follows the player,\
    \ except in that situation. So now let’s also make it so it’t go past the other\
    \ 3 corners.\n\nTo do this, we need to know the width and height of the world,\
    \ and make sure the right side of camera `camera.x + window.innerWidth` doesn’t\
    \ go past the right side of the map.\n\nWe could calculate how wide the tiles\
    \ are * the number of tiles in the `x` direction, but let’s instead add this functionality\
    \ to the `Level` class. We’ll move all Tile generation code after `new Level()`\
    \ at the bottom into a new function in the `Level` class, and add variables to\
    \ the constructor for things we want to track:\n\n```javascript\nclass Level\n\
    {\n constructor(tile_images)\n {\n this.tile_images = tile_images;\n this.num_tiles_x=1;\n\
    \ this.num_tiles_y=1;\n this.width=this.num_tiles_x*Tile.width;\n this.height=this.num_tiles_y*Tile.height;\n\
    \ }\n CreateLevel(screen_widths, screen_heights)\n {\n let screen_width_default=1366;\n\
    \ let screen_height_default=768;\n this.num_tiles_x = Math.round(screen_width_default*screen_widths\
    \ / Tile.width);\n this.num_tiles_y = Math.round(screen_height_default*screen_heights\
    \ / Tile.height);\n this.width=this.num_tiles_x*Tile.width;\n this.height=this.num_tiles_y*Tile.height;\n\
    \ for(let x=0;x<this.num_tiles_x; x++)\n {\n for(let y=0;y<this.num_tiles_y; y++)\n\
    \ {\n let type = Math.floor(Math.random()*(Tile.LAST_TYPE+1));\n tiles.push(new\
    \ Tile(x*Tile.width, y*Tile.height, type, this.tile_images[type].image));\n }\n\
    \ }\n }\n}//end of class Level\n```\n\nWe left the constructor parameters the\
    \ same, but we added variables to keep track of the number of tiles in the `x`\
    \ and `y` direction + the overall height and width of the level, which is just\
    \ the number of tiles in each direction, times how wide or tall each tile is (to\
    \ get the total width/ height).\n\nNext, we create a `CreateLevel` function that\
    \ will get passed in how many screen widths and heights we want our level to be.\
    \ We moved our level generation code into here from the bottom of the script,\
    \ and instead of multiplying it by 2 screen widths/ heights, we’re going to be\
    \ able to pass it in, and generate different sized levels very easily.\n\nSo on\
    \ the bottom of the script, in `CreateTileMap()`, remove the level generation\
    \ code, so it now looks like this:\n\n```javascript\nlet tiles = new Array();\n\
    let level=undefined;\nfunction CreateTileMap()\n{\n let tile_images = new Array(asset_loader.GetImage(\"\
    dirt\"),\n asset_loader.GetImage(\"stone\"),\n asset_loader.GetImage(\"water\"\
    ),\n asset_loader.GetImage(\"grass\"),\n asset_loader.GetImage(\"bush\")\n);\n\
    \ level = new Level(tile_images);\n level.CreateLevel(1.25, 1.25);\n}\n```\n\n\
    We create the `level` variable outside of this function, so that other places\
    \ can reference it, otherwise it would only exist in the function we created (but\
    \ now will exist everywhere, since not being created in a particular function/class).\n\
    \nWe still create/initialize the level after the tiles have loaded, but call the\
    \ function to actually create the tiles, and pass in 1.25, or 1 screen width/\
    \ height plus a quarter more, so the world will be slightly larger than our screen.\n\
    \nIf you run this now, you’ll see everything as before, but the level is smaller,\
    \ so we can more easily test when moving our player will show the background screen.\n\
    \nSo, let’s finally constrict the camera, since now we have the width and height\
    \ of the world stored in the level.\n\nIn our `Camera` update function, change\
    \ it to:\n\n```javascript\nUpdate(delta_ms)\n{\n if(this.target!=undefined)\n\
    \ {\n this.x=this.target.x-half_width_minus_target_width;\n this.y=this.target.y-half_height_minus_target_height;\n\
    \ let right_side_of_screen = this.x+window.innerWidth;\n let bottom_side_of_screen\
    \ = this.y+window.innerHeight;\n if(this.x<0)\n this.x=0;\n else if(right_side_of_screen\
    \ > level.width)\n this.x=level.width-window.innerWidth;\n if(this.y<0)\n this.y=0;\n\
    \ else if(bottom_side_of_screen > level.height)\n this.y=level.height-window.innerHeight;\n\
    \ }\n}\n```\n"
