  trans: "\n最后，我们还处理了 `onerror`，它只会在加载图像出现问题时触发（如果源文件路径不存在或其他问题）。\n\n现在我们可以在最后一个函数下方（`AssetLoader`\
    \ 类内部）添加以下内容：\n\n```javascript\nImageLoaded(img_container)\n{\n  console.log(\"\
    image loaded! \", img_container.src);\n  img_container.loaded=true;\n  if(this.CheckIfAllImagesLoaded())\n\
    \  {\n    console.log(\"all images loaded!\");\n    this.callback();\n  }\n}\n\
    \nImageError(img_container, error)\n{\n  console.log(\"Couldn't load an image,\
    \ check above for an error, probably the wrong path\", img_container.src, error);\n\
    }\n```\n\n`ImageLoaded` 函数在每张图片加载完成时都会触发。我们传递了自定义的 `img_container` 对象，以便将其 `loaded`\
    \ 属性设置为 `true`。然后我们运行一个函数（将在下一步定义）来检查是否所有图片都已加载，如果是的话，我们将打印所有图片已加载完毕，并触发回调函数让程序的其他部分知道图片已加载，我们可以开始游戏（稍后会展示）。\n\
    \n现在我们可以在最后一个函数下方（`AssetLoader` 类内部）添加以下内容：\n\n```javascript\nCheckIfAllImagesLoaded()\n\
    {\n  let num_imgs_loaded=0;\n  for (let i = 0; i < this.image_containers.length;\
    \ i++)\n  {\n    let img_container = this.image_containers[i];\n    if(img_container.loaded)\n\
    \      num_imgs_loaded++;\n  }\n  if(num_imgs_loaded == this.image_containers.length)\n\
    \    return true;\n  else\n    return false;\n}\n\nGetImage(name)\n{\n  for (let\
    \ i = 0; i < this.image_containers.length; i++)\n  {\n    let img_container =\
    \ this.image_containers[i];\n    if(img_container.name==name)\n      return img_container;\n\
    \  }\n  return null;\n}\n```\n\n`CheckIfAllImagesLoaded` 函数会在每张图片加载时运行。由于它们的加载顺序可能不一致（较大的文件耗时更长，会最后加载），我们必须检查每张图片是否是最后一张加载的。\n\
    \n因此，在这里我们从“检查前加载了 0 张图片”开始，遍历所有图片并计数有多少张已经加载。之后，如果加载的图片数量等于我们尝试加载的总图片数，意味着我们已经完成了所有图片的加载，并可以返回\
    \ `true`/加载完成！如果不是，我们将返回 `false`，并继续等待，直到所有图片都已调用了 `onload`。\n\n我们创建了一个 `GetImage`\
    \ 函数，它接收一个瓦块（tile）的名称，并遍历我们所有的自定义 `img_container` 对象，检查名称是否与我们要找找的匹配，如果找到了则返回它（如果未找到则返回\
    \ `null`）。\n\n我们的 `AssetLoader` 类编写完毕，但在该类下方（类外部）添加一个新类：\n\n```javascript\nclass\
    \ Level\n{\n  constructor(tile_images)\n  {\n    this.tile_images = tile_images;\n\
    \  }\n} //end of class Level\n```\n\n这将用于存放我们的关卡——但目前它仅用于按顺序存储瓦块图片（例如 0 代表泥土，1\
    \ 代表石头等——即在 `Tile` 类中定义的内容）。\n\n我们还应该在瓦块类中添加瓦块宽度和高度作为静态属性，而不是放在 `TileCreator`\
    \ 对象中，因为我们再也不会使用它了：\n\n```javascript\nclass Tile\n{\n  static width=64;\n  static\
    \ height=64;\n}\n```\n\n现在，在程序的底部，我们将更改生成瓦块的方式。删除所有瓦块生成代码（所有与瓦块相关的代码，从程序底部的 `new\
    \ TileImageCreator()` 开始），并将其替换为：\n\n```javascript\nlet last_width=window.innerWidth;\n\
    let last_height=window.innerHeight;//existing code\nlet asset_loader = new AssetLoader();\n\
    asset_loader.AddImageToQueue(\"dirt\", \"assets/imgs/dirt.jpg\");\nasset_loader.AddImageToQueue(\"\
    stone\", \"assets/imgs/stone.jpg\");\nasset_loader.AddImageToQueue(\"water\",\
    \ \"assets/imgs/water.jpg\");\nasset_loader.AddImageToQueue(\"grass\", \"assets/imgs/grass.jpg\"\
    );\nasset_loader.AddImageToQueue(\"bush\", \"assets/imgs/bush.jpg\");\nasset_loader.LoadImages(AllAssetsLoaded);\n\
    \nfunction AllAssetsLoaded()\n{\n  CreateTileMap();\n}\n```\n\n我们创建了一个新的 `AssetLoader`，并将所有想要加载的图片队列。接下来，我们实际上运行加载图片的函数，将我们的\
    \ `callback` 作为 `AllAssetsLoaded` 传入，它将在所有图片加载完成后被调用。最后，它将调用一个新函数 `CreateTileMap`\
    \ 来生成瓦块：\n\n```javascript\nlet last_width=window.innerWidth;\nlet last_height=window.innerHeight;\n\
    let tiles = new Array();\nfunction CreateTileMap()\n{\n  let level = new Level();\n\
    \  let num_tiles_x = Math.floor(last_width / Tile.width);\n  let num_tiles_y =\
    \ Math.floor(last_height / Tile.height);\n  for (let x = 0; x < num_tiles_x; x++)\n\
    \  {\n    for (let y = 0; y < num_tiles_y; y++)\n    {\n      // tile generation\
    \ logic\n    }\n  }\n}\n```\n*(注：原文中 `CreateTileMap` 的文本是片段化的；我已根据代码段提供的上下文重构了逻辑流。)*\n\
    \n"
- fmt: "\nI downloaded the sprite sheet, and added it to the folder with the rest\
    \ of the image assets. We can now load the image through our asset loader, but\
    \ it’s a sprite sheet with all the animations for the character, not just a single\
    \ image. So, we’ll have to break apart the image areas, and create “animations”\
    \ for a set of images on the sprite sheet.\n\nI also found another sprite sheet\
    \ that looked useful, if nothing else because it has many rows and columns for\
    \ the different animations, and some animation sequences on the next row, so it\
    \ gives us more things to test for creating a sprite sheet loader.\n\n[https://rvros.itch.io/animated-pixel-hero](https://rvros.itch.io/animated-pixel-hero)\n\
    \n![](Images/image00483.jpeg)\n\n## Sprite Sheets and texture atlases\n\nAs you\
    \ can see by looking at those images, a sprite sheet has several “sprites” on\
    \ it (a sprite being an image that will be displayed in our program). A sprite\
    \ sheet will generally contain all the animations for a certain character/ item\
    \ in a game, and might contain multiple characters animations, if there is extra\
    \ space on the sprite sheet.\n\nIt makes things harder- loading a texture, and\
    \ splitting it up into multiple parts afterwards, not to mention needing to use\
    \ a special tool to put all the images onto a giant image.\n\nWhy would you put\
    \ them on one texture instead of multiple textures? The biggest reason is that\
    \ it takes time to switch between images to draw them-so if you can put more images\
    \ on less textures/ overall image that holds many, it takes a lot less time to\
    \ draw them, and you get better game speeds (fps).\n\nAnother is because it also\
    \ takes time to open each file- so it ends up taking less time to load a couple\
    \ big images than a ton of small ones.\n\nYou can actually get programs like “texturepacker\
    \ pro”, which rotates your images, and uses a complex algorithm to try to pack\
    \ them together as close as possible, to save as much space/ maximize the number\
    \ of sprites you can store on a texture.\n\nSprite sheets and texture atlases\
    \ are the same sort of idea. A texture atlas generally will contain more advanced\
    \ packing algorithms, and will include a text (usually JSON notation) file that\
    \ describes where each section is, so that you can pull images off it easily.\n\
    \nA sprite sheet on the other hand, is usually just a grid of even sized boxes\
    \ containing the sprites. All you have to know is how big each tile of sprites\
    \ in the sprite sheet are, and can figure out where each sprite is.\n\nOur plan\
    \ is to first create a class to display all of our sprites- from the tiles, player,\
    \ enemies, NPC’s. They’ll all have in common an `x` and `y` position to draw on\
    \ screen, and `width` and `height` to draw them, and either an image, or animations\
    \ to draw.\n\n## A debug box class\n\nWe can create a small debug box class to\
    \ be able to check where a sprite/ animation is onscreen, compared to where it’s\
    \ drawn. There is blank space in some frames of the animations, which makes it\
    \ difficult to see where it’s actually being drawn. So, this makes it easier to\
    \ see how to align/ position animations relative to the sprite they are in. Add\
    \ this to the bottom of your classes:\n\n```\n//for drawing debug boxes around\
    \ sprites, animations, etc.\n\nclass DebugBox {\n  constructor() {\n  }\n  DrawDebugBox(ctx,\
    \ x, y, width, height, thickness, color) {\n    ctx.fillStyle = color;\n    ctx.fillRect(x,\
    \ y, width, thickness); //top\n    ctx.fillRect(x, y+height-thickness, width,\
    \ thickness); //bottom\n    ctx.fillRect(x, y, thickness, height); //left\n  \
    \  ctx.fillRect(x+width-thickness, y, thickness, height); //right\n  }\n}\n//end\
    \ of class DebugBox\n```\n\n## Creating a sprite class\n\nWe’ll create a sprite\
    \ class, which will mainly be in charge of keeping track of the `x` and `y` positions,\
    \ `width`, `height`, and be able to draw out images or animations to that position\
    \ + size.\n\n```javascript\nclass Sprite {\n  constructor(x, y, width, height,\
    \ image) {\n    this.x = x;\n    this.y = y;\n    if (width == undefined)\n  \
    \    width = Tile.width;\n    if (height == undefined)\n      height = Tile.height;\n\
    \    this.width = width;\n    this.height = height;\n    this.image = image;\n\
    \    this.animations = new Array();\n    this.curr_anim = 0;\n    this.flip_x\
    \ = false;\n  }\n  Draw(ctx, delta_ms) {\n    if (this.image != undefined)\n \
    \     ctx.drawImage(this.image, this.x, this.y);\n    if (this.animations.length\
    \ > 0) {\n      this.animations[this.curr_anim].Draw(ctx, delta_ms, this.x, this.y,\
    \ this.flip_x);\n    }\n  }\n}\n//end of class Sprite\n```\n\nA sprite has a position\
    \ (`x,y`, or horizontal and vertical) that it is drawn at on the screen, the width\
    \ and height of the image/ animation, and possibly an image passed over.\n\nWe’ll\
    \ check to see if `width` and `height` are `undefined` (meaning they didn’t get\
    \ passed in for this sprite), and if so, we’re going to use the default tile size\
    \ for both.\n\nWe’ll also assign the image (if one wasn’t passed over, it will\
    \ also be `undefined`). We’ll check to see if `width` and `height` are `undefined`\
    \ (meaning they didn’t get passed in for this sprite), and if so, we’re going\
    \ to use the default tile size for both.\n\nWe’ll also assign the image (if one\
    \ wasn’t passed over, it will also be `undefined`). We’ll check to see if `width`\
