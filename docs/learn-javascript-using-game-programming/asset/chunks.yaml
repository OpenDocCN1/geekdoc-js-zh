  trans: "\n\n## FlipBook 类实现\n\n```javascript\n//图像，每一帧的大小，动画开始的位置，帧数，绘制到屏幕的缩放比例，切换到下一帧之前的等待时间\n\
    constructor(image, width_frame, height_frame,\n            start_column_x, start_row_y,\n\
    \            num_frames,\n            scale,\n            delay_ms)\n{\n    this.image=image;\n\
    \    this.width_frame=width_frame;\n    this.height_frame=height_frame;\n    this.num_frames=num_frames;\n\
    \    this.scale=scale;\n    this.delay_ms=delay_ms;\n    this.width_drawn=width_frame*scale;\n\
    \    this.height_drawn=height_frame*scale;\n    this.timer=0; // 用于切换到下一帧的计时器\n\
    \    this.frame=0; // 当前帧，范围从 0 到 num_frames-1\n    // 用于相对于父对象偏移或居中绘制的偏移量\n \
    \   this.offset_x=0;\n    this.offset_y=0;\n// 如果我们不总是想让帧居中——因为其他动画的帧可能很宽（例如宽攻击对比窄待机动作），我们可以增加它们相对于中心的偏移\n\
    \    this.offset_x_extra=0;\n    this.offset_y_extra=0;\n    // frames 将是贴图集中的\
    \ x 和 y 位置，假设从左到右移动，并可能换行到新行\n    this.frames=new Array();\n    // 用户提供的起始列从 1\
    \ 开始——但在这里我们需要从 0 开始\n    start_column_x--;\n    start_row_y--;\n    let x=start_column_x*width_frame;\n\
    \    let y=start_row_y*height_frame;\n    // 计算每一帧的 x 和 y 位置\n    while(this.frames.length<this.num_frames)\n\
    \    {\n        this.frames.push({x:x, y:y});\n        x+=width_frame;\n     \
    \   if(x>image.width)//如果 x 现在超出了传入的图像（贴图集的右侧），则让它换行到下一行的开头\n        {\n     \
    \       x=0;\n            y+=height_frame;\n        }\n    }\n} // FlipAnimation\
    \ 类结束\n```\n\n### 构造函数逻辑\n首先，我们传入了所需的所有信息，用以确定帧的位置，以及绘制一帧所需的参数。我们传入了精灵集（sprite\
    \ sheet）、每一帧的宽度和高度、我们要查找的动画的起始列和行，以及动画持续的帧数。我们还传入了在屏幕上绘制帧时对原始帧大小进行缩放的比例；以防精灵集使用的素材可能比我们在游戏中想要使用的更小或更大。最后，我们传入了帧与帧之间的延迟，这样我们就可以增加延迟来减慢动画，或通过减少延迟来加速动画。\n\
    \n我们将所有传入的变量赋值给对象的变量（使用 `this` 赋值给当前对象）。我们计算出绘制到屏幕上的宽度和高度（`scale * width and height`）。我们将计时器设置为\
    \ 0，用于计算每帧之间经过的总时间。我们将当前帧设置为 0，即第一帧。\n\n我们将拥有 `x` 和 `y` 偏移量，根据父对象的尺寸以不同的方式定位动画。例如，如果父对象的宽度比动画窄（这种情况下通常如此），我们希望让动画居中，使其看起来更正确。我们还假设用户提供的动画列和行是从第一列/行开始的，而不是第\
    \ 0 列/行，因此我们必须减 1 将其转换为从 0 开始，因为这是它们从主图中提取的方式（左上角为 0,0，下一帧将是 0+width, 0+width*2\
    \ 等 等）。\n\n接下来，我们将开始从整个图像中提取位置。我们将起始行和列设置为用户提供的值（但从 0 开始），并将其乘以帧的宽度和高度，以跳转到图像中帧的正确起始位置。现在，我们检查\
    \ `while` 循环，只要我们还没有获取所有的帧（`frames` 数组的长度小于我们要查找的帧数），就会继续获取更多帧。我们将推送当前帧的位置（初始为起始位置），然后向右移动一帧（加上帧的宽度）。如果当前位置\
    \ + 帧的宽度大于整个图像宽度，说明我们已经超过了右侧/超出了图像，因此我们需要将 `x` 重置为 0，使其位于图像的左侧，并增加 `y` 一帧的高度以进入下一行。我们重复此过程，直到获取到所有帧！\n\
    \n### Draw 方法\n我们还需要在这个类中添加一个函数，以便绘制我们的动画。因此，将此函数添加到 `FlipBookAnimation` 类中：\n\
    \n```javascript\nDraw(ctx, delta_ms, x, y, flip_x)\n{\n    //如果翻转，必须保存，然后翻转整个画布，绘制，然后恢复原始画布绘制\n\
    \    if(!flip_x)\n    {\n        debug_boxes.DrawDebugBox(ctx, x+this.offset_x,\
    \ y+this.offset_y, this.width_drawn, this.height_drawn, 2, \"#0000ff\");\n   \
    \     ctx.drawImage(this.image,\n            this.frames[this.frame].x, this.frames[this.frame].y,\n\
    \            this.width_frame, this.height_frame,\n            x+this.offset_x+this.offset_x_extra,\
    \ y+this.offset_y+this.offset_y_extra,\n            this.width_drawn, this.height_drawn);\n\
    \    }\n    else\n    {\n        ctx.save();\n        ctx.scale(-1, 1);\n    \
    \    debug_boxes.DrawDebugBox(ctx, -x-(this.width_drawn+this.offset_x), y, this.width_drawn,\
    \ this.height_drawn, 2, \"#0000ff\");\n        ctx.drawImage(this.image,\n   \
    \         this.frames[this.frame].x, this.frames[this.frame].y,\n            this.width_frame,\
    \ this.height_frame,\n            -(x+this.offset_x-this.offset_x_extra+this.width_drawn),\
    \ y+this.offset_y+this.offset_y_extra,\n            this.width_drawn, this.height_drawn);\n\
    \        ctx.restore();\n    }\n    this.timer+=delta_ms;\n    if(this.timer>this.delay_ms)\n\
    \    {\n        this.timer=0;\n        this.frame++;\n        if(this.frame==this.num_frames)\
    \ //最大帧应该比帧数少 1\n        {\n            this.frame=0;\n        }\n    }\n}\n```\n"
- fmt: "\nWe then increase our timer based on the `delta_ms`/ time that has passed\
    \ since the last frame was drawn.\n\nWe check to see if this timer is now greater\
    \ than the delay we were waiting for to go to the next frame. If it is greater,\
    \ we first reset the timer to `0` so it can start counting again in the next update.\
    \ We increase which frame we’re on, but if we’ve made it to the total number of\
    \ frames, we’ve gone past the number of frames we have, so need to reset back\
    \ at the first frame again (`0`), to loop the animation, and have it play again.\n\
    \nLastly, we need one more function to center an animation inside of its parent\
    \ (since the animation is wider than our tile size).\n\n```javascript\nCenterSize(parent_width,\
    \ parent_height) \n{\n  this.offset_x= parent_width*.5-this.width_drawn*.5;\n\
    \  this.offset_y= parent_height*.5-this.height_drawn*.5;\n}\n```\n\nThis just\
    \ takes the parent width and height, sets the offset to half the parents width/height\
    \ (which would have it start drawing from the center), then subtracts its own\
    \ width and height, which centers it inside the parent.\n\nNow we actually have\
    \ a class that can extract frames from a sprite sheet, and draw them. Time to\
