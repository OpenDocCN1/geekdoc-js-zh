    You can call them multiple times, not send any additional information to them
    if they don''t need it, or pass information in to them if they need values to
    do whatever you want them to do. For instance, if the player is supposed to hit
    an enemy, you might want to pass in which enemy to hit, how much damage the player
    is doing, what animation you want to play (if it''s a magic or physical attack).


    The initial structure is based on whatever makes sense to you at the time. If
    you have all the information in your class you need to run the function (like
    make the player run), you don''t have to pass anything. If you want the player
    to run at different speeds, you can send what speed you want him to run at, and
    pass it in as a parameter. It will all make sense/ become easier the more you
    do it (like everything else, practice makes perfect).


    Functions are also called "methods" in some languages - sometimes just when they
    are inside a class. People use the terms interchangeably, depending on the programming
    language. I prefer the term "function"- because they usually do something/ provide
    some kind of function, but it''s a matter of preference.


    ### Chapter example on github:


    [https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/4_Objects.html](https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/4_Objects.html)


    # 5. Creating visuals by connecting JavaScript to HTML


    JavaScript allows you to do stuff, storing information, getting key inputs from
    a user, interaction, etc. But besides looking at the console, it has no way of
    outputting to a user, showing a user interface, or really being able to communicate
    with someone who is trying to use a program/ game/ app you built.


    Luckily, something came before JavaScript that is meant to be visual, and JavaScript
    can talk to it (getting stuff from it, and sending stuff to it), that we can use
    to start showing stuff on screen!


    That is HTML, or known as ''HyperText Markup Language'', a fancy way of saying
    "it allows you to show information". HTML is mainly used to layout information-
    text, pictures, etc. HTML wraps text in "tags", which represent parts of a webpage,
    who are all wrapped in triangle brackets like <this_could_be_an_html_tag>. Additionally,
    most tags have to close after you put any information inside of them, by putting
    a forward slash: "/" in a second copy of the tag. For example:


    <text> this is some text </text>


    <image> this is an image</image>


    Those aren''t the actual format for that information, but it shows how information
    has to be inside an open and close tag.


    All HTML documents/ files have to all follow the same basic structure.


    First, we need an open and close html tag:


    <html>


    </html>


    Next, html has a head like you, and a body like you as well. The head you can
    think of as like your thoughts- you can''t see what you put in it on the final
    page, but it''s there for things that run behind the scenes. Things like the JavaScript,
    the title for your page (which shows up in the top of your browser, not on the
    page), or even the colors for your page can go there.


    <html>


        <head>


        </head>


    </html>


    Finally, it also has a body- just like you, which will actually be visible on
    the page, and this is where everything you want to be seen will go.


    <html>


        <head>


        </head>


        <body>


        </body>


    </html>


    That''s the basic structure required of all HTML pages- it''s just required before
    we can add anything that we can see. Now we can start adding stuff that we can
    actually see.


    You''ll notice in HTML, you''ll want to indent/ move forward with around 4 spaces
    or 1 tab any tags that are inside other ones. That way you can easily see what
    tags are inside other ones, because that will make things much easier to organize
    when things become more complicated in the future.


    Let''s add some text (also known as a paragraph, or the <p> tag, one tag you can
    put text in), and something that will allow us to draw from JavaScript- the canvas
    tag. Canvas is what you use to paint on in art- usually some white cloth where
    you''ll start painting all your colors on. Since we''re not going to draw anything
    on it yet, it will just be white, so won''t be visible unless we give it a border:


    <html>


        <head>


        </head>


        <body>


            <p>This is some text that I created on a webpage</p>


            <canvas style="border:1px solid green"></canvas>


            <script>


            </script>


        </body>


    </html>


    If you run this now, you''ll see our text on the webpage, and a small box with
    a green border on it, which is our canvas, that will let us draw!


    We added "style" to the canvas tag, which is called an "attribute".


    Style is also known as "CSS", and this allows us to change how things look, changing
    colors, background colors, font type, almost anything that modifies things visually.
    It''s known as "cascading style sheets". Cascading is like a waterfall- where
    water from the top cascades down the waterfall, going lower and lower till it
    splashes in a pool.


    Likewise with CSS, you could say a background color is red, and below it, change
    it to green, and it will override the top color/ style. Seems kind of pointless
    right now, but it becomes useful as things become more involved. For instance,
    if you want to have all text being black, but then you have some boxes that are
    black, and you want that text inside them to be white, you''d define your whole
    page to have black text, but later say that text in the black boxes should only
    be white.


    It''s another concept that will make more sense when you need to use it more,
    but for now all you need to know is it allows you to change colors, spacing, and
    most things visually for HTML.


    HTML is just used to state what content is there (an image, text, the canvas tag,
    a video tag, etc), but CSS lets us change how it''s displayed differently than
    the default/ built in CSS.'
