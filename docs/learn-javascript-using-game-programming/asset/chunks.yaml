    \ i++) {\n    let img_container = this.image_containers[i];\n    img_container.image.src\
    \ = img_container.src; // 设置实际图片源，这将开始加载图片\n    let asset_loader = this; // 技巧：允许我们在下面的函数中访问\
    \ \"this\"；否则 \"this\" 将变成被加载的图片\n    img_container.image.onload = function(event)\
    \ {\n      asset_loader.ImageLoaded(img_container);\n    };\n    img_container.image.onerror\
