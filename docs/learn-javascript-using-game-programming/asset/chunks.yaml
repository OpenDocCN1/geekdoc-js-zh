    \n# 8. Creating the world - background tiles\n\n## Choosing a game tile size\n\
    \nHow big should we make the tile? With backgrounds, to save room, as well as\
    \ be able to generate different maps on the fly, we usually use smaller images,\
    \ and tile, or repeat the tile across the screen many times to generate a repeating\
    \ background. If you make them too small, you'll see the repeating pattern relatively\
    \ easily. But if you make them too big, it takes more memory to store 1 big image,\
    \ when you could store many smaller tiles instead. Additionally, when players\
    \ modify a tile, the smaller the tile, the more number of things they can interact\
    \ or change on screen at once.\n\nLooking into what the most common resolutions\
    \ are:\n\n[https://gs.statcounter.com/screen-resolution-stats](https://gs.statcounter.com/screen-resolution-stats)\n\
    \nThe second most common resolution as of right now is: 1366x768 (1366 wide, 768\
    \ tall on widescreen), which is slightly smaller than the 1st most common resolution,\
    \ and bigger than the 3rd most common. So, we'll design based on that.\n\nGraphics\
    \ can display textures/ images that are in multiples of 2's easier than random\
    \ size, so it's a good idea to try to have things as a multiple of 2 when you\
    \ can, for performance (but not required). Multiples of 2's are 2x2=4, 2x2x2=8,\
    \ 2x2x2x2=16, 32, 64, 128, 256, 512, 1024, 2048, 4096, etc.\n\nIf we want to use\
    \ 64x64 pixel tiles, that would let us 1366/64=22 tiles wide, and 768/64=12 tiles\
    \ tall. That sounds reasonable for what a player would be able to see on the screen\
    \ at a time, so we'll use that. We could use any value, but it's good to setup\
    \ early on, so you have an area to design into, but can change it before you do\
    \ too much work if you realize it could be better, for reason.\n\n## Using a canvas\
    \ to create textures\n\nThe canvas tag can be used for drawing directly to the\
