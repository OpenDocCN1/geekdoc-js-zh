    \ new Friend(\"Jerriah N\", 1, false);\n    my_new_friend.SayHi();\n    my_new_friend2.SayHi();\n\
    \    my_new_best_friend.SayHi();\n\n</script>\n```\n\n## Advanced topic/ nice\
    \ to know info about functions\n\nA function is usually just some action you want\
    \ to do. For example: `Car.MoveForward()`, `Car.Stop()`, `Player.HitEnemy()`,\
    \ `TextField.CheckIfEmpty()`, `Data.SubmitToServer()`, `Computer.Restart()`, `Facebook.Open()`.\n\
    \nYou can call them multiple times, not send any additional information to them\
    \ if they don't need it, or pass information in to them if they need values to\
    \ do whatever you want them to do. For instance, if the player is supposed to\
    \ hit an enemy, you might want to pass in which enemy to hit, how much damage\
    \ the player is doing, what animation you want to play (if it's a magic or physical\
    \ attack).\n\nThe initial structure is based on whatever makes sense to you at\
    \ the time. If you have all the information in your class you need to run the\
    \ function (like make the player run), you don't have to pass anything. If you\
    \ want the player to run at different speeds, you can send what speed you want\
    \ him to run at, and pass it in as a parameter. It will all make sense/ become\
    \ easier the more you do it (like everything else, practice makes perfect).\n\n\
    Functions are also called \"methods\" in some languages - sometimes just when\
    \ they are inside a class. People use the terms interchangeably, depending on\
    \ the programming language. I prefer the term \"function\"- because they usually\
    \ do something/ provide some kind of function, but it's a matter of preference.\n\
    \n### Chapter example on github:\n\n[https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/4_Objects.html](https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/4_Objects.html)\n\
    \n# 5. Creating visuals\n\nHTML is known as 'Text Markup Language', and is used\
