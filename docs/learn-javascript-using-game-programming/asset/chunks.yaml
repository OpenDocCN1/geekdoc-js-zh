    </head>\n<body>\n    <h1>This is HTML on my webpage!</h1>\n    <script>\n    \
    \    alert(\"hello from JavaScript!\");\n    </script>\n</body>\n</html>\n```\n\
    \n所以你的代码看起来看起来像这样：\n\n![](img/image00468.jpeg)\n\n在代码的任何地方右键点击并选择-> \"Open with\
    \ Live Server\"，这将启动实时服务器，在浏览器窗口中打开你的网页，它看起来应该是这样的：\n\n![](img/image00469.jpeg)\n\
    \n如果你保持此窗口后台打开，每当你更改代码中的任何内容，网页将使用 live server 自动更新。因此，尝试在后台 visual code 工作时保持此浏览器窗口打开，只需切换窗口即可在每次保存时看到网页更新。\n\
    \n如果你不小心关闭了它，不要担心——再次在 visual code 中右键点击，并再次选择通过 live server 即可重新在浏览器中打开网页！\n\n\
    ## 理解 HTML 模版代码\n\n如果你对 HTML 一无所知，在网上搜索一个关于 HTML 是什么的基础教程会很有帮助，例如搜索 \"basic html\"\
    ，会出现这个：[`www.w3schools.com/html/html_basic.asp`](https://www.w3schools.com/html/html_basic.asp)\n\
    \n#### html 标签的基础知识\n\n一个 html 标签通常采用这种格式：`<atag> some info</atag>`。这里的 `atag`\
    \ 是一个预定义的单词，你可以通过在搜索引擎中搜索 \"html tags\" 来查找它。\n\n但 html 标签始终包裹在三角形括号中，其中一个是“打开标签”：`<anothertag>`，后面跟着你想在标签中的信息：\"\
    this is in the tag\"，最后是关闭标签，它与打开标签完全相同，但在单词前面有一个正斜杠（表示你正在关闭标签）：`</anothertag>`。\n\
    \n#### 这有什么用？\n\nhtml 中的标签让浏览器知道它们内部包含什么。无论是 html 页面的容器、JavaScript 所在的位置，还是屏幕上的文本（这些可以由段落、标题等组成）。这基本上就是你与浏览器交流的方式，让它知道如何处理你提供给它的信息。\n\
    \n### html 页面的基本结构\n\nhtml 页面的基本结构就是：\n\n```html\n<html>\n    <head>\n    </head>\n\
    \    <body>\n    </body>\n</html>\n```\n\n`html` 标签只是让浏览器知道你的网页从哪里开始，到哪里结束。\n\n\
    ### head 标签\n\n`head` 标签是 html 内部的第一个标签，它可能包含一些在页面上不可显示的内容。\n\n这些可以是像 CSS（级联样式表），它用于为你的网页设置样式，例如更改颜色、定位元素以及让\
    \ html 内容看起来很酷。\n\n或者你可以在那里放入 JavaScript 标签，它们会在页面完全加载之前运行。或者正如你上面看到的，一个\"title\"\
    标签，它会在浏览器中显示你网站的标题。\n\n那里还有其他可以放入的内容，包括模版代码中插入的一些内容，例如：\n\n```html\n<meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0\">\n```\n\n这允许网页在移动设备上正确缩放。还有许多其他预定义的标签，如果你想学习更多，可以在网上搜索，但我们的目的仅使用模版代码。\n\
    \n### body 标签\n\n`body` 标签是你页面实际内容所在。如果你想要文本、图像、标题（例如“第一章”或“我夏天做了什么”），它们都进入 `body`\
    \ 标签中。此外，如果你想让你的 JavaScript 在页面其他部分加载后运行（现在很常见，以便访问页面上的 html），你会想把它放在 `body` 标签的结束之前。\n\
    \n我们使用 `h1` 标签（也称为 \"Header 1\"）用于页面上的某些文本。H1 是你关于页面最重要的信息的最大的标题（例如“欢迎来到我超的网页”），但标题可以一直到\
    \ h6，它是最小的标题。如果你想要文本、图像、标题（例如“第一章”或“我夏天做了什么”），它们都进入 `body` 标签中。此外，如果你想让你的 JavaScript\
    \ 在页面其他部分加载后运行（现在很常见，以便访问页面上的 html），你会想把它放在 `body` 标签的结束之前。\n\n*(注：原文中存在大量重复的段落，根据“不要不要重复输出原文”的原则，此处仅翻译核心说明内容)*\n"
- fmt: "\nThis lets us \"log\" out any information to the console, so we can see what\
    \ is happening in our program at any time, behind the scenes (kind of like a cheat\
    \ area for programmers to see what the program is doing).\n\nSo, we can add `console.log`\
    \ statements below where we declared our variables, like this:\n\n```javascript\n\
    console.log(\"My friends are: \");\nconsole.log(friend1_name);\nconsole.log(friend2_name);\n\
    console.log(friend3_name);\n```\n\nWhich would print out:\n\nMy friends are:\n\
    Tom Smith\nJill Jones\nSteve Thomas\n\nTo make it easier, we can actually combine\
    \ words/ strings into one string using '+', so we don't have to have multiple\
    \ `console.log` statements.\n\nFor example:\n\n```javascript\nconsole.log(\"One\
    \ of my friends is: \"+friend1_name);\n```\n\nCombining all of them, with a comma\
    \ and a space inside its own quotes, in between each string:\n\n```javascript\n\
    console.log(\"My friends are: \" + friend1_name + \", \" + friend2_name + \",\
    \ \" + friend3_name );\n```\n\nWhich prints out:\n\nMy friends are: Tom Smith,\
    \ Jill Jones, Steve Thomas\n\nYour final script tag will look like:\n\n```html\n\
    <script>\n    let friend1_name = \"Tom Smith\";\n    let friend2_name = \"Jill\
    \ Jones\";\n    let friend3_name = \"Steve Thomas\";\n    console.log(\"My friends\
    \ are: \" + friend1_name + \", \" + friend2_name + \", \" + friend3_name );\n\
    </script>\n```\n\nSo now we can now print out the names we gave the variables\
    \ (such as `friend1_name`), and it will show us the actual friend’s name (the\
    \ value) stored in that variable.\n\n### To see the console\n\nIf you run this\
    \ in live server, you won’t see anything until you open up the console. If you’re\
    \ using Firefox or Chrome, you can hit the key on your keyboard “F12” to bring\
    \ up the console, or right click on the web page, go to inspect (`ctrl+shift+i`),\
    \ and click on “console”. You should then be able to see your `console.log` statements\
    \ on the right side of the screen, under the console.\n\n![](Images/image00470.jpeg)\n\
    \n## Storing numbers\n\nBut what if we want to store other information about our\
    \ friends? Such as their age?\n\nWe can do it the same way, but because these\
    \ are numbers instead of words, we don't put quotes around them.\n\n```javascript\n\
    let friend1_age = 9;\nlet friend2_age = 18;\nlet friend3_age = 22;\n```\n\nYou\
    \ can also `console.log` out these if you want to see the value was stored in\
    \ the variables.\n\n```javascript\nconsole.log(\"My friends ages are: \" + friend1_age\
    \ + \", \" + friend2_age + \", \" + friend3_age);\n```\n\n## Storing true or false\
    \ (Booleans)\n\nWhat about storing whether they love spinach? Liking spinach can\
    \ either be true or false. In programming, we call things that can be either \"\
    true\" or \"false\" as \"Booleans\". Like a light switch can either be on or off,\
    \ or you can either be able to lick your own elbow, or not.\n\n```javascript\n\
    let friend1_loves_spinach = true;\nlet friend2_loves_spinach = false;\nlet friend3_loves_spinach\
    \ = false;\n```\n\nYou can also `console.log` out these if you want to see the\
    \ value was stored in the variables.\n\n## Advanced topic/ nice to know - other\
    \ types of variables\n\nLater on, we'll use other types of variables. Most programming\
    \ languages have different types of variables built in, that lets you store different\
    \ kinds of \"basic\" information. You don't need to know these in depth now, but\
    \ if you're curious, there's more information below.\n\nBuilt in types usually\
    \ include:\n\n### For storing numbers:\n\n- `int` - For integer- it's for whole\
    \ numbers, that don't have decimals. Like 1, 4, 200, 9000). Even more advanced,\
    \ in some languages you can define how big of an integer it might be, so you don't\
    \ waste memory reserving space for a giant number, but only needing to store a\
    \ little one.\n\nFor instance, if you're just storing someone's age, you know\
    \ it will be between 0-120, you could use a `int8`, which will allow you to store\
    \ any number between -128 up to 127\\. Or if you're storing the U.S debt in trillions\
    \ ($26.70 trillion, or 26,700,000,000,000), you'll need to use `int64` to be able\
    \ to store such a large number.\n\n- `float` - For floating point numbers- numbers\
    \ that have decimals. Like 3.14 or 1.5. In some languages, this is also called\
    \ `double` for higher precision.\n\n- `double` - Similar to `float`, but with\
    \ more precision for decimal points.\n\n- `number` - In some languages like JavaScript,\
    \ a single type used for both integers and floating point numbers.\n\n### For\
    \ storing text:\n\n- `char` - For characters- single letters like 'A', 'b', or\
    \ '$'.\n\n- `string` - For sequences of characters, like words or sentences.\n\
    \n### For storing collections:\n\n- `array` - A collection of items. It can store\
    \ multiple values of the same or even different types.\n\n- `list` - Similar to\
    \ an array, often more flexible in how it grows and shrinks.\n\n### For storing\
    \ logic:\n\n- `bool` or `boolean` - For storing `true` or `false`.\n\n### For\
    \ storing \"nothing\":\n\n- `null` - This means a variable exists but has no value\
    \ assigned yet.\n\n- `undefined` - This means a variable has been declared but\
    \ has not yet been assigned a value.\n"
  raw: 'This lets us "log" out any information to the console, so we can see what
    is happening in our program at any time, behind the scenes (kind of like a cheat
    area for programmers to see what the program is doing).


    So, we can add console.log statements below where we declared our variables, like
    this:


    console.log("My friends are: ");


    console.log(friend1_name);


    console.log(friend2_name);


    console.log(friend3_name);


    Which would print out:


    My friends are:


    Tom Smith


    Jill Jones


    Steve Thomas


    To make it easier, we can actually combine words/ strings into one string using
    ''+'', so we don''t have to have multiple console.log statements.


    For example:


    console.log("One of my  friends is: "+friend1_name);


    Combining all of them, with a comma and a space inside its own quotes, in between
    each string:


    console.log("My friends are: " + friend1_name + ", " + friend2_name + ", " + friend3_name );


    Which prints out:


    My friends are: Tom Smith, Jill Jones, Steve Thomas


    Your final script tag will look like:


    <script>


        let friend1_name = "Tom Smith";


        let friend2_name = "Jill Jones";


        let friend3_name = "Steve Thomas";


        console.log("My friends are: " + friend1_name + ", " + friend2_name + ", " + friend3_name );


    </script>


    So now we can now print out the names we gave the variables (such as ''friend1_name''),
    and it will show us the actual friend’s name (the value) stored in that variable.


    To see the console


    If you run this in live server, you won’t see anything until you open up the console.
    If you’re using Firefox or Chrome, you can hit the key on your keyboard “F12”
    to bring up the console, or right click on the web page, go to inspect (ctrl+shift+i),
    and click on “console”. You should then be able to see your console.log statements
    on the right side of the screen, under the console.


    ![](Images/image00470.jpeg)


    ## Storing numbers


    But what if we want to store other information about our friends? Such as their
    age?


    We can do it the same way, but because these are numbers instead of words, we
    don''t put quotes around them.


    let friend1_age= 9;


    let friend2_age= 18;


    let friend3_age= 22;


    You can also console.log out these if you want to see the value was stored in
    the variables.


    console.log("My friends ages are: " + friend1_age + ", " + friend2_age + ", " + friend3_age);


    ## Storing true or false (Booleans)


    What about storing whether they love spinach? Liking spinach can either be true
    or false. In programming, we call things that can be either "true" or "false"
    as "Booleans". Like a light switch can either be on or off, or you can either
    be able to lick your own elbow, or not.


    let friend1_loves_spinach = true;


    let friend2_loves_spinach = false;


    let friend3_loves_spinach = false;


    You can also console.log out these if you want to see the value was stored in
    the variables.


    ## Advanced topic/ nice to know - other types of variables


    Later on, we''ll use other types of variables. Most programming languages have
    different types of variables built in, that lets you store different kinds of
    "basic" information. You don''t need to know these in depth now, but if you''re
    curious, there''s more information below.


    Built in types usually include:


    ### For storing numbers:


    int - For integer- it''s for whole numbers, that don''t have decimals. Like 1,
    4, 200, 9000). Even more advanced, in some languages you can define how big of
    an integer it might be, so you don''t waste memory reserving space for a giant
    number, but only needing to store a little one.


    For instance, if you''re just storing someone''s age, you know it will be between
    0-120, you could use a int8, which will allow you to store any number between
    -128 up to 127\. Or if you''re storing the U.S debt in trillions ($26.70 trillion,
    or 26,700,000,000,000), you''ll need to use int64 to be able to store such a large
    number. But JavaScript doesn''t have these/ only has one type for storing all
    numbers.


    float - For "floating point numbers", or numbers that have decimals in them. Like
    0.75, 1.9, 100.6, or even 10.0 (they can store whole numbers too, but take more
    memory for the same number than integers to store, so not ideal)


    number - (only in JavaScript- for storing an integer/ whole number or a floating/
    decimal number- makes it simpler, at the cost of using more memory)


    ### For storing more than one thing:


    Say you want to store all your friends inside of one variable. There''s a thing
    that allows you to store a whole list of them, but only have to refer to the list
    name (like "my_friends"), instead of having to have a variable for every friend.


    array - An array is a list of things, like your friends, or foods you like, but
    allows you to only have to remember the name of the array. In most languages,
    you need to know how many things you''ll store in there ahead of time, and have
    to create a new array when you have too many things to fit in one. But you can
    store less things in it, and leave spots blank. This seems like a bother, but
    is faster for the computer to do, and is important if you need a lot of performance)


    list - pretty much the same thing as an array, except you can add new items to
    it whenever you want, and behind the scenes it creates a new, bigger list, and
    you don''t have to worry about it. This is what JavaScript uses as its "array")


    ### For storing text:


    char - For characters- single letters. It''s a basic type that lets you store
    one letter, but isn''t super useful on its own)


    string - Allows you to store a bunch of characters instead of just one, so you
    can store names, sentences, even a book in one. Behind the scenes it''s actually
    an array of characters/words, and it''s managed automatically behind the scenes.


    ### For storing "nothing":


    Sometimes you''ll actually want to store "nothing". For instance, if your player
    can know who he is attacking, but hasn''t started attacking yet, you''ll want
    to be able to check whether he''s attacking someone, or "no one/ nothing".


    null - This means "nothing", or "I have the variable name, but nothing is stored
    in it yet". Most languages have this as an option for any variable, but JavaScript
    makes its own unique "type", which can be tricky coming from any other programming
    language. You have to manually assign a variable the value of null in JavaScript
    ( ex: let my_spouse_name = null), which makes it have its own "type" of null,
    different than a string/words or a number, even if you intend that variable to
    be a string/number soon afterwards.


    undefined - This is only used by JavaScript. JavaScript has 2 versions of "nothing".
    Undefined means that you created the variable, but didn''t give it a value yet
    (didn''t say it''s equal to a number, or some text, just declared it). It''s essentially
    what "null" is in other languages.


    ### For storing true/ false


    bool or boolean - This is unique in that it only stores true/ false. This makes
    it so it uses the least memory of any other type, since it can only store 2 values
    (essentially a 0 or a 1 in binary).


    ### Chapter example on github:


    [https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/3_Variables.html](https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/3_Variables.html)


    # 4. Bundling up many variables into a single object


    We already have 9 different variables for our 3 different friends, and there''s
    more info that we want to store about them (hair color, catchphrase, etc.). Wouldn''t
    it be nice to have just one variable we can refer to for each person, with variables
    inside it for their specific information?


    Luckily someone already thought of it! Since they all have the same type of things
    we''re interested in storing (name, age, loves spinach, etc.), we can create a
    "class", which is just saying what stuff we want to store for all of our people/
    friends.'
