  trans: "\n\n我们检查存储的宽度是否不再等于当前窗口宽度，这意味着他们调整了宽度（或旋转了手机），同时也检查高度是否可能发生了变化。如果其中任一条件为真，我们就会运行该语句内部的代码。\n\
    \n如果是这样，我们就把画布（canvas）设置为新的宽度和高度，遗憾的是，每当宽度和尺寸发生变化时，画布都会被擦除（因为它正在创建一个该尺寸的新图像以进行绘图）。\n\
    \n最后，我们存储当前的宽度和高度，以便将来可以再次检查它们是否会再次发生变化。\n\n现在我们实际上需要调用这个 `Resize()` 函数，它会检查窗口大小是否已更改，并调整画布的大小。因为画布纹理会被重新创建，并且最初是空的，所以我们希望在画布上绘制之前进行调整大小，这样如果它确实被调整了，之后会立即在其上绘制。\n\
    \n在 `Update` 中，调用 `UpdateGame` 之前：\n\n```\n…\nResize();\nUpdateGame(frame_delta_ms);\n\
    …\n```\n\n现在，如果你调整窗口大小，你会看到游戏完美地更新并调整大小！\n\n## 完整代码列表\n\n代码现在变得很长了，但我包含了它，以便在出现问题时你可以检查错误。你也可以在书籍的\
    \ GitHub 页面找到名为“6_Moving_sprites.html”的代码。\n\n**警告**：我没有对 HTML 标签进行完全缩进，否则代码列表前面会有过多的空白。但你应该始终在深入\
    \ HTML 标签、对象等等时进行缩进，以提高可读性（而且像 Python 这样的语言需要缩进并移除所有大括号，所以这是一个良好的习惯）\n\n```html\n\
    <html lang=\"en\">\n<head>\n <meta charset=\"UTF-8\">\n <meta http-equiv=\"X-UA-Compatible\"\
    \ content=\"IE=edge\">\n <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n <title>My JavaScript Game</title>\n <style>\n * {\n margin:0;\n\
    \ padding:0;\n font-family: Verdana, Geneva, Tahoma, sans-serif;\n}\n canvas {\n\
    \ display: block;\n}\n #game_container {\n position: relative;\n}\n #fps {\n position:\
    \ absolute;\n top:10px;\n right:10px;\n color:white;\n font-weight: 900;\n font-size:\
    \ 20px;\n text-shadow:2px  2px  0  black,\n 2px  -2px  0  black, \n -2px  -2px\
    \  0  black,\n -2px  2px  0  black;\n pointer-events: none;\n}\n </style> \n</head>\n\
    <body\n <div id=\"game_container\">\n <canvas></canvas>\n <p id=\"fps\">120</p>\n\
    \ </div>\n <script>\n class Friend {\nconstructor(their_name, their_age, their_loves_spinach,\
    \ their_eye_color, their_skin_color, their_hair_color, their_x_pos, their_y_pos)\
    \ {\n this.name = their_name;\n this.age = their_age;\n this.loves_spinach = their_loves_spinach;\n\
    \ this.eye_color = their_eye_color;\n this.skin_color = their_skin_color;\n this.hair_color\
    \ = their_hair_color;\n this.x_pos = their_x_pos;\n this.y_pos = their_y_pos;\n\
    \ console.log(\"A friend was created, with name: \"+this.name+\", age: \"+this.age+\"\
    , and loves spinach: \"+this.loves_spinach);\n console.log(\"And some facts about\
    \ them, eye color: \"+this.eye_color+\", skin color: \"+this.skin_color+\", hair\
    \ color: \"+this.hair_color+\", x and y: \"+this.x_pos+\", \"+this.pos_y);\n this.DrawFriend();\n\
    }\n SayHi() {\n console.log(\"Hi, my name is \"+my_new_friend.name +\", my age\
    \ is: \"+my_new_friend.age+\", and do I love spinach? \"+my_new_friend.loves_spinach+\"\
    .\");\n}\n DrawFriend() {\n // this is where we will start drawing our friend\n\
    \ //-------------------get the canvas stuff we need to be able to draw----------------\n\
    \ let my_canvas = document.querySelector(\"canvas\");\n let draw_context = my_canvas.getContext(\"\
    2d\");\n let ctx = draw_context;\n //-------------------draw the head----------------\n\
    \ // define width and height of head\n let width_head = 50;\n let height_head\
    \ = 60;\n ctx.fillStyle = this.skin_color;\n ctx.fillRect(this.x_pos, this.y_pos,\
    \ width_head, height_head);\n //-------------------draw the eyes----------------\n\
    \ // define width and height of eyes\n let width_eyes = 10;\n let height_eyes\
    \ = 15;\n // set the fill:\n ctx.fillStyle = this.eye_color;\n // define how offset\
    \ the eyes should be from the left and right side of the head\n let eye_x_offset\
    \ = 10;\n // define how offset the eyes should be from the top of the head\n let\
    \ eye_y_offset = 15;\n //-------------------draw the left eye, left corner, top\
    \ , width and height----------------\n ctx.fillRect(this.x_pos, this.y_pos, width_head,\
    \ height_head);\n```\n"
- fmt: "\n# 7. Adding player controls\n\nIt's kinda boring with our character just\
    \ moving to the right and offscreen. So, let’s make it so we can control them!\n\
    \nSince these days it's safe to assume someone either has a touch screen, or a\
    \ mouse, but might not have access to arrow keys/ WASD to move, we'll make our\
    \ character move based on where they tap on the screen.\n\n## Get touch/click\
    \ position\n\nFirst, we need to tell if they clicked/ touched on the canvas, and\
    \ where they did it. We'll want to handle clicks and touches in the same way,\
    \ so add the following:\n\nAt the bottom of our functions, below `function Resize()`:\n\
    \n```javascript\nfunction SetupInput()\n{\n    my_canvas.addEventListener(\"mouseup\"\
    , MouseUp);\n    my_canvas.addEventListener(\"touchend\", TouchUp);\n}\n```\n\n\
    This created the function `SetupInput`, which when called, will add an \"event\
    \ listener\" onto the `my_canvas` element.\n\nSIDE NOTE: For a full list of potential\
    \ events to listen for, you can look at: [https://www.w3schools.com/jsref/dom_obj_event.asp](https://www.w33schools.com/jsref/dom_obj_event.asp)\
    \ (or google \"JavaScript events\").\n\nThe two events we are interested in are\
    \ \"mouseup\", which is when someone had the mouse button down, but let go of\
    \ it (a click). We also want the same thing for touches, so use \"touchend\",\
    \ which is when someone was touching the screen, but stopped.\n\nThey will each\
    \ call their own function `MouseUp` and `TouchUp`, which will convert the touch\
    \ and mouse \"events\" they send to those functions, to points we can use to move\
    \ our character to.\n\nNext, above that, add the functions:\n\n```javascript\n\
    function MouseUp(event)\n{\n    let x_dest = event.clientX;\n    let y_dest =\
    \ event.clientY;\n    console.log(\"Mouse up at: x: \"+x_dest+\", y: \"+y_dest);\n\
    \    MoveMyPlayer(x_dest, y_dest)\n}\n\nfunction TouchUp(event)\n{\n    let x_dest\
    \ = event.changedTouches[0].clientX;\n    let y_dest = event.changedTouches[0].clientY;\n\
    \    console.log(\"Touch up at: x: \"+x_dest+\", y: \"+y_dest);\n    MoveMyPlayer(x_dest,\
    \ y_dest)\n}\n```\n\n`MouseUp` and `TouchUp` will be called from the event listeners/\
    \ they'll each get the x and y position of the click/ touch, and assign it to\
    \ the variables `x_dest` and `y_dest`, as in destination (the destination of where\
    \ we’ll want the player to move to).\n\nThe `clientX` and `Y` is just the touch/\
    \ click position, relative to the top left of the screen.\n\nThe touch function\
    \ is a little more complicated. We have to look at the \"changedTouches\" instead\
    \ of the \"touches\", because since it is when the person stops touching the screen,\
    \ if we had checked \"touches\", it would have shown nothing. We add `[0]` to\
    \ the end, which checks only the first touch point- since most screens support\
    \ up to 10 fingers being able to touch the screen at the same time.\n\nSIDE NOTE:\
    \ The variable `changedTouches` lets you look at all the fingers touching the\
    \ screen, so it is a list of fingers, or in programming terms, an \"array\" of\
    \ finger positions. We'll touch more on arrays/ being able to store multiple things\
    \ in one variable name later.\n\nFinally, we'll add a new function above these\
    \ ones:\n\n```javascript\nfunction MoveMyPlayer(x_dest, y_dest)\n{\n    //move\
    \ my_player/ timmy to the destination clicked\n    console.log(\"Moving my player\
    \ to destination: x: \"+x_dest+\", y: \"+y_dest)\n    if(timmy.SetDestination)\
    \ //just checking to see if the \"SetDestination\" function exists yet- which\
    \ doesn't at this point\n    timmy.SetDestination(x_dest, y_dest);\n}\n```\n\n\
    This just gets the x and y destination from either `TouchUp` or `MouseUp`, and\
    \ logs it out for now.\n\nLastly, you need to call the function. Below where you\
    \ create timmy, add the function call for `SetupInput`:\n\n```javascript\nlet\
    \ timmy = new Friend(\"Timmy Smith\", 16, true, \"rgb(0,0,255)\", \"rgb(209, 181,\
    \ 140)\", \"rgb(125, 60, 34)\", 20, 20);\nSetupInput();\n```\n\nIf you try it,\
    \ you should see the mouse click position being logged out from the functions,\
    \ both when using a touch screen or a mouse. If you click on the very top left\
    \ of the game, it should output a x and y position of close to \"0,0\", and if\
    \ you click on the bottom right, it should give a much bigger number/ the size\
    \ of your game (like 480x800 if you're in portrait mode, on that resolution screen).\n\
    \nWe’ll also set our player destination here, but still need to create the function\
    \ in our friend class.\n\n## Move character to click position\n\nNow that we know\
    \ where we want to move to, let's move our character there, when the screen has\
    \ been clicked/ touched!\n\nThis will be a bit long, since we'll be moving him\
    \ until he gets to his destination, and checking + moving in both x and y direction.\n\
    \nSo, in our \"Friend\" class \"constructor\", add the new variables on the bottom,\
    \ above the console.log statements:\n\n```javascript\n//for moving\nthis.x_dest=0;\n\
    this.y_dest=0;\nthis.moving_x=false;\nthis.moving_y=false;\nthis.move_speed= 0.2;\n\
    ```\n\nThis defines an x and y destination for our character to move to, whether\
    \ he's moving in the x or y direction, and how fast we want him to move (I set\
    \ it to 0.2 after testing, deciding what was a good speed, but a good default\
    \ is just 1). Next, we need to define the function to set the destination for\
    \ the friend, when the screen is clicked/ touched. So, add under the function\
    \ `SetDestination`:\n\n```javascript\nDestination(x_dest, y_dest)\n{\n    this.x_dest=x_dest;\n\
    \    this.y_dest=y_dest;\n    this.moving_x=true;\n    this.moving_y=true;\n}\n\
    ```\n\nThis will just get the mouse/touch point, set it to now moving. Next, we'll\
    \ actually make the functions to move him each frame if he has a destination.\n\
    \nSIDE NOTE: Adding to a variable using `+=`, `-=`, `++`, `--`: In the upcoming\
    \ code, I use shorthand you may not have seen. If you want to add something to\
    \ a variable, there are two ways of doing it. Longer way:\n\n```javascript\nlet\
    \ variable = 5;\nvariable = variable + 2;\n```\nOr shorter way:\n```javascript\n\
    let variable = 5;\nvariable += 2;\n```\n`+=` means \"add to itself\". Likewise,\
    \ you could do minus:\n\n```javascript\nlet variable = 5;\nvariable = variable\
    \ - 3;\n```\nOr shorter way:\n```javascript\nlet variable = 5;\nvariable -= 3;\n\
    ```\nAnd there are additional operators for just subtracting 1 at a time (since\
    \ you can go through items 1 at a time lot):\n\nLonger way:\n\n```javascript\n\
    let variable = 5;\nvariable = 1;\n```\nShorter way:\n```javascript\nvariable++;\n\
    ```\nYou're free to use either method, but once you become more used to the shorter\
    \ way, and can easily recognize it, it's faster and can be more readable (and\
    \ is the method I’ll be using).\n\nEND OF SIDE NOTE\n\nSo, in your friend class,\
    \ add the following below the `Draw` function:\n\n```javascript\nUpdate(delta_ms)\n\
    {\n    this.MoveToDest();\n}\n\nMoveToDest(delta_ms)\n{\n    if(this.moving_x)\n\
    \    {\n        if(this.x_dest>this.x_pos)\n        {\n            this.x_pos+=this.move_speed*delta_ms;\n\
    \            if(this.x_pos>=this.x_dest)\n            {\n                this.x_pos=this.x_dest;\n\
    \                this.moving_x=false;\n            }\n        }\n    }\n}\n```\n"
  raw: "# 7. Adding player controls\n\nIt's kinda boring with our character just moving\
    \ to the right and offscreen. So, let’s make it so we can control them!\n\nSince\
    \ these days it's safe to assume someone either has a touch screen, or a mouse,\
    \ but might not have access to arrow keys/ using WASD to move, we'll make our\
    \ character move based on where they tap on the screen.\n\n## Get touch/click\
    \ position\n\nFirst, we need to tell if they clicked/ touched on the canvas, and\
    \ where they did it. We'll want to handle clicks and touches in the same way,\
    \ so add the following:\n\nAt the bottom of our functions, below \"function Resize()\"\
    \n\nfunction SetupInput()\n\n{\n\n    my_canvas.addEventListener(\"mouseup\", MouseUp);\n\
    \n    my_canvas.addEventListener(\"touchend\", TouchUp);\n\n}\n\nThis created\
    \ the function \"SetupInput\", which when called, will add an \"event listener\"\
    \ onto the “my_canvas” element.\n\nSIDE NOTE: For a full list of potential events\
    \ to listen for, you can look at: [https://www.w3schools.com/jsref/dom_obj_event.asp](https://www.w3schools.com/jsref/dom_obj_event.asp)\
    \ (or google \"JavaScript events\").\n\nThe two events we are interested in are\
    \ \"mouseup\", which is when someone had the mouse button down, but let go of\
    \ it (a click). We also want the same thing for touches, so use \"touchend\",\
    \ which is when someone was touching the screen, but stopped.\n\nThey will each\
    \ call their own function \"MouseUp\" and \"TouchUp\", which will convert the\
    \ touch and mouse \"events\" they send to those functions, to points we can use\
    \ to move our character to.\n\nNext, above that, add the functions:\n\nfunction MouseUp(event)\n\
    \n{\n\n    let x_dest = event.clientX;\n\n    let y_dest = event.clientY;\n\n\
        console.log(\"Mouse up at: x: \"+x_dest+\", y: \"+y_dest);\n\n    MoveMyPlayer(x_dest, y_dest)\n\
    \n}\n\nfunction TouchUp(event)\n\n{\n\n    let x_dest = event.changedTouches[0].clientX;\n\
    \n    let y_dest = event.changedTouches[0].clientY;\n\n    console.log(\"Touch up at: x: \"\
    +x_dest+\", y: \"+y_dest);\n\n    MoveMyPlayer(x_dest, y_dest)\n\n}\n\n“MouseUp”\
    \ and “TouchUp” will be called from the event listeners/ they'll each get the\
    \ x and y position of the click/ touch, and assign it to the variables \"x_dest\"\
    \ and \"y_dest\", as in destination (the destination of where we’ll want the player\
    \ to move to).\n\nThe clientX and Y is just the touch/ click position, relative\
    \ to the top left of the screen.\n\nThe touch function is a little more complicated.\
    \ We have to look at the \"changedTouches\" instead of the \"touches\", because\
    \ since it is when the person stops touching the screen, if we had checked \"\
    touches\", it would have shown nothing. We add \"[0]\" to the end, which checks\
    \ only the first touch point- since most screens support up to 10 fingers being\
    \ able to touch the screen at the same time.\n\nSIDE NOTE: The variable \"changedTouches\"\
    \ lets you look at all the fingers touching the screen, so it is a list of fingers,\
    \ or in programming terms, an \"array\" of finger positions. We'll touch more\
    \ on arrays/ being able to store multiple things in one variable name later.\n\
    \nFinally, we'll add a new function above these ones:\n\nfunction MoveMyPlayer(x_dest, y_dest)\n\
    \n{\n\n    //move my_player/ timmy to the destination clicked\n\n    console.log(\"\
    Moving my player to destination: x: \"+x_dest+\", y: \"+y_dest)\n\n if(timmy.SetDestination)\
    \ //just checking to see if the \"SetDestination\" function exists yet- which\
    \ doesn't at this point\n\n timmy.SetDestination(x_dest, y_dest);\n\n}\n\nThis\
    \ just gets the x and y destination from either \"TouchUp\" or \"MouseUp\", and\
    \ logs it out for now.\n\nLastly, you need to call the function. Below where you\
    \ create timmy, add the function call for \"SetupInput\":\n\nlet  timmy = new\
    \  Friend(\"Timmy Smith\", 16, true, \"rgb(0,0,255)\", \"rgb(209, 181, 140)\"\
    , \"rgb(125, 60, 34)\", 20, 20);\n\nSetupInput();\n\nIf you try it, you should\
    \ see the mouse click position being logged out from the functions, both when\
    \ using a touch screen or a mouse. If you click on the very top left of the game,\
    \ it should output a x and y position of close to \"0,0\", and if you click on\
    \ the bottom right, it should give a much bigger number/ the size of your game\
    \ (like 480x800 if you're in portrait mode, on that resolution screen).\n\nWe’ll\
    \ also set our player destination here, but still need to create the function\
    \ in our friend class.\n\n## Move character to click position\n\nNow that we know\
    \ where we want to move to, let's move our character there, when the screen has\
    \ been clicked/ touched!\n\nThis will be a bit long, since we'll be moving him\
    \ until he gets to his destination, and checking + moving in both x and y direction.\n\
    \nSo, in our \"Friend\" class \"constructor\", add the new variables on the bottom,\
    \ above the console.log statements:\n\n//for moving\n\nthis.x_dest=0;\n\nthis.y_dest=0;\n\
    \nthis.moving_x=false;\n\nthis.moving_y=false;\n\nthis.move_speed= 0.2;\n\nThis\
    \ defines an x and y destination for our character to move to, whether he's moving\
    \ in the x or y direction, and how fast we want him to move (I set it to 0.2 after\
    \ testing, and deciding what I thought was a good move speed, but a good default\
    \ is just \"1\", and raising/ lowering it from there).\n\nNext, we need to define\
    \ the function to set the destination for the friend, when the screen is clicked/\
    \ touched. So, add under the function \"SayHi\":\n\nSetDestination(x_dest, y_dest)\n\
    \n{\n\n    this.x_dest=x_dest;\n\n    this.y_dest=y_dest;\n\n    this.moving_x=true;\n\
    \n    this.moving_y=true;\n\n}\n\nThis will just get the mouse/ touch point, set\
    \ it to the friends x and y destination, and set that it is now going to be moving.\n\
    \nNext, we'll actually make the functions to move him each frame if he has a destination\
    \ set. This is a long one, because we need to check if he's reached his destination,\
    \ in both directions:\n\nSIDE NOTE: Adding to a variable using \"operators\"+,-,\
    \ +=, +-, ++, --:\n\nIn the upcoming code, I use some shorthand code that you\
    \ may not have seen before.\n\nIf you want to add something to a variable, there\
    \ are two ways of doing it.\n\nThe longer way:\n\nlet some_variable = 5;\n\nsome_variable = some_variable +12; // so 5+12\n\
    \nconsole.log(some_variable); //some variable is now 5+12= 17\n\nOr a shorter\
    \ way:\n\nlet some_variable = 5;\n\nsome_variable += 12; // same thing- some variable +=, meaning \"\
    add to itself\"\n\nconsole.log(some_variable); //some variable is now 5+12= 17\n\
    \nSo \"+=\" just means \"add to the variable the amount on the right side\"\n\n\
    ADDITIONAL INFO:\n\nLikewise, you could also do minus:\n\nsome_variable = some_variable -3; // so 5-3\n\
    \nconsole.log(some_variable); //some variable is now 5-3=2\n\nsome_variable -= 3; // so 5-3\n\
    \nconsole.log(some_variable); //some variable is now 5-3=2\n\nAnd there are additional\
    \ operators for just adding or subtracting just 1 at a time (since you can go\
    \ through items 1 at a time a lot in programming):\n\nLonger way:\n\nsome_variable = some_variable +1; // so 5+1\n\
    \nconsole.log(some_variable); //some variable is now 5+1= 6\n\nShorter way:\n\n\
    some_variable++; // so 5+1\n\nconsole.log(some_variable); //some variable is now 5+1= 6\n\
    \nLonger way:\n\nsome_variable = some_variable -1; // so 5-1\n\nconsole.log(some_variable); //some variable is now 5-1= 4\n\
    \nShorter way:\n\nsome_variable--; // so 5-1\n\nconsole.log(some_variable); //some variable is now 5-1= 4\n\
    \nYou're free to use either method, but once you become more used to the shorter\
    \ way, and can easily recognize it, it's faster and can be more readable (and\
    \ is the method I’ll be using).\n\nEND OF SIDE NOTE\n\nSo, in your friend class,\
    \ add the following below the “DrawFriend” function:\n\nUpdate(delta_ms)\n\n{\n\
    \n    this.MoveToDest();\n\n}\n\nMoveToDest(delta_ms)\n\n{\n\n    if(this.moving_x)\n\
    \n    {\n\n        if(this.x_dest>this.x_pos)\n\n        {\n\n            this.x_pos+=this.move_speed*delta_ms;\n\
    \n            if(this.x_pos>=this.x_dest)\n\n            {\n\n                this.x_pos=this.x_dest;\n\
    \n                this.moving_x=false;\n\n            }\n\n        }\n\n        else //x_dest < x_pos -so need to move to the left/ -x\n\
    \n        {\n\n            this.x_pos-=this.move_speed*delta_ms;\n\n            if(this.x_pos<=this.x_dest)\n\
    \n            {"
