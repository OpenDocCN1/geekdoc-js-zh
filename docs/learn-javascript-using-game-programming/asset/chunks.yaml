    \n### GitHub 上的章节示例：\n\nhttps://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/5_Creating_visuals.html\n\
    \n# 6. 在屏幕上移动物体（精灵）\n\n让我们先从回到一个朋友开始，比如 Timmy，并移除其他所有（我目前也会移除 HTML 中的段落标签，这样它就不会出现在截图中）：\n\
    \n```javascript\nlet timmy = new Friend(\"Timmy Smith\", 16, true, \"rgb(0,0,255)\"\
    , \"rgb(209,181,140)\", \"rgb(125,60,34)\", 20, 20);\n```\n\n现在让 Timmy 移动到之前 Megan\
    \ 在下角的位置：\n\n```javascript\ntimmy.x_pos = 260;\ntimmy.y_pos = 120;\n```\n\n你会发现\
    \ Timmy 并没有实际上移动到我们放置的位置。那是因为在构造函数中，我们先设置了他的位置，然后绘制了他。所以，我们只需要重新绘制他，对吧？幸运的是，我们将所有朋友的绘制动作都放在了一个方便的函数\
    \ `DrawFriend()` 中。\n"
- fmt: "\nJavaScript has a built-in function to call any function you provide, whenever\
    \ it is able to update the screen, so that you can draw your next frame. This\
    \ is `window.requestAnimationFrame(my_update_function(current_time_in_ms))`.\n\
    \nAll you will do is call this, passing what function you want it to call whenever\
    \ it can render a frame, which will also automatically pass to your function a\
    \ time in milliseconds (`ms`- 1000th of a second, so 1000 of these make up one\
    \ second).\n\nYou will eventually want to use that time to figure out how much\
    \ time has passed since the previous update, so you can move things on the screen\
    \ at certain speeds, regardless of if it's running on a system doing 10fps or\
    \ 60fps.\n\nSo, we'll add before creating a friend:\n\n```javascript\nfunction\
    \ Update(time_ms)\n{\n    console.log(\"Update: \"+time_ms);\n    window.requestAnimationFrame(Update);//\
    \ have to request another frame, which will call this function again when it can\n\
    }\n\nwindow.requestAnimationFrame(Update); // request one frame\n```\n\nOur function\
    \ `Update` will be called whenever the browser can allow it to draw a new frame.\
    \ It will also pass a time in milliseconds, which once it calls it a 2nd time,\
    \ we can find how much time it took to ask for the second frame. But we also have\
    \ to call it again inside our update function, so it can wait for the next frame,\
    \ and call our function again. This will call out `Update function over and over\
    \ again, as long as the browser can render a frame, which we can use to update\
    \ our game.\n\nWhen you run that, you'll see that it outputs the time in milliseconds\
    \ (`ms`) to the console, and keeps increasing over time.\n\nWe now have a basic\
    \ update loop, and can tell the time of each frame.\n\nBut we need to take it\
    \ one step further, and see how much time has passed between each frame- which\
    \ will then allow us to move things on screen relative to the actual time that\
    \ has passed, which will let objects move at the same speed on low and high frames\
    \ per second.\n\nIf we move an object at 10px each frame, and it's running at\
    \ 1fps, it will only move 10px in 1 second. But if it's running on a faster computer\
    \ at 60fps, then it will run 60 frames/ updates in 1 second, each frame moving\
    \ 10px, so 600px! To make it move consistently across devices, you need to find\
    \ the time between updates also known as the difference in time, or delta time.\n\
    \nSo, update the code to:\n\n```javascript\nfunction Update(time_ms)\n{\n    let\
    \ frame_delta_ms = time_ms - last_time_ms; // #2 going to find the delta/difference\
    \ in time between the last frame (initially 0) and the current time\n    let delta_s\
    \ = frame_delta_ms / 1000; //since time is in ms (1 /1000 s), to convert to seconds,\
    \ divide by 1000, exp: 2000ms/ 1000 = 2s\n    let fps= 1 / delta_s; //we can convert\
    \ from seconds/frame (delta_s) to frames/ second by flipping it dividing 1 by\
    \ it- 1/ (seconds/frame) = frame/ second= fps\n    frame_delta_ms = frame_delta_ms.toFixed(2);\
    \ //going to round to just 2 decimal places using toFixed(2)\n    //so.... toFixed\
    \ which rounds a number, returns a string instead of a number.... so have to now\
    \ turn it back into a number... JavaScript... otherwise it counts as adding strings\
    \ together- so instead of 5+5 = 10, 5+5=55 -which is to 5s stuck together, instead\
    \ of added\n    frame_delta_ms = parseFloat(frame_delta_ms);\n    fps = fps.toFixed(2);\n\
    \    console.log(\"Update: delta time: \"+frame_delta_ms+\", fps: \"+fps);\n \
    \   last_time_ms=time_ms;\n    window.requestAnimationFrame(Update);\n}\nlet last_time_ms=0;\
    \ //1 \"creating last_time_ms\" first, which will exist outside of the function,\
    \ and record what the last update was called\nwindow.requestAnimationFrame(Update);\n\
    ```\n\nFirst, we declare a variable `last_time_ms` outside the function (on the\
    \ bottom), so it will exist outside of the function/ keep its value after the\
    \ function runs. Next we call the function `window.requestAnimationFrame`, passing\
    \ it our soon be created `Update` function. We create the `Update` function, but\
    \ say it will be passed something when `window.requestAnimationFrame` calls it.\
    \ That will be a time in `ms` since the page began. We don't really need this,\
    \ but by storing it at the end of each frame, we can take the difference between\
    \ the time the last frame was run, and the current one, which will give us a difference-\
    \ how long each frame is taking to be drawn.\n\nThis delta time/difference in\
    \ time is a bit hard to understand, so we first convert it to seconds by dividing\
    \ the milliseconds (`1ms =1000s`) by 1000, converting it into seconds (the time\
    \ difference in seconds, which will be small decimal, such as 0.016). Now we have\
    \ `seconds /frame`, but we want to flip it upside down to become `frame/second`\
    \ or `fps`. `1` divided by any fraction will flip it upside down, so we do `1/delta_s`\
    \ to have `fps`.\n\nWe round it to 2 decimal places because seeing 25 decimal\
    \ places isn't readable. The function `toFixed` is built into JavaScript, belonging\
    \ to the `number` type (so we just run it on our number to round it). For some\
    \ odd reason, rounding a number in JavaScript returns a string. It might look\
    \ like a number, but if you try to add it/ use it it will be combined as a string,\
    \ not as a number, so cause some strange bugs. For instance if it’s 5, adding\
    \ `5+5=10` as a number, but `5+5` as strings are `55`. So we have to convert our\
    \ rounded number back into a number using `parseFloat`. We can then `console.log`\
    \ out the `delta_ms`, and converted to `fps`, so we can check if `fps` is in a\
    \ normal range (0-60). We then store the current frame time, so we can find the\
    \ difference next time, and then ask for another frame (whenever it let us run\
    \ the `Update` function again).\n\n## Finally animating!\n\nSo now we actually\
    \ have a basic program/ game loop, we can then do things in there over time, which\
    \ will make it look like objects are smoothly moving. Above the `Update` function,\
    \ add a new function:\n\n```javascript\nfunction UpdateGame(delta_ms)\n{\n   \
    \ timmy.x_pos=timmy.x_pos+5; //moves timmy 5 pixels to the right each frame/ time\
    \ the function is called\n    ClearCanvas(ctx, \"rgba(0,0,255,255)\"); //clears\
    \ the canvas, so we don't get \"ghosting\"\n    timmy.DrawFriend(); //re-draw\
    \ Timmy\n}\n```\n\nIn `Update`, we'll call our `UpdateGame` function under the\
    \ `console.log`:\n\n```javascript\n...\nconsole.log(\"Update: delta time: \"+frame_delta_ms+\"\
    , fps: \"+fps);\nUpdateGame(frame_delta_ms);\n…\n```\n\nAnd lastly, we'll change\
    \ our code out for drawing Timmy, getting rid of the movement code:\n\n```javascript\n\
    let my_canvas = document.querySelector(\"canvas\");\nlet draw_context = my_canvas.getContext(\"\
    2d\");\nlet ctx = draw_context;\nlet timmy = new Friend(\"Timmy Smith\", 16, true,\
    \ \"rgb(0,0,255)\", \"rgb(209, 181, 140)\", \"rgb(125, 60, 34)\", 20, 20);\n```\n\
    \nIf you refresh the page, you can see Timmy moving quickly across the screen!\
    \ Refresh multiple times to see it if he leaves the screen too fast.\n\n## Emulating\
    \ low FPS to show movement without account for frame time\n\nAbove we're just\
    \ animating by moving 5 pixel every frame, but at 60fps, this is 300 pixels (5px/frame\
    \ * 60 frames/ second= 300px/second) moved every second (Timmy is 50 pixels wide,\
    \ so almost 6 Timmy widths moved every second). But if we're on a slow device\
    \ that's only running at 10fps, that means it will only move 50 pixels in a second,\
    \ so the game will actually move slower, characters will move slower, and people\
    \ will get super speeds on 120fps devices!\n\nSo, we want to change it to move\
    \ based on how much time has passed, not how many frames have passed. This will\
    \ make characters \"teleport\", or move less smoothly on low FPS devices, but\
    \ will allow people to play the game at the same speed on all sorts of devices.\n\
    \nWe'll first try to slow down the fps so we can see how it would move right now.\n\
    \nIn the `Update` function, change the bottom line to:\n\n```javascript\nsetTimeout(function(){window.requestAnimationFrame(Update)\
    \ }, 100);\n```\n"
