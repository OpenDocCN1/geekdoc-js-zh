    \ previous sprites.\n\n## Saving out the images\n\nI then went through each image,\
    \ and saved them each out with transparency, so I had a total of 18 images/frames\
    \ animations (2 frames x 3 directions x 3 animations =18).\n[/content] (Wait,\
    \ I noticed the output had some messy repetition in the draft. Let me provide\
    \ the final clean version based strictly on the provided text).\n\n*** (Wait，我发现我\
    \      抱歉，请忽略上面的重复说明，由于我出现了逻辑错误。 \n    以下是最终的排版结果：\n\n"
  raw: 'Then, we’re checking the left side to make sure it’s not below 0/ the left
    side of the level again, but if it is not, then we’re going to check to see if
    the right side is greater than the right side of the level. If it is, we’ll set
    the x of the camera back to the right edge of the screen, but also subtract out
    the width of our camera/window, so that our right side of the camera will be aligned
    with the right edge of the level.


    We then do the same thing for the bottom of the screen, making sure the bottom
    of our camera/ window will never go below the bottom of our level.


    And that’s it! If you play the game now, you’ll see that no matter where you move,
    you can’t see the background/ outside of our level.


    ![](Images/image00487.jpeg)


    Now we have a player that can be controlled, move around our world, and can’t
    move outside of our world. We can easily modify the size of the level by passing
    in how many screen widths and heights we want to use, and can make a super large
    level if we want. But right now, it’s kind of boring- everything is generated
    completely randomly, but we want to be able to have a place for a house, an NPC,
    an enemy, and an area to farm. So, let’s modify how we create the world, so that
    we’ll actually be able to create a static level, but still allow some randomness
    for each new game.


    ### Chapter example on github:


    [https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/10_Camera.html](https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/10_Camera.html)


    # 11. Creating more involved graphics


    We’re up to the point where we’ll need to be able to start breaking down rocks,
    cutting grass, chopping down trees, and attacking enemies in the future. So, we’re
    going to create graphics that will allow us to display:


    ● We’ll create our own unique character, which will allow us to add more animation
    types


    ○ One copy with short hair, one with long hair


    ○ Same size as our tiles (64px x 64px)


    ● Attacking/ harvesting animations


    ○ Attacking will use the same animations as harvesting


    ○ Tools that will need to be added include:


    ■ Hammer to break rock


    ■ Axe to break wood


    ■ Scythe to chop grass


    ■ Hoe to till dirt


    ■ Sword to attack enemies


    ○ A watering animation for watering plants


    ○ An eating animation for the player to regain health from plants


    ● Enemy graphic based off our player


    ● NPC graphic based off our player


    Creating artwork, even pixel art work is a lot of work and time. I created a sprite
    sheet of a character for use with this book. I wanted him to look like characters
    from other 2d RPG like games that are popular- Pokémon and Harvest Moon.


    The way I made the character was to create an ArtClash or Photoshop (or other
    art program) new project that was the size of our tiles (64x64), drew out roughly
    the head shape, body shape, etc. I pulled up sprite sheets by searching on google
    images for “pokemon sprite sheet” and “harvest moon sprite sheet”, and found a
    few good references to go off of.


    ## Idle animation


    I made the first drawing of the character that is at idle/ default position, modified
    that one to make one more idle frame (by moving his head and shoulders up one
    pixel- it’s hard to see in here, but easier when animated in the game).


    ![](Images/image00488.jpeg)![](Images/image00489.jpeg)


    ## Walking animation


    I then created 2 walking frames, by using the sprite sheets as reference, as well
    as looking up more references for “walk cycle” on google images. I mainly changed
    his arm positions around so they look like they swing back and forth between the
    2 frames, and moved his legs up and down, to make it look like they are going
    forward and backwards.


    ![](Images/image00490.jpeg)![](Images/image00491.jpeg)


    Usually if you want your animations to look better, you’ll want to spend time
    looking up what the basic “key poses” are for each type of animation cycle, starting
    with those, then deciding if you want to draw more frames in between the most
    important key poses, to have an even more fluid animation.


    I wanted him to also be able to swing a tool/ weapon, so I created a new layer,
    and created a basic looking scythe that he holds in his hands when idle. I knew
    that I wanted to layer the tool animation on top of the player animation, so I
    erased anywhere on the tool graphic where the player should show through (like
    showing his hands “over” the tool, by removing the pixels for the tool there,
    to look like the player''s hands are on top).


    I then copied it, and moved it up slightly for the second idle animation (the
    gaps below are where the player''s hands show through the tool to give it the
    illusion that the player''s hands are over the tool, even though the tool will
    be drawn over the player).


    ![](Images/image00492.jpeg)![](Images/image00493.jpeg)


    ## Harvesting/ attacking animation


    I also want the player to be able to harvest things, so I again copied the idle
    frame, and started changing it around to make it look like the player was harvesting.


    The most important frames are when the player draws the tool back, and when he
    has “chopped” forward (think of chopping with an axe, or swiping with a pole).


    So, I first put a new layer on top of that image, and drew the position I wanted
    the tool to be changed to when the character draws it back. I then went back to
    the characters layer, and started to move the hands + arms to be able to hold
    the tool, erasing parts of the tool that made sense to show the character holding
    onto it.


    I also tried to change his legs up on one side, down on the other, as if he was
    taking a step back when he was pulling the tool back. I also moved his eyes, and
    updated his face to look like he was turning his head slightly, along with the
    rest of his body.


    I then repeated it for the frame of when he brings the tool forward. I copied
    the idle character, I created a new layer over it for where the tool would be,
    drew in the tool, then updated the idle frame to now have the character leaning
    forward with the tool, to look like he finished swiping.


    ![](Images/image00494.jpeg)![](Images/image00495.jpeg)![](Images/image00496.jpeg)![](Images/image00497.jpeg)


    At this point I realized I would also need to make images/ frames for the walking
    animation, similar to the attack animation, so I repeated the above. I created
    a new layer above the first walking frame, drew in the tool, made sure it looked
    like it fit his hands, then repeated for the second walking animation.


    ## Making the other angles


    I then copied the idle frame, and started drawing in the face, and changing around
    the pants, to make it look like it was from a back view. I copied the other frames
    (both idles, walking, and harvesting), flipped them horizontally (since he’s now
    walking/ harvesting away from the camera), and started drawing in his body + face
    to look like it was the back of the character for all frames.


    I then had to do the same, but make a side view (supposed to be a side/ top view,
    but I need to practice perspective more to get it looking better in the future).
    I moved one eye over to one side, filled in the rest of the face, rotated the
    hair, and drew in places to look like it was more front facing. I had to draw
    in the body differently, and move the feet around to look like they were side
    by side, and kept every body part on a different layer, to allow me to rotate
    them for each animation, and fill in the parts that looked wrong manually.


    Finally I had a front, back, and side view finished. We can flip the side view
    to work for the left or right side, just like we did for previous sprites.


    ## Saving out the images


    I then went through each image, and saved them each out with transparency, so
    I had a total of 18 images/frames animations (2 frames x 3 directions x 3 animations
    =18).'
