  trans: "\n所以，如果你想停止画右眼来测试这个，只需在 `ctx.fillRect(40, 35, 10, 15);` 之前添加 `//`，它就会被“注释”掉，使其不再运行，但你作为人类仍然可以看到它。我将来会更多地使用这种方法，因为注释代码可以帮助你写下即将执行的操作，这样你就可以规划代码逻辑，或者允许你在回溯时，通过查看注释立即看到某行代码的作用。\n\
    \n## 我们必须做更多！\n\n现在，让我们尝试画一个嘴巴、鼻子、头发，也许还有一个身体、一些衣服，并对其他 20 个朋友做同样的事情。按照现在的方法会花费非常非常长的时间，而且我们会进行很多重复工作。如果有一种方法可以让我们重复做相同的事情，但又略有不同该怎么办？比如画一堆具有不同肤色和眼睛色的头部，我们通过某种方式向它们传递唯一值，这样只需要更改差异即可。\n\
    \n等等——我们已经学过函数了——所以这看起来是完成这项任务的正确工具！\n\n所以，让我们在 `Friend` 类中添加一些变量，让它们能够画出自己的头部并拥有自己的颜色。将我们的代码更改为：\n\
    \n```javascript\nclass Friend\n{\n    constructor(their_name, their_age, their_loves_spinach,\
    \ their_eye_color, their_skin_color, their_hair_color, their_x_pos, their_y_pos)\n\
    \    {\n      this.name = their_name;\n      this.age = their_age;\n      this.loves_spinach\
    \ = their_loves_spinach;\n      this.eye_color = their_eye_color;\n      this.skin_color\
    \ = this_skin_color;\n      this.hair_color = their_hair_color;\n      this.x_pos\
    \ = their_x_pos;\n      this.y_pos = their_y_pos\n      console.log(\"A friend\
    \ was created, with name: \"+this.name+\", age: \"+this.age+\", and loves spinach:\
    \ \"+this.loves_spinach);\n      console.log(\"And some facts about them, eye\
    \ color: \"+this.eye_color+\", skin color: \"+this.skin_color+\", hair color:\
    \ \"+this.hair_color+\", x and y: \"+this.x_pos+\", \"+this.y_pos);\n      this.DrawFriend();\n\
    \    }\n\n    SayHi()\n    {\n      console.log(\"Hi, my name is \"+this.name\
    \ +\", my age is: \"+this.age+\", and do I love spinach? \"+this.loves_spinach+\"\
    .\");\n    }\n\n    DrawFriend()\n    {\n      //this is where we will start drawing\
    \ our friend\n    }\n}\n```\n\n所以，我们刚刚向构造函数中添加了更多传递的内容——眼睛、肤色和头发颜色。我们也不希望所有的朋友都重叠在一起画，否则我们只能看到一个（最后一个画的或画在其他人上面的那个）。所以，我们还要提供一个\
    \ `x` 和 `y` 位置，以便将它们定位在画布内部。我们还记录了这些变量，以便我们知道它们被正确设置了。\n\n最后，我们将调用/执行我们的新函数 `DrawFriend()`。目前里面什么都没有，除了一个关于我们想要画出它们的注释。所以，我们将用之前已经做过的内容填充它，但使用我们为颜色和位置定义的变量。\n\
    \n## 创建 DrawFriend 函数：\n\n将 `DrawFriend()` 更新为：\n\n```javascript\nDrawFriend()\n\
    {\n  //this is where we will start drawing our friend\n  //---------------- 获取我们画图所需的画布相关内容\
    \ ----------------\n  let my_canvas = document.querySelector(\"canvas\");\n  let\
    \ draw_context = my_canvas.getContext(\"2d\");\n  let ctx = draw_context;\n  //----------------\
    \ 绘制头部 ----------------\n  // 定义头部的宽度和高度\n  let width_head = 50;\n  let height_head\
    \ = 60;\n  ctx.fillStyle = this.skin_color;\n  ctx.fillRect(this.x_pos, this.y_pos,\
    \ width_head, height_head);\n  //---------------- 绘制眼睛 ----------------\n  //\
    \ 定义眼睛的宽度和高度\n  let width_eyes = 10;\n  let height_eyes = 15;\n  // 设置填充样式：\n\
    \  ctx.fillStyle = this.eye_color;\n  // 定义眼睛距离头部左侧和右侧的偏移量\n  let eye_x_offset\
    \ = 10;\n  // 定义眼睛距离头部顶部的偏移量\n  let eye_y_offset = 15;\n  //--绘制左眼，左角，顶部，宽度和高度\
    \ --\n  ctx.fillRect(this.x_pos+eye_x_offset, this.y_pos+eye_y_offset, width_eyes,\
    \ height_eyes);\n  //--绘制右眼--\n  // 复杂得多——必须找到头部的右侧 (x_pos+width_head)，然后减去眼睛宽度加上眼睛的\
    \ x 偏移，以便眼睛的左侧远离头部的右侧\n  let right_side_of_head = this.x_pos+width_head;\n  let\
    \ right_x_pos = right_side_of_head-width_eyes-eye_x_offset;\n  ctx.fillRect(right_x_pos,\
    \ this.y_pos+eye_y_offset, width_eyes, height_eyes);\n}\n```\n\n哎呀，糟糕。我们只是向构造函数中传递了更多东西——眼睛、肤色和头发颜色。我们也不希望所有的朋友都重叠在一起画，否则我们只能看到一个（最后一个画的或画在其他人上面的那个）。所以，我们还要提供一个\
    \ `x` 和 `y` 位置，以便将它们定位在画布内部。我们还记录了这些变量，以便我们知道它们被正确设置了。\n\n最后，我们将调用/执行我们的新函数 `DrawFriend()`。目前里面什么都没有，除了一个关于我们想要画出它们的注释。所以，我们将用之前已经做过的内容填充它，但使用我们为颜色和位置定义的变量。\n\
    \n## 创建并绘制许多朋友：\n\n你现在可以调整头部宽度和高度，或者眼睛的宽度、高度和偏移量来改变脸部的布局。但现在我们可以轻松地画几个朋友：\n\n\
    ```javascript\n//创建三个新朋友：\n//传递的参数是：(their_name, their_age, their_loves_spinach,\
    \ their_eye_color, their_skin_color, their_hair_color, their_x_pos, their_y_pos)\n\
    let timmy = new Friend(\"Timmy Smith\", 16, true, \"rgb(0,0,255)\", \"rgb(209,\
    \ 181, 140)\", \"rgb(125, 60, 34)\", 20, 20);\nlet jackie = new Friend(\"Jackie\
    \ O\", 42, true, \"rgb(0,255,0)\", \"rgb(245, 215, 171)\", \"rgb(110, 9, 9)\"\
    , 100, 5);\nlet sha = new Friend(\"Shaun\", 30, true, \"rgb(1, 2, 3)\", \"rgb(79,\
    \ 48, 23)\", 20, 10);\nlet megan = new Friend(\"Megan\", 16, true, \"rgb(0,0,0)\"\
    , \"rgb(209, 181, 140)\", \"rgb(0, 0, 0)\", 260, 20);\n```\n\n如果你运行这段代码，你将看到许多具有不同眼睛和位置的脸！示例：`0473.jpeg`\
    \ 完整列表：\n\n```html\n<html>\n<head></head>\n<body>\n<p>这是我在网页上创建的一些文本</p>\n<canvas\
    \ style=\"border:1px solid green\"></canvas>\n<script>\n// Friend 类放在这里\n</script>\n\
    </body>\n</html>\n```\n\n"
