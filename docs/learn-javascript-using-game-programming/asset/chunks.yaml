    \ = this.x+window.innerWidth;\n\n let  bottom_side_of_screen = this.y+window.innerHeight;\n\
    \n if(this.x<0)\n\n this.x=0;\n\n else  if(right_side_of_screen > level.width)\n\
    \n this.x=level.width-window.innerWidth;\n\n if(this.y<0)\n\n this.y=0;\n\n else\
    \  if(bottom_side_of_screen > level.height)\n\n this.y=level.height-window.innerHeight;\n\
    \n    }\n\n}\n\nWe’re first storing the right and bottom of the screen (since\
    \ left and top are just the x and y). To find them, we just add the width of the\
    \ screen to the current x position, or the height of the screen to the current\
    \ y position."
