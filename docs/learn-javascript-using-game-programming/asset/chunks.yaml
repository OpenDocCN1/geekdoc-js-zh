    \ 64, 64, 1,1, 2, scale_my_player, 400);\n\n let  my_player_idle_U = new  FlipBookAnimation(my_player_img,\
    \ 64, 64, 3,4, 2, scale_my_player, 400);\n\n let  my_player_walk_U = new  FlipBookAnimation(my_player_img,\
    \ 64, 64, 1,5, 2, scale_my_player, 150);\n\n let  my_player_harvest_U = new  FlipBookAnimation(my_player_img,\
    \ 64, 64, 1,4, 2, scale_my_player, 400);\n\n let  my_player_idle_R = new  FlipBookAnimation(my_player_img,\
    \ 64, 64, 1,3, 2, scale_my_player, 400);\n\n let  my_player_walk_R = new  FlipBookAnimation(my_player_img,\
    \ 64, 64, 3,3, 2, scale_my_player, 150);\n\n let  my_player_harvest_R = new  FlipBookAnimation(my_player_img,\
    \ 64, 64, 3,2, 2, scale_my_player, 400);\n\n my_player.AddAnimation(my_player_idle_D,\
    \ Entity.STATE.IDLE, Entity.DIRECTION.DOWN);\n\n my_player.AddAnimation(my_player_walk_D,\
    \ Entity.STATE.WALKING, Entity.DIRECTION.DOWN);\n\n my_player.AddAnimation(my_player_harvest_D,\
    \ Entity.STATE.ATTACKING, Entity.DIRECTION.DOWN);\n\n my_player.AddAnimation(my_player_idle_U,\
    \ Entity.STATE.IDLE, Entity.DIRECTION.UP);\n\n my_player.AddAnimation(my_player_walk_U,\
    \ Entity.STATE.WALKING, Entity.DIRECTION.UP);\n\n my_player.AddAnimation(my_player_harvest_U,\
    \ Entity.STATE.ATTACKING, Entity.DIRECTION.UP);\n\n my_player.AddAnimation(my_player_idle_R,\
    \ Entity.STATE.IDLE, Entity.DIRECTION.RIGHT);\n\n my_player.AddAnimation(my_player_walk_R,\
    \ Entity.STATE.WALKING, Entity.DIRECTION.RIGHT);\n\n my_player.AddAnimation(my_player_harvest_R,\
    \ Entity.STATE.ATTACKING, Entity.DIRECTION.RIGHT);\n\n my_player.AddAnimation(my_player_idle_R,\
    \ Entity.STATE.IDLE, Entity.DIRECTION.LEFT);\n\n my_player.AddAnimation(my_player_walk_R,\
    \ Entity.STATE.WALKING, Entity.DIRECTION.LEFT);\n\n my_player.AddAnimation(my_player_harvest_R,\
    \ Entity.STATE.ATTACKING, Entity.DIRECTION.LEFT);\n\n sprites.push(my_player);\n\
    \n SetupInput();\n\n camera.Follow(my_player);\n\n}\n\nThe main things to note\
    \ are that the 2nd set of 2 numbers are the column (x) and row (y) that the animation\
    \ we’re looking for starts in (starting with x=1, y=1 being the top left). So,\
    \ I looked through the sprite sheet, and set the right starting frame for each\
    \ animation to be added.\n\nThe easier way to do this, as you get more and more\
    \ frames/ sprite sheets, is to use a “sprite atlas”. It’s basically the same thing\
    \ as a sprite sheet, but also includes a text file (in json or XML format), that\
    \ tells you which animation is at what spot in the image, so you don’t have to\
    \ do it manually (especially since the frame positions change in the sprite sheet\
    \ every time you add another frame!).\n\nIf you load it up now, you’ll see our\
    \ character in the game, complete with idle and walking animation!\n\n![](Images/image00501.jpeg)\n\
    \nWe can’t see the harvest animation yet, so let’s make it so when we press “spacebar”,\
    \ we can see it for now (later when we click on something we can harvest, we’ll\
    \ then play the harvest animation).\n\n## Seeing the harvest animation using spacebar\n\
    \nWe want to use the spacebar to play the harvest animation, so the first thing\
    \ we need to do is tell when the spacebar has been pressed. We already have a\
    \ function for setting up input: “SetupInput”, so change it as follows:\n\nfunction\
    \  SetupInput()\n\n{\n\n my_canvas.addEventListener(\"mouseup\", MouseUp);\n\n\
    \ my_canvas.addEventListener(\"touchend\", TouchUp);\n\n document.addEventListener(\"\
    keyup\", KeyUp);\n\n}\n\nWe’re just going to add another event listener, but this\
    \ time a “keyup” event (when any key on the keyboard has been pressed, and released),\
    \ and going to run a function we’ll create “KeyUp” when a keyup is fired.\n\n\
    So add the function above “SetupInput()”:\n\nfunction  KeyUp(event)\n\n{\n\n console.log(event.code);\n\
    \n}\n\nIf you run this now, and press your spacebar, you’ll see in the console\
    \ “Space”, when you press it. What is happening is that we get passed in the event\
    \ for any listener, in this case the event is a “KeyboardEvent”, and one of the\
    \ properties/ variables on the event object is “code”, which gives us the name\
    \ of the key that was involved in the event, in a human readable fashion. If you\
    \ press any other keys, you’ll also see their names printed out in the same way.\n\
    \nBut now we’ll actually want to change the state of “my_player” when the spacebar\
    \ has been pressed.\n\nfunction  KeyUp(event)\n\n{\n\n console.log(event.code);\n\
    \n if(event.code==\"Space\")\n\n my_player.ChangeState(Entity.STATE.ATTACKING);\n\
    \n}\n\nNow if you run this, you’ll see the player switch to the attacking/ harvesting\
    \ state when space has been pressed, and switch back to moving, or idle when you\
    \ move him.\n\nSo now we can move around the world, and use the harvesting tool.\n\
    \n### Chapter example on github:\n\n[https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/11_Making_Graphics.html](https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/11_Making_Graphics.html)\n\
    \n# 12. Conclusion\n\nSo now we have a game world we can move around, attack,\
    \ and later modify more. At this point you could add modified versions of the\
    \ player to use as NPC's or enemies. You could also create a predefined world,\
    \ so it isn't built randomly, or use a tool like \"Tiled\" ([http://mapeditor.org](http://mapeditor.org))\
    \ to visually create tile maps to use in the game.\n\nIf you'd like to see more\
    \ message me on twitter: [http://twitter.com/doomtoo](http://twitter.com/doomtoo).\n\
    \nI had planned to walk through creating a full \"Harvest Moon\" like game, but\
    \ wanted to put the book out to find if there is any interest in the area, before\
    \ investing more time (and potentially never having anyone read the book)."
