    ![](Images/cover00502.jpeg)


    # Learn JavaScript using Game Programming


    First Edition


    ## Learn the basics of programming and game development using vanilla JavaScript
    with the `canvas` tag.


    ## Chris Moeller


    # About the Author


    Chris Moeller was born in Mesa, Arizona. He''s been playing games since "Wolfenstein
    3d", and games like "Monuments of Mars". He originally started working on games
    by making 3d models in `3ds max`. He started programming using `C++` and `Java`,
    worked as an automation QA engineer, web developer, Flash developer, and has created
    cross platform games and apps for Android, iOS, and PC.


    He''s currently working on games and apps for the company he started with his
    wife and cats, Ackmi.com. He''s interested in creating fun games, and fun educational
    games, accessible to everyone in the future.


    # 1. Introduction


    ## What will you learn?


    You will learn the basics of programming, by creating a game from scratch using
    `JavaScript`. With this knowledge, you should be able to proceed to code your
    own games or apps, whether it be from scratch in another language/ library, or
    game engine.


    I won''t do a complete deep dive into all programming concepts, instead focusing
    on essentials needed to get the game created.


    We’ll be going through:


    - Setting up your development environment, and setting up a `HTML` + `JavaScript`
    main file.

    - Grabbing `HTML` elements from `JavaScript` and manipulating them

    - Using `canvas` to draw out the 2d game

    - Overview of programming concepts, such as variable types, `functions`, `classes`
    and objects

    - Game programming concepts such as drawing in 2d, game loops, getting player
    inputs, 2d animation, and more


    In the end, you''ll have a game loop created, draw the game using the `html-canvas`
    tag, and be able to control a player character that animates when moved. This
    should give you a good idea about how a game is created, and ideas about expanding
    what we create to make it into your own game.


    You can see all the example files for each chapter here:


    [https://github.com/doomtoo/Learn-to-code-games-using-JavaScript-Examples/](https://github.com/doomtoo/Learn-to-code-games-using-JavaScript-Examples/)


    ## Pros and Cons of using JavaScript


    `JavaScript` can be useful, but also has its own faults. Modern `JavaScript` is
    close enough to other languages, where by learning `JavaScript`, you can easily
    transition into other languages.


    `JavaScript`’s pros are:


    - It can be run on any device that supports a browser (and even without a browser
    using `node.js`)

    - It has become super versatile in recent years, and can be used in all stages
    of development, from adding interaction on websites, to being used on backend
    servers and storing information in databases, or connect people together in multiplayer
    games

    - Modern `JavaScript` now allows you to code in an intuitive, object-oriented
    way, and has basic error checking, making it much less frustrating than a few
    years ago

    - You can tie it into `HTML` and `CSS`, which makes it easy to layout graphics,
    UI, and animation


    `JavaScript`’s cons are:


    - It appears to be object oriented, but behind the scenes, everything is actually
    a `function`, which can cause some odd errors compared to true object-oriented
    languages, but is mostly hidden using modern coding techniques

    - `JavaScript` maintains backwards compatibility to a fault. A lot of the unusual
    parts of the language have stuck around forever, and there have been many languages
    that have sought to replace it with something better. But none have been fully
    adopted, so `JavaScript` still exists, keeping much of what was included in its
    10-day inception. It used to be very painful to create complex applications in,
    but modern syntax seeks to alleviate many of the pain points


    Conclusion:


    `JavaScript` is relatively easy to get started with. It doesn''t have as many
    rules as other languages, which can allow you to get started faster, but have
    a harder time tracking down errors. It''s not perfect, but it''s a great language
    to start with, and these days you can develop anything in it, as well as use that
    knowledge to learn other languages.


    ## What you need to follow along


    Recommended requirements:


    - A computer that you can install `visual code` on (PC, mac, Linux, raspberry
    pi): [https://code.visualstudio.com/](https://code.visualstudio.com/)

    - Install `live server` from the extensions inside `visual code`. This will allow
    you to right click in your file, and launch it with `live server` to see it in
    the browser.

    - Everything used is FREE and open source.


    NOTE: `visual code` is different from `visual studio`. It''s much leaner, faster,
    and doesn''t require multiple restarts and gigs to download.


    ## What we’re going to make / project planning


    One good habit to get into is trying to plan out your projects upfront as much
    as you can, to have an idea of what tasks you’ll need to do to arrive at your
    final product.


    For this book, my goals are:


    - To allow you to learn the basics of programming, while also learning the basics
    of what is required to make a game

    - Make the game relatable to games you may have played and enjoyed

    - To include game development concepts that could be used to make any game (2d
    and later applicable to 3d)

    - Not completely finish the game (so you can modify to make it into your own game)

    - Provide concepts that allow you to create completely different games than the
    one created in the book


    So, the “elevator pitch” of what I would like to do, as a basic version of the
    game:


    A game where you move a character around in a 2d, tile based, side scrolling world.


    Project planning is something you attempt to do upfront with the knowledge you
    have, but it will always change/grow as you work through projects. This should
    refresh the window, showing your project folder on the left-hand side, with a
    blank grey window below it. Right click in the blank area below your folder name
    ("my_javascript_game"), and select "new file", and type in: `index.html`. Alternatively,
    the button next to your folder name also lets you create a new file. In the next
    chapter, we’ll look at setting up our environment.


    # 2. Setting up your environment & boilerplate code


    ## Setting up Visual Code


    Go to [https://code.visualstudio.com/](https://code.visualstudio.com/) and download
    and install `visual code` for your operating system (Windows, Mac, Linux)


    ![](Images/image0462.jpeg)


    Next, start up `visual code`, click on the bottom left set of boxes (extensions,
    or hit `ctrl+shift+X` on PC, `command+shift+x` on mac), search for `live server`,
    and click the blue button to install `live server` in `visual code`.


    ![](Images/image0463.jpeg)


    `live server` needs you to open a folder in `Visual Code`, where you''ll have
    all project files located, which will allow it to launch a quick web server from
    the folder.


    Side Note: Don''t worry, no one online can access the server, unless you open
    ports on your router to forward requests to your computer, which is a topic out
    of scope for this project.


    Finally, we''ll need to go to the top left `File->Open Folder`. Choose a place
    where you want your project to go on your hard drive. For instance, click on desktop
    on the left side. On the right-hand side, right click in an empty area-> `New->Folder`->
    name the folder `my_javascript_game`, and click `select folder` on the bottom
    to use this folder.


    ![](Images/image0464.jpeg)


    This should refresh the window, showing your project folder on the left-hand side,
    with a blank window below it. Right click in the blank area below your folder
    name (`my_javascript_game`), and select "new file", and type in: `index.html`.
    Alternatively, the button next to your folder name also lets you create a new
    file.


    ![](Images/image0465.jpeg)


    Now we just need to set up some boilerplate code in our `index.html`, so we can
    see our file rendered in our browser.


    On line 1, type out: `htm` and it should popup a drop down with 3 options in it
    (if not, hit `ctrl+space` to bring up autocomplete/ IntelliSense).


    ![](Images/image0466.jpeg)

