  trans: "\n\n# 7. 添加玩家控制\n\n如果我们的角色只是向右移动并移出屏幕，那有点无聊。所以，让我们变得能够控制他们吧！\n\n考虑到在如今，可以假设用户要么拥有触摸屏，要么有鼠标，但可能无法使用方向键/\
    \ WASD 键移动，因此我们将让角色根据他们在屏幕上轻点的位置进行移动。\n\n## 获取触摸/点击位置\n\n首先，我们需要判断他们是否点击/触摸了画布（canvas），以及是在哪里点击。我们希望以相同的方式处理点击和触摸，因此添加以下内容：\n\
    \n在我们的函数底部，`function Resize()` 下方：\n\n```javascript\nfunction SetupInput()\n{\n\
    \    my_canvas.addEventListener(\"mouseup\", MouseUp);\n    my_canvas.addEventListener(\"\
    touchend\", TouchUp);\n}\n```\n\n这创建了 `SetupInput` 函数，调用它时，它会在 `my_canvas` 元素上添加一个“事件监听器”。\n\
    \n注：关于可以监听的潜在事件完整列表，你可以查看：[`www.w3schools.com/jsref/dom_obj_event.asp`](https://www.w33schools.com/jsref/dom_obj_event.asp)（或搜索\
    \ \"JavaScript events\"）。\n\n我们感兴趣的两个事件是 \"mouseup\"，即有人按下了鼠标按钮但松开了它（一次点击）。我们也希望对触摸执行相同的操作，所以使用\
    \ \"touchend\"，即某人正在触摸屏幕但停止了。\n\n它们将分别调用各自的函数 `MouseUp` 和 `TouchUp`，这些函数会将发送给它们的触摸和鼠标“事件”转换为我们可以用于移动角色的坐标点。\n\
    \n接下来，在它们上方添加这些函数：\n\n```javascript\nfunction MouseUp(event)\n{\n    let x_dest\
    \ = event.clientX;\n    let y_dest = event.clientY;\n    console.log(\"Mouse up\
    \ at: x: \"+x_dest+\", y: \"+y_dest);\n    MoveMyPlayer(x_dest, y_dest)\n}\n\n\
    function TouchUp(event)\n{\n    let x_dest = event.changedTouches[0].clientX;\n\
    \    let y_dest = event.changedTouches[0].clientY;\n    console.log(\"Touch up\
    \ at: x: \"+x_dest+\", y: \"+y_dest);\n    MoveMyPlayer(x_dest, y_dest)\n}\n```\n\
    \n`MouseUp` 和 `TouchUp` 将从事件监听器调用；它们将分别获取点击/触摸的 x 和 y 位置，并将其赋值给变量 `x_dest` 和 `y_dest`，代表目的地（我们希望玩家移动到的终点）。\n\
    \n`clientX` 和 `Y` 仅仅是触摸/点击位置，相对于屏幕左上角的坐标。\n\n触摸函数稍微复杂一点。我们必须查看 \"changedTouches\"\
    \ 而不是 \"touches\"，因为这是用户停止触摸屏幕的时刻，如果我们检查 \"touches\"，它将不会显示任何内容。我们在末尾添加 `[0]`，这只检查第一个触摸点——因为大多数屏幕支持同时有\
    \ 10 个手指触摸屏幕。\n\n注：变量 `changedTouches` 允许你查看所有触摸屏幕的手指，所以它是手指列表，用编程术语说，就是手指位置的“数组”。我们稍后会讨论数组/以及在一个变量名中存储多个事物。\n\
    \n最后，我们将在这些函数上方添加一个新函数：\n\n```javascript\nfunction MoveMyPlayer(x_dest, y_dest)\n\
    {\n    //move my_player/ timmy 到点击的目的地\n    console.log(\"Moving my player to\
    \ destination: x: \"+x_dest+\", y: \"+y_dest)\n    if(timmy.SetDestination) //只是检查\
    \ \"SetDestination\" 函数是否已经-目前还没有\n    timmy.SetDestination(x_dest, y_dest);\n\
    }\n```\n\n这只是从 `TouchUp` 或 `MouseUp` 获取 x 和 y 目的地，并目前仅将其记录下来。\n\n最后，你需要调用该函数。在创建\
    \ timmy 的地方下方，添加 `SetupInput` 的函数调用：\n\n```javascript\nlet timmy = new Friend(\"\
    Timmy Smith\", 16, true, \"rgb(0,0,255)\", \"rgb(209, 181, 140)\", \"rgb(125,\
    \ 60, 34)\", 20, 20);\nSetupInput();\n```\n\n如果你尝试一下，你应该能看到无论使用触摸屏还是鼠标，函数中都输出了鼠标点击位置。如果你点击游戏的最左上角，它应该输出接近\
    \ \"0,0\" 的 x 和 y 位置；如果你点击右下角，它应该给出一个大得多的数字/游戏的大小（如果你在竖屏模式的该分辨率上，类似于 480x800）。\n\
    \n我们在这里也会设置玩家目的地，但仍需要在 `friend` 类中创建该函数。\n\n## 将角色移动到点击位置\n\n现在我们知道想要移动到哪里了，当屏幕被点击/触摸时，让我们把角色移动到那里！\n\
    \n这将有点长，因为我们将一直移动他直到他到达目的地，并在 x 和 y 方向上进行检查+移动。\n\n所以，在我们的 \"Friend\" 类构造函数中，在\
    \ `console.log` 语句上方添加这些变量：\n\n```javascript\n//移动中\nthis.x_dest=0;\nthis.y_dest=0;\n\
    this.moving_x=false;\nthis.moving_y=false;\nthis.move_speed= 0.2;\n```\n\n这定义了角色移动的\
    \ x 和 y 目的地，以及他移动的速度（测试后我设置为 0.2）。接下来，我们需要定义在屏幕被点击/触摸时设置目的地的函数。所以，在 `SetDestination`\
    \ 下添加：\n\n```javascript\nDestination(x_dest, y_dest)\n{\n    this.x_dest=x_dest;\n\
    \    this.y_dest=y_dest;\n    this.moving_x=true;\n    this.moving_y=true;\n}\n\
    ```\n\n这将获取鼠标/触摸点，并将其设置为现在移动中。接下来，我们将实际实现在有目的地时每帧让他移动的函数。\n\n注：使用 `+=`、`-=`、`++`、`--`\
    \ 操作变量：在接下来的代码中，我使用了你可能没过的简写。如果你想给一个变量增加值，有两种方法。较长的方法：\n\n```javascript\nlet variable\
    \ = 5;\nvariable = variable + 2;\n```\n较短的方法：\n\n```javascript\nlet variable =\
    \ 5;\nvariable += 2;\n```\n`+=` 意味着“加上自身”。同样，你可以做减法：\n\n```javascript\nlet variable\
    \ = 5;\nvariable = variable - 3;\n```\n较短的方法：\n\n```javascript\nlet variable =\
    \ 5;\nvariable -= 3;\n```\n还有额外的只需每次减 1 的运算符（因为你可以一次处理很多 1 个的项目）：\n\n较长的方法：\n\n\
    ```javascript\nlet variable = 5;\nvariable = 1;\n```\n较短的方法：\n\n```javascript\n\
    variable++;\n```\n你可以自由使用任何方法，但一旦你更习惯简写，并能够轻松识别它，它会更快且更具可读性（这也是我将使用的方法）。\n\n注结束\n\
    \n所以，在你的 `friend` 类中，在 `Draw` 函数下方添加以下内容：\n\n```javascript\nUpdate(delta_ms)\n\
    {\n    this.MoveToDest();\n}\n\nMoveToDest(delta_ms)\n{\n    if(this.moving_x)\n\
    \    {\n        if(this.x_dest>this.x_pos)\n        {\n            this.x_pos+=this.move_speed*delta_ms;\n\
    \            if(this.x_pos>=this.x_dest)\n            {\n                this.x_pos=this.x_dest;\n\
    \                this.moving_x=false;\n            }\n        }\n    }\n}\n```\n\
    \n"
- fmt: "\n```javascript\nthis.x_pos=this.x_dest;\nthis.moving_x=false;\n}\n}\n}\n\
    if(this.moving_y)\n{\n    if(this.y_dest>this.y_pos) // if dest is greater, move\
    \ him down, where y increases\n    {\n        this.y_pos+=this.move_speed*delta_ms;\n\
    \        if(this.y_pos>=this.y_dest)\n        {\n            this.y_pos=this.y_dest;\n\
    \            this.moving_y=false;\n        }\n    }\nelse //y_dest < y_pos -so\
    \ need to move upward/ -y\n    {\n        this.y_pos-=this.move_speed*delta_ms;\n\
    \        if(this.y_pos<=this.y_dest)\n        {\n            this.y_pos=this.y_dest;\n\
    \            this.moving_y=false;\n        }\n    }\n}\n```\n\nHere, we first\
    \ create our own `Update` function inside of `Friend`, so it can be updated from\
    \ the main game on its own, and can do more complicated things in the future.\n\
    \nNext, we'll create the `MoveToDest` function, to check if we have an x or y\
    \ destination set, and to move it depending on where the destination is. We basically\
    \ just copy the same movement code for moving in the x direction as we do for\
    \ moving in the y direction.\n\nFirst we check if it is moving in the `x_dir`:\
    \ `if(this.moving_x)`. If it is, we'll look into how to move it, afterwards, we'll\
    \ check if it has a destination set in the y direction.\n\nBut say it is moving\
    \ in the x_direction, we'll check if the `x_dest` is greater than the current\
    \ position `if(this.x_dest>this.x_pos)`, which means our x_destination is to the\
    \ right, so we need to add some value to our current position to move it to the\
    \ right `this.x_pos+=this.move_speed*delta_ms;`.\n\nIf instead the `x_dest` is\
    \ to the left, it will be less than the current `x_pos` (`else //x_dest < x_pos\
    \ -so need to move to the left/ -x`), so we'll do the same thing, but subtract\
    \ based on the speed `this.x_pos -= this.move_speed*delta_ms;`.\n\nSo that will\
    \ allow us to move him right or left, but we'll also check if he needs to move\
    \ up or down, and move him the exact same way, changing out x for y, but otherwise\
    \ doing the exact same thing.\n\nFinally, we need to change the `UpdateGame` code\
    \ to not move our friend automatically, but to also update him in case he did\
    \ get a destination to move to.\n\n```javascript\nfunction UpdateGame(delta_ms)\n\
    {\n    ClearCanvas(ctx, \"rgba(0,0,255,255)\"); //clears the canvas, so we don't\
    \ get \"ghosting\"\n    timmy.Update(delta_ms);\n    timmy.DrawFriend();\n}\n\
    ```\n\nSo now that we have our character moving, lets create a world for them\
    \ to move around.\n\n## Full code listing\n\nYou can also find the code up on\
    \ the books page as `7_Player_controls.html`.\n\n```html\n<head>\n<style>\n* {\n\
    \    margin:0;\n    padding:0;\n    font-family: Verdana, Tahoma, sans-serif;\n\
    }\ncanvas {\n    display: block;\n}\n#game_container {\n    position: relative;\n\
    \    display: inline-block;\n}\n#fps {\n    position: absolute;\n    top:10px;\n\
    \    right:10px;\n    color:white;\n    font-weight:900;\n    font-size:20px;\n\
