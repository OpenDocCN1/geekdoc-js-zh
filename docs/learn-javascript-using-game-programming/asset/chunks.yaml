  trans: "\n```javascript\ntiles.push(new Tile(x*tile_creator.width_tile, y*tile_creator.height_tile,\
    \ type, tile_creator.GetTileImage(type)));\n}\n}\n```\n\n首先，我们将根据拥有的“1”的数量来获取一个随机磁块类型。你得从内向外地阅读这行代码。\n\
    \n`Math.random` 是一个函数，它可以找到一个 0 到 1 之间的随机小数，但它实际上不包含 1。如果我们将它乘以最后一个磁块数量 `+1`，它将是\
    \ 0 到我们最后一个磁块之间的任何数字（0, 1, 2, 3 或 4）。由于它是一个小数，而我们的 ID 是整数，所以我们必须对其进行“`math.floor`”处理，即将小数部分向下取整得到一个整数。\n\
    \n接下来，我们创建磁块，同时向它传递磁块类型，并根据该类型获取磁块的图像。\n\n最后，我们需要更改绘制磁块的方式，以便看到不同的图像。在 `UpdateGame`\
    \ 函数中，更改磁块的绘制代码：\n\n```javascript\nfor (let i=0; i < tiles.length; i++) {\n  \
    \  tiles[i].Draw(ctx);\n}\n```\n\n如果你保存并刷新页面，你将看到所有不同的磁块类型都填充在屏幕上！但现在看起来看起来很乱。你可以多次刷新页面，地图每次都会变化。但它看起来太随机了，所以我们应该努力让它看起来更好看一点。\n\
    \n![](img/image00477.jpeg)\n\n首先，让我们更改一下磁块的绘制代码，以便我们更容易地区分草地、石块和灌木。\n\n将你的石块图像生成代码替换为：\n\
    \n```javascript\nCreateStoneTileImage(tile_canvas, tile_ctx) {\n    let medium_grey\
    \ = \"rgb(99, 99, 99)\";\n    let dark_grey = \"rgb(70, 70, 70)\";\n    let light_grey\
    \ = \"rgb(170, 170, 170)\";\n    tile_ctx.fillStyle = medium_grey;\n    tile_ctx.beginPath();\n\
    \    //format for arc(angles in \"radians\"/ Math.PI): arc(x, y, radius, startAngle,\
    \ endAngle)\n    tile_ctx.arc(this.width_tile*.5, this.height_tile*.5, this.width_tile*.5,\
