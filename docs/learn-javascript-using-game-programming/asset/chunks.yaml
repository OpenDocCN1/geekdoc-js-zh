    image/png\");\n```\n\n![](image0480.jpeg\n\nIt’s a lot more code (9 total paths),\
    \ but looks a lot nicer. You could play with any of the graphics in Inkscape to\
    \ generate more complicated graphics, but we’ll try to keep it to a minimum, to\
    \ finishing the game. We’re getting to the point that it might be worth creating\
    \ the graphics for the tiles in a rasterization program (using pixels, not vector),\
    \ such as Photoshop.\n\n## Creating and loading graphics using a paint program\n\
    \nI’ll provide a link to the finished graphics on github so you can load them\
    \ into your game remotely, or you could just keep the vector based graphics in\
    \ the game. I’m going to remake all the tiles in a rasterization program, like\
    \ Photoshop. You’ll want to create a new image, 64x64, then begin painting in\
    \ it. I’ll start with the dirt tile, making the whole background a medium brown.\
    \ Then I put in darker areas to be mud clumps, add shadows on the bottom, highlights\
    \ on the top. I did a similar technique for all the tiles. The grass I used a\
    \ brush which makes grass like blades everywhere, alternating between a lighter\
    \ and darker green. I saved the images in a sub folder, `assets/imgs`, and all\
    \ the images inside of it. Create a new folder in your project called `assets`,\
    \ and inside of that a new folder called `imgs`. Go to the github, and download\
    \ the images and save them in your project into the folder you created: `assets/imgs`.\n\
    \n## Loading images from file\n\nTo load our rasterized graphics, we’re going\
    \ to have to add some new code to load the images before displaying them in the\
    \ game. I’ve got to warn you, this is a long one. We’re going to create a new\
    \ class under our previous classes named `AssetLoader`:\n\n```javascript\nclass\
    \ AssetLoader {\n  constructor() {\n    this.callback = null;\n    this.image_containers\
    \ = new Array();\n  }\n  // put images in an array ready to be loaded\n  AddImageToQueue(name,\
    \ src) {\n    let img_container = new Object();\n    img_container.src = src;\n\
    \    img_container.name = name;\n    img_container.loaded = false;\n    img_container.image\
    \ = new Image();\n    this.image_containers.push(img_container);\n  }\n} // end\
    \ of class AssetLoader\n```\n\nIn the constructor, we’ll have a `callback` variable-\
    \ which is a function we will call when all of our images load. That way we can\
    \ fire a function whenever all the images have finished loading. We’ll also create\
    \ an array that we will store all of our `images` in.\n\nNext, we’ll create a\
    \ function called `AddImageToQueue`, which will take a name for the image to be\
    \ identified with (like `dirt` or `stone`), and an actual source path/path from\
