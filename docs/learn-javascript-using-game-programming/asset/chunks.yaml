    But so far this doesn’t really save us time using the array, since we’re still
    only printing out 5 tiles. So, let’s start optimizing based on the DRY principle.


    ## Loops to go through arrays, and limit repetitiveness


    When you have to do something repetitive like this, you can usually replace it
    while using a “loop”, to loop through each item, one by one, first to last.


    The basis loop is called a “while” loop- it keeps going through the same bit of
    code, over and over again until a “if” condition is met. So at the bottom of your
    program, in a temp area we’ll print out counting 1 to 5 how we currently know
    how to do it:


    console.log("counting number: "+0);


    console.log("counting number: "+1);


    console.log("counting number: "+2);


    console.log("counting number: "+3);


    console.log("counting number: "+4);


    Repetitive, huh?


    Well, lets replace it with a while loop:


    let count=0;


    while(count < 5)


    {


        console.log("counting number: "+count);


        count++;


    }


    While loops check to see if something is true (just like an if statement), and
    will keep running the same loop, over and over again, until what it is checking
    becomes false.


    In this case, we created the variable “count” outside the while loop, set it to
    0, and then check to see if it is less than 5, which it is (but if it was 5, it
    would have never entered the loop).


    Next, inside the loop, we log out the number like before, but we also increment,
    or “add 1” to count.


    So, the first time it goes into the loop, count is 0, prints it out, and adds
    1 to it, making count now “1”. It then starts back at the top, checks if 1 is
    less than 5 (which it is), and enters the loop again. It keeps doing this, changing
    count to 2, 3, 4, 5, every time through the loop. When it hits 5, the while statement
    realizes that it is no longer less than 5, and exits the loop/ goes on with the
    program (doing anything below the loop).


    Pretty nice! But this becomes a lot more useful when you have LOTS of things to
    do. For instance, if we wanted to count to 100, all we would have to do is change
    when the loop exits (exits if count had become 101, so it only runs in the loop
    up to 100):


    let count=0;


    while(count < 101)


    {


        console.log("counting number: "+count);


        count++;


    }


    Now it will count all the way up to 100, but with only a few lines of code!


    We can do something similar with our tiles in a minute. But first I wanted to
    show you another type of loop that is used a lot more often (but does the same
    thing as above, with less lines). The “for loop”!


    So, replacing the above with a for loop:


    for (let count=0; count < 101; count++)


    {


        console.log("counting number: "+count);


    }


    It does the same thing as above, but puts it on fewer lines.


    In a for loop, the first section is declaring a variable (usually your count,
    also known as the “index”). Here we just declare a variable “count”, and set it
    to 0.


    Next, we have a semi colon to do the next part, which is actually what was in
    the “while” statement above- it just checks to see if something is true, and if
    it is, goes into the loop again.


    Next another semicolon, and we do whatever happens at the end of the loop- usually
    iterating/ adding 1 to the count/index.


    So, all you really have to know at this point is a for loop starts somewhere,
    checks if it’s still in a valid range, and adds to the count/index to keep going
    through the loop until the middle area becomes false, and it exits the loop.


    For consistency, most people use “index” for the name of the variable in a for
    loop like:


    for (let index=0; index < 101; index++)


    {


        console.log("counting number: "+index);


    }


    And to save time, you can cut down “index” to “i”:


    for (let i=0; i < 101; i++)


    {


        console.log("counting number: "+i);


    }


    You can name the variable inside the loop anything you want, but “i” is usually
    quickest to do, and most programmers will use it. It might be confusing when starting,
    but the more times you see it, the more you’ll recognize it.


    You should delete this test code, because we’re going to apply the same concept
    to our tiles in the next section.


    ## Using for loops for our tiles


    Let’s draw out tiles using the for loop on screen. In the “UpdateGame” function,
    under “ClearCanvas” replace the tile drawing code with:


    for (let i=0; i < tiles.length; i++)


    {


        ctx.drawImage(tile_creator.dirt_tile, tiles[i].x, tiles[i].y);


    }


    This does the same things as before, but with using a for loop. We start at the
    first item (0), make sure it’s less than the length of tiles, draw the image,
    then add 1 to the index, and repeat until the index is no longer less than the
    number of tiles.


    Now we’re also going to use a “for loop” for creating the tiles, instead of just
    drawing them.


    Down at the bottom of the program, replace the code where you create the tiles
    array (below where we created the “tile_creator” variable) with:


