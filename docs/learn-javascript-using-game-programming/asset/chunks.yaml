    \ this.image_containers[i];\n\n if(img_container.loaded)\n\n num_imgs_loaded++;\n\
    \n    }\n\n if(num_imgs_loaded == this.image_containers.length)\n\n return  true;\n\
    \n else\n\n return  false;\n\n}\n\nGetImage(name)\n\n{\n\n for (let  i = 0; i\
    \ < this.image_containers.length; i++)\n\n    {\n\n let  img_container = this.image_containers[i];\n\
    \n if(img_container.name==name)\n\n return  img_container;\n\n    }\n\n return\
    \  null;\n\n}\n\nThe function “CheckIfAllImagesLoaded” will be run for every image\
    \ that gets loaded. Since they probably will get loaded out of order (the larger\
    \ files will take longer, and load last), we have to check for every image if\
    \ it’s the last of the images to be loaded.\n\nSo here we just start with “0 images\
    \ loaded before checking”, go through all the images, and count how many have\
    \ been loaded. Afterwards, if the number of images loaded is the same as the total\
    \ images we tried to load, it means we’re finished loading all of them, and can\
    \ return that it is true/ finished loading! If not, we’ll return false, and keep\
    \ waiting until all the images have had “onload” called.\n\nWe create a “GetImage”\
    \ function, which will get passed in a name for one of the tiles, and will look\
    \ through all of our custom “img_container” objects, look if the name matches\
    \ what we’re looking for, and return it if it was found (or return null if nothing\
    \ was found).\n\nWe’re done with our “AssetLoader class”, but below that class\
    \ (outside of it), add a new class:\n\nclass Level\n\n{\n\n    constructor(tile_images)\n\
    \n    {\n\n        this.tile_images = tile_images;\n\n    }\n\n}//end of class\
    \ Level\n\nThis will be used to house our level- but right now it will just be\
    \ used to store the tile images, in order (so 0 for dirt, 1 for stone, etc- the\
    \ stuff defined in the “Tile” class).\n\nWe also should add our tile width and\
    \ height on our tile class as a static property, instead of having it on our “TileCreator”\
    \ object, since we won’t be using it anymore:\n\nclass Tile\n\n{\n\n    static width=64;\n\
    \n    static height=64;\n\nNow, at the bottom of our program, we’re going to change\
    \ how we generate tiles. Delete all the tile generation code (everything related\
    \ to tiles, starting at “new TileImageCreator() at the bottom of the program ),\
    \ and replace it with:\n\nlet  last_width=window.innerWidth;\n\nlet  last_height=window.innerHeight;//existing\
    \ code\n\nlet  asset_loader = new  AssetLoader();\n\nasset_loader.AddImageToQueue(\"\
    dirt\", \"assets/imgs/dirt.jpg\");\n\nasset_loader.AddImageToQueue(\"stone\",\
    \ \"assets/imgs/stone.jpg\");\n\nasset_loader.AddImageToQueue(\"water\", \"assets/imgs/water.jpg\"\
    );\n\nasset_loader.AddImageToQueue(\"grass\", \"assets/imgs/grass.jpg\");\n\n\
    asset_loader.AddImageToQueue(\"bush\", \"assets/imgs/bush.jpg\");\n\nasset_loader.LoadImages(AllAssetsLoaded);\n\
    \nfunction  AllAssetsLoaded()\n\n{\n\n CreateTileMap();\n\n}\n\nWe create a new\
    \ AssetLoader, and we queue up all of our images we want to load. Next, we actually\
    \ run the function to load the images, passing in our “callback” as “AllAssetsLoaded”,\
    \ which will get called after all the images have finished loading. Finally, it\
    \ will call a new function to generate the tiles “CreateTileMap”:\n\nlet  tiles\
    \ = new  Array();\n\nfunction  CreateTileMap()\n\n{\n\n // let tile_creator =\
    \ new TileImageCreator();\n\n let  tile_images = new  Array(asset_loader.GetImage(\"\
    dirt\"),\n\n asset_loader.GetImage(\"stone\"),\n\n asset_loader.GetImage(\"water\"\
    ),\n\n asset_loader.GetImage(\"grass\"),\n\n asset_loader.GetImage(\"bush\"),\n\
    \n                        );\n\n let  level = new  Level(tile_images);\n\n let\
    \  screen_width_default=1366;\n\n let  screen_height_default=768;\n\n let  num_tiles_x\
    \ = Math.round(screen_width_default*2 / Tile.width);\n\n let  num_tiles_y = Math.round(screen_height_default*2\
    \ / Tile.height);\n\n for(let  x= 0;x<num_tiles_x; x++)\n\n    {\n\n for(let \
    \ y= 0;y<num_tiles_y; y++)\n\n        {\n\n let  type = Math.floor(Math.random()*(Tile.LAST_TYPE+1));//need\
    \ +1 or doesn't include the highest number/\n\n // tiles.push(new Tile(x*tile_creator.width_tile,\
    \ y*tile_creator.height_tile, type, tile_creator.GetTileImage(type)));\n\n tiles.push(new\
    \  Tile(x*Tile.width, y*Tile.height, type, level.tile_images[type].image));\n\n\
            }\n\n    }\n\n}\n\nWe commented out the “tile_creator”, since we are going\
    \ to be loading the tile graphics from the file, instead of creating them on the\
    \ fly. We create an array of the images from the “asset_loader”, in the same way\
    \ they are defined in the Tile class (0 = dirt, 1 = stone, etc). That way we can\
    \ just refer to their position in this array easily. Next, we pass that to “Level”,\
    \ which will just hold onto this array of tile images for now.\n\nThen we just\
    \ create the tiles the same way as before, but use “level.tile_images[type].image”\
    \ to get the image for each tile.\n\nIf you run the program now, it will preload\
    \ all the images, then fire the function/ callback after they are all finished\
    \ loading, and generate the world using the tiles loaded from the file!\n\n![](Images/image00481.jpeg)\n\
    \nIt’s looking pretty good now, aside from being totally random, and our player\
    \ is starting to look rather plain compared to the background.\n\nSo, let’s load\
    \ a better character model, so he fits in the world better!\n\n### Chapter example\
    \ on github:\n\n[https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/8_Creating_world.html](https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/8_Creating_world.html)\n\
    \n# 9. Creating animated/flipbook graphics\n\n## Sprite sheets\n\nThere’s a decent\
    \ amount of work involved with drawing an animated character. You have to look\
    \ into walk cycles, understand how a walk cycle works, and create graphics for\
    \ the character walking down, to one side (and mirror it for the other side),\
    \ and up. So even if you have the character just bobbing up and down with 2 frames\
    \ of animation, you have to at least have 2 for 3 different directions/ 6 drawings\
    \ for a quick bobbing walk (and walk cycles usually have more frames than that).\n\
    \nYou can learn more here:\n\n[https://en.wikipedia.org/wiki/Walk_cycle](https://en.wikipedia.org/wiki/Walk_cycle)\n\
    \nI found a decent looking animated character for free on craftpix.net:\n\n[https://craftpix.net/freebies/free-3-character-sprite-sheets-pixel-art/](https://craftpix.net/freebies/free-3-character-sprite-sheets-pixel-art/)\n\
    \n![](Images/image00482.gif)\n\nThe only negative is there isn’t a “down” or “up”\
    \ animation, so that can be a future feature that can be added. For now, they’ll\
    \ just have a left or right walk cycle when moving down/ up.\n\nAn issue with\
    \ that site is they require you to have an account for the “free download”… and\
    \ quite a wait for it to download. So, you can find basic logins that other people\
    \ shared on:\n\n[http://bugmenot.com/view/craftpix.net](http://bugmenot.com/view/craftpix.net)"
