  trans: "\n\n我们将文字设为白色，因为我们的背景是蓝色的，如果设置为正常的黑色，很难看清。我们通过将 `font-weight` 设置为 `900`\
    \ 让它尽可能加粗——你可以从 `100` 到 `900` 之间进行设置，每次增加 `100`。我们将字体大小设置为 `20px`，并制作了一个由 4 个不同阴影组成的\
    \ `text-shadow`——分别向右移动 `2px`，向上移动 `2px`，然后一个是向右移动 `2px` 但向下移动 `-2px`，另外两个方向——这样就有\
    \ 4 个文本阴影围绕在文字的所有角落。这在我们的白色文字周围形成了一个黑色的“描边”线，使其即使在白色背景上也能清晰可读。这样，无论背景是什么样的，我们都能看到\
    \ FPS 文字。\n\n最后，由于我们不希望 FPS 文字阻挡我们点击它覆盖的画布区域，我们设置了 `pointer-events: none;`，使其无法被点击。\n\
    \n现在，让我们将这段文字连接到 JavaScript 中，这样它就能在屏幕上输出实际的 FPS。\n\n## 将 FPS 文字连接到 JavaScript\n\
    \n我们之前已经在代码和控制台中看到了实际的 FPS，但之前没有显示在屏幕上，让我们把它们连接起来。\n\n在你的所有函数下方，即我们在函数/类之外声明变量的地方（也称为“全局”变量），在现有的\
    \ `last_time_ms` 之上添加这一行新代码：\n\n```javascript\nlet fps_txt_element = document.getElementById(\"\
    fps\");\nlet last_time_ms = 0;\n...\n```\n\n在这里，我们从页面上获取一个 id 为 `\"fps\"` 的元素（即我们在上一节创建的\
    \ FPS 文字）。接下来，我们将它赋值给变量名 `fps_txt_element`，因为我们每帧都需要使用它来更新当前的 FPS。\n\n接下来，我们想要更新/更改文本。在你的\
    \ `Update` 函数中，添加以下行：\n\n```javascript\nfps_txt_element.innerHTML=Math.round(fps);\n\
    console.log(\"Update: delta time: \"+frame_delta_ms+\", fps: \"+fps);\n…\n```\n\
    \n在这里，我们只是使用了上面创建的 `fps_txt_element` 变量（即 html 页面上 id 为 `\"fps\"` 的段落标签），并将其 `innerHTML`（我们起初将其设置为\
    \ `\"120\"`）更改为我们在正上方定义的 `fps` 变量。我们还会调用 `Math.round()` 将 `fps` 四舍五入为整数，而不是小数，因为不断变化的小数很难阅读。\n\
    \n如果你查看页面，你会发现我们的 FPS 文字在帧更新时会实时更新！\n\n你可以通过在 `Update` 函数中切换下面两行代码来检查它的变化：\n\n\
    ```javascript\nsetTimeout(function(){window.requestAnimationFrame(Update)}, 100\
    \ );\n// window.requestAnimationFrame(Update);\n// setTimeout(function(){window.requestAnimationFrame(Update)},\
    \ 100 );\n\nwindow.requestAnimationFrame(Update);\n```\n\n第一行人为地延迟了 `Update` 函数的下一次调用\
    \ `100ms` (`0.1s`)，这会让速度慢到大约 `10fps`。第二行是我们实际的更新调用，它的运行速度应该比那快得多（在我的屏幕上是 `60fps`）。\n\
    \n完成后，注释掉第一行并保留第二行，我们就可以继续下去了！\n\n我们现在可以在屏幕上看到 FPS 了，这是我们的第一个 UI 元素。它还能帮助我们快速发现是否由于某些错误导致了系统\
    \ FPS 大剧下降。我们还可以注释掉 `Update` 中输出 FPS 和 `deltatime` 的 `console.log`，以免弄乱控制台（留出清晰显示调试语句、警告或错误的空间）。\n\
    \n```javascript\n// console.log(\"Update: delta time: \"+frame_delta_ms+\", fps:\
    \ \"+fps);\n```\n\n最后，让游戏占据整个尺寸，不再是默认的小 `300x150` 画布了。\n\n## 让画布占据整个屏幕\n\n让我们修改画布使其占据全屏。\n\
    \n首先，从你的 canvas 标签移除带有边框的 style 属性：\n\n```html\n<canvas></canvas>\n```\n\n接下来修改你的\
    \ style 标签添加 canvas 并修改 `game_container`：\n\n```css\ncanvas {\n    display: block;\n\
    }\n\n#game_container {\n    position: relative;\n}\n```\n\n我们的 canvas 元素默认设置为\
    \ `\"inline\"`——这意味着它允许被放置在句子中间/行内，并允许其他内容放在它的两侧。但我们希望它像 `\"block\"` 一样显示，不允许其他内容放在它旁边，并占据整个宽度，这再次确保了我们的游戏上方不会出现难看的滚动条。\n\
    \n我们还删除了将 `game_container` 设置为 `inline-block` 的代码——否则会出现滚动条，现在画布将占据页面的全宽全高，因此\
    \ FPS 将正确定位。\n\n我们仍然需要将画布设置为设置为窗口宽度和高度的 `100%`。如果我们使用 CSS，它会将画布缩放到 100x100。\n\n\
    ## 修复屏幕缩放问题\n\n如果你缩放窗口使其变小，你会发现出现了滚动条。这是因为我们在第一次加载时将画布尺寸设置为当时窗口的大小——所以如果窗口随后变小，画布将保持原始大小。\n\
    \n因此，我们只需要检测尺寸的变化并同时调整画布的大小。\n\n在声明 Timmy 的上方添加：\n\n```javascript\nlet last_width=window.innerWidth;\n\
    let last_height=window.innerHeight;\n```\n\n我们将存储窗口的上一次/当前宽度和高度，以便我们可以在更新函数（每帧运行）中检查它们是否发生了变化。\n\
    \n接下来，在 `Update` 函数下方创建一个新函数：\n\n```javascript\nfunction Resize() {\n    if(window.innerWidth\
    \ != last_width || window.innerHeight != last_height) {\n        my_canvas.setAttribute('width',\
    \ window.innerWidth);\n        my_canvas.setAttribute('height', window.innerHeight);\n\
    \        last_width=window.innerWidth;\n        last_height=window.innerHeight;\n\
    \    }\n}\n```\n\n首先我们像往常一样创建了一个函数。然后我们声明了一个 `if` 语句。这允许你检查某个条件是否为真，如果是，则运行内部的代码。\n\
    \n"
- fmt: "\nWe check to see if the width we stored is no longer equal to the current\
    \ window width, meaning they resized the width (or rotated their phone), but also\
    \ if the height might have changed. If either one is true, then we'll run the\
    \ code inside it.\n\nIf so, we then set the canvas to the new width and height,\
    \ which unfortunately Also causes the canvas to be erased whenever the width and\
    \ size are changed (because it's creating a new image of that size to draw to).\n\
    \nFinally, we store what this width and height are now, so we can then check if\
    \ it ever changes again in the future.\n\nNow we actually need to call this `Resize()`\
    \ function, which checks if the window size has changed, and resizes the canvas.\
    \ Because the canvas texture gets re-created, and is blank initially, we want\
    \ to resize right before we draw on the canvas, so that if it did get resized,\
    \ it will immediately get drawn on afterwards.\n\nIn `Update`, before calling\
    \ `UpdateGame`:\n\n```\n…\nResize();\nUpdateGame(frame_delta_ms);\n…\n```\n\n\
    Now if you resize the window, you'll see the game updates and resizes perfectly!\n\
    \n## Full code listing\n\nThe full code is becoming much longer now, but I included\
    \ it so that you can error check if anything is going wrong. You can also find\
    \ the code up on the books github page as “6_Moving_sprites.html”.\n\n**WARNING**:\
    \ I’m not indenting the html tags fully, because otherwise we’d have too much\
    \ white space at the front of the code listing. But you should always indent as\
    \ you go deeper a HTML tag, object, etc, for readability (and some languages like\
    \ python require indentation, and remove all curly brackets, so it’s good practice)\n\
    \n```html\n<html lang=\"en\">\n<head>\n <meta charset=\"UTF-8\">\n <meta http-equiv=\"\
    X-UA-Compatible\" content=\"IE=edge\">\n <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n <title>My JavaScript Game</title>\n <style>\n * {\n margin:0;\n\
    \ padding:0;\n font-family: Verdana, Geneva, Tahoma, sans-serif;\n}\n canvas {\n\
    \ display: block;\n}\n #game_container {\n position: relative;\n}\n #fps {\n position:\
    \ absolute;\n top:10px;\n right:10px;\n color:white;\n font-weight: 900;\n font-size:\
    \ 20px;\n text-shadow:2px  2px  0  black,\n 2px  -2px  0  black, \n -2px  -2px\
    \  0  black,\n -2px  2px  0  black;\n pointer-events: none;\n}\n </style> \n</head>\n\
    <body>\n <div id=\"game_container\">\n <canvas></canvas>\n <p id=\"fps\">120</p>\n\
    \ </div>\n <script>\n class Friend {\nconstructor(their_name, their_age, their_loves_spinach,\
    \ their_eye_color, their_skin_color, their_hair_color, their_x_pos, their_y_pos)\
    \ {\n this.name = their_name;\n this.age = their_age;\n this.loves_spinach = their_loves_spinach;\n\
    \ this.eye_color = their_eye_color;\n this.skin_color = their_skin_color;\n this.hair_color\
    \ = their_hair_color;\n this.x_pos = their_x_pos;\n this.y_pos = their_y_pos;\n\
    \ console.log(\"A friend was created, with name: \"+this.name+\", age: \"+this.age+\"\
    , and loves spinach: \"+this.loves_spinach);\n console.log(\"And some facts about\
    \ them, eye color: \"+this.eye_color+\", skin color: \"+this.skin_color+\", hair\
    \ color: \"+this.hair_color+\", x and y: \"+this.x_pos+\", \"+this.pos_y);\n this.DrawFriend();\n\
    }\n SayHi() {\n console.log(\"Hi, my name is \"+my_new_friend.name +\", my age\
    \ is: \"+my_new_friend.age+\", and do I love spinach? \"+my_new_friend.loves_spinach+\"\
    .\");\n}\n DrawFriend() {\n // this is where we will start drawing our friend\n\
    \ //-------------------get the canvas stuff we need to be able to draw----------------\n\
    \ let my_canvas = document.querySelector(\"canvas\");\n let draw_context = my_canvas.getContext(\"\
    2d\");\n let ctx = draw_context;\n //-------------------draw the head----------------\n\
    \ // define width and height of head\n let width_head = 50;\n let height_head\
    \ = 60;\n ctx.fillStyle = this.skin_color;\n ctx.fillRect(this.x_pos, this.y_pos,\
    \ width_head, height_head);\n //-------------------draw the eyes----------------\n\
    \ // define width and height of eyes\n let width_eyes = 10;\n let height_eyes\
    \ = 15;\n // set the fill:\n ctx.fillStyle = this.eye_color;\n // define how offset\
    \ the eyes should be from the left and right side of the head\n let eye_x_offset\
    \ = 10;\n // define how offset the eyes should be from the top of the head\n let\
    \ eye_y_offset = 15;\n //-------------------draw the left eye, left corner, top\
    \ , width and height----------------\n ctx.fillRect(this.x_pos+eye_x_offset, this.y_pos+eye_y_offset,\
    \ width_eyes, height_eyes);\n //--draw the right eye--\n //a lot more- have to\
    \ find right side of head (x_pos+width_head), then minus the width of eye + x\
    \ offset to position the left side of the eye away from the right side of the\
    \ head\n let right_side_of_head = this.x_pos+width_head;\n let right_eye_x_pos\
    \ = right_side_of_head - width_eyes-eye_x_offset;\n ctx.fillRect(right_eye_x_pos,\
    \ this.y_pos+eye_y_offset , width_eyes, height_eyes);\n}\n function ClearCanvas(ctx,\
    \ background_color) {\n ctx.fillStyle = background_color;\n ctx.fillRect(0, 0,\
    \ my_canvas.width, my_canvas.height);\n}\n function UpdateGame(delta_ms) {\n //\
    \ timmy.x_pos=timmy.x_pos+5; //moves timmy 5 pixels to the right each frame/ time\
    \ the function is called\n timmy.x_pos=timmy.x_pos+delta_ms*0.05206;\n ClearCanvas(ctx,\
    \ \"rgba(0,0,255,255)\"); //clears the canvas, so we don't get \"ghosting\"\n\
    \ timmy.DrawFriend(); //re-draw Timmy\n}\n function Update(time_ms) {\n let frame_delta_ms\
    \ = time_ms - last_time_ms; //2 going to find the delta/difference in time between\
    \ the last frame (initially 0) and the current time\n let delta_s = frame_delta_ms\
    \ / 1000; //since time is in ms (1 /1000 s), to convert to seconds, divide by\
    \ 1000, exp: 2000ms/ 1000 = 2s\n let fps= 1 / delta_s; //we can convert from seconds/\
    \ frame (delta_s) to frames/ second by flipping it dividing 1 by it- 1/ (seconds/frame)\
    \ = frame/ second= fps\n frame_delta_ms = frame_delta_ms.toFixed(2); //going to\
    \ round to just 2 decimal places using toFixed(2)\n //so.... toFixed which rounds\
    \ a number, returns a string instead of a number.... so have to now turn it back\
    \ into a number... JavaScript... otherwise it counts as adding strings together-\
    \ so instead of 5+5 = 10, 5+5=55 -which is to 5s stuck together, instead of added\n\
    \ frame_delta_ms = parseFloat(frame_delta_ms);\n fps = fps.toFixed(2);\n fps_txt_element.innerHTML=Math.round(fps);\n\
    \ Resize();\n UpdateGame(frame_delta_ms);\n window.requestAnimationFrame(Update);\n\
    }\n function Resize() {\n if(window.innerWidth != last_width || window.innerHeight\
    \ != last_height) {\n //change the width and height of the canvas to be the same\
    \ size as the window\n my_canvas.setAttribute('width', window.innerWidth);\n my_canvas.setAttribute('height',\
    \ window.innerHeight);\n last_width=window.innerWidth;\n last_height=window.innerHeight;\n\
    \ }\n}\n let fps_txt_element = document.getElementById(\"fps\");\n let last_time_ms\
    \ = 0; //1 \"creating last_time_ms\" first, which will exist outside of the function,\
    \ and record what the last time update was called\n window.requestAnimationFrame(Update);\n\
    \ let my_canvas = document.querySelector(\"canvas\");\n let draw_context = my_canvas.getContext(\"\
    2d\");\n let ctx = draw_context;\n let last_width=window.innerWidth;\n let last_height=window.innerHeight;\n\
    \ let timmy = new Friend(\"Timmy Smith\", 16, true, \"rgb(0,0,255)\", \"rgb(209,181,140)\"\
    , \"rgb(125,60,34)\", 20, 20);\n </script>\n</body>\n</html>\n```\n"
  raw: "We check to see if the width we stored is no longer equal to the current window\
    \ width, meaning they resized the width (or rotated their phone), but also if\
    \ the height might have changed. If either one is true, then we'll run the code\
    \ inside it.\n\nIf so, we then set the canvas to the new width and height, which\
    \ unfortunately Also causes the canvas to be erased whenever the width and size\
    \ are changed (because it's creating a new image of that size to draw to).\n\n\
    Finally, we store what this width and height are now, so we can then check if\
    \ it ever changes again in the future.\n\nNow we actually need to call this resize\
    \ function, which checks if the window size has changed, and resizes the canvas.\
    \ Because the canvas texture gets re-created, and is blank initially, we want\
    \ to resize right before we draw on the canvas, so that if it did get resized,\
    \ it will immediately get drawn on afterwards.\n\nIn Update, before calling UpdateGame:\n\
    \n…\n\nResize();\n\nUpdateGame(frame_delta_ms);\n\n…\n\nNow if you resize the\
    \ window, you'll see the game updates and resizes perfectly!\n\n## Full code listing\n\
    \nThe full code is becoming much longer now, but I included it so that you can\
    \ error check if anything is going wrong. You can also find the code up on the\
    \ books github page as “6_Moving_sprites.html”.\n\nWARNING: I’m not indenting\
    \ the html tags fully, because otherwise we’d have too much white space at the\
    \ front of the code listing. But you should always indent as you go deeper a HTML\
    \ tag, object, etc, for readability (and some languages like python require indentation,\
    \ and remove all curly brackets, so it’s good practice)\n\n<html  lang=\"en\"\
    >\n\n<head>\n\n <meta  charset=\"UTF-8\">\n\n <meta  http-equiv=\"X-UA-Compatible\"\
    \  content=\"IE=edge\">\n\n <meta  name=\"viewport\"  content=\"width=device-width,\
    \ initial-scale=1.0\">\n\n <title>My JavaScript Game</title>\n\n <style>\n\n *\n\
    \n        {\n\n margin:0;\n\n padding:0;\n\n font-family: Verdana, Geneva, Tahoma,\
    \ sans-serif;\n\n        }\n\n canvas\n\n        {\n\n display: block;\n\n       \
    \ }\n\n #game_container\n\n        {\n\n position: relative;\n\n        }\n\n\
    \ #fps\n\n        {\n\n position: absolute;\n\n top:10px;\n\n right:10px;\n\n\
    \ color:white;\n\n font-weight: 900;\n\n font-size: 20px;\n\n text-shadow:2px\
    \  2px  0  black,\n\n 2px  -2px  0  black, \n\n -2px  -2px  0  black,\n\n -2px\
    \  2px  0  black;\n\n pointer-events: none;\n\n        }\n\n </style> \n\n</head>\n\
    \n<body>\n\n <div  id =\"game_container\">\n\n <canvas></canvas>\n\n <p  id=\"\
    fps\">120</p>\n\n </div>\n\n <script>\n\n class  Friend\n\n        {\n\n constructor(their_name,\
    \ their_age, their_loves_spinach, their_eye_color, their_skin_color, their_hair_color,\
    \ their_x_pos, their_y_pos)\n\n            {\n\n this.name = their_name;\n\n this.age\
    \ = their_age;\n\n this.loves_spinach = their_loves_spinach;\n\n this.eye_color\
    \ = their_eye_color;\n\n this.skin_color = their_skin_color;\n\n this.hair_color\
    \ = their_hair_color;\n\n this.x_pos = their_x_pos;\n\n this.y_pos = their_y_pos;\n\
    \n console.log(\"A friend was created, with name: \"+this.name+\", age: \"+this.age+\"\
    , and loves spinach: \"+this.loves_spinach);\n\n console.log(\"And some facts\
    \ about them, eye color: \"+this.eye_color+\", skin color: \"+this.skin_color+\"\
    , hair color: \"+this.hair_color+\", x and y: \"+this.x_pos+\", \"+this.pos_y);\n\
    \n this.DrawFriend();\n\n            }\n\n SayHi()\n\n            {\n\n console.log(\"\
    Hi, my name is \"+my_new_friend.name +\", my age is: \"+my_new_friend.age+\",\
    \ and do I love spinach? \"+my_new_friend.loves_spinach+\".\");\n\n           \
    \ }\n\n DrawFriend()\n\n            {\n\n // this is where we will start drawing\
    \ our friend\n\n //-------------------get the canvas stuff we need to be able\
    \ to draw-------------------\n\n let  my_canvas = document.querySelector(\"canvas\"\
    );\n\n let  draw_context = my_canvas.getContext(\"2d\");\n\n let  ctx = draw_context;\n\
    \n //-------------------draw the head-------------------\n\n // define width and\
    \ height of the head\n\n let  width_head = 50;\n\n let  height_head = 60;\n\n\
    \ ctx.fillStyle = this.skin_color;\n\n ctx.fillRect(this.x_pos, this.y_pos, width_head,\
    \ height_head);\n\n //-------------------draw the eyes-------------------\n\n\
    \ // define width and height of the eyes\n\n let  width_eyes = 10;\n\n let  height_eyes\
    \ = 15;\n\n // set the fill style:\n\n ctx.fillStyle = this.eye_color;\n\n //\
    \ define how offset the eyes should be from the left and right side of the head\n\
    \n let  eye_x_offset = 10;\n\n // define how offset the eyes should be from from\
    \ the top of the head\n\n let  eye_y_offset = 15;\n\n //-------------------draw\
    \ the left eye, left corner, top , width and height-------------------\n\n ctx.fillRect(this.x_pos+eye_x_offset,\
    \ this.y_pos+eye_y_offset, width_eyes, height_eyes);\n\n //--draw the right eye--\n\
    \n //a lot more complicated- have to find right side of head (x_pos+width_head),\
    \ then minus out the width of eye + x offset of eye to position the left side\
    \ of the eye away from the right side of the head\n\n let  right_side_of_head\
    \ = this.x_pos+width_head;\n\n let  right_eye_x_pos = right_side_of_head - width_eyes-eye_x_offset;\n\
    \n ctx.fillRect(right_eye_x_pos, this.y_pos+eye_y_offset , width_eyes, height_eyes);\n\
    \n            }\n\n        }\n\n function  ClearCanvas(ctx, background_color)\n\
    \n        {\n\n ctx.fillStyle = background_color;\n\n ctx.fillRect(0, 0, my_canvas.width,\
    \ my_canvas.height);\n\n        }\n\n function  UpdateGame(delta_ms)\n\n       \
    \ {\n\n // timmy.x_pos=timmy.x_pos+5; //moves timmy 5 pixels to the right each\
    \ frame/ time the function is called\n\n timmy.x_pos=timmy.x_pos+delta_ms*0.05206;\n\
    \n ClearCanvas(ctx, \"rgba(0,0,255,255)\"); //clears the canvas, so we don't get\
    \ \"ghosting\"\n\n timmy.DrawFriend(); //re-draw Timmy\n\n        }\n\n function\
    \  Update(time_ms)\n\n        {       \n\n let  frame_delta_ms = time_ms - last_time_ms;\
    \ // #2 going to find the delta/difference in time between the last frame (initially\
    \ 0) and the current time\n\n let  delta_s = frame_delta_ms / 1000; //since time\
    \ is in ms (1 /1000 s), to convert to seconds, divide by 1000, exp: 2000ms/ 1000\
    \ = 2s\n\n let  fps= 1 / delta_s; //we can convert from seconds/ frame (delta_s)\
    \ to frames/ second by flipping it dividing 1 by it- 1/ (seconds/frame) = frame/\
    \ second= fps\n\n frame_delta_ms = frame_delta_ms.toFixed(2); //going to round\
    \ to just 2 decimal places using toFixed(2)\n\n //so.... toFixed which rounds\
    \ a number, returns a string instead of a number.... so have to now turn it back\
    \ into a number... JavaScript... otherwise it counts as adding strings together-\
    \ so instead of 5+5 = 10, 5+5=55 -which is to 5s stuck together, instead of added\n\
    \n frame_delta_ms = parseFloat(frame_delta_ms);\n\n fps = fps.toFixed(2);\n\n\
    \ fps_txt_element.innerHTML=Math.round(fps);\n\n // console.log(\"Update: delta\
    \ time: \"+frame_delta_ms+\", fps: \"+fps);\n\n Resize();\n\n UpdateGame(frame_delta_ms);\n\
    \n // setTimeout( function(){window.requestAnimationFrame(Update) }, 100);\n\n\
    \ window.requestAnimationFrame(Update);\n\n        }\n\n function  Resize()\n\n\
            {\n\n if(window.innerWidth != last_width || window.innerHeight != last_height)\n\
    \n            {\n\n //change the width and height of the canvas to be the same\
    \ size as the window\n\n my_canvas.setAttribute('width', window.innerWidth);\n\
    \n my_canvas.setAttribute('height', window.innerHeight);\n\n last_width=window.innerWidth;\n\
    \n last_height=window.innerHeight;\n\n            }\n\n        }\n\n let  fps_txt_element\
    \ = document.getElementById(\"fps\");\n\n let  last_time_ms = 0; // #1 \"creating\
    \ last_time_ms\" first, which will exist outside of the function, and record what\
    \ the last time update was called\n\n window.requestAnimationFrame(Update);\n\n\
    \ let  my_canvas = document.querySelector(\"canvas\");\n\n let  draw_context =\
    \ my_canvas.getContext(\"2d\");\n\n let  ctx = draw_context;\n\n let  last_width=window.innerWidth;\n\
    \n let  last_height=window.innerHeight;\n\n let  timmy = new  Friend(\"Timmy Smith\"\
    , 16, true, \"rgb(0,0,255)\", \"rgb(209, 181, 140)\", \"rgb(125, 60, 34)\", 20,\
    \ 20);\n\n </script>\n\n</body>\n\n</html>\n\n### Chapter example on github:\n\
    \n[https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/6_Moving_sprites.html](https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/6_Moving_sprites.html)"
