  trans: "\n\n在 `UpdateGame` 函数中，在 `ClearCanvas(ctx, \"rgba(0,0,255,255)\");` 下方添加以下行：\n\
    \n```javascript\nctx.drawImage(tile_creator.dirt_tile, 150, 0);\n```\n\n这将在清除画布后、绘制我们的角色之前，在屏幕上\
    \ x=150, y=0 的位置画出我们创建的 `tile_creator.dirt_tile`。\n\n现在我们在屏幕上画了一个磁块，但我们希望有一堆磁块，它们在\
    \ x 和 y 方向上平铺，这样整个屏幕就能填满磁块（或更多，并添加滚动功能）。所以，让我们创建一个可以包含许多磁块的东西吧！\n\n## 创建磁块地图\n\
    \n现在，为了在屏幕上绘制多个磁块，我们必须逐个绘制磁块，例如在第一行绘制 3 个磁块（再次在 `ClearCanvas(ctx, \"rgba(0,0,255,255)\"\
    );` 下方）：\n\n```javascript\nctx.drawImage(tile_creator.dirt_tile, 0, 0);\nctx.drawImage(tile_creator.dirt_tile,\
    \ 64, 0);\nctx.drawImage(tile_creator.dirt_tile, 128, 0);\n```\n\n如果我们想创建一个与最常见屏幕尺寸\
    \ 1366x768 相同的地图/世界，我们需要横向 1366/64 = 21 个磁块，纵向 768/64 = 12 个磁块。为了填满整个屏幕（即 21x12=252\
    \ 次），我们需要复制 `drawImage` 函数！我想让第一张地图是屏幕宽度和高度的 2 倍，这意味着 42x24=1,008 个磁块/绘制调用！\n\n\
    通过复制和粘贴来这样做将是疯狂的，更说编程中需要记住最大的事情之一就是“DRY” —— “不要重复自己”（Do Not Repeat Yourself）。程序员之所以这样做是为了为人们节省时间、自动化事务并寻找高效的方法。所以，如果你发现自己重复了某件事一次或两次，很可能有更高效的方法。\n\
    \n## 数组或列表\n\n在编程中，我们有一种内置的对象类型称为“数组”（Array）或“列表”（List）。它只是一种可以包含许多相同类型对象的类型。想象一下如果你有\
    \ 8 个朋友，你可以把他们放在一个名为 `my_friends` 的变量中。\n\n假设你需要在商店买杂货，“2 个柠檬”、“谷物片”、“肉类”、“蓝莓”、“披萨”、“炸鸡”、“沙拉”、“5\
    \ 个牛油果”。你可以将它们存储在单独的变量中，如 `grocery_item1`、`grocery_item2` 等\n\n但将它们存储在一个对象（即数组）中的方法是：\n\
    \n```javascript\nlet grocery_list = new Array(\"2 lemons\", \"cereal\", \"meat\"\
    , \"blueberries\", \"pizza\", \"fried chicken\", \"salad\", \"5 avocados\");\n\
    ```\n\n你可以把它放在程序的底部进行测试，在我们继续开发游戏之前会删除它。\n\n如果你 `console.log` 输出 `grocery_list`\
    \ 变量：\n\n```javascript\nconsole.log(grocery_list);\n```\n\n它应该显示类似如下的内容：\n\n`Array(8)\
    \ [ \"2 lemons\", \"cereal\", \"meat\", \"blueberries\", \"pizza\", \"fried chicken\"\
    , \"salad\", \"5 avocados\" ]\n0: \"2 lemons\"\n1: \"cereal\"\n2: \"meat\"\n3:\
    \ \"blueberries\"\n4: \"pizza\"\n5: \"fried chicken\"\n6: \"salad\"\n7: \"5 avocados\"\
    \nlength: 8\n\n关于数组的一个重要的一点是它们从“0”开始。这起初可能有点困惑，但项目 0 是第一个项目。最后一个项目是总数减 1（因为它是从\
    \ 0 而不是 1 开始的）。所以我们的数组中有 8 个项目，第一个在位置 0，所以第 8 个少 1，即项目 7（因为第一个项目是 0，而不是通常情况下少\
    \ 1 的 1）。\n\n这起初有点违反直觉，但会让以后处理数组的数学运算顺畅得多。\n\n所以我们可以输出整个数组，但如何输出数组中的单个项目呢？你使用变量名和方括号的项目编号来访问。\n\
    \n例如，如果你想 `console.log` 输出数组中的第一个项目：\n\n```javascript\nconsole.log(grocery_list[0]);\n\
    ```\n“2 lemons”\n\n或者列表中的第 3 个项目（所以 3-1 = 2，所以我们输出项目 2 来查看第 3 个项目）：\n\n```javascript\n\
    console.log(grocery_list[2]);\n```\n“meat”\n\n最后一个项目呢？你可以知道项目的长度是 8，所以你可以输出项目：8-1=7。但更简单的方法是使用所有数组的内置属性：`length`。\n\
    \n输出数组的长度请使用：\n\n```javascript\nconsole.log(grocery_list.length);\n```\n“8”\n\n\
    这输出了“8”，因为那是数组中的项目数量。所以为了能看到最后一个项目，我们可以使用 `grocery_list.length - 1`：\n\n```javascript\n\
    console.log(grocery_list[length-1]);\n```\n“5 avocados”\n\n## 在数组中添加和移除项目\n\n\
    将程序底部的代码改为：\n\n```javascript\nlet grocery_list = Array(\"2 lemons\", \"cereal\"\
    , \"meat\", \"blueberries\", \"pizza\", \"fried chicken\", \"salad\", \"5 avocados\"\
    );\n```\n\n如果我们想在末尾添加东西，使用 `push`：\n\n```javascript\ngrocery_list.push(\"chocolate\
    \ bars\");\n```\n\n如果我们想从数组中移除一个项目，使用 `splice`：\n\n```javascript\ngrocery_list.splice(2,\
    \ 1);\n```\n\n如果我们想在数组的某处放入项目，而不是末尾呢？\n\n```javascript\ngrocery_list.splice(1,\
    \ 0, \"milk\");\n```\n\n## 创建磁块数组\n\n如果我们想创建一个磁块数组以便绘制许多，我们要做的第一件事创建一个磁块类，以便它可以跟踪自己在哪里，以及以后它是什么类型的磁块。\n\
    \n在你创建 `Image` 类的地方创建一个新的磁块类：\n\n```javascript\nclass Tile {\n  constructor(x,\
    \ y) {\n    // 磁块的 x 和 y 位置，以便绘制它\n    this.x = x;\n    this.y = y;\n  }\n}\n\
    ```\n\n我们刚刚创建了一个只有 `x` 和 `y` 的类，这样我们就知道在屏幕上的哪里绘制它。我们在创建时也传递了 x 和 y 值，因此在创建每个磁块时可以快速传递位置。\n\
    \n现在我们要在程序底部创建一个磁块数组，在我们创建 `tile_creator` 变量的下方：\n\n```javascript\nlet tiles =\
    \ new Array(new Tile(0,0), new Tile(64, 64), new Tile(64*2, 64*2), new Tile(64*3,\
    \ 64*3), new Tile(64*4, 64*4));\n```\n\n"
- fmt: "\nNow let’s draw out tiles onscreen. In the `UpdateGame` function, under `ClearCanvas`\
    \ replace the tile drawing code with:\n\n```javascript\nctx.drawImage(tile_creator.dirt_tile,\
    \ tiles[0].x, tiles[0].y);\nctx.drawImage(tile_creator.dirt_tile, tiles[1].x,\
    \ tiles[1].y);\nctx.drawImage(tile_creator.dirt_tile, tiles[2].x, tiles[2].y);\n\
