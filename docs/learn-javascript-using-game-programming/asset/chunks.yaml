    \ y++)\n    {\n        tiles.push(new Tile(x*tile_creator.width_tile, y*tile_creator.height_tile));\n\
    \    }\n}\n```\n\n所以我们也存储了默认屏幕的高度，因为我们将再次使用该值来计算我们需要多少块瓦砖。我们也计算了在 `y` 方向上需要的瓦砖数量。\n\
    \n接下来，这次我们为 `y` 方向也创建一个 `for` 循环，而且我们将根据瓦砖的 `y` 位置来创建瓦砖，因为我们同样在 `y` 方向进行循环。所以，让我们看看是如何逐步执行此的：\n\
    \n- 循环 `x=0`, `y=0`：初始 `x` 和 `y` 都是 0，所以瓦砖位置是 0,0。\n- 循环：`x=0`, `y=1`（在移动到 `x\
    \ =1` 之前，我们需要在 `x` 为 0 时遍历所有的 `y` 位置）：`x` 仍然是 0，`y` 现在是 1，所以瓦砖位置是：0, 64\n- 循环：`x=0`,\
    \ `y=2`：`x` 仍然是 0，`y` 现在是 2，所以瓦砖位置是：0, 128\n\n以此此类推，直到 `y` 大于 `y` 方向上的瓦砖数量。最后，当我们完成\
    \ `x=0` 时所有 `y` 瓦砖的遍历后。我们退出 `y` 循环，回到顶部，现在 `x` 变成了 1！所以，我们再次运行它，但现在 `x` 是 1，我们将遍历\
    \ `x=1` 时的所有 `y`。\n\n- 循环 `x=1`, `y=0`：`x` 现在是 1，`y` 是 0，所以瓦砖位置是 64,0。\n- 循环 `x=1`,\
    \ `y=1`：`x` 现在是 1，`y` 是 1，所以瓦砖位置是 64,64。\n- 循环 `x=1`, `y=2`：`x` 现在是 1，`y` 是 2，所以瓦砖位置是\
    \ 64,128\n\n以此类推，直到我们遍历了所有 `x` 位置的所有 `y` 位置。所以，如果你在每个 `y` 循环结束时停下来，你会看到一长条瓦砖被添加，从第一个\
    \ `x` 位置开始一直延伸到屏幕底部。在下一次 `x` 循环中，它又会绘制另一条长条瓦砖，一直到屏幕底部，一条接一条地继续，直到每个 `x` 位置都被绘制。\n\
    \n由于 `y` 循环在 `x` 循环内部，对于每个 `x` 位置，你都会遍历每一个 `y` 位置，即整个 `y` 循环。`x` 循环只运行一次（因为它是外部循环），但\
    \ `y` 循环对于每个 `x` 会运行很多很多。\n\n我们本可以把 `x` 循环放在 `y` 循环内部，每次都横跨屏幕绘制条带，然后向下移动一个，我们将得到相同的结果。但对我来说，让\
    \ `x` 循环在外面更有意义，而且在 `y` 循环中向屏幕向下绘制条带更容易视觉化，然后每每次通过 `x` 循环时向右移动 1 块瓦砖。\n\n所以现在如果你运行这段代码，你会看到我们的角色后面有一个满是瓦砖的世界，他仍然可以在其中移动！\n\
