    It’s a lot more code (9 total paths generated), but looks a lot nicer. You could\
    \ play with any of the graphics more in Inkscape to generate more complicated\
    \ graphics, but we’ll try to keep it to a minimum, to focus on finishing the game.\n\
    \nWe’re getting to the point that it might be worth creating the graphics for\
    \ the tiles in a rasterization paint program (using pixels, not vector), such\
    \ as Photoshop.\n\n## Creating and loading graphics using a paint program\n\n\
    I’ll provide a link to the finished graphics on github, so you can load them into\
    \ your game remotely, or you could just keep the vector based graphics in the\
    \ game. But I’m going to remake all the tiles in a rasterization paint program,\
    \ like ArtClash (the free paint program I created) or Photoshop.\n\nYou’ll want\
    \ to create a new image, 64x64, then begin painting in it. I’ll start with the\
    \ dirt tile, making the whole background a medium brown. Then I put in darker\
    \ brown areas to be mud clumps, add shadows on the bottom half, highlights on\
    \ the top. I did a similar technique for all the tiles. The grass I used a grass\
    \ brush in Photoshop, which makes grass like blades everywhere, alternating between\
    \ a lighter and darker green.\n\nI saved the images in a sub folder, “assets/imgs”,\
    \ and all the images inside of it.\n\nCreate a new folder in your project called\
    \ “assets”, and inside of that a new folder called “imgs”.\n\nGo to the github\
    \ repo, and download the images and save them in your project into the folder\
    \ you created: “assets/imgs”.\n\n## Loading images from file\n\nTo load our rasterized\
    \ graphics, we’re going to have to add some new code to load the images, before\
    \ displaying them in the game. I’ve got to warn you, this is a long one.\n\nWe’re\
    \ going to create a new class under our previous classes named “AssetLoader”:\n\
    \nclass AssetLoader\n\n{\n\n    constructor()\n\n    {\n\n        this.callback=null;\n\
    \n        this.image_containers = new Array();\n\n    }\n\n    //put images in an array ready to be loaded\n\
    \n    AddImageToQueue(name, src)\n\n    {\n\n        let img_container = new Object();\n\
    \n        img_container.src=src;\n\n        img_container.name=name;\n\n        img_container.loaded=false;\n\
    \n        img_container.image= new Image();\n\n        this.image_containers.push(img_container);\n\
    \n    }\n\n}//end of class AssetLoader\n\nIn the constructor, we’ll have a “callback”\
    \ variable- which will be a function we will call when all of our images load.\
    \ That way we can fire a function whenever all the images have finished loading.\
    \ We’ll also create an array that we will store all of our “images” in.\n\nNext,\
    \ we’ll create a function called “AddImageToQueue”, which will take a name for\
    \ the image to be identified with (like “dirt”, or “stone”), and an actual source\
    \ path/ the path from the current folder to get to that image.\n\nWe’ll actually\
    \ just make the “img_container” a generic object initially. You can do it this\
    \ way in JavaScript, but in other languages, you would need to declare an actual\
    \ class first.\n\nNext, we’ll set the object to have a variable named “src”, with\
    \ source location of the image passed in to the function. This is what we’ll actually\
    \ use to load the image later.\n\nNext, we’ll set the other variables on our custom\
    \ “img_container” object. The name we passed in, whether the image has finished\
    \ loading yet (false right now), and create an “image” variable which will hold\
    \ the actual built in “image” type, that we’ll be able to draw in the canvas.\
    \ Finally, we’ll add this to our array of images, so that we can load them after\
    \ we add all the images we plan to load.\n\nNow we can add below the last function\
    \ (inside the AssetLoader class):\n\n//load all the images in the queue, and pass\
    \ a function that will run when all the images have loaded\n\nLoadImages(callback)\n\
    \n{\n\n this.callback=callback;\n\n for (let  i = 0; i < this.image_containers.length;\
    \ i++)\n\n    {\n\n let  img_container = this.image_containers[i];\n\n img_container.image.src=\
    \ img_container.src;//set the actual image type source, which will begin loading\
    \ the image\n\n let  asset_loader= this;//hack to allow us to access \"this\"\
    \ inside the below functions- otherwise \"this\" becomes the image that was loaded\n\
    \n img_container.image.onload = function(event) {asset_loader.ImageLoaded(img_container);};\n\
    \n img_container.image.onerror = function(error) {asset_loader.ImageError(img_container,\
    \ error);};\n\n    }\n\n console.log(\"loading images!\");\n\n}\n\nThis is our\
    \ function to be able to load all the images we queued up to load. First we’ll\
    \ pass in the callback- which function we will call when we’re all done loading\
    \ the images.\n\nThen we go through all the images using a for loop. We set the\
    \ actual “image” object src on our custom “img_container” object to the src we\
    \ passed in earlier. This actually initializes loading the image from disk.\n\n\
    Next we create a temp variable for the class we’re in (asset_loader), because\
    \ when the image gets loaded below, JavaScript will place us inside the image\
    \ that was loaded (which will be now “this”), and we won’t have access to our\
    \ asset_loader. So we have to create a temporary variable that stores what “this”\
    \ currently is (our asset_loader), so we can use it after the image is loaded.\n\
    \nNext, on the actual image, we set the “onload” function that is built into “Image”\
    \ to a quick one-line function. It gets passed the event when the image is loaded,\
    \ but all we care about is the img object we created is now loaded. This function\
    \ will load for every image we are trying to load, and will call our “asset_loader.ImageLoaded”\
    \ function, so we can handle when each image is loaded."
