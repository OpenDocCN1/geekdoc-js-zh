  trans: "\n\n类（class）泛来说只是定义一个用来包含一组相似对象信息的东西（类似于蓝图或一个概念）。它本身不会执行任何操作，因此我们稍后必须在定义后使用它。\n\
    \n## 创建我们自己的类型/类/模板/蓝图\n\n所以，我们这样创建它：\n\n```javascript\nclass Friend\n{\n    constructor()\n\
    \    {\n        this.name = \"someones name\";\n        this.age = 0;\n      \
    \  this.loves_spinach = true;\n        console.log(\"A friend was created, with\
    \ name: \"+this.name+\", age: \"+this.age+\", and loves spinach: \"+this.loves_spinach);\n\
    \    }\n}\n```\n\n在类或函数内部（稍后会详细介绍），你使用大括号（例如：`{}`）来显示类的开始和结束。\n\n关键字 `constructor()`（带有括号的）是一个函数，每当我们从我们的\
    \ friend 类中创建一个新的 `Friend` 实例时，它就会自动运行。它也使用大括号来显示函数的开始和结束。它还需要普通的圆括号（`ex= ()`），这意味着它是一个会被运行/调用的函数，而不是变量。\n\
    \n在类内部声明变量时，你不再需要使用 `let` 关键字，但必须使用 `this.variable_name`，其中 `this` 将引用从该类创建的任何对象。\n\
    \n## 从我们的类创建对象\n\n现在，如果我们想从刚刚定义的类创建一个新的 friend 变量，其中包含另外 3 个变量类型，我们可以这样做：\n\n\
    `let my_friend = new Friend();`\n\n创建一个 1 个新的 friend 对象只需要这些了，这个朋友包含了我们在上面 `Friend`\
    \ 类/蓝图中中定义的所有内容！\n\n这还将自动运行从类创建对象时调用的 `constructor`，它会在新的 friend 对象中（基于 friend\
    \ 类模板）创建 `name`、`age`、`loves_spinach` 变量，并在 `constructor` 函数结束前打印出 `console.log`（每当我们创建一个新\
    \ friend 时，它都会被自动调用）。所以，如果你现在输入这些，你只会看到 `console.log` 的输出。\n\n你的 script 标签看起来如下：\n\
    \n```html\n<script>\n    class Friend\n    {\n        constructor()\n        {\n\
    \            this.name = \"someones name\";\n            this.age = 0;\n     \
    \       this.loves_spinach = true;\n            console.log(\"A friend was created,\
    \ with name: \"+this.name+\", age: \"+this.age+\", and loves spinach: \"+this.loves_spinach);\n\
    \        }\n    }\n    let my_friend = new Friend();\n</script>\n```\n\n如果运行，将打印出：\n\
    A friend was created, with name: someones name, age: 0, and loves spinach: true\n\
    \n如果我们要说更改名字和年龄，可以在创建新 friend 之后在下一行添加：\n\n`my_friend.name=\"Timmy\";`\n`my_friend.age=12;`\n\
    \n为了验证我们是否已更改，我们可以在下一行使用 `console.log` 打印：\n\n`console.log(\"My friend name is:\
    \ \" + my_friend.name + \", and his age is: \"+ + my_friend.age);`\n\nJavaScript\
    \ 还允许你打印整个对象，如果你想看它的样子的话：\n\n`console.log(my_friend);`\n\n所以，如果我们想再创建一个新 friend，只需执行相同的操作（它会查看类，从该类创建一个新对象，并返回给我们新对象），只需在下一行添加：\n\
    \n`let my_other_friend = new Friend();`\n\n如果你打印这个，你可以看到它和 `my_friend` 是不同的对象，但它们都基于\
    \ `Friend` 类，内部都具有相同类型的变量，但存储在变量中的值不同（这个朋友拥有我们在构造函数中分配给它的默认名字、年龄等）\n`console.log(my_other_friend);`\n\
    \n要更改名字和年龄，我们需要做类似这样的操作：\n`my_other_friend.name=\"Betty Sue\";`\n`my_other_friend.age=10;`\n\
    \n但如果我们在创建 friend 的同时分配名字和年龄，不是就很好吗，而不是非要写 3 行代码，因为我们可能永远不会使用默认的名字/年龄？再次强调，是有方法的！你的最终代码应该看起来类似于\n\
    \n```html\n<script>\n    class Friend\n    {\n        constructor()\n        {\n\
    \            this.name = \"someones name\";\n            this.age = 0;\n     \
    \       this.loves_spinach = true;\n            console.log(\"A friend was created,\
    \ with name: \"+this.name+\", age: \"+this.age+\", and loves spinach: \"+this.loves_spinach);\n\
    \        }\n    }\n    let my_friend = new Friend();\n    my_friend.name=\"Timmy\"\
    ;\n    my_friend.age=12;\n    console.log(\"My friend name is: \" + my_friend.name\
    \ + \", and his age is: \"+ my_friend.age);\n    console.log(my_friend);\n   \
    \ let my_other_friend = new Friend();\n    console.log(my_other_friend);\n   \
    \ my_other_friend.name=\"Betty Sue\";\n    my_other_friend.age=10;\n    console.log(my_other_friend);\n\
    </script>\n```\n\n向构造函数传递值\n\n实际上我们可以将我们想要的变量传递给构造函数，而不是使用默认值，所以我们将类修改为：\n\n```javascript\n\
    class Friend\n{\n    constructor(their_name, their_age, their_loves_spinach)\n\
    \    {\n        this.name = their_name;\n        this.age = their_age;\n     \
    \   this.loves_spinach = their_loves_spinach;\n        console.log(\"A friend\
    \ was created, with name: \"+this.name+\", age: \"+this.age+\", and loves spinach:\
    \ \"+this.loves_spinach);\n    }\n}\n```\n\n所以，我们现在可以这样做来传递我们想要的变量，传递给构造函数：\n\n\
    `let my_new_friend = new Friend(\"Steve\", 12);`\n\n这传递了 \"Steve\" 并赋值给第一个参数 `their_name`，传递了\
    \ 12 并赋值给下一个参数 `their_age`，最后传递给它的的是 false，并存储在变量 `their_loves_spinach` 中。注意：构造函数中的变量名称（例如\
    \ `their_name`、`their_age` 等）可以是任何名称，因为它们只存在于构造函数内部。我们可以调用它们为 `var1`、`var2` 或\
    \ `param1`、`param2` 等，这取决于你的。但由于它们在构造函数的参数中定义，它们在外部是不存在的。\n\n所以现在我们可以非常容易地创建 friend，而且只需要一行代码！\n\
    \n示例：\n\n`let my_new_friend = new Friend(\"Steve\", 12, false);`\n`let my_new_friend2\
    \ = new Friend(\"Zhanna Matall\", 36, true);`\n`let my_new_best_friend = new Friend(\"\
    Jerriah\", 1, false);`\n\n但如果我们想让他们打印出信息呢？现在我们需要这样做：\n`console.log(\"Hi, my name\
    \ is: \"+my_friend.name+\", my age is: \"+my_friend.age+\", and do I love spinach?\
    \ \"+my_friend.loves_spinach+\".\");` 每一个朋友都要！如果有 5 个朋友，要打的文字就非常多了。\n\n## 函数 /\
    \ 方法 - 执行操作\n\n幸运的是有！我们可以在类中放入一个自定义函数，类似于构造函数，我们可以在任何时候让它运行。所以，将我们的 friend 类修改为：\n\
    \n```javascript\nclass Friend\n{\n    constructor(their_name, their_age, their_loves_spinach)\n\
    \    {\n        this.name = their_name;\n        this.age = their_age;\n     \
    \   this.loves_spinach = their_loves_spinach;\n        console.log(\"A friend\
    \ was created, with name: \"+this.name+\", age: \"+this.age+\", and loves spinach:\
    \ \"+this.loves_spinach);\n    }\n    SayHi()\n    {\n        console.log(\"Hi,\
    \ my name is: \"+this.name+\", my age is: \"+this.age+\", and do I love spinach?\
    \ \"+this.loves_spinach+\".\");\n    }\n}\n```\n\n所以，我们刚刚创建了一个名为 `SayHi` 的新函数，我们没有传递任何变量，因为它已经从任何\
    \ friend 对象中获取了所有的信息，因为它们在对象内部（名字、年龄等）。\n\n"
- fmt: "\nNow you can just call/run this function for it to print out all the friend\
    \ information, like:\n\n```javascript\nmy_new_friend.SayHi();\nmy_new_friend2.SayHi();\n\
    my_new_best_friend.SayHi();\n```\n\nSo now we have a friend class/ template/ blueprint\
    \ that we're using to create several friend objects. They are based on the class/\
    \ all have the same variable types and functions, but can each store different\
    \ information in their own object variables. They are all friend type objects,\
    \ but can have a different name or age than the other ones.\n\nWe also have them\
    \ passing in the values for their variables through the constructor when they\
    \ get created, and added a function to make them tell us about themselves.\n\n\
    Wouldn't it be cool if we could now actually see our friends somehow? Like drawing\
