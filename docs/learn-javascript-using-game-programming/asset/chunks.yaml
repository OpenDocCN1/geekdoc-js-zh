  raw: 'Select the second option "html:5      Emmet….", and it should fill out a basic
    HTML page with boilerplate code:


    ![](Images/image00467.jpeg)


    Now to actually add something so we can see our webpage when we launch it with
    live server.


    Add above "</body>":


    <!DOCTYPE html>


    <html lang="en">


    <head>


        <meta charset="UTF-8">


        <meta http-equiv="X-UA-Compatible" content="IE=edge">


        <meta name="viewport" content="width=device-width, initial-scale=1.0">


        <title>Document</title>


    </head>


    <body>


        <h1>This is HTML on my webpage!</h1>


        <script>


            alert("hello from JavaScript!");


        </script>


    </body>


    </html>


    So your code will look like:


    ![](Images/image00468.jpeg)


    Right click anywhere in the code and select-> "Open with Live Server", which will
    start up the live server, open your webpage in your browser window, and should
    look like:


    ![](Images/image00469.jpeg)


    If you keep this window open in the background, whenever you change anything in
    the code, the webpage will automatically be updated, using live server. So Try
    to keep this browser window open, while working in visual code in the background,
    and just swap windows to see your webpage updated whenever you save.


    If you do accidentally close it, don’t worry- just right click in visual code
    again, and choose to launch with live server again to have it re-open your browser
    with your webpage!


    ## Understanding the HTML boilerplate code


    If you don’t know anything about HTML, It would be useful to search online for
    a basic tutorial on what HTML is, such as searching for "basic html", this comes
    up: [https://www.w3schools.com/html/html_basic.asp](https://www.w3schools.com/html/html_basic.asp)


    Basics of html tags


    A html tag will usually be in this format: <atag> some info</atag>. The "atag"
    here is a predefined word, which you can look up by looking for "html tags" in
    the search engine.


    But a html tag is always wrapped in triangle like brackets, one "opening the tag":
    "<anothertag>", followed by information you want in the tag: "this is in the tag",
    and finally closing the tag, which is just the same as the opening tag, but with
    a forward slash in front of the words (indicating you’re closing the tag): "</anothertag>".


    How is this useful?


    The tags in html let the browser know what is going to be inside them. Whether
    it be the container of the html page, where the JavaScript will go, or text on
    the screen, which can be made up of paragraphs, headers, etc. It''s basically
    how you talk to the browser, to let it know what to do with the info you give
    it.


    Basic structure of an html page


    The basic structure of an html page is just:


    <html>


        <head>


        </head>


        <body>


        </body>


    </html>


    The "html" tag just lets the browser know where your web page starts and ends.


    The head tag


    The "head" tag is the first tag inside html, which can have stuff in it that will
    not be visible on the page.


    This can be stuff like CSS (cascading style sheets), which is used for styling
    your webpage, such as changing colors, positioning things, and making the html
    content look cool.


    Or you can put JavaScript tags in there, which runs before the page is fully loaded.
    Or as you saw above, a "title" tag, which shows the title of your website in the
    browser.


    There''s other stuff you can put in there, including some of the stuff inserted
    in the boilerplate code such as:


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    Which allows web pages to scale properly on mobile devices. There are many other
    predefined tags, which you can do a web search on if you want to learn more, but
    we''ll just be using the boiler plate code for our purposes.


    The body tag


    The "body" tag is where the actual content of your page will go. If you want text,
    images, headers (such as "chapter 1" or "what I did this summer"), it all goes
    in the body tag. Additionally, if you want your JavaScript to run after the rest
    of the page has loaded (which is common these days to be able to access html on
    the page), you''ll want to put it right before the end of the body tag.


    We used the "h1" tag (also known as "Header 1") for some text on the page. H1
    is your biggest header for your most important information about your page (like
    "Welcome to my awesome webpage"), but headers can go all the way down to h6, which
    is the smallest header.


    For normal text you can use a paragraph tag (such as: <p> I like turtles because
    turtles eat pizza, are expert ninjas…. </p>). You can search online for "html
    tags" and find a bunch of them, including image, divs (divisions- for separating
    your html page into different rectangles, for things like 2 column layouts), canvas
    (to draw on for games), etc.


    I''ll include more info on html tags we need as we go along, but in general, just
    search online if you find you want to add something to a webpage, but you don''t
    know how yet, and you''re likely to find the info you need.


    Script tag


    We used the "script" tag to put some JavaScript into the page:


    <script>


        alert("hello from JavaScript!");


    </script>


    All of our JavaScript goes inside this html script tag. Once we''re inside the
    script tag, you can''t use any more html tags inside of it- it becomes a programming
    only area/block.


    "alert" is a function built into all browsers, which allows you to put a notification
    box that pops out of the browser when it''s run.


    It''s pretty annoying, but that was originally the most widely used JavaScript
    across the web, and you could actually lock up a browser by spamming it constantly.
    But you''ll find that JavaScript has come a long way in recent years from a humble
    beginning of being used primarily for annoying pop ups!


    ### Chapter example on github:


    [https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/2_Boilerplate.html](https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/2_Boilerplate.html)


    # 3. Programming concept: Variables


    ## Storing Strings


    The first thing to learn to begin programming is about variables. Variables are
    just names you give to a value you want to remember.


    For example- I have 3 friends.


    Friend 1 is named Tom Smith. He''s 9 years old, has brown hair, his catchphrase
    is "Tom in da house!", and loves spinach.


    Friend 2 is Jill Jones. She''s 18 years old, has blonde hair, her catchphrase
    is "Jillin be illin!", and doesn''t love spinach.


    Friend 3 is Steve Thomas. He''s 22 years old, has red hair, his catchphrase is
    "Who took my stapler?", and also doesn''t love spinach.


    My memory is pretty terrible, so I''m going to store my friends'' information
    in variables on the computer.


    Some rules for creating variables:


    ● In JavaScript, you create a new variable using the keyword ''let'' (or in the
    past ''var'').


    ● A variable name can''t have any spaces in it, so I use underscores (example:
    "my_var_name") instead of spaces.


    ● If you want to store words like a name (which is called a string), you need
    to put it in between 2 quotes: "_ _ _ _" or "It was a dark and stormy…".


    ● You also need to end each line with a semicolon, to let JavaScript know you
    finished what you wanted to say.


    So, let''s create 3 variables for each of our friends'' names. Inside the script
    tag add:


    let friend1_name = "Tom Smith";


    let friend2_name = "Jill Jones";


    let friend3_name = "Steve Thomas";


    That''s all we have to do to create 3 variables, one for each friend''s name,
    and store their names in memory!


    We used underscores instead of spaces in the variable names (friend1_name), and
    quotes around text we want to store, which can have spaces in it (example: "Tom
    Smith").


    But how do we know we actually created these variables (aside from not seeing
    any errors)?


    There is a built-in statement that you can use to see what your program is doing
    called “console.log()”, example:


    console.log("put something in here!");'
