  trans: "\n接下来，我们设置实体特定所需的所有默认变量。它们的初始状态（`idle`）、默认方向（`down`）、它们的目的地，以及与移动相关的变量，最后是一个将特定状态与特定动画关联的数组，这样当我们处于某个给定状态（如行走、攻击等）时，就可以查找应该使用哪种动画。\n\
    \n我们需要向此类中添加几个函数来完成它的功能：\n\n```javascript\nDraw(ctx, delta_ms)\n{\n  super.Draw(ctx,\
    \ delta_ms);\n  this.MoveToDest(delta_ms);\n}\n```\n\n`Draw` 函数只需接收我们绘制所需的内容（上下文和自上一帧以来经过的时间），调用\
    \ `super.Draw` 函数，该函数会调用基类 `Sprite` 类的 `Draw` 函数。接下来我们调用 `MoveToDest` 函数（该函数从我们原始的\
    \ `Friend` 类中获取），它允许我们的 `Entity` 检查是否需要移动到某处并移动那里。\n\n接着添加另一个函数：\n\n```javascript\n\
    ChangeState(new_state)\n{\n  if(this.state!=new_state||this.dir!=this.curr_anim.dir)\n\
    \    {\n    console.log(\"changing state to: \"+new_state);\n    this.state=new_state;\n\
    \    let new_anim = this.GetAnimIndex(this.state);\n    if(new_anim!=-1)\n   \
    \   {\n        this.curr_anim=new_anim;\n        this.animations[this.curr_anim].frame=0;\n\
    \      }\n  }\n}\n```\n\n`ChangeState` 函数将传入一个新状态。如果它不是我们当前处于的状态，我们将把状态设置为新状态。然后我们将尝试获取该状态的动画——如果是\
    \ -1，意味着没有找到（因为动画存储在数组中，数组始终从 0 开始）。如果不是 -1，我们将播放不同的动画，因此我们将找到的数字设置为新的当前动画，并将该动画设回第\
    \ 0 帧/重置动画。\n\n接着添加另一个函数：\n\n```javascript\nChangeDirection(direction)\n{\n  if(this.dir!=direction)\n\
    \    {\n    this.dir=direction;\n    // 如果不是向左，则也应该翻转动画以向左\n    if(this.dir==Entity.DIRECTION.LEFT)\n\
    \    this.flip_x=true;\n    else if(this.dir==Entity.DIRECTION.RIGHT)\n    this.flip_x=false;\
    \    \n    // 如果方向发生变化，强制更新正在播放的动画：\n    this.ChangeState(this.state);       \n\
    \    }\n}\n```\n\n`ChangeDirection` 函数将传入一个方向，如果该方向与当前方向不同，它将设置该方向，如果方向向左则会将 `flip_x`\
    \ 设置为 true。这将允许我们在渲染时告诉帧动画进行翻转并重新定位。\n\n接下来从我们的 `friend` 类中添加另一个函数：\n\n```javascript\n\
    SetDestination(x_dest, y_dest)\n{\n  this.x_dest=x_dest;\n  this.y_dest=y_dest;\n\
    \  this.moving_x=true;\n  this.moving_y=true;\n  this.ChangeState(Entity.STATE.WALKING);\n\
    }\n```\n\n`SetDestination` 函数将接收 x 和 y 目的地并设置它们，将两个移动状态设置为 true，并将实体状态改为行走，因为现在它设置了目的地。\n\
    \n接下来从我们的 `friend` 类中添加另一个函数：\n\n```javascript\nMoveToDest(delta_ms)\n{\n  let\
    \ was_moving = false;\n  if(this.moving_x)\n    {\n    was_moving=true;\n    if(this.x_dest>this.x)\n\
    \        {\n        this.ChangeDirection(Entity.DIRECTION.RIGHT);\n        this.x+=move_speed*delta_ms;\n\
    \        if(this.x>=this.x_dest)\n          {\n          this.x=this.x_dest;\n\
    \          moving_x=false;\n            }\n        }\n    else  // x_dest < x，所以向左移动/x\n\
    \        {\n        this.ChangeDirection(Entity.DIRECTION.LEFT);\n        this.x-=move_speed*delta_ms;\n\
    \        if(this.x<=this.x_dest)\n          {\n          this.x=this.x_dest;\n\
    \          moving_x=false;\n            }\n        }\n    }\n  if(this.moving_y)\n\
    \    {\n    was_moving=true;\n    if(this.y_dest>this.y) // 如果目的地大于 y，向下移动，y 增加\n\
    \      {\n      this.ChangeDirection(Entity.DIRECTION.DOWN);\n      this.y+=move_speed*delta_ms;\n\
    \      if(this.y>=this.y_dest)\n          {\n        this.y=this.y_dest;\n   \
    \     moving_y=false;\n        } else  // y_dest < y，所以向上移动/y\n      {\n     \
    \ this.ChangeDirection(Entity.DIRECTION.UP);\n      this.y-=move_speed*delta_ms;\n\
    \      if(this.y<=this.y_dest)\n          {\n        this.y=this.y_dest;\n   \
    \     moving_y=false;\n        }\n      }\n    }\n  if(was_moving)\n    if(!this.moving_y\
    \ && !this.moving_x)\n    this.ChangeState(Entity.STATE.IDLE);\n}\n```\n\n`MoveToDest`\
    \ 函数与我们在 `friend` 类中的基本一致。但我们还会跟踪 `was_moving` 以判断实体是否有目的地但已到达——这样我们就可以将状态更改为空闲。如果实体向左或右移动，我们也会改变方向，这将改变动画。\n\
    \n接着添加另一个函数：\n\n```javascript\nAddAnimation(anim, anim_state, direction)\n{\n\
    \  this.animations.push(anim);\n  this.state_to_anim.push({state:anim_state, anim_index:this.animations.length-1,\
    \ dir:direction});\n}\n```\n\n此函数将传入一个动画以及在该状态下播放的状态。它会将动画添加到我们的动画数组中。然后它将推入一个新的对象，存储状态以及动画添加到数组的索引（为长度减\
    \ 1）。我们还添加了方向，以便将来可以根据玩家/实体面向的方向播放不同的动画。\n\n最后一个添加的函数：\n\n```javascript\nGetAnimIndex(anim_state)\n\
    {\n  let anim_index=-1;\n  for (let i = 0; i < this.state_to_anim.length; i++)\n\
    \    {\n    if(this.state_to_anim[i].state == anim_state)\n      {\n      if(this.state_to_anim[i].dir==this.dir||\
    \ this.state_to_anim[i].dir==undefined)\n        {\n        anim_index= this.state_to_anim[i].anim_index;\
    \    \n        break;\n        }\n      }\n    }\n  return anim_index;\n}\n```\n\
    \n`GetAnimIndex` 将传入一个状态，然后遍历与动画相关的数组，找到我们要的状态，并返回该动画的索引，以便播放该状态的动画。我们最初将动画索引设置为\
    \ `-1`，因为数组从 0 开始，永远不可能是 -1，所以如果它保持为 -1，我们就知道没有找到该状态的动画。\n\n我们还会检查动画的方向是否与实体的方向相同，或者如果没有定义方向，我们将直接使用它。这样如果我们以后为不同方向准备不同的动画，它将获取正确的动画（例如向右走的动画而不是向下的）。但现在它可能是\
    \ `undefined`，所以如果我们没有多个方向的动画，它仍然可以使用。\n\n最后，在这个类之后创建一个新类：\n\n```javascript\n\
    class Player extends Entity\n{\n  Draw(ctx, delta_ms)\n  {\n    super.Draw(ctx,\
    \ delta_ms);\n  \n}\n```\n\n这个 `player` 类继承了 `Entity` 类，但内部只有一个 `Draw` 函数，它只是调用\
    \ `super`/`Entity` 类的 `draw` 函数。现在它并没有做什么，但我们稍后会添加更多内容来区分玩家与其他类型的实体。\n\n## 创建动画类\n\
    \n那么，让我们创建一个类来加载精灵图集、确定动画每帧的位置，并能够在屏幕上作为动画显示它。\n\n我们需要传入图像、帧的宽度和高度、动画开始的列（x 方向）和行（y\
    \ 方向），以及动画有多少帧。通过这些信息，我们可以找到动画在精灵图集集中的位置，并能够拆分出动画每帧的位置。\n"
- fmt: "\n## FlipBook Class Implementation\n\n```javascript\n//image, size of each\
    \ frame, where the animation starts, how many frames, scale to draw onscreen,\
    \ how long to wait in before changing to the next frame\nconstructor(image, width_frame,\
    \ height_frame,\n            start_column_x, start_row_y,\n            num_frames,\n\
    \            scale,\n            delay_ms)\n{\n    this.image=image;\n    this.width_frame=width_frame;\n\
    \    this.height_frame=height_frame;\n    this.num_frames=num_frames;\n    this.scale=scale;\n\
    \    this.delay_ms=delay_ms;\n    this.width_drawn=width_frame*scale;\n    this.height_drawn=height_frame*scale;\n\
    \    this.timer=0; //timer for switching to next frame\n    this.frame=0; // current\
    \ frame, going from 0 to num_frames-1\n    // offsets to draw with an offset/centered\
    \ around the parent object\n    this.offset_x=0;\n    this.offset_y=0;\n// if\
    \ we don't always want the frame centered- since frames can be wide for other\
    \ animations (like a wide attack vs narrow idle), we can offset them from center\
    \ more\n    this.offset_x_extra=0;\n    this.offset_y_extra=0;\n    // frames\
    \ will be x and y positions in the texture atlas, assuming moving from left to\
    \ right, and possibly wrapping onto new rows\n    this.frames=new Array();\n \
    \   // start columns from the user will start at 1- but in here we need to start\
    \ at 0\n    start_column_x--;\n    start_row_y--;\n    let x=start_column_x*width_frame;\n\
    \    let y=start_row_y*height_frame;\n    // figure out the x and y position of\
    \ each frame\n    while(this.frames.length<this.num_frames)\n    {\n        this.frames.push({x:x,\
    \ y:y});\n        x+=width_frame;\n        if(x>image.width)//if the x is now\
    \ outside the image passed the right side of our texture atlas, have it wrap down\
    \ to the start of the next row\n        {\n            x=0;\n            y+=height_frame;\n\
    \        }\n    }\n} //end of class FlipAnimation\n```\n\n### Constructor Logic\n\
    First, we pass in everything we’ll need to figure out where our frames will be,\
    \ and what we need to be able to draw a frame out. We pass in the sprite sheet,\
    \ the width and height of each frame, the start column and row of the animation\
    \ we’re looking for, and how many frames the animation goes for. We also pass\
    \ in what we’ll scale the original frame size when we draw the frames on screen;\
    \ in case the sprite sheet uses smaller/larger sprites than we want to use in\
    \ our game. Lastly, we pass in the delay we want between frames so we can slow\
    \ down animations by increasing the delay, or speed them up by decreasing the\
    \ delay.\n\nWe assign all the variables passed to the object’s variables (`this`\
    \ to assign it to the current object). We figure out the width and height of what\
    \ we’ll draw to screen (`scale * width and height`). We set the timer to 0 which\
    \ will be used to count how long the total time has been between each frame. We\
    \ set the current frame to 0, the first one.\n\nWe’re going to have `x` and `y`\
    \ offsets to position the animation differently depending on the dimensions of\
    \ the parent. For instance, if the parent is less wide than the animation (which\
    \ is the case for the animations), we’ll want to center the animations so it looks\
    \ more correct. We also assume the user will give us the column and row the animation\
    \ is in starting at the first column/row instead of the 0 column or row, so we\
    \ have to minus 1 to change it to start with 0, since that is the way they’ll\
    \ be taken out of the main image (the left top is 0,0, the next frame would be\
    \ 0+width, 0+width*2, etc.).\n\nNext, we’re going to start grabbing the positions\
    \ out of the overall image. We set the start row and column to be whichever they\
    \ gave us (but starting at 0), and multiply it by the width and height of each\
    \ frame to go to the correct starting position for the frame in the image. Now,\
    \ we check `while` we haven’t gotten all the frames yet (the length of our `frames`\
    \ array is less than the number of frames we’re looking for), we’ll keep grabbing\
    \ more frames. We’ll push the current frame position (the start position initially),\
    \ and then move one frame to the right (by adding the width of the frame). If\
    \ the current position + the width of the frame is greater than the full image\
    \ width we’ve gone too far over the right side/off the image, so we need to reset\
    \ `x` back to 0 it will be on the left side of the image, and increase `y` by\
    \ one frame height to go onto the next row. We then repeat this until we have\
    \ all of our frames!\n\n### Draw Method\nWe also need to add a function into this\
    \ class to be able to draw out our animation. So, add this function to the `FlipBookAnimation`\
    \ class:\n\n```javascript\nDraw(ctx, delta_ms, x, y, flip_x)\n{\n    //if flipped,\
    \ have to save, then flip the entire canvas, draw, then restore the original canvas\
    \ drawing\n    if(!flip_x)\n    {\n        debug_boxes.DrawDebugBox(ctx, x+this.offset_x,\
    \ y+this.offset_y, this.width_drawn, this.height_drawn, 2, \"#0000ff\");\n   \
    \     ctx.drawImage(this.image,\n            this.frames[this.frame].x, this.frames[this.frame].y,\n\
    \            this.width_frame, this.height_frame,\n            x+this.offset_x+this.offset_x_extra,\
    \ y+this.offset_y+this.offset_y_extra,\n            this.width_drawn, this.height_drawn);\n\
    \    }\n    else\n    {\n        ctx.save();\n        ctx.scale(-1, 1);\n    \
    \    debug_boxes.DrawDebugBox(ctx, -x-(this.width_drawn+this.offset_x), y, this.width_drawn,\
    \ this.height_drawn, 2, \"#0000ff\");\n        ctx.drawImage(this.image,\n   \
    \         this.frames[this.frame].x, this.frames[this.frame].y,\n            this.width_frame,\
    \ this.height_frame,\n            -(x+this.offset_x-this.offset_x_extra+this.width_drawn),\
    \ y+this.offset_y+this.offset_y_extra,\n            this.width_drawn, this.height_drawn);\n\
    \        ctx.restore();\n    }\n    this.timer+=delta_ms;\n    if(this.timer>this.delay_ms)\n\
    \    {\n        this.timer=0;\n        this.frame++;\n        if(this.frame==this.num_frames)\
    \ //the maximum frame should be 1 less than the number of frames\n        {\n\
    \            this.frame=0;\n        }\n    }\n}\n```"
