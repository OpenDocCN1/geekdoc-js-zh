  trans: "\n我下载了精灵图集（sprite sheet），并将其添加到包含其他图像资源的文件夹中。我们现在可以通过我们的资源加载器加载图像，但它是一个包含角色所有动画的精灵图集，而不仅仅是单张图像。因此，我们必须拆分图像区域，并为图集上一系列图像创建“动画”。\n\
    \n我还发现了另一个看起来很有用的精灵图集，至少它为不同的动画准备了许多行和列，在下一行还有一些动画序列，这为我们测试创建精灵图集加载器提供了更多素材。\n\
    \n[动画像素英雄 (https://rvros.itch.io/animated-pixel-hero)](https://rvros.itch.io/animated-pixel-hero)\n\
    \n![](img/image00483.jpeg)\n\n## 精灵图集与纹理图集 (Sprite Sheets and texture atlases)\n\
    \n从这些图片可以看出，精灵图集上有多个“精灵”（精灵即在我们程序中显示的图像）。精灵图集通常包含游戏中某个角色/物品的所有动画，如果图集上有额外空间，还可能包含多个角色的动画。\n\
    \n加载纹理并在随后将其分成多个部分会使事情变得复杂，更不用说还需要使用特殊工具将所有图像放在一张巨大的图像上了。\n\n为什么要把它们放在一个纹理上而不是多个纹理上？最大的原因是切换图像以进行绘制需要时间——所以如果你能将更多图像放在较少的纹理/包含许多图像的整体图中，绘制它们的时间就会短很多，获得更好的游戏速度（fps）。\n\
    \n另一个原因是打开每个文件也需要时间——所以加载几张大图像比加载一堆小图像花费的时间少。\n\n你实际上可以使用像“texturepacker pro”这样的程序，它可以旋转你的图像，并使用复杂的算法尝试尽可能将它们打包在一起，以节省空间/最大化纹理上存储存储精灵数量。\n\
    \n精灵图集和纹理图集是类似的概念。纹理图集通常包含更高级的打包算法，并包含一个文本（通常是 JSON 格式）文件，描述每个部分的位置，以便你轻松从中提取图像。\n\
    \n另一方面，精灵图集通常只是包含精灵的等大小框的网格。你只需要知道图集中每个精灵单元有多大，就可以推算出每个精灵的位置。\n\n我们的计划是首先创建一个类来显示我们所有的精灵——从瓦片、玩家、敌人到\
    \ NPC。它们共同拥有一个用于在屏幕上绘制的 `x` 和 `y` 位置，以及用于绘制它们的 `width` 和 `height`，以及图像或动画用于绘制。\n\
    \n## 调试框类 (A debug box class)\n\n我们可以创建一个小型调试框类，以便检查精灵/动画在屏幕上的位置与绘制位置的对比。动画的某些帧中存在空白，这使得很难看到实际绘制位置在哪里。因此，这更容易看到如何相对于它们所在的精灵来对齐/定位动画。将此添加到你的类底部：\n\
    \n```\n//用于在精灵、动画周围绘制调试框\n\nclass DebugBox {\n  constructor() {\n  }\n  DrawDebugBox(ctx,\
    \ x, y, width, height, thickness, color) {\n    ctx.fillStyle = color;\n    ctx.fillRect(x,\
    \ y, width, thickness); //顶\n    ctx.fillRect(x, y+height-thickness, width, thickness);\
    \ //底\n    ctx.fillRect(x, y, thickness, height); //左\n    ctx.fillRect(x+width-thickness,\
    \ y, thickness, height); //右\n  }\n}\n//类 DebugBox 结束\n```\n\n## 创建精灵类 (Creating\
    \ a sprite class)\n\n我们将创建一个精灵类，它主要负责跟踪 `x` 和 `y` 位置、`width`、`height`，并能够在该位置+尺寸上绘制图像或动画。\n\
    \n```javascript\nclass Sprite {\n  constructor(x, y, width, height, image) {\n\
    \    this.x = x;\n    this.y = y;\n    if (width == undefined)\n      width =\
    \ Tile.width;\n    if (height == undefined)\n      height = Tile.height;\n   \
    \ this.width = width;\n    this.height = height;\n    this.image = image;\n  \
    \  this.animations = new Array();\n    this.curr_anim = 0;\n    this.flip_x =\
    \ false;\n  }\n  Draw(ctx, delta_ms) {\n    if (this.image != undefined)\n   \
    \   ctx.drawImage(this.image, this.x, this.y);\n    if (this.animations.length\
    \ > 0) {\n      this.animations[this.curr_anim].Draw(ctx, delta_ms, this.x, this.y,\
    \ this.flip_x);\n    }\n  }\n}\n//类 Sprite 结束\n```\n\n## 创建实体 (Creating an entity\
    \ and player)\n\n我们在这里使用的第一个新事物是“extends”-实体将是一个精灵，获取它所有的变量和函数，并能够添加自己的新变量，甚至覆盖/替换我们在精灵类中创建的函数。\n\
    \n```javascript\nclass Entity extends Sprite {\n  static DIRECTION = { UP: 0,\
    \ DOWN: 1, LEFT: 2, RIGHT: 3 };\n  static STATE = { IDLE: 0, WALKING: 1, RUNNING:\
    \ 2, ATTACKING: 3 };\n\n  constructor(x, y, width, height, image) {\n    super(x,\
    \ y, width, height, image);\n    this.state = Entity.STATE.IDLE;\n    this.dir\
    \ = Entity.DIRECTION.DOWN;\n    this.x_dest = 0;\n    this.y_dest = 0;\n    this.moving_x\
    \ = false;\n    this.moving_y = false;\n    this.move_speed = 0.2;\n    this.state_to_anim\
    \ = new Array();\n  }\n}\n//类 Entity 结束\n```\n"
- fmt: "\nNext, we set all the default variables that entity’s specifically need.\
    \ The state they start in (`idle`), the default direction (`down`), their destination,\
    \ and the variable related to moving, and finally an array that will associate\
    \ a certain state with a certain animation, so that we can look up which animation\
    \ to use if we’re in a given state (like walking, or attacking, etc).\n\nWe need\
    \ to add several functions to this class to complete its functionality:\n\n```javascript\n\
    Draw(ctx, delta_ms)\n{\n  super.Draw(ctx, delta_ms);\n  this.MoveToDest(delta_ms);\n\
    }\n```\n\nThe `Draw` function just takes in what we need to be able to draw (context\
    \ and time that has passed since the last frame), calls the `super.Draw` function,\
    \ which calls the base `Sprite` class `Draw` function. Next we call the `MoveToDest`\
    \ function, which we’ll get from our original `Friend` class, that will allow\
    \ our `Entity` to check if it needs to move somewhere, and to move there.\n\n\
    Next add another function:\n\n```javascript\nChangeState(new_state)\n{\n  if(this.state!=new_state||this.dir!=this.curr_anim.dir)\n\
    \    {\n    console.log(\"changing state to: \"+new_state);\n    this.state=new_state;\n\
    \    let new_anim = this.GetAnimIndex(this.state);\n    if(new_anim!=-1)\n   \
    \   {\n        this.curr_anim=new_anim;\n        this.animations[this.curr_anim].frame=0;\n\
    \      }\n  }\n}\n```\n\nThe `ChangeState` function will get passed in a new state.\
    \ If it isn’t the state we currently are in, we’ll then set the state to the new\
    \ state. We’ll then try to grab the animation for this state- if it’s -1, it means\
    \ it couldn’t be found (since the animations are in an array, which always starts\
    \ at 0). If it isn’t -1, we’re going to be playing a different animation, so we’ll\
    \ set the number we found as the new current animation, and set that animation\
    \ back to frame 0/ resetting the animation.\n\nNext add another function:\n\n\
    ```javascript\nChangeDirection(direction)\n{\n  if(this.dir!=direction)\n    {\n\
    \    this.dir=direction;\n    //should also flip animation to go left if they\
    \ weren't\n    if(this.dir==Entity.DIRECTION.LEFT)\n    this.flip_x=true;\n  \
    \  else if(this.dir==Entity.DIRECTION.RIGHT)\n    this.flip_x=false;    \n   \
    \ //also force it to update the animation being played if the direction changed:\n\
    \    this.ChangeState(this.state);       \n    }\n}\n```\n\nThe `ChangeDirection`\
    \ function will be passed in a direction, and if the direction is different than\
    \ the current one, it will set it, and set `flip_x` to true if that direction\
    \ is left. This will allow us to tell the flipbook animation to flip and reposition\
    \ when rendering.\n\nNext add another function from our `friend` class:\n\n```javascript\n\
    SetDestination(x_dest, y_dest)\n{\n  this.x_dest=x_dest;\n  this.y_dest=y_dest;\n\
    \  this.moving_x=true;\n  this.moving_y=true;\n  this.ChangeState(Entity.STATE.WALKING);\n\
    }\n```\n\nThe `SetDestination` function will take in the x and y destination,\
    \ set it, and set the moving state for both to be true, and change the entity\
    \ state to walking, since now it has a destination set.\n\nNext add another function\
    \ from our `friend` class:\n\n```javascript\nMoveToDest(delta_ms)\n{\n  let was_moving\
    \ = false;\n  if(this.moving_x)\n    {\n    was_moving=true;\n    if(this.x_dest>this.x)\n\
    \        {\n        this.ChangeDirection(Entity.DIRECTION.RIGHT);\n        this.x+=this.move_speed*delta_ms;\n\
    \        if(this.x>=this.x_dest)\n            {\n          this.x=this.x_dest;\n\
    \          this.moving_x=false;\n            }\n        }\n    else  //x_dest\
    \ < x -so need to move to the left/ -x\n        {\n        this.ChangeDirection(Entity.DIRECTION.LEFT);\n\
    \        this.x-=this.move_speed*delta_ms;\n        if(this.x<=this.x_dest)\n\
    \            {\n          this.x=this.x_dest;\n          this.moving_x=false;\n\
    \            }\n        }\n    }\n  if(this.moving_y)\n    {\n    was_moving=true;\n\
    \    if(this.y_dest>this.y) // if dest is greater, move him down, where y increases\n\
    \      {\n      this.ChangeDirection(Entity.DIRECTION.DOWN);\n      this.y+=this.move_speed*delta_ms;\n\
    \      if(this.y>=this.y_dest)\n          {\n        this.y=this.y_dest;\n   \
    \     this.moving_y=false;\n        }\n      } else  //y_dest < y -so need to\
    \ move upward/ -y\n      {\n      this.ChangeDirection(Entity.DIRECTION.UP);\n\
    \      this.y-=this.move_speed*delta_ms;\n      if(this.y<=this.y_dest)\n    \
    \      {\n        this.y=this.y_dest;\n        this.moving_y=false;\n        }\n\
    \      }\n    }\n  if(was_moving)\n    if(!this.moving_y && !this.moving_x)\n\
    \    this.ChangeState(Entity.STATE.IDLE);\n}\n```\n\nThe `MoveToDest` function\
    \ is pretty much as it was in our friend class. But we’re also going to track\
    \ `was_moving`, to see if the entity had a destination, but reached it- so we\
    \ can then change the state to idle if they’ve reached it. We also change the\
    \ direction to left or right if the entity is moving or right, which will change\
    \ the animation\n\nNext add another function:\n\n```javascript\nAddAnimation(anim,\
    \ anim_state, direction)\n{\n  this.animations.push(anim);\n  this.state_to_anim.push({state:anim_state,\
    \ anim_index:this.animations.length-1, dir:direction});\n}\n```\n\nThis function\
    \ will just be passed in an animation, and which state this animation will play\
    \ when in. It will add the animation to our array of animations. Then it will\
    \ push a new object, which will store which state, and the index of where the\
    \ animation was added to the array (whatever the length of the array is, -1 since\
    \ the index is 1 less than the length). We also add a direction, so in the future\
    \ we can play different animations for the different directions player/entity\
    \ is facing.\n\nThe last function to add:\n\n```javascript\nGetAnimIndex(anim_state)\n\
    {\n  let anim_index=-1;\n  for (let i = 0; i < this.state_to_anim.length; i++)\n\
    \    {\n    if(this.state_to_anim[i].state == anim_state)\n      {\n      if(this.state_to_anim[i].dir==this.dir||\
    \ this.state_to_anim[i].dir==undefined)\n        {\n        anim_index= this.state_to_anim[i].anim_index;\
    \    \n        break;\n        }\n      }\n    }\n  return anim_index;\n}\n```\n\
    \nThe `GetAnimIndex` will be passed in a state, then will look through the array\
    \ of states related to animations, find the state we’re looking for, and will\
    \ return the index of that animation, so that we can play the animation for that\
    \ state. We initially have the animation index set to `-1`, since an array starts\
    \ at 0, it can never be -1, so we know we didn’t find an animation for this state\
    \ if it stays -1.\n\nWe’ll also look to see if the direction of the animation\
    \ is the same as the direction of our entity, or if no direction is defined for\
    \ this animation, then we’ll just use it anyways. That way if we later on have\
    \ different animations for different directions, it will grab the right animation\
    \ (such as an animation for walking right instead of down). But for now it can\
    \ also be undefined, so if we don’t have animations for multiple directions, it\
    \ can still use it.\n\nWe’ll finally create a new class after this one:\n\n```javascript\n\
    class Player extends Entity\n{\n  Draw(ctx, delta_ms)\n  {\n    super.Draw(ctx,\
    \ delta_ms);\n  \n}\n```\n\nThis `player` class extends the `Entity` class, but\
    \ only has a `Draw` function in it, which just calls the `super`/`Entity` class’s\
    \ draw function. Right now it doesn’t really do much, but we’ll add more later\
    \ to differentiate a player from a different type of entity.\n\n## Creating an\
    \ animation class\n\nSo, let’s create a class to load sprite sheets, figure out\
    \ where each frame is for animation, and be able to display it as an animation\
    \ on screen.\n\nWe’ll want to pass in the image, how wide and tall a frame will\
    \ be, which column (x direction) and row (y direction) the animation starts in,\
    \ and how many frames the animation is. Using this, we can find where in the sprite\
    \ atlas our animation is, and be able to split out where each frame for the animation\
    \ is.\n\nNext, we’ll also want to pass over information so that it can be drawn,\
    \ such as the width we want it drawn on, in case the sprite sheet sprites are\
    \ a different size than what we want drawn in our game. Additionally, we also\
    \ want to pass how long to wait to change to the next frame, which will control\
    \ the speed the animation plays at.\n\nCreate a new class at the bottom of your\
    \ classes:\n\n```javascript\nclass FlipBookAnimation\n\n{\n```\n"
