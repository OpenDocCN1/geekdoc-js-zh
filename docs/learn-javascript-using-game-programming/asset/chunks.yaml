    \n![](Images/image00494.jpeg)![](Images/image00495.jpeg)![](Images/image00496.jpeg)![](Images/image00497.jpeg)\n\
    \nAt this point I realized I would also need to make images/ frames for the walking\
    \ animation, similar to the attack animation, so I repeated the above. I created\
    \ a new layer above the first walking frame, drew in the tool, made sure it looked\
    \ like it fit his hands, then repeated for the second walking animation.\n\n##\
    \ Making the other angles\n\nI then copied the idle frame, and started drawing\
    \ in the face, and changing around the pants, to make it look like it was a back\
    \ view. I copied the other frames (both idles, walking, and harvesting), flipped\
    \ them horizontally (since he’s now walking/ harvesting away from the camera),\
    \ and started drawing in his body + face to look like it was the back of the character\
    \ for all frames.\n\nI then had to do the same, but make a side view (supposed\
    \ to be a side/ top view, but I need to practice perspective more to get it looking\
    \ better in the future). I moved one eye over to one side, filled in the rest\
    \ of the face, rotated the hair, and drew in places to look like it was more front\
    \ facing. I had to draw the body differently, and move the feet around to look\
    \ like they were side by side, and kept every body part on a different layer,\
    \ to allow me to rotate them for each animation, and fill in the parts that looked\
    \ wrong manually.\n\nFinally I had a front, back, and side view finished. We can\
    \ flip the side view to work for the left or right side, just like we did for\
    \ previous sprites.\n\n## Saving out the images\n\nI then went through each image,\
    \ and saved them each out with transparency, so I had a total of 18 images/frames\
    \ animations (2 frames x 3 directions x 3 animations =18).\n[/content] (Wait,\
