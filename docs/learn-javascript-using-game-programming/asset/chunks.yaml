    \nSo, we’ll create a “Camera” class, knowing we’ll want to position it with x\
    \ and y:\n\nclass  Camera\n\n{\n\n //camera will be moved using its x and y position,\
    \ to show where it is in the world\n\n constructor(x,y)\n\n    {\n\n this.x=x;\n\
    \n this.y=y;\n\n    }\n\n}//end of class Camera\n\nNext, we’ll actually want the\
    \ camera to be the thing that draws out the world and the character (so it can\
    \ move the world around our character when our character moves). Take all the\
    \ drawing code from update game and move it to our “Camera” class under a new\
    \ function “Draw\n\nclass  Camera\n\n{\n\n //camera will be moved using its x\
    \ and y position, to show where it is in the world\n\n constructor(x,y)\n\n   \
    \ {\n\n if(x==undefined)\n\n        {\n\n x=0;\n\n y=0;\n\n        }\n\n this.x=x;\n\
    \n this.y=y;\n\n    }\n\n //camera will draw out everything based on its own positon\n\
    \n Draw(ctx, delta_ms)\n\n    {\n\n for (let  i=0; i < tiles.length; i++)\n\n\
            {\n\n tiles[i].Draw(ctx);\n\n        }\n\n if(sprites!=undefined)\n\n\
            {\n\n for (let  i = 0; i < sprites.length; i++)\n\n            {\n\n const\
    \  sprite = sprites[i];\n\n //draw a debug box in red for each sprite at its x\
    \ and y, and width and height  \n\n debug_boxes.DrawDebugBox(ctx, sprite.x, sprite.y,\
    \ sprite.width, sprite.height, 2, \"#FF0000\");\n\n sprite.Draw(ctx, delta_ms);\n\
    \n            }\n\n        }\n\n    }\n\n}//end of class Camera\n\nNow we’ll actually\
