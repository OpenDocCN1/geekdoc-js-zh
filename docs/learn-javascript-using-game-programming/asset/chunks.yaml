    \n# 8. Creating the world - background tiles\n\n## Choosing a game tile size\n\
    \nHow big should we make the tile? With backgrounds, to save room, as well as\
    \ be able to generate different maps on the fly, we usually use smaller images,\
    \ and tile, or repeat the tile across the screen many times to generate a repeating\
    \ background. If you make them too small, you'll see the repeating pattern relatively\
    \ easily. But if you make them too big, it takes more memory to store 1 big image,\
    \ when you could store many smaller tiles instead. Additionally, when players\
    \ modify a tile, the smaller the tile, the more the number of things they can\
    \ interact or change on screen at once.\n\nLooking into what the most common resolutions\
    \ are:\n\n[https://gs.statcounter.com/screen-resolution-stats](https://gs.statcounter.com/screen-resolution-stats)\n\
    \nThe second most common resolution as of right now is: 1366x768 (1366 wide, 768\
    \ tall on widescreen), which is slightly smaller than the 1st most common resolution,\
    \ and bigger than the 3rd most common. So, we'll design based on that size.\n\n\
    Graphics cards can display textures/ images that are in multiples of 2's much\
    \ easier than random size, so it's usually a good idea to try to have things as\
    \ a multiple of 2 when you can, for performance (but not absolutely required these\
    \ days). Multiples of 2's are: 2x2= 4, 2x2x2= 8, 2x2x2x2 = 16, 32, 64, 128, 256,\
    \ 512, 1024, 2048, 4096, etc.\n\nIf we want to use 64x64 pixel tiles, that would\
    \ let us have 1366/64 = 21 tiles wide, and 768/64 = 12 tiles tall.\n\nThat sounds\
    \ reasonable for what a player would be able to see on the screen at a time, so\
    \ we'll use that. We could use any value, but it's good to setup restrictions\
    \ early on, so you have an area to design into, but can always change it before\
    \ you do too much work if you realize it could be better, for some reason.\n\n\
    ## Using a canvas to create textures\n\nThe canvas tag can be used for drawing\
    \ directly to the screen, like we saw. But we can also create textures to it temporarily,\
    \ and save them, to use again later.\n\nWe're going to create a “TileCreator”\
    \ class, which will create its own canvas, which is the tile width and height,\
    \ and create tiles on it, saving them to use in the main game.\n\nCreate the “TileImageCreator”\
    \ class after the \"Friend\" class:\n\nclass TileImageCreator\n\n{\n\n    constructor()\n\
    \n    {\n\n        //width, height, and image to store tiles\n\n        this.width_tile= 64;\n\
    \n        this.height_tile= 64;\n\n        this.dirt_tile= new Image();\n\n        //canvas to create the tile images on\n\
    \n        let tile_canvas = document.createElement('canvas');\n\n        tile_canvas.width = this.width_tile;\n\
    \n        tile_canvas.height = this.height_tile;\n\n        let tile_ctx = tile_canvas.getContext('2d');\n\
    \n        this.CreateDirtTileImage(tile_canvas, tile_ctx);\n\n    }\n\n    CreateDirtTileImage(tile_canvas, tile_ctx)\n\
    \n    {\n\n        //define colors we're going to be drawing with\n\n        let medium_brown = \"\
    rgb(99, 65, 5)\"\n\n        let dark_brown = \"rgb(61, 40, 2)\"\n\n        let light_brown = \"\
    rgb(125, 75, 9)\"\n\n        //draw the medium brown color over the entire image\n\
    \n        tile_ctx.fillStyle = medium_brown;\n\n        tile_ctx.fillRect(0, 0, this.width_tile, this.height_tile);\n\
    \n        //draw dark brown spots\n\n        tile_ctx.fillStyle = dark_brown;\n\
    \n        tile_ctx.fillRect(0, 10, this.width_tile*.33, this.height_tile*.25);\n\
    \n        tile_ctx.fillRect(40, 40, this.width_tile*.33, this.height_tile*.25);\n\
    \n        tile_ctx.fillRect(25, 0, this.width_tile*.33, this.height_tile*.25);\n\
    \n        //draw the light brown spots\n\n        tile_ctx.fillStyle = light_brown;\n\
    \n        tile_ctx.fillRect(30, 50, this.width_tile*.1, this.height_tile*.1);          \n\
    \n        tile_ctx.fillRect(60, 10, this.width_tile*.1, this.height_tile*.1);\n\
    \n        tile_ctx.fillRect(0, 30, this.width_tile*.1, this.height_tile*.1);\n\
    \n        //copy the drawing from the tile canvas to the dirt tile image\n\n        this.dirt_tile.src = tile_canvas.toDataURL(\"\
    image/png\");\n\n    }\n\n} //end of TileImageCreator class\n\nIn the constructor,\
    \ we'll first define variables we want for the entire \"TileImageCreator\" class,\
    \ the width and height of all tiles, then we'll create an image called \"dirt_tile\"\
    \ to permanently store the drawing we do on the tile canvas.\n\nWe'll also create\
    \ a canvas just for creating the tiles, with the width and height of the tile\
    \ images. We'll then create the dirt tile image using \"CreateDirtTileImage\"\
    .\n\nIn this function, we're just drawing like we did for our character. We define\
    \ all the colors, set the canvas context to the color we want to draw with, and\
    \ then draw rectangles using the context. I just played around with the x, y,\
    \ width and height of the rectangles to get something that looked roughly like\
    \ a dirt tile.\n\nFinally, we save it in the \"dirt_tile\" Image as the src/ source\
    \ of the image.\n\nNow to actually see the image, we need to draw it to the screen.\n\
    \nFirst, we’ll initialize the “TileImageCreator”, by adding before we create our\
    \ friend “Timmy”:\n\nlet tile_creator = new TileImageCreator();"
