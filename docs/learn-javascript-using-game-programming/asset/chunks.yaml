  trans: "\n[content]\n现在让我们在屏幕上绘制瓦块。在 `UpdateGame` 函数中，在 `ClearCanvas` 下方将绘制瓦块的代码替换为：\n\
    \n```javascript\nctx.drawImage(tile_creator.dirt_tile, tiles[0].x, tiles[0].y);\n\
    ctx.drawImage(tile_creator.dirt_tile, tiles[1].x, tiles[1].y);\nctx.drawImage(tile_creator.dirt_tile,\
    \ tiles[2].x, tiles[2].y);\nctx.drawImage(tile_creator.dirt_tile, tiles[3].x,\
    \ tiles[3].y);\nctx.drawImage(tile_creator.dirt_tile, tiles[4].x, tiles[4].y);\n\
    ```\n\n这只是画出了我们的 5 个瓦块，但使用了我们创建的 `tiles` 数组对象，访问了我们给每个瓦块提供的 `x` 和 `y` 位置。如果你现在运行它，你会看到我们的\
    \ 5 个瓦块以对角线模式画出来。\n\n但到为止，使用数组并没有真正为我们节省时间，因为我们只打印了 5 个瓦块。所以，让我们根据 DRY（不要重复自己）原则开始优化。\n\
    \n## 用于遍历数组的循环，并限制重复性\n\n当你必须做这种重复性工作时，你通常可以使用“循环”来替换它，通过循环从头到尾一个接一个地遍历每一个项。\n\
    \n基础循环被称为 `while` 循环——它会不断地执行同一段代码，直到满足 `if` 条件为止。所以，在程序的底部，在一个临时区域，我们将打印从 1 到\
    \ 5 的计数，展示我们目前知道是如何做到的：\n\n```javascript\nconsole.log(\"counting number: \"+0);\n\
    console.log(\"counting number: \"+1);\nconsole.log(\"counting number: \"+2);\n\
    console.log(\"counting number: \"+3);\nconsole.log(\"counting number: \"+4);\n\
    ```\n\n很很重复的，对吧？\n\n好了，让我们把它替换为 `while` 循环：\n\n```javascript\nlet count=0;\nwhile(count\
    \ < 5)\n{\n    console.log(\"counting number: \"+count);\n    count++;\n}\n```\n\
    \n`while` 循环检查某个条件是否为真（就像 `if` 语句一样），并且会不断运行同一个循环，直到它所检查的内容变为假为止。\n\n在这种情况下，我们在\
    \ `while` 循环之外创建了变量 `count`，将其设置为 0，然后检查它是否小于 5，它确实小于（但如果它是 5，它将永远不会进入循环）。\n\n\
    接下来，在循环内部，我们像以前一样记录数字，但我们还增加了它，或者说对 `count` “加 1”。\n\n所以，第一次进入循环时，`count` 是 0，打印它，并给它加\
    \ 1，使 `count` 现在变为“1”。然后它又回到顶部，检查 1 是否小于 5（它是小于），并再次进入循环。它会一直这样做，每循环一次就将 `count`\
    \ 改变为 2, 3, 4, 5。当它遇到 5 时，`while` 语句意识到它不再小于 5，于是退出循环/继续执行程序（执行循环下方的任何操作）。\n\n\
    相当不错了！但当你有有**大量**事情要处理时，这就会变得有用得多。例如，如果我们想数到 100，我们所做的只是改变循环退出的条件（如果 `count` 变为\
    \ 101 则退出，这样它在循环中只运行到 100）：\n\n```javascript\nlet count=0;\nwhile(count < 101)\n\
    {\n    console.log(\"counting number: \"+count);\n    count++;\n}\n```\n\n现在它将数到\
    \ 100，但只需要几行代码！\n\n我们稍后可以对瓦块做类似的事情。但首先，我想向你们展示另一种更常用的循环类型（但功能和上面一样，且行数更少）。“for\
    \ 循环”！\n\n所以，用 `for` 循环替换上面的内容：\n\n```javascript\nfor (let count=0; count < 101;\
    \ count++)\n{\n    console.log(\"counting number: \"+count);\n}\n```\n\n它的作用和上面一样，但占用的行数更少。\n\
    \n在 `for` 循环中，第一部分是声明变量（通常是你的计数器，也称为“索引”）。在这里我们只声明一个变量 `count` 并将其设置为 0。\n\n接下来，我们有一个分号来执行下部分，这实际上是上面\
    \ `while` 语句中的内容——它只是检查某个条件是否为真，如果是，就再次进入循环。\n\n接着另一个分号，我们执行循环结束时发生的任何操作——通常是迭代/将计数/索引加\
    \ 1。\n\n所以，到目前为止，你只需要只需要知道 `for` 循环从某处开始，检查它是否仍在有效范围内，并增加计数/索引以继续遍历循环，直到中间区域变为假，然后它退出循环。\n\
    \n为了一致性，大多数人在 `for` 循环中使用“index”作为变量名，例如：\n\n```javascript\nfor (let index=0;\
    \ index < 101; index++)\n{\n    console.log(\"counting number: \"+index);\n}\n\
    ```\n\n为了节省时间，你可以将 `index` 缩短为 `i`：\n\n```javascript\nfor (let i=0; i < 101; i++)\n\
    {\n    console.log(\"counting number: \"+i);\n}\n```\n\n稍后我们也可以对瓦块做类似的事情。但首先，我想向你们展示另一种更常用的循环类型（但功能和上面一样，且行数更少）。“for\
    \ 循环”！\n\n所以，用 `for` 循环替换上面的内容：\n\n```javascript\nfor (let count=0; count < 101;\
    \ count++)\n{\n    console.log(\"counting number: \"+count);\n}\n```\n[/content]\n\
