    # 6. Moving things around on screen (sprites)


    Let''s first start by going back down to just one friend, say Timmy, and removing
    all the others (I’m also going to remove the paragraph tag in the html for now,
    so it won’t be in screenshots):


    let timmy = new Friend("Timmy Smith", 16, true, "rgb(0,0,255)", "rgb(209, 181, 140)", "rgb(125, 60, 34)", 20, 20);


    Now let''s move Timmy to where Megan was on the bottom right:


    timmy.x_pos = 260;


    timmy.y_pos = 120;


    You''ll see that Timmy doesn''t actually move to where we placed him. That''s
    because in the constructor, we position him first, then we draw him. So, all we
    have to do is redraw him, right? Luckily we put all friends drawing actions into
    one convenient function "DrawFriend()", so let’s call that now for Timmy:


    timmy.DrawFriend();


    Now if you look, you''ll see 2 Timmy''s, one where he was originally, and one
    in the new position, but we only have one Timmy, so what happened?


    ![](Images/image00474.jpeg)


    ## How canvas drawing works


    You have to think of the canvas like a piece of paper. If you draw a square in
    one corner, then draw in the other- you''ll have 2 squares, even if you draw the
    same square in both spots. Even though we moved the "object" that is Timmy, we
    actually drew him 2 times, but we actually want to erase the first drawing, before
    we draw the second one.


    So, we''ll create a function to clear the canvas before we draw Timmy the second
    time.


    ### Canvas Clear


    Before drawing Timmy add:


    let my_canvas = document.querySelector("canvas");


    let draw_context = my_canvas.getContext("2d");


    let ctx = draw_context;


    let background_color = "rgba(255,255,255, 1)";


    ctx.fillStyle = background_color;


    ctx.fillRect(0, 0, my_canvas.width, my_canvas.height);


    timmy.DrawFriend();


    Now if you try it, you''ll see the old Timmy was erased before the new Timmy was
    drawn. If we want to keep moving Timmy, we''ll want to move the clearing code
    into its own function, so we can call it multiple times easily. So, create a new
    function below our Friend class:


    function ClearCanvas(ctx, background_color)


    {


        ctx.fillStyle = background_color;


        ctx.fillRect(0, 0, my_canvas.width, my_canvas.height);


    }


    Since the function is outside of a class, in JavaScript we have to say "function"
    before the function name. We''re also going to pass the draw context to the function,
    so we don''t have to get the canvas and context inside the function. Additionally,
    we''re going to pass over a background color, so we can change it to whatever
    background we want.


    So now we''ll change the previous code to:


    let my_canvas = document.querySelector("canvas");


    let draw_context = my_canvas.getContext("2d");


    let ctx = draw_context;


    ClearCanvas(ctx, "rgba(0,0,255,255)");


    timmy.DrawFriend();


    When we call the "ClearCanvas" function, we''re passing over the canvas drawing
    context, and a string (in quotes) for an rgba value, which stands for "red, green,
    blue, alpha". Alpha is how transparent or see through something is. 0 is completely
    see through/ we can''t see it, 255 is completely opaque, or solid/ not see through
    at all, and any value in between is partially see through (128 being half way
    between, so 50% see through).


    So, we passed over 0 red, 0 green, 255 or max blue, and 255/max for alpha/ setting
    it to not see through at all.


    We could have passed over "rgb(0,0,255)", and it would have done the same thing
    (automatically filling in 255 for alpha), but I wanted to show that we could use
    partially transparent colors.


    If you run this, you’ll see that Timmy did move, but the page loads up so fast,
    we never see the original Timmy before he moves.


    So, we''ll want to make it so he moves slowly, over time to the right, instead
    of all at once. In the next section, we''ll learn how to slowly move him, which
    will make it look like he''s animating across the screen.


    ## How Animation/ moving pictures works


    What we want to do is move Timmy a little bit, but moving all the time.


    The way computers and TV''s make things move is that they show still images- but
    very, very fast, so they look like they are moving. Typically, the screen or TV
    will update the image on the screen 30-60 times in one second. These still images
    are called "frames", and how fast they change is called "frames per second", or
    fps.


    When things look slow, or stuttering, that is when things are being displayed
    at low frames per second. The smoother they look, the higher the frames per second,
    but the human eye can only see so many frames per second, before the images look
    like they are moving smoothly. For movies and TV, they are only displayed at 24fps,
    but for games you typically want at least 30fps, and 60 or more can look slightly
    smoother.


    So, what we''ll do is try to draw over and over again, as fast as our device will
    let us


    ## Updating the drawing fast enough to make an animation'
