  trans: "\n然后，我们检查左侧以确保它没有低于 0/ 关卡的左侧，但如果它不是，我们将检查右侧是否大于关卡的右侧。如果是，我们将相机的 `x` 重新设为屏幕的右边缘，同时减去我们相机/窗口的宽度，这样我们相机的右侧就能与关卡的右边缘对齐。\n\
    \n然后我们对屏幕底部进行同样的操作，确保我们的相机/窗口底部永远不会低于关卡的底部。\n\n就是这样了！如果你现在玩游戏，你会发现无论你移动到哪里，都看不到背景/我们关卡之外的内容。\n\
    \n![](img/image00487.jpeg)\n\n现在，我们有了一个可以控制、在世界中移动且不会移动到世界之外的玩家。我们可以通过传入想要使用的屏幕宽度和高度来轻松地修改关卡的大小，如果需要，我们可以创建一个超级巨大的关卡。但现在，它有点无聊——一切都是完全随机生成的，但我们希望有一个地方放房子、NPC、敌人以及一个农场区域。所以，让我们修改创建世界的方式，这样我们实际上能够创建一个静态关卡，但仍然为每个新游戏保留一些随机性。\n\
    \n### GitHub 章节示例：\n\n[`doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/10_Camera.html`](https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/10_Camera.html)\n\
    \n# 11. 创建更复杂的图形\n\n我们已经到了以后需要能够开始破碎石头、割草、砍倒树木以及攻击敌人的程度了。所以，我们将创建允许我们显示以下内容的图形：\n\
    \n*   我们将创建我们自己的独特角色，这将允许我们添加更多动画类型\n    *   一个短发版本，一个长发版本\n    *   与我们的瓦块大小相同（`64px\
    \ x 64px`）\n*   攻击/收获动画\n    *   攻击将使用与收获相同的动画\n    *   需要添加的工具包括：\n        *\
    \   `Hammer`（锤子）碎石\n        *   `Axe`（斧头）砍木头\n        *   `Scythe`（镰刀）割草\n   \
    \     *   `Hoe`（锄头）耕地\n        *   `Sword`（剑）攻击敌人\n    *   为植物浇水的水的动画\n    * \
    \  玩家从植物中恢复血量的食用动画\n*   基于玩家的敌人图形\n*   基于玩家的 NPC 图形\n\n创作艺术品，即使是像素画也需要大量的工作和时间。我为这本书创建了一个角色的精灵图（sprite\
    \ sheet）。我希望他看起来像其他其他流行的 2D RPG 类游戏中的角色——《宝可梦》和《牧场物》。\n\n我制作角色的方法是创建一个 ArtClash\
    \ 或 Photoshop（或其他艺术程序）新项目，尺寸与我们的瓦块相同（`64x64`），画出大致的头部形状、身体形状等。我在 Google 图片上通过搜索“pokemon\
    \ sprite sheet”和“harvest moon sprite sheet”来获取精灵图，并找到了一些可以参考的素材。\n\n## 待机动画\n\n\
    我制作了第一幅处于待机/默认位置的角色画，并修改它使其多了一个待机帧（通过将他的头部和肩膀向上移动一个像素——在这里很难看，但在游戏中动画化后更容易看）。\n\
    \n![](img/image00488.jpeg)![](img/image00489.jpeg)\n\n## 行走动画\n\n然后我使用精灵图作为参考，创建了\
    \ 2 帧行走动画，并在 Google 图片上查找了更多关于“行走循环”的参考。我主要更改了他的手臂位置，使其看起来像在两个帧之间来回摆动，并移动了他的腿，使其看起来像是在向后移动。\n\
    \n![](img/image00490.jpeg)![](img/image00491.jpeg)\n\n通常，如果你想让你的动画看起来更好，你会花时间查找每种动画循环的基础“关键姿势”（key\
    \ poses）是什么，从这些开始，然后决定是否想在最重要的关键姿势之间绘制更多帧，以获得更流畅的动画。\n\n我希望他也能能挥动工具/武器，所以我创建了一个新图层，并创建了一个看起来基础的镰刀，他在待机时握在手里。我知道我想将工具动画层放在玩家动画之上，因此我删除了工具图形上玩家应该显示的任何地方（例如通过移除工具那里的像素来显示玩家的手“盖在”工具上，看起来就像玩家的手在工具上方）。\n\
    \n然后我复制了它，并稍微向上移动作为第二个待机动画（下方的间隙是玩家的手透过工具显示的地方，从而产生玩家的手在工具之上的幻觉，尽管工具将画在玩家上面）。\n\
    \n![](img/image00492.jpeg)![](img/image00493.jpeg)\n\n## 收获/攻击动画\n\n我还希望玩家能够收获东西，所以我再次复制了待机帧，并开始更改它使其看起来像玩家正在收获。\n\
    \n重要的帧是玩家向后拉动工具，然后向前砍砍。\n\n重要的帧是玩家向后拉动工具，然后向前砍砍。\n\n重要的帧是玩家向后拉动工具，然后向前砍砍。\n\n\
    重要的帧是玩家向后拉动工具，然后向前砍砍。\n\n重要的帧是玩家向后拉动工具，然后向前砍砍。\n\n重要的帧是玩家向后拉动工具，然后向前砍砍。\n\n重要的帧是玩家向后拉动工具，然后向前砍砍。\n\
    \n重要的帧是玩家向后拉动工具，然后向前砍砍。\n\n重要的帧是玩家向后拉动工具，然后向前砍砍。\n\n重要的帧是玩家向后拉动工具，然后向前砍砍。\n\n\
    重要的帧是玩家向后拉动工具，然后向前砍砍。\n\n重要的帧是玩家向后拉动工具，然后向前砍砍。\n\n重要的帧是玩家向后拉动工具，然后向前砍砍。\n\n重要的帧是玩家向后拉动工具，然后向前砍砍。\n\
    \n（自我修正：输入文本在我的内心想法中有些重复，我将遵循提供文本的实际流程）。\n\n重要的帧是玩家向后拉动工具，然后向前砍砍。\n\n重要的帧是玩家向后拉动工具，然后向前砍砍。\n\
    \n![](img/image00494.jpeg)![](img/image00495.jpeg)![](img/image00496.jpeg)![](img/image00497.jpeg)\n\
    \n在此时，我意识到还需要为行走动画制作图像/帧，类似于攻击动画，所以我重复了上述操作。我在第一帧行走帧上方创建了一个新图层，画了工具，确保它看起来符合他的手部，然后为第二个行走动画重复了此操作。\n\
    \n## 创建其他角度\n\n然后我复制了待机帧，开始画脸部并更改裤子，使其看起来像是背视图。我复制了其他帧（两个待机、行走和收获），将它们水平翻转（因为他现在正在远离相机行走/收获），并开始画他的身体+脸部，使所有帧看起来都是角色的背面。\n\
    \n然后我必须做同样的事情，但要做一个侧视图（应该是侧视图/俯视图，但我需要更多练习透视法，以便以后看起来更好）。我将一只眼睛移动到一侧，填充了脸的其余部分，旋转了头发，并画了一些地方看起来更面向正面。我必须以不同的方式画身体，移动脚使其看起来是并排的，并将每个身体部分放在不同的图层上，以便我为每个动画进行旋转，并手动填充那些看起来不对的部分。\n\
    \n最后，我完成了正面、背面和侧视图。我们可以翻转侧视图适用于左侧或右侧，就像我们之前对的那样。\n\n## 保存图像\n\n然后我处理了每个图像，并以透明方式保存了它们，所以我总共有\
    \ 18 图像/帧（2 帧 x 3 个方向 x 3 种动画 = 18）。\n"
- fmt: "We could just load the images up in our game now how they are, 1 by 1, but\
    \ since we already know about sprite sheets, and we know they are faster to render\
    \ (though we’re talking 100s of images on screen at a time to notice a difference,\
    \ depending on the device), we’ll change our frames into a sprite sheet.\n\n##\
    \ Creating a sprite sheet\n\nThere are a lot of different tools out there to turn\
    \ your images into a sprite sheet, but one I decided to use is “texture packer\
    \ pro”. It’s free for the basic version, which is all we need. Download, install,\
    \ and run it, and just use the free version. Drag your images into the program,\
    \ and it will generate a sprite sheet preview for you, but we have to change some\
    \ options.\n\nUnder `settings-> layout` on the right hand side, change “size constraints”\
    \ to `POT` (power of 2), which will force our sprite sheet to be a power of 2,\
    \ which is faster for a video card to render to the screen. Next, towards the\
    \ bottom, uncheck “allow rotation”.\n\nLastly, there is a button at the bottom\
    \ middle to disable pro features, which you want to do, or it will put an ugly\
    \ red color over the transparent parts of your images (and will warn you when\
    \ you save out). Go to `file->publish sprite sheet` (or `ctrl+p`), and it will\
    \ ask you where you want to save your sprite sheet. Save it into your project\
    \ under `assets->images->`my_player.png`.\n\nI then decided to modify the colors\
    \ to make 2 other entity types- an enemy and an NPC. I used a function in photoshop:\
    \ `Image->Adjustments->replace color`, and fooled around with replacing the hair,\
    \ skin, shirt and overalls color, to have 3 distinct color palettes.\n\n![](Images/image00498.jpeg)\
    \ ![](Images/image00499.jpeg) ![](Images/image00500.jpeg)\n\n## Using your sprite\
    \ sheet in the game\n\nNow we actually need to load our sprite sheet into our\
    \ game, and use it for different animations.\n\nWe can just update what we already\
    \ have, and load our sprite sheet in instead of the previous one we were using.\n\
    \nSo, change the `AllAssetsLoaded` function to:\n\n```javascript\nfunction AllAssetsLoaded()\n\
    {\n  CreateTileMap();\n  my_player = new Player(0,0,Tile.width, Tile.height);\n\
    \  let my_player_img = asset_loader.GetImage(\"my_player\").image;\n  let scale_my_player\
    \ = my_player.height / 64;\n  let my_player_idle_D = new FlipBookAnimation(my_player_img,\
    \ 64, 64, 3,1, 2, scale_my_player, 400);\n  let my_player_walk_D = new FlipBookAnimation(my_player_img,\
    \ 64, 64, 1,2, 2, scale_my_player, 150);\n  let my_player_harvest_D = new FlipBookAnimation(my_player_img,\
    \ 64, 64, 1,1, 2, scale_my_player, 400);\n  let my_player_idle_U = new FlipBookAnimation(my_player_img,\
    \ 64, 64, 3,4, 2, scale_my_player, 400);\n  let my_player_walk_U = new FlipBookAnimation(my_player_img,\
    \ 64, 64, 1,5, 2, scale_my_player, 150);\n  let my_player_harvest_U = new FlipBookAnimation(my_player_img,\
    \ 64, 64, 1,4, 2, scale_my_player, 400);\n  let my_player_idle_R = new FlipBookAnimation(my_player_img,\
    \ 64, 64, 1,3, 2, scale_my_player, 400);\n  let my_player_walk_R = new FlipBookAnimation(my_player_img,\
    \ 64, 64, 3,3, 2, scale_my_player, 150);\n  let my_player_harvest_R = new FlipBookAnimation(my_player_img,\
    \ 64, 64, 3,2, 2, scale_my_player, 400);\n\n  my_player.AddAnimation(my_player_idle_D,\
    \ Entity.STATE.IDLE, Entity.DIRECTION.DOWN);\n  my_player.AddAnimation(my_player_walk_D,\
    \ Entity.STATE.WALKING, Entity.DIRECTION.DOWN);\n  my_player.AddAnimation(my_player_harvest_D,\
    \ Entity.STATE.ATTACKING, Entity.DIRECTION.DOWN);\n  my_player.AddAnimation(my_player_idle_U,\
    \ Entity.STATE.IDLE, Entity.DIRECTION.UP);\n  my_player.AddAnimation(my_player_walk_U,\
    \ Entity.STATE.WALKING, Entity.DIRECTION.UP);\n  my_player.AddAnimation(my_player_harvest_U,\
    \ Entity.STATE.ATTACKING, Entity.DIRECTION.UP);\n  my_player.AddAnimation(my_player_idle_R,\
    \ Entity.STATE.IDLE, Entity.DIRECTION.RIGHT);\n  my_player.AddAnimation(my_player_walk_R,\
    \ Entity.STATE.WALKING, Entity.DIRECTION.RIGHT);\n  my_player.AddAnimation(my_player_harvest_R,\
    \ Entity.STATE.ATTACKING, Entity.DIRECTION.RIGHT);\n}\n```\n"
