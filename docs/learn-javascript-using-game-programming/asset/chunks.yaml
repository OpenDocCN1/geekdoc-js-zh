  trans: "\n现在你只需要调用/运行这个函数就可以打印出所有的朋友信息，例如：\n\n```javascript\nmy_new_friend.SayHi();\n\
    my_new_friend2.SayHi();\nmy_new_best_friend.SayHi();\n```\n\n现在我们有一个朋友类/模板/蓝图，用它来创建几个朋友对象。它们基于该类/具有相同的变量类型和函数，但每个对象都可以在自己的对象变量中存储不同的信息。它们都是朋友类型的对象，但名称或年龄可以与其他对象不同。\n\
    \n我们还让它们在创建时通过构造函数传递变量值，并添加了一个函数让它们向我们介绍自己。\n\n如果我们现在能以某种方式真正看到我们的朋友，那不是很酷？比如把它们和其他信息（如头发和眼睛颜色）画在屏幕上？我们可以在下一节中做到！\n\
    \n你的最终代码看起来像这样：\n\n```html\n<script>\n    class Friend\n    {\n        constructor(their_name,\
    \ their_age, their_loves_spinach)\n        {\n            this.name = their_name;\n\
    \            this.age = their_age;\n            this.loves_spinach = their_loves_spinach;\n\
    \            console.log(\"A friend was created, with name: \"+this.name+\", age:\
    \ \"+this.age+\", and loves spinach: \"+this.loves_spinach);\n        }\n    \
    \    SayHi()\n        {\n            console.log(\"Hi, my name is \"+this.name+\"\
    , my age is: \"+this.age+\", and do I love spinach? \"+this.loves_spinach+\".\"\
    );\n        }\n    }\n    let my_new_friend = new Friend(\"Steve Gutenberg\",\
    \ 12, false);\n    let my_new_friend2 = new Friend(\"Zhanna Matzaball\", 36, true);\n\
    \    let my_new_best_friend = new Friend(\"Jerriah N\", 1, false);\n    my_new_friend.SayHi();\n\
    \    my_new_friend2.SayHi();\n    my_new_best_friend.SayHi();\n</script>\n```\n\
    \n## 关于函数的进阶主题/值得了解的信息\n\n函数通常只是你想执行的某种操作。例如：`Car.MoveForward()`、`Car.Stop()`、`Player.HitEnemy()`、`TextField.CheckIfEmpty()`、`Data.SubmitToServer()`、`Computer.Restart()`、`Facebook.Open()`。\n\
    \n你可以多次调用它们，如果它们不需要，则不发送任何额外信息；如果它们需要值来执行你想要做的任何操作，则向它们传递信息。例如，如果玩家应该击敌人，你可能想传递要击哪个敌人、玩家造成了多少伤害、你想播放什么种动画（如果是魔法攻击或物理攻击）。\n\
    \n初始结构基于你当时认为合理的任何安排。如果你在类中已经拥有了运行函数所需的所有信息（例如让玩家运行），你不需要传递任何内容。如果你想让玩家以不同的速度运行，你可以发送你希望他运行的速度，并将其作为参数传递。你做得越多，这一切就会变得越合理/越简单（像其他所有事情一样，熟能生巧）。\n\
    \n函数在某些语言中也被称为“方法”（methods）——有时当它们位于类内部时。人们根据编程语言交替使用这些术语。我倾向于使用“函数”（function）这个词，因为它们通常会做一些事情/提供某种功能，但这取决于个人喜好。\n\
    \n### github 上的章节示例：\n\n[`doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/4_Objects.html`](https://doomtoo.github.io/Learn-to-code-games-using-JavaScript-Examples/4_Objects.html)\n\
    \n# 5. 创建视觉效果\n\nHTML 被称为“文本标记语言”，用于用标签包裹内容，标签代表不同的部分。由于标签在内部，`html` `head` `body`\
    \ `p` `image`。\n\n当你更多地使用它时，另一个概念会变得更容易理解，但现在只需要知道它允许你更改 HTML 的颜色、间距大部分视觉效果。\n\
    \nHTML 只用于说明存在的内容（图像、文本、canvas 标签、video 标签等），但 CSS 允许我们以与默认不同的方式进行显示。\n"
- fmt: "\nThe `canvas` tag is different in the way that we can draw inside of it using\
    \ JavaScript, without needing to worry about CSS inside of it.\n\nSo, let’s now\
    \ connect our JavaScript to HTML, by grabbing both the paragraph tag, and the\
    \ canvas tag, and modifying them from JavaScript!\n\n## Modifying HTML from JavaScript\n\
    \nThere are some built-in functions, that are part of JavaScript, that allow us\
    \ to grab an HTML tag from our HTML. If we want to grab our paragraph(`<p>`) tag,\
    \ we can do it by putting into JavaScript (inside the script tag):\n\n```javascript\n\
    document.querySelector(\"p\");\n```\n\nThis will grab the first `<p>` tag from\
    \ our html, but doesn't do anything with it, so we can't see it did anything.\
    \ So, let's `console.log` it out:\n\n```javascript\nconsole.log(document.querySelector(\"\
    p\"));\n```\n\nIf you look at the console, you'll see it shows:\n\n`<p>This is\
    \ some text that I created on a webpage</p>`.\n\nThis is a built-in function,\
    \ but you can think of `document` as the main html tag, and `querySelector` as\
    \ a function built into `document` that lets you grab html tags on your page,\
    \ in a lot of different ways.\n\nBut what if we want to change the text inside\
    \ our paragraph from JavaScript? Well, let's first store the paragraph in a variable,\
    \ so we don't have to type out `document.query....` every time we want to access\
    \ it. So:\n\n```javascript\nlet my_paragraph = document.querySelector(\"p\");\n\
    ```\n\nSo now we have the paragraph HTML element stored in our variable `my_paragraph`,\
    \ so anytime we want to play with it, we now have a variable we can access it\
    \ with.\n\nNow let's change the text INSIDE the p tag- also known as the \"inner\
    \ html\" :\n\n```javascript\nmy_paragraph.innerHTML = \"I changed this text from\
    \ JavaScript!\";\n```\n\nIf you run this, you'll now see that the text is changed\
    \ on your HTML page! Every time the page loads, the JavaScript runs, and replaces\
    \ the text quickly. Later on, we could add a button, or some other kind of input\
    \ to change the text after the page loads, so there would be a delay to see it\
    \ change. But for now, we'll work on drawing something in the canvas tag.\n\n\
    ## Drawing with the canvas tag\n\nSo first you'll want to grab your canvas tag\
    \ again, and assign it to a variable for easy access:\n\n```javascript\nlet my_canvas\
    \ = document.querySelector(\"canvas\");\n```\n\nAdditionally, to actually draw\
    \ on the canvas, you need to ask it for a \"drawing context\", and tell it you\
    \ just want to draw normal 2d drawings for now (and not 3d):\n\n```javascript\n\
    let draw_context = my_canvas.getContext(\"2d\");\n```\n\nIf we want to, we can\
    \ actually create another variable name that is shorter, and use that instead,\
    \ even though it's less clear- it will store the same reference to our canvas\
    \ tag, but an additional name (or alias) we can refer to it with. This is similar\
    \ to calling someone Bill, Billy, Bill-dawg, B-shidigy, Will, Willy, etc. Same\
    \ person, but can call them several different names/ or aliases.\n\n```javascript\n\
    let ctx = draw_context;\n```\n\nNow let's draw something- say a block/rectangle\
    \ for a head.\n\nFirst, we'll need to tell it what color we're using, by calling\
    \ `fillStyle = color`\n\nThen we'll need to tell it we're going to draw a filled\
    \ in rectangle using: `fillRect(left, top, width, height)`:\n\n```javascript\n\
    ctx.fillStyle = \"pink\";\nctx.fillRect(10, 20, 50, 60);\n```\n\nThe `fillRect`\
    \ function requires 4 parameters to be passed to it to draw a rectangle- where\
    \ to put it, and how big to make it.\n\nThe first two are how far away to draw\
    \ it from the top left of the canvas. We supplied `10` to draw it 10 pixels/squares\
    \ away from the left side, and `20` to draw it 20 pixels down from the top.\n\n\
    The next two parameters are the width and height to make the rectangle. We have\
    \ it 50 pixels wide, 60 pixels tall (a head is taller than it is wider, usually).\n\
    \nYou can play with these, make bigger rectangles, position them differently,\
    \ etc.\n\nYou should have something like the following example:\n\n```html\n<script>\n\
    \    let my_paragraph = document.querySelector(\"p\");\n    my_paragraph.innerHTML\
    \ = \"I changed this text from JavaScript!\";\n    let my_canvas = document.querySelector(\"\
    canvas\");\n    let draw_context = my_canvas.getContext(\"2d\");\n    let ctx\
    \ = draw_context;\n    ctx.fillStyle = \"pink\";\n    ctx.fillRect(10, 20, 50,\
    \ 60);\n</script>\n```\n\n![](Images/image00471.jpeg)\n\n### Side Note: Colors\n\
    \nFor the color, we can supply most normal color names, but if we want to supply\
    \ a custom color, say a pinkish brown flesh, if we want to supply a custom color,\
    \ say a pinkish brown flesh, if we want to supply a custom color, say a pinkish\
    \ brown flesh, if we want to supply a custom color, say a pinkish brown flesh,\
