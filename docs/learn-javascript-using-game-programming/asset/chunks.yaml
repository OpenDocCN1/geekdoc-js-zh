    If you run it now, everything should look the same, which means we just put the\
    \ drawing functionality into our camera class. So now we’ll want to be able to\
    \ move the position of our camera, which will cause the screen to move in the\
    \ opposite direction. Lets move our camera over by “-window.innerWidth / 2” (1/2\
    \ a screen width to the left):\n\nlet  camera = new  Camera(-window.innerWidth/2,\
    \ 0);\n\nNothing should change yet, since we haven’t actually used the camera\
    \ x and y values yet. So, we’ll move everything over based on the camera's position,\
    \ in tiles and in entities drawing functions.\n\nSo, in your “class Tile”, update\
    \ your draw function to draw based on the camera's position:\n\nDraw(ctx)\n\n\
    {\n\n ctx.drawImage(this.image, this.x-camera.x, this.y-camera.y);\n\n}\n\nIf\
    \ you run this now, you’ll see your tiles are offset by half the screen width,\
    \ how it should be. But now we have to also offset our sprites. In your sprite\
    \ class, change your draw function to add in the camera position as well:\n\n\
    Draw(ctx, delta_ms)\n\n{\n\n if(this.image!=undefined)\n\n ctx.drawImage(this.image,\
    \ this.x-camera.x, this.y-camera.y);\n\n if(this.animations.length>0)\n\n    {\n\
    \n this.animations[this.curr_anim].Draw(ctx, delta_ms, this.x-camera.x, this.y-camera.y,\
    \ this.flip_x);\n\n    }\n\n}\n\nWhen you run this, you’ll see everything except\
    \ the debug boxes are now moved over. These are being drawn from our “Camera”\
    \ class, so in that function, change the line for drawing the debug boxes to:\n\
    \ndebug_boxes.DrawDebugBox(ctx, sprite.x-camera.x, sprite.y-camera.y, sprite.width,\
    \ sprite.height, 2, \"#FF0000\");\n\nNow you should be able to see all our stuff\
    \ moved over with the camera positioned! Just to make sure the y value is also\
    \ working, change the camera initialization to be offset by half the height in\
    \ the y direction:\n\nlet  camera = new  Camera(-window.innerWidth/2, -window.innerHeight/2);\n\
    \nWhen you run this, you should see the top corner of the world, and all the sprites\
    \ offset by half the width in the x direction, and half the height in the y direction!\n\
    \nWe could at this point change the x and y camera position to move our camera\
    \ around manually with the arrow keys to see it move around, but we instead want\
    \ the camera to center on our Player sprite, and follow him around as he moves.\n\
    \n![](Images/image00486.jpeg)\n\nSo, let’s add a function on the camera to follow\
    \ our player, but make it able to follow any sprite.\n\n## Making the camera follow\
    \ the player\n\nWe want the player to be centered on the screen. The center of\
    \ the screen is the width of our screen, divided in half (which is the midpoint),\
    \ as well as the height divided in half. But since the sprites are drawn from\
    \ their top left corner, they would be drawn with their left side on the centerline.\
    \ To get them centered in the middle, we have to subtract out half the width and\
    \ height of the sprite as well, so it gets moved over to the left half a width,\
    \ and up half a height, so his center is dead center with the center of the screen.\n\
    \nUpdate the camera class in the following way:\n\n//camera will be moved using\
    \ its x and y position, to show where it is in the world\n\nconstructor(x,y)\n\
    \n{\n\n this.x=x;\n\n this.y=y;\n\n //used to center target in the middle of the\
    \ screen\n\n this.target=undefined;\n\n this.half_width_minus_target_half_width=0;\n\
    \n this.half_height_minus_target_half_height=0;\n\n console.log(\"camera x: \"\
    +this.x);\n\n}\n\nFollow(target)\n\n{\n\n this.target=target;\n\n this.half_width_minus_target_half_width\
    \ = window.innerWidth*.5 - target.width*.5;\n\n this.half_height_minus_target_half_height\
    \ = window.innerHeight*.5 - target.height*.5;\n\n}\n\nWe create a “Follow” function\
    \ that will be passed a sprite. We’ll set the things we need to follow that sprite-\
    \ storing a reference to that sprite in the first line of “Follow”. Next we store\
    \ the value in a very long variable name for half the width and height of the\
    \ screen, minus half the width and height of the sprite to get him perfectly centered.\n\
    \nWe’ll additionally want to add an “Update” function, so that when the target\
    \ moves, our camera will also update its position. Add below the Draw function:\n\
    \nUpdate(delta_ms)\n\n{\n\n if(this.target!=undefined)\n\n    {\n\n this.x=this.target.x-this.half_width_minus_target_half_width;\n\
    \n this.y=this.target.y-this.half_height_minus_target_half_height;\n\n    }\n\n\
    }\n\nThis will just take in the delta time/ frame rate, but not do anything with\
    \ it yet. We’ll check to make sure we have a target, and if so, we’ll update our\
    \ x and y to be the same as the targets, which would put our top left corner of\
    \ the screen at the top left corner of the sprite. But we subtract out the half\
    \ screen width/ height, and sprite half width/height, which will get the sprite\
    \ to always be centered on the screen.\n\nNext you actually have to call the “Update”\
    \ function, so we’ll just call it from our “Draw” function, since it’s already\
    \ being called every frame update:\n\nDraw(ctx, delta_ms)\n\n{\n\n this.Update(delta_ms);\n\
    \n    ..."
