    \ function):\n\nlet  sprites = new  Array();\n\nlet  my_player;\n\nlet  an_entity;\n\
    \nlet  debug_boxes = new  DebugBox();\n\nfunction  AllAssetsLoaded()\n\n{\n\n\
    \ CreateTileMap();\n\n my_player = new  Player(0,0,Tile.width, Tile.height);\n\
    \n let  scale_woodcutter = my_player.height / 48;\n\n let  woodcutter_idle = new\
    \  FlipBookAnimation(asset_loader.GetImage(\"woodcutter_idle\").image, 48, 48,\
    \ 1,1, 4, scale_woodcutter, 100);\n\n let  woodcutter_run = new  FlipBookAnimation(asset_loader.GetImage(\"\
    woodcutter_run\").image, 48, 48, 1,1, 6, scale_woodcutter, 100);\n\n let  woodcutter_attack1\
    \ = new  FlipBookAnimation(asset_loader.GetImage(\"woodcutter_attack1\").image,\
    \ 48, 48, 1,1, 6, scale_woodcutter, 100);\n\n woodcutter_idle.CenterSize(my_player.width,\
    \ my_player.height);\n\n woodcutter_run.CenterSize(my_player.width, my_player.height);\n\
    \n woodcutter_attack1.CenterSize(my_player.width, my_player.height);\n\n woodcutter_idle.offset_x_extra=12;\n\
    \n woodcutter_run.offset_x_extra=10;\n\n my_player.AddAnimation(woodcutter_idle,\
    \ Entity.STATE.IDLE);\n\n my_player.AddAnimation(woodcutter_run, Entity.STATE.WALKING);\n\
    \n my_player.AddAnimation(woodcutter_attack1, Entity.STATE.ATTACKING);\n\n my_player.ChangeState(Entity.STATE.ATTACKING);\n\
    \n an_entity = new  Entity(Tile.width*3,Tile.width*2,Tile.width, Tile.height);\n\
    \n let  scale_adventurer = my_player.height / 37;\n\n let  adventurer_idle = new\
    \  FlipBookAnimation(asset_loader.GetImage(\"adventurer\").image, 50, 37, 1,1,\
    \ 4, scale_adventurer, 100);\n\n let  adventurer_run = new  FlipBookAnimation(asset_loader.GetImage(\"\
    adventurer\").image, 50, 37, 2,2, 5, scale_adventurer, 100);\n\n let  adventurer_attack1\
    \ = new  FlipBookAnimation(asset_loader.GetImage(\"adventurer\").image, 50, 37,\
    \ 6,7, 6, scale_adventurer, 100);\n\n adventurer_idle.CenterSize(my_player.width,\
    \ my_player.height);\n\n adventurer_run.CenterSize(my_player.width, my_player.height);\n\
    \n adventurer_attack1.CenterSize(my_player.width, my_player.height);\n\n an_entity.AddAnimation(adventurer_idle,\
    \ Entity.STATE.IDLE);\n\n an_entity.AddAnimation(adventurer_run, Entity.STATE.WALKING);\n\
    \n an_entity.ChangeState(Entity.STATE.WALKING);\n\n sprites.push(my_player);\n\
    \n sprites.push(an_entity);\n\n SetupInput();\n\n}\n\nWe create the array “sprites”\
    \ for all of our sprites to be put into, so that we can go through this array\
    \ in the game, and draw out any sprites we add easily. We also create a variable\
    \ for “my_player”, and “debug_boxes”, so we can use these.\n\nAfter all the assets\
    \ are loaded, we initialize our player, being the size of a tile.\n\nThen we create\
    \ the animations for the woodcutter sprites. We set the scale to scale the woodcutter\
    \ sprites to be the height of our player divided by the height of the woodcutter\
    \ frames (each frame is 48), so that we can scale down the wood cutter to fit\
    \ our player height (the width of the animation can be wider than our player box,\
    \ since attacking animation will go outside of the player box).\n\nNext, we create\
    \ variables for the different types of animation, passing in the width and height\
    \ of each frame, which column (x) and row (y) to start the animation on, the number\
    \ of frames to use for the animation, the scale that we want to draw it on screen,\
    \ and the delay between each frame being changed out.\n\nWe also use “CenterSize”\
    \ to center the animation around the player's width and height (so it will be\
    \ centered/ drawn from the middle, vs from the left side like normal), so animations\
    \ will be all centered on where our player is. Additionally, some animations we\
    \ don’t want centered. For instance, the idle animation is at the left edge of\
    \ the frame, because the attack frame makes the frame size much wider, but we\
    \ want it to be drawn centered. So, we can add extra offset to not have it drawn\
    \ centered, based on its frame size, and give it a little bit of an offset to\
    \ make it look better. \n\nLastly, we just set the player state to attacking,\
    \ to show that we can set the state, which will change the animation.\n\nNext,\
    \ we create an entity, at 3 tile widths over to the right, and 2 tile widths down\
    \ (Tile.width*3,Tile.width*2), we add the animations to their animations array,\
    \ and we change the entity state to walking, just to show how to change the state,\
    \ which then also changes the current animation playing again.\n\nFinally, we\
    \ add both sprites (both Entities and Players are extended from sprites) to our\
    \ sprites array.\n\nNow we’ve done everything, aside from actually rendering out\
    \ the animated sprites. In “UpdateGame”, add at the bottom:\n\nif(sprites!=undefined)\n\
    \n{\n\n for (let  i = 0; i < sprites.length; i++)\n\n    {\n\n const  sprite =\
    \ sprites[i];\n\n //draw a debug box in red for each sprite at its x and y, and\
    \ width and height\n\n debug_boxes.DrawDebugBox(ctx, sprite.x, sprite.y, sprite.width,\
    \ sprite.height, 2, \"#FF0000\");\n\n sprite.Draw(ctx, delta_ms);\n\n    }\n\n\
    }\n\nThis just checks to make sure sprites isn’t undefined (which it is before\
    \ we add our sprites), then goes through however many sprites there are, first\
    \ drawing a debugbox out for where the sprite is, then calling the draw function\
    \ for each.\n\nIf you run this now, you should see 2 different sprites on screen,\
    \ playing out their animations:\n\n![](Images/image00484.jpeg)\n\nBut we can still\
    \ see our friend being rendered behind them. So, let’s change them out with an\
    \ animated character, and have the animated character move around when we click\
    \ on the screen.\n\n## Moving controls from Friend to Player Class\n\nWe’re going\
    \ to heavily modify our “Player” class based on the existing “Friend” class, which\
    \ represents the object the player controls. The player right now is almost identical\
    \ to the entity class, so let’s add functions from the friend class into the player.\n\
    \nFirst, we’ll remove all our references to our friend class. Search for and remove\
    \ the line: “let timmy = new Friend(” at the bottom of the script. Next remove\
    \ these 2 lines in “UpdateGame”:\n\ntimmy.Update(delta_ms);\n\ntimmy.DrawFriend();\
    \ //re-draw Timmy\n\nNext find the function: “MoveMyPlayer”, and change it to\
    \ (by changing “timmy” to “my_player” :\n\nfunction  MoveMyPlayer(x_dest, y_dest)\n\
    \n{\n\n //move my_player to the destination clicked\n\n console.log(\"Moving my\
    \ player to destination: x: \"+x_dest+\", y: \"+y_dest)"
