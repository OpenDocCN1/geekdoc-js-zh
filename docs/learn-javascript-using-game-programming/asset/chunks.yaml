  trans: "\nJavaScript 有一个内置函数，可以调用你提供的任何函数，每当它能够更新屏幕时，这样你就可以绘制下一帧。这就是 `window.requestAnimationFrame(my_update_function(current_time_in_ms))`。\n\
    \n你做的就是调用这个函数，并传递你希望它在可以渲染一帧时调用的函数，它还会自动向你的函数传递一个毫秒级的时间（`ms` - 一秒的 1/1000，所以 1000\
    \ 个这样的毫秒组成一秒）。\n\n你最终会想要使用该时间来计算自上次更新以来经过了多久，这样你就可以以特定的速度在屏幕上移动物体，无论它是运行在 10fps\
    \ 还是 60fps 的系统上。\n\n所以，我们在创建朋友之前会添加代码：\n\n```javascript\nfunction Update(time_ms)\n\
    {\n    console.log(\"Update: \"+time_ms);\n    window.requestAnimationFrame(Update);//\
    \ 必须请求另一个帧，当它再次可用时将再次调用此函数\n}\n\nwindow.requestAnimationFrame(Update); // 请求一帧\n\
    ```\n\n当浏览器允许绘制新帧时，我们的函数 `Update` 将被调用。它还会传递一个毫秒级的时间，一旦它被第二次调用，我们就能找到请求第二个帧花费了多久。但我们还必须在更新函数内部再次调用它，以便它能等待下一帧并再次调用我们的函数。这将不断地调用\
    \ `Update 函数`，只要浏览器可以渲染帧，我们可以用它来更新我们的游戏。\n\n当你运行该代码时，你会看到它在控制台中输出了毫秒级（`ms`）的时间，并随着时间的推移不断增加。\n\
    \n我们现在有了一个基础的更新循环，并且知道每帧的时间。\n\n但我们需要更进一步，看看每帧之间经过了多少时间——这将允许我们根据实际经过的时间在在屏幕上移动物体，从而让对象在低帧率和高帧率下以相同的速度移动。\n\
    \n如果我们每帧让物体移动 10px，而它目前的运行速度是 1fps，那么它在 1 秒内只会移动 10px。但如果它运行在更快的计算机上，帧率达到 60fps，那么它在\
    \ 1 秒内将运行 60 帧/更新，每帧移动 10px，所以是 600px！为了让它在不同设备上移动一致，你需要找到更新之间的时间，也称为时间差或差异（delta\
    \ time）。\n\n所以，将代码更新为：\n\n```javascript\nfunction Update(time_ms)\n{\n    let\
    \ frame_delta_ms = time_ms - last_time_ms; // #2 寻找上一帧（初始为 0）和当前时间之间的增量/差\n  \
    \  let delta_s = frame_delta_ms / 1000; //因为时间是毫秒（1/1000 秒），转换为秒需要除以 1000，例：2000ms/\
    \ 1000 = 2s\n    let fps= 1 / delta_s; //我们可以通过倒数（1 除以它）将秒/帧 (delta_s) 转换为帧/秒——1/\
    \ (秒/帧) = 帧/秒= fps\n    frame_delta_ms = frame_delta_ms.toFixed(2); //将使用 toFixed(2)\
    \ 保留 2 位小数\n    //所以....toFixed 会四舍入一个数字，返回的是字符串而不是数字....所以现在必须把它转回数字...JavaScript...\
    \ 否则会被视为字符串相加-所以不是 5+5 = 10，而是 5+5=55 - 这是两个 5 连在一起，而不是相加\n    frame_delta_ms\
    \ = parseFloat(frame_delta_ms);\n    fps = fps.toFixed(2);\n    console.log(\"\
    Update: delta time: \"+frame_delta_ms+\", fps: \"+fps);\n    last_time_ms=time_ms;\n\
    \    window.requestAnimationFrame(Update);\n}\nlet last_time_ms=0; //1 首先\"创建\
    \ last_time_ms\"，它将存在函数外部，并记录上次更新的时间\nwindow.requestAnimationFrame(Update);\n\
    ```\n\n首先，我们在函数外部（底部）声明一个变量 `last_time_ms`，这样它就会存在于函数之外，并在函数运行后保留其值。接下来，我们调用函数\
    \ `window.requestAnimationFrame`，并传入即将创建的 `Update` 函数。我们创建 `Update` 函数，但假设当 `window.requestAnimationFrame`\
    \ 调用它时会传递某些内容。那是自页面开始开始的 `ms` 时间。我们并不真的需要，但通过在每帧结束时存储它，我们可以获取上次帧运行时间与当前帧时间之间的差，从而得到一个差——即每帧绘制花费了多久。\n\
    \n这个增量时间（delta time)/时间差有点难以理解，所以我们首先通过将毫秒（`1ms =1000s`）除以 1000 将其转换为秒（秒的时间差，是一个很小的小数，如\
    \ 0.016）。现在我们有了 `秒/帧`，但我们想把它颠倒过来变成 `帧/秒` 或 `fps`。`1` 除以任何分数都会将其翻转，所以我们执行 `1/delta_s`。由于\
    \ toFixed 会四舍入入一个数字，返回的是字符串而不是数字....所以现在必须把它转回数字...JavaScript... 否则会被视为字符串相加-所以不是\
    \ 5+5 = 10，而是 5+5=55 - 这是两个 5 连在一起，而不是相加。\n\n这个增量时间/时间差有点难以理解，所以我们首先通过将毫秒（`1ms\
    \ =1000s`）除以 1000 将其转换为秒（秒的时间差，是一个很小的小数，如 0.016）。现在我们有了 `秒/帧`，但我们想把它颠倒过来变成 `帧/秒`\
    \ 或 `fps`。`1` 除以任何分数都会将其翻转，所以我们执行 `1/delta_s`。\n\n这个增量时间（delta time)/时间差有点难以理解，所以我们首先通过将毫秒（`1ms\
    \ =1000s`）除以 1000 将其转换为秒（秒的时间差，是一个很小的小数，如 0.016）。现在我们有了 `秒/帧`，但我们想把它颠倒过来变成 `帧/秒`\
    \ 或 `fps`。`1` 除以任何分数都会将其翻转，所以我们执行 `1/delta_s`。\n\n这个增量时间（delta time)/时间差有点难以理解，所以我们首先通过将毫秒（`1ms\
