  trans: "\n\n这允许我们将任何信息“日志”输出到控制台，这样我们就可以随时看到程序在后台运行了什么（有点就像程序员的“作弊区域”，可以借此查看程序正在执行的操作）。\n\
    \n因此，我们可以在声明变量的地方添加 `console.log` 语句，如下所示：\n\n```javascript\nconsole.log(\"My\
    \ friends are: \");\nconsole.log(friend1_name);\nconsole.log(friend2_name);\n\
    console.log(friend3_name);\n```\n\n这将会输出：\n\nMy friends are:\nTom Smith\nJill\
    \ Jones\nSteve Thomas\n\n为了方便起见，我们实际上可以使用 `'+'` 将单词/字符串组合成一个字符串，这样我们就不需要多个 `console.log`\
    \ 语句了。\n\n例如：\n\n```javascript\nconsole.log(\"One of my friends is: \"+friend1_name);\n\
    ```\n\n将所有的组合在一起，并在每个字符串之间加上带有带引号的逗号和空格：\n\n```javascript\nconsole.log(\"My friends\
    \ are: \" + friend1_name + \", \" + friend2_name + \", \" + friend3_name );\n\
    ```\n\n这将会输出：\n\nMy friends are: Tom Smith, Jill Jones, Steve Thomas\n\n你最终的 `script`\
    \ 标签看起来如下：\n\n```html\n<script>\n    let friend1_name = \"Tom Smith\";\n    let\
    \ friend2_name = \"Jill Jones\";\n    let friend3_name = \"Steve Thomas\";\n \
    \   console.log(\"My friends are: \" + friend1_name + \", \" + friend2_name +\
    \ \", \" + friend3_name );\n</script>\n```\n\n现在我们就可以打印出赋值给变量的名字（例如 `friend1_name`），它将向我们显示存储在该变量中的实际朋友（值）。\n\
    \n### 如何查看控制台\n\n如果你在实时服务器（live server）中运行它，在打开控制台之前你是看不到任何内容的。如果你使用的是 Firefox\
    \ 或 Chrome，可以按下键盘上的“F12”键调出控制台，或者在网页上点击右键，进入“检查”（`ctrl+shift+i`），然后点击“console”。这时你应该能在屏幕右侧的控制台下方看到你的\
    \ `console.log` 语句。\n\n![](img/image00470.jpeg)\n\n## 存储数字\n\n但如果我们想存储关于朋友的其他信息呢？例如他们的年龄？\n\
    \n我们可以用同样的方法，但因为这些数字而不是单词，所以我们不需要给它们加上引号。\n\n```javascript\nlet friend1_age =\
    \ 9;\nlet friend2_age = 18;\nlet friend3_age = 22;\n```\n\n你也可以 `console.log`\
    \ 输出这些内容，如果你想看看值是否存储在变量中。\n\n```javascript\nconsole.log(\"My friends ages are:\
    \ \" + friend1_age + \", \" + friend2_age + \", \" + friend3_age);\n```\n\n##\
    \ 存储真或假（布尔值）\n\n存储他们是否喜欢菠菜呢？喜欢菠菜可以是 true 也可以 false。在编程中，我们把这种可以是“true”或“false”的东西称为“布尔值”（Booleans）。就像灯开关要么开启要么关闭，或者你要么可以舔到自己的肘部，要么不可以。\n\
    \n```javascript\nlet friend1_loves_spinach = true;\nlet friend2_loves_spinach\
    \ = false;\nlet friend3_loves_spinach = false;\n```\n\n你也可以 `console.log` 输出这些内容，如果你想看看值是否存储在变量中。\n\
    \n## 高级主题/进阶知识 - 其他类型的变量\n\n稍后，我们将使用其他类型的变量。大多数编程语言都内置了不同类型的变量，让你能够存储不同类型的“基础”信息。你现在不需要深入了解这些，但如果你好奇的话，下面有更多信息。\n\
    \n内置类型通常包括：\n\n### 用于存储数字：\n\n- `int` - 用于整数（integer）——它用于没有小数的整数字（例如 1, 4, 200,\
    \ 9000）。更高级的是，在某些语言中，你可以定义整数的大小，这样你就不会为了一个巨大的数字而浪费内存空间，只需要存储一个很小的数字。\n\n例如，如果你只是存储某人的年龄，你知道它会在\
    \ 0-120 之间，你可以使用 `int8`，它将允许你存储 -128 到 127 之间的任何数字。或者如果你正在存储以万亿的美国债务（26.7 万亿，或\
    \ 26,700,000,000,000），你需要使用 `int64` 才能存储如此大的数字。\n\n- `float` - 用于浮点数（floating\
    \ point numbers）——带有小数的数字。例如 3.14 或 1.5。在某些语言中，这也被称为 `double` 以获得更高的精度。\n\n- `double`\
    \ - 与 `float` 类似，但在小数点的精度更高。\n\n- `number` - 在像 JavaScript 这样的语言中，同时用于整数和浮点数的单一类型。\n\
    \n### 用于存储文本：\n\n- `char` - 用于字符（characters）——单个字母，如 'A', 'b' 或 '$'。\n\n- `string`\
    \ - 用于字符序列，如单词或句子。\n\n### 用于存储集合：\n\n- `array` - 项目的集合。它可以存储多个相同类型或甚至不同类型的值。\n\
    \n- `list` - 与数组（array）类似，在扩展和收缩方面通常更灵活。\n\n### 用于存储逻辑：\n\n- `bool` 或 `boolean`\
    \ - 用于存储 `true` 或 `false`。\n\n### 用于存储“无”：\n\n- `null` - 这意味着变量存在但尚未分配任何值。\n\n\
    - `undefined` - 这意味着变量已经声明但尚未赋值。\n\n"
- fmt: "\nA class in general is just defining something that will hold information\
    \ for a bunch of similar objects (like a blueprint, or an idea). It's something\
    \ that doesn't do anything on its own, so we'll later have to use it after we\
    \ define it.\n\n## Creating our own type/ class/ template/blueprint\n\nSo, we\
    \ create it like:\n\n```javascript\nclass Friend\n{\n    constructor()\n    {\n\
    \        this.name = \"someones name\";\n        this.age = 0;\n        this.loves_spinach\
    \ = true;\n        console.log(\"A friend was created, with name: \"+this.name+\"\
    , age: \"+this.age+\", and loves spinach: \"+this.loves_spinach);\n    }\n}\n\
    ```\n\nYou use curly braces (such as: `{}`) inside a class or a function (more\
    \ on this later on) to show where the class will begin and end.\n\nThe key word\
    \ `constructor()`, with the parenthesis, is a function that gets run automatically\
    \ whenever a new `Friend` i created from our friend class. It also uses curly\
    \ braces to show the start and end of the function. It also needs normal circular\
    \ parenthesis (`ex= ()`), which means it will be a function that gets run/called,\
    \ and not a variable.\n\nDeclaring variables inside a class, you don't need to\
    \ use the `let` keyword anymore, but do have to use `this.variable_name`, with\
    \ `this` which will refer to any object you create from the class.\n\n## Creating\
    \ an object from our class\n\nSo now if we want to create a new friend variable\
    \ from the class we just defined, which will have the other 3 variables types\
    \ inside of it, we can do:\n\n`let my_friend = new Friend();`\n\nThat's all that's\
    \ needed to create 1 new friend object, which is one friend that has everything\
    \ defined by our `Friend` class/blueprint above!\n\nThis will also automatically\
    \ run the `constructor` which the object is created from the class, which creates\
    \ the `name`, `age`, `loves_spinach` variables inside of a new friend object (based\
    \ off of the friend class template), and will print out the `console.log` right\
    \ before the end of the `constructor` function (which automatically gets called\
    \ whenever we create a new friend). So, if you type that in now, you'll just see\
    \ the `console.log` being outputted.\n\nYour script tag will look like:\n\n```html\n\
    <script>\n    class Friend\n    {\n        constructor()\n        {\n        \
    \    this.name = \"someones name\";\n            this.age = 0;\n            this.loves_spinach\
    \ = true;\n            console.log(\"A friend was created, with name: \"+this.name+\"\
    , age: \"+this.age+\", and loves spinach: \"+this.loves_spinach);\n        }\n\
    \    }\n    let my_friend = new Friend();\n</script>\n```\n\nAnd if run, will\
    \ print out:\nA friend was created, with name: someones name, age: 0, and loves\
    \ spinach: true\n\nIf we want to say change out the name and age, we can do so\
    \ by adding on the next line after creating a new friend:\n\n`my_friend.name=\"\
    Timmy\";`\n`my_friend.age=12;`\n\nTo verify we changed it, we can `console.log`\
    \ it out on the next line:\n\n`console.log(\"My friend name is: \" + my_friend.name\
    \ + \", and his age is: \"+ + my_friend.age);`\n\nJavaScript also lets you print\
    \ out the entire object if you want to see what it looks like:\n\n`console.log(my_friend);`\n\
    \nSo, if we want to make another new friend, do the same thing (which will look\
    \ at the class, create a new object from that class, and give us the new object\
    \ back), by adding on the next line:\n\n`let my_other_friend = new Friend();`\n\
    \nAnd if you print out this one, you can see it's a different object then `my_friend`,\
    \ but they both are based off the `Friend` class, both have the same type of variables\
    \ inside them, but different values stored in their variables (this friend has\
    \ the default name, age, etc we assigned it in the constructor)\n`console.log(my_other_friend);`\n\
    \nTo change the name and age, we'd have to do something like:\n`my_other_friend.name=\"\
    Betty Sue\";`\n`my_other_friend.age=10;`\n\nBut wouldn't it be nice if we could\
    \ assign the name and age the same time we create the friend, instead of having\
    \ to put it on 3 lines, since we'll probably never use the default name/ age?\
    \ Again, there is a way! Your final code should look similar to\n\n```html\n<script>\n\
    \    class Friend\n    {\n        constructor()\n        {\n            this.name\
    \ = \"someones name\";\n            this.age = 0;\n            this.loves_spinach\
    \ = true;\n            console.log(\"A friend was created, with name: \"+this.name+\"\
    , age: \"+this.age+\", and loves spinach: \"+this.loves_spinach);\n        }\n\
    \    }\n    let my_friend = new Friend();\n    my_friend.name=\"Timmy\";\n   \
    \ my_friend.age=12;\n    console.log(\"My friend name is: \" + my_friend.name\
    \ + \", and his age is: \"+ my_friend.age);\n    console.log(my_friend);\n   \
    \ let my_other_friend = new Friend();\n    console.log(my_other_friend);\n   \
    \ my_other_friend.name=\"Betty Sue\";\n    my_other_friend.age=110;\n    console.log(my_other_friend);\n\
    </script>\n```\n\n## Passing in values to the constructor function\n\nWe can actually\
    \ pass what we want those variables to hold to the constructor, and assign it\
    \ there instead of the default values! So, change the class to:\n\n```javascript\n\
    class Friend\n{\n    constructor(their_name, their_age, their_loves_spinach)\n\
    \    {\n        this.name = their_name;\n        this.age = their_age;\n     \
    \   this.loves_spinach = their_loves_spinach;\n        console.log(\"A friend\
    \ was created, with name: \"+this.name+\", age: \"+this.age+\", and loves spinach:\
    \ \"+this.loves_spinach);\n    }\n}\n```\n\nSo, we are going to pass over what\
    \ we want those variables to hold, and instead of just the default values being\
    \ assigned to our friends’ variables, it will assign any value we pass in. So,\
    \ we can now just do:\n\n`let my_new_friend = new Friend(\"Steve\", 12, false);`\n\
    \nWhich will pass \"Steve\" in, and name it with the variable in the first parameter\
    \ (`their_name`), next pass in 12, and assign it to the next variable in the constructor\
    \ (`their_age`), and finally the last thing we pass to it is false, which gets\
    \ passed over and stored in the variable (`their_loves_spinach`).\n\nSide Note:\
    \ The names of the variables in the constructor parameters (ex: `their_name`,\
    \ `their_age`, etc) can be called anything we want, because those variable names\
    \ will only exist inside the constructor. We could call them `var1`, `var2`, or\
    \ `param1`, `param2`, or `name age`, etc. It just depends on what makes the most\
    \ sense to you. But since they are only defined in the parameters (the parenthesis)\
    \ of the constructor, they won't exist outside it.\n\nSo now we can create new\
    \ friends super easy, and it only takes one line to do it!\n\nExample:\n\n`let\
    \ my_new_friend = new Friend(\"Steve\", 12, false);`\n`let my_new_friend2 = new\
    \ Friend(\"Zhanna Matall\", 36, true);`\n`let my_new_best_friend = new Friend(\"\
    Jerriah\", 1, false);`\n\nBut what if we want them to console.log out their information?\
    \ Right now we'd have to do:\n`console.log(\"Hi, my name is: \"+my_friend.name+\"\
    , my age is: \"+my_friend.age+\", and do I love spinach? \"+my_friend.loves_spinach+\"\
    .\");` For every friend! If we have 5 of them, it's a lot of text to type, even\
    \ more.\n\n## Functions / Methods- doing something\n\nLuckily there is! We can\
    \ put a custom function in our class, somewhat like the constructor, and we can\
    \ just have it run whenever we want to. So, change our friend class to be:\n\n\
    ```javascript\nclass Friend\n{\n    constructor(their_name, their_age, their_loves_spinach)\n\
    \    {\n        this.name = their_name;\n        this.age = their_age;\n     \
    \   this.loves_spinach = their_loves_spinach;\n        console.log(\"A friend\
    \ was created, with name: \"+this.name+\", age: \"+this.age+\", and loves spinach:\
    \ \"+this.loves_spinach);\n    }\n    SayHi()\n    {\n        console.log(\"Hi,\
    \ my name is: \"+this.name+\", my age is: \"+this.age+\", and do I love spinach?\
    \ \"+this.loves_spinach+\".\");\n    }\n}\n```\n\nSo, we just created a new function\
    \ called `SayHi`, and we're not passing in any variables, because it will already\
    \ have all the information stored in any friend object, because it’s inside of\
    \ it (name, age, etc.).\n"
  raw: 'A class in general is just defining something that will hold information for
    a bunch of similar objects (like a blueprint, or an idea). It''s something that
    doesn''t do anything on its own, so we''ll later have to use it after we define
    it.


    ## Creating our own type/ class/ template/blueprint


    So, we create it like:


    class Friend


    {


        constructor()


        {


            this.name = "someones name";


            this.age = 0;


            this.loves_spinach = true;


            console.log("A friend was created, with name: "+this.name+", age: "+this.age+", and loves spinach: "+this.loves_spinach);


        }


    }


    You use curly braces (such as: {}) inside a class or a function (more on this
    later on) to show where the class will begin and end.


    The key word "constructor()", with the parenthesis, is a function that gets run
    automatically whenever a new "Friend" i created from our friend class. It also
    uses curly braces to show the start and end of the function. It also needs normal
    circular parenthesis (ex= () ), which means it will be a function that gets run/called,
    and not a variable.


    Declaring variables inside a class, you don''t need to use the "let" keyword anymore,
    but do have to use "this.variable_name", with "this" which will refer to any object
    you create from the class.


    ## Creating an object from our class


    So now if we want to create a new friend variable from the class we just defined,
    which will have the other 3 variables types inside of it, we can do:


    let my_friend = new Friend();


    That''s all that''s needed to create 1 new friend object, which is one friend
    that has everything defined by our Friend class/blueprint above!


    This will also automatically run the constructor which the object is created from
    the class, which creates the name, age, loves_spinach variables inside of a new
    friend object (based off of the friend class template), and will print out the
    console.log right before the end of the "constructor" function (which automatically
    gets called whenever we create a new friend). So, if you type that in now, you''ll
    just see the console.log being outputted.


    Your script tag will look like:


    <script>


        class Friend


        {


            constructor()


            {


                this.name = "someones name";


                this.age = 0;


                this.loves_spinach = true;


                console.log("A friend was created, with name: "+this.name+", age: "+this.age+", and loves spinach: "+this.loves_spinach);


            }


        }


        let my_friend = new Friend();


    </script>


    And if run, will print out:


    A friend was created, with name: someones name, age: 0, and loves spinach: true


    If we want to say change out the name and age, we can do so by adding on the next
    line after creating a new friend:


    my_friend.name="Timmy";


    my_friend.age=12;


    To verify we changed it, we can console.log it out on the next line:


    console.log("My friend name is: " + my_friend.name +", and his age is: "+ my_friend.age);


    JavaScript also lets you print out the entire object if you want to see what it
    looks like:


    console.log(my_friend);


    So, if we want to make another new friend, do the same thing (which will look
    at the class, create a new object from that class, and give us the new object
    back), by adding on the next line:


    let my_other_friend = new Friend();


    And if you print out this one, you can see it''s a different object then "my_friend",
    but they both are based off the "Friend" class, both have the same type of variables
    inside them, but different values stored in their own variables (this friend just
    has the default name, age, etc we assigned it in the constructor)


    console.log(my_other_friend);


    To change the name and age again, we''d have to do something like:


    my_other_friend.name="Betty Sue";


    my_other_friend.age=110;


    But wouldn''t it be nice if we could just assign the name and age the same time
    we create the friend, instead of having to put it on 3 different lines, since
    we''ll probably almost never use the default name/ age anyways?


    Again, there is a way!


    Your final code should look similar to:


    <script>


        class Friend


        {


            constructor()


            {


                this.name = "someones name";


                this.age = 0;


                this.loves_spinach = true;


                console.log("A friend was created, with name: "+this.name+", age: "+this.age+", and loves spinach: "+this.loves_spinach);


            }


        }


        let my_friend = new Friend();


        my_friend.name="Timmy";


        my_friend.age=12;


        console.log("My friend name is: " + my_friend.name +", and his age is: "+ my_friend.age);


        console.log(my_friend);


        let my_other_friend = new Friend();


        console.log(my_other_friend);


        my_other_friend.name="Betty Sue";


        my_other_friend.age=110;


        console.log(my_other_friend);


    </script>


    ## Passing in values to the constructor function


    We can actually pass what we want those variables to hold to the constructor,
    and assign it there instead of the default values! So, change the class to:


    class Friend


    {


        constructor(their_name, their_age, their_loves_spinach)


        {


            this.name = their_name;


            this.age = their_age;


            this.loves_spinach = their_loves_spinach;


            console.log("A friend was created, with name: "+this.name+", age: "+this.age+", and loves spinach: "+this.loves_spinach);


        }


    }


    So, we are going to pass over what we want those variables to hold, and instead
    of just the default values being assigned to our friends’ variables, it will assign
    any value we pass in. So, we can now just do:


    let my_new_friend = new Friend("Steve", 12, false);


    Which will pass "Steve" in, and name it with the variable in the first parameter
    (their_name), next pass in 12, and assign it to the next variable in the constructor
    (their_age), and finally the last thing we pass to it is false, which gets passed
    over and stored in the variable (their_loves_spinach).


    Side Note: The names of the variables in the constructor parameters (ex: their_name,
    their_age, etc) can be called anything we want, because those variable names will
    only exist inside the constructor. We could call them var1, var2, or param1, param2,
    or name age, etc. It just depends on what makes the most sense to you. But since
    they are only defined in the parameters (the parenthesis) of the constructor,
    they won''t exist outside it.


    So now we can create new friends super easy, and it only takes one line to do
    it!


    Example:


    let my_new_friend = new Friend("Steve Guttenberg", 12, false);


    let my_new_friend2 = new Friend("Zhanna Matzaball", 36, true);


    let my_new_best_friend = new Friend("Jerriah N", 1, false);


    But what if we want them to console.log out their information? Right now we''d
    have to do:


    console.log("Hi, my name is "+my_new_friend.name +", my age is: "+my_new_friend.age+", and do I love spinach? "+my_new_friend.loves_spinach+".");


    For every friend! If we have 5 of them, it''s a lot of text to type, 20, even
    more so. Wouldn''t it be nice if we could ask each friend to say their own information,
    and type out something much shorter than "console.log…"?


    ## Functions / Methods- doing something


    Luckily there is! We can put a custom function in our class, somewhat like the
    constructor, and we can just have it run whenever we want to. So, change our friend
    class to be:


    class Friend


    {


        constructor(their_name, their_age, their_loves_spinach)


        {


            this.name = their_name;


            this.age = their_age;


            this.loves_spinach = their_loves_spinach;


            console.log("A friend was created, with name: "+this.name+", age: "+this.age+", and loves spinach: "+this.loves_spinach);


        }


        SayHi()


        {


            console.log("Hi, my name is "+this.name +", my age is: "+this.age+", and do I love spinach? "+this.loves_spinach+".");


        }


    }


    So, we just created a new function called "SayHi", and we''re not passing in any
    variables, because it will already have all the information stored in any friend
    object, because it’s inside of it (name, age, etc.).'
