  trans: "\n\n`canvas` 标签的特殊之处在于，我们可以使用 JavaScript 在其内部绘图，而不需要担心内部的 CSS。\n\n所以，现在让我们通过获取段落标签（paragraph\
    \ tag）和 canvas 标签，并从 JavaScript 中修改它们，将我们的 JavaScript 连接到 HTML 上吧！\n\n## 从 JavaScript\
    \ 修改 HTML\n\nJavaScript 中包含了一些内置函数，它们允许我们从 HTML 中获取一个 HTML 标签。如果我们想获取我们的段落（`<p>`）标签，可以通过将其放入\
    \ JavaScript（在 `<script>` 标签内）中来实现：\n\n```javascript\ndocument.querySelector(\"\
    p\");\n```\n\n这将获取我们 html 中的第一个 `<p>` 标签，但不会对它进行任何操作，所以我们看不到它执行了什么操作。因此，让我们用 `console.log`\
    \ 把它打印出来：\n\n```javascript\nconsole.log(document.querySelector(\"p\"));\n```\n\
    \n如果你查看控制台，你会看到显示为：\n\n`<p>This is some text that I created on a webpage</p>`。\n\
    \n这是一个内置函数，但你可以将 `document` 理解为主要的 html 标签，并将 `querySelector` 理解为 `document` 内置的函数，它让你能够以许多方式获取页面上的\
    \ html 标签。\n\n但如果我们想从 JavaScript 修改段落内部的文本呢？嗯，让我们先将段落存储在一个变量中，这样我们每次想访问它时就不必输入\
    \ `document.query....`。所以：\n\n```javascript\nlet my_paragraph = document.querySelector(\"\
    p\");\n```\n\n现在我们将段落 HTML 元素存储在变量 `my_paragraph` 中，所以每当我们想玩玩它时，现在都有一个变量可以访问它了。\n\
    \n现在让我们更改 p 标签内部的文本——也称为“inner html”：\n\n```javascript\nmy_paragraph.innerHTML\
    \ = \"I changed this text from JavaScript!\";\n```\n\n如果你运行这段代码，现在会看到 HTML 页面上的文本发生了变化！每当页面加载时，JavaScript\
    \ 运行并快速替换文本。以后，我们可以添加一个按钮或其他类型的输入在页面加载后更改文本，这样看到它变化时会有延迟。但现在，我们将开始在 canvas 标签中画一些东西。\n\
    \n## 使用 canvas 标签绘图\n\n首先，你将再次获取 canvas 标签，并将其赋值给变量以便于访问：\n\n```javascript\nlet\
    \ my_canvas = document.querySelector(\"canvas\");\n```\n\n此外，为了在 canvas 上实际绘图，你需要向它请求一个“绘制上下文”（drawing\
    \ context），并告诉它你现在只想画普通的 2d 图（而不是 3d）：\n\n```javascript\nlet draw_context = my_canvas.getContext(\"\
    2d\");\n```\n\n如果我们愿意，实际上可以创建一个更短的变量名并用它代替，尽管它不那么清晰——它将存储对我们 canvas 标签相同的引用，但这是一个我们可以用来引用它的额外名称（或别名）。这类似于称呼某人为\
    \ Bill、Billy、Bill-dawg、B-shidigy、Will、Willy 等。同一个人，但可以叫他们不同的名字或别名。\n\n```javascript\n\
    let ctx = draw_context;\n```\n\n现在我们来画点东西——比如一个代表头的块/矩形。\n\n首先，我们需要通过调用 `fillStyle\
    \ = color` 来告诉它我们正在使用的颜色。\n\n然后，我们需要告诉它我们将使用 `fillRect(left, top, width, height)`\
    \ 来绘制一个填充的矩形：\n\n```javascript\nctx.fillStyle = \"pink\";\nctx.fillRect(10, 20,\
    \ 50, 60);\n```\n\n`fillRect` 函数需要传递 4 个参数来绘制矩形——将其放在哪里，以及让它多大。\n\n前两个参数是绘制它距离\
    \ canvas 左上角有多远。我们提供 `10` 让它距离左侧 10 像素/方格，并提供 `20` 让它距离顶部下方 20 像素。\n\n接下来的两个参数是制作矩形的宽度和高度。我们设置它的宽度为\
    \ 50 像素，高度为 60 像素（通常头比它宽要高）。\n\n你可以尝试这些参数，画更大的矩形，改变它们的位置等。\n\n你应该会得到类似下面示例的内容：\n\
    \n```html\n<script>\n    let my_paragraph = document.querySelector(\"p\");\n \
    \   my_paragraph.innerHTML = \"I changed this text from JavaScript!\";\n    let\
    \ my_canvas = document.querySelector(\"canvas\");\n    let draw_context = my_canvas.getContext(\"\
    2d\");\n    let ctx = draw_context;\n    ctx.fillStyle = \"pink\";\n    ctx.fillRect(10,\
    \ 20, 50, 60);\n</script>\n```\n\n![](img/image00471.jpeg)\n\n### 旁注：颜色\n\n对于颜色，我们可以提供大多数普通的颜色名称，但如果我们想提供自定义颜色，比如粉褐色的肉色……（重复性文本已略）\n\
    \n## 使用 canvas 标签绘图\n\n首先，你将再次获取 canvas 标签，并将其赋值给变量以便于访问：\n\n```javascript\nlet\
    \ my_canvas = document.querySelector(\"canvas\");\n```\n\n此外，为了在 canvas 上实际绘图，你需要向它请求一个“绘制上下文”，并告诉你现在只想画普通的\
    \ 2d 图（而不是 3d）：\n\n```javascript\nlet draw_context = my_canvas.getContext(\"2d\"\
    );\n```\n\n如果我们愿意，实际上可以创建一个更短的变量名并用它代替，尽管它不那么清晰——它将存储对我们 canvas 标签相同的引用，但这是一个我们可以用来引用它的额外名称（或别名）。这类似于称呼某人为\
    \ Bill、Billy、Bill-dawg、B-shidigy、Will、Willy 等。同一个人，但可以叫他们不同的名字或别名。\n\n```javascript\n\
    let ctx = draw_context;\n```\n\n现在我们来画点东西——比如一个代表头的块/矩形。\n\n首先，我们需要通过调用 `fillStyle\
    \ = color` 来告诉它我们正在使用的颜色。\n\n然后，我们需要告诉它我们将使用 `fillRect(left, top, width, height)`\
    \ 来绘制一个填充的矩形：\n\n```javascript\nctx.fillStyle = \"pink\";\nctx.fillRect(10, 20,\
    \ 50, 60);\n```\n\n`fillRect` 函数需要传递 4 个参数来绘制矩形——将其放在哪里，以及让它多大。\n\n前两个参数是绘制它距离\
    \ canvas 左上角有多远。我们提供 `10` 让它距离左侧 10 像素/方格，并提供 `20` 让它距离顶部下方 20 像素。\n\n接下来的两个参数是制作矩形的宽度和高度。我们设置它的宽度为\
    \ 50 像素，高度为 60 像素（通常头比它宽要高）。\n\n你可以尝试这些参数，画更大的矩形，改变它们的位置等。\n\n你应该会得到类似下面示例的内容：\n\
    \n```html\n<script>\n    let my_paragraph = document.querySelector(\"p\");\n \
    \   my_paragraph.innerHTML = \"I changed this text from JavaScript!\";\n    let\
    \ my_canvas = document.querySelector(\"canvas\");\n    let draw_context = my_canvas.getContext(\"\
    2d\");\n    let ctx = draw_context;\n    ctx.fillStyle = \"pink\";\n    ctx.fillRect(10,\
    \ 20, 50, 60);\n</script>\n```\n\n![](img/image00471.jpeg)\n\n### 旁注：颜色\n\n对于颜色，我们可以提供大多数普通的颜色名称，但如果我们想提供自定义颜色，比如粉褐色的肉色……（重复性文本已略）\n\
    \n## 为我们的矩形添加更多内容\n\n有一个头很酷，但让我们再添加一些东西——接下来是眼睛。\n\n我们将想要创建变量来存储我们的颜色，因为我们需要为每只眼睛引用眼睛颜色，比如\
    \ 100% 的蓝色：\n\n```javascript\nlet eye_color = \"rgb(0, 0, 255)\";\n```\n\n现在在矩形上画它。它会更小，位置更靠下，并且每只眼睛之间有偏移：\n\
    \n```javascript\n//设置填充样式：\nctx.fillStyle = eye_color;\n//画左眼\nctx.fillRect(20,\
    \ 35, 10, 15);\n\n//画右眼\nctx.fillRect(40, 35, 10, 15);\n```\n\n示例：\n\n![](img/image00472.jpeg)\n\
    \n### 旁注：注释：\n\n通过在某些代码前面加上两个斜杠（//），它将创建一个注释。注释是计算机会完全忽略的内容，但它是为了让人类给自己或他人留下笔记，或者通过将其放在行首来临时让某些代码不运行。\n\
    \n"
- fmt: "\nSo if you want to stop drawing the right eye to test this, just add `//`\
    \ before `ctx.fillRect(40, 35, 10, 15);`, and it will \"comment\" it out, making\
    \ it so it no longer runs, but you as a human can still see it. I'll use these\
    \ more in the future, since commenting code can help you write down what you are\
    \ about to do, so you can plan out what your code will be, or will allow you to\
    \ look back, and immediately see what a line of code does by looking at the comment.\n\
    \n## We gotta do more!\n\nNow let's try to draw a mouth, nose, hair, maybe a body,\
    \ some clothes, and do the same thing for 20 other friends. Doing it the current\
    \ way is going to take a looooong time, and we'll just be repeating ourselves\
    \ a lot. If only there was some way we could do the same thing over and over,\
    \ but slightly different? Like drawing a bunch of heads, all with different skin\
    \ colors, and eye colors, that we somehow pass unique values to only have to change\
    \ the differences.\n\nWait- we already learned about functions- so this seems\
    \ like it would be the right tool for the job!\n\nSo, let's add some variables\
    \ to our `Friend` class, to make them able to draw out their own heads, with their\
    \ own colors. Change out our code to:\n\n```javascript\nclass Friend\n{\n    constructor(their_name,\
    \ their_age, their_loves_spinach, their_eye_color, their_skin_color, their_hair_color,\
    \ their_x_pos, their_y_pos)\n    {\n      this.name = their_name;\n      this.age\
    \ = their_age;\n      this.loves_spinach = their_loves_spinach;\n      this.eye_color\
    \ = their_eye_color;\n      this.skin_color = their_skin_color;\n      this.hair_color\
    \ = their_hair_color;\n      this.x_pos = their_x_pos;\n      this.y_pos = their_y_pos\n\
    \      console.log(\"A friend was created, with name: \"+this.name+\", age: \"\
    +this.age+\", and loves spinach: \"+this.loves_spinach);\n      console.log(\"\
    And some facts about them, eye color: \"+this.eye_color+\", skin color: \"+this.skin_color+\"\
    , hair color: \"+this.hair_color+\", x and y: \"+this.x_pos+\", \"+this.y_pos);\n\
    \      this.DrawFriend();\n    }\n\n    SayHi()\n    {\n      console.log(\"Hi,\
    \ my name is \"+this.name +\", my age is: \"+this.age+\", and do I love spinach?\
    \ \"+this.loves_spinach+\".\");\n    }\n\n    DrawFriend()\n    {\n      //this\
    \ is where we will start drawing our friend\n    }\n}\n```\n\nSo, we just added\
    \ more things to pass to the constructor- eye, skin, and hair color. We also don't\
    \ want all our friends to be drawn on top of each other, or we'll only see one,\
    \ whoever is drawn last/ on top of the others. So, we're also going to provide\
    \ an `x` and `y` position, to position them inside the canvas. We also have it\
    \ logging out those variables, so we know they got set properly.\n\nAt the end,\
    \ we're going to call/invoke our new function `DrawFriend()`. Nothing is in there\
    \ yet, except a comment about us wanting to draw them. So, we'll fill it in with\
    \ what we already did, but use the variables we defined for the colors, and the\
    \ position.\n\n## Creating the DrawFriend Function:\n\nSo update `DrawFriend()`\
    \ to:\n\n```javascript\nDrawFriend()\n{\n  //this is where we will start drawing\
    \ our friend\n  //---------------- get the canvas stuff we need to be able to\
    \ draw ----------------\n  let my_canvas = document.querySelector(\"canvas\");\n\
    \  let draw_context = my_canvas.getContext(\"2d\");\n  let ctx = draw_context;\n\
    \  //---------------- draw the head ----------------\n  // define width and height\
    \ of the head\n  let width_head = 50;\n  let height_head = 60;\n  ctx.fillStyle\
    \ = this.skin_color;\n  ctx.fillRect(this.x_pos, this.y_pos, width_head, height_head);\n\
    \  //---------------- draw the eyes ----------------\n  // define width and height\
    \ of the eyes\n  let width_eyes = 10;\n  let height_eyes = 15;\n  // set the fill\
    \ style:\n  ctx.fillStyle = this.eye_color;\n  // define how offset the eyes should\
    \ be from the left and right side of the head\n  let eye_x_offset = 10;\n  //\
    \ define how offset the eyes should be from the top of the head\n  let eye_y_offset\
    \ = 15;\n  //--draw the left eye, left corner, top, width and height --\n  ctx.fillRect(this.x_pos+eye_x_offset,\
    \ this.y_pos+eye_y_offset, width_eyes, height_eyes);\n  //--draw the right eye--\n\
    \  // a lot more complicated-have to find right side of head (x_pos+width_head),\
    \ then minus the width of eye + x offset of eye to position the left side of the\
    \ eye away from the right side of the head\n  let right_side_of_head = this.x_pos+width_head;\n\
    \  let right_eye_x_pos = right_side_of_head-width_eyes-eye_offset;\n  ctx.fillRect(right_eye_x_pos,\
    \ this.y_pos+eye_y_offset, width_eyes, height_eyes);\n}\n```\n\nOuch, a very long\
    \ function. We're doing the same thing as before, but we're using `this.x_pos`,\
    \ `this.y_pos`, the eye color and skin color to draw the head. For the left eye-\
    \ we just take the x position of the left side of the head, and add the offset/\
    \ how far we want the left side of the eye to be from the left side of the head.\
    \ For the right side, it's a lot more complicated, and we actually have to do\
    \ some more steps. It by default draws the rectangles from the top left, but we\
    \ want to place it away from the right side of the head. So, we first figure out\
    \ where the right side of the head is. The `x_pos` plus the width of the head\
    \ gives us the right side. If we drew here, the eye would start off the right\
    \ side of the head. So we need to minus the width of the eye, which moves the\
    \ eye to the left that much. and now the eye would be drawn up to the right edge\
    \ of the head. Finally, we need to minus our eye offset, to move it away from\
    \ the right side of the head, the same that we moved the left eye.\n\n## Creating\
    \ and drawing a bunch of friends:\n\nYou could at this point play with the head\
    \ width and height, or the eye width, height, and offsets to change how the face\
    \ is laid out. But now we can easily draw a few friends with:\n\n```javascript\n\
    //create 3 new friends:\n//the parameters we are passing are: (their_name, their_age,\
    \ their_loves_spinach, their_eye_color, their_skin_color, their_hair_color, their_x_pos,\
    \ their_y_pos)\nlet timmy = new Friend(\"Timmy Smith\", 16, true, \"rgb(0,0,255)\"\
    , \"rgb(209, 181, 140)\", \"rgb(125, 60, 34)\", 20, 20);\nlet jackie = new Friend(\"\
    Jackie O\", 42, true, \"rgb(0,255,0)\", \"rgb(245, 215, 171)\", \"rgb(110, 9,\
    \ 9)\", 100, 5);\nlet sha = new Friend(\"Shaun\", 30, true, \"rgb(1, 2, 3)\",\
    \ \"rgb(79, 48, 23)\", 20, 10);\nlet megan = new Friend(\"Megan\", 16, true, \"\
    rgb(0,0,0)\", \"rgb(209, 181, 140)\", 260, 20);\n```\n\nIf you run this, you'll\
    \ see a bunch of faces with different eyes and positions! Example: `0473.jpeg`\
    \ Full listing:\n\n```html\n<html>\n<head></head>\n<body>\n<p>This is some text\
    \ I created on a webpage</p>\n<canvas style=\"border:1px solid green\"></canvas>\n\
    <script>\n// Friend class goes here\n</script>\n</body>\n</html>\n```\n"
  raw: 'So if you want to stop drawing the right eye to test this, just add // before
    ctx.fillRect(40, 35, 10, 15);, and it will "comment" it out, making it so it no
    longer runs, but you as a human can still see it. I''ll use these more in the
    future, since commenting code can help you write down what you are about to do,
    so you can plan out what your code will be, or will allow you to look back, and
    immediately see what a line of code does by looking at the comment.


    ## We gotta do more!


    Now let''s try to draw a mouth, nose, hair, maybe a body, some clothes, and do
    the same thing for 20 other friends. Doing it the current way is going to take
    a looooong time, and we''ll just be repeating ourselves a lot. If only there was
    some way we could do the same thing over and over, but slightly different? Like
    drawing a bunch of heads, all with different skin colors, and eye colors, that
    we somehow pass unique values to only have to change the differences.


    Wait- we already learned about functions- so this seems like it would be the right
    tool for the job!


    So, let''s add some variables to our friend class, to make them be able to draw
    out their own heads, with their own colors. Change out our code to:


    class Friend


    {


        constructor(their_name, their_age, their_loves_spinach, their_eye_color, their_skin_color, their_hair_color, their_x_pos, their_y_pos)


        {


            this.name = their_name;


            this.age = their_age;


            this.loves_spinach = their_loves_spinach;


            this.eye_color = their_eye_color;


            this.skin_color = their_skin_color;


            this.hair_color = their_hair_color;


            this.x_pos = their_x_pos;


            this.y_pos = their_y_pos


            console.log("A friend was created, with name: "+this.name+", age: "+this.age+", and loves spinach: "+this.loves_spinach);


            console.log("And some facts about them, eye color: "+this.eye_color+", skin color: "+this.skin_color+", hair color: "+this.hair_color+", x and y: "+this.x_pos+", "+this.y_pos);


            this.DrawFriend();


        }


        SayHi()


        {


            console.log("Hi, my name is "+this.name +", my age is: "+this.age+", and do I love spinach? "+this.loves_spinach+".");


        }


        DrawFriend()


        {


            //this is where we will start drawing our friend


        }


    }


    So, we just added more things to pass to the constructor- eye, skin, and hair
    color. We also don''t want all our friends to be drawn on top of each other, or
    we''ll only see one, whoever is drawn last/ on top of the others. So, we''re also
    going to provide an x and y position, to position them inside the canvas. We also
    have it logging out those variables, so we know they got set properly.


    At the end, we''re going to call/invoke our new function "DrawFriend()". Nothing
    is in there yet, except a comment about us wanting to draw them. So, we''ll fill
    it in with what we already did, but use the variables we defined for the colors,
    and the position.


    ## Creating the DrawFriend Function:


    So update DrawFriend() to:


            DrawFriend()


        {


            //this is where we will start drawing our friend


            //---------------- get the canvas stuff we need to be able to draw ----------------


            let my_canvas = document.querySelector("canvas");


            let draw_context = my_canvas.getContext("2d");


            let ctx = draw_context;


            //---------------- draw the head ----------------


            //define width and height of the head


            let width_head = 50;


            let height_head = 60;


            ctx.fillStyle = this.skin_color;


            ctx.fillRect(this.x_pos, this.y_pos, width_head, height_head);


            //---------------- draw the eyes ----------------


            //define width and height of the eyes


            let width_eyes = 10;


            let height_eyes = 15;


            //set the fill style:


            ctx.fillStyle = this.eye_color;


            //define how offset the eyes should be from the left and right side of the head


            let eye_x_offset = 10;


            //define how offset the eyes should be from the top of the head


            let eye_y_offset = 15;


            //--draw the left eye, left corner, top , width and height --


            ctx.fillRect(this.x_pos+eye_x_offset, this.y_pos+eye_y_offset, width_eyes, height_eyes);


            //--draw the right eye--


            //a lot more complicated- have to find right side of head (x_pos+width_head), then minus out the width of eye + x offset of eye to position the left side of the eye away from the right side of the head


            let right_side_of_head=this.x_pos+width_head


            let right_eye_x_pos = right_side_of_head - width_eyes-eye_x_offset;


            ctx.fillRect(right_eye_x_pos, this.y_pos+eye_y_offset , width_eyes, height_eyes);


        }


    Ouch, a very long function. We''re doing the same thing as before, but we''re
    using "this.x_pos", the y_pos, the eye color and skin color to draw the head instead.


    For the left eye- we just take the x position of the left side of the head, and
    add the offset/ how far we want the left side of the eye to be away from the left
    side of the head.


    For the right side, it''s a lot more complicated, and we actually have to do some
    more math steps. It by default draws the rectangles from the top left, but we
    want to place it away from the right side of the head. So, we first figure out
    where the right side of the head is. The x_pos is the left side + the width of
    the head gives us the right side.


    If we drew here, the eye would start off the right side of the head. So we need
    to minus the width of the eye, which moves the eye to the left that much. and
    now the eye would be drawn up to the right edge of the head. Finally, we need
    to minus our eye offset, to move it away from the right side of the head, the
    same that we moved the left eye.


    ## Creating and drawing a bunch of friends:


    You could at this point play with the head width and height, or the eye width,
    height, and offsets to change how the face is laid out. But now we can easily
    draw a few friends with:


    //create 3 new friends:


    //the parameters we are passing are: (their_name, their_age, their_loves_spinach,
    their_eye_color, their_skin_color, their_hair_color, their_x_pos, their_y_pos)


    let timmy = new Friend("Timmy Smith", 16, true, "rgb(0,0,255)", "rgb(209, 181, 140)", "rgb(125, 60, 34)", 20, 20);


    let jackie = new Friend("Jackie O", 42, true, "rgb(0,255,0)", "rgb(245, 215, 171)", "rgb(110, 91, 91)", 100, 50);


    let shaun = new Friend("Shaun W", 30, true, "rgb(31, 26, 22)", "rgb(79, 48, 23)", "rgb(5, 2, 0)", 200, 10);


    let megan = new Friend("Megan Rocky", 16, true, "rgb(0,0,0)", "rgb(209, 181, 140)", "rgb(0, 60, 0)", 260, 120);


    If you run this, you''ll see we get a bunch of different faces with eyes, all
    with different colors and positions!


