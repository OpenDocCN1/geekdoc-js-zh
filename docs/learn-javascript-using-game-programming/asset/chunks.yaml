    \    this.stone_tile.src = tile_canvas.toDataURL(\"image/png\");\n}\n```\n\n主要的区别在于我们正在使用画布的\
    \ `arc` 函数来绘制圆。它的格式是 x 坐标、y 坐标、半径（圆宽的一半）、起始角度和结束角度（都是“弧度”，而不是角度）。\n\n我们在宽度和高度的一半处绘制\
    \ x 和 y，这使得它正好位于我们磁块的中心。我们还将半径设置为宽度和高度的一半，这使其具有我们磁块尺寸的完整宽度（半径是圆的总宽度/直径的一半）。我们从角度\
    \ 0 开始（指向磁块的右侧），一直到 `Math.PI`（它绕过整个圆并回到 0，画出一个完整的圆）。\n\n然后，我们在下方创建了一些额外的圆，并有不同深浅的灰色，以添加一些细节。\n\
    \n如果你现在运行它，你会看到岩石被画在泥地磁块上，但它看起来像一个完美圆形的眼睛![](img/image00478.jpeg)。因此，我们将它改为使用自定义曲线，以获得更像岩石的形状。贝塞尔曲线（Bezier\
    \ curves）允许你创建自定义形状的曲线，是绘制像 Adobe Illustrator 或 Inkscape 这样的矢量程序的主要方法之一。你甚至可以从\
    \ Inkscape “另存为”你的矢量艺术，并将其保存为 HTML5 画布，这样你就可以实际处理艺术，而不是必须手动猜测和测试。只需在 Inkscape\
    \ 中创建你的矢量艺术，将其保存为 html canvas，用文本编辑器打开 html 文件，并将绘制代码复制到你的程序中。我是使用 Inkscape 创建的这个，将文档属性->文档属性设置为\
    \ 64x64 宽度和高度，缩放为 1.0。然后我创建了一个大致的岩石形状：\n\n```javascript\nCreateStoneTileImage(tile_canvas,\
    \ tile_ctx) {\n    //format for arc(angles in \"radians\"/ Math.PI): arc(x, y,\
