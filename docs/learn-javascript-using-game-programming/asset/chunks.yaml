    \n# 8. 创建世界 - 背景瓦块\n\n## 选择游戏瓦块的大小\n\n瓦块应该做得多大？对于背景，为了节省空间并能够动态生成不同的地图，我们通常使用较小的图像，并在屏幕上平铺或重复该瓦块多次来生成重复的背景。如果你把它们做得太小，你会很容易发现重复的模式。但如果你把得太大，存储一张大图消耗的内存更多，而实际上你可以存储许多较小的瓦块。此外，当玩家修改瓦块时，瓦块越小，他们同时在屏幕上可以交互或更改的内容就越多。\n\
    \n查看最常见的分辨率：\n\n[`gs.statcounter.com/screen-resolution-stats`](https://gs.statcounter.com/screen-resolution-stats)\n\
    \n目前第二常见的分辨率是：1366x768（宽屏宽 1366，高 768），它比第一常见的分辨率略小，但比第三常见的要大。因此，我们将基于此进行设计。\n\
    \n显卡显示 2 的倍数的纹理/图像比显示随机尺寸更容易，所以为了性能考虑，尽可能尝试使用 2 的倍数是一个好主意（但不是必须）。2 的倍数有 2x2=4，2x2x2=8，2x2x2x2=16,\
    \ 32, 64, 128, 256, 512, 1024, 2048, 4096 等。\n\n如果我们想使用 64x64 的瓦块，那么 1366/64=22\
    \ 宽，768/64=12 高。这看起来是合理的。\n\n使用 canvas 来创建纹理\n\n`TileImage` 类位于 `Friend` 类之后\n\
    \n```javascript\nclass TileImage\n{\n  constructor()\n  {\n    // 宽度、高度和存储\n \
    \   this.width_tile = 64;\n    this.height_tile = 64;\n    this.dirt_tile = new\
    \ Image();\n    // 创建瓦块\n    let tile_canvas = document.createElement('canvas');\n\
    \    tile_canvas.width = this.width_tile;\n    tile_canvas.height = this.height_tile;\n\
    \    let tile_ctx = tile_canvas.getContext('2d');\n    this.CreateDirtTile(tile_canvas,\
    \ tile_ctx);\n  }\n\n  CreateDirtTile(tile_canvas, tile_ctx)\n  {\n    // 定义我们要使用的颜色\n\
    \    let medium_brown = \"rgb(99, 65, 5)\"\n    let dark_brown = \"rgb(61, 40,\
    \ 2)\";\n    let light_brown = \"rgb(125, 75, 9)\"\n    // 在整个图像上绘制中棕色\n    tile_ctx.fillStyle\
    \ = medium_brown;\n    tile_ctx.fillRect(0, 0, this.width_tile, this.height_tile);\n\
    \    // 绘制深棕斑点\n    tile_ctx.fillStyle = dark_brown;\n    tile_ctx.fillRect(0,\
    \ 10, this.width_tile*.33, this.height_tile*.25);\n    tile_ctx.fillRect(40, 40,\
    \ this.width_tile*.33, this.height_tile*.25);\n    tile_ctx.fillRect(25, 0, this.width_tile*.33,\
    \ this.height_tile*.25);\n    // 绘制浅棕斑点\n    tile_ctx.fillStyle = light_brown;\n\
    \    tile_ctx.fillRect(30, 50, this.width_tile*.33, this.height_tile*.25);\n \
    \   tile_ctx.fillRect(60, 10, this.width_tile*.33, this.height_tile*.25);\n  \
    \  tile_ctx.fillRect(0, 30, this.width_tile*.33, this.height_tile*.25);\n    //\
    \ 将画布上的绘制内容复制到土壤瓦块图像\n    this.dirt_tile.src = tile_canvas.toDataURL(\"image/png\"\
    );\n  }\n} // TileImage 类结束\n```\n\n"
- fmt: "\nIn the function `UpdateGame`, under `ClearCanvas(ctx, \"rgba(0,0,255,255)\"\
    );`, add the line:\n\n```\nctx.drawImage(tile_creator.dirt_tile, 150, 0);\n```\n\
    \nWhich will draw our `tile_creator.dirt_tile` we just created at position x=150,\
    \ y=0 on the screen before drawing our character, after the canvas was cleared.\n\
    \nNow we have one tile drawn to the screen, but we'll want a bunch of them, tiled\
    \ in both the x and y direction, so we have the full screen filled with tiles\
    \ (or more, and add scrolling). So, let's create something that can contain a\
    \ bunch of tiles!\n\n## Creating a map of tiles\n\nRight now, to be able to draw\
    \ multiple tiles to the screen, we have to draw each tile individually, such as\
    \ to draw 3 tiles on the top row (under `ClearCanvas(ctx, \"rgba(0,0,255,255)\"\
    );`, again):\n\n```javascript\nctx.drawImage(tile_creator.dirt_tile, 0, 0);\n\
    ctx.drawImage(tile_creator.dirt_tile, 64, 0);\nctx.drawImage(tile_creator.dirt_tile,\
    \ 128, 0);\n```\n\nIf we want to create a map/ world that is the size of the most\
    \ common screen size, 1366x768, we’ll need to draw out 1366/64 = 21 tiles across,\
    \ and 768/64 = 12 tiles down, and to fill the full screen that is 21x12= 252 times\
    \ we would have to copy the `drawImage` function! And I want to make the first\
    \ map 2x the screen width and height, so 42x24=1,008 tiles/ draw calls!\n\nDoing\
    \ that by copying and pasting would be insanity, not to mention one of the biggest\
    \ things to remember in programming is “DRY” – “Do Not Repeat Yourself”. Programmers\
    \ do what they do to save people time, automate things, and find efficient ways\
    \ to do things. So if you find yourself repeating things more than once or twice,\
    \ there’s likely a much more efficient way of doing things.\n\n## Arrays or Lists\n\
    \nWe have a built-in object type in programming known as an “Array”, or “List”.\
    \ It’s just a type of object that can hold a bunch of the same type of objects.\
    \ Think of if you have 8 friends, you could put them in a variable called `my_friends`.\n\
    \nSay you need to get grocery items at the store, “2 lemons”, “cereal”, “meat”,\
    \ “blueberries”, “pizza”, “fried chicken”, “salad”, “5 avocados”. You could store\
    \ them in individual variables like `grocery_item1`, `grocery_item2`, etc.\n\n\
    But the way to store them in one object, known as an array is:\n\n```javascript\n\
    let grocery_list = new Array(\"2 lemons\", \"cereal\", \"meat\", \"blueberries\"\
    , \"pizza\", \"fried chicken\", \"salad\", \"5 avocados\");\n```\n\nYou can put\
    \ this on the bottom of your program for testing, which we’ll delete before we\
    \ move forward on the game.\n\nIf you `console.log` out the `grocery_list` variable:\n\
    \n```javascript\nconsole.log(grocery_list);\n```\n\nIt should show you something\
    \ like:\n\n`Array(8) [ \"2 lemons\", \"cereal\", \"meat\", \"blueberries\", \"\
    pizza\", \"fried chicken\", \"salad\", \"5 avocados\" ]\n0: \"2 lemons\"\n1: \"\
    cereal\"\n2: \"meat\"\n3: \"blueberries\"\n4: \"pizza\"\n5: \"fried chicken\"\n\
    6: \"salad\"\n7: \"5 avocados\"\nlength: 8\n\nOne major thing to realize about\
    \ arrays is they start at “0”. This can be a bit confusing at first, but item\
    \ 0 is the first item. The last item is the number of total items minus 1 (since\
    \ it started at 0 instead of 1). So, we have 8 items in our array, the first is\
    \ at position 0, so the 8th is one less, or item 7 (since the first item is 0,\
    \ instead of 1 which is 1 less than you normally do).\n\nIt’s a bit counter-intuitive\
    \ at first, but makes some math dealing with arrays a lot smoother later on.\n\
    \nSo, we can log out the entire array, but how do we log out individual items\
    \ in the array? You access it using the variable name, and square blocks of which\
    \ item number.\n\nFor example, if you want to `console.log` out the first item\
    \ in the array:\n\n```javascript\nconsole.log(grocery_list[0]);\n```\n“2 lemons”\n\
    \nor the 3rd item in the list (so 3-1 = 2, so we log out item 2 to see the 3rd\
    \ item):\n\n```javascript\nconsole.log(grocery_list[2]);\n```\n“meat”\n\nWhat\
    \ about the last item? You could know that the length of items is 8, so you could\
    \ log out item: 8-1=7. But an easier way is to use a built-in property of all\
    \ arrays: `length`.\n\nTo log out the length of the array use:\n\n```javascript\n\
    console.log(grocery_list.length);\n```\n“8”\n\nThis logs out “8”, since that is\
    \ the number of items in the array. So to be able to see the last item, we can\
    \ use `grocery_list.length - 1`:\n\n```javascript\nconsole.log(grocery_list[length-1]);\n\
    ```\n“5 avocados”\n\n## Adding and removing items from an array\n\nChange the\
    \ code on the bottom of your program to:\n\n```javascript\nlet grocery_list =\
    \ Array(\"2 lemons\", \"cereal\", \"meat\", \"blueberries\", \"pizza\", \"fried\
    \ chicken\", \"salad\", \"5 avocados\");\n```\n\nIf we want to add something to\
    \ the end, we use `push`:\n\n```javascript\ngrocery_list.push(\"chocolate bars\"\
    );\n```\n\nIf we want to remove an item from the array, use `splice`:\n\n```javascript\n\
    grocery_list.splice(2, 1);\n```\n\nWhat if we want to put an item somewhere in\
    \ the array, not at the end?\n\n```javascript\ngrocery_list.splice(1, 0, \"milk\"\
    );\n```\n\n## Creating an array of tiles\n\nIf we want to create an array of tiles,\
    \ so we can draw a bunch of them, the first thing we want to do is create a tile\
    \ class, so it can keep track of where it is, and later what type of tile is.\n\
    \nCreate a new tile class below where you created your `Image` class:\n\n```javascript\n\
    class Tile {\n  constructor(x, y) {\n    // x and y position of the tile, to be\
    \ able to draw it\n    this.x = x;\n    this.y = y;\n  }\n}\n```\n\nWe just created\
    \ a class that just has an `x` and `y`, so we will know where to draw it on screen.\
    \ We’re also passing over the x and y values when we create it in the constructor,\
    \ so we can pass over the position quickly when we create each tile.\n\nNow we\
    \ want to create an array of tiles on the bottom of our program, below where we\
    \ created the `tile_creator` variable:\n\n```javascript\nlet tiles = new Array(new\
    \ Tile(0,0), new Tile(64, 64), new Tile(64*2, 64*2), new Tile(64*3, 64*3), new\
    \ Tile(64*4, 64*4));\n```\n"
  raw: 'In the function "UpdateGame", under "ClearCanvas(ctx, "rgba(0,0,255,255)");",
    add the line:


    ctx.drawImage(tile_creator.dirt_tile, 150, 0);


    Which will draw our "tile_creator.dirt_tile" we just created at position x=150,
    y=0 on the screen before drawing our character, after the canvas was cleared.


    Now we have one tile drawn to the screen, but we''ll want a bunch of them, tiled
    in both the x and y direction, so we have the full screen filled with tiles (or
    more, and add scrolling). So, let''s create something that can contain a bunch
    of tiles!


    ## Creating a map of tiles


    Right now, to be able to draw multiple tiles to the screen, we have to draw each
    tile individually, such as to draw 3 tiles on the top row (under "ClearCanvas(ctx,
    "rgba(0,0,255,255)");", again):


    ctx.drawImage(tile_creator.dirt_tile, 0, 0);


    ctx.drawImage(tile_creator.dirt_tile, 64, 0);


    ctx.drawImage(tile_creator.dirt_tile, 128, 0);


    If we want to create a map/ world that is the size of the most common screen size,
    1366x768, we’ll need to draw out 1366/64 = 21 tiles across, and 768/64 = 12 tiles
    down, and to fill the full screen that is 21x12= 252 times we would have to copy
    the “drawImage” function! And I want to make the first map 2x the screen width
    and height, so 42x24=1,008 tiles/ draw calls!


    Doing that by copying and pasting would be insanity, not to mention one of the
    biggest things to remember in programming is “DRY” – “Do Not Repeat Yourself”.
    Programmers do what they do to save people time, automate things, and find efficient
    ways to do things. So if you find yourself repeating things more than once or
    twice, there’s likely a much more efficient way of doing things.


    ## Arrays or Lists


    We have a built-in object type in programming known as an “Array”, or “List”.
    It’s just a type of object that can hold a bunch of the same type of objects.
    Think of if you have 8 friends, you could put them in a variable called “my_friends”.


    Say you need to get grocery items at the store, “2 lemons”, “cereal”, “meat”,
    “blueberries”, “pizza”, “fried chicken”, “salad”, “5 avocados”. You could store
    them in individual variables like “grocery_item1”, “grocery_item2”, etc.


    But the way to store them in one object, known as an array is:


    let grocery_list= new Array("2 lemons", "cereal", "meat", "blueberries", "pizza", "fried chicken", "salad", "5 avocados");


    You can put this in on the bottom of your program for testing, which we’ll delete
    before we move forward on the game.


    If you console.log out the “grocery_list” variable:


    console.log(grocery_list);


    It should show you something like:


    Array(8) [ "2 lemons", "cereal", "meat", "blueberries", "pizza", "fried chicken",
    "salad", "5 avocados" ]


    0: "2 lemons"


    1: "cereal"


    2: "meat"


    3: "blueberries"


    4: "pizza"


    5: "fried chicken"


    6: "salad"


    7: "5 avocados"


    length: 8


    One major thing to realize about arrays is they start at “0”. This can be a bit
    confusing at first, but item 0 is the first item. The last item is the number
    of total items minus 1 (since it started at 0 instead of 1). So, we have 8 items
    in our array, the first is at position 0, so the 8th is one less, or item 7 (since
    the first item is 0, instead of 1- which is 1 less than you normally do).


    It’s a bit counter-intuitive at first, but makes some math dealing with arrays
    a lot smoother later on.


    So, we can log out the entire array, but how do we log out individual items in
    the array? You access it using the variable name, and square blocks of which item
    number.


    For example, if you want to console.log out the first item in the array:


    console.log(grocery_list[0]);


    “2 lemons”


    or the 3rd item in the list (so 3-1 = 2, so we log out item 2 to see the 3rd item)


    console.log(grocery_list[2]);


    “meat”


    What about the last item? You could know that the length of items is 8, so you
    could log out item: 8-1=7. But an easier way is to use a built-in property of
    all arrays: “length”.


    To log out the length of the array use: 


    console.log(grocery_list.length);


    “8”


    This logs out “8”, since that is the number of items in the array. So to be able
    to see the last item, we can use this length – 1 (which would be 7 in this case)
    to see the last item:


    console.log(grocery_list[grocery_list.length-1]);


    "5 avocados"


    This is the same thing as saying:


    console.log(grocery_list[7]);


    But it allows us to be able to add or remove stuff from the grocery list, and
    always print out the last item, no matter how many items are in the list.


    Speaking of which, we saw above how to create an array from scratch, and have
    items added to it when it is created, but how do you add or remove items from
    the array/list?


    ## Adding and removing items from an array


    Change the code on the bottom of your program to:


    let grocery_list= new Array("2 lemons", "cereal", "meat", "blueberries", "pizza", "fried chicken", "salad", "5 avocados");


    //put new code below here


    console.log(grocery_list);


    console.log(grocery_list.length);


    console.log(grocery_list[grocery_list.length-1]);


    This will print out the size of the array (8) and the last item in the list. But
    let’s add a new item on the end of the list. Add the following below where new
    code should be placed:


    grocery_list.push("chocolate bars");


    Now you should see the size of the array is now 9, and the last item is the new
    item we added. “Push” is a function built into the array to add something onto
    the end.


    If you want to remove an item from the array, add under the push:


    grocery_list.splice(2,1);


    This will remove item number 2 (0,1,2 – so the third item, meat). The number 2
    is the position in the array, and the number 1 is for how many items to remove
    (this time just one).


    What if we want to put a new item somewhere in the array, but not pushed onto
    the end? Well, here it gets a little confusing:


    grocery_list.splice(1,0, "milk");


    Now we’re “splicing” at item 1(2nd item, cereal), but we’re going to remove “0
    items”, and the last thing is we’re going to add the new item “milk”. So now “milk”
    will be the new item 1 (2nd item), and will push cereal to be the 3rd item instead.


    Don’t worry if it’s not super understandable right now, this is one of those things
    that becomes easier with practice, and on top of that, we won’t be modifying our
    arrays after we create them for the background tiles (but will modify other arrays
    later on).


    You should delete all this “grocery_list” code, since it was only to show how
    arrays work, and won’t be used in our game.


    ## Creating an array of tiles


    If we want to create an array of tiles, so we can draw a bunch of them easily,
    the first thing we’ll want to do is create a tile class, so it can keep track
    of where it is being drawn on screen, and later what type of tile it is.


    Create a new tile class below where you created your “TileImageCreator” class:


    class Tile


    {


        constructor(x, y)


        {


            //x and y position of the tile, to be able to draw it onscreen


            this.x= x;


            this.y= y;


        }


    } //end of Tile class


    We just created a class that just has an “x” and “y”, so we will know where to
    draw it on screen. We’re also passing over the x and y values when we create it
    in the constructor, so we can pass over the position quickly when we create each
    tile.


    Now we want to create an array of tiles on the bottom of our program, below where
    we created the “tile_creator” variable:


    let tiles = new Array(new Tile(0,0), new Tile(64, 64), new Tile(64*2, 64*2), new Tile(64*3, 64*3), new Tile(64*4, 64*4));


    We create 5 new tiles in the array, going up by 64 (the width and height of our
    tiles) in both the x and y direction, which will create 5 tiles going down in
    a diagonal direction (going over 1 tile space, then down 1 tile space each time).
    I could have typed out the actual numbers for each one (64*2 = 128, 64*3 = 192,
    etc), but I just had the program do the math for each tile instead, since it’s
    easier.'
