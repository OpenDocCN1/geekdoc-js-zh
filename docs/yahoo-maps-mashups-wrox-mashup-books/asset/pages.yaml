  md: '# Chapter 9


    You should see the Yahoo! Maps JS-Flash API load in your HTML document. The map
    should be loaded satellite map tiles of Sydney, Australia, at a zoom level of
    6 (about state/province level).


    # How It Works


    The upper part of this code is pretty identical to that of the first example in
    this chapter. You are becoming familiar with this code by now. It is responsible,
    once again, for including the JS-Flash API library classes of your web page. The
    mapContainer stays the same, as it creates a holder in which the map will ultimately
    be displayed. Consistent with the first example, too, the div location, in this
    case the mapContainer, to load the API.


    The difference starts when the latitude/longitude coordinates are defined. Using
    the LatLon will tell the map where to center when it initializes its tiles. The
    JS-Flash API (as well as other Yahoo! APIs) needs the latitude/longitude coordinates
    turned into an object to process them. The LatLon object serves this by creating
    a JavaScript variable called lat. Most developers not know latitude/longitude
    coordinates shorthand, so the address used in the first example may be a bit easier
    to leverage.


    Once the lat object is created, it can be passed as a parameter of the map constructor
    along with the desired zoom level. This will resolve the coordinate, center the
    map on location and call for tiles at the specified zoom level. The last action
    in this example is to define the type of tiles used. Regular tiles will show up
    by default. In the example, by using setMapViewType against the map instance,
    you are defining that satellite tiles will be showing initially.


    The following are some notes to help you understand the transition between the
    Ajax and JS-Flash APIs:


    +   - The LatLon class is the equivalent of the YGeoPoint class in the Ajax API.

    - The method setMapViewType is similar to the setMapType in the Ajax API.

    - To load satellite tiles, the JS-Flash API uses the simplified satellite, rather
    than the lengthy YAHOO_MAP_SAT property of the Ajax API.


    The next chapter will discuss these methods and in more detail. Now you have a
    very strong foundation for building your JS-Flash maps mashups. You are about
    to do a lot more with this API and Yahoo! Maps.


    # Summary


    After reading this chapter, you are well on your way to mapping the JS-Flash API
    and have done the following:


    +   - Obtained a YDN AppID

    - Become familiar with Yahoo!''s terms of use for the API'
