  md: '# Chapter 22


    # The Flash Client


    To build the Flash client, as you have done in previous chapters, you will need
    to use the Flash IDE to compile the AS-Flash API. The Flash client side of the
    application contains the API component attached to its stage. When compiled, all
    the classes and functionalities of the map API will become available to the application.
    To allow the Flash client to talk to the Flex client, you will add some very simple
    lines of code to enable the local connection. This will allow it to receive calls
    from the Flex client interface and control the map accordingly.


    # Architect the ActionScript


    Just as with MXML, it is a good practice to architect the Flash client piece of
    the application. This step is an even better idea on the Flash side since it often
    involves thinking out the user elements that may exist by way of the visual approaching
    with the Flash IDE. This mashup does not contain any Flash-based interaction elements,
    over the map itself, this is still a very helpful step. The tasks to complete
    the Flash client are


    +   1. Import all the classes that the map will need.

    2. Create a local connection and register the Flash client.

    3. Add event listeners to field broadcast from the map instance.

    4. Field the map instance events and set initial map properties.

    5. Build functions to handle local connection calls and return data as necessary.


    # Importing the Classes


    The first step to building the ActionScript for the Flash client is importing
    the classes:


    ```

    // Import PanTool class

    import com.yahoo.maps.tools.PanTool;


    // Import CustomPOIMarker class

    import com.yahoo.maps.markers.CustomPOMarker;


    // Import LatLon class

    import com.yahoo.maps.LatLon

    ```


    You have imported the PanTool class that will allow your users to drag the map
    around. The Custom POIMarker will enable you to add a marker to the map you. You
    will need the LatLon class to cast the latitude and longitude properties of the
    golf shot and center the map on that location.


    # Create the Local Connection


    The local connection is an extremely important part of the Flex 2/AS-Flash API
    approach.


    ```

    // Create local connection object

    var connectedMap:LocalConnection = new LocalConnection();


    // Connect to local connection as _flashClient

    connectedMap.connect("_flashClient");

    ```'
