    \ in working with the API that each API featured in this book has a chapter dedicated\
    \ to reviewing the methods available. As you learned with functions, you can pass\
    \ parameters with methods like address or latlon to change the map's location.\n\
    \n# Events\n\nEvents are important and often overlooked feature of JavaScript.\
    \ They represent user interactions or code occurrences that can be handled by\
    \ additional handlers. Events are executed by means of event handlers. An event\
    \ handler is the script that executes when an event occurs. An example of an event\
    \ is triggering the mouse over an element, like an image. The user action will\
    \ fire an event called onMouseEnter. The window would look like this:\n\n```\n\
    <img src=\"someImage.jpg\" onmouseover=\"newWindow('someImage.jpg');\" />\n```\n\
    \nThis code will call the newWindow function, passing the image as a parameter\
    \ when it is rolled over with the mouse."
