    # How it Works


    After importing the Ajax API library, the classes become available to your JavaScript
    and HTML. The mapContainer style defines the size and position of the map. The
    div tags will display the map as it is rendered and inherit the sheet properties
    of the mapContainer class.


    The apiForm is written in HTML and can carry out two functionalities. The form
    contains a text input field and a button. These two elements ultimately allow
    the user to enter a new zoom level and submit it. Upon submission, this ultimately
    change the zoom level of the map. The other purpose of the form is to create a
    space for displaying event data related to the example as they occur. This space
    is a text area that will display the map''s new zoom level when the event has
    been fired.


    The zoom level changes when the Submit button is clicked within the form. The
    onClick() event handler calls the zoomLevel function. Within this function, the
    setZoomLevel method is called against the map instance. JavaScript references
    the user-entered zoom level, which is passed as the new zoomLevel parameter.'
