  md: '![](img/ee60aed724e0f9d7a7d4fc463e96b52a_333_0.png)


    # # The Flex 2 Mashup


    The goal of this chapter is for you to build a Flex 2 mashup using the ActionScript-Flash
    (AS-Flash) API. To achieve this, you will also accomplish the following:


    +   - Establish an idea for your mashup and plan out the key details and development
    approach

    - Learn how to create your own data to mash up in MXML

    - Convert and play flash video dynamically in your mashup

    - Establish communication between Flex and Flash to control and add markers dynamically
    to the map API instance


    # # Time to Mash Up


    Now that you have learned all the methods and classes of the AS-Flash API, as
    they are used with Flex 2 and the local connection method, it''s time to build
    a mashup. With the other APIs featured in this book, this chapter will guide you
    through building a mashup with a data source and the map API.


    The means you employ to use the AS-Flash API is somewhat of a workaround due to
    the absence of a Flex 2-compatible maps component. Because of this, what you have
    learned from the previous chapters is very fundamental. Coding the Flex client,
    Mapclass and Flash client pieces can be time-consuming and may cause you to sacrifice
    the spirit you use when working with the AS-Flash API. Having mastered many of
    the techniques necessary to work with Flex 2 and Yahoo! Maps, you can now explore
    the space freely with this mashup project.


    # # The Big Idea


    Throughout the book, you have built some great mashups, combining the power of
    Yahoo! Maps with other data services. The mashup for this chapter will not point
    to outside data like a web service, RSS feed or API. This time, the mashup will
    be between the Yahoo! Maps API and data you will provide.'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# Chapter 22


    The idea of using your data in a mashup should come as no surprise. Much of the
    web today is built on user content. User-generated content drives numerous blogs
    and accounts for the amazing growth of websites in the last few years. You''ll
    find user content on sites that feature product reviews, comments and feedback.


    Maps provide a great platform for displaying your own content. What of you do,
    on the weekends for example, likes has some geographic region. Each event can
    be marked on a map, providing a unique way for you to document your weekend, generating
    a map mashup with your own content. Perhaps you a trip over the weekend, camping
    or driving into the city for a day to shop or attend a ball game. Or you hit the
    lines for a round of golf.


    Golf, as it turns out, is quite a mapable activity. Occurring in a defined space,
    each of the games takes place on a stretch of land and is marked by each shot.
    On August 13, 2006, I played 18 holes at Sunol Valley Golf Club in Sunol, California.
    It happened to be a special occasion, my brother Nathaniel''s 26th birthday, and
    I shot with my video camera to grab some rare clips of us swinging away. While
    there were no birthday hole-in-ones, we managed to collect some decent and entertaining
    footage of shots. I happened to note some of the shots, both golf and video, were
    taken.


    The mashup you build will have you define structured data within the application.
    These data will organize a series of golf shots and contain the following information:


    +   - The player hitting shot

    - The hole was taken on

    - The latitude and longitude of the hole on the course

    - The path to the .flv (Flash video) file of the captured shot


    Your user will be able to select a golf shot, watch the video and see where the
    shot was taken on a zoomed-in map featuring satellite imagery of the golf course.
    This highly adaptable mashup can be transformed into many things, like a recap
    of victory or video tour of your favorite city. One thing is sure, it may be as
    much fun as code as it will for your users to experience.


    # Planning and Approach


    As with any application, planning and approach are important. It helps to know
    the APIs and web services you are working with very well. Having completed the
    previous chapters on the AS-Flash API, you should have all you to work with the
    map.


    Before coding, it is always good to lay out your objectives and determine how
    best to achieve those tasks. Begin with thinking about what your application should
    achieve. Through the route of the chapter, you will see how these steps are used
    to build the mashup.


    +   - Display the map initially.

    - Position the map and set its view type accordingly.

    - Author the data you will mash up with the map API.

    - Give the user the ability to navigate through the data.'
