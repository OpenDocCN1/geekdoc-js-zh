    # removeAllMarkers()


    removeAllMarkers() will clear all markers that have been loaded to the map instance.
    Since this method does not affect any single marker, but rather all markers, it
    does not need a parameter.


    ```

    mapInstance.removeAllMarkers();

    ```


    # Marker Classes


    Marker classes are packages of elements and other classes that enable you to add
    a variety of markers to your map. Each of marker class is a different marker type.
    A variety of markers are available in the AS-Flash API, ranging from the simple
    black waypoint marker to the customizable POI marker. You can apply your creativity
    and Flash design skills to developing your own custom SWF marker. The various
    marker classes have their own properties, each set when the marker object is created.
    When adding the marker to the map, you define which type of marker you are adding
    by passing the class and the properties you have set in the marker object.


