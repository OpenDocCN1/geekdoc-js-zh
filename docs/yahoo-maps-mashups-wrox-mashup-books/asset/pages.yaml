  md: "# Chapter 22\n\nThere are downsides too, mainly the fact that you will be limited\
    \ to the data you define. Defining your own data also takes the fun out of getting\
    \ familiar with other products and their APIs. Since you are still working with\
    \ the AS-Flash API here, many of the concepts you will learn in Chapter 17, \"\
    The AS-Flash Mashup,\" apply here. For this mashup, you will learn to define data\
    \ in MXML for Flex 2.\n\nYou can add Flex in 2 ways. You can write XML in an external\
    \ file, include it with your application and load it as it were a web service.\
    \ Flex 2 supports an ActionScript XML object similar to that of ActionScript 2\
    \ for Flash. There is also a new, more efficient model called E4X for coding MXML\
    \ format inline with the MXML.\n\nFor this mashup, you will use the Model control.\
    \ This allows you to define a data model inline with the MXML. It is a common\
    \ pattern for controlling controls and components, as each node is parsed, allowing\
    \ referencing for individual properties. This model will become the data provider,\
