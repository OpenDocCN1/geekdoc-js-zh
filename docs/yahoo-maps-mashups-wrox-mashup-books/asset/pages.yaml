    # API Authentication


    Flickr has an authentication process different from YDN-supported APIs and web
    services. You must receive authentication for your mashup from Flickr in the form
    of an API key. You can apply for and receive the key at http://www.flickr.com/services/api/misc.api_keys.html.


    The current application requires your name and e-mail, declaration of a commercial
    or non-commercial usage, and a description of how you plan to use your mashup.
    You must also acknowledge the terms of the Flickr API. You will likely be given
    an API key immediately upon submitting your application.


    You will need the API to complete the mashup for this chapter. As you learn the
    steps to pieces together a call to the Flickr API, the following text will appear
    as an indication of where you need to plug in your API key:


    ```

    (your_flickr_api_key)

    ```


