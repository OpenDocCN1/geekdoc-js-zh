  md: '# AS-Flash API Advanced Features


    # CustomPOIMarker


    POI stands for "point of interest." This class lets you add a marker with the
    custom properties of index, title, description, marker color and color stroke.
    The two color properties reflect the body of the marker and its border, respectively.
    These properties let you adapt the marker into your visualization without having
    to create a completely new one. Although that feature is available with the AS-Flash
    API, as you will see later in the chapter, this marker class is an efficient means
    of achieving customization.


    Another feature of this class is expandable. This replicates a feature offered
    by standard markers, in that as the user rolls over the marker, it expands to
    reveal more detail. As part of this feature, the class includes open() and close()
    functions, which let you control the marker with other code-based interaction.


    # Try Out


    +   1. Open the document as mashup_initialize.fla.

    2. Save it as as_mashup_customPOIMarker.fla.

    3. Select the first frame in the timeline. If it is not visible, go to Timeline
    (Ctrl + Alt + T).

    4. Go to Window Development Panels Actions and select it (or press F9).

    5. Modify the code Event Listener in the actions panel to map the following:


    ```

    // Initialize Event Listener to map instance

    myMap.addEventListener(com.yahoo.maps.api.flash.YahooMap.EVENT_INITIALIZE, onInit);


    // Import CustomPOIMarker class

    import com.yahoo.maps.markers.CustomPOIMarker;


    // Function that executes when initialize is fired

    function onInit(event) {


    // Create variables to set address

    var address1:String = "1600 Pennsylvania Avenue, Washington, D.C.";

    var address2:String = "900 Ohio Drive, Washington, D.C.";


    // Center map on an address and zoom to nothing

    myMap.setCenterAndZoom(address1, 6, 0);


    // Create objects with CustomPOIMarker properties

    var myMarker1:Object = {index:''USA'', title:''The White House'', description:''Home
    of the President'', strokeColor:0xFF0000};

    var myMarker2:Object = {index:''USA'', title:''The Washington Monument'', description:''The
    first president of the United States'', markerColor:0xFF0000};


    // Add the instance of the CustomPOIMarker to map with an address

    myMap.addMarkerByAddress(CustomPOIMarker, address1, myMarker1);

    myMap.addMarkerByAddress(CustomPOIMarker, address2, myMarker2);


    }

    ```'
