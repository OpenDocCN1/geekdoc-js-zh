  md: '# Developing with Yahoo! Maps


    What makes Flickr a great source for mashups is its very comprehensive API. The
    API consists of a great catalog of methods with which to search for and get much
    of the attributes associated with a photo. These attributes range from age of
    the photo to the date it was uploaded, who uploaded it and what it may belong
    to.


    Flickr works with maps because so many photos are uploaded with tags referencing
    geo-spatial information. In fact, many photos have tags that you know where they
    were. Mashups of Flickr often show a series of photos on a map. With the Flash
    API, you can build a sophisticated customSNMarker that lets users browse through
    sets of photos within a sleek interface. That marker is plotted at the very place
    a photo was taken, at the place that it is associated with.


    # Upcoming.org


    One of the web''s premiere calendar applications is Upcoming.org. Upcoming.org
    is free and available to anyone to get information about any event for public
    consumption. Users can log an event anywhere in the world, from Lithuania to Luxembourg.
    When someone adds a new event, attributes as category, start date and time, end
    time, name, description and event URL are collected. The site offers a list of
    venues to which you can assign your event. If your venue''s listed, you can add
    it through a very simple interface.


    There is a unique aspect to Upcoming. When adding an event, you can specify if
    it''s private or even self-promotion. When the event is added, you friends and
    other users on Upcoming can find it and register themselves as attending. Others
    can see the event content.


    Upcoming''s value as a mashup source lies the venue information collected when
    an event is logged. The venue information, which previously existing or newly
    entered, includes a precise location. Like Flickr''s API, Upcoming gets you access
    to events and their locations. These events can easily be depicted as markers
    or markers within overlays. Data can be retrieved in such a way as to allow the
    event title or venue to be displayed by default. When a user engages with the
    marker, additional information on the event or venue, such as address and time,
    can be displayed.


    # HotJobs


    HotJobs is another location-based site that is very friendly with map APIs. The
    service lets employees post job openings for a fee and invites job seekers to
    search their postings for free. It is a very simple model, one that has been successful
    for sites like it.


    Users search jobs by keyword, location (city, state or ZIP) or category. You can
    expand the search to include surrounding cities as well. A useful addition to
    HotJobs is the search agent. This feature lets you save a search you make, register
    your e-mail and receive notifications that meet your set of criteria posted. Additional
    resources like career tools and topics on résumés, interviewing, networking and
    salary calculations round out a very helpful resource.


    A good mashup scenario involving HotJobs is not hard to imagine. People move often
    and need to find new jobs. Pulling in HotJobs data through their API and displaying
    that data in the Yahoo! Maps API helps users gauge the distance between potential
    jobs and where they rent or buy a home.'
  merge: -1
  pgno: 41
