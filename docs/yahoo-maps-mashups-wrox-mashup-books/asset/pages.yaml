  md: '# The JS-Flash API


    ```

    <a href="javascript:newWindow(''http://www.mashupeperts.com'')">>Launch Window</a>

    <body><html>

    </html>

    ```


    You will notice that most of the script is in the head tags of the HTML. This
    is where the JavaScript is defined and where the newWindow function is set. This
    becomes available to the rest of the code within the HTML and can execute the
    same code over and again as called upon. The newWindow function will create a
    new browser window by calling open against the current browser window object,
    the one you are in. This is actually called when the "launch window" link is clicked.
    This link is tagged with `javascript:newWindow`, which tells the browser to call
    the function of name that the JavaScript set of code.


    JavaScript, as mentioned above, has a strong ability to control and manage the
    browser''s elements (or objects). It does this by accessing the DOM (document
    object model) of the browser. This includes the window, location, history, document
    and navigator elements and objects of the browser. DOM control is a key ingredient
    in controlling how the JS-Flash maps appear on the page.


    Since JavaScript is an ECMAScript language, there are some common abilities in
    other languages that follow this standard. Later in the book you will work with
    ActionScript, the language of Flash and the key ingredient in working with the
    ActionScript-Flash (AS-Flash) API.


    # Including External Code


    JavaScript can be coded in a standalone-file with extends. Using these files can
    limit the amount of JavaScript in your .html document and make it easier to maintain.
    You can add a .js file to your web page with a single line of code:


    ```

    <script type="text/javascript" src="javascriptToLoad.js"></script>

    ```


    When included in your web page, the js file is referred to as a library. JavaScript
    libraries are used in both the Ajax and JS-Flash APIs. Including them in the code
    makes available to all the classes and methods of the API. As you will see in
    the next chapter, including the JavaScript library for the JS-Flash API will ultimately
    cause the SWF of the Flash-generated map to be displayed.


    # Commenting Code


    With many languages, JavaScript provides a way to disable code. This is an important
    feature of development. If you are new to JavaScript, a lot of your first passes
    at will be the result of trial and error. You will need to master the art of commenting
    code as you try different ways to do things and repeat code throughout your first
    set of classes and the application you develop.


    Commenting is very important when you work on code that will be shared with other
    developers. It gives you a way to tell developers what you were doing and why.
    It is good practice to leave comments before each of variables as well as each
    function. Good third-party JavaScript editors change code to a shade of gray when
    it is commented out. This is a very helpful feature as it helps identify and ignore
    unused sections of code.


    There are two ways to comment out code in JavaScript. The first uses two slashes
    like this:


    ```

    //This line is commented out.

    This line is not.

    ```'
