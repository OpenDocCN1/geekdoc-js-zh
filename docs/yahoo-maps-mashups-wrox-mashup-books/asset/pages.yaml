  md: '# Chapter 3


    ![](img/ee60aed724e0f9d7a7d4fc463e96b52a_52_0.png)


    With Ajax, many interactive elements are handled this exact way. The Ajax API,
    for example, displays within a div tag. Much of the dynamic data and subtle animation
    and popups you saw in the Ajax examples earlier in this chapter used code like
