    # # Get Started with the JS-Flash API


    It is time to get immersed in JavaScript and start developing with the JavaScript-Flash
    (JS-Flash) API


    This chapter discusses


    +   - The steps for getting an application ID — in case you don''t have one yet

    - The software requirements for developing with the JS-Flash API

    - How to embed the API and its library of classes

    - Setting the initial properties of the map when it loads for your users


    # ## Get an Application ID


    If you have already completed one of the other sections of the book, be it the
    JS Flash API or the ActionScript-Flash (AS-Flash) API, then you will already be
    familiar with these steps. Otherwise, this step is a critical and needs to be
    completed so you can properly develop with the map APIs.


    The first step to achieving greatness is to register an application ID with the
    Yahoo! Developer Network. This free is a string of your choice, used by YDN to
    track usage of all Yahoo! web services. Since the ID is tied to your Yahoo user
    ID, it also enables you to track your own API''s usage and gauge the total traffic
    it has generated.


    If you already have registered an AppID, you can register a new one for each API
    you need. Here are the steps to getting your Yahoo! AppID:


    +   1. Open your browser and go to http://api.search.yahoo.com/webservices/register_application.


    +   2. You may be prompted to log in with your Yahoo! user account. If you do
    not have an account, you will need to get one as instructed.'
