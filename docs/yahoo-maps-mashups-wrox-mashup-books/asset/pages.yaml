  md: '# Get Started with the Ajax API


    It is time to get immersed in JavaScript and start developing with the Ajax API


    This chapter discusses


    +   - The steps for getting an application ID (in case you don’t have one yet)

    - What the software requirements for developing with the Ajax API are (or aren’t
    more like it)

    - How to embed the API and its library of classes

    - Setting the initial properties of the map when it loads for your users


    # Get an Application ID


    If you have already completed one of the other sections in the book, be it the
    JS Flash API or the AS Flash API, you will already be familiar with these steps.
    Otherwise, this step is a critical one and needs to be completed so you can properly
    develop with the map APIs.


    The first step to achieving mashup greatness is to register an application ID
    with the Yahoo! Developer Network (YDN). This free ID is a string of your choice,
    by YDN to track usage of all Yahoo! web services. Since the ID is tied to your
    Yahoo! user ID, it enables you to track your own API’s usage and gauge the total
    traffic: it has generated.


    If you already have registered an AppID, you can still register a new one for
    each API you will use. Here are the steps to getting your Yahoo! AppID:


    +   - Open your browser and go to http://api.search.yahoo.com/webservices/register_application.'
