  md: "# Chapter 3\n\nThe key to most Ajax-based applications lies in the JavaScript\
    \ XMLHttpRequest. This object enables server communication to occur within the\
    \ browser and is commonly referred to as the Ajax engine. Rather than the browser\
    \ submitting data and refreshing with the server's response, this object handles\
    \ all the work. The flow looks like this:\n\n+   1. HTML loads a form, which is\
    \ displayed with JavaScript and CSS.\n2. The user fills out the form and submits\
    \ it.\n3. Ajax submits the data and receives the response.\n4. The JavaScript\
    \ receives the response with CSS, without refreshing the browser.\n\nXMLHttpRequest\
    \ is constructed in JavaScript in your HTML document. There is one quirk in the\
    \ process that needs to be noted. Microsoft's Internet Explorer does not use the\
    \ native object; rather it uses an ActiveX version of it called XMLHTTP. When\
    \ coding it, you can use the window object to determine how the XMLHttpRequest\
    \ object can be.\n\n```\nvar xmlhttp = null;\nif (window.XMLHttpRequest) {\n \
    \ xmlhttp = new XMLHttpRequest();\n} else if (window.ActiveObject) {\n  xmlhttp\
    \ = new ActiveXObject(\"Microsoft.XMLHTTP\");\n}\n```\n\nThis script checks for\
    \ the native object support. If it is not, the application will assume the browser\
    \ is Internet Explorer and set the object to the Microsoft.XMLHTTP object. The\
    \ next step is to create the:\n\n```\nxmlhttp.open('GET', url, true);\nxmlhttp.send(null);\n\
    ```\n\nThe url acts as a placeholder where the actual web service or API URL is\
    \ placed. You can begin to see how the internal handling of the Ajax call is formed.\
    \ Finally, it is time to handle the returned data. The XMLHttpRequest returns\
    \ data using an event handler called onreadystatechangechange.\n\n```\nxmlhttp.onreadystatechange\
    \ = function() {\n  if (xmlhttp.ReadyState == 4 && xmlhttp.status == 200) {\n\
    \    // do something with the results\n  } else {\n    // wait for the call to\
    \ complete\n  }\n}\n```\n\nUsing built-in properties, it is easy to check the\
    \ status of the response. This example is very basic and you will find this and\
    \ other slight variations at the core of many Ajax applications. In the next chapter\
    \ you will learn how to construct and implement Ajax when using the Yahoo! Maps\
    \ API."
  merge: -1
  pgno: 50
- img_proc: true
  md: "# Fundamentals of CSS and HTML\n\nCSS is a means of defining style for laying\
    \ out HTML in the browser. The standard was designed to address the layout and\
    \ appearance limitations of native HTML. Style sheets let you define sets of styles\
    \ as classes in a style tag. These styles can be referenced and applied throughout\
    \ your HTML.\n\nWithin the sets of styles you will find properties like color,\
    \ width, height, font weight, and several other style attributes. Style sheets\
    \ can be coded within the HEAD tag of the HTML code. If you are looking to apply\
    \ the same style classes to multiple HTML documents, you can centralize the CSS\
    \ in its own file and reference it from any HTML document. This enables you to\
    \ maintain one file for your site or web application.\n\nWhile styles can be referenced\
    \ in everyday HTML tags, they are more frequently used with tags like span and\
    \ div. These tags are part of HTML (Dynamic HTML), a slight modification to the\
    \ language that allows for dynamic handling of web content. Text tags build containers,\
    \ which are elements that exist on the web page, over or outside the boundaries\
    \ of regular HTML. These containers rely heavily on CSS for positioning and appearance.\n\
    \nThe syntax of CSS can be tricky, it is easy to get the hang of. This example\
    \ shows how CSS and HTML are used to position the DIV container for the Ajax API:\n\
    \n```\n<html>\n<head>\n<style type=\"text/css\">\n#container {\n  position: absolute;\n\
    \  left: 100;\n  top: 100;\n  border-style: solid;\n  border-color: #FF0000;\n\
    \  border-width: medium;\n}\n</style>\n</head>\n<body>\n<div id=\"container\"\
    >\n  This is a positioned DIV container.\n</div>\n</body>\n</html>\n```\n\nThe\
    \ combination of CSS and HTML in this sample will create a small rectangle that\
    \ appears 100 by 100 pixels from the top-left corner of the browser. The rectangle\
    \ has a sharp red border and displays the text within. As you can see, all the\
    \ style sheet properties are inherited when the div tag references container in\
    \ its id attribute. See Figure 3-1."
  merge: -1
  pgno: 51
