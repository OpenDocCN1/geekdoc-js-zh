    # # API Classes in Depth


    Now that you are familiar with the fundamentals of the AS-Flash API, it is time
    to learn the more advanced features available. In the last chapter you learned
    how to control the map using most of the API methods. In this chapter you will
    discover how to add functionality to the map API. Combining the fundamentals and
    the examples you build with elements like tools, widgets, overlays and will lead
