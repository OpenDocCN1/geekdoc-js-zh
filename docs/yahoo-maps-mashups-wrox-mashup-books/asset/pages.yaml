  md: "# Chapter 20\n\nTwo events are broadcast when the zooming is engaged in the\
    \ API EVENT_ZOOM_START is fired when the API starts zooming and EVENT_ZOOM_STOP\
    \ is sent when the API has completed zooming.\n\nYou can set the zoomLevel with\
    \ user interaction. You can design buttons to increase or decrease the zoom level\
    \ of the map. You can combine these buttons with a slider, ranging from 1 to 16,\
    \ to create a zoombar. In Chapter 16, \"AS-Flash API Advanced Features,\" you\
    \ learned how to use the NavigatorWidget, an interface that carries a zoombar\
    \ with useful tools to help users navigate your map.\n\nRefer to the base application\
    \ you developed in the last chapter to see a fully integrated example of setZoomLevel.\n\
    \n# setCenterByPointDelta(point, duration)\n\nsetCenterByPointDelta() is a unique\
    \ method of recentering the map that lets you use other relative points on the\
    \ stage. A point is a pixel coordinate defined by an x/y position. The first parameter\
    \ of this method is not a point on the map, a latitude/longitude coordinate, but\
    \ rather the total difference of points within the map tile matrix.\n\nKeep in\
    \ mind that you are not moving to a specific point. You are moving the difference\
    \ of x/y from your current position. In other words, if you used this method to\
    \ pan the map to the right 20 pixels and down 30 pixels, you would pass a point\
    \ value of (-20, -30). Essentially, the map's center moves up and to the left,\
    \ relative to the area and to the bottom.\n\nUsing this method, you can have the\
    \ map pan over to other elements added to the map application. This can be design\
    \ elements added programmatically or via the visual adding methods you learned\
    \ in the last chapter. This method can be used with markers. (Examples in the\
    \ chapter will explore these possibilities.)\n\nThe point parameter of this method\
    \ works similarly to how the latlon parameter related to the Laton object in setCenterByLat()\
    \ and setCenterAndZoom(). The point is not a number or Laton object, but a point\
    \ object. To properly pass this value, you must call the Point class. Unlike the\
    \ Latin class, which is packaged with the API, the Point class is available as\
    \ part of the Flash MX package. Here is how to properly call the setCenterByPointDelta()\
    \ method by creating an instance of Point first.\n\nFor the Flex client:\n\n```\n\
    var point:Object = new mx.graphics.Point(100, 100);\nvar duration:Number = 3000;\n\
    ```\n\nmapConnector.setCenterByPointDelta(point, duration);\n\nFor the MapConnector\
    \ class:\n\n```\npublic function setCenterByPointDelta (point, duration:Number):void\n\
    {\n  send(\"_flashClient\",\"setCenterByPointDelta\", \\{ point :point\\nduration:duration\
    \ \\}\\});\n}\n```\n\n278"
