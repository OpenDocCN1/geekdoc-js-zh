    \ tied into a user interaction. The XML returned will ultimately generate markers\
    \ on your map application.\n\nThe code that follows is an example of a REST query\
    \ and a response in the Yahoo! Search API:\n\n```\nhttp://api.local.yahoo.com/LocalSearchService/V3/LocalSearch?appid=WroxyYahooMaps&query=pizza&zip=60609&results=1\n\
    ```"
