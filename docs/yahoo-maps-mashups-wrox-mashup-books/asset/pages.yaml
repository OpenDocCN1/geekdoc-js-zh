    # # Working with Overlays


    An overlay adds a new layer over the existing map layer. It moves along with the
    map as the map is panned. Overlays are most commonly used as containers for sets
    of markers representing related data such as local searches and traffic.


    As you will see, the overlays have the incredible ability to act as their own
    mashups. The overlay classes will actually request data, parse the response and
    add markers all by itself. It is good to test out each overlay, as it may save
    you some time as well as even more functionality to what you ultimately build.


    # # Overlay Methods and Classes


    Adding an overlay is simple and will enable you to display and explore a wealth
    of data. Included in the Ajax API are several overlay classes that will let you
    deliver useful common data as well as custom, one-of-a-kind sets of information.'
