  md: '# Advanced Features: Flex 2 Using the AS-Flash API


    # Tool Classes


    Tools offer a mixed bag of functionality. On the one hand you have the pan tool,
    representing probably the most used feature of any map you will build. On the
    other hand is the CustomSWFTool, which represents what is likely the least used
    yet most creative way to engage your users with your map application.


    # Overlay Classes in Review


    +   - PanTool adds the all-important feature of letting the user drag the map
    and pan it. Because the tool activates a feature within the map instance itself,
    some events are associated with that work with the map discussed earlier in the
    chapter. The EVENT_DRAG_START and EVENT_DRAG_START methods track the dragging
    and are not to be confused with EVENT_PAN_START and EVENT_PAN_STOP. To effectively
    listen to these, you must listen to the tool instance.

    - CustomSWFTool provides you with a way to extend the interactivity of the map
    into more engaging tools. Like the pan tool, this relies on mouse interaction
    to engage the user. With other custom SWF classes discussed in this chapter (CustomSWFMarker
    and CustomSWFOverlay), to take advantage of this feature, you will need to build
    your own SWF and add it to the map using the methods local to this class.


    # Working with Markers


    You can''t create a mash without adding markers. Markers are the indicators of
    important locations on your map. They are added with precision by address or latitude/longitude.
    In addition to methods, there are ways to remove markers programmatically based
    on user interaction. Marker classes enable you to define the type of marker you
    add, by these standard markers or markers you can design and develop from scratch.


    You can add markers one by one as well as by loading certain overlays. If with
    a database, XML file, web-service response or other data source with many addresses
    or latlon, you will likely be using a looping method like for/each to add markers.


    # Marker Methods


    This set of methods represents the most commonly used functions in mashups: adding
    markers. Each method lets you control the location and appearance of every marker
    you add on the map.


    # addMarkerByAddress()


    This method adds markers to a location using an address.


    ```

    mapInstance.addMarkerByAddress(markerClass:Class, address:String, data:Object);

    ```


    The markerClass parameter defines what type of marker you are adding. To successfully
    add a marker, you must import the class of the type of marker you reference in
    this parameter. The types of markers, reviewed in the following sections, have
    uniqueness and presentation attributes.'
