- img_proc: true
  md: '# The AS-Flash Mashup


    The goal of this chapter is to build your first Yahoo! Maps ActionScript-Flash
    (AS-Flash)-based mashup. To achieve this, you will also accomplish the following:


    +   - Establish an idea for your mashup and plan out the key details and development
    approach

    - Successfully lay out an easy interface using the Flash IDE''s visual authoring
    capabilities

    - Learn how the HotJobs web service will work with the maps API

    - Create a new class to handle the web service request and parse the response
    XML data

    - Code the user interaction to formulate a request and display the results as
    markers on the map


    # Time to Mash Up


    Now that you have learned all the methods and classes of the AS-Flash API, it''s
    time to build a solid mashup. With the other APIs featured in this book, this
    chapter will guide you through building a mashup with a data source and the map
    API.


    These aren''t the only ingredients you need. Your creativity is the third ingredient.
    Because this is the AS-Flash API, you will have a lot of opportunities to put
    that creativity to use. As you have learned, the AS-Flash API benefits from the
    Flash IDE''s visual authoring abilities. This means you will be laying out the
    map and other interface elements by physically dragging and dropping them. Instead
    of laying elements programmatically, as required by the AJAX, JavaScript-Flash
    (JS-Flash) and Flex APIs, this API lets you drag and drop elements freely with
    precision.


    This approach may take a little longer. In the end, the time could be worth it,
    as you will create one-of-a-kind elements that only your mashup will feature.
    Because not everyone is an artist, this chapter will guide you in setting up a
    simple layout first. More advanced visual elements will be suggested at the end
    of the chapter.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Chapter 17


    # The Big Idea


    As I mentioned earlier, Yahoo! Maps APIs are true "gateway" APIs. Once you start
    using the map API, you will be looking for another API or web service to map it
    up. So much is available that it can be difficult to choose a starting point.
    Once you get your first data source mashed up, it will be much easier to add the
    next.


    For this mashup, you will combine the AS-Flash API with the Hot Jobs web service.
    Hotjobs is Yahoo''s job listing site. Its web services make a comprehensive list
    of listings around the world. What makes Hotjobs so easy to mash up is that every
    job has a location. In other words, Hotjobs are location based, making them easy
    to integrate with the map API with no additional data.


    With job data and a map, you will create a mashup that lets users enter in a job
    keyword. The results of the search will be converted into location-based job listings.
    These listings can be displayed on the map as individuals with job title and additional
    details. If it sounds easy, that''s because it is.


    In determining your mashup, it is good to pick something that will be easy and
    attractive to the reader. Putting data on a map lets you generate a unique perspective.
    If you are working with job descriptions, it makes for interesting opportunity
    to show where in the country you can find the largest offers of a particular type
    of job. Seeing markers representing individual jobs clustered together convey
    where just you can find a concentration of opportunities in a specific field.


    # Planning and Approach


    With any application, planning and approach are important. It helps to know the
    APIs and web services you are working with very well. Having completed the previous
    chapters on the AS-Flash API, you should have all you need to work with the map.
    Later in this chapter, you will examine the Hotjobs web service, how the request
    is constructed and what data to expect returned upon a successful request.


    Before coding, it is always good to lay out your objectives and then determine
    how best you will achieve them. Begin with thinking what your application mashup
    should achieve. Through the rest of the chapter, you will see how these steps
    are developed into the mashup.


    +   1. Display the map initially.

    2. Let the user enter search criteria.

    3. Request the data when the user submits it or her criteria.

    4. Receive the data.

    5. Display the data as markers on the map.


    What you see listed here is a simple flow and this pattern of user interaction
    should be easily replicated with other APIs and web services. The mashup in this
    chapter will work with job data, so the criterion will be a keyword for job title
    or description. With another web service that criterion could easily change to
    a keyword for travel destination, weather report or concert lookup.'
  merge: -1
  pgno: 252
