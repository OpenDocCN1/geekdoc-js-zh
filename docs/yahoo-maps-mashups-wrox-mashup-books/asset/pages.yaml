  md: '# The AS-Flash API


    APIs are ultimately the methods they expose to developers. What APIs enable developers
    to do is reach into the application and access those methods that have been made
    accessible. While there are many methods within an application itself, to keep
    APIs simple, only the most effective methods are made available and documented
    to develop against.


    As the API is explored further, you will see that it is through methods that the
    APIs are enabled. This is an important function of methods as they are able to
    carry forth the actions to set in motion by user interaction.


    # The Trace( ) Method


    In every language there is a way to debug code as you develop. Flash is different,
    and its version of the traditional Echo command is the trace() method. When using
    this method, you can trace out values as you compile the code and run the application.
    Tracing becomes very valuable in checking values of variables, as they are set
    dynamically.


    When you are developing maplashes, tracing is effective in determining latitude/longitude
    values as the map''s center points. Often, you will want to add a trace statement
    within an event handler, so you know the timing of certain events in your application.
    Later in this chapter, the example will use trace a lot to verify user entry and
    interaction with the map.


    The output stream of the trace method is picked in Flash and displayed in an output
    window. When you are compiling the application, if trace() is called, the output
    window will open automatically and display the data. There are third-party output
    listeners that have been developed to work outside the Flash IDE. It is best practice
    to remove or "comment out" all trace calls before launching your application for
    public use.


    # Components


    The AS-Flash maps API is distributed as a component. Components in Flash are prepackaged
    applications. Shipped with the Flash IDE are numerous components, intended mostly
    to support you in rapidly deploying RIAs. Some examples of out-of-the-box components
    shipped with the Flash IDE are ComboBox, TextInput, DataGrid and ScrollPane.


    In addition, some components support media playback for FL and MP3 files. Also
    included components supporting supporting development with XML and web services.
    Adobe has also released components to support remote platform technologies. Flash
    Communication Server leverages components that display web cameras and streams
    events. Flash Removing components include a component to enable removing services,
    as well as a debugger.


    Components are intended to enable developers to build and package a reusable application
    using a common architecture. Once the application is built, developers can share
    and distribute their components. This gives others the ability to install and
    drop into their existing applications the variety of functionalities components
    (see Figure 13-5).


    Channels like Adobe''s Developer enable developers to upload their components,
    offer them for free or even sell them. Browsing through the wide offering of components,
    you will see everything from dynamic charting to animation effects to e-commerce.
    Well-established developers and develop-ments package and sell their own components
    as well as the consulting needed to implement them.'
