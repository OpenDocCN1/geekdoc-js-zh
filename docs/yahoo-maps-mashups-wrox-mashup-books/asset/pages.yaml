  md: '# The AJAX API


    The AJAX API shares two key benefits with the JavaScript Flash API (covered from
    Chapter 8, "The JS-Flash API" through Chapter 12, "The JS-Flash Mashup"). First,
    since Yahoo! hosts the class files, you can always access the latest version of
    the API by including it in your application the API libraries. This means that
    you can always access to the latest classes and code to offer your users, simply
    by modifying the version number in the JavaScript s tag. To keep up with the latest
    version, as well as the changes it features, visit http://developer.yahoo.com/maps/


    Finally, the AJAX API is a very effective means of building map mashups, as it
    does not require the purchase of coding software or server technology to work.
    In the simplest form possible, you can actually edit the files using Notepad and
    load them locally with your Internet browser. This is very convenient for someone
    who is not a web developer by trade and wants to get started map-based web pages.


    # Summary


    This chapter introduced the AJAX API with the following key concepts:


    +   - Ajax is not a language, rather than an approach combining web technologies
    including JavaScript, CSS and HTML.


    +   - JavaScript consists of a simple syntax that enables you to work with functions
    and events.


    +   - The XMLHttpRequest object is what enables AJAX to work. It is instantiated
    differently in Internet Explorer and in other browsers.


    +   - The Yahoo! Maps API inherits the benefits of the Ajax approach, allowing
    a faster experience than is provided by the typical HTML documents.'
