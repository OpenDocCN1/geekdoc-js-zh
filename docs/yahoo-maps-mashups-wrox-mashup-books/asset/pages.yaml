    {\n  //Add the PanTool to the map instance\n  myMap.addTool(new PanTool(), true);\n\
    \n  //Send event via local connection\n  connectedMap.send(\"*flexClient\", \"\
    mapInitialized\");\n\n  //Listen for getCenter from local connection\n  connectedMap.getCenter\
    \ = function ()Void {\n    //Save getCenter value to mapCenter variable\n    var\
    \ mapCenter = myMap.getCenter();\n\n    //Send event getCenter with mapCenter\
