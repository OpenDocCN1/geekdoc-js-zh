  md: '# Chapter 21


    SatelliteControlWidget: The satelliteControlWidget class attaches three predesigned
    buttons to the map that allow users to toggle among the map view types. Once again,
    this is a great alternative to creating and coding your buttons if time is important.
    These buttons are set to detect the existing map view and will reflect that by
