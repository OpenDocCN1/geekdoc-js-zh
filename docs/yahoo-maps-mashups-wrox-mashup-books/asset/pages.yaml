  md: '# The Flex 2 Mashup


    +   5. Display the data as markers on the map based on user selection.

    6. Play the video clip based on user selection.


    This is a simple flow and this pattern of user interaction should be easily replicated
    with other APIs and web services.


    # The Flex Client


    For this project, it is best to reverse the order of construction of your application.
    You will recall that in previous chapters the order of completion for the Flex
    2/AS-Flash API project was to build Flash client SW first. That was followed by
    the local connection MapConnector class, and then you built the Flex client to
    route out.


    Since you will be defining your own data in this mashup, it is time to start developing
    the Flex client as that is where the data you will reside. Another reason to start
    with the Flex client is to use the user controls first. Since layout and user
    interaction are such a factor in your mashup, you will need to establish these
    pieces before using the supporting code for the actual map. As you''ve learned
    in the last few chapters by using the Flex 2/AS-Flash API approach, while the
    map is still contained in the Flex client, user-interaction controls are written
    in the MXML as part of the Flex client.


    # Architect the MXML


    As you have done with mashups in this, it is now time to architect the mashup.
    Starting with MXML, and repeating for each of the three pieces of the application,
    this will help you think out your project before coding it. Here are the ingredients
    for developing the Flex client MXML for this mashup:


    +   1. Import all classes that the map will need.

    2. Structure the data that will be mashed up. Since you will be providing your
    own data, it can be hard-coded within the application code.

    3. Add the interaction and display elements.

    4. Code the event handler.

    5. Call the method in the local connection, passing along the necessary values.


    # The Data


    Defining your own data when building a mashup has some nice advantages. The obvious
    is that you do not have to gain knowledge or adapt to the data format from an
    external source. You can skip some of the steps necessary in building previous
    mashups, exploring the data source. Another is that the data will always be there,
    as they load with the application. This simply means that you do not need to connect
    to an external data source, trusting that the connection and access information
    are there, to populate your mashup.


    307'
