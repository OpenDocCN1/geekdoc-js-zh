    instance is created: You will see that both the path to the customSWFTool and
    the customSWFIcon are set. When you create your own tools, these names will change
    to whatever you call your functions.


    Lastly, the ToolbarWidget instance is added. The widget will present and display
    their icons in the order in which they were added in the code. By default the
    first tool will be selected, while the other(s) will be disabled and inactive.


    # Working with Markers


    You can''t create a mashup without adding markers. Markers are the indicators
    of important locations on your map. They are added with precision by address or
    latitude/longitude. In addition to methods, there are ways to remove markers programmatically
    based on user interaction. Class markers enable you to define the type of marker
    you are adding, to be standard markers or you can design and develop from scratch.


    You can add markers one by one as well as loading certain overlays. If you have
    a database, XML file, web-service response or other data source with many addresses
    or latlon coordinates, you will likely use a looping method like for/each to add
    markers.


    # Marker Methods


    This small set of methods represents the most commonly used functions in mashups:
    adding markers. Each marker lets you control the location and appearance of every
    marker you add to the map.


    # addMarkerByAddress()


    This method adds markers to a location using an address.


    ```

    mapInstance.addMarkerByAddress(markerClass:Class, address:String, data:Object);

    ```


    The markerClass parameter defines what type of marker you are adding. To successfully
    add a marker you must import the class of the type of marker you reference in
    this parameter. The types of markers, reviewed in the following sections, have
    unique functionality and presentation attributes.


