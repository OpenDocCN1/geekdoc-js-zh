  md: '# The AS-Flash API


    The stage in the Flash IDE is where graphic, text and movie elements, called symbols,
    can be arranged on the stage. In designing interfaces like forms, the stage authoring
    environment offers an unparalleled means of laying out elements as you want your
    users to see them. By altering a symbol''s properties, or using one symbol-manipulation
    tools in the toolbar, you can adjust size and attributes as well as coloring.
    Other visual authoring abilities include alignment and depth alterations, which
    enable you to choose which elements appear behind.


    The stage (shown in Figure 13-1) allows for drag-and-drop placement not just of
    symbols that you create, but of other library elements as well. Components, discussed
    later in this chapter in more depth, and library elements are distributed as a
    component that you can easily add to your application by dragging it onto the
    stage after installing it. This is the simplest way to get up and running and
    will be reviewed in Chapter 14, "Get Started with the AS-Flash API."


    ![](img/ee60aed724e0f9d7a7d4fc463e96b52a_171_0.png)


    Figure 13-1


    # Working with Layers and Depth


    An important aspect of the authoring tool in Flash is the layer. Layers enable
    you to manage the depth of a symbol as it is placed on the stage. For example,
    you place the map component on the stage. Maybe, as part of your mashup, you want
    to cover a certain part of the map to add an effect to it. You need to add symbol
    to the layer above. Layers are managed in the timeline panel above the stage.


    Layers also enable you to manage sets of symbols. If you drop symbols on one layer,
    clicking that layer in the timeline panel will select all symbols. You can then
    move the symbols around and them their movement will be collective. This feature
    also enables you to modify properties of several symbols at a time without selecting
    each individually. Working with several layers can be tricky, as symbols can become
    buried and become difficult to access as they are buried under other symbols.


    Another benefit to using layers is the ability to mask. Masking is a way to define
    a viewable space of the stage with another symbol. It is a feature that doesn''t
    appear too often in map mash applications, but is definitely worth knowing about.
    Interestingly, the Flash map APIs actually work with a built-in mask. Since the
    tiles loaded in the map exceed the space you see, a mask is set to make only a
    certain area of tiles visible.'
