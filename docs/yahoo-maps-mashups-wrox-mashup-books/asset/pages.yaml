    # setCenterByPointDelta(point, duration)


    setCenterByPointDelta() is a unique means of recentering the map that lets you
    use other relative points on the stage. A point is a pixel coordinate defined
    by an x/y position. The first parameter of this method is not a point on the map,
    like a latitude/longitude coordinate, but rather the total difference of points
    within the map tile matrix.


    Keep in mind that you are not moving the map to a specific point. You are moving
    the difference in x/y from its current position. In other words, if you were using
    this method to pan the map to the right 20 pixels and down 30 pixels, you would
    pass a point value of (-20, -30). Essentially, the map''s center moves up and
    to the left, revealing more area to the bottom and to the right. Figure 15-3 shows
    how x/y points are resolved relative to the center of the screen.


    ![](img/ee60aed724e0f9d7a7d4fc463e96b52a_200_0.png)


    Using this method, you can have the map pan over to center on other elements added
    to the map application. These can be design elements added programmatically or
    via the visual authoring methods learned in the last chapter. This method can
    be used with markers. (Examples later in the chapter will explore these possibilities.)


    The point parameter of this method works similarly to how the latlon parameter
    related to the Latlon object in setCenterByLatLon() and setCenterByAddressZoom().
    The point is not a number or Latlon object, but a point object. To properly pass
    this value, you must call in the Point class. Unlike the Latlon class, which is
    packaged with the API, the Point class is available as part of the Flash MX package.'
