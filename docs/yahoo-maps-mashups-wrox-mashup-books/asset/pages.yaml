  md: '# Basic Methods: Flex 2 Using the AS-Flash API


    # How It Works


    The button presses an event that prompts the Flex client to call theCenter method
    on Map Connector_getcenter, representing the local connection. The method is passed
    through the local connection, where it is picked up by the Flex client. In the
    SWF, getCenter is now called again the API instance.


    The returned data from getCenter are saved and wrapped up as data that are passed
    in an event to the local connection. MapConnector_getCenter fields the data and
    passes them in a final call to the registered client.


    # Additional Methods of the AS-Flash API


    In addition to getCenter(), you can use the following get methods to retrieve
    data from the map instance. You can easily replicate the method you just completed
    for these get methods:


    +   - getZoomLevel0: The getZoomLevel() method lets you obtain the current zoom
    level of the map. It can be used to adjust a custom zoom or zooming interface
    that you have created. As you will see in the next chapter, knowing the current
    zoom level plays a key rule in using overlays and custom features of the API.


    +   - getCurrentMapView0: You want to call getCurrentViewType() to determine what
    tiles the map is currently displaying. This is useful if you have created your
    buttons that let your users toggle map views. You may also include some effects
    in your application that activate depending on what layer is currently being displayed.


    +   - getMapView0: This method is most useful if you want to create your own map
    view buttons. Letting your users choose their map view can add a hint of customization
    to the application. Not to mention that being able to display satellite images
    of the world, from space all the way down to street level, is quite an enticing
    feature that will draw users to mashup.


    # Summary


    This chapter introduced you to several of the basic methods available in the AS-Flash
    API when used with Flex 2. The two major examples represent big steps that you
    have taken in creating your mashups.


    In the next chapter you will be reintroduced to the more advanced methods and
    classes of the AS-Flash API. This time, you will learn how to adapt these methods
    to work with the Flex client, MapConnector local connection class and Flash client.'
