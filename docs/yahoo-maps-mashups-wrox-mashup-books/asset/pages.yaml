    # Fundamentals of CSS and HTML


    CSS (Cascading Style Sheets) is a mean of defining style for laying out HTML in
    the browser. Style sheets were designed to address the layout and appearance limitations
    of native HTML. Style letters define sets of styles as classes within a style
    tag. These styles can be referenced and applied throughout your HTML.


    Within the sets you will usually find properties like color, width, height, font-weight,
    font-style and other style attributes. Style sheets can be coded within the head
    of the HTML. If you are looking to apply the same classes to multiple HTML documents,
    you can centralize the CSS in its own file and reference it from any HTML document.
    This enables you to maintain one file for your site or web application.


    While can be referenced within every HTML tags, they are more frequently used
    with tags like span and div. These tags are part of HTML (Dynamic HTML), a slight
    modification to the language allows for more dynamic handling of web content.
    Tags build containers, elements that exist on the web page outside, within, over
    or outside the boundaries of regular HTML. These containers rely heavily on CSS
    for positioning and appearance.


    The syntax of CSS can be tricky, but is easy to get the hang of. This example
    shows how CSS and HTML are used to position the DIV container for the JS-Flash
    API:


    ```

    <html>

    <head>

    <style type="text/css">

    #container {

    position: absolute;

    left: 200;

    border-style: ridge;

    border-color: #FFFF00;

    border-width: medium;

    }

    </style>

    </head>

    <body>

    <div id="container">

    This is a positioned DIV container.

    </div>

    </body>

    </html>

    ```'
