    3. The map pans based on the duration, in milliseconds, defined in the duration
    parameter.

    4. The map centers on the resolved latitude/longitude coordinate.

    5. The map zooms to the level defined with the zoomLevel parameter.


    Common usage of this method looks like this:


    ```

    ```

    var address:String = "Casablanca"

    var zoomLevel:Number = 6;

    var duration:Number = 3000;


    myMap.setCenterAddress(address, zoomLevel, duration);

    ```

    ```


    The first three lines define and resolve the variables to pass into the method.
    The final, the method is called. Note that zoomLevel is passed between address
    and duration.


    # mapGeocodeSuccess, mapGeocodeError


    There are useful events fired when setCenterAddress() and setCenterByAddressZoom
    are called. EVENT_MAP_GECODE_SUCCESS is dispatched when the API has successfully
    geocoded the address passed in and has resolved to a latitude/longitude coordinate.
    If the address cannot be geo-coded, the EVENT_MAP_GECODE_ERROR is broadcast.


    If the latter happens, an array of suggested addresses will be sent as a data
    object with this event along with the originalAddress. You can use the message
    attribute returned with this event to alert users to try a new address or select
    from a suggestion. Since international geo-coding recognizes many varieties of
    cities, it is difficult to generate a geo-code event.


    # setCenterByLatLon()


    If you know the latitude/longitude coordinate you want to center the map, you
    can use setCenterByLatLon(). A major benefit of this method is that it executes
    more quickly than setCenterByAddress(). The reason for this that this method does
    not need to geo-code an address and resolve a latitude/longitude because it already
    knows the latitude/longitude.


    setCenterByLatLon() also accepts the duration parameter. Because there is no conversion
    between address and lat/lon, the panning effect will engage you more quickly.


    ```

