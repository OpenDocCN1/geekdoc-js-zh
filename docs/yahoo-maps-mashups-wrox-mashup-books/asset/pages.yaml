    # Map Type Methods and Events


    The Ajax API considers the map type to be of the tiles being loaded. You may recall
    an example in the last chapter that set the map type so the map would display
    satellite tiles. The Ajax API supports three types of tiles: regular (YAHOO_MAP_REG),
    satellite (YAHOO_MAP_SAT) and hybrid (YAHOO_MAP_HYB). Hybrid tiles are a combination
    of regular and satellite tiles.


    # setMapType()


    The setMapType() method accepts one parameter, the view type to which you want
    to set the map. Here is how you should call:


    ```

    var newMapViewType = "YAHOO_MAP_SAT";nmyMap.setMapType(YAHOO_MAP_SAT);

    ```


    This call will change the map type to satellite, refreshing the map with new tiles
    reflecting its location. In the next chapter you will discover the TypeControl,
    a prepackaged interface that achieves the same result.


    # getCurrentMapType()


    You want to call getCurrentMapType() to determine what tiles the map is currently
    displaying. This is useful if you have created your own buttons to let your users
    toggle between map views. You may also include some effects in your application
    activating on what layer is currently being displayed.


    ```

    mapInstance.getCurrentMapType();

    ```


    This method could reveal, based on changing the initial set or by user interaction,
    the map is now displaying satellite tiles instead of the default tiles:


    ```

    var currentMapType = map.getCurrentMapType();

    alert(currentMapType);

    // Outputs: "YAHOO_MAP_SAT";

    ```'
