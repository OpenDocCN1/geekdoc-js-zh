  md: '# Chapter 15


    # # How It Works


    This example is the largest by far for the AS-Flash API to this point. Hopefully
    it is not too challenging, as you should recognize the pattern now that makes
    the AS-Flash API so easy to code with. The creation of every example in this chapter
    has started with importing classes, declaring variables and handling EVENT_INITIALIZE.


    When you are developing an example of this size, it is a good idea to think about
    lay out the steps of developing your idea. In this case, the challenge is to create
    dynamic buttons. Steps like these help to understand what you will need to do
    to code such an application:


    +   1. Create an instance of the map API.

    2. Upon initialization, get and store all map view types available.

    3. Create a button for each map view type and label the button appropriately.

    4. Disable the button that reflects the current map view type.

    5. Change the map view type when the button is pressed, disabling that button
    and enabling the others.


    Breaking down the steps this way, you can now think about the code you will need
    to apply each task and behavior. The steps are routine—creating the instance of
    the map and handling its initialize event. However, to handle the getting and
    storing of map view types, you will need to pull in some ActionScript elements
    and combine them with a method you learned earlier in this chapter:


    ```

    // Array values from getMapViewTypes()

    _mapViewTypes:Array = new Array();

    ...

    // Store Array returned from calling getMapViewTypes()

    _mapViewTypes = map.getMapViewTypes();

    ```


    As you saw earlier in this chapter, you can use getMapViewTypes() to obtain a
    list of map view types available for the API. The return type for this method
    is an array and, to ultimately store the data from this method, you must declare
    an array. The array in the preceding example is when getMapViewTypes() is called.


    ```

    // Loop through length of Array storing map view types

    for (var i=0;i<_mapViewTypes.length;i++) {

    // Attach Button to stage, adding each one every 110 pixels

    var button = _main.setClass(Button, "button"+i,

    _main.getNextHighestDepth(),{x:110*i, y:10});

    // Set Button label to map view type

    button.label = _mapViewTypes[i];

    }

    ```


    Now that the map view types are stored in an array, you can loop through that
    list and create a button for each item in the array. The for/each loop is similar
    to the for/in loop you have already used.


