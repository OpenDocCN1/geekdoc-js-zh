    # Benefits of the Ajax API


    JavaScript, CSS and HTML working together as Ajax are very powerful. A solid understanding
    and implementation of JavaScript, combined with the Ajax Maps API, will enable
    you to build some great and innovative applications. Using Ajax, you will give
    your users an experience free of browser refreshing and interruption.


    The Ajax API also inherits the overall benefits of the Ajax approach. This includes
    no required plug-in, meaning that your users will never have to download a player
    prior to viewing your API-based map application or mashup. Another benefit is
    the Ajax API''s ability to handle data transactions quickly, giving your users
    a much smoother experience. With the amount of map tiles being loaded as your
    user parts and zooms, the ability of Ajax gives maps a welcome performance boost.


