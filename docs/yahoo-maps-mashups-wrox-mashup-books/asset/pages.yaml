    # Overlay Methods


    Just like widgets, tools and markers, overlays can be added and removed with a
    simple pair of methods. It is good practice, importing the overlay class, to create
    an instance variable for that new overlay.


    ```

    //Import LocalSearchOverlay

    import com.yahoo.maps.overlays.LocalSearchOverlay;


    //Create LocalSearch instance

    var localSearch = new LocalSearchOverlay();

    ```


