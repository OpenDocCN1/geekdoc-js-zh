    HotJobs web service, your mashup example will focus on the items at this point.
    When you load those items into an array, it can be looped through while you are
    working with the job.


    ```

    // Split item title to parse location

    var title_arr:Array = item_title.split(''-'');


    // Create marker instance with properties

    var marker:Object = (index:title_arr[0], title:title_arr[title_arr.length-2],
    description:hjDataArr[1], marker:0xFF0000, strokeColor:0xFFFFFF);

    // Add marker to map instance

    myMap.addMarkerByAddress(CustomPOIMarker(title_arr[title_arr.length-1], marker));

    ```


    The job is separated by hyphens, with the location of the job being displayed
    as the last element. Using split, you can separate a string by a specific character
    or characters. This method returns an array of each element split from that string.
    After creating the marker instance, with the properties of a CustomPOIMarker,
    it is finally to add the marker to the map. You will see in the last line of the
    preceding excerpt that you are adding the marker by address. Since the location
    of the job listing is the last element, you use the last element of the array
    by subtracting one the array''s length. This trick gives you the element as the
    address.


    # Enhancing the Mashup


    While the steps and code provided in this chapter give you a solid mashup, it
    is just a start. There are many ways to enhance both the code and presentation
    of your AS-Flash API-based mashup.


    Within the code itself, there are several things you can do to scale the application.
    Here are some suggestions:


    +   - Experiment with different component events, changing user interaction to
    make it more intuitive.

    - Add more options enabling the user to control the map. Add items like NavigatorWidget
    or SatelliteControlWidget, create a custom zoombar of your option.

    - Develop your own CustomSFMarker to display the job listing information in a
    new way. With a custom marker, you can expand the marker beyond its capacity to
    feature a better-formatted job description.

    - Try swapping out the HotJobs web service with other compatible data.'
