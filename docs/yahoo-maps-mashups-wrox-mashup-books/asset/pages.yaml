  md: '# Chapter 5


    # endMapDraw


    This event is fired when the map completes redrawing as a result of drawZoomAndCenter.
    In addition, since the methods call for zooming to, the changeZoom event may also
    be fired if the method calls for a zoomLevel change.


    ```

    yEvent.Capture(map, EventsList.endMap, onMap);

    ```


    This code will listen to the map instance for the endMapDraw event. Here, the
    endMap event is defined as a property of the EventList class. Finally, onMap()
    is a function that will be called when the event is heard (captured).


    # panToLatLon()


    panToLatLon() is one of two manual panning methods. This method enables you to
    define a new GeoPoint to change the map position. Calling this method will force
    the map to the new location. The one parameter to pan is GeoPoint, the latitude/longitude
    you want the map pan to.


    ```

    mapInstance.panToLatLon(GeoPoint);

    ```


    This example shows the code to pan the map to the specified latitude/longitude
    coordinate:


    ```

    var myPoint = new GeoPoint(37.826701, -122.423103);


    map.panToLatLon(myPoint);

    ```


    # panToXY()


    panToXY() mimics the functionality of panToLatLon. Instead of passing a latitude/longitude
    GeoPoint, this method accepts an x/y CoordObject as a parameter. Calling this
    method will force the map to pan to the new location.


    ```

    mapInstance.panToXY(YCoordPoint);

    ```


    This example shows the code to pan the map to the x/y coordinate:


    ```

    var myPoint = new CoordPoint(100,100);


    map.panToXY(myPoint);

    ```


    # startAutoPan and endAutoPan


    Accompanying the panToLatLon and panToXY() methods are two events startAutoPan
    and endAutoPan. These are fired when the first is called and when the map''s actions
    complete, respectively.


    # disableDragMap() and enableDragMap()


    One of the features that Yahoo! Maps APIs have the ability of the user to click
    on the map and drag around it. This level of interactivity is one of the most
    popular features of Yahoo''!s developer offerings, and the Ajax API does not disappoint.
    The Ajax API, this feature comes enabled by default.'
