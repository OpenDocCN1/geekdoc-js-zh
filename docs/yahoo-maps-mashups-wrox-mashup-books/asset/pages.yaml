  md: '# Chapter 5


    # How It Works


    Much like the beginning of this chapter, this web page starts by importing the
    Ajax API library. After defining the style and positioning the map, a form is
    constructed. This form features a text input field labeled “New Address” paired
    with a button labeled “Go.” Also part of the form is a text area for displaying
    event as they occurs.


    The JavaScript handles the population of the map. Now that the satellite tile
    definition is included in the constructor of the map instance. Once the map is
    created, the initial position of the map is set to Denver, Colorado, using the
    drawZoomAndCenter method.


    The drawZoomAndCenter() method appears again, inside the drawMap() function. This
    function is called when the Go button is clicked, inviting the map to redraw itself
    to the user defines (While this method supports changing the zoom level as well,
    the exercise does not support for that functionality. You combine elements from
    the first exercise in this chapter to include it.)


    Once the map re-centers, the endMapDraw event is fired. The yEvent.Capture method
    will hear this and call for onMapChange. This function populates the text area
    with the latitude and longitude of the new center of the map.


    Finally, a yEvent.Capture will pick up the onPan event. As you learned in this
    section of the chapter, the onPan event is fired when the map is clicked and dragged.
    Tying this event to the onMapChange function creates the unique effect of continuously
    displaying the updated map center point as the map is dragged. The level of activity
    of this functionality displays further evidence of how well the Yahoo! Maps API
    really performs.


    # Summary


    This chapter introduced you to several of the basic methods available in the Ajax
    API. Here is a summary of what was covered in this significant chapter:


    +   - The Ajax API dispatches events that can be captured and handled with one
    simple line of code.


    +   - set methods are responsible for defining and changing different elements
    of the map.


    +   - get methods are called to retrieve specific properties of the map instance.


    +   - HTML form elements, working with the Ajax API, can let users control and
    change most aspects of the map''s functionality.'
