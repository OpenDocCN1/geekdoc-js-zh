  md: '# Ajax API Basics


    # getMapTypes()


    getMapTypes() is most useful if you want to create your map view buttons. Letting
    your users choose their map view can add a hint of customization to it. Not to
    mention the ability to display satellite images of the world, from space all the
    way down to street level, is an enticing feature that will draw users to your
    mashup.


    ```

    mapInstance.getMapTypes();

    ```


    This method is a little less complex than the other basic get methods, as it returns
    an array. That means the data returned by this method appears something like a
    list. To view each item, you must loop through this list and trace out each value
    within the array. Earlier you would use a for/in loop to view the contents of
    EVENT_MAP_GEOCODE_SUCCESS and EVENT_MAP_GEOCODE_ERROR, here you will use a for/each
    loop. (The for/each loop will be discussed much more in the very next example.)


    ```

    var mapTypes = map.getMapTypes();

    alert(mapTypes);

    // Outputs: "YAHOO_MAP, YAHOO_SAT, YAHOO_HYB";

    ```


    # Map Positioning and Events


    This set of methods enables you to control the positioning of your map. In addition,
    these methods let you toggle certain built-in functionalities of the API.


    # drawZoomAndCenter()


    drawZoomAndCenter() method accepts two parameters, address or YGeoPoint (latitude/longitude)
    and zoomLevel. A successful address can be a ZIP code or a street name, city,
    state and ZIP code. Certain major metropolitan areas will work as well. The address
    is converted by the API geocoder into a latitude/longitude point, and the map
    returns its tiles and centers on value.


    YGeoPoint is the class in the Ajax API that converts latitude/longitude coordinates
    into an object that can be properly handled by the API. This gives you the option
    of passing either address or YGeoPoint, depending on what you have:


    ```

    mapInstance.drawZoomAndCenter(address, zoomLevel);

    ```


    or


    ```

    mapInstance.drawZoomAndCenter(YGeoPoint, zoomLevel);

    ```


    This example shows the code to set or change the address to San Francisco and
    adjust the zoom level to 3:


    ```

    var address = "San Francisco, CA";nvar zoomLevel = 3;

    map.drawZoomAndCenter(address, zoomLevel);

    >> zoomLevel not duration (mirek)

    ```'
