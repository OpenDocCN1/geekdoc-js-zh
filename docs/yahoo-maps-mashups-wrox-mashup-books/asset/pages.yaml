  md: '# Flex Builder 2: The Flex Autoring Tool


    The Flex IDE is the authoring tool used to develop applications for Flash. While
    the term Flex can refer to the player or the platform technology, it is usually
    used to mean the authoring tool. Flex was made popular by Macromedia, an innovative
    company purchased by Adobe in 2005. Flex is available as standalone-software for
    purchase online and in stores. It has also bundled with other multimedia offerings
    such as Fireworks and Dreamweaver.


    Files generated with Flex are commonly output as SWF (ShockWave Flash) files.
    The main ingredients of Flex are vector and raster graphics. While JPEG images
    have been displayable in Flash for some time, the latest versions are also able
    to display GIFs and PNGs.


    As a multimedia tool, Flash has limited competition. One of its greatest strengths
    is the ability to embed and stream compressed video. This video technology is
    aptly named Flash Video with the extension .flv. The video, as well as audio,
    can be sent and received, creating unparalleled communication


    A version of the Flex IDE is required to develop and take full advantage of the
    Yahoo! AS-Flash Maps API.


    # Exploring the Flex Sample Applications


    Flex Builder 2 features some fully coded examples to get you started. These useful
    examples are accessible from the Flex start page that loads by default when you
    run Flex Builder 2. Adobe''s inclusion of these examples is intended to get you
    up and running as quickly as possible. This makes Flex easy to pick up and gives
    you a head start in building your Flex-based mashup.


    The first example is certainly not an application you would likely build yourself.
    The Flex Component Explorer is provided to give full-on working examples of the
    Flex components. Like the ActionScript components in Flex, these examples are
    built to offer pre-built design and code wrapped up in a highly reusable and deployable
    package.


    Launching the Flex Component Explorer (shown Figure 18-2), you will see a list
    (actually a pretty good example of the tree component in action) in the left pane.
    Expand the Video nodes, and you will see various terms here, like "Button", "Data",
    "Text" and "Menu." Click Button Controls and note that will expand. Click Button
    and both boxes on the right side of the application will become populated. The
    top box shows a simulated layout with examples of the button control in different
    ways. The simulated layout is operational, and clicking each button will populate
    the window to the right of the buttons.


    The bottom pane reveals the exact code executed to display the buttons. You are
    looking at MXML, the proprietary format of MXML. You will learn MXML in much more
    detail bit later in this chapter.


    While in the Flex Component Explorer, browse around, discover and play (if not
    all) of the controls. Take a look at the VideoDisplay component within Loader
    Controls or the list component. These represent some of the simplistic building
    blocks of Flex 2. Over the next few chapters, you will likely use several of these
    components to add instant usability to your Flex-based mashup.'
