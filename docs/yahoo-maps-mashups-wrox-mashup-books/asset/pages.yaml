    # The Local Connection


    This section will guide you through coding the bridge script to enable communication
    between the Flex 2 and Flash clients. As mentioned in Chapter 18, Yahoo! and Flex
    2, the bridge script is necessary to allow the Flash player to run both Flex 2
    and ActionScript 2 applications. Because Flex 2 runs ActionScript 3, it requires
    a different virtual machine that is available in Flash Player 9. The AS-Flash
    API requires a different ActionScript virtual machine (AVM) to run and so it cannot
    be loaded directly into Flex 2 or other ActionScript-3-based applications.


    You enable the local connection to communicate this by modifying the MapConnector
