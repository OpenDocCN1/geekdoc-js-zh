  md: '# Chapter 2


    # Weather


    On the news, you will never hear weather mentioned without a reference to the
    area it is affecting. Weather news is based on location, and makes it a perfect
    ingredient to be mashed up with Yahoo! Maps. The weather API offered by Yahoo!
    gives you up-to-date weather information on an area, with ZIP code or location
    ID.


    XML returned by the weather API is in RSS format and features attributes as wind
    (wind chill, direction and speed), atmosphere (humidity, visibility and pressure),
    and astronomy (sunrise and sunset). Most useful is the forecast attribute, which
    lays out what the weather in an area is what it will be.


    Forecast features a code that adheres to the weather API''s code index, enabling
    you to look up a code to see the weather condition is. Combine that with the latitude/longitude
    value and the magical CustomSWFMarker in the Flash APIs and you can creatively
    convey actual weather masses right on the map.


    # Traffic


    Yahoo! offers a REST API and RSS feed for traffic, and both play very nicely with
    the map APIs. The Traffic API is used to mark any traffic problems on the location
    you. In your mapish, you can tie the location, as it is dynamically prompted by
    user interaction, and pass it into the Traffic API. The XML returned can be represented
    with markers (see Figure 2-2) or as a set of markers within an overlay.


    ![](img/ee60aed724e0f9d7a7d4fc463e96b52a_42_0.png)


    Figure 2-2


    The TrafficOverlay mentioned previously will be explored with the Flash APIs a
    little later in this book. A benefit to using this built-in overlay is that it
    leverages a wide set of pretrained custom markers designed to reflect various
    traffic alerts.'
  merge: -1
