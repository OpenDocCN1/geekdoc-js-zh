    # Working with Tools


    Tools are prepacked sets of user interfaces that ship with the Ajax API. They
    reflect some of the most commonly used technology on consumer map applications
    like Yahoo! Adding existing tools can save time over having to replicate the functionality
    with your user interface.


    # Control Methods


    The simple methods available for tools are part of the map class. These methods
    become available when the map instance is initialized.


    # addTypeControl()


    The control is a widget that lets you toggle the map type among regular, satellite
    and hybrid tiles. This method saves time but does not offer the flexibility of
    creating your own buttons, as you learned in the last chapter with the map types.


    ```

    mapInstance.addTypeControl();

    ```


    This line will add the type control tool to the top-left corner of your map.


    # addPanControl()


    This tool adds to the map widget featuring four directional arrow buttons. Clicking
    each button will pan the map in the corresponding direction. The map comes with
    a default panning functionality. The tool adds some precision and more direct
    navigation to the map.


    ```

    mapInstance.addPanControl();

    ```


    This line will add the pan control tool to the top-right corner of your map.'
