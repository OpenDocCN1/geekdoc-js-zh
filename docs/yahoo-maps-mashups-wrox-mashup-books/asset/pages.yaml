  md: '# AS-Flash API Basics


    In the last chapter you began developing with the ActionScript-Flash (AS-Flash)
    API. You started developing AS-Flash-based applications and implemented some simple
    API methods.


    This chapter discusses


    +   - The full usage of methods like setZoomLevel, setCenterByAddress and setCenterByLatAndZoom

    - What the data get methods return and how these methods can be used to further
    your application

    - Various looping techniques that let you code more efficiently

    - How to work with other components in Flash


    # Basic API Methods


    Having completed the Ajax API and the JavaScript-Flash (JS-Flash) API, you will
    likely be familiar with many of the basic API calls. As you go through this chapter,
    keep in mind that with the AS-Flash, as in each API, method calls are unique to
    their technology. The familiarity will help you pay special attention to the naming
    conventions and parameters passed to each method.


    # Map Set Methods


    These basic methods are responsible for changing the properties of the map. You
    will recognize quickly the naming convention of these methods reflects exactly
    what each method does. It makes it easier to code with them as well as for other
    developers to identify their purpose in your application.'
