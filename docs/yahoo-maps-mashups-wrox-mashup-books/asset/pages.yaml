    # setCenterByAddressAndZoom()


    Developers looking to change the map location and zoom in one shot have options.

    setCenterByAddressAndZoom() is a very capable method and brings the power of

    setCenterByAddressAndZoom() with zoomLevel().


    The order of operation for this method is as follows:


    +   1. The method is called:

    mapInstance.setCenterByAddressAndZoom(address:String, zoomLevel:Number, duration:Number);

