    # # How It Works


    By defining the JavaScript source using the JS-Flash API library, you have made
    all the classes available to your web page. You set the `src` attribute of JavaScript
    tag. This effectively imports or "pulls in" the latest fields available, under
    the version you specify in the URL.


    The next step is to create a space on your web page, a container for displaying
    the Flash-generated map tiles. Using the `style` tag, you create a class called
    `mapContainer`. This is set to have a width of 800 pixels (800px) and a height
    of 400 pixels (400px). In the future, these dimensions can change based on the
    view area of the map you desire in your web page.


    Within the body tag of your HTML, you add a `div` tag with the ID `mapContainer`.
    This will assign the properties of the `mapContainer` class in the `style` tag
    to the DIV you are creating. Effectively, this will size the DIV to 800 by 400
    pixels and fully fill the space in with a map of that size.


    Still within the body tag, additional JavaScript here we will actually trigger
    the map to turn on with some example properties. This section of code deserves
    close review, as it is your first usage of the JS-Flash API code itself:'
