  md: '![](img/ee60aed724e0f9d7a7d4fc463e96b52a_63_0.png)


    # # Ajax API Basics


    In the last chapter you learned steps to setting up the Ajax API. You started
    developing JavaScript-based applications and implemented some simple API methods.
    In this chapter, you will build on that knowledge.


    This chapter covers


    +   - How working with the API is easier with events using YEvent ()


    +   - The full usage of methods that control zoom level, the type of tiles the
    map displays and the positioning of the map


    +   - What data the basic get methods return and how they can be used to further
    your application


    # ## Basic API Methods


    As you have already seen in earlier examples, methods are the building blocks
    of working with an API. These are the exposed functions that let you call for
    specific functionality and control against the instance of the map API you are
    working with.


    The Ajax API methods are the most distinct of the four APIs covered in this book.
    However, the naming conventions are very common from one API to the next. To start
    coding with the methods, it is good to leverage the strong event support the API
    offers. As you will see, many of these basic methods have associated events that
    are dispatched as the method code is executed.


    As you learn each method, this book will cover any available events in parallel.
    Whether you are coding along while each method is introduced, or are working with
    the available code samples, working with the events will help you get a better
    understanding of the timing and activity of each method.'
  merge: -1
