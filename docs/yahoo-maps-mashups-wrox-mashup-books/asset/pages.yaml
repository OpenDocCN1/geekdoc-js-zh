  md: '# Chapter 18


    ![](img/ee60aed724e0f9d7a7d4fc463e96b52a_276_0.png)


    Figure 18-2


    Another example like this is the Flex Style Explorer. Run this application and
    you will get a good idea of the stylistic capabilities of Flex. When it was first
    released, the customizability of Flex was often called into question. Developers
    who had grown accustomed to Flex''s trendy design freedom were not concerned with
    how creatively detail could flow in the MXML-driven environment of Flex.


    The Style Explorer should put rest to the concerns that Flex does not support
    customizability. In this example, you can select one of several sets from the
    top menu bar (which is an working ApplicationControlBar). Selected, components
    that will be displayed in the center column. The left-hand column will populate
    with a TabNavigator listing each component. The full offering of style choices
    displays within each component''s tab. Changing any of these will alter the component
    in the center pane as well as display the actual CSS code on the fly in the pane
    on the right.


    For an easy test, selecting the DateChooser control in the menu bar. With the
    Style Controls pane, select headerColor. Change the first byte to red (#FF0000).
    Further down, changing todayColor to navy blue (#000FF). Finally, at the bottom,
    change dropEnabled to true. Refer to Figure 18-3.


    Take a look at the CSS code on the right (shown in Figure 18-3). Dropping this
    into your application code provides a simple way of customizing a highly functional
    yet ordinary-looking control into something with your own flavor. Notice how you
    did not need to fill a fill or draw a square symbol in the Flash IDE. While some
    developers like the total control of Flash, many are finding the efficient way
    of styling controls, as this example application shows, to be a virtuous feature
    of Flex 2.


