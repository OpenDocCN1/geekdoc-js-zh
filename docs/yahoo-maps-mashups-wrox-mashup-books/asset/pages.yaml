  md: '# The AS-Flash Mashup


    # Exploring the HotJobs Web Service


    Since HotJobs is a property of Yahoo!, the support for the HotJobs web service
    is similar to that for the Yahoo! Maps APIs. Like the HotJobs web service and
    its documentation are supported by the Yahoo! Developer Network (YDN). To check
    out the web service firsthand, visit http://developer.yahoo.com/hotjobs/index.html
    for the most up-to-date documentation and uses.


    While you do not need an ID for the HotJobs web service, you must agree to the
    terms and conditions of it as well as the usage terms of YDN. Please review the
    terms at http://developer.yahoo.com/usagePolicy/ before proceeding with this mashup.


    The HotJobs service, like most APIs and web services within the YDN family, is
    not distributed via a component like the AS-Flash Maps API. You retrieve data
    by making a request via URL and receiving a response in RSS/XML standardized format.
    Flash works with XML very well and features an efficient, built-in XML class with
    a set of very methods.


    The benefit of using the HotJobs web service with this mashup is that it is very
    similar to several other YDN support APIs. While you are creating a solid mashup
    in this chapter, learning the HotJobs web service should set you to easily adapt
    and mash up other APIs and services.


    # HotJobs RSS Request


    Constructing the HotJobs RSS request is very simple. It is basically one URL that
    can have many variations. The principal request URL looks like:


    ```

    http://hotjobs.yahoo.com/rss/version/country/state/city/category/keywords

    ```


    Like with the maps API, the HotJobs web service requires parameters to be passed.
    In this case, the parameters are actually placed within the context of the RSS
    URL. These parameters are


    | Parameter | Type | Description |

    |---|---|---|

    | version | 0 | The version of the web service. Its value is 0 at the time of
    this writing. |

    | country | String | A three-letter country code. Examples: USA, PHL (Philippines).*
    |

    | state | String | A two-letter state code. Examples: MA, CA, FL. |

    | city | String | City names with space to be separated by plus signs. |

    | category | String | A three-letter category code. Examples: MIS: Technology.*
    |

    | keywords | String | Keywords with space to be separated by plus signs. |


    > * The YDN documentation for full listings at http://developer.yahoo.com/hotjobs/index.html.


    The following URL will retrieve all "Flash developer" job listings in the USA:


    ```

    http://hotjobs.yahoo.com/rss/0/USA/-/-/-/Flash-Developer

    ```


    The following URL will retrieve all "mail room" job listings in New York, NY:


    ```

    http://hotjobs.yahoo.com/rss/0/USA/NY/New+York/-/-/mail+room

    ```'
