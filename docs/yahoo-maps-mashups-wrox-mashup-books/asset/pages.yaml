  md: '# Chapter 12


    # API Methods


    Not to say the Travel APIs are limited, thankfully it offers only two methods
    for interaction. It is not a reflection of the quality of the API or the data
    available. It is more a concentration of function that the service is currently
    designed to provide.


    Yahoo! Travel supports its API calls through a Yahoo! Developer Network site similar
    to that for Maps. By default, the documentation crafts the method call as a REST
    request and returns very readable XML.


    # TripSearch


    This method selects for user-entered trips based on loose criteria. It also enables
    you to search for trips by a specific user.


    To search for trip plans, you will need to pass a query parameter in addition
    to the required AppID parameter. This is a keyword such as "New York" or "Europe".
    Using the parameter, the method will return all trips tagged with the query value.


    The fully constructed REST call looks like this:


    ```

    http://travel.yahooapis.com/TripService/V1/TripSearch?appid=(your_ydn_appid)&query=europe

    ```


    You can see where to plug in your AppID. The query value of europe instructs the
    search to return trips tagged with this. Additional parameters for this method
    include results, a value that quantifies the number of results returned and can
    take a value from 10 to 50, and start, a value that determines what value will
    be returned. The latter is helpful for paging through results.


    Copying and pasting this code into your browser will return XML, which an application
    can parse. An excerpt of such a response for this method looks like this:


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    <ResultSet firstResultAvailable="2699"

    totalResultsReturned="10" xmlns="yahoo:travel"

