    getZoomLevel() method lets you obtain the current zoom level of the map. It can
    be used to adjust a custom zoom or zooming interface that you have created. As
    you will see in the next chapter, knowing the current zoom level is important
    when you are using overlays and custom features of the API.


    ```

    mapInstance.getZoomLevel() : Number;

    ```


