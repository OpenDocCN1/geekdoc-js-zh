    # How It Works


    After importing the JS-Flash API library, the classes become available to your
    JavaScript and HTML. The mapContainer defines the style and placement of the map.
    The div tags will display the map and is rendered and inherit the style properties
    of the mapContainer.


    The aForm is written in HTML and will do two things. First, the form contains
    an input field and a button. These two elements together allow the user to enter
    a new zoom level and submit it. It will ultimately change the zoom level of the
    map. The other purpose of the form is to create a space for displaying event data
    related to the event, as it occurs. This is a text area that will display the
    map''s new zoom level when the zoom has found.


    The zoom level changes when the Submit button is clicked within the form. The
    onClick() event handler calls the zoomLevel function. Within this function, the
    setZoomLevel method is called against the map instance. JavaScript references
    the user-entered zoom level and is passed as the new zoomLevel.


    You use the addEventListener to listen for the zoomEvent. That event is fired
    from the map when the change is complete. The event listener then calls the zoomEnd
    function, defined to carry out the event. This function will populate the text-area
    element eventDisplay, which is inside the aForm, with the new zoom level. This
    value is attained by calling the getZoomLevel() method against the instance.


    This example is designed to be easily replicated for each set of methods and events
    to follow in this chapter. By simply customizing the form to let the user enter
    relevant data, you will be able to call other methods against the map API instance.
    The event-display part of the example is very flexible. All you need to do is
    modify the event being listened for, as well as the data being displayed, and
    you are all set to test other methods and events together.


    # Map Type Methods and Events


    The JS-Flash-API considers the map view type to be the type of tile being loaded.
    You may recall an example in the last chapter that set the map view type so the
    map would display satellite tiles. The JS-Flash API supports three types of tiles:
    regular, satellite and hybrid. Hybrid tiles are a combination of regular tiles
    and satellite tiles.


    # setMapViewType()


    The setMapViewType() accepts one parameter, the map view you want to change the
    map to. Here is how the code should look:


    ```

    var newMapViewType = "satellite";n

    myMap.setMapType(newMapViewType);

    ```'
