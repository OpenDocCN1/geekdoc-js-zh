  md: '# Chapter 2


    RSS feeds work particularly well with map APIs when the feeds include geographically
    encoded objects, as GeoRSS does. In addition to the standard attributes, geographically
    encoded objects add a georss: point tag to the feed. Featering a latitude/longitude
    coordinate, this tag will add a location to the entry in the RSS feed.


    ```

    <georss:point>42.346524,-71.097381</georss:point>

    ```


    In this book I''ll cover the ability of each flavor of the Yahoo! Maps API to
    aggregate GeoRSS feeds.


    # Prime Mashup Sources


    Now that you have a solid understanding of mashups and the types of APIs and data
    out, it''s time to introduce you to some of the great sources available to you.
    These are the ingredients in your web cocktail, and combining them with each other
    and ultimately with Yahoo! Maps makes for some fun and effective mashups.


    # Flickr


    Flickr has become one of the most popular and exciting web services around. Considered
    one of the best photo sites, Flickr enables its users to share and manage their
    photos from any source (Figure 2-1). These sources include a user''s desktop,
    his or her mobile phone or device and, of course, the web. Huge objective of Flickr''s
    is to expose photos through many outlets as possible. Photos in Flickr''s repository
    are viewable in e-mail messages, blogs, widgets, pings and RSS feeds, as well
    as the website flickr.com.


    ![](img/ee60aed724e0f9d7a7d4fc463e96b52a_40_0.png)


    The success of Flickr is largely due to the tagging feature supported in the application.
    When a user uploads a photo, rather than just titling the photo, that user can
    add keywords tags to it. These tags allow Flickr''s search engine to identify
    both photos and sets of photos by association. When another user browses photos
    on Flickr, a search for an existing tag will pull up all the photos tagged accordingly.'
