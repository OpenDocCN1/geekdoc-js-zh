  md: '# Chapter 18


    The solution, which will be explored step-by-step in the next chapter, uses a
    successfully compiled ActionScript2-based application using the AS-Flash API.
    In a unique and effective approach, you can create a map application and link
    it to Flex 2 project. The technique is called local connection and it enables
    you to bridge Action 2-based SWFs with Flex 2 applications.


    The solution was also born of Peter Ent Aode. Because Flash Player 9 was targeted
    to completely overpower its predecessors, it had to be able to run ActionScript
    3 completely independent from ActionScript 2. It, however, can run both ActionScript
    scripts in separate virtual machines — the compartments of the Flash player only
    one version can run at a time.


    Picking up on this chapter, Nahuel Foronda from asfusion.com adapted it successfully
    for Yahoo! Maps. This concept allows for the AS-Flash API to run (using ActionScript
    2 virtual machine) on one side and a bridge to that (using Flex 2 application)
    on the other side. The local connection itself can be established with very little
    code and creates a line of communication between the two SWFs. Both the AS-Flash-based
    map application and the Flex 2 application are compiled as SWFs.


    If you sighed after this chapter and section of the Flex, it would be helpful
    to go back and review Chapters 13–17 on the AS-Flash API. In the next chapter
    and chapters to, you will learn how to complete this workload and build your map
    application with the cutting-edge technology of Flex 2.


    # Getting Flex 2


    Adobe Flex 2 can be obtained at Adobe’s product site: www.adobe.com/products/flex/.
    If you need to new Flex 2, you can download a 30-day trial and evaluate the technology
    you need. You may need to log in or create an Adobe account. The site is wealthy
    with demos, solutions and technical information on the platform. It also currently
    features some video interviews with teams that have successfully implemented Flex
    2 solutions.


    If you are downloading, these steps will guide you through the download and installation
    process:


    +   1. Choose Flex Builder 2 by selecting English: Windows file size and click
    Download.

    2. Save the file to the folder of your choice and the somewhat length download
    will begin. Once it''s complete, click Run.

    3. The Install Wizard for Flex 2 will run. Click Next and the installation will
    extract the necessary files. This may take some time.

    4. When prompted to install an set, Flex Builder and Flex SDK. This will install
    the IDE for Flex, Flex 2 as well as useful SDK and debugging tools. As the instructions
    note, Flash Player 9 will also be installed, if you don''t have it. Click Next
    and the installation will begin.

    5. Read the terms and accept them. Click Next to continue. The installation process
    will continue, prompting you at various points. Choose the best options for you.
    Finally, the actual install will occur.

    6. Lastly, the installation will prompt you about Cold Fusion documentation. This
    step is not necessary for working with maps. To launch Flex Builder 2, find the
    Adobe folder in your Start Programs and click Adobe Flex Builder 2.


    246'
