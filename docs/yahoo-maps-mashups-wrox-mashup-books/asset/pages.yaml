  md: '# AS-Flash API Basics


    # setCenterByLatLon()


    If you know the latitude/longitude you want to center the map, you can use setCenterByLatLon().
    A major benefit of this method is that it executes much faster than setCenterByAddress().
    This is because this method does not need to geo-code an address and resolve a
    latitude/longitude, since it already knows it.


    setCenterByLatLon() also accepts the duration parameter. Since there is no conversion
    between address and lat/lon, the panning effect will make you much more quickly:


    ```

    mapInstance.setCenterByLatLon(latLon:LatLon, duration:Number);

    ```


    You''ll notice the lat variable does not belong to any of the variable types defined
    in the last chapter. That is because the lat variable being passed is an instance
    of the map API''s Lat object. You must pass a Lat object as the first parameter
    of the setCenterByLatLon() method, and to do that, you must use the latitude/longitude
    you want to pass.


    To create a Lat object, using the coordinates 40.713696,-74.00564 for New York
    City, you must import or reference the Lat class. The following code demonstrates
    this using the setCenterByLatLon() method:


    ```

    var latObject = new com.yahoo.maps.Lat(40.713696,-74.00564);

    var duration:Number = 300;

    myMap.setCenterByLatLon(latLon, duration);

    ```


    # setCenterByLatLonZoom()


    Like setCenterByAddressZoom(), this method gives you access to a lot of functionality
    in one shot. The sequence, as reviewed, is slightly different as no address must
    be converted to a latitude/longitude; if you have selected this method, you already
    know the latitude and longitude. As a result, this method, like its counterpart
    setCenterByLatLon(), works a bit more efficiently, thus generating faster results.


    The order of operation for this method is as follows:


    +   1. The method is called: setCenterByLatLon(latLon:LatLon, zoomLevel:Number,
    duration:Number);

    2. The map pans based on the duration, in milliseconds, defined in the duration
    parameter.

    3. The map centers on the resolved latitude/longitude coordinate.

    4. The map zooms to the level defined in the zoomLevel parameter.


    Common use of this method looks like this:


    ```

    var latLon:LatLon = new com.yahoo.maps.Lat(40.713696,-74.00564);

    var zoomLevel:Number = 6;

    var duration:Number = 3000;

    myMap.setCenterByAddress(address, zoomLevel, duration);

    ```'
