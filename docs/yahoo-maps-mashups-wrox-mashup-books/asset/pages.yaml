  md: '# The Ajax Mashup


    +   3. The photo''s latitude and longitude are set to the variables lat and lon,
    respectively.


    +   4. Using document.write, a link is built to center the map on the photo''s
    latitude and longitude when it is clicked.


    +   5. The photo''s Flickr URL is built using some of the photo lookup properties.
    This URL will act as the source of the marker when each marker is attached.


    +   6. The addMarker function which you will code next, is called, and passes
    the lat, lon and newly constructed imgUrl values.


    The addMarker function will field the necessary values for adding the marker to
    the map. As you learned in the chapter, the markers in the Ajax API are capable
    of displaying images and other information. You will use the imageMarker class
    to build an image only marker.


    ```

    function addMarker(lat,lon,imgUrl) {

    var imageMarker = new YImage();

    imageMarker.src = imgUrl;

    imageMarker.size = new YSize(75, 75);

    imageMarker.offsetSmartWindow = new YCoordPoint(0, 0);

    var markerPoint = new YGeoPoint(lat, lon);

    var marker = new YMarker(markerPoint, imageMarker);

    map.addOverlay(marker);

    }

    ```


    An object of YImage called imageMarker. Its source is the incoming imgUrl. Other
    values such as size and offsetSmartWindow are also set. Using YGeoPoint, the latitude
    and longitude of the photo are used to create the markerPoint. A marker is created
    with addOverlay. Since this function is being called within the loop, it will
    run for each photo returned in the JSON response data.


    The final step for this mashup is to make the request to the Flickr API. As mentioned
    before, this will done similarly to the way the Ajax APIs are imported at the
    beginning of the chapter.


    ```

    <script type="text/javascript"; src="http://api.flickr.com/services/rest?method=flickr.people.getPublicPhotos&format=json&api_key=(your_flickr_key)&user_id=(your_flickr_user_id)&extras=geo=\</s></script>

    ```


    The request uses the flickr.people.getPublicPhotos call, one of the methods you
    learned earlier in this chapter. You will need to substitute the API key and user
    ID with your own. The format=json parameter will return JSON and execute the jsonFlickApi
    function when it is successfully returned.


