  md: '# The JS-Flash Mashup


    of the Yahoo! Maps API and acts as confirmation of all the locations entered thus
    far. Looking at this interface, you can already see how well trip data works with
    maps.


    Finally, the trip journal lets you adds to a trip album. Users can upload their
    photos or link photos right from Flickr. It is a simple and powerful interface
    to encourage as much data entry as possible. Using photos to tell the story of
