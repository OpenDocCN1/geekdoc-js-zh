    # How It Works


    The local connection object is first set with sending events on behalf of the
    _flashclient side of the application. The local connection will also listen for
    events sent through the same local connection by the _flexclient counterpart.
    You will code this a bit later in this chapter.


    In order for you to be able to control the map, you need to initiate it. The map
    is initialized when it fully loads. At that time, the API broadcasts an event
    aptly named EVENT_INITIALIZE. Since the component is busy building the map display
    by the initial parameters, it does not really accept code very well until it completes
    loading. In other words, it is best not to attempt to control the map until it
    initializes.'
