    # Benefits of Using Flex 2 and the AS-Flash API


    The solution discussed in this chapter using the AS-Flash API with Flex 2 via
    local connection makes many things possible. It lets you, the mashup developer,
    work with the latest RIA technology available from Adobe. This solution also leverages
    your expert-level knowledge of the AS-Flash API.


    The easy layout capabilities and rapid development of Flex 2 make it ideal for
    creating mashups. It provides a simple way to access data and bind them to the
    many containers it supports. As you know the other APIs, the way to a good mashup
    starts with locking in data. If you have those data, Flex 2 enables some of the
    best connection methods, increasing time of development and overall speed of your
    application.


    Tapping into your experience and skills with another API is never a bad thing.
    This chapter has shown you just how adaptable the AS-Flash API is when you use
    it with Flex 2. In the next chapter, you will be taken through the integration
    process step by step and will establish a solid foundation for your map mashups
    with the AS-Flash API and Flex 2.


    252'
