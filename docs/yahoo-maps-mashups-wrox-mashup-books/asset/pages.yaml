  md: '# Chapter 7


    # API Methods


    Like the Maps APIs, Flickr offers a wide set of very functional simple API methods.
    Each method is responsible for letting you, the developer, interact with Flickr
    in important ways. The methods can be organized into categories based on functionality.
    The most relevant for mashing photos and their data with maps will be reviewed
    in this chapter to give you a solid overview of the capabilities of the API.


    Flickr supports its API calls through a very useful and effective documentation
    site. The documentation is actually a living, breathing interface that enables
    you to test each API call and view the responses. By default, the documentation
    crafts the method call as a REST request and returns very readable XML.


    # flickr.photos.search


    This Popular method call returns a list of photos on given parameters. It effectively
    enables you to search nearly all of Flickr''s repository. Since Flickr can mark
    their photos only to visible users, which requires certain authentication or permissions
    to view all photos.


    The only required parameter for this call is api_key. A useful parameter is the
    optional extras. Here you can add the field geo, which will return the photo''s
    latitude and longitude as defined by the user. Another useful parameter for this
    call is tags, which enables you to search for photos based on the tag uploaded.
    This is often a precise means of filtering out photos you want to draw.


    The fully constructed flickr.photos.search REST call looks like this:


    ```

    http://flickr.com/services/rest/?method=flickr.photos.search&api_key=(your_flickr_api_key)&tags=yahoo++hack+day&extras=geo

    ```


    You can see the parameter in which to plug in your api_key. The searching tags
    yahoo++hack+day instruct you to return photos tagged with those words. Finally,
    the extras=geo parameter will return the latitude and longitude of each photo,
    where available.


    Copying and pasting the preceding into your browser will result in XML that an
    application can parse. An example of such response to this method call looks like:


    ```

    <xml version="1.0" encoding="utf-8" />

    <rsp stat="">

    <photos pages="1" perpage="100" total="1679">\...

    <photo id="25946940" owner="..." secret="..." server="45" title="The Mush pit
    at Yahoo!" ispublic="1" isfriend="0" isfamily="0" latitude="37.418363" longitude="-122.02515"
    accuracy="16" />

    </photo>

    </rsp>

    ```


    Along the attributes of this actual photo in Flickr, you can see the latitude
    and longitude. As you will later in this chapter, parameters from a call like
    this will be used to place a marker on the map with the specified coordinates.'
