  md: '# Chapter 11


    The other parameter can be obtained at any time using the getCenter method on
    the map instance. The additional parameters provide various ways to manage the
    results. startIndex and results let you create pagination from one of results
    to the radius, categoryFilter and ratingFilter offers ways to narrow search results.


    Two main events are tied to the search method within LocalSearchOverlay. EVENT_SEARCH_SUCCESS
    and EVENT_SEARCH_ERROR are fired based on the success or failure of a search.
    Success offers structural data within the object that has failed a narrower search.


    ```

    localSearchOverlayInstance.addEventListener(com.yahoo.maps.overlays.LocalSearchOverlay.EVENT_SEARCH_SUCCESS,
    onSearchSuccess);

    localSearchOverlayInstance.addEventListener(com.yahoo.maps.overlays.LocalSearchOverlay.EVENT_SEARCH_ERROR,
    onSearchError);

    ```


    Once again, you will see that the listeners are tied to the overlay instance rather
    than the map instance. You will also notice that the event paths reflect the overlay
    path instead of the map path. Both allow functions to carry out their respective
    dispatches. With the data objects, you should always explore the data returned
    from an event for the for/in method.


    # TrafficOverlay


    TrafficOverlay is another overlay class that replicates the power of a very popular
    and useful feature of the Yahoo consumer application. Real-time traffic incident
    information can add a desirable functionality to your application, giving it an
    edge. This benefit to this class is that it has no methods, because all the functionality
    is built in.


    The overlay class requests traffic information for the area is currently centered.
    It takes the data returned and displays each item as a CustomPOIMarker, complete
    with incident information. The markers reflect traffic incidents ranging from
    accidents to road construction to medical emergencies. Each incident is represented
    with a different color and universal symbol.


