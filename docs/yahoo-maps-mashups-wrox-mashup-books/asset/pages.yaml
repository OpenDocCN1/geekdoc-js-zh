  md: '# The AJAX API


    ```

    <script>

    </head>

    <body>

    <a href="javascript:newWindow(''http://www.mashpexts.com'')">Launch Window</a>

    </body>

    </html>

    ```


    Instead of being coded inside the better practice, the URL is now passed into
    the function as the url parameter, as it further generalizes the function you
    should call it in other places and have it different URLs.


    In the AJAX API, internal functions of the API are exposed to you when the classes
    are imported as methods. These methods can be called against the map container
    to control the map. Methods are important in working with the API that each API
    featured in this book has a chapter dedicated to reviewing the methods available
    for it. As you learned, you can pass parameters with methods like address or latlon
    to change the map''s location.


    # Events


    Events are an important and often overlooked part of JavaScript. They represent
    user interactions or code occurrences that can be handled by additional handlers.
    Events are executed with event handlers. An event handler is the script that executes
    when an event occurs. An example of an event when a user moves the mouse over
    an element, such as an image. The user action will fire an event called onMouseOver.
    The event handler would look like this:


    ```

    <img src="someImage.jpg" onMouseEnter="newWindow(''someImage.jpg'');" />

    ```


    This code will call the newInput function, passing the image as a parameter when
    it is rolled over the mouse.


    Events play a big role with Ajax, based on more on code occurrences than user
    interaction. Working more with data and code execution, events can be fired to
    signal when data have been sent or when certain code is completed in the application.
    The map API dispatches events to map activity, startPan, changeZoom and onStartGeocode.
    Each of these refers to an activity of the map as it happens. Setting up event
    handlers for these events you can call other functions based on occurrences.


    # XMLHttpRequest


    Prior to the adoption of Ajax, or the discovery of the Ajax approach, many interactive
    web flows worked like this:


    +   1. HTML loads a form.

    2. The user fills out the form and submits it.

    3. Form data is submitted to CGI or ASP as processed.

    4. The script returns HTML, which loads as the browser refreshes.'
  merge: -1
