    \ to map instance\nmyMap.addEventListener(com.yahoo.maps.api.flash.YahooMap.EVENT_INITIALIZE,\n\
    onInitMap);\n\n// Add Zoom Event Listener to map instance\nmyMap.addEventListener(com.yahoo.maps.api.flash.YahooMap.EVENT_ZOOM_STOP,\
    \ onZoom);\n```\n\nThe EVENT_INITIALIZE event fires when the map initializes and\
    \ calls OnInitMap to carry out its activity. You are adding EVENT_ZOOM_STOP listener\
    \ to the map applications when the map finishes zooming. As you see, this is a\
