  md: '# Chapter 3


    JavaScript, as mentioned earlier, has a strong ability to control and manipulate
    the browser''s elements (objects). It does this by accessing the DOM (document
    object model) of the browser. The DOM includes the window, location, history,
    document and navigator elements and objects of the browser. DOM control is a key
    ingredient in JavaScript lends itself to the AJAX approach.


    Since JavaScript is ECMAScript language, some of its abilities are featured in
    other languages following the ECMAScript standard. Later in the book you will
    work with Actionscript, the language of Flash and the key ingredient in working
    with the AS-Flash API.


    # Commenting Code


    Like many languages, JavaScript has a way to disable code. This is an important
    part of development. If you are new to JavaScript, a lot of your first passes
    at applications will be the result of much trial and error. You will need to master
    the art of commenting code as you try different ways to do and repeat code your
    first set of classes and the application you develop.


    Commenting is very important when you work on code that will be shared with other
    developers. It gives you a way to tell developers what you were doing and why.
    It is good practice to leave comments before each set of variables as well as
    before each function. Good third-party JavaScript editors will change code to
    a shade of grey when it is commented. This is a very helpful feature, as it helps
    you identify and ignore unused sections of code:


    ```

    //This line is commented out.

    This line is not.

    ```


    ```

    /*

    * This is a good way to

    * comment out multiple

    * lines of code.

    */

    ```


    # Functions and Methods


    A function is a means of executing a task in JavaScript. A key benefit of coding
    a function, as you learned in the earlier example, is that it can become available
    to your entire application. Using functions can save you a lot of time if there
    are tasks that will be called more than once.


    Functions accept parameters, which can be passed when the function itself is called.
    This shows the earlier example modified to pass the URL to load as a parameter:


    ```

    <html>

    <head>

    <title>javascript &equiv; New Window</title>

    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">

    <script language="javascript">

    function newWindow(url) {window.open(url, "newWin", "width=800,height=600")}

    }

    ```'
