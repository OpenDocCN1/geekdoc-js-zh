  md: '# 13


    # # What Is the AS-Flash API


    > > “There is more in the diary than just the map.” Indiana Jones and the Last
    Crusade, 1989


    It is time to explore the ActionScript-Flash (AS-Flash) API. This is the Yahoo!
    Maps API that leverages the power of Flash and ActionScript. This chapter discusses
    the fundamentals of ActionScript, Flash and the AS-Flash API, including


    +   - What the AS-Flash API is

    - The Flash IDE and how it''s used

    - Fundamentals of ActionScript

    - Benefits of the AS-Flash API


    # # What is the AS-Flash API?


    In the previous chapter I began to sing the praises of AS-Flash as a premiere
    visual and dynamic application platform. Now that we are discussing the AS-Flash
    API, it''s time to delve much into what makes Flash, well, flashy.


    This chapter is designed to give you some essential background on Flash. One of
    the benefits of the AS-Flash API is that you can start developing right without
    very much knowledge of coding in.


    However, the more you know, the more you can take advantage of the creative flexibility
    provided by the visual authoring power of the Flash IDE (integrated development
    environment). This ability of Flash is what has made it such a successful tool
    for designing and developing some of the web''s most engaging applications.'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# Chapter 13


    # Flash in Greater Depth


    Most applications fall into a special category of web applications called rich
    internet applications (RIAs). These applications create a more engaging and dynamic
    environment for web users, because of their flexible, intuitive design. Using
    Flash and Flash-based technology, RIAS are able to break out of the common constraints
    of HTML and JavaScript.


    Design plays a big part, as elements are created in Flash that cannot be replicated
    in the HTML world. These elements include both interface objects like buttons
    and form elements as well as background design that often illuminate the background
    of an otherwise white or gray interface. Another advantage of Flash is the transitions
    that are often applied to these elements. A disciplined user (UI) designer will
    know how to apply just the right amount of transitions, often referred to as animation,
    such kinds. Kind can call certain actions and areas of the interface to the attention
    of the user.


    # The Flash IDE


    Flash IDE is the authoring tool to develop applications for Flash. While the term
    Flash can refer to the player or the platform technology, it is usually used to
    mean the authoring tool. Flash was originally made by Macromedia, an innovative
    company purchased by Adobe in 2005. Flash is available as stand-alone software
    for purchase and in stores. It has also been bundled with other multimedia offerings
    such as Fireworks and Dreamweaver.


    Files generated with Flash are commonly output as SWF (ShockWave) files. The main
    visual ingredients of Flash are raster and vector graphics. While JPEG images
    have been displayable in Flash for some time, the latest versions are also able
    to display GIFs and PNGs.


    As a multimedia tool, Flash has little competition. One of its greatest strengths
    is the ability to embed and stream compressed video. This video technology is
    aptly named Flash Video with the .flv. The video, as well as audio, can be sent
    and received, creating some unparalleled communication possibilities.


    A version of the Flash IDE is required to develop and take full advantage of the
    Yahoo! AS-Flash Maps API.


    # Working with the Stage


    Flash is a visual medium and can be easily authored as one. When ActionScript
    2 has permanently changed the way Flash applications are developed, the fact is
    that a majority of Flash’s portfolios are dominated by visually authored tools.
    Flash IDE versions run up to 7 (a.k.a. Flash MX 2004) centered on a timeline and
    stage. These were the primary tools used to author Flash content.


    The timeline represents the frame count of the movie. Certain frames can be marked
    as transition points in the movie. These are called keyframes. Adjusting the number
    of frames between keyframes affects the speed of the transition. Frames can be
    named as well, allowing the movie clip to jump around the timeline based on user
    interaction. The frame rate is also adjustable, enabling you to define how many
    frames play per second. This affects the speed at which animations and transitions
    resolve when the movie is compiled.'
