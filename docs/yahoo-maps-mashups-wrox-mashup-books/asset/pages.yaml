- img_proc: true
  md: "# Chapter 20\n\nsetCenterByLon() also accepts the duration parameter. Since\
    \ there is no conversion between address and lat/lon, the panning effect will\
    \ engage much more quickly:\n\n```\nmapInstance.setCenterByLon (lat:LatLon, duration:Number);\n\
    ```\n\nYou'll notice that the latlon variable does not belong to any of the variable\
    \ types defined in the last chapter. That is the latlon variable being passed\
    \ is an instance of the map API's Latlon object. You must pass a Latitude object\
    \ as the first parameter of the setCenterByLon() method, and to do that, you must\
    \ use the latitude/longitude you want to be as one.\n\nTo create a Latlon object,\
    \ using the coordinates 40.713696,-74.00564 for New York City, you can import\
    \ or reference the Latlon class. The following code demonstrates this using the\
    \ setCenterByLatLon() method:\n\nFor the Flex client:\n\n```\nvar latlon:Object\
    \ = new com.yahoo.maps.Latlon(40.713696,-74.00564)\nvar duration:Number = 300;\n\
    ```\n\n```\nmapConnector.setCenterByLon (latlon, duration);\n```\n\nFor the MapConnector\
    \ class:\n\n```\npublic function setCenterByLon (latlon, duration:Number):void\n\
    {\n  send(\"flashClient\", setCenterByLon \", { lat:latlon,\n  duration:duration});\n\
    }\n```\n\nFor the Flash client:\n\n```\nmyMap.setCenterByLon (latlon, duration);\n\
    ```\n\n# setCenterByLonAddressAndZoom()\n\nsetCenterByLonAddressAndZoom(), this\
    \ method gives you access to a lot of functionality in one shot. The sequence,\
    \ as reviewed before, it is simple as no address must be converted to latitude/longitude;\
    \ if you have this method, you already know the latitude and longitude. As a result,\
    \ this method, its simpler counterpart setCenterByLatLon(), works a bit more efficiently,\
    \ generating faster results.\n\nThe order of operation for this method is follows:\n\
    \n+   1. The method is called:\n   mapInstance.setCenterByLatLonAndZoom (lat:LatLon,\
    \ zoomLevel:Number,\n   duration:Number);\n2. The map pans based on the duration,\
    \ in milliseconds, defined in the duration parameter.\n3. The map centers on the\
    \ resolved latitude/longitude coordinate.\n\n276"
