  md: "# The Ajax API\n\nAs Ajax has become more accepted and better understood, it\
    \ has gained some traction in its development. Due to the strictly object-oriented\
    \ approach of Ajax, those developers and teams tasked with deploying Ajax applications\
    \ can be considered more than just web developers. Front-end engineering is now\
    \ known as the role of implementing web pages, most likely driven by Ajax.\n\n\
    # Fundamentals of JavaScript\n\nWhile the API itself uses Ajax, the map of the\
    \ application you build will consist of JavaScript interacting with the map classes.\
    \ It is very important to gain a solid understanding of the fundamentals and capabilities\
    \ of JavaScript.\n\nJavaScript is a web-scripting language that has ties to the\
    \ programming language Java. It runs in the browser and is executed as an interpreted\
    \ language. This means it does not need to be compiled into another file or build\
    \ to. JavaScript became a very significant language early on, adding new levels\
    \ of interaction and control over the web. Designers used it initially for things\
    \ like animation, browser detection, plug-in detection, status messengers and\
    \ HTML form validation.\n\nAs with any thing that's been around for 10 years,\
    \ JavaScript has been revised several times. While its fundamentals have pretty\
    \ stayed the same, through the years many new uses of the language have been realized.\
    \ Its dependency on the browser has evolved in time. With new browsers invariably\
    \ explored new ways to make their HTML and JavaScript applications more engaging.\n\
    \nOne of the keys to JavaScript's success and continued prevalence is the simple\
    \ syntax it uses. Here is a sample of a popular JavaScript code used with HTML\
    \ to launch a new browser window:\n\n```\n<html>\n<head>\n  <title>JavaScript\
    \ - New Window</title>\n  <meta http-equiv=\"Content-Type\" content=\"text/html;\
    \ charset=iso-8859-1\">\n  <script language=\"javascript\">\n  function newWindow(launchWindow)\
    \ {\n    window.open(\"http://www.mashupeperts.com\", \"newWin\", \"width=800,height=600\"\
    );\n  }\n  </script>\n</head>\n<body>\n  <a href=\"javascript:newWindow()\">Launch\
    \ Window</a>\n</body>\n</html>\n```\n\nYou will notice that the script is set\
    \ in the Head tags of the HTML. This is where the JavaScript is defined and where\
    \ the newWindow function is set. This function becomes available to the rest of\
    \ the code within the HTML and can execute the same code over and again as called\
    \ upon. The newWindow function will create a new browser window by calling opening\
    \ the current browser object, the one you are in. The function is actually called\
    \ when the \"Launch Window\" link is clicked. This link is tagged with javascript:newWindow,\
    \ which tells the browser to call the function of name within the JavaScript set\
    \ of code."
  merge: -1
