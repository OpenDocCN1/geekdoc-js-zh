  md: '![](img/ee60aed724e0f9d7a7d4fc463e96b52a_75_0.png)


    # # Ajax API Advanced Features


    Now that you''ve learned the basic methods and functionalities of the Yahoo! Maps
    Ajax API, it is time to dive into more advanced features. In covering the more
    advanced classes and methods of the API, you will become better equipped to build
    a full-on mashup. This chapter is separated into sections that cover the following
    essential mashup techniques.


    This chapter discusses


    +   - Adding markers to your map, which you can customize to feature labels, HTML
    popups and images

    - Adding tools and compact interfaces with built-in buttons to let the user zoom,
    pan and change map type

    - Coding and adding overlays to the map that can connect lines from point to point
    as well as common GeoRSS feeds


    # # Working with Markers


    You can''t really make a mashup without adding markers. Markers are the indicators
    of important locations on your map. They are added with precision by address or
    latitude/longitude. In addition to methods, there are ways to remove markers programmatically
    based on user interaction. Marker classes enable you to define the type of marker
    you add, or be a standard type or one you can design and develop from scratch.


    You can add markers by one as well as by loading certain overlays. If you have
    a database, XML file, web service response or other data source with many addresses
    or lat/lon coordinates, you will likely use a looping method in JavaScript.'
