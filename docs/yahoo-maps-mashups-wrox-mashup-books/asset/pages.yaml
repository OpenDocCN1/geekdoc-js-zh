    of integrating the Ajax API with your HTML. The web pages you build here will
    become the foundation of each Ajax API and mashup you will build over the next
    few chapters. You will cover how to include the API as well as how to set initial
    parameters. Keep in mind that all methods and classes discussed will be covered
    in much more detail in subsequent chapters.


    # Including the API Classes


    Unlike some of the other map APIs covered in this book, the Ajax API is not a
    component. The API in your HTML, you simply need to include the API library in
