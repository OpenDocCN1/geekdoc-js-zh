    Write down and save the AppID somewhere. You will need it later in this chapter.


    # Software Requirements


    As mentioned in the last chapter, one of the keys of the JS-Flash API (as well
    as the Ajax API) is that it does not require you to buy or use coding or server
    software. While you do need a hosting account or access to a remote server to
    share your mashup with the world, to developing locally is required. If you are
    not a web developer, using Notepad or your favorite text editor will work fine.


    Many web developers and front-end engineers, however, prefer to use an IDE (integrated
    development environment). There are several good ones to choose from, Adobe (formerly
    Macromedia) Dreamweaver and Eclipse. You can get a trial version of Dreamweaver
    at www.adobe.com. Eclipse, which is distributed free under certain licenses, is
    available at www.eclipse.org.'
