  md: '# Developing with Yahoo! Maps


    # Local Search


    As demonstrated in the REST example, local search is a very powerful example of
    data perfect for the map APIs. After being successfully queried, local search
    data returns XML featuring very comprehensive location-based data. The information
    includes business name, contact information, address and the categories related
    to the business. Also is included the rating for the business, an attribute representing
    the collective giving to the business by Yahoo! users.


    The LocalSearchOverlay class mentioned previously will be featured in some of
    the mashup examples that use the Flash APIs. In this class are special markers
    that display local business information and feature a five-star rating interface.


    # Yahoo! Developer Support


    Yahoo! has a tremendous reputation for offering developers trustworthy and well-supported
    APIs. The map APIs are no different. Yahoo offers a wide range of very code references,
    documentation, examples and source code. Particularly useful with maps are the
    "Getting Started" examples available. Like the exercises in this book, examples
    are cut-and-paste, and ready to be inserted and launched.


    # Developer Network


    Yahoo! Developer Network (YDN) is responsible for spreading the word about all
    Yahoo! APIs and development platforms. This group also to distribute and govern
    the APIs. All APIs are listed and supported by YDN receive the same high-quality
    support, no matter how old or new the API is. The support offered by YDN, documentation
    and, is very consistent from one Yahoo! to the next. This is a big advantage to
    developers, making it easy to explore the wide offering of APIs. You may not noticed,
    but each of the APIs in the previous section is a Yahoo! property and all are
    supported under the same roof of YDN.


    Yahoo Developer Network can be accessed at http://developer.yahoo.com.


    # Message Group


    The Yahoo! Maps message group is a support line for developers using the map APIs.
    Messages posted here are by other API developers like you as as Yahoo! developers
    actually working on the APIs. Messages posted consist of questions and answering
    best practices, requests for source code and suggested alternatives to ways of
    implementing the API. The message group is also used by API developers to post
    bugs, learning of upcoming releases and their latest mashups with others.


    Several support groups use Yahoo! Groups. The yws-groups group is a popular place
    to discuss maps and map mashups. Developers and members of the map team exchange
    ideas for working with maps.


    This group can be found at http://tech.yahoo.com/group/yws-maps/'
