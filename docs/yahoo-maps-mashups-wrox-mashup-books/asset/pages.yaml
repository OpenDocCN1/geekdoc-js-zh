  md: '# Maps Application Gallery


    Part of the fun in developing a mashup is being able to share it with others.
    But what if your mashup is so good, do you desire to see it on a greater stage?
    Yahoo! Maps API Application Gallery features the very best, most innovative mashups
    made by users and the development community.


    Featuring mashups made with all the API flavors, the gallery also acts as a launchpad
    and point of inspiration for other developers looking for ideas. Since many of
    the postings push the envelope of the map APIs and stretch them to the limit,
    browsing through the elite postings can give you a good sense of just what is
    possible with the APIs.


    Yahoo! hosts its Application Gallery at http://gallery.yahoo.com. Developers are
    encouraged to submit their mashups and share them with the community.


    # Summary


    This chapter introduced you to the following key map mashup concepts and tools:


    +   - How the Web 2.0 way of web development has made mashups possible

    - That XML data is used in responses to REST queries and in RSS Feeds

    - That Yahoo! APIs such as Flickr, Upcoming.org and Local Search are perfect for
    mashing up with map APIs

    - That the Yahoo! Developer network provides various channels of support for developing
    APIs'
