  md: '![](img/ee60aed724e0f9d7a7d4fc463e96b52a_37_0.png)


    # # Developing with Yahoo! Maps


    In the last chapter, you learned what map applications and their APIs can do.
    As stand-alone applications, they are more than engaging. Now we will explore
    how applying various technologies and a wealth of online data to map APIs will
    form a mashup.


    This chapter discusses


    +   - What a map mashup is

    - Keys and fundamentals of mashup technology

    - A sampling of free online data sources primed for map mashups

    - How Yahoo! supports you in development with the map APIs


    # ## What Is a Mashup?


    Think of a mashup as a cocktail, a mixture of two or more sources of content and
    the spirit of them, you must first understand Web 2.0. Over the past five years,
    web developers have begun to use dynamic technologies and concepts like Ajax,
    Flash, PHP and content syndication in order to build more collaborative and rapid-publishing
    applications. The fruit of this innovation is the wealth of blogs, free APIs,
    comment-driven sites and wik you enjoy on the web.


    Many of the Internet giants, the Yahoos and eBay of the web, have realized that
    to give data away is to promote the depth of their own sites. Web developers are
    enjoying unprecedented access to the very data and programming interfaces that
    were once locked by such successful web pioneers. Access to this content is granted
    almost completely free, with little monitoring, so that you can combine it with
    your own web application.'
  merge: -1
  pgno: 37
- img_proc: true
  md: "# Chapter 2\n\nThis practice of combining data has become so much an art form\
    \ that developers have begun mixing data from one site with data from another's.\
    \ In the case of Yahoo!, which has so many properties, data can be combined between\
    \ two entities like Sports or Local or Flickr and Travel. The essence of mashups\
    \ is the act of combining data to offer to users and the web with your own new\
    \ application.\n\n# XML\n\nExtensible Markup Language (XML) is a file that can\
    \ describe data as well as contain them. Think of XML as a database, but in a\
    \ file format. XML is human-readable, meaning you can read it when you open it\
    \ in Notepad or a coding IDE. As a format, XML is very syntacted and the patterns\
    \ within it are very easy to follow. XML has become the most highly recommended\
    \ way to share data between web sites, software applications and operating systems.\n\
    \nThe code that is an example of an XML file, used to store album information\
    \ in an MP3 player desktop application:\n\n```\n<Albums>\n  <Album>\n    <Title>Abbey\
    \ Road</Title>\n    <Artist>The Beatles</Artist>\n    <Total_Tracks>17</Total_Tracks>\n\
    \  </Album>\n  <Album>\n    <Title>The Fall</Title>\n    <Artist>On The Surface</Artist>\n\
    \    <Total_Tracks>12</Total_Tracks>\n  </Album>\n</Albums>\n```\n\nWrapped in\
    \ the Albums node, information about each individual album is listed within its\
    \ Album node. The code you use to read or parse this XML will look up a specific\
    \ album's data by stepping through each of nodes.\n\n# REST\n\nMany APIs used\
    \ to develop mashups use REST (Representational State Transfer), an architecture\
    \ built on a GET RESPONSE model. Using a URL with appended queries, web applications\
    \ can talk with each other and exchange data. When a request is sent it prompts\
    \ the server to return data. Those data come in the form of XML.\n\nYour application\
    \ will need to get data from another source. You will start with the web service's\
    \ URL, the hostname of the REST service you will call. After you query corresponding\
