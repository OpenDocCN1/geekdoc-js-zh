    # Component Methods


    The set of general methods deals with the physical appearance and presence of
    the map component in your application. These methods let you adjust the appearance
    of the API by modifying the component properties as they exist on the stage. When
    you apply these methods to the map instance, you are not calling methods into
    the classes but rather the component interface itself.


    # move()


    move() enables you to change the position of the component on the stage. This
    method does not affect the contents of the API, but rather the API''s component.


    ```

    mapInstance.move(x:Number, y:Number);

    ```


    This method accepts the x and y coordinates on the stage that you want to move
    the map instance.


    ```

    var newX:Number = 30;

    var newY:Number = 30;

    myMap.getCurrentMapStateType(newX, newY);

    ```


    This call moves the instance, that contains the API, from its default position
    of 0,0 to 30, 30. The displacement is to the right and there is no implied movement
    with this method and the resulting effect will take place without transition.


    # setSize()


    The setSize method adjusts the size of the API component. It is actually essential
    for attaching the component programmatically, as you see in the last chapter.
    The API component''s default size is too small to be useful. When dragging the
    component onto the stage, you need to resize it in Properties to make it viewable
    and usable. The size is true when you are attaching the component.


    ```

    mapInstance.setSize(width:Number, height:Number);

    ```'
