  md: '# Chapter 16


    # Advanced Map Objects and Methods


    The last chapter focused on many of the basic methods of the AS-Flash API. There
    are some additional methods that are not used frequently but are much worth reviewing.
    This combination of set and get methods objects enables you to control the map
    and relay existing maps to your code.


    # LatLonRect(minLat, minLon, maxLat, maxLon)


    The LatLonRect object defines the boundaries (commonly referred as the bounds
    or envelope) of the map being displayed. This object contains four properties
    that when combined let your application determine what to display and what is
    being displayed:


    ```

    LatLonRect.maxLon    //Maximum longitude map is displaying

    LatLonRect.minLon    //Minimum longitude map is displaying

    LatLonRect.maxLat    //Maximum latitude map is displaying

    LatLonRect.minLat    //Minimum latitude map is displaying

    ```


    # setBounds() and getBounds()


    The setBounds() method passes a LatLonRect to change the boundaries of the map
    and effectively modify the map being displayed.


    ```

    mapInstance.setBounds(bounds:LatLonRect);

    ```


    getBounds() returns a LatLonRect representing the existing boundaries of the map
    being displayed. This method is useful for overlaying other map data on top of
    the map API tiles. In other words, this information lets you sync over other tiles.
    Certain data like land parcels, school zones and other imagery are available from
    various services.


    If you know the boundaries of the current display, the various latitude/longitude
    readings available enable you to lay an additional layer on top of the existing
    one(s). This either occurs by serving up tiles or requesting data from a geographic
    information system (GIS).


    ```

    mapInstance.getBounds() : LatLonRect;

    ```


    When implementing this method, you can call a specific property of the LatLonRect
    object when coding it.


    ```

    mapInstance.getBounds().maxLat;

    ```


    When working with a web service to request GIS data, you will likely need to define
    the boundaries (or bound box) in your request. You can''t pass an object as a
    URL parameter in a request, you will need to append each property of the LatLonRect
    object as shown in the previous example.


    # Working with Events


    We discussed AS-Flash API events in the last few chapters. In this comprehensive
    list, you will learn more events that the API fires as certain user interactions
    take place. These events, will positioned in your application, can add important
    timing, delays and control to how you execute other features of your mashup.'
