  md: '# Chapter 12


    # Making a JSON Request


    A JSON request is constructed like a typical REST request. It is important to
    note that an API needs to provide specific format for JSON, but unfortunately
    most do not. Yahoo! Travels JSON, making map overlays easier and more accessible.


    Using a familiar REST response URL, adding the parameter &output=json will instruct
    the API to respond with JSON.


    ```

    http://travel.yahooapis.com/Service/V1/tripSearch?appid=(your_YDN_appid)&query=europe&output=json

    ```


    In JavaScript, for the request to be made, the URL must be embedded in a JavaScript
    src tag, much as you load the classes of the Ajax map API.


    ```

    <script type="text/javascript" src="http://travel.yahooapis.com/Service/V1/tripSearch?appid=(your_YDN_appid)&query=output=json"></script>

    ```


