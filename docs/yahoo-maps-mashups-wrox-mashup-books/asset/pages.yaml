  md: '![](img/ee60aed724e0f9d7a7d4fc463e96b52a_121_0.png)


    # JS-Flash API Basics


    In the last chapter you learned how to set up the JavaScript-Flash (JS-Flash)
    API. You started developing JavaScript-based applications and implemented some
    simple API methods. In this chapter, you will build on that knowledge and learn
    the following:


    +   - How to use methods that control zoom level, the type of tiles the map displays
    and the positioning of the map

    - What data the get methods return and how they can be used to further your application

    - How to listen for and use events events related to the basic methods of the
    API


    # Basic API Methods


    As you have already seen in earlier examples, methods are the building blocks
    of working with an API. These are the exposed functions that you call for specific
    functionality and control the instance of the map API you are working with.


    The JS-Flash API methods are nearly identical to those in the Action-Flash (AS-Flash)
    API, which is covered in Chapters 13-17. While different in their naming conventions,
    they are fundamentally the same as the Ajax APIs. While the parallels will not
    be pointed out in this chapter, should note the similarities, as it will make
    it easier for you to adapt to one API from another.


    # Map Zoom Methods and Events


    The Ajax API offers a set of methods and events to programmatically control zooming.
    Methods can be tied to user interaction, such as clicking a button outside the
    map to change the zoom level of the map tiles being displayed.'
