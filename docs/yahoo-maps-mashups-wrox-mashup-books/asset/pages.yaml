  md: '# API Example and Mashup Index


    Throughout the book, several examples are created to demonstrate the various methods
    and classes of each API discussed. This index provides file inventories and descriptions
    for each of the Yahoo! Maps APIs featured in the book. While the code for these
    examples is covered comprehensively within the chapters of the book, these indexes
    provide you easy access to the online repository of Yahoo! Maps examples at www.mashupeexperts.com.


    # Ajax API Examples


    The following files can be found at www.mashupeexperts.com/maps/ajax and represent
    working examples of API methods and classes covered in Chapters 3 through 7. Additional
    examples will be posted as new features as are released. These .htm files feature
    JavaScript, and you can view their source using the View Source feature in your
    browser, a coding IDE or a simple text reader such as Notepad.


    | Filename | Description |

    |---|---|n| ajax_addControls | Adds the zoomControl, panControl and mapTypeControl
    to a map centered on Seattle, WA. |

    | ajax_addImageMarker | Adds an instance of an image marker of a lighthouse on
    the island of Nantucket. This example also adds satellite tiles. basic marker
    in downtown Boston, MA. |

    | ajax_addOverlay_geoRSS | Using geoRSS XML, adds markers of colleges in and around
    Boston, MA. |

    | ajax_addOverlay_polyline | Using polyline XML, draws a yellow line to indicate
    the route of a cruise ship from Ft. Lauderdale, FL, to the Bahamas and back. |'
