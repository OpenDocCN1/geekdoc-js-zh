  md: '# Chapter 21


    # # Reviewing Objects and Methods


    Having learned the basic functionalities of the AS-Flash API, it''s time to dig
    deeper. The following methods and objects, not used as frequently, are very powerful
    in enabling advanced application development:


    +   - LatLonRect defines the boundaries (commonly referred to as the bounds or
    envelope) of the map being displayed. It contains four properties when combined
    they let your application determine what to display and what is being displayed.


    +   - getBounds() returns a LatLonRect representing the existing boundaries of
    the map being displayed. This method is useful for overlay other map data on top
    of map tiles. In other words, this lets you sync other map data. Certain data,
    like land parcels and school zones, are available from various services. The setBounds()
    passes a LatLonRect to change the current boundaries of the map and effectively
    modify the map being displayed.


    +   - setBounds() passes a LatLonRect to change the current boundaries of the
    map and effectively modify the map being displayed.


    # # Reviewing Events


    As you have learned, events can be instrumental in controlling the timing of your
    application. While reviewing these events, keep in mind that the event can be
    as important as the event itself. It is also good to explore the data object with
    an event when you first use it. In creating Flex 2 to AS-Flash API application,
    you can explore the event easily when you construct your base SWF.


    +   - EVENT_MOVE is broadcast when map moves, whether by panning, zooming or recent.
    The detection can be user-initiated or on code that is executed. This event comes
    with a lot of useful data each time it is fired. Using the for/in method, you
    can drill down into the event''s object and trace the object''s properties and
    values.


    +   - EVENT_PAN_START and EVENT_PAN_STOP are broadcast when map starts and stops
    panning; they are often tied to the setCenterBy methods in the last chapter. The
    event do not include much data with them other than the standard target and type
    properties. They can be very useful in timing the activity of design and interface
    elements in your application. The benefit of the tool is that when it fires, you
    know that the location is centering to, a latitude/longitude or address, has already
    been resolved.


    +   - EVENT_ZOOM occurs when the map zooms by methods like setCenterByLatLon,
    setCenterByAddressAndZoom and setCenterByLatLonAndZoom. This event carries with
    it a lot of useful data that can be used to reset throughout your application.
    Depending on the complexity of your map mash, you may want to keep track of your
    map''s zoom level and zoom, it''s important to track these properties to enable
    precise movements of the other elements in your application.


