  md: '# Chapter 13


    ![](img/ee60aed724e0f9d7a7d4fc463e96b52a_174_0.png)


    # Commenting Code


    As with many languages,ActionScript gives you a way to disable code. This is an
    important part of development. If you are new to Flash and ActionScript, a lot
    of your first passes at applications will be the result of much trial and error.
    You need to master the simple art of commenting code as you try different ways
    to do things and repeat code throughout your first set of classes and the application
    you develop.


    Commenting is very important when you work on code that will be shared with other
    developers. It gives you a way to tell developers what you were doing and why.
    It is good practice to leave comments before each set of variables as well as
    above each function. Good third-party ActionScript comments change code to a shade
    of gray when it is commented out. This is a very helpful feature as it helps you
    identify and ignore unused sections of code.


    There are two ways to comment code in ActionScript. The first uses backslashes
    like this:


    ```

    // This line is commented out.

    // This line is not.

    ```


    ```

    /*

    * This is a good way to

    * comment out multiple

    * lines of code.

    */

    ```


    Commenting frameworks exist that support tools that can extract commenting and
    generate documentation for you. Applications like these are found online and include
    as2api and ACID (Action Info Doc). These tools are built on Javadoc, a tool developed
    for Java that indexes all functions in code and generates API documentation in
    HTML format.'
