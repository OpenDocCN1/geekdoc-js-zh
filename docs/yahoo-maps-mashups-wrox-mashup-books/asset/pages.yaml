    # How It Works


    The upper part of this code is pretty much identical to that of the first example
    in this chapter. You are becoming quite familiar with this code by now. It is
    responsible, once again, for including the Ajax library classes to your web page.
    The mapContainer has stayed the same, as it creates a holder for the map to ultimately
    display in. Consistent with the first example, too, is the map object instantiated.
    The YMap class serves the div location, in this case the mapContainer, to load
    the API.


    The difference starts when the latitude/longitude coordinates are defined. Using
    the YGeoPoint class, the latitude/longitude object will define the map to center
    on when it initializes its load. The Ajax API (as well as the other Yahoo! Maps
    APIs) needs to have the coordinates turned into an object to process them. The
    YGeoPoint serves this purpose, as it creates a JavaScript variable called location.
    Most developers do not know latitude/longitude coordinates, so the address option
    used in the first example may be a bit easier.


    Once the location object is created, it can be passed as a parameter of the drawZoomAndCenter
    method, along with the desired initial zoom level. This will resolve the coordinates,
    center the map on that location and call for tiles at the specified zoom level.
    The last action in this example is to define the type of tiles. Regular tiles
    will show up by default. In the example, which uses setMapType against the map
    instance, you are specifying that satellite tiles will be showing initially.


