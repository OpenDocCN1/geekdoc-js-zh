    # Map Positioning Methods and Events


    This set of basic methods enables you to control the positioning of the map. In
    addition, these methods let you toggle built-in functionalities of the API.


    # setCenterByAddress()


    The setCenterByAddress() method accepts two parameters, address and duration.
    A successful address is a full street address with city, state and ZIP. (Certain
    major metropolitan areas will work as well.) The address is converted by the API
    ge-coder into a latitude/longitude and the map reloads its tiles and centers on
    that value.


