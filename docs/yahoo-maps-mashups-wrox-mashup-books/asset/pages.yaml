  md: '![](img/ee60aed724e0f9d7a7d4fc463e96b52a_137_0.png)


    # # JS-Flash API Advanced Features


    In the more advanced features of the JavaScript-Flash (JS-Flash) API, you will
    begin to see how radically different and uniquely capable the Flash-generated
    map APIs are. Once again, you will benefit from having worked with JavaScript
    and HTML after completing the Ajax API chapters. Combine that advantage with the
    solid foundation of API basics you learned in the last chapter and you are ready
    to develop the advanced features.


    This chapter discusses


    +   - Adding various types of markers to your map, including the CustomSWFMarker

    - Adding tools to your map to let the user zoom, pan and change map type

    - Coding and adding overlays to the map that connect lines from point to point
    as well as generate common geoRSS feeds

    - Working with the built-in mash overlay classes that hook into traffic and Yahoo!
    Local searches


    # # Working with Markers


    You can''t really make a map without adding markers. Markers are the indicators
    of important locations on your map. They are added with precision by address or
    latitude/longitude. In methods, you have to remove markers programmatically based
    on user interaction. Marker classes enable you to define the type of marker you
    add, be it standard markers or markers you can design and develop from scratch.


    Markers can be added one by one as well as by means of loading certain overlays.
    If you have a database, XML file, web service response or other data source with
    many addresses or lat/lon coordinates, you will likely use a looping method in
    JavaScript.'
