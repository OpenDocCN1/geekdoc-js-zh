  md: '# Yahoo! Maps and Flex 2


    ![](img/ee60aed724e0f9d7a7d4fc463e96b52a_277_0.png)


    # # Fundamentals of MXML


    MXML is the markup language of Flex. Its primary function is to store the interface
    and application structure of Flex 2 application. Closely resembling XML in format,
    MXML enables careful coding and practices by easily preparing the presentation
    and data logic of your application.


    Unlike Flash, Flex 2 has no .fla to localize its source code. However, Flex 2
    lets you code Action as stand-alone classes. A simple Flex 2 application may feature
    one MXML file, whereas a medium to large application may need several MXML and
    ActionScript (.as) files. For the simple application, the MXML file acts like
    the .fla, providing the blueprint for deapplication.


    Many developers like this approach the entire interface layout coexists with the
    functionality and logic of the application in one file format. Since no user elements
    or components are signed within a timeline with layers and in frames, MXML-based
    Flex 2 applications can be replicated easily. They also tend to be more easily
    maintained by RIA development teams.


    MXML files can be edited in IDEs other than Flex Builder 2. The most common and
    powerful tool out there happens to be the very Flex Builder 2 is built on. Eclipse,
    mentioned in Chapter 13, "The ASFlash API," is capable of editing many language
    files and has long been a favorite development tool.


    249'
