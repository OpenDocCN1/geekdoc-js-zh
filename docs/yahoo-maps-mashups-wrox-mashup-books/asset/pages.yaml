    # YPolyline


    The YPolyline class gives you the ability to connect points on the map with colored
    lines. This unique

    functionality can be used to define hiking or biking routes throughout a national
    park. For example, it

    let you draw the path of a cruise or ship.


    ```

    // Create YPolyline object

    var polyline = new YPolyline(points, color, width, alpha);

    // Add polyline object as overlay to map

    mapinstance.addOverlay(polyline);

    ```


    The first property in a polyline object is points. These represent an array of
    YGeoPoint

    (latitude/longitude coordinates) that will make the "points" you are connecting.
    Next is an

    optional color property, which will define the color of the line being drawn.
    (It will be colored red by

    default.) Another optional property defines the width of the line being drawn.
    Finally, the alpha prop-

