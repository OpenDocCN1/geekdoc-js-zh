  md: '# Chapter 12


    # Planning and Approach


    As with any application, planning and approach are important. It helps to know
    the APIs and web services you are to work with well. Having completed the previous
    chapters on the JS-Flash API, you should have all you need to work with the map.
    If you completed Chapter 7, “The Ajax Mashup,” you will also know much about working
    JSON. Later in this chapter you will examine the Yahoo! Travel API, where the
    request is constructed and what data is expected upon a successful result.


    Before coding, it is always good to lay out your objectives and then determine
    how best you will achieve your tasks. By thinking out what your application should
    achieve. Through the rest of the chapter, you will see how these steps are developed
    into the mashup.


    +   - Display the map initially.

    - Position the map and set its view accordingly.

    - Call the external API and retrieve the data.

    - Give the user the ability to navigate through the data.

    - Display the data as markers on the map based on user selection.


    What you see listed here is a simple flow, and this pattern of user interaction
    should be easily replicated with other APIs and web services.


    # Yahoo! Travel API


    Yahoo! Travel''s API enables developers to search trips posted on the trip planner
    based on some simple parameters. It also lets you access details on specific trips
    based on more criteria.


    Since Travel is obviously a property of Yahoo, the support for its API is similar
    to that of the Yahoo! Maps APIs. Like Maps, the Yahoo! Travel API and its documentation
    are supported by the Yahoo! Developer Network (YDN). To check out the web service
    firsthand, visit http://developer.yahoo.com/travel/ for more up-to-date documentation
    and news on the API.


    # How Travel Content Contains Location


    Travel''s trip planner uses a form-based interface to collect initial details
    about a user''s trip. After entering a trip title, the dates trip occurred or
    will occur and personal information, the user is presented with a console to enter
    further detail.


    The schedule view lets users enter locations visited on the trip based on the
    initial location entered. With each entry, the user can add details about that
    location or the overall trip. As cataloged locations like hotels, restaurants
    and amusement parks are entered, their respective address information is saved.


    Moving on to the map view, Travel displays an internal mashup of its own that
    leverages the Ajax API to display all locations entered from the previous view
    (see Figure 7-1 in Chapter 7). This is a prime usage


