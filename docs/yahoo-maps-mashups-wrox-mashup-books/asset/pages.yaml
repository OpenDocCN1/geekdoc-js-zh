  md: '![](img/ee60aed724e0f9d7a7d4fc463e96b52a_29_0.png)


    # # Your Map, Your World


    > “When I have the map, I will be free, and the world will be different because
    I have understanding.” — **Time Bandits, 1981**


    This chapter discusses


    +   - What map APIs are

    - What map applications can do

    - The core principles of map technology, including map projection and scaling

    - Why Yahoo! offers three types of map APIs


    # # What Is a Map API?


    As a web user, you probably use map applications all the time, even daily. Map
    applications, like the Yahoo! Maps beta, enable millions of users to find locations
    by address, get directions and search for businesses based on location. These
    useful applications have become some of the most popular and dependable sets of
    functionality on the web.


    As a developer, you have probably worked with maps APIs. API stands for *application
    programming interface*. It is an interface for programming an application, a collection
    of functions to program against. An API, like the Yahoo! Maps API, is designed
    to expose key functionality as functions that, when added to your application,
    enable to access and control the features of the application. In the coming chapters
    you will find that many API calls, like `setByAddress()`, `setZoomLevel()` and
    `setMapType()`, are named after their respective functionalities.


    A map API enables you to develop with much of the useful and dynamic functionality
    of map applications. When it is combined with your existing application, your
    users will benefit from unparalleled, very useful features.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Chapter 1


    # The Four Types of Map APIs


    Yahoo! released version 3 of its Maps in November 2005, and with it a new wave
    of map APIs. Your development world is truly about to expand as you learn about
    each API. There is an Ajax API and two Flash-based APIs, and each type or Flash
    feature has its own set of characteristics. The technology behind each API leads
    to some unique features, and as a result, both the basic and advanced functionalities
    vary while offering many of the core features. The most distinct thing about each
    API is how it is implemented.


    The Ajax API is known for its universal adoption and browser compatibility. This
    API was skillfully built and benefited from tremendous support. Ajax is spreading
    widely across the web and has been key in what has become known as the Web 2.0
    revolution. Its ability to send and receive data without the browser refreshed
    has changed the way map applications are used on the web.


    The three APIs, implemented very differently, are all built on a similar code
    base. There is a JavaScript implementation, which implements almost identically
    to the Ajax API. When Flash is used as an optimal rendering engine, method calls
    to this API are made through JavaScript and then chneled into the Flash client.


    The AS-Flash API requires you to develop with the Adobe (formerly Macromedia)
    Flash IDE. However, this requirement comes ability to control the appearance of
    the map in a way that no other API can offer. The Flash IDE enables you to work
    with the API instance on Flash''s stage, as well as with the programmatic instantiation
    of this API through ActionScript 2.0.


    Flex is a top framework that allows extremely control of user interface (UI) elements
    with a language called Mxml. While Flex still requires some heavy use of ActionScript,
    it provides an environment that allows more rapid deployment. A big strength of
    Flex is its ability to bind control elements with dynamic data sources. With the
    Flex API, you can build what are considered more enterprise-level applications.


    With either the AS-Flash or Flex APIs, you will find it very easy to integrate
    UI elements alongside the map, or blend them within it. This creates a seamless
    and rich user experience, ensuring that your application will be used by users.


    Each API has its own benefits, the Flash-based APIs offer some very special functionality.
    As you will see in the introduction to map features and tools in Chapter 2, "Developing
    with Yahoo! Maps," Flash offers several ways to create your map application.


    # Understanding Map Technology


    To build a map application with Yahoo!s APIs really requires very little, if any,
    understanding of map technology. The more details you understand, the better you’ll
    be to make your map application.


    The first concept is to grasp that of map projection. Most people know the world
    is round, just like globes in elementary school classrooms. Online maps, as well
    as those we print for directing directions, are flat. From the spherical projection
    of Earth to a flat one is called projection. If you were to merely peel off the
    detail of a globe and put it on paper, each piece would connect only at the equator.
    In other words, you could lay each piece of the globe by side by side, but you
    would see gaps grow between the pieces up and down from the middle.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Your Map, Your World


    A projection model called Mercator, named after the sixteenth-century Flemish
    cartographer, solves this problem. This concept of map projection maintains consistent
    width between pieces of a globe. However, to fill the gaps above and below the
    equator, Mercator stretches the north and south scale of the map from the equator
    in either direction, the depiction of Earth on the map is gradually stretched.
    This provides a rectangular representation of a map, one that fills the window
    of a browser and the screen on your monitor. See Figure 1-1.


    ![](img/ee60aed724e0f9d7a7d4fc463e96b52a_31_0.png)


    Figure 1-1


    Another concept in mapping technology is scaling. Simply enabling you to relate
    the distance on a map to actual distance on the ground. Take a look at any map.
    You will probably see a pair of lines, usually on the bottom-left corner, showing
    the distances that represent miles and kilometers on the map. In dynamic web-based
    maps, the scale changes as you zoom in and out of the map.


    # Common Map Features and API Tools


    Because many of the features in Yahoo Maps are offered in the APIs, your users
    will be familiar with what they come across in your applications. Before building
    your application and implementation the map APIs, it is important to get an overview
    of the tools that make map applications work. These are many of the fundamentals
    you will build on in creating your map applications with Yahoo! Maps APIs.


    # Map and Satellite Imagery


    At the core of the map application is the map itself. In most map applications,
    including Yahoo! Maps, map images are displayed with a combination of tiles. These
    tiles represent portions of the map cut into fixed sizes and served to the application.
    When these tiles are combined, they form the viewable map area. To keep the application
    running efficiently, only those tiles in view, as well as some additional rows
    and columns of tiles, are downloaded as a buffer.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Chapter 1


    The Yahoo! Maps API offers three different view types and, with these, three different
    sets of map tiles. The default view, map, presents the standard map tiles. These
    tiles combine two elements. First is the labels layer, displaying street, landmark
    and area names. Landmark labels include parks, shopping malls, intersections and
    railroad tracks, to name few. The second element is a layer of color-coded areas.
    An array of colors is used to indicate with exceptional clarity the size and location
    of bodies water, commercial centers and recreational areas such as ballparks and
    marinas. Both elements are generated from data and keep the map tiles fairly small
    in size.


    The satellite view, provides the most fascinating example of web-based map applications,
    represents the layer made up of aerial images. These images, mostly taken from
    a satellite in space, give us a unique perspective on our world.(In some cities,
    like New York or Chicago, also shadows are invisible due to the height of some
    buildings.)Satellite images are larger in size than map tiles, as they feature
    high-resolution photography. Unlike the maps layer, satellite images are cut into
    smaller pieces. This map application allows to download the tiles progressively
    as opposed to downloading one big image.


    The hybrid view is a combination of both the map and satellite tiles. This provides
    a very effective feature. Street names and labels are displayed on top of satellite
    images, providing more detailed information and removing some of the satellite
    tiles by themselves. While the satellite tiles in the hybrid view are the maps
    are slightly different. The second element is removed, as described earlier, leaving
    the label elements. This creates a transparent effect in the map layer, letting
    the satellite imagery show the street, landmark and area names on top.


    In the application, a set of buttons enables the user to toggle between map-view
    types. Working with the API, you can set the map-view as a default, allowing your
    users to see either the map, hybrid or satellite layers by default. There are
    several ways to introduce controls that allow toggling between layers as. In addition
    to creating your own buttons with calls like getMapViewTypes(), you can also add
    a satelliteControlWidget that mimics the buttons in the Yahoo! Maps.


    # Zooming


    Maps zoom capability allows the user to display different magnitudes of the same
    layer. With the satellite images, photographic layers are compiled at several
    different distances. The map layers are rendered at these respective distances.
    The action of moving between layers, moving your view of the map closer and further
    away, is called zooming.


    Past HTML and JavaScript-based applications included zooming. However, when zoom
    levels were changed, the application needed to completely refresh, leaving the
    zoom level. Yahoo! Maps APIs allow zoom that does not require the browser to refresh.
    The Flash APIs also feature a much more dazzling effect. As the user zooms from
    one distance to the next, the layers actually fade into one another, creating
    a very attractive transition effect.


    There are 16 zoom levels offered in the APIs. Zoom levels are changed by the user
    on the zoom-bar, a user interface element that features plus and minus buttons.
    The plus button zooms in and the minus button zooms out. In the Flash APIs, a
    slide mechanism is placed between the buttons of the zoombar. When the slider
    is selected and moved up or down, like the scrollbar of the side of a browser,
    the map will respond by zooming in and out accordingly.


    4'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Your Map, Your World


    The zoom level can be set by default when the API loads. By calling methods like
    setZoomLevel(), you can programmatically modify the zoom level of the API instance.
    Methods like setCenterByAddressAndZoom() enable you to move the map to a new destination
    as well as to prompt a zoom level change. In the Flash APIs, changing zoom levels
    by calling the API methods will induce the transition effects. See Figure 1-2.


    ![](img/ee60aed724e0f9d7a7d4fc463e96b52a_33_0.png)


    Figure 1-2


    # Panning


    A key functionality of web-based map applications is the ability to pan. Commonly
    referred to as "making the map draggable," panning is the action of moving the
    view of the map in any direction. You may be surprised to know that this feature
    is overall fairly new to map applications. In fact, several map applications still
    do not have panning abilities. Traditionally, maps without panning require you
    to click the direction in which you want to move the map. Once you choose the
    direction, the application must refresh to collect new tiles. Yahoo! Maps and
    the API feature a very well implemented ability to pan, and you can do it in several
    ways.


    In film and television, panning is the technique of moving a camera to create
    a sweeping shot. The effect is called panoramic. Panning applied to maps creates
    a transition so the map moves within the API without the component container moving
    around the screen. In the API, this is achieved by the masking capabilities of
    Flash.


    The best way to pan is to click the map with your mouse and drag it. Effectively,
    what you are doing is moving the map view layer, with all its tiles. Because the
    map view layer downloads tiles as it needs them, panning far enough in any direction
    will likely prompt the application to download and display additional tiles. A
    buffer exists to be displayed so the application has tiles to show as you pan
    beyond the initial downloaded layer.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Chapter 1


    A less discoverable, very effective way to pan over the map with your arrow keys.
    Using your keyboard, the map will pan in the direction of the arrow key you press.
    Those who like to use shortcut keys will find this feature very useful. Like an
    airplane''s throttle, each key actually moves the map in the opposite direction.
    Pressing the up and right arrow keys simultaneously will move the map diagonally.


    When working with the API, you add panning functionality as a tool with `addTool`.
    One of the advantages to using the Flash APIs, as well we explore, is the support
    of a hand instead of a mouse cursor. This adds discoverability to the panning
    feature, as users know what they can drag.


    # Geo-coding


    A map''s ability to plot an address is called `geo-coding`. By means of sophisticated
    backend technology correlating countries, states, cities, ZIP codes, and street
    addresses, an address is turned into latitude and longitude. You may remember
    latitude and longitude (referred to in maps as lat/lon) from elementary school.
    Lat/lon are the axes of a map.


    Most developers don''t know lat/lon coordinates by heart, the map APIs offer built-in
    geo-coding. This can mean passing an address in the API''s initial parameters,
    then that address will be returned by the server as lat/lon, and the API will
    display and load that location. You can call a method like `setCenter()` to perform
    a similar function and change the address during runtime.


    If you know your initial lat/lon, you can set that for when the API loads. By
    using methods `setCenterByLatLon()`, you can change the map centers. A method
    `get()` returns a `LatLon` object representing the center point of the map. In
    the event that an address returns error, the sophisticated API will return a `SuggestedAddress`
    or an array of them. This can be displayed to your users and help them narrow
    down address selection.


    # Markers and Custom Markers


    Markers are locations plotted on a map at specific locations, with icons, images
    and media. They are placed at lat/lon coordinates derived from the server based
    on an initial lat/lon or address. Acting as indicators, markers can represent
    various aspects of data being shown on map.


    Yahoo! Map APIs offer several ways to display markers, using methods `addMarkerByAddress`
    and `addMarkerByLatLon`. More impressive are the variety of markers you can add.
    A `CustomPOIMarker` (POI point of interest) can be added to features out-of-the-box
    interactivity when the user rolls over it. When the user enters this dynamic title
    will be shown. Markers with custom colors


    CustomImageMarkers let you define a marker with a JPEG or SWF file. However, with
    the Flash API you have an even better option. Using `CustomSWFMarker` not only
    defines a marker with a custom SWF, but also lets you call methods on SWF with
    `callCustomMethod`. Basically, you can create your own Flash movie and serialize
    it as your marker. This feature will be explored much more in later examples found
    in Chapter 16, "AS-Flash API Advanced Features.\ For now, look at figure 1-3.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Your Map, Your World


    ![](img/ee60aed724e0f9d7a7d4fc463e96b52a_35_0.png)


    Figure 1-3


    # # Overlays


    Adding to the map creates another layer that stays in sync with the map as it
    pans and zooms. An overlay can contain various elements, all displaying on transparent
    layer above the map. You can add a set of markers to an overlay instead of the
    map, you can control them collectively, using hide() and show().


    Packaged with the Flash API are two powerful overlays, LocalSearchOverlay and
    TrafficOverlay. Your users will be entering local search criteria and a method
    search(). Based on those criteria as well as the center/lon of the map, the API
    will take data returned from the server and add a set of markers representing
    several local findings. The markers in the overlay will display the business name
    and, when engaged by the user, will also display address, contact and rating information
    for that establishment.


    The TrafficOverlay add some very useful information technology to the API. When
    activated, this overlay displays special markers, based on the map''s location,
    featuring traffic incidents such as accidents and closed roads.


    The possibilities of the overlay are limitless. As you learn, the features from
    many data sources can be neatly and efficiently contained within an overlay. Like
    markers, the API offers customizability with classes like CustomSWFOverlay.


    # # Navigation


    An API element found only with the Flash APIs is the NavigatorWidget. This widget
    represents a unique set of user interfaces that provides users with an intuitive
    means of moving around the map. The NavigatorWidget consists of two elements,
    a zoombar and a miniature version of the map, called mini-map.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Chapter 1


    The zoombar handles much like the one we discussed in the earlier section "Zooming."
    There are two buttons, a plus button and a minus button, which handle zooming
    in and out respectively when pressed. The slider in the mini-map is draggable
    and changes the zoom level of the map as it is pressed and dragged.


    Adding to the panning ability of the map is the mini-map element of the NavigatorWidget.
    Featured here is a smaller version of the map, displaying a bird''s-eye view of
    the main viewable area. Just like the main map, the mini-map also consists of
    layers, but it is restricted for various reasons to displayed map tiles. Hovering
    within the mini-map is a distinct gray rectangle. When clicked and dragged within
    the boundaries of the mini-map, this square prompts the main map to pan along
    with. Another feature that usually goes unnoticed is that this gray square actually
    maintains the ratio of the main map should the browser window be resized. See
    Figure 1-4.


    ![](img/ee60aed724e0f9d7a7d4fc463e96b52a_36_0.png)


    # Summary


    In this chapter, you learned the following:


    +   - What a map API is and the basics of its application

    - The three flavors of Yahoo! Maps APIs and their respective technologies that
    will be covered in this book

    - Projection and scaling map technologies

    - Several of the common features of map applications and the map APIs

    - How map tools and interfaces work in the map APIs'
