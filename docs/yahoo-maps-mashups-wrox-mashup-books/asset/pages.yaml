    # setCenterByAddressZoom()


    Developers looking to change the map location and zoom level in one shot has some
    options. setCenterByAddressZoom() is a very capable method and combines the power
    of setCenterByAddress() with setZoomLevel().


    The order of operation for this method is as follows:


    +   1. The method is:

    mapInstance.setCenterByAddress(address:String, zoomLevel:Number, duration:Number);

    2. The address is geo-coded, firing either EVENT_MAP_GEOCODE_SUCCESS or EVENT_MAP_GEOCODE_ERROR.

    3. The map pans based on duration, in milliseconds, defined in the duration parameter.

    4. The map centers on the relative latitude/longitude coordinate.

    5. The map zooms to the level defined in the zoomLevel parameter.


    Common usage with this method looks like:


    ```

    var address:String = "San Francisco"

    var zoomLevel:Number = 6;

    var duration:Number = 3000;


    myMap.setCenterByAddress(address, zoomLevel, duration);

    ```


    The first three lines declare and set the variables to pass inside the method.
    Finally, the method is called. Note that zoomLevel occurs between address and
    duration.


