    # Advanced Features: Flex 2 Using the AS-Flex API


    Widgets are the prepacked sets of user interfaces that ship with the map API.
    They reflect some of the most commonly used technology on consumer map applications
    like Yahoo! Maps. Adding widgets can save you time over having to replicate the
    functionality with your UI API. Adding your knowledge to your system asAsFlexAPI,
    MapConnector and Flex2Maps classes requires little modification.


    # Working with Widgets


    The simple methods available for widgets are part of the map class. These methods
    are available when the map instance is initialized. However, without importing
    the class of the widget you want to add, you cannot use these methods.


    # addWidget()


    This method simply adds a widget to your map instance. In most cases, you will
    want to create an instance of the widget and then plug that instance into the
    method as its lone parameter.


    ```

    mapInstance.addWidget(widget:Object);

    ```


    # removeWidget()


    Like the tools, this method removes the widget, effectively deactivating its functionality
    to the user. It accepts one parameter, the instance name of the widget it is removing.


    ```

    mapInstance.removeWidget(widget:Object);

    ```


    # Widget Classes


    These classes included with the API come with all you need to turn on each of
    their functionalities for users. Each class must be imported and you should create
    an instance of the widget adding it to the map. This lets reference that throughout
    your code, you can remove it more easily and add listeners to it.


    +   - NavigatorWidget: The Navigator represents the most functional feature that
    comes with the API. While not customizable in appearance, the Navigator widget
    provides er functionalities with very little code. The NavigatorWidget has the
    ability to open (expanded) or close (collapsed). Two methods, open() and close(),
    are included in the class. They can be called against the widget''s state to change
    after it has been added.

    - ToolBarWidget: This widget adds a menu of icons to the top-left of your map.
    It acts as a start menu, like one found at the base of the screen in your operating
    system. Its contents are a row of icons, each representing a tool that you added
    to the map.


