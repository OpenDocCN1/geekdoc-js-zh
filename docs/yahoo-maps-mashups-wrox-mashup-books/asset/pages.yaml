  md: '# Chapter 13


    ![](img/ee60aed724e0f9d7a7d4fc463e96b52a_178_0.png)


    # Events


    ActionScript gives you a way to send messages between classes that are otherwise
    not lined together. Based on user action, data activity or general operation of
    the application, code can broadcast events. Objects event listeners are set up
    to detect broadcast events, and on the event fired, will perform the action by
    calling a method. In many cases, object data are passed along with an event and
    thus treated as parameters when the method is ultimately called.


    Many actions that the map API are interwoven with broadcasting events. From the
    start, an event called EVENT_INITIALIZE is broadcast triggered by this event.
    Another good example of an event is the series of events fired in order to zoom
    the map. The event EVENT_ZOOM is fired when the map starts zooming, followed by
    EVENT_ZOOM_STOP, which is broadcast when the map stops zooming.


    As mentioned earlier in this chapter, the event handler is always paired with
    a method to follow through with the purpose of the event and with the object data
    it places. This method is often given a similar name to that event. It is good
    practice to do this, as it will enable you and other developers looking at your
    code to identify what an event is doing when it is called within your code. Large
    applications often have a class setup that handles events exclusively.


    Methods paired with events can also be called by other code. This makes for very
    efficient coding as you can accomplish actions in your code by listening for events
    and by calling a method based on user interaction. Event listeners can also be
    deleted programmatically, if there is a point in your code you no longer need
    to handle a specific event. This does affect the method paired with the deleted
    event listener, ensuring its availability to other processes in your application
    that may call it.


    # Benefits of the AS-Flash API


    As you can see, Flash and ActionScript are powerful tools when used together.
    The AS-Flash API is special because of the Flash platform it leverages. Working
    with the API and developing this technology.


    150'
