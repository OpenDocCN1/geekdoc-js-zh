    # addMarkerByLatLon()


    This method lets you add markers to a location using a latitude/longitude coordinate.


    ```

    markerinstance.addMarkerByLatLon(markerClass:Class, latlon:LatLon, data:Object);

    ```


    As with addMarkerByAddress(), the markerClass parameter is the type of marker
    you are adding. The types can vary within the same mash but respect their respective
    classes to be imported.


    The second parameter defines the location where the marker will be added. The
    LatLon class must be imported or referenced in order to properly cast the latitude/longitude
    coordinates into a LatLon object.


    Once again, the properties of the markerClass you choose must be defined in the
    last parameter. These properties will be discussed with each marker class below.


    # removeMarker(marker)


    To remove a specific marker, you can call removeMarker() against the marker instance
    you have added.


    ```

    markerinstance.removeMarker(marker:Object);

    ```


    # removeAllMarkers()


    removeAllMarkers() will clear out all markers that have been loaded to the map
    instance. Since this method does not affect any single marker, but rather all
    markers, it needs a parameter.


    ```

    markerinstance.removeAllMarkers();

    ```


    # Marker Classes


    Marker classes are packages of elements and other classes that enable you to add
    a variety of markers to your map. Think of each marker class as a different marker
    type. A variety of markers are available in the AS-Flash API, ranging from the
    simple black waypoint marker to the customizable custom POI marker. You can apply
    your creativity and Flash design skills to developing your own custom SW marker.


    The various marker classes have their own properties, set when the marker object
    is created. adding the marker to the map, you define which type of marker you
    are adding by passing the class and the properties you have set in the marker
    object.'
