    LocalSearchOverlay adds a feature that taps the Yahoo’s local search database.
    The functionality closely resembles that of the "Find on Map" feature on the Yahoo!
    Maps consumer application. The markers are enriched with very useful data for
    any user and consumer, including business name, address, and where available,
    business rating.


