  md: '# Chapter 15


    setZoomLevel() sets the zoom level of the map. It accepts one parameter, a number,
    that is the value of the zoomLevel you want to change the map to. The zoomLevel
    can be set to a value between 1 and 16.


    ```

    mapInstance.setZoomLevel(zoomLevel:Number);

    ```


    In this sample, the zoomLevel is set to 6:


    ```

    myMap.setZoomLevel(6);

    ```


    Two events are broadcast when the zooming is engaged in the API EVENT_ZOOM_START
    is fired when the API starts zooming, and EVENT_ZOOM_STOP is sent when the API
    has completed zooming.

    You can use the zoomLevel with user interaction. You can design buttons to increase
    or decrease the zoom level of the map. You can combine these buttons with a slider,
    ranging from 1 to 16, to create a zoombar. In Chapter 16, “AS-Flash API Advanced
    Features,” you will learn how to use the NavigatorWidget, an interface that combines
    a zoombar with other useful tools to help users navigate your map.


    # setCenterAddress()


    The setCenterAddress() method accepts two parameters, address and duration. A
    successful address is a full street address with city, state and ZIP (Certain
    metropolitan areas will work well) The address is converted by the API geo-code
    into latitude and longitude, and the map reloads its tiles and centers on that
    value.


    To transition smoothly, you can use the duration parameter to tell the API how
    long it should take to pan from its current position to the new one you have defined.
    The duration parameter is in the number of milliseconds the map will pan to:


    ```

    mapInstance.setCenterAddress(address:String, duration:Number);

    ```


    This example shows what the code would look like to change the address to San
    Francisco and pan from its current location for 300 milliseconds:


    ```

    var address:String = "San Francisco"

    var duration:Number = 300;

    ```


    ```

    myMap.setCenterAddress(address, duration);

    ```


    Some events are fired when setCenterAddress() is called. EVENT_MAP_GEOCODE_SUCCESS
    is dispatched when the API has successfully geo-coded the address passed in and
    resolved it as a latitude/longitude coordinate. If the address entered cannot
    be geo-coded, the EVENT_MAP_GEOCODE_ERROR is broadcast. In this happen, an array
    of suggested addresses will be sent as a data object with this event along the
    originalAddress. You can use the message attribute returned with this event to
    alert users to try a new address or select a suggested one. Since international
    geo-coding recognizes so many variations of city names, it is difficult to generate
    a geo-coded error

    event.


    166'
