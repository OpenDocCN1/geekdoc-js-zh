    # Benefits of the JS-Flash API


    The greatest benefit of developing with the JS-Flash API is the ability to include
    a Flash-generated map without knowing Flash. This means your users will enjoy
    the smooth transitions and enhanced visual features that Flash provides. The map
    tiles appear in a precompiled SWF that is loaded when you include the JavaScript
    library. By using JavaScript, CSS and DHTML, you can easily position and control
    the map.


    Another benefit is the JS-Flash API''s ability to serve as a great transitional
    API. Its position in this book is no accident. Understanding the Ajax API teaches
    you how to work with the Ajax API and include the JS-Flash API. However, being
    able to work with the JS-Flash API will set you up to code with the AS-Flash API
    later in this book.'
