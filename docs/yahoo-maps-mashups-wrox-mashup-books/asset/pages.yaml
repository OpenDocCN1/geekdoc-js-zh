  md: 'Developers find working with IDEs an improved coding experience for many reasons.
    One of these is file management. Dreamweaver Eclipse feature ways to manage files
    along the coding window. Dreamweaver allows you to open and move all the files
    within your site. FTP ability, to actually upload your files right to the server
    as you do. Other great benefit, which helps coders at all skill level, is code
    hiding. This is a special feature, but based on the language you are coding with,
    allows the IDE to colorize elements of the code. It can also offer a list of properties
    and methods available as you type an object or variable.


    # Transitioning Between APIs


    Having completed the Ajax API chapters, developing many examples and a full-fledged
    mashup, you already have a solid understanding of building Yahoo! Maps-based mashups.
    As you transition from Ajax-generated maps to Flash map APIs, by way of learning
    the JS-Flash API, you may note some key differences in format and functionality.


    While the JS-Flash API benefits from being included in your HTML in a nearly identical
    way to the Ajax API, some key differences do exist. These differences will be
    pointed out in this chapter and the next to the transition between APIs. The slight
    differences you will observe different names for classes and methods as well as
    different means of creating objects.


    As you move into the basic- and advanced-feature chapters in this book about the
    JS-Flash API, you will be introduced to many new tools, widgets and marker types
    that become available with the Flash APIs. Also new will be the custom SWF classes,
    consisting of marker, overlay and tool capabilities that can be completely customized
    by you.


    # Integrating the JS-Flash API


    This chapter features two examples that will walk through the simple steps of
    integrating the JS-Flash API with your HTML. The web pages you build here will
    become the foundation of each sample and mashup you build over the next few chapters.
    You will cover how to include the API as well as how to set initial parameters.
    Keep in mind that all methods and classes discussed here will be covered in more
    detail in subsequent chapters.


    # Including the API Classes


    Unlike some of the other map APIs covered in this book, the JS-Flash API is not
    a component. To include the API in your HTML, you simply need to include the API
    library in your document. This is done by defining the library `src` URL in the
    JavaScript tag within your HTML document. This includes all the latest classes
    and methods that will enable you to display and control the map within the API.
    The first exercise will set you up with the baseline code you will use throughout
    the next several chapters.'
