  md: '# Advanced Features: Flex 2 Using the AS-Flex API


    # Overlay Classes in Review


    +   - WaypointMarker: A waypoint is a reference on the map, often used in navigation
    to plot points along a route. This class lets you plot viewpoints as markers.
    It is a very simple class, with almost no customization than defining an index.
    If you are familiar with the consumer offering of Yahoo! Maps, you will recognize
    the waypoint marker as the same indicator used to plot points along driving routes.


    +   - CustomImageMarker: This class lets you draw an image or SW anywhere on the
    map as a marker. It is a slightly more customized approach than the CustomPOIMarker
    discussed in an image or SW that creates the marker. Since the marker is completely
    of your own design, the only property of this class is the uri of the image (JPEG)
    or SW.


    +   - CustomSWMarker: This is one of the key features of the AS-Flex API, as it
    lets you design your own interactive marker in the framework of a SW. Once the
    marker is added to the map instance, this class lets you call a method, callCustomMethod,
    and manage the marker itself. This means you have control over the marker after
    you have added it.


