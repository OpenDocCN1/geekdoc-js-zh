  md: '# Introduction


    Yahoo!® Maps Mashups provides you with all the information about map technology,
    the tools and features of maps, the basic methods and advanced techniques of APIs
    you need as a developer to build amazing map mashups. In addition, and because
    of the wide array of Yahoo!''s offerings, the book details the technology and
    building map mashups each API features. The ultimate goal is for you to be able
    to download, install and develop mashups with one or all of the Yahoo Maps APIs.


    # Who This Book Is For


    The book will benefit readers at all levels of development experience. Those interested
    in Yahoo! Maps APIs and building maps will have their fingertips all they need
    to build amazing map applications. This book covers a wide array of technologies
    at different levels. Many readers will find it useful and enjoyable:


    +   - The developer new and completely open to maps APIs and the technologies
    you feature

    - Developers looking to broaden their understanding of Web 2.0 and rich Internet
    connection (RIA) technologies

    - Intermediate or experienced JavaScript or Ajax or Flash and Flex 2 developers
    who are looking to expand their skill into map development

    - Fans of Yahoo! Maps Mashups who want documentation and cut-and-paste mashups
    in their layers


    While further reading is not required, you may benefit from books such as Beginning
    ActionScript2.0 (Wiley Publishing, ISBN 978-0-7645-7768-0) and Professional Ajax
    (Wiley Publishing, ISBN 978-0-471-77778-6).


    # What This Book Covers


    Yahoo! Maps Mashups details the documentation, approach, methodology, architecture
    and design of the Yahoo! Maps APIs.


    The Yahoo! Maps APIs are some of the most powerful APIs available. With tremendous
    support for Ajax and Flash technologies, Yahoo! Maps API offerings lets developers
    push map technology to its limits and beyond. With an unparalleled capacity for
    customization and integration of external data, the APIs developers build unique
    mashups.


    Yahoo! Maps Mashups explores each API flavor, guiding the developer through the
    simple, yet comprehensive sets of API calls. With three APIs to cover, any developer
    certainly has a choice of technologies. This book guides you through the capabilities
    of each technology through its respective API. As each'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Introduction


    API is introduced, the benefits of that API, its architecture, and the technology
    used to implement it are reviewed.


    Each API distinctly features its own Web 2.0 or richer Internet connection. The
    book uses each API''s uniqueness to explore its basic and advanced set of API
    methods, classes, and events. With each API comes an analysis of the technology
    it drives.


    The principal technologies that make up the book, Ajax and Flash, are often very
    segregated and seldom a developer cross the line between the two. The book makes
    little comparison between the technologies, rather than putting the benefits each
    one developer gives the the efficiency and capability of the API it drives.


    # How This Book Is Structured


    With the goal of helping the developer build his or own map mashup with the Yahoo!
    Maps API of their choice, Chapter 1: "Your Map, Your World" defines an API and
    how it differs from a regular application. It highlights common features and tools
    offered by existing mappings, pointing out that Yahoo! has made many of these
    features available to developers for implementation in their own mashups.


    Chapter 2: "Developing with Yahoo! Maps" introduces to the concept of a mashup.
    It covers some of the many data sources that can be loaded into the API, including
    such brands as Flickr and Upcoming.com. It also explores mapping with data from
    Hotjobs and Yahoo! Local. Also in the chapter is covered Yahoo''s support through
    its developer network and message groups; these will give confidence to the soon-to-map
    API developer.


    Chapter 3: "The AJAX API" begins a comfortable and comprehensive pattern, launching
    an examination of each of the two Yahoo! Maps APIs and implementations. Starting
    with the AJAX API, Chapter 3 defines the API technology, HTML and JavaScript.
    It also discusses the benefits of the AJAX API.


    Chapter 4: "Get Started with the API API" covers the steps you need to execute
    to get started with the API, including the simple and direct process of getting
    an application ID, software requirements and key steps to prepare code for API
    integration.


    Chapter 5: "Ajax API Basics" immerses you in the API, covering the basic calls
    and fundamentals of the API, including the map view type, setting the zoom level
    and setting the address. This chapter features rich, copy-and-pasteable samples
    intended to get the user running with simple API examples.


    Exploring the more advanced techniques of the API, Chapter 6: "Ajax API Advanced
    Features" features descriptions and code samples of API methods like adding custom
    markers and custom objects and panning programmatically.


    Once you''ve gone through the basic and advanced aspects of the API, Chapter 7:
    "The Ajax Mashup" features a project for the AJAX API. The mashup combines data
    from the Flickr JSON API with With the comprehensive code of the application,
    you will have all you need to deploy your first map mashup.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Introduction


    The rest of the book follows a similar pattern to the review of the Ajax API.
    The chapters cover the benefits and technologies of each API. Since the implementation
    of the Ajax API and JavaScript-Flash API are similar, Chapter 8: "The JS-Flash
    API" points out how to easily depart from Ajax to the JavaScript-Flash API. This
    provides a further transition between the single Ajax API and the Flash APIs.


    Both Flash API and the ActionScript-Flash API/Flex 2 implementation parts begin
    with an introduction (Chapter 8: "The JS-Flash API," Chapter 13: "The AS-Flash
    API" and Chapter 18: "Yahoo! Maps and Flex 2") followed by a chapter (Chapters
    9, 14 and 19) on getting started. The "basics" chapters (Chapters 10, 15 and 20)
    for each Flash API, along with the advanced chapters (Chapters 11, 16 and 21)
    once again immerse you in that API.


    Each discussion of API concludes with a chapter (Chapter 12: "The JS-Flash Mashup,"
    Chapter 22: "The Flex 2 Mashup") featuring a comprehensive project. Each mashup
    is designed to push the limits of the API it is built with, giving you all the
    tools you need to recreate such an application and yourself, as a developer, well
    on your way to building your own amazing mashups.


    # What You Need to Use This Book


    To install and run much of the examples and software mentioned in this book you
    will need the following:


    +   - Windows XP or Mac OS

    - Internet Explorer 6.0 or higher (Windows), Mozilla 1.5 or higher (all platforms),
    or Safari 1.2 or higher (Mac OS)

    - The JS-Flash API and AS-Flash APIs require Flash Player 7 or higher and will
    play on future releases. The Flex 2 requires Flash Player 9 and will play on future
    releases

    - Various code-authoring tools, detailed throughout the book. Trial download instructions
    are covered as needed


    # Conventions


    To help get the most from the text and keep track of what''s happening, we''ve
    used a number of conventions throughout the book.


    # Try It Out


    The Try It Out is an exercise you should work through, following the text in the
    book.


    +   - They usually consist of a set of steps.

    - Each step has a number.

    - Follow the steps with your copy of the database.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Introduction


    # How It Works


    After each Try It Out, the code you''ve used will be explained in detail.


    > Boxes like this one hold important, not-to-be-forgotten information that is
    directly relevant to the surrounding text.


    Tips, hints, tricks, and aides to the current discussion are offset and placed
    in italics like this.


    As for styles in the text:


    +   - We highlight new terms and important words when we introduce them


    +   - We show keyboard strokes like this: Ctrl + A


    +   - We show file names, URLs and code within the text like so: maps.getZoomLevel().


    +   - We present code examples in two different ways:


    > In code examples we highlight new and important code with a gray background.


    The gray highlighting is not used for code that''s less important in the present
    context, or has not been shown before.


    # Source Code


    As you work through the examples in this book, you may choose either to type in
    the code manually or to use the source code files that accompany the book. All
    of the source code used in this book is available for download at www.wrox.com.
    Once at the site, simply locate the book''s title (either using the Search box
    or by using one of the lists) and click the "Download Code" link on the source
    page to obtain all the source code for the book.


    Because many books have similar titles, you may find it easiest to search by ISBN;
    this book''s ISBN is 978-0-470-09778-6.


    Once you download the code, decompress it with your favorite compression tool.
    Alternatively, you can go to the main Wrox code download page at www.wrox.com/dynamic/books/download.aspx
    to see the code available for this and all other Wrox books.


    # Errata


    We make every effort to ensure that there are no errors in the text or in the
    code. However, no one is perfect, and mistakes occur. If you find an error in
    one of our books, like a spelling mistake or faulty piece of code, we would be
    very grateful for your feedback. By sending in errata you may save others and
    at the same time you will be helping us provide even higher quality information.'
  merge: -1
