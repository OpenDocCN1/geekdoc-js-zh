    \ of yellow lines connecting Ft. Lauderdale, Florida, with various points in the\
    \ Bahamas.\n\n# How It Works\n\nAfter setting up the map to display with the usual\
    \ style and div tag, the initial map properties are set. The map's type is defined\
    \ when the map object is created and is to display hybrid tiles. Using drawZoomAndCenter,\
    \ the map is centered on an address and the zoom level is set.\n\nA series of\
    \ YGeoPoints are defined and will represent the points to be drawn to. The Polyline\
    \ object is created and passes the list of defined points, along properties defining\
    \ the line style to be, yellow and semitransparent.\n\nAs the Polyline object,\
    \ represented by polyOverlay, is added, the API will draw a series of lines in\
    \ a layer above the map. This layer will stay attached to the map as you pan,\
    \ drag and zoom it.\n\n# YGeoRSS\n\nThis class and type of overlay enables you\
    \ to populate the map with markers defined from a geo-coded RSS feed. This special\
    \ version of RSS XML contains geo-coded addresses. A GeoRSS feed adds extra data\
    \ like latitude/longitude in addition to location information. The following is\
    \ a sample of a geoRSS feed that will be used in the upcoming exercise:\n\n```\n\
    <item>\n  <title>Title to appear in Marker</title>\n  <link>Link to appear in\
    \ Marker</link>\n  <ymaps:Address>Address where Marker will locate on</ymaps:Address>\n\
    \  <ymaps:CityState>Address where Marker will locate on</ymaps:CityState>\n  <ymaps:PhoneNumber>Phone\
    \ Number to appear in Marker</ymaps:PhoneNumber>\n</item>\n```\n\nThe GeoRSSOverlay\
    \ is fed this XML as a URL. The parameter is set when the overlay instance is\
