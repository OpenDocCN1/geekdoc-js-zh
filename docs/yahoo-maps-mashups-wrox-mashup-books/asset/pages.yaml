    \ chapters of this book, exercise will be the foundation for what you will do\
    \ with this API.\n\nIn order for the application to list for EVENT_INITIALIZE,\
    \ a method called addEventListener must be added to the map component's instance.\
    \ This method accepts two parameters: the event (com.yahoo.maps.api.flash.YahooMap.EVENT_INITIALIZE)\
