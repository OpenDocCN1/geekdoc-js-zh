  md: '# Chapter 22


    # # Making the Video


    There''s a little bonus for you in this mashup project: you get to work with Flash
    Video. Flash''s Video for- (FLV) represents one of the most highly praised yet
    video formats available. Since its introduction in 2002, Flash video has benefited
    from the high impression usage of the Flash Player.


    Flash video can live within your Flash application in three different ways. Embedded,
    the video material lives within the Flash application, enabling you to manipulate
    actual video content via the timeline. The major downside to this method is that
    the video cannot be dynamic. Also, if the video is too long, it may cause performance
    issues for the user.


    Another way to include Flash video is progressive download. This is the most common
    technique. It requires you to keep the video outside the Flash application, meaning
    that it is loaded dynamically. The main benefit is that should the video change
    you will not need to recompile your application. Another benefit is that the video
    can be loaded by other applications, as it will likely be hosted on your server.


    The last option for including video in your application is to stream it. While
    this is the best way to feature video, it is not a popular option for independent
    developers. This is because to stream video, you need to leverage the Flash Media
    Server (called MMS, formerly Flash Communication Server). Streaming video and
    using MMS introduces all sorts of new, including the ability to control and monitor
    performance as well as the ability to use cameras for real-time chatting.


    For this mashup, you will be applying the progressive download method. While the
    FLV you is already created and available (you added the links to the FLV files
    when you coded the MXXML), you will now learn the steps to create your own FLV
    files.


    # # Converting Media to Flash Video


    You start by creating or owning your video content. Using a hard drive or media-based
    camera like a Sony HD1 or Canon EOS is your best bet. This way you can pick video
    off the camera or its removable media. You can also use a digital camera, but
    that will require you to pull the video off using fire technology. For a quick
    and cheap way of obtaining your video, you can use a webcam and capture its output
    to your computer.


    Once you have the video, it is time to convert it to FLV. This process requires
    you to load the video into Flash, compress it and export it as an FLV.


    # Try It Out Make an FLV File


    You will need to acquire a video file (.mov, .avi, .mpeg4 and many others) to
    complete these steps. You should also have a server account where you can host
    and serve the FLVs from. (The following may vary slightly with newer versions
    of the Flash IDE).


    +   1. With the Flash IDE open, create a new Flash document.

    2. Save the Flash document as Ymaps_video.fla.

    3. Go to File -> Import Import to Library.

    4. Browse to where you have stored the video file on your system and press Open.


    314'
