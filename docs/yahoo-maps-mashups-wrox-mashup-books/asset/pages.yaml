  md: '![](img/ee60aed724e0f9d7a7d4fc463e96b52a_155_0.png)


    # # The JS-Flash Mashup


    The goal of this chapter is for you to build a JavaScript-Flash (JS-Flash) mashup
    using the JS-Flash API and Yahoo! Travel. To achieve this, you will also accomplish
    the following:


    +   - Establish an idea for your mashup and plan the details and development approach

    - Learn how to retrieve external data from the Yahoo! Travel API and display it
    on the map

    - Create links that center the map on a trip plan stored in Yahoo! Travel


    # # Time to Mash Up


    Now that you have learned all the methods and classes of the JS-Flash API, it''s
    time to build a mashup. As with other APIs featured in this book, this chapter
    will guide you through building a mashup with a data source and the map API.


    # # The Big Idea


    Yahoo! Travel is a property of Yahoo! that lets users book airline tickets, hotel
    reservations and cars. Their new trip planner lets users plan out trips they are
    looking to take as well as logs trips they have taken.


    Trips are naturally compatible with maps since every trip has a location. While
    maps themselves are sufficient stand-alone applications, displaying trip data
    on top of a map is even more useful.


    In this chapter you will build a mashup between Yahoo! Maps and Yahoo! Travel
    from the trip planner. Upon completion, you will see and be able to show your
    users trips that have or will be across Europe. Each trip will be marked by a
    thumbnail of a photo at that location. You will add functionality to clicking
    the marker will send your users to the trip planner site to view more details
    of that trip.


    This highly scalable and adaptable project will introduce you to common functionality
    that you can apply with several other APIs and web services.'
