    # # Yahoo! Maps and Flex 2


    > “What led you to assume there’s this invisible map?” — National Treasure, 2004


    As of this writing, Yahoo! Maps APIs do not cater specifically to the latest offerings
    of Flex 2. However, developers wanting to get more out of Yahoo’s existing ActionScript-Flash
    (AS-Flash) and Flex API support have found ways. Building mashups with Flex 2
    is very rewarding.


    This chapter discusses


    +   - What Flex is, its history and the technology behind it

    - The Flex 2 development environment, built on Eclipse and the example applications
    that come out of the box

    - Fundamentals of MXML and how Flex applications work

    - Benefits of using the AS-Flash API with Flex 2


    # ## Finding Out About Flex


    Like Flash, web applications drive the rich Internet applications (RIAs) that
    have sprung up on in recent years. Flex is a Flex platform technology and, when
    compiled, results in the SWF extension. Flex relies on ActionScript to execute
    much of its advanced capabilities. However, Flex enables you to program the user
    interface using a language called MXML.


    MXML, interpreted by Flex when an application is compiled, gives you full layout
    and stylistic control. It also acts as an efficient conductor between the Flex
    controls you add to your application and the data services and remote logic you
    choose. As you will see in the coming chapters, MXML is easy to learn and code.
    It makes Flex highly reliable, scalable and a remarkably effective plat-form for
    developing map mashups.'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# # Chapter 18


    # ## The History of Flex


    Macromedia, now Adobe, first released Flex 1.0 in 2004. It was quickly followed
    by the updated and improved version 1.5. Flex promised an improvement over Flash
    MX 2004, the existing version of Flash at the time, in several ways. With Flex,
    a developer


    +   - Develop Rich Internet applications without knowledge or experience of Flash

    - Create a development model that would be familiar to ColdFusion, JSP (Java Server
    Pages) and ActionScriptNET (Active Server Pages) programmers

    - Build a simple application layout using containers, a methodology used in prominent
    object-oriented application languages


    Flex also enables users to implement integration between a simple design layer
    and business logic, and supported control styling with common CSS (Cascading Style
    Sheets).


    As Flex was initially presented to companies as an ideal enterprise-rich media
    solution, it was met with a divided reception. Designers and those who had mastered
    RIA with Flash dismissed it as not customizable and too cumbersome. That latter
    claim was far off. Because Flex needed to carry its framework, no matter how big
    or small an application was, chances are the result was going to be a little top
    heavy. Flex loyalists argued that they could design and deploy RIAs that were
    much lighter and more configurable.


    On the other hand, hard-line IT groups were comfortable with the existing infrastructures
    and simple approaches were interested in Flex. It gave them the chance to join
    the dynamic flow of the web without giving up much of their conservative methodologies.
    They saw no animation or timeline in Flex. To them it was a different way of doing
    things.


    Flex was adopted and used in many high-profile sites including KodakGallery (then
    Ofoto), Dow, Jones, Yahoo! Maps and the Yahoo! Maps Flex API. See Figure 18-1.


    As technology evolved, so both Flex and Flash. When released, Flex 1.5 and Flash
    MX 2004 pushed the limits of the current Flash Player, version 7. In August of
    2005, Flash 8 and Flash Player 8 were released, but there was no master release
    from the Flex side.


    Finally, in July 2006, Flash 9 was released. Interestingly, its predecessor, the
    new player was not accompanied by its Flash IDE counterpart. Adobe already released
    Flex 2, though improvements in speed, size and affordability. Still leveraging
    MXL, Flex 2 also performs well on ActionScript 3, the new version of ActionScript
    that takes full advantage of the many upgrades found in the Flash 9 Player.


    Flex 2 is a bit more welcoming to Flex developers, mostly because of the new authoring
    environment you will learn about later in this called Flex Builder 2. Without
    a visual authoring environment, timeline, stage or frames, Flex Builder 2 instead
    uses MXML to drive very simple layouts. Adding ActionScript 3 gives you a substantial
    improvement over event handling, transitions and other elements that enhance the
    interactivity of your application.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Yahoo! Maps and Flex 2


    ![](img/ee60aed724e0f9d7a7d4fc463e96b52a_273_0.png)


    Since Flex 2 uses ActionScript 3 (the common name developers use for ActionScript
    3), it is not compatible with Flex 1.5. This is because they use two separate
    virtual machines to render their code. While ActionScript 2, Flex 1.5 applications
    will run on Player 9, ActionScript 3 and Flex 2-based applications cannot run
    on versions prior to 9. Furthermore, applications built on Flex 1.5 and ActionScript
    2 cannot be integrated into the same code base with Flex 2 projects. This limitation
    prevents older classes and components from being imported and used with Flex 2.


    # How Yahoo! Maps Works In Flex


    You may have noticed that this chapter, unlike all the others that get each API
    section, is not named after any specific API. The reality is that there exists
    Yahoo! Maps API which is no longer a viable solution for new developers. The reason
    is that the Flex API is built on Flex 1.5 and, as you learned, this means it is
    not compatible with Flex 2. Since Flex 1.5 is no longer available for trial download
    from Adobe, it simply did not seem practical to cover it thoroughly in this book.


    The good news is that, with some innovation in the Flex, a very good solution
    has appeared for allowing a Yahoo! (or any other!) Maps API to work well with
    Flex 2. This approach gives you the best of both worlds, as you will be able to
    work with maps while getting familiar with the cutting-edge RIA-platform technology
    of Flex 2.'
  merge: -1
