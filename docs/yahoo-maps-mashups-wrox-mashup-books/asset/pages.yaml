    database. The functionality lets you call a keyword search and display results
    in the form of markers. This functionality closely resembles that of the "Find
    on Map" feature on the Yahoo! Maps consumer application. The markers are enriched
    with some very useful data for any user and consumer, including business name,
    address and, available business rating.

    - The GeoRSS class and type of overlays populate the map with markers derived
    from a geo-RSS XML files. This special version reveals geo-coded objects. GeoRSS
    feeds extra data like latitude/longitude or addition to location information.

    - The CustomSWFMarker class combines the flexibility of the geoRSSOverlay with
    the potential of your custom geoRSS loading images as markers, it can load SWFs.
    In addition, you can call methods against those markers SWFs through the callCustomSWFmethod,
    which is reviewed in detail with the CustomSWFMarker class in this example.


