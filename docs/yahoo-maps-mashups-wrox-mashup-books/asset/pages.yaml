- img_proc: true
  md: '# Chapter 7


    Believe it or not, you already possess the map skills to do this. What you will
    learn in this chapter and by ndoing this mashup is how to work with the Flickr
    API and display the data it returns on the map.


    # Planning an Approach


    As with any application, planning an approach is important. It helps to know the
    APIs and web services you are working with very well, but having completed the
    previous chapters on the Ajax API, you have all you need to work with the later.
    In this chapter you will examine the Flickr API, how the request is constructed
    and what data to expect returned upon a successful result.


    Before coding, it is always good to lay out your objectives and then determine
    how best to achieve those tasks. By thinking out what your application should
    achieve. Through the rest of the chapter, you will see how the following steps
    are developed into the mashup:


    +   1. Display the map initially.

    2. Position the map and set its view type accordingly.

    3. Call the external API and retrieve the data.

    4. Give the user the ability to navigate through the data.

    5. Display the data as markers on the map, based on user selection.


    You should find it easy to replicate this pattern of user interaction with other
    APIs and web services.


    # The Flickr API


    Flickr lets you post and share photos with the public via a very popular website
    at www.flickr.com.


    Since Flickr is a property of Yahoo!, the support for its API is similar to that
    of the Yahoo! Maps APIs. Like them, the Flickr API and its documentation are supported
    by the Yahoo! Developer Network (YDN). Check out the web service firsthand, visit
    http://developer.yahoo.com/flickr/ for the most up-to-date documentation and news
    on the API.


    # How Flickr Photos Are Geo-Tagged


    As mashups using Flickr grew, it became apparent that Flickr''s users needed an
    easy way to define the places photos were taken. Flickr added an interface so
    that users could define the latitude and longitude of a photo as it was added
    to their collection or a specific photoset of theirs.


    The interface chosen to enable this form of data entry is not more than a mashup
    of the Yahoo! Maps Ajax API (shown in Figure 7-1). That''s right, using the API
    you are learning about in this book, Flickr put together a simple drag-and-drop
    application that lets users upload photos and then place those photos on a map.
    Once a photo is placed on the map, the corresponding latitude/longitude points
    are saved as attributes of the photo. This precise geo-tagging means that mashups
    built between maps and Flickr can display photos across the world, or near the
    locations at which those photos were taken.'
