  md: "# Chapter 10\n\n# setZoomLevel()\n\nsetZoomLevel() sets the zoom level of the\
    \ map. It accepts one parameter, a number that is the value of the zoom level\
    \ you want to change the map. The zoom level can be set to a number between 1\
    \ and 16:\n\n```\nmapInstance.setZoomLevel(zoomLevel);\n```\n\nIn this sample,\
    \ zoomLevel is set to 6:\n\n```\nmyMap.setZoomLevel(6);\n```\n\nThe next chapter\
    \ will introduce you to a built-in zooming user interface NavigatorWidget. This\
    \ tool features buttons and code that will add instant zooming control to your\
    \ map with minimal coding.\n\n# zoomStart, zoomEnd\n\nThe zoom events zoomStart\
    \ and zoomEnd are dispatched when the map level changes.\n\nHere is how to listen\
    \ for the zoomStart and zoomEnd events:\n\n```\n// Listen for the zoomStart event\n\
    mapInstance.addEventListener(Map.EVENT_ZOOM_START, onZoomStart);\n\n// Listen\
    \ for the zoomEnd event\nmapInstance.addEventListener(Map.EVENT_ZOOM_END, onZoomEnd);\n\
    ```\n\nOnce the events are picked up, the JavaScript function specified will be\
    \ called to carry out the event. The two functions here will display the starting\
    \ level and ending zoom level respect to the events they are carrying out:\n\n\
    ```\n// Display the starting zoom level\nfunction onZoomStart(eventData) {\n \
    \ alert(eventData.startZoomLevel);\n}\n\n// Display the ending zoom level\nfunction\
    \ onZoomEnd(eventData) {\n  alert(eventData.endZoomLevel);\n}\n```\n\n# getZoomLevel()\n\
    \nget methods work very efficiently in the API. Since the value is already set,\
    \ most likely by calling their set method counters, all the APIs need to return\
    \ the value to you. For development, get methods are very easy to implement, they\
    \ require no parameters to operate.\n\nAs you code your application, you will\
    \ find that get methods make development easier. Rather than make your code “remembers”\
    \ what values have been set throughout your application’s operation, you can call\
    \ a get method anytime and have the latest value. The get methods also help with\
    \ user interface elements. You will need to provide a default value to position\
    \ your user interface elements. The get methods provide those data."
