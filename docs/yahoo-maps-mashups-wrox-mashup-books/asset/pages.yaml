  md: '# Chapter 11


    The first piece of the navigator is a small map inside a square. The map displayed
    here will always display map view tiles and correspond to the location and zoom
    level of the main map. The perspective is here supposed to give the user a bird-eye
    view of the map itself, so the zoom level is actually several higher. On top of
    this minimap is a small gray square, when dragged and released, will control both
    the map and the minimap. This lets users control the position of the map with
    loose precision in a natural manner. When this square is dragged and held in direction,
    the map will respond by panning to reveal more of the map in that direction.


    The other piece of the map is a zoombar. This is a combination of several elements
    that put together create an easy tool with which users can zoom in and out of
    the map. The main elements are a plus button, a minus button and a slider. When
    clicked, the zoom in or out. Using the Flash of Zoom, the effect is a gradual
    expansion of the existing tiles and then a fade into the new map type layered
    beneath it. The feature also enhances the feeling of moving closer to the map
    when they zoom in and to reverse when they zoom out. The slider adds a somewhat
    organic feel to the zoombar and, like the dragability of the square in the minimap,
    for a more natural control.


    The NavigatorWidget has the ability to appear open (expanded) or closed (collapsed).
    Two methods, open() and close(), are included in the class. They can be called
    against the widget''s instance to change its state after it has been added.


    # SatelliteControlWidget


    The satelliteControlWidget class attaches three designed buttons to the map that
    allow users to toggle among the map view types. Once again, this is a great alternative
    to creating and coding your own buttons if time is important. These buttons are
    set to detect the existing map view type and reflect it by selecting the corresponding
    type''s button in the widget.


    # ToolbarWidget


    This widget adds a menu of icons to the top-left corner of your map. It acts as
    a start menu, like the one found at the base of your operating system. Its contents
    are a row of icons representing tool that you have added to the map.


    Having learned about tools earlier in the chapter, you know their limitless possibilities.
    You also know that main tool, the PanTool, will be likely added to most of your
    maps as core map functionality. If that is all you add, you will likely not need
    this widget. However, if you develop and add several tools of additional functionality,
    it will be very useful to users to have a menu which to activate/or use those
    tools. That is where this widget becomes very valuable. The map is intended to
    move and/or only one active tool at a time.


    # Working with Overlays


    An overlay adds a new layer over the existing map layer. It moves along with the
    map as is pinned. Overlays are generally used as containers for sets of markers
    representing related data, such as local search results and traffic.'
