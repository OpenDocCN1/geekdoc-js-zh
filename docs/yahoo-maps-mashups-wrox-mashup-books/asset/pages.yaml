  md: '# AS-Flash API Advanced Features


    An important and often overlooked asset of an event is the data that come with
    it. As much of these data are well documented, it is always good to explore the
    data object returned with an event when you first use it. Introduced in the last
    chapter, the for/in method is very useful in discovering all data packaged with
    an event.


    # EVENT_MOVE


    EVENT_MOVE is broadcast whenever the map moves, by panning, zooming or recentering.
    The detection can be user-initiated or based on code that is executed.


    ```

    mapInstance.addEventListener(com.yahoo.maps.api.flash.YahooMap.EVENT_MOVE, onMoveMap);

    ```


    This event comes with a lot of useful data each time it is fired. Using the for/in
    method, you can drill into the event''s object and trace the object''s properties
    and values:


    ```

    // Add Move Listener to map instance

    mMap.addEventListener(com.yahoo.maps.api.flash.YahooMap.EVENT_MOVE, onMoveMap);

    // Function that executes when the event is fired

    function onMoveMap(eventData) {


    trace("eventData.center");

    trace(eventData.bounds.maxLon);

    trace(eventData.bounds.minLon);

    trace(eventData.bounds.maxLat);

    trace(eventData.bounds.minLat);

    trace(eventData.when);


    }

    ```


    Exploring each object and its properties, you will discover that this event''s
    data can carry with the following information:


    eventData.center //Center point of map (x,y) when the event is fired

    eventData.bounds //LonRect object reflect current bounds of the map

    eventData.bounds.maxLon //Maximum longitude map is displaying

    eventData.bounds.minLon //Minimum longitude map is displaying

    eventData.bounds.maxLat //Maximum latitude map is displaying

    eventData.bounds.minLat //Minimum latitude map is displaying

    eventData.when //Associated event that caused EVENT_MOVE to be fired


    This comprehensive data can be used many different ways and we''ll take a look
    at some of them when you build mashups with the AS-Flash API in the next chapter.'
