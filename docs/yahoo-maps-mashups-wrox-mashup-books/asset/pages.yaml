  md: '# Chapter 20


    Get methods work efficiently in the API. Since the value is already set, most
    likely by calling the set counterparts of the get methods, all the API needs to
    do is return the value to you. For development, get methods are easy to use, as
    they require no parameters to operate.


    As you code your application, you will find that get methods make development
    easier. Rather than make your code "remembers" what values have been set out throughout
    your application''s operation, you can call a get method anytime and have the
    latest value. The get methods also help with user interface implementation. The
    get methods will provide this data. Coding get methods for Flex 2 with the AS-Flash
    API is a bit challenging. It requires an additional layer of code on top of you
    to use integrate methods. The reason for this is that not only Flex 2 send a call,
    must be set up to receive the data being returned. This means the local connection
    must be set up to handle two-way communication. While the process is a bit extensive,
    the results are rewarding and will pay dividends in the performance of your mashup.


    # getChildren()


    getChildren() returns the pixel map that is centered on a Point coordinate. Remember
    that this value looks like a latitude/longitude coordinate, but is actually an
    x/y coordinate.


    ```

    mapInstance.getChildren() : Point;

    ```


    Now it''s time to try this out in an example using Flex 2 and the AS-Flash API
    to building Yahoo! Maps API applications in Flex. You will easily adapt the base
    application (from the last chapter and earlier in this chapter) to pass a getChildren()
    call and receive what it returns through the local connection.


    # Try It Out Display the Map''s Center Coordinates


    In this example, you will need each one of the three panels you created in the
    last chapter. Start with the Flex client by modifying the MXML in Flex Builder
    2.


    +   1. Open the Flex Document asFlashAPI.fla.


    +   2. Save it as asFlashAPI_getCenter.fla.


    +   3. Select the first frame in the timeline. If the timeline is not visible,
    go to Window -> Timeline (Ctrl + Alt + T).


    +   4. Go to Window -> Development Panels Actions and select it (or F9).


    +   5. Replace the contents of the actions panel with the following code:


    ```

    //Create local connection object

    var connectedMap:LocalConnection = new LocalConnection();


    //Import PanTool class

    import com.yahoo.maps.Events.PanTool;


    //Add InitializeEventListener to map instance

    myMap.addEventListener(com.yahoo.maps.api.YahooMap.EVENT_INITIALIZE, onInitMap);


    //Function that executes when initialize event is fired

    ```'
