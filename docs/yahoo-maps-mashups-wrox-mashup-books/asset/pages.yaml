  md: '# JS-Flash API Advanced Features


    class includes open() and close() functions that let you control the marker with
    other code based on interaction.


    # WaypointMarker


    A waypoint is a reference to the map, often used in navigation to plot points
    along a route. This class lets you plot waypoints as markers. It is a very simple
    class, with no customization other than the ability to define an index. If you
    are familiar with the consumer offering of Yahoo! Map, you will recognize the
    waypoint marker as the same indicator used to plot points along routes.


    Because the API does not support driving directions, you will find other useful
    ways to use the WaypointMarker class. These include plotting points along cruises,
    flights, running, bikes and walking trails.


    The class has two methods that let you modify the marker after it has been added.
    setWaypointIndex() lets the index displayed in the marker. The getWaypointIndex()
    returns the string representing the index currently set to the marker. As mentioned,
    the index is initially set when the marker is added, so the getWaypointIndex()
    can be called once the marker is added.


    # CustomImageMarker


    This class lets you add an image or SWF anywhere on the map as a marker. This
    is a slightly custom approach than the CustomPOIMarker discussed earlier, in that
    an image or SWF you create becomes the marker. Since the marker is all of your
    design, the only property of this class is the url of the image (JPEG) or SWF
    you create.


    Also unlike the CustomPOIMarker, this class does not inherently have the feature
    of expandability or the open/close classes. This may confuse users with the functionality
    of a marker. On the other hand, depending on the focus of your mashup, users may
    find an image or content-driven SWF to be much useful in your application.


    When the API adds a marker, it actually creates an movie clip at that location.
    The image or SWF mapped in the url property is loaded into that space, appearing
    at the precise marker location. The benefit of creating an SWF as a CustomImageMarker
    instead of a JPEG is that JPEG images do not support transparency. If you can
    interact with your CustomImageMarker is a SWF, I recommend you leverage the CustomSWFMarker
    coming up next.


    # CustomSWFMarker


    This class provides one of the key capabilities of the Flash APIs, it lets you
    develop and design your own interactive marker in the form of an SWF. Once the
    marker is added to the map instance, this lets you call a method, callCustomMethod,
    against the marker itself. This means you have control over the marker you have
    added after.


    When adding a customSWFMarker, you need to pass some additional properties. At
    an end of the day addMarkerByLon or addByAddress method must include the URL of
    the customSWFMarker you are adding. An additional property called ref can also
    be passed. This enables you to sync the marker with other data in your code.


    ```

    mapInstance.addMarkerByAddress(CustomSWFMarker, address, {url, ref});

    ```'
