    # getTrip


    As you can tell by the get in name, this call is positioned to return certain
    values based on parameters. The getTrip method will return a specific trip and
    its details based on a trip ID being passed as a parameter.


    This requires two parameters, the AppID and the trip ID you want to look up. It
    is ideal for requesting your own trip, or the trip ID that you define will likely
    be one you expect.


    ```

    http://travel.yahooapis.com/TripService/V1/getTrip?appid={your_app_appID}&id=YDN_585440

    ```


    The XML data returned by this call, after you substitute the necessary values,
    will be similar to those of the getTrip call. While this returns no latitude/longitude
    points, it could be helpful for your application displaying more detail about
    a specific trip.


    # Understanding JSON


    > This section is similar to the one covered in Chapter 3, "The Ajax API." However,
    there are some differences between the Flickr API and the Yahoo! Travel API that
    are worth noting.


    JSON stands for JavaScript Object Notation and is a simplified version of XML.
    It developed to be a much more lightweight and faster way to pump data into web
    pages built with Ajax. As with XML, data in JSON is easily parsed and is human-readable-meaning,
    meaning it can be understood-without code interpretation.


    Favorable articles on JSON say that it "cuts the fat" out of XML by removing the
    cumbersome tag syntax. An equal benefit is its ability to be loaded directly into
    JavaScript. As you will see in the example in the next section, JSON has a callback
    ability, which lets virtually parse itself by calling a defined function in JavaScript
    when it is returned.


