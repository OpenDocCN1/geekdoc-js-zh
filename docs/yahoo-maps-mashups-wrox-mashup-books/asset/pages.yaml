  md: '![](img/ee60aed724e0f9d7a7d4fc463e96b52a_45_0.png)


    # # The Ajax API


    > “We found this map that said underneath this place there be buried treasure.”
    — The Goonies, 1985


    The Yahoo! Maps Ajax API applies a technology that has become one of the most
    significant web technologies ever. In this chapter, you will be introduced to
    the technology that fueled Web 2.0 and spelled the end of the HTML browser refresh
    as you know it.


    This chapter discusses the fundamentals of JavaScript, Ajax and the Yahoo! Maps
    Ajax API, including


    +   - What the Ajax API is

    - How Ajax works in many exceptional applications

    - Fundamentals of JavaScript, CSS and HTML

    - How Ajax uses the XMLHttpRequest object

    - Benefits of the Ajax API


    # ## What the Ajax API Is


    The first of our map APIs covered in this book is the Ajax API. This API makes
    available the full library of classes and events necessary for you to display
    the Yahoo! Maps developer offering. This includes the maps, navigation ability
    and elements, as well as key mapping functionality.


    The Ajax API is not installed, nor does it need to run on your server. As you
    will see, you can get all you need to display maps to your users by referencing
    and importing a simple JavaScript file into your HTML. Once the files are automatically
    included in your code, which you can achieve by including the API’s library file
    within a JavaScript `src` tag, you can create an instance of the map. This instance
    is actually built on a container element defined by CSS (Cascading Style Sheets),
    a definition of how content will be laid out in HTML.'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# Chapter 3


    Once you have an instance of the map, you can begin calling methods against it.
    Methods like drawZoomAndCenter and setStateType enable to programmatically change
    the appearance and behavior of the map. Additional elements like events and objects,
    you will learn, enable you to create a unique experience.


    # Ajax in Greater Depth


    Ajax is not a language. It is actually an approach to coding that leverages the
    rather limited individual capabilities of JavaScript, CSS, HTML and DOM. In fact,
    Ajax stands for Asynchronous JavaScript plus XML, referring to the combination
    of these two elements. This combination enables exchange and communication with
    the server to take place within the application rather than from the browser.


    Before people realized how effective an approach like Ajax was, most web-based
    applications in HTML were developed to handle data through the browser. This required
    more browser refreshing and resulted in larger amounts of data to be exchanged.
    Fewer data means faster exchanges and display of content that as in maps may include
    images, text and other media.


    The Asynchronous in Ajax refers to the order in which data requests are made.
    With Ajax, requests are queued up (scheduled) to process. Rather, in a nonlinear
    fashion, requests can be made and the application can continue without waiting
    for the response. When the response is received, the application will continue
    handling those data as needed.


    # Applications You Know Use Ajax


    Just how prevalent is Ajax in the web world? Here are some Ajax applications you
    know of and use regularly:


    +   Flickr: As described in the last chapter, Flickr is a photo-sharing site.
    The site features some very effective Ajax, supporting image browsing and photo
    management. The site takes advantage of Ajax''s ability to transmit small amounts
    of data, particularly when the users scroll through several images.


    +   Yahoo Finance: If you explore Yahoo during a trading day, you may notice that
    the stock prices actually change to reflect the market value. Ajax makes these
    updates possible and enables the free flow of data without browser refreshing.
    It creates more of a seamless environment and lets you read orders on those stocks
    without interruption.


    +   Radario.com: This site displays top-ten content and media rankings from several
    popular sources. The rankings are updated daily and feature some interactive elements
    to guide user experience and opinion for each item. The user can click on items
    ranked by listing, and using Ajax, Radario will retrieve and display item details
    from the database quickly and without browser refresh. Additional Ajax-powered
    features include user comments that update an item''s rating as they are entered.


    18'
