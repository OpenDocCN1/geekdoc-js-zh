  md: '# Get Started with the AS-Flash API


    settings and calling methods, the map needs to resolve before being able to accept
    code. This means that maps needs to resolve its initial default settings. It also
    needs to center on its initial address or latitude/longitude and load tiles for
    location. Once this occurs, the map fires EVENT_INITIALIZE, signifying that it
    is ready to receive code.


    In order for the application to use EVENT_INITIALIZE, a method called addEventListener
    must be added to the map''s instance. This method accepts two parameters: the
    event (com.yahoo.maps.flash.YahooMap.EVENT_INITIALIZE) and what method to call
    when the event is detected (onInitMap).


    ```

    myMap.addEventListener( com.yahoo.maps.flash.YahooMap.EVENT_INITIALIZE, onInitMap);

    ```


    This code tells the map component to actively listen for initialize event to be
    called. Once “hears” the event, it calls the function OnInitMap. While this function
    is set to receive a parameter eventData, that parameter is not used. As you will
    see, by default all event-related methods will be set up to receive this eventData
    parameter, as it represents any object data that may be passed from the event.


    ```

    function OnInitMap(eventData) {

    // Change map''s address after map initializes

    myMap.setCenterByAddress("Boston");


    // Change map''s zoom level after map initializes

    myMap.setZoomLevel(5);

    }

    ```


    Now that the map has initialized, settings can be changed. Within the OnInitMap
    function, two API methods are being called. SetCenterByAddress and setZoomLevel
    are two of the many API methods that will be explored in the next chapter. These
    are two of the most basic calls, changing the map’s address and zoom level, respectively.


