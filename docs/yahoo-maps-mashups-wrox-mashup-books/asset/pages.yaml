    # setMapType()


    You learned in the last chapter that one of the defaults of the API is the map
    view type. The three map view are map for map tiles, satellite for satellite tiles
    and hybrid for a view that features a combination of map tile elements on top
    of satellite tiles.


    ```

    mapInstance.setMapType(mapViewType:String);

    ```


    The setMapType() accepts one parameter, the map view you want to change the map.
    However, to ensure that the map view is always correct, you should import or reference
    the MapViews class.


    Here is how the setMapType() should look:


    ```

    var mapViewType:String = com.yahoo.maps.MapViews.SATELLITE;

    ```


    ```

    myMap.setMapType(mapViewType);

    ```


    This will change the map view type to satellite, pulling the static property represented
    by com.yahoo .maps.MapViews.SATELLITE as the parameter. Later in the chapter,
    you will see how the gets getCurrentMapViewType() and getMapTypes() help you design
    your own custom set of buttons that let users toggle among map views. In the next
    chapter you will discover the satellite ControlWidget, a prefaced interface that
    does the same.


    # Map Get Methods


    Using these methods will retrieve map settings for use in other functions in your
    application. These methods return the values they correspond to. Just as the set
    methods, the naming convention of these methods helps identify what data they
    will return to you.


    Get methods work efficiently in the API. When the value is already set, most likely
    by calling the get counterparts, all the API need to return the value. For development,
    get methods are very easy to implement, they require no parameters to operate.


    As you code your application, you will find that get methods make development
    easier. Rather than make sure your code “remembers” what values have been set
    throughout your operation’s operation you can call a get method anytime and have
    the latest value. The get methods also help you with interface implementation.
    You will need a starting point, a default value at which to position your user
    interface elements. The get methods provide those data.'
