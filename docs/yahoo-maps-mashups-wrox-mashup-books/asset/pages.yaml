  md: '# The Ajax Mashup


    # flickr.people.getPublicPhotos


    As you can tell by the get in the getPublicPhotos method will return certain values
    based on given parameters. The getPublicPhotos method will return all public photos
    posted by a specific user. This is the method that will be used in this chapter
    mashup, setting up you to display your photos on your map.


    This call requires two parameters. The api_key, again, is the key when you were
    given for access to Flickr''s APIs. The other required parameter is the user ID
    of the whose photos you want to display. This call is ideal for requesting your
    own photos, and the user ID will likely be yours. Additionally, adding the geo
    field will add the latitude/longitude to the photo data. A successful request
    looks like this:


    ```

    http://api.flickr.com/services/rest?method=flickr.people.getPublicPhotos&format=js&onapi_key=(your_api_key)&user_id=(your_flickr_user_id)&extras=geo

    ```


    The XML data returned by this call, after you substitute the necessary values,
    will be similar to that of the flic.photos.search call. Once again, the photos
    geo-tagged by the user you are requesting appear with latitude and longitude data.


    # Understanding JSON


    JSON stands for JavaScript Object Notation and is a simplified version of XML.
    JSON developed to be a much lighter and faster way to pump data into JavaScript.
    Its popularity has grown with the increase of Ajax-based web apps. As you will
    see, JSON in data are easily organized and human-readable, meaning they can be
    understood without code interpretation.


    Favorable articles on JSON cite that it "cuts the fat" out of XML by removing
    the cumbersome tag syntax. Equally beneficial is its ability to be loaded directly
    into JavaScript. As you will see in later sections, JSON has a callback ability,
    which lets virtually parse itself by calling a defined function in JavaScript
    when it is returned.


    # Making a JSON Request


    A JSON request is constructed similarly to a typical REST request. It is important
    to note that an API needs to provide specific support for JSON, but unfortunately
    most do not. Flickr, however, has added strong support for JSON and that makes
    mashups may mashups easier and more capable.


    In a familiar REST response URL, the parameter format=json will instruct the API
    to respond with JSON:


    ```

    http://api.flickr.com/services/rest?method=flickr.photos.search&api_key=(your_flickr_api_key)&tags=yahoo+hack+day&extras=geo&format=json

    ```


    To make a request in JavaScript, the URL must be embedded in a JavaScript src
    tag, as you load the classes of the AJAX maps APIs.


    ```

    <script type="text/javascript" src="http://api.flickr.com/services/rest?method=flickr.photos.search&api_key=(your_flickr_api_key)&tags=yahoo+hack+day&extras=geo&format=json"></script>

    ```'
