  md: '# Working with Tools


    Tools are features of the map that leverage mouse interaction. Two tool classes
    are included with the JS-Flash API. The pan enables the dragging feature that
    has become standard in the current generation of richer applications. This functionality
    is not available by default and needs to be added. The other tool class is CustomSWTool,
    which enables you to create your own tool so that your users can better engage
    with the map.


    > The terminology for the Ajax and Flash APIs differs here with the definition
    of tool. In the Flash API, a tool is a mechanism of the API that is developed
    based on mouse interaction. The Flash API widget close to the Ajax definition
    of a tool, a cluster of user interface elements and code that allows control of
    the map.


    # Tool Methods and Classes


    The tools are available with the map class is loaded by default when the map instance
    is created. They are responsible for adding, removing and activating the tools
    you make available to users. There is a special widget, discussed in this chapter,
    that adds a menu for tools to your map application. This is the ToolbarWidget
    its contents rely on the results of these methods.


    # addTool()


    addTool() is a simple method that allows you add instances of tools to the map.
    This method must be called after the map instance initializes, and is usually
    placed onOnInit.


    ```

    mapInstance.addTool(tool, isActive);

    ```


    In to add a tool, you must first import tool''s class and create an instance of
    it. That instance is the first parameter of this method. The second parameter
    is isActive. When set to true, the tool will be added and become active to your
    users right.


    # setActiveTool(tool)


    Should you add a tool with isActive set to false, you will need to run this method
    in your code. This method accepts one parameter, and that is the instance of the
    tool you want to activate.


    ```

    mapInstance.setActiveTool(tool);

    ```


    # removeTool(tool)


    removeTool() is used to remove a tool, reactivating it from the map instance.
    Its only parameter is the instance of the tool it is to remove.


    ```

    mapInstance.removeTool(tool);

    ```


    # PanTool


    This tool adds the all-important feature of letting the user drag the map and
    pan it. Since the tool activates a feature within the map instance itself, some
    events are associated with the map events'
