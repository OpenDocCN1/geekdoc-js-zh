    # # Advanced Features: Flex 2 Using the AS-Flash API


    Back in Chapter 16, "AS-Flash Advanced Features," you learned in great detail
    about the advanced capabilities of the ActionScript-Flash (AS-Flash) API. This
    chapter will re-familiarize you with those capabilities and present some examples
    of implementing AS-Flash API with Flex 2.


    While much of this chapter will be a review, you should keep the templates you
    developed in the last few chapters ready. Each of the classes, events and methods
    can be applied to the Flex 2 AS-Flash API architecture you have already implemented.
    In this chapter you will


    +   - Review advanced methods, classes and events of the AS-Flash API

    - Compile AS-Flash API examples for inclusion in Flex 2

    - Build local connection classes to allow communication in support of certain
    advanced methods

    - Code Flex 2 example applications that incorporate AS-Flash API methods within
    their functionality and integrate maps


    # ## Advanced AS-Flash API Classes


    Developing with the AS-Flash API for Flex 2 requires you to know as much about
    the API as possible. Now that you''re thinking Flex 2, it is necessary to review
    the advanced API classes and capabilities. Having learned the basic methods of
    this API and applied some of them to the Flex 2 environment, you should get familiar
    with the advanced methods and objects that can make your map application more
    complete.'
