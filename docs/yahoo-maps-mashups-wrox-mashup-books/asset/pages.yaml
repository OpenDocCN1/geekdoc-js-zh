  md: "# Chapter 20\n\n# Map Set Methods\n\nThese basic methods are responsible for\
    \ changing properties of the map. You will recognize quickly the naming convention\
    \ of these methods reflects exactly what each method does. It is to make it eas-\
    \ to code with them as well as for other developers to identify their purpose\
    \ in your application.\n\n# setCenterById()\n\nTheCenterById() method accepts\
    \ two parameters, address and duration. A successful address is a full street\
    \ address with state and ZIP (Certain major metropolitan areas will be as well).\
    \ The address is converted by the API geo-coder into a latitude and longitude,\
    \ and the map reloads its tiles and centers on that value.\n\nTo handle this transition\
    \ smoothly, you can use the duration parameter to tell the API how long it should\
    \ take from its current position to the one you have defined. The duration parameter\
    \ is the number of milliseconds the map will pan to.\n\n```\nmapInstance.setCenterById(address:String,duration:Number);\n\
    ```\n\nThis example shows what the code would be like to change the address to\
    \ San Francisco and pan from its current location for 300 milliseconds.\n\nFor\
    \ the Flex class:\n\n```\nvar address:String = \"San Francisco\"\nvar duration:Number\
    \ = 300;\n\nmapConnector.setCenterById(address,duration);\n```\n\nFor the MapConnector\
    \ class:\n\n```\npublic function setCenterById(address:Number,duration:Number):void\n\
    {\n  send(\"FlashClient\", setCenterById(\", {address,\nduration:(duration)\\\
    ));\n}\n```\n\nFor the Flash client:\n\n```\nmyMap.setCenterById(address,duration);\n\
    ```\n\nSome events are fired when setCenterById() is called. EVENT_MAP_GEOCODE_SUCCESS\
    \ is dispatched when the API has successfully geo-coded the address passed in\
    \ and has resolved it as a latitude/longitude coordinate. If the address entered\
    \ not geo-coded, the EVENT_MAP_GEOCODE_ERROR is broadcast. An array of addresses\
    \ will be sent as a data object with this event along with the originalAddress.\
    \ You can use the message attribute returned with this event to alert users to\
    \ try a new address or select a suggested one. Because international geo-coding\
    \ recognizes many variations of city names, it is difficult to generate a geo-coded\
    \ event.\n\n270"
