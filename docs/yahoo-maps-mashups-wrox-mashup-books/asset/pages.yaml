    // Outputs: 5

    ```


    # getCenter()


    getCenter() returns the pixel coordinate the map is centered upon as a Point`
    coordinate. Remember that this value looks like a latitude/longitude coordinate,
    but is actually an x/y coordinate.


    ```

    mapInstance.getCenter() : Point;

    ```


    This sample verifies that the map is, by default, centered depending on what -99.84375,
    39.223253:


    ```

    var currentCenter :Object = new mx.graphics.Point();

    currentCenter = myMap.getCenter();

    trace(currentCenter);

    // Outputs:-99.84375, 39.223253

    ```


    # getCurrentViewType()


    You can call getCurrentViewType() to determine what the map is currently displaying.
    This is useful if you have created your buttons to let your users toggle map view
    types. You may also include some effects in your application activate depending
    on what layer is currently displayed.


    ```

    mapInstance.getCurrentViewType() : String;

    ```


    This method could reveal that, based on a change, to the initial setting or through
    user interaction, the map is now displaying satellite tiles instead of its default
    tiles:


    ```

    var currentViewType:String;

    currentViewType = myMap.getCurrentViewType();

    trace(currentViewType);

    // Outputs: satellite

    ```


