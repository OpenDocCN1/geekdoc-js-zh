  md: '# JS-Flash API Advanced Features


    As you will see, the overlays have the incredible ability of acting as their own
    maps. Some of the overlay classes will actually request data, parse and add markers
    by itself. It is good to test out this overlay, as it may save you some time as
    well as enable you to add even more functionality to what you ultimately build.


    # Overlay Methods and Classes


    Just like widgets, tools and markers, overlays can be added and removed with a
    simple pair of methods. It is good practice, after importing the overlay class,
    to create an instance variable for that new overlay.


    Overlay classes act as built-in maps. With the LocalSearchOverlay and TrafficOverlay
    classes, your application will be directly connected to the popular local search
    and traffic data. These two classes in particular enable you to replicate functionality
    featured by the Yahoo! Maps consumer application.


    Also available is the GeoRSSOverlay class. This class, when imported and instantiated,
    is capable of picking out locations from GeoRSS feeds and displaying markers respective
    to those locations. GeoRSS is a special standard that represents standard RSS
    data with location data objects embedded within each item.


    # addOverlay(overlay)


    Once the map is initialized, the overlay instance can be added using addOverlay().
    addOverlay() accepts one parameter, the overlay instance you are adding to the
    map.


    ```

    mapInstance.addOverlay(overlay);

    ```


    # removeOverlay(overlay)


    removeOverlay() will remove the specified overlay instance from the map.


    ```

    mapInstance.removeOverlay(overlay);

    ```


    # LocalSearchOverlay


    LocalSearchOverlay adds a feature that powers the use of Yahoo!''s local search
    database. The functionality allows you to call a keyword search and display results
    in the form of markers. This closely resembles of the Find on Map feature on the
    Yahoo! Maps consumer application. The markers are enriched with very useful data
    for any user, including business name, address and, available, business rating.


    The overlay class features a method search() that sends a service call through
    the API to generate results. It is useful for finding businesses such as restaurants,
    and its search criteria simply on a key. The method search accepts several other
    parameters that let you manage the results in several ways.


    ```

    localSearchOverlayInstance.search(searchTerms, lation, startIndex, results, radius,
    categoryFilter, ratingFilter);

    ```


    You notice that as with the widgets, this method is called against the overlay
    instance. The search() method requires only the first two parameters to work.
    To let you use the most of this method, you will likely want to collect the searchTerms
    from a value entered into a text input field or component.'
