  md: '# Chapter 11


    # Marker Methods and Classes


    This small set of methods represents the most used functions in mashups: adding
    markers. Each method enables you to ultimately control the location and appearance
    of every marker you add on the map.


    # addMarkerByAddress()


    This method lets you add markers to a location using an address:


    ```

    mapInstance.addMarkerByAddress(markerClass, address, data);

    ```


    The markerClass defines what type of marker you are adding. To successfully add
    a marker you must import the class of the type of marker reference in this parameter.
    The various markers, reviewed in the following sections, carry unique functionality
    and presentation attributes.


    An address variable must be passed in order for the marker to be added with this
    method. The method will need to be geo-coded, this method does not process as
    quickly as its latlon counterpart. If you intend the marker to appear in the center
    of the map, you may want to call setCenterByAddress()


    Finally, the properties of the markerClass you must be defined in the last parameter.
    As you see in the following sections, each marker class carries with it different
    properties that are defined when this data object is created.


    # addMarkerByLatLon()


    This method lets you add markers to a location using a latitude/lonitude coordinate:


    ```

    mapInstance.addMarkerByLatLon(markerClass, latlon, data);

    ```


    Working in the same as addMarkerByAddress(), the markerClass parameter is the
    type of marker you are adding. The types can vary within the same mashup but require
    their respective classes to be imported.


    The second parameter defines the location where the marker will be added. The
    LatLon class must be imported or referenced in order to pass the latitude/lonitude
    coordinates into a LatLon object.


    Once again, the properties of the markerClass you must be defined in the last
    parameter. These will be discussed with each class in the following sections.


    # CustomPOIMarker


    POI stands for point of interest. This class lets you add a marker with the custom
    properties of index, title, description, marker color and stroke color. The two
    color reflect the body of the marker and its border make the marker look the way
    you want without creating a completely new marker. Although that feature is available
    with the JS-Flash API, as you will see later in the chapter, this marker is an
    efficient mean of customizing.


    Another feature of this marker class is expandability. It replicates a feature
    offered by standard markers, in that as the user rolls over the marker, it expands
    to reveal more detail. As part of this feature, this'
  merge: -1
  pgno: 138
