    the LocalSearch variable is set to the new overlay instance.


    # addOverlay(overlay)


    Once the map is initialized, the overlay can be added using addOverlay().

    Overlay() accepts one parameter, the overlay you are adding to the map.


    ```

    mapInstance.addOverlay(overlay);

    ```


    # removeOverlay(overlay)


    removeOverlay() will remove the specified overlay instance from the map.


    ```

    mapInstance.removeOverlay(overlay);

    ```


    # Overlay Classes


    Overlay classes act as built-in mashups. The LocalSearch and TrafficOverlay classes,
    your application will be directly connected to popular local search and traffic
    data. These two classes in particular enable you to replicate rich functionality
    on the Yahoo! Maps consumer application.


    Also is available the GeoRSSOverlay class. This, when imported and initialized,
    is capable of picking out locations from GeoRSS feeds and displaying markers respectives
    to those locations. GeoRSS is a special standard that represents standard RSS
    data with location data embedded within each item.


