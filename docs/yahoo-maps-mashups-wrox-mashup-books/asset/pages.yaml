  md: '# Basic Methods: Flex 2 Using the AS-Flash API


    ![](img/ee60aed724e0f9d7a7d4fc463e96b52a_303_0.png)


    Figure 20-1


    # How It Works


    Closely based on the functionality you coded in this chapter, you now have a text
    field and you''ve added a button. As you coded events to handle the TabBar and
    hSlider, you coded one here to handle the button press. When the user presses
    the Refresh Map button, the values from the textInput and hSlider controls are
    sent to the local connection with the call setCenterByAddressZoom().


    The local connection instance, now instantiated by the class mapConnector_address,
    receives the call and data from the Flex class and passes them to the Flash class.
    There, the SWF you created the call and channels the data into the method (of
    the same name) against the instance.


    You should use the approach in this example as you try out the rest of the methods
    and sample code in this chapter.


    # setCenterByLatLon()


    If you know the latitude/longitude coordinate you want to center the map on, you
    can use setCenterLatLon(). A major benefit of this method is that it executes
    much faster than setCenterByAddress(). This is because this method does not need
    to geo-code address and resolve a latitude/longitude, since it already knows it.'
