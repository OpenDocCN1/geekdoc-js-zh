    # setZoomLevel()


    setZoomLevel() sets the zoom level of the map. It accepts one parameter, a number,
    that is the value of

    zoomLevel you want to change the map to. The zoomLevel can be set to a value between
    1 and 16.


    ```

    mapInstance.setZoomLevel(zoomLevel:Number);

    ```


    In this sample, the zoomlevel is set to 6:


    For the Flex client:


    ```

    var zoomLevel:Number = 6;

    ```


    ```

    mapConnector.setZoomLevel(zoomLevel);

    ```


    For the MapConnector class:


    ```

    public function zoomLevel(zoomLevel:Number):void

    {

    send("_flashClient", setZoomLevel ", { zoomLevel: zoomLevel });

    }

    ```


    For the Flex client:


    ```

    myMap.setZoomLevel(zoomLevel);

    ```'
