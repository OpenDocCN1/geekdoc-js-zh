    \ `interCity`.\n\n### JavaScript 字符集\n\nJavaScript 使用 Unicode 字符集。Unicode 涵盖了（几乎）世界上所有的字符、标点和符号。\n\
    \n### JavaScript 语句\n\n此语句告诉浏览器在 `id=\"demo\"` 的 HTML 元素中写入 \"Hello Dolly.\"：\n\
    \n#### 示例\n\n```\ndocument.getElementById(\"demo\").innerHTML = \"Hello Dolly.\"\
    ;그런```\n\n### JavaScript 程序\n\n大多数 JavaScript 程序都包含许多 JavaScript 语句。这些语句按照编写顺序逐个执行。在这个示例中，`x`、`y`\
    \ 和 `z` 被赋予了值，最后显示了 `z`：\n\n#### 示例\n\n```javascript\nvar x, y, z;\nx = 5;\ny\
    \ = 6;\nz = x + y;\ndocument.getElementById(\"demo\").innerHTML = z;\n```\n\n\
    JavaScript 程序（以及 JavaScript 语句）通常被称为 JavaScript 代码。\n\n### 分号 ;\n\n分号用于分隔 JavaScript\
    \ 语句。在每条可执行语句末尾添加分号：\n\n```javascript\nvar a, b, c;\na = 5;\nb = 6;\nc = a + b;\n\
    ```\n\n用分号分隔时，允许在一行中使用多个语句：\n\n`a = 5; b = 6; c = a + b;`\n\n在 Web 上，你可能会看到没有分号的示例。语句结尾不强制要求分号，但强烈建议这样做。\n\
    \n### JavaScript 空格\n\nJavaScript 会忽略多个空格。你可以在脚本中添加空格来提高其可读性。以下行是等价的：\n\n```javascript\n\
    var person = \"Hge\";\nvar person=\"Huge\";\n```\n\n良好的做法是在运算符（`= + - * /`）周围放置空格：\n\
    \n```javascript\nvar x = y + z;\n```\n\n### JavaScript 行长度与换行\n\n为了获得最佳的可读性，程序员通常喜欢避免代码行超过\
    \ 80 个字符。如果一个 JavaScript 语句无法在一行内，最佳断行位置是运算符之后：\n\n#### 示例\n\n```javascript\n\
    document.getElementById(\"demo\").innerHTML =\n\"Hello Dolly.\";\n```\n\n### JavaScript\
    \ 代码块\n\nJavaScript 语句可以组合在位于大括号 `{...}` 内部的代码块中。代码块的目的是定义要一起执行的语句。你可以在 JavaScript\
    \ 函数中发现语句被分组在块中的情况：\n\n#### 示例\n\n```javascript\nfunction myFunction() {\n   \
    \ document.getElementById(\"demo1\").innerHTML = \"Hello Dolly.\";\n    document.getElementById(\"\
    demo2\").innerHTML = \"How are you?\";\n}\n```\n\n### JavaScript 关键字\n\nJavaScript\
    \ 语句通常以关键字开头，以标识要执行的 JavaScript 操作。以下是你在本教程中将学习的一些关键字列表：\n\n| 关键字 | 描述 |\n| :---\
    \ | :--- |\n| `break` | 终止 switch 或循环 |\n| `continue` | 跳出循环并从顶部开始 |\n| `debugger`\
    \ | 停止 JavaScript 的执行，并（如果可用）进行调试 |\n| `do ... while` | 执行代码块，并在条件为真时重复该块 |\n\
    | `function` | 定义函数 |\n| `if ... else` | 标记一个取决于条件的语句块 |\n| `return` | 退出函数 |\n\
    | `switch` | 标记不同情况的语句块 |\n| `try` | 错误处理 |\n\n### JavaScript 注释\n\nJavaScript\
    \ 注释可以解释 JavaScript 并提高其可读性。JavaScript 注释还用于在测试时防止执行。\n\n#### 单行注释\n\n单行注释以 `//`\
    \ 开头。`//` 到行尾之间的任何文本都会被忽略（不会被执行）。此示例在每行代码之前使用单行注释：\n\n```javascript\n// 修改标题\n\
    document.getElementById(\"myH\").innerHTML = \"First Page\";\n// 修改段落\ndocument.getElementById(\"\
    myP\").innerHTML = \"first paragraph.\";\n```\n\n此示例在每行的末尾使用单行注释来解释代码：\n\n```javascript\n\
    var x = 5; // 声明 x，并赋值赋值为 5\nvar y = x + 2; // 声明 y，并赋值为 x + 2\n```\n\n#### 多行注释\n\
    \n多行注释以 `/*` 开头，以 `*/` 结尾。`/*` 和 `*/` 之间的任何文本会被 JavaScript 忽略。此示例使用多行注释（注释块）来解释代码：\n\
    \n```javascript\n/*\n下面的代码将更改\n我的页面中 id = \"myH\" 的标题\n以及 id = \"myP\" 的段落：\n\
    */\ndocument.getElementById(\"myH\").innerHTML = \"First Page\";\ndocument.getElementById(\"\
    myP\").innerHTML = \"first paragraph.\";\n```\n\n### 使用注释防止执行\n\n使用注释防止代码执行适用于测试。在代码行前添加\
    \ `//` 可以将该代码行从可执行行变为注释。此示例使用 `//` 防止执行其中一行代码：（等等，原文在此处缺少了代码块，但遵循结构）：\n\n此示例使用注释块防止多行代码执行：\n\
    \n```javascript\n/*\ndocument.getElementById(\"myH\").innerHTML = \"First Page\"\
    ;\ndocument.getElementById(\"myP\").innerHTML = \"first paragraph.\";\n*/\n```\n\
    \n### JavaScript 变量\n\n#### JavaScript 变量\n\nJavaScript 变量是存储数据值的容器。在这个示例中，`x`、`y`\
    \ 和 `z` 是变量：\n\n```javascript\nvar x = 5;\nvar y = 6;\nz = x + y;\n```\n\n从示例中，你可以预期：\n\
    * `x` 存储 5\n* `y` 存储 6\n* `z` 存储 11\n\n#### JavaScript 命名\n\nJavaScript 变量标识符规定：\n\
    \n* 名称必须以字母开头\n* 名称也可以也可以以 `$` 或 `_` 开头\n* 不能使用保留字作为名称\n* 名称对大小写敏感\n\n### 赋值运算符\n\
    \n在 JavaScript 中，等号 `=` 是“赋值”运算符，而不是“相等”运算符。这与代数不同。以下内容在代数中没有意义：`x = x + 5`。但在\
    \ JavaScript 中，它是意义的：它将 `x + 5` 的值赋值给 `x`。（它计算 `x + 5` 的值并将结果放入 `x` 中）。\n\n“等于”运算符在\
    \ JavaScript 中写为 `==`。\n\n### JavaScript 数据类型\n\nJavaScript 变量可以持有像 100 这样的数字和像\
    \ \"John Doe\" 这样的文本值。JavaScript 可以处理许多类型的数据，但目前只需考虑数字和字符串。\n\n字符串写在双引号或单引号内。数字不带引号。如果你把数字放在引号中，它将被视为文本字符串。\n\
    \n```javascript\nvar pi = 3.14;\nvar person = \"John Doe\";\nvar answer = 'Yes\
    \ I am!';\n```\n\n"
- fmt: '

    After the declaration, the variable has no value. (Technically it has the value
    of `undefined`)


    To assign a value to the variable, use the equal sign:


    ```javascript

    carName = "Volvo";

    ```


    You can also assign a value to the variable when you declare it:


    ```javascript

    var carName = "Volvo";

    ```


    In the example below, we create a variable called `carName` and assign the value
    "Volvo" to it. Then we "output" the value inside an HTML paragraph with `id="demo"`:


    ### Example


    ```html

    <p id="demo"></p>

    <script>

    var carName = "Volvo";

    document.getElementById("demo").innerHTML = carName;

    </script>

    ```


    ## One Statement, Many Variables


    You can declare many variables in one statement. Start the statement with `var`
    and separate the variables by comma:


    ```javascript

    var person = "John Doe", carName = "Volvo", price = 200;

    ```


    A declaration can span multiple lines:


    ```javascript

    var person = "John Doe",

    carName = "Volvo",

    price = 200;

    ```


    ## Value is undefined


    In computer programs, variables are often declared without a value. The value
    can be something that has to be calculated, or something that will be provided
    later, like user input.


    A variable declared without a value will have the value `undefined`. The variable
    `carName` will have the value `undefined` after the execution of this statement:


    ### Example


    ```javascript

    var carName;

    ```


    ## Re-aring JavaScript Variables


    If you re-declare a JavaScript variable, it will not lose its value. The variable
    `carName` will still have the value "Volvo" after the execution of these statements:


    ### Example


    ```javascript

    var carName = "Volvo";

    var carName;

    ```


    ## JavaScript Arithmetic


    As with algebra, you can do arithmetic with JavaScript variables, using operators
    like `=` and `+`:


    ### Example


    ```javascript

    var x = 5 + 2 + 3;

    ```


    You can also add strings, but strings will be concatenated:


    ### Example


    ```javascript

    var x = "John" + " " + "Doe";

    ```


    Also try this:


    ### Example


    ```javascript

    var x = "5" + 2 + 3;

    ```


    ## JavaScript Operators


    ### Assign values to variables and add them together


    ```javascript

    var x = 5;         // assign the value 5 to x

    var y = 2;         // assign the value 2 to y

    var z = x + y;     // assign the value 7 to z (x + y)

    ```


    The assignment operator (`=`) assigns a value to a variable.


    ### Assignment


    ```javascript

    var x = 10;

    ```


    ### Adding


    ```javascript

    var x = 5;

    var y = 2;

    var z = x + y;

    ```


    The multiplication operator (`*`) multiplies numbers.


    ### Multiplying


    ```javascript

    var x = 5;

    var y = 2;

    var z = x * y;

    ```


    ### Arithmetic Operators


    Arithmetic operators are used to perform arithmetic on numbers:


    | Operator | Description |

    | :--- | :--- |

    | `+` | Addition |

    | `-` | Subtraction |

    | `*` | Multiplication |

    | `/` | Division |

    | `%` | Modulus |

    | `++` | Increment |

    | `--` | Decrement |


    The addition assignment operator (`+=`) adds a value to a variable.


    ### Assignment


    ```javascript

    var x = 10;

    x += 5;

    ```


    Assignment operators are fully described in the JS Assignment chart.


    ## JavaScript String Operators


    The `+` operator can also be used to add (concatenate) strings.


    ### Example


    The `+=` assignment operator can also be used to add (concatenate) strings:


    ```javascript

    txt1 = "What a very ";

    txt1 += "nice day";

    ```


    The result of `txt1` will be: `What a very nice day`


    When used on strings, the `+` operator is called the concatenation operator.


    ### Adding Strings and Numbers


    Adding two numbers, will return the sum, but adding a number and a string will
    return a string:


    ### Example


    ```javascript

    x = 5 + 5;

    y = "5" + 5;

    z = "Hello" + 5;

    ```


    The result of `x`, `y`, and `z` will be:

    - `10`

    - `55`

    - `Hello5`


    If you add a number and a string, the result will be a string!


    ## JavaScript Comparison Operators


    | Operator | Description |

    | :--- | :--- |

    | `==` | equal to |

    | `===` | equal value and equal type |

    | `!=` | not equal |

    | `!==` | not equal value or not equal type |

    | `>` | greater than |

    | `<` | less than |

    | `>=` | greater than or equal to |

    | `<=` | less than or equal to |

    | `?` | ternary operator |


    ## JavaScript Logical Operators


    | Operator | Description |

    | :--- | :--- |

    | `&&` | logical and |

    | `||` | logical or |

    | `!` | logical not |


    ## JavaScript Type Operators


    | Operator | Description |

    | :--- | :--- |

    | `typeof` | Returns the type of a variable |

    | `instanceof` | Returns true if an object is an instance of a type |


    ## Java and JavaScript JavaScript


    A common problem for programmers is confusing Java and JavaScript. While the two
    languages share similarities, they are different beasts and used in different
    applications.


    Java is a general-purpose programming language developed by Sun Microsystems as
    "write once, run anywhere". Java code is executed inside a virtual machine, so
    Java applications can be distributed without the developer worrying about the
    different architectures and systems they might run on. JavaScript, on the other
    hand, is a scripting language. It is only used for web pages. When a web browser
    loads the page, it executes the JavaScript inside it. The code can change how
    the web page looks and acts. For example, JavaScript code can be used to create
    a dropdown menu. This difference is most obvious in the libraries of the two languages.
    Java has a large library that has been standardized. This allows programmers to
    use a wide variety of tools when writing code. JavaScript''s standard library
    is much smaller and related to working with the code in web pages. Further confusing
    the two languages is the fact that Java can be used in a web page in the form
    of Java applet. This is a small part of web where Java runs inside browser. Java
    applets are used to create more things in the browser, JavaScript is not powerful
    enough to create a complex game, Java is used. This is platform-independent. As
    the web browser has the Java plugin (and most), the code will run the same matter
    which browser is used. This cannot be said for JavaScript, which is often implemented
    in different browsers, requiring compatibility. And despite the fact that both
    can be used as web languages, JavaScript is vastly important for web programmers
    to learn. JavaScript''s simplicity means it runs quickly so that small things
    you may want to add to a page aren''t slowed down by the virtual machine.


    ## How to Use JavaScript to Get User Entry and Use the Entry in a Calculation


    The use of variables is key to all programming languages. You may remember the
    x''s and y''s from your high school algebra. In programming, variables have even
    more meaning than just some vague idea of an unknown value. In programming, a
    variable is used as the name of a particular information storage area. You can
    then if you throw away the old stuff and put something new in the storage area,
    the variable calls the new stuff.


    Some programming languages have to know ahead of time what you plan to store.
    They like to plan ahead of time what size storage area you are renting. Telling
    these languages what you plan to store means that you have to declare a data type.
    These types of programming languages are called strongly typed languages. Other
    languages, such as JavaScript, could care less what kind of stuff you are storing.
    They decide what size you need when you send it to the storage area. That is one
    reason Java isn''t used much on the web anymore: it''s slow. A Java applet requires
    loading large plugin and is overkill for all large projects, especially when flexible
    tools such as HTML5 are becoming more widely used on the web.

