    然而，你仍然需要学习一些关于数据类型的知识，因为如果不指定你想要存储什么类型的信息，将会产生一些副作用。


    无论如何，该信息仍然有一个变量名。这里有一个练习题，它可以：

    1. 从提示框中收集信息，

    2. 将其放入变量中，

    3. 进行计算，并且

    4. 通过警告框（alert）返回答案。


    将以下代码添加到新网页中：


    ```javascript

    var SquareThis = prompt("Enter a number you would like to square.");

    var Answer;

    Answer = SquareThis * SquareThis;

    alert(Answer);

    ```


    ## 这段代码中的基础编程技能


    1. 当你进行任何类型的编程时，你必须考虑计算机需要识别和保留哪些信息。然后，你创建变量来存储这些信息。在这个例子中，我们需要存储两部分信息：1) 将要平方的数字，2)
    答案。

    2. 你通过命名 `var`、空格和变量名来告诉 JavaScript 你想让存储信息。

    3. 该脚本的第一行承担了三项任务：1) 它告诉 JavaScript 为变量 `SquareThis` 留出内存空间，2) 它使用预定义的函数提示用户输入一个数字，3)
    它获取用户在提示框中输入的任何内容并将其放入 `SquareThis` 的内存空间中。

    4. 注意，`prompt` 函数需要一个参数，就像 `alert()` 一样。注意参数位于 " " 中，这意味着该参数是一个字符串（String）数据类型。

    5. 现在脚本需要一个变量来存放答案。这是通过 `var Answer;` 完成的。

    6. 现在一切都就绪可以进行数学计算了：`Answer = SquareThis * SquareThis;`。告诉计算机执行什么数学运算的部分运算符。主要的运算符有
    `+`、`-`、`*`、`/`（加、减、乘、除）。还有许多其他运算符。平方是任何数字乘以自身；因此这个公式将 `SquareThis` 乘以 `SquareThis`。

    7. 程序得出了答案，但它需要告诉用户。我们再次使用一个警告框。

    8. 现在更改公式以执行其他操作。尝试再添加另一个变量和另一个 `alert()` 来询问另一个数字（或多个）。


    以下是一些供你实验的运算符：


    | 运算符 | JavaScript 数学功能 |

    | :--- | :--- |

    | `+` | 两个数字相加 |

    | `-` | 两个数字相减 |

    | `/` | 两个数字相除 |

    | `++` | 数字自加 1（只需要一个变量） |

    | `--` | 数字自减 1（只需要一个变量） |


    ## 结论


    HTML 可能不能用来替代 JavaScript。这两种编程语言完全不同，具有不同的功能、特性和能力。HTML 是一种标记语言，设计用于创建静态网页内容；而
    JavaScript 是一种可以执行动态任务的编程语言。它可以反复用于网站的不同页面上。这可以通过将其外部化并放在单独的文件中，并将 JavaScript
    文件链接到特定页面的 HTML 代码来实现。因此，通过在每个页面上添加正确的标签，可以将 JavaScript 添加到许多页面。


    并不是每个拥有业务的人都精通 JavaScript 或知道如何使用它。由于 JavaScript 可以为网站增加许多方面的特性，使用它创建网站只会对你的网站有益。因此，如果你能聘请专业的网页设计公司来帮助你使用
    JavaScript 构建网站，将始终非常有帮助。专业设计师团队可以与你坐在一起，理解你的业务，并考虑到你所有的业务需求来设计网站。


    © Brian Draper


