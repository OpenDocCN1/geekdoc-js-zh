  trans: "\n`type` 属性不是必須。JavaScript 是 HTML 中的默认脚本语言。\n\n## `<head>` 或 `<body>` 中的\
    \ JavaScript\n\n你可以在 HTML 文档中放置任意数量的脚本。\n\n脚本可以放置在 HTML 页面的 `<body>` 部分、`<head>`\
    \ 部分，或者两者都放置。\n\n### `<head>` 中的 JavaScript\n\n在此示例中，一个 JavaScript 函数被放置在 HTML\
    \ 页面的 `<head>` 部分。当点击按钮时，该函数会被调用（执行）：\n\n#### 示例\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<script>\nfunction myFunction() {\n    document.getElementById(\"demo\"\
    ).innerHTML = \"Paragraph changed.\";\n}\n</script>\n</head>\n<body>\n<h1>A Web\
    \ Page</h1>\n<p id=\"demo\">A Paragraph</p>\n<button type=\"button\" onclick=\"\
    myFunction()\">Try it</button>\n</body>\n</html>\n```\n\n### `<body>` 中的 JavaScript\n\
    \n在此示例中，一个 JavaScript 函数被放置在 HTML 页面的 `<body>` 部分。当点击按钮时，该函数会被调用（执行）：\n\n####\
    \ 示例\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h1>A Web Page</h1>\n<p id=\"\
    demo\">A Paragraph</p>\n<button type=\"button\" onclick=\"myFunction()\">Try it</button>\n\
    <script>\nfunction myFunction() {\n  document.getElementById(\"demo\").innerHTML\
    \ = \"Paragraph changed.\";\n}\n</script>\n</body>\n</html>\n```\n\n## 外部 JavaScript\n\
    \n外部文件：`myScript.js`\n```javascript\nfunction myFunction() {\n    document.getElementById(\"\
    demo\").innerHTML = \"Paragraph changed.\";\n}\n```\n\n当同一段代码在多个不同的网页中用时，外部脚本非常实用。JavaScript\
    \ 文件的扩展名为 `.js`。要使用外部脚本，将脚本文件名放在 `<script>` 标签的 `src` 属性中：\n\n#### 示例\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<script src=\"myScript.js\"></script>\n</body>\n\
    </html>\n```\n\n你可以根据意愿将外部脚本引用放置在 `<head>` 或 `<body>` 中。脚本的行为将就像它恰好位于 `<script>`\
    \ 标签所在的位置。外部脚本不能包含 `<script>` 标签。\n\n### 外部 JavaScript 的优势\n\n将脚本放置在外部文件中具有某些优点：\n\
    - 它将 HTML 和代码分离\n- 它让 HTML 和 JavaScript 更于阅读和维护\n- 缓存的 JavaScript 文件可以加快页面加载\n\
    \n向一个页面添加多个脚本文件 - 使用多个 `<script>` 标签：\n\n#### 示例\n```html\n<script src=\"myScript1.js\"\
    ></script>\n<script src=\"myScript2.js\"></script>\n```\n\n### 外部引用\n\n外部脚本可以使用完整\
    \ URL 或相对于当前网页的路径进行引用。此示例使用完整 URL 链接到脚本：\n```html\n<script src=\"https://www.w3schools.com/js/myScript1.js\"\
    ></script>\n```\n这链接到位于当前页面所在文件夹中的脚本：\n```html\n<script src=\"myScript.js\"></script>\n\
    ```\n\n## JavaScript 输出\n\nJavaScript 可以以不同的方式“显示”数据：\n- 使用 `window.alert()` 写入警框。\n\
    - 使用 `document.write()` 写入 HTML 输出。\n- 使用 `innerHTML` 写入 HTML 元素。\n- 使用 `console.log()`\
    \ 写入浏览器控制台。\n\n### 使用 `window.alert()`\n\n你可以使用警告框来显示数据：\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<h1>First Web Page</h1>\n<p>First paragraph.</p>\n<script>\nwindow.alert(5\
    \ + 6);\n</script>\n</body>\n</html>\n```\n\n### 使用 `document.write()`\n\n为了测试目的，使用\
    \ `document.write()` 是方便的：\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h1>First\
    \ Web Page</h1>\n<p>First paragraph.</p>\n<script>\ndocument.write(5 + 6);\n</script>\n\
    </body>\n</html>\n```\n在 HTML 完全加载后使用 `document.write()`，将删除现有的 HTML：\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<h1>First Web Page</h1>\n<p>First paragraph.</p>\n\
    <button onclick=\"document.write(5 + 6)\">Try it</button>\n</body>\n</html>\n\
    ```\n\n### 使用 `innerHTML`\n\n要访问 HTML 元素，JavaScript 可以使用 `document.getElementById(id)`\
    \ 方法。`id` 属性定义 HTML 元素。`innerHTML` 属性定义 HTML 内容：\n\n#### 示例\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<h1>First Web Page</h1>\n<p>First Paragraph</p>\n<p id=\"\
    demo\"></p>\n<script>\ndocument.getElementById(\"demo\").innerHTML = 5 + 6;\n\
    </script>\n</body>\n</html>\n```\n要在 HTML 中“显示数据”（在大多数情况下），你将设置 `innerHTML` 属性的值。\n\
    \n### 使用 `console.log()`\n\n在你的浏览器中，你可以使用 `console.log()` 方法显示数据：\n\n#### 示例\n\
    ```html\n<!DOCTYPE html>\n<html>\n<body>\n<h1>First Web Page</h1>\n<p>First paragraph.</p>\n\
    <script>\nconsole.log(5 + 6);\n</script>\n</body>\n</html>\n```\n\n## JavaScript\
    \ 语法\n\nJavaScript 语法是构建 JavaScript 构造的规则集。\n\n### JavaScript 程序\n\n计算机程序是的一份供计算机“执行”的“指令”列表。在编程语言中，这些程序指令被称为语句。JavaScript\
    \ 是一种编程语言。JavaScript 语句用分号隔开：\n\n#### 示例\n```javascript\nvar x, y;\nx = 5;\ny\
    \ = x + y;\n```\n在 HTML 中，JavaScript 程序由浏览器执行。\n\n### JavaScript 语句\n\nJavaScript\
    \ 语句由：值、表达式、关键字和注释组成。\n\n### JavaScript 值\n\nJavaScript 定义了两种类型的值：固定值和变量值。固定值被称为字面量。变量值就是变量。\n\
    \n### JavaScript 字面量\n\n编写固定值的最重要规则是：\n- 数字用小数形式写：`10.5`, `100`\n- 字符串是文本，写在双引号或单引号内：`\"\
    John Doe\"`, `'John'`\n\n### JavaScript 变量\n\n在编程语言中，变量用于存储数据。JavaScript 使用 `var`\
    \ 来声明变量。赋值运算符用于为变量赋值。在此示例中，`x` 被为一个变量。然后，给 `x` 赋值为 6：\n```javascript\nvar x;\n\
    x = 6;\n```\n\n### JavaScript 运算符\n\nJavaScript 使用赋值运算符 `=` 为变量赋值：\n```javascript\n\
    var x, y;\nx = 5;\ny = 6;\n```\nJavaScript 使用算术运算符（`+`,`-`,`*`,`/`）计算值。\n\n###\
    \ JavaScript 表达式\n\n表达式是值、变量和运算符的组合，它计算出一个值。这种组合被称为求值。例如，`5 * 10` 求值为 `50`。表达式也可以包含变量值：`x\
    \ * 10`。值可以是各种类型，如数字和字符串。例如，`\"John\" + \" \" + \"Doe\"` 求值为 `\"John Doe\"`。\n\
    \n### JavaScript 关键字\n\nJavaScript 关键字用于标识要执行的操作。`var` 关键字告诉浏览器创建变量：\n```javascript\n\
    var x, y;\nx = 5 + 6;\ny = x * 10;\n```\n\n### JavaScript 注释\n\n并不是所有的 JavaScript\
    \ 语句都会“执行”。双斜杠 `//` 之后以及 `/* */` 之间的代码被视为注释。注释会被忽略，不会被执行：\n```javascript\nvar\
    \ x = 5; // 我将被执行\n// var x = 6 我将不会执行\n```\n\n## JavaScript 标识符\n\n标识符是名称。在 JavaScript\
    \ 中，标识符用于命名变量（以及关键字、函数和标签）。大多数编程语言的命名规则相似。在 JavaScript 中，标识符的第一个字符必须是字母、下划线（`_`）或美元符号（`$`）。后续字符可以是字母、数字、下划线或美元符号。数字不允许作为第一个字符。这样\
    \ JavaScript 就可以轻松区分标识符和数字。\n\n### JavaScript 是大小写敏感\n\n所有的 JavaScript 标识符区分大小写。`lastName`\
    \ 和 `lastname` 是两个不同的变量：\n```javascript\nvar lastname, lastName;\nlastName = \"\
    Doe\";\nlastname = \"Person\";\n```\n\n### JavaScript 与驼峰命名法\n\n历史上，程序员使用三种方法将多个单词合并为一个变量名：\n\
    - **连字符**：`first-name`, `last-name`, `master-card`, `inter-city`。JavaScript 不允许连字符。它被保留用于减法。\n\
    - **下划线**： \n\n"
- fmt: "\n`first_name`, `last_name`, `master_card`, `inter_city`.\n\n### Camel Case\n\
    \n`FirstName`, `LastName`, `MasterCard`, `InterCity`.\n\n### camelCase\n\nJavaScript\
    \ programmers tend to use camel case that starts with a lowercase letter:\n\n\
    `firstName`, `lastName`, `masterCard`, `interCity`.\n\n### JavaScript Character\
    \ Set\n\nJavaScript uses the Unicode character set. Unicode covers (almost) all\
    \ the characters, punctuations, and symbols in the world.\n\n### JavaScript Statements\n\
    \nThis statement tells the browser to write \"Hello Dolly.\" inside an HTML element\
    \ with `id=\"demo\"`:\n\n#### Example\n\n```\ndocument.getElementById(\"demo\"\
    ).innerHTML = \"Hello Dolly.\";그런```\n\n### JavaScript Programs\n\nMost JavaScript\
    \ programs contain many JavaScript statements. The statements are executed, one\
    \ by one, in the same order as they are written. In this еample, `x`, `y`, and\
    \ `z` are given values, and finally `z` is displayed:\n\n#### Example\n\n```javascript\n\
    var x, y, z;\nx = 5;\ny = 6;\nz = x + y;\ndocument.getElementById(\"demo\").innerHTML\
    \ = z;\n```\n\nJavaScript programs (and JavaScript statements) are often called\
    \ JavaScript code.\n\n### Semicolons ;\n\nSemicolons separate JavaScript statements.\
    \ Add a semicolon at the end of each executable statement:\n\n```javascript\n\
    var a, b, c;\na = 5;\nb = 6;\nc = a + b;\n```\n\nWhen separated by semicolons,\
    \ multiple statements on one line are allowed:\n\n`a = 5; b = 6; c = a + b;`\n\
    \nOn the web, you might see examples without semicolons. Ending statements with\
    \ semicolon is not required, but highly recommended.\n\n### JavaScript White Space\n\
    \nJavaScript ignores multiple spaces. You can add white space to your script to\
    \ make it more readable. The following lines are equivalent:\n\n```javascript\n\
    var person = \"Hge\";\nvar person=\"Huge\";\n```\n\nA good practice is to put\
    \ spaces around operators (`= + - * /`):\n\n```javascript\nvar x = y + z;\n```\n\
    \n### JavaScript Line Length and Line Breaks\n\nFor best readability, programmers\
    \ often like to avoid code lines longer than 80 characters. If a JavaScript statement\
    \ does not fit on one line, the best place to break it, is after an operator:\n\
    \n#### Example\n\n```javascript\ndocument.getElementById(\"demo\").innerHTML =\n\
    \"Hello Dolly.\";\n```\n\n### JavaScript Code Blocks\n\nJavaScript statements\
    \ can be grouped together in code blocks, inside curly brackets `{...}`. The purpose\
    \ of code blocks is to define statements to be executed together. One place you\
    \ will find statements grouped together in blocks is in JavaScript functions:\n\
    \n#### Example\n\n```javascript\nfunction myFunction() {\n    document.getElementById(\"\
    demo1\").innerHTML = \"Hello Dolly.\";\n    document.getElementById(\"demo2\"\
    ).innerHTML = \"How are you?\";\n}\n```\n\n### JavaScript Keywords\n\nJavaScript\
    \ statements often start with a keyword to identify the JavaScript action to be\
    \ performed. Here is a list of some of the keywords you will learn about in this\
    \ tutorial:\n\n| Keyword | Description |\n| :--- | :--- |\n| `break` | Terminates\
    \ a switch or a loop |\n| `continue` | Jumps out of a loop and starts at the top\
    \ |\n| `debugger` | Stops execution of JavaScript, and (if available) debugging\
    \ |\n| `do ... while` | Executes a block and repeats the block while a condition\
    \ is true |\n| `function` | Defines a function |\n| `if ... else` | Marks a block\
    \ of statements depending on a condition |\n| `return` | Exits a function |\n\
    | `switch` | Marks a block of statements for different cases |\n| `try` | Error\
    \ handling |\n\n### JavaScript Comments\n\nJavaScript comments can be used to\
    \ explain JavaScript and make it more readable. JavaScript comments also used\
    \ to prevent execution, when testing.\n\n#### Single Line Comments\n\nSingle line\
    \ comments start with `//`. Any text between `//` and the end of the line ignored\
    \ (will not be executed). This example uses single line comment before each code:\n\
    \n```javascript\n// Change heading\ndocument.getElementById(\"myH\").innerHTML\
    \ = \"First Page\";\n// Change paragraph\ndocument.getElementById(\"myP\").innerHTML\
    \ = \"first paragraph.\";\n```\n\nThis example uses single line comment at the\
    \ end of each line to explain the code:\n\n```javascript\nvar x = 5; // Declare\
    \ x, give it value of 5\nvar y = x + 2; // Declare y, give it value of x + 2\n\
    ```\n\n#### Multi-line Comments\n\nMulti-line comments start with `/*` and end\
    \ with `*/`. Any text between `/*` and `*/` will be ignored by JavaScript. This\
    \ example uses a multi-line comment (a comment block) to explain the code:\n\n\
    ```javascript\n/*\nThe code below will change\nthe heading with id = \"myH\"\n\
    and the paragraph with id = \"myP\"\nin my page:\n*/\ndocument.getElementById(\"\
    myH\").innerHTML = \"First Page\";\ndocument.getElementById(\"myP\").innerHTML\
    \ = \"first paragraph.\";\n```\n\n### Using Comments to Prevent Execution\n\n\
    Using comments to prevent execution of code is suitable for testing. Adding `//`\
    \ in front of a code line changes the code lines from an executable line to a\
    \ comment. This example uses `//` to prevent execution of one of the code lines:\
    \ (Wait, the source text was missing the block here, but following the structure):\n\
    \nThis example uses a comment block to prevent execution of multiple lines:\n\n\
    ```javascript\n/*\ndocument.getElementById(\"myH\").innerHTML = \"First Page\"\
    ;\ndocument.getElementById(\"myP\").innerHTML = \"first paragraph.\";\n*/\n```\n\
    \n### JavaScript Variables\n\n#### JavaScript Variables\n\nJavaScript variables\
    \ are containers for storing data values. In this example, `x`, `y`, and `z` are\
    \ variables:\n\n```javascript\nvar x = 5;\nvar y = 6;\nz = x + y;\n```\n\nFrom\
    \ the example, you can expect:\n* `x` holds 5\n* `y` holds 6\n* `z` holds 11\n\
    \n#### JavaScript Names\n\nJavaScript variables identifiers are:\n\n* Names must\
    \ begin with a letter\n* Names can also begin with `$` or `_`\n* Reserved words\
    \ cannot be used as names\n* Names are case-sensitive\n\n### Assignment Operator\n\
    \nIn JavaScript, the equal sign `=` is an \"assignment\" operator, not an \"equal\"\
    \ operator. This is different from algebra. The following does not make sense\
    \ in algebra: `x = x + 5`. In JavaScript, however, it makes sense: it assigns\
    \ the value of `x + 5` to `x`. (It calculates the value of `x + 5` and puts the\
    \ result into `x`).\n\nThe \"equal to\" operator is written `==` in JavaScript.\n\
    \n### JavaScript Data Types\n\nJavaScript variables can hold numbers like 100\
    \ and text values like \"John Doe\". JavaScript can handle many types of data,\
    \ but for now, just think of numbers and strings.\n\nStrings are written inside\
    \ double or single quotes. Numbers are written without quotes. If you put a number\
    \ in quotes, it will be treated as a text string.\n\n```javascript\nvar pi = 3.14;\n\
    var person = \"John Doe\";\nvar answer = 'Yes I am!';\n```\n"
