    声明后，变量没有值。（技术上讲，它的值为 `undefined`）


    要给变量赋值，请使用等号：


    ```javascript

    carName = "Volvo";

    ```


    你也可以在声明变量时同时给它赋值：


    ```javascript

    var carName = "Volvo";

    ```


    在下面的示例中，我们创建了一个名为 `carName` 的变量，并给它赋值为 "Volvo"。然后，我们在一个 `id="demo"` 的 HTML 段落中“输出”该值：


    ### 示例


    ```html

    <p id="demo"></p>

    <script>

    var carName = "Volvo";

    document.getElementById("demo").innerHTML = carName;

    </script>

    ```


    ## 一条语句，多个变量


    你可以在一个语句中声明多个变量。以 `var` 开始该语句，并用逗号分隔变量：


    ```javascript

    var person = "John Doe", carName = "Volvo", price = 200;

    ```


    声明可以跨越多行：


    ```javascript

    var person = "John Doe",

    carName = "Volvo",

    price = 200;

    ```


    ## 值为 undefined


    在计算机程序中，变量通常在声明时不赋值。该值可以是必须计算的内容，也可以是以后提供的的内容，例如用户输入。


    未赋值时声明的变量，其值为 `undefined`。在执行此语句后，变量 `carName` 的值为 `undefined`：


    ### 示例


    ```javascript

    var carName;

    ```


    ## 重新声明 JavaScript 变量


    如果你重新声明一个 JavaScript 变量，它不会丢失原来的值。在执行这些语句后，变量 `carName` 仍然是 "Volvo"


    ### 示例


    ```javascript

    var carName = "Volvo";

    var carName;

    ```


    ## JavaScript 算术


    与代数一样，你可以对 JavaScript 变量进行算术运算，使用 `=` 和 `+` 等运算符：


    ### 示例


    ```javascript

    var x = 5 + 2 + 3;

    ```


    你也可以相加字符串，但字符串会被拼接：


    ### 示例


    ```javascript

    var x = "John" + " " + "Doe";

    ```


    再尝试这个：


    ### 示例


    ```javascript

    var x = "5" + 2 + 3;

    ```


    ## JavaScript 运算符


    ### 给变量赋值并求相加


    ```javascript

    var x = 5;         // 将 5 赋值给 x

    var y = 2;         // 将 2 赋值给 y

    var z = x + y;     // 将 7 赋值给 z (x + y)

    ```


    赋值运算符 (`=`) 为变量赋值。


    ### 赋值


    ```javascript

    var x = 10;

    ```


    ### 加法


    ```javascript

    var x = 5;

    var y = 2;

    var z = x + y;

    ```


    乘法运算符 (`*`) 用于数字相乘。


    ### 乘法


    ```javascript

    var x = 5;

    var y = 2;

    var z = x * y;

    ```


    ### 算术运算符


    算术运算符用于执行数字算术运算：


    | 运算符 | 描述 |

    | :--- | :--- |

    | `+` | 加法 |

    | `-` | 减法 |

    | `*` | 乘法 |

    | `/` | 除法 |

    | `%` | 取模 |

    | `++` | 自增 |

    | `--` | 自减 |


    复合加赋值运算符 (`+=`) 为变量增加一个值。


    ### 赋值


    ```javascript

    var x = 10;

    x += 5;

    ```


    赋值运算符在 JS 赋值图表中会有详细描述。


    ## JavaScript 字符串运算符


    `+` 运算符也可以用于添加（拼接）字符串。


    ### 示例


    `+=` 赋值运算符也可以用于添加（拼接）字符串：


    ```javascript

    txt1 = "What a very ";

    txt1 += "nice day";

    ```


    `txt1` 的结果将是：`What a very nice day`


    用于字符串时，`+` 运算符被称为拼接运算符。


    ### 字符串与数字


    相加两个数字将返回和，但相加一个数字和一个字符串将返回字符串：


    ### 示例


    ```javascript

    x = 5 + 5;

    y = "5" + 5;

    z = "Hello" + 5;

    ```


    `x`、`y` 和 `z` 的结果将是：

    - `10`

    - `55`

    - `Hello5`


    如果你相加一个数字和一个字符串，结果将是字符串！


    ## JavaScript 比较运算符


    | 运算符 | 描述 |

    | :--- | :--- |

    | `==` | 等于 |

    | `===` | 值相等且类型相等 |

    | `!=` | 不等于 |

    | `!==` | 值不等或类型不相等 |

    | `>` | 大于 |

    | `<` | 小于 |

    | `>=` | 大于等于 |

    | `<=` | 小于等于 |

    | `?` | 三元运算符 |


    ## JavaScript 逻辑运算符


    | 运算符 | 描述 |

    | :--- | :--- |

    | `&&` | 逻辑与 |

    | `||` | 逻辑或 |

    | `!` | 逻辑非 |


    ## JavaScript 类型运算符


    | 运算符 | 描述 |

    | :--- | :--- |

    | `typeof` | 返回变量的类型 |

    | `instanceof` | 如果对象是某个类型的实例，则返回 true |


    ## Java 和 JavaScript


    程序员面临的一个常见问题是混淆 Java 和 JavaScript。虽然这两种语言有相似之处，但它们是完全不同的物，且用于不同的应用。


    Java 是一种由 Sun Microsystems 开发的通用编程语言，其特点是“编写一次，到处运行”。Java 代码在虚拟机内部执行，因此可以发布 Java
    应用，而开发者无需担心它们可能运行在不同架构和系统。相反，JavaScript 是一种脚本语言。它仅用于网页。当网络浏览器加载页面时，它会执行其中的 JavaScript。代码可以改变网页的外观和行为。例如，JavaScript
    代码可以用于创建下拉菜单。

    '
- fmt: '

    However, there are still some things you will need to learn about data types because
    there are some side effects to not telling what type of information you want to
    store.


    In any case, the information still has a variable name. Here is an exercise that:

    1. gathers information from a prompt box,

    2. puts it into a variable,

    3. does a calculation, and

    4. sends the answer back in an alert.


    Add this code to the of a new web page:


    ```javascript

    var SquareThis = prompt("Enter a number you would like to square.");

    var Answer;

    Answer = SquareThis * SquareThis;

    alert(Answer);

    ```


    ## Basic Programming Skills in this Bit of Code


    1. When you do any kind of programming, you have to think of what pieces of information
    the computer will need to identify and hold on. Then you make variables to hold
    the information. In this example, we need to hold two pieces of information, 1)
    the number that will be squared, 2) the answer.

    2. You tell JavaScript that you want it to store information by naming `var`,
    a space and a variable name.

    3. The first line of this script does three jobs, 1) it tells JavaScript to set
    aside memory space for the variable `SquareThis`, 2) it uses a pre-written function
    to prompt the user for a number, 3) it takes whatever the user types in the prompt
    box and puts it in the memory space for `SquareThis`.

    4. Notice that the function `prompt` requires an argument just like the `alert()`
    did. Notice too that the argument is in " ", which means that the argument is
    a String data type.

    5. Now the script needs a variable to hold the answer. This is done with `var
    Answer;`.

    6. Everything is in place now to do the math: `Answer = SquareThis * SquareThis;`.
    The part that tells the computer what kind of math to do is called an operator.
    The main operators are `+`, `-`, `*`, `/` (add subtract, multiply, divide). There
    are many other operators, as well. A square is any number multiplied by itself;
    so this formula multiplies `SquareThis` by `SquareThis`.

    7. The program has an answer, but it needs to tell the user. Again, we will use
    an alert box.

    8. Now change the formula to do something else. Try adding another variable and
    another `alert()` to ask for another number (or several.)


    Here are some operators for you to experiment with:


    | Operator | JavaScript Math Functions |

    | :--- | :--- |

    | `+` | Adds two numbers |

    | `-` | Subtracts two numbers |

    | `/` | Divides two numbers |

    | `++` | Adds one to a number (only needs one variable) |

    | `--` | Subtracts one from a number (only needs one variable) |


    ## Conclusion


    HTML may not be used instead of JavaScript. Both programming languages are completely
    different and have different functions, features and capabilities. While HTML
    is a markup language and is designed to create static web page content, JavaScript
    is a programming language that can perform dynamic tasks. It can be used again
    and again on different pages of a site. This can be done by externalizing and
    placing it in separate files and linking a JavaScript file to the HTML code of
    the particular page. Hence, JavaScript can be added to many pages by adding the
    correct tags on each of the pages.


    Not everyone who owns a business may be well versed with JavaScript or know how
    to use it. Using it to create your site can only benefit your site because of
    the various aspects that JavaScript can add to it. Hence, it would always be helpful
    if you can hire a professional web design company who can help you build your
    site using JavaScript. The team of professional designers can sit with you, understand
    your business and design a site keeping all your business needs in mind.


    © Brian Draper

