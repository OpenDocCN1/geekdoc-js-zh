  \n## 第 6 章：高阶函数\n大型程序的开发需要时间，并且产生很多漏洞，这反过来使得它们难以找到。这里有两个程序的示例：第一个是自包含的，状态有六行代码。\n\
  \n```javascript\nlet total = 0, count = 1;\nWhile (count <= 10) {\n  Total += count;\n\
  \  Count += 1;\n}\nConsole.log(total);\n```\n第二个依赖于外部函数，状态只有一行。\n\n```javascript\n\
  Console.log(sum(range(1, 10)));\n```\n\n### 抽象\n在涉及 JavaScript 语言时，词汇使用了“抽象”（abstraction）一词。抽象用于隐藏细节，并提供在更高层次讨论问题的能力。让我们区分两种汤的配方：第一：在容器内放入\
  \ 1 杯干豌豆。加入足够的水没豌豆，浸泡 12 小时。从水中取出放入烹饪锅中，加入四杯水。煮沸约 2 小时，取半个洋葱，用刀切片并倒入豌豆中，准备 10 分钟。第二种配方：半个洋葱、一根芹菜、1\
  \ 杯碎豆和一个胡萝卜。将豌豆浸在水中约 12 小时。在水（4 杯）中煮约 2 小时，加入并切蔬菜煮 10 分钟。计算机逐个执行任务，从盲目到高层概念。\n\n\
  ### 抽象重复\n普通函数用于创建抽象。程序重复指定次数的某个函数是一种习惯。你可以通过这样的循环来实现它：\n\n```javascript\nfor (let\
  \ i = 0; i < 10; i++) {\n  Console.log(i);\n}\n```\n\n在这里我们写了一个调用 `console.log`\
  \ n 次的函数。\n\n```javascript\nfunction repeatlog(n) {\n  for (let i = 0; i < n; i++)\
  \ {\n    Console.log(i);\n  }\n}\n```\n\n如果你想执行与记录数字不同的任务，可以将操作作为函数值传入。\n\n```javascript\n\
  function repeat(n, action) {\n  for (let i = 0; i < n; i++) {\n    Action(i);\n\
  \  }\n}\n\nrepeat(3, console.log);\n// → 0\n// → 1\n// → 2\n```\n\n有时你不需要传入操作，可以使用定义的函数作为重复循环的替代：\n\
  \n```javascript\nlet ls = [];\nrepeat(5, i => {\n  ls.push(i + 1);\n});\nConsole.log(ls);\n\
  // → [\"1\", \"2\", \"3\", \"4\", \"5\"]\n```\n\n这种方法看起来类似于循环；尽管循环体在函数内部。高阶函数\n\
  高阶函数是通过返回其他函数来作用作用函数。这种函数用于隐藏细节。例如，你有一个返回函数的函数：\n\n```javascript\nfunction greater(n)\
  \ {\n  return m => m > n;\n}\n\nlet greater10 = greater(10);\nConsole.log(greater10(11));\n\
  // → true\nConsole.log(greater10(5));\n// → false\n```\n\n高阶函数也可以接受函数作为参数。\n\n```javascript\n\
  function filter(array, f) {\n```\n\n### 过滤数组\n你也可以拥有转换其他函数的。\n\n```javascript\n\
  function noisy(f) {\n  return (...args) => {\n    Console.log(\"calling with\",\
  \ args);\n    let result = f(...args);\n    Console.log(\"returned\", result);\n\
  \    return result;\n  };\n}\n\nnoisy(math.min)(3, 2, 1);\n// → calling with [3,\
  \ 2, 1]\n// → returned 1\n```\n\n你还可以编写产生新控制流的函数。\n\n```javascript\nfunction unless(test,\
  \ action) {\n  if (!test) action();\n}\n\nrepeat(3, n => {\n  unless(n % 2 == 1,\
  \ () => {\n    Console.log(n, \"is even\");\n  });\n});\n// → 0 is even\n// → 2\
  \ is even\n```\n\n这种方法是一种内置数组方法 `foreach`，它作为高阶函数产生一个类似于 `for/of` 循环的循环。\n\n```javascript\n\
  [\"a\", \"b\"].forEach(l => Console.log(l));\n// → a\n// → b\n```\n\n\n\n\n```javascript\n\
  Console.log(filter(scripts, script => script.living));\n```\n// → `[{name: \"adlam\"\
  , ...}, ...]`\n\n该函数利用名为 `test` 的参数（一个函数值）来填补计算过程中的空白。它决定了由哪个 `element` 来接收。\n\n\
  ### 使用 map 进行转换\n\n`map` 方法通过为数组的每一个元素设置一个函数来更改数组，并根据返回值创建一个新数组。新数组的长度与输入数组相同，但会通过函数将其内容映射为重命名的形式。\n\
  \n```javascript\nFunction map(array, transform) {\n  let mapped = [];\n  For (let\
  \ element of array) {\n    mapped.push(transform(e,element));\n  }\n  return mapped;\n\
  }\n```\n\n```javascript\nlet rtlscripts = scripts.filter(s => s.direction == \"\
  rtl\");\nConsole.log(map(rtlscripts, s => s.name));\n```\n// → `[\"adlam\", \"arabic\"\
  , \"imperial aramaic\", ...]`\n\n类似于 `foreach` 和 `filter`。\n\n### 使用 reduce 进行汇总\n\
  \n当你累加数字时，从零开始并将每个 foreach 元素加到总和上。`reduce` 的参数是 `map` 函数组合和初始值。这个函数比 `filter` 和\
  \ `map` 更容易理解，如下：\n\n```javascript\nFunction reduce(array, combine, begin) {\n \
  \ let current = begin;\n  For (let items of arrays) {\n    existing = combine(existing,\
  \ element);\n  }\n  return existing;\n}\n```\n\n```javascript\nConsole.log(reduce([0,1,\
  \ 2, 3, 4], (a, b) => a + b, 0));\n```\n// → `10`\n\n此函数与标准数组方法 `reduce` ，并提供了更多的舒适性。\n\
  \n```javascript\nConsole.log([1, 2, 3, 4].reduce((a, b) => a + b));\n```\n// → `10`\n\
  \n如果你想利用 `reduce` 来搜索字符更多的脚本，可以这样写：\n\n```javascript\nFunction charactercount(script)\
  \ {\n  return script.ranges.reduce((count, [from, to]) => {\n    return count +\
  \ (to - from);\n  }, 0);\n}\n```\n\n```javascript\nConsole.log(scripts.reduce((a,\
  \ b) => {\n  return charactercount(a) < charactercount(b) ? b : a;\n}));\n```\n\
  // → `{name: \"han\", ...}`\n\n### 可组合性\n\n花点时间思考，如果没有高阶函数，我们的代码列表将会有多长。\n\n```javascript\n\
  let biggest = null;\nFor (let script of scripts) {\n  If (biggest == null ||\n \
  \ charactercount(biggest) < charactercount(script)) {\n    biggest = script;\n \
  \ }\n}\nConsole.log(biggest);\n```\n// → `{name: \"han\", ...}`\n\n当你想组合操作时，可以使用高阶函数。例如，这里有一行代码用于搜索数据集中活体和死脚本的平均值。\n\
  \n```javascript\nFunction average(array) {\n  return array.reduce((a, b) => a +\
  \ b) / array.length;\n}\nConsole.log(math.round(average(scripts.filter(s => s.living).map(s\
  \ => s.length))));\n```\n// → `165`\n\n```javascript\nConsole.log(math.round(average(scripts.filter(s\
  \ => !s.living).map(s => s.length))));\n```\n// → `204`\n\n这段代码显示死脚本比活脚本更老。让我们从过滤掉死脚本（或活脚本）开始，计算它们的平均值。你也可以将计算写在一个大循环中：\n\
  \n```javascript\nlet total = 0, count = 0;\nFor (let script of scripts) {\n  If\
  \ (script.living) {\n    total += script.length;\n    Count += 1;\n  }\n}\nConsole.log(math.round(total\
  \ / count));\n```\n// → `165`\n\n我们的两个示例并不相同，第一个在执行 map 和 filter 时创建了新数组，而第二个计算数字。\n\
  \n### 字符串与字符编码\n\n数据集的重要用途之一是找出文本块使用的脚本。以下是一个执行该任务的程序。每个脚本都包含与其相关的字符编码数组。因此，如果你有一个字符编码，可以使用此函数搜索对应的脚本（如果可用）：\n\
  \n```javascript\nFunction characterscript(code) {\n  For (let script of scripts)\
  \ {\n    If (script.ranges.some([[from, to]) => {\n      return code >= from &&\
  \ code < to;\n    })) {\n      return script;\n    }\n  }\n  return null;\n}\n```\n\
  \n```javascript\nConsole.log(charactersscript(121));\n```\n// → `{name: \"latin\"\
  , ...}`\n\n另一个高阶函数是相同的方法。此方法获取一个测试函数，并判断该函数是否对数组中的任何组件返回 true。javascript 字符串上有一些操作，例如使用\
  \ `length` 属性获取其长度，以及通过方括号评估其内容。\n\n```javascript\n// 两个 emoji 字符，马和鞋子\nlet horse_shoe\
  \ = \"\U0001F434\U0001F45F\";\nConsole.log(horse_shoe.length);\n```\n// → `4`\n\n\
  ```javascript\nConsole.log(horse_shoe[0]);\n```\n// → `(无效的半字符)`\n\n```javascript\n\
  Console.log(horse_shoe.charCodeAt(0));\n```\n// → `55357 (半字符的编码)`\n\n```javascript\n\
  Console.log(horse_shoe.codePointAt(0));\n```\n// → `128052 (马 emoji 的实际编码)`\n\n\
  Javascript 的 `charCodeAt` 方法提供一个完整的 unicode 字符。此方法用于从字符串中提取字符。尽管发送给 `codePointAt`\
  \ 的参数仍然是代码单元序列中的索引。如果你在跨字符串中使用 `codePointAt`，它会产生龙。\n\n```javascript\nlet dragon\
  \ = \"\U0001F409\";\nFor (let char of dragon) {\n  Console.log(char);\n}\n```\n\
  // → `\U0001F409`\n\n`countby` 函数预期一个集合（一组）并返回一个对象列表。每个对象命名一个组，并确定该组中包含的元素数量。\n\n\
  ```javascript\nFunction countby(items, groupname) {\n  let counts = [];\n  For (let\
  \ item of items) {\n    let name = groupname(item);\n    let known = counts.find(c\
  \ => c.name == name);\n    if (known == -1) {\n      counts.push({name, count: 0});\n\
  \    } else {\n      known.count++;\n    }\n  }\n  return counts;\n}\n```\n\n```javascript\n\
  Console.log(countby([0,1, 2, 3, 4, 5], n => n > 2));\n```\n// → `[{name: false,\
  \ count: 2}, {name: true, count: 3}]`\n\n`countby` 函数预期一个集合（一组）并正确确定文本块中哪种脚本。\n\n\
  ```javascript\nFunction textscripts(text) {\n  let scripts = countby(text, char\
  \ => {\n    let script = characterscript(char.codePointAt(0));\n    return script\
  \ ? script.name : \"none\";\n  }).filter(({name,}) => name != \"none\");\n\n  let\
  \ total = scripts.reduce((n, {count}) => n + count, 0);\n\n  if (total == 0) return\
  \ \"no scripts found\";\n\n  return scripts.map(({name, count}) => {\n    return\
  \ `${math.round(count * 100 / total)}% ${name}`;\n  }).join(\", \");\n}\n```\n\n\
  ```javascript\nConsole.log(textscripts('英国的狗说\"woof\", 俄罗斯的狗说\"тяв\"'));\n```\n\n\
  \n\n\n`calculate` 函数通过使用 `characterscript` 绑定名称来按名称计算字符，对于没有任何脚本的字符，它返回字符串 \"none\"\
  。如果你想计算百分比，你需要确定属于 `reduce` 方法可以还原的脚本字符总数。如果找到零个字符，该函数将返回 \"none\" 字符串。\n\n## 总结\n\
  将函数值传递给多个函数的能力是 JavaScript 的一个至关重要的方面。它允许编写在之间存在“间隙”的模拟计算函数。声明这些函数的代码可以通过提供函数值来包含这些间隙。数组提供了几个重要的高阶方法。使用\
  \ `foreach` 遍历数组内的元素。使用 `filter` 方法返回一个包含符合谓词函数元素的新数组。使用 `map` 通过函数设置每个项来更改数组。使用\
  \ `reduce` 将数组的每个组件合并为一个单独值。\n\n### 练习\n阐述一个 JavaScript 函数，该函数接收一个保存的数字数组，并搜索第二低和第二高的数字。\n\
  \n### 解决方案\n![00160.jpg](img/00160.jpeg)![00139.jpg](img/00139.jpeg)\n\n## 第 7 章：对象的秘密生活\n\
  在编程语言方面，有一组技术将对象作为程序组织的基本思想，它们被称为面向对象编程。这一概念在本章中进一步解释。\n\n### 封装\n面向对象编程的主要意义是将程序拆成小部分，并确保每个部分都管理自己的区域。几个类似的程序片段通过接口相互通信，接口是一组受限制的函数或绑定，在更高层次产生基本功能，同时隐藏特定的执行细节。通过对象说明这种类型的程序片段，它们的布局包含特定的属性和方法。布局中的属性是公共的，而外部代码是私有的。在注释或文档中定义可访问的布局。通常在属性名称开头使用下划线（`_`）字符表示私有属性。同时，将布局与执行分离被称为封装。\n\
  \n### 方法\n方法是获取函数值的属性。\n\n```javascript\nlet rabbit = {};\n\nRabbit.speak = function(line,)\
  \ {\n  Console.log(`the rabbit says '${line}'`);\n};\n\nRabbit.speak(\"i'm alive.\"\
  );\n// → the rabbit says 'i'm alive.'\n```\n\n当你将函数作为方法调用时，绑定会在其体内部调用它，并指向调用它的对象。\n\
  \n```javascript\nfunction speak(line,) {\n  Console.log(`the ${this.type,} rabbit\
  \ says '${line}'`);\n}\n\nlet white_rabbit = {type: \"white,\", speak};\nlet hungryrabbit\
  \ = {type: \"hungry\" speak};\n\nWhite_rabbit.speak(\"oh my whiskers,\" + \"how\
  \ late it's getting!\");\n// → the white rabbit says 'oh my whiskers, how late it's\
  \ getting!'\n\nHungryrabbit.speak(\"i could use a carrot right now.\");\n// → the\
  \ hungry rabbit says 'i could use a carrot right now.'\n```\n\n箭头函数不绑定自己的 `this`。你可以编写以下代码：\n\
  \n```javascript\nFunction normal() {\n  Console.log(this.coords.map(n => n / this.length));\n\
  }\n\nNormal.call({coords: [0, 2, 3], length: 5});\n// → [0, 0.4, 0.6]\n```\n\n###\
  \ 原型\n留意此点。\n\n```javascript\nlet empty = {};\nConsole.log(empty.toString);\n//\
  \ → function toString() {}\nConsole.log(empty.toString());\n// → [object Object]\n\
  ```\n\n属性是从对象中提取的。许多对象包含一个原型。这是属性的另一种来源。许多对象并不包含该属性，它们继承自原型。\n\n```javascript\n\
  Console.log(Object.getPrototypeOf({}));\n// Object.prototype\n\nConsole.log(Object.getPrototypeOf(null));\n\
  // → null\n```\n\n对象的原型是一个将对象转换为字符串的方法。许多对象并不包含该属性，它们继承自原型；函数继承自数组。\n\n类的原型包含了通过它构建的实例中可用的方法。\n\
  \n```javascript\nConsole.log(Object.getPrototypeOf(Object.create({})) === Object.prototype);\n\
  // → true\n\nConsole.log(Object.getPrototypeOf([]));\n// Array.prototype\n```\n\n\
  对象的原型是一个返回对象原型的方法。\n\n```javascript\nlet empty = {};\nConsole.log(Object.getPrototypeOf(empty));\n\
  // Object.prototype\n```\n\n对象的原型是一个返回对象原型的方法。\n\n```javascript\nlet proto = {\n\
  \  speak(line,) {\n    Console.log(`the ${this.type,} rabbit says '${line}'`);\n\
  \  }\n};\n\nlet rabbit = Object.create(proto);\nrabbit.type = \"rabbit\";\n\nrabbit.speak(\"\
  hello!\");\n// → the rabbit says 'hello!'\n```\n\n\n\n\nJavascript 类是带有原型和属性的构造函数。以下是一个示例：\n\
  \n```javascript\nClass rabbit {\n  Constructor(type) {\n    this.type = type;\n\
  \  }\n\n  Speak(line) {\n    console.log(`the ${this.type} rabbit says '${line}'`);\n\
  \  }\n}\n```\n\nlet killerabbit = new rabbit(\"killer\");\nlet blackrabbit = new\
  \ rabbit(\"black\");\n\n`class` 关键字以 `class` 声明开始，它允许你在特定位置描述一个构造函数和一组方法。`class`\
  \ 声明允许将包含函数的方法和属性捕获并包含在原型中。当你使用一个表达式时，它并不是描述一个绑定，而是将构造函数作为一个值。你可以在表达式中省略类名。\n\n\
  ```javascript\nlet object = new class {getword() { return \"hello\"; } };\n\nconsole.log(object.getword());\n\
  // → he,llo\n```\n\n### 覆盖派生属性\n\n当一个属性被添加到对象时（无论在原型中是否可用），该属性都会被加到对象中。如果原型中存在一个同名的已赋值属性，它不会影响该对象。\n\
  \n```javascript\nRabbit.prototype.teeth = \"small\";\n\nconsole.log(killerabbit.teeth);\n\
  // → small\n\nkillerabbit.teeth = \"long, sharp, and bloody\";\n\nconsole.log(killerabbit.teeth);\n\
  // → long, sharp, and bloody\n\nconsole.log(blackrabbit.teeth);\n// → small\n\n\
  console.log(rabbit.prototype.teeth);\n// → small\n```\n\n覆盖属性用于改进标准函数和数组原型提供一个独立的\
  \ `toString` 方法。\n\n```javascript\nconsole.log(array.prototype.toString == Object.prototype.toString);\n\
  // → false,\n\nconsole.log([1, 3].toString());\n// → 1,3\n```\n\n在数组上调用 `toString`\
  \ 存储的结果的结果类似于对它调用 `join(\",\")` 的结果。它会在数组包含的值之间放置一个逗号。如果你对数组调用 `object.prototype.toString`，它会提供一个独立的字符串。\n\
  \n```javascript\nconsole.log(object.prototype.toString.call([1, 3]));\n// → [object\
  \ array]\n```\n\n### 映射 (Maps)\n\nMap 是一种将值与其他值连接的数据布局。如果你想将名称映射到年龄，可以这样写代码：\n\n\
  ```javascript\nlet ages = {\n  Boris: 39,\n  Liang: 22,\n  Júlia: 62\n};\n\nconsole.log(`julia\
  \ is ${ages[\"julia\"]}`);\n// → julia is 62\n\nconsole.log(\"is jack's age, known?\"\
  , \"jack\" in ages);\n// → is jack's age, known? false,\n\nconsole.log(\"is tostring's\
  \ age, known?\", \"tstring\" in ages);\n// → is tostring's age, known? true,\n```\n\
  \n对象的属性名应该是字符串。如果你想要一个键不会被转换为字符串的映射，不要使用 `object` 作为映射。Javascript 包含一个名为 `map` 的类。它保存映射关系并允许不同类型的键。\n\
  \n```javascript\nlet ages = new map();\n\nages.set(\"boris\", 39);\nages.set(\"\
  liang\", 22);\nages.set(\"júlia\", 62);\n\nconsole.log(`jlia is ${ages.get(\"júlia\"\
  )}`);\n// → julia is 62\n\nconsole.log(\"is jack's age, known?\", ages.has(\"jack\"\
  ));\n// → is jack's age, known? false,\n\nconsole.log(ages.has(\"tstring\"));\n\
  // → false,\n```\n\n`get`、`set` 和 `has` 方法是 map 对象布局体。`object.keys` 只返回对象的键。你可以使用\
  \ `has` 方法作为选项。\n\n```javascript\nconsole.log({x: 1}.has(\"x\")); // → true,\nconsole.log({x:\
  \ 1}.has(\"toString\")); // false,\n```\n\n### 多态\n\n当在对象上调用字符串函数时，会调用该对象上的 `toString`\
  \ 方法来构建一个有意义的字符串。你可以定义自己的 `toString` 版本，以便它们可以构建包含比 \"[object object]\"更多数据的字符串。以下是一个插图：\n\
  \n```javascript\nRabbit.prototype.toString = function() {\n  return `a ${this.type}\
  \ rabbit`;\n};\n\nconsole.log(blackrabbit);\n// → a black rabbit\n```\n\nSymbol\
  \ 是通过 `symbol` 函数构建的唯一值，无法构建两次。\n\n```javascript\nlet sym = symbol(\"name\");\n\n\
  console.log(sym == symbol(\"name\")); // false,\n\nRabbit.prototype[sym] = 55;\n\
  \nconsole.log(blackrabbit[sym]); // → 55\n```\n\n传递给 `symbol` 的字符串在将其转换为字符串时会被附加。它们是作为属性名的函数。\n\
  \n```javascript\nconst toString = symbol(\"toString\");\nArray.prototype[toString]\
  \ = function() {\n  return `${this.length} cm of yarn`;\n};\n\nconsole.log([1, 2].toString());\
  \ // 1,2\nconsole.log([1, 2][toString]()); // 2 cm of yarn\n```\n\n迭代器接口\n\n传递给\
  \ `for/of` 循环的状态对象是迭代的。这意味着当属性被调用时，它包含一个带有 `symbol.iterator` 的命名方法。该方法返回一个产生第二个布局的对象，它包含一个\
  \ `next` 方法，用于发送下一个结果。结果是一个带有 `value` 属性的对象。查看这个布局：\n\n```javascript\nlet iterator\
  \ = \"ok\"[symbol.iterator]();\n\nconsole.log(iterator.next()); // {value: \"o\"\
  , done: false}\n\nconsole.log(iterator.next()); // {value: \"k\", done: false}\n\
  \nconsole.log(iterator.next()); // {value: undefined, done: true}\n```\n\n让我们实现一个迭代数据结构，我们将构建一个\
  \ `matrix` 类，作为一个二维数组：\n\n```javascript\nclass matrix {\n  Constructor(width, height,\
  \ element = (x, y) => undefined) {\n    this.width = width;\n    this.height = height;\n\
  \    this.content = [];\n    for (let y = 0; y < height; y++) {\n      for (let\
  \ x = 0; x < width; x++) {\n        this.content[y * width + x] = element(x, y);\n\
  \      }\n    }\n  }\n\n  get(x, y) {\n    return this.content[y * width + x];\n\
  \  }\n\n  set(x, y, value) {\n    this.content[y * width + x] = value;\n  }\n}\n\
  ```\n\n类的内容保在一个包含宽度 × 高度元素的独立数组中。这些元素按行保存。构造函数获取宽度、高度以及一个额外的元素函数，用于设置初始值。使用 `get`\
  \ 方法和 `set` 方法来恢复和更新矩阵内的元素。以下是带有 x、y 和 value 属性的对象布局：\n\n```javascript\nclass matrixiterator\
  \ {\n  Constructor(matrix) {\n    this.x = 0;\n    this.y = 0;\n    this.matrix\
  \ = matrix;\n  }\n\n  next() {\n    if (this.y === this.matrix.height) {\n     \
  \ return {done: true};\n    }\n    let value = {\n      x: this.x,\n      y: this.y,\n\
  \      value: this.matrix.get(this.x, this.y)\n    };\n    this.x++;\n    if (this.x\
  \ === this.matrix.width) {\n      this.x = 0;\n      this.y++;\n    }\n    return\
  \ value;\n  }\n}\n```\n\n\n\n\n\n```javascript\nreturn {value, done: false};\n\n\
  }\n\n}\n```\n\n下面是一个可迭代矩阵类的示例：\n\n```javascript\nMatrix.prototype[iterator] = function()\
  \ {\n  return new matrixiterator(this);\n};\n```\n\n现在我们可以使用 `for/of` 来遍历矩阵了。\n\n\
  ```javascript\nlet matrix = new matrix(2, 2, (x, y) => `value, ${x},${y}`);\nfor\
  \ (let {x, y, value,} of matrix) {\n  Console.log(x, y, value);\n}\n// → 0 0 value,\
  \ 0,0\n// → 1 0 value, 1,0\n// → 0 1 value, 0,1\n// → 1 1 value, 1,1\n```\n\n##\
  \ 静态 getter 和 setter\n\n布局由方法组成，但你也可以附加存储值的非函数属性，就像一个 map 对象，包含一个 `size` 属性，该属性决定了保存了多少个键。被赋值的属性可以隐藏方法调用。这些方法被称为\
  \ getter（访问器），你可以通过在类声明或对象表达式的方法名开头编写 \"get\" 来描述它们。\n\n```javascript\nlet varyingsize\
  \ = {\n  get size() {\n    return math.floor(math.random() * 100);\n  }\n};\n\n\
  Console.log(varyingsize.size);\n// → 73\nConsole.log(varyingsize.size);\n// → 49\n\
  ```\n\n当你想要使用对象的 `size` 属性时，你会调用关联的方法。当你使用 setter 使用属性时，也可以执行类似的任务。\n\n```javascript\n\
  Class temperature {\n  Constructor(celsius) {\n    this.celsius = celsius;\n  }\n\
  \  get fahrenheit() {\n    return this.celsius * 1.8 + 32;\n  }\n  set fahrenheit(value)\
  \ {\n    this.celsius = (value - 32) / 1.8;\n  }\n  Static fromfahrenheit(value)\
  \ {\n    return new temperature((value - 32) / 1.8);\n  }\n}\n```\n\n```javascript\n\
  let temp = new temperature(22);\nConsole.log(temp.fahrenheit);\n// → 71.6\ntemp.fahrenheit\
  \ = 86;\nConsole.log(temp.celsius);\n// → 30\n```\n\n`temperature` 类允许你读取和写入摄氏度或华氏度的温度，但它只保存摄氏度并在华氏度的\
  \ getter 和 setter 中与摄氏度转换。在类声明内部，写在名称之前的静态方法会被保存在构造函数上。因此，你可以编写 `temperature.fromfahrenheit(100)`\
  \ 来通过华氏度构建温度。\n\n## 继承\n\n某些矩阵是对称的。当你通过左上到右下的对角线反射一个对称矩阵时，它不会改变。设置的值 x 与 y 保持相同。使用\
  \ JavaScript 的原型系统来构建新类，新类的元的从旧类继承，但为方法设置了新的定义。这被称为面向对象编程中的继承。下面是一个示例：\n\n```javascript\n\
  Class symmetricmatrix extends matrix {\n  Constructor(size, size = (x, y) => {\n\
  \    Super(size, size);\n  }\n  get(x, y) {\n    if (x < y) return Super(y, x);\n\
  \    else return(x, y);\n  }\n  set(x, y, value) {\n    Super(x, y, value);\n  \
  \  if (x != y) {\n      Super(y, x, value);\n    }\n  }\n}\n\nlet matrix = new symmetricmatrix(5,\
  \ (x, y) => `${x},${y}`);\nConsole.log(matrix.get(2, 3));\n// → 3,2\n```\n\n## instanceof\
  \ 运算符\n\n了解一个对象是否源自某个特定的实例是重要的。\n\n```javascript\nConsole.log(new symmetricmatrix(2)\
  \ instanceof symmetricmatrix);\n// → true\nConsole.log(new symmetricmatrix(2) instanceof\
  \ matrix);\n// → true\nConsole.log(new matrix(2, 2) instanceof symmetricmatrix);\n\
  // → false\nConsole.log([1] instanceof array);\n// → true\n```\n\n该运算符将扫描我们编写的类型。一个标准构造函数。\n\
  \n## 总结\n\n在本章中，我们意识到对象不仅可以持有它们的属性。它们还由同样是对象的原型组成。只要原型拥有该属性，它们的行为就像它们包含了自身并不提供的属性一样。简单对象使用\
  \ `object.prototype` 来表示它们的原型。我们也讨论了构造函数，它们是函数，名称通常以大写字母开头，并配合 `new` 运算符来构建新对象。新对象的原型将是构造函数\
  \ `prototype` 属性中的对象。类语法提供了一种描述构造函数及其原型的方法。我们还接触了 getter、setter、静态方法以及 `instanceof`\
  \ 运算符。\n\n### 练习\n\n编写一个 JavaScript 程序，通过迭代函数和一个主种子值创建一个数组。\n\n### 解决方案\n\n![00194](img/00194.)\n\
  \n## 第 8 章：机器人\n\n在本章中，将处理一个机器人程序，这是一个在虚拟世界中执行任务的短程序。我们将使用一个邮件快递机器人，接收并递送包裹。草地（the\
  \ meadow）是一个由 4 个地方组成的小村。下面是一个带有数组的示例：\n\n```javascript\nConst roads = [\n  \"alice's\
  \ house-bob's house\",\n  \"bob's house-daria's house\",\n  \"daria's house-rnie's\
  \ house\",\n  \"rnie's house-fahrenheit's house\",\n  \"fahrenheit's house-shop\"\
  ,\n  \"shop-town hall\"\n];\n```\n\n草地场（the meadow field）是一个连接机器人行走的节点的图。\n\n```javascript\n\
  Function buildgraph(roads) {\n  let graph = {};\n  function addge(from, to) {\n\
  \    if (graph[from] == null) {\n      graph[from] = [to];\n    } else {\n     \
  \ graph[from].push(to);\n    }\n  }\n  for (let [from, to] of roads.map(r => r.split(\"\
  -\"))) {\n    addge(from, to);\n    addge(to, from);\n  }\n  return graph;\n}\n\n\
  Const roadgraph = buildgraph(roads);\n```\n\n\n\n\n```javascript\nMove,(de,destination)\
  \ {\n  if (!Roadgraph[this.place].includes(de,destination)) {\n    return this;\n\
  \  } else {\n    let parcels = this.parcels.map(p => {\n      if (p.place != this.place)\
  \ return p;\n      return {place: destination, address: p.address};\n    }).filter(p\
  \ => p.place != p.address);\n    return new village,state(destination, parcels);\n\
  \  }\n}\n```\n\n`move` 方法是动作中心。它检查是否存在从一个地方到另一个地方的路径，如果没有，则返回旧状态，因为该移动是无效的。然后它构建一个新状态，将目的地设置为机器人的新位置，并构建一组新的包裹。对\
  \ `map` 的调用处理了移动，对 `filter` 的调用处理了送递。\n\n```javascript\nlet first = new village,state(\n\
  \  \"post office,\",\n  [{place: \"post office,\", address: \"alice,'s house,\"\
  }]\n);\n\nlet next = first.move(\"alice,'s house,\");\n\nConsole.log(next.place);\n\
  // → alice,'s house,\n\nConsole.log(next.parcels);\n// → []\n\nConsole.log(first.place);\n\
  // → post office,\n```\n\n### 持久数据\n\n不可更改的数据布局被称为不可变的（immutable）或持久的（persistent）。它们的作用就像字符串和数字。在\
  \ javascript 中，你可以改变几乎所有内容。有一个名为 `object.freeze` 的函数可以转换一个对象，使其忽略对其属性的写入。\n\n```javascript\n\
  let object = object.freeze({value: 5});\nobject.value = 10;\n\nConsole.log(object.value);\n\
  // → 5\n```\n\n### 模拟\n\n送货机器人会观察世界并决定它移动的方向。因此，机器人是一个函数，它接收一个 `village,state` 对象并返回附近地方的名称。机器人返回一个包含其意图方向和记忆值的对象，当你下次调用它时会返回该记忆值。\n\
  \n```javascript\nFunction runrobot(state, robot, memory) {\n  for (let turn = 0;;\
  \ turn++) {\n    if (state.parcels.length == 0) {\n      Console.log(`done in ${turn}\
  \ turns`);\n      break;\n    }\n    let action = robot(state, memory);\n    state\
  \ = state.move(action.direction);\n    memory = action.memory;\n    Console.log(`moved\
  \ to ${action.direction}`);\n  }\n}\n```\n\n机器人在每一都可以向不同的方向行走。它可以遇到所有包裹然后到达送货点。以下是一个示例：\n\
  \n```javascript\nFunction randompick(array) {\n  let choice = math.floor(math.random()\
  \ * array.length);\n  return array[choice];\n}\n\nFunction randomrobot(state,) {\n\
  \  return {direction: randompick(roadgraph[state.place])};\n}\n```\n\n如果你想测试这个独特的机器人，请创建一个包含少量包裹的新状态。\n\
  \n```javascript\nVillage,state.random = function(parcel,lcount = 5) {\n  let parcels\
  \ = [];\n  for (let i = 0; i < parcelcount; i++) {\n    let address = randompick(object.keys(roadgraph));\n\
  \    let place;\n    do {\n      place = randompick(object.keys(roadgraph));\n \
  \   } while (place == address);\n    parcels.push({place, address});\n  }\n  return\
  \ new village,state(\"post office,\", parcels);\n};\n```\n\n`do` 循环在获取正确地址时继续选择新地方。让我们启动一个虚拟世界吧。\n\
  \nRunrobot(village,state.random(), randomrobot); // → 走到 mark // → 走到 town hall\
  \ // → 在 63 个回合后运行\n\n机器人运输包裹花费了太多回合，因为没有计划。如果你搜索一条经过村庄中所有地方的路线，邮件车的路线可能会机器人运行两次，但可以保证它会运行。以下是一个示例（从邮局开始）：\n\
  \n```javascript\nConst mailroute = [\n  \"alice,'s house,\", \"cabin,\", \"alice,'s\
  \ house,\", \"bob's house,\",\n  \"town hall,\" \"aria's house,\", \"ernnie's house,\"\
  , \"greete's house,\",\n  \"shop\", \"greete's house,\", \"farm\", \"market,\",\
  \ \"post office,\"\n];\n```\n\n要使用这条路线，你需要利用机器人记忆。机器人路线的其余部分存储在它的记忆中，并在每回合分发第一个。\n\
  \n```javascript\nFunction route(state, memory) {\n  if (memory.length == 0) {\n\
  \    memory = mailroute;\n  }\n  return {direction: memory[0], memory: memory.slice(1)};\n\
  }\n```\n\n机器人现在变快了。它最多需要 26 个回合（13 步路线的两倍），但通常更少。\n\n### 路径查找\n\n一种有趣的方法是从起点开始开发路线，并检查每个未访问过的可用地方，直到达到目标。下面的插解释了这一点：\n\
  \n```javascript\nFunction findroute(graph, from, to) {\n  let work = [{at: from,\
  \ route: []}];\n  for (let i = 0; i < work.length; i++) {\n    let {at, route} =\
  \ work[i];\n    for (let location of graph[at]) {\n      if (place == to) return\
  \ route.concat(location);\n      if (!Work.some(w => w.at == location)) {\n    \
  \    Work.push({at: place, route: route.concat(location)});\n      }\n    }\n  }\n\
  }\n```\n\n该函数保存了一个工作列表。这是一个将与路线一起检查的地点数组。它从空路线和起始位置开始。每个地方都可以从每个地方到达，在两个点之间也可以找到一条不会失败的路线。\n\
  \n```javascript\nFunction goalrobot({location, parcel}, routes) {\n  if (route.length\
  \ == 0) {\n    let parcel = parcel[0];\n    if (parcel.location != place) {\n  \
  \    route = findroute(roadgraph, location, parcel.place);\n    } else {\n     \
  \ route = findroute(roadgraph, location, parcel.address);\n    }\n  }\n  return\
  \ {direction: routes[0], memory: route.slice(1)};\n}\n```\n\n## 总结\n\n在本章中，我们接触使用\
  \ javascript 的机器人。我们来到了草地村庄，在那里我们讨论了一个拥有 11 个地方和 14 条道路的村庄，然后我们到了持久数据，那里数据结构的行为类似于字符串且不会改变。模拟允许你将记忆传递给机器人并让它们返回新的记忆。\n\
  \n### 练习\n\n编写一个简单的 javascript 程序，将下面数组中的每个元素连接成一个字符串。\n\n\"red, green, white, black\"\
  \n\n\"red, green, white, black\"\n\n\"red+green+white+black\"\n\n### 答案\n\n![00127.jpg](img/00127)\n\
  \n## 第 9 章：bug 和错误\n\n计算机程序的缺陷被称为 bug，即计算机程序所犯的错误。\n\n### 严格模式\n\n你可以在严格模式下使用 javascript。这可以通过在文件最顶部添加字符串\
  \ \"use strict\" 来。下面是一个示例：\n\n```javascript\nFunction canyoustheproblem() {\n \
  \ \"use strict\";\n  for (counter = 0; counter < 10; counter++) {\n    Console.log(\"\
  happy happy\");\n  }\n}\n```\n\n`canyoustheproblem();` // → 引用错误：counter 未定义\n\n\
  当你想要调用构造函数而省略 `new` 关键字以免引入新创建的对象时，请使用下面的代码：\n\n```javascript\nFunction person(name)\
  \ {this.name = name;}\n```\n\n`let ferdinand = person(\"ferdininand\"); // 哎呀\n\n\
  `Console.log(name);` // → ferdininand\n\n\n\n\n\n对 `person` 的伪调用执行成功，但返回一个未定义的值并创建了全局绑定名称。在严格模式下，使用\
  \ `\"use strict\";`。\n\n```javascript\nfunction person(name,) {\n  this.name = name;\n\
  }\n\nlet ferdininand = person(\"ferdininand\"); // 忘记了 new\n\n// → error: cannot\
  \ set property 'name' of undefined\n```\n\n错误信息提示我们出问题了。这是好事。使用 class 语法构建的构造函数在你不带\
  \ `new` 运行它们时通常会报错。严格模式不允许设置名称相似的多个函数，并消除了某些语言问题。\n\n### 测试\n\n你可以使用这个函数来查找程序中的错误。这是通过反复运行来实现的。计算机在重复性任务中表现出色。这个过程被称为自动化测试。它涉及到编写一个测试另一个程序的程序。测试通常会通过一些带有标签的小程序来确定你代码的某部分是否正确。例如，让我们为\
  \ `toUpperCase` 方法创建一组测试。下面是一个示例：\n\n```javascript\nfunction test(label, body) {\n\
  \  If (!Body()) console.log(`failed: ${label}`);\n}\n\ntest(\"convert latin text\
  \ to uppercase,\", () => {\n  Return \"hello\".toUpperCase() == \"hello\";\n});\n\
  \ntest(\"convert greek text to uppercase,\", () => {\n  Return \"χαίρετε\".toUpperCase()\
  \ == \"χαίρετε\";\n});\n\ntest(\"don't convert case-less characters\", () => {\n\
  \  Return \"ࢎ࠶߈ఆ௷\".toUpperCase() == \"ࢎ࠶߈ఆ௷\";\n});\n```\n\n### 调试\n\n当程序显示错误时，下一步是确定问题并修复。错误信息会直接指向你代码块中的某一行。查看错误描述，你就会发现问题所在。这个示例程序尝试通过不断提取最后一位并除以以消除该数字，在指定的进制（十进制、二进制等）内将整数转换为字符串。\n\
  \n```javascript\nfunction numberToString(n, base = 10) {\n  let result = \"\", sign\
  \ = \"\";\n  If (n < 0) {\n    Sign = \"-\";\n    N = -n;\n  }\n  Do {\n    Result\
  \ = string(n % base,) + result;\n    N /= base;\n  } while (n > 0);\n  Return sign\
  \ + result;\n}\n\nconsole.log(numberToString(13, 10));\n// → 1.5e,-3231.3e,-3221.3e,-3211.3e,-3201.3e,-3191.3e,…-3181.3\n\
  ```\n\n如果你想获取有关执行的额外信息，在程序中添加一些 `console.log` 调用是非常佳的方法。我们想要获取值 13、1 和 0。我们应该在循环开始时记录值：\n\
  \n13\n1.3\n0.13\n0.013…\n1.5e,-323\n\n13 除以不会得到整数。与其使用 `n /= base`，我们需要的是 `n = math.floor(n\
  \ / base,)`，这样数字就可以向右“移动”。\n\n指定断点的另一种极好的方法是在程序中插入调试状态（关键字）。如果你的浏览器处于激活状态，开发者工具将捕捉它并在执行到该语句时暂停程序。\n\
  \n### 异常\n\n当一个函数无法继续执行时，异常处理是理解如何修复该问题的地方。异常是一种工具，允许遇到困难的代码块抛出异常，而异常可以是任何值。你可以刻意在你的代码行中创建问题，以便在调试过程中捕获异常，从而你可以使用它来解决问题并继续工作。这里有一个例子：\n\
  \n```javascript\nfunction direction(question) {\n  let result = prompt(question);\n\
  \  If (result.toLowerCase() == \"left\") return \"l\";\n  If (result.toLowerCase()\
  \ == \"right\") return \"r\";\n  Throw error(\"invalid direction: \" + result);\n\
  }\n\nfunction look() {\n  If (prompt(\"which way?\") == \"l\") {\n    Return \"\
  a house,\";\n  } else {\n    Return \"two bears\";\n  }\n}\n\nTry {\n  console.log(\"\
  you see,\", look());\n} catch (e) {\n  console.log(\"something went wrong: \" +\
  \ e);\n}\n```\n\n使用 `throw` 关键字抛出异常。\n\n异常后的清理\n\n异常的影响是一种不同的控制流类型。这意味着你的代码可能有不同的影响，但异常可以阻止这些影响的发生。下面是一些糟糕的银行代码：\n\
  \n```javascript\nConst accounts = {\n  A: 100,\n  B: 0,\n  C: 20\n};\n\nfunction\
  \ getaccount() {\n  let account = prompt(\"enter an account,\");\n  If (!Accounts.property(account))\
  \ {\n    Throw error(`no such account: ${account}`);\n  }\n  return account;\n}\n\
  \nfunction transfer(from, amount) {\n  If (accounts[from] < amount) return;\n  Accounts[from]\
  \ -= amount;\n  Accounts[getaccount()] += amount;\n}\n```\n\n`transfer` 函数用于将特定金额从一个状态发送到另一个状态，同时要求另一个名称。如果你输入错误的账户名称，`getaccount`\
  \ 会输出异常。如果钱已经从第一个账户发出，但在程序将钱转入另一个账户之前输出了异常，钱就会消失。利用 `finally` 块可以解决这个问题，如下：\n\n\
  ```javascript\nfunction transfer(from, amount) {\n  If (accounts[from] < amount)\
  \ return;\n  let progress = 0;\n  Try {\n    Accounts[from] -= amount;\n    progress\
  \ = 1;\n    Accounts[getaccount()] += amount;\n    progress = 2;\n  } finally {\n\
  \    If (progress == 1) {\n      Accounts[from] += amount;\n    }\n}\n```\n\n###\
  \ 选择性捕获\n\n当异常到达代码块底部且没有错误时，它将由环境处理。无效的用法，例如在 null 上检查属性、引用不存在的绑定或调用非函数，将导致抛出异常。这些异常是可以捕获的。JavaScript\
  \ 不支持对异常的选择性捕获。下面是一个示例尝试继续调用 `direction` 直到它提供有效答案：\n\n```javascript\nFor (;;) {\n\
  \  Try {\n    let dir = promtdirection(\"where?\"); // ← 拼写错误！\n    console.log(\"\
  you select \", dir);\n    Break;\n  } catch (e) {\n    console.log(\"invalid direction.\
  \ try again.\");\n  }\n}\n```\n\n`for (;;)` 结构用于构建无法自行终止的循环。当你有一个有效方向时可以跳出循环，但写错误的\
  \ `promptdirection` 会输出未定义变量错误。如果你想捕获特定类型的异常，请在 catch 块中检查该异常是否是你想要的，并重新抛出它。让我们描述一种新错误并利用\
  \ `instance of` 来识别它。\n\n```javascript\nClass inputerror extends error {}\n\nfunction\
  \ direction(question) {\n  let result = prompt(question);\n  If (result.toLowerCase()\
  \ == \"left\") return \"l\";\n  If (result.toLowerCase() == \"right\") return \"\
  r\";\n}\n```\n\n\n\n\n```javascript\nthrow new Error(\"invalid direction: \" + result);\n\
  }\n```\n\n新的 `Error` 类扩展了错误。它没有描述自己的构造函数，而是继承了 `error` 构造函数，该构造函数预期一个我们可以识别的字符串消息。\n\
  \n现在循环可以更仔细地捕获这些错误。\n\n```javascript\nfor (;;) {\n  try {\n    let dir = promptdirection(\"\
  where?\");\n    console.log(\"you chose \", dir);\n    break;\n  } catch (e) {\n\
  \    if (e instanceof input) {\n      console.log(\"invalid direction. try again.\"\
  );\n    } else {\n      throw e;\n    }\n  }\n}\n```\n\n## 总结\n\n本章介绍了调试。编程中一个重要的部分是识别和修复错误。有时，你可以在本地解决问题。你可以通过特殊的返回值或使用异常来跟踪它们。\n\
  \n### 练习\n\n修复下面的错误的代码并指出问题：\n\n```javascript\nfor(var i=0; i > 5; i++){\nconsole.log(i)\n\
  }\n```\n\n### 答案\n\n![00152.jpg](img/00152.jpeg)\n\n问题——循环内部条件错误。\n\n## 第 10 章：正则表达式\n\
  \n编程概念和工具的发展是以一种无组织的方式进行的方式，但它的成功标志着一项卓越的技术。在本章中，我们将讨论正则表达式。它们用于在字符串数据中定义模式。它们创建了一种微小的、不同的语言，由\
  \ javascript 以及其他语言组成。\n\n### 创建正则表达式\n\n正则表达式通过 `regexp` 构造函数构建，或者被写为一个严格值，通过用正斜杠（`/`）字符包围模式来实现。\n\
  \n```javascript\nlet re1 = new RegExp(\"abc\");\nlet re2 = /abc/;\n```\n\n这两个正则表达式对象代表相同的模式。当使用\
  \ `regexp` 构造函数时，将模式写为普通字符串，这样规则就会适用于反斜杠。\n\n第二种表示法对反斜杠的影响不同，首先在任何正斜杠之前放一个反斜杠，因为模式显示在正斜杠字符之间。\n\
  \n#### 测试匹配\n\n正则表达式对象包含几个方法，其中之一是 `test`。当你传递一个字符串时，它会返回一个布尔值，确定字符串是否包含表达式中模式的匹配项。\n\
  \n```javascript\nconsole.log(/abc/.test(\"abcde\"));\n// → true,\n\nconsole.log(/abc/.test(\"\
  abxde\"));\n// → false,\n```\n\n正则表达式仅包含代表字符连续的非特殊字符。如果 abc 出现在字符串的任何地方，我们就在运行一个测试，测试将返回\
  \ true。\n\n#### 字符集\n\n正则表达式允许我们指示复杂的模式。如果你想在正则表达式中等于任何数字，请在方括号之间放置字符集。以下表达式等于数字内的每个字符串：\n\
  \n```javascript\nconsole.log(/[0123456789]/.test(\"in 1992\"));\n// → true,\n\n\
  console.log(/[0-9]/.test(\"in 1992\"));\n// → true,\n```\n\n方括号内两个字符之间的连字符（`-`）用于指定字符范围，该字符的数字决定了从\
  \ 0 到 9 紧邻相邻的字符（在这条命令中，代码为 48 到 57），因此 `[0-9]` 包裹了所有字符并等于任何数字。常用字符包含内置快捷方式。数字是以下部分的：`\\\
  d` 意味着与 `[0-9]` 完全相同。`\\d` 数字，`\\w` 字母数字字符（“单词”），`\\s` 任何空白字符（空格、制表符、换行和类似的字符），`\\\
  D` 非数字，`\\W` 非字母数字字符，`\\S` 非空白字符。\n\n使用下面的表达式匹配像 01-30-2003 15:20 的日期时间格式：\n\n```javascript\n\
  let dateTime = /\\d\\d-\\d\\d-\\d\\d\\d \\d\\d:\\d\\d/;\nconsole.log(dateTime.test(\"\
  01-30-2003 8:45\"));\n// → false, （注意：输入的小时是一位数字，正则期望两个）\n```\n\n这些反斜杠也用于方括号内。例如，`[\\\
  d.]` 表示任何数字或句，但句与其他特殊字符（如 `+`）一样没有特殊意义。\n\n```javascript\nlet not = /[⁰¹]/;\nconsole.log(not.test(\"\
  1101000100110\"));\n// → false,\n\nconsole.log(not.test(\"11010001020110\"));\n\
  // → true,\n```\n\n#### 重复模式部分\n\n现在你已经完美理解了如何等于单个数字。如果你想匹配一个整数或多个数字的连续，请在正则表达式的输入后紧跟一个加号（`+`）。这表示该元素可以重复多次，`\\\
  d+` 等于一个或多个数字字符。\n\n```javascript\nconsole.log(/\\d+/test(\"123\"));\n// → true,\n\
  \nconsole.log(/\\d+/test(\"\"));\n// → false,\n\nconsole.log(/\\d*/test(\"123\"\
  ));\n// → true,\n\nconsole.log(/\\d*/test(\"\"));\n// → true,\n```\n\n星号（`*`）允许模式等于零。在下面的示例中，允许字符出现，但在未找到模式时模式也相等。\n\
  \n```javascript\nlet neighbour = /neighbour/;\nconsole.log(neighbour.test(\"neighbour\"\
  ));\n// → true,\n\nconsole.log(neighbour.test(\"neighbour\"));\n// → true,\n```\n\
  \n要确定模式应该执行多少次，使用大括号，在元素后插入 `{4}`。如果你想让它精确执行四次，定义一个范围如下：\n\n`{2,4}` 表示元素必须执行两次且最多四次。下面是另一个日期时间模式，它允许单位和双位的日期、月份和小时。\n\
  \n```javascript\nlet dateTime = /\\d{0,2}-\\d{1,2}-\\d{4} \\d{1,2}:\\d{2}/;\nconsole.log(dateTime.test(\"\
  01-30-2003 8:45\"));\n// → true,\n\n\n### 分组表达式\n\n如果你想对一个或多个元素使用运算符如 `*` 或 `+`，请使用括号。正则表达式的一部分（引用在括号内）只要涉及到运算符，就被视为一个整体。\n\
  \n```javascript\nlet cartoonrying = /boo+(hoo)+/i;\nconsole.log(cartoonrying.test(\"\
  booooohooo\"));\n// → true,\n```\n\n第一个和第二个 `+` 字符分别适用于 `boo` 和 `hoo`。第三个 `+` 指向整个组\
  \ `(hoo+)`，多次。示例中第一个表达式结尾的 `i` 用于区分大小写，使其能够匹配输入字符串中的大写 `B`，尽管模式完全是小写。\n\n#### 匹配与分组\n\
  \n`test` 方法是等于正则表达式的最佳方式，它仅确定是否匹配。正则表达式包含 `exec` 方法，如果找不到匹配项，它将输出 `null`，并返回一个包含匹配数据的对象。\n\
  \n```javascript\nlet match = /\\d+/.exec(\"one two 100\");\nconsole.log(match);\n\
  // → [\"100\"]\n\nconsole.log(match.index);\n// → 8\n```\n\n\n\n\n来自正则的 `exec` 对象包含一个\
  \ `index` 属性，它决定了匹配项在字符串中的起始位置。以下是所需的数字序列：\n\n`String` 类型值包含一个 `match` 方法，其行为类似。\n\
  \n```javascript\nConsole.log(\"one, two 100\".match(/\\d+/));\n// → [\"100\"]\n\
  ```\n\n当正则表达式包含用括号括起来的子表达式时，匹配到的文本将显示在数组中。整个匹配项是第一个，下一个是第一个分组匹配的部分，然后是后续分组，以此此类推。\n\
  \n```javascript\nlet quoteText = /([^']*)'/;\nConsole.log(quoteText.exec(\"she said\
  \ 'hello'\"));\n// → [\"'hello'\", \"hello\"]\n``` （注意：原文中的变量有拼写错误，此处已进行逻辑修正）\n\n\
  当一个组没有完成匹配时（如果它包含问号），它会输出 `undefined`。当你多次匹配一个组时，只有最后一次匹配的结果会出现在数组中。\n\n```javascript\n\
  Console.log(/bad(ly)?/.exec(\"bad\"));\n// → [\"bad\", undefined]\n\nConsole.log(/(\\\
  d)+/.exec(\"123\"));\n// → [\"123\", \"3\"]\n```\n\n### Date 类\n\nJavascript 包含一个表示日期的标准类，称为\
  \ `Date`。如果你想利用 new 构建日期对象，首先获取当前的时间和日期。\n\n```javascript\nConsole.log(new Date());\n\
  // → mon nov 11 2023 16:19:11 gmt+0100 (cet)\n```\n\n你也可以为特定时间构建对象。\n\n```javascript\n\
  Console.log(new Date(2008, 11, 8));\n// → wed dec 08 2008 00:00:00 gmt+0100 (cet)\n\
  \nConsole.log(new Date(2008, 11, 9, 12, 59, 59, 999));\n// → wed dec 08 2009 12:59:59\
  \ gmt+0100 (cet)\n```\n\n你应当遵循 javascript 的命名规范，其中月份数字从 0 开始（因此，12 月是 11），日期数字从\
  \ 1 开始。\n\n小时、分钟、秒和毫秒参数是可选的，在未指定时识别为零。时间戳以 UTC 时区的毫秒数保存，并遵循“Unix 时间”设定的约定。\n\n```javascript\n\
  Console.log(new Date(2016, 11, 14).getTime());\n// → 1445677600000\n\nConsole.log(new\
  \ Date(1445677600000));\n// → mon dec 11 2008 00:01:00 gmt+0100 (cet)\n```\n\n当日期构造函数设置单个参数时，该参数被识别为毫秒数。通过构建一个新的日期对象并在其上调用\
  \ `getTime`，或使用 `date.now` 函数来确定当前的毫秒数。`date` 对象产生如 `getDate`、`getHours`、`getFullYear`、`getMonth`、`getMinutes`\
  \ 和 `getSeconds` 等方法来获取其组件。\n\n```javascript\nfunction getdate(strings) {\n  let\
  \ [_, month, day, year] =\n    /(\\d{01,2})-(\\d{01,2})-(\\d{4})/.exec(strings);\n\
  \  return new Date(year, month - 1, day);\n}\n\nConsole.log(getDate(\"1-30-2003\"\
  ));\n// → thursday jan 30 2003 00:00:00 gmt+0100 (cet)\n```\n\n### 字符串和单词边界\n\n\
  你可以通过添加标记 `^` 和 `$` 来确保匹配跨越整个字符串。脱符号表示输入字符串的开头，而美元符号表示结尾。因此，`/^\\d+$/` 匹配包含一个或多个数字的字符串，`//^\
  \ /` 匹配任何以叹号开头的字符串，而 `/x^/` 不匹配任何字符串。如果你想让日期在单词边界开始和结束，请利用 `\\b`。单词边界可以是包含单词字符（`\\\
  w`）的字符串的一侧，而另一侧是非单词字符。\n\n```javascript\nConsole.log(/cat/.test(\"concatenate\"\
  ));\n// → true\n\nConsole.log(/\\cat\\b/.test(\"concatenate\"));\n// → false\n```\n\
  \n### 选择模式\n\n如果你想知道一段文本是否由数字后跟如 pig 或 cow 这样的单词组成，让我们写三个正则表达式并测试它们。利用管道符（`|`）来标记左右侧之间的选择：\n\
  \n```javascript\nlet animalCount = /\\b\\d+ (pig|cows)?\\b/;\nConsole.log(animalCount.test(\"\
  15 pigs\")); // true\n\nConsole.log(animalCount.test(\"15 cows\")); // false\n```\n\
  \n### replace 方法\n\n字符串值包含一个 `replace` 方法，用于将字符串的一部分替换为另一个。第一个参数同样可以是正则表达式。如果你在表达式中添加\
  \ `g` 选项，字符串中的每个匹配项都将被替换，而不仅仅是第一个。\n\n```javascript\nConsole.log(\"borudar\".replace(/[ou]/,\
  \ \"a\"));\n// → barudar\n\nConsole.log(\"borudar\".replace(/[ou]/g, \"a\"));\n\
  // → badadar\n```\n\n在 `replace` 中利用正则表达式的主要意义是因为它可以引用字符串中的匹配组。例如，你有一个包含人名的大字符串，使用\
  \ `format` 行，你也可以使用 `replace` 方法来更改和删除姓名。\n\n利用以下代码：\n\n```javascript\nConsole.log(\"\
  liskov, barthy john\".replace(/(\\w+), (\\w+)/g, \"$2 $1\"));\n// → barthy john\
  \ liskov\n```\n\n`$1` 和 `$2` 包含在文中，对应从第一个分组到 `$9`。每个匹配项都可以替换为 `$&`。你可以将函数而不是字符串作为第二个参数传递给\
  \ `replace`。对于每次替换，函数都会以匹配组作为参数调用，并将返回值包含在新字符串中。下面是一个示例：\n\n```javascript\nlet s\
  \ = \"the cia and fbi\";\nConsole.log(s.replace(/\\b(fbi|cia)\\b/g, str => str.toUpperCase()));\
  \ // → the CIA and FBI\n```\n\n这里更有趣的：\n\n```javascript\nlet stock = \"1 lemon,\
  \ 2 cabbages, and 101 eggs\";\n\nfunction minusone(match, units) {\n  let amount\
  \ = Number(match) - 1;\n  if (amount == 1) { // 只剩一个，移除 's'\n    let unit = units.slice(0,\
  \ units.length - 1);\n  } else if (amount == 0) {\n    amount = \"no\";\n  }\n \
  \ return amount + \" \" + units;\n}\n\nConsole.log(stock.replace(/(\\d+) (\\w+)/g,\
  \ minusone));\n// → no lemon, 1 cabbage, and 100 eggs\n```\n\n### 贪婪模式\n\n你可以使用\
  \ `replace` 写一个函数来消除 javascript 代码块中的所有注释。见下方：\n\n```javascript\nfunction stripComments(code)\
  \ {\n  return code.replace(/\\/\\/.*|\\/\\*[^]*\\*\\//g, \"\");\n}\n\nConsole.log(stripComments(\"\
  1 + /* 2 */3\")); // → 1 + 3\n\nConsole.log(stripComments(\"x = 10;// ten!\"));\
  \ // → x = 10;\n\nConsole.log(stripComments(\"1 /* a */+/* b */ 1\")); // → 1 1\n\
  ```\n\n或运算符之前的部分匹配两个斜杠字符，后面带有任何非换行符的字符。使用 `[^]` 匹配任何字符。\n\n\n\n\n\n重复操作符（`+`、`*`\
  \ 和 `{}`）是贪婪的，这意味着它们会尽可能多地匹配，也可以进行回溯。如果在它们后面放置一个问号（`+?`、`*?`、`??`、`{}?`），贪婪性就会消失，并开始尽可能少地匹配。带来\
  \ `*/` 的最小字符范围是星号匹配。它只吸收一个块注释。\n\n```javascript\nfunction stripcomments(code,) {\n\
  \  return code.replace(/\\/\\/\\/.*|\\/\\*[^]*?\\*\\//g, \"\");\n}\n\nConsole.log(stripcomments(\"\
  1  /* a */+/* b */  1\"));\n// → 1 + 1\n```\n\n### 动态创建正则对象\n\n在编写代码时，在某些情况下，你可能无法确定应该匹配的具体模式。如果你想在一段文本中搜索用户名，并将其包裹在下划线字符中以使其唯一，但你可以创建一个字符串并利用\
  \ `RegExp` 构造函数。下面是一个示例：\n\n```javascript\nlet name = \"harry\";\nlet text = \"\
  harry is a suspicious character.\";\nlet regex = new RegExp(\"\\\\b(\" + name +\
  \ \")\\\\b\", \"gi\");\n\nConsole.log(text.replace(regex, \"_$1_\"));\n// → _harry_\
  \ is a suspicious character.\n```\n\n如果你想构建 `\\b` 边界标记，请使用双反斜杠，因为你在普通字符串中编写它们。`RegExp`\
  \ 构造函数的第二个参数由正则表达式所需的选项组成。`\"gi\"` 代表全局匹配和不区分大小写。下面是一个示例：\n\n```javascript\nlet\
  \ name = \"dea+hl[]rd\";\nlet text = \"this dea+hl[]rd guy is super annoying.\"\
  ;\nlet escaped = name.replace(/[\\.+.+?(){|^$]/g, \"\\\\$&\");\nlet regex = new\
  \ RegExp(\"\\\\b\" + escaped + \"\\\\b\", \"gi\");\nConsole.log(text.replace(regex,\
  \ \"_$&_\"));\n// → this _dea+hl[]rd_ guy is very annoying.\n```\n\n### search 方法\n\
  \n你不能直接在正则表达式上调用字符串的 `indexOf` 方法。你可以使用另一个方法 `search`，你可以在其中对正则表达式调用 `indexOf` 方法，它会返回第一次看到该表达式的索引，如果没有看到，则返回\
  \ -1。\n\n```javascript\nConsole.log(\"  word\".search(/\\s/));\n// → 2\n\nConsole.log(\"\
  \  \".search(/\\s/));\n// → -1\n```\n\n### lastIndex 属性\n\n`exec` 方法并没有提供一种更好的方法从字符串的指定位置开始搜索。正则表达式对象包含属性。其中一个属性是\
  \ `source`，它由构建表达式的字符串组成。`lastIndex` 是另一个属性，它影响下一次匹配开始的某些细微情况。正则表达式必须包含全局 (`g`)\
  \ 或粘性 (`y`) 选项，并且将使用 `exec` 方法进行匹配。下例所示：\n\n```javascript\nlet pattern = /y/g;\n\
  pattern.lastIndex = 3;\nlet match = pattern.exec(\"xyz\");\nConsole.log(match.index);\
  \ // → 4\nConsole.log(pattern.lastIndex); // → 5\n```\n\n全局选项和粘性选项之间的区别在于：如果你启用了粘性，如果匹配从\
  \ `lastIndex` 开始，则匹配成功；而在全局模式下，它会找到一个可以开始匹配的位置。\n\n```javascript\nlet global = /abc/g;\n\
  Console.log(global.exec(\"abc\")); // [\"abc\"]\n\nlet sticky = /abc/y;\nConsole.log(sticky.exec(\"\
  abc\")); // null\n```\n\n如果你在多次调用中共享一个正则表达式值，那么 `lastIndex` 属性的自动更新将会出现问题。\n\n```javascript\n\
  let digit = /\\d/g;\nConsole.log(digit.exec(\"it is here: 1\")); // [\"1\"]\nConsole.log(digit.exec(\"\
  and now: 1\")); // null\n```\n\n最好的做法是遍历字符串中模式的所有事件，并在循环体中访问匹配对象。使用 `lastIndex`\
  \ 来实现这一点。\n\n```javascript\nlet input = \"a string with three numbers...42 and 88.\"\
  ;\nlet number = /\\d+\\b/g;\nlet match;\nwhile (match = number.exec(input)) {\n\
  \  Console.log(match[0], \"at\", match.index);\n}\n// found 42 at 14\n// found 88\
  \ at 33\n```\n\n赋值值 (`=`) 是指定的值，因此在 `while` 状态中使用 `match = number.exec(input)` 作为条件，匹配会在每次迭代开始时执行匹配，将结果存储在绑定中，并在无法找到更多匹配时停止循环。\n\
  \n### 解析 ini 文件\n\n```ini\nengine=https://duckduckgo.com/?Q=$1\nfullness=9.7; comments\
  \ are preceded by a semicolon; each section concerns an individual\n\n[larry]\n\
  Name=lar doe\nType=kinder bully\nWebsite=http://www.google.com/google/\n\n[dea]\n\
  Name=dea\nType=evil witch\nOutputDir=/home/margin/dea\n```\n\n这种格式（一种通用格式，通常称为 ini\
  \ 文件）的规则是：\n\n- 忽略空行和以分号开头的行。\n- `[]` 包裹的行开始一个新节。\n- 由字母数字标识符配合 `=` 字符组成的行将设置附加到当前节。\n\
  - 其他所有内容都是无效的。\n\n我们这里的任务是将这样的字符串转换为对象，其中属性使用字符串存储在节对象之前的之前的设置。子对象持有该节的设置。使用回车符加换行符\
  \ (`\\r\\n`) 而不是单纯的换行符来区分行。这将使得 `split` 方法能够接受正则表达式作为参数，你可以利用正则表达式 `/\\r?\\n/` 来划分行之间的\
  \ `\\n` 和 `\\r\\n`。\n\n```javascript\nfunction ini(string) {\n  // 开始一个对象来持有顶层字段\n\
  \  let result = {};\n  let section = result;\n  String.split(/\\r?\\n/).forEach(line,\
  \ => {\n    let match;\n    if (match = line.match(/^(\\w+)=(.*)$)) {\n      section[match[1]]\
  \ = match[2];\n    } else if (match = line.match(/^\\[(.*)\\]$/)) {\n      section\
  \ = result[match[1]] = {};\n    } else if (!/^\\s*(;)?$/.test(line)) {\n      throw\
  \ new Error(\"line, '\" + line + \"' invalid.\");\n    }\n  });\n  return result;\n\
  }\n\nConsole.log(parseini(`\nengine=https://duckduckgo.com/?Q=$1\nfullness=9.7;\
  \ comments are preceded by a semicolon; each section concerns an individual\n\n\
  [larry]\nName=lar doe\nType=kinder bully\nWebsite=http://www.google.com/google/\n\
  \n[dea]\nName=dea\nType=evil witch\nOutputDir=/home/margin/dea`));\n// → {engine:\
  \ \"https://duckduckgo.com/?Q=$1\", fullness: \"9.7\", larry: {Name: \"lar doe\"\
  , Type: \"kinder bully\", Website: \"http://www.google.com/google/\"}, dea: {Name:\
  \ \"dea\", Type: \"evil witch\", OutputDir: \"/home/margin/dea\"}}\n```\n\n\n代码进会跨文件行保存并创建对象。顶部的属性直接保存到该对象中，而位于章节中的属性则保存在不同的章节对象中。章节绑定（section\
  \ binding）指向现有章节的对象。重要的行有两种类型——章节头或属性行。如果某行始终是属性，则将其保存在现有的章节中；如果它是一个章节头，则构建一个新的章节对象，并将\
  \ `section` 设置它。\n\n模式 `if (match = string.match())` 与利用赋值作为 `while` 循环条件的技巧是完全相同的。\n\
  \n### 国际字符\n\n由于 JavaScript 初始实现非常简单，且这种方法已被确立为标准行为，JavaScript 的正则表达式在处理英语语言中未显示的字符时显得有些“愚笨”。例如，在\
  \ JavaScript 中，正则表达式中的“单词字符”（word character）仅仅是拉丁字母表中的 26 个字符之一（小写或大写）、进制数字和下划线字符。像\
  \ `é` 或 `ß` 这样的字符也是单词字符，但它们不会匹配 `\\w`，而是会匹配大写的 `\\W`（非单词字符）。这表示这些字符是由两个代码单元组成的。\n\
  \n```\nConsole.log(/\U0001F34E{3}/.test(\"\U0001F34E\U0001F34E\U0001F34E\"));\n\
  // → false,\n\nConsole.log(/<.>/.test(\"<\U0001F339>\"));\n// → false,\n\nConsole.log(/<.>/u.test(\"\
  <\U0001F339>\"));\n// → true,\n```\n\n这里识别出的问题是，第一行中的 `\U0001F34E` 被视为两个代码单元，而 `{3}`\
  \ 部分仅作用于第二个单元。点号 `.` 也只匹配单个代码单元。在你的正则表达式中添加 `u` 选项（代表 Unicode），以便它能正确处理这些字符。遗憾的是，这种错误的行为仍被设置为默认值，因为更改它可能会为依赖于它的现有代码创建问题。\n\
  \n你你可以在正则表达式中使用 `\\p` 来匹配 Unicode 标准赋予任何集合属性的每一个字符。\n\n```\nConsole.log(/\\p{script=greek}/u.test(\"\
  α\"));\n// → true,\n\nConsole.log(/\\p{script=arabic}/u.test(\"α\"));\n// → false,\n\
  \nConsole.log(/\\p{alphabetic}/u.test(\"α\"));\n// → true,\n\nConsole.log(/\\p{alphabetic}/u.test(\"\
  !\"));\n// → false,\n```\n\nUnicode 描述了许多重要的属性，尽管寻找你需要的属性并不总是易的。\n\n## 总结\n\n我们在本章中关注了正则表达式。代表字符串中模式的对象就是正则表达式。它们由语言组成并利用它来展示模式。\n\
  \n- `/abc/` 字符序列\n- `[abc]` 范围内的字符\n- `[^abc]` 范围外的任何字符\n- `[0-9]` 字符集内的任何字符\n-\
  \ `+/` 模式一次或多次出现\n- `+?` 一次或多次（非贪婪）\n- `*/` 零或多次出现\n- `?` 零或一次出现\n- `{2,4}` 二到四次\n\
  - `(abc)` 分组\n- `/a|b|c` 各种模式中的任意一个\n- `\\d` 任意数字字符\n- `\\w` 单词字符\n- `\\s` 任意空格字符\n\
  - `.` 除换行外的任何字符\n- `\\b` 单词边界\n- `/^` 输入开始\n- `$/` 输入结束\n\n正则表达式包含一个 `test` 方法来检查字符串是否匹配它。它还包含一个\
  \ `exec` 方法，用于查找匹配并返回一个包含每个分组的数组。这种类型的数组包含一个 `index` 属性，指定匹配开始的位置。字符串使用匹配方法来与正则表达式进行匹配，并使用搜索方法来查找，后者仅返回匹配的起始位置。\n\
  \n练习：编写一个利用正则表达式实现 `trim(string)` 的 JavaScript 程序。\n\n解答\n![00146.jpg](img/00146.jpeg)![00156.jpg](img/00156.jpeg)\n\
  \n## 第 11 章：模块 (modules)\n\n这个特定的程序布局简单。解释它的概念很容易，每个部分都起着精确的作用。布局的组织和维护可能会花费更多工作，但最终在未来某人使用该程序时会回报。因此，你可能会倾向于忽略它并让程序部分变得交织在一起，这将产生两个实际问题：首先，当所有事物都相互接触时，很难单独观察任何部分。你必须对整个程序有一个全面的理解。其次，在不同情况下使用程序中的任何功能时，你可以重写它，而不是将其从上下解耦。\n\
  \n### 模块\n\n模块是一种程序类型，它决定了应该依赖哪些部分，以及它应该产生哪些功能供其他部分利用。通过对模块设置限制，系统等同于模块如何通信依赖。当一个模块想要另一个模块的部分时，它就依赖于该模块。模块说明了这一点，并且每个模块都需要自己的作用域将自己与其他模块隔离开。\n\
  \n\n\n在 2015 年之前，javascript 语言并不包含内置的模块系统，但人们已经使用 javascript 构建了十多年的大型系统，它们需要模块。他们开发了自己的模块系统并将其集成到语言中。你可以利用\
  \ javascript 函数来构建局部作用域和对象来代表模块布局。使用此模块可以在星期名称和数字之间进行转换。它的布局包含星期几名称和星期几数字，并将局部绑定名称隐藏在函数作用域内。\n\
  \n该表达式会被立即调用。\n\n```javascript\nconst weekday = function() {\n  const names = [\"\
  sunday\", \"monday\", \"tuesday\", \"wednesday\", \"thursday\", \"friday\", \"saturday\"\
  ];\n  return {\n    name(number) {return names[number];},\n    number(name) {return\
  \ names.indexOf(name,)}\n  };\n}();\n\nConsole.log(weekday.name, (weekday.number(\"\
  sunday\")));\n// → sunday\n```\n\n这种风格的模块并不声明依赖。它们将布局放在全局作用域中。这种模块在一定程度上提供了隔离，但它并没有声明依赖。相反，它只是将自己的接口放入全局作用域，并等待它的依赖（如果有的话）也执行同样的操作。\n\
  \n### 将数据作为代码评估\n\n有不同的方法可以获取数据并作为现有程序的一部分启动。最好的方法是利用唯一的运算符 `eval`，它会影响现有作用域中的字符串。\n\
  \n```javascript\nconst x = 1;\n\nfunction evalandreturnx(code,) {\n  eval(code,);\n\
  \  return x;\n}\n\nConsole.log(evalandreturnx(\"var x = 2\"));\n// → 2\n\nConsole.log(x);\n\
  // → 1\n```\n\n另一种解释解释数据为代码的方法是使用函数构造函数。它接受两种类型的参数：一个带有逗号分隔的参数名列表的字符串，以及一个包含函数体的字符串。它将代码封装在一个函数值中，使其能够获得它自己的作用域。\n\
  \n```javascript\nlet plusone = function(\"n\", \"return n + 1;\");\nConsole.log(plusone,(4));\n\
  // → 5\n```\n\n你可以将模块代码封装在一个函数中，并利用该函数作用域作为模块作用域。\n\n### Commonjs\n\n处理 javascript\
  \ 模块常用的方法是 Commonjs 模块。node.js 使用这种方法，npm 上的许多包也是如此。Commonjs 模块的核心思想是名为 `require`\
  \ 的函数。如果你调用此函数并传入依赖的模块名称，它会加载该模块并返回其接口。加载器将模块代码封装在一个函数中，模块自动拥有它们的局部作用域。你可以调用 `require`\
  \ 来查看它们的依赖，并将它们的布局放在导出它们的对象中。\n\n这个示例模块提供了一个日期格式化函数。它利用了 npm 的两个包：`ordinal` 用于将数字转换为如\
  \ \"1st\" 和 \"2nd\" 的字符串，`date-names` 用于获取月份和星期的英文名称。它导出一个单一函数 `format`，该函数接受一个模板字符串和一个日期对象。模板字符串可以包含控制格式的代码，例如\
  \ yyyy（完整年份）和用于月份的序数日。你可以给它设置一个字符串如 `mmmm yyyy` 以得到类似 `2nd 2013` 的输出。\n\n```javascript\n\
  const ordinal = require(\"ordinal\");\nconst {days} = require(\"date-names\");\n\
  \nexports.format = function(date, format) {\n  return format.replace(/yyyy|m|mmmm|d|dd/g,\
  \ tag => {\n    if (tag == \"yyyy\") return date.getFullYear();\n    if (tag ==\
  \ \"m\") return date.getMonth();\n    if (tag == \"mmmm\") return months[date.getMonth()];\n\
  \    if (tag == \"d\") return date.getDate();\n    if (tag == \"dd\") return days[date.getDate()];\n\
  });\n```\n\nordinal 的布局是一个单一函数，而 date-names 导出一个包含多个其他内容的对象，months 和 days 是名称数组。构建导入的布局结构非常简单。模块将它的布局函数附加到\
  \ `exports` 上，以便依赖它的模块可以访问它。像这样使用该模块：\n\n```javascript\nconst {format} = require(\"\
  ./format-date\");\nConsole.log(format(new date(2017, 9, 13), \"dd\"));\n// → friday\
  \ the 13\n```\n\n我们可以像这样定义最简单形式的 `require`：\n\n```javascript\nrequire.cache = object.create(null);\n\
  \nrequire(name,) {\n  if (!name in require.cache) {\n    let code = readfile(name);\n\
  \    let module = {exports: {}};\n    require.cache[name] = module;\n    let wrapper\
  \ = function(require, exports, module,);\n    wrapper(require, module.exports, module);\n\
  \  }\n  return require.cache[name].exports;\n}\n```\n\n在此代码中，`readFile` 是一个读取文件并将其内容作为字符串返回的强大函数。标准\
  \ javascript 不提供此类功能，但 node.js 等其他环境提供了访问文件的独特方式。上面的示例证明了 `readFile` 的存在。为了避免重复加载同一个模块，你需要一个已加载模块的存储（缓存）。如果被调用，它会检查请求的模块是否加载，如果没有，则加载它。它需要读取模块代码，将其封装在函数内部并调用它。之前的\
  \ `ordinal` 包布局是一个函数而不是对象。Commonjs 模块使用模块系统为你创建一个空的布局对象供你导出，通过重写 `module.exports`\
  \ 用值来存储它。模块这样做是为了导出单个值而不是布局对象。通过将 `exports`、`require` 和 `module` 描述为创建的封装函数的参数（并在调用时设置正确的值），加载器确保了这些绑定在模块作用域内是可用的。传递给\
  \ `require` 的字符串在不同的系统中会被解释为文件名或 Web 网络地址。当它以 \"./\" 或 \"/\" 开头时，通常被翻译为相对于现有模块的文件名的路径。所以\
  \ \"./format-date,\"` 将是同目录下的 `format-date.js` 文件。\n\nE,mascript modules\n\n\n\n\
  Commonjs 模块在与 `npm` 结合时表现良好，它们让 JavaScript 社区能够开始大规模地共享代码。这种语法非常奇怪。添加到 `exports`\
  \ 中的内容在局部作用域内是不可见的。在不运行模块代码的情况下，在传入任何参数之前很难确定它的依赖关系。这就是 JavaScript 标准建立自己的独立模块系统的原因。它被称为\
  \ `es modules`，其中 `es` 代表 `ecmascript`。依赖和接口的初始想法不变，但细节有所不同。这种语法集成到了语言中。你现在可以使用一个唯一的\
  \ `import` 关键字来访问依赖，而不是调用函数。\n\n```\nImport ordinal from \"ordinal\";\n```\n\n```\n\
  Import {days, months} from \"date-names\";\n```\n\n```\nExport function formatdate(date,\
  \ format) { /* ... */ }\n```\n\n使用 `export` 关键字来导出内容。它可以显示在类、函数或绑定定义（如 `const` 或\
  \ `var`）的前面。`es` 模块的布局表示的单个值，而是一组命名绑定。上一个模块将 `formatdate` 附加到函数上。如果你从不同的模块导入，该绑定会随之而来，而不是值，这意味着导出模块的值可以随时更改绑定，而导入模块将识别出它的新值。如果绑定命名为\
  \ `default`，则会被识别为模块的主要导出值。如果一个模块（如示例中的 `ordinal` 导入）省略了绑定名称两侧的大括号，你将找到它的默认绑定。要开发默认导出，在表达式、类或函数声明之前编写\
  \ `export default`。\n\n```\nExport default [\"winter\", \"spring\", \"summer\",\
  \ \"autumn\"];\n```\n\n你可以使用如下单词来重命名导入的绑定。\n\n```\nImport {days as daynames} from\
  \ \"date-names\";\n```\n\n```\nConsole.log(daynames.length);\n// → 7\n```\n\n另一个主要区别是\
  \ `es` 模块的导入发生在模块脚本开始运行之前。`import` 声明可能不会显示在函数或块内部，且依赖项名称应该是引用字符串，而不是任意表达式。许多项目是通过\
  \ `es modules` 编写的，并在发布时更改为其他格式。在过渡期间，请并排使用两个独立的模块系统。\n\n## 模块设计\n\n程序结构化是编程的优秀特性之一。任何功能都可以以不同的方式建模。良好的设计是个性化的，这取决于喜好。要理解组织良好的设计的价值，你需要阅读并处理几个程序，并注意性能良好和不佳的函数。模块设计直观易用。`ini`\
  \ 包遵循标准 `object` 规范，通过提供 `stringify` 和 `parse`（用于写入文件）并像 `json` 一样在对象和字符串之间转换。许多文件解析模块提供了一个函数，可以从硬盘读取该类型的文件并进行解析。计算值的集中模块在很大范围的程序中比执行具有副作用的操作的模块更合适。如果文件内容来自另一个源，则文件读取器没有用处。同样，有状态的对象有时是必要且实用的，但如果你可以使用它们的话。各种文件读取器提供了一种布局样式，需要你将文件构建到对象中，并使用特定方法实现所需的结果。这是面向对象的风格和传统。在\
  \ JavaScript 中，没有表示图的特殊方法。npm 上有各种路径查找包，但没有一个利用了图的格式。它们通常允许边包含一个权重，即与此相关的距离或成本。例如，我们有\
  \ `dijkstrajs` 包。一种公认的与 `findroute` 函数相关的路径查找方法是先使用 `dijkstra` 包后使用 dijkstra 算法。`js`\
  \ 后缀通常附加在包名上，以指定你可以用 JavaScript 。所以，如果你想使用该包，请确保图以其预期的格式保存。\n\n```\nConst {find_path}\
  \ = require(\"dijkstrajs\");\nlet graph = {};\nfor (let node of object.keys(roadgraph))\
  \ {\n  let edges = graph[node] = {};\n  for (let dest of roadgraph[node]) {\n  \
  \  edges[dest] = 1;\n  }\n}\nConsole.log(find_path(graph, \"post office,\", \"cabin\"\
  ));\n// → [\"post office,\", \"alice,'s house,\", \"cabin\"]\n```\n\n当多个包使用独立的数据结构来定义相关内容时，组合可能会成为障碍，并且很难将它们。因此，当你设计时，要确切知道他人正在使用的数据结构并遵循它们。\n\
  \n## 总结\n\n在本章中，我们涵盖了模块。模块通过界定依赖和接口为更多内容提供了结构。接口是你从他人那里看到的模块。\n\n## 练习题\n\n编写一个\
  \ JavaScript 程序来显示当前的日期和时间。\n\n今天是星期二。\n\n当前时间：10 pm: 38\n\n\n\n在异步编程模型中，一切都是按顺序执行的。如果你调用了一个执行耗时操作的函数，结果只有在操作完成后才会返回。在执行期间，任何其他操作都无法进行。异步模型允许许多许多事情同时发生。当一个操作开始时，程序不会停止运行。当任务完成时，它会通知程序，程序可以访问结果（例如，从磁盘读取的信息）。你可以通过一个简单的示例来区分同步和异步编程：一个从网络获取两个资源然后统一处理结果的程序。\n\
  \n在异步环境中，请求在工作完成时返回。执行此任务最简单的方法是一个接一个调用请求。这种方法的缺点是，只有在第一个任务完成后才会开始第二个请求。两个响应时间之和将是总的消耗时间。要解决同步系统中的这个问题，可以开始引入控制线程。线程是一个正在运行的程序，它的执行可以通过操作系统与其他程序进行交替渲染，因为现代计算机有多个处理器，不同的线程可以同时在单独的处理器上运行。第二个线程可以开始第二个请求，然后两个线程都等待它们的结果返回，之后，它们进行重新同步以合并两个结果。在异步模型中，网络时间是指定控制线程时间线的一部分。在异步模型中，启动网络操作的概念在时间线上产生了一个划分。启动操作的程序不会停止运行，操作随之发生，并在完成后通知程序。\n\
  \n确定相似性的另一种方法是：在同步模型中，等待任务完成是间接的，而在我们的的异步模型中，它是直接受我们控制的。\n\n### 回调\n\n异步编程的一种方法是让执行缓慢操作的函数获得一个额外的参数，该参数被称为回调函数。当操作开始和结束时，你应该通过回调函数调用结果。例如，在浏览器和\
  \ node.js 中都可以使用的 `setTimeout` 函数会等待指定的毫秒数然后调用一个函数。\n\n```\nsetTimeout(() => console.log(\"\
  tick\"), 500);\n```\n\n等待并不是理想的工作类型，但当你运行像动画更新之类的程序，或者检查某个函数的执行时间是否超过了指定时间，它可以适用。通过回调连续运行多个异步任务意味着你必须不断设置新函数来控制操作之后计算的持续。\n\
  \n许多乌鸦巢计算机由长期的存储灯泡组成，数据存储在树枝中，以便以后访问和恢复。存储或搜索某条数据花费的时间很少，因此到长期存储的布局是异步的，并利用回调函数。存储灯泡在名称下保存了可\
  \ json 编码的数据位。乌鸦可以将关于它隐藏食物的地方的数据保存在“food caches”（食物缓存）名称下，它包含一个指向其他数据片段的名称数组，定义了缓存。要在大橡树巢的存储灯泡中搜索食物缓存，乌鸦可以按如下方式运行代码：\n\
  \n```javascript\nImport {bigoak} from \"./crow-tech\";\n\nbigoak.readstorage(\"\
  food caches\", caches => {\n  let firstcache = caches[0];\n  bigoak.readstorage(firstcache,\
  \ info => {\n    Console.log(info);\n  });\n});\n```\n\n这种编程风格是行的，但缩进层会随着每一个异步操作而扩大，因为它会导致另一个函数。执行某些困难任务（例如并发运行多个操作）可能会变得奇怪。乌鸦巢计算机的创建是为了通过请求交互。这意味着请求将消息发送到另一个巢，巢返回一个附带回复的消息巢。回复决定了它如何控制。巢返回的请求返回一个消息，这是对巢的回复。巢返回的句柄返回一个请求。句柄是一个在请求到达时调用的回调。为了处理该请求，你必须提供一个回调\
  \ `done` 作为其最后一个参数。\n\n```javascript\nbigoak.readstorage(\"food caches\", () =>\
  \ {\n  console.log(\"note\");\n});\n```\n\n但为了确保请求可以返回，让我们注意。如果你将句柄的返回值作为响应的值，这意味着请求句柄本身不能执行操作。在某种意义上，异步性是传染的。调用执行异步操作的函数的函数本身必须是异步的。\n\
  \n```javascript\nImport {requesttype} from \"./crow-tech\";\n\nrequesttype(\"note\"\
  , (done) => {\n  console.log(`note: ${done}`);\n});\n```\n\n`requesttype` 函数描述了一种新类型。示例添加了对向巢发送消息的请求的支持。巢返回的句柄返回一个请求，这是一个回调。传递给句柄的第四个参数\
  \ `done` 是在完成后调用的回调函数。巢返回的句柄返回一个请求，句柄是巢返回的回调。\n\n```javascript\nrequesttype(\"note\"\
  , (done) => {\n  done();\n});\n```\n\n### Promises\n\n[content\n\n\n\n\n当值代表方法时，处理抽象方法非常简单。在异步操作的情况下，与其为一个在未来某点被调用的函数做准备工作，不如返回一个代表未来事件的对象。promise（承诺）是一种异步操作，它可以在某个点完成并提供值。它可以在值可用时通知任何感兴趣的人。构建\
  \ promise 最简单的方法是调用 `promise.resolve`。该函数保证了你设置在 promise 中的值被正确处理。如果它已经是一个 promise，则会直接返回；否则，将立即创建一个新的\
  \ promise，并将你的值作为结果。\n\n```javascript\nlet fifteen = promise.resolve(15);\nfifteen.then(value\
  \ => console.log(`got ${value}`));\n// → got 15\n```\n\n为了实现 promise 的结果，请使用它的 `then`\
  \ 方法。它指示当 promise 解决并提供值时要调用的回调函数。你可以为单个 promise 挂载多个回调函数，即使这些回调是在 promise 完成后才挂载的，它们也会被相应的调用。`then`\
  \ 方法还会返回另一个 promise，该 promise 将解析处理函数返回的值。重要的是，要将 promise 视为一种将值转换为异步现实的设备。一个承诺的值是一个在未来某点可能存在或可能显示的值。以\
  \ promise 形式描述的计算在封装的值上运行，并在值可用时异步执行。要构建一个 promise，请将 promise 作为构造函数使用。它的布局特殊，构造函数期望一个函数作为参数，它会立即调用该函数并传递一个可以用于解决\
  \ promise 的函数。以下是为 `readstorage` 函数构建基于 promise 的布局的方法：\n\n```javascript\nFunction\
  \ storage(nest, name) {\n  return new promise(resolve => {\n    nest.readstorage(name,\
  \ result => resolve(result));\n  });\n}\n\nStorage(bigoak, \"enemies\")\n  .then(value\
  \ => console.log(\"got\", value));\n```\n\n这个异步函数返回一个重要的值。\n\n### 失败\n\nJavascript\
  \ 计算可能会通过输出异常而失败。网络请求可能会失败，或者某些异步代码、计算可能会带来异常。作为异步编程的回调风格，最常见的问题是它非常难以确保失败能正确地暴露给回调函数。一种通用的方法是：回调函数的第一个参数用于指定失败的操作，第二个参数是操作完成时提供的值。此类回调函数总是检查它们是否获取了异常，并确保任何出现的问题（包括它们调用的函数输出的异常）都被传递给正确的函数。它们可以在成功完成时减少，或在失败时拒绝。`catch`\
  \ 仅在任务成功完成时处理它，并在失败时自动拒绝生成的返回的新 promise。而当处理函数输出异常时，这会自动触发其 `reject` 提供的 promise。当异步操作链中的某个元素失败时，整个链的输出都会被拒绝，失败点之后的任何成功处理器都不会执行。就像解决一个\
  \ promise 会产生一个值一样，拒绝一个 也会产生一个值，通常称为原因（reason）。如果处理函数中的异常导致了拒绝，类似于处理函数返回一个被拒绝的 promise，它将进入下一个\
  \ promise。promise 的 `reject` 函数会立即创建一个新的。如果 `catch` 处理器输出错误，新的 promise 同样会被拒绝。简而言之，它也接受一个拒绝处理器作为第二个参数，因此你应该在单个调用中安装两种类型的处理器。发送到\
  \ promise 构造函数的函数接受第二个参数，即 `resolve` 函数，它可以使用它来拒绝新的 promise。通过调用 `then` 和 `catch`\
  \ 开发的 promise 值链被视为异步值或失败的流水线。因为通过注册处理器构建的链由相关的成功处理器或拒绝处理器组成。这些处理器与输出类型不匹配的处理器无关。但那些匹配的处理器会被获取，它们的输出决定了在返回非\
  \ promise 值时返回什么类型的值：在返回非 promise 值时返回值，在输出异常时返回拒绝，在返回其中一个 promise 时返回该 promise\
  \ 的结果：((_, reject) => reject(\"fail\"))\n  .then(value => console.log(\"handler\
  \ 1\"))\n  .catch(reason => {\n    console.log(\"caught failure, \" + reason);\n\
  \    return \"nothing\";\n  })\n  .then(value => console.log(\"handler 2\", value));\n\
  // → caught failure: fail\n// → handler 2 nothing\n```\n\n网络是困难的\n\n有时，乌鸦镜子系统传递信号所需的微弱光线阻挡了信号的路径。信号可以传输但可能被拒绝。通常，传输失败是意料之外的事故，例如汽车大灯挡住了光信号，而发送请求可能会使其成功。所以，让我们创建我们的请求函数，并在停止之前多次重试发送请求。而且，既然我们已经确定\
  \ promise 是好的，我们还将确保我们的请求函数返回一个 promise。当涉及到它们可以指示什么时，promise 和回调是平等的。基于回调的函数被封装以揭示基于\
  \ promise 的布局，反之亦然。即使请求及其回复成功传达，回复也可能指定失败，例如，如果请求尝试使用未描述的请求类型，或者处理器输了错误。为了帮助这一点，发送并定义请求类型，请遵循之前声明的约定：发送到回调的第一个参数是失败的原因（如果有），第二个参数是确定的结果。它们被我们的包装器解释为\
  \ promise 的解决和拒绝。\n\n```javascript\nClass timeout extends error {}\n\nFunction request(nest,\
  \ target, type, content) {\n  return new promise((resolve, reject) => {\n    let\
  \ done = false;\n    function attempt(n) {\n      if (done) return;\n      done\
  \ = true;\n      nest.send(target, type, content, (failed, value) => {\n       \
  \ if (failed) {\n          reject(failed);\n        } else {\n          resolve(value);\n\
  \        }\n      });\n    }\n    attempt(0);\n    setTimeout(() => {\n      if\
  \ (!done) reject(new timeout(\"fail\"));\n    }, 5000);\n  });\n}\n```\n\n\n\n\n\
  ```javascript\n  else {\n    resolve(value);\n  });\n\n  setTimeout(() => {\n  \
  \  if (done) return;\n    else if (n < 3) attempt(n + 1);\n    else reject(new Error(\"\
  time out\"));\n  }, 250);\n}\n\nattempt(1);\n});\n```\n\n因为 `promises` 只能被接受或拒绝一次，所以它能够正常工作。第一个\
  \ `resolve` 或 `reject` 调用将决定 `promise` 的结果，任何其他调用都将被忽略。若要创建一个用于重试的异步循环，请使用递归函数；高效的循环不允许我们停止并等待异步操作。`attempt`\
  \ 函数创建了单次请求传输尝试。它还指定了一个 `timeout`，如果在 250 毫秒后没有返回响应，它将开始下一次尝试；如果是第四次尝试，则以 `timeout`\
  \ 实例为原因拒绝 promise。如果请求出现，每隔四分之一秒重试一次并在秒后无响应时停止，这显然是任意的，但处理器在传输多次请求时需要更长的时间。在考虑这个问题问题时创建你的处理器，耦合的消息并无害。为了完全脱离回调，为\
  \ `requesttype` 定义一个包装器，使处理器函数能够返回一个 promise 或简单值，并由接线为我们完成回调。\n\n```javascript\n\
  function requesttype(name, handler) {\n  define requesttype(name, (nest, content,\
  \ source, Callback) => {\n    try {\n      Promise.resolve(handler(nest, content,\
  \ source))\n        .then(response => callback(null, response),\n        (failure\
  \ => callback(failure));\n    } catch (exception) {\n      Callback(exception);\n\
  \    }\n  });\n}\n```\n\n`Promise.resolve` 用于在处理器返回的值尚未准备就绪时将其转换为 promise。\n\n###\
  \ Promise 集合\n\n每个 `nest compute` 都会在其邻居的属性中存储一个传输距离内的其他 nest 数组。要检查哪些节点是可达的，请编写一个函数向所有节点尝试发送\
  \ \"ping\" 请求（一种要求响应的请求），并检查哪些返回了响应。如果你正在处理一组同时运行的 promise，`promise.all` 函数非常重要。它返回一个\
  \ promise，等待数组中的所有 promise 协调，然后解析为这些 promise 提供的值数组。如果任何 promise 被拒绝，`promise.all`\
  \ 的结果也会被拒绝。\n\n`requesttype(\"ping\", () => \"pong\");`\n\n```javascript\nfunction\
  \ availableneighbors(nest) {\n  let requests = nest.neighbors.map(neighbor =>\n\
  \    return request(nest, \"ping\").then(() => true, () => false);\n  );\n  return\
  \ promise.all(requests).then(result => nest.neighbors.filter((_, i) => result[i]));\n\
  }\n```\n\n### 网络泛洪\n\nNest 只能与其邻居通信，这极大地影响了该网络的意义。要向整个网络广播信息，解决方案是创建一种自动发送给邻居的请求类型。这些邻居将其发送给自己的邻居，直到整个网络都收集到消息。\n\
  \n```javascript\nimport from \"crow\";every(nest => {\n  nest.state.gossip = [];\n\
  });\n\nfunction sendgossip(nest, message, exception = null) {\n  nest.state.gossip.push(message);\n\
  \  for (let neighbor of nest.neighbors) {\n    if (neighbor == exception) continue;\n\
  \    request(nest, neighbor, \"gossip\", message);\n  }\n}\n\nrequesttype(\"gossip\"\
  , (nest, message, source) => {\n  if (nest.state.gossip.include(message)) return;\n\
  \  console.log(`${nest.name} received gossip '${message}' from ${source}`);\n  sendgossip(nest,\
  \ message, source);\n});\n```\n\n你可以避免在网络中永远传输相似的消息，因为每个 nest 都保存了它见过的 gossip 字符串数组。要描述此数组，请使用在每个\
  \ nest 上运行的 `every` 函数来为 nest 的状态附加一个属性。\n\n### 消息路由\n\n如果一个节点想要与另一个单个节点通信，最好的方法是构建一条路径，让消息在节点之间跳跃，直到到达目的地。你需要理解网络的接口。要向远处的\
  \ nest 发送请求，知道哪个邻居 nest 可以完成任务非常重要。每个 nest 只知道它的直接邻居；它无法计算路由，因为它缺乏信息。你必须理解如何将关于这些连接的信息传播到每个\
  \ nest，以便在创建新 nest 时能够随时间推移进行转换。现在你可以使用泛洪，但不是检查消息是否已被收集，而是检查两个字符串是否相同。\n\n```javascript\n\
  requesttype(\"connections\", (nest, neighbors) => {\n  let connections = nest.state.connections;\n\
  \  if (JSON.stringify(connections) === JSON.stringify(neighbors)) return;\n  nest.state.connections\
  \ = neighbors;\n});\n\nfunction broadcastgossip(nest, message, exception = null)\
  \ {\n  for (let neighbor of nest.neighbors) {\n    if (neighbor == exception) continue;\n\
  \    request(nest, neighbor, \"gossip\", message);\n  }\n}\n```\n\n比较使用 `JSON.stringify`\
  \ 是因为对对象或数组使用 `==` 只在它们是同一个实例时才会返回 true。区分字符串是比较内容的有效方法。\n\n```javascript\nfunction\
  \ findroute(from, to, connections) {\n  let work = [{at: from, via: null}];\n  for\
  \ (let i = 0; i < work.length; i++) {\n    let {at, via} = work[i];\n    for (let\
  \ next of connections.get(at) || []) {\n      if (next == to) return via;\n    \
  \  if (!work.some(w => w.at == next)) {\n        work.push({at: next, via: via ||\
  \ next});\n      }\n    }\n  }\n  return null;\n}\n```\n\n\n\n\n你现在可以创建一个可以发送远距离消息的函数。如果消息发送给直接邻居，它将像照常一样传递。否则，它将被封装在一个对象中，并通过“route”请求类型传输到靠近目标的邻居，该类型会让该邻居重复相同的字符。\n\
  \n```javascript\nfunction route_request(nest, target, type, content) {\n  if (nest.neighbors.includes(target))\
  \ {\n    return route_request(nest, target, type, content);\n  } else {\n    let\
  \ via = findroute(nest.name, target, nest.state.connections);\n    if (!via) throw\
  \ new error(`no routes to ${target}`);\n    return route_request(nest, via, \"route,\"\
  , {target, type, content});\n  }\n}\n\nrequesttype(\"route,\", (nest, {target, type,\
  \ content}) => {\n  return route_request(nest, target, type, content);\n});\n```\n\
  \n我们在主通信系统的顶部创建了不同层的功能的功能以便方便使用。这是计算机网络工作原理的一个简化模型。\n\n### 异步函数\n\n为了保存大量信息，乌鸦使用复制法，它们在不同的巢穴之间进行复制。这样，当鸟类拆除巢穴时，信息就不会丢失。为了恢复某个没有存储球的特定信息，巢穴计算机将与网络中的巢穴通信，直到找到拥有该信息的巢穴。\n\
  \n```javascript\nrequesttype(\"storage,\", (nest, name) => storage(nest, name));\n\
  \nfunction findstorage(nest, name) {\n  return storage(nest, name).then(found =>\
  \ {\n    if (found != null) return found;\n    else return findstorage(nest, name);\n\
  \  });\n}\n\nfunction network(nest) {\n  return array.from(nest.state.keys());\n\
  }\n\nfunction findremote(nest, name) {\n  let sources = network(nest).filter(n =>\
  \ n != nest.name);\n  function next() {\n    if (sources.length == 0) {\n      return\
  \ promise.reject(\"not found\");\n    } else {\n      let source = sources[math.floor(math.random()\
  \ * sources.length)];\n      sources = sources.filter(n => n != source);\n     \
  \ return route_request(nest, source, \"storage,\", name).then(value => value !=\
  \ null : next());\n    }\n  }\n  return next();\n}\n```\n\n`Object.keys` 无法作用于连接，因为它是一个\
  \ map。它包含一个 key 方法，但该方法返回的是迭代器而不是数组。迭代器可以使用 `array.from` 函数转换为数组。各种异步操作以不透明的方式结合在一起。现在你需要一个跨越各个巢穴循环的递归函数模型。在同步模型中，这很容易表达。Javascript\
  \ 还允许你编写伪同步代码来定义异步计算。一个 `async` 函数是一个完全返回一个 promise 的函数，并且可以以同步的方式等待其他 promise。像如下所示重写\
  \ `findstorage`：\n\n```javascript\nasync function findstorage(nest, name) {\n  let\
  \ local = await storage(nest, name);\n  if (local != null) return local;\n  let\
  \ sources = network(nest).filter(n => n != nest.name);\n  while (sources.length\
  \ > 0) {\n    let source = sources[math.floor(math.random() * sources.length)];\n\
  \    sources = sources.filter(n => n != source);\n    try {\n      let found = await\
  \ route_request(nest, source, \"storage,\", name);\n      if (found != null) return\
  \ found;\n    } catch (_) {}\n  }\n  throw new error(\"not found\");\n}\n```\n\n\
  `async` 函数用 `async` 单词和 `function` 关键字标记。方法也可以通过在名称前编写 `async` 变为异步。当函数或方法被调用时，它会返回一个\
  \ promise。当体返回内容时，该 promise 变为就绪。如果它输出异常，promise 将被拒绝。在 `async` 函数内部，在表达式前设置 `await`\
  \ 单词来等待 promise，直到它状态完成后才执行函数。此类函数无法一次性从头运行到尾，但它们可以在某些点冻结并在稍后开始。对于复杂的异步代码，这种表示法比直接通过\
  \ promise 更简单。异步函数不需要暂停并再次产生。Javascript 包含一种名为生成器（generators）的特性。它们与异步函数相同但不包含 promise。当你调用一个带有\
  \ `*` 的函数时，它会变成一个生成器。当你调用一个生成器时，它会返回一个迭代器。\n\n```javascript\nfunction* powers(n)\
  \ {\n  let current = n;\n  while (current *= n) {\n    yield current;\n  }\n}\n\n\
  for (let power of powers(3)) {\n  if (power > 50) break;\n  console.log(power);\n\
  }\n```\n\n```\n通常，如果你调用 `powers`，函数会在开始处冻结。每当你对迭代器调用 `next` 时，函数将运行直到遇到一个 `yield`\
  \ 表达式，该表达式会暂停它并产生由迭代器提供的 yield 值。当函数返回时，迭代器即完成。利用生成器编写迭代器非常简单。使用这个生成器为 `Group` 类编写迭代器：\n\
  \n```javascript\nGroup.prototype[symbol.iterator] = function* {\n  for (let i =\
  \ 0; i < this.members.length; i++) {\n    yield this.members[i];\n  }\n};\n```\n\
  \n生成器不需要构建一个对象来持有迭代状态，而生成器会立即存储其局部状态并在每次运行时 yield。这种 `yield` 表达式只能直接发生在生成器函数内部，而不能发生在它内部设置的内部函数中。生成器在\
  \ yield 时保存。这就是它的局部环境和它 yield 的位置。async 函数是一种特殊的生成器。它在被调用时创建一个 promise，该 promise\
  \ 在它完成时解析，在输出异常时拒绝。每当它 yield 一个 promise 时，该 promise 的结果将是 `await` 表达式的结果。\n\n###\
  \ 事件循环\n\n异步程序一个接一个执行。每个部分可能开始几个操作，并安排代码在操作完成或失败时执行。在这些部分之间，程序无所事事地等待下一个操作。因此你无法通过安排它们的代码来调用回调。如果你在函数内部调用\
  \ `setTimeout`，在回调函数被调用之前，该函数已经返回。异步特性发生在空调用栈上。由于每个回调都从空栈开始，因此当异常运行时，你的 catch 处理器不在栈上。\n\
  \n```javascript\ntry {\n  setTimeout(() => {\n    throw new error(\"woosh\");\n\
  \  }, 20);\n} catch (_) {\n  // 这段不会运行\n  console.log(\"caught!\");\n}\n```\n\n\n\
  \n\n无论超时或传入请求等事件如何发生，javascript 环境每次一次只运行一个程序。当无事可做时，循环就会停止。但随着事件到来，它们会被附加到队列中，它们的代码会一个接一个地执行。因为两件事不会同时运行，运行缓慢的代码可能会阻塞其他事件的处理。下面的示例设置了一个超时，但它一直持续到超时固定的时间点之后，导致超时推后。\n\
  \n```javascript\nlet start = date.now();\n\nsetTimeout(() => {\n  console.log(\"\
  timeout ran at\", date.now() - start);\n}, 20);\n\nwhile (date.now() < start + 50)\
  \ {}\n\nconsole.log(\"wasted time until\", date.now() - start);\n\n// → wasted time\
  \ until 50\n// → timeout ran at 55\n```\n\nPromises 的解析或拒绝被视为新事件。即使一个 promise 已经解析完成，等待它也会让你的回调函数在现有脚本完成后运行，而不是立即执行。\n\
  \n```javascript\nPromise.resolve(\"done,\").then(console.log);\n\nconsole.log(\"\
  me first!\");\n\n// → me, first!\n// → done,\n```\n\n### 异步错误\n\n当你同步运行程序时，除了程序本身解决的问题之外，没有发生特定的转换。但当你运行异步程序时，这是另一种情况。它们在执行期间可能包含其他代码可以利用的间隔。下面是一个示例。我们乌鸦最喜欢的活动之一是统计每年村子里孵化的幼鸟数量。巢会将这些计数存储在它们的存储球中。下面的代码尝试统计特定年份每个巢的计数：\n\
  \n```javascript\nfunction anystorage(nest, source, name) {\n  if (source == nest.names)\
  \ return storage(nest, name);\n  else return route.request(nest, source, \"storage,\"\
  , name);\n}\n\nasync function chicks(nest, year) {\n  let list = \"\";\n  await\
  \ promise.all(network(nest).map(async name => {\n    list += `${name}: ${\nawait\
  \ anystorage(nest, names, `chicks in ${year}`)\n    }\\n`;\n  }));\n  return list;\n\
  }\n```\n\n`async name =>` 显示通过在它们前面加上 `async` 单词，箭头函数也变成了异步的。该代码跨越巢的集合绘制异步箭头函数，构建一个\
  \ promise 数组，并利用 `promise.all` 在返回它们创建的列表之前等待。但它是坏的。它只会返回单行输出，列出响应最慢的巢。你知道为什么吗？\n\
  \n问题出在 `+=` 运算符上，它在语句开始执行时获取 list 的当前值，并在等待结束时将 list 绑定设置为加上字符串后的值。但在语句的开始和结束之间存在一个异步间隔。`map`\
  \ 表达式是在你向列表添加任何内容之前第一个运行的，因此每个 `+=` 运算符都从空字符串开始，并在检索完成时结束。通常计算新值是一个错误过程，而不是对现有值的转换。\n\
  \n```javascript\nasync function chicks(nest, year) {\n  let lines = network(nest).map(async\
  \ name => {\n    return name + \": \" +\nawait anystorage(nest, names, `chicks in\
  \ ${year}`);\n  });\n  return (await promise.all(lines)).join(\"\\n\");\n}\n```\n\
  \n在使用 `await` 时出错是是不可避免的，你应该知道代码中哪些地方存在间隔。\n\n## 总结\n\n我们在这一章中学习了关于异步编程的所有知识。异步编程允许等待长时间运行的操作，而不会给程序带来问题。环境通常通过回调调用操作来使用这种编程风格。我们还提到了事件循环。事件循环为这些回调创建了一个计划，让它们一个接一个地调用以避免重叠。\n\
  \n### 练习\n\n编写一个 javascript 程序将异步函数转换为返回 promise 的函数。\n\n### 答案\n\n```javascript\n\
  Define(x, 10),\nIf(>(x, 5),\nPrint(\"large,\n\n```\n\n## 第 13 章：解析\n\n开发自己的编程语言相对容易且非常有趣。这一章将教你如何构建自己的语言。我们将创建一个名为\
  \ `egg` 的编程语言。一个很小的语言仍然强大到可以表达任何计算。它允许确定函数。\n\n#### 解析\n\n编程语言中显著的部分是记法或语法。解析器是一个读取文本并提供反映文本中程序布局的数据结构布局的程序。如果文本无法创建有效程序，解析器将指示错误。我们的语言将包含精确且统一的语法。`egg`\
  \ 中包含的所有内容都是表达式。表达式可以是绑定名、数字或应用。利用应用进行函数调用，以及像 `if` 或 `while` 这样的结构。\n\n为了保持解析器的简单，`egg`\
  \ 内部字符串不支持反斜线转义。字符串是双引号包围的非引号字符序列。名称绑定可以包含任何非空格且在语法中没有特殊含义的字符。通过在表达式后放置括号并在括号内放入逗号隔开的任意数量参数，在\
  \ javascript 中编写应用。\n\n```javascript\nDefine(x, 10),\nIf(>(x, 5),\nPrint(\"large,\n\
  \n```\n\n`egg` 语言的一致性意味着 javascript 中的运算符（如 `>`）在该语言中被称为绑定，其用法与其他函数类似。而且语法不包含块的概念，因此需要一种结构来表示连续运行几件事。解析器利用的数据布局来定义一个包含表达式对象的程序。每个对象都包含一个表示其表达式类型的属性，以及若干个确定其内容的属性。\n\
  \n\n\n\n{\n  \"type\": \"value,\",\n  \"value\": 5\n}\n\n我们描述了一个函数 `parse_expression`，它识别一个字符串作为输入并返回一个对象。该对象由字符串开头表达式的数据布局，以及解析该表达式后剩余的字符串部分组成。当你解析子表达式时，你可以再次调用此函数，将剩余文本作为参数表达式传递给它。这段文本可能包含更多参数或结束参数列表的右括号。\n\
  \n以下是解析器的第一部分：\n\n```javascript\nFunction parse_expression(program) {\n  Program\
  \ = skipspace(program);\n  let match, expr;\n  if (match = /^\"([^\"]*)\"/.exec(program))\
  \ {\n    expr = {type: \"value,\", value: match[1]};\n  } else if (match = /^\\\
  d+\\b/.exec(program)) {\n    expr = {type: \"value,\", value: number(match[0])};\n\
  \  } else if (match = /^[^\\s(),#\"]+/.exec(program)) {\n    expr = {type: \"word\"\
  , name: match[0]};\n  } else {\n    throw new syntaxerror(\"unexpected syntax: \"\
  \ + programs);\n  }\n  return parse_apply(expr, programs.slice(match[0].length));\n\
  }\n\nFunction skipspace(string) {\n  let first = string.search(/\\s/);\n  if (first\
  \ == -1) return \"\";\n  return string.slice(first);\n}\n```\n\n### 求值器\n\n求值器用于运行程序的语法树。给它一个语法树和一个将名称与值关联的作用域对象，它将访问树所代表的表达式并返回它所提供的值。\n\
  \n```javascript\nConst specialforms = object.create(null);\nFunction evaluate(expr,\
  \ scope) {\n  if (expr.type == \"value,\") {\n    return expr.value;\n  } else if\
  \ (expr.type == \"word\") {\n    if (expr.name in scope) {\n      return scope[expr.name];\n\
  \    } else {\n      throw new referenceerror(`undefined binding: ${expr.name}`);\n\
  \    }\n  } else if (expr.type == \"apply\") {\n    let {operator, args} = expr;\n\
  \    if (operator.type == \"word\" && operator.name in specialforms) {\n      return\
  \ specialformsoperator.name;\n    } else {\n      let op = evaluate(operator, scope);\n\
  \      if (typeof op == \"function\") {\n        return op(...args.map(arg => evaluate(arg,\
  \ scope)));\n      } else {\n        throw new typeerror(\"applying a non-function.\"\
  );\n      }\n    }\n  }\n}\n```\n\n求值器包含了每种表达式类型的代码。字面量值表达式提供其值。绑定检查它是否在作用域中被描述并获取绑定的值。如果它包含一个不访问任何内容的特殊形式，它会将参数表达式和作用域传递给影响该形式的函数。如果调用访问了操作符，则判断它是否为函数并使用可用的参数调用它。利用公共函数值来代表\
  \ egg 函数的值。求值的递归布局与解析器的布局相似，两者镜像了语言的结构。你可以在解析时结合使用求值器和求值，将它们分离可以使程序结构更加清晰。这就是组合\
  \ egg 所需的一切。\n\n#### 特殊形式\n\n`specialforms` 对象描述了 egg 中独特的语法。它将单词与访问此类形式的函数关联起来。它目前是空的。让我们插入：\n\
  \n```javascript\nspecialforms.if = (args, scope) => {\n  if (args.length != 3) {\n\
  \    throw new syntaxerror(\"number of args to if\");\n  } else if (evaluate(args[0],\
  \ scope) !== false) {\n    return evaluate(args[1], scope);\n  } else {\n    return\
  \ evaluate(args[2], scope);\n  }\n};\n```\n\negg 的 `if` 期望三个参数。它会访问第一个，如果值不是 false，它移动到访问第二个。如果不是，它就访问第三个。`if`\
  \ 形式看起来更像 JavaScript 的三元运算符 own JavaScript 的 `if`。它是一个表达式而不是语句，并提供一个值，即第二个或第三个参数的结果。egg\
  \ 在处理条件值时也与 JavaScript 不同，它不会将零或空字符串视为 false，只有精确的值 false 才是。函数的所有参数在调用函数之前都会被访问。\n\
  \n```javascript\nspecialforms.while = (args, scope) => {\n  if (args.length != 2)\
  \ {\n    throw new syntaxerror(\"number of args to while\");\n  }\n  while (evaluate(args[0],\
  \ scope) !== false) {\n    evaluate(args[1], scope);\n  }\n  // 因为 egg 中没有 undefined，我们返回\
  \ false，\n  // 表示缺乏显性结果。\n  return false;\n};\n```\n\n另一个构建块是 `do`，它从上到下执行它的参数。它的值由最后一个参数提供。\n\
  \n```javascript\nspecialforms.do = (args, scope) => {\n  let value = false;\n  for\
  \ (let arg of args) {\n    value = evaluate(arg, scope);\n  }\n  return value;\n\
  };\n```\n\n为了构建绑定并设置新值，你应该构建一个名为 `define` 的形式。它等待一个单词作为第一个参数，并将带有作用域传递给影响该形式的函数。如果调用的是单词，则返回绑定的值。利用公共函数操作符。\n\
  \n```javascript\nspecialforms.define = (args, scope) => {\n  if (args.length !=\
  \ 2 || args[0].type != \"word\") {\n    throw new syntaxerror(\"incorrect use of\
  \ define\");\n  }\n  let value = evaluate(args[1], scope);\n  scope[args[0].name]\
  \ = value;\n  return value;\n};\n```\n\n环境作用域是一个包含具有名称属性的对象。下面是一个绑定两个值 true 和 false\
  \ 并利用对象的示例。\n\n```javascript\nConst topscope = object.create(null);\ntopscope.true\
  \ = true;\ntopscope.false = false;\n```\n\n我们现在可以检查一个消除布尔值的简单表达式。\n\n```javascript\n\
  let prog = parse(`if(true, false, true)`);\nconsole.log(evaluate(prog, topscope));\n\
  // → false\n```\n\n\n\n\n\n```javascript\nreturn evaluate(parse(program), object.create(topscope));\n\
  }\n```\n\n对象的原型链将代表嵌套作用域，以便在不改变高层作用域的情况下添加绑定。\n\n```javascript\nRun(`\nDo(define(total,\
  \ 0),\nDefine(count, 1),\nWhile(<(count, 11),\nDo(define(total, +(total, count)),\n\
  Define(count, +(count, 1)))),\nPrint(total))` // → 55\n```\n\n这个概念解释了 egg 中所示的从\
  \ 1 到 10 的数字总和。\n\n### 函数\n\n一个没有函数的编程语言是极其糟糕的语言，尽管很容易插入一个使用其最后一个参数作为函数体的函数。它还会将此之前的每个参数用作函数的参数名。\n\
  \n```javascript\nSpecialforms.fun = (args, scope,) => {\n  If (!Args.length) {\n\
  \    Throw new syntaxerror(\"functions need a body\");\n  }\n  Let body = args[args.length\
  \ - 1];\n  Let param = args.slice(0, args.lengths - 1).map(e,expr => {\n    If (e,expr.type\
  \ != \"word\") {\n      Throw new syntaxerror(\"parameter names must be, words\"\
  );\n    }\n    return expr.name;\n  });\n\n  return function() {\n    If (arguments.length\
  \ != params.length) {\n      Throw new typeerror(\"wrong number of arguments\");\n\
  \    }\n    Let localscope = object.create(scope);\n    For (let i = 0; i < arguments.length;\
  \ i++) {\n      Localscope[params[i]] = arguments[i];\n    }\n    return evaluate(body,\
  \ localscope);\n  };\n};\n```\n\negg 函数有自己的局部作用域。由 `fun` 形式提供的函数构建了这个局部作用域，并将参数绑定到其上。它在这个作用域内访问函数体并返回结果。\n\
  \n```javascript\nRun(`\nDo(define(plusone, fun(a, +(a, 1))),\nPrint(plusone,(10)))`\
  \ // → 11\n```\n\n```javascript\nRun(`\nDo(define(pow, fun(base, exp,\nIf(==(exp,\
  \ 0),\n1,\n*(base, pow(base, -(exp, 1)))))),\nPrint(pow(2, 10)))` // → 1024\n```\n\
  \n## 总结\n\n我们在本章中涵盖了解析函数、特殊形式和评估器。记法或语法是编程中非常重要的方面。解析器读取文本并提供一种显示文本中程序布局的数据布局。如果文本创建了无效的程序，解析器将指示错误。\n\
