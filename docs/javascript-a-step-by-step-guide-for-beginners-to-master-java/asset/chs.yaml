  ```\n\n`E` 常量提供自然数的值。\n\n```javascript\nConsole.log(E);\n// → 2.71828...\n```\n\n\
  `log` 方法返回数字的自然对数。\n\n```javascript\nConsole.log(log(10));\n// → 2.302...\n```\n\
