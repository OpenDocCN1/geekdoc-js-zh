  \ JavaScript 对象表示法，它用于 Web 的通信格式和数据存储。JSON 在编写风格（数组和对象）上与 JavaScript 非常相似，尽管存在一些限制。它的属性名必须包含在双引号内，并且它只允许简单的数据表达式、绑定等。JSON\
  \ 不允许注释。\n\n这是一个用 JSON 数据表示的日志条示例：\n\n```json\n{\n  \"squirrel\": false,\n  \"events\"\
  : [\"work\", \"touched tree,\", \"pizza\", \"running\"]\n}\n```\n\nJavaScript 包含\
  \ `json.stringify` 和 `json.parse` 两个函数，用于在该格式之间转换数据。`json.stringify` 接收一个 JavaScript\
  \ 值并返回一个 JSON 编码的字符串，而 `json.parse` 接收一个字符串并将其转换为编码的值。\n\n```javascript\nlet string\
  \ = json.stringify({\n  squirrel: false,\n  Events: [\"weekend\"]\n});\n\nConsole.log(string);\n\
  // → {\"squirrel\":false,\"events\":[\"weekend\"]}\n\nConsole.log(json.parse(string).events);\n\
  // → [\"weekend\"]\n```\n\n### 反转数组\n数组包含 `reverse` 方法，用于通过反转元素显示顺序来改变数组。\n\n##\
  \ 总结\n我们在本章中涵盖了对象和数组，它们创建了在单个值中对各种值分类的方法。想象一下，这让你能够将几个关联项放入袋中并提着袋子移动，而不是用手臂抱住每一个单独的物品并试图将它们分开。JavaScript\
