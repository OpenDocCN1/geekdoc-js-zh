- "# Javascript：初学者掌握 Javascript 编程分步指南\n\n\n\n\n\n\n\n\n\n\n## 引言\nJavascript 是一种卓越且成熟的编程语言，遵循\
  \ ECMAScript 规范。该语言由强类型系统、大括号语法、高质量的函数以及基于原型的面向对象机制组成。配合 HTML 和 CSS，Javascript 是全球网的重要技术之一。Javascript\
  \ 促进了交互式网页的实现，是 Web 应用程序的重要部分。几乎每个网站都使用了 Javascript，所有主要的网页浏览器都包含 Javascript 引擎以正常运行。Brend\
  \ Eich 在 1995 年任职 Netscape Communications 时开发了 Javascript。Javascript 支持函数式、事件驱动、基于原型和面向对象的编程风格。Javascript\
  \ 通过确认用户在客户端执行的操作来提升 Web 用户界面。你可以将 Javascript 引擎插入到不同类型的主机软件中，包括数据库、Web 服务器以及文字处理器等非网页相关程序。\n\
  \n本书进一步解释了 Javascript 的概念，旨在帮助您在没有压力的情况下学习和理解 Javascript 语言。学习 Javascript 只需要 HTML、文本编辑器、网页浏览器和\
  \ CSS 知识。要开始学习过程，必备工具之一是文本编辑器（编写代码必需），你还需要一个浏览器来查看开发的页面。有不同类型的文本编辑器，如 Sublime，以及浏览器如\
  \ Firefox、Chrome。\n\n# 第 1 章：什么是 javascript\nJavascript（简称为 js）是一种高级语言，最初用于为页面添加特定功能，并已被所有主流浏览器采用。Javascript\
  \ 可用于无需重新加载页面即可构建交互式应用程序。Javascript 是 Web 的核心组成部分，其他是 HTML（文本标记语言）和 CSS（级联样式表）。Javascript\
  \ 通过添加客户端脚本让页面变得活跃。\n客户端 Javascript 是 Javascript 的常见形式。脚本必须插入到 HTML 文档中，以便浏览器可以解释代码。它允许网页包含动态内容，用户需要浏览器来查看开发的页面，有不同类型的文本编辑器，如\
  \ Sublime、记事本（notepad）。\n\n### 客户端 Javascript 放置\n```html\n<head>\n<script>\n//\
  \ 代码写在这里\n</script>\n</head>\n```\n\n Javascript 的优点\n* 通过 Javascript，用户可以在将页面发送到服务器之前对输入进行整理，这自动减轻了服务器负载。\n\
  * Javascript 能够对页面访问者做出快速响应。访问者无需刷新页面即可看到是否存在输入错误。\n* Javascript 用于构建响应式界面，当鼠标悬停在元素上时会产生反应。\n\
  \nJavascript 的局限性\nJavascript 语言缺少以下要素。它们是：\n* 出于安全考虑，客户端 Javascript 不读取或写入文件\n\
  * 用于网络应用程序的 Javascript\n* Javascript 不具备多处理器能力\n\n\n\n\n\n`<body>` 部分内部的脚本。\n\n\
  `<body>` 和 `<head>` 部分的脚本。\n\n在`<head>...</head>` 部分引入外部文件脚本。\n\n### `<head>...</head>`\
  \ 区域中的 Javascript\n\n在某些情况下，当你想让脚本在特定事件发生运行时（例如点击按钮时的操作）时，可以将脚本按如下放在 `head` 区域：\n\
  \n```html\n<html>\n<head>\n<script type=\"text/javascript\">\n<!--\nFunction sayhi()\
  \ {\n  Alert(\"hello world\")\n}\n//-->\n</script>\n</head>\n<body>\n点击此处获取结果\n\
  <input type=\"button\" onclick=\"sayhi()\" value=\"say hi\" />\n</body>\n</html>\n\
  ```\n\n### `<body></body>` 区域中的 Javascript\n\n有时你希望脚本立即运行并在内容页面上创建脚本，这时，请将脚本插入到\
  \ `<body>` 部分。代码看起来应该是这样的：\n\n```html\n<html>\n<head>\n</head>\n<body>\n<script\
  \ type=\"text/javascript\">\n<!--\nDocument.write(\"hello world\")\n//-->\n</script>\n\
  <p>this is web page body</p>\n</body>\n</html>\n```\n\n### `<body>` 和 `<head>` 区域中的\
  \ Javascript\n\n将你的 javascript 代码按如下所示插入 `<head>` 和 `<body>` 部分：\n\n```html\n<html>\n\
  <head>\n<script type=\"text/javascript\">\n<!--\nFunction sayhi() {\n  Alert(\"\
  hello world\")\n}\n//-->\n</script>\n</head>\n<body>\n<script type=\"text/javascript\"\
  >\n<!--\nDocument.write(\"hello world\")\n//-->\n</script>\n<input type=\"button\"\
  \ onclick=\"sayhi()\" value=\"say hi\" />\n</body>\n</html>\n```\n\n### 外部文件中的 Javascript\n\
  \n为了避免重复使用相同的 javascript 代码，该语言允许你创建一个外部文件并存储 javascript 代码，然后将该外部文件集成到 html 文件中。下面的示例显示了如何利用\
  \ `script` 标签和 `src` 属性在 html 代码中集成外部 javascript 文件。\n\n```html\n<html>\n<head>\n\
  <script type=\"text/javascript\" src=\"filename.js\"></script>\n</head>\n<body>\n\
  .......\n</body>\n</html>\n```\n\n外部文件源文件应以 `.js` 扩展名保存。\n\n## 总结\n\n在第一章中，我们解释了\
  \ javascript 的起源及其如何放入内部和外部文件中。我们讨论了使用 javascript 构建交互式 Web 应用程序，使其能够适当执行，而无需每次操作后都重新加载页面。\n\
  \n### 练习\n\n你如何在 html 文档中将 javascript 代码插入到 head、body 并包含外部文件脚本？\n\n#### 答案\n\n\
  head 部分的脚本是 `<head></head>`。\nbody 部分的脚本是 `<body></body>`。\n在 body 内部的脚本是 `<body>`\
  \ 和 `<head></head>`。\n在 `<head>...</head>` 中包含外部文件的脚本是。\n\n## 第二章：值、类型和操作符\n\n在计算机世界中，数据是核心。你可以创建新数据并更改数据，这些数据都存储为相似的位序列（bits）。将位定义为\
  \ 0 和 1，它们代表来自计算机强、弱、高或低电荷。所有信息数据都被描述为 0 和 1 的序列，并用位表示。\n\n### 值\n\n深呼吸，想象一片比特的海洋。最新的设备在其数据存储中包含超过\
  \ 300 亿个位。我们使用位来创建值。计算机能够正常工作是因为每一位信息都被拆分成了值。每个值由一个影响其角色的类型组成，值可以是数字、文本等。要生成值，你需要调用它的名称，它会出现在它被存储的地方。\n\
  \n### 算术\n\n算术是处理数字的主要方式。对一个数字进行乘法和减法以产生另一个数字是算术运算。这是它们在 javascript 中看起来像样的示例：\n\
  \n```javascript\n100 + 4 * 11\n```\n\n`+` 和 `*` 符号被称为操作符，第一个表示加法，另一个表示乘法。在两个值之间插入的操作符将产生另一个值。`-`\
  \ 操作符用于减法，`/` 操作符用于除法。如果操作符在没有括号的情况下一起，操作符的优先级决定了它们的应用方式。如果几个具有相同优先级的操作符相邻显示（例如\
  \ `1 - 2 + 1`），则从左到右应用：`(1 - 2) + 1`。\n\n### 特殊数字\n\nJavascript 包含三个独特的值，它们的行为不像数字，但被视为数字。`infinity`\
  \ 和 `-infinity` 是前两个，意味着正无穷和负无穷，最后一个值是 `nan`。`nan` 意为“不是数字”，尽管它是一个数字类型的值。\n\n###\
  \ 字符串\n\n字符串是数字的序列。字符串是下一个数据类型，它们代表文本。字符串将其内容限制在引号中。\n\n`down the walkway path.\
  \ `\n\"on top of the roof.\"\n'I am at home.'\n\n使用不同类型的引号（如双引号、单引号或反引号）来标记字符串。这是一种匹配的类型。你不能使用\
  \ `+` 操作符，因为它不会相加字符串，而是拼接字符串。（等等，文本说的是 \"but concatenate strings\" - 指的是第二章）。\n\n\
  ### 一元操作符\n\n符号并不代表所有的操作符。你可以用单词写某些操作符。一个清晰的例子是附加值的类型：\n\n```javascript\nconsole.log(type\
  \ of 4.5) // -> number\nconsole.log(type of \"x\") // -> string\n```\n\n第二个的操作符被称为二元操作符，因为它们使用两个值，而使用一个值的操作符是一元操作符。\n\
  \n```javascript\nconsole.log(- (10 - 2)) // -> -8\n```\n\n### 布尔值\n\n布尔值仅在两种可能性之间区别的值，例如“开启”和“关闭”等。布尔值只包含\
  \ true 和 false。\n\n### 比较\n\n比较是创建布尔值的方法：\n\n```javascript\nconsole.log(3 > 2) //\
  \ -> true\nconsole.log(3 < 2) // -> false\n```\n\n`>` 和 `<` 字符分别是代表“大于”和“小于”的符号。你可以在布尔值中使用二元操作符，以确定匹配为真还是假。你可以以同样的方式比较字符串。\n\
  \n```javascript\nconsole.log(\"aardvark\" < \"zoroaster\") // -> true\n```\n\n\n\
  \n\n你可以按照字母顺序对字符串进行指令，大写字母通常“小于”小写字母，因此 \"z\" < \"a\"，且非字母字符（`!`、`-`、`,` 等）也存在于排序中。当\
  \ javascript 想要比较字符串时，它会从左到右识别字符，逐个区分 unicode 编码。\n\n这里是其他相关的运算符 `<=`（小于等于）、`>=`（大于等于）、`==`（等于）和\
  \ `!=`（不等于）。\n\n```\nConsole.log(\"itchy\" != \"scratchy\")\n// → true\n```\n\n\
  ```\nConsole.log(\"apple\" == \"orange\")\n// → false\n```\n\n在 javascript 中，只有一个值不等于它自己，那就是\
  \ `nan`（不是数字数字）。\n\n```\nConsole.log(nan == nan)\n// → false\n```\n\n### 逻辑运算符\n\
  \nJavascript 仅支持三种可以应用于布尔值的运算符，它们是 `and`、`or` 和 `not`。`&&` 运算符表示逻辑与，其结果取决于输入的值是\
  \ `true` 还是 `false`。\n\n```\nConsole.log(true && false)\n// → false\nConsole.log(true\
  \ && true)\n// → true\n```\n\n`||` 运算符表示逻辑或。如果给定的值为 `true`，则该运算符输出 `true`。\n\n```\n\
  Console.log(false || true)\n// → true\nConsole.log(false || false)\n// → false\n\
  ```\n\n感叹号 `!` 表示“非”。它是一个翻转设定值的运算符，它将 `true` 变为 `false`，将 `false` 变为 `true`。\n\n\
  `||` 具有所有运算符中最低的优先级，然后是 `&&`、比较运算符（`>`、`==` 等）等等。下面的示例说明括号是必要的：\n\n```\n1 + 1 ==\
  \ 2 && 10 * 10 > 50\n```\n\n### 空值\n\n`null` 和 `undefined` 是仅两个用于表示重要值缺失的特殊值类型。它们不包含任何数据。\n\
  \n### 自动类型转换\n\n之前我提到过 javascript 接受几乎所有给定的程序，包括行为异常的程序。自动类型转换在以下表达式中得到了体现：\n\n\
  ```\nConsole.log(8 * null)\n// → 0\nConsole.log(\"5\" - 1)\n// → 4\nConsole.log(\"\
  5\" + 1)\n// → 51\nConsole.log(\"five\" * 2)\n// → nan\nConsole.log(false == 0)\n\
  // → true\n```\n\n当你给运算符分配错误的值时，javascript 会使用类型转换规则静默地将该值转换为其所需的精确类型。在第一个表达式中，`null`\
  \ 变为 `0`，第二个中的 `5` 保持为 `5`（从字符串转换为数字）。在第三个表达式中，在数值相加之前存在字符串拼接，这会将 `1` 转换为 `\"1\"\
  `（从数字转换为字符串）。当像 \"five\" 这样的奇数转换为数字时，得到的值是 `nan`。如果你想使用 `==` 区分两个相同类型的值，如果值相似，输出应为\
  \ `true`。如果你想测试一个值是否包含真实值，请使用 `!=` 运算符或比较运算符进行比较。\n\n### 逻辑运算符的短路\n\n`&&` 和 `||`\
  \ 被称为逻辑运算符。它们用于以特定方式持有多种类型的值。它们将左侧包含的值转换为布尔类型以决定，尽管这取决于运算符和生成结果的类型，但始终会返回左侧或右侧的值。`||`\
  \ 运算符可以在转换为 `true` 时返回左侧的值，并将返回右侧的值。\n\n```\nConsole.log(null || \"user\")\n// →\
  \ user\nConsole.log(\"kate\" || \"user\")\n// → kate\n```\n\n此函数用于将值返回到默认值，并作为空值的替换放置。字符串和数字的布尔转换规则规定，`0`、`nan`\
  \ 和空字符串 `\"\"` 视为 `false`，而其他值均为 `true`。因此 `0 || -1` 输出 `-1`，`\"\" || \"!?\"` 产生\
  \ `!?`。`&&` 运算符的操作方式相同但方向相反。当左侧的值可以转换为 `false` 时，返回该值，或者将其发送到右侧。两个运算符只在需要时评估右侧的值。例如，我们有如下设定值\
  \ `true || x`，`x` 的值将是 `true` 而不会考虑它。同样的规则也适用于 `false && x`，`x` 为 `false` 会被忽略。你可以将此过程称为短路求值。\n\
  \n## 总结\n\n本章介绍了 javascript 值的四类：字符串、数字、`undefined` 值和布尔值。这些值通过将它们的名称插入 `true`、`null`\
  \ 或值（13, \"abc\"）来生成。运算符可以整合并改变值。我们查看了算术二进制运算符（`+`、`-`、`*`、`/` 和 `%`）、字符串拼接（`+`）、比较（`==`、`!=`、`===`、`!==`、`<`、`>=`）、逻辑（`&&`、`||`），以及用于根据第三个值选择一个值的单元运算符（`-`）和三元运算符（`?:`）。\n\
  \n通过定义的名称创建一个变量。\n\n解答\n\n![0093.jpg](img/0093.jpg)\n\n## 第 3 章：程序结构\n\n我们将开始 javascript\
  \ 语言在句子和名词之外的扩展。\n\n### 表达式与状态\n\n一个产生值的代码块被称为表达式。一个值精确写为 `22` 或 `psychoanalysis`\
  \ 是一个表达式。二进制运算符内部的表达式也是一个表达式。一个表达式像人类语言一样容纳其他表达式。它允许我们开发描述任意复杂的表达式。当一个表达式可以比作句子时，javascript\
  \ 状态将完成该句子。\n\n### 绑定\n\nJavascript 使用变量绑定来持有值，例如：\n\n```\nGet money = 5 * 5;\n\
  ```\n\n\n\n`let` 是该语句中的关键字，它意味着句子将指定一个绑定与绑定名称在一起，并可以使用 `=` 运算符和表达式来附加值。使用已定义的绑定作为表达式，即包含该绑定值的表达式。下面是一个示例：\n\
  \n```javascript\nlet ten = 10;\nConsole.log(ten * ten);\n// → 100\n```\n\n`=` 运算符用于现有绑定，将绑定从一组值中移除并将其指向新值。\n\
  \n```javascript\nlet mood = \"light\";\nConsole.log(mood);\n// → light\n\nmood =\
  \ \"dark\";\nConsole.log(mood);\n// → dark\n```\n\n在定义绑定时不赋值值将导致没有内容可持有。因此，请求绑定的值会产生\
  \ `undefined` 值。你可以通过一个由逗号分隔的单一语句定义多个绑定。\n\n```javascript\nlet one = 1, two = 2;\n\
  Console.log(one + two);\n// → 3\n```\n\n使用 `var` 和 `const` 单词来熟悉地开发绑定：\n\n```javascript\n\
  var name = \"ayad\";\nconst greeting = \"hello \";\nConsole.log(greeting + name);\n\
  // → hello ayad\n```\n\n`const` 单词意味着常量。它描述了一个坚定的绑定，在其生命周期内始终指向其设置的值。这些单词通常用于将一个名称声明为一个值，以便以后轻松引用。\n\
  \n### 绑定名称\n\n尽管有一些像 `const`、`class`、`default`、`break`、`continue`、`delete`、`do`、`else`、`yet`\
  \ 这样的保留字，但任何单词都可以作为绑定名称，它可以包含数字但不能以数字开头语句。绑定名称也可以包含美元符号（`$`）或下划线（`_`），但不包含任何其他特殊字符或标点符号。\n\
  \n特定时间存在的绑定和值的组被称为环境。当你启动程序时，环境持有语言标准绑定，并通常包含与系统环境创建交互的绑定。例如，浏览器携带了与启动的网站通信的函数，以及读取键盘和鼠标输入。\n\
  \n### 函数\n\n封装在值中的部分程序被称为函数，这些值被添加以启动被封装的程序。例如，一个为用户输入显示小对话框的函数。\n\n```javascript\n\
  Prompt (\"enter passcode\");\n```\n\n实现函数的过程被描述为调用、触发或应用。通过在提供函数值的表达式后插入括号来调用函数。将括号的值设置为函数内部的程序。将值定义为参数。\n\
  \n### console.log\n\n在上面的示例中，我们使用 `console.log` 来输出值。所有主流浏览器都利用 `console.log` 将其参数状态到输出文本的设备。在现代浏览器中，输出通常在默认不可见的控制台中；你可以点击键盘上的\
  \ F12 或 Mac 上的 `command-option` 键。名称不包含点，但 `console.log` 包含，因为它是一个从 `console` 值中申取属性的表达式。\n\
  \n### 返回值\n\n函数被用于产生副作用。它们也可以提供不需要副作用的值。例如，`calculate.max` 函数将取一组数字参数之和并返回最大的值。\n\
  \n```javascript\nConsole.log(calculate.max(2, 4));\n// → 4\n```\n\nJavascript 将任何提供值的视为表达式，这使得函数调用能够附加到实质表达式中。让我们调用\
  \ `calculate.min`，它是 `calculate.max` 的直接相反面：\n\n```javascript\nConsole.log(math.min(2,\
  \ 4) + 100);\n// → 102\n```\n\n### 控制流\n\n当程序中包含多个语句时，它们以故事的形式从代码开始到结束执行。这种类型的程序由两种语句组成；第一种向用户请求数字，而第二个显示数字的平方并在第一个之后立即执行。\n\
  \n```javascript\nlet number = number(prompt(\"select a digit \"));\nConsole.log(\"\
  your digit is the square root of \" + number * number);\n```\n\n一个值通过 `number` 函数转换为数字并输出一个字符串值。\n\
  \n条件执行\n\n键盘被用于在 javascript 中开发条件执行。你可能希望某些代码仅当特定条件为真时才执行。让我们在输入仅为数字时才显示其平方。\n\n\
  ```javascript\nlet number = number(prompt(\"select a digit \"));\nIf (! number.isnan(number))\
  \ {\nConsole.log(\"your digit is the square root of \" + number * number);\n}\n\
  ```\n\n`if` 关键字执行或规避由布尔表达式值决定的语句。在关键字后的括号内输入确定表达式，并伴随要完成的语句。`if` 关键字执行或规避由布尔表达式值决定的语句。\n\
  \n```javascript\nIf (1 + 1 == 2)\nConsole.log(\"it's true,\");\nelse\nConsole.log(\"\
  y. why didn't you give me a number?\");\n```\n\n如果有两个以上的路径可以选择，你可以“链式”多个 `if/else`\
  \ 对。下面是一个示例：\n\n```javascript\nlet num = number(prompt(\"pick a number\"));\nIf\
  \ (num < 10) {\n  Console.log(\"small\");\n} else if (num < 100) {\n  Console.log(\"\
  medium\");\n} else {\n  Console.log(\"large\");\n}\n```\n\n程序确认 `num` 是否小于 10，如果是，则选择该分支并显示\
  \ \"small\"。`isnan` 函数在输入不是数字时返回 `nan`。\n\n### While and do 循环\n\n这是编写一个显示从 0 到\
  \ 12 所有偶数程序的方法。\n\n```javascript\nlet i = 0;\nwhile (i <= 12) {\n  Console.log(i);\n\
  \  i = i + 2;\n}\n```\n\n```javascript\nlet i = 0;\ndo {\n  Console.log(i);\n  i\
  \ = i + 2;\n} while (i <= 12);\n```\n\n多次运行代码块的方式被描述为循环。\n\n\n\n循环控制流允许用户返回编写程序中的某些点，并根据程序的当前状态重新执行。将其与如下所示枚举的绑定相结合：\n\
  \n```javascript\nlet number = 0;\n\nWhile (number <= 12) {\nConsole.log(number);\n\
  Number = number + 2;\n}\n// → 0\n// → 2\n// … 等\n```\n\n一个以关键字开头并同时产生循环的语句。关键字 `while`\
  \ 跟着一个括号内的表达式，然后跟一个类似于 `if` 语句的语句。循环将持续进行，直到表达式在转换为布尔值时为真（true）。循环每次重复，数值都会变为其之前值的两倍。让我们写一个程序来计算并显示\
  \ 2¹⁰（2 的 10 次方）的值。我们将使用两个绑定：一个用于监控我们的结果，另一个用于计算 2 乘以结果的次数。它会一直相乘，直到第二个绑定达到 10：\n\
  \n```javascript\nlet result = 1;\nlet counter = 0;\nWhile (counter < 10) {\nResult\
  \ = result * 2;\nCounter = counter + 1;\n}\nConsole.log(result);\n// → 1024\n```\n\
  \n`do` 循环是一个与 `while` 循环相关的命令结构。`do` 循环在语句中至少会发生一次，然后在第一次执行后开始检查是否应该结束。请遵循以下步骤：\n\
  \n```javascript\nlet yourname;\nDo {\nYourname = prompt(\"who are you?\");\n} while\
  \ (! yourname);\nConsole.log(yourname);\n```\n\n### For 循环\n\n许多循环遵循 `while` 循环模式，创建一个计数器绑定来跟踪循环的进度。然后使用带有测试表达式的\
  \ `while` 循环来检查计数器是否达到了设定值。\n\n```javascript\nFor (let number = 0; number <= 10;\
  \ number = number + 4) {\nConsole.log(number);\n}\n// → 0\n// → 4\n// 等\n```\n\n\
  括号必须在关键字后包含两个分号，第一个分号之前的部分通过描述绑定来分隔循环。另一部分是决定循环是否应该继续的语句。这里是使用 `for` 代替 `while`\
  \ 计算 2¹⁰ 的代码：\n\n```javascript\nlet result = 1;\nFor (let counter = 0; counter <\
  \ 10; counter = counter + 1) {\nResult = result * 2;\n}\nConsole.log(result);\n\
  // → 1024\n```\n\n### 跳出循环\n\n除了让循环条件为假之外，还有其他方法结束循环。`break` 可以影响跳出限制循环。如果第一个数字既大于等于\
  \ 20 且能被 7 整除，`break` 语句执行此程序。\n\n```javascript\nFor (let current = 20; current\
  \ = current + 1) {\nIf (current % 7 == 0) {\nConsole.log(current);\nbreak;\n}\n\
  // → 21\n```\n\n`%` 运算符用于检查一个数字是否能被另一个数字除。如果它可以被除除，那么余数为零。例如 for 不会在循环结束时进行检查，这意味着在内部的\
  \ `break` 语句之前，循环将是无限的且永远不会停止。\n\n### 简洁更新\n\n当你在循环中时，程序会定期更新绑定以根据其之前的值存储一个值。\n\n\
  ```javascript\ncounter = counter + 1;\n```\n\nJavascript 提供了快捷方式。\n\n```javascript\n\
  counter += 1;\n```\n\n对于 `counter += 1` 和 `counter -= 1`，这里有更短的等价写法：`counter++`\
  \ 和 `counter--`。这使我们能够减少计数。\n\n```javascript\nFor (let number = 0; number <= 12;\
  \ number += 2) {\nConsole.log(number);\n}\n```\n\n### 使用 switch 进行值分发\n\n使用 `switch`\
  \ 对值进行分发如下：\n\n```javascript\nIf (x == \"value1\") action1();\nElse if (x == \"\
  value2\") action2();\nElse if (x == \"value3\") action3();\nElse defaultaction();\n\
  ```\n\n`switch` 用于直接地表达上述形式的分发。下面是一个很好的例子：\n\n```javascript\nSwitch (prompt(\"what\
  \ is the atmosphere like?\")) {\nCase \"rainy\":\nConsole.log(\"do not forget to\
  \ come with an umbrella.\");\nbreak;\nCase \"sunny\":\nConsole.log(\"be light with\
  \ your dressing.\");\nCase \"cloudy\":\nConsole.log(\"move out.\");\nbreak;\nDefault:\n\
  Console.log(\"weather type unknown!\");\nbreak;\n}\n```\n\n### 大写规范\n\n绑定名称不允许空格，但它支持使用多个单词来定义绑定值。这里是当用不同单词命名绑定时可以利用的类型：\n\
  \n- `Fuzzylittle`\n- `Fuzzy_little`\n- `Fuzzy_little`\n\n### 注释\n\n某些原始注释不会传输你希望程序处理的文本\
  \ // 注释只出现在行尾。\n\n```javascript\nlet result = calculate(); // comment\n```\n\n```javascript\n\
  let result = calculate();\n/*\n  注释是一个\n  块结构\n*/\n它是否包含多行没有关系。\n\n```javascript\n\
  /*\n  多行\n  注释\n*/\n```\n\n## 总结\n\n现在你理解了可以通过语句来开发程序，而语句本身包含表达式。语句由表达式组成，你可以通过较小的表达式创建表达式。将语句一个接一个设置提供了从上到下的执行程序。也可以通过条件（if,\
  \ else 和 switch）和循环（while, do 和 for）语句向流引入干扰。我们还提到了绑定，它们将数据位分类到名称下，并且也可以在程序中跟踪状态。\n\
  \n练习：编写一个显示较大整数并接收两个整数的 javascript 程序。\n\n\n\n\n\n### 解决方案\n\n![00104.jpg](img/00104.jpeg)![00054.jpg](img/00054.jpeg)\n\
  \n需要重要的是，可以在字符串后面编写 `.length` 来查找它的长度。\n\n```javascript\nlet abc = \"abc\";\nConsole.log(abc.length);\
  \ // → 3\n```\n\n## 第 4 章：函数\n\n函数是 JavaScript 编程语言的起点和终，将部分程序封装在值中的概念具有许多优势。它提供了一种组织更重要程序的方法，以尽量减少重复，将名称与子程序相关联，并将程序与自身分离。函数被用于描述新的词汇。\n\
  \n### 定义函数\n\n函数是一种系统性的绑定，其中函数定义了绑定值。下面的代码指示了一个提供给定数字平方的函数：\n\n```javascript\nconst\
  \ square = function(x) {\n  return x * x;\n};\n\nConsole.log(square(12)); // → 144\n\
  ```\n\n使用以 `function` 关键字开头的表达式创建一个函数。函数由函数体和一组参数组成，当你调用函数时，参数会适应待执行的语句。函数体应该始终包含在大括号中，即使它只是单条语句。函数可以包含多个参数或零参数。在下面的示例中，`make_noise`\
  \ 不包含参数名，而 `power` 包含两个：\n\n```javascript\nconst make_noise = function() {\n  Console.log(\"\
  pling!\");\n};\n\nMake_noise(); // → pling!\n\nconst power = function(base, exponent)\
  \ {\n  let result = 1;\n  for (let count = 0; count < exponent; count++) {\n   \
  \ result *= base;\n  }\n  return result;\n};\n\nConsole.log(power(2, 10)); // →\
  \ 1024\n```\n\n某些函数可以创建值（如 `square` 和 `power`），而某些结果只产生副作用。结尾不包含表达式的 `return` 关键字将返回\
  \ undefined。\n\n### 绑定与作用域\n\n每个绑定包含一个作用域，使得绑定可见。每当你调用函数时，都会产生绑定的新实例。这在函数之间创建了分离，每个函数调用都在自己的世界中运行，易于理解。在\
  \ 2015 年之前的 JavaScript 中，用 `var` 关键字声明的函数可以在全局作用域范围内可见。它们在函数内部是不存在的。\n\n```javascript\n\
  let x = 10;\nif (true) {\n  let y = 20;\n  var z = 30;\n  Console.log(x + y + z);\
  \ // → 60\n} // y 在这里不可\nConsole.log(x + z); // → 40\n```\n\n### 嵌套作用域\n\nJavaScript\
  \ 区分全局绑定和局部绑定。你可以在其他函数和块内部创建块和函数，从而不同程度的局部性。例如，这个函数产生了嵌套组件，使得 `hummus` 内部包含另一个函数：\n\
  \n```javascript\nconst hummus = function(factor) {\n  const inner = function(amount,\
  \ unit) {\n    let amount = amount * factor;\n    if (amount > 1) {\n      unit\
  \ += \"s\";\n    }\n    Console.log(`${amount} ${unit}`);\n  };\n  inner(1, \"chickpeas\"\
  );\n  inner(0.25, \"tahini\");\n  inner(0.25, \"lemon juice\");\n  inner(1, \"garlic\"\
  );\n  inner(2, \"tablespoon olive oil\");\n  inner(0.5, \"teaspoon\");\n```\n\n\
  组件函数内部的代码可以访问外部函数的 `factor` 绑定。块内可访问的绑定集由块在文本中的位置决定。每个局部作用域都可以访问其包含的作用域，每个作用域也可以访问全局作用域。这个概念被称为词法作用域。\n\
  \n### 作为值的函数\n\n函数绑定通常为特定的程序块有一个名称。这种类型的绑定在定义后就不会改变。函数可以用于任意表达式，也可以用于将函数值保存到新的绑定中。存储存储函数的绑定是一种系统性绑定，可以分配新值，如：\n\
  \n```javascript\nlet launchmissiles = function() {\n  Missilesystem.launch(\"now\"\
  );\n};\n\nif (safe_mode) {\n  Launchmissiles = function() { /* 什么都不做 */ };\n}\n\
  ```\n\n### 声明语法\n\n生成函数绑定的方法有一种。当你在语句开头使用 `function` 关键字时，它的功能会有不同。\n\n```javascript\n\
  function square(x) {\n  return x * x;\n}\n```\n\n这条语句描述了绑定 `square` 并将其指向一个特定的函数。这种类型的函数定义由一个声明组成。\n\
  \n```javascript\nConsole.log(\"my mind tells me every time:\", future());\n\nfunction\
  \ future() {\n  return \"ill surpass bill gates\";\n}\n```\n\n### 箭头函数\n\n函数包含第三种表示法，与其他并不相同。你可以使用箭头\
  \ `=>` 作为 `function` 关键字的替代。箭头 `=>` 包含一个等号和一个大于字符。\n\n```javascript\nconst power\
  \ = (base, exponent) => {\n  let result = 1;\n  for (let count = 0; count < exponent;\
  \ count++) {\n    result *= base;\n  }\n  return result;\n};\n```\n\n如果你只有一个参数，函数体是一个单一表达式而不是块，执行相同的任务。\n\
  \n```javascript\nconst square1 = (x) => {\n  return x * x;\n};\n\nconst square2\
  \ = x => x * x;\n```\n\n当箭头函数没有参数时，参数列表变为为空的括号。当只有一个参数时，括号可以省略。\n\n```javascript\n\
  const horn = () => {\n  Console.log(\"toot\");\n};\n```\n\n### 调用栈\n\n让我们花点时间看看控制是如何通过函数的。下面是一个包含少量函数调用的简单程序：\n\
  \n```javascript\nfunction greet(who) {\n  Console.log(\"hello \" + who);\n}\n\n\
  greet(\"harry\");\nConsole.log(\"bye\");\n```\n\n`greet` 调用影响跳转到函数的开头。函数调用 `Console.log`\
  \ 完成其工作并获取控制权，然后将控制权传回函数。函数周期结束并传回调用它的地方。控制流如下：\n\n\n\n\n计算机必须收集调用序列发生的上下文，因为函数会返回到被调用的地方。当\
  \ `console.log` 完成时，它必须返回到程序的末尾。调用栈（call stack）是计算机存储这些上下文的地方。每当你调用一个函数时，当前的上下文就会保存在该栈的顶端。当函数返回时，它会移除顶部的上下文并利用该内容继续执行。\n\
  \n栈需要在计算机内存中要有空间来保存。下面的代码通过查询计算机解释了两个函数之间往返调用没有零限制。\n\n```javascript\nfunction chicken()\
  \ {\n  return egg();\n}\n\nfunction egg() {\n  return chicken();\n}\n\nconsole.log(chicken()\
  \ + \" came first.\");\n```\n// → ??\n\n### 可选参数\n\n下面的代码可以正常运行且互干扰：\n\n```javascript\n\
  function square(x) {return x * x;}\n\nconsole.log(square(4, true, \"hedgehog\"));\n\
  ```\n// → 16\n\n`square` 被描述为一个参数，但我们调用它时传入了 `three`。这是因为编程语言忽略了多余的参数，并识别第一个参数的平方。JavaScript\
  \ 对传递给函数的参数数量非常宽容。这种特性的优点是它允许用不同数量的参数调用函数：\n\n```javascript\nfunction minus(a, b)\
  \ {\n  if (b === undefined) return -a;\n  else return a - b;\n}\n\nconsole.log(minus(10));\n\
  ```\n// → -10\n\n```javascript\nconsole.log(minus(10, 5));\n```\n// → 5\n\n当在参数和表达式后编写\
  \ `=` 运算符时，该表达式的值将存储未指定的参数。如果你想传递但不产生第二个参数，那么默认值就变为二，函数表现得像 `square` 一样。\n\n```javascript\n\
  function power(base, exponent = 2) {\n  let result = 1;\n  for (let count = 0; count\
  \ < exponent; count++) {\n    result *= base;\n  }\n  return result;\n}\n\nconsole.log(power(4));\n\
  ```\n// → 16\n\n```javascript\nconsole.log(power(2, 6));\n```\n// → 64\n\n### 闭包\
  \ (Closure)\n\n将函数作为值使用的能力，与每当你调用函数时都会重新创建局部绑定的事实密切相关。下面的代码展示了这个例子；它描述了一个包装值，该函数创建一个局部绑定，然后返回一个进入并返回局部绑定的函数。\n\
  \n```javascript\nfunction wrap(n) {\n  let local = n;\n  return () => local;\n}\n\
  \nlet wrap1 = wrap(1);\nlet wrap2 = wrap(2);\nconsole.log(wrap1()); // → 1\nconsole.log(wrap2());\
  \ // → 2\n```\n\n这个概念被称为闭包。它赋予用户在限制性作用范围内引用局部绑定特定实例的能力。对我们之前的示例进行一些修改，可以变成一种开发可以任意数量累积函数的方法。\n\
  \n```javascript\nfunction multiply(factor) {\n  return number * factor;\n}\n\nlet\
  \ twice = multiply(2);\nconsole.log(twice); // // 1010\n\n### 递归\n\n函数可以调用自己，但不应该经常地调用自己，以避免栈溢出。递归函数是调用它自身的函数。递归允许以不同的风格编写函数。例如，下面的代码是\
  \ `power` 的执行实现。\n\n```javascript\nfunction power(base, exponent) {\n  if (exponent\
  \ == 0) {\n    return 1;\n  } else {\n    return base * power(base, exponent - 1);\n\
  \  }\n}\n\nconsole.log(power(2, 3));\n```\n// → 8\n\n这种执行存在一个问题：与其他循环版本相比，它更慢。使用单个循环被认为比多次调用函数成本更低。尽管这并没有让递归成为一种无效的循环方案，但某些问题用递归比用循环更容易解决。需要检查或处理多个分支的问题证明了这一点：我们从数字\
  \ 1 开始，不断加 5 或乘以 3。例如，数字 13 可以通过乘以 3 和两次加 5 得到，但我们无法获得 15。代码是递归解决方案：\n\n```javascript\n\
  function findsolution(target) {\n  function find(current, history) {\n    if (current\
  \ == target) {\n      return history;\n    } else if (current > target) {\n    \
  \  return null;\n    } else {\n      return find(current + 5, `${history} + 5`)\
  \ || find(current * 3, `${history} * 3`);\n    }\n  }\n  return find(1, \"1\");\n\
  }\n\nconsole.log(findsolution(24));\n```\n// → (((1 * 3) + 5) * 3)\n\n内部函数 `find`\
  \ 接受两个参数：当前数字 `current` 和一个记录获取该数字过程的字符串。如果找到了解决方案，它会返回一个显示通往 `target` 路径的字符串；如果没有解决方案，返回的值将是\
  \ `null`。为了实现这一点，函数执行三个动作之一。如果你的 `target` 等于 `current`，你就可以通过 `current` 得到该 `target`。\n\
  \n缩进指定调用栈的深度。\n\n\n\n\n\n在字符串表达式后写入长度决定了该特定字符串的长度。循环继续在数字字符串的开头添加 0，直到它们包含三个字符。\n\
  \n这里有一个更好的尝试：\n\n```javascript\nfunction printzeraddedwithlabel(number, label) {\n\
  \  let numberstring = string(number);\n  while (numberstring.length < 3) {\n   \
  \ numberstring = \"0\" + numberstring;\n  }\n  Console.log(`${numberstring} ${label}`);\n\
  }\n\nfunction printfarminventory(cows, chickens, pigs) {\n  printzeraddedwithlabel(cows,\
  \ \"cows\");\n  printzeraddedwithlabel(chickens, \"chickens\");\n  printzeraddedwithlabel(pigs,\
  \ \"pigs\");\n}\n\nprintfarminventory(7, 11, 3);\n```\n\n与其提取程序中重复的部分，不如通过以下步骤提取单个概念：\n\
  \n```javascript\nfunction zeropad(number, width) {\n  let string = string(number);\n\
  \  while (string.length < width) {\n    String = \"0\" + string;\n  }\n  return\
  \ string;\n}\n\nfunction printfarminventory(cows, chickens, pigs) {\n  Console.log(`${zeropad(cows,\
  \ 3)} cows`);\n  Console.log(`${zeropad(chickens, 3)} chickens`);\n  Console.log(`${zeropad(pigs,\
  \ 3)} pigs`);\n}\n\nprintfarminventory(7, 16, 3);\n```\n\n函数也可以用于打印对齐的数字表格。\n\n\
  ### 函数与副作用\n\n函数可以包含副作用并返回值。与产生副作用的函数相比，它们产生的值可以更容易以新的方式进行整合。纯函数是一个唯一的值制造函数，它不依赖于任何代码副作用。例如，它不会识别具有可变值的全局绑定。它还由由一个可调用属性组成，具有相同的参数并产生相等的值。\n\
  \n## 总结\n\n在本章中，你现在理解了如何编写函数。通过了如何编写 `function` 关键字以及何时使用表达式，你现在可以构建一个函数值。当你将函数作为状态时，它可以设置一个绑定并将函数命名为它的值。你还可以使用箭头函数来构建函数。\n\
  \n```javascript\n// 定义 f 以持有函数值，\nconst f = function(a) {\n  Console.log(a + 2);\n\
  };\n\n// 声明 g 为函数\nfunction g(a, b) {\n  return a * b * 3.5;\n}\n\n// 一个更简洁的函数值，\n\
  let h = a => a % 3;\n```\n\n理解函数的主要视角是了解作用域。每个块都会创建一个新的作用域。在特定作用域设置的参数和绑定是局部的，从外部不可见。使用\
  \ `var` 设置的绑定作用不同，它们会导致全局作用域。将程序执行的任务区分不同的函数是很重要的。你不需要经常重复自己，函数可以通过将代码分类为执行特定操作的片段来安排程序。\n\
  \n### 练习\n\n编写一个 javascript 程序来判断一个数字是否为偶数。\n\n### 解决方案\n\n![00171.jpg](img/00171.jpeg)![00125.jpg](img/00125.jpeg)![00091.jpg](img/00091.jpeg)\n\
  \n## 第 5 章：数据结构：对象和数组\n\n数据布局从布尔值、字符串和数字片段发展而来。若干类型的信息使用多个块。对象允许用户将值与其他对象放在一起以开发更复杂的布局。在本章中，你将理解解决手头实际问题的概念。\n\
  \n### 数据集\n\n如果你想处理大量的数字数据，你必须在机器内存中表示数字数据。例如，你需要表示一组数字，如 2, 3, 5, 7 和 11。现在让我们充分利用字符串，因为字符串可以包含大量数据。我们将使用\
  \ 2 3 5 7 11 作为表示。javascript 编程语言提供了一种用于保存值序列唯一数据类型，称为数组。在括号内将数组写为值的列表。\n\n```javascript\n\
  let numbers = [2, 3, 5, 7, 11];\nConsole.log(numbers[2]); // 5\nConsole.log(numbers[0]);\
  \ // 2\nConsole.log(numbers[2 - 1]); // 7\n```\n\n用于获取数组内元素的符号也使用中括号。当你开始计算数组中的元素时，是从\
  \ 0 开始而不是 1。\n\n之前的章节具有如 `length`（计算数组长度）和 `max`（最大值）等属性。所有不包含值的属性都是 `undefined`。如果你访问不存在的属性，结果将是\
  \ `undefined`。\n\n### 数组属性\n\n评估属性的两种主要方法是 `.` 和 `[]`。如果你想评估如 `2` 或 `john doe` 的属性名，请使用括号：`value[2]`\
  \ 或 `value[\"john doe\"]`。\n\n点符号法适用于有效的属性名。\n\n```javascript\nlet array = \"doh\"\
  ;\nConsole.log(array.length); // 3\n```\n\n（注：由于提供的原始文本包含大量重复和乱码内容，上述翻译已提取核心逻辑并修复了格式优化。）\n\
  \n\n\n\n\n每个字符串包含一个 `toUpperCase` 属性。当你调用此属性时，它会返回字符串的副本，其中所有的包含字母都转换成大写字母。尽管 `toUpperCase`\
  \ 不接受参数，但该函数可以评估字符串 \"doh\"，这正是我们上面调用的值的属性。由函数组成的属性被称为方法。下面的示例说明了两个可以影响数组的方法。\n\n\
  ```\nlet sequence = [1, 2, 3];\nsequence.push(4);\nsequence.push(5);\nconsole.log(sequence);\n\
  // → [1, 2, 3, 4, 5]\nconsole.log(sequence.pop());\n// → 5\nconsole.log(sequence);\n\
  // → [1, 2, 3, 4]\n```\n\n`push` 方法用于将一个值添加到数组的末尾，而 `pop` 方法的操作则完全相反。它移除数组中的最后一个值并将其返回。这些是栈（stack）操作的通用术语。栈是一种数据结构，允许用户按顺序推入值并在相反的方向弹出值，以便添加的值最先移除。\n\
  \n### 对象\n\n你可以将一组日志条目表示为数组，尽管每个字符串条目都需要保存一个活动列表，以及一个指定 jacques 是否变成了松鼠的布尔值。我们将这些分组为一个单个值，并将分组后的值放置在日志条目的数组中。属性的任意集合是类型\
  \ `object` 的值。我们将使用大括号作为表达式来开发一个对象。\n\n```javascript\nlet day1 = {\n  squirrel:\
  \ false,\n  events: [\"work\", \"touched tree,\", \"pizza\", \"running\"]\n};\n\
  console.log(day1.squirrel);\n// → false\nconsole.log(day1.wolf);\n// → undefined\n\
  day1.wolf = false;\nconsole.log(day1.wolf);\n// → false\n```\n\n大括号包含一个由逗号分隔的属性列表。每个属性包含一个名称、一个值和一个冒号。当你跨行编写对象时，请确保缩进良好，因为这可以提高可读性。无效的绑定名称属性或有效的数字应该加上引号。\n\
  \n```javascript\nlet descriptions = {\n  Work: \"went to work,\",\n  \"touched tree,\"\
  : \"touched a tree.\"\n};\n```\n\n你可以在 JavaScript 中以两种不同的方式使用大括号。它用于语句的开头，也可以用于开始一个语句块。你可以使用\
  \ `=` 运算符为属性指定值。它会占据属性值的位置，如果不存在，则会创建一个新的。`delete` 运算符是一个元运算符，用于删除对象的属性名。下面是一个示例：\n\
  \n```javascript\nlet object = {left: 1, right: 2};\nconsole.log(object.left);\n\
  // → 1\ndelete object.left;\nconsole.log(object.left);\n// → undefined\nconsole.log(\"\
  left\" in object);\n// → false\nconsole.log(\"right\" in object);\n// → true\n```\n\
  \n二元操作判断对象或字符串是否包含某个属性。指定属性和删除属性之间的主要区别在于，对象包含属性，而删除后不再拥有该属性，因此返回 false。要确定对象中包含的属性，并返回一个包含对象属性名的字符串数组。\n\
  \n```\nconsole.log(object.key({x: 0, y: 0, c: 2}));\n// → [\"x\", \"y\", \"c\"]\n\
  ```\n\n`object.assign` 函数用于将属性从一个对象复制到另一个对象。\n\n```\nlet cta = {a: 1, b: 2};\nobject.assign(cta,\
  \ {b: 3, c: 4});\nconsole.log(cta);\n// {a: 1, b: 3, c: 4}\n```\n\n数组是一种用于保存连续事物的唯一对象。当你访问\
  \ `[]` 的类型时，它提供 \"object.\"。下面的示例代表 jacques 存储为对象数组的日志。\n\n```\nlet journal = [\n\
  \  {events: [\"work\", \"touched tree,\", \"pizza\", \"running\", \"television\"\
  ], squirrel: false},\n  {events: [\"work\", \"ice cream\", \"caiflower\", \"lasagna\"\
  , \"touched tree,\", \"brushed teeth\"], squirrel: false},\n  {events: [\"weekend\"\
  , \"cycling\", \"break\", \"peanuts\", \"beer\"], squirrel: true},\n];\n/* 等此类推...\
  \ */\n```\n\n### 可变性\n\n我们讨论了不同的值，如布尔值、字符串和数字，它们的值很难改变，尽管可以通过组合来从它们中获取新值。对象与值不同，它允许更改属性；它们可以在不同的时间为单个对象值创建不同的内容。当有两个数字\
  \ 120 和 120 时，它们是相同的，区别在于两个独立的对象可以拥有相同的属性。检查以下代码：\n\n```javascript\nlet object1\
  \ = {value: 10};\nlet object2 = object1;\nlet object3 = {value: 10};\nconsole.log(object1\
  \ === object2);\n// → true\nconsole.log(object1 === object3);\n// → false\nobject1.value\
  \ = 15;\nconsole.log(object2.value);\n// → 15\nconsole.log(object3.value);\n// →\
  \ 10\n```\n\nobject1 的属性是相同的，但常量绑定不能更改。常量绑定指向同一个对象，但对象可以改变。\n\n```javascript\nconst\
  \ score = {visitors: 0};\nconsole.log(score.visitors);\n// → 0\nscore.visitors =\
  \ 1;\nconsole.log(score.visitors);\n// → 1\n```\n\n`==` 运算符用于区分对象；如果对象包含相同的值，则返回\
  \ true，但引用多个对象将返回 false，即使它们的属性相似的。\n\n\n\n\n相关性是对分析变量之间脆弱性的一种评估。它们的值范围从 -1 到 1。不相关的变量被称为零相关。相关性为\
  \ 1 表示两者相关。负相关意味着变量之间相关，但方向相反；其中一个为真，另一个即为假。要计算两个布尔值之间相关性的评估，请使用 Phi 系数（phi coefficient，φ）。该公式的输入是一个频率表，记录了若干种变量组合出现的次数。公式的输出将是\
  \ -1 到 1 之间的数字。这是对相关性的最佳定义。\n\n让我们以“吃披萨”这一事件为例，并将其插入频率表中，其中每个数字代表总次数，即我们在测量中使用的组合数。我们将表格命名为\
  \ `n`，并使用以下公式计算 `φ`：\n\n```\nΦ = N11n00 − n10n01 / √(N1•n0•n•1n•0)\n```\n\n符号 `n01`\
  \ 表示第一个变量变为假（`0`）、第二个变量变为真（`1`）的测量次数。在披萨表中，`n01` 为 9。\n\n值 `n1•` 表示所有第一个变量变为真的测量总和，在示例表中为\
  \ 5。同样，`n•0` 表示第二个变量变为假的测量数量。\n\n在披萨表中，除法线上方为 `1×76−4×9 = 40`，下方部分将是 `5×85×10×80`\
  \ 的平方根，即 `√340000`。结果将是 `φ ≈ 0.069`，非常微小。因此，吃披萨对转换没有影响。\n\n### 计算相关性\n\nJavascript\
  \ 允许表示一个二阶表格，使用四元素数组 `[76, 9, 4, 1]`。其他表示形式还包括包含两个双元素的数组 `[[76, 9], [4, 1]]`，或者包含如\
  \ \"11\" 和 \"01\" 等属性名称的对象，以及扁平数组，这些都会产生访问椅子短语的表达式。我们将数组的索引解释为二位二进制数，其中高位代表松鼠变量，而低位代表事件表。例如，二进制数\
  \ 10 指的是“雅克变成松鼠”但事件未出现的情况。它发生了四次，二进制在十进制中是 2，该数字存储在数组的索引 2 。此函数从数组计算 φ：\n\n```javascript\n\
  function phi(chair) {\n  return (chair[3] * chair[0] - chair[2] * chair[1]) / Math.sqrt((chair[2]\
  \ + chair[3]) * (chair[1] + chair[3]) * (chair[0] + chair[2]));\n}\n```\n等待，提示文本中断了。根据上下文：\n\
  \n表格需要两个字段来获取如 `n1•` 的字段，因为总行数和列数间接存储在我们的布局中。如果你想为特定事件提取二阶表格，必须遍历所有条目，并计算事件发生在松鼠转换的次数。\n\
  \n```javascript\nfunction table_for(event, journal) {\n  let table = [0, 0, 0, 0];\n\
  \  for (let i = 0; i < journal.length; i++) {\n    let entry = journal[i], index\
  \ = 0;\n    if (entry.events.includes(event)) index += 1;\n    if (entry.squirrel)\
  \ index += 2;\n    table[index] += 1;\n  }\n  return table;\n}\n```\n`console.log(table_for(\"\
  pizza\", journal)); // → [76, 9, 4, 1]` 数组包含一个 `include` 方法，用于检查数组中是否存在某个值。该函数使用此方法来判断事件名称是否插入了特定日的事件列表中。\n\
  \n### 数组循环\n\n`table_for` 函数包含如下的循环：\n\n```javascript\nfor (let i = 0; i < journal.length;\
  \ i++) {\n  let entry = journal[i];\n  // 对 entry 执行某些操作\n}\n```\n这种类型的循环用于高级 javascript。在现代\
  \ javascript 中编写这种循环的方式如下：\n\n```javascript\nfor (let entry of journal) {\n  console.log(`${entry.events.length}\
  \ events.`);\n}\n```\n使用这样的循环，循环将跨越 `of` 之后指定的值的元素进行。这种循环用于字符串和其他数据布局。\n\n### 最终分析\n\
  \n为数据集中发生的每种类型的事件都计算相关性。如果你想实现这一点，请搜索每种类型的事件。\n\n```javascript\nfunction journalevents(journal)\
  \ {\n  let events = [];\n  for (let entry of journal) {\n    for (let event of entry.events)\
  \ {\n      if (!events.includes(event)) {\n        events.push(event);\n      }\n\
  \    }\n  }\n  return events;\n}\n```\n`console.log(journalevents(journal)); //\
  \ → [\"carrot\", \"exercise\", \"bread\"]` 通过遍历每个事件并对不在数组中的事件进行加法，此函数收集了所有类型的事件。许多相关性似乎接近于零。吃胡萝卜或布丁并没有激活松鼠熵。它在周三（wends）发生。使用以下代码所有相关性。\n\
  \n```javascript\nfor (let event of journalevents(journal)) {\n  console.log(event\
  \ + \":\", table_for(event, journal));\n}\n```\n// → carrot: 0.01409709\n// → exercise:\
  \ 0.06859943\n// → wend: 0.13719868\n// → bread: -0.07575419\n// → pudding: -0.06482037\n\
  // 等此类推...\n\n让我们过滤结果，只显示大于 0.1 或小于 -0.1 的相关性。\n\n```javascript\nfor (let event\
  \ of journalevents(journal)) {\n  let correlation = table_for(event, journal);\n\
  \  if (correlation > 0.1 || correlation < -0.1) {\n    console.log(event + \":\"\
  , correlation);\n  }\n}\n```\n// → wend: 0.13719868\n// → brushed teeth: -0.380521953\n\
  // → candy: 0.129640747\n// → work: -0.13719868\n// → spaghetti: 0.24253525\n//\
  \ → reading: 0.11062805\n// → peanuts: 0.590267982\n\n在相关性因子中，一个比另一个强。吃花生有很大概率变成松鼠，因此刷牙有显著的负面影响。这里有一点发现：\n\
  \n```javascript\nfor (let entry of journal) {\n  if (entry.events.includes(\"peanuts\"\
  ) &&\n!entry.events.includes(\"brushed teeth\")) {\n    entry.events.push(\"peanut\
  \ teeth\");\n  }\n}\n```\n`console.log(table_for(\"peanut teeth\", journal)); //\
  \ → 1\n\n### 进一步的数组学\n\n这里有你应该了解的更多与相关的概念。我们从使用数组的一些实用方法开始。在数组开头添加和移除的方法被称为 `unshift`\
  \ 和 `shift`。\n\n```javascript\nlet todolist = [];\nfunction remember(task) {\n \
  \ todolist.push(task);\n}\n\nfunction getTask() {\n  return todolist.shift();\n\
  }\n\nfunction rememberUrgent(task) {\n\n\n\n\n```javascript\nTodolist.unshift(task);\n\
  \n}\n```\n\n上述程序组织了一个任务链。你可以通过调用 `remember(\"grieves\")` 将任务添加到队列的末尾，当你想完成某项任务时，调用\
  \ `getttask()` 从队列中获取（并移除）项。如果你想搜索特定的值，数组提供了 `indexOf` 方法。`find` 方法从从头到尾遍历数组，并返回所请求值的索引（`index`），如果找到了，则返回该索引；如果没有找到，则返回\
  \ -1。若要从头到尾搜索，请使用 `lastindex` 方法。\n\n```javascript\nConsole.log([1, 2, 3, 2, 4].indexOf(3));\n\
  // → 1\n\nConsole.log([1, 2, 3, 2, 4].lastindex(3));\n// → 3\n```\n\n`indexOf` 和\
  \ `lastindex` 接受一个可选参数，指定搜索开始的位置。另一个很好的方法是 `slice`，该方法指定索引的起始和结束，并返回包含三个元素的数组。起始位置是包含的，而结束位置是不包含的。\n\
  \n```javascript\nConsole.log([0, 1, 2, 3, 5].slice(2, 4));\n// → [2, 3]\n\nConsole.log([0,\
  \ 1, 2, 3, 5].slice(2));\n// → [2, 3, 5]\n```\n\n如果未指定结束索引，`slice` 将取起始索引之后的所有元素。你可以使用\
  \ `concat` 方法将数组拼接在一起以生成新数组。下面的示例展示了 `concat` 和 `slice` 的用法。\n\n```javascript\n\
  function remove(arrays, index) {\n  return array.slice(0, index).concat(arrays.slice(index\
  \ + 1));\n}\n\nConsole.log(remove([\"a\", \"k\", \"c\", \"f\", \"e,], 2));\n// →\
  \ [\"a\", \"k\", \"f\", \"e\"]\n```\n\n### 字符串及其属性\n\n在字符串值章节中，我们讨论了 `length` 和\
  \ `toupper`，但如果你想添加新属性，它是不会持久的。\n\n```javascript\nlet kim = \"kim\";\nKim.age =\
  \ 88;\nConsole.log(kim.age);\n// → undefined\n```\n\n所有字符串值都包含一些方法。其中一些 `slice`\
  \ 和 `indexOf` 方法在外观和名称上与数组方法相似。\n\n```javascript\nConsole.log(\"coconuts\".slice(4,\
  \ 7));\n// → nut\n\nConsole.log(\"coconut\".indexOf(\"u\"));\n// → 5\n```\n\n字符串的\
  \ `indexOf` 可以查找包含多个字符的字符串，而对应的数组方法搜索的是单个元素。\n\n```javascript\nConsole.log(\"one,\
  \ two three,\".indexOf(\"ee\"));\n// → 11\n```\n\n`trim` 方法可以消除字符串开头和结尾的空白字符。\n\n\
  ```javascript\nConsole.log(\"  okay  \\n  \".trim());\n// → okay\n```\n\n`zeropad`\
  \ 函数也可以称为 `padstart`，它接受首选的填充字符和长度作为参数。\n\n```javascript\nConsole.log(string(6).padstart(3,\
  \ \"0\"));\n// → 006\n```\n\n你可以使用 `split` 在另一个字符串出现的地方将字符串拆分，然后使用 `join` 将它们连接在一起。\n\
  \n```javascript\nlet sentence = \"secretarybirds specialize in stomping\";\nlet\
  \ words = sentence.split(\"  \");\nConsole.log(words);\n// → [\"secretarybirds\"\
  , \"specialize,\", \"in\", \"stomping\"]\n\nConsole.log(words.join(\".  \"));\n\
  // → secretarybirds. specialize,. in. stomping\n```\n\n你可以使用 `repeat` 方法重复字符串，它会生成一个包含多个原始字符串副本的新字符串。\n\
  \n```javascript\nConsole.log(\"la\".repeat(3));\n// → lalala\n```\n\n如果你想访问字符串中的单个字符，请看下文：\n\
  \n```javascript\nlet string = \"abc\";\nConsole.log(string.length);\n// → 3\n\n\
  Console.log(string[1]);\n// → b\n```\n\n### 剩余参数\n\n函数接收任意数量参数很重要。如果你想写这样的函数，在函数的最后一个参数之前添加三个点。\n\
  \n```javascript\nfunction max (...numbers) {\n  let result = -infinity;\n  for (let\
  \ number of numbers) {\n    if (number > result) result = number;\n  }\n  return\
  \ result;\n}\n\nConsole.log(max(4, 1, 9, -2));\n// → 9\n```\n\n当你调用函数时，剩余的参数属于一个包含剩余参数的数组。你也可以利用三个点来在数组内调用函数。\n\
  \n```javascript\nlet numbers = [5, 7];\nConsole.log(max(...numbers));\n// → 7\n\
  ```\n\n扩展运算符可以将数组转换为新数组。\n\n```javascript\nlet words = [\"will\", \"fully\"];\n\
  Console.log(...words);\n// → will fully\n```\n\n`math` 对象用于整理大量值，它返回一个不带全局绑定的值。\n\
  \n```javascript\nfunction point(radius) {\n  let angle = math.random() * 2 * math.pi;\n\
  \  return {\n    x: radius * math.cos(angle),\n    y: radius * math.sin(angle)\n\
  \  };\n}\n\nConsole.log(point(2));\n// → {x: -0.67, y: 0.96}\n```\n\n`random` 方法返回一个零到一之间的值。\n\
  \n```javascript\nConsole.log(math.random());\n// → 0.3699...\n```\n\n`floor` 方法将值向下取整到最近的整数。\n\
  \n```javascript\nConsole.log(floor(math.random() * 10));\n// → 3\n```\n\n`ceil`\
  \ 方法将值向上取整到最近的整数。\n\n```javascript\nConsole.log(ceil(math.random() * 10));\n// →\
  \ 7\n```\n\n`round` 方法将值四舍五入到最近的整数。\n\n```javascript\nConsole.log(round(math.random()\
  \ * 10));\n// → 5\n```\n\n`pow` 方法返回第一个参数的第二个参数幂。\n\n```javascript\nConsole.log(pow(2,\
  \ 3));\n// → 8\n```\n\n`sqrt` 方法返回数字的平方根。\n\n```javascript\nConsole.log(sqrt(16));\n\
  // → 4\n```\n\n`abs` 方法返回数字的绝对值。\n\n```javascript\nConsole.log(abs(-5));\n// → 5\n\
  ```\n\n`min` 方法返回多个数值中的最小值。\n\n```javascript\nConsole.log(min(10, 5, 8));\n// →\
