  `tan` 方法返回弧角的正切值。\n\n```javascript\nConsole.log(tan(PI/4));\n// → 1\n```\n\n`sin`\
  \ 方法返回弧角的正弦值。\n\n```javascript\nConsole.log(sin(0));\n// → 0\n```\n\n`cos` 方法返回弧角的余弦值。\n\
  \n```javascript\nConsole.log(cos(0));\n// → 1\n```\n\n`atan` 方法返回弧角的正切值（此处原文可能误为\
