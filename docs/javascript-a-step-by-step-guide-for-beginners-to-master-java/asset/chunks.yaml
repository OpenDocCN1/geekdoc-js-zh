    ## 第 3 章：程序结构


    我们将开始 javascript 语言在句子和名词之外的扩展。


    #### 表达式与状态


    一个产生值的代码块被称为表达式。一个值精确写为 `22` 或 `psychoanalysis` 是一个表达式。二进制运算符内部的表达式也是一个表达式。一个表达式像人类语言一样容纳其他表达式。它允许我们开发描述任意复杂的表达式。当一个表达式可以比作句子时，javascript
    状态将完成该句子。


    ### 绑定


    Javascript 使用变量绑定来持有值，例如：


    ```

    Get money = 5 * 5;

    ```

