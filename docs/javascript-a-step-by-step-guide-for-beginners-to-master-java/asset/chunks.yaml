  trans: "\n无论超时或传入请求等事件如何发生，javascript 环境每次一次只运行一个程序。当无事可做时，循环就会停止。但随着事件到来，它们会被附加到队列中，它们的代码会一个接一个地执行。因为两件事不会同时运行，运行缓慢的代码可能会阻塞其他事件的处理。下面的示例设置了一个超时，但它一直持续到超时固定的时间点之后，导致超时推后。\n\
    \n```javascript\nlet start = date.now();\n\nsetTimeout(() => {\n  console.log(\"\
    timeout ran at\", date.now() - start);\n}, 20);\n\nwhile (date.now() < start +\
    \ 50) {}\n\nconsole.log(\"wasted time until\", date.now() - start);\n\n// → wasted\
    \ time until 50\n// → timeout ran at 55\n```\n\nPromises 的解析或拒绝被视为新事件。即使一个 promise\
    \ 已经解析完成，等待它也会让你的回调函数在现有脚本完成后运行，而不是立即执行。\n\n```javascript\nPromise.resolve(\"\
    done,\").then(console.log);\n\nconsole.log(\"me first!\");\n\n// → me, first!\n\
    // → done,\n```\n\n### 异步错误\n\n当你同步运行程序时，除了程序本身解决的问题之外，没有发生特定的转换。但当你运行异步程序时，这是另一种情况。它们在执行期间可能包含其他代码可以利用的间隔。下面是一个示例。我们乌鸦最喜欢的活动之一是统计每年村子里孵化的幼鸟数量。巢会将这些计数存储在它们的存储球中。下面的代码尝试统计特定年份每个巢的计数：\n\
    \n```javascript\nfunction anystorage(nest, source, name) {\n  if (source == nest.names)\
    \ return storage(nest, name);\n  else return route.request(nest, source, \"storage,\"\
    , name);\n}\n\nasync function chicks(nest, year) {\n  let list = \"\";\n  await\
    \ promise.all(network(nest).map(async name => {\n    list += `${name}: ${\nawait\
    \ anystorage(nest, names, `chicks in ${year}`)\n    }\\n`;\n  }));\n  return list;\n\
    }\n```\n\n`async name =>` 显示通过在它们前面加上 `async` 单词，箭头函数也变成了异步的。该代码跨越巢的集合绘制异步箭头函数，构建一个\
    \ promise 数组，并利用 `promise.all` 在返回它们创建的列表之前等待。但它是坏的。它只会返回单行输出，列出响应最慢的巢。你知道为什么吗？\n\
    \n问题出在 `+=` 运算符上，它在语句开始执行时获取 list 的当前值，并在等待结束时将 list 绑定设置为加上字符串后的值。但在语句的开始和结束之间存在一个异步间隔。`map`\
    \ 表达式是在你向列表添加任何内容之前第一个运行的，因此每个 `+=` 运算符都从空字符串开始，并在检索完成时结束。通常计算新值是一个错误过程，而不是对现有值的转换。\n\
    \n```javascript\nasync function chicks(nest, year) {\n  let lines = network(nest).map(async\
    \ name => {\n    return name + \": \" +\nawait anystorage(nest, names, `chicks\
    \ in ${year}`);\n  });\n  return (await promise.all(lines)).join(\"\\n\");\n}\n\
    ```\n\n在使用 `await` 时出错是是不可避免的，你应该知道代码中哪些地方存在间隔。\n\n### 总结\n\n我们在这一章中学习了关于异步编程的所有知识。异步编程允许等待长时间运行的操作，而不会给程序带来问题。环境通常通过回调调用操作来使用这种编程风格。我们还提到了事件循环。事件循环为这些回调创建了一个计划，让它们一个接一个地调用以避免重叠。\n\
    \n### 练习\n\n编写一个 javascript 程序将异步函数转换为返回 promise 的函数。\n\n### 答案\n\n```javascript\n\
    Define(x, 10),\nIf(>(x, 5),\nPrint(\"large,\n\n```\n\n### 第 13 章：解析\n\n开发自己的编程语言相对容易且非常有趣。这一章将教你如何构建自己的语言。我们将创建一个名为\
    \ `egg` 的编程语言。一个很小的语言仍然强大到可以表达任何计算。它允许确定函数。\n\n#### 解析\n\n编程语言中显著的部分是记法或语法。解析器是一个读取文本并提供反映文本中程序布局的数据结构布局的程序。如果文本无法创建有效程序，解析器将指示错误。我们的语言将包含精确且统一的语法。`egg`\
    \ 中包含的所有内容都是表达式。表达式可以是绑定名、数字或应用。利用应用进行函数调用，以及像 `if` 或 `while` 这样的结构。\n\n为了保持解析器的简单，`egg`\
    \ 内部字符串不支持反斜线转义。字符串是双引号包围的非引号字符序列。名称绑定可以包含任何非空格且在语法中没有特殊含义的字符。通过在表达式后放置括号并在括号内放入逗号隔开的任意数量参数，在\
