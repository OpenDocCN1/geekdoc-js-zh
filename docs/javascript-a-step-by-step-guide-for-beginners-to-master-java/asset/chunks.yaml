    \ source, name) {\n  if (source == nest.names) return storage(nest, name);\n \
    \ else return route.request(nest, source, \"storage,\", name);\n}\n\nasync function\
    \ chicks(nest, year) {\n  let list = \"\";\n  await promise.all(network(nest).map(async\
    \ name => {\n    list += `${name}: ${\nawait anystorage(nest, names, `chicks in\
    \ ${year}`)\n    }\\n`;\n  }));\n  return list;\n}\n```\n\nThe `async name =>`\
    \ displays that arrow functions are also made async by placing the word `async`\
    \ in front of them. The code draws the async arrow function across the set of\
