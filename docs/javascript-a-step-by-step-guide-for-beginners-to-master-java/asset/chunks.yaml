    \ => true, () => false);\n  );\n  return promise.all(requests).then(result =>\
    \ nest.neighbors.filter((_, i) => result[i]));\n}\n```\n\n### Network flooding\n\
    \nNests can communicate with their neighbors only and that greatly affects the\
