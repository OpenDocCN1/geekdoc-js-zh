  trans: "\n\nJavascript 类是带有原型和属性的构造函数。以下是一个示例：\n\n```javascript\nClass rabbit {\n\
    \  Constructor(type) {\n    this.type = type;\n  }\n\n  Speak(line) {\n    console.log(`the\
    \ ${this.type} rabbit says '${line}'`);\n  }\n}\n```\n\nlet killerabbit = new\
    \ rabbit(\"killer\");\nlet blackrabbit = new rabbit(\"black\");\n\n`class` 关键字以\
    \ `class` 声明开始，它允许你在特定位置描述一个构造函数和一组方法。`class` 声明允许将包含函数的方法和属性捕获并包含在原型中。当你使用一个表达式时，它并不是描述一个绑定，而是将构造函数作为一个值。你可以在表达式中省略类名。\n\
    \n```javascript\nlet object = new class {getword() { return \"hello\"; } };\n\n\
    console.log(object.getword());\n// → he,llo\n```\n\n### 覆盖派生属性\n\n当一个属性被添加到对象时（无论在原型中是否可用），该属性都会被加到对象中。如果原型中存在一个同名的已赋值属性，它不会影响该对象。\n\
    \n```javascript\nRabbit.prototype.teeth = \"small\";\n\nconsole.log(killerabbit.teeth);\n\
    // → small\n\nkillerabbit.teeth = \"long, sharp, and bloody\";\n\nconsole.log(killerabbit.teeth);\n\
    // → long, sharp, and bloody\n\nconsole.log(blackrabbit.teeth);\n// → small\n\n\
    console.log(rabbit.prototype.teeth);\n// → small\n```\n\n覆盖属性用于改进标准函数和数组原型提供一个独立的\
    \ `toString` 方法。\n\n```javascript\nconsole.log(array.prototype.toString == Object.prototype.toString);\n\
    // → false,\n\nconsole.log([1, 3].toString());\n// → 1,3\n```\n\n在数组上调用 `toString`\
    \ 存储的结果的结果类似于对它调用 `join(\",\")` 的结果。它会在数组包含的值之间放置一个逗号。如果你对数组调用 `object.prototype.toString`，它会提供一个独立的字符串。\n\
    \n```javascript\nconsole.log(object.prototype.toString.call([1, 3]));\n// → [object\
    \ array]\n```\n\n### 映射 (Maps)\n\nMap 是一种将值与其他值连接的数据布局。如果你想将名称映射到年龄，可以这样写代码：\n\
    \n```javascript\nlet ages = {\n  Boris: 39,\n  Liang: 22,\n  Júlia: 62\n};\n\n\
    console.log(`julia is ${ages[\"julia\"]}`);\n// → julia is 62\n\nconsole.log(\"\
    is jack's age, known?\", \"jack\" in ages);\n// → is jack's age, known? false,\n\
    \nconsole.log(\"is tostring's age, known?\", \"tstring\" in ages);\n// → is tostring's\
    \ age, known? true,\n```\n\n对象的属性名应该是字符串。如果你想要一个键不会被转换为字符串的映射，不要使用 `object` 作为映射。Javascript\
    \ 包含一个名为 `map` 的类。它保存映射关系并允许不同类型的键。\n\n```javascript\nlet ages = new map();\n\n\
    ages.set(\"boris\", 39);\nages.set(\"liang\", 22);\nages.set(\"júlia\", 62);\n\
    \nconsole.log(`jlia is ${ages.get(\"júlia\")}`);\n// → julia is 62\n\nconsole.log(\"\
    is jack's age, known?\", ages.has(\"jack\"));\n// → is jack's age, known? false,\n\
    \nconsole.log(ages.has(\"tstring\"));\n// → false,\n```\n\n`get`、`set` 和 `has`\
    \ 方法是 map 对象布局体。`object.keys` 只返回对象的键。你可以使用 `has` 方法作为选项。\n\n```javascript\nconsole.log({x:\
    \ 1}.has(\"x\")); // → true,\nconsole.log({x: 1}.has(\"toString\")); // false,\n\
    ```\n\n### 多态\n\n当在对象上调用字符串函数时，会调用该对象上的 `toString` 方法来构建一个有意义的字符串。你可以定义自己的 `toString`\
    \ 版本，以便它们可以构建包含比 \"[object object]\"更多数据的字符串。以下是一个插图：\n\n```javascript\nRabbit.prototype.toString\
    \ = function() {\n  return `a ${this.type} rabbit`;\n};\n\nconsole.log(blackrabbit);\n\
    // → a black rabbit\n```\n\nSymbol 是通过 `symbol` 函数构建的唯一值，无法构建两次。\n\n```javascript\n\
    let sym = symbol(\"name\");\n\nconsole.log(sym == symbol(\"name\")); // false,\n\
    \nRabbit.prototype[sym] = 55;\n\nconsole.log(blackrabbit[sym]); // → 55\n```\n\
    \n传递给 `symbol` 的字符串在将其转换为字符串时会被附加。它们是作为属性名的函数。\n\n```javascript\nconst toString\
    \ = symbol(\"toString\");\nArray.prototype[toString] = function() {\n  return\
    \ `${this.length} cm of yarn`;\n};\n\nconsole.log([1, 2].toString()); // 1,2\n\
    console.log([1, 2][toString]()); // 2 cm of yarn\n```\n\n迭代器接口\n\n传递给 `for/of`\
    \ 循环的状态对象是迭代的。这意味着当属性被调用时，它包含一个带有 `symbol.iterator` 的命名方法。该方法返回一个产生第二个布局的对象，它包含一个\
    \ `next` 方法，用于发送下一个结果。结果是一个带有 `value` 属性的对象。查看这个布局：\n\n```javascript\nlet iterator\
    \ = \"ok\"[symbol.iterator]();\n\nconsole.log(iterator.next()); // {value: \"\
    o\", done: false}\n\nconsole.log(iterator.next()); // {value: \"k\", done: false}\n\
    \nconsole.log(iterator.next()); // {value: undefined, done: true}\n```\n\n让我们实现一个迭代数据结构，我们将构建一个\
    \ `matrix` 类，作为一个二维数组：\n\n```javascript\nclass matrix {\n  Constructor(width,\
    \ height, element = (x, y) => undefined) {\n    this.width = width;\n    this.height\
    \ = height;\n    this.content = [];\n    for (let y = 0; y < height; y++) {\n\
    \      for (let x = 0; x < width; x++) {\n        this.content[y * width + x]\
    \ = element(x, y);\n      }\n    }\n  }\n\n  get(x, y) {\n    return this.content[y\
    \ * width + x];\n  }\n\n  set(x, y, value) {\n    this.content[y * width + x]\
    \ = value;\n  }\n}\n```\n\n类的内容保在一个包含宽度 × 高度元素的独立数组中。这些元素按行保存。构造函数获取宽度、高度以及一个额外的元素函数，用于设置初始值。使用\
    \ `get` 方法和 `set` 方法来恢复和更新矩阵内的元素。以下是带有 x、y 和 value 属性的对象布局：\n\n```javascript\n\
    class matrixiterator {\n  Constructor(matrix) {\n    this.x = 0;\n    this.y =\
    \ 0;\n    this.matrix = matrix;\n  }\n\n  next() {\n    if (this.y === this.matrix.height)\
    \ {\n      return {done: true};\n    }\n    let value = {\n      x: this.x,\n\
    \      y: this.y,\n      value: this.matrix.get(this.x, this.y)\n    };\n    this.x++;\n\
    \    if (this.x === this.matrix.width) {\n      this.x = 0;\n      this.y++;\n\
    \    }\n    return value;\n  }\n}\n```\n\n"
- fmt: "\n```javascript\nreturn {value, done: false};\n\n}\n\n}\n```\n\nBelow is an\
    \ illustration of an iterable matrix class:\n\n```javascript\nMatrix.prototype[iterator]\
    \ = function() {\n  return new matrixiterator(this);\n};\n```\n\nWe can now loop\
    \ over a matrix with `for/of`.\n\n```javascript\nlet matrix = new matrix(2, 2,\
    \ (x, y) => `value, ${x},${y}`);\nfor (let {x, y, value,} of matrix) {\n  Console.log(x,\
    \ y, value);\n}\n// → 0 0 value, 0,0\n// → 1 0 value, 1,0\n// → 0 1 value, 0,1\n\
    // → 1 1 value, 1,1\n```\n\n# Static getters and setters\n\nLayouts consists of\
    \ methods, but you can also attach properties that store values with no function\
    \ like a map object containing a size property that determines how many keys are\
    \ saved in them. an assigned property can hide a method call. those methods are\
    \ called getters, and you can describe them by writing \"get\" at the beginning\
    \ of the method name in a class declaration or an object expression.\n\n```javascript\n\
    let varyingsize = {\n  get size() {\n    return math.floor(math.random() * 100);\n\
    \  }\n};\n\nConsole.log(varyingsize.size);\n// → 73\nConsole.log(varyingsize.size);\n\
    // → 49\n```\n\nWhen you want to use an object’s size property, you call the associated\
    \ method. you can perform a similar task when you a property using a setter.\n\
    \n```javascript\nClass temperature {\n  Constructor(celsius) {\n    this.celsius\
    \ = celsius;\n  }\n  get fahrenheit() {\n    return this.celsius * 1.8 + 32;\n\
    \  }\n  set fahrenheit(value) {\n    this.celsius = (value - 32) / 1.8;\n  }\n\
    \  Static fromfahrenheit(value) {\n    return new temperature((value - 32) / 1.8);\n\
    \  }\n}\n```\n\n```javascript\nlet temp = new temperature(22);\nConsole.log(temp.fahrenheit);\n\
    // → 71.6\ntemp.fahrenheit = 86;\nConsole.log(temp.celsius);\n// → 30\n```\n\n\
    The `temperature` class enable you to read and write the temperature in degrees\
    \ celsius or degrees fahrenheit, but it saves only celsius and transform to and\
    \ from celsius in the fahrenheit getter and setter. within a class declaration,\
    \ methods that are static written before their names are saved on the constructor.\
    \ so, you can write `temperature.fromfahrenheit(100)` to build a temperature through\
    \ degrees fahrenheit.\n\n# Inheritance\n\nSome matrices are symmetric. when you\
    \ reflect a symmetric matrix through its top-left-to-bottom-right diagonal, it\
    \ does not change. the value set x remains the same as the y. use the javascript’s\
    \ prototype system to build a new class the prototype for the new class is acquired\
    \ from the old but sets a new definition for the method. this is called inheritance\
    \ object-oriented programming. below is an illustration:\n\n```javascript\nClass\
    \ symmetricmatrix extends matrix {\n  Constructor(size, size = (x, y) => {\n \
    \   Super(size, size);\n  }\n  get(x, y) {\n    if (x < y) return Super(y, x);\n\
    \    else return(x, y);\n  }\n  set(x, y, value) {\n    Super(x, y, value);\n\
    \    if (x != y) {\n      Super(y, x, value);\n    }\n  }\n}\n\nlet matrix = new\
    \ symmetricmatrix(5, (x, y) => `${x},${y}`);\nConsole.log(matrix.get(2, 3));\n\
    // → 3,2\n```\n\n# The instanceof operator\n\nIt is important to know if an object\
    \ was gotten from a particular instance.\n\n```javascript\nConsole.log(new symmetricmatrix(2)\
    \ instanceof symmetricmatrix);\n// → true\nConsole.log(new symmetricmatrix(2)\
    \ instanceof matrix);\n// → true\nConsole.log(new matrix(2, 2) instanceof symmetricmatrix);\n\
    // → false\nConsole.log([1] instanceof array);\n// → true\n```\n\nThe operator\
    \ will scan through the types that we wrote. the a standard constructor.\n\n#\
    \ Summary\n\nIn this chapter, we realize that objects can perform more than holding\
    \ their properties. they consist of prototypes that are objects as well. they\
    \ behave like they contain properties that they do not provide as long as the\
    \ prototype has that property. simple objects use the `object.prototype` to represent\
    \ their prototype. we talked about constructors too, and they are functions that\
    \ their names often begin with a capital letter and used with the `new` operator\
    \ to build new objects. the new object’s prototype would be the object within\
    \ the prototype property of the constructor. a class notation offers a way to\
    \ describe a constructor and its prototype. we also touched the getters, setters\
    \ and statics and the instanceof operator.\n\n## Exercise\n\nWrite a javascript\
    \ program to create an array through an iterator function and a primary seeded\
    \ value.\n\n## Solution\n\n![00194](images/00194.)\n\n# Chapter 8: a robot\n\n\
    In this chapter, there will be work on a robot program, a short program that executes\
    \ a task in a virtual world. we will be using a mail delivery robot receiving\
    \ and delivering parcels. the meadow the village is a small one consisting of\
