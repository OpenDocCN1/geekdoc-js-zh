  trans: "\n计算机必须收集调用序列发生的上下文，因为函数会返回到被调用的地方。当 `console.log` 完成时，它必须返回到程序的末尾。调用栈（call\
    \ stack）是计算机存储这些上下文的地方。每当你调用一个函数时，当前的上下文就会保存在该栈的顶端。当函数返回时，它会移除顶部的上下文并利用该内容继续执行。\n\
    \n栈需要在计算机内存中要有空间来保存。下面的代码通过查询计算机解释了两个函数之间往返调用没有零限制。\n\n```javascript\nfunction\
    \ chicken() {\n  return egg();\n}\n\nfunction egg() {\n  return chicken();\n}\n\
    \nconsole.log(chicken() + \" came first.\");\n```\n// → ??\n\n### 可选参数\n\n下面的代码可以正常运行且互干扰：\n\
    \n```javascript\nfunction square(x) {return x * x;}\n\nconsole.log(square(4, true,\
    \ \"hedgehog\"));\n```\n// → 16\n\n`square` 被描述为一个参数，但我们调用它时传入了 `three`。这是因为编程语言忽略了多余的参数，并识别第一个参数的平方。JavaScript\
    \ 对传递给函数的参数数量非常宽容。这种特性的优点是它允许用不同数量的参数调用函数：\n\n```javascript\nfunction minus(a,\
    \ b) {\n  if (b === undefined) return -a;\n  else return a - b;\n}\n\nconsole.log(minus(10));\n\
    ```\n// → -10\n\n```javascript\nconsole.log(minus(10, 5));\n```\n// → 5\n\n当在参数和表达式后编写\
    \ `=` 运算符时，该表达式的值将存储未指定的参数。如果你想传递但不产生第二个参数，那么默认值就变为二，函数表现得像 `square` 一样。\n\n```javascript\n\
    function power(base, exponent = 2) {\n  let result = 1;\n  for (let count = 0;\
    \ count < exponent; count++) {\n    result *= base;\n  }\n  return result;\n}\n\
    \nconsole.log(power(4));\n```\n// → 16\n\n```javascript\nconsole.log(power(2,\
    \ 6));\n```\n// → 64\n\n### 闭包 (Closure)\n\n将函数作为值使用的能力，与每当你调用函数时都会重新创建局部绑定的事实密切相关。下面的代码展示了这个例子；它描述了一个包装值，该函数创建一个局部绑定，然后返回一个进入并返回局部绑定的函数。\n\
    \n```javascript\nfunction wrap(n) {\n  let local = n;\n  return () => local;\n\
    }\n\nlet wrap1 = wrap(1);\nlet wrap2 = wrap(2);\nconsole.log(wrap1()); // → 1\n\
    console.log(wrap2()); // → 2\n```\n\n这个概念被称为闭包。它赋予用户在限制性作用范围内引用局部绑定特定实例的能力。对我们之前的示例进行一些修改，可以变成一种开发可以任意数量累积函数的方法。\n\
    \n```javascript\nfunction multiply(factor) {\n  return number * factor;\n}\n\n\
    let twice = multiply(2);\nconsole.log(twice); // // 1010\n\n### 递归\n\n函数可以调用自己，但不应该经常地调用自己，以避免栈溢出。递归函数是调用它自身的函数。递归允许以不同的风格编写函数。例如，下面的代码是\
    \ `power` 的执行实现。\n\n```javascript\nfunction power(base, exponent) {\n  if (exponent\
    \ == 0) {\n    return 1;\n  } else {\n    return base * power(base, exponent -\
    \ 1);\n  }\n}\n\nconsole.log(power(2, 3));\n```\n// → 8\n\n这种执行存在一个问题：与其他循环版本相比，它更慢。使用单个循环被认为比多次调用函数成本更低。尽管这并没有让递归成为一种无效的循环方案，但某些问题用递归比用循环更容易解决。需要检查或处理多个分支的问题证明了这一点：我们从数字\
    \ 1 开始，不断加 5 或乘以 3。例如，数字 13 可以通过乘以 3 和两次加 5 得到，但我们无法获得 15。代码是递归解决方案：\n\n```javascript\n\
    function findsolution(target) {\n  function find(current, history) {\n    if (current\
    \ == target) {\n      return history;\n    } else if (current > target) {\n  \
    \    return null;\n    } else {\n      return find(current + 5, `${history} +\
    \ 5`) || find(current * 3, `${history} * 3`);\n    }\n  }\n  return find(1, \"\
    1\");\n}\n\nconsole.log(findsolution(24));\n```\n// → (((1 * 3) + 5) * 3)\n\n\
    内部函数 `find` 接受两个参数：当前数字 `current` 和一个记录获取该数字过程的字符串。如果找到了解决方案，它会返回一个显示通往 `target`\
    \ 路径的字符串；如果没有解决方案，返回的值将是 `null`。为了实现这一点，函数执行三个动作之一。如果你的 `target` 等于 `current`，你就可以通过\
    \ `current` 得到该 `target`。\n\n缩进指定调用栈的深度。\n\n"
- fmt: "\nWriting length after a string expression determines the length of the particular\
    \ string. the loop continues to add zeros at the beginning of the number strings\
    \ until they comprise of three characters.\n\nHere is a better attempt:\n\n```\n\
    function printzeraddedwithlabel(number, label) {\n  let numberstring = string(number);\n\
    \  while (numberstring.length < 3) {\n    numberstring = \"0\" + numberstring;\n\
    \  }\n  Console.log(`${numberstring} ${label}`);\n}\n\nfunction printfarminventory(cows,\
    \ chickens, pigs) {\n  printzeraddedwithlabel(cows, \"cows\");\n  printzeraddedwithlabel(chickens,\
    \ \"chickens\");\n  printzeraddedwithlabel(pigs, \"pigs\");\n}\n\nprintfarminventory(7,\
    \ 11, 3);\n```\n\nInstead of taking out the replicated part of the program, try\
    \ to pick out an individual concept with the following steps:\n\n```\nfunction\
    \ zeropad(number, width) {\n  let string = string(number);\n  while (string.length\
    \ < width) {\n    String = \"0\" + string;\n  }\n  return string;\n}\n\nfunction\
    \ printfarminventory(cows, chickens, pigs) {\n  Console.log(`${zeropad(cows, 3)}\
    \ cows`);\n  Console.log(`${zeropad(chickens, 3)} chickens`);\n  Console.log(`${zeropad(pigs,\
    \ 3)} pigs`);\n}\n\nprintfarminventory(7, 16, 3);\n```\n\nA function can also\
    \ be used to print aligned tables of numbers.\n\n### Functions and side effects\n\
    \nFunctions can consist of side effects and return a value. they develop values\
    \ that integrate easily in new ways much more than functions that produce side\
    \ effects. a pure function is a unique value manufacturing function that does\
    \ not depend on either code side effects. for instance, it will not recognize\
    \ a global binding with a changeable value. it also consists of a callable property\
    \ together with the same arguments and produces equal value.\n\n### Summary\n\n\
    In this chapter, you now understand how to write your functions. knowing how to\
