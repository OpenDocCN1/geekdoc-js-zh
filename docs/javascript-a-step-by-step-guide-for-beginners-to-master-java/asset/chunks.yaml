  trans: "\n\n来自正则的 `exec` 对象包含一个 `index` 属性，它决定了匹配项在字符串中的起始位置。以下是所需的数字序列：\n\n`String`\
    \ 类型值包含一个 `match` 方法，其行为类似。\n\n```javascript\nConsole.log(\"one, two 100\".match(/\\\
    d+/));\n// → [\"100\"]\n```\n\n当正则表达式包含用括号括起来的子表达式时，匹配到的文本将显示在数组中。整个匹配项是第一个，下一个是第一个分组匹配的部分，然后是后续分组，以此此类推。\n\
    \n```javascript\nlet quoteText = /([^']*)'/;\nConsole.log(quoteText.exec(\"she\
    \ said 'hello'\"));\n// → [\"'hello'\", \"hello\"]\n``` （注意：原文中的变量有拼写错误，此处已进行逻辑修正）\n\
    \n当一个组没有完成匹配时（如果它包含问号），它会输出 `undefined`。当你多次匹配一个组时，只有最后一次匹配的结果会出现在数组中。\n\n```javascript\n\
    Console.log(/bad(ly)?/.exec(\"bad\"));\n// → [\"bad\", undefined]\n\nConsole.log(/(\\\
    d)+/.exec(\"123\"));\n// → [\"123\", \"3\"]\n```\n\n### Date 类\n\nJavascript 包含一个表示日期的标准类，称为\
    \ `Date`。如果你想利用 new 构建日期对象，首先获取当前的时间和日期。\n\n```javascript\nConsole.log(new Date());\n\
    // → mon nov 11 2023 16:19:11 gmt+0100 (cet)\n```\n\n你也可以为特定时间构建对象。\n\n```javascript\n\
    Console.log(new Date(2008, 11, 8));\n// → wed dec 08 2008 00:00:00 gmt+0100 (cet)\n\
    \nConsole.log(new Date(2008, 11, 9, 12, 59, 59, 999));\n// → wed dec 08 2009 12:59:59\
    \ gmt+0100 (cet)\n```\n\n你应当遵循 javascript 的命名规范，其中月份数字从 0 开始（因此，12 月是 11），日期数字从\
    \ 1 开始。\n\n小时、分钟、秒和毫秒参数是可选的，在未指定时识别为零。时间戳以 UTC 时区的毫秒数保存，并遵循“Unix 时间”设定的约定。\n\n\
    ```javascript\nConsole.log(new Date(2016, 11, 14).getTime());\n// → 1445677600000\n\
    \nConsole.log(new Date(1445677600000));\n// → mon dec 11 2008 00:01:00 gmt+0100\
    \ (cet)\n```\n\n当日期构造函数设置单个参数时，该参数被识别为毫秒数。通过构建一个新的日期对象并在其上调用 `getTime`，或使用 `date.now`\
    \ 函数来确定当前的毫秒数。`date` 对象产生如 `getDate`、`getHours`、`getFullYear`、`getMonth`、`getMinutes`\
    \ 和 `getSeconds` 等方法来获取其组件。\n\n```javascript\nfunction getdate(strings) {\n  let\
    \ [_, month, day, year] =\n    /(\\d{01,2})-(\\d{01,2})-(\\d{4})/.exec(strings);\n\
    \  return new Date(year, month - 1, day);\n}\n\nConsole.log(getDate(\"1-30-2003\"\
    ));\n// → thursday jan 30 2003 00:00:00 gmt+0100 (cet)\n```\n\n### 字符串和单词边界\n\n\
    你可以通过添加标记 `^` 和 `$` 来确保匹配跨越整个字符串。脱符号表示输入字符串的开头，而美元符号表示结尾。因此，`/^\\d+$/` 匹配包含一个或多个数字的字符串，`//^\
    \ /` 匹配任何以叹号开头的字符串，而 `/x^/` 不匹配任何字符串。如果你想让日期在单词边界开始和结束，请利用 `\\b`。单词边界可以是包含单词字符（`\\\
    w`）的字符串的一侧，而另一侧是非单词字符。\n\n```javascript\nConsole.log(/cat/.test(\"concatenate\"\
    ));\n// → true\n\nConsole.log(/\\cat\\b/.test(\"concatenate\"));\n// → false\n\
    ```\n\n### 选择模式\n\n如果你想知道一段文本是否由数字后跟如 pig 或 cow 这样的单词组成，让我们写三个正则表达式并测试它们。利用管道符（`|`）来标记左右侧之间的选择：\n\
    \n```javascript\nlet animalCount = /\\b\\d+ (pig|cows)?\\b/;\nConsole.log(animalCount.test(\"\
    15 pigs\")); // true\n\nConsole.log(animalCount.test(\"15 cows\")); // false\n\
    ```\n\n### replace 方法\n\n字符串值包含一个 `replace` 方法，用于将字符串的一部分替换为另一个。第一个参数同样可以是正则表达式。如果你在表达式中添加\
    \ `g` 选项，字符串中的每个匹配项都将被替换，而不仅仅是第一个。\n\n```javascript\nConsole.log(\"borudar\".replace(/[ou]/,\
    \ \"a\"));\n// → barudar\n\nConsole.log(\"borudar\".replace(/[ou]/g, \"a\"));\n\
    // → badadar\n```\n\n在 `replace` 中利用正则表达式的主要意义是因为它可以引用字符串中的匹配组。例如，你有一个包含人名的大字符串，使用\
    \ `format` 行，你也可以使用 `replace` 方法来更改和删除姓名。\n\n利用以下代码：\n\n```javascript\nConsole.log(\"\
    liskov, barthy john\".replace(/(\\w+), (\\w+)/g, \"$2 $1\"));\n// → barthy john\
    \ liskov\n```\n\n`$1` 和 `$2` 包含在文中，对应从第一个分组到 `$9`。每个匹配项都可以替换为 `$&`。你可以将函数而不是字符串作为第二个参数传递给\
    \ `replace`。对于每次替换，函数都会以匹配组作为参数调用，并将返回值包含在新字符串中。下面是一个示例：\n\n```javascript\nlet\
    \ s = \"the cia and fbi\";\nConsole.log(s.replace(/\\b(fbi|cia)\\b/g, str => str.toUpperCase()));\
    \ // → the CIA and FBI\n```\n\n这里更有趣的：\n\n```javascript\nlet stock = \"1 lemon,\
    \ 2 cabbages, and 101 eggs\";\n\nfunction minusone(match, units) {\n  let amount\
    \ = Number(match) - 1;\n  if (amount == 1) { // 只剩一个，移除 's'\n    let unit = units.slice(0,\
    \ units.length - 1);\n  } else if (amount == 0) {\n    amount = \"no\";\n  }\n\
    \  return amount + \" \" + units;\n}\n\nConsole.log(stock.replace(/(\\d+) (\\\
    w+)/g, minusone));\n// → no lemon, 1 cabbage, and 100 eggs\n```\n\n### 贪婪模式\n\n\
    你可以使用 `replace` 写一个函数来消除 javascript 代码块中的所有注释。见下方：\n\n```javascript\nfunction\
    \ stripComments(code) {\n  return code.replace(/\\/\\/.*|\\/\\*[^]*\\*\\//g, \"\
    \");\n}\n\nConsole.log(stripComments(\"1 + /* 2 */3\")); // → 1 + 3\n\nConsole.log(stripComments(\"\
    x = 10;// ten!\")); // → x = 10;\n\nConsole.log(stripComments(\"1 /* a */+/* b\
    \ */ 1\")); // → 1 1\n```\n\n或运算符之前的部分匹配两个斜杠字符，后面带有任何非换行符的字符。使用 `[^]` 匹配任何字符。\n\
    \n"
- fmt: "\nRepetitive operators (`+`, `*`, and `{}`) are called greedy which means\
    \ they match and they can also backtrack. if a question mark is placed after them\
    \ (`+?`, `*?`, `??`, `{}?`), the greedy disappears and begin matching no matter\
    \ how small. the smallest stretch of characters which brings a `*/`, is the star\
    \ match. it absorbs one block comment only.\n\n```javascript\nfunction stripcomments(code,)\
    \ {\n  return code.replace(/\\/\\/\\/.*|\\/\\*[^]*?\\*\\//g, \"\");\n}\n\nConsole.log(stripcomments(\"\
    1  /* a */+/* b */  1\"));\n// → 1 + 1\n```\n\n### Dynamically creating regexp\
    \ objects\n\nThere are a few instances where you would not understand the specific\
    \ pattern you should match against when your code is being written. if you want\
    \ to search for the username in a chunk of text and wrap it in underscore characters\
    \ to make it unique., but you can create a string and utilize the `RegExp` constructor.\
    \ below is an example:\n\n```javascript\nlet name = \"harry\";\nlet text = \"\
    harry is a suspicious character.\";\nlet regex = new RegExp(\"\\\\b(\" + name\
    \ + \")\\\\b\", \"gi\");\n\nConsole.log(text.replace(regex, \"_$1_\"));\n// →\
    \ _harry_ is a suspicious character.\n```\n\nIf you want to build the `\\b` boundary\
    \ markers, utilize the two backslashes because you would write them in a normal\
    \ string. the second argument to the `RegExp` constructor consists of the options\
    \ needed for the regular expression. the `\"gi\"` represents global and case insensitive..\
    \ below is an example:\n\n```javascript\nlet name = \"dea+hl[]rd\";\nlet text\
    \ = \"this dea+hl[]rd guy is super annoying.\";\nlet escaped = name.replace(/[\\\
    .+.+?(){|^$]/g, \"\\\\$&\");\nlet regex = new RegExp(\"\\\\b\" + escaped + \"\\\
    \\b\", \"gi\");\nConsole.log(text.replace(regex, \"_$&_\"));\n// → this _dea+hl[]rd_\
    \ guy is very annoying.\n```\n\n### The search method\n\nYou cannot call the `indexOf`\
    \ method on strings a regular expression. you can also use another method, `search`\
    \ where you can call the `indexOf` method a regular expression, and it sends back\
    \ the first index where it sees the expression and when it does not see, it returns\
    \ -1.\n\n```javascript\nConsole.log(\"  word\".search(/\\s/));\n// → 2\n\nConsole.log(\"\
    \  \".search(/\\s/));\n// → -1\n```\n\n### The lastIndex property\n\nThe `exec`\
    \ method does not produce a better way to begin the search from a stated position\
    \ in the string. regular expression objects contain properties. one of the properties\
    \ is called `source`, and it consists of the string that built the expression.\
    \ `lastIndex` is another property, and it influences some small circumstances,\
    \ where the next match will begin. the regular expression must contain the global\
    \ (`g`) or sticky (`y`) option, and the match will occur using the `exec` method.\
    \ illustration below:\n\n```javascript\nlet pattern = /y/g;\npattern.lastIndex\
    \ = 3;\nlet match = pattern.exec(\"xyz\");\nConsole.log(match.index); // → 4\n\
    Console.log(pattern.lastIndex); // → 5\n```\n\nThe dissimilarity between the global\
    \ and the sticky options is that you enable sticky, the match succeeds if it begins\
    \ at `lastIndex`, while with global it will find a position for the match can\
    \ begin.\n\n```javascript\nlet global = /abc/g;\nConsole.log(global.exec(\"abc\"\
    )); // [\"abc\"]\n\nlet sticky = /abc/y;\nConsole.log(sticky.exec(\"abc\")); //\
    \ null\n```\n\nIf you are utilizing a shared regular expression value for several\
    \ calls, problems will occur with the automatic update to the `lastIndex` property.\n\
    \n```javascript\nlet digit = /\\d/g;\nConsole.log(digit.exec(\"it is here: 1\"\
    )); // [\"1\"]\nConsole.log(digit.exec(\"and now: 1\")); // null\n```\n\nThe best\
    \ thing to do is to scan across all events of a pattern in a string giving access\
    \ to the match object in the loop body. use `lastIndex` to achieve this.\n\n```javascript\n\
    let input = \"a string with three numbers...42 and 88.\";\nlet number = /\\d+\\\
    b/g;\nlet match;\nwhile (match = number.exec(input)) {\n  Console.log(match[0],\
    \ \"at\", match.index);\n}\n// found 42 at 14\n// found 88 at 33\n```\n\nThe assignment\
    \ value (`=`) is the specified value., so utilizing `match = number.exec(input)`\
    \ as the condition within the `while` state, the match is execute the match at\
    \ the beginning of every iteration, store the result within a binding, and stop\
    \ looping matches can no longer find.\n\n### Parsing an ini file\n\n```ini\nengine=https://duckduckgo.com/?Q=$1\n\
    fullness=9.7; comments are preceded by a semicolon; each section concerns an individual\n\
    \n[larry]\nName=lar doe\nType=kinder bully\nWebsite=http://www.google.com/google/\n\
    \n[dea]\nName=dea\nType=evil witch\nOutputDir=/home/margin/dea\n```\n\nThe rules\
    \ for this format (which is a generally used format, usually called An ini file,)\
    \ is:\n\n- ignore blank lines and lines beginning with semicolons.\n- lines enclosed\
    \ in `[]` begin a new section.\n- lines consisting of an alphanumeric identifier\
    \ accompanied by a `=` character attach a setting to the current section.\n- everything\
    \ else is invalid.\n\nOur mission here is to change a string like this to an object,\
    \ which properties use string to store settings that are written before the subobjects\
    \ for sections and the first section header. the subobjects hold that section’s\
    \ settings. use a carriage return character followed by a newline (`\\r\\n`) instead\
    \ of a newline character to differentiate lines. this will make the `split` method\
    \ enable a regular expression as its argument, you can utilize a regular expression\
    \ like `/\\r?\\n/` to divide it in a way that enables `\\n` and `\\r\\n` between\
    \ lines.\n\n```javascript\nfunction ini(string) {\n  // begin with an object to\
    \ hold the top-level fields\n  let result = {};\n  let section = result;\n  String.split(/\\\
    r?\\n/).forEach(line, => {\n    let match;\n    if (match = line.match(/^(\\w+)=(.*)$))\
    \ {\n      section[match[1]] = match[2];\n    } else if (match = line.match(/^\\\
    [(.*)\\]$/)) {\n      section = result[match[1]] = {};\n    } else if (!/^\\s*(;.*)?$/.test(line))\
    \ {\n      throw new Error(\"line, '\" + line + \"' invalid.\");\n    }\n  });\n\
    \  return result;\n}\n\nConsole.log(parseini(`\nengine=https://duckduckgo.com/?Q=$1\n\
    fullness=9.7; comments are preceded by a semicolon; each section concerns an individual\n\
    \n[larry]\nName=lar doe\nType=kinder bully\nWebsite=http://www.google.com/google/\n\
    \n[dea]\nName=dea\nType=evil witch\nOutputDir=/home/margin/dea`));\n// → {engine:\
    \ \"https://duckduckgo.com/?Q=$1\", fullness: \"9.7\", larry: {Name: \"lar doe\"\
    , Type: \"kinder bully\", Website: \"http://www.google.com/google/\"}, dea: {Name:\
    \ \"dea\", Type: \"evil witch\", OutputDir: \"/home/margin/dea\"}}\n"
