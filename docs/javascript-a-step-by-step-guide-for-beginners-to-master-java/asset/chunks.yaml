    \ a non-function.\");\n      }\n    }\n  }\n}\n```\n\n求值器包含了每种表达式类型的代码。字面量值表达式提供其值。绑定检查它是否在作用域中被描述并获取绑定的值。如果它包含一个不访问任何内容的特殊形式，它会将参数表达式和作用域传递给影响该形式的函数。如果调用访问了操作符，则判断它是否为函数并使用可用的参数调用它。利用公共函数值来代表\
    \ egg 函数的值。求值的递归布局与解析器的布局相似，两者镜像了语言的结构。你可以在解析时结合使用求值器和求值，将它们分离可以使程序结构更加清晰。这就是组合\
    \ egg 所需的一切。\n\n#### 特殊形式\n\n`specialforms` 对象描述了 egg 中独特的语法。它将单词与访问此类形式的函数关联起来。它目前是空的。让我们插入：\n\
    \n```javascript\nspecialforms.if = (args, scope) => {\n  if (args.length != 3)\
    \ {\n    throw new syntaxerror(\"number of args to if\");\n  } else if (evaluate(args[0],\
    \ scope) !== false) {\n    return evaluate(args[1], scope);\n  } else {\n    return\
    \ evaluate(args[2], scope);\n  }\n};\n```\n\negg 的 `if` 期望三个参数。它会访问第一个，如果值不是 false，它移动到访问第二个。如果不是，它就访问第三个。`if`\
    \ 形式看起来更像 JavaScript 的三元运算符 own JavaScript 的 `if`。它是一个表达式而不是语句，并提供一个值，即第二个或第三个参数的结果。egg\
    \ 在处理条件值时也与 JavaScript 不同，它不会将零或空字符串视为 false，只有精确的值 false 才是。函数的所有参数在调用函数之前都会被访问。\n\
    \n```javascript\nspecialforms.while = (args, scope) => {\n  if (args.length !=\
    \ 2) {\n    throw new syntaxerror(\"number of args to while\");\n  }\n  while\
    \ (evaluate(args[0], scope) !== false) {\n    evaluate(args[1], scope);\n  }\n\
    \  // 因为 egg 中没有 undefined，我们返回 false，\n  // 表示缺乏显性结果。\n  return false;\n};\n\
    ```\n\n另一个构建块是 `do`，它从上到下执行它的参数。它的值由最后一个参数提供。\n\n```javascript\nspecialforms.do\
    \ = (args, scope) => {\n  let value = false;\n  for (let arg of args) {\n    value\
    \ = evaluate(arg, scope);\n  }\n  return value;\n};\n```\n\n为了构建绑定并设置新值，你应该构建一个名为\
    \ `define` 的形式。它等待一个单词作为第一个参数，并将带有作用域传递给影响该形式的函数。如果调用的是单词，则返回绑定的值。利用公共函数操作符。\n\
    \n```javascript\nspecialforms.define = (args, scope) => {\n  if (args.length !=\
    \ 2 || args[0].type != \"word\") {\n    throw new syntaxerror(\"incorrect use\
    \ of define\");\n  }\n  let value = evaluate(args[1], scope);\n  scope[args[0].name]\
    \ = value;\n  return value;\n};\n```\n\n环境作用域是一个包含具有名称属性的对象。下面是一个绑定两个值 true 和\
    \ false 并利用对象的示例。\n\n```javascript\nConst topscope = object.create(null);\ntopscope.true\
    \ = true;\ntopscope.false = false;\n```\n\n我们现在可以检查一个消除布尔值的简单表达式。\n\n```javascript\n\
    let prog = parse(`if(true, false, true)`);\nconsole.log(evaluate(prog, topscope));\n\
    // → false\n```\n\n"
