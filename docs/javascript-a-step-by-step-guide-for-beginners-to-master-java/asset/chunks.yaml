  trans: "\nJSON 代表 JavaScript 对象表示法，它用于 Web 的通信格式和数据存储。JSON 在编写风格（数组和对象）上与 JavaScript\
    \ 非常相似，尽管存在一些限制。它的属性名必须包含在双引号内，并且它只允许简单的数据表达式、绑定等。JSON 不允许注释。\n\n这是一个用 JSON 数据表示的日志条示例：\n\
    \n```json\n{\n  \"squirrel\": false,\n  \"events\": [\"work\", \"touched tree,\"\
    , \"pizza\", \"running\"]\n}\n```\n\nJavaScript 包含 `json.stringify` 和 `json.parse`\
    \ 两个函数，用于在该格式之间转换数据。`json.stringify` 接收一个 JavaScript 值并返回一个 JSON 编码的字符串，而 `json.parse`\
    \ 接收一个字符串并将其转换为编码的值。\n\n```javascript\nlet string = json.stringify({\n  squirrel:\
    \ false,\n  Events: [\"weekend\"]\n});\n\nConsole.log(string);\n// → {\"squirrel\"\
    :false,\"events\":[\"weekend\"]}\n\nConsole.log(json.parse(string).events);\n\
    // → [\"weekend\"]\n```\n\n### 反转数组\n数组包含 `reverse` 方法，用于通过反转元素显示顺序来改变数组。\n\n\
    ### 总结\n我们在本章中涵盖了对象和数组，它们创建了在单个值中对各种值分类的方法。想象一下，这让你能够将几个关联项放入袋中并提着袋子移动，而不是用手臂抱住每一个单独的物品并试图将它们分开。JavaScript\
    \ 中的许多值包含属性，其中不一致的情况是 `undefined` 和 `null`。你可以使用 `value.prop` 或 `value[\"prop\"\
    ]` 访问属性。你可以为对象属性命名并保存一组定义的属性。数组也包含不同数量的相似虚拟值，并使用数字（从 0 开始）作为属性名。数组包含少数几个属性，即 `length`\
    \ 和几个方法。方法是存储在属性中的函数，并对其作为属性的值执行操作。你可以通过一种特殊的 for 循环遍历数组——`for (the let element\
    \ of an array)`。\n\n练习\n编写一个 JavaScript 函数来获取数组中的第一个项。设置参数 'n' 将返回数组的前 'n' 个元素。\n\
    \n数据：\n```javascript\nConsole.log(array_clone([1, 2, 4, 0]));\nConsole.log(array_clone([1,\
    \ 2, [4, 0]]));\n// [1, 2, 4, 0]\n// [1, 2, [4, 0]]\n```\n解决方案\n![0035.jpg](img/0035.jpg)![0184.jpg](img/0184.jpg)\n\
    \n## 第 6 章：高阶函数\n大型程序的开发需要时间，并且产生很多漏洞，这反过来使得它们难以找到。这里有两个程序的示例：第一个是自包含的，状态有六行代码。\n\
    \n```javascript\nlet total = 0, count = 1;\nWhile (count <= 10) {\n  Total +=\
    \ count;\n  Count += 1;\n}\nConsole.log(total);\n```\n第二个依赖于外部函数，状态只有一行。\n\n```javascript\n\
    Console.log(sum(range(1, 10)));\n```\n\n### 抽象\n在涉及 JavaScript 语言时，词汇使用了“抽象”（abstraction）一词。抽象用于隐藏细节，并提供在更高层次讨论问题的能力。让我们区分两种汤的配方：第一：在容器内放入\
    \ 1 杯干豌豆。加入足够的水没豌豆，浸泡 12 小时。从水中取出放入烹饪锅中，加入四杯水。煮沸约 2 小时，取半个洋葱，用刀切片并倒入豌豆中，准备 10\
    \ 分钟。第二种配方：半个洋葱、一根芹菜、1 杯碎豆和一个胡萝卜。将豌豆浸在水中约 12 小时。在水（4 杯）中煮约 2 小时，加入并切蔬菜煮 10 分钟。计算机逐个执行任务，从盲目到高层概念。\n\
    \n### 抽象重复\n普通函数用于创建抽象。程序重复指定次数的某个函数是一种习惯。你可以通过这样的循环来实现它：\n\n```javascript\nfor\
    \ (let i = 0; i < 10; i++) {\n  Console.log(i);\n}\n```\n\n在这里我们写了一个调用 `console.log`\
    \ n 次的函数。\n\n```javascript\nfunction repeatlog(n) {\n  for (let i = 0; i < n;\
    \ i++) {\n    Console.log(i);\n  }\n}\n```\n\n如果你想执行与记录数字不同的任务，可以将操作作为函数值传入。\n\
    \n```javascript\nfunction repeat(n, action) {\n  for (let i = 0; i < n; i++) {\n\
    \    Action(i);\n  }\n}\n\nrepeat(3, console.log);\n// → 0\n// → 1\n// → 2\n```\n\
    \n有时你不需要传入操作，可以使用定义的函数作为重复循环的替代：\n\n```javascript\nlet ls = [];\nrepeat(5, i =>\
    \ {\n  ls.push(i + 1);\n});\nConsole.log(ls);\n// → [\"1\", \"2\", \"3\", \"4\"\
    , \"5\"]\n```\n\n这种方法看起来类似于循环；尽管循环体在函数内部。高阶函数\n高阶函数是通过返回其他函数来作用作用函数。这种函数用于隐藏细节。例如，你有一个返回函数的函数：\n\
    \n```javascript\nfunction greater(n) {\n  return m => m > n;\n}\n\nlet greater10\
    \ = greater(10);\nConsole.log(greater10(11));\n// → true\nConsole.log(greater10(5));\n\
    // → false\n```\n\n高阶函数也可以接受函数作为参数。\n\n```javascript\nfunction filter(array, f)\
    \ {\n```\n\n### 过滤数组\n你也可以拥有转换其他函数的。\n\n```javascript\nfunction noisy(f) {\n \
    \ return (...args) => {\n    Console.log(\"calling with\", args);\n    let result\
    \ = f(...args);\n    Console.log(\"returned\", result);\n    return result;\n\
    \  };\n}\n\nnoisy(math.min)(3, 2, 1);\n// → calling with [3, 2, 1]\n// → returned\
    \ 1\n```\n\n你还可以编写产生新控制流的函数。\n\n```javascript\nfunction unless(test, action) {\n\
    \  if (!test) action();\n}\n\nrepeat(3, n => {\n  unless(n % 2 == 1, () => {\n\
    \    Console.log(n, \"is even\");\n  });\n});\n// → 0 is even\n// → 2 is even\n\
    ```\n\n这种方法是一种内置数组方法 `foreach`，它作为高阶函数产生一个类似于 `for/of` 循环的循环。\n\n```javascript\n\
    [\"a\", \"b\"].forEach(l => Console.log(l));\n// → a\n// → b\n```\n"
- fmt: "\n```javascript\nConsole.log(filter(scripts, script => script.living));\n\
    ```\n// → `[{name: \"adlam\", ...}, ...]`\n\nThis function utilize the `argument`\
    \ called `test` a function value, to cover a gap during the calculation. it determines\
    \ which `element` to receive.\n\n### Transforming with map\n\nThe `map` method\
    \ changes an array by setting a function to each and every of its elements and\
    \ creating a new array from the returned values. the new array consists of the\
    \ same length with the input array but will map out its content to a renamed for\
    \ by the function.\n\n```javascript\nFunction map(array, transform) {\n  let mapped\
    \ = [];\n  For (let element of array) {\n    mapped.push(transform(e,element));\n\
    \  }\n  return mapped;\n}\n```\n\n```javascript\nlet rtlscripts = scripts.filter(s\
    \ => s.direction == \"rtl\");\nConsole.log(map(rtlscripts, s => s.name));\n```\n\
    // → `[\"adlam\", \"arabic\", \"imperial aramaic\", ...]`\n\nLike `foreach` and\
    \ `filter`.\n\n### Summarizing with reduce\n\nWhen you add up numbers, begin with\
    \ zero and add the foreach element to the sum. the parameter to `reduce`, are\
    \ `map` function combination and begin a value. this function is much easier to\
    \ understand than the `filter` and `map`. it is below:\n\n```javascript\nFunction\
    \ reduce(array, combine, begin) {\n  let current = begin;\n  For (let items of\
    \ arrays) {\n    existing = combine(existing, element);\n  }\n  return existing;\n\
    }\n```\n\n```javascript\nConsole.log(reduce([0,1, 2, 3, 4], (a, b) => a + b, 0));\n\
    ```\n// → `10`\n\nThis function is similar to the standard array method `reduce`\
    \ and attaches more comfort.\n\n```javascript\nConsole.log([1, 2, 3, 4].reduce((a,\
    \ b) => a + b));\n```\n// → `10`\n\nIf you want to utilize `reduce` to search\
    \ for the script with the more characters, write it like this:\n\n```javascript\n\
    Function charactercount(script) {\n  return script.ranges.reduce((count, [from,\
    \ to]) => {\n    return count + (to - from);\n  }, 0);\n}\n```\n\n```javascript\n\
    Console.log(scripts.reduce((a, b) => {\n  return charactercount(a) < charactercount(b)\
    \ ? b : a;\n}));\n```\n// → `{name: \"han\", ...}`\n\n### Composability\n\nTake\
    \ some time to think about how long our list of code, would have been without\
    \ the higher-order functions.\n\n```javascript\nlet biggest = null;\nFor (let\
    \ script of scripts) {\n  If (biggest == null ||\n  charactercount(biggest) <\
    \ charactercount(script)) {\n    biggest = script;\n  }\n}\nConsole.log(biggest);\n\
    ```\n// → `{name: \"han\", ...}`\n\nYou can use the high-order functions when\
    \ you want to compose operations. for instance, here is a line of code that searches\
    \ for the average for living and dead in the data set.\n\n```javascript\nFunction\
    \ average(array) {\n  return array.reduce((a, b) => a + b) / array.length;\n}\n\
    Console.log(math.round(average(scripts.filter(s => s.living).map(s => s.length))));\n\
    ```\n// → `165`\n\n```javascript\nConsole.log(math.round(average(scripts.filter(s\
    \ => !s.living).map(s => s.length))));\n```\n// → `204`\n\nThe block of code displays\
    \ that the death script is older than the living ones. let’s begin with the entire\
    \ filter out the dead (or living), eradicate their averages. you as well write\
    \ the calculations as a big loop:\n\n```javascript\nlet total = 0, count = 0;\n\
    For (let script of scripts) {\n  If (script.living) {\n    total += script.length;\n\
    \    Count += 1;\n  }\n}\nConsole.log(math.round(total / count));\n```\n// → `165`\n\
    \nOur two examples are not identical, the first creates new arrays when administering\
    \ the map and filter while the second calculate numbers.\n\n### Strings and character\
    \ code\n\nOne of the significant use of data set is to find out what script block\
    \ of text is using. below is a program that performs that task. every script contains\
    \ an array of character codes related with it. so if you are given a character\
    \ code, utilize this function to search for the equivalent script (if available):\n\
    \n```javascript\nFunction characterscript(code) {\n  For (let script of scripts)\
    \ {\n    If (script.ranges.some([[from, to]) => {\n      return code >= from &&\
    \ code < to;\n    })) {\n      return script;\n    }\n  }\n  return null;\n}\n\
    ```\n\n```javascript\nConsole.log(charactersscript(121));\n```\n// → `{name: \"\
    latin\", ...}`\n\nAnother high-order function is the same method. this method\
    \ gets a test function and determines if that function sends back true for any\
    \ component in the array. there are some operations on javascript strings like\
    \ securing their length using the `length` property and evaluating their contents\
    \ through the square brackets.\n\n```javascript\n// two emoji characters, horse\
    \ and shoe,\nlet horse_shoe = \"\U0001F434\U0001F45F\";\nConsole.log(horse_shoe.length);\n\
    ```\n// → `4`\n\n```javascript\nConsole.log(horse_shoe[0]);\n```\n// → `(invalid\
    \ half character)`\n\n```javascript\nConsole.log(horse_shoe.charCodeAt(0));\n\
    ```\n// → `55357 (code of the half character)`\n\n```javascript\nConsole.log(horse_shoe.codePointAt(0));\n\
    ```\n// → `128052 (actual code for horse emoji)`\n\nJavascript’s `charCodeAt`\
    \ method offers a full unicode character. this method is used to take characters\
    \ from a string. although the argument sent to `codePointAt` remains an index\
    \ into the succession of code units. if you use `codePointAt` across a string,\
    \ it produces the dragon.\n\n```javascript\nlet dragon = \"\U0001F409\";\nFor\
    \ (let char of dragon) {\n  Console.log(char);\n}\n```\n// → `\U0001F409`\n\n\
    The `countby` function anticipates a collection (a group of) and returns a list\
    \ of objects. each of the objects names a group and determines the number of elements\
    \ contained in the group.\n\n```javascript\nFunction countby(items, groupname)\
    \ {\n  let counts = [];\n  For (let item of items) {\n    let name = groupname(item);\n\
    \    let known = counts.find(c => c.name == name);\n    if (known == -1) {\n \
    \     counts.push({name, count: 0});\n    } else {\n      known.count++;\n   \
    \ }\n  }\n  return counts;\n}\n```\n\n```javascript\nConsole.log(countby([0,1,\
    \ 2, 3, 4, 5], n => n > 2));\n```\n// → `[{name: false, count: 2}, {name: true,\
    \ count: 3}]`\n\nThe `countby` function anticipates a collection (a group of)\
    \ and correctly determines which script is used in a block of text.\n\n```javascript\n\
    Function textscripts(text) {\n  let scripts = countby(text, char => {\n    let\
    \ script = characterscript(char.codePointAt(0));\n    return script ? script.name\
    \ : \"none\";\n  }).filter(({name,}) => name != \"none\");\n\n  let total = scripts.reduce((n,\
    \ {count}) => n + count, 0);\n\n  if (total == 0) return \"no scripts found\"\
    ;\n\n  return scripts.map(({name, count}) => {\n    return `${math.round(count\
    \ * 100 / total)}% ${name}`;\n  }).join(\", \");\n}\n```\n\n```javascript\nConsole.log(textscripts('英国的狗说\"\
    woof\", 俄罗斯的狗说\"тяв\"'));\n```\n"
