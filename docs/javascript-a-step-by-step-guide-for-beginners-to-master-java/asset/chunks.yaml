  trans: "\nCommonjs 模块在与 `npm` 结合时表现良好，它们让 JavaScript 社区能够开始大规模地共享代码。这种语法非常奇怪。添加到\
    \ `exports` 中的内容在局部作用域内是不可见的。在不运行模块代码的情况下，在传入任何参数之前很难确定它的依赖关系。这就是 JavaScript 标准建立自己的独立模块系统的原因。它被称为\
    \ `es modules`，其中 `es` 代表 `ecmascript`。依赖和接口的初始想法不变，但细节有所不同。这种语法集成到了语言中。你现在可以使用一个唯一的\
    \ `import` 关键字来访问依赖，而不是调用函数。\n\n```\nImport ordinal from \"ordinal\";\n```\n\n\
    ```\nImport {days, months} from \"date-names\";\n```\n\n```\nExport function formatdate(date,\
    \ format) { /* ... */ }\n```\n\n使用 `export` 关键字来导出内容。它可以显示在类、函数或绑定定义（如 `const`\
    \ 或 `var`）的前面。`es` 模块的布局表示的单个值，而是一组命名绑定。上一个模块将 `formatdate` 附加到函数上。如果你从不同的模块导入，该绑定会随之而来，而不是值，这意味着导出模块的值可以随时更改绑定，而导入模块将识别出它的新值。如果绑定命名为\
    \ `default`，则会被识别为模块的主要导出值。如果一个模块（如示例中的 `ordinal` 导入）省略了绑定名称两侧的大括号，你将找到它的默认绑定。要开发默认导出，在表达式、类或函数声明之前编写\
    \ `export default`。\n\n```\nExport default [\"winter\", \"spring\", \"summer\"\
    , \"autumn\"];\n```\n\n你可以使用如下单词来重命名导入的绑定。\n\n```\nImport {days as daynames} from\
    \ \"date-names\";\n```\n\n```\nConsole.log(daynames.length);\n// → 7\n```\n\n\
    另一个主要区别是 `es` 模块的导入发生在模块脚本开始运行之前。`import` 声明可能不会显示在函数或块内部，且依赖项名称应该是引用字符串，而不是任意表达式。许多项目是通过\
    \ `es modules` 编写的，并在发布时更改为其他格式。在过渡期间，请并排使用两个独立的模块系统。\n\n# 模块设计\n\n程序结构化是编程的优秀特性之一。任何功能都可以以不同的方式建模。良好的设计是个性化的，这取决于喜好。要理解组织良好的设计的价值，你需要阅读并处理几个程序，并注意性能良好和不佳的函数。模块设计直观易用。`ini`\
    \ 包遵循标准 `object` 规范，通过提供 `stringify` 和 `parse`（用于写入文件）并像 `json` 一样在对象和字符串之间转换。许多文件解析模块提供了一个函数，可以从硬盘读取该类型的文件并进行解析。计算值的集中模块在很大范围的程序中比执行具有副作用的操作的模块更合适。如果文件内容来自另一个源，则文件读取器没有用处。同样，有状态的对象有时是必要且实用的，但如果你可以使用它们的话。各种文件读取器提供了一种布局样式，需要你将文件构建到对象中，并使用特定方法实现所需的结果。这是面向对象的风格和传统。在\
    \ JavaScript 中，没有表示图的特殊方法。npm 上有各种路径查找包，但没有一个利用了图的格式。它们通常允许边包含一个权重，即与此相关的距离或成本。例如，我们有\
    \ `dijkstrajs` 包。一种公认的与 `findroute` 函数相关的路径查找方法是先使用 `dijkstra` 包后使用 dijkstra 算法。`js`\
    \ 后缀通常附加在包名上，以指定你可以用 JavaScript 。所以，如果你想使用该包，请确保图以其预期的格式保存。\n\n```\nConst {find_path}\
    \ = require(\"dijkstrajs\");\nlet graph = {};\nfor (let node of object.keys(roadgraph))\
    \ {\n  let edges = graph[node] = {};\n  for (let dest of roadgraph[node]) {\n\
    \    edges[dest] = 1;\n  }\n}\nConsole.log(find_path(graph, \"post office,\",\
    \ \"cabin\"));\n// → [\"post office,\", \"alice,'s house,\", \"cabin\"]\n```\n\
    \n当多个包使用独立的数据结构来定义相关内容时，组合可能会成为障碍，并且很难将它们。因此，当你设计时，要确切知道他人正在使用的数据结构并遵循它们。\n\n\
    ## 总结\n\n在本章中，我们涵盖了模块。模块通过界定依赖和接口为更多内容提供了结构。接口是你从他人那里看到的模块。\n\n## 练习题\n\n编写一个\
    \ JavaScript 程序来显示当前的日期和时间。\n\n今天是星期二。\n\n当前时间：10 pm: 38\n"
- fmt: "\nIn the asynchronous programming model, everything occurs one at a time.\
    \ If you call a function that executes a long duration action, results will return\
    \ when the operation completes only. No other action would be able to take place\
    \ during execution. An asynchronous model enables several things to occur at the\
    \ same time. When an action begins, the program does not stop running. When the\
    \ task completes, it notifies the program and can access the result (for instance,\
    \ the information read from disk). You can differentiate between synchronous and\
    \ asynchronous programming through a little example: a program that obtains two\
    \ resources from the network and then unifies the results.\n\nIn an asynchronous\
    \ environment, the request returns when the work completes. The simplest way to\
    \ execute this task is to call the requests one after another. It consists of\
    \ the drawback that begins the second request only when the first task completes.\
    \ The sum of both response times will be the total time taken. To solve this problem\
    \ in a synchronous system, start adding threads of control. A thread is a running\
    \ program that its execution could be rendered with other programs through the\
    \ operating system because modern computers have several processors, various threads\
    \ can run at once, on separate processors. A second thread may begin the second\
    \ request, and then the two threads both wait for their results to return after\
    \ that, they resynchronize to unify both results. In the asynchronous model, the\
    \ network time is part of the timeline for a stated thread of control. In an asynchronous\
    \ model, launching a network action notion creates a division in the timeline.\
    \ The program that commences the action does not stop running, and then the action\
    \ occurs with it, it informs the program when it completes.\n\nAnother way to\
    \ determine the similarities is that waiting for tasks to complete is indirect\
    \ in the synchronous model, while it is directly under our control, in the asynchronous\
    \ one.\n\n### Callbacks\n\nOne procedure to asynchronous programming is to enable\
    \ functions that execute a slow action to gain an extra argument, and the argument\
    \ is called a callback function. When the action begins and ends, you should call\
    \ the result with the callback function. For instance, the `setTimeout` function,\
    \ accessible both in the browsers and node.js, waits a stated number of milliseconds\
    \ and then calls a function.\n\n```\nsetTimeout(() => console.log(\"tick\"), 500);\n\
    ```\n\nWaiting is not an ideal type of work, but can be applicable when you are\
    \ running programs like an animation update, or checking if a function is taking\
    \ longer than the specified time. Running several asynchronous tasks in a row\
    \ through callbacks signifies that you have to continue setting new functions\
    \ to control the continuation of the calculations after the actions.\n\nA lot\
    \ of crow nest computers consist of a longstanding storage, bulb, where data is\
    \ stored into twigs so that it can be accessed and restored later. Storing, or\
    \ searching for a piece of data takes little time, so the layout to longstanding\
    \ storage is asynchronous and utilizes callback functions. Storage bulbs save\
    \ bits of json-encorable data under names. A crow could save data about places\
    \ it has hidden food under the name \"food caches,\" that holds an array of names\
    \ that point at other pieces of data, defining the cache. To search for a food\
    \ cache in the storage bulbs of the big oak nest, a crow could run code this way:\n\
    \n```javascript\nImport {bigoak} from \"./crow-tech\";\n\nbigoak.readstorage(\"\
    food caches\", caches => {\n  let firstcache = caches[0];\n  bigoak.readstorage(firstcache,\
    \ info => {\n    Console.log(info);\n  });\n});\n```\n\nThis programming style\
    \ is practicable, but the indentation level expands with every asynchronous action\
    \ because it leads in another function. Performing some difficult task such as\
    \ running several actions concurrently, can get weird. Crow nest computers are\
    \ created to interact through requests. That means a request transfers a message\
    \ to other nest, which returns a message attaching a reply to nest. The reply\
    \ determines how it controls. The request returned by nest returns a message,\
    \ which is a reply to nest. The handle returned by nest returns a request. The\
    \ handle is a callback that the the the when the request arrives. To handle the\
    \ handle the request request, you must provide a callback `done` as its last argument.\n\
    \n```javascript\nbigoak.readstorage(\"food caches\", () => {\n  console.log(\"\
    note\");\n});\n```\n\nBut to make sure the request can return, let us note. If\
    \ you use the handle’s return value as the value of the response, that means a\
    \ request handle can’t execute actions itself. In a way, asynchronicity is contagious.\
    \ A function that calls a function that performs asynchronously must be asynchronous\
    \ itself.\n\n```javascript\nImport {requesttype} from \"./crow-tech\";\n\nrequesttype(\"\
    note\", (done) => {\n  console.log(`note: ${done}`);\n});\n```\n\nThe `requesttype`\
    \ function describes a new type. The example attaches support for requests that\
    \ send a message to a nest. The handle returned by nest returns a request, which\
    \ is a callback. The fourth argument stated to the handle, done, is a callback\
    \ function that calls when it has completed. The handle returned by nest returns\
    \ a request, the handle is a callback that the the nest returns.\n\n```javascript\n\
    requesttype(\"note\", (done) => {\n  done();\n});\n```\n\n### Promises\n\n[content\n"
