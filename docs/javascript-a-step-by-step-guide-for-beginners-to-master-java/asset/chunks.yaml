    \ a solution is to create a type of request that is sent automatically to neighbors.\
    \ These neighbors send it to their neighbors until the entire network has collected\
    \ the message.\n\n```javascript\nimport from \"crow\";every(nest => {\n  nest.state.gossip\
    \ = [];\n});\n\nfunction sendgossip(nest, message, exception = null) {\n  nest.state.gossip.push(message);\n\
    \  for (let neighbor of nest.neighbors) {\n    if (neighbor == exception) continue;\n\
    \    request(nest, neighbor, \"gossip\", message);\n  }\n}\n\nrequesttype(\"gossip\"\
    , (nest, message, source) => {\n  if (nest.state.gossip.include(message)) return;\n\
    \  console.log(`${nest.name} received gossip '${message}' from ${source}`);\n\
    \  sendgossip(nest, message, source);\n});\n```\n\nYou can avoid transferring\
    \ the similar message across the network forever every nest saves an array of\
    \ gossip strings that it has seen. To describe this array, use the `every` function\
    \ that runs on each nest to attach a property to the nest’s state.\n\n### Message\
    \ routing\n\nIf a set node wants to communicate with a single other node, the\
