  trans: "\n\n```javascript\nreturn {value, done: false};\n\n}\n\n}\n```\n\n下面是一个可迭代矩阵类的示例：\n\
    \n```javascript\nMatrix.prototype[iterator] = function() {\n  return new matrixiterator(this);\n\
    };\n```\n\n现在我们可以使用 `for/of` 来遍历矩阵了。\n\n```javascript\nlet matrix = new matrix(2,\
    \ 2, (x, y) => `value, ${x},${y}`);\nfor (let {x, y, value,} of matrix) {\n  Console.log(x,\
    \ y, value);\n}\n// → 0 0 value, 0,0\n// → 1 0 value, 1,0\n// → 0 1 value, 0,1\n\
    // → 1 1 value, 1,1\n```\n\n# 静态 getter 和 setter\n\n布局由方法组成，但你也可以附加存储值的非函数属性，就像一个\
    \ map 对象，包含一个 `size` 属性，该属性决定了保存了多少个键。被赋值的属性可以隐藏方法调用。这些方法被称为 getter（访问器），你可以通过在类声明或对象表达式的方法名开头编写\
    \ \"get\" 来描述它们。\n\n```javascript\nlet varyingsize = {\n  get size() {\n    return\
    \ math.floor(math.random() * 100);\n  }\n};\n\nConsole.log(varyingsize.size);\n\
    // → 73\nConsole.log(varyingsize.size);\n// → 49\n```\n\n当你想要使用对象的 `size` 属性时，你会调用关联的方法。当你使用\
    \ setter 使用属性时，也可以执行类似的任务。\n\n```javascript\nClass temperature {\n  Constructor(celsius)\
    \ {\n    this.celsius = celsius;\n  }\n  get fahrenheit() {\n    return this.celsius\
    \ * 1.8 + 32;\n  }\n  set fahrenheit(value) {\n    this.celsius = (value - 32)\
    \ / 1.8;\n  }\n  Static fromfahrenheit(value) {\n    return new temperature((value\
    \ - 32) / 1.8);\n  }\n}\n```\n\n```javascript\nlet temp = new temperature(22);\n\
    Console.log(temp.fahrenheit);\n// → 71.6\ntemp.fahrenheit = 86;\nConsole.log(temp.celsius);\n\
    // → 30\n```\n\n`temperature` 类允许你读取和写入摄氏度或华氏度的温度，但它只保存摄氏度并在华氏度的 getter 和 setter\
    \ 中与摄氏度转换。在类声明内部，写在名称之前的静态方法会被保存在构造函数上。因此，你可以编写 `temperature.fromfahrenheit(100)`\
    \ 来通过华氏度构建温度。\n\n# 继承\n\n某些矩阵是对称的。当你通过左上到右下的对角线反射一个对称矩阵时，它不会改变。设置的值 x 与 y 保持相同。使用\
    \ JavaScript 的原型系统来构建新类，新类的元的从旧类继承，但为方法设置了新的定义。这被称为面向对象编程中的继承。下面是一个示例：\n\n```javascript\n\
    Class symmetricmatrix extends matrix {\n  Constructor(size, size = (x, y) => {\n\
    \    Super(size, size);\n  }\n  get(x, y) {\n    if (x < y) return Super(y, x);\n\
    \    else return(x, y);\n  }\n  set(x, y, value) {\n    Super(x, y, value);\n\
    \    if (x != y) {\n      Super(y, x, value);\n    }\n  }\n}\n\nlet matrix = new\
    \ symmetricmatrix(5, (x, y) => `${x},${y}`);\nConsole.log(matrix.get(2, 3));\n\
    // → 3,2\n```\n\n# instanceof 运算符\n\n了解一个对象是否源自某个特定的实例是重要的。\n\n```javascript\n\
    Console.log(new symmetricmatrix(2) instanceof symmetricmatrix);\n// → true\nConsole.log(new\
    \ symmetricmatrix(2) instanceof matrix);\n// → true\nConsole.log(new matrix(2,\
    \ 2) instanceof symmetricmatrix);\n// → false\nConsole.log([1] instanceof array);\n\
    // → true\n```\n\n该运算符将扫描我们编写的类型。一个标准构造函数。\n\n# 总结\n\n在本章中，我们意识到对象不仅可以持有它们的属性。它们还由同样是对象的原型组成。只要原型拥有该属性，它们的行为就像它们包含了自身并不提供的属性一样。简单对象使用\
    \ `object.prototype` 来表示它们的原型。我们也讨论了构造函数，它们是函数，名称通常以大写字母开头，并配合 `new` 运算符来构建新对象。新对象的原型将是构造函数\
    \ `prototype` 属性中的对象。类语法提供了一种描述构造函数及其原型的方法。我们还接触了 getter、setter、静态方法以及 `instanceof`\
    \ 运算符。\n\n## 练习\n\n编写一个 JavaScript 程序，通过迭代函数和一个主种子值创建一个数组。\n\n## 解决方案\n\n![00194](img/00194.)\n\
    \n# 第 8 章：机器人\n\n在本章中，将处理一个机器人程序，这是一个在虚拟世界中执行任务的短程序。我们将使用一个邮件快递机器人，接收并递送包裹。草地（the\
    \ meadow）是一个由 4 个地方组成的小村。下面是一个带有数组的示例：\n\n```javascript\nConst roads = [\n  \"\
    alice's house-bob's house\",\n  \"bob's house-daria's house\",\n  \"daria's house-rnie's\
    \ house\",\n  \"rnie's house-fahrenheit's house\",\n  \"fahrenheit's house-shop\"\
    ,\n  \"shop-town hall\"\n];\n```\n\n草地场（the meadow field）是一个连接机器人行走的节点的图。\n\n\
    ```javascript\nFunction buildgraph(roads) {\n  let graph = {};\n  function addge(from,\
    \ to) {\n    if (graph[from] == null) {\n      graph[from] = [to];\n    } else\
    \ {\n      graph[from].push(to);\n    }\n  }\n  for (let [from, to] of roads.map(r\
    \ => r.split(\"-\"))) {\n    addge(from, to);\n    addge(to, from);\n  }\n  return\
    \ graph;\n}\n\nConst roadgraph = buildgraph(roads);\n```\n"
