  trans: "\n\n```javascript\nTodolist.unshift(task);\n\n}\n```\n\n上述程序组织了一个任务链。你可以通过调用\
    \ `remember(\"grieves\")` 将任务添加到队列的末尾，当你想完成某项任务时，调用 `getttask()` 从队列中获取（并移除）项。如果你想搜索特定的值，数组提供了\
    \ `indexOf` 方法。`find` 方法从从头到尾遍历数组，并返回所请求值的索引（`index`），如果找到了，则返回该索引；如果没有找到，则返回\
    \ -1。若要从头到尾搜索，请使用 `lastindex` 方法。\n\n```javascript\nConsole.log([1, 2, 3, 2, 4].indexOf(3));\n\
    // → 1\n\nConsole.log([1, 2, 3, 2, 4].lastindex(3));\n// → 3\n```\n\n`indexOf`\
    \ 和 `lastindex` 接受一个可选参数，指定搜索开始的位置。另一个很好的方法是 `slice`，该方法指定索引的起始和结束，并返回包含三个元素的数组。起始位置是包含的，而结束位置是不包含的。\n\
    \n```javascript\nConsole.log([0, 1, 2, 3, 5].slice(2, 4));\n// → [2, 3]\n\nConsole.log([0,\
    \ 1, 2, 3, 5].slice(2));\n// → [2, 3, 5]\n```\n\n如果未指定结束索引，`slice` 将取起始索引之后的所有元素。你可以使用\
    \ `concat` 方法将数组拼接在一起以生成新数组。下面的示例展示了 `concat` 和 `slice` 的用法。\n\n```javascript\n\
    function remove(arrays, index) {\n  return array.slice(0, index).concat(arrays.slice(index\
    \ + 1));\n}\n\nConsole.log(remove([\"a\", \"k\", \"c\", \"f\", \"e,], 2));\n//\
    \ → [\"a\", \"k\", \"f\", \"e\"]\n```\n\n### 字符串及其属性\n\n在字符串值章节中，我们讨论了 `length`\
    \ 和 `toupper`，但如果你想添加新属性，它是不会持久的。\n\n```javascript\nlet kim = \"kim\";\nKim.age\
    \ = 88;\nConsole.log(kim.age);\n// → undefined\n```\n\n所有字符串值都包含一些方法。其中一些 `slice`\
    \ 和 `indexOf` 方法在外观和名称上与数组方法相似。\n\n```javascript\nConsole.log(\"coconuts\".slice(4,\
    \ 7));\n// → nut\n\nConsole.log(\"coconut\".indexOf(\"u\"));\n// → 5\n```\n\n\
    字符串的 `indexOf` 可以查找包含多个字符的字符串，而对应的数组方法搜索的是单个元素。\n\n```javascript\nConsole.log(\"\
    one, two three,\".indexOf(\"ee\"));\n// → 11\n```\n\n`trim` 方法可以消除字符串开头和结尾的空白字符。\n\
    \n```javascript\nConsole.log(\"  okay  \\n  \".trim());\n// → okay\n```\n\n`zeropad`\
    \ 函数也可以称为 `padstart`，它接受首选的填充字符和长度作为参数。\n\n```javascript\nConsole.log(string(6).padstart(3,\
    \ \"0\"));\n// → 006\n```\n\n你可以使用 `split` 在另一个字符串出现的地方将字符串拆分，然后使用 `join` 将它们连接在一起。\n\
    \n```javascript\nlet sentence = \"secretarybirds specialize in stomping\";\nlet\
    \ words = sentence.split(\"  \");\nConsole.log(words);\n// → [\"secretarybirds\"\
    , \"specialize,\", \"in\", \"stomping\"]\n\nConsole.log(words.join(\".  \"));\n\
    // → secretarybirds. specialize,. in. stomping\n```\n\n你可以使用 `repeat` 方法重复字符串，它会生成一个包含多个原始字符串副本的新字符串。\n\
    \n```javascript\nConsole.log(\"la\".repeat(3));\n// → lalala\n```\n\n如果你想访问字符串中的单个字符，请看下文：\n\
    \n```javascript\nlet string = \"abc\";\nConsole.log(string.length);\n// → 3\n\n\
    Console.log(string[1]);\n// → b\n```\n\n### 剩余参数\n\n函数接收任意数量参数很重要。如果你想写这样的函数，在函数的最后一个参数之前添加三个点。\n\
    \n```javascript\nfunction max (...numbers) {\n  let result = -infinity;\n  for\
    \ (let number of numbers) {\n    if (number > result) result = number;\n  }\n\
    \  return result;\n}\n\nConsole.log(max(4, 1, 9, -2));\n// → 9\n```\n\n当你调用函数时，剩余的参数属于一个包含剩余参数的数组。你也可以利用三个点来在数组内调用函数。\n\
    \n```javascript\nlet numbers = [5, 7];\nConsole.log(max(...numbers));\n// → 7\n\
    ```\n\n扩展运算符可以将数组转换为新数组。\n\n```javascript\nlet words = [\"will\", \"fully\"];\n\
    Console.log(...words);\n// → will fully\n```\n\n`math` 对象用于整理大量值，它返回一个不带全局绑定的值。\n\
    \n```javascript\nfunction point(radius) {\n  let angle = math.random() * 2 * math.pi;\n\
    \  return {\n    x: radius * math.cos(angle),\n    y: radius * math.sin(angle)\n\
    \  };\n}\n\nConsole.log(point(2));\n// → {x: -0.67, y: 0.96}\n```\n\n`random`\
    \ 方法返回一个零到一之间的值。\n\n```javascript\nConsole.log(math.random());\n// → 0.3699...\n\
    ```\n\n`floor` 方法将值向下取整到最近的整数。\n\n```javascript\nConsole.log(floor(math.random()\
    \ * 10));\n// → 3\n```\n\n`ceil` 方法将值向上取整到最近的整数。\n\n```javascript\nConsole.log(ceil(math.random()\
    \ * 10));\n// → 7\n```\n\n`round` 方法将值四舍五入到最近的整数。\n\n```javascript\nConsole.log(round(math.random()\
    \ * 10));\n// → 5\n```\n\n`pow` 方法返回第一个参数的第二个参数幂。\n\n```javascript\nConsole.log(pow(2,\
    \ 3));\n// → 8\n```\n\n`sqrt` 方法返回数字的平方根。\n\n```javascript\nConsole.log(sqrt(16));\n\
    // → 4\n```\n\n`abs` 方法返回数字的绝对值。\n\n```javascript\nConsole.log(abs(-5));\n// →\
    \ 5\n```\n\n`min` 方法返回多个数值中的最小值。\n\n```javascript\nConsole.log(min(10, 5, 8));\n\
    // → 5\n```\n\n`max` 方法返回多个数值中的最大值。\n\n```javascript\nConsole.log(max(10, 5, 8));\n\
    // → 10\n```\n\n`PI` 常量提供圆周率的值。\n\n```javascript\nConsole.log(PI);\n// → 3.14159...\n\
    ```\n\n`E` 常量提供自然数的值。\n\n```javascript\nConsole.log(E);\n// → 2.71828...\n```\n\
    \n`log` 方法返回数字的自然对数。\n\n```javascript\nConsole.log(log(10));\n// → 2.302...\n\
    ```\n\n`log10` 方法返回以 10 为底的对数。\n\n```javascript\nConsole.log(log10(100));\n//\
    \ → 2\n```\n\n`log2` 方法返回以 2 为底的对数。\n\n```javascript\nConsole.log(log2(8));\n\
    // → 3\n```\n\n`tan` 方法返回弧角的正切值。\n\n```javascript\nConsole.log(tan(PI/4));\n//\
    \ → 1\n```\n\n`sin` 方法返回弧角的正弦值。\n\n```javascript\nConsole.log(sin(0));\n// → 0\n\
    ```\n\n`cos` 方法返回弧角的余弦值。\n\n```javascript\nConsole.log(cos(0));\n// → 1\n```\n\
    \n`atan` 方法返回弧角的正切值（此处原文可能误为 tan）。\n\n```javascript\nConsole.log(tan(PI/4));\n\
    // → 1\n```\n\n"
- fmt: "\nJSON represents javascript object notation and it is utilize as a communication\
    \ format and data storage, for the web. json is very similar to javascript in\
    \ its writing style, of arrays and object, although there are restrictions. its\
    \ property names should be enclosed within double quotes, it allows only simple\
    \ data expressions, binding etc. json do not allow comments.\n\nHere is a sample\
    \ of a journal entry represented as json data:\n\n```json\n{\n  \"squirrel\":\
    \ false,\n  \"events\": [\"work\", \"touched tree,\", \"pizza\", \"running\"]\n\
    }\n```\n\nJavascript consists of the functions `json.stringify` and `json.parse`,\
    \ to transform data to and from this format. `json.stringify` takes a javascript\
    \ value, and sends back a json-encoded string while `json.parse` takes a string\
    \ and transforms it to its encoded value.\n\n```javascript\nlet string = json.stringify({\n\
    \  squirrel: false,\n  Events: [\"weekend\"]\n});\n\nConsole.log(string);\n//\
    \ → {\"squirrel\":false,\"events\":[\"weekend\"]}\n\nConsole.log(json.parse(string).events);\n\
    // → [\"weekend\"]\n```\n\n### Reversing an array\nArrays consist of the `reverse`\
    \ method, which is used to change an array by reversing the order that its elements\
    \ display.\n\n### Summary\nWe covered the objects and arrays in this chapter,\
    \ and they create ways to categorize various values in a single value. fancifully,\
    \ this enables you to insert several associated items in a bag and move about\
    \ with the bag rather than enclosing your arms around every singular thing and\
    \ trying to keep them differently. a lot of values in javascript contain properties,\
    \ the inconsistency being undefined and null. you can access properties using\
    \ `value.prop` or `value[\"prop\"]`. you can use names for objects properties\
    \ and save a defined set of them. arrays, as well contain different amounts of\
    \ similar fanciful values and utilize the numbers (beginning from 0) as the property’s\
    \ names. arrays contain few sets of properties, which are the `length` and several\
    \ methods. methods are functions that reside within properties and behave on the\
    \ value they are its property. you can loop across arrays through a unique type\
    \ of for loop—for (the let element of an array).\n\nExercise\nWrite a javascript\
    \ function to obtain the first item in an array. setting a parameter 'n' will\
    \ send back the first 'n' elements of the array.\n\nData:\n```javascript\nConsole.log(array_clone([1,\
    \ 2, 4, 0]));\nConsole.log(array_clone([1, 2, [4, 0]]));\n// [1, 2, 4, 0]\n//\
    \ [1, 2, [4, 0]]\n```\nSolutions\n![0035.jpg](images/0035.jpg)![0184.jpg](images/0184.jpg)\n\
    \n## Chapter 6: higher-order functions\nA large program takes time to develop\
    \ and produces a lot of space for bugs, which in turn makes them hard to find.\
    \ here are examples of two programs: the first is self-contained and the state\
    \ is six lines.\n\n```javascript\nlet total = 0, count = 1;\nWhile (count <= 10)\
    \ {\n  Total += count;\n  Count += 1;\n}\nConsole.log(total);\n```\nThe second\
    \ depends on external functions and the state is one line long.\n\n```javascript\n\
    Console.log(sum(range(1, 10)));\n```\n\n### Abstraction\nWhen it comes to javascript\
    \ language, vocabulary’s use the term abstraction. abstraction is used to hide\
    \ details and gives the capability to talk about problems on a higher level. let\
    \ us differentiate two recipes for a soup. first: place 1 cup of dried peas within\
    \ a container. put enough water to cover the peas, let it soak for 12 hours. remove\
    \ it from the water and place it in a pot used for cooking with the addition of\
    \ four cups of water (4 cups). let it boil for about two hours, hold half of an\
    \ onion, slice it using a knife, and pour it into the peas, let it prepare for\
    \ 10 minutes. the second recipe: half an onion, a stalk of celery, 1 cup split\
    \ peas and a carrot. Dip the peas into the water for about 12 hours. boil it for\
    \ about 2 hours in water (4 cups), attach and slice vegetables cook it for 10\
    \ minutes. The computer performs tasks one by one, from blind to high-level concepts.\n\
    \n### Abstracting repetition\nPlain functions are used to create abstractions.\
    \ it is habitual for a program to repeat a particular function a specified amount\
    \ of time. you can achieve that with a loop like this:\n\n```javascript\nfor (let\
    \ i = 0; i < 10; i++) {\n  Console.log(i);\n}\n```\n\nHere we write a function\
    \ that calls `console.log` n times.\n\n```javascript\nfunction repeatlog(n) {\n\
    \  for (let i = 0; i < n; i++) {\n    Console.log(i);\n  }\n}\n```\n\nIf you want\
    \ to perform a task different from logging in numbers, you can roll action as\
    \ a function value.\n\n```javascript\nfunction repeat(n, action) {\n  for (let\
    \ i = 0; i < n; i++) {\n    Action(i);\n  }\n}\n\nrepeat(3, console.log);\n//\
    \ → 0\n// → 1\n// → 2\n```\n\nSometimes you do not need to roll in, use a defined\
    \ function as an alternative to repeat a loop:\n\n```javascript\nlet ls = [];\n\
    repeat(5, i => {\n  ls.push(i + 1);\n});\nConsole.log(ls);\n// → [\"1\", \"2\"\
    , \"3\", \"4\", \"5\"]\n```\n\nThis method looks similar to a loop; although the\
    \ body is inside function. Higher-order functions\nHigher-order functions are\
    \ functions that work on other functions by sending them back. this type of function\
    \ is used to hide details. for instance, you have a function that returns a function:\n\
    \n```javascript\nfunction greater(n) {\n  return m => m > n;\n}\n\nlet greater10\
    \ = greater(10);\nConsole.log(greater10(11));\n// → true\nConsole.log(greater10(5));\n\
    // → false\n```\n\nHigher-order functions can also take functions as arguments.\n\
    \n```javascript\nfunction filter(array, f) {\n```\n\n### Filtering arrays\nYou\
    \ can also have functions that can transform other functions.\n\n```javascript\n\
    function noisy(f) {\n  return (...args) => {\n    Console.log(\"calling with\"\
    , args);\n    let result = f(...args);\n    Console.log(\"returned\", result);\n\
    \    return result;\n  };\n}\n\nnoisy(math.min)(3, 2, 1);\n// → calling with [3,\
    \ 2, 1]\n// → returned 1\n```\n\nYou can as well write functions that produce\
    \ new set of control flow.\n\n```javascript\nfunction unless(test, action) {\n\
    \  if (!test) action();\n}\n\nrepeat(3, n => {\n  unless(n % 2 == 1, () => {\n\
    \    Console.log(n, \"is even\");\n  });\n});\n// → 0 is even\n// → 2 is even\n\
    ```\n\nThis method is a built-in array method, foreach, that produces a loop similar\
    \ to the for/of loop as a higher-order function.\n\n```javascript\n[\"a\", \"\
    b\"].forEach(l => Console.log(l));\n// → a\n// → b\n```\n"
