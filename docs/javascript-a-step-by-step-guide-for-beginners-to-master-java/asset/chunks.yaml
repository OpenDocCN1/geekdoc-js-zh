    ```\n// → `[{name: \"adlam\", ...}, ...]`\n\n该函数利用名为 `test` 的参数（一个函数值）来填补计算过程中的空白。它决定了由哪个\
    \ `element` 来接收。\n\n### 使用 map 进行转换\n\n`map` 方法通过为数组的每一个元素设置一个函数来更改数组，并根据返回值创建一个新数组。新数组的长度与输入数组相同，但会通过函数将其内容映射为重命名的形式。\n\
    \n```javascript\nFunction map(array, transform) {\n  let mapped = [];\n  For (let\
    \ element of array) {\n    mapped.push(transform(e,element));\n  }\n  return mapped;\n\
    }\n```\n\n```javascript\nlet rtlscripts = scripts.filter(s => s.direction == \"\
    rtl\");\nConsole.log(map(rtlscripts, s => s.name));\n```\n// → `[\"adlam\", \"\
    arabic\", \"imperial aramaic\", ...]`\n\n类似于 `foreach` 和 `filter`。\n\n### 使用 reduce\
    \ 进行汇总\n\n当你累加数字时，从零开始并将每个 foreach 元素加到总和上。`reduce` 的参数是 `map` 函数组合和初始值。这个函数比\
    \ `filter` 和 `map` 更容易理解，如下：\n\n```javascript\nFunction reduce(array, combine,\
    \ begin) {\n  let current = begin;\n  For (let items of arrays) {\n    existing\
    \ = combine(existing, element);\n  }\n  return existing;\n}\n```\n\n```javascript\n\
    Console.log(reduce([0,1, 2, 3, 4], (a, b) => a + b, 0));\n```\n// → `10`\n\n此函数与标准数组方法\
    \ `reduce` ，并提供了更多的舒适性。\n\n```javascript\nConsole.log([1, 2, 3, 4].reduce((a,\
    \ b) => a + b));\n```\n// → `10`\n\n如果你想利用 `reduce` 来搜索字符更多的脚本，可以这样写：\n\n```javascript\n\
    Function charactercount(script) {\n  return script.ranges.reduce((count, [from,\
    \ to]) => {\n    return count + (to - from);\n  }, 0);\n}\n```\n\n```javascript\n\
    Console.log(scripts.reduce((a, b) => {\n  return charactercount(a) < charactercount(b)\
    \ ? b : a;\n}));\n```\n// → `{name: \"han\", ...}`\n\n### 可组合性\n\n花点时间思考，如果没有高阶函数，我们的代码列表将会有多长。\n\
    \n```javascript\nlet biggest = null;\nFor (let script of scripts) {\n  If (biggest\
    \ == null ||\n  charactercount(biggest) < charactercount(script)) {\n    biggest\
    \ = script;\n  }\n}\nConsole.log(biggest);\n```\n// → `{name: \"han\", ...}`\n\
    \n当你想组合操作时，可以使用高阶函数。例如，这里有一行代码用于搜索数据集中活体和死脚本的平均值。\n\n```javascript\nFunction average(array)\
    \ {\n  return array.reduce((a, b) => a + b) / array.length;\n}\nConsole.log(math.round(average(scripts.filter(s\
    \ => s.living).map(s => s.length))));\n```\n// → `165`\n\n```javascript\nConsole.log(math.round(average(scripts.filter(s\
    \ => !s.living).map(s => s.length))));\n```\n// → `204`\n\n这段代码显示死脚本比活脚本更老。让我们从过滤掉死脚本（或活脚本）开始，计算它们的平均值。你也可以将计算写在一个大循环中：\n\
    \n```javascript\nlet total = 0, count = 0;\nFor (let script of scripts) {\n  If\
    \ (script.living) {\n    total += script.length;\n    Count += 1;\n  }\n}\nConsole.log(math.round(total\
    \ / count));\n```\n// → `165`\n\n我们的两个示例并不相同，第一个在执行 map 和 filter 时创建了新数组，而第二个计算数字。\n\
    \n### 字符串与字符编码\n\n数据集的重要用途之一是找出文本块使用的脚本。以下是一个执行该任务的程序。每个脚本都包含与其相关的字符编码数组。因此，如果你有一个字符编码，可以使用此函数搜索对应的脚本（如果可用）：\n\
    \n```javascript\nFunction characterscript(code) {\n  For (let script of scripts)\
    \ {\n    If (script.ranges.some([[from, to]) => {\n      return code >= from &&\
    \ code < to;\n    })) {\n      return script;\n    }\n  }\n  return null;\n}\n\
    ```\n\n```javascript\nConsole.log(charactersscript(121));\n```\n// → `{name: \"\
    latin\", ...}`\n\n另一个高阶函数是相同的方法。此方法获取一个测试函数，并判断该函数是否对数组中的任何组件返回 true。javascript\
    \ 字符串上有一些操作，例如使用 `length` 属性获取其长度，以及通过方括号评估其内容。\n\n```javascript\n// 两个 emoji\
    \ 字符，马和鞋子\nlet horse_shoe = \"\U0001F434\U0001F45F\";\nConsole.log(horse_shoe.length);\n\
    ```\n// → `4`\n\n```javascript\nConsole.log(horse_shoe[0]);\n```\n// → `(无效的半字符)`\n\
    \n```javascript\nConsole.log(horse_shoe.charCodeAt(0));\n```\n// → `55357 (半字符的编码)`\n\
    \n```javascript\nConsole.log(horse_shoe.codePointAt(0));\n```\n// → `128052 (马\
    \ emoji 的实际编码)`\n\nJavascript 的 `charCodeAt` 方法提供一个完整的 unicode 字符。此方法用于从字符串中提取字符。尽管发送给\
    \ `codePointAt` 的参数仍然是代码单元序列中的索引。如果你在跨字符串中使用 `codePointAt`，它会产生龙。\n\n```javascript\n\
    let dragon = \"\U0001F409\";\nFor (let char of dragon) {\n  Console.log(char);\n\
    }\n```\n// → `\U0001F409`\n\n`countby` 函数预期一个集合（一组）并返回一个对象列表。每个对象命名一个组，并确定该组中包含的元素数量。\n\
    \n```javascript\nFunction countby(items, groupname) {\n  let counts = [];\n  For\
    \ (let item of items) {\n    let name = groupname(item);\n    let known = counts.find(c\
    \ => c.name == name);\n    if (known == -1) {\n      counts.push({name, count:\
    \ 0});\n    } else {\n      known.count++;\n    }\n  }\n  return counts;\n}\n\
    ```\n\n```javascript\nConsole.log(countby([0,1, 2, 3, 4, 5], n => n > 2));\n```\n\
    // → `[{name: false, count: 2}, {name: true, count: 3}]`\n\n`countby` 函数预期一个集合（一组）并正确确定文本块中哪种脚本。\n\
    \n```javascript\nFunction textscripts(text) {\n  let scripts = countby(text, char\
    \ => {\n    let script = characterscript(char.codePointAt(0));\n    return script\
    \ ? script.name : \"none\";\n  }).filter(({name,}) => name != \"none\");\n\n \
    \ let total = scripts.reduce((n, {count}) => n + count, 0);\n\n  if (total ==\
    \ 0) return \"no scripts found\";\n\n  return scripts.map(({name, count}) => {\n\
    \    return `${math.round(count * 100 / total)}% ${name}`;\n  }).join(\", \");\n\
    }\n```\n\n```javascript\nConsole.log(textscripts('英国的狗说\"woof\", 俄罗斯的狗说\"тяв\"\
    '));\n```\n\n"
- fmt: "\nThe function `calculate` calculates the characters by name through the use\
    \ of `characterscript` to attach a name, and returning back to the string \"none,\"\
    \ for characters without any script. if you want to calculate percentages, you\
    \ need to determine the total amount of characters belonging to a script that\
    \ the `reduce` method can reduce. if it finds zero characters, the function sends\
    \ back the \"none,\" string.\n\n# Summary\nHaving the ability to send function\
    \ values to several functions is an essential aspect of javascript. it enables\
    \ writing functions that imitate computations with “gaps” between them. the code\
    \ that declares these functions can contain the gaps by giving function values.\
    \ arrays provide several important higher-order methods. use `foreach` to loop\
    \ across elements within an array. use the `filter` method to send back a new\
    \ array that has elements that convey the predicate function. changing an array\
    \ by setting each item through a function using the `map`. use `reduce` to merge\
    \ every component of an array to an individual value.\n\n# Exercises\nIllustrate\
    \ a javascript function that takes an array of numbers saved and searches for\
    \ the second-lowest and second highest numbers.\n\n# Solution\n![00160.jpg](images/00160.jpeg)![00139.jpg](images/00139.jpeg)\n\
    \n## Chapter 7: the secret life of objects\nWhen it comes to programming languages,\
    \ there is a set of technique that utilizes objects as a fundamental idea of program\
    \ organization, and they are called the object-oriented programming. its concept\
    \ will be explained further in this chapter.\n\n### Encapsulation\nThe primary\
    \ importance of object-oriented programming is to break programs into little pieces\
    \ and make sure each piece manages its section. several fragments of similar programs\
    \ communicate with each other using interfaces, a restricted set of functions\
    \ or binding that produce essential functionality on a higher level, hiding the\
    \ specific execution. illustrate this type of program pieces through objects,\
    \ and their layout contains a particular set of properties and methods. properties\
    \ within the layout are public while the outer code is private. define the accessible\
    \ layout in comments or documentation. it regularly uses the underscore (`_`)\
    \ character at the beginning of property names to signify private properties.\
    \ meanwhile, diving layouts from execution is called encapsulation.\n\n### Methods\n\
    Methods are properties that grasp function values.\n\n```javascript\nlet rabbit\
    \ = {};\n\nRabbit.speak = function(line,) {\n  Console.log(`the rabbit says '${line}'`);\n\
    };\n\nRabbit.speak(\"i'm alive.\");\n// → the rabbit says 'i'm alive.'\n```\n\n\
    When you call a function as a method, the binding calls it in its body and direct\
    \ the object it was called on.\n\n```javascript\nfunction speak(line,) {\n  Console.log(`the\
    \ ${this.type,} rabbit says '${line}'`);\n}\n\nlet white_rabbit = {type: \"white,\"\
    , speak};\nlet hungryrabbit = {type: \"hungry\", speak};\n\nWhite_rabbit.speak(\"\
    oh my whiskers,\" + \"how late it's getting!\");\n// → the white rabbit says 'oh\
    \ my whiskers, how late it's getting!'\n\nHungryrabbit.speak(\"i could use a carrot\
    \ right now.\");\n// → the hungry rabbit says 'i could use a carrot right now.'\n\
    ```\n\nArrow functions do not bind their own. you can write the following code:\n\
    \n```javascript\nFunction normal() {\n  Console.log(this.coords.map(n => n / this.length));\n\
    }\n\nNormal.call({coords: [0, 2, 3], length: 5});\n// → [0, 0.4, 0.6]\n```\n\n\
    ### Prototypes\nKeep an eye out on this.\n\n```javascript\nlet empty = {};\nConsole.log(empty.toString);\n\
    // → function toString() {}\nConsole.log(empty.toString());\n// → [object Object]\n\
    ```\n\nA property is pulled out of an object. a lot of objects consists of a prototype.\
    \ this is an alternative source of properties. a lot of objects do not contain\
    \ the property, they inherit from the prototype.\n\n```javascript\nConsole.log(Object.getPrototypeOf({}));\n\
    // Object.prototype\n\nConsole.log(Object.getPrototypeOf(null));\n// → null\n\
    ```\n\nThe prototype of an object is a method that transforms an object to a string.\
    \ a lot of objects do not contain the property, they inherit from the prototype;\
    \ functions inherit from array.\n\nThe prototype of a class contains methods that\
    \ are available to instances built through it.\n\n```javascript\nConsole.log(Object.getPrototypeOf(Object.create({}))\
    \ === Object.prototype);\n// → true\n\nConsole.log(Object.getPrototypeOf([]));\n\
    // Array.prototype\n```\n\nThe prototype of an object is a method that returns\
    \ the prototype of the object.\n\n```javascript\nlet empty = {};\nConsole.log(Object.getPrototypeOf(empty));\n\
    // Object.prototype\n```\n\nThe prototype of an object is a method that returns\
    \ the prototype of the object.\n\n```javascript\nlet proto = {\n  speak(line,)\
    \ {\n    Console.log(`the ${this.type,} rabbit says '${line}'`);\n  }\n};\n\n\
    let rabbit = Object.create(proto);\nrabbit.type = \"rabbit\";\n\nrabbit.speak(\"\
    hello!\");\n// → the rabbit says 'hello!'\n```\n\nThe prototype of an object is\
    \ a method that returns the prototype of the object.\n\n```javascript\nlet proto\
    \ = {\n  speak(line,) {\n    Console.log(`the ${this.type,} rabbit says '${line}'`);\n\
    \  }\n};\n\nlet rabbit = Object.create(proto);\nrabbit.type = \"rabbit\";\n\n\
    rabbit.speak(\"hello!\");\n// → the rabbit says 'hello!'\n```\n\nThe prototype\
    \ of an object is a method that returns the prototype of the object.\n\n```javascript\n\
    let proto = {\n  speak(line,) {\n    Console.log(`the ${this.type,} rabbit says\
    \ '${line}'`);\n  }\n};\n\nlet rabbit = Object.create(proto);\nrabbit.type = \"\
    rabbit\";\n\nrabbit.speak(\"hello!\");\n// → the rabbit says 'hello!'\n```\n\n\
    The prototype of an object is a method that returns the prototype of the object.\n\
    \n```javascript\nlet proto = {\n  speak(line,) {\n    Console.log(`the ${this.type,}\
    \ rabbit says '${line}'`);\n  }\n};\n\nlet rabbit = Object.create(proto);\nrabbit.type\
    \ = \"rabbit\";\n\nrabbit.speak(\"hello!\");\n// → the rabbit says 'hello!'\n\
