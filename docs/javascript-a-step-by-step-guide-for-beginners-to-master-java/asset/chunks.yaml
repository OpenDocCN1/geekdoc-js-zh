    \ environment runs one program at once. When there’s nothing to do, the loop stops.\
    \ But as events come in, they are attached to a queue, and their code performs\
    \ one after another. Because two things do not run at once, slow-running code\
    \ may hold up the handling of other events. The below example sets a timeout but\
    \ also lingers until after the timeout’s fixed point of time, making the timeout\
    \ to be late.\n\n```javascript\nlet start = date.now();\n\nsetTimeout(() => {\n\
    \  console.log(\"timeout ran at\", date.now() - start);\n}, 20);\n\nwhile (date.now()\
    \ < start + 50) {}\n\nconsole.log(\"wasted time until\", date.now() - start);\n\
    \n// → wasted time until 50\n// → timeout ran at 55\n```\n\nPromises resolve or\
    \ decline as a new event. Even if a promise is resolved already, waiting for it\
    \ will make your callback run after the existing script completes instead of immediately.\n\
    \n```javascript\nPromise.resolve(\"done,\").then(console.log);\n\nconsole.log(\"\
    me first!\");\n\n// → me, first!\n// → done,\n```\n\n### Asynchronous Bugs\n\n\
    When you run your program synchronously, there is no given occurring transformation\
