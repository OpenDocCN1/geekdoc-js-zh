    \      if (p.place != this.place) return p;\n      return {place: destination,\
    \ address: p.address};\n    }).filter(p => p.place != p.address);\n    return\
    \ new village,state(destination, parcels);\n  }\n}\n```\n\nThe `move` method is\
    \ the action center. it examines if a path leads from one place to another, if\
    \ not the old state is returned because the move is not valid. then it builds\
    \ a new state with the destination as the robot’s new place as well as building\
    \ a new set of parcels. the call to `map` handles the movement and the call to\
    \ `filter` handles delivering.\n\n```javascript\nlet first = new village,state(\n\
    \  \"post office,\",\n  [{place: \"post office,\", address: \"alice,'s house,\"\
    }]\n);\n\nlet next = first.move(\"alice,'s house,\");\n\nConsole.log(next.place);\n\
    // → alice,'s house,\n\nConsole.log(next.parcels);\n// → []\n\nConsole.log(first.place);\n\
    // → post office,\n```\n\n### Persistent Data\n\nUnchangeable data layouts are\
    \ called immutable or persistent. they act like strings and numbers. in javascript,\
    \ you can change almost everything. there is a function name `object.freeze` that\
    \ transforms an object so that it disregards writing to its properties.\n\n```javascript\n\
    let object = object.freeze({value: 5});\nobject.value = 10;\n\nConsole.log(object.value);\n\
    // → 5\n```\n\n### Simulation\n\nA delivery robot takes a good glance at the world\
    \ and determines what direction it moves to. therefore, a robot is a function\
    \ which takes a village,state object and sends back the name of a nearby place.\
    \ the robot sends back an object consisting of its intended direction and a memory\
    \ value, returned the next time, you call it.\n\n```javascript\nFunction runrobot(state,\
    \ robot, memory) {\n  for (let turn = 0;; turn++) {\n    if (state.parcels.length\
    \ == 0) {\n      Console.log(`done in ${turn} turns`);\n      break;\n    }\n\
    \    let action = robot(state, memory);\n    state = state.move(action.direction);\n\
    \    memory = action.memory;\n    Console.log(`moved to ${action.direction}`);\n\
    \  }\n}\n```\n\nThe robot can walk through different directions at every turn.\
    \ it can run into all parcels and then get to its delivery point. below is an\
    \ example:\n\n```javascript\nFunction randompick(array) {\n  let choice = math.floor(math.random()\
    \ * array.length);\n  return array[choice];\n}\n\nFunction randomrobot(state,)\
    \ {\n  return {direction: randompick(roadgraph[state.place])};\n}\n```\n\nIf you\
    \ want to test this unique robot, create a new state with few parcels.\n\n```javascript\n\
    Village,state.random = function(parcel,lcount = 5) {\n  let parcels = [];\n  for\
    \ (let i = 0; i < parcelcount; i++) {\n    let address = randompick(object.keys(roadgraph));\n\
    \    let place;\n    do {\n      place = randompick(object.keys(roadgraph));\n\
    \    } while (place == address);\n    parcels.push({place, address});\n  }\n \
    \ return new village,state(\"post office,\", parcels);\n};\n```\n\nThe `do` loop\
    \ continues to select new places when it gets a correct address. let’s start up\
    \ a virtual world.\n\nRunrobot(village,state.random(), randomrobot); // → advances\
    \ to mark // → advances to town hall // → run in 63 turns\n\nIt takes the robot\
    \ too many turns to transport the parcels because there was no plan. The mail\
    \ truck's route if you search a route that goes through all the places in the\
    \ village that could run twice by the robot, but there is a guarantee it will\
    \ run it. below is an example (starting from post office):\n\n```javascript\n\
    Const mailroute = [\n  \"alice,'s house,\", \"cabin,\", \"alice,'s house,\", \"\
    bob's house,\",\n  \"town hall,\" \"aria's house,\", \"ernnie's house,\", \"greete's\
    \ house,\",\n  \"shop\", \"greete's house,\", \"farm\", \"market,\", \"post office,\"\
    \n];\n```\n\nTo use the route, you need to utilize the robot memory. the rest\
    \ of the robot route is stored in its memory and dispatches the first every turn.\n\
    \n```javascript\nFunction route(state, memory) {\n  if (memory.length == 0) {\n\
    \    memory = mailroute;\n  }\n  return {direction: memory[0], memory: memory.slice(1)};\n\
    }\n```\n\nThe robot is faster now. it takes a maximum of 26 turns (twice the 13-step\
    \ route,) but often less.\n\n### Pathfinding\n\nAn interesting approach is to\
    \ develop routes from the starting point and inspect every available place that\
    \ has not been visited until it attains its goal. the below illustration explains\
    \ that:\n\n```javascript\nFunction findroute(graph, from, to) {\n  let work =\
