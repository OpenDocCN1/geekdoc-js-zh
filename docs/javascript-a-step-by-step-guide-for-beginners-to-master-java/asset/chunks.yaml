  trans: "\n`calculate` 函数通过使用 `characterscript` 绑定名称来按名称计算字符，对于没有任何脚本的字符，它返回字符串 \"\
    none\"。如果你想计算百分比，你需要确定属于 `reduce` 方法可以还原的脚本字符总数。如果找到零个字符，该函数将返回 \"none\" 字符串。\n\
    \n# 总结\n将函数值传递给多个函数的能力是 JavaScript 的一个至关重要的方面。它允许编写在之间存在“间隙”的模拟计算函数。声明这些函数的代码可以通过提供函数值来包含这些间隙。数组提供了几个重要的高阶方法。使用\
    \ `foreach` 遍历数组内的元素。使用 `filter` 方法返回一个包含符合谓词函数元素的新数组。使用 `map` 通过函数设置每个项来更改数组。使用\
    \ `reduce` 将数组的每个组件合并为一个单独值。\n\n# 练习\n阐述一个 JavaScript 函数，该函数接收一个保存的数字数组，并搜索第二低和第二高的数字。\n\
    \n# 解决方案\n![00160.jpg](img/00160.jpeg)![00139.jpg](img/00139.jpeg)\n\n## 第 7 章：对象的秘密生活\n\
    在编程语言方面，有一组技术将对象作为程序组织的基本思想，它们被称为面向对象编程。这一概念在本章中进一步解释。\n\n### 封装\n面向对象编程的主要意义是将程序拆成小部分，并确保每个部分都管理自己的区域。几个类似的程序片段通过接口相互通信，接口是一组受限制的函数或绑定，在更高层次产生基本功能，同时隐藏特定的执行细节。通过对象说明这种类型的程序片段，它们的布局包含特定的属性和方法。布局中的属性是公共的，而外部代码是私有的。在注释或文档中定义可访问的布局。通常在属性名称开头使用下划线（`_`）字符表示私有属性。同时，将布局与执行分离被称为封装。\n\
    \n### 方法\n方法是获取函数值的属性。\n\n```javascript\nlet rabbit = {};\n\nRabbit.speak = function(line,)\
    \ {\n  Console.log(`the rabbit says '${line}'`);\n};\n\nRabbit.speak(\"i'm alive.\"\
    );\n// → the rabbit says 'i'm alive.'\n```\n\n当你将函数作为方法调用时，绑定会在其体内部调用它，并指向调用它的对象。\n\
    \n```javascript\nfunction speak(line,) {\n  Console.log(`the ${this.type,} rabbit\
    \ says '${line}'`);\n}\n\nlet white_rabbit = {type: \"white,\", speak};\nlet hungryrabbit\
    \ = {type: \"hungry\" speak};\n\nWhite_rabbit.speak(\"oh my whiskers,\" + \"how\
    \ late it's getting!\");\n// → the white rabbit says 'oh my whiskers, how late\
    \ it's getting!'\n\nHungryrabbit.speak(\"i could use a carrot right now.\");\n\
    // → the hungry rabbit says 'i could use a carrot right now.'\n```\n\n箭头函数不绑定自己的\
    \ `this`。你可以编写以下代码：\n\n```javascript\nFunction normal() {\n  Console.log(this.coords.map(n\
    \ => n / this.length));\n}\n\nNormal.call({coords: [0, 2, 3], length: 5});\n//\
    \ → [0, 0.4, 0.6]\n```\n\n### 原型\n留意此点。\n\n```javascript\nlet empty = {};\nConsole.log(empty.toString);\n\
    // → function toString() {}\nConsole.log(empty.toString());\n// → [object Object]\n\
    ```\n\n属性是从对象中提取的。许多对象包含一个原型。这是属性的另一种来源。许多对象并不包含该属性，它们继承自原型。\n\n```javascript\n\
    Console.log(Object.getPrototypeOf({}));\n// Object.prototype\n\nConsole.log(Object.getPrototypeOf(null));\n\
    // → null\n```\n\n对象的原型是一个将对象转换为字符串的方法。许多对象并不包含该属性，它们继承自原型；函数继承自数组。\n\n类的原型包含了通过它构建的实例中可用的方法。\n\
    \n```javascript\nConsole.log(Object.getPrototypeOf(Object.create({})) === Object.prototype);\n\
    // → true\n\nConsole.log(Object.getPrototypeOf([]));\n// Array.prototype\n```\n\
    \n对象的原型是一个返回对象原型的方法。\n\n```javascript\nlet empty = {};\nConsole.log(Object.getPrototypeOf(empty));\n\
    // Object.prototype\n```\n\n对象的原型是一个返回对象原型的方法。\n\n```javascript\nlet proto = {\n\
    \  speak(line,) {\n    Console.log(`the ${this.type,} rabbit says '${line}'`);\n\
    \  }\n};\n\nlet rabbit = Object.create(proto);\nrabbit.type = \"rabbit\";\n\n\
    rabbit.speak(\"hello!\");\n// → the rabbit says 'hello!'\n```\n"
- fmt: "\nJavascript classes are constructor functions with a prototype, property.\
    \ below is a sample:\n\n```javascript\nClass rabbit {\n  Constructor(type) {\n\
    \    this.type = type;\n  }\n\n  Speak(line) {\n    console.log(`the ${this.type}\
    \ rabbit says '${line}'`);\n  }\n}\n```\n\nlet killerabbit = new rabbit(\"killer\"\
    );\nlet blackrabbit = new rabbit(\"black\");\n\nThe `class` keyword begins with\
    \ a `class` declaration, which enables you to describe a constructor and a set\
    \ of methods in a particular place. `class` declarations enable methods, properties\
    \ that grasp functions to be included in the prototype.. when you use an expression,\
    \ it does not describe a binding but provides the constructor as a value.. you\
    \ can exclude the class name in an expression.\n\n```javascript\nlet object =\
    \ new class {getword() { return \"hello\"; } };\n\nconsole.log(object.getword());\n\
    // → he,llo\n```\n\n\n\n### Overriding derived properties\n\nWhen a property is\
    \ added to an object, either available in the prototype or not, the property adds\
    \ to the object. if there was an assigned property with similar names in the prototype,,\
    \ it does not influence the object.\n\n```javascript\nRabbit.prototype.teeth =\
    \ \"small\";\n\nconsole.log(killerabbit.teeth);\n// → small\n\nkillerabbit.teeth\
    \ = \"long, sharp, and bloody\";\n\nconsole.log(killerabbit.teeth);\n// → long,\
    \ sharp, and bloody\n\nconsole.log(blackrabbit.teeth);\n// → small\n\nconsole.log(rabbit.prototype.teeth);\n\
    // → small\n```\n\nOverriding properties is used to best a standard function and\
    \ array prototypes a separate tostring method.\n\n```javascript\nconsole.log(array.prototype.toString\
    \ == Object.prototype.toString);\n// → false,\n\nconsole.log([1, 3].toString());\n\
    // → 1,3\n```\n\nCalling `toString` on an array stores a result that is liked\
    \ to calling `join(\",\")` on it.. it places a comma between the values contained\
    \ in the array.. if you call `object.prototype.toString` to an array, it provides\
    \ a separate string.\n\n```javascript\nconsole.log(object.prototype.toString.call([1,\
    \ 3]));\n// → [object array]\n```\n\n### Maps\n\nA map is a data layout that connects\
    \ values with other values.. if you want to map names to ages, write your code,\
    \ like this:\n\n```javascript\nlet ages = {\n  Boris: 39,\n  Liang: 22,\n  Júlia:\
    \ 62\n};\n\nconsole.log(`julia is ${ages[\"julia\"]}`);\n// → julia is 62\n\n\
    console.log(\"is jack's age, known?\", \"jack\" in ages);\n// → is jack's age,\
    \ known? false,\n\nconsole.log(\"is tostring's age, known?\", \"tstring\" in ages);\n\
    // → is tostring's age, known? true,\n```\n\nObject property names should be in\
    \ strings.. if you want a map that the keys cannot be transformed to strings,\
    \ do not use `object` as a map.. javascript contains a class called `map`. it\
    \ saves mapping and enables different types of keys.\n\n```javascript\nlet ages\
    \ = new map();\n\nages.set(\"boris\", 39);\nages.set(\"liang\", 22);\nages.set(\"\
    júlia\", 62);\n\nconsole.log(`jlia is ${ages.get(\"júlia\")}`);\n// → julia is\
    \ 62\n\nconsole.log(\"is jack's age, known?\", ages.has(\"jack\"));\n// → is jack's\
    \ age, known? false,\n\nconsole.log(ages.has(\"tstring\"));\n// → false,\n```\n\
    \nThe methods `get`, `set` and `has` are bodies of the layout of the map object..\
    \ object.keys returns an object’s keys only.. you can use the `has` property method\
    \ as an option.\n\n```javascript\nconsole.log({x: 1}.has(\"x\")); // → true,\n\
    console.log({x: 1}.has(\"toString\")); // false,\n```\n\n### Polymorphism\n\n\
    When a string function is called on an object the `toString` method is called\
    \ on that object in order to build a significant string.. you can define your\
    \ own version of `toString` so that they can build a string that consists of more\
    \ data than the \"[object object]\". below is an illustration:\n\n```javascript\n\
    Rabbit.prototype.toString = function() {\n  return `a ${this.type} rabbit`;\n\
    };\n\nconsole.log(blackrabbit);\n// → a black rabbit\n```\n\nSymbols are unique\
    \ values built with the `symbol` function which cannot be built twice..\n\n```javascript\n\
    let sym = symbol(\"name\");\n\nconsole.log(sym == symbol(\"name\")); // false,\n\
    \nRabbit.prototype[sym] = 55;\n\nconsole.log(blackrabbit[sym]); // → 55\n```\n\
    \nThe string passed to `symbol` is attached when you transform it to a string..\
    \ they are distinctive functions as property names.\n\n```javascript\nconst toString\
    \ = symbol(\"toString\");\nArray.prototype[toString] = function() {\n  return\
    \ `${this.length} cm of yarn`;\n};\n\nconsole.log([1, 2].toString()); // 1,2\n\
    console.log([1, 2][toString]()); // 2 cm of yarn\n```\n\nIterator interfaces\n\
    \nThe state object to a `for/of` loop is iterable.. this means that it consists\
    \ of a named method with `symbol.iterator` when the property is called.. the method\
    \ sends back an object that produces a second layout it contains a `next` method\
    \ that sends back the following result.. the result is an object with a `value`\
    \ property that produces the `next` value,, `symbol.iterator` can be added to\
    \ several objects.. check this layout:\n\n```javascript\nlet iterator = \"ok\"\
    [symbol.iterator]();\n\nconsole.log(iterator.next()); // → {value: \"o\", done:\
    \ false}\n\nconsole.log(iterator.next()); // → {value: \"k\", done: false}\n\n\
    console.log(iterator.next()); // → {value: undefined, done: true,}\n```\n\nLet’s\
    \ implement an iterable data structure,, we’ll build a `matrix` class, acting\
    \ As a two-dimensional array\n\n```javascript\nclass matrix {\n  Constructor(width,\
    \ height, element = (x, y) => undefined) {\n    this.width = width;\n    this.height\
    \ = height;\n    this.content = [];\n    for (let y = 0; y < height; y++) {\n\
    \      for (let x = 0; x < width; x++) {\n        this.content[y * width + x]\
    \ = element(x, y);\n      }\n    }\n  }\n\n  get(x, y) {\n    return this.content[y\
    \ * width + x];\n  }\n\n  set(x, y, value) {\n    this.content[y * width + x]\
    \ = value;\n  }\n}\n```\n\nThe content of the class is saved in an individual\
    \ array of width × height elements.. these elements are saved row after row..\
    \ the constructor function gets a width, height, and an additional element function\
    \ which is used to set the initial values.. use the `get` method and `set` method\
    \ to recover and update elements within the matrix.. below is the layout of objects\
    \ with x, y, and value properties.\n\n```javascript\nclass matrixiterator {\n\
    \  Constructor(matrix) {\n    this.x = 0;\n    this.y = 0;\n    this.matrix =\
    \ matrix;\n  }\n\n  next() {\n    if (this.y === this.matrix.height) {\n     \
    \ return {done: true};\n    }\n    let value = {\n      x: this.x,\n      y: this.y,\n\
    \      value: this.matrix.get(this.x, this.y)\n    };\n    this.x++;\n    if (this.x\
    \ === this.matrix.width) {\n      this.x = 0;\n      this.y++;\n    }\n    return\
    \ value;\n  }\n}\n```\n"
