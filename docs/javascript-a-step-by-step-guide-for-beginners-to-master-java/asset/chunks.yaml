    你可以按照字母顺序对字符串进行指令，大写字母通常“小于”小写字母，因此 "z" < "a"，且非字母字符（`!`、`-`、`,` 等）也存在于排序中。当 javascript
    想要比较字符串时，它会从左到右识别字符，逐个区分 unicode 编码。


    这里是其他相关的运算符 `<=`（小于等于）、`>=`（大于等于）、`==`（等于）和 `!=`（不等于）。


    ```

    Console.log("itchy" != "scratchy")

    // → true

    ```


    ```

    Console.log("apple" == "orange")

    // → false

    ```


    在 javascript 中，只有一个值不等于它自己，那就是 `nan`（不是数字数字）。


    ```

    Console.log(nan == nan)

    // → false

    ```


    ### 逻辑运算符


    Javascript 仅支持三种可以应用于布尔值的运算符，它们是 `and`、`or` 和 `not`。`&&` 运算符表示逻辑与，其结果取决于输入的值是
    `true` 还是 `false`。


    ```

    Console.log(true && false)

    // → false

    Console.log(true && true)

    // → true

    ```


    `||` 运算符表示逻辑或。如果给定的值为 `true`，则该运算符输出 `true`。


    ```

    Console.log(false || true)

    // → true

    Console.log(false || false)

    // → false

    ```


    感叹号 `!` 表示“非”。它是一个翻转设定值的运算符，它将 `true` 变为 `false`，将 `false` 变为 `true`。


    `||` 具有所有运算符中最低的优先级，然后是 `&&`、比较运算符（`>`、`==` 等）等等。下面的示例说明括号是必要的：


    ```

    1 + 1 == 2 && 10 * 10 > 50

    ```


    ### 空值


    `null` 和 `undefined` 是仅两个用于表示重要值缺失的特殊值类型。它们不包含任何数据。


    ### 自动类型转换


    之前我提到过 javascript 接受几乎所有给定的程序，包括行为异常的程序。自动类型转换在以下表达式中得到了体现：


    ```

    Console.log(8 * null)

    // → 0

    Console.log("5" - 1)

    // → 4

    Console.log("5" + 1)

    // → 51

    Console.log("five" * 2)

    // → nan

    Console.log(false == 0)

    // → true

    ```


    当你给运算符分配错误的值时，javascript 会使用类型转换规则静默地将该值转换为其所需的精确类型。在第一个表达式中，`null` 变为 `0`，第二个中的
    `5` 保持为 `5`（从字符串转换为数字）。在第三个表达式中，在数值相加之前存在字符串拼接，这会将 `1` 转换为 `"1"`（从数字转换为字符串）。当像
    "five" 这样的奇数转换为数字时，得到的值是 `nan`。如果你想使用 `==` 区分两个相同类型的值，如果值相似，输出应为 `true`。如果你想测试一个值是否包含真实值，请使用
    `!=` 运算符或比较运算符进行比较。


    ### 逻辑运算符的短路


    `&&` 和 `||` 被称为逻辑运算符。它们用于以特定方式持有多种类型的值。它们将左侧包含的值转换为布尔类型以决定，尽管这取决于运算符和生成结果的类型，但始终会返回左侧或右侧的值。`||`
    运算符可以在转换为 `true` 时返回左侧的值，并将返回右侧的值。


    ```

    Console.log(null || "user")

    // → user

    Console.log("kate" || "user")

    // → kate

    ```


    此函数用于将值返回到默认值，并作为空值的替换放置。字符串和数字的布尔转换规则规定，`0`、`nan` 和空字符串 `""` 视为 `false`，而其他值均为
    `true`。因此 `0 || -1` 输出 `-1`，`"" || "!?"` 产生 `!?`。`&&` 运算符的操作方式相同但方向相反。当左侧的值可以转换为
    `false` 时，返回该值，或者将其发送到右侧。两个运算符只在需要时评估右侧的值。例如，我们有如下设定值 `true || x`，`x` 的值将是 `true`
    而不会考虑它。同样的规则也适用于 `false && x`，`x` 为 `false` 会被忽略。你可以将此过程称为短路求值。


    ### 总结


    本章介绍了 javascript 值的四类：字符串、数字、`undefined` 值和布尔值。这些值通过将它们的名称插入 `true`、`null` 或值（13,
    "abc"）来生成。运算符可以整合并改变值。我们查看了算术二进制运算符（`+`、`-`、`*`、`/` 和 `%`）、字符串拼接（`+`）、比较（`==`、`!=`、`===`、`!==`、`<`、`>=`）、逻辑（`&&`、`||`），以及用于根据第三个值选择一个值的单元运算符（`-`）和三元运算符（`?:`）。


    通过定义的名称创建一个变量。


