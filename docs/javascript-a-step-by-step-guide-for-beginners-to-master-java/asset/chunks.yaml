    function direction(question) {\n  let result = prompt(question);\n  If (result.toLowerCase()\
    \ == \"left\") return \"l\";\n  If (result.toLowerCase() == \"right\") return\
    \ \"r\";\n  Throw error(\"invalid direction: \" + result);\n}\n\nfunction look()\
    \ {\n  If (prompt(\"which way?\") == \"l\") {\n    Return \"a house,\";\n  } else\
