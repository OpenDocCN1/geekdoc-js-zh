    \n```javascript\nFor (;;) {\n  Try {\n    let dir = promtdirection(\"where?\"\
    ); // ← typo!\n    console.log(\"you select \", dir);\n    Break;\n  } catch (e)\
    \ {\n    console.log(\"invalid direction. try again.\");\n  }\n}\n```\n\nThe `for\
    \ (;;)` construct is used to build a loop that cannot be terminated on its own..\
    \ you can break out of the loop when you have a valid direction, but a misspelled\
    \ `promptdirection` will output an undefined variable error.. if you want to catch\
