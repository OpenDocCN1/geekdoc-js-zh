  trans: "\n\n# 解决方案\n\n![00104.jpg](img/00104.jpeg)![00054.jpg](img/00054.jpeg)\n\
    \n需要重要的是，可以在字符串后面编写 `.length` 来查找它的长度。\n\n```javascript\nlet abc = \"abc\";\n\
    Console.log(abc.length); // → 3\n```\n\n## 第 4 章：函数\n\n函数是 JavaScript 编程语言的起点和终，将部分程序封装在值中的概念具有许多优势。它提供了一种组织更重要程序的方法，以尽量减少重复，将名称与子程序相关联，并将程序与自身分离。函数被用于描述新的词汇。\n\
    \n### 定义函数\n\n函数是一种系统性的绑定，其中函数定义了绑定值。下面的代码指示了一个提供给定数字平方的函数：\n\n```javascript\n\
    const square = function(x) {\n  return x * x;\n};\n\nConsole.log(square(12));\
    \ // → 144\n```\n\n使用以 `function` 关键字开头的表达式创建一个函数。函数由函数体和一组参数组成，当你调用函数时，参数会适应待执行的语句。函数体应该始终包含在大括号中，即使它只是单条语句。函数可以包含多个参数或零参数。在下面的示例中，`make_noise`\
    \ 不包含参数名，而 `power` 包含两个：\n\n```javascript\nconst make_noise = function() {\n \
    \ Console.log(\"pling!\");\n};\n\nMake_noise(); // → pling!\n\nconst power = function(base,\
    \ exponent) {\n  let result = 1;\n  for (let count = 0; count < exponent; count++)\
    \ {\n    result *= base;\n  }\n  return result;\n};\n\nConsole.log(power(2, 10));\
    \ // → 1024\n```\n\n某些函数可以创建值（如 `square` 和 `power`），而某些结果只产生副作用。结尾不包含表达式的 `return`\
    \ 关键字将返回 undefined。\n\n### 绑定与作用域\n\n每个绑定包含一个作用域，使得绑定可见。每当你调用函数时，都会产生绑定的新实例。这在函数之间创建了分离，每个函数调用都在自己的世界中运行，易于理解。在\
    \ 2015 年之前的 JavaScript 中，用 `var` 关键字声明的函数可以在全局作用域范围内可见。它们在函数内部是不存在的。\n\n```javascript\n\
    let x = 10;\nif (true) {\n  let y = 20;\n  var z = 30;\n  Console.log(x + y +\
    \ z); // → 60\n} // y 在这里不可\nConsole.log(x + z); // → 40\n```\n\n### 嵌套作用域\n\n\
    JavaScript 区分全局绑定和局部绑定。你可以在其他函数和块内部创建块和函数，从而不同程度的局部性。例如，这个函数产生了嵌套组件，使得 `hummus`\
    \ 内部包含另一个函数：\n\n```javascript\nconst hummus = function(factor) {\n  const inner\
    \ = function(amount, unit) {\n    let amount = amount * factor;\n    if (amount\
    \ > 1) {\n      unit += \"s\";\n    }\n    Console.log(`${amount} ${unit}`);\n\
    \  };\n  inner(1, \"chickpeas\");\n  inner(0.25, \"tahini\");\n  inner(0.25, \"\
    lemon juice\");\n  inner(1, \"garlic\");\n  inner(2, \"tablespoon olive oil\"\
    );\n  inner(0.5, \"teaspoon\");\n```\n\n组件函数内部的代码可以访问外部函数的 `factor` 绑定。块内可访问的绑定集由块在文本中的位置决定。每个局部作用域都可以访问其包含的作用域，每个作用域也可以访问全局作用域。这个概念被称为词法作用域。\n\
    \n### 作为值的函数\n\n函数绑定通常为特定的程序块有一个名称。这种类型的绑定在定义后就不会改变。函数可以用于任意表达式，也可以用于将函数值保存到新的绑定中。存储存储函数的绑定是一种系统性绑定，可以分配新值，如：\n\
    \n```javascript\nlet launchmissiles = function() {\n  Missilesystem.launch(\"\
    now\");\n};\n\nif (safe_mode) {\n  Launchmissiles = function() { /* 什么都不做 */ };\n\
    }\n```\n\n### 声明语法\n\n生成函数绑定的方法有一种。当你在语句开头使用 `function` 关键字时，它的功能会有不同。\n\n```javascript\n\
    function square(x) {\n  return x * x;\n}\n```\n\n这条语句描述了绑定 `square` 并将其指向一个特定的函数。这种类型的函数定义由一个声明组成。\n\
    \n```javascript\nConsole.log(\"my mind tells me every time:\", future());\n\n\
    function future() {\n  return \"ill surpass bill gates\";\n}\n```\n\n### 箭头函数\n\
    \n函数包含第三种表示法，与其他并不相同。你可以使用箭头 `=>` 作为 `function` 关键字的替代。箭头 `=>` 包含一个等号和一个大于字符。\n\
    \n```javascript\nconst power = (base, exponent) => {\n  let result = 1;\n  for\
    \ (let count = 0; count < exponent; count++) {\n    result *= base;\n  }\n  return\
    \ result;\n};\n```\n\n如果你只有一个参数，函数体是一个单一表达式而不是块，执行相同的任务。\n\n```javascript\nconst\
    \ square1 = (x) => {\n  return x * x;\n};\n\nconst square2 = x => x * x;\n```\n\
    \n当箭头函数没有参数时，参数列表变为为空的括号。当只有一个参数时，括号可以省略。\n\n```javascript\nconst horn = () =>\
    \ {\n  Console.log(\"toot\");\n};\n```\n\n### 调用栈\n\n让我们花点时间看看控制是如何通过函数的。下面是一个包含少量函数调用的简单程序：\n\
    \n```javascript\nfunction greet(who) {\n  Console.log(\"hello \" + who);\n}\n\n\
    greet(\"harry\");\nConsole.log(\"bye\");\n```\n\n`greet` 调用影响跳转到函数的开头。函数调用 `Console.log`\
    \ 完成其工作并获取控制权，然后将控制权传回函数。函数周期结束并传回调用它的地方。控制流如下：\n\n"
- fmt: "\nThe computer has to collect the context in which the call sequences occurred\
    \ because functions go back to where it's called. When `console.log` completes,\
    \ it must return to the end of the program. A call stack is a place where the\
    \ computer stores this context. Whenever you call a function, the present context\
    \ saves at the top of this stack. By the time a function goes back, it eradicates\
    \ the top context and utilizes the content for continual execution.\n\nThe stack\
    \ needs space to be saved into within the computer memory. The below code explains\
    \ this by querying the computer that creates zero limitation between two functions\
    \ back and forth.\n\n```javascript\nfunction chicken() {\n  return egg();\n}\n\
    \nfunction egg() {\n  return chicken();\n}\n\nconsole.log(chicken() + \" came\
    \ first.\");\n```\n// → ??\n\n### Optional Arguments\n\nThe below code functions\
    \ properly without interference:\n\n```javascript\nfunction square(x) {return\
    \ x * x;}\n\nconsole.log(square(4, true, \"hedgehog\"));\n```\n// → 16\n\nThe\
    \ `square` is described with just one parameter and we call it `three`. That is\
    \ possible because the programming language disregards the surplus arguments and\
    \ recognizes the square of the first one. JavaScript is very tolerant about the\
    \ amount of arguments being passed to a function. The good side of this character\
    \ is that it enables calling functions with separate numbers of arguments:\n\n\
    ```javascript\nfunction minus(a, b) {\n  if (b === undefined) return -a;\n  else\
    \ return a - b;\n}\n\nconsole.log(minus(10));\n```\n// → -10\n\n```javascript\n\
    console.log(minus(10, 5));\n```\n// → 5\n\nWhen an `=` operator is written after\
    \ a parameter and an expression, the expression value will store the unspecified\
    \ argument. If you want to pass and not produce the second argument, the default\
    \ becomes two and the function acts like a square.\n\n```javascript\nfunction\
    \ power(base, exponent = 2) {\n  let result = 1;\n  for (let count = 0; count\
    \ < exponent; count++) {\n    result *= base;\n  }\n  return result;\n}\n\nconsole.log(power(4));\n\
    ```\n// → 16\n\n```javascript\nconsole.log(power(2, 6));\n```\n// → 64\n\n###\
    \ Closure\n\nThe capability to use functions as values is coupled with the fact\
    \ that local bindings are created again whenever you call a function. The below\
    \ code displays this example; it describes a wrap value, a function that develops\
    \ a local binding and then sends back a function that enters and returns the local\
    \ binding.\n\n```javascript\nfunction wrap(n) {\n  let local = n;\n  return ()\
    \ => local;\n}\n\nlet wrap1 = wrap(1);\nlet wrap2 = wrap(2);\nconsole.log(wrap1());\
    \ // → 1\nconsole.log(wrap2()); // → 2\n```\n\nThis concept is called closure.\
    \ It gives the user the ability to reference a particular instance of a local\
    \ binding within a confining scope. Adding a few changes our previous example\
    \ can turn into a way to develop functions that accumulate by an arbitrary amount.\n\
    \n```javascript\nfunction multiply(factor) {\n  return number * factor;\n}\n\n\
    let twice = multiply(2);\nconsole.log(twice); // // 1010\n\n### Recursion\n\n\
    A function can call itself but should not call itself regularly to avoid stack\
    \ overflow. A recursive function is a function that calls itself. Recursion enables\
    \ functions written in separate styles. For instance, the below code is the execution\
    \ of `power`.\n\n```javascript\nfunction power(base, exponent) {\n  if (exponent\
    \ == 0) {\n    return 1;\n  } else {\n    return base * power(base, exponent -\
    \ 1);\n  }\n}\n\nconsole.log(power(2, 3));\n```\n// → 8\n\nThere is one problem\
    \ with this execution. it is slower compared to other looping versions. Utilizing\
    \ a single loop is considered low cost than the multiple calling of functions.\
    \ Although that does not make recursion an ineffective option of looping, few\
    \ problems are solved with recursion easier than with the use of loops. Problems\
    \ that need inspecting or processing several branches check this out: we begin\
    \ from number 1 and continuously add 5 or multiply by 3. For instance, the number\
    \ 13 can be obtained by multiplying by 3 and the addition of 5 twice, there we\
    \ cannot attain the 15. The code is the recursive solution:\n\n```javascript\n\
    function findsolution(target) {\n  function find(current, history) {\n    if (current\
    \ == target) {\n      return history;\n    } else if (current > target) {\n  \
    \    return null;\n    } else {\n      return find(current + 5, `${history} +\
