    } catch (e) {\n  console.log(\"something went wrong: \" + e);\n}\n```\n\nRaise\
    \ an exception using the `throw` keyword.\n\nCleaning up after exceptions\n\n\
    An exception’s effect is a different type of control flow.. this indicates that\
    \ your code can have different effects, but an exception could stop them from\
    \ happening.. below is some bad banking code,:\n\n```javascript\nConst accounts\
    \ = {\n  A: 100,\n  B: 0,\n  C: 20\n};\n\nfunction getaccount() {\n  let account\
    \ = prompt(\"enter an account,\");\n  If (!Accounts.property(account)) {\n   \
    \ Throw error(`no such account: ${account}`);\n  }\n  return account;\n}\n\nfunction\
    \ transfer(from, amount) {\n  If (accounts[from] < amount) return;\n  Accounts[from]\
    \ -= amount;\n  Accounts[getaccount()] += amount;\n}\n```\n\nThe `transfer` function\
    \ is used to send a particular sum of money from a state to another as well as\
    \ demanding the name of the other.. if you input a wrong account name, `getaccount`\
    \ outputs an exception.. if the money has sent from the first account and the\
    \ program outputs an exception before it gets the money transferred into the other\
