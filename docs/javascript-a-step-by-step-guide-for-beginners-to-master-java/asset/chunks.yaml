  trans: "\n\n`<body>` 部分内部的脚本。\n\n`<body>` 和 `<head>` 部分的脚本。\n\n在`<head>...</head>`\
    \ 部分引入外部文件脚本。\n\n### `<head>...</head>` 区域中的 Javascript\n\n在某些情况下，当你想让脚本在特定事件发生运行时（例如点击按钮时的操作）时，可以将脚本按如下放在\
    \ `head` 区域：\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\">\n<!--\n\
    Function sayhi() {\n  Alert(\"hello world\")\n}\n//-->\n</script>\n</head>\n<body>\n\
    点击此处获取结果\n<input type=\"button\" onclick=\"sayhi()\" value=\"say hi\" />\n</body>\n\
    </html>\n```\n\n### `<body></body>` 区域中的 Javascript\n\n有时你希望脚本立即运行并在内容页面上创建脚本，这时，请将脚本插入到\
    \ `<body>` 部分。代码看起来应该是这样的：\n\n```html\n<html>\n<head>\n</head>\n<body>\n<script\
    \ type=\"text/javascript\">\n<!--\nDocument.write(\"hello world\")\n//-->\n</script>\n\
    <p>this is web page body</p>\n</body>\n</html>\n```\n\n### `<body>` 和 `<head>`\
    \ 区域中的 Javascript\n\n将你的 javascript 代码按如下所示插入 `<head>` 和 `<body>` 部分：\n\n```html\n\
    <html>\n<head>\n<script type=\"text/javascript\">\n<!--\nFunction sayhi() {\n\
    \  Alert(\"hello world\")\n}\n//-->\n</script>\n</head>\n<body>\n<script type=\"\
    text/javascript\">\n<!--\nDocument.write(\"hello world\")\n//-->\n</script>\n\
    <input type=\"button\" onclick=\"sayhi()\" value=\"say hi\" />\n</body>\n</html>\n\
    ```\n\n### 外部文件中的 Javascript\n\n为了避免重复使用相同的 javascript 代码，该语言允许你创建一个外部文件并存储 javascript\
    \ 代码，然后将该外部文件集成到 html 文件中。下面的示例显示了如何利用 `script` 标签和 `src` 属性在 html 代码中集成外部 javascript\
    \ 文件。\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\" src=\"filename.js\"\
    ></script>\n</head>\n<body>\n.......\n</body>\n</html>\n```\n\n外部文件源文件应以 `.js`\
    \ 扩展名保存。\n\n#### 总结\n\n在第一章中，我们解释了 javascript 的起源及其如何放入内部和外部文件中。我们讨论了使用 javascript\
    \ 构建交互式 Web 应用程序，使其能够适当执行，而无需每次操作后都重新加载页面。\n\n#### 练习\n\n你如何在 html 文档中将 javascript\
    \ 代码插入到 head、body 并包含外部文件脚本？\n\n#### 答案\n\nhead 部分的脚本是 `<head></head>`。\nbody\
    \ 部分的脚本是 `<body></body>`。\n在 body 内部的脚本是 `<body>` 和 `<head></head>`。\n在 `<head>...</head>`\
    \ 中包含外部文件的脚本是。\n\n## 第二章：值、类型和操作符\n\n在计算机世界中，数据是核心。你可以创建新数据并更改数据，这些数据都存储为相似的位序列（bits）。将位定义为\
    \ 0 和 1，它们代表来自计算机强、弱、高或低电荷。所有信息数据都被描述为 0 和 1 的序列，并用位表示。\n\n### 值\n\n深呼吸，想象一片比特的海洋。最新的设备在其数据存储中包含超过\
    \ 300 亿个位。我们使用位来创建值。计算机能够正常工作是因为每一位信息都被拆分成了值。每个值由一个影响其角色的类型组成，值可以是数字、文本等。要生成值，你需要调用它的名称，它会出现在它被存储的地方。\n\
    \n### 算术\n\n算术是处理数字的主要方式。对一个数字进行乘法和减法以产生另一个数字是算术运算。这是它们在 javascript 中看起来像样的示例：\n\
    \n```javascript\n100 + 4 * 11\n```\n\n`+` 和 `*` 符号被称为操作符，第一个表示加法，另一个表示乘法。在两个值之间插入的操作符将产生另一个值。`-`\
    \ 操作符用于减法，`/` 操作符用于除法。如果操作符在没有括号的情况下一起，操作符的优先级决定了它们的应用方式。如果几个具有相同优先级的操作符相邻显示（例如\
    \ `1 - 2 + 1`），则从左到右应用：`(1 - 2) + 1`。\n\n### 特殊数字\n\nJavascript 包含三个独特的值，它们的行为不像数字，但被视为数字。`infinity`\
    \ 和 `-infinity` 是前两个，意味着正无穷和负无穷，最后一个值是 `nan`。`nan` 意为“不是数字”，尽管它是一个数字类型的值。\n\n\
    ### 字符串\n\n字符串是数字的序列。字符串是下一个数据类型，它们代表文本。字符串将其内容限制在引号中。\n\n`down the walkway path.\
    \ `\n\"on top of the roof.\"\n'I am at home.'\n\n使用不同类型的引号（如双引号、单引号或反引号）来标记字符串。这是一种匹配的类型。你不能使用\
    \ `+` 操作符，因为它不会相加字符串，而是拼接字符串。（等等，文本说的是 \"but concatenate strings\" - 指的是第二章）。\n\
    \n### 一元操作符\n\n符号并不代表所有的操作符。你可以用单词写某些操作符。一个清晰的例子是附加值的类型：\n\n```javascript\nconsole.log(type\
    \ of 4.5) // -> number\nconsole.log(type of \"x\") // -> string\n```\n\n第二个的操作符被称为二元操作符，因为它们使用两个值，而使用一个值的操作符是一元操作符。\n\
    \n```javascript\nconsole.log(- (10 - 2)) // -> -8\n```\n\n### 布尔值\n\n布尔值仅在两种可能性之间区别的值，例如“开启”和“关闭”等。布尔值只包含\
    \ true 和 false。\n\n### 比较\n\n比较是创建布尔值的方法：\n\n```javascript\nconsole.log(3 > 2)\
    \ // -> true\nconsole.log(3 < 2) // -> false\n```\n\n`>` 和 `<` 字符分别是代表“大于”和“小于”的符号。你可以在布尔值中使用二元操作符，以确定匹配为真还是假。你可以以同样的方式比较字符串。\n\
    \n```javascript\nconsole.log(\"aardvark\" < \"zoroaster\") // -> true\n```\n\n"
- fmt: '

    You can instruct strings in alphabetical order, uppercase letters are often "less"
    than lowercase, so "z" < "a," and non-alphabetic characters (!-,, and so on) are
    also present in the ordering. when javascript want to compare strings, it recognizes
    characters from left to right, differentiating the unicode codes individually.


    Here are other related operators `<=` (less than or equal to), `>=` (greater than
    or equal to), `==` (equal to), and `!=` (not equal to).


    ```

    Console.log("itchy" != "scratchy")

    // → true

    ```


    ```

    Console.log("apple" == "orange")

    // → false

    ```


    In javascript, there is only one value that is not equal to itself, which is the
    `nan` ("not a number").


    ```

    Console.log(nan == nan)

    // → false

    ```


    ### Logical operator


    Javascript endorse only three operators that you can apply to boolean values,
    they are `and`, `or`, and `not`. The `&&` operator signifies logical or and its
    results depend on where the values imputed are `true` or `false`.


    ```

    Console.log(true && false)

    // → false

    Console.log(true && true)

    // → true

    ```


    The `||` operator indicates logical or. this operator outputs `true` if the given
    value is `true`.


    ```

    Console.log(false || true)

    // → true

    Console.log(false || false)

    // → false

    ```


    An exclamation mark `!` indicates not. it is an operator that overturns the set
    value, and it changes from `true` to `false`, and `false` to `true`.


    The `||` consists of the lowest precedence of all operators, then `&&`, the comparison
    operators (`>`, `==`, etc.), and so on. the example below states that parentheses
    are necessary:


    ```

    1 + 1 == 2 && 10 * 10 > 50

    ```


    ### Empty values


    `null` and `undefined` are the only two types of special values that are used
    to indicate the non-appearance of an important value. they contain zero data.


    ### Automatic type conversion


    Earlier i said that javascript accepts practically all given programs, including
    programs with odd behaviors. automatic type conversion illustrates in the following
    expressions:


    ```

    Console.log(8 * null)

    // → 0

    Console.log("5" - 1)

    // → 4

    Console.log("5" + 1)

    // → 51

    Console.log("five" * 2)

    // → nan

    Console.log(false == 0)

    // → true

    ```


    When you assign an operator the wrong value, javascript silently returns that
    value to the exact type it requires using the type coercion rule. in the first
    expression, the `null` turns to `0`, and the `5` in the second remains `5` (from
    string to number). in the third expression, there was string concatenation before
    the numeric addition which converts the `1` to `1` (from number to string). when
    odd numbers such as "five," change to the number it gets the value of `nan`. if
    you want to differentiate two values of the same type using `==`, the output should
    be `true` if the values are similar. if you want to test if a value contains a
    real value, use `!=` operator to compare it to use comparison operators.


    ### Short-circuiting of logical operators


    `&&` and `||` are called the logical operators. they are used to hold several
    types of values in a specific way. they change the values contained in the left
    side to boolean type to decide, although it depends on the operators and the type
    of generated result but will always state the left or right-hand value. the `||`
    operator sends back value to the left when it can be changed to true, and will
    state the value to the right.


    ```

    Console.log(null || "user")

    // → user

    Console.log("kate" || "user")

    // → kate

    ```


    This function is used to return values to its default value and placed within
    an empty value as replacement. strings and numbers to boolean conversion rules
    indicate that `0`, `nan`, and empty string `""` count as `false`, while other
    values are `true`. therefore `0 || -1` outputs `-1`, and `"" || "!?"` yields `!?`.
    `&&` operator operates identically but the other way. when values to the left
    can be changed to `false`, return the value, or it sends the value to the right.
    both operators evaluate the value to the right only when it is required. for example,
    we have the following values set as `true || x`, the value of `x` will be `true`
    and will not consider it. the same rule applies to the `false && x`, which the
    `x` is `false` and will overlook it. you can call this process the short-circuit
    evaluation.


    ### Summary


    This chapter looks at the four types of javascript values, which are strings,
    numbers, `undefined` values and booleans. these values are developed by inserting
    their names as `true`, `null` or value (13, "abc"). operators can integrate and
    change values. we looked at binary operators for arithmetic (`+`, `-`, `*`, `/`,
    and `%`), string concatenation (`+`), comparison (`==`, `!=`, `===`, `!==`, `<`,
    `>=`), logic (`&&`, `||`), and also unary operators (`-`) and ternary operator
    (`?:`) to choose one value depending on a third value.


