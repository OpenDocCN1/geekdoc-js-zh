  trans: "\n你现在可以创建一个可以发送远距离消息的函数。如果消息发送给直接邻居，它将像照常一样传递。否则，它将被封装在一个对象中，并通过“route”请求类型传输到靠近目标的邻居，该类型会让该邻居重复相同的字符。\n\
    \n```javascript\nfunction route_request(nest, target, type, content) {\n  if (nest.neighbors.includes(target))\
    \ {\n    return route_request(nest, target, type, content);\n  } else {\n    let\
    \ via = findroute(nest.name, target, nest.state.connections);\n    if (!via) throw\
    \ new error(`no routes to ${target}`);\n    return route_request(nest, via, \"\
    route,\", {target, type, content});\n  }\n}\n\nrequesttype(\"route,\", (nest,\
    \ {target, type, content}) => {\n  return route_request(nest, target, type, content);\n\
    });\n```\n\n我们在主通信系统的顶部创建了不同层的功能的功能以便方便使用。这是计算机网络工作原理的一个简化模型。\n\n### 异步函数\n\n\
    为了保存大量信息，乌鸦使用复制法，它们在不同的巢穴之间进行复制。这样，当鸟类拆除巢穴时，信息就不会丢失。为了恢复某个没有存储球的特定信息，巢穴计算机将与网络中的巢穴通信，直到找到拥有该信息的巢穴。\n\
    \n```javascript\nrequesttype(\"storage,\", (nest, name) => storage(nest, name));\n\
    \nfunction findstorage(nest, name) {\n  return storage(nest, name).then(found\
    \ => {\n    if (found != null) return found;\n    else return findstorage(nest,\
    \ name);\n  });\n}\n\nfunction network(nest) {\n  return array.from(nest.state.keys());\n\
    }\n\nfunction findremote(nest, name) {\n  let sources = network(nest).filter(n\
    \ => n != nest.name);\n  function next() {\n    if (sources.length == 0) {\n \
    \     return promise.reject(\"not found\");\n    } else {\n      let source =\
    \ sources[math.floor(math.random() * sources.length)];\n      sources = sources.filter(n\
    \ => n != source);\n      return route_request(nest, source, \"storage,\", name).then(value\
    \ => value != null : next());\n    }\n  }\n  return next();\n}\n```\n\n`Object.keys`\
    \ 无法作用于连接，因为它是一个 map。它包含一个 key 方法，但该方法返回的是迭代器而不是数组。迭代器可以使用 `array.from` 函数转换为数组。各种异步操作以不透明的方式结合在一起。现在你需要一个跨越各个巢穴循环的递归函数模型。在同步模型中，这很容易表达。Javascript\
    \ 还允许你编写伪同步代码来定义异步计算。一个 `async` 函数是一个完全返回一个 promise 的函数，并且可以以同步的方式等待其他 promise。像如下所示重写\
    \ `findstorage`：\n\n```javascript\nasync function findstorage(nest, name) {\n\
    \  let local = await storage(nest, name);\n  if (local != null) return local;\n\
    \  let sources = network(nest).filter(n => n != nest.name);\n  while (sources.length\
    \ > 0) {\n    let source = sources[math.floor(math.random() * sources.length)];\n\
    \    sources = sources.filter(n => n != source);\n    try {\n      let found =\
    \ await route_request(nest, source, \"storage,\", name);\n      if (found != null)\
    \ return found;\n    } catch (_) {}\n  }\n  throw new error(\"not found\");\n\
    }\n```\n\n`async` 函数用 `async` 单词和 `function` 关键字标记。方法也可以通过在名称前编写 `async` 变为异步。当函数或方法被调用时，它会返回一个\
    \ promise。当体返回内容时，该 promise 变为就绪。如果它输出异常，promise 将被拒绝。在 `async` 函数内部，在表达式前设置 `await`\
    \ 单词来等待 promise，直到它状态完成后才执行函数。此类函数无法一次性从头运行到尾，但它们可以在某些点冻结并在稍后开始。对于复杂的异步代码，这种表示法比直接通过\
    \ promise 更简单。异步函数不需要暂停并再次产生。Javascript 包含一种名为生成器（generators）的特性。它们与异步函数相同但不包含\
    \ promise。当你调用一个带有 `*` 的函数时，它会变成一个生成器。当你调用一个生成器时，它会返回一个迭代器。\n\n```javascript\n\
    function* powers(n) {\n  let current = n;\n  while (current *= n) {\n    yield\
    \ current;\n  }\n}\n\nfor (let power of powers(3)) {\n  if (power > 50) break;\n\
    \  console.log(power);\n}\n```\n\n```\n通常，如果你调用 `powers`，函数会在开始处冻结。每当你对迭代器调用 `next`\
    \ 时，函数将运行直到遇到一个 `yield` 表达式，该表达式会暂停它并产生由迭代器提供的 yield 值。当函数返回时，迭代器即完成。利用生成器编写迭代器非常简单。使用这个生成器为\
    \ `Group` 类编写迭代器：\n\n```javascript\nGroup.prototype[symbol.iterator] = function*\
    \ {\n  for (let i = 0; i < this.members.length; i++) {\n    yield this.members[i];\n\
    \  }\n};\n```\n\n生成器不需要构建一个对象来持有迭代状态，而生成器会立即存储其局部状态并在每次运行时 yield。这种 `yield` 表达式只能直接发生在生成器函数内部，而不能发生在它内部设置的内部函数中。生成器在\
    \ yield 时保存。这就是它的局部环境和它 yield 的位置。async 函数是一种特殊的生成器。它在被调用时创建一个 promise，该 promise\
    \ 在它完成时解析，在输出异常时拒绝。每当它 yield 一个 promise 时，该 promise 的结果将是 `await` 表达式的结果。\n\n\
    ### 事件循环\n\n异步程序一个接一个执行。每个部分可能开始几个操作，并安排代码在操作完成或失败时执行。在这些部分之间，程序无所事事地等待下一个操作。因此你无法通过安排它们的代码来调用回调。如果你在函数内部调用\
    \ `setTimeout`，在回调函数被调用之前，该函数已经返回。异步特性发生在空调用栈上。由于每个回调都从空栈开始，因此当异常运行时，你的 catch\
    \ 处理器不在栈上。\n\n```javascript\ntry {\n  setTimeout(() => {\n    throw new error(\"\
    woosh\");\n  }, 20);\n} catch (_) {\n  // 这段不会运行\n  console.log(\"caught!\");\n\
    }\n```\n\n"
