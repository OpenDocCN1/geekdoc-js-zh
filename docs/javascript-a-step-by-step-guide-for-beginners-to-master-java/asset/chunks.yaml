  trans: "\n当值代表方法时，处理抽象方法非常简单。在异步操作的情况下，与其为一个在未来某点被调用的函数做准备工作，不如返回一个代表未来事件的对象。promise（承诺）是一种异步操作，它可以在某个点完成并提供值。它可以在值可用时通知任何感兴趣的人。构建\
    \ promise 最简单的方法是调用 `promise.resolve`。该函数保证了你设置在 promise 中的值被正确处理。如果它已经是一个 promise，则会直接返回；否则，将立即创建一个新的\
    \ promise，并将你的值作为结果。\n\n```javascript\nlet fifteen = promise.resolve(15);\nfifteen.then(value\
    \ => console.log(`got ${value}`));\n// → got 15\n```\n\n为了实现 promise 的结果，请使用它的\
    \ `then` 方法。它指示当 promise 解决并提供值时要调用的回调函数。你可以为单个 promise 挂载多个回调函数，即使这些回调是在 promise\
    \ 完成后才挂载的，它们也会被相应的调用。`then` 方法还会返回另一个 promise，该 promise 将解析处理函数返回的值。重要的是，要将 promise\
    \ 视为一种将值转换为异步现实的设备。一个承诺的值是一个在未来某点可能存在或可能显示的值。以 promise 形式描述的计算在封装的值上运行，并在值可用时异步执行。要构建一个\
    \ promise，请将 promise 作为构造函数使用。它的布局特殊，构造函数期望一个函数作为参数，它会立即调用该函数并传递一个可以用于解决 promise\
    \ 的函数。以下是为 `readstorage` 函数构建基于 promise 的布局的方法：\n\n```javascript\nFunction storage(nest,\
    \ name) {\n  return new promise(resolve => {\n    nest.readstorage(name, result\
    \ => resolve(result));\n  });\n}\n\nStorage(bigoak, \"enemies\")\n  .then(value\
    \ => console.log(\"got\", value));\n```\n\n这个异步函数返回一个重要的值。\n\n### 失败\n\nJavascript\
    \ 计算可能会通过输出异常而失败。网络请求可能会失败，或者某些异步代码、计算可能会带来异常。作为异步编程的回调风格，最常见的问题是它非常难以确保失败能正确地暴露给回调函数。一种通用的方法是：回调函数的第一个参数用于指定失败的操作，第二个参数是操作完成时提供的值。此类回调函数总是检查它们是否获取了异常，并确保任何出现的问题（包括它们调用的函数输出的异常）都被传递给正确的函数。它们可以在成功完成时减少，或在失败时拒绝。`catch`\
    \ 仅在任务成功完成时处理它，并在失败时自动拒绝生成的返回的新 promise。而当处理函数输出异常时，这会自动触发其 `reject` 提供的 promise。当异步操作链中的某个元素失败时，整个链的输出都会被拒绝，失败点之后的任何成功处理器都不会执行。就像解决一个\
    \ promise 会产生一个值一样，拒绝一个 也会产生一个值，通常称为原因（reason）。如果处理函数中的异常导致了拒绝，类似于处理函数返回一个被拒绝的\
    \ promise，它将进入下一个 promise。promise 的 `reject` 函数会立即创建一个新的。如果 `catch` 处理器输出错误，新的\
    \ promise 同样会被拒绝。简而言之，它也接受一个拒绝处理器作为第二个参数，因此你应该在单个调用中安装两种类型的处理器。发送到 promise 构造函数的函数接受第二个参数，即\
    \ `resolve` 函数，它可以使用它来拒绝新的 promise。通过调用 `then` 和 `catch` 开发的 promise 值链被视为异步值或失败的流水线。因为通过注册处理器构建的链由相关的成功处理器或拒绝处理器组成。这些处理器与输出类型不匹配的处理器无关。但那些匹配的处理器会被获取，它们的输出决定了在返回非\
    \ promise 值时返回什么类型的值：在返回非 promise 值时返回值，在输出异常时返回拒绝，在返回其中一个 promise 时返回该 promise\
    \ 的结果：((_, reject) => reject(\"fail\"))\n  .then(value => console.log(\"handler\
    \ 1\"))\n  .catch(reason => {\n    console.log(\"caught failure, \" + reason);\n\
    \    return \"nothing\";\n  })\n  .then(value => console.log(\"handler 2\", value));\n\
    // → caught failure: fail\n// → handler 2 nothing\n```\n\n网络是困难的\n\n有时，乌鸦镜子系统传递信号所需的微弱光线阻挡了信号的路径。信号可以传输但可能被拒绝。通常，传输失败是意料之外的事故，例如汽车大灯挡住了光信号，而发送请求可能会使其成功。所以，让我们创建我们的请求函数，并在停止之前多次重试发送请求。而且，既然我们已经确定\
    \ promise 是好的，我们还将确保我们的请求函数返回一个 promise。当涉及到它们可以指示什么时，promise 和回调是平等的。基于回调的函数被封装以揭示基于\
    \ promise 的布局，反之亦然。即使请求及其回复成功传达，回复也可能指定失败，例如，如果请求尝试使用未描述的请求类型，或者处理器输了错误。为了帮助这一点，发送并定义请求类型，请遵循之前声明的约定：发送到回调的第一个参数是失败的原因（如果有），第二个参数是确定的结果。它们被我们的包装器解释为\
    \ promise 的解决和拒绝。\n\n```javascript\nClass timeout extends error {}\n\nFunction\
    \ request(nest, target, type, content) {\n  return new promise((resolve, reject)\
    \ => {\n    let done = false;\n    function attempt(n) {\n      if (done) return;\n\
    \      done = true;\n      nest.send(target, type, content, (failed, value) =>\
    \ {\n        if (failed) {\n          reject(failed);\n        } else {\n    \
    \      resolve(value);\n        }\n      });\n    }\n    attempt(0);\n    setTimeout(()\
    \ => {\n      if (!done) reject(new timeout(\"fail\"));\n    }, 5000);\n  });\n\
    }\n```\n"
