  trans: "\n`let` 是该语句中的关键字，它意味着句子将指定一个绑定与绑定名称在一起，并可以使用 `=` 运算符和表达式来附加值。使用已定义的绑定作为表达式，即包含该绑定值的表达式。下面是一个示例：\n\
    \n```javascript\nlet ten = 10;\nConsole.log(ten * ten);\n// → 100\n```\n\n`=`\
    \ 运算符用于现有绑定，将绑定从一组值中移除并将其指向新值。\n\n```javascript\nlet mood = \"light\";\nConsole.log(mood);\n\
    // → light\n\nmood = \"dark\";\nConsole.log(mood);\n// → dark\n```\n\n在定义绑定时不赋值值将导致没有内容可持有。因此，请求绑定的值会产生\
    \ `undefined` 值。你可以通过一个由逗号分隔的单一语句定义多个绑定。\n\n```javascript\nlet one = 1, two =\
    \ 2;\nConsole.log(one + two);\n// → 3\n```\n\n使用 `var` 和 `const` 单词来熟悉地开发绑定：\n\
    \n```javascript\nvar name = \"ayad\";\nconst greeting = \"hello \";\nConsole.log(greeting\
    \ + name);\n// → hello ayad\n```\n\n`const` 单词意味着常量。它描述了一个坚定的绑定，在其生命周期内始终指向其设置的值。这些单词通常用于将一个名称声明为一个值，以便以后轻松引用。\n\
    \n### 绑定名称\n\n尽管有一些像 `const`、`class`、`default`、`break`、`continue`、`delete`、`do`、`else`、`yet`\
    \ 这样的保留字，但任何单词都可以作为绑定名称，它可以包含数字但不能以数字开头语句。绑定名称也可以包含美元符号（`$`）或下划线（`_`），但不包含任何其他特殊字符或标点符号。\n\
    \n特定时间存在的绑定和值的组被称为环境。当你启动程序时，环境持有语言标准绑定，并通常包含与系统环境创建交互的绑定。例如，浏览器携带了与启动的网站通信的函数，以及读取键盘和鼠标输入。\n\
    \n### 函数\n\n封装在值中的部分程序被称为函数，这些值被添加以启动被封装的程序。例如，一个为用户输入显示小对话框的函数。\n\n```javascript\n\
    Prompt (\"enter passcode\");\n```\n\n实现函数的过程被描述为调用、触发或应用。通过在提供函数值的表达式后插入括号来调用函数。将括号的值设置为函数内部的程序。将值定义为参数。\n\
    \n### console.log\n\n在上面的示例中，我们使用 `console.log` 来输出值。所有主流浏览器都利用 `console.log`\
    \ 将其参数状态到输出文本的设备。在现代浏览器中，输出通常在默认不可见的控制台中；你可以点击键盘上的 F12 或 Mac 上的 `command-option`\
    \ 键。名称不包含点，但 `console.log` 包含，因为它是一个从 `console` 值中申取属性的表达式。\n\n### 返回值\n\n函数被用于产生副作用。它们也可以提供不需要副作用的值。例如，`calculate.max`\
    \ 函数将取一组数字参数之和并返回最大的值。\n\n```javascript\nConsole.log(calculate.max(2, 4));\n//\
    \ → 4\n```\n\nJavascript 将任何提供值的视为表达式，这使得函数调用能够附加到实质表达式中。让我们调用 `calculate.min`，它是\
    \ `calculate.max` 的直接相反面：\n\n```javascript\nConsole.log(math.min(2, 4) + 100);\n\
    // → 102\n```\n\n### 控制流\n\n当程序中包含多个语句时，它们以故事的形式从代码开始到结束执行。这种类型的程序由两种语句组成；第一种向用户请求数字，而第二个显示数字的平方并在第一个之后立即执行。\n\
    \n```javascript\nlet number = number(prompt(\"select a digit \"));\nConsole.log(\"\
    your digit is the square root of \" + number * number);\n```\n\n一个值通过 `number`\
    \ 函数转换为数字并输出一个字符串值。\n\n条件执行\n\n键盘被用于在 javascript 中开发条件执行。你可能希望某些代码仅当特定条件为真时才执行。让我们在输入仅为数字时才显示其平方。\n\
    \n```javascript\nlet number = number(prompt(\"select a digit \"));\nIf (! number.isnan(number))\
    \ {\nConsole.log(\"your digit is the square root of \" + number * number);\n}\n\
    ```\n\n`if` 关键字执行或规避由布尔表达式值决定的语句。在关键字后的括号内输入确定表达式，并伴随要完成的语句。`if` 关键字执行或规避由布尔表达式值决定的语句。\n\
    \n```javascript\nIf (1 + 1 == 2)\nConsole.log(\"it's true,\");\nelse\nConsole.log(\"\
    y. why didn't you give me a number?\");\n```\n\n如果有两个以上的路径可以选择，你可以“链式”多个 `if/else`\
    \ 对。下面是一个示例：\n\n```javascript\nlet num = number(prompt(\"pick a number\"));\n\
    If (num < 10) {\n  Console.log(\"small\");\n} else if (num < 100) {\n  Console.log(\"\
    medium\");\n} else {\n  Console.log(\"large\");\n}\n```\n\n程序确认 `num` 是否小于 10，如果是，则选择该分支并显示\
    \ \"small\"。`isnan` 函数在输入不是数字时返回 `nan`。\n\n### While and do 循环\n\n这是编写一个显示从 0\
    \ 到 12 所有偶数程序的方法。\n\n```javascript\nlet i = 0;\nwhile (i <= 12) {\n  Console.log(i);\n\
    \  i = i + 2;\n}\n```\n\n```javascript\nlet i = 0;\ndo {\n  Console.log(i);\n\
    \  i = i + 2;\n} while (i <= 12);\n```\n\n多次运行代码块的方式被描述为循环。\n"
- fmt: "\nThe looping control flow enables the user to return to certain points in\
    \ written programs and redo it with the current state of the program. integrate\
    \ this with a binding that enumerates as follows:\n\n```javascript\nlet number\
    \ = 0;\n\nWhile (number <= 12) {\nConsole.log(number);\nNumber = number + 2;\n\
    }\n// → 0\n// → 2\n// … etc\n```\n\nA statement that begins with the keyword and\
    \ at the same time producing a loop. the keyword `while` accompanied by an expression\
    \ in parentheses followed by a statement like the `if` statement. the loop becomes\
    \ continuous until the expression provides a value that states true when translated\
    \ to boolean. each time the loop repeats, numbers adopt a number twice of their\
    \ previous value. let us write a program that evaluates and display the value\
    \ of 2^10 (2 raised to the power of 10). we will utilize two bindings. one to\
    \ keep an eye on our result and the other to calculate how many times the value\
    \ of two multiplied by the result. it multiplies until the second binding reaches\
    \ 10:\n\n```javascript\nlet result = 1;\nlet counter = 0;\nWhile (counter < 10)\
    \ {\nResult = result * 2;\nCounter = counter + 1;\n}\nConsole.log(result);\n//\
    \ → 1024\n```\n\nA `do` loop is a command structure related to a `while` loop.\
    \ a `do` loop always take place at least once in a statement, and then it begins\
    \ to check if it ends after the first execution only. follow the following steps:\n\
    \n```javascript\nlet yourname;\nDo {\nYourname = prompt(\"who are you?\");\n}\
    \ while (! yourname);\nConsole.log(yourname);\n```\n\n### For loops\n\nA lot of\
    \ loops follow the `while` loop pattern, creating a counter binding to track the\
    \ loop's progress. then a `while` loop with a test expression to see if the counter\
    \ reaches the set value.\n\n```javascript\nFor (let number = 0; number <= 10;\
    \ number = number + 4) {\nConsole.log(number);\n}\n// → 0\n// → 4\n// etc\n```\n\
    \nThe parentheses must consist of two semicolons after the keyword, the first\
    \ part that is before the first semicolon separates the loop by describing a binding.\
    \ the other part is the statement that determines if the loop should continue.\
    \ here is the code that evaluate 2^10 using `for` instead of `while`:\n\n```javascript\n\
    let result = 1;\nFor (let counter = 0; counter < 10; counter = counter + 1) {\n\
    Result = result * 2;\n}\nConsole.log(result);\n// → 1024\n```\n\n### Breaking\
    \ out of a loop\n\nThere are other ways to end a loop other than making a looping\
    \ condition false. `break` can influence jumping out of the confined loop. the\
    \ `break` statement evaluates this program if the first number is both greater\
    \ or equal to 20 and can be divided by 7.\n\n```javascript\nFor (let current =\
    \ 20; current = current + 1) {\nIf (current % 7 == 0) {\nConsole.log(current);\n\
    break;\n}\n// → 21\n```\n\nThe `%` operator is used to check if a number can be\
    \ divided by another number. if it can be divided, then the remaining division\
    \ is zero. the for example is not checked at the end of the loop which means until\
    \ the `break` statement inside is the loop becomes infinite and never stops.\n\
    \n### Updating succinctly\n\nWhen you are in a loop, programs will update a binding\
    \ regularly to store a value based on its previous value.\n\n```javascript\ncounter\
    \ = counter + 1;\n```\n\nJavascript offers a shortcut.\n\n```javascript\ncounter\
    \ += 1;\n```\n\nFor `counter += 1` and `counter -= 1`, here are shorter equivalents:\
