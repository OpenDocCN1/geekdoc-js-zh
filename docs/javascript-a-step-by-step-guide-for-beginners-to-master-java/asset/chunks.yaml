  trans: "\n\n在字符串表达式后写入长度决定了该特定字符串的长度。循环继续在数字字符串的开头添加 0，直到它们包含三个字符。\n\n这里有一个更好的尝试：\n\
    \n```javascript\nfunction printzeraddedwithlabel(number, label) {\n  let numberstring\
    \ = string(number);\n  while (numberstring.length < 3) {\n    numberstring = \"\
    0\" + numberstring;\n  }\n  Console.log(`${numberstring} ${label}`);\n}\n\nfunction\
    \ printfarminventory(cows, chickens, pigs) {\n  printzeraddedwithlabel(cows, \"\
    cows\");\n  printzeraddedwithlabel(chickens, \"chickens\");\n  printzeraddedwithlabel(pigs,\
    \ \"pigs\");\n}\n\nprintfarminventory(7, 11, 3);\n```\n\n与其提取程序中重复的部分，不如通过以下步骤提取单个概念：\n\
    \n```javascript\nfunction zeropad(number, width) {\n  let string = string(number);\n\
    \  while (string.length < width) {\n    String = \"0\" + string;\n  }\n  return\
    \ string;\n}\n\nfunction printfarminventory(cows, chickens, pigs) {\n  Console.log(`${zeropad(cows,\
    \ 3)} cows`);\n  Console.log(`${zeropad(chickens, 3)} chickens`);\n  Console.log(`${zeropad(pigs,\
    \ 3)} pigs`);\n}\n\nprintfarminventory(7, 16, 3);\n```\n\n函数也可以用于打印对齐的数字表格。\n\n\
    ### 函数与副作用\n\n函数可以包含副作用并返回值。与产生副作用的函数相比，它们产生的值可以更容易以新的方式进行整合。纯函数是一个唯一的值制造函数，它不依赖于任何代码副作用。例如，它不会识别具有可变值的全局绑定。它还由由一个可调用属性组成，具有相同的参数并产生相等的值。\n\
    \n### 总结\n\n在本章中，你现在理解了如何编写函数。通过了如何编写 `function` 关键字以及何时使用表达式，你现在可以构建一个函数值。当你将函数作为状态时，它可以设置一个绑定并将函数命名为它的值。你还可以使用箭头函数来构建函数。\n\
    \n```javascript\n// 定义 f 以持有函数值，\nconst f = function(a) {\n  Console.log(a + 2);\n\
    };\n\n// 声明 g 为函数\nfunction g(a, b) {\n  return a * b * 3.5;\n}\n\n// 一个更简洁的函数值，\n\
    let h = a => a % 3;\n```\n\n理解函数的主要视角是了解作用域。每个块都会创建一个新的作用域。在特定作用域设置的参数和绑定是局部的，从外部不可见。使用\
    \ `var` 设置的绑定作用不同，它们会导致全局作用域。将程序执行的任务区分不同的函数是很重要的。你不需要经常重复自己，函数可以通过将代码分类为执行特定操作的片段来安排程序。\n\
    \n### 练习\n\n编写一个 javascript 程序来判断一个数字是否为偶数。\n\n### 解决方案\n\n![00171.jpg](img/00171.jpeg)![00125.jpg](img/00125.jpeg)![00091.jpg](img/00091.jpeg)\n\
    \n## 第 5 章：数据结构：对象和数组\n\n数据布局从布尔值、字符串和数字片段发展而来。若干类型的信息使用多个块。对象允许用户将值与其他对象放在一起以开发更复杂的布局。在本章中，你将理解解决手头实际问题的概念。\n\
    \n### 数据集\n\n如果你想处理大量的数字数据，你必须在机器内存中表示数字数据。例如，你需要表示一组数字，如 2, 3, 5, 7 和 11。现在让我们充分利用字符串，因为字符串可以包含大量数据。我们将使用\
    \ 2 3 5 7 11 作为表示。javascript 编程语言提供了一种用于保存值序列唯一数据类型，称为数组。在括号内将数组写为值的列表。\n\n```javascript\n\
    let numbers = [2, 3, 5, 7, 11];\nConsole.log(numbers[2]); // 5\nConsole.log(numbers[0]);\
    \ // 2\nConsole.log(numbers[2 - 1]); // 7\n```\n\n用于获取数组内元素的符号也使用中括号。当你开始计算数组中的元素时，是从\
    \ 0 开始而不是 1。\n\n之前的章节具有如 `length`（计算数组长度）和 `max`（最大值）等属性。所有不包含值的属性都是 `undefined`。如果你访问不存在的属性，结果将是\
    \ `undefined`。\n\n### 数组属性\n\n评估属性的两种主要方法是 `.` 和 `[]`。如果你想评估如 `2` 或 `john doe`\
    \ 的属性名，请使用括号：`value[2]` 或 `value[\"john doe\"]`。\n\n点符号法适用于有效的属性名。\n\n```javascript\n\
    let array = \"doh\";\nConsole.log(array.length); // 3\n```\n\n（注：由于提供的原始文本包含大量重复和乱码内容，上述翻译已提取核心逻辑并修复了格式优化。）\n\
    \n"
