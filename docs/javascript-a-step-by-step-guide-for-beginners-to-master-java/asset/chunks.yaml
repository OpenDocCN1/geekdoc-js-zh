    \ And the syntax contains zero block concept, so a construct is needed to represent\
    \ running several things in succession. The data layout the parser utilizes to\
    \ define a program containing expression objects. Each one contains a type of\
    \ property signifying the kind of expression it is and several other properties\
    \ to determine its content.\n"
