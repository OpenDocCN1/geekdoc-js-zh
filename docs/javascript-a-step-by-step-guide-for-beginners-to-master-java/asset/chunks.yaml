  trans: "\n相关性是对分析变量之间脆弱性的一种评估。它们的值范围从 -1 到 1。不相关的变量被称为零相关。相关性为 1 表示两者相关。负相关意味着变量之间相关，但方向相反；其中一个为真，另一个即为假。要计算两个布尔值之间相关性的评估，请使用\
    \ Phi 系数（phi coefficient，φ）。该公式的输入是一个频率表，记录了若干种变量组合出现的次数。公式的输出将是 -1 到 1 之间的数字。这是对相关性的最佳定义。\n\
    \n让我们以“吃披萨”这一事件为例，并将其插入频率表中，其中每个数字代表总次数，即我们在测量中使用的组合数。我们将表格命名为 `n`，并使用以下公式计算 `φ`：\n\
