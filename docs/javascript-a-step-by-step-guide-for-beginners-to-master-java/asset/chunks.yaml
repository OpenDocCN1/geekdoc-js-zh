    ### International characters


    Because of javascript’s initial simplistic implementation and that this approach
    set in stone as standard behavior, javascript’s regular expressions are somewhat
    dumb about characters that don’t show in the english language. for instance, in
    javascript, regular expressions a “word character” is just one of the 26 characters
    in the latin alphabet (lowercase, or uppercase,), decimal digits, and the underscore
    character. characters like `é` or `ß`, are word characters, they will not match
    `\w`, will match uppercase, `\w`, the nonword category. it indicates that characters
    composed of two code units.


    ```

    Console.log(/🍎{3}/.test("🍎🍎🍎"));

    // → false,


    Console.log(/<.>/.test("<🌹>"));

    // → false,


    Console.log(/<.>/u.test("<🌹>"));

    // → true,

    ```


    The identified problem here is that `🍎` in the first line is being managed as
    two code units, and the `{3}` section is used to the second one only. the dot
    also matches a single code unit. add `u` option (for unicode,) to your regular
    expression so that it manages that characters properly. the wrong behavior remains
    set as the default, unfortunately, because transforming that could create problems
    for current code that depends on it.


    You can use `\p` in a regular expression to match every character that unicode
    standard gives a set property.


    ```

    Console.log(/\p{script=greek}/u.test("α"));

    // → true,


    Console.log(/\p{script=arabic}/u.test("α"));

    // → false,


    Console.log(/\p{alphabetic}/u.test("α"));

    // → true,


    Console.log(/\p{alphabetic}/u.test("!"));

    // → false,

    ```


    Unicode describes a number of important properties, although searching for the
    one that you need may not always be trivial.


    ### Summary


    We focused on regular expressions in this chapter. an object that stands for patterns
    in strings is a regular expression. they consist of their language and utilize
    it for the exhibition of patterns.


    - `/abc/` a success of characters

    - `[abc]` character from a range

    - `[^abc]` any character in a range

    - `[0-9]` any character within a set of characters

    - `+/` one or more events of the pattern

    - `+?` one or more events, already

    - `*/` zero or more events

    - `?` zero or one events

    - `{2,4}` two to four events

    - `(abc)` a group

    - `/a|b|c` any one of various patterns

    - `\d` any digit character

    - `\w` an word character

    - `\s` any space character

    - `.` any character excluding new line

    - `\b` a word boundary

    - `/^` beginning of input

    - `$/` end of input


    A regular expression consists of a method `test` to check if a string matches
    it. it also contains an `exec` method where it finds a match, it sends back an
    array having every group. this type of array contains an `index` property that
    specifies where the match started. strings use a matching method to match them
    in opposition to a regular expression as well as a search method to find one,
    sending back only the beginning position of the match.


