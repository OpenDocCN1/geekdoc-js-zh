    \n编程概念和工具的发展是以一种无组织的方式进行的方式，但它的成功标志着一项卓越的技术。在本章中，我们将讨论正则表达式。它们用于在字符串数据中定义模式。它们创建了一种微小的、不同的语言，由\
    \ javascript 以及其他语言组成。\n\n### 创建正则表达式\n\n正则表达式通过 `regexp` 构造函数构建，或者被写为一个严格值，通过用正斜杠（`/`）字符包围模式来实现。\n\
    \n```javascript\nlet re1 = new RegExp(\"abc\");\nlet re2 = /abc/;\n```\n\n这两个正则表达式对象代表相同的模式。当使用\
    \ `regexp` 构造函数时，将模式写为普通字符串，这样规则就会适用于反斜杠。\n\n第二种表示法对反斜杠的影响不同，首先在任何正斜杠之前放一个反斜杠，因为模式显示在正斜杠字符之间。\n\
    \n#### 测试匹配\n\n正则表达式对象包含几个方法，其中之一是 `test`。当你传递一个字符串时，它会返回一个布尔值，确定字符串是否包含表达式中模式的匹配项。\n\
    \n```javascript\nconsole.log(/abc/.test(\"abcde\"));\n// → true,\n\nconsole.log(/abc/.test(\"\
    abxde\"));\n// → false,\n```\n\n正则表达式仅包含代表字符连续的非特殊字符。如果 abc 出现在字符串的任何地方，我们就在运行一个测试，测试将返回\
    \ true。\n\n#### 字符集\n\n正则表达式允许我们指示复杂的模式。如果你想在正则表达式中等于任何数字，请在方括号之间放置字符集。以下表达式等于数字内的每个字符串：\n\
    \n```javascript\nconsole.log(/[0123456789]/.test(\"in 1992\"));\n// → true,\n\n\
    console.log(/[0-9]/.test(\"in 1992\"));\n// → true,\n```\n\n方括号内两个字符之间的连字符（`-`）用于指定字符范围，该字符的数字决定了从\
    \ 0 到 9 紧邻相邻的字符（在这条命令中，代码为 48 到 57），因此 `[0-9]` 包裹了所有字符并等于任何数字。常用字符包含内置快捷方式。数字是以下部分的：`\\\
    d` 意味着与 `[0-9]` 完全相同。`\\d` 数字，`\\w` 字母数字字符（“单词”），`\\s` 任何空白字符（空格、制表符、换行和类似的字符），`\\\
    D` 非数字，`\\W` 非字母数字字符，`\\S` 非空白字符。\n\n使用下面的表达式匹配像 01-30-2003 15:20 的日期时间格式：\n\n\
    ```javascript\nlet dateTime = /\\d\\d-\\d\\d-\\d\\d\\d \\d\\d:\\d\\d/;\nconsole.log(dateTime.test(\"\
    01-30-2003 8:45\"));\n// → false, （注意：输入的小时是一位数字，正则期望两个）\n```\n\n这些反斜杠也用于方括号内。例如，`[\\\
    d.]` 表示任何数字或句，但句与其他特殊字符（如 `+`）一样没有特殊意义。\n\n```javascript\nlet not = /[⁰¹]/;\n\
    console.log(not.test(\"1101000100110\"));\n// → false,\n\nconsole.log(not.test(\"\
    11010001020110\"));\n// → true,\n```\n\n#### 重复模式部分\n\n现在你已经完美理解了如何等于单个数字。如果你想匹配一个整数或多个数字的连续，请在正则表达式的输入后紧跟一个加号（`+`）。这表示该元素可以重复多次，`\\\
    d+` 等于一个或多个数字字符。\n\n```javascript\nconsole.log(/\\d+/test(\"123\"));\n// → true,\n\
    \nconsole.log(/\\d+/test(\"\"));\n// → false,\n\nconsole.log(/\\d*/test(\"123\"\
    ));\n// → true,\n\nconsole.log(/\\d*/test(\"\"));\n// → true,\n```\n\n星号（`*`）允许模式等于零。在下面的示例中，允许字符出现，但在未找到模式时模式也相等。\n\
    \n```javascript\nlet neighbour = /neighbour/;\nconsole.log(neighbour.test(\"neighbour\"\
    ));\n// → true,\n\nconsole.log(neighbour.test(\"neighbour\"));\n// → true,\n```\n\
    \n要确定模式应该执行多少次，使用大括号，在元素后插入 `{4}`。如果你想让它精确执行四次，定义一个范围如下：\n\n`{2,4}` 表示元素必须执行两次且最多四次。下面是另一个日期时间模式，它允许单位和双位的日期、月份和小时。\n\
    \n```javascript\nlet dateTime = /\\d{0,2}-\\d{1,2}-\\d{4} \\d{1,2}:\\d{2}/;\n\
    console.log(dateTime.test(\"01-30-2003 8:45\"));\n// → true,\n\n\n### 分组表达式\n\n\
    如果你想对一个或多个元素使用运算符如 `*` 或 `+`，请使用括号。正则表达式的一部分（引用在括号内）只要涉及到运算符，就被视为一个整体。\n\n```javascript\n\
    let cartoonrying = /boo+(hoo)+/i;\nconsole.log(cartoonrying.test(\"booooohooo\"\
    ));\n// → true,\n```\n\n第一个和第二个 `+` 字符分别适用于 `boo` 和 `hoo`。第三个 `+` 指向整个组 `(hoo+)`，多次。示例中第一个表达式结尾的\
    \ `i` 用于区分大小写，使其能够匹配输入字符串中的大写 `B`，尽管模式完全是小写。\n\n#### 匹配与分组\n\n`test` 方法是等于正则表达式的最佳方式，它仅确定是否匹配。正则表达式包含\
    \ `exec` 方法，如果找不到匹配项，它将输出 `null`，并返回一个包含匹配数据的对象。\n\n```javascript\nlet match =\
    \ /\\d+/.exec(\"one two 100\");\nconsole.log(match);\n// → [\"100\"]\n\nconsole.log(match.index);\n\
    // → 8\n```\n"
- fmt: "\nAn `exec` object from regex contains an `index` property, which determines\
    \ what part of the string the thriving match starts. Below is the succession of\
    \ digits needed:\n\n`String` values contain a `match` method that behaves similarly.\n\
    \n```javascript\nConsole.log(\"one, two 100\".match(/\\d+/));\n// → [\"100\"]\n\
    ```\n\nWhen the regular expression holds subexpressions collated with parentheses,\
    \ the matching text will display in the array. the whole match is the first, the\
    \ next is the matched part by the first group, and then the following group, etc.\n\
    \n```javascript\nlet quoteText = /([^']*)'/;\nConsole.log(quoteText.exec(\"she\
    \ said 'hello'\"));\n// → [\"'hello'\", \"hello\"]\n``` (Note: The original text\
    \ had typos in variables, corrected here for logic)\n\nWhen a group was not finish\
    \ being matched (if it contains a question mark), it outputs `undefined`. when\
    \ you match a group several times, only the last match finishes in the array.\n\
    \n```javascript\nConsole.log(/bad(ly)?/.exec(\"bad\"));\n// → [\"bad\", undefined]\n\
    \nConsole.log(/(\\d)+/.exec(\"123\"));\n// → [\"123\", \"3\"]\n```\n\n### The\
    \ Date classes\n\nJavascript consists of a standard class that represent dates;\
    \ it is called `Date`. if you want to build a date object utilizing new first\
    \ get the current time and date.\n\n```javascript\nConsole.log(new Date());\n\
    // → mon nov 11 2023 16:19:11 gmt+0100 (cet)\n```\n\nYou can as well build an\
    \ object for a particular time.\n\n```javascript\nConsole.log(new Date(2008, 11,\
    \ 8));\n// → wed dec 08 2008 00:00:00 gmt+0100 (cet)\n\nConsole.log(new Date(2008,\
    \ 11, 9, 12, 59, 59, 999));\n// → wed dec 08 2009 12:59:59 gmt+0100 (cet)\n```\n\
    \nYou should follow the javascript naming convention where month numbers begin\
    \ at zero (therefore, december is 11), and day numbers begin at 1.\n\nThe hours,\
    \ minutes, seconds, and milliseconds arguments are voluntary and recognized as\
    \ zero when not specified. timestamps are saved as the number of milliseconds\
    \ in the utc time zone. following by a convention set by “unix time,”\n\n```javascript\n\
    Console.log(new Date(2016, 11, 14).getTime());\n// → 1445677600000\n\nConsole.log(new\
    \ Date(1445677600000));\n// → mon dec 11 2008 00:01:00 gmt+0100 (cet)\n```\n\n\
    When the date constructor is set a single argument, the argument is recognized\
    \ as a millisecond count. determine the current millisecond count by building\
    \ a new date object and call `getTime` on it or use the `date.now` function. `date`\
    \ objects produce methods such like `getDate`, `getHours`, `getFullYear`, `getMonth`,\
    \ `getMinutes`, and `getSeconds` to retrieve their components.\n\n```javascript\n\
    function getdate(strings) {\n  let [_, month, day, year] =\n    /(\\d{01,2})-(\\\
    d{01,2})-(\\d{4})/.exec(strings);\n  return new Date(year, month - 1, day);\n\
    }\n\nConsole.log(getDate(\"1-30-2003\"));\n// → thursday jan 30 2003 00:00:00\
    \ gmt+0100 (cet)\n```\n\n### String and word boundaries\n\nYou can ensure that\
    \ the match spans the entire string by adding the markers `^` and `$`. the caret\
    \ equals the beginning of the input string, while the dollar sign equals the end.\
    \ therefore, `/^\\d+$/` matches a string continuing multiple, or one, digits,\
    \ `/^! /` matches any string that begins with an exclamation mark, and `/x^/`\
    \ matches no string. if you want the date to begin and end on a boundary word\
    \ utilize the `\\b`. a word boundary can begin or finish strings containing a\
    \ word character (`\\w`) on one side and a nonword character on the other.\n\n\
    ```javascript\nConsole.log(/cat/.test(\"concatenate\"));\n// → true\n\nConsole.log(/\\\
    cat\\b/.test(\"concatenate\"));\n// → false\n```\n\n### Choice patterns\n\nIf\
    \ you want to know if chunk of text consists of a number followed by words such\
    \ as pig or cow, let’s write three regular expressions and test them. utilize\
    \ the pipe character (`|`) to mark a choice between the left and right:\n\n```javascript\n\
    let animalCount = /\\b\\d+ (pig|cows)?\\b/;\nConsole.log(animalCount.test(\"15\
    \ pigs\")); // true\n\nConsole.log(animalCount.test(\"15 cows\")); // false\n\
    ```\n\n### The replace method\n\nString values contain a `replace` method which\
    \ is used to replace part of the string with another one. the first argument can\
    \ equally be a regular expression. if you add a `g` option to the expression,\
    \ every match contained in the string is replaced and not first.\n\n```javascript\n\
    Console.log(\"borudar\".replace(/[ou]/, \"a\"));\n// → barudar\n\nConsole.log(\"\
    borudar\".replace(/[ou]/g, \"a\"));\n// → badadar\n```\n\nThe major importance\
    \ of utilizing regular expressions with replace is because it refers to matched\
    \ groups in the string. for instance, you have a large string consisting of people's\
    \ name, using the `format` line, you can as well change and remove the names to\
    \ get a format using the `replace` method.\n\nutilize the following code:\n\n\
    ```javascript\nConsole.log(\"liskov, barthy john\".replace(/(\\w+), (\\w+)/g,\
    \ \"$2 $1\"));\n// → barthy john liskov\n```\n\n`$1` and `$2` are contained in\
    \ the text which opposing the first group up to `$9`. each match can be replaced\
    \ to `$&`. you can pass a function instead of a string as the second argument\
    \ to replace. for each replace, the function is called with the matched group\
    \ as arguments and include the return value into the new string. below is an example:\n\
    \n```javascript\nlet s = \"the cia and fbi\";\nConsole.log(s.replace(/\\b(fbi|cia)\\\
    b/g, str => str.toUpperCase())); // → the CIA and FBI\n```\n\nHere’s a more interesting\
    \ one:\n\n```javascript\nlet stock = \"1 lemon, 2 cabbages, and 101 eggs\";\n\n\
    function minusone(match, units) {\n  let amount = Number(match) - 1;\n  if (amount\
    \ == 1) { // just one left, remove the 's\n    let unit = units.slice(0, units.length\
    \ - 1);\n  } else if (amount == 0) {\n    amount = \"no\";\n  }\n  return amount\
    \ + \" \" + units;\n}\n\nConsole.log(stock.replace(/(\\d+) (\\w+)/g, minusone));\n\
    // → no lemon, 1 cabbage, and 100 eggs\n```\n\n### Greedy\n\nYou can use `replace`\
    \ to write a function that eradicates all comments from a block of javascript\
    \ code. look below:\n\n```javascript\nfunction stripComments(code) {\n  return\
    \ code.replace(/\\/\\/.*|\\/\\*[^]*\\*\\//g, \"\");\n}\n\nConsole.log(stripComments(\"\
    1 + /* 2 */3\")); // → 1 + 3\n\nConsole.log(stripComments(\"x = 10;// ten!\"));\
    \ // → x = 10;\n\nConsole.log(stripComments(\"1 /* a */+/* b */ 1\")); // → 1\
    \ 1\n```\n\nThe section before the `or` operator matches two slash characters\
    \ accompanied with any number that is not a newline character. use `[^]` to match\
    \ any character.\n"
