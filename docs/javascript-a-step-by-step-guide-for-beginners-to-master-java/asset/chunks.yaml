    \ => {\n    if (done) return;\n    else if (n < 3) attempt(n + 1);\n    else reject(new\
    \ Error(\"time out\"));\n  }, 250);\n}\n\nattempt(1);\n});\n```\n\n因为 `promises`\
    \ 只能被接受或拒绝一次，所以它能够正常工作。第一个 `resolve` 或 `reject` 调用将决定 `promise` 的结果，任何其他调用都将被忽略。若要创建一个用于重试的异步循环，请使用递归函数；高效的循环不允许我们停止并等待异步操作。`attempt`\
    \ 函数创建了单次请求传输尝试。它还指定了一个 `timeout`，如果在 250 毫秒后没有返回响应，它将开始下一次尝试；如果是第四次尝试，则以 `timeout`\
    \ 实例为原因拒绝 promise。如果请求出现，每隔四分之一秒重试一次并在秒后无响应时停止，这显然是任意的，但处理器在传输多次请求时需要更长的时间。在考虑这个问题问题时创建你的处理器，耦合的消息并无害。为了完全脱离回调，为\
    \ `requesttype` 定义一个包装器，使处理器函数能够返回一个 promise 或简单值，并由接线为我们完成回调。\n\n```javascript\n\
    function requesttype(name, handler) {\n  define requesttype(name, (nest, content,\
    \ source, Callback) => {\n    try {\n      Promise.resolve(handler(nest, content,\
    \ source))\n        .then(response => callback(null, response),\n        (failure\
    \ => callback(failure));\n    } catch (exception) {\n      Callback(exception);\n\
    \    }\n  });\n}\n```\n\n`Promise.resolve` 用于在处理器返回的值尚未准备就绪时将其转换为 promise。\n\n\
    ### Promise 集合\n\n每个 `nest compute` 都会在其邻居的属性中存储一个传输距离内的其他 nest 数组。要检查哪些节点是可达的，请编写一个函数向所有节点尝试发送\
    \ \"ping\" 请求（一种要求响应的请求），并检查哪些返回了响应。如果你正在处理一组同时运行的 promise，`promise.all` 函数非常重要。它返回一个\
    \ promise，等待数组中的所有 promise 协调，然后解析为这些 promise 提供的值数组。如果任何 promise 被拒绝，`promise.all`\
    \ 的结果也会被拒绝。\n\n`requesttype(\"ping\", () => \"pong\");`\n\n```javascript\nfunction\
    \ availableneighbors(nest) {\n  let requests = nest.neighbors.map(neighbor =>\n\
    \    return request(nest, \"ping\").then(() => true, () => false);\n  );\n  return\
    \ promise.all(requests).then(result => nest.neighbors.filter((_, i) => result[i]));\n\
    }\n```\n\n### 网络泛洪\n\nNest 只能与其邻居通信，这极大地影响了该网络的意义。要向整个网络广播信息，解决方案是创建一种自动发送给邻居的请求类型。这些邻居将其发送给自己的邻居，直到整个网络都收集到消息。\n\
    \n```javascript\nimport from \"crow\";every(nest => {\n  nest.state.gossip = [];\n\
    });\n\nfunction sendgossip(nest, message, exception = null) {\n  nest.state.gossip.push(message);\n\
    \  for (let neighbor of nest.neighbors) {\n    if (neighbor == exception) continue;\n\
    \    request(nest, neighbor, \"gossip\", message);\n  }\n}\n\nrequesttype(\"gossip\"\
    , (nest, message, source) => {\n  if (nest.state.gossip.include(message)) return;\n\
    \  console.log(`${nest.name} received gossip '${message}' from ${source}`);\n\
    \  sendgossip(nest, message, source);\n});\n```\n\n你可以避免在网络中永远传输相似的消息，因为每个 nest\
    \ 都保存了它见过的 gossip 字符串数组。要描述此数组，请使用在每个 nest 上运行的 `every` 函数来为 nest 的状态附加一个属性。\n\
    \n### 消息路由\n\n如果一个节点想要与另一个单个节点通信，最好的方法是构建一条路径，让消息在节点之间跳跃，直到到达目的地。你需要理解网络的接口。要向远处的\
    \ nest 发送请求，知道哪个邻居 nest 可以完成任务非常重要。每个 nest 只知道它的直接邻居；它无法计算路由，因为它缺乏信息。你必须理解如何将关于这些连接的信息传播到每个\
    \ nest，以便在创建新 nest 时能够随时间推移进行转换。现在你可以使用泛洪，但不是检查消息是否已被收集，而是检查两个字符串是否相同。\n\n```javascript\n\
    requesttype(\"connections\", (nest, neighbors) => {\n  let connections = nest.state.connections;\n\
    \  if (JSON.stringify(connections) === JSON.stringify(neighbors)) return;\n  nest.state.connections\
    \ = neighbors;\n});\n\nfunction broadcastgossip(nest, message, exception = null)\
    \ {\n  for (let neighbor of nest.neighbors) {\n    if (neighbor == exception)\
    \ continue;\n    request(nest, neighbor, \"gossip\", message);\n  }\n}\n```\n\n\
    比较使用 `JSON.stringify` 是因为对对象或数组使用 `==` 只在它们是同一个实例时才会返回 true。区分字符串是比较内容的有效方法。\n\
    \n```javascript\nfunction findroute(from, to, connections) {\n  let work = [{at:\
    \ from, via: null}];\n  for (let i = 0; i < work.length; i++) {\n    let {at,\
    \ via} = work[i];\n    for (let next of connections.get(at) || []) {\n      if\
    \ (next == to) return via;\n      if (!work.some(w => w.at == next)) {\n     \
    \   work.push({at: next, via: via || next});\n      }\n    }\n  }\n  return null;\n\
    }\n```\n\n"
- fmt: "\nYou can now create a function that can send messages to long distance. If\
    \ the message is attached to a direct neighbor, it is conveyed as usual. If not,\
    \ it is wrapped in an object and transferred to a neighbor closer to the target\
    \ through the \"route,\" request type that will make that neighbor repeat the\
    \ same character.\n\n```javascript\nfunction route_request(nest, target, type,\
    \ content) {\n  if (nest.neighbors.includes(target)) {\n    return route_request(nest,\
    \ target, type, content);\n  } else {\n    let via = findroute(nest.name, target,\
    \ nest.state.connections);\n    if (!via) throw new error(`no routes to ${target}`);\n\
    \    return route_request(nest, via, \"route,\", {target, type, content});\n \
    \ }\n}\n\nrequesttype(\"route,\", (nest, {target, type, content}) => {\n  return\
    \ route_request(nest, target, type, content);\n});\n```\n\nWe have created different\
    \ layers of functionality at the top of a primary communication system to enable\
    \ easy use. this is a simplified model of how computer networks work.\n\n### Async\
    \ functions\n\nTo save significant information, crows use the duplication method,\
    \ they duplicate it across nests. That way, when a bird dismantles a nest, the\
    \ information would not be lost. To recover a particular piece of information\
    \ that has no storage bulb, a nest computer would talk to other nests in the network\
    \ until the one that has it found.\n\n```javascript\nrequesttype(\"storage,\"\
    , (nest, name) => storage(nest, name));\n\nfunction findstorage(nest, name) {\n\
    \  return storage(nest, name).then(found => {\n    if (found != null) return found;\n\
    \    else return findstorage(nest, name);\n  });\n}\n\nfunction network(nest)\
    \ {\n  return array.from(nest.state.keys());\n}\n\nfunction findremote(nest, name)\
    \ {\n  let sources = network(nest).filter(n => n != nest.name);\n  function next()\
    \ {\n    if (sources.length == 0) {\n      return promise.reject(\"not found\"\
    );\n    } else {\n      let source = sources[math.floor(math.random() * sources.length)];\n\
    \      sources = sources.filter(n => n != source);\n      return route_request(nest,\
    \ source, \"storage,\", name).then(value => value != null : next());\n    }\n\
    \  }\n  return next();\n}\n```\n\n`Object.keys` cannot work on connections because\
    \ it is a map. It contains a key method but that sends back an iterator instead\
    \ of an array. An iterator can be transformed to an array using the `array.from`\
    \ function. Various asynchronous actions are tied together unclear ways. Now you\
    \ need a recurring function model looping across the nests. In a synchronous model,\
    \ it is easy to express. Javascript also lets you write pseudo-synchronous code\
    \ to define asynchronous computation. An `async` function is a function that completely\
    \ bring back a promise and that can wait for other promises in a synchronous way.\
    \ Rewrite `findstorage` like this:\n\n```javascript\nasync function findstorage(nest,\
    \ name) {\n  let local = await storage(nest, name);\n  if (local != null) return\
    \ local;\n  let sources = network(nest).filter(n => n != nest.name);\n  while\
    \ (sources.length > 0) {\n    let source = sources[math.floor(math.random() *\
    \ sources.length)];\n    sources = sources.filter(n => n != source);\n    try\
    \ {\n      let found = await route_request(nest, source, \"storage,\", name);\n\
    \      if (found != null) return found;\n    } catch (_) {}\n  }\n  throw new\
    \ error(\"not found\");\n}\n```\n\nAn `async` function is marked with the word\
    \ `async` and the `function` keyword. Methods can also become async by writing\
    \ `async` before their name. When the function or method is called, it brings\
    \ back a promise. When the body returns something that promise is settled. If\
    \ it outputs an exception, the promise is declined. Within an `async` function,\
    \ the word `await` is set in front of an expression to await a promise, to get\
    \ settled and only then proceeds to execute the function. Such functions cannot\
    \ run from start to finish at once, but it can be frozen at points and can start\
    \ late. For non-trivial asynchronous code, this notation is easier than directly\
    \ through promises. Async functions do not have to be paused and yielded again.\
    \ Javascript consists of a feature called generators. These are identical but\
    \ do not contain the promises. When you call a function with `*` after, it changes\
    \ to a generator. When you call a generator it sends back an iterator.\n\n```javascript\n\
    function* powers(n) {\n  let current = n;\n  while (current *= n) {\n    yield\
    \ current;\n  }\n}\n\nfor (let power of powers(3)) {\n  if (power > 50) break;\n\
    \  console.log(power);\n}\n```\n\n```\nNormally, if you call `powers`, the function\
    \ is frozen at the beginning. Each time you call `next` on the iterator, the function\
    \ will run until it hits a `yield` expression, which will pause it and make the\
    \ yielded value provided by the iterator. When the function returns the iterator\
    \ completes. Writing iterators is simple when you utilize the generators. Write\
    \ the iterator for the `Group` class with this generator:\n\n```javascript\nGroup.prototype[symbol.iterator]\
    \ = function* {\n  for (let i = 0; i < this.members.length; i++) {\n    yield\
    \ this.members[i];\n  }\n};\n```\n\nThere’s no needed to build an object to hold\
    \ the iteration state, and generators store their local state immediately and\
    \ yield every time. This `yield` expression can happen only directly within the\
    \ generator function and not in an inner function that you set within it. The\
    \ generator saves when yielding. This is its local environment and the position\
    \ where it yields. An async function is a unique kind of generator. It creates\
    \ a promise when it’s called, which resolves when it completes and declines when\
    \ it outputs an exception. Anytime it yields a promise, the result of that promise\
    \ will be the result of the `await` expression.\n\n### The event loop\n\nAsynchronous\
    \ programs perform one by one. Every piece may begin a few actions and arrange\
    \ code to execute when the action completes or fails. Between these pieces, the\
    \ program does nothing awaiting the next action. So you cannot call callbacks\
    \ by the code that arranged them. If you call `setTimeout` from inside a function,\
    \ that function will have been sent back before the callback function gets called.\
    \ Asynchronous character occurs on its empty called stack. Since each callback\
    \ begins with an empty stack, your catch handlers will not be on the stack when\
    \ an exception runs.\n\n```javascript\ntry {\n  setTimeout(() => {\n    throw\
    \ new error(\"woosh\");\n  }, 20);\n} catch (_) {\n  // this will not run\n  console.log(\"\
    caught!\");\n}\n```\n"
