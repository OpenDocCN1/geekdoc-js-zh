    let object1 = {value: 10};\nlet object2 = object1;\nlet object3 = {value: 10};\n\
    console.log(object1 === object2);\n// → true\nconsole.log(object1 === object3);\n\
    // → false\nobject1.value = 15;\nconsole.log(object2.value);\n// → 15\nconsole.log(object3.value);\n\
    // → 10\n```\n\nThe property of object1 is the same, but a constant binding cannot\
    \ be changed. a constant binding points to the same object but the object can\
