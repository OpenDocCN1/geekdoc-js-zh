    \nThe problem is in the `+=` operator that takes the present value of the list\
    \ when the statement begins executing and when the wait ends sets the list binding\
    \ to be the value together with the added string. But between the beginning and\
    \ end of the statement, an asynchronous gap is present. The `map` expression is\
    \ the first to run before you can add anything to the list, so every `+=` operator\
    \ begins from an empty string and finishes when its retrieval completes. Usual\
    \ calculating new values is an error-process rather than transforming existing\
    \ values.\n\n```javascript\nasync function chicks(nest, year) {\n  let lines =\
    \ network(nest).map(async name => {\n    return name + \": \" +\nawait anystorage(nest,\
    \ names, `chicks in ${year}`);\n  });\n  return (await promise.all(lines)).join(\"\
    \\n\");\n}\n```\n\nMistakes are elementary during the use of `await` and you should\
    \ know where gaps are within your code.\n\n### Summary\n\nWe learned everything\
    \ about asynchronous programming in this chapter. Asynchronous programming enables\
    \ the expression waiting for action that runs for a long time without giving the\
    \ program problems. Environments generally utilize this style of programming through\
    \ callbacks to call actions. We touched the event loop as well. The event loop\
    \ creates a plan for such callbacks to be called it is one after another to avoid\
    \ overlapping.\n\n### Exercise\n\nWrite a javascript program to transform an asynchronous\
    \ function to return a promise.\n\n### Solution\n\n```javascript\nDefine(x, 10),\n\
    If(>(x, 5),\nPrint(\"large,)))\n\n### Chapter 13: parsing\n\nDeveloping one's\
    \ programming language is relatively easy and very exciting. This chapter will\
