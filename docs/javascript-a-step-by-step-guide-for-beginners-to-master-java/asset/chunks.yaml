    ## Introduction

    Javascript is a distinguished and deciphered programming language, that adheres
    to the ecmascript specification. the programming language consists of high-powered
    typing, the curly bracket syntax, top-quality functions, and prototype-based object-orientation.
    accompanied by html and css, javascript is one of the significant technologies
    of the world wide web. javascript facilitates interchangeable web pages and is
    a vital part of web applications. almost every website utilizes javascript and
    all the significant web browsers consist of the javascript engine to function
    correctly. brand eich developed javascript in 1995 when he was with netscape communications.
    javascript aids functional, event-driven, prototype-based and objectoriented programming
    styles. javascript upgrades web user interface by affirming activities taken on
    the client-side by the user. you can insert javascript engines into different
    types of host software, which includes databases and web servers, and non-web
    related programs like word processors.


    The concepts of javascript are explained further in this book with the goal to
    help you learn and understand javascript language without pressure. the knowledge
    of html, text editor, web browser, and css are all that''s needed to learn javascript.
    to get the learning process started, one of the essential tools is a text editor,
    and it is required to write codes. you’ll also need a browser to view your developed
    pages. there are different types of text editors such as sublime and browsers
    such as firefox, chrome.


    ## Chapter 1: what is javascript

    Javascript, abbreviated js is a high-level language introduced to add specific
    to pages and it has been adopted by all major browsers. javascript can be used
    to build interactive applications without reloading. javascript is one of the
    essential components of web, which are html (text markup language) and css (cascading
    stylesheets). javascript brings a page to life by adding client-side.

    Client-side javascript is the usual form of javascript. the script must be inserted
    in an html document so the browser can interpret the code. it enables web pages
    to include dynamic content, users need a browser to see-developeddeveloped pages,
    there are different types of text editors such as sublime, notepad.


    ### Client-side Javascript placement

    ```html

    <head>

    <script>

    // code here

    </script>

    </head>

    ```


    Advantages of javascript

    * with javascript, users can organize input before getting the page to the server,
    which automatically reduces loads on the server.

    * javascript enables swift response to page visitors. the page does not have to
    reload before visitors can see if was an error in typing.

    * javascript is used to build a reactive interface that gives reaction the mouse
    hovers over them.


    Limitations of javascript

    Javascript language lacks the following essentials. they are:

    * for security reasons, client-side javascript does not read or write files

    * javascript for networking applications

    * javascript does not contain multiprocessor capabilities

