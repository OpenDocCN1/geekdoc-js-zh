  trans: "\n循环控制流允许用户返回编写程序中的某些点，并根据程序的当前状态重新执行。将其与如下所示枚举的绑定相结合：\n\n```javascript\n\
    let number = 0;\n\nWhile (number <= 12) {\nConsole.log(number);\nNumber = number\
    \ + 2;\n}\n// → 0\n// → 2\n// … 等\n```\n\n一个以关键字开头并同时产生循环的语句。关键字 `while` 跟着一个括号内的表达式，然后跟一个类似于\
    \ `if` 语句的语句。循环将持续进行，直到表达式在转换为布尔值时为真（true）。循环每次重复，数值都会变为其之前值的两倍。让我们写一个程序来计算并显示\
    \ 2¹⁰（2 的 10 次方）的值。我们将使用两个绑定：一个用于监控我们的结果，另一个用于计算 2 乘以结果的次数。它会一直相乘，直到第二个绑定达到 10：\n\
    \n```javascript\nlet result = 1;\nlet counter = 0;\nWhile (counter < 10) {\nResult\
    \ = result * 2;\nCounter = counter + 1;\n}\nConsole.log(result);\n// → 1024\n\
    ```\n\n`do` 循环是一个与 `while` 循环相关的命令结构。`do` 循环在语句中至少会发生一次，然后在第一次执行后开始检查是否应该结束。请遵循以下步骤：\n\
    \n```javascript\nlet yourname;\nDo {\nYourname = prompt(\"who are you?\");\n}\
    \ while (! yourname);\nConsole.log(yourname);\n```\n\n### For 循环\n\n许多循环遵循 `while`\
    \ 循环模式，创建一个计数器绑定来跟踪循环的进度。然后使用带有测试表达式的 `while` 循环来检查计数器是否达到了设定值。\n\n```javascript\n\
    For (let number = 0; number <= 10; number = number + 4) {\nConsole.log(number);\n\
    }\n// → 0\n// → 4\n// 等\n```\n\n括号必须在关键字后包含两个分号，第一个分号之前的部分通过描述绑定来分隔循环。另一部分是决定循环是否应该继续的语句。这里是使用\
    \ `for` 代替 `while` 计算 2¹⁰ 的代码：\n\n```javascript\nlet result = 1;\nFor (let counter\
    \ = 0; counter < 10; counter = counter + 1) {\nResult = result * 2;\n}\nConsole.log(result);\n\
    // → 1024\n```\n\n### 跳出循环\n\n除了让循环条件为假之外，还有其他方法结束循环。`break` 可以影响跳出限制循环。如果第一个数字既大于等于\
    \ 20 且能被 7 整除，`break` 语句执行此程序。\n\n```javascript\nFor (let current = 20; current\
    \ = current + 1) {\nIf (current % 7 == 0) {\nConsole.log(current);\nbreak;\n}\n\
    // → 21\n```\n\n`%` 运算符用于检查一个数字是否能被另一个数字除。如果它可以被除除，那么余数为零。例如 for 不会在循环结束时进行检查，这意味着在内部的\
    \ `break` 语句之前，循环将是无限的且永远不会停止。\n\n### 简洁更新\n\n当你在循环中时，程序会定期更新绑定以根据其之前的值存储一个值。\n\
    \n```javascript\ncounter = counter + 1;\n```\n\nJavascript 提供了快捷方式。\n\n```javascript\n\
    counter += 1;\n```\n\n对于 `counter += 1` 和 `counter -= 1`，这里有更短的等价写法：`counter++`\
    \ 和 `counter--`。这使我们能够减少计数。\n\n```javascript\nFor (let number = 0; number <= 12;\
    \ number += 2) {\nConsole.log(number);\n}\n```\n\n### 使用 switch 进行值分发\n\n使用 `switch`\
    \ 对值进行分发如下：\n\n```javascript\nIf (x == \"value1\") action1();\nElse if (x == \"\
    value2\") action2();\nElse if (x == \"value3\") action3();\nElse defaultaction();\n\
    ```\n\n`switch` 用于直接地表达上述形式的分发。下面是一个很好的例子：\n\n```javascript\nSwitch (prompt(\"\
    what is the atmosphere like?\")) {\nCase \"rainy\":\nConsole.log(\"do not forget\
    \ to come with an umbrella.\");\nbreak;\nCase \"sunny\":\nConsole.log(\"be light\
    \ with your dressing.\");\nCase \"cloudy\":\nConsole.log(\"move out.\");\nbreak;\n\
    Default:\nConsole.log(\"weather type unknown!\");\nbreak;\n}\n```\n\n### 大写规范\n\
    \n绑定名称不允许空格，但它支持使用多个单词来定义绑定值。这里是当用不同单词命名绑定时可以利用的类型：\n\n- `Fuzzylittle`\n- `Fuzzy_little`\n\
    - `Fuzzy_little`\n\n### 注释\n\n某些原始注释不会传输你希望程序处理的文本 // 注释只出现在行尾。\n\n```javascript\n\
    let result = calculate(); // comment\n```\n\n```javascript\nlet result = calculate();\n\
    /*\n  注释是一个\n  块结构\n*/\n它是否包含多行没有关系。\n\n```javascript\n/*\n  多行\n  注释\n*/\n```\n\
    \n### 总结\n\n现在你理解了可以通过语句来开发程序，而语句本身包含表达式。语句由表达式组成，你可以通过较小的表达式创建表达式。将语句一个接一个设置提供了从上到下的执行程序。也可以通过条件（if,\
    \ else 和 switch）和循环（while, do 和 for）语句向流引入干扰。我们还提到了绑定，它们将数据位分类到名称下，并且也可以在程序中跟踪状态。\n\
    \n练习：编写一个显示较大整数并接收两个整数的 javascript 程序。\n\n"
- fmt: "\n# Solution\n\n![00104.jpg](images/00104.jpeg)![00054.jpg](images/00054.jpeg)\n\
    \nIt is important to know that you can write `.length` at the end of a string\
    \ to find its length.\n\n```javascript\nlet abc = \"abc\";\nConsole.log(abc.length);\
    \ // → 3\n```\n\n## Chapter 4: functions\n\nFunctions are the alpha and omega\
    \ of javascript programming language, the concept of enclosing a bit of program\
    \ contained in value has a lot of advantages. it provides a way to organize more\
    \ prominent programs, to minimize repetition, relate names with subprograms, and\
    \ separate programs from the selves. functions are used to describe new words.\n\
    \n### Defining a function\n\nA function is a systematic binding where by a function\
    \ defines the binding value. the code below indicates a function that provides\
    \ the square of a stated number:\n\n```javascript\nconst square = function(x)\
    \ {\n  return x * x;\n};\n\nConsole.log(square(12)); // → 144\n```\n\nCreate a\
    \ function with an expression that begins with the keyboard `function`. functions\
    \ consists of a body and a set of parameters that accommodates the yet to be executed\
    \ statements when you call a function. the function body should always be enclosed\
    \ in braces, even when it is just an individual statement. a function can contain\
    \ several parameters or zero parameter. in the below example, `make_noise` contains\
    \ no parameter names and `power` consists of two:\n\n```javascript\nconst make_noise\
    \ = function() {\n  Console.log(\"pling!\");\n};\n\nMake_noise(); // → pling!\n\
    \nconst power = function(base, exponent) {\n  let result = 1;\n  for (let count\
    \ = 0; count < exponent; count++) {\n    result *= base;\n  }\n  return result;\n\
    };\n\nConsole.log(power(2, 10)); // → 1024\n```\n\nSome functions can create values\
    \ such as `square` and `power` while some results only into a side effect. a return\
    \ keyword that does not contain an expression at the end will be returned as undefined.\n\
    \n### Bindings and scopes\n\nEvery binding consists of a scope, that enables the\
    \ visibility of the binding. whenever you call a function, new illustrations of\
    \ binding are developed. this creates separation between functions, every function\
    \ call behaves in its own world and is easy to understand. functions that we are\
    \ declared with the `var` keyword in the pre-2015 javascript and can be seen throughout\
    \ the global scope. they are absent in a function.\n\n```javascript\nlet x = 10;\n\
    if (true) {\n  let y = 20;\n  var z = 30;\n  Console.log(x + y + z); // → 60\n\
    } // y is not visible here\nConsole.log(x + z); // → 40\n```\n\n### Nested scope\n\
    \nJavascript differentiates between the global and local bindings. you can create\
    \ block and functions within the other functions and blocks manufacturing degrees\
    \ of locality. for instance, this function produces the nested components to make\
    \ ahummus contains another function within it:\n\n```javascript\nconst hummus\
    \ = function(factor) {\n  const inner = function(amount, unit) {\n    let amount\
    \ = amount * factor;\n    if (amount > 1) {\n      unit += \"s\";\n    }\n   \
    \ Console.log(`${amount} ${unit}`);\n  };\n  inner(1, \"chickpeas\");\n  inner(0.25,\
    \ \"tahini\");\n  inner(0.25, \"lemon juice\");\n  inner(1, \"garlic\");\n  inner(2,\
    \ \"tablespoon olive oil\");\n  inner(0.5, \"teaspoon\");\nThe code within the\
    \ component function can access the `factor` binding from the outer function.\
    \ the set of bindings accessible within a block is decided by the block position\
    \ in the text. every local scope can access the contained scope and every scope\
    \ as well access the global scope. this concept is named lexical scoping.\n\n\
    ### Functions as values\n\nA function binding often has a name for a particular\
    \ block of program. this type of binding does not change because it is defined.\
    \ functions can be used in arbitrary expressions as well as used to save a function\
    \ value into a new binding. a binding that stores a function is a systematic binding\
    \ and a new value can be assigned like:\n\n```javascript\nlet launchmissiles =\
