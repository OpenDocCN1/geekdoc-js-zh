    \ 2023 – ryan roffe，保留所有权利。未经作者或出版者的直接许可，书中包含的内容不得被复制、复制或传输。对于因本书中所包含的信息而直接或间接导致的任何损害、赔偿或资金损失，出版者或作者均不承担任何责任或法律责任。\n\
    \n### 法律声明\n本书受版权保护。此书仅供个人使用。未经作者或出版者的同意，您不得修改、分发、销售、使用、引用或转述本书的任何部分或内容。\n\n###\
    \ 免责声明\n请注意，本文档中包含的信息仅供教育和娱乐目的。我们已尽最大努力提供准确、最新、可靠、完整的信息。本手册不声明或暗示任何形式的保证。读者承认，作者不提供法律、财务、医疗或专业建议。书中的内容源自各种来源。在尝试书中概述的任何技术之前，请咨询执业的专业人士。\n\
    \n通过阅读本文，读者同意在任何情况下，作者均不对因使用本文中所包含的信息而导致的任何直接或间接损失负责，包括但不限于错误、遗漏或不准确。\n\n## 目录\n\
    * 引言\n* 第 1 章：什么是 javascript\n* 第 2 章：值、类型和操作符\n* 第 3 章：程序结构\n* 第 4 章：函数\n* 第\
    \ 5 章：数据结构：对象和数组\n* 第 6 章：高阶函数\n* 第 7 章：对象的秘密生活\n* 第 8 章：机器人\n* 第 9 章：漏洞和错误\n\
    * 第 10 章：正则表达式\n* 第 11 章：模块\n* 第 12 章：异步编程\n* 结论\n\n## 引言\nJavascript 是一种卓越且成熟的编程语言，遵循\
    \ ECMAScript 规范。该语言由强类型系统、大括号语法、高质量的函数以及基于原型的面向对象机制组成。配合 HTML 和 CSS，Javascript\
    \ 是全球网的重要技术之一。Javascript 促进了交互式网页的实现，是 Web 应用程序的重要部分。几乎每个网站都使用了 Javascript，所有主要的网页浏览器都包含\
    \ Javascript 引擎以正常运行。Brend Eich 在 1995 年任职 Netscape Communications 时开发了 Javascript。Javascript\
    \ 支持函数式、事件驱动、基于原型和面向对象的编程风格。Javascript 通过确认用户在客户端执行的操作来提升 Web 用户界面。你可以将 Javascript\
    \ 引擎插入到不同类型的主机软件中，包括数据库、Web 服务器以及文字处理器等非网页相关程序。\n\n本书进一步解释了 Javascript 的概念，旨在帮助您在没有压力的情况下学习和理解\
    \ Javascript 语言。学习 Javascript 只需要 HTML、文本编辑器、网页浏览器和 CSS 知识。要开始学习过程，必备工具之一是文本编辑器（编写代码必需），你还需要一个浏览器来查看开发的页面。有不同类型的文本编辑器，如\
    \ Sublime，以及浏览器如 Firefox、Chrome。\n\n## 第 1 章：什么是 javascript\nJavascript（简称为 js）是一种高级语言，最初用于为页面添加特定功能，并已被所有主流浏览器采用。Javascript\
    \ 可用于无需重新加载页面即可构建交互式应用程序。Javascript 是 Web 的核心组成部分，其他是 HTML（文本标记语言）和 CSS（级联样式表）。Javascript\
    \ 通过添加客户端脚本让页面变得活跃。\n客户端 Javascript 是 Javascript 的常见形式。脚本必须插入到 HTML 文档中，以便浏览器可以解释代码。它允许网页包含动态内容，用户需要浏览器来查看开发的页面，有不同类型的文本编辑器，如\
    \ Sublime、记事本（notepad）。\n\n### 客户端 Javascript 放置\n```html\n<head>\n<script>\n\
    // 代码写在这里\n</script>\n</head>\n```\n\n Javascript 的优点\n* 通过 Javascript，用户可以在将页面发送到服务器之前对输入进行整理，这自动减轻了服务器负载。\n\
    * Javascript 能够对页面访问者做出快速响应。访问者无需刷新页面即可看到是否存在输入错误。\n* Javascript 用于构建响应式界面，当鼠标悬停在元素上时会产生反应。\n\
    \nJavascript 的局限性\nJavascript 语言缺少以下要素。它们是：\n* 出于安全考虑，客户端 Javascript 不读取或写入文件\n\
    * 用于网络应用程序的 Javascript\n* Javascript 不具备多处理器能力\n\n"
- fmt: "\nThe script within `<body>` part.\n\nThe script within `<body>` and `<head>`\
    \ part.\n\nInclude external file script in the `<head>...</head>` part.\n\n###\
    \ Javascript in `<head>...</head>` section\n\nIn some cases, when you want the\
    \ script to run on a special event, such as an action when a button clicked, place\
    \ the script in the head section like this:\n\n```html\n<html>\n<head>\n<script\
    \ type=\"text/javascript\">\n<!--\nFunction sayhi() {\n  Alert(\"hello world\"\
    )\n}\n//-->\n</script>\n</head>\n<body>\nTap here for result\n<input type=\"button\"\
    \ onclick=\"sayhi()\" value=\"say hi\" />\n</body>\n</html>\n```\n\n### Javascript\
    \ in `<body></body>` section\n\nSometimes you want a script to run immediately\
    \ and to create script on the content page, insert the script within the `<body>`\
    \ section. this is what the code should look like:\n\n```html\n<html>\n<head>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\n<!--\nDocument.write(\"hello\
    \ world\")\n//-->\n</script>\n<p>this is web page body</p>\n</body>\n</html>\n\
    ```\n\n### Javascript in `<body>` and `<head>` sections\n\nInsert your javascript\
    \ code in `<head>` and `<body>` section like this:\n\n```html\n<html>\n<head>\n\
    <script type=\"text/javascript\">\n<!--\nFunction sayhi() {\n  Alert(\"hello world\"\
    )\n}\n//-->\n</script>\n</head>\n<body>\n<script type=\"text/javascript\">\n<!--\n\
    Document.write(\"hello world\")\n//-->\n</script>\n<input type=\"button\" onclick=\"\
    sayhi()\" value=\"say hi\" />\n</body>\n</html>\n```\n\n### Javascript in external\
    \ files\n\nTo avoid the use of identical javascript code repetition, the language\
    \ enables you to create an external file, and store javascript codes and then\
    \ integrate the external file into the html files. the sample below displays how\
    \ to integrate an external javascript file within the html code utilizing the\
    \ `script` tag and `src` attribute.\n\n```html\n<html>\n<head>\n<script type=\"\
    text/javascript\" src=\"filename.js\"></script>\n</head>\n<body>\n.......\n</body>\n\
    </html>\n```\n\nThe external file source file should be saved with an extension\
    \ `.js`.\n\n#### Summary\n\nIn this first chapter, we explained the origination\
    \ of javascript and its placement into internal and external files. we discussed\
    \ the use of javascript to build interactive web applications to perform appropriately\
    \ without having to reload every page, per-action.\n\n#### Exercise\n\nHow do\
    \ you insert javascript code into the head, body and include external file script\
    \ in an html document?\n\n#### Solution\n\nThe script for the head part is `<head></head>`.\n\
    The script for the body part is `<body></body>`.\nThe script within the body is\
    \ `<body>` and `<head></head>`.\nThe script to include external file in the `<head>...</head>`.\n\
    \n## Chapter 2: values, types and operators\n\nIn the world of computers, re is\
    \ data. you can create new data and change data which are all stored as a lookalike\
    \ sequence of bits. define bits as zeros and ones that take a strong weak high\
    \ or low electrical charge from the computer. all data of information are described\
    \ as a sequence of zeros and ones and represented in bits.\n\n### Values\n\nTake\
    \ a deep breath and think of an ocean of bits. latest contains more than 30 billion\
    \ bits in its data storage. we use bits to create values. the computer can function\
    \ correctly because every bit of information is split into values. every value\
    \ consists of a type that influences its role, and values can be numbers text\
    \ etc. to generate value, you need to invoke its name, and it appears where it\
    \ was stored.\n\n### Arithmetic\n\nArithmetic is the major thing to do with numbers.\
    \ the multiplication and subtraction of than one number to produce another number\
    \ is an arithmetic operation. this is an example of what they look like in javascript:\n\
    \n```javascript\n100 + 4 * 11\n```\n\nThe `+` and `*` symbols are called operators,\
    \ the first means addition while the other means multiplication. an operator inserted\
    \ between two values will produce another value. the `-` operator is for subtraction\
    \ and the `/` operator is for the division. if operators show together without\
    \ parentheses, the precedence of the operators decides the way they are applied.\
    \ if several operators with the same precedence show right next to each other\
    \ like `1 - 2 + 1`, apply them left to right: `(1 - 2) + 1`.\n\n### Special numbers\n\
    \nJavascript consists of three unique values that do not act like numbers but\
    \ are regarded as numbers. `infinity` and `-infinity` are the first two which\
    \ mean the positive and negative infinities, and the last value is the `nan`.\
    \ `nan` says “not a number,” although it is a value of the number type.\n\n###\
    \ Strings\n\nA string is the sequence of numbers. the string is the next data\
    \ type, and they represent text. strings confine their content in quotes.\n\n\
    `down the walkway path. `\n\"on top of the roof.\"\n'I am at home.'\n\nQuotes\
    \ are used in different types like double quotes, single quotes or the backticks\
    \ to mark strings. it is a type that matches. you cannot use the `+` operator\
    \ which will not add but concatenate strings. (Wait, the text says \"but concatenate\
    \ strings\" - referring to Chapter 2).\n\n### Unary operators\n\nSymbols do not\
    \ represent all operators. you can write some operators in words. a clear example\
    \ is a type of the type of the attached value:\n\n```javascript\nconsole.log(type\
    \ of 4.5) // -> number\nconsole.log(type of \"x\") // -> string\n```\n\nThe second\
    \ operator displayed is called the binary operator because they use two values,\
    \ while operators that use one value are the unary operator.\n\n```javascript\n\
    console.log(- (10 - 2)) // -> -8\n```\n\n### Boolean values\n\nBoolean is a value\
    \ that differs only between two possibilities such as “on” and “off” and so on.\
    \ the boolean consists of only true and false.\n\n### Comparison\n\nComparison\
    \ is a way to create boolean values:\n\n```javascript\nconsole.log(3 > 2) // ->\
    \ true\nconsole.log(3 < 2) // -> false\n```\n\nThe `>` and `<` characters are\
    \ the signs that represent “is greater than” and “is less than,” accordingly.\
    \ you can use binary operators in a boolean value that determines if the match\
    \ is true or false. You can compare strings in the same manner.\n\n```javascript\n\
    console.log(\"aardvark\" < \"zoroaster\") // -> true\n```\n"
