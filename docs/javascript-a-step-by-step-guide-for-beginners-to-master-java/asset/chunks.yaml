    \  request(nest, neighbor, \"gossip\", message);\n  }\n}\n```\n\nThe comparison\
    \ uses `JSON.stringify` because `==` on objects or arrays will only return true\
    \ if they are the same instance. Differentiating the strings is a successful way\
    \ to compare the content.\n\n```javascript\nfunction findroute(from, to, connections)\
