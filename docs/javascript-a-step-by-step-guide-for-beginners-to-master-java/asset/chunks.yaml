    ## Chapter 3: program structure


    We will begin the expansion of the javascript language beyond sentences and nouns.


    #### Expressions and states


    A block of code that makes a value is called an expression. a single value is
    written precisely as `22` or psychoanalysis is an expression. an expression within
    a binary operator set to two expressions is an expression. an expression that
    can accommodate other expressions similarly to how human language translates.
    it enables us to develop expressions that narrate arbitrarily complex computations.
    when an expression is comparable to a sentence, the javascript state will complete
    the sentence. a list of states is called a program, and the most accessible type
    of state is a line of code with a semicolon ending it.


    With this function, a state can stand independently, and it can add a feature
    that changes colors occasionally to a screen or modify the inner state of the
    machine, influencing the following states after it.


    ### Bindings


    Javascript uses binding of variables to hold values, for instance:


    ```

    Get money = 5 * 5;

    ```

