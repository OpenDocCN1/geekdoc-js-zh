    代码进会跨文件行保存并创建对象。顶部的属性直接保存到该对象中，而位于章节中的属性则保存在不同的章节对象中。章节绑定（section binding）指向现有章节的对象。重要的行有两种类型——章节头或属性行。如果某行始终是属性，则将其保存在现有的章节中；如果它是一个章节头，则构建一个新的章节对象，并将
    `section` 设置它。


    模式 `if (match = string.match())` 与利用赋值作为 `while` 循环条件的技巧是完全相同的。


    ### 国际字符


    由于 JavaScript 初始实现非常简单，且这种方法已被确立为标准行为，JavaScript 的正则表达式在处理英语语言中未显示的字符时显得有些“愚笨”。例如，在
    JavaScript 中，正则表达式中的“单词字符”（word character）仅仅是拉丁字母表中的 26 个字符之一（小写或大写）、进制数字和下划线字符。像
    `é` 或 `ß` 这样的字符也是单词字符，但它们不会匹配 `\w`，而是会匹配大写的 `\W`（非单词字符）。这表示这些字符是由两个代码单元组成的。


    ```

    Console.log(/🍎{3}/.test("🍎🍎🍎"));

    // → false,


    Console.log(/<.>/.test("<🌹>"));

    // → false,


    Console.log(/<.>/u.test("<🌹>"));

    // → true,

    ```


    这里识别出的问题是，第一行中的 `🍎` 被视为两个代码单元，而 `{3}` 部分仅作用于第二个单元。点号 `.` 也只匹配单个代码单元。在你的正则表达式中添加
    `u` 选项（代表 Unicode），以便它能正确处理这些字符。遗憾的是，这种错误的行为仍被设置为默认值，因为更改它可能会为依赖于它的现有代码创建问题。


    你你可以在正则表达式中使用 `\p` 来匹配 Unicode 标准赋予任何集合属性的每一个字符。


    ```

    Console.log(/\p{script=greek}/u.test("α"));

    // → true,


    Console.log(/\p{script=arabic}/u.test("α"));

    // → false,


    Console.log(/\p{alphabetic}/u.test("α"));

    // → true,


    Console.log(/\p{alphabetic}/u.test("!"));

    // → false,

    ```


    Unicode 描述了许多重要的属性，尽管寻找你需要的属性并不总是易的。


    ### 总结


    我们在本章中关注了正则表达式。代表字符串中模式的对象就是正则表达式。它们由语言组成并利用它来展示模式。


    - `/abc/` 字符序列

    - `[abc]` 范围内的字符

    - `[^abc]` 范围外的任何字符

    - `[0-9]` 字符集内的任何字符

    - `+/` 模式一次或多次出现

    - `+?` 一次或多次（非贪婪）

    - `*/` 零或多次出现

    - `?` 零或一次出现

    - `{2,4}` 二到四次

    - `(abc)` 分组

    - `/a|b|c` 各种模式中的任意一个

    - `\d` 任意数字字符

    - `\w` 单词字符

    - `\s` 任意空格字符

    - `.` 除换行外的任何字符

    - `\b` 单词边界

    - `/^` 输入开始

    - `$/` 输入结束


    正则表达式包含一个 `test` 方法来检查字符串是否匹配它。它还包含一个 `exec` 方法，用于查找匹配并返回一个包含每个分组的数组。这种类型的数组包含一个
    `index` 属性，指定匹配开始的位置。字符串使用匹配方法来与正则表达式进行匹配，并使用搜索方法来查找，后者仅返回匹配的起始位置。


