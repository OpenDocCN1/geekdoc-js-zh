    \ `*/` 的最小字符范围是星号匹配。它只吸收一个块注释。\n\n```javascript\nfunction stripcomments(code,)\
    \ {\n  return code.replace(/\\/\\/\\/.*|\\/\\*[^]*?\\*\\//g, \"\");\n}\n\nConsole.log(stripcomments(\"\
    1  /* a */+/* b */  1\"));\n// → 1 + 1\n```\n\n### 动态创建正则对象\n\n在编写代码时，在某些情况下，你可能无法确定应该匹配的具体模式。如果你想在一段文本中搜索用户名，并将其包裹在下划线字符中以使其唯一，但你可以创建一个字符串并利用\
    \ `RegExp` 构造函数。下面是一个示例：\n\n```javascript\nlet name = \"harry\";\nlet text = \"\
    harry is a suspicious character.\";\nlet regex = new RegExp(\"\\\\b(\" + name\
    \ + \")\\\\b\", \"gi\");\n\nConsole.log(text.replace(regex, \"_$1_\"));\n// →\
    \ _harry_ is a suspicious character.\n```\n\n如果你想构建 `\\b` 边界标记，请使用双反斜杠，因为你在普通字符串中编写它们。`RegExp`\
    \ 构造函数的第二个参数由正则表达式所需的选项组成。`\"gi\"` 代表全局匹配和不区分大小写。下面是一个示例：\n\n```javascript\nlet\
    \ name = \"dea+hl[]rd\";\nlet text = \"this dea+hl[]rd guy is super annoying.\"\
    ;\nlet escaped = name.replace(/[\\.+.+?(){|^$]/g, \"\\\\$&\");\nlet regex = new\
    \ RegExp(\"\\\\b\" + escaped + \"\\\\b\", \"gi\");\nConsole.log(text.replace(regex,\
    \ \"_$&_\"));\n// → this _dea+hl[]rd_ guy is very annoying.\n```\n\n### search\
    \ 方法\n\n你不能直接在正则表达式上调用字符串的 `indexOf` 方法。你可以使用另一个方法 `search`，你可以在其中对正则表达式调用 `indexOf`\
    \ 方法，它会返回第一次看到该表达式的索引，如果没有看到，则返回 -1。\n\n```javascript\nConsole.log(\"  word\"\
    .search(/\\s/));\n// → 2\n\nConsole.log(\"  \".search(/\\s/));\n// → -1\n```\n\
    \n### lastIndex 属性\n\n`exec` 方法并没有提供一种更好的方法从字符串的指定位置开始搜索。正则表达式对象包含属性。其中一个属性是 `source`，它由构建表达式的字符串组成。`lastIndex`\
    \ 是另一个属性，它影响下一次匹配开始的某些细微情况。正则表达式必须包含全局 (`g`) 或粘性 (`y`) 选项，并且将使用 `exec` 方法进行匹配。下例所示：\n\
    \n```javascript\nlet pattern = /y/g;\npattern.lastIndex = 3;\nlet match = pattern.exec(\"\
    xyz\");\nConsole.log(match.index); // → 4\nConsole.log(pattern.lastIndex); //\
    \ → 5\n```\n\n全局选项和粘性选项之间的区别在于：如果你启用了粘性，如果匹配从 `lastIndex` 开始，则匹配成功；而在全局模式下，它会找到一个可以开始匹配的位置。\n\
    \n```javascript\nlet global = /abc/g;\nConsole.log(global.exec(\"abc\")); // [\"\
    abc\"]\n\nlet sticky = /abc/y;\nConsole.log(sticky.exec(\"abc\")); // null\n```\n\
    \n如果你在多次调用中共享一个正则表达式值，那么 `lastIndex` 属性的自动更新将会出现问题。\n\n```javascript\nlet digit\
    \ = /\\d/g;\nConsole.log(digit.exec(\"it is here: 1\")); // [\"1\"]\nConsole.log(digit.exec(\"\
    and now: 1\")); // null\n```\n\n最好的做法是遍历字符串中模式的所有事件，并在循环体中访问匹配对象。使用 `lastIndex`\
    \ 来实现这一点。\n\n```javascript\nlet input = \"a string with three numbers...42 and\
    \ 88.\";\nlet number = /\\d+\\b/g;\nlet match;\nwhile (match = number.exec(input))\
    \ {\n  Console.log(match[0], \"at\", match.index);\n}\n// found 42 at 14\n// found\
    \ 88 at 33\n```\n\n赋值值 (`=`) 是指定的值，因此在 `while` 状态中使用 `match = number.exec(input)`\
    \ 作为条件，匹配会在每次迭代开始时执行匹配，将结果存储在绑定中，并在无法找到更多匹配时停止循环。\n\n### 解析 ini 文件\n\n```ini\n\
