    \ return;\n  let progress = 0;\n  Try {\n    Accounts[from] -= amount;\n    progress\
    \ = 1;\n    Accounts[getaccount()] += amount;\n    progress = 2;\n  } finally\
    \ {\n    If (progress == 1) {\n      Accounts[from] += amount;\n    }\n}\n```\n\
    \n### Selective catching\n\nWhen an exception makes it to the bottom of a block\
    \ of code without errors, it is handled by the environment.. invalid uses such\
    \ as inspecting up property on null, citing a nonexistent binding, or calling\
