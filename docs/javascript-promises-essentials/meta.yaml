  - "[PAGE 16]\n\n# Can't I just use a callback?\n\nCallbacks are simple! We pass\
    \ a function, it gets invoked at some point in the future, and we get to do things\
    \ asynchronously. Additionally, callbacks are lightweight since we need to add\
    \ extra libraries. Using functions as higher-order objects is already built into\
    \ the JavaScript programming language; hence, we do not require additional code\
    \ to use it.\n\nHowever, asynchronous programming in JavaScript can quickly become\
    \ complicated if not dealt with care, especially callbacks. Callback functions\
    \ tend to become difficult to maintain and debug when nested within long lines\
    \ of code. Additionally, the use of anonymous inline functions in a callback can\
    \ make reading the call stack very tedious. Also, when it comes to debugging,\
    \ exceptions that are thrown back from a deeply nested set of callbacks might\
    \ not propagate properly up to the function that initiated the callback within\
    \ the chain, which makes it difficult to determine exactly where the error is.\
    \ Moreover, it is hard to structure a code that is based around callbacks as they\
    \ roll out a messy code like a snowball. We will end up having something like\
    \ the following code sample on a much larger scale:\n\n```\nfunction readJSON(filename,\
    \ callback) {\n  fs.readFile(filename, function (err, result) {\n    if (err)\
    \ return callback(err);\n    try {\n      result = JSON.parse(result, function\
    \ (err, result) {\n        fun.readAsync(result, function (err, result) {\n  \
    \        alert(\"I'm inside this loop now\");\n        });\n        alert(\"I'm\
    \ here now\");\n      });\n    } catch (ex) {\n      return callback(ex);\n  \
    \  }\n    callback(null, result);\n  });\n}\n```\n\nThe sample code in the previous\
    \ example is an excerpt of a deeply nested code that is sometimes referred to\
    \ as the pyramid of doom. Such a code, when it grows, will make it a daunting\
    \ task to read through, structure, maintain, and debug.\n\n![](img/04c7981ae2601bc5401805f632a22d49_16_0.png)"
  - "[PAGE 17]\n\n# JavaScript Promises – Why Should I Care?\n\nPromises, on the other\
    \ hand, provide an abstraction to manage interactions with asynchronous APIs and\
    \ present a more managed approach towards asynchronous programming in JavaScript\
    \ compared to the use of callbacks and event handlers. We can think of promises\
    \ as more of a pattern for asynchronous programming.\n\nSimply put, the promises\
    \ pattern will allow the asynchronous programming to move from the continuation-passing\
    \ style that is widespread to one where the functions return a value, called a\
    \ promise, which will represent the eventual results of that particular operation.\n\
    \nIt allows you to go from:\n\n```\ncall1(function (value1) {\n  call2(value1,\
    \ function(value2) {\n    call3(value2, function(value3) {\n      call4(value3,\
    \ function(value4) {\n        // execute some code\n      });\n    });\n  });\n\
    });\n```\n\nTo:\n\n```\nPromise.asyncCall(promisedStep1)\n.then(promisedStep2)\n\
    .then(promisedStep3)\n.then(promisedStep4)\n.then(function (value4) {\n  // execute\
    \ some code\n});\n```\n\nIf we list the properties that make promises easier to\
    \ work with, they will be as follows:\n\n+   - It is easier to read as the usage\
    \ of cleaner method signatures\n- It allows us to attach more than one callback\
    \ to a single promise\n- It allows for values and errors to be passed along and\
    \ bubble up to the caller function\n- It allows for chaining of promises\n\nWhat\
    \ we can observe is that promises bring functional composition to synchronous\
    \ capabilities by returning values, and error bubbling by throwing exceptions\
    \ to the asynchronous functions. These are capabilities that we take for granted\
    \ in the synchronous world."
  - "[PAGE 18]\n\nThe following sample (dummy) code shows the difference between using\
    \ callbacks to compose asynchronous functions communicating with each other and\
    \ promises to do the same.\n\nThe following is an example with callbacks:\n\n\
    ```\n$(\"#testInput\").click(function () {\n  firstCallback(function (param) {\n\
    \    getValues(param, function (result) {\n      alert(result);\n    });\n  });\n\
    });\n```\n\nThe following is a code example that converts the previous callback\
    \ functions to promise-returning functions that can be chained to each other:\n\
    \n```\n$(\"#testInput\").clickPromise() // promise-returning function\n  .then(firstCallback)\n\
    \  .then(getValues)\n  .then(alert);\n```\n\nAs we have seen, the flat chains\
    \ that promises allow us to have code that is easier to read and eventually easier\
    \ to maintain when compared to the traditional callback approach.\n\n# Summary\n\
    \nCallbacks in JavaScript allow us to have a user interface that is more responsive\
    \ by asynchronously to events (that is, user input), without blocking the rest\
    \ of the application. Promises are a pattern that allows for a standardized approach\
    \ to asynchronous programming, which enables developers to write asynchronous\
    \ code that is more readable and maintainable.\n\nIn the next chapter, we will\
    \ take a look at the browsers that support promises and their compatibility with\
    \ jQuery. You will also learn about libraries that support promise-like functionalities."
