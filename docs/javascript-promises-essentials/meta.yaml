    // 一个返回 jquery promise 的 ajax 调用

    var jQueryPromise = $.ajax(''/sample.json'');

    // 修复它并将其转换为符合标准的 promise

    var standardPromise = Promise.resolve(jQueryPromise);

    ```


    归根结底，Promises/A+ 的核心目标是提供一个最少、最简单的规范，以便在存在风险的情况下，也能允许不同 promise 实现之间进行可靠的互操作。


    > Just为了消除可能产生的任何困惑，承诺解析程序与某些实现在公共 API 中提供的 `promise.resolve` 方法并不相同。


    为了符合 Promises/A+ 标准的核心目标，Promises/A+ 组织创建了一个合规性测试套件，用于测试 promise 库或 API 实现是否符合
    Promises/A+ 规范。合规测试可以在 https://github.com/promises-aplus/promises-tests 找到，其目的是为实现是否满足要求并符合标准提供更具体的指导和证据。


    ## 浏览器支持与兼容性


    JavaScript 与浏览器紧密耦合，promise 也是也是如此，因为 promise 在之前的 ECMAScript 版本中并不是标准，而它们将成为新的
    ECMAScript 6 发布版本的一部分；因此它们不会在所有浏览器中都得到支持。此外，promise 可以被实现，我们将见证许多库提供类似 promise
    的功能或暴露 promise 的能力。在本章的剩余部分中，我们将涵盖这两个在处理 promise 时至关重要的要点。


    ## Promise API 及其兼容性


    ### 检查浏览器兼容性


    与任何客户端技术一样，JavaScript 显式地开发用于在结合 HTML 页的 Web 浏览器中使用。它利用浏览器来完成工作，这就是为什么它是一门脚本语言。一旦脚本被发送到浏览器，就由浏览器来对其进行处理。这里存在很强的依赖关系；因此，浏览器兼容性至关重要。


    某些浏览器中已经有了 promise 的实现；在编写本书时，有一小部分浏览器支持 promise，如下由 Kangax 提供的 ECMAScript 6 兼容性表：


    | 特性名称 | IE 10 | IE 11 | FF 24 | FF 25 | FF 27-28 | FF 29 | FF 30 | FF 31 | CH
    30 | CH 33 | CH 34 | CH 35 | SF 6 | SF 7 | WK | OP 12 | OP 15 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|

    | Promise | No | No | No | No | Yes | Yes | Yes | Yes | Yes | Yes | Yes | No |
    No | Yes | No | No |


    数据来源：http://kangax.github.io/compat-table/es6/#Promise


    > > 兼容性表中的缩写：

    > IE 代表 Internet Explorer，FF 代表 Firefox，CH 代表 Chrome，Safari 代表 Webkit，OP 代表 Opera。


    正如我们在上一个表中看到的，Firefox 的最后三个版本（截至版本 29）和 Chrome（截至版本 32）默认启用了 promise。不用担心，因为有一个
    polyfill（垫补程序）可以为不支持 promise 的浏览器添加 promise 功能。


    > > Polyfill 是由 Remy Sharp 创造的新术语，并在 Web 社区中流行起来。它代表一段代码，交付了我们期望浏览器原生提供的技术和行为。我们可以将其看作计算中的一个补丁。


    这个 polyfill 发挥了魔法并为我们提供了 promise 支持，可以从此链接下载：https://www.promisejs.org/polyfills/promise-4.0.0.js。它基本上为那些没有原生实现
    promise 的浏览器添加了 promise 支持。它也可以用于为 Node.js 提供 promise 支持。以下代码示例显示了如何包含它：


    ```html

    <script src="https://www.promisejs.org/polyfills/promise-4.0.0.js"></script>

    ```


    ## 第2章


    我们展示 ECMAScript 6 兼容性表是因为 promise 是 ECMAScript 6 规范的一部分，该规范将 promise 作为一种原生语言特性提供，且其实现基于
    Promises/A+ 提案。


    ## 具有类似 promise 功能的库


    promise 的概念对于 Web 开发和 JavaScript 世界来说并不新鲜。开发者可能通过库以非标准化的方式在 JavaScript 中遇到或使用过
    promise。这些库是 promise 概念的实现；其中一些是合规实现并已开始采用 promise 模式，而许多并不是。此外，这些库中的某些并不符合 Promises/A+
    标准，这在我们选择项目中使用何种 JavaScript 库时是一个非常重要的要求。


    ![](img/04c7981ae2601bc5401805f632a22d49_27_0.png)


    以下是一些完全符合 Promises/A+ 规范的库列表，因此我可以保留地推荐它们：


    - **Q.js**: 由 Kris Kowal 和 Domenic Denicola 开发，包含一个功能齐全的 promise 库，包含了 Node.js
    的适配器和对进度处理程序的支持。可以在 `https://github.com/kriskowal/q` 下载。

    - **RSVP.js**: 由 Yehuda Katz 开发，提供了一个非常轻量级的 promise 库。可以从 https://github.com/tildeio/rspv
    下载。

    - **when.js**: 由 Brian Cavalier 开发，它提供了中间件库并扩展了进度和取消的功能。可以从 https://github.com/cujojs/when
    下载。


    此外，我们还有 `then` (https://github.com/then)`，它是符合 Promises/A+ 规范的实现，并在 promise 成功或被拒绝时提供进度处理等功能。


    ## 总结


    正如我们所看到的，promise 的概念并不新鲜，在 JavaScript 中已经通过不同的库实现存在了很久，无论它们是符合标准的还是其他的。然而，现在，所有这些努力都汇聚成了
    Promises/A+ 社区规范，大多数库都遵循该规范。因此，我们通过在下一个 ECMAScript 版本中包含的标准 Promise 类在 JavaScript
    中获得了对 promise 的原生支持，允许 Web API 为其异步操作返回 promise。此外，我们深入探讨了 promise API 和 `then`
    方法，并了解了新标准的当前浏览器兼容性。最后，我们简要介绍了一些实现 promise 并符合 Promises/A+ 规范的库。


    在接下来的章节中，我们将重点介绍 promise 的链式调用（chaining）以及如何使用 `then` 方法来实现它以启用多个异步操作。

    '
