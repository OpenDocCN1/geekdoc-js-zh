    \ the content of the div element. Note that val holds the content of the value\
    \ returned by the promise from one operation to next in the chain.\n\nThis example\
    \ can also be tested on JSFiddle.net.\n\n## Chaining in sequence\n\nNot only can\
    \ we chain asynchronous operations with promises, but we can also chain them in\
