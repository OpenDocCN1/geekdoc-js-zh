    \ caller method to throw any error that is not handled inside the method. While,\
    \ then, those unhandled exceptions are wisely caught and traversed as part of\
    \ the promise state, then does not throw an exception but instead returns a promise\
    \ that is in the error state.\n\nKnowing the difference between these two methods\
    \ is critical to using.\nNevertheless, for both methods, it is recommended to\
    \ adopt flat promise chains in favor of nested, as the formatting of promise chains\
    \ makes them easier to read and easier to handle errors. For example, the following\
    \ sample code is preferable:\n\n```\nasyncFunc()\n  .then(function () { return\
    \ asyncFunc1(); })\n  .then(function () { return asyncFunc2(); })\n  .done(function\
    \ () { return theEnd(); });\n```\n\nAnd the following is labeled as one of don's:\n\
    \n```\n// not very neat!\nasyncFunc().then(function () {\n  asyncFunc1().then(function\
    \ () {\n    asyncFunc2().done(function () { theEnd(); });\n  })\n});\n```\n\n\
