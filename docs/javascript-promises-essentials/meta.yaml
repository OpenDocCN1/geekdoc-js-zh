    \ you\\'re out!';\n  return newVal2;\n}).then(function (val) {\n  log.insertAdjacentHTML('beforeend',\
    \ val + ' ( <small>Promise fulfilled</small><br/>');\n  return val;\n});\n```\n\
    \n在 HTML 中，我们只有一个空的 ID 为 `log` 的 `div` 元素。在 JavaScript 中，我们首先声明一个名为 `log` 的变量来持有该\
    \ `div` 元素。我们构建了一个新的 promise 并将其赋值给变量 `shout`。在该 promise 对象内部，我们添加了内容以强调我们刚刚开始了\
    \ promise。我们在这里承诺的是等待 2 秒（2000 毫秒）后的 `shoutText` 字符串。我们再次使用了 `window.setTimeout`\
    \ 函数来模拟一个需要时间完成的异步操作。它将在给定时间后通过解析来完成 promise。\n\n接下来，我们使用 `then` 方法调用 `shout`，我们已经定义了在\
    \ promise 完成时将执行的操作。在第一个方法中，我们简单地将 `val` 参数（包含 `shoutText` 的值）传递给 `log.insertAdjacentHTML`\
    \ 函数。这将在 `div` 元素的内容旁边显示 Promise，并用小字体显示 Promise fulfilled。接下来，我们定义了一个新变量 `newVal`，将其赋值为文本\
    \ \"Shout Again\" 并返回它。继续，第二个 `then` 也显示从上一次调用返回的值。我们也定义了一个新变量，为其赋值一个文本值并返回它。最后一个\
    \ `then` 只是将 `val` 的值（此时它等于 `newVal2`）并到 `div` 元素的内容中。注意，`val` 持有了链中上一个操作到下一个操作\
    \ promise 返回的值的内容。\n\n此示例也可以在 JSFiddle.net 上测试。\n\n## 顺序链式\n\n我们不仅可以用 promise\
    \ 链组合异步操作，还可以按这种方式组合，使其按顺序运行这些操作。正如我们在在本章之前学到的，如果一个 `then` 操作返回一个值，后续的 `then`\
    \ 将带有该值调用，除非第一个 `then` 返回一个 promise；如果发生这种情况，后续的 `then` 将等待返回的 promise，并且仅在 promise\
    \ 解决或拒绝时才被调用。这条规则允许我们以这种方式队列这些异步操作，使每个操作等待上一个操作完成，从而按顺序运行。让我们来看一个解释此点的例子。在这个例子中，我们有一个函数\
    \ `getData`，它接收一个 JSON 文件并从 JSON 文件中检索数据。第一个 JSON 文件有类别，对于每个类别，我们需要按顺序获取每个类别下的项目。让我们使用以下代码来实现此：\n\
    \n```javascript\ngetData(jsonCategoryUrl).then(function(data) {\n  // 获取类别 1 的项目\n\
    \  getItemsPerCategory(data.categories[0]).then(function(items) {\n    // 在处获取了项目\n\
    \  });\n  return getData(data.categories[0]); //返回类别 1\n}).then(function(category1)\
    \ {\n  alert(\"We now have category 1\", category1);\n  // 返回类别 2\n  return getData(data.categories[1]);\n\
    }).then(function(category2) {\n  alert(\"We now have category 2\", category2);\n\
    \  // 返回类别 3\n  return getData(data.categories[2]);\n});\n```\n\n之前的代码示例对 `jsonCategoryUrl`\
    \ 函数进行了异步调用，它将返回一组类别；在此之后，我们通过传递 `data.categories[0]` 参数来获取第一个类别中的项目，并将第一个类别传递给下一个\
    \ `then` 调用。在链式 promise 的第二个链接中，我们获取第二个类别数据 `data.categories[1]` 并将其传递给最后一个 `then`\
    \ 调用，反而又获取了第三个类别 `data.categories[2]`。这个例子向我们展示了如何在链式 promise 中队列异步操作，我们需要一个链，其中一个链接依赖或需要等待前一个\
    \ promise 的结果。\n\n## Promise 链式\n\n这种功能真正让 promise 与普通的回调模式脱颖而出。我们可以通过制作一个快捷方法来获取类别来优化之前的代码，如下代码所示：\n\
    \n```javascript\n// 声明 categorypromise 变量\nvar catPromise;\nfunction getCategory(i)\
    \ {\n  // 如果 catPromise 没有值则获取数据，否则直接从\n  // catPromise 的值填充\n  catPromise = catPromise\
    \ || getData(jsonCategoryUrl);\n  return catPromise.then(function(category) {\n\
    \    // 获取该类别下的项目\n    return getData(category.Items[i]);\n  });\n}\ngetCategory(0).then(function(items)\
    \ {\n  alert(items);\n  return getCategory(1);\n}).then(function(items) {\n  alert(items);\n\
    });\n```\n\n在之前的代码示例中，我们首先声明一个名为 `catPromise` 的变量来持有类别 promise。接下来，我们声明一个名为 `getCategory(i)`\
    \ 的函数，它接收 `i` 的值作为参数；并将 `catPromise` 设置为 `getData(jsonCategoryUrl)` 函数检索的 JSON\
    \ 数据；然而，使用 `||` 运算符我们可以首先检查 `catPromise` 对象是否有值，这样我们只获取一次类别 JSON 文件。当我们调用 `getCategory(0)`\
    \ 时，它将检索第一个类别；在此之后，它通过 `getCategory(1)` 返回类别并传递给最后一个 `then`。通过这种方式，在调用 `getCategory`\
    \ 之前我们不会下载类别 JSON 文件；尽管我们经常再次调用 `getCategory` 函数，但我们不需要下载，因为它在操作序列中被重用。通过 promise\
    \ 流水，第一个操作的结果被传递给后续操作。此外，此示例展示的重要特性是，`then` 函数返回一个新的 promise，`then` 返回的 promise\
    \ 在该函数返回的 promise 完成之前将不会完成，从而在链中队列了异步操作。\n\n## 总结\n\nPromise 是处理异步操作复杂性的极佳方法。Promise\
    \ 为 JavaScript 中异步操作的简单链式提供了一种极佳的机制。它们允许你比回调模式更好地管理这些操作的序列。\n\n在下一章中，我们将学习处理 promise\
    \ 中的错误，查看如何使用 promise 管理异常，并查看处理 promise 异步操作中出现错误的示例。\n\n"
