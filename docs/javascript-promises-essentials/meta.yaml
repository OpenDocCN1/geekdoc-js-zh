  md: '# JavaScript Promises – Why Should I Care?


    There was never a time before when JavaScript had been this popular. What was
    once and maybe still is for some, the most misunderstood programming language
    mainly because of its name, now ranks among the top popular programming languages
    available. Furthermore, nearly every personal computer out there might have at
    least one JavaScript interpreter in use or at least installed. The growing popularity
    of JavaScript is entirely due to its role as the scripting language of the Web.
    Its success there JavaScript designed to run in Netscape Navigator led to it becoming
    the standard equipment in virtually all the web browsers, but JavaScript has grown
