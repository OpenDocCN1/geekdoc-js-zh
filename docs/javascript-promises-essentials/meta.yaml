  - "[PAGE 35]\n\n# Chaining in sequence\n\nNot only can we chain asynchronous operations\
    \ with promises, but we can also chain them in such a way that they run these\
    \ operations in a sequence. As we learned earlier in this chapter, if a then operation\
    \ returns a value, the subsequent then is called with that unless the first then\
    \ returns a promise; if this happens, the subsequent then will wait on the promise\
    \ that is returned and will only be called when promise gets fulfilled or rejected.\
    \ This rule allows us to queue these asynchronous operations in such a way that\
    \ each operation wait for the previous to finish and thus run in sequence. Let\
    \ us look at an example that explains it. In this example, we have a function\
    \ getData that takes a JSON file and retrieves data from JSON file. the first\
    \ JSON file has categories, and for each category, we need to get the items under\
    \ each category in a sequence. Let's use the following code to do this:\n\n```\n\
    getData(jsonCategoryUrl).then(function(data) {\n// get the items per category\
    \ 1\ngetItemsPerCategory(data.categories[0]).then(function(items) {\n  // items\
    \ are retrieved here\n});\nreturn getData(data.categories[0]); //return category\
    \ 1\n}).then(function(category1) {\nalert(\"We now have category 1\", category1);\n\
    // return category 2\nreturn getData(data.categories[1]);\n}).then(function(category2)\
    \ {\nalert(\"We now have category 2\", category2);\n// return category 3\nreturn\
    \ getData(data.categories[2]);\n});\n```\n\nThe previous code sample makes an\
    \ asynchronous call to the jsonCategoryUrl function, which will return a set of\
    \ categories; after this, we retrieve the items in the first of those categories\
    \ by passing the data.categories[0] parameter and passing on the first category\
    \ to the next then call. The second link of chained promises, we retrieve the\
    \ second category data.categories[1] and pass it to the last then call, which\
    \ in turn retrieves the third category, data.categories[2]. This example shows\
    \ us how we can queue asynchronous operations in chained promises we need to have\
    \ a chain in which one link depends or needs to wait on the result of the preceding\
    \ promise."
