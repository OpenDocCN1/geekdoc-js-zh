  md: "# Putting the promise into action\n\nWe can take this basic implementation\
    \ of promise that we just authored and use it in our code to handle our asynchronous\
    \ operations. Let us have a look at an example of how to use this PromiseMe library.\
    \ The following code can be added after this code for the PromiseMe object:\n\n\
    ```\nvar multiplyAsync = function (val) {\n  var promise = new PromiseMe();\n\
    \  promise.fulfillPromise(val * 2);\n\n  return promise;\n};\n\nmultiplyAsync(2)\n\
    \  .then(function (value) {\n    alert(value);\n  });\n```\n\nWhat we are doing\
    \ in the previous code is simply creating a function to a variable named multiplyAsync,\
    \ which in turn instantiates PromiseMe and then it calls the fulfillPromise method\
    \ on the promise variable created, which is an instance of the PromiseMe object.\
    \ The fulfillPromise method does is simply the val argument by the number 2. Following\
    \ that, we call multiplyAsync and pass it the number 2 as a value for its parameter;\
    \ since it returns a promise, we can call the then method on it. The then method\
    \ has a single handler, which handles the success and simply pops up an alert\
    \ with the value that should now be 4.\n\nRun the script in an HTML page, and\
    \ we should have an alert displaying the number 4.\n\n> You can find the complete\
    \ code and test it at jsFiddle http://jsfiddle.net/Ramasieradienne/g8oj4guo/\n\
    Make sure the browser supports promises.\n\nLet us add some error handling to\
    \ this code. First, for the sake of simplicity and readability, I will create\
    \ a function named alertResult to replace alert(value).\n\nHence, we will have\
    \ a function as the following:\n\n```\nvar alertResult = function (value) {\n\
    \  alert(value);\n};\n```"
  merge: -1
  pgno: 69
- img_proc: true
  md: "# Putting It Together - Promises in Action\n\nWe will add another function\
    \ called onError, which basically displays an alert with the error message passed\
    \ to it. The function will have the following syntax:\n\n```\nvar onError = function(errorMsg)\
    \ {\n  alert(errorMsg);\n};\n```\n\nNow, let us add a function that will include\
    \ error handling by detecting an anomaly and rejecting the promise. The following\
    \ code shows this:\n\n```\nvar divideAsync = function (val) {\n  var promise2\
    \ = new Promise();\n    if (val == 0) {\n      promise2.reject(\"cannot divide\
    \ by zero\");\n    }else{\n      promise2.fulfillPromise(1 / val);\n    }\n  return\
    \ promise2;\n}\n```\n\nWhat the previous function does is simply check for the\
    \ value; if it is zero, the function rejects the promise; otherwise, it fulfills\
    \ the promise by dividing the number 1 by val. To test this, we will pass the\
    \ value 0 to multiplyAsync, invoke divideAsync in its then, and by calling an\
    \ error function on the then method of divideAsync. The code will look like:\n\
    \n```\nmultiplyAsync(0)\n  .then(divideAsync)\n  .then(undefined, onError);\n\
    ```\n\nThe end result will be an error message that displays the text cannot divide\
    \ by zero. That because zero passed to divideAsync, which in turn rejected the\
    \ promise, and an error message was passed to the onError handler.\n\n![](img/04c7981ae2601bc5401805f632a22d49_70_0.png)\n\
    \nYou can find the updated code with this error handler scenario on the following\
    \ jsFiddle URL: https://jsfiddle.net/RamiSariennie/g8oj4guo/15/\n\nTo wrap it\
    \ up, promises offer a very good solution to address the complexities of asynchronous\
    \ operations. The abstraction that promises allows us to do several things more\
    \ easily, especially common asynchronous patterns using callbacks, with the support\
    \ of the following properties:\n\n+   - A single promise can be attached to and\
    \ cater to more than one callback\n- Values and errors get passed along in the\
    \ promise"
  merge: -1
  pgno: 70
