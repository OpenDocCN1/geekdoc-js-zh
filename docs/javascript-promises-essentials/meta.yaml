  md: '# Chapter 2


    +   - Both handlers onFulfilled and onRejected that must be called asynchronously.


    +   - Both handlers onFulfilled and onRejected that must be called functions.


    +   Implementations are built by the exact ordering of calls to the handlers onFulfilled
    and onRejected in case of consequent calls to the then method on the same promise.
    In a more spoken language, this means that, if the then method is called more
    than once on the same promise as promise. .then().then(), all the onFulfilled
    handlers used in these then calls must execute in the order of the originating
    calls to then. Hence, the onFulfilled callback in the first then function will
    execute first, followed by the onFulfilled callback in the second then, and so
    on. The thing applies to the execution of the onRejected callbacks in such a scenario.
    Was it very complex? Maybe the following example can explain it:


    ```

    var p = [[promise]];

    p.then();

    p.then();

    ```


    The preceding code is not the same as the following line of code:

    promise.then().then();


    The difference is that promise.then() might return a different promise.


    Lastly, the level of classifications, the Promises/A+ proposal offers different
    naming from Promises/A, because the authors of the new specifications wanted to
    reflect the vocabulary that has spread across many promise implementations. The
    changes include the following:


    +   - The promise states are referred to as pending, fulfilled, and rejected,
    replacing unfilled, fulfilled, and failed


    +   - When a promise is fulfilled, the promise has a value; similarly, when a
    promise is rejected, it has a reason


    The then method is the main player in the API. An object is not considered a promise
    if it does not have the then method to retrieve and access its current or eventual
    value or reason, as we saw in the previous chapter. This method takes two arguments
    that need to be a function, as in the following example shows:


    ```

    promise.then(onFulfilled, onRejected);

    ```


    Let''s dive deep into the details of then and the specs of its arguments, taking
    into consideration the previous code sample of a simple then method:


    +   - Both the arguments, onFulfilled and onRejected, are optional.


    +   - Both the arguments must be a function; otherwise, it must be ignored.'
