  md: "# Putting It All Together – Promises in Action\n\nLet us go through a code\
    \ example for a basic implementation of promises; this will give us a better understanding\
    \ of how promises work. A deep understanding of how things work improves our ability\
    \ to take advantage of code and debug it more easily and quickly when it goes\
    \ wrong. We will create a minimal JavaScript library that implements promises,\
    \ and will start coding that library with the states of the promises. We learned,\
    \ when exploring the Promise API in Chapter 2, The Promise API and Its Compatibility,\
    \ promises have three different states: pending, fulfilled, and rejected.\n\n\
    The specification of promises does not specify a value for there states, so let\
    \ declare and assign the value to an enumerator, as the following code shows:\n\
    \n```\nvar promState = {\n  pending: 1,\n  fulfilled: 2,\n  rejected: 3\n}\n```\n\
    \nThis enumeration will allow us to call the state by name, for example, promState.fulfilled.\
    \ Next, we will create an object that holds all the promise logic from transition\
    \ between states to the then method and resolves the promise. We will call this\
    \ object PromiseMe.\n\nFirst, we will need to define the change in the promise's\
    \ states and its transition from one to the other. The specification dictates\
    \ some rules and considerations for the transitions between the states, which\
    \ we have dive into detail in Chapter 2, The Promise API and Its Compatibility.\
    \ These rules can be summarized as follows:\n\n+   - A promise can only be in\
    \ one state at a certain point of time\n- When a promise transitions from pending\
    \ to any other state, either fulfilled or rejected, it cannot go back\n- When\
    \ a promise fulfills, it must have a value (it can even be undefined) and, when\
    \ it fails, it must have a reason (any value that specifies the promise was rejected)\n\
    \nInside the PromiseMe object, we will first define a function titled changeMyState\
    \ that handles and manages the transition between states for this promise governed\
    \ by the preceding code shows:\n\n```\nvar PromiseMe = {\n  //set default state\n\
    \  myState: promState.pending,\n```"
