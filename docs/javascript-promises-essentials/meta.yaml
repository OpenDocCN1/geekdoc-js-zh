    \ must be the exception that is thrown back in that case.\n"
  mdcn: "\n\n## 我不能直接用回调函数吗？\n\n回调函数非常简单！我们传递一个函数，它会在未来的某个点被调用，然后我们就可以执行异步操作。此外，回调函数是轻量级的，因为我们不需要添加额外的库。将函数作为高阶对象已经是\
    \ JavaScript 编程语言内置的特性；因此，我们不需要额外的代码即可使用它。\n\n然而，如果不加小心，JavaScript 中的异步编程可能会迅速变得复杂，回调函数尤其如此。当回调函数嵌套在长行代码中时，往往变得难以维护和调试。此外，在回调中使用匿名内联函数会使得阅读调用栈变得非常枯燥。而且，在调试时，从深层嵌套的回调中抛出的异常可能无法正确传播到调用链中启动回调的函数，这使得很难确定错误发生的确切位置。此外，构建基于回调的代码结构是非常困难的，因为它们会像雪球一样滚出杂乱的代码。我们最终会在更大的规模上得到类似下面代码示例的内容：\n\
    \n```javascript\nfunction readJSON(filename, callback) {\n  fs.readFile(filename,\
    \ function (err, result) {\n    if (err) return callback(err);\n    try {\n  \
    \    result = JSON.parse(result, function (err, result) {\n        fun.readAsync(result,\
    \ function (err, result) {\n          alert(\"I'm inside this loop now\");\n \
    \       });\n        alert(\"I'm here now\");\n      });\n    } catch (ex) {\n\
    \      return callback(ex);\n    }\n    callback(null, result);\n  });\n}\n```\n\
    \n上一个示例中的代码是深层嵌套代码片段，有时被称为“地狱之渊”。这种代码在增长时，会让阅读、结构化、维护和调试成为一项艰巨的任务。\n\n![](img/04c7981ae2601bc5401805f632a22d49_16_0.png)\n\
    \n## JavaScript Promises – 我为什么需要关注它？\n\n相反，Promises 提供了一种用于管理与异步 API 交互的抽象，与使用回调和事件处理器相比，它为\
    \ JavaScript 中的异步编程提供了一种更具管理力的方法。我们可以将 Promise 看作一种异步编程的模式。\n\n简单来说，Promise 模式将允许异步编程从广泛使用的“延续传递风格”（continuation-passing\
    \ style）转变为返回值的风格，这个值被称为 Promise，它将代表该特定操作的最终结果。\n\n它允许你将代码：\n\n```javascript\n\
    call1(function (value1) {\n  call2(value1, function(value2) {\n    call3(value2,\
    \ function(value3) {\n      call4(value3, function(value4) {\n        // 执行一些代码\n\
    \      });\n    });\n  });\n});\n```\n\n变为：\n\n```javascript\nPromise.asyncCall(promisedStep1)\n\
    .then(promisedStep2)\n.then(promisedStep3)\n.then(promisedStep4)\n.then(function\
    \ (value4) {\n  // 执行一些代码\n});\n```\n\n如果我们列出让 Promise 更易于使用的属性，它们如下：\n\n- 使用更整洁的方法签名，因此更易阅读\n\
    - 它允许我们在单个 Promise 上附加多个回调函数\n- 它允许将值和错误沿链传递并冒泡到调用者函数\n- 它允许 Promise 的链式调用\n\n\
    我们可以观察到，Promise 通过返回值为同步能力带来了函数式组合，并通过向异步函数抛出异常带来了错误冒泡。这些都是我们在同步世界中认为理所当然的能力。\n\
    \n下面的示例（虚拟）代码展示了使用回调来组合相互通信的异步函数与使用 Promise 实现相同目的之间的区别。\n\n以下是回调的示例：\n\n```javascript\n\
    $(\"#testInput\").click(function () {\n  firstCallback(function (param) {\n  \
    \  getValues(param, function (result) {\n      alert(result);\n    });\n  });\n\
    });\n```\n\n以下是将上述回调函数转换为返回 Promise 的函数的代码示例，这些函数可以相互链式：\n\n```javascript\n$(\"\
    #testInput\").clickPromise() // 返回 promise 的函数\n  .then(firstCallback)\n  .then(getValues)\n\
    \  .then(alert);\n```\n\n正如我们所看到的，与传统的回调方法相比，Promise 允许的扁平化链式代码更更容易阅读，最终也更容易维护。\n\
    \n## 总结\n\nJavaScript 中的回调函数允许我们通过异步处理事件（即用户输入）来获得响应迅速的用户界面，而不会阻塞应用程序的其他部分。Promise\
    \ 是一种允许异步编程标准化的模式，使开发者能够编写出更具读性和可维护性的异步代码。\n\n在下一章中，我们将查看支持 Promise 的浏览器及其与 jQuery\
    \ 的兼容性。你还将学习支持类似 Promise 功能的库。\n\n## 2: Promise API 及其兼容性\n\nPromise 对于 JavaScript\
    \ 世界来说还很新，但变通方法已经存在一段时间了。正如我们在上一章中看到的，处理 JavaScript 异步编程的方法，无论是通过事件还是回调。你还学习了为什么\
    \ Promise 与实现此目的传统技术有所不同。\n\n接下来，我们将深入介绍 Promise API 的细节。你还将学习当前浏览器对 Promise 标准的支持，并查看实现\
    \ Promise 及类 Promise 功能的 JavaScript 库。在本章中，我们将涵盖以下主题：\n\n- Promise API 及其细节\n\
    - 浏览器兼容性\n- Promise 实现\n- 具有类 Promise 功能的库\n\n## Promise API 及其兼容性\n\n### 了解 API\n\
    \n在本书中，我们将处理和使用根据 [Promises/A+](https://promises.com/) 定义的。Promises/A+ 组织产生 Promises/A+\
    \ 规范旨在将最初的 Promises/A 规范扩展为更清晰、更充分的版本。该提案引用自其网站：\n\n> Promises/A+ 是基于 CommonJS\
    \ Promises/A 提案中的概念和 API 的。\n\n> - [differences from promises/a](https://promises.com/differences-from-promises-a)\n\
    \n这些差异存在三个层面：缺失、新增和澄清。在缺失层面，Promises/A+ 从原始规范中删除了以下功能：\n\n- 进度处理：该功能包括一个在操作进行中（未成功也未拒绝）的回调函数。它的删除是因为实现者得出，在实践中这些功能被证明规范不足，目前\
    \ Promise 社区对其行为尚未达成共识。\n- 交互式 promise：这是之前 Promises/A 提案中的扩展功能，基本上为 promise 支持两个额外函数；`get(propertyName)`\
    \ 从此 promise 的目标请求属性，`call(functionName, arg1, arg2, ...)` 在 promise 的目标上调用给的方法/函数。在新的\
    \ A+ 规范中，该功能以及 call 和 get 函数被认为在实现互操作 promise 所需的基础 API 范围内。\n- promise== resultPromise：这是旧提案中的一个要求，规定\
    \ promise 的结果不应等于 promise 本身，例如 `var resultPromise = promise.then(onFulfilled,\
    \ onRejected);` 事实上，只要实现满足所有要求，任何实现都允许 `resultPromise === promise`。\n\n在新增层面，Promises/A+\
    \ 规范对现有 Promises/A 提案增加了以下功能和要求：\n\n在 `onFulfilled` 或 `onRejected` 返回 then 的行为规范，包括解析过程的细节。\n\
    - 传递给 `onRejected` 处理器的原因，它必须是该情况下抛出的异常。\n\n"
