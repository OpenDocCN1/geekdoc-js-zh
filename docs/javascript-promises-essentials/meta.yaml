  md: 'Bear in mind that the promises in WinJS are compliant with the promises defined
    in the CommonJS Promises / A proposal, and till the time of this writing, WinJS
    promises have not been tested against the new Promises/A+ specifications. This
    has no effect on Windows app development, as the apps are running in a store.
    In the browser, the main difference that can arise between WinJS promises and
    A+-compliant promises is that WinJS does not guarantee the callback function of
    the promise will be asynchronous. For example, if we call promise.then(a) with
    a being the callback function we won''t be certain whether a will be called in
    an asynchronous or synchronous manner. While in Promises/A+ specifications, the
    callback function will always be called asynchronously. It is a must. The specifications
    explain that not ensuring an asynchronous callback will make promises much harder
    to reason about and debug. Nevertheless, as I mentioned earlier in the chapter
    that WinJS itself is open source and hosted on GitHub, the community members,
    and anyone interested for that matter, can download WinJS, build, and test it
    against the Promises/A+ Compliance Suite.


    Next up, let have a look at how to use these WinJS promises in Windows apps development.


    # Using WinJS promises


    We leverage promises on the Web to make the UI more responsive and avoid blocking
    the UI thread by executing the work asynchronously. Likewise, we use WinJS promises
    to handle the work asynchronously and thus keep the UI thread of the Windows app
    available to respond to user input. We also allow the app layout and static items
    to load properly and while fetching what needs to be fetched from servers and
    databases asynchronously in the background. For that purpose, the asynchronous
    APIs in WinJS and Windows Runtime are exposed in JavaScript as promises.


    Let us have a look at a basic example of promises. In order to follow and replicate
    the following example, we will need Visual Studio (the Express Version would do).
    We need to start by creating a basic app of the type JavaScript. In order to do
    so, from the Visual Studio top menu, we need to go to File | New Project, which
    will pop up a small window containing the project type. There, we need to go to
    JavaScript | Store Apps | Windows Apps, which will list us for the different JavaScript
    Windows App templates available. For this example, we can select Blank App, which
    is a project for a single-page Windows App that has no predefined controls or
    layout. Name the app as you please, and click on Ok. The following screenshot
    illustrates the steps:'
