- md: "\n# JavaScript Promises Essentials\n\nBuild fully functional web applications\
    \ using promises, the new standard in JavaScript\n\nRami Sarieddine\n\n![](img/04c7981ae2601bc5401805f632a22d49_0_0.png)\n\
    \n# JavaScript Promises Essentials\n\nCopyright © 2014 Packt Publishing\n\nFirst\
    \ published: September 2014\n\nProduction reference: 1190914\n\nPublished by Packt\
    \ Publishing Ltd.\nLivery Place\n35 Livery Street\nBirmingham B3 2PB, UK.\nISBN\
    \ 978-1-78398-564-7\n\nwww.packtpub.com\n\n# Contents\n\n- Preface 1\n- Chapter\
    \ 1: JavaScript Promises – Why Should I Care? 5\n- Asynchronous programming in\
    \ JavaScript 6\n- Why should I care about promises? 11\n- Can't I just use a callback?\
    \ 15\n- Summary\n- Chapter 2: The Promise API and Its Compatibility 17\n- Getting\
    \ to know the API 18\n- Browser support and compatibility 23\n- Checking the browser\
    \ compatibility 24\n- Libraries with promise-like features 25\n- Summary 26\n\
    - Chapter 3: Chaining of Promises 27\n- Chaining like never before 27\n- Chaining\
    \ in sequence 33\n- Summary 35\n- Chapter 4: Error Handling 37\n- Exceptions and\
    \ promises 37\n- Handling errors with promises 40\n- Summary 43\n- Chapter 5:\
    \ Promises in WinJS 45\n- Introducing WinJS 45\n- Explaining the WinJS.Promise\
    \ object 47\n- Constructors 47\n- Events 48\n- Methods 49\n- Using WinJS promises\
    \ 52\n- Summary 56\n- Chapter 6: Putting It All Together – Promises in Action\
    \ 57\n- Implementing a promise library 57\n- Implementing the then method 60\n\
    - Defining a resolve method 61\n- Implementing the doResolve function 63\n- Wrapping\
    \ the code 65\n- Putting the promise into action 69\n- Summary 71\n- Index 73\n\
    \n# Preface\n\nJavaScript Promises Essentials is a practical guide to the new\
    \ concept of promises. It presents a single resource replacing all the scattered\
    \ information out there about the topic. It covers in detail the new standard\
    \ that will enhance the way we do asynchronous programming in JavaScript. The\
    \ book is a brief, concise explanation of the Promises API and its features and\
    \ how it can be used in JavaScript programming. It covers the essentials of JavaScript\
    \ promises, touching on the details that matter the most in your new learning\
    \ with some very useful tips on the different aspects of the topic.\n\nPromises\
    \ are for the most part a programming concept and provide a process that allows\
    \ developers to arrange work to be executed on data and values that do not exist\
    \ and allow them to deal with those values at an undetermined point in the future\
    \ (asynchronously). It also presents an abstraction to handle the communication\
    \ with asynchronous APIs. Currently, there are ways to achieve asynchronous calling\
    \ in JavaScript through callback, timers, and events, but all come with caveats.\
    \ Promises solve real development headaches and allow developers to handle JavaScript's\
    \ asynchronous operations in a more native manner compared to the traditional\
    \ approaches. Furthermore, promises present a straightforward correspondence between\
    \ synchronous functionality and asynchronous functions, especially at level of\
    \ error handling. Several libraries have started using promises and now offer\
    \ a robust implementation of promises. You can find promises on the Web in many\
    \ libraries and also by interacting with Node.js and WinRT. Learning the details\
    \ of promise implementations will help you avoid the many problems that arise\
    \ in the world of asynchronous JavaScript and construct better JavaScript APIs.\n\
    \n# What this book covers\n\nChapter 1, JavaScript Promises – Why Should I Care?,\
    \ presents an introduction to the world of asynchronous programming in JavaScript\
    \ and the importance of promises in that world.\n\nChapter 2, The Promise API\
    \ and Its Compatibility, takes you through more details of the Promises API. We\
    \ will also learn about current browser support for the promises standard and\
    \ have a look at the JavaScript libraries out there that implement promises and\
    \ promise-like features.\n\nChapter 3, Chaining of Promises, shows you how promises\
    \ allow chaining of asynchronous operations and what that enables. Chapter also\
    \ covers how to queue asynchronous operations.\n\nChapter 4, Error Handling, covers\
    \ exceptions and error handling in JavaScript. This chapter will also explain\
    \ how promises make error handling easier and better.\n\nChapter 5, Promises in\
    \ WinJS, explores all about the WinJS.Promise object and how it is used in Windows\
    \ Apps development.\n\nChapter 6, Putting It All Together – Promises in Action,\
    \ shows you the promises in action and how and where we can use promises in scenarios\
    \ that put together everything we have learned so far.\n\n# What you need for\
    \ this book\n\nIn order to implement what you will be learning in this book, you\
    \ just need an HTML and JavaScript editor. You can choose from the following:\n\
    \n- Microsoft Visual Studio Express 2013 for Web: This provides a full-featured\
    \ markup and code editors.\n- WebMatrix: This is another option to run the sample\
    \ code. It is a free, lightweight, cloud-connected web development tool that leverages\
    \ the latest stands and popular JavaScript libraries.\n- jsF: This is an online\
    \ web editor that allows you to write HTML and JavaScript code and run it directly\
    \ in the browser.\n\n# Who this book is for\n\nThis book is for all developers\
    \ who are involved in JavaScript programming, be it in web development or with\
    \ technologies, such as Node.js and WinRT, which make heavy use of asynchronous\
    \ APIs. Moreover, it is developers who are interested in learning about asynchronous\
    \ programming in JavaScript and the new standard that will make your experience\
    \ much better. In short, this book is for everyone. \n\n# Conventions\n\nIn this\
    \ book, you will find a number of styles that distinguish different kinds of information.\
    \ Here are some examples of these styles, and an explanation of their meaning.\n\
    \nCode in text, database names, folder names, filenames, file extensions, pathnames,\
    \ dummy URLs, user input are shown as follows: \"We can achieve this using `addEventListener()`.\"\
    \n\nA block of code is set as:\n\n```javascript\nvar testDiv = document.getElementById(\"\
    testDiv\");\ntestDiv.addEventListener(\"click\", function() {\n  // so testDiv\
    \ has been clicked, now we can\n  alert(\"I'm here!\");\n});\n```\n\n**New and\
    \ important words are shown in bold.** Words that you see on the screen, in menus\
    \ or dialog boxes, appear in the text like: \"Name the app as you please, and\
    \ click on Ok.\"\n\n![](img/04c7981ae2601bc5401805f632a22d49_6_0.png)\n\n![](img/04c7981ae2601bc5401805f632a22d49_6_1.png)\n\
    \n# Reader feedback\n\nFeedback from our readers is always welcome. Let us know\
    \ what you think about this book — what you liked or may have disliked. Reader\
    \ feedback is important for us to develop titles that you really get out of.\n\
    \nTo send general feedback, simply send an e-mail to feedback@packpub.com, and\
    \ mention the book title via the subject of your message.\n\nIf there is a topic\
    \ that you have expertise in and you are interested in writing or contributing\
    \ to a book, see our author guide on www.packpub.com.\n\n# Customer support\n\n\
    Now that you are the proud owner of a Packt book, we have a number of things to\
    \ help you to get the most from your purchase.\n\n# Errata\n\nAlthough we have\
    \ taken every care to ensure the accuracy of our content, mistakes do happen.\
    \ If you find a mistake in one of our books—maybe a mistake in the text or the\
    \ code—we would be grateful if you would report this to us. By doing so, you can\
    \ save other readers from frustration and help us improve subsequent versions\
    \ of this book. If you find any errata, please report them by visiting http://www.packpub.com/submit-errata,\
    \ selecting your book, clicking on the errata submission form link, and entering\
    \ the details of your errata. Once your errata are verified, your submission will\
    \ be accepted and the errata will be uploaded on our website, or added to any\
    \ list of existing errata, under the Errata section of that title. Any existing\
    \ errata can be viewed by selecting your title from http://www.packpub.com/support.\n"
  mdcn: "\n\n# JavaScript Promises 核心\n\n使用 promises 这一 JavaScript 新标准构建功能完整的 Web\
    \ 应用\n\nRami Sarieddine\n\n![](img/04c7981ae2601bc5401805f632a22d49_0_0.png)\n\
    \n# JavaScript Promises 核心\n\nCopyright © 2014 Packt Publishing\n\n首次出版：2014年9月\n\
    \n制作参考号：1190914\n\nPackt Publishing Ltd 出版\nLivery Place\n35 Livery Street\nBirmingham\
    \ B3 2PB, UK.\nISBN 978-1-78398-564-7\n\nwww.packtpub.com\n\n# 目录\n\n- 序言 1\n\
    - 第 1 章：JavaScript Promises – 我为什么需要关注它？ 5\n- JavaScript 中的异步编程 6\n- 为什么我应该关注\
    \ promises？ 11\n- 我不能直接用回调函数吗？ 15\n- 本章总结\n- 第 2 章：Promise API 及其兼容性 17\n- 了解\
    \ API 18\n- 浏览器支持与兼容性 23\n- 检查浏览器兼容性 24\n- 具有类 promise 特性的库 25\n- 本章总结 26\n- 第\
    \ 3 章：Promises 链式 27\n- 前所未有的链式 27\n- 顺序链式 33\n- 本章总结 35\n- 第 4 章：错误处理 37\n- 异常与\
    \ promises 37\n- 使用 promises 处理错误 40\n- 本章总结 43\n- 第 5 章：WinJS 中的 Promises 45\n\
    - 介绍 WinJS 45\n- 解释 WinJS.Promise 对象 47\n- 构造函数 47\n- 事件 48\n- 方法 49\n- 使用 WinJS\
    \ promises 52\n- 本章总结 56\n- 第 6 章：整合所有内容 – Promises 实战 57\n- 实现一个 promise 库 57\n\
    - 实现 then 方法 60\n- 定义 resolve 方法 61\n- 实现 doResolve 函数 63\n- 封装代码 65\n- 让 promise\
    \ 运转 69\n- 本章总结 71\n- 索引 73\n\n# 序言\n\n《JavaScript Promises Essentials》是一本关于 promises\
    \ 新概念的实用指南。它提供了一个单一资源，取代了目前关于该主题的所有零散信息。它详细介绍了这一将增强我们在 JavaScript 中进行异步编程方式的新标准。本书对\
    \ Promises API 及其特性以及如何在 JavaScript 编程中使用它进行了简明的解释。它涵盖了 JavaScript promises 的核心内容，触及了你在新学习过程中最重要的细节，并针对该主题的不同方面提供了一些非常有用的提示。\n\
    \nPromises 在很大程度上是一个编程概念，它提供了一种流程，允许开发者安排对尚不存在的数据和值进行执行的工作，并允许他们在未来的某个不确定点（异步地）处理这些值。它还提供了一种处理与异步\
    \ API 通信的抽象。目前，JavaScript 中可以通过回调、定时器和事件来实现异步调用，但它们都有局限性。Promises 解决了实际开发中的头疼问题，与传统方法相比，允许开发者以更原生的方式处理\
    \ JavaScript 的异步操作。此外，promises 在同步功能和异步函数之间提供了直接的对应关系，特别是在错误处理方面。已经有一些库开始使用 promises\
    \ 并现在提供了健壮的 promises 实现。你可以在 Web 的许多库中找到 promises，也可以通过与 Node.js 和 WinRT 交互找到。学习\
    \ promise 实现的细节将帮助你避免异步 JavaScript 世界中出现的许多问题，并构建出更好的 JavaScript API。\n\n# 本书涵盖的内容\n\
    \n第 1 章“JavaScript Promises – 我为什么需要关注它？”，介绍了 JavaScript 异步编程的世界以及 promises 在该世界中的重要性。\n\
    \n第 2 章“Promise API 及其兼容性”将带你了解 Promises API 的更多细节。我们还将学习当前浏览器对 promises 标准的支持情况，并查看市场上实现\
    \ promises 和类 promise 特性的 JavaScript 库。\n\n第 3 章“Promises 链式”向你展示 promises 如何允许异步操作的链式调用以及这实现了什么。本章还涵盖了如何队列异步操作。\n\
    \n第 4 章“错误处理”涵盖了 JavaScript 中的异常和错误处理。本章还将解释 promises 如何让错误处理变得更简单更好。\n\n第 5 章“WinJS\
    \ 中的 Promises”探索了 WinJS.Promise 对象的所有内容以及它如何在 Windows 应用开发中使用。\n\n第 6 章“整合所有内容\
    \ – Promises 实战”向你展示 promises 的实战，以及在整合目前所学内容的场景中如何以及在何时使用 promises。\n\n# 本书需要的工具\n\
    \n为了实现你将在书中学习的内容，你只需要一个 HTML 和 JavaScript 编辑器。你可以从以下选项中选择：\n\n- Microsoft Visual\
    \ Studio Express 2013 for Web：它提供了功能全标记和代码编辑器。\n- WebMatrix：这是运行示例代码的另一种选择。这是一个免费、轻量、云连接的网络开发工具，利用了最新的标准和流行的\
    \ JavaScript 库。\n- jsF：这是一个在线 Web 编辑器，允许你编写 HTML 和 JavaScript 代码并直接在浏览器中运行。\n\n\
    # 本书的读者\n\n本书适用于所有参与 JavaScript 编程的开发者，无论是在 Web 开发中，还是在使用大量异步 API 的 Node.js 和\
    \ WinRT 技术。此外，它也适用于对 JavaScript 异步编程以及能提升体验的新标准感兴趣的开发者。简而言之，本书适合所有人。\n\n# 约定\n\
    \n在书中，你将发现许多区分不同类型信息的样式。以下是这些样式的示例及其含义。\n\n文本中的代码、数据库名、文件名、扩展名、路径名、虚拟 URL、用户输入显示如下：“我们可以通过\
    \ `addEventListener()` 实现。”\n\n代码块显示为：\n\n```javascript\nvar testDiv = document.getElementById(\"\
    testDiv\");\ntestDiv.addEventListener(\"click\", function() {\n  // 所以 testDiv\
    \ 被点击了，现在\n  alert(\"I'm here!\");\n});\n```\n\n**新词和重要单词加粗显示。**屏幕上、菜单或对话框中的词汇显示为：“请命名应用程序，并点击确定。”\n\
    \n![](img/04c7981ae2601bc5401805f632a22d49_6_0.png)\n\n![](img/04c7981ae2601bc5401805f632a22d49_6_1.png)\n\
    \n# 读者反馈\n\n我们欢迎读者的反馈。让我们对这本书的看法——你喜欢或可能不喜欢的地方。读者反馈对于我们开发真正受益的书至关重要。\n\n发送通用反馈，只需发送邮件到\
    \ feedback@packpub.com，并在邮件主题中注明书名。\n\n如果你在某个领域拥有专长并兴趣编写或贡献书籍，请参阅我们 www.packpub.com\
    \ 上的作者指南。\n\n# 客户支持\n\n现在你是 Packt 书籍的主人，我们有很多方法帮助你从购买中获得最大收益。\n\n# 勘误\n\n尽管我们努力确保内容的准确性，但错误仍然会发生。如果你在我们的书籍中发现错误——可能是文本或代码中的错误——我们将非常感谢你告诉我们。这样做可以避免其他读者感到沮扰，并帮助我们改进书中后续的版本。如果你发现任何勘误，请访问\
    \ http://www.packpub.com/submit-errata 进行报告，选择你的书籍，点击勘误提交表链接并输入勘误详情。一旦你的勘误通过验证，提交将被接受，勘误将上传到我们的网站，或添加到该标题下\
    \ Errata 部分的现有勘误列表中。你可以通过 http://www.packpub.com/support 查看任何现有勘误。\n\n"
