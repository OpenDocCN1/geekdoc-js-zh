    # Chapter 3


    In the previous example, you will notice the widespread presence of function and
    }}; in what looks like a pyramid of code, bearing in mind that we didn''t even
    include error-handling code. The previous example depicts, on a small scale, what
    callback hell looks like. We can also observe how nested callbacks—which are quite
    flourishing in JavaScript programming—can grow uncontrollably into an intertwined
    and hard-to-maintain code. So imagine how the code would look in a more complex
    scenario.


    Nevertheless, there are remedies that developers can implement to have nested
    callbacks that are more readable and maintainable. These remedies include the
    use of named functions instead of anonymous functions in the callback parameters.
    Another solution would be to break down the code into smaller chunks by placing
    the code that does a specific task to a separate module and then plug that module
    into the application code somewhere else. However, these remedies are more of
    a workaround and not a standard practice; also, the workarounds are still not
    enough to address the concept of chaining asynchronous operations entirely.


    Promises, on the other hand, deliver the functional composition that we have in
    synchronous programming or more of an out-of-the-box way when compared with asynchronous
    programming in JavaScript.


    Why so? Because the specification states that a promise is required to provide
    a then method. Not just that; the specification also necessitates that the function,
    or any other function that has a compliant implementation, should return a promise.
    The returned promise contains either a value, if fulfilled, or an exception, rejected.
    Hence, then can combine with another function using the returned promise to compose
    a chain whereby the result of the first operation is passed on to the next one
    and so on. Also, this can be cut at any point in time by a rejection, which can
    be handled by any operation in the chain that declares an exception-handling code;
    in other words, the error will bubble up automatically through that chain.


    > Some enthusiasts regard this chaining of promises being the best part of the
    new standard.


    In JavaScript programming, chaining is very important when we have a scenario
    where multiple asynchronous operations need to be executed. These scenarios include
    the case where of one operation depends on the outcome of the previous operation.
    Moreover, we might have the case where the first operation needs to process some
    code before it can return a result and pass it to the next operation. Bear in
    mind that all of this should take place without blocking other threads, especially
    the UI thread. Here, we need a straightforward, standard mechanism to chain these
    asynchronous operations, and this is exactly what promises provide.'
  - "[PAGE 32]\n\n# # Chaining of Promises\n\nWhen it comes to chaining promises,\
    \ the chain can go as deep as we want to then always return a promise. One thing\
    \ to watch out for, though, if we are making a call such as `promise.then(onFilled)`,\
    \ is that the `onFilled` function can only be called after the promise has run\
    \ its course, with the promise's value as its first argument. Therefore, if we\
    \ return a simple value inside the first `then` and chain it to another one, the\
    \ next `then` will be called with that simple value returned by the previous `then`.\
    \ If we return a promise from the first `then`, the following `then` will have\
    \ to wait for the returned promise and will only be called or executed when promise\
    \ has been fulfilled or completed.\n\nLet's see this in action. The following\
    \ is a very basic sample code that demonstrates a chained promise:\n\n```\nvar\
    \ promiseObj = function (time) {\n  return new Promise(function (resolve) {\n\
    \    setTimeout(resolve, time);\n  });\n}\n\npromiseObj(3000).then(function ()\
    \ {\n  alert('promise 1');\n}).then(function () {\n  alert('another promise');\n\
    });\n```\n\nThe script is very straightforward, and you can write it in any development\
    \ environment or even in an online code editor as JSFiddle.net. First, we create\
    \ a promise by defining a `promiseObj` object. This object is a function that\
    \ takes one argument at a time and returns a new promise.\n\n> Remember that not\
    \ all browsers support promises as we have learned in Chapter 2, The Promise API\
    \ and its Compatibility. To do this, you will need to run or test the code on\
    \ JSFiddle in a compatible browser. Revert to this chapter to check for compatible\
    \ browsers.\n\nWe construct the promise using `new Promise`. The constructor takes\
    \ an anonymous function that will execute the code. This function is passed with\
    \ one `resolve` argument that will fulfill the promise. Inside this constructor,\
    \ we call the `resolve` argument to execute a `setTimeout` function that takes\
    \ another `time` argument beside the function that will be executed after a given\
    \ time. Hence, `setTimeout` will resolve the promise."
- md: "\n## Chapter 3\n\nThe second part of the code is where the chaining takes place.\
