    \ () {\n  alert('another promise');\n});\n```\n\nNow, since then returns a promise,\
    \ we can chain another then call to it; this will be executed after the promise\
    \ has been resolved and in turn will execute an alert() function. The previous\
    \ example, though very basic, illustrates how we can easily chain asynchronous\
