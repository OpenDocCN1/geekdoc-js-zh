- md: "\n# 3 Chaining of Promises\n\nOne of the most important features of promises\
    \ is the ability to chain and manage sequences of asynchronous operations. In\
    \ the previous chapter, we learned the details of the Promise API and how it works;\
    \ notably, we saw how the then method works. We also learned about the current\
    \ browser compatibility for promises and the libraries that have implemented and\
    \ extended JavaScript promises. In this chapter, we will cover the following topics:\n\
    \n- How chaining came to be in an asynchronous JavaScript\n- Implementing chaining\
    \ with promises\n- Transforming from callback hell into well-organized promise\
    \ chains\n\n## Chaining like never before\n\nAs we learned in the previous two\
    \ chapters, promises tend to bring the prowess of synchronous programming to asynchronous\
    \ functions. This ability of promises includes two key features of synchronous\
    \ functions:\n\n- A function that returns values\n- A function that throws exceptions\n\
    \nThe significance of these features is that they can be used to pass the value\
    \ returned by one function directly into another—and not just once; this can be\
    \ translated into the ability to chain these functions after the other, whereby\
    \ the binding association between the elements in this chain is the promise's\
    \ return value by each operation. Now, what the second feature implies is very\
    \ important as throwing exceptions allows us to primarily detect whether the process\
    \ has failed; secondly, it allows us to capture these exceptions by any function\
    \ that handles a catch in the chain and helps us to avoid losing it in the midst\
    \ of these chained functions.\n\nNow, how does this translate into an asynchronous\
    \ world?\n\n## Chaining of Promises\n\nWell, to begin with, in an asynchronous\
    \ world, one cannot simply return values because those values are not yet ready\
    \ in time. Likewise, we cannot throw exceptions, basically because there is no\
    \ one to catch those raised exceptions. So developers, ever resourceful, have\
    \ tried to solve this by reverting to nested callbacks. This allowed them to chain\
    \ functions with return values, but at the cost of maintainability, readability,\
    \ and of course, extra lines of code. When the code goes in lines and the nested\
    \ callbacks grow, the code becomes harder to maintain and debug when edits are\
    \ needed or errors arise. Also readability is negatively impacted with nested\
    \ callbacks, and developers need to collapse and expand branches in order to follow\
    \ with the code to tell the callback function begins and ends.\n\nMoreover, catching\
    \ errors in these nested callbacks was very strenuous and required developers\
    \ to pass the errors up the chain of callbacks manually. This ordeal in asynchronous\
    \ programming is famous and termed callback hell; it usually ends up in a code\
    \ that looks like the following demo:\n\n```javascript\nfunction shout(shoutTxt,\
    \ callbackFunc) {\n  alert(shoutTxt);\n  callbackFunc(\"b\");\n}\n\nshout('First\
    \ Shout!', function (a) {\n  if (a == \"a\") {\n    alert(\"hey, there is an error!\"\
    );\n  }\n  else {\n    shout('Shout Again!', function (a) {\n      shout('Third\
    \ shout!', function (a) {\n        a = \"c\";\n        if (a == \"c\") {\n   \
    \       shout('I am inside the third shout!',\n            function (a) {\n  \
    \            alert(\"hey, I can \" + a.toString());\n            });\n       \
    \ }\n        else {\n          shout('I am still inside the third shout!',\n \
    \           function (a) {\n              alert(\"Alright I am tired\");\n   \
    \         });\n        }\n      });\n    });\n  }\n});\n```\n\n# Chapter 3\n\n\
    In the previous example, you will notice the widespread presence of function and\
    \ }}; in what looks like a pyramid of code, bearing in mind that we didn't even\
    \ include error-handling code. The previous example depicts, on a small scale,\
    \ what callback hell looks like. We can also observe how nested callbacks—which\
    \ are quite flourishing in JavaScript programming—can grow uncontrollably into\
    \ an intertwined and hard-to-maintain code. So imagine how the code would look\
    \ in a more complex scenario.\n\nNevertheless, there are remedies that developers\
    \ can implement to have nested callbacks that are more readable and maintainable.\
    \ These remedies include the use of named functions instead of anonymous functions\
    \ in the callback parameters. Another solution would be to break down the code\
    \ into smaller chunks by placing the code that does a specific task to a separate\
    \ module and then plug that module into the application code somewhere else. However,\
    \ these remedies are more of a workaround and not a standard practice; also, the\
    \ workarounds are still not enough to address the concept of chaining asynchronous\
    \ operations entirely.\n\nPromises, on the other hand, deliver the functional\
    \ composition that we have in synchronous programming or more of an out-of-the-box\
    \ way when compared with asynchronous programming in JavaScript.\n\nWhy so? Because\
    \ the specification states that a promise is required to provide a then method.\
    \ Not just that; the specification also necessitates that the function, or any\
    \ other function that has a compliant implementation, should return a promise.\
    \ The returned promise contains either a value, if fulfilled, or an exception,\
    \ rejected. Hence, then can combine with another function using the returned promise\
    \ to compose a chain whereby the result of the first operation is passed on to\
    \ the next one and so on. Also, this can be cut at any point in time by a rejection,\
    \ which can be handled by any operation in the chain that declares an exception-handling\
    \ code; in other words, the error will bubble up automatically through that chain.\n\
    \n> Some enthusiasts regard this chaining of promises being the best part of the\
    \ new standard.\n\nIn JavaScript programming, chaining is very important when\
    \ we have a scenario where multiple asynchronous operations need to be executed.\
    \ These scenarios include the case where of one operation depends on the outcome\
    \ of the previous operation. Moreover, we might have the case where the first\
    \ operation needs to process some code before it can return a result and pass\
    \ it to the next operation. Bear in mind that all of this should take place without\
    \ blocking other threads, especially the UI thread. Here, we need a straightforward,\
    \ standard mechanism to chain these asynchronous operations, and this is exactly\
    \ what promises provide.\n\n## Chaining of Promises\n\nWhen it comes to chaining\
    \ promises, the chain can go as deep as we want to then return a promise. One\
    \ thing to watch out for, though, if we are making a call such as `promise.then(onFilled)`,\
    \ is that the `onFilled` function can only be called after the promise has run\
    \ its course, with the promise's value as its first argument. Therefore, if we\
    \ return a simple value inside the first `then` and chain it to another one, the\
    \ next `then` will be called with that simple value returned by the previous `then`.\
    \ If we return a promise from the first `then`, the following `then` will have\
    \ to wait for the returned promise and will only be called promise has been fulfilled\
    \ or completed.\n\nLet's see this in action. The following is a very basic sample\
    \ code that demonstrates a chained promise:\n\n```javascript\nvar promiseObj =\
    \ function (time) {\n  return new Promise(function (resolve) {\n    setTimeout(resolve,\
    \ time);\n  });\n}\n\npromiseObj(3000).then(function () {\n  alert('promise 1');\n\
    }).then(function () {\n  alert('another promise');\n});\n```\n\nThe script is\
    \ very straightforward, and you can write it in any development environment or\
    \ even in an online code editor as JSfiddle.net. First, we create a promise by\
    \ defining a `promiseObj` object. This object is a function that takes one argument\
    \ at a time and returns a new promise.\n\n> Remember that not all browsers support\
    \ promises as we have learned in Chapter 2, The Promise API and its Compatibility.\
    \ To do this, you will need to run or test the code on JSiddle in a compatible\
    \ browser. Revert to this chapter to check for compatible browsers.\n"
  mdcn: "\n\n# 3 Promise 链式调用\n\nPromise 最重要的特性之一是能够链式调用并管理一系列异步操作。在上一章节中，我们已经学习了\
    \ Promise API 的细节以及它的工作原理；特别是，我们看到了 `then` 方法是如何工作的。我们还学习了 Promise 对当前浏览器的兼容性，以及实现和扩展\
    \ JavaScript Promise 的库。在本章中，我们将涵盖以下主题：\n\n- 链式调用在异步 JavaScript 中是如何产生的\n- 使用\
    \ Promise 实现链式调用\n- 从“回调地狱”转换为组织良好的 Promise 链\n\n## 前所未有的链式调用\n\n正如我们在前两个章节中学到的，Promise\
    \ 倾向于将同步编程的强大功能引入异步函数。Promise 的这种能力包含了同步函数的两个关键特征：\n\n- 返回值的函数\n- 抛出异常的函数\n\n\
    这些特征的意义在于，它们可以用于将一个函数的返回值直接传递给另一个函数——而且不仅仅一次；这可以转化为将这些函数按顺序链联的能力，其中链中元素之间的绑定关系是每个操作的\
    \ Promise 返回值。现在，第二个特征的含义非常重要，因为抛出异常允许我们主要检测过程是否失败；其次，它允许我们通过链中处理 `catch` 的任何函数捕获这些异常，帮助我们避免在这些链函数中间丢失异常。\n\
    \n那么，这如何转化到异步世界呢？\n\n## Promise 链式调用\n\n首先，在异步世界中，人们不能简单地返回值，因为这些值尚未及时准备好。同样，我们也不能抛出异常，基本上是因为没有人来捕获这些出的异常。因此，机智多角的开发者尝试通过回归嵌套回调来解决这个问题。这允许他们将带有返回值的函数链起来，但是以牺牲维护性、可读性以及额外的代码行为代价的。当代码增加且嵌套回调增长时，当需要编辑或出现错误时，代码变得越来越难以维护和调试。此外，嵌套回调对可读性有不利影响，开发者需要折叠和展开分支来跟踪代码，判断回调函数的开始和结束。\n\
    \n此外，在这些嵌套回调中捕获错误非常困难，需要开发者手动将错误沿回调链向上传递。这种异步编程中的痛苦经历是出名的，被称为“回调地狱”；它通常导致类似于下面演示的代码：\n\
    \n```javascript\nfunction shout(shoutTxt, callbackFunc) {\n  alert(shoutTxt);\n\
    \  callbackFunc(\"b\");\n}\n\nshout('First Shout!', function (a) {\n  if (a ==\
    \ \"a\") {\n    alert(\"hey, there is an error!\");\n  }\n  else {\n    shout('Shout\
    \ Again!', function (a) {\n      shout('Third shout!', function (a) {\n      \
    \  a = \"c\";\n        if (a == \"c\") {\n          shout('I am inside the third\
    \ shout!',\n            function (a) {\n              alert(\"hey, I can \" +\
    \ a.toString());\n            });\n        }\n        else {\n          shout('I\
    \ am still inside the third shout!',\n            function (a) {\n           \
    \   alert(\"Alright I am tired\");\n            });\n        }\n      });\n  \
    \  });\n  }\n});\n```\n\n# 第 3 章\n\n在上一个例子中，你会注意到在看起来像金字塔的代码中，到处都是函数和 `}}};`，请注意我们甚至没有包含错误处理代码。上一个例子在小规模上描述了回调地狱的样子。我们还可以观察到嵌套回调（这在\
    \ JavaScript 编程中非常盛行）如何不受控制地增长成交织且难以维护的代码。想象一下在更复杂的场景下代码会是什么样的。\n\n尽管如此，开发者可以实施一些补救措施，使嵌套回调更具可读性和维护性。这些措施包括在回调参数中使用命名函数代替匿名函数。另一种解决方案是将代码拆分成更块，将执行特定任务的代码放在单独的模块中，然后将该模块插入到应用程序代码的其他地方。然而，这些措施更多是权宜之计而非标准做法；此外，权宜措施不足以完全解决异步操作链的概念。\n\
    \n另一方面，Promise 提供了我们在同步编程中的函数组合，或者说与 JavaScript 中的异步编程相比的一种开箱即用的方式。\n\n为什么呢？因为规范规定\
    \ Promise 必须提供 `then` 方法。不仅如此，规范还要求函数（或任何具有合规实现的函数）应该返回一个 Promise。返回的 Promise\
    \ 包含一个值（如果已完成）或一个异常（如果被拒绝）。因此，`then` 可以使用返回的 Promise 与另一个函数组合成一个链，其中第一个操作的结果被传递给下一个操作，依此类推。此外，这可以在任何时间被拒绝操作中断，拒绝操作可以由链中任何声明了异常处理代码的操作处理；换句话说，错误将通过该链自动冒泡。\n\
    \n> 一些爱好者认为这种 Promise 链式调用是新标准中最好的部分。\n\n在 JavaScript 编程中，当我们需要执行多个异步操作场景时，链式调用非常重要。这些场景包括一个操作依赖于上一个操作结果的情况。此外，我们可能遇到第一个操作在返回结果并传递给下一个操作之前需要处理某些代码的情况。记住，这一切应该在不阻塞其他线程（尤其是\
    \ UI 线程）的情况下发生。在这里，我们需要一种简单的标准机制来链接这些异步操作，而这正是 Promise 提供的。\n\n## Promise 链式调用\n\
    \n提到链式调用时，只要 `then` 返回 Promise，链就可以达到我们想要的深度。但需要注意的是，如果我们进行像 `promise.then(onFilled)`\
    \ 这样的调用，`onFilled` 函数只能在 Promise 运行结束后被调用，并将 Promise 的值作为其第一个参数。因此，如果我们在第一个 `then`\
    \ 内部返回一个简单值并将其链到另一个，下一个 `then` 将用上一个 `then` 返回的简单值被调用。如果我们在第一个 `then` 中返回一个 Promise，随后的\
    \ `then` 将必须等待返回的 Promise，并且只有在 Promise 履行或完成后才会被调用。\n\n让我们来看实际操作。以下是一个演示链式 Promise\
    \ 的非常基础示例代码：\n\n```javascript\nvar promiseObj = function (time) {\n  return new\
    \ Promise(function (resolve) {\n    setTimeout(resolve, time);\n  });\n}\n\npromiseObj(3000).then(function\
    \ () {\n  alert('promise 1');\n}).then(function () {\n  alert('another promise');\n\
    });\n```\n\n该脚本非常直观，你可以在任何开发环境环境中编写它，甚至可以在 JSfiddle.net 等在线代码编辑器中编写。首先，我们通过定义\
