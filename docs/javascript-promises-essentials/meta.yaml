    # Explaining the WinJS.Promise object


    This object is one of the most important aspects of the WinJS library, and instances
    of promise are involved with anything that we do with asynchronous APIs. Let us
    dive into the details of this object. In terms of anatomy, the promise object
    includes the following three types of members.


    # Constructors


    At the level of constructors in WinJS, a class is created using the WinJS.Class.define
    function. In this first parameter is a function that acts as the constructor.
    Now, in the case of the Promise class, it is derived from a base class called
    PromiseStateMachine using the WinJS.Class.derive function, whose second parameter
    is the constructor. In both cases, constructor functions can be named anything;
    alternatively, they can be anonymous as well. The description of this WinJS.Promise
    constructor, however, is the same as object description itself. The WinJS.Promise
    constructor takes two parameters: init and onCancel.


    When declaring a new promise object, we need two parameters: init and onCancel.
    These two parameters are both functions. The syntax will look like the following:


    ```

    promiseObj = new WinJS.Promise(init, onCancel);

    ```


    The init parameter is optional. The init function is called during the initialization
    or construction of the promise object, which comprises the actual implementation
    of the work that promise, in this case promiseObj, will represent. This implementation
    can be either asynchronous or synchronous, depending on the scope and nature of
    the work needed.


    > One important thing to note here is that the code written within the init function
    does not render it by default to be asynchronous. In order to ensure the code
    runs asynchronously, we must use asynchronous APIs, such as the Windows Runtime
    asynchronous APIs, setTimeout, setImmediate, and requestAnimationFrame.


