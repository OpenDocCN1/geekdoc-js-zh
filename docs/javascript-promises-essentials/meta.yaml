  md: '# Summary


    Throughout the previous five chapters of this book, we have learned a great deal
    about promises. We started with asynchronous programming in JavaScript and took
    store of where promises stand amidst that, during which we discussed in detail
    why you should care about promises as now. Next, we dove deep into the Promises
    API and a thorough description of its then method. Following this, we learned
    the browsers that currently support promises and the libraries that implement
    the covering of promises and gave a detailed explanation of how we can achieve
    this as well as queue the asynchronous operations using promise chains. Our third
    stop was error handling, one of the most important aspects of the concept of promises.
    We stepped back and took a look at exceptions in JavaScript and how they are addressed
    in promises. We also learned about the catch method as part of handling errors
    with promises.


    Promises now have native support in JavaScript, and this is a focal time in the
    world of web and client-side development to start leveraging this technology.
    As we move forward, more browsers will adopt promises as a standard and have it
    become native in the browser.


    If people around you have been making noise about JavaScript promises, well you
    know why. This book represents a single point of reference—a comprehensive one—just
    when you want to learn about promises and saving you from all these bits and pieces
    scattered out there on the Web. You can take this learning and implement it right
    away. The API. From here, you can start implementing your own promise libraries
    and make use of other libraries available as well as delve into other implementations,
    such as Node.js. You can also start using promises for the asynchronous requests
    to databases, the Web, or file servers.


    I hope you enjoyed reading this book and that it left you with the right knowledge,
    tools, and tips to put that learning into practice and make some killer applications
    that leverage the power of JavaScript promises.'
