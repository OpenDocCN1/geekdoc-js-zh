  md: "# JavaScript Promises – Why Should I Care?\n\nPromises, on the other hand,\
    \ provide an abstraction to manage interactions with asynchronous APIs and present\
    \ a more managed approach towards asynchronous programming in JavaScript compared\
    \ to the use of callbacks and event handlers. We can think of promises as more\
    \ of a pattern for asynchronous programming.\n\nSimply put, the promises pattern\
    \ will allow the asynchronous programming to move from the continuation-passing\
    \ style that is widespread to one where the functions return a value, called a\
    \ promise, which will represent the eventual results of that particular operation.\n\
    \nIt allows you to go from:\n\n```\ncall1(function (value1) {\n  call2(value1,\
    \ function(value2) {\n    call3(value2, function(value3) {\n      call4(value3,\
    \ function(value4) {\n        // execute some code\n      });\n    });\n  });\n\
    });\n```\n\nTo:\n\n```\nPromise.asyncCall(promisedStep1)\n.then(promisedStep2)\n\
    .then(promisedStep3)\n.then(promisedStep4)\n.then(function (value4) {\n  // execute\
    \ some code\n});\n```\n\nIf we list the properties that make promises easier to\
    \ work with, they will be as follows:\n\n+   - It is easier to read as the usage\
    \ of cleaner method signatures\n- It allows us to attach more than one callback\
    \ to a single promise\n- It allows for values and errors to be passed along and\
    \ bubble up to the caller function\n- It allows for chaining of promises\n\nWhat\
    \ we can observe is that promises bring functional composition to synchronous\
    \ capabilities by returning values, and error bubbling by throwing exceptions\
    \ to the asynchronous functions. These are capabilities that we take for granted\
    \ in the synchronous world."
