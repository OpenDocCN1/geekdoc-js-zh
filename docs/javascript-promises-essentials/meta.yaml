- md: "\nBear in mind that the promises in WinJS are compliant with the promises defined\
    \ in the CommonJS Promises / A proposal, and till the time of this writing, WinJS\
    \ promises have not been tested against the new Promises/A+ specifications. This\
    \ has no effect on Windows app development, as the apps are running in a store.\
    \ In the browser, the main difference that can arise between WinJS promises and\
    \ A+-compliant promises is that WinJS does not guarantee the callback function\
    \ of the promise will be asynchronous. For example, if we call promise.then(a)\
    \ with a being the callback function we won't be certain whether a will be called\
    \ in an asynchronous or synchronous manner. While in Promises/A+ specifications,\
    \ the callback function will always be called asynchronously. It is a must. The\
    \ specifications explain that not ensuring an asynchronous callback will make\
    \ promises much harder to reason about and debug. Nevertheless, as I mentioned\
    \ earlier in the chapter that WinJS itself is open source and hosted on GitHub,\
    \ the community members, and anyone interested for that matter, can download WinJS,\
    \ build, and test it against the Promises/A+ Compliance Suite.\n\nNext up, let\
    \ we have a look at how to use these WinJS promises in Windows apps development.\n\
    \n## Using WinJS promises\n\nWe leverage promises on the Web to make the UI more\
    \ responsive and avoid blocking the UI thread by executing the work asynchronously.\
    \ Likewise, we use WinJS promises to handle the work asynchronously and thus keep\
    \ the UI thread of the Windows app available to respond to user input. We also\
    \ allow the app layout and static items to load properly and while fetching what\
    \ needs to be fetched from servers and databases asynchronously in the background.\
    \ For that purpose, the asynchronous APIs in WinJS and Windows Runtime are exposed\
    \ in JavaScript as promises.\n\nLet us have a look at a basic example of promises.\
    \ In order to follow and replicate the following example, we will need Visual\
    \ Studio (the Express Version would do). We need to start by creating a basic\
    \ app of the type JavaScript. In order to do so, from the Visual Studio top menu,\
    \ we need to go to File | New Project, which will pop up a small window containing\
    \ the project type. There, we need to go to JavaScript | Store Apps | Windows\
    \ Apps, which will list us for the different JavaScript Windows App templates\
    \ available. For this example, we can select Blank App, which is a project for\
    \ a single-page Windows App that has no predefined controls or layout. Name the\
    \ app as you please, and click on Ok. The following screenshot illustrates the\
    \ steps:\n\n## Chapter 5\n\n![](img/04c7981ae2601bc5401805f632a22d49_53_0.png)\n\
    \nNow, we have a blank Windows app that we can add some code. For that, we need\
    \ to navigate to the default.html page and modify it. Open that page, and insert\
    \ an input element and a div element to display result in the body element, as\
    \ per the following syntax:\n\n```html\n<body>\n  <p>Content goes here</p>\n \
    \ <br/>\n  <div>\n    <input id=\"urlInput\" />\n  </div>\n  <br/>\n  <div id=\"\
    resultDiv\">The result will show here</div>\n</body>\n```\n\nNext, we need to\
    \ add code to the change handler for the input element so that we can do some\
    \ work whenever the input element changes. We can achieve this with the addEventListener\
    \ method and as part of the WinJS.Utilities.ready function. Adding this event\
    \ listener inside this function will allow to change the handler that we are attaching\
    \ to be called directly after the DOM has loaded via the DOMContentLoaded event,\
    \ which will in turn, fire after the page code has been parsed and before all\
    \ the resources have been loaded.\n\n## Promises in WinJS\n\nNavigate to the default.js\
    \ file, located inside the js folder. There, we need to add the following code\
    \ to the end of the app.onactivated event handler:\n\n```javascript\nWinJS.Utilities.ready(function\
    \ () {\n  var inp = document.getElementById(\"urlInput\");\n  inp.addEventListener(\"\
    change\", onChangeHandler);\n}, false);\n```\n\nIn the previous code, we are adding\
    \ an anonymous function code to WinJS.Utilities.ready. In that anonymous function,\
    \ we first get that input element from the DOM, to assign to a variable named\
    \ inp, and then call the method addEventListener on that input variable, which\
    \ adds the function named onChangeHandler to the event handler.\n\nThe last step\
    \ would be to write the code for the onChangeHandler function. In that function,\
    \ we will call the WinJS.xhr method, which basically wraps calls to XMLHttpRequest\
    \ and exposes it as a promise. We can use this method for crossdomain requests\
    \ and intranet requests. Then we pass the URL that the user enters in the input\
    \ element to the parameter of xhr and accordingly update the resultDiv element\
    \ with the result. Xhr is an asynchronous function that returns a promise; hence\
    \ we can take up to three parameters for success, error, and progress, to update\
    \ the UI. Then we will call the method or then methods of the promise object on\
    \ this function that is invoked as soon as the xhr has either successfully completed\
    \ the XMLHttpRequest or raised an error. As seen in the definition earlier. However,\
    \ for this basic example, we will just see how to add the onSubmit function. This\
    \ success handler will apply some changes to the resultDiv by setting its background\
    \ color to blue and the inner text to Hooray!\n\nThe syntax for the onChangeHandler\
    \ function will look like the following code:\n\n```javascript\nfunction onChangeHandler(e)\
    \ {\n  var input = e.target;\n  var resDiv = document.getElementById(\"resultDiv\"\
    );\n\n  WinJS.xhr({ url: e.target.value }).then(function\n  onCompleted(result)\
