    }).then(function(category2) {\n  alert(\"We now have category 2\", category2);\n\
    \  // return category 3\n  return getData(data.categories[2]);\n});\n```\n\nThe\
    \ previous code sample makes an asynchronous call to the jsonCategoryUrl function,\
    \ which will return a set of categories; after this, we retrieve the items in\
    \ the first of those categories by passing the data.categories[0] parameter and\
    \ passing on the first category to the next then call. The second link of chained\
    \ promises, we retrieve the second category data.categories[1] and pass it to\
    \ the last then call, which in turn retrieves the third category, data.categories[2].\
    \ This example shows us how we can queue asynchronous operations in chained promises\
    \ we need to have a chain in which one link depends or needs to wait on the result\
    \ of the preceding promise.\n\n## Chaining of Promises\n\nThis functionality really\
    \ makes promises stand out from regular callback patterns. We can optimize the\
    \ previous code by making a shortcut method to retrieve the categories, as shown\
    \ in the following code:\n\n```javascript\n//declare categorypromise var\nvar\
    \ catPromise;\nfunction getCategory(i) {\n  //if catPromise has no value get Data\
    \ else just populate\n  // from value of catPromise.\n  catPromise = catPromise\
    \ || getData(jsonCategoryUrl);\n  return catPromise.then(function(category) {\n\
    \    //get the items under that category\n    return getData(category.Items[i]);\n\
    \  });\n}\ngetCategory(0).then(function(items) {\n  alert(items);\n  return getCategory(1);\n\
    }).then(function(items) {\n  alert(items);\n});\n```\n\nIn the previous code sample,\
    \ we first declare a variable called catPromise to hold the category of the promise.\
    \ Next, we declare a function called getCategory(i) that takes the values of i\
    \ as a parameter; and we set catPromise to the JSON data retrieved by the getData(jsonCategoryUrl)\
    \ function; however, using the || (or) operator, we can first check whether the\
    \ catPromise object has a value so that we don't fetch the category JSON file,\
    \ but only once. When we call getCategory with the value 0, it will retrieve the\
    \ first category; after this, it will return the category with getCategory(1)\
