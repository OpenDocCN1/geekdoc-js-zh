    \ function (a) {\n        a = \"c\";\n        if (a == \"c\") {\n          shout('I\
    \ am inside the third shout!',\n            function (a) {\n              alert(\"\
    hey, I can \" + a.toString());\n            });\n        }\n        else {\n \
    \         shout('I am still inside the third shout!',\n            function (a)\
    \ {\n              alert(\"Alright I am tired\");\n            });\n        }\n\
    \      });\n    });\n  }\n});\n});\n```"
