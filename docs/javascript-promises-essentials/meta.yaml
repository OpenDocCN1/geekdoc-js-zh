  md: '# The Promise API and Its Compatibility


    # Checking the browser compatibility


    As with any client-side technology, JavaScript has expressly been developed for
    use in a web browser in conjunction with HTML pages. it uses the browser to do
    the job, which is why it a scripting language. Once the script is sent to the
    browser, it is then up to the latter to do something with it. There is a heavy
    dependency there; thus, browser compatibility is vital.


    There are already implementations of promises in some browsers; at the time of
    writing this book, there is a small selection of browsers that support promises,
    as the following ECMAScript 6 compatibility table by Kangax:


    | Feature name | IE 10 | IE 11 | FF 24 | FF 25 | FF 27-28 | FF 29 | FF 30 | FF
    31 | CH 30 | CH 33 | CH 34 | CH 35 | SF 6 | SF 7 | WK | OP 12 | OP 15 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|-|

    | Promise | No | No | No | No | Yes | Yes | Yes | Yes | Yes | Yes | Yes | No |
    No | Yes | No | No |


    Source: http://kangax.github.io/compat-table/es6/#Promise


    > > The abbreviations in the compatibility table

    > IE stands for Internet Explorer, FF for Firefox, CH for Chrome, Safari for Webkit,
    and OP for Opera.


    As we can see in the previous table, the last three versions of Firefox, as of
    version 29, and Chrome, as of 32, enable promises by default. Worry not, for there
    is a polyfill to add the promises functionalities to browsers that do not support
    it.


    > > A polyfill is a new term coined by Remy Shap and grew popular in the community
    of web developers. It represents a piece of code that delivers the technology
    and the behavior that we expect the browser to provide natively. We can think
    of it as a patch in terms of computing.


    This polyfill does the magic and provides us with the support for promises can
    be downloaded from this link: https://www.promisejs.org/polyfills/promise-4.0.0.js.
    it basically adds support for promises to browsers that don''t implement it natively.
    It can also be used to provide support for promises in Node.js. The following
    code sample shows how to include it in:


    ```

    <script src="https://www.promisejs.org/polyfills/promise-4.0.0.js"></script>

    ```'
