  md: 'Chapter 2, The Promise API and Its Compatibility, takes you through more details
    of the Promises API. We will also learn about current browser support for the
    promises standard and have a look at the JavaScript libraries out there that implement
    promises and promise-like features.


    Chapter 3, Chaining of Promises, shows you how promises allow chaining of asynchronous
    operations and what that enables. Chapter also covers how to queue asynchronous
    operations.


    Chapter 4, Error Handling, covers exceptions and error handling in JavaScript.
    This chapter will also explain how promises make error handling easier and better.


    Chapter 5, Promises in WinJS, explores all about the WinJS.Promise object and
    how it is used in Windows Apps development.


    Chapter 6, Putting It All Together – Promises in Action, shows you the promises
    in action and how and where we can use promises in scenarios that put together
    everything we have learned so far.


    # # What you need for this book


    In order to implement what you will be learning in this book, you just need an
    HTML and JavaScript editor. You can choose from the following:


    +   * Microsoft Visual Studio Express 2013 for Web: This provides a full-featured
    markup and code editors.

    * WebMatrix: This is another option to run the sample code. It is a free, lightweight,
    cloud-connected web development tool that leverages the latest stands and popular
    JavaScript libraries.

    * jsF: This is an online web editor that allows you to write HTML and JavaScript
    code and run it directly in the browser.


    # # Who this book is for


    This book is for all developers who are involved in JavaScript programming, be
    it in web development or with technologies, such as Node.js and WinRT, which make
    heavy use of asynchronous APIs. Moreover, it developers who are interested in
    learning about asynchronous programming in JavaScript and the new standard that
    will make your experience much better. In short, this book is for everyone who
    wants to learn about the new kid on the block that goes by the name of JavaScript
    Promise.'
