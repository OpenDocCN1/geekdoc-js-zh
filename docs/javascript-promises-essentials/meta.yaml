  mdcn: "\n请记住，WinJS 中的 Promise 符合 CommonJS Promises / A 提议中定义的 Promise，并且在编写本文时，WinJS\
    \ Promise 尚未针对新的 Promises/A+ 规范进行测试。这对于 Windows 应用开发没有影响，因为应用运行在商店中。在浏览器中，WinJS\
    \ Promise 与符合 A+ 规范的 Promise 之间可能出现的主要区别是，WinJS 不保证 Promise 的回调函数是异步的。例如，如果我们调用\
    \ `promise.then(a)` 且 `a` 为回调函数，我们无法确定 `a` 是以异步还是同步的方式被被调用的。而在 Promises/A+ 规范中，回调函数始终以异步方式被调用，这是必须的。规范解释说，不确保异步回调将使\
    \ Promise 变得难以理解和调试。尽管如此，正如我在本章早期提到的，WinJS 本身是开源并托管在 GitHub 上的，社区成员以及对此感兴趣的任何人都可以下载\
    \ WinJS，进行构建并针对 Promises/A+ 合规套件进行测试。\n\n接下来，让我们看看如何在 Windows 应用开发中使用这些 WinJS\
    \ Promise。\n\n## 使用 WinJS Promise\n\n我们在 Web 上利用 Promise 来使 UI 更具响应性，通过通过异步执行工作来避免阻塞\
    \ UI 线程。同样，我们使用 WinJS Promise 来异步处理工作，从而保持 Windows 应用的 UI 线程可用以响应用户输入。我们还允许应用布局和静态项目能够正常加载，同时在后台异步从服务器和数据库获取所需数据。为了这一目的，WinJS\
    \ 和 Windows Runtime 中的异步 API 以 Promise 的形式在 JavaScript 中暴露出来。\n\n让我们来看一个 Promise\
    \ 的基础示例。为了遵循并复制以下示例，我们需要 Visual Studio（Express 版本即可）。我们首先需要创建一个 JavaScript 类型的基础应用。要实现这一点，我们需要从\
    \ Visual Studio 顶部菜单中进入 `File（文件） | New Project（新建项目）`，这将弹出一个包含项目类型的小窗口。在那里，我们需要进入\
    \ `JavaScript | Store Apps | Windows Apps`，这会列出所有不同的 JavaScript Windows 应用模板。对于此示例，我们可以选择\
    \ `Blank App（空白应用）`这是一个单页 Windows 应用项目，没有预定义的控件或布局。随心为应用命名并点击 Ok。接下来的截图说明了这些步骤：\n\
    \n## 第 5 章\n\n![](img/04c7981ae2601bc5401805f632a22d49_53_0.png)\n\n现在，我们有一个可以添加代码的空白\
    \ Windows 应用。为此，我们需要导航到 `default.html` 页面并对其进行修改。打开该页面，按照以下语法在 `body` 元素中插入一个\
    \ `input` 元素和一个 `div` 元素来显示结果：\n\n```html\n<body>\n  <p>内容在此处</p>\n  <br/>\n \
    \ <div>\n    <input id=\"urlInput\" />\n  </div>\n  <br/>\n  <div id=\"resultDiv\"\
    >结果将在此显示</div>\n</body>\n```\n\n接下来，我们需要为 `input` 元素添加更改处理程序添加代码，以便每当输入元素发生变化时我们都能执行某些工作。我们可以通过\
    \ `addEventListener` 方法作为 `WinJS.Utilities.ready` 函数的一部分来实现。在此函数内部添加此事件监听器，将允许我们绑定的处理程序在\
    \ DOM 通过 `DOMContentLoaded` 事件加载后直接被调用，而这反过来会在页面代码解析后所有资源加载之前触发。\n\n## WinJS 中的\
    \ Promise\n\n导航到位于 `js` 文件夹内的 `default.js` 文件。在那里，我们需要将以下代码添加到 `app.onactivated`\
    \ 事件处理程序的末尾：\n\n```javascript\nWinJS.Utilities.ready(function () {\n  var inp\
    \ = document.getElementById(\"urlInput\");\n  inp.addEventListener(\"change\"\
    , onChangeHandler);\n}, false);\n```\n\n在之前的代码中，我们向 `WinJS.Utilities.ready` 添加了一段匿名函数代码。在那个匿名函数中，我们首先从\
    \ DOM 中获取该输入元素并将其赋值给名为 `inp` 的变量，然后在该输入变量上调用 `addEventListener` 方法，这会将名为 `onChangeHandler`\
    \ 的函数添加到事件处理程序中。\n\n最后一步将是为 `onChangeHandler` 函数编写代码。在那个函数中，我们将调用 `WinJS.xhr`\
    \ 方法，它基本上封装了对 `XMLHttpRequest` 的调用并将其暴露为 Promise。我们可以使用此方法进行跨域请求和内网请求。然后，我们将用户在输入元素中输入的\
    \ URL 传递给 `xhr` 的参数，并相应地用结果更新 `resultDiv` 元素。`Xhr` 是一个返回 Promise 的异步函数；因此我们可以接受三个参数：成功、错误和进度来更新\
    \ UI。然后我们在该函数上调用 Promise 对象的方法或 `then` 方法，该方法会在 `xhr` 成功完成 `XMLHttpRequest` 或抛出错误时立即被调用。正如之前的定义所示。然而，对于这个基础示例，我们将查看如何添加\
    \ `onSubmit` 函数。此成功处理程序将通过将 `resultDiv` 的背景颜色设置为蓝色并将内部文本设置为“Hooray!”来应用一些更改。\n\
    \n`onChangeHandler` 函数的语法如下代码所示：\n\n```javascript\nfunction onChangeHandler(e)\
    \ {\n  var input = e.target;\n  var resDiv = document.getElementById(\"resultDiv\"\
    );\n\n  WinJS.xhr({ url: e.target.value }).then(function\n  onCompleted(result)\
    \ {\n    if (result.status === 200) {\n      resDiv.style.backgroundColor = \"\
