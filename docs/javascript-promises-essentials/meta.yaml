  md: "# # Chaining of Promises\n\nWhen it comes to chaining promises, the chain can\
    \ go as deep as we want to then always return a promise. One thing to watch out\
    \ for, though, if we are making a call such as `promise.then(onFilled)`, is that\
    \ the `onFilled` function can only be called after the promise has run its course,\
    \ with the promise's value as its first argument. Therefore, if we return a simple\
    \ value inside the first `then` and chain it to another one, the next `then` will\
    \ be called with that simple value returned by the previous `then`. If we return\
    \ a promise from the first `then`, the following `then` will have to wait for\
    \ the returned promise and will only be called or executed when promise has been\
    \ fulfilled or completed.\n\nLet's see this in action. The following is a very\
    \ basic sample code that demonstrates a chained promise:\n\n```\nvar promiseObj\
    \ = function (time) {\n  return new Promise(function (resolve) {\n    setTimeout(resolve,\
    \ time);\n  });\n}\n\npromiseObj(3000).then(function () {\n  alert('promise 1');\n\
    }).then(function () {\n  alert('another promise');\n});\n```\n\nThe script is\
    \ very straightforward, and you can write it in any development environment or\
    \ even in an online code editor as JSFiddle.net. First, we create a promise by\
    \ defining a `promiseObj` object. This object is a function that takes one argument\
    \ at a time and returns a new promise.\n\n> Remember that not all browsers support\
    \ promises as we have learned in Chapter 2, The Promise API and its Compatibility.\
    \ To do this, you will need to run or test the code on JSFiddle in a compatible\
    \ browser. Revert to this chapter to check for compatible browsers.\n\nWe construct\
    \ the promise using `new Promise`. The constructor takes an anonymous function\
    \ that will execute the code. This function is passed with one `resolve` argument\
    \ that will fulfill the promise. Inside this constructor, we call the `resolve`\
    \ argument to execute a `setTimeout` function that takes another `time` argument\
    \ beside the function that will be executed after a given time. Hence, `setTimeout`\
    \ will resolve the promise."
