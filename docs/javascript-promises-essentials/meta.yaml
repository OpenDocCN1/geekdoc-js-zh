    # Preface


    JavaScript Promises Essentials is a practical guide to the new concept of promises.
    It presents a single resource replacing all the scattered information out there
    about the topic. It covers in detail the new standard that will enhance the way
    we do asynchronous programming in JavaScript. The book is a brief, concise, explanation
    of the Promises API and its features and how it can be used in JavaScript programming.
    It covers the essentials of JavaScript promises, touching on the details that
    matter the most in your new learning with some very useful tips on the different
    aspects of the topic.


    Promises are for the most part a programming concept and provide a process that
    allows developers to arrange work to be executed on data and values that do not
    exist and allow them to deal with those values at an undetermined point in the
    future (asynchronously). It also presents an abstraction to handle the communication
    with asynchronous APIs. Currently, there are ways to achieve asynchronous calling
    in JavaScript through callback, timers, and events, but all come with caveats.
    Promises solve real development headaches and allow developers to handle JavaScript''s
    asynchronous operations in a more native manner compared to the traditional approaches.
    Furthermore, promises present a straightforward correspondence between synchronous
    functionality and asynchronous functions, especially at level of error handling.
    Several libraries have started using promises and now offer a robust implementation
    of promises. You can find promises on the Web in many libraries and also by interacting
    with Node.js and WinRT. Learning the details of promise implementations will help
    you avoid the many problems that arise in the world of asynchronous JavaScript
    and construct better JavaScript APIs.


    # What this book covers


    Chapter 1, JavaScript Promises – Why Should I Care?, presents an introduction
    to the world of asynchronous programming in JavaScript and the importance of promises
    in that world.'
  - '[PAGE 5]


    Chapter 2, The Promise API and Its Compatibility, takes you through more details
    of the Promises API. We will also learn about current browser support for the
    promises standard and have a look at the JavaScript libraries out there that implement
    promises and promise-like features.


    Chapter 3, Chaining of Promises, shows you how promises allow chaining of asynchronous
    operations and what that enables. Chapter also covers how to queue asynchronous
    operations.


    Chapter 4, Error Handling, covers exceptions and error handling in JavaScript.
    This chapter will also explain how promises make error handling easier and better.


    Chapter 5, Promises in WinJS, explores all about the WinJS.Promise object and
    how it is used in Windows Apps development.


    Chapter 6, Putting It All Together – Promises in Action, shows you the promises
    in action and how and where we can use promises in scenarios that put together
    everything we have learned so far.


    # # What you need for this book


    In order to implement what you will be learning in this book, you just need an
    HTML and JavaScript editor. You can choose from the following:


    +   * Microsoft Visual Studio Express 2013 for Web: This provides a full-featured
    markup and code editors.

    * WebMatrix: This is another option to run the sample code. It is a free, lightweight,
    cloud-connected web development tool that leverages the latest stands and popular
    JavaScript libraries.

    * jsF: This is an online web editor that allows you to write HTML and JavaScript
    code and run it directly in the browser.


    # # Who this book is for


    This book is for all developers who are involved in JavaScript programming, be
    it in web development or with technologies, such as Node.js and WinRT, which make
    heavy use of asynchronous APIs. Moreover, it developers who are interested in
    learning about asynchronous programming in JavaScript and the new standard that
    will make your experience much better. In short, this book is for everyone who
    wants to learn about the new kid on the block that goes by the name of JavaScript
    Promise.'
