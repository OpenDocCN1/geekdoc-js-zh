- md: "\n# Chapter 1\n\nIf you're new to JavaScript, seeing functions passed as parameters\
    \ might be somewhat unfamiliar, but don't worry; it becomes easy when you think\
    \ of them as objects.\n\nSome browser APIs like HTML5 Geolocation are called based\
    \ on design. I will use own's getCurrentMethod to use a callback function in an\
    \ example. The code will look like the following:\n\n```\nnavigator.geolocation.getCurrentPosition(function(position)\
    \ {\n alert('I am here, Latitude: ' + position.coords.latitude + ' ' +\n  '/ Longitude:\
    \ ' + position.coords.longitude);\n});\n```\n\nIn the previous example, we simply\
    \ called the getCurrentPosition method and pass it an anonymous function, which\
    \ in turn invokes an alert method that will get called back with the result we\
    \ requested. This allows the browser to execute this code synchronously or asynchronously;\
    \ thus, the code not be blocking the browser while the position is being retrieved.\n\
    \nIn this case, we used a built-in browser API, but we can also make our applications\
    \ asynchronous-ready by exposing their basic APIs in an asynchronous manner with\
    \ callback functions the ones involved in an I/O operation or heavy computing,\
    \ which might take a great deal of time.\n\nFor example, in a callback scenario,\
    \ the simplest code to retrieve some data would look like the following:\n\n```\n\
    getData(function(myData) {\n alert('Houston, we have : ' + myData);\n});\n```\n\
    \nIn the previous JavaScript code, we just defined a getData function that takes\
    \ a callback function as a parameter, which in turn executes an alert that displays\
    \ the data we are supposed to retrieve. This actually obliges the application\
    \ UI code to be asynchronous-ready; thus, the UI will not be blocked while the\
    \ code is retrieving the data.\n\nLet's compare it to a non-callback scenario;\
    \ the code will look like the following:\n\n```\n// WRONG: this will make the\
    \ UI freeze when getting the data\nvar myData = getData();\nalert(\"Houston, we\
    \ have : \" + myData);\n```\n\n# JavaScript Promises – Why Should I Care?\n\n\
    In the previous example, the JavaScript code will run line by line, and the next\
    \ line of code will run even though the first one is not finished. Such an API\
    \ design will make the code UI-blocking because it freezes the UI until the data\
    \ is retrieved. Furthermore, if the execution of the getData() function happens\
    \ to take some time, for example, fetching data from the internet, the overall\
    \ experience will not be pleasant to the user because the UI will have to wait\
    \ for this finish executing.\n\nMoreover, in the previous examples of callback\
    \ functions, we passed an anonymous function as a parameter of the containing\
    \ function. This is the most common pattern of using callback functions. Another\
    \ way to use callback functions is to declare a named function and pass the name\
    \ of function as a parameter. In the following example, we will use a named function\
    \ instead. We will create a generic function that takes a string parameter and\
    \ displays it in an alert. We will call popup. Then, we will create another function\
    \ and call getContent(); this takes two parameters: a string object and a callback\
    \ function. Lastly, we will call the getContent function, and pass it a string\
    \ value in the first parameter and the callback popup in the second. Run the script\
    \ and the result will be an alert that contains the value in the first string\
    \ parameter. The following is a code sample for this:\n\n```\n// generic function\
    \ that displays an alert\nfunction popup(message) {\n  alert(message);\n}\n//\
    \ A function that takes two parameters, the last\none a callback function\nfunction\
    \ getContent(content, callback) {\n  callback(content); //call the callback function\n\
    }\ngetContent(\"JavaScript is awesome!\", popup);\n```\n\nAs we can see in the\
    \ previous example, we were able to pass a parameter to the callback function,\
    \ at the end of the day, it is a normal function when it is executed. We can pass\
    \ to the callback function any of the containing function's variables as parameters\
    \ or even global variables from elsewhere in the code.\n\nTo summarize, JavaScript\
    \ callback functions are powerful and have contributed greatly to the web development\
    \ environment, thus allowing developers to have asynchronous JavaScript programming.\n\
    \n# Why should I care about promises?\n\nWhat do promises have to do with all\
    \ of this? Well, let's start by defining promises.\n\nA promise represents the\
    \ eventual result of an asynchronous operation.\n\n- Promises/A+ specification,\
    \ http://promisesplus.com/\n\nSo, a promise object represents a value that may\
    \ not be available yet, but will be resolved at some point in the future.\n\n\
    Promises have states and at any point in time, can be one of the following:\n\n\
    - **Pending**: The promise's value is not yet determined and its state transition\
    \ to either fulfilled or rejected.\n- **Fulfilled**: The promise was fulfilled\
    \ with success and now has a value that must not change. Additionally, it must\
    \ not transition to any other state from the fulfilled state.\n- **Rejected**:\
    \ The promise is returned from a failed operation and must have a reason for failure.\
    \ This reason must not change and the promise must not transition to any other\
    \ state from this state.\n\nA promise may only move from the pending state to\
    \ the fulfilled state or from the pending state to the rejected state. However,\
    \ once a promise is fulfilled or rejected, it must not transition to any other\
    \ state and its value cannot change because it is immutable.\n\n> The immutable\
    \ characteristic of promises is super important. It helps avoid undesired side\
    \ effects from listeners, which can cause unexpected changes in behavior, and\
    \ in turn promises to be passed to other functions without affecting the caller\
    \ function.\n\nFrom an API perspective, a promise is defined as an object that\
    \ has a function as the value for the property. The promise object has a primary\
    \ then method that returns a new object. Its syntax will look like this:\n\n```\n\
    then(onFulfilled, onRejected);\n```\n\nThe following two arguments are basically\
    \ callback functions that will be called for completion of promise:\n\n- **onFulfilled**:\
    \ This argument is called when a promise is fulfilled\n- **onRejected**: This\
    \ argument is called when a promise has failed\n\n# JavaScript Promises – Why\
    \ Should I Care?\n\nBear in mind that both arguments are optional. Moreover, non-function\
    \ values for the arguments will be ignored, so it might be a good practice to\
    \ always check whether the arguments are functions before executing them.\n\n\
    > It is worth noting that, when you research promises, you might come across two\
    \ definitions/specifications: one based on Promises/A+ and an older one based\
    \ on Promises/ A by CommonJS. While Promises/A+ is based on the concepts and then\
    \ API presents the CommonJS proposal, A implementation differs from Promises/A\
    \ in several ways, as we will see in Chapter 2, The Promise API and Its Compatibility.\n\
    \nThe new promise returned by the method is resolved when the given onFulfilled\
    \ or onRejected callback is completed. The implementation reflects a simple concept:\
    \ when a promise is fulfilled, it has a value, and when it is rejected, it has\
    \ a reason.\n\nThe following is a simple example of how to use a promise:\n\n\
    ```\npromise.then(function (value) {\n  var result = JSON.parse(data).value;\n\
    }, function (reason) {\n  alert(error.message);\n}\n});\n```\n\nThe fact that\
