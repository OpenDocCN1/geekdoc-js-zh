  md: 'While the web technologies and browsers advanced, JavaScript grew more prominent
    as a web scripting language allowing developers to access the DOM and dynamically
    display and interact with the content presented on the web page. However, JavaScript
    is also single-threaded by nature, which means that, at any given time, two lines
    of script cannot run together; instead, JavaScript statements are executed by
    line. Likewise, in browsers, JavaScript shares a thread with a bunch of other
    workloads executed by the browser from painting and updating styles to handling
    user actions. One activity will deliver the order.


    When it first started, JavaScript was intended for short, quick-running pieces
    of code. Major application logic and calculations were done on the server side.
    Ever since loading content on the web changed when reloading the whole page to
    the client side, asynchronous developers relying heavily on JavaScript for web
    development. Now, we can find complete application logic being written with JavaScript,
    and so many libraries have flourished to help developers do so.


    In web development, we have the three main components:


    +   - HTML and CSS


    +   - The Document Object Model (DOM)


    +   - JavaScript


    And I will add a fourth component that plays a pivotal role in AJAX programming:


    +   - The XMLHttpRequest API


    Briefly, HTML and CSS are used for the presentation and layout of a web page.
    The DOM is used for the dynamic display and interaction with content. The XHR
    object used sends HTTP/HTTPS requests to a web server and loads the server response
    data back into the script, mediating an asynchronous communication. Lastly, JavaScript
    allows developers to bring all these technologies together in order to create
    beautiful, responsive, and dynamic web applications.


    In order to tackle the multithreading limitation, developers relied heavily on
    events and callbacks because that is the way browsers expose asynchronous programming
    to the application logic.


    In event-based asynchronous APIs, an event handler is registered for a given object
    and the action is called when the event is fired. The browser will perform the
    action usually in a different thread, and triggers the event in the main thread
    when appropriate.'
