    # 3 Chaining of Promises


    One of the most important features of promises is the ability to chain and manage
    sequences of asynchronous operations. In the previous chapter, we learned the
    details of the Promise API and how it works; notably, we saw how the then method
    works. We also learned about the current browser compatibility for promises and
    the libraries that have implemented and extended JavaScript promises. In this
    chapter, we will cover the following topics:


    +   * How chaining came to be in an asynchronous JavaScript

    * Implementing chaining with promises

    * Transforming from callback hell into well-organized promise chains


    # Chaining like never before


    As we learned in the previous two chapters, promises tend to bring the prowess
    of synchronous programming to asynchronous functions. This ability of promises
    includes two key features of synchronous functions:


    +   * A function that returns values

    * A function that throws exceptions


    The significance of these features is that they can be used to pass the value
    returned by one function directly into another—and not just once; this can be
    translated into the ability to chain these functions after the other, whereby
    the binding association between the elements in this chain is the promise''s return
    value by each operation. Now, what the second feature implies is very important
    as throwing exceptions allows us to primarily detect whether the process has failed;
    secondly, it allows us to capture these exceptions by any function that handles
    a catch in the chain and helps us to avoid losing it in the midst of these chained
    functions.


    Now, how does this translate into an asynchronous world?'
  - "[PAGE 30]\n\n# Chaining of Promises\n\nWell, to begin with, in an asynchronous\
    \ world, one cannot simply return values because those values are not yet ready\
    \ in time. Likewise, we cannot throw exceptions, basically because there is no\
    \ one to catch those raised exceptions. So developers, ever resourceful, have\
    \ tried to solve this by reverting to nested callbacks. This allowed them to chain\
    \ functions with return values, but at the cost of maintainability, readability,\
    \ and of course, extra lines of code. When the code goes in lines and the nested\
    \ callbacks grow, the code becomes harder to maintain and debug when edits are\
    \ needed or errors arise. Also readability is negatively impacted with nested\
    \ callbacks, and developers need to collapse and expand branches in order to follow\
    \ with the code to tell the callback function begins and ends.\n\nMoreover, catching\
    \ errors in these nested callbacks was very strenuous and required developers\
    \ to pass the errors up the chain of callbacks manually. This ordeal in asynchronous\
    \ programming is famous and termed callback hell; it usually ends up in a code\
    \ that looks like the following demo:\n\n```\nfunction shout(shoutTxt, callbackFunc)\
    \ {\n  alert(shoutTxt);\n  callbackFunc(\"b\");\n}\n\nshout('First Shout!', function\
    \ (a) {\n  if (a == \"a\") {\n    alert(\"hey, there is an error!\");\n  }\n \
