  md: "# Chapter 2\n\nThe technique that promise resolution procedure uses to handle\
    \ thenables allows implementations to work reliably with one another, as long\
    \ as promise exposes a then method that is Promises/A+-compliant. Additionally,\
    \ it also allows implementations to integrate non-standard implementations with\
    \ reasonable then methods.\n\n> The Promise Resolution Procedure (PRP) is not\
    \ a public API. It is intended to describe an important, yet abstract and internal/private\
    \ procedure, where \"procedure\" here simply means \"algorithm\" rather than a\
    \ concrete JavaScript function. A particular promise implementation may implement\
    \ however it feels best.\n\n- Brian Cavalier, co-editor at Promises/A+ explains\n\
    \nThe promise resolution procedure allows us to have a correct implementation\
    \ of promise.resolve. It is also necessary to guarantee a correct implementation\
    \ of then. You might notice that there is no return value for the promise resolution\
    \ procedure because it is an abstract procedure that may be implemented in any\
    \ way the author of particular promise implementation sees. Here, the result is\
    \ left to the implement as long as it achieves the goal, which is to put the promise\
    \ into the same state as x. So, conceptually, it affects a state transition on\
    \ the promise.\n\nAlthough the implementation of the promise resolution procedure\
    \ algorithm is left to the implementers, it has some rules of its own that we\
    \ should abide by if we want to be compliant with the proposal when we need to\
    \ run it. These rules are as follows:\n\n+   1. If a promise and x refer to the\
    \ same object, the promise should be rejected with a TypeError that has for the\
    \ onRejected handler.\n2. If x is a promise, we should take on its current state.\
    \ This rule allows the use of implementation-specific behaviors to actually adopt\
    \ the state of known-conformant promises. The following are conditions:\n    *\
    \ If x is in the pending state, the promise must remain in the pending until x\
    \ is fulfilled or rejected\n    * If/x is fulfilled, the promise should be fulfilled\
    \ with the same value that has\n    * If/x is rejected, the promise should be\
    \ rejected with the same reason that x was rejected\n3. If x is an object or a\
    \ function, and not a promise, then the following is done:\n    * When we want\
    \ to call then, the method should be x.then. a defensive measure that is imperative\
    \ to ensure consistency in the face of an accessor property. This has a value\
    \ that could change whenever we retrieve it."
