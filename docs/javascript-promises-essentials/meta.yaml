    \ and raises an event with the specified type and properties. It takes two parameters\
    \ and returns a Boolean value depending on whether preventDefault was called on\
    \ the event or not. The parameters of this method are of a string value, containing\
    \ the name of the event and eventDetails, an object which includes the set of\
    \ additional properties to be attached to the event object. The basic syntax of\
    \ this method looks like the following:\n`promise.dispatchEvent(type, eventDetails);`\n\
    \n## Promises in WinJS\n\n- Then: This is the most important method of the promise\
    \ object. This takes three parameters of the type function, function, which allows\
    \ us to specify the work to be done on the completion of the promise; the promise\
    \ value has been fulfilled; the error handling that will be performed when the\
    \ promise raises an error, and it has failed to fulfill a value; and lastly handling\
    \ of the work progress within the promise along the way. The return value of then\
    \ is a promise that completes the result of the execute function in its value.\
    \ In its basic form, the then method will have the following syntax: `promise.then(onComplete,\
    \ onError, onProgress);`\n\nThe three arguments of the then method are of the\
    \ type function. These are as follows:\n- onComplete: This handler will be called\
    \ when the promise is completed successfully and fulfilled with a value. The value\
    \ will be passed as a single argument. The value returned from onComplete becomes\
    \ the fulfilled value of the promise returned by then. In the case of an error\
    \ or exception during the execution of this function, the promise returned by\
    \ then will enter the error state.\n- onError: This handler will be called when\
    \ the promise breaks and it is fulfilled with an error; the value returned from\
    \ onError will become the value of the promise returned by the then method. Instead\
    \ of passing a value as that in the onComplete function, the error will be passed\
    \ as an argument.\n- onProgress: This handler is used if we need to report the\
    \ progress of a promises operation. It has a single argument, which is the progress\
    \ data. Note that promises are not obliged to support progress in WinJS.\n\n-\
    \ The Done method, like Then, also allows us to specify what needs to be executed\
    \ when a promise has been fulfilled, the error handling when a promise fails,\
    \ and the reporting of progress along the way. In addition, this function will\
    \ throw any error that would be returned from then as a value. Unlike then which\
    \ returns a promise, Done does not return a value. The basic syntax of this method\
    \ looks like the following code:\n`promise.done(onComplete, onError, onProgress);`\n\
    \nThere are some differences between then and done; the most obvious one is the\
    \ return value. As stated earlier, the following list summarizes these: Then allows\
    \ for chaining multiple functions, because it returns a promise. While with done\
    \ we cannot chain more than one because it does not return a value; more specifically,\
    \ it returns undefined. Hence, done must be the final call. For example, we can\
    \ have .then().then().then(), and so on, while done ends at .done()\n\nIf there\
    \ was no error handler provided to done and an error occurs (in other words, an\
    \ unhandled exception), an exception will be thrown to the event loop allowing\
    \ to catch it in the window.onerror event, but not within a try/catch block. Thus,\
    \ the function guarantees to the caller method to throw any error that is not\
    \ handled inside the method. While, then, those unhandled exceptions are wisely\
    \ caught and traversed as part of the promise state, then does not throw an exception\
    \ but instead returns a promise that is in the error state. Knowing the difference\
    \ between these two methods is critical to using. Nevertheless, for both methods,\
    \ it is recommended to adopt flat promise chains in favor of nested, as the formatting\
    \ of promise chains makes them easier to read and easier to handle errors. For\
    \ example, the following sample code is preferable:\n\n```\nasyncFunc()\n  .then(function\
    \ () { return asyncFunc1(); })\n  .then(function () { return asyncFunc2(); })\n\
    \  .done(function () { return theEnd(); });\n```\n\nAnd the following is labeled\
    \ as one of don's:\n\n```javascript\n// not very neat!\nasyncFunc().then(function\
    \ () {\n  asyncFunc1().then(function () {\n    asyncFunc2().done(function () {\
    \ theEnd(); });\n  })\n});\n```\n"
  mdcn: "\n\n此参数中使用的 `init` 函数接受以下参数：\n\n-   completeDispatch: 当 `init` 内部的操作完成时，此参数将被调用，从而传递该操作的结果。`init`\
    \ 代码应在操作完成后调用此项，并将操作结果作为参数传递。\n\n-   errorDispatch: 当该操作发生错误且 promise 变为错误状态时，此参数将被调用。由于是错误，`errorDispatch`\
    \ 的参数应该是 `WinJS.Promise.ErrorFromName` 的实例。\n\n-   progressDispatch: 在操作处理过程中，此参数会被定期调用。该函数将包含一个中间结果。如果\
    \ promise 内部的操作由于需要支持进度报告，则使用此参数。\n\n`onCancel` 参数是 Promise 构造函数的第二个参数。promise\
    \ 的调用者可以使用此函数取消其任何未完成的工作。然而，在 WinJS 中，promise 并不提供或支持取消。\n\n## 事件 (Events)\n\n\
    在 promise 对象成员类型的列表中，接下来是事件（Events）。目前，Promise 对象有一个名为 `onerror` 的事件。正如名称所示，该事件在处理\
    \ promise 过程中发生错误时触发。此外，每当任何 promise 抛出运行时错误时，无论该错误是否在其他地方被处理，此 `onerror` 事件都会触发。错误处理器可以辅助调试，可用于设置断点并提供错误日志。然而，归结底，它可以提供关于导致错误的代码或输入的见解和细节。此\
    \ `onerror` 事件提供了一种通用的错误处理机制。在代码中，添加一个通用的错误处理器如下所示：\n\n```\nWinJS.Promise.onerror\
    \ = errorHandler;\n\nfunction errorHandler(event) {\n    // 获取通用错误处理信息\n    var\
    \ exc = event.detail.exception;\n    var promiseErrored = event.detail.promise;\n\
    }\n```\n\n代码示例的第一行仅仅是将 `errorHandler` 函数附加到 promise 对象的错误事件上。接下来，我们定义 `errorHandler`\
    \ 函数，它接受一个参数 `event`；在该示例中，函数的作用是从事件中获取信息，例如异常和 promise。然后，我们将这些值赋值给变量。参数 `event`\
    \ 是 `CustomEvent` 类型的事件处理器参数；它通常是一个包含事件信息的对象。\n\n## 方法 (Methods)\n\npromise 对象的最后一个成员类型是方法（Methods），目前\
    \ WinJS.Promise 拥有以下方法：\n\n-   addEventListener: 此方法简单地为 promise 附加一个事件监听器。它接受三个参数：`eventType`（事件的字符串名称）、`listener`（在事件触发时被调用的函数）以及\
    \ `capture`（用于启用或禁用捕获的布尔值）。此方法没有返回值，其基本语法如下：\n`promise.addEventListener(eventType,\
    \ listener, capture);`\n\n-   removeEventListener: 此方法从控制中移除事件监听器。在语法上，它与 `addEventListener`\
    \ 方法类似，如下所示代码所示：\n`promise.removeEventListener(eventType, listener, capture);`\n\
    \n-   Cancel: 此方法尝试取消 promise。在 promise 支持取消且尚未完成的情况下，此方法将导致 promise 进入错误状态，其值为\
    \ `Error(\"Canceled\")`。它没有参数也没有返回值。其基本语法如下：\n`promise.cancel();`\n\n-   dispatchEvent:\
    \ 此方法简单地分发并触发一个指定类型和属性的事件。它接受两个参数，并返回一个布尔值，取决于是否在事件上调用了 `preventDefault`。此方法的参数类型为字符串值（包含事件名称）和\
    \ `eventDetails`（一个包含要附加到事件对象的额外属性集的对象）。此方法的基本语法如下：\n`promise.dispatchEvent(type,\
    \ eventDetails);`\n\n## WinJS 中的 Promises\n\n-   Then: 这是 promise 对象中最重要的方法。它接受三个\
    \ `function` 类型的参数：第一个函数允许我们指定 promise 完成后要执行的工作（promise 的值已完成）；第二个函数是在 promise\
    \ 抛出错误未能完成值时将执行的错误处理；最后一个是处理过程中 promise 内部工作进度的处理。`then` 的返回值是一个 promise，其值是内部\
    \ `execute` 函数执行的结果。在基本形式下，`then` 方法将具有以下语法：`promise.then(onComplete, onError,\
    \ onProgress);`\n\n`then` 方法的三个参数类型均为 `function`。具体如下：\n-   onComplete: 当 promise\
    \ 成功完成并带有值完成时，将调用此处理器。该值将作为单个参数传递。`onComplete` 返回的值成为 `then` 返回的 promise 的完成值。如果在执行此函数期间发生错误或异常，`then`\
    \ 返回的 promise 将进入错误状态。\n-   onError: 当 promise 发生中断并带有错误完成时，将调用此处理器；`onError`\
    \ 返回的值将成为 `then` 方法返回的 promise 的值。它不是像 `onComplete` 函数那样传递值，而是将错误作为参数传递。\n-  \
    \ onProgress: 当我们需要报告 promise 操作的进度时，使用此处理器。它有一个参数，即进度数据。注意，WinJS 中的 promise 并不强制支持进度。\n\
    \n-   `Done` 方法与 `Then` 一样，也允许我们指定 promise 完成时需要执行的内容、promise 失败时的错误处理以及沿途的进度报告。此外，此函数将抛出任何本作为值从\
    \ `then` 返回的错误。与返回 promise 的 `then` 不同，`Done` 不返回任何值。该方法的基本语法如下所示：\n`promise.done(onComplete,\
    \ onError, onProgress);`\n\n`then` 和 `done` 之间存在一些差异，最明显的是返回值。如前所述，下列表总结了这些差异：`Then`\
    \ 允许链式调用函数，因为它返回一个 promise。而在 `done` 中我们无法链式调用，因为它不返回值；具体来说，它返回 `undefined`。因此，`done`\
    \ 必须是最后的调用。例如，我们可以拥有 `.then().then().then()` 等以此类推，而 `done` 止于 `.done()`。\n\n\
    如果没有为 `done` 提供错误处理器且发生了错误（换句话说，发生了未处理的异常），异常将抛出到事件循环，允许在 `window.onerror` 事件中捕获，但在\
    \ `try/catch` 块中不能。因此，该函数向调用者方法抛出任何在方法内部未处理的错误。而在 `then` 中，这些未处理的异常会被明智地捕获并作为\
    \ promise 状态的一部分，`then` 不抛出异常而是返回一个处于错误状态的 promise。了解这两个方法的区别对于使用至关重要。尽管如此，对于这两个方法，建议采用扁平的\
    \ promise 链而不是嵌套，因为 promise 链的格式使其更容易阅读和处理错误。例如，以下示例代码更优越：\n\n```\nasyncFunc()\n\
    \  .then(function () { return asyncFunc1(); })\n  .then(function () { return asyncFunc2();\
    \ })\n  .done(function () { return theEnd(); });\n```\n\n而以下被标记为 `done` 的用法：\n\
    \n```javascript\n// 不太整洁！\nasyncFunc().then(function () {\n  asyncFunc1().then(function\
    \ () {\n    asyncFunc2().done(function () { theEnd(); });\n  })\n});\n```\n\n"
