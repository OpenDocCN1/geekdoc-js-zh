    \ and wrap the function that stores the promise handlers in the array, as the\
    \ following code shows:\n\n```\nvar that = this;\nsetTimeout(function () {\n \
    \ that.handlers.push({\n    fulfillPromise: onFulfilled,\n    rejectPromise: onRejected,\n\
    \    promise: returnedPromise\n  });\n  that.resolve();\n}, 2);\n```\n\n# Wrapping\
    \ the code\n\nThe final step in this implementation would be to indicate and when\
