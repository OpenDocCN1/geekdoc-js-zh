  md: '# The Promise API And Its Compatibility


    +   - If retrieving the x.then property ends up with throwing an exception, the
    promise should be rejected with e as the reason.


    +   - If then is a function, call it with x taking the value of this. The first
    argument should be resolvePromise and the second argument should be rejectPromise.


    +   - If then does not qualify as a function, directly fulfill the promise with
    x.


    +   4. If x is neither an object nor function, the promise should be fulfilled
    with x.


    Let''s have a look at the third rule. We saw that, if then is the function, the
    first argument should be resolvePromise and the second argument should be rejectPromise
    where the following rules apply:


    +   1. If/when resolvePromise is called with a value z, the implementation must
    run [Resolve](promise, z).


    +   2. If/when rejectPromise is called with a reason j, the implementation must
    reject the promise with reason j.


    +   3. If both handlers resolvePromise and rejectPromise are called, or in the
    case of multiple calls to the same argument, the first call should take precedence,
    and any other subsequent calls are ignored.


    +   4. If calling then results in throwing an exception e, we have two conditions:


    +   - If the resolvePromise or rejectPromise handlers have already been called,
    we should ignore then


    +   - If not, the implementation should reject the promise with e as the reason
    returned


    The long list of rules acts as guidance for implementers, so, if you are implementing
    then in your Public API, these rules should apply to your algorithm to be compliant
    with the Promises/A+ standard specifications. I have asked Brian Cavalier about
    the need of PRP and he added the following:


    > One of the most important aspects of the PRP is that it has been carefully designed
    to allow different promise implementations to operate in a reliable way.'
