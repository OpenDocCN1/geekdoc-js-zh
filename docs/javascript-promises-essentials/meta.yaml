  md: "# The Promise API and Its Compatibility\n\n+   - Both arguments must not be\
    \ called more than once within the same call.\n- The onFulfilled argument must\
    \ be called only after a promise is fulfilled, with the value of the promise as\
    \ its first argument.\n- The onRejected argument must be called after the promise\
    \ is rejected, with the reason of promise rejection as its first argument.\n-\
    \ The onFulfilled and onRejected arguments must not be passed as a this value,\
    \ if you apply the strict mode to the JavaScript code, this will be treated as\
    \ undefined in the handlers; in the quirks mode, it will be treated as the global\
    \ object in JavaScript code.\n- The then method can be called more than once on\
    \ the same promise.\n- When a promise is fulfilled, all the onFulfilled handlers\
    \ must be executed in the same order as their originating calls to then. The same\
    \ rule applies for the onRejected callbacks.\n- The then method must return a\
    \ promise as follows:\n  promiseReturned = promise.then(onFulfilled, onRejected);\n\
    - If either onFulfilled or onRejected returns a value x, the promise resolution\
    \ procedure must be called to resolve the value x, as the following code shows:\n\
    \  promiseReturned = promise.then(onFulfilled, onRejected); [Resolve](promiseReturned,\
    \ x).\n- If either the onFulfilled or onRejected handler throws an exception e,\
    \ promiseReturned must be rejected with e as the reason of rejection or failure.\n\
    - If onFulfilled is not a function and the promise is fulfilled, promiseReturned\
    \ must be fulfilled with the same value.\n- If onRejected is not a function and\
    \ the promise is rejected, promiseReturned must be rejected with the same reason.\n\
    \nThe previous list was a detailed specification of the promise and then method\
    \ defined and specified in the Promises/A+ standard. We talked about the promise\
    \ resolution procedure in the previous list, but we don't know what it is. Well,\
    \ the promise resolution procedure is basically an abstract operation that takes\
    \ a promise and a value as argument, and is indicated as follows:\n\n```\n[[Resolve](promise,\
    \ x)]\n```\n\nIf x is thenable, meaning that it is an object or function that\
    \ defines a then method, the resolve method will force a promise to assume the\
