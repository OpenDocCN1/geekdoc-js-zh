    # 4 Error Handling


    As in any programming language, errors and exceptions are bound to rise; to ensure
    a smooth running code and easier debugging, we will need to throw and catch these
    exceptions. asynchronous JavaScript programming can be tedious. Promises, however,
    offer us a great mechanism to handle errors, which we will explore in this chapter.
    Throughout the chapter, we learned about the chaining of asynchronous operations.
    We also saw how we can transform callback hell to the more readable and maintainable
    promise chains. In this chapter, we will cover the following topics:


    +   - Exceptions and error handling in promise

    - How to handle errors with promises using then and catch methods


    # Exceptions and promises


    There is no standard or agreed-on-mechanism to handle exceptions in asynchronous
    JavaScript programming, mainly due to the fact that these exceptions in the future
    and there is no way to tell if a rejected promise will eventually be handled.
    Moreover, in an asynchronous world, we cannot simply throw exceptions, because
    there is no one there to catch these errors when they are not ready yet. Hence,
    workarounds were created to address this issue. The common technique of catching
    errors and exceptions involved passing these exceptions manually up the chain
    of nested callbacks. Promises, on the other hand, provide us with error handling
    and bubbling out of the box. They do so by stating that your functions should
    return a promise that is rejected with a reason if it fails.'
