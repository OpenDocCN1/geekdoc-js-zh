- md: "\n## Can't I just use a callback?\n\nCallbacks are simple! We pass a function,\
    \ it gets invoked at some point in the future, and we get to do things asynchronously.\
    \ Additionally, callbacks are lightweight since we need to add extra libraries.\
    \ Using functions as higher-order objects is already built into the JavaScript\
    \ programming language; hence, we do not require additional code to use it.\n\n\
    However, asynchronous programming in JavaScript can quickly become complicated\
    \ if not dealt with care, especially callbacks. Callback functions tend to become\
    \ difficult to maintain and debug when nested within long lines of code. Additionally,\
    \ the use of anonymous inline functions in a callback can make reading the call\
    \ stack very tedious. Also, when it comes to debugging, exceptions that are thrown\
    \ back from a deeply nested set of callbacks might not propagate properly up to\
    \ the function that initiated the callback within the chain, which makes it difficult\
    \ to determine exactly where the error is. Moreover, it is hard to structure a\
    \ code that is based around callbacks as they roll out a messy code like a snowball.\
    \ We will end up having something like the following code sample on a much larger\
    \ scale:\n\n```javascript\nfunction readJSON(filename, callback) {\n  fs.readFile(filename,\
    \ function (err, result) {\n    if (err) return callback(err);\n    try {\n  \
    \    result = JSON.parse(result, function (err, result) {\n        fun.readAsync(result,\
    \ function (err, result) {\n          alert(\"I'm inside this loop now\");\n \
    \       });\n        alert(\"I'm here now\");\n      });\n    } catch (ex) {\n\
    \      return callback(ex);\n    }\n    callback(null, result);\n  });\n}\n```\n\
    \nThe sample code in the previous example is an excerpt of a deeply nested code\
    \ that is sometimes referred to as the pyramid of doom. Such a code, when it grows,\
    \ will make it a daunting task to read through, structure, maintain, and debug.\n\
    \n![](img/04c7981ae2601bc5401805f632a22d49_16_0.png)\n\n## JavaScript Promises\
    \ – Why Should I Care?\n\nPromises, on the other hand, provide an abstraction\
    \ to manage interactions with asynchronous APIs and present a more managed approach\
    \ towards asynchronous programming in JavaScript compared to the use of callbacks\
    \ and event handlers. We can think of promises as more of a pattern for asynchronous\
    \ programming.\n\nSimply put, the promises pattern will allow the asynchronous\
    \ programming to move from the continuation-passing style that is widespread to\
    \ one where the functions return a value, called a promise, which will represent\
    \ the eventual results of that particular operation.\n\nIt allows you to go from:\n\
    \n```javascript\ncall1(function (value1) {\n  call2(value1, function(value2) {\n\
    \    call3(value2, function(value3) {\n      call4(value3, function(value4) {\n\
    \        // execute some code\n      });\n    });\n  });\n});\n```\n\nTo:\n\n\
    ```javascript\nPromise.asyncCall(promisedStep1)\n.then(promisedStep2)\n.then(promisedStep3)\n\
    .then(promisedStep4)\n.then(function (value4) {\n  // execute some code\n});\n\
    ```\n\nIf we list the properties that make promises easier to work with, they\
    \ will be as follows:\n\n- It is easier to read as the usage of cleaner method\
    \ signatures\n- It allows us to attach more than one callback to a single promise\n\
    - It allows for values and errors to be passed along and bubble up to the caller\
    \ function\n- It allows for chaining of promises\n\nWhat we can observe is that\
    \ promises bring functional composition to synchronous capabilities by returning\
    \ values, and error bubbling by throwing exceptions to the asynchronous functions.\
    \ These are capabilities that we take for granted in the synchronous world.\n\n\
    The following sample (dummy) code shows the difference between using callbacks\
    \ to compose asynchronous functions communicating with each other and promises\
    \ to do the same.\n\nThe following is an example with callbacks:\n\n```javascript\n\
    $(\"#testInput\").click(function () {\n  firstCallback(function (param) {\n  \
    \  getValues(param, function (result) {\n      alert(result);\n    });\n  });\n\
    });\n```\n\nThe following is a code example that converts the previous callback\
    \ functions to promise-returning functions that can be chained to each other:\n\
    \n```javascript\n$(\"#testInput\").clickPromise() // promise-returning function\n\
    \  .then(firstCallback)\n  .then(getValues)\n  .then(alert);\n```\n\nAs we have\
    \ seen, the flat chains that promises allow us to have code that is easier to\
    \ read and eventually easier to maintain when compared to the traditional callback\
    \ approach.\n\n## Summary\n\nCallbacks in JavaScript allow us to have a user interface\
    \ that is more responsive by asynchronously to events (that is, user input), without\
    \ blocking the rest of the application. Promises are a pattern that allows for\
    \ a standardized approach to asynchronous programming, which enables developers\
    \ to write asynchronous code that is more readable and maintainable.\n\nIn the\
    \ next chapter, we will take a look at the browsers that support promises and\
    \ their compatibility with jQuery. You will also learn about libraries that support\
    \ promise-like functionalities.\n\n## 2: The Promise API and Its Compatibility\n\
    \nPromises are fairly new to the JavaScript world, but workarounds have been around\
    \ for some time. As we have seen in the previous chapter, there are ways to address\
    \ asynchronous programming in JavaScript, be it through events or callbacks. You\
    \ also learned why promises differ from the traditional techniques for that purpose.\n\
    \nNext, we will go into more details of the Promise API. You will also learn about\
    \ the current browser support for the promises standard and take a look at the\
    \ JavaScript libraries out there that implement promises and promise-like features.\
    \ In this chapter, we will cover the following topics:\n\n- The Promise API and\
    \ its details\n- Browser compatibility\n- Promise implementations\n- Libraries\
    \ with promise-like features\n\n## The Promise API And Its Compatibility\n\n###\
    \ Getting to know the API\n\nThroughout this book, we will be mostly addressing\
    \ and using promises as defined in the specification of Promises/A+ (http://promisesplus.com/).\
    \ The Promises/A+ organization produced the Promises/A+ specification with the\
    \ aim of expounding the initial Promises/A specification into one that is clearer\
    \ and better tested. The proposal is a quote from their website:\n\n> Promises/A+\
    \ is based on the concepts and then API presented in the CommonJS Promises/A proposal.\n\
    \n> - http://promisesplus.com/differences-from-promises-a\n\nThese differences\
    \ are seen at three levels: omissions, additions, and clarifications. At the level\
    \ of omissions, Promises/A+ has removed the following features from the original:\n\
    \n- Progress handling: This feature includes a callback function that handles\
    \ the operation while in progress, as not fulfilled rejected. It was removed because\
    \ implementers have concluded that, in practice, these functionalities have proven\
    \ to be underspecified and currently there is no total agreement on their behaviors\
    \ within the promise community.\n- Interactive promises: This feature was an extended\
    \ promise in the previous Promises/A proposal and basically supported two additional\
    \ functions for the promise methods; get(propertyName), which requests the property\
    \ from the target of this promise, and call(functionName, arg1, arg2, ...), which\
    \ calls the given method/function in its parameter on the target of the promise.\
    \ In the new A+ specification, this feature, along with the two functions, call\
    \ and get, is considered out of scope when implementing a basic API required for\
    \ interoperable promises.\n- promise== resultPromise: This feature was a requirement\
    \ in the old proposal, which states that the result of a promise should not equal\
    \ the promise, for example, var resultPromise = promise.then(onFulfilled, onRejected).\
    \ In fact, any implementation may allow for resultPromise === promise, provided\
    \ that the implementation meets all the requirements.\n\nAt the level of additions,\
    \ the Promises/A+ specification adds the following features and requirements to\
    \ the Existing Promises/A proposal:\n\n- The behavior specifications in the scenario\
    \ where onFulfilled or onRejected returns a then, including the details of the\
