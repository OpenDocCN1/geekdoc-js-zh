  mdcn: "\n\n# 第一章\n\n如果你是 JavaScript 的初学者，看到函数被作为参数传递可能会觉得有些陌生，但别担心；当你把它们看作对象时，一切都会变得简单。\n\
    \n某些浏览器 API（如 HTML5 Geolocation）是根据设计被调用的。我将在示例中使用自定义的 `getCurrentMethod` 来使用回调函数。代码看起来如下：\n\
    \n```\nnavigator.geolocation.getCurrentPosition(function(position) {\n alert('I\
    \ am here, Latitude: ' + position.coords.latitude + ' ' +\n  '/ Longitude: ' +\
    \ position.coords.longitude);\n});\n```\n\n在上一个示例中，我们简单地调用了 `getCurrentPosition`\
    \ 方法并传递了一个匿名函数，该函数反过来调用了 `alert` 方法，该方法将带有我们请求的结果被回调。这允许浏览器同步或异步地执行此代码；因此，在获取位置时代码不会阻塞浏览器。\n\
    \n在这种情况下，我们使用了内置的浏览器 API，但我们也可以通过异步的方式暴露其基本 API 来让我们的应用程序支持异步。这些 API 涉及到 I/O 操作或密集型计算，这些可能花费大量时间。\n\
    \n例如，在回调场景中，获取某些数据的最简单代码如下：\n\n```\ngetData(function(myData) {\n alert('Houston,\
    \ we have : ' + myData);\n});\n```\n\n在之前的 JavaScript 代码中，我们仅仅是定义了一个 `getData`\
    \ 函数，它接受一个回调函数作为参数，该函数反过来执行一个 `alert` 来显示我们应该获取的数据。这实际上强制应用程序 UI 代码必须做好异步准备；因此，在代码获取数据时，UI\
    \ 不会被阻塞。\n\n让我们将其与非回调场景进行比较；代码看起来如下：\n\n```\n// 错误：这将在获取数据时导致 UI 冻结\nvar myData\
    \ = getData();\nalert(\"Houston, we have : \" + myData);\n```\n\n# JavaScript\
    \ Promise (Promises) – 我为什么需要关注它？\n\n在之前的示例中，JavaScript 代码将逐行运行，即使第一行代码没有完成，下一行代码也会运行。这种\
    \ API 设计会导致代码 UI 阻塞，因为它会冻结 UI 直到获取数据为止。此外，如果 `getData()` 函数的执行恰好需要一些时间（例如，从互联网获取数据），整体体验对用户来说将非常糟糕，因为\
    \ UI 必须等待其执行完成。\n\n此外，在之前的回调函数示例中，我们将匿名函数作为包含函数的参数传递。这是使用回调函数的常见模式。另一种使用回调函数的方法是声明一个命名函数并将函数名作为参数传递。在下面的示例中，我们将使用命名函数。我们将创建一个接受字符串参数并在\
    \ `alert` 中显示它的通用函数。我们将其命名为 `popup`。然后，我们将创建另一个函数并调用 `getContent()`；它接受两个参数：一个字符串对象和一个回调函数。最后，我们将调用\
    \ `getContent` 函数，并在第一个参数传递一个字符串值，并在第二个参数传递 `popup` 回调。运行脚本，结果将是一个包含第一个字符串参数中值的\
    \ alert。以下是该代码的示例：\n\n```\n// 显示 alert 的通用函数\nfunction popup(message) {\n  alert(message);\n\
    }\n// 一个接受两个参数的函数，最后一个是回调函数\nfunction getContent(content, callback) {\n  callback(content);\
    \ //调用回调函数\n}\ngetContent(\"JavaScript is awesome!\", popup);\n```\n\n正如我们在上一个示例中看到的，我们能够向回调函数传递参数，归根结底，它在执行时就是一个普通函数。我们可以将包含函数的任何变量作为参数传递给回调函数，甚至可以传递代码其他部分的全局变量。\n\
    \n总结一下，JavaScript 回调函数是强大的，对 Web 开发环境做出了巨大贡献，从而允许开发者进行异步 JavaScript 编程。\n\n# 我为什么应该关注\
    \ Promise？\n\nPromise 与这一切之间有什么关系呢？嗯，让我们从定义 Promise 开始。\n\n一个 Promise 代表异步操作的最终结果。\n\
    \n- [Promises/A+ 规范，http://promisesplus.com/\n\n因此，一个 Promise 对象代表一个可能尚未可用的值，但它将在未来的某个点被解析（resolved）。\n\
    \nPromise 有状态，在任何时间点，可以是以下状态之一：\n\n- **Pending (等待中)**：Promise 的值尚未确定，它的状态将转移到已完成（fulfilled）或已拒绝（rejected）。\n\
    - **Fulfilled (已完成)**：Promise 成功完成，现在有一个必须不能改变的值。此外，它不得从已完成状态转换到任何其他状态。\n- **Rejected\
    \ (已拒绝)**：Promise 从一个失败的操作返回，并且必须有一个失败原因。该原因不能改变，且 Promise 不得从该状态转换到任何其他状态。\n\n\
    Promise 只能从 `pending` 状态移动到 `fulfilled` 状态，或从 `pending` 状态移动到 `rejected` 状态。然而，一旦\
    \ Promise 被完成或拒绝，它就不能转换到任何其他状态，且它的值不能改变，因为它是不可变的。\n\n> Promise 的不可变特性非常重要。它有助于避免监听器产生非预期的副作用（这可能会导致行为的意外变化），反而在可以在不影响调用者函数的情况下将\
    \ Promise 传递给其他函数。\n\n从 API 的角度来看，Promise 被定义为一个对象，其属性的值是一个函数。Promise 对象有一个主要的\
    \ `then` 方法，返回一个新对象。它的语法如下：\n\n```\nthen(onFulfilled, onRejected);\n```\n\n以下两个参数基本上是回调函数，它们将在\
    \ Promise 完成时被调用：\n\n- **onFulfilled**：该参数在 Promise 已完成时调用\n- **onRejected**：该参数在\
    \ Promise 失败时调用\n\n# JavaScript Promises – 我为什么需要关注它？\n\n请记住，两个参数都是可选的。此外，非函数的参数值将被忽略，因此在执行它们之前检查参数是否为函数可能是一个良好的习惯。\n\
    \n> 值得注意的是，当你研究 Promise 时，可能会遇到两种定义/规范：一种基于 Promises/A+，另一种是基于 CommonJS 的旧版 Promises/\
    \ A。虽然 Promises/A+ 基于这些概念并提出了 then API，但 A 的实现在多个方面与 Promises/A 有不同，我们将在第二章看到。\n\
    \n方法返回的新 Promise 在指定的 `onFulfilled` 或 `onRejected` 回调完成后被解析。该实现反映了一个简单的概念：当 Promise\
    \ 被完成时，它有一个值；当它被拒绝时，它有一个原因。\n\n以下是使用 Promise 的简单示例：\n\n```\npromise.then(function\
    \ (value) {\n  var result = JSON.parse(data).value;\n}, function (reason) {\n\
    \  alert(error.message);\n}\n});\n```\n\n回调处理程序的返回值作为返回 Promise 的解析值，这使得 Promise\
    \ 操作可以链式。因此，我们将得到类似的内容：\n\n```\n$getJSON('example.json').then(JSON.parse).then(function(response)\
    \ {\n  alert(\"Hello There: \", response);\n});\n```\n\n"
