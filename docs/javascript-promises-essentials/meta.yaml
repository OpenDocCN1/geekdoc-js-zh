    # Chapter 4


    We can conclude from the previous code samples that there is nothing distinct
    about catch, simply its sugarcoating then(null, function) function. Moreover,
    as Brian Cavalier, one of the authors of Promise/A+ specifications, puts catch()
    is simply a restricted subset of then(). But does it make the code in general
    and error handling specifically more readable? The ECMAScript 6.0 incorporates
    catch() as a requirement in the promise specification, and as I stated earlier,
    most of the popular implementations nowadays include.


    However, there is a gotta between then() and catch() in implementation as then()
    tends to be somewhat misleading at times. To see it in an example so as to better
    understand it, take the following two lines of code:


    ```

    promise.then(handler1, handler2);

    ```


    ```

    promise.then(handler1).catch(handler2);

    ```


    These two lines of code include promise, then, and catch methods with two handlers:
    handler1 and handler2. These two calls are not equivalent—the first line will
    not catch handler2 if an error occurs in handler1. That is, if the promise is
    fulfilled, handler1 will be invoked, and if the promise is rejected, handler2
    will be invoked. If handler1 throws error, handler2 will not be called in return.


    Meanwhile, in the second line, handler2 will be invoked if either promise is rejected
    or handler1 throws an exception. Since catch() is merely a sugarcoat for then(null,
    handler), the second line is identical to the following, which can make this conundrum
    clearer:


    ```

    promise.then(handler1).then(null, handler2);

    ```


    The reason behind this nonequivalence in the previous two lines of code is the
    way then() operates. The then(handler1, handler2) methods register two parallel
    handlers for a promise, whereby either handler1 or handler2 will be called never
    both. On the other hand, with then(handler1).catch(handler2), both handlers/functions
    will be invoked if handler1 rejects, because they represent separate steps in
    the promise chain. Promise rejections will move forward to the succeeding method
    with a rejection callback when we have catch as an equivalent of then.


    Although this does not seem intuitive at first glance, it is very important to
    provide an easier reasoning about asynchronous programming and it makes rejecting
    a promise similar to throwing an exception in synchronous programming. In the
    synchronous world, exceptions do not allow for executing the code that immediately
    follows a throw block and the code inside the closest catch block, whereby the
    errors that happen within a try block moves directly to the catch block.


