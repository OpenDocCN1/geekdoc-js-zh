- md: "\n# JavaScript Promises – Why Should I Care?\n\nThere was never a time before\
    \ when JavaScript had been this popular. What was once and maybe still is for\
    \ some, the most misunderstood programming language mainly because of its name,\
    \ now ranks among the top popular programming languages available. Furthermore,\
    \ nearly every personal computer out there might have at least one JavaScript\
    \ interpreter in use or at least installed. The growing popularity of JavaScript\
    \ is entirely due to its role as the scripting language of the Web. Its success\
    \ there—JavaScript designed to run in Netscape Navigator—led to it becoming the\
    \ standard equipment in virtually all the web browsers, but JavaScript has grown\
    \ and matured and is now exposed to a large portion of development not related\
    \ to the Web. In this first chapter, we will be covering a brief introduction\
    \ about the following:\n\n- Asynchronous programming in JavaScript\n- Issues that\
    \ developers face with traditional approaches to handle asynchronous operations\n\
    - Introduction to JavaScript Promises\n- Why we should care about promises when\
    \ comparing it to the common way of doing things asynchronously\n\n## Asynchronous\
    \ programming in JavaScript\n\nWhen it comes to asynchronous programming in JavaScript,\
