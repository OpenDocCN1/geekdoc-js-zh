  md: 'Furthermore, the promise resolution procedure even allows correctness in the
    face of a non-compliant (and slightly dangerous) thenables. An example would be
    the use of a resolve function to convert jQuery''s version of a promise, which
    doesn''t comply with the A+ standard, to a really simple standard-conforming promise.
    The following code illustrates that implementation:


    ```

    // an ajax call that returns jquery promise

    var jQueryPromise = $.ajax(''/sample.json'');

    //correct it and convert it to a standard conforming promise

    var standardPromise = Promise.resolve(jQueryPromise);

    ```


    At the end of the day, the core goal of Promises/A+ is to provide the minimum,
    most simple specification that will allow reliable interoperation of different
    promise implementations, even in the face of hazards.


    > Just to erase any confusion that might come out, the promise resolution procedure
    is not exactly the same as the promise.resolve method that some implementations
    provide in their public API.


    In alignment with the core goal of the Promises/A+ standard, the Promises/A+ organization
    created a compliance test suite to test the compliance of a promise library or
    API implementation against the Promises/A+ specification. The compliance tests,
    which can be found at https://github.com/promises-aplus/promises-tests, are the
    new intended to provide more concrete guidance and evidence for whether the implementations
    meet the requirements and conform to standards.


    # Browser support and compatibility


    JavaScript is tightly coupled with browsers and the same applies to promises because
    promises are not a standard in the previous version of ECMAScript and will be
    part of the new ECMAScript 6 release; they wont be supported across all the browsers.
    Moreover, promises can be implemented and we will witness several libraries offering
    promise-like features or exposing promise capabilities. In the remaining portion
    of this chapter, we will cover these two points that are essential when it comes
    to working with promises.'
