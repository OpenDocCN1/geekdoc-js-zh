    # Summary


    Promises represent a great way to address the intricacies of asynchronous operations.
    Promises provide a great mechanism for easy chaining of asynchronous operations
    in JavaScript. They allow you to manage the sequences of these operations in a
    better way than the callback mode.


    In the next chapter, we will learn about handling errors in promises, see how
    exceptions are managed with promises, and go over some examples on how to handle
    errors that arise during an asynchronous operation in promises.'
- md: "\n## 4 Error Handling\n\nAs in any programming language, errors and exceptions\
    \ are bound to rise; to ensure a smooth-running code and easier debugging, we\
    \ will need to throw and catch these exceptions. Asynchronous JavaScript programming\
    \ can be tedious. Promises, however, offer us a great mechanism to handle errors,\
    \ which we will explore in this chapter. Throughout the chapter, we learned about\
    \ the chaining of asynchronous operations. We also saw how we can transform callback\
    \ hell to the more readable and maintainable promise chains. In this chapter,\
    \ we will cover the following topics:\n\n- Exceptions and error handling in promise\n\
    - How to handle errors with promises using then and catch methods\n\n### # Exceptions\
    \ and promises\n\nThere is no standard or agreed-on mechanism to handle exceptions\
    \ in asynchronous JavaScript programming, mainly due to the fact that these exceptions\
    \ occur in the future and there is no way to tell if a rejected promise will eventually\
    \ be handled. Moreover, in an asynchronous world, we cannot simply throw exceptions,\
    \ because there is no one there to catch these errors when they are not ready\
    \ yet. Hence, workarounds were created to address this issue. The common technique\
    \ of catching errors and exceptions involved passing these exceptions manually\
    \ up the chain of nested callbacks. Promises, on the other hand, provide us with\
    \ error handling and bubbling out of the box. They do so by stating that your\
    \ functions should return a promise that is rejected with a reason if it fails.\n\
    \n## Error Handling\n\nWe learned in Chapter 1, JavaScript Promises - Why Should\
    \ I Care? that a promise can exist in three different states: pending, fulfilled,\
    \ and rejected.\nThe requirements for the rejected state are as follows:\n\n-\
    \ The promise must not change to any other state (pending or fulfilled)\n- The\
    \ promise must have a reason for being rejected, and that reason must not change\
    \ within that promise\n\nThese requirements of the rejected state allow error\
    \ handling, and more importantly error composition, where the reason for the rejection\
    \ of that promise will automatically bubble up that chain of promises using the\
    \ then method. Promises allow errors to propagate up the chain of code similar\
    \ to the synchronous exceptions. Moreover, it provides a cleaner state to handle\
    \ errors asynchronously.\n\nTypically, in asynchronous programming using the Callback\
    \ approach, we need to wrap the code block that we think is unsafe in a try-catch\
    \ block. This is shown in the following code sample:\n\n```javascript\ntry {\n\
    \  return JSON.parse(\"json\"); // this will cause an error\n} catch (error) {\n\
    \  alert(\"I have an error with the following details:\\n\\n\" + error);\n}\n\
    ```\n\nThe previous code sample shows a block of script that intends to alert\
    \ an error. In that block of code, we wrapped `return JSON.parse(\"json\");` in\
    \ a try...catch block and intentionally caused an error by passing an invalid\
    \ JSON parameter. The JavaScript function `JSON.parse()` is used to convert JSON\
    \ text into a JavaScript object. In our example, it will try to parse the text\
    \ \"json\" and throw an error. We will catch that exception and display an alert\
    \ with the details of that error.\n\nIf we run this script in an HTML page or\
    \ online JavaScript Editor, the result will be an alert box with the following\
    \ message:\n\nI have an error with the following details:\nSyntaxError: Unexpected\
    \ token j\n\nWe can browse the code via this public jsFiddle URL at http://jsfiddle.net/RamiSarieddine/mj6hs0xu/\n\
    \n## Chapter 4\n\nPromises, as we have seen so far, are either fulfilled or rejected\
    \ if an error occurs in the promise. When a promise is rejected, it is similar\
    \ to throwing an exception in synchronous code. A standard promise with a `then`\
    \ function takes the two parameters `onFulfilled` and `onRejected` as the following\
    \ code shows:\n\n```javascript\npromise.then(onFulfilled, onRejected)\n```\n\n\
    The `onRejected` parameter is a function that will act as an error handler, and\
    \ it will be called when the promise fails. When an error or exception happens\
    \ in a promise, it means that the promise was rejected, and the error raised will\
    \ be provided to the `onRejected` error handler. There are a couple of considerations\
    \ when we call `onRejected`, which can be summarized in the following list, assuming\
    \ a simple promise: `then(onFulfilled, onRejected)`\n\n- `onRejected` must be\
    \ called only after the promise has been rejected, with the rejection reason as\
    \ its first argument\n- `onRejected` must not be called more than once\n\nThe\
    \ second consideration is very straightforward. The `onRejected` function does\
    \ not get called multiple times on the same promise. The first consideration asserts\
    \ that `onRejected` will not be called if a promise was rejected.\n\nNevertheless,\
    \ rejections happen implicitly as well as in cases where an error is thrown in\
    \ the constructor callback of that promise. The following code sample illustrates:\n\
    \n```javascript\nvar promiseTest = new Promise(function (resolve) {\n  // JSON.parse\
    \ will throw an error because of invalid JSON\n  // so this directly rejects\n\
    \  resolve(JSON.parse(\"json\"));\n});\n\npromiseTest.then(function (data) {\n\
    \  alert(\"It worked!\" + data);\n}, function (error) { //error handler\n  alert(\"\
    I have failed: \" + error);\n});\n```\n\nIn the previous code, we define a new\
    \ promise `promiseTest` and upon its constructor callback call `JSON.parse()`,\
    \ we intentionally passed an invalid argument to cause an error. Now, this will\
    \ throw an error in the constructor, and it will indirectly cause a rejection\
    \ when we call the promise with a `then` method. If we have an `onFulfilled` handler,\
    \ we wouldn't have caught the error. The exception will be raised as an argument\
    \ in the rejection with its value error. We provided an error handler in the arguments\
    \ of `promiseTest.then()`; hence we can catch and handle the error.\n\nYou can\
    \ test this sample code via this public Fiddle at http://jsfiddle.net/RamiSarieddine/x2Latjg6.\n\
    \n> As errors do automatically bubble up and become rejections, it becomes quite\
    \ handy to process the promise-related jobs inside the promise constructor callback;\
    \ if any error arises there, it will be caught when the promise is called.\n\n\
    ### # Handling errors with promises\n\nAs we have seen, promises offer a richer\
    \ error handling mechanism in asynchronous programming. Although the Promises/A+\
    \ spec tackles only one method, that is `.then(onFulfilled, onRejected)`, and\
    \ does not provide any other, the specifications of `.then()` lay the foundation\
    \ for promise interoperability, and hence, extend the promise features, including\
    \ error handling.\n\nWe could consider several implementations for error handling\
    \ within JavaScript libraries that are compatible with Promises/A+. Some of these\
    \ extensions include the `catch()` method, which is implemented on the elementary\
    \ `then()` function. Anyone can author a `catch()` method and include it in their\
    \ scripts by extending the promise object as the following code:\n\n```javascript\n\
    Promise.prototype.catch = function(onRejected) {\n  return this.then(null, onRejected);\n\
    };\n```\n\nIn the previous code, we defined a method named `catch` that extends\
    \ the `then()` function. (Wait, the text says \"extends the promise object as\
