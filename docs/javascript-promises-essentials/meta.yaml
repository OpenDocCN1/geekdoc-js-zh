    # Summary


    Throughout the previous five chapters of this book, we have learned a great deal
    about promises. We started with asynchronous programming in JavaScript and took
    store of where promises stand amidst that, during which we discussed in detail
    why you should care about promises as now. Next, we dove deep into the Promises
    API and a thorough description of its then method. Following this, we learned
    the browsers that currently support promises and the libraries that implement
    the covering of promises and gave a detailed explanation of how we can achieve
    this as well as queue the asynchronous operations using promise chains. Our third
    stop was error handling, one of the most important aspects of the concept of promises.
    We stepped back and took a look at exceptions in JavaScript and how they are addressed
    in promises. We also learned about the catch method as part of handling errors
    with promises.


    Promises now have native support in JavaScript, and this is a focal time in the
