    var standardPromise = Promise.resolve(jQueryPromise);

    ```


    At the end of the day, the core goal of Promises/A+ is to provide the minimum,
    most simple specification that will allow reliable interoperation of different
    promise implementations, even in the face of hazards.


    > Just to erase any confusion that might come out, the promise resolution procedure
    is not exactly the same as the promise.resolve method that some implementations
    provide in their public API.


    In alignment with the core goal of the Promises/A+ standard, the Promises/A+ organization
    created a compliance test suite to test the compliance of a promise library or
    API implementation against the Promises/A+ specification. The compliance tests,
    which can be found at https://github.com/promises-aplus/promises-tests, are new
    intended to provide more concrete guidance and evidence for whether the implementations
    meet the requirements and conform to standards.


    ## Browser support and compatibility


    JavaScript is tightly coupled with browsers and the same applies to promises because
    promises are not a standard in the previous version of ECMAScript and will be
    part of the new ECMAScript 6 release; they won''t be supported across all the
    browsers. Moreover, promises can be implemented and we will witness several libraries
    offering promise-like features or exposing promise capabilities. In the remaining
    portion of this chapter, we will cover these two points that are essential when
    it comes to working with promises.


    ## The Promise API and Its Compatibility


    ### Checking the browser compatibility


    As with any client-side technology, JavaScript has expressly been developed for
    use in a web browser in conjunction with HTML pages. it uses the browser to do
    the job, which is why it is a scripting language. Once the script is sent to the
    browser, it is then up to the latter to do something with it. There is a heavy
    dependency there; thus, browser compatibility is vital.


    There are already implementations of promises in some browsers; at the time of
    writing this book, there is a small selection of browsers that support promises,
    as the following ECMAScript 6 compatibility table by Kangax:


    | Feature name | IE 10 | IE 11 | FF 24 | FF 25 | FF 27-28 | FF 29 | FF 30 | FF
    31 | CH 30 | CH 33 | CH 34 | CH 35 | SF 6 | SF 7 | WK | OP 12 | OP 15 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|

    | Promise | No | No | No | No | Yes | Yes | Yes | Yes | Yes | Yes | Yes | No |
    No | Yes | No | No |


    Source: http://kangax.github.io/compat-table/es6/#Promise


    > > The abbreviations in the compatibility table

    > IE stands for Internet Explorer, FF for Firefox, CH for Chrome, Safari for Webkit,
    and OP for Opera.


    As we can see in the previous table, the last three versions of Firefox, as of
    version 29, and Chrome, as of 32, enable promises by default. Worry not, for there
    is a polyfill to add the promises functionalities to browsers that do not support
    it.


    > > A polyfill is a new term coined by Remy Sharp and grew popular in the community
    of web developers. It represents a piece of code that delivers the technology
    and the behavior that we expect the browser to provide natively. We can think
    of it as a patch in terms of computing.


    This polyfill does the magic and provides us with the support for promises can
    be downloaded from this link: https://www.promisejs.org/polyfills/promise-4.0.0.js.
    it basically adds support for promises to browsers that don''t implement it natively.
    It can also be used to provide support for promises in Node.js. The following
    code sample shows how to include it in:


    ```

    <script src="https://www.promisejs.org/polyfills/promise-4.0.0.js"></script>

    ```


    ## Chapter 2


    We are showing the ECMAScript 6 compatibility table because promises are part
    of the ECMAScript 6 specification, which provides promises as a first-class language
    feature, and the implementation is based on the Promises/A+ proposal.


    ## Libraries with promise-like features


    The notion of promises is not very new to the world of web development and JavaScript.
    Developers may have met or used promises in JavaScript in a non-standardized manner
    through libraries. These libraries are implementations of the promise concept;
    some of them are adhering implementations and are starting to take on the promise
    pattern, while many are not. Moreover, some of these libraries do not conform
    to the Promises/A+ standard, which is a very important requirement when choosing
    what JavaScript libraries to use in our projects.


    ![](img/04c7981ae2601bc5401805f632a22d49_27_0.png)


    The following is a list of some libraries that are fully compliant with Promises/A+
    specs, and that I can thus unreservedly recommend:


    - **Q.js**: Developed by Kris Kowal and Domenic Denicola, it encompasses a full-featured
    promise library that includes adapters for Node.js and support for progress handlers.
    It can be downloaded from `https://github.com/kriskowal/q`.

    - **RSVP.js**: Developed by Yehuda Katz, it features a very small and lightweight
    promise library. It can be downloaded from `https://github.com/tildeio/rspv.js`.

    - **when.js**: Developed by Brian Cavalier, it offers an intermediary library
    and includes functions to manage collections of eventual operations. It also features
    functions that expose the progress and cancellation handlers of a promise. It
    can be downloaded from `https://github.com/cujojs/when`.


    In addition, we have `then (https://github.com/then)` that is a collection of
    libraries that are simple Promises/A+ implementations that meet the specification
    and extend it with some functionalities such as progress while a promise is fulfilled
    or rejected.


    ## The Promise API and Its Compatibility


    Also, the famous jQuery has an API they called Deferred — available at http://api.jquery.com/jquery.deferred/,
    which claims to be similar to a promise. jQuery''s deferred returned a new promise
    from then as the specification necessitates until version 1.8; hence, developers
    relying on jQuery were not getting the full capability and power of the promises
    pattern. Furthermore, a lot of code using this implementation doesn''t piece perfectly
    with other promise implementations that did actually adhere to the specification.
    Deferred are not Promise/A+-compliant, at least with the second part of the specification,
    which states that then returns a new promise object when executing one of the
    handlers. Hence, we cannot have function composition and chaining of the function
    and ultimately, error bubbling down to a broken chain, which are the two most
    important points in this specification. jQuery different and somewhat less useful.
    Nevertheless, if we need to use the promise object exposed by jQuery or any other
    library that does not conform for that matter, we can use one of the libraries
    listed earlier to convert non-conforming to a real promise. For example, using
    Q, we can have the following code that:


    ```

    var SpecPromise = Q.when($get("http://example.com/json"));

    ```


    Another example would be using the Promise polyfill library (https://www.promise.org/polyfills/promise-4.0.0.js)
    as the following code shows:


    ```

    var specPromise = Promise.resolve($.ajax(''http://example.com/json''));

    ```


    ## Summary


    As we have seen, the concept of promises is not very new and has been around in
    JavaScript with different implementations through libraries, it be standard-compliant
    or others. However, now, all these efforts have concluded in the Promises/A+ community
    specification that most libraries conform to. Thus, we have native support for
    promises in JavaScript via a standard Promise class that is included in the next
    version of ECMAScript ECMAScript 6, allowing web APIs to return promises for their
    asynchronous operations. Also, we covered the promise API and the then method
    in depth and learned about the current browser compatibility for the new standard.
    Finally, we briefly went some of the libraries that implement promises and are
    compliant with the Promises/A+ specification.


    In the next chapter, we will go over chaining of promises and how to achieve it
    using the then method to enable multiple asynchronous actions.

