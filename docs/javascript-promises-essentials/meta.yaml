- md: "\n# Chapter 2\n\n- Both handlers onFulfilled and onRejected that must be called\
    \ asynchronously.\n- Both handlers onFulfilled and onRejected that must be called\
    \ functions.\n\nImplementations are built by the exact ordering of calls to the\
    \ handlers onFulfilled and onRejected in case of consequent calls to the then\
    \ method on the same promise. In a more spoken language, this means that, if the\
    \ then method is called more than once on the same promise as promise.then().then(),\
    \ all the onFulfilled handlers used in these then calls must execute in the order\
    \ of the originating calls to then. Hence, the onFulfilled callback in the first\
    \ then function will execute first, followed by the onFulfilled callback in the\
    \ second then, and so on. The thing applies to the execution of the onRejected\
    \ callbacks in such a scenario. Was it very complex? Maybe the following example\
    \ can explain it:\n\n```javascript\nvar p = [[promise]];\np.then();\np.then();\n\
    ```\n\nThe preceding code is not the same as the following line of code:\n`promise.then().then();`\n\
    \nThe difference is that promise.then() might return a different promise.\n\n\
    Lastly, the level of classifications, the Promises/A+ proposal offers different\
    \ naming from Promises/A, because the authors of the new specifications wanted\
    \ to reflect the vocabulary that has spread across many promise implementations.\
    \ The changes include the following:\n\n- The promise states are referred to as\
    \ pending, fulfilled, and rejected, replacing unfilled, fulfilled, and failed\n\
    - When a promise is fulfilled, the promise has a value; similarly, when a promise\
    \ is rejected, it has a reason\n\nThe then method is the main player in the API.\
    \ An object is not considered a promise if it does not have the then method to\
    \ retrieve and access its current or eventual value or reason, as we saw in the\
    \ previous chapter. This method takes two arguments that need to be a function,\
    \ as in the following example shows:\n\n```javascript\npromise.then(onFulfilled,\
    \ onRejected);\n```\n\nLet's dive deep into the details of then and the specs\
    \ of its arguments, taking into consideration the previous code sample of a simple\
    \ then method:\n\n- Both the arguments, onFulfilled and onRejected, are optional.\n\
    - Both the arguments must be a function; otherwise, it must be ignored.\n\n# The\
    \ Promise API and Its Compatibility\n\n- Both arguments must not be called more\
    \ than once within the same call.\n- The onFulfilled argument must be called only\
    \ after a promise is fulfilled, with the value of the promise as its first argument.\n\
    - The onRejected argument must be called after the promise is rejected, with the\
    \ reason of promise rejection as its first argument.\n- The onFulfilled and onRejected\
    \ arguments must not be passed as a this value, if you apply the strict mode to\
    \ the JavaScript code, this will be treated as undefined in the handlers; in the\
    \ quirks mode, it will be treated as the global object in JavaScript code.\n-\
    \ The then method can be called more than once on the same promise.\n- When a\
    \ promise is fulfilled, all the onFulfilled handlers must be executed in the same\
    \ order as their originating calls to then. The same rule applies for the onRejected\
    \ callbacks.\n- The then method must return a promise as follows:\n  `promiseReturned\
    \ = promise.then(onFulfilled, onRejected);`\n- If either onFulfilled or onRejected\
    \ returns a value x, the promise resolution procedure must be called to resolve\
    \ the value x, as the following code shows:\n  `promiseReturned = promise.then(onFulfilled,\
    \ onRejected); [Resolve](promiseReturned, x).`\n- If either the onFulfilled or\
    \ onRejected handler throws an exception e, promiseReturned must be rejected with\
    \ e as the reason of rejection or failure.\n- If onFulfilled is not a function\
    \ and the promise is fulfilled, promiseReturned must be fulfilled with the same\
    \ value.\n- If onRejected is not a function and the promise is rejected, promiseReturned\
    \ must be rejected with the same reason.\n\nThe previous list was a detailed specification\
    \ of the promise and then method defined and specified in the Promises/A+ standard.\
    \ We talked about the promise resolution procedure in the previous list, but we\
    \ don't know what it is. Well, the promise resolution procedure is basically an\
    \ abstract operation that takes a promise and a value as argument, and is indicated\
    \ as follows:\n\n```\n[[Resolve](promise, x)]\n```\n\nIf x is thenable, meaning\
    \ that it is an object or function that defines a then method, the resolve method\
    \ will force a promise to assume the state of x, under the assumption that x behaves\
    \ at least somewhat like a promise. Otherwise, it will fulfill the promise with\
    \ the value x.\n\n# Chapter 2\n\nThe technique that promise resolution procedure\
    \ uses to handle thenables allows implementations to work reliably with one another,\
    \ as long as promise exposes a then method that is Promises/A+-compliant. Additionally,\
    \ it also allows implementations to integrate non-standard implementations with\
    \ reasonable then methods.\n\n> The Promise Resolution Procedure (PRP) is not\
    \ a public API. It is intended to describe an important, yet abstract and internal/private\
    \ procedure, where \"procedure\" here simply means \"algorithm\" rather than a\
    \ concrete JavaScript function. A particular promise implementation may implement\
    \ however it feels best.\n> - Brian Cavalier, co-editor at Promises/A+ explains\n\
    \nThe promise resolution procedure allows us to have a correct implementation\
    \ of promise.resolve. It is also necessary to guarantee a correct implementation\
    \ of then. You might notice that there is no return value for the promise resolution\
    \ procedure because it is an abstract procedure that may be implemented in any\
    \ way the author of particular promise implementation sees. Here, the result is\
    \ left to the implement as long as it achieves the goal, which is to put the promise\
    \ into the same state as x. So, conceptually, it affects a state transition on\
    \ the promise.\n\nAlthough the implementation of promise procedure is left to\
    \ the implement, it has some rules of its own that we should abide by. These rules\
    \ are as follows:\n\n1. If x is thenable, meaning that it is an object or function\
    \ that defines a then method, the resolve method will force a promise to assume\
    \ the state of x, under the assumption that x behaves at least somewhat like a\
    \ promise. Otherwise, it will fulfill the promise with the value x.\n2. If x is\
    \ a promise, the promise must remain in the pending state until it is fulfilled\
    \ or rejected:\n   - If/x is fulfilled, the promise should be fulfilled with the\
    \ same value\n   - If/x is rejected, the promise should be rejected with the same\
    \ reason\n3. If x is an object or function, and not a promise, then the implementation\
    \ should call x.then.\n\n# The Promise API And Its Compatibility\n\n- If retrieving\
    \ the x.then property ends up with throwing an exception, the promise should be\
    \ rejected with e as the reason.\n- If then is a function, call it with the value\
    \ of this. The first argument should be resolvePromise and the second argument\
    \ should be rejectPromise.\n- If then does not qualify as a function, directly\
    \ fulfill the promise with x.\n- 4. If x is neither object nor function, the promise\
    \ should be fulfilled with x.\n\nLet's have a look at the third rule. We saw that,\
    \ if then is the function, the first argument should be resolvePromise and the\
    \ second argument should be rejectPromise where the following rules apply:\n\n\
    1. If/when resolvePromise is called with a value z, the implementation must run\
    \ [Resolve](promise, z).\n2. If/when rejectPromise is called with a reason j,\
    \ the implementation must reject the promise with reason j.\n3. If both handlers\
    \ resolvePromise and rejectPromise are called, or in the case of multiple calls\
    \ to the same argument, the first call should take precedence, and any other subsequent\
    \ calls are ignored.\n4. If calling then results in throwing an exception e, we\
    \ have two conditions:\n   - If the resolvePromise or rejectPromise handlers have\
    \ already been called, we should ignore then\n   - If not, the implementation\
    \ should reject the promise with e as the reason returned.\n"
