  md: "```\nchangeState: function(newState, newValue) {\n\n// check if we are changing\
    \ to same state and report it\nif (this.myState == newState) {\n    throw new\
    \ Error(\"Sorry, But you can't do this to me! You are\ntransitioning to same state:\
    \ \" + newState);\n}\n\n// trying to get out of the fulfilled or rejected states\n\
    if ( this.myState == promState.fulfilled ||\n    this.myState == promState.rejected\
    \ ) {\n    throw new Error(\"You can't leave this state now: \" + \n    this.myState);\n\
    }\n// if promise is rejected with a null reason\nif ( newState == promState.rejected\
    \ &&\n    newValue === null) {\n    throw new Error(\"If you get rejected there\
    \ must be a reason.\n    can't be null!\");\n}\n\n// if there was no value passed\
    \ with fulfilled\nif (newState == promState.fulfilled &&\n    arguments.length\
    \ < 2 ) {\n    throw new Error(\"I am sorry but you must have a non-null value\
    \ to\n    proceed to fulfilled!\");\n}\n\n// we passed all the conditions, we\
    \ can now change the state\nthis.myState = newState;\nthis.value = newValue;\n\
    return this.myState;\n}\n```\n\nThe code inside the object will first set a property\
    \ named myState to the pending value of the enumeration promState with myState:\
    \ promState.pending. Afterwards, we set a property named changeState to an anonymous\
    \ function that takes two arguments: newState and value. Within that function,\
    \ we handle the transitions of states and check if it adheres to the rules. We\
    \ have four checkpoints before we proceed with the code:\n\n+   1. First, we check\
    \ whether we are transitioning to the same state and throw\nan error.\n\n+   2.\
    \ In the second check, we make sure that the promise is not trying to transition\n\
    from rejected or fulfilled and throws an error accordingly."
