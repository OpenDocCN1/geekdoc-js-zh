    \ because functions are first-class objects. This function is a callback. Callback\
    \ functions are super important and widely spread in JavaScript programming us\
    \ the ability to do things asynchronously.\n\nPassing a callback function as a\
    \ parameter to another function is only passing the function definition. Hence,\
    \ the function is not executed immediately in the parameter; it is called back\
    \ (hence the name) at some specified point inside the container function's body.\
    \ This is very useful for scripts that take some time to complete actions such\
    \ as making an AJAX request to the server or performing some IO activity without\
    \ holding up the browser along the way.\n"
  mdcn: "\n\n# JavaScript Promises – 我为什么需要关注它？\n\nJavaScript 的流行程度从未像现在这样。这种曾经（也许对某些人来说现在依然如此）由于其名称而最受误解的编程语言，现在已处于最流行编程语言的前列。此外，世界上几乎每台个人电脑都至少在使用或安装了一个\
    \ JavaScript 解释器。JavaScript 流行程度的不断增加完全归功于它作为 Web 脚本语言的角色。它在这一领域的成功——JavaScript\
    \ 设计用于在 Netscape Navigator 中运行——使其成为几乎所有浏览器的标准配置，但 JavaScript 已经成长并成熟，现在已扩展到许多与\
    \ Web 无关的领域。在第一章中，我们将简要介绍以下内容：\n\n- JavaScript 中的异步编程\n- 开发者在处理异步操作的传统方法中面临的问题\n\
    - JavaScript Promises 简介\n- 为什么在与常见的异步处理方式进行比较时，我们应该关注 Promise\n\n## JavaScript\
    \ 中的异步编程\n\n谈到 JavaScript 中的异步编程时，有两点需要讨论：Web 和编程语言。浏览器代表的 Web 环境与桌面环境不同，这反映在我们在为每个环境编写程序和代码的方式上。与桌面环境相反，浏览器为所有需要访问用户界面的操作（在\
    \ HTML 术语中是 DOM）提供单线程。这种单线程模型对可能访问和修改 UI 元素的应用代码产生了负面影响，因为它将代码的执行限制在同一个线程中。因此，我们会有阻塞函数和线程，它们基本上会阻塞\
    \ UI 直到该线程执行完毕。这就是为什么在 Web 开发中，充分利用器的任何异步能力是至关重要的。\n\n让我们回顾一下历史以获取更多背景。过去，网站由\
    \ HTML 页面组成，每个用户都需要从服务器加载整个网页。这给开发者带来了很多问题，特别是当编写编写会影响页面的服务器端代码时。此外，它还导致了糟糕的用户体验。对用户操作或\
    \ HTML 表单更改的响应是通过向表单所在的页面发送 HTTP POST 请求完成的；这导致服务器使用刚刚收到的信息刷新页面。这整个过程和模型都是低效的，因为在缓慢的互联网环境下，这会导致页面的所有内容丢失。浏览器随后重新加载网页并重新发送所有内容，即使只有部分信息发生了变化；这消耗了过多的带宽并给服务器增加了额外负载。后来，在行业内不同方的大量努力下，异步\
    \ Web 技术开始出现，以帮助解决这一局限性。该领域的一个著名成员是异步 JavaScript 和 XML (AJAX)，这是一组在客户端用于创建异步方式通信的\
    \ Web 应用的技术。AJAX 技术允许 Web 应用以异步方式从服务器发送数据和检索数据，而不会干扰当前页面的 UI 和行为；基本上不需要重新加载整个页面。实现这一点的核心\
    \ API 是 `XMLHttpRequest` API。\n\n随着 Web 技术和浏览器的进步，JavaScript 作为 Web 脚本语言变得更加突出，它允许开发者访问\
    \ DOM 并动态地显示以及与网页上呈现的内容进行交互。然而，JavaScript 本质上也是单线程的，这意味着在任何给定时刻，两行脚本不能同时运行；相反，JavaScript\
    \ 语句是按行执行的。同样，在浏览器中，JavaScript 与浏览器执行的一系列其他工作负载共享一个线程，从绘制和更新样式到处理用户操作。其中一个活动将决定执行顺序。\n\
    \n当 JavaScript 起初开始时，它旨在编写简短、快速运行的代码。主要的应用程序逻辑和计算都在服务器端完成。自从 Web 加载内容的方式从重新加载整个页面变为客户端加载后，异步开发者极度依赖\
    \ JavaScript 进行 Web 开发。现在，我们可以看到用 JavaScript 编写完整的应用程序逻辑，并且许多库蓬勃发展以帮助开发者完成工作。\n\
    \n在 Web 开发中，我们有三个主要组件：\n\n- HTML 和 CSS\n- 文对象模型 (DOM)\n- JavaScript\n\n还有一个在 AJAX\
    \ 中起关键作用的组件：\n\n- XMLHttpRequest API\n\n简而言之，HTML 和 CSS 用于网页的呈现和布局。DOM 用于动态显示和交互。XHR\
    \ 用于向服务器发送 HTTP/HTTPS 请求并将数据传回脚本。最后，JavaScript 允许将这些技术结合在一起，以创建美观、响应式的 Web 应用。\n\
    \n为了解决多线程的局限性，开发者严重依赖事件和回调，因为这是应用程序暴露异步编程的方式。在基于事件的 API 中，处理程序被注册到指定的对象，并在事件触发时调用。浏览器通常会在不同的线程中执行操作，并在适当的情况下在主线程中调用。\n\
    \n## JavaScript Promises – 我为什么关注它？\n\n可以使用 `addEventListener()` 方法来实现这种基于事件的技术。该方法简单地在其调的对象上注册一个监听器。事件目标对象可以是\
    \ HTML 中的一个元素、文档本身或任何其他支持事件的对象（如 XHR）。下面的代码展示了使用 HTML 和 JavaScript 的简单事件监听器。\n\
    \nHTML 部分如下：\n\n```\n<div id='testDiv' style=\"width:100px; height:100px; background-color:red\"\
    ></div>\n```\n\nJavaScript 部分如下：\n\n```javascript\nvar testDiv = document.getElementById(\"\
    testDiv\");\ntestDiv.addEventListener(\"click\", function() {\n  // 所以 testDiv\
    \ 对象被点击了，现在我们可以做一些事情\n  alert(\"我在这里！\");\n});\n```\n\n在 HTML 部分，我们在 DOM 中定义了一个带有\
    \ `testDiv` ID 的 div 元素。在 JavaScript 部分，我们在第一行代码中获取该 div 元素并赋值给变量。然后，我们在它上添加事件监听器，并将其传递给点击事件，随后跟一个匿名函数（没有名字函数）作为监听函数。该函数将在稍后元素被点击时被调用。\n\
    \n> 如果你在 HTML 标记包含 div 元素之前添加这段 JavaScript 代码，它将报错。因为在代码执行时元素尚未创建，代码将找不到可以调用 `addEventListener`\
    \ 的目标对象。\n\n"
