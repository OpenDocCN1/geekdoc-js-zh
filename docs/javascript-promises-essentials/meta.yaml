  md: '# Why should I care about promises?


    What do promises have to do with all of this? Well, let''s start by defining promises.


    A promise represents the eventual result of an asynchronous operation.


    -Promises/A+ specification, http://promisesplus.com/


    So, a promise object represents a value that may not be available yet, but will
    be resolved at some point in the future.


    Promises have states and at any point in time, can be one of the following:


    +   * **Pending**: The promise''s value is not yet determined and its state transition
    to either fulfilled or rejected.

    * **Fulfilled**: The promise was fulfilled with success and now has a value that
    must not change. Additionally, it must not transition to any other state from
    the fulfilled state.

    * **Rejected**: The promise is returned from a failed operation and must have
    a reason for failure. This reason must not change and the promise must not transition
    to any other state from this state.


    A promise may only move from the pending state to the fulfilled state or from
    the pending state to the rejected state. However, once a promise is fulfilled
    or rejected, it must not transition to any other state and its value cannot change
    because it is immutable.


    > The immutable characteristic of promises is super important. It helps avoid
    undesired side effects from listeners, which can cause unexpected changes in behavior,
    and in turn promises to be passed to other functions without affecting the caller
    function.


    From an API perspective, a promise is defined as an object that has a function
    as the value for the property. The promise object has a primary then method that
    returns a new object. Its syntax will look like this:


    ```

    then(onFulfilled, onRejected);

    ```


    The following two arguments are basically callback functions that will be called
    for completion of a promise:


    +   * **onFulfilled**: This argument is called when a promise is fulfilled

    * **onRejected**: This argument is called when a promise has failed'
