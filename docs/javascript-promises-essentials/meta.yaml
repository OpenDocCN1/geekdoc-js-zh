- md: "\n## Putting It Together – Promises in Action\n\nIn Chapter 5, Promises in\
    \ WinJS, we were introduced to the WinJS library and learned about the WinJS promise\
    \ object in detail. We also had a quick glance at how to use WinJS promises in\
    \ windows app development in a basic example. Finally, we are here in the last\
    \ chapter, in which we will put into action the learning we have gathered throughout\
    \ this book about promises. We will try to get a deeper understanding of how promises\
    \ work by creating a simple implementation. After we create the implementation\
    \ library, we will use it in a basic example that leverages library for an asynchronous\
    \ operation. In this chapter, we will cover the following topics:\n\n- Summary\
    \ of what we have covered and learned so far own- Creating a promise implementation\
    \ in a simple JavaScript\n\n## Implementing a promise library\n\nPromises have\
    \ grown to be very popular as expressed by the numerous standalone implementations\
    \ of them. Moreover, Promises/A+ have more than 35 compliant implementations so\
    \ far as we approach the launch of ECMAScript 6. One thing to note is that the\
    \ growing adoption of Promise/A+ in JavaScript is reflected in other languages,\
    \ with a number of implementations in ActionScript, Python, and Objective C. Although,\
    \ in terms of semantics, these implementations might not necessarily match the\
    \ ones we have in the JavaScript specifications due to different language capabilities,\
    \ it ultimately can be verified for compliance by directly testing them against\
    \ the JavaScript test suite of Promise/A+. Nevertheless, it's worth mentioning\
    \ the implementations and showcasing the efforts taken.\n\n## Putting It All Together\
    \ – Promises in Action\n\nLet us go through a code example for a basic implementation\
    \ of promises; this will give us a better understanding of how promises work.\
    \ A deep understanding of how things work improves our ability to take advantage\
    \ of code and debug it more easily and quickly when it goes wrong. We will create\
    \ a minimal JavaScript library that implements promises, and will start coding\
    \ that library with the states of the promises. We learned, when exploring the\
    \ Promise API in Chapter 2, The Promise API and Its Compatibility, promises have\
    \ three different states: pending, fulfilled, and rejected.\n\nThe specification\
    \ of promises does not specify a value for their states, so let us declare and\
    \ assign the value to an enumerator, as the following code shows:\n\n```\nvar\
    \ promState = {\n  pending: 1,\n  fulfilled: 2,\n  rejected: 3\n}\n```\n\nThis\
    \ enumeration will allow us to call the state by name, for example promState.fulfilled.\
    \ Next, we will create an object that holds all the promise logic from transition\
    \ between states to the then method and resolves the promise. We will call this\
    \ object PromiseMe.\n\nFirst, we will need to define the change in the promise's\
    \ states and its transition from one to the other. The specification dictates\
    \ some rules and considerations for the transitions between the states, which\
    \ we have dove into detail in Chapter 2, The Promise API and Its Compatibility.\
    \ These rules can be summarized as follows:\n\n- A promise can only be in one\
    \ state at a certain point of time\n- When a promise transitions from pending\
    \ to any other state, either fulfilled or rejected, it cannot go back\n- When\
    \ a promise fulfills, it must have a value (it can even be undefined) and, when\
    \ it fails, it must have a reason (any value that specifies the promise was rejected)\n\
    \nInside the PromiseMe object, we will first define a function titled changeMyState\
    \ that handles and manages the transition between states for this promise governed\
    \ by the preceding code shows:\n\n```\nvar PromiseMe = {\n  //set default state\n\
    \  myState: promState.pending,\n  changeState: function(newState, newValue) {\n\
    \n    // check if we are changing to same state and report it\n    if (this.myState\
    \ == newState) {\n      throw new Error(\"Sorry, But you can't do this to me!\
    \ You are transitioning to same state: \" + newState);\n    }\n\n    // trying\
    \ to get out of the fulfilled or rejected states\n    if (this.myState == promState.fulfilled\
    \ ||\n        this.myState == promState.rejected) {\n      throw new Error(\"\
    You can't leave this state now: \" + this.myState);\n    }\n    // if promise\
    \ is rejected with a null reason\n    if (newState == promState.rejected &&\n\
    \        newValue === null) {\n      throw new Error(\"If you get rejected there\
    \ must be a reason. can't be null!\");\n    }\n\n    // if there was no value\
    \ passed with fulfilled\n    if (newState == promState.fulfilled &&\n        arguments.length\
    \ < 2) {\n      throw new Error(\"I am sorry but you must have a non-null value\
    \ to proceed to fulfilled!\");\n    }\n\n    // we passed all the conditions,\
    \ we can now change the state\n    this.myState = newState;\n    this.value =\
    \ newValue;\n    return this.myState;\n  }\n};\n```\n\nThe code inside the object\
    \ will first set a property named myState to the pending value of the enumeration\
    \ promState with myState: promState.pending. Afterwards, we set a property named\
    \ changeState to an anonymous function that takes two arguments: newState and\
    \ value. Within that function, we handle the transitions of states and check if\
    \ it adheres to the rules. We have four checkpoints before we proceed with the\
    \ code:\n\n- 1. First, we check whether we are transitioning to the same state\
    \ and throw an error.\n- 2. In the second check, we make sure that the promise\
    \ is not trying to transition from rejected or fulfilled and throws an error accordingly.\n\
    - 3. The third check is for the value passed with rejected. If it is null, an\
    \ error will be thrown and this makes sure that the promise gets rejected with\
    \ a value other than one null.\n- 4. The final check: we ensure that for fulfilled\
    \ state, a non-null value is provided.\n\n## Implementing the then method\n\n\
    What next in our implementation is the then method. This is the main pillar of\
    \ promises and it is what makes them useful. Let us define the then method as\
    \ the following:\n\n```\nthen: function (onFulfilled, onRejected) {\n  // define\
    \ an array\n  this.handlers = this.handlers || [];\n  // create a promise\n  var\
    \ returnedPromise = Object.create(Promise);\n\n  this.handlers.push({\n    fulfillPromise:\
    \ onFulfilled,\n    rejectPromise: onRejected,\n    promise: returnedPromise\n\
    \  });\n\n  return returnedPromise;\n}\n```\n\nYou might have noticed that the\
    \ handlers array contains two properties: fulfillPromise and rejectPromise. These\
    \ are two functions that are set to the handlers that are passed in arguments\
    \ of the then method. Let us define these two functions so that we can use them\
    \ in the resolve method. These functions are helper methods and simply allow us\
    \ to manually change the state of a promise.\n\n```javascript\nfulfillPromise:\
    \ function (value) {\n  //change state to fulfilled and return a promise with\
    \ a value\n  this.changeState(promState.fulfilled, value);\n}\nrejectPromise:\
    \ function (reason) {\n  //change state to rejected and return a promise rejected\
    \ with a reason\n  this.changeState(promState.rejected, reason);\n}\n```\n\n##\
    \ Defining a resolve method\n\nMoving forward, we need to address resolving that\
    \ promise. We need to define a resolve method that will deal with the promise\
    \ and either will fulfill or reject it, depending on the state of the promise.\
    \ You can think of the resolve method as an internal method that the promise calls\
    \ and is aimed at executing the then calls only when the promise is fulfilled.\
    \ Actually, the function that you will need to call in order to fulfill a promise\
    \ or reject it would be changeMyState in our case here. Let's start by creating\
    \ a basic logic for the resolve method as per the following code:\n\n```javascript\n\
    resolve: function () {\n  // check for pending and exist\n```\n"
  mdcn: "\n\n## 整合应用 – 实战中的 Promises\n\n在第 5 章“WinJS 中的 Promises”中，我们学习了 WinJS 库并详细了解了\
