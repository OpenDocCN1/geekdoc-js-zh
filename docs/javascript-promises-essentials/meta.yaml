  md: '# Chapter 2


    We are showing the ECMAScript 6 compatibility table because promises are part
    of the ECMAScript 6 specification, which provides promises as a first-class language
    feature, and the implementation is based on the Promises/A+ proposal.


    # Libraries with promise-like features


    The notion of promises is not very new to the world of web development and JavaScript.
    Developers may have met or used promises in JavaScript in a non-standardized manner
    through libraries. These libraries are implementations of the promise concept;
    some of them are adhering implementations and are starting to take on the promise
    pattern, while many are not. Moreover, some of these libraries do not conform
    to the Promises/A+ standard, which is a very important requirement when choosing
    what JavaScript libraries to use in our projects.


    ![](img/04c7981ae2601bc5401805f632a22d49_27_0.png)


    The following is a list of some libraries that are fully compliant with Promises/A+
    specs, and that I can thus unreservedly recommend:


    +   * **Q.js**: Developed by Kris Kowal and Domenic Denicola, it encompasses a
    full-featured promise library that includes adapters for Node.js and support for
    progress handlers. It can be downloaded from `https://github.com/kriskowal/q`.


    +   * **RSVP.js**: Developed by Yehuda Katz, it features a very small and lightweight
    promise library. It can be downloaded from `https://github.com/tildeio/rspv.js`.


    +   *when.js**: Developed by Brian Cavalier, it offers an intermediary library
    and includes functions to manage collections of eventual operations. It also features
    functions that expose the progress and cancellation handlers of a promise. It
    can be downloaded from `https://github.com/cujojs/when`.


    In addition, we have `then (https://github.com/then)` that is a collection of
    libraries that are simple Promises/A+ implementations that meet the specification
    and extend it with some functionalities such as progress while a promise is fulfilled
    or rejected.


    [ 25 ]'
