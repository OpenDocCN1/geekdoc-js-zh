    \ promises 的知识付诸实践。我们将尝试通过创建一个简单的实现来更深入地理解 promises 的工作原理。在创建实现库之后，我们将在一个基础示例中利用该库来执行异步操作。在本章中，我们将涵盖以下主题：\n\
    \n- 对到目前为止涵盖和学习的内容总结 - 在简单的 JavaScript 中创建一个 promise 实现\n\n## 实现一个 promise 库\n\
    \nPromises 已经变得非常流行，从许多独立的实现中可以看出。此外，随着我们接近 ECMAScript 6 的发布，Promises/A+ 已经有超过\
    \ 35 种符合规范的实现。需要注意的是，Promise/A+ 在 JavaScript 中日益增长的应用也反映在其他语言中，在 ActionScript、Python\
    \ 和 Objective C 中都有许多实现。尽管在语义方面，由于语言能力的差异，这些实现可能不一定与 JavaScript 规范中的实现匹配，但最终可以通过直接测试\
    \ Promise/A+ 的 JavaScript 测试套件来验证其合规性。尽管如此，值得提到这些实现并展示所付出的努力。\n\n## 整合应用 – 实战中的\
    \ Promises\n\n让我们通过一个 promises 的基础实现代码示例；这将有助于我们更好地理解 promises 的工作原理。深入理解其运作方式可以提高我们利用代码的能力，并在代码出错时更容易、更快速地进行调试。我们将创建一个实现\
    \ promises 的极简 JavaScript 库，并从 promise 的状态开始编写该库的代码。当我们在第 2 章“Promise API 及其兼容性”中探索\
    \ Promise API 时，我们学到 promises 有三种不同的状态：pending（等待中）、fulfilled（已完成）和 rejected（已拒绝）。\n\
    \npromises 的规范没有为它们的状态指定值，因此让我们像下面的代码所示声明并为枚举器分配值：\n\n```\nvar promState = {\n\
    \  pending: 1,\n  fulfilled: 2,\n  rejected: 3\n}\n```\n\n这个枚举允许我们通过名称调用状态，例如\
    \ `promState.fulfilled`。接下来，我们将创建一个对象，包含所有 promise 逻辑，从从状态之间的转换到 `then` 方法以及解析\
    \ promise。我们将此对象命名为 `PromiseMe`。\n\n首先，我们需要定义 状态的变化及其从一个状态到另一个状态的转换。规范对状态之间的转换规定了一些规则和考虑，我们已经在第\
    \ 2 章“Promise API 及其兼容性”中详细探讨了。这些规则可以总结如下：\n\n- 一个 promise 在某一时刻只能处于一种状态\n- 当\
    \ promise 从 pending 转换到任何其他状态（fulfilled 或 rejected）时，它不能回回\n- 当 promise 成功时，它必须有一个值（即使可以是\
    \ undefined），当它失败时，它必须有一个理由（任何指定 promise 被拒绝的值）\n\n在 `PromiseMe` 对象内部，我们首先将定义一个名为\
    \ `changeMyState` 的函数，用于处理和管理由上述代码控制的此 promise 状态之间的转换，如下：\n\n```\nvar PromiseMe\
    \ = {\n  //设置默认状态\n  myState: promState.pending,\n  changeState: function(newState,\
    \ newValue) {\n\n    // 检查是否切换到相同状态并报告\n    if (this.myState == newState) {\n\
    \      throw new Error(\"Sorry, But you can't do this to me! You are transitioning\
    \ to same state: \" + newState);\n    }\n\n    // 尝试跳出 fulfilled 或 rejected 状态\n\
    \    if (this.myState == promState.fulfilled ||\n        this.myState == promState.rejected)\
    \ {\n      throw new Error(\"You can't leave this state now: \" + this.myState);\n\
    \    }\n    // 如果 promise 因空原因被拒绝\n    if (newState == promState.rejected &&\n\
    \        newValue === null) {\n      throw new Error(\"If you get rejected there\
    \ must be a reason. can't be null!\");\n    }\n\n    // 如果 fulfilled 时没有传递任何值\n\
    \    if (newState == promState.fulfilled &&\n        arguments.length < 2) {\n\
    \      throw new Error(\"I am sorry but you must have a non-null value to proceed\
    \ to fulfilled!\");\n    }\n\n    // 我们通过了所有条件，现在可以更改状态\n    this.myState = newState;\n\
    \    this.value = newValue;\n    return this.myState;\n  }\n};\n```\n\n对象内部的代码首先会通过\
    \ `myState: promState.pending` 将名为 `myState` 的属性设置为枚举 `promState` 的 `pending`\
    \ 值。之后，我们将名为 `changeState` 的属性设置为一个接收两个参数（`newState` 和 `value`）的匿名函数。在该函数内部，我们处理状态转换并检查它是否符合规则。在继续执行代码之前，我们有四个检查点：\n\
    \n- 1. 首先，我们检查是否正在转换到相同状态并抛出错误。\n- 2. 在第二次检查中，我们确保 promise 不尝试从 rejected 或 fulfilled\
    \ 状态转换，并相应抛出错误。\n- 3. 第三次检查是针对拒绝时传递的值。如果是 null，将抛出错误，这确保了 promise 被除 null 以外的值拒绝。\n\
    - 4. 最后一次检查：我们确保对于 fulfilled 状态，提供了一个非空值。\n\n## 实现 then 方法\n\n我们实现中的下一步是 `then`\
    \ 方法。这是 promises 的核心支柱，也是它们变得实用的原因。让我们如下所示定义 `then` 方法：\n\n```\nthen: function\
    \ (onFulfilled, onRejected) {\n  // 定义一个数组\n  this.handlers = this.handlers ||\
