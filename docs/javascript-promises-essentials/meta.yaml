  md: '# Putting It Together – Promises in Action


    In Chapter 5, Promises in WinJS, we were introduced to the WinJS library and learned
    about the WinJS promise object in detail. We also had a quick glance at how to
    use WinJS promises in windows app development in a basic example. Finally, we
    are here in the last chapter, in which we will put into action the learning we
    have gathered throughout this book about promises. We will try to get a deeper
    understanding of how promises work by creating a simple implementation. After
    we create the implementation library, we will use it in a basic example that leverages
    library for an asynchronous operation. In this chapter, we will cover the following
    topics:


    +   - Summary of what we have covered and learned so far

    - Creating a promise implementation in a simple JavaScript


    # Implementing a promise library


    Promises have grown to be very popular as expressed by the numerous standalone
    implementations of them. Moreover, Promises/A+ have more than 35 compliant implementations
    so far as we approach the launch of ECMAScript 6. One thing to note is that the
    growing adoption of Promise/ A+ in JavaScript is reflected in other languages,
    with a number of implementations in ActionScript, Python, and Objective C. Although,
    in terms of semantics, these implementations might not necessarily match the ones
    we have in the JavaScript specifications due to different language capabilities,
    it ultimately can verified for compliance by directly testing them against the
    JavaScript test suite of Promise/A+. Nevertheless, it''s worth mentioning the
    implementations and showcasing the efforts taken.'
