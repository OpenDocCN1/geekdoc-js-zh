    \ the operation as an argument.\n\n- errorDispatch: This parameter will be invoked\
    \ when an error occurs in that operation and, the promise acquires an error state.\
    \ Since it is an error, the argument to errorDispatch should be an instance of\
    \ WinJS.Promise.ErrorFromName.\n\n- progressDispatch: This parameter will be invoked,\
    \ periodically, while the operation is being processed. The function will contain\
    \ an intermediate result. This parameter is used if the operation within the promise\
    \ needs to support progress.\n\nThe onCancel parameter is the second parameter\
    \ to the Promise constructor. This function can be used by the consumer of the\
    \ promise to cancel any of its uncompleted work. However, promises are not obliged\
    \ to provide or support cancellation in WinJS.\n\n## Events\n\nNext on the list\
    \ of promise object member types, we have Events. Currently, the Promise object\
    \ has a single event called onerror. As the name shows, this event happens when\
    \ an error occurs during the processing of a promise. Furthermore, this onerror\
