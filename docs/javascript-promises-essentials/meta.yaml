    \ threaded model has a negative impact on the application code that might need\
    \ to access and modify the UI elements, because it restricts the execution of\
    \ code to the same thread. Hence, we will have blocking functions and threads\
    \ that basically block the UI until that thread has been executed. That is why,\
    \ in web development, it is highly important to take advantage of any asynchronous\
    \ capabilities the browser.\n\nLet's review some history to get more context.\
    \ In the day, websites comprised HTML pages in which every user needed the entire\
    \ web page to be loaded from the server. This caused a lot of problems for developers,\
    \ especially when writing a server-side code that would affect the page. Furthermore,\
    \ it resulted in an unpleasant end user experience. Responding to a user action\
    \ or changes to an HTML form was carried on with an HTTP POST request to the page\
    \ that the form was on; this caused the server to refresh the page using the information\
    \ it had just received. This entire process and model were inefficient as it resulted\
    \ in having the entire content of the page get lost away in a slow internet environment.\
    \ The browser then reloaded a web page resending all of the content even though\
    \ only some of the information had changed; this used excessive bandwidth and\
    \ resulted in additional load on the server. Later, with much work and effort\
    \ from different parties in the industry, asynchronous web technologies started\
    \ emerging to help address this limitation. A famous player in this area is Asynchronous\
    \ JavaScript and XML (AJAX), which is a group of technologies used on the client-side\
    \ to create web applications that communicate in an asynchronous manner. The AJAX\
    \ technology allowed web applications to send data and retrieve data from a server\
    \ in an asynchronous manner without interfering with the UI and behavior of the\
    \ current page; basically, without the need to reload the whole page. The core\
    \ API to achieve this was the XMLHttpRequest API.\n\nWhile the web technologies\
    \ and browsers advanced, JavaScript grew more prominent as a web scripting language\
    \ allowing developers to access the DOM and dynamically display and interact with\
    \ the content presented on the web page. However, JavaScript is also single-threaded\
    \ by nature, which means that, at any given time, two lines of script cannot run\
    \ together; instead, JavaScript statements are executed by line. Likewise, in\
    \ browsers, JavaScript shares a thread with a bunch of other workloads executed\
    \ by the browser from painting and updating styles to handling user actions. One\
    \ activity will deliver the order.\n\nWhen it first started, JavaScript was intended\
    \ for short, quick-running pieces of code. Major application logic and calculations\
    \ were done on the server side. Ever since loading content on the web changed\
    \ when reloading the whole page to the client side, asynchronous developers relying\
    \ heavily on JavaScript for web development. Now, we can find complete application\
    \ logic being written with JavaScript, and so many libraries have flourished to\
    \ help developers do so.\n\nIn web development, we have the three main components:\n\
    \n- HTML and CSS\n- The Document Object Model (DOM)\n- JavaScript\n\nAnd I will\
    \ add a fourth component that plays a pivotal role in AJAX programming:\n\n- The\
    \ XMLHttpRequest API\n\nBriefly, HTML and CSS are used for the presentation and\
    \ layout of a web page. The DOM is used for the dynamic display and interaction\
    \ with content. The XHR object used sends HTTP/HTTPS requests to a web server\
    \ and loads the server response data back into the script, mediating an asynchronous\
    \ communication. Lastly, JavaScript allows developers to bring all these technologies\
    \ together in order to create beautiful, responsive, and dynamic web applications.\n\
    \nIn order to tackle the multithreading limitation, developers relied heavily\
    \ on events and callbacks because that is the way browsers expose asynchronous\
    \ programming to the application logic.\n\nIn event-based asynchronous APIs, an\
    \ event handler is registered for a given object and the action is called when\
    \ the event is fired. The browser will perform the action usually in a different\
    \ thread, and triggers the event in the main thread when appropriate.\n\n## JavaScript\
    \ Promises - Why Should I Care?\n\nWe can achieve this event-based technique using\
    \ the object.addEventListener() method. This method will simply register a listener\
    \ on the target object it is called on. The event target object may be an element\
    \ in an HTML document, the document itself, or any other object that supports\
    \ events (such as XHR).\n\nThe following code shows what a simple event listener\
    \ looks like using HTML and JavaScript.\n\nThe HTML part is as follows:\n\n```\n\
    <div id='testDiv' style=\"width:100px; height:100px; background-color:red\"></div>\n\
    ```\n\nThe JavaScript part is as follows:\n\n```javascript\nvar testDiv = document.getElementById(\"\
    testDiv\");\ntestDiv.addEventListener(\"click\", function() {\n  // so the testDiv\
    \ object has been clicked, now we can do things\n  alert(\"I'm here!\");\n});\n\
    ```\n\nIn the HTML part, we define a div element in the DOM with the testDiv ID.\
    \ In the JavaScript part, we retrieve the div element in the first line of code\
    \ and assign it to a variable. Then, we add an event listener on that and pass\
