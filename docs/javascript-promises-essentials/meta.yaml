    \ of whether this error is handled elsewhere or not. The error handler can aid\
    \ in debugging, where it can be used to set breakpoints and provide error logging.\
    \ However, it will provide insight and details on the code or input that caused\
    \ the error at the end of the day. This onerror event delivers a general error-handling\
    \ mechanism. In code, adding a generic error handler will look like the following:\n\
    \n```\nWinJS.Promise.onerror = errorHandler;\n\nfunction errorHandler(event) {\n\
    \    // get generic error handling info\n    var exc = event.detail.exception;\n\
    \    var promiseErrored = event.detail.promise;\n}\n```\n\nThe first line of the\
    \ code sample is simply attaching the errorHandler function to the error event\
    \ of the promise object. Next, we define the errorHandler function, which takes\
    \ an argument event; what the function does is simply retrieve information from\
    \ the event in this example, such as the exception and the promise. Then, we assign\
    \ the values to variables. The parameter event is an event handler argument of\
