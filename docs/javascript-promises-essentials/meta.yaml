  md: 'JavaScript Promises – Why Should I Care?


    # Asynchronous programming in JavaScript


    When it comes to asynchronous programming in JavaScript, there are two things
    to talk about: the web and programming language. The web environment represented
    by browsers is different from the desktop environment and this reflects in the
    way we program and code for each of them. Browsers, contrary to the desktop environment,
    provide a single thread for everything that needs access to the user interface;
    in HTML terms, the DOM. This single threaded model has a negative impact on the
    application code that might need to access and modify the UI elements, because
    it restricts the execution of code to the same thread. Hence, we will have blocking
    functions and threads that basically block the UI until that thread has been executed.
    That is why, in web development, it is highly important to take advantage of any
    asynchronous capabilities the browser.


    Let''s review some history to get more context. In the day, websites comprised
    HTML pages in which every user needed the entire web page to be loaded from the
    server. This caused a lot of problems for developers, especially when writing
    a server-side code that would affect the page. Furthermore, it resulted in an
    unpleasant end user experience. Responding to a user action or changes to an HTML
    form was carried on with an HTTP POST request to the page that the form was on;
    this caused the server to refresh the page using the information it had just received.
    This entire process and model were inefficient as it resulted in having the entire
    content of the page get lost away in a slow internet environment. The browser
    then reloaded a web page resending all of the content even though only some of
    the information had changed; this used excessive bandwidth and resulted in additional
    load on the server. Later, with much work and effort from different parties in
    the industry, asynchronous web technologies started emerging to help address this
    limitation. A famous player in this area isis Asynchronous JavaScript and XML
    (AJAX), which is a group of technologies used on the client-side to create web
    applications that communicate in an asynchronous manner. The AJAX technology allowed
    web applications to send data and retrieve data from a server in an asynchronous
    manner without interfering with the UI and behavior of the current page; basically,
    without the need to reload the whole page. The core API to achieve this was the
    XMLHttpRequest API.'
