    The Promise API And Its Compatibility


    # Getting to know the API


    Throughout this book, we will be mostly addressing and using promises as defined
    in the specification of Promises/A+ (http://promisesplus.com/). The Promises/A+
    organization produced the Promises/A+ specification with the aim of expounding
    the initial Promises/A specification into one that is clearer and better tested.
    The proposal is a quote from their website:


    > Promises/A+ is based on the concepts and then API presented in the CommonJS
    Promises/A proposal.


    > - http://promisesplus.com/differences-from-promises-a


    These differences are seen at three levels: omissions, additions, and clarifications.
    At the level of omissions, Promises/A+ has removed the following features from
    the original:


    +   - Progress handling: This feature includes a callback function that handles
    the operation/ while in progress, as not fulfilled rejected. It was removed because
    implementers have concluded that, in practice, these functionalities have proven
    to be underspecified and currently there is no total agreement on their behaviors
    within the promise implement community.

    - Interactive promises: This feature was an extended promise in the previous Promises/A
    proposal and basically supported two additional functions for the promise methods;
    get(propertyName), which requests the property from the target of this promise,
    and call(functionName, arg1, arg2, ...), which calls the given method/function
    in its parameter on the target of the promise. In the new A+ specification, this
    feature, along with the two functions, call and get, is considered out of scope
    when implementing a basic API required for interoperable promises.

    - promise== resultPromise: This feature was a requirement in the old proposal,
    which states that the result of a promise should not equal the promise, for example,
    var resultPromise = promise.then(onFulfilled, onRejected). In fact, any implementation
    may allow for resultPromise === promise, provided that the implementation meets
    all the requirements.


    At the level of additions, the Promises/A+ specification adds the following features
    and requirements to the Existing Promises/A proposal:


    +   - The behavior specifications in the scenario where onFulfilled or onRejected
    returns a then, including the details of the resolution procedure.

    - The reason passed to the onRejected handler, which must be the exception that
    is thrown back in that case.


