    \nWith this, namespaced routing capabilities are added to Express. To install\
    \ it into the system, one can execute the following command:\n\n`$ npm install\
    \ express-namespace`\n\nConsider the example given below, which can be used for\
    \ responding to any of the requests. Here is the example:\n\n```\nGET /forum/12\n\
    GET /forum/12/view\nGET /forum/12/edit\nGET /forum/12/thread/5\nDELETE /forum/12\n\
    ```\n\nFor the module to be used, one must use the `app.namespace()` and `require('express-namespace')`.\
    \ The module will then be made available to you.\n\nTo use it, we have to pass\
    \ a callback function, and then perform a routing to the method. After each of\
    \ the callbacks, the invocation will be completed, and the namespace will be stored\
    \ together with its state. This is shown below:\n\n```javascript\napplication.namespace('/forum/:id',\
    \ function(){\n  application.get('/(view)?', function(req, res){\n    res.send('GET\
    \ forum ' + req.params.id);\n  });\n  application.get('/edit', function(req, res){\n\
    \    res.send('GET forum ' + req.params.id + ' edit the page');\n  });\n  application.namespace('/thread',\
    \ function(){\n    application.get('/:tid', function(req, res){\n      res.send('GET\
    \ forum ' + req.params.id + ' thread ' + req.params.tid);\n    });\n  });\n  application.del('/',\
    \ function(req, res){\n    res.send('DELETE the forum ' + req.params.id);\n  });\n\
    });\n```\n\nThe current namespace can also be accessed via the `app.currentNamespace`.\
    \ You should also know how to run the tests. However, before doing this, make\
    \ sure that you have all of the sub-modules installed into the system. These can\
    \ be installed by executing the following command:\n\n`$ git submodule update\
    \ –init`\n\nThe tests can be run by executing the following command:\n\n`$ make\
    \ test`\n\nThat is how the module can be used.\n\n# Chapter 16- [express-expose](https://github.com/expressjs/express-expose)\n\
    \nThis is used for exposing the objects, functions, and raw js to the client side.\
    \ This feature is good for sharing of settings, utils, and the current data for\
    \ the user. The helpers and the local variables are also exposed to the client\
    \ side.\n\nTo install this module, execute the command given below:\n\n`npm install\
    \ -S express-expose`\n\nIt can be used as shown below:\n\n```javascript\nvar express\
    \ = require('express');\nvar expose = require('express-expose');\napplication\
    \ = expose(application);\napplication.expose(...);\n```\n\nThe above is how the\
    \ module can be used in express 4.x. In express 2.x and 3.x, it can be done as\
    \ follows:\n\n```javascript\nvar express = require('express');\nvar expose = require('express-expose');\n\
    application.expose(...);\n```\n\n## How to express the objects\n\nOne way that\
    \ objects can be exposed to the client side is by exposing the properties, and\
    \ most probably the Express configuration. When the `app.expose(object)` is exposed,\
    \ the properties will be exposed to the `application.*` The example given below\
    \ shows how this can be done:\n\n```javascript\napplication.set('views', __dirname\
    \ + '/views');\napplication.set(' the view engine ', 'jade');\napplication.set('title',\
    \ ' Sample ');\napplication.set('default language', 'en');\napplication.expose(application.settings);\n\
    ```\n\nHelper methods can also be exposed by another use case. This can be in\
    \ the same way that you are currently exposing. This is shown below:\n\n```javascript\n\
    application.expose({ en: 'English', fr: 'French' }, 'application', 'languages');\n\
    ```\n\nYou then need to output your default buffer to your template. For jade\
    \ users, it can be done as follows:\n\n```\nscript!= javascript\n```\n\nFor EJS\
    \ users, this can be done as follows:\n\n```\n<script><%- javascript %></script>\n\
    ```\n\nRaw JavaScript strings can also be exposed as shown below:\n\n```javascript\n\
    application.expose('var some = \"variable\";');\n```\n\n## Exposing Functions\n\
    \nA named function can easily be exposed. You only have to pass it with a default\
    \ name for the buffer to replace it with a template name. An example of this is\
    \ shown below:\n\n```javascript\napplication.expose(function someFunction(){\n\
    \  return 'yes';\n}, 'foot');\n```\n\nThat is how it can be done.\n\n## Self-Calling\
    \ Functions\n\nAn anonymous function can also be passed, and this will execute\
    \ itself so as to create a wrapper function. Consider the example given below,\
    \ which shows how this can be done:\n\n```javascript\napplication.expose(function(){\n\
    \  function notify() {\n    alert('this will be executed finely:D');\n  }\n  notify();\n\
    });\n```\n\nThat is how it can be done.\n\n## Request-Level Exposure\n\nAll the\
    \ above which has been discussed can be applied to the request-level. Consider\
    \ the example given below showing how to do this. Here is the example:\n\n```javascript\n\
    application.get('/', function(req, res){\n  var user = { name: 'john' };\n  res.expose(user,\
    \ 'application.current.user');\n  res.render('index', { layout: false });\n});\n\
    ```\n\n# Chapter 17- connect-render\n\nThis is a helper for the template render\
    \ in connect. It can be installed by executing the following command:\n\n`$ npm\
    \ install connect-render`\n\nIt can be used as shown below:\n\n```javascript\n\
    var connect = require('connect');\nvar render = require('connect-render');\nvar\
    \ application = connect(\n  render({\n    root: __dirname + '/views',\n    layout:\
    \ 'layout.html',\n    cache: true, // `false` for the debug\n    helpers: {\n\
