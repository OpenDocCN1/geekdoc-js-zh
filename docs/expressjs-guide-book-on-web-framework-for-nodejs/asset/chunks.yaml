    Each of these modules has its own command which can be used for its installation.
    To use of any of its modules, you have to begin by installing it. It supports
    the use of sessions which are very useful in the creation of web applications.
    It has a variety of options which you can use for the purpose of development.
    You should learn how to use the different options which are available for each
    ExpressJS module. The `serve-index` module is used for serving pages having listings
    of a directory to a particular path.


    This is very interesting in development. With the `cookie-sessions` module, one
    can provide guest sessions so that each of the visitors will have a session, whether
    authenticated or not. This is also one of the best and interesting features in
    Express. This Node framework is very easy to learn even for beginners. This book
    helps you in learning how to use it.

