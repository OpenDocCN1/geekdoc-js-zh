    For you to catch the errors which are originating from the Multer, just call the
    middleware function on your own. This is shown in the example given below:


    ```

    var uploadfile = multer().single(''avatar'')


    application.post(''/profile'', function (req, res) {


    uploadfile(req, res, function (error) {


    if (error) {


    // An error has occurred when uploading


    return


    }


    // Everything was okay


    })


    })

    ```


    That is how it can be used.


    # Chapter 9- Compression


    This is middleware available in Node.js. It supports the following compression
    codes:


    * deflate

    * gzip


    To install this middleware in your system, execute the following command:


    `$ npm install compression`


    To include this API in your program, use the `require` keyword as shown below:


    `var compression = require(''compression'')`


    There are different options which can be used so as to return the compression
    middleware.


    ## .filter


    This is the default filter function. It is used for construction of a custom filter
    function which will be an extension of our default function. The example given
    below shows how this can be used:


    ```

    application.use(compression({filter: compress}))


    function compress(req, res) {


    if (req.headers[''x-no-compression'']) {


    // responses having this header request should not be compressed.


    return false


    }


    // fallback to standard filter function


    return compression.filter(req, res)


    }

    ```


    ## red.flush()


    With this module, the response which has been compressed partially is flushed
    to the client. Let us give examples of these.


    ### express/connect


    This module can be used by use of the `app.use`, which is available in either
    Express and connect. Requests passed through the middleware are always compressed.
    Consider the example given below which shows how this can be done:


    ```

    var compression = require(''compression'')


    var express = require(''express'')


    var application = express()


    // compressing all of the requests


    application.use(compression())


    // adding all the routes

    ```


    That is how it can be done.


    ### Server-Sent Events


    The working of this module with server-side is not done out of the box. For content
    to be compressed, a window for the output has to be buffered up so that we can
    get a good compression.


    To do all this, we have to call the `red.flush()` for those who need the data
    written so as to make it to our client. This is shown below:


    ```

    var compression = require(''compression'')


    var express = require(''express'')


    var application = express()


    // compressing the responses


    application.use(compression())


    // the server-sent event stream


    application.get(''/events'', function (req, res) {


    res.setHeader(''Content-Type'', ''text/event-stream'')


    res.setHeader(''Cache-Control'', ''no-cache'')


    // sending a ping approx after every 2 seconds


    var timer = setInterval(function () {


    res.write(''data: ping\n\n'')


    // !!! our most important part for the program


    res.flush()


    }, 2000)


    res.on(''close'', function () {


    clearInterval(timer)


    })


    })

    ```


    # Chapter 10- csurf


    This is a token middleware for CSRF. It acts as a middleware for protection purposes.
    For it to be used, one has to begin by initializing a cookie-parser or a session
    middleware. It can be installed into one’s computer by executing the following
    command:


    `$ npm install csurf`


    To use the API in your program, use the `require` command as shown below:


    `var csurf = require(''csurf'')`


    That is how it can be included into the program.


    The options for this module take multiple and different objects which you can
    learn how to use.


    Consider the example given below, which shows a code for the server-side which
    can be used for generation of the CSRF form which can be used for posting back.
    This is the example:


    ```

    var cParser = require(''cookie-parser'')


    var csrf = require(''csurf'')


    var bParser = require(''body-parser'')


    var express = require(''express'')


    // setting up the route middlewares


    var csrfProtection = csrf({ cookie: true })


    var pForm = bParser.urlencoded({ extended: false })


    // creating an express app


    var application = express()


    // parsing cookies


    // this is needed because "cookie" is true in the csrfProtection


    application.use(cParser())


    application.get(''/form'', csrfProtection, function(req, res) {


    // passing the csrfToken to our view


    res.render(''send'', { csrfToken: req.csrfToken() })


    })


    application.post(''/process'', pForm, csrfProtection, function(req, res) {


    res.send(''The data is now being processed'')


    })

    ```


    Inside your view, the value for `csrfToken` should be set to the value of a hidden
    input field `_csrf`. This is shown below:


    ```

    <form action="/process" method="POST">


    <input type="hidden" name="_csrf" value="{{csrfToken}}">


    Best color: <input type="text" name="bestColor">


    <button type="submit">Submit</button>


    </form>

    ```


    That is how simply it can be done.


    ## Ignoring the Routes


    In API areas for the websites in which we will have our requests fully authenticated,
    the CSRF should be disabled. API routing can be ignored by the use of routers
    and Express. Consider the example given below, which shows how this can be done:


    ```

    var cParser = require(''cookie-parser'')


    var csrf = require(''csurf'')


    var bParser = require(''body-parser'')


    var express = require(''express'')


    // setting up the route middlewares


    var csrfProtection = csrf({ cookie: true })


    var pForm = bParser.urlencoded({ extended: false })


    // creating an express app


    var application = express()


    // parsing cookies


    // this is needed because "cookie" is true in the csrfProtection


    application.use(cParser())


    // creating an api router


    var api = createApiRouter()


    // mounting the api before the csrf is appended to our app stack


    application.use(''/api'', api)


    // adding the csrf, after the "/api" has been mounted


    appliation.use(csrfProtection)


    application.get(''/form'', function(req, res) {


    // passing the csrfToken to our view


    res.render(''send'', { csrfToken: req.csrfToken() })


    })


    application.post(''/process'', pForm, function(req, res) {


    res.send(''csrf was required for getting here'')


    })


    function createApiRouter() {


    var router = new express.Router()


    router.post(''/getProfile'', function(req, res) {


    res.send('' there is no csrf here to get'')


    })


    return router


    }

    ```


    That is how it can be done.


    ## Custom error handling


    When the validation of the CSRF has failed, an error with `err.code === ''EBADCSRFTOKEN''`
    will be thrown. This can also be used so as to display error messages. Consider
    the example given below, which shows how this can be done:


    ```

    var bParser = require(''body-parser'')


    var cParser = require(''cookie-parser'')


    var csrf = require(''csurf'')


    var express = require(''express'')


    var application = express()


    application.use(bParser.urlencoded({ extended: false }))


    application.use(cParser())


    application.use(csrf({ cookie: true }))


    // the error handler


    application.use(function (error, req, res, next) {


    if (error.code !== ''EBADCSRFTOKEN'') return next(error)


    // handling the CSRF token errors is done here


    res.status(403)


    res.send('' The form was tampered with'')


    })

    ```


    That is how it can be done.


