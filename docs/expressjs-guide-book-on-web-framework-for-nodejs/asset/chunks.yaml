    \ -> Array\n  //\n  // req.body 包含文本字段（如果有的话）\n})\n```\n\n如果需要处理 multipart 表单中的文本数据，可以使用\
    \ Multer 的任何方法，包括 `single()`、`.array()` 和 `fields()`。下面的示例展示了如何使用 `.array()`：\n\
    \n```\nvar express = require('express')\nvar application = express()\nvar multer\
    \ = require('multer')\nvar uploadfile = multer()\n\napplication.post('/profile',\
    \ uploadfile.array(), function (req, res, next) {\n  // req.body 包含我们的文本字段\n})\n\
    ```\n\nMulter 接受一个选项对象，其中最基本的属性是 `dest`，它指定了上传文件的目标路径。如果省略选项对象，上传的文件将保存在内存中，而不是磁盘上。\n\
    \n为了避免命名冲突，Multer 默认会重命名文件。其余功能可以根据需要进行自定义。\n\nMulter 支持多种选项，请确保理解如何传递这些选项。\n\n\
    在普通的 Web 应用程序中，可能只需要 `dest` 属性，配置方式如下：\n\n```\nvar uploadfile = multer({ dest:\
    \ 'uploads/' })\n```\n\n如果需要对上传文件进行更精细的控制，可以使用 `storage` 属性代替 `dest` 属性。Multer\
    \ 内置了 `DiskStorage` 和 `MemoryStorage` 两种存储引擎。你也可以使用第三方存储引擎。\n\n如果需要完全控制存储在磁盘上的文件，可以使用磁盘存储引擎。示例如下：\n\
    \n```\nvar storage = multer.diskStorage({\n  destination: function (req, file,\
    \ cb) {\n    cb(null, '/tmp/file-uploads')\n  },\n  filename: function (req, file,\
    \ cb) {\n    cb(null, file.fdname + '-' + Date.now())\n  }\n})\n\nvar uploadfile\
    \ = multer({ storage: storage })\n```\n\n可用的两个选项是 `filename` 和 `destination`。它们都是函数，用于决定文件的存储方式。`destination`\
    \ 属性确定上传文件在目录中的存储文件夹，也可以在程序中指定为路径。如果未指定此属性，则使用操作系统的默认路径。\n\n### 文件过滤器\n\n此属性可用于设置哪些文件应被上传，哪些应被跳过。该函数的使用方法如下例所示：\n\
    \n```\nfunction fileFilter (req, file, cb) {\n  // 该函数将调用 `cb` 并传入一个布尔值\n  //\
    \ 以指示文件是否应被接受\n  // 如果要拒绝文件，则传入 `false`，如下所示：\n  cb(null, false)\n\n  // 如果要接受文件，则传入\
    \ `true`，如下所示：\n  cb(null, true)\n\n  // 由于某些环节可能出错，你也可以传递一个错误：\n  cb(new Error('我完全不知道！'))\n\
    }\n```\n\n### 错误处理\n\n当遇到错误时，Multer 会将其传递给 Express。可以使用标准的 Express 错误处理方式来显示错误。\n\
    \n"
