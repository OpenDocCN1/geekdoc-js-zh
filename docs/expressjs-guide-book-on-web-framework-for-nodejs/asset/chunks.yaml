    \napp.get('/', function (req, res) {\n  res.send('hello, world!')\n})\n\nfunction\
    \ assignId(req, res, next) {\n  req.id = uuid.v4()\n  next()\n}\n```\n\n# 第 6\
    \ 章 - CORS\n\n这是一个 Node.js 包，提供了一个 ExpressJS/Connect 中间件，可用于启用 CORS 的各种选项。\n\n\
    要通过 npm 命令安装它，请执行以下命令：\n\n```bash\n$ npm install cors\n```\n\n它可以按如下方式使用：\n\n\
    ```javascript\nvar express = require('express')\n, cors = require('cors')\n, application\
    \ = express();\n\napplication.use(cors());\n\napplication.get('/products/:id',\
    \ function(req, res, next){\n  res.json({msg: 'This has CORS enabled for all the\
    \ origins!'});\n});\n\napplication.listen(80, function(){\n  console.log(' web\
    \ server which is CORS enabled listening on port 80');\n});\n```\n\n要为单个路由启用 CORS，请按如下方式操作：\n\
    \n```javascript\nvar express = require('express')\n, cors = require('cors')\n\
