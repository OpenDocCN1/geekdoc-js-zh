- fmt: "\n# [Text body parser](https://github.com/expressjs/body-parser#bodyparsertextoptions)\n\
    \nTo install it, just execute the following command:\n\n```\n$ npm install body-parser\n\
    ```\n\nTo use the API, include it in your program by use of the `require` command.\
    \ This is shown below:\n\n```\nvar bParser = require('body-parser')\n```\n\nWith\
    \ the object `bParser`, various factories are exposed for the purpose of creation\
    \ of middlewares. The property `req.body` will be populated by all middlewares\
    \ by use of the parsed body or an error will be parsed to the callback.\n\nIn\
    \ Express, a generic JSON and URL-encoded parser can be added as a top-level middleware.\
    \ With this, the bodies of all the incoming requests will be parsed. Consider\
    \ the simple example given below, which shows how this can be done:\n\n```\nvar\
    \ express = require('express')\nvar bParser = require('body-parser')\nvar application\
    \ = express()\n\n// parsing the application/x-www-form-urlencoded\napplication.use(bParser.urlencoded({\
    \ extended: false }))\n\n// parsing the application/json\napplication.use(bParser.json())\n\
    \napplication.use(function (req, res) {\n  res.setHeader('Content-Type', 'text/plain')\n\
    \  res.write('you posted:\\n')\n  res.end(JSON.stringify(req.body, null, 2))\n\
    })\n```\n\n### express route-specific\n\nBody parsers can be added to the routes\
    \ which need them. This is possible in Express and it can easily be done. This\
    \ is the most easy and recommended way that the `body-parser` can be used in Express.\
    \ Consider the example given below, which shows how this can be done:\n\n```\n\
    var express = require('express')\nvar bParser = require('body-parser')\nvar application\
    \ = express()\n\n// creating an application/json parser\nvar jParser = bodyParser.json()\n\
    \n// creating an application/x-www-form-urlencoded parser\nvar urlenParser = bParser.urlencoded({\
    \ extended: false })\n\n// POST /login which will get the urlencoded bodies\n\
    application.post('/login', urlenParser, function (req, res) {\n  if (!req.body)\
    \ return res.sendStatus(400)\n  res.send('welcome, ' + req.body.username)\n})\n\
    \n// POST /api/users will get the JSON bodies\napplication.post('/api/users',\
    \ jParser, function (req, res) {\n  if (!req.body) return res.sendStatus(400)\n\
    \  // create a user in the req.body\n})\n```\n\n### Changing the content type\
    \ for parsers\n\nWith all parsers, a `type` option is accepted and with this,\
    \ the `content-type` will be changeable and this should be the one to be parsed\
    \ by the middleware. Consider the example given below, which shows how this can\
    \ be done:\n\n```\n// parsing the various and different custom JSON types as a\
    \ JSON\napplication.use(bodyParser.json({ type: 'application/*+json' }))\n\n//\
    \ parsing a custom thing into the Buffer\napplication.use(bParser.raw({ type:\
    \ 'application/vnd.custom-type' }))\n\n// parsing the HTML body into the string\n\
    application.use(bParser.text({ type: 'text/html' }))\n```\n\n# Chapter 12- Flash\n\
    \nThis is the simplest manner in which Express can be implemented. To install\
    \ it, execute the following command:\n\n```\nnpm i flash\n```\n\nConsider the\
    \ example given below, which shows how this can be done:\n\n```\napplication.use(session());\
    \ // the session middleware\napplication.use(require('flash')());\napplication.use(function\
    \ (req, res) {\n  // flashing a message\n  req.flash('info', 'hello there!');\n\
    \  next();\n})\n```\n\nConsider the second example given below:\n\n```\nfor msge\
    \ in flash\n  a.alert(class='alert-' + msge.type)\n  p= message.msge\n```\n\n\
    Here is the final example:\n\n```\nwhile msge = flash.shift() // consuming the\
    \ messages as jade has read them\n  a.alert(class='alert-' + msge.type)\n  p=\
    \ message.msge\n```\n\nAn array of f Lash messages can be as shown below:\n\n\
    ```\n{\n  \"type\": \"info\",\n  \"message\": \"message\"\n}\n```\n\n# [method-override](https://github.com/expressjs/method-override)\n\
    \nThis is used for overriding HTTP verbs. With it, one can use HTTP verbs such\
    \ as “DELETE” and “PUT” in places where they are not supported by the client.\
    \ To install it in your system, execute the following command:\n\n```\n$ npm install\
    \ method-override\n```\n\nFor this module to be used, you have to know that a\
    \ bit has to be used before any of the modules which are in need of the request\
    \ methods.\n\n### Using the header to override\n\nFor the header to be used for\
    \ overriding, the header name has to be specified as a string argument to the\
    \ function `methodOverride`. For the call to be made, the POST request has to\
    \ be sent to the URL having the header as the overridden method. Consider the\
    \ example given below showing, how this can be done:\n\n```\nvar connect = require('connect')\n\
    var mthdOverride = require('method-override')\n\n// overriding with the X-HTTP-Method-Override\
    \ header in our request\napplication.use(mthdOverride('X-HTTP-Method-Override'))\n\
    ```\n\nConsider the example given below, which shows how this can be used with\
    \ `XMLHttpRequest`:\n\n```\nvar c = new XMLHttpRequest()\nc.onload = onload\n\
    c.open('post', '/resource', true)\nc.setRequestHeader('X-HTTP-Method-Override',\
    \ 'DELETE')\nc.send()\n\nfunction onload() {\n  alert('The response was obtained:\
    \ ' + this.responseText)\n}\n```\n\n# Chapter 13- serve-favicon\n\nThis is a Node.js\
    \ middleware which is used for the purpose of serving favicons. A favicon is just\
    \ a visual cue which browsers and other client software use for the purpose of\
    \ identifying a site.\n\nThe module can be installed into the system by executing\
    \ the following command:\n\n```\nnpm install serve-favicon\n```\n\nConsider the\
    \ example given below, showing how this can be used in express:\n\n```\nvar express\
    \ = require('express');\nvar favicon = require('serve-favicon');\nvar application\
    \ = express();\n\napplication.use(favicon(__dirname + '/public/favicon.ico'));\n\
    \n// Addition of your routes should be done here.\napplication.listen(3000);\n\
    ```\n\nIn connect, this can be done as follows:\n\n```\nvar connect = require('connect');\n\
    var favicon = require('serve-favicon');\nvar application = connect();\n\napplication.use(favicon(__dirname\
    \ + '/public/favicon.ico'));\n\n// Addition of your middleware should be done\
    \ here, etc.\napplication.listen(3000);\n```\n\n### vanilla http server\n\nThis\
    \ is a type of middleware which can be used everywhere, including outside Express\
    \ and connect.\n\nThe example given below shows how this can be done:\n\n```\n\
    var http = require('http');\nvar favicon = require('serve-favicon');\nvar fnhandler\
    \ = require('finalhandler');\nvar _favicon = favicon(__dirname + '/public/favicon.ico');\n\
    \nvar server = http.createServer(function onRequest(req, res) {\n  var done =\
    \ fnhandler(req, res);\n  _favicon(req, res, function onNext(error) {\n    if\
    \ (error) return done(error);\n    // just continue with processing of the request\
    \ here, etc.\n    res.statusCode = 404;\n    res.end('hello');\n  });\n});\n\n\
    server.listen(3000);\n```\n\n# Chapter 14- response-time\n\nThis is the node.js\
    \ response time header. It works by creating a middleware for recording the response\
    \ time of its requests in the HTTP servers. The response time in this case will\
    \ be the time when the request has entered the middleware to the time when the\
    \ headers have been written to the client.\n\nThis module can be installed by\
    \ executing the following command:\n\n```\n$ npm install response-time\n```\n\n\
    The module can be included into the program by use of the `require` keyword as\
    \ shown below:\n\n```\nvar respTime = require('response-time')\n```\n\nConsider\
    \ the example given below, which shows how this can be used in both the Express\
    \ and the connect:\n\n```\nvar express = require('express')\nvar respTime = require('response-time')\n\
    var application = express()\n\napplication.use(respTime())\n\napplication.get('/',\
    \ function (req, res) {\n  res.send('hello, there!')\n})\n```\n\n### That is how\
    \ it can be used.\n\n### vanilla http server\n\nThis can be used as follows:\n\
    \n```\nvar finalhandler = require('finalhandler')\nvar http = require('http')\n\
    var respTime = require('response-time')\n\n// creating the \"middleware\"\nvar\
    \ _responseTime = respTime()\n\nhttp.createServer(function (req, res) {\n  var\
    \ done = fnhandler(req, res)\n  _responseTime(req, res, function (err) {\n   \
    \ if (error) return done(error)\n    // responding to the request\n    res.setHeader('content-type',\
    \ 'text/plain')\n    res.end('hello, there!')\n  })\n})\n```\n\nThat is how the\
    \ module can be used.\n\nResponse time metris\n"
