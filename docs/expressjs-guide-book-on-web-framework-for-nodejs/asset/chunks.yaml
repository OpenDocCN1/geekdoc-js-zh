    \n目录\n\n引言\n\n第 1 章 - ExpressJS 概述\n\n第 2 章 - 会话\n\n第 3 章 - serve-index\n\n第 4\
    \ 章 - cookie- Sessions\n\n第 5 章 - Morgan in ExpressJS\n\n第 6 章 - CORS\n\n第 7 章\
    \ - Express-Paginate\n\n第 8 章 - Multer\n\n第 9 章 - 压缩\n\n第 10 章 - csurf\n\n第 11\
    \ 章 - body-parser\n\n第 12 章 - Flash\n\nmethod-override\n\n第 13 章 - serve-favicon\n\
    \n第 14 章 - response-time\n\n第 15 章 - express-namespace\n\n第 16 章 - express-expose\n\
    \n第 17 章 - connect-render\n\n结论\n\n免责声明\n\n尽管已尽力验证本书中提供的信息，但作者对其中所含主题的任何错误、遗漏或相反解释不承担任何责任。本书提供的信息仅供教育和娱乐之用。读者应对自己的行为负责，作者不承担因使用此信息而产生的任何责任或损害（无论是实际还是感知的）。\n\
    \n所使用的商标未经任何同意，商标的发布未经商标所有者的许可或支持。本书中的所有商标和品牌仅用于说明目的，归其所有者所有，与本文件无关。\n\n# 引言\n\
    \nExpressJS 是最有用且最有趣的 Node 框架之一。它用于 Web 和移动应用程序的开发。这类应用程序在软件环境中使用最为广泛。这表明您需要了解如何使用此框架进行开发。该框架拥有众多模块，可用于增强应用程序的外观和感觉。\n\
    \n# 第 1 章 - ExpressJS 概述\n\nExpressJS 是一个 Node 框架，非常灵活，为开发人员提供了众多用于 Web 和移动应用程序开发的功能。该框架可用于\
    \ API 的开发。在本书中，我们将讨论 ExpressJS 的各种特性。\n\n# 第 2 章 - 会话\n\n要在 Express 中安装此模块，只需执行以下命令：\n\
    \n`$ npm install express-session`\n\n上述命令会将会话安装到您的系统中。要在程序中使用它，您必须使用 `require`\
    \ 命令。如下所示：\n\n`var session = require('express-session')`\n\n会话中间件可以通过使用给定的 `options`\
    \ 来创建。您应该知道，会话数据不应保存在 cookie 本身中，而此处仅存储会话 ID。会话数据存储在应用程序的服务器端。然而，默认的服务器端会话存储 `MemoryStore`\
    \ 并非为生产环境使用而开发。在大多数情况下，它会泄漏且无法扩展到单个进程之外。它是为调试目的而开发的。\n\n`express-session` 会在 options\
    \ 对象中接受以下属性：\n\n## Cookie\n\n这些是会话 ID 的 cookie 设置。请参考下面给出的示例：\n\n`{ path: '/',\
    \ httpOnly: true, secure: false, maxAge: null }`.\n\n## Genid\n\n这是一个用于生成新会话 ID\
    \ 的函数。提供的函数应返回一个字符串，该字符串将用作会话 ID。`req` 作为第一个参数传递给该函数，以防在生成 ID 时需要将某个值附加到 `req`。此属性的默认值将是一个可以使用\
    \ `uid2` 生成 ID 的函数。\n\n注意：为避免会话冲突，请确保生成的 ID 是唯一的，即它们应彼此不同。请参考下面给出的示例，展示如何实现这一点：\n\
    \n```\napplication.use(session({\n    genid: function(req) {\n    return genuuid()\
    \ // 使用 UUID 作为会话 ID\n},\n    secret: ' my secret '\n}))\n```\n\n## Name\n\n这是要在响应中设置的会话\
    \ ID cookie 的名称。请注意，它是从请求中读取的。此属性的默认值是 `connect.sid`。对于在同一主机上运行多个应用程序的用户，会话 cookie\
    \ 必须彼此分离。为此，必须在每个应用程序中设置不同的名称。\n\n## Proxy\n\n当您设置安全 cookie 时，必须信任反向代理。这可以通过 `X-Forwarded-Proto`\
    \ 标头来完成。此属性的默认值是 `undefined`。\n\n可能的取值如下所述：\n\n1. `true` - 将使用 `X-Forwarded-Proto`\
    \ 标头。\n2. `false` - 将忽略所有标头，并且仅当存在直接的 `TLS/SSL` 连接时才考虑该连接。\n3. `undefined` - 将使用\
    \ Express 本身的 `trust proxy` 设置。\n\n## Resave\n\n这将强制将会话保存回会话存储。无论会话在请求期间是否被修改，都会发生这种情况。其必要性取决于您的会话存储。但是，如果客户端发出并行请求，则可能会产生竞态条件。\n\
    \n## Rolling\n\n这将强制在每个响应上设置 cookie。过期日期也会重置。此属性的默认值是 `false`。\n\n## saveUninitialized\n\
    \n使用此选项，未初始化的会话将被保存到会话存储。未初始化的会话是指新的且未经任何修改的会话。此属性的默认设置是 `true`。但是，此设置已弃用，预计将来会更改。\n\
    \n## Required option\n\n这是用于签署会话 ID cookie 的密钥。它可以由一组密钥字符串组成，也可以只是一个字符串用于单个密钥。如果您提供一组密钥，则仅使用数组中的第一个元素来签署会话\
    \ ID cookie。其余元素将用于验证请求中的签名。\n\n## Store\n\n这是会话存储的实例。其默认值是一个新的 `MemoryStore`\
    \ 实例。\n\n请参考下面给出的示例：\n\n```\nvar application = express()\n\napplication.set('trust\
    \ proxy', 1) // 信任第一个代理\n\napplication.use(session({\n    secret: 'my secret',\n\
    \    resave: false,\n    saveUninitialized: true,\n    cookie: { secure: true\
    \ }\n}))\n```\n\n我们需要能够在生产环境中使用 cookie，同时允许在开发环境中进行测试。可以通过使用 `NODE_ENV` 来启用此设置。请参考下面给出的示例，展示如何实现这一点：\n\
    \n```\nvar application = express()\nvar session = {\n    secret: ' my secret ',\n\
    \    cookie: {}\n}\n```\n\n"
- fmt: '

    ```javascript

    if (application.get(''env'') === ''production'') {


    application.set(''trust proxy'', 1) // trusting the first proxy


         session.cookie.secure =  true // serving secure cookies


    }


        application.use(session(session))

    ```


    The default setting for `cookie.maxAge` is `null`, and it will never expire, which
    means that the cookie will become a browser-session cookie. The cookie is only
    removed once the user has closed the browser. The session is also removed.


    `req.session`


    For session data to be stored and accessed, you should use the property `req.session`,
    and the store initializes this as a JSON. The session objects will then be left
    fine. Consider the example given below, which shows a view counter which is specific
    to a user:


    ```javascript

    application.use(session({ secret: '' my secret '', cookie: { maxAge:  50000 }}))

    ```


    ```javascript

    application.use(function(req, res, next) {


    var session = req.session


    if (session.views) {


    session.views++


    res.setHeader(''Content-Type'', ''text/html'')


    res.write(''<p>views: '' + session.views + ''</p>'')


    res.write(''<p>will expires in: '' + (session.cookie.maxAge /  1000) + ''s</p>'')


    res.end()


    } else {


    session.views =  1


    res.end('' This is a demo for sessions. Refresh the page!'')


    }


    })

    ```


    #### `Session.regenerate()`


    This method is invoked when we want to generate the session. After this, a new
    session instance and SID will be initialized at the `req.session`. This is shown
    below:


    ```javascript

    req.session.regenerate(function(error) {


    // a new session should be added here


    })

    ```


    #### `Session.destroy()`


    With this, the session is destroyed, and the `req.session` removed. It will then
    be regenerated in the next request. This is shown below:


    ```javascript

    req.session.destroy(function(error) {


    // a session cannot be accessed here.


    })

    ```


    #### `Session.reload()`


    This is used for reloading the session as shown below:


    ```javascript

    req.session.reload(function(error) {


    // the session has been updated


    })

    ```


    #### `Session.save()`


    This is for saving the session as shown below:


    ```javascript

    req.session.save(function(error) {


    // session has been saved


    })

    ```


    Consider the example given below, which uses the `express-session` so as to store
    the page views for the user:


    ```javascript

    var express =  require(''express'')


    var purl =  require(''parseurl'')


    var session =  require(''express-session'')


    var application = express()


    application.use(session({


    secret: '' my secret '',


    resave:  false,


    saveUninitialized:  true


    }))


    application.use(function (req, res, next) {


    var vws = req.session.views


    if (!vws) {


    vws = req.session.views = {}


    }


    // getting the url pathname


    var pathname = purl(req).pathname


    // counting the views


    vws[pathname] = (vws[pathname] ||  0) +  1


    next()


    })


    application.get(''/foo'', function (req, res, next) {


    res.send(''you have viewed this page '' + req.session.vws[''/test''] + '' times'')


    })


    application.get(''/bar'', function (req, res, next) {


    res.send(''you have viewed this page '' + req.session.vws[''/bar''] + '' times'')


    })

    ```


    That is how sessions can be used in ExpressJS.


    # Chapter 3- serve-index


    This is used for serving pages having listings of a directory to a particular
    path. It can be installed by executing the command given below:


    `$ npm install serve-index`


    The above command will install the `serve-index` to your computer. To use it in
    your program, it has to be included or called by use of the `require` method.
    This is shown below:


    ```javascript

    var svIndex =  require(''serve-index'')

    ```


    The API will then be included in your program.


    ### `serveIndex(path, options)`


    This will return the middleware which serves the index of the directory in the
    `path` you have given. The path here is based off of the value for `req.url`.
    For you to change the URL base, make use of the `app.use`.


    The following properties are accepted by the serve index in the options object:


    **Filter**


    This filter function is applied to files. Its default value is `false`. It is
    called for each of the files, and it uses the signature `filter(filename, index,
    files, dir)`. `Filename` will be the file''s name, `index` will be the array index,
    and `files` is the array of the files, while `dir` will be the absolute path in
    which the file is located.


    **Hidden**


    This is used for displaying the hidden files. Its default value is `false`.


    **Icons**


    This is for displaying icons. It default value is `false`.


    **Stylesheet**


    This is an optional path which leads to the CSS stylesheet. Its default value
    is the built-in stylesheet.


    **Template**


    This is an optional path which leads to an HTML template, and is used for rendering
    the HTML string.


    **View**


    This is the display mode.


    Consider the example given below, which shows how all the above can be used:


    ```javascript

    var fhandler =  require(''finalhandler'')


    var http =  require(''http'')


    var svIndex =  require(''serve-index'')


    var svStatic =  require(''serve-static'')


    // The Serve directory works to indexe for public/ftp folder (having icons)


    var index = svIndex(''public/ftp'', {''icons'':  true})


    // Serving up the public/ftp folder files


    var serve = svStatic(''public/ftp'')


    // Creating a server


    var server = http.createServer(function onRequest(req, res){


    var done = fhandler(req, res)


    serve(req, res, function onNext(error) {


    if (error) return done(error)


    index(req, res, done)


    })


    })


    // Listen


    server.listen(3000)

    ```


    To serve the directory indexes with express, do the following:


    ```javascript

    var express =  require(''express'')


    var svIndex =  require(''serve-index'')


    var application = express()


    // Serving URLs like the /ftp/thing as public/ftp/thing


    application.use(''/ftp'', svIndex(''public/ftp'', {''icons'':  true}))


    application.listen()

    ```


    # Chapter 4- cookie- Sessions


    This is a module which is used for providing guest sessions so that each of the
    visitors will have a session, whether authenticated or not. In case the session
    is new, the property `Set-Cookie` will be produced, regardless of whether you
    are populating the session.


    It can be installed by use of the following command:


    `$ npm install cookie-session`


    For the API to be used in the program, we have to use the `require` command as
    shown below:


    ```javascript

    var cookieSession =  require(''cookie-session'')

    ```


    The following options are accepted in the cookie session in the options object:


    **Name**


    This is the name of the cookie which is to be set. Its default value is `session`.


    **Keys**


    This is the list of the keys to be used for signing and verifying the cookie values.
    Cookies which have been set are always signed with the `keys[0]`. The rest of
    the keys will then be valid for the purpose of verification, and this will allow
    for the rotation to be done.


    **Secret**


    This is a string which will be used as a secret key in case the `keys` are not
    provided. There is also a number of cookie options which you need to know how
    to use.


    If you need to destroy a particular session, do it as follows:


    ```javascript

    req.session =  null

    ```


    Consider the simple view counter example given below. Here is the example:


    ```javascript

    var cookieSession =  require(''cookie-session'')


    var express =  require(''express'')


    var application = express()


    appliation.set(''trust proxy'', 1) // trusting the first proxy


    application.use(cookieSession({


         name: ''session'',


         keys: [''key1'', ''key2'']


    }))


    application.use(function (req, res, next) {


         // Updating the views


    req.session.views = (req.session.views ||  0) +  1


         // Writing the response


    res.end(req.session.views + '' views'')


    })


    application.listen(3000)

    ```


    Consider the next example given below:


    ```javascript

    var cookieSession =  require(''cookie-session'')


    var express =  require(''express'')


