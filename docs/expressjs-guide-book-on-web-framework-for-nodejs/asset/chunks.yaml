- fmt: "\nYou have to note that the entire session object will be encoded and stored\
    \ in a cookie. The maximum cookie size limit on the different browsers can then\
    \ be exceeded. If the session object is large enough and it can exceed the limit\
    \ of the browser when it has been encoded, what will happen in most cases is that\
    \ the browser will refuse or avoid storing the cookie.\n\n# Chapter 5- Morgan\
    \ in ExpressJS\n\nThis is a logger middleware for the HTTP request for Node.js.\
    \ To use the API in your program, you have to use the `require` keyword as shown\
    \ below:\n\n```javascript\nvar morgan = require('morgan')\n```\n\nThe following\
    \ format is used for creating this:\n\n### morgan(format, options)\n\nAs shown\
    \ in the above format, we have two parameters or arguments.\n\nThe following properties\
    \ are accepted by Morgan in the options object:\n\n**Immediate**\n\nThe log line\
    \ should be written on request rather than on response. This will mean that the\
    \ requests will always be logged even if the server itself crashes, but it will\
    \ be impossible for us to log the data from the response.\n\n**Skip**\n\nThis\
    \ is a function used for the determination of whether or not logging was skipped.\
    \ The default value for this is `false`. Consider the example given below, which\
    \ shows how the function can be called:\n\n```javascript\n// EXAMPLE: only the\
    \ log error responses\nmorgan('combined', {\n  skip: function (req, res) { return\
    \ res.statusCode < 400 }\n})\n```\n\n**Stream**\n\nThis is an output stream which\
    \ is used for writing log lines, and its default value is `process.stdout`.\n\n\
    Consider the example given below, which shows how all the requests can be logged\
    \ in the Apache combined format to the STDOUT. Here is the example:\n\n```javascript\n\
    var express = require('express')\nvar morgan = require('morgan')\nvar application\
    \ = express()\n\napplication.use(morgan('combined'))\n\napplication.get('/', function\
    \ (req, res) {\n  res.send('hello, there!')\n})\n```\n\n### vanilla http server\n\
    \nAn example which demonstrates how this can be done is given below:\n\n```javascript\n\
    var fhandler = require('finalhandler')\nvar http = require('http')\nvar morgan\
    \ = require('morgan')\n\n// creating the \"middleware\"\nvar logger = morgan('combined')\n\
    \nhttp.createServer(function (req, res) {\n  var done = finalhandler(req, res)\n\
    \  logger(req, res, function (error) {\n    if (error) return done(error)\n\n\
    \    // responding to the request\n    res.setHeader('content-type', 'text/plain')\n\
    \    res.end('hello, there!')\n  })\n})\n```\n\n### Writing Logs to a File\n\n\
    Consider the example given below, which shows how the requests can be logged in\
    \ Apache combined format to our file `access.log`:\n\n```javascript\nvar express\
    \ = require('express')\nvar fs = require('fs')\nvar morgan = require('morgan')\n\
    var application = express()\n\n// creating a write stream (in the append mode)\n\
    var aLogStream = fs.createWriteStream(__dirname + '/access.log', {flags: 'a'})\n\
    \n// setting up the logger\napplication.use(morgan('combined', {stream: aLogStream}))\n\
    \napplication.get('/', function (req, res) {\n  res.send('hello, there!')\n})\n\
    ```\n\n### log file rotation\n\nIn the example given below, the app will log all\
    \ the requests in the Apache combined format to any of the log files in our directory\
    \ `log/` by use of the `file-stream-rotator` module. The example is as follows:\n\
    \n```javascript\nvar FStreamRotator = require('file-stream-rotator')\nvar express\
    \ = require('express')\nvar fs = require('fs')\nvar morgan = require('morgan')\n\
    var application = express()\nvar lDirectory = __dirname + '/log'\n\n// ensuring\
    \ the log directory exists\nfs.existsSync(lDirectory) || fs.mkdirSync(lDirectory)\n\
    \n// creating a rotating write stream\nvar aLogStream = FStreamRotator.getStream({\n\
    \  filename: lDirectory + '/access-%DATE%.log',\n  frequency: 'daily',\n  verbose:\
    \ false\n})\n\n// setting up the logger\napplication.use(morgan('combined', {stream:\
    \ aLogStream}))\n\napplication.get('/', function (req, res) {\n  res.send('hello,\
    \ there!')\n})\n```\n\n### Custom token formats\n\nIn the next app, we will use\
    \ the custom token formats. It works by adding an ID to all of the requests, and\
    \ will then display it by use of the `:id` token. Here is the app:\n\n```javascript\n\
    var express = require('express')\nvar morgan = require('morgan')\nvar id = require('node-uuid')\n\
    \nmorgan.token('id', function getId(req) {\n  return req.id\n})\n\nvar application\
    \ = express()\n\napplication.use(assignid)\napp.use(morgan(':id :method :url :response-time'))\n\
    \napp.get('/', function (req, res) {\n  res.send('hello, world!')\n})\n\nfunction\
    \ assignId(req, res, next) {\n  req.id = uuid.v4()\n  next()\n}\n```\n\n# Chapter\
    \ 6- CORS\n\nThis is a Node.js package which provides an ExpressJS/Connect middleware\
    \ which can be used for enabling of the various options for CORS.\n\nTo install\
    \ it via npm command, execute the command given below:\n\n```bash\n$ npm install\
    \ cors\n```\n\nThis can be used as shown below:\n\n```javascript\nvar express\
    \ = require('express')\n, cors = require('cors')\n, application = express();\n\
    \napplication.use(cors());\n\napplication.get('/products/:id', function(req, res,\
    \ next){\n  res.json({msg: 'This has CORS enabled for all the origins!'});\n});\n\
    \napplication.listen(80, function(){\n  console.log(' web server which is CORS\
    \ enabled listening on port 80');\n});\n```\n\nTo enable CORS for a single route,\
    \ do it as follows:\n\n```javascript\nvar express = require('express')\n, cors\
    \ = require('cors')\n, application = express();\n\napplication.get('/products/:id',\
    \ cors(), function(req, res, next){\n  res.json({msg: 'This has the CORS enabled\
    \ for all the origins!'});\n});\n\napplication.listen(80, function(){\n  console.log('\
    \ web server which is CORS enabled now listening on port 80');\n});\n```\n\nTo\
    \ configure the CORS, do it as follows:\n\n```javascript\nvar express = require('express')\n\
    , cors = require('cors')\n, application = express();\n\nvar cOptions = {\n  origin:\
    \ 'http://sample.com'\n};\n\napplication.get('/products/:id', cors(cOptions),\
    \ function(req, res, next){\n  res.json({msg: 'This has CORS enabled only for\
    \ sample.com.'});\n});\n\napplication.listen(80, function(){\n  console.log('\
    \ web server which is CORS-enabled is now listening on port 80');\n});\n```\n\n\
    ### Configuration of CORS w/ Dynamic Origin can be done as follows:\n\n```javascript\n\
    var express = require('express')\n, cors = require('cors')\n, application = express();\n\
    \nvar whitelist = ['http://sample1.com', 'http://sample2.com'];\nvar cOptions\
    \ = {\n  origin: function(origin, callback){\n    var orIsWhitelisted = whitelist.indexOf(origin)\
    \ !== -1;\n    callback(null, orIsWhitelisted);\n  }\n};\n\napplication.get('/products/:id',\
    \ cors(cOptions), function(req, res, next){\n  res.json({msg: 'This has CORS enabled\
    \ for the whitelisted domain.'});\n});\n\napplication.listen(80, function(){\n\
    \  console.log('CORS-enabled web server listening on port 80');\n});\n```\n\n\
    ### How to enable CORS Pre-Flight\n\nCertain requests for CORS are considered\
    \ to be complex, and these need an initial OPTIONS request. A CORS request which\
    \ uses the HTTP verb is considered to be complex compared to the one which uses\
    \ POST/GET/HEAD or the one using custom headers. For pre-fighting to be enabled,\
    \ a new OPTIONS handler has to be added for the route which needs to be supported.\
    \ This is shown below:\n\n```javascript\nvar express = require('express')\n, cors\
    \ = require('cors')\n, application = express();\n\napplication.options('/products/:id',\
    \ cors()); // enabling a pre-flight request for the DELETE request\napplication.del('/products/:id',\
    \ cors(), function(req, res, next){\n  res.json({msg: 'This has CORS enabled for\
    \ all the origins!'});\n});\n\napplication.listen(80, function(){\n  console.log('\
    \ The web server which is CORS-enabled is listening on port 80');\n});\n```\n\n\
    Pre-flight can also be enabled across the board as shown below:\n\n```javascript\n\
    application.options('*', cors()); // including before the other routes\n```\n\n\
    ### Asynchronous configuration of CORS\n\n```javascript\nvar express = require('express')\n\
    , cors = require('cors')\n, application = express();\n\nvar whitelist = ['http://sample1.com',\
    \ 'http://sample2.com'];\nvar cOptionsDelegate = function(req, callback){\n  var\
    \ cOptions;\n  if(whitelist.indexOf(req.header('Origin')) !== -1){\n    cOptions\
    \ = { origin: true }; // reflecting (enabling) the requested origin in our CORS\
    \ response\n  }else{\n    cOptions = { origin: false }; // disabling the CORS\
    \ for our request\n  }\n}\n```\n"
