    # Chapter 15- [express-namespace](https://github.com/expressjs/express-namespace)


    With this, namespaced routing capabilities are added to Express. To install it
    into the system, one can execute the following command:


    $ npm install express-namespace


    Consider the example given below, which can be used for responding to any of the
    requests. Here is the example:


    GET /forum/12


    GET /forum/12/view


    GET /forum/12/edit


    GET /forum/12/thread/5


    DELETE /forum/12


    For the module to be used, one must use the “app.namespace()” and “require(''express-namespace'').”
    The module will then be made available to you.


    To use it, we have to pass a callback function, and then perform a routing to
    the method. After each of the callbacks, the invocation will be completed, and
    the namespace will be stored together with its state. This is shown below:


    application.namespace(''/forum/:id'', function(){


    application.get(''/(view)?'', function(req, res){


    res.send(''GET forum '' + req.params.id);


    });


    application.get(''/edit'', function(req, res){


    res.send(''GET forum '' + req.params.id + '' edit the page'');


    });


    application.namespace(''/thread'', function(){


    application.get(''/:tid'', function(req, res){


    res.send(''GET forum '' + req.params.id + '' thread '' + req.params.tid);


    });


    });


    application.del(''/'', function(req, res){


    res.send(''DELETE the forum '' + req.params.id);


    });


    });


    The current namespace can also be accessed via the “app.currentNamespace.” You
    should also know how to run the tests. However, before doing this, make sure that
    you have all of the sub-modules installed into the system. These can be installed
    by executing the following command:


    $ git submodule update –init


    The tests can be run by executing the following command:


    $ make test


    That is how the module can be used.


    # Chapter 16- [express-expose](https://github.com/expressjs/express-expose)


    This is used for exposing the objects, functions, and raw js to the client side.
    This feature is good for sharing of settings, utils, and the current data for
    the user. The helpers and the local variables are also exposed to the client side.


    To install this module, execute the command given below:


    npm install -S express-expose


    It can be used as shown below:


    var express =  require(''express'');


    var expose =  require(''express-expose'');


    application = expose(application);


    application.expose(...);


    The above is how the module can be used in express 4.x. In express 2.x and 3.x,
    it can be done as follows:


    var express =  require(''express'');


    var expose =  require(''express-expose'');


    application.expose(...);


    How to express the objects


    One way that objects can be exposed to the client side is by exposing the properties,
    and most probably the Express configuration. When the “app.expose(object)” is
    exposed, the properties will be exposed to the “application.*” The example given
    below shows how this can be done:


    application.set(''views'', __dirname  + ''/views'');


    application.set('' the view engine '', ''jade'');


    application.set(''title'', '' Sample '');


    application.set(''default language'', ''en'');


    application.expose(application.settings);


    Helper methods can also be exposed by another use case. This can be in the same
    way that you are currently exposing. This is shown below:


    application.expose({ en: ''English'', fr: ''French'' }, ''application'', ''languages'');


    You then need to output your default buffer to your template. For jade users,
    it can be done as follows:


    script!= javascript


    For EJS users, this can be done as follows:


    <script><%- javascript %></script>


    Raw JavaScript strings can also be exposed as shown below:


    application.expose(''var some = "variable";'');


    Exposing Functions


    A named function can easily be exposed. You only have to pass it with a default
    name for the buffer to replace it with a template name. An example of this is
    shown below:


    application.expose(function someFunction(){


    return ''yes'';


    }, ''foot'');


    That is how it can be done.


    Self-Calling Functions


    An anonymous function can also be passed, and this will execute itself so as to
    create a wrapper function. Consider the example given below, which shows how this
    can be done:


    application.expose(function(){


    function notify() {


    alert(''this will be executed finely:D'');


    }


    notify();


    });


    That is how it can be done.


    Request-Level Exposure


    All the above which has been discussed can be applied to the request-level. Consider
    the example given below showing how to do this. Here is the example:


    application.get(''/'', function(req, res){


    var user = { name: ''john'' };


    res.expose(user, ''application.current.user'');


    res.render(''index'', { layout:  false });


    });


    # Chapter 17- connect-render


    This is a helper for the template render in connect. It can be installed by executing
    the following command:


    $ npm install connect-render


    It can be used as shown below:


    var connect =  require(''connect'');


    var render =  require(''connect-render'');


    var application = connect(


    render({


    root:  __dirname  + ''/views'',


    layout: ''layout.html'',


    cache:  true, // `false` for the debug


    helpers: {


    sitename: ''connect-render sample site'',


    starttime:  new Date().getTime(),


    now:  function (req, res) {


    return  new Date();


    }


    }


    })


    );


    application.use(function (req, res) {


    res.render(''index.html'', { url: req.url });


    });


    application.listen(8080);


    The API can be used as shown below:


    /**


    * connect-render: A Template Render helper for the connect


    *


    * Use case:


    *


    * var render = require(''connect-render'');


    * var connect = require(''connect'');


    *


    * connect(


    *   render({


    *     root: __dirname + ''/views'',


    *     cache: true, // must be set to `true` in the production env


    *     layout: ''layout.html'', // or false if there is no layout


    *     open: "<%",


    *     close: "%>", // the default ejs close tag is ''%>''


    *     helpers: {


    *       config: config,


    *       sitename: ''NodeBlog Engine'',


    *       _csrf: function (req, res) {


    *         return req.session ? req.session._csrf : "";


    *       },


    *     }


    *   });


    * );


    *


    * res.render(''index.html'', { title: ''Index Page'', items: items });


    *


    * // no layout


    * res.render(''blue.html'', { items: items, layout: false });


    *


    * @param {Object} [options={}] for the render options.


    *  - {String} layout, layout name, the default one is `''layout.html''`.


    *    Set `layout=''''` or `layout=false` meaning that no layout.


    *  - {String} root, the root dir for view files.


    *  - {Boolean} cache, the cache view content, the default is `true`.


    *    Must be set `cache = true` on production.


    *  - {String} viewExt, the view file extname, the default is `''''`.


    * @return {Function} rendering middleware for the `connect`


    */


    function middleware(options) {}


    # Conclusion


    It can be said that ExpressJS is a Node framework. It provides developers with
    a framework which they can use to create web and mobile applications. It has numerous
    features which developers can take advantage of so as to create their applications.
    It works by use of its middleware. The framework also provides developers with
    numerous modules which they can use for the development of their applications.'
