    ```javascript\nvar express = require('express')\n, cors = require('cors')\n, application\
    \ = express();\n\nvar cOptions = {\n  origin: 'http://sample.com'\n};\n\napplication.get('/products/:id',\
    \ cors(cOptions), function(req, res, next){\n  res.json({msg: 'This has CORS enabled\
    \ only for sample.com.'});\n});\n\napplication.listen(80, function(){\n  console.log('\
    \ web server which is CORS-enabled is now listening on port 80');\n});\n```\n\n\
    ### 使用动态来源配置 CORS 可以按如下方式完成：\n\n```javascript\nvar express = require('express')\n\
    , cors = require('cors')\n, application = express();\n\nvar whitelist = ['http://sample1.com',\
    \ 'http://sample2.com'];\nvar cOptions = {\n  origin: function(origin, callback){\n\
    \    var orIsWhitelisted = whitelist.indexOf(origin) !== -1;\n    callback(null,\
    \ orIsWhitelisted);\n  }\n};\n\napplication.get('/products/:id', cors(cOptions),\
    \ function(req, res, next){\n  res.json({msg: 'This has CORS enabled for the whitelisted\
    \ domain.'});\n});\n\napplication.listen(80, function(){\n  console.log('CORS-enabled\
    \ web server listening on port 80');\n});\n```\n\n### 如何启用 CORS 预检\n\n某些 CORS\
    \ 请求被认为是复杂的，这些请求需要一个初始的 OPTIONS 请求。使用 HTTP 动词的 CORS 请求与使用 POST/GET/HEAD 或使用自定义标头的请求相比，被认为是复杂的。要启用预检，需要为需要支持的路由添加一个新的\
    \ OPTIONS 处理程序。如下所示：\n\n```javascript\nvar express = require('express')\n, cors\
    \ = require('cors')\n, application = express();\n\napplication.options('/products/:id',\
    \ cors()); // 为 DELETE 请求启用预检\napplication.del('/products/:id', cors(), function(req,\
    \ res, next){\n  res.json({msg: 'This has CORS enabled for all the origins!'});\n\
    });\n\napplication.listen(80, function(){\n  console.log(' The web server which\
    \ is CORS-enabled is listening on port 80');\n});\n```\n\n也可以全局启用预检，如下所示：\n\n\
    ```javascript\napplication.options('*', cors()); // 在其他路由之前包含\n```\n\n### CORS\
    \ 的异步配置\n\n```javascript\nvar express = require('express')\n, cors = require('cors')\n\
    , application = express();\n\nvar whitelist = ['http://sample1.com', 'http://sample2.com'];\n\
    var cOptionsDelegate = function(req, callback){\n  var cOptions;\n  if(whitelist.indexOf(req.header('Origin'))\
    \ !== -1){\n    cOptions = { origin: true }; // 在 CORS 响应中反映（启用）请求的来源\n  }else{\n\
    \    cOptions = { origin: false }; // 为我们的请求禁用 CORS\n  }\n}\n```\n\n"
