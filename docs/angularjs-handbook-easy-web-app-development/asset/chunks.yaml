    # Chapter 6- $watch() , $digest(), and $apply()


    These methods are widely used in AngularJS. You should learn how to use these
    in Angular.


    After the creation of data binding somewhere in one''s view to a variable on the
    object `$scope`, a "watch" will be internally created by the Angular. With the
    watch, it will mean that it will watch what is contained in the `$scope` object.
    This will be an indication that the framework will be watching the variable. To
    create watches, we use the function `$scope.$watch()`.


    In most cases, the functions `$scope.$digest()` and `$scope.$watch()` can be called
    on your behalf, but in some other cases, you might have to call them yourself.
    This is why you should know and understand how these work.


    The function `$scope.$apply` is used for execution of a particular code, and then
    the function `$scope.$digest()` is called after that. This will have all of the
    watches checked and all of the corresponding functions for the watch listener
    called. The function `$apply()` is good when it comes to integration of the AngularJS
    code with any other code.


    ## $watch()


    The function `$scope.watch()` is used for creation of a watch of a particular
    variable. Once a watch has been registered, two parameters have to be passed to
    the `$watch()` function. These two parameters include the following:


    *   A value function

    *   A listener function


    Consider the example given below showing how this can be done:


    ```javascript

    $scope.$watch(function() {},


          function() {}


    );

    ```


    The first function represents the value function, while the second function represents
    the listener function. With the value function, the value which is being watched
    will be returned. It is then the work of the AngularJS to check the value which
    has been returned against the one that was returned by the watch function last
    time. AngularJS has changed the way in which checking of whether a value was returned
    can be done. An example of this is shown below:


    ```javascript

    $scope.$watch(function(scope) { return scope.data.myVariable },


         function() {}


    );

    ```


    With the above function, the value `scope.data.myVariable` will be returned by
    the value function. In case the value for this variable is changed, then a different
    value will have to be returned. The listener function will then be called by the
    AngularJS.


    If the value has been changed, the listener function will try to do whatever that
    it can do. By use of this value, the value function will be in a position to access
    the `$scope` together with its variables. The global variables can also be watched
    by the value function in case it is needed, but most often, the variable `$scope`
    will be watched.


    If the value is changed, the listener function can do whatever that it needs to
    do. For some, they might need to change the content of the variable while with
    others, they might need to change the content of an HTML element. Consider the
    example given below:


    ```javascript

    $scope.$watch(function(scope) { return scope.data.myVariable },


    function(nValue, oValue) {


        document.getElementById("").innerHTML =


         "" + newValue + "";


    }


    );

    ```


    The above example will set the inner HTML of the HTML element to the new value
    of the variable, and this has been embedded in the `b` element for the value of
    making the content bold.


    ## $digest()


    The function `$scope.$digest()` will iterate through the watches in the object
    `$scope` and the child `$scope` object. When the function `$digest()` has iterated
    through the watches, the value function for each watch will be called. If the
    value returned by our value function is found to be different to the value which
    it had returned last time that it was called, the listener function for the watch
    will then be called.


    Whenever AngularJS finds it necessary, it just calls the `$digest()` function.
    Situations may be found in which the AngularJS does not call the `$digest()` function.
    To solve this problem, just call the function `$scope.$digest()`.


    ## $apply()


    The function `$scope.$apply()` will take a function as a parameter which has been
    executed, and then the function `$scope.$apply()` will internally be called. This
    is a way for you to ensure that all of the watches have been checked. All of the
    data bindings will then be refreshed.


    Consider the example given below:


    ```javascript

    $scope.$apply(function() {


    $scope.data.myVariable = "A new value";


    });

    ```


    Once a function has been passed to this function as a parameter, the value of
    `$scope.data.myVar` will be changed. Once the function has exited, the function
    `$scope.$digest()` will be called by the AngularJS, meaning that the watches will
    be checked for the changes in the watched values.


    Consider the example given below, which shows how these functions can be used
    in AngularJS:


    ```html

    <div ng-controller="appController">


    {{data.time}}


    <br/>


    <button ng-click="updateTime()">update time - ng-click</button>


    <button id="upTimeButton"  >change time</button>


    </div>


    <script>


    var module       = angular.module("myapplication", []);


    var appController1 = module.controller("appController", function($scope) {


    $scope.data = { time : new Date() };


    $scope.updateTime = function() {


    $scope.data.time = new Date();


    }


    document.getElementById("upTimeButton")


    .addEventListener(''click'', function() {


    console.log("change time clicked");


    $scope.data.time = new Date();


    });


    });


    </script>

    ```


    With the above example, the variable `$scope.data.time` will be bound to an interpolation
    directive which will merge the variable value to a HTML page. With this binding,
    a watch will be internally created in the variable `$scope.data.time`.


    We have created two buttons for our application. The first button has a listener
    of type `ng-click` attached to it. Clicking of this button will call the function
    `$scope.updateTime()`, and then the AngularJS updates the bindings by calling
    the function `$scope.$digest()`.


    A JavaScript event listener has been attached to the second button. This listener
    will be executed once the second button has been clicked. The only difference
    between the two listeners is that with the one for the second button, the data
    bindings are not updated once the second button has been clicked. The reason behind
    this is that the function `$scope.$digest()` will not be called after the execution
    of the event listener for the second button. This means that the clicking of the
    second button will have the effect of updating the time in the variable `$scope.data.time`,
    but this new time will not be displayed for visibility.


    For us to solve this problem, the call for `$scope.$digest()` can be added to
    the last line of the event listener. This is shown in the example given below:


    ```javascript

    document.getElementById("upTimeButton")


    .addEventListener(''click'', function() {


    console.log("change time clicked");


    $scope.data.time = new Date();


    $scope.$digest();


    });

    ```


    The addition of the above call has been done in the last line of the program.
    That is how it should be done.

