    # Chapter 7- The Hierarchy of “$scope”


    The object “$scope” for AngularJS, which is used by views, is organized into an
    hierarchy. We begin with the root scope, which is then made up of one or more
    children. Each of the available views is made up of its own scope, which is just
    the child of the root scope. This means that whatever variable that the view controller
    has set on the variable “$scope” will be invisible to the controllers.


    Consider the AngularJS code given below as an example:


    <!DOCTYPE html>


    <html lang="en">


    <head>


    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.2.5/angular.min.js"></script>


    </head>


    <body ng-app="myapplication">


    <div ng-controller="appController1">


    {{data.theVariable}}


    </div>


    <div ng-controller="appController2">


    {{data.theVariable}}


    </div>


    <script>


    var module       = angular.module("myapplication", []);


    var appController1 = module.controller("appController1", function($scope) {


    $scope.data = { theVariable : "first value"};


    });


    var appController2 = module.controller("appController2", function($scope) {


    $scope.data = { theVariable : "second value"};


    });


    </script>


    </body>


    </html>


    In the above example, we have used two views, and each of the views has its own
    controller. Each controller will set the “data.theVariable” variable to a different
    value.


    Once the program has been executed, you will get the following hierarchy:


    Root $scope


    *   $scope for appController 1


    *   $scope for appController 2


    As shown above, the two views have used different scope objects. With the example,
    two different values will also be written for the “{{data.theVar}}” data bindings
    inside our two views. Different values will also be set for the variable “data.theVariable”
    in the “$scope” object.


    # Chapter 8- Refactoring AngularJS Apps


    Directives which are component-based are increasingly becoming popular in AngularJS.
    The reason for this is the ease of use associated with components. However, most
    apps for Angular which are in use today are not based on components.


    For Angular2 users, components can be used as follows:


    < confirmation


        [message]="''Start firing?''"


           (ok)="startFiring()">


    </ confirmation>


    As shown in the above example, a component is just an element in custom HTML,
    and it matches a component name which has been defined somewhere else. Each component
    has its inputs and outputs, and these are supplied as properties to the element.


    The above component can also be defined as shown below:


    @Component({


    selector: ''confirmation'',


    properties: [''message''],


    events: [''ok'']


    })


    @View({


    template: `


    <div>


    {{message}}


        <button (click)="ok()">OK</button>


         </div>


    `})


    class Confirmation {


        okEvents = new EventEmitter();


        ok() {


         this.okEvents.next();


    }


    }


    An interface boundary definition is used for specification of the inputs and outputs
    which the component can work with. The UI template has been used for definition
    of the user interface for our users. The component logic has been used behind
    the UI template to define the behavior of the component and what it does when
    the user is interacting with it. The definition of a component as a directive
    can be done as shown below:


    @Component({


        selector: ''confirmation'',


         properties: [''message''],


        events: [''ok'']


    })


    @View({


    template: `


        <div>{{message}}


        <button (click)="ok()">OK</button>


    </div>


    `


    })


    class Confirmation {


         okEvents = new EventEmitter();


         ok() {


         this.okEvents.next();


    }


    }


    The above code is completely different from what we had before.


    Refactoring can easily be done or used in AngularJS. We want to give an example
    of how this can be done:


    Consider the code given below for the file “index.html”:


    <div ng-include="''bar.html''">


    </div>


    For the above to be replaced, we will have to create a directive for “bar.” This
    will use the inherited scope and the template “bar.htm.”


    The code for “bar_directive.js” should be as follows:


    module.directive(''bar'', function() {


    return {


         scope: true,


         templateUrl: ''bar.html''


    };


    });


    For this to work effectively, both the directive and the template have to be co-located
    and their names should also match. This is shown below:


    components/foobar/


    *   bar_directive.js


    *   bar.html


    The original “ng-inlude” should then be replaced with the new directive. This
    is shown below:


    <div ng-include="''footbar.html''">


         </div>


    <footbar></footbar>


    After the addition of the above component directive, that is, “footbar,”  the
    template itself will look as shown below:


    <div ng-controller="FoobarCtrl as c">


         <p>{{c.getText()}}</p>


    </div>


    We then want to move and then rename the file which has the FootCtrl so that it
    becomes co-located with our component directive. This is shown below:


    components/foobar/


    *   bar_directive.js


    *   bar_controller.js


    *   bar.html


    The controller should then be used in the directive, and then the same ctrl alias
    that our “ng-controller” will be used. The file “bar_diretive.js” should be as
    follows:


    module.directive(''foobar'', function() {


    return {


        scope: true,


        controller: ''FoobarCtrl'',


        controllerAs: ''ctrl'',


        templateUrl: ''bar.html''


    };


    });


    The wrapper “ng-controller” can now be removed from the template. This is shown
    below:


    <div ng-controller="FooBarCtrl as c">


    <p>{{c.getText()}}</p>


    </div>


    One can also choose to keep this element for the purpose of styling, and then
    the attribute “ng-controller” is  removed.


    Consider the example given below:


    <div ng-controller="FoobarCtrl as c"


    class=" foo-bar">


    <p>{{c.getText()}}</p>


    </div>


    In the above example representing a template, we have an “ng-controller.”  It
    has been used to instantiate a “FoobarCtrl” and then alias it as “c.”


    We now need to create a new directive. This should then create an inherited scope,
    and then use the “FoobarCtrl” and then alias it as “c.”  This is shown below:


    module.directive(''bar'', function() {


    return {


        scope: true,


        controller: ''FoobarCtrl'',


        controllerAs: ''c''


    };


    });


    Our new directive and the controller in existence will be moved to the same location.
    The two should also have the same prefix. This is shown below:


    components/foobar/


    *   bar_directive.js


    *   bar_controller.js


    Finally, in the original template, the “ng-controller” can be replaced with an
    instance of the component “foobar.” This is shown below:


    <div ng-controller="FoobarCtrl as c"


    class="foo-bar">


    <foobar class="foo-bar">


    <p>{{c.getText()}}</p>


    </foobar>


    </div>


    This is what we have for now:


    <div ng-controller="FoobarCtrl as c"


    class="foo-bar">


    <foobar class="foo-bar">


    <p>{{c.getText()}}</p>


    </foobar>


    </div>


    A template file should then be created for the component directive. This is shown
    below:


    components/foobar/


    *   bar_directive.js


    *   bar_controller.js


    *   bar.html


    The new template should then be referenced from the directive. This can be done
    as follows:


    module.directive(''foobar'', function() {


    return {


    scope: true,


    controller: ''FoobarCtrl'',


    controllerAs: ''c'',


    templateUrl: ''bar.html''


    };


    });


    We will then use what was contained in the directive element so as to populate
    the new template. This is shown below:


    <p>{{c.getText()}</p>'
