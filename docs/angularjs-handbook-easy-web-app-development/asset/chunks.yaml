  trans: "\n\n![](img/00001.jpeg)\n\nAngularJS 手册\n\n轻松开发 Web 应用\n\n作者：Rick L.\n\n\
    版权所有 © 2016 Rick L.\n\n保留所有权利\n\n版权所有 © 2016 年 Rick L.\n\n保留所有权利。未经作者事先书面许可，不得以任何形式或任何方式（包括影印、录制或其他电子或机械方法）复制、分发或传播本出版物的任何部分，除非在版权法允许的批评性评论和某些其他非商业用途中包含的简短引用。\n\
    \n## 目录\n\n第 1 章 - AngularJS 概述\n\n第 2 章 - AngularJS 与 HTML\n\n第 3 章 - XHR\n\n\
    第 4 章 - 链接与图片\n\n第 5 章 - 使用动画\n\n第 6 章 - $watch()、$digest() 和 $apply()\n\n第 7\
    \ 章 - “$scope”的层次结构\n\n第 8 章 - 重构 AngularJS 应用\n\n结论\n\n## 免责声明\n\n尽管已尽力验证本书中提供的信息，但作者对其中包含的主题内容的错误、遗漏或相反解释不承担任何责任。本书提供的信息仅供教育和娱乐之用。读者应对自己的行为负责，作者不承担因使用这些信息而产生的任何责任或损害（无论是实际还是感知的）。\n\
    \n所使用的商标未经任何同意，商标的发布未经商标所有者的许可或支持。本书中的所有商标和品牌仅用于说明目的，归其所有者所有，与本文件无关。\n\n# 第 1\
    \ 章 - AngularJS 概述\n\n该框架通过扩展 HTML 提供的功能来工作。如果 HTML 是为了开发 Web 应用而创建的，那么它就会是 AngularJS。HTML\
    \ 在声明静态文档方面表现最佳。然而，它并不适合在我们的 Web 应用中声明动态视图。使用 Angular，可以极大地扩展应用中使用的 HTML 词汇。完成此操作后，您将获得一个易于阅读、表达力强且开发速度更快的环境。\n\
    \n在本书中，我们将探讨 AngularJS 的各种特性，作为开发人员，您可以利用这些特性来改善应用的外观和感觉。\n\n# 第 2 章 - [AngularJS](https://github.com/angular/bower-material)\
    \ 与 HTML\n\n如您所知，AngularJS 用于扩展 HTML 的功能。大多数人都知道如何使用标准 HTML。然而，AngularJS 用于扩展其功能。在本章中，我们想要创建一个\
    \ HTML 页面，然后将用 HTML 编写的代码转换为模板，该模板将由 AngularJS 使用，以便动态显示相同的数据。HTML 页面中只会添加基本信息。\n\
    \n以下是网页的第一个代码：\n\n```html\n<ul>\n<li>\n   <span> Motorola </span>\n<p>\n    I\
    \ really like Motorola phones.\n</p>\n</li>\n<li>\n    <span>Nokia are the best\
    \ in Wi-Fi connection</span>\n<p>\n    I really like to make use of devices.\n\
    </p>\n</li>\n</ul>\n```\n\n您可以继续向上述文件添加静态 HTML。下面给出了一个示例：\n\n```html\n<p> The\
    \ number of available phones is: 2</p>\n```\n\n在示例中，我们仅使用静态 HTML 来呈现我们刚刚创建的网页内容。使用\
    \ AngularJS，可以动态呈现相同的内容。\n\n我们的目标是使我们创建的页面变得动态。还应实现一个测试用例，以便测试我们创建的控制器。在 AngularJS\
    \ 中，使用 MV 模型（模型-视图-控制器）来组织应用的结构。通过这种方式，代码被解耦，并实现了关注点分离的概念。模型、视图和控制器将被添加到这个应用中。Angular\
    \ 中的工作方式是，模型通过视图投影到模板中。这表明，如果某些内容发生变化，所有绑定点也会更新，以便视图得到更新。在 Angular 中，视图是从模型构建的。\n\
    \n考虑下面给出的示例：\n\n```html\n<html ng-app=\"myApp\">\n<head>\n...\n<script src=\"\
    myapps/angular/angular.js\"></script>\n<script src=\"js/controllers.js\"></script>\n\
    </head>\n  <body ng-controller=\"mply “Repeat”?PnListCtrl\">\n<ul>\n<li ng-repeat=\"\
    model in phones\">\n<span>{{model.name}}</span>\n<p>{{model.snippet}}</p>\n  \
    \  </li>\n  </ul>\n</body>\n</html>\n```\n\n您应该注意到，硬编码的手机列表已被 AngularJS 表达式和 `ngRepeat`\
    \ 指令所取代。\n\n应用的控制器应该只是一个构造函数，它将接受参数 `$scope`。如下所示：\n\n```javascript\nvar myApp\
    \ = angular.module('myApp', []);\n   myApp.controller('PhoneListCtrl', function\
    \ ($scope) {\n$scope.phones = [\n   {'name': 'Motorola,\n'snippet': ' I really\
    \ like Motorola phones.\n.'},\n  {'name': ' Nokia are the best in Wi-Fi connection\
    \ ',\n   'snippet': 'Their devices are really liked by many.'},\n   {'name': 'MOTOROLA\
    \ XOOM™',\n  'snippet': ' I really like to make use of devices.\n.'}\n];\n});\n\
    ```\n\n我们所做的是声明了控制器，然后最终将其链接到模块。\n\n### 测试\n\n在 AngularJS 中，控制器和视图是分离的。这样，即使在开发过程中，代码也变得可测试。如果控制器在全局空间中可用，那么我们可以模拟\
    \ `scope` 对象来实例化它。如下例所示：\n\n```javascript\ndescribe('PnListCtrl', function(){\n\
    \   it(' a \"phones\" model with 2 phones should be created', function() {\nvar\
    \ scope = {},\n   ctrl = new PnListCtrl(scop);\n   expect(scop.phones.length).toBe(2);\n\
    });\n});\n```\n\n然后应该创建非全局控制器。没有人希望他们的控制器函数位于全局命名空间中。相反，大多数人希望它通过我们刚刚创建的模块的匿名构造函数进行注册。\n\
    \n在这种情况下，我们将由 AngularJS 的 `$controller` 服务来证明。该服务将负责通过名称检索控制器。考虑下面给出的示例，展示了如何实现这一点：\n\
    \n```javascript\ndescribe('PnListCtrl', function(){\n   beforeEach(module('pncatApp'));\n\
    \   it('you should create \"phones\" model with the 2 phones', inject(function($controller)\
    \ {\nvar scope = {},\n   ctrl = $controller('PnListCtrl', {$scope:scope});\n \
    \  expect(scope.phones.length).toBe(2);\n}));\n});\n```\n\n我们所做的是指示 Angular 在任何测试之前加载每个模块。然后应将\
    \ `$controller` 服务注入到我们的服务中。该服务还用于创建新的 `PnListCtrl`。然后使用该实例进行验证。\n\n### 实验\n\n\
    可以向文件添加另一个绑定。如下所示：\n\n```html\n<p>The available number of phones: {{phones.length}}</p>\n\
    ```\n\n可以在控制器中创建一个新的模型属性，然后从模板进行绑定。下面给出了一个示例：\n\n```javascript\n$scope.name =\
    \ \"John\";\n```\n\n可以按如下方式将新绑定添加到文件：\n\n```html\n<p>Hi, {{name}}!</p>\n```\n\n\
    现在您可以刷新浏览器并观察发生了什么。然后应更新 `./test/unit/controllersSpec.js` 中的控制器单元测试，以反映新的更改。\n\
    \n"
- fmt: "\nA repeater for the creation of a simple table should then be created in\
    \ the file. This can be implemented as follows:\n\n```\n<table>\n   <tr><th>the\
    \ row number</th></tr>\n   <tr ng-repeat=\"j in [0, 1, 2, 3, 4, 5, 6, 7]\"><td>{{j}}</td></tr>\n\
    </table>\n```\n\nThe list should then be modified to the following:\n\n```\n<table>\n\
    \  <tr><th>the row number</th></tr>\n  <tr ng-repeat=\"j in [0, 1, 2, 3, 4, 5,\
    \ 6, 7]\"><td>{{j+1}}</td></tr>\n</table>\n```\n\nThe `ng-repeat` can be used\
    \ for the creation of another table with some other specifications. That is also\
    \ very powerful in Angular. At this point, you will have an app working dynamically\
    \ and it has the model, the view, and the controller located separately.\n\n#\
    \ Chapter 3- XHRs\n\nYou should not always handle small and hard-coded data in\
    \ your application. We should be able to fetch large data sets from our AngularJS\
    \ servers by the use of the pre-built services named `$http`.\n\nWe will have\
    \ the file `app/phones/devices.json`, which has the list of phones that we have.\
    \ These will be stored in a JSON format. A sample part of the file looks as follows:\n\
    \n```\n[\n  {\n    \"age\": 15,\n    \"id\": \"motorola \",\n    \"name\": \"\
    Motorola DEFY\\u2122 with MOTOBLUR\\u2122\",\n    \"snippet\": \"Do you enjoy\
    \ using Motorola devices and phones?\"\n  },\n  ...\n]\n```\n\n## Controller\n\
    \nThe `$http` service for Angular will be used in the controller for making an\
    \ HTTP request to the web server so as to fetch data from the file `app/phones/devices.json`.\
    \ This is just one of the ways how this can be handled or the processing of operations\
    \ related to web apps. With AngularJS, these services are injected where they\
    \ are needed.\n\nThe code for the controller should be as shown below:\n\n```\n\
    var myApp = angular.module('myApp', []);\nmyApp.controller('PnListCtrl', function\
    \ ($scope, $http) {\n  $http.get('phones/devices.json').success(function(data)\
    \ {\n    $scope.phones = data;\n  });\n  $scope.orderProp = 'age';\n});\n```\n\
    \nFor a service to be used in Angular, the names of the dependencies which are\
    \ needed have to be defined as arguments to the controller constructor function.\
    \ This is shown below:\n\n```\nmyApp.controller('PnListCtrl', function ($scope,\
    \ $http) {...}\n```\n\nThe dependency constructor in AngularJS will provide the\
    \ services to our controller once it has been launched. The process of creating\
    \ any of the transitive dependencies which the service may have is also taken\
    \ care of. Consider the example given below, showing how this can be done:\n\n\
    ```\nvar myApp = angular.module('myApp', []);\nmyApp.controller('PnListCtrl',\
    \ ['$scope', '$http',\n  function ($scope, $http) {\n    $http.get('phones/devices.json').success(function(data)\
    \ {\n      $scope.phones = data;\n    });\n    $scope.orderProp = 'age';\n  }\n\
    ]);\n```\n\nThe test can be done as follows:\n\n```\ndescribe('myApp controllers',\
    \ function() {\n  describe('PnListCtrl', function(){\n    var scope, ctrl, $httpBackend;\n\
    \n    // Loading our app module definition before the test.\n    beforeEach(module('myApp'));\n\
    \n    // The injector will ignore the leading and the trailing underscores here\
    \ (i.e. _$httpBackend_).\n    // This will allow us to inject the service but\
    \ also attach it to the variable\n    // with a name which is same as the service\
    \ so as to avoid a name conflict.\n    beforeEach(inject(function(_$httpBackend_,\
    \ $rootScope, $controller) {\n      $httpBackend = _$httpBackend_;\n      $httpBackend.expectGET('phones/devices.json').\n\
    \        respond([{name: 'Motorola'}, {name: 'Motorola Phone'}]);\n      scope\
    \ = $rootScope.$new();\n      ctrl = $controller('PnListCtrl', {$scope: scope});\n\
    \    }));\n  });\n});\n```\n\nNotice the two helper functions in the above test\
    \ case. These can be used for configuration and accessing the injector.\n\nConsider\
    \ the code given below:\n\n```\nit('You should create \"phones\" model having\
    \ 2 phones which have been fetched from the xhr', function() {\n  expect(scope.phones).toBeUndefined();\n\
    \  $httpBackend.flush();\n  expect(scope.phones).toEqual([{name: 'Motorola'},\n\
    \    {name: 'Motorola Phone'}]);\n});\n```\n\nWe want to perform a verification\
    \ on our model which does not exist on the scope before we have received the response.\
    \ After calling the function `$httpBackend.flush()`, the request queue will be\
    \ flushed into the browser. The promise which is returned by the service `$http`\
    \ will be resolved with our resolved response. We will make the assertions, and\
    \ then verify whether the model belongs to the scope. We can then verify whether\
    \ the `orderProp` has been set correctly. This is shown below:\n\n```\nit('the\
    \ default value should be set for the orderProp model', function() {\n  expect(scope.orderProp).toBe('age');\n\
    });\n```\n\nIn the karma tab, the following output should be observed:\n\n```\n\
    Chrome 22.0: Executed 2 of 2 SUCCESS (0.028 secs / 0.007 secs)\n```\n\n`<pre>{{phones\
    \ | filter:query | orderBy:orderProp | json}}</pre>` can be added at the bottom\
    \ of the file so that the available phones can be listed or shown in a JSON format.\
    \ The following can be added to the callback:\n\n```\n$scope.devices = data.splice(0,\
    \ 5);\n```\n\n# Chapter 4- Links & Images\n\nYou should know how to add thumbnail\
    \ images to the devices that you have in your list. Links should also be added\
    \ to these.\n\nNote that in the JSON file, the links for the devices and their\
    \ URLs are available, as well as unique IDs. The URLs should be pointing to the\
    \ URL `app/img/devices/`.\n\nConsider the code snippet given below:\n\n```\n[\n\
    \  {\n    ...\n    \"id\": \"motorola \",\n    \"imageUrl\": \"img/phones/motorola.0.jpg\"\
    ,\n    \"name\": \"Motorola PHONE \",\n    ...\n  },\n  ...\n]\n```\n\nThe template\
    \ should be as follows:\n\n```\n...\n<ul class=\"phones\">\n  <li ng-repeat=\"\
    device in phones | filter:query | orderBy:orderProp\" class=\"thumbnail\">\n \
    \   <a href=\"#/phones/{{device.id}}\" class=\"thumb\"><img ng-src=\"{{device.imageUrl}}\"\
    ></a>\n    <a href=\"#/phones/{{device.id}}\">{{device.name}}</a>\n    <p>{{device.snippet}}</p>\n\
    \  </li>\n</ul>\n...\n```\n\nThe double-binding curly braces have been used in\
    \ the attribute values for `href` so as to allow for the links to be dynamically\
    \ generated. In the second step, the binding `{{device.name}}` was added as an\
    \ element of content.\n\nThe directive `ngSrc` has been used so as to add an image\
    \ next to each device. The test can be implemented as follows:\n\n```\n...\nit('\
    \ device specific links should be rendered ', function() {\n  var myquery = element(by.model('query'));\n\
    \  myquery.sendKeys('nexus');\n  element.all(by.css('.phones li a')).first().click();\n\
    \  browser.getLocationAbsUrl().then(function(url) {\n    expect(url).toBe('/phones/motorola');\n\
    \  });\n});\n...\n```\n\nWe need to perform a verification of whether the app\
    \ is generating the right links for the device views which you may need to implement.\
    \ The directive `ngSrc` can be replaced with the plain `src`.\n\n# Chapter 5-\
    \ Working with Animations\n\nSometimes, you might need to enhance your application\
    \ by adding some animations to it. This can be done by use of both CSS and JavaScript.\
    \ For the animations to be enabled throughout the application, we have to use\
    \ the `ngAnimate` module. The common `ng` directives have to be used for the purpose\
    \ of triggering the hooks for the animations we are tapping into. This should\
    \ be done automatically. Once the animation has been found, it is executed in\
    \ between the standard DOM element which has been issued to the element at that\
    \ given time. The `ngRepeat` and `ngClass` can be used for doing this, just by\
    \ removing or adding elements to them.\n\nThe AngularJS module `ngAnimate` will\
    \ provide us with the functionality for performing the animation. This module\
    \ has been distributed separately from our core Angular framework. For the purpose\
    \ of performing the extra animations, we will use the jQuery.\n\nWe now need to\
    \ install the dependencies to be used on the client-side of the application. Bower\
    \ can be used for this purpose. We need to update the configuration file `bower.json`\
    \ so that it includes the new dependency. This can be done as follows:\n\n```\n\
    {\n  \"name\": \"angular-seed\",\n  \"description\": \"A project for AngularJS\
    \ starting\",\n  \"version\": \"0.0.0\",\n  \"homepage\": \"https://mysite.com/angular/angular-project\"\
    ,\n  \"license\": \"MIT\",\n  \"private\": true,\n  \"dependencies\": {\n    \"\
    angular\": \"1.4.x\",\n```\n"
  raw: 'A repeater for the creation of a simple table should then be created in the
    file. This can be implemented as follows:


    <table>


       <tr><th>the row number</th></tr>


       <tr ng-repeat="j in [0, 1, 2, 3, 4, 5, 6, 7]"><td>{{j}}</td></tr>


    </table>


    The list should then be modified to the following:


    <table>


      <tr><th>the row number</th></tr>


      <tr ng-repeat="j in [0, 1, 2, 3, 4, 5, 6, 7]"><td>{{j+1}}</td></tr>


    </table>


    The “ng-repeat” can be used for the creation of another table with some other
    specifications. That is also very powerful in Angular. At this point, you will
    have an app working dynamically and it has the model, the view, and the controller
    located separately.


    # Chapter 3- XHRs


    You should not always handle small and hard-coded data in your application. We
    should be able to fetch large data sets from our AngularJS servers by the use
    of the pre-built services named “$http.”


    We will have the file “app/phones/devices.json,” which has the list of phones
    that we have. These will be stored in a JSON format. A sample part of the file
    looks as follows:


    [


    {


       "age": 15,


      "id": "motorola ",


        "name": "Motorola DEFY\u2122 with MOTOBLUR\u2122",


        "snippet": "Do you enjoy using Motorola devices and phones?"


    ...


    },


    ...


    ]


    Controller


    The “$http” service for Angular will be used in the controller for making an HTTP
    request to the web server so as to fetch data from the file “app/phones/devices.json.”This
    is just one of the ways  how this can be handled or the processing of operations
    related to web apps. With AngularJS, these services are injected where they are
    needed.


    The code for the controller should be as shown below:


    var myApp = angular.module(''myApp'', []);


        myApp.controller(''PnListCtrl'', function ($scope, $http) {


        $http.get(''phones/devices.json'').success(function(data) {


        $scope.phones = data;


    });


        $scope.orderProp = ''age'';


    });


    For a service to be used in Angular, the names of the dependencies which are needed
    have to be defined as arguments to the controller constructor function. This is
    shown below:


    myApp.controller(''PnListCtrl'', function ($scope, $http) {...}


    The dependency constructor in AngularJS will provide the services to our controller
    once it has been launched. The process of creating any of the transitive dependencies
    which the service may have is also taken care of. Consider the example given below,
    showing how this can be done:


    var myApp = angular.module(''myApp'', []);


    myApp.controller(''PnListCtrl'', [''$scope'', ''$http'',


    function ($scope, $http) {


       $http.get(''phones/devices.json'').success(function(data) {


       $scope.phones = data;


    });


      $scope.orderProp = ''age'';


    }]);


    The test can be done as follows:


    describe(''myApp controllers'', function() {


    describe(''PnListCtrl'', function(){


        var scope, ctrl, $httpBackend;


    // Loading our app module definition before the test.


        beforeEach(module(''myApp''));


    // The injector will ignore the leading and the trailing underscores here (i.e.
    _$httpBackend_).


    // This will allow us to inject the service but also attach it to the variable


    // with a name which is same as the service so as to avoid a name conflict.


    beforeEach(inject(function(_$httpBackend_, $rootScope, $controller) {


       $httpBackend = _$httpBackend_;


       $httpBackend.expectGET(''phones/devices.json'').


    respond([{name: ''Motorola''}, {name: ''Motorola Phone''}]);


    scope = $rootScope.$new();


       ctrl = $controller(''PnListCtrl'', {$scope: scope});


    }));


    Notice the two helper functions in the above test case. These can be used for
    configuration and accessing the injector.


    Consider the code given below:


    it(''You should create "phones" model having 2 phones which have been fetched
    from the xhr'', function() {


        expect(scope.phones).toBeUndefined();


        $httpBackend.flush();


        expect(scope.phones).toEqual([{name: ''Motorola''},


        {name: ''Motorola Phone''}]);


    });


    We want to perform a verification on our model which does not exist on the scope
    before we have received the response. After calling the function “$httpBackend.flush(),”
    the request queue will be flushed into the browser. The promise which is returned
    by the service “$http” will be resolved with our resolved response. We will make
    the assertions, and then verify whether the model belongs to the scope. We can
    then verify whether the “orderProp” has been set correctly. This is shown below:


    it(''the default value should be set for the orderProp model'', function() {


         expect(scope.orderProp).toBe(''age'');


    });


    In the karma tab, the following output should be observed:


    Chrome 22.0: Executed 2 of 2 SUCCESS (0.028 secs / 0.007 secs)


    “<pre>{{phones | filter:query | orderBy:orderProp | json}}</pre>” can be added
    at the bottom of the file so that the available phones can be listed or shown
    in a JSON format. The following can be added to the callback:


    $scope.devices = data.splice(0, 5);


    # Chapter 4- Links & Images


    You should know how to add thumbnail images to the devices that you have in your
    list. Links should also be added to these.


    Note that in the JSON file, the links for the devices and their URLs are available,
    as well as unique IDs. The URLs should be pointing to the URL “app/img/devices/.”


    Consider the code snippet given below:


    [


    {


    ...


    "id": "motorola ",


         "imageUrl": "img/phones/motorola.0.jpg",


          "name": "Motorola PHONE ",


    ...


    },


    ...


    ]


    The template should be as follows:


