  trans: '


    外部引用不仅可以在组件模板中找到。在组件控制器中，也可能存在 `$watch`、`$watchCollection` 或 `$watchGroup` 表达式。如果可用，也可以使用链接函数。考虑下面给出的示例，它展示了如何用绑定输入来替代：


    ```

    function FoobarCtrl($scope) {


    var c = this;


    $scope.$watch(''mainC.foo'', function(nFoo) {


    if (nFoo.active) {


    ctrl.actFoo = nFoo;


    } else {


    c.actFoo = null;


    }


    });


    }

    ```


    我们的 watch 表达式引用了 `mainC` 的 `foo` 属性。应该使用绑定输入来代替它。考虑下面给出的代码：


    ```

    module.directive(''foobar'', function() {


    return {


    scope: true,


    controller: ''FoobarCtrl'',


    controllerAs: ''c'',


    bindToController: {


    foo: ''=''


    },


    templateUrl: ''bar.html''


    };


    });

    ```


    一旦组件被使用，就应该填入实际的值。如下所示：


    ```

    <foobar foo="mainC.foo">


    </foobar>

    ```


    在控制器的 watch 表达式内部，就可以使用绑定输入了。如下所示：


    ```

    function FoobarCtrl($scope) {


    var c = this;


    $scope.$watch(''c.foo'', function(nFoo) {


    if (nFoo.active) {


    ctrl.actFoo = nFoo;


    } else {


    ctrl.actFoo = null;


    }


    });


    }

    ```


    在某些情况下，可能不允许使用外部引用。我们希望为控制器编写一段代码，该代码将引用一个仅继承自普通 JavaScript 作用域属性的代码。以下是示例代码：


    ```

    function FoobarCtrl($scope) {


    var c = this;


    c.getActiveFoo = function() {


    if ($scope.mainC.foo.active) {


    return $scope.mainC.foo;


    } else {


    return null;


    }


    };


    }

    ```


    上面的示例与之前的类似，唯一的区别是需要一个绑定输入。如下所示：


    ```

    module.directive(''foobar'', function() {


    return {


    scope: true,


    controller: ''FoobarCtrl'',


    controllerAs: ''c'',


    bindToController: {


    foo: ''=''


    },


    templateUrl: ''bar.html''


    };


    });

    ```


    `foo` 值将在组件使用时提供。如下所示：


    ```

    <foobar foo="mainC.foo">


    </foobar>

    ```


    然后我们的控制器代码就可以使用绑定输入了。如下所示：


    ```

    function FoobarCtrl($scope) {


    var c = this;


    ctrl.getActiveFoo = function() {


    if (c.foo.active) {


    return c.foo;


    } else {


    return null;


    }


    };


    }

    ```


    ## 事件处理器与绑定输出


    组件中使用的所有外部组件并非都是逻辑输入。有些充当逻辑输出。考虑下面给出的示例：


    ```

    <div ng-show="c.visible">


    <p>{{c.getText(c.language)}}</p>


    <button ng-click="mainC.deleteFoobar()">


    Delete


    </button>


    </div>

    ```


    在上面的示例中，在我们的组件模板内部，我们使用了 `ng-click` 指令。它被用来调用继承而来的 `mainC` 引用上的一个方法。这就是我们所做的。


    为了打破依赖关系，需要在指令定义中引入一个名为 `onDelete` 的表达式绑定。如下所示：


    ```

    module.directive(''foobar'', function() {


    return {


    scope: true,


    controller: ''FoobarCtrl'',


    controllerAs: ''c'',


    bindToController: {


    visible: ''='',


    language: ''='',


    onDelete: ''&''


    },


    templateUrl: ''bar.html''


    };


    });

    ```


    为了在 AngularJS 中区分输入和输出，使用 `[]` 语法表示输入，使用 `()` 语法表示输出。然而，在 AngularJS 的早期版本（如 1.x）中，并没有区分它们的机制。这就是为什么大多数人倾向于为输出使用
    `on` 前缀。


    一旦组件被使用，就会填入新绑定的表达式。组件的使用者将决定删除操作对他或她意味着什么。在我们的例子中，我们使用它来调用主控制器的 `deleteFoobar`
    函数。如下所示：


    ```

    <foobar


    visible="mainC.isFooBarVisible()"


    language="mainC.getLanguage()"


    onDelete="mainC.deleteFoobar()">


    </foobar>

    ```


    然后，表达式绑定将从组件模板内部被调用。如下所示：


    ```

    <div ng-show="c.visible">


    <p>{{c.getText(c.language)}}</p>


    <button ng-click="c.onDelete()">


    Delete


    </button>


    </div>

    ```


    考虑下面给出的示例代码：


    ```

    function FoobarCtrl($scope) {


       var c = this;


    c.onFooClick = function() {


       mainC.setActiveFoo(c.foo);


    };


    }

    ```


    在上面的示例中，我们使用了一个控制器函数，该函数会调用父作用域中的一个函数。外部函数调用不一定非得是特定模板中的事件处理器。它可以包含在控制器中。这就是我们对输入所做的处理。


    我们应该对指令定义做的是添加一个表达式绑定。如下所示：


    ```

    module.directive(''foobar'', function() {


    return {


    scope: true,


    controller: ''FoobarCtrl'',


    controllerAs: ''c'',


    bindToController: {


         onActivateFoo: ''&''


    },


    templateUrl: ''bar.html''


    };


    });

    ```


    一旦模板被使用，就会调用我们在组件控制器中设置的 `mainCtrl.setActiveFoo`。如下所示：


    ```

    <foobar


    on-activate-foo="mainC.setActiveFoo(foo)">


    </foobar>

    ```


    然后，表达式绑定应该在控制器内部被调用，而不是在外部继承的控制器中。应该向 Angular 提供一个对象参数，以便知道要在绑定表达式中使用的 `foo` 的值。如下所示：


    ```

    function FoobarCtrl($scope) {


    var c = this;


    c.onFooClick = function() {


        c.onActivateFoo({foo: c.foo});


    };


    }

    ```


    考虑下面给出的示例：


    ```

    module.directive(''foobar'', function() {


    return {


        scope: true,


        controller: ''FoobarCtrl'',


        controllerAs: ''c'',


    bindToController: {


        visible: ''='',


        language: ''='',


       onDelete: ''&''


    },


    templateUrl: ''bar.html''


    };


    });

    ```


    在上面的示例中，我们定义了所有的输入和输出。


    # 结论


    可以得出结论，AngularJS 是一个用于开发 Web 应用程序的非常有用的框架。AngularJS 的实用性体现在它对 HTML 所做的改进上。总的来说，它被开发出来是为了扩展
    HTML 所包含的内容。请注意，HTML 并非为开发 Web 应用程序而设计。


    然而，AngularJS 的出现填补了这一空白。它通过扩展 HTML 所包含的词汇来获得额外且令人惊叹的功能。使用 HTML，声明和显示动态内容非常容易。但是，当涉及到处理动态内容时，HTML
    就不是最佳选择了。这正是 AngularJS 发挥作用的地方，它填补了这一空白。


    正如我们所说，AngularJS 用于扩展 HTML 的功能。一个很好的例子是，当我们创建一个 HTML 页面，然后通过使用 AngularJS 来修改它。这个页面随后可以通过使用
    AngularJS 动态地显示内容。这就是两者协同工作的方式。应用程序总是使用数据。这对任何应用程序都非常重要。


    然而，除了处理少量数据之外，你还应该学会在 AngularJS 中处理大型数据集。这在 AngularJS 中是可行的，并且你最终得到的应用程序将非常有用。AngularJS
    还可以用于为你的应用程序添加动画效果。这使你的 Web 应用程序对用户非常有吸引力。AngularJS 中有一个名为 `ngAnimate` 的模块，可用于执行这些动画。这些就是本书中讨论的一些特性。


