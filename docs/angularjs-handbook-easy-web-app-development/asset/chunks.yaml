  trans: "\n与其像上面那样在事件监听器内部调用 `$digest()` 函数，不如使用 `apply()` 函数，如下所示：\n\n```\ndocument.getElementById(\"\
    upTimeButton\")\n.addEventListener('click', function() {\n$scope.$apply(function()\
    \ {\nconsole.log(\"change time clicked\");\n$scope.data.time = new Date();\n});\n\
    });\n```\n\n函数 `$scope.$apply()` 已在按钮的事件监听器中被调用，并且变量 `$scope.data.time` 的更新已作为参数传递给函数\
    \ `$apply()`。一旦函数 `$apply()` 执行完毕，AngularJS 将在内部调用函数 `$digest()`，以便所有数据绑定都被更新。\n\
    \n# 第 7 章 - `$scope` 的层次结构\n\nAngularJS 中供视图使用的 `$scope` 对象被组织成一个层次结构。我们从根作用域开始，它由一个或多个子作用域组成。每个可用的视图都有自己的作用域，这些作用域只是根作用域的子级。这意味着视图控制器在变量\
    \ `$scope` 上设置的任何变量对其他控制器都是不可见的。\n\n以下面的 AngularJS 代码为例：\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<head>\n<script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.2.5/angular.min.js\"\
    ></script>\n</head>\n<body ng-app=\"myapplication\">\n<div ng-controller=\"appController1\"\
    >\n{{data.theVariable}}\n</div>\n<div ng-controller=\"appController2\">\n{{data.theVariable}}\n\
    </div>\n<script>\nvar module       = angular.module(\"myapplication\", []);\n\
    var appController1 = module.controller(\"appController1\", function($scope) {\n\
    $scope.data = { theVariable : \"first value\"};\n});\nvar appController2 = module.controller(\"\
    appController2\", function($scope) {\n$scope.data = { theVariable : \"second value\"\
    };\n});\n</script>\n</body>\n</html>\n```\n\n在上面的例子中，我们使用了两个视图，每个视图都有自己的控制器。每个控制器会将\
    \ `data.theVariable` 变量设置为不同的值。\n\n程序执行后，你将得到以下层次结构：\n\n根 `$scope`\n\n*   appController1\
    \ 的 `$scope`\n*   appController2 的 `$scope`\n\n如上所示，两个视图使用了不同的作用域对象。在这个例子中，两个视图中的\
    \ `{{data.theVar}}` 数据绑定也会写入两个不同的值。`$scope` 对象中的变量 `data.theVariable` 也会被设置为不同的值。\n\
    \n# 第 8 章 - 重构 AngularJS 应用\n\n基于组件的指令在 AngularJS 中越来越流行。原因在于组件易于使用。然而，目前大多数正在使用的\
    \ Angular 应用并非基于组件。\n\n对于 Angular2 用户，可以按如下方式使用组件：\n\n```\n< confirmation\n  \
    \  [message]=\"'Start firing?'\"\n       (ok)=\"startFiring()\">\n</ confirmation>\n\
    ```\n\n如上例所示，组件只是一个自定义 HTML 元素，它匹配一个已在其他地方定义的组件名称。每个组件都有其输入和输出，这些作为属性提供给元素。\n\n\
    上述组件也可以按如下方式定义：\n\n```\n@Component({\nselector: 'confirmation',\nproperties: ['message'],\n\
    events: ['ok']\n})\n@View({\ntemplate: `\n<div>\n{{message}}\n    <button (click)=\"\
    ok()\">OK</button>\n     </div>\n`})\nclass Confirmation {\n    okEvents = new\
    \ EventEmitter();\n    ok() {\n     this.okEvents.next();\n}\n}\n```\n\n接口边界定义用于指定组件可以处理的输入和输出。UI\
    \ 模板用于定义用户界面。组件逻辑位于 UI 模板之后，用于定义组件的行为以及当用户与之交互时它做什么。组件作为指令的定义可以如下所示：\n\n```\n\
    @Component({\n    selector: 'confirmation',\n     properties: ['message'],\n \
    \   events: ['ok']\n})\n@View({\ntemplate: `\n    <div>{{message}}\n    <button\
    \ (click)=\"ok()\">OK</button>\n</div>\n`\n})\nclass Confirmation {\n     okEvents\
    \ = new EventEmitter();\n     ok() {\n     this.okEvents.next();\n}\n}\n```\n\n\
    上述代码与我们之前看到的完全不同。\n\n在 AngularJS 中，重构可以轻松完成或使用。我们想给出一个如何实现的示例：\n\n考虑下面给出的 `index.html`\
    \ 文件代码：\n\n```\n<div ng-include=\"'bar.html'\">\n</div>\n```\n\n为了替换上述代码，我们需要为\
    \ `bar` 创建一个指令。该指令将使用继承的作用域和模板 `bar.htm`。\n\n`bar_directive.js` 的代码应如下所示：\n\n\
    ```\nmodule.directive('bar', function() {\nreturn {\n     scope: true,\n     templateUrl:\
    \ 'bar.html'\n};\n});\n```\n\n为了使其有效工作，指令和模板必须位于同一位置，并且它们的名称也应匹配。如下所示：\n\n```\n\
    components/foobar/\n*   bar_directive.js\n*   bar.html\n```\n\n然后，原始的 `ng-include`\
    \ 应被新指令替换。如下所示：\n\n```\n<div ng-include=\"'footbar.html'\">\n     </div>\n<footbar></footbar>\n\
    ```\n\n添加上述组件指令（即 `footbar`）后，模板本身将如下所示：\n\n```\n<div ng-controller=\"FoobarCtrl\
    \ as c\">\n     <p>{{c.getText()}}</p>\n</div>\n```\n\n然后，我们想要移动并重命名包含 FootCtrl\
    \ 的文件，使其与我们的组件指令位于同一位置。如下所示：\n\n```\ncomponents/foobar/\n*   bar_directive.js\n\
    *   bar_controller.js\n*   bar.html\n```\n\n然后，控制器应在指令中使用，并且使用与 `ng-controller`\
    \ 相同的 ctrl 别名。文件 `bar_directive.js` 应如下所示：\n\n```\nmodule.directive('foobar',\
    \ function() {\nreturn {\n    scope: true,\n    controller: 'FoobarCtrl',\n  \
    \  controllerAs: 'ctrl',\n    templateUrl: 'bar.html'\n};\n});\n```\n\n现在可以从模板中移除包装器\
    \ `ng-controller`。如下所示：\n\n```\n<div ng-controller=\"FooBarCtrl as c\">\n<p>{{c.getText()}}</p>\n\
    </div>\n```\n\n也可以为了样式目的保留该元素，然后移除 `ng-controller` 属性。\n\n考虑下面的示例：\n\n```\n<div\
    \ ng-controller=\"FoobarCtrl as c\"\nclass=\" foo-bar\">\n<p>{{c.getText()}}</p>\n\
    </div>\n```\n\n在上面的模板示例中，我们有一个 `ng-controller`。它用于实例化一个 `FoobarCtrl`，然后将其别名为 `c`。\n\
    \n我们现在需要创建一个新指令。该指令应创建一个继承的作用域，然后使用 `FoobarCtrl` 并将其别名为 `c`。如下所示：\n\n```\nmodule.directive('bar',\
    \ function() {\nreturn {\n    scope: true,\n    controller: 'FoobarCtrl',\n  \
    \  controllerAs: 'c'\n};\n});\n```\n\n我们的新指令和现有的控制器将被移动到同一位置。两者还应具有相同的前缀。如下所示：\n\
    \n```\ncomponents/foobar/\n*   bar_directive.js\n*   bar_controller.js\n```\n\n\
    最后，在原始模板中，`ng-controller` 可以被替换为组件 `foobar` 的一个实例。如下所示：\n\n```\n<div ng-controller=\"\
    FoobarCtrl as c\"\nclass=\"foo-bar\">\n<foobar class=\"foo-bar\">\n<p>{{c.getText()}}</p>\n\
    </foobar>\n</div>\n```\n\n目前我们得到的是：\n\n```\n<div ng-controller=\"FoobarCtrl as\
    \ c\"\nclass=\"foo-bar\">\n<foobar class=\"foo-bar\">\n<p>{{c.getText()}}</p>\n\
    </foobar>\n</div>\n```\n\n然后，应为组件指令创建一个模板文件。如下所示：\n\n```\ncomponents/foobar/\n\
    *   bar_directive.js\n*   bar_controller.js\n*   bar.html\n```\n\n然后，新模板应从指令中引用。可以按如下方式完成：\n\
    \n```\nmodule.directive('foobar', function() {\nreturn {\nscope: true,\ncontroller:\
    \ 'FoobarCtrl',\ncontrollerAs: 'c',\ntemplateUrl: 'bar.html'\n};\n});\n```\n\n\
    然后，我们将使用指令元素中包含的内容来填充新模板。如下所示：\n\n```\n<p>{{c.getText()}</p>\n```\n\n"
- fmt: "\nThe directive element will itself become empty. The `index.html` file will\
    \ then be as follows:\n\n```\n<foobar>\n\n<p>{{c.getText()}}</p>\n\n</foobar>\n\
    ```\n\nAfter the `ng-controller` has been replaced with the directive, the original\
    \ template will be left with the following:\n\n```\n<foobar>\n\n<h2>{{c.getTitle()}}</h2>\n\
    \n<p>{{mainC.getText()}}</p>\n\n</foobar>\n```\n\nTransclusion can be used for\
    \ the purpose of supporting both of the cases. We will begin by creating a template\
    \ file for our component directive. This is shown below:\n\n`components/foobar/`\n\
    \n*   `bar_directive.js`\n*   `bar_controller.js`\n*   `bar.html`\n\nThe new template\
    \ can then be referenced from our directive. At the same time, transclusion will\
    \ also be enabled, as shown below:\n\n```\nmodule.directive('foobar', function()\
    \ {\n\nreturn {\n\ntransclude: true,\n\nscope: true,\n\ncontroller: 'FoobarCtrl',\n\
    \ncontrollerAs: 'c',\n\ntemplateUrl: 'bar.html'\n\n};\n\n});\n```\n\nThe population\
    \ of the template file will be done by use of a part of the original template\
    \ which is needed to be put inside the component. The directive `ng-transclude`\
    \ will be added for the other part. The `bar.html` file should have the following\
    \ code:\n\n```\n<h2>{{c.getTitle()}}</h2>\n\n<p ng-transclude></p>\n```\n\nIn\
    \ our directive element, we will leave the part which is to be transcluded. This\
    \ is shown below:\n\n```\n<foobar>\n\n<h2>{{c.getTitle()}}</h2>\n\n<p>{{mainC.getText()}}</p>\n\
    \n</foobar>\n```\n\nConsider the next example.\n\nWe have a `<ul>` element for\
    \ listing some data. This is shown below:\n\n```\n<div>\n\n<h1>Foobars</h1>\n\n\
    <ul>\n\n<li ng-repeat=\"foo in c.bars\">\n\n<img ng-src=\"foo.imageUrl\"/>\n\n\
    {{file.text}}\n\n</li>\n\n</ul>\n\n</div>\n```\n\nWe need to perform the listing\
    \ into its own component. A directive and a template file should be created for\
    \ the component. This should be called in the directive as shown below:\n\n`components/foobar_list/`\n\
    \n*   `foobar_list_directive.js`\n*   `foobar_list.html`\n\nThe directive will\
    \ create an inherited scope, and then reference the template which has been created.\
    \ This is shown below:\n\n```\nmodule.directive('foobarList', function() {\n\n\
    return {\n\n     scope: true,\n\n     templateUrl: 'list.html'\n\n};\n\n});\n\
    ```\n\nThe template will be populated by copying the HTML file which has been\
    \ populated from our original template. This is shown below:\n\n```\n<ul>\n\n\
    <li ng-repeat=\"foo in c.bars\">\n\n<img ng-src=\"foo.imageUrl\"/>\n\n{{file.text}}\n\
    \n</li>\n\n</ul>\n```\n\nA new instance of this component can then be used in\
    \ the original template. It will replace the markup which has been created. This\
    \ is shown below:\n\n```\n<div>\n\n<h1>Foobars</h1>\n\n<ul>\n\n<li ng-repeat=\"\
    foo in c.bars\">\n\n<img ng-src=\"foo.imageUrl\"/>\n\n{{file.text}}\n\n</li>\n\
    \n</ul>\n\n<foobar-list></foobar-list>\n\n</div>\n```\n\nAn example can also be\
    \ created which makes use of transclusion. An example of this is given below:\n\
    \n```\n<div>\n\n<h1>Foobars</h1>\n\n<ul>\n\n<li ng-repeat=\"foo in c.bars\">\n\
    \n<h3>\n\n{{mainC.itemHeader}}\n\n</h3>\n\n<img ng-src=\"foo.imageUrl\"/>\n\n\
    {{file.text}}\n\n</li>\n\n</ul>\n\n</div>\n```\n\nThe `<ul>` element from our\
    \ previous example has some content coming from the outside, and transclusion\
    \ can be used for the purpose of both of these. In the above example, we have\
    \ used an item header which has been provided by `mainC`.\n\nWhen the listing\
    \ is extracted into its own component, a directive and a template should then\
    \ be created for that file. This is shown below:\n\n`components/foobar_list/`\n\
    \n*   `bar_list_directive.js`\n*   `bar_list.html`\n\nThe directive will create\
    \ an inherited scope, and the newly created template file will then be referenced.\
    \ Transclusion will also be enabled.\n\nThe code for the file `bar_list_directive.js`\
    \ should be as follows:\n\n```\nmodule.directive('foobarList', function() {\n\n\
    return {\n\n     transclude: true,\n\n     scope: true,\n\n     templateUrl: 'bar_list.html'\n\
    \n};\n\n});\n```\n\nThe population of the template will be done by copying the\
    \ HTML which has been extracted from our original template. The part for the item\
    \ header will be replaced with an `ng-transclude` element.\n\nThe code for `bar_list.htm`\
    \ should be as follows:\n\n```\n<ul>\n\n<li ng-repeat=\"foo in c.bars\">\n\n<ng-transclude></ng-transclude>\n\
    \n<img ng-src=\"foo.imageUrl\"/>\n\n{{file.text}}\n\n</li>\n\n</ul>\n```\n\nA\
    \ new instance of this component can then be used in our new template. It will\
    \ replace the markup which has been extracted, but an item header will be left\
    \ in place and then transclusion will be done to each item. This is shown below:\n\
    \n```\n<div>\n\n<h1>My Foobars</h1>\n\n<ul>\n\n<li ng-repeat=\"foo in c.bars\"\
    >\n\n<h3>\n\n{{mainC.itemHeader}}\n\n</h3>\n\n<img ng-src=\"foo.imageUrl\"/>\n\
    \n              {{file.text}}              \n\n</li>\n\n</ul>\n\n<foobar-list>\n\
    \n<h3>\n\n{{mainC.itemHeader}}\n\n</h3>\n\n</foobar-list>\n\n</div>\n```\n\nWe\
    \ now have a component template. Two external references can be seen in it, and\
    \ these reference the controller `mainC`. Note that this is not the controller\
    \ for the component, but it is just another controller which has been defined\
    \ on the upper or higher level of our hierarchy. This is shown below:\n\n```\n\
    <div ng-show=\"mainC.isFooBarVisible()\">\n\n<p>\n\n{{c.getText(mainC.getLanguage())}}\n\
    \n</p>\n\n</div>\n```\n\nThe external references should be removed one by one,\
    \ and the code should be kept working all the time.\n\nThe expression `mainC.isFooBarVisible()`\
    \ has to be chosen first. It refers to calling a method which is located on the\
    \ parent controller, and we have used the result to control whether or not the\
    \ element is visible. For the external reference to be replaced, a binding to\
    \ the component directive has to be introduced named `visible`.\n\nThe code for\
    \ the `bar_diretive.js` should be as follows:\n\n```\nmodule.directive('foobar',\
    \ function() {\n\nreturn {\n\nscope: true,\n\ncontroller: 'FoobarCtrl',\n\ncontrollerAs:\
    \ 'c',\n\nbindToController: {\n\nvisible: '='\n\n},\n\ntemplateUrl: 'bar.html'\n\
    \n};\n\n});\n```\n\nThe above code shows that the component has an input named\
    \ `visible`, and the user should supply the component to it. You should also have\
    \ noticed that we have introduced `bindToController`, but the attribute `scope:\
    \ true` has been kept unchanged. However, it isn’t an isolated scope directive.\
    \ The reason we do not want to isolate it is that there are other external references\
    \ inside it, and we don’t need to break these references. In Angular 1.4, it is\
    \ possible for one to combine the `scope: true` and the `bindToController` so\
    \ as to introduce binding to scopes which are not isolated.\n\nFor the `visible`\
    \ binding which is new, we have to plug in a value wherever the component `foobar`\
    \ is to be used. We have the capability of accessing the `mainC`, and the template\
    \ originally contained in the template can be used. This is shown below:\n\n```\n\
    <foobar\n\nvisible=\"mainC.isFooBarVisible()\">\n\n</foobar>\n```\n\nThe scope\
    \ binding can now be referred to inside the component, and the dependency will\
    \ be broken to the external world. This is shown below for the `bar.html`:\n\n\
    ```\n<div ng-show=\"c.visible\">\n\n<p>\n\n{{c.getText(mainC.getLanguage())}}\n\
    \n</p>\n\n</div>\n```\n\nAnother binding to the definition for the directive named\
    \ `language` can now be introduced. This is shown below:\n\n```\nmodule.directive('foobar',\
    \ function() {\n\nreturn {\n\nscope: true,\n\ncontroller: 'FoobarCtrl',\n\ncontrollerAs:\
    \ 'c',\n\nbindToController: {\n\nvisible: '=',\n\nlanguage: '='\n\n},\n\ntemplateUrl:\
    \ 'bar.html'\n\n};\n\n});\n```\n\nA value for it should then be plugged in where\
    \ the component is being used. This is shown below:\n\n```\n<foobar\n\nvisible=\"\
    mainC.isFooBarVisible()\"\n\nlanguage=\"mainC.getLanguage()\">\n\n</foobar>\n\
    ```\n\nThe binding should also be done inside the component template. This is\
    \ shown below:\n\n```\n<div ng-show=\"c.visible\">\n\n<p>{{c.getText(c.language)}}</p>\n\
    \n</div>\n```\n\nOur template will then be free of the external references. All\
    \ of the data which is needed will be specified explicitly at the interface boundary.\n\
    \n## An Example of the `$watch` Expression\n"
