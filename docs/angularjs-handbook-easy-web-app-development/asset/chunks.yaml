- fmt: "\nInstead of doing the above, that is, calling the `$digest()` function inside\
    \ the event listener, the `apply()` function can also be used as shown below:\n\
    \n```\ndocument.getElementById(\"upTimeButton\")\n.addEventListener('click', function()\
    \ {\n$scope.$apply(function() {\nconsole.log(\"change time clicked\");\n$scope.data.time\
    \ = new Date();\n});\n});\n```\n\nThe function `$scope.$apply()` has been called\
    \ from within the event listener for the button, and the update of the variable\
    \ `$scope.data.time` has been passed as a parameter to the function `$apply()`.\
    \ Once all of the function `$apply()` has finished, AngularJS will call the function\
    \ `$digest()` internally so that all of the data bindings are updated.\n\n# Chapter\
    \ 7- The Hierarchy of `$scope`\n\nThe object `$scope` for AngularJS, which is\
    \ used by views, is organized into an hierarchy. We begin with the root scope,\
    \ which is then made up of one or more children. Each of the available views is\
    \ made up of its own scope, which is just the child of the root scope. This means\
    \ that whatever variable that the view controller has set on the variable `$scope`\
    \ will be invisible to the controllers.\n\nConsider the AngularJS code given below\
    \ as an example:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<script\
    \ src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.2.5/angular.min.js\"\
    ></script>\n</head>\n<body ng-app=\"myapplication\">\n<div ng-controller=\"appController1\"\
    >\n{{data.theVariable}}\n</div>\n<div ng-controller=\"appController2\">\n{{data.theVariable}}\n\
    </div>\n<script>\nvar module       = angular.module(\"myapplication\", []);\n\
    var appController1 = module.controller(\"appController1\", function($scope) {\n\
    $scope.data = { theVariable : \"first value\"};\n});\nvar appController2 = module.controller(\"\
    appController2\", function($scope) {\n$scope.data = { theVariable : \"second value\"\
    };\n});\n</script>\n</body>\n</html>\n```\n\nIn the above example, we have used\
    \ two views, and each of the views has its own controller. Each controller will\
    \ set the `data.theVariable` variable to a different value.\n\nOnce the program\
    \ has been executed, you will get the following hierarchy:\n\nRoot `$scope`\n\n\
    *   `$scope` for appController 1\n*   `$scope` for appController 2\n\nAs shown\
    \ above, the two views have used different scope objects. With the example, two\
    \ different values will also be written for the `{{data.theVar}}` data bindings\
    \ inside our two views. Different values will also be set for the variable `data.theVariable`\
    \ in the `$scope` object.\n\n# Chapter 8- Refactoring AngularJS Apps\n\nDirectives\
    \ which are component-based are increasingly becoming popular in AngularJS. The\
    \ reason for this is the ease of use associated with components. However, most\
    \ apps for Angular which are in use today are not based on components.\n\nFor\
    \ Angular2 users, components can be used as follows:\n\n```\n< confirmation\n\
    \    [message]=\"'Start firing?'\"\n       (ok)=\"startFiring()\">\n</ confirmation>\n\
    ```\n\nAs shown in the above example, a component is just an element in custom\
    \ HTML, and it matches a component name which has been defined somewhere else.\
    \ Each component has its inputs and outputs, and these are supplied as properties\
    \ to the element.\n\nThe above component can also be defined as shown below:\n\
    \n```\n@Component({\nselector: 'confirmation',\nproperties: ['message'],\nevents:\
    \ ['ok']\n})\n@View({\ntemplate: `\n<div>\n{{message}}\n    <button (click)=\"\
    ok()\">OK</button>\n     </div>\n`})\nclass Confirmation {\n    okEvents = new\
    \ EventEmitter();\n    ok() {\n     this.okEvents.next();\n}\n}\n```\n\nAn interface\
    \ boundary definition is used for specification of the inputs and outputs which\
    \ the component can work with. The UI template has been used for definition of\
    \ the user interface for our users. The component logic has been used behind the\
    \ UI template to define the behavior of the component and what it does when the\
    \ user is interacting with it. The definition of a component as a directive can\
    \ be done as shown below:\n\n```\n@Component({\n    selector: 'confirmation',\n\
    \     properties: ['message'],\n    events: ['ok']\n})\n@View({\ntemplate: `\n\
    \    <div>{{message}}\n    <button (click)=\"ok()\">OK</button>\n</div>\n`\n})\n\
    class Confirmation {\n     okEvents = new EventEmitter();\n     ok() {\n     this.okEvents.next();\n\
    }\n}\n```\n\nThe above code is completely different from what we had before.\n\
    \nRefactoring can easily be done or used in AngularJS. We want to give an example\
    \ of how this can be done:\n\nConsider the code given below for the file `index.html`:\n\
    \n```\n<div ng-include=\"'bar.html'\">\n</div>\n```\n\nFor the above to be replaced,\
    \ we will have to create a directive for `bar`. This will use the inherited scope\
    \ and the template `bar.htm`.\n\nThe code for `bar_directive.js` should be as\
    \ follows:\n\n```\nmodule.directive('bar', function() {\nreturn {\n     scope:\
    \ true,\n     templateUrl: 'bar.html'\n};\n});\n```\n\nFor this to work effectively,\
    \ both the directive and the template have to be co-located and their names should\
    \ also match. This is shown below:\n\n```\ncomponents/foobar/\n*   bar_directive.js\n\
    *   bar.html\n```\n\nThe original `ng-include` should then be replaced with the\
    \ new directive. This is shown below:\n\n```\n<div ng-include=\"'footbar.html'\"\
    >\n     </div>\n<footbar></footbar>\n```\n\nAfter the addition of the above component\
    \ directive, that is, `footbar`, the template itself will look as shown below:\n\
    \n```\n<div ng-controller=\"FoobarCtrl as c\">\n     <p>{{c.getText()}}</p>\n\
    </div>\n```\n\nWe then want to move and then rename the file which has the FootCtrl\
    \ so that it becomes co-located with our component directive. This is shown below:\n\
    \n```\ncomponents/foobar/\n*   bar_directive.js\n*   bar_controller.js\n*   bar.html\n\
    ```\n\nThe controller should then be used in the directive, and then the same\
    \ ctrl alias that our `ng-controller` will be used. The file `bar_directive.js`\
    \ should be as follows:\n\n```\nmodule.directive('foobar', function() {\nreturn\
    \ {\n    scope: true,\n    controller: 'FoobarCtrl',\n    controllerAs: 'ctrl',\n\
    \    templateUrl: 'bar.html'\n};\n});\n```\n\nThe wrapper `ng-controller` can\
    \ now be removed from the template. This is shown below:\n\n```\n<div ng-controller=\"\
    FooBarCtrl as c\">\n<p>{{c.getText()}}</p>\n</div>\n```\n\nOne can also choose\
    \ to keep this element for the purpose of styling, and then the attribute `ng-controller`\
    \ is removed.\n\nConsider the example given below:\n\n```\n<div ng-controller=\"\
    FoobarCtrl as c\"\nclass=\" foo-bar\">\n<p>{{c.getText()}}</p>\n</div>\n```\n\n\
    In the above example representing a template, we have an `ng-controller`. It has\
    \ been used to instantiate a `FoobarCtrl` and then alias it as `c`.\n\nWe now\
    \ need to create a new directive. This should then create an inherited scope,\
    \ and then use the `FoobarCtrl` and then alias it as `c`. This is shown below:\n\
    \n```\nmodule.directive('bar', function() {\nreturn {\n    scope: true,\n    controller:\
    \ 'FoobarCtrl',\n    controllerAs: 'c'\n};\n});\n```\n\nOur new directive and\
    \ the controller in existence will be moved to the same location. The two should\
    \ also have the same prefix. This is shown below:\n\n```\ncomponents/foobar/\n\
    *   bar_directive.js\n*   bar_controller.js\n```\n\nFinally, in the original template,\
    \ the `ng-controller` can be replaced with an instance of the component `foobar`.\
    \ This is shown below:\n\n```\n<div ng-controller=\"FoobarCtrl as c\"\nclass=\"\
    foo-bar\">\n<foobar class=\"foo-bar\">\n<p>{{c.getText()}}</p>\n</foobar>\n</div>\n\
    ```\n\nThis is what we have for now:\n\n```\n<div ng-controller=\"FoobarCtrl as\
    \ c\"\nclass=\"foo-bar\">\n<foobar class=\"foo-bar\">\n<p>{{c.getText()}}</p>\n\
    </foobar>\n</div>\n```\n\nA template file should then be created for the component\
    \ directive. This is shown below:\n\n```\ncomponents/foobar/\n*   bar_directive.js\n\
    *   bar_controller.js\n*   bar.html\n```\n\nThe new template should then be referenced\
    \ from the directive. This can be done as follows:\n\n```\nmodule.directive('foobar',\
    \ function() {\nreturn {\nscope: true,\ncontroller: 'FoobarCtrl',\ncontrollerAs:\
    \ 'c',\ntemplateUrl: 'bar.html'\n};\n});\n```\n\nWe will then use what was contained\
    \ in the directive element so as to populate the new template. This is shown below:\n\
    \n```\n<p>{{c.getText()}</p>\n```\n"
