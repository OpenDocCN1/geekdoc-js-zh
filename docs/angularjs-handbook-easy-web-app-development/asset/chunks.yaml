    \n```\nmodule.directive('foobarList', function() {\n\nreturn {\n\n     scope:\
    \ true,\n\n     templateUrl: 'list.html'\n\n};\n\n});\n```\n\n模板将通过复制从原始模板中填充的\
    \ HTML 文件来填充。如下所示：\n\n```\n<ul>\n\n<li ng-repeat=\"foo in c.bars\">\n\n<img ng-src=\"\
    foo.imageUrl\"/>\n\n{{file.text}}\n\n</li>\n\n</ul>\n```\n\n然后可以在原始模板中使用此组件的新实例。它将替换已创建的标记。如下所示：\n\
    \n```\n<div>\n\n<h1>Foobars</h1>\n\n<ul>\n\n<li ng-repeat=\"foo in c.bars\">\n\
    \n<img ng-src=\"foo.imageUrl\"/>\n\n{{file.text}}\n\n</li>\n\n</ul>\n\n<foobar-list></foobar-list>\n\
    \n</div>\n```\n\n还可以创建一个使用嵌入的示例。如下所示：\n\n```\n<div>\n\n<h1>Foobars</h1>\n\n<ul>\n\
    \n<li ng-repeat=\"foo in c.bars\">\n\n<h3>\n\n{{mainC.itemHeader}}\n\n</h3>\n\n\
    <img ng-src=\"foo.imageUrl\"/>\n\n{{file.text}}\n\n</li>\n\n</ul>\n\n</div>\n\
    ```\n\n我们之前示例中的 `<ul>` 元素有一些来自外部的内容，嵌入可以用于这两者。在上面的示例中，我们使用了由 `mainC` 提供的项目标题。\n\
    \n当列表被提取到它自己的组件中时，应为该文件创建一个指令和一个模板。如下所示：\n\n`components/foobar_list/`\n\n*   `bar_list_directive.js`\n\
    *   `bar_list.html`\n\n该指令将创建一个继承作用域，然后引用新创建的模板文件。嵌入功能也将被启用。\n\n文件 `bar_list_directive.js`\
    \ 的代码应如下所示：\n\n```\nmodule.directive('foobarList', function() {\n\nreturn {\n\n\
    \     transclude: true,\n\n     scope: true,\n\n     templateUrl: 'bar_list.html'\n\
    \n};\n\n});\n```\n\n模板的填充将通过复制从原始模板中提取的 HTML 来完成。项目标题部分将被替换为 `ng-transclude` 元素。\n\
    \n`bar_list.htm` 的代码应如下所示：\n\n```\n<ul>\n\n<li ng-repeat=\"foo in c.bars\">\n\n\
    <ng-transclude></ng-transclude>\n\n<img ng-src=\"foo.imageUrl\"/>\n\n{{file.text}}\n\
    \n</li>\n\n</ul>\n```\n\n然后可以在新模板中使用此组件的新实例。它将替换已提取的标记，但项目标题将保留在原位，然后对每个项目进行嵌入。如下所示：\n\
    \n```\n<div>\n\n<h1>My Foobars</h1>\n\n<ul>\n\n<li ng-repeat=\"foo in c.bars\"\
    >\n\n<h3>\n\n{{mainC.itemHeader}}\n\n</h3>\n\n<img ng-src=\"foo.imageUrl\"/>\n\
    \n              {{file.text}}              \n\n</li>\n\n</ul>\n\n<foobar-list>\n\
    \n<h3>\n\n{{mainC.itemHeader}}\n\n</h3>\n\n</foobar-list>\n\n</div>\n```\n\n现在我们有了一个组件模板。其中可以看到两个外部引用，它们引用了控制器\
    \ `mainC`。请注意，这不是组件的控制器，它只是在我们层次结构的更上层定义的另一个控制器。如下所示：\n\n```\n<div ng-show=\"\
    mainC.isFooBarVisible()\">\n\n<p>\n\n{{c.getText(mainC.getLanguage())}}\n\n</p>\n\
    \n</div>\n```\n\n应逐个移除外部引用，并始终保持代码正常工作。\n\n首先必须选择表达式 `mainC.isFooBarVisible()`。它指的是调用位于父控制器上的方法，我们使用结果来控制元素是否可见。为了替换外部引用，必须为组件指令引入一个名为\
    \ `visible` 的绑定。\n\n文件 `bar_diretive.js` 的代码应如下所示：\n\n```\nmodule.directive('foobar',\
    \ function() {\n\nreturn {\n\nscope: true,\n\ncontroller: 'FoobarCtrl',\n\ncontrollerAs:\
    \ 'c',\n\nbindToController: {\n\nvisible: '='\n\n},\n\ntemplateUrl: 'bar.html'\n\
    \n};\n\n});\n```\n\n上述代码显示组件有一个名为 `visible` 的输入，用户应向组件提供该输入。您还应该注意到我们引入了 `bindToController`，但属性\
    \ `scope: true` 保持不变。然而，它并不是一个隔离作用域指令。我们不隔离它的原因是其中还有其他外部引用，我们不需要破坏这些引用。在 Angular\
    \ 1.4 中，可以将 `scope: true` 和 `bindToController` 结合起来，以便为非隔离的作用域引入绑定。\n\n对于新的 `visible`\
    \ 绑定，我们必须在任何使用组件 `foobar` 的地方插入一个值。我们能够访问 `mainC`，并且可以使用模板中原本包含的模板。如下所示：\n\n```\n\
    <foobar\n\nvisible=\"mainC.isFooBarVisible()\">\n\n</foobar>\n```\n\n现在可以在组件内部引用作用域绑定，并且将打破对外部世界的依赖。如下所示，在\
    \ `bar.html` 中：\n\n```\n<div ng-show=\"c.visible\">\n\n<p>\n\n{{c.getText(mainC.getLanguage())}}\n\
    \n</p>\n\n</div>\n```\n\n现在可以为指令定义引入另一个名为 `language` 的绑定。如下所示：\n\n```\nmodule.directive('foobar',\
    \ function() {\n\nreturn {\n\nscope: true,\n\ncontroller: 'FoobarCtrl',\n\ncontrollerAs:\
    \ 'c',\n\nbindToController: {\n\nvisible: '=',\n\nlanguage: '='\n\n},\n\ntemplateUrl:\
    \ 'bar.html'\n\n};\n\n});\n```\n\n然后应在使用组件的地方为其插入一个值。如下所示：\n\n```\n<foobar\n\n\
    visible=\"mainC.isFooBarVisible()\"\n\nlanguage=\"mainC.getLanguage()\">\n\n</foobar>\n\
    ```\n\n绑定也应在组件模板内部完成。如下所示：\n\n```\n<div ng-show=\"c.visible\">\n\n<p>{{c.getText(c.language)}}</p>\n\
    \n</div>\n```\n\n我们的模板将不再有外部引用。所有需要的数据都将在接口边界处显式指定。\n\n## `$watch` 表达式示例\n\n"
- fmt: '

    External references cannot only be found in the component template. In the component
    controller, one may also have the expressions `$watch`, `$watchCollection`, or
    `$watchGroup`. The link functions can also be used if available. Consider the
    example given below, which shows how this can be replaced with a bound input:


    ```

    function FoobarCtrl($scope) {


    var c = this;


    $scope.$watch(''mainC.foo'', function(nFoo) {


    if (nFoo.active) {


    ctrl.actFoo = nFoo;


    } else {


    c.actFoo = null;


    }


    });


    }

    ```


    Our watch expression has referenced the `foo` attribute of the `mainC`. A bound
    input should be used instead of this. Consider the code which is given below:


    ```

    module.directive(''foobar'', function() {


    return {


    scope: true,


    controller: ''FoobarCtrl'',


    controllerAs: ''c'',


    bindToController: {


    foo: ''=''


    },


    templateUrl: ''bar.html''


    };


    });

    ```


    Once the component is being used, the actual value should be plugged in. This
    is shown below:


    ```

    <foobar foo="mainC.foo">


    </foobar>

    ```


    Inside the watch expression for the controller, the bound input can then be used.
    This is shown below:


    ```

    function FoobarCtrl($scope) {


    var c = this;


    $scope.$watch(''c.foo'', function(nFoo) {


    if (nFoo.active) {


    ctrl.actFoo = nFoo;


    } else {


    ctrl.actFoo = null;


    }


    });


    }

    ```


    An external reference may not be used in certain situations. We want to create
    a code for the controller which will reference a code which will just reference
    a scope attribute which is inherited just in plain JavaScript. Here is the code
    for the example:


    ```

    function FoobarCtrl($scope) {


    var c = this;


    c.getActiveFoo = function() {


    if ($scope.mainC.foo.active) {


    return $scope.mainC.foo;


    } else {


    return null;


    }


    };


    }

    ```


    The above example is just similar to the previous one, with the only exception
    being that a bound input will be needed. This is shown below:


    ```

    module.directive(''foobar'', function() {


    return {


    scope: true,


    controller: ''FoobarCtrl'',


    controllerAs: ''c'',


    bindToController: {


    foo: ''=''


    },


    templateUrl: ''bar.html''


    };


    });

    ```


    The `foo` value will be provided during the use of the component. This is shown
    below:


    ```

    <foobar foo="mainC.foo">


    </foobar>

    ```


    Our controller code will then be in a position to use the bound input. This is
    shown below:


    ```

    function FoobarCtrl($scope) {


    var c = this;


    ctrl.getActiveFoo = function() {


    if (c.foo.active) {


    return c.foo;


    } else {


    return null;


    }


    };


    }

    ```


    ## Event handler and Bound output


    All of the external components used in components are not logical inputs. Others
    act as logical outputs. Consider the example given below:


    ```

    <div ng-show="c.visible">


    <p>{{c.getText(c.language)}}</p>


    <button ng-click="mainC.deleteFoobar()">


    Delete


    </button>


    </div>

    ```


    In the above example, and inside our component template, we have the `ng-click`
    directive. This has been used to invoke a method on a `mainC` reference which
    has been inherited. That is what we have done.


    For the dependency to be broken, an expression binding named `onDelete` has to
    be introduced on the definition of the directive. This is shown below:


    ```

    module.directive(''foobar'', function() {


    return {


    scope: true,


    controller: ''FoobarCtrl'',


    controllerAs: ''c'',


    bindToController: {


    visible: ''='',


    language: ''='',


    onDelete: ''&''


    },


    templateUrl: ''bar.html''


    };


    });

    ```


    For the inputs and outputs to be distinguished in AngularJS, the syntax `[]` is
    used for the input and the syntax `()` used for the output. However, in the earlier
    versions of AngularJS, such as 1.x, there was no mechanism as to how these can
    be distinguished. This is why most people prefer to use the prefix `on` for outputs.


    Once the component has been used, an expression for the new binding will then
    be plugged in. The user of the component will then decide on what the delete means
    to him or her. In our case, we have used it so as to invoke the function `deleteFoobar`
    of our main controller. This is shown below:


    ```

    <foobar


    visible="mainC.isFooBarVisible()"


    language="mainC.getLanguage()"


    onDelete="mainC.deleteFoobar()">


    </foobar>

    ```


    The expression binding will then be invoked from inside the component template.
    This is shown below:


    ```

    <div ng-show="c.visible">


    <p>{{c.getText(c.language)}}</p>


    <button ng-click="c.onDelete()">


    Delete


    </button>


    </div>

    ```


    Consider the sample code given below:


    ```

    function FoobarCtrl($scope) {


       var c = this;


    c.onFooClick = function() {


       mainC.setActiveFoo(c.foo);


    };


    }

    ```


    In the above example, we have used a controller function which will call a function
    in the parent scope. The external function call must not be an event handler in
    a particular template. It can be contained in a controller. This is what we did
    with the inputs.


    What we should do to the definition of the directive is that we should add an
    expression binding. This is shown below:


    ```

    module.directive(''foobar'', function() {


    return {


    scope: true,


    controller: ''FoobarCtrl'',


    controllerAs: ''c'',


    bindToController: {


         onActivateFoo: ''&''


    },


    templateUrl: ''bar.html''


    };


    });

    ```


    Once the template has been used, there is an invocation of `mainCtrl.setActiveFoo`
    which we set in the component controller. This is shown below:


    ```

    <foobar


    on-activate-foo="mainC.setActiveFoo(foo)">


    </foobar>

    ```


    The expression binding should then be invoked inside the controller other than
    the external inherited controller. An object argument should be provided to the
    Angular so as to know the value of the `foo` which is to be used inside the bound
    expression. This is shown below:


    ```

    function FoobarCtrl($scope) {


    var c = this;


    c.onFooClick = function() {


        c.onActivateFoo({foo: c.foo});


    };


    }

    ```


    Consider the example given below:


    ```

    module.directive(''foobar'', function() {


    return {


        scope: true,


        controller: ''FoobarCtrl'',


        controllerAs: ''c'',


    bindToController: {


        visible: ''='',


        language: ''='',


       onDelete: ''&''


    },


    templateUrl: ''bar.html''


    };


    });

    ```


    We have defined all the inputs and the outputs in the above example.


    # Conclusion


    It can be concluded that AngularJS is a very useful framework for the development
    of web applications. The usefulness of AngularJS is seen on what it does to HTML.
    Generally, it was developed for the purpose of extending what is contained in
    HTML. Note that HTML was not developed for the purpose of development of web-apps.


    However, AngularJS comes in to fill this gap. It works by extending the vocabulary
    which is contained in HTML so as to get extra and amazing functionalities. With
    HTML, it is very easy for one to declare and display dynamic content. However,
    when it comes to dealing with dynamic content, then HTML is not the best. This
    is where AngularJS comes in, and it serves to fill this gap.


    As we have said, AngularJS is used to extend the functionalities of HTML. A good
    example is when we create an HTML page and then change it by use of the AngularJS.
    This page can then be changed to display the content dynamically by the use of
    AngularJS. That is how the two work together. Applications always use data. This
    is very important for any application.


    However, other than dealing with only small amounts of data, you should learn
    to work with large data sets in AngularJS. This is possible in AngularJS, and
    your resultant application will be very useful. AngularJS can also be used for
    the purpose of adding animations to your application. These make your web application
    very attractive to its users. There is a module named `ngAnimate` in AngularJS
    which can be used for the purpose of performing these animations. Those are some
    of the features which have been discussed in this book.

