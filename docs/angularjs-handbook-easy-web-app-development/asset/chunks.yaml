    # 第 6 章 - $watch()、$digest() 和 $apply()


    这些方法在 AngularJS 中被广泛使用。你应该学会如何在 Angular 中使用它们。


    当在视图中将数据绑定到 `$scope` 对象的某个变量上时，Angular 会在内部创建一个“监视器”。这个监视器意味着它会监视 `$scope` 对象中包含的内容。这表示框架将监视该变量。要创建监视器，我们使用
    `$scope.$watch()` 函数。


    在大多数情况下，`$scope.$digest()` 和 `$scope.$watch()` 函数会自动为你调用，但在某些情况下，你可能需要手动调用它们。这就是为什么你应该了解并理解它们的工作原理。


    `$scope.$apply` 函数用于执行特定的代码，然后在其后调用 `$scope.$digest()` 函数。这将检查所有监视器，并调用所有对应的监视监听器函数。`$apply()`
    函数在将 AngularJS 代码与其他代码集成时非常有用。


    ## $watch()


    `$scope.watch()` 函数用于创建对特定变量的监视。一旦注册了监视器，就需要向 `$watch()` 函数传递两个参数。这两个参数包括：


    *   一个值函数

    *   一个监听器函数


    考虑下面的示例，展示如何实现：


    ```javascript

    $scope.$watch(function() {},


          function() {}


    );

    ```


    第一个函数代表值函数，第二个函数代表监听器函数。值函数会返回正在被监视的值。AngularJS 的工作就是检查返回的值与上次监视函数返回的值是否相同。AngularJS
    改变了检查值是否返回的方式。下面是一个示例：


    ```javascript

    $scope.$watch(function(scope) { return scope.data.myVariable },


         function() {}


    );

    ```


    在上面的函数中，值函数会返回 `scope.data.myVariable` 的值。如果这个变量的值发生了变化，那么返回的值也会不同。然后 AngularJS
    会调用监听器函数。


    如果值发生了变化，监听器函数会尝试执行它所能做的任何操作。通过使用这个值，值函数可以访问 `$scope` 及其变量。如果需要，值函数也可以监视全局变量，但大多数情况下，监视的是
    `$scope` 变量。


    如果值发生了变化，监听器函数可以执行它需要做的任何操作。有些人可能需要改变变量的内容，而另一些人可能需要改变 HTML 元素的内容。考虑下面的示例：


    ```javascript

    $scope.$watch(function(scope) { return scope.data.myVariable },


    function(nValue, oValue) {


        document.getElementById("").innerHTML =


         "" + newValue + "";


    }


    );

    ```


    上面的示例会将 HTML 元素的 innerHTML 设置为变量的新值，并且该值被嵌入到 `b` 元素中，以使内容变为粗体。


    ## $digest()


    `$scope.$digest()` 函数会遍历 `$scope` 对象及其子 `$scope` 对象中的监视器。当 `$digest()` 函数遍历完监视器后，会调用每个监视器的值函数。如果发现值函数返回的值与上次调用时返回的值不同，则会调用该监视器的监听器函数。


    每当 AngularJS 认为有必要时，它就会调用 `$digest()` 函数。但可能会遇到 AngularJS 不调用 `$digest()` 函数的情况。为了解决这个问题，只需手动调用
    `$scope.$digest()` 函数。


    ## $apply()


    `$scope.$apply()` 函数接受一个函数作为参数，该函数会被执行，然后内部会调用 `$scope.$digest()` 函数。这是确保所有监视器都被检查的一种方式。所有数据绑定随后都会被刷新。


    考虑下面的示例：


    ```javascript

    $scope.$apply(function() {


    $scope.data.myVariable = "A new value";


    });

    ```


    一旦将一个函数作为参数传递给此函数，`$scope.data.myVar` 的值就会被改变。当函数退出后，AngularJS 会调用 `$scope.$digest()`
    函数，这意味着监视器会检查被监视值的变化。


    考虑下面的示例，展示如何在 AngularJS 中使用这些函数：


    ```html

    <div ng-controller="appController">


    {{data.time}}


    <br/>


    <button ng-click="updateTime()">update time - ng-click</button>


    <button id="upTimeButton"  >change time</button>


    </div>


    <script>


    var module       = angular.module("myapplication", []);


    var appController1 = module.controller("appController", function($scope) {


    $scope.data = { time : new Date() };


    $scope.updateTime = function() {


    $scope.data.time = new Date();


    }


    document.getElementById("upTimeButton")


    .addEventListener(''click'', function() {


    console.log("change time clicked");


    $scope.data.time = new Date();


    });


    });


    </script>

    ```


    在上面的示例中，变量 `$scope.data.time` 被绑定到一个插值指令上，该指令会将变量值合并到 HTML 页面中。通过这种绑定，会在变量 `$scope.data.time`
    上内部创建一个监视器。


    我们为应用程序创建了两个按钮。第一个按钮附加了一个 `ng-click` 类型的监听器。点击此按钮会调用 `$scope.updateTime()` 函数，然后
    AngularJS 通过调用 `$scope.$digest()` 函数来更新绑定。


    第二个按钮附加了一个 JavaScript 事件监听器。当第二个按钮被点击时，该监听器会被执行。两个监听器之间的唯一区别是，对于第二个按钮的监听器，点击后数据绑定不会被更新。原因在于，第二个按钮的事件监听器执行后不会调用
    `$scope.$digest()` 函数。这意味着点击第二个按钮会更新变量 `$scope.data.time` 中的时间，但这个新时间不会显示出来。


    为了解决这个问题，可以在事件监听器的最后一行添加对 `$scope.$digest()` 的调用。如下面的示例所示：


    ```javascript

    document.getElementById("upTimeButton")


    .addEventListener(''click'', function() {


    console.log("change time clicked");


    $scope.data.time = new Date();


    $scope.$digest();


    });

    ```


    上述调用被添加到了程序的最后一行。这就是应该做的。


