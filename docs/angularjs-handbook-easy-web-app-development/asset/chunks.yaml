  trans: "\n接下来，应在文件中创建一个用于生成简单表格的重复器。实现方式如下：\n\n```\n<table>\n   <tr><th>行号</th></tr>\n\
    \   <tr ng-repeat=\"j in [0, 1, 2, 3, 4, 5, 6, 7]\"><td>{{j}}</td></tr>\n</table>\n\
    ```\n\n然后将列表修改为以下内容：\n\n```\n<table>\n  <tr><th>行号</th></tr>\n  <tr ng-repeat=\"\
    j in [0, 1, 2, 3, 4, 5, 6, 7]\"><td>{{j+1}}</td></tr>\n</table>\n```\n\n`ng-repeat`\
    \ 可用于创建具有其他规格的表格。这在 Angular 中也非常强大。此时，你将拥有一个动态运行的应用程序，并且其模型、视图和控制器分别位于不同位置。\n\n\
    # 第 3 章 - XHR\n\n你不应总是在应用程序中处理小型且硬编码的数据。我们应该能够通过使用名为 `$http` 的预构建服务，从 AngularJS\
    \ 服务器获取大型数据集。\n\n我们将有一个文件 `app/phones/devices.json`，其中包含我们拥有的手机列表。这些数据将以 JSON\
    \ 格式存储。该文件的一个示例部分如下所示：\n\n```\n[\n  {\n    \"age\": 15,\n    \"id\": \"motorola\
    \ \",\n    \"name\": \"Motorola DEFY\\u2122 with MOTOBLUR\\u2122\",\n    \"snippet\"\
    : \"你喜欢使用摩托罗拉设备和手机吗？\"\n  },\n  ...\n]\n```\n\n## 控制器\n\nAngular 的 `$http` 服务将在控制器中使用，用于向\
    \ Web 服务器发出 HTTP 请求，以便从文件 `app/phones/devices.json` 获取数据。这只是处理此类操作或与 Web 应用相关操作的一种方式。使用\
    \ AngularJS，这些服务会被注入到需要它们的地方。\n\n控制器的代码应如下所示：\n\n```\nvar myApp = angular.module('myApp',\
    \ []);\nmyApp.controller('PnListCtrl', function ($scope, $http) {\n  $http.get('phones/devices.json').success(function(data)\
    \ {\n    $scope.phones = data;\n  });\n  $scope.orderProp = 'age';\n});\n```\n\
    \n要在 Angular 中使用服务，需要将所需的依赖项名称定义为控制器构造函数函数的参数。如下所示：\n\n```\nmyApp.controller('PnListCtrl',\
    \ function ($scope, $http) {...}\n```\n\nAngularJS 中的依赖构造函数会在启动后为我们的控制器提供服务。它还会处理服务可能需要的任何传递依赖项的创建。考虑下面的示例，展示了如何实现这一点：\n\
    \n```\nvar myApp = angular.module('myApp', []);\nmyApp.controller('PnListCtrl',\
    \ ['$scope', '$http',\n  function ($scope, $http) {\n    $http.get('phones/devices.json').success(function(data)\
    \ {\n      $scope.phones = data;\n    });\n    $scope.orderProp = 'age';\n  }\n\
    ]);\n```\n\n测试可以按如下方式进行：\n\n```\ndescribe('myApp controllers', function() {\n\
    \  describe('PnListCtrl', function(){\n    var scope, ctrl, $httpBackend;\n\n\
    \    // 在测试前加载我们的应用模块定义。\n    beforeEach(module('myApp'));\n\n    // 注入器会忽略这里的前导和下划线（即\
    \ _$httpBackend_）。\n    // 这将允许我们注入服务，同时将其附加到与服务同名的变量上，以避免名称冲突。\n    beforeEach(inject(function(_$httpBackend_,\
    \ $rootScope, $controller) {\n      $httpBackend = _$httpBackend_;\n      $httpBackend.expectGET('phones/devices.json').\n\
    \        respond([{name: 'Motorola'}, {name: 'Motorola Phone'}]);\n      scope\
    \ = $rootScope.$new();\n      ctrl = $controller('PnListCtrl', {$scope: scope});\n\
    \    }));\n  });\n});\n```\n\n注意上述测试用例中的两个辅助函数。它们可用于配置和访问注入器。\n\n考虑下面的代码：\n\n\
    ```\nit('你应该创建包含从 xhr 获取的两个手机的 \"phones\" 模型', function() {\n  expect(scope.phones).toBeUndefined();\n\
    \  $httpBackend.flush();\n  expect(scope.phones).toEqual([{name: 'Motorola'},\n\
    \    {name: 'Motorola Phone'}]);\n});\n```\n\n我们希望在收到响应之前，对作用域上不存在的模型进行验证。调用 `$httpBackend.flush()`\
    \ 函数后，请求队列将被刷新到浏览器。`$http` 服务返回的 promise 将使用我们解析的响应进行解析。我们将进行断言，然后验证模型是否属于作用域。然后我们可以验证\
    \ `orderProp` 是否已正确设置。如下所示：\n\n```\nit('应为 orderProp 模型设置默认值', function() {\n\
    \  expect(scope.orderProp).toBe('age');\n});\n```\n\n在 karma 选项卡中，应观察到以下输出：\n\n\
    ```\nChrome 22.0: Executed 2 of 2 SUCCESS (0.028 secs / 0.007 secs)\n```\n\n可以在文件底部添加\
    \ `<pre>{{phones | filter:query | orderBy:orderProp | json}}</pre>`，以便以 JSON 格式列出或显示可用的手机。可以在回调中添加以下内容：\n\
    \n```\n$scope.devices = data.splice(0, 5);\n```\n\n# 第 4 章 - 链接与图片\n\n你应该知道如何为列表中的设备添加缩略图。还应添加指向这些设备的链接。\n\
    \n请注意，在 JSON 文件中，设备的链接及其 URL 以及唯一 ID 都是可用的。URL 应指向 `app/img/devices/`。\n\n考虑下面的代码片段：\n\
    \n```\n[\n  {\n    ...\n    \"id\": \"motorola \",\n    \"imageUrl\": \"img/phones/motorola.0.jpg\"\
    ,\n    \"name\": \"Motorola PHONE \",\n    ...\n  },\n  ...\n]\n```\n\n模板应如下所示：\n\
    \n```\n...\n<ul class=\"phones\">\n  <li ng-repeat=\"device in phones | filter:query\
    \ | orderBy:orderProp\" class=\"thumbnail\">\n    <a href=\"#/phones/{{device.id}}\"\
    \ class=\"thumb\"><img ng-src=\"{{device.imageUrl}}\"></a>\n    <a href=\"#/phones/{{device.id}}\"\
    >{{device.name}}</a>\n    <p>{{device.snippet}}</p>\n  </li>\n</ul>\n...\n```\n\
    \n在 `href` 的属性值中使用了双花括号绑定，以便动态生成链接。在第二步中，将绑定 `{{device.name}}` 添加为内容元素。\n\n使用了\
    \ `ngSrc` 指令来为每个设备添加图片。测试可以按如下方式实现：\n\n```\n...\nit('应渲染设备特定的链接', function() {\n\
    \  var myquery = element(by.model('query'));\n  myquery.sendKeys('nexus');\n \
    \ element.all(by.css('.phones li a')).first().click();\n  browser.getLocationAbsUrl().then(function(url)\
    \ {\n    expect(url).toBe('/phones/motorola');\n  });\n});\n...\n```\n\n我们需要验证应用程序是否为可能需要实现的设备视图生成了正确的链接。`ngSrc`\
    \ 指令可以替换为普通的 `src`。\n\n# 第 5 章 - 使用动画\n\n有时，你可能需要通过添加一些动画来增强应用程序。这可以通过使用 CSS 和\
    \ JavaScript 来实现。为了在整个应用程序中启用动画，我们必须使用 `ngAnimate` 模块。必须使用常见的 `ng` 指令来触发我们正在接入的动画的钩子。这应该自动完成。一旦找到动画，它将在标准\
    \ DOM 元素之间执行，该元素在给定时间被发出到该元素。可以使用 `ngRepeat` 和 `ngClass` 来实现这一点，只需向它们添加或删除元素即可。\n\
    \nAngularJS 模块 `ngAnimate` 将为我们提供执行动画的功能。该模块已与我们的核心 Angular 框架分开分发。为了执行额外的动画，我们将使用\
    \ jQuery。\n\n我们现在需要安装要在应用程序客户端使用的依赖项。可以使用 Bower 来实现这一点。我们需要更新配置文件 `bower.json`，使其包含新的依赖项。可以按如下方式操作：\n\
    \n```\n{\n  \"name\": \"angular-seed\",\n  \"description\": \"一个用于 AngularJS 启动的项目\"\
    ,\n  \"version\": \"0.0.0\",\n  \"homepage\": \"https://mysite.com/angular/angular-project\"\
    ,\n  \"license\": \"MIT\",\n  \"private\": true,\n  \"dependencies\": {\n    \"\
    angular\": \"1.4.x\",\n```\n"
