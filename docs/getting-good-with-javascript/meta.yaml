- md: " ## More Concepts and Best Practices\n\nThis is a pretty rough and dirty way\
    \ of testing; its primary appeal is that it's quick and easy. It's really not\
    \ very scientific. If you want to do some real performance testing, you'll want\
    \ to check out JSPerf (http://jsperf.com). This site will comprehensively test\
    \ your code, as well as keep track of the score in all the browsers you test in.\
    \ Let's see how it works:\n\nHere's what you'll see on the home page:\n\n![](img/b2872544db3ac2167aea931a76af3eea_111_0.png)\n\
    \nIt's pretty simple: just go down the form and put in your code. There's a place\
    \ to put in any starting HTML or JavaScript code that's needed for the test, but\
    \ isn't part of the code you want to test. Then, you add a title for each test\
    \ code snippet and fill in the code. You can have as many test snippets as you\
    \ want. When you're done, hit \"Save Test Case.\" You'll be taken to the test\
    \ case page, where you can run the test. Hit run test, and wait. It will run the\
    \ test, tell you which code snippet was fastest, and by how much. Then, it stores\
    \ the results from your browser in a table below, so you can compare different\
    \ browsers. Just copy that URL and try the test in a different browser, to see\
    \ how it performs. Note that JSPerf shows the results as \"Operations Per Second\"\
    ; therefore, a higher number is better.\n\nJSPerf tests are publicly visible,\
    \ so you can see what tests other people have run at http://jsperf.com/browse.\n\
    \n## Organizing your JavaScript\n\nThere's more to programming that rapidly smashing\
    \ your fingers against the keyboard. There's the meta part, like the number of\
    \ files you put your JavaScript code in, or how to organize the code within those\
    \ files. These are things beginners often don't think about, so let's take a look\
    \ at them.\n\n## One File or Many?\n\nLet's start with files. As you know from\
    \ Chapter 1, JavaScript code is stored in a file with the extension \"js\"; you\
    \ also know that there are two ways to include JavaScript in your web page:\n\n\
    ```\n<script src=\"path/to/script.js\"></script>\n<script>\n    // include that\
    \ code inline\n</script>\n```\n\nBecause it's wise to separate your content and\
    \ functionality, the first method above is better practice. But should all your\
    \ JavaScript go in one file? Or should you separate it into different files?\n\
    \nWhen you're coding, it's definitely easier to break that code into several files.\
    \ Since JavaScript global variables (the ones outside functions) are available\
    \ from a global object accessible everywhere that JavaScript is on the page, you\
    \ can create variables in one file and access them another, as long as both files\
    \ are linked to in your HTML.\n\nHowever, splitting your JavaScript into several\
    \ files comes with a cost: that cost is paid by your website visitors. Here's\
    \ why: for every file their browser needs to download, it is downloading more\
    \ than just the code. There's the overhead—like HTTP headers—that comes with the\
    \ file. Because of this, it's much better to store all your code in one file,\
    \ to minimize the amount of overhead.\n\nThe best medium here would be to develop\
    \ your code in separate files and then concatenate those files together when you're\
    \ ready to publish the site. There are programs (such as build scripts) that can\
    \ help you automate this process. This might be a bit beyond your skill level\
    \ at this point, but if you're ready for it check out my tutorial on using Ant\
    \ to compile and compress JavaScript⁸, published on Nettuts+ (see the section\
    \ below for more on compression).\n\n## Global Variables\n\nBy now you'reGlyph\
    \ familiar with the concept of global variables. You might think this is a great\
    \ thing, since everything is always accessible. However, that's not the case.\
    \ Here's why: the more you write JavaScript, the more you'll find that the code\
    \ you use on a given page isn't just yours: you'll use libraries, helper methods,\
    \ and other code from other developers. If your site has advertising, you'll find\
    \ that many advertisers insert their ads via JavaScript. If all the code relies\
    \ on global variables, there's a really good chance that one script will overwrite\
    \ the variables of another script. Since there's no protection against this built\
    \ into JavaScript engines, you have to code very defensively. Because of this,\
    \ it's a best practice to use as few global variables as possible.\n\nHow can\
    \ you do this? Well—and I hate to sound like a broken record, but—here's another\
    \ place that anonymous, self-invoking functions are really useful. If all your\
    \ code can be contained in one place, you can do this:\n\n```\n(function () {\n\
    \n    // all your code goes here\n\n})();\n```\n\nThis way, you don't have to\
    \ worry about anyone getting at your variables; they are all safely tucked away\
    \ inside the scope of the anonymous function. And since functions can access the\
    \ variables in the scope outside them, you can access any global variables that\
    \ other libraries set.\n\nBut what if you're writing a library, or some similar\
    \ code that needs to be accessed outside of itself? In cases like this, you'll\
    \ have to use a global variable. That's not a bad thing, as long as you name and\
    \ set it properly. You'll probably want to use the module pattern for this if\
    \ you want to have your private variables and methods. Then, assign a returned\
    \ object or function (depending on the complexity of your library) to the global\
    \ variable.\n\nI prefer to give my global variables all uppercase names; I do\
    \ this for two reasons:\n\n1. It makes it clear to me when I'm reading my code\
    \ that it's a global variable.\n2. It reduces the chance of having that variable\
    \ overwritten, because most libraries don't do this (yet!).\n\nYou might want\
    \ to adopt this principle.\n\n## The Good Parts and JSLint\n\nHere's a dirty secret\
    \ I've been hiding all along the way: JavaScript has bad parts. There are several\
    \ terrible features in JavaScript that you should never ever use. I haven't mentioned\
    \ any of these anywhere at all in this book, so you currently have a relatively\
    \ \"pure\" understanding of JavaScript.\n\n> **ROCK TIP**\n\nDon't misunderstand\
    \ me here: this doesn't mean that if you hear about something not mentioned in\
    \ this book, it's a bad part; I just couldn't fit it in! Check out the appendices\
    \ for more great resources and topics you should look into next.\n\nHowever, you\
    \ should really know about the bad parts, eventually. I really recommend you get\
    \ Douglas Crockford's book *JavaScript: The Good Parts*. It will do more than\
    \ just teach you what's naughty and what's nice about JavaScript. You'll really\
    \ be taken to a new level of JavaScript understanding.\n\nOnce you've read the\
    \ book (or even before!), you can run your JavaScript through JSLint, Douglas\
    \ Crockford's JavaScript code quality tool. At the top paste in your code. Then,\
    \ at the bottom, choose the best practices you want JSLint to check for. If it\
    \ finds places where you aren't using those best practices, it will let you know.\n\
    \nRemember, your code will probably still run, even if it doesn't pass the JSLint\
    \ test. This is just a self-check. Also, realize that there are several very reputable\
    \ JavaScript developers who don't see eye to eye on everything Crockford calls\
    \ a Bad Part. Ultimately, you'll have to weigh both sides and decide what's right\
    \ for yourself.\n\n![](img/b2872544db3ac2167aea931a76af3eea_116_0.png)\n\nFig.\
    \ 4-3. JSLint\n\n## Optimizing your JavaScript\n\nWe talked a bit about how one\
    \ JavaScript file is better for your site visitors than multiple ones. There's\
    \ something else you can do to improve the time it takes your site to load for\
    \ a visitor: JavaScript minification. The idea here is that every byte counts\
    \ when a site visitor is downloading the JavaScript file. To improve that time,\
    \ we can take out all the whitespace (spaces, tabs, line breaks, etc.) and shorten\
    \ all the variables names, since these extra bytes are really just there to make\
    \ our jobs easier, and aren't necessary for the code to run properly.\n\nSo, when\
    \ your website is finished, you can go through your code and take out all the\
    \ whitespace.\n\nActually, that's not necessary. There are command-line tools\
    \ that do this for you. Since this is only a significant benefit if you have a"
  mdcn: "\n## 更多概念与最佳实践\n\n这是一种相当粗略的测试方法；它的主要吸引力在于快速简便。它并不是很科学。如果你想进行真正的性能测试，你应该了解一下\
    \ JSPerf（http://jsperf.com）。这个网站会全面测试你的代码，并记录你在所有浏览器中测试的分数。让我们看看它是如何工作的：\n\n在首页上你会看到：\n\
    \n![](img/b2872544db3ac2167aea931a76af3eea_111_0.png)\n\n这很简单：只需沿着表单填写你的代码。有一个地方可以填入测试所需的启动\
    \ HTML 或 JavaScript 代码，但这些不是你想测试的代码。然后，你为每个测试代码片段添加标题并填写代码。你可以添加任意数量的测试片段。完成后，点击\"\
    Save Test Case\"。你会被带到测试用例页面，在那里可以运行测试。点击运行测试，然后等待。它会运行测试，告诉你哪个代码片段最快，快多少。然后，它会在下方的表格中存储来自你浏览器的结果，以便你可以比较不同的浏览器。只需复制那个\
    \ URL，在不同的浏览器中尝试测试，看看它的表现如何。注意，JSPerf 以\"Operations Per Second\"（每秒操作数）显示结果；因此，数字越高越好。\n\
    \nJSPerf 测试是公开可见的，所以你可以在 http://jsperf.com/browse 查看其他人运行过的测试。\n\n## 组织你的 JavaScript\n\
    \n编程不仅仅是快速敲击键盘。还有元层面的问题，比如你将 JavaScript 代码放在多少个文件中，或者如何在这些文件中组织代码。这些往往是初学者不会考虑的事情，所以让我们来看看。\n\
    \n## 一个文件还是多个？\n\n让我们从文件开始。正如你在第 1 章中所知，JavaScript 代码存储在扩展名为\"js\"的文件中；你也知道有两种方法可以在网页中包含\
    \ JavaScript：\n\n```\n<script src=\"path/to/script.js\"></script>\n<script>\n\
    \    // include that code inline\n</script>\n```\n\n因为将内容和功能分开是明智的，所以上面的第一种方法更好。但是所有的\
    \ JavaScript 都应该放在一个文件中吗？还是应该分成不同的文件？\n\n在编码时，将代码分成几个文件确实更容易。由于 JavaScript 全局变量（函数外的变量）可以从页面上所有\
    \ JavaScript 都可访问的全局对象中使用，你可以在一个文件中创建变量，在另一个文件中访问它们，只要两个文件都在你的 HTML 中链接即可。\n\n\
    然而，将 JavaScript 分成几个文件是有代价的：这个代价由你的网站访问者承担。原因如下：对于他们浏览器需要下载的每个文件，下载的不仅仅是代码。还有随文件而来的开销——比如\
    \ HTTP 头。因此，最好将所有代码存储在一个文件中，以尽量减少开销量。\n\n这里最好的折中方案是在单独的文件中开发你的代码，然后在准备发布网站时将这些文件拼接在一起。有一些程序（比如构建脚本）可以帮助你自动完成这个过程。这可能目前有点超出你的技能水平，但如果你准备好了，可以查看我在\
    \ Nettuts+ 上发表的关于使用 Ant 编译和压缩 JavaScript⁸ 的教程（关于压缩的更多内容见下文）。\n\n## 全局变量\n\n到现在你已经熟悉全局变量的概念了。你可能认为这是一件好事，因为所有东西总是可访问的。然而，事实并非如此。原因如下：你写的\
    \ JavaScript 越多，就越会发现给定页面上使用的代码不仅仅是你的：你会使用库、辅助方法和其他开发者的代码。如果你的网站有广告，你会发现很多广告商通过\
    \ JavaScript 插入他们的广告。如果所有代码都依赖全局变量，很有可能一个脚本会覆盖另一个脚本的变量。由于 JavaScript 引擎中没有内置的保护机制来防止这种情况，你必须非常防御性地编码。因此，最佳实践是尽量少用全局变量。\n\
    \n怎么做呢？好吧——我不想像个破唱片一样重复，但是——这里又是匿名自调用函数真正有用的地方。如果你的所有代码都可以放在一个地方，你可以这样做：\n\n```\n\
    (function () {\n\n    // all your code goes here\n\n})();\n```\n\n这样，你不必担心任何人访问你的变量；它们都安全地藏匿在匿名函数的作用域内。而且由于函数可以访问外部作用域中的变量，你可以访问其他库设置的任何全局变量。\n\
    \n但如果你正在编写一个库，或者某些需要在外部访问的类似代码呢？在这种情况下，你不得不使用全局变量。这并不可怕，只要你正确地命名和设置它。如果你想拥有私有变量和方法，你可能希望为此使用模块模式。然后，将返回的对象或函数（取决于你的库的复杂程度）赋值给全局变量。\n\
    \n我喜欢给我的全局变量全部使用大写名称；我这样做有两个原因：\n\n1. 这让我在阅读代码时清楚地知道它是一个全局变量。\n2. 这降低了该变量被覆盖的可能性，因为大多数库不会这样做（目前还不会）！\n\
    \n你可能想要采用这个原则。\n\n## 精华部分和 JSLint\n\n这里有一个我一直隐藏到现在的秘密：JavaScript 有不好的部分。JavaScript\
    \ 中有一些你不应该使用的糟糕特性。我在本书中没有提到任何这些，所以你目前对 JavaScript 有一个相对\"纯净\"的理解。\n\n> **ROCK\
    \ TIP**\n\n不要误解我这里的意思：这并不意味着如果听到本书中没有提到的东西，它就是不好的部分；我只是放不下了！查看附录以获取更多你应该继续了解的优秀资源和主题。\n\
    \n然而，你最终确实应该了解不好的部分。我真的推荐你读 Douglas Crockford 的书 *JavaScript: The Good Parts*（JavaScript\
    \ 语言精粹）。它不仅仅是教你 JavaScript 中什么是好的、什么是坏的。它真的会带你进入一个全新的 JavaScript 理解层次。\n\n读完这本书后（甚至之前！），你可以将你的\
    \ JavaScript 代码通过 JSLint 运行，Douglas Crockford 的 JavaScript 代码质量工具。在顶部粘贴你的代码。然后，在底部选择你希望\
    \ JSLint 检查的最佳实践。如果它发现你没有使用这些最佳实践的地方，它会告诉你的。\n\n记住，你的代码可能仍然会运行，即使它没有通过 JSLint\
    \ 测试。这只是一个自我检查。另外，要意识到有一些非常知名的 JavaScript 开发者并不完全认同 Crockford 所称的\"不好的部分\"。最终，你必须权衡双方，决定什么对你自己来说是正确的。\n\
    \n![](img/b2872544db3ac2167aea931a76af3eea_116_0.png)\n\nFig. 4-3. JSLint\n\n\
    ## 优化你的 JavaScript\n\n我们稍微讨论过为什么一个 JavaScript 文件比多个文件对你的网站访问者更好。还有一件事你可以做来改善网站对访问者的加载时间：JavaScript\
    \ 压缩。这里的想法是，当网站访问者下载 JavaScript 文件时，每个字节都很重要。为了改善这个时间，我们可以去掉所有的空白字符（空格、制表符、换行符等）并缩短所有变量名称，因为这些额外的字节实际上只是为了让我们的工作更轻松，对代码正确运行并非必需。\n\
    \n所以，当你的网站完成后，你可以浏览你的代码并去掉所有的空白字符。\n\n实际上，这并不必要。有命令行工具可以帮你做这个。因为只有当你有\n"
