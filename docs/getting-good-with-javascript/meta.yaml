    ```\n\n这就是使用 **new** 的思路：我们获得了一种超级简单的创建对象的方式。显然，当你只需要一两个简单对象时，你不会使用这个。它在你有大量功能要打包到一个对象中，或者你想创建许多相似对象时最有用。\n\
    \n我们稍后还会回到 **new**。现在，让我们讨论其他改变 **this** 的方式。\n\n### call 和 apply\n\n我前面提到过，JavaScript\
    \ 中一切都是对象——甚至是函数。由于函数是对象，它们可以有属性和方法。**call** 和 **apply** 是函数默认拥有的两个方法。\n\n这些方法存在的唯一原因就是改变函数内部\
