    parts. There are several terrible features in JavaScript that you should never
    ever use. I haven''t mentioned any of these anywhere at all in this book, so you
    currently have a relatively "pure" understanding of JavaScript.


    > **ROCK* TIP**


    Don''t misunderstand me here: this doesn''t mean that if you hear about something
    not mentioned in this book, it''s a bad part; I just couldn''t fit it in! Check
    out the appendices for more great resources and topics you should look into next.


    However, you should really know about the bad parts, eventually. I really recommend
    you get Douglas Crockford''s book *JavaScript: The Good Parts*. It will do more
    than just teach you what''s naughty and what''s nice about JavaScript. You''ll
    really be taken to a new level of JavaScript understanding.


    Once you''ve read the book (or even before!), you can run your JavaScript through
    JSLint, Douglas Crockford''s JavaScript code quality tool. At the top paste in
    your code. Then, at the bottom, choose the best practices you want JSLint to check
    for. If it finds places where you aren''t using those best practices, it will
    let you know.


    Remember, your code will probably still run, even if it doesn''t pass the JSLint
    test. This is just a self-check. Also, realize that there are several very reputable
    JavaScript developers who don''t see eye to eye on everything Crockford calls
    a Bad Part. Ultimately, you''ll have to weigh both sides and decide what''s right
    for yourself.'
