- md: " ## The Basics\n\noften you'll evaluate other expressions for their \"truthiness\"\
    \ or \"falsiness.\" We'll see more about how to do this later on in this chapter,\
    \ when discussing looping and conditionals.\n\n## Null and Undefined\n\nMost languages\
    \ have a value that is the \"non-existent\" value. By non-existent, I mean that\
    \ when you try to get a value that doesn't exist (like a variable with no value),\
    \ you'll get `undefined` back. There's another value in this strain, and that's\
    \ `null`. There isn't usually a need to distinguish between `null` and `undefined`;\
    \ but if you need to \"get rid of\" the value in a variable, you can set it to\
    \ `null`.\n\n## Object\n\nWhat we've looked at so far are considered primitive\
    \ values; they're the raw pieces that every language has, in some form or another.\
    \ Now, we move on to reference values. Reference values are different from primitive\
    \ values (i.e. strings, numbers, booleans, `null`, and `undefined`) in that they\
    \ are passed around your code by reference. I know that's abstract, so we'll come\
    \ back to this concept when we can put it in context (if you can't wait, that's\
    \ on page 80, when we're talking about calling and applying functions).\n\nObjects\
    \ are one of JavaScript's most powerful features. Think of an object as a wrapper\
    \ for a bunch of primitive or reference values. Here's an example:\n\n```\nvar\
    \ obj = {\n    name    : \"Andrew\",\n    age     : 20,\n    awake   : true,\n\
    \    company : {\n        name : \"XYZ Ltd.\",\n        id   : 12345\n    }\n\
    };\n```\n\nAn object is delimited by curly braces; inside the object, we have\
    \ a list of key-value pairs. A key-value pair is just what it sounds like: a pair\
    \ of values, one of which is the key that points to another. If I wanted to get\
    \ my name out of this object, I'd ask the object for its name property—that's\
    \ what we call the value in a key-value pair. Also notice that each pair, except\
    \ for the last one, ends with a comma; that's important. What's not important\
    \ is the spacing; I've added some extra spacing here to make our object pretty,\
    \ but I could have jammed it all on one line, sans any spacing, and it would be\
    \ the same.\n\nAs you can see, any type of value can be a property of an object.\
    \ I've stuffed a string, a number, a Boolean, and even another object in there.\
    \ You can access properties in two ways: either the dot notation or the square\
    \ bracket notation, as showcased below:\n\n### Example 2.4\n\n```\nvar obj = {\
    \ name : \"Joe\", age : 10 };\n\nalert( obj.name ); // \"Joe\"\n\nalert( obj[\"\
    age\"] ); // 10\n```\n\nCreating custom objects like this will be important for\
    \ your JavaScript applications. It allows you to make your own custom values that\
    \ aren't built into JavaScript. Need a **Person** object? No problem. Or what\
    \ about a tabbed container? JavaScript objects have you covered. We'll come back\
    \ to custom objects in the next chapter, when we dive ankle-deep into the dirty\
    \ waters of object-oriented programming.\n\nA final note about objects: you don't\
    \ need to put all the properties you want them to have in them right away; you\
    \ can add them later. We'll see more about this later.\n\n## Array\n\nMost programming\
    \ languages have arrays, which are a great way to hold bunches of data. They're\
    \ very similar to objects, but without the keys.\n\n```\n[\"Buy milk\", \"Feed\
    \ cat\", \"Pick up dry cleaning\", \"Deposit Cheque\"]\n```\n\nAn array is delimited\
    \ by brackets and each value is separated by a comma. Of course, you aren't limited\
    \ to strings, as I've used here. Also, you don't have to use only values of the\
    \ same type in a single array.\n\n```\n[\"string\", 20, false, null, { \"id\"\
    \ : 8888 }]\n```\n\nIf you'd like to access an item from an array, you can use\
    \ square bracket notation. You would do this to access the first item in the array:\n\
    \n### Example 2.5\n\n```\nvar arr = [\"string\", 20, false];\nalert( arr[0] );\
    \ // \"string\"\n```\n\n## Date\n\nArray item indices are zero-based, which means\
    \ the first item is 0, the second is 1, and so on.\n\nSo far, all the values we've\
    \ looked at have been literal; this means that we haven't used any \"real\" code\
    \ to give the JavaScript interpreter our values; we've just inputted the raw string,\
    \ number, Boolean, or whatever. The Date value is the first value we'll look at\
    \ that can't be created that way.\n\nSo, to make a JavaScript Date object, you'll\
    \ do this:\n\n```\nnew Date()\n```\n\nThis introduces some new syntax, so let's\
    \ go over that first. The **new** keyword simply means we want to create a new\
    \ object; in this case, that's a date object. `Date`, in this case, is the name\
    \ of a function. We'll discuss functions in the next chapter, but they're basically\
    \ wrappers for related lines of code. You call a function—that means run the code\
    \ inside it—by placing parentheses after the function name.\n\nWhat you see above\
    \ will give you a new date object that holds the date and time you created that\
    \ object...right down to the millisecond. If you want to create a date object\
    \ for a specific date or time, you'll have to pass in the right parameters. Parameters?\
    \ Well, if you want a function to use values outside itself, you have to give\
    \ them to it. To do so, just put them between those parentheses that called the\
    \ function. Don't forget to separate multiple parameters with commas.\n\n> **ROCK\
    \ TIP**\n>\n> Actually, we can create all the primitive types in a way similar\
    \ to this, but I'm not going to teach you that, because there's never a good reason\
    \ to do so.\n\nThere are several parameters you can use to create other dates.\
    \ You can pass in a string date:\n\n```\nnew Date(\"January 17, 2012\")\n```\n\
    \nOr, you can pass a list of parameters, corresponding to the following list:\
    \ year, month, day, hour, minute, second, millisecond. You don't have to add them\
    \ all; only the ones that matter. It's important to note that the month number\
    \ is zero-based. This means that to get January, you use the number 0 and to get\
    \ December, you use 11.\n\n```\nnew Date(2009, 3, 20, 17, 30)\n```\n\nThis will\
    \ return April 20, 2009 at 5:30:00.0 PM. Your date object will also include time\
    \ zone information, based on the settings on your computer.\n\n## Semicolons\n\
    \nYou may have noticed the semicolons popping up here and there in the bits of\
    \ code we've looked at so far. These are important in JavaScript; they delimit\
    \ statements. So, when should you use semicolons? Well, the short and easy answer\
    \ is to use them at the end of each line. The more accurate answer is to use one\
    \ after each expression statement. Vague, eh? Explaining how all this works is\
    \ a bit beyond this book. When you're beginning, it's easiest to learn where to\
    \ put your semicolons by looking at other people's code. As you take your cues\
    \ from the code snippets you see in this book, these rules will hold true **most\
    \ of the time**:\n\n- Any single line that you could put in your Firebug console\
    \ should have a semicolon at the end.\n\n```\nvar someVar = \"value\"; // semicolon\n\
    \nsomeFunction(\"parameter\"); // semicolon\n```\n\n- Any statement that includes\
    \ a block (lines of code between curly braces) should not have semicolons at the\
    \ end of the lines that open and close the block (the lines that usually end with\
    \ an opening or closing curly brace).\n\n```\nif (true) { // no semicolon\n  \
    \  doThis(); // semicolon\n} // no semicolon\n```\n\nI know this code might not\
    \ make sense right now, but just keep these semicolon rules in the back of your\
    \ mind.\n\n## Comments\n\nHere's something you'll definitely find useful: you\
    \ can add comments to your JavaScript code. To make a single-line comment, use\
    \ two backslashes. You can do this for a whole line, or just part of one:\n\n\
    ```\n// This is a useless comment\nvar x = 10; // x is now equal to 10\n```\n\n\
    If you want multi-line comments, use a backslash and an asterisk; reverse that\
    \ to end the comment:\n\n```\n/* file: navigation.js\n   author: Andrew Burgess\n\
    \   date: July 2, 2011\n   purpose: provides animation for the site navigation\n\
    */\n```\n\nMake sure you don't abuse comments. Don't litter your files with them,\
    \ and make the comments you do use worthwhile.\n\n## Operators\n\nWell, now that\
    \ we know what values we can use, and how to store them, let's talk about operators.\
    \ Operators are used to work with variables and values; often, they'll change\
    \ variables, or return values that you'll want to assign to variables. Let's take\
    \ a look at some of the operators we've got in our toolbox.\n\n### Arithmetic\
    \ Operators\n\nThese are probably the most often used operators. They're your\
    \ standard math operators, good friends of most people since about grade 2.\n\n\
    ### Example 2.6\n\n```\nvar four = 2 + 2, // addition operator\n    hour = 24\
    \ - 13, // subtraction operator\n    seventy = 7 * 10, // multiplication operator\n\
    \    avg_days_per_week = 365 / 52, // division operator\n    remainder = 31 %\
    \ 2, // modulus operator\n    msg = \"the time is \" + hour + \" o'clock\"; //\
    \ addition operator used on strings\n\nconsole.log(four); // 4\nconsole.log(hour);\
    \ // 11\nconsole.log(seventy); // 70\nconsole.log(avg_days_per_week); // 7.019230769230769\n\
    console.log(remainder); // 1\nconsole.log(msg); // \"the time is 11 o'clock\"\n\
    ```"
  mdcn: "\n ## 基础知识\n\n通常你会对其他表达式进行\"真值\"或\"假值的评估。我们将在本章后续讨论循环和条件语句时，进一步了解如何做到这一点。\n\
    \n## Null 与 Undefined\n\n大多数语言都有一个表示\"不存在\"的值。所谓不存在，是指当你尝试获取一个不存在的值时（比如一个没有值的变量），你会得到`undefined`。与此类似的还有另一个值，那就是`null`。通常没有必要区分`null`和`undefined`；但如果你需要\"\
    清除\"某个变量的值，可以将其设为`null`。\n\n## 对象\n\n到目前为止，我们所看到的都是原始值；它们是各种语言都以某种形式存在的基本组成部分。现在，我们来看引用值。引用值与原始值（即字符串、数字、布尔值、`null`和`undefined`）不同，它们在代码中是通过引用来传递的。我知道这很抽象，所以我们会在可以结合具体语境时再回过头来讨论这个概念（如果你迫不及待，可以翻到第80页，我们在那里讨论函数的调用和应用）。\n\
    \n对象是 JavaScript 最强大的特性之一。可以把对象看作是一组原始值或引用值的包装器。下面是一个例子：\n\n```\nvar obj = {\n\
    \    name    : \"Andrew\",\n    age     : 20,\n    awake   : true,\n    company\
    \ : {\n        name : \"XYZ Ltd.\",\n        id   : 12345\n    }\n};\n```\n\n\
    对象由花括号界定；在对象内部，我们有一组键值对。键值对正如其名：一对值，其中一个是键，指向另一个值。如果我想从这个对象中获取我的名字，我会向对象请求它的 name\
    \ 属性——这就是我们在键值对中所说的值。另外请注意，除了最后一对之外，每一对都以逗号结尾；这很重要。而间距并不重要；我在这里添加了一些额外的空格来让对象看起来更美观，但我可以把它全部挤在一行里，没有任何间距，效果也是一样的。\n\
    \n如你所见，任何类型的值都可以作为对象的属性。我在里面放了一个字符串、一个数字、一个布尔值，甚至另一个对象。你可以用两种方式访问属性：点符号或方括号符号，如下所示：\n\
    \n### 示例 2.4\n\n```\nvar obj = { name : \"Joe\", age : 10 };\n\nalert( obj.name\
    \ ); // \"Joe\"\n\nalert( obj[\"age\"] ); // 10\n```\n\n像这样创建自定义对象对你的 JavaScript\
    \ 应用程序很重要。它可以让你创建 JavaScript 内置的自定义值。需要一个**Person**对象？没问题。或者需要一个标签页容器？JavaScript\
    \ 对象也能满足你的需求。我们将在下一章深入探讨面向对象编程的泥沼时，再回过头来讨论自定义对象。\n\n关于对象的最后一点：你不需要一次性把所有需要的属性都放进去；可以稍后添加。我们稍后会看到更多相关内容。\n\
    \n## 数组\n\n大多数编程语言都有数组，这是存储大量数据的好方法。它们与对象非常相似，但没有键。\n\n```\n[\"Buy milk\", \"\
    Feed cat\", \"Pick up dry cleaning\", \"Deposit Cheque\"]\n```\n\n数组由方括号界定，每个值之间用逗号分隔。当然，你不局限于使用字符串，就像我这里用的那样。而且，你也不一定非要在同一个数组中只使用相同类型的值。\n\
    \n```\n[\"string\", 20, false, null, { \"id\" : 8888 }]\n```\n\n如果你想访问数组中的某一项，可以使用方括号符号。要访问数组中的第一个项目，你可以这样做：\n\
    \n### 示例 2.5\n\n```\nvar arr = [\"string\", 20, false];\nalert( arr[0] ); // \"\
    string\"\n```\n\n数组的索引是**从零开始**的，这意味着第一个项目是 0，第二个是 1，依此类推。\n\n## 日期\n\n到目前为止，我们看到的所有值都是字面量；这意味着我们没有使用任何\"\
    真正的\"代码来向 JavaScript 解释器提供我们的值；我们只是输入了原始的字符串、数字、布尔值或其他什么。Date 值是我们看到的第一个无法以这种方式创建的值。\n\
    \n所以，要创建一个 JavaScript Date 对象，你需要这样做：\n\n```\nnew Date()\n```\n\n这引入了一些新的语法，所以我们先来解释一下。**new**关键字仅仅表示我们想要创建一个新对象；在这个例子中，就是一个日期对象。`Date`在此是一个函数的名称。我们将在下一章讨论函数，但它们基本上就是相关代码行的包装器。你可以调用一个函数——也就是运行它里面的代码——通过在函数名后面加上括号来实现。\n\
    \n你在上面看到的代码会给你一个日期对象，它包含你创建该对象时的日期和时间……精确到毫秒。如果你想创建一个特定日期或时间的日期对象，你需要传入合适的参数。参数？如果你想让函数使用它自身以外的值，你必须把这些值给它。这样做的时候，只需把它们放在调用函数的那些括号之间即可。别忘了用逗号分隔多个参数。\n\
    \n> **ROCK 提示**\n>\n> 实际上，我们可以用类似的方式创建所有原始类型，但我不会教你这个，因为这样做从来没有好的理由。\n\n你可以使用几个参数来创建其他日期。你可以传入一个字符串日期：\n\
    \n```\nnew Date(\"January 17, 2012\")\n```\n\n或者，你可以传入一系列参数，对应以下列表：年、月、日、时、分、秒、毫秒。你不需要全部添加；只添加需要的即可。需要注意的是，月份数字是从零开始的。这意味着要得到一月，你使用数字\
    \ 0；要得到十二月，你使用 11。\n\n```\nnew Date(2009, 3, 20, 17, 30)\n```\n\n这将返回 2009 年 4\
    \ 月 20 日下午 5:30:00.0。你的日期对象还会包含时区信息，基于你电脑上的设置。\n\n## 分号\n\n你可能已经注意到，在我们目前看到的代码片段中，分号时不时会出现。这些在\
    \ JavaScript 中很重要；它们用于分隔语句。那么，什么时候应该使用分号呢？简短而简单的答案是：每行末尾都使用。更准确的答案是：在每个表达式语句之后使用一个。很模糊，对吧？解释这一切是如何工作的已经超出了本书的范围。对于初学者来说，通过查看他人的代码来学习分号的使用位置是最简单的。当你从本书中的代码片段汲取经验时，这些规则**大部分时间**都成立：\n\
    \n- 任何你可以在 Firebug 控制台中输入的单行代码，末尾应该有分号。\n\n```\nvar someVar = \"value\"; // 分号\n\
    \nsomeFunction(\"parameter\"); // 分号\n```\n\n- 任何包含代码块的语句（花括号之间的代码行）不应该在打开和关闭代码块的行末尾使用分号（通常是带有开始或结束花括号的那一行）。\n\
    \n```\nif (true) { // 无分号\n    doThis(); // 分号\n} // 无分号\n```\n\n我知道这些代码现在可能还看不懂，但请把这些分号规则记在脑海深处。\n\
    \n## 注释\n\n这里有一些你一定会发现有用的东西：你可以向 JavaScript 代码中添加注释。要添加单行注释，使用两个反斜杠。你可以针对整行，或者只是行的一部分这样做：\n\
    \n```\n// This is a useless comment\nvar x = 10; // x is now equal to 10\n```\n\
    \n如果你想要多行注释，使用反斜杠和星号；反过来（星号和反斜杠）结束注释：\n\n```\n/* file: navigation.js\n   author:\
    \ Andrew Burgess\n   date: July 2, 2011\n   purpose: provides animation for the\
    \ site navigation\n*/\n```\n\n确保不要滥用注释。不要让你的文件充满注释，而且要让你使用的注释有价值。\n\n## 运算符\n\n\
    好了，既然我们知道了可以使用哪些值，以及如何存储它们，让我们来谈谈运算符。运算符用于处理变量和值；通常，它们会改变变量，或者返回你想要赋值给变量的值。让我们看看工具箱里有哪些运算符。\n\
    \n### 算术运算符\n\n这些可能是使用最频繁的运算符。它们是标准的数学运算符，大约是大多数人在二年级时就认识的老朋友了。\n\n### 示例 2.6\n\
    \n```\nvar four = 2 + 2, // 加法运算符\n    hour = 24 - 13, // 减法运算符\n    seventy =\
    \ 7 * 10, // 乘法运算符\n    avg_days_per_week = 365 / 52, // 除法运算符\n    remainder\
    \ = 31 % 2, // 取模运算符\n    msg = \"the time is \" + hour + \" o'clock\"; // 用于字符串的加法运算符\n\
    \nconsole.log(four); // 4\nconsole.log(hour); // 11\nconsole.log(seventy); //\
    \ 70\nconsole.log(avg_days_per_week); // 7.019230769230769\nconsole.log(remainder);\
    \ // 1\nconsole.log(msg); // \"the time is 11 o'clock\"\n```\n"
