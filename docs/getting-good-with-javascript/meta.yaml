    # Optimizing your JavaScript


    We talked a bit about how one JavaScript file is better for your site visitors
    than multiple ones. There''s something else you can do to improve the time it
    takes your site to load for a visitor: JavaScript minification. The idea here
    is that every byte counts when a site visitor is downloading the JavaScript file.
    To improve that time, we can take out all the whitespace (spaces, tabs, line breaks,
    etc.) and shorten all the variables names, since these extra bytes are really
    just there to make our jobs easier, and aren''t necessary for the code to run
    properly.


    So, when you''re website is finished, you can go through your code and take out
    all the whitespace.


