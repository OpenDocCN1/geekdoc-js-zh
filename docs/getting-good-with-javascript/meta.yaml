  - '[PAGE 29]


    Besides the obvious ways these operators work, you can see that we''re assigning
    the value of each operation to a variable. Also, notice that we only need to use
    one var statement, since each variable assignment is separated by commas. Then,
    notice that + operator is used to concatenate strings. We can even throw a number
    in there and JavaScript will convert it to part of the resulting string.


    The one operator above that you might not be familiar with is the modulus (%)
    operator. It returns the remainder or the division of the two numbers. The result
    for the example above is 1, because 31 / 2 is 15, with remainder 1.


    # Comparison Operators


    Besides acting on values, you''ll want to compare them. You''ll be familiar with
    some of these:


    # Example 2.7


    ```

    alert( 10 < 5 ); // false

    alert( 10 > 5 ); // true

    alert( 4 <= 3 ); // false

    alert( 4 >= 3 ); // true

    ```


    It''s not hard at all to figure out which number is greater, or lesser. Besides
    "less-than" and "greater-than", we''ve got "less-than-or-equal-to" and "greater-than-or-equal-to."
    All of these operators return boolean values.


    You can use these operators on strings as well:'
  - "[PAGE 30]\n\nThe Basics 29\n\nExample 2.8\n\n```\nalert( \"cat\" > \"dog\" );\
    \ // false\nalert( \"bacon\" > \"chunks\" ); // false\nalert( \"cats\" >= \"cats\"\
    \ ); // true\nalert( \"fishing\" <= \"sleeping\" ); // true\nalert( \"cat\" >\
    \ \"CAT\" ); // true\n```\n\nHow does this work? Well, each letter has a character\
    \ code, a number that identifies it. It's the numbers that are compared. It's\
    \ important to note that capital letters don't line up beside their lowercase\
    \ children. All the capital letters come before the lowercase ones, so \"A\" <\
    \ \"z\" is true.\n\nAnd it's not just letters that have character codes; every\
    \ character you can type, including ones you can't (like Shift, Escape, and the\
    \ others in the modifier gang), has a character code. So a string with numbers\
    \ or punctuation can be compared this way.\n\nHow about just checking to see if\
    \ two values are equal? Don't make the mistake of doing this:\n\n```\nvar a =\
    \ \"cat\",\n    b = \"dog\";\n\na = b // WRONG: DOES NOT COMPARE\n```\n\n![](img/b2872544db3ac2167aea931a76af3eea_30_0.png)\n\
    \nLook at this for a second; can you see why you can't use = to compare values?\
    \ That's the assignment operator; you use a single equal-sign to assign a value\
    \ to variable. To test for equality, you can use three equal-signs (often called\
    \ the triple-equals operator)."
  - "[PAGE 31]\n\n# Example 2.9\n\n```\nvar a = \"cat\",\n    b = \"dog\";\n\nconsole.log(\
    \ a === b ); // false\nconsole.log( a === \"cat\" ); // true\n```\n\n# Unary Operators\n\
    \nAll the operators we've looked as so far work with two values, one on each side.\
