  md: '# More Concepts and Best Practices


    that JavaScript is on the page, you can create variables in one file and access
    them another, as long as both files are linked to in your HTML.


    However, splitting your JavaScript into several files comes with a cost: that
    cost is paid by your website visitors. Here''s why: for every file their browser
    needs to download, it is downloading more than just the code. There''s the overhead—like
    HTTP headers—that comes with the file. Because of this, it''s much better to store
    all your code in one file, to minimize the amount of overhead.


    The best medium here would be to develop your code in separate files and then
    concatenate those files together when you''re ready to publish the site. There
    are programs (such as build scripts) that can help you automate this process.
    This might be a bit beyond your skill level at this point, but if you''re ready
    for it check out my tutorial on using Ant to compile and compress JavaScript⁸,
    published on Nettuts+ (see the section below for more on compression).


    # Global Variables


    By now you''re familiar with the concept of global variables. You might think
    this is a great think, since everything is always accessible. However, that''s
    not the case. Here''s why: the more you write JavaScript, the more you''ll find
    that the code you use on a given page isn''t just yours: you''ll use libraries,
    helper methods, and other code from other developers. If your site has advertising,
    you''ll find that many advertisers insert their ads via JavaScript. If all the
    code relies on global variables, there''s a really good chance that one script
    will overwrite the variables of another script. Since there''s no protection against
    this built into JavaScript engines, you'
  merge: -1
  pgno: 113
- img_proc: true
  md: "# More Concepts and Best Practices\n\nhave to code very defensively. Because\
    \ of this, it's a best practice to use as few global variables as possible.\n\n\
    How can you do this? Well—and I hate to sound like a broken record, but—here's\
    \ another place that anonymous, self-invoking functions are really useful. If\
    \ all your code can be contained in one place, you can do this:\n\n```\n(function\
    \ () {\n\n    // all your code goes here\n\n})();\n```\n\nThis way, you don't\
    \ have to worry about anyone getting at your variables; they are all safely tucked\
    \ away inside the scope of the anonymous function. And since functions can access\
    \ the variables in the scope outside them, you can access any global variables\
    \ that other libraries set.\n\nBut what if you're writing a library, or some similar\
    \ code that needs to be accessed outside of itself? In cases like this, you'll\
    \ have to use a global variable. That's not a bad thing, as long as you name and\
    \ set it properly. You'll probably want to use the module pattern for this if\
    \ you want to have your private variables and methods. Then, assign a returned\
    \ object or function (depending on the complexity of your library) to the global\
    \ variable.\n\nI prefer to give my global variables all uppercase names; I do\
    \ this for two reasons:\n\n+   1. It makes it clear to me when I'm reading my\
    \ code that it's a global variable.\n2. It reduces the chance of having that variable\
    \ overwritten, because most libraries don't do this (yet!)."
