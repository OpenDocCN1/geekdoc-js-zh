    # Date


    Array item indices are zero-based, which means the first item is 0, the second
    is 1, and so on.


    So far, all the values we''ve looked at have been literal; this means that we
    haven''t used any "real" code to give the JavaScript interpreter our values; we''ve
    just inputted the raw string, number, Boolean, or whatever. The Date value is
    the first value we''ll look at that can''t be created that way.


    So, to make a JavaScript Date object, you''ll do this:


    ```

    new Date()

    ```


    This introduces some new syntax, so let''s go over that first. The **new** keyword
    simply means we want to create a new object; in this case, that''s a date object.
    `Date`, in this case, is the name of a function. We''ll discuss functions in the
    next chapter, but they''re basically wrappers for related lines of code. You call
    a function—that means run the code inside it—by placing parentheses after the
    function name.


    What you see above will give you a new date object that holds the date and time
    you created that object...right down to the millisecond. If you want to create
    a date object for a specific date or time, you''ll have to pass in the right parameters.
    Parameters? Well, if you want a function to use values outside itself, you have
    to give them to it. To do so, just put them between those parentheses that called
    the function. Don''t forget to separate multiple parameters with commas.


    > **ROCK* TIP


    Actually, we can create all the primitive types in a way similar to this, but
    I''m not going to teach you that, because there''s never a good reason to do so.'
