  md: "# More Concepts and Best Practices\n\nof what's called \"Object-Oriented Programming\"\
    \ (OOP). Many programming languages use classes to do OOP. Classes are like blueprints:\
    \ they aren't the real objects, but they lay out what the objects will have when\
    \ they are created. JavaScript is very object-oriented, but it doesn't use classes.\
    \ Instead, it uses prototypes. Prototypes are real objects (the same objects you've\
    \ already seen), and we can use them as a \"living\" blueprint for other objects.\n\
    \nWith all that said, let's get back to **new**. The classes in other languages\
    \ use constructor functions to construct the new objects. In JavaScript, constructors\
    \ are regular functions, written to create new object and called with the keyword\
    \ **new** in front of them. Let's take a look at how to write and call this type\
    \ of function.\n\nLet's say we want to create truck objects. I know: this isn't\
    \ necessarily practical. You probably won't ever need truck objects in JavaScript,\
    \ but it's something you'll be familiar with while we discuss **new** and its\
    \ crew.\n\nSo, here's a function that will create a truck:\n\n# Example 4.3\n\n\
    ```\nfunction Truck(model) {\n    this.num_of_tires = 4;\n    this.kilometers\
    \ = 0;\n    this.model = model;\n}\n\nvar my_truck = new Truck(\"Hercules\");\n\
    \nconsole.log(my_truck);\n```\n\nNotice two things here: first, we're defining\
    \ all these variables as properties of the object **this**. Second, we don't return\
    \ anything from this function. Both of these are because we plan to call this"
