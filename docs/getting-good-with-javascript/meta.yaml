    # ## More Concepts and Best Practices


    You probably understand the "how" of closure. Maybe you''re still struggling with
    the "why." After all, it''s your code and you know enough not to hurt anything,
    or change something that shouldn''t be changed. Well, building in protection like
    this is one of the best practices of good coding. It''s defensive; coding this
    way means you''re aware of the things that can go wrong and are actively preventing
    them. Also, there''s a good chance your code will eventually be used by others;
    they won''t know necessarily how things are "supposed" to work, and coding this
    way will prevent rampant breakage in such situations.


    For example, look back up at the `revealSecret` function about. We might know
    not to change the `secretNumber` variable, but another developer might not...or
    we might forget. Basically, any situation where you want to be able to change
    a value over multiple executions of a function (meaning you can''t put the value
    inside the function), but not have that value changeable from outside the function
    (meaning you can''t put the value outside the function) is a situation where closure
    comes to your rescue.


    It''s not just other programmers that you have to prepare for. Nine times out
    of ten, your programs will interact with data from the user. But who is to say
    that the user will docilely do as they are told and input the right type of information.
    Defensive coding sometimes means having a backup plan for situations like these.


    # ## Errors


    This brings us to errors in your JavaScript. Now, there are really two types of
    errors: errors you make while coding—things like syntax errors and typos—and errors
    that are unforeseeable—things are break because of something outside your code,
    such as the user''s input, or a missing feature in the JavaScript engine. While
    the JavaScript engines usually silently solves small errors (such as a missing
    semicolon), a larger mistake will make it throw (yes,'
