    - *小结*\n\n## 更多概念与最佳实践\n- *this*\n- *面向对象的 JavaScript*\n- *对象方法*\n- *闭包*\n- *错误*\n\
    - 测试你的 JavaScript\n- 组织你的 JavaScript\n- 优化你的 JavaScript\n- 小结\n\n## HTML 实战\n\
    - 孩子们，来见见 DOM\n- 节点\n- 查找元素\n- 遍历 DOM\n- 添加、删除和修改元素\n- 事件\n- DOM 总结\n- 收尾\n\n\
    ## 附录 A：深入学习\n\n## 附录 B：未涵盖的内容\n\n## 关于作者\n\n## 你的视频教程\n\n---\n\n# 1\n\n## 入门\n\
    \n感谢您购买《JavaScript 精进之道》。我确信您做出了正确的决定（如果我可以这样说的话）。本章将带您初步了解我们即将深入探讨的主题。让我们开始吧！\n\
    \n## JavaScript 书籍还不够多吗？\n\n您第一次看到这本书时，很可能翻了个白眼。如果您关注过在线开发者社区，就会知道 JavaScript\
    \ 是一个非常热门的话题。人人都在写关于它的内容。那为什么还要再来一本 JavaScript 书籍呢？\n\n嗯，之所以再来一本 JavaScript 书，是因为我希望这本书能够填补一个\
    \ niche。从一开始，我就希望这本书能够将一个对 JavaScript 知之甚少或一无所知的人，在很短时间内提升到一定水平……同时只教授当前的方法和最佳实践。这意味着\
    \ JavaScript 的内容远不止您在这本书中看到的。有很多东西您在入门时并不需要了解；我不会在这些内容上花费时间。我见过其他入门书籍涵盖了我省略的内容，这没关系，因为它们追求的是全面性。但这本书不是这样：在这里，您只会学到真正会用到的东西，作为踏入\
    \ JavaScript 世界的第一步。其他的内容可以留到以后再说。\n\n由于我试图让这本书足够短，可以在一个周末读完（好吧，也许是一个长周末），我们探讨的许多内容并不会被详尽覆盖。这并不意味着我会草草带过。只是说有些更高级的技术现在还不是您必須学习的。不用担心：您会获得扎实的基础知识，助您起步。然后，可以查看附录中的资源进行进一步学习。\n\
    \n## 我将学到什么？\n\n在我们开始之前，先谈谈这本书涵盖的内容。在本章中，您将了解什么是 JavaScript 以及它的起源。我们还将讨论如何搭建\
    \ JavaScript 编程环境。\n\n之后，我们将在第 2 章和第 3 章中讲解基础知识。您将学习所有核心语法：实际要*输入*什么。第 4 章将涵盖编写\
    \ JavaScript 的许多最佳实践和重要概念。然后，在第 5 章中，我将向您介绍编写与网页交互的 JavaScript 的基础知识。\n\n## JavaScript\
    \ 从何而来？\n\nJavaScript 由一位名叫 Brendan Eich 的先生开发，当时他效力于 Netscape（一家现已不存在的网络浏览器制造商）——他在不到两周的时间内就构建了整个语言。最初，它被称为*Mocha*，然后是*LiveScript*，最后是*JavaScript*。第一个支持\
    \ JavaScript 的浏览器是 Netscape Navigator 2.0，早在 1995 年底。\n\n> **ROCK 提示**\n>\n> 需要注意的是，JavaScript**不是**Java。JavaScript\
    \ 和 Java 之间实际上只有两个共同点。首先也是最明显的是\"Java\"这个词（这是为了让 JavaScript 对 Java 开发者有吸引力；我知道，确实如此）。另一点是一些相似的语法：两种语言都使用\
    \ C 风格的花括号。仅此而已。\n\n很长一段时间里，JavaScript 并不被认为是一种拿得出手的语言。网络上的\"大想法\"本应该是 Java 小程序。然而，它们失败了，最终，JavaScript\
    \ 的\"优点\"被人们熟知，甚至很快受到了许多人的喜爱。\n\n如今，JavaScript 是世界上使用最广泛的编程语言。它不仅用于网页浏览器，还用于桌面应用、手机应用，现在甚至用于服务器端。学习\
    \ JavaScript 绝对不会浪费您的时间。\n\n## 如何开始学习？\n\n既然您已经满怀热情地想要学习 JavaScript，我们如何开始呢？好吧，您将在接下来的章节中学习如何实际编写\
    \ JavaScript 代码。但这些代码要放在哪里呢？\n\n虽然很难找到 JavaScript*不能*运行的地方，但绝大多数 JavaScript——尤其是您现在要写的\
    \ JavaScript——都会在网页中，在浏览器里运行。有两种方法可以将 JavaScript 放入 HTML 页面。\n\n第一种，您可以将 JavaScript\
    \ 代码直接嵌入到 `script` 标签内。\n\n```\n<script>\n    alert(\"I'm learning JavaScript\"\
    );\n</script>\n```\n\n您现在不必理解标签中的代码；只要知道它能工作就行了。当浏览器遇到 script 标签时，它会解释您编写的代码并执行它（如果合适的话）。\n\
    \n第二种将 JavaScript 放入页面的方法是链接到一个 .js 文件：\n\n```\n<script src=\"somefile.js\"></script>\n\
    ```\n\n是的：不幸的是，那个闭合的 script 标签是必需的，即使您不在其中放入任何内容。正如您可能猜到的，**src** 属性是 \"source\"\
    \ 的缩写。这将下载 JavaScript 文件并进行处理，就像内联代码一样。\n\n关于引入脚本还有两点说明：\n\n- 大多数情况下，您会希望将 **script**\
    \ 标签放在 closing body 标签之前。实际上，您可以放在任何您想要的地方，但从性能角度考虑，最好放在 body 的末尾……或者编写代码让它等到页面完全加载后再开始执行。我们稍后会看到如何做到这一点（不，您不能跳到第\
    \ 140 页的\"关于脚本加载的另一个简短题外话\"）。\n- 您可能会看到代码中 **script** 标签有这个属性：**type=\"text/javascript\"\
    **。这曾经是必需的，但在 HTML5 中不是了（当然，您应该使用 HTML5 文档类型）。\n\n## Firebug\n\n在学习 JavaScript\
    \ 的过程中，您会发现 Firefox 插件 Firebug（http://getfirebug.com）非常宝贵。安装最新版本的 Firefox 后，立即前往该链接安装它。\n\
    \n安装 Firebug 后，您会在 Firefox 窗口状态栏的右下角看到一个小虫子图标；如果它是彩色的，说明它已在您访问的网站上启用；否则它会显示为黑白。\n\
    \n至少，很长一段时间以来都是这样。如果您使用的是 Firefox 4，它现在在工具栏上：\n\n要在网站上启用 Firebug，只需点击该图标。点击后，Firebug\
    \ 面板会弹出。它看起来大概是这样的：\n"
