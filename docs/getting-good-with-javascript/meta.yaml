    \n## Object Oriented JavaScript\n\nIn the previous chapter, we talked for a very\
    \ short while about objects. Now, our discussion of this has led us back down\
    \ the trail of objects in JavaScript, and—since everything in JavaScript is an\
    \ object—I think we should continue.\n\nI should note that we're only going to\
