    # Numbers


    # toExponential


    If you''d like to convert a number to its exponential form, this is the method
    to use. It takes one parameter: the number of decimals places to use. If you leave
    the parameter out, JavaScript will make sure your number isn''t rounded.


    # Example 3.17


    ```

    alert( 12345..toExponential() ); // "1.2345e+4", meaning 1.2345 x 10^4

    alert( 987.65432.toExponential(3) ); // "9.877e+2"

    alert( 0.1234.toExponential() ); // "1.234e-1"

    ```


    If you''re scratching your head at the double-period in the first example above,
    a short explanation is in order. When JavaScript sees a dot after a number, it
    expects more digits; it thinks it''s a decimal point. So writing 5 is translated
    as 5.0. So if we wrote 5.toExponential(), we''d get an error. We could do 5.0.toEponential()
    if we wanted to, or you could save the character and just do the double-dot. Don''t
    worry, in most cases, your numbers will probably be in variables, so it won''t
    make too much of a difference. (You could also wrap the number in parentheses:
    (5234).toExponential());


