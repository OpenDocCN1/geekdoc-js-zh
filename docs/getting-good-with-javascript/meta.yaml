    # ## By Class


    If you want to get a group of elements, there are probably two things these elements
    have in common: the class name, or the HTML tag name (not always, but often).
    Hence, we can find elements based on those criteria, too. Try this:


    # #### Example 5.2


    ```

    console.log( document.getElementsByClassName("warning") );

    ```


    Pretty obvious name, right? However, now the discrepancies start. Internet Explorer
    6, 7, and 8 don''t have the `document.getElementByClassName` function. Although
    this is unfortunate, this is actually where JavaScript shines: it''s relatively
    easy (if you''re familiar with the cross-browser DOM idiosyncrasies) to create
    your own `getElementsByClassName` function. You can find the different ways to
    do it and how their speeds compare in an article by John Resig<sup>14</sup>. With
    your current knowledge, you might have a bit of trouble understanding the code,
    but give it a try. At the very least, you can copy it and use it in your projects.


    # ## By Tag Name


    If you want to get all the elements with the same tag, you can probably guess
    what to use:


    # #### Example 5.3


    ```

    console.log( document.getElementsByTagName("p") );

    ```


    Predictable and well-supported; nothing to dislike here.


    <sup>14</sup> http://ejohn.org/blog/getelementsbyclassname-speed-comparison/'
  - "[PAGE 125]\n\n# Traversing the DOM\n\nMost often, you'll get your elements via\
    \ one of the above functions, do what you want to do to then and move on. However,\
    \ occasionally you'll want to get a node and work with other nodes close to it.\
    \ For example, You might have something like this:\n\n```\n<div class=\"product\"\
    >\n    <h2> Product Name </h2>\n    <img src=\"pic.jpg\" />\n    <p> Description\
    \ </p>\n</div>\n```\n\nYou'll have, say, a dozen or so of these on a given page.\
    \ Let's say you want to sort the products alphabetically by name. To do this,\
    \ you'll need to get the h2 elements. However you'll also have other h2s on the\
    \ page. This means you need to get all the divs with a class \"product,\" and\
    \ then find the h2 within each. This requires some DOM traversal skills.\n\nBefore\
    \ we continue with our scenario, let's go back to that idea of a node tree. Trees\
    \ are actually a very important part of computer science. You know that for a\
    \ tree to be a tree, there have to be links between parent nodes and child nodes;\
    \ these are one-way links. It's inefficient to have a link from the parent node\
    \ to every child node; so instead, trees have a link from every parent node to\
    \ its first child node. Then, every child node has a link to its next sibling.\n\
    \nThe DOM works exactly this way: every node has a link to its first child and\
    \ its next sibling; it also has a link to its parent node. That means our HTML\
    \ snippet above looks like this:"
- md: " Now let's move back to our scenario. With the theory we've just learned, we\
    \ can see that what we need to do is find all the elements with the class \"product\"\
    \ and then find the h2 within it. You might think the h2 would be the first child,\
    \ but it actually isn't (for the sake of simplicity I intentionally drew the chart\
    \ incorrectly). This is because any whitespace between the opening div tag and\
    \ the opening h2 tag is captured in a text node. Then, if there are any HTML comments\
    \ between those two opening tags they get put in a comment node. So there could\
    \ possibly be many nodes to jump over before we get to the h2. What's a developer\
    \ to do?\n\nThankfully, each of these different types of nodes has a property\
    \ called nodeType; they are as follows:\n\n- HTML elements = 1\n- HTML element\
    \ attributes = 2\n- Text nodes = 3\n- Comment nodes = 8\n- The document = 9\n\n\
    So, to find that h2, we just have to get the first child of the div node; then,\
    \ we check the nodeType property of that node. If it's not 1, we get the next\
    \ sibling node and check that. Here's the code for that:\n\n### Example 5.4\n\n\
    ```\nvar products = document.getElementsByClassName(\"product\"),\n    i = 0,\n\
    \    child;\n\nfor ( ; i< products.length; i++) {\n    child = products[i].firstChild;\n\
    \    while (child.nodeType !== 1) {\n        child = child.nextSibling;\n    }\n\
    \    console.log(child);\n}\n```\n\nWe start by getting all the elements with\
    \ that class \"product\"; remember, since we've getting more than one element,\
    \ this returns an array (Well, it's not really an array; it's a NodeList, which\
    \ can be iterated over like an array, as we see here). For each node in our list,\
    \ we get the first child via the firstChild property and assign it to the variable\
    \ child. Then, we're using a while loop to find the first node with a nodeType\
    \ of 1 (meaning an HTML element). Our condition says \"while the node type of\
    \ child node is not 1\"; this means that if the firstChild is an element, the\
    \ loop won't run. If it's not, we'll run the loop, which simply reassigns the\
    \ child variable to child.nextSibling (the next sibling of child). When we find\
    \ the first element in the list of children, we can do what we want to do. We're\
    \ not going to do any more than print it out to the console right now, so you\
    \ can see that is, in fact, the h2.\n\nThose are the basics of traversing the\
    \ DOM. There are a few more links between nodes that we'll wrap up this discussion\
    \ with.\n\n## childNodes\n\nEvery node has a property called `childNodes`; it's\
    \ a NodeList (remember, an array-like object) containing all the child nodes of\
    \ the node. Don't forget, it's zero-based.\n\n### Example 5.5\n\n```\n// <ul id=\"\
    container\">\n//   <li>one</li>\n//   <li>two</li>\n// </ul>\nvar my_node = document.getElementById(\"\
    container\");\n\nmy_node.childNodes[1]; // gets the first list item (the second\
    \ child node)\n```\n\n## children\n\nWhile **childNodes** holds all node types,\
    \ **children** just includes the element nodes. These are usually what you want,\
    \ so this is probably more useful than **childNodes**. However, IE 6 - 8 includes\
    \ comment nodes for some reason, so beware of that.\n\n## lastChild\n\nWorks just\
    \ like `firstChild`, except it gets—wait for it—the last child node.\n\n## previousSibling\n\
    \nJust as you'd (hopefully) expect, the `previousSibling` property returns the\
    \ previous sibling of the node.\n\n## parentNode\n\nThis is the one-way link every\
    \ node has to its parent. Think back to our bunch of product `div`s. We wanted\
    \ to sort them by product name. This meant we needed to find the `h2` element,\
    \ to sort by. But if we actually got to the sorting step, we would have used `parentNode`\
    \ to get the `div` parent for each h2.\n\n### Example 5.6\n\n```\n// <ul>\n//\
    \   <li id=\"first\">one</li>\n//   <li>two</li>\n// </ul>\n\nvar my_node = document.getElementById(\"\
    first\");\nconsole.log( my_node.parentNode); // ul element\n```\n\n## Others\n\
    \nThere are a bunch of properties for traversing the DOM that are incredibly useful,\
    \ but not incredibly well-supported. They are as follows:\n\n- `firstElementChild`\n\
    - `lastElementChild`\n- `nextElementSibling`\n- `previousElementSibling`\n\nYou\
    \ can probably guess what they do; because most of the time you just want to work\
    \ with element nodes, these properties do exactly as their already-seen counterparts\
    \ do, except they ignore all those other types of nodes that just get in the way.\n\
    \nThat's the good news. The bad news is that they aren't supported in IE 6 - 8\
    \ or Firefox 3.0 (they are in IE 9 and Firefox 3.5).\n\n## Adding, Removing, and\
    \ Modifying Elements\n\nObviously, there's more to using the DOM than finding\
    \ the right elements. Once you're where you need to be, you want to do something.\
    \ When you boil it down, that something could be one of two things:\n\n- Change\
    \ the existing DOM tree (by adding, removing, or shuffling nodes)\n- Change the\
    \ information surrounding a given node or set of nodes. That information could\
    \ be the nodes style, events, attributes, etc.\n\nWe'll come back to that second\
    \ one soon. For now, let's talk about shaking things up in the DOM. Thankfully,\
    \ everything here has had rock-solid support for years.\n\n## Creating Nodes\n\
    \nIf we want to add a node to the DOM, we must first create it. To do that, we\
    \ just use methods of that document object.\n\nTo create an element, we use `document.createElement`,\
    \ passing it the tag name of the element we want to create.\n\n130 Working with\
    \ HTML\n\n```\nvar paragraph = document.createElement('p');\n```\n\nIt's just\
    \ as easy to create a text node: this time we use the document.createTextNode:\n\
    \n```\nvar text_node = document.createTextNode(\"Put your text ▶ here\");\n```\n\
    \nOnce you've created your nodes, you'll want to put them into the DOM. Let's\
    \ see how!\n\n## Adding Nodes to the DOM\n\nNow that you're somewhat familiar\
    \ with the notion of trees, you'll realise that to insert a node into the tree,\
    \ you'll have to do so in reference to another node. Think about it for a moment,\
    \ and you'll see that you describe any insertion positioning in one of two ways:\n\
    \n- As the last child element of a given node\n- As the previous sibling node\
    \ of a given node\n\nIf you want to make your new node the last child of its soon-to-be\
    \ parent node, use the **appendChild** method of nodes.\n\nAssume we have the\
    \ **paragraph** and **text_node** elements from above. While they aren't in the\
    \ DOM yet, their DOM incarnations would look like this, respectively: `<p></p>`\
    \ and Put your text here.\n\n### Example 5.7\n\n```\n// <div id=\"container\"\
    ></div>\n\nvar paragraph = document.createElement(\"p\"),\n    textNode = document.createTextNode(\"\
    This is some text\");\n```\n\n```\nparagraph.appendChild(textNode);\n\ndocument.getElementById(\"\
    container\").appendChild(paragraph);\n```\n\nNow, the HTML will look like this:\n\
    \n```\n<div id=\"container\">\n    <p>This is some text.</p>\n</div>\n```\n\n\
    As you can see, this works for both text nodes and element nodes. To insert the\
    \ text node we've created into the paragraph element node, we just use **appendChild**.\
    \ We then use the same method to insert the paragraph into the DOM. This will\
    \ make the paragraph appear on the page.\n\nIf you don't want your node appended\
    \ as the last child of its parent, you'll have to get a reference to a child node\
    \ you want it inserted before. Then, use the **insertBefore** method. Here's how\
    \ we would insert another text node into our paragraph above, before the text\
    \ node that's currently alone:\n\n### Example 5.8\n\n```\n// <div id=\"container\"\
    >Text that is already here.</div>\n\nvar newNode = document.createTextNode(\"\
    Hello World!\"),\n    container = document.getElementById(\"container\"),\n  \
    \  textNode = container.firstChild;\n\ncontainer.insertBefore(newNode, textNode);\n\
    ```\n\nOf course, this works for elements nodes as well.\n\n## Removing Nodes\n\
    \nWhen working with the DOM, it's all give and take. This means you'll occasionally\
    \ want to remove elements from the DOM.\n\nRemoving elements is a bit trickier\
    \ than adding them; it makes sense that you need to know about the nodes surrounding\
    \ your node to put it into the DOM. However, shouldn't you be able to just remove\
    \ an element without worrying about where it is? That's unfortunately not the\
    \ case. You need to know the element you want to remove *and* its parent.\n\n\
    ```\nthe_parent.removeChild(child_to_remove);\n```\n\nBecause of that, you'll\
    \ probably see this a lot:\n\n### Example 5.9\n\n```\n// <div> Kill this: <span\
    \ id=\"kill_me\"> Kill me!</span> </div>\n\nvar child = document.getElementById(\"\
    kill_me\");\n\nchild.parentNode.removeChild(child);\n```\n\nGet the child, and\
    \ use its **parentNode** property to find the parent; then, remove the child you\
    \ started with. Ah, well; that's the DOM for you.\n\nThere's another method of\
    \ removing DOM nodes that you'll probably find useful on occasion. That's **replaceChild**.\
    \ Predictably, you hand it the new claim and the node you want to replace, and\
    \ it will swap in the new one while destroying the old one."
  mdcn: "\n现在让我们回到我们的场景中。运用我们刚刚学到的理论，我们可以看出需要做的就是找到所有带有 \"product\" 类的元素，然后在其中找到 h2。你可能认为\
    \ h2 会是第一个子节点，但实际上并不是（为了简单起见，我有意将图表画得不准确）。这是因为在开始的 div 标签和开始的 h2 标签之间的任何空白都会被捕获到一个文本节点中。然后，如果在这两个开始标签之间有\
    \ HTML 注释，它们会被放入注释节点中。因此，在我们到达 h2 之前，可能需要跳过许多节点。开发者该怎么办呢？\n\n谢天谢地，这些不同类型的节点都有一个名为\
    \ nodeType 的属性；它们如下：\n\n- HTML 元素 = 1\n- HTML 元素属性 = 2\n- 文本节点 = 3\n- 注释节点 = 8\n\
    - 文档 = 9\n\n所以，要找到那个 h2，我们只需获取 div 节点的第一个子节点；然后，检查该节点的 nodeType 属性。如果不是 1，我们就获取下一个兄弟节点并检查它。以下是相关代码：\n\
    \n### 示例 5.4\n\n```\nvar products = document.getElementsByClassName(\"product\"\
    ),\n    i = 0,\n    child;\n\nfor ( ; i< products.length; i++) {\n    child =\
    \ products[i].firstChild;\n    while (child.nodeType !== 1) {\n        child =\
    \ child.nextSibling;\n    }\n    console.log(child);\n}\n```\n\n我们首先获取所有带有 \"\
    product\" 类的元素；记住，由于我们获取的元素不止一个，这会返回一个数组（嗯，它实际上不是真正的数组，而是一个 NodeList，可以像数组一样迭代，正如我们这里看到的）。对于我们列表中的每个节点，我们通过\
    \ firstChild 属性获取第一个子节点，并将其赋值给变量 child。然后，我们使用 while 循环来找到第一个 nodeType 为 1 的节点（即\
    \ HTML 元素）。我们的条件是\"当 child 节点的 nodeType 不是 1 时\"；这意味着如果 firstChild 是一个元素，循环就不会执行。如果不是，我们就执行循环，循环只是将\
    \ child 变量重新赋值为 child.nextSibling（child 的下一个兄弟节点）。当我们找到子节点列表中的第一个元素时，我们就可以执行我们想做的操作。目前我们不会做比将它输出到控制台更多的事情，这样你可以看到它确实是那个\
    \ h2。\n\n以上就是遍历 DOM 的基础知识。还有一些节点之间的链接，我们将用它们来结束这部分讨论。\n\n## childNodes\n\n每个节点都有一个名为\
    \ `childNodes` 的属性；它是一个 NodeList（记住，是一个类似数组的对象），包含该节点的所有子节点。别忘了，它是基于零的。\n\n###\
    \ 示例 5.5\n\n```\n// <ul id=\"container\">\n//   <li>one</li>\n//   <li>two</li>\n\
    // </ul>\nvar my_node = document.getElementById(\"container\");\n\nmy_node.childNodes[1];\
    \ // gets the first list item (the second child node)\n```\n\n## children\n\n\
    虽然 **childNodes** 包含所有类型的节点，但 **children** 只包含元素节点。这些通常是你想要的，所以这可能比 **childNodes**\
    \ 更有用。然而，IE 6 - 8 不知何故会包含注释节点，所以要小心这一点。\n\n## lastChild\n\n工作原理与 `firstChild`\
    \ 类似，不同之处在于它会获取——等等——最后一个子节点。\n\n## previousSibling\n\n正如你（希望）所期望的那样，`previousSibling`\
    \ 属性返回该节点的前一个兄弟节点。\n\n## parentNode\n\n这是每个节点指向其父节点的单向链接。回想一下我们那一堆产品 `div`。我们想按产品名称对它们进行排序。这意味着我们需要找到\
    \ `h2` 元素来进行排序。但如果我们真的到了排序这一步，我们会使用 `parentNode` 来获取每个 h2 的 `div` 父节点。\n\n###\
    \ 示例 5.6\n\n```\n// <ul>\n//   <li id=\"first\">one</li>\n//   <li>two</li>\n\
    // </ul>\n\nvar my_node = document.getElementById(\"first\");\nconsole.log( my_node.parentNode);\
    \ // ul element\n```\n\n## 其他\n\n还有一些用于遍历 DOM 的属性非常有用，但支持程度并不是很好。它们如下：\n\n- `firstElementChild`\n\
    - `lastElementChild`\n- `nextElementSibling`\n- `previousElementSibling`\n\n你可能能猜出它们的作用；因为你大多数时候只想处理元素节点，这些属性的功能与它们已经见过的对应属性相同，只是它们会忽略所有其他类型的、只会碍事的节点。\n\
    \n这是好消息。坏消息是它们在 IE 6 - 8 或 Firefox 3.0 中不受支持（它们在 IE 9 和 Firefox 3.5 中受支持）。\n\n\
    ## 添加、删除和修改元素\n\n显然，使用 DOM 不仅仅是找到正确的元素。一旦你到达目的地，你就想做点什么。归根结底，这事可以归为两类之一：\n\n-\
    \ 改变现有的 DOM 树（通过添加、删除或移动节点）\n- 更改给定节点或一组节点周围的信息。这些信息可能是节点的样式、事件、属性等。\n\n我们很快就会回到第二个问题。现在，让我们谈谈在\
    \ DOM 中掀起波澜。谢天谢地，这里的一切都已经有了多年的坚实支持。\n\n## 创建节点\n\n如果我们想向 DOM 添加一个节点，我们必须首先创建它。要做到这一点，我们只需使用\
    \ document 对象的方法。\n\n要创建一个元素，我们使用 `document.createElement`，向它传递我们想要创建的元素标签名称。\n\
    \n130 使用 HTML 工作\n\n```\nvar paragraph = document.createElement('p');\n```\n\n\
    创建文本节点同样简单：这次我们使用 `document.createTextNode`：\n\n```\nvar text_node = document.createTextNode(\"\
    把你的文字放在这里\");\n```\n\n一旦你创建了你的节点，你就会想要将它们放入 DOM 中。让我们看看怎么做！\n\n## 向 DOM 添加节点\n\
    \n现在你对树的概念已经有所了解，你会意识到要将一个节点插入到树中，你必须以另一个节点为参考。想一会儿，你就会发现你可以用以下两种方式之一来描述任何插入位置：\n\
    \n- 作为给定节点的最后一个子元素\n- 作为给定节点的前一个兄弟节点\n\n如果你想让你的新节点成为它即将成为父节点的最后一个子节点，可以使用节点的 **appendChild**\
    \ 方法。\n\n假设我们有上面的 **paragraph** 和 **text_node** 元素。虽然它们还不在 DOM 中，但它们的 DOM 化身分别看起来是这样的：`<p></p>`\
    \ 和 把你的文字放在这里。\n\n### 示例 5.7\n\n```\n// <div id=\"container\"></div>\n\nvar paragraph\
    \ = document.createElement(\"p\"),\n    textNode = document.createTextNode(\"\
    This is some text\");\n```\n\n```\nparagraph.appendChild(textNode);\n\ndocument.getElementById(\"\
    container\").appendChild(paragraph);\n```\n\n现在，HTML 看起来会是这样的：\n\n```\n<div id=\"\
    container\">\n    <p>This is some text.</p>\n</div>\n```\n\n如你所见，这对文本节点和元素节点都有效。要插入我们创建的文本节点到段落元素节点中，我们只需使用\
    \ **appendChild**。然后我们使用同样的方法将段落插入到 DOM 中。这将使段落出现在页面上。\n\n如果你不想让你的节点作为父节点的最后一个子节点被追加，你就需要获取一个你希望在其之前插入的子节点的引用。然后，使用\
    \ **insertBefore** 方法。以下是我们如何向上面段落中的另一个文本节点之前插入一个文本节点，该文本节点目前是孤独的：\n\n### 示例 5.8\n\
    \n```\n// <div id=\"container\">Text that is already here.</div>\n\nvar newNode\
    \ = document.createTextNode(\"Hello World!\"),\n    container = document.getElementById(\"\
    container\"),\n    textNode = container.firstChild;\n\ncontainer.insertBefore(newNode,\
    \ textNode);\n```\n\n当然，这对元素节点也同样适用。\n\n## 删除节点\n\n在使用 DOM 时，有来有往。这意味着你偶尔想要从 DOM\
    \ 中移除元素。\n\n移除元素比添加元素要棘手一些；需要了解节点周围的节点才能将其放入 DOM 中，这是有道理的。然而，难道不应该能够在不考虑它在哪里直接移除一个元素吗？不幸的是，事实并非如此。你需要知道要移除的元素\
