- md: " Besides the obvious ways these operators work, you can see that we're assigning\
    \ the value of each operation to a variable. Also, notice that we only need to\
    \ use one var statement, since each variable assignment is separated by commas.\
    \ Then, notice that + operator is used to concatenate strings. We can even throw\
    \ a number in there and JavaScript will convert it to part of the resulting string.\n\
    \nThe one operator above that you might not be familiar with is the modulus (%)\
    \ operator. It returns the remainder or the division of the two numbers. The result\
    \ for the example above is 1, because 31 / 2 is 15, with remainder 1.\n\n## Comparison\
    \ Operators\n\nBesides acting on values, you'll want to compare them. You'll be\
    \ familiar with some of these:\n\n### Example 2.7\n\n```\nalert( 10 < 5 ); //\
    \ false\nalert( 10 > 5 ); // true\nalert( 4 <= 3 ); // false\nalert( 4 >= 3 );\
    \ // true\n```\n\nIt's not hard at all to figure out which number is greater,\
    \ or lesser. Besides \"less-than\" and \"greater-than\", we've got \"less-than-or-equal-to\"\
    \ and \"greater-than-or-equal-to.\" All of these operators return boolean values.\n\
    \nYou can use these operators on strings as well:\n\n### Example 2.8\n\n```\n\
    alert( \"cat\" > \"dog\" ); // false\nalert( \"bacon\" > \"chunks\" ); // false\n\
    alert( \"cats\" >= \"cats\" ); // true\nalert( \"fishing\" <= \"sleeping\" );\
    \ // true\nalert( \"cat\" > \"CAT\" ); // true\n```\n\nHow does this work? Well,\
    \ each letter has a character code, a number that identifies it. It's the numbers\
    \ that are compared. It's important to note that capital letters don't line up\
    \ beside their lowercase children. All the capital letters come before the lowercase\
    \ ones, so \"A\" < \"z\" is true.\n\nAnd it's not just letters that have character\
    \ codes; every character you can type, including ones you can't (like Shift, Escape,\
    \ and the others in the modifier gang), has a character code. So a string with\
    \ numbers or punctuation can be compared this way.\n\nHow about just checking\
    \ to see if two values are equal? Don't make the mistake of doing this:\n\n```\n\
    var a = \"cat\",\n    b = \"dog\";\n\na = b // WRONG: DOES NOT COMPARE\n```\n\n\
    Look at this for a second; can you see why you can't use = to compare values?\
    \ That's the assignment operator; you use a single equal-sign to assign a value\
    \ to variable. To test for equality, you can use three equal-signs (often called\
    \ the triple-equals operator).\n\n### Example 2.9\n\n```\nvar a = \"cat\",\n \
    \   b = \"dog\";\n\nconsole.log( a === b ); // false\nconsole.log( a === \"cat\"\
    \ ); // true\n```\n\n## Unary Operators\n\nAll the operators we've looked as so\
    \ far work with two values, one on each side. There are several operators that\
    \ only work with one value. First off, we've got the incrementing and decrementing\
    \ operators:\n\n### Example 2.10\n\n```\nvar i = 0;\n\ni++;\n\nalert(i); // 1\n\
    \n++i;\n\nalert(i); // 2\n\ni--;\n\nalert(i); // 1\n\n--i;\n\nalert(i); // 0\n\
    ```\n\nPutting \"plus-plus\" before or after a number will add one to the number.\
    \ Predictably, \"minus-minus\" will subtract one from the number. So, what's the\
    \ difference between the prefix version and the postfix version? It's this: these\
    \ operators return a value too, just like the other ones. In this case, they return\
    \ the value of the number they are incrementing; however, the prefix (that the\
    \ operator on the front) operators increment the number before returning the value,\
    \ which the postfix operators return the value, then increment the number. Here's\
    \ an example:\n\n### Example 2.11\n\n```\nvar num1 = 1, num2, num3;\n\nnum2 =\
    \ ++num1;\n\nconsole.log(\"num1: \", num1); // num1: 2\nconsole.log(\"num2: \"\
    , num2); // num2: 2\n\nnum3 = num1++;\n\nconsole.log(\"num1: \", num1); // num1:\
    \ 3\nconsole.log(\"num3: \", num2); // num3: 2\n```\n\nAnother useful unary operator\
    \ is typeof; this operator will return the type of the given variable:\n\n###\
    \ Example 2.12\n\n```\nalert( typeof 10 ); // \"number\"\nalert( typeof \"test\"\
    \ ); // \"string\"\nalert( typeof new Date() ); // \"object\"\n```\n\nThe only\
    \ catch here is that arrays aren't given this type of array; they are called objects,\
    \ because—technically—they are. But that's not helpful.\n\nThere are a few other\
    \ unary operators, but we'll see them in a while. Right now, let's talk about\
    \ our last two groups of operators: extra assignment operators and Boolean operators.\n\
    \n## Assignment Operators\n\nWe've looked at assigning with the = operator; but\
    \ there are a few others that I think are taught best by demonstration:\n\n###\
    \ Example 2.13\n\n```\nvar num = 10;\n\nnum += 5; // same as num = num + 5\nalert(num);\
    \ // 15\n\nnum -= 3; // same as num = num - 3\nalert(num); // 12\n\nnum *= 2;\
    \ // same as num = num * 2\nalert(num); // 24\n\nnum /= 6; // same as num = num\
    \ / 6\nalert(num); // 4\n\nnum %= 3; // same as num = num % 3\nalert(num); //\
    \ 1\n```\n\nAs you can see, these assignment operators is_the patterns are used\
    \ to perform an operation on a value already in a variable and re-assign the new\
    \ value to the variable. If you run the above code, you should find that **num**\
    \ equals 1 after you run them all.\n\n## Boolean Operators\n\nBoolean operators\
    \ are used to test the trueness or falseness of a value. Every value in JavaScript\
    \ can be evaluated as a Boolean. Some values are considered false and others are\
    \ considered true; you'll see how this is important later on in this chapter.\
    \ For now, know that these values are considered false:\n\n- **false**\n- **null**\n\
    - **undefined**\n- **\"\"** (an empty string)\n- **0**\n- **NaN** (what you get\
    \ when you try to add, subtract, etc. a number and another non-number value)\n\
    \nEvery other value is considered true; keep in mind, this includes the strings\
    \ \"false\", \"null\", and so on.\n\nNow then, back to Boolean operators. The\
    \ first is the logical NOT; the logical NOT operator converts the given value\
    \ to the opposite Boolean value.\n\n### Example 2.14\n\n```\nvar a = \"a string\"\
    ;\n\nalert( !a ); // false\n\nalert( !!a ); // true\n```\n\nSince a string with\
    \ something in it is a true value, using the logical NOT operator will return\
    \ **false**. It's just like saying \"NOT true.\"\n\nNotice that using NOT twice\
    \ gives us `true`; this is a great trick to use when you want to convert any value\
    \ to its Boolean value.\n\nWhile the logical NOT is a unary operator, the logical\
    \ AND and logical OR operators use two values. Look at the syntax, then we'll\
    \ discuss them:\n\n### Example 2.15\n\n```\nvar a = true;\nvar b = false;\n\n\
    alert( a && b ); // false\n\nalert( a || b ); // true\n```\n\nHow does this work?\
    \ And where do these operators do any good? The first one above (`&&`) is the\
    \ logical AND operator; it only returns `true` if both sides of the operator are\
    \ true. The logical OR (`||`) returns true as long as just one of the values are\
    \ true.\n\nSo, where is this useful? Well, soon we'll be looking at loops and\
    \ conditionals, and that's where you'll use this most. In a conditional statement,\
    \ you'll want to check for certain conditions. If you need two values to be something\
    \ specific before proceeding, you'll use the logical AND; if only one needs to\
    \ be true, logical OR will work fine.\n\nI should note that you can use any expression\
    \ that returns a value; for example:\n\n### Example 2.16\n\n```\nvar day = 14,\
    \ year = 2011;\n\nalert( day > 10 || year === 2011 ); // true\n\nalert( day <\
    \ 20 && year >= 2010 ); // true\n```\n\nYou should also know that if the first\
    \ side of the operator determines the answer, the second side won't be evaluated.\
    \ For example, in the use of logical OR above, `year === 2011` will never be evaluated,\
    \ because `day > 10` returns true, and OR only requires one to be true. On the\
    \ other hand, if the first half of a logical AND returns false, the second half\
    \ won't be evaluated, because both sides need to be true for the whole expression\
    \ to be true.\n\nThis fact—that if the first half of the expression determines\
    \ the final value, the second isn't tested—is used by some of the JavaScript ninjas\
    \ to shorten their code a bit. Let's say we want to invoke a function (remember,\
    \ we'll get to functions soon), but we're not sure if the function exists. We\
    \ could do this:\n\n```\nfuncName && funcName();\n```\n\nRemember, to execute\
    \ the function, we have to have the parentheses, so the first part of this code\
    \ doesn't execute the function, it just returns the function. If the function\
    \ exists, this will evaluate to true, and the evaluation will continue to the\
    \ second part, which executes the function. This avoids the error that would be\
    \ thrown if we tried to execute a function that doesn't exist (and, yes, we will\
    \ talk about errors)."
  mdcn: "\n除了这些运算符明显的工作方式之外，你可以看到我们将每个运算的值赋给了一个变量。同时，注意我们只需要使用一个 var 语句，因为每个变量赋值都用逗号分隔。然后，注意\
    \ + 运算符用于连接字符串。我们甚至可以在其中加入一个数字，JavaScript 会将其转换为结果字符串的一部分。\n\n上面你可能不熟悉的一个运算符是取模（%）运算符。它返回两个数相除的余数。上面示例的结果是\
    \ 1，因为 31 / 2 等于 15，余数为 1。\n\n## 比较运算符\n\n除了对值进行操作外，你还想比较它们。其中一些你应该很熟悉：\n\n###\
    \ 示例 2.7\n\n```\nalert( 10 < 5 ); // false\nalert( 10 > 5 ); // true\nalert( 4\
    \ <= 3 ); // false\nalert( 4 >= 3 ); // true\n```\n\n判断哪个数字更大或更小一点也不难。除了\"小于\"\
    和\"大于\"，我们还有\"小于等于\"和\"大于等于\"。所有这些运算符都返回布尔值。\n\n你也可以在字符串上使用这些运算符：\n\n### 示例 2.8\n\
    \n```\nalert( \"cat\" > \"dog\" ); // false\nalert( \"bacon\" > \"chunks\" );\
    \ // false\nalert( \"cats\" >= \"cats\" ); // true\nalert( \"fishing\" <= \"sleeping\"\
    \ ); // true\nalert( \"cat\" > \"CAT\" ); // true\n```\n\n这是如何工作的呢？嗯，每个字母都有一个字符编码，一个标识它的数字。比较的就是这些数字。需要注意的是，大写字母与其小写形式并不相邻。所有大写字母都在小写字母之前，所以\
    \ \"A\" < \"z\" 为 true。\n\n而且不只是字母有字符编码；你能输入的每个字符，包括你看不到的（如 Shift、Escape 和其他修饰键），都有字符编码。所以带有数字或标点的字符串也可以用这种方式比较。\n\
    \n那如何检查两个值是否相等呢？别犯这样的错误：\n\n```\nvar a = \"cat\",\n    b = \"dog\";\n\na = b //\
    \ 错误：这不是比较\n```\n\n看一下这个，你能明白为什么不能用 = 来比较值吗？那是赋值运算符；你用单个等号将值赋给变量。要测试相等性，你可以使用三个等号（通常称为全等运算符）。\n\
    \n### 示例 2.9\n\n```\nvar a = \"cat\",\n    b = \"dog\";\n\nconsole.log( a ===\
    \ b ); // false\nconsole.log( a === \"cat\" ); // true\n```\n\n## 一元运算符\n\n到目前为止我们看到的所有运算符都使用两个值，两边各一个。还有一些运算符只使用一个值。首先，我们有递增和递减运算符：\n\
    \n### 示例 2.10\n\n```\nvar i = 0;\n\ni++;\n\nalert(i); // 1\n\n++i;\n\nalert(i);\
    \ // 2\n\ni--;\n\nalert(i); // 1\n\n--i;\n\nalert(i); // 0\n```\n\n在数字前面或后面放\"\
    加加\"会给数字加一。可想而知，\"减减\"会从数字中减一。那么，前缀版本和后缀版本有什么区别呢？区别在于：这些运算符也会返回一个值，就像其他运算符一样。在这种情况下，它们返回正在递增的数字的值；然而，前缀（运算符在前面）运算符在返回值之前递增数字，而后缀运算符先返回值，然后再递增数字。下面是一个例子：\n\
    \n### 示例 2.11\n\n```\nvar num1 = 1, num2, num3;\n\nnum2 = ++num1;\n\nconsole.log(\"\
    num1: \", num1); // num1: 2\nconsole.log(\"num2: \", num2); // num2: 2\n\nnum3\
    \ = num1++;\n\nconsole.log(\"num1: \", num1); // num1: 3\nconsole.log(\"num3:\
    \ \", num2); // num3: 2\n```\n\n另一个有用的一元运算符是 typeof；这个运算符会返回给定变量的类型：\n\n### 示例\
    \ 2.12\n\n```\nalert( typeof 10 ); // \"number\"\nalert( typeof \"test\" ); //\
    \ \"string\"\nalert( typeof new Date() ); // \"object\"\n```\n\n这里唯一需要注意的是，数组不会被赋予\
    \ array 类型；它们被称为 object，因为——技术上讲——它们确实是。但这不太有用。\n\n还有一些其他的一元运算符，但我们稍后会看到它们。现在，让我们谈谈最后两组运算符：额外赋值运算符和布尔运算符。\n\
    \n## 赋值运算符\n\n我们已经看过使用 = 运算符赋值；但还有一些其他的，我认为最好用演示来说明：\n\n### 示例 2.13\n\n```\nvar\
    \ num = 10;\n\nnum += 5; // 等同于 num = num + 5\nalert(num); // 15\n\nnum -= 3;\
    \ // 等同于 num = num - 3\nalert(num); // 12\n\nnum *= 2; // 等同于 num = num * 2\n\
    alert(num); // 24\n\nnum /= 6; // 等同于 num = num / 6\nalert(num); // 4\n\nnum %=\
    \ 3; // 等同于 num = num % 3\nalert(num); // 1\n```\n\n如你所见，这些赋值运算符的模式用于对变量中已有的值执行操作，然后将新值重新赋给该变量。如果你运行上面的代码，你会发现运行完所有运算后\
    \ **num** 等于 1。\n\n## 布尔运算符\n\n布尔运算符用于测试一个值是真还是假。JavaScript 中的每个值都可以被评估为布尔值。有些值被认为是假值，其他值被认为是真值；稍后在本章中你会看到这一点的重要性。现在，要知道这些值被认为是假值：\n\
    \n- **false**\n- **null**\n- **undefined**\n- **\"\"**（空字符串）\n- **0**\n- **NaN**（当你尝试对数字和非数字值进行加、减等运算时得到的结果）\n\
    \n其他所有值都被认为是真值；请记住，这包括字符串 \"false\"、\"null\" 等。\n\n那么，回到布尔运算符。第一个是逻辑非；逻辑非运算符将给定值转换为其相反的布尔值。\n\
    \n### 示例 2.14\n\n```\nvar a = \"a string\";\n\nalert( !a ); // false\n\nalert(\
    \ !!a ); // true\n```\n\n由于包含内容的字符串是真值，使用逻辑非运算符会返回 **false**。这就像在说\"非真\"。\n\n\
    注意，使用两次 NOT 会得到 `true`；这是一个很好的技巧，当你想把任何值转换为其布尔值时可以使用。\n\n虽然逻辑非是一元运算符，但逻辑与和逻辑或运算符使用两个值。看一下语法，然后我们再来讨论它们：\n\
    \n### 示例 2.15\n\n```\nvar a = true;\nvar b = false;\n\nalert( a && b ); // false\n\
    \nalert( a || b ); // true\n```\n\n这是如何工作的？这些运算符在哪里有用武之地呢？上面的第一个（`&&`）是逻辑与运算符；只有当运算符两边的值都为真时，它才返回\
    \ `true`。逻辑或（`||`）只要其中一个值为真就返回 true。\n\n那么，这有什么用呢？嗯，很快我们就会看到循环和条件语句，那就是你最常用到它们的地方。在条件语句中，你会想检查某些条件。如果你需要两个值都是特定的值才能继续，你会使用逻辑与；如果只需要一个为真，逻辑或就能胜任。\n\
    \n我应该指出，你可以使用任何返回值的表达式；例如：\n\n### 示例 2.16\n\n```\nvar day = 14, year = 2011;\n\
    \nalert( day > 10 || year === 2011 ); // true\n\nalert( day < 20 && year >= 2010\
    \ ); // true\n```\n\n你还应该知道，如果运算符的第一边就决定了答案，第二边将不会被评估。例如，在上面使用逻辑或时，`year === 2011`\
    \ 永远不会被评估，因为 `day > 10` 返回 true，而 OR 只需要一个为真。另一方面，如果逻辑与的前半部分返回 false，后半部分将不会被评估，因为两边都需要为真，整个表达式才为真。\n\
    \n这个事实——如果表达式的前半部分就决定了最终值，后半部分就不会被测试——被一些 JavaScript 高手用来缩短他们的代码。比如说我们想调用一个函数（记住，我们很快会讲到函数），但我们不确定该函数是否存在。我们可以这样做：\n\
    \n```\nfuncName && funcName();\n```\n\n记住，要执行函数，我们必须有括号，所以这部分代码的第一部分不会执行函数，它只是返回函数。如果函数存在，这将评估为\
    \ true，评估将继续到第二部分，执行函数。这避免了尝试执行不存在的函数时会抛出的错误（是的，我们会谈到错误）。\n"
