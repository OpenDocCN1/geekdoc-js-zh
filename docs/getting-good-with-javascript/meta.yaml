  md: "# 82\n\n# More Concepts and Best Practices\n\nHere, we're calling the Truck\
    \ function via its call method. The first parameter of call is the object we want\
    \ to be considered this within the function. Since we're not using new with this\
    \ call to Truck, it doesn't create a new object or return this by default. That's\
    \ what we want in this case, because we're modifying an existing object.\n\nAfter\
    \ the object that will be this (you could call this the context of the function),\
    \ we can pass in any parameters necessary. These will be passed to the function\
    \ being executed. As you can see in our above example, the second parameter \"\
    Speedio\" is being passed to Truck as its first parameter. The third parameter\
    \ 6 becomes the second parameter of Truck. Of course, this will work for as many\
    \ parameters as you required\n\nThere's an alternate form of call, named apply.\
    \ The difference here is that apply takes only two parameters. The first is the\
    \ context object. The second is an array of parameters that will be passed to\
    \ the function. This is useful if you have the parameters as an array, instead\
    \ of as loose variables. For example, let's say we ask the user to enter the model\
    \ of the truck and the number of wheels it has into a textbox. The string user_input\
    \ represents what we may have gotten back from them:\n\n# Example 4.6\n\n```\n\
    function Truck (model, num_of_tires) {\n    this.num_of_tires = num_of_tires;\n\
    \    this.kilometers = 0;\n    this.model = model;\n}\n```"
