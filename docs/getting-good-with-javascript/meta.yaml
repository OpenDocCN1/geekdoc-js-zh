    \ a unique number each time we call the function. If the password is wrong, we\
    \ get 0.\n\nHowever, there's an obvious problem there: there's nothing secret\
    \ at all about secret_number; it's a global variable that everyone has access\
    \ to. To fix that, why don't we just put it inside the function? Then, we won't\
