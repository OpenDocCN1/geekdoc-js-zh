  md: "# Example 4.9\n\n```\nfunction Product(name) {\n    if (name) {\n        this.name\
    \ = name;\n    }\n}\nProduct.prototype.name = \"To be announced\";\nProduct.prototype.rating\
    \ = 3;\n\nvar ipad = new Product(\"iPad\");\n\nalert( ipad.name ); // \"iPad\"\
    ;\nalert( ipad.rating ); // 3\n```\n\nHere, we've created a simple **Product**.\
    \ Right now, you can see that the **name** property is right on the object **ipad**\
    \ and the **rating** property is being inherited from its prototype.\n\n# Example\
    \ 4.10\n\n```\n// ipad from above\n\nipad.rating = 4;\n\nipad.rating; // 4\n\n\
    Product.prototype.rating; // 3\n```\n\nBy changing the rating, we're actually\
    \ adding a rating parameter to the **ipad** object. Since it has its own property\
    \ called **rating** now, when we ask for **ipad.rating**, it no longer goes to\
