  md: '# Working with HTML


    Up until now, I''ve tried to talk about JavaScript in a very open way, meaning
    that pretty much everything you''ve learned so far will work in any JavaScript
    environment. However, there''s no hiding the fact that you''ll probably be writing
    most of your JavaScript for websites—that is, for running in a browser. So that''s
    what we''ll talk about here.


    # Kids, Meet the DOM


    Sounds simple enough, no? The tough part is that "a browser" could mean


    +   - Internet Explorer

    - Firefox

    - Google Chrome

    - Safari and Mobile Safari

    - Opera

    - ad infinitum


    Unfortunately, there are *at least* five major browsers your code has to run in,
    not to mention the different versions of those browsers.


    So what? Well, here''s how it all plays out: every web browser implements an interface
    by which you can interact with the HTML elements that are in the webpage that
    your JavaScript is running on. But let''s back up one more step. When the browser
    loads a page, it converts the HTML text that you have written into a tree of nodes.'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# 120


    # Working with HTML


    We''ll come back to nodes soon; but for now, realize that the browser turns every
    HTML element into a node. This is half of what the browser brings to the table.
    The other half is the functionality to access all those things: it''s a JavaScript
    object that allows you to find and manipulate this tree of nodes.


    > **ROCK* TIP**


    Not sure what a node is? Think of a family tree: each person is a node. In fact,
    the idea of a family is quite prevalent in the browser: nodes can have siblings,
    parents and children.


    These two parts together are called the **Document Object Model** or DOM, for
    short.


    So, why is this all so unfortunate? Well, the main issue is that all the different
    browsers and versions aren''t anywhere near harmonious in their implementation
    of the DOM standard…especially Internet Explorer. This makes it rather difficult
    to program, as you''re often checking for one feature or another, and performing
    the same action in two or more ways to get one job done. This isn''t fun.


    The other problem is that the DOM is a pretty clumsy interface to work with; it''s
    not designed nicely *at all*. Yes, this is definitely an opinion, but it''s the
    opinion of the healthy majority of professional JavaScript developers. However,
    it''s probably not going anywhere anytime soon, so you''ll have to get used to
    it.


    Actually, you don''t *have* to get used to it…but it''s a good idea if you do.
    Because of its awkwardness stacks of JavaScript libraries have been created to
    ease the pain. You could jump immediately to something like jQuery or MooTools,
    but it''s better to learn the "real" way first.


    So, let''s do it!'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# # Nodes


    We talked a bit about nodes previously. Every element in your HTML becomes a node
    in the DOM. Also, every chunk of text in your HTML becomes a node as well (a text
    node, obviously). Also, the attributes of elements (like the id or class) are
    nodes. So are the comments in a file.


    So, if we had this HTML:


    ```

    <p>We''re learning about the <em>Document Object Model ▸

    </em>, or <strong>DOM</strong>.</p>

    ```


    We would have a DOM tree like this:


    ![](img/b2872544db3ac2167aea931a76af3eea_122_0.png)


    *Fig. 5-1. DOM Tree of Nodes*


    The element nodes are bold and the text nodes are italic. As you can see, each
    element and bunch of sequential text is a node.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Finding Elements


    We''ve had enough theory for now; let''s look at the interface to the HTML that
    the DOM gives us.


    Often, you''ll want to find one or more elements and so something with them. There
    are a couple of ways to do this.


    # By Id


    Most of the time, you''ll want to get a single element with a given id. Here''s
    the way we do it:


    # Example 5.1


    ```

    console.log( document.

    getElementById("id_name") );

    ```


    Pretty much every interaction with the DOM starts with the document object. Here,
    we''re calling the getElementById method, and passing it a single string parameter:
    the id of the object we want to find. If the method finds the element in the DOM,
    it will return it. If not, it will return null.


    # ROCK* TIP


    But first, a word about compatibility... because remember, not all browsers support
    everything. We''re going to be looking at a limited set of DOM functionality in
    this book, but there will still be some stuff that''s not supported everywhere.
    So, rule of thumb: if I don''t mentioned browser support, assume the functionality
    is supported in the following browsers


    +   - Internet Explorer 6+

    - Firefox 3+

    - Opera 10+

    - Safari 4+

    - Chrome 5+


    I think it''s fairly safe to assume that site visitors on Firefox, Opera, Chrome,
    and Safari will be using a recent version of the browser. If there''s an issue
    with one of the above browsers, I''ll point that out and try to give a solution.'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# ## By Class


    If you want to get a group of elements, there are probably two things these elements
    have in common: the class name, or the HTML tag name (not always, but often).
    Hence, we can find elements based on those criteria, too. Try this:


    # #### Example 5.2


    ```

    console.log( document.getElementsByClassName("warning") );

    ```


    Pretty obvious name, right? However, now the discrepancies start. Internet Explorer
    6, 7, and 8 don''t have the `document.getElementByClassName` function. Although
    this is unfortunate, this is actually where JavaScript shines: it''s relatively
    easy (if you''re familiar with the cross-browser DOM idiosyncrasies) to create
    your own `getElementsByClassName` function. You can find the different ways to
    do it and how their speeds compare in an article by John Resig<sup>14</sup>. With
    your current knowledge, you might have a bit of trouble understanding the code,
    but give it a try. At the very least, you can copy it and use it in your projects.


    # ## By Tag Name


    If you want to get all the elements with the same tag, you can probably guess
    what to use:


    # #### Example 5.3


    ```

    console.log( document.getElementsByTagName("p") );

    ```


    Predictable and well-supported; nothing to dislike here.


    <sup>14</sup> http://ejohn.org/blog/getelementsbyclassname-speed-comparison/'
  merge: -1
