    \n### Chapter 5\n\n- http://rockable-extras.s3.amazonaws.com/js-screencasts/js-screencast-5.zip\n\
    \nMade in the USA\nLexington, KY\n27 September 2012\n\nEver wanted to spice up\
    \ your websites with a dash of JavaScript, but not known where to start? In **Getting\
    \ Good with JavaScript**, author **Andrew Burgess** breaks programming in JavaScript\
    \ down into easy, straight-forward principles and practices.\n\nThis book will\
    \ introduce you to important programming concepts, show you how to write your\
    \ first scripts, and make you comfortable with JavaScript code. You'll learn :\n\
    \n- The basics of types, variables, and operators\n- Best practices for efficient\
    \ coding\n- Testing and optimizing your JavaScript\n- Interacting with HTML elements\n\
    \n**Andrew Burgess** will help you get past the learning curve and get you **Getting\
    \ Good with Javascript**!"
  mdcn: "\n这非常简单。\n\n## 编写跨浏览器事件处理程序\n\n存在两种事件模型意味着你需要为每个事件连接两个事件处理程序。最简单的方法是编写一个封装事件行为的函数：\n\
    \n```\nfunction addEvent(element, type, fn) {\n    if (element.addEventListener)\
    \ {\n        element.addEventListener(type, fn, false);\n    } else {\n      \
    \  element.attachEvent(\"on\" + type, fn);\n    }\n}\n```\n\n这是该函数的一个极其基础的版本；有*大量*方法可以改进它。作为练习，尝试创建一个\
    \ `removeEvent` 函数，用于移除标准模型和 IE 模型中的事件。\n\n## 关于脚本加载的另一点补充\n\n还记得早在第 10 页的时候吗（那时你还年轻，血液中的\
    \ JavaScript 还不多），我建议你把 script 标签放在 body 的末尾，除非（我引用原话）你\"编写代码来等待页面加载完成后再开始执行\"\
    。我提起这个可不只是为了怀旧：事件可以帮助你实现这一点。\n\n你需要做的是监听 `window` 对象上的 `load` 事件。具体做法如下（假设我们已经有了上面的\
    \ `addEvent` 函数）：\n\n## 示例 5.15\n\n```\naddEventListener(window, \"load\", function()\
    \ {\n    alert(\"做点什么事，比如。\");\n});\n```\n\n关于事件还有很多内容我们无法在这里涵盖。我甚至没有提到事件对象——它会被传递给被调用的函数；这个对象提供了关于事件的信息，比如事件是在哪个元素上触发的。查看附录\
    \ A 以获取更多关于事件的学习资源。\n\n## DOM 总结\n\n如你所见，DOM 有时令人困惑。你经常需要跳过文本节点；IE 对事件有它自己的想法，等等。而且我们还没有讨论\
    \ AJAX，甚至没有提到浏览器对象模型（它不属于 DOM 的一部分，但密切相关）。这是否意味着你注定要一辈子笨拙地编写浏览器端的 JavaScript 代码？\n\
    \n并非如此。答案是编写一个库：一个函数集合，为你完成所有繁重的跨浏览器工作。但最棒的是，市面上已经有几个很棒的 JavaScript 库可以让你的工作更简单。\n\
    \n有哪些选择呢？嗯，下面这些 JavaScript 流行词听起来熟悉吗？\n\n- jQuery\n- MooTools\n- YUI\n- Dojo\n\
    \n## 使用 HTML 工作\n\n而且这还只是其中的一小部分。这些库为你提供了极其简单的方式来操作 DOM。先让你开开胃口，下面是一段原生 JavaScript\
    \ 代码，以及它的 jQuery 对应版本：\n\n```\n// 原生 JavaScript\nvar leading_p = document.getElementById(\"\
    content\").\nfirstChild;\n\nwhile (leading_p.nodeType !== 1 || leading_p.nodeName\
    \ !== 'P') {\n    leading_p = leading_p.nextSibling;\n}\n\nleading_p.style.backgroundColor\
    \ = \"red\";\n\n// jQuery\n\n$(\"#content p:first\").css(\"background-color\"\
    , \"red\");\n```\n\n无需多言，对吧？我想你可以看到库的魅力所在。所有这些库都有很棒的网站，上面有大量的优质文档和教程；去查看它们以了解更多！\n\
    \n这里有个警告：虽然使用 JavaScript 框架比编写原生 JavaScript 简单得多，但你真的应该理解如何使用原生 DOM 功能来实现各种功能（这比我们在本文中涵盖的内容要多得多）。\n\
    \n## 总结\n\n好了，这就是本书将要涵盖的全部内容。但这绝对不是关于 JavaScript 的全部知识。虽然你现在应该已经能够熟练地编写函数、操作对象以及（轻柔地）操作\
    \ DOM，但还有很多内容需要学习。JavaScript 正在我们说话的同时不断成长，还有更多的东西值得学习。查看附录以了解从这里开始的进阶方向。\n\n\
    去编写 JavaScript 吧！\n\n# 附录\n\n## 附录 A：进一步学习\n\n市面上有大量优秀的 JavaScript 资源。以下是一些最受欢迎的：\n\
    \n- **《JavaScript 权威指南》**，David Flanagan 著 - 这本书是学习 JavaScript 的绝佳资源；它涵盖了我们在这里讲过的所有基础知识，而且更深入、更全面。目前第五版已经上市；但你也可以在\
    \ O'Reilly 网站上获取第六版的\"前瞻版\"。你可能想要关注作者的推特（http://twitter.com/__DavidFlanagan）以获取最新动态。\n\
    \n- **《JavaScript 语言精粹》**，Douglas Crockford 著 - 这本小书是一颗瑰宝。它是了解 JavaScript 中优秀之处以及如何在编程中充分利用这些优点的绝佳途径。\n\
    \n- **《Crockford on JavaScript》**，Douglas Crockford 著 - 这是 Crockford 在 2010 年初所做的一系列演讲，是一份优秀的资源。你可以在\
    \ YUI 剧院（http://developer.yahoo.com/yui/theater/）上观看它们，或者在我为你整理好的 Nettuts+ 文章（http://net.tutsplus.com/tutorials/javascript-ajax/crockford-on-javascript-the-complete-series/）中查看。\n\
    \n- **《面向对象的 JavaScript》**，Stoyan Stefanov 著 - 另一本面向 JavaScript 初学者的优秀书籍。你将在\"\
    原型\"和\"继承\"等章节中学习到大量关于 JavaScript 原型本质的知识。\n\n## 附录\n\n- **Nettuts+ JavaScript\
    \ 文章** - 如果你在寻找定期更新的高质量 JavaScript 教程，请访问 http://net.tutsplus.com/category/tutorials/javascript-ajax/。我是\
    \ Nettuts+ 的撰稿人之一，而且大多数时候写的都是关于 JavaScript 的内容。不过，还有很多其他优秀的作者；这是一个持续更新的资源！\n\n\
    - **Rey Bango 的 JavaScript 必读书单** - 我可以在这里滔滔不绝地说下去。不过 Rey Bango 已经做了这件事，所以我把你引导到他的书单。他列出了适合初学者、中级和高级读者的书籍，以及一堆你应该关注的优秀\
    \ JavaScript 博客（http://blog.reybango.com/2010/12/15/what-to-read-to-get-up-to-speed-in-javascript/）。\n\
    \n## 附录 B：我们没有涵盖的内容\n\n你不可能在一个周末内学会关于 JavaScript 的所有知识；这确实是一生的追求。以下是我们在本书中未能涉及的一些主题列表：\n\
    \n- 非十进制数\n- 保留字\n- 标签\n- break 和 continue\n- ECMAScript\n  - 它是什么\n  - 第五版特性\n\
    - 正则表达式\n- 服务端 JavaScript\n- AJAX\n- Cookie\n- 桌面端 JavaScript\n- 发布/订阅事件（pub-sub）\n\
    \n这只是一个小清单，但应该会给你一些在继续 JavaScript 学习时的研究方向。祝你好运！\n\n## 关于作者\n\nAndrew Burgess\
    \ 是一名加拿大 Web 开发人员，也是 Nettuts+ 的撰稿人，曾在该网站上发表了 numerous 热门教程和视频教程。Andrew 还是 Rockable\
    \ 出版的畅销书 *Getting Good with Git* 的作者，以及 Envato Tuts+ 市场上的 Web 开发评论员。作为一名 Web 开发人员，他专注于\
    \ JavaScript 和 Ruby。Andrew 与家人居住在加拿大奥沙瓦。\n\n请访问 Andrew 的个人网站：http://andrewburgess.ca/\n\
    \n或在 Twitter 上关注他：@Andrew8088\n\n## 你的视频教程\n\n要下载你的视频教程，请使用以下链接。\n\n### 第 1 章\n\
