- md: " ## More Basics\n\nthem back to numbers? You can use the global function **parseInt**\
    \ and **parseFloat**. You use **parseInt** when you want to get a whole number\
    \ (parse integer). You can hand it a string, and if it can make sense of a number\
    \ within it, it will do so. For example:\n\n## Example 3.21\n\n```\nalert( parseInt(\"\
    123\", 10) ); // 123\nalert( parseInt(\"45.67\", 10) ); // 45\nalert( parseInt(\"\
    $12.00\", 10) ); // NaN\n```\n\n**parseInt** will start at the beginning of the\
    \ string and stop when the character isn't a number. That's why you get \"Not\
    \ a Number\" from a string starting with \"$\" The second parameter is the radix:\
    \ the base of the number system we want the string to be parsed to. So 10 is decimal,\
    \ 2 is binary, 8 is octal, and so on.\n\n**parseFloat** can take decimals and\
    \ exponential forms:\n\n## Example 3.22\n\n```\nalert( parseFloat(\"45.67\", 10)\
    \ ); // 45.67\nalert( parseFloat(1940..toPrecision(2), 10) ); // 1900\n```\n\n\
    Just like **parseInt**, **parseFloat** stops when the character is not a number,\
    \ decimal point, or exponential notation.\n\n## Date Methods\n\nThere are a ton\
    \ of methods for Date objects, but some are used way more often than others.\n\
    \n### get___\n\nYou'll probably use the family of get_____ methods most often,\
    \ for getting different pieces of the date. Here are the specifics; you'll notice\
    \ that most of the values are zero-based:\n\n| Method Name | Return Value |\n\
    | --- | --- |\n| getDate | day of month, 1 – 31 |\n| getDay | day of week, 0 –\
    \ 6 |\n| getFullYear | year |\n| getHours | hour, 0 – 23 |\n| getMilliseconds\
    \ | milliseconds, 0 – 999 |\n| getMinutes | minutes, 0 – 59 |\n| getMonth | month,\
    \ 0 – 11 |\n| getSeconds | seconds, 0 – 59 |\n| getTime | milliseconds since January\
    \ 1, 1970 |\n| getTimezoneOffset | difference between GMT and local time, in minutes\
    \ |\n\n### set___\n\nMost of the get methods have a corresponding set method.\
    \ They each take a single parameter, identical to the return value of their get\
    \ counterpart. Here are your options:\n\n- setDate\n- setFullYear\n- setHours\n\
    - setMilliseconds\n- setMinutes\n- setMonth\n- setSeconds\n- setTime\n\n## More\
    \ Basics\n\n### parse\n\nSometimes you'll have a string date that you want to\
    \ convert to a Date object. Date.parse will do that for you. It actually converts\
    \ it to a number, the number of milliseconds since midnight on January 1, 1970\
    \ (known as the Unix epoch²). Then, you can plug that number into new Date() to\
    \ get a Date object.\n\n#### Example 3.23\n\n```\nalert( Date.parse(\"June 18,\
    \ 1970\") ); // 14529600000\nalert( Date.parse(\"2010/11/11\") ); // 1289451600000\n\
    \nvar d = new Date(Date.parse(\"1995/04/25\")); // Tue Apr 25 1995 00:00:00 GMT-0400\
    \ (EST)\nalert(d);\n```\n\n## Array Methods\n\nArrays have useful methods as well.\
    \ Let's check out some of the common ones!\n\n### join\n\nThis is the reverse\
    \ of the string's split method. It will join all the elements in the array into\
    \ a string. You can pass a single parameter to join that will be put between each\
    \ element in the array.\n\n#### Example 3.24\n\n```\nalert( [\"cats\", \"dogs\"\
    , \"hamsters\", \"fish\"].join(' ') );\n// \"cats dogs hamsters fish\"\nalert(\
    \ \"this should not have spaces\".split(\" \").join(\"_\") );\n// \"this_should_not_have_spaces\"\
    \n```\n\n## More Basics\n\nBonus tip here: notice what I did in the last example:\
    \ I called the join method right off the split method call. How's this work? Well,\
    \ we know the split method returns an array. So we can call a method on that returned\
    \ array immediately; we don't have to save it to a variable first. This is called\
    \ *chaining* methods, and there's no limit to how long you can make the method\
    \ chain: as long as the return value of one method has the next method in your\
    \ chain, you're gold. Many JavaScript frameworks (like jQuery) take advantage\
    \ of this ability.\n\n### pop / shift\n\nThese two methods remove and return one\
    \ value from the array. `pop` gets the last item, `shift` gets the first item.\n\
    \n#### Example 3.25\n\n```\nvar arr = [\"cats\", \"dogs\", \"hamsters\", \"fish\"\
    ];\n\nconsole.log( arr.pop() ); // \"fish\"\nconsole.log( arr.shift() ); // \"\
    cats\"\nconsole.log( arr ); // [\"dogs\", \"hamsters\"]\n```\n\n### push / unshift\n\
    \nPredictably, these are the opposite of `pop` and `shift`. `push` adds an item\
    \ to the end of the array, and `unshift` to the beginning.\n\n#### Example 3.26\n\
    \n```\nvar arr = [\"Beta\", \"Gamma\"];\n\narr.push(\"Delta\");\nconsole.log(arr);\
    \ // [\"Beta\", \"Gamma\", \"Delta\"]\n```\n\n## More Basics\n\n```\narr.unshift(\"\
    Alpha\");\n\nconsole.log(arr); // [\"Alpha\", \"Beta\", \"Gamma\", \"Delta\"]\n\
    ```\n\nBoth return the number of items in the array after the new item is pushed\
    \ in.\n\n### reverse\n\nJust guess what it does. Yes, it returns an array with\
    \ the items reversed.\n\n#### Example 3.27\n\n```\nalert( [\"Crockford\", \"Resig\"\
    , \"Zakas\"].reverse() );\n// \"Zakas, Resig, Crockford\"\n```\n\n### slice\n\n\
    Sometimes you'll want to slice your array into multiple parts. This is your method.\
    \ It takes two parameters: the (zero-based) index of the starting element and\
    \ the index of the element after the last one you want to slice. You can leave\
    \ the second parameter off to select the rest of the array. You'll get the sub-array\
    \ back:\n\n#### Example 3.28\n\n```\nalert( [\"a\", \"b\", \"c\", \"d\", \"e\"\
    ].slice(2, 4) );\n// [\"c\", \"d\"]\nalert( [\"f\", \"g\", \"h\", \"i\", \"j\"\
    ].slice(1) );\n// [\"g\", \"h\", \"i\", \"j\"]\n```\n\n### sort\n\nThe sort method\
    \ will re-order the items in your array however you'd like. If you don't pass\
    \ in any parameters, JavaScript will sort the elements alphabetically.\n\n####\
    \ Example 3.29\n\n```\n[\"d\", \"e\", \"c\", \"a\", \"b\"].sort(); // [\"a\",\
    \ \"b\", \"c\", \"d\", \"e\"]\n```\n\nUnfortunately, it sorts numbers \"alphabetically,\"\
    \ too, which means that the array [0, 5, 10, 15, 20, 25] will be sorted to [0,\
    \ 10, 15, 20, 25, 5]. Not good. Instead, you can pass a sorting function into\
    \ sort. That function should take two parameters—say, a and b—which will be items\
    \ from the array. Here's how it works: the sort method will pass the first and\
    \ second items of the array to the function as the parameters; then it will pass\
    \ the second and third items, and so on. Inside the sorting function, you must\
    \ compare the two items. Then, return one of these values (assuming the first\
    \ parameter is a and the second, b):\n\n- If a should come before b, return a\
    \ negative number.\n- If a and b are equal, return 0.\n- If b should come before\
    \ a, return a positive number.\n\nIf you're just sorting numbers, this is really\
    \ easy:\n\n#### Example 3.30\n\n```\nvar arr = [5, 2, 3, 4, 1];\narr.sort(function\
    \ (a, b) {\n    return a - b;\n});\nconsole.log(arr); // [1, 2, 3, 4, 5]\n```\n\
    \nFor more on sorting functions, check out this tutorial I wrote on Nettuts+³\
    \ a while back.\n\n> 3 http://net.tutsplus.com/tutorials/javascript-ajax/sorting-values-with-javascript/\n\
    \n## Math Functions\n\nJavaScript also has a `Math` object; you can't create objects\
    \ from it, like with `Date`, but it offers some useful mathematic functionality.\n\
    \n### min\n\nA helpful function that returns the lowest of the number parameters\
    \ you pass in:\n\n#### Example 3.31\n\n```\nalert( Math.min(9, 1, 4, 2) ); //\
    \ 1\n```\n\n### max\n\nYes, it's the opposite of `min`:\n\n#### Example 3.32\n\
    \n```\nalert( Math.max(9, 1, 4, 2) ); // 9\n```\n\n### random\n\nThis function\
    \ returns a random number between 0 and 1. What good is that? Well, you can then\
    \ multiply it by 10 to get a number between 0 and 10, roughly. Anytime you need\
    \ a random number, this is your tool:\n\n#### Example 3.33\n\n```\nalert( Math.random()\
    \ ); // 0.5938208589795977 (you'll probably get something else)\nalert( Math.random()\
    \ * 10 ); // 6.4271276677027345 (again, your mileage may vary)\n```\n\n#### round\
    \ / ceil / floor\n\nMath.round is your friend when you want to round a number\
    \ to the nearest whole number. If you need to round up, use Math.ceil. Rounding\
    \ down? Math.floor is here to help.\n\n#### Example 3.34\n\n```\nalert( Math.round(10.4)\
    \ ); // 10\nalert( Math.round(10.5) ); // 11\nalert( Math.ceil(10.4) );  // 11\n\
    alert( Math.floor(10.5) ); // 10\n```\n\nCombining Math.random and Math.floor,\
    \ we can write a function that will return a random number between a minimum and\
    \ maximum number:\n\n#### Example 3.35\n\n```\nfunction getRandomNumberInRange(min,\
    \ max) {\n    return Math.floor( Math.random() * (max - min + 1) + min);\n}\n\n\
    alert( getRandomNumberInRange(0, 100) ); // 39; you'll probably get something\
    \ different.\n```\n\n### pow\n\nThis is the function to use when taking the power\
    \ of a number. The first parameter is the number you're taking the power of and\
    \ the second parameter is the power.\n\n#### Example 3.36\n\n```\nalert( Math.pow(2,\
    \ 3) ); // 8\nalert( Math.pow(2, -1) ); // 0.5\n```"
  mdcn: "\n ## 更多基础\n\n如何将它们转换回数字？你可以使用全局函数 **parseInt** 和 **parseFloat**。当你想获取整数时使用\
    \ **parseInt**（解析整数）。你可以传入一个字符串，如果其中包含它能理解的数字，它就会进行转换。例如：\n\n## 示例 3.21\n\n```\n\
    alert( parseInt(\"123\", 10) ); // 123\nalert( parseInt(\"45.67\", 10) ); // 45\n\
    alert( parseInt(\"$12.00\", 10) ); // NaN\n```\n\n**parseInt** 会从字符串开头开始读取，当遇到不是数字的字符时停止。这就是为什么以\
    \ \"$\" 开头的字符串会得到 \"Not a Number\"。第二个参数是 radix（基数）：即我们希望将字符串解析为的数字系统的基数。所以 10\
    \ 是十进制，2 是二进制，8 是八进制，等等。\n\n**parseFloat** 可以处理小数和指数形式：\n\n## 示例 3.22\n\n```\n\
    alert( parseFloat(\"45.67\", 10) ); // 45.67\nalert( parseFloat(1940..toPrecision(2),\
    \ 10) ); // 1900\n```\n\n和 **parseInt** 一样，**parseFloat** 在字符不是数字、小数点或指数符号时停止。\n\
    \n## Date 方法\n\nDate 对象有大量方法，但有一些比其他的常用得多。\n\n### get___\n\n你可能最常用的是 get_____\
    \ 系列方法，用于获取日期的不同部分。以下是详细信息；你会发现大多数值都是从零开始的：\n\n| 方法名 | 返回值 |\n| --- | --- |\n\
    | getDate | 月份中的日期，1 – 31 |\n| getDay | 星期中的日期，0 – 6 |\n| getFullYear | 年份 |\n\
    | getHours | 小时，0 – 23 |\n| getMilliseconds | 毫秒，0 – 999 |\n| getMinutes | 分钟，0\
    \ – 59 |\n| getMonth | 月份，0 – 11 |\n| getSeconds | 秒，0 – 59 |\n| getTime | 自 1970\
    \ 年 1 月 1 日以来的毫秒数 |\n| getTimezoneOffset | GMT 与本地时间的差值，以分钟计 |\n\n### set___\n\
    \n大多数 get 方法都有对应的 set 方法。它们各接受一个参数，与其对应的 get 方法的返回值相同。以下是可选的方法：\n\n- setDate\n\
    - setFullYear\n- setHours\n- setMilliseconds\n- setMinutes\n- setMonth\n- setSeconds\n\
    - setTime\n\n## 更多基础\n\n### parse\n\n有时你会遇到字符串形式的日期，想要将其转换为 Date 对象。Date.parse\
    \ 可以帮你完成这个任务。它实际上会将其转换为数字，即自 1970 年 1 月 1 日午夜以来的毫秒数（称为 Unix 纪元²）。然后，你可以将该数字传入\
    \ new Date() 来获得 Date 对象。\n\n#### 示例 3.23\n\n```\nalert( Date.parse(\"June 18,\
    \ 1970\") ); // 14529600000\nalert( Date.parse(\"2010/11/11\") ); // 1289451600000\n\
    \nvar d = new Date(Date.parse(\"1995/04/25\")); // Tue Apr 25 1995 00:00:00 GMT-0400\
    \ (EST)\nalert(d);\n```\n\n## 数组方法\n\n数组也有一些有用的方法。让我们来看看一些常见的！\n\n### join\n\n\
    这与字符串的 split 方法相反。它会将数组中的所有元素连接成一个字符串。你可以向 join 传递一个参数，该参数将被插入到数组的每个元素之间。\n\n\
    #### 示例 3.24\n\n```\nalert( [\"cats\", \"dogs\", \"hamsters\", \"fish\"].join('\
    \ ') );\n// \"cats dogs hamsters fish\"\nalert( \"this should not have spaces\"\
    .split(\" \").join(\"_\") );\n// \"this_should_not_have_spaces\"\n```\n\n## 更多基础\n\
    \n这里有个额外提示：注意我在最后一个例子中做了什么：我直接在 split 方法调用后调用了 join 方法。这是如何工作的呢？我们知道 split 方法返回一个数组。所以我们可以立即在这个返回的数组上调用方法；不必先将其保存到变量中。这称为*链式*调用方法，而且方法链的长度没有限制：只要一个方法的返回值包含链中的下一个方法，就没有问题。许多\
    \ JavaScript 框架（如 jQuery）都利用了这一特性。\n\n### pop / shift\n\n这两个方法会从数组中移除并返回一个值。`pop`\
    \ 获取最后一项，`shift` 获取第一项。\n\n#### 示例 3.25\n\n```\nvar arr = [\"cats\", \"dogs\"\
    , \"hamsters\", \"fish\"];\n\nconsole.log( arr.pop() ); // \"fish\"\nconsole.log(\
    \ arr.shift() ); // \"cats\"\nconsole.log( arr ); // [\"dogs\", \"hamsters\"]\n\
    ```\n\n### push / unshift\n\n可以预料，这与 `pop` 和 `shift` 相反。`push` 在数组末尾添加一项，`unshift`\
    \ 在开头添加。\n\n#### 示例 3.26\n\n```\nvar arr = [\"Beta\", \"Gamma\"];\n\narr.push(\"\
    Delta\");\nconsole.log(arr); // [\"Beta\", \"Gamma\", \"Delta\"]\n```\n\n## 更多基础\n\
    \n```\narr.unshift(\"Alpha\");\n\nconsole.log(arr); // [\"Alpha\", \"Beta\", \"\
    Gamma\", \"Delta\"]\n```\n\n两者都返回新项被添加后数组中的项数。\n\n### reverse\n\n猜猜它做什么。是的，它返回一个项被反转的数组。\n\
    \n#### 示例 3.27\n\n```\nalert( [\"Crockford\", \"Resig\", \"Zakas\"].reverse()\
    \ );\n// \"Zakas, Resig, Crockford\"\n```\n\n### slice\n\n有时你会想把数组切成多个部分。这就是你要用的方法。它接受两个参数：起始元素的（从零开始的）索引，以及你要切片的最末一个元素之后的索引。你可以省略第二个参数来选择数组的剩余部分。你会得到返回的子数组：\n\
    \n#### 示例 3.28\n\n```\nalert( [\"a\", \"b\", \"c\", \"d\", \"e\"].slice(2, 4)\
    \ );\n// [\"c\", \"d\"]\nalert( [\"f\", \"g\", \"h\", \"i\", \"j\"].slice(1) );\n\
    // [\"g\", \"h\", \"i\", \"j\"]\n```\n\n### sort\n\nsort 方法会按你希望的方式重新排列数组中的项。如果不传入任何参数，JavaScript\
    \ 会按字母顺序对元素进行排序。\n\n#### 示例 3.29\n\n```\n[\"d\", \"e\", \"c\", \"a\", \"b\"].sort();\
    \ // [\"a\", \"b\", \"c\", \"d\", \"e\"]\n```\n\n不幸的是，它也会按\"字母顺序\"对数字进行排序，这意味着数组\
    \ [0, 5, 10, 15, 20, 25] 会被排序为 [0, 10, 15, 20, 25, 5]。不太好。相反，你可以向 sort 传入一个排序函数。该函数应接受两个参数——比如\
    \ a 和 b——它们将是来自数组的项。工作原理如下：sort 方法会将数组的第一项和第二项作为参数传给该函数；然后会传第二项和第三项，依此类推。在排序函数内部，你必须比较这两个项。然后，返回以下值之一（假设第一个参数是\
    \ a，第二个是 b）：\n\n- 如果 a 应排在 b 之前，返回一个负数。\n- 如果 a 和 b 相等，返回 0。\n- 如果 b 应排在 a 之前，返回一个正数。\n\
    \n如果只是对数字进行排序，这非常简单：\n\n#### 示例 3.30\n\n```\nvar arr = [5, 2, 3, 4, 1];\narr.sort(function\
    \ (a, b) {\n    return a - b;\n});\nconsole.log(arr); // [1, 2, 3, 4, 5]\n```\n\
    \n关于排序函数的更多信息，可以查看我之前在 Nettuts+³ 上写的教程。\n\n> 3 http://net.tutsplus.com/tutorials/javascript-ajax/sorting-values-with-javascript/\n\
    \n## Math 函数\n\nJavaScript 还有一个 `Math` 对象；你不能像 `Date` 那样从中创建对象，但它提供了一些有用的数学功能。\n\
    \n### min\n\n一个有用的函数，返回你传入的参数中的最小值：\n\n#### 示例 3.31\n\n```\nalert( Math.min(9,\
    \ 1, 4, 2) ); // 1\n```\n\n### max\n\n是的，它与 `min` 相反：\n\n#### 示例 3.32\n\n```\n\
    alert( Math.max(9, 1, 4, 2) ); // 9\n```\n\n### random\n\n这个函数返回一个 0 到 1 之间的随机数。这有什么用呢？嗯，你可以将其乘以\
    \ 10 来大致得到 0 到 10 之间的数。任何时候你需要随机数，这就是你的工具：\n\n#### 示例 3.33\n\n```\nalert( Math.random()\
    \ ); // 0.5938208589795977（你可能会得到不同的值）\nalert( Math.random() * 10 ); // 6.4271276677027345（同样，结果可能不同）\n\
    ```\n\n#### round / ceil / floor\n\n当你想把数字四舍五入到最近的整数时，Math.round 是你的朋友。如果需要向上取整，使用\
    \ Math.ceil。要向下取整？Math.floor 来帮忙。\n\n#### 示例 3.34\n\n```\nalert( Math.round(10.4)\
    \ ); // 10\nalert( Math.round(10.5) ); // 11\nalert( Math.ceil(10.4) );  // 11\n\
    alert( Math.floor(10.5) ); // 10\n```\n\n结合 Math.random 和 Math.floor，我们可以编写一个返回最小值和最大值之间随机数的函数：\n\
    \n#### 示例 3.35\n\n```\nfunction getRandomNumberInRange(min, max) {\n    return\
    \ Math.floor( Math.random() * (max - min + 1) + min);\n}\n\nalert( getRandomNumberInRange(0,\
    \ 100) ); // 39；你可能会得到不同的值。\n```\n\n### pow\n\n这是用于计算数字幂次的函数。第一个参数是底数，第二个参数是指数。\n\
    \n#### 示例 3.36\n\n```\nalert( Math.pow(2, 3) ); // 8\nalert( Math.pow(2, -1) );\
    \ // 0.5\n```\n"
