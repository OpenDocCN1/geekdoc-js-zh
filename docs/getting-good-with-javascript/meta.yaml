- md: " ## While Loop\n\nBut then there's the post-loop-actiony part. Why not throw\
    \ that inside the loop?\n\n```\nfor (var i = 0; i < names.length; ){\n    // whatever\n\
    \    i++;\n}\n```\n\nAnd instead of doing the whole `< names.length` thing, we\
    \ could just check to see if the value exists in the array.\n\n```\nvar i = 0;\n\
    \nfor ( ; names[i] ; ) {\n    //do something\n    i++;\n}\n```\n\nThis is an important\
    \ point that's relevant to more than just the for loop: if you understand what\
    \ each piece does, you'll be able to wield it more effectively. With this in mind,\
    \ can you guess why you haven't tried removing the Boolean expression from the\
    \ for loop? Without that, your loop would loop forever (try it, and crash your\
    \ browser).\n\nHere's a structure that might look a bit like the last for loop\
    \ we wrote:\n\n## The Basics\n\n## Example 2.25\n\n```\nvar names = [\"Ringo\"\
    , \"John\", \"Paul\", \"George\"],\n    i = 0;\n\nwhile (i < names.length) {\n\
    \    alert(\"Say hi to \" + names[i]);\n    i++;\n}\n```\n\nA while loop is a\
    \ simpler form of the for loop. Instead of three statements in the parentheses,\
    \ there's only one: the Boolean expression. If it's true, the while loop will\
    \ run again. Of course, it starts with the while keyword, followed by the parentheses,\
    \ and then the block statement. If you're using any variables, you have to initialize\
    \ them before the loop and increment them within the loop. Depending on your task,\
    \ a while loop can be more elegant than a for loop. What I've shown above is using\
    \ a while loop for iteration; that's usually better off left to a for loop. A\
    \ while loop, semantically, should be used while something is true:\n\n## Example\
    \ 2.26\n\n```\nvar not_home = true,\n    miles_driven = 0;\n\nwhile (not_home)\
    \ {\n    miles_driven += 1 // drive another mile\n    if (miles_driven === 10)\
    \ {\n        not_home = false;\n    }\n}\n\nalert(miles_driven);\n```\n\n## For\
    \ Loop, Revisited\n\nThere's another form of for loop that you should know about,\
    \ usually called a for-in loop. It's used for looping over objects. Check it质疑out:\n\
    \n## Example 2.27\n\n```\nvar person = {\n    name : \"Jules Verne\",\n    job\
    \ : \"Author\",\n    year_of_birth: 1828,\n    year_of_death: 1905\n},\n     prop;\n\
    \nfor (prop in person) {\n    alert(\"His \" + prop + \" is \" + person[prop]);\n\
    }\n```\n\nAs you can see, a for-in loop is much simpler than the regular for loop.\
    \ Instead of the three statements, we only put one in the parentheses: the name\
    \ of the iterator variable, the keyword in, and the object we're going over. As\
    \ expected, this will execute the inside of the block for each item or property\
    \ in the array or object, respectively. There's a caveat that you must be aware\
    \ of when using the for-in loop with objects, but we'll discuss this more in the\
    \ next chapter.\n\n## Summary\n\nYou should be warming into our topic by now.\
    \ We've covered the different types available in JavaScript, most of the operators,\
    \ and how to use conditions and loops. In the next chapter, we're going to talk\
    \ about one of the most important features of JavaScript: functions.\n\n## More\
    \ Basics\n\nNow that we've got the very basics of types and syntax down, let's\
    \ move on to another incredibly important feature: functions. Pay close attention!\n\
    \n## Functions\n\nWhat is a function? A function is really just an encapsulated\
    \ bunch of code. We've been looking at a bunch of JavaScript syntax: all of that\
    \ can go inside functions, and often that's what you'll do. When you put code\
    \ inside a function, it isn't run right away, like \"loose\" code. You decide\
    \ when the code runs by calling the function, and you can do that as often as\
    \ you want to. This is part of the benefit of functions.\n\nBut don't forget the\
    \ encapsulation part: that means that at the time you invoke, or call, a function,\
    \ you don't have any control (for the most part) of what goes on inside it. You'll\
    \ hand the function some values to work with, and it will hand a value back; but\
    \ what goes on inside it is black-boxed. This turns out to be an important thing\
    \ that we can take advantage of, as we'll see later.\n\nThere are two other important\
    \ things you should know about functions. First off, functions are first-class\
    \ objects in JavaScript, which means that *they are objects*, and that *they are\
    \ no different from any other value*. Let's take these two points a bit further.\n\
    \n**Functions are Objects:** We saw how to create an object literal earlier. Now,\
    \ we can't create a function using that object literal notation, but a function\
    \ can have properties and methods, because it is an object. You can add your own\
    \ properties and methods to functions, but we'll look at some of the built in\
    \ ones soon.\n\n**Functions are like other Values:** In many programming languages,\
    \ a function is something very different from primitive values like strings and\
    \ numbers. However, in JavaScript, that's not the case. You can use functions\
    \ in most places that you'd use another value, like passing it to another function\
    \ (which we'll see shortly). Also, you can redefine a function, just like you'd\
    \ redefine any other variable. This, as you'll see, is very handy.\n\nNow that\
    \ we understand a bit of function theory, let's look at some syntax.\n\n## Function\
    \ Syntax\n\nAs we know, a function is just any number of lines of regular JavaScript.\
    \ But we need to wrap that in function material. Let's say we have some code that\
    \ determines an appropriate greeting for our website:\n\n## Example 3.1\n\n```\n\
    var hour = 10,\n    message;\n\nif (hour < 12) {\n    message = \"Good Morning!\"\
    ;\n} else if (hour < 17) {\n    message = \"Good Afternoon!\";\n} else {\n   \
    \ message = \"Good Evening!\";\n}\n\nconsole.log(message); // Good Morning!\n\
    ```\n\nWe've created an `hour` variable, with the hypothetical current hour. Then,\
    \ we use an if statement to figure out in what range our hour is, and assign `message`\
    \ accordingly.\n\nSo, what do we do to convert this code to a function? Well,\
    \ first, let's meet the function shell:\n\n```\nfunction getGreeting () {\n  \
    \  // code goes here\n}\n```\n\nStart with the keyword **function**; then, write\
    \ the name of the function; it can be whatever you want, as long as it follows\
