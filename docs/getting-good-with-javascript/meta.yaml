    \n### 示例 5.9\n\n```\n// <div> Kill this: <span id=\"kill_me\"> Kill me!</span>\
    \ </div>\n\nvar child = document.getElementById(\"kill_me\");\n\nchild.parentNode.removeChild鞣酸child);\n\
    ```\n\n获取子节点，并使用它的 **parentNode** 属性找到父节点；然后，移除你一开始的那个子节点。啊，好吧，这就是 DOM。\n\n还有另一种移除\
    \ DOM 节点的方法，你可能会偶尔发现它很有用。那就是 **replaceChild**。可以预见的是，你传入新节点和要替换的节点，它会用新节点替换掉旧节点，同时销毁旧的。\n"
