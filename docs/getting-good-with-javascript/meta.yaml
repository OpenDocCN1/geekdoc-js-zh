  md: "# For Loop, Revisited\n\nThere's another form of for loop that you should know\
    \ about, usually called a for-in loop. It's used for looping over objects. Check\
    \ it out:\n\nExample 2.27\n\n```\nvar person = {\n    name : \"Jules Verne\",\n\
    \    job : \"Author\",\n    year_of_birth: 1828,\n    year_of_death: 1905\n},\n\
    \     prop;\n\nfor (prop in person) {\n    alert(\"His \" + prop + \" is \" +\
    \ person[prop]);\n}\n```\n\nAs you can see, a for-in loop is much simpler than\
    \ the regular for loop. Instead of the three statements, we only put one in the\
    \ parentheses: the name of the iterator variable, the keyword in, and the object\
    \ we're going over. As expected, this will execute the inside of the block for\
    \ each item or property in the array or object, respectively. There's a caveat\
    \ that you must be aware of when using the for-in loop with objects, but we'll\
    \ discuss this more in the next chapter.\n\n# Summary\n\nYou should be warming\
    \ into our topic by now. We've covered the different types available in JavaScript,\
    \ most of the operators, and how to use conditions and loops. In the next chapter,\
    \ we're going talk about one of the most important features of JavaScript: functions."
