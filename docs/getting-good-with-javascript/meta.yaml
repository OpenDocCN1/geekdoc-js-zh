  - '[PAGE 146]


    # Appendix A: Further Study


    There are a ton of great JavaScript resources out there. Here are a few of the
    most popular one:


    +   - **JavaScript: The Definitive Guide**, by David Flanagan - This book is a
    great resource for learning JavaScript; it covers all the basics we''ve covered
    here, and more, in much more depth. Currently, the fifth edition is available;
    but you can get the "Rough Cut" of the sixth edition at the O''Reilly website.
    You might want to follow the author''s tweets (http://twitter.com/__DavidFlanagan)
    for further developments.


    +   - **JavaScript: The Good Parts**, by Douglas Crockford - This little book
    is a gem. It''s a great way to become familiar with what''s good in JavaScript
    and how to leverage that good in your programming.


    +   - **Crockford on JavaScript**, by Douglas Crockford - This series of presentations
    given by Crockford in early 2010 is an excellent resource. You can catch them
    on the YUI Theater (http://developer.yahoo.com/yui/theater/), or at the Nettuts+
    post where I rounded them up for your convenience (http://net.tutsplus.com/tutorials/javascript-ajax/crockford-on-javascript-the-complete-series/).


    +   - **Object-Oriented JavaScript**, by Stoyan Stefanov - Another great book
    for starting JavaScripters. You''ll learn a lot about the prototypal nature of
    JavaScript in the chapters Prototype and Inheritance.'
  - '[PAGE 147]


    # # Appendices


    +   - **Nettuts+ JavaScript Posts** - If you''re looking for regular, high-quality
