  - '[PAGE 135]


    There are a couple of ways to work with attributes, but I''m just going to show
    you what the best, most cross-browser way to do it is. That way is using the methods
    **setAttribute** and **getAttribute**. They work as follows:


    # Example 5.11


    ```

    // <div id="container"></div>


    var elem = document.getElementById("container");


    elem.setAttribute("class", "modal");

    alert( elem.getAttribute("class") ); // "modal"

    ```


    As you can see, we pass two parameters to the first method: the name of the attribute
    we want to set, and the value for the attribute. When we''re getting the attribute,
    we just have to pass the attribute name to the **getAttribute** method. Obviously,
    there are methods of an element node.


    This should work with any attribute you want to set on your element—even the new
    HTML5 data-* attributes. However, there''s an easier way set and get some common
    attributes.


    If you''re working with the id or class, you can just do this:


    ```

    elem.id = "content";


    elem.id; // "content"


    elem.className = "module";


    elem.className; // "module";

    ```


    This shorthand notation is the go-to way of setting styling on elements. Watch
    this:'
  - '[PAGE 136]


    # ## Working with HTML


    **Example 5.12**


    ```

    // <div id="container">container</div>


    var elem = document.getElementById("container");


    elem.style.border = "1px solid red";

    elem.style.backgroundColor = "green";

    ```


    Yup; it''s all the CSS properties that you already know and love, right in your
    JavaScript. The key thing to note it this: JavaScript property names can''t have
    dashes in them, like they do in CSS. Therefore, use *camelCase* for those, capitalizing
    every letter after a dash and removing the dashes. This way, `border-bottom-width`
    becomes `borderBottomWidth`, and so on.


    Another important thing to note is that all the style properties are strings;
    this makes sense if you think about it, because even numerical values like `borderBottomWidth`
    need to be suffixed with a unit (px). So, it''s all strings here.


    One more thing: when you''re using `element.style`, you''re working with the inline
    `style` attribute on the element. When you set a styling property it gets added
    to the `style` attribute. The logical following of this is that you can''t get
    a style attribute that isn''t in the inline `style` attribute (either coded into
    the HTML or previously set in your JavaScript).


    # ## Events


    While events could be considered a part of modifying DOM elements, they deserve
    a section of their own. But first, what are events?'
  - '[PAGE 137]


    # Working with HTML


    Events, put simply, are things that happen to elements in the DOM. Some examples
    of this might be as follows:


    +   - The page **loaded**.

    - An element was **clicked**.

    - The mouse **moved over** an element.

    - When something like this happens, you may often want to do something. For example,
    run this script when the page loads. Or, execute this function when an element
    is clicked.


    So, exactly what events are there? Well, you can find a comprehensive list on
    Wikipedia^15^, but the ones you''ll use most often are these:


    +   - click

    - mouseover

    - mouseout

    - keypress

    - load

    - submit


    As you can see, there are two categories of events: things the user of your site
    does, and things that roughly does. In the above list, the user performs the click,
    mouseover, mouseout, and keypress events. The browser fires the load event when
    the page has finished loading, and the submit event when the user clicks a submit
    button (so it''s almost a user-performed events).


    > ^15^ http://en.wikipedia.org/wiki/DOM_events#Common.2FW3C_events'
  - "[PAGE 138]\n\n# Adding Event Handlers\n\nAn event is fired on a given DOM element.\
    \ This means we can wire up an *event handler* (or event listener) to a given\
    \ element. An event handler is a function that will be executed when a given event\
    \ is fired. Let's look at an example:\n\n# Example 5.13\n\n```\n// <div id=\"\
    some_button\"> Click Me! </div>\nvar btn = document.getElementById(\"some_button\"\
    );\n\nfunction welcome_user(evt) {\n    alert(\"Hello there!\");\n}\n\nbtn.addEventListener(\"\
    click\", welcome_user, false);\n```\n\n(Note: you'll have to run this example\
    \ in a browser other than Internet Explorer; we'll resolve this soon.)\n\nWhat's\
    \ going on here? Well, the first bit is stuff you're getting used to: getting\
    \ an element and creating a function. Next, we're calling the element's method\
    \ addEventListener. You can probably guess what an event listener does: it \"\
    listens\" for an event and executes a function when that event occurs. The addEventListener\
    \ takes three parameters. The first is the type of event we're listening for;\
    \ in this case, it's a click event. The events in the sample list above are all\
    \ valid events as well, and you can find the rest at that Wikipedia page.\n\n\
    The next parameter is the function to run when that event is fired. In this case,\
    \ we're passing in the `welcome_user` function. We could also pass in an anonymous\
    \ function, if we wanted to. The final parameter decides whether to use capturing\
    \ or bubbling. This"
  - "[PAGE 139]\n\n# 138\n\n# Working with HTML\n\nrequires a short rabbit-trail on\
    \ the difference between capturing and bubbling.\n\nFirst off, note that Internet\
    \ Explorer 8 and below support bubbling only (IE9 and up support both bubbling\
    \ and capturing), so you'll probably use that 99% of the time. Now, check out\
    \ this HTML:\n\n```\n<div>\n    <span> Click Here! </span>\n</div>\n```\n\nLet's\
    \ say I click the **span**. Because the **span** is inside the **div**, when that\
    \ **span** gets clicked, the **div** is clicked as well. So both elements have\
    \ a click event fire on them. If both have an event handler to harness that event,\
    \ which one should be executed first? That's the background of capturing and bubbling.\
    \ The DOM standard says that events should capture first, bubble second. The *capture*\
    \ phase is when the event starts at the highest element and works down. In this\
    \ case, the click handler of **div** will fire first. Once the event reaches the\
    \ bottom—or the innermost element—it will then bubble. The *bubble* phase takes\
    \ the event from the bottom and brings it back to the top, element by element.\
    \ To remember which is which, remember that bubbles float up, just like events\
    \ in the bubbling phase.\n\nSo, back to `addEventListener`. That last parameter\
    \ is whether to handle the event in the capture phase or not. Because IE (before\
    \ 9) doesn't support capturing, it's usually `false` (which means bubbling).\n\
    \nBut it's more than bubbling that IE doesn't support. Before version 9, IE had\
    \ its own event model (that model is still supported in IE 9, but it supports\
    \ the standard model as well). Let's check that out.\n\nIt's actually pretty simple:"
  - "[PAGE 140]\n\n# Example 5.14\n\n```\n// <div id=\"some_button\"> Click Me! </div>\n\
    var btn = document.getElementById(\"some_button\");\n\nfunction welcome_user(evt)\
    \ {\n    alert(\"Hello there!\");\n}\n\nbtn.attachEvent(\"onclick\", welcome_user);\n\
    ```\n\nInstead of **addEventListener**, they use the method **attachEvent**. You'll\
    \ notice that there's no third parameter (because it only supports bubbling).\
    \ The other difference is that the event name must be prefixed with the word \"\
    on.\" Other than that, there's not much difference.\n\n# Removing Event Handlers\n\
    \nIf you want to add event listeners, you'll eventually want to remove them. Here's\
    \ how:\n\n```\n// assume the event we wired up above\n\nbtn.removeEventListener(\"\
    click\", welcome_user, false);\n```\n\nThe method is **removeEventListener**.\
    \ The important point is that the three parameters are all the same as the **addEventListener**\
    \ parameters; that's how you target which event you're removing.\n\nTo remove\
    \ events with the IE event model, try this:\n\n```\n// assume the event we wired\
    \ up above\n\nbtn.detachEvent(\"onclick\", welcome_user);\n```"
- md: " It's pretty simple.\n\n## Writing Cross-Browser Event Handlers\n\nThe fact\
    \ that there are two event models means that you need to wire up two event handlers\
    \ for each event. The easiest way to do that is to write a function that wraps\
    \ the event behaviour:\n\n```\nfunction addEvent(element, type, fn) {\n    if\
    \ (element.addEventListener) {\n        element.addEventListener(type, fn, false);\n\
    \    } else {\n        element.attachEvent(\"on\" + type, fn);\n    }\n}\n```\n\
    \nThis is an extremely basic form of this function; there are a ton of ways to\
    \ improve it. As an exercise, try creating a `removeEvent` function that removes\
    \ events for both the standard model and the IE model.\n\n## Another Short Rabbit-Trail\
    \ on Script Loading\n\nRemember way back on page 10 (when you were younger, and\
    \ had less JavaScript in your blood), I recommended you put script tags at the\
    \ end of the body, unless (and I quote) you \"write your code to wait until the\
    \ page has completed loading before it begins executing.\" I'm bringing this up\
    \ for more than nostalgic reasons: events can help you do this.\n\nWhat you want\
    \ to do is listen for the `load` event on the `window` object. Here's how that's\
    \ done (assume we have our `addEvent` function from above):\n\n## Example 5.15\n\
    \n```\naddEventListener(window, \"load\", function() {\n    alert(\"do something,\
    \ for example.\");\n});\n```\n\nThere is a lot more about events that we can't\
    \ cover here. I didn't even mention the event object that gets passed to the function\
    \ that is called; this object provides information about the event, such as which\
    \ element the event from fired on. Check out Appendix A for further resources\
    \ that will teach you about events.\n\n## The DOM, In Sum\n\nAs you can see, the\
    \ DOM is occasionally confusing. You're constantly jumping over text nodes; IE\
    \ has its own mind for events and more. And we haven't even talked about AJAX\
    \ or even mentioned the Browser Object Model (which isn't part of the DOM, but\
    \ closely related). Does this mean you're doomed to awkwardly code JavaScript\
    \ for the browser for the rest of your life?\n\nNot really. The answer is to write\
    \ a library: a collection of functions that do all the heavy, cross-browser work\
    \ for you. But the great part about this is that there are already several incredible\
    \ JavaScript libraries out there that can make your work simpler.\n\nWhat are\
    \ your options? Well, do any of these JavaScript buzzwords sound familiar?\n\n\
    - jQuery\n- MooTools\n- YUI\n- Dojo\n\n## Working with HTML\n\nAnd that's only\
    \ a few of them. These libraries give you a drop-dead simple way to work with\
    \ the DOM. To whet your appetite, here's a snippet of raw JavaScript, followed\
    \ by its jQuery counterpart:\n\n```\n// Raw JavaScript\nvar leading_p = document.getElementById(\"\
    content\").\nfirstChild;\n\nwhile (leading_p.nodeType !== 1 || leading_p.nodeName\
    \ !== 'P') {\n    leading_p = leading_p.nextSibling;\n}\n\nleading_p.style.backgroundColor\
    \ = \"red\";\n\n// jQuery\n\n$(\"#content p:first\").css(\"background-color\"\
    , \"red\");\n```\n\n'Nuff said, eh? I think you can see the appeal of a library.\
    \ All these libraries have great sites with tons of good documentation and tutorials;\
    \ check them out to learn more!\n\nA warning here: while using a JavaScript framework\
    \ is much simpler than writing the raw JavaScript, you should really understand\
    \ how to do things with the raw DOM functionality (which is much more than what\
    \ we've covered here).\n\n## Wrapping Up\n\nWell, That's all we're going to cover\
    \ in this book. But that's definitely not all there is to learn about JavaScript.\
    \ While you should now be comfortable writing functions, working with object,\
    \ and (gently) manipulating the DOM, there's so much more to cover. JavaScript\
    \ is growing as we speak, and there's a lot more to learn. Check out the Appendices\
    \ for where to go from here.\n\nGo forth and code JavaScript!\n\n# APPENDICES\n\
    \n## Appendix A: Further Study\n\nThere are a ton of great JavaScript resources\
    \ out there. Here are a few of the most popular one:\n\n- **JavaScript: The Definitive\
    \ Guide**, by David Flanagan - This book is a great resource for learning JavaScript;\
    \ it covers all the basics we've covered here, and more, in much more depth. Currently,\
    \ the fifth edition is available; but you can get the \"Rough Cut\" of the sixth\
    \ edition at the O'Reilly website. You might want to follow the author's tweets\
    \ (http://twitter.com/__DavidFlanagan) for further developments.\n\n- **JavaScript:\
    \ The Good Parts**, by Douglas Crockford - This little book is a gem. It's a great\
    \ way to become familiar with what's good in JavaScript and how to leverage that\
    \ good in your programming.\n\n- **Crockford on JavaScript**, by Douglas Crockford\
    \ - This series of presentations given by Crockford in early 2010 is an excellent\
    \ resource. You can catch them on the YUI Theater (http://developer.yahoo.com/yui/theater/),\
    \ or at the Nettuts+ post where I rounded them up for your convenience (http://net.tutsplus.com/tutorials/javascript-ajax/crockford-on-javascript-the-complete-series/).\n\
    \n- **Object-Oriented JavaScript**, by Stoyan Stefanov - Another great book for\
    \ starting JavaScripters. You'll learn a lot about the prototypal nature of JavaScript\
    \ in the chapters Prototype and Inheritance.\n\n## Appendices\n\n- **Nettuts+\
    \ JavaScript Posts** - If you're looking for regular, high-quality JavaScript\
    \ tutorials, check out Nettuts+ at http://net.tutsplus.com/category/tutorials/javascript-ajax/.\
    \ I'm one of the staff writers for Nettuts+ and more often than not write about\
    \ JavaScript. However, there's a ton of other great authors; it's an ever up-to-date\
    \ resource!\n\n- **Rey Bango's Must-read list of JavaScript Books** - I could\
    \ go on and on here. However, Rey Bango already has, so I'll direct you to his\
    \ list. He's listed books for beginner, intermediate, and advanced levels, as\
    \ well as a bunch of great JavaScript blogs you should be following (http://blog.reybango.com/2010/12/15/what-to-read-to-get-up-to-speed-in-javascript/).\n\
    \n## Appendix B: What We Didn't Cover\n\nYou can't learn everything there is to\
    \ know about JavaScript in a weekend; it's really a lifetime pursuit. Here's a\
    \ list of a few topics we weren't able to get to in this book:\n\n- Non-base 10\
    \ numbers\n- reserved words\n- labels\n- break and continue\n- ECMAScript\n  -\
    \ What it is\n  - Fifth edition features\n- Regular Expressions\n- Server-side\
    \ JavaScript\n- AJAX\n- Cookies\n- JavaScript on the Desktop\n- Publish and Subscribe\
    \ Events (pub-sub)\n\nThis is just a short list, but it should give you a few\
    \ things to look at when continuing your JavaScript education. Good luck!\n\n\
    ## About The Author\n\nAndrew Burgess is a Canadian web developer and a staff\
    \ writer for Nettuts+, where he has published numerous popular tutorials and screencasts.\
    \ Andrew is also the author of the popular Rockable title called \"Getting Good\
    \ with Git\", and a web development reviewer on Envato's Tuts+ Marketplace. As\
    \ a web developer, he specializes in JavaScript and Ruby. Andrew lives with his\
    \ family in Oshawa, Canada.\n\nCheck out Andrew's personal site at: http://andrewburgess.ca/\n\
    \nOr follow him on Twitter: @Andrew8088\n\n## Your Screencasts\n\nTo download\
    \ your screencasts, please use the links below.\n\n### Chapter 1\n\n- http://rockable-extras.s3.amazonaws.com/js-screencasts/js-screencast-1.zip\n\
    \n### Chapter 2\n\n- http://rockable-extras.s3.amazonaws.com/js-screencasts/js-screencast-2.zip\n\
    \n### Chapter 3\n\n- http://rockable-extras.s3.amazonaws.com/js-screencasts/js-screencast-3.zip\n\
