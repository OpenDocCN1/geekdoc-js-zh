  - "[PAGE 95]\n\n# Closure\n\nClosure is one of the most important features of JavaScript.\
    \ If you're familiar with other programming languages (specifically object-oriented\
    \ ones) you might know about private variables. A private variable is a variable\
    \ that is accessible to the methods of an object, but isn't accessible from outside\
    \ the object. JavaScript doesn't have this, but we can use closure to “make” private\
    \ variables. This is just one way of putting closure to work for you. But enough\
    \ about why it's useful; let's see how to implement it!\n\nBefore we begin, remember\
    \ two important points about JavaScript that contribute to closure:\n\n+   - Everything\
    \ is an object, even functions. This means we can return a function from a function.\n\
    - Anonymous, self-invoking functions are nameless functions that run immediately\
    \ and usually only run once.\n\nNow, let's use these two ideas to create a closure.\
    \ First, let's look at some “normal” JavaScript code:\n\n```\nvar secretNumber\
    \ = 1024;\n\nfunction revealSecret(password) {\n    if (password === \"please\"\
    ) {\n        return secretNumber++;\n    }\n    return 0;\n}\n```\n\nThis should\
    \ be old hat to you now. We have a variable called **secret_number** and a function\
    \ that returns that number if the password is correct. The post-increment operator\
    \ adds one to **secret_number** after we have used it (in this case that means\
    \ after"
  - "[PAGE 96]\n\n# More Concepts and Best Practices\n\nwe have returned it); this\
