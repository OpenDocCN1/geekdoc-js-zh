  md: '# Example 2.16


    ```

    var day = 14, year = 2011;


    alert( day > 10 || year === 2011 ); // true


    alert( day < 20 && year >= 2010 ); // true

    ```


    You should also know that if the first side of the operator determines the answer,
    the second side won''t be evaluated. For example, in the use of logical OR above,
    `year === 2011` will never be evaluated, because `day > 10` returns true, and
    OR only requires one to be true. On the other hand, if the first half of a logical
    AND returns false, the second half won''t be evaluated, because both sides need
    to be true for the whole expression to be true.


    This fact—that if the first half of the expression determines the final value,
    the second isn''t tested—is used by some of the JavaScript ninjas to shorten their
    code a bit. Let''s say we want to invoke a function (remember, we''ll get to functions
    soon), but we''re not sure if the function exists. We could do this:


    ```

    funcName && funcName();

    ```


    Remember, to execute the function, we have to have the parentheses, so the first
    part of this code doesn''t execute the function, it just returns the function.
    If the function exists, this will evaluate to true, and the evaluation will continue
    to the second part, which executes the function. This avoids the error that would
    be thrown if we tried to execute a function that doesn''t exist (and, yes, we
    will talk about errors).'
