  md: "# ## More Concepts and Best Practices\n\nWhat about adding a function to this\
    \ computer object, such as the ability to store a file? You might be tempted to\
    \ do something like this:\n\n```\nfunction Computer (name, ram_amount, memory_amount)\
    \ {\n    this.name = name;\n    this.RAM = ram_amount;\n    this.space = memory_amount;\n\
    \    this.files = [];\n    this.store_file = function (filename, filesize) {\n\
    \        this.files.push(filename);\n        this.space -= filesize;\n    };\n\
    }\n```\n\nThat seems innocuous enough; however, there is a problem here. You shouldn't\
    \ create functions inside your constructor functions because every time you create\
    \ a new copy of that object, you'll be creating a new copy of that function in\
    \ memory. There's no need for this, because we can have just one copy of the function\
    \ that works for all Computer objects. This works because we use **this** to refer\
    \ to the object inside the function.\n\nSo what we need is a way to point every\
    \ copy of the Computer to a store_file function. It's nice the way we've got it\
    \ now, because the function is a method, so **this** refers to the given object.\
    \ We can do this—and only need one function—with the prototype of Computer. Here's\
    \ how that's done:\n\n```\nComputer.prototype.store_file = function (filename,\
    \ filesize) {\n    this.files.push(filename);\n    this.space -= filesize;\n};\n\
    ```\n\nRemember that functions are objects too, so they can have properties. In\
    \ this case, we're accessing the **prototype**"
  merge: -1
