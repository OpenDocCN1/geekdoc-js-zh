    There are two Boolean values: **true** and **false**. There are many places you''ll
    use Boolean values in your JavaScript code, and when necessary, you''ll use these
    values. However, more


    > ROCK* TIP

    This is a good time to mention that numbers in JavaScript aren''t always that
