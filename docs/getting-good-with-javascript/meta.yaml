  md: '# More Basics


    them back to numbers? You can use the global function **parseInt** and **parseFloat**.
    You use **parseInt** when you want to get a whole number (parse integer). You
    can hand it a string, and if it can make sense of a number within it, it will
    do so. For example:


    # Example 3.21


    ```

    alert( parseInt("123", 10) ); // 123

    alert( parseInt("45.67", 10) ); // 45

    alert( parseInt("$12.00", 10) ); // NaN

    ```


    **parseInt** will start at the beginning of the string and stop when the character
    isn''t a number. That''s why you get "Not a Number" from a string starting with
    "$" The second parameter is the radix: the base of the number system we want the
    string to be parsed to. So 10 is decimal, 2 is binary, 8 is octal, and so on.


    **parseFloat** can take decimals and exponential forms:


    # Example 3.22


    ```

    alert( parseFloat("45.67", 10) ); // 45.67

    alert( parseFloat(1940..toPrecision(2), 10) ); // 1900

    ```


    Just like **parseInt**, **parseFloat** stops when the character is not a number,
    decimal point, or exponential notation.


