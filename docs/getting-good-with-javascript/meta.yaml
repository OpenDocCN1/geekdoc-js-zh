    \ },\n        equal : function (first, second, msg) {\n            log((first\
    \ === second) ? \"pass\" : \"fail\", msg)\n        }\n    };\n})();\n```\n\nNotice\
    \ I'm using the module pattern to create our little testing framework. It creates\
    \ an unordered list and sticks it on our page. Then, for each test we execute,\
    \ we stick a new list item in the list. If the test passes, we give the list item\
    \ a class of \"pass\"; if it fails, we give it a class of \"fail.\" This way,\
    \ we can style the list through CSS.\n\nOur framework has two methods The **assert**\
    \ method takes two parameters. The first parameter is the value we're testing.\
    \ If its Boolean value is true, the test passes. Using the conditional operator\
    \ makes this extremely easy, because the only difference between a passing test\
    \ and a failing test is the class on the list item. The second parameter is the\
    \ message that identifies the test.\n\nThe second method, **equal**, takes three\
    \ parameters. If the first two are equal, the test passes. If they aren't, it\
    \ fails.\n\nLet's step away from testing for a moment to make sure you understand\
    \ the code above. Since both test functions are pretty similar, I've taken that\
    \ similar functionality and put it in a private method called `log`; it's private\
    \ because we're using the module"
  mdcn: "\n # 更多概念与最佳实践\n\n你可能已经理解了闭包的“用法”。也许你仍在纠结它的“用途”。毕竟，这是你自己的代码，而且你知道如何避免伤害任何内容，或者改动不该改动的东西。好吧，像这样构建保护机制是良好编程的最佳实践之一。这是防御性的；以这种方式编码意味着你意识到可能出错的地方，并\
    \ actively 预防它们。此外，你的代码最终很可能被他人使用；他们不一定知道事情“应该”如何运作，而这样编码可以防止这种情况下的严重破坏。\n\n例如，回头看看上面提到的\
    \ `revealSecret` 函数。我们可能知道不要改变 `secretNumber` 变量，但另一位开发者可能不会……或者我们可能会忘记。基本上，任何你希望能够在多次执行函数时改变一个值（意味着你不能把值放在函数内部），但又不希望该值从函数外部被改变（意味着你不能把值放在函数外部）的情况，都是闭包大显身手的场景。\n\
    \n你不仅要为其他程序员做准备。十有八九，你的程序会与用户数据进行交互。但谁能说用户会乖乖照做并输入正确类型的信息呢。防御性编码有时意味着为这类情况准备备用方案。\n\
    \n## 错误\n\n这就引出了 JavaScript 中的错误。实际上，有两类错误：一类是编码时犯的错误——比如语法错误和拼写错误——另一类是不可预见的错误——由于代码外部的原因导致的中断，比如用户输入，或者\
    \ JavaScript 引擎中缺失的功能。虽然 JavaScript 引擎通常会静默解决小错误（比如缺少分号），但较大的错误会使它抛出（是的，这是技术术语——抛出）一个错误。此外，如果出现问题，我们也可以抛出自己的错误。\n\
    \n以下是错误保护语法：\n\n```\ntry {\n    // 可能引发错误的代码放在这里\n} catch (e) {\n    // 在这里处理错误\n\
    }\n```\n\n我们将可能抛出错误的代码包裹在 `try` 块中。如果不这样做，JavaScript 引擎会自行处理错误，这通常意味着停止执行你的代码，并可能向用户显示错误：这并不好。如果抛出了错误，错误对象（我们很快会介绍）会被传递给\
    \ `catch` 块（你可以随意命名；这里，我称它为 `e`，这是常见的做法）。在 `catch` 块内部，你可以处理错误。\n\n不同的 web 浏览器在错误对象上包含不同的属性。它们都包含错误名称和错误消息。Firefox\
    \ 还包括错误的文件名和行号。Chrome 包括堆栈跟踪。还有其他内容，但主要的是 **name** 和 **message**，它们分别是错误的类型和对所发生情况的描述。你可以使用\
    \ `throw` 关键字并创建一个错误对象来抛出你自己的错误。你可以将此错误对象创建为对象字面量，或者使用错误构造函数。\n\nJavaScript 引擎会在哪些情况下抛出错误？尝试调用一个不存在的函数，或者访问\
    \ `null` 的属性；是的，你会得到一个错误。然而，能够抛出我们自己的错误是很有用的，所以让我们看看如何做到这一点：\n\n## 示例 4.17\n\n\
    ```\nfunction make_coffee(requested_size) {\n    var sizes = [\"large\", \"medium\"\
    , \"small\"],\n        coffee;\n\n    if (sizes.indexOf(requested_size) < 0) {\n\
    \        throw new Error(\"We don't offer that size\");\n    }\n\n    coffee =\
    \ { size: required_size, added: [\"sugar\",\n        \"sugar\", \"cream\" ] };\n\
    \n    return coffee;\n}\n\ntry {\n    make_coffee(\"extra large\");\n} catch (e)\
    \ {\n    console.log(e.message);\n}\n```\n\n你可能会发现这是一种常见的模式。当存在错误的可能性时，你会在函数内部抛出它。然后，你会将该函数的调用包裹在\
    \ try 语句中，如果有错误就捕获它。其工作方式是，一旦错误被抛出，程序就会跳转到 catch 语句，因此错误之后的代码永远不会执行。如你所见，我们使用的是\
    \ Error 构造函数，传入我们的错误消息。\n\n# 测试你的 JavaScript\n\n让我们来谈谈测试你的代码。测试就像小猫的图片：再多也不嫌多。你应该持续不断地测试你的代码。测试主要有两种类型：性能测试和单元测试。\n\
    \n- **单元测试**指的是测试代码中每一部分功能（每个单元）。你甚至可能想使用“测试驱动开发”的实践，这意味着你先编写测试，这样你就知道即将编写的代码应该做什么。\n\
    \n- **性能测试**指的是确保你以最优的方式编写了代码。不，我不是指你编写代码所花费的时间。我指的是你的代码运行所需的时间。拥有高效的代码非常重要。\n\
    \n让我们分别来看看这两种测试。\n\n## 单元测试\n\n那么，测试代码的每个单元：这听起来是个好主意，但怎么做呢？好吧，以下是基本流程：\n\n- 编写你的测试\n\
    - 运行你的测试，看着它们失败\n- 编写你的代码\n- 运行你的测试，看着它们通过\n- 重构（清理）你的代码\n- 为每个功能重复上述步骤\n\n这是测试驱动开发的流程：通过先编写测试，你将有一个努力实现的目标。不要因为测试失败而感到难过；起初，你希望它们失败。如果它们没有失败，你可能误解了你的目标或编写了糟糕的测试。\n\
    \n那么，如何编写这些测试呢？通常，你会使用一个测试框架（我们将在下一章讨论框架和库）。然而，编写自己的测试功能并不算太难。\n\n在我们编写测试或测试功能之前，让我们问一下：我们应该测试哪些类型的事情？以下是测试框架常见的两种测试类型：\n\
    \n- **assert**：判断某事是否为真\n- **equal**：判断两个事物是否相等\n\n我们可以自己编写这些函数……那现在就做吧！注意：这里假设你在\
    \ web 浏览器中测试你的 JavaScript，因为这种情况更为常见。这意味着我们要处理文档对象模型（DOM），你可能还不了解它。不用担心，我们在下一章会涵盖\
    \ DOM 的所有复杂方面。如果你愿意，可以跳到那里，或者继续往下看。现在内容不多，所以你应该不用担心。\n\n### 示例 test.js\n\n```\n\
    var TEST = (function () {\n\n    var results = document.createElement(\"ul\");\n\
    \    results.id = \"tests\";\n    document.body.appendChild(results);\n\n    function\
    \ log(class_name, msg) {\n        var li = document.createElement(\"li\");\n \
    \       li.className = class_name;\n        li.appendChild(document.createTextNode(msg));\n\
    \        results.appendChild(li);\n    }\n\n    return {\n        assert : function\
    \ (bool, msg) {\n            log((bool) ? \"pass\" : \"fail\", msg);\n       \
    \ },\n        equal : function (first, second, msg) {\n            log((first\
    \ === second) ? \"pass\" : \"fail\", msg)\n        }\n    };\n})();\n```\n\n注意我在使用模块模式来创建我们的小型测试框架。它创建一个无序列表并将其放入我们的页面。然后，对于每次执行的测试，我们在列表中添加一个新的列表项。如果测试通过，我们给列表项一个\
    \ \"pass\" 的类；如果失败，给它一个 \"fail\" 的类。这样，我们可以通过 CSS 为列表设置样式。\n\n我们的框架有两个方法。**assert**\
    \ 方法接受两个参数。第一个参数是我们要测试的值。如果它的布尔值为 true，测试通过。使用条件运算符使这变得极其简单，因为通过测试和失败测试之间的唯一区别就是列表项上的类。第二个参数是标识测试的消息。\n\
    \n第二个方法 **equal** 接受三个参数。如果前两个相等，测试通过。如果不相等，测试失败。\n\n让我们暂时离开测试，确保你理解上面的代码。由于两个测试函数非常相似，我已将这些相似的功能提取到一个名为\
    \ `log` 的私有方法中；它是私有的，因为我们使用的是模块\n"
