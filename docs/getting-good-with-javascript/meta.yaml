    \n在作为 this 的对象之后（你可以称之为函数的上下文），我们可以传入任何必要的参数。这些将被传递给正在执行的函数。如你在上面的例子中所见，第二个参数\
    \ \"Speedio\" 被作为第一个参数传递给 Truck。第三个参数 4 成为 Truck 的第二个参数。当然，这适用于你需要的任意数量的参数。\n\n\
    call 有一种替代形式，名为 apply。这里的区别是 apply 只接受两个参数。第一个是上下文对象。第二个是将被传递给函数的参数数组。如果你手头有参数数组，而不是独立的变量，这很有用。例如，假设我们让用户在一个文本框中输入卡车的型号和轮子数量。字符串\
