    # ## Adding, Removing, and Modifying Elements


    You can probably guess what they do; because most of the time you just want to
    work with element nodes, these properties do exactly as their already-seen counterparts
    do, except they ignore all those other types of nodes that just get in the way.


    That''s the good news. The bad news is that they aren''t supported in IE 6 - 8
    or Firefox 3.0 (they are in IE 9 and Firefox 3.5).


    Obviously, there''s more to using the DOM than finding the right elements. Once
    you''re where you need to be, you want to do something. When you boil it down,
    that something could be one of two things:


    +   - Change the existing DOM tree (by adding, removing, or shuffling nodes)

    - Change the information surrounding a given node or set of nodes. That information
    could be the nodes style, events, attributes, etc.


    We''ll come back to that second one soon. For now, let''s talk about shaking things
    up in the DOM. Thankfully, everything here has had rock-solid support for years.


    # ## Creating Nodes


    If we want to add a node to the DOM, we must first create it. To do that, we just
    use methods of that document object.


    To create an element, we use `document.createElement`, passing it the tag name
    of the element we want to create.'
