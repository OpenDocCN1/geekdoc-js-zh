    # The Basics


    There are several parameters you can use to create other dates. You can pass in
    a string date:


    ```

    new Date("January 17, 2012")

    ```


    Or, you can pass a list of parameters, corresponding to the following list: year,
    month, day, hour, minute, second, millisecond. You don''t have to add them all;
    only the ones that matter. It''s important to note that the month number is zero-based.
    This means that to get January, you use the number 0 and to get December, you
    use 11.


    ```

    new Date(2009, 3, 20, 17, 30)

    ```


    This will return April 20, 2009 at 5:30:00.0 PM. Your date object will also include
    time zone information, based on the settings on your computer.


