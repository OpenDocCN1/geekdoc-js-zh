- md: " ROCKABLE\n\nIncludes Screen Casts!\n\n# GETTING GOOD WITH JAVASCRIPT\n\nAndrew\
    \ Burgess\n\n---\n\nThank you for buying *Getting Good with JavaScript*! For your\
    \ complimentary epub, Kindle and pdf formats, please forward your Amazon receipt\
    \ to: upgrade@rockablepress.com\n\nROCKABLE\n\nRockablepress.com\nEnvato.com\n\
    \n© Rockable Press 2011\n\nAll rights reserved. No part of this publication may\
    \ be reproduced or redistributed in any form without the prior written permission\
    \ of the publishers.\n\n---\n\n## Table of Contents\n\n## Contents\n\n## Getting\
    \ Started\n- *Aren't There Already Enough JavaScript Books?*\n- *What Will I Learn?*\n\
    - *Where Did JavaScript Come From?*\n- *How Do I Get Started?*\n- *Conventions\
    \ Used in This Book*\n- *Summary*\n\n## The Basics\n- *Variables*\n- *Types*\n\
    - *Semicolons*\n- *Comments*\n- *Operators*\n- *Conditional Statements*\n- *Looping\
    \ Statements*\n- *Summary*\n\n## More Basics\n- *Functions*\n- *Type Methods*\n\
    - *Summary*\n\n## More Concepts and Best Practices\n- *this*\n- *Object Oriented\
    \ JavaScript*\n- *Object Methods*\n- *Closure*\n- *Errors*\n- Testing your JavaScript\n\
    - Organizing your JavaScript\n- Optimizing your JavaScript\n- Summary\n\n## Working\
    \ with HTML\n- Kids, Meet the DOM\n- Nodes\n- Finding Elements\n- Traversing the\
    \ DOM\n- Adding, Removing, and Modifying Elements\n- Events\n- The DOM, In Sum\n\
    - Wrapping Up\n\n## Appendix A: Further Study\n\n## Appendix B: What We Didn't\
    \ Cover\n\n## About The Author\n\n## Your Screencasts\n\n---\n\n# 1\n\n## Getting\
    \ Started\n\nThanks for buying \"Getting Good with JavaScript.\" I'm pretty sure\
    \ you've made the right decision (if I'm allowed to say that). This introductory\
    \ chapter will get you acquainted the subject under the microscope. Let's roll!\n\
    \n## Aren't There Already Enough JavaScript Books?\n\nThere's a pretty good chance\
    \ that you rolled your eyes when you first saw this book. If you've followed the\
    \ online development community for any time at all, you'll know that JavaScript\
    \ is a pretty hot topic. Everybody is writing about it. So why yet another book\
    \ on JavaScript?\n\nWell, yet another JavaScript book because I hope this book\
    \ fills a niche. From the beginning, I wanted this book to be one that would take\
    \ someone who knows little or nothing about JavaScript and get them up to speed\
    \ in very little time...while only teaching current methods and best practices.\
    \ This means that there's much more to JavaScript than you'll find in this book.\
    \ There are many things you really don't need to know when you get started; I\
    \ won't be spending time on them. I've seen other beginner books that cover things\
    \ I've left out, and that's okay, because they're aiming for comprehensiveness.\
    \ But not in this book: here, you'll only learn what you'll actually use as you\
    \ dip your toes into JavaScript. That other stuff can wait.\n\nSince I've tried\
    \ to keep this book short enough to read in a weekend (well, maybe a long weekend),\
    \ many of the things we'll look at aren't exhaustively covered. This doesn't mean\
    \ I'll skim over things. It just means that there are more advanced techniques\
    \ that aren't important for you to learn at this time. Don't worry: you'll get\
    \ a solid grounding in what you need to know to get you off the ground. Then,\
    \ check out some of the resources in the Appendices for further study.\n\n## What\
    \ Will I Learn?\n\nBefore we get started, let's talk about what this book covers.\
    \ In this chapter, you'll get acquainted with what JavaScript is and where it\
    \ came from. We'll also talk about how to set up an environment for coding JavaScript.\n\
    \nAfter that, we'll cover the basics in Chapters 2 and 3. You'll learn all about\
    \ the core syntax: what to actually *type*. Chapter 4 will cover many best practices\
    \ and important concepts for writing JavaScript. Then, in Chapter 5, I'll introduce\
    \ you to the basics of writing JavaScript that interacts with web pages.\n\n##\
    \ Where Did JavaScript Come From?\n\nJavaScript was developed by a gentleman named\
    \ Brendan Eich, who was working for Netscape (a now non-existent web browser maker)\
    \ at the time—he built the whole language in less than two weeks. Originally,\
    \ it was called *Mocha*, then *LiveScript*, and finally *JavaScript*. The first\
    \ browser to support JavaScript was Netscape Navigator 2.0, way back in late 1995.\n\
    \n> **ROCK TIP**\n>\n> It's important to note that JavaScript IS NOT Java. There\
    \ are really only two things that JavaScript and Java have in common. First and\
    \ most obvious is the word \"Java\" (which was used to make JavaScript attractive\
    \ to Java developers; I know, really). The only other thing is a bit of similar\
    \ syntax: both languages use C-style curly braces. That's really all.\n\nFor a\
    \ long time, JavaScript wasn't considered to be much of a language. The \"big\
    \ idea\" on the web was supposed to be Java Applets. However, they failed, and\
    \ eventually, JavaScript's \"Good Parts\" became well-known and soon even loved\
    \ by many people.\n\nNow, JavaScript is the most used programming language in\
    \ the world. It's used not only in web browsers, but also desktop apps, mobile\
    \ phone apps, and now even on the server. You definitely won't be wasting your\
    \ time learning JavaScript.\n\n## How Do I Get Started?\n\nNow that you're pumped\
    \ to learn JavaScript, how do we get started? Well, you'll learn how to actually\
    \ code JavaScript in the following chapters. But where is that code going to go?\n\
    \nAlthough it's hard to find a place where JavaScript *won't* run, the overwhelming\
    \ majority of JavaScript—especially the JavaScript you'll be writing for now—will\
    \ be in web pages, to run in the browser. There are two ways to get JavaScript\
    \ into your HTML page.\n\nFirst, you can embed your JavaScript code right inside\
    \ `script` tags.\n\n```\n<script>\n    alert(\"I'm learning JavaScript\");\n</script>\n\
    ```\n\nYou don't have to understand the code in the tags for now; just know that\
    \ it works. When your browser encounters a script tag, it will interpret the code\
    \ that you've written and execute it (if appropriate).\n\nThe second way to get\
    \ JavaScript onto your page is to link to a .js file:\n\n```\n<script src=\"somefile.js\"\
    ></script>\n```\n\nYes: unfortunately that closing script tag is required, even\
    \ though you don't put anything inside it. As you might guess, the **src** attribute\
    \ is short for \"source.\" This will download the JavaScript file and process\
    \ it, just like the inline code.\n\nTwo more notes about including scripts:\n\n\
    - For the most part, you'll want to include your **script** tags right before\
    \ your closing body tag. Actually, you can put them anywhere you want, but it's\
    \ best for performance reasons to put it at the end of the body...or write your\
    \ code to wait until the page has completed loading before it begins executing.\
    \ We'll see how to do this later on (and no, you can't jump ahead to \"Another\
    \ Short Rabbit-Trail on Script Loading\" on page 140).\n- You might see code in\
    \ which the **script** tags have this attribute: **type=\"text/javascript\"**.\
    \ This used to be required, but isn't in HTML5 (or course, you should then be\
    \ using an HTML5 doctype).\n\n## Firebug\n\nAs you learn about JavaScript, you'll\
    \ find the Firefox plugin Firebug (http://getfirebug.com) invaluable. Go to that\
    \ link and install it, right after you install the latest version of Firefox.\n\
    \nAfter installing Firebug, you'll have a little bug icon in the lower right corner\
    \ of the status bar of your Firefox window; if it's coloured, that means it's\
    \ enabled for the website you're on; otherwise it will be black and white.\n\n\
    At least, that's where it's been for a long time. If you're on Firefox 4, however,\
    \ it's now on the toolbar:\n\nTo enable Firebug on a website, just click that\
    \ icon. When you click on this, the Firebug panel will pop up. It'll look something\
    \ like this:"
