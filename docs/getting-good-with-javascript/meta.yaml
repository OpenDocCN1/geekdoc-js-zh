- md: " ## 12 Getting Started\n\nWe could write a whole tutorial on Firebug, but the\
    \ panel you'll find useful in this book is the console panel. You can find it\
    \ by clicking the console tab (Firebug should open to it by default; it's pictured\
    \ above).\n\nAt the bottom of the panel, you'll see a prompt (») where you can\
    \ type some JavaScript. This is like the command line, where you type in some\
    \ code, hit *return* (or *enter*), and you'll get the result. If you need to type\
    \ in more than one line of code at a time, press the upward-facing arrow at the\
    \ end of the line; you'll be able to type in more than one line, and then click\
    \ the *Run* button at the bottom of the expanded panel to execute it.\n\n## Conventions\
    \ Used in This Book\n\nOne more administrative note before we continue: many of\
    \ the code examples in the book will look like this:\n\n**Example 1.1**\n\n```\n\
    alert(\"Hello, reader\"); // Hello, reader\n```\n\nSee how there's a header on\
    \ this code snippet: \"Example 1.1\"? All code snippets with headers have an accompanying\
    \ file—called something like 'example_1_1.html'—that you can find in the 'code'\
    \ folder which you've already downloaded with the book. I want you to run these,\
    \ but even better, I want you to open them up and change the code, mess around,\
    \ and learn why some things work and others don't.\n\nIf a snippet doesn't have\
    \ a title, it's just a quick example that needs to be shown in code, but won't\
    \ give you any result if you execute it by itself.\n\nYou won't fully understand\
    \ this now, but I need to explain it, and you'll understand it soon: in the snippet\
    \ above, I've used the **alert** function to show the result of the code; this\
    \ function will pop up an alert box, with the text we give it. Notice the two\
    \ backslashes at the end of the line: those denote a comment in the code (more\
    \ on this soon); in our case, I've put the result you should see in the alert\
    \ box in the comment, so you can compare results.\n\nSometimes, I'll use **console.log**\
    \ instead of **alert**; instead of popping up an alert box, this will write the\
    \ information to the Firebug console. This the more popular way of getting output\
    \ when writing JavaScript. We'll use both, so that you're comfortable with both.\n\
    \n**Example 1.2**\n\n```\nconsole.log(\"Hi there\");  // Hi there\nconsole.log(1\
    \ + 4); // 5\n```\n\nOpen the 'Example 1.2' file in Firefox, and open Firebug\
    \ (actually you'll have to refresh the page after you open Firebug, because nothing\
    \ will log if Firebug isn't enabled for that page). You should see two lines in\
    \ the console, one saying \"Hi there\", and the other saying \"5.\"\n\nSometimes\
    \ the code will be longer than can fit on the width of this book's page. If so,\
    \ there will be a continuation marker (▶ or ▷) at the end of the line. This means\
    \ the text on the following line is intended to be typed together with the previous\
    \ line as one. For example, the following is all typed as one line, with no break:\n\
    \n```\nmsg = \"the time is \" + hour + \" o'clock\"; // addition ▶\noperator used\
    \ on strings\n```\n\nA hollow arrow indicates that a space is permissible between\
    \ the character as the end of the starting line and the first character of the\
    \ second; a solid arrow indicates that there should be no space. The marker itself\
    \ is not typed in.\n\n## Summary\n\nI hope you're getting excited, because I know\
    \ I am! We're about to undertake a journey that will change your life forever\
    \ (well, at least it could). Let's swing into Chapter 2 to begin talking about\
    \ the basics of JavaScript.\n\n## The Basics\n\nHere's where we actually get down\
    \ and dirty; in this chapter, we're going to cover the nuts and bolts of JavaScript:\
    \ all the little seemingly-unrelated pieces that will build the core of your JavaScript\
    \ knowledge.\n\n## Variables\n\nIn a minute, we'll be discussing data types in\
    \ JavaScript, but we need to cover variables first. Depending how you look at\
    \ this, we might be putting the cart before the horse, but we'll figure this all\
    \ out. For now, know that we have values like text and numbers in JavaScript.\n\
    \nVariables are basically labels that you give to your values. The variable points\
    \ to the place in memory where the value is stored. So, how do you make one of\
    \ these variables?\n\n**Example 2.1**\n\n```\nvar name = \"Joe\",\n    age = 45,\n\
    \    job = \"plumber\";\n\nalert( name ); // Joe\n```\n\nThere are several things\
    \ to notice here: firstly, when creating variables, you must put the keyword **var**\
    \ before the variable name. Next comes the variable name. You can name your variables\
    \ whatever you want, within these boundaries: you can use any combination of letters,\
    \ numbers, dollar signs, and underscores, as long as you don't start with a number.\
    \ As you can see, you can declare multiple variables at once by separating the\
    \ expressions with commas. It's a good idea to do this: at the top of your code,\
    \ and at the top of every function, declare all the variables you'll need within\
    \ that file or function (functions: coming soon to a page near you).\n\nBut, what\
    \ do you do if you don't know what the value of that variable should be when you\
    \ create it? Maybe it's a value that the user is going to give you later on, or\
    \ something you need to calculate. It's still a good idea to declare the variable,\
    \ but you don't have to give it a value:\n\n```\nvar name;\n\nname = \"Jim\";\n\
    ```\n\nWhen you declare the variable without giving it a value, the JavaScript\
    \ engine gives it the default value of **undefined**. Then, you can give it a\
    \ new value later.\n\nI know I already said it, but it's important that you understand\
    \ it: variables are just labels for values. This means they are interchangeable\
    \ for the most part.\n\nWith that out of the way, let's look at the types of data\
    \ we have in JavaScript.\n\n## Types\n\nThe first step in learning JavaScript\
    \ (after we know what a variable is) is to understand two things:\n\n- What basic\
    \ data types are available, and what they can do\n- How the language is actually\
    \ written (the syntax)\n\n## String\n\nA string is simply the way to handle any\
    \ kind of text in JavaScript. Whenever you're working with text, you'll be using\
    \ a string. A string of text must be surrounded by either double or single quotes;\
    \ there's no difference. Here are some examples:\n\n```\n\"Here is some text\"\
    \n```\n\n```\n'This text is surrounded by single quotes'\n```\n\nIf you want to\
    \ include a quote character inside your string, then you'll have to escape it.\
    \ To escape a character inside a string means to precede the character with a\
    \ backslash. This basically tells the JavaScript interpreter that the character\
    \ after the slash shouldn't be interpreted normally; it's something special. In\
    \ this case, the normal interpretation of a quote is to close the string.\n\n\
    ### Example 2.2\n\n```\nalert(\"John says \\\"What are you doing?\\\"\");\n//\
    \ John says \"What are you doing?\"\nalert('\"Let\\'s go out for lunch.\"');\n\
    // \"Let's go out for lunch.\"\n```\n\nNotice how, in that last string, I don't\
    \ have to escape the double quotes, because the string is delimited by single\
    \ quotes. You only have to escape the quote-type that holds your string.\n\n##\
    \ Numbers\n\nWhile some programming languages offer different types of numbers,\
    \ JavaScript has only one. In most cases, you'll simply type the number of your\
    \ choice.\n\n```\n10\n\n3.14159\n```\n\nJavaScript makes no distinction (at least\
    \ for you, the coder) between numbers with and without decimals. For extra large\
    \ or extra small numbers, you can use scientific notation:\n\n**Example 2.3**\n\
    \n```\nalert( 3.45e5 ); // 345000\nalert( 123e-3 ); // 0.123\n```\n\nThe first\
    \ number above represents 3.45 x 10⁵, or 345,000. The second represents 123 x\
    \ 10⁻³, or 0.123. Be careful though: JavaScript doesn't accept numbers with more\
    \ than 17 decimal places. It will cut off any digits after that.\n\n> **ROCK*\
    \ TIP**\n> This is a good time to mention that numbers in JavaScript aren't always\
    \ that reliable. For example, type `0.1 + 0.2` into Firebug. The result is `0.30000000000000004`;\
    \ what? Why does this happen? The reasons are pretty technical, and they're based\
    \ on the number specification JavaScript uses. Thankfully, as you start out with\
    \ JavaScript, you won't be doing too much number crunching. However, consider\
    \ this a general rule of thumb: when adding and subtracting with decimals, multiply\
    \ them first. After calculating, divide. We haven't discussed operators, yet,\
    \ but this is the way we'd do it: `(( 0.1 * 10 ) + ( 0.2 * 10 )) / 10`. This will\
    \ come up with the right answer: 0.3. I know this looks painful, but hey, that's\
    \ JavaScript: at times, terribly frustrating (but mostly fun and cool).\n\n##\
    \ Booleans\n\nThere are two Boolean values: **true** and **false**. There are\
    \ many places you'll use Boolean values in your JavaScript code, and when necessary,\
    \ you'll use these values. However, more"
  mdcn: "\n ## 12 入门\n\n关于 Firebug，我们甚至可以写一整篇教程，但在这本书中你会用到的面板是控制台面板。你可以点击 console\
    \ 标签来找到它（Firebug 默认应该会打开它；如上图所示）。\n\n在面板底部，你会看到一个提示符（»），可以在那里输入一些 JavaScript 代码。这类似于命令行，你输入一些代码，按\
    \ *return*（或 *enter*），然后就会得到结果。如果你需要一次输入多行代码，点击行末向上的箭头；这样你就能输入多行代码，然后点击展开面板底部的\
    \ *Run* 按钮来执行。\n\n## 本书使用的约定\n\n在我们继续之前，还有一个说明：书中的许多代码示例看起来会是这样的：\n\n**示例 1.1**\n\
    \n```\nalert(\"Hello, reader\"); // Hello, reader\n```\n\n看到这个代码片段顶部的标题了吗：\"Example\
    \ 1.1\"？所有带有标题的代码片段都有一个配套文件——文件名类似 'example_1_1.html'——你可以在已经随书下载的 'code' 文件夹中找到它。我希望你运行这些示例，但更希望你打开它们并修改代码，尝试各种操作，从而了解为什么有些东西能工作，有些则不能。\n\
    \n如果一个片段没有标题，那它只是一个需要以代码形式展示的简单示例，但单独执行它不会给你带来任何结果。\n\n你现在还无法完全理解这一点，但我需要先解释一下，你很快就会明白：在上面的片段中，我使用了\
    \ **alert** 函数来展示代码的结果；这个函数会弹出一个警告框，显示我们给它的文本。注意行末的两条斜杠：这表示代码中的注释（更多内容即将介绍）；在我们的例子中，我把你应该在警告框中看到的结果放在了注释里，这样你就可以对比结果了。\n\
    \n有时，我会用 **console.log** 代替 **alert**；它不会弹出警告框，而是将信息写入 Firebug 控制台。这是在编写 JavaScript\
    \ 时更常用的输出方式。我们会两种都使用，以便你对两者都熟悉。\n\n**示例 1.2**\n\n```\nconsole.log(\"Hi there\"\
    );  // Hi there\nconsole.log(1 + 4); // 5\n```\n\n在 Firefox 中打开\"示例 1.2\"文件，并打开\
    \ Firebug（实际上，在打开 Firebug 后你需要刷新页面，因为如果该页面未启用 Firebug，就不会有日志记录）。你应该会在控制台中看到两行内容，一行显示\"\
    Hi there\"，另一行显示\"5\"。\n\n有时代码的长度会超过本书页面的宽度。如果是这样，行末会有一个续行标记（▶ 或 ▷）。这意味着下一行的文本应该与前一行连起来作为一个整体输入。例如，下面全部作为一行输入，中间没有换行：\n\
    \n```\nmsg = \"the time is \" + hour + \" o'clock\"; // 加法 ▶\n运算符用于字符串\n```\n\n\
    空心箭头表示起始行末尾的字符与第二行第一个字符之间允许有空格；实心箭头表示不应该有空格。标记本身不需要输入。\n\n## 小结\n\n我希望你感到兴奋，因为我知道我很兴奋！我们即将踏上一段将永远改变你生活的旅程（好吧，至少有可能）。让我们进入第二章，开始讨论\
    \ JavaScript 的基础知识。\n\n## 基础知识\n\n在这里，我们真正要深入细节了；在本章中，我们将涵盖 JavaScript 的方方面面：所有看起来似乎不相关的小片段，将构建你\
    \ JavaScript 知识的核心。\n\n## 变量\n\n过一会儿，我们将讨论 JavaScript 中的数据类型，但我们需要先了解变量。取决于你怎么看，我们可能是本末倒置了，但我们会把所有这些都弄清楚。现在，要知道我们在\
    \ JavaScript 中有文本和数字等值。\n\n变量基本上就是给你的值贴上的标签。变量指向内存中存储该值的位置。那么，如何创建这样一个变量呢？\n\n\
    **示例 2.1**\n\n```\nvar name = \"Joe\",\n    age = 45,\n    job = \"plumber\";\n\
    \nalert( name ); // Joe\n```\n\n这里有几点需要注意：首先，创建变量时，必须在变量名前面加上关键字 **var**。接下来是变量名。你可以随意命名变量，但需遵守以下规则：可以使用字母、数字、美元符号和下划线的任意组合，只要不以数字开头。如你所见，你可以通过用逗号分隔表达式来一次声明多个变量。这样做是个好主意：在代码顶部，以及每个函数的顶部，声明你在该文件或函数中需要的所有变量（函数：即将在附近页面介绍）。\n\
    \n但是，如果你在创建变量时还不知道它的值应该是什么怎么办？也许这是一个用户稍后会给你的值，或者你需要计算的东西。仍然建议声明该变量，但不必给它赋值：\n\n\
    ```\nvar name;\n\nname = \"Jim\";\n```\n\n当你声明变量而不给它赋值时，JavaScript 引擎会赋予它默认值 **undefined**。然后，你可以稍后给它赋予新值。\n\
    \n我知道我已经说过了，但理解这一点很重要：变量只是值的标签。这意味着它们在很大程度上是可以互换的。\n\n说完这个，让我们看看 JavaScript 中有哪些数据类型。\n\
    \n## 类型\n\n学习 JavaScript 的第一步（在我们了解了什么是变量之后）是理解两件事：\n\n- 有哪些基本数据类型可用，以及它们能做什么\n\
    - 这种语言实际上是如何编写的（语法）\n\n## 字符串\n\n字符串简单来说就是在 JavaScript 中处理任何文本的方式。每当你处理文本时，都会用到字符串。文本字符串必须用双引号或单引号括起来；两者没有区别。以下是一些例子：\n\
    \n```\n\"Here is some text\"\n```\n\n```\n'This text is surrounded by single quotes'\n\
    ```\n\n如果你想在字符串中包含引号字符，那么就必须对它进行转义。在字符串中转义字符意味着在该字符前加上反斜杠。这基本上告诉 JavaScript 解释器，斜杠后的字符不应该按正常方式解释；它是特殊的。在这种情况下，引号的正常解释是关闭字符串。\n\
    \n### 示例 2.2\n\n```\nalert(\"John says \\\"What are you doing?\\\"\");\n// John\
    \ says \"What are you doing?\"\nalert('\"Let\\'s go out for lunch.\"');\n// \"\
    Let's go out for lunch.\"\n```\n\n注意，在最后一个字符串中，我不需要转义双引号，因为该字符串是用单引号分隔的。你只需要转义包含字符串的那种引号类型。\n\
    \n## 数字\n\n虽然有些编程语言提供不同类型的数字，但 JavaScript 只有一种。在大多数情况下，你只需输入你想要的数字即可。\n\n```\n\
    10\n\n3.14159\n```\n\n对于你，程序员来说，JavaScript 不区分带小数和不带小数的数字。对于极大或极小的数字，你可以使用科学记数法：\n\
    \n**示例 2.3**\n\n```\nalert( 3.45e5 ); // 345000\nalert( 123e-3 ); // 0.123\n```\n\
    \n上面的第一个数字表示 3.45 x 10⁵，即 345,000。第二个表示 123 x 10⁻³，即 0.123。但要注意：JavaScript 不接受超过\
    \ 17 位小数的数字。超过的部分会被截断。\n\n> **ROCK* 提示**\n> 这时值得提及的是，JavaScript 中的数字并不总是完全可靠的。例如，在\
    \ Firebug 中输入 `0.1 + 0.2`，结果是 `0.30000000000000004`；什么？为什么会这样？原因相当技术性，基于 JavaScript\
    \ 使用的数字规范。幸好，在你开始接触 JavaScript 时，不会进行太多的数值计算。不过，可以把这个当作一般经验法则：在进行小数的加减运算时，先将它们相乘。计算完成后，再除以相应的数。我们还没有讨论运算符，但方法是这样的：`((\
    \ 0.1 * 10 ) + ( 0.2 * 10 )) / 10`。这会得到正确答案：0.3。我知道这看起来很麻烦，但这就是 JavaScript：有时令人非常沮丧（但大多数时候有趣且酷）。\n\
    \n## 布尔值\n\n布尔值有两个：**true** 和 **false**。在你的 JavaScript 代码中，你会在很多地方使用布尔值，必要时你会用到这些值。然而，更多\n"
