  md: "# More Concepts and Best Practices\n\nthat's the technical term—throw) an error.\
    \ Also, we can throw our own errors, if something goes wrong.\n\nHere's the error-protection\
    \ syntax:\n\n```\ntry {\n    // code that might cause an error here\n} catch (e)\
    \ {\n    // deal with the error here\n}\n```\n\nWe wrap the code that might throw\
    \ an error in a `try` block. If we don't do this, the JavaScript engine will deal\
    \ with the error itself, which usually means stopping the execution of your code\
    \ and potentially showing the user the error: not good. If an error is thrown,\
    \ the error object (which we'll look at soon) is passed to the `catch` block (you\
    \ can call it whatever you want; in this case, I'm calling it `e`, which is common).\
    \ Inside the `catch` block, you can deal with the error.\n\nDifferent web browsers\
    \ include different properties on the error object. They all include the error\
    \ name and the error message. Firefox also includes the file name and line number\
    \ of the error. Chrome includes a stack trace. There are other things, but the\
    \ main ones are **name** and **message**, which are the type of error and a description\
    \ of what happened, respectively. You can throw your own errors using the `throw`\
    \ keyword and creating an error object. You can create this error object as an\
    \ object literal, or you can use the error constructor functions.\n\nWhat kinds\
    \ of things will the JavaScript engine throw an error on? Try calling a function\
    \ that doesn't exist, or accessing a property of `null`; yep, you'll get an error.\
    \ However, it's useful to be able to throw our own errors, so let's see how it's\
    \ done:"
