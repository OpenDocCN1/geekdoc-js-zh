  md: '# # Testing your JavaScript


    Let''s talk about testing your code. Testing is like pictures of kittens: it''s
    impossible to have too much of it. You should constantly be testing your code.
    There are two main types of testing: performance testing and unit testing.


    +   - **Unit testing** refers to testing each bit of functionality (each unit)
    in your code. You may even want to use the practice "Test Driven Development,"
    which means you write your tests first, so you know what the code you are about
    to write is supposed to do.


    +   - **Performance testing** refers to making sure you have written your code
    in the fastest way possible. No, I''m not referring to the length of time it took
    you to code. I mean the length of time is takes your code to run. It''s important
    to have efficient code.


    Let''s look at each of these types of testing individually.


    # ## Unit Testing


    So, testing each unit of your code: it sounds like a good idea, but how do you
    do it? Well, here''s the basic process:


    +   - Write your tests


    +   - Run your tests and watch them fail


    +   - Write your code


    +   - Run your tests and watch them pass


    +   - Refactor (clean up) your code


    +   - Rinse and repeat for each feature'
  merge: -1
  pgno: 101
