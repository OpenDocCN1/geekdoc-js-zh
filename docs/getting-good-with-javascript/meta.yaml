    \        throw new Error(\"We don't offer that size\");\n    }\n\n    coffee =\
    \ { size: required_size, added: [\"sugar\",\n        \"sugar\", \"cream\" ] };\n\
    \n    return coffee;\n}\n\ntry {\n    make_coffee(\"extra large\");\n} catch (e)\
    \ {\n    console.log(e.message);\n}\n```\n\nYou might find this to be a common\
    \ pattern. When there's the possibility of an error, you'll throw it within a\
    \ function. Then, you'll wrap the calling of that function in a try statement\
    \ and catch the error, if there is one. The way it works is that as soon as the\
    \ error is thrown, the program jumps to the catch statement, so nothing after\
    \ the error is ever executed. As you can see, we're using the Error constructor\
    \ function, passing in our error message.\n\n# Testing your JavaScript\n\nLet's\
    \ talk about testing your code. Testing is like pictures of kittens: it's impossible\
    \ to have too much of it. You should constantly be testing your code. There are\
    \ two main types of testing: performance testing and unit testing.\n\n- **Unit\
    \ testing** refers to testing each bit of functionality (each unit) in your code.\
    \ You may even want to use the practice \"Test Driven Development,\" which means\
    \ you write your tests first, so you know what the code you are about to write\
    \ is supposed to do.\n\n- **Performance testing** refers to making sure you have\
    \ written your code in the fastest way possible. No, I'm not referring to the\
    \ length of time it took you to code. I mean the length of time is takes your\
    \ code to run. It's important to have efficient code.\n\nLet's look at each of\
    \ these types of testing individually.\n\n## Unit Testing\n\nSo, testing each\
    \ unit of your code: it sounds like a good idea, but how do you do it? Well, here's\
    \ the basic process:\n\n- Write your tests\n- Run your tests and watch them fail\n\
    - Write your code\n- Run your tests and watch them pass\n- Refactor (clean up)\
    \ your code\n- Rinse and repeat for each feature\n\nThis is the process for test-driven\
    \ development: by writing the tests first, you'll have a goal to work towards.\
    \ Don't feel bad about failing tests; at first, you want them to fail. If they\
    \ don't fail, you've probably misunderstood your goals or written poor tests.\n\
    \nSo how do you write these tests? Often, you'll use a testing framework (we'll\
    \ talk about frameworks and libraries in the next chapter). However, it's not\
    \ too hard to write your own testing functionality.\n\nBefore we write our tests\
    \ or test functionality, let's ask this: what types of things should we be testing\
    \ for? Here are the two types of tests common testing frameworks implement:\n\n\
    - **assert**: determines is something is true or not\n- **equal**: determines\
    \ if two things are equal\n\nWe could write these functions ourselves...so let's\
    \ do that now! Note: this will assume that you're testing your JavaScript in a\
    \ web browser, because this is the case more often than not. This means we're\
    \ going to deal with the Document Object Model, which you might not know about\
    \ yet. Don't worry, we cover all the ugly aspects of the DOM in the next chapter.\
    \ You can jump there if you'd like, or hang on for the ride. It won't be much\
    \ right now, so you shouldn't have to worry.\n\n### Example test.js\n\n```\nvar\
    \ TEST = (function () {\n\n    var results = document.createElement(\"ul\");\n\
    \    results.id = \"tests\";\n    document.body.appendChild(results);\n\n    function\
    \ log(class_name, msg) {\n        var li = document.createElement(\"li\");\n \
