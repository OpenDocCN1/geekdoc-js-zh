  md: "# 96 More Concepts and Best Practices\n\nafter the anonymous function has returned,\
    \ the inner function will still have access to this variable. That's closure:\
    \ an inner function having access to the scope of its parent function, even after\
    \ the parent function has returned. This way, **secretNumber** is set only once,\
    \ it can safely be incremented each time it's used, and no one can get to it,\
    \ because it's protected by the scope of the anonymous function. Putting it another\
    \ way, closure is the concept of exposing limited control of a function's scope\
    \ outside the function.\n\nAnother place where this is useful is in creating modules.\
    \ Check this out:\n\n```\nvar a_module = (function () {\n    var private_variable\
    \ = \"some value\";\n\n    function private_function () {\n        // some code;\n\
    \    }\n\n    return {\n        public_property : \"something\"\n        // etc\
    \ : \" ... \"\n    };\n})();\n```\n\nThis is the module pattern: inside an anonymous\
    \ self-invoking function, we create variable and methods that we don't have available\
    \ from the outside. Then, we return an object with public properties and methods\
    \ that use these private variable and methods. This way, the \"guts\" that shouldn't\
    \ be exposed aren't. If you want to read more about the module pattern, check\
    \ out this post of the YUI Blog<sup>6</sup>.\n\n<sup>6</sup> http://www.yuiblog.com/blog/2007/06/12/module-pattern/"
