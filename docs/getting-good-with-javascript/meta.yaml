    Those are the basics of traversing the DOM. There are a few more links between
    nodes that we''ll wrap up this discussion with.


    # childNodes


    Every node has a property called `childNodes`; it''s a NodeList (remember, an
    array-like object) containing all the child nodes of the node. Don''t forget,
    it''s zero-based.


    # Example 5.5


    ```

    // <ul id="container">

    //   <li>one</li>

    //   <li>two</li>

    // </ul>

    var my_node = document.getElementById("container");


    my_node.childNodes[1]; // gets the first list item (the second child node)

    ```


    # children


    While **childNodes** holds all node types, **children** just includes the element
    nodes. These are usually what you want, so this is probably more useful than **childNodes**.
    However, IE 6 - 8 includes comment nodes for some reason, so beware of that.


    # lastChild


    Works just like `firstChild`, except it gets—wait for it—the last child node.'
  - '[PAGE 129]


    # ## previousSibling


    Just as you''d (hopefully) expect, the `previousSibling` property returns the
    previous sibling of the node.


    # ## parentNode


    This is the one-way link every node has to its parent. Think back to our bunch
    of product `div`s. We wanted to sort them by product name. This meant we needed
    to find the `h2` element, to sort by. But if we actually got to the sorting step,
    we would have used `parentNode` to get the `div` parent for each h2.


    # ### Example 5.6


    ```

    // <ul>

    //   <li id="first">one</li>

    //   <li>two</li>

    // </ul>


    var my_node = document.getElementById("first");

    console.log( my_node.parentNode); // ul element

    ```


    # ## Others


    There are a bunch of properties for traversing the DOM that are incredibly useful,
    but not incredibly well-supported. They are as follows:


    +   - `firstElementChild`

    - `lastElementChild`

    - `nextElementSibling`

    - `previousElementSibling`'
