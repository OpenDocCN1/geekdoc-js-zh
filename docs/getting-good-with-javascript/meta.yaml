  md: '# More Basics


    Now that we''ve got the very basics of types and syntax down, let''s move on to
    another incredibly important feature: functions. Pay close attention!


    # Functions


    What is a function? A function is really just an encapsulated bunch of code. We''ve
    been looking at a bunch of JavaScript syntax: all of that can go inside functions,
    and often that''s what you''ll do. When you put code inside a function, it isn''t
    run right away, like "loose" code. You decide when the code runs by calling the
    function, and you can do that as often as you want to. This is part of the benefit
    of functions.


    But don''t forget the encapsulation part: that means that at the time you invoke,
    or call, a function, you don''t have any control (for the most part) of what goes
    on inside it. You''ll hand the function some values to work with, and it will
    hand a value back; but what goes on inside it is black-boxed. This turns out to
    be an important thing that we can take advantage of, as we''ll see later.


    There are two other important things you should know about functions. First off,
    functions are first-class objects in JavaScript, which means that *they are objects*,
    and that *they are no different from any other value*. Let''s take these two points
    a bit further.


    **Functions are Objects:** We saw how to create an object literal earlier. Now,
    we can''t create a function using that object literal notation, but a function
    can have properties and methods, because it is an object. You can add your own
    properties and methods to functions, but we''ll look at some of the built in ones
    soon.'
  merge: -1
  pgno: 50
- img_proc: true
  md: "**Functions are like other Values:** In many programming languages, a function\
    \ is something very different from primitive values like strings and numbers.\
    \ However, in JavaScript, that's not the case. You can use functions in most places\
    \ that you'd use another value, like passing it to another function (which we'll\
    \ see shortly). Also, you can redefine a function, just like you'd redefine any\
    \ other variable. This, as you'll see, is very handy.\n\nNow that we understand\
    \ a bit of function theory, let's look as some syntax.\n\n# Function Syntax\n\n\
    As we know, a function is just any number of lines of regular JavaScript. But\
    \ we need to wrap that in function material. Let's say we have some code that\
    \ determines an appropriate greeting for our website:\n\n# Example 3.1\n\n```\n\
    var hour = 10,\n    message;\n\nif (hour < 12) {\n    message = \"Good Morning!\"\
    ;\n} else if (hour < 17) {\n    message = \"Good Afternoon!\";\n} else {\n   \
    \ message = \"Good Evening!\";\n}\n\nconsole.log(message); // Good Morning!\n\
    ```\n\nWe've created an `hour` variable, with the hypothetical current hour. Then,\
    \ we use an if statement to figure out in what range our hour is, and assign `message`\
    \ accordingly."
