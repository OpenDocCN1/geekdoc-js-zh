    # # Math Functions


    JavaScript also has a `Math` object; you can''t create objects from it, like with
    `Date`, but it offers some useful mathematic functionality.


    # ## min


    A helpful function that returns the lowest of the number parameters you pass in:


    # ### Example 3.31


    ```

    alert( Math.min(9, 1, 4, 2) ); // 1

    ```


    # ## max


    Yes, it''s the opposite of `min`:


    # ### Example 3.32


    ```

    alert( Math.max(9, 1, 4, 2) ); // 9

    ```


    # ## random


    This function returns a random number between 0 and 1. What good is that? Well,
    you can then multiply it by 10 to get a number between 0 and 10, roughly. Anytime
    you need a random number, this is your tool:


    # ### Example 3.33


    ```

    alert( Math.random() ); // 0.5938208589795977 (you''ll probably get something
    else)

    alert( Math.random() * 10 ); // 6.4271276677027345 (again, your mileage may vary)

    ```'
