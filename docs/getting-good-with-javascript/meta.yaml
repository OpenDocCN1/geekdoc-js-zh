    Well, That''s all we''re going to cover in this book. But that''s definitely not
    all there is to learn about JavaScript. While you should now be comfortable writing
    functions, working with object, and (gently) manipulating the DOM, there''s so
    much more to cover. JavaScript is growing as we speak, and there''s a lot more
    to learn. Check out the Appendices for where to go from here.


    Go forth and code JavaScript!'
