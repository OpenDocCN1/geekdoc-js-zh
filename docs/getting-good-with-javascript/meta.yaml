  md: '# ## The Basics


    Putting "plus-plus" before or after a number will add one to the number. Predictably,
    "minus-minus" will subtract one from the number. So, what''s the difference between
    the prefix version and the postfix version? It''s this: these operators return
    a value too, just like the other ones. In this case, they return the value of
    the number they are incrementing; however, the prefix (that the operator on the
    front) operators increment the number before returning the value, which the postfix
    operators return the value, then increment the number. Here''s an example:


    # ### Example 2.11


    ```

    var num1 = 1, num2, num3;


    num2 = ++num1;


    console.log("num1: ", num1); // num1: 2

    console.log("num2: ", num2); // num2: 2


    num3 = num1++;


    console.log("num1: ", num1); // num1: 3

    console.log("num3: ", num2); // num3: 2

    ```


    Another useful unary operator is typeof; this operator will return the type of
    the given variable:


    # ### Example 2.12


    ```

    alert( typeof 10 ); // "number"

    alert( typeof "test" ); // "string"

    alert( typeof new Date() ); // "object"

    ```


    The only catch here is that arrays aren''t given this type of array; they are
    called objects, because—technically—they are. But that''s not helpful.'
