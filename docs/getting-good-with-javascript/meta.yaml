    var i = 0;\n\ni++;\n\nalert(i); // 1\n\n++i;\n\nalert(i); // 2\n\ni--;\n\nalert(i);\
    \ // 1\n\n--i;\n\nalert(i); // 0\n```"
  - '[PAGE 32]


    # ## The Basics


    Putting "plus-plus" before or after a number will add one to the number. Predictably,
    "minus-minus" will subtract one from the number. So, what''s the difference between
    the prefix version and the postfix version? It''s this: these operators return
    a value too, just like the other ones. In this case, they return the value of
    the number they are incrementing; however, the prefix (that the operator on the
    front) operators increment the number before returning the value, which the postfix
    operators return the value, then increment the number. Here''s an example:


    # ### Example 2.11


    ```

    var num1 = 1, num2, num3;


    num2 = ++num1;


    console.log("num1: ", num1); // num1: 2

    console.log("num2: ", num2); // num2: 2


    num3 = num1++;


    console.log("num1: ", num1); // num1: 3

    console.log("num3: ", num2); // num3: 2

    ```


    Another useful unary operator is typeof; this operator will return the type of
    the given variable:


    # ### Example 2.12


    ```

    alert( typeof 10 ); // "number"

    alert( typeof "test" ); // "string"

    alert( typeof new Date() ); // "object"

    ```


    The only catch here is that arrays aren''t given this type of array; they are
    called objects, because—technically—they are. But that''s not helpful.'
  - '[PAGE 33]


    There are a few other unary operators, but we''ll see them in a while. Right now,
    let''s talk about our last two groups of operators: extra assignment operators
    and Boolean operators.


    # Assignment Operators


    We''ve looked at assigning with the = operator; but there are a few others that
    I think are taught best by demonstration:


    # Example 2.13


    ```

    var num = 10;


    num += 5; // same as num = num + 5

    alert(num); // 15


    num -= 3; // same as num = num - 3

    alert(num); // 12


    num *= 2; // same as num = num * 2

    alert(num); // 24


    num /= 6; // same as num = num / 6

    alert(num); // 4


    num %= 3; // same as num = num % 3

    alert(num); // 1

    ```


    As you can see, these assignment operators are used to perform an operation on
    a value already in a variable and re-assign the new value to the variable. If
    you run the above code, you should find that **num** equals 1 after you run them
    all.'
  - '[PAGE 34]


    # The Basics


    # Boolean Operators


    Boolean operators are used to test the trueness or falseness of a value. Every
    value in JavaScript can be evaluated as a Boolean. Some values are considered
    false and others are considered true; you''ll see how this is important later
    on in this chapter. For now, know that these values are considered false:


    +   - **false**

    - **null**

    - **undefined**

    - **""** (an empty string)

    - **0**

    - **Nan** (what you get when you try to add, subtract, etc. a number and another
    non-number value)


    Every other value is considered true; keep in mind, this includes the strings
    "false", "null", and so on.


    Now then, back to Boolean operators. The first is the logical NOT; the logical
    NOT operator converts the given value to the opposite Boolean value.


    # Example 2.14


    ```

    var a = "a string";


    alert( !a ); // false


    alert( !!a ); // true

    ```


    Since a string with something in it is a true value, using the logical NOT operator
    will return **false**. It''s just like saying "NOT true."'
  - '[PAGE 35]


    Notice that using NOT twice gives us `true`; this is a great trick to use when
    you want to convert any value to its Boolean value.


    While the logical NOT is a unary operator, the logical AND and logical OR operators
    use two values. Look at the syntax, then we''ll discuss them:


    # Example 2.15


    ```

    var a = true;

    var b = false;


    alert( a && b ); // false


    alert( a || b ); // true

    ```


    How does this work? And where do these operators do any good? The first one above
    (`&&`) is the logical AND operator; it only returns `true` if both sides of the
    operator are true. The logical OR (`||`) returns true as long as just one of the
    values are true.


    So, where is this useful? Well, soon we''ll be looking at loops and conditionals,
    and that''s where you''ll use this most. In a conditional statement, you''ll want
    to check for certain conditions. If you need two values to be something specific
    before proceeding, you''ll use the logical AND; if only one needs to be true,
    logical OR will work fine.


    I should note that you can use any expression that returns a value; for example:'
  - '[PAGE 36]


    # Example 2.16


    ```

    var day = 14, year = 2011;


    alert( day > 10 || year === 2011 ); // true


    alert( day < 20 && year >= 2010 ); // true

    ```


    You should also know that if the first side of the operator determines the answer,
    the second side won''t be evaluated. For example, in the use of logical OR above,
    `year === 2011` will never be evaluated, because `day > 10` returns true, and
    OR only requires one to be true. On the other hand, if the first half of a logical
    AND returns false, the second half won''t be evaluated, because both sides need
    to be true for the whole expression to be true.


    This fact—that if the first half of the expression determines the final value,
    the second isn''t tested—is used by some of the JavaScript ninjas to shorten their
    code a bit. Let''s say we want to invoke a function (remember, we''ll get to functions
    soon), but we''re not sure if the function exists. We could do this:


    ```

    funcName && funcName();

    ```


    Remember, to execute the function, we have to have the parentheses, so the first
    part of this code doesn''t execute the function, it just returns the function.
    If the function exists, this will evaluate to true, and the evaluation will continue
    to the second part, which executes the function. This avoids the error that would
    be thrown if we tried to execute a function that doesn''t exist (and, yes, we
    will talk about errors).'
- md: " ## Conditional Statements\n\nSeveral—if not most—of the operators we've just\
    \ finished looking at are used to determine whether something is true or false.\
    \ Often, that will be the condition for something further on: if something is\
    \ true, do this; otherwise, do that. Let's see how this plays out.\n\n## If Statements\n\
    \nPretend for a moment that we're building an app that must output the century\
    \ a given year is in.\n\n### Example 2.17\n\n```\nvar year = 2011, msg = \"In\
    \ the \";\n\nif (year > 2000) {\n    msg += \"twenty-first century\";\n} else\
    \ {\n    msg += \"twentieth century\";\n}\n\nconsole.log(msg); // In the twenty-first\
    \ century\n```\n\nThis is an if-statement. We start with the keyword if. Then,\
    \ there's the condition inside parentheses. This is where true or false values\
    \ and operators that return Booleans come into play. They'll determine which statement\
    \ runs.\n\nWe haven't said much about statements yet. In an if-statement, the\
    \ statement consists of all the lines of code between the opening and closing\
    \ curly braces. In our example, that's only one line, which appends the century\
    \ name to the string msg. Then, notice another statement after that one: the else-statement.\
    \ This will only be executed if the condition before it evaluates to false.\n\n\
    But let's say we're doing something more than a true/false deal. It's not hard\
    \ to do more:\n\n### Example 2.18\n\n```\nvar year = 11, msg = \"In the \";\n\
    if (year > 2000) {\n    msg += \"twenty-first century\";\n} else if (year > 1900)\
    \ {\n    msg += \"twentieth century\";\n} else {\n    msg += \"very distant past.\"\
    ;\n}\n\nconsole.log(msg); // In the very distant past\n```\n\nAs you can see,\
    \ multiple if-statements are no big deal. In place of the else-statement, just\
    \ put another if-statement. Bump that if right up against the else, add a second\
    \ condition inside parentheses, and you're off. Of course, this could go on indefinitely;\
    \ there's no limit to the number of else if statements you can use.\n\n## Switch\
    \ Statements\n\nHowever, let's say we're checking something with several options,\
    \ like the size of coffee a customer wants. We'd have to do something like this:\n\
    \n### Example 2.19\n\n```\nvar order_size = \"medium\";\n\nif (order_size ===\
    \ \"small\") {\n    alert(\"small\");\n} else if (order_size === \"medium\") {\n\
    \    alert(\"medium\");\n} else if (order_size === \"large\") {\n    alert(\"\
    large\");\n} else if (order_size === \"extra large\") {\n    alert(\"extra large\"\
    );\n} else {\n    alert(\"something else?\");\n}\n```\n\nNow, I don't know about\
    \ you, but that last snippet seems like a lot of needless repetition to me. Here's\
    \ what you can do instead: use a switch statement.\n\n### Example 2.20\n\n```\n\
    var order_size = \"medium\";\n\nswitch (order_size) {\n    case \"small\":\n \
    \       alert(\"small\");\n        break;\n    case \"medium\":\n        alert(\"\
    medium\");\n        break;\n    case \"large\":\n        alert(\"large\");\n \
    \       break;\n    case \"extra large\":\n        alert(\"extra large\");\n \
    \       break;\n    default:\n        alert(\"something else?\");\n}\n```\n\n\
    Let me introduce you to the switch statement. It's the perfect substitute for\
    \ long-winded, nested if/else statements. With the switch statement, you only\
    \ write the expression to evaluate once; it goes in parentheses at the top, right\
    \ after the keyword `switch`. Then we open a set of curly braces.\n\nWe want to\
    \ do something based on the evaluation of that expression, so we have any number\
    \ of cases. The keyword **case** is followed by the value that we want the expression\
    \ to match. In this example, the expression `order_size` is compared to each of\
    \ the coffee sizes. The compared value is then followed by a colon. Next are the\
    \ lines of code that will be executed if the expression matches the case; if this\
    \ is only one line, feel free to put it on the same line as the **case \"value\"\
    :** part, if you like. It doesn't matter at all, because JavaScript doesn't care\
    \ about spacing. Don't forget to end your case block with the `break;` line. This\
    \ prevents our case statements from falling through; we'll see what this means\
    \ in a second.\n\nBut first, don't forget about the **default:** piece at the\
    \ end; yup, you guessed it: it's the equivalent of an `else`. It executed when\
    \ we don't match any of the cases.\n\nSo, back to falling through: if we didn't\
    \ include the `break;` statement, the code for any case statements under the one\
    \ we match will also be executed. Here's example 2.20, with the break statement\
    \ removed:\n\n### Example 2.21\n\n```\nvar order_size = \"medium\";\n\nswitch\
    \ (order_size) {\n    case \"small\":\n        alert(\"small\");\n    case \"\
    medium\":\n        alert(\"medium\");\n    case \"large\":\n        alert(\"large\"\
    );\n    case \"extra large\":\n        alert(\"extra large\");\n    default:\n\
    \        alert(\"something else?\");\n}\n```\n\nGo run this example file: you'll\
    \ get alerts for \"medium,\" \"large,\" \"extra large,\" and \"something else?\"\
    \ At first, this might not make sense; so look at it this way. We can have multiple\
    \ cases for each code block, meaning that if our condition is one of the cases,\
    \ the code will execute:\n\n### Example 2.22\n\n```\nvar order_size = \"medium\"\
    ;\n\nswitch (order_size) {\n    case \"small\":\n        alert(\"small\");\n \
    \       break;\n    case \"medium\":\n    case \"large\":\n    case \"extra large\"\
    :\n        alert(\"medium, large, or extra large\");\n        break;\n    default:\n\
    \        alert(\"something else?\");\n}\n```\n\nIf we now add some code for each\
    \ case statement (**without** any break statements), the same behaviour will take\
    \ place: the code under each case will run, but it will \"fall through\" to the\
    \ next case statement and execute the code there.\n\n## Conditional Operator (Ternary\
    \ Operator)\n\nThere's one more type of conditional statement. Let's say we wanted\
    \ to do something like this:\n\n```\nvar temp = 18, // degrees Celsius\n    msg;\n\
    \nif (temp > 10) {\n    msg = \"Today was warm\";\n} else {\n    msg = \"Today\
    \ was cold\";\n}\n```\n\nFor setting one variable, that seems like a lot of extra\
    \ code. Well, using the conditional operator, we can shorten it.\n\n### Example\
    \ 2.23\n\n```\nvar temp = 18,\n    msg = (temp > 10) ? \"Today was warm\" : \"\
    Today was cold\";\n\nalert(msg);\n```\n\nIt's pretty simple. In parentheses (and\
    \ really, the parentheses aren't required, but it improves readability), put your\
    \ conditional statement, followed by a question mark. Then, we have the\n\n> **ROCK*\
    \ TIP**\n\nYou may see the conditional operator called the \"ternary operator\"\
    ; \"ternary\" just means it takes three values, just like the unary operators\
    \ take only one. No one gets confused, though, because there's only one ternary\
    \ operator in JavaScript.\n\nvalue that's used if the condition is true. The value\
    \ that's returned if the condition is false comes next, after a colon. The conditional\
    \ operator is great for when your if statements have only two possible outcomes,\
    \ each of which can be coded in a single line.\n\n## Looping Statements\n\nNow\
    \ that we've got conditional statements down, we're ready to move on to loops.\
    \ Very often, you'll want to perform the same action several times, each time\
    \ on a different value. As you might guess, this often goes hand-in-hand with\
    \ arrays. Let's check out the looping constructs JavaScript gives us.\n\n## For\
    \ Loops\n\nThe for loop will often be the first tool you reach for when you need\
    \ to build a loop. Take a look at the syntax, and then we'll discuss it.\n\n**Example\
    \ 2.24**\n\n```\nvar names = [\"Ringo\", \"John\", \"Paul\", \"George\"];\n\n\
    for (var i = 0; i < names.length; i++) {\n    alert(\"Say hello to \" + names[i]);\n\
    }\n```\n\nWe begin our for loop with the keyword `for`; next we have three statements\
    \ in a set of parentheses. Notice how the statements are separated by semi-colons,\
    \ just like all good JavaScript statements. The first statement sets any variables\
    \ we need for the loop; in this case, we're setting only one variable: `i = 0`\
    \ (\"i\" is short for iterator or index). The second statement is an expression\
    \ that returns a Boolean value; this is evaluated before the loop is executed.\
    \ If it evaluates true, the loop will execute; if it evaluates false, the loop\
    \ will end. In our example, we check to see that i is less than the length of\
    \ the names array (more on the length property later). The final section performs\
    \ any action we want to be done after the loop executes; here, we're incrementing\
    \ i by one. Inside the loop, we can work with the values of the array by using\
    \ the square bracket notation, passing in an index number—this is where the variable\
    \ i comes in.\n\nNow, most of the loops you'll see (and probably write, too) will\
    \ be structured very similarly to this one, even though **all three statements\
    \ in the parentheses are optional**. However, make sure you really understand\
    \ why this thing works; if you understand what each of these pieces do, your for\
    \ loops will be more flexible. For example, who says we need to set the variables\
    \ inside the parentheses?\n\n```\nvar i = 0;\nfor ( ; i < names.length; i++) {\n\
    \    // whatever\n}\n```\n\nNotice that even though I've taken the variable declaration\
    \ outside the loop, we still need to put a semicolon after where the statement\
    \ would go.\n\nOn the other hand, why not set two variables in the first part,\
    \ and \"cache\" the value of names.length in the variable len, and use that in\
    \ the second statement (this really is faster if you're working with a large array).\n\
    \n```\nfor (var i = 0, len = names.length; i < len; i++) {\n    // whatever\n\
    }\n```\n\nNotice that I haven't separated the two variable declarations with a\
    \ semicolon; it has to be one statement, so we separate it with comma."
  mdcn: "\n## 条件语句\n\n我们刚刚学习的运算符中，有不少都用于判断某个条件是真是假。通常，这会成为后续操作的条件：如果某事为真，则执行此操作；否则，执行另一操作。让我们来看看这是如何运作的。\n\
    \n## If 语句\n\n假设我们正在开发一个需要输出给定年份所属世纪的应用程序。\n\n### 示例 2.17\n\n```\nvar year = 2011,\
    \ msg = \"In the \";\n\nif (year > 2000) {\n    msg += \"twenty-first century\"\
    ;\n} else {\n    msg += \"twentieth century\";\n}\n\nconsole.log(msg); // In the\
    \ twenty-first century\n```\n\n这是一个 if 语句。我们以关键字 **if** 开头，然后在括号内放置条件。此时，真/假值以及返回布尔值的运算符就派上用场了，它们将决定执行哪个语句。\n\
    \n我们还没有过多讨论语句。在 if 语句中，语句由花括号内所有代码行组成。在我们的示例中，只有一行代码，它将世纪名称追加到字符串 `msg` 上。然后，请注意其后的另一个语句：else\
    \ 语句。只有当它前面的条件求值为假时，else 语句才会被执行。\n\n但假设我们要处理的不只是非真即假的情况。要做到更多并不难：\n\n### 示例 2.18\n\
    \n```\nvar year = 11, msg = \"In the \";\nif (year > 2000) {\n    msg += \"twenty-first\
    \ century\";\n} else if (year > 1900) {\n    msg += \"twentieth century\";\n}\
    \ else {\n    msg += \"very distant past.\";\n}\n\nconsole.log(msg); // In the\
