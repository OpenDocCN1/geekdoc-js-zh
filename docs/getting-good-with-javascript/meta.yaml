  md: '# Numbers


    While some programming languages offer different types of numbers, JavaScript
    has only one. In most cases, you''ll simply type the number of your choice.


    ```

    10


    3.14159

    ```


    JavaScript makes no distinction (at least for you, the coder) between numbers
    with and without decimals. For extra large or extra small numbers, you can use
    scientific notation:


    # Example 2.3


    ```

    alert( 3.45e5 ); // 345000

    alert( 123e-3 ); // 0.123

    ```


    The first number above represents 3.45 x 10⁵, or 345,000. The second represents
    123 x 10⁻³, or 0.123. Be careful though: JavaScript doesn''t accept numbers with
    more than 17 decimal places. It will cut off any digits after that.


