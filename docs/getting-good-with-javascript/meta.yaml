    \ **Product**. Right now, you can see that the **name** property is right on the\
    \ object **ipad** and the **rating** property is being inherited from its prototype.\n\
    \n## Example 4.10\n\n```\n// ipad from above\n\nipad.rating = 4;\n\nipad.rating;\
    \ // 4\n\nProduct.prototype.rating; // 3\n```\n\nBy changing the rating, we're\
    \ actually adding a rating parameter to the **ipad** object. Since it has its\
    \ own property called **rating** now, when we ask for **ipad.rating**, it no longer\
    \ goes to the prototype... however, the prototype's value for **rating** hasn't\
    \ been changed.\n\n## Object Methods\n\nWe discussed methods for every type except\
    \ Objects at the end of the last chapter. This was for two reasons:\n\n- I wanted\
    \ to keep all object-related material together, right here.\n- Most of the methods\
    \ you'll use on objects will be ones you create yourself.\n\nHowever, there are\
    \ several useful methods that are built into objects. Since every object you create\
    \ is an Object (i.e., inherits from Object.prototype), these methods are stored\
    \ there.\n\n### hasOwnProperty\n\nWe talked about using a for-in loop to iterate\
    \ over arrays in the last chapter; you can use this on objects, too.\n\n#### Example\
    \ 4.11\n\n```\nfunction Person(name) {\n    this.name = name;\n}\nPerson.prototype.legs\
    \ = 2;\n\nvar person = new Person(\"Joe\"), prop;\n\nfor (prop in person) {\n\
    ```\n\n> This revelation might get you wondering where the methods for, say, strings,\
    \ are stored. Well, there is a String object, which has a prototype property.\
    \ That's where they are kept. Some string methods are also object methods; since\
    \ everything is an object—meaning that String inherits from Object.prototype,\
    \ too—String doesn't need to have its own versions of those methods, except when\
    \ they are different from the Object versions.\n\n## **ROCK* TIP\n\n## More Concepts\
    \ and Best Practices\n\n```\nconsole.log(prop + \": \" + person[prop]);\n}\n\n\
    // in console:\n// name : Joe\n// legs: 2\n```\n\nHowever, there's something to\
    \ be aware of here. If your object is inheriting from a prototype with properties,\
    \ those properties will be looped over as well. This might make for-in cough up\
    \ results you didn't want. In this case, objects have a handy method for determining\
    \ if a given property belongs to the object or its prototype: it's called hasOwnProperty:\n\
    \n## Example 4.12\n\n```\nfunction Person(name) {\n    this.name = name;\n}\n\
    Person.prototype.legs = 2;\n\nvar person = new Person(\"Joe\"), prop;\n\nfor (prop\
    \ in person) {\n    if (person.hasOwnProperty(prop)) {\n        console.log(prop\
    \ + \": \" + person[prop]);\n    }\n}\n\n// console:\n// name: Joe\n```\n\nIt's\
    \ a bit inefficient to have to write that inner if block every time you want to\
    \ loop over an object, but get used to it; it's a best practice.\n\n## toString\n\
    \nEvery object has a toString method. This method is called when the object is\
    \ to be printed out anywhere; it converts it to a string. The different built-in\
    \ types do different things: strings obviously don't change; numbers become strings\
    \ of numbers; dates become nicely formatted date strings. But what about general\
    \ objects?\n\n### Example 4.13\n\n```\nvar o = { name : \"Andrew\" };\nalert(\
    \ o.toString()); // \"[object Object]\"\n```\n\nThis is pretty useless, because\
    \ it tells you absolutely nothing about the object, other than that it is indeed\
    \ an object. Use this as a reminder to create a custom toString method if you'll\
    \ need it. You could do this:\n\n### Example 4.14\n\n```\nvar person = {\n   \
    \ name : \"Joe\",\n    age  : 30,\n    occupation: \"Web Developer\",\n    toString\
    \ : function () {\n        return this.name + \" | \" + this.occupation;\n   \
    \ }\n};\n\nalert( person.toString() ); // \"Joe | Web Developer\"\n```\n\nUsually,\
    \ you won't be calling the toString method yourself; the JavaScript engine will\
    \ call it for you when you try to use the object (built-in type or not) where\
    \ you would use a string.\n\n## valueOf\n\nThis method returns a primitive value\
    \ that would represent your object. For example:\n\n### **Example 4.15**\n\n```\n\
    var account = {\n    holder : \"Andrew\",\n    balance : 100,\n    valueOf : function\
    \ () {\n        return this.balance;\n    }\n};\n\nalert( account + 10 ); // 110\n\
    ```\n\nAs you can see, when we try to add 10 to **account**, we get 110, even\
    \ though account is an object. Obviously, we can't assign to objects like this,\
    \ but it works for this kind of thing. This method is like **toString**, in that\
    \ you don't usually call it yourself.\n\nYou might be wondering when the JavaScript\
    \ engine decides to use **toString** and when to use **valueOf**. That's a bit\
    \ complicated for this beginner's book; this StackOverflow thread⁵ might be of\
    \ help.\n\nThat's it; as you can see there really isn't much in the way of object\
    \ methods.\n\n> ⁵ http://stackoverflow.com/questions/2485632/valueof-vs-tostring-in-javascript\n\
    \n## Closure\n\nClosure is one of the most important features of JavaScript. If\
    \ you're familiar with other programming languages (specifically object-oriented\
    \ ones) you might know about private variables. A private variable is a variable\
    \ that is accessible to the methods of an object, but isn't accessible from outside\
    \ the object. JavaScript doesn't have this, but we can use closure to \"make\"\
    \ private variables. This is just one way of putting closure to work for you.\
    \ But enough about why it's useful; let's see how to implement it!\n\nBefore we\
    \ begin, remember two important points about JavaScript that contribute to closure:\n\
    \n- Everything is an object, even functions. This means we can return a function\
    \ from a function.\n- Anonymous, self-invoking functions are nameless functions\
    \ that run immediately and usually only run once.\n\nNow, let's use these two\
    \ ideas to create a closure. First, let's look at some \"normal\" JavaScript code:\n\
    \n```\nvar secretNumber = 1024;\n\nfunction revealSecret(password) {\n    if (password\
    \ === \"please\") {\n        return secretNumber++;\n    }\n    return 0;\n}\n\
    ```\n\nThis should be old hat to you now. We have a variable called **secretNumber**\
    \ and a function that returns that number if the password is correct. The post-increment\
    \ operator adds one to **secretNumber** after we have used it (in this case that\
    \ means after we have returned it); this way, we get a unique number each time\
    \ we call the function. If the password is wrong, we get 0.\n\nHowever, there's\
    \ an obvious problem there: there's nothing secret at all about secretNumber;\
    \ it's a global variable that everyone has access to. To fix that, why don't we\
    \ just put it inside the function? Then, we won't be able to view or change it\
    \ from outside the function.\n\nHold on, though; we can't do that either. If we\
    \ do, each time we call the function, it will reset secretNumber to 1024. What\
    \ to do? Closure to the rescue! Examine the following:\n\n### Example 4.16\n\n\
    ```\nvar revealSecret = (function () {\n    var secretNumber = 1024;\n\n    return\
    \ function (password) {\n        if (password === \"please\") {\n            return\
    \ secretNumber++;\n        }\n        return 0;\n    };\n})();\n\nalert( revealSecret(\"\
    please\") ); // 1024\n\nalert( revealSecret(\"please\") ); // 1025\n```\n\nNotice\
    \ that revealSecret is being assigned to the return value of the anonymous self-invoking\
    \ function. Since that function runs right away, revealSecret will be whatever\
    \ is returned. In this case, that's a function. Now, here's the impressive part.\
    \ Notice that the internal function (the one being returned) references the secretNumber\
    \ variable from its \"parent\" function's scope. Even after the anonymous function\
    \ has returned, the inner function will still have access to this variable. That's\
    \ closure: an inner function having access to the scope of its parent function,\
    \ even after the parent function has returned. This way, **secretNumber** is set\
    \ only once, it can safely be incremented each time it's used, and no one can\
    \ get to it, because it's protected by the scope of the anonymous function. Putting\
    \ it another way, closure is the concept of exposing limited control of a function's\
    \ scope outside the function.\n\nAnother place where this is useful is in creating\
    \ modules. Check this out:\n\n```\nvar a_module = (function () {\n    var private_variable\
    \ = \"some value\";\n\n    function private_function () {\n        // some code;\n\
    \    }\n\n    return {\n        public_property : \"something\"\n        // etc\
    \ : \" ... \"\n    };\n})();\n```\n\nThis is the module pattern: inside an anonymous\
    \ self-invoking function, we create variable and methods that we don't have available\
    \ from the outside. Then, we return an object with public properties and methods\
    \ that use these private variable and methods. This way, the \"guts\" that shouldn't\
    \ be exposed aren't. If you want to read more about the module pattern, check\
    \ out this post of the YUI Blog⁶.\n\n⁶ http://www.yuiblog.com/blog/2007/06/12/module-pattern/"
  mdcn: "\n ## 示例 4.9\n\n```\nfunction Product(name) {\n    if (name) {\n        this.name\
    \ = name;\n    }\n}\nProduct.prototype.name = \"To be announced\";\nProduct.prototype.rating\
    \ = 3;\n\nvar ipad = new Product(\"iPad\");\n\nalert( ipad.name ); // \"iPad\"\
    \nalert( ipad.rating ); // 3\n```\n\n在这里，我们创建了一个简单的 **Product**。现在，你可以看到 **name**\
    \ 属性直接在 **ipad** 对象上，而 **rating** 属性则是从其原型继承而来的。\n\n## 示例 4.10\n\n```\n// 沿用上面的\
    \ ipad\n\nipad.rating = 4;\n\nipad.rating; // 4\n\nProduct.prototype.rating; //\
    \ 3\n```\n\n通过修改 rating，我们实际上是在 **ipad** 对象上添加了一个 rating 参数。由于它现在有了自己的 **rating**\
    \ 属性，当我们请求 **ipad.rating** 时，它不再去原型查找……然而，原型中 **rating** 的值并未被改变。\n\n## 对象方法\n\
    \n我们在上一章末尾讨论了除对象以外每一种类型的方法。这有两个原因：\n\n- 我想把所有与对象相关的材料放在一起，就在这里。\n- 你在对象上使用的大多数方法将是你自己创建的。\n\
    \n然而，有一些内置在对象中的有用方法。由于你创建的每个对象都是一个 Object（即从 Object.prototype 继承），这些方法都存储在那里。\n\
    \n### hasOwnProperty\n\n我们在上一章讨论了使用 for-in 循环来遍历数组；你也可以将其用于对象。\n\n#### 示例 4.11\n\
    \n```\nfunction Person(name) {\n    this.name = name;\n}\nPerson.prototype.legs\
    \ = 2;\n\nvar person = new Person(\"Joe\"), prop;\n\nfor (prop in person) {\n\
    ```\n\n> 这个发现可能会让你想知道，例如，字符串的方法存储在哪里。嗯，有一个 String 对象，它有一个 prototype 属性。那就是它们存放的地方。一些字符串方法也是对象方法；由于一切都是对象——意味着\
    \ String 也从 Object.prototype 继承——String 不需要拥有自己版本的那些方法，除非它们与 Object 版本不同。\n\n\
    ## **ROCK* 提示\n\n## 更多概念和最佳实践\n\n```\nconsole.log(prop + \": \" + person[prop]);\n\
    }\n\n// 在控制台中：\n// name : Joe\n// legs: 2\n```\n\n然而，这里有一些需要注意的地方。如果你的对象从一个带有属性的原型继承，那些属性也会被遍历到。这可能会让\
    \ for-in 吐出你不想要的结果。在这种情况下，对象有一个便捷的方法来判断给定属性是属于对象本身还是其原型：它叫做 hasOwnProperty：\n\n\
    ## 示例 4.12\n\n```\nfunction Person(name) {\n    this.name = name;\n}\nPerson.prototype.legs\
    \ = 2;\n\nvar person = new Person(\"Joe\"), prop;\n\nfor (prop in person) {\n\
    \    if (person.hasOwnProperty(prop)) {\n        console.log(prop + \": \" + person[prop]);\n\
    \    }\n}\n\n// 控制台：\n// name: Joe\n```\n\n每次想要遍历对象时都要写那个内部 if 块有点低效，但请习惯它；这是最佳实践。\n\
    \n## toString\n\n每个对象都有一个 toString 方法。当对象要在任何地方打印输出时，这个方法会被调用；它会将对象转换为字符串。不同的内置类型有不同的处理方式：字符串显然不会改变；数字变成数字字符串；日期变成格式良好的日期字符串。但一般对象呢？\n\
    \n### 示例 4.13\n\n```\nvar o = { name : \"Andrew\" };\nalert( o.toString()); //\
    \ \"[object Object]\"\n```\n\n这相当没用，因为它除了告诉你它确实是一个对象之外，关于该对象 absolutely 没有任何信息。把这当作一个提醒，如果你需要的话，要创建一个自定义的\
    \ toString 方法。你可以这样做：\n\n### 示例 4.14\n\n```\nvar person = {\n    name : \"Joe\"\
    ,\n    age  : 30,\n    occupation: \"Web Developer\",\n    toString : function\
    \ () {\n        return this.name + \" | \" + this.occupation;\n    }\n};\n\nalert(\
    \ person.toString() ); // \"Joe | Web Developer\"\n```\n\n通常，你不会自己调用 toString\
    \ 方法；当你试图在需要字符串的地方使用对象（内置类型或不是）时，JavaScript 引擎会为你调用它。\n\n## valueOf\n\n这个方法返回一个原始值，用来代表你的对象。例如：\n\
    \n### **示例 4.15**\n\n```\nvar account = {\n    holder : \"Andrew\",\n    balance\
    \ : 100,\n    valueOf : function () {\n        return this.balance;\n    }\n};\n\
    \nalert( account + 10 ); // 110\n```\n\n如你所见，当我们试图给 **account** 加上 10 时，我们得到 110，尽管\
    \ account 是一个对象。显然，我们不能像这样给对象赋值，但对于这种事情它是有效的。这个方法就像 **toString**，你通常不会自己调用它。\n\
    \n你可能想知道 JavaScript 引擎何时决定使用 **toString** 以及何时使用 **valueOf**。这对于这本入门书籍来说有点复杂；这个\
    \ StackOverflow 线程⁵ 可能会有所帮助。\n\n就这些；如你所见，对象方法其实并不多。\n\n> ⁵ http://stackoverflow.com/questions/2485632/valueof-vs-tostring-in-javascript\n\
    \n## 闭包\n\n闭包是 JavaScript 最重要的特性之一。如果你熟悉其他编程语言（特别是面向对象的），你可能知道私有变量。私有变量是一种可以被对象的方法访问，但不能从对象外部访问的变量。JavaScript\
    \ 没有这个功能，但我们可以使用闭包来\"制造\"私有变量。这只是利用闭包为你工作的一种方式。但别再说它为什么有用了；让我们看看如何实现它！\n\n在我们开始之前，记住关于\
    \ JavaScript 的两点对闭包有贡献的重要事项：\n\n- 一切都是对象，即使是函数。这意味着我们可以从函数中返回一个函数。\n- 匿名自执行函数是没有名字的函数，它们立即运行，通常只运行一次。\n\
    \n现在，让我们用这两个想法来创建一个闭包。首先，让我们看看一些\"普通\"的 JavaScript 代码：\n\n```\nvar secretNumber\
    \ = 1024;\n\nfunction revealSecret(password) {\n    if (password === \"please\"\
    ) {\n        return secretNumber++;\n    }\n    return 0;\n}\n```\n\n这对你来说现在应该是老生常谈了。我们有一个叫做\
    \ **secretNumber** 的变量和一个函数，如果密码正确就返回那个数字。后置递增运算符在我们使用它之后给 **secretNumber** 加一（在这种情况下，这意味着在我们返回它之后）；这样，每次调用函数时我们得到一个唯一的数字。如果密码错误，我们得到\
    \ 0。\n\n然而，这里有一个明显的问题：**secretNumber** 根本没有任何秘密可言；它是一个所有人都能访问的全局变量。要解决这个问题，我们为什么不把它放在函数内部呢？这样，我们就无法从函数外部查看或修改它了。\n\
    \n等等，不过；我们也不能那样做。如果我们那样做，每次调用函数时，它都会将 secretNumber 重置为 1024。怎么办呢？闭包来救援！检查以下内容：\n\
    \n### 示例 4.16\n\n```\nvar revealSecret = (function () {\n    var secretNumber\
    \ = 1024;\n\n    return function (password) {\n        if (password === \"please\"\
    ) {\n            return secretNumber++;\n        }\n        return 0;\n    };\n\
    })();\n\nalert( revealSecret(\"please\") ); // 1024\n\nalert( revealSecret(\"\
    please\") ); // 1025\n```\n\n注意 revealSecret 被赋值为匿名自执行函数的返回值。由于那个函数立即运行，revealSecret\
    \ 将是被返回的内容。在这种情况下，那是一个函数。现在，这是令人印象深刻的部分。注意内部函数（被返回的那个）引用了其\"父\"函数作用域中的 secretNumber\
    \ 变量。即使匿名函数已经返回，内部函数仍然可以访问这个变量。这就是闭包：一个内部函数可以访问其父函数的作用域，即使父函数已经返回。这样，**secretNumber**\
    \ 只被设置一次，每次使用时可以安全地递增，而且没有人能够访问它，因为它受到匿名函数作用域的保护。换句话说，闭包是在函数外部暴露对函数作用域的有限控制的概念。\n\
    \n另一个有用的地方是在创建模块时。看看这个：\n\n```\nvar a_module = (function () {\n    var private_variable\
    \ = \"some value\";\n\n    function private_function () {\n        // some code;\n\
    \    }\n\n    return {\n        public_property : \"something\"\n        // etc\
    \ : \" ... \"\n    };\n})();\n```\n\n这就是模块模式：在匿名自执行函数内部，我们创建从外部不可用的变量和方法。然后，我们返回一个带有公共属性和方法的对象，这些公共属性和方法使用这些私有变量和方法。这样，不应该暴露的\"\
    内部构造\"就不会暴露。如果你想了解更多关于模块模式的信息，请查看 YUI 博客的这篇文章⁶。\n\n⁶ http://www.yuiblog.com/blog/2007/06/12/module-pattern/\n"
