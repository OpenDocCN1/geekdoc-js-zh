    \ 9\n\nSo, to find that h2, we just have to get the first child of the div node;\
    \ then, we check the nodeType property of that node. If it's not 1, we get the\
    \ next sibling node and check that. Here's the code for that:\n\n# ### Example\
    \ 5.4\n\n```\nvar products = document.getElementsByClassName(\"product\"),\n \
    \   i = 0,\n    child;\n\nfor ( ; i< products.length; i++) {\n    child = products[i].firstChild;\n\
    \    while (child.nodeType !== 1) {\n        child = child.nextSibling;\n    }\n\
    \    console.log(child);\n}\n```\n\nWe start by getting all the elements with\
    \ that class \"product\"; remember, since we've getting more than one element,\
    \ this returns an array (Well, it's not really an array; it's a NodeList, which\
    \ can be iterated over like an array, as we see here). For each node in our list,\
    \ we get the first child via the firstChild property and assign it to the variable\
    \ child. Then, we're using a while loop to find the first node with a nodeType\
    \ of 1 (meaning an HTML element). Our condition says \"while the node type of\
    \ child node is not 1\"; this means that if the firstChild is an element, the\
    \ loop won't run. If it's not, we'll run the loop, which simply reassigns the\
    \ child variable to child.nextSibling (the next sibling of child). When we find\
    \ the first element in the list of children, we can do what we"
  merge: -1
