  md: "# More Basics\n\nSo, what do we do to convert this code to a function? Well,\
    \ first, let's meet the function shell:\n\n```\nfunction getGreeting () {\n  \
    \  // code goes here\n}\n```\n\nStart with the keyword **function**; then, write\
    \ the name of the function; it can be whatever you want, as long as it follows\
    \ the rules for variable names (i.e. alphanumeric characters, underscore, and\
    \ dollar sign, but not starting with a number). Next, parentheses. Then, the lines\
    \ of code go between curly braces.\n\nNow, you might be tempted to throw all the\
    \ code we wrote above into a function shell. This isn't wise for two reasons.\
    \ Firstly, there would be no way to get to the variable **message** (more on *function\
    \ scope* soon). Secondly, with a bit of customization, we can increase the usefulness\
    \ of the function by tweaking it a bit.\n\nLet's make our function accept a parameter.\
    \ A parameter is a value that you hand to the function when you ask the function\
    \ to run. The function can then use the parameters however it needs to. How does\
    \ this work syntactically?\n\n```\nfunction getGreeting (hour) {\n    //code here\n\
    }\n```\n\nHere, our **getGreeting** function accepts one parameter, which we're\
    \ calling **hour**. Parameters are like variable that you can only access from\
    \ within the function. To invoke this function and give it an hour, we would do\
    \ this:\n\n```\ngetGreeting( 10 );\n```"
