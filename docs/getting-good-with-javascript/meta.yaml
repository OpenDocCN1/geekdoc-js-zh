    I know I already said it, but it’s important that you understand it: variables
    are just labels for values. This means they are interchangeable for the most part.


    With that out of the way, let’s look at the types of data we have in JavaScript.


    # Types


    The first step in learning JavaScript (after we know what a variable is) is to
    understand two things:


    +   * What basic data types are available, and what they can do

    * How the language is actually written (the syntax)'
  - '[PAGE 20]


    # ## String


    A string is simply the way to handle any kind of text in JavaScript. Whenever
    you''re working with text, you''ll be using a string. A string of text must be
    surrounded by either double or single quotes; there''s no difference. Here are
    some examples:


    ```

    "Here is some text"

    ```


    ```

    ''This text is surrounded by single quotes''

    ```


    If you want to include a quote character inside your string, then you''ll have
    to escape it. To escape a character inside a string means to precede the character
    with a backslash. This basically tells the JavaScript interpreter that the character
    after the slash shouldn''t be interpreted normally; it''s something special. In
    this case, the normal interpretation of a quote is to close the string.


    # ### Example 2.2


    ```

    alert("John says \"What are you doing?\"");

    // John says "What are you doing?"

    alert(''"Let\''s go out for lunch."'');

    // "Let''s go out for lunch."

    ```


    Notice how, in that last string, I don''t have to escape the double quotes, because
    the string is delimited by single quotes. You only have to escape the quote-type
    that holds your string.'
  - '[PAGE 21]


    # Numbers


    While some programming languages offer different types of numbers, JavaScript
    has only one. In most cases, you''ll simply type the number of your choice.


    ```

    10


    3.14159

    ```


    JavaScript makes no distinction (at least for you, the coder) between numbers
    with and without decimals. For extra large or extra small numbers, you can use
    scientific notation:


    # Example 2.3


    ```

    alert( 3.45e5 ); // 345000

    alert( 123e-3 ); // 0.123

    ```


    The first number above represents 3.45 x 10⁵, or 345,000. The second represents
    123 x 10⁻³, or 0.123. Be careful though: JavaScript doesn''t accept numbers with
    more than 17 decimal places. It will cut off any digits after that.


    *Highlighted is incorrect it is missing a group of ( ). As it is equals 3.


