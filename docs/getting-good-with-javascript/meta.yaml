  md: "# Traversing the DOM\n\nMost often, you'll get your elements via one of the\
    \ above functions, do what you want to do to then and move on. However, occasionally\
    \ you'll want to get a node and work with other nodes close to it. For example,\
    \ You might have something like this:\n\n```\n<div class=\"product\">\n    <h2>\
    \ Product Name </h2>\n    <img src=\"pic.jpg\" />\n    <p> Description </p>\n\
    </div>\n```\n\nYou'll have, say, a dozen or so of these on a given page. Let's\
    \ say you want to sort the products alphabetically by name. To do this, you'll\
    \ need to get the h2 elements. However you'll also have other h2s on the page.\
    \ This means you need to get all the divs with a class \"product,\" and then find\
    \ the h2 within each. This requires some DOM traversal skills.\n\nBefore we continue\
    \ with our scenario, let's go back to that idea of a node tree. Trees are actually\
    \ a very important part of computer science. You know that for a tree to be a\
    \ tree, there have to be links between parent nodes and child nodes; these are\
    \ one-way links. It's inefficient to have a link from the parent node to every\
    \ child node; so instead, trees have a link from every parent node to its first\
    \ child node. Then, every child node has a link to its next sibling.\n\nThe DOM\
    \ works exactly this way: every node has a link to its first child and its next\
    \ sibling; it also has a link to its parent node. That means our HTML snippet\
    \ above looks like this:"
  merge: -1
  pgno: 125
- img_proc: true
  md: '![](img/b2872544db3ac2167aea931a76af3eea_126_0.png)


    Now let''s move back to our scenario. With the theory we''ve just learned, we
    can see that what we need to do is find all the elements with the class "product"
    and then find the h2 within it. You might think the h2 would be the first child,
    but it actually isn''t (for the sake of simplicity I intentionally drew the chart
    incorrectly). This is because any whitespace between the opening div tag and the
    opening h2 tag is captured in a text node. Then, if there are any HTML comments
    between those two opening tags they get put in a comment node. So there could
    possibly be many nodes to jump over before we get to the h2. What''s a developer
    to do?


    Thankfully, each of these different types of nodes has a property called nodeType;
    they are as follows:


    +   - HTML elements = 1

    - HTML element attributes = 2

    - Text nodes = 3'
