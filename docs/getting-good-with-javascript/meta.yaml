  md: "# More Concepts and Best Practices\n\n```\nvar basic_vehicle = { year : 2011\
    \ },\n    user_input = \"Speedio 18\";\n\nTruck.apply(basic_vehicle, user_input.split(\"\
    \ \"));\n\nconsole.log(basic_vehicle);\n```\n\nThis is a great place to use apply.\
    \ We call split on that input string and split it on a single space character;\
    \ this returns an array that would look like this: `[\"Speedio\", \"18\"]`. If\
    \ we were going to use `Truck.call` here, we would cache that array in a variable\
    \ and pass its elements individually. like this:\n\n```\nvar user_array = user_input.split(\"\
    \");\n\nTruck.call(basic_vehicle, user_array[0], user_array[1]);\n```\n\nObviously,\
    \ this is more work; so we can just pass that array to apply, and it will assign\
    \ the elements of the array to the parameters of the function we're applying it\
    \ to in order.\n\nIf you're like me, and have a hard time remembering whether\
    \ it's call or apply that takes the array, then notice that **array** and **apply**\
    \ both start with a (and end with \"y\", and have a double consonant, if that's\
