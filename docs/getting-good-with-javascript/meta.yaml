- img_proc: true
  md: '# 10 Getting Started


    The second way to get JavaScript onto your page is to link to a .js file:


    ```

    <script src="somefile.js"></script>

    ```


    Yes: unfortunately that closing script tag is required, even though you don’t
    put anything inside it. As you might guess, the **src** attribute is short for
    “source.” This will download the JavaScript file and process it, just like the
    inline code.


    Two more notes about including scripts:


    +   * For the most part, you’ll want to include your **script** tags right before
    your closing body tag. Actually, you can put them anywhere you want, but it’s
    best for performance reasons to put it at the end of the body...or write your
    code to wait until the page has completed loading before it begins executing.
    We’ll see how to do this later on (and no, you can’t jump ahead to “Another Short
    Rabbit-Trail on Script Loading” on page 140).

    * You might see code in which the **script** tags have this attribute: **type="text/javascript"**.
    This used to be required, but isn’t in HTML5 (or course, you should then be using
    an HTML5 doctype).


