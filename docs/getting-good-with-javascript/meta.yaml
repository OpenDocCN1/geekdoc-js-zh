  md: "# toString\n\nEvery object has a toString method. This method is called when\
    \ the object is to be printed out anywhere; it converts it to a string. The different\
    \ built-in types do different things: strings obviously don't change; numbers\
    \ become strings of numbers; dates become nicely formatted date strings. But what\
    \ about general objects?\n\n# Example 4.13\n\n```\nvar o = { name : \"Andrew\"\
    \ };\nalert( o.toString()); // \"[object Object]\"\n```\n\nThis is pretty useless,\
    \ because it tells you absolutely nothing about the object, other than that it\
    \ is indeed an object. Use this as a reminder to create a custom toString method\
