  md: "# More Concepts and Best Practices\n\nThe only reason for these functions to\
    \ exist is to change the value of this within the function. Let's see how to do\
    \ it.\n\n# Example 4.5\n\n```\nfunction Truck (model, num_of_tires) {\n    this.num_of_tires\
    \ = num_of_tires;\n    this.kilometers = 0;\n    this.model = model;\n}\n\nvar\
    \ basic_vehicle = { year : 2011 };\n\nTruck.call(basic_vehicle, \"Speedio\", 4);\n\
    \nconsole.log(basic_vehicle);\n```\n\n# ROCK*\nTIP\n\nAn aside on primitive vs.\
    \ reference values: You might think that, although we're modifying an existing\
    \ object, we will lose those changes unless we assign them to a new variable,\
    \ or back to basic_vehicle. That would be the case if our variable was a primitive\
    \ value. However, objects (and arrays) are reference values: values passed by\
    \ reference. A primitive value (such as a string or number) is stored in a spot\
    \ in your computer's RAM, and we keep track of it with a variable. When we pass\
    \ that variable to a function, we copy that value to a new spot in memory, point\
    \ the parameter name to that spot, and work with that inside the function, so\
    \ that the original is unharmed. It's different with reference values: when we\
    \ pass an object or array to a function, the parameter points to the very same\
    \ spot in memory as the original variable. This means that the this inside Truck.call(basic_vehicle)\
    \ is the very same basic_object we have outside the function. So there's no need\
    \ to assign anything, because basic_vehicle now has the properties assigned by\
    \ Truck. What would happen if we assigned the returned value of Truck.call(basic_vehicle)\
    \ to a variable? It would be undefined, because Truck without new doesn't return\
    \ anything."
  merge: -1
  pgno: 82
