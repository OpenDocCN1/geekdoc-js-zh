    find it there, it would continue up the *prototype chain*. In this case, the next
    step up is `Object.prototype`, which is the top of everything in JavaScript.


    I want to make sure you understand what is really going on here. There are two
    main parts to creating an object with a constructor function and the keyword **new**:


    +   1. The constructor function creates an object (denoted by `this` inside the
    function); within the function, we are assigning the values of properties of the
    object.

    2. The prototype, or parent object, of every object made with a given constructor
    function is stored at `ConstructorFunction.prototype`. All the methods and properties
    of this object are accessible from the "children" objects.


    This is why it''s called "Prototypal Inheritance"; each object inherits from the
    same prototype. It''s important to note that if a given child object has a given
    property of its own—say, `my_obj.name`—the prototype won''t be checked for the
    property. Also, note that when you change a property or method from an object,
    you''re changing the property on that object, not the prototype object.


