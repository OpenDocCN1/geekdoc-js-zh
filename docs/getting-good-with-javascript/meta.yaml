    ## 修改 DOM 元素\n\n既然你已经熟悉了创建、添加和删除 DOM 节点，那么我们来谈谈修改节点。毕竟，你可以对单个节点执行三种主要操作：\n\n-\
    \ 你可以更改属性。\n- 你可以更改样式。\n- 你可以添加和移除事件处理程序。\n\n让我们从属性开始。如果你不确定我在说什么，看看这个：\n\n```\n\
    <div id=\"content\" class=\"wide\"></div>\n<input type=\"text\" name=\"first_name\"\
    \ value=\"Bob\" />\n<span class=\"warning\"></span>\n```\n\n属性就是 HTML 元素中 key=\"\
    value\" 的部分。这里，我使用了 id、class、type、name 和 value，但还有更多属性。\n\n处理属性有几种方法，但我只向你展示最好、最跨浏览器的方式。那就是使用\
    \ **setAttribute** 和 **getAttribute** 方法。它们的工作方式如下：\n\n## 示例 5.11\n\n```\n// <div\
    \ id=\"container\"></div>\n\nvar elem = document.getElementById(\"container\"\
    );\n\nelem.setAttribute(\"class\", \"modal\");\nalert( elem.getAttribute(\"class\"\
    ) ); // \"modal\"\n```\n\n如你所见，我们向第一个方法传递了两个参数：要设置的属性名称，以及属性的值。获取属性时，我们只需要将属性名传递给\
    \ **getAttribute** 方法即可。显然，这些都是元素节点的方法。\n\n这应该适用于你想在元素上设置的任何属性——甚至是新的 HTML5 data-*\
    \ 属性。然而，对于某些常见属性，有更简单的方式来设置和获取。\n\n如果你要处理 id 或 class，你可以直接这样做：\n\n```\nelem.id\
    \ = \"content\";\n\nelem.id; // \"content\"\n\nelem.className = \"module\";\n\n\
    elem.className; // \"module\";\n```\n\n这种简写符号是为元素设置样式的首选方式。看这个：\n\n## 操作 HTML\n\
    \n**示例 5.12**\n\n```\n// <div id=\"container\">container</div>\n\nvar elem = document.getElementById(\"\
    container\");\n\nelem.style.border = \"1px solid red\";\nelem.style.backgroundColor\
    \ = \"green\";\n```\n\n没错；这些都是你已经熟悉和喜爱的 CSS 属性，就在你的 JavaScript 中。关键要注意的是：JavaScript\
    \ 属性名称不能像 CSS 中那样包含连字符。因此，请对这些属性使用 *camelCase*，将每个连字符后的字母大写并移除连字符。这样，`border-bottom-width`\
    \ 就变成了 `borderBottomWidth`，以此类推。\n\n另一件重要的事情是：所有样式属性都是字符串；仔细想想，这很合理，因为即使是 `borderBottomWidth`\
    \ 这样的数值也需要后缀单位（px）。所以，这里全部都是字符串。\n\n还有一件事：当你使用 `element.style` 时，你是在操作元素的内联 `style`\
    \ 属性。当你设置一个样式属性时，它会被添加到 `style` 属性中。这 logically 意味着你无法获取不在内联 `style` 属性中的样式（无论是硬编码在\
    \ HTML 中，还是之前在 JavaScript 中设置的）。\n\n## 事件\n\n虽然事件可以被视为修改 DOM 元素的一部分，但它们值得单独用一节来介绍。但首先，什么是事件？\n\
    \n简单地说，事件就是发生在 DOM 元素上的事情。一些例子可能如下：\n\n- 页面**已加载**。\n- 元素被**点击**。\n- 鼠标**移过**某个元素。\n\
    \n当类似这样的事情发生时，你可能经常想要做些事情。例如，页面加载时运行这个脚本。或者，当元素被点击时执行这个函数。\n\n那么，到底有哪些事件呢？嗯，你可以在\
    \ Wikipedia^15^ 上找到一个完整的列表，但你最常用的会是这些：\n\n- click\n- mouseover\n- mouseout\n-\
    \ keypress\n- load\n- submit\n\n如你所见，事件分为两类：网站用户执行的操作，以及浏览器执行的操作。在上面的列表中，用户执行\
    \ click、mouseover、mouseout 和 keypress 事件。浏览器在页面完成加载时触发 load 事件，在用户点击提交按钮时触发 submit\
    \ 事件（所以它几乎算是用户执行的事件）。\n\n> ^15^ http://en.wikipedia.org/wiki/DOM_events#Common.2FW3C_events\n\
    \n## 添加事件处理程序\n\n事件在特定的 DOM 元素上触发。这意味着我们可以给特定元素绑定一个*事件处理程序*（或事件监听器）。事件处理程序是一个函数，当给定事件触发时将被执行。让我们看一个例子：\n\
    \n## 示例 5.13\n\n```\n// <div id=\"some_button\"> Click Me! </div>\nvar btn = document.getElementById(\"\
    some_button\");\n\nfunction welcome_user(evt) {\n    alert(\"Hello there!\");\n\
    }\n\nbtn.addEventListener(\"click\", welcome_user, false);\n```\n\n（注意：你需要在 Internet\
    \ Explorer 以外的浏览器中运行这个示例；我们很快就会解决这个问题。）\n\n这里发生了什么？嗯，第一部分是你正在熟悉的内容：获取一个元素并创建一个函数。接下来，我们调用元素的\
    \ addEventListener 方法。你可能猜到了事件监听器的作用：它\"监听\"某个事件，并在该事件发生时执行一个函数。addEventListener\
    \ 接受三个参数。第一个是我们正在监听的事件类型；在这个例子中，是 click 事件。上面示例列表中的事件都是有效的，你可以在 Wikipedia 页面上找到其余的事件。\n\
    \n下一个参数是事件触发时要运行的函数。在这个例子中，我们传入的是 `welcome_user` 函数。如果需要的话，我们也可以传入一个匿名函数。最后一个参数决定是使用捕获还是冒泡。这需要简短地讲解一下捕获和冒泡的区别。\n\
    \n首先，注意 Internet Explorer 8 及以下版本仅支持冒泡（IE9 及以上版本支持捕获和冒泡），所以你 99% 的时间可能都会使用冒泡。现在，看看这段\
    \ HTML：\n\n```\n<div>\n    <span> Click Here! </span>\n</div>\n```\n\n假设我点击了 **span**。因为\
    \ **span** 在 **div** 内部，所以当 **span** 被点击时，**div** 也被点击了。所以两个元素都会触发 click 事件。如果两者都有事件处理程序来利用该事件，哪一个应该先执行呢？这就是捕获和冒泡的背景。DOM\
    \ 标准规定事件应该先捕获，后冒泡。*捕获*阶段是指事件从最高元素开始向下传递。在这种情况下，**div** 的 click 处理程序会先触发。一旦事件到达底部——或最内层元素——它就开始冒泡。*冒泡*阶段将事件从底部带回顶部，逐个元素传递。要区分哪个是哪个，记住气泡是向上浮的，就像冒泡阶段的事件一样。\n\
    \n那么，回到 `addEventListener`。最后一个参数是是否在捕获阶段处理事件。因为 IE（9 之前版本）不支持捕获，所以通常是 `false`（即冒泡）。\n\
    \n但 IE 不支持的可不止是捕获。在版本 9 之前，IE 有自己的事件模型（该模型在 IE 9 中仍然受支持，但它也支持标准模型）。让我们来看看。\n\n\
    其实非常简单：\n\n## 示例 5.14\n\n```\n// <div id=\"some_button\"> Click Me! </div>\nvar\
    \ btn = document.getElementById(\"some_button\");\n\nfunction welcome_user(evt)\
    \ {\n    alert(\"Hello there!\");\n}\n\nbtn.attachEvent(\"onclick\", welcome_user);\n\
    ```\n\n不是用 **addEventListener**，而是使用 **attachEvent** 方法。你会发现没有第三个参数（因为它只支持冒泡）。另一个区别是事件名称必须加前缀\
    \ \"on\"。除此之外，没有太大区别。\n\n## 移除事件处理程序\n\n如果你想要添加事件监听器，最终你可能也会想要移除它们。方法如下：\n\n```\n\
    // 假设我们上面绑定了事件\n\nbtn.removeEventListener(\"click\", welcome_user, false);\n```\n\
    \n该方法是 **removeEventListener**。重要的一点是，三个参数都与 **addEventListener** 的参数相同；这样你才能定位到要移除的特定事件。\n\
    \n要用 IE 事件模型移除事件，试试这个：\n\n```\n// 假设我们上面绑定了事件\n\nbtn.detachEvent(\"onclick\",\
    \ welcome_user);\n```\n"
