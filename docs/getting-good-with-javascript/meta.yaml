    \ // in MBs\n}\n```\n\n这是一个普通的函数，如果我们调用 `new Computer(\"MacBook\", 2, 250000 )`，它会创建一个对象。注意这不是所有计算机对象的蓝图；而是它们的构造函数。\n\
    \n```\nalert( waitress.greet(\"Joe\") ); // Hi Joe My name is Ashley; what can\
    \ I get you?\n```\n\n> http://marketplace.tutsplus.com/item/object-oriented-javascript/157585?ref=andrew8088\n\
    \n## 更多概念与最佳实践\n\n那么如何给这个 computer 对象添加一个函数呢，比如存储文件的能力？你可能会忍不住这样做：\n\n```\nfunction\
