  md: "# Example 4.17\n\n```\nfunction make_coffee(requested_size) {\n    var sizes\
    \ = [\"large\", \"medium\", \"small\"],\n        coffee;\n\n    if (sizes.indexOf(requested_size)\
    \ < 0) {\n        throw new Error(\"We don't offer that size\");\n    }\n\n  \
    \  coffee = { size: required_size, added: [\"sugar\",\n        \"sugar\", \"cream\"\
    \ ] };\n\n    return coffee;\n}\n\ntry {\n    make_coffee(\"extra large\");\n\
    } catch (e) {\n    console.log(e.message);\n}\n```\n\nYou might find this to be\
    \ a common pattern. When there's the possibility of an error, you'll throw it\
    \ within a function. Then, you'll wrap the calling of that function in a try statement\
    \ and catch the error, if there is one. The way it works is that as soon as the\
    \ error is thrown, the program jumps to the catch statement, so nothing after\
    \ the error is ever executed. As you can see, we're using the Error constructor\
    \ function, passing in our error message."
