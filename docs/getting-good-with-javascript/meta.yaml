    # The Basics


    values that aren''t built into JavaScript. Need a **Person** object? No problem.
    Or what about a tabbed container? JavaScript objects have you covered. We''ll
    come back to custom objects in the next chapter, when we dive ankle-deep into
    the dirty waters of object-oriented programming.


    A final note about objects: you don''t need to put all the properties you want
    them to have in them right away; you can add them later. We''ll see more about
    this later.


    # Array


    Most programming languages have arrays, which are a great way to hold bunches
    of data. They''re very similar to objects, but without the keys.


    ```

    ["Buy milk", "Feed cat", "Pick up dry cleaning", "Deposit Cheque"]

    ```


    An array is delimited by brackets and each value is separated by a comma. Of course,
    you aren''t limited to strings, as I''ve used here. Also, you don''t have to use
    only values of the same type in a single array.


    ```

    ["string", 20, false, null, { "id" : 8888 }]

    ```


    If you''d like to access an item from an array, you can use square bracket notation.
    You would do this to access the first item in the array:


    # Example 2.5


    ```

    var arr = ["string", 20, false];

    alert( arr[0] ); // "string"

    ```'
