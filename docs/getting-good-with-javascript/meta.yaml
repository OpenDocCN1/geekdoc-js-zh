    This makes it clear that we can have more than one **return**. Once we figure\
    \ out which value we must return, we'll do so right away. I should note that a\
    \ **return** statement will be the last line to be executed in a function; once\
    \ the function returns, it's done; nothing else is executed. Therefore, unless\
    \ your **return** statement is inside a conditional statement, you usually won't\
    \ have any code after the **return** line in your function.\n\nOne more thing:\
    \ When writing functions, you want them to be user-friendly. Let's do this: if\
    \ the user doesn't pass in a parameter, we'll provide a reasonable default.\n\n\
    ## Example 3.4\n\n```\nfunction getGreeting(hour) {\n\n    hour = hour || new\
    \ Date().getHours();\n\n    if (hour < 12) {\n        return \"Good Morning!\"\
    ;\n    } else if (hour < 17) {\n        return \"Good Afternoon!\";\n    } else\
    \ {\n        return \"Good Evening!\";\n    }\n}\n\nalert( getGreeting( new Date().getHours()\
    \ ) );\n```\n\nWhat's going on here? We're using a logical OR operator; remember\
    \ what this does: if the first side is true, it will use that; otherwise, it will\
    \ use the second side. In this case, we're saying that we want to set the hour\
    \ parameter to either the value of the hour parameter (if the user passed one\
    \ in), or the current hour. We're using the **getHours** function of a current\
    \ Date object; we'll see more about this in a page or so. If the user didn't pass\
    \ a parameter, hour will be undefined, which is false. Therefore, the function\
    \ will assign the current hour to hour. And yes, you can assign new values to\
    \ parameters like this.\n\n> **ROCK TIP**\n\nThis is the best way to provide default\
    \ values for parameters. It's a pretty advanced JavaScript tip, but I think you\
    \ can handle it. Don't feel bad if it's a bit complex, though. Come back to it\
    \ later and you should have no troubles.\n\nWell, that's our first function. Let's\
    \ wrap up with discussion on functions with a few important points.\n\n## Arguments\n\
    \nWe've been calling the values that you pass to function parameters. There's\
    \ another common term, and that's *arguments*. In fact, JavaScript itself calls\
    \ them arguments. Many other programming languages have error-detection features\
    \ related to the arguments of a function: they make sure that when calling a function\
    \ you pass in the right number and type of arguments. JavaScript doesn't offer\
    \ any of this. These are all perfectly valid ways of calling our **getGreeting**\
    \ function above:\n\n```\nvar msg1 = getGreeting(10),\n\n    msg2 = getGreeting(1,2,3,4,5,6,\
    \ \"and on\"),\n\n    msg3 = getGreeting(),\n\n    msg4 = getGreeting(\"five o'clock\"\
    );\n```\n\nAnd there are many more, of course. Out of all these situations, we've\
    \ only written our function to work with options 1 and 3. However, it will work\
    \ with option 2: hour will be set to 1, but all the following arguments will be\
    \ lost. Option 4 is a good example of why some error checking is necessary: to\
    \ guard against string parameters in our function, we should use the typeof operator\
    \ to make sure it's a number (after we assert that they did indeed give us a parameter).\
    \ If it's not a number, we should provide the default: the current hour.\n\nI\
    \ said that for option 2 above, all the extra arguments are lost. Well, that's\
    \ not exactly true. JavaScript does provide a way to get to them: it offers an\
