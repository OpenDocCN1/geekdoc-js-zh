    \ test possible, to test for its existence.\n\n## Example 4.18\n\n```\nTEST.assert(Business,\
    \ \"Existence of Business function\");\n```\n\nIf you run this now, the test will\
    \ fail; actually, you won't even get a test, because your browser will throw an\
    \ error saying there's no such thing as Business. That's ok; our test obviously\
    \ failed. Now, let's write the function:\n\n## Example 4.19\n\n```\nfunction Business\
    \ (name, year_founded) {\n}\nTEST.assert(Business, \"Existence of Business function\"\
    );\n```\n\nNow we have our function; re-run the test and it should pass! Now,\
    \ let's add some other tests:\n\n```\nvar b = new Business(\"my business\", 2000);\n\
    TEST.equal(b.name, \"my business\", \"b.name === 'my business'\");\nTEST.equal(b.year_of_founding,\
    \ 2000, \"b.year_of_founding === 2000\");\n```\n\nThey fail, of course, so let's\
    \ fix that:\n\n## Example 4.20\n\n```\nfunction Business (name, year_founded)\
    \ {\n    this.name = name;\n    this.year_of_founding = year_founded;\n}\n\nvar\
    \ b = new Business(\"my business\", 2000);\nTEST.equal(b.name, \"my business\"\
    , \"b.name === 'my business'\");\nTEST.equal(b.year_of_founding, 2000, \"b.year_of_founding\
    \ === 2000\");\n```\n\nNow, they should pass. One more:\n\n```\nTEST.assert(b.get_age,\
    \ \"b has get_age\");\nTEST.equal(typeof b.get_age, \"function\", \"b.get_age\
    \ is a function\");\n```\n\nAfter making sure it fails, you can add the function:\n\
    \n## Example 4.21\n\n```\nfunction Business (name, year_founded) {\n    this.name\
    \ = name;\n    this.year_of_founding = year_founded;\n}\n\nBusiness.prototype.get_age\
    \ = function () {\n    return (new Date().getFullYear()) - this.year_of_founding;\n\
    }\n\nvar b = new Business(\"my business\", 2000);\n\nTEST.assert(b.get_age, \"\
    b has get_age\");\nTEST.equal(typeof b.get_age, \"function\", \"b.get_age is a\
    \ function\");\n```\n\nNow, it should pass.\n\nThis is just a very basic example\
    \ of how you might do testing. There are whole books written about this kind of\
    \ thing, so I can't really do the topic justice. If you want to learn more, check\
    \ out \"Test-Driven JavaScript Development\" by Christian Johansen. You can read\
    \ an excerpt of the book over on Nettuts+.\n\n## Performance Testing\n\nOften,\
    \ there are several ways to do something with JavaScript. This doesn't mean all\
    \ ways are equal, however. Very often, one way is faster than another. This is\
    \ where performance testing comes in. In this type of testing, you test two (or\
    \ more) different ways of doing something and compare their speeds.\n\nIf you\
    \ want to test something small, there's an informal way of doing this.\n\n- Store\
    \ the current time\n- Run your test\n- Store the new current time\n- Subtract\
    \ the two times to see how long it took\n\nIf your code will be running in different\
    \ browsers, you'll want to run your tests in all those environments. Sometimes—often\
    \ due to the way the JavaScript engine is implemented—what's fastest in one browser\
    \ won't be what's fastest in another.\n\nLet's see how to implement one of these\
    \ tests. But what to test? We'll use a test I did a while ago. Here's the scenario\
    \ I had: I had two arrays, and I wanted to add all the items from the second array\
    \ to the first array. There are three ways to do this:\n\n1. Loop over the second\
    \ array and push each item into the first array one by one.\n2. Use array's `concat`\
    \ method; this returns a new array with the items in both arrays, but we can just\
    \ reassign the variable that has the first array\n3. Use the fact that array's\
    \ `push` method can take as many parameters as we want to give it and use the\
    \ function's `apply` method to turn that second array into a list of parameters.\n\
    \nSo, let's see how we would test this; I'll go over this piece by piece:\n\n\
    ## Example 4.22 a\n\n```\nvar d1, d2, d3, d4, d5, d6,\n    arr1 = [1,2], arr2\
    \ = [],\n    i = 0, len;\n```\n\n```\nfor ( ; i < 100000; i++) {\n    arr2[i]\
    \ = 1;\n}\n\ni = 0;\nlen = arr2.length;\n```\n\nThis sets up our testing environment.\
    \ We've got a bunch of variables to keep our times. We have the first array and\
    \ the second array. We're putting 100,000 items in the second array because modern\
    \ JavaScript engines are so fast that we need to make a big test, or else everything\
    \ will happen in zero milliseconds. Now, let's run the first test:\n\n## Example\
    \ 4.22 b\n\n```\nd1 = new Date().getTime();\n\nfor ( ; i < len; i++) {\n    arr1.push(arr2[i]);\n\
    }\n\nd2 = new Date().getTime();\n```\n\nHere it is; we capture the current time,\
    \ run the test, and capture the new current time. As you may recall, the `getTime`\
    \ method of Date objects return the number of millisecond since January 1, 1970.\
    \ If we subtract d1 from d2, we'll get the number of milliseconds it took to run\
    \ the test (see a few paragraphs down).\n\nNext test!\n\n## Example 4.22 c\n\n\
    ```\narr1 = [1,2];\nd3 = new Date().getTime();\n\narr1 = arr1.concat(arr2);\n\n\
    d4 = new Date().getTime();\n```\n\nWe have to start by resetting arr1, because\
    \ it was changed in the previous test. We've captured our times, so let's do the\
    \ last test now:\n\n## Example 4.22 d\n\n```\narr1 = [1,2];\nd5 = new Date().getTime();\n\
    \nArray.prototype.push.apply(arr1, arr2);\n\nd6 = new Date().getTime();\n```\n\
    \nThis might seem a bit cryptic. Basically, we're using the fact that the apply\
    \ method of functions takes an array of arguments as its second parameters. Since\
    \ we can't just do arr1.push(arr2) (that would make arr2 an item in arr1, instead\
    \ of each of arr2's items), we're doing it this way.\n\nAt the end, we can do\
    \ this:\n\n## Example 4.22 e\n\n```\nconsole.log(\"looping and pushing: \", (d2\
    \ - d1) );\nconsole.log(\"array's concat: \", (d4 - d3) );\nconsole.log(\"push\
    \ via apply: \", (d6 - d5) );\n```\n\nThe test with the lowest score (the quickest\
    \ running time) is the fastest. Remember that time might change between browsers,\
    \ so be sure to check all the browsers your code might be running in. To make\
    \ this easier, I like to use the web app JSBin (http://www.jsbin.com); it's made\
    \ to easily share quick snippets of code. Just paste your tests in the left panel\
    \ (the JavaScript panel), and hit \"Preview.\" You can also click \"Save,\" and\
    \ then copy the URL. This is a unique URL that you can use to test that snippet\
    \ in any browsers. If you want to try this test in JSBin, you can get it at this\
    \ URL: http://jsbin.com/ejogo5\n\nA note here: When using JSBin, you'll probably\
    \ want to change the console.log lines to something like this:\n\n```\ndocument.write(\"\
    <br />looping and pushing: \" + (d2 - d1) );\ndocument.write(\"<br />array's concat:\
    \ \" + (d4 - d3) );\ndocument.write(\"<br />push via apply: \" + (d6 - d5) );\n\
    ```\n\n![JSBin](img/b2872544db3ac2167aea931a76af3eea_110_0.png)\n\n**Fig. 4-1.\
    \ JSBin**\n\nYou'll want to run the test a couple times to see which one is really\
    \ fastest. In my case, running this test in Firefox 3.6.10 shows that \"push via\
    \ apply\" is the fastest. However, your mileage will definitely vary."
  mdcn: "\n # 更多概念与最佳实践\n\npattern，我们通过闭包可以访问到它。在每个测试方法内部，我们只需调用 log 函数，并传入类名（用于给元素添加）和消息文本（用于放入列表项）。正如我所说，我在函数调用内部使用条件运算符来决定测试是通过还是失败。\n\
    \n在 log 函数内部，我们创建列表项，赋予其适当的类名和文本，并将其附加到我们创建的无序列表中。\n\n> **ROCK** **提示**\n>\n>\
