    image.jpg\", 26)`, the JavaScript engine sees that `my_computer` doesn't have\
    \ a method called `store_file`, so it looks on `my_computer`'s prototype object,\
    \ which is `Computer.prototype`. It will find it there, and execute it as a method\
    \ of `my_computer`. If it didn't find it there, it would continue up the *prototype\
    \ chain*. In this case, the next step up is `Object.prototype`, which is the top\
    \ of everything in JavaScript.\n\nI want to make sure you understand what is really\
    \ going on here. There are two main parts to creating an object with a constructor\
    \ function and the keyword **new**:\n\n1. The constructor function creates an\
    \ object (denoted by `this` inside the function); within the function, we are\
    \ assigning the values of properties of the object.\n2. The prototype, or parent\
