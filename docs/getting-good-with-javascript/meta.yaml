    # slice


    Sometimes you''ll want to slice your array into multiple parts. This is your method.
    It takes two parameters: the (zero-based) index of the starting element and the
    index of the element after the last one you want to slice. You can leave the second
    parameter off to select the rest of the array. You''ll get the sub-array back:


    # Example 3.28


    ```

    alert( ["a", "b", "c", "d", "e"].slice(2, 4) );

    // ["c", "d"]

    alert( ["f", "g", "h", "i", "j"].slice(1) );

    // ["g", "h", "i", "j"]

    ```


    # sort


    The sort method will re-order the items in your array however you''d like. If
    you don''t pass in any parameters, JavaScript will sort the elements alphabetically.'
  - "[PAGE 73]\n\n# Example 3.29\n\n```\n[\"d\", \"e\", \"c\", \"a\", \"b\"].sort();\
    \ // [\"a\", \"b\", \"c\", \"d\", \"e\"]\n```\n\nUnfortunately, it sorts numbers\
    \ \"alphabetically,\" too, which means that the array [0, 5, 10, 15, 20, 25] will\
    \ be sorted to [0, 10, 15, 20, 25, 5]. Not good. Instead, you can pass a sorting\
    \ function into sort. That function should take two parameters—say, a and b—which\
    \ will be items from the array. Here's how it works: the sort method will pass\
    \ the first and second items of the array to the function as the parameters; then\
    \ it will pass the second and third items, and so on. Inside the sorting function,\
    \ you must compare the two items. Then, return one of these values (assuming the\
    \ first parameter is a and the second, b):\n\n+   - If a should come before b,\
    \ return a negative number.\n- If a and b are equal, return 0.\n- If b should\
    \ come before a, return a positive number.\n\nIf you're just sorting numbers,\
    \ this is really easy:\n\n# Example 3.30\n\n```\nvar arr = [5, 2, 3, 4, 1];\n\
    arr.sort(function (a, b) {\n    return a - b;\n});\nconsole.log(arr); // [1, 2,\
    \ 3, 4, 5]\n```\n\nFor more on sorting functions, check out this tutorial I wrote\
    \ on Nettuts+³ a while back.\n\n> 3 http://net.tutsplus.com/tutorials/javascript-ajax/sorting-values-with-javascript/"
