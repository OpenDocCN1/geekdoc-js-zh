    \n如果你和我一样，总是记不住到底是 call 还是 apply 接收数组，那么请注意 **array** 和 **apply** 都以 a 开头（并且都以\
    \ \"y\" 结尾，还都有双辅音，如果这对你有帮助的话）。\n\n## 对象内部\n\n好的，还有一种改变 this 值的方法。我们已经讨论了足够多的对象字面量，你应该已经熟悉它们了。那么，记得我们可以将函数用作属性的值——通常称为方法。来看看这个：\n\
