  - '[PAGE 133]


    # # Removing Nodes


    When working with the DOM, it''s all give and take. This means you''ll occasionally
    want to remove elements from the DOM.


    Removing elements is a bit trickier than adding them; it makes sense that you
    need to know about the nodes surrounding your node to put it into the DOM. However,
    shouldn''t you be able to just remove an element without worrying about where
    it is? That''s unfortunately not the case. You need to know the element you want
    to remove *and* its parent.


    ```

    the_parent.removeChild(child_to_remove);

    ```


    Because of that, you''ll probably see this a lot:


    # ## Example 5.9


    ```

    // <div> Kill this: <span id="kill_me"> Kill me!</span> </div>


    var child = document.getElementById("kill_me");


    child.parentNode.removeChild(child);

    ```


    Get the child, and use its **parentNode** property to find the parent; then, remove
    the child you started with. Ah, well; that''s the DOM for you.


    There''s another method of removing DOM nodes that you''ll probably find useful
    on occasion. That''s **replaceChild**. Predictably, you hand it the new node and
    the node you want to replace, and it will swap in the new one while destroying
    the old one.'
- md: " ## Working with HTML\n\n## Example 5.10\n\n```\n// <div id=\"container\">\n\
    //    <p id=\"remove_me\"> Remove Me!</p>\n// </div>\n\nvar container = document.getElementById(\"\
    container\"),\n    old_element = document.getElementById(\"remove_me\"),\n   \
    \ new_element = document.createElement(\"p\");\n\nnew_element.appendChild(document.createTextNode(\"\
    new element\"));\n\ncontainer.replaceChild(new_element, old_element);\n```\n\n\
    ## Modifying a DOM Element\n\nNow that you're familiar with creating, adding,\
    \ and removing DOM nodes, let's talk about modifying nodes. After all, there are\
    \ three main actions you can perform on an individual node:\n\n- You can change\
    \ the attributes.\n- You can change the styling.\n- You can add and remove event\
    \ handlers.\n\nLet's start with attributes. If you're not sure what I'm talking\
    \ about, check this out:\n\n```\n<div id=\"content\" class=\"wide\"></div>\n<input\
    \ type=\"text\" name=\"first_name\" value=\"Bob\" />\n<span class=\"warning\"\
    ></span>\n```\n\nAttributes are the key=\"value\" part of your HTML elements.\
    \ Here, I'm using id, class, type, name, and value, but there are many more.\n\
    \nThere are a couple of ways to work with attributes, but I'm just going to show\
    \ you what the best, most cross-browser way to do it is. That way is using the\
    \ methods **setAttribute** and **getAttribute**. They work as follows:\n\n## Example\
    \ 5.11\n\n```\n// <div id=\"container\"></div>\n\nvar elem = document.getElementById(\"\
    container\");\n\nelem.setAttribute(\"class\", \"modal\");\nalert( elem.getAttribute(\"\
    class\") ); // \"modal\"\n```\n\nAs you can see, we pass two parameters to the\
    \ first method: the name of the attribute we want to set, and the value for the\
    \ attribute. When we're getting the attribute, we just have to pass the attribute\
    \ name to the **getAttribute** method. Obviously, these are methods of an element\
    \ node.\n\nThis should work with any attribute you want to set on your element—even\
    \ the new HTML5 data-* attributes. However, there's an easier way to set and get\
    \ some common attributes.\n\nIf you're working with the id or class, you can just\
    \ do this:\n\n```\nelem.id = \"content\";\n\nelem.id; // \"content\"\n\nelem.className\
    \ = \"module\";\n\nelem.className; // \"module\";\n```\n\nThis shorthand notation\
    \ is the go-to way of setting styling on elements. Watch this:\n\n## Working with\
    \ HTML\n\n**Example 5.12**\n\n```\n// <div id=\"container\">container</div>\n\n\
    var elem = document.getElementById(\"container\");\n\nelem.style.border = \"1px\
    \ solid red\";\nelem.style.backgroundColor = \"green\";\n```\n\nYup; it's all\
    \ the CSS properties that you already know and love, right in your JavaScript.\
    \ The key thing to note is this: JavaScript property names can't have dashes in\
    \ them, like they do in CSS. Therefore, use *camelCase* for those, capitalizing\
    \ every letter after a dash and removing the dashes. This way, `border-bottom-width`\
    \ becomes `borderBottomWidth`, and so on.\n\nAnother important thing to note is\
    \ that all the style properties are strings; this makes sense if you think about\
    \ it, because even numerical values like `borderBottomWidth` need to be suffixed\
    \ with a unit (px). So, it's all strings here.\n\nOne more thing: when you're\
    \ using `element.style`, you're working with the inline `style` attribute on the\
    \ element. When you set a styling property it gets added to the `style` attribute.\
    \ The logical following of this is that you can't get a style attribute that isn't\
    \ in the inline `style` attribute (either coded into the HTML or previously set\
    \ in your JavaScript).\n\n## Events\n\nWhile events could be considered a part\
    \ of modifying DOM elements, they deserve a section of their own. But first, what\
    \ are events?\n\nEvents, put simply, are things that happen to elements in the\
    \ DOM. Some examples of this might be as follows:\n\n- The page **loaded**.\n\
    - An element was **clicked**.\n- The mouse **moved over** an element.\n\nWhen\
    \ something like this happens, you may often want to do something. For example,\
    \ run this script when the page loads. Or, execute this function when an element\
    \ is clicked.\n\nSo, exactly what events are there? Well, you can find a comprehensive\
    \ list on Wikipedia^15^, but the ones you'll use most often are these:\n\n- click\n\
    - mouseover\n- mouseout\n- keypress\n- load\n- submit\n\nAs you can see, there\
    \ are two categories of events: things the user of your site does, and things\
    \ the browser does. In the above list, the user performs the click, mouseover,\
    \ mouseout, and keypress events. The browser fires the load event when the page\
    \ has finished loading, and the submit event when the user clicks a submit button\
    \ (so it's almost a user-performed event).\n\n> ^15^ http://en.wikipedia.org/wiki/DOM_events#Common.2FW3C_events\n\
    \n## Adding Event Handlers\n\nAn event is fired on a given DOM element. This means\
    \ we can wire up an *event handler* (or event listener) to a given element. An\
    \ event handler is a function that will be executed when a given event is fired.\
    \ Let's look at an example:\n\n## Example 5.13\n\n```\n// <div id=\"some_button\"\
    > Click Me! </div>\nvar btn = document.getElementById(\"some_button\");\n\nfunction\
    \ welcome_user(evt) {\n    alert(\"Hello there!\");\n}\n\nbtn.addEventListener(\"\
    click\", welcome_user, false);\n```\n\n(Note: you'll have to run this example\
    \ in a browser other than Internet Explorer; we'll resolve this soon.)\n\nWhat's\
    \ going on here? Well, the first bit is stuff you're getting used to: getting\
    \ an element and creating a function. Next, we're calling the element's method\
    \ addEventListener. You can probably guess what an event listener does: it \"\
    listens\" for an event and executes a function when that event occurs. The addEventListener\
    \ takes three parameters. The first is the type of event we're listening for;\
    \ in this case, it's a click event. The events in the sample list above are all\
    \ valid events as well, and you can find the rest at that Wikipedia page.\n\n\
    The next parameter is the function to run when that event is fired. In this case,\
    \ we're passing in the `welcome_user` function. We could also pass in an anonymous\
    \ function, if we wanted to. The final parameter decides whether to use capturing\
    \ or bubbling. This requires a short rabbit-trail on the difference between capturing\
    \ and bubbling.\n\nFirst off, note that Internet Explorer 8 and below support\
    \ bubbling only (IE9 and up support both bubbling and capturing), so you'll probably\
    \ use that 99% of the time. Now, check out this HTML:\n\n```\n<div>\n    <span>\
    \ Click Here! </span>\n</div>\n```\n\nLet's say I click the **span**. Because\
    \ the **span** is inside the **div**, when that **span** gets clicked, the **div**\
    \ is clicked as well. So both elements have a click event fire on them. If both\
    \ have an event handler to harness that event, which one should be executed first?\
    \ That's the background of capturing and bubbling. The DOM standard says that\
    \ events should capture first, bubble second. The *capture* phase is when the\
    \ event starts at the highest element and works down. In this case, the click\
    \ handler of **div** will fire first. Once the event reaches the bottom—or the\
    \ innermost element—it will then bubble. The *bubble* phase takes the event from\
    \ the bottom and brings it back to the top, element by element. To remember which\
    \ is which, remember that bubbles float up, just like events in the bubbling phase.\n\
    \nSo, back to `addEventListener`. That last parameter is whether to handle the\
    \ event in the capture phase or not. Because IE (before 9) doesn't support capturing,\
    \ it's usually `false` (which means bubbling).\n\nBut it's more than bubbling\
    \ that IE doesn't support. Before version 9, IE had its own event model (that\
    \ model is still supported in IE 9, but it supports the standard model as well).\
    \ Let's check that out.\n\nIt's actually pretty simple:\n\n## Example 5.14\n\n\
    ```\n// <div id=\"some_button\"> Click Me! </div>\nvar btn = document.getElementById(\"\
    some_button\");\n\nfunction welcome_user(evt) {\n    alert(\"Hello there!\");\n\
    }\n\nbtn.attachEvent(\"onclick\", welcome_user);\n```\n\nInstead of **addEventListener**,\
    \ they use the method **attachEvent**. You'll notice that there's no third parameter\
    \ (because it only supports bubbling). The other difference is that the event\
    \ name must be prefixed with the word \"on.\" Other than that, there's not much\
    \ difference.\n\n## Removing Event Handlers\n\nIf you want to add event listeners,\
    \ you'll eventually want to remove them. Here's how:\n\n```\n// assume the event\
    \ we wired up above\n\nbtn.removeEventListener(\"click\", welcome_user, false);\n\
    ```\n\nThe method is **removeEventListener**. The important point is that the\
    \ three parameters are all the same as the **addEventListener** parameters; that's\
    \ how you target which event you're removing.\n\nTo remove events with the IE\
    \ event model, try this:\n\n```\n// assume the event we wired up above\n\nbtn.detachEvent(\"\
    onclick\", welcome_user);\n```"
