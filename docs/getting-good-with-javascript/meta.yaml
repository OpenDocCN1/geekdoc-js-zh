  md: "More Concepts and Best Practices 85\n\nExample 4.7\n\n```\nvar waitress = {\n\
    \    name: \"Ashley\",\n    greet: function (customer) {\n        customer = customer\
    \ || \" there!\";\n        return \"Hi\" + customer + \" My name is \" + waitress.name\
    \ + \"; what can I get you?\";\n    }\n};\n\ndoppelganger = waitress;\nwaitress\
    \ = null;\n\ndoppelganger.greet(); // failure!\n```\n\nThink about this code:\
    \ remember that objects are a reference value. This means that when we create\
