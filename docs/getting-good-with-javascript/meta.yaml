  md: '# Getting Started


    Thanks for buying "Getting Good with JavaScript." I''m pretty sure you''ve made
    the right decision (if I''m allowed to say that). This introductory chapter will
    get you acquainted the subject under the microscope. Let''s roll!


    # Aren''t There Already Enough JavaScript Books?


    There''s a pretty good chance that you rolled your eyes when you first saw this
    book. If you''ve followed the online development community for any time at all,
    you''ll know that JavaScript is a pretty hot topic. Everybody is writing about
    it. So why yet another book on JavaScript?


    Well, yet another JavaScript book because I hope this book fills a niche. From
    the beginning, I wanted this book to be one that would take someone who knows
    little or nothing about JavaScript and get them up to speed in very little time...while
    only teaching current methods and best practices. This means that there''s much
    more to JavaScript than you''ll find in this book. There are many things you really
    don''t need to know when you get started; I won''t be spending time on them. I''ve
    seen other beginner books that cover things I''ve left out, and that''s okay,
    because they''re aiming for comprehensiveness. But not in this book: here, you''ll
    only learn what you''ll actually use as you dip your toes into JavaScript. That
    other stuff can wait.


    Since I''ve tried to keep this book short enough to read in a weekend (well, maybe
    a long weekend), many of the things we''ll look at aren''t exhaustively covered.
    This doesn''t mean I''ll skim over things. It just means that there are more advanced
    techniques that aren''t important for you to learn at this time. Don''t worry:
    you''ll'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'get a solid grounding in what you need to know to get you off the ground. Then,
    check out some of the resources in the Appendices for further study.


    # What Will I Learn?


    Before we get started, let''s talk about what this book covers. In this chapter,
    you''ll get acquainted with what JavaScript is and where it came from. We''ll
    also talk about how to set up an environment for coding JavaScript.


    After that, we''ll cover the basics in Chapters 2 and 3. You''ll learn all about
    the core syntax: what to actually *type*. Chapter 4 will cover many best practices
    and important concepts for writing JavaScript. Then, in Chapter 5, I''ll introduce
    you to the basics of writing JavaScript that interacts with web pages.


    # Where Did JavaScript Come From?


    JavaScript was developed by a gentleman named Brendan Eich, who was working for
    Netscape (a now non-existent web browser maker) at the time—he built the whole
    language in less than two weeks. Originally, it was called *Mocha*, then *LiveScript*,
    and finally *JavaScript*. The first browser to support JavaScript was Netscape
    Navigator 2.0, way back in late 1995.


    > **ROCK* TIP**


    It''s important to note that JavaScript IS NOT Java. There are really only two
    things that JavaScript and Java have in common. First and most obvious is the
    word "Java" (which was used to make JavaScript attractive to Java developers;
    I know, really). The only other thing is a bit of similar syntax: both languages
    use C-style curly braces. That''s really all.


    For a long time, JavaScript wasn''t considered to be much of a language. The "big
    idea" on the web was'
  merge: -1
  pgno: 9
- img_proc: true
  md: "# Getting Started\n\nsupposed to be Java Applets. However, they failed, and\
    \ eventually, JavaScript's \"Good Parts\" became well-known and soon even loved\
    \ by many people.\n\nNow, JavaScript is the most used programming language in\
    \ the world. It's used not only in web browsers, but also desktop apps, mobile\
    \ phone apps, and now even on the server. You definitely won't be wasting your\
    \ time learning JavaScript.\n\n# How Do I Get Started?\n\nNow that you're pumped\
    \ to learn JavaScript, how do we get started? Well, you'll learn how to actually\
    \ code JavaScript in the following chapters. But where is that code going to go?\n\
    \nAlthough it's hard to find a place where JavaScript *won't* run, the overwhelming\
    \ majority of JavaScript—especially the JavaScript you'll be writing for now—will\
    \ be in web pages, to run in the browser. There are two ways to get JavaScript\
    \ into your HTML page.\n\nFirst, you can embed your JavaScript code right inside\
    \ `script` tags.\n\n```\n<script>\n    alert(\"I'm learning JavaScript\");\n</script>\n\
    ```\n\nYou don't have to understand the code in the tags for now; just know that\
    \ it works. When your browser encounters a script tag, it will interpret the code\
    \ that you've written and execute it (if appropriate)."
  merge: -1
