    \ 的判断，只需检查数组中是否存在该值即可。\n\n```\nvar i = 0;\n\nfor ( ; names[i] ; ) {\n    //do\
    \ something\n    i++;\n}\n```\n\n这是一个重要的观点，不仅仅适用于 for 循环：如果你理解每一部分的作用，你就能更有效地运用它。想到这里，你能猜到为什么你没有尝试从\
    \ for 循环中移除布尔表达式吗？没有它，你的循环将会无限循环（试试看，然后让你的浏览器崩溃）。\n\n有一个结构可能看起来有点像我们上次写的 for 循环：\n\
    \n## 基础知识\n\n## 示例 2.25\n\n```\nvar names = [\"Ringo\", \"John\", \"Paul\", \"\
    George\"],\n    i = 0;\n\nwhile (i < names.length) {\n    alert(\"Say hi to \"\
    \ + names[i]);\n    i++;\n}\n```\n\nwhile 循环是 for 循环的更简单形式。括号里不是三个语句，而只有一个：布尔表达式。如果为\
    \ true，while 循环将再次运行。当然，它以 while 关键字开头，后跟括号，然后是块语句。如果你使用任何变量，你必须在循环之前初始化它们，并在循环内递增它们。根据你的任务，while\
    \ 循环可以比 for 循环更优雅。我在上面展示的是使用 while 循环进行迭代；这通常还是留给 for 循环更好。从语义上讲，while 循环应该在某个条件为\
    \ true 时使用：\n\n## 示例 2.26\n\n```\nvar not_home = true,\n    miles_driven = 0;\n\
    \nwhile (not_home) {\n    miles_driven += 1 // drive another mile\n    if (miles_driven\
    \ === 10) {\n        not_home = false;\n    }\n}\n\nalert(miles_driven);\n```\n\
    \n## 重访 For 循环\n\n还有另一种形式的 for 循环你应该了解，通常称为 for-in 循环。它用于遍历对象。看看：\n\n## 示例 2.27\n\
    \n```\nvar person = {\n    name : \"Jules Verne\",\n    job : \"Author\",\n  \
    \  year_of_birth: 1828,\n    year_of_death: 1905\n},\n     prop;\n\nfor (prop\
    \ in person) {\n    alert(\"His \" + prop + \" is \" + person[prop]);\n}\n```\n\
    \n如你所见，for-in 循环比普通 for 循环简单得多。括号里不是三个语句，我们只放一个：迭代器变量的名称、in 关键字，以及我们要遍历的对象。正如预期的那样，这将分别为数组或对象中的每个项目或属性执行块内的内容。使用\
    \ for-in 循环遍历对象时有一个必须注意的问题，但我们将在下一章中更多地讨论这个问题。\n\n## 总结\n\n现在你应该对我们的主题逐渐熟悉了。我们已经介绍了\
    \ JavaScript 中可用的不同类型、大多数运算符，以及如何使用条件和循环。在下一章中，我们将讨论 JavaScript 最重要的特性之一：函数。\n\
    \n## 更多基础知识\n\n既然我们已经掌握了类型和语法的最基础知识，让我们继续学习另一个极其重要的特性：函数。请密切关注！\n\n## 函数\n\n什么是函数？函数实际上只是封装起来的一堆代码。我们一直在看各种\
    \ JavaScript 语法：所有这些都可以放在函数里面，而且你经常会这样做。当你把代码放进函数时，它不会立即运行，像\"松散\"的代码那样。你可以通过调用函数来决定代码何时运行，而且你可以随心所欲地调用。这是函数的好处之一。\n\
    \n但不要忘记封装部分：这意味着在你调用函数时，你无法（在很大程度上）控制函数内部发生的事情。你会交给函数一些值来处理，它会返回一个值；但内部发生了什么是被黑箱化的。这最终成为我们可以利用的重要特性，稍后我们会看到。\n\
    \n关于函数还有另外两个重要的点你应该知道。首先，函数在 JavaScript 中是一等对象，这意味着*它们是对象*，而且*它们与其他任何值没有区别*。让我们更深入地看看这两点。\n\
    \n**函数是对象：** 我们之前看到过如何创建对象字面量。现在，我们不能使用对象字面量表示法来创建函数，但函数可以有属性和方法，因为它是对象。你可以向函数添加自己的属性和方法，但我们很快就会看看一些内置的。\n\
    \n**函数与其他值类似：** 在许多编程语言中，函数与字符串和数字等原始值非常不同。然而，在 JavaScript 中，情况并非如此。你可以在使用其他值的大多数地方使用函数，比如将它传递给另一个函数（我们很快就会看到）。此外，你可以重新定义函数，就像重新定义任何其他变量一样。这非常方便，你会看到的。\n\
    \n既然我们理解了一些函数理论，让我们看看一些语法。\n\n##  semi函数语法\n\n如我们所知，函数只是任意数量的常规 JavaScript 代码行。但我们需要用函数结构将其包裹起来。假设我们有一些代码，为我们的网站确定合适的问候语：\n\
    \n## 示例 3.1\n\n```\nvar hour = 10,\n    message;\n\nif (hour < 12) {\n    message\
    \ = \"Good Morning!\";\n} else if (hour < 17) {\n    message = \"Good Afternoon!\"\
    ;\n} else {\n    message = \"Good Evening!\";\n}\n\nconsole.log(message); // Good\
    \ Morning!\n```\n\n我们创建了一个 `hour` 变量，假设为当前小时。然后，我们使用 if 语句来判断我们的小时在什么范围内，并相应地赋值给\
    \ `message`。\n\n那么，我们要如何将这些代码转换为函数呢？首先，让我们认识一下函数外壳：\n\n```\nfunction getGreeting\
    \ () {\n    // code goes here}\n```\n\n以关键字 **function** 开头；然后，写出函数的名称；它可以是你想要的任何名称，只要遵循变量名的规则（即字母数字字符、下划线和美元符号，但不能以数字开头）。接下来是括号。然后，代码行放在花括号之间。\n\
    \n现在，你可能会想把我们上面写的所有代码都塞进函数外壳里。这不明智，有两个原因。首先，将无法访问到变量 **message**（更多关于*函数作用域*的内容即将介绍）。其次，通过一点定制，我们可以稍作调整来增加函数的实用性。\n\
    \n让我们的函数接受一个参数。参数是你请求函数运行时交给函数的值。然后函数可以按需要使用这些参数。这在语法上是如何工作的呢？\n\n```\nfunction\
    \ getGreeting (hour) {\n    //code here}\n```\n\n这里，我们的 **getGreeting** 函数接受一个参数，我们称之为\
    \ **hour**。参数就像只能从函数内部访问的变量。要调用这个函数并给它一个 hour，我们会这样做：\n\n```\ngetGreeting( 10\
    \ );\n```\n\n我们可以把 hour 存储在变量中，但我们不需要这样做，因为之后就用不到了。\n\n所以，我们把当前 hour 传递给 **getGreeting**。现在我们准备编写函数内部的代码：\n\
    \n## 示例 3.2\n\n```\nfunction getGreeting(hour) {\n    var msg;\n\n    if (hour\
    \ < 12) {\n        msg = \"Good Morning!\";\n    } else if (hour < 17) {\n   \
    \     msg = \"Good Afternoon!\";\n    } else {\n        msg = \"Good Evening!\"\
    ;\n    }\n    return msg;\n}\n\nvar message = getGreeting( 16 ); // 4 PM\n\nalert(message);\
    \ // Good Afternoon!\n```\n\n如果你一直仔细跟随，上面应该只有一件事你不确定：`return msg`。这是什么意思？返回值就是将其传回给调用函数的代码。这样，我们可以将调用函数赋值给变量（如上所述），它将是\
    \ **getGreeting** 返回的值。\n\n关于这个函数，我还想再做两件事让它更好。首先，真的不需要 **msg** 变量，因为我们只对它做了一件事。试试这个：\n"
