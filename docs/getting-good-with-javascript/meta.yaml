  md: "# More Concepts and Best Practices\n\nfunction with the **new** keyword. At\
    \ the end there, you can see how we call this function.\n\nTake note of how we\
    \ use **new** here. This does two things to the function. First, it changes **this**\
    \ to a new clean object. Obviously, we then add our custom properties within the\
    \ function. The second thing **new** does is assure that **this** is returned.\
    \ Now the value of `my_truck` is just the same as if we had done this:\n\n# Example\
    \ 4.4\n\n```\nvar my_truck = {\n    num_of_tires : 4,\n    kilometers : 0,\n \
    \   model : \"Hercules\"\n};\n\nconsole.log(my_truck);\n```\n\nThat's the idea\
    \ of using **new**: we get a super easy way to create objects. Obviously, you\
    \ won't use this when you just need one or two simple objects. It's most useful\
    \ when you have a lot of functionality to pack into an object, or you want to\
    \ create a lot of similar objects.\n\nWe'll come back to **new** a bit later.\
    \ For now, let's discuss the other ways to change **this**.\n\n# call and apply\n\
    \nI mentioned earlier that everything in JavaScript is an object—even functions.\
    \ Since functions are objects, they can have properties and methods. **call**\
    \ and **apply** are two methods that functions have by default."
