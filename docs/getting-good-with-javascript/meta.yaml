  - "[PAGE 141]\n\nIt's pretty simple.\n\n# Writing Cross-Browser Event Handlers\n\
    \nThe fact that there are two event models means that you need to wire up two\
    \ event handlers for each event. The easiest way to do that is to write a function\
    \ that wraps the event behaviour:\n\n```\n IDEclipboard\nfunction addEvent(element,\
    \ type, fn) {\n    if (element.addEventListener) {\n        element.addEventListener(type,\
    \ fn, false);\n    } else {\n        element.attachEvent(\"on\" + type, fn);\n\
    \    }\n}\n```\n\nThis is an extremely basic form of this function; there are\
    \ a ton of ways to improve it. As an exercise, try creating a `removeEvent` function\
    \ that removes events for both the standard model and the IE model.\n\n# Another\
    \ Short Rabbit-Trail on Script Loading\n\nRemember way back on page 10 (when you\
    \ were younger, and had less JavaScript in your blood), I recommended you put\
    \ script tags at the end of the body, unless (and I quote) you \"write your code\
    \ to wait until the page has completed loading before it begins executing.\" I'm\
    \ bringing this up for more than nostalgic reasons: events can help you do this.\n\
    \nWhat you want to do is listen for the `load` event on the `window` object. Here's\
    \ how that's done (assume we have our `addEvent` function from above):"
  - "[PAGE 142]\n\n# Example 5.15\n\n```\naddEventListener(window, \"load\", function()\
    \ {\n    alert(\"do something, for example.\");\n});\n```\n\nThere is a lot more\
    \ about events that we can't cover here. I didn't even mention the event object\
    \ that gets passed to the function that is called; this object provides information\
    \ about the event, such as which element the event from fired on. Check out Appendix\
    \ A for further resources that will teach you about events.\n\n# The DOM, In Sum\n\
    \nAs you can see, the DOM is occasionally confusing. You're constantly jumping\
    \ over text nodes; IE has its own mind for events and more. And we haven't even\
    \ talked about AJAX or even mentioned the Browser Object Model (which isn't part\
    \ of the DOM, but closely related). Does this mean you're doomed to awkwardly\
    \ code JavaScript for the browser for the rest of your life?\n\nNot really. The\
    \ answer is to write a library: a collection of functions that do all the heavy,\
    \ cross-browser work for you. But the great part about this is that there are\
    \ already several incredible JavaScript libraries out there that can make your\
    \ work simpler.\n\nWhat are your options? Well, do any of these JavaScript buzzwords\
    \ sound familiar?\n\n+   - jQuery\n- MooTools\n- YUI\n- Dojo"
  - "[PAGE 143]\n\n# Working with HTML\n\nAnd that's only a few of them. These libraries\
    \ give you a drop-dead simple way to work with the DOM. To whet your appetite,\
    \ here's a snippet of raw JavaScript, followed by its jQuery counterpart:\n\n\
    ```\n// Raw JavaScript\nvar leading_p = document.getElementById(\"content\").\n\
    firstChild;\n\nwhile (leading_p.nodeType !== 1 || leading_p.nodeName !== 'P')\
