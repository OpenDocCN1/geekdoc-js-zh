    # this


    The first this we''re going to tackle is this. Wait, what? That''s right: this.
    It''s rather hard to talk about, because of the name, but it''s an important concept
    to understand. This is a keyword in JavaScript that you can think of as a dynamic
    variable that you can''t control. The value of this changes based entirely on
    where you are in the code. Let''s take a look.


    For the majority of your code, this will reference the global object. I''ve mentioned
    the global object very briefly, but now is a good time to get to know it better.
    Remember the parseInt and parseFloat functions we talked near the end of the last
    chapter? These are functions are actually methods of the global object. This means
    you can access them via this format:


    Example 4.1


    ```

    alert( this.parseInt("10.2", 10) ); // 10

    alert( this.parseFloat("3.14159") ); // 3.14159

    ```


    Here''s a general rule: unless you''ve done something to change the value of this,
    it refers to the global object. When this is the case, anything you''d access
    without specifying an object is a property of the global object. Yes, this even
    applies to global-level functions and variables of your own. Try this:'
