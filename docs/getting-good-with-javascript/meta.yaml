    \ cool, I guess, you're saying. But what's the point? There's no way to call it.\
    \ Well, we'll see many places where anonymous functions (for that is what nameless\
    \ functions are) are useful; here's one that you might use often:"
- md: " ## More Basics\n\nYes, that's right; we can assign a function (named or anonymous)\
    \ to a variable, and execute it with that variable name. Remember, functions are\
    \ objects and can be assigned to variables just like values.\n\nHere's another\
    \ use for anonymous functions:\n\n```\nvar hi = (function () {\n    return function\
    \ () {\n        return \"Hi\";\n    }\n}());\n```\n\nTake a deep breath; this\
    \ might look like rocket science, but there's not that much going on here. Start\
    \ with what you know: we're assigning an anonymous function to the variable **hi**.\
    \ That anonymous function returns another anonymous function. That's all good.\
    \ Then, we're wrapping the first function in parentheses. This isn't required,\
    \ but you can wrap pretty much anything you want to in parentheses in JavaScript;\
    \ it just improves readability. In this case, we do it to remind ourselves that\
    \ we're doing something else of interest: notice that, after the function, we\
    \ have a set of parentheses. We know that a set of parentheses after a function\
    \ name executes that function. Well, they do the same after a function itself:\
    \ `function () { /**/ }()`. This is called an *anonymous self-invoking function*,\
    \ because it has no name and it executes itself. Since it runs right away, **hi**\
    \ is not assigned that function, but the function's return value: another function!\
    \ In this case, it's just like doing this:\n\n```\nvar hi = function () {\n  \
    \  return \"Hi\";\n};\n```\n\nSo why not do that? Well, this is just an example.\
    \ We'll see a real use for this pattern—assigning the returned value of anonymous\
    \ self-invoking to a variable—later (if you can't wait, read the section on *closure*,\
    \ on page 94).\n\nI should note that, while this pattern is usually called an\
    \ anonymous self-invoking function, not everyone agrees with that term. You'll\
    \ see that name a lot, but Ben Alman—frequent contributor to jQuery and creator\
    \ of many popular JavaScript projects—prefers the term *immediately-invoked function\
    \ expressions*.\n\nYou can read more about why he prefers that term in his blog\
    \ post on the topic¹.\n\n---\n\n¹ http://benalman.com/news/2010/11/immediately-invoked-function-expression/\n\
    \n## Type Methods\n\nIn the last chapter, we learned about the value and reference\
    \ types that JavaScript offers us. Let's conclude by getting to know the methods\
    \ of these types. Of course, we won't learn them all, but we'll cover all the\
    \ important ones, the ones you'll use regularly.\n\n**ROCK* TIP**\n\nWhat's the\
    \ difference between a function and a method? Only where they exist. A method\
    \ is just a function that is a property of an object. For example:\n\n```\nvar\
    \ console = {\n  log : function () {\n    // code here\n  }\n};\n```\n\nYou'd\
    \ call this the same way you access \"normal\" properties: `console.log()`. Look\
    \ familiar?\n\n## String Methods\n\n### length\n\nThis one is actually a property,\
    \ not a method. Predictably, the length property of a string is the number of\
    \ characters in the string.\n\n### Example 3.10\n\n```\nalert( \"gobsmacked\"\
    .length ); // 10\n```\n\n### indexOf\n\nThis is the method you'll most often use\
    \ when you're searching within a string. This method returns a number, the index\
    \ of your \"search term.\"\n\n### Example 3.11\n\n```\nvar line = \"HAL: I'm sorry,\
    \ Dave. I'm afraid I can't do that\";\n\nalert( line.indexOf(\"I'm\") ); // 5\n\
    alert( line.indexOf(\"I'm\", 6) ); // 22\n```\n\nYou can pass a second parameter\
    \ as the starting point, if you don't want to start searching at the beginning\
    \ of your string. Remember, these indices are zero-based—just like the indices\
    \ of an array—which means that the first letter of the string is indexed 0, the\
    \ second is 1, and so on. If the substring you searched for doesn't exist, you'll\
    \ get -1 back.\n\n### slice, substr, and substring\n\nThat's right; there are\
    \ three methods for getting part of a string out of a larger string. First, you\
    \ can use `slice`. It takes two parameters: the first parameter is the starting\
    \ index, and the second one is the ending index, meaning the index of the character\
    \ after the last character in the desired substring. If you leave the second one\
    \ off, it will slice until the end of the string.\n\n### Example 3.12\n\n```\n\
    var greeting = \"Hello, Andrew, what's up?\",\n    name = greeting.slice(7, 13);\n\
    \nalert(name); // Andrew\n```\n\nThese index parameters can also be negative numbers,\
    \ which means they \"count\" from the end of the string. This way, -1 is the last\
    \ item in the string, -2 is the second last, and so on.\n\nAn alternative to `slice`\
    \ is `substr`. The first parameter is the same as `slice`—the starting index—but\
    \ the second parameter is the length of the substring:\n\n### Example 3.13\n\n\
    ```\nvar greeting = \"Hello, Andrew, what's up?\",\n    name = greeting.substr(7,\
    \ 6);\n\nalert(name); // Andrew\n```\n\nSince your string can't have a negative\
    \ length, you can't use a negative number for the second parameter (you can use\
    \ a negative number for the first parameter, though). Of course, that second parameter\
    \ is optional, if you want the rest of the string.\n\nFinally, there's `substring`.\
    \ This works similarly to `slice`, except when it comes to negative values. A\
    \ negative value for either parameter acts as 0—it refers to the start of the\
    \ string. The neat thing about `substring` is that, unlike `slice`, the second\
    \ parameter can be lower than the first (while still positive). When this is the\
    \ case, substring goes back to the character of that index. For example,\n\n###\
    \ Example 3.14\n\n```\nvar greeting = \"Hello, Andrew, what's up?\",\n    name\
    \ = greeting.substring(13, 7);\n\nalert(name); // Andrew\n```\n\n### split\n\n\
    It's easy to pull a string into an array with the split method. Just pass the\
    \ method a parameter determining what character to split the array on.\n\n###\
    \ Example 3.15\n\n```\nvar arr = \"apples oranges peaches bananas\".split(\" \"\
    );\nconsole.log(arr); // [\"apples\", \"oranges\", \"peaches\", \n\"bananas\"\
    ]\n```\n\nYes, this is the way lazy programmers create arrays. But it has more\
    \ use than just as an alternative to an array literal.\n\n### toLowerCase and\
    \ toUpperCase\n\nI'm sure you know exactly what these do: easy converting of a\
    \ string to upper- or lowercase:\n\n### Example 3.16\n\n```\nvar usa  = \"usa\"\
    .toUpperCase(),\n    comment = \"THIS MIGHT BE A COMMENT\";\n\ncomment = comment.substr(0,1)\
    \ + comment.slice(1).toLowerCase();\n\nconsole.log(usa); // USA\nconsole.log(comment);\
    \ // This might be a comment\n```\n\n## Numbers\n\n### toExponential\n\nIf you'd\
    \ like to convert a number to its exponential form, this is the method to use.\
    \ It takes one parameter: the number of decimals places to use. If you leave the\
    \ parameter out, JavaScript will make sure your number isn't rounded.\n\n### Example\
    \ 3.17\n\n```\nalert( 12345..toExponential() ); // \"1.2345e+4\", meaning 1.2345\
    \ x 10^4\nalert( 987.65432.toExponential(3) ); // \"9.877e+2\"\nalert( 0.1234.toExponential()\
    \ ); // \"1.234e-1\"\n```\n\nIf you're scratching your head at the double-period\
    \ in the first example above, a short explanation is in order. When JavaScript\
    \ sees a dot after a number, it expects more digits; it thinks it's a decimal\
    \ point. So writing 5 is translated as 5.0. So if we wrote 5.toExponential(),\
    \ we'd get an error. We could do 5.0.toExponential() if we wanted to, or you could\
    \ save the character and just do the double-dot. Don't worry, in most cases, your\
    \ numbers will probably be in variables, so it won't make too much of a difference.\
    \ (You could also wrap the number in parentheses: (5234).toExponential());\n\n\
    ### toFixed\n\nThis method will round your numbers to the number of decimal points\
    \ you define in the parameter:\n\n### Example 3.18\n\n```\nalert( 6..toFixed(4)\
    \ ); // \"6.0000\"\nalert( 3.14159.toFixed(2) ); // \"3.14\"\nalert( 10.46.toFixed(1)\
    \ ); // \"10.5\"\n```\n\nYou'll find this useful if you're working with money,\
    \ and need to round to the nearest cent.\n\n### toPrecision\n\nThis method is\
    \ for choosing how many digits should represent your number. This includes numbers\
    \ of both sides of the decimal point:\n\n### Example 3.19\n\n```\nalert( 15.7896.toPrecision(4)\
    \ ); // \"15.79\"\nalert( 1940..toPrecision(2) ); // \"1.9e+3\"\n```\n\nWait,\
    \ what? How does that last example work? Well, it rounds the number to a precision\
    \ of 2, which in this case is to the hundreds digit. Then, it converts it to exponential\
    \ notation.\n\nI'll add here that all three of these number methods don't change\
    \ the variable with the number; they return a new value that you can assign to\
    \ another (or the same) variable:\n\n### Example 3.20\n\n```\nvar a = 300,\n \
    \   b = a.toFixed(2);\n\nconsole.log(a, typeof a); // 300\nconsole.log(b, typeof\
    \ b); // \"300.00\"\n```\n\nYou may also have noticed that all three of these\
    \ methods return strings, not numbers. What are you to do if you want to convert"
  mdcn: "\n ## 更多基础知识\n\n是的，没错；我们可以将一个函数（命名的或匿名的）赋值给一个变量，并通过该变量名来执行它。记住，函数是对象，可以像值一样赋值给变量。\n\
    \n这是匿名函数的另一种用途：\n\n```\nvar hi = (function () {\n    return function () {\n  \
    \      return \"Hi\";\n    }\n}());\n```\n\n深呼吸；这看起来可能像火箭科学，但实际上并没有那么多复杂的东西。从你了解的开始：我们正在将一个匿名函数赋值给变量**hi**。那个匿名函数返回另一个匿名函数。这很好理解。然后，我们将第一个函数用括号包裹起来。这不是必需的，但在\
    \ JavaScript 中，你可以用括号包裹几乎任何你想包裹的东西；这仅仅是为了提高可读性。在这个例子中，我们这样做是为了提醒自己正在做一些其他有趣的事情：注意，在函数之后，我们有一组括号。我们知道函数名后面的一组括号会执行该函数。同样，在函数本身后面也是如此：`function\
    \ () { /**/ }()`。这被称为*匿名自执行函数*，因为它没有名字，并且自己执行自己。由于它立即运行，**hi** 被赋值的并不是那个函数，而是该函数的返回值：另一个函数！在这个例子中，它就像这样做：\n\
    \n```\nvar hi = function () {\n    return \"Hi\";\n};\n```\n\n那为什么不直接这样做呢？嗯，这只是一个例子。稍后我们会看到这种模式的真实用途——将匿名自执行函数的返回值赋值给变量（如果你等不及，请参阅第\
    \ 94 页关于*闭包*的章节）。\n\n我应该指出，虽然这种模式通常被称为匿名自执行函数，但并非所有人都同意这个术语。你会经常看到这个名称，但 Ben Alman——jQuery\
    \ 的频繁贡献者和许多流行 JavaScript 项目的创建者——更倾向于使用术语*立即调用的函数表达式*。\n\n你可以在他的博客文章中阅读更多关于他为什么更喜欢这个术语的内容¹。\n\
    \n---\n\n¹ http://benalman.com/news/2010/11/immediately-invoked-function-expression/\n\
    \n## 类型方法\n\n在上一章中，我们了解了 JavaScript 提供给我们的值类型和引用类型。让我们通过了解这些类型的方法来结束本章。当然，我们不会学习所有的方法，但会涵盖所有重要的、你会经常使用的那些。\n\
    \n**ROCK* 提示\n\n函数和方法之间有什么区别？只在于它们存在的位置。方法只是一个作为对象属性的函数。例如：\n\n```\nvar console\
    \ = {\n  log : function () {\n    // code here\n  }\n};\n```\n\n你可以用访问\"普通\"属性的相同方式调用它：`console.log()`。看起来很熟悉吧？\n\
    \n## 字符串方法\n\n### length\n\n这实际上是一个属性，而不是方法。可以预见的是，字符串的 length 属性是字符串中字符的数量。\n\
    \n### 示例 3.10\n\n```\nalert( \"gobsmacked\".length ); // 10\n```\n\n### indexOf\n\
    \n这是你在字符串中搜索时最常用的方法。该方法返回一个数字，即你\"搜索词\"的索引。\n\n### 示例 3.11\n\n```\nvar line =\
    \ \"HAL: I'm sorry, Dave. I'm afraid I can't do that\";\n\nalert( line.indexOf(\"\
    I'm\") ); // 5\nalert( line.indexOf(\"I'm\", 6) ); // 22\n```\n\n如果你不想从字符串的开头开始搜索，可以传递第二个参数作为起始点。记住，这些索引是从零开始的——就像数组的索引一样——这意味着字符串的第一个字母索引为\
    \ 0，第二个是 1，依此类推。如果你搜索的子串不存在，你会得到 -1。\n\n### slice、substr 和 substring\n\n没错；有三种方法可以从较大的字符串中提取部分字符串。首先，你可以使用`slice`。它接受两个参数：第一个参数是起始索引，第二个参数是结束索引，即所需子串中最后一个字符之后的字符的索引。如果你省略第二个参数，它会切片到字符串的末尾。\n\
    \n### 示例 3.12\n\n```\nvar greeting = \"Hello, Andrew, what's up?\",\n    name\
    \ = greeting.slice(7, 13);\n\nalert(name); // Andrew\n```\n\n这些索引参数也可以是负数，这意味着它们从字符串的末尾\"\
    倒数\"。这样，-1 是字符串中的最后一项，-2 是倒数第二项，依此类推。\n\n`slice`的替代方法是`substr`。第一个参数与`slice`相同——起始索引——但第二个参数是子串的长度：\n\
    \n### 示例 3.13\n\n```\nvar greeting = \"Hello, Andrew, what's up?\",\n    name\
    \ = greeting.substr(7, 6);\n\nalert(name); // Andrew\n```\n\n由于你的字符串不能有负长度，你不能在第二个参数中使用负数（但你可以在第一个参数中使用负数）。当然，如果你想要字符串的其余部分，第二个参数是可选的。\n\
    \n最后，还有`substring`。它的工作原理与`slice`类似，但在处理负值时有所不同。任一参数的负值都视为 0——它指的是字符串的开头。`substring`的妙处在于，与`slice`不同，第二个参数可以低于第一个参数（仍然是正数）。在这种情况下，substring\
    \ 会回退到该索引的字符。例如，\n\n### 示例 3.14\n\n```\nvar greeting = \"Hello, Andrew, what's\
    \ up?\",\n    name = greeting.substring(13, 7);\n\nalert(name); // Andrew\n```\n\
    \n### split\n\n使用 split 方法可以轻松将字符串拆分成数组。只需向该方法传递一个参数，确定用什么字符来拆分数组。\n\n### 示例 3.15\n\
    \n```\nvar arr = \"apples oranges peaches bananas\".split(\" \");\nconsole.log(arr);\
    \ // [\"apples\", \"oranges\", \"peaches\", \n\"bananas\"]\n```\n\n是的，这是懒惰的程序员创建数组的方式。但它的用途不仅仅是作为数组字面量的替代。\n\
    \n### toLowerCase 和 toUpperCase\n\n我确信你完全知道这些是做什么的：轻松将字符串转换为大写或小写：\n\n### 示例 3.16\n\
    \n```\nvar usa  = \"usa\".toUpperCase(),\n    comment = \"THIS MIGHT BE A COMMENT\"\
    ;\n\ncomment = comment.substr(0,1) + comment.slice(1).toLowerCase();\n\nconsole.log(usa);\
    \ // USA\nconsole.log(comment); // This might be a comment\n```\n\n## 数字\n\n###\
    \ toExponential\n\n如果你想将一个数字转换为其指数形式，这就是要用的方法。它接受一个参数：要使用的小数位数。如果你省略该参数，JavaScript\
    \ 会确保你的数字不被四舍五入。\n\n### 示例 3.17\n\n```\nalert( 12345..toExponential() ); // \"\
    1.2345e+4\", meaning 1.2345 x 10^4\nalert( 987.65432.toExponential(3) ); // \"\
    9.877e+2\"\nalert( 0.1234.toExponential() ); // \"1.234e-1\"\n```\n\n如果你对上面第一个例子中的双点感到困惑，需要简单解释一下。当\
    \ JavaScript 看到数字后面的点时，它期望有更多的数字；它认为那是小数点。所以写 5 被翻译为 5.0。因此如果我们写 5.toExponential()，我们会得到一个错误。如果我们想的话，可以写\
    \ 5.0.toExponential()，或者你可以 condensation 一下，直接写双点。别担心，在大多数情况下，你的数字可能会在变量中，所以这不会有太大影响。（你也可以将数字用括号包裹起来：(5234).toExponential()）；\n\
    \n### toFixed\n\n该方法会将你的数字四舍五入到你在参数中定义的小数点位数：\n\n### 示例 3.18\n\n```\nalert( 6..toFixed(4)\
    \ ); // \"6.0000\"\nalert( 3.14159.toFixed(2) ); // \"3.14\"\nalert( 10.46.toFixed(1)\
    \ ); // \"10.5\"\n```\n\n如果你正在处理金钱，需要四舍五入到最接近的分，你会发现这很有用。\n\n### toPrecision\n\
    \n该方法用于选择用多少位数字来表示你的数字。这包括小数点两边的数字：\n\n### 示例 3.19\n\n```\nalert( 15.7896.toPrecision(4)\
    \ ); // \"15.79\"\nalert( 1940..toPrecision(2) ); // \"1.9e+3\"\n```\n\n等等，什么？最后一个例子是怎么工作的？嗯，它将数字精度四舍五入到\
    \ 2 位，在这个例子中是到百位。然后，它将其转换为指数表示法。\n\n我在这里补充一下，这三个数字方法都不会改变原始的数字变量；它们返回一个新值，你可以将其赋值给另一个（或同一个）变量：\n\
    \n### 示例 3.20\n\n```\nvar a = 300,\n    b = a.toFixed(2);\n\nconsole.log(a, typeof\
    \ a); // 300\nconsole.log(b, typeof b); // \"300.00\"\n```\n\n你可能还注意到，这三个方法都返回字符串，而不是数字。如果你想转换\n"
