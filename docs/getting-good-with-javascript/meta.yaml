  md: '# ## String


    A string is simply the way to handle any kind of text in JavaScript. Whenever
    you''re working with text, you''ll be using a string. A string of text must be
    surrounded by either double or single quotes; there''s no difference. Here are
    some examples:


    ```

    "Here is some text"

    ```


    ```

    ''This text is surrounded by single quotes''

    ```


    If you want to include a quote character inside your string, then you''ll have
    to escape it. To escape a character inside a string means to precede the character
    with a backslash. This basically tells the JavaScript interpreter that the character
    after the slash shouldn''t be interpreted normally; it''s something special. In
    this case, the normal interpretation of a quote is to close the string.


    # ### Example 2.2


    ```

    alert("John says \"What are you doing?\"");

    // John says "What are you doing?"

    alert(''"Let\''s go out for lunch."'');

    // "Let''s go out for lunch."

    ```


    Notice how, in that last string, I don''t have to escape the double quotes, because
    the string is delimited by single quotes. You only have to escape the quote-type
    that holds your string.'
