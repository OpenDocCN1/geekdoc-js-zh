    \ = model;\n}\n\nvar basic_vehicle = { year : 2011 };\n\nTruck.call(basic_vehicle,\
    \ \"Speedio\", 4);\n\nconsole.log(basic_vehicle);\n```\n\n> ***ROCK* 提示**\n>\n\
    > 关于原始值与引用值的题外话：你可能会想，虽然我们在修改一个现有对象，但除非我们把它们赋值给一个新变量，或者回赋给 basic_vehicle，否则我们会丢失这些更改。如果我们的变量是原始值，情况会是这样。然而，对象（和数组）是引用值：按引用传递的值。原始值（如字符串或数字）存储在计算机\
    \ RAM 中的一个位置，我们用一个变量来跟踪它。当我们把那个变量传递给函数时，我们把这个值复制到内存中的一个新位置，将参数名指向那个位置，并在函数内部使用它，所以原始值不会受到影响。引用值则不同：当我们把对象或数组传递给函数时，参数指向与原始变量完全相同的内存位置。这意味着\
    \ Truck.call(basic_vehicle) 内部的 this 与函数外部的 basic_vehicle 是完全相同的。所以不需要赋值任何东西，因为\
