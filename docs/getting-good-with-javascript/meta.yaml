  md: '# # Removing Nodes


    When working with the DOM, it''s all give and take. This means you''ll occasionally
    want to remove elements from the DOM.


    Removing elements is a bit trickier than adding them; it makes sense that you
    need to know about the nodes surrounding your node to put it into the DOM. However,
    shouldn''t you be able to just remove an element without worrying about where
    it is? That''s unfortunately not the case. You need to know the element you want
    to remove *and* its parent.


    ```

    the_parent.removeChild(child_to_remove);

    ```


    Because of that, you''ll probably see this a lot:


    # ## Example 5.9


    ```

    // <div> Kill this: <span id="kill_me"> Kill me!</span> </div>


    var child = document.getElementById("kill_me");


    child.parentNode.removeChild(child);

    ```


    Get the child, and use its **parentNode** property to find the parent; then, remove
    the child you started with. Ah, well; that''s the DOM for you.


    There''s another method of removing DOM nodes that you''ll probably find useful
    on occasion. That''s **replaceChild**. Predictably, you hand it the new node and
    the node you want to replace, and it will swap in the new one while destroying
    the old one.'
  merge: -1
  pgno: 133
