    \ Business 对象。我们先编写最简单的测试，来测试它是否存在。\n\n## 示例 4.18\n\n```\nTEST.assert(Business,\
    \ \"Existence of Business function\");\n```\n\n如果现在运行这个测试，测试会失败；实际上，你甚至看不到测试结果，因为浏览器会抛出错误，提示不存在\
    \ Business 这个东西。没关系，我们的测试显然失败了。现在，让我们编写这个函数：\n\n## 示例 4.19\n\n```\nfunction Business\
    \ (name, year_founded) {\n}\nTEST.assert(Business, \"Existence of Business function\"\
    );\n```\n\n现在我们有了函数；重新运行测试，它应该就能通过了！接下来，让我们添加一些其他测试：\n\n```\nvar b = new Business(\"\
    my business\", 2000);\nTEST.equal(b.name, \"my business\", \"b.name === 'my business'\"\
    );\nTEST.equal(b.year_of_founding, 2000, \"b.year_of_founding === 2000\");\n```\n\
    \n它们当然会失败，所以让我们来修复：\n\n## 示例 4.20\n\n```\nfunction Business (name, year_founded)\
    \ {\n    this.name = name;\n    this.year_of_founding = year_founded;\n}\n\nvar\
    \ b = new Business(\"my business\", 2000);\nTEST.equal(b.name, \"my business\"\
    , \"b.name === 'my business'\");\nTEST.equal(b.year_of_founding, 2000, \"b.year_of_founding\
    \ === 2000\");\n```\n\n现在，它们应该能通过了。再来一个：\n\n```\nTEST.assert(b.get_age, \"b has\
    \ get_age\");\nTEST.equal(typeof b.get_age, \"function\", \"b.get_age is a function\"\
    );\n```\n\n确保它失败后，你可以添加这个函数：\n\n## 示例 4.21\n\n```\nfunction Business (name, year_founded)\
    \ {\n    this.name = name;\n    this.year_of_founding = year_founded;\n}\n\nBusiness.prototype.get_age\
    \ = function () {\n    return (new Date().getFullYear()) - this.year_of_founding;\n\
    }\n\nvar b = new Business(\"my business\", 2000);\n\nTEST.assert(b.get_age, \"\
    b has get_age\");\nTEST.equal(typeof b.get_age, \"function\", \"b.get_age is a\
    \ function\");\n```\n\n现在，它应该能通过了。\n\n这只是如何进行测试的一个非常基础的示例。关于这类内容有整本的书在写，所以我无法真正把这个话题讲透。如果你想了解更多，可以查看\
    \ Christian Johansen 的《Test-Driven JavaScript Development》。你可以在 Nettuts+ 上阅读该书的节选。\n\
    \n## 性能测试\n\n通常，用 JavaScript 做同一件事有好几种方法。然而，这并不意味着所有方法都是平等的。很多时候，一种方法比另一种更快。这就是性能测试的用武之地。在这种测试中，你测试两种（或更多）不同的做事方法，并比较它们的速度。\n\
    \n如果你想测试一些小型内容，有一种非正式的方法可以做到。\n\n- 存储当前时间\n- 运行你的测试\n- 存储新的当前时间\n- 用两个时间相减，看看花了多长时间\n\
    \n如果你的代码将在不同的浏览器中运行，你会想在所有这些环境中运行你的测试。有时——通常是由于 JavaScript 引擎的实现方式——在一个浏览器中最快的方案，在另一个浏览器中不一定最快。\n\
    \n让我们看看如何实现其中一项测试。但测试什么呢？我们用一稍早前做过的测试。我的场景是这样的：我有两个数组，我想把第二个数组中的所有项添加到第一个数组中。有三种方法可以做到这一点：\n\
    \n1. 遍历第二个数组，逐个将每一项推入第一个数组。\n2. 使用数组的 `concat` 方法；这会返回一个包含两个数组项的新数组，但我们只需重新赋值持有第一个数组的变量\n\
    3. 利用数组的 `push` 方法可以接受任意数量参数这一特性，使用函数的 `apply` 方法将第二个数组转换为参数列表。\n\n那么，让我们看看如何测试这个；我会逐段讲解：\n\
    \n## 示例 4.22 a\n\n```\nvar d1, d2, d3, d4, d5, d6,\n    arr1 = [1,2], arr2 = [],\n\
    \    i = 0, len;\n```\n\n```\nfor ( ; i < 100000; i++) {\n    arr2[i] = 1;\n}\n\
    \ni = 0;\nlen = arr2.length;\n```\n\n这设置了我们的测试环境。我们有一堆变量来保存时间。我们有第一个数组和第二个数组。我们在第二个数组中放入\
    \ 100,000 个项，因为现代 JavaScript 引擎非常快，我们需要做一个大测试，否则所有操作都会在零毫秒内完成。现在，让我们运行第一个测试：\n\
    \n## 示例 4.22 b\n\n```\nd1 = new Date().getTime();\n\nfor ( ; i < len; i++) {\n\
    \    arr1.push(arr2[i]);\n}\n\nd2 = new Date().getTime();\n```\n\n就是这里；我们捕获当前时间，运行测试，然后捕获新的当前时间。如你所记得的，Date\
    \ 对象的 `getTime` 方法返回自 1970 年 1 月 1 日以来的毫秒数。如果我们用 d2 减去 d1，就能得到运行测试所花的毫秒数（参见下面几段）。\n\
    \n下一个测试！\n\n## 示例 4.22 c\n\n```\narr1 = [1,2];\nd3 = new Date().getTime();\n\n\
    arr1 = arr1.concat(arr2);\n\nd4 = new Date().getTime();\n```\n\n我们必须先重置 arr1，因为它在上一个测试中被修改了。我们已经捕获了时间，现在来做最后一个测试：\n\
    \n## 示例 4.22 d\n\n```\narr1 = [1,2];\nd5 = new Date().getTime();\n\nArray.prototype.push.apply(arr1,\
    \ arr2);\n\nd6 = new Date().fter making sure it fails, you can add the function:\n\
    ```\n\n这看起来可能有点晦涩。基本上，我们利用了函数的 apply 方法接受一个参数数组作为其第二个参数这一特性。因为我们不能简单地做 arr1.push(arr2)（那样会把\
    \ arr2 作为 arr1 的一项，而不是 arr2 的每一项），所以我们用这种方式来做。\n\n最后，我们可以这样做：\n\n## 示例 4.22 e\n\
    \n```\nconsole.log(\"looping and pushing: \", (d2 - d1) );\nconsole.log(\"array's\
    \ concat: \", (d4 - d3) );\nconsole.log(\"push via apply: \", (d6 - d5) );\n```\n\
    \n得分最低（运行时间最短）的测试就是最快的。请记住，时间可能会因浏览器而异，所以务必检查你的代码可能运行的所有浏览器。为了让这更方便，我喜欢使用网络应用\
    \ JSBin (http://www.jsbin.com)；它专为轻松分享代码片段而设计。只需将你的测试粘贴到左侧面板（JavaScript 面板），然后点击\
    \ \"Preview\"。你也可以点击 \"Save\"，然后复制 URL。这是一个独特的 URL，你可以用它来在任何浏览器中测试该代码片段。如果你想在\
    \ JSBin 中尝试这个测试，可以通过这个 URL 获取：http://jsbin.com/ejogo5\n\n这里有一点说明：使用 JSBin 时，你可能想把\
    \ console.log 行改成类似这样的内容：\n\n```\ndocument.write(\"<br />looping and pushing:\
    \ \" + (d2 - d1) );\ndocument.write(\"<br />array's concat: \" + (d4 - d3) );\n\
    document.write(\"<br />push via apply: \" + (d6 - d5) );\n```\n\n![JSBin](img/b2872544db3ac2167aea931a76af3eea_110_0.png)\n\
    \n**图 4-1. JSBin**\n\n你应该多运行几次测试，看看哪个才是真正最快的。就我而言，在 Firefox 3.6.10 中运行此测试显示 \"\
    push via apply\" 是最快的。不过，你的结果很可能会有所不同。\n"
