- md: " ## Summary\n\nWell, it's been a long haul, but you've pretty much mastered\
    \ all the basics; you're familiar with all the data types built into JavaScript,\
    \ and all their methods. You're also proficient using function and control structures\
    \ (loops and conditionals). With the basics under your belt, we can now move on\
    \ to some slightly more difficult techniques.\n\n## More Concepts and Best Practices\n\
    \nYou now have a good grasp of the basics of JavaScript. This chapter will take\
    \ that knowledge up a level: we'll discuss some of the more complex JavaScript\
    \ features, as well as some good practices for coding. So let's not waste another\
    \ moment!\n\n### this\n\nThe first this we're going to tackle is this. Wait, what?\
    \ That's right: this. It's rather hard to talk about, because of the name, but\
    \ it's an important concept to understand. This is a keyword in JavaScript that\
    \ you can think of as a dynamic variable that you can't control. The value of\
    \ this changes based entirely on where you are in the code. Let's take a look.\n\
    \nFor the majority of your code, this will reference the global object. I've mentioned\
    \ the global object very briefly, but now is a good time to get to know it better.\
    \ Remember the parseInt and parseFloat functions we talked near the end of the\
    \ last chapter? These functions are actually methods of the global object. This\
    \ means you can access them via this format:\n\n#### Example 4.1\n\n```\nalert(\
    \ this.parseInt(\"10.2\", 10) ); // 10\nalert( this.parseFloat(\"3.14159\") );\
    \ // 3.14159\n```\n\nHere's a general rule: unless you've done something to change\
    \ the value of this, it refers to the global object. When this is the case, anything\
    \ you'd access without specifying an object is a property of the global object.\
    \ Yes, this even applies to global-level functions and variables of your own.\
    \ Try this:\n\n#### Example 4.2\n\n```\nvar my_variable = \"value\";\nfunction\
    \ my_function () { return \"another_value\" }\n```\n\n```\nalert( this.my_variable\
    \ ); // \"value\"\nalert( this.my_function() ); // \"another_value\"\n```\n\n\
    this doesn't really have a proper name, but it does have a property that refers\
    \ to itself: `window`. If you could see this code, it might look something like\
    \ the following:\n\n```\nvar global = {\n    window : global\n    . . .\n};\n\
    this = global;\n```\n\nThis means you can also access your variables and functions\
    \ as properties of `window`, which is more common than using `this`. It gets a\
    \ bit more confusing here, because you can access `window` to use things on the\
    \ global object even when `this` refers to something else. Even then, you don't\
    \ have to call it off `window`, unless you have a local variable or function overwriting\
    \ it.\n\nNow that we've (somewhat) got a hold on what `this` is by default, let's\
    \ look at how we can change it.\n\n### The new Keyword\n\nThe first way of changing\
    \ `this` that we'll look at is yet another keyword: `new`. But first, some context.\n\
    \nYou know what a JavaScript object is. Keeping most of your related functionality\
    \ in an appropriate object and accessing it via an appropriate interface is a\
    \ very (very, very) basic description of what's called \"Object-Oriented Programming\"\
    \ (OOP). Many programming languages use classes to do OOP. Classes are like blueprints:\
    \ they aren't the real objects, but they lay out what the objects will have when\
    \ they are created. JavaScript is very object-oriented, but it doesn't use classes.\
    \ Instead, it uses prototypes. Prototypes are real objects (the same objects you've\
    \ already seen), and we can use them as a \"living\" blueprint for other objects.\n\
    \nWith all that said, let's get back to **new**. The classes in other languages\
    \ use constructor functions to construct the new objects. In JavaScript, constructors\
    \ are regular functions, written to create new objects and called with the keyword\
    \ **new** in front of them. Let's take a look at how to write and call this type\
    \ of function.\n\nLet's say we want to create truck objects. I know: this isn't\
    \ necessarily practical. You probably won't ever need truck objects in JavaScript,\
    \ but it's something you'll be familiar with while we discuss **new** and its\
    \ crew.\n\nSo, here's a function that will create a truck:\n\n#### Example 4.3\n\
    \n```\nfunction Truck(model) {\n    this.num_of_tires = 4;\n    this.kilometers\
    \ = 0;\n    this.model = model;\n}\n\nvar my_truck = new Truck(\"Hercules\");\n\
    \nconsole.log(my_truck);\n```\n\nNotice two things here: first, we're defining\
    \ all these variables as properties of the object **this**. Second, we don't return\
    \ anything from this function. Both of these are because we plan to call this\
    \ function with the **new** keyword. At the end there, you can see how we call\
    \ this function.\n\nTake note of how we use **new** here. This does two things\
    \ to the function. First, it changes **this** to a new clean object. Obviously,\
    \ we then add our custom properties within the function. The second thing **new**\
    \ does is assure that **this** is returned. Now the value of `my_truck` is just\
    \ the same as if we had done this:\n\n#### Example 4.4\n\n```\nvar my_truck =\
    \ {\n    num_of_tires : 4,\n    kilometers : 0,\n    model : \"Hercules\"\n};\n\
    \nconsole.log(my_truck);\n```\n\nThat's the idea of using **new**: we get a super\
    \ easy way to create objects. Obviously, you won't use this when you just need\
    \ one or two simple objects. It's most useful when you have a lot of functionality\
    \ to pack into an object, or you want to create a lot of similar objects.\n\n\
    We'll come back to **new** a bit later. For now, let's discuss the other ways\
    \ to change **this**.\n\n### call and apply\n\nI mentioned earlier that everything\
    \ in JavaScript is an object—even functions. Since functions are objects, they\
    \ can have properties and methods. **call** and **apply** are two methods that\
    \ functions have by default.\n\nThe only reason for these functions to exist is\
    \ to change the value of this within the function. Let's see how to do it.\n\n\
    #### Example 4.5\n\n```\nfunction Truck (model, num_of_tires) {\n    this.num_of_tires\
    \ = num_of_tires;\n    this.kilometers = 0;\n    this.model = model;\n}\n\nvar\
    \ basic_vehicle = { year : 2011 };\n\nTruck.call(basic_vehicle, \"Speedio\", 4);\n\
    \nconsole.log(basic_vehicle);\n```\n\n> **ROCK* TIP**\n>\n> An aside on primitive\
    \ vs. reference values: You might think that, although we're modifying an existing\
    \ object, we will lose those changes unless we assign them to a new variable,\
    \ or back to basic_vehicle. That would be the case if our variable was a primitive\
    \ value. However, objects (and arrays) are reference values: values passed by\
    \ reference. A primitive value (such as a string or number) is stored in a spot\
    \ in your computer's RAM, and we keep track of it with a variable. When we pass\
    \ that variable to a function, we copy that value to a new spot in memory, point\
    \ the parameter name to that spot, and work with that inside the function, so\
    \ that the original is unharmed. It's different with reference values: when we\
    \ pass an object or array to a function, the parameter points to the very same\
    \ spot in memory as the original variable. This means that the this inside Truck.call(basic_vehicle)\
    \ is the very same basic_vehicle we have outside the function. So there's no need\
    \ to assign anything, because basic_vehicle now has the properties assigned by\
    \ Truck. What would happen if we assigned the returned value of Truck.call(basic_vehicle)\
    \ to a variable? It would be undefined, because Truck without new doesn't return\
    \ anything.\n\nHere, we're calling the Truck function via its call method. The\
    \ first parameter of call is the object we want to be considered this within the\
    \ function. Since we're not using new with this call to Truck, it doesn't create\
    \ a new object or return this by default. That's what we want in this case, because\
    \ we're modifying an existing object.\n\nAfter the object that will be this (you\
    \ could call this the context of the function), we can pass in any parameters\
    \ necessary. These will be passed to the function being executed. As you can see\
    \ in our above example, the second parameter \"Speedio\" is being passed to Truck\
    \ as its first parameter. The third parameter 4 becomes the second parameter of\
    \ Truck. Of course, this will work for as many parameters as you required.\n\n\
    There's an alternate form of call, named apply. The difference here is that apply\
    \ takes only two parameters. The first is the context object. The second is an\
    \ array of parameters that will be passed to the function. This is useful if you\
    \ have the parameters as an array, instead of as loose variables. For example,\
    \ let's say we ask the user to enter the model of the truck and the number of\
    \ wheels it has into a textbox. The string user_input represents what we may have\
    \ gotten back from them:\n\n#### Example 4.6\n\n```\nfunction Truck (model, num_of_tires)\
    \ {\n    this.num_of_tires = num_of_tires;\n    this.kilometers = 0;\n    this.model\
    \ = model;\n}\n```"
  mdcn: "\n ## 总结\n\n嗯，这是一段漫长的旅程，但你基本上已经掌握了所有基础知识；你熟悉了 JavaScript 中所有的内置数据类型，以及它们的所有方法。你也已经熟练掌握了函数和控制结构（循环和条件语句）的使用。既然基础知识已经掌握，我们现在可以转向一些稍微复杂一些的技术了。\n\
    \n## 更多概念与最佳实践\n\n现在你已经对 JavaScript 的基础知识有了很好的掌握。本章将把你的知识提升一个层次：我们将讨论一些更复杂的 JavaScript\
    \ 特性，以及一些良好的编码实践。所以让我们不要浪费时间了！\n\n### this\n\n我们首先要解决的第一个概念就是 this。等等，什么？没错：this。它相当难以谈论，因为名字的关系，但这是一个需要理解的重要概念。This\
    \ 是 JavaScript 中的一个关键字，你可以把它想象成一个你无法控制的动态变量。this 的值完全取决于你在代码中的位置。让我们来看一看。\n\n\
    对于你的大部分代码来说，this 会引用全局对象。我之前非常简略地提到过全局对象，但现在是时候更好地了解它了。还记得我们在上一章末尾附近谈到的 parseInt\
    \ 和 parseFloat 函数吗？这些函数实际上是全局对象的方法。这意味着你可以通过以下格式访问它们：\n\n#### 示例 4.1\n\n```\n\
    alert( this.parseInt(\"10.2\", 10) ); // 10\nalert( this.parseFloat(\"3.14159\"\
    ) ); // 3.14159\n```\n\n这里有一个通用规则：除非你对 this 的值做了某些改变，否则它指向全局对象。如果是这种情况，任何你不指定对象就能访问的东西都是全局对象的属性。是的，这甚至适用于你自己定义的全局级别的函数和变量。试试这个：\n\
    \n#### 示例 4.2\n\n```\nvar my_variable = \"value\";\nfunction my_function () {\
    \ return \"another_value\" }\n```\n\n```\nalert( this.my_variable ); // \"value\"\
    \nalert( this.my_function() ); // \"another_value\"\n```\n\nthis 并没有一个合适的名称，但它确实有一个引用自身的属性：`window`。如果你能看到这段代码，它可能看起来像这样：\n\
    \n```\nvar global = {\n    window : global\n    . . .\n};\nthis = global;\n```\n\
    \n这意味着你也可以把你的变量和函数作为 `window` 的属性来访问，这比使用 `this` 更常见。这里变得更令人困惑一些，因为即使当 `this`\
    \ 指向其他东西时，你仍然可以通过 `window` 来访问全局对象上的东西。即便如此，你也不需要通过 `window` 来调用它，除非你有局部变量或函数覆盖了它。\n\
    \n既然我们已经（在某种程度上）掌握了默认情况下 `this` 是什么，让我们看看如何改变它。\n\n### new 关键字\n\n我们要看的改变 `this`\
    \ 的第一种方式是另一个关键字：`new`。但首先，一些背景知识。\n\n你知道 JavaScript 对象是什么。把大部分相关功能放在适当的对象中，并通过适当的接口访问它，这是对\"\
    面向对象编程\"（OOP）非常（非常，非常）基本的描述。许多编程语言使用类来实现 OOP。类就像蓝图：它们不是真正的对象，但它们规划了对象创建时会拥有什么。JavaScript\
    \ 是非常面向对象的，但它不使用类。相反，它使用原型。原型是真实的对象（就是你已经见过的那些对象），我们可以把它们用作其他对象的\"活\"蓝图。\n\n说了这么多，让我们回到\
    \ **new**。其他语言中的类使用构造函数来构造新对象。在 JavaScript 中，构造函数是普通的函数，用来创建新对象，并在调用时在前面加上关键字\
    \ **new**。让我们看看如何编写和调用这种类型的函数。\n\n假设我们想要创建卡车对象。我知道：这不一定实用。你可能永远不会在 Java hcipt\
    \ 中需要卡车对象，但当我们讨论 **new** 及其相关概念时，这是你熟悉的东西。\n\n所以，这里有一个创建卡车的函数：\n\n#### 示例 4.3\n\
    \n```\nfunction Truck(model) {\n    this.num_of_tires = 4;\n    this.kilometers\
    \ = 0;\n    this.model = model;\n}\n\nvar my_truck = new Truck(\"Hercules\");\n\
    \nconsole.log(my_truck);\n```\n\n注意两点：首先，我们将所有这些变量定义为对象 **this** 的属性。其次，我们没有从这个函数返回任何东西。这两者都是因为我们计划用\
    \ **new** 关键字来调用这个函数。在最后的部分，你可以看到我们如何调用这个函数。\n\n注意我们这里如何使用 **new**。这会对函数做两件事。首先，它将\
    \ **this** 改变为一个新的干净对象。显然，我们随后在函数中添加我们的自定义属性。**new** 做的第二件事是确保 **this** 被返回。现在\
    \ `my_truck` 的值就和如果我们这样做是一样的：\n\n#### 示例 4.4\n\n```\nvar my_truck = {\n    num_of_tires\
