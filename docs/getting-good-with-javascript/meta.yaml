  md: "# ### round / ceil / floor\n\nMath.round is your friend when you want to round\
    \ a number to the nearest whole number. If you need to round up, use Math.ceil.\
    \ Rounding down? Math.floor is here to help.\n\n# Example 3.34\n\n```\nalert(\
    \ Math.round(10.4) ); // 10\nalert( Math.round(10.5) ); // 11\nalert( Math.ceil(10.4)\
    \ );  // 11\nalert( Math.floor(10.5) ); // 10\n```\n\nCombining Math.random and\
    \ Math.floor, we can write a function that will return a random number between\
    \ a minimum and maximum number:\n\n# Example 3.35\n\n```\nfunction getRandomNumberInRange(min,\
    \ max) {\n    return Math.floor( Math.random() * (max - min + 1) + min);\n}\n\n\
    alert( getRandomNumberInRange(0, 100) ); // 39; you'll probably get something\
    \ different.\n```\n\n# pow\n\nThis is the function to use when taking the power\
    \ of a number. The first parameter is the number you're taking the power of and\
    \ the second parameter is the power.\n\n# Example 3.36\n\n```\nalert( Math.pow(2,\
    \ 3) ); // 8\nalert( Math.pow(2, -1) ); // 0.5\n```"
