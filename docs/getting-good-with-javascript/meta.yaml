    \ 紧挨着 **else** 放置，在括号内添加第二个条件，就可以了。当然，这个过程可以无限进行下去；你可以使用的 else if 语句数量没有限制。\n\n\
    ## Switch 语句\n\n然而，假设我们要检查具有多个选项的内容，比如顾客想要的咖啡尺寸。我们可能需要这样做：\n\n### 示例 2.19\n\n\
    ```\nvar order_size = \"medium\";\n\nif (order_size === \"small\") {\n    alert(\"\
    small\");\n} else if (order_size === \"medium\") {\n    alert(\"medium\");\n}\
    \ else if (order_size === \"large\") {\n    alert(\"large\");\n} else if (order_size\
    \ === \"extra large\") {\n    alert(\"extra large\");\n} else {\n    alert(\"\
    something else?\");\n}\n```\n\n我可不知道你怎么看，但对我来说，最后这段代码似乎有太多不必要的重复。你可以改用 switch\
    \ 语句。\n\n### 示例 2.20\n\n```\nvar order_size = \"medium\";\n\nswitch (order_size)\
    \ {\n    case \"small\":\n        alert(\"small\");\n        break;\n    case\
    \ \"medium\":\n        alert(\"medium\");\n        break;\n    case \"large\"\
    :\n        alert(\"large\");\n        break;\n    case \"extra large\":\n    \
    \    alert(\"extra large\");\n        break;\n    default:\n        alert(\"something\
    \ else?\");\n}\n```\n\n让我来介绍一下 switch 语句。它是冗长、嵌套的 if/else 语句的完美替代品。使用 switch 语句时，你只需要写一次要计算的表达式；它放在最上面括号内，紧接在关键字\
    \ `switch` 之后。然后我们打开一组花括号。\n\n我们想根据该表达式的计算结果执行某些操作，因此可以设置任意多个 case。关键字 **case**\
    \ 后跟我们希望表达式匹配的值。在这个示例中，表达式 `order_size` 与每种咖啡尺寸进行比较。比较值后面跟一个冒号。接下来是如果表达式与 case\
    \ 匹配则将执行的代码行；如果只有一行代码，你可以根据需要将其放在 **case \"value\":** 的同一行。这完全无所谓，因为 JavaScript\
    \ 不关心空格。不要忘记用 `break;` 结束你的 case 块。这会防止我们的 case 语句发生穿透；我们稍后会看到这指的是什么。\n\n但首先，不要忘记末尾的\
    \ **default:** 部分；没错，你猜对了：它相当于 `else`。当没有任何 case 匹配时，它会被执行。\n\n那么，回到穿透问题：如果我们不包含\
    \ `break;` 语句，在我们匹配的 case 之下的任何 case 语句的代码也会被执行。下面是移除了 break 语句的示例 2.20：\n\n###\
    \ 示例 2.21\n\n```\nvar order_size = \"medium\";\n\nswitch (order_size) {\n    case\
    \ \"small\":\n        alert(\"small\");\n    case \"medium\":\n        alert(\"\
    medium\");\n    case \"large\":\n        alert(\"large\");\n    case \"extra large\"\
    :\n        alert(\"extra large\");\n    default:\n        alert(\"something else?\"\
    );\n}\n```\n\n去运行这个示例文件吧：你会收到 \"medium\"、\"large\"、\"extra large\" 和 \"something\
    \ else?\" 的弹窗。起初，这可能说不通；所以换个角度想想。我们可以让每个代码块对应多个 case，这意味着如果我们的条件是其中一种 case，代码就会执行：\n\
    \n### 示例 2.22\n\n```\nvar order_size = \"medium\";\n\nswitch (order_size) {\n\
    \    case \"small\":\n        alert(\"small\");\n        break;\n    case \"medium\"\
    :\n    case \"large\":\n    case \"extra large\":\n        alert(\"medium, large,\
    \ or extra large\");\n        break;\n    default:\n        alert(\"something\
    \ else?\");\n}\n```\n\n如果我们现在为每个 case 语句添加一些代码（**不带**任何 break 语句），同样的行为会发生：每个\
    \ case 下的代码会运行，但它会\"穿透\"到下一个 case 语句并执行那里的代码。\n\n## 条件运算符（三元运算符）\n\n还有一种条件语句。假设我们想这样做：\n\
    \n```\nvar temp = 18, // degrees Celsius\n    msg;\n\nif (temp > 10) {\n    msg\
    \ = \"Today was warm\";\n} else {\n    msg = \"Today was cold\";\n}\n```\n\n只为设置一个变量，这似乎是多余的代码。好吧，使用条件运算符，我们可以将其缩短。\n\
    \n### 示例 2.23\n\n```\nvar temp = 18,\n    msg = (temp > 10) ? \"Today was warm\"\
    \ : \"Today was cold\";\n\nalert(msg);\n```\n\n这很简单。在括号里（实际上括号不是必需的，但能提高可读性），放入你的条件语句，后跟一个问号。然后是我们得到的值\n\
    \n> **ROCK* 提示**\n\n你可能会看到条件运算符被称为\"三元运算符\"；\"三元\"只是意味着它接收三个值，就像一元运算符只接收一个一样。不过没人会混淆，因为\
    \ JavaScript 中只有一个三元运算符。\n\n如果条件为真则使用的值。如果条件为假的返回值紧随其后，放在冒号之后。条件运算符非常适合你的 if 语句只有两个可能结果、且每个结果都可以用单行代码表示的情况。\n\
    \n## 循环语句\n\n既然我们已经掌握了条件语句，接下来就可以继续学习循环了。很多时候，你想多次执行相同的操作，每次使用不同的值。正如你可能猜到的，这通常与数组密切相关。让我们来看看\
    \ JavaScript 提供给我们的循环结构。\n\n## For 循环\n\n当你需要构建循环时，for 循环通常是你首选的工具。看看语法，然后我们来讨论。\n\
    \n**示例 2.24**\n\n```\nvar names = [\"Ringo\", \"John\", \"Paul\", \"George\"];\n\
    \nfor (var i = 0; i < names.length; i++) {\n    alert(\"Say hello to \" + names[i]);\n\
    }\n```\n\n我们以关键字 `for` 开始 for 循环；接下来是括号内的三条语句。注意这些语句是如何用分号分隔的，就像所有良好的 JavaScript\
    \ 语句一样。第一条语句设置循环所需的任何变量；在本例中，我们只设置了一个变量：`i = 0`（\"i\" 是 iterator 或 index 的缩写）。第二条语句是返回布尔值的表达式；它在循环执行前进行求值。如果求值为真，循环将执行；如果求值为假，循环将结束。在我们的示例中，我们检查\
    \ `i` 是否小于 names 数组的长度（关于 length 属性的更多内容稍后介绍）。最后一部分执行循环执行后我们想要完成的任何操作；这里，我们将 `i`\
    \ 增加一。在循环内部，我们可以使用方括号表示法来处理数组的值，传入一个索引号——这就是变量 `i` 的用途。\n\n现在，大多数你会看到（和写的）循环结构都会与此非常相似，尽管**括号中的三条语句都是可选的**。然而，确保你真正理解这东西为什么有效；如果你理解每个部分的作用，你的\
    \ for 循环就会更加灵活。例如，谁说我们需要在括号内设置变量？\n\n```\nvar i = 0;\nfor ( ; i < names.length;\
    \ i++) {\n    // whatever\n}\n```\n\n注意，尽管我把变量声明移到了循环外部，我们仍然需要在语句所在位置后面放一个分号。\n\
    \n另一方面，为什么不在第一部分设置两个变量，并将 `names.length` 的值\"缓存\"到变量 `len` 中，然后在第二条语句中使用它（如果你正在处理大型数组，这确实更快）。\n\
    \n```\nfor (var i = 0, len = names.length; i < len; i++) {\n    // whatever\n\
    }\n```\n\n注意，我没有用分号分隔两个变量声明；它必须是一个语句，所以我们用逗号分隔。\n"
