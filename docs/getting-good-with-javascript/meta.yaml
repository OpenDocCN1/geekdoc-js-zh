    # get___


    You''ll probably use the family of get_____ methods most often, for getting different
    pieces of the date. Here are the specifics; you''ll notice that most of the values
    are zero-based:


    | Method Name | Return Value |

    | --- | --- |

    | getDate | day of month, 1 – 31 |

    | getDay | day of week, 0 – 6 |

    | getFullYear | year |

    | getHours | hour, 0 – 23 |

    | getMilliseconds | milliseconds, 0 – 999 |

    | getMinutes | minutes, 0 – 59 |

    | getMonth | month, 0 – 11 |

    | getSeconds | seconds, 0 – 59 |

    | getTime | milliseconds since January 1, 1970 |

    | getTimezoneOffset | difference between GMT and local time, in minutes |


    # set___


    Most of the get methods have a corresponding set method. They each take a single
    parameter, identical to the return value of their get counterpart. Here are your
    options:


    +   - setDate

    - setFullYear

    - setHours

    - setMilliseconds

    - setMinute

    - setMonth

    - setSeconds

    - setTime'
