  md: 'Ever wanted to spice up your websites with a dash of JavaScript, but not known
    where to start? In **Getting Good with JavaScript**, author **Andrew Burgess**
    breaks programming in JavaScript down into easy, straight-forward principles and
    practices.


    This book will introduce you to important programming concepts, show you how to
    write your first scripts, and make you comfortable with JavaScript code. You''ll
    learn :


    +   * The basics of types, variables, and operators

    * Best practices for efficient coding

    * Testing and optimizing your JavaScript

    * Interacting with HTML elements


    **Andrew Burgess** will help you get past the learning curve and get you **Getting
    Good with Javascript**!


    ![](img/b2872544db3ac2167aea931a76af3eea_155_0.png)


    ![](img/b2872544db3ac2167aea931a76af3eea_155_1.png)


