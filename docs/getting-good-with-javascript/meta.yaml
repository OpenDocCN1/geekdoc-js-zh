    # More Basics


    parse


    Sometimes you''ll have a string date that you want to convert to a Date object.
    Date.parse will do that for you. It actually converts it to a number, the number
    of milliseconds since midnight on January 1, 1970 (known as the Unix epoch²).
    Then, you can plug that number into new Date() to get a Date object.


    Example 3.23


    ```

    alert( Date.parse("June 18, 1970") ); // 14529600000

    alert( Date.parse("2010/11/11") ); // 1289451600000


    var d = new Date(Date.parse("1995/04/25")); // Tue Apr 25 1995 00:00:00 GMT-0400
    (EST)

    alert(d);

    ```


    # Array Methods


    Arrays have useful methods as well. Let''s check out some of the common ones!


    join


    This is the reverse of the string''s split method. It will join all the elements
    in the array into a string. You can pass a single parameter to join that will
    be put between each element in the array.


    Example 3.24


    ```

    alert( ["cats", "dogs", "hamsters", "fish"].join('' '') );

    // "cats dogs hamsters fish"

    alert( "this should not have spaces".split(" ").join("_") );

    // "this_should_not_have_spaces"

    ```'
  - '[PAGE 71]


    # More Basics


    Bonus tip here: notice what I did in the last example: I called the join method
    right off the split method call. How''s this work? Well, we know the split method
    returns an array. So we can call a method on that returned array immediately;
    we don''t have to save it to a variable first. This is called *chaining* methods,
    and there''s no limit to how long you can make the method chain: as long as the
    return value of one method has the next method in your chain, you''re gold. Many
    JavaScript frameworks (like jQuery) take advantage of this ability.


    # pop / shift


    These two methods remove and return one value from the array. `pop` gets the last
    item, `shift` gets the first item.


    # Example 3.25


    ```

    var arr = ["cats", "dogs", "hamsters", "fish"];


    console.log( arr.pop() ); // "fish"

    console.log( arr.shift() ); // "cats"

    console.log( arr ); // ["dogs", "hamsters"]

    ```


    # push / unshift


    Predictably, these are the opposite of `pop` and `shift`. `push` adds an item
    to the end of the array, and `unshift` to the beginning.


    # Example 3.26


    ```

    var arr = ["Beta", "Gamma"];


    arr.push("Delta");

    console.log(arr); // ["Beta", "Gamma", "Delta"]

    ```'
