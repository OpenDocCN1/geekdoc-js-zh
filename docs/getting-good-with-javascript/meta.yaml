    # The Basics


    and at the top of every function, declare all the variables you’ll need within
    that file or function (functions: coming soon to a page near you).


    But, what do you do if you don’t know what the value of that variable should be
    when you create it? Maybe it’s a value that the user is going to give you later
    on, or something you need to calculate. It’s still a good idea to declare the
    variable, but you don’t have to give it a value:


    ```

    var name;


    name = "Jim";

    ```


    When you declare the variable without giving it a value, the JavaScript engine
    gives it the default value of **undefined**. Then, you can give it a new value
    later.


    I know I already said it, but it’s important that you understand it: variables
    are just labels for values. This means they are interchangeable for the most part.


