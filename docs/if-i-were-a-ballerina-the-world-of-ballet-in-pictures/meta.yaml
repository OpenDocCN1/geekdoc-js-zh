  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_14_0.png)


    One of the things dancers have to learn is to perform “en pointe”, which is how
    to dance on the tips of their toes. It can be very difficult.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_14_1.png)'
  merge: -1
  pgno: 14
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_15_0.png)'
  merge: -1
  pgno: 15
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_16_0.png)


    Footwork is very important in ballet dancing. You have to develop great lower
    body strength to be able to accomplish the beautiful moves.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_16_1.png)'
  merge: -1
  pgno: 16
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_17_0.png)'
  merge: -1
  pgno: 17
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_18_0.png)


    A ballet dancer’s body has to be flexible. Dancers have to perform special exercises.
    Stretching is an important part of a dancer’s routine.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_18_1.png)'
  merge: -1
  pgno: 18
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_19_0.png)'
  merge: -1
  pgno: 19
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_20_0.png)


    Always check with a trained ballet teacher or parent on what stretching exercises
    are safe for you to do and when.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_20_1.png)'
  merge: -1
  pgno: 20
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_21_0.png)'
  merge: -1
  pgno: 21
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_22_0.png)


    Another very difficult move to master in ballet is the split. Splits are named
    according to whichever foot is extended in front.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_22_1.png)'
  merge: -1
  pgno: 22
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_23_0.png)'
  merge: -1
  pgno: 23
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_24_0.png)


    It is extremely important to be strong and limber to perform the intricate movements
    of ballet. Performing amazing leaps and jumps can take years of practice.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_24_1.png)'
  merge: -1
  pgno: 24
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_25_0.png)'
  merge: -1
  pgno: 25
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_26_0.png)


    Once you have learnt a few steps, it will be fun trying them out with accompanying
    music. See if you can create a routine!


    ![](img/f20c226d2d8012c9e6cd465355b48e54_26_1.png)'
  merge: -1
  pgno: 26
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_27_0.png)'
  merge: -1
  pgno: 27
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_28_0.png)


    The ballet barre is a handrail that is mainly used by dancers to perform warm
    up exercises. Barres can be made of metal, wood or both.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_28_1.png)'
  merge: -1
  pgno: 28
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_29_0.png)'
  merge: -1
  pgno: 29
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_30_0.png)


    If you have already created a routine that you like to perform to a piece of music,
    maybe it''s time to decide on a striking final pose. End with a flourish!


    ![](img/f20c226d2d8012c9e6cd465355b48e54_30_1.png)'
  merge: -1
  pgno: 30
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_31_0.png)'
  merge: -1
  pgno: 31
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_32_0.png)


    Choreographers often design routines where the ballet dancers seem to do impossible
    things. Some dancers look like they can fly.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_32_1.png)'
  merge: -1
  pgno: 32
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_33_0.png)'
  merge: -1
  pgno: 33
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_34_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_34_1.png)


    Ballerinas wear special dresses when performing. See the ruffled, fluffy skirts?
    These are called tutus. They come in a variety of colours like pink, white, blue,
    etc.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_34_2.png)'
  merge: -1
  pgno: 34
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_35_0.png)'
  merge: -1
  pgno: 35
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_36_0.png)


    Striking compositions can be achieved by chorus groups. All the dancers execute
    their movements together and with perfection. This gives the dance a dazzling
    effect.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_36_1.png)'
  merge: -1
  pgno: 36
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_37_0.png)'
  merge: -1
  pgno: 37
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_38_0.png)


    In ballet school, you will be taught the precise methods and techniques for different
    steps. Follow your instructor carefully and be careful to avoid injury.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_38_1.png)'
  merge: -1
  pgno: 38
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_39_0.png)'
  merge: -1
  pgno: 39
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_40_0.png)


    Ballet incorporates movements that are known as pliés and pirouettes. After years
    of training dancers can perform some really amazing movements.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_40_1.png)'
  merge: -1
  pgno: 40
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_41_0.png)'
  merge: -1
  pgno: 41
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_42_0.png)


    When you begin learning to dance, you will probably start by using ballet shoes.
    Later you will be allowed to wear pointe shoes. These have a flat front end to
    protect the dancer’s toes.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_42_1.png)'
  merge: -1
  pgno: 42
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_43_0.png)'
  merge: -1
  pgno: 43
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_44_0.png)


    You may need to train for five years or more to go from ballet shoes to pointe
    shoes.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_44_1.png)'
  merge: -1
  pgno: 44
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_45_0.png)'
  merge: -1
  pgno: 45
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_46_0.png)


    There are five basic positions in ballet that you will have to master first. These
    will be the foundation to learning more complicated moves.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_46_1.png)'
  merge: -1
  pgno: 46
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_47_0.png)'
  merge: -1
  pgno: 47
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_48_0.png)


    Many methods in ballet are named after their originators. There is the Vaganova
    method and the Legat method to name a few.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_48_1.png)'
  merge: -1
  pgno: 48
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_49_0.png)'
  merge: -1
  pgno: 49
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_50_0.png)


    Any jump in ballet requires a strong back and legs and requires focus, timing
    and fitness.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_50_1.png)'
  merge: -1
  pgno: 50
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_51_0.png)'
  merge: -1
  pgno: 51
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_52_0.png)


    Ballet dancers tend to be fussy about their feet as they are the tools of their
    trade!


    ![](img/f20c226d2d8012c9e6cd465355b48e54_52_1.png)'
  merge: -1
  pgno: 52
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_53_0.png)'
  merge: -1
  pgno: 53
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_54_0.png)


    Dancing in the ballet takes many hours of practice. To make it to the top of this
    profession takes time and absolute dedication.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_54_1.png)'
  merge: -1
  pgno: 54
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_55_0.png)'
  merge: -1
  pgno: 55
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_56_0.png)


    A group performance means that every member in the group has to be totally attuned
    to the others in the group so that every move is synchronised.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_56_1.png)'
  merge: -1
  pgno: 56
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_57_0.png)'
  merge: -1
  pgno: 57
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_58_0.png)


    Even when only two people are dancing, there has to be perfect co-ordination between
    them so the dance appears smooth and flawless.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_58_1.png)'
  merge: -1
  pgno: 58
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_59_0.png)'
  merge: -1
  pgno: 59
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_60_0.png)


    Every member in the group has to strike the same pose with the limbs held in the
    exact same position. Otherwise the setup will look awkward.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_60_1.png)'
  merge: -1
  pgno: 60
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_61_0.png)'
  merge: -1
  pgno: 61
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_62_0.png)


    Every movement in ballet conveys a world of emotion. No wonder, this dance form
    is considered one of the most dramatic dance forms in the world.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_62_1.png)'
  merge: -1
  pgno: 62
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_63_0.png)'
  merge: -1
  pgno: 63
- img_proc: true
  md: '![](img/f20c226d2d8012c9e6cd465355b48e54_64_0.png)


    But ballet is not just about the dance moves. Every ballet must have the right
    costume and makeup, otherwise the performance will fall flat.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_64_1.png)'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# GLOSSARY


    | Attuned: | receptive or aware; harmonious |

    | Ballerina: | a female ballet dancer |

    | Ballet: | a form of classical dance with formalised steps and gestures set in
    complex patterns |

    | Barre: | a handrail placed at hip height, used by a dancer to maintain balance
    during practice |

    | Composition: | the arrangement of individual dance steps to form a complete
    movement |

    | En pointe: | a position in ballet where the dancer has to stand on the tips
    of her toes |

    | Flawless: | a dance movement that does not have any defects or mistakes |

    | Flourish: | a dramatic and sweeping gesture |'
  merge: -1
  pgno: 65
- img_proc: true
  md: '**Legat method:** a system of ballet developed by the Russian ballet dancer
    Nikolai Legat


    **Limber:** easily able to bend the limbs


    **Pirouette:** whirling about on one foot or on the points of the toes


    **Plié:** a ballet movement in which the knees are bent while the back is held
    straight


    **Regimen:** a regulated system of exercise


    **Routine:** a performance, or part of it, given regularly by a dancer


    **Splits:** the act of separating the legs while sinking to the floor, until they
    extend at right angles to the body


    **Synchronised:** in dancing, to move at the same rate and exactly together'
