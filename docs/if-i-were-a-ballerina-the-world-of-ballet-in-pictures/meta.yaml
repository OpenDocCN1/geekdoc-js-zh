- md: '## If I Were A... BALLERINA


    The world of ballet in pictures!


    ![](img/f20c226d2d8012c9e6cd465355b48e54_0_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_0_1.png)


    The world of ballet in pictures!


    ![](img/f20c226d2d8012c9e6cd465355b48e54_1_0.png)


    A collection of photographs of the graceful world of ballet in this exciting picture
    book that will take you on a visual journey through the daily life of a ballet
    dancer.


    Children will love reading about the exciting world of being a ballerina!


    ![](img/f20c226d2d8012c9e6cd465355b48e54_2_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_4_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_5_0.png)


    Published in 2011 by North Parade Publishing Ltd.

    4 North Parade

    Bath

    BA1 1LF

    UK


    All rights reserved


    © North Parade Publishing Ltd.


    The world of ballet in pictures!


    ![](img/f20c226d2d8012c9e6cd465355b48e54_6_0.png)


    ## INTRODUCTION


    Welcome to the magical world of ballet! In this book you’ll experience this classical
    and popular dance form in a whole new way—by seeing an array of pictures and reading
    about it at the same time. This book is a pictorial insight into the world of
    the ballet dancer.


    An easy read book designed to acquaint children with the various moves and activities
    that the typical ballet dancer has to undertake in order to be successful.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_9_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_10_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_10_1.png)


    In ballet you have to move your hands and feet in just the right manner. The movements
    might look easy, but are pretty tough to master. It takes a lot of practice.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_10_2.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_11_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_12_0.png)


    Dancers wear special shoes or slippers. These slippers are very flexible and have
    thin soles. They help the dancer perform the difficult moves.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_12_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_13_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_14_0.png)


    One of the things dancers have to learn is to perform “en pointe”, which is how
    to dance on the tips of their toes. It can be very difficult.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_14_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_15_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_16_0.png)


    Footwork is very important in ballet dancing. You have to develop great lower
    body strength to be able to accomplish the beautiful moves.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_16_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_17_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_18_0.png)


    A ballet dancer’s body has to be flexible. Dancers have to perform special exercises.
    Stretching is an important part of a dancer’s routine.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_18_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_19_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_20_0.png)


    Always check with a trained ballet teacher or parent on what stretching exercises
    are safe for you to do and when.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_20_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_21_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_22_0.png)


    Another very difficult move to master in ballet is the split. Splits are named
    according to whichever foot is extended in front.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_22_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_23_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_24_0.png)


    It is extremely important to be strong and limber to perform the intricate movements
    of ballet. Performing amazing leaps and jumps can take years of practice.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_24_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_25_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_26_0.png)


    Once you have learnt a few steps, it will be fun trying them out with accompanying
    music. See if you can create a routine!


    ![](img/f20c226d2d8012c9e6cd465355b48e54_26_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_27_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_28_0.png)


    The ballet barre is a handrail that is mainly used by dancers to perform warm
    up exercises. Barres can be made of metal, wood or both.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_28_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_29_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_30_0.png)


    If you have already created a routine that you like to perform to a piece of music,
    maybe it''s time to decide on a striking final pose. End with a flourish!


    ![](img/f20c226d2d8012c9e6cd465355b48e54_30_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_31_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_32_0.png)


    Choreographers often design routines where the ballet dancers seem to do impossible
    things. Some dancers look like they can fly.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_32_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_33_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_34_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_34_1.png)


    Ballerinas wear special dresses when performing. See the ruffled, fluffy skirts?
    These are called tutus. They come in a variety of colours like pink, white, blue,
    etc.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_34_2.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_35_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_36_0.png)


    Striking compositions can be achieved by chorus groups. All the dancers execute
    their movements together and with perfection. This gives the dance a dazzling
    effect.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_36_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_37_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_38_0.png)


    In ballet school, you will be taught the precise methods and techniques for different
    steps. Follow your instructor carefully and be careful to avoid injury.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_38_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_39_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_40_0.png)


    Ballet incorporates movements that are known as pliés and pirouettes. After years
    of training dancers can perform some really amazing movements.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_40_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_41_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_42_0.png)


    When you begin learning to dance, you will probably start by using ballet shoes.
    Later you will be allowed to wear pointe shoes. These have a flat front end to
    protect the dancer’s toes.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_42_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_43_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_44_0.png)


    You may need to train for five years or more to go from ballet shoes to pointe
    shoes.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_44_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_45_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_46_0.png)


    There are five basic positions in ballet that you will have to master first. These
    will be the foundation to learning more complicated moves.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_46_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_47_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_48_0.png)


    Many methods in ballet are named after their originators. There is the Vaganova
    method and the Legat method to name a few.


    ![](img/f20c226d2d8012c9e6cd465355b48e54_48_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_49_0.png)'
  mdcn: '

    ## 如果我是一位……芭蕾舞者


    用图片展现芭蕾世界！


    ![](img/f20c226d2d8012c9e6cd465355b48e54_0_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_0_1.png)


    用图片展现芭蕾世界！


    ![](img/f20c226d2d8012c9e6cd465355b48e54_1_0.png)


    这本精彩的图画书汇集了优雅芭蕾世界的照片集，将带你开启一场视觉之旅，探索芭蕾舞者的日常生活。


    孩子们会喜欢阅读关于成为芭蕾舞者的精彩世界！


    ![](img/f20c226d2d8012c9e6cd465355b48e54_2_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_4_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_5_0.png)


    由North Parade Publishing Ltd.于2011年出版。

    North Parade 4号

    巴斯

    BA1 1LF

    英国


    版权所有


    © North Parade Publishing Ltd.


    用图片展现芭蕾世界！


    ![](img/f20c226d2d8012c9e6cd465355b48e54_6_0.png)


    ## 引言


    欢迎来到神奇的芭蕾世界！在这本书中，你将以一种全新的方式体验这种古典且受欢迎的舞蹈形式——通过同时观看一系列图片并阅读相关文字。本书以图文并茂的形式，深入探索芭蕾舞者的世界。


    这是一本轻松易读的书，旨在让孩子们熟悉典型的芭蕾舞者为了取得成功而必须承担的各种动作和活动。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_9_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_10_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_10_1.png)


    在芭蕾中，你必须以恰到好处的方式移动手脚。动作可能看起来简单，但掌握起来却相当困难。这需要大量的练习。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_10_2.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_11_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_12_0.png)


    舞者穿着特殊的鞋子或舞鞋。这些舞鞋非常柔软，鞋底很薄。它们帮助舞者完成高难度的动作。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_12_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_13_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_14_0.png)


    舞者必须学习的事情之一是表演“足尖站立”，即如何用脚趾尖跳舞。这可能非常困难。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_14_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_15_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_16_0.png)


    步法在芭蕾舞中非常重要。你需要发展强大的下肢力量，才能完成优美的动作。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_16_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_17_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_18_0.png)


    芭蕾舞者的身体必须具有柔韧性。舞者必须进行专门的练习。拉伸是舞者日常训练的重要组成部分。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_18_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_19_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_20_0.png)


    务必咨询受过专业训练的芭蕾老师或父母，了解哪些拉伸练习对你来说是安全的，以及何时进行。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_20_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_21_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_22_0.png)


    芭蕾中另一个需要掌握的高难度动作是劈叉。劈叉的名称取决于哪只脚向前伸展。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_22_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_23_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_24_0.png)


    要完成芭蕾舞中复杂的动作，保持强壮和灵活极其重要。表演惊人的跳跃可能需要多年的练习。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_24_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_25_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_26_0.png)


    一旦你学会了一些舞步，配合音乐尝试它们会很有趣。看看你能否编排一套动作！


    ![](img/f20c226d2d8012c9e6cd465355b48e54_26_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_27_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_28_0.png)


    芭蕾把杆是一种扶手，主要供舞者进行热身练习使用。把杆可以由金属、木材或两者结合制成。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_28_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_29_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_30_0.png)


    如果你已经编排了一套喜欢的、配合某首音乐表演的动作，也许是时候决定一个引人注目的结束姿势了。以华丽的姿态结束！


    ![](img/f20c226d2d8012c9e6cd465355b48e54_30_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_31_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_32_0.png)


    编舞家经常设计一些芭蕾舞者似乎完成不可能动作的套路。有些舞者看起来像是会飞。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_32_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_33_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_34_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_34_1.png)


    芭蕾舞者表演时穿着特殊的裙子。看到那些褶皱、蓬松的裙子了吗？这些被称为芭蕾舞裙。它们有各种颜色，如粉色、白色、蓝色等。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_34_2.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_35_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_36_0.png)


    群舞可以呈现出惊艳的构图。所有舞者整齐划一、完美地执行动作。这赋予了舞蹈炫目的效果。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_36_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_37_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_38_0.png)


    在芭蕾舞学校，你将学习不同舞步的精确方法和技巧。仔细遵循指导老师的要求，并注意避免受伤。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_38_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_39_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_40_0.png)


    芭蕾包含被称为屈伸和旋转的动作。经过多年训练，舞者可以表演一些真正惊人的动作。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_40_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_41_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_42_0.png)


    当你开始学习跳舞时，你可能会先使用芭蕾软鞋。之后，你将被允许穿足尖鞋。这些鞋的前端是平的，以保护舞者的脚趾。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_42_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_43_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_44_0.png)


    你可能需要训练五年或更长时间，才能从芭蕾软鞋过渡到足尖鞋。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_44_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_45_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_46_0.png)


    首先，你必须掌握芭蕾的五个基本位置。这些将是学习更复杂动作的基础。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_46_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_47_0.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_48_0.png)


    芭蕾的许多方法都是以它们的创始人命名的。例如有瓦冈诺娃体系和列加特体系等。


    ![](img/f20c226d2d8012c9e6cd465355b48e54_48_1.png)


    ![](img/f20c226d2d8012c9e6cd465355b48e54_49_0.png)

