    ## JavaScript Development Tools


    One of major strengths of JavaScript is that it does not require expensive development
    tools. You can start with a simple text editor such as Notepad.


    To make our life simpler, various vendors have come up with nice JavaScript tools.
    Some of them are


    - **Microsoft FrontPage**: Microsoft has developed a popular HTML editor called
    FrontPage. FrontPage also provides web developers with a number of tools to assist
    in the creation.

    - **Macromedia Dreamweaver MX**: Macromedia Dreamweaver MX is a popular HTML and
    JavaScript editor in the professional web crowd. It provides several handy JavaScript
    components, integrates well with databases, and conforms to new standards as XHTML
    and XML.

    - **Macromedia HomeSite 5**: HomeSite 5 is a well-liked HTML and JavaScript editor
    from Macromedia that can be used to manage personal websites.


    ## Where is JavaScript Today ?


    The ECMAScript Edition 5 standard will be the first update to be released in over
    four years. JavaScript 2.0 conforms to Edition 5 of the ECMAScript standard, and
    the difference between the two is extremely minor.


    The specification for JavaScript 2.0 can be found on the following site: `http://www.ecmascript.org/`


    Today, Netscape''s JavaScript and Microsoft''s JScript conform to the ECMAScript
    standard, although both the languages still support the features that are not
    part of the standard.


    # Syntax


    JavaScript can be implemented using JavaScript statements that are placed within
    the `<script>... </script>` HTML tags in a web page.


    You can place the `<script>` tags, containing your JavaScript, anywhere within
    your web page, but it is normally recommended that you should keep it within the
    `<head>` tags.


    The `<script>` tag alerts the browser program to start interpreting all the text
    between these tags as a script.


    ```

    <script ...>


    JavaScript code


    </script>

    ```


    The script tag takes two important attributes:


    - **Language**: This attribute specifies what scripting language you are using.
    Typically, its value will be `javascript`. Although recent versions of HTML (and
    XHTML, its successor) have phased out the use of this attribute.

