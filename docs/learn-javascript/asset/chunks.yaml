    # 概述


    ## 什么是 JavaScript？


    JavaScript 是一种动态计算机编程语言。它是轻量级的，最常用作网页的一部分，其实现方式允许客户端脚本与用户交互并创建动态页面。它是一种具有面向对象能力的解释型编程语言。


    JavaScript 最初被称为 `LiveScript`，但 Netscape 将其更名为 JavaScript，可能是因为 Java 带来的轰热。JavaScript
    于 1995 年以 `LiveScript` 的名称在 Netscape 2.0 中首次出现。该语言通用核心已嵌入 Netscape、Internet Explorer
    和其他网络浏览器中。


    `ECMA-262 Specification` 定义了 JavaScript 核心语言的标准版本。


    - JavaScript 是一种轻量级的解释型编程语言。

    - 为创建以网络中心的应用程序而设计。

    - 与 Java 互补并集成。

    - 与 HTML 互补并集成。

    - 开放且跨平台


    ## 客户端 JavaScript


    客户端 JavaScript 是该语言最常见的形式。脚本应该包含在 HTML 中或通过 HTML 引用。


    ## JavaScript 的优势


    使用 JavaScript 的优点是：


    - **减少服务器负载**

    - **给用户提供即时反馈**

    - **增强交互性**

    - **更丰富的界面**


    ## JavaScript 的局限性


    我们不能将 JavaScript 视为完全


    - **客户端**

    - **多线程或多处理器能力**：JavaScript 不具备任何多线程或多处理器能力。


    JavaScript 是一种轻量级的解释型编程语言，允许你使用简单的文本编辑器在静态页面中构建交互。


    ## JavaScript 开发工具


    JavaScript 的主要优点之一是不需要贵的开发工具。你可以从 Notepad 等简单的文本编辑器开始。


    为了让生活更简单，各种厂商提供了优秀的 JavaScript 工具：


    - **Microsoft FrontPage**：微软开发了一个名为 FrontPage 的流行 HTML 编辑器。FrontPage 还为网页开发者提供了许多辅助创建的工具。

    - **Macromedia Dreamweaver MX**：专业网页领域流行的 HTML 和 JavaScript 编辑器。它提供了许多实用的 JavaScript
    组件，与数据库良好集成，并符合 XHTML 和 XML 等标准。

    - **Macromedia HomeSite 5**：HomeSite 5 是 Macromedia 受欢迎的 HTML 和 JavaScript 编辑器，可用于个人网站。


    ## 现在的 JavaScript？


    ECMAScript 第 5 版标准是多年来的首次更新。JavaScript 2.0 符合 ECMAScript 第 5 版标准，两者之间的差异极小。


    JavaScript 2.0 的规范可以在以下网站找到：`http://www.ecmascript.org/`


    今天，Netscape 的 JavaScript 和微软的 JScript 都符合 ECMAScript 标准，尽管这两种语言仍然支持标准之外的功能。


    # 语法


    JavaScript 可以通过放在网页 `<script>... </script>` HTML 标签内的 JavaScript 语句来实现。


    你可以将包含 JavaScript 的 `<script>` 标签放置在网页的任何位置，但通常建议将其保留在 `<head>` 标签内。


    `<script>` 标签通知浏览器开始将这些标签之间的所有文本视为脚本。


    ```

    <script ...>


    JavaScript 代码


    </script>

    ```


    script 标签带有两个重要的属性：


    - **Language**：此属性指定你正在使用的脚本语言。通常，它的值为 `javascript`。尽管最新版本的 HTML（及其继任者 XHTML）已经废弃了该属性的使用。

    '
- fmt: '

    - **Type** − This attribute is what is now recommended to indicate the scripting
    language in use and its value should be set to "text/javascript".


    So your JavaScript segment will look like −


    ```html

    <script language = "javascript" type = "text/javascript">

    JavaScript code

    </script>

    ```


    ## Your First JavaScript Code


    Let us take a sample example to print out "Hello World". We added an optional
    HTML comment that surrounds our JavaScript code. This is to save our code from
    a browser that does not support JavaScript. The comment ends with `//-->`. Here
    `//` signifies a comment in JavaScript, so we add that to prevent a browser from
    reading the end of the HTML comment as a piece of JavaScript code. Next, we call
    a function `document.write` which writes a string into our HTML document.


    This function can be used to write text, HTML, or both. Take a look at the following
    code.


    ```html

    <html>

    <body>

    <script  language  =  "javascript"  type  =  "text/javascript">

    <!--

    document.write("Hello World!")

    //-->

    </script>

    </body>

    </html>

    ```


    This code will produce the following result −


    Hello World!


    ## Whitespace and Line Breaks


    JavaScript ignores spaces, tabs, and newlines that appear in JavaScript programs.
    You can use spaces, tabs, and newlines freely in your program and you are free
    to format and indent your programs in a neat and consistent way that makes the
    code easy to read and understand.


    ## Semicolons are Optional


    Simple statements in JavaScript are generally followed by a semicolon character,
    just as they are in C, C++, and Java. JavaScript, however, allows you to omit
    this semicolon if each of your statements are placed on a separate line. For example,
    the following code could be written without semicolons.


    ```html

    <script  language  =  "javascript"  type  =  "text/javascript">

    <!--

    var1 =  10

    var2 =  20

    //-->

    </script>

    ```


    But when formatted in a single line as follows, you must use semicolons −


    ```html

    <script  language  =  "javascript"  type  =  "text/javascript">

    <!--

    var1 =  10; var2 =  20;

    //-->

    </script>

    ```


    **Note** − It is a good programming practice to use semicolons.


    ## Case Sensitivity


    JavaScript is a case-sensitive language. This means that the language keywords,
    variables, function names, and any other identifiers must always be typed with
    a consistent capitalization of letters.


    So the identifiers `Time` and `TIME` will convey different meanings in JavaScript.


    **NOTE** − Care should be taken while writing variable and function names in JavaScript.


    ## Comments in JavaScript


    JavaScript supports both C-style and C++-style comments, Thus −


    - Any text between a `//` and the end of a line is treated as a comment and is
    ignored by JavaScript.

    - Any text between the characters `/*` and `*/` is treated as a comment. This
    may span multiple lines.

    - JavaScript also recognizes the HTML comment opening sequence `<!--`. JavaScript
    treats this as a single-line comment, just as it does the `//` comment.

    - The HTML comment closing sequence `-->` is not recognized by JavaScript so it
    should be written as `-->`.


    ### Example


    The following example shows how to use comments in JavaScript.


    ```html

    <script  language  =  "javascript"  type  =  "text/javascript">

    <!--

    // This is a comment. It is similar to comments in C++

    /*

    * This is a multi-line comment in JavaScript

    * It is very similar to comments in C Programming

    */

    //-->

    </script>

    ```


    # Enabling JavaScript in Browsers


    All the modern browsers come with built-in support for JavaScript. Frequently,
    you may need to enable or disable this support manually. This chapter explains
    the procedure of enabling and disabling JavaScript support in your browsers: Internet
    Explorer, Firefox, chrome, and Opera.


    ## JavaScript in Internet Explorer


    Here are simple steps to turn on or turn off JavaScript in your Internet Explorer
    −


    - Follow **Tools → Internet Options** from the menu.

    - Select **Security** tab from the dialog box.

    - Click the **Custom Level** button.

    - Scroll down till you find **Scripting** option.

    - Select *Enable* radio button under **Active scripting**.

    - Finally click OK and come out.


    To disable JavaScript support in your Internet Explorer, you need to select **Disable**
    radio button under **Active scripting**.


    ## JavaScript in Firefox


    Here are the steps to turn on or turn off JavaScript in Firefox −


    - Open a new tab → type `about: config` in the address bar.

    - Then you will find the warning dialog. Select **I’ll be careful, I promise!**

    - Then you will find the list of **configure options** in the browser.

    - In the search bar, type `javascript.enabled`.

    - There you will find the option to enable or disable javascript by right-clicking
    on the value of that option → **select toggle**.


    If `javascript.enabled` is true; it converts to false upon clicking **toogle**.
    If javascript is disabled; it gets enabled upon clicking toggle.


    ## JavaScript in Chrome


    Here are the steps to turn on or turn off JavaScript in Chrome −


    - Click the Chrome menu at the top right hand corner of your browser.

    - Select **Settings**.

    - Click **Show advanced settings**.

    - Script at the end of the page.

    - Under the **Privacy** section, click the Content.

    - In the "Javascript" section, select "Do not allow any site to run or Allow all
    sites to run".


    ## JavaScript in Opera


    Here are the steps to turn on or turn off JavaScript in Opera −


    - Follow **Tools → Preferences** from the menu.

    - Select **Advanced** tab from the dialog box.

    - Click the **Content** button.

    - Scroll down till you find **Scripting** option.

    - Select *Enable* radio button under **Active scripting**.

    - Finally click OK and come out.


    To disable JavaScript support in your Opera, you should not select the **Enable
    JavaScript checkbox**.


    If you have to do something important using JavaScript, then you can display a
    warning message to the user using `<noscript>` tags.


    You can add a `<noscript>` block immediately after the script as follows −


    ```html

    <html>

    <body>

    <script  language  =  "javascript"  type  =  "text/javascript">

    <!--

    document.write("Hello World!")

    //-->

    </script>

    <noscript>

    Sorry...JavaScript is needed to go ahead.

    </noscript>

    </body>

    </html>

    ```


    Now, if the user''s browser does not support JavaScript or JavaScript is not enabled,
    then the message from `<noscript>` will be displayed on the screen.


    # Placement in HTML File


    There is a flexibility given to include JavaScript anywhere in an HTML document.
    However the most preferred ways to include JavaScript in an HTML file are as follows


    - Script in `<head>...</head>` section.

    - Script in `<body>...</body>` section.

    - Script in `<body>...</body>` and `<head>...</head>` sections.

    - Script in an external file and then include in `<head>...</head>` section.


    In the following section, we will see how we can place JavaScript in an HTML file
    in different ways.


    ## JavaScript in `<head>.../</head>` section


    If you want to have a script run on some event, such as when a user clicks somewhere,
    then you will place that script in the head as follows


    ```html

    <html>

    <head>

    <script  type  =  "text/javascript">

    <!--

    function sayHello() {

    alert("Hello World")

    }

    //-->

    </script>

    </head>

    <body>

    <input  type  ="button" onclick  ="sayHello()" value  ="Say Hello" />

    </body>

    </html>

    ```


    ## JavaScript in `<body>...</body>` section


    If you need a script to run as the page loads so that the script generates content
    in the page, then the script goes in the `<body>` portion of the document. In
    this case, you would not have any function defined using JavaScript. Take a look
    at the following code.


    ```html

    <html>

    <head>

    </head>

    <body>

    <script  type  =  "text/javascript">

    <!--

    document.write("Hello World")

    //-->

    </script>

    <p>This is web page body </p>

    </body>

    </html>

    ```


    This code will produce the following results −

