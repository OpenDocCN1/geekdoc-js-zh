    ;\n}\ndocument.write(\"You will be redirected.\");\nsetTimeout('Redirect()', 10000);\n\
    //-->\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\n### 输出\n\n你将被重定向到\
