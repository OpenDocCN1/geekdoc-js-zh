    # Overview


    ## What is JavaScript ?


    JavaScript is a dynamic computer programming language. It is lightweight and most
    commonly used as a part of web pages, whose implementations allow client-side
    script to interact with the user and make dynamic pages. It is an interpreted
    programming language with object-oriented capabilities.


    JavaScript was first known as **LiveScript,** but Netscape changed its name to
    JavaScript, possibly because of the excitement being generated by Java. JavaScript
    made its first appearance in Netscape 2.0 in 1995 with the name **LiveScript**.
    The general-purpose core of the language has been embedded in Netscape, Internet
    Explorer, and other web browsers.


    The **ECMA-262 Specification** defined a standard version of the core JavaScript
    language.


    *   JavaScript is a lightweight, interpreted programming language.


    *   Designed for creating network-centric applications.


    *   Complementary to and integrated with Java.


    *   Complementary to and integrated with HTML.


    *   Open and cross-platform


    ## Client-Side JavaScript


    Client-side JavaScript is the most common form of the language. The script should
    be included in or referenced by an HTML document for the code to be interpreted
    by the browser.


    It means that a web page need not be a static HTML, but can include programs that
    interact with the user, control the browser, and dynamically create HTML content.


    The JavaScript client-side mechanism provides many advantages over traditional
    CGI server-side scripts. For example, you might use JavaScript to check if the
    user has entered a valid e-mail address in a form field.


    The JavaScript code is executed when the user submits the form, and only if all
    the entries are valid, they would be submitted to the Web Server.


    JavaScript can be used to trap user-initiated events such as button clicks, link
    navigation, and other actions that the user initiates explicitly or implicitly.


    ## Advantages of JavaScript


    The merits of using JavaScript are −


    *   **Less server interaction** − You can validate user input before sending the
    page off to the server. This saves server traffic, which means less load on your
    server.


    *   **Immediate feedback to the visitors** − They don''t have to wait for a page
    reload to see if they have forgotten to enter something.


    *   **Increased interactivity** − You can create interfaces that react when the
    user hovers over them with a mouse or activates them via the keyboard.


    *   **Richer interfaces** − You can use JavaScript to include such items as drag-and-drop
    components and sliders to give a Rich Interface to your site visitors.


    ## Limitations of JavaScript


    We cannot treat JavaScript as a full-fledged programming language. It lacks the
    following important features −


    *   Client-side JavaScript does not allow the reading or writing of files. This
    has been kept for security reason.


    *   JavaScript cannot be used for networking applications because there is no
    such support available.


    *   JavaScript doesn''t have any multi-threading or multiprocessor capabilities.


    Once again, JavaScript is a lightweight, interpreted programming language that
    allows you to build interactivity into otherwise static HTML pages.


    ## JavaScript Development Tools


    One of major strengths of JavaScript is that it does not require expensive development
    tools. You can start with a simple text editor such as Notepad. Since it is an
    interpreted language inside the context of a web browser, you don''t even need
    to buy a compiler.


    To make our life simpler, various vendors have come up with very nice JavaScript
    editing tools. Some of them are listed here −


    *   **Microsoft FrontPage** − Microsoft has developed a popular HTML editor called
    FrontPage. FrontPage also provides web developers with a number of JavaScript
    tools to assist in the creation of interactive websites.


    *   **Macromedia Dreamweaver MX** − Macromedia Dreamweaver MX is a very popular
    HTML and JavaScript editor in the professional web development crowd. It provides
    several handy prebuilt JavaScript components, integrates well with databases,
    and conforms to new standards such as XHTML and XML.


    *   **Macromedia HomeSite 5** − HomeSite 5 is a well-liked HTML and JavaScript
    editor from Macromedia that can be used to manage personal websites effectively.


    ## Where is JavaScript Today ?


    The ECMAScript Edition 5 standard will be the first update to be released in over
    four years. JavaScript 2.0 conforms to Edition 5 of the ECMAScript standard, and
    the difference between the two is extremely minor.


    The specification for JavaScript 2.0 can be found on the following site: **http://www.ecmascript.org/**


    Today, Netscape''s JavaScript and Microsoft''s JScript conform to the ECMAScript
    standard, although both the languages still support the features that are not
    a part of the standard.


    # Syntax


    JavaScript can be implemented using JavaScript statements that are placed within
    the **<script>... </script>** HTML tags in a web page.


    You can place the **<script>** tags, containing your JavaScript, anywhere within
    your web page, but it is normally recommended that you should keep it within the **<head>** tags.


    The <script> tag alerts the browser program to start interpreting all the text
    between these tags as a script. A simple syntax of your JavaScript will appear
    as follows.


    <script ...>


    JavaScript code


    </script>


    The script tag takes two important attributes −


    *   **Language** − This attribute specifies what scripting language you are using.
    Typically, its value will be javascript. Although recent versions of HTML (and
    XHTML, its successor) have phased out the use of this attribute.'
