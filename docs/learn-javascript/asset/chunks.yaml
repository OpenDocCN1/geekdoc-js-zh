    \ c = a / b;\n    }\n  }\n  catch ( e ) {\n    alert(\"Error: \"  + e );\n  }\n\
    }\n//-->\n</script>\n</head>\n<body>\n<p>点击以下按钮查看结果：</p>\n<form>\n  <input type\
    \ = \"button\" value = \"Click Me\" onclick = \"myFunc();\" />\n</form>\n</body>\n\
    </html>\n```\n\n### 输出\n\n你可以使用字符串、整数、布尔值或对象在一个函数中抛出异常，然后你可以像上面那样在同一个函数中捕获该异常，或者在另一个函数中使用\
    \ `try...catch` 块来捕获它。\n\n## onerror() 方法\n\n`onerror` 事件处理器是 JavaScript 中促进错误处理的第一功能。当页面上发生异常时，`error`\
    \ 事件就会在 `window` 对象上触发。\n\n```html\n<html>\n<head>\n<script type = \"text/javascript\"\
    >\n<!--\nwindow.onerror = function () {\n  alert(\"发生了一个错误.\");\n}\n//-->\n</script>\n\
    </head>\n<body>\n<p>点击以下按钮查看结果：</p>\n<form>\n  <input type = \"button\" value\
    \ = \"Click Me\" onclick = \"myFunc();\" />\n</form>\n</body>\n</html>\n```\n\n\
    ### 输出\n\n`onerror` 事件处理器提供三个信息来识别错误的确切性质——\n\n- `Error message` − 浏览器为给定错误显示的相同消息\n\
    - `URL` − 发生错误的文件\n- `Line number` − 给定 URL 中导致错误的行号\n\n这里是显示如何提取这些信息的示例。\n\n\
    ### 示例\n\n```html\n<html>\n<head>\n<script type = \"text/javascript\">\n<!--\n\
    window.onerror = function (msg, url, line) {\n  alert(\"Message : \"  + msg );\n\
    \  alert(\"url : \"  + url );\n  alert(\"Line number : \"  + line );\n}\n//-->\n\
    </script>\n</head>\n<body>\n<p>点击以下按钮查看结果：</p>\n<form>\n  <input type = \"button\"\
    \ value = \"Click Me\" onclick = \"myFunc();\" />\n</form>\n</body>\n</html>\n\
    ```\n\n### 输出\n\n你可以用你认为更好的任何方式显示提取的信息。\n\n你可以使用如下所示的 `onerror` 方法在加载图像时出现任何问题时显示错误消息。\n\
    \n```html\n<img src=\"myimage.gif\" onerror=\"alert('加载图像时发生错误.')\" />\n```\n\n\
    你可以在许多 HTML 标签上使用 `onerror`，在发生错误时显示适当的消息。\n\n# 表单验证\n\n表单验证通常发生在服务器端，在客户端输入了所有必要数据并点击“提交”按钮之后。如果客户端输入的数据错误或简单缺失，服务器将把所有数据发回客户端，并要求使用正确的信息重新提交表单。这是一个非常冗长的过程，过去给服务器带来了很大负担。\n\
    \nJavaScript 提供了一种在将数据发送到服务器之前在客户端验证数据的方法。表单验证通常执行以下功能：\n\n- `基础验证` ― 首先，必须检查表单以确保必填字段已填写。\n\
    - `数据验证` ― 其次，必须检查输入数据的正确性。\n\n### 示例\n\n让我们看看如何进行基础验证。\n\n```html\n<html>\n<head>\n\
    <title>表单验证</title>\n<script type = \"text/javascript\">\n<!--\n// 验证函数将在这里\n\
    function validate() {\n  if( myform.Name.value == \"\" ) {\n    alert(\"请提供姓名!\"\
    );\n    document.myForm.Name.focus() ;\n    return false;\n  }\n  if( myform.EMail.value\
    \ == \"\" ) {\n    alert(\"请提供电子邮件!\");\n    document.myForm.EMail.focus() ;\n\
    \    return false;\n  }\n  if( myform.Zip.value == \"\" || isNaN( document.myForm.Zip.value\
    \ ) || document.myForm.Zip.value.length != 5 ) {\n    alert(\"请提供格式正确的邮编.\");\n\
    \    document.myForm.Zip.focus() ;\n    return false;\n  }\n  if( myform.Country.value\
    \ == \"-1\" ) {\n    alert(\"请提供国家!\");\n    return false;\n  }\n  return( true\
    \ );\n}\n//-->\n</script>\n</head>\n<body>\n<form name=\"myForm\" action=\"/cgi-test.cgi\"\
    \ onsubmit=\"return(validate());\" method=\"post\" cellpadding=\"2\" cellspacing=\"\
    0\">\n  <table>\n    <tr>\n      <td>姓名</td>\n      <td><input type=\"text\" name=\"\
    Name\"></td>\n    </tr>\n    <tr>\n      <td>电子邮件</td>\n      <td><input type=\"\
    text\" name=\"EMail\"></td>\n    </tr>\n    <tr>\n      <td>邮编</td>\n      <td><input\
    \ type=\"text\" name=\"Zip\"></td>\n    </tr>\n    <tr>\n      <td>国家</td>\n \
    \     <td>\n        <select name=\"Country\">\n          <option value=\"-1\"\
    >[选择]</option>\n          <option value=\"1\">美国</option>\n          <option value=\"\
    2\">英国</option>\n          <option value=\"3\">印度</option>\n        </select>\n\
    \      </td>\n    </tr>\n  </table>\n  <input type=\"submit\" value=\"提交\" />\n\
    </form>\n</body>\n</html>\n```\n\n### 输出\n\n现在我们将看到如何在提交数据到 Web 服务器之前验证输入的表单数据。下面的示例演示了如何验证输入的电子邮件地址。电子邮件地址必须包含一个\
    \ `@` 符号和一个点（.）。此外，`@` 不能是电子邮件地址的第一个字符，且最后一个点在 `@` 之后至少有一个字符。\n\n### 示例\n\n尝试以下代码进行电子邮件验证。\n\
    \n```javascript\n<script type = \"text/javascript\">\n<!--\nfunction validateEmail()\
    \ {\n  var emailID = document.myForm.EMail.value;\n  atpos = emailID.indexOf(\"\
    @\");\n  dotpos = emailID.lastIndexOf(\".\");\n  if (atpos < 1 || ( dotpos - atpos\
    \ < 2 )) {\n    alert(\"请输入正确的电子邮件 ID\");\n    document.myForm.EMail.focus() ;\n\
    \    return false;\n  }\n  return( true );\n}\n//-->\n</script>\n```\n\n## 动画\n\
    \n你可以使用 JavaScript 创建复杂的动画，包含但不限于以下元素——\n\n- 烟花\n- 淡入淡出\n- 滚入或滚出\n- 页面进入或页面退出\n\
    - 对象移动\n\n你可能对现有的 JavaScript 动画库感兴趣：**Script.Aculo.us**。\n\n"
