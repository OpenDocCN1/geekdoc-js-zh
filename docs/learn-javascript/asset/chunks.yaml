    \ script | 当浏览器一直在获取媒体数据，但在整个媒体文件获取完成之前停止时触发 |\n| `ontimeupdate` | script | 当媒体改变其播放位置时触发\
    \ |\n| `onundo` | script | 当文档执行撤销时触发 |\n| `onunload` | script | 当用户离开文档时触发 |\n\
    | `onvolumechange` | script | 当媒体改变音量或当音量被设置为“静音”时触发 |\n| `onwaiting` | script\
    \ | 当媒体停止播放但预计恢复时触发 |\n\n# JavaScript 与 Cookies\n\n## 什么是 Cookie？\n\n 浏览器和服务器使用\
    \ HTTP 协议进行通信，而 HTTP 是一个无状态协议。但对于商业网站来说，需要在不同页面之间维持会话信息。例如，一个用户的注册在完成多个页面后才结束。但如何在所有网页中维持该用户的会话信息呢？\n\
    \n在许多情况下，使用 cookie 是记忆和跟踪偏好、购买、佣金以及为了改善访问体验或网站统计所需的其他信息的有效方法。\n\n## 它是如何工作的？\n\
    \n你的服务器以 cookie 的形式向访问者的浏览器发送一些数据。浏览器可能会接受该 cookie。如果接受，它将以纯文记录存储在访问者的硬盘上。现在，当访问者到达你网站的另一个页面时，浏览器会将相同的\
    \ cookie 发送到服务器进行检索。一旦检索到，你的服务器就知道/记得之前存储了什么。\n\nCookies 是包含 5 个变长字段的纯文数据记录——\n\
    \n- `Expires` — Cookie 过期日期。如果为空，Cookie 将在访问者退出浏览器时过期。\n- `Domain` — Cookie 的域名。\n\
    - `Path` — 设置 Cookie 的目录或路径。如果为空，则适用于当前页面。\n- `Secure` — 如果此字段包含“secure”字样，则 Cookie\
    \ 只能通过安全连接检索。\n- `Name=Value` — Cookie 最初以键值对的形式设计，用于 CGI 编程。Cookie 中的数据会在浏览器和服务器之间自动传输，因此服务器上的\
    \ CGI 脚本可以读取和写入。JavaScript 使用 `Document` 对象的 `cookie` 属性来创建、修改和删除适用于页面的 Cookie。\n\
    \n## 存储 Cookie\n\n创建 Cookie 的简单方法是给 `document.cookie` 赋值一个字符串，如下：\n\n```javascript\n\
    document.cookie = \"key1 = value1;key2 = value2;expires = date\";\n```\n\n在这里\
    \ `expires` 属性是可选的。如果你提供了有效的日期或时间，Cookie 将在该之后过期。\n\n**注意** — Cookie 值可能包含分号、逗号或空格。由于这些原因，你可能需要在存储\
    \ Cookie 之前使用 `escape()` 函数对值进行编码。如果你这样做，在读取 Cookie 值时也使用相应的 `unescape()` 函数。\n\
    \n### 示例\n\n尝试以下代码。它会在输入 cookie 中设置用户名称。\n\n```html\n<html>\n<head>\n<script type=\"\
    text/javascript\">\nfunction WriteCookie() {\n  if(document.myform.customer.value\
    \ == \"\") {\n    alert(\"请输入某些值！\");\n    return;\n  }\n  cookievalue = escape(document.myform.customer.value)\
    \ + \";\";\n  document.cookie = \"name=\" + cookievalue;\n  document.write (\"\
    设置的 Cookie : \" + \"name=\" + cookievalue );\n}\n}\n</script>\n</head>\n<body>\n\
    <form name=\"myform\" action=\"\">\n输入名称: <input type=\"text\" name=\"customer\"\
    />\n<input type=\"button\" value=\"设置 Cookie\" onclick=\"WriteCookie();\"/>\n\
    </form>\n</body>\n</html>\n```\n\n### 输出\n\n现在你的机器有一个名为 `name` 的 Cookie。你可以使用用逗号分隔的多个键值对来设置多个\
    \ Cookie。\n\n## 读取 Cookie\n\n读取 Cookie 与写入 Cookie 一样简单，因为 `document.cookie` 对象的值就是\
    \ Cookie。所以当你想要访问 Cookie 时，可以使用这个字符串。`document.cookie` 字符串将保留一个由分号分隔的名称=值对列表，其中\
    \ `name` 是 Cookie 的名称，value 是它的字符串值。\n\n你可以使用字符串的 `split()` 函数将字符串拆分为键和值，如下——\n\
    \n### 示例\n\n尝试以下示例以获取所有的 Cookie。\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\"\
    >\n//\n```\n\n"
