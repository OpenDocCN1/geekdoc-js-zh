    ## Rollover with a Mouse Event


    Here is a simple example showing image rollover with a mouse event.


    Let''s see what we are using in the following example −


    *   At the time of loading this page, the ‘if’ statement checks for the existence
    of the image object. If the image object is unavailable, this block will not be
    executed.


    *   The **Image()** constructor creates and preloads a new image object called **image1**.


    *   The src property is assigned the name of the external image file called /images/html.gif.


    *   Similarly, we have created **image2** object and assigned /images/http.gif
    in this object.


    *   The # (hash mark) disables the link so that the browser does not try to go
    to a URL when clicked. This link is an image.


    *   The **onMouseOver** event handler is triggered when the user''s mouse moves
    onto the link, and the **onMouseOut** event handler is triggered when the user''s
    mouse moves away from the link (image).


    *   When the mouse moves over the image, the HTTP image changes from the first
    image to the second one. When the mouse is moved away from the image, the original
    image is displayed.


    *   When the mouse is moved away from the link, the initial image html.gif will
    reappear on the screen.


