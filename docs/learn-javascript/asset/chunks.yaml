    \ −\n\n### # JavaScript in External File\n\nAs you begin to work more extensively\
    \ with JavaScript, you will be likely to find that there are cases where you are\
    \ reusing identical JavaScript code on multiple pages of a site.\n\nYou are not\
    \ restricted to be maintaining identical code in multiple HTML files. The `script`\
    \ tag provides a mechanism to allow you to store JavaScript in an external file\
