    document.write("(a & b) => ");


    result =  (a & b);


    document.write(result);


    document.write(linebreak);


    document.write("(a | b) => ");


    result =  (a | b);


    document.write(result);


    document.write(linebreak);


    document.write("(a ^ b) => ");


    result =  (a ^ b);


    document.write(result);


    document.write(linebreak);


    document.write("(~b) => ");


    result =  (~b);


    document.write(result);


    document.write(linebreak);


    document.write("(a << b) => ");


    result =  (a << b);


    document.write(result);


    document.write(linebreak);


    document.write("(a >> b) => ");


    result =  (a >> b);


    document.write(result);


    document.write(linebreak);


    //-->


    </script>


    <p>Set the variables to different values and different operators and then try...</p>


    </body>


    </html>


    (a & b) => 2


    (a | b) => 3


    (a ^ b) => 1


    (~b) => -4


