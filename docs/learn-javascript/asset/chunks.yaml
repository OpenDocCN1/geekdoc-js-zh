    # Regular Expressions and RegExp Object


    A regular expression is an object that describes a pattern of characters.


    The JavaScript `RegExp` class represents regular expressions, and both `String`
    and `RegExp` define methods that use regular expressions to perform powerful pattern-matching
    and search-and-replace functions on text.


    ### Syntax


    A regular expression could be defined with the `RegExp()` constructor, as follows
    −


    ```javascript

    var pattern = new RegExp(pattern, attributes);

    ```


    or simply


    ```javascript

    var pattern = /pattern/attributes;

    ```


    Here is the description of the parameters −


    - `pattern`: A string that specifies the pattern of the regular expression or
    another regular expression.

    - `attributes`: An optional string containing any of the "g", "i", and "m" attributes
    that specify global, case-insensitive, and multi-line.


    ## Brackets


    Brackets `[]` have special meaning when used in regular expressions.


    | Sr.No. | Expression & Description |

    | :--- | :--- |

    | 1 | `[...]` Any one character between the brackets. |

    | 2 | `[^...]` Any character not between the brackets. |

    | 3 | `[0-9]` Matches any digit. |

    | 4 | `[a-z]` Matches any character from `a` through `z`. |

    | 5 | `[A-Z]` Matches any character from `A` through `Z`. |

    | 6 | `[a-zA-Z]` Matches any character from lowercase or uppercase letters. |


    The ranges shown above are general; you could use...


    ## Quantifiers


    The frequency or position of bracketed characters can be denoted by special characters.


    | Sr.No. | Expression & Description |

    | :--- | :--- |

    | 1 | `p+` Matches one or more `p`. |

    | 2 | `p*` Matches zero or more instances of `p`. |

    | 3 | `p?` Matches at most one `p`. |

    | 4 | `p{N}` Matches a sequence of `N` `p`. |

    | 5 | `p{2,3}` Matches a sequence of two or three `p`. |

    | 6 | `p{2,}` Matches a sequence of at least two `p`. |


    ### Examples


    Following examples explain more about matching.


    | Sr.No. | Expression & Description |

    | :--- | :--- |

    | 1 | `[^a-zA-Z]` Matches any string not containing any of the characters ranging
    from `a` through `z` and `A` through `Z`. |

    | 2 | `p.p` Matches any string containing `p`, followed by any character. |

    | 3 | `^{2}$` Matches any string containing exactly two characters. |

    | 4 | `<b>(.*)</b>` Matches any string enclosed within `<b>` and `</b>`. |

    | 5 | `p(hp)*` Matches any string containing `p` followed by zero or more instances
    of `hp`. |


    ## Literal characters


    | Sr.No. | Character & Description |

    | :--- | :--- |

    | 1 | Alphanumeric itself |

    | 2 | `\0` The NUL character (`\u0000`) |

    | 3 | `\t` Tab (`\u0009`) |

    | 4 | `\n` Newline (`\u000A`) |

    | 5 | `\v` Vertical tab (`\u000B`) |

    | 6 | `\f` Form feed (`\u000C`) |

    | 7 | `\r` Carriage return (`\u000D`) |

    | 8 | `\xnn` The Latin character specified by the hexadecimal number `nn`; for
    example, `\x0A` is the same as `\n`. |

    | 9 | `\uxxxx` The Unicode character specified by the hexadecimal number `xxxx`;
    for example, `\u0009` is the same as `\t`. |

    | 10 | `\cX` The control character `^X`; for example, `\cJ` is equivalent to the
    newline character `\n`. |


    ## Metacharacters


    A metacharacter is simply an alphabetical character preceded by a backslash that
    acts to give the combination a special meaning.


    For instance, you can search for a large sum of money using the `\d` metacharacter:
    `/([\d]+)000/`. Here `\d` will search for any string of numerical character.


    The following table lists a set of metacharacters which can be used in PERL Style
    Regular Expressions.


    | Sr.No. | Character & Description |

    | :--- | :--- |

    | 1 | `.` a single character |

    | 2 | `\s` whitespace character (space, tab, newline) |

