    \ | short | while |\n| do | import | static | with |\n| double | in | super |\
    \ |\n\nThese words cannot be used as variable names.\n\n### # Operators\n\n####\
    \ ## What is an Operator?\n\nLet us take a simple expression `4 + 5 is equal to\
    \ 9`. Here 4 and 5 are called `operands` and `+` is called the `operator`. JavaScript\
    \ supports the following types of operators.\n\n* Arithmetic Operators\n* Comparison\
    \ Operators\n* Logical (or Relational) Operators\n* Assignment Operators\n* Conditional\
    \ (or ternary) Operators\n\nLets have a look on all operators one one.\n\n####\
    \ ## Arithmetic Operators\n\nJavaScript supports the following arithmetic operators\
    \ −\n\nAssume variable `A` holds 10 and variable `B` holds 20, then −\n\n| Sr.No.\
    \ | Operator & Description |\n| :--- | :--- |\n| 1 | `+` (Addition) Adds two operands\
    \ **Ex**: `A + B` will give 30 |\n| 2 | `-` (Subtraction) Subtracts the second\
    \ operand from the first **Ex**: `A - B` will give -10 |\n| 3 | `*` (Multiplication)\
    \ Multiply both operands **Ex**: `A * B` will give 200 |\n| 4 | `/` (Division)\
    \ Divide the numerator by the denominator **Ex**: `B / A` will give 2 |\n| 5 |\
    \ `%` (Modulus) Outputs the remainder of an integer division **Ex**: `B % A` will\
    \ give 0 |\n| 6 | `++` (Increment) Increases an integer value by one **Ex**: `A++`\
    \ will give 11 |\n| 7 | `--` (Decrement) Decreases an integer value by one **Ex**:\
    \ `A--` will give 9 |\n\n**Note** − Addition operator (+) works for Numeric as\
    \ well as Strings. e.g. `\"a\" + 10` will give `\"a10\"`.\n"
