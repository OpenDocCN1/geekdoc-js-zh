    *   **IE4 DOM** – 该文档对象模型是在微软 Internet Explorer 浏览器的第 4 版本中引入的。IE5 及更高版本包含了对大多数基本\
    \ W3C DOM 特性的支持。\n\n## DOM 性\n\n如果你想编写一个灵活的脚本，根据可用性使用 W3C DOM 或 IE 4 DOM，那么你可以使用能力测试方法，首先检查方法或属性是否存在，以判断浏览器是否具有你所需的能力。例如——\n\
    \n```\nif (document.getElementById) {\n    // 如果 W3C 方法存在，则使用它\n} else if (document.all)\
    \ {\n    // 如果 all[] 数组存在，则使用它\n} else {\n    // 否则使用遗留 DOM\n}\n```\n\n# 错误与异常处理\n\
    \n编程中有三种错误：(a) 语法错误，(b) 运行时错误以及 c) 逻辑错误。\n\n## 语法错误\n\n语法错误也称为`解析错误`，在传统编程语言中发生在编译时，在\
    \ JavaScript 中发生在解释时。\n\n例如，以下这一行会导致语法错误，因为缺少了右括号。\n\n```html\n<script type=\"\
    javascript\">\nwindow.print(;\n//\n</script>\n```\n\n当 JavaScript 中发生语法错误时，只有该线程的代码受影响。\n\
    \n## 运行时错误\n\n运行时错误也称为`异常`，发生在执行期间（编译之后）。\n\n例如，以下这一行的语法是正确的，但在运行时它尝试调用一个不存在的方法。\n\
    \n```html\n<script type=\"javascript\">\nwindow.print();\n</script>\n```\n\n异常也会影响它们发生的线程，允许其他线程继续。\n\
    \n## 逻辑错误\n\n逻辑错误是最难追踪的错误类型。它们不是语法或运行时错误。相反，当你在逻辑上出错且没有得到预期的结果时就会发生。你无法捕获这些错误，因为这取决于你想放在程序中的逻辑类型。\n\
    \n## try...catch...finally 语句\n\nJavaScript 的最新版本增加了异常能力。JavaScript 实现了 `try...catch...finally`\
    \ 结构以及处理异常的 `throw` 操作符。你可以捕获程序员生成的和运行时异常，但无法捕获 JavaScript 错误。\n\n这是 `try...catch...finally`\
    \ 块的语法：\n\n```\ntry {\n    // 执行的代码\n} catch (e) {\n    // 当发生异常时执行的代码\n} finally\
    \ {\n    // 无论是否发生异常都会执行的代码\n}\n```\n\n`try` 块必须后跟一个 `catch` 块或一个 `finally` 块（或两者都有）。当\
    \ `try` 块中发生异常时，异常会被放入 `e` 中并执行 `catch` 块。可选的 `finally` 块在 try/catch 之后执行。\n\n\
    ### 示例\n\n这里的示例正在尝试调用一个不存在的函数，这引发了异常。让我们看看在不使用 `try...catch` 的情况下它是如何的：\n\n```html\n\
    <html>\n<head>\n<script type=\"text/javascript\">\nfunction myFunc() {\n    var\
    \ a = 100;\n    alert(\"变量 a 的值为：\" + a );\n}\n</script>\n</head>\n<body>\n<p>点击下方查看结果：</p>\n\
    <form>\n<input type=\"button\" value=\"点击我\" onclick=\"myFunc();\" />\n</form>\n\
    </body>\n</html>\n```\n\n### 输出\n\n现在让我们尝试使用 `try...catch` 捕获此异常并显示用户友好的消息。如果你想向用户隐藏此错误，也可以抑制此消息。\n\
    \n```html\n<html>\n<head>\n<script type=\"text/javascript\">\nfunction myFunc()\
    \ {\n    var a = 100;\n    try {\n        printme();\n    } catch (e) {\n    \
    \    alert(\"发生错误：\" + e);\n    }\n}\n</script>\n</head>\n...\n\n"
- fmt: "\n```javascript\nalert(\"Value of variable a is : \"  + a );\n}\n\ncatch (\
    \ e ) {\n  alert(\"Error: \"  + e.description );\n}\n\n}\n//-->\n</script>\n</head>\n\
    <body>\n<p>Click the following to see the result:</p>\n<form>\n  <input type =\
    \ \"button\" value = \"Click Me\" onclick = \"myFunc();\" />\n</form>\n</body>\n\
    </html>\n```\n\n### Output\n\nYou can use `finally` block which will always execute\
    \ unconditionally after the `try/catch`. Here is an example.\n\n```html\n<html>\n\
    <head>\n<script type = \"text/javascript\">\n<!--\nfunction myFunc() {\nvar a\
