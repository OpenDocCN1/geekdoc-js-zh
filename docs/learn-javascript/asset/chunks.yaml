    # 正则表达式和 RegExp 对象


    正则表达式是一个描述字符模式的对象。


    JavaScript 的 `RegExp` 类表示正则表达式，`String` 和 `RegExp` 都定义了使用正则表达式对文本执行强大的模式匹配以及搜索替换功能的方法。


    ### 语法


    正则表达式可以使用 `RegExp()` 构造函数定义，如下−


    ```javascript

    var pattern = new RegExp(pattern, attributes);

    ```


    或者简单地使用


    ```javascript

    var pattern = /pattern/attributes;

    ```


    这里是参数的描述−


    - `pattern`: 模式字符串。

    - `attributes`: 属性。


    ## 括号


    括号 `[]` 在正则表达式中有特殊含义。


    | Sr.No. | 表达式 |

    | :--- | :--- |

    | 1 | `[...]` 匹配括号内的任意字符。 |

    | 2 | `[^...]` 不匹配括号内的任意字符。 |

    | 3 | `[0-9]` 匹配任意数字。 |

    | 4 | `[a-z]` 匹配任意小写字母。 |

    | 5 | `[A-Z]` 匹配任意大写字母。 |

    | 6 | `[a-zA-Z]` 匹配任意字母。 |


    ## 量词


    量词决定了字符出现的次数。


    | Sr.No. | 表达式 | 描述 |

    | :--- | :--- |

    | 1 | `p+` 匹配一个或多个 `p`。 |

    | 2 | `p*` 匹配零或多个 `p`。 |

    | 3 | `p?` 匹配最多一个 `p`。 |

    | 4 | `p{N}` 匹配正好 N 个 `p`。 |

    | 5 | `p{2,3}` 匹配两个到三个 `p`。 |

    | 6 | `p{2,}` 匹配至少两个 `p`。 |


    ### 示例


    以下示例详细解释了关于匹配的内容。


    | Sr.No. | 表达式 | 描述 |

    | :--- | :--- |

    | 1 | `^[a-zA-Z]` 匹配以字母（不区分大小写）开头的字符串的开头。 |

    | 2 | `p.` 匹配 `p` 后跟的任意字符。 |

    | 3 | `^{2}$` 匹配正好两个字符。 |

    | 4 | `<b>(.*)</b>` 匹配 `<b>` 之间的任意字符串。 |

    | 5 | `p(hp)*` 匹配 `p` 后跟的零或多个 `hp`。 |


    ## 字面量


    | Sr.No. | 字符 |

    | :--- | :--- |

    | 1 | `\\` 转义字符本身 |

    | 2 | `\0` NUL 字符 (`\u000`) |

    | 3 | `\t` 制表符 (`\u009`) |

    | 4 | `\n` 换行符 (`\u00A`) |

    | 5 | `\v` 垂直制表符 (`\u00B`) |

    | 6 | `\f` 换页符 (`\u00C`) |

    | 7 | `\r` 回车符 (`\u00D`) |

    | 8 | `\xnn` 由十六进制数 `nn` 指定的拉丁字符；例如 `\x0A` 等同于 `\n`。 |

    | 9 | `\uxxxx` 由十六进制数 `xxxx` 指定的 Unicode 字符；例如 `\u0009` 等同于 `\t`。 |

    | 10 | `\cX` 控制字符 `^X`；例如 `\cJ` 相当于换行符 `\n`。 |


    ## 元字符


    元字符是反斜杠引导的字母，用于赋予该组合特殊含义。


    例如，你可以使用 `\d` 元字符搜索大额金额：`/([\d]+)000/`。在这里 `\d` 将搜索任何数字字符串。


    下表列出了可以在 PERL 风格正则表达式中使用的元字符集合。


    | Sr.No. | 字符 & 描述 |

    | :--- | :--- |

    | 1 | `.` 单个字符 |

    | 2 | `\s` 空白字符（空格、制表符、换行符） |


