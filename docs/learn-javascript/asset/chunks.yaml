    构造函数（constructor）是一个创建并初始化对象的函数。JavaScript 提了一个名为 `Object()` 的特殊构造函数来构建对象。`Object()`
    构造函数的返回值会被赋值给变量。


    该变量包含指向新对象的引用。赋值给对象的属性不是变量，且不是使用 `var` 关键字定义的。


    ### 示例 1


    尝试以下示例；它演示了如何创建一个 Object（对象）。


    ```html

    <html>

    <head>

    <title>User-defined objects</title>

    <script type = "text/javascript">

    var book = new Object();  // 创建对象

    book.subject = "Perl";  // 给对象分配属性

    book.author = "Mohtashim";

    </script>

    </head>

    <body>

    <script type = "text/javascript">

    document.write("Book name is : " + book.subject + "<br>");

    document.write("Book author is : " + book.author + "<br>");

    </script>

    </body>

    </html>

    ```


    ### 输出

    Book name is : Perl

    Book author is : Mohtashim


    ### 示例 2


    此示例演示了如何使用自定义函数（User-Defined Function）创建一个对象。这里使用 `this` 关键字引用引用传递函数的对象。


    ```html

    <html>

    <head>

    <title>User-defined objects</title>

    <script type = "text/javascript">

    function book(title, author) {

    this.title = title;

    this.author = author;

    }

    </script>

    </head>

    <body>

    <script type = "text/javascript">

    var myBook = new book("Perl", "Mohtashim");

    document.write("Book title is : " + myBook.title + "<br>");

    document.write("Book author is : " + myBook.author + "<br>");

    </script>

    </body>

    </html>

    ```


    ### 输出

    Book title is : Perl

    Book author is : Mohtashim


    ## 为对象定义方法


    之前的示例演示了构造函数如何创建对象并分配属性。但我们需要通过为对象分配方法来完成对象的定义。


    ### 示例


    尝试以下示例；它展示了如何随对象一起添加函数。


    ```html

    <html>

    <head>

    <title>User-defined objects</title>

    <script type = "text/javascript">

    // 定义一个充当方法的函数

    function addPrice(amount) {

    this.price = amount;

    }

    function book(title, author) {

    this.title = title;

    this.author = author;

    this.addPrice = addPrice;  // 将该方法作为属性赋值。

    }

    </script>

    </head>

    <body>

    <script type = "text/javascript">

    var myBook = new book("Perl", "Mohtashim");

    myBook.addPrice(100);

    document.write("Book title is : " + myBook.title + "<br>");

    document.write("Book author is : " + myBook.author + "<br>");

    document.write("Book price is : " + myBook.price + "<br>");

    </script>

    </body>

    </html>

    ```


    ### 输出

    Book title is : Perl

    Book author is : Mohtashim

    Book price is : 100


    ## ''with'' 关键字


    `with` 关键字用作引用对象属性或方法的简写形式。


    作为 `with` 参数指定的对象在随后的块执行期间将成为默认对象。可以使用对象的属性和方法而无需指明对象名称。


    ### 语法


    `with object` 的语法如下——


    ```javascript

    with (object) {

    不使用对象名和点操作符的属性

    }

    ```


    ### 示例


    尝试以下示例。


    ```html

    <html>

    <head>

    <title>User-defined objects</title>

    <script type = "text/javascript">

    // 定义一个充当方法的函数

    function addPrice(amount) {

    with(this) {

    price = amount;

    }

    }

    function book(title, author) {

    this.title = title;

    this.author = author;

    this.price = 0;

    this.addPrice = addPrice;  // 将该方法作为属性赋值。

    }

    </script>

    </head>

    <body>

    <script type = "text/javascript">

    var myBook = new book("Perl", "Mohtashim");

    myBook.addPrice(100);

    document.write("Book title is : " + myBook.title + "<br>");

    document.write("Book author is : " + myBook.author + "<br>");

    document.write("Book price is : " + myBook.price + "<br>");

    </script>

    </body>

    </html>

    ```


    ### 输出

    Book name is : Perl

    Book author is : Mohtashim

    Book price is : 100


    ## JavaScript 原生对象


    JavaScript 有几个内置或原生对象。这些对象可以在程序的任何地方访问，并在运行于任何操作系统的任何浏览器中以相同的方式工作。


    以下是所有原生对象的列表——

    * `Number Object`（数字对象）

    * `Boolean Object`（布尔对象）

    * `String Object`（字符串对象）

    * `Array Object`（数组对象）

    * `Date Object`（日期对象）

    * `Math Object`（数学对象）

    * `RegExp Object`（正则表达式对象）


    # Number 对象


    `Number` 对象表示整数或浮点数。通常，你不需要担心 `Number` 实例，因为 JavaScript 会自动将字面量转换为相应的类型。


    ### 语法


    创建 `number` 对象的语法如下——


    ```javascript

    var val = Number(number)

    ```


    ## Number 属性


    以下是每个属性的列表：


    | 序号 | 属性 | 描述 |

    | :--- | :--- | :--- |

    | 1 | `MAX_VALUE` | 数字可能的最大值 (1.7976931348623157+308) |

    | 2 | `MIN_VALUE` | 数字可能的最小值 (5e-324) (等一下，确实是 5e-324) |

    | 3 | `NaN` | 非数字的值 |

    | 4 | `NEGATIVE_INFINITY` | 小于 `MIN_VALUE` 的值 |

    | 5 | `POSITIVE_INFINITY` | 大于 `MAX_VALUE` 的值 |

    | 6 | `prototype` | Number 对象的静态属性 |

    | 7 | `constructor` | 返回创建对象的函数引用 |


    ## Number 方法


    `Number` 对象包含了每个对象都拥的方法：


    | 序号 | 方法 | 描述 |

    | :--- | :--- | :--- |

    | 1 | `toExponential()` | 将数字以指数计数法显示 |

    | 2 | `toFixed()` | 以特定的小数位数格式化数字 |

    | 3 | `toLocaleString()` | 返回本地设置下的数字字符串值 |

    | 4 | `toPrecision()` | 定义显示的总数字个数 |

    | 5 | `toString()` | 返回数值的字符串表示 |

    | 6 | `valueOf()` | 返回数值 |


    # Boolean 对象


    `Boolean` 对象表示两个值："true" 或 "false"。


    ### 语法


    使用以下语法创建 `Boolean` 对象：


    ```javascript

    var val = new Boolean(value)

    ```


    ## Boolean 属性


    | 序号 | 属性 | 描述 |

    | :--- | :--- | :--- |

    | 1 | `constructor` | 返回创建对象的函数引用 |

    | 2 | `prototype` | 允许向对象添加属性和方法 |


    ## Boolean 方法


    | 序号 | 方法 | 描述 |

    | :--- | :--- | :--- |

    | 1 | `toSource()` | 返回包含 Boolean 对象源码的字符串 |

    | 2 | `toString()` | 返回 "true" 或 "false" 的字符串 |


