    <head>\n<script type=\"text/javascript\">\n<!--\nfunction sayHello() {\n  alert(\"\
    Hello World\")\n}\n//-->\n</script>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\n<!--\ndocument.write(\"Hello World\")\n//-->\n</script>\n<input type=\"button\"\
    \ onclick=\"sayHello()\" value=\"Say Hello\" />\n</body>\n</html>\n```\n\n这段代码将产生以下结果\
    \ −\n\n### # 外部文件中的 JavaScript\n\n当你开始更广泛地使用 JavaScript 时，你很可能会会发现，在某些情况下，你需要在网站的多个页面上复用相同的\
    \ JavaScript 代码。\n\n你并不受限于在多个 HTML 文件中维护相同的代码。`script` 标签提供了一种机制，允许你将 JavaScript\
    \ 存储在外部文件中，然后将其包含在 HTML 文件中。\n\n以下示例展示了如何使用 `script` 标签及其 `src` 属性在 HTML 代码中包含外部\
    \ JavaScript 文件。\n\n```html\n<html\n<head>\n<script type=\"text/javascript\" src=\"\
    filename.js\"></script>\n</head>\n<body>\n.......\n</body>\n</html>\n```\n\n要使用来自外部文件源的\
    \ JavaScript，你需要将所有的 JavaScript 源代码写入扩展名为为 `.js` 的简单文本文件中，然后如上所示包含该文件。\n\n例如，你可以在\
    \ `filename.js` 文件中保留以下内容，之后在包含 `filename.js` 文件后，你就可以在 HTML 文件中使用 `sayHello`\
    \ 函数了。\n\n```javascript\nfunction sayHello() {\n  alert(\"Hello World\")\n}\n\
    ```\n\n### # 变量\n\n#### ## JavaScript 数据类型\n\n编程语言最基本的特征之一是它支持的数据类型集合。这些是在编程语言中可以表示和操作的值类型。\n\
    \nJavaScript 允许你处理三种原始数据类型 −\n\n* `Numbers`（数字），例如 123, 120.50 等。\n* `Strings`（字符串），例如\
    \ \"This text string\" 等。\n* `Boolean`（布尔值），例如 true 或 false。\n\nJavaScript 还定义了两个特殊数据类型：`null`\
    \ 和 `undefined`，每个类型只定义了一个值。除了这些原始数据类型外，JavaScript 还支持一种名为 `object` 的复合数据类型。我们将在单独的章节详细介绍对象。\n\
    \n**注意** − JavaScript 不区分整数值和浮点值。JavaScript 中的所有数字都表示为浮点值。JavaScript 使用 IEEE 754\
    \ 标准定义的 64 位浮点格式表示数字。\n\n#### ## JavaScript 变量\n\n与许多其他编程语言一样，JavaScript 也拥有变量。变量可以被视为命名的容器。你可以将数据放入这些容器中，然后通过命名容器来引用这些数据。\n\
    \n在 JavaScript 程序中使用变量之前，必须先声明它。使用 `var` 关键字声明变量如下：\n\n```javascript\n<script\
    \ type=\"text/javascript\">\n<!--\nvar money;\nvar name;\n//-->\n</script>\n```\n\
    \n你也可以如下使用相同的 `var` 关键字声明多个变量 −\n\n```javascript\n<script type=\"text/javascript\"\
    >\n<!--\nvar money, name;\n//-->\n</script>\n```\n\n在变量中存储值被称为 `变量初始化`。你可以在创建变量时进行初始化，也可以在之后需要该变量的某时刻进行。\n\
    \n例如，你可能会创建一个名为 `money` 的变量，稍后给它赋值 2000.50。\n\n```javascript\n<script type=\"\
    text/javascript\">\n<!--\nvar name = \"Ali\";\nvar money;\nmoney = 2000.50;\n\
    //-->\n</script>\n```\n\n**注意** − `var` 关键字仅用于声明或初始化，在文档的变量名生命周期内使用一次。你不应该重复声明同一个变量。\n\
    \nJavaScript 是一种 `无类型` 语言。这意味着 JavaScript 变量可以持有任何数据类型的值。与许多其他语言不同，你不需要在变量变量时告诉\
    \ JavaScript 变量将持有什么类型的值。变量类型可以在程序执行过程中更改，JavaScript 会自动处理。\n\n#### ## JavaScript\
    \ 变量作用域\n\n变量的作用域是其定义的程序区域。JavaScript 变量只有两种作用域。\n\n* `Global Variables`（全局变量）\
    \ − 全局变量具有全局作用域，意味着可以在 JavaScript 代码的任何地方定义。\n* `Local Variables`（局部变量） − 局部变量在其定义的函数内部可见。函数参数始终是该函数的局部变量。\n\
    \n在函数体内，局部变量的优先级高于同名的全局变量。如果你声明了一个与全局变量同名的局部变量或函数参数，你实际上隐藏了该全局变量。请看以下示例。\n\n```html\n\
    <body onload=checkscope();>\n<script type=\"text/javascript\">\n<!--\nvar myVar\
    \ = \"global\";\nfunction checkscope() {\n  document.write(myVar);\n}\n//-->\n\
    </script>\n</body>\n</html>\n```\n\n### # 变量名\n\n在 JavaScript 中为变量命名时，请记住以下规则：\n\
    \n* JavaScript 名称不应以数字（0-9）开头。它们必须以字母或下划线开头。\n* JavaScript 名称对大小写敏感。\n\n### #\
    \ 关键字\n\n所有保留字列表如下所示。\n\n| abstract | else | instanceof | switch |\n| boolean\
    \ | enum | int | synchronized |\n| break | export | interface | this |\n| byte\
    \ | extends | long | throw |\n| case | false | native | transient |\n| char |\
    \ finally | new | true |\n| class | float | package | try |\n| const | for | private\
    \ | typeof |\n| continue | function | protected | var |\n| debugger | goto | public\
    \ | void |\n| default | if | return | volatile |\n| delete | implements | short\
    \ | while |\n| do | import | static | with |\n| double | in | super | |\n\n这些词不能作为变量名。\n\
    \n### # 运算符\n\n#### ## 什么是运算符？\n\n让我们来看简单的表达式 `4 + 5 等于 9`。这里 4 和 5 被`操作数`，而 `+`\
    \ 是`运算符`。JavaScript 支持以下类型的运算符。\n\n* 算术运算符\n* 比较运算符\n* 逻辑（或关系）运算符\n* 赋值运算符\n*\
    \ 条件（或三元）运算符\n\n让我们逐个查看所有运算符。\n\n#### ## 算术运算符\n\nJavaScript 支持以下算术运算符 −\n\n假设变量\
    \ `A` 值为 10，变量 `B` 值为 20，则 −\n\n| 序号 | 运算符 & 描述 |\n| :--- | :--- |\n| 1 | `+`\
    \ (加法) 相加两个操作数 **例如**：`A + B` 得到 30 |\n| 2 | `-` (减法) 从第一个操作数中减去第二个操作数 **例如**：`A\
    \ - B` 得到 -10 |\n| 3 | `*` (乘法) 乘积两个操作数 **例如**：`A * B` 得到 200 |\n| 4 | `/` (除法)\
    \ 被除数除以除数 **例如**：`B / A` 得到 2 |\n| 5 | `%` (取模) 输出整数除法的余数 **例如**：`B % A` 得到 0\
    \ |\n| 6 | `++` (自增) 将整数值加一 **例如**：`A++` 得到 11 |\n| 7 | `--` (自减) 将整数值减一 **例如**：`A--`\
    \ 得到 9 |\n\n**注意** − 加法运算符 (+) 既适用于数值，也适用于字符串。例如 `\"a\" + 10` 将得到 `\"a10\"`。\n\
    \n"
