    The following code shows how to use arithmetic operators in JavaScript.


    ```html

    <html>

    <body>

    <script type  =  "text/javascript">

    <!--

    var a =  33;

    var b =  10;

    var c =  "Test";

    var linebreak =  "<br />";

    document.write("a + b = ");

    result = a + b;

    document.write(result);

    document.write(linebreak);

    document.write("a - b = ");

    result = a - b;

    document.write(result);

    document.write(linebreak);

    document.write("a / b = ");

    result = a / b;

    document.write(result);

    document.write(linebreak);

    document.write("a % b = ");

    result = a % b;

    document.write(result);

    document.write(linebreak);

    document.write("a + b + c = ");

    result = a + b + c;

    document.write(result);

    document.write(linebreak);

    a =  ++a;

    document.write("++a = ");

    result =  ++a;

    document.write(result);

    document.write(linebreak);

    b =  --b;

    document.write("--b = ");

    result =  --b;

    document.write(result);

    document.write(linebreak);

    //-->

    </script>

    Set the variables to different values and then try...

    </body>

    </html>

    ```


    ### Output


    a + b = 43


    a - b = 23


    a / b = 3.3


    a % b = 3


    a + b + c = 43Test


    ++a = 35


    --b = 8


    Set the variables to different values and then try...


    ## Comparison Operators


    JavaScript supports the following comparison operators −


    Assume variable `A` holds 10 and variable `B` holds 20, then −


    | Sr.No. | Operator & Description |

    | :--- | :--- |

    | 1 | `==` (Equal)Checks if the value of two operands are equal or not, if yes,
    then the condition becomes true.Ex: `(A == B)` is not true. |

    | 2 | `!=` (Not Equal)Checks if the value of two operands are equal or not, if
    the values are not equal, then the condition becomes true.Ex: `(A != B)` is true.
    |

    | 3 | `>` (Greater than)Checks if the value of the left operand is greater than
    the value of the right operand, if yes, then the condition becomes true.Ex: `(A
    > B)` is not true. |

    | 4 | `<` (Less than)Checks if the value of the left operand is less than the
    value of the right operand, if yes, then the condition becomes true.Ex: `(A <
    B)` is true. |

    | 5 | `>=` (Greater than or Equal to)Checks if the value of the left operand is
    greater than or equal to the value of the right operand, if yes, then the condition
    becomes true.Ex: `(A >= B)` is not true. |

    | 6 | `<=` (Less than or Equal to)Checks if the value of the left operand is less
    than or equal to the value of the right operand, if yes, then the condition becomes
    true.Ex: `(A <= B)` is true. |


    ### Example


    The following code shows how to use comparison operators in JavaScript.


    ```html

    <html>

    <body>

    <script type  =  "text/javascript">

    <!--

    var a =  10;

    var b =  20;

    var linebreak =  "<br />";

    document.write("(a == b) => ");

    result =  (a == b);

    document.write(result);

    document.write(linebreak);

    document.write("(a < b) => ");

    result =  (a < b);

    document.write(result);

    document.write(linebreak);

    document.write("(a > b) => ");

    result =  (a > b);

    document.write(result);

    document.write(linebreak);

    document.write("(a != b) => ");

    result =  (a != b);

    document.write(result);

    document.write(linebreak);

    document.write("(a >= b) => ");

    result =  (a >= b);

    document.write(result);

    document.write(linebreak);

    document.write("(a <= b) => ");

    result =  (a <= b);

    document.write(result);

    document.write(linebreak);

    //-->

    </script>

    Set the variables to different values and different operators and then try...

    </body>

    </html>

    ```


    ### Output


    (a == b) => false


    (a < b) => true


    (a > b) => false


    (a != b) => true


    (a >= b) => false


    a <= b) => true


    Set the variables to different values and different operators and then try...


    ## Logical Operators


    JavaScript supports the following logical operators −


    Assume variable `A` holds 10 and variable `B` holds 20, then −


    | Sr.No. | Operator & Description |

    | :--- | :--- |

    | 1 | `&&` (Logical AND)If both the operands are non-zero, then the condition
    becomes true.Ex: `(A && B)` is true. |

    | 2 | `||` (Logical OR)If any of the two operands are non-zero, then the condition
    becomes true.Ex: `(A || B)` is true. |

    | 3 | `!` (Logical NOT)Reverses the logical state of its operand. If a condition
    is true, then the Logical NOT operator will make it false.Ex: `! (A && B)` is
    false. |


    ### Example


    Try the following code to learn how to implement Logical Operators in JavaScript.


    ```html

    <html>

    <body>

    <script type  =  "text/javascript">

    <!--

    var a =  true;

    var b =  false;

    var linebreak =  "<br />";

    document.write("(a && b) => ");

    result =  (a && b);

    document.write(result);

    document.write(linebreak);

    document.write("(a || b) => ");

    result =  (a || b);

    document.write(result);

    document.write(linebreak);

    document.write("!(a && b) => ");

    result =  (!(a && b));

    document.write(result);

    document.write(linebreak);

    //-->

    </script>

    <p>Set the variables to different values and different operators and then try...</p>

    </body>

    </html>

    ```


    ### Output


    (a && b) => false


    (a || b) => true


    !(a && b) => true


    Set the variables to different values and different operators and then try...


    ## Bitwise Operators


    JavaScript supports the following bitwise operators −


    Assume variable `A` holds 2 and variable `B` holds 3, then −


    | Sr.No. | Operator & Description |

    | :--- | :--- |

    | 1 | `&` (Bitwise AND)It performs a Boolean AND operation on each bit of its
    integer arguments.Ex: `(A & B)` is 2. |

    | 2 | `|` (Bitwise OR)It performs a Boolean OR operation on each bit of its integer
    arguments.Ex: `(A | B)` is 3. |

    | 3 | `^` (Bitwise XOR)It performs a Boolean XOR operation on each bit of its
    integer arguments. Exclusive OR means that either operand one is true or operand
    two is true, but not both.Ex: `(A ^ B)` is 1. |

    | 4 | `~` (Bitwise Not)It is a unary operator and operates by reversing all the
    bits in the operand.Ex: `(~B)` is -4. |

    | 5 | `<<` (Left Shift)It moves all the bits in its first operand to the left
    by the number of bits specified in the second operand. New bits are filled with
    zeros. Shifting a value left by one position is equivalent to multiplying it by
    2, shifting two positions is equivalent to multiplying by 4, and so on.Ex: `(A
    << 1)` is 4. |

    | 6 | `>>` (Right Shift)Binary Shift Operator. The left operand’s value is moved
    right by the number of bits specified by the right operand.Ex: `(A >> 1)` is 1.
    |

    | 7 | `>>>` (Right shift with Zero)This operator is just like the `>>` operator,
    except that bits shifted in on the left are always zero.Ex: `(A >>> 1)` is 1.
    |


    ### Example


    Try the following code to implement Bitwise operator in JavaScript.


    ```html

    <html>

    <body>

    <script type  =  "text/javascript">

    <!--

    var a =  2; // Bit presentation 10

    var b =  3; // Bit presentation 11

    var linebreak =  "<br />";

    document.write("(a & b) => ");

    result =  (a & b);

    document.write(result);

    document.write(linebreak);

    document.write("(a | b) => ");

    result =  (a | b);

    document.write(result);

    document.write(linebreak);

    document.write("(a ^ b) => ");

    result =  (a ^ b);

    document.write(result);

    document.write(linebreak);

    document.write("(~b) => ");

    result =  (~b);

    document.write(result);

    document.write(linebreak);

    document.write("(a << b) => ");

    result =  (a << b);

    document.write(result);

    document.write(linebreak);

    document.write("(a >> b) => ");

    result =  (a >> b);

    document.write(result);

    document.write(linebreak);

    //-->

    </script>

    <p>Set the variables to different values and different operators and then try...</p>

    </body>

    </html>

    ```


    ### Output


    (a & b) => 2


    (a | b) => 3


    (a ^ b) => 1


    (~b) => -4


    (a << b) => 16


    (a >> b) => 0


    ## Assignment Operators


    JavaScript supports the following assignment operators −


    | Sr.No. | Operator & Description |

    | :--- | :--- |

    | 1 | `=` (Simple Assignment )Assigns values from the right side operand to the
    left side operand.Ex: `C = A + B` will assign the value of A + B into `C` |

