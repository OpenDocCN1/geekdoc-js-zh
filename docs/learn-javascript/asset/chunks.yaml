    2000.50 to it later. For another variable, you can assign a value at the time
    of initialization as follows.


    <script  type  =  "text/javascript">


    <!--


    var name =  "Ali";


    var money;


    money =  2000.50;


    //-->


    </script>


    **Note** − Use the **var** keyword only for declaration or initialization, once
    for the life of any variable name in a document. You should not re-declare same
    variable twice.


    JavaScript is **untyped** language. This means that a JavaScript variable can
    hold a value of any data type. Unlike many other languages, you don''t have to
    tell JavaScript during variable declaration what type of value the variable will
    hold. The value type of a variable can change during the execution of a program
    and JavaScript takes care of it automatically.


    ## JavaScript Variable Scope


    The scope of a variable is the region of your program in which it is defined.
    JavaScript variables have only two scopes.


    *   **Global Variables** − A global variable has global scope which means it can
    be defined anywhere in your JavaScript code.


    *   **Local Variables** − A local variable will be visible only within a function
    where it is defined. Function parameters are always local to that function.


    Within the body of a function, a local variable takes precedence over a global
    variable with the same name. If you declare a local variable or function parameter
    with the same name as a global variable, you effectively hide the global variable.
    Take a look into the following example.


    <html>


    <body  onload  = checkscope();>


    <script  type  =  "text/javascript">


    <!--


    var myVar =  "global";  // Declare a global variable


    function checkscope(  )  {


    var myVar =  "local";  // Declare a local variable


    document.write(myVar);


    }


    //-->


    </script>


    </body>


    </html>


    This produces the following result −


    local


    ## JavaScript Variable Names


    While naming your variables in JavaScript, keep the following rules in mind.


    *   You should not use any of the JavaScript reserved keywords as a variable name.
    These keywords are mentioned in the next section. For example, **break** or **boolean** variable
    names are not valid.


    *   JavaScript variable names should not start with a numeral (0-9). They must
    begin with a letter or an underscore character. For example, **123test** is an
    invalid variable name but **_123test** is a valid one.


    *   JavaScript variable names are case-sensitive. For example, **Name** and **name** are
    two different variables.


    ## JavaScript Reserved Words


    A list of all the reserved words in JavaScript are given in the following table.
    They cannot be used as JavaScript variables, functions, methods, loop labels,
    or any object names.


    | abstract | else | instanceof | switch |


    | boolean | enum | int | synchronized |


    | break | export | interface | this |


    | byte | extends | long | throw |


    | case | false | native | throws |


    | catch | final | new | transient |


    | char | finally | null | true |


    | class | float | package | try |


    | const | for | private | typeof |


    | continue | function | protected | var |


    | debugger | goto | public | void |


    | default | if | return | volatile |


    | delete | implements | short | while |


    | do | import | static | with |


    | double | in | super |  |


    # Operators


    ## What is an Operator?


    Let us take a simple expression **4 + 5 is equal to 9**. Here 4 and 5 are called **operands** and
    ‘+’ is called the **operator**. JavaScript supports the following types of operators.


    *   Arithmetic Operators


    *   Comparison Operators


    *   Logical (or Relational) Operators


    *   Assignment Operators


    *   Conditional (or ternary) Operators


    Lets have a look on all operators one by one.


    ## Arithmetic Operators


    JavaScript supports the following arithmetic operators −


    Assume variable A holds 10 and variable B holds 20, then −


    | Sr.No. | Operator & Description |


    | 1 | + (Addition)Adds two operands**Ex:** A + B will give 30 |


    | 2 | - (Subtraction)Subtracts the second operand from the first**Ex:** A - B
    will give -10 |


    | 3 | * (Multiplication)Multiply both operands**Ex:** A * B will give 200 |


    | 4 | / (Division)Divide the numerator by the denominator**Ex:** B / A will give
    2 |


    | 5 | % (Modulus)Outputs the remainder of an integer division**Ex:** B % A will
    give 0 |


    | 6 | ++ (Increment)Increases an integer value by one**Ex:** A++ will give 11
    |


    | 7 | -- (Decrement)Decreases an integer value by one**Ex:** A-- will give 9 |


    **Note** − Addition operator (+) works for Numeric as well as Strings. e.g. "a"
    + 10 will give "a10".


