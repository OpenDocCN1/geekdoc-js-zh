    \ ( e ) {\n    alert(\"Error: \"  + e.description );\n  }\n  finally {\n    alert(\"\
    Finally block will always execute!\"  );\n  }\n}\n//-->\n</script>\n</head>\n\
    <body>\n<p>Click the following to see the result:</p>\n<form>\n  <input type =\
    \ \"button\" value = \"Click Me\" onclick = \"myFunc();\" />\n</form>\n</body>\n\
    </html>\n```\n\n### Output\n\n## The throw Statement\n\nYou can use `throw` statement\
    \ to raise your built-in exceptions or your customized exceptions. Later these\
    \ exceptions can be captured and you can take an appropriate action.\n\n### Example\n\
    \nThe following example demonstrates how to use a `throw` statement.\n\n```html\n\
    <html>\n<head>\n<script type = \"text/javascript\">\n<!--\nfunction myFunc() {\n\
    var a = 100;\nvar b = 0;\n  try {\n    if ( b == 0 ) {\n      throw(  \"Divide\
    \ by zero error.\"  );\n    }  else {\n      var c = a / b;\n    }\n  }\n  catch\
    \ ( e ) {\n    alert(\"Error: \"  + e );\n  }\n}\n//-->\n</script>\n</head>\n\
    <body>\n<p>Click the following to see the result:</p>\n<form>\n  <input type =\
    \ \"button\" value = \"Click Me\" onclick = \"myFunc();\" />\n</form>\n</body>\n\
    </html>\n```\n\n### Output\n\nYou can raise an exception in one function using\
    \ a string, integer, Boolean, or an object and then you can capture that exception\
    \ either in the same function as we did above, or in another function using a\
    \ `try...catch` block.\n\n## The onerror() Method\n\nThe `onerror` event handler\
    \ was the first feature to facilitate error handling in JavaScript. The `error`\
    \ event is fired on the `window` object whenever an exception occurs on the page.\n\
    \n```html\n<html>\n<head>\n<script type = \"text/javascript\">\n<!--\nwindow.onerror\
    \ = function () {\n  alert(\"An error occurred.\");\n}\n//-->\n</script>\n</head>\n\
    <body>\n<p>Click the following to see the result:</p>\n<form>\n  <input type =\
    \ \"button\" value = \"Click Me\" onclick = \"myFunc();\" />\n</form>\n</body>\n\
    </html>\n```\n\n### Output\n\nThe `onerror` event handler provides three pieces\
    \ of information to identify the exact nature of the error −\n\n- `Error message`\
    \ − The same message that the browser would display for the given error\n- `URL`\
    \ − The file in which the error occurred\n- `Line number` − The line number in\
    \ the given URL that caused the error\n\nHere is the example to show how to extract\
    \ this information.\n\n### Example\n\n```html\n<html>\n<head>\n<script type =\
    \ \"text/javascript\">\n<!--\nwindow.onerror = function (msg, url, line) {\n \
    \ alert(\"Message : \"  + msg );\n  alert(\"url : \"  + url );\n  alert(\"Line\
    \ number : \"  + line );\n}\n//-->\n</script>\n</head>\n<body>\n<p>Click the following\
    \ to see the result:</p>\n<form>\n  <input type = \"button\" value = \"Click Me\"\
    \ onclick = \"myFunc();\" />\n</form>\n</body>\n</html>\n```\n\n### Output\n\n\
    You can display extracted information in whatever way you think it is better.\n\
    \nYou can use an `onerror` method, as shown below, to display an error message\
    \ in case there is any problem in loading an image.\n\n```html\n<img src=\"myimage.gif\"\
    \ onerror=\"alert('An error occurred loading the image.')\" />\n```\n\nYou can\
    \ use `onerror` with many HTML tags to display appropriate messages in case of\
    \ errors.\n\n# Form Validation\n\nForm validation normally used to occur at the\
    \ server, after the client had entered all the necessary data and then pressed\
    \ the Submit button. If the data entered by a client was incorrect or was simply\
    \ missing, the server would have to send all the data back to the client and request\
    \ that the form be resubmitted with correct information. This was really a lengthy\
    \ process which used to put a lot of burden on the server.\n\nJavaScript provides\
    \ a way to validate data on the client before sending it to the server. Form validation\
    \ generally performs functions:\n\n- `Basic Validation` − First of all, the form\
    \ must be checked to make sure mandatory fields are filled.\n- `Data Validation`\
    \ − Secondly, the data that entered must be checked for correctness.\n\n### Example\n\
    \nLet us see how to do basic validation. In the above form, we are calling `validate()`\
    \ when `onsubmit` event is occurring. The following code shows the implementation\
    \ of this function.\n\n```html\n<html>\n<head>\n<title>Form Validation</title>\n\
    <script type = \"text/javascript\">\n<!--\n// Form validation will come here.\n\
    function validate() {\n  if( myform.Name.value == \"\" ) {\n    alert(\"Please\
    \ provide your name!\" );\n    document.myForm.Name.focus() ;\n    return false;\n\
    \  }\n  if( myform.EMail.value == \"\" ) {\n    alert(\"Please provide your Email!\"\
    \ );\n    document.myForm.EMail.focus() ;\n    return false;\n  }\n  if( myform.Zip.value\
    \ == \"\" || isNaN( document.myForm.Zip.value ) || document.myForm.Zip.value.length\
    \ != 5 ) {\n    alert(\"Please provide a zip in format #####.\" );\n    document.myForm.Zip.focus()\
    \ ;\n    return false;\n  }\n  if( myform.Country.value == \"-1\" ) {\n    alert(\"\
    Please provide your country!\" );\n    return false;\n  }\n  return( true );\n\
    }\n//-->\n</script>\n</head>\n<body>\n<form name=\"myForm\" action=\"/cgi-test.cgi\"\
    \ onsubmit=\"return(validate());\" method=\"post\" cellpadding=\"2\" cellspacing=\"\
    0\">\n  <table>\n    <tr>\n      <td>Name</td>\n      <td><input type=\"text\"\
    \ name=\"Name\"></td>\n    </tr>\n    <tr>\n      <td>Email</td>\n      <td><input\
    \ type=\"text\" name=\"EMail\"></td>\n    </tr>\n    <tr>\n      <td>Zip</td>\n\
    \      <td><input type=\"text\" name=\"Zip\"></td>\n    </tr>\n    <tr>\n    \
    \  <td>Country</td>\n      <td>\n        <select name=\"Country\">\n         \
    \ <option value=\"-1\">[choose]</option>\n          <option value=\"1\">USA</option>\n\
    \          <option value=\"2\">UK</option>\n          <option value=\"3\">INDIA</option>\n\
    \        </select>\n      </td>\n    </tr>\n  </table>\n  <input type=\"submit\"\
    \ value=\"Submit\" />\n</form>\n</body>\n</html>\n```\n\n### Output\n\nNow we\
    \ will see how we can validate our entered form data before submitting it to the\
    \ web server. The following example shows how to validate an entered email address.\
    \ An email address must contain at least a `@` sign and a dot (.). Also, the `@`\
