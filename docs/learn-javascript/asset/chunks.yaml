    \ `variablename`，此循环会一直持续直到对象的所有属性都被遍历完毕。\n\n### 示例\n尝试以下示例来实现 `for-in` 循环。它会打印网络浏览器的\
    \ `Navigator` 对象。\n\n```html\n<html>\n<body>\n<script type  =  \"text/javascript\"\
    >\n<!--\nvar aProperty;\ndocument.write(\"Navigator Object Properties<br /> \"\
    );\nfor  (aProperty in navigator)  {\n  document.write(aProperty);\n  document.write(\"\
    <br />\");\n}\ndocument.write (\"Exiting from the loop!\");\n//-->\n</script>\n\
    <p>将变量设置为不同的对象并尝试...</p>\n</body>\n</html>\n```\n\n### 输出\nNavigator Object Properties\n\
    serviceWorker\nwebkitPersistentStorage\nwebkitTemporaryStorage\ngeolocation\n\
    doNotTrack\nonLine\nlanguages\nlanguage\nuserAgent\nproduct\nplatform\nappVersion\n\
    appName\nappCodeName\nhardwareConcurrency\nmaxTouchPoints\nvendorSub\nvendor\n\
    productSub\ncookieEnabled\nmimeTypes\nplugins\njavaEnabled\ngetStorageUpdates\n\
    getGamepads\nwebkitGetUserMedia\nvibrate\ngetBattery\nsendBeacon\nregisterProtocolHandler\n\
    unregisterProtocolHandler\nExiting from the loop!\n将变量设置为不同的对象并尝试...\n\n# 循环控制\n\
    JavaScript 提供了完全控制来处理循环和 switch 语句。可能会出现这种情况：你需要在到达循环底部之前退出循环。也可能这种情况：你想跳过代码块的一部分并开始循环的下一次迭代。\n\
    \n为了处理所有此类情况，JavaScript 提供了 `break` 和 `continue` 语句。这些语句分别用于立即退出任何循环或开始任何循环的下一次迭代。\n\
    \n## break 语句\n`break` 语句在 `switch` 语句中曾简要介绍过，用于提前退出循环，跳出外层的大括号。\n\n### 流程图\n\
    break 语句的流程图所示 −\n\n![Image](img/image00223.jpeg)\n\n### 示例\n以下示例说明了在 while 循环中使用\
    \ `break` 语句。请注意当 `x` 达到 5 时，循环是如何提前退出并到达紧接闭合大括号下方的 `document.write (..)` 语句的\
    \ −\n\n\n\n```html\n<html>\n<body>\n<script type  =  \"text/javascript\">\n<!--\n\
    var x =  1;\ndocument.write(\"Entering the loop<br /> \");\nwhile  (x <  20) \
    \ {\n  if  (x ==  5)  {\n    break;  // 完全跳出循环\n  }\n  x = x +  1;\n  document.write(\
    \ x +  \"<br />\");\n}\ndocument.write(\"Exiting the loop!<br /> \");\n//-->\n\
    </script>\n<p>将变量设置为不同的值并尝试...</p>\n</body>\n</html>\n```\n\n### 输出\nEntering\
    \ the loop\n2\n3\n4\n5\nExiting the loop!\n将变量设置为不同的值并尝试...\n\n我们已经见过 `break`\
    \ 语句在 switch 内部的用法。\n\n## continue 语句\n`continue` 语句告诉解释器立即开始循环的下一次迭代并跳过剩余代码块。当遇到\
    \ `continue` 语句时，程序流会立即移动到循环检查表达式，如果条件仍为真，则开始下一次迭代，否则控制将退出循环。\n\n### 示例\n此示例说明了在\
    \ while 循环中使用 `continue` 语句。请注意当变量 `x` 中的索引达到 5 时，如何使用 `continue` 语句跳过打印 −\n\n\
    ```html\n<html>\n<body>\n<script type  =  \"text/javascript\">\n<!--\nvar x =\
    \  1;\ndocument.write(\"Entering the loop<br /> \");\nwhile  (x <  10)  {\n  x\
    \ = x +  1;\n  if  (x ==  5)  {\n    continue;\n  }\n  document.write( x +  \"\
    <br />\");\n}\ndocument.write(\"Exiting the loop!<br /> \");\n//-->\n</script>\n\
    <p>将变量设置为不同的值并尝试...</p>\n</body>\n</html>\n```\n\n### 输出\nEntering the loop\n\
    2\n3\n4\n5\n6\n7\n8\n9\n10\nExiting the loop!\n将变量设置为不同的值并尝试...\n\n"
