    \ you can include an external JavaScript file in your HTML code using `script`\
    \ tag and its `src` attribute.\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\"\
    \ src=\"filename.js\"></script>\n</head>\n<body>\n.......\n</body>\n</html>\n\
    ```\n\nTo use JavaScript from an external file source, you need to write all your\
    \ JavaScript source code in a simple text file with the extension `.js` and then\
    \ include that file as shown above.\n\nFor example, you can keep the following\
    \ content in `filename.js` file and then you can use the `sayHello` function in\
    \ your HTML file after including the `filename.js` file.\n\n```javascript\nfunction\
    \ sayHello() {\n  alert(\"Hello World\")\n}\n```\n\n### # Variables\n\n#### ##\
    \ JavaScript Datatypes\n\nOne of the most fundamental characteristics of a programming\
    \ language is the set of data types it supports. These are the type of values\
    \ that can be represented and manipulated in a programming language.\n\nJavaScript\
    \ allows you to work with three primitive data types −\n\n* `Numbers`, eg. 123,\
    \ 120.50 etc.\n* `Strings` of text e.g. \"This text string\" etc.\n* `Boolean`\
    \ e.g. true or false.\n\nJavaScript also defines two trivial data types, `null`\
    \ and `undefined`, each of which defines only a single value. In addition to these\
    \ primitive data types, JavaScript supports a composite data type known as `object`.\
    \ We will cover objects in detail in a separate chapter.\n\n**Note** − JavaScript\
    \ does not make a distinction between integer values and floating-point values.\
    \ All numbers in JavaScript are represented as floating-point values. JavaScript\
    \ represents numbers using the 64-bit floating-point format defined by the IEEE\
    \ 754 standard.\n\n#### ## JavaScript Variables\n\nLike many other programming\
    \ languages, JavaScript has variables. Variables can be thought of as named containers.\
    \ You can place data into these containers and then refer to the data simply by\
    \ naming the container.\n\nBefore you use a variable in a JavaScript program,\
    \ you must declare it. Variables are declared with the `var` keyword as follows.\n\
    \n```javascript\n<script type=\"text/javascript\">\n<!--\nvar money;\nvar name;\n\
    //-->\n</script>\n```\n\nYou can also declare multiple variables with the same\
    \ `var` keyword as follows −\n\n```javascript\n<script type=\"text/javascript\"\
    >\n<!--\nvar money, name;\n//-->\n</script>\n```\n\nStoring a value in a variable\
    \ is called `variable initialization`. You can do variable initialization at the\
    \ time of variable creation or at a later point in time when you need that variable.\n\
    \nFor instance, you might create a variable named `money` and assign the value\
    \ 2000.50 to it later.\n\n```javascript\n<script type=\"text/javascript\">\n<!--\n\
    var name = \"Ali\";\nvar money;\nmoney = 2000.50;\n//-->\n</script>\n```\n\n**Note**\
    \ − Use the `var` keyword only for declaration or initialization, once for the\
    \ life of any variable name in a document. You should not re-declare same variable\
    \ twice.\n\nJavaScript is `untyped` language. This means that a JavaScript variable\
    \ can hold a value of any data type. Unlike many other languages, you don't have\
    \ to tell JavaScript during variable declaration what type of value the variable\
    \ will hold. The value type of a variable can change during the execution of a\
    \ program and JavaScript takes care of it automatically.\n\n#### ## JavaScript\
    \ Variable Scope\n\nThe scope of a variable is the region of your program in which\
    \ it is defined. JavaScript variables have only two scopes.\n\n* `Global Variables`\
    \ − a global variable has global scope which means it can be defined anywhere\
    \ in your JavaScript code.\n* `Local Variables` − a local variable will be visible\
    \ only within a function where it is defined. Function parameters are always local\
    \ to that function.\n\nWithin the body of a function, a local variable takes precedence\
    \ over a global variable with the same name. If you declare a local variable or\
    \ function parameter with the same name as a global variable, you effectively\
    \ hide the global variable. Take a look into the following example.\n\n```html\n\
    <body onload=checkscope();>\n<script type=\"text/javascript\">\n<!--\nvar myVar\
    \ = \"global\";\nfunction checkscope() {\n  document.write(myVar);\n}\n//-->\n\
    </script>\n</body>\n</html>\n```\n\n### # Variable Names\n\nWhile naming your\
    \ variables in JavaScript, keep the following rules in mind:\n\n* JavaScript names\
    \ should not start with a numeral (0-9). They must begin with a letter or an underscore.\n\
    * JavaScript names are case-sensitive.\n\n### # Reserved Words\n\nA list of all\
    \ reserved words are given in the following table.\n\n| abstract | else | instanceof\
    \ | switch |\n| boolean | enum | int | synchronized |\n| break | export | interface\
    \ | this |\n| byte | extends | long | throw |\n| case | false | native | transient\
    \ |\n| char | finally | new | true |\n| class | float | package | try |\n| const\
