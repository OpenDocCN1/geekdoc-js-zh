    ## 自定义对象 (User-Defined Objects)


    所有自定义对象和内置对象都是名为 `Object` 的对象的后代。


    ### new 运算符


    `new` 运算符用于创建对象的实例。要创建一个对象，`new` 运算符后面跟着构造方法。


    在下面的示例中，构造方法是 Object()、Array() 和 Date()。这些构造方法是内置的 JavaScript 函数。


    ```javascript

    var employee = new Object();


    var books = new Array("C++", "Perl", "Java");


    var day = new Date("August 15, 1947");

    ```


    ### Object() 构造函数


    '
- fmt: '

    A constructor is a function that creates and initializes an object. JavaScript
    provides a special constructor function called `Object()` to build the object.
    The return value of the `Object()` constructor is assigned to a variable.


    The variable contains a reference to the new object. The properties assigned to
    the object are not variables and are not defined with the `var` keyword.


    ### Example 1


    Try the following example; it demonstrates how to create an Object.


    ```html

    <html>

    <head>

    <title>User-defined objects</title>

    <script type = "text/javascript">

    var book = new Object();  // Create the object

    book.subject = "Perl";  // Assign properties to the object

    book.author = "Mohtashim";

    </script>

    </head>

    <body>

    <script type = "text/javascript">

    document.write("Book name is : " + book.subject + "<br>");

    document.write("Book author is : " + book.author + "<br>");

    </script>

    </body>

    </html>

    ```


    ### Output

    Book name is : Perl

    Book author is : Mohtashim


    ### Example 2


    This example demonstrates how to create an object with a User-Defined Function.
    Here `this` keyword is used to refer to the object that has been passed to a function.


    ```html

    <html>

    <head>

    <title>User-defined objects</title>

    <script type = "text/javascript">

    function book(title, author) {

    this.title = title;

    this.author = author;

    }

    </script>

    </head>

    <body>

    <script type = "text/javascript">

    var myBook = new book("Perl", "Mohtashim");

    document.write("Book title is : " + myBook.title + "<br>");

    document.write("Book author is : " + myBook.author + "<br>");

    </script>

    </body>

    </html>

    ```


    ### Output

    Book title is : Perl

    Book author is : Mohtashim


    ## Defining Methods for an Object


    The previous examples demonstrate how the constructor creates the object and assigns
    properties. But we need to complete the definition of an object by assigning methods
    to it.


    ### Example


    Try the following example; it shows how to add a function along with an object.


    ```html

    <html>

    <head>

    <title>User-defined objects</title>

    <script type = "text/javascript">

    // Define a function which will work as a method

    function addPrice(amount) {

    this.price = amount;

    }

    function book(title, author) {

    this.title = title;

    this.author = author;

    this.addPrice = addPrice;  // Assign that method as property.

    }

    </script>

    </head>

    <body>

    <script type = "text/javascript">

    var myBook = new book("Perl", "Mohtashim");

    myBook.addPrice(100);

    document.write("Book title is : " + myBook.title + "<br>");

    document.write("Book author is : " + myBook.author + "<br>");

    document.write("Book price is : " + myBook.price + "<br>");

    </script>

    </body>

    </html>

    ```


    ### Output

    Book title is : Perl

    Book author is : Mohtashim

    Book price is : 100


    ## The ''with'' Keyword


    The `with` keyword is used as a kind of shorthand for referencing an object''s
    properties or methods.


    The object specified as an argument to `with` becomes the default object for the
    duration of the block that follows. The properties and methods for the object
    can be used without naming the object.


    ### Syntax


    The syntax for with object is as follows −


    ```javascript

    with (object) {

    properties used without the object name and dot

    }

    ```


    ### Example


    Try the following example.


    ```html

    <html>

    <head>

    <title>User-defined objects</title>

    <script type = "text/javascript">

    // Define a function which will work as a method

    function addPrice(amount) {

    with(this) {

    price = amount;

    }

    }

    function book(title, author) {

    this.title = title;

    this.author = author;

    this.price = 0;

    this.addPrice = addPrice;  // Assign that method as property.

    }

    </script>

    </head>

    <body>

    <script type = "text/javascript">

    var myBook = new book("Perl", "Mohtashim");

    myBook.addPrice(100);

    document.write("Book title is : " + myBook.title + "<br>");

    document.write("Book author is : " + myBook.author + "<br>");

    document.write("Book price is : " + myBook.price + "<br>");

    </script>

    </body>

    </html>

    ```


    ### Output

    Book name is : Perl

    Book author is : Mohtashim

    Book price is : 100


    ## JavaScript Native Objects


    JavaScript has several built-in or native objects. These objects are accessible
    anywhere in your program and will work the same way in any browser running in
    any operating system.


    Here is the list of all Native Objects −

    * `Number Object`

    * `Boolean Object`

    * `String Object`

    * `Array Object`

    * `Date Object`

    * `Math Object`

    * `RegExp Object`


    # The Number Object


    The `Number` object represents integers or floating-point numbers. In general,
    you do not need to worry about `Number` instances because JavaScript automatically
    converts literals to.


    ### Syntax


    The syntax for creating a `number` object is as follows −


    ```javascript

    var val = Number(number)

    ```


    ## Number Properties


    Here is the list of each property:


    | Sr.No. | Property | Description |

    | :--- | :--- | :--- |

    | 1 | `MAX_VALUE` | The largest possible value a number can have (1.7976931348623157+308)
    |

    | 2 | `MIN_VALUE` | The smallest possible value a number can have (5e-324) (wait,
    it''s 5e-324) |

    | 3 | `NaN` | A value that is not a number |

    | 4 | `NEGATIVE_INFINITY` | A value that is less than `MIN_VALUE` |

    | 5 | `POSITIVE_INFINITY` | A value that is greater than `MAX_VALUE` |

    | 6 | `prototype` | A static property of the Number object |

    | 7 | `constructor` | Returns a reference to the function that created the object
    |


    ## Number Methods


    The `Number` object contains methods that are part of every object:


    | Sr.No. | Method | Description |

    | :--- | :--- | :--- |

    | 1 | `toExponential()` | Forces a number to display in exponential notation |

    | 2 | `toFixed()` | Formats a number with a specific number of digits after the
    decimal |

    | 3 | `toLocaleString()` | Returns a string value of the number in local settings
    |

    | 4 | `toPrecision()` | Defines how many total digits to display |

    | 5 | `toString()` | Returns the string representation of the number''s value
    |

    | 6 | `valueOf()` | Returns the number''s value |


    # The Boolean Object


    The `Boolean` object represents two values: "true" or "false".


    ### Syntax


    Use the following syntax to create a `Boolean` object:


    ```javascript

    var val = new Boolean(value)

    ```


    ## Boolean Properties


    | Sr.No. | Property | Description |

    | :--- | :--- | :--- |

    | 1 | `constructor` | Returns a reference to the function that created the object
    |

    | 2 | `prototype` | Allows you to add properties and methods to an object |


    ## Boolean Methods


    | Sr.No. | Method | Description |

    | :--- | :--- | :--- |

    | 1 | `toSource()` | Returns a string containing the source of the Boolean object
    |

    | 2 | `toString()` | Returns a string of either "true" or "false" |

