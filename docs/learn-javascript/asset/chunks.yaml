    # Prompt Dialog Box


    The prompt dialog box is very useful when you want to pop-up a text box to get
    user input. Thus, it enables you to interact with the user. The user needs to
    fill in the field and then click OK.


    This dialog box is displayed using a method called `prompt()` which takes two
    parameters: (i) a label which you want to display in the text box and (ii) a default
    string to display in the text box.


    This dialog box has two buttons: `OK` and `Cancel`. If the user clicks the OK
    button, the window method `prompt()` will return the entered value from the text
    box. If the user clicks the Cancel button, the window method `prompt()` returns
    `null`.


    ### Example


    The following example shows how to use a prompt dialog box −


    ```html

    <html>

    <head>

    <script type="text/javascript">

    <!--

    function getValue() {

    var retVal = prompt("Enter your name : ", "your name here");

    document.write("You have entered : " + retVal);

    }

    //-->

    </script>

    </head>

    <body>

    <p>Click the following button to see the result: </p>

    <form>

    <input type="button" value="Click Me" onclick="getValue();" />

    </form>

    </body>

    </html>

    ```


    ### Output


    # JavaScript - Void Keyword


    `void` is an important keyword in JavaScript which can be used as a unary operator
    that appears before its single operand, which may be of any type. This operator
    specifies an expression to be evaluated without returning a value.


    ## Syntax


    The syntax of `void` can be either of the following two −


    ```html

    <head>

    <script type="text/javascript">

    <!--

    void func()

    javascript:void func()

    or:

    void(func())

    javascript:void(func())

    //-->

    </script>

    </head>

    ```


    ### Example 1


    The most common use of this operator is in a client-side `javascript:` URL, where
    it allows you to evaluate an expression for its side-effects without the browser
    displaying the value of the evaluated expression.


    Here the expression `alert (''Warning!!!'')` is evaluated but it is not loaded
    back into the current document –


    ```html

    <html>

    <head>

    <script type="text/javascript">

    <!--

    //-->

    </script>

    </head>

    <body>

    <p>Click the following, This won''t react at all...</p>

    <a href="javascript:void(alert(''Warning!!!''))">Click me!</a>

    </body>

    </html>

    ```


    ### Output


    ### Example 2


    Take a look at the following example. The following link does nothing because
    the expression "0" has no effect in JavaScript. Here the expression "0" is evaluated,
    but it is not loaded back into the current document.


    ```html

    <html>

    <head>

    <script type="text/javascript">

    <!--

    //-->

    </script>

    </head>

    <body>

    <p>Click the following, This won''t react at all...</p>

    <a href="javascript:void(0)">Click me!</a>

    </body>

    </html>

