    | 12 | `reduceRight()` Apply a function simultaneously against two values of the
    array (from right-to-left) as to reduce it to a single value. |

    | 13 | `reverse()` Reverses the order of the elements of an array -- the first
    becomes the last, and the last becomes the first. |

