    # Page Redirection


    ## What is Page Redirection ?


    You might have encountered a situation where you clicked a URL to reach a page
    X but internally you were directed to another page Y. It happens due to **page
    redirection**. This concept is different from **JavaScript Page Refresh**.


    There could be various reasons why you would like to redirect a user from the
    original page. We are listing down a few of the reasons −


    *   You did not like the name of your domain and you are moving to a new one.
    In such a scenario, you may want to direct all your visitors to the new site.
    Here you can maintain your old domain but put a single page with a page redirection
    such that all your old domain visitors can come to your new domain.


    *   You have built-up various pages based on browser versions or their names or
    may be based on different countries, then instead of using your server-side page
    redirection, you can use client-side page redirection to land your users on the
    appropriate page.


    *   The Search Engines may have already indexed your pages. But while moving to
    another domain, you would not like to lose your visitors coming through search
    engines. So you can use client-side page redirection. But keep in mind this should
    not be done to fool the search engine, it could lead your site to get banned.


    ## How Page Re-direction Works ?


    The implementations of Page-Redirection are as follows.


    ### Example 1


    It is quite simple to do a page redirect using JavaScript at client side. To redirect
    your site visitors to a new page, you just need to add a line in your head section
    as follows.


    <html>


    <head>


    <script  type  =  "text/javascript">


    <!--


    function  Redirect()  {


    window.location =  "https://www.tutorialspoint.com";


    }


    //-->


    </script>


    </head>


    <body>


    <p>Click the following button, you will be redirected to home page.</p>


    <form>


    <input  type  =  "button"  value  =  "Redirect Me"  onclick  =  "Redirect();"  />


    </form>


    </body>


    </html>


    ### Output


    ### Example 2


    You can show an appropriate message to your site visitors before redirecting them
    to a new page. This would need a bit time delay to load a new page. The following
    example shows how to implement the same. Here **setTimeout()** is a built-in JavaScript
    function which can be used to execute another function after a given time interval.


    <html>


    <head>


    <script  type  =  "text/javascript">


    <!--


    function  Redirect()  {


    window.location =  "https://www.tutorialspoint.com";


    }


    document.write("You will be redirected to main page in 10 sec.");


    setTimeout(''Redirect()'',  10000);


    //-->


    </script>


    </head>


    <body>


    </body>


    </html>


    ### Output


    You will be redirected to tutorialspoint.com main page in 10 seconds!


    ### Example 3


    The following example shows how to redirect your site visitors onto a different
    page based on their browsers.


    <html>


    <head>


    <script  type  =  "text/javascript">


    <!--


    var browsername = navigator.appName;


    if( browsername ==  "Netscape"  )  {


    window.location =  "http://www.location.com/ns.htm";


    }  else  if  ( browsername =="Microsoft Internet Explorer")  {


    window.location =  "http://www.location.com/ie.htm";


    }  else  {


    window.location =  "http://www.location.com/other.htm";


    }


    //-->


    </script>


    </head>


    <body>


    </body>


    </html>


    # Dialog Boxes


    JavaScript supports three important types of dialog boxes. These dialog boxes
    can be used to raise and alert, or to get confirmation on any input or to have
    a kind of input from the users. Here we will discuss each dialog box one by one.


    ## Alert Dialog Box


    An alert dialog box is mostly used to give a warning message to the users. For
    example, if one input field requires to enter some text but the user does not
    provide any input, then as a part of validation, you can use an alert box to give
    a warning message.


    Nonetheless, an alert box can still be used for friendlier messages. Alert box
    gives only one button "OK" to select and proceed.


    ### Example


    <html>


    <head>


    <script  type  =  "text/javascript">


    <!--


    function  Warn()  {


    alert ("This is a warning message!");


    document.write ("This is a warning message!");


    }


    //-->


    </script>


    </head>


    <body>


    <p>Click the following button to see the result: </p>


    <form>


    <input  type  =  "button"  value  =  "Click Me"  onclick  =  "Warn();"  />


    </form>


    </body>


    </html>


    ### Output


