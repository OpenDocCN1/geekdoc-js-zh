    ## The throw Statement


    You can use **throw** statement to raise your built-in exceptions or your customized
    exceptions. Later these exceptions can be captured and you can take an appropriate
    action.


    ### Example


    The following example demonstrates how to use a **throw** statement.


    <html>


    <head>


    <script  type  =  "text/javascript">


    <!--


    function myFunc()  {


    var a =  100;


    var b =  0;


    try  {


    if  ( b ==  0  )  {


    throw(  "Divide by zero error."  );


    }  else  {


    var c = a / b;


    }


    }


    catch  ( e )  {


    alert("Error: "  + e );


    }


    }


    //-->


    </script>


    </head>


    <body>


    <p>Click the following to see the result:</p>


    <form>


    <input  type  =  "button"  value  =  "Click Me"  onclick  =  "myFunc();"  />


    </form>


    </body>


    </html>


    ### Output


    You can raise an exception in one function using a string, integer, Boolean, or
    an object and then you can capture that exception either in the same function
    as we did above, or in another function using a **try...catch** block.


    ## The onerror() Method


    The **onerror** event handler was the first feature to facilitate error handling
    in JavaScript. The **error** event is fired on the window object whenever an exception
    occurs on the page.


    <html>


    <head>


    <script  type  =  "text/javascript">


    <!--


    window.onerror =  function  ()  {


    alert("An error occurred.");


    }


    //-->


    </script>


    </head>


    <body>


    <p>Click the following to see the result:</p>


    <form>


    <input  type  =  "button"  value  =  "Click Me"  onclick  =  "myFunc();"  />


    </form>


    </body>


    </html>


    ### Output


    The **onerror** event handler provides three pieces of information to identify
    the exact nature of the error −


    *   **Error message** − The same message that the browser would display for the
    given error


    *   **URL** − The file in which the error occurred


    *   **Line number**− The line number in the given URL that caused the error


    Here is the example to show how to extract this information.


    ### Example


    <html>


    <head>


    <script  type  =  "text/javascript">


    <!--


    window.onerror =  function  (msg, url, line)  {


    alert("Message : "  + msg );


    alert("url : "  + url );


    alert("Line number : "  + line );


    }


    //-->


    </script>


    </head>


    <body>


    <p>Click the following to see the result:</p>


    <form>


    <input  type  =  "button"  value  =  "Click Me"  onclick  =  "myFunc();"  />


    </form>


    </body>


    </html>


    ### Output


    You can display extracted information in whatever way you think it is better.


    You can use an **onerror** method, as shown below, to display an error message
    in case there is any problem in loading an image.


    <img  src="myimage.gif"  onerror="alert(''An error occurred loading the image.'')"  />


    You can use **onerror** with many HTML tags to display appropriate messages in
    case of errors.


    # Form Validation


    Form validation normally used to occur at the server, after the client had entered
    all the necessary data and then pressed the Submit button. If the data entered
    by a client was incorrect or was simply missing, the server would have to send
    all the data back to the client and request that the form be resubmitted with
    correct information. This was really a lengthy process which used to put a lot
    of burden on the server.


    JavaScript provides a way to validate form''s data on the client''s computer before
    sending it to the web server. Form validation generally performs two functions.


    *   **Basic Validation** − First of all, the form must be checked to make sure
    all the mandatory fields are filled in. It would require just a loop through each
    field in the form and check for data.


    *   **Data Format Validation** − Secondly, the data that is entered must be checked
    for correct form and value. Your code must include appropriate logic to test correctness
    of data.


    ### Example


    We will take an example to understand the process of validation. Here is a simple
    form in html format.


    <html>


    <head>


    <title>Form Validation</title>


    <script  type  =  "text/javascript">


    <!--


    // Form validation code will come here.


    //-->


    </script>


    </head>


    <body>


    <form  action  =  "/cgi-bin/test.cgi"  name  =  "myForm"  onsubmit  =  "return(validate());">


    <table  cellspacing  =  "2"  cellpadding  =  "2"  border  =  "1">


    <tr>


    <td  align  =  "right">Name</td>


    <td><input  type  =  "text"  name  =  "Name"  /></td>


    </tr>


    <tr>


    <td  align  =  "right">EMail</td>


    <td><input  type  =  "text"  name  =  "EMail"  /></td>


    </tr>


    <tr>


    <td  align  =  "right">Zip Code</td>


    <td><input  type  =  "text"  name  =  "Zip"  /></td>


    </tr>


    <tr>


    <td  align  =  "right">Country</td>


    <td>


    <select  name  =  "Country">


    <option  value  =  "-1"  selected>[choose yours]</option>


    <option  value  =  "1">USA</option>


    <option  value  =  "2">UK</option>


    <option  value  =  "3">INDIA</option>


    </select>


    </td>


    </tr>


    <tr>


    <td  align  =  "right"></td>


    <td><input  type  =  "submit"  value  =  "Submit"  /></td>


    </tr>


    </table>


    </form>


    </body>


    </html>


    ### Output


    ## Basic Form Validation


    First let us see how to do a basic form validation. In the above form, we are
    calling **validate()** to validate data when **onsubmit** event is occurring.
    The following code shows the implementation of this validate() function.


    <script  type  =  "text/javascript">


    <!--


    // Form validation code will come here.


    function validate()  {


    if( document.myForm.Name.value ==  ""  )  {


    alert(  "Please provide your name!"  );


    document.myForm.Name.focus()  ;


    return  false;


    }


    if( document.myForm.EMail.value ==  ""  )  {


    alert(  "Please provide your Email!"  );


    document.myForm.EMail.focus()  ;


    return  false;


    }


    if( document.myForm.Zip.value ==  ""  || isNaN( document.myForm.Zip.value )  ||


    document.myForm.Zip.value.length !=  5  )  {


    alert(  "Please provide a zip in the format #####."  );


    document.myForm.Zip.focus()  ;


    return  false;


    }


    if( document.myForm.Country.value ==  "-1"  )  {


    alert(  "Please provide your country!"  );


    return  false;


    }


    return(  true  );


    }


    //-->


    </script>


    ## Data Format Validation


    Now we will see how we can validate our entered form data before submitting it
    to the web server.


    The following example shows how to validate an entered email address. An email
    address must contain at least a ‘@’ sign and a dot (.). Also, the ‘@’ must not
    be the first character of the email address, and the last dot must at least be
    one character after the ‘@’ sign.


    ### Example


    Try the following code for email validation.


    <script  type  =  "text/javascript">


    <!--


    function validateEmail()  {


    var emailID = document.myForm.EMail.value;


    atpos = emailID.indexOf("@");


    dotpos = emailID.lastIndexOf(".");


    if  (atpos <  1  ||  ( dotpos - atpos <  2  ))  {


    alert("Please enter correct email ID")


    document.myForm.EMail.focus()  ;


    return  false;


    }


    return(  true  );


    }


    //-->


    </script>


    # Animation


    You can use JavaScript to create a complex animation having, but not limited to,
    the following elements −


    *   Fireworks


    *   Fade Effect


    *   Roll-in or Roll-out


    *   Page-in or Page-out


    *   Object movements


    You might be interested in existing JavaScript based animation library: **Script.Aculo.us**.'
