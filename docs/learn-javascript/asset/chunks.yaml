    Before we use a function, we need to define it. The most common way to define
    a function in JavaScript is by using the `function` keyword, followed by a unique
    function name, a list of parameters (that might be empty), and a statement block
    surrounded by curly braces.


    ### Syntax


    The basic syntax is shown here.


    ```html

    <script type="text/javascript">

    <!--

    function functionname(parameter-list) {

    statements

    }

    //-->

    </script>

    ```


    ### Example


    Try the following example. It defines a function called `sayHello` that takes
    no parameters -


    ```html

    <script type  = "text/javascript">

    <!--

    function sayHello()  {

    alert("Hello there");

    }

    //-->

    </script>

    ```


    ## Calling a Function


    To invoke a function somewhere later in the script, you would simply need to write
    the name of that function as shown in the following code.


    ```html

    <html>

    <head>

    <script type = "text/javascript">

    function sayHello()  {

    document.write ("Hello there!");

    }

    </script>

    </head>

    <body>

    <p>Click the following button to call the function</p>

    <form>

    <input type = "button" onclick = "sayHello()" value = "Say Hello">

    </form>

    <p>Use different text in write method and then try...</p>

    </body>

    </html>

    ```


    ### Output


    ## Function Parameters


    Till now, we have seen functions without parameters. But there is a facility to
    pass different parameters while calling a function. These passed parameters can
    be captured inside the function and any manipulation can be done over those parameters.
    A function can take multiple parameters separated by comma.


    ### Example


    Try the following example. We have modified our `sayHello` function here. Now
    it takes two parameters.


    ```html

    <html>

    <head>

    <script type = "text/javascript">

    function sayHello(name, age)  {

    document.write (name + " is "  + age + " years old.");

    }

    </script>

    </head>

    <body>

    <p>Click the following button to call the function</p>

    <form>

    <input type = "button" onclick = "sayHello(''Zara'', 7)" value = "Say Hello">

    </form>

    <p>Use different parameters inside the function and then try...</p>

    </body>

    </html>

    ```


    ### Output


    ## The return Statement


    A JavaScript function can have an optional `return` statement. This is required
    if you want to return a value from a function. This statement should be the last
    statement in a function.


    For example, you can pass two numbers in a function and then you can expect the
    function to return their multiplication in your calling program.


    ### Example


    Try the following example. It defines a function that takes two parameters and
    concatenates them before returning the resultant in the calling program.


    ```html

    <html>

    <head>

    <script type = "text/javascript">

    function concatenate(first, last)  {

    var full;

    full = first + last;

    return full;

    }

    function secondFunction()  {

    var result;

    result = concatenate(''Zara'', ''Ali'');

    document.write (result );

    }

    </script>

    </head>

    <body>

    <p>Click the following button to call the function</p>

    <form>

    <input type = "button" onclick = "secondFunction()" value = "Call Function">

    </form>

    <p>Use different parameters inside the function and then try...</p>

    </body>

    </html>

    ```


    ### Output


    There is a lot to learn about JavaScript functions, however we have covered the
    most important concepts in this tutorial.


    * **JavaScript Nested Functions**

    * **JavaScript Function( ) Constructor**

    * **JavaScript Function Literals**


    # Events


    ## What is an Event?


    JavaScript''s interaction with HTML is handled through events that occur when
    the user or the browser manipulates a page.


    When the page loads, it is called an event. When the user clicks a button, that
    click too is an event. Other examples include events like pressing any key, closing
    a window, resizing a window, etc.


    Developers can use these events to execute JavaScript coded responses, which cause
    buttons to close windows, messages to be displayed to users, data to be validated,
    and virtually any other type of response imaginable.


    Events are a part of the Document Object Model (DOM) Level 3 and every HTML element
    contains a set of events which can trigger JavaScript Code.


    Please go through this small tutorial for a better understanding `HTML Event Reference`.
    Here we will see a few examples to understand a relation between Event and JavaScript
    -


    ## onclick Event Type


    This is the most frequently used event type which occurs when a user clicks the
    left button of his mouse. You can put your validation, warning etc., against this
    event type.


    ### Example


    Try the following example.


    ```html

    <html>

    <head>

    <script type = "text/javascript">

    <!--

    function sayHello()  {

    alert("Hello World")

    }

    //-->

    </script>

    </head>

    <body>

    <p>Click the following button and see result</p>

    <form>

    <input type = "button" onclick = "sayHello()" value = "Say Hello" />

    </form>

    </body>

    </html>

    ```


    ### Output


    ## onsubmit Event Type


    `onsubmit` is the event that occurs when a user clicks the left button of his
    mouse. You can put your validation, warning etc., against this event type.


    ### Example


    The following example shows how to use `onsubmit`. Here `validate()` is triggered
    before the form.


    ```html

    <html>

    <head>

    <script type = "text/javascript">

    <!--

    function validate()  {

    all goes here

    }

    //-->

    </script>

    </head>

    <body>

    <form>

    <input type = "button" onsubmit = "validate()" value = "Submit" />

    </form>

    </body>

    </html>

    ```


    ## onmouseover and onmouseout


    These two event types will help you create nice effects with images or even text
    as well. The `onmouseover` event triggers when you bring your mouse over any element
    and the `onmouseout` triggers when you move your mouse out from that. Try the
    following example.


    ```html

    <html>

    <head>

    <script type = "text/javascript">

    <!--

    function over()  {

    document.write ("Mouse Over");

    }

    function out()  {

    document.write ("Mouse Out");

    }

    //-->

    </script>

    </head>

    <body>

    <p>Bring your mouse inside the division to see the result:</p>

    <div onmouseover = "over()" onmouseout = "out()">

    <h2> This is inside the division</h2>

    </div>

    </body>

    </html>

    ```


    ### Output


    ## HTML 5 Standard Events


    The standard HTML 5 events are listed here for your reference. Here script indicates
    a Javascript function to be executed against that event.


    | Attribute | Value | Description |

    | :--- | :--- | :--- |

    | Offline | script | Triggers when the document goes offline |

    | Onabort | script | Triggers on an abort event |

    | onafterprint | script | Triggers after the document is printed |

    | onbeforeonload | script | Triggers before the document loads |

    | onbeforeprint | script | Triggers before the document is printed |

    | onblur | script | Triggers when the window loses focus |

    | oncanplay | script | Triggers when media can start play, but might has to stop
    for buffering |

    | oncanplaythrough | script | Triggers when media can be played to the end, without
    stopping for buffering |

    | onchange | script | Triggers when an element changes |

    | onclick | script | Triggers on a mouse click |

    | oncontextmenu | script | Triggers when a context menu is triggered |

    | ondblclick | script | Triggers on a mouse double-click |

    | ondrag | script | Triggers when an element is dragged |

    | ondragend | script | Triggers at the end of a drag operation |

    | ondragenter | script | Triggers when an element has been dragged to a valid
    drop target |

    | ondragleave | script | Triggers when an element is being dragged over a valid
    drop target |

    | ondragover | script | Triggers at the start of a drag operation |

    | ondragstart | script | Triggers at the start of a drag operation |

    | ondrop | script | Triggers when dragged element is being dropped |

