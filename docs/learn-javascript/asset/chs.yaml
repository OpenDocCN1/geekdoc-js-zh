  \ 对象的 `print` 函数来实现此功能。\n\n## 自定义对象 (User-Defined Objects)\n\n所有自定义对象和内置对象都是名为 `Object`\
  \ 的对象的后代。\n\n### new 运算符\n\n`new` 运算符用于创建对象的实例。要创建一个对象，`new` 运算符后面跟着构造方法。\n\n在下面的示例中，构造方法是\
  \ Object()、Array() 和 Date()。这些构造方法是内置的 JavaScript 函数。\n\n```javascript\nvar employee\
  \ = new Object();\n\nvar books = new Array(\"C++\", \"Perl\", \"Java\");\n\nvar\
  \ day = new Date(\"August 15, 1947\");\n```\n\n### Object() 构造函数\n\n\n\n\n\n构造函数（constructor）是一个创建并初始化对象的函数。JavaScript\
  \ 提了一个名为 `Object()` 的特殊构造函数来构建对象。`Object()` 构造函数的返回值会被赋值给变量。\n\n该变量包含指向新对象的引用。赋值给对象的属性不是变量，且不是使用\
  \ `var` 关键字定义的。\n\n### 示例 1\n\n尝试以下示例；它演示了如何创建一个 Object（对象）。\n\n```html\n<html>\n\
  <head>\n<title>User-defined objects</title>\n<script type = \"text/javascript\"\
  >\nvar book = new Object();  // 创建对象\nbook.subject = \"Perl\";  // 给对象分配属性\nbook.author\
  \ = \"Mohtashim\";\n</script>\n</head>\n<body>\n<script type = \"text/javascript\"\
  >\ndocument.write(\"Book name is : \" + book.subject + \"<br>\");\ndocument.write(\"\
  Book author is : \" + book.author + \"<br>\");\n</script>\n</body>\n</html>\n```\n\
  \n### 输出\nBook name is : Perl\nBook author is : Mohtashim\n\n### 示例 2\n\n此示例演示了如何使用自定义函数（User-Defined\
  \ Function）创建一个对象。这里使用 `this` 关键字引用引用传递函数的对象。\n\n```html\n<html>\n<head>\n<title>User-defined\
  \ objects</title>\n<script type = \"text/javascript\">\nfunction book(title, author)\
  \ {\nthis.title = title;\nthis.author = author;\n}\n</script>\n</head>\n<body>\n\
  <script type = \"text/javascript\">\nvar myBook = new book(\"Perl\", \"Mohtashim\"\
  );\ndocument.write(\"Book title is : \" + myBook.title + \"<br>\");\ndocument.write(\"\
  Book author is : \" + myBook.author + \"<br>\");\n</script>\n</body>\n</html>\n\
  ```\n\n### 输出\nBook title is : Perl\nBook author is : Mohtashim\n\n## 为对象定义方法\n\n\
  之前的示例演示了构造函数如何创建对象并分配属性。但我们需要通过为对象分配方法来完成对象的定义。\n\n### 示例\n\n尝试以下示例；它展示了如何随对象一起添加函数。\n\
  \n```html\n<html>\n<head>\n<title>User-defined objects</title>\n<script type = \"\
  text/javascript\">\n// 定义一个充当方法的函数\nfunction addPrice(amount) {\nthis.price = amount;\n\
  }\nfunction book(title, author) {\nthis.title = title;\nthis.author = author;\n\
  this.addPrice = addPrice;  // 将该方法作为属性赋值。\n}\n</script>\n</head>\n<body>\n<script\
  \ type = \"text/javascript\">\nvar myBook = new book(\"Perl\", \"Mohtashim\");\n\
  myBook.addPrice(100);\ndocument.write(\"Book title is : \" + myBook.title + \"<br>\"\
  );\ndocument.write(\"Book author is : \" + myBook.author + \"<br>\");\ndocument.write(\"\
  Book price is : \" + myBook.price + \"<br>\");\n</script>\n</body>\n</html>\n```\n\
  \n### 输出\nBook title is : Perl\nBook author is : Mohtashim\nBook price is : 100\n\
  \n## 'with' 关键字\n\n`with` 关键字用作引用对象属性或方法的简写形式。\n\n作为 `with` 参数指定的对象在随后的块执行期间将成为默认对象。可以使用对象的属性和方法而无需指明对象名称。\n\
  \n### 语法\n\n`with object` 的语法如下——\n\n```javascript\nwith (object) {\n不使用对象名和点操作符的属性\n\
  }\n```\n\n### 示例\n\n尝试以下示例。\n\n```html\n<html>\n<head>\n<title>User-defined objects</title>\n\
  <script type = \"text/javascript\">\n// 定义一个充当方法的函数\nfunction addPrice(amount) {\n\
  with(this) {\nprice = amount;\n}\n}\nfunction book(title, author) {\nthis.title\
  \ = title;\nthis.author = author;\nthis.price = 0;\nthis.addPrice = addPrice;  //\
  \ 将该方法作为属性赋值。\n}\n</script>\n</head>\n<body>\n<script type = \"text/javascript\"\
  >\nvar myBook = new book(\"Perl\", \"Mohtashim\");\nmyBook.addPrice(100);\ndocument.write(\"\
  Book title is : \" + myBook.title + \"<br>\");\ndocument.write(\"Book author is\
  \ : \" + myBook.author + \"<br>\");\ndocument.write(\"Book price is : \" + myBook.price\
  \ + \"<br>\");\n</script>\n</body>\n</html>\n```\n\n### 输出\nBook name is : Perl\n\
  Book author is : Mohtashim\nBook price is : 100\n\n# JavaScript 原生对象\n\nJavaScript\
  \ 有几个内置或原生对象。这些对象可以在程序的任何地方访问，并在运行于任何操作系统的任何浏览器中以相同的方式工作。\n\n以下是所有原生对象的列表——\n* `Number\
  \ Object`（数字对象）\n* `Boolean Object`（布尔对象）\n* `String Object`（字符串对象）\n* `Array Object`（数组对象）\n\
  * `Date Object`（日期对象）\n* `Math Object`（数学对象）\n* `RegExp Object`（正则表达式对象）\n\n## Number\
  \ 对象\n\n`Number` 对象表示整数或浮点数。通常，你不需要担心 `Number` 实例，因为 JavaScript 会自动将字面量转换为相应的类型。\n\
  \n### 语法\n\n创建 `number` 对象的语法如下——\n\n```javascript\nvar val = Number(number)\n```\n\
  \n## Number 属性\n\n以下是每个属性的列表：\n\n| 序号 | 属性 | 描述 |\n| :--- | :--- | :--- |\n| 1 |\
  \ `MAX_VALUE` | 数字可能的最大值 (1.7976931348623157+308) |\n| 2 | `MIN_VALUE` | 数字可能的最小值\
  \ (5e-324) (等一下，确实是 5e-324) |\n| 3 | `NaN` | 非数字的值 |\n| 4 | `NEGATIVE_INFINITY`\
  \ | 小于 `MIN_VALUE` 的值 |\n| 5 | `POSITIVE_INFINITY` | 大于 `MAX_VALUE` 的值 |\n| 6 |\
  \ `prototype` | Number 对象的静态属性 |\n| 7 | `constructor` | 返回创建对象的函数引用 |\n\n## Number\
  \ 方法\n\n`Number` 对象包含了每个对象都拥的方法：\n\n| 序号 | 方法 | 描述 |\n| :--- | :--- | :--- |\n|\
  \ 1 | `toExponential()` | 将数字以指数计数法显示 |\n| 2 | `toFixed()` | 以特定的小数位数格式化数字 |\n|\
  \ 3 | `toLocaleString()` | 返回本地设置下的数字字符串值 |\n| 4 | `toPrecision()` | 定义显示的总数字个数\
  \ |\n| 5 | `toString()` | 返回数值的字符串表示 |\n| 6 | `valueOf()` | 返回数值 |\n\n## Boolean\
  \ 对象\n\n`Boolean` 对象表示两个值：\"true\" 或 \"false\"。\n\n### 语法\n\n使用以下语法创建 `Boolean`\
  \ 对象：\n\n```javascript\nvar val = new Boolean(value)\n```\n\n## Boolean 属性\n\n|\
  \ 序号 | 属性 | 描述 |\n| :--- | :--- | :--- |\n| 1 | `constructor` | 返回创建对象的函数引用 |\n\
  | 2 | `prototype` | 允许向对象添加属性和方法 |\n\n## Boolean 方法\n\n| 序号 | 方法 | 描述 |\n| :---\
  \ | :--- | :--- |\n| 1 | `toSource()` | 返回包含 Boolean 对象源码的字符串 |\n| 2 | `toString()`\
  \ | 返回 \"true\" 或 \"false\" 的字符串 |\n\n\n\n\n\n| 3 | `valueOf()` 返回 `Boolean` 对象的原始值。\
  \ |\n\n在接下来的章节中，我们将通过几个示例来演示 `Boolean` 方法的使用。\n\n## String 对象\n\n`String` 对象允许你处理一系列字符；它通过许多辅助方法封装了\
  \ JavaScript 的字符串原始数据类型。\n\n由于 JavaScript 会自动在字符串原始值和 `String` 对象之间进行转换，因此你可以在字符串原始值上调用\
  \ `String` 对象的任何辅助方法。\n\n### 语法\n\n使用以下语法来创建一个 `String` 对象 ——\n\n```\nvar val =\
  \ new String(string);\n```\n\n`String` 参数是一系列经过正确编码的字符。\n\n## String 属性\n\n以下是 `String`\
