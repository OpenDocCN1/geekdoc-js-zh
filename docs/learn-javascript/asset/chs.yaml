  \ |\n| 46 | `toUTCString()` 将日期转换为字符串，使用通用时间表示法。 |\n| 47 | `valueOf()` 返回 `Date`\
  \ 对象的原始值。 |\n\n使用通用时间表示法将日期转换为字符串。\n\n## Date 静态方法\n\n除了之前列出的许多实例方法外，`Date` 对象还定义了两个静态方法。这些方法通过\
  \ `Date()` 构造函数本身进行调用。\n\n| Sr.No. | 方法 & 描述 |\n| :--- | :--- |\n| 1 | `Date.parse()`\
  \ 解析日期和时间的字符串表示，并返回该日期的内部毫秒表示。 |\n| 2 | `Date.UTC()` 返回指定的 UTC 日期时间的毫秒表示。 |\n\n\
  在接下来的章节中，我们将通过几个示例来演示 `Date` 静态方法的用法。\n\n## Math 对象\n\n`math` 对象为你提供了用于数学常数和泛的属性和方法。与其他全局对象不同，`Math`\
  \ 不是一个构造函数。`Math` 的所有属性和方法都是静态的，可以通过 `Math` 作为对象直接调用，无需创建实例。\n\n因此，你将常量 `pi` 引用为\
  \ `Math.PI`，调用 `sine` 函数为 `Math.sin(x)`，其中 `x` 是该方法的参数。\n\n### 语法\n\n调用 `Math` 属性和方法的语法如下：\n\
  \n```javascript\nvar pi_val = Math.PI;\n\nvar sine_val = Math.sin(30);\n```\n\n\
  ## Math 属性\n\n这里是 `Math` 所有属性列表及其描述。\n\n| Sr.No. | 属性 & 描述 |\n| :--- | :--- |\n\
  | 1 | `E` 欧拉常数，即自然对数的底，约为 2.718。 |\n| 2 | `LN2` 2 的自然对数，约为 0.693。 |\n| 3 | `LN10`\
  \ 10 的自然对数，约为 2.302。 |\n| 4 | `LOG2E` E 的以 2 为底的对数，约为 1.442。 |\n| 5 | `LOG10E` E\
  \ 的以 10 为底的对数，约为 0.434。 |\n| 6 | `PI` 圆周长与直径的比，约为 3.14159。 |\n| 7 | `SQRT1_2` 1/2\
  \ 的平方根；等同于 2 的平方根的分之一，约为 0.707。 |\n| 8 | `SQRT2` 2 的平方根，约为 1.414。 |\n\n在接下来的章节中，我们将通过几个示例来演示\
  \ `Math` 属性的用法。\n\n## Math 方法\n\n这里是与 `Math` 对象关联的方法列表及其描述\n\n| Sr.No. | 方法 & 描述\
  \ |\n| :--- | :--- |\n| 1 | `abs()` 返回数字的绝对值。 |\n| 2 | `acos()` 返回数字的反余弦（弧度）。 |\n\
  | 3 | `asin()` 返回数字的反正弦（弧度）。 |\n| 4 | `atan()` 返回数字的反正切（弧度）。 |\n| 5 | `atan2()`\
  \ 返回其参数商的反正切。 |\n| 6 | `ceil()` 返回大于或等于该数字的最小整数。 |\n| 7 | `cos()` 返回数字的余弦。 |\n|\
  \ 8 | `exp()` 返回 `E^N`，其中 `N` 是参数，`E` 是欧拉常数，即自然对数的底。 |\n| 9 | `floor()` 返回小于或等于该数字的最大整数。\
  \ |\n| 10 | `log()` 返回数字的自然对数（以 E 为底）。 |\n| 11 | `max()` 返回零或多个数字中的最大值。 |\n| 12\
  \ | `min()` 返回零或多个数字中的最小值。 |\n| 13 | `pow()` 返回基数的指数幂，即基的指数幂次方。 |\n| 14 | `random()`\
  \ 返回一个 0 到 1 之间的伪随机数。 |\n| 15 | `round()` 返回四舍五入到最近整数的数字。 |\n| 16 | `sin()` 返回数字的正弦。\
  \ |\n| 17 | `sqrt()` 返回数字的平方根。 |\n| 18 | `tan()` 返回数字的正切。 |\n| 19 | `toSource()`\
  \ 返回字符串 \"Math\"。 |\n\n在接下来的章节中，我们将通过几个示例来演示与 `Math` 关联的方法。\n\n# 正则表达式和 RegExp 对象\n\
  \n正则表达式是一个描述字符模式的对象。\n\nJavaScript 的 `RegExp` 类表示正则表达式，`String` 和 `RegExp` 都定义了使用正则表达式对文本执行强大的模式匹配以及搜索替换功能的方法。\n\
  \n### 语法\n\n正则表达式可以使用 `RegExp()` 构造函数定义，如下−\n\n```javascript\nvar pattern = new\
  \ RegExp(pattern, attributes);\n```\n\n或者简单地使用\n\n```javascript\nvar pattern = /pattern/attributes;\n\
  ```\n\n这里是参数的描述−\n\n- `pattern`: 模式字符串。\n- `attributes`: 属性。\n\n## 括号\n\n括号 `[]`\
  \ 在正则表达式中有特殊含义。\n\n| Sr.No. | 表达式 |\n| :--- | :--- |\n| 1 | `[...]` 匹配括号内的任意字符。\
  \ |\n| 2 | `[^...]` 不匹配括号内的任意字符。 |\n| 3 | `[0-9]` 匹配任意数字。 |\n| 4 | `[a-z]` 匹配任意小写字母。\
  \ |\n| 5 | `[A-Z]` 匹配任意大写字母。 |\n| 6 | `[a-zA-Z]` 匹配任意字母。 |\n\n## 量词\n\n量词决定了字符出现的次数。\n\
  \n| Sr.No. | 表达式 | 描述 |\n| :--- | :--- |\n| 1 | `p+` 匹配一个或多个 `p`。 |\n| 2 | `p*`\
  \ 匹配零或多个 `p`。 |\n| 3 | `p?` 匹配最多一个 `p`。 |\n| 4 | `p{N}` 匹配正好 N 个 `p`。 |\n| 5 | `p{2,3}`\
  \ 匹配两个到三个 `p`。 |\n| 6 | `p{2,}` 匹配至少两个 `p`。 |\n\n### 示例\n\n以下示例详细解释了关于匹配的内容。\n\n\
  | Sr.No. | 表达式 | 描述 |\n| :--- | :--- |\n| 1 | `^[a-zA-Z]` 匹配以字母（不区分大小写）开头的字符串的开头。\
  \ |\n| 2 | `p.` 匹配 `p` 后跟的任意字符。 |\n| 3 | `^{2}$` 匹配正好两个字符。 |\n| 4 | `<b>(.*)</b>`\
  \ 匹配 `<b>` 之间的任意字符串。 |\n| 5 | `p(hp)*` 匹配 `p` 后跟的零或多个 `hp`。 |\n\n## 字面量\n\n| Sr.No.\
  \ | 字符 |\n| :--- | :--- |\n| 1 | `\\\\` 转义字符本身 |\n| 2 | `\\0` NUL 字符 (`\\u000`)\
  \ |\n| 3 | `\\t` 制表符 (`\\u009`) |\n| 4 | `\\n` 换行符 (`\\u00A`) |\n| 5 | `\\v` 垂直制表符\
  \ (`\\u00B`) |\n| 6 | `\\f` 换页符 (`\\u00C`) |\n| 7 | `\\r` 回车符 (`\\u00D`) |\n| 8\
  \ | `\\xnn` 由十六进制数 `nn` 指定的拉丁字符；例如 `\\x0A` 等同于 `\\n`。 |\n| 9 | `\\uxxxx` 由十六进制数\
  \ `xxxx` 指定的 Unicode 字符；例如 `\\u0009` 等同于 `\\t`。 |\n| 10 | `\\cX` 控制字符 `^X`；例如 `\\\
  cJ` 相当于换行符 `\\n`。 |\n\n## 元字符\n\n元字符是反斜杠引导的字母，用于赋予该组合特殊含义。\n\n例如，你可以使用 `\\d` 元字符搜索大额金额：`/([\\\
  d]+)000/`。在这里 `\\d` 将搜索任何数字字符串。\n\n下表列出了可以在 PERL 风格正则表达式中使用的元字符集合。\n\n| Sr.No. |\
  \ 字符 & 描述 |\n| :--- | :--- |\n| 1 | `.` 单个字符 |\n| 2 | `\\s` 空白字符（空格、制表符、换行符） |\n\
  \n\n\n\n\n| # | 描述 |\n| :--- | :--- |\n| 3 | `\\S` 非空白字符 |\n| 4 | `\\d` 数字 (0-9)\
  \ |\n| 5 | `\\D` 非数字 |\n| 6 | `\\w` 单词字符 (a-z, A-Z, 0-9, _) |\n| 7 | `\\W` 非单词字符\
  \ |\n| 8 | `[\\b]` 字面量退格符（特殊情况）。 |\n| 9 | `[aeiou]` 匹配给定集合中的单个字符 |\n| 10 | `[^aeiou]`\
  \ 匹配给定集合之外的单个字符 |\n| 11 | `(foo\\|bar\\|baz)` 匹配指定的任何备选方案 |\n\n## 修饰符\n\n提供了几种修饰符，可以简化你处理\
  \ `regexps` 的方式，例如大小写敏感、多行搜索等。\n\n| Sr.No. | 修饰符 & 描述 |\n| :--- | :--- |\n| 1 |\
  \ `i` 执行大小不敏感匹配。 |\n| 2 | `m` 指定如果字符串包含换行符或回车符，`^` 和 `$` 运算符现在将匹配换行边界，而不是字符串边界 |\n\
  | 3 | `g` 执行全局匹配，即找到所有匹配项而不是在找到第一个匹配后停止。 |\n\n## RegExp 属性\n\n以下是与 `RegExp` 相关的属性及其描述。\n\
  \n| Sr.No. | 属性 & 描述 |\n| :--- | :--- |\n| 1 | `constructor` 指定创建对象原型的函数。 |\n| 2\
  \ | `global` 指定是否设置了 `g` 修饰符。 |\n| 3 | `ignoreCase` 指定是否设置了 `i` 修饰符。 |\n| 4 | `lastIndex`\
  \ 开始下次匹配的索引。 |\n| 5 | `multiline` 指定是否设置了 `m` 修饰符。 |\n| 6 | `source` 模式的文本。 |\n\n\
  在接下来的章节中，我们将通过几个示例来演示 `RegExp` 属性的用法。\n\n## RegExp 方法\n\n以下是与 `RegExp` 关联的方法及其描述。\n\
  \n| Sr.No. | 方法 & 描述 |\n| :--- | :--- |\n| 1 | `exec()` 在其字符串参数中执行匹配搜索。 |\n| 2 |\
  \ `test()` 测试其字符串参数中是否存在匹配。 |\n| 3 | `toSource()` 返回一个表示指定对象的对象字面量；你可以使用此值来创建一个新对象。\
  \ |\n| 4 | `toString()` 返回一个表示指定对象的字符串。 |\n\n在接下来的章节中，我们将通过几个示例来演示 `RegExp` 方法的用法。\n\
  \n# 文档对象模型或 DOM\n\n每个网页都存在于浏览器窗口中，窗口可以被视为一个对象。\n\n`Document` 对象表示在该窗口中显示的 HTML 文档。`Document`\
  \ 对象具有各种属性，引用其他对象，从而允许访问和修改文档内容。\n\n访问和修改文档内容被称为`文档对象模型`，或 `DOM`。对象按层级结构组织。这种层级结构适用于\
  \ Web 文档中对象的组织。\n\n*   **Window 对象** – 层级结构的顶端。它是对象层级结构的最外元素。\n*   **Document 对象**\
  \ – 每个加载到窗口的 HTML 文档都会变成一个文档对象。文档包含了页面的内容。\n*   **Form 对象** – 封装在 `<form>...</form>`\
  \ 标签中的一切内容定义了 Form 对象。\n*   **Form 控制元素** – Form 对象包含该对象定义的所有元素，如文本字段、按钮、单选按钮和复选框。\n\
  \n以下是一些重要对象的简单层级结构：\n\n![Image](img/image0022.jpeg)\n\n存在多个 DOM。接下来的章节将详细解释这些每一个\
  \ DOM，并描述你可以如何使用它们来访问和修改文档内容。\n\n*   **遗留 DOM (The Legacy DOM)** – 这是 JavaScript\
  \ 语言早期引入的模型。它被所有浏览器支持，但仅允许访问文档的某些部分，例如表单、表单元素图像。\n*   **W3C DOM** – 该文档对象模型允许访问和修改所有文档内容，并由万维网联盟（W3C）标准化。该模型几乎被所有现代浏览器支持。\n\
  *   **IE4 DOM** – 该文档对象模型是在微软 Internet Explorer 浏览器的第 4 版本中引入的。IE5 及更高版本包含了对大多数基本\
  \ W3C DOM 特性的支持。\n\n## DOM 性\n\n如果你想编写一个灵活的脚本，根据可用性使用 W3C DOM 或 IE 4 DOM，那么你可以使用能力测试方法，首先检查方法或属性是否存在，以判断浏览器是否具有你所需的能力。例如——\n\
  \n```\nif (document.getElementById) {\n    // 如果 W3C 方法存在，则使用它\n} else if (document.all)\
  \ {\n    // 如果 all[] 数组存在，则使用它\n} else {\n    // 否则使用遗留 DOM\n}\n```\n\n# 错误与异常处理\n\
  \n编程中有三种错误：(a) 语法错误，(b) 运行时错误以及 c) 逻辑错误。\n\n## 语法错误\n\n语法错误也称为`解析错误`，在传统编程语言中发生在编译时，在\
  \ JavaScript 中发生在解释时。\n\n例如，以下这一行会导致语法错误，因为缺少了右括号。\n\n```html\n<script type=\"javascript\"\
  >\nwindow.print(;\n//\n</script>\n```\n\n当 JavaScript 中发生语法错误时，只有该线程的代码受影响。\n\n\
  ## 运行时错误\n\n运行时错误也称为`异常`，发生在执行期间（编译之后）。\n\n例如，以下这一行的语法是正确的，但在运行时它尝试调用一个不存在的方法。\n\
  \n```html\n<script type=\"javascript\">\nwindow.print();\n</script>\n```\n\n异常也会影响它们发生的线程，允许其他线程继续。\n\
  \n## 逻辑错误\n\n逻辑错误是最难追踪的错误类型。它们不是语法或运行时错误。相反，当你在逻辑上出错且没有得到预期的结果时就会发生。你无法捕获这些错误，因为这取决于你想放在程序中的逻辑类型。\n\
  \n## try...catch...finally 语句\n\nJavaScript 的最新版本增加了异常能力。JavaScript 实现了 `try...catch...finally`\
  \ 结构以及处理异常的 `throw` 操作符。你可以捕获程序员生成的和运行时异常，但无法捕获 JavaScript 错误。\n\n这是 `try...catch...finally`\
  \ 块的语法：\n\n```\ntry {\n    // 执行的代码\n} catch (e) {\n    // 当发生异常时执行的代码\n} finally\
  \ {\n    // 无论是否发生异常都会执行的代码\n}\n```\n\n`try` 块必须后跟一个 `catch` 块或一个 `finally` 块（或两者都有）。当\
  \ `try` 块中发生异常时，异常会被放入 `e` 中并执行 `catch` 块。可选的 `finally` 块在 try/catch 之后执行。\n\n###\
  \ 示例\n\n这里的示例正在尝试调用一个不存在的函数，这引发了异常。让我们看看在不使用 `try...catch` 的情况下它是如何的：\n\n```html\n\
  <html>\n<head>\n<script type=\"text/javascript\">\nfunction myFunc() {\n    var\
  \ a = 100;\n    alert(\"变量 a 的值为：\" + a );\n}\n</script>\n</head>\n<body>\n<p>点击下方查看结果：</p>\n\
  <form>\n<input type=\"button\" value=\"点击我\" onclick=\"myFunc();\" />\n</form>\n\
  </body>\n</html>\n```\n\n### 输出\n\n现在让我们尝试使用 `try...catch` 捕获此异常并显示用户友好的消息。如果你想向用户隐藏此错误，也可以抑制此消息。\n\
  \n```html\n<html>\n<head>\n<script type=\"text/javascript\">\nfunction myFunc()\
  \ {\n    var a = 100;\n    try {\n        printme();\n    } catch (e) {\n      \
  \  alert(\"发生错误：\" + e);\n    }\n}\n</script>\n</head>\n...\n\n\n\n\n\n```javascript\n\
  alert(\"Value of variable a is : \"  + a );\n}\n\ncatch ( e ) {\n  alert(\"Error:\
  \ \"  + e.description );\n}\n\n}\n\n//-->\n</script>\n</head>\n<body>\n<p>点击以下按钮查看结果：</p>\n\
  <form>\n  <input type = \"button\" value = \"Click Me\" onclick = \"myFunc();\"\
  \ />\n</form>\n</body>\n</html>\n```\n\n### 输出\n\n你可以使用 `finally` 块，它会在 `try/catch`\
  \ 之后始终无条件地执行。这里是一个示例。\n\n```html\n<html>\n<head>\n<script type = \"text/javascript\"\
  >\n<!--\nfunction myFunc() {\nvar a = 100;\n  try {\n    alert(\"Value of variable\
  \ a is : \"  + a );\n  }\n  catch ( e ) {\n    alert(\"Error: \"  + e.description\
  \ );\n  }\n  finally {\n    alert(\"Finally block will always execute!\"  );\n \
  \ }\n}\n//-->\n</script>\n</head>\n<body>\n<p>点击以下按钮查看结果：</p>\n<form>\n  <input\
  \ type = \"button\" value = \"Click Me\" onclick = \"myFunc();\" />\n</form>\n</body>\n\
  </html>\n```\n\n### 输出\n\n## throw 语句\n\n你可以使用 `throw` 语句来抛出内置异常或自定义异常。稍后这些异常可以被捕获，你可以采取相应的措施。\n\
  \n### 示例\n\n下面的示例演示了如何使用 `throw` 语句。\n\n```html\n<html>\n<head>\n<script type =\
  \ \"text/javascript\">\n<!--\nfunction myFunc() {\nvar a = 100;\nvar b = 0;\n  try\
  \ {\n    if ( b == 0 ) {\n      throw(  \"Divide by zero error.\"  );\n    }  else\
  \ {\n      var c = a / b;\n    }\n  }\n  catch ( e ) {\n    alert(\"Error: \"  +\
  \ e );\n  }\n}\n//-->\n</script>\n</head>\n<body>\n<p>点击以下按钮查看结果：</p>\n<form>\n\
  \  <input type = \"button\" value = \"Click Me\" onclick = \"myFunc();\" />\n</form>\n\
  </body>\n</html>\n```\n\n### 输出\n\n你可以使用字符串、整数、布尔值或对象在一个函数中抛出异常，然后你可以像上面那样在同一个函数中捕获该异常，或者在另一个函数中使用\
  \ `try...catch` 块来捕获它。\n\n## onerror() 方法\n\n`onerror` 事件处理器是 JavaScript 中促进错误处理的第一功能。当页面上发生异常时，`error`\
  \ 事件就会在 `window` 对象上触发。\n\n```html\n<html>\n<head>\n<script type = \"text/javascript\"\
  >\n<!--\nwindow.onerror = function () {\n  alert(\"发生了一个错误.\");\n}\n//-->\n</script>\n\
  </head>\n<body>\n<p>点击以下按钮查看结果：</p>\n<form>\n  <input type = \"button\" value =\
  \ \"Click Me\" onclick = \"myFunc();\" />\n</form>\n</body>\n</html>\n```\n\n###\
  \ 输出\n\n`onerror` 事件处理器提供三个信息来识别错误的确切性质——\n\n- `Error message` − 浏览器为给定错误显示的相同消息\n\
  - `URL` − 发生错误的文件\n- `Line number` − 给定 URL 中导致错误的行号\n\n这里是显示如何提取这些信息的示例。\n\n###\
  \ 示例\n\n```html\n<html>\n<head>\n<script type = \"text/javascript\">\n<!--\nwindow.onerror\
  \ = function (msg, url, line) {\n  alert(\"Message : \"  + msg );\n  alert(\"url\
  \ : \"  + url );\n  alert(\"Line number : \"  + line );\n}\n//-->\n</script>\n</head>\n\
  <body>\n<p>点击以下按钮查看结果：</p>\n<form>\n  <input type = \"button\" value = \"Click Me\"\
  \ onclick = \"myFunc();\" />\n</form>\n</body>\n</html>\n```\n\n### 输出\n\n你可以用你认为更好的任何方式显示提取的信息。\n\
  \n你可以使用如下所示的 `onerror` 方法在加载图像时出现任何问题时显示错误消息。\n\n```html\n<img src=\"myimage.gif\"\
  \ onerror=\"alert('加载图像时发生错误.')\" />\n```\n\n你可以在许多 HTML 标签上使用 `onerror`，在发生错误时显示适当的消息。\n\
  \n# 表单验证\n\n表单验证通常发生在服务器端，在客户端输入了所有必要数据并点击“提交”按钮之后。如果客户端输入的数据错误或简单缺失，服务器将把所有数据发回客户端，并要求使用正确的信息重新提交表单。这是一个非常冗长的过程，过去给服务器带来了很大负担。\n\
  \nJavaScript 提供了一种在将数据发送到服务器之前在客户端验证数据的方法。表单验证通常执行以下功能：\n\n- `基础验证` ― 首先，必须检查表单以确保必填字段已填写。\n\
  - `数据验证` ― 其次，必须检查输入数据的正确性。\n\n### 示例\n\n让我们看看如何进行基础验证。\n\n```html\n<html>\n<head>\n\
  <title>表单验证</title>\n<script type = \"text/javascript\">\n<!--\n// 验证函数将在这里\nfunction\
  \ validate() {\n  if( myform.Name.value == \"\" ) {\n    alert(\"请提供姓名!\");\n  \
  \  document.myForm.Name.focus() ;\n    return false;\n  }\n  if( myform.EMail.value\
  \ == \"\" ) {\n    alert(\"请提供电子邮件!\");\n    document.myForm.EMail.focus() ;\n \
  \   return false;\n  }\n  if( myform.Zip.value == \"\" || isNaN( document.myForm.Zip.value\
  \ ) || document.myForm.Zip.value.length != 5 ) {\n    alert(\"请提供格式正确的邮编.\");\n\
  \    document.myForm.Zip.focus() ;\n    return false;\n  }\n  if( myform.Country.value\
  \ == \"-1\" ) {\n    alert(\"请提供国家!\");\n    return false;\n  }\n  return( true\
  \ );\n}\n//-->\n</script>\n</head>\n<body>\n<form name=\"myForm\" action=\"/cgi-test.cgi\"\
  \ onsubmit=\"return(validate());\" method=\"post\" cellpadding=\"2\" cellspacing=\"\
  0\">\n  <table>\n    <tr>\n      <td>姓名</td>\n      <td><input type=\"text\" name=\"\
  Name\"></td>\n    </tr>\n    <tr>\n      <td>电子邮件</td>\n      <td><input type=\"\
  text\" name=\"EMail\"></td>\n    </tr>\n    <tr>\n      <td>邮编</td>\n      <td><input\
  \ type=\"text\" name=\"Zip\"></td>\n    </tr>\n    <tr>\n      <td>国家</td>\n   \
  \   <td>\n        <select name=\"Country\">\n          <option value=\"-1\">[选择]</option>\n\
  \          <option value=\"1\">美国</option>\n          <option value=\"2\">英国</option>\n\
  \          <option value=\"3\">印度</option>\n        </select>\n      </td>\n   \
  \ </tr>\n  </table>\n  <input type=\"submit\" value=\"提交\" />\n</form>\n</body>\n\
  </html>\n```\n\n### 输出\n\n现在我们将看到如何在提交数据到 Web 服务器之前验证输入的表单数据。下面的示例演示了如何验证输入的电子邮件地址。电子邮件地址必须包含一个\
  \ `@` 符号和一个点（.）。此外，`@` 不能是电子邮件地址的第一个字符，且最后一个点在 `@` 之后至少有一个字符。\n\n### 示例\n\n尝试以下代码进行电子邮件验证。\n\
  \n```javascript\n<script type = \"text/javascript\">\n<!--\nfunction validateEmail()\
  \ {\n  var emailID = document.myForm.EMail.value;\n  atpos = emailID.indexOf(\"\
  @\");\n  dotpos = emailID.lastIndexOf(\".\");\n  if (atpos < 1 || ( dotpos - atpos\
  \ < 2 )) {\n    alert(\"请输入正确的电子邮件 ID\");\n    document.myForm.EMail.focus() ;\n\
  \    return false;\n  }\n  return( true );\n}\n//-->\n</script>\n```\n\n## 动画\n\n\
  你可以使用 JavaScript 创建复杂的动画，包含但不限于以下元素——\n\n- 烟花\n- 淡入淡出\n- 滚入或滚出\n- 页面进入或页面退出\n- 对象移动\n\
  \n你可能对现有的 JavaScript 动画库感兴趣：**Script.Aculo.us**。\n\n\n\n\n\n本教程将提供关于如何使用 `JavaScript`\
  \ 创建动画的基础知识。\n\n`JavaScript` 可用于根据逻辑方程或函数确定的某种模式，让许多 DOM 元素（`<img>`、`<div>` 或任何其他\
  \ HTML 元素）在页面上移动。\n\n`JavaScript` 提供了以下两个在动画程序中频繁使用的函数：\n\n- `setTimeout(function,\
  \ duration)` − 此函数在当前 `duration` 毫秒后调用 `function`。\n- `setInterval(function, duration)`\
  \ − 此函数每每隔 `duration` 毫秒调用一次 `function`。\n- `clearTimeout(setTimeout_variable)`\
  \ − 此函数清除由 `setTimeout()` 函数设置的任何计时器。\n\n`JavaScript` 还可以设置 DOM 对象的属性，包括其在屏幕上的位置。你可以设置对象的\
  \ `top` 和 `left` 属性来将其放置在屏幕的任何位置。以下是其语法结构。\n\n```javascript// 设置距离屏幕左边缘的距离。\nobject.style.left\
  \ = distance in pixels or points;\n```\n\n```javascript\n// 设置距离屏幕顶边缘的距离。\nobject.style.top\
  \ = distance in pixels or points;\n```\n\n## 手动动画\n\n现在，让我们使用 DOM 对象属性和 `JavaScript`\
  \ 函数来实现这样一个简单的动画。以下列表包含了不同的 DOM 方法。\n\n- 我们正在使用 `JavaScript` 函数 `getElementById()`\
  \ 来获取一个 DOM 对象，然后将其赋值给全局变量 `imgObj`。\n- 我们定义了一个初始化函数 `init()` 来初始化 `imgObj`，其中我们设置了它的\
  \ `position` 和 `left` 属性。\n- 我们在窗口加载时调用初始化函数。\n- 最后，我们调用 `moveRight()` 函数将左侧距离增加\
  \ 10 像素。你也可以将其设置为负值以将其移动到左侧。\n\n### 示例\n\n尝试以下示例。\n\n```html\n<html>\n<head>\n<title>JavaScript\
  \ Animation</title>\n<script type=\"text/javascript\">\n<!--\nvar imgObj = null;\n\
  function init() {\nimgObj = document.getElementById('myImage');\nimgObj.style.position=\
  \ 'relative';\nimgObj.style.left = '0px';\n}\nfunction moveRight() {\nimgObj.style.left\
  \ = parseInt(imgObj.style.left) + 10 + 'px';\n}\nwindow.onload = init;\n//-->\n\
  </script>\n</head>\n<body>\n<form>\n<img id=\"myImage\" src=\"/images/html.gif\"\
  \ />\n<p>Click button below to move the image to right</p>\n<input type=\"button\"\
  \ value=\"Click Me\" onclick=\"moveRight();\" />\n</form>\n</body>\n</</html>\n\
  ```\n\n### 输出\n\n## 自动动画\n\n在上面的示例中，我们看到了图像每次点击时如何向右移动。我们可以通过使用 `JavaScript` 函数\
  \ `setTimeout()` 来自动化此过程，如下 ——\n\n在这里我们添加了更多方法。让我们看看这里有什么新内容 ——\n\n- `moveRight()`\
  \ 函数调用 `setTimeout()` 函数来设置 `imgObj` 的位置。\n- 我们添加了一个新函数 `stop()` 来清除由 `setTimeout()`\
  \ 函数设置的计时器，并将对象设置到初始位置。\n\n### 示例\n\n尝试以下示例代码。\n\n```html\n<html>\n<head>\n<title>JavaScript\
  \ Animation</title>\n<script type=\"text/javascript\">\n<!--\nvar imgObj = null;\n\
  var animate ;\nfunction init() {\nimgObj = document.getElementById('myImage');\n\
  imgObj.style.position= 'relative';\nimgObj.style.left = '0px';\n}\nfunction moveRight()\
  \ {\nimgObj.style.left = parseInt(imgObj.style.left) + 10 + 'px';\nanimate = setTimeout(moveRight,20);\
  \ // 在 20 毫秒后调用 moveRight\n}\nfunction stop() {\nclearTimeout(animate);\nimgObj.style.left\
  \ = '0px';\n}\nwindow.onload = init;\n//-->\n</script>\n</head>\n<body>\n<form>\n\
  <img id=\"myImage\" src=\"/images/html.gif\" />\n<p>Click the buttons below to handle\
  \ animation</p>\n<input type=\"button\" value=\"Start\" onclick=\"moveRight();\"\
  \ />\n<input type=\"button\" value=\"Stop\" onclick=\"stop();\" />\n</form>\n</body>\n\
  </</html>\n```\n\n## 鼠标事件滚停\n\n这是一个显示使用鼠标事件实现图像滚停的简单示例。\n\n让我们看看下面的示例中使用了什么 ——\n\
  \n- 在加载此页面时，`if` 语句检查图像对象是否存在。如果图像对象不可用，则此块不会执行。\n- `Image()` 构造函数创建并预加载了一个名为 `image`\
  \ 的新图像对象。\n- 同样，我们创建了 `image2`。\n- `onOver` 事件由鼠标触发。\n- `onOut` 事件由鼠标触发。\n\n```html\n\
  <html>\n<head>\n<title>Rollover with a Mouse Event</title>\n<script type=\"text/javascript\"\
  >\n<!--\n... (等待，提供的文本在此处中断，但我将根据提供的片段进行格式化)\n```\n\n\n\n\n\n```javascript\nfunction\
