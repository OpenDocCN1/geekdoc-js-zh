  \ = (a /= b);\ndocument.write(result);\ndocument.write(linebreak);\ndocument.write(\"\
  Value of a => (a %= b) => \");\nresult = (a %= b);\ndocument.write(result);\ndocument.write(linebreak);\n\
  //-->\n</script>\n<p>将变量设置为不同的值和不同的运算符，然后尝试...</p>\n</body>\n</html>\n```\n\n###\
  \ 输出\n\nValue of a => (a = b) => 10\nValue of a => (a += b) => 20\nValue of a =>\
  \ (a -= b) => 10\nValue of a => (a *= b) => 100\nValue of a => (a /= b) => 10\n\
  Value of a => (a %= b) => 0\n将变量设置为不同的值和不同的运算符，然后尝试...\n\n## 杂运算符\n\n我们在这里讨论两个在\
  \ JavaScript 中非常有用的运算符：**条件运算符** `? :` 和 **typeof 运算符**。\n\n### 条件运算符 (`?:`)\n\n\
  条件运算符首先求一个表达式以得到真或假值，然后根据求值结果执行给定的两个语句之一。\n\n| 序号 | 运算符和描述 |\n| :--- | :--- |\n\
  | 1 | `? :` (条件) 如果条件为真？取值 X : 否则取值 Y |\n\n### 示例\n\n尝试运行以下代码以理解条件运算符在 JavaScript\
  \ 中是如何工作的。\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\n<!--\n\
  var a = 10;\nvar b = 20;\nvar linebreak = \"<br />\";\ndocument.write (\"((a > b)\
  \ ? 100 : 200) => \");\nresult = (a > b) ? 100 : 200;\ndocument.write(result);\n\
  document.write(linebreak);\ndocument.write (\"((a < b) ? 100 : 200) => \");\nresult\
  \ = (a < b) ? 100 : 200;\ndocument.write(result);\ndocument.write(linebreak);\n\
  //-->\n</script>\n<p>将变量设置为不同的值和不同的运算符，然后尝试...</p>\n</body>\n</html>\n```\n\n###\
  \ 输出\n\n((a > b) ? 100 : 200) => 200\n((a < b) ? 100 : 200) => 100\n将变量设置为不同的值和不同的运算符，然后尝试...\n\
  \n### typeof 运算符\n\n**typeof** 运算符是一个一元运算符，放置在其单个操作数之前，该操作数可以是任何类型。它的值是一个表示操作数数据类型的字符串。\n\
  \n如果操作数是数字、字符串或布尔值，`typeof` 运算符求值为 \"number\"、string\" 或 \"boolean\"，并根据求值结果返回真或假。\n\
  \n以下是 **typeof** 运算符的返回值列表。\n\n| 类型 | typeof 返回的字符串 |\n| :--- | :--- |\n| Number\
  \ | \"number\" |\n| String | \"string\" |\n| Boolean | \"boolean\" |\n| Object |\
  \ \"object\" |\n| Function | \"function\" |\n| Undefined | \"undefined\" |\n| Null\
  \ | \"object\" |\n\n### 示例\n\n**typeof** 运算符用于确定数据类型。\n\n```html\n<html>\n<body>\n\
  <script type=\"text/javascript\">\n<!--\nvar a = 33;\nvar b = 10;\nvar linebreak\
  \ = \"<br />\";\ndocument.write(\"Value of a => (a = b) => \");\nresult = (a = b);\n\
  document.write(result);\ndocument.write(linebreak);\ndocument.write(\"Value of a\
  \ => (a += b) => \");\nresult = (a += b);\ndocument.write(result);\ndocument.write(linebreak);\n\
  document.write(\"Value of a => (a -= b) => \");\nresult = (a -= b);\ndocument.write(result);\n\
  document.write(linebreak);\ndocument.write(\"Value of a => (a *= b) => \");\nresult\
  \ = (a *= b);\ndocument.write(result);\ndocument.write(linebreak);\ndocument.write(\"\
  Value of a => (a /= b) => \");\nresult = (a /= b);\ndocument.write(result);\ndocument.write(linebreak);\n\
  document.write(\"Value of a => (a %= b) => \");\nresult = (a %= b);\ndocument.write(result);\n\
  document.write(linebreak);\n//-->\n</script>\n<p>将变量设置为不同的值和不同的运算符，然后尝试...</p>\n\
  </body>\n</html>\n```\n*(注：由于原文中包含大量重复且混乱的格式描述，译文已根据要求提取了核心逻辑。)*\n\n\n\n\n```如果\
  \ `expression 2` 为真，则执行语句(s)\n\n} else if (`expression 3`) {\n\n如果 `expression 3`\
  \ 为真，则执行语句(s)\n\n} else {\n\n如果没有一个表达式为真，则执行语句(s)\n\n}\n\n这段代码并没有特别之处。它是一系列 `if`\
  \ 语句，每个 `if` 都是上一个语句 `else` 子句的一部分。语句根据真值条件执行，如果没有一个条件为真，则执行 `else` 块。\n\n### 示例\n\
  \n尝试以下代码来学习如何在 JavaScript 中实现 `if-else-if` 语句。\n\n```html\n<html>\n\n<body>\n\n\
  <script  type  =  \"text/javascript\">\n<!--\n\nvar book =  \"maths\";\n\nif( book\
  \ ==  \"history\"  ){\ndocument.write(\"<b>History Book</b>\");\n}  else  if( book\
  \ ==  \"maths\"  ){\ndocument.write(\"<b>Maths Book</b>\");\n}  else  if( book ==\
  \  \"economics\"  ){\ndocument.write(\"<b>Economics Book</b>\");\n}  else  {\ndocument.write(\"\
  <b>Unknown Book</b>\");\n}\n\n//-->\n</script>\n\n<p>将变量设置为不同的值，然后尝试...</p>\n\n\
  </body>\n</html>\n```\n\n### 输出\n\nMaths Book\n\n将变量设置为不同的值，然后尝试...\n\n# Switch\
  \ Case\n\n你可以像上一节中那样，使用多个 `if...else…if` 语句来执行多路分支。然而，这并不总是最佳解决方案，特别是当所有分支都依赖于单个变量的值时。\n\
  \n从 JavaScript 1.2 开始，你可以使用 `switch` 语句，它恰好处理这种情况，而且比重复的 `if...else if` 语句执行得更高。\n\
  \n### 流程图\n\n下面的流程图解释了 switch-case 语句的工作原理。\n\n![Image](img/image00219.jpeg)\n\n\
  ### 语法\n\n`switch` 语句的目标是给出一个表达式进行求值，并根据表达式的值执行几个不同的语句。解释器会将表达式的值与每个 `case` 进行比较，直到找到匹配项为止。如果没有匹配项，则将使用\
  \ `default` 条件。\n\n```javascript\nswitch (expression) {\ncase condition 1: statement(s)\n\
  break;\ncase condition 2: statement(s)\nbreak;\n...\ncase condition n: statement(s)\n\
  break;\ndefault: statement(s)\n}\n```\n\n`break` 语句表示特定 case 的结束。如果省略了它们，解释器将继续执行后续每个\
  \ case 中的每个语句。\n\n我们将在 `循环控制` 章节解释 `break` 语句。\n\n### 示例\n\n尝试以下示例来实现实现 switch-case\
  \ 语句。\n\n```html\n<html>\n\n<body>\n\n<script  type  =  \"text/javascript\">\n<!--\n\
  \nvar grade =  'A';\n\ndocument.write(\"Entering switch block<br />\");\n\nswitch\
  \  (grade)  {\ncase  'A': document.write(\"Good job<br />\");\nbreak;\ncase  'B':\
  \ document.write(\"Pretty good<br />\");\nbreak;\ncase  'C': document.write(\"Passed<br\
  \ />\");\nbreak;\ncase  'D': document.write(\"Not so good<br />\");\nbreak;\ncase\
  \  'F': document.write(\"Failed<br />\");\nbreak;\ndefault: document.write(\"Unknown\
  \ grade<br />\")\n}\n\ndocument.write(\"Exiting switch block\");\n\n//-->\n</script>\n\
  \n<p>将变量设置为不同的值，然后尝试...</p>\n\n</body>\n</html>\n```\n\n### 输出\n\nEntering switch\
  \ block\n\nGood job\n\nExiting switch block\n\n将变量设置为不同的值，然后尝试...\n\nBreak 语句在 switch-case\
  \ 语句中起着重要作用。尝试以下没有使用任何 break 语句的 switch-case 语句。\n\n```html\n<html>\n\n<body>\n\n\
  <script  type  =  \"text/javascript\">\n<!--\n\nvar grade =  'A';\n\ndocument.write(\"\
  Entering switch block<br />\");\n\nswitch  (grade)  {\ncase  'A': document.write(\"\
  Good job<br />\");\ncase  'B': document.write(\"Pretty good<br />\");\ncase  'C':\
  \ document.write(\"Passed<br />\");\ncase  'D': document.write(\"Not so good<br\
  \ />\");\ncase  'F': document.write(\"Failed<br />\");\ndefault: document.write(\"\
  Unknown grade<br />\")\n}\n\ndocument.write(\"Exiting switch block\");\n\n//-->\n\
  </script>\n\n<p>将变量设置为不同的值，然后尝试...</p>\n\n</body>\n</html>\n```\n\n### 输出\n\nEntering\
  \ switch block\n\nGood job\n\nPretty good\n\nPassed\n\nNot so good\n\nFailed\n\n\
  Unknown grade\n\nExiting switch block\n\n将变量设置为不同的值，然后尝试...\n\n# While 循环\n\n在编写程序时，你可能会遇到需要反复执行某项操作。在这种情况下，你需要编写循环语句来减少行数。\n\
  \nJavaScript 支持所有必要的循环来减轻编程压力。\n\n## while 循环\n\nJavaScript 中最基本的循环是 `while` 循环，将在本章中讨论。`while`\
  \ 循环的目的是只要 `expression` 为真，就重复执行语句。一旦表达式变为 `false`，循环就会终止。\n\n### 流程图\n\n`while`\
  \ 循环的流程图如下。\n\n### 语法\n\nJavaScript 中 `while` 循环的语法如下：\n\n```javascript\nwhile (expression)\
  \ {\n如果表达式为真，则执行语句(s)\n}\n```\n\n### 示例\n\n尝试以下示例来实现 while 循环。\n\n```html\n<html>\n\
  \n<body>\n\n<script  type  =  \"text/javascript\">\n<!--\n\nvar count = 0;\n\ndocument.write(\"\
  Starting Loop \");\n\nwhile(count < 10) {\ndocument.write(\"Current Count : \" +\
  \ count + \"<br />\");\ncount++;\n}\n\ndocument.write(\"Loop stopped!\");\n\n//-->\n\
  </script>\n\n<p>将变量设置为不同的值，然后尝试...</p>\n\n</body>\n</html>\n```\n\n### 输出\n\nStarting\
  \ Loop\n\nCurrent Count : 0\n\nCurrent Count : 1\n\nCurrent Count : 2\n\nCurrent\
  \ Count : 3\n\nCurrent Count : 4\n\nCurrent Count : 5\n\nCurrent Count : 6\n\nCurrent\
  \ Count : 7\n\nCurrent Count : 8\n\nCurrent Count : 9\n\nLoop stopped!\n\n## do...while\
  \ 循环\n\n`do...while` 循环与 `while` 循环类似，但发生在循环结束时。这意味着即使条件为 `false`，循环也会至少执行一次。\n\n\
  ### 流程图\n\n`do-while` 循环的流程图如下：\n\n![Image](img/image0221.jpeg)\n\n### 语法\n\nJavaScript\
  \ 中 `do...while` 循环的语法如下：\n\n```javascript\ndo {\n语句(s);\n} while (expression);\n\
  ```\n\n**注意**：不要忘记 `do...while` 循环末尾的分号。\n\n### 示例\n\n尝试以下示例学习如何在 JavaScript 中实现\
  \ `do...while` 循环。\n\n```html\n<html>\n\n<body>\n\n<script  type  =  \"text/javascript\"\
  >\n<!--\n\nvar count = 0;\n\ndocument.write(\"Starting Loop<br />\");\n\ndo {\n\
  document.write(\"Current Count : \" + count + \"<br />\");\ncount++;\n}\nwhile(count\
  \ < 5);\n\ndocument.write (\"Loop stopped!\");\n\n//-->\n</script>\n\n<p>将变量设置为不同的值，然后尝试...</p>\n\
  \n</body>\n</html>\n```\n\n### 输出\n\nStarting Loop\n\nCurrent Count : 0\n\nCurrent\
  \ Count : 1\n\nCurrent Count : 2\n\nCurrent Count : 3\n\nCurrent Count : 4\n\nLoop\
  \ stopped!\n\n# For 循环\n\n`for` 循环是循环最紧凑的形式。它包含了以下重要部分：\n\n*   `循环初始化`：我们在此处初始化计数器的起始值。初始化语句在循环开始之前执行。\n\
  *   `测试语句`：测试给定的条件是否为真。如果为真，则执行循环内部的代码，否则控制将跳出循环。\n*   `迭代语句`：我们可以在此处增加或减少计数器。\n\
  \n你可以将这三个部分放在同一行并用分号隔开。\n\n### 流程图\n\nJavaScript `for` 循环的流程图如下：\n\n![Image](img/image00222.jpeg)\n\
  \n### 语法\n\nJavaScript `for` 循环的语法如下：\n\n```javascript\nfor (initialization; test\
  \ condition; iteration statement) {\n如果测试条件为真，则执行语句(s)\n}\n```\n\n### 示例\n\n尝试以下示例学习\
  \ JavaScript 中的 `for` 循环是如何工作的。\n\n```html\n<html>\n\n<body>\n\n<script  type  =\
  \  \"text/javascript\">\n<!--\n\nvar count;\n\nfor (count = 0; count < 10; count++)\
  \ {\ndocument.write(\"Current Count : \" + count + \"<br />\");\n}\n\ndocument.write(\"\
  Loop stopped!\");\n\n//-->\n</script>\n\n<p>将变量设置为不同的值，然后尝试...</p>\n\n</body>\n\
  </html>\n```\n\n\n\n\n```javascript\ndocument.write(\"Starting Loop\"  +  \"<br\
  \ />\");\n\nfor(count =  0; count <  10; count++)  {\n  document.write(\"Current\
  \ Count : \"  + count );\n  document.write(\"<br />\");\n}\n\ndocument.write(\"\
  Loop stopped!\");\n```\n\n<p>将变量设置为不同的值并尝试...</p>\n\n### 输出\nStarting Loop\nCurrent\
  \ Count : 0\nCurrent Count : 1\nCurrent Count : 2\nCurrent Count : 3\nCurrent Count\
  \ : 4\nCurrent Count : 5\nCurrent Count : 6\nCurrent Count : 7\nCurrent Count :\
  \ 8\nCurrent Count : 9\nLoop stopped!\n将变量设置为不同的值并尝试...\n\n# JavaScript `for...in`\
  \ 循环\n\n# JavaScript `for...in` 循环\n\n`for...in` 循环用于遍历对象的属性。由于我们还没有讨论过对象（Objects），你可能对这个循环感到不太熟悉。但一旦你理解了\
  \ JavaScript 中对象的行为，就会发现这个循环非常有用。\n\n### 语法\n`for..in` 循环的语法如下 −：\n\n```javascript\n\
  for (variablename in object) {\n  要执行的语句或块\n}\n```\n\n在每次迭代中，`object` 中的一个属性会被赋值给\
  \ `variablename`，此循环会一直持续直到对象的所有属性都被遍历完毕。\n\n### 示例\n尝试以下示例来实现 `for-in` 循环。它会打印网络浏览器的\
  \ `Navigator` 对象。\n\n```html\n<html>\n<body>\n<script type  =  \"text/javascript\"\
  >\n<!--\nvar aProperty;\ndocument.write(\"Navigator Object Properties<br /> \");\n\
  for  (aProperty in navigator)  {\n  document.write(aProperty);\n  document.write(\"\
  <br />\");\n}\ndocument.write (\"Exiting from the loop!\");\n//-->\n</script>\n\
  <p>将变量设置为不同的对象并尝试...</p>\n</body>\n</html>\n```\n\n### 输出\nNavigator Object Properties\n\
  serviceWorker\nwebkitPersistentStorage\nwebkitTemporaryStorage\ngeolocation\ndoNotTrack\n\
  onLine\nlanguages\nlanguage\nuserAgent\nproduct\nplatform\nappVersion\nappName\n\
  appCodeName\nhardwareConcurrency\nmaxTouchPoints\nvendorSub\nvendor\nproductSub\n\
  cookieEnabled\nmimeTypes\nplugins\njavaEnabled\ngetStorageUpdates\ngetGamepads\n\
  webkitGetUserMedia\nvibrate\ngetBattery\nsendBeacon\nregisterProtocolHandler\nunregisterProtocolHandler\n\
  Exiting from the loop!\n将变量设置为不同的对象并尝试...\n\n# 循环控制\nJavaScript 提供了完全控制来处理循环和 switch\
  \ 语句。可能会出现这种情况：你需要在到达循环底部之前退出循环。也可能这种情况：你想跳过代码块的一部分并开始循环的下一次迭代。\n\n为了处理所有此类情况，JavaScript\
  \ 提供了 `break` 和 `continue` 语句。这些语句分别用于立即退出任何循环或开始任何循环的下一次迭代。\n\n## break 语句\n`break`\
  \ 语句在 `switch` 语句中曾简要介绍过，用于提前退出循环，跳出外层的大括号。\n\n### 流程图\nbreak 语句的流程图所示 −\n\n![Image](img/image00223.jpeg)\n\
  \n### 示例\n以下示例说明了在 while 循环中使用 `break` 语句。请注意当 `x` 达到 5 时，循环是如何提前退出并到达紧接闭合大括号下方的\
  \ `document.write (..)` 语句的 −\n\n\n\n```html\n<html>\n<body>\n<script type  =  \"\
  text/javascript\">\n<!--\nvar x =  1;\ndocument.write(\"Entering the loop<br />\
  \ \");\nwhile  (x <  20)  {\n  if  (x ==  5)  {\n    break;  // 完全跳出循环\n  }\n  x\
  \ = x +  1;\n  document.write( x +  \"<br />\");\n}\ndocument.write(\"Exiting the\
  \ loop!<br /> \");\n//-->\n</script>\n<p>将变量设置为不同的值并尝试...</p>\n</body>\n</html>\n\
  ```\n\n### 输出\nEntering the loop\n2\n3\n4\n5\nExiting the loop!\n将变量设置为不同的值并尝试...\n\
  \n我们已经见过 `break` 语句在 switch 内部的用法。\n\n## continue 语句\n`continue` 语句告诉解释器立即开始循环的下一次迭代并跳过剩余代码块。当遇到\
  \ `continue` 语句时，程序流会立即移动到循环检查表达式，如果条件仍为真，则开始下一次迭代，否则控制将退出循环。\n\n### 示例\n此示例说明了在\
  \ while 循环中使用 `continue` 语句。请注意当变量 `x` 中的索引达到 5 时，如何使用 `continue` 语句跳过打印 −\n\n```html\n\
  <html>\n<body>\n<script type  =  \"text/javascript\">\n<!--\nvar x =  1;\ndocument.write(\"\
  Entering the loop<br /> \");\nwhile  (x <  10)  {\n  x = x +  1;\n  if  (x ==  5)\
  \  {\n    continue;\n  }\n  document.write( x +  \"<br />\");\n}\ndocument.write(\"\
  Exiting the loop!<br /> \");\n//-->\n</script>\n<p>将变量设置为不同的值并尝试...</p>\n</body>\n\
  </html>\n```\n\n### 输出\nEntering the loop\n2\n3\n4\n5\n6\n7\n8\n9\n10\nExiting the\
  \ loop!\n将变量设置为不同的值并尝试...\n\n\n\n\n\n在我们使用函数之前，需要先对其进行定义。在 JavaScript 中，定义函数最常用的方法是使用\
  \ `function` 关键字，后跟一个唯一的函数名、参数列表（可以为空）以及一个用大括号括围的语句块。\n\n### 语法\n\n基本语法所示。\n\n```html\n\
  <script type=\"text/javascript\">\n<!--\nfunction functionname(parameter-list) {\n\
  statements\n}\n//-->\n</script>\n```\n\n### 示例\n\n尝试以下示例。它定义了一个名为 `sayHello` 的函数，不接受任何参数——\n\
  \n```html\n<script type  = \"text/javascript\">\n<!--\nfunction sayHello()  {\n\
  alert(\"Hello there\");\n}\n//-->\n</script>\n```\n\n## 调用函数\n\n要在脚本的后续某个地方调用函数，你只需要像下面的代码所示编写该函数的名称即可。\n\
  \n```html\n<html>\n<head>\n<script type = \"text/javascript\">\nfunction sayHello()\
  \  {\ndocument.write (\"Hello there!\");\n}\n</script>\n</head>\n<body>\n<p>点击下面的按钮调用函数</p>\n\
  <form>\n<input type = \"button\" onclick = \"sayHello()\" value = \"Say Hello\"\
  >\n</form>\n<p>在 write 方法中使用不同的文本然后尝试...</p>\n</body>\n</html>\n```\n\n### 输出\n\n\
  ## 函数参数\n\n到目前为止，我们已经了没有参数的函数。但在调用函数时，可以传递不同的参数。这些传递的参数可以在函数内部被捕获，并对这些参数进行任何操作。函数可以接受多个由逗号分隔的参数。\n\
  \n### 示例\n\n尝试以下示例。我们在这里修改了 `sayHello` 函数。现在它接受两个参数。\n\n```html\n<html>\n<head>\n\
  <script type = \"text/javascript\">\nfunction sayHello(name, age)  {\ndocument.write\
  \ (name + \" is \"  + age + \" years old.\");\n}\n</script>\n</head>\n<body>\n<p>点击下面的按钮调用函数</p>\n\
  <form>\n<input type = \"button\" onclick = \"sayHello('Zara', 7)\" value = \"Say\
  \ Hello\">\n</form>\n<p>在函数内部使用不同的参数然后尝试...</p>\n</body>\n</html>\n```\n\n### 输出\n\
  \n## return 语句\n\nJavaScript 函数可以有一个可选的 `return` 语句。如果你想从函数返回一个值，则需要该语句。该语句应该是应该是函数中的最后一条语句。\n\
  \n例如，你可以向函数传递两个数字，然后可以在调用程序中期望函数返回它们的乘积。\n\n### 示例\n\n尝试以下示例。它定义了一个接受两个参数的函数，并在调用程序中返回结果之前对它们进行拼接。\n\
  \n```html\n<html>\n<head>\n<script type = \"text/javascript\">\nfunction concatenate(first,\
  \ last)  {\nvar full;\nfull = first + last;\nreturn full;\n}\nfunction secondFunction()\
  \  {\nvar result;\nresult = concatenate('Zara', 'Ali');\ndocument.write (result\
  \ );\n}\n</script>\n</head>\n<body>\n<p>点击下面的按钮调用函数</p>\n<form>\n<input type = \"\
  button\" onclick = \"secondFunction()\" value = \"Call Function\">\n</form>\n<p>在函数内部使用不同的参数然后尝试...</p>\n\
  </body>\n</html>\n```\n\n### 输出\n\n关于 JavaScript 函数有很多要学习，但我们在本教程中已经涵盖了最重要的概念。\n\
  \n* **JavaScript 嵌套函数**\n* **JavaScript Function( ) 构造函数**\n* **JavaScript 函数字面量**\n\
  \n# 事件\n\n## 什么是事件？\n\nJavaScript 与 HTML 的交互通过事件处理，这些事件会在用户或浏览器操作页面时发生。\n\n当页面加载时，它被称为一个事件。当用户点击按钮时，该点击操作也是一个事件。其他示例包括按下任何按键、关闭窗口、调整窗口大小等事件。\n\
  \n开发者可以使用这些事件来执行 JavaScript 代码编写的响应，这会导致按钮关闭窗口、向用户显示消息、验证数据以及几乎可以想象的任何其他类型的响应。\n\
  \n事件是文档对象模型（DOM）Level 3 的一部分，每个 HTML 元素都包含一组可以触发 JavaScript 代码的事件。\n\n请阅读这个小型教程以更好地理解\
  \ `HTML 事件参考`。在这里，我们将看到通过几个示例来理解事件与 JavaScript 之间的关系——\n\n## onclick 事件类型\n\n这是最常用的事件类型，当用户点击鼠标左键时发生。你可以针对此事件类型编写验证、警告等内容。\n\
  \n### 示例\n\n尝试以下示例。\n\n```html\n<html>\n<head>\n<script type = \"text/javascript\"\
  >\n<!--\nfunction sayHello()  {\nalert(\"Hello World\")\n}\n//-->\n</script>\n</head>\n\
  <body>\n<p>点击下面的按钮查看结果</p>\n<form>\n<input type = \"button\" onclick = \"sayHello()\"\
  \ value = \"Say Hello\" />\n</form>\n</body>\n</html>\n```\n\n### 输出\n\n## onsubmit\
  \ 事件类型\n\n`onsubmit` 是用户点击鼠标左键时发生的事件。你可以针对此事件类型编写验证、警告等内容。\n\n### 示例\n\n下面的示例展示了如何使用\
  \ `onsubmit`。在这里 `validate()` 在表单之前被触发。\n\n```html\n<html>\n<head>\n<script type\
  \ = \"text/javascript\">\n<!--\nfunction validate()  {\nall here\n}\n//-->\n</script>\n\
  </head>\n<body>\n<form>\n<input type = \"button\" onsubmit = \"validate()\" value\
  \ = \"Submit\" />\n</form>\n</body>\n</html>\n```\n\n## onmouseover 和 onmouseout\n\
  \n这两个事件类型可以帮助你为图像甚至文本创建效果。`onmouseover` 事件在你将鼠标移到任何元素上时触发，而 `onmouseout` 在你移出时触发。尝试以下示例。\n\
  \n```html\n<html>\n<head>\n<script type = \"text/javascript\">\n<!--\nfunction over()\
  \  {\ndocument.write (\"Mouse Over\");\n}\nfunction out()  {\ndocument.write (\"\
  Mouse Out\");\n}\n//-->\n</script>\n</head>\n<body>\n<p>将鼠标移入 div 内查看结果：</p>\n<div\
  \ onmouseover = \"over()\" onmouseout = \"out()\">\n<h2> 在 div 内部</h2>\n</div>\n\
  </body>\n</html>\n```\n\n### 输出\n\n## HTML5 标准事件\n\n这里列出了标准的 HTML5 事件供参考。这里的 script\
  \ 表示针对事件执行的 JavaScript 函数。\n\n| 属性 | 值 | 说明 |\n| :--- | :--- | :--- |\n| Offline\
  \ | script | 文档离线时触发 |\n| Onabort | script | 中止事件时触发 |\n| onafterprint | script\
  \ | 文档打印后触发 |\n| onbeforeonload | script | 文档加载前触发 |\n| onbeforeprint | script |\
  \ 文档打印前触发 |\n| onblur | script | 窗口失去焦点时触发 |\n| oncanplay | script | 媒体可以播放，但可能需要停止缓冲\
  \ |\n| oncanplaythrough | script | 媒体可以播放到结束，无需停止缓冲 |\n| onchange | script | 元素改变时触发\
  \ |\n| onclick | script | 鼠标点击时触发 |\n| oncontextmenu | script | 触发键菜单时触发 |\n| ondblclick\
  \ | script | 鼠标双击时触发 |\n| ondrag | script | 元素被拖动时触发 |\n| ondragend | script | 拖放操作结束时触发\
  \ |\n| ondragenter | script | 元素拖入有效目标区域时触发 |\n| ondragleave | script | 元素拖过有效目标区域时触发\
  \ |\n| ondragover | script | 拖放操作开始时触发 |\n| ondragstart | script | 拖放操作开始时触发 |\n\
  | ondrop | script | 拖放元素被释放时触发 |\n\n\n\n\n\n| 事件 | 类型 | 描述 |\n| :--- | :--- | :---\
  \ |\n| `ondurationionchange` | script | 当媒体长度发生变化时触发 |\n| `onemptied` | script |\
  \ 当媒体资源元素突然变空时触发 |\n| `onended` | script | 当媒体播放结束时触发 |\n| `onerror` | script |\
  \ 当发生错误时触发 |\n| `onfocus` | script | 当窗口获得焦点时触发 |\n| `onformchange` | script | 当表单发生变化时触发\
  \ |\n| `onforminput` | script | 当表单获取用户输入时触发 |\n| `onhaschange` | script | 当文档发生变化时触发\
  \ |\n| `oninput` | script | 当元素获取用户输入时触发 |\n| `oninvalid` | script | 当元素无效时触发 |\n\
  | `onkeydown` | script | 当按键按下时触发 |\n| `onkeypress` | script | 当按键被按下并释放时触发 |\n\
  | `onkeyup` | script | 当按键释放时触发 |\n| `onload` | script | 当文档加载完成时触发 |\n| `onloadeddata`\
  \ | script | 当媒体数据加载完成时触发 |\n| `onloadedmetadata` | script | 当媒体元素的持续时间和和其他媒体数据加载时触发\
  \ |\n| `onloadstart` | script | 当浏览器开始加载媒体数据时触发 |\n| `onmessage` | script | 当消息被触发时触发\
  \ |\n| `onmousedown` | script | 当鼠标按钮被按下时触发 |\n| `onmousemove` | script | 当鼠标指针移动时触发\
  \ |\n| `onmouseout` | script | 当鼠标指针移出元素范围时触发 |\n| `onmouseover` | script | 当鼠标指针悬在元素上时触发\
  \ |\n| `onmouseup` | script | 当鼠标按钮被释放时触发 |\n| `onmousewheel` | script | 当鼠标轮正在旋转时触发\
  \ |\n| `onoffline` | script | 当文档离线时触发 |\n| `onine` | script | 当文档上线时触发 |\n| `ononline`\
  \ | script | 当文档上线时触发 |\n| `onpagehide` | script | 当窗口被隐藏时触发 |\n| `onpageshow` |\
  \ script | 当窗口变为可见时触发 |\n| `onpause` | script | 当媒体数据暂停时触发 |\n| `onplay` | script\
  \ | 当媒体数据准备开始播放时触发 |\n| `onplaying` | script | 当媒体数据开始播放时触发 |\n| `onpopstate` |\
  \ script | 当窗口历史记录变化时触发 |\n| `onprogress` | script | 当浏览器正在获取媒体数据时触发 |\n| `onratechange`\
  \ | script | 当媒体数据的播放速率变化时触发 |\n| `onreadystatechange` | script | 当就状态（ready-state）变化时触发\
  \ |\n| `onredo` | script | 当文档执行重做时触发 |\n| `onresize` | script | 当窗口被调整尺寸时触发 |\n\
  | `onscroll` | script | 当元素的滚动条正在滚动时触发 |\n| `onseeked` | script | 当媒体元素的寻求属性不再为\
  \ true 且寻求结束时触发 |\n| `onseeking` | script | 当媒体元素的寻求属性为 true 且开始寻求时触发 |\n| `onselect`\
  \ | script | 当元素被选中时触发 |\n| `onstalled` | script | 当获取媒体数据发生错误时触发 |\n| `onstorage`\
  \ | script | 当文档加载时触发 |\n| `onsubmit` | script | 当表单被提交时触发 |\n| `onsuspend` | script\
  \ | 当浏览器一直在获取媒体数据，但在整个媒体文件获取完成之前停止时触发 |\n| `ontimeupdate` | script | 当媒体改变其播放位置时触发\
  \ |\n| `onundo` | script | 当文档执行撤销时触发 |\n| `onunload` | script | 当用户离开文档时触发 |\n\
  | `onvolumechange` | script | 当媒体改变音量或当音量被设置为“静音”时触发 |\n| `onwaiting` | script |\
  \ 当媒体停止播放但预计恢复时触发 |\n\n# JavaScript 与 Cookies\n\n## 什么是 Cookie？\n\n 浏览器和服务器使用 HTTP\
  \ 协议进行通信，而 HTTP 是一个无状态协议。但对于商业网站来说，需要在不同页面之间维持会话信息。例如，一个用户的注册在完成多个页面后才结束。但如何在所有网页中维持该用户的会话信息呢？\n\
  \n在许多情况下，使用 cookie 是记忆和跟踪偏好、购买、佣金以及为了改善访问体验或网站统计所需的其他信息的有效方法。\n\n## 它是如何工作的？\n\n\
  你的服务器以 cookie 的形式向访问者的浏览器发送一些数据。浏览器可能会接受该 cookie。如果接受，它将以纯文记录存储在访问者的硬盘上。现在，当访问者到达你网站的另一个页面时，浏览器会将相同的\
  \ cookie 发送到服务器进行检索。一旦检索到，你的服务器就知道/记得之前存储了什么。\n\nCookies 是包含 5 个变长字段的纯文数据记录——\n\n\
  - `Expires` — Cookie 过期日期。如果为空，Cookie 将在访问者退出浏览器时过期。\n- `Domain` — Cookie 的域名。\n\
  - `Path` — 设置 Cookie 的目录或路径。如果为空，则适用于当前页面。\n- `Secure` — 如果此字段包含“secure”字样，则 Cookie\
  \ 只能通过安全连接检索。\n- `Name=Value` — Cookie 最初以键值对的形式设计，用于 CGI 编程。Cookie 中的数据会在浏览器和服务器之间自动传输，因此服务器上的\
  \ CGI 脚本可以读取和写入。JavaScript 使用 `Document` 对象的 `cookie` 属性来创建、修改和删除适用于页面的 Cookie。\n\
  \n## 存储 Cookie\n\n创建 Cookie 的简单方法是给 `document.cookie` 赋值一个字符串，如下：\n\n```javascript\n\
  document.cookie = \"key1 = value1;key2 = value2;expires = date\";\n```\n\n在这里 `expires`\
  \ 属性是可选的。如果你提供了有效的日期或时间，Cookie 将在该之后过期。\n\n**注意** — Cookie 值可能包含分号、逗号或空格。由于这些原因，你可能需要在存储\
  \ Cookie 之前使用 `escape()` 函数对值进行编码。如果你这样做，在读取 Cookie 值时也使用相应的 `unescape()` 函数。\n\n\
  ### 示例\n\n尝试以下代码。它会在输入 cookie 中设置用户名称。\n\n```html\n<html>\n<head>\n<script type=\"\
  text/javascript\">\nfunction WriteCookie() {\n  if(document.myform.customer.value\
  \ == \"\") {\n    alert(\"请输入某些值！\");\n    return;\n  }\n  cookievalue = escape(document.myform.customer.value)\
  \ + \";\";\n  document.cookie = \"name=\" + cookievalue;\n  document.write (\"设置的\
  \ Cookie : \" + \"name=\" + cookievalue );\n}\n}\n</script>\n</head>\n<body>\n<form\
  \ name=\"myform\" action=\"\">\n输入名称: <input type=\"text\" name=\"customer\"/>\n\
  <input type=\"button\" value=\"设置 Cookie\" onclick=\"WriteCookie();\"/>\n</form>\n\
  </body>\n</html>\n```\n\n### 输出\n\n现在你的机器有一个名为 `name` 的 Cookie。你可以使用用逗号分隔的多个键值对来设置多个\
  \ Cookie。\n\n## 读取 Cookie\n\n读取 Cookie 与写入 Cookie 一样简单，因为 `document.cookie` 对象的值就是\
  \ Cookie。所以当你想要访问 Cookie 时，可以使用这个字符串。`document.cookie` 字符串将保留一个由分号分隔的名称=值对列表，其中\
  \ `name` 是 Cookie 的名称，value 是它的字符串值。\n\n你可以使用字符串的 `split()` 函数将字符串拆分为键和值，如下——\n\n\
  ### 示例\n\n尝试以下示例以获取所有的 Cookie。\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\"\
  >\n//\n```\n\n\n\n\n\n```javascript\nfunction ReadCookie() {\n  var allcookies =\
  \ document.cookie;\n  document.write (\"All Cookies : \" + allcookies);\n  // Get\
  \ all the cookies pairs in an array\n  cookiearray = allcookies.split(';');\n  //\
  \ Now take key value pair out of this array\n  for(var i=0; i<cookiearray.length;\
  \ i++) {\n    name = cookiearray[i].split('=')[0];\n    value = cookiearray[i].split('=')[1];\n\
  \    document.write (\"Key is : \" + name + \" and Value is : \" + value);\n  }\n\
  }\n```\n`</script>`\n</head>`\n<<body>\n<form name=\"myform\" action=\"\">\n  <p>\
  \ 点击以下按钮并查看结果：</p>\n  <input type=\"button\" value=\"Get Cookie\" onclick=\"ReadCookie()\"\
  />\n</form>\n</body>\n`</html>`\n\n**Note** — 在这里 `length` 是 `Array` 类的一个方法，用于返回数组的长度。我们将在单独的章节中讨论数组。在此之前，请尝试理解它。\n\
  \n**Note** — 你的机器上可能已经设置了其他 Cookie。上述代码将显示你机器上设置的所有 Cookie。\n\n## 设置 Cookie 过期日期\n\
  \n你可以通过设置过期日期并将过期日期保存到 Cookie 中，将 Cookie 的寿命超出当前的浏览器会话。这可以通过将 `expires` 属性设置为一个日期和时间来实现。\n\
  \n### 示例\n\n尝试以下示例。它演示了如何将 Cookie 的过期日期延长 1 个月。\n\n```html\n<<html>\n<head>\n<script\
  \ type=\"text/javascript\">\n<!--\nfunction WriteCookie() {\n  var now = new Date();\n\
  \  now.setMonth( now.getMonth() + 1 );\n  cookievalue = escape(document.myform.customer.value)\
  \ + \";\";\n  document.cookie = \"name=\" + cookievalue;\n  document.cookie = \"\
  expires=\" + now.toUTCString() + \";\";\n  document.write (\"Setting Cookies : \"\
  \ + \"name=\" + cookievalue );\n}\n//-->\n</script>\n</head>\n<body>\n<form name=\"\
  myform\" action=\"\">\n  输入名称: <input type=\"text\" name=\"customer\"/>\n  <input\
  \ type=\"button\" value=\"Set Cookie\" onclick=\"WriteCookie()\"/>\n</form>\n</body>\n\
  </html>\n```\n\n### 输出\n\n## 删除 Cookie\n\n有时你会想要删除一个 Cookie，以便后续读取该 Cookie 的尝试返回空。要实现这一点，你只需要将过期日期设置为过去的时间即可。\n\
  \n### 示例\n\n尝试以下示例。它演示了如何通过将过期日期设置为当前日期的一个月前来删除 Cookie。\n\n```html\n<<html>\n<head>\n\
  <script type=\"text/javascript\">\n<!--\nfunction WriteCookie() {\n  var now = new\
  \ Date();\n  now.setMonth( now.getMonth() - 1 );\n  cookievalue = escape(document.myform.customer.value)\
  \ + \";\";\n  document.cookie = \"name=\" + cookievalue;\n  document.cookie = \"\
  expires=\" + now.toUTCString() + \";\";\n  document.write(\"Setting Cookies : \"\
  \ + \"name=\" + cookievalue );\n}\n//-->\n</script>\n</head>\n<body>\n<form name=\"\
  myform\" action=\"\">\n  输入名称: <input type=\"text\" name=\"customer\"/>\n  <input\
  \ type=\"button\" value=\"Set Cookie\" onclick=\"WriteCookie()\"/>\n</form>\n</body>\n\
  </html>\n```\n\n### 输出\n\n# 页面重定向\n\n## 什么是页面重定向？\n\n你可能遇到过这种情况：点击一个 URL 到页面 X，但内部你被重定向另一个页面\
  \ Y。这是由于**页面重定向**导致的。这个概念与**JavaScript 页面刷新**不同。\n\n有多种原因可能让你将用户从原始页面重定向。我们列出了其中一些原因：\n\
  \n* 你不喜欢你的域名名称，正在迁移到新域名。在这种情况下，你可能希望将所有访问者引导到新网站。你可以保留旧域名，但放置一个带有页面重定向的页面，以便所有旧域名的访问者都能进入你的新域名。\n\
  * 你根据浏览器版本、名称或不同的国家构建了多个页面，那么与其使用服务器端页面重定向，不如使用客户端页面重定向来让用户落在适当页面。\n* 搜索引擎可能已经索引了你的页面。但在移动到另一个域名时，你不希望丢失通过搜索引擎带来的访问者。因此，你可以使用客户端页面重定向。但请记住，这不应该是为了欺骗搜索引擎，这可能会导致你的网站被封禁。\n\
  \n## 页面重定向是如何工作的？\n\n页面重定向的实现如下。\n\n### 示例 1\n\n这非常简单。\n\n```html\n<<html>\n<head>\n\
  <script type=\"text/javascript\">\n<!--\nfunction Redirect() {\n  window.location\
  \ = \"https://tutorialpoint.com\";\n}\n//-->\n</script>\n</head>\n<body>\n  <p>点击以下按钮来重定向你的站点。</p>\n\
  \  <form>\n    <input type=\"button\" value=\"Redirect\" onclick=\"Redirect()\"\
  />\n  </form>\n</body>\n</html>\n```\n\n### 输出\n\n### 示例 2\n\n你可以在重定向之前显示一个适当的消息。这里\
  \ `setTimeout()` 是一个内置函数，可以在给定时间后。\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\"\
  >\n<!--\nfunction Redirect() {\n  window.location = \"tutorialpoint.com\";\n}\n\
  document.write(\"You will be redirected.\");\nsetTimeout('Redirect()', 10000);\n\
  //-->\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\n### 输出\n\n你将被重定向到 tutorialpoint.com\n\
  \n### 示例 3\n\n以下示例显示了如何根据浏览器进行重定向。\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\"\
  >\n<!--\nvar browsername = navigator.appName;\nif( browsername == \"Netscape\")\
  \ {\n  window.location = \"http://tutorialpoint.com/ns.htm\";\n} else if (browsername\
  \ ==\"Microsoft Explorer\") {\n  window.location = \"http://tutorialpoint.com/ie.htm\"\
  ;\n} else {\n  window.location = \"http://tutorialpoint.com/other.htm\";\n}\n//-->\n\
  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n# 对话框\n\nJavaScript 支持三种重要的对话框。这些对话框可以用于引起警告、对任何输入进行确认或从用户处获取输入。在这里我们将讨论每一个对话框。\n\
  \n## Alert 对话框\n\nAlert 警告对话框主要用于向用户提供警告消息。例如，如果一个输入字段需要输入文本但用户没有提供任何输入，那么作为验证的一部分，你可以使用警框提供警告消息。\n\
  \n尽管如此，alert 对话框仍可用于友好的消息。警示框只提供一个“OK”按钮供选择并继续。\n\n### 示例\n\n```html\n<html>\n<head>\n\
  <script type=\"text/javascript\">\n<!--\nfunction Warn() {\n  alert (\"这是一个警告消息！\"\
  );\n  document.write (\"这是一个警告消息！\");\n}\n//-->\n</script>\n</head>\n<body>\n  <p>点击以下按钮查看结果：</p>\n\
  \  <form>\n    <input type=\"button\" value=\"Click Me\" onclick=\"Warn();\"/>\n\
  \  </form>\n</body>\n</html>\n```\n\n### 输出\n\n## Confirmation 对话框\n\n确认对话框主要用于获取用户对任何选项的同意。它显示一个包含两个按钮的对话框：OK\
  \ 和 Cancel。\n\n如果用户点击 OK 按钮，窗口方法 `confirm()` 将返回 `true`。如果用户点击 Cancel 按钮，则 `confirm()`\
  \ 返回 `false`。你可以如下使用确认对话框。\n\n### 示例\n\n```html\n<html>\n<head>\n<script type=\"\
  text/javascript\">\n<!--\nfunction getConfirmation() {\n  var retVal = confirm(\"\
  你想继续吗？\");\n  if( retVal == true ) {\n    document.write (\"用户想要继续！\");\n    return\
  \ true;\n  } else {\n```\n\n\n\n\n```javascript\ndocument.write (\"User does not\
  \ want to continue!\");\n\nreturn false;\n\n}\n\n}\n\n//-->\n</script>\n\n</head>\n\
  \n<body>\n\n<p>点击以下按钮查看结果：</p>\n\n<form>\n<input type=\"button\" value=\"Click Me\"\
  \ onclick=\"getConfirmation();\" />\n</form>\n\n</body>\n</html>\n```\n\n### 输出\n\
  \n## 提示对话框 (Prompt Dialog Box)\n\n当你想要弹出一个文本框来获取用户输入时，提示对话框非常有用。因此，它允许你与用户进行交互。用户需要填写字段，然后点击\
  \ OK。\n\n此对话框通过名为 `prompt()` 的方法显示，该方法接受两个参数：(i) 你想在文本框中显示的标签，以及 (ii) 显示在文本框中的默认字符串。\n\
  \n此对话框有两个按钮：`OK` 和 `Cancel`。如果用户点击 OK 按钮，窗口方法 `prompt()` 将返回文本框中输入的值。如果用户点击 Cancel\
  \ 按钮，窗口方法 `prompt()` 返回 `null`。\n\n### 示例\n\n下面的示例展示了如何使用提示对话框 ——\n\n```html\n<html>\n\
  <head>\n<script type=\"text/javascript\">\n<!--\nfunction getValue() {\nvar retVal\
  \ = prompt(\"Enter your name : \", \"your name here\");\ndocument.write(\"You have\
  \ entered : \" + retVal);\n}\n//-->\n</script>\n</head>\n<body>\n<p>点击以下按钮查看结果：</p>\n\
  <form>\n<input type=\"button\" value=\"Click Me\" onclick=\"getValue();\" />\n</form>\n\
  </body>\n</html>\n```\n\n### 输出\n\n# JavaScript - Void 关键字 (Void Keyword)\n\n`void`\
  \ 是 JavaScript 中一个重要的关键字，可以作为一元运算符使用，出现在它的单个操作数之前，该操作数可以是任何类型。此运算符指定了一个要进行求的表达式，但不返回任何值。\n\
  \n### 语法\n\n`void` 的语法可以是以下两种之一 ——\n\n```html\n<head>\n<script type=\"text/javascript\"\
  >\n<!--\nvoid func()\njavascript:void func()\nor:\nvoid(func())\njavascript:void(func())\n\
  //-->\n</script>\n</head>\n```\n\n### 示例 1\n\n该运算符最常见的用法是在客户端 `javascript:` URL\
  \ 中，它允许你对表达式的副作用进行求值，而无需浏览器显示求值表达式的结果。\n\n在这里，表达式 `alert ('Warning!!!')` 被求值，但它没有被加载回当前文档\
  \ ——\n\n```html\n<html\n<head>\n<script type=\"text/javascript\">\n<!--\n//-->\n\
  </script>\n</head>\n<body>\n<p>点击这里，这没有任何反应...</p>\n<a href=\"javascript:void(alert('Warning!!!'))\"\
  >点击我！</a>\n</body>\n</html>\n```\n\n### 输出\n\n### 示例 2\n\n看看下面的示例。下面的链接没有任何作用，因为表达式\
  \ \"0\" 在 JavaScript 中没有效果的。在这里，表达式 \"0\" 被求值，但它没有被加载回当前文档。\n\n```html\n<html>\n\
  <head>\n<script type=\"text/javascript\">\n<!--\n//-->\n</script>\n</head>\n<body>\n\
  <p>点击这里，这没有任何反应...</p>\n<a href=\"javascript:void(0)\">点击我！</a>\n</body>\n</html>\n\
  ```\n\n### 输出\n\n### 示例 3\n\n`void` 的另一个用法是故意生成 `undefined` 值，如下所示。\n\n```html\n\
  <html\n<head>\n<script type=\"text/javascript\">\n<!--\nfunction getValue() {\n\
  var a,b,c;\na = void ( b = 5, c = 7 );\ndocument.write('a = ' + a + ' b = ' + b\
  \ +' c = ' + c );\n}\n//-->\n</script>\n</head>\n<body>\n<p>点击以下查看结果：</p>\n<form>\n\
  <input type=\"button\" value=\"Click Me\" onclick=\"getValue();\" />\n</form>\n\
  </body>\n</html>\n```\n\n### 输出\n\n# 页面打印 (Page Printing)\n\n很多时候，你可能想在网页上放置一个按钮，通过实际打印机打印该网页的内容。JavaScript\
  \ 帮助你使用 `window` 对象的 `print` 函数来实现此功能。\n\nJavaScript 打印函数 `window.print()` 在执行时会打印当前网页。你可以像下面的示例所示使用\
