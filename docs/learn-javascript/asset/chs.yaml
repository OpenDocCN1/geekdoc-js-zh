  \ Array 对象\n\n`Array` 对象允许你在单个存储器中存储多个值。\n\n### 语法\n\n使用以下语法创建一个 `Array` 对象 ——\n\
  \n```\nvar fruits = new Array(\"apple\", \"orange\");\n```\n\n`Array` 参数是一系列经过正确编码的字符序列。\n\
  \n由于 JavaScript 会自动在字符串原始值和 `String` 对象之间进行转换，因此你可以在字符串原始值上调用 `String` 对象的任何辅助方法。\n\
  \n## Array 属性\n\n以下是 `Array` 对象的属性列表及其描述。\n\n| 序号 | 属性 & 描述 |\n| :--- | :--- |\n\
