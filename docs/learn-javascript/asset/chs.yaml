  \ 方法的使用。\n\n## Date 对象\n\n`Date` 对象是 JavaScript 语言中内置的数据类型。`Date` 对象通过如下所示的 `new\
  \ Date()` 创建。\n\n一旦创建了 `Date` 对象，就可以使用许多方法对其进行操作。大多数方法仅允许你使用本地时间或 UTC（通用时间，或 GMT）时间获取和设置对象的年、月、日、小时、分、秒和毫秒字段。\n\
  \nECMAScript 标准要求 `Date` 对象能够表示 1970/1/1 前后 1 亿天范围内的任何日期和时间，精度达到毫秒。这是一个正负 273,785\
  \ 年的范围，因此 JavaScript 可以表示直到 275755 年的日期时间。\n\n### 语法\n\n你可以使用以下任何语法通过 `Date()` 构造函数创建\
  \ `Date` 对象。\n\n```\nnew Date()\nnew Date(milliseconds)\nnew Date(datestring)\n\
  new Date(year,month,date[,hour,minute,second,millisecond ])\n```\n\n**注意** — 括号中的参数始终可选可选。\n\
  \n以下是参数的说明：\n\n* **无参数** — 在不带参数的情况下，`Date()` 构造函数创建一个设置为当前日期和时间的 `Date` 对象。\n*\
  \ **milliseconds** — 当传递一个数字参数时，它被视为毫秒级的日期内部数值表示，由 `getTime()` 方法返回。例如，传递参数 5000\
  \ 将创建一个代表 1970/1/1 午夜后五秒的日期。\n* **datestring** — 当传递一个字符串参数时，它是日期的字符串表示，格式为 `Date.parse()`\
  \ 方法接受的格式。\n* **7 个参数** — 用于使用上面所示的构造函数的最后形式。以下是每个参数的说明：\n    * **year** — 表示年份的整数值。为了兼容性（为了避免千年问题），你应该始终指定完整的年份；使用\
  \ 1998 而不是 98。\n    * **month** — 表示月份的整数值，从 0（一月）开始到 11（十二月）。\n    * **date** —\
  \ 一个月中第几（整数值）。\n    * **hour** — 一天中的小时数（整数值，24 小时制）。\n    * **minute** — 时间读取中的分钟部分的整数值。\n\
  \    * **second** — 时间读取中的秒部分的整数值。\n    * **millisecond** — 时间读取中的毫秒部分的整数值。\n\n\
  ## Date 属性\n\n以下是 `Date` 对象的属性列表及其其描述。\n\n| 序号 | 属性与描述 |\n| :--- | :--- |\n| 1 |\
