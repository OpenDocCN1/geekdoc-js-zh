- "# JavaScript 入门指南\n\n\n\n\n我想将这本书献给使用它的的学生们。祝你们未来职业取得成功，并希望你们永停止学习。\n\n\n# 概述\n\
  \n## 什么是 JavaScript？\n\nJavaScript 是一种动态计算机编程语言。它是轻量级的，最常用作网页的一部分，其实现方式允许客户端脚本与用户交互并创建动态页面。它是一种具有面向对象能力的解释型编程语言。\n\
  \nJavaScript 最初被称为 `LiveScript`，但 Netscape 将其更名为 JavaScript，可能是因为 Java 带来的轰热。JavaScript\
  \ 于 1995 年以 `LiveScript` 的名称在 Netscape 2.0 中首次出现。该语言通用核心已嵌入 Netscape、Internet Explorer\
  \ 和其他网络浏览器中。\n\n`ECMA-262 Specification` 定义了 JavaScript 核心语言的标准版本。\n\n- JavaScript\
  \ 是一种轻量级的解释型编程语言。\n- 为创建以网络中心的应用程序而设计。\n- 与 Java 互补并集成。\n- 与 HTML 互补并集成。\n- 开放且跨平台\n\
  \n## 客户端 JavaScript\n\n客户端 JavaScript 是该语言最常见的形式。脚本应该包含在 HTML 中或通过 HTML 引用。\n\n\
  ## JavaScript 的优势\n\n使用 JavaScript 的优点是：\n\n- **减少服务器负载**\n- **给用户提供即时反馈**\n- **增强交互性**\n\
  - **更丰富的界面**\n\n## JavaScript 的局限性\n\n我们不能将 JavaScript 视为完全\n\n- **客户端**\n- **多线程或多处理器能力**：JavaScript\
  \ 不具备任何多线程或多处理器能力。\n\nJavaScript 是一种轻量级的解释型编程语言，允许你使用简单的文本编辑器在静态页面中构建交互。\n\n## JavaScript\
  \ 开发工具\n\nJavaScript 的主要优点之一是不需要贵的开发工具。你可以从 Notepad 等简单的文本编辑器开始。\n\n为了让生活更简单，各种厂商提供了优秀的\
  \ JavaScript 工具：\n\n- **Microsoft FrontPage**：微软开发了一个名为 FrontPage 的流行 HTML 编辑器。FrontPage\
  \ 还为网页开发者提供了许多辅助创建的工具。\n- **Macromedia Dreamweaver MX**：专业网页领域流行的 HTML 和 JavaScript\
  \ 编辑器。它提供了许多实用的 JavaScript 组件，与数据库良好集成，并符合 XHTML 和 XML 等标准。\n- **Macromedia HomeSite\
  \ 5**：HomeSite 5 是 Macromedia 受欢迎的 HTML 和 JavaScript 编辑器，可用于个人网站。\n\n## 现在的 JavaScript？\n\
  \nECMAScript 第 5 版标准是多年来的首次更新。JavaScript 2.0 符合 ECMAScript 第 5 版标准，两者之间的差异极小。\n\n\
  JavaScript 2.0 的规范可以在以下网站找到：`http://www.ecmascript.org/`\n\n今天，Netscape 的 JavaScript\
  \ 和微软的 JScript 都符合 ECMAScript 标准，尽管这两种语言仍然支持标准之外的功能。\n\n### 语法\n\nJavaScript 可以通过放在网页\
  \ `<script>... </script>` HTML 标签内的 JavaScript 语句来实现。\n\n你可以将包含 JavaScript 的 `<script>`\
  \ 标签放置在网页的任何位置，但通常建议将其保留在 `<head>` 标签内。\n\n`<script>` 标签通知浏览器开始将这些标签之间的所有文本视为脚本。\n\
  \n```\n<script ...>\n\nJavaScript 代码\n\n</script>\n```\n\nscript 标签带有两个重要的属性：\n\n\
  - **Language**：此属性指定你正在使用的脚本语言。通常，它的值为 `javascript`。尽管最新版本的 HTML（及其继任者 XHTML）已经废弃了该属性的使用。\n\
  \n\n\n\n-   **Type** − 此属性是目前推荐用于指示所使用的脚本语言的，其值应设置为 \"text/javascript\"。\n\n因此，你的\
  \ JavaScript 段将如下所示 −\n\n```html\n<script language = \"javascript\" type = \"text/javascript\"\
  >\nJavaScript code\n</script>\n```\n\n## 你的第一段 JavaScript 代码\n\n让我们通过一个示例来打印 \"\
  Hello World\"。我们添加了一个可选的 HTML 注释并包裹在我们的 JavaScript 代码周围。这是为了防止代码被不支持 JavaScript\
  \ 的浏览器执行。注释以 `//-->` 结束。在这里，`//` 表示 JavaScript 中的注释，因此我们添加了它以防止浏览器将 HTML 注释的结束标记读取为\
  \ JavaScript 代码。接下来，我们调用了函数 `document.write`，它会向我们的 HTML 文档写入一个字符串。\n\n此函数可以用于写入文本、HTML\
  \ 或两者兼有。请看以下代码。\n\n```html\n<html>\n<body>\n<script  language  =  \"javascript\"\
  \  type  =  \"text/javascript\">\n<!--\ndocument.write(\"Hello World!\")\n//-->\n\
  </script>\n</body>\n</html>\n```\n\n这段代码将产生以下结果 −\n\nHello World!\n\n## 空格与换行\n\n\
  JavaScript 会忽略出现在 JavaScript 程序中的空格、制表符和换行符。你可以在程序中自由使用空格、制表符和换行符，并自由以整洁一致的方式格式化和缩进你的程序，使代码易于阅读和理解。\n\
  \n## 分号可选\n\nJavaScript 中的简单语句通常跟着一个分号字符，就像在 C、C++ 和 Java 中一样。然而，如果你的每个语句都单独成行，JavaScript\
  \ 允许你省略此分号。例如，以下代码可以在不写分号的情况下编写。\n\n```html\n<script  language  =  \"javascript\"\
  \  type  =  \"text/javascript\">\n<!--\nvar1 =  10\nvar2 =  20\n//-->\n</script>\n\
  ```\n\n但当如下格式化为单行时，你必须使用分号 −\n\n```html\n<script  language  =  \"javascript\"  type\
  \  =  \"text/javascript\">\n<!--\nvar1 =  10; var2 =  20;\n//-->\n</script>\n```\n\
  \n**注意** − 使用分号是一个良好的编程习惯。\n\n## 大写敏感\n\nJavaScript 是一种大小写敏感的语言。这意味着语言关键字、变量、函数名和任何其他标识符必须始终使用一致的大小写进行输入。\n\
  \n因此，标识符 `Time` 和 `TIME` 在 JavaScript 中具有不同的含义。\n\n**注意** − 在 JavaScript 中编写变量和函数名时应小心。\n\
  \n## JavaScript 中的注释\n\nJavaScript 同时支持 C 风格和 C++ 风格的注释，因此 −\n\n-   `//` 和行尾之间的任何文本都被视为注释，并被\
  \ JavaScript 忽略。\n-   字符 `/*` 和 `*/` 之间的任何文本都被视为注释。这可以跨多行。\n-   JavaScript 还能识别\
  \ HTML 注释开启序列 `<!--`。JavaScript 将其视为单行注释，就像处理 `//` 注释一样。\n-   HTML 注释结束序列 `-->`\
  \ 不被 JavaScript 识别，因此应写为 `-->`。\n\n### 示例\n\n下面的示例了如何在 JavaScript 中使用注释。\n\n```html\n\
  <script  language  =  \"javascript\"  type  =  \"text/javascript\">\n<!--\n// 这是一个注释。它类似于\
  \ C++ 中的注释\n/*\n* 这是 JavaScript 中的多行注释\n* 它与 C 语言中的注释非常相似\n*/\n//-->\n</script>\n\
  ```\n\n# 在浏览器中启用 JavaScript\n\n所有现代浏览器都内置了对 JavaScript 的支持。经常，你可能需要手动启用或禁用此支持。本章解释了在你的浏览器中\
  \ Internet Explorer、Firefox、Chrome 和 Opera 中启用和禁用 JavaScript 支持的步骤。\n\n## Internet\
  \ Explorer 中的 JavaScript\n\n是在 Internet Explorer 中开启或关闭 JavaScript 的简单步骤 −\n\n-\
  \   从菜单中跟随 **Tools（工具）→ Internet Options（Internet 选项）**。\n-   在对话框中选择 **Security（安全）**\
  \ 标签。\n-   点击 **Custom Level（自定义级别）** 按钮。\n-   向下滚动找到 **Scripting（脚本）** 选项。\n- \
  \  在 **Active scripting（活动脚本）** 下选择 *Enable* 单选按钮。\n-   最后点击 OK 并退出。\n\n要在 Internet\
  \ Explorer 中禁用 JavaScript 支持，需要在 **Active scripting（活动脚本）** 下选择 **Disable（禁用）**\
  \ 单选按钮。\n\n## Firefox 中的 JavaScript\n\n是在 Firefox 中开启或关闭 JavaScript 的步骤 −\n\n- \
  \  打开新标签页 → 在地址栏中输入 `about: config`。\n-   你将看到警告对话框。选择 **I’ll be careful, I promise!（我会小心的，我保证！）**。\n\
  -   你将在浏览器中找到 **configure options（配置选项）** 列表。\n-   在搜索栏中输入 `javascript.enabled`。\n\
  -   在那里你可以通过右键点击该选项的值 → **select toggle（选择切换）** 来启用或禁用 JavaScript。\n\n如果 `javascript.enabled`\
  \ 为 true；点击 **toggle** 后它将变为 false。如果 JavaScript 被禁用；点击切换 后它将启用。\n\n## Chrome 中的\
  \ JavaScript\n\n是在 Chrome 中开启或关闭 JavaScript 的步骤 −\n\n-   点击浏览器右上角的 Chrome 菜单。\n\
  -   选择 **Settings（设置）**。\n-   点击 **Show advanced settings（显示高级设置）**。\n-   页面底部的\
  \ Script。\n-   在 **Privacy（隐私）** 部分，点击 **Content（内容）**。\n-   在 \"Javascript\" 部分，选择\
  \ \"Do not allow any site to run（不允许任何网站运行）\" 或 \"Allow all sites to run（允许所有网站运行）\"\
  。\n\n## Opera 中的 JavaScript\n\n是在 Opera 中开启或关闭 JavaScript 的步骤 −\n\n-   跟随 **Tools（工具）→\
  \ Preferences（首选项）**。\n-   在对话框中选择 **Advanced（高级）** 标签。\n-   点击 **Content（内容）**\
  \ 按钮。\n-   向下滚动找到 **Scripting（脚本）** 选项。\n-   在 **Active scripting** 下选择 *Enable*\
  \ 单选按钮。\n-   最后点击 OK 并退出。\n\n要在你的 Opera 中禁用 JavaScript 支持，你不应该勾选 **Enable JavaScript\
  \ checkbox**。\n\n如果你需要使用 JavaScript 执行某些操作，可以使用 `<noscript>` 标签向用户显示警告消息。\n\n你可以紧接脚本添加\
  \ `<noscript>` 块，如下 −\n\n```html\n<html>\n<body>\n<script language = \"javascript\"\
  \ type = \"text/javascript\">\n<!--\ndocument.write(\"Hello World!\")\n//-->\n</script>\n\
  <noscript>\nSorry...需要 JavaScript\n</noscript>\n</body>\n</html>\n```\n\n现在，如果用户的浏览器不支持\
  \ JavaScript 或 JavaScript 未启用，`<noscript>` 中的消息将显示在屏幕上。\n\n# 在 HTML 文件中的放置\n\n在\
  \ HTML 文档的任何位置都提供了包含 JavaScript 的灵活性。然而，在 HTML 文件中包含 JavaScript 的常用方式如下\n\n-   `<head>...</head>`\
  \ 部分。\n-   `<body>.../</body>` 部分。\n-   `<body>...</</body>>` 和 `<head>...</head>`\
  \ 部分。\n-   外部文件并在 `<head>...</head>` 部分中包含。\n\n在接下来的部分，我们将查看如何以不同的方式在 HTML 文件中放置\
  \ JavaScript。\n\n## `<head>.../head>` 部分\n\n如果你希望在某些事件运行时脚本（例如当用户点击某处时），你将把脚本放在\
  \ head 中：\n\n```html\n<html>\n<head>\n<script type = \"text/javascript\">\n<!--\n\
  function sayHello() {\nalert(\"Hello World\")\n}\n//-->\n</script>\n</head>\n<body>\n\
  <input type=\"button\" onclick=\"sayHello()\" value=\"Say Hello\" />\n</body>\n\
  </html>\n```\n\n## `<body>.../</body>` 部分\n\n如果你需要在页面加载时运行脚本，以便在页面中生成内容，那么脚本位于文档的\
  \ `<body>` 部分。在这种情况下，你将使用 JavaScript 定义任何函数。请看以下代码。\n\n```html\n<html>\n<head>\n\
  </head>\n<body>\n<script type = \"text/javascript\">\n<!--\ndocument.write(\"Hello\
  \ World\")\n//-->\n</script>\n<p>This is web page body </p>\n</body>\n</html>\n\
  ```\n\n\n\n\n你可以将 JavaScript 代码分别存放在 `<head>` 和 `<body>` 部分，如下所示 −\n\n```html\n\
  <<html>\n<head>\n<script type=\"text/javascript\">\n<!--\nfunction sayHello() {\n\
  \  alert(\"Hello World\")\n}\n//-->\n</script>\n</head>\n<body>\n<script type=\"\
  text/javascript\">\n<!--\ndocument.write(\"Hello World\")\n//-->\n</script>\n<input\
  \ type=\"button\" onclick=\"sayHello()\" value=\"Say Hello\" />\n</body>\n</html>\n\
  ```\n\n这段代码将产生以下结果 −\n\n### # 外部文件中的 JavaScript\n\n当你开始更广泛地使用 JavaScript 时，你很可能会会发现，在某些情况下，你需要在网站的多个页面上复用相同的\
  \ JavaScript 代码。\n\n你并不受限于在多个 HTML 文件中维护相同的代码。`script` 标签提供了一种机制，允许你将 JavaScript\
  \ 存储在外部文件中，然后将其包含在 HTML 文件中。\n\n以下示例展示了如何使用 `script` 标签及其 `src` 属性在 HTML 代码中包含外部\
  \ JavaScript 文件。\n\n```html\n<html\n<head>\n<script type=\"text/javascript\" src=\"\
  filename.js\"></script>\n</head>\n<body>\n.......\n</body>\n</html>\n```\n\n要使用来自外部文件源的\
  \ JavaScript，你需要将所有的 JavaScript 源代码写入扩展名为为 `.js` 的简单文本文件中，然后如上所示包含该文件。\n\n例如，你可以在\
  \ `filename.js` 文件中保留以下内容，之后在包含 `filename.js` 文件后，你就可以在 HTML 文件中使用 `sayHello` 函数了。\n\
  \n```javascript\nfunction sayHello() {\n  alert(\"Hello World\")\n}\n```\n\n###\
  \ # 变量\n\n#### ## JavaScript 数据类型\n\n编程语言最基本的特征之一是它支持的数据类型集合。这些是在编程语言中可以表示和操作的值类型。\n\
  \nJavaScript 允许你处理三种原始数据类型 −\n\n* `Numbers`（数字），例如 123, 120.50 等。\n* `Strings`（字符串），例如\
  \ \"This text string\" 等。\n* `Boolean`（布尔值），例如 true 或 false。\n\nJavaScript 还定义了两个特殊数据类型：`null`\
  \ 和 `undefined`，每个类型只定义了一个值。除了这些原始数据类型外，JavaScript 还支持一种名为 `object` 的复合数据类型。我们将在单独的章节详细介绍对象。\n\
  \n**注意** − JavaScript 不区分整数值和浮点值。JavaScript 中的所有数字都表示为浮点值。JavaScript 使用 IEEE 754\
  \ 标准定义的 64 位浮点格式表示数字。\n\n#### ## JavaScript 变量\n\n与许多其他编程语言一样，JavaScript 也拥有变量。变量可以被视为命名的容器。你可以将数据放入这些容器中，然后通过命名容器来引用这些数据。\n\
  \n在 JavaScript 程序中使用变量之前，必须先声明它。使用 `var` 关键字声明变量如下：\n\n```javascript\n<script type=\"\
  text/javascript\">\n<!--\nvar money;\nvar name;\n//-->\n</script>\n```\n\n你也可以如下使用相同的\
  \ `var` 关键字声明多个变量 −\n\n```javascript\n<script type=\"text/javascript\">\n<!--\n\
  var money, name;\n//-->\n</script>\n```\n\n在变量中存储值被称为 `变量初始化`。你可以在创建变量时进行初始化，也可以在之后需要该变量的某时刻进行。\n\
  \n例如，你可能会创建一个名为 `money` 的变量，稍后给它赋值 2000.50。\n\n```javascript\n<script type=\"text/javascript\"\
  >\n<!--\nvar name = \"Ali\";\nvar money;\nmoney = 2000.50;\n//-->\n</script>\n```\n\
  \n**注意** − `var` 关键字仅用于声明或初始化，在文档的变量名生命周期内使用一次。你不应该重复声明同一个变量。\n\nJavaScript 是一种\
  \ `无类型` 语言。这意味着 JavaScript 变量可以持有任何数据类型的值。与许多其他语言不同，你不需要在变量变量时告诉 JavaScript 变量将持有什么类型的值。变量类型可以在程序执行过程中更改，JavaScript\
  \ 会自动处理。\n\n#### ## JavaScript 变量作用域\n\n变量的作用域是其定义的程序区域。JavaScript 变量只有两种作用域。\n\n\
  * `Global Variables`（全局变量） − 全局变量具有全局作用域，意味着可以在 JavaScript 代码的任何地方定义。\n* `Local\
  \ Variables`（局部变量） − 局部变量在其定义的函数内部可见。函数参数始终是该函数的局部变量。\n\n在函数体内，局部变量的优先级高于同名的全局变量。如果你声明了一个与全局变量同名的局部变量或函数参数，你实际上隐藏了该全局变量。请看以下示例。\n\
  \n```html\n<body onload=checkscope();>\n<script type=\"text/javascript\">\n<!--\n\
  var myVar = \"global\";\nfunction checkscope() {\n  document.write(myVar);\n}\n\
  //-->\n</script>\n</body>\n</html>\n```\n\n### # 变量名\n\n在 JavaScript 中为变量命名时，请记住以下规则：\n\
  \n* JavaScript 名称不应以数字（0-9）开头。它们必须以字母或下划线开头。\n* JavaScript 名称对大小写敏感。\n\n### # 关键字\n\
  \n所有保留字列表如下所示。\n\n| abstract | else | instanceof | switch |\n| boolean | enum |\
  \ int | synchronized |\n| break | export | interface | this |\n| byte | extends\
  \ | long | throw |\n| case | false | native | transient |\n| char | finally | new\
  \ | true |\n| class | float | package | try |\n| const | for | private | typeof\
  \ |\n| continue | function | protected | var |\n| debugger | goto | public | void\
  \ |\n| default | if | return | volatile |\n| delete | implements | short | while\
  \ |\n| do | import | static | with |\n| double | in | super | |\n\n这些词不能作为变量名。\n\
  \n### # 运算符\n\n#### ## 什么是运算符？\n\n让我们来看简单的表达式 `4 + 5 等于 9`。这里 4 和 5 被`操作数`，而 `+`\
  \ 是`运算符`。JavaScript 支持以下类型的运算符。\n\n* 算术运算符\n* 比较运算符\n* 逻辑（或关系）运算符\n* 赋值运算符\n* 条件（或三元）运算符\n\
  \n让我们逐个查看所有运算符。\n\n#### ## 算术运算符\n\nJavaScript 支持以下算术运算符 −\n\n假设变量 `A` 值为 10，变量\
  \ `B` 值为 20，则 −\n\n| 序号 | 运算符 & 描述 |\n| :--- | :--- |\n| 1 | `+` (加法) 相加两个操作数 **例如**：`A\
  \ + B` 得到 30 |\n| 2 | `-` (减法) 从第一个操作数中减去第二个操作数 **例如**：`A - B` 得到 -10 |\n| 3 | `*`\
  \ (乘法) 乘积两个操作数 **例如**：`A * B` 得到 200 |\n| 4 | `/` (除法) 被除数除以除数 **例如**：`B / A` 得到\
  \ 2 |\n| 5 | `%` (取模) 输出整数除法的余数 **例如**：`B % A` 得到 0 |\n| 6 | `++` (自增) 将整数值加一 **例如**：`A++`\
  \ 得到 11 |\n| 7 | `--` (自减) 将整数值减一 **例如**：`A--` 得到 9 |\n\n**注意** − 加法运算符 (+) 既适用于数值，也适用于字符串。例如\
  \ `\"a\" + 10` 将得到 `\"a10\"`。\n\n\n\n\n以下代码展示了如何在 JavaScript 中使用算术运算符。\n\n```html\n\
  <html>\n<body>\n<script type  =  \"text/javascript\">\n<!--\nvar a =  33;\nvar b\
  \ =  10;\nvar c =  \"Test\";\nvar linebreak =  \"<br />\";\ndocument.write(\"a +\
  \ b = \");\nresult = a + b;\ndocument.write(result);\ndocument.write(linebreak);\n\
  document.write(\"a - b = \");\nresult = a - b;\ndocument.write(result);\ndocument.write(linebreak);\n\
  document.write(\"a / b = \");\nresult = a / b;\ndocument.write(result);\ndocument.write(linebreak);\n\
  document.write(\"a % b = \");\nresult = a % b;\ndocument.write(result);\ndocument.write(linebreak);\n\
  document.write(\"a + b + c = \");\nresult = a + b + c;\ndocument.write(result);\n\
  document.write(linebreak);\na =  ++a;\ndocument.write(\"++a = \");\nresult =  ++a;\n\
  document.write(result);\ndocument.write(linebreak);\nb =  --b;\ndocument.write(\"\
  --b = \");\nresult =  --b;\ndocument.write(result);\ndocument.write(linebreak);\n\
  //-->\n</script>\n将变量设置为不同的值然后尝试...\n</body>\n</html>\n```\n\n### 输出\n\na + b =\
  \ 43\n\na - b = 23\n\na / b = 3.3\n\na % b = 3\n\na + b + c = 43Test\n\n++a = 35\n\
  \n--b = 8\n\n将变量设置为不同的值然后尝试...\n\n### 比较运算符\n\nJavaScript 支持以下比较运算符 −\n\n假设变量 `A`\
  \ 存储值为 10，变量 `B` 存储值为 20，则 −\n\n\n\n| 序号 | 运算符与描述 |\n| :--- | :--- |\n| 1 | `==`\
  \ (等于)检查两个操作数的值是否相等，如果相等，则条件为真。例：`(A == B)` 不为真。 |\n| 2 | `!=` (不等于)检查两个操作数的值是否相等，如果值不相等，则条件为真。例：`(A\
  \ != B)` 为真。 |\n| 3 | `>` (大于)检查左侧操作数的值是否大于右侧操作数的值，如果是，则条件为真。例：`(A > B)` 不为真。 |\n\
  | 4 | `<` (小于)检查左侧操作数的值是否小于右侧操作数的值，如果是，则条件为真。例：`(A < B)` 为真。 |\n| 5 | `>=` (大于等于)检查左侧操作数的值是否大于或等于右侧操作数的值，如果是，则条件为真。例：`(A\
  \ >= B)` 不为真。 |\n| 6 | `<=` (小于等于)检查左侧操作数的值是否小于或等于右侧操作数的值，如果是，则条件为真。例：`(A <= B)`\
  \ 为真。 |\n\n### 示例\n\n以下代码展示了如何在 JavaScript 中使用比较运算符。\n\n```html\n<html>\n<body>\n\
  <script type  =  \"text/javascript\">\n<!--\nvar a =  10;\nvar b =  20;\nvar linebreak\
  \ =  \"<br />\";\ndocument.write(\"(a == b) => \");\nresult =  (a == b);\ndocument.write(result);\n\
  document.write(linebreak);\ndocument.write(\"(a < b) => \");\nresult =  (a < b);\n\
  document.write(result);\ndocument.write(linebreak);\ndocument.write(\"(a > b) =>\
  \ \");\nresult =  (a > b);\ndocument.write(result);\ndocument.write(linebreak);\n\
  document.write(\"(a != b) => \");\nresult =  (a != b);\ndocument.write(result);\n\
  document.write(linebreak);\ndocument.write(\"(a >= b) => \");\nresult =  (a >= b);\n\
  document.write(result);\ndocument.write(linebreak);\ndocument.write(\"(a <= b) =>\
  \ \");\nresult =  (a <= b);\ndocument.write(result);\ndocument.write(linebreak);\n\
  //-->\n</script>\n将变量设置为不同的值和不同的运算符然后尝试...\n</body>\n</html>\n```\n\n### 输出\n\n\
  (a == b) => false\n\n(a < b) => true\n\n(a > b) => false\n\n(a != b) => true\n\n\
  (a >= b) => false\n\na <= b) => true\n\n将变量设置为不同的值和不同的运算符然后尝试...\n\n### 逻辑运算符\n\n\
  JavaScript 支持以下逻辑运算符 −\n\n假设变量 `A` 存储值为 10，变量 `B` 存储值为 20，则 −\n\n | 序号 | 运算符与描述\
  \ |\n| :--- | :--- |\n| 1 | `&&` (逻辑与)如果两个操作数均非零，则条件为真。例：`(A && B)` 为真。 |\n| 2 |\
  \ `||` (逻辑或)如果两个操作数中任意一个非零，则条件为真。例：`(A || B)` 为真。 |\n| 3 | `!` (逻辑非)反转操作数的逻辑状态。例：`A`\
  \ 为假。 |\n\n### 示例\n\n尝试通过以下代码在 JavaScript 中实现逻辑运算符。\n\n```html\n<html>\n<body>\n\
  <script type  =  \"text/javascript\">\n<!--\nvar a =  10;\nvar b =  20;\nvar linebreak\
  \ =  \"<br />\";\ndocument.write(\"(a == b) => \");\nresult =  (a ==\n);\ndocument.write(\n\
  );\ndocument.write(\n);\nwrite.write <a < b)\n\n\nresult =  (a < b);\ndocument.write(result);\n\
  document.write(\n);\ndocument.write\na\n b)\n\n\nresult =  (a\n b);\ndocument.write(result);\n\
  document.write(\n\n\ndocument.write.a != b) => \");\nresult =  (a != b);\ndocument.write(result);\n\
  document.write(linebreak);\ndocument.write.a >= b) => \");\nresult =  (a >= b);\n\
  document.write(result);\ndocument.write(linebreak);\ndocument.write.a <= b) => \"\
  );\nresult =  (a <= b);\ndocument.write(result);\ndocument.write(linebreak);\n//-->\n\
  </script>\n将变量设置为不同的值然后尝试...\n</body>\n</html>\n```\n\n### 输出\n\n(a == b) => false\n\
  \n(a < b) => true\n\n(a > b) => false\n\n(a != b) => true\n\n(a >= b) => false\n\
  \na <= b) => true\n\n将变量设置为不同的值然后尝试...\n\n### 位 运算符\n\nJavaScript 支持以下位 运算符 −\n\n\
  假设变量 `A` 存储值为 2，变量 `B` 存储值为 3，则 −\n\n | 序号 | 运算符与描述 |\n| :--- | :--- |\n| 1 | `&`\
  \ (位与)对两个操作数的位进行与运算。例：`(A & B)` 为 2。 |\n| 2 | `|` (位或)对两个操作数的位进行或运算。例：`(A | B)`\
  \ 为 3。 |\n| 3 | `^` (位异或)对两个操作数的位进行异或运算。即两个操作数中仅有一个为真时结果为真。例：`(A ^ B)` 为 1。 |\n\
  | 4 | `~` (位取反)反转操作数的位。例：`(~B)` 为 -4。 |\n| 5 | `<<` (左移)将第一个操作数的位向左移动第二个操作数指定的位数。新填充的位补零。例：`(A\
  \ << 1)` 为 4。 |\n| 6 | `>>` (右移)将第一个操作数的位向右移动第二个操作数指定的位数。例：`(A >> 1)` 为 1。 |\n|\
  \ 7 | `>>>` (无右移)该运算符与 `>>` 类似，但左侧填充的位始终为零。例：`(A >>> 1)` 为 1。 |\n\n### 示例\n\n尝试以下代码在\
  \ JavaScript 中实现位 运算符。\n\n```html\n<html>\n<body>\n<script type  =  \"text/javascript\"\
  >\n<!--\nvar a =  2; // 二进制 10\nvar b =  3; // 二进制 11\nvar linebreak =  \"<br />\"\
  ;\ndocument.write(\"(a & b) => \");\nresult =  (a & b);\ndocument.write(result);\n\
  document.write(linebreak);\ndocument.write(\"(a | b) => \");\nresult =  (a | b);\n\
  document.write(result);\ndocument.write(linebreak);\ndocument.write(\"(a ^ b) =>\
  \ \");\nresult =  (a ^ b);\ndocument.write(result);\ndocument.write(linebreak);\n\
  document.write(\"(~b) => \");\nresult =  (~b);\ndocument.write(result);\ndocument.write(linebreak);\n\
  document.write(\"(a << b) => \");\nresult =  (a << b);\ndocument.write(result);\n\
  document.write(linebreak);\ndocument.write(\"(a >> b) => \");\nresult =  (a >> b);\n\
  document.write(result);\ndocument.write(linebreak);\n//-->\n</script>\n<p>将变量设置为不同的值和不同的运算符然后尝试...</p>\n\
  </body>\n</html>\n```\n\n### 输出\n\n(a & b) => 2\n\n(a | b) => 3\n\n(a ^ b) => 1\n\
  \n(~b) => -4\n\n(a << b) => 16\n\n(a >> b) => 0\n\n### 赋值运算符\n\nJavaScript 支持以下赋值运算符\
  \ −\n\n | 序号 | 运算符与描述 |\n| :--- | :--- |\n| 1 | `=` (简单赋值 )将右侧操作数的值赋给左侧操作数。例：`C\
  \ = A + B` 将 A + B 的值赋给 `C` |\n\n]\n\n\n\n| No | Operator | Description |\n| :---\
  \ | :--- | :--- |\n| 2 | `+=` | (加赋值) 将右操作数加到左操作数，并将结果赋值给左操作数。**例：** `C += A` 等于\
  \ `C = C + A` |\n| 3 | `-=` | (减赋值) 从左操作数中减去右操作数，并将结果赋值给左操作数。**例：** `C -= A` 等于\
  \ `C = C - A` |\n| 4 | `*=` | (乘赋值) 将右操作数与左操作数相乘并将结果赋值给左操作数。**例：** `C *= A` 等于 `C\
  \ = C * A` |\n| 5 | `/=` | (除赋值) 将左操作数除以右操作数，并将结果赋值给左操作数。**例：** `C /= A` 等于 `C =\
  \ C / A` |\n| 6 | `%=` | (取模赋值) 使用两个操作数取模并将结果赋值给左操作数。**例：** `C %= A` 等于 `C = C %\
  \ A` |\n\n**注意** — 相同的逻辑也适用于位运算符，因此它们将变为 `<<=`、`>>=`、`>>=`、`&=`、`|=` 和 `^=`。 |\n\
  \n### 示例\n\n尝试运行以下代码在 JavaScript 中实现赋值运算符。\n\n```html\n<html>\n<body>\n<script type=\"\
  text/javascript\">\n<!--\nvar a = 33;\nvar b = 10;\nvar linebreak = \"<br />\";\n\
  document.write(\"Value of a => (a = b) => \");\nresult = (a = b);\ndocument.write(result);\n\
  document.write(linebreak);\ndocument.write(\"Value of a => (a += b) => \");\nresult\
