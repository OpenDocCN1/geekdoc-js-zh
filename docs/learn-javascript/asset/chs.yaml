  \n<embed id=\"demo\" name=\"demo\" src=\"http://www.amrood.com/games/kumite.swf\"\
  \ width=\"318\" height=\"300\" play=\"false\" loop=\"false\" pluginspage=\"http://www.macromedia.com/go/getflashplayer\"\
  \ swliveconnect=\"true\">\n<form name=\"form\" id=\"form\" action=\"#\" method=\"\
  get\">\n<input type=\"button\" value=\"Start\" onclick=\"play();\" />\n<input type=\"\
  button\" value=\"Stop\" onclick=\"stop();\" />\n<input type=\"button\" value=\"\
  Rewind\" onclick=\"rewind(); /> own</form>\n\n</body>\n\n</html>\n\n如果你正在使用 Mozilla、Firefox\
  \ 或 Netscape，那么\n\n# 调试\n\n开发者在编写代码时偶尔会犯错。程序或脚本中的错误被称为 `bug`。\n\n查找和修复 bug 的过程被称为\
  \ `debugging`（调试），它是开发过程的正常部分。本节涵盖了可以帮助你调试任务的工具和技术。\n\n## IE 中的错误消息\n\n追踪错误的最基本方法是在你的浏览器中开启错误信息。默认情况下，当页面发生错误时，Internet\
  \ Explorer 会状态栏中显示错误图标。\n\n![Image](img/image00225.gif)\n\n双击此图标将带你进入一个对话框，显示有关发生特定错误的信息。\n\
  \n由于此图标很容易被忽略，Internet Explorer 为你提供了选项，可以在每次发生错误时自动显示错误对话框。\n\n要启用此选项，选择 `Tools\
  \ → Internet Options → Advanced tab.`，然后最后勾选如下所示的 `\"Display a Notification About\
  \ Every Script Error\"` 复框选项 −\n\n![Image](img/image00226.gif)\n\n## Firefox 或 Mozilla\
  \ 中的错误消息\n\n其他浏览器如 Firefox、Netscape 和 Mozilla 将错误消息发送到名为 `JavaScript Console` 或\
  \ `Error Consol` 的特殊窗口。要查看控制台，选择 `Tools → Error Consol or Web Development`。\n\n\
  遗憾的是，由于这些浏览器在发生错误时没有视觉指示，你必须保持控制台打开，并在脚本执行时留意错误。\n\n![Image](img/image00227.gif)\n\
  \n## 错误通知\n\n显示在控制台或通过 Internet Explorer 对话框出现的错误通知是语法错误和运行时错误共同的结果。这些错误通知包含了发生错误的行号。\n\
  \n如果你正在使用 Firefox，可以点击错误控制台中提供的错误，跳转到脚本中出现错误的准确行。\n\n## 如何调试脚本\n\n有多种方法可以调试你的 JavaScript\
  \ −\n\n### 使用 JavaScript 验证器\n\n检查 JavaScript 代码中是否存在奇怪 bug 的一种方法是运行一个程序来对其进行检查，以确保它是有效的并遵循语言的官方语法规则。这些程序被称为\
  \ `validating parsers`（验证解析器）或简称为 `validators`（验证器），通常随商业 HTML 和 JavaScript 编辑器一起。\n\
  \nJavaScript 最方便的验证器是 Douglas Crockford 的 JavaScript Lint，它可以在 `Douglas Crockford's\
  \ JavaScript Lint` 免费获取。\n\n只需访问该网页，将你的 JavaScript（仅 JavaScript）代码粘贴到提供的文本区域，并点击\
  \ jslint 按钮。此程序将解析你的 JavaScript 代码，确保所有的变量和函数定义遵循正确的语法。它还会检查 JavaScript 语句（如 `if`\
  \ 和 `while`），以确保它们也遵循正确的格式。\n\n### 在程序中添加调试代码\n\n你可以使用程序中的 `alert()` 或 `document.write()`\
  \ 方法来调试代码。例如，你可能会编写如下内容 −\n\n```javascript\nvar debugging = true;\nvar whichImage\
  \ = \"widget\";\nif( debugging )\n  alert( \"Calls swapImage() with argument: \"\
  \ + whichImage );\nvar swapStatus = swapImage( whichImage );\nif( debugging )\n\
  \  alert( \"Exits swapImage() with swapStatus=\" + swapStatus );\n```\n\n通过检查 `alert()`\
  \ 出现的内容和顺序，你可以非常容易地检查程序的健康状况。\n\n### 使用 JavaScript 调试器\n\n调试器是一种将脚本执行的所有各个方面置于程序员控制下的应用程序。调试器通过一个允许你检查和设置值以及控制执行流的界面，对脚本的状态提供细粒度的控制。\n\
  \n一旦脚本加载到调试器中，就可以逐行运行或被指令为停止运行。\n\n最新版本的调试器（名为 Venkman）可以在 `http://www.hacks.com/~ginda`\
  \ 下载。\n\n## 给开发者的实用提示\n\n你可以记住以下提示以减少错误的数量\n\n- 使用大量的 `comments`（注释）。注释允许你解释为什么你这样写脚本，并解释复杂的章节。\n\
  - 始终使用 `indentation`（缩进）来使你的代码易于阅读。缩进也更容易匹配开始和结束标签、大括号。\n- 编写 `modular code`（模块化代码）。尽可能将你的语句分组为函数。函数让你能够以最小的精力测试和重用代码部分。\n\
  - 在命名变量时保持一致。尝试使用足够长且描述函数目的的名称。 统一使用全小写或全大写；如果你使用驼峰命名法，就使用它。以模块化的方式测试长脚本。不要尝试编写整个脚本。写一部分并让其工作，再添加下一部分。\n\
  - 使用 `描述性的变量和函数名`，避免使用单字符名称。\n- 注意你的引号。记住引号用于成对字符串，且两个引号必须类型相同（单引号或双引号）。\n- 注意你的等号。你不应该用单符号进行比较。\n\
  - 使用 `var` 关键字显式声明变量。\n\n# 图片映射\n\n你可以使用 JavaScript 创建客户端。客户端图片映射通过 `<img>` 标签的\
  \ `usemap` 启用，并由特殊的 `<map>` 和 `<area>` 扩展标签定义。\n\n形成映射的图像像往常一样使用 <img> 元素插入页面，只是它携带了一个名为\
  \ `usemap` 的额外属性。`usemap` 属性的值是 `<map>` 元素的 `name` 属性的值，前面带一个井号或 # 号。\n\n\n\n\n\
  以下代码结合了图像映射（imagemaps）和 JavaScript，当鼠标移动在图像的不同部分时，会在文本框中生成消息。\n\n```html\n<html>\n\
  <head>\n<title>Using JavaScript Image Map</title>\n<script  type  =  \"text/javascript\"\
  >\n<!--\nfunction showTutorial(name)  {\ndocument.myform.stage.value = name\n}\n\
  //-->\n</script>\n</head>\n<body>\n<form  name  =  \"myform\">\n<input  type  =\
  \  \"text\"  name  =  \"stage\"  size  =  \"20\"  />\n</form>\n<!-- Create Mappings\
  \ -->\n<img  src  =  \"/images/usemap.gif\"  alt  =  \"HTML Map\"  border  =  \"\
  0\"  usemap  =  \"#tutorials\"/>\n<map  name  =  \"tutorials\">\n<area  shape=\"\
  poly\" coords  =  \"74,0,113,29,98,72,52,72,38,27\" href  =  \"/perl/index.htm\"\
  \  alt  =  \"Perl Tutorial\" target  =  \"_self\" onMouseOver  =  \"showTutorial('perl')\"\
  \ onMouseOut  =  \"showTutorial('')\"/>\n<area  shape  =  \"rect\" coords  =  \"\
  22,83,126,125\" href  =  \"/html/index.htm\"  alt  =  \"HTML Tutorial\" target \
  \ =  \"_self\" onMouseOver  =  \"showTutorial('html')\" onMouseOut  =  \"showTutorial('')\"\
  />\n<area  shape  =  \"circle\" coords  =  \"73,168,32\" href  =  \"/php/index.htm\"\
  \  alt  =  \"PHP Tutorial\" target  =  \"_self\" onMouseOver  =  \"showTutorial('php')\"\
  \ onMouseOut  =  \"showTutorial('')\"/>\n</map>\n</body>\n</html>\n```\n\n### 输出\n\
  \n你可以通过将鼠标光标放置在图像对象上来体验映射的概念。\n\n# 浏览器兼容性\n\n了解不同浏览器之间的差异对于以预期的方式处理它们非常重要。因此，知道你的网页运行在哪个浏览器中至关重要。\n\
  \n要获取有关网页当前运行的浏览器的信息，请使用内置的 `navigator` 对象。\n\n## Navigator 属性\n\n有几个可以在 Web 页面使用的\
  \ `Navigator` 相关属性。以下是每个属性的名称和描述列表。\n\n| 序号 | 属性与描述 |\n| :--- | :--- |\n| 1 | `appCodeName`\
  \ 该属性是一个字符串，包含了浏览器的代码名，Netscape 对应 Netscape，Microsoft Internet Explorer 对应 Internet\
  \ Explorer。 |\n| 2 | `appVersion` 该属性是一个字符串，包含了浏览器的版本以及其他有用信息，如语言和兼容性。 |\n| 3 |\
  \ `language` 该属性包含浏览器使用的语言的两个字母缩写。仅限 Netscape。 |\n| 4 | `mimTypes[]` 该属性是一个数组，包含了客户端支持的所有\
  \ MIME 类型。仅限 Netscape。 |\n| 5 | `platform[]` 该属性是一个字符串，包含了浏览器编译的平台。32 位操作系统为 \"\
  Win32\"。 |\n| 6 | `plugins[]` 该属性是一个数组，包含了安装在客户端上的所有插件。仅限 Netscape。 |\n| 7 | `userAgent`\
  \ 该属性是一个字符串，包含了浏览器的代码名和版本。此值发送到源服务器以识别客户端。 |\n\n## Navigator 方法\n\n有几个特定的 `Navigator`\
  \ 方法。以下是它们的名称列表。\n\n| 序号 | 描述 |\n| :--- | :--- |\n| 1 | `javaEnabled()` 该方法判断客户端是否启用了\
  \ JavaScript。如果启用了 JavaScript，该方法返回 true；否则返回 false。 |\n| 2 | `plugins.refresh`\
  \ 该方法使新安装的插件可用，并用新的插件名称填充 `plugins` 数组。仅限 Netscape。 |\n| 3 | `preference(name,value)`\
  \ 该方法允许签名的脚本获取并设置某些 Netscape 偏好。如果省略第二个参数，该方法将返回指定偏好的值；否则它将设置该值。仅限 Netscape。 |\n\
  | 4 | `taintEnabled()` 如果启用了数据污染，则该方法返回 true；否则返回 false。 |\n\n## 浏览器检测\n\n有一个简单的\
  \ JavaScript 可以用于查找浏览器名称，然后根据此为用户提供相应的 HTML 页面。\n\n```html\n<html>\n<head>\n<title>Browser\
  \ Detection Example</title>\n</head>\n<body>\n<script  type  =  \"text/javascript\"\
  >\n<!--\nvar userAgent = navigator.userAgent;\nvar opera =  (userAgent.indexOf('Opera')\
  \  !=  -1);\nvar ie =  (userAgent.indexOf('MSIE')  !=  -1);\nvar gecko =  (userAgent.indexOf('Gecko')\
  \  !=  -1);\nvar netscape =  (userAgent.indexOf('Mozilla')  !=  -1);\nvar version\
  \ = navigator.appVersion;\n\nif  (opera)  {\ndocument.write(\"Opera based browser\"\
  );\n// 在此处保留你的 Opera 特有的 URL。\n}  else  if(gecko)  {\ndocument.write(\"Mozilla based\
  \ browser\");\n// 在此处保留你的 gecko 特有的 URL。\n}  else  if(ie)  {\ndocument.write(\"\
  IE based browser\");\n// 在此处保留你的 IE 特有的 URL。\n}  else  if(netscape)  {\ndocument.write(\"\
  Netscape based browser\");\n// 在此处保留你的 Netscape 特有的 URL。\n}  else  {\ndocument.write(\"\
  Unknown browser\");\n}\n\n// 你可以在上述任何条件中同时包含版本信息。\ndocument.write(\"<br /> Browser\
  \ version info : \"  + version );\n//-->\n</script>\n</body>\n</html>\n```\n"
