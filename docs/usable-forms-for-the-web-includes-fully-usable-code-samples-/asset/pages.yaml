    \nForm Validation Techniques \n\nWe initialize a value (to return from the function)\
    \ to true. \n\nvar submitVal=true; \n\nTo find the required fields, we loop through\
    \ the form's elements collection. \n\nvar els=form.elements; \n\nfor(var i=0;i<els.length;i++)\
    \ \n\n{ \n\ncurrEl=els\\[i\\]; \n\nIf the current element belongs to the required\
    \ style class, that is, if its className attribute is \n\nrequired and its value\
    \ is an empty string, we alert the user, call the offending element's focus ()\
    \ \n\nmethod, set the return value to false and break out of the loop. (Otherwise,\
    \ we'll eventually exit the loop \n\nwithout changing the return value from true.)\
    \ Once the user dismisses the alert () dialog, focus is set \n\non the element\
    \ that's been left blank, and the element's background color will change to white,\
    \ providing \n\nthe user with an additional visual cue. Note that by giving the\
    \ form elements appropriate names, we can \n\nincorporate these into the error\
    \ message. \n\nif(currEl.className==\"required\" && currEl.value==\"\") \n\n{\
