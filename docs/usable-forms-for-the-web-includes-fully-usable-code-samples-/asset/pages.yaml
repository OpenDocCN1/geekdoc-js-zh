    \ ... alt=\"good\" />c/label> \n\nfor=\"ok\">okc/label>c/td> \n\nf or= \"weak\"\
    \ \\>cimg src=\" . ./images/blank, gif\" ... alt=\"weak\" />c/label> \n\nfor=\"\
    poor\">poorc/label>c/td> \n\ntype=\"radio\" \n\ntype=\"radio\" \n\ntype=\"radio\"\
    \ \n\ntype=\"radio\" \n\ntype=\"radio\" \n\nname=\"rating\" \n\nname=\"rating\"\
