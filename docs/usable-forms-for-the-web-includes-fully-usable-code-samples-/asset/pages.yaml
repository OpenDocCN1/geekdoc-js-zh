- img_proc: true
  md: "![](img/a10b466d6e11a32674cad146197d13d9_184_0.png)![](img/a10b466d6e11a32674cad146197d13d9_184_1.png)\n\
    \nUsing Forms \n\nwith PHP and MySQL \n\nIn addition, there are sites such as\
    \ http://www.phpclasses.org where you can obtain user-contributed \n\nclasses\
    \ that are being updated and added to (like everything else to do with PHP) on\
    \ a daily basis. \n\nFor more complete and detailed information, consult the PHP\
    \ Manual and other references we list at \n\nthe end of this book. In fact, if\
    \ you're at all serious about using PHP for web development, you owe it \n\nto\
    \ yourself to do so! \n\nMySQL \n\nLater in the chapter, we'll need a database\
    \ to store form data in. We'll be using another popular \n\nopen-source application,\
    \ MySQL, for this purpose. As with PHP, both the source code and \n\nexecutables\
    \ for MySQL are available for download without charge from the MySQL homepage\
    \ at \n\nhttp://www.mysql.com/, and there are versions compatible with the most\
    \ common platforms. Again, \n\nyou're free to view, study, use, and, if necessary,\
    \ modify the MySQL source code. \n\nThere are some features of larger, commercial\
    \ databases, such as Oracle or SQL Server, which \n\nMySQL doesn't support. These\
    \ include views and complete rollbacks. Stored procedures aren't yet \n\npart\
    \ of the standard release; support for these can be added in a separate module,\
    \ and they are \n\nexpected to be part of version 4, which is under development\
    \ at the time of writing. \n\nMySQL is optimized for size and speed, and (like\
    \ PHP) its demands on system resources are low. A \n\nMySQL database can contain\
    \ tens of thousands of tables and millions of records. A typical database \n\n\
    connection with Oracle uses about 4 Mb of system RAM, whereas a MySQL connection\
    \ requires only \n\nabout 55 Kb. \n\nPHP and MySQL are a very popular combination,\
    \ especially for applications where it's necessary to \n\nget the most out of\
    \ one's hardware. It helps that PHP comes equipped with a great many functions\
    \ \n\nsupporting MySQL. In fact, they work extremely well together \\- so much\
    \ so that there are a number \n\nof sites that offer combination installers, with\
    \ and without the open-source Apache web server. \n\n(You'll find links to a couple\
    \ of those listed along with the other PHP and MySQL resources at the \n\nend\
    \ of this book.) \n\nphpMyAdmin \n\nIn addition, there's a very popular and easy-to-use\
    \ tool for administering MySQL databases, which is \n\nwritten in \\- you guessed\
    \ it \\- PHP. phpMyAdmin provides a graphical, web-based interface with \n\nwhich\
    \ you can create, modify, back up, restore, and delete MySQL databases, tables,\
    \ fields, and \n\nrecords. It can also be a helpful learning tool if you're just\
    \ getting started with MySQL or databases \n\nin general, as it displays the generated\
    \ queries as well as allowing the user to type in actual SQL \n\nqueries and submit\
    \ them. \n\nIf you already have PHP and MySQL installed, adding phpMyAdmin is\
    \ as simple as uploading a set \n\nof PHP pages to the server and making a few\
    \ changes in a single configuration file. For more \n\ninformation and documentation,\
    \ and to obtain a copy, visit the phpMyAdmin project homepage at \n\nhttp://phpmyadmin.sourceforge.net/.\
    \ You’ll also find a short discussion of it in Constructing Usable \n\nWeb Menus\
    \ (Andy Beaumont et al, glasshaus, ISBN: 1904151027.) \n\n169"
