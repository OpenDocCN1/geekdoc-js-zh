    01ives\" value=\"Olives \" /> \n\n<asp:listitem runat=\"server\" text=\"Jalapeno\
    \ Peppers\" value=\"Jalapeno Peppers\" /> \n\n<asp: listitem runat=\"server\"\
    \ text= \"Anchovies\" value= \"Anchovies11 /> \n\n</asp:checkboxlist> \n\nCheckboxes\
