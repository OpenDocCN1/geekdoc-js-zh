  md: "![](img/a10b466d6e11a32674cad146197d13d9_353_0.png)![](img/a10b466d6e11a32674cad146197d13d9_353_1.png)\n\
    \nChapter 8 \n\nHow Forms Work in ASP.NET \n\nForms in ASP.NET look pretty similar,\
    \ in fact in most cases identical, to forms in HTML, but there are \n\nsome crucial\
    \ differences in the way they work. Firstly, we can replace all HTML form controls\
    \ with \n\nASP.NET server controls. The main difference with these- equivalents\
    \ is that they are actually \n\nconstructed dynamically on the server and then\
    \ sent out complete. However, before you run out and \n\nstart replacing all your\
    \ HTML form controls, you should remember you should only use server \n\ncontrols\
    \ where required \\- that is, if you're programming against them on the server.\
    \ Otherwise stick \n\nto using the standard HTML controls as the server controls\
    \ have the added overhead of being \n\nprocessed by the ASP.NET engine, and, having\
    \ to emit pure HTML, they should only be used where \n\nnecessary. We'll look\
    \ at server controls shortly, but there are some more fundamental differences\
    \ \n\nwe'll need to address first. \n\nIn ASP.NET, while we still use the <form>\
    \ tag, we actually use a modified version of it. The \n\nASP.NET version of the\
    \ <form> tag looks like this: \n\n<form runat=\"server\"> \n\n... ASP.NET form...\
    \ \n\n</form> \n\nThe most important point to notice is that we only need to use\
    \ one attribute, (runat=\"server\"), \n\nalthough there are more. The <form> element\
    \ is processed on the web server, as just sending it \n\nback to the browser would\
    \ be useless \\- it wouldn't be able to interpret this ASP.NET-specific \n\nattribute.\
    \ In fact, you can think of the entire ASP.NET form as being like an executable\
    \ program that \n\noutputs HTML. Even though we haven't specified values for the\
    \ method and get attributes, \n\nASP.NET is able to handle this itself and provide\
    \ its own values. In fact all ASP.NET forms are sent \n\nby the post method by\
    \ default. \n\nIn addition, the idea of a server-side form submitted via a cinput\
    \ type=submit> button and then \n\nbeing received by another page has now changed\
    \ considerably. It is possible for one page to submit \n\ndetails and another\
    \ to receive it, and we'll look at how to do this later in the chapter, but for\
    \ now, \n\nwhenever you use this form control, it will automatically return you\
    \ to the same page as the one that \n\nyou began on. \n\n<form runat=\"server\"\
    > \n\n... ASP.NET form... \n\n<input type=\"submit\"> \n\n</form> \n\nThis can\
    \ cause some problems with error handling. For example, how do you go about validating\
    \ \n\nvalues returned by the user, but at the same time avoid testing blank form\
    \ values before the form is \n\nsubmitted to the web server, the first time the\
    \ page is run. The answer is to use a method of the \n\npage object. \\\\ \n\n\
    The Page Object \n\nEverything in ASP.NET comes down to objects, and in particular\
    \ the page object. Each web form \n\nyou create is a page object in its own right.\
    \ In fact everything on the page is part of the page object. \n\nEvery time a\
    \ page is called the object goes through a series of stages \\- initializing,\
    \ processing, and \n\ndisposing of information. Because the page object performs\
    \ these stages each time the page is \n\ncalled, they happen every time a round\
    \ trip to the server occurs. \n\n338"
