    \nChapter 5 \n\nAs it turns out, the problem is one of variable scope. In the\
    \ previous example, we were using \n\n$http\\_post\\_vars from the top level of\
    \ the script, so this wasn't a concern, but once we try to use it \n\nfrom within\
    \ a function, it becomes one. $http\\_post\\_vars is a global variable, and in\
    \ languages like \n\nJavaScript or Visual Basic this means that it's automatically\
    \ accessible from inside functions used in \n\nthat script. In PHP, this isn't\
    \ the case: variables defined inside functions aren't accessible outside those\
    \ \n\nfunctions, and variables defined globally are inaccessible inside any function,\
    \ unless we tell that \n\nfunction that we're accessing a global variable by declaring\
    \ the variable with the global keyword. \n\nWithin the HTML page, we echo Eric's\
    \ input back to him with his first name, as we've been doing \n\nall along: \n\
    \n<body bgcolor=\" #FFFFFF'' text= ” #000000\"> \n\n<p>l. Survey Respondent's\
    \ Name: <?php echo $first\\_name . \" \" . $last\\_name; ?>.</p> \n\n<p>2. Your\
    \ favorite cheese is <?php echo $cheese; ?>.</p> \n\n<p>3. Here's how you rated\
    \ different meats for pizza:</p> \n\n<ul> \n\n<li>Ham: <?php echo $ham; ?></li>\
    \ \n\n<li>Sausage: <?php echo $sausage; ?></li> \n\n<li>Pepperoni: <?php echo\
    \ $pepperoni; ?></li> \n\n<li>Anchovies: <?php echo $anchovies; ?></li> \n\n</ul>\
    \ \n\nIf a checkbox isn't selected, it doesn't get included in the post variables\
    \ sent along from the \n\nprevious page, and if we try to echo one of these, we\
    \ re liable to get an error. While it s possible to \n\nconfigure PHP to suppress\
    \ reporting of such errors, it's preferable not to do so, at least not during\
    \ \n\ndevelopment and testing of an application. After all, it’s quite difficult\
    \ to fix errors if you don't know \n\nthat they exist. \n\nPHP includes a function\
    \ to test whether or not a variable has been assigned a value. The isset () \n\
    \nfunction returns true if the variable passed to it as an argument has been so\
