  md: "![](img/a10b466d6e11a32674cad146197d13d9_176_0.png)![](img/a10b466d6e11a32674cad146197d13d9_176_1.png)\n\
    \nForms and ASP \n\nHaving added the item to the cart in the ASP code, we display\
    \ the available side orders again (using \n\nthe form we saw at the beginning\
    \ of this section on side orders). \n\nChecking Out \n\nWhen the user has stuffed\
    \ their shopping cart with pizza, side orders, and drinks, and they've \n\ndecided\
    \ that's enough, they'll choose to check out. The checkout page simply displays\
    \ the order \n\nback to the user along with whether they are going to collect\
    \ or have it delivered (and if it's delivered, \n\nwhere to). It also allows them\
    \ to remove an item if they want (because of size limitations in this \n\nchapter,\
    \ we're just setting the quantity and price to zero when a user removes an item).\
    \ \n\nAll of the information for checkout. asp comes from the ASP session. This\
    \ highlights the benefit of \n\nkeeping the order data in the session. If the\
    \ user just selected one pizza and one side order, and we \n\nhad been writing\
    \ data to the database for each item and form, we would have had to connect to\
    \ the \n\ndatabase a minimum of six times already (add another connection for\
    \ each additional pizza or side \n\norder if they wanted more). \n\n□ : \n\ni\
    \ @ Review your order...! \n\nIBB \n\nView Source \n\noviUne/ orderuogp \n\nPelase\
    \ check your order testuser, \n\nand click confirm at the bottom of the page...\
    \ \n\nStep 6 of 6 \n\n98 Remove \n\nQuantity Size Item Extra Toppings Price Remove\
    \ \n\n1 large hawan peppers, chicken £13.99 Remove \n\nregular Sicily cheese,\
    \ pineapple \n\nregular hawaii cheese £0.00 \n\n£2.99 \n\nTotal: £42.96 \n\nTo\
    \ be delivered now to. \n\nStreet 10 Dudley Street \n\nSuburb Paddington \n\n\
    Post Code 2021 \n\nHi Tel 029003000HHMHE \n\nJust click confirm and we'll put\
    \ together your order as shown here. \n\nConfirm Order \n\nQuit \n\n,# \n\nAs\
    \ you can see, we display the cart in full on this page, and add a remove button\
    \ to each item, which \n\nallows the user to remove an item. \n\n161"
