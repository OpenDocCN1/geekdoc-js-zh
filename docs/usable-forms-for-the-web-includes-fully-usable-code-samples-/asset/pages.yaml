    \nDesigning Usable Forms \n\nMultiple checkboxes are also a better choice than\
    \ select boxes that allow users to choose multiple \n\nitems. Users often find\
    \ multiple select boxes difficult to operate, and most users have to learn how\
    \ to \n\nadd more than one item. Checkboxes, on the other hand, are simpler to\
    \ use and more likely to match \n\ntheir experience. \n\nNote that you should\
    \ not change the default intention of radio buttons or \n\ncheckboxes. Do not\
    \ make checkboxes mutually exclusive, and do not allow radio \n\nbuttons to be\
    \ used to select multiple options. \n\nRadio buttons also make it easier to explain\
    \ further information about a choice, compared with drop¬ \n\ndown menus. A radio\
    \ button with a description next to it is better than a very wide drop-down menu.\
    \ \n\nFor example, here the options can't fit on the screen when you use a drop-down\
    \ menu; the radio \n\nbuttons below it are much more user-friendly (ch02\\_egl.htm):\
    \ \n\n□ \n\ndown or radio \n\nmm \n\nPlan 2 \\- includes annual subscription,\
    \ monthly magazine, 24 hour telephone support, priority informatir \n\n\\----—--—....-■\
    \ ... \\-.—--\\*r~ \n\nO Han 1 \\- includes annual subscription, monthly magaane.\
    \ badge and mug \n\nQ Plan 2 \\- includes annual subscription, moodily magazine,\
    \ 24 hour telephone support, priority \n\ninformation of new products, badge and\
    \ mug \n\nO Flan 3 \\- includes annual subscription, monthly magazine, tickets\
    \ to quarterly meetings, invitation to \n\nannual chanty ball, 24 hour telephone\
    \ support, pnonty information of new products, badge and mug \n\nRemember that\
    \ once you've selected a radio button, you can't deselect it. If your radio buttons\
    \ \n\nrepresent an optional question, allow the user a way of offering no answer\
    \ after they have selected \n\none \\- don't lock them into that option. Also\
    \ bear in mind that it can be useful to provide an 'other' \n\noption if the user\
    \ is presented with a selection to choose from (in Chapter 7, we'll see an example\
    \ of \n\nactivating a textbox when the user selects an 'other' option, so that\
    \ the user can specify an \n\nalternative that you haven't listed). \n\nDon't\
    \ mix checkboxes and radio buttons up too much as this will confuse users. \n\n\
    The advantages of checkboxes over multiple select lists are similar to those of\
    \ radio buttons over \n\ndrop-down menus. Checkboxes are also ideal for Boolean\
    \ selections where you assume that if the \n\nuser does not check/uncheck the\
    \ box they agree with your option (such as agreeing that you can \n\nmail them\
    \ with further details). However, radio buttons are better than checkboxes when\
    \ you want \n\nthe user to select either yes or no explicitly, as they're given\
    \ two mutually exclusive options and it's \n\neasier for them to see that a choice\
    \ is required. \n\n67"
