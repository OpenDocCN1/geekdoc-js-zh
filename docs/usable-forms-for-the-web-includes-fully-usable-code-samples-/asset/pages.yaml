  md: "![](img/a10b466d6e11a32674cad146197d13d9_177_0.png)![](img/a10b466d6e11a32674cad146197d13d9_177_1.png)\n\
    \nChapter 4 \n\nDisplaying the Complete Order \n\nAs you can see, the cart details\
    \ are written using a very similar technique to that in the include file \n\n\
    that showed the summary of the cart in order4 . asp and order6 . asp. However,\
    \ we add all of the \n\ndetails in this table (we missed out the toppings in the\
    \ summary table) and add a form in the last \n\ncolumn to allow the user to remove\
    \ the item: \n\n<% \n\narrPrintCart \\=Session(\"Cart\") \n\nintSubTotal \\= 0\
    \ \n\nFor y \\= 1 to (UBound(arrPrintCart, 2)—1) \n\nResponse .Write \"<trxtd>\"\
    \ & arrPrintCart (0, y) & \"</td>\" \n\nResponse.Write \"<td>\" & arrPrintCart(l,y)\
    \ & \"</td>\" \n\nResponse .Write \"<td>\" & arrPrintCart (2, y) & ''</td>\" \n\
    \nResponse.Write \"<td>\" & arrPrintCart(3, y) & \"</td>\" \n\nResponse.Write\
    \ \"<td>” & arrPrintCart(4,y) & \"</td>\" \n\nResponse.Write ”<td><fonn action='checkout.asp'\
    \ method='get'>\" & \\_ \n\n\"<input type='image 1 src='remove.gif' alt='remove\
    \ item' />\" & \\_ \n\n\"<input type='hidden' name='remove' value='\" & y & \\\
    _ \n\n\"'/x/formx/tdx/tr>\" \n\nintSubTotal \\= arrPrintCart(4,y) + intSubtotal\
    \ \n\nNext \n\n%> \n\nRemoving Items \n\nThe form that allows the user to remove\
    \ an item points back to this page. The form contains a hidden \n\ninput whose\
    \ name is remove and whose value is the number that identifies the item in the\
    \ cart array, \n\nas well as a submit button carrying the image to indicate to\
    \ remove the item. \n\nWhen the page first loads, we check whether we were asked\
    \ to remove an item. We check the query \n\nstring for a value for remove, and\
    \ if there's one present we call the remove\\_item() subroutine, \n\nwhich sets\
    \ the quantity and price for that item to zero: \n\n<% \n\nintRemove \\= Request.\
    \ Querystring (\"remove11) \n\nIf NOT intRemove \\= \"\" Then \n\nremoveitem intRemove\
    \ \n\nEnd If \n\nSub removeitem(intRemove) \n\n'make a local copy of cart from\
    \ session \n\narrCart=Session(\"Cart\") \n\n'set the quantity and price entries\
    \ for that row to 0 \n\narrCart(0, intRemove) \\= 0 \n\narrCart(4, intRemove)\
    \ \\= FormatCurrency(0, 2) \n\n'copy the local cart back to the session object\
    \ \n\nSession(\"Cart\")=arrCart \n\nEnd Sub \n\n%> \n\n<htmlxbodyxtable> \n\n\
    » \n\n162"
