    \ like asterisks or blocks in visual \n\nbrowsers such as IE or Netscape. \n\n\
    Here's an example with one text input box and one password input box (ch0l\\_eg4.htm):\
    \ \n\n<form action=\"http://www.example.com/logon\" method=\"get”> \n\nUsername:\
    \ \n\n<input type=“text\" name=”txtUsername\" value=”\" \n\nsize=\"14\" maxlength=”14“\
    \ /> <br /> \n\nPassword: \n\ncinput type=\"password\" name=\"pwdPassword\" value=\"\
    \" \n\nsize=\"14\" maxlength=\"14\" /> <br /> \n\ncinput type=\"submit\" /> \n\
    \nc/form> \n\n17"
