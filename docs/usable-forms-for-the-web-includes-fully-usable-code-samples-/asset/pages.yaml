    \ an \n\nHTML link as well: \n\n<p>Click <a href=\"survey\\_l,php\">here</a> to\
    \ continue.</p> \n\nIf you already know some PHP, you might notice we use a meta\
    \ redirect rather than PHP's built-in \n\nheader () function. The reason that\
    \ we do this is because there are known issues with some servers \n\n(most notably\
    \ Microsoft Internet Information Server versions 4 and 5, see \n\nhttp://support.microsoft.eom/support/kb/articles/Q176/1/13.asp)\
    \ that prevent successive calls to \n\nsetcookie () and header () from working\
    \ properly together. Using meta with setcookie () should \n\nperform correctly\
    \ with IlS/Windows, and Apache for both Linux and Windows. \n\nNow we need to\
    \ update the first page of our survey (cookie/survey\\_l .php). First, at the\
    \ top of the \n\npage, we set a cookie to get the time at which the user loaded\
    \ the page. PHP's time () function \n\nreturns the number of seconds elapsed since\
    \ the Unix Epoch. \n\n<?php \n\nsetcookie( \"start\", time() ); \n\n?> \n\nThen,\
    \ within the <body> of the page, we test for the cookie we set on the redirect\
    \ page. If the cookie \n\nvariable has been set, we display the form containing\
    \ the first question of the survey. \n\n<?php \n\nif( isset($test) ) \n\n{ \n\n\
    ?> \n\n<form method=\"post\" action=\"survey\\_2.php\"> \n\n<p>l. Please enter\
    \ your first and last name:</p> \n\n<fieldset> \n\n<label>First name: <input type=\"\
    text\" name=\"first\\_name\" /></label> \n\n</fieldset> \n\n</form> \n\n<?php\
    \ \n\n\\> V \n\nOtherwise, we display a message asking the user to enable cookies\
    \ and provide a link back to the \n\nredirect page: \n\nelse \n\n{ \n\n?> \n\n\
    <h2>Sorry!</h2> \n\n<p>We use cookies to track your progress through the survey.</p>\
    \ \n\n\\* \n\n190"
