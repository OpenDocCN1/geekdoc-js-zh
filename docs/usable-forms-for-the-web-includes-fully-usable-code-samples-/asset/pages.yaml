    \ \n\n<title>Label Control page</title> \n\n</head> \n\n<body> \n\n<hl>PizzaThis!\
    \ Pizzas</hl> \n\n<br /xbr /> \n\nThank you \n\n<span id=\"Messagel\">Vervain</span>\
    \ \n\nyou have ordered the \n\n<span id=\"Message2\">Four Cheese</span> \n\npizza.\
    \ It will be delivered within the next hour. \n\n</body> \n\n</html> \n\nThe <asp:\
    \ label> controls are translated into HTML <span> tags, to which they are functionally\
    \ \n\nequivalent. \n\n347"
