  md: "![](img/a10b466d6e11a32674cad146197d13d9_352_0.png)![](img/a10b466d6e11a32674cad146197d13d9_352_1.png)\n\
    \nForms in ASP.NET \n\nIt is possible for web forms to also contain standard HTML\
    \ form functionality. That \n\nis, there's nothing to stop us using <form> elements\
    \ inside an ASPX file. \n\nHowever, unlike classic ASP, where 99% of code is specified\
    \ within the <% ... %> percentile \n\ndelimiters, ASP.NET code is more commonly\
    \ specified within <script> blocks. To specify ASP.NET \n\ncode two attributes\
    \ need to be set in the <script> tag, runat and language. HTML standards \n\n\
    hawks will notice that neither attribute appears in the HTML/XHTML standard, therefore\
    \ they aren't \n\nprocessed by the browser, but by the server. A typical block\
    \ of ASP.NET code appears like this: \n\n<script runat=\"server\" language=\"\
    vb\"> \n\n. . .ASP.NET code appears here... \n\n</script> \n\nThe runat attribute\
    \ is set to \"server\" to indicate that this code block should be processed on\
    \ the \n\nserver, and the language attribute is set to \"vb\" to indicate to the\
    \ server that any code that appears \n\nwithin these <script> blocks is vb. This\
    \ code block may occur at any point within the ASPX file, but \n\nin this chapter\
    \ we will place it at the beginning of the file for readability's sake. You can\
    \ also place \n\nthe ASP.NET code in a separate file \\- this technique is known\
    \ as code-behind. The separation of \n\ncontent from presentation has been a long\
    \ desirable, if less easily achievable aim in HTML, but \n\nASP.NET goes quite\
    \ a way to achieving these objectives. \n\nIt is also possible to specify the\
    \ language for a whole page with the ©page directive (actually using \n\ntwo different\
    \ <script> blocks with two different languages on the same page won't work anyway).\
    \ \n\nThis can be specified at the top of any ASP.NET page as follows: \n\n<%@\
    \ page language=\"C#\" %> \n\nOnce we create an ASP.NET page, it becomes possible\
    \ to use the set of server controls that come \n\nwith ASP.NET within our HTML.\
    \ Although the server controls have a wide range of functions, there is \n\na\
    \ subset that duplicates the functionality of many HTML elements which include\
    \ the form controls. \n\nThese are the controls that we will deal with within\
    \ this chapter. \n\nThe server control assumes the appearance of an HTML-like\
    \ element, that is, it is surrounded by \n\nangle brackets < and \\>, but actually\
    \ this only marks a point in the page at which the server needs to \n\ngenerate\
    \ a corresponding true-HTML element. The advantage this offers over an HTML control\
    \ is \n\nthat we can create content for the form before returning it to the browser.\
    \ They offer other \n\nadvantages such as being able to remember the state of\
    \ the different controls, for example what text \n\nhas been typed into a textbox.\
    \ These ASP.NET controls are run within specially modified HTML \n\n<form runat=\"\
    \ server \"> tags, and these are ASP.NET server-side forms, and the controls that\
    \ \n\nreside within them are server controls. \n\nWe're now ready to consider\
    \ ASP.NET form, but before embarking on this, we'll clarify the three \n\ndefinitions\
    \ that we will use throughout the course of this chapter. \n\n• An HTML form is\
    \ an HTML element that contains HTML form controls. \n\n• A web form is any page\
    \ that combines ASP.NET code with HTML content. \n\n• An ASP.NET form is a form\
    \ inside a web form that contains ASP.NET server controls. \n\n337"
