    \nDesigning Usable Forms \n\nUsing Single Columns of Form Controls \n\nWhile printed\
    \ forms often use more than one column of questions, this is not a good idea when\
    \ \n\ncreating forms on the Web. This is because you don't know the exact size\
    \ of the screen as a canvas \n\non which you're putting the controls. Factors\
    \ such as screen size, resolution, and font size selection \n\ncan affect layout.\
    \ Furthermore, as we've seen, the use of tables for layout can affect aural devices\
    \ \n\nfor those with visual difficulties. \n\nKeeping Field Info Next To or Above\
    \ Fields \n\nAs we saw when looking at labeling form controls, it's important\
    \ to position the label for the control \n\nso that it's clear which label corresponds\
    \ to which control. We should note a couple of important \n\nexamples where you\
    \ have to be especially careful. \n\nThe first is when you split up input fields\
    \ for things like telephone numbers. A pair of input controls \n\nsuch as this\
    \ will confuse users with screen readers: \n\n□ 0 multiple input controls 0 0\
    \ \n\nPhone number \\* \\[~ \n\n.....J# \n\nThis is because there's no indication\
    \ of what the second box is for. If you're going to split up input \n\ncontrols\
    \ like this, you should be careful to label them appropriately, like so: . \n\n\
    0 multiple input controls \n\n00 \n\nPhone number \\* Area code \n\nNumber \n\n\
    The code for this is (ch02\\_eg9.htm): \n\n<table> \n\n<tr> \n\n<td align=\"right\"\
    \ \\>Phone number <span class=\"imp\">\\*</spanx/td> \n\n<td>Area code <input\
    \ type=''text\" name=11 telcode\" size=\"5\" /> \n\nNumber cinput type=''text''\
    \ name=''telno\" size=\"12\" /></td> \n\n</tr> \n\n</table> \n\nIn Chapter 7,\
    \ we'll see how to auto-tab between fields automatically when a user has \n\n\
    entered a certain number of digits. \n\nAnother example is when you have radio\
    \ buttons for multiple choice or to let users offer an opinion \n\nor rating on\
    \ something: \n\n83"
