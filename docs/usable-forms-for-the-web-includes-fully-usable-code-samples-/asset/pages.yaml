- img_proc: true
  md: "![](img/a10b466d6e11a32674cad146197d13d9_77_0.png)![](img/a10b466d6e11a32674cad146197d13d9_77_1.png)\n\
    \nChapter 2 \n\nAs we'll see, you may actually end up with more than one form\
    \ in the finished product, but \n\nunderstanding the aim of the form(s) that you're\
    \ designing gives focus to the other questions that \n\nwe'll meet in this section.\
    \ \n\nWhat Information Do You Need To Collect? \n\nt \n\nExactly what information\
    \ do you need from the user? This should be a complete list of the \n\ninformation\
    \ that the user will be required to offer. You might start with a general list\
    \ that includes \n\nthings like addresses. Then, for each item from that list,\
    \ you would go into the detail of what \n\ninformation makes up these requirements,\
    \ such as house number, street name, suburb, and \n\npostcode in the case of addresses.\
    \ For example, we need to know the following: \n\n• Which pizzas a user wants.\
    \ \n\n• Whether they want the order delivered or ready to collect. \n\n• What\
    \ their name is. \n\n• What their address and phone number are. \n\n• If they\
    \ want side orders. \n\nWe can split this down further, to give the exact information\
    \ we need: \n\n• Pizza: type, size, quantity, extra toppings. \n\n• Whether they\
    \ will collect the pizza or want it delivered. \n\n• When they want the pizza.\
    \ \n\n• Name: first name, last name. \n\n• Address: street, suburb, postcode,\
    \ additional information for delivery. \n\n• Phone number: area code, phone number.\
    \ \n\n• What side orders they want, in what quantities. \n\nIt's worth remembering\
    \ that there are often two aspects to information collecting. \n\nFirst there\
    \ is the information that you want from a user to get the job done. You can be\
    \ quite strict on \n\nthis; for example, do you really need a home phone number,\
    \ a work phone number, and a mobile \n\nphone number? Are you ever going to use\
    \ that fax number if you ask for it? \n\nThen comes the question of what information\
    \ you want to capture from your user for the purposes of \n\nresearch and marketing.\
    \ (As we'll see later in the chapter, you also have to be aware of data \n\nprotection\
    \ issues, as most countries have laws governing the collection, storage, and use\
    \ of \n\ncustomers' data.) When it comes to the second question, it's often tempting\
    \ to get as much \n\ninformation about the user as possible. \n\n62"
  merge: -1
  pgno: 77
- img_proc: true
  md: "![](img/a10b466d6e11a32674cad146197d13d9_78_0.png)![](img/a10b466d6e11a32674cad146197d13d9_78_1.png)\n\
    \nDesigning Usable Forms \n\nHowever, the longer a form is, the less likely the\
    \ user is to complete it, and indeed there are some \n\nanswers that users don't\
    \ like to divulge (such as income or details of possessions). Unless there's \n\
    \na reason for the user giving the data, you should not assume that they'll be\
    \ happy to give it out. \n\nAnd unless you're sure that you're going to use some\
    \ data in your research, you should not collect \n\nit. If you present a user\
    \ with a form that requests non-essential data, then the user may be \n\ntempted\
    \ to get the service or product you offer from an alternative source, where it\
    \ takes less time \n\nto fill out the form. \n\nAsking questions that don't relate\
    \ to the task that the user is trying to accomplish \n\nby filling out the form\
    \ will frustrate users. \n\nIf you really must collect data that's non-essential\
    \ to the task in hand, though, consider offering users \n\nan incentive to give\
    \ it, such as entering them in a prize draw or providing them with privileged\
    \ \n\ninformation. Or, for example, our pizza company could offer free toppings\
    \ or a second pizza free in \n\nreturn for answering extra questions. The questions\
    \ that are non-essential should be at the end of \n\nthe form and clearly marked\
    \ as optional (you should be very clear about which data is optional and \n\n\
    which is mandatory when you come to designing the form). \n\nDoes Some of This\
    \ Information Fall into Logical Groups? \n\nIf there are groups of like information,\
    \ put them together. In our case, we might group information \n\nlike so: \n\n\
    • Delivery/collection + when they want the pizza \n\n• Name + address + phone\
    \ number \n\n• Pizza details + side order details \n\nGrouping information will\
    \ help the user to understand which section of the form they are completing. \n\
    \nIs There a 'Real-Life' Equivalent of the Form That Users Will Have Previous\
    \ Experience of? \n\nIf you're creating an online application form, are there\
    \ printed versions that the user will have used? \n\nIf you're creating a web\
    \ application, is there a software equivalent that the user may have used? Is\
    \ \n\nthere a standard way of representing the information that you're collecting\
    \ that the user will have had \n\nexperience with? \n\nIf the answer to any of\
    \ these questions is yes, then you should make the form relate to their previous\
    \ \n\nexperience. This will help the user to understand the new technology quicker.\
    \ \n\nFor example, you could be creating an online purchasing application, which\
    \ could relate to the \n\npurchase order form that the user previously had to\
    \ fill in on paper. If you're creating a web-based \n\ne-mail application, its\
    \ design and use could reflect the package that the user is familiar with. If\
    \ \n\nyou're collecting address information, ask for it in the same way in which\
    \ a user would write out \n\nthe address. \n\n63"
