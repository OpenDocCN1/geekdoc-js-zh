    \nChapter 4 \n\nAdding Form Data to the Session Object \\- order2.asp \n\nWe'll\
    \ continue to use the order information example that we've looked at through this\
    \ chapter (the \n\nfiles for this version of the example are in the sessionObject\
    \ folder of the downloadable code for \n\nthis chapter). \n\n♦ \n\nWhen we receive\
    \ data from the first form (orderl .htm), we can store it in variables as we've\
    \ been \n\ndoing with all the examples so far: \n\n<% \n\nDim strTime, strDel\
    \ \n\nstrTime \\= Request.Form(\"time\") \n\nstrDel \\= Request.Form(\"del\")\
    \ \n\nWe can then add it to the Session object, like so: \n\nSession(\"time\"\
    ) \\= strTime \n\nSession(\"del\") \\= strDel \n\n%> \n\nOn this command, the\
    \ server will start by doing the two things it does when the Session object is\
    \ \n\nfirst called in an ASP page: \n\n• Creates the SessioniD that uniquely identifies\
    \ this visitor's session and sends a cookie to the \n\nclient containing this\
    \ ID. \n\n• Assigns some memory on the server to store session information that\
    \ corresponds to \n\nthis SessioniD. \n\nIt will then create two variables or\
    \ keys in the memory assigned for this session and add the \n\nfollowing values:\
    \ \n\n• A time variable or key that holds the details of when the user wants their\
    \ pizza delivered. \n\n• A del variable for whether the user wants their pizza\
    \ delivered or ready to be collected. \n\nThe rest of the page simply provides\
    \ the user with the next section of the form \\- just as it did in the \n\ntwo\
    \ previous examples \\- allowing the user to enter delivery details. As in the\
    \ cookies example, the \n\ninformation from the second form is passed to order3\
    \ .asp. \n\nAs with the cookies example, in the real world you would probably\
    \ use the values \n\ndirectly from the form in this page. However, we want to\
    \ illustrate the use of the \\-• \n\nSession object, so we'll add the values to\
    \ the session and then retrieve them in the \n\norder summary page. \n\nStoring\
    \ an Array in the Session Object \\- order3.asp \n\norder3 .asp starts like the\
    \ other ASP pages we've looked at so far, by taking the details from the \n\n\
    form and putting them in variables. \n\n136"
