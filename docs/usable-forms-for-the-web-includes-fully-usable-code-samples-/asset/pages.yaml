    \nChapter 5 \n\n• $path \\- You can use this value (written as a string) to restrict\
    \ the directory or directories in \n\nwhich the cookie is valid. The default value\
    \ is which permits the cookie to be used from any \n\npage in the current (or\
    \ lower-level) directory on the server from which the cookie was set. Note \n\n\
    that any directory reference must end with a trailing slash character (/). \n\n\
    % \n\n• $domain \\- This controls which domains may request the cookie. The web\
    \ browser performs a \n\n\"tail match\" on the string passed as this parameter,\
    \ so a cookie with its domain set to \n\n.myserver.com (note the leading period)\
    \ could be read bywww.myserver.com, \n\nwww2 . myserver. com, ecom. myserver.\
    \ com, and SO on, but a cookie set with the domain \n\necom. myserver. com can\
    \ only be retrieved by a server whose domain name ends in \n\necom.myserver.com.\
    \ \n\n• $secure \\- This is an integer value, which when set to l means that the\
    \ client will send the \n\ncookie only via an HTTPS connection. Setting it to\
    \ 0 (zero) or omitting it means that the cookie \n\ncan be sent via normal HTTP.\
    \ (Setting the value to 0 does not preclude the use of a secure \n\nconnection,\
    \ but it does not guarantee it either.) \n\nA word of warning about using the\
    \ setcookie () function: it can only be called before any content \n\nhas been\
    \ sent to the client, not even so much as a space in the PHP file preceding the\
    \ opening \n\n<?php delimiter. Doing so will cause the function call to fail with\
    \ a “Cannot add header information\" \n\nerror message. \n\nRetrieving Cookies\
    \ in PHP \n\nRetrieving cookies in PHP is also a simple matter. Once you've set\
    \ a cookie named my\\_cookie on a \n\npage, you can access it from succeeding\
    \ pages in two different ways, in a manner similar to the two \n\nways in which\
    \ you can access form variables and data that we discussed above, for the life\
    \ time of \n\nthe cookie. These are: \n\n• As the global variable $my\\_cookie.\
    \ You don't have to do anything special to retrieve this \n\nvariable. If the\
    \ cookie has been set, is valid for the path and domain from which you're trying\
    \ to \n\naccess it, and hasn't expired prior to the beginning of the current browser\
    \ session, then it's \n\nautomatically generated by PHP from the HTTP headers\
    \ sent by the browser as part of its \n\nrequest for the page. \n\n• As $http\\\
    _cookie\\_vars \\[ \"my\\_cookie\" \\]. The collection that this is part of is\
    \ also available as \n\na global variable in the same conditions as immediately\
    \ above. If you are using multiple cookies \n\non your site you can loop through\
    \ them using f oreach (), just as we did with form variables \n\nand $http\\_post\\\
    _vars. (However, if that's the case, given the limitations on the number of \n\
    \ncookies per browser, you're better off storing multiple values in a single cookie.)\
    \ \n\nWhile there's nothing wrong with the first of these, there are advantages\
    \ to the second, particularly in \n\ncomplex applications where you're dealing\
    \ with a large number of variables being preserved between \n\npages using different\
    \ methods. For instance, what happens if we're trying to use a cookie named \n\
    \n$customer\\_name on a page that receives a get or post request from a page with\
    \ a form containing \n\na field named customer\\_name? While it's not difficult\
    \ to imagine reusing and thus accidentally \n\noverwriting the value of a cookie-generated\
    \ variable named $customer\\_name, the origin of a \n\nvariable accessed as $http\\\
    _cookie\\_vars \\[ \"customer\\_name\" \\] is unambiguous, and it should be \n\
    \nrelatively easy to recall the purpose for which it was set. \n\n188"
