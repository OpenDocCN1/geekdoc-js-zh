  md: "![](img/a10b466d6e11a32674cad146197d13d9_111_0.png)![](img/a10b466d6e11a32674cad146197d13d9_111_1.png)\n\
    \nChapter 3 \n\nButtons \n\nFlash 5 doesn't supply you with any form buttons but\
    \ this is hardly surprising really as buttons are \n\nsuch an integral part of\
    \ Flash. Why use a stock button when you can design your own to fit in with \n\
    \nthe look of the rest of your site? \n\nListbox \n\nFlash also doesn't supply\
    \ you with a listbox element. This is a bit of an oversight as the listbox is\
    \ a \n\npretty useful thing. Luckily it is possible to create your own \\- it's\
    \ not an easy task, but we will cover \n\ncreating a custom listbox in the examples\
    \ later on. \n\nExample 1 \\- A Simple Feedback Form \n\nProbably the most common\
    \ type of form on the web \\- a site feedback form \\- is a great place for us\
    \ \n\nto start. This exercise will introduce you to a few tricks, which should\
    \ be central to any Flash form \n\nthat you create. \n\nWe are going to build\
    \ a simple form \n\nwith three input fields, a reset button \n\nand submit button.\
    \ You'll also find out \n\nhow to control the tab order of your \n\nform and how\
    \ to get it to react to the \n\ninformation returned by the server-side \n\nscript.\
    \ \n\nStart off with a new blank Flash movie. It doesn't matter if you are intending\
    \ to use this form in a site \n\nthat you have already half completed, we are\
    \ going to build the whole thing inside a movie clip so \n\nthat putting it to\
    \ use is simply a case of dropping it onto your site. It's a good idea at this\
    \ point to \n\nhave an image in your head (or on paper!) of what you want your\
    \ form fo look like, including a color \n\nscheme. My first step is always to\
    \ create new swatches in the color panel for each of the colors that \n\nwill\
    \ be used in the form \\- a nice technique is to create tints of the background\
    \ color, one lighter and \n\none darker, as well as a good contrasting cc'or for\
    \ the text. \n\n96"
