    \ which needs to be specified. If the user doesn't \n\nhave an e-mail application\
    \ on their computer, then the mail is lost. Furthermore, that method won't work\
    \ \n\nwith Netscape up to version 4. \n\nThe server-side processing of such a\
    \ form is therefore a much better idea. We'll look at this in Chapters 4 \n\n\
    and 5. \n\nAbout Yourself Form \n\nHere's a more complicated form that allows\
    \ users to enter details about themselves. It makes use of: \n\n• Text input boxes.\
    \ / \n\n• Radio buttons. \n\n• Menus. \n\n• Submit and reset buttons. \n\n• Labels.\
    \ \n\n• Tables for formatting. \n\n• Fieldsets and legends. \n\n• Access keys\
    \ and tab indexes. \n\n53"
