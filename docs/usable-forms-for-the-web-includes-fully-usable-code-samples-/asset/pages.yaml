    \ \n\nradiobutton elements, multiple checkboxes with the same name are not mutually\
    \ exclusive, but like \n\nradiobuttons they are accessible in JavaScript as array\
    \ elements of the form \n\ndocument. f ormName. checkboxName \\[ index\\]. If\
    \ you want to insure that a user selects at least one of \n\na set of checkboxes,\
    \ you can use a for loop similar to what we employed for radiobuttons. Another\
    \ \n\npossibility is that you might want to make a user choose a minimum number\
    \ of choices, in which case \n\nyou’d need to loop through the array and increment\
    \ a counter rather than just set a boolean. Let's try out \n\nan example. Suppose\
    \ that instead of just getting the user's favourite color, we want the user to\
    \ select at \n\nleast three from a list of colors, and not enable a form Submit\
    \ button until they've done so. \n\nHere's the HTML for the form containing the\
    \ checkboxes and Submit button, \n\n<form name=\"pickColor\" method=\"POST\" action=\"\
    color.asp\"> \n\n<p>What colours do you prefer?<br />(Please choose at least three.)</p>\
    \ \n\n<pxinput type=\"checkbox\" name=\"colors\" value=\"red\" \n\nonclick=\"\
    enableButton(this);\" />Red<br /> \n\n<input type=\"checkbox\" name=\"colors\"\
    \ value=\"green\" \n\nonclick=\"enableButton(this);\" />Green<br /> \n\n<input\
    \ type=\"checkbox\" name=\"colors\" value=\"yellow\" \n\nonclick=”enableButton(this);\"\
    \ />Yellow<br /> \n\n<input type=\"checkbox\" name=\"colors\" value=\"white\"\
    \ \n\nonclick=\"enableButton(this);\" />White<br /> \n\n<input type=\"checkbox\"\
    \ name=\"colors\" value=\"purple\" \n\nonclick=\"enableButton(this);\" />Purple<br\
    \ /> \n\n<input type=\"checkbox\" name=\"colors\" value=\"brown\" \n\nonclick=\"\
    enableButton(this);\" />Brown<br /> \n\n<input type=\"checkbox\" name=\"colors\"\
    \ value=\"blue\" \n\nonclick=\"enableButton(this);\" />Blue<br /> \n\ncinput type=\"\
    checkbox\" name=\"colors\" value=\"orange\" \n\nonclick=\"enableButton(this);\"\
    \ />Orange</p> \n\n251"
