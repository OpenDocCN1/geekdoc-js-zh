  md: "![](img/a10b466d6e11a32674cad146197d13d9_315_0.png)![](img/a10b466d6e11a32674cad146197d13d9_315_1.png)\n\
    \nChapter 7 \n\nAccessing Form Elements in JavaScript \n\nWe can access the elements\
    \ of a form in JavaScript using the JavaScript object model, just as we \n\nmight\
    \ access other elements of a document. As you can see, through the form object\
    \ we have \n\naccess to each of the different types of form control: \n\nWindow\
    \ \n\nHistory \n\nDocument \n\nLocation \n\nAnchor \n\nForm \n\nLink \n\nButton\
    \ \n\nCheckbox \n\nFileUpload \n\nHidden \n\nPassword \n\nRadio \n\nReset \n\n\
    Select \n\nSubmit \n\nText \n\nTextArea \n\nAs you're probably aware, each object\
    \ contains properties and methods that allow us to work with it. \n\nFor example,\
    \ a separate window object represents each window of the browser; the content\
    \ of that \n\nwindow is represented in the document object; a form object within\
    \ that document object represents \n\neach form; and each form control is represented\
    \ by an object corresponding to that control. \n\nThe hierarchy of the object\
    \ model forms a tree-like pattern, with strict parent-child relationships. In\
    \ \n\norder to navigate through the tree, we use a dot or bracket notation. So,\
    \ when we want to access a \n\nform control and, say, retrieve its value, we can\
    \ call it by its name and the name of the form it’s on \n\nusing the following\
    \ syntax: \n\ndocument.myForm.myTextInput.value \n\nor: \n\ndocument.myForm\\\
    [\"myTextlnput\"\\] \n\nwhere the form is called myForm and the control is called\
    \ myTextlnput. \n\nIf you use the <iframe> element, you have to use the bracket\
    \ notation. The bracket notation is \n\nparticularly helpful when working with\
    \ variables, as we can add in a variable name, like so: \n\ndocument.myForm\\\
    [varContolName\\] \n\nWe could also use the forms and elements arrays to retrieve\
    \ the data. However, as you can see, just \n\ncollecting the data from the third\
    \ form control of the second form on the page is not as transparent: \n\ndocument.forms\\\
    [1\\].elements\\[2\\].value \n\nUsing the names is simpler to code in the first\
    \ place, and it also means that if you make^any changes \n\nto your document at\
    \ a later date, such as adding a new form with a search box, you won’t break the\
    \ \n\nrest of the code in the page. \n\nBecause JavaScript uses the name of the\
    \ form and form control to access form \n\nelements, you must make sure that each\
    \ form and each control within each form \n\nhas a unique name and ID (except\
    \ for controls that are supposed to share a name, \n\nsuch as a group of radio\
    \ buttons, which just need unique IDs). \n\n300"
