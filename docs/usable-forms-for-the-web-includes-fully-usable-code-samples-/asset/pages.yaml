  md: "![](img/a10b466d6e11a32674cad146197d13d9_149_0.png)![](img/a10b466d6e11a32674cad146197d13d9_149_1.png)\n\
    \nChapter 4 \n\nIt's important to remember that cookies are not inherently secure\
    \ and should never be used for long¬ \n\nterm storage of sensitive or highly confidential\
    \ information such as credit card numbers or account \n\npasswords \\- or even\
    \ home addresses. You can safeguard them from being intercepted by a third \n\n\
    party by transmitting them over a secure connection. However, there's no guarantee\
    \ that an \n\nunauthorized person can’t gain access to a user's computer and read\
    \ a cookie's contents; cookie \n\nfiles are stored as plain text and are not encrypted\
    \ in any way on the user's system. Therefore, this \n\nwarning applies to information\
    \ that's critical to the operation of your site or company as well. \n\nNote that\
    \ IE 6 introduced new privacy features, which mean that cookies will only be \n\
    \npersisted on IE 6+ if the site has the appropriate P3P privacy policy XML document.\
    \ \n\nSo, let's turn to the third of our examples that use this form data, and\
    \ look at storing data on the \n\nserver using the Session object. \n\nStoring\
    \ Form Data in ASP's Session Object \n\nThe third option for storing form data\
    \ between pages is using ASP’s Session object. The \n\nSession object is ASP's\
    \ way of retaining information about a user during a visit to a site \\- or \n\
    \nmaintaining state. It works by creating a cookie on the client that contains\
    \ a SessioniD and \n\nnothing else (no other data). This SessioniD uniquely identifies\
    \ that user to the server for the \n\nduration of the session. \n\nWhen you create\
    \ a session, two things happen: \n\n• The server issues the client with a cookie\
    \ containing the SessioniD. \n\n• The server assigns some memory to that session\
    \ \\- identified using the SessioniD \\- in order \n\nto remember details about\
    \ it. \n\nThis means that when a user submits a set of form data we can add the\
    \ values to the ASP Session \n\nobject, at which point ASP will create a session\
    \ for the user. Once a session has been created, the \n\nserver can remember the\
    \ information that the user enters. The server will retain this information for\
    \ \n\nthe duration of a session. \n\nThe concept of the duration of a session\
    \ is probably the most confusing part of using the session \n\nobject. Simply\
    \ put, you can assign the length of a session \\- the default is 20 minutes. If\
    \ the user \n\ndoes not request or refresh any page for the duration of the session,\
    \ then the session is abandoned \n\nand the server releases the information it\
    \ has retained that's associated with that user's SessioniD. \n\nHowever, if the\
    \ user requests another page from that server before the session expires, the\
    \ time \n\nallowed for the next interaction is again the duration of the session\
    \ \\- the amount of time before the \n\nsession times out is reset to the original\
    \ session length. \n\nFor example, if you leave the default session duration at\
    \ 20 minutes, when a user first requests a \n\npage that uses the Session object,\
    \ they have 20 minutes to request the next page or refresh that \n\npage. If they\
    \ do this within 20 minutes, then they have another 20 minutes to request another\
    \ page, \n\nand so on. If they don't request a page within 20 minutes from when\
    \ they called the last page that \n\nuses the Session object, the server abandons\
    \ the session. (Note that the session is not \n\nautomatically abandoned when\
    \ the user closes the browser.) \n\nYou can also indicate on an ASP page that\
    \ you want the session to end, or you can just remove \n\ncertain items from a\
    \ Session object when you've finished with them (therefore freeing up resources\
    \ \n\non the server). \n\n134"
