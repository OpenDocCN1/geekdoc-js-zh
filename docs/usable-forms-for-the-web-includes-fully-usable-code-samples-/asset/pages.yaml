    \ for the radio button with that value attribute: \n\niff $j \\== 3 ) \n\n$radio\
    \ .= \\* checked=\\\\\"checked\\\\\"\"; \n\nNote that PHP uses \\= to assign values\
    \ and \\== to test whether two values are equal. Do not confuse \n\nthese! If\
    \ you write something like: \n\niff $j \\=3 ) echo ”<p>The value of \\\\$j is\
    \ 3.</p>\\\\n\"; \n\nyou won't produce an error, but you probably won't get what\
