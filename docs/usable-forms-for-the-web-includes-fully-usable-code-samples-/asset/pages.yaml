    \nHTML Forms \n\n\\* A checkbox to indicate agreement to terms and conditions\
    \ chkAgreeToTerms. \n\n• A select box indicating a country seicountry. \n\nIt's\
    \ also a good idea to use the name attribute on your forms as well. This allows\
    \ you to refer to a \n\nform by name in script and allows you to distinguish between\
    \ forms if a page contains more than \n\none form. \n\nFor example, a simple text\
    \ input box that allows a user to enter an e-mail address for subscription to\
    \ a \n\nnewsletter may look like this: \n\n□ \n\n<§ \n\nUltfc Tar \\- \n\nSubscribe\
    \ to our \n\nnewsletter \n\njentef email address ™ | subscribe | \n\nHere's the\
    \ code for this simple form (ch0i\\_eg2.htm): \n\n<form action=\"http ://www.\
    \ example . org/subscribe11 method=\"get\"> \n\n<hl>Subscribe to our newsletter</hl>\
    \ \n\ncinput type=\"text\" name=\"txtEmail'' value=\"enter email address\" />\
    \ \n\n<input type=\"submit\" value\\=11 subscribe” /> \n\n</form> \n\nWe have\
    \ two controls on the form: the text input box and the submit button. \n\nThe\
    \ initial value of the text input box is enter email address \\- this is given\
    \ as a cue to the user that \n\nthey should enter their e-mail address. When they\
    \ enter their address and press subscribe, the \n\nsubscription application will\
    \ receive the name of the text input control (which is txtEmail) and its current\
    \ \n\nvalue (which should be the user's e-mail address). \n\nThe value of the\
    \ submit button is subscribe, and this will be written on the button, although\
    \ it does not \n\nsend a name/value pair as it executes \\- as does not have a\
    \ name. \n\nNow let's have a look at the <f orm> element and the HTML form controls\
    \ in more detail. \n\nThe <form> Element \n\nThe <f orm> element is used as a\
    \ container for the form \\- both the form controls and any other markup or \n\
    \ntext (such as paragraphs, text, or lists) that it may contain. You can have\
    \ more than one <form> element \n\non any given HTML page, but you can't nest\
    \ <form> elements. When there's more than one form on a \n\npage, only the contents\
    \ of the particular form whose details you submit are submitted. \n\n11"
