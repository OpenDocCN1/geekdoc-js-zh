    \nUsing Forms \n\nwith PHP and MySQL \n\nJust before closing the form, we call\
    \ the hidden\\_f ields () function that we defined above. Later, if \n\nwe wish,\
    \ we can easily update the form to post this data to another page that will save\
    \ it to a text \n\nfile or database. We might also want to change the hidden form\
    \ fields to text, radio button, or other \n\ninputs to allow the user a last chance\
    \ to correct any errors before committing the information to a \n\ndata store.\
    \ \n\nIf our discussion of hidden form fields and using them to pass information\
    \ between pages seems to \n\nhave run a little long, it's because we wanted both\
    \ to work in as much useful information about PHP \n\nitself as we could and to\
    \ develop an example application that we could use elsewhere in this chapter \n\
    \nand the next. \n\nIn the next two sections, we'll keep things much more brief\
    \ and direct, and rather than giving you \n\nlong sections of code that will be\
    \ largely repetitive, we'll merely show you what to add to the survey \n\nfiles\
    \ we've already created and where to add it. However, we include complete updated\
    \ and separate \n\nversions for your use and study in the code package available\
    \ for download from \n\nwww.glasshaus.com. \n\nCookies \n\nWe saw in Chapter 4\
    \ how cookies can be used to preserve data between pages during a single visit\
    \ \n\nto a site or to preserve it between visits. You may also recall that there\
    \ can be limits on the size and \n\nnumber of cookies that you can use, and since\
    \ cookie files are not encrypted in any way, they aren't \n\ninherently secure.\
    \ In addition, some Internet users are wary of cookies. \n\nThese things being\
    \ said, cookies can still be a useful means of maintaining state in your web-based\
    \ \n\napplications and PHP makes it quite easy to do so. \n\nStoring Cookies in\
    \ PHP \n\nStoring information in cookies is extremely easy in PHP, as there's\
    \ a built-in function provided for \n\nthis purpose. Let's start by showing you\
    \ its complete definition: \n\nsetcookie( $name, $value, $expiry, $path, $domain,\
    \ $secure ); \n\nWhile you can call this function with a single parameter, it's\
    \ important to understand its capabilities, \n\nso we'll examine each of the parameters\
    \ of setcookie () in turn: \n\n• $name \\- This string serves as an identifier\
    \ for the cookie, and may contain letters, numbers, or \n\nthe underscore character.\
    \ PHP is supposed to convert any illegal characters in cookie names \n\nautomatically\
    \ to underscores, so if you try to set a cookie named user#3/2-7, the cookie \n\
    \nshould actually be set with the name user\\_3\\_2\\_7. However, this behavior\
    \ isn't observed on \n\nsome platforms, so it's safest to stick to the permitted\
    \ characters \n\n• $value \\- This parameter may contain any string value. PHP\
    \ will automatically and \n\ntransparently perform any character encoding that\
    \ may be required in both setting and retrieving \n\nit. (Note that if you later\
    \ try to retrieve the cookie using client-side scripting, you'll need to use \n\
    \nJavaScript's unescape () function to decode the values.) \n\n• $ expiry \\-\
    \ This is an integer that determines when the cookie expires. Its value is the\
    \ time of \n\nexpiration as expressed in seconds since the Unix Epoch (12.00 AM\
    \ 01 January 1970 UT). The \n\ndefault value is the end of the current browsing\
    \ session \\- in other words, the cookie will expire \n\nthe next time the browser\
    \ is shut down if no expiration is set. \n\n187"
