    \nIntroduction \n\nChapter 2: Designing Usable Forms \n\nHere we discuss issues\
    \ to consider for making your form designs as usable as possible, including \n\
    \nuse of CSS to make forms more readable, designing forms to be accessible to\
    \ people with \n\ndisabilities, and sensible control groupings and labeling. In\
    \ this chapter we are also introduced to \n\nour on-going Pizza This online pizza-ordering\
    \ example, which is looked at in greater detail later in \n\nthe book. \n\nChapter\
    \ 3: Flash Forms \n\nThis chapter looks at using Flash to deliver usable forms\
    \ for web sites, including a quick run-down of \n\n\"form controls\" that are\
    \ provided as standard in Flash via smartclips, and complete code listings for\
    \ \n\nthose that aren't, including a custom listbox that we then incorporate into\
    \ some complete examples. \n\nWe also look at handling data from Flash forms on\
    \ the server using PHP, and some of the \n\nadvantages Flash forms have over HTML\
    \ forms. \n\nChapter 4: Using Forms with ASP \n\nHere we are given a brief introduction\
    \ to ASP, and how it can be used to handle data from client-side \n\nforms, including\
    \ writing data to a database (Access in this case), using state, writing form\
    \ data back \n\nto the client, and using hidden form controls and cookies. We\
    \ then go through building the main bulk \n\nof our Pizza This sample application,\
    \ which incorporates all of these features. \n\nChapter 5: Using Forms with PHP/MySQL\
    \ \n\nNow it's time to look at another set of tools that we can use to deal with\
    \ form data on the server \\- \n\nPHP and MySQL. We present a whistle-stop tour\
    \ of PHP and MySQL, which incorporates building \n\nsome additions to our Pizza\
    \ This application, including an on line survey. The code download will \n\nalso\
    \ include a full version of the Pizza This app, re-written in PHP and MySQL. \n\
    \nChapter 6: Form Validation Techniques \n\nit's now time to take a look at one\
    \ of the most important, but most underrated areas of form \n\ndevelopment: validation.\
    \ How do we make sure that site visitors don't submit incorrect information to\
    \ \n\nour servers, that will not only impair their user experience but could also\
    \ damage the integrity of our \n\nsystem? Here we look at the advantages and disadvantages\
    \ of client-side and server-side data \n\nvalidation, including validation of\
    \ text and non-text inputs, regular expressions, and security issues. \n\nLanguages\
    \ covered are JavaScript, PHP (PCRE), and ASP (VBScript). \n\nChapter 7: Advanced\
    \ Client-side Form Scripting \n\nThis chapter provides some very useful advanced\
    \ client-side scripting techniques ( written in \n\nJavaScript) to enhance the\
    \ usability of your forms, including auto tabbing to the next field when the \n\
    \ncurrent one is full, case conversion, word and character counters, submitting\
    \ a form with a link \n\ninstead of a Submit button, and many more. \n\nChapter\
    \ 8: Forms in ASP.NET \n\nHere we take a look into the future of forms, at least,\
    \ from Microsoft's point of view \\- ASP.NET web \n\nforms revolutionalize the\
    \ way forms are handled, by giving us the option of using ASP.NET server \n\n\
    controls in place of the more traditional form controls. Server controls are constructed\
    \ dynamically on \n\nthe server before appearing on your page, giving us more\
    \ power over their definition. But this is only \n\nthe start. This chapter will\
    \ give you a brief introduction to ASP.NET web forms and how to use them \n\n\
    on web pages, illustrated by comprehensive examples. \n\n3"
