    \nChapter 5 \n\nPHP has a number of functions for fetching individual records,\
    \ including mysql\\_fetch\\_array (), \n\nmysql\\_f etch\\_row (), mysql\\_f etch\\\
    _obj ect (), and mysql\\_f etch\\_assoc (). All of them return the \n\nnext record\
    \ from a result set until there are no records available, in which case they return\
    \ false. \n\nThey differ only in the form that the returned records take \\- as\
    \ arrays with numerical indices, objects, or \n\nassociative arrays. We're going\
    \ to use the last of these, which returns a row organized as an \n\nassociative\
    \ array, that is, an array whose elements are identified with names rather than\
    \ by numbers. \n\nIt's handy when we already know the names of the fields whose\
    \ values we want to extract from each \n\nrow. None of these methods give you\
    \ any control over the manner in which the records are ordered; \n\nthis must\
    \ be specified in the query itself. In this case, we used an order by clause.\
    \ (Note that \n\nMySQL keywords are not case-sensitive; we follow the recommended\
    \ convention of using all capitals \n\nfor these and lowercase letters for field\
    \ names.) \n\nwhile( $row \\= mysql\\_fetch\\_assoc($result) ) \n\n{ \n\nWe get\
