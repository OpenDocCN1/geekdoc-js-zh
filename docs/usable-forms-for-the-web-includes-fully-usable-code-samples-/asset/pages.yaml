    \ side orders and add them to cart \n\ncheckout. asp: Display order and allow\
    \ for removal of items \n\nconfirmed.asp: Confirm ordered items \n\nAs we shall\
    \ see, this allows us to demonstrate some interesting aspects of working with\
    \ forms and ASP: \n\n• Collecting user data. \n\n• Passing data gathered in forms\
    \ between pages, using both http get and http post \n\nmethods. \n\n• A simple\
    \ registration and login (with database) for membership. \n\n• Connecting to a\
    \ database to check or register usernames and passwords. \n\n• Remembering user\
    \ details during their visit (involving maintaining state or remembering details\
    \ \n\nacross several pages). \n\n• Remembering user's orders for the duration\
    \ of their visit. \n\n• Associating the form data with the user who entered it.\
    \ \n\nLet's start by addressing the issues of maintaining state and passing data\
    \ between pages. After all, \n\nbeing able to do this is vital if we're going\
    \ to remember each individual user's orders and pass order \n\ndata between different\
    \ pages. \n\nThroughout this chapter, we've removed formatting and style markup\
    \ from the code \\- \n\nto show the important sections more clearly (and save\
    \ you from having to flick \n\nthrough pages of formatting tables). The full code\
    \ in the download includes all of this. \n\n123"
