  md: "![](img/a10b466d6e11a32674cad146197d13d9_193_0.png)![](img/a10b466d6e11a32674cad146197d13d9_193_1.png)\n\
    \nChapter 5 \n\n<option value=\" Provalone11 \\>Provalone< /option> \n\n<option\
    \ value=\"Parmesan\">Parmesan</option> \n\n<option value=\"Camembert\">Camembert</option>\
    \ \n\n</select> \n\n</fieldsetxbr /> \n\n<fieldset> \n\ncinput type=\"submit\"\
    \ value=\"Go to #3\" /> \n\n<input type=''reset\" value=\"Reset Form\" /> \n\n\
    </fieldset> \n\nHere we make use of the same technique, echoing variables whose\
    \ names match those of the fields \n\nin the form on the previous page. However,\
    \ we want to preserve these variables and their values on \n\nsuccessive pages\
    \ as well, so we place the statements inside the quotes that delimit the values\
    \ for \n\ntwo hidden form fields: \n\n<input type=\"hidden\" name=\"first\\_name\"\
    \ value=\"<?php echo $first\\_name; ?>\" /> \n\n<input type=\"hidden\" name=\"\
    last\\_name\" value=\"<?php echo $last\\_name; ?>\" /> \n\n</form> \n\nOf course,\
    \ the client sees only the values that PHP writes into the HTML, and (hopefully!)\
    \ never the \n\nPHP code itself, so if we do a view source in the browser, we'll\
    \ see this instead: \n\n<input type=\"hidden\" name=\"first\\_name\" value=\"\
    Eric\" /> \n\ncinput type=\"hidden\" name=\"last\\_name\" value=\"Idle\" /> \n\
    \nThe quotation marks don't affect the PHP code because they're completely outside\
    \ the <?php . . . \n\n?> delimiters. Now, when this page is submitted, these variable\
    \ names and values will be available \n\nin the next page. \n\nNotice that we've\
    \ used the same field names. This isn't required, but it makes sense to keep the\
    \ \n\nnames we started with; when you're creating an online survey that has 50\
    \ or 60 questions, with one \n\nor two questions to a page, you'll find that every\
    \ bit of consistency helps! \n\nWe placed the hidden fields last in the form.\
    \ This isn't a requirement either \\- it's purely a matter of \n\nthe author's\
    \ personal preference \\- but we suggest that in similar circumstances you get\
    \ into the habit \n\nof placing all the hidden fields either first or last in\
    \ forms, as this will help you when the time comes \n\nto debug. Also, for reasons\
    \ we'll discuss in the next chapter, it can be helpful for doing form \n\nvalidation,\
    \ especially when using client-side scripting to accomplish the task. \n\nSpeaking\
    \ of validation, we aren't really doing any here, so it's perfectly possible at\
    \ this point for Eric \n\nto waste our time and server resources by submitting\
    \ garbage or even an empty set of responses! \n\nFortunately for us, he's a conscientious\
    \ chap who won't do anything of the sort. In Chapter 6, we'll \n\nsee how to keep\
    \ less mindful types from doing so. \n\n178"
