    \nForm Validation Techniques \n\nThe following table lists all the repetition\
    \ characters. \n\nRepetition Character \n\nUsage \n\n{W} \n\nmatch N instances\
    \ of the previous item \n\n{N,M} \n\nat least N but no more than M instances of\
    \ the previous item (N may \n\nbe zero) \n\n{N, } \n\nmatch N or more instances\
    \ of the previous item match \n\n? \n\nmatch the previous item zero or one times\
    \ (same as {0,1}) \n\n(optional, but may not be repeated) \n\n+ \n\nmatch the\
    \ previous item one or more times (same as {1,}) (not \n\noptional, but may be\
    \ repeated) \n\n\\* \n\nmatch the previous item zero or more times (same as {0,})\
    \ \n\n(optional, and may be repeated) \n\nLet's say we'd like to be a little more\
    \ liberal about the format in which we'll accept a telephone number: \n\nwe'll\
    \ take dashes, asterisks, or spaces between the groups of numbers. Or we'll even\
    \ accept it without \n\nany characters at all coming between the digits, so long\
    \ as we have the correct total number of them, and \n\nthe first one's a 1. We\
    \ write: \n\nvar phoneFormat=/l\\[ \\-\\\\\\*\\]?\\\\d{3}\\[ \\-\\\\\\*\\]?\\\\\
    d{3}\\[ \\\\-\\\\\\*\\]?\\\\d{4}/; \n\nNow the user can type in l 234 567 8899,1\\\
    *234567\\*8899,1-234\\*567 8899, etc. But what are the \n\nbackslash characters\
    \ for?lf you glance at the table of repetition characters, you'll see that the\
    \ asterisk (\\*) \n\nhas a special meaning \\- it can take the place of any character.\
    \ In this case, however, that's not what we \n\nmean at all; we want to restrict\
    \ its meaning only and specifically to the asterisk character. In order to do\
    \ \n\nthis, we have to escape the character with a backslash. The same is true\
    \ for any other special character. \n\nWe list all the escape sequences here:\
    \ \n\nEscape Sequence \n\nMatches a(n) \n\nSpecial meaning of unescaped \n\ncharacter\
    \ \n\n\\\\/ \n\n/ character \n\nRegular expression delimiter \n\n\\\\\\\\ \n\n\
    \\\\ character \n\nCharacter escape \n\n\\\\. \n\n. character \n\nAny single character\
    \ \n\n\\\\\\* \n\n\\* character \n\nZero or more of preceding character or \n\n\
    group \n\n\\\\ + \n\n+ character \n\nOne or more of preceding character or \n\n\
    group \n\n\\\\? \n\n? character \n\nZero or one of preceding character or \n\n\
    group \n\nM \n\n1 character \n\nAlternation character \n\nTable continued on following\
    \ page \n\n237"
