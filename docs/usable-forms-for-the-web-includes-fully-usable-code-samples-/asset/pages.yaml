  md: "![](img/a10b466d6e11a32674cad146197d13d9_103_0.png)![](img/a10b466d6e11a32674cad146197d13d9_103_1.png)\n\
    \nChapter 2 \n\nTesting need not be a complex and expensive process. At the very\
    \ least, you should get a colleague \n\nto try going through the form for you.\
    \ If you have the time and resources, though, testing with your \n\nintended audience\
    \ usually provides some interesting insight. \n\nWhatever type of testing you\
    \ go for, come up with some common scenarios that you want to be able \n\nto achieve\
    \ with the form and ask the testers to attempt those tasks. Then simply observe\
    \ them \n\nworking through the tasks. \n\nDon't disrupt a tester if they're doing\
    \ something other than what you intended \\- let \n\nthem keep going and watch\
    \ what they do. \n\nIt's very easy to offer hints or indicate what the tester\
    \ should be doing when they're sitting next to \n\nyou. However, this will affect\
    \ the results — you should let them fill out the form and note their \n\nbehavior.\
    \ Some things you should look out for include: \n\n• Mistakes they make in filling\
    \ out the form \n\n• Whether they take a long time filling out a particular part\
    \ of the form \n\n• Whether they do something other than what you expected \n\n\
    • Whether they ask questions because they're not sure of what they're doing \n\
    \nYou don't need a large sample of users \\- a handful should yield useful results.\
    \ However, it does help \n\nif they are target users as opposed to the clients,\
    \ who will be more familiar with the product, or those \n\nwho worked on the project,\
    \ who will be familiar with the goals and design in any case. \n\nIf you're working\
    \ on a particularly large project, you may consider testing each section individually.\
    \ \n\nOr you could increase your sample size and just get the participants to\
    \ test one area. Using different \n\npeople to test different sections reduces\
    \ learning effects that occur as the testers become familiar \n\nwith the general\
    \ structure of the site. They can test each section as if they had gone straight\
    \ to that \n\nsection, so their tests won't be affected by any knowledge they\
    \ have of how the other parts of the \n\napplication work. (For example, you could\
    \ use different participants to test consumer and trade \n\nsections of the site\
    \ \\- so that they come to the respective sections fresh, without prior experience\
    \ of \n\nthe other section.) \n\nWhen you allocate time for testing, you must\
    \ remember to allow time for alterations \n\nafterwards. \n\nIt would be ideal\
    \ if your form was perfect first time, but the chances are that you may need to\
    \ make \n\nalterations. Performing tests without having time to make changes based\
    \ on the conclusions only \n\nresults in documentation of where you failed, rather\
    \ than improved usability. Indeed, incremental, \n\niterative testing throughout\
    \ a project is better than a single, huge testat the end. \n\nFurthermore, analyzing\
    \ logs when the form goes live is also important, as we'll see in the last section\
    \ \n\nof this chapter, Site Logs and Statistics. \n\n88"
