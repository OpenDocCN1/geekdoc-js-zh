    \nChapter 7 \n\nHere's the form for ch07\\_eg4 .htm: \n\nTo lower case: \n\n<form>\
    \ \n\n<input type=\"text\" name=\"case\" size=\"20\" \n\nonchange=\"this,value=this.value.toLowerCase()/>\
    \ \n\n</form> \n\nTo upper case: \n\n<form> \n\n<input type=\"text\" name=\"case\"\
    \ size=\"20\" \n\nonchange=\"this.value=this.value.toUpperCase()/> \n\n</form>\
    \ \n\nHere we're using the onchange handler to indicate that the value of this\
    \ control should be converted \n\nto upper- or lower-case when the focus changes\
    \ from this form control, if its value has changed. \n\nThis can be particularly\
    \ helpful when creating search forms, which should be case-insensitive, or \n\n\
    when working with usernames or passwords that are not case-sensitive. Remember\
    \ that \n\nJavaScript is a case-sensitive language, so it can also be helpful\
    \ when processing user input to \n\nmatch against a value. \n\nHowever, if the\
    \ form contains several controls, making it all upper- or lower-case when the\
    \ focus \n\nchanges might disorientate the user, and it could make your form look\
    \ less attractive. You can get \n\naround this by performing the case conversion\
    \ on the server. \n\nTrimming Spaces from Beginning and End of Fields \n\nIt can\
    \ be helpful to remove whitespace from the beginnings and ends of fields when\
    \ processing \n\nforms. To do this, we can use some simple inline JavaScript to\
    \ check for spaces at the beginning or \n\nend of the value of the textbox. While\
    \ spaces exist, we remove them using the substring () \n\nfunction (ch07\\_eg5.htm):\
    \ \n\nTrim leading spaces: \n\n<form> \n\ncinput type=\"text\" name=\" ignoreLeadingSpace\"\
    \ size=''100\" \n\nvalue=\" Enter text leaving whitespace at start. Then change\
    \ focus.\" \n\nonblur=\"while (this.value.substring(0,1) \\== 1 ') \n\nthis.value\
    \ \\= this.value.substring(1, this.value.length);\"/xbr /> \n\n</form> \n\nTrim\
    \ trailing spaces: \n\n<form> ' \n\ncinput type=\"text\" name=\"removeTrailingSpace\"\
    \ size=\"100\" \n\nvalue=\"Enter text leaving whitespace at end. Then change focus.'\
    \ \" \n\nonblur=\"while (this.value.substring \n\n(this.value.length-1,this.value.length)\
    \ \\== ' ') \n\nthis.value \\= this .value. substring (0, this .value, length-1)\
    \ ; 11 /xbr /> \n\n</f orm> \n\nAs in the last example, we indicate that we want\
    \ the JavaScript to be performed on the value of this \n\ntextbox using this .value.\
    \ This time, we're using a while loop to strip spaces at the beginning or \n\n\
    end of the value. \n\n1 \n\n306"
