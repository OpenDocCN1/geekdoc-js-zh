  md: "![](img/a10b466d6e11a32674cad146197d13d9_348_0.png)![](img/a10b466d6e11a32674cad146197d13d9_348_1.png)\n\
    \nForms in ASP.NET \n\nBy this point in the book, we've investigated forms in\
    \ some detail and seen how form data can be \n\nprocessed using ASP and PHP. However,\
    \ with the introduction of Microsoft's .NET Framework, \n\nforms change quite\
    \ significantly. Indeed, forms in ASP.NET have been billed as the \"next \n\n\
    generation\", and although they aren't yet in widespread use, it seems only right\
    \ to consider what \n\ncould up-end everything we've looked at so far \\- even\
    \ the way the <form> tag itself works is altered \n\nquite considerably, with\
    \ several of its more familiar attributes being automatically generated by \n\n\
    ASP.NET now. \n\nThis chapter will assume that the reader is up to speed with\
    \ ASP, but hasn't yet encountered .NET \n\nand so we'll begin with a quick introduction\
    \ to the .NET Framework and its installation, before \n\nlaunching headlong into\
    \ how ASP.NET effectively reinvents our notion of forms. \n\nWe will consider\
    \ the following topics: \n\n• What is .NET? \n\n• .NET installation particulars.\
    \ \n\n• HTML forms and ASP.NET forms. \n\n• PostBack. \n\n• \n\nASP.NET server\
    \ controls."
