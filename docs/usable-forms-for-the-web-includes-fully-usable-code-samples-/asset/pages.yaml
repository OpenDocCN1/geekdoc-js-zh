    \nChapter 6 \n\n• implode(g/ue, pieces) \\- Basically the opposite of explode\
    \ (), this function joins together the \n\nelements of an array pieces into a\
    \ single using the string glue to connect them. You can place \n\nthe arguments\
    \ in either order. There is another function called join(), which is identical\
    \ in all \n\nrespects to this one. Let's look at an example (assumes the array\
    \ named $my\\_array is the \n\nsame one created above): \n\n$stringl=implode(\"\
    .\",$my\\_array); \n\n$string2=implode($my\\_array,\".\"); \n\n$string3=join(\"\
    .\",$my\\_array); \n\n$string4=join($my\\_array,\".\"); \n\necho \"$stringl<br\
    \ />$string2<br />$string3<br />$string4\"; \n\nOutput is as follows: \n\n1.800.888.9999\
    \ \n\n1.800.888.9999 \n\n1.800.888.9999 \n\n1.800.888.9999 \n\n• strpos(haystack,\
    \ needle) \\- This function takes two string values as arguments and returns the\
    \ \n\nfirst position in haystack where needle is matched or false if no match\
    \ is found. This function \n\nis case-sensitive. Note that the first position\
    \ in a string corresponds to zero, so in order to test \n\nwhether or not a substring\
    \ can be found within a string, you'll have to use the non-identity \n\noperator\
    \ (! \\==). This is because the inequality operator (!=) will convert zero to\
    \ false. The \n\nidentity operator \\=== yields a value of true only if the operands\
    \ are identical in value and type \n\n\\- no type conversions are performed; the\
    \ non-identity operator returns true if the items to be \n\ncompared are not identical\
    \ in value and type. (0 ! \\=false returns true, but 0 ! \\==false returns \n\n\
    false.) Some examples follow below: \n\necho strpos(\"Fourscore and seven years\
    \ ago...\",\"and\") . \"<br />\"; \n\nif( strpos(\"Fourscore and seven years agoQ\"\
    )!==FALSE ) \n\necho \"We found the letter \\\\\"Q\\\\\".\"; \n\nelse \n\necho\
    \ \"We didn't find the letter \\\\\"Q\\\\\" \n\nif( strpos(\"Fourscore and seven\
    \ years ago...\",\"F\")!==FALSE ) \n\necho \"We found the letter \\\\\"F\\\\\"\
    .\"; \n\nelse \n\necho \"We didn't find the letter \\\\\"F\\\\\".\"; \n\nOutput:\
    \ \n\n10 \n\nWe didn't find the letter \"Q\". \\\\ \n\nWe found the letter \"\
    F\". \n\n• strlen{astring) \\- Returns the number of characters in the string\
    \ astring. \n\n• strtolower(asfr/ng) — Returns a copy of the string astring with\
    \ all uppercase letters converted \n\nto lowercase. \n\n• strtoupper(astring)\
    \ \\- The inverse of strtolower (); returns a copy of the string astring with\
    \ \n\nall lowercase letters converted to uppercase. \n\n270"
