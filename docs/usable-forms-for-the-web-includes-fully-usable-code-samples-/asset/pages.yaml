  md: "![](img/a10b466d6e11a32674cad146197d13d9_27_0.png)![](img/a10b466d6e11a32674cad146197d13d9_27_1.png)\n\
    \nChapter 1 \n\nInside the <f orm> element you declare the form controls that\
    \ will gather the user's data. \n\nAll of the data from one form is sent to the\
    \ same processing application (whether this is an ASP/JSP/PHP \n\nfile, an e-mail\
    \ server or some other application) and we specify where the form data will go\
    \ through the \n\nvalue of the <form> element's action attribute. \n\nWe also\
    \ use it to define how the data gets to the application (whether it uses HTTP\
    \ get or post \n\nmethods) and what encoding type it uses \\- we look at both\
    \ of these subjects in detail later in the chapter. \n\nYou can also use the <form>\
    \ element to indicate: \n\n• Which character encodings the application can receive\
    \ \\- in the same way that Internet Explorer \n\nmight tell you that you don't\
    \ have the correct character set when visiting a page in a foreign \n\ncharacter\
    \ set. The server must understand the character encoding used in the form. \n\n\
    • Which content types the application can receive \\- after all, you might be\
    \ sending image \n\nfiles with the form rather than text, and you need to know\
    \ your server will be able to handle \n\nthat format. \n\nForm Element Syntax\
    \ \n\nHere's the syntax of the <form> element with the attributes that you'll\
    \ want to use most often: \n\n<form action-1' someuri\" \n\nmethod=\"get|post\"\
    \ \n\nenctype=\"content-type\" \n\naccept='' content-type-list\" \n\naccept-charset=''\
    \ character sets\" \n\nname=\"somename”> \n\nid=11 somename\" \n\nonsubmit=\"\
    someFunction()\" \n\nonreset=\"someFunction()\" \n\n<!-- form data goes here —>\
    \ \n\n</form> \n\nOther supported attributes are class, style, title, lang, dir,\
    \ title, and standard events \n\nassociated with script. \n\nAttributes \n\nHere\
    \ are the common attributes that the <f orm> element takes. \n\naction \\= \"\
    someuri\" \n\nThe action attribute specifies the application that will process\
    \ the form data. It could be an ASP, PHP, or \n\nJSP file, a mail server, or some\
    \ other kind of application. The HTML specification only indicates the use \n\n\
    (and most browsers only work with) an HTTP URL. \n\nmethod \\= \"get / post\"\
    \ \n\nThe method attribute is used to indicate which HTTP method will be used\
    \ to pass the form data set to \n\nthe application. \n\n12"
