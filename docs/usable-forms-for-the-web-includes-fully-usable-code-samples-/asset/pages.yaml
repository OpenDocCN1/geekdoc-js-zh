  md: "![](img/a10b466d6e11a32674cad146197d13d9_299_0.png)![](img/a10b466d6e11a32674cad146197d13d9_299_1.png)\n\
    \nChapter 6 \n\nNote that if we'd set the ignoreCase property to False above,\
    \ then we would only be able to match \n\nstrings containing \"script\" but not\
    \ \"SCRIPT\". Should we want to replace the <script> tags in the string with \n\
    \nsomething else, we can use the RegExp.Replace () method. In this case, we II\
    \ merely strip t em ou . \n\nDim Output \n\nOutput \\= ScriptTag.Replace(someHTML,\
    \ \"\") \n\nResponse.Write Output \n\nIf we'd set the RegExp’s Global property\
    \ to false, only the first match found in someHTML to our \n\npattern would have\
    \ been replaced. Once we're completely done with the RegExp object we've created,\
    \ \n\nwe should free up the memory it uses, as we usually do with programmer-created\
    \ objects in VBScript. \n\nSet ScriptTag \\= Nothing \n\nOf course, once we've\
    \ created a given RegExp object and set its properties, we can reuse it as many\
    \ \n\ntimes as we want before we nullify it. \n\nVBScript String Functions \n\n\
    There are several VBScript string functions we'll use to implement our form handler\
    \ example. You should \n\nbe familiar with some of these already, but we'll give\
    \ you a quick refresher on them, just in case. \n\n• inStr {Subject, Search, compareMode)\
    \ \\- Returns the first position at which the string \n\nSearch is found in Subject,\
    \ or zero if the Search string isn't found. The CompareMode argument \n\ntakes\
    \ one of two predefined constants, vbTexteompare for a case-sensitive search of\
    \ the \n\nSubject string, or vbBinaryCompare for a case-insensitive search, which\
    \ is the default value. \n\n• Split \\[Subject, Delimiter) \\- This function splits\
    \ a Subject string into an array of \n\nsubstrings, using any occurrences of the\
    \ Delimiter string as dividing points, and returns this \n\narray. \n\n• Trim\
    \ (Subject) \\- Returns the Subject string stripped of any leading or trailing\
    \ spaces. \n\n• Len (Subject) \\- Returns the number of characters in the string\
    \ Subject. \n\n• Replace (Subject, Search, Replacement) \\- Use this function\
    \ when you want to replace \n\na specific Search string with a Replacement string\
    \ in a Subject string, and no pattern matching \n\nis required. This is a standalone\
    \ function that acts on string arguments \\- don't confuse it with \n\nthe Replace\
    \ () method of the RegExp object which we saw above. \n\n• Eval (Expression) \\\
    - Returns the value of a string Expression evaluated as VBScript code. If \n\n\
    an equals sign is used within the expression, it's understood to be a comparison\
    \ operator and \n\nnot an assignment operator, so a statement such as Value \\\
    = Eval( \"Amount \\= Price \\* \n\nQuantity11 ) will set Value to either true\
    \ or false. (We don't actually use this in the example \n\nbut it's easy to confuse\
    \ with the Execute () function (below), so we include it for the sake of \n\n\
    comparison). \n\n• Execute (Expression) \\- Attempts to execute an Expression\
    \ string evaluated as VBScript \n\ncode. If the variable Operator holds the value\
    \ \"\\*\", then the statement Execute ( \"Amount \\= \n\nPrice \" & Operator &\
    \ \" Quantity\" ) will cause the VBScript statement Amount \\= \n\nPrice \\* Quantity\
    \ to be executed; the value of the variable Amount will be set equal to the \n\
    \nproduct of the values of the variables Price and Quantity. We can execute multiple\
    \ VBScript \n\nstatements in a single call to this function by inserting a colon\
    \ (:) into the string at the \n\nappropriate point to serve as a separator. \n\
    \n284"
