  md: "![](img/a10b466d6e11a32674cad146197d13d9_60_0.png)![](img/a10b466d6e11a32674cad146197d13d9_60_1.png)\n\
    \nHTML Forms \n\n<a> \n\n/ \n\n\\* <area> \n\n\\* <button> \n\n\\* <input> \n\n\
    \\* <object> \n\n\\* <select> \n\n\\* <textarea> \n\nNote that browser features\
    \ such as the address bar can also gain focus once you've gone \n\nthrough all\
    \ of the items within the document that can gain focus. \n\nIn the following example,\
    \ we've changed the tabbing order so that the user doesn't move through the \n\
    \nelements in consecutive order, to demonstrate the idea (ch0l\\_eg24.htm): \n\
    \n<label>First name: cinput size=\"20\" type=\"text\" name=\"fname\" tabindex=\"\
    3\" /> \n\n</label> <br /> \n\n<label>Last name: <input size=\"20\" type=\"text\"\
    \ name=\"lname\" tabindex=”l\" /> \n\n</label> <br /> \n\n<label>Email address:\
    \ <input size=\"20\" type=\"text'' name=\"email\" tabindex=\"2\" /> \n\n</label>\
    \ <br /> \n\nThe value of the tabindex attribute must be a number between 0 and\
    \ 32767. The browser will go to the \n\nnext highest value each time the user\
    \ presses the tab key \\- although they need not be completely \n\nsequential\
    \ (leaving numbers out can be helpful if you're going to expand a form later).\
    \ \n\nYou should start with 1 or higher, rather than zero; elements without a\
    \ tabindex are given a value of 0, \n\nwhich means that they're navigated in the\
    \ order they appear in, after those that appear in the tabindex \n\nyou define.\
    \ Also, if an element is disabled, it does not participate in the tabbing order.\
    \ \n\nIf two elements are given the same value for the tabindex, they'll be navigated\
    \ in the order in which they \n\nappear in the document. \n\nWe'll look at a more\
    \ complicated example of using tabindex after the next section. \n\nAccess Keys\
    \ \n\nAn access key is a single character from the document's character set that\
    \ is used in conjunction with \n\nanother key to take the user to that part of\
    \ the document. Exactly how it works depends on the underlying \n\noperating system.\
    \ On Windows machines it's generally the alt key plus the access key that takes\
    \ you to that \n\nsection, while on Macs it tends to be the Ctrl key plus the\
    \ access key. We can’t change which key is used. \n\nYou also have to be careful\
    \ that the shortcuts you add don't conflict with shortcuts that the program already\
    \ \n\nuses, such as alt+f, which is often used for the File menu. Access keys\
    \ are only supported in IE 4+. \n\n45"
