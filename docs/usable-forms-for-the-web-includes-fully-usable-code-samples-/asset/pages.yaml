  md: "![](img/a10b466d6e11a32674cad146197d13d9_94_0.png)![](img/a10b466d6e11a32674cad146197d13d9_94_1.png)\n\
    \nDesigning Usable Forms \n\nNote that we can't use the <label> element as a containing\
    \ element for the form control in this \n\nexample, because the label and the\
    \ control span two different columns of the table and therefore \n\nwould not\
    \ nest properly. \n\nYou also need to be aware of this when using tables for layout\
    \ of pages. Sometimes rows span cells \n\nor columns. You can probably think of\
    \ sites that use a layout that's something along these lines: \n\nHeading \n\n\
    Navigation item 1 \n\nNavigation item 2 \n\nNavigation item 3 \n\nBanner Ad \n\
    \nAdvert 1 \n\nAdvert 2 \n\nMain content of the page goes here in this \n\ncell...\
    \ \n\nThe order for a layout like this is going to be rather complicated for a\
    \ user who is using a screen \n\nreader. It will often be something like this,\
    \ where the main content is last: \n\nHeading, Navigation item 1, Banner Add,\
    \ Advert 1, Navigation item 2, Advert 2, Navigation item 3, \n\nMain content...\
    \ \n\nIf you must use a layout like this, then a handy tip is to use a single\
    \ blank pixel before the title inside \n\na link that points into the main content:\
    \ \n\n<a href=\"#mainContent\"><img src=\"../images/skipnavigation.gif\" \n\n\
    alt=\"Skip navigation to main content\" width=\"lpx\" height=\"lpx\" /></a> \n\
    \ntitle, navigation, banner ad, adverts, go here \\--> \n\n<td id=\"mainContent\"\
    >Main content of the page goes in this cell...</td> \n\nThis won't be seen by\
    \ most users, but the alt text is the first thing that's read to users with screen\
    \ \n\nreaders. This allows them to activate the link and skip the navigation,\
    \ banner ad, and adverts, which \n\nthey may have already heard on previous pages\
    \ of your site, to go straight to the main content of the \n\npage \\- just as\
    \ users without sight problems can scan straight to it. \n\nWhere possible, you\
    \ can also use table headers to give further meaning to a table. This \n\ncan\
    \ include using a row that is not displayed on visual devices using a style-sheet\
    \ rule \n\n(using visibility:hidden). \n\nRequired Information \n\nA form will\
    \ often include parts that the user must fill in for it to be processed, or at\
    \ least for it to be \n\nmeaningful. If you require users to enter some text or\
    \ select an option of some kind, then it's vital \n\nthat you tell the user this\
    \ \\- otherwise there's no way of them knowing that they have to interact with\
    \ \n\nthat form control. \n\nIt's common on forms to use the asterisk (\\*) sign\
    \ to indicate required fields (and, of course, to include \n\na note on the page\
    \ that indicates that fields marked with the asterisk are mandatory). Furthermore,\
    \ \n\nit's also common to put this asterisk in a different color than the main\
    \ text next to it, so that users can \n\nsee its importance. On the Pizza This\
    \ site, we indicate sections that must be filled in with a red \n\nasterisk. \n\
    \nWe look at how you can ensure that the user enters some data later in the book\
    \ (see Chapter 6). \n\n79"
