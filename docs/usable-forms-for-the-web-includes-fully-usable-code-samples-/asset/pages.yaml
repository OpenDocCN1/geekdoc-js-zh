  md: "![](img/a10b466d6e11a32674cad146197d13d9_190_0.png)![](img/a10b466d6e11a32674cad146197d13d9_190_1.png)\n\
    \nUsing Forms \n\nwith PHP and MySQL \n\nWe'll introduce one or two more such\
    \ control structures as we go along, but for now we're starting to \n\nget a bit\
    \ ahead of ourselves, so let's look at how PHP works with a form using the post\
    \ method \n\nbefore we go any further. \n\nPHP and POST \n\nUnlike some other\
    \ server programming technologies that are used to process web-based forms \n\n\
    (such as ASP or Perl) it's not always necessary in PHP to distinguish between\
    \ get and post when it \n\ncomes to accessing form data. \n\nFor instance, ASP\
    \ has two separate collections, Request.Querystring (for get requests) and \n\n\
    Request. Form (for post), and doesn't provide any shortcuts to the members of\
    \ these collections. \n\nPHP does have equivalent collections ($http\\_get\\_vars\
    \ and $http\\_post\\_vars). In the example \n\nabove, we could have used $http\\\
    _get\\_vars \\[ \"cust\\_name\" \\] instead of $cust\\_name (where ASP \n\nwould\
    \ restrict us to Request.Querystring(\"cust\\_name\")). For applications where\
    \ we have a \n\nlarge number of form fields, it's probably desirable to use this\
    \ more complex syntax, so we don't \n\nforget where the variables originated.\
    \ However, for simple cases where we've just a few fields, we \n\ncan take advantage\
    \ of the shorter variable names. \n\nTo see this in action, take a look at the\
    \ file fav\\_cheese\\_2.html that's included with the code \n\ndownload for this\
    \ chapter. We won't reproduce it in its entirety here, because it's only different\
    \ from \n\nthe first favorite cheese form in one respect: \n\n<form method=''post\"\
    \ action=\"processform.php\"> \n\nAll we did was change the get method to a post\
    \ method. Notice that it still points to the same \n\nprocessing page that we\
    \ used in the get example. If you load the page containing the form into your\
    \ \n\nbrowser, fill it in, and submit it, you'll obtain exactly the same sort\
    \ of result as you did with the \n\nprevious example. Whether you use get or post,\
    \ PHP still creates variables in the target page using \n\nthe names of the form\
    \ controls. \n\nYou'll also notice that PHP handles issues with spaces and special\
    \ characters automatically with \n\npost, just as it does with get. If Zoe Rincon\
    \ types her name into the name field and submits the \n\nform, she'll see Customer's\
    \ Name: Zoe Rincon in the appropriate place on the next page. \n\nSo which method\
    \ of form submission is preferable? Most likely you'll want to use post. Here\
    \ are \n\nsome reasons why: \n\n• As we saw in Chapter 4, the quantity of information\
    \ that can be transmitted using a get request \n\nis quite limited. The precise\
    \ amount varies with the server and client software, but it can be as \n\nfew\
    \ as 255 characters. \n\n• A get request sends information via a query string,\
    \ which to a web browser looks like any other \n\nURL. If a user sends the same\
    \ information via a form with get as they did on a previous \n\noccasion, the\
    \ user's browser may well load a page from the browser cache instead of the \n\
    \nserver, even if the page generated on the server is different because of changes\
    \ in the script, \n\nvalues used to process the request, or other factors. \n\n\
    Since post sends a request directly to the server and doesn't check the browser\
    \ cache, the \n\nissue of users viewing \"stale\" response pages is avoided. \n\
    \n175"
