    pizza \n\ntestuser@example.org \n\nmiss \n\ntest \n\nUser \n\nNote that the connection\
    \ string is in a file called inc\\_connect .asp: \n\n' add user data to the database\
    \ \n\nIf bError \\= false Then \n\nSet ConnObj \\= Server.CreateObject(\"ADODB.Connection\"\
    ) %> \n\n<!--#include file=\"inc\\_connect.asp\"--> \n\n<% ConnObj.Open(MyConnStr)\
    \ \\\\ \n\nNow we need to check whether the username has been taken already. We\
    \ do this by creating a SQL \n\nquery that asks for the username that has been\
    \ entered by the user of. the form: \n\nstrTestID \n\nstrTestID \n\n\"SELECT Username\
    \ FROM tblUsers WHERE Username \\= \n\nstrTestID & Request.Form(\"uname\") & \n\
    \nSet rstID \n\nConnObj.Execute(strTestID) \n\n140"
