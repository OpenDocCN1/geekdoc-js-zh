  md: "![](img/a10b466d6e11a32674cad146197d13d9_260_0.png)![](img/a10b466d6e11a32674cad146197d13d9_260_1.png)\n\
    \nForm Validation Techniques \n\nWe won't go through all the code here; we'll\
    \ just show you the part that does the replacement. You can \n\nview the complete\
    \ source for salestax.html in the code download. Here's the function that performs\
    \ the \n\nvalidation and calculation. It's called from a button whose onclick\
    \ handler is set to \n\ncalculate (this. form) ; so the argument form in the function\
    \ itself is an object reference to the form \n\nfrom which the function's called.\
    \ \n\nfunction calculate(form) \n\n{ \n\nvar amount=form.saleamount.value; \n\n\
    var rate=form.taxrate.value; \n\nThis regular expression matches a group of one\
    \ or more digits followed by an optional group consisting of \n\na decimal point\
    \ plus one or two digits. \n\nvar validNumber=/,'\\\\d+ ( \\\\ . \\\\ d{l, 2 }\
    \ ) ?$/; \n\nvar taxamount,decimal; \n\nHere we use the JavaScript replace ()\
    \ method to strip out unwanted characters from the amount of the \n\nsale and\
    \ the sales tax rate entered by the user. Unlike test (), which is a method of\
    \ a RegExp (regular \n\nexpression) object that takes a string as its argument,\
    \ replace () is a method of a string, which takes \n\ntwo arguments, the first\
    \ being a regular expression to look for, and the second being a string used to\
    \ \n\nreplace matches to the regular expression. (You can see that we don't necessarily\
    \ have to declare a \n\nRegExp object explicitly in order to use a regular expression.)\
    \ In the first call to replace (), the regular \n\nexpression / \\[ $£¥• \\\\\
    , \\] /g matches a dollar sign, pound sign, euro sign, yen sign, or comma (which\
    \ must \n\nbe escaped since it has a special use in regular expressions). The\
    \ g flag means that it's to be used \n\nglobally throughout the string; without\
    \ it, the call to replace () would replace only the first match to one \n\nof\
    \ the characters. So, what this method call does is replace any occurrence of\
    \ any one of those four \n\ncharacters with an empty string, in effect, stripping\
    \ it out while leaving the rest of the string intact. In the \n\nsecond call to\
    \ replace (), we do the same thing with respect to the % sign. Note that since\
    \ we're only \n\nmatching a single instance of a single character, we could have\
    \ used rate=rate. replace (\" %\", \"\") ; \n\nand it would have worked just as\
    \ well. \n\namount=amount.replace(/\\[$£¥•\\\\,\\]/g,\"\"); \n\nrate=rate.replace(/%/,\"\
    \"); \n\nHaving stripped out the characters we're allowing the user to enter but\
    \ didn't want munging up our \n\ncalculation, we test the two values to make sure\
    \ that what's left in each case is a valid number. \n\nif(!validNumber.test(amount))\
    \ \n\n{ \n\nalert(\"Not a valid sale amount.\"); \n\nform.saleamount.focus();\
    \ \n\n} \n\nelse \n\n{ \n\nif(!validNumber.test(rate)) \n\n{ \n\nalert(\"Not a\
    \ valid sales tax rate.\"); \n\nform.taxrate.focus(); \n\n} \n\nIf both values\
    \ are in the proper format, then we perform the calculation and display the results\
    \ to the user. \n\n245"
