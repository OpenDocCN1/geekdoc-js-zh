  md: "![](img/a10b466d6e11a32674cad146197d13d9_258_0.png)![](img/a10b466d6e11a32674cad146197d13d9_258_1.png)\n\
    \nForm Validation Techniques \n\nThere are some additional strategies you can\
    \ employ in designing forms involving text input, such as \n\nsetting the maximum\
    \ number of characters which can be typed into them, or in the case of the ZIP\
    \ codes, \n\nsplitting up the input using separate fields for the 5-digit and\
    \ 4-digits, and so on, that may shorten the \n\nscripting necessary to perform\
    \ validation. Nonetheless, that's still quite a lot of code for a fairly simple\
    \ \n\ntask, isn't it? By now, perhaps, you're beginning to see some uses for and\
    \ especially the potential \n\neconomy of using regular expressions, if you hadn't\
    \ already. \n\nJust for practice, let's try to validate a UK postcode using a\
    \ regular expression. This is a bit more \n\ncomplicated than its American cousin,\
    \ so let's go through it one step at a time. In order, it consists of: \n\none\
    \ or two letters, representing the main office \n\n\\[a-zA-Z\\]{1,2} \n\na digit\
    \ 0-9 plus an optional (second) digit 0-9 or letter, identifying a delivery \n\
    \narea served by that office \n\n\\[\\\\d\\]\\[\\\\da-zA-Z\\]? \n\na space \n\n\
    (space) \n\na digit 0-9 for the district or neighbourhood \n\n\\[\\\\d\\] \n\n\
    two letters identifying a local address group \n\n\\[a-zA-Z\\]{2} \n\n(Although\
    \ all of the letters are supposed to be capitals, as part of this exercise, we'll\
    \ be nice to our users \n\nfrom the UK and perform the capitalisation for them,\
    \ if necessary, using JavaScript's \n\nstring. toUpperCase () method.) Putting\
    \ it all together, we have \n\nvar UK\\_PostCodeFormat=/ \\[\"'a-zA-Z\\]{1,2}\\\
    [\\\\d\\]\\[\\\\da-zA-Z\\]? \\[\\\\d\\]\\[a-zA-Z\\]{2}$/; \n\nNotice that we can't\
    \ use \\\\w because we can't allow underscore characters, so we have to show the\
    \ \n\nranges explicitly. You can try out this regular expression in the file ukpostcode.html\
    \ from the code \n\ndownload. Since it's otherwise very similar to the last couple\
    \ of examples, we won't show the complete \n\nsource here. \n\nWe'll also look\
    \ at the client-side validation of e-mail addresses, using regular expressions.\
    \ E-mail \n\naddresses can be extremely varied, but they do follow a set of rules;\
    \ what we need to do is to discern \n\nthose rules, then translate them into a\
    \ regular expression. We know that: \n\n• An e-mail address starts with a string\
    \ ending with an sign. This string can contain the letters \n\na through z, numbers,\
    \ underscores, dashes, and dots, but the first character must be a letter, \n\n\
    number, or underscore \\- in other words, a word character. Another way of stating\
    \ this is that \n\nthis string starts with a word character \\\\w, which is then\
    \ followed by zero or more groups \n\nconsisting of an optional dot \\\\ . ? followed\
    \ by either a dash or a word character \\[ \\\\w- \\]. So our \n\nregular expression\
    \ must start with \\\\w(\\\\.?\\[\\\\w-\\]) \\*@. \n\n• The part following the\
    \ @ character starts with an optional mail server name (which must follow \n\n\
    the same rules as the first part of the address), followed by a dot, that is,\
    \ \\\\w (\\\\. ? \\[ \\\\w- \\]) \\* \\\\ ., \n\nwhich is followed by a (mandatory)\
    \ domain name which follows the same rules, except that the \n\ndomain name can't\
    \ contain any dots, but which must be followed by one. However, having no \n\n\
    dots in the domain name doesn't break the rule, either, so we still have \\\\\
    w(\\\\. ? \\[\\\\w-\\]) \\*\\\\. \n\n• Finally, we have a top-level domain (TLD),\
    \ which can have from two to six letters (for \n\nexample, . au, . com, . info,\
    \ . museum) followed by an optional group consisting of a dot \n\nfollowed by\
    \ two letters. So for the TLD we have \\[a-zA-z\\] {2,6} ( \\\\. \\[a-zA-Z\\]\
    \ {2}) ?. \n\n243"
