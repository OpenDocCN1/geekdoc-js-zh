    ); \n\ncurrEl.focus(); \n\nsubmitVal=false; \n\nbreak; \n\n} \n\n} \n\nWhen we\
    \ return true to a form's onsubmit handler, the form will be submitted to the\
    \ server; if we return \n\nfalse, the submission is canceled. \n\nreturn submitVal;\
    \ \n\n} \n\nNow let's set up the : focus emulation for Internet Explorer. Since\
    \ Internet Explorer versions 4 and above \n\nrecognize the document. all collection,\
    \ we'll test for that and assign a function to the browser window's \n\nonload\
    \ event handler. (Note that while Opera in \"spoofing mode\" recognises document.\
    \ all, it doesn't \n\nsupport background-color styles on form elements so nothing\
    \ happens in that browser.) \n\nif(document.all) \n\nwindow.onload=setShowFocus;\
    \ \n\nThat function, called setShowFocus (), in turn assigns functions to the\
    \ onfocus and onblur event \n\nhandlers for each <input> and <textarea> element\
    \ in the page. The construction \n\nfunction (){...} is known as a function literal,\
    \ and is a convenient way to represent functions that \n\ndon't necessarily need\
    \ to be called by name. In each case, the this keyword refers to the current input\
    \ \n\nor <textarea> element (currEl). \n\n231"
