  md: "![](img/a10b466d6e11a32674cad146197d13d9_135_0.png)![](img/a10b466d6e11a32674cad146197d13d9_135_1.png)\n\
    \nChapter 4 \n\nThe ASP code that we'll use in this chapter will be written in\
    \ VBScript (as opposed to using \n\nlanguages available in ASP.NET, which is covered\
    \ in Chapter 8), and it should therefore work with \n\nversions of ASP from 2\
    \ upwards. The database we'll be using in this chapter was written in Microsoft\
    \ \n\nAccess, and the .mdb file of the database is provided with the downloadable\
    \ code for this chapter \n\n(although it will work just as well with Microsoft\
    \ SQL Server if you change the connection string and \n\ncreate a copy of the\
    \ database in SQL Server). « \n\nThis chapter assumes familiarity with ASP, VBScript,\
    \ and connecting to an \n\nAccess database. \n\nRetrieving Form Data \n\nAs we\
    \ saw when we first looked at forms in Chapter 1, all form controls that submit\
    \ data to a server \n\nmust live inside <form> tags. The <form> element's action\
    \ attribute specifies the processing \n\napplication that will collect the form\
    \ data, and the method attribute indicates whether we'll be using \n\nan http\
    \ get or post method (see Chapter 1 for a comparison of these methods). For example,\
    \ here \n\nthe form data would be sent to a page called login.asp, using an http\
    \ post method that would \n\nprobably check a username and password against records\
    \ in a database. \n\n<form action=\"http://www.example.org/login.asp\" method=\"\
    post\"> \n\nUsername:<input type=”text\" name=\"username\" size=\"14\" maxlength=\"\
    14\" /xbr /> \n\nPassword:cinput type=\"password\" name=\"pwd\" size=\"14\" maxlength=”14\"\
    \ /> <br /> \n\n<input type=\"submit\" /> \n\n</form> \n\nOf course, if this were\
    \ a real login page, you might like to ensure that the page \n\ntransmits information\
    \ under SSL (Secure Sockets Layer), to protect the username \n\nand password.\
    \ \n\nWhen working with all HTTP communications, ASP needs to be able to capture\
    \ the information \n\nsupplied in each form control individually. As we saw in\
    \ Chapter 1, the contents of successful form \n\ncontrols are sent to the server\
    \ in name/value pairs \\- the name of the control and the value that the user\
    \ \n\ninput/selected. So, when retrieving data from a form, we retrieve it using\
    \ the name of the form control. \n\nInformation from forms is made available to\
    \ ASP through the ASP Request object. Depending on \n\nwhether the form is sent\
    \ from the client using an http get or post method, we have to use a \n\nslightly\
    \ different syntax to retrieve the information and put it into variables. Let's\
    \ quickly review how \n\nwe get the information from a form into variables in\
    \ ASP. \n\nRetrieving Data from an HTTP GET Method \n\nWhen a form uses the http\
    \ get method, name/value pairs are added to the end of the OrL of the \n\npage\
    \ that is being requested in what is known as the query string. A question mark\
    \ character (?) is \n\nused to separate the page that's being requested from the\
    \ query string containing the form data. For \n\nexample, some login data using\
    \ get might look like this, where the username is bobj and the \n\npassword is\
    \ catfish: \n\nhttp://www.example.org/login.asp?username=bobj&pwd=catfish \n\n\
    120"
