- img_proc: true
  md: "![](img/a10b466d6e11a32674cad146197d13d9_318_0.png)![](img/a10b466d6e11a32674cad146197d13d9_318_1.png)\n\
    \nAdvanced Client-side Form Scripting \n\n\\*) Moving focus \n\nas \n\nEnter credit\
    \ card number \n\nEnter your credit card number \n\n^536 \\[3536 \n\nSend) \n\n\
    To do this, we check the length of the value of the control when the onkeyup event\
    \ fires. If the \n\nlength is greater than or equal to 4, we'll change focus to\
    \ the next box, like so (ch07\\_eg2.htm): \n\ncform name=\"creditCardForm\"> \n\
    \nEnter your credit card number:<br /> \n\n<input name=“ txtFirstFourDigits\"\
    \ size=\"5\" maxlength=\"4 '' \n\nonkeyup=\"if(this.value.length>=4) \n\nthis.form.txtSecondFourDigits.focus();\"\
    \ /> \n\n<input name=\"txtSecondFourDigits\" size=\"5\" maxlength=\"4\" \n\nonkeyup=\"\
    if(this.value.length>=4) \n\nthis.form.txtThirdFourDigits.focus();\" /> \n\ncinput\
    \ name=\"txtThirdFourDigits\" size=\"5\" maxlength=\"4\" \n\nonkeyup=\"if(this.value.length>=4)\
    \ \n\nthis.form.txtFourthFourDigits.focus();\" /> \n\ncinput name=\"txtFourthFourDigits\"\
    \ size=\"5\" maxlength=\"4\" \n\nonkeyup=\"if(this.value.length>=4) \n\nthis.form.submit.focus();”\
    \ /> \n\ncinput type=\"submit\" name=11 submit\" \n\nvalue=\"Send\" /> \n\nc/form>\
    \ \n\nNote how we're using this .value. length to indicate that we want the length\
    \ of the value in the \n\ncurrent (this) form control, which is shorter than using\
    \ the full path: \n\ndocument.creditCardForm.txtFirstFourDigits.value.length \n\
    \nThe other advantage of using the shorter name is that it makes the code more\
    \ reusable. If you used \n\ndocument. creditCardForm. txtFirstFourDigits in place\
    \ of this, the code wouldn't work if \n\nyou copied and pasted these controls\
    \ into a form with a different name. \n\nAlso note that the value of the size\
    \ attribute is one digit larger than the maximum length of the field. \n\nThis\
    \ is because some browsers will not leave enough space for four characters to\
    \ be displayed at \n\nonce in each field. \n\nThis example would work equally\
    \ well with dates, where you're asking for a date in a format such as \n\ndd/mm/yyyy.\
    \ You can have separate input boxes for the day, month, and year. \n\n303"
