    [$i\\] . \" \\= \" . (strpos($field, \n\n$requirements\\[$i\\]) !\\=\\=FALSE?\"\
    TRUE\":\"FALSE\") . \" ; \" ); \n\nNow we can perform the appropriate tests. The\
    \ logic is quite similar to that which we employed in the \n\nclient-side section\
