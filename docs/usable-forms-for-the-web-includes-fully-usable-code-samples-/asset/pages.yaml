    \nUsing Forms \n\nwith PHP and MySQL \n\nt \n\nWe've just opened a <select> element\
    \ and written a default <option> within it. Now it's time to \n\nstart pulling\
    \ some information from the database. Here we'll get the names of all the cheeses,\
    \ one of \n\nwhich we want the user to be able to choose, and write each of them\
    \ into its own <option> before \n\nwe write the ending </select> tag. \n\nLike\
    \ other databases used in \"serious\" applications, MySQL has a security scheme\
    \ that employs \n\nuser accounts, access levels, and passwords to restrict unauthorized\
    \ access to data. Individual \n\nusers are granted rights to perform specific\
    \ types of actions on tables in specific databases. In our \n\ncase, the server\
    \ administrator has created a user account (named jon) that is capable of adding,\
    \ \n\nupdating, and deleting records in tables belonging to the survey database,\
    \ and it's this user account \n\nthat we access from PHP. \n\nTo do so, we first\
    \ define variables to hold the names of the MySQL server, the user name, the user's\
