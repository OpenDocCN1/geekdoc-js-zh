    \nChapter 2 \n\nUsing Labels \n\nUsing the <label> element for some controls can\
    \ increase their usability, not only for users who \n\nhave screen readers, but\
    \ also by increasing the size of the clickable area. Labels were only \n\nintroduced\
    \ with IE 4+ and Netscape 6+; however, older browsers will just ignore the <label>\
    \ \n\nelement and display the control as intended. « \n\nHere, we're adding labels\
    \ to the previous example, and we're adding actions to those labels that will\
    \ \n\nselect the relevant item if the label is clicked (ch02\\_eg5.htm): \n\n\
    <form name=\"myForm\"> \n\n<fieldset> \n\n<legend>\\[Section C\\] <em>Marital\
    \ Status</em></legend> \n\n<h4>\\[Question 10\\] What is your marital status?</h4>\
    \ \n\ncinput type=\"radio\" name=\"radMaritalStatus\" id=\"maritalSingle\" \n\n\
    value=\"single\" /> \n\nclabel for=\"maritalSingle\" style=\"cursor: hand; cursor:\
    \ pointer;\" \n\nonclick=\"document.myForm.radMaritalStatus\\[0\\].click();\"\
    > \n\nNever Married</label> \n\n<em>(If selected go to Question 14)</em><br />\
    \ \n\ncinput type=\"radio\" name=\"radMaritalStatus\" id=\"maritalMarried\" \n\
    \nvalue=\"married\" /> \n\nclabel for=\"maritalMarried\" style=\"cursor: hand;\
    \ cursor: pointer;\" \n\nonclick=\"document.myForm.radMaritalStatus\\[1\\].click();\"\
    > \n\nMarriedc/label>cbr /> \n\ncinput type=\"radio\" name=\"radMaritalStatus\"\
    \ id=\"maritalSeparated\" \n\nvalue=\"separated\" /> \n\nclabel for=\"maritalSeparated\"\
    \ style=\"cursor: hand; cursor: pointer;\" \n\nonclick=\"document.myForm.radMaritalStatus\\\
    [2\\].click();\"> \n\nSeparatedc/label>cbr /> \n\ncinput type=\"radio\" name=\"\
    radMaritalStatus\" id=\"maritalDivorced\" \n\nvalue=\"divorced\" /> \n\nclabel\
    \ for=\"maritalDivorced\" style=\"cursor: hand; cursor: pointer;\" \n\nonclick=\"\
    document.myForm.radMaritalStatus\\[3\\].click();\"> \n\nDivorcedc/label>cbr />\
    \ \n\nch4>\\[Question 11\\] Is your partner applying with you?c/h4> \n\nc/fieldset>\
    \ \n\nc/form> \n\nBefore, you had to click the radio button itself to select an\
    \ option. Now, if the user clicks on the label \n\n(which includes the text beside\
    \ the radio button), that option will be selected in the list, so you don't \n\
    \nhave to be as accurate. If you're not familiar with the syntax of the code used\
    \ in the onclick \n\nattribute (which fires when the label is clicked) we'll be\
    \ seeing it used more in Chapter \n\nLabels increase the usability of a form and,\
    \ when used with script, allow for larger \n\nclickable areas on radio buttons\
    \ and checkboxes. \n\n72"
