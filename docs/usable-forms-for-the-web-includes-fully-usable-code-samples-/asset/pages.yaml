    \nChapter 1 \n\nNote that where possible in this book we're using XHTML syntax\
    \ for elements. This means \n\nwe're adding a forward slash at the end of all\
    \ empty elements, those without a closing tag. \n\nSome editors may regard this\
    \ as an error; but browsers will understand the syntax, and it \n\nhelps future-proof\
    \ your pages, should you decide to use XHTML in the future. We're also \n\nusing\
    \ quotes for all attribute values. \n\nIn this example, the <f orm> element carries\
    \ an action attribute, whose value contains the URL of our \n\nsearch application\
    \ \\- this is where the form data goes. It also carries a method attribute indicating\
    \ the \n\nHTTP method to be used in getting the form data to the server (we cover\
    \ this in detail in the Form \n\nSubmission section, but in HTML forms it's always\
    \ one of two values \\- either get or post). \n\nAfter our <hi> element we have\
    \ an <input> element, which creates a form control that allows users to \n\ninput\
    \ text data \\- most commonly via a keyboard. The type attribute indicates that\
    \ we want to provide the \n\nuser with a text input box. Its name attribute is\
    \ what will be used for the name part of the name/value pair \n\nthat is sent\
    \ to the server (the value being what the user enters). (The <form> element can\
    \ also take other \n\nattributes, which we will meet later in the chapter.) \n\
    \nThere we have our first simple form. We'll look at a more complicated example\
    \ at the end of the chapter, \n\nwhen we have covered the different form controls.\
    \ \n\nControls \n\nAs we've just seen, a form consists of text and markup, which\
    \ may appear in any page, and a set of \n\ncontrols \\- which are the textboxes,\
    \ radio buttons, drop-down menus, checkboxes, and so on. When we \n\nprocess the\
    \ data the user has entered, we receive it in name/value pairs. The name corresponds\
    \ to the \n\nname of the form control (given as the value of its name attribute),\
    \ while the value is either the text a user \n\nhas entered or the value of the\
    \ value attribute if the control is one that a user can select, such as a drop¬\
    \ \n\ndown menu, checkbox, or radio button. \n\nNote that while forms can contain\
    \ all kinds of other markup, they cannot be nested. You \n\ncannot have a form\
    \ containing another form. \n\nWith the exception of radio buttons and checkboxes\
    \ (which we speak about in a moment), the value of \n\neach name attribute within\
    \ a form should be unique. This is so that when a server comes to process the\
    \ \n\nname/value pairs, it can distinguish between the entries the user has made\
    \ for each form control. \n\nRadio buttons may share a name when presented together\
    \ as a group, enabling users to select just one \n\nof the radio buttons to indicate\
    \ a choice from a set of values. Checkboxes may also share a name when \n\npresented\
    \ together as a group, but here users can select more than one checkbox from a\
    \ list of options. \n\nRadio buttons and checkboxes that share names are known\
    \ as control groups. \n\nIt's good practice to make your names descriptive, reflecting\
    \ what you're asking for from a uspr. It can \n\nalso be helpful to indicate the\
    \ type of form control as part of its name, to indicate what type ofvalue can\
    \ \n\nbe expected with the form control. For example, you might label: \n\n• A\
    \ textbox for a first name txtFirstName. \n\n• A set of radio buttons for favorite\
    \ color radFavColor. \n\n10"
