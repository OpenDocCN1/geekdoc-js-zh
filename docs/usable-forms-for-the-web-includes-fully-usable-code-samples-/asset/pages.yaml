- img_proc: true
  md: "![](img/a10b466d6e11a32674cad146197d13d9_368_0.png)![](img/a10b466d6e11a32674cad146197d13d9_368_1.png)\n\
    \nForms in ASP.NET \n\n<asp:listbox id=\"listl\" selectionmode=\"single\" runat=\"\
    server\"> \n\n<asp:listitem>Four Cheese</asp:listitem> \n\n<asp:listitem>Artichoke\
    \ and Onion</asp:listitem> \n\n<asp:listitem>Margherita</asp:listitem> \n\n</asp:listbox>\
    \ \n\nWe can alter the highlighted code in our previous example to use a listbox\
    \ instead of a drop-down \n\nlist control and also change it at the same time\
    \ to allow multiple selections as well. \n\n<form runat=\"server\"> \n\nWhat variety\
    \ of pizza do you wish to order?<br /xbr /> \n\n<asp:listbox id=\"listl\" runat=\"\
    server\" selectionmode=\"multiple\"> \n\n<asp:listitem>Four Cheese</asp:listitem>\
    \ \n\n<asp:listitem>Artichoke and Onion</asp:listitem> \n\n<asp:listitem>Margherita</asp:listitem>\
    \ \n\n</asp:listbox> \n\n<br /xbr /xbr /xbr /> \n\n<input type=\"Submit\" /> \n\
    \n</form> \n\nAlso you need to change the ASP.NET code, as we now have multiple\
