- img_proc: true
  md: "![](img/a10b466d6e11a32674cad146197d13d9_366_0.png)![](img/a10b466d6e11a32674cad146197d13d9_366_1.png)\n\
    \nForms in ASP.NET \n\nSub Page\\_Load() \n\nIf Page.IsPostBack Then \n\nMessage.text\
    \ \\= \"You have selected \" & listl.Selectedltem.Value \n\nEnd If \n\nEnd Sub\
    \ \n\nFirst we use Page. IsPostBack to detect whether the page has been posted\
    \ back or is being \n\nviewed for the first time. In this way we can ensure that\
    \ the first time a user views the page, there is \n\nno message displayed in the\
    \ <asp: label> control, but every time the user returns subsequently to \n\nthe\
    \ page, there is a message displayed. In the next line, there is something that\
    \ will be brand-new to \n\nthose used to working with ASP. \n\nThe Old ASP Way\
    \ and the New ASP.NET Way of Referencing Form Data \n\nUp until .NET came along,\
    \ we accessed this information using the format \n\nRequest. Form (\" variable\\\
    _name\"), like SO: \n\nIf Request.Form(\"listl\") <> \"\" then \n\nMessage.text\
    \ \\= \"You have selected \" & Request.Form(\"listl\") \n\nThe way in which we\
    \ have been referencing information passed by forms can now been completely \n\
    \nchanged. The \"classic ASP\" syntax Request. Form (\" variable\\_name\") is\
    \ perfectly valid, but it is \n\nsuperseded by a better way to reference data\
    \ captured by the server controls \\- we'll consider this now. \n\nInstead of\
    \ using the Request.Form() syntax which requires us to go to the Forms collection\
    \ of \n\nASP, we can instead reference each individual piece of form data as a\
    \ completely separate object \n\nwith the identifier name. The identifier name\
    \ is set when the server control/object is created. This \n\nsyntax is much more\
    \ powerful, as it allows us to manipulate the data more directly with properties\
    \ \n\nand methods. It is also much more readable than the archaic Request .Form\
    \ format. \n\nSo when we created the drop-down list control with the identifier\
    \ listl: \n\n<asp:dropdownlist id=\"listl\" runat=\"server\"> \n\n<asp:listitem>Four\
    \ Cheese</asp:listitem> \n\n<asp:listitem>Artichoke and Onion</asp:listitem> \n\
    \n<asp:listitem>Margherita</asp:listitem> \n\n</asp:dropdownlis t> \n\nASP.NET\
    \ allowed us to use the identifier as a handle to this specific drop-down list\
    \ control as \n\nfollows: \n\nlistl.Selectedltem.Value \n\nAs listl is unique\
    \ on the page, it refers directly to the drop-down list. Indeed all of the ASP.NET\
    \ \n\nserver controls are created as separate objects, which you can access locally\
    \ in the subroutine you \n\nhave called. These objects exist the whole time, but\
    \ you can only alter their properties in the page \n\nthey were created on and\
    \ nowhere else, as they are scoped to the page they were created on. \n\nThese\
    \ objects allow you to reference any of the attributes of the server control as\
    \ follows: \n\n\\[ServerControl\\].\\[ServerControlAttribute\\] \n\n351"
