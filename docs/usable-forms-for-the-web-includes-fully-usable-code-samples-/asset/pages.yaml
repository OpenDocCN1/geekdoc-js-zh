  md: "![](img/a10b466d6e11a32674cad146197d13d9_351_0.png)![](img/a10b466d6e11a32674cad146197d13d9_351_1.png)\n\
    \nChapter 8 \n\nAnybody who is familiar with ASP might be used to it being installed\
    \ automatically \n\nwith the web server, and thereby doing it all in one step.\
    \ However, while it's true \n\nthat classic ASP is still installed with the web\
    \ server, ASP.NET is only available as \n\npart of the .NET Framework. Installation\
    \ of ASP.NET doesn't replace or indeed \n\naffect any existing installation of\
    \ ASP. \n\nInstalling ASP.NET and the .NET Framework SDK \n\nWhen installing ASP.NET\
    \ from Microsoft's http: //www.asp.net site, you can install either the \n\n.NET\
    \ Framework SDK and .NET Framework Redistributable as both downloads contain ASP.NET.\
    \ \n\nThe .NET Framework Redistributable download is a smaller, streamlined download\
    \ that only \n\ncontains the bare bones needed for you to run ASP.NET and the\
    \ .NET Framework. None of the extra \n\ndocumentation or samples will be included.\
    \ The size differential between the two is pretty big (.NET \n\nFramework Redistributable\
    \ is 21MB while the .NET Framework SDK is a staggering 131MB), so \n\nunless you\
    \ have the .NET Framework SDK on CD (which you can order from the Microsoft site)\
    \ or \n\nbroadband high-speed Internet access, you'll probably want to download\
    \ the.NET Framework \n\nRedistributable version. While you won't have direct access\
    \ to the Help files, all support materials \n\nare available online at Microsoft's\
    \ http://www.asp.net site. \n\nIt's very important to install IIS before installing\
    \ the framework though. There are a lot of reported \n\nerrors when people installed\
    \ IIS afterwards. Once IIS and then ASP.NET have been successfully \n\ninstalled,\
    \ you need to verify that IIS is running correctly, and if necessary, that the\
    \ IIS admin service \n\nhas been started up. Also, check that the default web\
    \ site has been turned on in the IIS \n\nadministrative console. \n\nHTML Forms\
    \ and ASP.NET Web Forms \n\nOnce the .NET Framework has been installed, you're\
    \ ready to run any code on the platform and use \n\nASP.NET forms. We're going\
    \ to use VB.NET in our ASP.NET examples in this chapter as it bears a \n\nstrong\
    \ likeness to VBScript, which we have already met with ASP in this book. We won't\
    \ actually use \n\nVBScript however, because VBScript is not a .NET language and\
    \ never will be. \n\nBefore charging into ASP.NET forms though, we need to clear\
    \ the ground of some potentially \n\nconfusing terminology. Web forms in ASP.NET\
    \ mean something quite different to standard \n\nHTML forms. \n\nIn ASP.NET, the\
    \ term web form refers to the grouping of two distinct blocks of code: \n\n• The\
    \ HTML containing page layout information and ASP.NET server controls (see below).\
    \ \n\nThis is responsible for the presentation of the web form on the browser.\
    \ \n\n• The ASP.NET code that provides the web form's processing logic. This is\
    \ responsible for \n\ngenerating dynamic content to be displayed within the web\
    \ form. This content is typically \n\nexposed via server controls defined in the\
    \ HTML presentation block. \n\nIn fact any and everyASP.NET page is termed a web\
    \ form. The way ASP.NET pages are denoted \n\n(and recognized by the web server)\
    \ is by assigning them the .aspx suffix, in much the same way \n\nASP pages are\
    \ identified by .asp, and PHP pages by .php. \n\n336 \n\n%"
