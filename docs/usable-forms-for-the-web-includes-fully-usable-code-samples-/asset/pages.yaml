- img_proc: true
  md: "![](img/a10b466d6e11a32674cad146197d13d9_76_0.png)![](img/a10b466d6e11a32674cad146197d13d9_76_1.png)\n\
    \nDesigning Usable Forms \n\nGenerally, we don't like filling in forms \\- we\
    \ associate bad things with them, such as paying taxes! \n\nThe design of a form\
    \ might determine whether it's used or not. If a form is difficult to understand\
    \ and \n\nuse, or if it's overcomplicated, some users will simply avoid it. Printed\
    \ forms can be daunting at the \n\nbest of times, but electronic forms can be\
    \ even more daunting. As you will see in this chapter, it pays \n\nto spend a\
    \ little time thinking about the form before you start creating it, and when you\
    \ do start \n\ncoding it, there are lots of good practices you can employ to make\
    \ it more usable. \n\nIn this chapter, we'll look at design issues about the forms\
    \ you create. The topics covered range from \n\nhow to make a form easy to use,\
    \ to how to make a form accessible to users with disabilities. We'll \n\napproach\
    \ the topic in a chronological order through design, creation, and testing to\
    \ see how we can \n\nmake our forms easy to understand and accessible to as many\
    \ people as possible. \n\nTo illustrate some of our examples, we will be looking\
    \ at some of the pages from \n\nour ongoing-running example, Pizza This, which\
    \ you will find discussed in far more \n\ndetail in Chapters 4 and 5. \n\nBefore\
    \ You Design the Form \n\nBefore you start designing a form, you should be clear\
    \ in your mind what the aim of the form is and \n\nwhat you need to find out from\
    \ the user. There are some useful questions you can ask yourself to \n\nhelp clarify\
    \ the issues. Having answered these questions, you'll save yourself time in the\
    \ actual \n\ndesign of the form. \n\nWhat Is the Form's Purpose? \n\nHere you\
    \ should be thinking of the general task that you want to perform. For example,\
    \ is it a search \n\nform to allow users to search for something on your site?\
    \ Is it an order form, allowing users to \n\npurchase something online? Is it\
    \ a test, where users will be marked on their answers? Is it an \n\napplication\
    \ for some service? And so on... In our case, it's an online order form for delivery\
    \ or \n\ncollection of pizzas."
