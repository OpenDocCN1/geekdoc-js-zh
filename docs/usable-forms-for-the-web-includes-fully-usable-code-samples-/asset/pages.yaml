    \nDesigning Usable Forms \n\nSplitting a Form into Different Pages \n\nIf you\
    \ have a long form, the next task is to split it up into sections. As with any\
    \ web page, a sighted \n\nuser will be able to guess how long a form is by the\
    \ length of the side bar with which they scroll. If the \n\nuser gets the impression\
    \ that the form is very long, then they may be less likely to complete it. If\
    \ your \n\nform requires a lot of information from the user, it's a good idea\
    \ to split it up into separate pages. \n\nA few smaller forms are less off-putting\
    \ than one long form. \n\nKeeping related information on one page makes it easier\
    \ for the user to digest. \n\nA good guide for how much of the form should go\
    \ on each page is around a \n\nscreenful (at 800 x 600 resolution) \\- this enables\
    \ the user to see how much \n\ninformation is required from them at a glance.\
    \ \n\nWhen you split a form into separate pages, you should indicate to the user\
    \ how far through the form \n\nthey are, as shown here: \n\n□ \n\nE Delivery details\
    \ \n\nflB \n\nonline^ m'det'Ln#' \n\nWhere do I want my Pizi-a delivered.. \n\n\
    Step 2 of 6 \n\n\\* \n\nName \\* Displayed from OB \n\nPhone number \\* Area code\
    \ i Number P \n\nStreet number and \n\nname ^J^(.r)^ \n\nIn our Pizza This application\
    \ developed for this book, we provide an indication of where the user is in \n\
    \nthe form in the top right-hand corner of the form, where it says Step 2 of 6.\
    \ You can repeat this \n\ninformation next to a button that the user presses to\
    \ navigate to the next page \\- which will usually be \n\nat the bottom right\
    \ of the page. \n\nAn alternative is to use graphics or text to indicate how far\
    \ the user is along the form process, as in \n\nch02\\_eg6.htm. Here, there's\
    \ a block of text that relates to each step of the form. All of these are \n\n\
    displayed at once, and the one that the user is on is highlighted: \n\n73"
