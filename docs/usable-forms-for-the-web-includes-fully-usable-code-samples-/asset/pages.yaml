    \nForm Validation Techniques \n\nASP Specifics \n\nYou've already had an overview\
    \ of ASP form-handling basics in Chapter 4. Feel free to turn back and \n\nglance\
    \ through it again before continuing this section, as we won't be repeating that\
    \ material here. We'll \n\nbe using VBScript as our ASP language in this section,\
    \ to carry on the trend from Chapter 4. We assume \n\nyou're familiar with VBScript\
    \ language basics; if you need a refresher, please see some of the references\
    \ \n\nat the end of this book. However, we will cover a few specifics with regard\
    \ to two key areas that we'll be \n\nusing a bit later when we look at our generic\
    \ form handler example: regular expressions and string \n\nfunctions. There are\
    \ a couple of other advanced features of the language we make use of in the ASP\
    \ \n\nexample; we'll explain those as we come across them. \n\nRegular Expressions\
    \ in VBScript \n\nVBScript 5.0 and above supports a regular expression syntax\
    \ very similar to that used by JavaScript and \n\nthe Perl-compatible regular\
    \ expressions available in PHP, but the way it makes them accessible to the \n\
    \nprogrammer is a bit different in some respects. Like JavaScript, VBScript uses\
    \ a Regular Expression \n\nobject, but where both JavaScript and PHP use delimiter\
    \ characters to define a regular expression \n\npattern, and the /i and (in the\
    \ case of JavaScript) /g switches to specify case-insensitivity and global \n\n\
    scope, VBScript makes use of a different syntax altogether. In VBScript we create\
    \ a new instance of the \n\nregular expression (RegExp) object, and then set its\
    \ Pattern, ignoreCase, and Global properties. \n\nThe Pattern property is set\
    \ to string value: the regular expression pattern encased in quotes. Note that\
    \ \n\nwe don't use slashes or any other delimiter characters. The other two properties\
    \ are set to True or False \n\ndepending on what's needed. Let's see how we’d\
    \ create and use a VBScript regular expression using a \n\npattern that matches\
    \ any opening or closing HTML <script> tag, including any possible attributes\
    \ the \n\ntag might have (<\\\\/?script\\\\. \\*>). 1 \n\n(Syntax using complete\
    \ object references:) \n\n(Alternative syntax using the \n\nwith and End with\
    \ keywords:) \n\nSet ScriptTag \\= new RegExp ScriptTag.Pattern \\= \n\n\"<\\\\\
    /?script\\\\.\\*>\" \n\nScriptTag.IgnoreCase \\= True \n\nScriptTag.Global \\\
    = True \n\nSet ScriptTag \\= new RegExp \n\nWith ScriptTag \n\n.Pattern \\= \n\
    \n\"<\\\\/?script\\\\.\\*>\" \n\n.IgnoreCase \\= True \n\n.Global \\= True \n\n\
    End With \n\nNow we've created a RegExp object that will match the desired pattern,\
    \ regardless of case, and that will \n\nmatch that pattern as many times within\
    \ a given string as the pattern occurs. Let's assume we have a \n\nvariable named\
    \ someHTML, which contains a string of arbitrary HTML text. The RegExp object\
    \ has two \n\nmethods, one of which we can use to determine if the pattern occurs\
    \ in a string, and the other which we \n\ncan use to replace occurrences of that\
    \ pattern with whatever string we desire. To test whether or not the \n\npattern\
    \ occurs in a string, we use the RegExp object's Test () method, which returns\
    \ True if a match is \n\nfound, and False if it isn't: \n\nIf ScriptTag.Test(someHTML)\
    \ \\= True Then \n\nResponse.Write \"Sorry! You can't post scripts here.<br />\"\
    \ \n\nElse \n\nResponse.Write someHTML \n\nEnd If \n\n283"
