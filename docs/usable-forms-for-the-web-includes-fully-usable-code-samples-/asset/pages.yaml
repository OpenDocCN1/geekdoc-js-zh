  md: "![](img/a10b466d6e11a32674cad146197d13d9_360_0.png)![](img/a10b466d6e11a32674cad146197d13d9_360_1.png)\n\
    \nForms in ASP.NET \n\nThere are two sets of ASP.NET server controls which help\
    \ mimic the HTML form controls, namely \n\nthe WebControls (namespace System.ui.WebControls)\
    \ and the HTMLControls (namespace \n\nSystem.ui.HTMLControls) and they derived\
    \ from the same base class (System. Object). \n\nThis chapter is going to concentrate\
    \ on some of the controls found in the WebControls family, as \n\nthey provide\
    \ a more consistent interface than the HTMLControls. Basically, both sets provide\
    \ pretty \n\nmuch the same functionality, but HTMLControls have a more \"erratic\"\
    \ set of properties. So, where \n\nyou might be able to set style consistently\
    \ using the style property for every control in the \n\nWebControls, with the\
    \ HTMLControls you could do it with some controls and not others. \n\nThe HTMLControls\
    \ family also provides equivalent functionality for other non-form elements such\
    \ as \n\ntne anchor, image, and table elements. We will very briefly touch upon\
    \ the form controls in the \n\nHTMLControls family, at the end of this section.\
    \ However, as mentioned, it is the WebControls family \n\nwe are primarily going\
    \ to focus on. \n\nThe <asp:label> Control \n\nThe <asp: label> control provides\
    \ a logical equivalent to the HTML <span> element, which is used \n\nfor inline\
    \ text. It is actually vital to us if we want to separate our HTML from our ASP.NET\
    \ code. The \n\n<asp: label> control is just like any other HTML form control\
    \ in that it has a collection of attributes \n\nyou can set. However, it isn't\
    \ a true HTML form control, just as the <span> element isn't, and can be \n\n\
    used equally well both inside and outside of HTML forms. \n\nHere's a list of\
    \ some commonly used attributes of <asp:label>: \n\n• BackColor \\- sets the background\
    \ color of the label. \n\n• ForeColor \\- sets the foreground color of the label.\
    \ \n\n• Height \\- sets the height (in pixels) of the label. \n\n• id \\- sets\
    \ a unique identifier for that particular instance of the label. \n\n• Text \\\
    - sets the text that you want the label to display, although you can also specify\
    \ text \n\nby typing in text between the <asp:label> and </asp:label> tags. \n\
    \n• visible \\- sets whether the label control is currently visible on the page;\
    \ it must be either \n\ntrue or false. \n\n• width \\- sets the width of the label\
    \ control. \n\nIf you have already installed the Quickstart tutorials when you\
    \ installed the .NET \n\nframework SDK, and you want a full detailed list of the\
    \ attributes that the \n\n<asp: label> control supports (or indeed any HTML server\
    \ control), then you can use \n\na handy tool known as the class browser, which\
    \ you can run from the following URL: \n\nhttp://localhost/quickstart/aspplus/samples/classbrowser/vb/classbrowser.aspx?names\
    \ \n\npace=System. Web. UI. WebControls \n\n345"
