    \nForms and ASP \n\nIf we don't find a corresponding entry for the username, then\
    \ we construct a SQL statement to insert \n\nthe user data into the database:\
    \ \n\nIf rstID.BOF and rstID.EOF then \n\nstrSQL \n\nstrSQL \n\nstrSQL \n\nstrSQL\
