    \nChapter 4 \n\nAdding Side Orders to the Cart \n\nIn a production application,\
    \ the prices would probably be retrieved from a database. However, in our \n\n\
    sample application, we've put the prices in the include file inc\\_sidePriceFunction.asp,\
    \ which \n\ncontains a simple Select Case to determine the price. \n\n<% \n\n\
    Function calculateSidePrice(strSide) \n\nSelect Case strSide \n\nCase \"garlic\"\
    \ \n\nintPrice \\= 2.99 \n\nCase \"cheese\" \n\nintPrice \\= 3.99 \n\nEnd Select\
    \ \n\ncalculateSidePrice \\= intPrice \n\nEnd Function \n\n%> \n\nThe inc\\_addSideDish.asp\
    \ include file first works out the price of the side dish using the function \n\
    \ncalculateSidePrice (), which is in the include file we just saw. Then it adds\
    \ the item to the cart \n\nusing the additem () subroutine and increments the\
    \ item counter by one. This is very similar to the \n\nway that we added pizza\
    \ to the shopping cart array. The only difference is that we don't add values\
    \ \n\nfor size or toppings this time \\- we just set them to blanks: \n\n<% \n\
    \nIf Not strSide \\= \"\" Then \n\n'calculate the price of the side order \n\n\
    intSidePrice \\= calculateSidePrice(strSide) \n\n'add item to the cart \n\nadditem\
    \ \n\nEnd If \n\nSub additem() \n\ni \\= Session(\"ItemCount\")+1 \n\nintQty \\\
    = 1 \n\n'make a local copy of the cart \n\narrCart \\= Session(\"Cart”) \n\n'resize\
    \ local cart to make room for new item \n\nRedim preserve \\= arrCart(%, i+1)\
    \ \n\n'add the side dish to the local cart \n\narrCart(0, i) \\= intQty \n\narrCart(1,\
    \ i) \\= \"\" \\\\ \n\narrCart(2, i) \\= strSide \n\narrCart(3, i) \\= \"\" \n\
    \narrCart(4, i) \\= intSidePrice \n\n'copy local cart and item count back to Session\
    \ object \n\nSession (''ItemCount\") \\= i \n\nSession(\"Cart\") \\= arrCart \n\
    \nEnd Sub \n\n%> \n\n160"
