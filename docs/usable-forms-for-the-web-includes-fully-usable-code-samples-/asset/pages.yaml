  md: "![](img/a10b466d6e11a32674cad146197d13d9_31_0.png)![](img/a10b466d6e11a32674cad146197d13d9_31_1.png)\n\
    \nChapter 1 \n\nSingle-Line Text Input Controls \n\nSingle-line input controls\
    \ are created with an <input> element whose type attribute has a value of \n\n\
    text. Here's a simple text input for a search box (ch01\\_eg3 .htm): \n\n<input\
    \ type=\"text\" name=\"txtSearch\" value=\"search for\" \n\nsize=\"14\" maxlength=\"\
    64\" /> \n\nLet's look at the attributes the <input> element carries when creating\
    \ a text input control: \n\n• type indicates what type of input control we want\
    \ to create \\- the <input> element is used to \n\ncreate a number of different\
    \ form controls, so the value of text for the type attribute indicates \n\nthat\
    \ we want to create a single-line text input box. \n\n• name gives the name that\
    \ will be associated with the value that the user enters (remember \n\nall successful\
    \ input controls must consist of name/value pairs if they are to be submitted\
    \ to \n\nthe server). \n\n• value provides an initial value for the input control\
    \ that the user will see; here we have used \n\nthe value search for, to indicate\
    \ to the user that they should be entering search words there. \n\n• size indicates\
    \ the width of the control \\- in this case it will be 14 characters wide. If\
    \ the user can \n\nenter a longer string, then the user agent should allow a way\
    \ of scrolling along the entry \n\n(commonly for the text input this will be achieved\
    \ using the arrow keys). \n\n• maxi eng th allows you to specify the maximum length\
    \ of string that the user can enter. \n\nThe following attributes are commonly\
    \ used to associate script with events that might occur when the user \n\nis interacting\
    \ with the text input (we'll see more about associating events with script in\
    \ Chapter 7, \n\nAdvanced Client-side Form Scripting): \n\nonfocus, onblur, onselect,\
    \ onchange, onkeydown, onkeypress, onkeyup \n\nHere's the full list of attributes\
    \ you can use with an <input> element whose type attribute has a value \n\nof\
    \ text: \n\n• type, name, value, size, maxlength — which we've seen. \n\n• disabled,\
    \ readonly, tabindex, accesskey — which we discuss later in the chapter. \n\n\
    • onfocus, onblur, onselect, onchange, onclick, ondblclick, onkeydown, \n\nonkeypress,\
    \ onkeyup, onmousedown, onmousemove, onmouseout, onmouseover, \n\nonmouseup \\\
    - used to associate script with events triggered while the user is on this element.\
    \ \n\n• class, dir, id, lang, style, title \\- available for most HTML elements.\
    \ \n\nHere is that simple text input control in the context of a simple HTML page,\
    \ so we can see it in action \n\n(ch01\\_eg3 .htm): \n\n16"
