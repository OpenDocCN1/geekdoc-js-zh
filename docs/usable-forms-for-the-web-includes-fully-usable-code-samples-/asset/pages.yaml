    \ \n\nWhen or before a user submits some form data, you might like to use one\
    \ of the following \n\nscripts, which: \n\n• Force a checkbox to be checked before\
    \ the form can be submitted. \n\n• Allow you to use a link instead of a submit\
    \ button. \n\nEnforcing Checking a Checkbox Before Submitting \n\nIf you want\
    \ to ensure that a checkbox has been selected \\- for example, if you want prevent\
    \ a user \n\nfrom doing something unless they agree to certain terms and conditions\
    \ \\- you can add a function \n\nthat's called when the onsubmit event is fired.\
    \ (In fact, if you wish, you can validate a whole form \n\nusing this event, but\
    \ we'll concentrate on the one box for this example.) \n\nThe function checks\
    \ whether the checkbox has been checked, and the return value of the function\
    \ \n\n(true or false) will determine whether the form is submitted. If the checkbox\
    \ has not been selected, \n\nwe present the user with an alert box to indicate\
    \ that they must check the box, then the function returns \n\nfalse (and the form\
    \ is not submitted); otherwise it returns true and the form is submitted. \n\n\
    Here we're checking whether the checkbox has been ticked using the checkCheckBox\
    \ () method \n\nwhen the form is being submitted. If it's not selected, the user\
    \ cannot enter their form details \n\n(ch07\\_egl7. htm). \n\nfunction checkCheckBox(myForm)\
    \ \n\n{ \n\nif (myForm.agree.checked \\== false ) \n\n{ \n\nalert(’You must agree\
    \ to terms and conditions if you want to download this ' + \n\n'product.'); \n\
    \nreturn false; \n\n} \n\nelse \n\nreturn true; \n\n327"
