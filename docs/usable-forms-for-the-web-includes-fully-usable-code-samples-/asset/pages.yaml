- img_proc: true
  md: "![](img/a10b466d6e11a32674cad146197d13d9_80_0.png)![](img/a10b466d6e11a32674cad146197d13d9_80_1.png)\n\
    \nDesigning Usable Forms \n\nBefore we start, however, we should make a quick\
    \ note about something that crops up throughout \n\nthe chapter: accessibility.\
    \ \n\nAccessibility \n\nWhen designing your form, you need to take into account\
    \ accessibility issues. Accessibility is \n\nimportant to understand when designing\
    \ any web site, and forms are no exception. In this section, \n\nwe'll be noting\
    \ some important things to remember about accessibility. If you're not familiar\
    \ with the \n\ntopic, pick up a copy of Constructing Accessible Web Sites (Jim\
    \ Thatcher et al, giasshaus, ISBN \n\n1904151-00-0). \n\nThe aim of making a site\
    \ accessible is that it should be available to the largest number of users \n\n\
    possible. It's not just a case of making sure that users with disabilities can\
    \ use the site, as is often \n\nthought; it can include considering those with\
    \ older software or hardware and those who don't view \n\nimages in their browser.\
    \ Many of the issues we'll look at, however, do concern building a site that \n\
    \ncan be accessed by visitors with disabilities. \n\nThere are various sets of\
    \ guidelines relating to accessibility. These include: \n\n• The Web Accessibility\
    \ Initiative's Web Content Accessibility Guidelines, Version 1.0, May 5, \n\n\
    1999, \n\nhttp://www. w3. org/TR/WCA G10/. \n\n• The Access Board Electronic and\
    \ Information Technology Accessibility Standards, 36 \n\nCFR Part 1194, Web-based\
    \ Intranet and Internet Information and Applications (1194.22), \n\nhttp://www.\
    \ access-board. gov/sec508/guide/1194.22. htm. \n\n• The IBM Web Accessibility\
    \ Guidelines, Version 3.0, August 20, 2001, \n\nhttp://www-3. ibm. com/able/accessweb.\
    \ html. \n\nThe second of these corresponds to Section 508 of the US Rehabilitation\
    \ Act. In 2000, the United \n\nStates government legislated that all federally\
    \ purchased technology products had to meet these \n\nguidelines from 25 June\
    \ 2001. Other countries are quickly following suit in enforcing similar legislation.\
    \ \n\nWe'll be addressing some of the concerns that you should be aware of when\
    \ designing forms to \n\nensure that they are accessible. \n\nSelecting Types\
    \ of Controls \n\nWe met the different types of form control that are available\
    \ to form designers in Chapter 1. It's \n\nimportant to pick the right control\
    \ for the information you're trying to collect. Having already \n\ndetermined\
    \ the information that you need to collect with the form, you can select the type\
    \ of control \n\nthat you'll use for each item. Once you've done this, you'll\
    \ have an idea of the length and size of the \n\nform you're constructing. \n\n\
    If you want to allow the user to enter text: \n\n• and it's only a single line\
    \ of text, use an <input> element whose type attribute has the \n\nvalue of text.\
    \ \n\n• and you want the user to enter multiple lines of text, use a <textarea>\
    \ element. \n\n65"
