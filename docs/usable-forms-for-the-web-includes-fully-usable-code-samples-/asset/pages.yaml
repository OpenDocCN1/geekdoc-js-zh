    \ regarding your forms, and if you find \n\nthat there are a lot of users who\
    \ give up on a form at a particular stage, you'll get an idea of how long \n\n\
    a form your users will accept. Such a metrics collection process should be a part\
    \ of the plan for the \n\nproject. If it's not already part of the site, it's\
    \ a worthwhile addition to make. \n\nIt's also a very helpful exercise to log\
    \ the results of failed validation, so you can see what kinds of \n\ndata your\
