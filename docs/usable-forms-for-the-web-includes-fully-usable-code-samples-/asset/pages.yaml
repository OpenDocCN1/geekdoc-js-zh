  md: "![](img/a10b466d6e11a32674cad146197d13d9_316_0.png)![](img/a10b466d6e11a32674cad146197d13d9_316_1.png)\n\
    \nAdvanced Client-side Form Scripting \n\nIf your forms or controls share names\
    \ the page may load correctly but start throwing \n\nruntime errors, or it might\
    \ simply do nothing at run time; if you're getting these errors, \n\nchecking\
    \ for duplicate names is a good start. \n\nIn a lot of JavaScript member expressions,\
    \ the window object is often not used as a prefix to the \n\nmember expression,\
    \ because it's assumed that you're working with the current window. You only \n\
    \nneed reference this object explicitly if you're working with multiple windows.\
    \ \n\nLet's see a simple example where we retrieve the value of a text input and\
    \ write it to an alert box. \n\nHere's our form (ch07\\_egl.htm): \n\n<form name=\"\
    myForm\"> \n\ncinput type=\"text\" size=\"30\" value=\"Did you change the text?\
    \ \n\nname=\"myTextBox\" /> \n\ncinput type=''button\" value=\"Click for value\"\
    \ \n\nonclick=\"alert(document.myForm.myTextBox.value);\" /> \n\n</form> \n\n\
    Note that you have to put the button inside a <form> element, as Netscape can't\
    \ \n\ndisplay the contents of form controls outside of a <form> element \\- although\
    \ we could \n\nhave used a separate form element for each control. \n\nHere you\
    \ can see that we have a form called myForm and a text input box whose name is\
    \ \n\nmyTextBox. When we want to access a value in the form, we call it by name.\
    \ So, when the user \n\nclicks on the Click for value button, the onclick event\
    \ handler calls the alert () method, \n\nwhich displays the value of the control\
    \ called myTextBox that's part of the form myForm in the \n\ncurrent document.\
    \ \n\nHere's the result: \n\n0 Test form \n\njDid you change the text? \n\n(Pick\
    \ for value j \n\nInternet Explorer Script Alert \n\nDid you change the text?\
    \ \n\nfGO \n\nYou can put the value of a form element into a variable and use\
    \ it within your JavaScript, just as you \n\nmight use any other variable. \n\n\
    Let's move on to look at using various form controls in more detail. \n\n301"
