    \nChapter 6 \n\n• The simplest way to circumvent anyone posting code is not to\
    \ allow anything containing code \n\ndelimiters. Since HTML and PHP tags start\
    \ and end with angle brackets, you can just run a \n\nreplace on all text along\
    \ the lines of $my\\_text \\= preg\\_replace (\"/<.\\*>/\", \n\n$my\\_text); and\
    \ strip out anything that comes between a < and a \\> character. PHP has a \n\n\
    strip\\_tags () function that's supposed to get rid of HTML and PHP tags and that\
    \ even \n\npermits you to designate certain tags to be retained; however, there\
    \ are some known issues \n\nwith it. Among other things, it appears that it's\
    \ possible to get around it by using mixed case in \n\ntags (for example, something\
    \ like <aPplLEt> can get past this function). If you want to allow \n\nusers some\
    \ basic formatting, one way you can do this is by specifying some custom format\
    \ \n\nstrings, such as converting \\[b\\] ... \\[ /b\\] to <b> and </b>. Or you\
    \ can (dis)allow only certain \n\nHTML tags. At the very least, we recommend that\
    \ you get rid of any and all occurrences of \n\n<script>...</script>, <?php. ..?>,<?...\
    \ ?>, and <%...%> along with any and all \n\ncharacters coming between the opening\
    \ and closing tags in each case. Another alternative is to \n\nconvert all angle\
    \ brackets to their HTML entity equivalents (which can lead to somewhat \n\nembarrassing\
    \ results) \\- see the PHP documentation for the htmlspecialcharacters () and\
    \ \n\nhtmlentities () functions, for more information. In our example form below,\
    \ we take care of \n\nthis problem by simply not allowing the use of the angle\
    \ bracket characters. \n\nGeneric Form Handler \n\nOur strategy will be similar\
    \ in many respects to that we followed for the client-side version, but there\
    \ will \n\nbe some differences. Instead of popping up a dialog with the errors\
    \ listed (we can't really do that in a \n\nserver-side script anyway) we'll redisplay\
    \ the form with the user input preserved and list all problems \n\nimmediately\
    \ above it. We'll also use a somewhat shorter form, a donation form for a non-profit\
    \ \n\norganisation. Let's dive straight into the code, which you'll find in the\
    \ file testform.php, and we'll explain as \n\nwe go through it. \n\nFirst we initialize\
    \ an error message string, which we'll add to with each error that we encounter.\
    \ \n\n<?php \n\n$err\\_msg \\= \"<p>There were problems with the following field(s):</p>\\\
    \\n<p>\"; \n\nThis is the form validation function that we'll use to check all\
    \ the fields in the form. It will return a value of \n\ntrue or false depending\
    \ on whether any incorrect form field values are encountered. \n\nfunction validate()\
    \ \n\n{ \n\nVariables created external to the function need to be declared global\
    \ so we can access them inside it. \n\nglobal $HTTP\\_POST\\_VARS; \n\nglobal\
    \ $err\\_msg; \\\\ \n\nThe return value of the function is initialized to true.\
    \ \n\n$validated \\= TRUE; \n\n272"
