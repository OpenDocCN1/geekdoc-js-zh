  md: "![](img/a10b466d6e11a32674cad146197d13d9_363_0.png)![](img/a10b466d6e11a32674cad146197d13d9_363_1.png)\n\
    \nChapter 8 \n\nThis still leaves one question unanswered though. How do we get\
    \ hold of the <asp: label> control \n\nwithin our ASP.NET code? Well, we can do\
    \ this by adding some ASP.NET code at the head of the \n\nHTML, as in the following\
    \ example. First delete the text attribute from both <asp:label> controls: \n\n\
    <asp:label id=\"Messagel\" runat=\"server\" /> \n\nyou have ordered the \n\n<asp:label\
    \ id=\"Message2\" runat=\"server\" /> \n\nNow add the following ASP.NET code:\
    \ \n\n<script language=\"vb\" runat=”server\"> \n\nSub Page\\_Load() \n\nMessagel.Text\
    \ \\= \"Cobi\" \n\nMessage2.Text \\= \"Artichoke and Onion \n\nEnd Sub \n\n</script>\
    \ \n\n<html> \n\n<head> \n\n<title>Label Control page</title> \n\nIf you run the\
    \ example above, you'll see that the output has changed: \n\nr \n\n3 Label Control\
    \ page \\- Microsoft Internet Explorer \n\n00® \n\nFile Edit \n\nView Favorites\
    \ Tools Help \n\n& | \n\n© \n\nBack \n\na \n\nForward Stop \n\na €> \n\nRefresh\
    \ Home \n\nP \n\nSearch \n\n☆ \n\nFavorites \n\n» \n\nAddress |\" \n\nhttp: //localhost/label.\
    \ aspx \n\nv Go \n\nLinks ” \n\nNorton AntiVirus Q ▼ \n\nPizzaThis! Pizzas \n\n\
    Thank you Cobi you have ordered the Artichoke and Onion pizza. It will be delivered\
    \ within the next \n\nhour. \n\nDone .... ... ... I ; i , \\* Internet \n\nHere\
    \ we've added the Sub Page\\_Load() subroutine of our code, which we'll examine\
    \ in more detail \n\nlater in this chapter. For now all you need to know is that\
    \ Page\\_Load () will be called every time the \n\npage is loaded or refreshed,\
    \ and therefore any code that is placed in it will be run at this time too. \n\
    \nThis is as good a place as any to put ASP.NET code that doesn’t rely on a particular\
    \ control or event \n\nto trigger it, and throughout this chapter and indeed in\
    \ many ASP.NET applications, you will see the \n\nASP.NET code placed in this\
    \ subroutine. \n\n348"
