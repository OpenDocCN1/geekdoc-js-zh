    \ of a function literal while we're at it). We make sure that, \n\nwhen the page\
    \ is loaded, all the checkboxes are cleared. \n\nwindow.onload=function(){var\
    \ colors=document.pickColor.cdlors; \n\nfor(var i=0;i<colors.length;i++)colors\\\
    [i\\].checked=false;}; \n\n« \n\n252"
