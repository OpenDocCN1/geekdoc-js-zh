  md: "![](img/a10b466d6e11a32674cad146197d13d9_365_0.png)![](img/a10b466d6e11a32674cad146197d13d9_365_1.png)\n\
    \nChapter 8 \n\nMessage.text \\= \"You have selected \" & listl.Selectedltem.Value\
    \ \n\nEnd If \n\nEnd Sub \n\n</script> \n\n<html> ' \n\n<head> \n\n<title>Drop\
    \ Down List Example</title> \n\n</head> \n\n<body> \n\n<asp:label id=\"Message\"\
    \ runat=\"server\"/> \n\n<br /> \n\n<form runat=\"server\"> \n\nWhat variety of\
    \ pizza do you wish to order?<br /xbr /> \n\n<asp:dropdownlist id=\"listl\" runat=\"\
    server\"> \n\n<asp:listitem>Four Cheese</asp:listitem> \n\n<asp:listitem>Artichoke\
    \ and Onion</asp:listitem> \n\n<asp:listitem>Margherita</asp:listitem> \n\n</asp:dropdownlist>\
    \ \n\n<br /xbr /xbr /xbr /> \n\n<input type=”Submit\" /> \n\n</form> \n\n</body>\
    \ \n\n</html> \n\nIf you make a selection and submit it, it will display the following:\
    \ \n\nNote that the dropdown list now contains the choice the user last made.\
    \ \n\nHow do we know not to display a message the first time the user hits the\
    \ page, before any selection \n\nhas been made? This is done at the head of the\
    \ form, and is buried within the Page\\_Load () \n\nsubroutine. \n\n350"
