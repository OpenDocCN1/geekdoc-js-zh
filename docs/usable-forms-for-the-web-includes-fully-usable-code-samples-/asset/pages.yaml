    input element: \n\n• submit creates a 'submit' button. \n\n• reset creates a 'reset'\
    \ button. \n\n• button creates a 'push' button (this is the default if no other\
    \ is specified). \n\n• name gives the button a control name. \n\n• value will\
    \ be sent to the server as a name/value pair \\- if no value is given then the\
    \ name/value \n\npair is not sent to the server. \n\nHere's the full list of attributes\
    \ that can be used with the <button> element: \n\n• type, name, value \\- which\
    \ we've just seen. \n\n• disabled, accesskey, tabindex \\- which we discuss later\
    \ in the chapter. \n\n• id, class, lang, dir, title, style \\- which are available\
    \ to most HTML elements. \n\n• onfocus, onblur, onclick, ondblclick, onmousedown,\
    \ onmouseup, onmouseover, \n\nonmousemove, onmouseout, onkeypress, onkeydown,\
    \ onkeyup — as before, for use with script. \n\nNote, a form can have more than\
    \ one submit button. While the form will be sent to the \n\nsame place, each submit\
    \ button can be associated with different actions on the server \\- \n\nfor example,\
    \ you could have submit buttons whose name and/or value could indicate \n\nwhether\
    \ the button lets you subscribe or unsubscribe to a mailing list application.\
    \ You \n\ncould also associate these with a script function that's called when\
    \ the form is submitted \n\nusing the onsubmi t event. \n\nCheckboxes \n\nCheckboxes\
    \ are like on/off switches \\- they are either checked or not. The user can select\
    \ and deselect \n\ncheckbox items to toggle them on and off. When checked, the\
    \ control is on. \n\nYou can have either individual checkboxes that have their\
    \ own names or a group of several checkboxes \n\nthat share a control name and\
    \ allow users to select several values for the same property. \n\n23"
