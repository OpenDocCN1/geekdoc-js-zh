    \ () methods (in that order) to add focus to the correct \n\nform control and\
    \ to select its contents. The same method would also work on a single-line text\
    \ input \n\nand a password field. \n\nFinding Characters using replace() \n\n\
    One feature you might like to offer with textboxes (or single-line text inputs)\
    \ is the ability to replace \n\ncertain characters. We can use JavaScript's helpful\
    \ replace () method here to replace certain \n\ncharacters with an alternative\
    \ substring. \n\nreplace () allows us to specify a character or set of characters\
    \ that we want to replace using a \n\nregular expression or a string. This is\
    \ the first argument of the method. The second argument is the \n\nreplacement\
    \ for the character(s) defined in the regular expression. This second argument\
    \ may just \n\nbe a replacement substring, or it can be a function that determines\
    \ what the replacement substring \n\nshould be \\- the return value being used\
    \ as the replacement substring. \n\nThe syntax for the replace () method is: \n\
    \nstring.replace(regEx, newSubString); \n\nstring.replace(regEx, function); \n\
    \nHere's a simple example (ch07\\_egl0.htm). We use the replace () method on a\
    \ text area and look \n\nfor the string url within the text-box. Where that occurs,\
    \ we replace it with the string abc. \n\n<form name=\"myForm\"> \n\nctextarea\
    \ name=\"myTextArea\" cols=\"40\" \n\n• rows=\"10\">I am interested in Curl, here\
    \ is a url for it.</textarea> \n\n<input type=\"button\" value=\"Replace characters\
    \ url\" \n\nonclick=\"document.myForm.myTextArea.value= \\\\ \n\ndocument.myForm.myTextArea.value.replace(/url/gi,\
    \ 'abc');\" /> \n\n</form> \n\nNote, however, that this would also change the\
    \ word Curl into Cabc, so we should add a \\\\b on \n\neither side of the string\
    \ url to indicate that we want a word boundary: \n\nonclick=\"document.myForm.myTextArea.value=\
    \ \n\ndocument.myForm.myTextArea.value.replace(/\\\\burl\\\\b/gi, 'abc');\" \n\
    \n312"
