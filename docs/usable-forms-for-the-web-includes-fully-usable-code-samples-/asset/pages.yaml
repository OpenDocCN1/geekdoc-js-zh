  md: "![](img/a10b466d6e11a32674cad146197d13d9_317_0.png)![](img/a10b466d6e11a32674cad146197d13d9_317_1.png)\n\
    \nChapter 7 \n\nText Input \n\nWhen working with text inputs, there are a number\
    \ of things that we can do with script, both to aid \n\nnavigation and to help\
    \ processing. We'll start by looking at: \n\n• How to put focus on a text input\
    \ when a form loads. \n\n• How to change focus when a certain number of characters\
    \ have been entered. \n\n• How to disable a text input, and how to re-enable it\
    \ when a user selects another form control. \n\nWe'll then go on to look at how\
    \ we deal with the entries that a user makes: \n\n• How to change the case of\
    \ an entry. \n\n• How to trim leading and trailing spaces from a text input. \n\
    \n• How to ignore and remove spaces from a text input. \n\n• How to count the\
    \ number of characters in a text input. \n\nFocus on First Form Item \n\nIf you\
    \ expect your users to start entering data into a textbox as soon as it loads,\
    \ then it's helpful to \n\nadd focus to the first textbox. This saves the user\
    \ from having to move the mouse to that point and \n\nthen switch to the keyboard\
    \ to enter data. \n\nTo do this, simply add an onload event handler to the <body>\
    \ element of the document. This \n\nhandler points to the control that you want\
    \ to highlight and uses the focus () method to give it focus, \n\nlike so: \n\n\
    <body onload=\"document.myForm.myTextBox.focus();\"> \n\nNote that the onload\
    \ event fires when the complete page has loaded. \n\nAuto Tabbing to Next Field\
    \ When Field is Full \n\nWe can also use the focus () method to automatically\
    \ pass the focus of one control on to another \n\ncontrol when a certain number\
    \ of characters have been entered. An example of where this would be \n\nuseful\
    \ is when you're asking for a credit card number. All Mastercard credit card numbers\
    \ contain 16 \n\ndigits, so you can make it easier for the Mastercard user to\
    \ enter their number by splitting the entry \n\ninto four boxes of four digits\
    \ (note that this is not the same for all credit cards; Visa card numbers \n\n\
    can contain 13 or 16 digits, and Amex have 15). When the user has entered four\
    \ digits, the focus on \n\nthe form will automatically change to the next box,\
    \ without requiring the user to tab or manually \n\nchange focus. \n\n302"
