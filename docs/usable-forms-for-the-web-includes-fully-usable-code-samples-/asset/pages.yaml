    \ \n\n} \n\ntd { \n\nfont-family:geneva, verdana, arial, sans-serif; \n\ncolor:#000000;\
    \ \n\n} \n\nimg{ \n\nborder:none ; \n\n} \n\na { \n\nfont-family:geneva, verdana,\
    \ arial, sans-serif; \n\n} \n\nLayout of Forms \\- Summary \n\n• When using tables\
    \ for layout, be aware of the way that screen readers will present them. \n\n\
    • Be sure to clearly indicate which parts of your form are mandatory. \n\n• Position\
    \ buttons logically. \n\n• Provide alternative text for images, in case the user\
    \ can't see the image for some reason. \n\n• Use the tabindex attribute to help\
    \ users without a pointing device. \n\n• Stick to a single column of form controls\
    \ to ensure usability. \n\n• Position the labels for your controls so that it's\
    \ obvious which label corresponds to which \n\ncontrol. \n\n• Never rely on color\
    \ alone to convey information to a user. \n\nTesting the Form \n\nOnce you've\
    \ finished designing the form and have built a copy of it, it's time to test!\
    \ It's very easy to \n\nget close to a design and think it will be as usable for\
    \ others as it is for you. There's no substitute, \n\nhowever, for testing it.\
    \ \n\n87"
