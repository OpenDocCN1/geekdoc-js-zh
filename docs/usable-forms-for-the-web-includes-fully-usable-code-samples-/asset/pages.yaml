    \ id=\"radiol” runat=\"server\" /> \n\nB<asp:radiobutton id=\"radiol\" runat=\"\
    server\" /> \n\nC<asp:radiobutton id=\"radiol\" runat=\"server\" /> \n\nInstead,\
    \ you have to set each id attribute to a distinct value, and the GroupName property\
    \ to have \n\nthe same name, as follows: \n\nA<asp:radiobutton id=\"radiol\" groupname=\"\
