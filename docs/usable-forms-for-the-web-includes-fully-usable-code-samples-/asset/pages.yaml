  md: "![](img/a10b466d6e11a32674cad146197d13d9_307_0.png)![](img/a10b466d6e11a32674cad146197d13d9_307_1.png)\n\
    \nChapter 6 \n\nNow we're ready to use the function we just wrote. We declare\
    \ a variable named Valid and initialize its \n\nvalue to true. \n\nDim Valid \n\
    \nValid \\= True \n\nWe test to see if the form in this page has yet been submitted\
    \ by checking for the value of a form control \n\nnamed Submit, if this value\
    \ is equal to the string submit, then we know the form's been submitted and \n\
    \nit's time to call the Validate () function. \n\nIf Request.Form(\"submit\")\
    \ \\= \"Submit\" Then \n\nValid \\= Validate() \n\nEnd If \n\nAt long last we've\
    \ reached the beginning of the HTML document, with all the usual accoutrements\
    \ thereof: \n\nDOCTYPE declaration, <head> element including <charset>, <meta>,\
    \ <title>, and so on. \n\n<!D0CTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"\
    \ \n\n\"http://www.w3.org/TR/html4/loose.dtd\"> \n\n<html> \n\n<head> \n\n<meta\
    \ http-equiv=\"Content-Type\" content=\"text/html; charset=iso-8859-l\" /> \n\n\
    <title>Sample Form \\-- ASP Validation</title> \n\n</head> \n\n<body bgcolor=\"\
    #FFFFFF\" text=\"#000000\"> \n\n<% \n\nTime for some more ASP code. We check the\
    \ value of Valid \\- if it's not True, we know that the form \n\nwas submitted,\
    \ that there were errors encountered, and that we need to inform the user about\
    \ those \n\nerrors. We Response .Write opening tags for a single-celled table,\
    \ followed by the error message itself, \n\nand then the closing tags for the\
    \ cell, row, and table. (Recall that chr (34) is another way to represent a \n\
    \ndouble quotation mark, which we employ to insure that all our HTML attribute\
    \ values are quoted as per \n\nthe W3C standard.) \n\nIf Valid <> True Then \n\
    \nResponse.Write \"ctable border=\" & Chr(34) & \"2“ & Chr(34) & \" bordercolor=\"\
    & \n\nChr(34) & \"#CC0033\" & Chr(34) \n\nResponse.Write \" bgcolor=\" & Chr(34)\
    \ & \"#FFFEE\" & Chr(34) & \" cellpadding=\" & \n\nChr(34) & \"2\" & Chr(34) &\
    \ \">\" \n\nResponse .Write vbCrLf & \"<trxtd>\" \n\nResponse.Write ErrMsg \\\\\
    \ \n\nResponse.Write \"</tdx/tr>\" & vbCrLf & \"</table>\" & vbCrLf \n\nEnd If\
    \ \n\nIf the form's been submitted and validated successfully, then we display\
    \ a report listing the \n\ninformation that was submitted. In a real-world application,\
    \ we'd be doing something more useful in \n\naddition to or instead of this, such\
    \ as generating an e-mail or storing the information obtained from \n\nthe form\
    \ in a database."
