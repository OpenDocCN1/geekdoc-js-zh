    \\\\*\\]?\\\\d{3}\\[ \\-\\\\.\\\\\\*\\]?\\\\d{4}$/; \n\nOr, since it's not very\
    \ common in the US or Canada to write telephone numbers using asterisks, let's\
    \ \n\ndispense with those. \n\nvar phoneFormat=/'sl \\[ \\-\\\\.\\]?\\\\d{3}\\\
    [ \\-\\\\.\\]?\\\\d{3}\\[ \\-\\\\. \\] ?\\\\d{4}$/; \n\nYou can test this regular\
    \ expression in the file telephone.html, which you’ll find included in the code\
