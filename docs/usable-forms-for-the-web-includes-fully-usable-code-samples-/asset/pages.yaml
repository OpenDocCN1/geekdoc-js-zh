    \nChapter 2 \n\nCareful Placement of Buttons \n\nIf you're using buttons, or images\
    \ as buttons, then you should be very careful about positioning \n\nthem. Firstly,\
    \ they should be placed close to the relevant part of the form. If you're allowing\
    \ the user \n\nto select a product in an online store, the button to buy that\
    \ product should be close to the product. \n\nFor example: \n\n0 What I really\
    \ want is- \n\n# \n\nHawaii 5 Ohl \n\nCop a load of \n\nthis; \n\nCheese, pinapple,\
    \ \n\nmushroom. \n\nSelect j \n\nYou talking to me: \n\nChickem, cheese, \n\n\
    Veggie Delux \n\nVegelicious: \n\nRoasted \n\nvegetables, \n\nonion, olives. \n\
    \nSelect j \n\nSelect) \n\nLJ \n\nor: \n\nIf you're using next or back buttons,\
    \ make sure that they're on the correct side of the page. If you \n\nwant to get\
    \ the user to go to the next screen, it should be on the right-hand side. You\
    \ can think of it \n\nbeing like a right-hand page of a book, which you have to\
    \ turn to get to the next page. If you want a \n\nback button, it should be on\
    \ the left. \n\n80"
