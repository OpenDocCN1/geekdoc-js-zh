    \ \n\narrDelivery(0) \\= strStreet \n\narrDelivery(1) \\= strSuburb \n\narrDelivery(2)\
    \ \\= strPostcode \n\narrDelivery(3) \\= strTelcode \n\narrDelivery(4) \\= strTelno\
    \ \n\narrDelivery(5) \\= strSpecialinstruct \n\nNow that all of the delivery information\
