  md: "![](img/a10b466d6e11a32674cad146197d13d9_179_0.png)![](img/a10b466d6e11a32674cad146197d13d9_179_1.png)\n\
    \nChapter 4 \n\nSummary \n\nIn this chapter, we've seen how to use forms with\
    \ our ASP applications. \n\nWe started by looking at how to retrieve data from\
    \ the query string and Form collection of the \n\nRequest object. \n\nWe've seen\
    \ how we can use hidden form controls, cookies, and the ASP Session object to\
    \ maintain \n\nstate in our applications and remember details about our users.\
    \ Which of these three methods you \n\nchoose will largely depend on the application\
    \ you're writing. Hidden forms are ideal for small \n\namounts of data; however,\
    \ they can get complicated if you're passing several pieces of information. \n\
    \nCookies and ASP sessions allow you to store information without the complexity\
    \ of keeping track of \n\nevery variable in each page as you move between them.\
    \ We've seen that sessions should be used \n\ncarefully \\- or rather, sparingly.\
    \ \n\nThe second part of this chapter looked at a sample shopping application,\
    \ which demonstrated a \n\nmixture of techniques that we can use with form data:\
    \ \n\n• http post methods for data about the user. \n\n• http get methods for\
    \ data about the pizza, size, quantity, and toppings. \n\n• Retrieving data from\
    \ the query string and form collections and putting values in variables. \n\n\
    • Hidden form fields for selecting which pizza was chosen and which items to delete.\
    \ \n\n• ASP sessions to store user and shopping cart data. \n\n• Database connections\
    \ for registering and validating usernames and passwords. \n\nNow you can take\
    \ these techniques and incorporate them into your own ASP applications. \n\n164"
