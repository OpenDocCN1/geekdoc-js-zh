    \nForms and ASP \n\nBefore presenting the next options, however, we have to deal\
    \ with the data from the previous form \\- \n\nthe values of the form controls\
    \ that have the names time and del. We do this by putting these \n\nvalues into\
    \ variables called strTime and strDel, and then writing these to the Session object.\
    \ \n\nThis uses exactly the same method that we saw in the earlier section on\
    \ storing form data in the \n\nSession object. \n\nCreating the Cart \n\nOn this\
    \ page, we also create the cart that will be used in the following page when the\
    \ user starts \n\nordering their pizza. \n\nThe cart is a resizable two-dimensional\
    \ array. Two-dimensional arrays cause some people problems, \n\nbut if you think\
    \ of them like a table or spreadsheet, they're easy to use. You can imagine the\
    \ array \n\nwe're creating to be like the following table (with some sample data):\
    \ \n\nintQty \n\nstrSize \n\nstrPizza \n\nstrTops \n\nintPrice \n\n2 \n\nFamily\
    \ \n\nHawaii \n\nPepperoni, Onion \n\n22.98 \n\n1 \n\nRegular \n\nVege \n\nOlives\
    \ \n\n9.99 \n\n1 \n\nCoke \n\n2.99 \n\n1 \n\nGarlic \n\n2.99 \n\nHere you can\
    \ see orders for two types of pizza, a coke, and a garlic bread. \n\nWe set up\
    \ the array as having five columns and no rows, because we've not started adding\
    \ orders \n\nyet. We make the array resizable using the Redim command. (If you're\
    \ using JavaScript, rather \n\nthan VBScript, then you don't have multidimensional\
    \ arrays \\- you have to fake them using an \n\narray of arrays.) \n\nThe cart\
    \ will be stored in the ASP Session object. When we edit it, however, we'll work\
    \ with it by \n\ncreating a copy of it in script and then replacing the array\
    \ in the Session object. You'll be able to tell \n\nthe difference between the\
    \ two in code because we refer to the one in the ASP session using \n\nSession\
    \ (\"Cart\"), while the local copy is called arrCart (to keep in line with the\
    \ convention of \n\nprefixing ASP variables with appropriate data-type prefixes).\
    \ \n\nWe only want to create it, however, if we don't already have one \\- if\
    \ the user has accidentally clicked \n\nBack in their browser, we don't want to\
    \ write over their existing order. So, we check if \n\nSession (\"Cart\") is empty,\
    \ and only if it is do we create a new array and add that to the session. \n\n\
    'define arrCart, which holds the cart for the session \n\nIf IsEmpty(Session(\"\
    Cart\")) Then \n\nRedim arrCart(5,0) ’a resizable array with 6 properties \n\n\
    Sessionf\"Cart\") \\= arrCart \n\nSession(\"ItemCount\") \\= 0 'track the number\
    \ of items in the cart \n\nEnd If %> \n\nWe also add an item count to the session,\
    \ indicating the number of lines that are in the cart, to allow \n\nus to iterate\
    \ through the array later. \n\n147"
