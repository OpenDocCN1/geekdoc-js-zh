    \nAdvanced Client-side Form Scripting \n\nThe syntax for the substring () function\
    \ is: \n\nobject.substring(startPosition, endPosition) \n\nIt returns the string\
    \ from the given points \\- if no end position is given, then the default is the\
    \ end of \n\nthe string. The start and end positions are zero-based, so the first\
    \ character is 0. \n\nTo remove leading space, while the first character is a\
    \ space, we select the substring from the \n\nsecond character (remember it s\
    \ zero-based, so this number is 1) to the end. To trim whitespace \n\nfrom the\
    \ end of the entry, we first have to create a substring containing the last character,\
    \ so that we \n\ncan check whether it s a space. The start position of this substring\
    \ is the length of the string minus 1, \n\nand the end position is the full length.\
    \ If this substring is a space, we repeat the whole procedure \n\nwith the substring\
    \ from the beginning of the input to the end of the original string less 1, and\
    \ continue \n\nuntil we have no spaces at the end. \n\nAs regular expressions\
    \ have been supported since Netscape 4 and IE 4, you can also use a regular \n\
    \nexpression to trim the spaces, like so: \n\nUsing regular expressions: \n\n\
    <form> \n\n<input type=\"text\" name=\"removeLeadingAndTrailingSpace\" size=\"\
    100\" \n\nvalue=\" Enter text with leading and trailing whitespace, \n\nthen change\
    \ focus. \" \n\nonblur \\= \n\n\"this.value= this.value.replace(/A\\\\s+/, replace(/\\\
    \\s+$/, /> \n\n<br /> \n\n</form> \n\nThis removes both trailing and leading spaces.\
    \ \n\nRegular expressions are covered in Chapter 6, Form Validation Techniques.\
    \ \n\nIgnoring Spaces \n\nIt can also be helpful to strip space from within a\
    \ field (that is, whitespace that's not necessarily at \n\nthe beginning or the\
    \ end of a string), such as when a user puts whitespace in a postcode or a phone\
    \ \n\nnumber. We might need to perform this within a number of elements, so we'll\
    \ stick it in a JavaScript \n\nfunction in the head of the document. Then, when\
    \ focus moves from a form control, we call the \n\nfunction, passing the value\
    \ of the control to it (ch07\\_eg6.htm): \n\n<html> \n\n<headxtitle>White space</title>\
    \ \n\n<script language=\"JavaScript\"> \n\n<!— Begin \n\nfunction stripSpace (stringlnput)\
    \ { \n\nvar strTemp \\= \n\nstringlnput \\= '1 + stringlnput; \n\nvar splitstring\
    \ \\= stringlnput.split(\" \"); \n\nfor(var i \\= 0; i < splitstring.length; i++)\
    \ \n\nstrTemp += splitstring\\[i\\]; \n\nreturn strTemp; \n\n307"
