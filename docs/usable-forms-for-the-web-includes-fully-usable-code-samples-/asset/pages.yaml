    The above is included in the code download as zipcode2.html. A couple of notes\
    \ about the code: \n\n• JavaScript tries to convert between data types automatically,\
    \ and provides two built-in functions \n\nparseint () and parseFloat () to convert\
    \ strings to numbers when we need to perform this \n\nexplicitly. These are often\
    \ quite helpful, but occasionally they can be something of a mixed \n\nblessing.\
    \ That's because JavaScript lops off any trailing non-numeric characters in the\
    \ string, \n\nbeginning with the first non-digit, so \"4536S\" gets converted\
    \ to the number 4536, and \"453b5\" \n\ngets converted to 453. So the only time\
    \ we call tell for sure that the string isn't a proper number \n\nvalue is if\
    \ its first character isn't a digit. \n\n• In order to get around this, we've\
    \ written our own helper function that goes through the string, \n\ncharacter\
    \ by character, and checks to see if each is a number or not by using the parseint\
    \ () \n\nfunction on it. If the character isn't a digit, parseint () will return\
    \ NaN, which is a special \n\nJavaScript value meaning \"Not A Number\". One of\
    \ NaN's properties is that it's not equal to any \n\nother value, not even itself.\
    \ To test whether or not an expression returns NaN, we have to use it \n\nas the\
    \ argument to the isNaN () function, which returns true if the argument isn't\
    \ a number, \n\nhence the expression if ( isNaN (parseint (currehar)) ). The isNaN\
    \ () function should \n\nreturn true for any string that contains non-digits,\
    \ but it's unreliable: on some platforms it's \n\nbeen observed to exhibit similar\
    \ behaviour to parseint () in that it only performs properly if \n\nthe first\
    \ character in the string is a non-digit. Since we test one character at a time,\
    \ that's not a \n\nproblem for us here. \n\n242"
