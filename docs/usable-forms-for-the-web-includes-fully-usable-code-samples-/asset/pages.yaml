  md: "![](img/a10b466d6e11a32674cad146197d13d9_34_0.png)![](img/a10b466d6e11a32674cad146197d13d9_34_1.png)\n\
    \nHTML Forms \n\nThe content of the element (what's between the opening and closing\
    \ <textarea> elements) is the initial \n\nvalue. The initial value in this example,\
    \ Add your opinion here!, is rendered to the user when the text \n\narea loads,\
    \ and it can be used as a tip for what they should enter. If it's not altered,\
    \ this is also the text \n\nthat will be sent as the value associated with the\
    \ name txtOpinion. \n\nThe attributes that the <textarea> element can take are\
    \ as follows: \n\n• name is the name of the control. \n\n• rows is used to indicate\
    \ how many rows of text the text area should offer the user (or the height \n\n\
    of the text area). If they want to write more than the text area allows for, then\
    \ the browser \n\nshould offer a way to scroll through the text (in the screenshot\
    \ for this example, you can see the \n\nscrollbars, which are not activated).\
    \ The value should be an integer number. \n\n• cols is the number of columns that\
    \ should be displayed to the user (or the width of the text \n\narea) \\- the\
    \ column is the average character width. By default, the browser will wrap the\
    \ content \n\nof the text area when the user enters more than one line of data.\
    \ \n\nAs we've seen, by default a browser will wrap the text when the user gets\
    \ to the end of the line. While it's \n\nnot part of the HTML 4.01 recommendation,\
    \ there is another attribute that both of the major browsers \n\nsupport. This\
    \ is the wrap attribute, which can be used to control the wrapping of text in\
    \ a <textarea> \n\nelement. It can take one of three values: \n\n• off: which\
    \ means the text is not wrapped inside the box unless the user enters a carriage\
    \ \n\nreturn with the enter key and starts a new line. \n\n• physical: where the\
    \ text is wrapped inside the box, and carriage returns are added at the end \n\
    \nof each line when the information is sent to the server. \n\n• virtual: where\
    \ text is wrapped inside the box but is sent to the server as a single string,\
    \ \n\nwithout any additional carriage returns. This is the default. \n\nBoth the\
    \ physical and virtual options make it easier for users to enter text, as it's\
    \ more readable; \n\nthey can see the content of the sentence in one without scrolling.\
    \ \n\nAs with the <input> element whose type is text, it's common to associate\
    \ script with the following events \n\nthat can be fired when the user is on the\
    \ <textarea> element: \n\nonblur, onchange, onfocus, onselect, onkeydown, onkeypress,\
    \ onkeyup \n\nHere's the full list of attributes that can be used with a <textarea>\
    \ element: \n\n• name, rows, cols — which we've seen \n\n• wrap \\- which is supported\
    \ by the browsers, although it's not part of the HTML recommendation \n\n• accesskey,\
    \ tabindex, disabled, readonly \\- which we discuss later in the chapter \n\n\
    • class, dir, id, lang, style, title \\- available to most HTML elements \n\n\
    • onblur, onchange, onfocus, onselect, onclick, ondblclick, onkeydown, \n\nonkeypress,\
    \ onkeyup, onmousedown, onmousemove, onmouseout, onmouseover, \n\nonmouseup \\\
    - as before, for use with script \n\n19"
