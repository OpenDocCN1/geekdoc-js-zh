    ADODB.Connection\") %> \n\n<!--tinclude file=\"inc\\_connect.asp\"--> \n\n<% ConnObj.Open(MyConnStr)\
    \ \n\nCommand \\= \"SELECT Username, Password FROM tblUsers \" \n\nCommand \\\
    = Command & \"WHERE Username \\= ’\" & Request.Form(\"username\") & V AND \" \n\
    \nCommand \\= Command & \"Password \\= & Request.Form(\"pwd\") & \n\nSet rstLogin\
    \ \\= ConnObj.Execute(Command) \n\nHaving run the query, we enter another if.\
    \ .. Then... Else block. If we run through the database \n\nand don't find a match\
    \ for the username and password provided, we ask the user to try again or to \n\
    \nregister if they've not yet done so: \n\n144 \n\n%"
