  md: "![](img/a10b466d6e11a32674cad146197d13d9_300_0.png)![](img/a10b466d6e11a32674cad146197d13d9_300_1.png)\n\
    \nForm Validation Techniques \n\nNote that some of these functions can take optional\
    \ arguments in addition to those given above; consult a \n\nVBScript language\
    \ reference if you require more complete documentation. \n\nSome ASP / IIS Security\
    \ Issues \n\nMany of the general security issues associated with Active Server\
    \ Pages forms are not much different \n\nfrom those associated with other server\
    \ programming platforms and our objectives are, naturally, much \n\nthe same as\
    \ well. Space limitations prevent us from going into too much detail, but we can\
    \ offer you a few \n\npieces of advice: \n\nFirst and foremost, always make sure\
    \ that your server's operating system and server software have the \n\nlatest\
    \ updates and security patches applied, as they become available. For the vast\
    \ majority of ASP \n\ndevelopment environments, this means regular visits to the\
    \ Windows Update and Security pages at \n\nMicrosoft.com. If you don't administer\
    \ your site's server, it never hurts to talk about this to whoever is in \n\n\
    charge of it to make sure that this is being done. The propagation of some server\
    \ exploits, such as the \n\nCode Red and Code Blue viruses, is evidence that a\
    \ great many Windows servers are not being secured. \n\nRemember that, in an interconnected\
    \ environment such as the public Web, you're responsible not only for \n\nyour\
    \ own site's security, but that of others as well: a good Internet neighbor tries\
    \ to insure that his or her \n\nown site isn't being used as a springboard for\
    \ attacks on others' sites as well. \n\nIf there are static HTML pages as well\
    \ as Active Server Pages on your site, separate them into different \n\ndirectories.\
    \ Disable Read permissions on directories containing the ASP pages; this helps\
    \ to keep \n\nmalicious exploits (such as the old trick of appending :: $data\
    \ to URLs in order to expose source code) \n\nfrom working. For good measure,\
    \ disable Execute permissions on directories containing only static \n\ncontent\
    \ such as HTML pages, images, etc. \n\nIf you run your own Windows-IIS server,\
    \ move your web and application roots to non-default directories. If \n\npossible,\
    \ they should be located elsewhere than on the c: \\\\ drive. Doing so will stop\
    \ many common \n\nexploits which depend on knowing the default names and locations\
    \ of these in IIS-based sites. \n\nIf you run an online forum or other site (or\
    \ section of one) where visitors can post content that'll be viewed \n\nonsite,\
    \ consider disabling the use of HTML tags or at least filtering out <object> and\
    \ <script> tags \n\n(and scripting event handlers from other HTML tags) in user-posted\
    \ text. This will help prevent your site \n\nfrom being used to harass or compromise\
    \ your users. \n\nFinally, keep yourself up to date on security issues: as the\
    \ saying goes,\"Forewarned is forearmed.\" For \n\nASP developers and administrators,\
    \ some good sources of security information on the Web include: \n\nMicrosoft's\
    \ Security Bulletins (see listing at http://www.microsoft.com/security/); the\
    \ Security pages at \n\n4guysfromrolla (http://www.4guysfromrolla.com/webtech/LearnMore/Security.asp);\
    \ and SecurityFocus, \n\nwhich hosts the BugTraq mailing list and also maintains\
    \ a series of advisory articles about security issues \n\nparticular to Microsoft\
    \ technologies (see http://oniine.securityfocus.com/microsoft/). \n\nGeneric Form\
    \ Handler \n\nNow it's time to dive into the code for our ASP form handler example,\
    \ which you'll find as the file \n\ntestform.asp in the ch6 folder of the code\
    \ download. The basic methodology is the same as for the \n\nJavaScript and PHP\
    \ versions we presented above: we use the names of the form’s elements to hold\
    \ \n\ninformation about what each field is supposed to contain. (In other words,\
    \ we're using the form field \n\nnames to store field meta data.) As a matter\
    \ of good coding practice, we start off our VBScript code with \n\nan Option Explicit\
    \ declaration, which forces us to declare all variables before assigning them\
    \ values \n\nor otherwise making use of them. The first variable we declare is\
    \ ErrMsg, which we then initialize to \n\ncontain the opening line of the error\
    \ message we'll be showing the user if necessary. \n\n285"
