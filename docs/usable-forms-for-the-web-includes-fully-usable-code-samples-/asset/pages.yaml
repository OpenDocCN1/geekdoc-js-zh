  md: "![](img/a10b466d6e11a32674cad146197d13d9_73_0.png)![](img/a10b466d6e11a32674cad146197d13d9_73_1.png)\n\
    \nChapter 1 \n\nSummary \n\nIn this chapter, we've covered the basics of writing\
    \ forms. If you've never written one before, you \n\nshould now have a good idea\
    \ of the controls you can use to gather information from users. If you \n\nwere\
    \ already familiar with the controls and how to put them together, this will provide\
    \ a reference in \n\nthe future. In all, we've seen: \n\n• A quick introduction\
    \ to forms \n\n• The <f orm> element that wraps all forms that we create \n\n\
    • Control types \n\n• Input boxes \n\n• Submit, reset, and push buttons \n\n•\
    \ Checkboxes \n\n• Radio buttons \n\n• Menus and drop-down lists \n\n• File select\
    \ boxes \n\n• Hidden controls \n\n• Password boxes \n\n• Object controls \n\n\
    • Labels for adding text that indicates to the user what they should enter in\
    \ the appropriate fields \n\n• How to add structure to a form using fieldsets\
    \ and how to title the fieldsets with <legend> \n\nelements \n\n• Giving focus\
    \ to elements \\- allowing form users to tab through the items in the form and\
    \ use \n\nkeyboard shortcuts \n\n• When to use get and post for submitting forms\
    \ \n\n• Two example forms \n\nWe'll go on, in the next chapter, to see how to\
    \ make these forms easier to use and how to make them \n\naccessible for those\
    \ with visual impairments. » \n\n58"
