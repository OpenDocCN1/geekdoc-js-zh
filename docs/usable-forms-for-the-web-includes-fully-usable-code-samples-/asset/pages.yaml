    \nForms and ASP \n\nConfirming Delivery Details \n\nThere's one other thing we\
    \ have to display to the user, and that's whether they are having the pizza \n\
    \ndelivered or are collecting it (and if they are having it delivered, we write\
    \ out where it's being delivered to). \n\nIn order to determine whether we are\
    \ delivering the pizza, we check the Session object for the value \n\nof del.\
    \ If the value is delivered, then we write out the user's address from the array\
    \ arrDelivery \n\n(which is also in the Session object). If they're going to collect\
    \ it, we indicate this instead. \n\n<% \n\nstrDelivered \\= Session(\"del\") \n\
    \narrDelivery \\= Session(\"arrDelivery\") \n\nIf strDelivered \\= \"delivered\"\
    \ Then \n\nResponse.Write(\"<span class='info 1\\>To be delivered \" & Session(\"\
    time\") & \\_ \n\n\" to. </spanxbr /><br />\") \n\nResponse .Write (\"<tablextr><td>Street</tdxtd>\"\
    \ & \n\narrDelivery (2) & \"</tdx/tr>\") \n\nResponse. Write (\"<tr><td>Suburb</tdxtd>\"\
    \ & \\_ \n\narrDelivery (3 ) & \"</tdx/tr>\") \n\nResponse.Write( \"<trxtd>Post\
    \ Code</tdxtd>\" & \\_ \n\narrDelivery(4) & \"</tdx/tr>\") \n\nResponse . Write\
    \ (\"<trxtd>Tel: </td><td>\" & \\_ \n\narrDelivery(0) & arrDelivery(1) & \\_ \n\
    \n\"</tdx/trx/table>\") \n\nElse \n\nResponse.write(\"To be collected from us\
    \ \" & Session(\"time\") & \"<br /><br />\") \n\nEnd If \n\n%> \n\nI he final\
    \ thing the user has to do on this page is confirm the order. When they do, they\
    \ are sent on \n\nto confirmed.asp. \n\nWhat Next with the Order \n\nWhat happens\
    \ next with the order once the user confirms it is up to you? Perhaps you could\
    \ add it to \n\na database, and then have a separate application in the kitchens\
    \ that polls the database for new \n\norders. Perhaps you would charge the user\
    \ \\- either using your own commerce engine or a third- \n\nparty one such as\
    \ WorldPay or PayPal. \n\nIn our example, we simply pass the information to confirmed.asp,\
    \ which reprints the information \n\njust as we've seen it in checkout.asp, but\
    \ without the option to remove items, confirmed.asp \n\nalso abandons the session,\
    \ as we've done all we want to with the data we were holding in memory, \n\nand\
    \ therefore we can log the user off from the application: \n\nSession.Abandon\
    \ \n\nIf you're passing sensitive data, such as credit card details or passwords,\
    \ using forms, you would be \n\nable to write the application just as we've seen\
    \ here. However, you would need to put the files in a \n\ndirectory whose security\
    \ settings required the user to be running under https \n\nThere's not enough\
    \ space to go into the details of secure sockets in this book. However, you can\
    \ \n\nrefer to a book such as Professional ASP Web Techniques (Alex Homer, Wrox\
    \ Press, ISBN: \n\n1861003218) for more information."
