    \ \n\n\\[3\\] \n\ndocument. myForm. myCheckBox \n\n\\[1\\] \n\n<input \n\ntype=\"\
    checkbox\" \n\nname=\"myCheckBox\" /> \n\ndocument.myForm.elements \n\n\\[4\\\
    ] \n\ndocument.myForm.myCheckBox \n\n\\[2\\] \n\nIn all three cases, we need to\
