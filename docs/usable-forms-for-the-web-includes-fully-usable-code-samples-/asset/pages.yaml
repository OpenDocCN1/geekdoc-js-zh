    \ \n\norder3 .asp starts by putting the values of the form data into variables,\
    \ and then it adds them as \n\nkeys to the testForm cookie, just as we did in\
    \ order2 . asp above: \n\n<% \n\nResponse.Cookies(\"testForm\") \n\nResponse.Cookies(\"\
    testForm\") \n\nResponse.Cookies(\"testForm\") \n\nResponse.Cookies(“testForm\"\
    ) \n\nResponse.Cookies(\"testForm\") \n\nResponse.Cookies(\"testForm\") \n\n(\"\
    street\") \\= strStreet \n\n(\"suburb\") \\= strSuburb \n\n(\"postcode\") \\=\
    \ strPostcode \n\n(\"telcode\") \\= strTelcode \n\n(\"telno\") \\= strTelno \n\
    \n(\"specialinstruct\") \\= strSpecialinstruct%> \n\n<htmlxbody>Form data is now\
    \ in the cookie !<br /> \n\n<a href=\"orderSummary.asp\">Click here to view cookie\
    \ data</a> \n\n</bodyx/html> \n\n■. \\\\ \n\nFinally, it presents the user with\
    \ a link to orderSummary.asp. \n\n132"
