    \nAdding Orders \n\nSo, let's look at inc\\_additem.asp. The first thing we have\
    \ to do is retrieve the information about \n\nthe pizza that the user wanted from\
    \ the query string and store it in variables: \n\nintQty \\= Request.Querystring(\"\
    qty\") \n\nstrSize \\= Request.Querystring(\"size\") f \n\nstrPizza \\= Request.Querystring(\"\
    pizza\") \n\nstrTops \\= Request.Querystring(\"tops\") \n\nNext we have to calculate\
