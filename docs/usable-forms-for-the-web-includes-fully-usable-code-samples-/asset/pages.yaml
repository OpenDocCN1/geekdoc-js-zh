    \nChapter 1 \n\nThe <legend> element can take the following attributes: \n\n•\
    \ accesskey \\- which we look at in the next section. \n\n• align \\- deprecated.\
    \ \n\n% \n\n• class, dir, id, lang, style, title \\- available for most HTML elements.\
    \ \n\n• onclick, ondblclick, onkeydown, onkeypress, onkeyup, onmousedown, \n\n\
    onmousemove, onmouseout, onmouseover, onmouseup — as before, for use with script.\
    \ \n\nThe align attribute that used to be available for aligning <iegend> elements\
    \ is \n\ndeprecated, and you should use CSS positioning instead. \n\nNote that\
    \ you should not use <f ieidset> elements inside a table. If you're going to \n\
    \nuse a table for formatting, the table must go inside the <f ieldset> element\
    \ \\- \n\nalthough if you do use a <f ieldset> element inside a table, it will\
    \ be displayed \n\ncorrectly if the entire fieldset fits inside one cell. \n\n\
    Giving Focus to an Element \n\nIf you want a user to be able to interact with\
    \ an element on an HTML page, it must be able to receive \n\nfocus. The most common\
    \ example of this is a link \\- the user usually clicks on that element for it\
    \ to work. \n\nWith a form, you need to give focus to that form element for the\
    \ user to interact with it. \n\nThere are three ways in which users can give HTML\
    \ elements, including <form> elements, focus \\- \n\nthey can: \n\n• Select an\
    \ element with a pointing device such as a mouse or trackball. \n\n• Navigate\
    \ from one element to the next via the keyboard. Some documents contain a tabbing\
    \ \n\norder for elements to receive focus so that the user can navigate the document\
    \ with the \n\nkeyboard, or they may contain keyboard shortcuts. \n\n• Use an\
    \ access key to select an element. This is like a keyboard shortcut (on a PC this\
    \ will \n\nlikely be using ALT + accesskey, and on an Apple it will be the Ctrl\
    \ key + accesskey, for \n\nexample, alt+C or ctrl+C). \n\nWe'll look at tabbing\
    \ navigation and access keys next. \n\n\\\\ \n\nTabbing Navigation \n\nTo create\
    \ a tabbing order, you can add the tabindex attribute to appropriate elements.\
    \ This allows you \n\nto change the default tabbing order, which just follows\
    \ the order in which elements that can receive focus \n\nappear in the document.\
    \ By creating your own tabbing order, each time the user presses the tab key on\
    \ \n\nthe keyboard, the focus will move between the elements you want to be in\
    \ focus in the order in which you \n\nwant the user to navigate the document.\
    \ The elements that can carry a tabindex attribute are: \n\n44"
