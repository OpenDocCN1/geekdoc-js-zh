    \nForm Validation Techniques \n\nValidating Text Input \n\nNext we will look at\
    \ how to use client-side code to validate text input by the user \\- for example,\
    \ to \n\ncheck whether an input text string is long enough, or to check whether\
    \ a value has been input for a \n\nrequired field. \n\nComparing Text Field Values\
    \ \n\nWe'll begin with a very short example form that in the real world would\
    \ submit to a server-side script \n\nthat updates a user's username and password.\
    \ We're going to disregard any of the many other \n\nmistakes that could be made\
    \ by the user to concentrate on just two here: we want to make sure that \n\n\
    the new password is at least 5 characters long, and we want the user to confirm\
    \ his choice by typing it \n\nin twice; if the new password isn't long enough,\
    \ or if the user doesn't enter exactly the same password \n\nboth times, we'll\
    \ show the user an appropriate error message, and prevent the form from submitting.\
    \ \n\nAs we progress through this section, we'll show you some additional techniques\
    \ you can employ to make \n\nsuch a form even more foolproof. You'll find a file\
    \ named new\\_password.html in the ch6 folder of the \n\ncode download that accompanies\
    \ this book. We've also included in the code download a very basic PHP \n\npage\
    \ (updatepass.php) just so you can see that the form was submitted and that its\
    \ information was \n\ntransmitted; we won't worry about what's in it. Here's the\
    \ source code for the page containing the \n\npassword update form, which should\
    \ display and function virtually identically in all browsers that support \n\n\
    JavaScript: \n\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"\
    \ \n\n\"http://www.w3.org/TR/html4/loose.dtd\"> \n\n<html> \n\n<head> \n\n<meta\
    \ http-equiv=\"Content-Type\" content=\"text/html; charset=iso-8859-l\" /> \n\n\
    <title>Change Your Password</title> \n\n<script type=\"text/javascript\" language=\"\
    JavaScript\"> \n\nHere we define a function to be called when the form is submitted,\
    \ and which takes a Form object as \n\nan argument: \n\nfunction validate(form)\
    \ \n\n{ \n\nA client-side validation function called by a form's onsubmit handler\
    \ needs to return a boolean value. If it \n\nreturns true, the form submits as\
    \ normal; if the function returns false, the Submit event is canceled, \n\nand\
    \ the form is not submitted to the server. So, we set a value to be returned from\
    \ the function and set its \n\ndefault value to true; if we find an error, we'll\
    \ change its value to false. \n\nvar returnVal=true; \n\nNext we create a couple\
    \ of convenience variables as shorthand for the values held in the fields named\
    \ \n\nnewpasswordl and newpassword2. We're not required to do so; it just saves\
    \ us a little typing, since we \n\nrefer to these values several times in the\
    \ body of the function. (Users of Opera 6 will see security \n\nwarnings to the\
    \ effect that the script is trying to read passwords, and will need to grant access\
    \ for this \n\nscript to function correctly.) \n\nvar newpassl=form.newpasswordl.value;\
    \ \n\nvar newpass2=form.newpassword2.value; \n\n227"
