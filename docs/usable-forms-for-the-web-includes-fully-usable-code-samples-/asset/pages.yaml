    \nChapter 1 \n\nButtons \n\nThere are three ways in which you can create a button:\
    \ \n\n• With the <input> element whose type attribute has a value of submit, reset,\
    \ or button. \n\n• With the <input> element whose type attribute has a value of\
    \ image. \n\n• With the <button> element. \n\nWhile the first two options are\
    \ supported in all browsers, the <button> element is only supported in IE \n\n\
    4+. The new <button> element has been introduced to allow buttons to contain markup\
    \ themselves, as \n\nwe shall see shortly. \n\nCreating Buttons Using the <input>\
    \ Element \n\nWhen creating buttons using the <input> element, the type of button\
    \ you're creating is specified with the \n\ntype attribute. \n\n• submit creates\
    \ a button that automatically submits a form. \n\n• reset creates a button that\
    \ automatically resets the form controls to their initial values. \n\n• button\
    \ creates a button that's used to trigger client-side scripts when the user clicks\
    \ on \n\nthe button. \n\nHere's an example that makes use of all three types of\
    \ button (ch0l\\_eg6.htm): \n\ncinput type=\"submit1' name=\"subscribe\" value=\"\
    add user\" /> \n\ncinput type=\"submit\" name=\"unsubscribe\" value=\"delete user\"\
    \ /> \n\n<br /xbr /> \n\n<input type=\"reset\" value=\"clear form\" /> \n\n<br\
    \ /xbr /> \n\n<input type=\"button\" value=\"calculate” onclick=\"calculate()\"\
    \ /> \n\nThey would look something like this: \n\n20"
