  md: "![](img/a10b466d6e11a32674cad146197d13d9_182_0.png)![](img/a10b466d6e11a32674cad146197d13d9_182_1.png)\n\
    \nUsing Forms \n\nwith PHP and MySQL \n\nIn this chapter, we're going to take\
    \ a look at using forms, preserving state, and several related issues \n\nmaking\
    \ use of PHP 4 and MySQL. We'll concentrate on showing you working code and explaining\
    \ \n\nhow it does its job, and we'll attempt not to dwell on aspects of these\
    \ technologies that we don't use \n\nhere (except in the case of sessions). There\
    \ are plenty of resources listed in the relevant sections if \n\nyou need more\
    \ detailed information about anything. We'll develop a simple example application\
    \ \\- an \n\nonline survey \\- and we'll show you a couple of different ways to\
    \ build it. \n\nOne of the strengths of the technologies involved is that they're\
    \ available on several different \n\nplatforms. This permits site developers to\
    \ work on a home machine (running one operating system \n\nand server) and then\
    \ deploy the application to a live web server running different server software\
    \ \n\nunder a different OS. We can do this with a high degree of confidence that\
    \ everything will function \n\nthere on a par with their personal machines. (Of\
    \ course, there are bound to be some differences, \n\neven between machines running\
    \ the same operating system, and you should always live-test \n\napplications\
    \ when moving them from a development machine to the \"live\" server.) \n\nAt\
    \ the time of writing, it seems that many site builders and maintainers using\
    \ PHP prefer the Windows \n\ndesktop for developing their web applications and\
    \ Linux or BSD for hosting them on the Internet. \n\nThe examples in this chapter\
    \ were tested on the following platforms: \n\n• A 166 MHz Pentium with 32 Mb RAM\
    \ running Windows 95, Microsoft's Personal Web Server \n\nversion 3.0, PHP 4.1.2,\
    \ and MySQL 3.23.47-max. \n\n• A Windows 2000 Server machine with a 1.0 GHz Pentium\
    \ III processor, 128 Mb memory, \n\nInternet Information Server 5.0, PHP 4.0.6,\
    \ and MySQL 3.22.39-max. \n\n• An 800 MHz Pentium III with 512 Mb RAM running\
    \ Red Linux 7.1, Apache 1.3.12, PHP \n\n4.0.4p11, and MySQL 3.23.37-opt."
  merge: -1
  pgno: 182
- img_proc: true
  md: "![](img/a10b466d6e11a32674cad146197d13d9_183_0.png)![](img/a10b466d6e11a32674cad146197d13d9_183_1.png)\n\
    \nChapter 5 \n\nThe first of these is one of the author's home \"test bed\" machines;\
    \ the other two are live web servers \n\nhosting several active sites each. phpMyAdmin\
    \ version 2.2.3 (which we'll discuss shortly) was used \n\non all three machines\
    \ for administering the MySQL databases (version 2.2.4 became available just \n\
    \nas this book was going to press). Most of the examples were tested on all three\
    \ platforms, with \n\nplatform-specific code being so indicated in the text. \n\
    \nThe code in this chapter should work with most of the browsers in common use.\
    \ You may, \n\nthough, have to tweak some of it a little to get it to work with\
    \ a few of the older browsers. \n\nWhat You Need to Use this Chapter \n\nWe'll\
    \ start by taking a brief look at the technologies that we'll be using in this\
    \ chapter. \n\nPHP \n\nWe've already examined how to use forms with Microsoft's\
    \ Active Server Pages platform. Now we're \n\ngoing to look at using them with\
    \ what is probably the most popular open-source alternative, PHP. \n\nEven if\
    \ you've not used PHP before, you'll find that it's quite easy to learn, provided\
    \ you have almost \n\nany sort of programming or scripting experience at all.\
    \ Its syntax and structures are very similar to \n\nthose of C, Perl, Java, and\
    \ JavaScript, and it supports both function- and object-based programming \n\n\
    techniques. PHP will work well with just about any web server, including Apache,\
    \ Xitami, \n\nNetscape/iPlanet, OmniHTTPd, Zeus, Oreilly Website Pro, and Microsoft's\
    \ IIS and PWS. \n\nAnother advantage to using PHP is that it's free \\- both as\
    \ in speech and as in beer. By \"free as in \n\nspeech\", we mean that the source\
    \ code is readily available, and you can (if you're so inclined) study \n\nit,\
    \ modify it, add to it, and so forth to your heart's content. (Note that under\
    \ the PHP license, if you \n\ndistribute a custom version of PHP itself, you must\
    \ also make your changes for the source code \n\navailable to those who receive\
    \ the distribution.) By the \"free as in beer\" part, we mean that it doesn't\
    \ \n\ncost anything to obtain it and use it. \n\nYou can download versions of\
    \ PHP that are compatible with just about any hardware and operating \n\nsystem\
    \ in common use today, including all the various flavors of Windows, Linux, BSD,\
    \ Macintosh, \n\nBe, OS/2, and Solaris. If you're not comfortable with compiling\
    \ programs from source code, \n\nexecutable binaries and installers are also available.\
    \ You can obtain these for Windows from the \n\nofficial PHP website at http://www.php.net/,\
    \ where you can also find links to other sites hosting \n\nbinaries for the other\
    \ platforms listed above. In addition, this site hosts a complete PHP manual,\
    \ \n\nwhich you can view on the site or download for later, offline use. The online\
    \ version of the manual is \n\na particularly useful resource because it's searchable\
    \ and it includes comments, bug reports, and \n\nexample code that are added by\
    \ PHP users on a continuing basis. \n\nAs this isn't a book about PHP programming\
    \ per se, we won't spend a lot of time or spadfe discussing \n\naspects of the\
    \ language that we're not going to use here, although we'll try to cover as many\
    \ of the \n\nbasics as space allows. Among other things, PHP has libraries of\
    \ functions for handling things like \n\narrays, math operations, strings, e-mail,\
    \ files and directories, interactions with several common \n\ndatabases (including\
    \ MySQL, mSQL, Oracle 8, dBase, SQL Server, Sybase, PostgreSQL, InterBase, \n\n\
    and others), image and PDF creation, regular expressions (see the Chapter 6 for\
    \ more about those), \n\nXML, and more \\- literally hundreds of functions. \n\
    \n168"
