    \ & \"<br />\" \n\nEnd If \n\nIf checkl.Items (0) .Selected or checkl.Items(1).Selected\
    \ or \\_ \n\ncheckl.Items(2).Selected then \n\nMessage.Text \\= s \n\nEnd If \n\
    \nWe assign its final value to the Text attribute of the Message label, so that\
    \ it can be seen on the \n\npage. We don't display the \"You have selected...\"\
    \ message, unless selections have been made. \n\nIf you make a selection and then\
    \ check the sourcecode, you can see that ASP.NET assigns the \n\nChecked attribute\
    \ for the control: \n\nWhich extra toppings do you want?<br /xbr /> \n\nctable\
    \ id=\"checkl\" border=\"0”> \n\n<tr> \n\n<td> \n\n<input id=\"checkl\\_0\" type=\"\
    checkbox\" name=\"checkl:0\" checked=\"checked\" /> \n\nclabel for=\"checkl\\\
    _0\">Olives</label> \n\n</td> \n\n</tr> \n\n<tr> \n\n<td> \n\n<input id=\"checkl\\\
    _l\" type=\"checkbox\" name=\"checkl:1\" checked=\"checked\" /> \n\n<label for=\"\
    checkl\\_l\">Jalapeno Peppers</label> \n\n</td> \n\n</tr> \n\n<tr> \n\n<td> \n\
    \n<input id=\"checkl\\_2\" type=\"checkbox\" name=\"checkl:2\" /> \n\nclabel for=\"\
    checkl\\_2\">Anchovies</label> \n\n</td> \n\n</tr> \n\n</table> \n\nWhen using\
    \ several unrelated single checkboxes, rather than several in a group, you need\
    \ to use \n\n<asp:checkbox>, in which case you could set each of them as separate\
    \ <asp:checkbox> controls \n\nto reflect this: \n\n363"
