  md: "![](img/a10b466d6e11a32674cad146197d13d9_192_0.png)![](img/a10b466d6e11a32674cad146197d13d9_192_1.png)\n\
    \nUsing Forms \n\nwith PHP and MySQL \n\nAnd here's what Eric sees once he clicks\
    \ the button labeled Go to #2\\\\ \n\nYou know already that we were able to print\
    \ out Eric's first name because the field named \n\nfirst\\_name in the first\
    \ page created a PHP variable $f irst\\_name in the page to which it was \n\n\
    submitted. Let's look at the source for the form in survey\\_2 .php: \n\n<form\
    \ method=\"post\" action=\"survey\\_3.php\"> \n\nSure enough, there's an echo\
    \ statement using that variable. \n\n<p>2. What's your favorite cheese, <?php\
    \ echo $first\\_name; ?>?</p> \n\nNext, we've created a drop-down using the <select>\
    \ and <option> elements to get Eric's \n\nresponse to question 2: \n\n<fieldset>\
    \ \n\n<select name=”cheese\"> \n\n<option selected=\"true\" value=\"\">\\[choose\
