    \nChapter 4 \n\nAs you can see, we have successfully passed data from the first\
    \ page to the third page using hidden \n\nform fields. \n\nYou could also use\
    \ a stylesheet or inline style attribute to set the form element you \n\nwant\
    \ to hide to display: hidden. This achieves the same effect as a hidden form \n\
    \ncontrol, although it requires that the browser is CSS-dware. \n\nThe advantages\
    \ of hidden form fields are: \n\n• They don't require server resources like sessions\
    \ to hold information, or database resources to \n\nwrite information to and retrieve\
    \ information from a database. \n\n• They will work with any browser. \n\nThe\
    \ disadvantages of hidden form fields are: \n\n• Data can only be passed between\
    \ pages that contain forms. Each hidden form element needs \n\nto be submitted\
    \ as part of another form in order to be made available to the server again. \n\
    \n• The more form fields you have, the more items you are passing between pages.\
    \ In a \n\ncomplicated form, this can soon become difficult. \n\n• The more fields\
    \ you pass between pages the slower the application becomes, as you are \n\npassing\
    \ more information. \n\nStoring Form Data in Cookies \n\nAnother way of making\
    \ form data available to different pages is by writing it to the client in a cookie.\
    \ \n\nUsing this method, when a user submits a form, ASP takes the data in the\
    \ form controls and writes it \n\nto a cookie on the client. The data will remain\
    \ on the client for as long as that cookie exists. \n\nAs we shall see, either\
    \ the cookie can be destroyed when the user closes their browser (for short¬ \n\
    \nterm storage of data) or it can be made to last for longer periods of time (until\
    \ the expiry date that \n\nyou set is reached, unless, of course, the user deletes\
    \ the cookie first). \n\nCookies are written to the client using the cookies collection\
    \ of the Response object. They must \n\ncome before the opening <html> tag in\
    \ the ASP page. The simplest way of writing a cookie to the \n\nclient would be\
    \ like this: \n\nResponse.Cookies(\"cookieName\") \\= cookieValue \n\nwhere cookieName\
    \ is the name of your cookie and cookieValue is the value that you're writing\
    \ to \n\nthat cookie. \\\\ \n\nIf we were to do this for each item in the form,\
    \ we would be creating a separate cookie for each \n\npiece of data. We can, however,\
    \ allow one cookie to take multiple values \\- known as keys \\- which \n\nreduces\
    \ the number of cookies we have to create. This can be an advantage because some\
    \ \n\nbrowsers (for example, Netscape) limit the number of cookies you can write\
    \ from the same domain to \n\n20, and only allows a total of 300 cookies per individual\
    \ user, so we have to be careful how many \n\ncookies we create. \n\n130"
