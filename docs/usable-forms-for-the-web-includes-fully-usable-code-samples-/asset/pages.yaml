  md: "![](img/a10b466d6e11a32674cad146197d13d9_311_0.png)![](img/a10b466d6e11a32674cad146197d13d9_311_1.png)\n\
    \nChapter 6 \n\nctextarea name=\"Feedback\\_coiranent'' rows-“10 \" cols-\"30\
    \ 11 \\> \n\n<% \\=Request.Form(\"Feedback\\_comment\") %></textarea> \n\n</td>\
    \ \n\n</tr> , \n\n<tr> \n\n<td colspan=\"3\" align=\"center\"> \n\n<input type=\"\
    submit\" name=\"submit\" value=\"Submit\" /> \n\n&nbsp;<input type=\"reset\" name=\"\
    reset\" value=\"Reset\" /> \n\n</td> \n\n</tr> \n\n</table> \n\n</form> \n\n<%\
    \ \n\nEnd If \n\n%> \n\n</body> \n\n</html> \n\nIf you load up this file from\
    \ a server that supports ASP, you'll find that, from the user's point of view,\
    \ it \n\nlooks and acts exactly like its PHP counterpart. \n\nSummary \n\nWe've\
    \ given you a lot of material to work with here, having first discussed the rationale\
    \ for and goals of \n\nform validation. We went over the basics of form validation\
    \ in three different environments, one of these \n\non the web client and two\
    \ using popular forms of what's sometimes called \"middleware\", PHP and ASP.\
    \ \n\nIn the section dealing with client-side validation we reviewed and expanded\
    \ on some key aspects of the \n\nDocument Object Model as it relates to forms\
    \ and used these in constructing a standalone form handler \n\nthat \"knows\"\
    \ what sort of elements are in a web page form and what conventions it should\
    \ expect that \n\nform's elements to conform to. We also showed a couple of basic\
    \ and more advanced techniques using \n\nCSS and DHTML for alerting users to errors\
    \ and informing them about their location and nature. \n\nPerl-compatible regular\
    \ expressions make processing of text input a much simpler exercise than using\
    \ \n\nstring or other methods alone, and can be used in similar ways on all three\
    \ platforms, so we also devoted \n\na considerable amount of time and space to\
    \ a mini-tutorial of sorts, covering the basics of building regular \n\nexpressions\
    \ and testing strings against them to guarantee compliance with a number of common\
    \ formats \n\nsuch as telephone and credit card numbers, ZIP Codes and Postcodes,\
    \ and e-mail addresses. We then \n\nturned our attention to validating forms on\
    \ the server with a mind not only to guaranteeing adherence to \n\ndesired formats\
    \ but to preventing the unscrupulous from using forms to transmit various annoyances\
    \ and \n\neven security hazards to both our users and our sites. We finished up\
    \ by implementing a somewhat \n\nscaled-down version of our client-side example\
    \ using PHP and then ASP. ' \n\n% \n\n296"
