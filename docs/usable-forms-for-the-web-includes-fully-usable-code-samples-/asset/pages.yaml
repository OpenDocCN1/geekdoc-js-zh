  md: "![](img/a10b466d6e11a32674cad146197d13d9_362_0.png)![](img/a10b466d6e11a32674cad146197d13d9_362_1.png)\n\
    \nForms in ASP.NET \n\n<asp:label id=\"Messagel\" runat=\"server\" text=\"Vervain\"\
    /> \n\nyou have ordered the \n\n<asp:label id=\"Message2\" runat=\"server\" text=\"\
    Four Cheese”/> \n\npizza. It will be delivered within the next hour. \n\n</body>\
    \ \n\n</html> \n\nThis will display the following: \n\nThere isn't much to explain\
    \ here. The <asp:label> control is effectively identical to the HTML \n\n<span>\
    \ element. The only thing that differentiates it is the fact that it is executed\
