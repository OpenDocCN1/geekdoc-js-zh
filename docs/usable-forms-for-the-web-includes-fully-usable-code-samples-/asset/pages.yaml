    \ need to work with earlier \n\nbrowsers, you'll have to use indexof () instead.\
    \ For more on regular expressions, \n\nsee the Resources section at the end of\
    \ the book. \n\nFinding Characters Using indexOf() \n\nThe indexof () method of\
    \ the string object returns the position of the first occurrence of the \n\nsubstring\
    \ passed in as the argument. This method is case-sensitive. If the match is not\
    \ found, the \n\nresult we get is \\-1. \n\nTo help find a character or string,\
    \ we can use the findstring () function, which will find a character \n\nor the\
    \ start of a string. It takes two parameters: \n\n• strText, which is the string\
    \ that we're searching through. \n\n• strSearch, which is the character(s) we're\
    \ looking for. \n\nfindstring () will display the result in an alert box. This\
    \ will be an integer that gives the position in \n\nthe string, and being zero-based,\
    \ if it's the first character the value returned will be 0. Note how we \n\ncheck\
    \ whether it's been found in this example (ch07\\_egll .htm): \n\n% \\\\ \n\n\
    <script language=\"JavaScript11 \\> \n\nfunction findString(strText, strSearch)\
    \ \n\n{ \n\nvar intPos \\= strText.indexOf(strSearch); \n\nif (intPos \\== \\\
    -1) alert('not found'); \n\nelse if (intPos \\> \\-1 ) alert(strSearch + ' found\
    \ at ' + intPos); \n\n} \n\n</script> \n\n314"
