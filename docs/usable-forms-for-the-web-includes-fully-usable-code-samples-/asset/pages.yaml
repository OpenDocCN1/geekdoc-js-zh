    \ So if you only entered information into the name field, only one message \n\n\
    would be displayed. Go ahead, try it and see. \n\nThe <asp:radiobutton> and <asp:radiobuttonlist>\
    \ Controls \n\nIn HTML forms, radio buttons are typically used when there is a\
    \ multiple set of choices, but you want \n\nthe user to select only one. If they\
    \ click on a second selection after making a first, the first is \n\ndeselected\
    \ and replaced by the second. In other words the selections are mutually exclusive.\
    \ \n\nHowever, this doesn’t have to be the case, as we shall see. \n\nRadio buttons\
    \ are implemented in HTML forms using the <input> tag, and setting the type attribute\
    \ \n\nto radio. The following also applies \\- every radio button on the page\
    \ needs to have its own cinput \n\ntype=\"radio \"> element, and each radio button\
    \ within a particular group must have the same name \n\nattribute. \n\nThe <asp:\
    \ radiobutton> and <asp: radiobuttonlist> controls work in a different way, \n\
    \n<asp: radiobuttonlist> is typically used for data binding. In HTML, radio buttons\
    \ vyere assigned \n\nthe same identifier using the name attribute, as below: '\
    \ \n\nAcinput name=\"radiol\" \n\nB<input name=\"radiol\" \n\nC<input name=\"\
    radiol\" \n\ntype=\"radio\"> \n\ntype=\"radio\"> \n\ntype=\"radio\"> \n\n358"
