    \ \n\n<script language=\"JavaScript\"> \n\n<!— Begin \n\nfunction wordCount(strTextValue)\
    \ \n\n{ \n\nstrTextValue \\= strTextValue.replace(/A\\\\s+/, '').replace(/\\\\\
    s+$/, ''); \n\nvar strSplit \\= StrTextValue.split(/\\\\s+/g); \n\nvar intWordCount\
    \ \\= strSplit.length; \n\nalert('Word count: ' + intWordCount + ' words'); \n\
    \n} \n\n//End —> \n\n</script> \n\n</head> \n\n<body> \n\n<form name=\"myForm\"\
    > \n\n<textarea name= ''myTextArea\" cols=\"40\" rows=\"10”> \n\nType some words\
