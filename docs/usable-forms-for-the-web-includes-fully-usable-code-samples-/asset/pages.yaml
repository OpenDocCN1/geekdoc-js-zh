    \nChapter 5 \n\nUploading Files with PHP \n\nLike many other common tasks involving\
    \ forms that we've looked at in this chapter, uploading files \n\nfrom a user's\
    \ browser to the server is not terribly difficult in PHP. PHP also makes it possible\
    \ to \n\ncontrol the type and size of the file that a user can upload. ' \n\n\
    Security alert: There is a recently-discovered file upload vulnerability in every\
    \ \n\nversion of PHP up to and including 4.1.1 running on all servers, operating\
    \ systems, \n\nand platforms. While the issue is in the file-upload code for PHP,\
    \ you do not need \n\nto be permitting uploads using PHP in order to have malicious\
    \ code uploaded and \n\nexecuted on your server. We therefore strongly recommend\
    \ you upgrade to PHP \n\nversion 4.1.2 or higher, or patch your older version\
    \ of PHP, immediately if not \n\nsooner! You can obtain a new version of PHP or\
    \ a patch for your current version \n\nfrom the PHP downloads page. See http://security.e-\
    \ \n\nmatters.de/advisories/012002.htmltor additional information. \n\nThe Upload\
    \ Form \n\nHere's a web page with a typical file upload form (upload/upload.php):\
    \ \n\nWe create a form that uses the post method and set its action to a PHP page\
    \ that will process and \n\nsave the file to be uploaded onto the server (we'll\
    \ look at this page shortly). Notice that we set the \n\nform's enctype attribute\
    \ to multipart/form-data; this is extremely important, as the upload will \n\n\
    not function correctly without it. \n\n<form method=\"post\" action=\"save\\_file.php\"\
    \ enctype=\"multipart/form-data\" /> \n\n<p>You can upload an image file here.<br\
    \ /> \n\nGIF or JPEG only, please!<br /> \n\nMaximum filesize is 75K.</p> \n\n\
    <f ieldsetxlegend>File to be uploaded: <br /></legend> \n\nIf we wish to set an\
    \ upper limit on the size of the file, we include a hidden form field whose name\
    \ is \n\nmax\\_file\\_size and whose value is the maximum size in bytes of files\
    \ we wish to permit the user to \n\nupload. Note that this hidden field must precede\
    \ the file input, or the size restriction will be ignored. \n\n<input type=\"\
    hidden\" name=\"MAX\\_FILE\\_SIZE\" value=\"75000\" /> \n\nNext comes the file\
    \ input. We need to give it a name so that the processing script can access it.\
    \ By \n\nthe way, this control's size attribute has nothing to do with the size\
    \ of the file to be uploaded. It \n\nmerely controls how many characters of the\
    \ file name and path will be visible to the user once the \n\nfile's been selected.\
    \ \n\n<pxinput type=\"file” name= \"uploadfile\" size=\"50\" /><br /> \n\nFinally,\
    \ we place a submit button in the form for the user to click to send the file\
    \ on its merry way. \n\n<input type=\"submit\" value=\"Upload File\" /></p> \n\
    \n</fieldset> \n\n</form> \n\n194"
