  md: "![](img/a10b466d6e11a32674cad146197d13d9_191_0.png)![](img/a10b466d6e11a32674cad146197d13d9_191_1.png)\n\
    \nChapter 5 \n\n• You may want to use the query string to transmit other data\
    \ between pages, independent of any \n\nform data being passed via post. This\
    \ can be accomplished using PHP or client-side scripting, \n\nwithout using forms\
    \ or form submissions. For instance, you may want to append a timestamp to \n\n\
    the query string to help guarantee that users always see a fresh version of a\
    \ page and not a \n\ncached one. Or you may wish to pass a variable indicating\
    \ a user preference setting, an ID \n\ncode showing how the user reached your\
    \ site as part of an affiliate program, and so on. \n\nPreserving State with PHP\
    \ \n\nAs we've discussed in previous chapters, we often want to break up a form\
    \ across multiple pages. In \n\nsuch cases, we want to keep all the data intact\
    \ as the user moves from one page to the next, so that \n\nit can all be stored\
    \ on the server in one step when the user has finished. \n\nIn Chapter 4, we discussed\
    \ how to maintain the state of an application between pages or visits to a \n\n\
    site. We've seen several ways to pass variables and their values between pages\
    \ in ASP, and we can \n\nuse similar methods in PHP. Here we'll discuss using\
    \ hidden form fields, cookies, and session \n\nvariables in PHP. \n\nIn this section,\
    \ we're going to create a short questionnaire. To begin with, we’ll simply display\
    \ all the \n\ndata on a results page once the user has completed it. Later in\
    \ the chapter, we'll add an additional \n\nstep at the end of the process where\
    \ we'll actually store the data in a database from which we can \n\nretrieve it\
    \ whenever it's needed again. \n\nHidden Form Fields \n\nWe'll start off by looking\
    \ at how we can use hidden form fields in PHP. You'll find the code for this \n\
    \nexample in the subdirectory hidden in the directory for this chapter. \n\nUsing\
    \ Form Data to Write Hidden Fields \n\nHere's the first form in our questionnaire,\
    \ from survey\\_l .php: \n\n<form method=\"post\" action=\"survey\\_2 .php'1 \\\
    > \n\n<p>l. Please enter your first and last naine:</p> \n\n<fieldset> \n\n<label>First\
    \ name:<input type=''text\" name=\" f irst\\_name\" \n\n<label>Last name: cinput\
    \ type=\"text\" name=\"last\\_name'' \n\n</fieldsetxbr /> \n\n<fieldset> \n\n\
    cinput type=\"submit\" value=\"Go to #2\" /> \n\ncinput type=\"reset\" value=\"\
    Reset Form\" /> \n\nc/fieldset> \n\n</form> \n\n/>c/label>cbr \n\n/>c/label> \n\
    \n/> \n\nSince there's no actual PHP code in this page at the moment, we could\
    \ just as easily have named it \n\nwith a . html extension, but we'll be updating\
    \ it to include some further on, so we've gone ahead and \n\nused .php. It's pretty\
    \ basic, just a form that POSTs to a page named survey\\_2 .php and contains \n\
    \ntwo fields named f irst\\_name and last\\_name. Here's how it looks when our\
    \ customer fills it out: \n\n176"
