    \ named \n\nrequired, alphabetic, nospace, etc. We'll make use of these variables\
    \ very shortly. \n\nFor Count \\= 0 to ReqLength \n\nExecute( \"Dim \" & Requirements(Count)\
    \ ) \n\nNext \n\nIn a fashion similar to that which we employed for the PHP version\
    \ of this example, we loop through all \n\nthe form fields passed to the page,\
    \ making use of the Request. Form collection, which we first \n\nencountered in\
    \ Chapter 4. \n\nFor Each FormKey in Request.Form \n\nWe set the Fieldvalue variable\
    \ to the value of the current field, then set the value of FieldName to an \n\n\
    array containing the substrings that result when we split up the field’s name\
    \ using the underscore \n\ncharacter as a delimiter. In that array's first element,\
    \ we now replace any occurrences of the 0 (zero) \n\ncharacter with a space: this\
    \ is the value we'll show the user for the field identifier in the error message.\
    \ \n\nFieldValue \\= Request.Form(FormKey) \n\nFieldName \\= Split(FormKey, )\
    \ \n\nFieldName(0) \\= Replace(FieldName(0), \"0\", \" \") \n\nHaving extracted\
    \ the above information from the current form field, we can now count through\
    \ each string \n\nin the Requirements array. \n\nFor Count \\= 0 to ReqLength\
    \ \n\nWe check to see if the current field contains the current Requirements string;\
    \ if it doesn't' we set the \n\nvalue of isRequirement to False, otherwise we\
    \ set that value to True. \n\nIf InStr( FormKey, Requirements(Count)) \\= 0 Then\
    \ \n\nIsRequirement \\= False \n\nElse \n\nIsRequirement \\= True \n\nEnd If \n\
    \n288"
