    \ file we used in order5.asp: \n\n'calculate the price of the pizza \n\n'first,\
    \ work out the base price of the pizza \\- the price for a regular pizza \n\n\
    %> <!-- #include file=\"incJoasePriceFunction.asp\" \\--> <% \n\nintPriceReg \\\
    = basePrice(strPizza) \n\n155"
