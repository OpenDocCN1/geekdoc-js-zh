    \nChapter 2 \n\nAn Aside on Reset Buttons \n\nYou should be particularly careful\
    \ about your use of reset buttons. If you use one, it should be clearly \n\ndifferentiated\
    \ and preferably positioned away from the submit button. If the user wants to\
    \ change a \n\ndetail, they can often do so by going back and changing the relevant\
    \ control. Generally, reset \n\nbuttons are unnecessary unless a user is likely\
    \ to want to £tart completely over again on a form. \n\nFor example, you could\
    \ use reset buttons on forms where the same user will have to use the form \n\n\
    several times and where the data will be different each time they use the form.\
    \ \n\nSelecting Types of Controls \\- Summary \n\nWhere possible, your choice\
    \ of form control should reflect the experience of users in \n\ndealing with that\
    \ type of information. \n\nTextboxes are often the most natural way for users\
    \ to supply information, although it might \n\nbe preferable to supply specific\
    \ choices if you need to control the format of the data. \n\nIf you only have\
    \ three or four choices for the user to select from, use radio buttons or \n\n\
    checkboxes over select boxes. \n\nMultiple checkboxes are better than select lists\
    \ that allow users to select multiple items. \n\nCheckboxes are good for Boolean\
    \ selections where you assume one option, although radio \n\nbuttons are better\
    \ for giving mutually exclusive options. \n\nDo not make items in select boxes\
    \ too long (over approximately 30 characters wide). Radio \n\nbuttons are more\
    \ user-friendly than wide drop-down menus, so they're useful if, for \n\nexample,\
    \ you want to provide explanatory text. \n\nDo not include too many items in your\
    \ select box, so that it scrolls off the screen: use \n\nhyperlinks or radio buttons\
    \ instead. \n\nGrouping Controls \n\nOnce you've decided on the form controls,\
    \ you can put them on a page. Often, the data you collect \n\ncan be split up\
    \ into logical units requiring related answers \\- such as details about the users\
    \ \n\nthemselves, details about their interests and hobbies, details about orders\
    \ they would like to make, \n\nand so on. \n\nIn order to help the user fill in\
    \ the form, and to make it intuitive, you should group related items of \n\ninformation\
    \ together (these should correspond to the groupings we suggested you come up\
    \ with \n\nbefore designing the form). \n\nWhen grouping information, make sure\
    \ that you don't ask for the same information twice. If you've \n\nrepeated any\
    \ questions, can you use a technique (such as a hidden field or server-side storage)\
    \ to \n\nremember what the user has already entered? \n\nIt is important that\
    \ groupings reflect the user's understanding of the topic, rathe \n\nthan an internal\
    \ company understanding of the topic or one relating to how the \n\ninformation\
    \ will be used. \n\n70"
