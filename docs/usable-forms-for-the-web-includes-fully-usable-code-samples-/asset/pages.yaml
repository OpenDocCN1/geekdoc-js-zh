    \ looked at. \n\n• disabled \\- which we shall see more of later in the chapter.\
    \ \n\n• class, dir, id, lang, style, title \\- available for most HTML elements.\
    \ \n\n• onclick, ondblclick, onkeydown, onkeypress, onkeyup, onmousedown, \n\n\
    onmousemove, onmouseout, onmouseover, onmouseup \\- as before, for use with script.\
    \ \n\nFile Select \n\nThere will be times when you want to allow a user to select\
    \ or upload a file from their machine. This can \n\nbe done simply by using the\
    \ <input> element and giving its type attribute a value of file. The look \n\n\
    and feel matches the operating system and allows the user to select a file by\
    \ creating a file select control. \n\nHere's an example (ch01\\_egl7.html): \n\
    \n<form name='myForm' action=\"http://www.example.com/upload\" method=\"post\"\
    \ \n\nenctype=\"multipart/form-data\" \\> \n\n<input type=\"file' name=\\*uploaded\\\
    _file” \n\naccept=\\*text/html, image/\\*' /> \n\n</form> \n\nNote that we have\
    \ to add the enctype attribute to the <form> element, with a value of \n\nmultipart/form-data.\
    \ In the accept attribute of the <form> element, you can add the MIME types \n\
    \nfor the files that you want the browser to show, although neither IE 6 nor Netscape\
    \ 6 presently supports \n\nthis feature. \n\n35"
