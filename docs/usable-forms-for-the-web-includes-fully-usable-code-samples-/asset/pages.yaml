    \nChapter 4 \n\nThe advantage of using the Session object is: \n\n• We don't have\
    \ to keep passing values between pages as we did with hidden form fields. \n\n\
    The disadvantages of using the Session object are: \n\n\\* \n\n• It requires that\
    \ the user has cookies enabled (not a big problem now). \n\n• The Session object\
    \ of one virtual directory is not valid in any other virtual directories (so the\
    \ \n\napplication must live within that one directory if you want to use sessions\
    \ for persisting data). \n\n• It can be resource intensive on the server and does\
    \ not scale well \\- furthermore it won't work in \n\na web farm. \n\nAs we mentioned\
    \ when looking at cookies in the last section, your site needs to have a \n\n\
    P3P privacy policy document for IE 6 to accept cookies, and it therefore requires\
    \ such \n\na policy document in order for sessions to work with IE 6. \n\nStoring\
    \ Form Data in a Database \n\nThe final method we'll look at for storing form\
    \ data between pages is using a database. This time, \n\nwe'll be providing a\
    \ different example, that of registering with the Pizza This application. \n\n\
    Database connections can consume a lot of server resources, and you'll have to\
    \ think carefully about \n\nwhether you want to connect to the database to retrieve\
    \ and/or add information to it between pages \n\nof a form. It's common to use\
    \ one of the techniques we've just seen to collect the data from several \n\n\
    forms and then present all the data to the database in one go when we've finished\
    \ collecting it. \n\nIn this section, we'll look at an example of a registration\
    \ page for our Pizza This site, so we can \n\nregister a new user. This is quite\
    \ a long ASP page, as it contains the instructions for the entire \n\nregistration\
    \ process, including: \n\n• The form for registering. \n\n• The ASP code to check\
    \ whether the username has been taken. \n\n• If the username has been taken, to\
    \ tell the user they need a new username. \n\n• If the username is not taken,\
    \ to add the user to the database. \n\n• Some simple form validation code (such\
    \ as whether the passwords match and whether the user \n\nhas entered an e-mail\
    \ address that contains an @ sign) and a result page that's sent back to \n\n\
    the user if something is invalid. \\\\ \n\nLet's take a look at register.asp from\
    \ the Pizza This application. First, we test whether a \n\nusername has been entered\
    \ by checking the Form collection of the Request object for the value of \n\n\
    uname. If it's blank, we assume that the user wants to see the page that displays\
    \ the registration \n\npage so that they can enter their details: \n\n138"
