    \nForm Validation Techniques \n\nIf Request.Form(\"submit\") \\= \"Submit\" And\
    \ Valid \\= True Then \n\nResponse.Write \"<tablexthead>\" & vbCrLf \n\nResponse.Write\
    \ \"<tr><th colspan=\" & Chr(34) & \"2\" & Chr(34) & \n\n”>Form successfully processed.</thx/tr>\"\
    \ & vbCrLf \n\nResponse.Write \"<trxth colspan=\" & Chr{34) & \"2\" & Chr(34)\
    \ & \n\n\">Results:</thx/trxthead>\" & vbCrLf \n\nResponse.Write \"<tbodyxtrxth>Field:</thxth>Value:</thx/tr>\"\
    \ & vbCrLf \n\nTo generate the report, we just cycle through all the elements\
    \ in Request. Form, parsing out a user-friendly \n\nstring for each field name\
    \ as we did for the error report and displaying it in a table along with the value.\
    \ \n\nFor Each FormKey In Request.Form \n\nFieldName \\= Split( FormKey, \n\n\
    Response. Write \"<trxtd>\" & Replace (FieldName (0) , \"0”, \" \") & \"</td>\"\
    \ \n\nResponse.Write \"<td>\" & Request.Form(FormKey) & \"</tdx/tr>\" & vbCrLf\
    \ \n\nNext \n\nResponse .Write \"</tbodyx/table>\" & vbCrLf \n\nOtherwise, we\
    \ need to display the form, including any values that may already have been entered\
    \ by the \n\nuser. First we get the URL of the page containing the form and split\
    \ it up into an array (currPage) using \n\nthe forward slash character as the\
    \ delimiter. \n\nElse \n\nCurrPage \\= Request.ServerVariables(\"PATH\\_INF0\"\
    ) \n\nCurrPage \\= Split(CurrPage,\"/\") \n\n%> \n\n<p>Required fields are marked\
    \ with an asterisk \\*.</p> \n\nThe last element in CurrPage is the filename of\
    \ the current page, and we write this value into the \n\nform's action attribute\
    \ using ASP's \\= shorthand for the Response .Write method. \n\n<form method=\"\
    POST\" action=\"<% \\=CurrPage(UBound(CurrPage)) %>\"> \n\n<table border=\"0\"\
    \ cellpadding=\"l\"> \n\n<tr> \n\n<td colspan=\"3\" align=\"center\"> \n\n\\*First\
    \ Name: cinput type=\"text\" name=\"FirstOName\\_required\\_alphabetic\" \n\n\
    For each of the text inputs, we simply write the value of the corresponding element\
    \ in Request. Form into \n\nthat input's value attribute so it will be displayed\
    \ to the user. Unlike the case with PHP, we don't have to \n\ncheck to see if\
    \ the value's been set first; ASP treats unset form field values as empty strings.\
    \ \n\nvalue=\"<% \\=Request.Form(\"FirstOName\\_required\\_alphabetic\") %>\"\
    \ /> \n\n&nbsp;\\*Last Name: cinput type=\"text\" name=\"LastOName\\_required\\\
    _alphabetic\" \n\nvalue=\"<% \\=Request.Form(\"LastOName\\_required\\_alphabetic\"\
    ) %>\" /> \n\n</td> \n\n</tr> \n\n<tr> \n\n<td colspan=\"3\" align=\"center\"\
    > \n\n\\*Address Line 1: cinput type=\"text\" name=\"Address0Line01\\_required\\\
    _address\" \n\nvalue=\"c% \\=Request.Form(\"Address0Line01\\_required\\_address\"\
    ) %>\" /> \n\n293"
