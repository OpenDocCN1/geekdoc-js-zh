    = \"<input type=\\\\\"radio\\\\” name=\\\\\"$radio\\_name\\\\“ value=\\\\\"$j\\\
    \\”\"; \n\nWhile we're not performing any validation as such, we can take some\
    \ very simple steps to ensure \n\nthat empty responses can't be made. Here we'll\
