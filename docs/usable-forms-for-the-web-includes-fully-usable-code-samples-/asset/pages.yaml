    \nChapter 4 \n\nPassing Form Data in Hidden Form Fields \n\nThe first method of\
    \ passing data between ASP pages that we'll look at is using hidden form fields.\
    \ \n\nWhen an <input> element on an HTML form carries a type attribute whose value\
    \ is hidden, the \n\nform element is not displayed to the user. ( \n\n<input type=\"\
    hidden\" name=\"hiddenElement\" value=\"myValue\" /> \n\nSo, the first way of\
    \ passing data between ASP pages is to use hidden form fields to store the user\
    \ \n\ndata from previous forms. After we've collected data from the user in the\
    \ first form, we II write it to the \n\nnext page, containing the second form,\
    \ storing it in hidden form fields. Therefore, when the form on \n\nthe second\
    \ page is submitted, it contains the hidden form fields holding the data from\
    \ the first form \n\nas well. \n\nThe main limitation with this technique is that\
    \ in order to keep passing the data between pages, each \n\nconsecutive page must\
    \ contain a form so that the hidden fields can be submitted to the next page.\
    \ \n\nLet's see how this works in our example. Once the user has filled in orderi.htm,\
    \ which we've \n\nalready seen, their data will be sent to order2 .asp using the\
    \ http post method (the files for this \n\nversion of the example are in the hiddenForms\
    \ folder of the downloadable code for this chapter). \n\nAdding Hidden Input Controls\
    \ to a Form to Pass Data Between Pages \\- order2.asp \n\norder2 .asp does the\
    \ following: \n\n• Stores the values passed from orderi. htm in variables called\
    \ strTime and strDel. \n\n• Writes the second form to the user (the one asking\
    \ for address details). \n\n• Adds the time and delivery details collected from\
    \ the first form to the second form as hidden \n\nform controls. \n\nSo, the first\
    \ step is to retrieve the time and delivery details and store them in variables.\
    \ Because \n\norderi .htm uses the post method, we get the data from the Request\
    \ object's Form collection and \n\nput it in variables like so: \n\n<% \n\nDim\
    \ strTime, strDel \n\nstrTime \\= Request.Form(\"time\") \n\nstrDel \\= Request.Form(\"\
    del\") \n\n%> \n\nThen we write out the second form, which, as we've seen, asks\
    \ for delivery details. \n\nThe important thing is that, within this form, we\
    \ have to add two hidden form controls to hold the \n\ndetails about whether the\
    \ user wanted to collect the pizza or have it delivered and when they wanted \n\
    \nthe pizza. You can see these have been highlighted (we won't repeat form input\
    \ controls that the \n\nuser sees, as they are the same for each example): \n\n\
    128 \n\n%"
