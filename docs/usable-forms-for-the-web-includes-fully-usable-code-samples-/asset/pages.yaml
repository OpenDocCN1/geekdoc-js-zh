    \nChapter 5 \n\nStoring and Retrieving Data \n\nFor this last section of the chapter,\
    \ we're going to re-architect the survey we used earlier, \n\nemploying a MySQL\
    \ database and PHP's dynamic page generation capabilities. We'll include the \n\
    \nfollowing capabilities: \n\n• Storing user information, including name, e-mail\
    \ address, responses to the survey questions, \n\nand times of the responses.\
    \ We'll also save the user's IP address for tracking purposes. \n\n• Allowing\
    \ the user to choose a display style for the survey, and saving this choice in\
    \ one or more \n\nsession variables, along with the beginning and end times. \n\
    \n• Displaying tabulated survey results as a set of bar graphs. \n\nIn addition\
    \ to updating the pages we've used before, we'll be adding a results display page\
    \ and an \n\nadministration page where the site maintainer can view and update\
    \ the possible responses to \n\nmultiple-choice survey questions. \n\nCreating\
    \ the Database \n\nThe database and queries that we'll be using are fairly simple.\
    \ The table for the respondents needs \n\nto contain the respondent's first and\
    \ last names, e-mail address, and when they began and finished \n\nthe survey.\
    \ We also need three tables to represent the meats, cheeses, and vegetables from\
    \ which \n\nthe respondents will be able to select. Each table only needs to hold\
    \ the names of the various food \n\nitems and how many votes each one's received.\
    \ So the table schematics for our database survey \n\nshould look something like\
    \ this: \n\nTable respondents \n\nField \n\nType \n\nDescription \n\nf\\_name\
    \ \n\ntext \n\nrespondent's first name \n\nl\\_name \n\ntext \n\nrespondent's\
    \ last name \n\nemail \n\ntext \n\nrespondent's e-mail address \n\nstart\\_time\
    \ \n\ninteger \n\ntime respondent started survey \n\nend\\_time \n\ninteger \n\
    \ntime respondent completed survey \n\nip \n\ntext \n\nrespondent's IP address\
    \ \n\nTable cheeses \n\n\\----v \n\nField \n\nType \n\nDescription \n\nname \n\
    \ntext \n\nvariety of cheese \n\nvotes \n\ninteger \n\nnumber of votes recorded\
    \ for this cheese \n\n198"
