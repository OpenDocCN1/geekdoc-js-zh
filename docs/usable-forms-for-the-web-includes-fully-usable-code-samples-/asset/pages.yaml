    \ to surround them with a red border. \n\n.required {border:2px solid #FF0066;\
    \ padding:3px;} \n\ninput,textarea {background-color:#FFFFCC; padding:5px;} \n\
    \nWe also make use of a : focus pseudo-class for input and <textarea> elements\
