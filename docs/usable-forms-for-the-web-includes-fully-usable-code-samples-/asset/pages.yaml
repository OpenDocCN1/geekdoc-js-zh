    \ the test string, and leave off the final three characters, \n\nthen we've got\
    \ a recognizable phone number, or at least one that fits our formatting rules.\
    \ Our regular \n\nexpression as written allows for a match anywhere in the string,\
    \ so we need a way to specify that the first \n\ncharacter in the string must\
    \ be the 1 that we're looking for, that there are three groups of digits (possibly\
    \ \n\nseparated by spaces and/or the specified characters), and that the last\
    \ character in the string is the fourth \n\ndigit of the final group. Fortunately,\
    \ regular expression support in JavaScript provides such a way, in the \n\nform\
    \ of pattern position characters, which we list here: \n\nPosition Character \n\
    \nDescription \n\n/s \n\nthe character (or pattern) immediately following must\
    \ be at the start of \n\nthe string. \n\n$ \n\nthe character or pattern immediately\
    \ preceding must be at the end of \n\nthe string. \n\n\\\\b \n\nmatches a word\
    \ boundary, that is, the point between a word character (\\\\w) \n\nand a non-word\
    \ character (\\\\w). \n\n\\\\B \n\nmatches a position that is not a word boundary,\
    \ that is, not at either end \n\nof a word. \n\nNow we can insure that only strings\
    \ that match our pattern exactly, with no excess characters at the \n\nbeginning\
    \ or end, will pass our test and be accepted as correctly-formatted telephone\
