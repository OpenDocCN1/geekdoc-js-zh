    \nUsing Forms \n\nwith PHP and MySQL \n\nAn Aside on PHP Versions \n\nAs this\
    \ book was going to press, preparations were being made for the release of PHP\
    \ 4.2.0 and \n\nwith it a major change in the designations of the environment\
    \ variable collections we refer to here. \n\nWith the new version, PHP will support\
    \ a number of what are known as \"superglobals\" \\- that is, \n\ncollections\
    \ that are automatically global in scope, and which can be accessed by any PHP\
    \ script or \n\nfunction. (So you don't have to use the global keyword with them\
    \ to use them inside a function, as \n\nwe've had to do in this chapter.) \n\n\
    Here's a partial listing of the current collections and their new counterparts\
    \ (which are supported in \n\nversion 4.1.0, but are still global in scope there\
    \ and not yet superglobal): \n\nVersion <= 4.1.X \n\nVersion 4.2.0+ \n\n$HTTP\\\
    _GET\\_VARS \n\n$\\_GET \n\n$HTTP\\_POST\\_VARS \n\n$\\_POST \n\n$HTTP\\_SERVER\\\
    _VARS \n\n$\\_SERVER \n\n$HTTP\\_GET\\_FILES \n\n$\\_FILES \n\n$HTTP\\_COOKIE\\\
    _VARS \n\n$\\_COOKIES \n\n$HTTP\\_SESSION\\_VARS \n\n$\\_SESSION \n\nThe current\
    \ variable collections will be considered deprecated as of PHP-4.2.0, but will\
    \ continue to \n\nbe supported for the foreseeable future for reasons of backward\
    \ compatibility. All of the examples in \n\nthis book that make use of these should\
    \ continue to work, but you should be aware of the new \n\nvariables and the differences\
    \ in the way that they'll be used. You should also be prepared to begin \n\nmaking\
    \ use of them in your own PHP applications once you upgrade to version 4.2 and\
    \ to convert \n\nolder scripts that you intend to keep on using for any length\
    \ of time after that. \n\nMore information about superglobals can be obtained\
    \ on the PHP web site at \n\nhttp://www.php.net/manual/en/language.variables.predefined.php.\
    \ Be forewarned that there is some \n\nconflicting information in the current\
    \ on-site documentation; this should be reconciled once version \n\n4.2.0 has\
    \ actually been released. \n\nUsing Cookies in Our Example \n\nNow for an example.\
    \ Suppose we decide we want to know when respondents have taken our survey, \n\
    \nand how long they spent filling it out. \n\nThis means that we want to record\
    \ the time at which they load the first page and when they submit \n\nthe final\
    \ readout to the script that stores their responses in our database. We don't\
    \ really need to \n\nmaintain the start time on every page, we just need to be\
    \ able to recall it once the user's reached the \n\nend of the survey, so a cookie\
    \ looks like a pretty good way to do that. \n\nSince some users keep cookies turned\
    \ off in their browsers, we need to test for that, and to request \n\nthat they\
    \ enable cookies before beginning the survey. \n\nTo accomplish this, we create\
    \ a new page (cookie/survey\\_intro.php) in which we try to set a \n\ntest cookie:\
    \ \n\n189"
