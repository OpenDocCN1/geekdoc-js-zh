    \nHTML Forms \n\nAlternatively, we could use the <label> element as a containing\
    \ element. This is known as an implicit \n\nlabel (ch01\\_eg22.htm). \n\n<form\
    \ name-\"myForm\" action^\"http://www.example.org/names\" method=\"post\"> \n\n\
    <label>First name \n\n<input type=\"text\" name=\"txtFirstName\" id=\"fname\"\
    \ /> \n\n</labelxbr /> \n\n<label>Last name \n\n<input type=\"text11 name=\"txtLastName\"\
    \ id=\"lname\" /> \n\n</label> \n\n</form> \n\nHere, the label may only contain\
    \ one control. Furthermore, you can't use this technique when you're using \n\n\
    a table for layout, where the label in one cell is associated with the control\
    \ in another cell, because it \n\nwouldn't nest correctly. \n\nWhen a <label>\
    \ element receives focus (which we look at shortly in the section Giving Focus\
    \ to an \n\nElement), it passes the focus on to its associated control. \n\nAdding\
    \ Structure Using <fieldset> and <legend> Elements \n\nIf you're developing a\
    \ large form, there are two very helpful elements that allow you to group together\
    \ \n\nrelated information, making it easier for users to understand its purpose.\
    \ These are: \n\n• <f ieldset>, which allows you to group together related form\
    \ controls (and their labels). \n\n• <legend>, which allows you to give a <f ieldset>\
    \ a caption indicating the purpose of the \n\nitems in the fieldset, and improving\
    \ accessibility when a <fieldset> is rendered on non¬ \n\nvisual browsers. \n\n\
    Fieldsets also allow tabbing navigation between sections of forms for visual and\
    \ speech-oriented \n\nuser agents, so the use of these elements makes documents\
    \ more accessible (as we shall see in the \n\nnext section). \n\n<f ieldset> and\
    \ <legend> elements are supported from IE 4+ and Netscape 6+. \n\nOlder browsers\
    \ will just ignore these elements, so you're safe to add them to all your \n\n\
    documents. Their own nesting requirements prevent overlapping elements that don't\
    \ \n\nnest properly. \n\nBy way of an example, in the following form, we've grouped\
    \ the whole form in one fieldset, and then inside \n\nthat we have the contact\
    \ information, comments box, and submission details in separate <f ieldset> \n\
    \nelements (ch01\\_eg23 .htm). \n\n<forra name=\"myForm\"> \n\n<fieldset> \n\n\
    <legend><em>Feedback information</em></legend><br /> \n\n41"
