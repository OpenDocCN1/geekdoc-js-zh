    \ by retrieving the values from the server and putting them into variables: \n\
    \n<% \n\nDim strTime, strDel, arrDelivery \n\nstrTime \\= Session(\"time\") \n\
    \nstrDel \\= Session(\"del\"} \n\narrDelivery \\= Session(\"arrDelivery\") \n\n\
    %> \n\nHaving retrieved this information into the variables in the ASP page, we'll\
    \ display them back to the \n\nuser again: \n\n<htmlxbody> \n\nctable width=\"\
    600\"> \n\n<trxtd>What was in the forms... </tdxtd>You wanted your Pizza</tdx/tr>\
    \ \n\n<trxtd>Time:</tdxtd class=\" fillin'1 x% \\=(strTime) %></tdx/tr> \n\n<!--\
