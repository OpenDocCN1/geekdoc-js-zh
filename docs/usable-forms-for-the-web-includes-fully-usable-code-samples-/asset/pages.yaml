    \ Each of the variables tells us if the substring made up of the same \n\ncharacters\
    \ is found in the name of the current form field; it's true if that substring\
    \ occurs in the field \n\nname, and false if it doesn't. In each instance, if\
    \ the variable is true, we perform a test of the form \n\nfield's value against\
