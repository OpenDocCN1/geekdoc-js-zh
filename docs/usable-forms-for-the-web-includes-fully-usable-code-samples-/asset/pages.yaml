    \nAdvanced Client-side Form Scripting \n\nHere's a simple form that we can use\
    \ this with. It consists of a text area that we can search, a \n\n'search for'\
    \ box, and the box's accompanying Go button. \n\n<form name=\"myForm\"> \n\n<textarea\
