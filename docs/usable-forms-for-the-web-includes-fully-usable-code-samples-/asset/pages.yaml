  md: "![](img/a10b466d6e11a32674cad146197d13d9_301_0.png)![](img/a10b466d6e11a32674cad146197d13d9_301_1.png)\n\
    \nChapter 6 \n\n<% \n\nOption Explicit \n\nDim ErrMsg , \n\nErrMsg \\= \"<p>There\
    \ were problems with the following fields:</p>\" & vbCrLf & \n\n\" <p>\" \n\n\
    CurrPage will contain the filename of the current page, which we'll get later\
    \ on and use for writing the \n\nvalue of the form's action attribute. \n\nDim\
    \ CurrPage \n\nAs with the previous version of this example, we define a function\
    \ validate (), which we'll call when we \n\nknow that the form's been submitted\
    \ (that is, when there's a form variable named Submit whose value is \n\nthe string\
    \ submit). \n\nFunction Validate() \n\nAlso as before, we define a variable whose\
    \ value we'll return from the function to let us know whether or \n\nnot the form\
    \ validated successfully. We initialize its value to True and will change this\
    \ to False should \n\nwe find at least one error when the function executes. \n\
    \nDim Validated \n\nValidated \\= True \n\nNext we declare a number of variables\
    \ whose values we'll set to the necessary RegExp objects below. \n\nDim NotWhitespace,\
    \ NotAlpha, NotAlphanumeric, NotAddress \n\nDim HasSpaces, Notint, IsDecimal,\
    \ IsCc, IsUsZip, IsUsPhone \n\nDim IsEmail, IsCurrency, CurrencySigns, IsComment\
    \ \n\nWe also declare variables which we'll use to hold values for (in order):\
    \ the array of strings we'll be looking \n\nfor in the names of the forms fields\
    \ to see what's expected of each field's value; the length of this array; \n\n\
    the name of each field; and the value of each field. \n\nDim Requirements, ReqLength,\
    \ FieldName, FieldValue \n\nWe'll use the next two variables when we loop through\
    \ the strings in the Requirements array; \n\nisRequirement will contain a Boolean\
    \ value dependent upon whether or not the current string is found \n\nin the name\
    \ of a field, and currRequirement will hold the value of the current string itself.\
    \ \n\nDim IsRequirement, CurrRequirement \n\nNow we create a series of regular\
    \ expression objects. Each time we create a new instance of RegExp, \n\njust as\
    \ we did in the example code snippet in the Regular Expressions section above,\
    \ we set its \n\nPattern, ignoreCase and Global properties to appropriate values.\
    \ Except for the syntax differences \n\nalready noted, these regular expressions\
    \ are the same as their counterparts in the earlier versions of this \n\nexample,\
    \ so we won't duplicate any explanations of them that we've already given here.\
    \ \n\n286"
