  md: "![](img/a10b466d6e11a32674cad146197d13d9_186_0.png)![](img/a10b466d6e11a32674cad146197d13d9_186_1.png)\n\
    \nUsing Forms \n\nwith PHP and MySQL \n\nPHP and get \n\nAs we saw in Chapter\
    \ 4, when we use the get method for a form, the information in that form is \n\
    \nappended to the URL to which the user's web browser is directed in the form's\
    \ action attribute. \n\nThat is, the names of form fields and the values that\
    \ those fields contain are encoded and added to \n\nthe URL as key/value pairs.\
    \ \n\nFor instance, here's a very simple example form (hidden/fav\\_cheese .html\
    \ in the code download): \n\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"\
    \ \n\n\"http://www.w3.org/TR/html4/loose.dtd\"> \n\n<html> \n\n<head> \n\n<meta\
    \ http-equiv=\"Content-Type\" content=\"text/html; charset=iso-8859-l\" /> \n\n\
    <title>What's Your Favorite Cheese, Please?</title> \n\n</head> \n\n<body bgcolor=\"\
    #FFFFFF\" text=\"#000000\"> \n\n<h3>Please enter your name and favorite cheese:</h3>\
    \ \n\n<form method=\"get\" action=\"processform.php\"> \n\n<p>Name (first and\
    \ last): <input type=\"text\" name=\"cust\\_name\" /></p> \n\n<p>Favorite cheese:\
    \ <select name=\"cheese\"> \n\n<option selected>\\[choose one\\]</option> \n\n\
    coption value=\"Mozzarella\">Mozzarella</option> \n\n<option value=\"Provalone\"\
    >Provalone</option> \n\n<option value=\"Parmesan\">Parmesan</option> \n\n<option\
    \ value=\"Camembert\">Camembert</option> \n\n</selectx/p> \n\n<p><input type=\"\
    submit\" name=”submit\" value=\"Submit\" /> \n\ncinput type=\"reset\" value=\"\
    Reset\" /></p> \n\n</form> \n\n</body> \n\n</html> \n\nWhen a user named Franklin\
    \ Flambe using the domain zontar enters his name and preferred kind \n\nof cheese\
    \ into the corresponding fields and clicks the Submit button, here's what he might\
    \ see in his \n\nbrowser's location window when the next page loads: \n\nhttp://zontar/processform.php?cust\\\
    _name=Franklin+Flamb%E9&cheese=Camembert&submit=Submit \n\nNotice that special\
    \ characters such as the e in Franklin's last name are automatically hex-encoded\
    \ \n\nand spaces are converted to + signs. Note also that the Reset button's value\
    \ didn't get sent along \n\nwith the rest of the data, and it doesn't appear as\
    \ part of the query string.(This happens no matter \n\nwhat server-side scripting\
    \ language you use to process forms, since the HTML standard specifies \n\nthat\
    \ reset control values aren't to be sent by the client.) \n\nNow let's see how\
    \ PHP handles things on the receiving end. Here's the source for \n\nprocessform.php:\
    \ \n\n171"
