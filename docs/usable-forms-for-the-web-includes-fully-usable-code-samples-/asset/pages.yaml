  md: "![](img/a10b466d6e11a32674cad146197d13d9_29_0.png)![](img/a10b466d6e11a32674cad146197d13d9_29_1.png)\n\
    \nChapter 1 \n\nFor a full list of content types see RFC 2045 Multipurpose Internet\
    \ Mail Extensions Part One, Format of \n\nInternet Message Bodies, http://www.ietf.org/rfc/rfc2045.txt.\
    \ Other popular MIME types include \n\ntext/html, image/jpg, video/quicktime,\
    \ application/java, and text/css. \n\naccept-charset \\= \"charset list\" \n\n\
    The accept-charset attribute specifies the list of character encodings for input\
    \ data that is accepted by \n\nthe server processing the form. However, it's not\
    \ currently supported in IE 6 or Netscape 6, and it's more \n\nlikely that a validation\
    \ script will check the values entered by the user. The accepted encodings are\
    \ a \n\nspace- and/or comma-delimited list of charset values. If none is specified\
    \ then the default tends to be that \n\nany character set can be entered. \n\n\
    It's supposedly the browser's job to interpret the list (either the single value,\
    \ if only one is given, or one \n\nof the list of values; you cannot mix encodings).\
    \ However the two main browsers will continue to allow \n\nyou to enter your own\
    \ default charset. The server must be able to accept any single character encoding\
    \ \n\nper entity received; the default will depend on the browser. User agents\
    \ may interpret this value as the \n\ncharacter encoding used to transmit the\
    \ document containing this <form> element. For example, the \n\nfollowing form\
    \ indicates that the processing application will only accept ISO-8859-1 and UTF-8\
    \ \n\ncharacter encodings: \n\n<form accept-charset=\"iso-8859-1,utf-8\"> \n\n\
    accept \\= \"content-type-list\" \n\nThe accept attribute takes a comma-separated\
    \ list of content types that the server processing the form \n\ncan handle. However,\
    \ neither Netscape 6 nor IE 6 currently supports this attribute. When used with\
    \ an \n\n<input type=\" f ile\"> element, the browser may use this attribute to\
    \ only show files that can be \n\nprocessed. For example, this form will tell\
    \ the browser that the application can only read plain text, HTML, \n\nGIF, and\
    \ JPEG files: \n\n<form accept=\"text/plain, text/html, image/gif, image/jpg\"\
    > \n\n<input type=\"file\" name=\"upload\" /> \n\n</form> \n\ntarget \\=\"\\_blank\
    \ / \\_self / \\_parent l\\_top\" \n\nWhen the submission of a form results in\
    \ the user being presented with a new page, you can also use the \n\ntarget attribute.\
    \ This is usually used with the HTML <a> element, to indicate which browser window\
    \ or \n\nframe the new page should be loaded into. However, it also works with\
    \ forms that generate new pages. \n\nThe values it can take are: \n\n• \"\\_blank\"\
    \ for the new page to appear in a new window. \n\n• \"\\_self\" for the new page\
    \ to appear in the same frame as the form it was called from. \n\n\\\\ \n\n• \"\
    \\_parent\" for the new page to appear in the parent frameset. \n\n• \"\\_top\"\
    \ for the page to load in the full body of the window. \\- . \n\n14"
