    \nChapter 1 \n\nLabels \n\nSome form controls automatically have labels \\- for\
    \ example, buttons \\- yet most don't, including text fields, \n\ncheckboxes,\
    \ and radio buttons. Those controls that have implicit labels should use the appropriate\
    \ \n\nattribute and value to label the control. For those controls that don't\
    \ have implicit labels, there's the \n\n<label> element. The <label> element is\
    \ just used as a label for the user and does not affect the form \n\nin any other\
    \ way. \n\nFor example, to label a text input box, we could use the <label> element\
    \ as so \\- you can see that we've \n\nput this example in a table for formatting\
    \ reasons (ch01\\_eg21.htm): \n\n<form name=\"myForm” action=\"http://www.example.org/names\"\
    \ method=\"post”> \n\n<table> \n\n<tr> \n\nctdxlabel for=\"fname\">First name</labelx/td>\
    \ \n\nctdxinput type=\"text\" name=\"txtFirstName\" id=\"fname\" /x/td> \n\n</tr>\
    \ \n\n<tr> \n\n<tdxlabel for=\"lname\">Last name</labelx/td> \n\n•ctdxinput type=\"\
    text\" name=\" txtLastName\" id=\"lname\" /></td> \n\n</tr> \n\n</table> \n\n\
    </form> \n\nThe <iabel> element has an attribute called for, whose value is the\
    \ value of the id attribute on the \n\ncontrol it's used to label. Note that we've\
    \ had to add the id attribute to the control we are labeling, \n\nbecause we can't\
    \ use the value of the name attribute to indicate which element the label refers\
    \ to. \n\nSo, the textbox where the user is supposed to enter their first name\
    \ has an id whose value is fname; and \n\nto associate this control with the appropriate\
    \ label, we add the value fname to the for attribute of the \n\n<label> element.\
    \ \n\nHere's the result: \n\nsimple label \n\n0@ \n\nFirst name Terry \n\nlast\
    \ name Sau \n\nLocal machine zone \n\nSome points to remember about labels are:\
    \ \n\n• The label itself may be positioned before or after the associated control.\
    \ \n\n• Each <label> element is associated with exactly one form control. \n\n\
    • More than one label may be associated with the same control by creating multiple\
    \ references \n\nvia the for attribute. \n\n40"
