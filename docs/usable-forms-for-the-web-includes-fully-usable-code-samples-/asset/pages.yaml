  md: "![](img/a10b466d6e11a32674cad146197d13d9_188_0.png)![](img/a10b466d6e11a32674cad146197d13d9_188_1.png)\n\
    \nUsing Forms \n\nwith PHP and MySQL \n\nAs the recognized standard for web pages\
    \ is now HTML 4.01 (or its reformulation, XHTML 1.0), \n\nwhich mandates XML-compliance,\
    \ we recommend the method we've used in the example above as \n\nbeing the easiest\
    \ way to achieve this, and we'll continue to use this throughout the book. \n\n\
    Variables in PHP \n\nLet's get back to the code itself. As you can see, it's very\
    \ easy to get the form values from the previous \n\npage. PHP reads the query\
    \ string and automatically creates variables with the same names as those of \n\
    \nthe keys in the key/value pairs. In the case of this example, the first page\
    \ contains controls named \n\ncust\\_name, cheese, and submit, and transmits these\
    \ as the keys in the key/value pairs. \n\nIn the page receiving the get request,\
    \ we print out the values of two of these using variables named \n\n$cust\\_name\
    \ and $cheese and PHP's echo function, which simply outputs a value to the page.\
    \ \n\nNotice that in PHP, all variable names must be preceded with a dollar sign\
    \ ($), and that we're \n\nrequired to terminate each statement with a semicolon\
    \ (;). (Strictly speaking, the last line in a PHP \n\nblock doesn't require the\
    \ semicolon, but it's better to include it, in case you add additional lines and\
    \ \n\nforget to add the semicolon that you omitted earlier.) Failing to do either\
    \ of these things will generate \n\nerrors: you're liable to see warnings about\
    \ these instead of the results you're expecting in the \n\ngenerated page. \n\n\
    Also note that PHP variable names are case-sensitive, so a block such as $my\\\
    _name \\= \" john \n\ndoe\"; echo $My\\_Name; will not print out the string \"\
    John Doe\"! \n\nAs you can see in the screenshot opposite, converting the escaped\
    \ values in the query string back to \n\ntheir normal equivalents (or spaces in\
    \ the case of the plus signs) is also quite simple \\- PHP does \n\nthis work\
    \ for us automatically. Note, however, that this isn't the case with quotation\
    \ marks in string \n\nvalues \\- we'll discuss this issue below. \n\nUnlike some\
    \ programming languages, PHP is also very liberal about variables and their types.\
    \ \n\nYou're not required to declare variables or to state their types explicitly.\
    \ (In more technical terms, \n\nPHP is loosely-typed, just like JavaScript, VBScript,\
    \ and Perl.) To create a new variable, all that's \n\nrequired is to assign it\
    \ a value. Here are a couple of examples: \n\n$customer\\_name \\= \"John Doe\"\
    ; \n\n$crust\\_style \\= 'thin'; \n\n$extra\\_cheese \\= 1.75; \n\n$number\\_of\\\
    _pizzas \\= 3; \n\nPHP does recognize several different data types internally,\
    \ including strings, integers, floating point \n\nnumbers, Boolean true/false\
    \ values, and others, so it's important when dealing with forms to \n\nremember\
    \ that their values are always passed as strings. For example, if you need to\
    \ multiply a \n\nvariable named $number\\_of\\_pizzas, which contains an integer\
    \ value, by a form variable named \n\n$price\\_per\\_large that represents the\
    \ price for a large pizza, you'll need to make sure that you've \n\nconverted\
    \ the latter to a number first, using one of PHP's built-in conversion functions:\
    \ \n\n// $number\\_of\\_pizzas is a number (3) \n\n$number\\_of\\_pizzas \\= 3;\
    \ \n\n// suppose that $price\\_per\\_large is equal to the string \"11.95\" \n\
    \n$subtotal \\= $number\\_of\\_pizzas \\* doubleval( $price\\_per\\_large ); \n\
    \n// doubleval( $price\\_per\\_large ) is the floating point value 11.95, \n\n\
    // so $subtotal is now equal to 3 \\* 11.95 \\= 35.85 \n\n173"
