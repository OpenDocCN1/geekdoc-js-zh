  md: "![](img/a10b466d6e11a32674cad146197d13d9_91_0.png)![](img/a10b466d6e11a32674cad146197d13d9_91_1.png)\n\
    \nChapter 2 \n\nThe simplest way to label a form control is just to use text next\
    \ to it, for example: \n\nStreet number and name \\* cinput type=\"text\" name=\"\
    street\" size=\"40\" /xbr /> \n\nSuburb \\* <input type=\"text\" name=\"suburb\"\
    \ size=\"40\" /xbr /> \n\nPost code \\* cinput type=\"password\" name=\"postcode\"\
    \ size=\"6\" /xbr /> \n\nwhich would look something like this: ’ \n\n(You can\
    \ find all the code examples in this section in ch02\\_eg7.htm.) \n\nThe presentation\
    \ is not that attractive, but we'll see how we can create better layout in the\
    \ following \n\nsection. This type of labeling is a lot simpler than explicit\
    \ labeling \\- although it does require careful \n\npositioning of values. \n\n\
    The alternative is explicit labeling through the use of the <label> element. Remember,\
    \ while the \n\n<iabel> element was only introduced in IE 4 and Netscape 6, older\
    \ browsers ignore the element \n\nand just display its content anyway. The <label>\
    \ element must either contain the form control or \n\ncarry a for attribute whose\
    \ value is the value of the id attribute for the form control it is labeling.\
    \ \n\nHere you can see the use of the for and id attributes: \n\nclabel for=\"\
    street\">Street number and name \\* </label> \n\ncinput id=\"street\" type=\"\
    text\" name=\"street\" size=\"40\" />cbr /> \n\nclabel for=\"suburb\">Suburb \\\
    * c/label> \n\ncinput id=\"suburb\" type=\"text\" name=\"suburb\" size=\"40\"\
    \ />cbr /> \n\nclabel for=\"postcode\">Post code \\* c/label> \n\ncinput id=\"\
    postcode\" type=\"password\" name=\"postcode\" size=\"6\" />cbr /> \n\nc/form>\
    \ \n\nThis gives the same output as the previous example. \n\nAs we saw earlier\
    \ in the chapter, labels can also be used along with script to increase the clickable\
    \ \n\nsize of a radio button or checkbox. \n\nFinally, here's an example of nesting\
    \ the form control inside the <label> element. This time, we \n\ndon't require\
    \ a for attribute: \n\nclabel \\>Street number and name \\* cinput type=\"text\"\
    \ name=\"street\" size=\"40\" /> \n\nc/label>cbr /> \n\nclabel>Suburb \\* cinput\
    \ type=\"text\" name=\"suburb\" size=\"40\" /> \n\nc/label>cbr /> \n\nclabel>Post\
    \ code \\* cinput type=\"password\" name=\"postcode\" size=\"6\" /> \n\nc/label>cbr\
    \ /> \n\n76"
