    ) %>\" /> \n\n</td> \n\n<td> \n\n\\*Telephone Number with area code: \n\n<input\
    \ type=''text\" name=\"TelephoneONumber\\_required\\_usphone\" \n\nvalue=\"<%\
    \ \\=Request.Form(\"TelephoneONumber\\_required\\_usphone\") %>\" /> \n\n</td>\
    \ \n\n</tr> \n\n<tr> \n\n<td colspan=\"2“> \n\n\\*Amount of Contribution: \n\n\
    <input type=\"text\" name=\"AmountOOfOContribution\\_required\\_currencyval\"\
    \ \n\nvalue=\"<% \\=Request. Form (\"AmountOOf OContribution\\_required\\_currencyval\"\
    ) %>\" \n\n</td> \n\n<td> \n\nFeedback:<br /> \n\nNote that the value of a <textarea>\
    \ isn't contained in a value attribute, but rather is the content of the \n\n\
    <textarea> element itself, which as you'll likely recall requires both an opening\
