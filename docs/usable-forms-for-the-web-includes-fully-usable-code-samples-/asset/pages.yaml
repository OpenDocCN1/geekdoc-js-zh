    \nAlso from glassnaus: \n\nUsability: \n\nThe Site Speaks For Itself \n\nBraun\
    \ Gadney Htughey. Rosett Synsteli«n. Wanot. Werthemi or \n\nSdfad by Milt/ E.\
    \ Hotzychtaa and 8-uta U»\\* \\*>n \n\nwp ^(r#)^ \n\n\\*1 • v \n\n■ \n\njTLj \n\
    \nt \n\n? \n\nIT .. \n\neBay \n\ncase studies from the makers o! \n\nBBC News\
    \ \n\nevolt.org \n\nSynFonts \n\nEconomist.com \n\nMetaFilter \n\n\\[giasshaus\
    \ \n\nUsability: The Site Speaks for Itself \n\nKelly Braun, Max Gadney, Matt\
    \ Haughey, Adrian Roselli, \n\nDon Synstelien, Tom Walter, David Wertheimer \n\
    \n1-904151-03-5 \n\nMay 2002 \n\nUS: $49.99 \n\nC: $77.99 \n\nUK: £36.99 \n\n\
    This book features case studies in usability and information architecture from\
    \ \n\nthe makers of eBay, SynFonts (a Flash-driven font foundry e-commerce site)\
    \ \n\nthe BBC News Online site, Economist.com web site, evolt.org (a peer-to-\
    \ \n\npeer web professional site), and MetaFilter. \n\nThere are no hard-and-fast\
    \ rules for usability on the Web, which is why this book steers away from the\
    \ rigid prescrip¬ \n\ntions of gurus. Instead, it looks at six very different,\
    \ but highly usable sites. The web professionals behind these sites \n\ndiscuss\
    \ the design of each from their inception to today, how they solicited and responded\
    \ to feedback, how they \n\nidentified and dealt with problems, and how they met\
    \ the audience's needs and expectations. \n\nThis book is edited by Molly E. Holzschlag,\
    \ a member of Web Standards Project (WaSP) and author of a dozen books \n\non\
    \ web technologies, and Bruce Lawson, glasshaus brand manager. \n\nCascading Style\
    \ Sheets: Separating Content from Presentation \n\nOwen Briggs, Steven Champeon,\
    \ Eric Costello, Matt Patterson \n\n1-904151-04-3 \n\nMay 2002 \n\nUS $ 34.99\
    \ \n\nC: $54.99 \n\nUK: £25.99 \n\nThis is a focused guide to using Cascading\
    \ Style Sheets (CSS) for the visual \n\ndesign of web pages. It's practical, there's\
    \ no fluff, and the core CSS skills are \n\nbalanced by techniques for using the\
    \ technology in today's browsers. \n\nTools of th« Tr.ioo \n\nCascading Style\
    \ Sheets: \n\nSeparating Content from Presentation \n\nOwen Briggs Steven Cnampecn\
    \ Eric Cosiella end Man Psttemn \n\n\\[glasshaus \n\nWith CSS, we can lay out\
    \ HTML data on a web page without either misusing tags or using hacks to get the\
    \ page \n\nlooking right. The complete separation of content from presentation\
    \ enables web professionals to change the entire \n\ndesign of a site by modifying\
    \ one stylesheet, rather than updating every document that the web site contains.\
    \ \n\nCSS is one of the trio of core client-side web professional skills: HTML\
    \ for markup, JavaScript for dynamism, \n\nand CSS for style. All web professionals\
    \ who want to take their page design to the next level, with all the \n\nadvantages\
    \ that CSS brings, will need this book."
