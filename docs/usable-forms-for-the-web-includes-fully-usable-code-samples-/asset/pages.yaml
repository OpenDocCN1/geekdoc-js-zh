  md: "![](img/a10b466d6e11a32674cad146197d13d9_106_0.png)![](img/a10b466d6e11a32674cad146197d13d9_106_1.png)\n\
    \nDesigning Usable Forms \n\nSummary \n\nMost of us don't like to have to fill\
    \ in forms \\- they seem like a chore! Therefore, we have to be extra \n\ncareful\
    \ in how we design forms for the Web if we want users to make use of them. Badly\
    \ designed \n\nforms may simply not be completed by many people who try to use\
    \ them. \n\nIn this chapter, we've looked at the importance of designing your\
    \ forms to increase their usability and \n\naccessibility, and we've seen some\
    \ of the techniques that we can employ to make our forms easier \n\nto use \\\
    - for everyone, including those with disabilities. \n\nWe looked at these topics\
    \ in chronological order, from working out what we really need to know and \n\n\
    how we're going to use the information, through designing the form (including\
    \ which components we \n\nshould choose and where to put them), to testing our\
    \ forms. \n\nWith careful design, both you and your users will benefit from the\
    \ forms you provide. \n\nf \n\n91"
