  md: "![](img/a10b466d6e11a32674cad146197d13d9_309_0.png)![](img/a10b466d6e11a32674cad146197d13d9_309_1.png)\n\
    \nChapter 6 \n\n&nbsp;Address Line 2: cinput type=\"text'' name=\"Address0Line02\\\
    _address\" \n\nvalue=\"<% \\=Request.Form(\"Address0Line02\\_address\") %>\" />\
    \ \n\n</td> \n\n</tr> \n\n<tr> \n\n<td> \n\n\\*City: <input type=\"text\" name=\"\
    City\\_required\\_alphabetical\" \n\nvalue=\"<% \\=Request.Form(\"City\\_required\\\
    _alphabetical\") %>“ /> \n\n</td> \n\nAs with PHP, select-option controls are\
    \ handled a little differently. For the state drop-down, we check \n\nthe value\
    \ of Request. Form (\" state\\_required\"); if it's empty, then we know that no\
    \ state's yet been \n\nselected and therefore write selected=\" selected\" into\
    \ the first (default) <option> tag. \n\n<td> \n\n&nbsp;\\*State: <select name=\"\
    State\\_required\"> \n\n<option value=\"<% If Request.Form(\"State\\_required\"\
    ) \\= \"\" Then %> \n\nselected=\"selected\" \n\n<% End If %>\">\\[ choose one\
    \ \\] \n\n</option> \n\nNow we build the rest of the state options. Just as we\
    \ did for the previous two examples, we store all 51 \n\nabbreviations in an array\
    \ (which we've conveniently named states), then loop through the array's elements.\
    \ \n\n<% \n\nDim States, StateCount \n\nArray(\"AL\", \n\n\"AK\" , \n\n\"AZ 11\
    \ , \n\n\"AR\" , \n\n\"CA\" , \n\n\"CO\" , \n\n\" CT\" , \n\n\"DE\" , \n\n\"DC\"\
    \ \n\n\" FL\" , \n\n\"GA\" , \n\n\"HI\" , \n\n\"ID\" , \n\n\"IL\" , \n\n\"IN\"\
    \ , \n\n\" IA\" , \n\n\" KS ” , \n\n\"KY\" \n\n\"LA\" , \n\n\"ME\" , \n\n\" MD\"\
    \ , \n\n\"MA\" , \n\n\"MI\" , \n\n\"MN\" , \n\n\"MS\" , \n\n\"MO\" , \n\n\"MT\"\
    \ \n\n\" NE\" , \n\n\"NV\" , \n\n\"NH\" , \n\n\"NJ\" , \n\n\"NM\" , \n\n\"NY\"\
    \ , \n\n\"NC\" , \n\n\"ND\" , \n\n\"OH\" \n\n\"OK\" , \n\n\"OR\" , \n\n\" PA\"\
    \ , \n\n\"RI\" , \n\n\" SC\" , \n\n\"SD\" , \n\n\" TN \" , \n\n\"TX\" , \n\n\"\
    \ UT \" \n\n\" VT\" , \n\n\"VA\" , \n\n\"WA\" , \n\n\"WV\" , \n\n\"WI\" , \n\n\
    \"WY\" ) \n\nStateCount \\= UBound(States) \n\nFor Count=0 To StateCount \n\n\
    Each pass through the For . . . Next loop we write an <option> tag using the current\
    \ states \n\nelement's value for its value attribute and the option text. We also\
    \ check to see if the current element's \n\nvalue matches that of Request. Form\
    \ (\" State\\_required\"), and if it does, we also write \n\nselected=\" selected\"\
    \ into the opening tag. In this way, we're able to preserve and display the option\
    \ \n\nalready selected by the user if there is any. Again we're using the same\
    \ technique to build this control as \n\nwe did previously using PHP or JavaScript;\
    \ we're merely employing a different programming language in \n\na different host\
    \ environment. \\\\ \n\nThere are a number of advantages of using this technique\
    \ over hard-coding most or all of the HTML \n\nneeded to build complex form controls\
    \ with a lot of user choices. For one thing, it's less error-prone: you \n\nneed\
    \ only to get the HTML right once. For another, it saves space. Only about 1500\
    \ bytes in this case, but \n\nif you're using a lot of repetitive elements on\
    \ a large number of pages, it can start to add up fairly quickly. \n\n(If you\
    \ have to include an if. . . check in every line, the savings is more to the order\
    \ of 5 Kb.) It's also \n\neasily updated or adapted to meet changing needs. Suppose\
    \ the folks over in Marketing decide they want \n\nto include respondents from\
    \ Puerto Rico (PR) or the Virgin Islands (VI); it's just a matter of a minute\
    \ or \n\ntwo with a text editor to accommodate them. \n\n294"
