    \nForm Validation Techniques \n\nreturn returnVal; \n\n} \n\nWe should point out\
    \ that failing to return any value at all will allow the form to be submitted,\
    \ so it's good \n\npractice to return either a true or false, and you should be\
    \ sure to use a return statement in the \n\nform's onsubmit handler as well. There\
    \ is an alternative to using a Submit button and calling the \n\nvalidation script\
    \ from the form's onsubmit handler: we can use a button input like so \n\ncinput\
    \ type=\"button\" onclick=\"validate(this.form);\" /> \n\nand then instead of\
    \ returning returnVal from the function, call the form's submit () method by \n\
    \nreplacing the statement return returnVal; with else form, submit () ;. However,\
    \ this means that \n\nusers who can't or won't enable JavaScript in their browsers\
    \ won't be able to submit the form at all, so we \n\ndon't recommend this way\
    \ of doing things unless you know for certain that all your users will be employing\
    \ \n\na JavaScript-capable client. \n\nWe've covered a lot of territory in our\
    \ discussion of client-side validation techniques, and it's time to move \n\n\
    on to validating forms on the server. While the upcoming section will be much\
    \ shorter than what you've \n\nread so far, don't think that we're going to give\
    \ server-side validation short shrift. After all, as we've \n\npointed out already,\
    \ it is your last line of defence against incorrectly formatted or even harmful\
    \ data being \n\nsaved to a file or database. However, we'll be reusing a great\
    \ deal of what we've covered above, \n\nespecially regular expressions, as these\
    \ don't differ that much from language to language. We'll also be \n\nemploying\
    \ the same naming scheme we've introduced in this section. \n\nServer-side Validation\
    \ Techniques \n\nNow we will go on to the flip side of form data validation techniques\
    \ \\- the server-side. \n\nOverview \n\nWe'll take what we've learned in Chapters\
    \ 4 and 5 about form data handling on the server using PHP and \n\nASP and add\
    \ to it what we saw in the previous section about validation using string methods\
    \ and regular \n\nexpressions to see some ways how we can validate form data on\
    \ the server before using it in web site \n\nfiles or data stores. \n\nBoth PHP\
    \ and ASP implement collections for form variables being sent to the server via\
    \ get or post, \n\nwhich are generally similar although there are some differences\
    \ in their implementation details under each \n\none. For one thing, PHP can make\
    \ it easier to work with form variables since we can bypass the \n\ncollections\
    \ altogether and simply use the form field names. However, when dealing with large\
    \ forms or \n\nwhen we're trying to write generic form handlers, we can still\
    \ make use of these collections \n\n($http\\_get\\_vars and $http\\_post\\_vars),\
    \ as we'll be doing below. In ASP, however, there's not such \n\na shortcut available\
    \ and we have to access values passed from forms via the Request. Querystring\
    \ \n\nand Request. Form collections. We'll look at three major issues that need\
    \ to be considered: \n\n• Empty and Incorrectly Formatted Fields: We'll discuss\
    \ methods under each implementation \n\nfor making sure that required fields have\
    \ been filled out, and that the values entered in them are \n\nformatted according\
    \ to our needs. \n\n• Redisplaying Forms: In cases where user errors are discovered,\
    \ we'll need to redisplay the \n\nform with data intact, and with fields containing\
    \ errors indicated and the nature of each error \n\nexplained to the user. \n\n\
    267"
