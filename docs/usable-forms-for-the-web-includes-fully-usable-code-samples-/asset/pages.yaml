  md: "![](img/a10b466d6e11a32674cad146197d13d9_28_0.png)![](img/a10b466d6e11a32674cad146197d13d9_28_1.png)\n\
    \nHTML Forms \n\nWe cover the two methods in greater detail near the end of the\
    \ chapter in the Form Submission section. \n\nHowever, generally speaking: \n\n\
    • Use get when the data is short plain ASCII text, is NOT sensitive (as it's passed\
    \ as part of the \n\nURL), and does not change values (such as those in a database).\
    \ \n\n• Use post for formats other than ASCII text, where the data set is larger,\
    \ when you don't want \n\nthe data to be visible on the end of the URL, and when\
    \ it will change values on the server. \n\nid \\= \"cdata\" \n\nThe id attribute\
    \ is a unique identifier for the <form> element so that it can be referred to\
    \ from a \n\nstylesheet or from a script. The value of this attribute should be\
    \ unique to the <form> element it \n\nidentifies. \n\nname \\= \"cdata\" \n\n\
    The name attribute names the <form> element so that it can be referred to from\
    \ a stylesheet or from a \n\nscript. This attribute has been retained for backwards\
    \ compatibility, although the id attribute should be \n\nused now. \n\nonsubmit\
    \ and onreset \n\nonsubmit and onreset are events that are fired when the form\
    \ is submitted or reset. These attributes \n\nare used to associate script with\
    \ these events. Their values are inline script functions that have been \n\ndefined\
    \ in the head of the document. For example: \n\nonsubmit=“validateFormDetails()\"\
    \ \n\nwhere the validateFormDetails () function has been defined in the head of\
    \ the HTML document. \n\nAs we shall see in Chapter 6, it's common to put client-side\
    \ validation functions as the value of the \n\nonsubmit attribute, which causes\
    \ them to be run when the user tries to submit the form. \n\nenctype \\= \"content-type\"\
    \ \n\nThe enctype attribute specifies the content type used to submit the form\
    \ to the server. As we shall see \n\nlater, this is only relevant if the method\
    \ attribute has a value of post (if the value of method is get, then \n\nthe values\
    \ get appended to the URL). The value should be a MIME type. Some common mime\
    \ types can \n\nbe found at ftp://ftp.isi.edu/in-notes/iana/assignments/media-types/.\
    \ The MIME type usually associated \n\nwith forms that just contain text and the\
    \ results of form controls is: \n\nenctype=\"application/x-www-form-urlencoded\"\
    \ \n\nThis is the default when method \\= \"post\". However, if you're going to\
    \ send large quantities of binary \n\ndata, such as when you want a user to upload\
    \ a file or non-ASCII characters, then this method is \n\ninefficient, and you\
    \ should use: \n\nenctype=\"multipart/form-data\" \n\nThis sends the form data\
    \ in a series of parts, each of which correspond to a successful form control,\
    \ sent \n\nin the order in which they appear on the form. The parts can have an\
    \ optional content-type header of their \n\nown to indicate the type of data used\
    \ and the content-type header that should be sent with it. This can be \n\nany\
    \ of the MIME types listed in RFC 2045. \n\n13"
