    \nChapter 7 \n\nNote that you might get slightly different results here between\
    \ different browsers. This \n\nis because the carriage return/linefeed is interpreted\
    \ as one character in IE, while it's \n\ntreated as two characters in Netscape.\
    \ You could make this function more reliable by \n\nchecking for carriage returns/linefeeds\
    \ and counting them as just one character. \n\nReplacing Characters Using indexOf()\
    \ \n\nBecause the JavaScript replace () method is only available for use in Netscape\
    \ 4+ and IE 4+ (if \n\nwe're using regular expressions), we can use the indexOf\
    \ () and substring () methods as a \n\nfunctional equivalent of the replace ()\
    \ method that works in older browsers. The indexOf () \n\nmethod has been available\
    \ since Netscape 2 and IE 3. \n\nHere's a general function called replaceChars\
    \ (), which you can use instead of the replace () \n\nmethod. It takes three parameters:\
    \ \n\n• strText \\- the string that we're searching within. \n\n• strSearch \\\
    - the string that we're looking for. \n\n• strReplacement \\- the string that\
    \ we're replacing when we find a match. \n\nAs you might imagine, this is not\
    \ as powerful as using regular expressions (for example, you can't \n\nautomatically\
    \ check for word boundaries), but it is helpful if you have to deal with older\
    \ browsers. \n\nWe first check whether there's any matching text. If there is,\
    \ we create a while loop. Every time we \n\nfind the string in a position that's\
    \ equal to or greater than 0, we collect its start point, which is stored \n\n\
    in the variable intPos. Then we: \n\n• Collect the substring up to the start of\
    \ the found string. \n\n• Add the replacement value. \n\n• Add the remaining text,\
    \ from the end of the found string (that is, the position intPos plus the \n\n\
    length of the search string). \n\n• Reset intPos to start searching after the\
    \ replacement text. \n\nFinally, we make the new text the value of the textbox.\
    \ This gets repeated until all occurrences of the \n\nstring have been replaced.\
    \ Here's the function (ch07\\_egl2 .htm): \n\nfunction replaceChars(strText, strSearch,\
    \ strReplace) { \n\nvar intPos \\= strText.indexOf(strSearch); \n\nif (intPos\
    \ \\== \\-1) alert(’not found'); \n\nvar strReturn \\= strText; ' \n\nwhile (intPos\
    \ \\>= 0) { \n\nstrReturn \\= strReturn.substring(0, intPos) + strReplace + \n\
    \nstrReturn.substring(intPos + strSearch.length, strReturn.length); \n\nintPos\
    \ \\= strReturn.indexOf(strSearch, intPos + strReplace.length); \n\n} \n\ndocument.myForm.myTextArea,value\
    \ \\= strReturn; \n\n}"
