  md: "![](img/a10b466d6e11a32674cad146197d13d9_84_0.png)![](img/a10b466d6e11a32674cad146197d13d9_84_1.png)\n\
    \nDesigning Usable Forms \n\nWhile drop-down menus help you get the data in the\
    \ way that you want to receive it, you should \n\nmake sure that it's clear how\
    \ users are supposed to enter the data. Remember that many users will \n\nprefer\
    \ to enter text rather than use drop-downs, and careful use of the text input\
    \ controls can be \n\nmore straightforward than drop-downs. For example, which\
    \ of the following is a more natural way to \n\nenter your date of birth (ch02\\\
    _eg3.htm)? \n\n0 Drop down or text box \n\nas \n\nEnter your date of birth\\_\
    \ \n\n1 $|| January $ |\\[ 1964 $ | \n\nEnter your date of birth (eg 28/02/1964)\
    \ ^(Day)^ ^(Month)^ ^(Year)^ \n\nr r i— \n\nWhile the first option using select\
    \ boxes may introduce fewer errors, the second method is more \n\nlikely to be\
    \ familiar to users. Dates notoriously introduce problems, as Americans are more\
    \ used to \n\nusing the format MM/DD/YYYY while European users are more familiar\
    \ with DD/MM/YYYY. Indeed, \n\nboth groups also have a tendency just to enter\
    \ two digits for the year. \n\nYou should also be careful when using context-dependent\
    \ drop-down menus, where options change \n\nbased on a selection already made\
    \ by the user. While they can be helpful, users won't tend to notice \n\nthat\
    \ the options change based on other events, and this can introduce errors. We\
    \ look at context- \n\ndependent menus in Chapter 7. \\* \n\nSome sites make use\
    \ of the onchange event with drop-down menus, to call a JavaScript \n\nthat navigates\
    \ between pages and sections of a site depending on what the user selects \n\n\
    from the menu. You should be wary of using these as they can cause problems for\
    \ screen \n\nreaders, which will automatically jump to the first option. A solution\
    \ to this is to use a Go \n\nbutton after the drop-down menu, with the one lick\
    \ event of the button causing navigation \n\nrather than the onchange event of\
    \ the select box. \n\nTextboxes \n\nTextboxes are often a more natural way for\
    \ users to provide information \\- unless there is a clear and \n\nlimited choice\
    \ of options for them to choose from. We just saw a demonstration of this with\
    \ the date \n\nof birth example. Users tend to prefer textboxes as long as they\
    \ make sense. \n\nUsers often take the size of a textbox to be an indication of\
    \ the length of answer \n\nyou want them to give. \n\nFollowing on from that,\
    \ generally speaking, text areas should be large enough for users to enter what\
    \ \n\nthey need to without having scroll bars appear. The only exception to this\
    \ is when the user has to \n\nenter large amounts of data, such as e-mails or\
    \ articles. \n\nThe use of textboxes might require extra processing on the server,\
    \ although it's often worthwhile. \n\nYou may, however, choose to provide users\
    \ with options when the answer is easily mistyped or \n\nwhen you need to get\
    \ data in a specific format. \n\n69"
