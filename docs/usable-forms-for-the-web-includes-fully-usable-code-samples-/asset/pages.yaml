  md: "![](img/a10b466d6e11a32674cad146197d13d9_283_0.png)![](img/a10b466d6e11a32674cad146197d13d9_283_1.png)\n\
    \nChapter 6 \n\n• Security Issues: It's possible for knowledgeable and unfriendly\
    \ users to implant content that \n\nranges from the annoying to the downright\
    \ dangerous. We'll look at some basic strategies for \n\ncombating this, and point\
    \ you to some additional resources where you can learn more. \n\nOur basic method\
    \ of attack will be to reimplement the validate () function from the previous\
    \ section of \n\nthis chapter using PHP and then ASP with VBScript, with some\
    \ appropriate changes and additions. \n\nPHP Specifics \n\nFirst, let's look at\
    \ the PHP implementation. \n\nRegular Expressions and RegExp Functions \n\nPHP\
    \ actually supports two different sets of regular expressions and functions for\
    \ using them, POSIX and \n\nPerl-compatible (PCRE). We'll be using PCRE for our\
    \ examples here, as it's virtually the same as \n\nwhat's supported both in JavaScript\
    \ and VBScript. Older PHP distributions had only POSIX regular \n\nexpressions,\
    \ but recent versions on both Linux and Windows support PCRE. To see if the PHP\
    \ \n\ninstallation you're using includes PCRE, just check the output of the phpinf\
    \ o () function in a web \n\nbrowser. You should see something like this somewhere\
    \ in the page (usually about halfway down): \n\npcre \n\nPCRE (Perl Compatible\
    \ Regular Expressions) Support \n\nenabled \n\nPCRE Library Version \n\n3,4 22-Aug-2000\
    \ \n\nIf you don't find this in the ouput, see the PCRE page in the PHP Manual\
    \ (page available online at \n\nhttp://www.php.net/manual/en/ref.pcre.php) for\
    \ information on how to enable PCRE support. If you'd like \n\nto learn more about\
    \ POSIX-style regular expressions, see http://www.php.net/manual/en/ref.regex.php\
    \ \n\nto get started with those. \n\nThe principal difference betweenJavaScript\
    \ RegExp syntax and that of PCRE is that in the latter you can \n\nuse virtually\
    \ any non-alphanumeric character as a delimiter instead of being limited to using\
    \ forward \n\nslashes. In this chapter, however, we'll stick to forward slashes.\
    \ PHP also doesn't make use of the g \n\nglobal modifier since regular expressions\
    \ are global by default. In addition, it should be noted that PHP \n\ndoesn't\
    \ have a RegExp object like JavaScript does \\- and PHP has functions rather than\
    \ methods of a \n\nRegExp or string object. These functions generally take a regular\
    \ expression pattern enclosed in \n\nquotes as one or more of their arguments.\
    \ Any other differences from what we've been using so far will be \n\nnoted as\
    \ we encounter them. Now let's take a look at a couple of PHP's PCRE functions:\
    \ \n\n• preg\\_match(paffern, subject) \\- This function takes a RegExp pattern\
    \ and a string,to be \n\nsearched (subject) as parameters and returns a l if a\
    \ match is found or 0 if one isn't. (These \n\nvalues can be used as though they\
    \ were true and false.) Let's have a look at an example: \n\necho preg\\_match(\"\
    /\\[a-zA-Z\\]/ \",\"123\") . \"<br />\"; \n\necho preg\\_match(\"/\\\\d/\",\"\
    abc\") . \"<br />\"; \n\necho preg\\_match(\"/\\[a-zA-Z\\]/\",\"abc\") . \"<br\
    \ />\"; \n\necho preg\\_match(\"/\\\\d/\",\"123\"); \n\nThe output of these is\
    \ 0, 0,1, 1, respectively. \n\n268"
