    \ compatibility we need to use the fully qualified object reference. \n\nelse\
    \ \n\nalert(\"You picked \"+form.colors.options\\[selected\\],value+\".\"); \n\
    \n} \n\nAnother technique we can employ is to preselect an option for the user\
    \ by setting coption .. . \n\nselected=\" selected\" \\> for that option. Should\
    \ we choose to do so, we can tell whether or not the user \n\nselected a different\
    \ option by comparing the Select object's selectedindex with the index of the\
    \ \n\npreselected option. Yet another strategy is to use the <select> element's\
    \ onchange event handler; any \n\nscript that's attached to this handler won't\
    \ be run until the user actually changes the selected option. \n\nRadiobutton\
    \ Elements \n\nAs we've discussed earlier in the chapters on form HTML and client-side\
    \ scripting with forms, a set of \n\nradiobutton elements is distinguished by\
    \ the fact that all the radiobuttons in the group share a common \n\nname attribute,\
    \ and that only one radiobutton in the group can be selected at one time. There\
    \ are at least \n\nfour main strategies that we can employ in order to guarantee\
    \ that one of them has been selected before \n\na form is submitted (the second\
    \ and third of these being dependent on the user's browser supporting \n\nJavaScript,\
    \ of course): \n\n• Pre-select one of the radiobuttons by setting its checked\
    \ property: <input type=\"radio\" \n\nname=\"colors\" checked=\"checked\" />.\
    \ We saw an example of this in the survey we \n\ndeveloped in Chapter 5 where\
    \ we asked the respondent to rate meat toppings for pizza. \n\n• Loop through\
    \ the radiobuttons' checked properties. Let's look at a brief example — here's\
    \ the \n\nHTML for the form containing the radiobuttons: \n\n<form name= \n\n\
    <p>What's \n\n<pxinput \n\n<p><input \n\n<p><input \n\n<pxinput \n\n<pxinput \n\
    \n<pxinput \n\n/></p> \n\n</form> \n\n'pickColor\"> \n\nyour favourite colour?\
    \ (choose one)</p> \n\ntype=\"radio\" \n\ntype=\"radio\" \n\ntype=\"radio\" \n\
    \ntype=\"radio\" \n\ntype=\"radio\" \n\nname=\"colors\" \n\nname=\"colors\" \n\
    \nname=\"colors\" \n\nname=\"colors' \n\nname=\"colors' \n\nvalue=\"red\" />Red</p>\
    \ \n\nvalue=\"green\" />Green</p> \n\nvalue=\"blue\" />Blue</p> \n\nvalue=\"yellow\"\
    \ />Yellow</p> \n\nvalue=\"orange\" />Orange</p> \n\ntype=\"button\" value=\"\
    Click Me\" onclick=\"chooseColor(this.form) \n\nThe complete listing for radiobuttons\\\
    _1.html is in the ch6 directory of the code download package. For \n\nthe moment,\
    \ we're using a button input's onclick handler, but we can apply the same sort\
    \ of check with \n\na Submit button in a function called from the form’s onsubmit\
