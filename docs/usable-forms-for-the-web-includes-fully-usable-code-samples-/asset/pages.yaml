    \nChapter 7 \n\nDisabling a Text Input \n\nSometimes you might only want a user\
    \ to enter data for a text input if they've answered another \n\nquestion already.\
    \ For example, if you provide a list of radio buttons as options, and also provide\
    \ an \n\n1other1 option, you would only want a user to enter text next to the\
    \ 'other' option if they had chosen it. \n\nTo make this happen, we can disable\
    \ the textbox when it loads, and give it a value of 'not \n\napplicable'. Each\
    \ time the user selects a radio button, we check which option they selected. If\
    \ its \n\nvalue is 'other1, we enable the textbox and set the value to nothing.\
    \ \n\n3) Disabling inputs \n\npica \n\nf . \\* r .1 \n\nHow did you hear about\
    \ us? \n\nO From a friend \n\nOTVAd \n\n®JMagazme Ad \n\nCnSJewspaper Ad \n\n\
    O Internet \\_\\_\\_ \n\nO Other. . Please specify \\[not applicable \n\nHere's\
    \ the simple form we use (ch07\\_eg3 .htm): \n\n<body onload=\"document.myForm.txtOther.disabled=true;\
    \ \n\ndocument.myForm.txtOther,value='not applicable'; \"> \n\n<h2>How did you\
    \ hear about us?</h2> \n\n<form name=\" myForm11 \\> \n\ncinput type=\"radio\"\
    \ name=\"radHear\" value=”l\" \n\nonclick=\"handleOther(this.value);\" />From\
    \ a friend<br /> \n\n<input type=\"radio\" name=\"radHear\" value=\"2\" \n\nonclick=\"\
    handleOther(this.value);\" />TV Ad<br /> \n\n<input type=\"radio\" name=\"radHear\"\
    \ value=\"3\" \n\nonclick=\"handleOther(this.value);\" />Magazine Adcbr /> \n\n\
    <input type=\"radio\" name=\"radHear\" value=\"4\" \n\nonclick=\"handleOther(this.value);\"\
    \ />Newspaper Ad<br /> \n\n<input type=\"radio\" name=\"radHear\" value=\"5\"\
    \ \n\nonclick=\"handleOther(this.value);\" />Internet<br /> \n\ncinput type=\"\
    radio\" name=\"radHear\" value=\"other\" \n\nonclick= \"handleOther (this .value)\
    \ ;\" />0ther. . . Please specify: \n\n<input type=\"text\" name=\"txtOther\"\
    \ /> \n\n</form> \n\n</body> \n\nNote how the txtOther textbox is not disabled\
    \ in the form; rather it's disabled and given a value \n\nusing JavaScript in\
    \ the opening <body> tag. This is for the benefit of users whose browser doesn't\
    \ \n\nsupport JavaScript. If the control were disabled when the form loaded, like\
    \ so: \n\ncinput type=\"text\" name=\"txtOther\" value=\"not applicable\" disabled\
    \ /> \n\n304"
