    \nChapter 2 \n\nProviding Alternative Text or Descriptions for Images \n\nOne\
    \ of the most important things to remember is to provide alternative text for\
    \ images, not only for \n\nthose who can't see the images, but also for when the\
    \ image may be unavailable and for those who \n\nbrowse with images off. This\
    \ is very easily done, as the standard HTML <img> tag can take an \n\nattribute\
    \ called alt, whose value is alternative text for the image if it can't be displayed.\
    \ This is what \n\nscreen readers and aural browsers read to those who use 'them:\
    \ \n\n<img src=\"../images/pizzaThis.gif\" alt=\"Pizza This Logo\" /> \n\nYou\
    \ should remember to use the alt attribute on all <button> and <input> elements\
    \ that use \n\nimages. You can also use the title attribute, which is one of the\
    \ standard attributes available to \n\nmost elements. It provides text that can\
    \ be viewed in a tooltip. This has been available in IE since \n\nversion 4, but\
    \ is only available in Netscape in versions 6+. This allows you to provide different\
    \ text \n\nfrom the alt text \\- additional information about the image and/or\
    \ a description: \n\n<input type=\"image\" src=\"../images/search.gif” name=\"\
    select\" height=\"23\" \n\nwidth=\"64\" value=\"hawaii\" alt=\"select\" title=\"\
    Select this pizza\" /> \n\nAnd thirdly, you can use the longdesc attribute with\
    \ the HTML <img> tag. Its value is a URL, which \n\nallows you to provide a link\
    \ to a longer description of the image. It took the browser manufacturers a \n\
    \nlong time to support the longdesc attribute. It only became available to Netscape\
    \ users in version \n\n6.1 (not 6) and to Internet Explorer in version 6 (on Windows\
    \ \\- Macintosh users were still on version \n\n5 at the time of writing). If\
    \ your image contains information that won't be available to those unable to \n\
    \nsee the image, then you should provide an alternative, longer text description\
    \ in a different file. This \n\nis particularly important for images such as charts,\
    \ which convey information using graphics that \n\nmight not be available in the\
    \ document's text. \n\nTab Index \n\nFor those using your form without a mouse,\
    \ for those with motor control difficulties, and for those \n\nwhose mouse is\
    \ simply playing up and annoying them, you should make sure that your forms are\
    \ \n\nnavigable without the use of a pointing device (such as a mouse, touchpad,\
    \ trackball, and so on). \n\nTo do this, you can add the tabindex attribute to\
    \ one of the following elements: \n\n<a> \n\n• <area> \n\n• <button> \n\n• <input>\
    \ \n\n• <object> ' \n\n• <select> \n\n• <textarea> \n\ngiving it a value between\
    \ 1 and 32767. If you think you might expand your form at a later date, you \n\
    \ncan miss numbers out and the browser will look for the next highest number in\
    \ the tabindex. We \n\nlooked at setting the tabindex in Chapter 1. \n\n82"
