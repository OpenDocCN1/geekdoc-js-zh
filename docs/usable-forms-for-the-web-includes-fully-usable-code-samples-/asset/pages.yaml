    \nChapter 1 \n\nForm Submission \n\nWhen we looked at the <form> element, we mentioned\
    \ that you have a choice of methods with which to \n\nsubmit the form to the processing\
    \ agent \\- either the HTTP get or the HTTP post method. If neither is \n\nselected,\
    \ the default is get. \n\n% \n\nWhichever method you use, the form data is URL-encoded.\
    \ This involves: \n\n• Putting an \\= sign between name and value in name/value\
    \ pairs and an & sign between each \n\npair: namel=valuel&name2=value2&name3=value3.\
    \ \n\n• Changing all spaces to plus signs. \n\n• Converting all unsafe characters\
    \ in names and values to %xx, where xx is the ASCII value of \n\nthe character\
    \ in hex. Such characters are /, \\\\, \\=, &, and +. \n\nThis is done automatically\
    \ by the browser. Strictly speaking, only the last of these three is required\
    \ for \n\nURL encoding, but all three happen with form data. \n\nHTTP get \n\n\
    When you choose the get method, the form data set is appended to the URI (Uniform\
    \ Resource \n\nIdentifier) specified by the action attribute. It's separated from\
    \ the URI using a question mark (?). \n\nRemembering that encoding must also take\
    \ place, here's an example for a form containing two textboxes, \n\none called\
    \ txtFname, the other txtLname: \n\nhttp://www.example.com/process.asp?txtFname=Bob&txtLName=Stanley\
    \ \n\nBecause the information is stored in the URL, the page can be bookmarked.\
    \ \n\nHowever, HTTP get should not be used when you're going to be updating a\
    \ data source using the form \n\nor when you have large amounts of binary data\
    \ (such as graphics) or non-ASCII information (such as \n\nHebrew or Cyrillic\
    \ characters) to send to the server. In these cases, you should use HTTP post.\
    \ \n\nHTTP post \n\nWhen you choose the post method, the form data is sent transparently\
    \ \\- it's included in the HTTP \n\nheader. While you don't see it in the same\
    \ way, it's still transferred in clear text unless you're working \n\nunder SSL.\
    \ However, the header would include something like this, where the last line is\
    \ the form data: \n\nUser-agent: MSIE6.3 \n\nContent-Type: application/x-www-form-urlencoded\
    \ \n\nContent-Length: 29 \\* \n\n\\\\ \n\n... other headers go here ... \n\ntxtFname=Bob&txtLName=Stanley\
    \ \n\nThis is the option you should choose when the data in your form will make\
    \ a permanent change to a \n\ndata source. \n\n50"
