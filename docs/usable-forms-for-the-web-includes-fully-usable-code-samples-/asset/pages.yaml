- img_proc: true
  md: "![](img/a10b466d6e11a32674cad146197d13d9_380_0.png)![](img/a10b466d6e11a32674cad146197d13d9_380_1.png)\n\
    \nForms in ASP.NET \n\n<asp:label id-\"Messagel\" forecolor=\"red\" runat=\"server\"\
    >Example Text</asp:label> \n\nHowever, this is not the case. When this page is\
    \ run, then the code would be changed to HTML and \n\nthese attributes are turned\
    \ into equivalent and standards-correct style attribute settings: \n\n<span id=\"\
    Messagel\" style=\"color:Red;\">Example Text</span> \n\nThis doesn't help us apply\
    \ full-blown stylesheets though. More interesting is a separate class \n\nproperty,\
    \ which can be used to manipulate appearance of controls via a stylesheet. It's\
    \ this we're \n\ngoing to take a look at now. \n\nIn a previous example we used\
    \ a radiobuttonlist control, and if we now go back to that example \n\nand add\
    \ the following lines to access the radiobuttonlist's style properties by adding\
    \ the class \n\nattribute to the style properties: \n\n<br /><br /> \n\n<form\
    \ runat=\"server\"> \n\n<asp: radiobuttonlist class=\" color\" id=\"radiol\" runat=\"\
    \ server11 \\> \n\n<asp:listitem runat=\"server value=\"Olives\" /> \n\n<asp:listitem\
    \ runat=\"server\" value=\"Jalapeno Peppers\" /> \n\n<asp:listitem runat=\"server\"\
    \ value=\"Anchovies\" /> \n\n</asp:radiobuttonlist> \n\n<br /xbr /> \n\n</form>\
    \ \n\nWe can then create a stylesheet, which references the color class, and place\
    \ the stylesheet in \n\nbetween the <head> tags on the page: \n\n<style type=\"\
    text/css\"> \n\n.color {height: lOOpx; \n\nfont-size: 18pt; \n\nbackground: yellow}\
    \ \n\n</style> \n\n365"
