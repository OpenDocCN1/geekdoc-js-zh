  md: "![](img/a10b466d6e11a32674cad146197d13d9_150_0.png)![](img/a10b466d6e11a32674cad146197d13d9_150_1.png)\n\
    \nForms and ASP \n\nAs you can imagine, if the server didn't set a duration limit\
    \ on the session, bearing in mind that each \n\nsession takes up memory, it would\
    \ eventually run out of memory. Indeed, the use of sessions can be \n\nquite resource\
    \ intensive on the server and should be used sparingly. You should not store large\
    \ \n\namounts of data, such as large recordsets, in sessions or store them for\
    \ longer than is needed. \n\nYou can estimate the amount of memory you'll be taking\
    \ up by calculating what you're asking the \n\nserver to hold in memory and multiplying\
    \ it by the number of concurrent sessions you're running. \n\nSo, how do we create\
    \ a session and add information to it? Unlike when we're using cookies, we don't\
    \ \n\nhave to provide a name for the session. We just use a session variable name\
    \ and give it a value. \n\nSession(\"sessionVariableName\") \\= sessionVariableValue\
    \ \n\nWe can change the length of a session \\- to longer or shorter than the\
    \ default. This just affects \n\nthe application using the current session, not\
    \ all sessions running under the server. The syntax \n\nis as follows: \n\nSession.Timout\
    \ \\= minutes \n\nwhere minutes is the number of minutes that the session lives\
    \ for between times when the user \n\nrequests a page. \n\nWe can force a session\
    \ to end \\- irrespective of how long it should run \\- using the Abandon method.\
    \ \n\nDoing this when we've finished with the data we're holding in the session\
    \ frees up the memory on the \n\nserver that was being used for storing session\
    \ information. \n\nSession.Abandon \n\nIf you just want to remove one item from\
    \ the session, rather than destroy the whole session, you can \n\ndo so using\
    \ the following syntax: \n\nSession(\"sessionVar'iableName”) \\= Null \n\nHowever,\
    \ there is a better way of doing this if you're using ASP 3.0 (which comes with\
    \ Windows \n\n2000+ and IIS 5+): \n\nSession.Contents.Remove \"sessionVariableName\"\
    \ \n\nThis second option not only removes the item from memory, but also removes\
    \ the reference to it. If \n\nyou remember that the items in session memory are\
    \ being stored in name/value pairs (also referred \n\nto as key/value pairs) then\
    \ the first method just removes the value, while the second method \n\nremoves\
    \ the key to it as well. \n\nIf you're using ASP 3.0, you can also remove all\
    \ of the items and their references from the session \n\nusing the single line:\
    \ \n\nSession.Contents.RemoveAll \n\nSo, let's have a look at how we can make\
    \ use of the Session object with our order sample. \n\n135"
