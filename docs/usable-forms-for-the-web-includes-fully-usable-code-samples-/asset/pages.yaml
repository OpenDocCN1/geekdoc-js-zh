    \nHTML Forms \n\nYou should also use post when you have large amounts of data\
    \ or when you're using non-ASCII \n\ncharacter sets. You should also remember\
    \ that the enctype attribute must have a value of \n\nmultipart/form-data. \n\n\
    There's nothing to stop you mixing the post method for your form data with an\
    \ action attribute that \n\ncontains query string information, such as: \n\n<form\
    \ action=\"http://www.example.com/users.asp?action=addUser\" method=\"post”> \n\
    \nHere you can see that, as a result of the user filling out this form, we're\
    \ calling the page \n\nhttp: / /www. example . com/users . asp and passing the\
    \ parameter action=addUser in the \n\nquery string. \n\nHowever, pages generated\
    \ using data sent using the post method can't be bookmarked in the same way \n\
    \nas those using the get method if all of the information for retrieving that\
    \ page is not in the URL. \n\nSample Forms \n\nHaving looked at the syntax for\
