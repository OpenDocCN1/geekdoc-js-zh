    \nForm Validation Techniques \n\nWe also initialize the temp variable to zero.\
    \ (We'll reuse this element several times to hold a true / \n\nfalse value or\
    \ serve as a counter, as needed.) Recall that JavaScript will automatically convert\
    \ this to a \n\nboolean false if necessary, a fact that we may need to make use\
    \ of, depending upon what type of \n\nelement we're dealing with. \n\ntemp=0;\
    \ \n\nNow we create a new object variable named context (note that we recreate\
    \ this object each time we \n\npass through the for loop, so we needn't worry\
    \ about \"old\" values throwing off our results). Unlike class- \n\noriented languages,\
    \ JavaScript allows us to instantiate a new object first, and define it later.\
    \ Making use of \n\nthe facts that JavaScript (1) allows us to switch freely between\
    \ named array elements and object \n\nproperties and (2) permits us to add new\
    \ properties to an object on demand, we give it a set of properties \n\ncorresponding\
    \ to the elements in the requirements array. Each property is assigned a boolean\
    \ value \n\ndepending on whether or not the corresponding requirements string\
    \ is found as a substring of the \n\nelement's name property. Referring back to\
    \ our sample form above, we see that the name of the first \n\nelement is FirstOName\\\
    _required\\_alphabetic, so for this element, context. required and \n\ncontext.\
    \ alphabetic are both true and all other properties of the context object are\
    \ set to false. \n\nvar context=new Object; \n\nfor(var j=0;jcrequirements.length;j++)\
    \ \n\ncontext\\[requirements\\[j\\]\\]=currName.indexOf(requirements\\[j\\])!=-l;\
    \ \n\nIf we've set a minimum for the form element's value, we split out the number\
    \ following the substring \n\nminlength\\_ in the element's name, then convert\
    \ it to an integer value. We then repeat the process (if \n\nnecessary) to obtain\
    \ a maximum. \n\nif(context.minlength) \n\n{ \n\nminimum=currName.split(\"minlength\"\
    )\\[1\\]; \n\nminimum=minimum.split(\"\\_\") \\[0\\] ; \n\nminimum=parselnt(minimum);\
    \ \n\n} \n\nif(context.maxiength) \n\n{ \n\nmaximum=currName.split(\"maxlength\"\
    )\\[1\\]; \n\nmaximum=maximum.split() \\[0\\] ; \n\nmaximum=parselnt(maximum);\
    \ \n\n} \n\nNow we branch according to the type of the current form element (we\
    \ force the type string to lowercase \n\nbecause some user agents may return the\
