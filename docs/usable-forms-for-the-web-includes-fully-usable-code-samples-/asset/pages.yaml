  md: "![](img/a10b466d6e11a32674cad146197d13d9_64_0.png)![](img/a10b466d6e11a32674cad146197d13d9_64_1.png)\n\
    \nHTML Forms \n\nreadonl y prevents the user from being able to change the content\
    \ of the box and can be \n\nmodified by script. In this case, the control will\
    \ be successful, so the name/value pair will be \n\npassed to the processing application;\
    \ it's just that the user can't change the data that's \n\nsubmitted to the server.\
    \ \n\nYou might like to disable controls when user input is not allowed or wanted.\
    \ It's particularly helpful for \n\npreventing a user from interacting with the\
    \ control until they've done something else. For example, if \n\nyou have two\
    \ select boxes, and the content of the second one depends on the user's selection\
    \ in the \n\nfirst one, then you can disable the second select box until an option\
    \ has been selected on the first. It's \n\nalso helpful when working with validation,\
    \ to ensure that the user doesn't alter controls that they've \n\nalready entered\
    \ correctly, helping highlight the choices that were wrong. \n\nreadon. y controls\
    \ are helpful to indicate to a user something that they're agreeing to or have\
    \ already \n\nselected. For example, you might use a readonly control to contain\
    \ a license agreement in a textbox. \n\nThe user will still be able to scroll\
    \ through the agreement, but will not be able to change its content. The \n\n\
    readon1 y attribute only works with <textarea> elements and single-line text inputs\
    \ that have a value. \n\nHere are the key differences between the two: \n\ndisabled\
    \ \n\nreadonly \n\nCan be modified? \n\nAfter interaction with script \n\nYes\
    \ \n\nMay be successful? \n\nNot while disabled \n\nYes \n\nWill receive focus?\
    \ \n\nNo \n\nYes \n\nIncluded in tabbing order? \n\nNo \n\nYes \n\nHere are the\
    \ controls that work with each of these attributes: \n\nDisabled readonly \n\n\
    <textarea> \n\nYes \n\nYes \n\n<input type=“text\" /> \n\nYes \n\nYes \n\n<input\
    \ type= \"checkbox\" /> \n\nYes \n\nNo \n\ncinput type=\"radio\" /> \n\nYes \n\
    \nNo \n\n<input type=\"submit\" /> \n\nYes \n\nNo \n\n<input type=\\*reset\" />\
    \ \n\nYes \n\nNo \n\ncinput type=\"button\" /> \n\nYes \n\nNo \n\n<select> \n\n\
    Yes \n\nNo \n\n<optionx/option> \n\nYes \n\nNo \n\n<button> \n\nYes \n\nNo \n\n\
    disabled and readonly attributes are available in Netscape 6+ and IE 5+. They\
    \ are \n\nignored in older browsers. \n\n49"
