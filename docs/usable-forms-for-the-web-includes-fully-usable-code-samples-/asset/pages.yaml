    \nChapter 1 \n\nHere you can see an example of the file select box: \n\nHere's\
    \ a list of all the attributes that an <input> element with a type attribute whose\
    \ value is file \n\ncan take: \n\n• name, value, accept \\- which we've seen.\
    \ \n\n• tabindex, accesskey, disabled, readonly \\- which we discuss later in\
    \ the chapter \n\n(although Netscape 6 ignores the readonly attribute). \n\n•\
    \ class, dir, id, lang, style, title \\- available for most HTML elements. \n\n\
    • onfocus, onblur, onselect, onchange, onclick, ondblclick, onkeydown, \n\nonkeypress,\
    \ onkeyup, onmousedown, onmousemove, onmouseout, onmouseover, \n\nonmouseup \\\
    - as before, for use with script. \n\nHidden Controls \n\nHidden controls are\
    \ used on forms to hold information in the web page while not displaying it to\
    \ the user. While \n\nthey are not seen on-screen, they remain in the code for\
    \ the page and can be seen by viewing the\\\\source. \n\nThe main use of hidden\
    \ controls is maintaining state. HTTP (the protocol used to transfer pages on\
    \ the \n\nInternet) is, by nature, stateless \\- it does not provide a mechanism\
    \ for individually identifying users and \n\nremembering what they've done. This\
    \ means that, having requested one page from a web server, there's \n\nno inherent\
    \ mechanism for it to know when you request a second page (it could be anyone\
    \ requesting \n\nthat page). You can see an example of why identification of a\
    \ user and what they've done is important \n\nwhen you get to any e-commerce checkout;\
    \ you want to make sure that you're paying for the correct cart \n\nwhen you enter\
    \ your credit card details. \n\n36"
