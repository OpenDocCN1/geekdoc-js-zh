    \nForms and ASP \n\nHowever, the way that we're going to store the information\
    \ is different from previous examples. \n\nRemember that each time we call the\
    \ Session object and add a name/value pair, it's taking up more \n\nmemory \\\
    - not only the memory for the values that we want it to hold, but also that for\
