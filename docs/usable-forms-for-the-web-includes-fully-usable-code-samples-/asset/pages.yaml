    \nChapter 4 \n\nYou can see that we create a local copy of the cart called arrPrintCart,\
    \ and set the intSubTotal \n\nvariable to 0. Then we loop through the array. For\
    \ each item in the array, we write out the quantity, \n\nsize, item, and price,\
    \ and as we go through each item, we're adding its price to the running subtotal\
    \ \n\nin intSubTotal. We then write out the subtotal at the end in a separate\
    \ table. \n\nNote that we're using VBScript's FormatCurrency () function here\
    \ (for individual rows and the \n\nsubtotal) to ensure that we display the price\
    \ to two decimal places \\- otherwise we might end up with \n\na price that says\
    \ $99.9 for 10 pizzas that cost $9.99 each. The currency will be the currency\
    \ used on \n\nthe server \\- if you need to change this, look at using the LCID\
    \ property of the Session object. \n\nWe've now finished with order4 .asp, so\
    \ let's see how we add side orders to the basket. \n\nSide Orders \n\norder6.\
    \ asp, the page for ordering side dishes (garlic or cheese bread) and drinks,\
    \ is very similar to \n\nthe part of order4. asp that presents and takes pizza\
    \ orders. However, because we don't need the \n\nadditional information we needed\
