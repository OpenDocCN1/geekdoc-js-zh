  md: "![](img/a10b466d6e11a32674cad146197d13d9_81_0.png)![](img/a10b466d6e11a32674cad146197d13d9_81_1.png)\n\
    \nChapter 2 \n\nIf you want to limit the choices the user can make: \n\n• so they\
    \ can select one from several options, use radio buttons, a select box, a drop-down\
    \ \n\nmenu, or a button. \n\n• so they can select multiple items from a set of\
    \ options, use checkboxes or a multiple select box. \n\nRemember to give your\
    \ controls names that correspond to the information that you're collectingjrorn\
    \ \n\nthe user \\- for example, txtFirstName for an input box where the user enters\
    \ eir \n\nthis will make development and maintenance of the site easier than using\
    \ names such as mpu , \n\ninput2, and so on. \n\nIt's helpful to use a prefix\
    \ for the name of the control that indicates what kind of form control the data\
    \ \n\nrelates to, such as: \n\n• txtControlName for textboxes and text areas \n\
    \n• radControlName for radio buttons \n\nchkControlName for checkboxes \n\n• selControlName\
    \ for select boxes and list-boxes \n\nIn creating your form, you should consider\
    \ the way in which a user would normally expect to give \n\ndata and try to take\
    \ advantage of those expectations. A lot of this experience might come from \n\
    \nprinted forms and, to a lesser extent, other computer-based forms (perhaps if\
    \ you are translating a \n\nsoftware application to a web application). \n\nIf\
    \ your form differs from the user's experience, they are more likely to make a\
    \ mistake that they II \n\nhave to correct, or they may just fill out the form\
    \ incorrectly. A common example that has been \n\ndemonstrated by Jakob Nielsen\
    \ (http://www.useit.com) is the use of address fields. When asking the \n\nuser\
    \ to enter their address, you should expect them to give the lines of an address\
    \ as they would \n\nwhen writing a letter or filling in a printed form, perhaps\
    \ using four or five input boxes. As Nielsen \n\ndemonstrated, if you try to provide\
    \ a drop-down menu for the type of road that the user lives in say \n\noffering\
    \ the options of road, close, street, avenue, and so on \\- then the user will\
    \ often have to go \n\nback and delete this from the first address line, as they\
    \ are so used to giving it there. \n\nIn fact, drop-down menus, checkboxes, and\
    \ radio buttons are common choices for designers who want \n\nto limit the selections\
    \ that users can make. However, you have to decide whether this is a natural way\
    \ \n\nfor the user to provide data. As we just saw in the previous example, if\
    \ the form is not designed to \n\nmatch the way in which the user expects to see\
    \ the data every day, it will take them longer to fill out the \n\nform and can\
    \ potentially introduce errors. While it might increase the server-side validation\
    \ and/or \n\nprocessing involved, you should present the menu in a way that the\
    \ user will understand. \n\nRadio Buttons and Checkboxes \n\nAs a general rule\
    \ of thumb, radio buttons and checkboxes will work better than drop-downs when\
    \ \n\nthere are few options present \\- say up to three or four items. With few\
    \ options, you need not be \n\nconcerned about the amount of screen real estate\
    \ they take up, and you have the advantage that all \n\noptions can be viewed\
    \ at once. However, consistency does help usability \\- if you already have a\
    \ set \n\nof drop-downs, then another one might be a better choice than inserting\
    \ one set of three radio \n\nbuttons among several select boxes. \n\n66"
