  md: "![](img/a10b466d6e11a32674cad146197d13d9_382_0.png)![](img/a10b466d6e11a32674cad146197d13d9_382_1.png)\n\
    \nForms in ASP.NET \n\nclabel for=\"radiol\\_0\">Olives</label> \n\n</span> \n\
    \n</td> \n\n</tr> \n\n<tr> \n\n<td> \n\n<span value=\"Jalapeno Peppers\"> \n\n\
    <input id=\"radiol\\_l\" type=''radio'' name=\"radiol\" value=\"Jalapeno Peppers\"\
    \ \n\n/> \n\nclabel for=\"radiol\\_l\">Jalapeno Peppers</label> \n\n</span> \n\
    \n</td> \n\n</tr> \n\n<tr> \n\n<td> \n\ncspan value=\"Anchovies\"> \n\ncinput\
    \ id=\"radiol\\_2\" type=\"radio\" name=\"radiol\" value=\"Anchovies\" /> \n\n\
    clabel for=\"radiol\\_2\">Anchoviesc/label> \n\nc/span> \n\n</td> \n\nc/tr> \n\
    \nc/table> \n\nIn fact you can access any CSS style attribute supported by your\
    \ browser and valid for that control in \n\nthis way. For a list of all possible\
    \ valid CSS settings supported by IE currently, you can go to \n\nhttp://msdn.\
    \ microsoft. com/workshop/author/css/reference/attributes.asp. \n\nThis sums up\
    \ the main equivalent controls ASP.NET provides for the HTML form controls. \n\
    \nSummary \n\nThis chapter has been an extremely concentrated introduction to\
    \ Microsoft's .NET framework, \n\nASP.NET (and in particular ASP.NET forms) and\
    \ some basic ASP.NET form controls. In ASP.NET \n\nseveral dramatic alterations\
    \ have made forms work in a quite radically different way: \n\n• Number one is\
    \ the way that the <form> element has been customized to take no attributes \n\
    \nother than runat=\" server\", and passes over all responsibilities for the mode\
    \ of \n\ntransmission of the form data to the web server. \n\n• The second change\
    \ is the introduction of a set of ASP.NET server controls, which \n\ncompletely\
    \ replace the old HTML form controls. \n\n• The third and biggest is the introduction\
    \ of true event handling into the form, allowing you \n\nto create properties,\
    \ rather than having to store the form data in a collection. We haven't \n\nlooked\
    \ into events here, as we thought that we couldn't do the topic justice in the\
    \ space \n\navailable. To learn about these, go to some of the resources at the\
    \ end of the book, and \n\ncheck out our bonus two-page form example in the code\
    \ download for this chapter. \n\nWe've covered a lot here, but we haven't finished\
    \ with ASP.NET forms by a long shot. For starters \n\nwe've conveniently decided\
    \ to overlook the <button> element, that HTML can use in conjunction \n\nwith\
    \ JavaScript/VBScript to trigger particular events. ASP.NET can provide this functionality\
    \ as well; \n\nin fact it is in the very provision of this that ASP.NET is able\
    \ to transform the HTML form into \n\nsomething much more versatile. \n\n367"
