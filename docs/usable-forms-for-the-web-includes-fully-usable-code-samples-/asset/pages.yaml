    \\n\"; \n\nif( isset($olives) ) echo \"<li>01ives</li>\\\\n\"; \n\nif( isset($broccoli)\
    \ ) echo \"<li>Broccoli</li>\\\\n\"; \n\n?> \n\n</ul> \n\n<p>Thanks for taking\
    \ the time to complete our survey, \n\n<?php echo $first\\_name; ?>!</p> \n\n\
    <form> ' \\* \n\n<?php \n\nhidden\\_fields(); \n\n?> \n\n</form> \n\n</body> \n\
