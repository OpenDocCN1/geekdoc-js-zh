    \nAdvanced Client-side Form Scripting \n\nthey wouldn't be able enable it when\
    \ they clicked the other option. By disabling this control \n\nwhen the page loads\
    \ using the onload handler in the <body> element, the control will only be \n\n\
    disabled if the user's browser supports JavaScript. They can then enable it again\
    \ if they select \n\nthe 'other1 option. \n\nWe check the value of the radio button\
    \ when it's clicked by calling the handleother () function \n\nand passing in\
    \ the value of the current form control. Here's the handleother () function that\
    \ \n\nwe're using: \n\nfunction handleother(strRadio) \n\n{ \n\nif (strRadio \\\
    == \"other\") \n\n{ \n\ndocument.myForm.txtOther.disabled \\= false; \n\ndocument.myForm.txtOther.value\
    \ \\= ''; \n\n} \n\nelse \n\n{ \n\ndocument.myForm.txtOther.disabled \\= true;\
    \ \n\ndocument.myForm.txtOther.value \\= 'not applicable'; \n\n} \n\n} \n\nAs\
    \ you can see, we have a simple if.. . else statement that determines if the value\
    \ is ' other1. If \n\nit is, we enable the txtOther text input and clear its value.\
    \ Otherwise, we ensure that txtOther is \n\ndisabled and that the value is 'not\
    \ applicable'. \n\nThe method above is the recommended way to do this. However,\
    \ before disabling of form controls \n\ncame about with HTML 4, another way of\
    \ disabling an input textbox was to move focus away from it \n\nusing the blur\
    \ () method when the onfocus event fires. \n\n<input type=\"myTextBox\" onfocus=\"\
    this.blur();\"> \n\nThis second method ensures that the textbox remains disabled\
    \ to users by moving the focus away \n\nas soon as it receives focus. However,\
    \ it's not as smooth to use. You should also be aware that, with \n\nthe second\
    \ approach, the value will be sent to the server (whereas a disabled control will\
    \ not), and it \n\nis possible to paste values in using keyboard shortcuts on\
    \ some browsers. \n\nCase Conversion \n\nChanging the case of a text input is\
    \ simple, as there are built-in methods in JavaScript's string \n\nobject to help\
    \ do the work for us. All we do is call one of the functions: \n\n• toLowerCase()\
    \ \n\n• toUpperCase() \n\nIn our case, we'll be doing it when the focus changes\
    \ away from the box and its value has been \n\nmodified. If the user has to submit\
    \ the form data, this is a good way of calling the method, as the \n\nfocus will\
    \ have to move from the text input when the user clicks the submit button, if\
    \ not before. \n\n305"
