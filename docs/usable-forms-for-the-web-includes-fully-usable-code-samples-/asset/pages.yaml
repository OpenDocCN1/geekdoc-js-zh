    \nDesigning Usable Forms \n\n□ \\*) Numbering 0 0 \n\n■sr \n\n\\[occuoii v«\\\
    *j Manial ijtciimj \n\n\\[Question 10) What is your marital status? \n\nO Never\
    \ Mamed (If selected go to Question 14) \n\nO Mamed \n\nQ Separated \n\nO Divorced\
    \ \n\n\\[Question 11\\] Is your partner applying with you? \n\nGrouping Controls\
    \ \\- Summary \n\n• You can use the <fieldset> and <legend> elements to group\
    \ together sections of a \n\nform. \n\n• Labels can increase the usability of\
    \ a form. \n\n• A few smaller forms are less off-putting than one long form, but\
    \ be sure to tell the user \n\nwhere they are in the form by using page and/or\
    \ question numbers. \n\n• Keeping related information on one page makes forms\
    \ more user-friendly and helps with \n\nvalidation. \n\nLabeling Controls \n\n\
    Clearly labeling your controls is vital when designing forms, so that the user\
    \ knows where to enter \n\ndata or which option to choose. There are two types\
    \ of labels: \n\n• Implicit labels \\- which take the form of normal text and\
    \ markup next to a control such as a \n\ntext input, radio button, or checkbox\
    \ \n\n• Explicit labels \\- which use the <label> element \n\nOften you will find\
    \ implicit labels suitable for indicating which form control a label belongs to.\
    \ \n\nExplicitly labeling controls requires programming effort \\- and not many\
    \ of the authoring packages \n\nhelp you to do this, so it's up to you to code\
    \ the correct label with the corresponding form control. \n\nAs a guideline for\
    \ where to place labels or prompts for the user: \n\nPlace prompts for text entry\
    \ fields and combo boxes to the left of or above the control \n\nPut prompts for\
    \ a checkbox or radio button to the right of the control \n\nFor buttons, the\
    \ prompt is the value \\- if you don't want it sent with the form, don't give\
    \ it a \n\nname attribute \n\n75"
