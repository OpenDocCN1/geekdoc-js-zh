    \nConstructing . \n\nUsable Forms (or the Web \n\nOVERVIEW \n\nForms are an integral\
    \ part of many web sites, whether they are for registration, feedback, \n\nor\
    \ ordering goods. However, they are time consuming for the site user to fill out,\
    \ and need to \n\nbe made as usable as possible, otherwise they can be frustrating\
    \ and annoying, spoiling the \n\nuser experience. \n\nThis book takes all the\
    \ difficulty out of implementing forms, dealing with client-side forms \n\nin\
    \ HTML and Flash, client-and server-side form validation, and server-side data\
    \ processing. \n\nIt provides code samples fully adaptable to your own needs,\
    \ along with walkthrough tutorials \n\non how they work, and an HTML form element\
    \ reference. \n\nWHO IS THIS BOOK FOR? \n\nThis book is for intermediate to advanced\
    \ web professionals who need to implement a \n\nprofessional form on a web site\
    \ as quickly as possible, with the minimum of hassle. \n\nINCLUDES: \n\n• Easy\
    \ to follow tutorials and reference on building form user interfaces with HTML\
    \ and Flash \n\n• Tips to follow for designing usable forms \n\n• Client-and server-side\
    \ data validation techniques using JavaScript, ASP, and PHP \n\n• Server-side\
    \ data processing using ASP and PHP, with Access and MySQL databases \n\n• Coverage\
    \ of ASP.NET web forms \n\n• Extensive online support, including fully operational\
    \ downloadable code, and a gallery \n\nof working form examples \n\nhttp://www.glasshaus.com\
    \ support@glasshaus.com \n\nThe three glasshaus web professional series: \n\n\
    Tools of the Trade: Learning the tools web professionals use \n\n\\\\ \\\\ \n\n\
    Constructing: Task focused \\- getting the web professional’s job done \n\nInsite:\
    \ Looking at successful sites that have achieved a balance of technology and design\
    \ \n\nUSA $24.99 \n\nCANADA $38.99 \n\nShelving Category: Web Design \n\nWeb Development\
    \ \n\nweb professional to web professional \n\nglasshaus"
