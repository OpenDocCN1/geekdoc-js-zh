    \nChapter 4 \n\nMaintaining State and Passing Data Between Pages \n\nAs we saw\
    \ in Chapter 1, one of the significant problems with writing applications on the\
    \ Web is that \n\nHTTP is a stateless protocol. It does not provide a mechanism\
    \ for remembering which user \n\nrequested which page or any details about individual\
    \ users, \n\nOf course, the chances are that, once you've collected some data\
    \ from a visitor to your site, you re \n\ngoing to want to make it available in\
    \ more than one page. Even though HTTP is stateless, there are \n\na number of\
    \ ways in which you can keep track of data entered by a user and pass it between\
    \ pages. \n\n• Store form data in hidden fields and pass it between pages. \n\n\
    • Use cookies to store form data on the client. \n\n• Create an ASP session for\
    \ the user using the ASP Session object. \n\n• Pass a unique ID for the user between\
    \ pages (for example, in the query string) and use that to \n\nidentify the user's\
    \ records in a database. \n\nAnother technique common in larger applications is\
    \ URL rewriting \\- it's not \n\nnatively supported by IIS, so we won't cover\
    \ it in this chapter. See our Resources \n\nsection for more. \n\nWhen form data\
    \ \\- such as the pizza orders \\- have to be added to a database, it's common\
    \ to use \n\ntechniques such as hidden form controls, cookies, or the session\
    \ object to pass data between pages \n\nuntil the last page of the form, when\
    \ it's added to a database. This saves costly server resources in \n\nconnecting\
    \ to and updating the database for each page of the form. \n\nIn this section,\
    \ we'll look at each of these techniques. For the first three scenarios, we'll\
    \ use the \n\nsame example. \n\nIn our Pizza This application, we need to know:\
    \ \n\n• When users want their pizza (now or later). \n\n• Whether users want the\
    \ pizza delivered or ready to collect (for the purposes of this example, \n\n\
    you should choose that you want your pizza delivered). \n\n• Where users want\
    \ the pizza delivered to. \n\nThis information is collected from two forms, and\
    \ we'll need it again when we come to confirm the \n\norder. So, we'll derive\
    \ some examples from this application and we'll use them to look at passing \n\
    \ndata and maintaining state. Each example is in a different folder in the downloadable\
    \ code. \n\nEach example starts with the same page (orderl.htm \\- there's an\
    \ identical copy of this file in each \n\nfolder). The examples send data using\
    \ http post, although we could use the get method just as \n\neasily. We'll use\
    \ a form that's equivalent to order2 .asp in the full Pizza This application:\
    \ \n\n124"
