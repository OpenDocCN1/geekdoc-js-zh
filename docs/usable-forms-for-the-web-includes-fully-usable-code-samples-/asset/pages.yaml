    -\\_~'\\\\\"’\\\\\\[\\\\\\]\\\\{\\\\}\\\\\\*\\\\/\\\\?\\\\(\\\\) \\\\n\\\\r\\\
    ] /\" ; \n\nThe $ requirements array contains the strings we’ll be looking for\
    \ in the name of each field that will tell \n\nus which tests to run on its value.\
    \ \n\n$requirements \\= array(\"required\", \"alphabetic\", \"address\", \"alphanumeric\"\
