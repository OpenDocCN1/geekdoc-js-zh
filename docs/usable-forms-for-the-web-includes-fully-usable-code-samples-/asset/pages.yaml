  md: "![](img/a10b466d6e11a32674cad146197d13d9_112_0.png)![](img/a10b466d6e11a32674cad146197d13d9_112_1.png)\n\
    \nFlash Forms \n\nBegin by simply creating the name: label on the stage. Select\
    \ it, copy it, and then use Edit \\-> Paste \n\nin place to create a second instance\
    \ of it directly on top. Without deselecting, use the arrow keys to \n\nput this\
    \ new one directly alongside it to the right. This is just an easy way of making\
    \ sure that your \n\nlabels and input fields line up. Now go to the Text Options\
    \ panel and change the text type to Input \n\nText from the drop-down list. Give\
    \ this text field the Variable Name nameField. Double click it on the \n\nstage\
    \ and remove all the text, you will also want to drag the handle out to the right\
    \ extending the \n\nwidth of the field. \n\nDrag around both objects to select\
    \ them and hit F8 to turn this into a symbol, select Movie Clip and \n\ngive it\
    \ the name MC \\- Form. Now double click the newly created movie clip to edit\
    \ it, move the label \n\nto its own layer and create a new layer below both of\
    \ the others. On this new layer we are going to \n\ndraw the background of the\
    \ input field so that it is visible to the user. Create a rectangle the same \n\
    \nsize as the input field with the lighter color created earlier. Select just\
    \ the outline on the left and top \n\nof this rectangle, set the color to the\
    \ darker tint, now select the bottom and right side lines and set \n\ntheir color\
    \ to white. This will give the field the indented look common on HTML forms and\
    \ help the \n\nuser to realize that this is a form. This may sound strange, but\
    \ there are Flash forms out there on \n\nwhich it is very difficult to find the\
    \ input fields or even recognise that there is any input required at all. \n\n\
    You should now have the top line of your form completed \\- now create the other\
    \ two lines by \n\nsimply copying these elements and nudging them down with the\
    \ arrow keys. Once you have done \n\nthis there are a couple of changes required\
    \ to the two new lines. Change the variable name of the \n\ne-mail input field\
    \ to emailField and the label to email:. With the comment line, change the label\
    \ to \n\ncomment, and the input field variable name to commentField. In this example,\
    \ we want the \n\ncomment field to be a multiline field; to do this, go to the\
    \ Text Options panel and select Multiline \n\nfrom the second drop down list.\
    \ Now double-click the text field itself and, holding down the shift \n\nkey,\
    \ drag the corner handle down to however many lines high you want it to be. Lastly,\
    \ resize the \n\nbackground box to match. \n\nYou now have the input side of your\
    \ form built. Create a couple of buttons underneath labelled clear \n\nand send\
    \ and you are ready to start adding some functionality. \n\nSo, on to the code\
    \ \\- create a new layer within the MC \\- Form movie clip and name it code. On\
    \ the \n\nfirst frame add the following actions: \n\nfieldList \\= \\[\"nameField\"\
    ,\"emailField\",\"commentField\"\\]; \n\nSelection.setFocus(fieldList\\[0\\] )\
    \ ; \n\nstopO ; \n\nWe start by creating a new array containing the names of our\
    \ form fields. This allows us to create \n\ngeneric code later on that refers\
    \ to this array, which can then be used in any form we create. The \n\nfirst instance\
    \ of this generic code is the very next line where we set the field focus to the\
    \ first \n\nelement in the array, and therefore the first field in our form. \n\
    \nOn the layers that contain the form elements, labels, and backgrounds, create\
    \ blank keyframes (F7) \n\nat frame two. This is because, when the form is submitted,\
    \ this movie clip is going to play, and rather \n\nthan have all the form elements\
    \ still visible while the data is being processed, we want to provide \n\nsome\
    \ feedback to the user that something is happening. Create a new layer, call it\
    \ user feedback, \n\nand add a blank keyframe at frames one, two and three. On\
    \ frame three write the word sending on to \n\nthe stage, you could also add some\
    \ kind of small animation to indicate to the user that something is \n\nhappening\
    \ much like the wristwatch cursor on MacOS, or the hourglass on Windows. \n\n\
    97"
