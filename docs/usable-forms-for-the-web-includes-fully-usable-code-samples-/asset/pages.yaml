    \ field is a multi-line field, in which case hitting return adds a new \n\nline\
    \ in the field. Thankfully this is also not too difficult to recreate in Flash.\
    \ In the actions for the send \n\nbutton, add this code: \n\non (keypress \"<Enter>\"\
    ) \n\n{ \n\ncurrentField \\= Selection.getFocus(); \n\nsplitPath \\= currentField.split(\"\
    .\"); \n\ncurrentField \\= splitPathfsplitPath.length \\- 1\\]; \n\nif(currentField\
    \ != \"commentField\") \n\n{ \n\nthis.play(); \n\n} \n\nelse \\\\ \n\n{ \n\nbeforeCursor\
    \ \\= commentField.substr(0,Selection.getBeginlndex()); \n\nafterCursor \\= \n\
    \ncommentField.substr(Selection.getEndlndex(),commentField.length); \n\ncommentField\
