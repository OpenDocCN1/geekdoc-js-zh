    \ server, we need to be able to check whether we have \n\nreceived anything back.\
    \ On frame 10 we can do this check: \n\nif(returnVal.length \\> 0) \n\n{ \n\n\
    gotoAndPlay(\"done\"); \n\n} \n\nelse \n\n{ \n\ngotoAndPlay(this.\\_currentFrame\
