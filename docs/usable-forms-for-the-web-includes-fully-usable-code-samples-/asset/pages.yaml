    \nFlash Forms \n\nSummary \n\nThe objective of this chapter has been to show,\
    \ through two example forms, how Flash can make \n\nextremely usable and quick-loading\
    \ forms. The techniques covered in the two exercises will get \n\nyou through\
    \ almost any type of form you need to create and help you make that form simple\
    \ for \n\nthe end user. \n\nAlthough you are unlikely to have to create a flight\
    \ booking system in Flash you will more than likely \n\nhave to create a linear\
    \ form like this at some point. My hope with this book is that more designers\
    \ \n\nand developers will consider using Flash for this type of form. \n\nRemember\
    \ that, because the information doesn't go to the server until the process is\
    \ complete, it \n\ndoesn't matter how many people are filling out this form at\
    \ the same time, it won't slow down like its \n\nHTML cousin would \\- a very\
    \ important usability point. \n\nf \n\n117"
