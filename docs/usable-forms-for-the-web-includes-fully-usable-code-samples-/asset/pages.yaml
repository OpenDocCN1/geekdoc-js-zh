    \ appropriate notation: \n\n$name \\= $row\\[\"name\"\\]; \n\necho \"<option value=\\\
    \\\"$name\\\\\">$name</option>\\\\n\"; \n\n} \n\n?> \n\nOnce we've fetched all\
    \ the records and written the corresponding <option> elements, we can close \n\
    \nthe <seiect> element. Some server-side technologies require that we close the\
    \ connection to the \n\ndatabase; with PHP and MySQL this is done automatically\
    \ at the end of the page, but we could do so \n\nmanually using the call mysql\\\
    _close ($db) ; if we wished. \n\nWe can now place submit and reset buttons, and,\
    \ finally, just before closing the form, we call the \n\nhidden\\_f ields () function\
