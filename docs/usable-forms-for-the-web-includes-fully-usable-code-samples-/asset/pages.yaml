    \nChapter 5 \n\nWe next use the built-in PHP count () function to determine how\
    \ many elements there are in the \n\narray named $meats. Then we loop through\
    \ all the elements in that array, starting with the first \n\nelement (numbered\
    \ 0): \n\n$number\\_of\\_meats \\= count( $meats ); \n\nfor($i \\= 0; $i < $number\\\
    _of\\_meats; $i++) \n\n{ \n\nA common \"gotcha\" in such situations is to get\
    \ the number of elements in an array within the \n\ndefinition of a for loop that\
    \ we want to use for iterating through those elements. Suppose we'd left \n\n\
    out the separate line where we got the size of the array and just used something\
    \ like: \n\nfor($i \\=0; $i < count( $meats ); $i++){ ...}. \n\nStrictly speaking,\
    \ this isn't an error. It's syntactically correct. However, there are two less-than-\
    \ \n\ndesirable side effects that can result from it: \n\n• Doing so is inefficient\
    \ programming, because the count () function gets called every time we \n\ngo\
    \ through the loop, and we really only need to determine the size of the array\
    \ once. While this \n\nisn't much of a problem when the array has only a few elements,\
    \ it can cause extra overhead on \n\nyour server if you're looping through one\
    \ that holds hundreds or even thousands of elements. \n\n• Should you accidentally\
    \ do something inside the loop that modifies the size of the array, you'll \n\n\
    create a very nasty bug in your code. Its effects could prove quite difficult\
    \ to track down, \n\nbecause they may not make themselves apparent until later\
    \ in the page or possibly even on \n\nsome other page altogether. \n\nWe're going\
    \ to enclose each grouping of radio buttons and its corresponding label in its\
    \ own \n\n<fieldset> container. We write a string containing its opening tag,\
    \ then a <legend> element \n\ncontaining the name of the meat, which we indicate\
    \ by using PHP array notation, $meats \\[$i\\]: \n\necho \"<fieldsetxlegend>$meats\
    \ \\[$i\\] :</legend>\\\\n\" ; \n\nThe <f ieldset> and <legend> tags serve to\
    \ group each set of radio button controls together in a \n\ndistinctive manner.\
    \ (If you've ever done any Visual Basic programming, this is somewhat analogous\
    \ \n\nto placing radio buttons inside a frame control.) \n\nNotice that we use\
    \ the variable name directly within the string; we're not required to break up\
    \ the \n\nstring and concatenate the variable as we are in some programming languages.\
    \ This is known as \n\nvariable interpolation and is a core feature of PHP, which\
    \ automatically replaces the variable with \n\nthe value it contains when the\
    \ variable is used within a string delimited by double quotas. \n\n\\\\n is a\
    \ linefeed, just as it is in most other C-like languages, which we include to\
    \ make the HTML \n\nmore legible. The backslash serves as the escape character\
    \ in PHP; we also use it below to set off \n\nquotation marks that need to be\
    \ output to the page rather than regarded as being the beginning or \n\nend of\
    \ a PHP string. \n\n180"
