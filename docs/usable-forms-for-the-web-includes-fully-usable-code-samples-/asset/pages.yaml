  md: "![](img/a10b466d6e11a32674cad146197d13d9_92_0.png)![](img/a10b466d6e11a32674cad146197d13d9_92_1.png)\n\
    \nDesigning Usable Forms \n\nAnd again, the output will be the same as when we\
    \ didn't use the <label> element. \n\nAs you can see, explicit labeling involves\
    \ a lot of extra effort and isn't required unless you're going to \n\nuse complex\
    \ formatting that will confuse aural browsing software. We'll see how this might\
    \ happen \n\nwhen we look at the layout of forms using tables later in the chapter.\
    \ \n\nIn the very rare cases when you can't provide a label at all, at least provide\
    \ a prompt in text input \n\ncontrols using the value attribute \\- although remember\
    \ that this will be sent as the default if the \n\nuser doesn't enter anything.\
    \ \n\nYou must also be very careful about the choice of prompt or label that you\
    \ use. It's very easy to get \n\nattached to a way of thinking and forget that\
    \ something that's clear to you may not be as obvious to \n\nsomeone else. In\
    \ particular, when you're working closely on a project, your understanding might\
    \ \n\naffect your judgment. For example, the idea of a product ID may be perfectly\
    \ clear to you, but new \n\nusers to a site may prefer to refer to products by\
    \ name. \n\nLayout of Forms \n\nThe layout of your form should reflect what a\
    \ user would expect to see when dealing with such data. \n\nThis is related to\
    \ the user's existing experience \\- such as any other forms or software that\
    \ require \n\nsimilar information that the user will have used. Often, however,\
    \ this will just be everyday \n\nexperience... \n\nUsing Tables for Layout \n\n\
    Most designers and programmers use tables for layout and positioning in thqir\
    \ HTML documents. \n\nHowever, you need to be aware of the way in which they are\
    \ rendered to those using voice browsers \n\nand screen readers. We should take\
    \ a moment to look at this topic. \n\nDevices that read the contents of web pages\
    \ to users have to present tables in a way that will \n\nmake sense aurally. This\
    \ means that they linearize tables. To understand this process, let's look \n\n\
    at some examples: \n\nRow 1 Column 1 \n\nRow 1 Column 2 \n\nRow 2 Column 1 \n\n\
    Row 2 Column 2 \n\nRow 3 Column 1 \n\nRow 3 Column 2 \n\nThis table would be read\
    \ in the following order: \n\nRow 1 Column 1, Row 1 Column 2, Row 2 Column 1,\
    \ Row 2 Column 2, Row 3 Column 1, Row 3 \n\nColumn 3 \n\nIf you imagine putting\
    \ a piece of paper across the screen and reading it row by row, this is the effect\
    \ \n\nmost aural browsers display when reading a table to a user. \n\nMost screen\
    \ readers read tables a row at a time, so you have to be careful when \n\nusing\
    \ tables for layout. \n\n77"
