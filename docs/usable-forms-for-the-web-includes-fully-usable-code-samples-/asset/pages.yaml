    ].focus(); \n\nbreak; \n\n} \n\n} \n\n} \n\nreturn returnVal; \n\n} \n\nRegular\
    \ expressions also use what are known as repetition characters. These are simply\
    \ a way to tell \n\na regular expression how many occurrences of a given character,\
