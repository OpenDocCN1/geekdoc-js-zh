    \nForm Validation Techniques \n\nAnd here's the result when someone hits the Submit\
    \ button without filling in or selecting any of the fields: \n\nThere are possibilities\
    \ other than the alert () dialog for presenting the error information: we could\
    \ also \n\nwrite the error message into a pop-up window, or in more advanced cases,\
    \ we could write it into the page \n\nitself. For more information on how to do\
    \ this, see one of the JavaScript references in the appropriate \n\nsection of\
    \ this book. Now let's get into the code for the validate. j s file: \n\nfunction\
    \ validate(form) \n\n{ \n\nFirst we define some variables to hold values we'll\
    \ be using throughout the function, including the \n\nfunction's return value,\
    \ a shortcut for accessing form elements, and variables to hold the name, type,\
    \ and \n\nvalue of a form element. We also initialize a string upon which we'll\
    \ build an error message (should it be \n\nnecessary to display one), and a variable\
    \ to hold the index of the first element in the page where we \n\nencounter an\
    \ error, so we can set focus on that element after we've found and reported all\
    \ the errors. \n\nvar returnVal=true; \n\nvar formEls=form.elements; \n\nvar currEl,currName,currType,currVal,currField,minimum,maximum,temp;\
    \ \n\nvar errMsg=\"There were problems with the following field(s):\\\\n\"; \n\
    \nvar firstErr=-l; \n\nNext we define some regular expressions to use in testing\
    \ text input. Most of these we've already covered \n\nin this chapter; as for\
    \ the rest, you should know enough about regular expressions by now to figure\
    \ out \n\nwhat they do. \n\n257"
