  md: "![](img/a10b466d6e11a32674cad146197d13d9_185_0.png)![](img/a10b466d6e11a32674cad146197d13d9_185_1.png)\n\
    \nChapter 5 \n\nWhat's Ahead in This Chapter \n\nNow that we've talked a bit about\
    \ the technologies we'll use, let's take a look at what we're going to \n\ndo\
    \ with them. We'll see how to: \n\n• Collect textual data entered by users in\
    \ forms on web pages, and place this data into server- \n\nside variables so that\
    \ we can process it programmatically. We'll see how PHP makes these \n\nvariables\
    \ available to us using both the get and post methods for submitting forms. \n\
    \n• Write the values held by these variables back into the page. \n\n• Pass the\
    \ variables to other pages using a number of different techniques, including hidden\
    \ form \n\nfields, query strings, cookies, and session variables. \n\n• Store\
    \ data in a MySQL database so that it can be accessed between visits, as well\
    \ as between \n\nusers. \n\n• Retrieve selected data from a MySQL database and\
    \ display it in a page. \n\n• Permit users to upload files to the web server and\
    \ save them there. \n\nIn this chapter, we'll develop a companion application\
    \ to that created in Chapter 4, a simple survey \n\nfor users of the Pizza This\
    \ online ordering system. Users will be able to fill out the survey and send it\
    \ \n\nto the server for processing and storage. We'll also create a page where\
    \ users can see the \n\ncumulative results of the survey. Finally, we'll take\
    \ steps to prevent users from taking the survey \n\nrepeatedly and skewing the\
    \ results. \n\nIn Chapter 6, we'll expand on the survey. We'll add a few additional\
    \ fields for users to fill out and \n\ndemonstrate different client-side and server-side\
    \ techniques for validating the forms before the \n\ninformation that they contain\
    \ is sent to the database. \n\nWe'll also discuss some of the issues involved\
    \ in transferring data securely between the client and \n\nthe server. These can\
    \ be quite complex, so we won't try to go into any great detail or offer examples,\
    \ \n\nbut we will point you to some resources where you can learn more about the\
    \ subject if and when you \n\nneed to. See the entries under the heading Security\
    \ Issues in the References and Resources section \n\nat the end of the book. \n\
    \nFinally, as an added bonus for visitors to the web site accompanying this book,\
    \ you can see not only \n\nthis survey, but a reimplementation of the application\
    \ developed in the previous chapter as well, and \n\nyou'll be able to download\
    \ the complete source code for both. \n\nPHP and Form Data ' \n\nSome server programming\
    \ platforms such as ASP and Perl require us to use collections of some sort \n\
    \nto obtain values from form elements. PHP provides similar mechanisms for forms\
    \ using either post \n\nor get. It also gives us a much simpler alternative that\
    \ works with either method, and which is handy \n\nfor small-scale applications\
    \ where we don't have a large number of form fields. We'll look at get first,\
    \ \n\nand then post. \n\n170"
