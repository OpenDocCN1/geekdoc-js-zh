  md: "![](img/a10b466d6e11a32674cad146197d13d9_109_0.png)![](img/a10b466d6e11a32674cad146197d13d9_109_1.png)\n\
    \nChapter 3 \n\nIn this chapter we are going to take you through creating forms\
    \ in Flash, how to work around the \n\nlimitations, and building some PHP scripts\
    \ that interact with the Flash. Along the way we will also \n\ncreate some custom\
    \ form elements to make our forms stand out. You can find all the code from this\
    \ \n\nchapter in the code download for this book. \n\nWhile most of the ActionScript\
    \ that we use will be relatively.simple, it would be useful if you had a \n\n\
    good grasp on dot syntax ActionScript and are comfortable using the Actions panel\
    \ in expert mode. \n\nFor more information, see some of the references in our\
    \ Resources section at the end of the book. \n\nThe Server Side \n\nYou will see\
    \ how server-side scripts can be used to validate forms and send feedback to the\
    \ user in \n\nChapters 4 and 5 (refer to these if you need more information about\
    \ the middleware in this chapter); \n\nwhen you are scripting for Flash forms\
    \ there are a few small but very important differences. \n\nIt's important to\
    \ get your head around the information flow at this stage. When you submit an\
    \ HTML \n\nform, your server-side script returns information to the browser, usually\
    \ in the form of a new HTML \n\npage. When you submit a Flash form however, the\
    \ server-side script sends the information directly \n\nback to the Flash movie.\
    \ Because we call the script using the loadvariables () command, Flash \n\nwill\
    \ be expecting to receive some information back. It's important to note however,\
    \ that the playhead \n\nof your Flash movie doesn't hang around waiting for this\
    \ information, it will carry on playing \n\nregardless. \n\nThis means the information\
    \ we get back has to be in a format that Flash can understand. Instead of \n\n\
    outputting a new HTML page, our server-side script simply needs to send back some\
    \ variables. \n\nFlash can then determine what to do with this information accordingly.\
    \ \n\nAs an example, suppose you have a simple e-mail feedback form (which is\
    \ precisely what our first \n\nexample exercise is going to be) and a PHP script\
    \ that validates the e-mail address before sending. \n\nIf the user has entered\
    \ an invalid e-mail address, you need to pass this information back to your \n\
    \nFlash movie. In your PHP you would do something along the lines of: \n\n// validate\
    \ email address \n\nif(ereg(\"(\\[\\[:alnum:\\]\\\\.\\\\-\\]+)(\\\\@\\[\\[:alnum:\\\
    ]\\\\.\\\\-\\]+\\\\.+)\", $emailField)) \n\n{ // address is valid \n\n} \n\nelse\
    \ \n\n{ \n\n$returnVal \\= \"ERROR!\"; \n\n$whoops \\= (\"Address not valid.\"\
    ); \n\necho(\"&message=$whoops&returnVal=$returnVal&\"); \n\nexit; \n\n} \n\n\
    Here you can see that in the else statement the PHP is sending back .two variables.\
    \ Effectively what \n\nFlash sees when receiving this information is: \n\nmessage\
