    \ \\= True \n\nSet NotAlphanumeric \\= New RegExp \n\nNotAlphanumeric.Pattern\
    \ \\= \" t^a-zO^\\]\" \n\nNotAlphanumeric.IgnoreCase \\= True \n\nSet NotAddress\
    \ \\= New RegExp \n\nNotAddress.Pattern \\= \"\\[A\\\\w \\\\-#\\\\.\\\\,\\\\/\\\
    ]\" \n\nNotAddress.IgnoreCase \\= True \n\nNotAddress.Global \\= True \n\nSet\
    \ HasSpaces \\= New RegExp \n\nHasSpaces.Pattern \\= ”\\\\s\" \n\nHasSpaces.Global\
    \ \\= True \n\nSet Notint \\= New RegExp \n\nNotint. Pattern \\= \"\\[A\\\\d\\\
    ]\" \n\nNotint.Global \\= True \n\nSet IsDecimal \\= New RegExp \n\nIsDecimal.Pattern\
    \ \\= \"/'\\\\d+( \\\\ . \\\\d+) ?$ \" \n\nSet IsCc \\= New RegExp \n\nIsCc.Pattern\
    \ \\= \"A\\\\d{4}(\\-\\\\d{4}){3}$\" \n\nSet IsUsZip \\= New RegExp \n\nIsUsZip.\
    \ Pattern \\= ,,A\\\\d{5} (-\\\\d{4}) ?$» \n\nSet IsUsPhone \\= New RegExp \n\n\
    IsUsPhone. Pattern \\= \"A\\\\d{3} \\[-\\\\. \\] \\\\d{3} \\[-\\\\. \\] \\\\d{4}$\"\
    \ \n\nSet IsEmail \\= New RegExp \n\nIsEmail.Pattern \\= \"A\\\\w(\\\\.?\\[\\\\\
    w-\\])+@\\\\w(\\\\.?\\[\\\\w-\\])+\\\\.\\[a-z\\]{2,4}(\\\\.\\[a-z\\]{2})?$\" \n\
    \nSet IsCurrency \\= New RegExp \n\nIsCurrency.Pattern \\= \"A\\\\d+(\\\\.\\\\\
    d{2})?$\" \n\nSet CurrencySigns \\= New RegExp \n\nCurrencySigns.Pattern \\= \"\
    \\[\\\\$£¥\\\\,\\]\\*” \n\nCurrencySigns.Global \\= True \n\nSet IsComment \\\
    = New RegExp \n\nIsComment.Pattern \\= \"\\[a-zA-ZO-9 \\\\.\\\\,;:%&#@!\\\\A\\\
    -\\_~'\\\\\\[\\\\\\]\\\\{\\\\}\\\\\\*\\\\/\\\\?\\\\(\\\\)\\\\n\\\\r1\" & \n\n\
    Chr(34) & \"\\]\" \n\nIsComment.IgnoreCase \\= True \n\nIsComment.Global \\= True\
    \ \n\nThis array, as noted above, contains a set of string elements \\- our methodology\
    \ depends on finding \n\nthese as substrings of the name attributes used for the\
    \ fields in the form we want to validate. Note that \n\nwe've altered a couple\
    \ of these (integerval and currencyval) slightly so as not to collide with \n\n\
    VBScript keywords. \n\n287"
