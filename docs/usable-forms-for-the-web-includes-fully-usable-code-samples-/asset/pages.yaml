    \ then click \n\n<a href=\"survey\\_intro.php\">here</a> to continue.</p> \n\n\
    <?php \n\n} \n\n?> \n\nPages 2, 3, and 4 of the survey are the same as in the\
    \ hidden form fields example, but we do need \n\nto make a couple of minor additions\
    \ to the results page. \n\nFirst, immediately following the first opening <?php\
    \ delimiter, we again obtain the time () and set \n\nboth a variable and a second\
    \ cookie with that as its value by inserting: \n\n$finish \\= time(); \n\nsetcookie(\
    \ \"end”, $finish ); \n\nthen just before the opening <form> tag, we insert: \n\
    \n<p>Thanks for taking the time to complete our survey, \n\n<?php echo $first\\\
    _name; ?>!<br /> \n\nWe appreciate the <?php echo $finish \\- $start; ?> \n\n\
    seconds you spent in considering your answers.</p> \n\nIn addition to the hidden\
    \ form field values, we now have the user's start and end times stored in two\
    \ \n\ncookies whose values can also be passed to a database or other data store.\
    \ We'll discuss the \n\nspecifics of doing so with regard to a MySQL database\
    \ shortly. Before we do, however, we need to \n\ntalk about the other mechanism\
    \ that PHP provides for preserving state. \n\nPHP and Sessions \\- Simple Example\
    \ \n\nIn PHP 3, sessions were quite tricky to use. Fortunately, since PHP 4.0,\
    \ session-handling \n\nfunctionality has been an integral part of PHP \\- in fact,\
    \ it's dead easy. A single function call: \n\n• Generates a unique identifier\
    \ for the client session. \n\n• Makes this ID ($phpsessid) available to the client,\
    \ either in a cookie or as part of the query \n\nstring if the client doesn't\
    \ support cookies, and does so transparently to both the user and the \n\nprogrammer.\
    \ \n\n• Creates a file on the server using the session ID as the filename. \n\n\
    • Causes any session variables and their values subsequently created by the programmer\
    \ to be \n\nassociated with this session ID by saving them in this session file.\
    \ \n\n• Causes PHP to delete the file and the data it contains after the session\
    \ ID has been inactive for \n\na predetermined length of time (180 minutes is\
    \ the default). \n\nLet's walk through a simple example that creates and maintains\
    \ a user session and a session \n\nvariable \\- a counter that tells users how\
    \ many times they've hit pages on our site. Here's the code, \n\nwhich is exactly\
    \ the same for all five pages, sessiontest\\_l .php through sessiontest\\_5 .php.\
    \ \n\n(You'll find them in the code download in the directory session.) Here's\
    \ the code: \n\n<?php \n\nsession\\_start(); \n\n191"
