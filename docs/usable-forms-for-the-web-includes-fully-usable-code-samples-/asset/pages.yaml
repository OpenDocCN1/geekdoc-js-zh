    D/g; \n\nvar isDecimal=/A\\\\d+(\\\\.\\\\d+)?$/; \n\nvar isCC=/A\\\\d{4}(\\-\\\
    \\d{4}){3}$/; \n\nvar isUSZip=/A\\\\d{5}(— \\\\d{4>)?$/; \n\nvar isUKPost=/\\\
    [a-zA-Z\\]{1,2}\\[1-9\\]\\[l-9a-zA-Z\\]? \\[1-9\\]\\[a-zA-Z\\]{2}/; \n\nvar isUSPhone=/A\\\
    \\d{3}\\[-\\\\.\\]\\\\d{3}\\[—\\\\.\\]\\\\d{4}$/; \n\nvar isEmail=/A\\\\w(\\\\\
    .?\\[\\\\w-\\])\\*@\\\\w(\\\\.?\\[\\\\w-\\])\\*\\\\.\\[a-z\\]{2,6}(\\\\ .\\[a-z\\\
    ]{2})?$/i; \n\nvar isCurrency=/A\\\\d+(\\\\.\\\\d{2})?$/; \n\nvar notComment=/\\\
    [Aa\\-zA-Z0-9\\\\.\\\\,;:%&#$@!\\\\A\\-\\_~' \"'\\\\\\[\\\\\\]\\\\{\\\\}\\\\\\\
    *\\\\/\\\\?\\\\(\\\\)\\]/i; \n\nThe elements in the requirements array defined\
    \ here should also look familiar, as we just saw them in \n\nthe \"Keywords\"\
    \ table and HTML source above. We should caution you that since we'll be checking\
    \ to see \n\nwhether or not these are found in the names of the form's elements,\
    \ you must be careful not to use them \n\nin the names of any fields to which\
    \ they don't apply! \n\nvar requirements=new Array(\"required\",\"alphabetic\"\
    ,\"address\",\"alphanumeric\", \n\n\"nospace\",\"integer\",\"decimal\",\"minlength\"\
    ,\"maxlength\",\"ccnumber\", \n\n\"uszip\",\"ukpost\",\"usphone\",\"email\",\"\
    currency\",\"percent\",\"comment\"); \n\nNow that we've made provision for all\
    \ the variables and values we'll be using, we can start validating, \n\nwhich\
    \ means looping through all of the elements in the form and performing a series\
    \ of tests on each one. \n\nfor(var i=0;i<formEls.length;i++) \n\n{ \n\nWe get\
    \ a reference to the current element, \n\ncurrEl=formEls\\[i\\]; \n\nthen get\
    \ its name, type, and value. \n\ncurrName=currEl.name; \n\ncurrType=currEl.type;\
    \ \n\ncurrValue=currEl.value; \n\n\\* \\\\ \n\nNext we obtain the designation\
    \ for the element that we'll use for describing it when we report errors about\
