    \ \n\n<trxtd> \n\n<% \n\nDim arrPrintCart, y \n\narrPrintCart \\= Session(\"Cart\"\
    ) \n\nintSubTotal \\= 0 \n\nFor y \\= 1 to (Ubound(arrPrintCart, 2)—1) \n\nResponse.Write\
    \ \"<trxtd>\" & arrPrintCart (0,y) & \"</td>\" \n\nResponse.Write \"<td>\" & arrPrintCart(l,y)\
    \ & \"</td>\" \n\nResponse.Write \"<td>\" & arrPrintCart(2,y) & \"</td>\" \n\n\
    Response.Write \"<td>\" & FormatCurrency(arrPrintCart(4,y),2) & \"</tdx/tr>\"\
    \ \n\nintSubTotal \\= arrPrintCart(4, y) + intSubTotal \n\nNext \n\n%> \n\n</tdx/tr>\
    \ \n\n</table> \n\n<table> \n\n<tr><td>Subtotal</td> \n\n<td><% Response.Write(FormatCurrency(intSubTotal),\
    \ 2)) %x/td> \n\n</tr> \n\n</table> \n\n157"
