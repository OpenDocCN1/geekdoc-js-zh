    \nUsing Forms \n\nwith PHP and MySQL \n\nWe think you'll agree that this is very\
    \ convenient for anyone spending or planning to spend much \n\ntime developing\
    \ web sites or other applications with PHP. You can make use of this feature from\
    \ any \n\nweb browser, wherever there's an Internet connection. \n\nSummary \n\
    \nIn this chapter, we've shown you how the popular open-source server scripting\
    \ language handles \n\ndata that's submitted in forms. We examined what PHP does\
    \ with forms and their contents using \n\neither get or post and we've compared\
    \ their usefulness. We also examined a couple of other ways \n\nthat we can pass\
    \ data between pages in PHP, including setting cookies and using sessions and\
    \ \n\nsession variables. \n\nWhile we didn't go into great detail, we also touched\
    \ on some security issues and ways that PHP can \n\nhelp us handle those. \n\n\
    We also looked at passing form data to a MySQL database with PHP, and we used\
    \ PHP and MySQL \n\nto generate forms dynamically, our example being a customer\
    \ survey for which we can change the \n\nrange of possible responses to individual\
    \ questions without having to recode HTML pages. It's a \n\nfairly obvious step\
    \ from there to implementing a survey in which the questions themselves can be\
    \ \n\nupdated without having to redesign pages to accommodate them. Finally, we\
    \ showed a couple of \n\nways in which data submitted by users via forms can be\
    \ displayed on both an individual and a \n\ncumulative basis. \n\nComing up in\
    \ Chapter 6, we'll show you a number of different methods for validating form\
    \ data to \n\nhelp you ensure that information entered by users meets your requirements,\
    \ including both client- \n\nside and server-side techniques and some of the pros\
    \ and cons of each. We'll discuss some \n\ndesign strategies for limiting user\
    \ choices to acceptable values and how to ensure that required \n\nfields aren't\
    \ skipped. \n\nWe'll also discuss string functions and methods from JavaScript,\
    \ VBScript, and PHP, as well as ways \n\nof using regular expressions to help\
    \ us make sure that data is in a acceptable format, includes \n\nrequired characters,\
    \ excludes characters we don't want entered, and so forth. Additionally, we'll\
    \ see \n\nhow we can bring errors to the attention of users and make it clear\
    \ to them what needs to be re¬ \n\nentered, where, and how. \n\n221"
