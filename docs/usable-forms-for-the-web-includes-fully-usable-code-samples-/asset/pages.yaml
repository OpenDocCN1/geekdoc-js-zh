    \ than the three \n\nindicated in any case, since it makes no sense (for example)\
    \ to determine whether or not a checkbox \n\ncontains any non-digit characters.\
    \ \n\ncase \"checkbox\": \n\nIn the latter two cases, we need to determine how\
    \ many of them have been checked. This can be a little \n\nconfusing if you're\
    \ not used to dealing with how checkboxes and radiobuttons are reflected in the\
    \ \n\nDocument Object Model. Any checkboxes (or radiobuttons) sharing the same\
    \ name are considered to be \n\nelements in a sub array of document. f ormName.\
    \ checkBoxName; however, in terms of the form \n\nelements array itself, they're\
    \ also considered to be discrete elements. So, in accessing them sequentially,\
    \ \n\nwe have to be aware of both these arrays. (We should caution you that what\
    \ we're about to show you \n\nwon't work as expected if you break up a checkbox\
    \ grouping so that other form elements come in \n\nbetween some of the individual\
    \ checkboxes.) For example, let's suppose we have a set of checkboxes \n\neach\
    \ named myCheckBox and the first of these is the third element in a form named\
