  md: "![](img/a10b466d6e11a32674cad146197d13d9_89_0.png)![](img/a10b466d6e11a32674cad146197d13d9_89_1.png)\n\
    \nChapter 2 \n\nIf you choose this option, it's a good idea to use the labels\
    \ for information only, not as links \\- if you \n\ndo use them as links, remember\
    \ that you must maintain the user's state (something we discuss in \n\nChapters\
    \ 4 and 5). \n\nWhen providing multiple pages of a form, making users visit them\
    \ in order helps ensure \n\nthat they fill in all the required sections. Unordered\
    \ links are only really suitable in a form \n\nwhen you don't require the user\
    \ to fill in all or most of the form. \n\nSplitting up a form into separate pages\
    \ also helps with validation and error handling, as the incorrect \n\nanswers\
    \ will be clearer to the user. We look at validation in Chapter 6. When writing\
    \ error-handling \n\ncode, you must make sure that your error messages are friendly,\
    \ not too curt, and, where possible, \n\nclearly state what the user might have\
    \ done wrong and how to fix it. If you have strict validation, you \n\nshould\
    \ also end up with lots of error messages \\- not just a few. If you only have\
    \ a few, go back and \n\ncheck that they are detailed enough to provide the user\
    \ with an idea of what they have done wrong. \n\nYou should also make sure that\
    \ the user has all the required information on that page. You don't \n\nwant users\
    \ going back to a previous page to check on an answer \\- if your logs/testing\
    \ show this \n\nhappening, put the relevant information on that page. For example,\
    \ if you ask whether the credit card \n\nbilling address for a product on an e-commerce\
    \ site is different from the delivery address, display the \n\ndelivery address\
    \ so that the user knows which address they entered. \n\nNumbering Questions \n\
    \nIf you're creating a formal form containing a lot of questions, such as an application\
    \ form or an \n\nonline test, then you should number the questions so that users\
    \ know where questions start and \n\nend. This can also help to indicate where\
    \ the user should jump to if a section of the form is not \n\nrelevant to them:\
    \ \n\n74"
