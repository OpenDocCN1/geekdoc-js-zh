  md: "![](img/a10b466d6e11a32674cad146197d13d9_250_0.png)![](img/a10b466d6e11a32674cad146197d13d9_250_1.png)\n\
    \nForm Validation Techniques \n\nNow we test the string to see if it matches this\
    \ regular expression, usinq the regular expression's \n\ntest() method: \n\nif(myRegExp.test(myFirstName))\
    \ \n\nalert(\"There is at least one \\\\\"a\\\\\" in the firstName field.\");\
    \ \n\nelse \n\nalert(\"The letter \\\\\"a\\\\\" was not found in the firstName\
    \ field.\"); \n\nSo far we've not done anything that couldn't be accomplished\
    \ by replacing the above test with \n\nif (myFirstName. indexOf (\"a\") ! \\=-i)\
    \ {...}; \\- however, regular expressions are much more \n\nversatile than this.\
    \ For one thing, we can easily test to see if any one of a group of characters\
    \ is present in \n\na string. Let's say that we want to make sure that the first\
    \ name entered in a form contains at least one \n\nvowel. We can place all the\
    \ vowels inside square brackets, indicating that we're looking for a match for\
    \ \n\nany one of the characters that the brackets enclose. \n\nvar anyVowel=/\\\
    [aeiou\\]/; \n\nif(!anyVowel.test(myFirstName)) \n\nalert(\"Gee, your name must\
    \ be difficult \n\nto pronounce without any vowels in it!\"); \n\nHowever, this\
    \ may annoy Ann Smith who's just typed \"Ann\" into the field labeled \"Please\
    \ enter your first \n\nname\" because letters in regular expressions are normally\
    \ case-sensitive. In order to suppress this, we \n\ncould define our regular expression\
    \ as / \\[aeiouAEiou\\] / but there's a quicker and shorter way in which \n\n\
    we can accomplish this; we can use the case-insensitivity flag i: \n\nvar anyVowel=/\\\
    [aeiou\\] /i; \n\nRegular expressions also feature special character classes,\
    \ which let us use a single class to represent \n\nany one of a group of characters,\
    \ such as digits, word characters, or whitespace characters \\- as shown in \n\
    \nthe following table: \n\nCharacter \n\nClass \n\nCharacters matched \n\n\\\\\
    d \n\nany of the digits 0-9 \n\n\\\\D \n\nany character that's not a digit \n\n\
    \\\\w \n\nany word character; a word character can be any of the letters a-z or\
    \ A-Z, any \n\ndigit 0-9, or the underscore character \\_ \n\n\\\\W \n\nany non-word\
    \ character \n\n\\\\s \n\nany whitespace character (space, tab, newline, carriage\
    \ return, form feed, \n\nvertical tab) \n\n\\\\S \n\nany non-whitespace character\
    \ \n\n• \n\nany single character except a newline \n\n\\[ \\] \n\nany one of the\
    \ characters coming between the brackets \n\n\\[A \\] \n\nany character that's\
    \ not inside the brackets, for example \\[-'aeiou\\] matches \n\nany character\
    \ that's not a vowel \n\n235"
