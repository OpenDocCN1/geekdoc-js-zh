  md: "![](img/a10b466d6e11a32674cad146197d13d9_358_0.png)![](img/a10b466d6e11a32674cad146197d13d9_358_1.png)\n\
    \nForms in ASP.NET \n\nIt's crucial to note how this is rendered. If you view\
    \ the source code that's been sent back to the \n\nbrowser, you should see something\
    \ like this: \n\nSelect either A, B or C and click the button at the bottom<br/>\
    \ \n\n<br /> \n\n<table id=\"test\" border=\"0\"> \n\n<tr> \n\n<td> \n\n<input\
    \ id=\"test\\_0\" type=\"radio\" name=\"test\" value=\"a\" /> \n\n<label for=\"\
    test\\_0\">a</label> \n\n</td> \n\n</tr> \n\n<tr> \n\n<td> \n\n<input id=\"test\\\
    _l\" type=\"radio\" name=\"test\" value=\"b\" /> \n\n<label for=\"test\\_l\">b</label>\
    \ \n\n</td> \n\n</tr> \n\n<tr> \n\n<td> \n\ncinput id=\"test\\_2\" type=\"radio\"\
    \ name=\"test\" value=\"c\" \n\nchecked=\"checked\" /> \n\nclabel for=\"test\\\
    _2\">c</label> \n\n</td> \n\n</tr> \n\n</table> \n\nIt's now turned into a table\
    \ containing an cinput type=\" radio\"\\> HTML form controls; this is the \n\n\
    HTML output of a radiobuttoniist. Note that it's had one attribute of the <input>\
    \ tags altered to \n\nreflect the selection we made before we submitted the form.\
    \ We'll discuss how the server control \n\nworks shortly. \n\nHowever, it's the\
    \ line above the table containing the hidden control that is of particular note:\
    \ \n\ncinput type=\"hidden“ name=\"\\_VIEWSTATE\" \n\nvalue=\"dDw0MDk5MTgxNTU7Oz6uRHe+nI5gXAdJQfwm0VDW904A2w==\"\
    \ /> \n\nThis hidden control called\\_viewstate contains a value that is an encoded\
    \ representation of the \n\noverall state of the controls in the form (as it was\
    \ when last submitted). This is used by ASP.NET to \n\nkeep track of all the server\
    \ control settings from one page refresh to another \\- otherwise, our \n\nselected\
    \ radio button would revert to a static default unchecked setting every time we\
    \ submitted a \n\nvalue. The information in the\\_viewstate is generated by ASP.NET.\
    \ It's therefore not actually the \n\n\\_viewstate itself that sets the controls,\
    \ ASP.NET does it when processing the\\_viewstate \n\nduring a postback and adding\
    \ the necessary HTML attributes to the form. \n\nThus ASP.NET is able to look\
    \ at the old values and compare them to the current ones using \n\n\\_viewstate.\
    \ From this it knows how to persist the state of ASP.NET server controls between\
    \ page \n\nsubmissions. If there are differences, such as a different radio button\
    \ being selected, then internal \n\nevents are generated by ASP.NET in response\
    \ to this and it deals with it appropriately, to create a \n\n\"current\" version\
    \ of the form. This \\_viewstate control is crucial to ASP.NET being able to \n\
    \nremember the state of controls between page submissions, without actually maintaining\
    \ a page \n\nobject or HTTP connection throughout. \n\n343"
  merge: -1
  pgno: 358
- img_proc: true
  md: "![](img/a10b466d6e11a32674cad146197d13d9_359_0.png)![](img/a10b466d6e11a32674cad146197d13d9_359_1.png)\n\
    \nChapter 8 \n\nAs for the encoded value that's contained within the value attribute,\
    \ we don't need to try and interpret \n\nthe value contained within it \\- it's\
    \ only really designed to mean something to ASP.NET itself. \n\nHowever, it's\
    \ important to note that this attribute is what allows the form to keep track\
    \ of the state of \n\nserver control between page moves and page refreshes. \n\
    \nYou should now be able to see that ASP.NET has used thfe postback information\
    \ about the state of \n\nthe page to create a new version of it, with the state\
    \ of the corresponding controls being \n\nremembered. This can be used by the\
    \ browser in future iterations of the page, but is never displayed \n\nagain.\
    \ So postback works by using only HTML elements and controls, which contain information\
    \ that \n\ncan be interpreted by ASP.NET. \n\nTesting the Form for Postback \n\
    \nThis gives a broad overview of how forms in ASP.NET work using postback, but\
    \ doesn't answer our \n\noriginal question, which was \"how can we know if a form\
    \ has been posted by the user, or whether it \n\nis being viewed for the first\
    \ time?\" This is done via the isPostBack method of the Page object. \n\nThis\
    \ method returns true or false depending on whether the page has been posted back\
    \ or not. \n\nTypically you will use it within the confines of an if.. .then statement\
    \ as follows: \n\nif Page.IsPostBack Then \n\nTextl.Text \\= \"Your details have\
    \ been received by the server.\" \n\nEnd If \n\nWe will see this method in action\
    \ when we come to discuss server controls fully. \n\nSo to sum up the process\
    \ of how ASP.NET forms work, everything is looked after via the process of \n\n\
    postback. ASP.NET posts back encoded information to the server about the current\
    \ state of the \n\ncontrols on the form via a hidden control called\\_viewstate.\
    \ This is interpreted by ASP.NET, and \n\nthen ASP.NET amends the HTML attributes\
    \ of the form, when it posts back the form to the browser \n\nto create a seeming\
    \ persistence of data between page refreshes. To capture data in ASP.NET forms\
    \ \n\nwe used a customized version of an HTML form controls. This is the bit we're\
    \ going to investigate \n\nnow in greater detail. \n\nASP.NET Server WebControls\
    \ \n\nIn this next section, we're going to be demonstrating how the relevant ASP.NET\
    \ server WebControls \n\nwork, and compare the way they are used with the way\
    \ their equivalent HTML form control passes \n\ninformation, but first we need\
    \ a little bit of background about this group of controls. In ASP.NET \n\ncontrols\
    \ are grouped together with similar functions, but there's more to it than just\
    \ that, they are \n\ngrouped together because they are derived from the same base\
    \ class. \n\nEach part of ASP.NET is divided up into namespaces (unique identifiers),\
    \ and these are all exposed \n\nto the programmer. You can view this via a simple\
    \ tool known as the class browser. Thi$ can be \n\nfound in the SDK if you have\
    \ installed the Quickstart tutorials, and also online. The URL for this tool \n\
    \nis: \n\nhttp://samples.gotdotnet.com/quickstart/aspplus/samples’/classbrowser/vb/classb\
    \ \n\nrowser.aspx \n\nSubstitute localhost for sample. gotdotnet. com to get at\
    \ it on your local machine, \n\nbut this file will only be there if you have installed\
    \ the Quickstart tutorials."
