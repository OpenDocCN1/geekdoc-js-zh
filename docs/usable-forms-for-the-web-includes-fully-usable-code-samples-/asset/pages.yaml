  md: "![](img/a10b466d6e11a32674cad146197d13d9_23_0.png)![](img/a10b466d6e11a32674cad146197d13d9_23_1.png)\n\
    \nChapter 1 \n\n• Labels. \n\n• Adding structure using <f ieldset> and <legend>\
    \ elements. \n\n• Giving focus to elements \\- tabbing navigation and shortcuts.\
    \ \n\n\\* \n\n• Form submission. \n\n• An example e-mail feedback form. \n\n•\
    \ An example contact details form. \n\nWithin an HTML document, you can have one\
    \ or more forms, which allow visitors to your site to submit \n\ndata to your\
    \ server for further processing. These can be as simple as a search form on a\
    \ site, consisting \n\nof a textbox that allows you to enter keywords you want\
    \ to search for and a button to start the search, or \n\nas complex as a detailed\
    \ online survey or a mortgage application form. \n\nThis chapter starts with a\
    \ short introductory section for those who have not had too much experience in\
    \ \n\ncreating forms and is followed by a reference section covering each aspect\
    \ of writing forms \\- with several \n\nexamples. If you're familiar with forms\
    \ in HTML, then the majority of this chapter will be useful to refer \n\nback\
    \ to when working through the book. If you've not created too many forms, however,\
    \ read on... \n\nA Quick Introduction to Forms \n\nWhatever type of form you're\
    \ creating, the form is contained in an element called <f orm>, which in \n\n\
    addition to containing form controls \\- the items you see on web pages such as\
    \ checkboxes, radio \n\nbuttons, drop-down lists, text input boxes, and so on\
    \ \\- can also contain normal textual content and other \n\nHTML elements, just\
    \ like the rest of the page. \n\nWhen the user has entered text, selected items\
    \ from a drop-down list, or whatever options the form \n\ncontains, the form can\
    \ then be processed. While client-side script is often used in processing form\
    \ data \n\n(as we'll see when we look at Chapter 6, Form Validation Techniques,\
    \ and Chapter 7, Advanced \n\nClient-side Form Scripting), most forms send some\
    \ data to a web server, which processes the form. \n\nProcessing is triggered\
    \ by the user clicking the Submit button or by an event that triggers a script.\
    \ \n\nHere you can see what happens when a form is sent to a server for processing.\
    \ Once the server has \n\nreceived and processed the form data, it usually sends\
    \ a new web page back to you \\- either responding \n\nto a request you've made\
    \ through the form or just to acknowledge your actions. \n\n8"
