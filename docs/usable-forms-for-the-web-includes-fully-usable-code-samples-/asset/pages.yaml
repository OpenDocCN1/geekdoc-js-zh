    \nAdvanced Client-side Form Scripting \n\nThe forward slashes around the string\
    \ url indicate that we're looking for a match for that string, the \n\ng flag\
    \ after the second slash indicates that we want a global match across the whole\
    \ of the text area \n\n(without the g flag, only the first match in the string\
    \ is replaced), and the i flag indicates that it \n\nshould be a case-insensitive\
    \ match. \n\nYou can match a set of strings using the pipestem character; here\
    \ we're looking for a match with \n\nlink, url, or homepage: \n\n/link|url|homepage/\
    \ \n\nNote that if you want to search for any of the following characters they\
    \ must be escaped, because \n\nthey have special meanings in regular expressions:\
    \ \n\n\\\\ I 0 \\[{/'$\\* + ?. \n\nYou can escape these characters by preceded\
    \ them by a backslash (for example / \\\\\\\\/ matches a \n\nbackslash and /\\\
    \\$/ matches a dollar sign). \n\nSome other interesting characters you should\
    \ note are: \n\nExpression \n\nMeaning \n\n\\\\n \n\nLinefeed \n\n\\\\r \n\nCarriage\
