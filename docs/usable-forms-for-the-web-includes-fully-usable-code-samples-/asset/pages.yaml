    \nDisabled and Read-only Controls • \n\nThere are times when you might want to\
    \ disable a control or make it read-only. The two are similar; \n\nhowever, there\
    \ are slight differences. \n\n• disabled disables the control for user input until\
    \ modified by script. In this case, the control \n\nwill not be successful, therefore\
    \ the name/value pair will not be passed to the processing \n\napplication unless\
    \ modified. \n\n48"
