    \nDesigning Usable Forms \n\nAccessibility Test Tools \n\nWhen it comes to testing\
    \ for accessibility, there's no substitute for getting someone who's familiar\
    \ \n\nwith assistive technologies (technologies that serve to allow people with\
    \ disabilities to gain full \n\nbenefit from electronic resources) such as screen\
    \ readers, and who uses them regularly, to test it. \n\nThis may require outside\
    \ help, although there should be an increasing number of developers who are \n\
    \nfluent in these technologies as they become aware of accessibility problems.\
    \ \n\nIf you don't have a suitable candidate, try using the technologies yourself.\
    \ Indeed, you should learn \n\nhow to use some of these technologies and have\
    \ them available for such testing. However, \n\nremember that users proficient\
    \ in working with such technologies are able to work with the reading \n\nspeed\
    \ a lot higher than you can and they'll be more familiar with keyboard shortcuts\
    \ in these \n\napplications. \n\nThere are also a number of software applications\
    \ and web sites that can help you to test your levels \n\nof accessibility. You\
    \ should not rely on these, however, as they can only make recommendations on\
    \ \n\nfeatures that a computer can test \\- such as the presence of alt text for\
    \ images. They are unable to \n\ndetect things like whether the alt text is unsuitable,\
    \ whether the colors will be a problem, and so on. \n\nA couple of popular sources\
    \ for tests are: \n\n• Bobby from the Center for Applied Special Technology (CAST).\
