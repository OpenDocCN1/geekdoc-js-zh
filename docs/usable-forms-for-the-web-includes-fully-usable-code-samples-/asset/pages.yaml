  md: "![](img/a10b466d6e11a32674cad146197d13d9_30_0.png)![](img/a10b466d6e11a32674cad146197d13d9_30_1.png)\n\
    \nHTML Forms \n\nGeneral HTML Attributes \n\nOther HTML attributes that you can\
    \ use with the <form> element are: \n\nclass, lang, style, title, target, onclick,\
    \ ondblclick, onmouseup, onmousedown, \n\nonmouseover, onmousemove, onmouseout,\
    \ onkeypress, onkeydown, onkeyup \n\nWe won't cover each of these in this chapter,\
    \ as they're generic HTML attributes. \n\nHaving seen the <f orm> element, which\
    \ we use to wrap a form in, let's look at the different types of \n\ncontrols\
    \ that we can put on a form to gather user data. \n\nControl Types \n\nIn this\
    \ section, we'll go through the types of form control that are available for collecting\
    \ data from a visitor \n\nto a page: \n\n• Text input controls. \n\n• Buttons.\
    \ \n\n• Checkboxes and radio buttons. \n\n• Select boxes and listboxes (also known\
    \ as drop-down menus). \n\n• File select boxes. \n\n• Hidden controls. \n\nText\
    \ Input \n\nProbably the most common use you'll have for a control will be to\
    \ allow a user to enter text. There \n\nare three types of text input used on\
    \ forms: \n\n• Single-line input controls, for which you use the <input> element.\
    \ \n\n• Password input controls \\- single-line input controls that mask the characters\
    \ that the \n\nuser enters when they're displayed on the screen \\- for which\
    \ you also use the \n\n<input> element. \n\n• Multi-line input controls, for which\
    \ you use the <textarea> element. \n\nSingle-line input controls are used for\
    \ items that only require one line of user input, such as search boxes \n\nand\
    \ address lines, while multi-line input controls are used where the user is required\
    \ to give details that \n\nmay be longer than, say, a sentence. Password input\
    \ controls are just like single-line input controls, but \n\nthey show either\
    \ an asterisk or a block rather than the characters the user enters, making them\
    \ ideal for \n\nsensitive information such as passwords and credit card details.\
    \ \n\n15"
