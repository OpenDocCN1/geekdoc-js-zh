  md: "![](img/a10b466d6e11a32674cad146197d13d9_174_0.png)![](img/a10b466d6e11a32674cad146197d13d9_174_1.png)\n\
    \nForms and ASP \n\nChoosing Side Orders \n\nEach side order goes in its own form,\
    \ just like the pizzas did in order4 .asp. The action \n\nattribute of the <form>\
    \ element points back to the current page, where we'll add the items to the \n\
    \ncart if any are selected. If the user selects a side order, it will be sent\
    \ in the query string using the \n\nhttp get method: \n\n<htmlxbody> \n\n<!--\
    \ ordering instructions and display of cart information go here \n\nthis is the\
    \ same as we just saw in the previous example \\--> \n\n<form action=”order6.asp\"\
    \ method=\"get\"> \n\n<table> \n\n<trxtdxdiv class=\"center \"<img src=\" ../images/garlic\
    \ . jpg\" /x/divx/td> \n\n<td>Garlic Bread</td> \n\n<td>6 slices of our delicious\
    \ home \n\nmade garlic bread.<br />2.99</tdx/td> \n\n<td> \n\n<input type=\"hidden\"\
    \ name=\"side\" value=\"garlic\" /> \n\n<div class=\"center\"xinput type=\"image\"\
    \ value=”select\" \n\nsrc=\" ../images/select, gif \" alt=\"select\" /x/divx/td>\
    \ \n\n</tr> \n\n</table> \n\n</form> \n\n<form action=\"order6.asp\" method=\"\
    get\"> \n\n<!-- other side orders displayed exactly the same as previous one \n\
    \neach goes in its own form with a hidden control to indicate choice —> \n\n</form>\
    \ \n\n<a href=\"checkout.asp\" class=\"proceed\">That's enough pizza \\- Checkout!\
    \ \n\n<img src=\"../images/checkout. gif\" alt=\"next\" /x/a> \n\n</bodyx/html>\
    \ \n\nSo, on to the ASP. As this page calls itself to add the item to the cart\
    \ if the user selects a side dish, \n\nthe first thing we do is check for the\
    \ presence of a side dish in the query string. If there is no side \n\ndish, we\
    \ can just present the page. If there is a side dish, however, we will call the\
    \ \n\ninc\\_addsideDish.asp file, which will add the side dish to the cart, and\
    \ the \n\ninc\\_sidePriceFunction. asp file, which determines the price of the\
    \ side dish. \n\n<% \n\nstrSide \\= Request.QueryString(\"side\") \n\nIf Not strSide\
    \ \\= \"\" Then %> \n\n<!-- #include file=\"inc\\_addSideDish.asp\" —> \n\n<!—\
    \ #include file=\"inc\\_sidePriceFunction.asp\" \\--> \n\n<% End If %> \n\n<html>\
    \ \n\n159"
