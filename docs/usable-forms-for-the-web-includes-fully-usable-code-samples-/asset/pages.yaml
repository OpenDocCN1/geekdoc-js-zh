  md: "![](img/a10b466d6e11a32674cad146197d13d9_134_0.png)![](img/a10b466d6e11a32674cad146197d13d9_134_1.png)\n\
    \nForms and ASP \n\nOnce you've collected your form data from the user, you'll\
    \ want to do something with it. This chapter \n\nlooks at how to process the data\
    \ that's supplied in forms using ASP with VBScript. We'll start by \n\nlooking\
    \ at how you can retrieve the data from the forms you write, and then look at\
    \ some of the \n\ncommon tasks that you can perform with that data once you've\
    \ collected it. \n\nThe first section of this chapter looks at retrieving form\
    \ data and using it directly in code or \n\nputting it into variables. We'll look\
    \ at how to write information back to the user, pass information \n\nbetween pages,\
    \ and store it in a database. We'll do this with the help of the Pizza This sample\
    \ \n\ncommerce application. \n\nIn this chapter, we'll look at: \n\nr \n\n• Retrieving\
    \ data from forms that use the http get method and putting the data into variables.\
    \ \n\n• Retrieving data from forms that use the http post method and putting the\
    \ data into variables. \n\n• Writing form information back to the client. \n\n\
    • Passing data between ASP pages and pages of a form using hidden form controls,\
    \ cookies, and \n\nsession state. \n\n• Putting form data into a database. \n\n\
    • Retrieving that form data from a database. \n\n• A fictional application that\
    \ uses forms and ASP to place pizza orders. \n\nBy the end of the chapter, you'll\
    \ have a good idea of how to utilize the data that you've captured with \n\na\
    \ form."
