    \nHTML Forms \n\nHere's the full list of attributes that will work with the <option>\
    \ element: \n\n• selected, label, value \\- which we've just seen. \n\n• disabled\
    \ \\- which we shall see more of later in the chapter. \n\n• class, dir, id, lang,\
    \ style, title \\- available for most HTML elements. \n\n• onclick, ondblclick,\
    \ onkeydown, onkeypress, onkeyup, onmousedown, \n\nonmousemove, onmouseout, onmouseover,\
    \ onmouseup \\- as before, for use with script. \n\nHere's the full list of attributes\
