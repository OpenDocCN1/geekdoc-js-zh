    \nIndex \n\nA Guide to the Index \n\nThe index covers the numbered Chapters only.\
    \ It is arranged alphabetically in word-by-word order (so that \n\nNew York would\
    \ appear before Newark). Unmodified headings indicate the main treatments of topics.\
    \ \n\nAsterisks (\\*) have been used to represent variant endings and tildes (~),\
    \ repeated beginnings. Acronyms \n\nhave been preferred to their expansions as\
    \ main entries on the grounds that they are easier to recall or to \n\nwork out.\
    \ Comments specifically about the index should be sent to billj@glasshaus.com.\
    \ \n\nSymbols \n\n$ (dollar) \n\nsee also under individual variable names. \n\n\
    PHP variable prefix, 173 \n\n% (percentage) character \n\nprefix for escaped character\
    \ values, 318 \n\n\\* (asterisk) \n\nmarking mandatory fields, 79 \n\n/ (forward\
    \ slash) \n\nregular expression delimiter, 234 \n\n; (semicolon) \n\nPHP line\
    \ terminator, 173 \n\n\\\\ (backslash) character \n\nescaping regular expression\
    \ special characters, \n\n237, 313 \n\nescaping, in directory paths, 197 \n\n\
    I (pipestem) character \n\ncombining character searches using, 313 \n\n0 (zero)\
    \ \n\nword separator in contatenated fieldnames, 254, \n\n273, 288 \n\nA \n\n\
    About Yourself example form \n\nusing a variety of controls, 53 \n\naccept attribute,\
    \ <form> element, 14, 35 \n\naccept-charset attribute, <form> element, 14 \n\n\
    Access databases \n\nASP examples use, 120 \n\naccess keys \n\nAbout Yourself\
    \ example form, 53, 57 \n\nproviding focus using, 45 \n\naccessibility \n\nsee\
    \ also screen readers, \n\nforms design and, 65 \n\ntesting tools, 89 \n\naccesskey\
    \ attribute \n\nelements supporting, 45 \n\naction attribute, <form> element,\
    \ 12, 17, 120, 129 \n\nActionScript \n\nsee also Flash forms. \n\nrequirements\
    \ for understanding Flash forms, 94 \n\nreusing a movie clip, 111 \n\naddress\
    \ formats \n\nvalidation using regular expressions, 261 \n\naddslashes() function,\
    \ PHP, 274 \n\nalert() method, 301 \n\nalternatives to, 257 \n\nalt attribute\
