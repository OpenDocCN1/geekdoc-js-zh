  md: "![](img/a10b466d6e11a32674cad146197d13d9_284_0.png)![](img/a10b466d6e11a32674cad146197d13d9_284_1.png)\n\
    \nForm Validation Techniques \n\n\\* preg\\_replace{pattern, replacement, subject\
    \ \\[, limit\\]) \\- This function searches a subject \n\nstring for occurrences\
    \ of a regular expression pattern and replaces them with a replacement \n\nstring.\
    \ It returns the subject string whether or not any matches were found and replaced;\
    \ to find \n\nout if any matches were found, either put the value of string into\
    \ another variable, then \n\ncompare the two values afterwards, or use preg\\\
    _match (). The function can take an optional \n\nfourth argument; if used, only\
    \ the first limit matches in the subject string will be replaced. For \n\nexample:\
    \ \n\n$a\\_string=\"Credit card number: 2345-6235-2124-5884\"; \n\necho $a\\_string\
    \ . \"<br />\"; \n\n$a\\_string=preg\\_replace(\"/\\\\d/\",\"X\",$a\\_string,12);\
    \ \n\necho $a\\_string; \n\nOutputs are as follows: \n\nCredit card number: 2345-6235-2124-5884\
    \ \n\nCredit card number: XXXX-XXXX-XXXX-5884 \n\nThere are several additional\
    \ PCRE functions in PHP, which we won't go into or use here. However, if you \n\
    \nplan on doing much work with this type of regular expression in PHP, you should\
    \ definitely take time to \n\nread up on them. There are more pattern modifiers,\
    \ such as i that are supported in JavaScript, and these \n\nalso merit your attention.\
    \ \n\nString Functions \n\nPHP has quite a large number of functions to deal with\
    \ strings. We'll just mention a few of them here that \n\nwe'll be using to write\
    \ our form handler. \n\n• explode(separator, subject) \\- Divides up a subject\
    \ string into an array of substrings using a \n\nseparator string of one or more\
    \ characters as a delimiter. The separator is not included in any \n\nof the substrings.\
    \ Returns the array of substrings unless the separator isn't found, in which case\
    \ \n\nit returns an array whose single element is the original subject string.\
    \ Note that if you use an \n\nempty string as the separator, this function returns\
    \ false (this is unlike JavaScript's split () \n\nmethod which would return an\
    \ array of individual characters in such a case). (Note: PHP does \n\nhave a split\
    \ () function, but it takes a regular expression as its separator argument.) \n\
    \nExample: \n\n$my\\_string=\"1-800-888-9999\"; \n\n$my\\_array=explode(\"-\"\
    ,$my\\_string); \n\n$length=count($my\\_array); \n\nfor($i=0;$i<$length;$i++)echo\
    \ $my\\_array\\[$i\\] . \"<br />\"; \n\nOutput is as follows: \n\n1 \n\n800 \n\
    \n888 \n\n9999 \n\n269"
