    great\" />c/td> \n\nid=\"good\" />c/td> \n\nchecked id=\"ok\" />c/td> \n\nid=\"\
    weak\" />c/td> \n\nid=\"poor\" />c/td> \n\nThose who are having a page read to\
    \ them will now hear alt text for the images in columns 2 and 4 \n\nand will get\
    \ a better idea of the rating system used. \n\nUsers will often try to fill out\
    \ a form quickly \\- don't expect them to read long \n\ninstructions before entering\
    \ data, and make the fields as clear as possible. \n\nColors \n\nYou should never\
    \ rely on color alone to convey information to a user, and you must make sure\
    \ that \n\nthere is sufficient contrast between colors used in a site for those\
    \ with visual difficulties or those \n\nusing monochrome displays. If you were\
    \ not aware, color blindness is a common problem, affecting \n\naround 8% of men\
    \ and 0.5% of women. \n\nFor example, you should not use color alone to indicate\
    \ the required fields on a form. In the following \n\nexample (ch.02\\_egll.htm),\
    \ the labels for the mandatory fields Name, 'Phone number, Street number \n\n\
    and name, Suburb, and Post code are in blue, while the label for the optional\
    \ text area for Special \n\ndelivery instructions is in black. However, as you\
    \ can see here, because you're viewing the image in \n\nblack and white you can't\
    \ distinguish the colors. Similarly, to users with monochrome monitors and \n\n\
    those with color blindness it won't be obvious which fields are mandatory. \n\n\
    84"
