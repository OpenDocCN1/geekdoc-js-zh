    \ script when the button gains or \n\nloses focus. \n\nHere's the full list of\
    \ attributes you can use with an <input> element whose type attribute has a value\
    \ of \n\nsubmit, reset, or button: \n\n• name, type, value, size, onclick — which\
    \ we have seen. \n\n• sre, alt \\- which we meet in the next section for use with\
    \ images on buttons. \n\n• disabled, readonly, tabindex, accesskey — which we\
    \ discuss later in the chapter. \n\n• class, dir, id, lang, style, title \\- available\
    \ for most HTML elements. \n\n• onblur, onchange, onfocus, onselect, onclick,\
    \ ondblclick, onkeydown, \n\nonkeypress, onkeyup, onmousedown, onmousemove, onmouseout,\
    \ onmouseover, \n\nonmouseup \\- as before, for associating scripts with these\
    \ events. \n\nUsing Images for Buttons \n\nYou can also use an image instead of\
    \ the standard submit button that a browser renders for you. As \n\nbefore, this\
    \ is done with the <input> element, this time with a type attribute value of image.\
    \ For \n\nexample (ch01\\_eg7 .htm): \n\n<input type=\"image” src=”check. jpg”\
    \ alt=''check\" /> \n\ntype must have a value of image to create a graphical button.\
    \ \n\n21"
