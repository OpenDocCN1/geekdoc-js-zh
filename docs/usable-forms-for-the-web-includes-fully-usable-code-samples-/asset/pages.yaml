    \nForms and ASP \n\nDisplaying Cookie Data \\- orderSummary.asp \n\nIn the final\
    \ page of this example, orderSummary.asp, we retrieve the data from the cookie\
    \ and \n\npresent it to the user. Having written our cookie's values using the\
    \ Response object, we can collect \n\nthem using the Request object. We start\
    \ by retrieving the values back from the cookie and putting \n\nthem into variables:\
    \ \n\n<% \n\nDim strTime, strDel, strStreet, strSuburb, strPostcode \n\nDim strTelcode,\
    \ strTelno, strSpecialinstruct \n\nstrTime \\= Request.Cookies(\"testForm\")(\"\
    time\") \n\nstrDel \\= Request.Cookies(\"testForm\")(\"del\") \n\nstrStreet \\\
    = Request.Cookies(\"testForm\")(\"street\") \n\nstrSuburb \\= Request.Cookies(\"\
    testForm\")(\"suburb\") \n\nstrPostcode \\= Request.Cookies(\"testForm\")(\"postcode\"\
    ) \n\nstrTelcode \\= Request.Cookies(\"testForm\")(\"telcode\") \n\nstrTelno \\\
    = Request.Cookies(\"testForm\")(\"telno\") \n\nstrSpecialinstruct \\= Request.Cookies(\"\
    testForm\")(\"specialinstruct\") \n\n%> \n\nThen we just write the values back\
    \ in a table exactly as we did for the hidden forms: \n\n<table width=\"600\"\
    > \n\n<trxtd>What was in the forms... </tdxtd>You wanted your Pizza</tdx/tr> \n\
    \n<trxtd>Time:</td><td><% \\=(strTime) %></tdx/tr> \n\n... <!— rest of the data\
    \ goes here \\--> \n\n</table> \n\nThe advantages of using cookies are that: \n\
    \n• The resulting ASP pages are simpler than if we had used hidden forms \\- you\
    \ don't get an \n\nincreasing number of hidden form elements to keep track of\
    \ as the user steps through each \n\npage of a form. \n\n• The data from the form\
    \ can be persisted for longer periods of time: for example, if you want to \n\n\
    keep user data on the client and retrieve it each time they visit a site. \n\n\
    The drawbacks of cookies are: \n\n• Some users don't accept cookies (although\
    \ more and more users are coming to realize that \n\nthey're not as dangerous\
    \ as was once perceived). It's a good idea to tell users why you're using \n\n\
    them and what type of information you intend to store in them, and you definitely\
    \ should never \n\nattempt to deceive users about either. \n\n• The user has to\
    \ be on the same machine for the cookie to work if it's persisted for longer than\
    \ \n\nthe length of a visit. \n\n• If the computer is shared, then persisted cookie\
    \ data could be used for different people. \n\n• Cookie files are stored as plain\
    \ text and are not encrypted in any way on the user's system, so \n\nthey are\
    \ not suitable for storing sensitive data. \n\n133"
