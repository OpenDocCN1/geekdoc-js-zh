  md: "![](img/a10b466d6e11a32674cad146197d13d9_354_0.png)![](img/a10b466d6e11a32674cad146197d13d9_354_1.png)\n\
    \nForms in ASP.NET \n\nHere, the ASP.NET module (a file called aspnet\\_isapi.\
    \ dll) is on stand-by to handle them. \n\nTechnically speaking, this module parses\
    \ the contents of the ASPX file. It breaks them down into \n\nseparate commands\
    \ in order to establish the overall structure of our code. Having done this, it\
    \ \n\narranges the commands within a pre-defined class definition, not necessarily\
    \ together and not \n\nnecessarily in the order in which we wrote them. That class\
    \ is then used to define a special \n\nASP.NET Page object, and one of the tasks\
    \ this object then performs is to generate a stream of \n\nHTML that can be sent\
    \ back to IIS, and from here, back to the client. \n\nSo when a page is submitted,\
    \ it is processed by ASP.NET and is then posted back to the client. \n\nPostback\
    \ is a very important concept in .NET, especially with regards to forms. To answer\
    \ our \n\nquestion about how to avoid attempting to validate a blank form, you\
    \ first need to understand what \n\npostback is. \n\nPostback \n\nPostback is\
    \ the process whereby the browser posts information back to the server telling\
    \ the server \n\nto handle the ASP.NET form, and the server handles it and sends\
    \ the resulting HTML back to the \n\nbrowser again. Let's just demonstrate this\
    \ now with an example. This is just a standard HTML page, \n\nand should be saved\
    \ with the .htm suffix. It doesn't matter whether the action attribute is set\
    \ to an \n\nASP or PHP page; the outcome would be the same. \n\n<html> \n\n<head>\
    \ \n\n<title>HTML Lack Of PostBack Example</title> \n\n</head> \n\n<body> \n\n\
    <form method=\"get''> \n\nSelect either A, B or C and click the button at the\
    \ bottom<br /> \n\n<br /> \n\nAcinput type=\"radio\" value=\"a\" name=\"test\"\
    xbr /> \n\nBcinput type=”radio” value=\"b\" name=\"test\"xbr /> \n\nCcinput type=\"\
    radio\" value=\"c\" name=\"test\"xbr /xbr /> \n\n<input type=\"submit\" value=\"\
    Click Me\"> \n\n</form> \n\n</body> \n\n</html> \n\nMake a selection and click\
    \ on the Click Me button \\- after posting the form to itself you will see \n\n\
    the following: \n\n339"
