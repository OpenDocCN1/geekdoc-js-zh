    - upload all \n\nyour files and check everything works as expected. \n\nIn this\
    \ example you've seen how Flash and PHP interact to produce extremely usable forms.\
    \ We've \n\nalso covered a couple of usability points where Flash forms are often\
    \ lacking, namely the tab order and \n\nbeing able to submit the form by pressing\
    \ return. The best thing about this example is that a great deal \n\nof this code\
    \ is reusable however complex your forms get, as you will see in the next example.\
    \ \n\nExample 2 \\- Flight Booking Form \n\nNow we're going to build an advanced\
