  md: "![](img/a10b466d6e11a32674cad146197d13d9_52_0.png)![](img/a10b466d6e11a32674cad146197d13d9_52_1.png)\n\
    \nHTML Forms \n\nAs a result, some developers have been using hidden fields to\
    \ identify a user and maintain information \n\nbetween pages \\- such as shopping\
    \ cart information. They've been used as an alternative to cookies, \n\nbecause\
    \ not all users have cookies turned on in their browsers. However, if you use\
    \ hidden controls to \n\nidentify a user's session (the duration of one user's\
    \ visit to your site), you have to remember that \\- \n\nshould someone look at\
    \ the source of that page \\- they could hijack the session. You'll have to decide\
    \ \n\nwhether security is a priority for how you use hidden controls. While not\
    \ too many hackers will want to get \n\ninto your 'fun quiz' and change your answers,\
    \ or try to change your name and address when you order \n\npizza, they might\
    \ be more interested if, say, bank details were stored in hidden fields. \n\n\
    Be careful what you put in hidden controls. Hidden controls are not really hidden\
    \ \\- you \n\ncan see the content by viewing the source of a web page. \n\nAnother\
    \ common use for hidden controls is on forms that span more than one page. Forms\
    \ can be \n\ndaunting at the best of times, so it's common to split up long forms\
    \ into separate stages. In this case, you \n\nwant to be able to remember all\
    \ the form data until the user reaches the last form, and then you can send \n\
    \nall the data to the database. This saves making a connection and addition to\
    \ the database every time a \n\nuser moves between pages of a form, and it stops\
    \ you getting partial records in the database if the user \n\nleaves the site\
    \ before completing all the forms. \n\nAgain, when using hidden controls to store\
    \ form data, you have to be very careful about the order in which \n\nyou're sending\
    \ the data \\- you'll want to leave sensitive details until the end so that they're\
    \ not continually \n\npassed back and forward. Indeed, if they're the last item,\
    \ they need never be passed in a hidden field. \n\nYou can create a hidden control\
    \ using an <input> element whose type attribute has a value of hidden. \n\nFor\
    \ example, this page contains a hidden form element (ch01\\_egl8.htm): \n\n<form\
    \ name=\"myForm\"> \n\ncinput type=\"hidden\" name=\"userlD\" value=\"usr833255ujk\"\
    \ /> \n\nThis page contains a hidden form element, view source to see its content.\
    \ \n\n</form> \n\nYou don't see it when you load the page, but you can when you\
    \ view the source: \n\n■fM hidden Info \n\n\\_ \\-- .y.  \\-  \n\n\\- \\-\\--\
    \ \\----r~'-'n—  \\- —   / \n\nTbs page contains a bdden form element, view source\
    \ to see its content. \n\nWe'll see more on using hidden form elements in Chapter\
    \ 4. \n\n37"
