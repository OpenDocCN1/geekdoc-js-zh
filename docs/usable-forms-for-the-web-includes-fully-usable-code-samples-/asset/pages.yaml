    If the variable hasn't been created, we create it now and initialize its value\
    \ as 1: \n\nsession\\_register( \"count\" ); \n\n$count \\= 1; \n\n} \n\nOtherwise,\
    \ we increment it. \n\nelse \n\n$count++; \n\nWe get the current page number from\
    \ the URL: \n\n$page \\= explode! , $PHP\\_SELF); \n\n$page \\= explode! $page\\\
