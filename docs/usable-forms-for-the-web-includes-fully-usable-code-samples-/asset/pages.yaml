  md: "![](img/a10b466d6e11a32674cad146197d13d9_16_0.png)![](img/a10b466d6e11a32674cad146197d13d9_16_1.png)\n\
    \nIntroduction \n\nThis book focuses on Forms, and only forms \\- their design\
    \ is a single, vitally important task that \n\nconfronts everyone who builds web\
    \ sites at some point in their career. Forms provide us with a \n\nsimple way\
    \ to collect information from our site's users, so they can register for a newsletter,\
    \ pay for \n\ngoods, or solicit feedback. While some sites need no forms, the\
    \ majority will include at least one. \n\nThe simple truth is, forms must be carefully\
    \ designed with usability in mind. Filling in a form is \n\ngenerally seen as\
    \ a bad thing, a necessary evil (associated with the likes of paying bills, or\
    \ job \n\napplications in the minds of most people), whether they be on paper\
    \ or electronic. It is our job to \n\nmake sure we make the experience as painless\
    \ as possible, otherwise users will find your site to be \n\na much more frustrating,\
    \ annoying, time-wasting experience than expected, and will be likely to go \n\
    \nelsewhere to find the services they desire. \n\nYou doubtless know what we’re\
    \ talking about here. Remember back to those times when you: \n\n• Filled out\
    \ a long order form, only to be told that you had entered something incorrectly,\
    \ but \n\nwere given no clear indication of what needed changing... \n\n• ...better\
    \ still, found that the stupid form hadn't preserved the previously entered data,\
    \ so \n\nyou were forced to fill the whole £$%A\\*£\" thing out again... \n\n\
    • ...and to top it all off, found that the form had been programmed to only accept\
    \ addresses \n\nin the format of the country the site is hosted in (not your country),\
    \ meaning that you \n\ncouldn't order your goods in the first place! \n\nIt is\
    \ about this time that you scream at your poor PC, have another coffee, and decide\
    \ to look \n\nsomewhere else for your desired service. Annoying isn't it? Everyone\
    \ who has used the Internet has \n\nhad an experience to mirror this one, which\
    \ goes to prove that designing and implementing a usable \n\nform on your web\
    \ site is not something to be taken lightly. \n\nIn this book, we'll show you\
    \ how forms are implemented on professional sites, including content \n\norganization,\
    \ data validation, server-side data handling, and much more."
  merge: -1
  pgno: 16
- img_proc: true
  md: "![](img/a10b466d6e11a32674cad146197d13d9_17_0.png)![](img/a10b466d6e11a32674cad146197d13d9_17_1.png)\n\
    \nIntroduction \n\nWe'll walk you through an extensive range of different code\
    \ that can be easily downloaded from \n\nhttp://www.glasshaus.com/and adapted\
    \ to your own needs, taking all the hassle out of coding forms. \n\nBecause of\
    \ the large choice of browsers available to surf the Web, our code has been extensively\
    \ \n\ntested, and designed to work in: \n\n• IE 4+, Netscape 4+, and Opera 5+for\
    \ PC , \n\n• IE 4+, Netscape 6+, and Opera 5+ for Mac \n\nunless specifically\
    \ stated. \n\nThe approaches presented in this book should serve as excellent\
    \ models for your own forms. In \n\nglasshaus books, we aim to keep the concepts\
    \ clear and have a little fun along the way. Don t look \n\nfor too much academic\
    \ posturing. This book is about getting real work done in the real world for the\
    \ \n\nbenefit of real users. If there is anything mentioned in this book that\
    \ you would like to know more \n\nabout, you can probably find something in the\
    \ Resources section at the end of this book. \n\nWho Is This Book For? \n\nThis\
    \ book is for intermediate to advanced Web Professionals. It isn't essential,\
    \ but a reasonable \n\ngrounding in HTML, JavaScript, Flash (for the Flash chapter,\
    \ obviously), and at least the principles of \n\nserver-side scripting and databases\
    \ (for the server-side data-handling sections) is definitely advised \n\nif you\
    \ are to get the most out of this book. \n\nDevelopers will make great use of\
    \ the examples as time savers, avoiding the need to code such \n\nmundane functionality\
    \ themselves. The book also includes a form design chapter, covering the \n\n\
    things you need to look into before you even get to the code, including usability\
    \ and accessibility \n\nhints for form design. \n\nWhat's Covered/Chapter Synopsis\
    \ \n\nThis book basically looks at three fairly distinct areas \\- form design\
    \ principles and coding the front \n\nend (Chapters 1-3), data processing on the\
    \ server (including validation) (Chapters 4-6), and \n\nadvanced and future forms\
    \ (Chapters 7-8). \n\nNote that in addition to the 8 chapters listed below, there\
    \ is also an additional chapter \n\navailable on our web site (in this book's\
    \ site gallery, see below) called Alternative Uses \n\nfor HTML Form Elements,\
    \ in which we look at using HTML form controls not for \n\ntraditional purposes,\
    \ but instead to add some other interesting functions to a web site. \n\nThere,\
    \ we build up the complete code for a clock/calendar, a color picker, a currency\
    \ \n\nconverter, and a calculator. \n\n\\\\ \n\nLet's have a quick look at what\
    \ each chapter in the book goes into: \n\nChapter 1: HTML Forms \n\nThis chapter\
    \ goes through the available HTML form controls in detail, showing what elements\
    \ and \n\nattributes are involved in each case (fully illustrated by examples),\
    \ and how they are used. This will \n\nact as a perfect reference chapter. \n\n\
    2"
