  md: "![](img/a10b466d6e11a32674cad146197d13d9_364_0.png)![](img/a10b466d6e11a32674cad146197d13d9_364_1.png)\n\
    \nForms in ASP.NET \n\nHaving considered the label control, which doesn't mimic\
    \ any particular form control, we can now \n\nmove on to the ASP.NET server controls\
    \ that do provide the functionality of form controls. These \n\nform part of the\
    \ WebControls family within ASP.NET. \n\nThe <asp:dropdownlist> Control \n\nThe\
    \ <asp:dropdownlist> control is one of the best controls for demonstrating the\
    \ usefulness of \n\nhaving a form control processed on the server-side. \n\nBefore\
    \ we move on to the <asp:dropdownlist> control, let's pause to look at the HTML\
    \ form \n\ncontrol equivalent. Drop down listboxes are implemented in HTML using\
    \ the <select> and \n\n<option> tags. For each option, you would have a separate\
    \ opening and closing <option> element \n\ninside the <select> element. A listbox\
    \ can be defined in HTML as follows: \n\n<select name=\"listl\"> \n\n<option>Four\
    \ Cheese</option> \n\n<option>Artichoke and Onion</option> \n\n<option>Margherita</option>\
    \ \n\n</select> \n\nTo create an ASP.NET drop-down list control that did exactly\
    \ the same, you'd need to define it in the \n\nfollowing way: \n\n<asp:dropdownlist\
    \ id=\"listl\" runat=”server\"> \n\n<asp:listitem> Four Cheese </asp:listitem\
    \ \\> \n\n<asp:listitem> Artichoke and Onion </asp:listitem \\> \n\n<asp:listitem>\
    \ Margherita </asp:listitem \\> \n\n</asp:dropdownlist \\> \n\nThere are three\
    \ important differences from the HTML form control: \n\n• The <asp:dropdownlist>\
    \ element directly replaces the <select> element. \n\n• The <asp: listitem> element\
    \ replaces the <option> element. \n\n• The id attribute replaces the name attribute.\
    \ \n\nWith HTML form controls, the name attribute is used to pass the identity\
    \ of the form control to server- \n\nside processing code, such as ASP or PHP.\
    \ The id attribute is used for this purpose in the ASP.NET \n\ncontrol. ASP.NET\
    \ automatically sets id and name to the same values. \n\nThe <asp: dropdownlist>\
    \ control has many attributes to help customize its appearance. We're not \n\n\
    going to describe them here \\- once again you can find out more details using\
    \ the class browser tool. \n\nVisually, the <asp:dropdownlist> control is identical\
    \ to the HTML <select> element, with the size \n\nattribute set to \"1\" \\- it's\
    \ what's going on behind the scenes that is different. The best way to explain\
    \ this is \n\nto look at an example. We’ll create a form that asks the user to\
    \ select the pizza they want: \n\n<script runat=”server\" language=\"vb\"> \n\n\
    Sub Page\\_Load() \n\nIf Page.IsPostBack Then \n\n349"
