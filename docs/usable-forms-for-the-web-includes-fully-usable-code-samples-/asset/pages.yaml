  md: "![](img/a10b466d6e11a32674cad146197d13d9_350_0.png)![](img/a10b466d6e11a32674cad146197d13d9_350_1.png)\n\
    \nForms in ASP.NET \n\nWhen we write a program to run on the .NET Framework, code\
    \ has to be compiled once the \n\npage has been viewed, before the updated data\
    \ can be returned to the user. However, the .NET \n\ncompilers take us to a kind\
    \ of halfway house instead of the usual binary code. It's this binary \n\ncode\
    \ that presents problems to cross-platform portability. Instead, in .NET, the\
    \ code is compiled \n\ninto a special format \\- the MSIL. Some optimization to\
    \ make the code run faster can be done as \n\npart of this process, since the\
    \ MSIL's structure doesn't have to be as easily human-readable as \n\nour original\
    \ code. \n\nWhen we execute this MSIL, we effectively pass it on to the CLR, which\
    \ is really the cornerstone of \n\nthe .NET Framework. Just as the .NET Framework\
    \ lies at the heart of Microsoft's .NET vision, the \n\nCLR lies right at the\
    \ heart of the Framework. Its main purpose is to take care of executing any code\
    \ \n\nthat's been fed into it. The CLR uses another compiler \\- the JIT (Just-In-Time)\
    \ compiler \\- to \n\ncompile to true machine code, and make any last minute,\
    \ machine-specific optimizations to the \n\nprogram, so that it can run as quickly\
    \ as possible on the specific machine it inhabits. Most \n\nimportantly, MSIL\
    \ itself is not at all machine-specific, so we can execute it on any machine that\
    \ has \n\nthe CLR installed. In essence, once we've written some .NET code and\
    \ compiled it, we can copy it to \n\nany machine with the CLR installed, and execute\
    \ it there. \n\nMSIL can also be generated from any human-readable language with\
    \ a compatible structure. \n\nVB.NET, C#, and JScript.NET are all \".NET-compliant”\
    \ languages; that is, they conform to a \n\nCommon Language Specification that\
    \ guarantees they can be faithfully compiled to MSIL. We can \n\nuse these or\
    \ any other compliant languages interchangeably within our applications as, once\
    \ a set of \n\nfiles have been compiled to MSIL, they're all effectively written\
    \ in the same language! \n\nGetting ASP.NET Running \n\nHaving introduced .NET\
    \ in the briefest possible way, we'll focus on the part that concerns us, \n\n\
    ASP.NET, and how we can get that working. To get ASP.NET up and running, there\
    \ are three \n\nprerequisites. \n\n• A compatible web server must be installed,\
    \ and at the moment the only web server in \n\nproduction that will run ASP.NET\
    \ is Microsoft's IIS (only versions 5 and above). However \n\nASP.NET is intended\
    \ to be web server-independent, so expect other future web servers to \n\nbe able\
    \ to run ASP.NET as well. Still, with only IIS available at the moment, we shall\
    \ \n\nassume you are using IIS. IIS comes as part of the installation for both\
    \ Windows 2000 and \n\nWindows XP Professional. IIS version 5.0 comes with Windows\
    \ 2000 and IIS version 5.1 \n\nwith Windows XP Professional. \n\n• Next, before\
    \ you can install the .NET Framework, you will need to install the Microsoft Data\
    \ \n\nAccess Components (MDAC) version 2.6 or later. This is a set of components\
    \ that will \n\nenable you to use ASP.NET to communicate with databases and display\
    \ the contents of \n\nyour database on a web page. If you have an earlier version\
    \ installed (like 2.5 which came \n\nwith Windows 2000) then, unless you've already\
    \ done so, you'll need to upgrade to 2.6 \n\nbefore you can run ASP.NET. The Microsoft\
    \ Data Access Components is a small download \n\n(roughly 5 or 6 MB) available\
    \ for free from Microsoft's site at \n\nhttp://www.microsoft.com/data, and the\
    \ installation for MDAC 2.7 is pretty straightforward \n\n(it's also included\
    \ as part of the Framework installation). \n\n• Lastly you need to install .NET\
    \ Framework Redistributable or .NET Framework SDK (both \n\nof which contain ASP.NET).\
    \ These are freely downloadable from the site \n\nhttp://www. asp.net. \n\n335"
