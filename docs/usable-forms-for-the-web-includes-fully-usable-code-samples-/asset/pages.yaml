  md: "![](img/a10b466d6e11a32674cad146197d13d9_259_0.png)![](img/a10b466d6e11a32674cad146197d13d9_259_1.png)\n\
    \nChapter 6 \n\nPutting it all together with the addition of beginning and ending\
    \ points, we define a regular expression to \n\nuse in JavaScript validation as:\
    \ \n\nvar emailFormat=/A\\\\w(\\\\.?\\[\\\\w-\\])\\*@\\\\w(\\\\.?\\[\\\\w-\\])\\\
    *\\\\.\\[a-z\\]{2,6}(\\\\.\\[a-z\\]{2})?$/i, \n\nSince e-mail addresses aren't\
    \ case-sensitive, we can use \\[a-z\\] in place of \\[a-zA-z\\] and add the i\
    \ flag \n\nafter the trailing slash to save ourselves a bit of space. \n\nIf we\
    \ want to provide more specific guidance to our user in the event of errors, we\
    \ can use portions of the \n\nabove regular expression or define some shorter\
    \ ones with which to perform more exact tests on \n\nwhatever was entered by the\
    \ user, for example: \n\nvar atSign=/A.+@.+$/; \n\nif(!atSign.test(emailAddress))\
    \ \n\nalert(\"An email address must contain an @ sign somewhere in the middle.\"\
    ); \n\nvar endDot=/\\\\ . $/; \n\nif(endDot.test(emailAddress)) \n\nalert(\"An\
    \ email address can\\\\1t end with a dot.\"); \n\nvar beginDot=/^\\\\./; \n\n\
    if(beginDot.test(emailAddress)) \n\nalert(\"An email address can\\\\'t begin with\
    \ a dot.\"); \n\nvar endTLD=/\\\\.\\[a-z\\]{2,6}(\\\\.\\[a-z\\]{2})?$/i; \n\n\
    if(!endTLD.test(emailAddress)) \n\nalert(\"An email address must end with a valid\
    \ top level domain.\"); \n\nOf course, this still isn't 100% foolproof; for instance,\
    \ somebody could enter joebiow@server.xyz and \n\nhave it validated. But it should\
    \ serve to catch the most common sorts of errors, such as leaving out the @ \n\
    \nsign, using invalid characters, omitting the domain and TLD (a recurring problem\
    \ with users of some large \n\nonline services such as AOL, who have only to enter\
    \ screen names in order to address e-mail to other \n\nusers of the same service),\
    \ and so on. \n\nBefore we leave the topic of regular expressions for client-side\
    \ validation, we'd like to show you one \n\nadditional application using another\
    \ JavaScript method, which can be used to strip out or replace \n\nunwanted characters.\
    \ This can be useful especially where users are entering amounts of money and\
    \ you \n\nwant to get rid of dollar or pound signs and commas before performing\
    \ calculations. Here's a basic \n\nexample, a sales tax calculator: \n\n244"
