  md: "![](img/a10b466d6e11a32674cad146197d13d9_238_0.png)![](img/a10b466d6e11a32674cad146197d13d9_238_1.png)\n\
    \nForm Validation Techniques \n\n\"You think you've made something idiot-proof...\
    \ and then God just makes a better idiot.\" \n\n\\-Anonymous Poster at Builder\
    \ Buzz. \n\nSo far, we've looked at how to create HTML and Flash forms and how\
    \ to use them in some common web \n\nprogramming environments, both for transferring\
    \ data between different pages of a site and for \n\ntransmitting data from the\
    \ user to a store on the server. However, we've barely touched on a very \n\n\
    important question that arises just as soon as we deploy a web application into\
    \ the real world. Contrary to \n\nthe tacit assumption we've been making until\
    \ now, users are not perfect, and are liable to make mistakes \n\nin entering\
    \ data. They may leave essential fields blank, enter numbers in fields expected\
    \ to receive letters \n\nonly, use characters that will cause errors when we try\
    \ to store them or echo them back in a subsequent \n\npage, or otherwise supply\
    \ us with bad data. \n\nThere are, of course, some errors that we simply can't\
    \ prevent \\- for instance, if a user enters a \n\ntelephone number containing\
    \ an incorrect digit, there's not much we can do about it. However, we can \n\n\
    keep the user from entering letters where there should be only numbers, or skipping\
    \ the telephone \n\nnumber field altogether. In more technical terms: we can't\
    \ eliminate semantic errors, but we can \n\nprevent syntactic ones. \n\nIn addition,\
    \ as we'll discuss later on, some users may not be visiting our sites in good\
    \ faith, but are instead \n\ntrying to cause errors quite deliberately in hopes\
    \ of breaching the security of our servers and databases. \n\nOnce again, there\
    \ are steps we can take to minimize this possibility. By validating user input,\
    \ we may not \n\nbe able to guarantee that all user-entered data is perfectly\
    \ free from errors, but we can at least guarantee \n\nthat it meets certain minimal\
    \ criteria and that users can't submit forms containing missing, completely \n\
    \nnonsensical, or even hazardous data. \n\nIn this chapter we'll discuss a number\
    \ of different programming techniques we can use to maximize the \n\naccuracy\
    \ of form data, and where we can intercept bad data during the data-entry process\
    \ before it can \n\ncause problems on the server or be committed to a datastore.\
    \ We'll look at programming techniques to \n\nhandle strings and numbers in all\
    \ three of the languages we've used thus far (JavaScript, PHP, and \n\nVBScript)\
    \ to deal with several common problems, including:"
