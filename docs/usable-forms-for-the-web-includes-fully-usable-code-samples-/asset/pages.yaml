    \nChapter 5 \n\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"\
    \ \n\n\"http://www.w3.org/TR/html4/loose.dtd\"> \n\n<html> \n\n<head> \n\n<meta\
    \ http-equiv=\"Content-Type\" content=\"text/html; charset=iso-8859-l\" /> \n\n\
    <title>What's Your Favorite Cheese, Please?</t,itle> \n\n</head> \n\n<body bgcolor=\"\
    #FFFFFF\" text=\"#000000\"> \n\n<p>Name of Customer: <b><?php echo $cust\\_name;\
    \ ?></bx/p> \n\n<p>Preferred Cheese: <bx?php echo $cheese; ?x/bx/p> \n\n</body>\
    \ \n\n</html> \n\nAnd here's what our user sees before (left) and after (right)\
    \ submitting the page: \n\nLike ASP, PHP can be mixed in with the HTML or other\
    \ code used in a web page. It's often marked as \n\nsuch with the <?php and ?>\
    \ delimiters, which indicate the beginning and end of the PHP scripting \n\ncode.\
    \ Actually, there are four ways in which you might see PHP escaped from the surrounding\
    \ HTML: \n\n• As an XML processing instruction, <?php echo $my\\_name; ?>, as\
    \ we've already seen. This \n\nfacilitates making your PHP pages XML-compliant.\
    \ \n\n• As an SGML-style processing instruction, <? echo $my\\_name; ?>, which\
    \ is also very common. \n\nThis is also XML-compliant; however, it's preferable\
    \ to use the above, since this form doesn't \n\nspecify to an XML parser how its\
    \ contents should be handled. \n\n• By using a script block, <script language=\
    \ \"php\" \\>echo $my\\_name; </script>, which \n\nis a bit more verbose and not\
    \ nearly so common, but which may be more familiar to'borne \n\ncoders as this\
    \ is also used in client-side scripting and in some server-side scripting \n\n\
    environments including Netscape Server-Side JavaScript and (optionally) ASP. \n\
    \n• By using ASP-style delimiters <% echo $my\\_name; %>. Unlike the previous\
    \ three methods, this \n\nis not supported by default; the PHP interpreter must\
    \ be configured to recognize it. Our \n\nrecommendation is that you don't use\
    \ these, as it precludes running PHP and ASP on the same \n\nserver. If you wish\
    \ to do so anyway, and these delimiters are not already enabled for your \n\n\
    server, see the PHP Manual for instructions or consult your server administrator."
