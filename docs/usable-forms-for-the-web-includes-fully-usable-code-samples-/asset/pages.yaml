    \nDesigning Usable Forms \n\nHowever, it's fine to use color in combination with\
    \ other methods to further highlight points that are \n\nclear without color.\
    \ In the following screenshot (ch02\\_egl2 .htm), we have red asterisks next to\
    \ the \n\nmandatory fields, but the absence of color doesn't impede our understanding\
    \ because the asterisk is \n\nstill clearly visible: \n\nA good way of testing\
    \ this is to change the colors on your monitor and make sure that all of the \n\
    \ninformation you are putting across to the user is still clear. \n\nContrast\
    \ also needs to be sufficient for those with color difficulties. If the depth\
    \ of two colors is too \n\nsimilar, users won't be able to differentiate between\
    \ the different colors. You can test this by simply \n\nturning down the contrast\
    \ of your monitor. \n\nShading of Multiple Rows in Tables \n\nFor those who have\
    \ no problems seeing color, another helpful technique when creating multiple rows\
    \ \n\nof information from which you expect users to select an option, is to highlight\
    \ alternate rows to make \n\nthe rows more easily distinguishable. This is easily\
    \ done using CSS by adding a class attribute to \n\neach row, like so: \n\n85"
