    \ for passing data between pages and maintaining state. Now we'll put these techniques\
    \ \n\ntogether and look at the sample pizza application in detail. \n\nIn our\
    \ application, we'll be using the ASP Session object to store a user's delivery\
    \ data and their \n\nshopping basket. \n\nBefore you use the sample application\
    \ code on your own machine, you must change the file path in \n\nthe inc\\_connect.\
    \ asp file to point your database. \n\nLogin Page \n\nWhen the user wants to order\
    \ pizza, they are asked to log in to the Pizza This application. The login \n\n\
    page is called orderl.asp. This page not only acts as the form that lets the user\
    \ log in, but also \n\ndoes the work of checking their login details with the\
    \ database. \n\nThe idea behind the page is to: \n\n• Check whether the Form collection\
    \ of the Request object has a value for username. \n\n• If not, present them with\
    \ the login page. \n\n• Otherwise, try to use that data to log them in. \n\n(This\
    \ page also gives the option for new users to register with the application using\
    \ \n\nregister .asp, which we met in the section on storing form data in a database.)\
    \ \n\n© Order Pizza! \n\nas \n\nView Source \n\noviUne; order tid# \n\nPlease\
    \ log in or register... Step 1 of 6 \n\nIf you are already registered, please\
    \ log in: \n\nUser name \\* ftestuser \n\nPassword\\* |™H ^(\\-)^)^ \n\nLoginj\
    \ \\[ Clear) \n\nIf you have not yet registered, you need to register now! \n\n\
    ■ \n\n143"
