  md: "![](img/a10b466d6e11a32674cad146197d13d9_110_0.png)![](img/a10b466d6e11a32674cad146197d13d9_110_1.png)\n\
    \nFlash Forms \n\nIt's almost exactly the same as if you had typed the above ActionScript\
    \ into a frame on your timeline. \n\nFlash creates a new variable called message\
    \ with the value \"Address not valid.\" and a new \n\nvariable called returnVal\
    \ with the value error! \n\nThis means that you can then check against these variables\
    \ and tell your Flash movie to act \n\naccordingly. In this case we would first\
    \ check that returnVal has a value. As this was the last \n\nvariable sent by\
    \ the PHP, we can then safely assume that all variables have been received. \n\
    \nFlash Form Elements \n\nBefore we dive in and start putting all this together\
    \ in our example exercises, let's have a quick look \n\nat the form elements that\
    \ come with Flash 5 (available by going to the Window menu, then Common \n\nLibraries\
    \ \\-> smartdips). We'll also take a look at the elements that you don't get with\
    \ it. \n\nThe Checkbox \n\nTo use the checkbox element, drag an instance of it\
    \ from the smartClips library onto the stage and \n\nopen the Clip Parameters\
    \ panel. You'll see four parameters to set in here, in order of appearance: \n\
    \n• \\_name \\- this is the variable name that you want your checkbox to have.\
    \ \n\n• checked \\- whether the checkbox should be initially checked or not. \n\
    \n• label \\- the text to inform the user of the checkbox's use. \n\n• style \\\
    - the look of the checkbox, Mac, Win or Auto. \n\nThe List Menu \n\nOnly two parameters\
    \ for this one: \n\n• items \\- an array of items that you want to appear in the\
    \ menu. \n\n• style \\- as before, Mac, Win, or Auto. \n\nThe Radio Button \n\n\
    The same parameters as for a Flash checkbox: \n\n• \\_name \\- this is the variable\
    \ name that you want your radio button to have. \n\nchecked \\- whether the radio\
    \ button should be initially selected or not. \n\nlabel \\- the text to inform\
    \ the user of the radio button's use. \n\nstyle \\- the look of the radio button,\
    \ Mac, Win or Auto. \n\n95"
