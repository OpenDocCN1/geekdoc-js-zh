    \ we \n\neither add additional information to the error message and set the value\
    \ of Validated to false (in case \n\nit isn't already), or we do nothing. In either\
    \ case, we proceed through all the variables we created using \n\nExecute ( \"\
    Dim \" & Requirements (Count) ) prior to the beginning of the For Each loop, testing\
    \ \n\ntheir values and performing the appropriate regular expression tests for\
    \ those that are true, until we've \n\ngone through the list. Then we do the same\
    \ thing using the name and value for the next item in the \n\nRequest. Form collection\
    \ until we've gone through all of those items. \n\nIf Required \\= True Then \n\
    \nIf FieldValue \\= \"\" Or NotWhitespace.Test(FieldValue) \\= False Then \n\n\
    ErrMsg \\= ErrMsg & \"No response for the required <b>\" & \\_ \n\nFieldName(O)\
    \ & \"</b> field.<br />\" & vbCrLf \n\nValidated \\= False r \n\nEnd If \n\nEnd\
    \ If \n\nIf Alphabetic \\= True Then \n\nIf FieldValue <> \"\" And NotAlpha.Test(FieldValue)\
    \ \\= True Then \n\nErrMsg \\= ErrMsg & \"Illegal characters in the <b>\" & \\\
    _ \n\nFieldName(0) & \"</b> field.<br />\" & vbCrLf \n\nValidated \\= False \n\
    \nEnd If \n\nEnd If \n\nIf Address \\= True Then \n\nIf FieldValue <> \"\" And\
    \ NotAddress.Test(FieldValue) \\= True Then \n\nErrMsg \\= ErrMsg & \"Invalid\
    \ address format in <b>\" & \\_ \n\nFieldName(0) & \"</b>.<br />\" & vbCrLf \n\
    \nValidated \\= False \n\nEnd If \n\nEnd If \n\nIf Alphanumeric \\= True Then\
    \ \n\nIf FieldValue <> \"\" And NotAlphanumeric.Test(FieldValue) \\= True Then\
    \ \n\nErrMsg \\= ErrMsg & \"Illegal characters in the <b>\" & \\_ \n\nFieldName(0)\
    \ & \"</b> field.<br />\" & vbCrLf \n\nValidated \\= False \n\nEnd If \n\nEnd\
    \ If \n\nIf Nospace \\= True Then \n\nIf FieldValue <> \"\" And HasSpaces.Test(FieldValue)\
    \ \\= ^(True)^ ^(Then)^ \n\n289"
