  md: "![](img/a10b466d6e11a32674cad146197d13d9_157_0.png)![](img/a10b466d6e11a32674cad146197d13d9_157_1.png)\n\
    \nChapter 4 \n\nThis example shows how we can connect to a database when working\
    \ with form data. You will see it \n\nin action in the application shortly. \n\
    \nSummarizing Dealing with Form Data \n\nWe've just looked at four different ways\
    \ of dealing with form data in ASP applications: passing data \n\nbetween pages\
    \ in hidden form elements; storing form data in cookies; storing form data in\
    \ ASP's \n\nSession object; and storing data in a database. \n\nThe examples we\
    \ looked at showed some common ways of dealing with form data while maintaining\
    \ \n\nstate in your applications and remembering some of the information that\
    \ a user has provided. Of \n\ncourse, each is more or less suitable for different\
    \ tasks. \n\nUsing hidden form fields to pass data between pages is very popular\
    \ for keeping track of small \n\namounts of data. It has the additional advantages\
    \ that it neither requires that the client use cookies \n\nnor requires memory\
    \ on the server (as is the case with the Session object). However, it can \n\n\
    become complicated if you have to deal with several variables and it's not suitable\
    \ if you're passing \n\nsecure data. \n\nAt the other end of the scale, if you\
    \ want to persist all the information you receive from a client, you \n\ncan store\
    \ all the form data in a database. However, database connections can be an expensive\
    \ \n\nresource for the server to maintain. Connecting to the database each time\
    \ a user completes a \n\nsection of a form that spans several pages might not\
    \ be the best choice. An alternative is to use one \n\nof the other three methods\
    \ to remember what the user has entered and then just connect to the \n\ndatabase\
    \ once the user has finished the forms. \n\nIn the short term, such as a browser\
    \ session, cookies can be ideal for storing small amounts of data. \n\nHowever,\
    \ if you want to make sure that you retain user data, you can't rely on a cookie\
    \ storing that \n\ninformation over long periods of time. In the longer run, cookies\
    \ are ideal for storing identification \n\ncodes that allow the application to\
    \ connect to a database and retrieve the user's data. If you want to \n\nget around\
    \ the problem of missing cookies (say, if they've been deleted or the user is\
    \ on a different \n\ncomputer) or allow for different users accessing the site\
    \ from the same computer, you can allow your \n\nusers to opt to log on to retrieve\
    \ data instead of relying on data that's stored in a cookie. \n\nUsing a cookie\
    \ to store user information during a visit to a site, however, requires that you\
    \ send the \n\ndata back and forth before you store it. For example, once a user\
    \ has completed a form, the data is \n\nsent to the server, which then writes\
    \ it back to the client in the form of a cookie, and the server will \n\nthen\
    \ have to ask for it back again when it needs to retrieve the data. \n\nAn alternative\
    \ to this is the ASP session, which will remember a user's data for as long as\
    \ you define \n\nthe session duration \\- if the user interacts with the server,\
    \ the session is maintained. This works very \n\nwell for storing small amounts\
    \ of data on sites that don't have huge amounts of traffic. The \n\ndisadvantages\
    \ are that it requires server memory to store the data and this method is not\
    \ easy to \n\nimplement on server farms \\- as just one server is storing the\
    \ data in the session. If yoi^ are using \n\nsessions, they should be used sparingly.\
    \ \n\nSo, let's have a look at the sample application that makes use of some of\
    \ the techniques we've seen \n\nso far in this chapter. \n\n142"
