    \nChapter 2 \n\nDrop-down Menus and Select Boxes \n\nDrop-down menus save space\
    \ on the screen when there are more than a few options. However, you \n\nshouldn't\
    \ make the options too long (the optimum length will depend on the layout of your\
    \ form, but \n\npreferably no longer than around 30 characters, unless it's guaranteed\
    \ to fit on the screen). If the \n\ntext goes off the screen \\- as in the previous\
    \ screenshot \\- it becomes hard to navigate. \n\nIt's worth noting that many\
    \ users are not aware that they can select items from a drop-down list with \n\
    \narrow keys or using the first character of the item if alphabetically sorted.\
    \ Therefore, they use a \n\npointing device to select an item from a menu \\-\
    \ which can require them to switch from the keyboard \n\nif the option is among\
    \ text inputs. \n\nYou should be careful to include options for all users. For\
    \ example, if you have a list of US states, do \n\nyou need to provide an option\
    \ for those not in the US? \n\nOrdering of items in a menu should reflect a user's\
    \ experience. For example, if you're using days of \n\nthe week or months of the\
    \ year, put them in chronological order. If there isn't a typical way of relating\
    \ \n\nthis information, then alphabetical lists are often the best approach. If\
    \ there are a few options that \n\nare a lot more common than others, you should\
    \ consider putting those at the top so that users don't \n\nhave to scroll through\
    \ a huge list of items; for example, many US sites put the US at the top of a\
    \ list \n\nof countries. \n\nIf you have to present a lot of options, consider\
    \ using hyperlinks or radio buttons instead. For \n\nexample, here's a long list\
    \ of countries. The list contains over 240 options, which makes for a very \n\n\
    long and hard to navigate drop-down. The preferable option is to use links \\\
    - here, countries are \n\nlinked to and grouped by the letter that they begin\
    \ with (ch02\\_eg2 .htm): \n\n| Select country: \n\nSelect a country using the\
    \ following links; \n\nA|B|C|D|E|F\\[G|H|I|J|KILIMINIOIPIOIRISITIUIVIWIYIZ \n\n\
    A \n\nAndorra \n\nUnited Arab Emirates \n\nAfghanistan \n\nAntigua and Barbuda\
    \ \n\nAnguilla \n\nAlbania \n\nArmenia \n\nNetherlands Antilles \n\nAngola \n\n\
    Antarctica \n\nArgentina \n\nAmerican Samoa \n\nAustria \n\nAustralia \n\nAruba\
    \ \n\nAzerbaijan \n\n68"
