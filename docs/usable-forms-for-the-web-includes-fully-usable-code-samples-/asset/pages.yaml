  md: "![](img/a10b466d6e11a32674cad146197d13d9_108_0.png)![](img/a10b466d6e11a32674cad146197d13d9_108_1.png)\n\
    \nFlash Forms \n\nIntroduction \n\nHTML forms are great. With a little bit of\
    \ CSS they can even be made to look nice, so why use Flash \n\nfor your forms?\
    \ The most obvious reason is that you might be developing a pure Flash site; in\
    \ this \n\ncase you really don't want to have to pop up an HTML form in a new\
    \ window (honestly, I have \n\nactually seen this). Less obvious is the fact that\
    \ Flash forms are extremely powerful, fast and most of \n\nall, give you complete\
    \ control over the look of your form. These features are valid whether it is a\
    \ \n\nFlash site or an HTML site that you are developing. \n\nOne of the nicest\
    \ features of Flash forms is that you are able to get feedback from your server-side\
    \ \n\nscripts without the page having to reload. The script results are sent directly\
    \ back to the Flash movie \n\nrather than output as a new HTML page back to the\
    \ browser. Usability-wise this is a huge bonus \\- if \n\nthe user enters an invalid\
    \ e-mail address, your back end can send this information back to the Flash \n\
    \nform, and the Flash form can then highlight the invalid address and display\
    \ a message to inform the \n\nuser that they have made a mistake. This can all\
    \ take place in under a second, a vast improvement \n\non HTML where a new page\
    \ has to be loaded with the error message and the user then has to click \n\n\
    their back button to reload the previous page to renter their details. \n\nThese\
    \ things might be making you wonder why you ever use HTML for forms. Well, it's\
    \ not all rosy \n\nwith Flash forms \\- there are limitations too. To start with,\
    \ Flash 5 doesn't come with all your standard \n\nform controls \\- some of them\
    \ you will have to make yourself. There are also some small usability \n\nissues\
    \ with Flash forms, for instance Flash does strange things to the tab order of\
    \ your input fields. \n\nWhile Flash MX does at least provide you with some ready\
    \ built components, the code for these is \n\nMX-specific. This means you can't\
    \ use them in a Flash movie that you want viewable by people with \n\nthe Flash\
    \ 5 plug-in so in this chapter we are going to be building our own. All the code\
    \ in this \n\nexercise is backward-compatible with Flash 5. \n\nMost of the problems\
    \ with Flash forms can be worked around, some of them very easily, but there is\
    \ \n\nhowever one thing that is simply not possible with Flash forms \\- uploading.\
    \ In an HTML form this is \n\nsimply a case of including <input type=\"file,,\\\
    >, which produces a form field with a browse \n\nbutton next to it allowing the\
    \ user to select a file from their hard drive. Flash unfortunately has no \n\n\
    equivalent for this at the time of writing, although tight integration with future\
    \ versions of ColdFusion \n\nis almost certainly going to bring this feature to\
    \ Flash."
