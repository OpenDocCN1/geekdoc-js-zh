- img_proc: true
  md: "![](img/a10b466d6e11a32674cad146197d13d9_367_0.png)![](img/a10b466d6e11a32674cad146197d13d9_367_1.png)\n\
    \nChapter 8 \n\nIf you look up the drop-down list control in the class browser,\
    \ you can see that the control has a \n\nSelecteditem property (properties correspond\
    \ directly with attributes). We could reference this \n\nattribute of our drop-down\
    \ control as follows in the ASP.NET code: \n\nlistl.Selecteditem » \n\nHowever,\
    \ the Selecteditem is a class in its own right and has properties of its own,\
    \ and to return \n\nthe actual text associated with the list item, you need to\
    \ reference a property of Selecteditem, \n\ncalled Value. This then returns the\
    \ text associated with the selected <asp:listitem> element. \n\nSo what the whole\
    \ code does is perform a test for a Boolean value using isPostBack, and if the\
    \ \n\npage hasn't been posted back then it executes the contents of the if. .\
    \ . then structure. The line: \n\nMessage.text \\= \"You have selected \" & listl.Selecteditem.Value\
    \ \n\nsets the <asp: label> called Message to contain the message “ You have selected'\
    \ along with the \n\ntext associated with the radio button the user had just selected.\
    \ \n\nThe great thing about this format is that we don’t have to worry about initializing\
    \ or declaring listl; \n\nwe just assign the ID to our server control: \n\n<asp:dropdownlist\
    \ id=\"listl\" runat=\"server\"> \n\nand then we can reference it in all our ASP.NET\
    \ code on that page. This doesn't just apply to the \n\ndrop-down list control,\
    \ but all server controls. Let's take a look at another one now. \n\nThe <asp:listbox>\
    \ Control \n\nThe <asp: listbox> is very much related to the <asp:dropdownlist>\
    \ control. We mentioned the \n\nHTML form control <select> that creates drop-down\
    \ listboxes \\- well, the <asp: listbox> is a \n\nserver-side equivalent of using\
    \ the <select> tag with the size attribute set to the maximum number \n\nof options\
    \ that will be displayed at the same time. In fact the only differences with this\
    \ control are the \n\nfacts that it doesn't drop down and that it is capable of\
    \ multiple selections. \n\nThe <asp: listbox> has the following format: \n\n<asp:listbox\
    \ id=\"listl\" runat=\"server\"> \n\n<asp:listitem>Four Cheese</asp:listitem \\\
    > \n\n<asp:listitem>Artichoke and Onion</asp:listitem \\> \n\n<asp:liptitem>Margherita</asp:listitem\
    \ \\> \n\n</asp:listbox> \n\ni \\\\ \n\nIn the ASP.NET code the <asp: listbox>\
    \ element now replaces the <asp:dropdownlist> \n\nelement, but the <asp: listitem>\
    \ element, which delimits each of the listbox options, is the same \n\nfor both\
    \ controls. \\- . \n\nThe attribute that allows this is the selectionmode attribute,\
    \ which is used to determine whether \n\nyou can select multiple or only select\
    \ single items from the listbox. By default it is set to single, but \n\nyou do\
    \ have the option of using multiple select. It can be set as part of the <asp:\
    \ listbox> \n\nattributes as follows: \n\n352"
