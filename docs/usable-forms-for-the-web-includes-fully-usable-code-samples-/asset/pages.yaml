    \nChapter 6 \n\nelse \n\n{ \n\n// calculation code goes here... \n\nform.salestax.value=taxamount;\
    \ \n\n} \n\n} \n\n} \n\nHere are a few more uses of regular expressions: \n\n\
    • To strip out unwanted leading whitespace, we could use something like //'\\\\\
    s+/, and to strip \n\nout trailing white space, /\\\\s+$/. \n\n• To validate a\
    \ date from the 20,h or 21st Century in the form Mmm dd, yyyy (three-letter \n\
    \nabbreviation for the month, first letter capitalised, comma after the day, four-digit\
    \ year beginning \n\nwith 19 or 20, all groups separated by spaces): \n\n/A \\\
    [A\\-z\\] \\[a-z\\] {2} \\[1-3\\] ?\\\\d\\\\, (19 I 20) \\\\d{2}$/. (If you're\
    \ not concerned with \n\nenforcing capitalisation, just use /A \\[a-zA-z\\] {3}\
    \ \\[1-3\\] ?\\\\d, (19|20)\\\\d{2}$/.) Note that \n\nan expression in the form\
    \ (abc|xyz) means \"abc orxyz\". \n\n• To validate a date from the 20th or 21st\
    \ Century in the form mm-dd-yyyy (all digits): \n\n/- \\[0-1\\] ?\\\\d- \\[0-3\\\
    ] ?\\\\d- (19 I 20) \\\\d{2}$/ (Note that this does not preclude someone \n\n\
    entering all zeroes for the month and day, for example 00-00-2003. You'll need\
    \ to test for this \n\nseparately.) \n\n• To validate a field containing a first\
    \ and last name with optional middle initial (with or without a \n\nperiod): /\\\
    *\\\\vr+\\\\s (\\\\w\\\\ . \\\\s?) ?\\\\w+$/ (begins with one or more word characters,\
    \ followed by a \n\nspace followed by an optional group which consists of a word\
    \ character, an optional period, and \n\na space, and ends with one or more word\
    \ characters). \n\n• To validate a US Social Security number: //'\\\\d{3}-\\\\\
    d{2}-\\\\d{4}$/ (begins with a group of 3 \n\ndigits, followed by a dash, followed\
    \ by a group of 2 digits, followed by another dash, ends with a \n\ngroup of 4\
    \ digits). \n\nThere's a lot more that can be done with regular expressions, and\
    \ we've just barely scratched the surface \n\nhere. Whole books could be and have\
    \ in fact been written about how to use RegExps. We've listed a \n\ncouple in\
    \ the References section at the end of the book and we encourage you to look at\
    \ one or more of \n\nthem if you'd like to learn more. \n\nNon-Text Inputs \n\n\
    The other big problem with users filling out Web-based forms is when they forget\
    \ to make a choice from a \n\nset of options in a <select> element, from among\
    \ a group of radiobuttons, or at least one of a group of \n\ncheckboxes. Let's\
    \ look at each of these in turn. \n\n<select> and <option> Elements \n\nHere's\
    \ a typical <select> / <option> group with a figure showing its desired behavior\
    \ and the HTML \n\nthat creates the element itself in the page: \n\n246"
