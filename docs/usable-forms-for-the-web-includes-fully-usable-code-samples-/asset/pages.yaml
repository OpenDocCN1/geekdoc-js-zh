  md: "![](img/a10b466d6e11a32674cad146197d13d9_314_0.png)![](img/a10b466d6e11a32674cad146197d13d9_314_1.png)\n\
    \nAdvanced Client-side Form \n\nScripting \n\nIn this chapter, we'll be examining\
    \ how to use some clever client-side scripting to enhance form \n\nusability (for\
    \ example, retrieving information from forms), and some ways of working with these\
    \ \n\nvalues. We'll then look at some ways of changing the contents and the disabled\
    \ properties of form \n\ncontrols themselves using script. \n\nWe have chosen\
    \ to use JavaScript as our scripting language \\- it is the most \n\npopular client-side\
    \ scripting language, and users wishing to use other client-side \n\nlanguages\
    \ (such as VBScript or JScript) can still benefit from the techniques \n\ndemonstrated\
    \ here. \n\nWe'll start by looking at how we can access form controls and values\
    \ that users enter into those \n\ncontrols. Then we'll go on to look at the different\
    \ types of form controls and how we can manipulate \n\nthem using script. \n\n\
    The examples in this chapter demonstrate how we can make forms more usable by\
    \ incorporating \n\nscripts that are triggered by events fired when the user interacts\
    \ with a form. They show the power \n\nand flexibility of using JavaScript in\
    \ your forms and demonstrate popular tasks that you can use \n\nstraightaway or\
    \ tailor to your own needs. In later examples, we'll also see how to handle browsers\
    \ \n\nthat don't support JavaScript or that don't have it enabled, allowing the\
    \ forms to degrade gracefully \n\nfor those users."
