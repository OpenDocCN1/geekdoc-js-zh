- img_proc: true
  md: "![](img/a10b466d6e11a32674cad146197d13d9_349_0.png)![](img/a10b466d6e11a32674cad146197d13d9_349_1.png)\n\
    \nChapter 8 \n\nA Brief Introduction to .NET \n\nWe could spend a whole book discussing\
    \ what .NET is, but to ensure we don't stray too far off the \n\ntopic of this\
    \ chapter and book, we'll keep the definition very brief. .NET is a term that\
    \ describes \n\nMicrosoft's core strategy, plans, and vision for the foreseeable\
    \ future. At the heart of this strategy is \n\nthe freely available software known\
    \ as .NET Framework, which provides the core technology that \n\nunderpins it\
    \ all. It will be followed in the future by web services, software and a whole\
    \ host of other \n\ncomponents, applications and SDKs, but the .NET Framework\
    \ can be viewed as the opening salvo of \n\nthe onslaught. It is designed for\
    \ use not just with current and future operating systems such as \n\nWindows XP,\
    \ 2000, and the forthcoming Windows.NET Server, but also to be backward compatible\
    \ \n\nwith previously released systems such as Windows NT 4.0. However, the functionality\
    \ for previous \n\nWindows versions is much reduced, and the vital cornerstone\
    \ we will rely on for this chapter, \n\nASP.NET, is crucially not present in those\
    \ releases. \n\n.NET has been designed to help solve many fundamental problems\
    \ faced by programmers, such as \n\nthe need for code to be portable between platforms\
    \ and for application components written in \n\ndifferent languages to fit together\
    \ as smoothly as those written in the same language. It also blurs \n\nthe line\
    \ between writing applications to run locally on your own machine and writing\
    \ applications that \n\ncan be accessed over the Web. What's more, it doesn't\
    \ bring with it all the overheads traditionally \n\nassociated with 'simple' programming\
    \ frameworks \\- that is, we don't need to write complex code in a \n\nhigh-powered\
    \ language to get some fairly impressive speed out of our .NET programs. \n\n\
    The .NET Framework itself consists of several components, of which ASP.NET is\
    \ just one. We won't \n\nbe concerning ourselves with the other components in\
    \ any depth as they don't really impact on \n\nforms, but it's worth discussing\
    \ how they fit together. We can break down our discussion of the .NET \n\nFramework\
    \ into a few specific sections: \n\n• MS Intermediate Language (MSIL). All the\
    \ code we write is compiled into a more abstract, \n\ntrimmed-down form before\
    \ it's executed. Whichever .NET language is used to write the \n\ncode, the trimmed\
    \ code that's created from it is defined using MSIL, the Common \n\nLanguage of\
    \ .NET. \n\n• The Common Language Runtime (CLR). This is a complex system responsible\
    \ for \n\nexecuting the MSIL code on the computer. It takes care of all the nitty-gritty\
    \ tasks involved \n\nin talking to Windows (or any OS in principle). \n\n• The\
    \ .NET Framework Class Libraries. These are code libraries containing a mass of\
    \ \n\ntremendously useful functionality, which we can very easily bolt on to our\
    \ own applications \n\nto save lots of time. \n\n• The .NET Languages. These are\
    \ simply programming languages that conform to certain \n\nspecific structural\
    \ requirements (as defined by the Common Language Specification), \n\nand can\
    \ therefore be compiled to MSIL. Typical languages include VB.NET, <$# and a \n\
    \nversion of JScript, known as JScript.NET. This is however a continually expanding\
    \ list and \n\ndoesn't just include languages written by Microsoft. .NET-compliant\
    \ versions of Perl and \n\nPython are certainly in the works as well as plans\
    \ for FORTRAN, COBOL, and many other \n\nfamiliar languages. \n\n• ASP.NET. This\
    \ is one way by which the .NET Framework exposes itself to the Web, using IIS\
    \ \n\nto route the request for the ASP.NET code to be handled, so that it can\
    \ be compiled into full \n\n.NET programs. These are then used to generate HTML\
    \ that can be sent out to browsers. \n\n334"
