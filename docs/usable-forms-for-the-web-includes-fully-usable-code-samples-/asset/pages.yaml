- img_proc: true
  md: "![](img/a10b466d6e11a32674cad146197d13d9_79_0.png)![](img/a10b466d6e11a32674cad146197d13d9_79_1.png)\n\
    \nChapter 2 \n\nWhat Information Will You Be Storing in a Database? \n\nCertain\
    \ information you will only require your users to divulge once. For example, you\
    \ might only \n\nrequire that they provide their delivery details once. You should\
    \ decide which items of information \n\nyou're going to require each time a user\
    \ visits the site and which you'll be able to retrieve from a \n\ndatabase \\\
    - given some kind of user authentication. , \n\nIf you are considering storing\
    \ credit card details then you should check with local legislation, as \n\nmany\
    \ countries impose restrictions on how long you can store such information for.\
    \ You may also \n\nneed to be aware of data protection laws regarding divulging\
    \ information about customers. \n\nIf you are going to store information about\
    \ users, then it's a good idea to have a page that \n\nexplains what you do with\
    \ data and how it's stored in layman's terms, in order to address \n\ncustomer\
    \ concerns. The link to this need not be prominent — you can put a link to it\
    \ by the \n\nfirst form control that indicates that user data is stored, then\
    \ it may just appear in the footer \n\nof remaining pages. \n\nIf your forms are\
    \ being processed manually, as opposed to by a script that populates a database,\
    \ \n\nyou can be a lot more forgiving about how a user enters the data in the\
    \ form. \n\nIs There Any Other Information That You Have To Provide On the Form?\
    \ \n\nYou should also consider what other information should appear on the form.\
    \ This could include legal \n\nnotices, summary details of a shopping cart, or\
    \ timers for a test. What you might have to add \n\ndepends on the topic of the\
    \ form. \n\nBefore You Design the Form \\- Summary \n\n• Make sure you know what\
    \ information you need from a user, and group it together. \n\n• Only ask for\
    \ data that you really need. \n\n• Be clear which information is required and\
    \ which is optional. \n\n• Look for real-world equivalents of the form that the\
    \ user will be familiar with. \n\n• Make sure you comply with local legislation\
    \ for storage of data if you intend to keep it in a \n\ndatabase. \n\nDesigning\
    \ the Form \n\nHaving captured some key information about the form, we're ready\
    \ to start designing it. We'll approach \n\nthe topics in this section in the\
    \ order in which you might like to consider implementing them. \n\nWe'll assume\
    \ that you're designing a single form (or set of forms), disregarding locale.\
    \ For \n\ninternational sites, you may decide to design different forms for different\
    \ locations. This \n\nmay cater for different representations of information such\
    \ as addresses, different \n\nlanguages for the users (and therefore potentially\
    \ different character sets as well), different \n\ncurrencies if you're dealing\
    \ with money, and so on. \n\n64"
