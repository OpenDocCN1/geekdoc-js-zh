  md: "![](img/a10b466d6e11a32674cad146197d13d9_136_0.png)![](img/a10b466d6e11a32674cad146197d13d9_136_1.png)\n\
    \nForms and ASP \n\nThe equal sign (=) is used between the form control name and\
    \ its value, and between each different \n\nname/value pair is an ampersand (&).\
    \ \n\nThe plus sign (+) may be used to separate multiple values from the same\
    \ text input. For example, if \n\nyou enter the words 'html form usability1 into\
    \ the search engine Google, your URL looks like this, \n\nwhere the spaces between\
    \ the three words you are searching on are replaced with the plus sign: \n\nhttp://www.google.com/search?hl=en&q=html+form+usability\
    \ \n\nUsing the ASP Request object, we can usually simply retrieve information\
    \ from the query string as \n\nshown below; here we are putting it in a variable:\
    \ \n\nusername \\= Request.Querystring(\"username\") ; \n\npwd \\= Request.Querystring(\"\
    pwd\"); \n\nalthough we could also call it directly. The following would write\
    \ the value entered back to the page: \n\nResponse.Write(Request.Querystring(\"\
    username\")); \n\nThe exception to this is when we have multiple checkboxes with\
    \ the same control name or select \n\nlists where more than one option can be\
    \ chosen. If the user selects more than one of the \n\ncheckboxes, the URL will\
    \ contain several name/value pairs for the same control, so the URL may \n\nlook\
    \ something like this: \n\nhttp://www.example.org/test.asp?chkCinema=0deon&chkCinema=UCG&chkCinema=Royale\
    \ \n\nIn this case, we need to loop through each occurrence to get the separate\
    \ values, as we'll see when \n\nwe look at working with checkboxes later in the\
    \ chapter. \n\nIf you need to use the value more than once, it's useful to put\
    \ it in a variable. \n\nWhile this is fine for data such as search entries, you\
    \ wouldn't really want to send password data, or \n\nany other sensitive data,\
    \ in a query string, as it's clearly visible in the URL. In addition, while most\
    \ of \n\nthe recent applications support 1024 characters of data appended to a\
    \ query string using the get \n\nmethod (or even more characters), older browsers\
    \ and servers set a limit of around 255 characters, \n\nso it's not suitable for\
    \ sending lots of data. The alternative is the post method. \n\nRetrieving Data\
    \ from an HTTP POST Method \n\nThe post method allows more data to be sent from\
    \ a form. It also buries the form data inside the \n\nHTTP header, rather than\
    \ adding it to the URL as a query string, so it can't be seen in the browser's\
    \ \n\naddress window. Therefore, we retrieve the information from a post in a\
    \ slightly different way. In this \n\ncase, we use the Request object's Form collection.\
    \ The syntax for collecting information from the \n\nlogin page this time would\
    \ be: \n\nusername \\= Request.Form(\"username\"); \n\npwd \\= Request.Form(\"\
    pwd\"); \n\n121"
