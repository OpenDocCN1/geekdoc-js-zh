  md: "![](img/a10b466d6e11a32674cad146197d13d9_269_0.png)![](img/a10b466d6e11a32674cad146197d13d9_269_1.png)\n\
    \nChapter 6 \n\nWe've written this in such a way that it's self-contained in a\
    \ separate . js file, so that it can be used by \n\nincluding the JavaScript file\
    \ in the page with a <script type=\" text /javascript\" \n\nlanguage=\" JavaScript11\
    \ src= \"validate. j s\" \\></script> element and calling the function from \n\
    \nthe form's onsubmit handler: onsubmit=\"return validate (this) ; \">. We can\
    \ use this function \n\nwith any form that observes our naming conventions: \n\
    \n• The name we wish to be displayed to users in error messages comes first. Words\
    \ are separated \n\nby the 0 (zero) character. For examples, we'd represent \"\
    Home Telephone Number\" as \n\nHomeOTelephoneONumber. \n\n• We then add on any\
    \ restrictions to the length or type of data for this field by appending one or\
    \ \n\nmore appropriate keywords from the list below, each preceded with an underscore\
    \ (\\_) \n\ncharacter. \n\nKeyword \n\nDescription \n\nrequired \n\nIndicates\
    \ a required field (cannot be left empty or containing only white space characters).\
    \ \n\nalphabetic \n\nField may contain only letters of the alphabet and spaces,\
    \ dashes, dots, and commas. \n\na1phanumeric \n\nField may contain only word characters\
    \ (see above) and spaces. \n\ninteger \n\nField may contain only digits. \n\n\
    decimal \n\nField may contain only digits plus a single decimal point. \n\nnospace\
    \ \n\nField may not contain any white space characters. \n\naddress \n\nField\
    \ must be in valid address format (must contain only letters, numbers, spaces,\
    \ \n\nand the characters .,#-/). \n\nminlengthlV \n\nText field must contain at\
    \ least N characters; at least N checkboxes of a group or \n\noptions of a multiple\
    \ select must be checked or selected. \n\nmaxlengthtV \n\nText field must not\
    \ contain more than N characters; no more than N checkboxes of \n\na group or\
    \ options of a multiple select must be checked or selected. \n\nccnumber \n\n\
    Field must contain a value in the form XXXX-XXXX-XXXX-XXXX where each X is \n\n\
    a digit. (As we've noted above, not all credit card numbers follow this convention,\
    \ \n\nbut this will be sufficient for our purposes here.) \n\nuszip \n\nField\
    \ must contain a valid 5 or 9 digit US ZIP Code. \n\nukpost \n\nField must contain\
    \ a valid UK postcode. \n\nusphone \n\nField must contain a value in the format\
    \ XXX-XXX-XXXX where each X is a digit \n\n(US or Canadian telephone number with\
    \ area code). \n\nemail \n\nField value must be in valid e-mail address format.\
    \ \n\ncurrency \n\nField must contain a number with an optional decimal point\
    \ and no more than 2 digits \n\nto the right of the decimal; value may also contain\
    \ \"$\", \"£\", \"¥\", and \",\" characters. \n\npercent \n\nValue matches decimal\
    \ format; optional % sign. \n\ncomment \n\nField may contain word and .,;:%&#$@!A\\\
    -\\_~'\"'\\[\\]{}7?() characters. \n\n254"
