    \nUsing Forms \n\nwith PHP and MySQL \n\nand use a simple loop to output links\
    \ to all five pages: \n\n<?php \n\nfor($i \\= 1; $i < 6; $i++) \n\necho \"<pxa\
    \ href \\=\\\\\"sessiontest\\_$i ,php\\\\\">Page $i</ax/p>\\\\n\" ; \n\n?> \n\n\
    </body> \n\n</html> \n\nSuccessive hits on the same page will increment the counter.\
    \ This may or may not be desirable \n\nbehavior, depending on what your deployment\
    \ goals might be on a production site, but it's sufficient \n\nfor our purposes\
    \ here. \n\nFirst try this example on a PHP-enabled server with cookies active.\
    \ After you've played with it for a \n\nbit, try disabling cookies in your browser\
    \ and then reloading the page you're on or using one of the \n\nlinks. You'll\
    \ see that PHP starts a new session and appends the session ID to the query string\
    \ \\- you \n\ndon't have to worry about checking to see if the client accepts\
    \ them or not, as PHP handles this \n\nautomatically as part of its sessions functionality,\
    \ provided it's been set up to do so. For more \n\ninformation, see the PHP Manual\
    \ or contact your server administrator. \n\nHere are few additional items of note:\
    \ \n\n• Session variables are also stored in the collection $http\\_session\\\
    _vars, which can be \n\naccessed in a manner similar to the other PHP variable\
    \ collections we've used in this chapter. \n\n• Versions of PHP prior to 4.0.6\
    \ handle sessions a little differently. Be sure to consult the PHP \n\nManual\
    \ if this is an issue. \n\n• To unset a session variable, call session\\_unregister\
    \ (); to destroy a session, use \n\nsession\\_destroy (). Note that the latter\
    \ does not unset session variables, nor does it unset \n\nthe session cookie if\
    \ one is being used. In other words, you'll need to use session\\_name () to \n\
    \nset (or get) a name for the session before calling session\\_start () or \n\n\
    session\\_register () on each page where you're making use of the session, and\
    \ \n\nsetcookie (session\\_name after calling session\\_destroy4 ) to make \n\n\
    sure that the user doesn't re-enter the same session, if this is an issue for\
    \ your application. We \n\nshould also mention that the default value for a session\
    \ name is php\\_sessid. Again we \n\nstrongly counsel you to spend some time with\
    \ the documentation in the PHP Manual for more \n\ndetailed information on this\
    \ topic. \n\n• Sessions can be enabled automatically by setting session. auto\\\
    _start=l in the php. ini \n\nfile, so that we can proceed immediately with naming\
    \ the session (if necessary or desired) and \n\nregistering session variables.\
    \ Please consult the PHP documentation before doing this, as there \n\nare other\
    \ settings in this configuration file that may affect this as well. \n\n• All\
    \ hyperlinks used on pages requiring sessions should be relative. As a security\
    \ measure, PHP \n\nwill not append $phpsessid to any absolute URIs. This is to\
    \ prevent the session ID from being \n\ntransmitted to a different server. \n\n\
    We'll revisit sessions in this chapter's final example when we use a couple of\
    \ session variables for \n\nsomething a little more useful. \n\n193"
