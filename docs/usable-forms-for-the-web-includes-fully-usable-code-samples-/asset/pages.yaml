  md: "![](img/a10b466d6e11a32674cad146197d13d9_268_0.png)![](img/a10b466d6e11a32674cad146197d13d9_268_1.png)\n\
    \nForm Validation Techniques \n\nOtherwise, our user is liable to see something\
    \ like the figure below, which some might find confusing. \n\nAnother strategy\
    \ might involve setting a cookie or session variable on the page that processes\
    \ the form. \n\nWe'll talk more about those options later in the chapter \\- the\
    \ latter, of course, under Server-side \n\nValidation Techniques. \n\nPutting\
    \ It All Together \n\nTo validate a form of any significant size requires some\
    \ planning and organisation. We're limited in what \n\ninformation we can retrieve\
    \ about form elements via the basic DOM: name, type, value, and in the case \n\
    \nof checkboxes and radiobuttons, a checked property \\- or for options, a selected\
    \ property. With more \n\nadvanced browsers (IE 4 and above, and Mozilla-derived\
    \ browsers including Netscape 6 and above), we \n\ncan access a few additional\
    \ properties, such as className, disabled, readonly, and others deriving \n\n\
    from DOM Levels 1 and 2, but these still don't provide much of a way to determine\
    \ the elements' purpose \n\nor context. Instead, we have to devise our own way\
    \ of providing context. We did a bit of this earlier in this \n\nchapter by assigning\
    \ a required style class to required elements, but this property isn't compatible\
    \ with \n\nNetscape 4 or with any version of Opera, and it still doesn't tell\
    \ us much about the type of data a required \n\nfield is supposed to contain,\
    \ nor about its format. \n\nThe strategy we'll use is to encode a form field attribute\
    \ \\- the name attribute \\- with the information that we \n\nneed to validate\
    \ it correctly. We'll do this using the method we suggested close to the beginning\
    \ of this \n\nsection, by concatenating descriptive terms onto the field name\
    \ using an underscore as a delimiter \n\ncharacter. For example, if a field is\
    \ required we'll add ...required onto the name of the field, but if it \n\nshould\
    \ contain only digits, we'll add \\_integer to that, and so on. We'll define a\
    \ general function \n\nvalidate () to operate on the form itself, obtaining the\
    \ name, value, and type of each of its elements in \n\nturn, and calling specific\
    \ validation routines according to these. \n\n253"
