    \nChapter 4 \n\nNext we work out how much to add to the base price to account\
    \ for the size of pizza the user selects, \n\nand add this to the price of the\
    \ regular-size pizza they have chosen. This is stored in intPriceSized: \n\n'second,\
    \ work out how much you have to add based on the size of the pizza \n\nintPriceSized\
    \ \\= calculateSizeAddition(strSize) \n\n< \n\nFunction calculateSizeAddition(strSize)\
    \ \n\nSelect Case strSize \n\nCase \"regular\" \n\nintAdd \\= 0 \n\nCase \"large\"\
    \ \n\nintAdd \\= 2 \n\nCase \"family\" \n\nintAdd \\= 4 \n\nEnd Select \n\ncalculateSizeAddition\
    \ \\= (intPriceReg + intAdd) \n\nEnd Function \n\nOnce we have the price of the\
    \ pizza the user has selected, we count how many, if any, extra \n\ntoppings were\
    \ ordered. We do this using the Count property of the query string collection.\
    \ The result \n\nis stored in intTopsCount: \n\n' work out how many extra toppings\
    \ were ordered \n\nIf NOT strTops \\= \"\" Then \n\nintTopsCount \\= Request.Querystring(\"\
    tops\").Count \n\nElse \n\nIntTopsCount \\= 0 \n\nEnd If \n\nWe add the number\
    \ of toppings to the price of the pizza (which currently reflects type and size):\
    \ \n\nintPricePizza \\= (intPriceSized + intTopsCount) \n\nNow we have the price\
    \ of one pizza, as specified by the user \\- all we have to do before adding it\
    \ to \n\nthe cart is to multiply it by the quantity the user requested: \n\nIf\
    \ Not intQty \\= \"\" Then \n\nintPrice \\= (intPricePizza \\* intQty) \n\nElse\
    \ \n\nIntPrice \\= intPricePizza \n\nEnd If \n\nHaving worked out the price of\
    \ this order, we're ready to add it to the cart. Remember that we \n\ncreated\
    \ the cart back in order3 .asp, ready for use in this page. We add the item using\
    \ a subroutine \n\ncalled addltem (): \\\\ \n\nSub addltem() \n\ni \\= Session(\"\
    ItemCount”)+1 \n\n'make a local copy of the cart from the Session object \n\n\
    arrCart \\= Session!\"Cart\") \n\n'resize the cart to make room for new item \n\
    \n156"
