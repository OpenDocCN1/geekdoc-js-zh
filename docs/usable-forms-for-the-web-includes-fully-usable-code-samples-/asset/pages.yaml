    \nChapter 4 \n\nunless there's more than one value with the same name for the\
    \ control (such as multiple checkboxes \n\nthat share a name or select boxes where\
    \ you can choose more than one option). In that case, you \n\nhave to loop through\
    \ the values and retrieve them, as we'll see later in the chapter. \n\nAgain,\
    \ if you're going to use the form data more than once within a page, it's good\
    \ practice to put it in \n\na variable. If you only use it once, however, you\
    \ can use the following shorthand: \n\nResponse.Write(Request.Form(\"username\"\
    )); \n\nwhere we collect the form data from the Request. Form collection as we\
    \ need it. \n\nWhile form data sent using http post is hidden in the header, it\
