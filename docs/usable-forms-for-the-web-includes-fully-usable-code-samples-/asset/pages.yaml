  md: "![](img/a10b466d6e11a32674cad146197d13d9_146_0.png)![](img/a10b466d6e11a32674cad146197d13d9_146_1.png)\n\
    \nForms and ASP \n\nThe syntax for writing a cookie to the client with multiple\
    \ values or keys is: \n\nResponse.Cookies(\"cookieName\") (\"cookieKey\") \\=\
    \ keyValue \n\nwhere cookieName is the name of your cookie, cookieKey is the name\
    \ of the variable or key in the \n\ncookie that you're creating, and keyValue\
    \ is the value that you're assigning to that key. \n\n• If the cookie does not\
    \ exist, this will create one. \n\n• If the cookie exists and the key does not\
    \ exist, the key will be added to the cookie. \n\n• If the cookie and key exist,\
    \ the new value will be written over the preceding one. \n\nYou can also indicate\
    \ when you want the cookie to expire using the following: \n\nResponse.Cookies{\"\
    cookieName”).Expires \\= date \n\nwhere date could be an explicit date (for example,\
    \ \"April 16, 2003\") or a relative one (obtained, say, \n\nby adding 10 days\
    \ to today's date). By default, the cookie will expire when the browser window\
    \ is \n\nclosed if the expires property is not set. \n\nWe can then retrieve the\
    \ value of a cookie that does not contain keys using: \n\nRequest.Cookies(\"cookieName\"\
    ) \n\nor that of a cookie that does have keys using: \n\nRequest.Cookies(\"cookieName\"\
    ) (\"cookieKey\") \n\nFor additional technical information about cookies, you\
    \ can investigate the cookies \n\nspecification at http://www.netscape.com/newsref/std/cookie\\\
    _spec.html. While this \n\ndocument originated with Netscape Communications, it\
    \ serves as the de facto \n\nstandard for cookie support in all browsers and recent\
    \ versions of both Internet \n\nExplorer and Opera also meet its minimum requirements.\
    \ \n\nOK, having seen a bit about cookies and ASP, let's get back to the example\
    \ and look at how we \n\nstore form data in a cookie. We'll assume that the user\
    \ has already completed the first order form. \n\nTaking Form Data from a Variable\
    \ and Adding it to a Cookie \\- order2.asp \n\nHaving completed orderl. htm, the\
    \ form data will again be sent to a file called order2 . asp (this \n\ntime in\
    \ the cookies folder of the downloadable sample code). \n\norder2 .asp does the\
    \ following: \n\n• Stores the values passed from orderl .htm in variables called\
    \ strTime and strDel. \n\n• Stores the values passed from orderl. htm in a cookie\
    \ called testForm \\- the keys for this \n\nform will be called time and del.\
    \ \n\n• Writes the second form to the user. \n\n131"
