  md: "![](img/a10b466d6e11a32674cad146197d13d9_189_0.png)![](img/a10b466d6e11a32674cad146197d13d9_189_1.png)\n\
    \nChapter 5 \n\nThe doubleval () function returns its argument converted into\
    \ a double (floating point) number. Two \n\nadditional functions that allow us\
    \ to force type conversions are intval (), which returns an integer, \n\nand strval\
    \ (), which performs a conversion to a string. \n\nAn Aside \\- Some PHP Basics\
    \ \n\n% \n\nThis would be a good point to let you know about a few additional\
    \ language basics. PHP supports \n\nthe standard arithmetic operators +, \\*,\
    \ /, and % for (respectively) addition, subtraction, \n\nmultiplication, division,\
    \ and modulo. \n\nAs you can see above, strings are encased in either single or\
    \ double quotation marks; so long as \n\nyou begin and end a string value with\
    \ the same type of quotes, it often doesn't matter which you use. \n\nHowever,\
    \ if we want to make use of variable interpolation when outputting strings (as\
    \ explained \n\nbelow), we must use double quotes, so that's what we'll be using\
    \ for all the PHP code we show in \n\nthis book. Otherwise, there's no reason\
    \ why you can't use single quotes if that’s what you prefer or \n\nare used to\
    \ \\- although it's a good idea to pick one or the other and be consistent with\
    \ it. \n\nOne other item of note \\- if you want to use a literal single quote\
    \ or apostrophe with a single-quoted \n\nstring, you must escape it with a backslash,\
    \ for example: \n\n$your\\_string \\= 'I\\\\'ve escaped a single quote.'; \n\n\
    The same is true for using a double-quote character inside a double-quoted string,\
    \ as in: \n\n$my\\_string \\= \"She said, V'Hello, there, handsome!\\\\\" to me.\"\
    ; \n\nPHP also supports most of the flow-control structures familiar to users\
    \ of C/C++, Java, JavaScript, \n\nand Perl. These include: \n\n• if ( condition\
    \ ) ; \n\n{ statement-block } \n\n\\[ else \n\n{ statement-block } \\] \n\n• for{initial-condition\
    \ ; test-condition ; alter-condition) \n\n{ statement-block } \n\n• while( condition\
    \ ) \n\n{ statement-block } \n\n• do \n\n{ statement-block } \n\nwhile( condition\
    \ ) ; \n\n• switch( variable ) \n\n(case value-1: \n\n{ statement-block-1 \n\n\
    \\[ break; \\] } \n\ncase value-N: \n\n{ statement-block-N \n\n\\[ break; \\]\
    \ } \n\n\\[ default: \n\n{ default-statement-block } \\] \n\n} \n\n174"
