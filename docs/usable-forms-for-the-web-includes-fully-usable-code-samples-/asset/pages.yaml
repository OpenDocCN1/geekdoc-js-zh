    \nChapter 6 \n\nHere's our first error check. You'll recall from the chapters\
    \ on using forms with server-side scripting that \n\nserver programs regard all\
    \ form field values as strings, and the same is true for client-side JavaScript\
    \ as \n\nwell. This means that we can use the string object's methods and properties\
    \ on the values held in the \n\npassword fields we wish to examine, including\
    \ the length property. \n\nif(newpassl.length<5) \n\n{ \n\nIf newpassl contains\
    \ fewer than 5 characters, we set the function's return value to false and display\
    \ an \n\nappropriate error message to the user. \n\nreturnVal=false; \n\nalert(\"\
    Your new password must contain at\\\\nleast 5 characters. \n\nPlease try again.\"\
    ); \n\nWe also blank out the values in both of the New Password inputs; since\
    \ the user can't actually see what's \n\nbeen typed, it's better to have him do\
    \ it over, rather than allow him to add an arbitrary character at an \n\narbitrary\
    \ point and possibly trigger a further error if he guesses incorrectly. We also\
    \ set focus to the first \n\nNew Password input by calling that element's focus\
    \ () method. \n\nform.newpasswordl.value=\"\" \n\nform.newpassword2.value=\"\"\
    \ \n\nform.newpasswordl.focus(); \n\nIf we've got this far without an error, we\
    \ check to see that the values in both New Password fields match. \n\nelse \n\n\
    { \n\nif(newpassl!=newpass2) \n\n{ \n\nIf the two values aren't the same, we do\
    \ much the same as above. Note that in JavaScript string \n\ncomparisons are case-sensitive:\
    \ in order to do case-insensitive checking, you'll need to convert both strings\
    \ \n\nto upper- or lower-case using the string. toUpperCase () or string. toLowerCase\
    \ () method. \n\nreturnVal=false; \n\nalert(\"The entries for your new password\
    \ didn\\\\'t match. Please try again.\"); \n\nform.newpasswordl.value=\"\"; \n\
    \nform.newpassword2.value=\"\" ; \n\nform.newpasswordl.focus(); \n\n} ' \n\n228"
