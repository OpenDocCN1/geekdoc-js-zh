    Login\" /> \n\n<input type=\"reset\" value=\"Clear\" /x/tdx/tr> \n\n</tablexbr\
    \ /xbr /> \n\n</form> \n\nIf you have not yet registered, <a href \\= \"register.asp\"\
    >register now</a>! \n\n</bodyx/html> \n\nIf we do have a value for the username\
    \ when we check at the beginning of the page, we can try to \n\nprocess the data\
