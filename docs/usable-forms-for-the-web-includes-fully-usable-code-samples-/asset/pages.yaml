    \ \n\nnotably the split () method) to deduce from the field's name what sort of\
    \ tests we need to perform on \n\nthe field's value. While this can lead to very\
    \ long and cumbersome field names, it can also be \n\nadvantageous for both client-side\
    \ and server-side validation. We'll return to this technique later in this \n\n\
    chapter, and develop it more fully. \n\nWe're not yet done with the problem of\
    \ blank fields, because it's not enough just to determine that they're \n\nnot\
    \ empty. There's another related issue that we have to confront, and that's what\
    \ to do about making \n\nsure that a required field doesn't only contain white\
    \ space characters. We have an additional problem as \n\nwell \\- we don't know\
    \ ahead of time how many white space characters a field might contain. We could\
    \ \n\ncheck to see whether the value of the field is empty, then see if it's equal\
    \ to a single space, then two \n\nspaces, and so on, but this could get tedious\
    \ very quickly, especially when we're dealing with \n\n<textarea> elements that\
    \ might also contain linefeeds/carriage returns. \n\nWe could fill up quite a\
    \ few lines of code by testing for each possible combination for a field that\
    \ can \n\ncontain even a relatively small number of characters \\- and if we missed\
    \ just one combination, some user \n\nwould be sure to find it, and submit a form\
    \ with a key required field left (for any practical purposes) blank. \n\nWhat\
    \ we need is a way to define patterns of desired and/or undesirable characters,\
    \ and JavaScript does \n\njust that via Regular Expressions. \n\nValidating Text\
    \ Input with Regular Expressions \n\nIn case you've not encountered them before,\
    \ regular expressions are a powerful tool with a great many \n\napplications,\
    \ and they're particularly useful in validating forms. If you've worked with them\
    \ previously, \n\nyou'll find that the version 4 browsers from Netscape and Microsoft\
    \ (JavaScript 1.2/1.3) support features \n\nof regular expressions roughly equivalent\
    \ to those of Perl 4; starting with IE 5.5 and Netscape 6.0 \n\n(JavaScript 1.5)\
    \ we have regular expression support on a par with Perl 5. \n\nHere's a simple\
    \ example. It's not very practical, but it will help us get started: Suppose we\
    \ need to ensure \n\nthat a text input named f irstName that's part of a form\
    \ named myForm contains at least qne instance of \n\nthe letter \"a\". We start\
    \ by setting a variable equal to the string value that's contained in this text\
    \ input: \n\nvar myFirstName=document.myForm.firstName.value; \n\nNow we create\
    \ a regular expression object containing a pattern of characters, which consists\
    \ of the letter \n\n\"a\". In JavaScript we use a pair of forward slash characters\
    \ to indicate the beginning and end of a regular \n\nexpression pattern. \n\n\
    var myRegExp=/a/;"
