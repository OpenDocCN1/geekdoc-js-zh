  md: "![](img/a10b466d6e11a32674cad146197d13d9_381_0.png)![](img/a10b466d6e11a32674cad146197d13d9_381_1.png)\n\
    \nChapter 8 \n\nThis will alter the whole look and style of our <asp:radiobuttonlist>\
    \ control as follows: \n\nWe can also directly reference any style settings using\
    \ the style attribute of our server control \n\nwithin the ASP.NET code too. If\
    \ you remove the stylesheet and class attributes from the last \n\nexample, you\
    \ can use the style attribute of radiol, to create the same effect within sub\
    \ \n\nPage\\_Load (), as follows: \n\n<script runat=\"server\" language=\"vb\"\
    > \n\nSub Page\\_Load() \n\nradiol.Style(\"background\") \\= \"yellow\" \n\nradiol.Style(\"\
    font-size\") \\= \"18pt\" \n\nradiol.Style(\"height\") \\= \"lOOpx\" \n\nIf Page.IsPostBack\
    \ Then \n\nMessage.Text \\= \"You have selected the following: \" & \n\nradiol.Selectedltem.Value\
    \ \n\nEnd If \n\nEnd Sub \n\n</script:> \n\nIf we look at the HTML sourcecode,\
    \ we'll see that ASP.NET has converted them into ttie relevant \n\nstyle attribute\
    \ settings for a table and placed the HTML control in a table in HTML (note that\
    \ it \n\ndoesn't create a fully separate stylesheet): \n\n<table id=\"radiol\"\
    \ border=\"0\" style=\"background:yellow;font- \n\nsize :18pt;height:lOOpx;\"\
    > \n\n<tr> \n\n<td> \n\n<span value=\"Olives\"> \n\ncinput id=\"radiol\\_0\" type=\"\
    radio\" name=\"radiol\" value=\"Olives\" /> \n\n366"
