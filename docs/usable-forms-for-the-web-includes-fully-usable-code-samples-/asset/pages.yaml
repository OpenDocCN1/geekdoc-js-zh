  md: "![](img/a10b466d6e11a32674cad146197d13d9_361_0.png)![](img/a10b466d6e11a32674cad146197d13d9_361_1.png)\n\
    \nChapter 8 \n\nOn the right-hand side of the page, you can find a list of all\
    \ the controls, from label and \n\ndropdownlist, to checkbox and the likes. Clicking\
    \ on the link for a particular control will \n\nreveal a list of allowable attributes\
    \ under the name Properties. We won't be supplying \n\na list of attributes for\
    \ the other controls, as generally they all support the same \n\nattributes, and\
    \ this information is easily obtainable frdm the above URL. If you haven't \n\n\
    installed the Quickstarts, you can get information in .NET Framework SDK at: \n\
    \nC:\\\\Program Files\\\\Microsoft.NET\\\\FrameworkSDK\\\\Samples\\\\StartSamples.htm\
    \ \n\nOne other attribute supported by all of them is the attribute runat, which\
    \ is once again always set to \n\nserver. This is to explicitly indicate that\
    \ this particular control should be run on the server, not the \n\nbrowser. \n\
    \nTo create the control with the minimum of information needed, you can just supply\
    \ the runat and id \n\nattributes: \n\n<asp:label id=\"Messagel\" runat=”server''>This\
    \ is some example text</asp:label> \n\nThe asp: prefix indicates that this control\
    \ is a namespace and indicates that the control is part of the \n\nset of built-in\
    \ ASP.NET controls. It is possible to create custom controls, which have prefixes\
    \ of the \n\ndeveloper's choice. The id attribute is used to uniquely identify\
    \ the <asp: labei> control so you can \n\nrefer to it in your ASP.NET code. The\
    \ runat=\"server\" attribute tells the server to process the \n\ncontrol and generate\
    \ FITML code to be sent to the client. The text between the tags is equivalent\
    \ to \n\nsetting the text attribute with this value. \n\nLet's look at another\
    \ example. If you wanted to set the color of a text message to red, you could\
    \ set \n\nit like this: \n\n<asp:label id=\"Messagel\" forecolor=\"red\" runat=\"\
    server\">Example Text</asp:label> \n\nAlternatively, as mentioned earlier, you\
    \ can use the text attribute. This way, everything can be \n\ncontained within\
    \ attributes, in which case you need to close the tag in the following way: \n\
    \n<asp:label id=\"Messagel\" forecolor=\"red\" text=\"Example Text\" runat=\"\
    server\" /> \n\nFlere, we omit the closing tag, and just supply a closing / to\
    \ indicate that the tag is closed. \n\nLet's now take a look at an example of\
    \ how we can use the <asp: label> control to display some \n\ntext at requisite\
    \ places within our web page. Throughout this chapter we'll continue to refer\
    \ to our \n\nPizza This! online pizza site. In this example we'll assume that\
    \ values of the user's name and their \n\nselection on the web site have already\
    \ been submitted, and that all we need to do is output a \n\nmessage displaying\
    \ confirmation that we have received the user's details: V \n\n<html> \n\n<head>\
    \ \n\n<title>Label Control page</title> \n\n</head> \n\n<body> \n\n<hl>PizzaThis!\
    \ Pizzas</hl> \n\n<br /xbr /> \n\nThank you \n\n346"
