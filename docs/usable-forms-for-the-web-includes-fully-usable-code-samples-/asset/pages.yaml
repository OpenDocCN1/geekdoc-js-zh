    \nChapter 6 \n\nRequirements \\= Array(\"required\",\"alphabetic\",\"address\"\
    ,\"alphanumeric”, \\_ \n\n\"nospace\",\"integerval\",\"decimal\",\"minlength\"\
    ,\"maxlength\", \\_ \n\n\"ccnumber\",\"uszip\", \"ukpost\",\"usphone\",\"email\"\
    ,\"currencyval\", \\_ \n\n\"percent\",\"comment\") « \n\nNext we use the VBScript\
    \ UBound () function to find the number of elements in this array and assign that\
    \ \n\nnumber to ReqLength. \n\nReqLength \\= UBound(Requirements) \n\nNow we loop\
    \ through all the elements in the Requirements array, using each in turn to assemble\
    \ a \n\nstring of the form \"Dim required\". Using the Execute () function, we\
    \ can cause the string to be \n\nevaluated as a statement which declares a variable\
