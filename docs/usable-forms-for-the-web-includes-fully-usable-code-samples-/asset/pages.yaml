  md: "![](img/a10b466d6e11a32674cad146197d13d9_239_0.png)![](img/a10b466d6e11a32674cad146197d13d9_239_1.png)\n\
    \nChapter 6 \n\n• Text containing characters of the wrong type; that is, text\
    \ that should consist only of letters \n\ncontaining non-alphabetical characters,\
    \ or vice versa. \n\n• Text inputs that are empty, or contain only whitespacd\
    \ characters. \n\n• Text that is likely to contain characters, or groups or patterns\
    \ of characters that need to be \n\nstripped out or converted into another format\
    \ for purposes of display in an HTML page or \n\nstorage in a database. \n\n•\
    \ Complex strings of text that do not meet formatting criteria, such as e-mail\
    \ addresses and \n\ndates. \n\n• Confirmation of critical data failing because\
    \ repeated instances of text strings are not identical \n\n(for example updating\
    \ a user password). \n\n• Failure of the user to make a selection from among a\
    \ group of non-textual inputs (option, \n\ncheckbox, or radiobutton elements).\
    \ \n\nWe'll also examine some design strategies to help us limit the possibility\
    \ of user error, such as employing \n\nfixed-length fields, or making use of non-textual\
    \ inputs to limit user responses to one or more items in a \n\nlist of meaningful\
    \ choices, for example dates. \n\nClient Versus Server \n\nValidation of form\
    \ data can take place in the user agent by means of client-side scripting, or\
    \ on the server \n\nas part of a form handler application, or both. There are\
    \ advantages and disadvantages in depending \n\nsolely on either one, and in this\
    \ section we're going to examine both options. \n\nClient-side validation can\
    \ be very useful in a number of ways. Since the validation of form data takes\
    \ \n\nplace on the user's computer, it's fast. There's no waiting for a response\
    \ from the server, which means \n\nthat user errors can be found and indicated\
    \ in real time. This includes generating error-specific pop-up \n\ndialogs and\
    \ setting focus on the offending elements, neither of which can be done using\
    \ server-side \n\ncode alone. By catching and correcting errors before data is\
    \ sent to the server, we cut down on round \n\ntrips between the user and the\
    \ web site, which is not only faster, but saves bandwidth and cuts down \n\non\
    \ server load. \n\nThere are also some drawbacks to depending on client-side processing\
    \ alone to take care of all our \n\nvalidation requirements. If the user agent\
    \ doesn't support client-side scripting, or if the user has it \n\ndisabled, then\
    \ (obviously) no client-side validation can take place. Savvy users can also tamper\
    \ with \n\nclient-side scripting. In either case, this raises the possibility\
    \ of bad or even harmful data being passed \n\nback to the server. \\\\ \n\nServer-side\
    \ validation can't easily be sidestepped or altered by users, since they don't\
    \ have access to \n\nthe server-side code or programming environment. Therefore,\
    \ any serious validation scheme must \n\nemploy server-side validation as a last\
    \ line of defence against bad data; it would be foolhardy not to have \n\nit in\
    \ place. On the other hand, server-side validation alone could require many round\
    \ trips between client \n\nand server, which could take quite a lot of time, eat\
    \ up a lot of bandwidth and server resources, and run \n\nthe risk of losing users\
    \ who get dropped by poor Internet connections. \n\n224"
  merge: -1
  pgno: 239
- img_proc: true
  md: "![](img/a10b466d6e11a32674cad146197d13d9_240_0.png)![](img/a10b466d6e11a32674cad146197d13d9_240_1.png)\n\
    \nForm Validation Techniques \n\nTherefore, the best course to follow would be\
    \ to take advantage of both client and server processing \n\nwhenever possible.\
    \ It's wasteful not to take advantage of the speed and interactivity that client-side\
    \ \n\nprocessing can provide to our users. However, we also need to make sure\
    \ that we fully protect our web \n\napplications from erroneous data by insuring\
    \ that our server-side code is completely up to the task of \n\nvalidation where\
    \ client-side processing isn't available, or where its reliability might be suspect.\
    \ In this \n\nchapter, we'll try to help you make the most of both environments.\
    \ \n\nClient-side Validation \n\nWithout further ado, let's start by looking at\
    \ client-side validation. \n\nBrowser Compatibility Issues \n\nWhen we speak of\
    \ client-side programming that's intended to be useful to the widest range of\
    \ Internet \n\nusers, we're really talking about JavaScript manipulating the Document\
    \ Object Model. Other scripting \n\nlanguages are available in some browsers (most\
    \ notably VBScript in Internet Explorer on Windows), but \n\nJavaScript (now defined\
    \ as a subset of the ECMAScript standard, even though it was around first), is\
    \ the \n\nmost widely supported one. \n\nWe're in a time of transition where client-side\
    \ capabilities are concerned. Most browsers now in use offer \n\nfair support\
    \ for HTML 4.01, CSS Levels 1 and 2, and the Document Object Model Levels 0 and\
    \ 1. \n\nHowever, there remain a number of Internet users whose browsers' support\
    \ for these standards is either \n\nvery poor or non-existent. In the former category\
    \ we place internet Explorer version 4 and above, Mozilla \n\nand Mozilla-based\
    \ browsers such as Netscape 6 and above, Galeon and K-Meleon. Most other browsers\
    \ \n\nfall into the latter category. \n\nIt is unfortunate that this disparity\
    \ still exists, and it's quite frustrating, because being able to use DOM-1 \n\
    \nand CSS-DOM allows us to create some very simple and elegant solutions. We'll\
    \ concentrate on the more \n\nmodern browser, but we'll also offer some backwards-compatible\
    \ alternatives. Our suggestion is that, \n\nrather than try to create and maintain\
    \ client-side code with multiple branches, it would be easier to create \n\nseparate\
    \ versions of pages dynamically on the server, generating them by detecting the\
    \ visitor's user \n\nagent. For example, if we were using PHP to generate one\
    \ of our survey pages from the previous \n\nchapter, \\\\#e could do something\
    \ similar to this: \n\n<?php \n\n$browser \\= $HTTP\\_USER\\_AGENT; \n\n$version\
    \ \\= explode (\" \",$browser); \n\n$version \\= explode$version\\[0\\]); \n\n\
    $version \\= doubleval($version\\[1\\]); \n\n$msie \\= strpos($browser,\"MSIE\"\
    ) !==FALSE && strpos($browserOpera”; \n\n$modern \\= $version \\>= 5; \n\nif($version\
    \ \\>= 4 && $msie)$modern \\= TRUE; \n\n\\===FALSE; \n\necho \"<script type=\\\
    \\\"text/javascriptX\" language=\\\\\"JavaScriptA \">\\\\n\"; \n\nif($modern)\
    \ \n\n{ \n\n?> \n\n<!-- JavaScript code for modern browsers goes here \\--> \n\
    \n<?php \n\n} \n\n225"
