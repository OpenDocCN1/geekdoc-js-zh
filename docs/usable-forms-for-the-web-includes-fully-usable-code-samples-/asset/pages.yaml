  md: "![](img/a10b466d6e11a32674cad146197d13d9_379_0.png)![](img/a10b466d6e11a32674cad146197d13d9_379_1.png)\n\
    \nChapter 8 \n\n<asp:checkbox id=\"checkl\" runat=\"server\" Text=\"Four Cheese\"\
    \ Value=\"Four Cheese\"/> \n\n<asp:checkbox id=\"check2\" runat=\"server\" Text=\"\
    Artichoke and Onion\" \n\nValue=\"Artichoke and Onion\"/> \n\n<asp:checkbox id=\"\
    check3\" runat=\"server\" Text \\=\"Margherita\" Value=\"Margherita\"/> \n\ni\
    \ \n\nThe Text attribute here specifies the text that will appear next to the\
    \ checkbox. The checkbox itself \n\nwill not return a value \\- to find out if\
    \ it is checked or not we need to add some ASP.NET code to test \n\nif the HTML\
    \ checked attribute is true or false (as opposed to the corresponding ASP.NET\
    \ \n\nSelected attribute) it will be true if the checkbox is checked. \n\nLastly\
    \ it's worth mentioning that, if none of these controls provide quite the functionality\
    \ you are \n\nlooking for, then you can use the form controls supplied in ASP.NET\
    \ HtmlControls. We're not \n\ngoing to look at them here, other than mention that\
    \ they can provide functionality that is sometimes \n\nimpossible with one of\
    \ the ASP.NET controls (such as using two radio buttons with the same name \n\n\
    with normal HTML in between them.) The set of HTML controls that provide form\
    \ functionality are: \n\n• HtmlForm \n\n• HtmllnputButton \n\n• HtmllnputCheckBox\
    \ \n\n• HtmllnputControl \n\n• HtmllnputFile \n\n• HtmllnputHidden \n\n• HtmlInputImage\
    \ \n\n• HtmllnputRadioButton \n\n• HtmllnputText \n\n• HtmlSelect \n\nThese controls\
    \ in many cases are pretty much identical to the ones we've considered in \n\n\
    WebControls which is the reason we're not going to look at them, however, occasionally\
    \ they \n\nprovide extra or different properties, which might prove useful to\
    \ the programmer. You can find a \n\ncomplete list of them (including other non-form-related\
    \ controls) in the class browser online at: \n\nhttp://samples.gotdotnet.com/quickstart/aspplus/samples/classbrowser/vb/classbrowser.aspx7names\
    \ \n\npace=System. Web. UL HtmlControls. \\* \n\nApplying Style to WebControls\
    \ \n\nOne reason why we have stuck with talking about the WebControls is, as we\
    \ said at beginning of this \n\nsection, that they provide a more consistent interface.\
    \ This is particularly so when it comes to setting \n\nstyles. So far, it might\
    \ look as if these controls ignore all previous style standards and stylesheets,\
    \ as \n\nyou can set presentational features via the control's own presentational\
    \ attributes such as height and \n\nforecolor. For example, as we saw earlier,\
    \ to turn text in a label control red, you could do the \n\nfollowing: \n\n364"
