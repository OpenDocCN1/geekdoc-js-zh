    \ substring with spaces, so the value of currField for the first element in the\
    \ form is \n\nFirst Name. \n\ncurrField=currName.indexOf()!=-l?currName.split)\\\
    [0\\]:currName; \n\ncurrField=currField.replace(/0/g,\" \"); \n\n258"
