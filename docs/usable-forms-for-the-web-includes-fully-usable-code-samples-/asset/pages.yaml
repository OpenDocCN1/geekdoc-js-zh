    \nChapter 8 \n\nid=\"test\\_0\" type=\"radio” name=\"test\" value=\"a” /> \n\n\
    for=\"test\\_0\">a</label> \n\nid=\"test\\_l\" type=\"radio” name=\"test\" value=\"\
    b\" /> \n\nfor=\"test\\_l\">b</label> \n\nid=\"test\\_2\" type=\"radio\" name=”test\"\
    \ value=\"c \n\nchecked=\"checked\" /> \n\nfor=\"test\\_2\">c</label> \n\n<input\
    \ type=\"submit\" value=\"Click Me\" /> \n\n</form> \n\n</body> \n\n</html> \n\
    \nAs you can see, everything that has been returned to the browser has been returned\
    \ as HTML code. \n\nSecondly, this is the only page we are using, in direct contrast\
    \ to our two-page approach with ASP \n\nand PHP when using forms. To explain how\
    \ it works, we're going to reference the outputted HTML \n\ncode that we can view\
    \ in our browser, and compare it to our original ASPX code. \n\nLet's start by\
    \ jumping into the <form> section of the script. The very first thing we do with\
    \ the form is \n\nset a new attribute: \n\n<input \n\n<label \n\n</td> \n\n</tr>\
    \ \n\n<tr> \n\n<td> \n\n<input \n\n<label \n\n</td> \n\n</tr> \n\n<tr> \n\n<td>\
    \ \n\n<input \n\nclabel \n\n</td> \n\n</tr> \n\n</table> \n\n<br /><br /> \n\n\
    <form runat=\"server\"> \n\nThis tells ASP.NET that we intend this form to be\
    \ run on the server. If we compare this line to what \n\nhas been returned to\
    \ the browser, we can see a large difference: \n\n<form name=\"\\_ctlO\" method=\"\
    post\" action=\"postback.aspx\" id=\"\\_ctlO”> \n\nASP.NET has generated four\
    \ new attributes. The name and id attributes serve the same purpose, \n\nuniquely\
    \ identifying the form, but it's the other two that are of interest. As you well\
    \ know, HTML forms \n\nrequire a page to receive the form data, and a method of\
    \ transmission. We didn't specify either of \n\nthese in our .aspx code, so ASP.NET\
    \ code specified them for us. The action attribute always \n\npoints to the same\
    \ page that we have run, so the answers are returned to our first page. It also\
    \ \n\nspecifies the post method by default. \\* \n\nThe main item on the form\
    \ is the <asp:radiobuttonlist> control: \n\n<asp:radiobuttonlist id=\"test\" runat=\"\
    server\"> \n\n<asp:listitem value=\"a\" runat=\"server\" /> \n\n<asp:listitem\
    \ value=\"b\" runat=\"server” /> \n\n<asp:listitem value=\"c\" runat=\"server\"\
    \ /> \n\n</asp:radiobuttonlist> \n\n342"
