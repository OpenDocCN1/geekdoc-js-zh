    \ \n\nThis is a fairly straightforward form that uses a lot of the things we've\
    \ introduced in this chapter. We've \n\nsplit up the sections of the form using\
    \ fieldsets. Inside each fieldset is a table for formatting the form \n\ncontrols,\
    \ which requires that the labels we use are referenced using the for attribute.\
    \ \n\nFor each section, we have an access key \\- which is indicated by the underlining\
    \ of the first character of that \n\nsection \\- given in the legend element.\
    \ When the access key is used, focus is given to the first form element \n\nin\
    \ that section. Finally, tabbing indexes are used to provide tabbing order throughout\
    \ the document. \n\n57"
