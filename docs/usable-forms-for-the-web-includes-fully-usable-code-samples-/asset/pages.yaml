  md: "![](img/a10b466d6e11a32674cad146197d13d9_113_0.png)![](img/a10b466d6e11a32674cad146197d13d9_113_1.png)\n\
    \nChapter 3 \n\nA bit further up the timeline around frame 30 or 40 create another\
    \ blank keyframe and set the frame \n\nlabel to done. This is where we are going\
    \ to send the playhead to whenever some kind of data has \n\nbeen checked or processed.\
    \ On this frame create two dynamic text fields, one single-line field to \n\n\
    show Error or Success to the user, and one multi-line field to display the error\
    \ or success message. \n\nAdd another 3 seconds worth of frames after this so\
    \ that messages are displayed long enough for \n\nthe user to read. \n\nBack on\
