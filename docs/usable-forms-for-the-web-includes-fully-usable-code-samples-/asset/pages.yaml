    \nHTML Forms \n\nIf you want to do anything on a web site involving exchange of\
    \ information from a user to a web server, \n\nyou'll most likely have to use\
    \ HTML forms. This chapter will be a refresher on the various form elements \n\
    \nthat are available to us in HTML and how we use them. It's also intended as\
    \ a quick reference for \n\nwhenever you're working with forms. \n\nWhile we're\
    \ looking at HTML forms, we'll also see several examples of forms that you can\
    \ use in your \n\nday- to-day work, from a simple search box to a more complex\
    \ form for collecting details about visitors to \n\nyour site. In this chapter,\
    \ we'll look at: \n\n• A quick introduction to forms. \n\n• The <form> element.\
    \ \n\n• Control types: \n\n• Input boxes \n\n• Submit, reset, and push buttons\
    \ \n\n• Checkboxes \n\n• Radio buttons \n\n• Menus and drop-down lists \n\n• File\
    \ select boxes \n\n• Hidden controls \n\n• Password boxes \n\n• Object controls"
