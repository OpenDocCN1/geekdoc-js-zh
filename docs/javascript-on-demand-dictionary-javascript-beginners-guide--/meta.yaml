- md: "\n```javascript\n// if not found, returns -1\nalphabet.indexOf(123); // -1\n\
    ```\n\nIn the latest specifications, `array.includes(value, fromIndex)` returns\
    \ boolean indicating the value is present or not.\n\nThere are actually dozens\
    \ of array methods. All of them are described with many examples and uses in the\
    \ Mozilla Developer Network, under the section Array.prototype¹, which is the\
    \ object containing all methods and behaviors inherited by every array.\n\n> ¹https://developer.mozilla.org/Web/docs/JavaScript/Reference/Global_Objects/Array/prototype\n\
    \n# prototype and prototypal inheritance\n\nWhen a new variable has the value\
    \ of an object, an array, or a function, it comes by default with methods that\
    \ nobody explicitly assigned: these are already part of the core functionality;\
    \ they are properties, and methods, inherited from another object.\n\nThere are\
    \ two mechanisms to inherit from other objects: via direct link or via special\
    \ functions used to initialize objects and setup their inheritance. The first\
    \ direct link way to explicitly inherit properties between objects, is the following:\n\
    \n```javascript\n// generic object referenced as a `person` // it has two properties:`name`\
    \ and `age` // and a method in charge of increasing the age var person = {\n\n\
    name : 'anonymous',\nage: 0,\nbirthday: function () {\n\nthis.age++;\n}\n}\n```\n\
    \n```javascript\n// this is just me, inheriting\n// properties and methods\n//\
    \ from the `person` object\n// using a method of the globally always available\
    \ // `Object` “constructor” (described later on) var me = Object.create(person);\n\
    ```\n\n```javascript\nme.name = 'Andrea';\nconsole.log(me); // {name: 'Andrea'}\n\
    console.log(person); // {name: 'anonymous', age: 0}\n```\n\nUsually the browser\
    \ console will only show objects “own” properties, ignoring the inherited ones.\
    \ That is why logging the variable me, you see only the name-property, even if\
    \ there's more in there.\n\n# genericA.isPrototypeOf(genericB) → boolean\n\nIn\
    \ JavaScript, one of the methods available by default is `isPrototypeOf()`, which\
    \ reveals possible inheritance information between two objects. If you consider\
    \ the previous variables person and me as an example, you can assume the result\
    \ of the `person.isPrototypeOf(me)` invocation will be true. But what does it\
    \ mean, exactly?\n\n```javascript\n// how does the console show me?\nconsole.log(me);\
