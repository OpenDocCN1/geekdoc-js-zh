    \ be invoked every time\n  // a new Rectangle(w, h) is created\n  constructor(width,\
    \ height) {\n    // the `this` invocation context will be\n    // the freshly\
    \ created new object\n    // you assign the received arguments to use them later\
    \ on\n    this.width = width;\n    this.height = height;\n  }\n}\n// ← note that\
    \ a class definition doesn't need a comma between methods\n```"
