    \ var twoXtwo = new Square(2);\nconsole.log(twoXtwo.area); // 4 -> 'cause 2 *\
    \ 2 == 4 ^_;\n```\n\n## super\n\nWhenever the word super, or sometimes parent,\
    \ appears in Object Oriented Programming, it refers to the closest ancestor class\
    \ from which the current execution inherited.\n\nIt is a special keyword that\
    \ should never be used outside a generic class method. It used to be a reserved\
