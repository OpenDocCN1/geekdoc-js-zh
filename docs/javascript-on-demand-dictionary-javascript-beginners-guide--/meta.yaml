    \ {\n  console.warn(errorObject.message);\n}\n// 注意 finally 是可选的\n```\n\n```javascript\n\
    // 创建一个会抛出错误的属性\nvar me = Object.defineProperty({}, 'name', {\n  enumerable: true,\n\
    \  get: function () { return 'Andrea'; },\n  set: function () {\n    throw new\
    \ Error('I already have a name');\n  } // throw 是用于通知程序发生 Error 的关键字\n});\n\n\
    console.log(me.name); // Andrea\ntry {\n  me.name = 'Robert';\n} catch (whatHappened)\
    \ {\n  console.warn(whatHappened);\n} finally {\n  console.log('Hello ' + me.name);\
    \ // 'Hello Andrea'\n}\n```\n\n过度使用这些机制很少是一个好主意。在周围有太多的 `try/catch` 语句并不意味着代码更安全或对错误产生免疫。相反，它可能表明我们对可能出现的问题完全没有控制，甚至更糟糕，完全不知道有多少事情可能出错。我们有更好的方法来控制我们的应用程序，而且此外，`try/catch`\
    \ 语句还会显著减慢代码的执行。总结来说：谨慎地使用此功能，仅在必要时使用，并结合常识。\n\n错误对象有一个 `message` 属性，它是一个字符串，包含了在创建\
    \ `new Error(\"info\")` 对象时传递的信息。\n\n# 什么描述符对应什么\n\n有多种定义属性的方法，既方便又让人困惑。当涉及到描述符时，有很多小问题可以讨论，但最好遵循\
    \ JavaScript 核心中提供的常用约定。\n\n例如，每个通用对象的属性赋值都将是一个可写的、可配置的且枚举的描述符，其值将完全是提供的值。\n\n\
    # 常用属性描述符\n\n```javascript\nvar me = {name: 'Andrea'};\nme.age = 37;\n```\n\n\
    `name` 和 `age` 属性将具有类似的描述符。下面你可以看到 `name` 的描述符：\n\n```javascript\n// me['name']\
    \ 属性描述符的表示 \n{\n  configurable: true, enumerable: true, writable: true, value:\
    \ \n  'Andrea'\n}\n```\n\n当你设置像 `name` 或 `age` 这样的通用属性时，使用繁琐的 `Object.defineProperty`\
    \ 方法实际上毫无意义。特别是所有的默认配置都是 `false` 而不是 `true`，而且不需要输入那么多！\n\n# 常用类和原生方法描述符\n\n虽然数据属性（如名称或年龄）通常是那些迭代、收集或操作的对象，但在我们的路径中出现方法通常并不方便。特别是当使用实例时，所有方法都是继承的，你并不希望它们出现在你的\
    \ `for/in` 循环中。没有必要知道每个对象都会有一个 `toString`。\n\n因此，JavaScript 中提供的所有原生方法都可以描述如下：\n\
    \n```javascript\n// 原生 Object.prototype['toString'] 描述符的表示\n{\n  configurable:\
    \ true,\n  enumerable: false, // ← 永远不会出现在 for/in 循环中\n  writable: true,\n  value:\
    \ function toString() { [native code] }\n}\n```\n\n原生描述符是可配置和可写的实际上是很幸运的，这意味着它们在需要时可以被重新赋值和修复。\n\
    \n# 常用防御性方法描述符\n\n如果我们为了自己的目的创建一个类，我们可能希望确保它的方法在应用程序执行期间无法在其他地方修改。\n\n在这种情况下，我们可能希望直接在原型中设置方法，如下：\n\
    \n```javascript\n// 在类或函数原型中直接定义属性方法\nObject.defineProperty(Constructor.prototype,\
    \ 'method', {\n  // 默认值 // enumerable: false, configurable: false, writable: false\
    \ \n  // 之后无法补丁或更改此方法\n  value: function () { /*...*/ }\n});\n```\n\n# 常用懒加载属性描述符\n\
    \n当我们讨论懒属性（lazy properties）时，指的是那些只有在我们第一次需要它们之后才会获得预期值的属性。想象我们要买一辆车。默认情况下，它带有许多功能（属性），但我们可以要求更多的属性。在纸面上，汽车有一个连接我们设备的\
    \ USB 端口，但只有当我们要求时它才会被配置，而不是默认如此。\n\n```javascript\nclass CarOrder {\n  constructor(chosenColor)\
    \ {\n    // color 是在汽车创建期间设置的自有属性\n    this.color = chosenColor;\n  }\n\n  //\
    \ 作为懒属性的 usbConnector\n  get usbConnector() {\n    // 第一次时按需配置\n    Object.defineProperty(\n\
    \      this,\n      'usbConnector',\n      {\n        configurable: true,\n  \
    \      value: 'connected'\n      }\n    );\n    return this.usbConnector;\n  }\n\
    }\n```\n\n我们需要使用 `defineProperty` 来配置懒描述符的原因是，如果我们尝试直接设置 `this.usbConnector =\
    \ {}`，我们将不可避免地导致 `CarOrder` 类中已定义的设置器（setter）。此外，如果我们将来能够更改或替换它，我们应该将其设为可配置的。\n\
    \n关于描述符的最后一个重要信息是，你不仅可以设置它们，还可以随时检索它们。让我们尝试玩玩这个，验证我们到为止所学的所有内容。\n\n```javascript\n\
    // 对最访问内容的某些检查\nconsole.log(Object.getOwnPropertyDescriptor(Object, 'prototype'));\n\
    console.log(Object.getOwnPropertyDescriptor(window || global, 'toString'));\n\
    console.log(Object.getOwnPropertyDescriptor({name: 'Robert'}, 'name'));\n\n\n\
    # delete\n\n当存在可配置的属性时，我们不仅再次使用 `defineProperty` 来更改它的描述符，还可以使用 `delete` 从对象中删除该属性。\n\
    \n```javascript\n// 还记得吗？默认情况下所有属性都被定义为可配置的\nvar me = {name: 'Andrea'};\ndelete\
    \ me.name; // true\n'name' in me; // false\nconsole.log(me.name); // undefined\n\
    ```\n\n返回的布尔值表示：要么没有要做，因此该属性可以没有问题地重新赋值给该对象，要么该属性存在但被删除了。记住：只有当自有属性是不可配置且无法删除时，`delete`\
    \ 返回 `false`。\n\n# Object.getOwnPropertyNames(obj) → 所有名称数组\n\n我们已经提到过 `object.hasOwnProperty(propName)`，但我们如何获取直接定义在通用对象上的属性呢？\n\
    \n```javascript\n// 可能我不想告诉所有人我的年龄\nvar me = { name: 'Andrea' };\nObject.defineProperties(me,\
    \ { age: { writable: true, value: 37 } });\nfor (var k in me) console.log(k, me[k]);\n\
    // 上述输出了 `name` `Andrea` ... 但年龄呢？\nconsole.log(Object.getOwnPropertyNames(me));\
    \ // ['name', 'age']\n```\n\n# Object.defineProperties(obj, descriptors) → obj\n\
    \n`Object.defineProperties` 的复数版本某种简化了多个描述符的赋值，因为它需要的输入更少（这是一个加分项！）。\n\n```javascript\n\
    var me = {};\n\nObject.defineProperties(me, {\n  name: {enumerable: true, value:\
    \ 'Andrea'},\n  age: {enumerable: true, value: 37}\n});\n```\n\n"
