    \ have `width` and `height` properties, assigned when\n  // created\n  return\
    \ this.width * this.height;\n}\n// note: no comma required here either\n```\n\n\
    // a `Rectangle` instance example\nvar myDesk = new Rectangle(5, 3);\nconsole.log(myDesk.area());\
    \ // 15 as 5 * 3 // another reference\nvar myTV = new Rectangle(16, 9);\nconsole.log(myTV.area());\
    \ // 144\n\nWhenever in JavaScript the special keyword new is used, the engine\
    \ expects a class or a “constructor” right afterward in order to create an object\
    \ linked to the constructor’s own prototype.\n\n## constructor\n\nWhenever you\
    \ declare a function, the engine will automatically provide its prototype object.\n\
    \n```javascript\nfunction justAFunction() { /* * and it could do anything it\n\
    wants */ }\n\nconsole.log(\n  // who put this object here\n  justAFunction.prototype,\
    \ // {} {} // is that inherited from\n  the global Function? justAFunction.prototype\
    \ === Function.type.prototype // false\n);\n```\n\nGenerally speaking, every JavaScript\
    \ function can be used to create objects linked to their own prototype, which\
    \ is an object that contains only one property: the constructor\n\n```javascript\n\
    function linkMe() {} // simple function\n// linkMe becomes special the moment\
    \ we invoke it via new\nvar obj = new linkMe();\n```\n\n```javascript\nconsole.log(\n\
    \  // we have created a prototypal chain\n  linkMe.prototype.isPrototypeOf(obj),\
    \ // true // by default\n  we also have inherited the constructor // which is\
    \ nothing\n  else but the function linkMe obj.constructor === linkMe, //\n  true\
    \ // and such constructor is actually inherited // since it is\n  deeds part of\
    \ linkMe.prototype itself linkMe.prototype.constructor === linkMe // true\n);\n\
    ```\n\nGoing back to the Object.create(fromAnotherObject) mechanism you saw previously,\
    \ you can use functions to create new instances, as in the following operation:\n\
    \n```javascript\nfunction Shape() {} // dummy function used only to inherit\n\
    its prototype\n// creating a chain using the Shape.prototype var oneShape =\n\
    Object.create(Shape.prototype);\n// is the same as creating a new Shape var anotherShape\
    \ =\nnew Shape();\n```\n\n```javascript\nconsole.log(\n  Shape.prototype.isPrototypeOf(oneShape),\
    \ // true\n  Shape.prototype.isPrototypeOf(anotherShape) // true\n);\n```\n\n\
    The biggest difference between these two approaches, is that using new Shape()\
    \ inevitably invokes the shape function, implicitly using the fresh newly created\
    \ instance as an execution context.\n\nThat in turn will, for example, give us\
    \ the ability to do some setup in there.\n\n```javascript\n// as a naming convention,\
    \ classes are PascalCase (capital first letter)\nfunction Person(name) {\n  this.name\
    \ = name;\n}\n```\n\n```javascript\nvar me = new Person('Andrea'); // the class\
    \ way\n```\n\n```javascript\n// the equivalent and explicit way\nvar me = Object.create(Person.prototype);\
    \ // the procedural way // invoke the Person to setup me.name\n// otherwise there\
    \ won't be any name property at all Person call(me, 'Andrea');\n```\n\nIn either\
    \ case, the generic object created either via Person, or from its prototype, inherits\
    \ a constructor-property which is Person itself, like it was for the generic function.\n\
