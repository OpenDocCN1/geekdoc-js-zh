    \ inherits directly from Rectangle.prototype\"\n\nThere is no concrete limit to\
    \ the amount of prototypes an object can inherit from, but there is only one direct\
    \ \"extend\", which in JavaScript is only possible between two classes.\n\nAccordingly,\
    \ when we use the term \"extend\" we can only refer to a very specific relationship.\n\
    \n```javascript\n// a Rectangle constructor\nfunction Rectangle(w, h) {\n  this.width\
