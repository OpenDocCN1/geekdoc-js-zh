  mdcn: "\n\n## class\n\n在大多数现代 JavaScript 实现中，`class` 是一个非常特殊的关键字，用于定义通过其名称创建的每个对象的行为。下面是一个现代\
    \ JS 语法的示例 * 该语法可能在旧的浏览器或 JS 引擎中无法工作 *\n\n```javascript\n// 定义一个通用的矩形行为\nclass\
    \ Rectangle {\n  // 每当创建一个新的 Rectangle(w, h) 时，此方法都会被隐式地调用\n  constructor(width,\
    \ height) {\n    // `this` 的调用上下文将是\n    // 新创建的实例\n    // 你将接收到的参数赋值给它们以便稍后使用\n\
    \    this.width = width;\n    this.height = height;\n  }\n}\n// ← 注意，类定义中的方法之间不需要逗号\n\
    ```\n\n```javascript\n// 定义包含一个 `area()` 方法\n// 该方法将被每个 `new Rectangle` 继承\narea()\
    \ {\n  // 执行上下文将是调用 area 方法的 `Rectangle` 实例\n  // 每个实例都拥有 `width` 和 `height` 属性，\n\
    \  // 这些属性是在创建时分配的\n  return this.width * this.height;\n}\n// 注意：这里也不需要逗号\n```\n\
    \n// Rectangle 实例示例\nvar myDesk = new Rectangle(5, 3);\nconsole.log(myDesk.area());\
    \ // 因为 5 * 3 所以是 15 // 另一个引用\nvar myTV = new Rectangle(16, 9);\nconsole.log(myTV.area());\
    \ // 144\n\n每当在 JavaScript 中使用特殊关键字 `new` 时，引擎期望后面紧跟一个类或“构造函数”，以便创建一个与构造函数自身的原型相连的对象。\n\
    \n## constructor\n\n每当你声明一个函数时，引擎都会自动提供它的原型对象。\n\n```javascript\nfunction justAFunction()\
    \ { /* * 并且它可以做任何想做的事 */ }\n\nconsole.log(\n  // 谁把这个对象放在这里的\n  justAFunction.prototype,\
    \ // {} {} // 它是继承自\n  // 全局 Function 吗？justAFunction.prototype === Function.type.prototype\
    \ // false\n);\n```\n\n通常，每个 JavaScript 函数都可以用于创建与其自身的原型相连的对象，该原型是一个只包含一个属性的对象：`constructor`\n\
    \n```javascript\nfunction linkMe() {} // 简单函数\n// 一旦我们通过 new 调用它，linkMe 就会变得特殊了\n\
    var obj = new linkMe();\n```\n\n```javascript\nconsole.log(\n  // 我们创建了一个原型链\n\
    \  linkMe.prototype.isPrototypeOf(obj), // true // 默认情况下\n  // 我们也继承了构造函数 // 除了\n\
    \  // 函数 linkMe 之外没有别的 obj.constructor === linkMe, //\n  true // 这种构造函数实际上被继承了\
    \ // 因为它是\n  // linkMe.prototype 自身的一部分 linkMe.prototype.constructor === linkMe\
    \ // true\n);\n```\n\n回到你之前看过的 `Object.create(fromAnotherObject)` 机制，你可以使用函数来创建新实例，如下操作所示：\n\
    \n```javascript\nfunction Shape() {} // 仅用于继承其原型的虚哑函数\n// 使用 Shape.prototype 创建链\
    \ var oneShape =\nObject.create(Shape.prototype);\n// 等同于创建一个新的 Shape var anotherShape\
    \ =\nnew Shape();\n```\n\n```javascript\nconsole.log(\n  Shape.prototype.isPrototypeOf(oneShape),\
    \ // true\n  Shape.prototype.isPrototypeOf(anotherShape) // true\n);\n```\n\n\
    这两种方法之间最大的区别在于，使用 `new Shape()` 会不可避免地调用 shape 函数，并隐式地使用新创建的实例作为执行上下文。\n\n这反过来例如会赋予我们我们在其中进行一些设置的能力。\n\
    \n```javascript\n// 按照命名规范，类使用 PascalCase（首字母大写）\nfunction Person(name) {\n  this.name\
    \ = name;\n}\n```\n\n```javascript\nvar me = new Person('Andrea'); // 类的方式\n```\n\
    \n```javascript\n// 等效且显式的方式\nvar me = Object.create(Person.prototype); // 过程化方式\
    \ // 调用 Person 来设置 me.name\n// 否则将完全没有 name 属性 Person call(me, 'Andrea');\n```\n\
    \n在任何种情况下，通过 `Person` 或从其原型创建的通用对象，都继承一个 `constructor` 属性，该属性本身就是 `Person`，就像对于通用函数来说一样。\n\
    \n总结一下：当我们谈论 JavaScript 中的构造函数时，指的是一种特殊方法，一旦任何实例通过 `new` 关键字创建，它就会隐式地初始化该实例。\n\
    \n## instance\n\n每当对象被创建时，通过 `Person` 或从其原型创建的通用对象，都继承一个 `constructor` 属性，该属性本身就是\
    \ `Person`，就像对于通用函数来说一样。\n\n总结一下：当我们谈论 JavaScript 中的构造函数时，指的是一种特殊方法，一旦任何实例通过 `new`\
    \ 关键字创建，它就会隐式地初始化该实例。\n\n每当对象被创建时，通过 `Person` 或从其原型创建的通用对象，都继承一个 `constructor`\
    \ 属性，该属性本身就是 `Person`，就像对于通用函数来说一样。\n\n总结一下：当我们谈论 JavaScript 中的构造函数时，指的是一种特殊方法，一旦任何实例通过\
