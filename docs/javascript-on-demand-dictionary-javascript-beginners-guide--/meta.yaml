- md: '

    we are going to use modern features.


    **have you heard about transpilers?** I have not only heard about them, but I
    use them, too. For example, most of the agnostic examples in this glossary have
    been successfully tested via babel-node, a command line interface (CLI*) that
    brings the latest features from the latest ECMAScript specifications to node.js.
    Would I use them in production? It depends!


    **what does “in production” mean?** It’s the official version, currently offered
    to every user, of a generic website, application, framework, design or program.
    It’s what we deliver, as opposite to what we “proto-type” to quickly test our
    ideas.


    **what does “prototype” mean?** I know this glossary might have been confusing,
    but when it comes to non-technical JS discussions, a prototype is a sketch, or
    a quickly created version of a final product, that should probably never go to
    production as it is.


    **which FrameWork, library or tool should I use?** The one that solves your problem,
    if any. Otherwise you are better off with what the frontend or backend core already
    offers.


    - is JavaScript for web pages only? These days it''s hard to find electronics
    that don''t run JS. Smart watches, routers, your current computer, or even colorful
    led light bulbs, are compatible with some JavaScript engine or are already running
    it.


    - is JavaScript memory safe? There is a Garbage Collector that takes care of cleaning
    up the mess we created. What we can do is to help it doing its job, for example
    by not holding values indefinitely.


    JavaScript F.A.Q. on demand 94


    There surely are other questions that I''ve missed here, to which I encourage
    you to look for answers. A good place with decent, usually up to date documentation
    is the MDN - Mozilla Developer Network.


    There are many other topics I didn''t have the chance to talk about, such as:
    Web Workers, Service Worker, IndexedDB, local and sessionStorage, Ajax via XMLHttpRequest
    and the recent Fetch API, but I believe that if you made it this far, you are
    now able to understand most online technical articles.


