    \ `toString` 方法，因为每当你调用一个未重定义的通用 `toString()` 时，访问的都是它。\n\n## 共享属性 \n\n在特别讨论类和原型时，以及当存在私有作用域和某些私有引用时，“共享”一词描述的是一个对象或函数被许多不同的地方、为了相似的用途以及通过许多对象使用的事实。\n\
    \n```javascript\nfunction SharedData() {}\nSharedData.prototype.data = {}; //\
