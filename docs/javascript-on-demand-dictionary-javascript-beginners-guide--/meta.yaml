    \n## comments (注释)\n\n在编程中，注释是对代码本身有意义的描述。它们在代码执行期间会被忽略，可以可以是 // 单行注释，遇到新行时结束，或者是\
    \ /* 多行注释 */。\n\n## operators (运算符)\n\n如果你拿一个计算器，你可以在上面看到数字和算术运算。\n\n在编程中，这基本上是一样的，有算术、比较、赋值、条件和其他操作。我们可以在任何控制台中直接使用它们。\n\
    \n```javascript\n// let's do some math\n1 + 2; // shows 3\n3 * 5; // shows 15\n\
    1 - 2; // shows -1\n```\n\n在计算器中，等号 = 表示“显示结果”，而在 JavaScript 中它意味着“赋值结果”。你可以使用\
    \ = 符号来存储某些结果以便稍后重用。\n\n```javascript\nvar result = 3 * 7; result; // shows 21\n\
    如果你想比较两个不同的值，可以使用三等等运算符 ===\n2 === 2; // true → 当然，相同的数字，它等同于它自己\n2 === 3; //\
    \ false → 嗯，2 和 3 不同，所以它们不能相同\n```\n\n为了验证这两个值是不同的，你可以使用“非”版本。\n\n```javascript\n\
    2 !== 2; // false → 2 是这些，所以它们不可能是不同的 \n2 !== 3; // true → 当然 2 和 3 不同。它就是 2！\n\
    ```\n\n“非”运算符可以通反转其值来否定某些逻辑条件。例如，!true === false，反之亦然。\n\n如果你想说明不同的值实际上是相同的，可以使用逻辑运算符。\n\
    \n```javascript\n(4 + 5) === (5 + 4) && (2 x 3) === (3 x 2); // true → 交换律\n```\n\
    \n书中后面有一个专门关于这些操作的章节，所以我们现在先继续关注术语。\n\n## parenthesis (括号)\n\n可以通过括号对不同的操作序列分组。这会立即变得更易读，使开发者的意图变得清晰。\n\
    \n例如，如果有人读取诸如 2 * 3 + 4 的操作，他们会认为结果是 10。实际上，你是想让 3 和 4 的和乘以 2，为了让你自己的眼睛和 JavaScript\
    \ 程序解释器都看清楚，你应该写成 * (3 + 4)*，这消除了对结果的所有疑虑。\n\n括号通常简称为 *parens*，也用作函数语法的一部分，这将在后文中描述。\n\
    \n## brackets (中括号)\n\n在 JavaScript 中有大括号 {}，或简称为 *braces*，以及方括号 []。这些可以用来创建对象，在方括号的情况下，还可以访问它们的值。\n\
    \n```javascript\nvar obj = {hello: 'world'}; // 对对象的通用引用\nvar arr = ['a', 'b',\
    \ 'c']; // 对 Array 对象的通用引用\narr[0]; // 显示字母 'a'\nobj.hello; // \"world\"\n// ↑\
    \ 也可以通过 obj['hello'] 访问\n```\n\n## references (引用)\n\n引用就像一个指向特定值的符号链接。想象一张自拍照，照片可以被看作是对一个普通人的引用：你不需要让这个人出现在房间里就能看到她长什么样或她在做什么，照片就足够了。\n\
    \n## variables (变量)\n\n变量通常是一个用于引用通用值的有意义的名字。回到自拍照的例子，var myPhoto = new Selfie();\
    \ 创建了一个指向我的自拍的引用，名字是 myPhoto。我可以把它留给自己，像明信片一样发送出去，接收来自其他人的自拍，并随时重新给它赋值值。\n\n```javascript\n\
    // 创建一个引用我自拍的变量\nvar myAvatar = new Selfie();\n// ... 5 年后 ...\n\n// 保存旧照片\n//\
    \ 通过使用新变量名 var oldMe = myAvatar;\n\n// 然后拍一张新自拍\n// 简单地将其重新赋值给同一个变量\nmyAvatar\
    \ = new Selfie();\n```\n\nJavaScript 变量名的常用约定是 var camelCase = anyValue;，始终以小写开头，并最终通过大写字母将多个单词组合在一起。\n\
    \n如果复合变量名中包含单个字符或缩写，组合多个大写字母是可以的。\n\n```javascript\n// 常见命名约定示例\nvar thisIsAGoodNameForVariable\
    \ = anyValue;\nvar result = loadSDK();\nobject.genericProperty = genericValue;\n\
    ```\n\n## constants (常量)\n\n常量类似于变量，但只能创建和赋值一次。在现代 JavaScript 引擎中，可以通过 `const`\
    \ 关键字显式创建。\n\n```javascript\n// 代替 var MY_CONSTANT = 'staticValue';\nconst MY_CONSTANT\
    \ = 'staticValue';\n// 它不会改变值 MY_CONSTANT = 'nope';\nMY_CONSTANT; // 显示 \"staticValue\"\
    \n```\n\n它们在大多数流行编程语言中的常用命名约定是：EVERY-THING_IN_UPPER_CASE_WITH_UNDERSCORE_BETWEEN_WORDS\n\
    \n这类变量经常（但不是限于）用于描述永远不会改变且具有固定值（通常是为人知的）的数据。\n\n## types (类型)\n\n当引用一个值的变量被创建时，可以假设它有一个类型。回到自拍照的例子，var\
    \ myPhoto = new Selfie(); 例子，你可以说 myPhoto 的类型是“object”，它在某种程度上描述了你可以对它做什么：看它、分享它、丢弃它等。\n\
    \n- **boolean (布尔值)**：由两个可能的值表示：true 和 false。\n- **number (数字)**：由整数表示，如 0,1,2,-3，浮点数如\
    \ 0.9,1.2,-1，以及少数特殊情况如 Infinity 和 NaN。\n- **string (字符串)**：由单引号或双引号内的任何内容表示：'I\
    \ am a string' 和 \"so am I\" 都是有效的字符串。大多数现代 JavaScript 引擎也支持反引号包裹的字符串。\n- **undefined\
    \ (未定义)**：由值的缺失表示。默认情况下，有一个名为 undefined 的全局引用。\n- **object (对象)**：主要由大括号 {} 或方括号\
    \ [] 表示。对象是键值对的容器。\n\n"
