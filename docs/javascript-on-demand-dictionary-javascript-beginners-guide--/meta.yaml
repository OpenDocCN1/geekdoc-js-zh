- md: "\nOnce there is a way to retrieve all named properties of an object and their\
    \ descriptors, we have everything we need to analyze any kind of objects.\n\n\
    ## Object.keys(obj) → arrayOfOwnEnumerableNames\n\nThis “public” method is similar\
    \ to Object.getOwnPropertyNames but it returns an array of the object’s own enumerable-only\
    \ properties.\n\n## public and public static\n\nWe have been using methods such\
    \ as Object.keys among others which are exposed through the globally available\
    \ Object class. There also are other methods, in most of the native classes.\n\
    \nArray.isArray(obj), String.fromCodePoint(0x1F4A9), Number.isNaN(0/0), just to\
    \ name a few. \nThese are methods related to the constructors they are attached\
    \ to. It is possible to define similar “static” methods ourselves, in the good\
    \ old way.\n\n```javascript\nfunction Rectangle(w, h) {\n  this.width = w;\n \
    \ this.height = h;\n}\n```\n\n// Remember: functions are just like objects\n\n\
    ```javascript\nRectangle.isSquare = function (instance) {\n  return instance.width\
    \ === instance.height;\n};\n```\n\n```javascript\n// let's test two different\
    \ rectangles var spongeBob = new Rectangle(2, 3); spongeBob.pants = new Rectangle(2,\
    \ 2);\n```\n\n```javascript\n// invoke the Rectangle.isSquare\nconsole.log(Rectangle.isSquare(spongeBob));\
    \ // false\nconsole.log(Rectangle.isSquare(spongeBob.pants)); // true\n```\n\n\
    In most updated JavaScript engines, you actually have a special static property\
    \ for that.\n\n```javascript\nclass Rectangle {\n  static isSquare(instance) {\n\
    \    return instance.width === instance.height;\n  }\n  constructor(w, h) {\n\
    \    this.width = w;\n    this.height = h;\n  }\n}\n```\n\nThe Rectangle.isSquare\
    \ method has the following characteristics:\n\n- it's not inherited, but it's\
    \ publicly available via the Rectangle constructor\n- it's static, that is it\
    \ is not expected to be used, or being invoked, with an execution context at all.\
    \ We can even write Rectangle.isSquare.call(null, spongeBob) and it still returns\
    \ true if that instance is a square. No this context involved whatsoever!\n\n\
    The latter conditions are the same for every public static function. For instance,\
    \ Object.keys doesn't need the Object context in order to be executed, and it's\
    \ also not inherited.\n\n```javascript\nvar keys = Object.keys; // public static\
    \ Object.key function shortcut\nkeys({a,'a'}); // so that we can directly use\
    \ it later on\n```\n\n## extends\n\nThe inheritance journey started by talking\
    \ about objects inheriting from other objects. It ends up now by talking about\
    \ classes extending other classes. There is no reason to freak out, it's just\
    \ the shorter answer to the following question:\n\n- Q: \"What is Square?\"\n\
