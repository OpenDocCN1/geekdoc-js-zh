- md: "\nEverything we do daily, and everything that surrounds us is based on basic\
    \ else flows, and the same can be applied to any piece of software that may or\
    \ may not do something.\n\nThe following code is a made up example on how our\
    \ driving routine is based on conditions.\n\n```javascript\nfunction letsDrive(car,\
    \ where) {\n  // we start the engine only if off\n  if (car.isEngineOff()) {\n\
    \    car.startEngine();\n  }\n  // let's move carefully in case of rain\n  if\
    \ (global.weather.isRaining()) {\n    car.goSlowerThanUsual();\n  } else {\n \
    \   car.goUsualSpeed();\n  }\n\n  // how about the radio?\n  if (Date.now() <\
    \ global.today.LATE_MORNING) {\n    car.radio.findMorningNews(); // every day\n\
    \  } else if (where === 'beach') {\n    car.radio.findSurfingSongs(); // on vacation\n\
    \  } else {\n    car.radio.findRockNRoll(); // every evening\n  }\n}\n```\n\n\
    ```javascript\nvar myNewCar = new Car();\n// and every time I need to drive letsDrive(myNewCar,\
    \ 'my office');\n```\n\nAn if doesn't always require an else, and there could\
    \ be an optional else if in between.\n\n## ternary operator\n\nThe most used inline\
    \ if...else shortcut is provided by the ternary operator that looks like a question\
    \ mark: ?\nIt does one thing: it returns its first value if the condition is true,\
    \ the second one, if the condition evaluates to false.\n\n```javascript\nvar ternaryResult\
    \ = (14 / 7 === 2) ? 'correct' : 'back to school!';\n```\n\n## switch statement\n\
    \nIf the ternary operator is a shortcut for an if...else, the switch statement\
    \ is the shortcut for a long list of if...else if...else if...else conditions.\n\
    \n```javascript\nfunction isLetterInAFRange(letter) {\n  var result;\n  // switch\
    \ syntax, pass any value\n  switch (letter) {\n    // it will be compared for\
    \ each case like\n    // if (letter === 'G') ...\n    case 'G':\n      // if the\
    \ comparison is true, it'll execute\n      // the following operation\n      result\
    \ = false;\n      // you can arbitrary break it, exiting from the switch break;\n\
    \n      // or you can create different entry points, a.k.a. \"fall-through\" \n\
    \    case 'A': // else if (letter === 'A')\n    case 'B': // else if (letter ===\
    \ 'B')\n    case 'C': // else if (letter === 'C')\n    case 'D': // else if (letter\
    \ === 'D')\n    case 'E': // else if (letter === 'E')\n    case 'F': // else if\
    \ (letter === 'F')\n      result = true; // all these conditions return true\n\
    \      break;\n    // no condition satisfied? We have a default fallback\n   \
    \ default:\n      result = false;\n      break; // optional within the `default`\
    \ part\n  }\n  return result;\n}\n```\n\nThe number of else if (letter === 'A')\
    \ { ... } else if (letter === 'B') { ... } would have made your code look like\
    \ an octopus designed by Picasso.\n\n## logical || operator (read as OR)\n\nInstead\
    \ of many else...if that would result in performing the same action you can use\
    \ ||.\nAccordingly, the previous example can be re-written in the following way:\n\
    \n```javascript\nfunction isLetterInAFRange(letter) {\n  if (\n    letter ===\
    \ 'A' || letter === 'B' || letter === 'C' || letter === 'D' ||\n    letter ===\
    \ 'E' || letter === 'F'\n  ) {\n    return true; // whenever a function returns,\
    \ it exits from it\n  }\n  // this gives you the ability to avoid a redundant\n\
    \  return false; // `else` because there's really nothing else to do\n}\n```\n\
    \n## logical && operator (read as AND)\n\nOn the contrary of the || operator,\
    \ the && operator keeps checking conditions only if the previous one has been\
    \ validated. This is probably one of the most important concepts to keep in mind.\n\
    \nFor instance, the following ATM operations will not be executed together, but\
    \ one at a time.\n\n```javascript\nfunction getMoney() {\n  if (\n    cardIsValid()\
    \ && pinCodeIsValid() && userSelectedAmount()\n  ) {\n    // is the card valid?\
    \ OK ... next\n    // does the user know the pin?\n    // Next!\n    // does the\
    \ user need a certain\n    // amount of money?\n    // OK... next\n    return\
    \ getAmountSelectedByUser(); // all good, everything went OK\n  }\n  return 0;\
    \ // something went wrong above\n}\n```\n\nIt is also possible to combine both\
    \ operators, somehow simulating what the ternary one can do.\n```javascript\n\
    // ternary operator via boolean logic\nconsole.log((1 < 2) && 'OK' || 'EPIC FAIL');\
    \ // shows 'OK'\n// equivalent of the ternary operator\nconsole.log((1 < 2) ?\
    \ 'OK' : 'EPIC FAIL'); // shows 'OK' too\n```\nHowever, whenever we need a ternary\
    \ logic we should probably use the appropriate operator.\n\n## truthy and falsy\
    \ values\n\nThe if or else...if statement, as well as ternary or logical operators,\
    \ are very merciful. It doesn’t matter if we check an actual boolean type true\
    \ or false value. The value false, together with the number 0, the empty \"string\"\
    , the null value, the undefined, and the exceptional NaN References, are considered\
    \ \"falsy\" values. This means that everything else is considered \"truthy\",\
    \ as if it was a true boolean logic,\n\n```javascript\nif ({}) console.log('any\
    \ object is truthful');\nif ([]) console.log('even empty arrays');\nif (-1) console.log('or\
    \ negative numbers');\nif (function(){}) console.log('or functions');\n```\n\n\
    ```javascript\n// falsy values ... all checked, not a single one passes\nif (false\
    \ || NaN || \"\" || 0 || undefined) {\n  console.log('this message will never\
    \ be shown');\n}\n```\n\n## antipattern\n\nNot necessarily related to the boolean\
    \ logic, the term anti-pattern indicates some bad practice, or some logic with\
    \ well-known and undesired side effects in our code. For instance, simulating\
    \ a ternary operator, instead of using it, constitutes an anti-pattern.\n\n```javascript\n\
    true ? console.log('FAIL') : console.log('OK'); // 'OK' → correct\ntrue && console.log('OK')\
    \ || console.log('FAIL'); // 'OK' then FAIL\nThis happens because console.log\
    \ always returns undefined which is \"falsy\"!\n```\n\n## DOM\n\nThe Document\
    \ Object Model refers to “the parallel world” represented by any page. It’s a\
    \ huge set of interfaces that describe the capabilities and behaviors of every\
    \ element. Whenever we deal with an object that comes from a page, we can call\
    \ it Node.\n\n## tree\n\nMany DOM nodes can contain other elements. The hierarchy\
    \ is nested, from a universal root down to every node. Following there is an example\
    \ of a simple HTML page.\n\n```javascript\n{\n  nodeName: 'html',\n  children:\
    \ [\n    {\n      nodeName: 'head',\n      children: [\n        { nodeName: 'title'\
    \ },\n        { nodeName: 'meta' },\n        { nodeName: 'link' }\n      ]\n \
    \   },\n    {\n      nodeName: 'body',\n      children: [\n        {\n       \
    \   nodeName: 'main',\n          children: [\n            {\n              nodeName:\
    \ 'section',\n              children: [\n                { nodeName: 'article'\
    \ },\n                { nodeName: 'article' }\n              ]\n            },\n\
    \            {\n              nodeName: 'section',\n              children: [\n\
    \                { nodeName: 'article' },\n                { nodeName: 'article'\
    \ }\n              ]\n            }\n          ]\n        }\n      ]\n    }\n\
    \  ]\n}\n```\n\nDescribing the tree above in JS, you can imagine the following\
    \ object.\n\nIt must be said that DOM nodes provide much more than just a nodeName\
    \ or a children property, and the best place to read documentation about it is\
    \ the W3C website.\n\nThe entire reference is explained through interfaces, and\
    \ its written in Web IDL format.\n\n## EventTarget registration interface\n\n\
    As an example, if you read the definition of an EventTarget (an interface implemented\
    \ by almost every DOM node one can think of of you you’ll find it described as\
    \ following:\n\n```idl\n// the interface name, if it implements other interfaces\
    \ it will have a colon after the name and what it implements interface EventTarget\
    \ {\n  // the returned type void\n  // the method or property name\n  addEventListener(\n\
    \    // in ParameterType and name\n    in DOMString type,\n    in EventListener\
    \ listener,\n    in boolean useCapture);\n\n  void removeEventListener(\n    in\
    \ DOMString type,\n    in EventListener listener, in boolean useCapture);\n\n\
    \  boolean dispatchEvent(in Event evt) raises(Exception);\n};\n```\n\nThe above\
    \ description basically states that every node will have an addEventListener('type',\
    \ listener, false)method in charge of registering an event and its removeEventListenercounter,\
    \ plus dispatchEvent(event)method that could eventually raise an exception.\n\n\
    The documentation provides a more detailed explanation of every single method\
    \ and the meaning of\n"
  mdcn: "\n我们每天所做的每件事，以及我们周围的一切，都是基于基本的 else 逻辑流的，这同样适用于任何可能执行或不执行某些操作的软件。\n\n以下代码是一个虚拟示例，展示了我们的驾驶程序是如何基于条件的。\n\
    \n```javascript\nfunction letsDrive(car, where) {\n  // 只有在引擎关闭状态时才启动引擎\n  if\
    \ (car.isEngineOff()) {\n    car.startEngine();\n  }\n  // 如果下雨，我们就小心行驶\n  if\
    \ (global.weather.isRaining()) {\n    car.goSlowerThanUsual();\n  } else {\n \
    \   car.goUsualSpeed();\n  }\n\n  // 电台呢？\n  if (Date.now() < global.today.LATE_MORNING)\
    \ {\n    car.radio.findMorningNews(); // 每天\n  } else if (where === 'beach') {\n\
    \    car.radio.findSurfingSongs(); // 假期间\n  } else {\n    car.radio.findRockNRoll();\
    \ // 每天晚上\n  }\n}\n```\n\n```javascript\nvar myNewCar = new Car();\n// 每次我需要开车时调用\
    \ letsDrive(myNewCar, 'my office');\n```\n\n`if` 并不总是需要一个 `else`，并且中间可以有一个可选的\
    \ `else if`。\n\n## 三元运算符\n\n最常用的内联 `if...else` 快捷方式是由三元运算符提供的，它看起来像一个问号：?\n它只做一件事：如果条件为真，它返回第一个值；如果条件为假，则返回第二个值。\n\
    \n```javascript\nvar ternaryResult = (14 / 7 === 2) ? 'correct' : 'back to school!';\n\
    ```\n\n## switch 语句\n\n如果说三元运算符是 `if...else` 的快捷方式，那么 `switch` 语句就是长长的 `if...else\
    \ if...else if...else` 条件的快捷方式。\n\n```javascript\nfunction isLetterInAFRange(letter)\
    \ {\n  var result;\n  // switch 语法，传递任何值\n  switch (letter) {\n    // 它会像这样对每个\
    \ case 进行比较\n    // if (letter === 'G') ...\n    case 'G':\n      // 如果比较为真，它将执行\n\
    \      // 后续操作\n      result = false;\n      // 你可以任意 break 它，退出 switch; break;\n\
    \n      // 或者你可以创建不同的入口点，即所谓的“穿透”\n    case 'A': // else if (letter === 'A')\n\
    \    case 'B': // else if (letter === 'B')\n    case 'C': // else if (letter ===\
    \ 'C')\n    case 'D': // else if (letter === 'D')\n    case 'E': // else if (letter\
    \ === 'E')\n    case 'F': // else if (letter === 'F')\n      result = true; //\
    \ 所有这些条件都返回 true\n      break;\n    // 没有满足的条件？我们有一个默认回退\n    default:\n     \
    \ result = false;\n      break; // 在 `default` 部分内是可选的\n  }\n  return result;\n\
    }\n```\n\n大量的 `else if (letter === 'A') { ... } else if (letter === 'B') { ...\
    \ }` 会让你的代码看起来像由毕加索设计的章鱼。\n\n## 逻辑 || 运算符（读作或）\n\n与其使用许多执行相同操作的 `else...if`，你可以使用\
    \ `||`。\n因此，上一个示例可以重写如下所示：\n\n```javascript\nfunction isLetterInAFRange(letter)\
    \ {\n  if (\n    letter === 'A' || letter === 'B' || letter === 'C' || letter\
    \ === 'D' ||\n    letter === 'E' || letter === 'F'\n  ) {\n    return true; //\
    \ 只要函数返回，它就会退出函数\n  }\n  // 这让你能够避免冗余的\n  return false; // `else`，因为真的没有别的事情可以做了\n\
    }\n```\n\n## 逻辑 && 运算符（读作与）\n\n与 `||` 运算符相反，`&&` 运算符只有在在上一个条件通过验证时才会继续检查条件。这可能是需要记住的最重要概念之一。\n\
    \n例如，下面的 ATM 操作将不会一起执行，而是一个一个执行。\n\n```javascript\nfunction getMoney() {\n  if\
    \ (\n    cardIsValid() && pinCodeIsValid() && userSelectedAmount()\n  ) {\n  \
    \  // 卡有效吗？好的……下下一个\n    // 用户知道密码吗？\n    // 下一个！\n    // 用户需要特定的\n    // 金额吗？\n\
    \    // 好的……下一个\n    return getAmountSelectedByUser(); // 一切正常，一切顺利 OK\n  }\n\
    \  return 0; // 上面发生了错误\n}\n```\n\n还可以结合这两个运算符，以某种方式模拟三元运算符可以的功能。\n```javascript\n\
    // 通过逻辑逻辑实现三元运算符\nconsole.log((1 < 2) && 'OK' || 'EPIC FAIL'); // 显示 'OK'\n//\
    \ 与三元运算符等价\nconsole.log((1 < 2) ? 'OK' : 'EPIC FAIL'); // 也显示 'OK'\n```\n然而，每当我们需要三元逻辑时，可能应该使用相应的运算符。\n\
    \n## 真值（truthy）和假值（falsy）\n\n`if` 或 `else...if` 语句，以及三元或逻辑运算符都是非常仁慈的。检查实际的布尔类型\
    \ `true` 或 `false` 值没有关系。`false` 值、数字 `0`、空字符串 `\"\"`、`null` 值、`undefined` 以及异常的\
    \ `NaN` 引用都被视为假值，其余均为真值。\n"
