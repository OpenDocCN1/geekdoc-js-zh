    \n```\n// how we use the `extends` keyword now class Square extends Rectangle\
    \ { constructor(size) {\n  super(size, size);\n}\n\nvar twoXtwo = new Square(2);\n\
    console.log(twoXtwo.area); // 4\n```\n\nPlease bear in mind that if you need to\
    \ call a super method that is not the constructor, you need to access it through\
