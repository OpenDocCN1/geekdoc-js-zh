    # JavaScript F.A.Q. on demand


    Below there is a list of quick answers to the most frequently asked questions:


    +   - **is JavaScript safe?** We can write good and bad code with pretty much
    programming language and the more we know about it, the safer it becomes.


    +   - **is JavaScript fast?** Overall yes, and on top of that, there are various
    efforts from major players to make it as fast as native C or C++ could be.


    +   - **what else should I know about JS?** I’ve been using JS and its variants
    for the last 16 years and yet, I still don’t know the entire API exposed in every
    different client or server environment. Every occasion to learn more is a good
    one, but first you should try to understand if you are interested in frontend
    or backend development. Also, try to read updated books, because in the last 20
    years JS has been changing a lot. It’s good to know the past, but at the end of
