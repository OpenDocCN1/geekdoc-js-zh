    \n这里有很多注意事项、可能的安全影响、字符串编码问题，以及处理这些问题的现代或旧版方法，我认为在这里部分介绍它们是不明智的。\n\n重要的是了解它们的字面量表示形式：\n\
    \n```javascript\n// 如何识别字面量、内联 RegExp 实例\nvar RegExp = /^(?:search)*via.[special-chars]/gim;\n\
    //      ▲ 开始 结束 ▲ ▲ 可的 g,i,m,u 标记 //\n```\n\n## JSON\n\n一个没有关于“JavaScript 对象表示”（JavaScript\
    \ Object Notation）解释的 JS 词汇表将是不可信的，所以这里是：JSON 是对象、数组、字符串、布尔值、数字、null 以及其他任何内容的字符串表示标准。\n\
    \n```javascript\n// JSON 是以下值的字符串表示\nvar str = '{\"name\":\"JSON\",\"values\"\
    :[\"string\",1.2,{},[],],true,false,null]}';\n```\n\n我们可以通过 `JSON.parse(str)`\
    \ 解析字符串，或者使用 `JSON.stringify(compatible-Value)` 编码任何兼容的值，两种方法都接受回调函数作为选项。回调会在读取每个条目或在解析期间恢复值时被调用。\n\
    \n## 数学 (Math)\n\n这个全局可用对象充满了方法，其目的是帮助我们做……数学！\n\n最常用的是 `Math.pow(num, power)`、`Math.sqrt(num,\
    \ radix)`、`Math.max(num1, num2, numN)` 和 `Math.min(num1, num2, numN)`，但你可以通过名称检查所有它们，并在线查询它们的签名。\n\
    \n```javascript\n// 以下是一个辅助函数，告诉我们关于任何对象的许多信息\nfunction tellMeAbout(that){\n \
    \ console.log(Object.getOwnPropertyNames(that))\n}\ntellMeAbout(Math); // 看看里面有什么！\n\
    ```\n\n## parseInt(string, base) -> 整数 (integerNumber)\n\n每当你处理用户输入时，你就在处理字符串。如果你询问年龄或任何整数，`parseInt`\
    \ 将帮助你转换用户输入。\n\n```javascript\nconsole.log(\n  parseInt('3'), // 然而我们可以避免指定进制\n\
    \  parseInt('11', 2), // 2进制下的 11 是 3，而不是 11\n  parseInt('08', 10), // 在八进制世界中\
    \ 08 是 0，而不是 8\n  parseInt('FF', 16) // 十进制下的 FF 将是一个错误，而不是十六进制 255\n);\n```\n\
    \n## parseFloat(string) → 浮点数 (floatNumber)\n\n当你需要将字符串转换为浮点数时，`parseFloat` 是不选择。它不接受任何额外参数，因此\
    \ `parseFloat('FF')` 将产生 NaN 值，因为它不会被识别为数字或十六进制字符串。\n\n## 最近的 ECMAScript 特性 (features)\n\
    \n自从我开始写这个词汇表以来，JS 已经发生了一些变化。\n\nECMAScript 规范是一个活跃且不断更新的标准。这意味着一旦符合所有阶段步骤，新功能就会变得可用。\n\
    \n此词汇表省略了一些现代主题，但网上有描述，另外还有一些值得快速探索的内容。\n\n## let 声明 (let declaration)\n\n`let`\
    \ 声明是块作用的。与 `var` 不同，它没有以允许使用的方式被提升。\n\n```javascript\nlet x = 10;\nconsole.log(x);\
    \ // 10\n// let x = 20; // 语法错误：标识 'x' 已声明\n```\n\n## 展开运算符 (spread operator)\n\
    \n展开运算符 (`...`) 允许你展开数组或对象。\n\n```javascript\nlet arr = [1, 2, 3];\nlet combined\
    \ = [...arr, 4, 5];\nconsole.log(combined); // [1, 2, 3, 4, 5]\n```\n\n## 剩余参数\
    \ (rest parameters)\n\n剩余参数允许函数接收无限数量的参数作为数组。\n\n```javascript\nfunction sum(...numbers)\
    \ {\n  return numbers.reduce((acc, curr) => acc + curr, 0);\n}\nconsole.log(sum(1,\
    \ 2, 3, 4, 5)); // 15\n```\n"
