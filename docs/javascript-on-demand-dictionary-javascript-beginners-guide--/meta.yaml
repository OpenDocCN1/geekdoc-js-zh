- md: "\n```javascript\n// tellMeSomething is the reference name\n// of the function\
    \ we have just declared\ntellMeSomething; // nothing happens (just shows the function\
    \ itself)\n\n// to “execute” this function\n// we need to invoke it using parenthesis\
    \ tellMeSomething(); // logs 'something'\n```\n\nIf you look carefully, you can\
    \ see that even the operation `console.log('something');` is invoking a function.\
    \ However, in such a case the log function is invoked through a consoleobject\
    \ reference instead of directly, and it’s accessed using a “dot notation”.\n\n\
    Every time a function is invoked after a dot, that function can be considered\
    \ a “method”.\n\n## function declaration VS function expression\n\nThere are a\
    \ few ways to define a function and each might be more or less convenient.\nA\
    \ function declaration, for example, creates a reference available everywhere\
    \ within the \"scope\" it has been declared, even if invoked before.\n\n```javascript\n\
    // invoke it even before it's declared \nreadyJack(); // works as expected\n```\n\
    \n```javascript\nfunction readyJack() {\n  console.log('I was born ready');\n\
    }\n```\n\nThis can help you organize code in separate blocks.\nBut it can also\
    \ be confusing if there are many declarations in various different parts. Since\
    \ it's a good practice to declare all needed variables together, function expressions\
    \ might be a better fit.\n\n```javascript\nvar name = 'Jack';\n// function expression\
    \ referenced via readyJack \nreadyJack = function () {\n  console.log(name + 'was\
    \ just an expression'); \n};\n```\n\nJust like every single variable declaration\
    \ should end with a semicolon, when assigned to a variable function, expressions\
    \ should also end with a semicolon. Sicolons are not needed when it comes to function\
    \ declarations, as shown in the previous example. Remember: function expressions\
    \ cannot be executed before they are defined.\n\n## named function expressions\n\
    \nTo simplify our own debugging, it's a good practice to give functions a name,\
    \ even if there is a function expression and a reference to it.\n\n```javascript\n\
    var anonymous = function () {};\nvar named = function helloThere();\nconsole.log(anonymous.name);\
    \ // empty string\nconsole.log(named.name); // logs 'helloThere'\n```\n\nIt must\
    \ be said that modern debuggers are smart enough to tell the reference name anyway,\
    \ but it's good to know that you can create function expressions with a name at\
    \ runtime.\n\nThis is particularly handy when you want to immediately invoke the\
    \ function itself*\n\n* procedure also known as IIFE: Immediately Invoked Function\
    \ Expression\n\n```javascript\nfunction areWeThereYet(tenSteps) {\n  if (tenSteps\
    \ === 0) {\n    console.log('finally arrived');\n  } \n  else {\n    console.log('yet\
    \ another step');\n    // use the function name to invoke itself // passing the\
    \ decreased count\n    areWeThereYet(tenSteps - 1);\n  }\n}\nareWeThereYet(10);\
    \ // the count in this case starts at 10\n```\n\n## scope\n\nThis term indicates\
    \ the boundaries in which the code is executed. Think of it as the Universe galaxy\
    \ scope, the Milky Way is our solar system's scope, the solar system is planet\
    \ Earth’s scope, planet Earth is all continents’ scope, and for each continent\
    \ we are going to have countries, regions, cities, councils and finally your own\
    \ house, which is your own scope while you are inside it, while the rest of the\
    \ city will be your scope when you get out.\n\nIn JavaScript, by default there\
    \ is a global scope in which you can define functions and variables. However,\
    \ back to the house metaphor, you don't want each neighbour to know about every\
    \ single thing you do in your place: your home is your place, and functions, in\
    \ JavaScript, are the way to define your very own place without interfering, or\
    \ being disturbed, by everything that happens in the middle of the street, or\
    \ anywhere else, including other houses.\n\n```javascript\n// global scope starts\
    \ before JS code is executed (it's already there)\n// function `myHouse` scope\
    \ starts here\nfunction myHouse(sco, ped, args) {\n  // defining a variable inside\
    \ `myHouse` makes it available only here \n  var myMess = 'my own room';\n} //\
    \ function `myHouse` scope ends here\ntypeof myHouse; // is the 'function' `myHouse`\n\
    typeof myMess; // is 'undefined' because it's unknown in this scope\n```\n\n##\
    \ private and nested scope\n\nSince it is possible to create functions inside\
    \ other functions, it is also possible to have a private scope within a function\
    \ that is already private, like a room within the house.\n\nTo create a private\
    \ scope, we can use the previously seen IIFE approach without naming our function\
    \ expression.\n\n```javascript\n// anonymous IIFE\n(function () {\n  var myPrivateScope\
    \ = 'a string value';\n  console.log(typeof myPrivateScope); // 'string'\n});\n\
    console.log(typeof myPrivateScope); // 'undefined'\n```\n\nBy having an anonymous\
    \ function expression that invokes itself, you can be absolutely sure that nobody\
    \ outside that function can be able to interfere with your code. Moreover, you\
    \ can define other functions in it, and create nested scopes.\n\n```javascript\n\
    (function (){\n  var who = 'I am '\n  var nestedExpression = function () { //\
    \ nested function expression scope\n    var nested = who + 'expression'; \n  \
    \  return nested;\n  };\n  function nestedDeclaration() { \n    var nested = who\
    \ + 'declaration'; \n    return nested;\n  }\n  console.log(nestedExpression());\n\
    \  console.log(nestedDeclaration());\n}());\n// nested function declaration\n\
    // 'I am an expression' // 'I am a declaration'\n```\n\nIt is important to remember\
    \ that nested scopes can always access outer variables but never vice-versa. This\
    \ is why it is possible for both function expression and declaration in the previous\
    \ example, to use the who while executing. However, it wouldn’t be possible for\
    \ the outer scope to reach the variable defined inside each function: these are\
    \ reachable only via their own scope. The reason we want to use scopes...\n\n\
    ## context\n\nEvery time a function is invoked, it is possible to reference its\
    \ current execution context through the automatically available this reference,\
    \ which has one of the following values:\n\n- the global program context, called\
    \ window in browsers and global on server\n- the generic object that invoked the\
    \ function through the dot notation: obj.method()\n- an arbitrary explicit value,\
    \ including undefined, when invoked via function methods like .call.apply\n\n\
    ## global context\n\nIf you open your browser console, or start node js, you can\
    \ inspect the global context writing `console.log(this)` or simply `this`.\n\n\
    Whenever you define a variable or declare a function globally, you are also able\
    \ to reference these variables through the global context, since it is just like\
    \ an object.\n\n```javascript\n// create a variable directly in the global scope\n\
    globallyDefinedVariable = 'can everyone access me'; // it's accessible through\
    \ the global object\nconsole.log(this.globallyDefinedVariable);\n```\n\n```javascript\n\
    // the same when you create a function globally\ngloballyDeclaredFunction() {\
    \ return globallyDefinedVariable; }\nconsole.log(globallyDeclaredFunction());\n\
    ```\n\nIt is also possible to define global variables inside a generic function\
    \ by accident, by simply omitting the var kword before assigning a value to a\
    \ reference.\n\n```javascript\nconsole.log(typeof a); // 'undefined'\nfunction\
    \ myFunction() {\n  a = 123; // instead of var a = 123\n}\nmyScope();\nconsole.log(typeof\
    \ a); // 'number'\nconsole.log(a); // 123\n```\n"
  mdcn: "\n\n```javascript\n// tellMeSomething 是我们刚刚声明\n// 函数的引用名\ntellMeSomething;\
    \ // 什么都没有发生（只是显示了函数本身）\n\n// 要“执行”这个函数\n// 我们需要使用括号 () 来调用它\ntellMeSomething();\
    \ // 打印 'something'\n```\n\n如果你仔细观察，你会发现即使是 `console.log('something');` 这种操作也是调用了一个函数。然而，在这种情况下，log\
    \ 函数是通过 `console` 对象的引用被调用的，而不是直接调用的，并且是使用“点符号”来访问的。\n\n每当在点号之后调用函数时，该函数就可以被视为一个“方法”（method）。\n\
    \n## 函数声明 VS 函数表达式\n\n定义函数有几种方式，每种方式可能或多或不方便。\n例如，函数声明（function declaration）会创建一个在它所声明的“作用域”内随处可用的引用，即使在声明之前调用也可以的。\n\
    \n```javascript\n// 即使在声明之前调用它\nreadyJack(); // 按照预期工作\n```\n\n```javascript\n\
    function readyJack() {\n  console.log('I was born ready');\n}\n```\n\n这可以帮助将代码组织在单独块中。\n\
    但如果在许多不同部分有许多声明，也可能会令人困惑。由于将一起声明所有需要的变量是一个良好的习惯，函数表达式（function expressions）可能更合适。\n\
    \n```javascript\nvar name = 'Jack';\n// 通过 readyJack 引用的函数表达式\nreadyJack = function\
    \ () {\n  console.log(name + 'was just an expression'); \n};\n```\n\n就像每一个变量声明都应该以分号结尾一样，当表达式赋值给变量函数时，表达式也应该以分号结尾。如上例所示，函数声明不需要分号。记住：函数表达式在定义之前无法被执行。\n\
    \n## 命名函数表达式 (named function expressions)\n\n为了方便我们自己的调试，给函数命名是一个良好的习惯，即使已经有一个函数表达式和对它的引用。\n\
    \n```javascript\nvar anonymous = function () {};\nvar named = function helloThere();\n\
    console.log(anonymous.name); // 空字符串\nconsole.log(named.name); // 打印 'helloThere'\n\
    ```\n\n必须说，现代调试器足够智能可以识别出引用名，但了解你可以在运行时创建带有名称的函数表达式是有益的。\n\n当你想要立即调用函数本身时，这特别方便*\n\
    \n* 过程也称为 IIFE：立即执行函数表达式（Immediately Invoked Function Expression）\n\n```javascript\n\
    function areWeThereYet(tenSteps) {\n  if (tenSteps === 0) {\n    console.log('finally\
    \ arrived');\n  } \n  else {\n    console.log('yet another step');\n    // 使用函数名调用自己\
    \ // 传递减少后的计数\n    areWeThereYet(tenSteps - 1);\n  }\n}\nareWeThereYet(10); //\
    \ 在这种情况下计数从 10 开始\n```\n\n## 作用域 (scope)\n\n这个术语表示代码执行的边界。将其想象成宇宙星系的作用域，银河系是我们的太阳系作用域，太阳系是地球的作用域，地球是所有大陆的作用域，而对于每个大陆，我们将拥有国家、地区、城市、委员会，最后是你自己的房子——当你住在里面时，房子是你自己的作用域，而当你离开时，城市的其他部分就是你的作用域。\n\
    \n在 JavaScript 中，默认有一个全局作用域（global scope），你可以在其中定义函数和变量。然而，回到房子的比喻，你不希望每个邻居都知道你在家里所做的每一件事：你的家是你的地方，而在\
