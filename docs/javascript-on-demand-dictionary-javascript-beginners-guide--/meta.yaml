  mdcn: '

    我们将使用现代特性。


    **你听过转译器（transpilers）吗？** 我不仅听过它们，还在使用它们。例如，本术语表中大多数与平台无关的示例都通过 `babel-node` 成功了测试，这是一个命令行界面（CLI*），它将最新
    ECMAScript 规范中的最新特性引入 node.js。我会在生产环境中使用它们吗？这取决于情况！


    **“生产环境（in production）”意味着什么？** 它是向每个用户提供的通用网站、应用程序、框架、设计或程序的正式版本。它是我们交付的内容，而不是为了快速测试想法而做的“原型（proto-type）”。


    **“原型（prototype）”意味着什么？ 我知道这个术语表可能会让人困惑，但在涉及非技术的 JS 讨论时，原型是一个草图，或者是最终产品的快速创建版本，它本身可能永远不应该投入生产环境。


    **我应该使用哪个框架、库或工具？** 只要能解决你的问题的那个（如果有的话）。否则，使用前端或后端核心已经提供的更好。


    - JavaScript 仅用于网页吗？如今，很难找到不运行 JS 的电子产品。智能手表、路由器、你现在的电脑，甚至是彩色的 LED 灯泡，都兼容某些 JavaScript
    引擎或已经在运行它。


    - JavaScript 是内存安全的吗？有一个垃圾回收器负责清理我们创建的混乱。我们可以做的是帮助它完成工作，例如不要无限期地持有值。


    JavaScript 常见问题 (F.A.Q.) 94


    这里肯定还有我漏掉的问题，我鼓励你去寻找答案。一个拥有良好且通常是最新文档的好地方是 MDN - Mozilla 开发者网络（Mozilla Developer
    Network）。


    还有许多我机会讨论的其他主题，例如：Web Workers、Service Worker、IndexedDB、localStorage 和 sessionStorage、通过
    XMLHttpRequest 实现 Ajax 以及最近的 Fetch API，但我相信如果你已经读到了这里，你现在能够理解大多数在线技术文章了。


