- md: "\n# try catch finally\n\nWhenever a program is executed, there are many kinds\
    \ of errors that could happen. Some errors might be expected, some errors might\
    \ be fatal. Most known fatal errors in Computers history are the “guru meditation”\
    \ and the “blue screen of death” as they appeared in good old Commodore Amiga\
    \ or Windows Operating Systems.\n\nWe definitely don't need to try and replicate\
    \ a fatal error, especially because we actually hope that it will never occur.\
    \ What we can do though, is to try and prevent those errors that will interrupt\
    \ our application and exit without having any idea of what happened.\n\nThe try/catch/finally\
    \ statement gives us a way to deal with errors we might expect to happen, a way\
    \ to also generate Errors, expecting somebody else to react accordingly.\n\n```javascript\n\
    // checking if a possibly non-existant reference can be invoked\ntry {\n  iAintEvenDefined();\n\
    } catch(errorObject) {\n  console.warn(errorObject.message);\n}\n// note that\
    \ finally is optional\n```\n\n```javascript\n// creating a property that throws\
    \ an error\nvar me = Object.defineProperty({}, 'name', {\n  enumerable: true,\n\
    \  get: function () { return 'Andrea'; },\n  set: function () {\n    throw new\
    \ Error('I already have a name');\n  } // throw is the keyword used to inform\
    \ the program about an Error\n});\n\nconsole.log(me.name); // Andrea\ntry {\n\
    \  me.name = 'Robert';\n} catch (whatHappened) {\n  console.warn(whatHappened);\n\
    } finally {\n  console.log('Hello ' + me.name); // 'Hello Andrea'\n}\n```\n\n\
    The excessive use of these mechanisms is rarely a good idea. Having too many try/catch\
    \ statements around, doesn’t necessarily mean the code is more secure or immune\
    \ to errors. On the contrary it might indicate we have no control, or even worst\
    \ no idea at all, of how many things could possibly go wrong. There are better\
    \ approaches to control our application, and on top of that, try/catch-statements\
    \ might also slow down the execution of the code considerably. As a summary: use\
    \ this feature carefully, only when necessary, and applying common sense.\n\n\
    Error objects have a `message` property which is a string containing the info\
    \ passed when the new Error(\"info\") object was created.\n\n# which descriptor\
    \ for what\n\nHaving various ways to define a property can be both handy and disorienting.\
    \ There are so many glitches to talk about when it come to descriptors, but it's\
    \ best to stick to common conventions available in the JavaScript core.\n\nFor\
    \ instance, every generic object property assignment will be a writable, configurable,\
    \ and enumerable descriptor, whose value would be exactly the one provided.\n\n\
    # common property descriptor\n\n```javascript\nvar me = {name: 'Andrea'};\nme.age\
    \ = 37;\n```\n\nBoth name and age properties, will have similar descriptors. Below\
    \ you can see name descriptor:\n\n```javascript\n// representation of the me['name']\
    \ property descriptor \n{\n  configurable: true, enumerable: true, writable: true,\
    \ value: \n  'Andrea'\n}\n```\n\nWhenever you want to set a generic property like\
    \ name or age, it really makes little sense to use the tedious Object.defineProperty\
    \ approach. Especially because all defaults configuration are false, not true,\
    \ and there's no need to type that much!\n\n# common class and native method descriptor\n\
    \nWhile data properties, such as a name or an age, are usually those iterated,\
    \ collected, or manipulated, it is rarely convenient to have methods in our way.\
    \ Especially when instances are used, where all methods are inherited, you don't\
    \ really want them to show up in your for/in loop. It's not necessary to know\
    \ that every object will have a toString.\n\nAccordingly, all native methods available\
    \ in JavaScript can be described as follows:\n\n```javascript\n// representation\
    \ of the native Object.prototype['toString'] descriptor\n{\n  configurable: true,\n\
    \  enumerable: false, // ← to never show up in for/in loops\n  writable: true,\n\
    \  value: function toString() { [native code] }\n}\n```\n\nIt is actually lucky\
    \ that native descriptors are configurable and writable, as it means that they\
    \ can be reassigned and fixed, whenever necessary.\n\n# common defensive method\
    \ descriptor\n\nIf we are creating a class for our own purposes, we probably want\
    \ to ensure that its methods cannot possibly be modified elsewhere, during the\
    \ application execution.\n\nIn these cases we might want to set methods directly\
    \ in the prototype as follows:\n\n```javascript\n// define a property method directly\
    \ in the class or function prototype\nObject.defineProperty(Constructor.prototype,\
    \ 'method', {\n  // defaults // enumerable: false, configurable: false, writable:\
    \ false \n  // it won't be possible to patch or change this method later on \n\
    \  value: function () { /*...*/ }\n});\n```\n\n# common lazy property descriptor\n\
    \nWhen we talk about lazy properties, we refer to those properties that will have\
    \ an expected value only after the first time we need them.\nImagine we are going\
    \ to buy a car. By default it comes with many features (properties), but we can\
    \ ask for even more properties. On paper, the car has a USB port to connect our\
    \ devices, but it will be configured like that only if we ask for it, not by default.\n\
    \n```javascript\nclass CarOrder {\n  constructor(chosenColor) {\n    // color\
    \ is an own property set during car creation time this.\n    this.color = chosenColor;\n\
    \  }\n\n  // usbConnector as lazy property\n  get usbConnector() {\n    // it\
    \ is configured on demand the first time\n    Object.defineProperty(\n      this,\n\
    \      'usbConnector',\n      {\n        configurable: true,\n        value: 'connected'\n\
    \      }\n    );\n    return this.usbConnector;\n  }\n}\n```\n\nThe reason we\
    \ need to use `defineProperty` to configure a lazy descriptor is that if we try\
    \ to set `this.usbConnector = {}` directly, we'll inevitably end up the setter\
    \ already defined in the CarOrder class. Moreover, if we want to be able to change\
    \ or replace it in the future, we should set it as configurable.\n\nThe last important\
    \ information about descriptors is that not only you can set them, but you can\
    \ always retrieve them too. Let’s try to play around with this, validating everything\
    \ we’ve learned so far.\n\n```javascript\n// some inspection of the most accessed\n\
    console.log(Object.getOwnPropertyDescriptor(Object, 'prototype'));\nconsole.log(Object.getOwnPropertyDescriptor(window\
    \ || global, 'toString'));\nconsole.log(Object.getOwnPropertyDescriptor({name:\
    \ 'Robert'}, 'name'));\n\n\n# delete\n\nWhen there is a configurable property,\
    \ not only we can use the defineProperty again to change its descriptor, but we\
    \ can also use delete to erase such property from the object.\n\n```javascript\n\
    // do you remember? by default all properties are defined as configurable\nvar\
    \ me = {name: 'Andrea'};\ndelete me.name; // true\n'name' in me; // false\nconsole.log(me.name);\
    \ // undefined\n```\n\nThe returned boolean value indicates either that there\
    \ was nothing to do, so the property can eventually be reassigned to that object\
    \ without problems, or that such property was there but it was removed. Remember:\
    \ deleter returns false only when an own property is non configurable and cannot\
    \ be deleted.\n\n# Object.getOwnPropertyNames(obj) → arrayOfAllNames\n\nWe have\
    \ already mentioned object.hasOwnProperty(propName), but how do we actually get\
    \ all properties defined directly in a generic object?\n\n```javascript\n// maybe\
    \ I don't want to tell my age to everyone\nvar me = { name: 'Andrea' };\nObject.defineProperties(me,\
    \ { age: { writable: true, value: 37 } });\nfor (var k in me) console.log(k, me[k]);\n\
    // the above logs the `name` `Andrea` ... but what about the age?\nconsole.log(Object.getOwnPropertyNames(me));\
    \ // ['name', 'age']\n```\n\n# Object.defineProperties(obj, descriptors) → obj\n\
    \nThe plural version of Object.defineProperties somehow simplifies the multiple\
    \ descriptors assignment, as it requires less typing (which is a plus!).\n\n```javascript\n\
    var me = {};\n\nObject.defineProperties(me, {\n  name: {enumerable: true, value:\
    \ 'Andrea'},\n  age: {enumerable: true, value: 37}\n});\n```\n"
  mdcn: "\n\n# try catch finally\n\n每当程序执行时，可能会发生许多类型的错误。有些错误是可以预期的，而有些错误可能是致命的。计算机历史上大多数为人知的致命错误就是“真理冥想”（guru\
    \ meditation）和“蓝屏死机”，它们曾出现在老老的 Commodore Amiga 或 Windows 操作系统中。\n\n我们绝对不需要尝试去复制一个致命错误，特别是因为我们实际上希望它永远不会发生。然而，我们可以做的是尝试防止那些会中断我们的应用程序并在完全不知道发生了什么的情况下的情况下退出的错误。\n\
    \n`try/catch/finally` 语句为我们提供了一种处理预期的可能发生的错误的方法，同时也提供了一种生成错误的方法，并期望其他人做出相应的反应。\n\
