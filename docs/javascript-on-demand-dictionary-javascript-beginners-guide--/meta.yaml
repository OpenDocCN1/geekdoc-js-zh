  mdcn: "\n一旦有一种方法可以检索对象的所有命名属性及其描述符，我们就拥有了分析任何类型对象所需的一切。\n\n## Object.keys(obj) →\
    \ 自身可枚举属性名的数组\n\n这个“公共”方法与 `Object.getOwnPropertyNames` 类似，但它返回的是对象自身可枚举属性的数组。\n\
    \n## 公共与公共静态 (public and public static)\n\n我们一直在使用如 `Object.keys` 等方法，这些方法通过全局可用的\
    \ `Object` 类暴露。在大多数原生类中也有其他方法。\n\n`Array.isArray(obj)`、`String.fromCodePoint(0x1F4A9)`、`Number.isNaN(0/0)`，仅列举几个。\n\
    这些方法与其所属的构造函数有关。我们可以用老办法自己定义类似的“静态”方法。\n\n```javascript\nfunction Rectangle(w,\
    \ h) {\n  this.width = w;\n  this.height = h;\n}\n```\n\n// 记住：函数就像对象\n\n```javascript\n\
    Rectangle.isSquare = function (instance) {\n  return instance.width === instance.height;\n\
    };\n```\n\n```javascript\n// let's test two different rectangles var spongeBob\
    \ = new Rectangle(2, 3); spongeBob.pants = new Rectangle(2, 2);\n```\n\n```javascript\n\
    // invoke the Rectangle.isSquare\nconsole.log(Rectangle.isSquare(spongeBob));\
    \ // false\nconsole.log(Rectangle.isSquare(spongeBob.pants)); // true\n```\n\n\
    在大多数更新的 JavaScript 引擎中，你实际上有一个特殊的静态属性用于为此。\n\n```javascript\nclass Rectangle {\n\
    \  static isSquare(instance) {\n    return instance.width === instance.height;\n\
    \  }\n  constructor(w, h) {\n    this.width = w;\n    this.height = h;\n  }\n\
    }\n```\n\n`Rectangle.isSquare` 方法具有以下特点：\n\n- 它不被继承，但可以通过 `Rectangle` 构造函数公开访问。\n\
    - 它是静态的，也就是说，不期望在任何执行上下文中使用或调用。我们甚至可以写 `Rectangle.isSquare.call(null, spongeBob)`，如果该实例是正方形，它仍然返回\
    \ `true`。完全不涉及此上下文！\n\n后者的条件对于每个公共静态函数都是相同的。例如，`Object.keys` 执行不需要 `Object` 上下文，它也不被继承。\n\
    \n```javascript\nvar keys = Object.keys; // 公共静态 Object.key 函数快捷方式\nkeys({a,'a'});\
    \ // 这样我们以后可以直接使用它\n```\n\n## extends (扩展)\n\n继承之旅始于讨论对象继承其他对象。现在它结束于讨论类扩展其他类。没有理由惊慌，这只是对以下问题的简短回答：\n\
    \n- Q：“什么是 Square（正方形）？”\n- A1：“它是一个扩展 Rectangle（矩形）的类”\n- A2：“它是一个原型直接继承自 `Rectangle.prototype`\
    \ 的类”\n\n对象可以继承自原型的数量没有具体的限制，但只有一个直接的“扩展”，这在 JavaScript 中只可以在两个类之间实现。\n\n因此，当我们使用“扩展”（extend）一词时，我们只能指的是一种非常特定的关系。\n\
    \n```javascript\n// a Rectangle 构造函数\nfunction Rectangle(w, h) {\n  this.width\
    \ = w;\n  this.height = h;\n}\n// ... with an area getter\nObject.defineProperty(Rectangle.prototype,\
    \ 'area', {\n  get: function () {\n    return this.width * this.height;\n  }\n\
    });\n```\n\n```javascript\n// a Square 构造函数\nfunction Square(size) {\n  // invoke\
    \ the \"super\" (parent)构造函数\n  // 它将设置我们当前的实例上下文\n  Rectangle.call(this, size,\
    \ size);\n}\n// here Square extends Rectangle through its prototype\nSquare.prototype\
    \ = Object.create(Rectangle.prototype); var twoXtwo = new Square(2);\nconsole.log(twoXtwo.area);\
    \ // 4 -> 'cause 2 * 2 == 4 ^_;\n```\n\n## super\n\n在面向对象编程中，每当出现 super 一词（有时是\
    \ parent）时，它指的是当前执行所继承的最近祖先类。\n\n这是一个特殊的关键字，绝不应该在通用类方法之外使用。它曾经是一个保留字，遇到它可能会破坏\
