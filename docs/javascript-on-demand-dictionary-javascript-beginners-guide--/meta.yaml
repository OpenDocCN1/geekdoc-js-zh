    # audience: who is this book for


    For absolute beginners or more advanced developers, this book explains the most
    common terms used in JavaScript programming, client or server. If you cannot understand
    technical articles, and you are looking to refresh and update your knowledge about
    patterns, and applications, this book will also help you.


    # how to read this book


    This book could somehow be compared to a waterfall: it starts quietly, by describing
    simple terms, and then accelerates until it covers modern features towards the
    end. Being a compact book I recommend you a quick-through first, and once completed,
    go back to any specific words so that every term is clear.


    # special thanks


    To every person that believed in me and helped me with this idea. In particular:
    Robert Wolchanowski, Stoyan Stefanov, Arianna De Mario, Cinzia Garchi, Maria Teresa
    Sardella, Luca Vavassori, every member of the TC39 Mailing List who has been patient
    enough to deal with my questions and rants.


    # technical editor


    A special thanks to Stoyan Stefanov, the author of JavaScript Patterns, Web Performance
    Volume 2, JavaScript for PHP and others, helped me reviewing content as well as
    examples.


    # the author


    Andrea Garchi is an experienced Web and Mobile Development consultant, formerly
    a Senior Engineer at Twitter, previously at Facebook, NOKIA, and others.


    # what this book is about


    Many online articles take for granted that the reader knows the meaning of every
    single term. The truth is that there are many people that would like to understand
    “what the heck” is all about, the same people who might stop reading article or
    feel confused the very moment they come across terms such as variable, context,
    scope, object, and so on. While I can instantly assure everyone programming is
    not always trivial, and it’s surely not something you can learn overnight, or
    maybe just reading a couple of books, for example, simply use JavaScript to click
    a button to show an alert... what is an alert? It’s a modal window with a warning
    message and an OK button. what does modal mean? It means it blocks the interaction
    with the program.


    # what this book is not


    Every single term in this book could require a book of its own to describe all
    its glory, history, or “gotchas”. JavaScript (JS) has been around for more than
    20 years now, and while I’ve tried to keep things as simple as possible, the aim
    is to explain modern JS first, since it’s daily JS that you want to learn, and
    not the one from the 90s. My apologies in advance if some descriptions are not
    absolutely perfect. You are the one in charge of any deeper investigation if needed.
    So … shall we?


    # debug


    It’s the basis, because it’s what we need whenever we write code and we want to
    know if such code succeeded or failed. This verification procedure is known as
    “debugging”, for the simple reason that it’s usually performed through a “debugger”,
    which is a developer’s helper tool that most modern browsers provide.


    Just try “right click” on any webpage, and see if there is “inspect element” as
    the last option of the menu. This is how you can test all examples in this book:
    click “inspect element” and then the button or tab called “console”, and start
    writing in pieces of code, also known as “snippets”, while we walk through the
    examples.


    As an alternative, you could also use the node.js command line interface, since
    most examples are en-

