  - '[PAGE 12]


    Do you see how many questions already? And the more we describe, the more we understand,
    the more other terms come up, needing more answers and more explanations.


    Well, this is why I’ve written this “JavaScript glossary on demand”, hoping that
    you won’t feel disoriented ever again while reading online articles, or other
    more advanced books.


    # what this book is not


    Every single term in this book could require a book of its own to describe all
    its glory, history, or “gotchas”. JavaScript (JS) has been around for more than
    20 years now, and while I’ve tried to keep things as simple as possible, the aim
    is to explain modern JS first, since it’s daily JS that you want to learn, and
    not the one from the 90’s. My apologies in advance if some descriptions are not
    absolutely perfect. You are the one in charge of any deeper investigation if needed.
    So … shall we?'
