    Whenever the word super, or sometimes parent, appears in Object Oriented Programming,
    it refers to the closest ancestor class from which the current execution inherited.


    It is a special keyword that should never be used outside a generic class method.
    It used to be a reserved word, something that could break a JS application when
    encountered.


    In ECMAScript2015 era, before the class keyword got promoted from the status of
