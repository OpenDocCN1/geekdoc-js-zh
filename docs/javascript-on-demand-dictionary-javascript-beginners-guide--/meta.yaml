  - '[PAGE 114]


    # if else switch and conditional logic


    It might feel weird to start reading about basic boolean logic after a comprehensive
    introduction to a more complex subject as Object Oriented Programming is, but
    the reason behind it is it that at least now you should be able to understand
    even more complex examples.


    # conditional statement


    Almost all programs are based on conditions. A login is performed onlyifuser and
    password are known in the database.


    A lift moves to other floors only ifwe press a button and nobody passes through
    its doors whilethey are closing, otherwise it opens the doors and starts the whole
    procedure over.


