  md: "# Events fired by the Calendar widget\n\nThe Kendo UI calendar widget has two\
    \ events– change and navigate. These events fire when the action after they are\
    \ named occurs. The Change fires when the selected date is changed, navigate fires\
    \ when the calendar is navigated– such as when the month is changed or the view\
    \ is moved up from 'month' to 'year'.\n\nIf you wanted the calendar to only appear\
    \ when a user selects a certain input box on a page, and place its value into\
    \ that input element? You could try to do something like this. Modify the final\
    \ script block of the page that we are working on to look like this example:\n\
    \n```\n<script type=\"javascript\">\n$function () {\n  $(\\#mvcCalendar\\).hide();\n\
    });\n$(document).ready(function () {\n  $(\\#mvcCalendar\\).data(\"kendoCalendar\"\
    ).bind(\"change\", function (e) {\n    var date = $(\\#mvcCalendar\\).data(\"\
    kendoCalendar\").val().toString(date, 'd');\n  });\n  $(\\#showTheCalendar).focus(function\
    \ () {\n    $(\\#mvcCalendar\\).slideDown();\n  });\n  $(\\#nameInput).focus(function\
    \ () {\n    $(\\#mvcCalendar\\).slideUp();\n  });\n  $(\\#ageInput\\).focus(function\
    \ () {\n    $(\\#mvcCalendar\\).slideUp();\n  });\n  $(\\#navigateUp).click(function\
    \ () {\n    var calendar = $(\\#mvcCalendar\\).data(\"kendoCalendar\");\n    calendar.navigateUp();\n\
    \  });\n  $(\\#navigateDown).click(function () {\n    var calendar = $(\\#mvcCalendar\\\
    ).data(\"kendoCalendar\");\n    calendar.navigateDown(calendar.value());\n  });\n\
    \  $(\\#showValue).click(function () {\n    var calendar = $(\\#mvcCalendar\\\
    ).data(\"kendoCalendar\");\n    alert(calendar.value());\n  });\n});\n</script>\n\
    ```"
