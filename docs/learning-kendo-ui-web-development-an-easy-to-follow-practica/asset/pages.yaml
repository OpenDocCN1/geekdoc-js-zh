  md: "# Using AutoComplete with MVC through Models\n\nWe can take this one step further\
    \ and transform our code into Razor syntax with MVC. First, create a controller\
    \ action method to return data from the server.\n\n```\npublic ActionResult AutoCompletePage()\n\
    {\n    var repository = new SampleRepository();\n    var data = repository.GetStatesAndTerritories();\n\
    \    return View(data);\n}\n```\n\nNext, open AutoCompletePage.cshtml and delete\
    \ everything in it after the <h2> tag. At the top of the page, we need to add\
    \ a declaration so that this View page becomes strongly-typed to our new model\
    \ class StateTerritory.cs.\n\n@Model IEnumerableKendoUI.Models.StateTerritory>\n\
    \nNow add this code that uses the HTML helper class and the Kendo extension methods.\n\
    \n```\n<h2>AutoCompletePage.cshtml</h2>\n@Html.Kendo().AutoComplete(\n    .Name(\"\
    statesAndTerritories\")\n    .DataField(\"Name\")\n    .BindTo(Model)\n    .Filter(\"\
    startswith\")\n    .Placeholder(\"choose state or territory...\")\n)\n```\n\n\
    Recognize the syntax? For the BindTo(Model) statement, these method names are\
    \ the properties we use in JavaScript (except they start with capital letters,\
    \ of course). The call to bindTo(Model) is how the MVC controller passes data\
    \ into the MVC. In this case, we are strongly-typed our view to a collection (IEnumerable)\
    \ of StateTerritory objects, and here in the code we are telling the Kendo framework\
    \ that StateTerritory model contains the data to display in the AutoComplete.\
    \ The data in this model is used while the page is being created by the server,\
    \ and is only accessible through the Razor syntax code statements in the View\
    \ page."
