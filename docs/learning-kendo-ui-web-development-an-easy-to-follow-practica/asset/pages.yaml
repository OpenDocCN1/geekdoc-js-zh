    \ [x]\n    - Web Applications [x]\n    - Business Intelligence [x]\n  - Portals\
    \ and Collaboration [x]\n\n# Hooking into TreeView events\n\nThe Kendo UI View\
    \ fires several types of events during the course of its operation. These events\
    \ provide you, the developer, with the opportunity to run your own code in response\
    \ to actions that the TreeView runs as operates. Some of these actions are directly\
