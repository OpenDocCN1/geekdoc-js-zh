  md: '# Chapter 4


    In this case, I created an array people that contains three objects with properties
    about some people. This array, then, operates as the Model in this example since
    it contains the data and the definition of how the data is structured.

    At the end of this code sample, you can see the call to kendo.bind("body"), viewModel
    which is Kendo UI actually performs its MVVM rendering. I passed a jQuery selector
    for the body tag to the first parameter since this ViewModel applies to the full
    body of my HTML page, not just a portion of it.


    With everything combined, here is the full source for this simplified example:


    ```

    <!DOCTYPE html>

    <html xmlns="http://www.w3.org/1999/xhtml">

    <head>

    <title>MVVM Demo 1</title>

    <script src="Scripts/kendo/jquery.js"></script>

    <script src="Scripts/kendo/kendo.all.js"></script>

    <link href="Content/kendo/kendo.common.css" rel="stylesheet" />

    <link href="Content/kendo/kendo.default.css" rel="stylesheet" />

    <style type="css">

    th {

    width: 135px;

    }

    </style>

    </head>

    <body>

    <table>

    <caption>People Data</caption>

    <thead>

    <tr>

    <th>Name</th>

    <th>Hair Color</th>

    <th>Favorite Food</th>

    </tr>

    </thead>

    <tbody data-template="row-template" data-bind="source: people"></tbody>

    </table>

    <script id="row-template" type="text/x-kendo-template">

    <tr>

    <td data-bind="text: name"></td>

    <td data-bind="text: hairColor"></td>

    <td data-bind="text: favoriteFood"></td>

