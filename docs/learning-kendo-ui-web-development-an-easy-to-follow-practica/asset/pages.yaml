  md: '# #1 Interacting with Data: DataSource, IDE, TabStrip, and Grid


    Today is an exciting time to be a web developer. Web browsers and web standards
    have matured to the point that today''s programmer has rich frameworks available
    to boost productivity and reach wide audiences with less code and fewer headaches.
    HTML, CSS, and JavaScript have converged into a powerful and coherent unit that
    allows web applications to be both aesthetically and architecturally beautiful
    and elegant. Kendo UI, from Telerik, is a modern framework that embraces these
    advances and provides a set of tools to enable rich web development and configurable
    widgets, all with a familiar and accessible syntax.


    Along these same lines, development tools have been improving as well and Visual
    Studio 2012 from Microsoft is a good example. JavaScript is now a first-class
    citizen in the Microsoft world and there are many improvements for JavaScript
    development in the IDE, along with improved support for HTML5 and CSS3. This is
    largely to support a new programming model in Windows 8 that allows developers
    to take their skills to the Windows 8 desktop, but these improvements also directly
    benefit ASP.NET development – especially ASP.NET MVC. This is the programming
    environment we will use throughout this book to demonstrate and learn the Kendo
    UI framework for the web.'
  merge: -1
  pgno: 21
- img_proc: true
  md: "Interacting with Data: DataSource, Templates, TabStrip, Grid\n\n# # Setting\
    \ up the sample project\n\nKendo UI for web development is a client-side, jQuery-powered\
    \ framework that is not dependent on any specific server technology or platform.\n\
    This means you can debug and run the client-side examples in this book using your\
    \ choice of tools and debugging/testing environment. However, Telerik has released\
    \ a great set of server-side extensions for the Microsoft ASP.NET MVC framework\
    \ that can significantly boost productivity. To take advantage of both of these\
    \ models, I will be using Visual Studio 2012 and the ASP.NET MVC 4 template for\
    \ all my demonstrations and I invite you to follow along with me. Visual Studio\
    \ 2012 Express is a freely available from http://www.microsoft.com/visualstudio/products/visual-studio-overview,\
    \ if you do not already have it.\n\n> > Rather download completed samples?\n The\
    \ samples displayed in this book are available for download and you can start\
    \ from the completed code if you do not want to follow all the steps of setting\
    \ it up.\n\nOnce you have Visual Studio 2012 installed, click on New Project either\
    \ from the Start page or from the File menu. Choose ASP.NET MVC 4 Web Application\
    \ screenshot from the group of project choices. As you can see from the following\
    \ I have named my project LearningKendoUI:Web:\n\n![](img/172a1c72af4c00eec56c9c9ad892894b_22_0.png)"
  merge: -1
  pgno: 22
- img_proc: true
  md: 'Select this and click on OK. The next window will display some selections for
    the type of template you want to use. I chose the basic template, but you can
    choose any of the templates other than the empty template in order to follow along
