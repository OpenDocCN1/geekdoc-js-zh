  md: '<span data-bind="html: spanContent"></span>


    This would generate output like this in the source of the rendered page:


    <span><strong>Some Content</strong></span>


    The text binding works in exactly the same way as the html binding, except that
    it sets the simple text between element tags and it does encode HTML before output,
    so do not put HTML in the property containing the text to display unless you want
    the tags to show as part of the text output.


    # The invisible/visible properties


    The invisible and visible bindings work on HTML elements that you want to either
    show or hide dynamically. Just as their names indicate, you have given the element
    invisible or visible respectively. These bindings are designed for use with Boolean
    values but for the sake of JavaScript loose-typing they will consider the non-Boolean
    values 0, null, undefined, and " (empty string) as false and all other non-Boolean
    values as true. An example code is as follows:


    ```

    showDetails: true,

    ```


    ```

    // This element will be initially visible unless the View-Model''s

    // showDetails property is changed to false

    <p data-bind="visible: showDetails">All sorts of text here...</p>

    ```


    As mentioned earlier, it can be very useful to connect the value of a checkbox
    or a radio button with the visible status of other elements on a page. This allows
    you to change what data is displayed on the page based on selections that the
    user makes. Here is a simple example:


    ```

    showDetails: false,

    <input type="checkbox" data-bind:checked: showDetails

    name="showDetails" />

    ```


    <p data-bind="visible: showDetails">All sorts of text and details...</p>


    This code will make the checkbox control the visibility of the paragraph element
    that would contain some text that you want displayed if the checkbox is checked.
    This is probably simpler than the code you would use in a normal web application,
    but it illustrates the basic point.'
