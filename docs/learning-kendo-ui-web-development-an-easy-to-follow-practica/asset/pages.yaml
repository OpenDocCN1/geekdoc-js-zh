  md: '# 7 Implementing PanelBar and TabStrip


    The PanelBar and TabStrip widgets are special UI controls for organization data,
    which make it possible for a web page to contain a large amount of content but
    display only one piece of that content at a time. These content sections are broken
    up into panels with the PanelBar widget, or tabs with the TabStrip widget. In
    both cases, the effect is very similar and is a very useful way of keeping a web
    page from becoming too cluttered. This chapter will explain the basics of implementing
    the PanelBar and TabStrip controls with both HTML and ASP.NET MVC, and then illustrate
    the following features:


    +   - Adding images to PanelBar and TabStrip items

    - Adding URLs to PanelBar and TabStrip items

    - Loading AJAX content with PanelBar and TabStrip

    - Controlling PanelBar and TabStrip animation effects


    # PanelBar basics


    The PanelBar widget is the Kendo UI way of an an JavaScript ''accordion'' on a
    web page. This type of control is very useful for displaying lists of data that
    could potentially take up a large amount of screen space, but compressing it into
    a format that makes sense to users. As an introduction, here is a code sample
    of a basic PanelBar created from a static unordered HTML list. This list will
    be reformatted into an accordion control that displays a single area of the list
    at a time. As you will see, when you run the code sample, this allows a large
    amount of data to be visually compressed into a smaller space. It also allows
    the user to select which area of the list he she is interested in viewing and
    hides the details of the other sections. This gives a powerful demonstration of
    some of the commonality between Kendo widget implementations.'
