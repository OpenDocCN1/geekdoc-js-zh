  md: "# The Kendo MVVM Framework\n\nThe data-template attribute tells Kendo UI that\
    \ the people objects should be foratted using a Kendo UI template. Here is the\
    \ code for the template:\n\n```\n<script id=\"row-template\" type=\"text/x-kendo-template\"\
    >\n  <tr>\n    <td data-bind=\"text: name\"></td>\n    <td data-bind=\"text: hairColor\"\
    ></td>\n    <td data-bind=\"text: favoriteFood\"></td>\n  </tr>\n</script>\n```\n\
    \nThis is a simple template that defines a tr structure for each row within the\
    \ table. The td elements also have a data-bind attribute on them that Kendo UI\
    \ knows to insert the value of a property as the \"text\" of the HTML element,\
    \ which in this case means placing the value between <td></</td>> as simple text\
    \ on the page.\n\n# Creating the Model and View-Model\n\nIn order to wire this\
    \ up, we need a View-Model that performs the data binding. Here is the View-Model\
    \ for the View:\n\n```\n<script type=\"text/javascript\">\nvar viewModel = kendo.observable({\n\
    people: [\n  {name: \"John\", hairColor: \"Blonde\", favoriteFood:\n  \"Burger\"\
    },\n  {name: \"Bryan\", hairColor: \"Brown\", favoriteFood:\n  \"Steak\"},\n \
    \ {name: \"Jennifer\", hairColor: \"Brown\", favoriteFood:\n  \"Salad\"}\n]\n\
    });\nkendo.bind($(\"body\"), viewModel);\n</script>\n```\n\nA Kendo UI View-Model\
    \ is declared through a call to kendo.observable() which creates an observable\
    \ object that is used for the data-binding within the View. An observable object\
    \ is a special object that wraps a normal JavaScript variable with events that\
    \ fire any time the value of that variable changes. These events notify the MVVM\
    \ framework to update any data bindings that are using variable's value, so that\
    \ they can update immediately and reflect the change. These data bindings also\
    \ work both ways so that a field bound to an observable object is changed, the\
    \ variable bound to that field is also changed in real time."
