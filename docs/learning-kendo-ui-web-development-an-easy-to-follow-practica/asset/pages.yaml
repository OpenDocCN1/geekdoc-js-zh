  md: "# Web API Examples\n\nNext, we need to create an editor template for the Movie\
    \ object, so that this ListView can edit our Movie objects. Make a new folder\
    \ under the Views/Shared folder called EditorTemplates. Then, add a view to the\
    \ EditorTemplates folder and call it Movie.cshtml.\n\n![](img/172a1c72af4c00eec56c9c9ad892894b_272_0.png)\n\
    \nOpen the Movie.cshtml file and add the following code:\n\n@model Chapter11.Models.Movie\n\
    \n```\n<div class=\"movie-view\">\n  <dt>Name</dt>\n  <dd>@Html.EditorFor(model\
    \ => model.Name )</dd>\n  <dt>Rating</dt>\n  <dd>@Html.EditorFor(model => model.Rating\
    \ )</dd>\n  <dt>Rank</dt>\n  <dd>@Html.EditorFor(model => model.Rank )</dd>\n\
    </div>\n<div>\n  <a class=\"k-button k-button-icontext k-update-button\"\n   \
    \  href=\"#\"><span class=\"k-icon k-update\"></span>Save/</a>\n  <a class=\"\
    k-button k-button-icontext k-cancel-button\"\n     href=\"#\"><span class=\"k-icon\
    \ k-cancel\"></span>Cancel/</a>\n</div></div>\n```\n\nThis view will be used by\
    \ the ListView widget when the Edit button is clicked on a Movie item. The following\
    \ is how the page looks by default (when viewing the movies). You can see the\
    \ different elements of a move item and the buttons used to edit or delete it:"
