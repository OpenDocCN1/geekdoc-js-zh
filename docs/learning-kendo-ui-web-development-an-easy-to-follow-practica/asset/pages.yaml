  md: '# Preface


    Web development today requires real expertise in HTML5, JavaScript, and CSS. These
    technologies are not completely new, but there has been so much growth around
    this programming model that it can be difficult to find your bearings when trying
    to create a new website. It seems like every website has a different, special
    trick in rendering attractive layouts or in creating responsive and dynamic experiences.
    A beginner can feel hopeless in learning how to program like this.


    Fortunately, many JavaScript libraries have arisen to meet this intense demand.
    Most of these libraries enable client-side functionality through special shortcuts
    so that a developer can utilize very powerful functionality without writing, or
    even understand, complicated JavaScript code. The jQuery libraries are a very
    good example of this; provide rich functionality and UI controls with only a few
    lines of code, hiding the complicated underneath


    Telerik has taken this model one step further. They have built a powerful JavaScript
    framework called Kendo UI built on top of jQuery but can create complete widgets
    with even simpler code. Not only this, but it includes server-side libraries that
    enable developers to create widgets on the server, and all JavaScript is generated
    automatically! This is an enormous productivity boost, and enables experienced
    developers and beginners to operate on the same playing field. This book will
    take you on an initial journey through the Kendo UI Framework and show how to
    create an entire set of useful and powerful widgets that will make your web pages
    shine like the best sites on the Internet.


    # What this book covers


    Chapter 1, Interacting with Data: DataSource, Templates, and Grid, teaches the
    foundation of the Kendo UI DataSource and Template JavaScript objects. Learn the
    basics of these tools and the most important widget of all—the Grid. These concepts
    will form the basis for all of your creations with the Kendo UI framework.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Preface


    Chapter 2, The AutoComplete Widget and its Usage, shows how to use Kendo UI to
    create a word wheel, or auto-complete, effect on a textbox so that word suggestions
    appear as the user types. Learn how to use this widget and how to connect it to
    different data sources.


    Chapter 3, Using and Customizing Calendar, shows how to create a full-featured
    calendar control on a web page with very little code. Learn how to use the Kendo
    UI framework to customize this widget to tailor it to your needs.


    Chapter 4, The Kendo MVVM Framework, introduces you to Model-View-ViewModel (MVVM)
    development with Kendo UI. JavaScript MVVM frameworks are powerful systems that
    allow you to bind dynamic data to web pages through declaring HTML attributes.
    These systems can be complicated, but the Kendo MVVM framework is as easy as this
    can get. Learn how to use this to enable powerful web pages.


    Chapter 5, HTML Editor and Custom Tools, demonstrates the Kendo UI Editor. This
    HTML editor allows you to use a useful area to format text input with styles and
    layout. This is a perfect feature for blogs, forums, and review sites. Learn how
    to use and customize this widget for your web pages.


    Chapter 6, Menu and ListView, introduces you to the Menu and ListView widgets
    from Kendo UI so you can effectively format and display data on your web pages.
    The Menu widget creates a dynamic menu that opens with hover effects and allows
    for custom animation and behaviors. The ListView is a very flexible widget that
    allows you to format and template data however you like. Learn how to use these
    widgets to display data on your web pages.


    Chapter 7, Implementing PanelBar and TabStrip, illustrates how to build accordion
    controls and tabs on your web pages. Accordion controls provide a useful way to
    include a lot of content on a page without making the page grow in size. It can
    show only a single section of content at a time while providing instant access
    to the tabs. Tabs are very useful for creating navigation bars on a page to show
    other areas of your site that a user can visit. You will learn how to create accordion
    controls with the PanelBar widget and how to create tabs using the TabStrip widget.
    See how using these widgets can make your web pages look better.


    Chapter 8, Slider Essentials, will teach you how to use the Kendo UI Slider widgets
    to display number ranges with an attractive twist. This widget is a very convenient
    method of collecting numerical input from web forms with graphical bars that slide
    and move in steps. Learn how to add these widgets to your web pages to make your
    forms really shine.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Chapter 9, Implementing the Splitter and TreeView Widgets, will illustrate
    how to lay out resizable content areas on your web pages and how to visualize
    hierarchical data with a simple widget. The Splitter widget organizes web pages
    into resizable zones. The TreeView widget creates dynamic displays for hierarchical
    data. Learn how to create these widgets and connect them to data sources.


    Chapter 10, The Upload and Window Widgets, provides instructions on how to build
    powerful upload pages and interactive dialog boxes into your web site. The Upload
    widget creates a powerful file upload utility that works with AJAX and allows
    drag-and-drop functionality. The Window widget creates modal dialog boxes that
    makes areas of web pages appear when necessary on top of other content. Learn
    how to make these widgets and add them to your pages.


    Chapter 11, Web API Examples, takes what you have learned the Kendo UI widgets
    and introduces you into a more advanced area of development using the ASP.NET
    Web API framework. Web API provides a powerful server-side backend for your Kendo
    UI widgets and opens up the possibilities for creative custom development. Learn
    how to manage this technology in your own web applications with ASP.NET MVC.


    # # What you need for this book


    To complete the examples in this book, you will first need Visual Studio 2012.
    You can download a free trial of Visual Studio from www.microsoft.com/visualstudio
    if you do not already have it installed. You will also need the Kendo UI Complete
    for ASP.NET MVC install package from Telerik which you can get at http://www.kendoui.com/download.aspx.


    # # Who this book for


    This book is designed for beginner web developers, who are starting to learn how
    to utilize JavaScript libraries to create rich and interactive web applications.
    The user should be familiar with JavaScript, HTML, and CSS. Some knowledge of
    ASP.NET MVC is helpful, but not required.


    # # Conventions


    In this book, you will find a number of styles of text that distinguish between
    different kinds of information. Here are some examples of these styles, and an
    explanation of their meaning.'
  merge: -1
  pgno: 17
