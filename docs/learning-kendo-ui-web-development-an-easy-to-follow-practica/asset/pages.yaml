  md: '# Summary


    The HTML Editor gives you a lot of functionality for a very small amount of necessary
    coding. In most cases, the default control will meet all of your needs for HTML
    editing on a normal site. But, if you find yourself with a need for a highly customized
    tool, this HTML Editor supports a rich API, detailed configuration options, and
    easily accessible events for capturing and responding to user actions. This is
    a control that is not appropriate for every site, but when you need something
    like this, it is a tremendous boost to productivity to find it all in such a useful
    and usable package.


    In the next chapter, we will cover two very important Kendo widgets—Menu and ListView.
    These widgets give you the ability to create responsive and feature-rich cascading
    page menus and organized data structures inside of your pages with the same Kendo
    approach that you have seen in all of the previous chapters. Building on what
    you already know, using these new widgets will be easy and you should be up and
    running before you know.'
  merge: -1
  pgno: 148
