    ```\n\nThis code examines the specific element that selected and allows its innerHTML\
    \ property back to the user.\n\n# # The Kendo UI ListView\n\nThe Kendo UI ListView\
    \ widget is designed to present a collection of data on a web page with a richer\
    \ set of functionality than a standard HTML list. The ListView widget retrieves\
    \ its data through a Kendo DataSource object, it presents its data through one\
    \ or more Kendo Template blocks, and it allows interaction with its data by giving\
    \ the user the ability to select and edit the data on the page.\n\n# # ListView\
    \ basics\n\nBasically, the ListView displays a collection of data using a template\
    \ and a DataSource object:\n\n```\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    >\n<head>\n  <title>ListView</title>\n  <script src=\"Scripts/kendo/kendo.js\"\
    ></script>\n  <script src=\"Scripts/kendo/kendo.all.js\"></script>\n  <link href=\"\
    Content/kendo/kendo.common.css\" rel=\"stylesheet\" />\n  <link href=\"Content/kendo/kendo.default.css\"\
    \ rel=\"stylesheet\" />\n```"
