    # # Summary


    In this chapter, we have seen how to use the Web API for some more realistic scenarios
    involving two of the Kendo widgets that deal with managing data. We also quickly
    explored the ASP.NET Web API fundamentals as well as Entity Framework and OData.
    These tools, used together, can be a very powerful set and create nearly any custom
    solution that you need.


    The examples we just saw, both use a special attribute that Telerik has provided
    to help with model binding and server-side paging and filtering. It is nice to
    make use of special helpers like this when they are available. I encourage you
    to continue to explore these technologies on your own and see how you can create
    your own custom solutions on your own web pages.'
