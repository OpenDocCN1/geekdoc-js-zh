  md: "# The close(), enable(), open(), and remove() methods\n\nThese methods for\
    \ the Kendo UI Menu do not require a JavaScript object reference; they operate\
    \ directly on the HTML elements within the page. Because of this, you can use\
    \ a jQuery selector type syntax to choose which item(s) to act upon in a familiar\
    \ syntax.\n\nThe enable method takes two parameters: the selector for the HTML\
    \ element(s) and then a true or false value indicates whether the element should\
    \ be enabled (true) or disabled (false):\n\n```\nvar menu = $(\"menu\").data(\"\
    kendoMenu\");\nmenu.enable(\"#secondItem\", false);\n```\n\nThis particular code\
    \ sample will disable the element with an HTML id value of seconditem.\n\nThe\
    \ other methods here, that is, close, open, and remove, only take a single parameter\
    \ which is the selector of the HTML element(s). Please note that the element's\
    \ ID values or class names are not assigned by the framework for you, you have\
    \ to assign these values to your elements yourself in order to select them:\n\n\
    ```\nvar menu = $(\"menu\").data(\"kendoMenu\");\nmenu.close(\".green\");\n```\n\
    \n```\nmenu.open(\"#item3\");\nmenu.remove(\"#lastItem\");\n```\n\n> All of these\
    \ methods return the Menu object to support method chaining.\n\n# Menu events\n\
    \nThere are three events fired by the Kendo UI Menu: close, open, and select.\
    \ Each of these is given an argument with an item property that contains the HTML\
    \ <li> element that was closed, opened, or selected, as shown here:\n\n```\n<script>\n\
    $(document).ready(function () {\n  function onSelected(e) {\n    var menu = $(\"\
    menu\").data(\"kendoMenu\");\n    menu.enable(\".green\", false);\n    alert(\"\
    disabling green menu\");\n  }\n}\n</script>\n```"
  merge: -1
  pgno: 161
- img_proc: true
