  md: '# Creating the view


    Here is a simple HTML page to show how a view basically works:


    ```

    <DOCTYPE html>

    <html xmlns="http://www.w3.org/1999/xhtml">

    <head>

    <title>MVVM Demo l1</title>

    <script src="Scripts/kendo/jquery.js"></script>

    <script src="Scripts/kendo.all.js"></script>

    <link href="Content/kendo/kendo.common.css" rel="stylesheet" />

    <link href="Content/kendo/kendo.default.css" rel="stylesheet" />

    <style type="css">

    th{

    width: 135px;

    }

    </style>

    </head>

    <body>

    <table>

    <caption>People Data</caption>

    <head>

    <tr>

    <th>Hair Color</th>

    <th>Favorite Food</th>

    </tr>

    </head>

    <tbody data-template="row-template"

    d-bind="source: people"></tbody>

    </table>

    </body>

    </html>

    ```


    Here we have a simple table element with three columns instead of the body containing
    any tr elements, there are some special HTML5 data-* attributes indicating that
    something is going on here. These data-* attributes do nothing by themselves,
    Kendo UI reads them (as you will see below) and interprets their values in order
    to link the View with the View-Model. The data-bind attribute indicates to Kendo
    UI that this element should be bound to a collection of objects people.'
