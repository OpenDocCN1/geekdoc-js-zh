  md: '# Slider Essentials


    A disabled widget appears as partially transparent, or grayed out, on the web
    page. In the following screenshot, the slider on the left is disabled and the
    slider on the right is enabled:


    ![](img/172a1c72af4c00eec56c9c9ad892894b_210_0.png)


    # Using the values


    The value of a slider widget can be both set and retrieved from the JavaScript
    API. The syntax is different between the slider and the range slider since each
    use a different number of values internally.


    # Using values from a Kendo slider


    Setting and retrieving values for a Kendo slider is straightforward since it contains
    only a single value, as shown here:


    ```

    // get a reference to the slider

    var slider = $("#{sliderId").data("kendoSlider");

    ```


    ```

    // set the value of the slider to 7

    slider.value(7);

    ```


    ```

    // get the value of the slider

    var sliderValue = slider.value(); // returns a number

    ```


    # Using values from a Kendo range slider


    When setting or retrieving values from a range slider, you must communicate using
    JavaScript arrays so that you can hold both values from the slider object.


    ```

    // get a reference to the slider

    var rangeSlider = $("#{rangeSliderId").data("kendoRangeSlider");

    ```


    ```

    // set the values for the range slider to 2 and 8

    rangeSlider.value([2,8]);

    ```


    ```

    // get the values from the range slider

    var sliderValues = rangeSlider.value(); // returns an object array

    ```'
  merge: -1
  pgno: 210
