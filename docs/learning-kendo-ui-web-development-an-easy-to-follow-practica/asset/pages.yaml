  md: '# OtherDataSource properties


    When reading from local data, you need to reference it by the property called
    data like this:


    ```

    var someData = [{ title: ''Prometheus'', year: 2012, rating: 9, rank: 25

    }];


    var dataSource = new kendo.data.DataSource(

    data: someData

    });

    ```


    Some other properties of DataSource that we have not yet seen are more for data
    manipulation-aggregate, filter, group, sort, page, and pageSize. They can work
    on the data client-side, or they can request the server to do the operations using
    serverAggregates, serverFiltering, serverGrouping, serverSorting, and serverPaging
    properties by adding these to the DataSource object list and setting them to true.


    The aggregate property takes an array of fieldnames and aggregate function names:


    ```

    aggregate: {{ field: ''title'', aggregate: ''count'' }}

    ```


    The filter property can take a simple object, an array of simple objects, or a
    configurable object with some logic to specify filtering that should be done on
    the data:


    ```

    // simple object

    filter: { field: ''title'', operator: ''startswith'', value: ''Shawshank'' }


    //...or array...

    filter: {{ field: ''year'', operator: ''eq'', value: ''1998''}, field: ...


    //...or configurable object...

    filter:{

    logic: "or",

    filters: [

    { field: ''title'', operator: ''startswith'', value: ''Shawshank'' }

    }}

    ```


    These are the different operators that can be used with the filter object. They
    can also be used when the server for filtering by using the serverFiltering


    +   * Equality: eq, ==, equals, equals, equal

    * Inequality: neg, !=, isnotequals, notequals, notequal, notequal, ne

    * Less: lt, <, islesthan, lesthan, less'
