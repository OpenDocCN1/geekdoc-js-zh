  md: "# Controlling PanelBar animation effects\n\nThe animation features of the PanelBar\
    \ can be controlled through the animation property when configuring the PanelBar\
    \ object in JavaScript. The animation property can be set to false to completely\
    \ disable all animation effects, or it can be configured like the following code\
    \ sample for specific behaviors:\n\n```\n$(\"panelId\")({\n...\n  expandMode:\
    \ \"single\", // \"multiple\" for multiple open tabs at once\n  animation: {\n\
    \    collapse: {\n      duration: 1000, // milliseconds for animation effect\n\
    \      effects: \"fadeOut\" // \"fadeout\" is the only option for collapse\n \
    \   },\n    expand: {\n      duration: 500,\n      effects: \"expandVertical fadeIn\"\
    \ // choose either or of\n    }\n  }\n});\n```\n\nThe only available effect for\
    \ the collapse is fadeOut. For the expand, you can choose expandVertical, which\
    \ is the normal action for expanding a PanelBar, and fadeIn which changes the\
    \ opacity as it expands.\n\n# Introducing the TabStrip widget\n\nThe TabStrip\
    \ widget is very similar to the PanelBar widget. In fact, they perform nearly\
    \ the same function except that the PanelBar Widget organizes content into panels\
    \ that are stacked vertically while the TabStrip organizes content into panels\
    \ that stacked horizontally. They are so similar, in fact, that we use nearly\
    \ the same code to demonstrate both of them. You have already seen the PanelBar\
    \ widget in the preceding sections. Now we will take a look at the TabStrip widget\
    \ and see how it functions within web pages.\n\n# TabStrip basics\n\nThe TabStrip\
    \ widget creates a series of tabs that are used to show only one specific section\
    \ of content at a time. The content within a tab can be almost anything, ranging\
    \ from simple text to markup up to all the <div> with enough content across the\
    \ top of the screen to organize different types of material into a single web\
    \ page. The Kendo TabStrip widget is one way to create this effect on your own\
    \ pages."
  merge: -1
  pgno: 186
