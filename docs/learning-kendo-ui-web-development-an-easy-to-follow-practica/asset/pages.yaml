    Take a look at all of the tool buttons across the top of the Editor widget. Click
    on them as you type to observe what they do. Also, note that the different buttons
    generated by the Kendo HTML Editor all support the HTML tabindex so you can use
    the Tab key and the Shift + Tab combination to move back and forth respectively
    between the commands in order you want.


    For many sites, this is probably sufficient functionality. To format the text
    that the user has created, simply retrieve the value of the textarea element and
    it will contain both the content and HTML markup.


    > Don''t forget to check your input

    Since you are openly allowing the user to post HTML markup within the content
    of his or her data, take extra care to sanitize the input before you place it
    into a database or into another page. Even though the HTML markup generated by
    the Kendo tool is safe, you can never trust the final markup that is transmitted
    to the server''s browser and always treat it as if it may contain harmful code.


    Below your formatted text, however, you also need to check whether the value you
    are processing has been encoded or not. If you retrieve the value of the textarea
    element from the DOM, you will get HTML encoded data. This means that <strong><text></strong>
    becomes &lt;strong&gt;text&lt;/ which may may not be what you actually want.


