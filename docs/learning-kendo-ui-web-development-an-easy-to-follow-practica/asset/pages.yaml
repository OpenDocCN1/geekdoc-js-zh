    however, you can see what was sent to the browser:


    ```

    <input class="k-input" id="datePicker" name="datePicker" type="date" />

    <script>

    jQuery(function() { jQuery("#datePicker").kendoDatePicker({format:''M/d/yyyy",min:new
    Date(1900,0,1,0,0,0),max:new Date(2099,11,31,0,0,0) });

    </script>

    ```


    The extension methods create all HTML, JavaScript, and CSS information dynamically.
    You can see how the final output uses the jQuery method of selecting the input
    element and .kendoPicker(...) to create the widget JavaScript. So, although the
    programmer didn''t type out the JavaScript, it was still necessary for Kendo UI
    to work; the MVC extensions are only wrappers around the normal Kendo UI client-side
    framework.


    I should also explain that even though the view is browser, it is processed on
    the server first. The Razor syntax (everything that starts with @) never appears
    in the final markup; it is processed on the server to generate the final markup.
    This means that the Kendo MVC extension methods are really a server-side shortcut
    to creating the final markup needed to make them work as they normally in JavaScript.


    Programming in the MVC framework allows for a very clean separation of concerns
    within the web server and itself, and for a great degree of flexibility around
    how the views run and how they depend on server-side logic. For example, widgets
    that use data can receive this data either as embedded material in the view (a
    dependency on server-side logic), or they can query for data from the client-side
    by calling action methods that return JSON (less dependency on server-side logic).


    As an example of a server-dependent implementation, here is a strongly-typed view
    with embedded model data that can be used by widgets on the page. A strongly-typed
    view is a page that specifies a specific type of object that contains its model
    data. You can see the strongly-typed object in the first line with @model:


    ```

    @model Iumerable<KendoUIWeb.Models.StateTerritory>

    <textarea id="serverData" style="display:none">

    @Html.Raw(ViewBag.serverData)

