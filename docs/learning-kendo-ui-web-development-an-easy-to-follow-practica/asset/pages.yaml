  md: "For the sake of illustration, we will create our entity classes in the Models\
    \ folder\ninside of our Visual Studio project. Create a class called Movie.cs\
    \ in the Models\nfolder like this:\n\n```\npublic class Movie\n{\n    public int\
    \ Id { get; set; }\n    public string Name { get; set; }\n    public int ReleaseYear\
    \ { get; set; }\n    public int Rating { get; set; }\n    public int Rank { get;\
    \ set; }\n}\n```\n\nThe Entity Framework will infer from the properties here that\
    \ the Id property should\nbecome the primary key inside the database. Now that\
    \ we have our model, we need\nto tell the Entity Framework that we want to make\
    \ a database that includes it. Create\nanother class in the Models folder and\
    \ call MoviesContext.cs, as shown here:\n\n```\nusing System.Data.Entity;\n...\n\
    public class MoviesContext : DbContext\n{\n    public DbSet<Movie> Movies { get;\
    \ set; }\n}\n```\n\nThis code forms the Entity Framework that we want a DbContext\
    \ context that\nincludes a DbSet of Movie entities. Let's go ahead and add some\
    \ movies to our\ndatabase, so that we can make use of them in our examples. To\
    \ get started, we need a\npage where we can type in the movie data and have the\
    \ web server save that data to\nthe database."
