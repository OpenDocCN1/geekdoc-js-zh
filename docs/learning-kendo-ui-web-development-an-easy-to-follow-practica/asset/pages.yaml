  md: '# The Upload and Window Widgets


    Since the underlying concept to this technology is hiding and displaying specific
    HTML elements, the basic use of this widget is simply to create a Kendo UI Window
    widget directly on a div tag. This will hide it until you are ready to show it,
    and once you are ready to show it, it will animate it onto the screen as a hovering
    element over the rest of your page. See the following code sample for a basic
    example:


    ```

    <div id="window">

    <p>Windows Azure is a cloud computing platform and infrastructure, created by
    Microsoft, for building, deploying and managing applications and services through
    a global network of Microsoft-managed datacenters. It provides both platform as
    a service (PaaS) and infrastructure supports many different programming languages,
    tools and frameworks, including Microsoft-specific and third-party software and
    systems. Windows Azure is Microsoft''s competing product to Amazon''s AWS cloud
    computing platform, Google App Engine, and other systems.</p>

    </div>

    <button id="windowButton">See Details</button>

    <script>

    $(document).ready(function() {

    ("#window").kendoWindow({

    width: "600px",

    title: "About Windows Azure",

    close: onClose

    });

    });


    var onClose = function() {

    ("#windowButton").show();

    };


    ("#windowButton").on("click", function() {

    ("#window").data("kendoWindow").open();

    ("#windowButton").hide();

    });

    });

    </script>

    ```'
