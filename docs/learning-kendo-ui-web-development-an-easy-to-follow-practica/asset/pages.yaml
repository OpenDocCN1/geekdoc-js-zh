  md: "# Templates\n\nKendo UI Templates are script blocks that contain a small section\
    \ of page markup that is used by Kendo UI widgets to display repeating content.\
    \ We will cover these first, since they will be used throughout the rest of our\
    \ examples. Here is an example of a template:\n\n```\nvar template = kendo.template('<span#=\
    \ horseColor #</span>');\n$(\"#horseDiv\").html(template({\n  horseColor: '.brown'\n\
    }));\n```\n\nRunning this code will set the HTML content of the horse to an element\
    \ that contained the horseColor value that was passed into the template function.\
    \ It would produce the following code output:\n\n```\n<div id=\"horseDiv\"><span>#=brown#</span></div>\n\
    ```\n\nTemplates can also be written within a special type of HTML script block\
    \ so that their layout appears more naturally within the HTML content.\n\n```\n\
    <script type=\"text/x-kendo-template\" id=\"template\">\n<tr>\n  <td>#= rank #</td>\n\
    \  <td>#= rating #</td>\n  <td>#= title #</td>\n  <td>#= year #</td>\n</tr>\n\
    </script>\n```\n\nIn this template sample, the lines containing the code fragments\
    \ #= variable_name #. These indicate the sections of code that are interpreted\
    \ by the Kendo UI Engine. The variable names inside these code blocks are supplied\
    \ to the template when it is used. The JavaScript property names you use inside\
    \ of a template need to be properties on the object that is passed to the template\
    \ when it is called. Note that the script type is x-kendo-template instead of\
    \ javascript, this is important so the browser will not attempt to execute the\
    \ script block on its own. This is a code sample showing this template being initialized\
    \ in JavaScript:\n\n```\n<script type=\"text/javascript\">\nvar template = kendo.template(\\\
    (\\#template\").html());\n```\n\n```\nfunction showMovies() {\n  $(\"#moviesTable\"\
    ).html(template(\n    {rank: 1, rating: 9.2, title: 'Prometheus', year: 2012}\n\
    \  ));\n}\n```"
