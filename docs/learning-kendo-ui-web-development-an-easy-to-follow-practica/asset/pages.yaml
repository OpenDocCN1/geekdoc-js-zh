  md: "# Interacting with Data: DataSource, Templates, TabStrip, and Grid\n\nIn this\
    \ example, we have set the destroy method to use a jQuery $.ajax function to send\
    \ data to the remote server instead of configuring directly on the destroy configuration\
    \ object. You can do this if you prefer the jQuery syntax and to easily attach\
    \ callback functions to the results of the operation.\n\n```\ndestroy: // same\
    \ options as \"create\", with some alternatives shown.\n// this is how you use\
    \ $.ajax() to run this remote service call.\n// this option can be used with \"\
    create\", \"destroy\", \"read\",\n// and \"update\"\n\n$.ajax({\n  url: \"/orders/destroy\"\
    ,\n  data: options.data, // the data field contains paging, sorting,\n  // filtering,\
    \ and grouping data\n  success: function(result) {\n    // notify the DataSource\
    \ that the operation is complete\n    Options.success(result);\n  }\n});\n```\n\
    \nIn this example, we have created a function to be the source of data for the\
    \ read operation. This might be useful if you need to perform custom logic before\
    \ receiving remote data, or if you need to bypass the remote data source entirely\
    \ for some reason.\n\n```\nread: { // same options as above in \"create\" and\
    \ \"destroy\"\ndata: function() { // this is how you specify data as a function.\n\
    return {\n  id: 42,\n  name: \"John Doe\"\n}\n};\n```\n\nRemember that the configuration\
    \ options you just saw are valid for any of the transport operations, I simply\
    \ showed different operations as an example for each configuration. When a DataSource\
    \ is configured with a transport configuration like this, it will use the properties\
    \ and functions within these options to perform the related actions. It will call\
    \ read when it is loading data, update when a record has been changed, destroy\
    \ when a record has been deleted, and create when a new record is added."
