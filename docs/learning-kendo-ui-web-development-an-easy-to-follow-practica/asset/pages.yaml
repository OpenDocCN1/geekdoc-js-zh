  md: "# Columns\n\nFirst of all, we can take control of the formatting of the Grid\
    \ by specifying properties on a columns object array. This object array is used\
    \ to indicate the Grid how to display the data appropriately so that it appears\
    \ as you want on the page. Here is a columns object example using the Grid we\
    \ just saw a moment ago to demonstrate the various options for formatting:\n\n\
    ```\n$(\\#repairsGrid\\).kendoGrid({\n  columns: [{\n    field: \"name\",\n  \
    \  title: \"Service\",\n    width: 300\n  },\n  {\n    field: \"price\",\n   \
    \ title: \"Price\",\n    width: 50,\n    format: \"$(:#.##)\"\n  },\n  {\n   \
    \ field: \"labor\",\n    title: \"Labor\",\n    width: 50,\n    template: \"#=\
    \ labor hour(s)\"\n  },\n  {\n    field: \"staff\",\n    title: \"Staff\",\n \
    \   width: 50,\n    template: \"#= staff # tech(s)\"\n  }\n]});\n```"
