    The first several properties you see are the properties that we are binding to\
    \ the input form. They start with an empty value because the form should not have\
    \ any values when the page is loaded. It is still important to declare these empty\
    \ properties inside the View-Model in order that their value can be tracked when\
    \ it changes.\n\nThe function after the data properties, addPerson, is what we\
    \ have to the click event of the button in the input form. Here in this function\
    \ we are accessing the people and adding a new record to it based on what the\
    \ user has supplied in the form fields. Notice that we have to use the this.get()\
    \ and this.set() functions to access the data inside of our View-Model. This is\
    \ important because the properties in this View-Model are special observable properties\
    \ so accessing their values directly may give you the results you would expect.\n\
    \nThe most significant thing is that you should notice that the addPerson function\
    \ is interacting with the data on the page through the View-Model properties.\
    \ It is not using Query, document.querySelector, or any other DOM interaction\
    \ to read the value of the elements; Since we declared a data-bind attribute on\
    \ the value of the input elements to the properties of our View-Model, we can\
    \ always get the value from those elements by accessing the View-Model itself.\
    \ The values are tracked at all times. This allows us to retrieve and change those\
    \ View-Model properties inside the addPerson function and the HTML page will show\
    \ the changes right as it happens. By calling this.set() on the properties and\
    \ changing their values to an empty string, the HTML page will clear the values\
    \ that the user just typed and added to the table. Once again, we can change the\
    \ View-Model properties without needing access to the HTML ourselves."
