    # Data-bind properties for Kendo MVVM


    There are thirteen types of values that can be used inside of the data-bind Kendo
    UI attribute. Here is a summary of their definitions and uses.


    # The attr property


    The attr property is used to bind the value of a View-Model to a specific HTML
    attribute of a page element. For example, this is very useful for setting attributes
    such as the src for an image or the href for an anchor tag.'
