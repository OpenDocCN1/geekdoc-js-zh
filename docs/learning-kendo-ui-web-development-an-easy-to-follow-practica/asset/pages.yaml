  md: '# Summary


    The Kendo calendar widget is easy to configure, and offers a rich element on your
    page that can make working with dates a much simpler task. It can be configured
    from either JavaScript or MVC extensions and makes use of Kendo templates for
    highly customizable formatting and display. I have only shown basic examples of
    what can be done with the templates and events; you can take these and run with
    them to create some very useful interactive content.


    In the next chapter we will learn about one of the most powerful features of the
    Kendo UI framework of all, the Model-View-ViewModel (MVVM) framework. This framework
    lets you bind data and functionality to your page through simple HTML attributes
    and enable real-time changes to your data, or to a server, with immediate feedback
    for the user. The MVVM framework is a great tool that you will want to use in
    all of your pages.'
