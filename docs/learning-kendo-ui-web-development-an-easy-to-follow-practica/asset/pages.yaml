  md: "# The custom property\n\nKendo UI allows for custom bindings so that you can\
    \ create custom behaviors related to the View-Model of your page. An example on\
    \ the Kendo UI documentation site uses a Query slideDown and slideUp based on\
    \ a Boolean value in the View-Model as a short-cut to some UI transformations.\
    \ Refer to the Kendo UI documentation for a more detailed API reference for custom\
    \ bindings.\n\n# The disabled/enabled properties\n\nThe disabled and enabled bindings\
    \ work on input, select, and text area HTML elements. Just as their names would\
    \ indicate, they disable or enable the non-Boolean elements respectively. These\
    \ bindings are designed for use with Boolean properties, but for the sake of JavaScript-typing\
    \ they will consider the non-Boolean values 0, null, undefined, and \" (empty\
    \ string) as false and all other non-Boolean values as true. An example code is\
    \ as follows:\n\n```\nallowEdit: false,...\n\n// This element will be initially\
    \ disabled until the\nView-Model's allowEdit\n// View-Model's allowEdit property\
    \ is changed to true\n<input type=\"text\" data-bind=\"enabled:allowEdit\" />\n\
    ```\n\n# The events property\n\nThe events binding is a convenient way to wire-up\
    \ event handlers in your View-Model to events on HTML elements in your View. The\
    \ click binding, as we see above, is a simple example of this pattern and operates\
    \ in exactly the same way: \n\n```\n<button type=\"button\" data-bind=\"events:\
    \ {blur: blurHandler, click:clickHandler, mouseover: mouseHandler,...}\">>Interactive\
    \ Button</button>\n```\n\n# The HTML/text properties\n\nThe binding sets the innerHTML\
    \ content of an HTML element using the value of a property from the View-Model.\
    \ This binding differs from the text binding in it does not encode HTML tags before\
    \ generating its output, which means that HTML tags in the View-Model property\
    \ will be rendered as HTML instead of text (which is probably what you want if\
    \ you are using the html binding). An example:\n\n```\nspanContent: \"<strong>Some\
    \ Content</strong></>\",...\n```"
