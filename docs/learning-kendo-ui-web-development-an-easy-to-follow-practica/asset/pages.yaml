  md: '# HTML Editor and Custom Tools


    Interactive HTML editors are an important part of any website that encourages
    users to post their own written content. Forums and blogs frequently offer these
    controls so that users can create content with attractive styling just as if it
    was created in a word processor. It is especially useful for users who are unfamiliar
    with how to format text HTML tags or CSS styles. For that matter, even users who
    are familiar with HTML and CSS can appreciate not having to type it all out. This
    chapter will introduce the following topics:


    +   - Kendo Editor widget basics

    - Configuring the Editor widget tools

    - Using HTML snippets

    - Customizing the Editor widget tools


    # Understanding the HTML Editor


    The Kendo Editor widget creates an area on a web page where a user can create
    formatted text. To see a basic example in action, copy this code into a HTML page
    called HtmlEditor.html. This will allow you to see the widget in use on an actual
    page and provide a starting point for the rest of the chapter.


