  md: "# Menu and ListView\n\nThe Kendo UI Menu widget is designed to give you an\
    \ easy way to implement an interactive JavaScript menu that opens and closes as\
    \ the user commands and providers a rich visual display on a graphically pleasing\
    \ way, especially if the data contains images or through other tricks as well,\
    \ as CSS, but the Kendo UI widget gives you a much more configurable framework\
    \ and access to a simplified JavaScript API.\n\nThe Kendo UI ListView widget is\
    \ a control for visualizing a collection of data elements in a graphically pleasing\
    \ way, especially if the data contains images or special styles. Like all Kendo\
    \ UI options, the configuration is consistent and sensible and allows you to create\
    \ great-looking content, and provides display options for editing and selection.\n\
    \nThese controls are a good addition to your toolset for creating modern web pages.\n\
    \n# Learning the Menu widget basics\n\nThe Menu widget creates a fantastic drop-down\
    \ menu with fly-out sections for the menu's contents. It is functionally rich\
    \ and requires very little code for most implementations. From an introduction,\
    \ here is a code sample of a basic menu created from a static unordered HTML list:\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Kendo UI Menu</title>\n   \
    \ <script src=\"Scripts/kendo/jquery.js\"></script>\n    <script src=\"Scripts/kendo/all.js\"\
    ></script>\n    <link href=\"Content/kendo/common.css\" rel=\"stylesheet\" />\n\
    \    <link href=\"Content/kendo/default.css\" rel=\"stylesheet\" />\n</head>\n\
    <body>\n```"
