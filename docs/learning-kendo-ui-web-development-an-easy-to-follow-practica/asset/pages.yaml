    # Summary


    The Kendo MVVM framework brings complicated interactive JavaScript into the realm
    of simple HTML attributes, templates, and View-Model functions. It is a very powerful
    feature and is one that you are likely to become accustomed to using your web
    pages. Keep in mind as you develop code that Kendo is a system in features which
    can be built together nicely; you could use a Kendo data source object as the
    binding for a table or select list.


    When you have powerful tools to work with, you will find that function-rich pages
    become normal instead of exceptionally difficult and that your programming experience
    will be better than ever. In the next chapter, we will learn about the Kendo UI
    Editor widget. This widget adds a full-featured HTML editing box to your web pages
    so that users can create content in a friendly input area with formatting, images,
    and hyperlinks. It is especially useful if users contribute content on your site,
    such as with a blog or a forum.'
