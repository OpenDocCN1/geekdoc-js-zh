    <img data-bind="attr: {src: imageSource} />


    A binding can be used with any HTML element and guarantee that the image would
    change along with the View-Model to allow for dynamically loading or changing
    images on a web page.


    Note that the attr property can set multiple attributes at once when they are
    separated by commas like this:


    ```

    data-bind="attr: {attribute1: value, attribute2: value, attribute3:

    value, ...}"

    ```


    This property can be used with any HTML element and with any valid HTML attribute
    (including custom HTML5 data-* attributes).


    # The checked product


    The checked property is used to bind the checked status of an input element with
    checkbox or radio. For checkboxes, the data-bound property can be either a Boolean
    (true/false) value or an array. For radio selections, the property needs to be
    a string. For example:


    ```

    isChecked: true, ...

    ```


    ```

    // Simple Boolean binding

    // The data-bound property will be updated when the user clicks the

    checkbox

    ```


    ```

    <input type="checkbox" data-bind="checked: isChecked" />

    ```


    ```

    animals: ["cow", "pig"], ...

    ```


    ```

    // Array binding for checkboxes

    // The array will change based on which checkboxes are checked by the

    user

    // The initial page will show both the "cow" and "pig" inputs as

    checked

    ```


    ```

    <input type="checkbox" value="horse" data-bind="checked: animals" />

    <input type="checkbox" value="cow" data-bind="checked: animals" />

    <input type="checkbox" value="pig" data-bind="checked: animals" />

    ```


    ```

    table: "surface", ...

