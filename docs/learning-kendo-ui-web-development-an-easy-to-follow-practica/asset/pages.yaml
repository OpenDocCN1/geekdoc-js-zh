  md: '# The remove method


    This method removes the specified ListView item and triggers the remove event.

    It also triggers the datasource''s sync method.


    ```

    var listView = $("#listView").data("kendoListView");


    listView.remove(listView.element.children().first());

    ```


    # The select method


    This method selects the ListView item. If this method is called without any arguments,
    it will return a collection of all the selected items in the ListView. This is
    what we do in the code sample for selecting items. Here is a code sample for using
    the method with a parameter:

    Here is a list:


    ```

    var listView = $("#listView").data("kendoListView");


    listView.select(listView.element.children().first());

    ```


    # ListView events


    The ListView widget exposes several events for hooking into its lifecycle and
    behavior. We have already seen some of these in examples. These events can all
    be assigned to handlers during the ListView instantiation as we save earlier in
    the chapter.


    +   - change: Fires when the ListView selection is changed

    - dataBound: Fires when the ListView has received data from the DataSource object
    and is about to render it

    - dataBinding: Fires when the data is about to be rendered on the page

    - edit: Fires when the ListView enters edit mode

    - remove: Fires before the ListView item is removed'
