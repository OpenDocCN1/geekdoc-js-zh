  md: "Interacting with Data: DataSource, Templates, TabStrip, and Grid\n\n# DataSource\n\
    \nThe Kendo UI is a JavaScript object that gives data a common interface for the\
    \ various Kendo UI widgets. The full documentation for the DataSource object can\
    \ be found on the Kendo UI website at: http://docs.kendoui.com/api/framework/datasource.\
    \ The DataSource is a fairly complicated object and relies on building blocks\
    \ that deserve explanations of their own. These building blocks are the Kendo\
    \ objects known as Schema, Transport, and Model. Let's address these first and\
    \ then continue the DataSource itself.\n\nIt is important to note that when creating\
    \ a DataSource object, you should use the new keyword to instantiate a new object\
    \ instead of just using an object literal:\n\n```\nvar dataSource = new kendo.data.DataSource({......});\n\
    ```\n\n# Model\n\nThe Model object is from the namespace kendo.data.Model and\
    \ inherits from Kendo's ObservableObject. It provides a known structure, model,\
    \ or the data that is used by a DataSource and can also be used to enable some\
    \ advanced functionality such as change tracking. To create a new model, you must\
