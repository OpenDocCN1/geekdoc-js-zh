  md: "# Customizing HTML Editor tools\n\nThe Kendo HTML Editor control allows you\
    \ to add your own custom options to the toolbar. This is a remarkable touch of\
    \ flexibility in the Kendo UI framework, and is something that you may find useful\
    \ if the available built-in tools do not completely suit your needs. The HTML\
    \ Editor can accept at least three types of custom tools. There could be more\
    \ but these three appear in the documentation on the Kendo UI website:\n\n+  \
    \ * Override Built-In Tools\n* Custom Template Tools\n* Custom In-line Tools\n\
    \n# Drop-down list tools\n\nIf you would like to alter some of the built-in drop-down\
    \ list tools, you can redefine which options appear inside them. This does not\
    \ alter the nature of the tools or what the tools do. It only determines which\
    \ options appear in the drop-down lists of the tool when you click on them. For\
    \ an example, consider limiting which options appear in the font tool. By replacing\
    \ the contents of the items array, you can customize exactly which options appear\
    \ in the tool when it displays on the page:\n\n```\n$(\"#editor\").kendoEditor({\n\
    {\n  name: \"fontName\",\n  items:\n    [{text\":\"Garamond\", value: \"Garamond,\
    \ serif\"},\n    {text:\"Calibri\", value: \"calibri, sans-serif\"}]\n  }\n});});\n\
    ```\n\nThis code sample demonstrates a customized tool limited to two specific\
    \ options. These two fonts are not included in the default font tool as we saw\
    \ before, but you could also include default fonts in this custom list as well.\
    \ Here is the output of the HTML Editor configured with this custom tool:"
