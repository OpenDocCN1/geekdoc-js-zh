  md: "# Customizing slider orientation\n\nYou have already seen the two orientations\
    \ of the slider widgets—horizontal and vertical, but here is a brief look at the\
    \ code necessary to enable these two options:\n\n```\n$(function() {\n  orientation:\
    \ \"vertical\" // \"horizontal\" or \"vertical\"\n}\n```\n\n> If you do not set\
    \ the orientation, the default orientation will be horizontal.\n\n# Learning API\
    \ methods\n\nWhen interacting with the slider widgets, you must reference the\
    \ JavaScript method through data() as usual:\n\n```\n// Kendo Slider Widget\n\
    var slider = $(\"#sliderId\").data(\"kendoSlider\");\n\n// Kendo RangeSlider Widget\n\
    var rangeSlider = $(\"#rangeSliderId\").data(\"kendoRangeSlider\");\n```\n\n#\
    \ The enable and disable Methods\n\nThe slider widgets support methods for enabling\
    \ and disabling the controls in the web page through enable() and disable() methods.\
    \ The syntax is the same for both slider widgets and range slider widgets, assuming\
    \ you have the correct reference to the object through JavaScript.\n\n```\n//\
