    \ HTML response back to a web browser. The comment above identifies the route\
    \ and HTTP verb that are used to locate this action method:\n\n```\n// GET: /Kendo/\n\
    \npublic ActionResult Index()\n{\n    return View();\n}\n```\n\nIn this case,\
    \ it shows that typing the route \"://<server-name>/Kendo/\" would match this\
    \ action method and cause it to return its view to the browser. It would also\
    \ work to specify http://<server-name>/Kendo/Index and it is usual to supply both\
    \ the controller name, \"Kendo\", and the action name, \"Index\", in a normal\
    \ route. By matter of convention, the MVC framework names all controllers with\
    \ the suffix \"Controller\", but does not use the suffix referring to the controller\
    \ in an actual route (such as the path in the address bar of your web browser).\
    \ This means that the KendoController is referred to as \"kendo\" when it is part\
    \ of a route. GET is the default HTTP verb that this controller will accept when\
    \ the browser requests this route.\n\nAt the top of KendoController add a using\
    \ statement for a namespace that we use to create—LearningKendoUIWeb.Repository.\
    \ Also add Kendo.Mvc.Extensions.\n\n![](img/172a1c72af4c00eec56c9c9ad892894b_53_0.png)\n\
    \nAdd a new method called RemoteData() and set it up like:\n\n```\npublic JsonResult\
    \ RemoteData()\n{\n    var repository = new SampleRepository();\n    var data\
    \ = repository.GetAllMovies();\n    return Json(result, JsonRequestBehavior.AllowGet());\n\
    }\n```\n\nThis is a simple method that instantiates a repository (which we will\
    \ create in just a moment), gathers some data from that, and returns it to the\
    \ client as it is JSON. The second parameter to the Json() method notifies the\
    \ controller class that it is acceptable to return JSON data from this method\
    \ even though the verb is GET.\n\n# [ 39 ]"
