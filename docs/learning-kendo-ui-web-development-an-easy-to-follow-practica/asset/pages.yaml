  md: "# Implementing the basics\n\nAs an introduction, I have created a sample page\
    \ that shows sliders and range sliders in a variety of configurations. We will\
    \ use this same code sample in the following sections where we discuss the features\
    \ and options. In this sample, we have fixed the positions of the elements using\
    \ CSS absolute positioning. This is not necessarily best for web page design,\
    \ but it works to these controls in isolation. In this first code block, we are\
    \ creating the HTML markup necessary to contain the Slider widgets. Each Slider\
    \ is created on top of a div element with elements inside. This will be explained\
    \ more after the following code sample:\n\n```\n<!DOCTYPE html>\n\n<body>\n  <!--\
    \ Two slider widgets -->\n  <div id=\"sliders\">\n    <h2 style=\"position:absolute;top:5px;left:40px\"\
    >Slider Widgets</h2>\n\n    <!-- vertical slider widget -->\n    <div style=\"\
    position:absolute;top:65px;left:100px\">\n      <input id=\"verticalSlider\" value=\"\
