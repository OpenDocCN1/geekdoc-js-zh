    # # Using the Window widget API methods


    The API methods allow us to execute functionality on the Window widget on demand
    in our JavaScript code. See the following brief description on what sort of options
    we have when calling API methods:


    +   - Center: Calling this method returns the Window widget to the centre of the
    screen.

    - Close: Calling this method closes the Window widget.

    - Content: Calling this method either gets the current content of a Window widget
    when called with no parameters or sets the content of a Window widget when providing
    new content as a parameter.

    - Maximize: Calling this method maximizes a Window widget.

    - Minimize: Calling this method minimizes a Window widget.

    - Open: Calling this method opens a Window widget that.

    - Refresh: Calling this method refreshes the content of a Window widget from its
    remote source through AJAX. This method only works for Window widget objects that
    have an AJAX content property set.

    - Restore: Calling this method restores a Window widget from the minimized state
    back into the normal size and position.

    - SetOptions: Calling this method sets the configuration options of a Window widget.

    - Title: Calling this method either gets or sets the title of a Window widget

    - ToFront: Calling this method brings a Window widget to the front of other elements
    on the page

    - ToggleMaximization: Calling this method either maximizes a Window widget that
    is not currently maximized or returns a maximized widget back to its original
    size and position.


