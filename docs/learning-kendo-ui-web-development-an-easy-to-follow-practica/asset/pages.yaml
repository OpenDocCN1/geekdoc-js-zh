  md: '# Making calls to Splitter API methods


    The Kendo UI Splitter widget is equipped with a range of methods that enable its
    rich behaviors. Most of these methods, when fired, trigger an event. Any event
    in JavaScript, you can attach your own event handler functions to these events
    and respond to the actions with your own custom code. This section will show the
    different methods available on the Kendo UI Splitter widget.


    # Getting a reference to the splitter object


    The first thing to remember when working with methods on all Kendo UI widgets
    is that you must get a reference to the JavaScript object before these methods
    are available. To do this, you use the JavaScript method .data(). Here is an example:


    ```

    var splitter = $(\#splitterElement).data("kendoSplitter");

    ```


    Notice how jQuery is used to select the Document Object Model (DOM) element where
    the Kendo UI splitter has been created and then the .data() function has been
    called with the parameter text kendoSplitter indicating the type of object that
    we are trying to get. Now the Kendo UI splitter widget instance has been retrieved,
    methods can be called from the splitter variable directly.


    ```

    splitter.collapse("#outerPane");

    ```


    # Using the ajaxRequest method


    The ajaxRequest method is used to load AJAX content into a specific Kendo UI splitter
    pane. This method takes three parameters. The first parameter is a string used
    to select the specific pane into which the AJAX content should be loaded. It uses
    jQuery syntax to select the element, so to select an element with an id value
    of panel, you use #panel. The second parameter is the URL of the remote endpoint
    that contains the content to load into the pane. The third parameter is optional
    and is used to send data to the remote endpoint if it takes parameters in order
    to send the data back. Here is a code sample showing the method in action:


    ```

    // Get a reference to the Kendo UI Splitter Widget

    var splitter = $(\#splitterElement).data("kendoSplitter");

    ```


    ```

    // Call the ajaxRequest method

    splitter.ajaxRequest("#panel","someContent.html");

    ```


    > Note that this method will cause the contentLoad event to fire.


    ![](img/172a1c72af4c00eec56c9c9ad892894b_220_0.png)'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# Using the collapse method


    The collapse method is used to collapse a specific Kendo Splitter widget pane.
    This method takes one parameter. The parameter is a string used to select the
    specific pane which should be collapsed. It uses jQuery syntax to select the element,
    to select an element with an id value of pane2, you would use #pane2 to select
    it. Here is a code sample of the method in action:


    ```

    // Get a reference to the Kendo UI Splitter Widget

    var splitter = $("#splitterElement").data("kendoSplitter");


    // Call the collapse method

    splitter.collapse("#pane2");

    ```


    > Note that this method will cause the layoutChange and resize events to fire,
    but it will not cause the collapse event to fire since the user did not initiate
    the action with the mouse.


    # Using the expand method


    The expand method is used to expand a specific Kendo UI Splitter widget pane.
    This method takes one parameter. The parameter is a string used to select the
    specific pane which should be expanded. It uses jQuery syntax to select the element,
    to select an element with an id value of pane2, you would use #pane2 to select
    it. Here is a code sample of the method in action:


    ```

    // Get a reference to the Kendo UI Splitter Widget

    var splitter = $("#splitterElement").data("kendoSplitter");


    // Call the expand method

    splitter.expand("#pane2");

    ```


    > Note that this method will cause the layoutChange and resize events to fire,
    but it will not cause the expand event to fire since the user did not initiate
    the action with the mouse.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Using the max and min methods


    The max and min methods are used to set the maximum or minimum size of a specific
    Kendo UI Splitter widget pane. These methods take two parameters. The first parameter
    is a string used to select the specific pane that will be configured. It uses
    jQuery syntax to select the element, so would use #pane3 to select it. The second
    parameter is a string value representing the new maximum or minimum size. This
    is represented as a number of pixels or as a percentage. Here is a code sample
    of the method in action:


    ```

    // Get a reference to the Kendo UI Splitter Widget

    splitter = $(\(\#splitterElement")).data("kendoSplitter");

    ```


    ```

    // Call the max method

    splitter.max("#pane3", "300px");

    ```


    ```

    // Call the min method

    splitter.min("#pane3", "25px");

    ```


    > Note that this method will not cause any events to fire.


    # Using the size method


    The size method is used to set the size of a specific Kendo UI Splitter widget
    pane. This method takes two parameters. The first parameter is a string used to
    select the specific pane that will be configured. It uses jQuery syntax to select
    the element, so to select an element with an id value of pane4, you would use
    #pane4 to select it. The second parameter is a string value representing the new
    size. This value is represented either as pixels or a percentage. It must fall
    within the range of the max and min size values. Here is a code sample of the
    method in action:


    ```

    // Get a reference to the Kendo UI Splitter Widget

    splitter = $(\(\#splitterElement")).data("kendoSplitter");

    ```


    ```

    // Call the size method

    splitter.size("#pane4", "300px");

    ```


    > Note that this method will cause layoutChange and resize events to fire.'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# Using the toggle method


    The toggle method is used to switch the state of a specific Kendo UI Splitter
    widget pane between collapsed and expanded. If the pane is currently expanded,
    the toggle method will collapse it. If the pane is currently collapsed, the toggle
    method will expand it. This method takes two parameters. The first parameter is
    a string to select the specific pane that will be toggled. It uses jQuery syntax
    to select the element, to select an element with an id value of pane5, you would
    use #pane5 to select it. The second parameter is an Boolean value (true or false)
    indicates a specific state that the pane should be irrespective of its current
    state. A value of true sets the pane to an expanded state. A value of false sets
    the pane to a collapsed state. Here is a code example of the method in:


    ```

    // Get a reference to the Kendo UI Splitter Widget

    var splitter = $("#splitterElement").data("kendoSplitter");


    // Call the toggle method

    splitter.toggle("#pane5");


    // Force the pane to expand

    splitter.toggle("#pane5", true);


    // Force the pane to collapse

    splitter.toggle("#pane5", false);

    ```


    > Note that this method will cause the layoutChange and resize events to fire,
    but it will not trigger the collapse or expand events.


    # TreeView


    The Kendo UI TreeView widget is a useful widget when you need to display data
    that is organized hierarchically. Files on a hard disk and business organizational
    structures are good examples of data that is organized in this way. The data has
    a top-level element (such as root folder or CEO) and then has several individual
    elements (such as files or employees) and groups (such as folders or departments)
    beneath that top-level. Each group has further levels of groups such that the
    final diagram can be imagined as a tree with a root and many branches (groups
    of elements) that divide many times and ultimately end with leaves (individual
    elements). As you can imagine, data like this is not very easy to visualize and
    lay out on a web page. Fortunately, the Kendo UI TreeView widget comes to our
    rescue as an easy way to display this data complete with rich interaction and
    configuration options.'
