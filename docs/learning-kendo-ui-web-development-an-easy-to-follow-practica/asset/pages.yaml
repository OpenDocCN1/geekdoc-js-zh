    ```\n\n# Loading AJAX content with PanelBar\n\nInstead of embedding all the content\
    \ into one page, a PanelBar widget can be used to load content from other URLs\
    \ dynamically using AJAX. This will reduce the overall size of the page since\
    \ only one section of the PanelBar will be loaded at a time. It can also allow\
    \ you to load content from other locations in your site that may change independently\
    \ of the site that contains your PanelBar, which can reduce duplicate text or\
    \ markup. To enable this functionality, use the contentUrl property of the PanelBar\
    \ to indicate which sites contain the markup that should be placed inside the\
    \ accordion:"
