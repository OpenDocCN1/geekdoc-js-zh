  md: '# Web API Examples


    Another important concept to understand about API controllers is that they do
    not return values like standard controllers. Rather than generating HTML markup
    for a web browser to display, API controllers generate data that is intended for
    specialized client code, such as JavaScript, to consume. The format of this data
    is something that you do not have to worry about. Notice how the action methods
    in the previous code sample return string values without using the Json() method
    that we have seen in some of the previous chapters. We do not need to tell the
    API how how format its data because it will auto-negotiate the format with the
    communication process. The most common format is JSON, some clients may prefer
    XML or other data types that the ASP.NET framework understands to serialize.


    > You may be interested in knowing how auto-negotiation works. Here is the answer:
    it is based largely on the Accept header from the client during the API call.
    You can create your own content types to extend the API framework for customized
    scenarios. See this page for more information: http://www.asp.net/web-api/asp.net-framework/formats-and-model-binding/content-negotiation.


    Since API controllers are not designed to render web pages with markup, you will
    need to create normal controllers for your web pages as you are used to do. To
    interact with the API controllers, it is very common to utilize JavaScript, especially
    jQuery, to access the API endpoints with a specific HTTP verb to accomplish whatever
    task your page is designed for.


    # Getting familiar with the Entity Framework Code First


    Most applications use a database to store information. Most databases, however,
    store information in a way that does not exactly match with server-side oriented
    programming. This is a very common problem and has given rise to the field of
    Object Relational Mapping (ORM) systems. Many of these exist, Microsoft has created
    one specific to the .NET framework known as the Entity Framework (EF). It is basically
    a framework designed to more easily write code that stores information in a database
    but behaves like an object oriented system. If you have downloaded the sample
    content for this chapter, go ahead and open the Chapter 11 solution to follow
    along. Otherwise, create a new ASP.NET MVC 4 project and choose the Web API template
    when asked.'
  merge: -1
