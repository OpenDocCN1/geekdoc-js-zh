  md: "# Using templates\n\nUsing sprites like this renders the graphics against the\
    \ left side of the TreeView widget directly in-line with the text of each TreeView\
    \ item item that is decorated with an imageUrl property, similar to how the images\
    \ were rendered previously.\n\nThe Kendo UI TreeView widget is highly configurable.\
    \ Along with the ability to add images and sprites, as you just saw in the previous\
    \ section, it can also be customized through the use of Kendo templates. These\
    \ templates can be used to create a display that is customizable into any display\
    \ that you want. As example, consider the following code sample that is used to\
    \ create a special TreeView display with icons of the right item that can be clicked\
    \ to remove the item from the TreeView display:\n\n```\n<script id=\"treeview-template\"\
    \ type=\"text/kendo-ui-template\">\n# item.text #\n# if (item.items) {\n  <a class=\"\
    delete-link\" href='##'[x]'></a>\n#}\n</script>\n```\n\n```\n<script>\n$(\"#treeview\"\
    ).kendoTreeView({\n  template: kendo.template($(\"#treeview-template\").html()),\n\
    \  ...\n});n\n```\n\n```\n// Delete button behavior\n```\n\n+   * My Documents\n\
    \  * Kendo UI Project\n    * about.html\n    * index.html\n    * logo.png\n  *\
    \ New Web Site\n    * mockup.jpg\n    * Research.pdf\n* Reports\n  * February.pdf\n\
    \  * March.pdf\n  * April.pdf"
