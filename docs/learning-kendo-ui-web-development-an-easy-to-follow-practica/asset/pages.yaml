  md: "# The source property\n\nThe source binding is designed to render a Kendo UI\
    \ template using the value of a View-Model property. If the property is an array,\
    \ then the Kendo UI framework will render the template for each element of the\
    \ array. This template is specified by the data-template attribute attached to\
    \ the HTML element in question, and should indicate the template by its id attribute.\
    \ When the templates are rendered, they will be placed directly beneath the element\
    \ in the DOM. This is where you would place the source attribute on the tbody\
    \ element of a table so that the tr elements in the Kendo UI template will be\
    \ rendered and placed directly benefit in the DOM so that they appear as rows.\
    \ This binding can work on any element where it makes sense to include a collection\
    \ of lower level elements, a table is just a natural example; other good uses\
