  md: 'Chapter 9


    +   - dataBound: The DataBound event is triggered after the data source change
    event has been processed, such as when items are added or removed from the data
    source or when the data source is initially populated.


    +   - drag: The drag event is triggered when an item is dragged from or within
    a Tree widget. The drag event supplies a lot of very specific details about its
    location to the event handler which can be used in your custom code.


    +   - dragEnd: The dragEnd event is triggered when an item has been released at
    the end of the drag action and it is inserted back into a TextView widget in a
    new location.


    +   - dragStart: The dragStart event is triggered at the start of a drag action
    as the user begins to drag an item from a TreeView widget.


    +   - drop: The drop event is triggered when an item is dropped after a drag action.
    The drop event supplies a lot of very specific details about its location to the
    event handler which can be used in your custom code.


    +   - expand: The expand event fires when the user clicks on an arrow icon that
    causes a section of the TreeView widget to expand.


    +   - select: The select event is triggered when a node is selected by a user
    clicking on it with the mouse.


    +   - navigate: The navigate event is triggered when the focus changes from one
    TreeView node to something else on the page.


    # Making calls to the TreeView API methods


    The Kendo UI Tree widget is equipped with a wide range of methods that enable
    its rich behaviors. These methods allow you to manipulate the TreeView manually
    in all of the ways that it supports. By using these API methods, you can configure
    and engage the TreeView widget however your application needs. There are many
    methods that the TreeView supports. I will list them all here with brief descriptions:


    +   - append: The append method adds an element to the end of an existing TreeView
    widget section.


    +   - collapse: The collapse method collapses an expanded TreeView widget section.


    +   - data: The data method retrieves a model data item that is bound to a TreeView
    widget element.


    +   - enable: The enable method enables or disables a TreeView widget element.


    +   - expand: The expand method expands a collapsed TreeView widget section.


    [ 219 ]'
