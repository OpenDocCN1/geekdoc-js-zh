  md: 'Implementing the Splitter and TreeView Widgets


    +   * findByText: The findByText method finds a TreeView element by its text value.

    * findByUID: The findByUID method finds a TreeView element by its UID value.

    * insertAfter: The insertAfter method inserts a new element after the specified
    element in a TreeView.

    * insertBefore: The insertBefore method inserts a new element before the specified
    element in a TreeView widget.

    * parent: The parent method retrieves the parent of an element in a TreeView widget.

    * remove: The remove method removes an element from a TreeView widget.

    * select: The select method marks an element in a TreeView widget as selected.

    * dataSource: The setData method sets the data source of a TreeView.

    * text: The text method can get or set the text value of an element in a TreeView.

    * toggle: The toggle method collapses an expanded TreeView section or expands
    a collapsed TreeView section.


    # # Summary


    The Kendo UI Splitter and the Kendo UIView widgets offer a lot of functionality
    as you develop your web pages. The Splitter widget is an impressive tool in organizing
    content sections that are collapsible, expandable, and resizable. This type of
    functionality is not normally so easy. The TreeView widget offers a feature-rich
    version of a hierarchical unordered list with very useful features for graphics,
    collapsible tree sections, and a large number of methods and events. Both of these
    widgets add a lot of value to your website.


    In the next chapter, you will learn about two final widgets from the Kendo UI
    Web Framework, the Window and the Upload widgets. The Window widget allows you
    to create and manage modal pop-up pages with specialized content. The Upload widget
    gives you a richer set of features around the traditional HTML upload element
    for a great file-upload experience for the users of your website.'
