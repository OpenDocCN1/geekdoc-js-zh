    # KendoUI syntax styles


    When using the Kendo framework in your web pages, you will find there are two
    ways to add the widgets to your content. The standard method is to use a jQuery
    syntax within script elements like this:


    ```

    <input type="date" id="makeMeDatePicker" />

    <script type="text/javascript">

    $("makeMeDatePicker").kendoDatePicker();

    </script>

    ```


    The convention, as is known, to select the elements through jQuery and then apply
    a JavaScript method from the Kendo namespaces that alters the content into an
    interactive Kendo UI.


    There is another way, now available through HTML5, to add Kendo widgets to your
    content through a method as declarative initialization. This is a practice where
    you typically add special attributes to your elements that start with "data" and
    then call an initializer that reads these attributes and applies the appropriate
    changes. See this code as an example:


    ```

    <input type="date" id="makeMeDatePicker" data-role="datepicker" />

    <script type="text/javascript">

    kendo.init($("makeMeDatePicker"));

    </script>

    ```'
