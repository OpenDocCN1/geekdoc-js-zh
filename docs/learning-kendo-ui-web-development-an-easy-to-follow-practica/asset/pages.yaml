  md: "will increase or decrease the value of the slider by the number contained in\
    \ the smallStep property. Press Page Up or Page Down will increase or decrease\
    \ the value of the slider by the number contained in the largeStep property.\n\
    \nProperties, smallStep and largeStep, can be set when the slider widget is instantiated\
    \ in JavaScript as we saw in our earlier sample code:\n\n```\n$(\"#verticalSlider\"\
    ).kendoSlider({\n  min: -10,\n  max: 20,\n  orientation: \"vertical\",\n  smallStep:\
    \ 2,\n  largeStep: 10,\n  tickPlacement: \"both\"\n});\n```\n\nThe numbers do\
    \ not have to be even, they can be any whole number increment that makes sense\
    \ for your application.\n\n# Customizing the user interface of the slider widgets\n\
    \nMany of the slider widgets can be used to customize how the user interact with\
    \ them on the web page. The text that shows up in the tooltips and tick mark labels\
    \ can be customized to show different text that may be more specific to your page.\
    \ You can also customize the orientation of the sliders and their default values.\n\
    \n# Tooltip customization\n\nThe tooltip of the slider widgets can be customized\
    \ with a custom format or a custom template and also be disabled completely, if\
    \ unwanted. For example, imagine that your slider is intended for the user to\
    \ select degrees (such as on a thermometer). You could customize the format of\
    \ the tooltip to reflect unique format. You will also see when changing the format\
    \ of the tooltip, the format of the data labels will automatically match it:\n\
    \n```\n$(\"#verticalSlider\").kendoSlider({\n  min: -10,\n  max: 20,\n  orientation:\
    \ \"vertical\",\n  smallStep: 2,\n  largeStep: 10,\n});\n```"
