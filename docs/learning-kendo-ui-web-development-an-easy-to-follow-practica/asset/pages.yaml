    \ Be sure to check your code here in case Telerik has fixed the spelling.\n\n\
    # Customizing the default values\n\nA slider widget can be configured to start\
    \ with a specific default value. For a normal Kendo slider widget, this comes\
    \ in the form of the value property either of the HTML element or in the initialization\
    \ of the Kendo widget in JavaScript, as shown here:\n\n```\n<input id=\"sliderId\"\
    \ value=\"4\" />\n\n// or\n\n(\"#sliderId\").kendoSlider({\n  value: 4,\n...\n\
    )\n```\n\nEither of these methods will set the initial, or default value of the\
