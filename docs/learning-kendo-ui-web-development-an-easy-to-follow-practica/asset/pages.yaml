  md: '# # 2

    The AutoComplete Widget and its Usage


    The AutoComplete widget from Kendo UI creates the "word wheel" effect on an input
    box as a user types. A word wheel is an effect where words appear beneath a textbox
    as a user types that suggest possible search terms. You often see this on search
    engines such as Google and Bing. This can be used to give the user a list of approved
    choices from which he or she can choose, or it can also help the user type specific
    keywords accurately, since the canonical form of the item appears directly beneath
    the input box for the user to select. It also saves the user''s time if he or
    she only has to type one or two characters of a potentially long search term.
    The AutoComplete widget in Kendo UI is very easy to configure and brings this
    functionality to your site with little effort on your part.


    ![](img/172a1c72af4c00eec56c9c9ad892894b_69_0.png)'
