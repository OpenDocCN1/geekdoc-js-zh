  md: "# Interacting with Data: DataSource, Templates, TabStrip, Grid\n\nThe toolbar\
    \ property enables a toolbar for the Grid with a certain set of commands, similar\
    \ to the command property of the column objects. Each toolbar within the toolbar\
    \ array can have a name, template, and text configured:\n\n```\ntoolbar: {\n \
    \ \"create\": [\n    { name: \"save\", text: \"Save This Record\" },\n    { name:\
    \ \"cancel\", text: \"Cancel Changes\" }\n  ]\n```\n\nNote how a toolbar can be\
    \ a simple text value indicating which command to implement. You can also specify\
    \ objects to configure the configuration data that you want (as in preceding screenshot).\
    \ Refer to the following screenshot:\n\n![](img/172a1c72af4c00eec56c9c9ad892894b_68_0.png)\n\
    \n# Summary\n\nIn this chapter, we have covered a fundamental information so that\
    \ you can get starting Kendo UI-enabled web pages. It is essential to understand\
    \ how to use a Template and how to use a DataSource in order to do much as all\
    \ with the Kendo UI framework. Second, to the Grid is an essential component of\
    \ the Kendo UI framework and knowing how to configure it will give you a head\
    \ start building pages that need to display tabular data to a user.\n\nIn the\
    \ next chapter, we will learn about the AutoComplete widget. It allows you to\
    \ add a word-wheel effect to input boxes, to assist users in typing information\
