    and records per page respectively.


    # DataSource methods


    The DataSource methods are used to change or retrieve certain elements of the
    DataSource object. Several of them are related to the same data manipulation that
    we just talked about—aggregate, aggregates, filter, group, page, pageSize, and
    sort. In each of these cases, calling the method without parameters will return
    the current value of the like-named property within the DataSource; calling the
    method with a parameter value will set the value of the like-named property of
    the DataSource to the new value in:


    ```

    // get the current group descriptors

    var g = dataSource.group();

    ```


    ```

    // set a value for filtering

    datasource.filter({ field: ''year'', operator: ''gt'', value: 1990 });

    ```


    There are also methods for adding and removing records. The methods add and insert
    both a new record to the DataSource. The add method simply takes a model object
    or object literal matching the current data format of the items in the DataSource.
    The insert method takes the same object as add, but also specifies an index property
    identifying the zero-based location at which to insert the new record. The remove
    method takes a model object and removes it from the DataSource:


    ```

    // add a new item

    datasource.add({ year: 1997, title: ''The Fifth Element'', rating: 10 });

    ```


