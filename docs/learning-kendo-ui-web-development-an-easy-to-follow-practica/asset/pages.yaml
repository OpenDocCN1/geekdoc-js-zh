  md: '# Using and Customizing Calendar


    Pretty similar, isn''t it? Note that the MVC extension hid the dates below max
    and min and didn''t give us an empty property on the month. There are a few other
    unique things to know First, that we are still using an array of dates through
    JavaScript inside the view. This is because the month template is running in JavaScript,
    not through MVC extensions, and access to this data on the client. Because of
    this, and of the fact that the MVC extensions do not provide a property, we have
    to change the template using data.dates to the actual name of the JavaScript array—datesArray.
    In this example, I typed out the code directly into the MVC method, but there
    is also a method called MonthTemplateId() which you can pass the HTML id of the
    template already on the page.


    Also, remember to always call the .Name() method on every Kendo MVC extension
    object; it is required to work. This is how the MVC methods assign a unique name
    and id attribute to the rendered HTML output, and how all of the JavaScript methods
    and events are properly wired up in the web browser. If you do not include the
    .Name() method, you will also see a runtime error when you try to run the page.


    # # Methods available on the Calendar widget


    The calendar widget exposes several methods that can be used to interact with
    it on the page. These methods can be used to configure the widget by changing
    its properties or filtering specificity in real time. Here is a code form of the
    available methods specific to the Kendo UI Calendar widget:


    ```

    var calendar = $("calendarId").data("kendoCalendar");


    // Set a new max date

    calendar.max(new Date(2013,11,31));

    // Retrieve the current max date

    var lastDay = calendar.max();


    // Set a new min date

    calendar.min(new Date(2011, 11, 31));

    // Retrieve the current min date

    var oldestDay = calendar.min();


    // Navigate to a specific date using a specific date

    calendar.navigate(new Date(2012,2,5), "month");

    ```


