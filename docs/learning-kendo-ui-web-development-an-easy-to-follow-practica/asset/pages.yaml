    >\n  <option value=\"1\">Honda</option>\n  <option value=\"2\">Toyota</option>\n\
    \  <option value=\"3\">Ford</option>\n</select>\n```\n\nBy binding the text, the\
    \ selectedCar property will be bound to\nthe text\n\n```\n// between the option\
