  md: "# The value property\n\nThe value binding works in a similar way to the text\
    \ binding, except that it sets the value of an input element instead of the text\
    \ of a display element. The bound value in the View-Model is updated on blur by\
    \ default, such as when you press Tab to leave the input element on the page.\
    \ If you want the View-Model to be updated based on a different DOM event, you\
    \ can set that in data-value-update on the same element as the binding. We have\
    \ already seen the use of value binding in our code samples. Here is an example\
    \ of using the data-value-update binding to customize behavior.\n\n```\n// the\
    \ row template\n<script id=\"row-template\" type=\"text/x-kendo-template\">\n\
    <tr>\n  <td><input type=\"text\" data-bind=\"value: name\"\n    data-value-update=\"\
    keyup\" /></td>\n</tr>\n</script>\n```\n\nRemember that this is a two-way binding\
    \ and is most useful for retrieving data from the users as they fill out a form.\n\
    \nLike the checked binding that we saw above, the value binding works with elements\
    \ in a similar way. By binding the value of a selected element to a string property,\
    \ it will bound to the value of the selected option element inside it has values,\
    \ or the text of the selected option element if no value is present. Here is how\
    \ this would work in the markup:\n\n```\n// Binding the value, the selectedCar\
