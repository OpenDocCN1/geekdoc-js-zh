  md: '# Summary


    The Menu and List widgets are great tools for structuring data on your web pages.
    The Menu widget makes it simple to create interactive JavaScript menus for navigation
    and even for displaying data with graphics. The ListView widget should become
    a standard option for when you want a standard way of rendering collections of
    data elements on a web page. It gives you the ability to hook up functionality
    that would otherwise require a lot of code and debugging.


    In the next chapter, we will take a look at the Kendo UI PanelBar widget. Its
    API is very similar to the Kendo UI Menu widget, as you will see, and it is a
    powerful way to render accordion controls in a web page. Much like the Kendo UI
    Menu widget, its primary responsibility is to organize hierarchical content in
    a way that saves screen space, but still provides a sensible structure for users
    to understand.'
