  md: '# Change


    The change event fires as the selection in the AutoComplete widget changes. You
    can bind event fires after initialization.


    # Close


    The close event fires when the drop-down list is closed from the AutoComplete
    widget.


    # Open


    The open event fires every time the drop-down list is opened from the AutoComplete
    widget.


    # Select


    The select event fires when any of the elements is selected from the AutoComplete
    widget. It passes the argument e.item to the function that handles it so that
    you can access the item that was selected.


    # Using the API AutoComplete methods


    To access the AutoComplete widget from within JavaScript code, you can access
    it through the API by calling it this way through jQuery:


    ```

    var autocomplete = {\("autocomplete").data("kendoAutoComplete");

    ```


    Once you have a reference to the AutoComplete widget, you will be able to call
    the API methods and manipulate it through code as you wish. These are the API
    methods available on the AutoComplete widget.


    # Close


    The close() method closes the drop-down list on the AutoComplete widget.


    ```

    // get a reference to the autocomplete widget

    var autocomplete = $\("autocomplete").data("kendoAutoComplete");


    autocomplete.close();

    ```'
