  md: "# Menu API configuration options\n\nThe Kendo UI widget, as be expected by\
    \ now, is configurable through a full set of API properties and methods. These\
    \ options are properties that can be configured, so that the Menu widget becomes\
    \ suited to the needs of your web page and style. These configurations are specified\
    \ at the point in code where you create the Menu widget. These sections will show\
    \ you the options you can use.\n\n# The animation property\n\nThe animation action\
    \ of the Kendo UI Menu can be configured for style, speed, and direction. When\
    \ you configure the open action of the menu, Kendo will automatically assign the\
    \ reverse behavior for the close action. If you want to configure the close action\
    \ independently of the open action, then you should configure them both separately,\
    \ as shown here:\n\n```\n$(\"menu\").kendoMenu({\n  close: { // animation to use\
    \ when closing a menu\n    effects: \"slideIn\", // 'slideIn' / 'fadeIn' / 'expand'\n\
    \    duration: 10\n  },\n  open: { // animation to use when opening a menu\n \
    \   effects: \"slideInDown\", // You can assign a direction too\n    duration:\
    \ 10\n  }\n});\n\n// or you can disable disable animation entirely\n$(\"menu\"\
    ).kendoMenu({\n  animation: false\n});\n```\n\n# The direction property\n\nThe\
    \ direction property determines which direction the menus will open when the user\
    \ hovers over them. The available options here are top, bottom, left, and right.\n\
    \n```\n$(\"menu\").kendoMenu({\n  direction: \"bottom\"\n});\n```"
  merge: -1
  pgno: 158
- img_proc: true
  md: "Chapter 6\n\n```\n...\n// or you can specify how each level of submenus open\
    \ separately\n(\"menu\").kendoMenu({\n  direction: \"bottom right\" // \"bottom\"\
    \ for menu, \"right\" for sub\n  menus\n});\n```\n\n# # Some more options\n\n\
    There are few additional options available for configuring menu behavior. You\
    \ can configure how the menu behaves in relation to mouse movement and clicks\
    \ with the onClick, openOnClick, and hoverDelay properties. You can configure\
    \ whether the menu is oriented horizontally or vertically with the orientation\
    \ property, and how to use the Kendo UI framework on how you want menus to fit\
    \ to a page with the popupCollision property. All of this is shown:\n\n```\n$(\"\
    menu\").kendoMenu({\n  onClick: true, // close menu when item is selected\n  hoverDelay:\
    \ 100, // delay before menu open/close\n  openOnClick: false, // root submenu\
    \ with item is selected\n  orientation: \"vertical\", // orientation:\n  popupCollision:\
    \ \"fit\" // how to adjust menu to screen boundaries\n  // Use \"fit flip\" for\
    \ vertical menus.\n  // Set to false to disable boundary detection\n});\n```\n\
    \ncompletely.\n\n# # Configuring menu methods\n\nSome of the methods for the Kendo\
    \ UI Menu widget require that you get a reference to an existing menu item (not\
    \ just the HTML element) as a reference point for appending or inserting additional\
    \ menu items. In this case, you can access the menu item objects through a reference\
    \ to the Kendo Menu like this:\n\n```\nvar menu = $(\\(\"menuDemo\").data(\"kendoMenu\"\
    );\");\n```\n\nIn this code, you can get a reference to the Kendo Menu object\
    \ from the same line of code where you instantiate it. This way, you can reference\
    \ this object in other parts of your page and JavaScript logic. You can also get\
    \ a reference to the Kendo Menu object by calling .data(...) on the HTML element\
    \ that contains it at any point in your code, but doing it in one step is nice.\n\
    \n— 145 —"
