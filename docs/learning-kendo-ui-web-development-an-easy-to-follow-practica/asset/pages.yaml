    # The style property


    The style binding is a great way to create a dynamic relationship between data
    in your View-Model and CSS styles on your. It is a very simple binding that creates
    a direct relationship between the properties in your View-Model and the styles
    in your markup. An example:


    ```

    <span data-bind="style:{color: myColor, fontWeight: myFontWeight}" />

    <script type="text/javascript">

    var viewModel = kendo.observable({

    myColor: "orange",

    myFontWeight: "bold"

    });

    </script>

    ```


    Obviously, this becomes a lot useful if you tie some logic to the styles you are
    using in your page, such as changing the styles for alternating table rows or
    changing the color of text if it meets some special criteria (such as an overdrawn
    balance looking red).


    Notice that we used the property fontWeight which should look strange to you.
    If you need to reference styles that normally contain a hyphen (font-weight),
    you need to use a camel-cased version in the binding so that it works as a valid
    JavaScript property name. So font-weight becomes fontWeight in the actual binding
    statement.


    Finally, if you set the style value to an empty string, it will reset the value
    back to its original setting.'
