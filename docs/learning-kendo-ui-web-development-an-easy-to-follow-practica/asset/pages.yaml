  md: '# Using file drag and drop


    If you are using the asynchronous file upload functionality, there is another
    special feature that you can take advantage of. Since the asynchronous file upload
    processes the files immediately through JavaScript, the web page can enable some
    special behavior, such as dragging and dropping files onto the page using your
    mouse. This functionality is also enabled by default so you can take advantage
    of it without any further configuration. All you have to do is drag a file from
    your computer and drop it onto the screen where the Kendo UI Upload widget is
    present. As you drag the file onto the page, you will see the page react by showing
    some text instructing the user where to drop the file. When the file is dropped,
    the upload starts immediately.


    ![](img/172a1c72af4c00eec56c9c9ad892894b_243_0.png)


    # The Kendo UI Window widget


    JavaScript has long supported pop-up windows that can send messages to a user
    in a web browser. These messages can be simple text for the user to see, they
    can be confirmation boxes to ask permission, or they can sometimes prompt the
    user to enter some information. Of course, these pop-up messages have two big
    problems. First, they are unattractive and have the appearance of a system message
    instead of a coherent portion of a website. Second, they have been so overused
    and abused in the past that many users disable them entirely or make it a habit
    to avoid sites that use them because they are annoying at best and a security
    risk at worst.


    Modern web programmers have found a solution to this problem. JavaScript frameworks
    have been created that can create a different kind of pop-up message. Instead
    of using the actual system that JavaScript did in the past, they have found a
    way to display hovering HTML div elements that are not actual pop-up messages
    at all, they are a true portion of the page that can be hidden or displayed on
    demand. The Kendo UI Window widget is a tool to build these nice hovering page
    elements.'
  merge: -1
