  md: "# Learning the Upload widget\n\nSince the Upload widget is designed to upload\
    \ the contents of one or more files to a server, even the most basic implementation\
    \ of this widget requires a server that can accept file uploads. You can accomplish\
    \ this using your ASP.NET MVC project. To receive the files, you need to create\
    \ an action method that accepts IEnumerable<HttpPostedFileBase as an input parameter.\
    \ The following is how the server will receive the files from the Kendo UI Upload\
    \ widget:\n\n```\n// Action method to receive uploaded files\n[HttpPost] // This\
    \ attribute guarantees that only\npublic Form POST requests can call this action\
    \ method\npublic ActionResult ActionResult Submit(IEnumerable<HttpPostedFileBase>\
    \ files)\n{\n    if (files != null)\n    {\n        //...\n        // Process\
    \ the files and save them\n        //...\n    }\n\n    return View();\n}\n```\n\
    \nWith this code place to receive the uploaded files, you can build the page that\
    \ will host the Kendo UI Upload widget from where the user will choose the files\
    \ to upload. The following code sample shows an HTML form that has been configured\
    \ for use as a Kendo UI Upload widget. Take note that the form has two required\
    \ input elements: a file input and a submit input. These are the normal input\
    \ elements that you should expect for any form that uploads files, but in this\
    \ case, there is also a script element that creates a special Kendo UI Upload\
    \ widget on the file upload element.\n\nHere is the HTML for the index view:\n\
    \n```\n<form method=\"post\" action=\"submit\" style=\"width:45%\">\n<div>\n \
    \   <input name=\"files\" id=\"files\" type=\"file\" /> // HTML file upload\n\
    \    <p>\n        <input type=\"submit\" value=\"Submit\" class=\"k-button\" />\
    \ //\n        Submit button\n    </p>\n</div>\n</form>\n<script>\n```"
