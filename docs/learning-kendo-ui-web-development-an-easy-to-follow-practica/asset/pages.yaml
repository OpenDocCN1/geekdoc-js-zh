  md: "# Transport\n\nThe transport object contains properties that a DataSource can\
    \ use to communicate with a remote server for any of its normal data functions.\
    \ These data functions are be create, destroy, read, and update (corresponding\
    \ to the different actions that can be taken on a record). Each of these data\
    \ functions exists as a property object within the transport object follows the\
    \ same pattern of configuration options. I should note that not all of the data\
    \ functions are required; only those that your DataSource should need to be defined\
    \ within your transport object. This is the basic configuration structure for\
    \ the transport object.\n\n```\ntransport: {\n  create: // this sets configuration\
    \ for creating new records\n    // on the remote server\n  },\n  destroy: // this\
    \ sets configuration for deleting records\n    // on the remote server\n  },\n\
    \  read: // this sets configuration for reading records\n    // from the remote\
    \ server\n  },\n  update: // this sets configuration for updating records\n  \
    \  // on the remote server\n  },\n  autoSync: false, // set true to automatically\
    \ sync all changes\n  batch: false // set true to enable batch mode\n}\n```\n\n\
    Here are the different options for configuring the transport object's remote data\
    \ operations. Each of the four properties follows the same configuration pattern,\
    \ but in this code sample I have different ways of configuring them for the sake\
    \ of example. In this first code sample, I have configured the create operation\
    \ to simply send the value of an HTML element, to the remote server.\n\n```\n\
    create: { // for creating data on remote source.\n  url: \"/orders/create\", //\
    \ the url to create the service.\n  data: // data to send to the service as part\
    \ of the request.\n  // this can also be specified as a function call.\n  id:\
    \ $(\"#id\").val()\n},\ncache: true, // make false to force refresh requests every\
    \ time.\ncontentType: \"application/json\", // default is\n  // application/w-www-form-urlencoded\n\
    dataType: \"json\", // jsonp is also common.\ntype: \"POST\" // which http verb\
    \ to use.\n}\n```"
  merge: -1
