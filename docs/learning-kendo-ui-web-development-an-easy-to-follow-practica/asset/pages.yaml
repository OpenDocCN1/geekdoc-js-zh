  md: "# Interacting with Data: DataSource, Templates, TabStrip, Grid\n\nWhen using\
    \ a custom editor function like this, the container and options objects that are\
    \ passed in have some specific properties available to them that can be useful\
    \ to you when writing your function. The container object is the page element\
    \ to which you should add any mark-up, as we did in our example. The options object\
    \ contains two properties: options.field and options.model. The field property\
    \ contains the name of the field that you use in your new mark-up so Kendo can\
    \ bind anything except. The options.model property contains a reference to the\
    \ actual model of the data being edited if one was specified in the dataSource;\
    \ this gives you access to data that could be important when creating your custom\
    \ logic.\n\nAdditional changes that appeared in the code sample were: editable:\
    \ \"inline\" on the Grid definition (required for editing to work; the alternative\
    \ to inline is popup, which opens a special window for editing the record), and\
    \ the new column that includes command buttons. The command property of a column\
    \ object takes an array of command buttons to generate within each row. The available\
    \ options for this array include edit, create, destroy, save, and cancel. We will\
    \ return to this topic when we go into more detail on how to build a Grid to CRUD\
    \ operations.\n\nNote that what was necessary to add command buttons to the Grid\
    \ was to specify the command property of the column object. I did not add any\
    \ <button> elements to the column, nor did I create JavaScript event handlers.\
    \ Kendo UI generated all of this necessary markup for the Grid widget's existing\
    \ functionality.\n\nA significant portion of Grid functionality can be enabled\
    \ through properties that describe the Grid's current capabilities. Each of them\
    \ in -able. These properties are editable, filterable, groupable, navigable, pageable,\
    \ scrollable, selectable, and sortable. We have already seen filterable and sortable\
    \ and that they take true/false values when used. We have also seen editable,\
    \ but there is more that can be done with this:\n\n```\nconfirmation: \"Are you\
    \ sure?\", // text displayed to confirm a delete\n      operation\n\ndestroy:\
    \ true, // or not to delete item when button\n      is clicked\n\nmode: \"popup\"\
    , // options are \"incell\", \"inline\"\n      and \"popup\"\n\ntemplate: \"#=\
    \ ... #\", // template to use for pop-up editing\n\nupdate: true // switch item\
    \ to edit mode when\n      clicked?\n```"
  merge: -1
  pgno: 64
