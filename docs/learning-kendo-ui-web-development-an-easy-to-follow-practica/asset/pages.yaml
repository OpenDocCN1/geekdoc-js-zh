  md: "# Configuring animation effects\n\nYou may have already noticed that the Kendo\
    \ UI widget places small triangular icons next to each section of the tree layout\
    \ where items exist underneath another. If you click on one of these triangular\
    \ icons with your mouse, the section will either collapse into a hidden state\
    \ or expand into a visible state. When this transition between hidden and visible\
    \ occurs, the Kendo UI Framework will animate it with some effects that make it\
    \ visually appealing. These effects can be configured to suit your own personal\
    \ preference:\n\n```\n$(\"#treeview\").kendoTreeView({\n  animation: {\n    expand:\
    \ {\n      // configure the expansion animation\n      duration: 200, // milliseconds\
    \ of animation\n      hide: false, //?\n      show: true, //?\n      effects:\
    \ \"Vertical fadeIn\" // one or both of these\n    },\n    collapse: {\n     \
    \ // configure the collapse animation\n      duration: 200, // milliseconds of\
    \ animation\n      hide: false, //?\n      show: true, //?\n      effects: \"\
    fadeOut\" // \"fadeOut\" is the only option here\n    }\n  }\n});\n```\n\n# Displaying\
    \ images\n\nThe Kendo UITreeView widget is designed to enable an attractive layout\
    \ for your content. To this end, the Kendo UI Framework has built-in support for\
    \ displaying small images inside of the TreeView next to the items that you are\
    \ displaying. This can be done in one of two ways. The first way is to use individual\
    \ image files for each image that you want to display. The second way is to use\
    \ a CSS sprite image that contains many images that are offset by a certain number\
    \ of pixels."
  merge: -1
