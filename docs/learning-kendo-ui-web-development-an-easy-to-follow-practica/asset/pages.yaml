- img_proc: true
  md: '# 10


    # The Upload and Window Widgets


    Modern web applications have advanced to the point that file uploads and dialog
    boxes have matured from simple, unattractive HTML elements into interactive and
    customizable controls. This powerful functionality does not come for free, however;
    it requires well written JavaScript and CSS styling. The Kendo UI Framework for
    the Web provides prebuilt controls that give you this functionality for very little
    effort. This chapter will explore these controls and illustrate their use.


    # Uploading files


    File uploads have traditionally been a clumpy element within web pages. Uploading
    multiple files was often an even worse, often requiring multiple HTML upload elements
    which forced users to click on a separate button for every file. The Kendo UI
    Framework provides a specialized Upload widget that helps both users and developers
    in this process. Instead of clicking on buttons for every file, users can simply
    drag and drop as many files as necessary to a web page and have them upload automatically,
    and asynchronously, in the background. Developers, likewise, can program to receive
    multiple files simultaneously and receive file uploads through JavaScript without
    causing web pages to become slow and unresponsive.'
  merge: -1
