  md: "# The AutoComplete Widget and its Usage\n\nEven though we just wired up the\
    \ AutoComplete to the server through MVC, the method we used isn't really like\
    \ a call to remote data. It is actually using local data, by saving all of data\
    \ from the server into the JavaScript where the AutoComplete is initialized. There\
    \ isn't anything wrong with this, so as long as we not attempt to embed something\
    \ into the page that it loads slowly. In fact it is a good way to boost performance\
    \ in some situations, but it is important to know where the data is and how the\
    \ page is accessing it. If we want the page to request the data from a URL, we\
    \ need to make some changes to our view.\n\n# Using AutoComplete with MVC through\
    \ Ajax\n\nOpen the view and make a change to the AutoComplete() extension method\
    \ call like this code block.\n\n```\n<h2>AutoCompletePage</h2>\n@Html.Kendo().AutoComplete()\n\
    \    .Name(\"stateAndTerritories\")\n    .Placeholder(\"Choose state or territory...\"\
    )\n    .DataField(\"Name\")\n    .Filter(\\startswith\")\n    .DataSource(source\
    \ =>\n    {\n        read.Action(\"AutoCompleteData\", \"Kendo\");\n    })\n \
    \   .ServerFiltering(false);\n```\n\nWe have removed the BindTo(Model) and replaced\
    \ it with a call to DataSource() where we use a lambda expression to define how\
    \ to create the data source. In this case, we have configured it to use the action\
    \ method that returns the JSON data we configured earlier, and also that the server\
    \ is not performing any filtering. This effectively sets our web page in the same\
    \ way as our original JavaScript page that used the transport property to get\
    \ JSON data from the server."
