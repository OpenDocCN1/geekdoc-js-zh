  md: "# Slider Essentials\n\nFor the Kendo range slider, you need to set both of\
    \ the numbers for the range, so you need to use different properties called selectionStart\
    \ and selectionEnd or set the value properties of both of the inputs in the HTML:\n\
    \n```\n<div id=\"rangeSliderId\">\n  <input value=\"2\" />\n  <input value=\"\
    8\" />\n</div>\n\n// or\n\n$('#rangeSliderId').kendoRangeSlider({\n  selectionStart:\
    \ 2,\n  selectionEnd: 8\n});\n```\n\nBoth of these methods will set the start\
    \ of the selected range to 2 and the end of the selected range to 8.\n\n# Customizing\
    \ tick placement\n\nThe marks and data labels on the slider widgets can also be\
    \ customized by choosing one of four supported options for their display: topLeft,\
    \ bottomRight, both, and none. These are set through the configuration property\
    \ called tickPlacement.\n\n```\n$('#sliderId').kendoSlider({\n  tickPlacement:\
    \ \"topLeft\"\n});\n```\n\n# Placing the tick at the top left\n\nThe topLeft tick\
    \ placement option will place the tick marks on the left side of a vertical slider\
    \ or on the top side of a horizontal slider.\n\n```\n$('#sliderId').kendoSlider({\n\
    \  tickPlacement: \"topLeft\"\n});\n```"
