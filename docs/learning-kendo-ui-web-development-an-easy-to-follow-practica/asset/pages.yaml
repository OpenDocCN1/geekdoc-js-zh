    \ = kendo.observable({\n  people: [\n    {name: \"John\", hairColor: \"Blonde\"\
    , favoriteFood: \"Burger\"},\n    {name: \"Bryan\", hairColor: \"Brown\", favoriteFood:\
    \ \"Steak\"},\n    {name: \"Jennifer\", hairColor: \"Brown\", favoriteFood: \"\
    Salad\"}\n  ]\n});\nkendo.bind($(\"body\\ viewModel);\n</script>\n</body>\n</html>\n\
    ```\n\nHere is a screenshot of the page in action. Note how the data from the\
    \ JavaScript people array is populated into the table automatically:\n\n![](img/172a1c72af4c00eec56c9c9ad892894b_104_0.png)\n\
    \nEven though this example contains a Model, a View, and a View-Model, all three\
    \ units are in the same HTML file. You could separate the JavaScript into other\
    \ files, of course, but it is also acceptable to keep them together like this.\
    \ Hopefully you are already seeing what sort of things this MVVM framework can\
    \ do for you.\n\n# Observable data binding\n\nBinding data to your HTML web page\
    \ (View) using declarative attributes is great, and very useful, but the MVVM\
    \ framework offers more significant functionality that we didn't see in the example.\
    \ Instead of simply attaching data to the View and leaving it at that, the MVVM\
    \ framework maintains a running copy of the View-Model's properties, and keeps\
    \ references to those properties up to date in real time. This is why the View-Model\
    \ is created with a function called \"observable\". The properties inside, observable,\
    \ report changes back the chain so that the data-bound fields always reflect the\
    \ latest data. Let's see some examples."
