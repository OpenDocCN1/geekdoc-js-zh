  md: '# The Kendo MVVM Framework


    JavaScript development has come a long way since its inception and the appearance
    of rich MVVM frameworks is wonderful evidence of that evolution. These allow the
    developer to separate responsibilities within the code to better handle complexity.
    They also provide a beautifully simple syntax so that the MVVM framework itself
    is left to handle the tedious work of binding dynamic data into your web pages.
    If you have never used a JavaScript MVVM framework before, you are in for a treat
    with the Kendo MVVM framework.


    # Understanding MVVM – basics


    MVVM stands for Model (M), View (V), and View-Model (VM). It is part of a family
    of design patterns related to system architecture that separate responsibilities
    into distinct units. Some related patterns are Model-View-Controller (MVC) and
    Model-View-Presenter (MVP). These differ on what portion of the framework is responsible
    for, but they all attempt to manage complexity through the same underlying design
    principles. Without going into unnecessary details here, suffice to it say that
    these patterns are good for developing reliable and reusable code and they are
    something that you undoubtedly benefit from if you have implemented them properly.
    Fortunately, the good JavaScript MVVM frameworks make it easy by wiring up the
    components for you and letting you focus on the code instead of the "plumbing".'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# The Kendo MVVM Framework


    In the MVVM pattern for JavaScript through Kendo UI, you will need to create a
    definition for the data that you want to display and manipulate (the Model), the
    HTML markup that structures your overall web map (the View), and the JavaScript
    code that handles user input, reacts to events, and transforms the static markup
    into dynamic elements (the View-Model). Another way to put it is that you will
    have data (Model), presentation, and logic (View-Model).


    In practice, the Model is the most loosely-defined portion of the MVVM pattern
    and is not always even present as a unique entity in the implementation. The View-Model
    can assume the role of both Model and View-Model by directly connecting the Model
    data properties within itself, instead of referencing them as a separate unit.
    It is acceptable and also seen within ASP.NET MVC when a View uses the ViewBag
    or the ViewData collections instead of referencing a strongly-typed Model class.
    Don''t let bother you if the Model isn''t well defined as the View-Model and the
    View. The implementation of any pattern should be filtered down to what actually
    makes sense for your application.


    # Simple data binding


    As an introductory example, consider that you have a web page that needs to display
    a table of data, and also provide the users with the ability to interact with
    that data, by clicking specifically on a single row or element. The data is dynamic,
    so you do not know beforehand how many records will be displayed. Also, any change
    should be reflected immediately on the page instead of waiting for a full page
    refresh from the server. How do you make this happen?


    A traditional approach would involve using special server-side controls that can
    dynamically create tables from a data source and even wire-up some JavaScript
    interactivity. The problem with this approach is that it usually requires some
    complicated communication between the server and the web browser through ''view
    state'', hidden fields, or query strings. Also, the output from these special
    controls is rarely easy to customize or manipulate in significant ways and reduces
    the options for how your site should look and behave. Another choice would be
    to use special JavaScript functions to asynchronously retrieve data from an endpoint,
    generate HTML markup within a table and then wire up events for buttons and links.
    This is a good solution, but requires a lot of coding and complexity which means
    that it will likely take longer to debug and refine. It may also be beyond the
    skill set of a given developer without significant research. The third option,
    available through a JavaScript MVVM like Kendo UI, strikes a balance between these
    two positions by reducing the complexity of the JavaScript but still providing
    powerful and simple data binding features of the page.'
  merge: -1
  pgno: 100
