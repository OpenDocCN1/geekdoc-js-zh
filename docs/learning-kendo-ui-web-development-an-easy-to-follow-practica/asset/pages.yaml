- img_proc: true
  md: '# 9


    # Implementing the Splitter and TreeView Widgets


    In this chapter, you will learn about two different widgets from the Kendo UI
    framework, the Splitter widget and the TreeView widget. The Splitter widget is
    a tool used for organizing content inside of a web page. It creates block-like
    regions within the web page that can contain normal page elements or even additional
    Splitter controls to further subdivide the content area. The TreeView widget is
    a tool for displaying data that is organized hierarchically, such as in tree.
    A good example of organized data this way is a folder structure on a hard drive.
    Folders can contain files or additional folders. When diagrammed, this creates
    a nested structure such as a tree and is well suited for the TreeView widget.


    # The Splitter widget


    The Kendo UI Splitter widget is a powerful tool for creating a dynamic page layout.
    It generates bordered sections within a web page that can be resized, scrolled,
    collapsed, and nested. These sections are built on top of div elements and extend
    these underlying div elements with impressive functionality. As you see how to
    use this widget throughout this section, I am sure you can imagine many ways of
    putting it to use.


    # Learning the Splitter widget


    The Kendo UI Splitter widget is designed to extend div HTML elements into flexible
    content areas that can split elements of your web pages, hence the name "splitter".
    These content areas become resizable blocks that allow the user to choose which
    portions of a page should occupy more of the visible screen. Each of these blocks
    can be configured with specific behaviors and options, such as scroll bars and
    the ability to collapse page elements with a single click.'
  merge: -1
  pgno: 213
