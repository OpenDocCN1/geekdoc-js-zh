  md: '# # 11 Web API Examples


    Many of the widgets we explored in the previous chapters are most useful when
    paired with more advanced server-side code. For example, many applications use
    databases and work with files. While the previous chapters showed the client-side
    code, such as HTML and JavaScript, that is necessary to use these widgets, they
    did not focus on the ASP.NET server-side C# code that many real-world applications
    utilize. To demonstrate how to use the Kendo UI Framework with these types of
    scenarios, this chapter will show some specialized examples of using the Kendo
    UI Framework with the ASP.NET Web API and with the Entity Framework.


    > If you are unfamiliar with the ASP.NET Web API framework, you can visit www.asp.net/web-api
    for some good examples, videos, and walkthroughs.


    # ## Getting familiar with the ASP.NET Web API


    The most recent release of the ASP.NET MVC Framework, MVC 4, included templates
    for a new feature known as Web API controllers. These controllers are specialized
    HTTP communication endpoints and allow for the creation of RESTful API services.
    A RESTful API service is a HTTP web service that allows clients to communicate
    using standard HTTP verbs (Get, Post, Put, Delete, and Patch) in order to perform
    operations on the server.'
  merge: -1
  pgno: 255
- img_proc: true
  md: "# Web API Examples\n\nTraditionally, ASP.NET had the ability to create web\
    \ services as SOAP endpoints (as opposed to REST endpoints). SOAP web services\
    \ use XML schemas and are very good at serializing and deserializing strongly-typed\
    \ objects and have been widely adopted in production systems. Compared with RESTful\
    \ services, SOAP services are more verbose and brittle, a change to the schema\
    \ is required to implement any new features. Additionally, the explosive growth\
    \ around JavaScript has made RESTful services more appealing to developers since\
    \ they can be easily accessed through script blocks and common JavaScript code.\n\
    \nRESTful web services are becoming more and more common on the Internet. Many\
    \ popular web-based services expose RESTful APIs to enable integration with mobile\
    \ apps, web-based dashboards, and other software projects. This widespread adoption\
    \ is due largely in part to the equally widespread adoption of JavaScript Object\
    \ Notation (JSON) for serializing and deserializing objects. JSON makes it simple\
    \ for any web client to interpret data from any server without requiring proprietary\
    \ licenses or algorithms.\n\nA RESTful web request is simple and you use them\
    \ every day, if you did not already know. Every time you type a URL in a web browser,\
    \ you are issuing an HTTP GET request to the server at that address. Likewise,\
    \ most web pages include forms like the HTTP POST to post data back to the server\
    \ to be saved. Do you remember seeing the `[HttpGet]` and `[HttpPost]` attributes\
    \ on some of the controller action methods? These attributes are indicated to\
    \ ASP.NET that only a specific type of HTTP verb (either a GET or a POST) is allowed\
    \ for that action method. This does have security implications, but it is actually\
    \ more useful for determining which method the server should depend on which HTTP\
    \ verb the client sends with the request. In other words, a controller could have\
    \ five different action methods with different HTTP attributes for each one, as\n\
    \n```\n[HttpGet]\npublic ActionResult Get(int objectID = 0)\n{\n...\n}\n```\n\n\
    ```\n[HttpPost]\npublic ActionResult Post(Object postedObject)\n{\n  ...\n}\n\
    ```"
  merge: -1
  pgno: 256
- img_proc: true
  md: "```\n[HttpPut]\npublic ActionResult Put(Object objectToPut)\n{\n    ...\n}\n\
    \n[HttpPatch]\npublic ActionResult Patch(Object objectToPatch)\n{\n    ...\n}\n\
    \n[HttpDelete]\npublic ActionResult Delete(int objectId)\n{\n\n}\n```\n\nThe problem\
    \ with the preceding code is that it creates a separate route for each of the\
    \ different functions for the page. If this page were accessible from the route\
    \ http://mysite.com/movies, we could use http://mysite.com/movies/get/25 to see\
    \ data for a specific movie, but we would have to use a completely different route\
    \ in order to add a new movie or delete a movie, such as http://mysite.com/movies/put.\
    \ This may not seem like a big problem for a website where URLs can be embedded\
    \ in forms and links without much interaction from the user, but this is a problem\
    \ for developers to create a program to access the API from remote code.\n\nThe\
    \ ASP.NET MVC Web API solves this problem by creating controllers solely for the\
    \ purpose of creating RESTful services. In a standard MVC controller, each action\
    \ method creates a new route (or URL) that ultimately generates some content inside\
    \ a view. In a Web API controller, however, each action method specifies a single\
    \ HTTP verb for the same route (or URL). In other words, a Web API controller\
    \ serves only a single HTTP endpoint; it only operates for a single route. For\
    \ an API developer, this is perfect. A single HTTP endpoint, such as http://mysite.com/api/movies,\
    \ can respond to all of the HTTP verbs appropriately without having to use different\
    \ URLs for each operation."
  merge: -1
  pgno: 257
- img_proc: true
  md: "# Web API Examples\n\nInside of the API controller, each of the HTTP verbs\
    \ gets one or more action methods for serving that specific type of request. The\
    \ route to the controller defaults to the controller's name. So a controller called\
    \ MoviesControllercs would default to the route http://mysite.com/api/movies.\
    \ This is as far as the route gets; the only difference between requests to this\
    \ endpoint is in which HTTP verb request includes and which parameters are passed\
    \ as arguments. The following is the default code generated by the ASP.NET Web\
    \ API template for an API controller:\n\n```\n// GET api/values\npublic IEnumerable<string>\
    \ Get()\n{\n    return new string[] { \"value1\", \"value2\" };\n}\n```\n\n```\n\
    // GET api/values/5\npublic string Get(int id)\n{\n    return \"value\";\n}\n\
    ```\n\n```\n// POST api/values\npublic void Post([FromBody]string value)\n{\\\
    }\n```\n\n```\n// PUT api/values/5\npublic void Put(int id, [FromBody]string value)\n\
    {\\}\n```\n\n```\n// DELETE api/values/5\npublic void Delete(int id)\n{\\}\n```\n\
    \nNotice that the names of the action methods are the names of HTTP verbs. This\
    \ is not an accident, it is required that the action method either match an HTTP\
    \ verb or begin with an HTTP verb. So an action method can be either Get or it\
    \ be called GetMovie. Also notice that are two different versions of the Get action\
    \ method in this controller. Just like in a standard controller, the same action\
    \ method can be listed multiple times as long as the signature for each method\
    \ is unique. In this case, it allows us to have a standard Get method and a more\
    \ specialized Get method that returns information for a specific record."
  merge: -1
  pgno: 258
- img_proc: true
  md: '> You can visit http://www.asp.net/web-api/overview/web-routing-and-actions/routing-in-aspnet-web-api
    for a good overview of Web API routing rules and naming conventions.


    You will also notice that these action methods do not have the HTTP verb attributes
    on them. For an API controller, these attributes are not required. There is a
    new attribute in the code sample, however. You can see it in front of the parameters
    for the Post and Put actions: [FromBody]. This special attribute is used to assist
    the model binder in locating the parameter in the body of the HTTP request. It
    is not always necessary, such as when you are binding a complex object that the
    model binder can clearly see made up of specific properties with specific names.
    For a simple string value in this code sample, however, it needs to know that
    you intend to bind the HTTP request body to that input parameter. There is also
    an attribute ([FromUri]) to indicate that a parameter comes from the URL. Most
    of the time, these parameters will be unnecessary but they are available to help
    solve problems that the model binder is unable to solve on its own. It is worth
    some more research if you are unfamiliar with it. The basic rules that Web API
    uses for model binding work like this:


    +   - Simple types are taken from the URL (URI)

    - Complex types are taken from the request body


    Simple types include all of the .NET Framework primitive types, plus DateTime,
    Guid, String, and TimeSpan. For each action method, at most one parameter can
    read the request body. If you try to mark more than one parameter with [FromBody],
    you will get a runtime error or null values.


    > You can visit http://blogs.msdn.com/b/jmstall/archive/2012/04/16/webapi-does-parameter-binding.aspx
    for more information on parameter binding with Web API.'
  merge: -1
