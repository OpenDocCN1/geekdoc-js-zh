    # Kendo UI MVC – basics


    Since we will be using ASP.NET MVC a bit in this book, I should define some important
    terms so that there isn''t any confusion later. MVC stands for Model-View-Controller;
    so let''s establish a common terminology around these. First, a web page is referred
    to as a view, and using Razor syntax with C#, the web pages have a file extension
    .cshtml. There is also the option of using Visual Basic in which the web pages
    have a file extension, .vhtml, but we will be using C# in this book so you won''t
    see this in the examples.


    Second, the controller is a server-side class that is responsible for all of the
    logic in generating the content included in a web page (view). The controller,
    along with the route, is responsible for establishing the publicly accessible
    URLs to the server will serve, and responding HTTP verbs are required to access
    them. In general, a controller is responsible for contacting any external dependencies,
    such as a database or web-server, performing any necessary logic and calculations
    on the data retrieved from those external dependencies, and then packing up all
    of processed data into an object called the model.


    The model, is an object container that contains the data that the web page (view)
    needs in order to display itself. In a properly separated system, the controller
    is the engine that performs all logic, data manipulation, user-input handling,
    authorization, and security. The view is the data presented and is concerned only
    with the graphical representation of the data it has given; no logic part of what
    is required for presentation (not to that presentation can be complex). The model
    is the standard data format that the controller uses to send its final product
    to be presented to the user.


    When programming in the ASP.NET MVC environment, Kendo UI offers a rich set of
    server-side extensions for creating its widgets. Instead of typing out an HTML-element,
    specifying its attributes and wiring it up to Kendo UI JavaScript, the entire
    process can be done using server-side objects that appear in the view. For example,
    creating a DatePicker widget in MVC syntax looks like this:


    ```

    @(Html.Kendo().DatePicker().Name("datepickerField"))

    ```'
