  md: "# Hooking into events\n\nJust as with the other Kendo UI widgets, event handlers\
    \ can be bound during object instantiation, or later through a JavaScript bind\
    \ method call. These examples will show only the instantiation code.\n\n# Using\
    \ the change event\n\nThe slider widgets will fire a change event when the user\
    \ changes the value of a slider either through clicking one of the arrows, moving\
    \ the slider with the mouse, or using the keyboard controls.\n\n# The change event\
    \ for a Kendo slider widget\n\nThe change event for a Kendo slider widget can\
    \ be bound and used like the following:\n\n```\n$(\"#sliderId\").kendoSlider({\n\
    \  change: changeHandler,\n  ...\n});\n\nfunction changeHandler(e) {\n  alert(e.value);\
    \ // e.value contains the new value of the slider\n}\n```\n\nThe e.value property\
    \ will contain the new value of the slider so that you can respond to the event\
    \ properly in your JavaScript code.\n\n# The change event for a Kendo range slider\
    \ widget\n\nThe change event for a Kendo range slider widget can be bound as shown\
    \ in the following code snippet. It differs from the change event for the slider\
    \ widget that it passes an array to the event handler instead of a single value.\n\
    \n```\n$(\"#rangeSliderId\").kendoRangeSlider({\n  change: changeHandler,\n  ...\n\
    });\n\nfunction changeHandler(e) {\n```"
