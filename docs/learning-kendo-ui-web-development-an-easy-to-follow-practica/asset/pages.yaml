  md: '# Chapter 1


    The groupable property lets the user group columns by dragging them to the top
    of the screen. The groupable option also includes a property, groupable.messages.
    empty that will be displayed in an empty grouping on a Grid. If you specify this
    messages, the groupable: true value is assumed and does not need to be specified.
    The navigatable property turns on or off keyboard navigation within the Grid.
    Here is how the bottom of our Grid definition would look with groupable and navigatable
    turned on:


    ```

    sortable: true,

    filterable: true,

    editable: "inline",

    navigatable: true,

    groupable: {

    messages: "Drag column header here for grouping"

    }

    ```


    And in the output page rendered with these options:


    ![](img/172a1c72af4c00eec56c9c9ad892894b_65_0.png)


    The pageable option can be simply set to true/false, like several of the other
    options, but it also allows for more fine-grained control if you desire it:


    ```

    pageable: {

    pageSize: 10,

    ```


    [ 51 ]'
