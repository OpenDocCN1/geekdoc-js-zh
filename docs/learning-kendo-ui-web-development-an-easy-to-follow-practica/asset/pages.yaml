    # The slide event


    The slide event is identical in syntax to the change event, but it only fires
    when the user moves the slider by using the mouse, it will not fire for keyboard
    events or button clicks. The preceding examples for the change event are valid
    for the slide event as well.


    ```

    $("#sliderId").kendoSlider({

    slide: changeHandler,

    ...

    });

    ```


    # The change and slide events with MVC

    extension methods


    This is how event handlers can be wired up using ASP.NET MVC extension methods.
    Please note that the output is identical to the one outlined before; this is the
    syntax necessary for executing the code using MVC. See the previous sections for
    information.


    +   .Events (events => events)

    .Slide("slideHandler")

    .Change("changeHandler") )


    # Summary


    The Kendo UI Slider and Kendo UI RangeSlider are handy tools for collecting numbers
    for an input element in a web page. When collecting numbers that must fall within
    a specified range, these widgets are much friendlier than returning error messages
    to the user about a number being invalid. I would suggest using them where appropriate
    to make your site more interesting for your users.


    In the next chapter, you will learn about the Splitter and the TreeView widgets
    that allow you to load resell dynamic content into your pages and organize hierarchical
    content in a tree-like display. These widgets will help you build powerful pages
    that can handle and load content on the fly and display content in organized patterns.'
