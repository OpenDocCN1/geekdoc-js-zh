- img_proc: true
  md: '# 8

    Slider Essentials


    The Kendo UI framework includes special widgets called sliders that show a slider
    bar on a web page, so that a user can drag a handle to increase and decrease the
    slider in order to choose a value. These sliders normally have tick marks and
    labels that indicate the highest and lowest numbers available as well as range
    between them. These widgets are great visual tools to help users select numbers
    on a fixed scale, instead of just typing a value that may or not be appropriate.
    This could be useful in a rating system, for example, or on any input control
    where only a certain set of numbers are allowed. As you will see, Kendo UI allows
    for a good level of configurability, so you can customize the appearance and functionality
    of the UI to suit your needs.


    # Introducing Slider and RangeSlider


    The first thing we should cover is the two different types of slider widgets that
    Kendo UI makes available. There is the standard Kendo Slider widget and there
    is a Kendo UI RangeSlider widget. The Kendo UI RangeSlider widget is designed
    for more advanced scenarios where your page needs to capture a range (a bottom
    and a top number) of numbers from a user in a single page instead of just a single
    value.


    It is important to understand that these slider widgets are special visual aids
    for supplying a number into an input HTML element. The final output of a slider
    widget is the number that the user has selected and this number is set as the
    value of the input HTML element underneath. This is so important that the input
    element can be posted inside of an HTML form and used by a web server on the other
    end when the form is posted.'
  merge: -1
  pgno: 195
- img_proc: true
  md: "# Slider Essentials\n\nAlong these lines, be sure to follow this pattern when\
    \ creating a Kendo UI Slider widget on your page:\n\n```\n<!-- value is optional,\
    \ but will set the initial value of the slider\npresent -- -->\n<input id=\"sliderId\"\
    \ value=\"2\" />\n...\n<script>\n$(function() {\n  $(\"#sliderId\").kendoSlider({......});\n\
    });\n</script>\n```\n\nThe kendoSlider method needs to be bound to an actual HTML\
    \ element. So what about the Kendo RangeSlider widget? Its control contains only\
    \ one value. How does it maintain these two separate values? The answer is that\
    \ it uses two input elements inside of a container div tag:\n\n```\n<div id=\"\
    rangeSliderId\">\n  <input\n  <input />\n</div>\n...\n<script>\n$(function() {\n\
    \  $(\"#rangeSliderId\").kendoRangeSlider({......});\n});\n</script>\n```\n\n\
    This way, the Kendo UI RangeSlider widget is created on a div element and it builds\
    \ its range values into the two input elements inside of that container div to\
    \ properly render it on the page.\n\n# Using Slider and RangeSlider with the MVC\
    \ extension methods\n\nThe following code sample illustrates the basics of instantiating\
    \ slider widgets using ASP.NET MVC extension methods. The Name method must be\
    \ called for all the Kendo widgets to work properly.\n\n```\n@(Html.Kendo().Slider().Name(\"\
    horizontalSlider\"))\n...\n@(Html.Kendo().RangeSlider().Name(\"horizontalRangeSlider\"\
    ))\n```"
  merge: -1
