    \ (PaaS) and software as a service (SaaS) with tools and frameworks, including\
    \ both Microsoft and third-party software and systems. Windows Azure is Microsoft's\
    \ computing product to Amazon's AWS computing platforms, Google App Engine, and\
    \ other systems |\n\n# # Cancelling an update in progress\n\nWhile a file upload\
    \ is taking place asynchronously, a button will appear beside the progress bar\
    \ for cancelling the upload. If you click this button, it will attempt to cancel\
    \ the asynchronous upload that is in progress. You should note that cancelling\
    \ asynchronous uploads is not a guaranteed service. Most file uploads occur quickly\
    \ and it is unlikely that you will be able to cancel it in time. Also, even if\
    \ you are able to click the Cancel button in time, the process will continue for\
    \ a short period of time before the background threads respond to the cancellation.\
    \ This is just to say that cancelling a file upload may work, but it may not not\
