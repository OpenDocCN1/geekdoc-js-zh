  md: "# Selecting elements with ListView\n\nThe ListView widget has a richer set\
    \ of behaviors to offer than simply displaying data, however, and let's look at\
    \ how it allows \"selection\" of elements. In this code sample, I have added some\
    \ properties and an event handler to the ListView instantiation logic to demonstrate\
    \ this:\n\n```\n$(document).ready(function () {\n  $(\"#ListView\").kendoListView({\n\
    \    dataSource: animals,\n    template: kendo.template($(\"#template\").html()),\n\
    \    selectable: \"multiple\",\n    notifyUser: e\n  });\n\n  function notifyUser(e)\
    \ {\n    var selected = $.map(this.select(), function (item) {\n      return animals[$(item).index()].animalName;\n\
    \    });\n    alert(selected.join(\",\"));\n  }\n});\n</script>\n```\n\nThe selectable\
    \ property has been set with multiple to allow multiple selection of items (you\
    \ can select multiple items on the page by holding the Ctrl button on the keyboard\
    \ while clicking a mouse). We also added an event handler for the change event\
    \ so that we can see an alert box that displays which elements have selected.\n\
    \nIn the notifyUser event handler function, I want to explain what is happening\
    \ because it looks a bit confusing at first glance. The variable selected is an\
    \ array value of all of the elements' animalName property values. It does this\
    \ by using $.map on the results of $.select(). What is this.select()? Well, when\
    \ Kendo fires an event handler from a widget the context of that event handler\
    \ refers to the widget that found the event. So, in this case, this is a reference\
    \ to the ListView itself. This means that calling this.select() in this event\
    \ handler will return a collection of all the selected elements within the ListView.\
    \ The function as the second parameter of $.map then grabs the animalName property\
    \ from each of elements by using its index from the animals array. The result\
    \ of this code is an array of strings containing all of the animalName values\
    \ from the ListView. This is then displayed to the user using [array].join()."
