  md: '# Using the HTML Editor API


    The Kendo HTML Editor has a large set of API configuration options which allow
    you to fine-tune the widget to the specific needs and situation of your web page.
    It exposes a set of methods and events that you can use to programmatically enable
    and react to functionality that the Edit widget exposes as it runs on the page.
    These options, taken together, are how you extend the Editor beyond the out of
    its boxes.


    # Configuration options


    We have already covered some of this in the material above, here are the configuration
    options available for the HTML Editor control. As always, check the Kendo UI Web
    documentation at docs.kendo.com/api/web/editor for a more detailed list of configuration
    settings for the editor, and to get the latest changes or updates to the API.


    ```

    $("#")(

    encoded: true, // whether or not the editor should emit encoded html

    tags,

    messages: {\ // define custom labels for the built-in tools and

    dialoggs,

    bold: "Bold",


    stylesheets: {...}, // see above, custom stylesheets to load for editor

    tools: {...}, // see above, custom and built-in tools to display in the

    editor

    imageBrowser: { // the imageBrowser tool can accept a custom

    configuration

    transport: { // the endpoints to use for image operations

    read: "imagebrowser/read",

    destroy: "imagebrowser/destroy",

    create: "imagebrowser/createDirectory",

    uploadURL: "imagebrowser/upload",

    thumbnailUrl: "imagebrowser/thumbnail" // path for thumbnails of images

    imageUrl: "/content/images/{0}" // {0} is placeholder for virtual

    } // path and image namen)

    ```'
  merge: -1
  pgno: 146
- img_proc: true
  md: "},\npath: \"/myInitialPath/\", // Initial path of images to display\nfileTypes:\
    \ {\".png,.gif,.jpg,.jpeg\\}, // Allowed image file extensions\nschema: {...},\
    \ // a schema can be defined to interpret data returned from\n// a remote endpoint\
    \ when parsing data to display images\nmessages: {...} // custom messages for\
    \ imageBrowser controls and dialogs\n}\n};\n\n# # Events\n\nAs any HTML element\
    \ or JavaScript object in a complex site, a web page fires\nevents the user performs\
    \ certain actions within a page. By hooking into these\nevents with your JavaScript\
    \ code, you can react to the page's changes and data\nin real time and organize\
    \ the functionality of your page based on actions that the\nuser performs. The\
    \ HTML Editor control fires the following events in response\nto user actions:\n\
    \n+   - change: This event fires every time the data inside of the Editor\n  Widget\
    \ changes.\n- execute: This event fires when a tool is executed. It fires every\
    \ time\n  a tool bar has been clicked and the code behind that button has\n  been\
    \ executed.\n- keydown: The keydown event fires every time a user presses a key\n\
    \  while typing inside of the Editor window. Hooking into this event\n  allows\
    \ you to respond to text as the user is typing it.\n- keyup: The keyup event fires\
    \ every time a user presses and releases a key\n  while typing inside of the editor\
    \ widget window. Hooking into this event\n  allows you to respond to text as the\
    \ user is typing it.\n- paste: The paste event fires every time text is pasted\
    \ into the Editor\n  Widget area.\n- select: The select event fires every time\
    \ text inside of the Editor Widget\n  has been selected by a user."
  merge: -1
  pgno: 147
