    object to the event handler indicated in the binding, but it also manages the
    data

    property like wanted in the previous paragraph. Since the event argument

    is still connected to the DOM event, you can stopPropagation() and

    preventDefault() on that event to stop the DOM from performing any

    other actions in the page.


