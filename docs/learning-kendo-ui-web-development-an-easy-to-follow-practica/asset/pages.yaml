  md: "You can see here the Grid has asked for page number 2 with a page size of 5\
    \ records. This has the Kendo Grid communicates with the server, through the HTTP\
    \ request body.\n\n# Driving the ListView with Web API\n\nSimilar to the Grid\
    \ widget, the ListView widget is able to utilize the [DataSourceRequest] attribute\
    \ to help drive special functionality for its operations. In this case, we will\
    \ not simply be querying the data from the server, but also editing with the Web\
    \ API.\n\nCreate an action method for your ListView example in the KendoController\
    \ class, as shown here:\n\n```\nprivate MoviesContext db = new MoviesContext();\n\
    \npublic ActionResult ListView()\n{\n    return View(db.Movies);\n}\n```\n\nThen\
    \ add a view for this action method and add the following HTML markup inside:\n\
    \n```\n@using Kendo.Mvc.UI;\n\n@model IEnumerable<Chapter11.Models.Movie>\n\n\
    {\n    ViewBag.Title = \"ListView\";\n}\n<script type=\"text/x-kendo-tmpl\" id=\"\
    template\">\n<div class=\"movie-view\">\n<dl>\n<dt>Name</dt>\n<dd>${Name}</dd>\n\
    <dt>Rating</dt>\n<dd>${Rating}</dd>\n<dt>Rank</dt>\n<dd>${Rank}</dd>\n</dl>\n\
    </div>\n<div>\n```"
  merge: -1
  pgno: 270
- img_proc: true
  md: "```\n<a class=\"k-button k-button-icontext k-edit-button\"\nref=\"\\#<span\
    \ class=\"k-icon k-edit\"></span>Edit</a>\n<a class=\"k-button k-button-icontext\
    \ k-delete-button\"\nref=\"\\#<span class=\"k-icon k-delete\"></span>Delete</a>\n\
    </div>\n<script>\n<h2>ListView</h2>\n```\n\nThis basic HTML and Kendo template\
    \ will be used to build the page once the data has been retrieved. You can see\
    \ how the template is simply showing each element of a Movie object and then providing\
    \ the edit and delete buttons. Next, add the following MVC Razor code at the bottom\
    \ of this view to wire everything together:\n\n```\n@(Html.Kendo().ListView(Model))\n\
    .Name(\"moviesListView\")\n.TagName(\"div\")\n.ClientTemplateId(\"template\")\n\
    .Editable()\n.DataSource(dataSource => {\n    .Read(read => read.Action(\"MoviesGrid\"\
    , \"Movies\"))\n    Update(update => update.Type(HttpVerbs.Post))\n    Url(\"\
    /api/MovieApi\")\n    PageSize(5)\n    Model(config => config.Id(\"Id\"))\n  \
    \  .Pageable()\n})\n```\n\nHere, we have created a Kendo ListView, specified the\
    \ ID of the template to use when rendering it on the page, marked it as editable,\
    \ and specified the data source. Inside of the data source, we have indicated\
    \ where to retrieve the data to display (the Read method) and where to send updated\
    \ data (the Update method)."
