  md: "# Using DataSourceRequest with Kendo Grid\n\nAs we saw in the first chapter,\
    \ the Kendo Grid widget is designed to allow a rich set of features such as paging,\
    \ filtering, and sorting. We saw previously how this can be driven on the client\
    \ side through JavaScript and the Kendo DataSource object. The Grid becomes even\
    \ more powerful, however, when connected with server-side functionality to drive\
    \ its features.\n\nThe Kendo UI Framework for ASP.NET MVC includes a special object\
    \ to help facilitate this functionality within standard MVC controllers. It does\
    \ not require the Web API or OData, although you could use them if you want to\
    \ configure the Kendo DataSource by hand. In this example we will learn how to\
    \ use the DataSourceRequest object and how it drives the functionality of a Kendo\
    \ Grid widget.\n\nFirst, add a new method to the MoviesController class that we\
    \ created earlier.\n\n```\npublic ActionResult MoviesGrid([DataSourceRequest]\
    \ DataSourceRequest request)\n{\n    return Json(\n        db.Movies.ToDataSourceResult(request),\
    \ JsonRequestBehavior.AllowGet);\n}\n```\n\nYou should notice right away the special\
    \ attribute in the signature of the action method called [DataSourceRequest].\
    \ This attribute comes from the Kendo.Mvc namespace, so you will need to include\
    \ that in a using statement at the top of the controller. This attribute is necessary\
    \ for the Kendo UI Framework to properly understand the communication between\
    \ the Grid widget and this server-side action method. It is also important that\
    \ the [DataSourceRequest] attribute is decorating a DataSourceRequest object and\
    \ that the return value from this method is passed through the extension method\
    \ called ToDataSourceResult(request). These special methods drive the Kendo functionality\
    \ for data binding, sorting, paging and filtering."
  merge: -1
  pgno: 267
- img_proc: true
  md: "# Web API Examples\n\nWith this code in, add a new action method to the KendoController\
    \ called Grid, which will be the action method we use for the view.\n\n```\npublic\
    \ ActionResult Grid()\n{\n    return View();\n}\",\n```\n\nCreate a view for this\
    \ method and place the following Razor code inside it:\n\n```\n@using Kendo.Mvc.UI;\n\
    {\n    ViewBag.Title = \"Grid\";\n}\n@(Html.Kendo().Grid<Chapter11.Models.Movie>().Name(\"\
    moviesGrid\")\n{\n    Columns(columns => {\n        columns.Bound(p => p.Name);\n\
    \        columns.Bound(p => p.ReleaseYear);\n        columns.Bound(p => p.Rating);\n\
    \        columns.Bound(p => p.Rank);\n    })\n    .Pageable()\n    .Sortable()\n\
    \    .Filterable()\n    .DataSource(dataSource => dataSource)\n    .Ajax()\n \
    \   .PageSize(5)\n    .Read(read => read.Action(\"MoviesGrid\", \"Movies\"))\n\
    })\n```\n\nAs you have before, this Html helper method from the Kendo UI Framework\
    \ generates a Grid widget on the web page. We have configured the columns and\
    \ enabled the Grid to be pageable, sortable, and filterable. The significant part\
    \ of this is that we have the DataSource object to point to the MoviesGrid action\
    \ of the Movies controller, which we set up earlier with the special Kendo attribute\
    \ and objects. When we run our project and navigate to this new view, we get a\
    \ Kendo Grid widget like the following, which has working paging buttons, filter\
    \ buttons, and sortable column headings."
  merge: -1
  pgno: 268
