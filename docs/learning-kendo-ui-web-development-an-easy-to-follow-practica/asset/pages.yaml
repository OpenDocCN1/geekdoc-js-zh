    \ in organizing the content or the data in your page, and the Grid is a very good\
    \ example of this, which we will cover next.\n\n# Grid\n\nThe Kendo UI Grid is\
    \ a very handy widget to be familiar with. It is an easy way to transform data\
    \ into a usable and interactive grid that would normally take a full-featured\
    \ server control (as in ASP.NET WebForms) or some complex and time-consuming JavaScript\
    \ development in page markup. It is remarkably easy to set up a simple example.\
