    position:absolute;top:285px;left:15px\">\n      <input id=\"horizontalSlider\"\
    \ value=\"7\" />\n    </div>\n  </div>\n\n  <!-- Two rangeslider widgets -->\n\
    \  <div id=\"rangeSliders\">\n    <h2 style=\"position:absolute;top:5px;left:300px\"\
