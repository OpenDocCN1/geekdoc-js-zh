    on the topic.


    # Getting familiar with OData


    The ASP.NET Web API framework supports queries through a syntax known as OData.
    OData is a query language that is compatible with HTTP URLs so that it can perform
    query strings. It provides two very powerful benefits to API action methods that
    are used: First, it automatically translates the OData query language into actual
    data query inside of your action method. This is amazingly powerful and may be
    hard to believe until you can see it. Basically, it is a search engine for free.
    Second, the OData features allow you to query the data source for the specific
    elements that match and then return the result to the client. Client does not
    have to query the full set of data and filter on its own. This is a high performance
    improvement and also simplifies both client and server code.


    There are four ways by which you can enable OData query features for your API
    controllers. Each providing more fine-grained control over its predecessor.


    +   - Enable query globally through WebApiConfig.cs

    - Add [Queryable] attribute to specific API action methods

    - Inherit from ODataController instead of ApiController

    - Inherit from EntitySetController instead of ODataController


    The first option will globally enable query support for any ApiController method
    with an IQueryable return type. To enable this, use the WebApiConfig.cs file of
    the App_Start folder and un-comment the line of code with config.EnableQuerySupport();


    ```

    // Uncomment the following line of code to enable query support

    // for actions with an IQueryable or IQueryable<T> return type.

    // To avoid processing unexpected or malicious queries, use the

    validation settings on QueryableAttribute to validate

    incoming queries.

    // For more information, visit

    http://go.microsoft.com/fwlinkink/?LinkId=279712.

    config.EnableQuerySupport();

    ```'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Web API Examples


    The second option will enable query support for specific action methods that you
    decorate with the [Queryable] attribute. This gives you more configuration choices
    than the previous option because the [Queryable] attribute has many properties
    that you can configure to fine-tune its behavior. An action method decorated with
    this attribute looks like the following:


    ```

    // GET api/values

    [Queryable]

    public IQueryable<string> Get()

    {\    return new string[] {"value1", "value2"}.AsQueryable();

    }

    ```


    The third option involves inheriting your controller instead of ODataController.
    This will enable the full OData support that the Web API offers and allows for
    more configuration done so that the OData engine understands the Entity Data Model
    (EDM) for the entities that it is exposing.


    ```

    OModelBuilder modelBuilder = new ODataConventionModelBuilder();

    modelBuilder.EntitySet("Movies");

    Microsoft.Data.OData.EdModel model = modelBuilder.GetEdModel();

    config.Routes.MapODataRoute("OData", "OData", model);

    ```


    The preceding code needs to run as the web application start, so it should be
    placed either in Global.asax or in one of the App_Start classes, such as WebApiConfig.
    It reads the same type of entity model as the Entity Framework and loads this
    into an OData route so that Web API understands how each part of the model is
    related, what the primary keys are, and so on. This enables more advanced scenarios
    such as property navigation. For more information on this, you can visit http://www.asp.net/web-api/overview/odata-support-in-aspnet-web-api/getting-started-odata-in-web-api/create-a-read-only-endpoint
    for introduction.


    The fourth option is similar to the previous option, but it enables more OData
    functionality automatically that the ODataController class would have to do manually.
    It still requires the ODataModelBuilder class in the last option. The URL listed
    also covers information on this topic.


    For our examples in this chapter, we will be using the [Queryable] attribute to
    enable query support for specific action methods. I encourage you to explore this
    technology more on your own, as it is a powerful and extensible framework that
    can provide high productivity boosts to your code. To learn more about OData,
    you can visit www.odata.org.'
  merge: -1
