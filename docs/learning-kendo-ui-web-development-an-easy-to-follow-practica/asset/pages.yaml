  md: "Once you have this reference, you can access the children inside of the Kendo\
    \ Menu through the element property:\n\n```\nmenu.element.child(\"li\").eq(3);\n\
    ```\n\nIn this code sample, we appended the fourth li element in the children\
    \ of this particular menu object. The return value here will be a JavaScript object\
    \ that can be used as the reference point for the append, insertAfter, and insertBefore\
    \ methods.\n\n# The append(), insertAfter(), and insertBefore() methods\n\nThe\
    \ append method takes two arguments: the JSON notation of the new menu item(s)\
    \ to be appended as child, and a reference to the menu item that will be the parent\
    \ of the newly appended items:\n\n```\nvar menu = $(\"menu\").data(\"kendoMenu\"\
    );\nvar referenceItem = menu.element.child(\"li\").eq(1);\n\nmenu.append(\\{\n\
    \  text: \"new menu item\",\n  url: \"http://www.music.com\",\n  items: [...]\n\
    }),\nreferenceItem\n);\n```\n\nThis code would append this menu item as a child\
    \ to the second menu item on the page. The insertAfter and insertBefore methods\
    \ work exactly the way, except that they insert the new menu items at the same\
    \ menu level and either after or before the reference item respectively.\n\n>\
    \ All of these methods return the Menu object to support method chaining."
  merge: -1
  pgno: 160
