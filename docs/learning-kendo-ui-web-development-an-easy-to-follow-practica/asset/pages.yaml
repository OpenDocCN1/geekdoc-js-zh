  md: "# Menu and ListView\n\nLike most of the widgets in the Kendo UI framework,\
    \ the Menu widget does not have to run from static HTML, it can be fuelled by\
    \ a DataSource object of either local or remote data. Here is the code adapted\
    \ to use a local DataSource instead of static HTML:\n\n```\n<DOCTYPE html>\n<html>\n\
