  md: '# Adding data dynamically


    Building on the example we just saw, add this horizontal rule and form just below

    table in the HTML page:


    ```

    <hr />

    <form>

    <header>Add a Person.</header>

    <input type="text" name="personName" placeholder="Name"

    data-bind="value: personName" /><br />

    <input type="text" name="personHairColor" placeholder="Hair Color"

    data-bind="value: personHairColor" /><br />

    <input type="text" name="personFavFood" placeholder="Favorite Food"

    data-bind="value: personFavFood" /><br />

    <button type="button" data-bind="click: addPerson">Add</button>

    </form>

    ```


    This adds a form to the page so that a user can enter data for a new person that

    appear in the table. Note that we have added data-bind attributes, but

    this time we are binding the value of the input fields not. Note also that we

    have added a data-bind attribute to the button at the bottom of the form that
    binds

    the click event of that button with a function inside our View-Model. By binding

    the click event to the addPerson JavaScript method, the addPerson method will
    be

    fired every time this button is clicked.


    These bindings keep the value of those input fields linked with the View-Model
    object

    at all times. If the value in one of these input fields changes, such as when
    a user types

    sothing in the box, the View-Model object will immediately change that and

    update its properties to match; it will also update any areas of the page that
    are bound

    to the value of that property so they match the new data as.


    The binding for this is special because it allows the View-Model object

    attach its own event handler to the click event of this element. Binding an event

    handler to an event is nothing special by itself, but it is important to do this
    way

    (through the data-bind attribute) that the specific Running View-Model instance

    inside of the page has attached one of its functions to this event so that the
    code

    inside the event handler has access to this specific View-Model''s data properties
    and\values. It also allows for a very specific context to be passed to the event
    that would

    very hard to achieve otherwise.'
