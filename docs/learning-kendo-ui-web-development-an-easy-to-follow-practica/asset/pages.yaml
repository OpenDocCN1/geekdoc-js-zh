    This syntax allows for a cleaner separation between JavaScript and mark-up, and
    is important in the MVVM pattern that we will cover later in the book. It is also
    powerfully expressive and can make the code more readable, since relevant attributes
    are contained directly within the elements to they pertain. Script blocks containing
    do not necessarily appear beside the code actually being affected, which can make
