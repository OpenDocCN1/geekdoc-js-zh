  md: "# Schema\n\nThe schema object within a DataSource is responsible for describing\
    \ the raw data format. It functions at a higher level than the model, and can\
    \ even contain a model definition within it. The Schema's job is to instruct the\
    \ DataSource on to find information on errors, aggregates, data, groups, and total\
    \ records within the raw data that the DataSource is using. Each of these pieces\
    \ of information exists as a property within the schema object like this:\n\n\
    ```\nschema: {\n  errors: function(response) {\n    return response.errors;\n\
    \  },\n  aggregates: function(response) {\n    return response.aggregates;\n \
    \ },\n  data: function(response) {\n    return response.data;\n  },\n  total:\
    \ function(response) {\n    return response.totalCount\n  }\n}\n```\n\nIn the\
    \ preceding code sample, each of the properties has been set to a function which,\
    \ when passed the raw data object, will return the appropriate data from within\
    \ that object. These properties can also be set to test fields, in which case\
    \ the field name must exist at the top level of the object and already contain\
    \ the appropriate data in the appropriate format:\n\n```\nschema: {\n  errors:\
    \ \"errors_field_name\",\n  aggregates: \"aggregates_field_name\",\n  data: \"\
    data_field_name\",\n  total: \"total_field_name\"\n}\n```\n\nThe aggregates property\
    \ needs returned in an object format with a structure like this. Each property\
    \ name inside the aggregates object can contain information on its aggregates\
    \ values, such as the maximum value (max), minimum (min), or the total count:\n\
    \n```\n{\n  unitPrice: { // Field Name\n    max: 100, // Aggregate function and\
    \ value\n    min: 1 // Aggregate function and value\n}\n```"
