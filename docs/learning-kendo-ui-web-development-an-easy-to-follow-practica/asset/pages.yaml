  md: "# Interacting with Data: DataSource, Templates, TabStrip, and Grid\n\nWhen\
    \ the Grid has been configured to allow editing of data, the columns property\
    \ allows you to specify a custom editor function that can be used when changing\
    \ data in that column. This can be a useful way of giving the user an easy way\
    \ to input a change, or even control the sort of changes that can be made. For\
    \ example, this updated code sample adding an editor function to the Labor column\
    \ so that it displays a drop-down list when edited, giving the user a specific\
    \ set of options to choose from. There are a couple of other changes we will talk\
    \ about next:\n\n```\n$$(repairsGrid).kendoGrid({\ndataSource: repairs,\ncolumns:\
    \ {\n  title: \"Action\",\n  width: 75,\n  command: {\"edit\"},\n},\n  field:\
    \ \"name\",\n  title: \"Service\",\n  width: 300,\n  sortable: true,\n  filterable:\
    \ true,\n},\n  field: \"price\",\n  title: \"Price\",\n  width: 50,\n  format:\
    \ \"$ {0:##.##}\",\n  sortable: true,\n  filterable: true,\n},\n  field: \"labor\"\
    ,\n  title: \"Labor\",\n  width: 50,\n  template: \"#=labor hour(s)\",\n  sortable:\
    \ true,\n  filterable: true,\n  editor: function (container, options) {\n    var\
    \ selectEditor = $(\"<select name=\" + options.field + \"</select>\");\n    selectEditor.append(new\
    \ Option(\"1\", 1));\n    selectEditor.append(new Option(\"2\", 2));\n    selectEditor.append(new\
    \ Option(\"3\", 3));\n  }\n});\n```"
