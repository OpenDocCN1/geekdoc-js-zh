    # # ListView methods


    The ListView widget has several methods available. Most of them are designed to
    manipulate the items within the ListView, so that you can control the behavior
    through code. Like with any widget, you need a reference to the ListView object
    before you can call these methods, like this:


    ```

    var listView = $("#listView").data("kendoListView");


    listView.add();

    ```


    Get the reference through the .data(...) method and then you can call the ListView-specific
    methods. Here is a brief overview of the methods that take no parameters:


    +   - add: Inserts an empty item into the ListView and prepares it for editing

    - cancel: Cancels changes in currently edited items

    - clearSelection: Clears ListView''s selected items and triggers the change event

    - refresh: Reloads the data and reprints the ListView

    - save: Saves the edited ListView item. If validation succeeds, it will call the
    datasource sync method.


    There are a few additional methods that take parameters.


    # # The edit method


    This method edits the specified ListView item and triggers the edit event. This
    method takes a single parameter which is the ListView item that needs to be edited.
    Here is a sample:


    ```

    var listView = $("#listView").data("kendoListView");

    ...

    listView.edit(listView.element.children().first());

    ```'
