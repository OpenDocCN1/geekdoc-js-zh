    \n# Controlling the TabStrip widget's animation effects\n\nThe animation effects\
    \ for the TabStrip widget are exactly the same as for the Panel widget. They are\
    \ controlled through the animation property when configuring the TabStrip object\
    \ in JavaScript. The animation property can be set to false to completely disable\
    \ all animation effects, or it can be configured like the following code sample\
    \ for specific behaviors:\n\n```\n$(\"#tabStripId\").kendoTabStrip({\n  animation:\
    \ {\n    collapse: {\n      duration: 1000, // milliseconds for animation effect\n\
    \      effects: \"fadeOut\" //fadeout is the only option for collapse\n    },\n\
    \    expand: {\n      duration: 500,\n      effects: \"expand:vertical fadeIn\"\
    \ // choose either or both of these\n    }\n  }\n});\n```\n\nThe only available\
    \ animation effect for the collapse action is fadeOut. For the expand action,\
    \ you can choose expand:vertical, which is the normal action for expanding a TabStrip,\
    \ and fadeIn which changes the opacity as it expands."
