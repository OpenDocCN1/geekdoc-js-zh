    tree, and the entire tree rerendered to keep that block from influencing the flow.
    Furthermore, containing elements no longer have any knowledge of the node, and
    scripts will not be able to discover it. This is irreversible, unless you had
    cached a copy of the node in another variable and added it back manually later.
    Prototype exposes the removeChild() feature as a function called Element.remove().


    # Inserting Data


    Showing and hiding data is nice, but it implies that we have a nice container
    dedicated for displaying that piece of data. Showing an error message, for example,
    usually means that we have a hidden div or span standing to take data, then display
    it to the user. Often, though, what we want to add is more data to an existing
    element. Most commonly, we want to add items to an already-visible list of items.
    The standard HTML way to do this is to recreate a new version of the list items
    include the additions, then replace the contents of the list with the new version.
    With Ajax, this would mean having a server-side method which you call that sends
    the list back with any new items appended. While effective, this might be extremely
    long-running, and the code that generates the content of the list might, if it
    involved a database, mandates at least a round trip to the datastore to re-fill
    the list.'
