  md: '# A TALE IN THREE ACTS


    It was to be provided by an entirely unlikely entity. What follows is the story
    of one development team, that spark, and how it changed the way we approach web
    software.


    # 1.1 A Tale in Three Acts


    Hector is a project manager for a web application development shop. With a long
    history of Perl CGI, ASP, Servlet, and JSP development under his belt, Hector
    has been around the block. For the last year his team has been building a CRM
    application for a large Fortune 500 company with offices all over the world. The
    application used to be a green-screen mainframe application; the company wants
    to take advantage of the great reach of the Internet to deploy the application
    to every office.


    Hector and his team focus of their energy on the server side of the application.
    They have been using one of the modern MVC frameworks from the Java community
    to implement the business logic; a high-performance persistence framework to access
    the database; messaging-based infrastructure to connect to other systems.


    # Yesterday


    On the client side, Hector and his team have become masters of CSS. The look of
    the pages bends to their will; when the customer wants rounded corners, they get
    rounded corners. Rollover colors? That''s easy. Multiple color schemes? No problem.
    In fact, Hector and his team had long ago reached a point where they weren''t
    really worried about the user interface. See, the web operates one way: it essentially
    distributes static documents. When users want more data, they incur complete interface
    refresh. It isn''t optimal from an efficiency perspective, but it''s how the web
    works and users have just learned to live with it.


    Then, sometime couple of weeks ago, Hector''s customer came to a meeting. The
    customer was usually a polite, accommodating fellow. He understood the web, understood
    the restrictions he had to live with to get the reach of the Internet. In fact,
    Hector had never seen him get really angry. Until this meeting.


    As soon as he walked in, the team knew something was up. He had his laptop with
    him, and he never carried it. As he stormed into the room, the team glanced around
    the table: what have we done? The customer'
