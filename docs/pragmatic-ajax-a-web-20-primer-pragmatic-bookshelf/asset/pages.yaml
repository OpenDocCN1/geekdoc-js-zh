    # Ajax Encourages OO Over DOM


    The biggest change from HTML to Ajax has to do with the way we think about JavaScript
    in the browser. In old HTML, we wrote JavaScript to manipulate the DOM; we treated
    the DOM as a giant repository of dumb entities, each with a collection of styles
    applied to it. We walked the DOM with nightmarish


    ```

    element.parent.sibling.child

    ```


    style code, and when we got there, we set text properties to interpreted as changes
    in the rendering engine. We wrote our common code as a series of functions, devoid
    of organizing classes or conventions. None of this looked like the server side
    code we were writing; it certainly did not feel modern in any way. JavaScript
    was an adjunct to our “real work,” and showed


    Ajax strives to treat JavaScript in the browser as the first-class programming
    environment it can. Instead of writing procedural programs, we write class libraries
    to encapsulate our behavior. Instead of treating the DOM as a collection of dumb
    elements, we treat it as a hierarchy of types. Instead of thinking of them as
    properties of objects, to be constructed and parsed, modified individually. We
    write modern OO code, complete with error handling, instance methods, static methods
    and type hierarchies.


    Even better, though, we write this modern OO code using a language more expressive
    than the statically typed languages we use on the server. With JavaScript, we
    can extend types without modifying the base code. If we want to add functionality
    to the document object, we can declare a new function and supply it with an anonymous
    definition. This function has full access to the instance data of document, and
    can be called by any other type contained in our JavaScript. Functions can be
    sent around like data objects, invoked without-'
