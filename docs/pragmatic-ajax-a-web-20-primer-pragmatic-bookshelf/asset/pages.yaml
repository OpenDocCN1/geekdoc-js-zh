  md: '# # Chapter 2


    # # Ajax In Action


    In the last chapter, Hector and his team went on a voyage of discovery about the
    possibilities for web applications. They learned that Ajaxian transform conventional
    web pages into dynamic web interfaces. This chapter is about lifting the veil
    and showing you how Ajax really works. To do this, we''ll transform a traditional
    web page into an Ajax application right before your eyes.


    # 2.1 Ajaxifying a Web Application


    Let''s consider the case of our friend Hector, the erstwhile project manager from
    our previous chapter. Hector released the first version of the application a few
    months ago. As he reviewed the user feedback, he found that some users expressed
    frustration with a customer entry screen.


    Figure 2.1, on the next page is a screenshot of the current version of the page.


    So what''s the problem with this screen? It turns out that the users of Hector’s
    application are used to the behavior of the “green-screen” application it replaced.
    In the old application, all users had to do enter the customer''s zip code and
    the “City” and “State” fields would auto-populate with the correct values; the
    users of Hector’s new web application are frustrated that they now have to enter
    this data manually.'
  merge: -1
