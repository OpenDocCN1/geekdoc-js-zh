  md: "# Ajax.Request()\n\nThe dojo.io.bind() equivalent in Prototype is Ajax.Request().\
    \ It works in\nsimilar way to dojo, in that you pass in most of the information\
    \ as an\robject with callbacks. The CRM example is:\n\n```\nfunction getZipData(zipCode)\
    \ {\n    new Ajax.Request(url, {\n        asynchronous: true,\n        method:\
    \ \"get\",\n        parameters: \"zip=\" + zipCode,\n        onSuccess: function(request)\
    \ {\n            assignCityAndState(request.responseText);\n        },\n     \
    \   onFailure: function(request) {\n            assignError(request.responseText);\n\
    \        }\n    });\n```\n\nThe differences are subtle. First, you pass the url\
    \ as the first parameter\nto Ajax.Request() rather than in the object hash itself.\
    \ You will also see\nat you can choose between a synchronous or asynchronous request.\n\
    99.99% of the time you will want to use asynchronous, because you\ndon't want\
    \ to freeze the browser while the request happens. You also get\nto choose the\
    \ HTTP method (GET, POST, and so on) and the parameters\nthat we want to add to\
    \ the URL itself. Finally, the callback functions\nent the XMLHttpRequest object\
    \ itself, so you can grab the responseText,\nresponseXML, or anything else that\
    \ you need from that object.\n\n# Evaluating the Return as JavaScript\n\nIf you\
    \ wish to use the model of having the server return JavaScript\nfor you to run,\
    \ you can implement this by doing eval() yourself in the\nSuccess callback function.\n\
    \n```\nfunction getZipData(zipCode) {\n    new Ajax.Request(url, {\n        asynchronous:\
    \ true,\n        method: \"get\",\n        parameters: \"zip=\" + zipCode + \"\
    &type=eval\",\n        onSuccess: function(request) {\n            eval(request.responseText);\n\
    \        }\n    });\n```"
