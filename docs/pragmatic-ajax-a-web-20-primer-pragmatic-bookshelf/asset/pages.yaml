    # GET is for Getting, POST is for Doing


    In the world of HTTP, browsers communicate with servers using (typically) either
    GET or POST requests. A GET request is generated whenever you click on a hyperlink;
    the idea is that *gets* the page. A POST request is sent when you hit the submit
    button on an HTML form. It *posts* the data from that form back to the application
    for processing.


    In 2005, the team that created Basecamp (and Ruby on Rails) learned this GET is
    for getting things, POST is for doing things. The HTTP specification is pretty
    specific on this topic. GETs are for retrieving data. POSTs are for interacting
    with the server in a way that might change server state. When you avoid the recommendations
    of a specification, bad things can—and often do—happen. Their public tussle with
    this issue serves as a cautionary tale for the rest of us: if these kinds of issues
    can affect the best and brightest, we need to be extra careful in our applications
    to avoid similar problems.'
