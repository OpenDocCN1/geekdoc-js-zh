    So there have it. XOAD successfully managed to make a rich return type and generate
    a JSON representation to pass down to the client. This allowed us to map return
    types versus simple strings and the like. You probably don''t want to get too
    carried away. While it is theoretically possible to create insanely complex return
    types, with nested complex structures for data, this can lead down a long road
    of debugging, testing, and possibly modifying the marshaling code buried inside
    of XOAD. Besides, if the marshaling code handled the data structures without problem,
    large types still take up a lot of bandwidth. Keep it simple, and everyone is
    happy.


    # There is More to XOAD


    This concludes the port over XOAD, and we have seen how it is an OO based system
    versus the function-based structure of Sajax. The XOAD serializer allows you to
    return rich objects that will get converted to JSON objects that the browser JavaScript
    engine can consume.


    There are other interesting sides of the XOAD library that we haven''t seen in
    this use case. One of these is XOAD Events which allows you to fire events from
    one computer and process them on another. This is all done by using an observer
    pattern, and having one piece of code firing events, and another listening for
    them. This is useful for Ajax applications that need to be very responsive to
    data passed between tier (like a chat client, for example).


