  md: '# Server-side Framework Integration


    Over the next four chapters, we''re going to introduce four web application development
    frameworks and examine the server-side integration techniques they use for incorporating
    Ajax. This kind of integration can be very valuable for a development team, allowing
    the members of the team to focus their efforts on one logical tier (the server)
    while simultaneously generating artifacts for two physical tiers (server and client).


    To explore these frameworks, we''re going to walk Hector''s team through porting
    their CRM application to each framework. Along the way, we''ll talk about the
    reasons why Hector might consider each port, and the relative strengths and challenges
    each choice presents. The four frameworks we''ll examine are:


    +   - PHP: Sajaz is the first Ajax integration toolkit for PHP, and we''ll examine
    it plus the newer Najax library.

    - Ruby on Rails: Rails integrates very closely with Prototype and Script.ulo.
    In fact, the authors of those two frameworks are also Rails committers.

    - Spring (Java): We''ll look at the integration of the DWR framework with Spring
    for Java web applications.

    - ASP.NET: we''ll look at both Ajax.NET, an open source Ajax library, and the
    upcoming Atlas toolkit from Microsoft itself.'
