  md: "# SOME STANDARD USAGES\n\ncontains four event hooks: onLoading, onLoaded, oninteractive\
    \ and onComplete, each corresponding to one of the four readystate values. Prototype\
    \ simply implements the onreadyStatechange hook, then publishes the specific events,\
    \ as those values. We will trap the onLoading and onComplete events, to allow\
    \ us to show the image when the begins and hide it once a response has been received.\
    \ The values for the two events need to be function calls. Instead of simply calling\
    \ Element.show() and Element.hide() directly, we will wrap them in anonymous functions.\
    \ If you don't do this, the onload call never completes, the validation result\
    \ is never received, onComplete is never called and the little spinning wheel\
    \ will be the only thing about about page.\n\nFile 7\n\n```\nfunction validateField(fieldname,\
    \ required, validation, update) {\n  var params = \"type=\" + validation +\n \
    \   \"&required=\" + required +\n    \"&value=\" + $$(fieldname);\n  new Ajax.update(update,\
    \ validationUrl, {\n    asynchronous: true,\n    method: \"get\",\n    parameters:\
    \ params,\n    onLoading: function(request) {Element.show(fieldname + ' Progress');}\n\
    \    onComplete: function(request) {Element.hide(fieldname + ' Progress');}\n\
    \  });\n}\n```\n\n# Update Notification\n\nWeb surfers are largely trained to\
    \ believe that something loaded on a page is static. They understand that, in\
    \ order to update the contents of a page, the page must be reloaded. The only\
    \ cognitive exception to this rule is animations. The web surfing population understands\
    \ that certain graphics are not static, but in fact loops of animation. These\
    \ are expected to repeat the same set of information over time, though, and are\
    \ not actually \"dynamic\" in any data-centric meaning of the term.\n\nAjax is\
    \ all about breaking this particular expectation. That is, in fact, the core of\
    \ Ajax: break free from the bonds of static interaction. But it literally goes\
    \ against the foundation of most users' understanding of how the web works. Which\
    \ means we have to take special pains to ensure that when we break this convention,\
    \ users don't miss it.\n\nThe primogen of this pattern is the famous Yellow Fade\
    \ Technique, or YFT. Apparently created (or at least) by the crew of 37signals,\
    \ the YFT is a simple trick. Simply choose a color (canonically and eponymously\
    \ yellow), reset the background color of an element to this new color, then slowly\
    \ transition it back to the original. The effect is\n\n# Report erratum"
  merge: -1
