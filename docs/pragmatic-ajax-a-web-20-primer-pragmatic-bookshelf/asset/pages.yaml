    \ and the new <span>s also has IDs so we fill them in with new innerHTML after\
    \ validation.\n\nSecondly, we'll need to hook our validation code up to an event\
    \ on the input fields. The standard event for this purpose is the onblur event.\
    \ This event fires whenever the user changes away from the field, by clicking\
    \ elsewhere or tapping away from it. We'll call a JavaScript method from the onblur\
    \ event that will perform the validation. The method is called validateField(),\
    \ and we will examine it more in a minute. Now know that the function takes four\
    \ parameters:\n\n+   - id: the id of the input field being validated\n- required:\
    \ whether or not this field is a required field\n- validation: the validation\
    \ rule to execute on the data\n- update: the id of the field used to display the\
    \ error message\n\nThe new version of the UI elements looks like this:\n\n```\n\
