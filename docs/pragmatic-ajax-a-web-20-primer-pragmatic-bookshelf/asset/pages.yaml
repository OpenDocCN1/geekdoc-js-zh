  md: "Prototype introduces the Insertion class. Insertion allows us to add information\
    \ to an existing container without replacing what currently exists in the list.\
    \ Insertion.Top() enters the new data at the beginning of the container, while\
    \ Insertion.Bottom() enters it at the end. This means you can easily append single\
    \ lines to a list without re-rendering the whole list.\n\n```\n<ul id=\"mylist\"\
    >\n  <li>one</li>\n  <li>two</li>\n  <li>three</li>\n</ul>\n<input type=\"text\"\
    \ id=\"newval\"/>\n<input type=\"button\"\n  onclick=\"new Insertion.Bottom('mylist');\n\
    \    <li>${(newval)}</li>\";/>\n```\n\nKeep in mind that you have the full value\
    \ you want rendered. In the example, we are appending the text value of the input\
    \ field to the bottom of the list. We have to wrap it in the <li> tags in order\
    \ to get it to render as a list item; without those tags, the new value is just\
    \ pasted as text inside the list, which is rendered without the bullet, and as\
    \ inline text.\n\nPrototype actually goes a little further, and lets you append\
    \ text around the container as well. In all, Insertion offers four placements\
    \ for your new data: Before(), Bottom(), and After(). Figure 6.1, on the following\
    \ page demonstrates where each lives.\n\nThis is fairly powerful, since you can\
    \ modify a section of the page from which you do not have an ID (or there may\
    \ be no ID at all).\n\n# Forms\n\nWorking with forms has historically been a bit\
    \ of a drag. Forms are useful for one purpose: collecting data from a user. The\
    \ input fields that exist on a form, though varied in style, are essentially identical\
    \ in nature. They represent an item that a user can use to tell us something.\
