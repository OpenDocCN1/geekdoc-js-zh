  md: "# AJAX TO THE RESCUE\n\nOur revised <input> elements look like this (with the\
    \ surrounding table\nrows shown for context):\n\n```\n<tr>\n  <th>Zip:</th>\n\
    \  <td><input onblur=\"getZipData(this.value)\" type=\"text\" name=\"zip\"></td>\n\
    </tr>\n<tr>\n  <th>City:</th>\n  <td><input id=\"city\" type=\"text\" name=\"\
    city\"></td>\n</tr>\n<tr>\n  <th>State:</th>\n  <td><input id=\"state\" type=\"\
    text\" name=\"state\"></td>\n</tr>\n```\n\nThe event handler is registered via\
    \ the onblur attribute, which in this\ncase specifies that the script function\
    \ named getZipData() will be invoked\nwhen the focus leaves this element. The\
    \ parameter passed to this func-\ntion, this.value, specifies that the value property\
    \ of the <input> element\nwill be passed; that this is a reference to the element\
    \ on which the event\nhand has been registered.\n\nWe've also changed the ordering\
    \ of the table rows; now the Zip input\\comes first. This layout is atypical for\
    \ American addresses, it\nreflects a more natural flow for the ajaxified version\
    \ of the screen, since\nentering the ZIP code will auto-populate the other two\
    \ fields beneath it.\n\n# Communicating with the Server\n\nWe're now done with\
    \ the first half of our task: wiring the HTML to a\nscript that will perform our\
    \ Ajax behavior. Now we need to tackle the\nslightly trickier second bit: the\
    \ engine writing the script.\n\nThe key to Ajax is a JavaScript object called\
    \ XMLHttpRequest, the\nthat can send HTTP requests, receive responses, and parse\
    \ them as\nXML. Let's create our getZipData() function, which will create an instance\n\
    of XMLHttpRequest and use it to sync the ZIP code to the server. Remem-\ber, this\
    \ function will be invoked whenever the Zip loses focus;\nthat is, whenever the\
    \ user enters the field and then leaves it, either with the\nmouse, the tab key,\
    \ or some other mechanism. Here's how it looks\nlike so far:\n\n```\n<script type=\"\
    text/javascript\">\n  var xhr;\n  function getZipData(zipCode) {\n    xhr = new\
    \ XMLHttpRequest();\n    xhr.open(\"GET\",\n      \"/getCityFromZip.request?\"\
    \ + zipCode);\n```"
