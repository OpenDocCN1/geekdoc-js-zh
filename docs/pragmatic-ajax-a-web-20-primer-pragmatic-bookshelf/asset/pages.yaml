  md: "# Extensions to Common Types\n\nPrototype adds a series of helpful utility\
    \ methods to its lexicon, either by providing globally accessible functions or,\
    \ in some cases, existing types in JavaScript or the DOM. Since JavaScript types\
    \ can be extended at runtime without modifying the original source (the very definition\
    \ of a dynamic language), this is relatively straightforward to do. The result\
    \ is that Prototype can provide extremely useful shortcuts to common functionality,\
    \ but present it in the most natural way possible: as properties and methods of\
    \ the types where we would expect such features to appear.\n\nPrior to the Ajax\
    \ libraries, the two most common lines of JavaScript in DHTML applications were:\n\
    \n```\nvar myElem = document.getElementById('some_element');\nvar myValue = document.getElementById('some_other_element').value;\n\
    ```\n\nThough this is not particularly glaring, it is difficult to read, and can\
    \ make even the simplest of functions difficult to scan and understand. Bear in\
    \ mind, that bandwidth is (even today) an expensive resource. For I present the\
    \ current crop of JavaScript compressors with which you can eliminate all the\
    \ whitespace from your scripts for quicker downloading. Given that the above code\
    \ is ubiquitous and often repeated, it would make sense to find a way to minimize\
    \ the surface area of these statements. Prototype replaces them with the following\
    \ lines:\n\n```\nvar myElem = $('some_element');\nvar myValue = $F('some_other_element');\n\
    ```\n\nEven better, $F can take an arbitrary number of IDs and return an Array\
    \ of elements to match them.\n\n```\nvar elems = $('element_one', 'element_two',\
    \ 'element_three');\nfor(var i=0;i<elems.length;i++) {\n  elems[i].value = 'changed';\n\
    }\n```\n\nThere is a major catch to this technique, Prototype doesn't bother to\
    \ check if the ID you passed is valid within the document. In the case above,\
    \ if there's no element with id element_two, the call still returns an array of\
    \ length 3. The second element, however, is null instead of a reference to a DOM\
    \ node. Also bear in mind that $F() only works for input elements. If you are\
    \ looking for the text contained within an arbitrary DOM node, $F() is useless."
