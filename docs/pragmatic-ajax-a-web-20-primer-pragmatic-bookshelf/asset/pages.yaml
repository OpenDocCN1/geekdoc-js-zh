  md: '# 4. Abstract away the complexity of XMLHttpRequest


    It is for reasons that the more important definition for Ajax is...


    # Ajax: The Architecture


    The exciting evolution that is Ajax is in how you architect web applications.
    Let''s look first at the conventional web architecture:


    +   1. Define a page for every event in the application: view items, purchase
    items, checkout, and so on.


    +   2. Each event, or action, returns a full page back to the browser.


    +   3. That page is rendered to the user.


    This seems natural to us now. It made sense at the beginning of the web, as the
    web wasn''t really about applications. The web started off as more of a document
    repository; a world in which you can simply link documents in an ad-hoc way. It
    was document and data sharing, not interactivity in any meaningful sense.


    Picture a rich desktop application for a moment. Imagine what you would think
    if, on every click, all of the components on the application screen re-draw from
    scratch. It seems a little feels, doesn''t it? On the web, that was the world
    we inhabited until Ajax came along.


    Ajax enables a new architecture. The important parts of this architecture are:


    +   1. Small Server Side Events: Now components in a web application can make
    small requests back to a server, get some infation, and tweak the page that is
    viewed by changing the DOM. No full page refresh.


    +   2. Asynchronous: Requests posted back to the server do not cause the browser
    to block. The user can continue to use other parts of the application, and the
    UI can be updated to alert the user that a request is taking place.


    +   3. onAnything: We can talk back to a server based on almost anything the user
    does. Modern browsers trap most of the same user events that the operating system
    does: mouse clicks, mouse events, keypresses, etc. Any user event can trigger
    an asynchronous request.


    Figure 1.1 demonstrates the new lifecycle of an Ajax page:'
  merge: -1
  pgno: 11
- img_proc: true
  md: '![](img/e950a16d093a2ad996943265f0f0b6cd_12_0.png)


    Figure 1.1: Ajax Page Lifecycle


    +   1. User makes initial request against a given URL

    2. Server returns original HTML page

    3. Browser renders page as in-memory DOM tree

    4. User activity causes subsequent request against another URL asynchronously,
    leaving existing DOM tree untouched

    5. Browser returns data to a callback function inside the existing page

    6. Browser parses result and updates in-memory DOM with the new data, which is
    then reflected on the user (the page is redrawn, but not "refreshed")


    This all sounds great doesn''t? With this change we have to be careful though.
    One of the greatest things about the web is that anybody can use it. Having semantics
    helps that happen. If we go overboard, we might begin surprising the users with
    UI abstractions. This is a common complaint with Flash UIs, where users are confronted
    with new symbols, metaphors and required actions to achieve useful results. Usability
    is an important topic that we will delve into Chapter 7, Ajax UI, Part II, on
    page 115.'
  merge: -1
