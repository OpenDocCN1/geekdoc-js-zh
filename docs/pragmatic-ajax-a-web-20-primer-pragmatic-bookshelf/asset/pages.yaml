    \ property. Since Prototype is a good sister to Rails, it makes this very simple\
    \ on the JavaScript side.\n\nThe trick is that you need to make sure the content\
    \ that you wish to change has been given an id= attribute. Then, we can use an\
    \ Ajax.Updater that makes the XHR request, gets the output, and writes it to the\
