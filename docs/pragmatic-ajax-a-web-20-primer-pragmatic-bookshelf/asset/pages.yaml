    \ b:action=\"command\" b:event=\"command\" b:target=\"*\" b:test=\" />\n    </s:event>\n\
    \  </div>\n<!-- Include shop --\n  <s:include burl=\"/shop/shopIndex.html?cmd=index\"\
    \ />\n</cmp>\n```\n\nSuch a framework could potentially enable a new generation\
    \ of visual development tools. Part of the problem with such tools is the conflict\
    \ between markup and code. Traditional JavaScript-based pages have caused problems\
