  md: 'Basecamp''s problem was that, at the time, the default method for eating links
    back to the server with Rails was a GET. It didn''t matter what the link was doing:
    redirecting to a new page, reading a record, deleting a record. Then, Google released
    the Google Accelerator. The Google Accelerator installs in your browser and redirects
    requests through Google''s servers. If Google has already cached the page version,
    you''ll be rewarded with that cached version, speeding up your access time. If
    the page has not been cached, then the request is forwarded on normal. Google
    Accelerator walks all the links off of the returned page, caching it and all of
    its sub pages.


    For an application whose controls are all provided as simple GET-method links,
    Google Accelerator becomes the most efficient destructive force imaginable. Think
    of it as the Terminator of web apps. It is single-minded: fire to every link on
    the page. It is efficient. And it absolutely will not stop until your app is dead.


    37signals didn''t realize there was a problem until data started appearing from
    the Basecamp database. As users began reporting that their data was mysteriously
    missing, the team finally realized that the common thread was Google Accelerator.
    Normally, such a thing wouldn''t be a terrible problem. After all, Google''s indexing
    worms follow essentially the same path; find a page, navigate to all the endpoints,
    cache. But with Google Accelerator, the worm finally has access to information
    it has never had before: your username and password. Navigate to your Basecamp
    account, for example, and log in. The Accelerator can now follow all the links
    on your private page. It then clicks everything, as fast as possible. And some
    of these links are labeled Delete Item.


    The solution was to change their framework, Rails, to create POST-view links for
    update methods. They did this by creating a second helper in addition to link_to()
    that creates a <form> element to surround a button. The parameters are embedded
    as hidden <input>. The <form> is set to POST as its method. Now, your update-related
    links don''t fall prey to the Accelerator.


