  md: "# AJAX and JavaScript for the UI 111\n\nof Dojo is the IO libraries and the\
    \ eventing system. We won't cover that ground again here. Instead, we'll introduce\
    \ you to the idea of Animations in Dojo, and take a look at how they are used\
    \ to create effects we saw in Script.aculo.us.\n\n# Animations\n\nA Dojo animation\
    \ is an object that defines the parameters of a transition between two states.\
    \ The states can be anything: opacity levels, position, color, shape. The animation\
    \ isn't concerned with the states, only the properties of the transition itself.\
    \ When you create an animation, you supply four parameters:\n\n+   * curve: a\
    \ representation of an algorithm for returning values between 0 and 1. Like in\
    \ Script.aculo.us, this value will be used as a multiplier against the current\
    \ state of the element, for creating steps or *frames* of the animation.\n* *duration*:\
    \ number of milliseconds the animation will take.\n* *acceleration*: whether the\
    \ animation is accelerating or decelerating (not implemented at time of writing)\n\
    * *repeat*: number of times to repeat the animation (-1 means loop forever)\n\n\
    A curve is just an object that exposes a method, `getValue(n)`, where n is a number\
    \ between 0 and 1. The return value is an array of numbers that can be used to\
    \ calculate current state. For example, you could create a linear curve to move\
    \ from [0,0] to [100,100], tracing a line through a Cartesian plane that creates\
    \ a 45 degree angle in the upper right quadrant. Or, you could create an arc curve\
    \ to move from [255,0] to [0,255], thereby providing a transition from red to\
    \ blue. The Wiki for Dojo offers the following example of a curve implementation,\
    \ representing a linear transition value.\n\n```\nfunction Line(start, end) {\n\
    \  this.start = start;\n  this.end = end;\n  this.dimensions = start.length;\n\
    \  //simple function to find point on an n-dimensional, straight line\n  this.getValue\
    \ = function(n) {\n    var retVal = new Array(this.dimensions);\n    for(var i=0;\
    \ i<this.dimensions; i++)\n      retVal[i] = ((this.end[i] - this.start[i]) *\
    \ n) + this.start[i];\n    return retVal;\n  }\n}\n```\n\nReport erratum"
