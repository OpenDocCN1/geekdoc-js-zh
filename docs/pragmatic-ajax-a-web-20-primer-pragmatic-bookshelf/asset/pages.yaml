    Why do so many hate it for JavaScript? We believe JavaScript''s poor general reputation
    is not all due to the syntax or capabilities of JavaScript itself. In fact, the
    truth of the matter is that modern JavaScript is actually a very advanced programming
    language. It supports continuations, closures, aspect-oriented programming, on-the-fly
    modification and many of other features in languages like Python, Ruby, and Lisp.
    We think that its poor reputation stems from its historical misuse in early web
    applications for cramming business logic into the view. This chapter, and this
    book, is about using JavaScript for its natural purpose: creating a rich user
    interface.


