  md: "# Transport Enforcement\n\nSometimes, we don’t want graceful, transparent failover.\
    \ If, for some reason, we must mandate that only certainly kinds of post-back\
    \ transport mechanisms are used, we can pass in our rule on the dojo.io.bind()\
    \ call. If we want to enforce one transport-port, only we can do so by setting\n\
    \n```\ntransport: 'XMLHttpRequestTransport'\n```\n\nin the hash that we pass in.\n\
    \nright XMLHttpRequest object for your browser. If it can’t find one, it can drop\
    \ back to iframes to do the deed. All of this happens transparently to the developer.\n\
    \n# Submitting Forms\n\nDojo can submit a form asynchronously for you as well\
    \ as accessing a URL. All you need to do to submit your form is tell Dojo about\
    \ the form element in your HTML:\n\n```\ndojo.io.bind({\n  url: \"http://your.formsub.url\"\
    ,\n  load: function(type, obj) { /* use the response */\n  formNode: document.getElementById('yourForm')\n\
    })\n```\n\nC'est tout.\n\n# Support for Browser back/forward Buttons\n\nThis feature\
    \ is a gem. One of the issues with using XMLHttpRequest, vs an iframe is that\
    \ iframe events are placed in the browser history, while XHR events are not. This\
    \ can cause an issue if a user clicks on something that causes an Ajax request\
    \ which changes the page, and then they hit the back button assuming that it will\
    \ take them to the state they were before that request. Instead, they are taken\
    \ to the page before the Ajax code (which could be away from your website!).\n\
    \nDojo allows you to tie into the browser buttons, passing in the work that you\
    \ want to do when a user clicks on back or forward. In our CRM example, you could\
    \ save the current city and state information"
