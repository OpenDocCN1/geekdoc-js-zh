  md: '# Inner and Outer


    The innerHTML() property that we''ve just demonstrated is very useful, but it
    has a rather storied history. It was introduced as a proprietary addition to Internet
    Explorer; other browsers have decided to support it as it has proved fairly useful,
    for obvious reasons. There are, though, two related properties: innerText(), outerHTML().


    innerText() accomplishes almost the same thing as innerHTML(). The internal representation
    of the referenced node is replaced with the text passed into the method. However,
    unlike innerHTML(), the new text is not parsed as XML. It is, rather, rendered
    directly as a textual child of the containing node. This is actually a lot more
    performant than parsing the text as XML, and is preferable for just adding data
    than replacing new elements to the tree.


    outer() is a different beast. innerHTML() detaches any and all existing children
    of the target node, parses the new text, and adds the new nodes as children of
    the target node (essentially, replacing everything between the opening and closing
    tags of the target node), outerHTML(), on the other hand, replaces the target
    node itself. All of the existing node are lost as a byproduct of destroying the
    target node. The node is replaced with whatever new nodes are created by parsing
    the input to the method.


    This latter approach is actually much more useful when writing web pages that
    are dumb shells. The server-side code which renders the component can return the
    full entity (top-level node and its children) which can be placed anywhere on
    the page. Using innerHTML(), the containing page has full control over the layout
    of the components, with specifically designed container nodes to use as targets.
    The server endpoints only output the contents: if the containing page puts them
    in the wrong kind of node, or at the root of the document, the rendering will
    most likely be wrong.


    Using outerHTML(), however, the server target renders the containing node AND
    its contents, ensuring that no matter where the containing page puts the results,
    it will be fully contained as designed. A real component, not just component contents.
    This sounds like an excellent thing, and it is. Except it is still a proprietary
    IE addition, and Firefox, for example, has not adopted it, and has no public plans
    to do so.'
  merge: -1
