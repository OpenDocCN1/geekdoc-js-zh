  md: '# innerHTML Limitations


    According to the documentation for the IE, the innerHTML property is read-only
    for the following list of enclosing tags: COL, COL-GROUP, FRAMSET, HTML, STYLE,
    TABLE, TBODY, TFOOT, HEAD, TITLE, TR. Which means, you cannot use the innerHTML
    property to set the contents of a table row. This works fine in all browsers,
    but can be a serious limitation to cross-browser effects.


    Prototype also extends the document object to include the new getClassName() method.
    You pass in the string name of a CSS class and the function will collect all the
    elements in the DOM that contain that class in their list. It doesn''t matter
    if the name is first or only entry in the element''s list. Prototype will still
    find it.


    ```

    <div id="one" class="class1">

    <div id="two" class="class2">

    <div id="three" class="class1">

    <div id="four" class="class1 class2">\n<script type="text/javascript">

    var classOn = document.getElementsByClassName(''class1'').length; // 3

    var classTwos = document.getElementsByClassName(''class2'').length; // 2

    var classThrees = document.getElementsByClassName(''class3'').length; // 0

    </script>

    ```


    This method only takes a single class name, though. It is up to you to make any
    sort of union if you are looking for elements implementing one of lists.


    Once you can successfully retrieve nodes from the DOM, the next step is manipulating
    them. Among the most common things to do is simply change the content of a node
    by resetting the value of its innerHTML property. innerHTML is just a string representation
    of the contents of property. If you fill it with properly formatted HTML, the
    browser will render it as. When you retrieve, you will want to maintain the tag
    structure in its original format. Other times, you''ll want to actually display
    the tags as strings rather than them rendered as HTML. Prototype extends the JavaScript
    String class with new methods. escapeHTML() returns the innerHTML, but with any
    HTML tags escaped so they can be displayed as text. unescapeHTML() does the exact
    opposite. This is very useful for displaying HTML source within an HTML page.'
