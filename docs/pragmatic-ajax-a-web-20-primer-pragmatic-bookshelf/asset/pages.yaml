  md: "# A REVIEW OF CLIENT-SIDE JavaScript\n\n# Defining Events Outside of HTML\n\
    \nWe have so far shown that JavaScript event handler functions can be wired up\
    \ to nodes through HTML attributes. This is fairly common practice, though there\
    \ is a class of programmer (we'll call them 'purists') who frown upon this usage.\
    \ Even though JavaScript is embedded within the web page itself, many developers\
    \ like to consider the JavaScript and the HTML as separate artifacts. Specifically,\
    \ web designers will want to work on the HTML and styles, while programmers will\
    \ want to focus on the scripting. Directly embedding the JavaScript into the HTML\
    \ is too much coupling.\n\nThe main alternative is to use JavaScript object properties.\
    \ Once you have retrieved a reference to a node of an HTML document, it exposes\
    \ its events as a series of properties. Functions can be directly attached to\
    \ those properties. The following\n\n```\n<div id=\"mydiv\" onclick=\"myfunction()\"\
    >\n```\n\nis functionally equivalent to\n\n```\n<div id=\"mydiv\"/>\n<script type=\"\
    text/javascript\">\n  document.getElementById('mydiv').onclick = myfunc;\n</script>\n\
    ```\n\nThe value to this technique is that the designer can worry about HTML,\
    \ and only HTML. Programmers can hook events transparently. However, the downside\
    \ is that the scripts that reference events must be parsed after the HTML they\
    \ reference. Otherwise, the event cannot be found by getElementById(), and the\
    \ result is that no event is actually handled. There is a relatively new library\
    \ out called Behavior (http://bennolan.com/behaviour/) that helps programmers\
    \ by allowing you to assign behaviors to CSS classes, adding an extra layer of\
    \ indirection.\n\nModern browsers support a new kind of binding. The new attachEventListener()\
    \ function takes the name of the event to handle (the \"on\" part), the function\
    \ pointer, and a boolean value called capture mode. The beauty of the new attachEventListener()\
    \ method is it can wire up multiple handlers to the same event, creating a chain\
    \ of handlers. Using the direct property access, any subsequent assignments to\
    \ a property just override the last assignment. Before using attachEventListener(),\
    \ make sure your browser is supported. At last, IE5+ for Windows, Firefox 1.0+\
    \ and Safari 1.2+ were all supported, but not IE for the Mac."
