  md: "few minor changes to our code. First, we need to create some sort of global\
    \ state that tracks the current zoom level of our map. Second, we need to reference\
    \ this state in the all relevant places in our code (just one, actually).\n\n\
    Let's start with the global state. We'll create a variable to track the current\
    \ zoom level, and while we're at it, add a constant (in the form of a two-dimensional\
    \ array) for declaring the different sizes of the inner div:\n\n```\nvar zoom\
    \ = 0;\nvar zoomSizes = [ \"2000px\", \"1400px\" ], [ \"1500px\", \"1050px\" ];\n\
    ```\n\nNow, in matter of cleanliness, we'll change the first line of our init\
    \ method from this:\n\n```\nsetInnerDivSize('2000px', '1400px');\n```\n\nto this:\n\
    \n```\nsetInnerDivSize(zoomSizes[0], zoomSizes[1]);\n```\n\nThere's just one other\
    \ place we need to wire in the zoom support: our checkTiles() function, which\
    \ creates the img elements for the tiles and gives them their URL. We need to\
    \ change this hard-coded zoom level code:\n\n```\nvar tileName = \"x\" + tileArray[0]\
    \ + \"y\" + tileArray[1] + \"z0\";\n```\n\nto this:\n\n```\nvar tileName = \"\
    x\" + tileArray[0] + \"y\" + tileArray[1] + \"z\";\n```\n\nAll that remains is\
    \ to implement the toggleDiv() function, which we've done here:\n\n```\nfunction\
    \ toggleDiv() {\n  zoom = (zoom == 0) ? 1 : 0;\n  var innerDiv = document.getElementById(\"\
    innerDiv\");\n  var imgs = innerDiv.getElementsByTagName(\"img\");\n  while (imgs.length\
    \ > 0) innerDiv.removeChild(imgs[0]);\n  setInnerDivSize(zoomSizes[0], zoomSizes[1]);\n\
    \  checkTiles();\n}\n```\n\nNothing tricky: swap the value of the zoom variable\
    \ between 0 and 1, delete all the <img> elements from the inner div, change the\
    \ size of the inner div based on the zoom level, and finally, invoke checkTiles()\
    \ to rebuild the map with the new zoom level's tiles."
