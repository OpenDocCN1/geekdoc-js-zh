  md: "# 3.2 Manipulating the Web Page\n\nSo far, we've covered the basics of JavaScript\
    \ and discussed how to get a web page to call JavaScript functions in response\
    \ to user events. This covers a third of what you need to know to create an Ajax\
    \ application. The next major piece is knowing how to actually change web page\
    \ content from JavaScript.\n\n# XML Under the Covers\n\nModern browsers store\
    \ a copy of every web page you visit in memory as an XML document, regardless\
    \ of whether you are visiting a modern XHTML site or an old HTML 2.0-era site.\
    \ (When a web page is not well-formed, the browser follows an internal algorithm\
    \ for promoting the HTML to XML.) This in-memory representation of the web page\
    \ can be accessed by JavaScript code to programmatically determine all kinds of\
    \ information about the page.\n\nMore importantly, the XML document can be modified,\
    \ and modifications are instantly reflected by the browser's rendering of that\
    \ page. Thus, to achieve animation, dynamic modification, and other effects, all\
    \ one has to do is modify the web page's underlying XML document. We'll now consider\
    \ how to go about making such modifications.\n\n# Modifying the XML: The DOM API\n\
    \nThe major browsers implement the same API for exposing the XML document to JavaScript\
    \ code; it's known as the DOM API. Short for Document Object Model, DOM represents\
    \ XML elements, attributes, and other components as objects in memory. The DOM\
    \ API models an XML document in memory as a Document object.\n\nYou can obtain\
    \ a reference to the Document object that represents the current web page by referencing\
    \ a variable named `document`. From this instance, you can retrieve elements to\
    \ individual XML elements in the web page, which are modeled as Element objects.\
    \ You can also modify the attributes of an XML element via an Element object.\n\
    \nIt's time for an example. This next code excerpt contains a simple web page\
    \ that will modify when its button is clicked:\n\n```\n<head>\n  <script type=\"\
    text/javascript\">\n    function modifyPage() {\n      var htmlElement = document.documentElement\n\
    ```"
