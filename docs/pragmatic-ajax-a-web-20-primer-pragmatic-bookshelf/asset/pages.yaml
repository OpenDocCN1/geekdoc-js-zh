  md: "and clean it out in the form when the user clicks \"back\". Then, if the user\
    \ clicks \"forward\" you could reset it into the form without having to go back\
    \ to the server.\n\n```\nbackButton: function() {\n  saveCityState();\n  cleanCityState();\n\
    }\nforwardButton: function() {\n  setupState();\n}\n```\n\nHow does Dojo do this?\
    \ Is there a nice API that Firefox and IE give you to hook in? No. The actual\
    \ implementation differs depending on the browser, but at a high level Dojo creates\
    \ a hidden iframe, it makes it go forward two requests, and then one back. Now,\
    \ it is set ready to do your bidding. If you click back on the onload event will\
    \ call your backButton callback. Ditto for the forward button.\n\n# Bookmark-ability\n\
