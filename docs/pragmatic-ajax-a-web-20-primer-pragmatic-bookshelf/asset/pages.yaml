    # Request Notification


    The asynchronous server-side validation we just created works well. The user gets
    a pretty big benefit without too much of a cost. We do one problem, though. The
    user is firing server-side events via a non-standard mechanism. Rarely does a
    web application expect the TAB to establish a connection back to the server. Without
    that expectation, they might be very surprised to find that bandwidth is consumed
    at this point, and even more surprised when, a half second later, the UI suddenly
    pops up a block of red text to the field they just left. If you take into account
    the expected occurrence of network latency, and suddenly you have the scenario
    of a user getting all the way to the bottom of a form before error messages start
    filling in the top. How bad would it be if the error messages popped up in an
    area of'
