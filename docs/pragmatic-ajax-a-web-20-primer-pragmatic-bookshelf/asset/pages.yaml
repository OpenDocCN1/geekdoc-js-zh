    \ to the application developer, however, since it is trivial for a user to circumvent\
    \ client-side JavaScript. Heck, users can ignore our rendered HTML entirely and\
    \ craft requests to our system using Telnet. Therefore, server-side validation\
    \ is always mandatory. Client-side validation is a usability enhancement for our\
    \ users.\n\nAjax allows us to combine the two techniques for greater usability.\
    \ The problem with client-side techniques is that the validation rule itself has\
    \ to be portable to the browser. This means you can execute regular expression\
    \ matches, required field checking, and even small-scale data comparisons (for\
    \ example, is the state abbreviation of one of the standard 50 two-letter abbreviations).\
    \ You can't, however, validate the inputs against your database, or against any\
    \ server-resident data or rules. With Ajax, we get the benefits of client-side\
    \ validation (“instant” feed-back without a page refresh) but the power of server-side\
    \ validation (comparison against server-resident data or rules).\n\nThis means\
    \ we can create web applications with full validation the way we have historically\
