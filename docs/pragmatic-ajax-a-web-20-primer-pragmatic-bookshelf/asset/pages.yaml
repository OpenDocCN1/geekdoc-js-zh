  md: "# Step 4: Dragging the Map\n\nWe implement dragging as a series of three different\
    \ mouse event listeners. When the user presses the mouse button in the map area,\
    \ we will use a listener to indicate that a drag operation has started. Now, if\
    \ the user moves the mouse, we will use a listener to move the inner div along\
    \ with the user's mouse movements to create the dragging effect. Finally, we will\
    \ use a listener to turn off the dragging operation when the mouse button is released.\
    \ The following code demonstrates how we implemented the listeners:\n\n```\n//\
    \ used to control moving the map div\nvar dragging = false;\nvar top;\nvar left;\n\
    var dragStartTop;\nnfunction init() {\n  // make inner div big enough to display\
    \ the map\n  setInnerDivSize('2000px', '1400px');\n  // wire up the mouse listeners\
    \ to dragging\n  var outerDiv = document.getElementById(\"outerDiv\");\n  outerDiv.on\
    \ = = startMoven  outer.onmousemove = processMove;\n  outerDiv.onmouseup = stopMove;\n\
    \  // necessary to enable dragging on IE\n  outerDiv.ondragstart = function()\
    \ { return false; }\n}\nfunction startMove(event) {\n  // necessary for IE\n \
    \ if (!event) event = window.event;\n  dragStartLeft = event.clientX;\n  dragStartTop\
    \ = event.clientY;\n  var innerDiv = document.getElementById(\"innerDiv\");\n\
    \  innerDiv.style.cursor = \"moz-grab-grab\";\n  top = stripPx(innerDiv.style.top);\n\
    \  left = stripPx(innerDiv.style.left);\n  dragging = true;\n  return false;\n\
    }\nfunction processMove(event) {\n  if (!event) event = window.event; // for IE\n\
    \  var innerDiv = document.getElementById(\"innerDiv\");\n  if (dragging) {\n\
    \    innerDiv.style.top = parseFloat(top) + (event.clientY - dragStartTop);\n\
    \    innerDiv.style.left = parseFloat(left) + (event.clientX - dragStartLeft);\n\
    \  }\n}\nfunction stopMove() {\n  var innerDiv = document.getElementById(\"innerDiv\"\
    );\n  innerDiv.style.cursor = \"\"\";\n  dragging = false;\n}\n```"
