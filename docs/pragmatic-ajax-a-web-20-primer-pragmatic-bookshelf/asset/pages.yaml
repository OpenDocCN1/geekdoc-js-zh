  md: "# JavaScript in a Web Page\n\nWe said that \"most\" JavaScript in a page should\
    \ be included in a <script> tag. The exception is that JavaScript can be embedded\
    \ in-line as the value of attributes on a tag. Specifically, instead of referencing\
    \ JavaScript functions in event handler attributes, you can embed JavaScript directly.\
    \ There is no functional difference between:\n\n​\\u0```html\n<div id=\"myDiv\"\
    \ onclick=\"clickIt();\"></div>\n<script type=\"text/javascript\">\nfunction clickIt()\
    \ {\n  alert(\"You clicked me!\");\n  alert(\"Jerk!\");\n}\n</script>\n```\nand:\n\
    ```html\n<div id=\"myDiv\" onclick=\"alert('You clicked me!'); alert('Jerk!');\"\
    ></div>\n```\n\nAs we explained back then, the onblur event is fired (that is,\
    \ its contents are executed) when the user moves the cursor from the input component\
    \ to some other place on the web page. In this example, the contents of the event\
    \ attribute is a function invocation. As we've shown, you can place any arbitrary\
    \ JavaScript code you like here, but it is a good idea to limit yourself to function\
    \ invocations to keep your code easier to maintain.\n\nThere are a large number\
    \ of events available in a web page. These range from the so-classic events defined\
    \ many years ago in the official HTML 4 specification to some additional de facto\
