    # 4.3 Creating Ajaxian Maps


    Because Ajaxian Maps won''t bother with all of that geocoding mum jumbo, all of
    our heavy lifting will be in JavaScript. However, we will use Java to provide
    some server features and a few image manipulation tasks. While all of the code
    for Ajaxian Maps will be included in this chapter, you can also download the code
    from our website at http://www.ajaxian.com/pragajax/ajaxianmaps/.


    # IE 6, Firefox 1.x, and Safari 2.x Only


    We''ve tested this version of Ajaxian Maps in the three major browsers, but haven''t
    bothereded with older versions and more obscure browsers (sorry, Opera users).
    It should work on older platforms, but without testing, we can''t be sure we we''ve
    caught everything.


    # Step 1: Create a Map


    The first step in displaying a map is err, creating it. While we could simply
    steal the wanted that Google Maps uses, Google might not appreciate that. So,
    we''ll go ahead and use a map that is explicitly source. The Batik project (http://xml.apache.org/batik),
    an open-source Java-based SVG renderer, comes with an SVG map of Spain. We''ll
    go ahead and use that.


    Because most browsers don''t provide native support for SVG, we''ll need to convert
    the map to a bitmap-based format. Fortunately, Batik can do that for us. One of
    the nice about SVG is that it can scale to arbitrary sizes, so we could conceivably
    create a huge image for our map. However, creating truly huge images is a little
    tricky, because due to memory limitations, we''d have to render portions of the
    SVG image and generate our tiles over the portions and have some sort of scheme
    for unifying everything together. To keep this chapter simple, we''ll just go
    ahead and limit our map to 2,000 pixels in width and 1,400 pixels'
