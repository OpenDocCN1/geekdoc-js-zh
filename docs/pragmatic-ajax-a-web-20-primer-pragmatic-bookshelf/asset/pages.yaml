  md: '# REMOTING WITH THE DOJO TOOLKIT 80


    example from the previous chapter, but we want to move up the stack and utilize
    remoting toolkit to abstract browser compatibility issues and give us more options
    for controlling the remoting calls.


    We will first port our application to use the Dojo Toolkit,¹ explain-choices that
    you have along the way, and finally discussing more advanced features.


    # What is the Dojo Toolkit?


    Dojo is a browser toolkit. It is an open source project, that (to quote its marketing
    text) aims to allow you easily build dynamic capabilities into pages and any other
    environment that supports JavaScript. Dojo provides components that let you make
    your sites more usable, responsive, and functional. With Dojo you can build degrade
    user interfaces easily, prototype interactive widgets quickly, animate transitions,
    and build Ajax-based requests simply.


    It is a fully featured toolkit that has many packages including:


    +   - dojo.io: The core package that we will look at in this chapter, makes Ajax
    requests easy.

    - dojo.event: Support for Browser compatible event system.

    - dojo.lang: Support for mixins, and object extension.

    - dojo.graphics: Support for nifty HTML effects (e.g. fadein/Out, slideTo/By,
    explode, implode, etc.).

    - dojo.dnd: Drag and Drop support.

    - dojo.animation: Create animation effects.

    - dojo.hostenv: Support for JavaScript packages (think imports/includes instead
    of having to create script src...")


