  md: "# Effects\n\nThe library is divided between the five core effects and a series\
    \ of combination effects built on top of them. The core effects are: Opacity,\
    \ Highlight, MoveBy, Scale, and Parallel. Every effect represents a transition\
    \ between two states that occur over time. The effects have default values for\
    \ start and end points, as well as duration. These defaults can be overridden\
    \ for a fully customized effect. The various effects each have different required\
    \ parameters (for instance, MoveBy() requires x and deltas), and each can accept\
    \ any of the standard options as well. The general syntax for launching an Effect\
    \ is:\n\n```\nnew Effect.EffectName(element, required-params, {options});\n```\n\
    \nThe effects are all asynchronous which means if you launch several effects simultaneously\
    \ they will render simultaneously. This is true whether the effects target different\
    \ elements, or all target the same element. Quick-fired users won not be surprised\
    \ by browser lockups as your <div> turns yellow and balloon to twice their size,\
    \ and you can fade out many deleted items from your list as you desire at the\
    \ time.\n\nThis section will examine all possible ways to utilize the core effects\
    \ from the library. In Chapter 7. Ajax UI, Part II, on page 115, we'll show how\
    \ to use them effectively to increase the usability of the user interface. For\
    \ all their cool factor, these kinds of effects can be overused and become another\
    \ <blink> tag, knowing why you would employ them is just as important as knowing\
    \ how.\n\nThe standard options you can pass to the effects are:\n\n+   - duration:\
    \ the number of seconds the transition will take (default 1.0)\n- fps: target\
    \ frames per second rate (default 25)\n- transition: an algorithm for determining\
    \ how to move from the starting point to the ending point. These are represented\
    \ as a series of, essentially, enumerated constants. One can be of:\n  - sinusoidal:\
    \ start slow, peak in the middle, slow down on the way out\n  - linear: constant\
    \ speed from start to end\n  - reverse: constant speed, but from end to end"
