  md: 'means within a browser. Server-side development frameworks face the same pressures
    for innovation that client-side frameworks do.


    We''ve long had support for client-side technologies in our server-side frameworks.
    From template-based view rendering technologies like JSP, ASP and RHTML, server-side
    objects with self-rendering capabilities like ASP.NET and JS components, these
    frameworks use a wide variety of methods to influence the client view. Now, they
    are adding the ability to generate JavaScript for the client to create Ajax effects
    and sometimes to hook up to server entities for data transfer. There are three
    major categories of Ajax integration support: visual tool support, tag libraries,
    and ORB-like remoting.


    # 9.2 Working with Sajaj


    Let''s return to Hector and his CRM application. He''s decided to move his team
    to an open source platform, namely PHP. He''s convinced that team will be able
    to get more leverage by using an integrated Ajax framework. This means the team
    can add these new effects and callbacks without leaving the confines of PHP. We''ll
    first port the application to Sajax¹.


    # What is Sajax?


    Sajax is one of the earliest Ajaxian web frameworks available, originally written
    for PHP. It is an open source project, and allows you to bind your web UI to server-side
    functions. It accomplishes this by exporting client-side JavaScript functions
    that invoke a Sajax bridge to the server-side code that is actually executed,
    wrapping it all in an XHR request.


    Sajax is an ORB-like remoting layer, which means that we will be able to first
    write the server side functions that we need (consisting of talking to the database,
    and returning the correct data back) and then bind our HTML UI directly to these
    functions. There will be no XMLHttpRequest object to be found, and you may even
    be surprised with some of the JavaScript calls that we can run, since we will
    not see them in the PHP code itself.


    There is some tension in the development community surrounding this kind of object
    remoting strategy. Some developers are very keen on


    > ¹http://www.modernmethod.com/sajax/'
