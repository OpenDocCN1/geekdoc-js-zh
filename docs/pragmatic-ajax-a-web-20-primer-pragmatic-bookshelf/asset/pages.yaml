  md: "# Web Application Toolkit\n\nToolkits such as SmartClient aim to give widgets\
    \ that build a UI that looks and feels the same as a native application on Windows\
    \ or Mac OSX. These are useful if you are building an application that happens\
    \ to be on the web, versus a website that uses a couple of UI effects and components.\
    \ SmartClient, for example, features widgets that make the page look and feel\
    \ like a Windows NT application.\n\n# Markup Based\n\nBackbase allows you to add\
    \ rich components through a markup-programming API. Your traditional HTML becomes\
    \ something like:\n\n```\n<cmp bbase=\"true\" style=\"display:none\" xmlns=\"\
    http://www.backbase.com/site/nav\">\n  <s:event b:on=\"construct\" b:action=\"\
    show\">\n<!-- everything that is never shown - in here --\n    <div style=\"display:none;\"\
    >\n      <s:include burl=\"/chrome/bb3/skin.xml\">\n      <s:include burl=\"/data/navigation.xml\"\
    >\n      <s:include burl=\"/data/forms.xml\">\n      <!-- listeners for links\
    \ to non-BDOC documents... --\n      <div id=\"form\">\n        <s:event b:on=\"\
    show-page\" b:action=\"select\" b:target=\"id('formBuffer') />\n      </div>\n\
    \    </div>\n    <s:event b:on=\"nav-show-page\" b:action=\"select\" b:target=\"\
    id('shop_main') />\n  </div>\n<!-- Contains references to protected buffers --\n\
    \  <!-- Trigger 'command' event to issue butterdiffirty on them all --\n  <div\
