    >|\n|<th>City</th><td><input id=\"city\" type=\"city\"></td>|\n|<th>State</th><td><input\
    \ id=\"state\" type=\"text\" size='3' maxlength='2'></td>|\n</tr>|\n\nThen we\
    \ associate an updater with the element with id=`rewrite` by wiring up the Ajax.Updater.\n\
