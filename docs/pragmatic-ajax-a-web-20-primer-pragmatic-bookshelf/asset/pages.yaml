    # Don''t Reinvent the Wheel


    We''ve grown accustomed to certain UI conventions. Modern operating systems and
    their windowing toolkits offer us certain abstractions that have settled in our
    consciousness. We know how a window is, for example. Even my parents know when
    they see a box on the screen with an outset border, a header at the top and some
    buttons in upper left or right corners, that thing can be dragged around the screen
    and it can be closed. We know what a button looks like and what the appropriate
    thing to do is click on it, once, to press it. We''ve been trained that text along
    the top edge of a window probably means, and if we hover the mouse over them or
    click on them, they are likely to spawn little submenu. I''ve actually run this
    experiment with my family. They are Microsoft Windows users. If I put them in
    front of a Mac, they know even though the actual graphical look is entirely different.
    They have no idea what the Dock is for, but the common abstractions are plain
    and clear. Likewise, when they sit at a Gnome or KDE desktop on their Linux box,
    everything is fairly straightforward.


    The web has taught us some additional standards. Now, we agree that text along
    the top or left edges may be a menu, and hovering the mouse over a menu is preferable
    to clicking on it to get the submenu to appear. We know that words, underlined
    and often blue, hyperlinks will navigate us to a new page. Square boxes next to
    words are checkboxes, which can be checked and unchecked individually, while groups
    of gray circles are radio buttons, and clicking on one affects the others. And
    when the cursor turns into a little pointing hand, that means whatever we are
    hovering over is clickable.


    These conventions enable a common computing experience. They are the very thing
    that allows users not to have to RTFM every time they encounter a new application.
    They allow us to surf the web, which is really just the accumulation of a billion
    applications designed by a billion monkeys. Without those conventions, every new
    web page would


