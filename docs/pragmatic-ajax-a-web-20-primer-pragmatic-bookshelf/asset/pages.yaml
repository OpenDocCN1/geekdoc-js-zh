  md: '# 1.4 Whither Now?


    The rest of this book will introduce you to the breadth of the Ajax movement.
    We''ll walk through the conversion of an application to this new style, and take
    a deep look at the enabling technologies behind Ajax. We''ll introduce you to
    commonly available toolsets and frameworks that make seemingly advanced effects
    as simple as a single line of code. You''ll get to see what your favorite development
    platforms are doing to take advantage of, and integrate with, this new style of
    development.


    Most importantly, we''re going to talk a lot about how to use Ajax effectively,
    pragmatically, even. Because the only thing worse than being left behind when
    the train leaves the station is getting on the wrong train. We intend this book
    to be a guide through a new and rapidly evolving landscape. We want to help you
    find out how, and even if, Ajax can help you your projects. We''re not trying
    to sell you anything (except this book). But we believe that Ajax represents a
    major event, and we want to be there to help you make the best of it.'
  merge: -1
  pgno: 13
