    # Porting CRM to Sajax PHP


    In order to port the CRM application to Sajax, we will be changing the way we
    think about the application. Back in the chapters on JavaScript toolkits and frameworks
    such as Dojo and Prototype, we were very focused on the front-end HTML and JavaScript
    code, and little was mentioned about the back end. Now we will focus behind the
    scenes, and will use Sajax to generate the front end as much as possible. This
    means that instead of writing all of the JavaScript ourselves, we will have helper
    functions that can do magic for us.


    # Building Back End Functions


    Let us create PHP backend functions for the Zip to City/State server. We will
    build the get_city_state() function that will use a MySQL database to return the
    city and state for the given zip code. We will place this functionality in our
    PHP file, zipService.sajax.php, and will include it from our web-facing PHP code.


