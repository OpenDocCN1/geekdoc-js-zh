  md: '# Chapter 5


    # # Ajax Frameworks


    Up until now, we''ve looked at Ajax either at an abstract architectural level,
    or from down in the tunnels underneath the structure. The DOM API and JavaScript''s
    sometimes tortured interactions with it form the basis of all other Ajaxian techniques.
    Though it is vital to understand these things when you run into trouble, it is
    also likely that you''ve been left scratching your head from time to time. Maybe
    you wondered who decided to use magic numbers for all the ready values. Or why
    the industry standard way to create an XHR instance is in a try/catch block that
    will encounter an exception ~70% of the time. In fact, if you are anything like
    us, it probably occurred to you that you could write a fairly simple wrapper around
    this stuff to make it more usable in production code. These wrappers are fairly
    common; the internet is littered with their corpses.


    A few library wrappers have survived and flourished to become full-fledged toolkits.
    They provide us with better leverage for using Ajaxian techniques to make real
    applications. In this chapter, we will take a look at several of these frameworks
    at our disposal, and will rewrite Hector''s CRM application using the most mature
    and popular versions.


    # ## 5.1 Frameworks, Toolkits, and Libraries


    As Ajax has taken off, we have been inundated with projects claiming to have Ajax
    support. Since the term itself has such broad meaning in the popular consciousness,
    though, it is often hard to know exactly what this means. Does the site perform
    asynchronous callbacks to the'
