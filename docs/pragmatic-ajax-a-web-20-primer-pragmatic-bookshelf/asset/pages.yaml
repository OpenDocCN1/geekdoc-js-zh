    vices provided there. Those standards, some written and some understood, are vital
    to the success of all applications on the web, whether or not they use Ajax.


    The key to a successful Ajaxification is to not ignore important conventions.
    There are certain laws of the land that made the web so popular and accessible,
    in that other applications and technologies never were. As you add this new technology
    into your application, think both tactically and strategically. Ask yourself the
    following questions:


    +   - “Is I''m adding the usability of my application, or the length of my resume?”

    - “Does it break an ingrained habit of my users?”

    - “Is the value worth the cognitive dissonance such a break for my users?”


    Tactically, the change might increase the usability of this single page, but strategically,
    reduce the usability of the application as a whole.


    We''ll walk through some of the biggest anti-patterns to watch out for. This list
    is not exhaustive. When in doubt about something you are working on, check it
    against our smell-test questions above. In mind that the key to usability is fun:
    if it increases both, then do not it!


    # Watch That Back Button!


    Two things set the World Wide Web apart from everything that came before it: the
    back button, and the bookmark. Applications historically were guided tours. Users
    were encouraged to follow certain paths through the information provided. At best,
    users might be able to search for a specific item or screen and navigate directly
    to it. If they moved on, the only way to get back was to run the search again.
    And even this was a rare enough feature for an application. Consider Quicken circa
    1998, or those multimedia encyclopedias we all bought back in ''96. You had tables
    of contents, and search capabilities, but no notion of the history of your actions.


    The back button isn''t just a button; it is a symbol of freedom. It means you
    are free from the shackles of the guided tour. You forge your own path through
    the information at your fingertips, and can retrace your steps at your leisure.
    You become the master of the application, instead of the other way around. Don''t
    believe me? Go into'
