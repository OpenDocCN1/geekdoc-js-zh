    # Bookmarking Makes the Web


    Bookmarking is the kissing cousin of the back button. It is a user-

    controlled meta-history of their browsing exploits. Bookmarking the

    index page (the welcome mat) is less useful now than it was in the past.

    With Google as our shared bookmark most people don''t bother book-\marking the
    index page anymore. It is just easy to run to Google, type

    the page name, and click the resulting link (or even the I''m feeling

    lucky button, which we almost never are). Instead, we use bookmarks

    for deep linking. This means capturing the state of the application or

    site at some point after you begun interacting with it. Perhaps the

    results of a search at Amazon, or the report of your current holdings

    y your financial institution, or some particular article at the New York

    times.


    Deep linking means that users have the ability to pause and

    return to your application. If state is maintained (cookies, long term

    sessions, backend storage, whatever) and users can specify where in

    the application flow to resume their work, then they are not chained to

    your timetable. We often find ourselves in the middle of something on

    an application but forced to take a call, or run to a meeting. We want

    to know that we can pick up right where we left off at some later time.'
