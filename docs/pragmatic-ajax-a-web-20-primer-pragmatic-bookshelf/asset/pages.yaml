  md: "the screen the user has already scrolled past? Fairly inconvenient, at\nt least.\n\
    \nThe answer is to include a feedback mechanism that alerts the user\na request\
    \ is in progress. Brows typically accomplish this through\na spinning/jumping/waving\
    \ graphic in upper right corner that only\nanimate while a request is being processed.\
    \ Ajax techniques can't\ntake advantage of this UI convention, though, for two\
    \ reasons: it is\ndifficult-to-impossible to control the browser's request icon,\
    \ and it can\nonly alert you to the status of a single request at a time. With\
    \ Ajax, and\na technique like the validation described above, there can be multiple\n\
    concurrent requests being processed.\n\nThe standard solution is to show an animated\
    \ graphic that indicates\na request in process, but show it inline, wherever the\
    \ results of the\nwill be displayed. If the graph pops up immediately, the user\n\
    know right away that anything is happening and where to look for the\nresults.\
    \ Multiple graphics can be shown simultaneously by embedding\nthem in multiple\
    \ containers in the DOM. The current standard is to\nuse an animated GIF image,\
    \ which is quick to load and imply activity\nhowout having actually call the current\
    \ status of the request,\nas in Figure 7.3 on the next page.\n\nFirst, we're going\
    \ to add some `<span>` to the page to hold our progress\nindicators. In this case,\
    \ the image is an animated GIF called `progress.gif`,\nwhich is just a spinning\
    \ wheel. We'll add them between the input fields\nand the associated error message\
    \ containers; this will place the notifi-\ncation GIF approximately where the\
    \ error message will appear, so the\ney is drawn to the appropriate place. We\
    \ will go ahead and make a hard\nlink to the image, rather than loading it dynamically\
    \ with JavaScript,\nthough either would be acceptable. The browser will natively\
    \ attempt to\ncache for the first container, and all subsequent containers\nwill\
    \ the cached GIF, preventing needless roundtrips to the server\nfor the same file.\
    \ We'll simply place the image in a `<span>` whose-\nstyle is set to none. When\
    \ we notify the user, we toggle the\n<span>`. When the request is complete, we\
    \ toggle it again.\n\n```\nLine 1 - <tr>\n      <th>Customer Name:</th>\n    \
    \  <td>\n        <input type=\"text\" id=\"name\" name=\"name\"\n            \
    \ onblur=\"validateField('name', 'required', 'name', 'nameError')\">\n       \
    \ <span id=\"nameProgress\" style=\"display:none;\"><img src=\"../progress.gif\"\
    >/</span>\n      </td>\n```\n\n![](img/e950a16d093a2ad996943265f0f0b6cd_126_0.png)"
