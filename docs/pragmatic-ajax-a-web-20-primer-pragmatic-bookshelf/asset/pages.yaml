  md: "```\nfunction getData(zipCode) {\n  new Ajax.Updater(\"rewrite\", url, {\n\
    \    asynchronous: true,\n    method: 'get',\n    parameters: \"zipCode=\" + zipCode\
    \ + \"&type=html\",\n    onFailure: function(request) {\n      assignError(request.responseText);\n\
    \    }\n  });\n```\n\nWhen the request fails, the assignError() function is called\
    \ to display the message. We're now going to add a handler to the onSuccess method\
    \ to perform the YFT. We use onSuccess instead of onComplete because onComplete\
    \ will fire regardless of what's in the response. This would lead us to highlight\
    \ city and state even if their data doesn't update. Instead, we use onSuccess,\
    \ which only fires if the returned data ends up in the display fields.\n\n```\n\
    function getData(zipCode) {\n  new Ajax.Updater(\"rewrite\", url, {\n    asynchronous:\
    \ true,\n    method: 'get',\n    parameters: \"zipCode=\" + zipCode + \"&type=html\"\
    ,\n    onSuccess: function(request) {\n      new Effect.Highlight('rewrite');\n\
    \    },\n    onFailure: function(request) {\n      assignError(request.responseText);\n\
    \    }\n  });\n```\n\nThe effect of this handler is that the row containing City\
    \ and State will yellow whenever the request succeeds, then fade back to white\
    \ over a one second. Bear in mind, as we learned in the previous chapter, you\
    \ can affect the behavior of the transition by submitting options to the call.\
    \ For example, you can change the transition to go from cornflower to blue over\
    \ three seconds with a linear transition by changing the call to:\n\n```\nnew\
    \ Effect.Highlight('rewrite', {\n  startcolor: '#92A4E2',\n  duration: 3.0,\n\
    \  transition: Effect.Transitions.linear } );\n```\n\nYou can also choose the\
    \ end transition color (endcolor) and the final color to use after the fade (restorecolor)\
    \ if you need to."
