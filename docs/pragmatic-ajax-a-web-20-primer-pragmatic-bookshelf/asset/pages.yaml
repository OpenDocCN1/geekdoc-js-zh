    ![](img/e950a16d093a2ad996943265f0f0b6cd_80_0.png)


    Figure 5.1: Layers of Ajax Frameworks


    server? Does it re-render fresh data in-page? Or does it just manipulate the properties
    of existing DOM nodes?


    Figure 5.1 clarifies the distinct layers of Ajax proper.


    # Remoting Toolkit


    The lowest level of Ajax helpers is a remoting toolkit. If you were to create
    your own toolkit, this would probably be where you started out: wrapping XMLHttpRequest
    with your own API to make life easier. A really good remoting toolkit should be
    to do much more than simply hide our ugly fry/catch XHR instantiation. What would
    happen if your Ajax page is loaded by a browser that does not support XMLHttpRequest?
    It ought to find a way, if possible, to provide all (or at least some) of its
    functionality by other means. For example, some remoting toolkits will use a hidden
    iframe to fake XHR support to the page.


    Figure 5.1 lists a handful of such frameworks, and shows what each attempts to
    provide to developers. The Dojo Toolkit, JSON-RPC, and Prototype are pure JavaScript
    frameworks that are agnostic about the world of the server side (although Prototype
    was built with Ruby in mind).


