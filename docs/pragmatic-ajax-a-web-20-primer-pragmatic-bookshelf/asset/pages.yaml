    \ true });\nnew Effect.Scale('window', 200,\n  sync: true,\n  transition: Effect.Transitions.pulse\n\
    },\nduration: 2.0);\n```\n\n# Combination Effects\n\nLuckily, Script.aculo.us\
    \ already provides a wide variety of combination effects using Effect.Parallel\
    \ and the four core effects. Once again proving you can build great complexity\
