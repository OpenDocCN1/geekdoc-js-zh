  md: "# AJAX and JavaScript for The UI\n\nA final case is when you want to eliminate\
    \ the tags altogether. Imagine a div that contains a bibliography entry, rendered\
    \ so that the title of the book is underlined and the author's name is boldfaced.\
    \ You want to retrieve that as data; any embedded style notation (or, `<b>` tags)\
    \ are extraneous. String now has the strip-tags() method which eliminates any\
    \ angle brackets (and what's inside them) from the output. Whitespace is otherwise\
    \ maintained, allowing you to treat HTML as raw data.\n\n# Element\n\nPrototype\
    \ introduces a new class, Element, that controls some basic styling properties\
    \ of a DOM node. Element is a static class, in that you need not create an instance\
    \ of it to access its functionality. Its various methods all take an element ID\
    \ or an element itself as a parameter and perform some action on it.\n\nWe spend\
    \ a lot of hiding and showing nodes of a DOM tree. Error messages are invisible\
    \ until validation fails, for example, or trees collapsible nodes. Most of the\
