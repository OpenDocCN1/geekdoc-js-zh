    # The Real Rocket Science


    Okay, okay we admit—it isn’t easy to create something like Google Maps. The geocoding
    features behind the scenes that map addresses to locations on a map, that normalize
    maps features against satellite imagery to such an amazing degree that can be
    overlaid on top of each other and look relatively accurately, and the plotting
    of the routes from Point A to Point B is incredibly non-trivial.


    However, we maintain that it''s not the geocoding features of Google Maps that
    is particularly innovative or impressive. MapQuest and other software packages
    have been doing this kind of work for years. No, what''s impressive about Google
    Maps is the map interface on top of the geocoding engine. And that''s interface
    that we find easy, not the geocoding under the covers.


    As our good friend Glenn Vanderbilt says, though: "Technically it''s easy, but
    the conception of this interface is the really amazing part, just having the idea
    and realizing that it could be done. So many things are simple once you''ve seen
    they''re possible." The take home lesson is that Google Maps shows once you have
    conceived of your next great UI idea, you can take comfort in knowing that the
    technical solution to implementing it might not be so daunting.


    # The Map


    As you know, the map works by allowing you to interactively move the map by dragging
    the map itself using the mouse. We''ve seen mouse dragging in browsers for years,
    but the impressive bit is that the scrolling map is massive in size, can have
    the zoom level and so. How do they do that?


    Of course, the browser could never fit such a map in memory at once. For example,
    a street-level map of the entire world would probably be about a million pixels
    square. How much memory would it take to display that map? For the sake of conversation,
    let''s assume that the map is displayed with just 256 colors, meaning each pixel
    would consume just one of memory per pixel. Such a map would require 1,000,000,000,000
    bytes of memory, or roughly one thousand gigabytes of RAM. So, simply displaying
    an `<img>` element just isn''t


    ![](img/e950a16d093a2ad996943265f0f0b6cd_46_0.png)


    # Figure 4.1: Google Maps


    going to work.


    What the Googlers do work around the paltry amount of memory our desktop PCs have
    split up the map into various tiles. These tiles are laid out contiguously to
    form one cohesive image. An example of these tiles is shown in Figure 4.2, on
    the next page. While the size of these tiles has changed, the current size is
    250 pixels square.


    The tiles are all laid out within a single HTML div element, and this div element
    is contained within another div; we''ll call these two divs the inner and outer
    divs, respectively.


    We mentioned just a moment ago that the browser can''t fit the entire map in memory.
    Of course, dividing a single map into arbitrary number of tiles and then displaying
    all those at once would consume an equal amount of memory as the entire image.
    To compensate for memory limitations, Google Maps virtualizes the grid of tiles


    # More Than A Million Pixels


    We say in "The Map" section that a street-level map of the world would be about
    a million square pixels. Actually, that number''s wild underestimate. At Google''s
    highest level of magnification, a square mile consumes about 7,700,000 pixels.
    The Earth is estimated to contain 200,000,000 square miles, but only 30% of that
    is land, so let''s reduce the number to 60,000,000 square miles.


    Multiplying the number of pixels by the number of square miles in the Earth produces
    the mind boggling number of 462 million pixels, which at 16.7 million colors (the
    color depth of any modern home computer) would consume at least three times that
    amount of memory in bytes. Of course, most image viewing programs have some sort
    of paging memory subsystem that views a portion of the image at any one time,
    but you get the idea...


    ![](img/e950a16d093a2ad996943265f0f0b6cd_47_0.png)


    Figure 4.2: Google Maps Tiles


    in memory and only displays the set of tiles that the user can see, in addition
    to a few additional tiles outside of the viewing area to keep the scrolling smooth.


    If this whole grid virtualization mish-mash sounds a little complex, don''t worry,
    it''s fairly straight-forward, though it is the most complicated bit of the UI.


    # Zoom Level


    Another key feature of Google Maps is the ability to zoom in and out, enlarging
    or reducing the size of the map, letting you get a view of the entire world at
    one moment, and a view of your street the next. This is actually the simplest
    of the features to implement. Changing the zoom level changes the size of the
    tile grid in memory as well as the URLs of the tile images that are requested.


    For example, the URL to one of the tiles in the screen is `http://mt.google.com/mt?v=`.
    By changing the value of the last parameter, "zoom=3", to another value, such
    as "zoom=1", you can retrieve a tile at a different zoom level. In practice, it''s
    not quite simple because the grid coordinates change a great deal with each zoom
    level and they often become invalid.


    How do they get the zoom to constantly hover over the map in the map


