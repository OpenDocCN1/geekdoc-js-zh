    ## 与 PHP 使用 Ajax


    PHP 是许多 Web 开发者的真实选择。它是免费且开源的，这意味着它被广泛采用。对于那些使用它的人来说，他们发现这是一个非常实用的选择，拥有一个活跃的用户和开发者社区。事实上，这个社区非常强大，以至于该框架的可用扩展库非常庞大。如果你发现自己想要某个
    PHP 核心中没有的功能，请确保在跑去自己实现它之前，先在 Google 上搜索一下。很有可能 PHP 社区中的某人已经完成了这项工作。


    在 Ajax 和 PHP 的结合中也是如此。目前有几个基于 PHP 的框架，其质量和功能丰富程度各异。事实上，第一批 PHP 框架在“Ajax”一词诞生后的几天内就出现了。在本章中，我们将查看这些框架中最流行的，并再次重写
    Hector 的 CRM 应用程序。我们将专注于应用程序的服务器端。服务器端框架集成意味着我们可以利用服务器上现有的抽象来实现一组明确的客户端功能。我们之前讨论过的
    JavaScript 框架（Dojo、script.aculo.us 等）目前会被暂时搁置（对于 Dojo，我们将看看服务器端能为我们提供什么）。


    ### 9.1 PHP 框架


    回到 ?? 的第 ?? 页，我们讨论过 Ajax 支持已经在 JavaScript 框架中心位置得到了发布。这些框架都是为在客户端运行而编写的，在这种情况下意味着在浏览器内运行。服务器端开发框架面临着与客户端框架相同的创新压力。


    长期以来，我们的服务器端框架一直支持客户端技术。从从像 JSP、ASP 和 RHTML 这种基于模板的视图渲染技术，到具有自渲染能力的服务器端对象（如 ASP.NET）以及
    JS 组件，这些框架使用各种方法来影响客户端视图。现在，它们正在增加为客户端生成 JavaScript 的能力，以创建 Ajax 效果，有时用于连接到服务器实体进行数据传输。Ajax
    集成支持有三大类：视觉化工具支持、标签库和类似 ORB 的远程调用。


    ### 9.2 使用 Sajaj


    让我们回到 Hector 和他的 CRM 应用程序。他决定将他的团队迁移到一个开源平台，即 PHP。他相信团队通过使用集成的 Ajax 框架将获得更大的杠杆作用。这意味着团队可以在不离开
    PHP 范围的情况下添加这些新效果和回调。我们首先将应用程序迁移到 Sajax¹。


    ### 什么是 Sajax？


    Sajax 是最早的可用 Ajax Web 框架之一，最初为 PHP 编写。它是一个开源项目，允许你将 Web UI 绑定到服务器端函数。它通过导出客户端
    JavaScript 函数来实现这一点，这些函数调用 Sajax 桥接到实际执行的服务器端代码，并将所有内容封装在 XHR 请求中。


    Sajax 是一个类似 ORB 的远程层，这意味着我们首先可以编写需要的服务器端函数（包括与数据库以及返回正确的数据），然后将我们的 HTML UI 直接绑定到这些函数上。将找不到任何
    XMLHttpRequest 对象，你甚至可能会对我们运行的某些 JavaScript 调用感到惊讶，因为我们从 PHP 代码本身中看不到它们。


    开发社区对于这种对象远程调用策略存在一些分歧。一些开发者非常热衷


    > ¹http://www.modernmethod.com/sajax/


    # Sajax 语言支持


    Sajax 起于对 PHP 和 Coldfusion 的支持，现在也支持：


    - ASP

    - Coldfusion

    - Perl

    - PHP

    - Python

    - Ruby


    如果你没有看到你喜欢的语言，可能 Sajax 很快就会支持它。


    使用 Web (XML) 服务作为应用层之间通信的主要通道。根据你交流对象的不同，这可能意味着从 REST-ful、松耦合的基于 HTTP 的 XML 架构，一直到
    WSDL、SOAP 和 WS.* 的实现。它们的共同点是背离了对象（和方法）导向，转向了消息传输和面向服务的架构。


    另一方面，对象代理（Object brokers）完全是为了在不破坏对象开发人员心理模型的情况下，启用远程通信。你可以将客户端方法绑定到服务器端对象，就好像它们在物理上位于在一起一样，产生一种没有网络调用和往返分隔不同实体的错觉。虽然这是一个强大的抽象，但它仍然只是抽象。事实上，其中确实涉及网络往返，如果你查看发送的消息，它们与通过面向服务的框架发送的消息惊人地相似。


    Sajax 选择通过对象代理暴露其功能，因此对跨物理应用层的开发者的标准体验赋予了更高的价值。这在开发时可能提供更高的效率，但可能以牺牲运行时效率为代价。这是因为任何隐藏了架构底层远程特性的抽象都存在导致开发者忘记远程调用成本的风险。在使用此类框架时，开发者有责任记住远程调用的成本并据此进行编程。


