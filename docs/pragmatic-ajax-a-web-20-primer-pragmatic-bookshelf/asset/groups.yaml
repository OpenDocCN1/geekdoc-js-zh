    >\n    /* javascript code here */\n  </script>\n</head>\n<body>\n  // the web\
    \ page contents\n</body>\n</html>\n```\n\nActually, you can include `<script>`\
    \ elements anywhere in the web page; their contents will be executed in top-to-bottom\
    \ order. It is generally considered bad form to include them anywhere but in the\
