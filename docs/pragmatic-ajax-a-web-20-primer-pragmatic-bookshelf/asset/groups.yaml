- md: "\n```javascript\nreturn this;\n```\n\nDojo provides multiple pre-implemented\
    \ curves in the dojo.math.curves module. They range from the Simple Curve, as\
    \ shown above, to Bezier curves, circles, arcs, and more. The API is simple enough\
    \ to add your own implementations. Just make sure you remember your 9th grade\
    \ geometry. You simply provide an array of numbers, and the curve will be implemented\
    \ upon each element in the array, with the return value being an array of the\
    \ modified values.\n\nTo make the animation case to transition, you have to wire\
    \ up every of the animation to the properties of the element you want to animate.\
    \ Dojo's event library provides us this ability. To create our FadeOut animation,\
    \ we could use the following code:\n\n```javascript\nfunction fadeOut(nodename){\n\
    \  var node = document.getElementById(nodename);\n  var animation = new dojo.animation.Animation\
    \ (\n    new dojo.math.curves.Lin([100],[0]), // // linear progression from 100%\
    \ to 0\n    // 2 seconds\n    // not implemented, but must provide\n    dojo.connect(animation,\
    \ \"Animate\", function(e) {\n      node.style.opacity = e.x;\n    })\n  );\n\
    \  animation.play();\n}\n```\n\nWe start the animation ourselves after it has\
    \ been created. Then, as the animation progresses through the curve, retrieving\
    \ values, those values are sent to the event listener. In this case, onAnimate\
    \ is called for every frame in the animation, and it takes a special event argument\
    \ that provides information about the status of the animation, including current\
    \ values, percentage complete, designed end time, etc. Inside our anonymous listener\
    \ for onAnimate, we retrieve the current value of our linear progression from\
    \ 100 to 0, and use it as the value for the node's style.opacity property. This\
    \ causes the element to fade out over two seconds, as per our duration parameter\
    \ when we created the animation.\n\n# Effects\n\nDojo uses this animation system\
    \ to build its library of effects. Creating an effect is an exercise in calling\
    \ the appropriate method from the dojo.graphics.htmlEffects module. Each method\
    \ returns a reference to the Animation object; so you can append any you listeners\
    \ or modify the properties of the animation to suit your specific needs. To create\
    \ a fadeOut animation, for example you could use:\n\n```javascript\nvar node =\
    \ document.getElementById('some_element');\nvar fader = dojo.graphics.htmlEffects.fadeOut(node,\
    \ 2000);\nfader.play();\n```\n\nIf you want the element to be removed from the\
    \ page after fading all the out, you can utilize the optional third parameter\
    \ to include a callback function for the onEnd event.\n\n```javascript\nvar fader\
    \ = dojo.graphics.htmlEffects.fadeOut(\n  node,\n  2000,\n  function(e) {node.style.display\
    \ = 'none'};)\n);\n```\n\nThe effects currently provided by Dojo are:\n\n- fadeOut():\
    \ fades the opacity of the element from 100 to 0\n- fadeIn(): fades the opacity\
    \ of the element from 0 to 100\n- fadeHide(): fadeOut, but sets the display property\
    \ of the element to 'none' at the end\n- fadeShow(): fadeIn, but first guarantees\
    \ that the item is being displayed\n- slideTo(): moves an element to a given position\
    \ on the screen\n- slideBy(): moves an element a certain distance on the screen\n\
    - colorFadeIn(): uses a provided color as the starting point, fades to original\
    \ background color of the element. This effect is also called highlight (is officially\
    \ aliased that way)\n- colorFadeOut(): fades from the original background color\
    \ of the element to a provided color\n- wipeIn(): sets the height of the element\
    \ to 0, then grows it to the original size\n- wipeOut(): sets the height of the\
    \ element to its original size, then shrinks it to 0\n- explode(): takes a node\
    \ from to a node, expands the size from the node until it matches the node\n-\
    \ explodeFromBox(): takes a set of four starting coordinates and an end node,\
    \ grows the node from the starting coordinates to the end node position\n- implode():\
    \ takes a from node and a to node, shrinks the from node to fill the to node\n\
    - implodeToBox(): takes a from node and a set of target coordinates, shrinks the\
    \ node to the shape specified by the coordinates\n\n## 6.2 Conclusion\n\nIn this\
    \ chapter, we've exposed you to the basic UI elements of three different Ajax\
    \ libraries. While Script.aculo.us and Dojo seem to provide a lot of overlapping\
    \ effects, as you can see, the style of use is drastically different between the\
    \ two libraries. Which you end up choosing for your own projects is a matter of\
    \ both taste and need; Dojo provides a lot more in terms of functionality than\
    \ Script.aculo.us, and if you require those features, then it makes sense to work\
    \ with Dojo's effects as well. However, if you are less interested in those advanced\
    \ features and just want the effects, Script.aculo.us is a much lighter weight\
    \ alternative. It has lower overhead from a bandwidth and a learning perspective.\n\
    \nIn the next chapter, we'll use these libraries to re-implement our CRM application\
    \ with whizzy UI features. We'll show server-side validation, notification techniques,\
    \ progress indicators, and more. Additionally, we'll talk about what NOT to do\
    \ with Ajax. There are some big anti-patterns waiting for you out there; we'll\
    \ give you the heads up on how to keep your app clean.\n\n# Chapter 7\n\n# Ajax\
    \ UI, Part II\n\nIn the last chapter, we started with some of the available libraries.\
    \ Our intent is to give you a set of foundational tools for deciding how (and\
    \ when to) proceed. This chapter will present some anti-patterns, we'll talk about\
    \ what NOT ...do with Ajax. Ajax allows us to combine the two techniques for greater\
    \ usability. The problem with client-side is that the validation rule itself has\
