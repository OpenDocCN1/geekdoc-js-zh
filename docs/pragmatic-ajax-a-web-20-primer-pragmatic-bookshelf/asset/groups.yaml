- md: '

    # A TALE IN THREE ACTS


    It was to be provided by an entirely unlikely entity. What follows is the story
    of one development team, that spark, and how it changed the way we approach web
    software.


    ## 1.1 A Tale in Three Acts


    Hector is a project manager for a web application development shop. With a long
    history of Perl CGI, ASP, Servlet, and JSP development under his belt, Hector
    has been around the block. For the last year his team has been building a CRM
    application for a large Fortune 500 company with offices all over the world. The
    application used to be a green-screen mainframe application; the company wants
    to take advantage of the great reach of the Internet to deploy the application
    to every office.


    Hector and his team focus of their energy on the server side of the application.
    They have been using one of the modern MVC frameworks from the Java community
    to implement the business logic; a high-performance persistence framework to access
    the database; messaging-based infrastructure to connect to other systems.


    ### Yesterday


    On the client side, Hector and his team have become masters of CSS. The look of
    the pages bends to their will; when the customer wants rounded corners, they get
    rounded corners. Rollover colors? That''s easy. Multiple color schemes? No problem.
    In fact, Hector and his team had long ago reached a point where they weren''t
    really worried about the user interface. See, the web operates one way: it essentially
    distributes static documents. When users want more data, they incur complete interface
    refresh. It isn''t optimal from an efficiency perspective, but it''s how the web
    works and users have just learned to live with it.


    Then, sometime a couple of weeks ago, Hector''s customer came to a meeting. The
    customer was usually a polite, accommodating fellow. He understood the web, understood
    the restrictions he had to live with to get the reach of the Internet. In fact,
    Hector had never seen him get really angry. Until this meeting.


    As soon as he walked in, the team knew something was up. He had his laptop with
    him, and he never carried it. As he stormed into the room, the team glanced around
    the table: what have we done? The customer sat down at the table.


    ### Today


    Since that meeting, Hector and his team have been on fire to rethink the user
    interface. Hector went out to learn what was going on here, how Google could have
    completely ignored conventional wisdom and such a thing. He came across an article
    by Jesse Garrett describing this thing called Ajax. He’s been digging since, learning
    everything he can do about this new way of making Internet applications.


    The team has been re-implementing the UI. They’re using JavaScript and HTML5 techniques
    to provide a more dynamic experience. Most of all, they’ve begun taking advantage
    of a useful object available in modern browsers using XMLHttpRequest (XHR for
    short). This handy little guy lets Hector and his team request and receive fresh
    data from the server without reloading everything in the page.


    In other words, Hector has spearheaded a move from Web 1.0 to Web 2.0. And his
    customer is happy again.


    ### Tomorrow


    What comes next for Hector? His team is learning a bunch of JavaScript, and, even
    more about CSS than it ever knew before. The team is really excited about the
    results: the user experience is just like any other application, now except the
    team doesn’t have to manage an installer as well as the application itself. But
    they’ve realized that there’s a downside to it all.


    Now, they are writing a ton of code in JavaScript. It turns out that all this
    page manipulation and XHR access requires a lot of real, honest-to-goodness code.
    And even though JavaScript LOOK a lot like Java, they''ve discovered that it is
    really a different beast. And now they have two codebases to manage, test, and
    maintain.


    So Hector is to find out how to solve these problems. And what he will see is
    most web application development frameworks are fully incorporating Ajax tools
    into their own suites. Soon, Hector and his team will be able to leverage Tapestry
    components, Spring tag libraries, ASP.NET web helpers and PHP libraries to take
    advantage of Ajax without having to incorporate a second way of work. The near
    future of Ajax development is total, invisible integration. Which is exactly what
    Hector needs.


    ## 1.2 Google Maps: The Missing Spark


    Google Maps (http://maps.google.com) really ignited the Ajax fire. And Google
    was just the most unlikely candidate to do it. Think about what made Google an
    overnight success in the first place: best search results, and the world''s most
    minimal UI. It was a white page, with a text box and a button in the middle of
    it. It doesn''t get more minimal than that. If Google had a soundtrack, it would
    have been written by Philip Glass.


    When it became obvious that Google was going to enter the online map-paging space,
    we expected something similar. A more straightforward, intrusive approach to viewing
    maps. Which is what we got; what we just didn''t get is what we expected. Google,
    through the clever use of XHR callbacks, provided the first in-page scrollable
