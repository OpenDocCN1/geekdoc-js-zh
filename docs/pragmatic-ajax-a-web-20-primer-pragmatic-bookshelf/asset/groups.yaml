    Form offers three more UI relative methods:


    +   - disable(): disables every input field in the form (sets the background to
    gray and disallows changes)

    - enable(): enables every input field in the form

    - focusFirstElement(): sets the focus to the topmost field in the form


    These methods allow you to work with the entire form as a single entity. For example,
    it is a common pattern to display information to the user that they may wish to
    edit. Web developers have to decide between showing them the data as plain HTML,
    switching to a form view when the user chooses to edit, or just showing it them
    in the form view from the get go. With Form.enable and Form.disable, the decision
    is easier. You can display the data in a disabled form; when the user clicks the
    "Edit" button, simply enable the entire form.


    # Position


    Prototype contains several methods for understanding the current position of elements
    on a rendered page. Specifically, they allow you to discover the relative position
    on an element on a scrollable page, including whether or not the element is on
    the currently visible portion of the page. If, not, you can retrieve the scroll
    offsets (horizontal or vertical) to the element from the visible section. Most
    developers won''t use these features directly, but instead use frameworks that
    build on top of them to provide higher-level features (like Scriptaceous, for
    example).


    # Script.aculo.us


    Thomas Fuchs has built on top of the base Prototype library to dramatically increase
    the kind and effects that can be created with JavaScript. Script.aculo.us is the
    result of his efforts. Where Prototype is focused on extending the baseline capabilities
    of JavaScript and the DOM, Script.aculo.us allows web developers to make HTML
    look and act just like any other "rich client" platform. The kinds of effects
    range from simple hiding and showing tricks all the way up to drag-n-drop and
    sortability.'
- md: "\n# Effects\n\nThe library is divided between the five core effects and a series\
    \ of combination effects built on top of them. The core effects are: Opacity,\
    \ Highlight, MoveBy, Scale, and Parallel. Every effect represents a transition\
    \ between two states that occur over time. The effects have default values for\
    \ start and end points, as well as duration. These defaults can be overridden\
    \ for a fully customized effect. The various effects each have different required\
    \ parameters (for instance, MoveBy() requires x and deltas), and each can accept\
    \ any of the standard options as well. The general syntax for launching an Effect\
    \ is:\n\n```javascript\nnew Effect.EffectName(element, required-params, {options});\n\
    ```\n\nThe effects are all asynchronous which means if you launch several effects\
    \ simultaneously they will render simultaneously. This is true whether the effects\
    \ target different elements, or all target the same element. Quick-fired users\
    \ will not be surprised by browser lockups as your <div> turns yellow and balloons\
    \ up to twice their size, and you can fade out many deleted items from your list\
    \ as you desire at the time.\n\nThis section will examine all possible ways to\
    \ utilize the core effects from the library. In Chapter 7. Ajax UI, Part II, on\
    \ page 115, we'll show how to use them effectively to increase the usability of\
    \ the user interface. For all their cool factor, these kinds of effects can be\
    \ overused and become another <blink> tag, knowing why you would employ them is\
    \ just as important as knowing how.\n\nThe standard options you can pass to the\
    \ effects are:\n\n- duration: the number of seconds the transition will take (default\
    \ 1.0)\n- fps: target frames per second rate (default 25)\n- transition: an algorithm\
    \ for determining how to move from the starting point to the ending point. These\
    \ are represented as a series of, essentially, enumerated constants. One can be\
    \ of:\n  - sinusoidal: start slow, peak in the middle, slow down on the way out\n\
    \  - linear: constant speed from start to end\n  - reverse: constant speed, but\
    \ from end to end\n  - wobble: reverse direction several times during transition\n\
    - flicker: jump to random values during transition\n- pulse: progress from start\
    \ to end, back to start, back to end, repeat 5 times\n- from: starting point for\
    \ transition, between 0.0 and 1.0 (default 0.0). See the explanation that follows.\n\
    - to: ending point for transition, between 0.0 and 1.0 (default 1.0)\n- sync:\
    \ whether new frames should be rendered automatically (default true)\n\nThink\
    \ of and to percentages. If you are using the MoveBy() effect to move an element\
    \ 50px to the right and 50px down, then the starting (0.0) represents the original\
    \ positions, and the ending point (1.0) represents the original position +50px\
    \ in both directions. However, if you launch the effect using the following:\n\
    \n```javascript\nnew Effect.MoveBy('movable_element', 50, 50, 0.0, {from: 0.5});\n\
    ```\n\nthen the actual endpoint would be the original position plus 25px in both\
    \ directions, sync yours to: option requires the transition to end halfway through.\
    \ The transition point just determines which algorithm to use progress from the\
    \ form: value to the to: option value. Flicker, for example, uses the following\
    \ algorithm:\n\n```javascript\nreturn ((Math.cos(Math.PI)/4) + 0.75) + Math.random(0.25));\n\
    ```\n\nEffects allow you to bind callbacks to various stages in the transition\
    \ cycle. The callbacks are also asynchronous. The only caveat to this is that,\
    \ popping up a dialog box through alert or confirm will allow the effect to progress,\
    \ but its effects will be invisible until the user uses the dialog. That means\
    \ whatever state the transition is in when the dialog is closed will suddenly\
    \ appear. If the transition's duration has already passed by the time the user\
    \ closes the, the effect will have finished and the user will never have been\
    \ treated to your Ajax goodness.\n\n# Opacity\n\nThe Opacity() effect is straightforward.\
    \ You can transition between an opacity of 100% to 0%. There are no specific parameters\
    \ for the percentage opacity, you simply use the from and to options, using 1.0\
    \ as 100% opaque and 0.0 as 0%. If you get the element to 0 opaque (also known\
    \ as 100% transparent) you have not hidden the element in the sense that we explained\
    \ before with Element.hide()—it is simply invisible. Using the Prototype Element.show()\
    \ method will not make the element reappear: to that, you would need to readjust\
    \ the opacity to some above 0%. Likewise, a 0% opaque element is still taking\
    \ up space in the DOM layout.\n\nTo make an element fade quietly from sight over\
    \ two seconds, you could use:\n\n```javascript\nnew Effect.Opacity('some_element',\n\
    \  { duration: 2.0, from: 1.0, to: 0.0 });\n```\n\nIf you wanted the element to\
    \ go out like a lightbulb (flickering in and off finally going out), you would\
    \ use:\n\n```javascript\nnew Effect.Opacity('some_element',\n  { duration: 2.0,\n\
    \  from: 1.0, to: 0.0,\n  transition: Effect.Transitions.flicker); });\n```\n\n\
    To simply fade the element a few times to draw attention to it, you can fade it\
    \ in and out:\n\n```javascript\nnew Effect.Opacity('some_element',\n  { duration:\
    \ 1.0,\n  from: 1.0, to: 0.0,\n  transition: Effect.Transitions.pulse);\n```\n\
    \n# Movement\n\nEffect.MoveBy() provides easy control over repositioning elements.\
    \ The beauty of Effect.MoveBy() is that it doesn't require the element to have\
    \ in any particular styles already associated with it. Regardless whether it is\
    \ an inline or block element, or whether it is positioned absolutely or relatively,\
    \ it can be moved around with the same call to Effect.MoveBy(). You can even run\
    \ the element right off the right or bottom edge of the document, causing the\
    \ page itself to sprout scrollbars allow for the new position. Repositioning it\
    \ off the top or left borders, of course, removes it from sight without affecting\
    \ the overall position or size of the page.\n\nEffect.MoveBy() has two mandatory\
    \ parameters that must be specified in addition to the element name and options.\
    \ They are the X and Y offsets to calculate the new position. The offsets follow\
    \ a simple geometry: positive X means movement to the right, negative X means\
    \ movement to the left. Positive Y means down, negative Y is up. Therefore, to\
    \ raise an element 100 pixels while moving it to the right by 20, you could the\
    \ following:\n\n```javascript\nnew Effect.MoveBy('some_element', -100, 20);\n\
    ```\n\nTo shake the element in place to draw attention to it, but have it back\
    \ at its starting point:\n\n```javascript\nnew Effect.MoveBy('some_element',\n\
    \  0, -100,\n  { duration: 2.0,\n    transition: Effect.Transitions.pulse});\n\
    ```\n\nOne thing to watch out for: in the documentation at Script.js website,\
    \ as of version 1.0, the API for the call is misrepresented. The function itself\
    \ takes the offsets in the order Y, X, but the documentation lists them as X,\
    \ Y.\n\n# Size and Scale\n\nThe Effect.Scale() method allows you to affect the\
    \ overall size of an element. Sizing can be tricky; when the element is a container\
    \ for other elements, you have to know if you want the contents to scale as the\
    \ container. If the object is going to grow, should the new size anchored to the\
    \ upper left corner of the element, or to its center? What if the element has\
    \ parts that are only visible if you scroll to them? There are six Scale-specific\
    \ options you can use in the (options) part of the call, if necessary.\n\n- scaleX:\
    \ whether or not the element should scale horizontally (default true)\n- scaleY:\
    \ whether or not the element should scale vertically (default true)\n- scaleContent:\
    \ determines if the content of the element should scale along with the container\
    \ itself (default true)\n- scaleFromCenter: keeps the center of the object stationary\
    \ while expanding the four corners (default false)\n- scaleMode: a value of 'box'\
    \ means only scale those parts of the element that are reality visible on the\
    \ page without scrolling, while 'content' means everything (default 'box')\n-\
    \ scaleFrom: a starting percentage of actual size to scale from (default 100%)\n"
  mdcn: "\n\n# 效果\n\n该库分为五个核心效果以及构建在其之上的一系列组合效果。核心效果是：Opacity（透明度）、Highlight（高亮）、MoveBy（移动）、Scale（缩放）和Parallel（并行）。每个效果代表了随时间变化的两个状态之间的过渡。效果具有起点、终点持续时间的默认值。这些默认值可以覆盖以实现完全自定义的效果。各种效果各有不同的所需参数（例如，MoveBy()\
    \ 需要 x 和 delta），并且每个效果都可以接受任何标准选项。启动效果的通用语法为：\n\n```javascript\nnew Effect.EffectName(element,\
    \ required-params, {options});\n```\n\n效果都是异步的，这意味着如果你同时启动多个效果，它们将同时渲染。无论效果针对的是不同的元素还是针对同一个元素，情况都是如此。快速操作的用户不会对浏览器锁定感到惊讶，因为你的\
    \ `<div>` 会变成黄色并放大到原来的两倍，而且你可以根据需要淡出列表中许多已删除的项目。\n\n本节将探讨利用库中核心效果的所有可能方法。在第 7\
    \ 章“Ajax UI，第二部分”第 115 页，我们将展示如何有效地使用它们来提高用户界面的可用性。尽管这些效果很酷，但这类效果可能会被过度使用并变成另一个\
    \ `<blink>` 标签，因此知道为什么要使用它们与知道如何使用同样重要。\n\n你可以传递给效果的标准选项有：\n\n- duration: 过渡所需的秒数（默认值\
    \ 1.0）\n- fps: 目标每秒帧率（默认 25）\n- transition: 决定如何从起点移动到终点的算法。这些表示为一系列本质上是枚举的常量。可以是：\n\
    \  - sinusoidal（正弦波）：开始缓慢，在中间达到峰值，在移出时减速\n  - linear（线性）：从起点到终点匀速移动\n  - reverse（反转）：匀速移动，但是从终点到起点\n\
    \  - wobble（摇动）：在过渡期间反向几次方向\n- flicker（闪烁）：过渡期间跳转到随机值\n- pulse（脉冲）：从起点到终点，再回到起点，再回到终点，重复\
    \ 5 次\n- from: 过渡的起点，范围在 0.0 到 1.0 之间（默认 0.0）。见后文解释。\n- to: 过渡的终点，范围在 0.0 到 1.0\
    \ 之间（默认 1.0）\n- sync: 是否自动渲染新帧（默认 true）\n\n将 `from` 和 `to` 视为百分比。如果你使用 MoveBy()\
    \ 效果将元素向右移动 50px 并向下移动 50px，那么起点 (0.0) 代表原始位置，终点 (1.0) 代表原始位置两个方向各加50px。然而如果你使用以下方式启动效果：\n\
    \n```javascript\nnew Effect.MoveBy('movable_element', 50, 50, 0.0, {from: 0.5});\n\
    ```\n\n那么实际终点将是原始位置两个方向各加 25px，`sync` 选项要求过渡在中间结束。过渡点仅决定使用何种算法从 `from:` 值进度到 `to:`\
    \ 选项值。例如，`flicker` 使用以下算法：\n\n```javascript\nreturn ((Math.cos(Math.PI)/4) + 0.75)\
    \ + Math.random(0.25));\n```\n\n效果允许你将回调绑定到过渡周期中的各个阶段。回调也是异步的。唯一的例外是通过 alert 或\
    \ confirm 弹出对话框会让效果继续，但在用户使用对话框之前，其效果将是不可见的。这意味着当对话框关闭时，无论过渡处于什么状态，它都会突然出现。如果在用户关闭对话框时效果的持续时间已经过去，效果将已经完成，用户永远无法体验到你的\
    \ Ajax 魅力。\n\n# 透明度（Opacity）\n\nOpacity() 效果非常直观。你可以在 100% 透明度到 0% 透明度之间进行过渡。百分比透明度没有特定的参数，你只需要使用\
    \ `from` 和 `to` 选项，使用 1.0 作为 100% 透明，0.0 作为 0% 透明即可。如果你将元素设为 0 透明（也称为 100% 透明），你并没有像我们之前通过\
    \ `Element.hide()` 解释的那样隐藏元素——它只是不可见了。使用 `Prototype Element.show()` 方法不会让元素重新出现：要实现这一点，你需要将透明度重新调整为\
    \ 0% 以上。同样，0% 透明的元素在 DOM 布局中仍然占据空间。\n\n要让一个元素在两秒内静静地消失，你可以使用：\n\n```javascript\n\
    new Effect.Opacity('some_element',\n  { duration: 2.0, from: 1.0, to: 0.0 });\n\
    ```\n\n如果你想要元素像灯泡一样熄灭（闪烁后最终熄灭），你会使用：\n\n```javascript\nnew Effect.Opacity('some_element',\n\
    \  { duration: 2.0,\n  from: 1.0, to: 0.0,\n  transition: Effect.Transitions.flicker);\
    \ });\n```\n\n如果只是为了让元素淡入淡出几次以引起注意，你可以让它闪烁：\n\n```javascript\nnew Effect.Opacity('some_element',\n\
    \  { duration: 1.0,\n  from: 1.0, to: 0.0,\n  transition: Effect.Transitions.pulse);\n\
    ```\n\n# 移动（Movement）\n\nEffect.MoveBy() 为重新定位元素提供了简单的控制。Effect.MoveBy() 的妙之处在于它不需要元素已经关联了任何特定的样式。无论它是内联元素还是块元素，无论它是绝对定位还是相对定位，都可以通过相同的\
    \ Effect.MoveBy() 调用进行移动。你甚至可以将元素移动到文档的右边缘或底部边缘，导致页面本身产生滚动条以适应新位置。当然，将其移动到顶部或左侧边界之外会使其离开视线，而不影响页面的整体位置或大小。\n\
    \nEffect.MoveBy() 除了元素名称和选项外，两个两个指定的强制性参数。它们是计算新位置的 X 和 Y 偏移量。偏移遵循简单的几何逻辑：正 X\
    \ 表示向右移动，负 X 表示向左移动。正 Y 表示向下，负 Y 表示向上。因此，在将元素向右移动 20 像素的同时提高 100 像素，你可以执行：\n\n\
    ```javascript\nnew Effect.MoveBy('some_element', -100, 20);\n```\n\n让元素在原地抖动以引起注意，但让它回到起点：\n\
    \n```javascript\nnew Effect.MoveBy('some_element',\n  0, -100,\n  { duration:\
    \ 2.0,\n    transition: Effect.Transitions.pulse});\n```\n\n需要注意的是：在 Script.js\
    \ 网站的文档中，从 1.0 版本开始，调用的 API 描述有误。函数本身按 Y, X 的顺序接收偏移量，但文档将它们列为 X, Y。\n\n# 大小与缩放（Size\
    \ and Scale）\n\nEffect.Scale() 方法允许你影响元素的整体尺寸。尺寸调整可能是复杂的；当元素是其他元素的容器时，你必须知道是否想让内容随容器一起缩放。如果对象要增长，新尺寸应该是锚定在元素的左上角，还是在它的中心？如果元素具有只有在滚动到它们时才可见的部分怎么办？如果有必要，你可以在调用的\
    \ `(options)` 部分使用六个特定的缩放选项：\n\n- scaleX: 元素是否应该水平缩放（默认 true）\n- scaleY: 元素是否应该垂直缩放（默认\
    \ true）\n- scaleContent: 决定元素的内容是否随容器本身一起缩放（默认 true）\n- scaleFromCenter: 在扩展四个角角时保持物体中心固定（默认\
    \ false）\n- scaleMode: 值为 'box' 表示仅缩放页面上实际上无需滚动即可可见的元素部分，而 'content' 意味着所有部分（默认\
    \ 'box'）\n- scaleFrom: 从实际尺寸的起始百分比开始缩放（默认 100%）\n\n"
