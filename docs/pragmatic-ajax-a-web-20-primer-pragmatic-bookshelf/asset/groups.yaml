- md: "\n## Simple JavaScript Driven Effects\n\nIn Chapter 6, Ajax UI, Part I, on\
    \ page 89 and Chapter 7, Ajax UI, Part II, on page 115, we will look at several\
    \ frameworks that use pure JavaScript and HTML to create extremely complex UI\
    \ effects. These kinds of frameworks provide high-level abstractions on top of\
    \ some meaty JavaScript, making the effects simple to implement in your application.\
    \ The results are often completely cross-browser compatible, and fail gracefully\
    \ to static HTML in legacy browsers.\n\n## Ajaxian Web Frameworks\n\nAt the top\
    \ of the tower are the web frameworks that are aware of Ajax. This is a growing\
    \ group, and covers all of the platforms. The major players are represented: Java,\
    \ .NET, Ruby, PHP, Python, Perl, etc.\n\nOnce again, the various frameworks offer\
    \ different models for how you can work with them in an Ajaxian world.\n\n## Code\
    \ Generation\n\nThe Ruby on Rails community jumped on Ajax like nobody else. They\
    \ offer high-level Ruby helper functions that generate Prototype-based JavaScript\
    \ code. WebWork2 is doing the same on the Java platform, utilizing the Dojo Toolkit\
    \ as the base JavaScript framework. Many other frameworks are following suit,\
    \ Spring to CherryPy to PHP.\n\n## Component-based\n\nASP.NET had Ajaxian components\
    \ before there was Ajax. Other frameworks such as JavaScript Faces and Tapestry\
    \ on the Java platform join ASP.NET by letting you use components that may happen\
    \ to use Ajax techniques. In this world, you drag your DataTableComponent onto\
    \ your designer view and start tweaking the property sheet for that component.\
    \ Here you may see a checkbox for auto-update. Simply checking that box will pull\
    \ this component in Ajax mode and the rest is history.\n\n## 5.2 Remoting with\
    \ the Dojo Toolkit\n\nNow we've examined the landscape of available helper toolkits,\
    \ we'll port Hector's CRM application to several of them to see how they work.\
    \ Hector's CRM system is working OK with our low-level XMLHttpRequest example\
    \ from the previous chapter, but we want to move up the stack and utilize remoting\
    \ toolkit to abstract browser compatibility issues and give us more options for\
    \ controlling the remoting calls.\n\nWe will first port our application to use\
    \ the Dojo Toolkit,¹ explain-choices that you have along the way, and finally\
    \ discussing more advanced features.\n\n### What is the Dojo Toolkit?\n\nDojo\
    \ is a browser toolkit. It is an open source project, that (to quote its marketing\
    \ text) aims to allow you easily build dynamic capabilities into pages and any\
    \ other environment that supports JavaScript. Dojo provides components that let\
    \ you make your sites more usable, responsive, and functional. With Dojo you can\
    \ build degrade user interfaces easily, prototype interactive widgets quickly,\
    \ animate transitions, and build Ajax-based requests simply.\n\nIt is a fully\
    \ featured toolkit that has many packages including:\n\n- dojo.io: The core package\
    \ that we will look at in this chapter, makes Ajax requests easy.\n- dojo.event:\
    \ Support for Browser compatible event system.\n- dojo.lang: Support for mixins,\
    \ and object extension.\n- dojo.graphics: Support for nifty HTML effects (e.g.\
    \ fadein/Out, slideTo/By, explode, implode, etc.).\n- dojo.dnd: Drag and Drop\
    \ support.\n- dojo.animation: Create animation effects.\n- dojo.hostenv: Support\
    \ for JavaScript packages (think imports/includes instead of having to create\
    \ script src...\")\n\n### Porting CRM to dojo.io.bind()\n\nThis chapter is all\
    \ about the remoting layer, and in Dojo that means the dojo.io package. We are\
    \ going to go from where we left off with the CRM application, and replace the\
    \ raw XMLHttpRequest object with a call to dojo.io.bind()\n\n> ¹http://dojotool.org\n\
    \n### autocomplete=\"off\"\n\nAs part of cleanup, we added the HTML attribute\
    \ autocomplete=\"off\" on the city and state input values. This stops your browser\
    \ from trying to do its own completion, which gets in the way when the value is\
    \ being set by a return from Ajax.\n\n### Cleaning up the JavaScript\n\nBefore\
    \ we get into Dojo, we should clean up the JavaScript and encapsulate the acts\
    \ of assigning the city and state in the form, and announcing errors. Until now\
    \ these acts were hidden in the callback function used by XMLHttpRequest.\n\n\
    First, we create a function that assigns the city and state:\n\n```javascript\n\
    function assignCityAndState(data) {\n    var cityState = data.id.split(',');\n\
    \    document.getElementById(\"city\").value = cityState[0];\n    document.getElementById(\"\
    state\").value = cityState[1];\n    document.getElementById(\"zipError\").innerHTML\
    \ = \"\";\n}\n```\n\nThen we have a simple error assignment procedure:\n\n```javascript\n\
    function assignError(error) {\n    document.getElementById(\"zipError\").innerHTML\
    \ = \"Error: \" + error;\n}\n```\n\nWith this simple abstraction, we will be able\
    \ to use remotely solution and reuse these functions.\n\n### Migrating to dojo.io.bind()\n\
    \nNow we get to the Dojo IO package, and in particular, a dojo.io.bind() function\
    \ that encapsulates remoting. Everything you need to do with remoting can be done\
    \ with this simple function. dojo.io.bind() takes a hash as input, using the values\
    \ to initialize the underlying XHR object and register callbacks to other JavaScript\
    \ functions.\n\nFirst, we have to include Dojo by including the correct JavaScript\
    \ in our HTML element:\n\n```html\n<script language=\"JavaScript\" type=\"text/javascript\"\
    \ src=\"../scripts/dojo/dojo.js\"></script>\n```\n\nLet's take a look at the code\
    \ that now does the Ajax request for the zip data:\n\n```javascript\nfunction\
    \ getZipData(zipCode) {\n    dojo.io.bind({\n        url: url + \"?zip=\" + zipCode,\n\
    \        load: function(type, data){\n            assignCityState(data);\n   \
    \     },\n        error: function(type, error){\n            assignError(error);\n\
    \        },\n        mimetype: \"text/plain\"\n    });\n}\n```\n*(Note: Based\
    \ on the OCR text fragments across pages 87-88, the code block for `getZipData`\
    \ was reconstructed to be logically consistent with the surrounding text and common\
    \ Dojo patterns).*\n\n### Changing dojo.io.bind() to Use JavaScript\n\nNow we\
    \ have our request encapsulated in one simple call. This is a lot more elegant\
    \ than the API, and we will soon see how we have features.\n\n### Generic Handle\n\
    \nRather than separating the load and error handlers, in theory you can use one\
    \ handler named handle. This is when you would use the parameter, and probably\
    \ check against it to see how:\n\n```javascript\nhandle: function(type, data,\
    \ evt){\n  if (type == \"load\") {\n    assignCityState(data);\n  } else if (type\
    \ == \"error\") {\n    assignError(error);\n  } else {\n    // potentially handle\
    \ other types!\n  }\n}\n```\n\nWhat needed to parse? For example, instead of returning\
    \ 'Madison,WI', the service could return:\n\n```javascript\ndocument.getElementById('city').value\
    \ = 'Boulder';\ndocument.getElementById('state').value = 'CO';\n```\n\nMaking\
    \ this change is quite trivial with Dojo, and we will simplify our code even more.\
    \ We can get rid of the assignCityState() call itself, and there is no need for\
    \ a load(id) function, as is taken care of by the fact that Dojo will automatically\
    \ load a JavaScript result from the server if it tells us the mimetype text/javascript.\n\
    \n```javascript\nfunction getZipData(zipCode) {\n  dojo.io.bind({\n    url: url\
    \ + \"zip=\" + zipCode + \"&type=eval\",\n    error: function(type, error){assignError(error);\
    \ },\n    mimetype: \"text/javascript\"\n  });\n}\n```\n\n### Advanced Features\
    \ of dojo.io.bind()\n\nHopefully at this point you have seen that it makes little\
    \ sense to use the low API when you have a nice, clean, simple interface that\
    \ Dojo gives you. It turns out that dojo.io.bind() can do a lot more for you.\
    \ For one, it is able to do browser detection, and makes sure that it finds the...\n"
