    To be sure, we don''t always want to toggle. Element also exposes arguments, which
    each takes a variable number of elements as arguments, and ensures that each has
    its display property set correctly. Sometimes, toggling isn''t enough. Setting
    an element''s display property to ''none'' renders the rest of the page layout
    as though the element did not exist in the DOM. However, the mere existence of
    the element contained forms elements, for example, would be submitted to the action
    as though they were visible. The same is true for scripts that traverse the DOM
    elements or manipulate page layout.


    Instead of merely setting the div''s display property to ''none'', we can remove
    the div from the DOM tree entirely. Normally, this would mean navigating to the
    div''s parent node and removing the div from the parent''s child. The DOM specifies
    a removeChild method specifically for this purpose. The node is removed from the
    tree, and the entire tree rerendered to keep that block from influencing the flow.
    Furthermore, containing elements no longer have any knowledge of the node, and
    scripts will not be able to discover it. This is irreversible, unless you had
    cached a copy of the node in another variable and added it back manually later.
    Prototype exposes the removeChild() feature as a function called Element.remove().


    # Inserting Data


    Showing and hiding data is nice, but it implies that we have a nice container
    dedicated for displaying that piece of data. Showing an error message, for example,
    usually means that we have a hidden div or span standing to take data, then display
    it to the user. Often, though, what we want to add is more data to an existing
    element. Most commonly, we want to add items to an already-visible list of items.
    The standard HTML way to do this is to recreate a new version of the list items
    include the additions, then replace the contents of the list with the new version.
    With Ajax, this would mean having a server-side method which you call that sends
    the list back with any new items appended. While effective, this might be extremely
    long-running, and the code that generates the content of the list might, if it
    involved a database, mandates at least a round trip to the datastore to re-fill
    the list.'
  - "[PAGE 103]\n\nPrototype introduces the Insertion class. Insertion allows us to\
    \ add information to an existing container without replacing what currently exists\
    \ in the list. Insertion.Top() enters the new data at the beginning of the container,\
    \ while Insertion.Bottom() enters it at the end. This means you can easily append\
    \ single lines to a list without re-rendering the whole list.\n\n```\n<ul id=\"\
    mylist\">\n  <li>one</li>\n  <li>two</li>\n  <li>three</li>\n</ul>\n<input type=\"\
    text\" id=\"newval\"/>\n<input type=\"button\"\n  onclick=\"new Insertion.Bottom('mylist');\n\
    \    <li>${(newval)}</li>\";/>\n```\n\nKeep in mind that you have the full value\
    \ you want rendered. In the example, we are appending the text value of the input\
    \ field to the bottom of the list. We have to wrap it in the <li> tags in order\
    \ to get it to render as a list item; without those tags, the new value is just\
    \ pasted as text inside the list, which is rendered without the bullet, and as\
    \ inline text.\n\nPrototype actually goes a little further, and lets you append\
    \ text around the container as well. In all, Insertion offers four placements\
    \ for your new data: Before(), Bottom(), and After(). Figure 6.1, on the following\
    \ page demonstrates where each lives.\n\nThis is fairly powerful, since you can\
    \ modify a section of the page from which you do not have an ID (or there may\
    \ be no ID at all).\n\n# Forms\n\nWorking with forms has historically been a bit\
    \ of a drag. Forms are useful for one purpose: collecting data from a user. The\
    \ input fields that exist on a form, though varied in style, are essentially identical\
    \ in nature. They represent an item that a user can use to tell us something.\
    \ Before Ajax and the re-thinking of the DOM that it brought with, we had to treat\
    \ forms and inputs just like any other HTML elements, navigating the DOM to find\
    \ them, modifying their style properties to affect their behavior.\n\nPrototype\
    \ gives us to think about forms differently. Instead of representing a chunk of\
    \ HTML that happens to have input boxes embedded in it, Prototype encourages us\
    \ to think of forms as collections of data"
