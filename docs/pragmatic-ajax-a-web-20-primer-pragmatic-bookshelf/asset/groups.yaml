    ## Ajax: The Architecture


    The exciting evolution that is Ajax is in how you architect applications. Let''s
    look first at the conventional web:


    - Define a page for every event in the application: view items, purchase items,
    checkout, and so on.

    - Each event, or action, returns a full page back to the browser.

    - That page is rendered to the user.


    This seems natural to us now. It made sense at the beginning of the web, as the
    web wasn''t really about applications. The web started off as more of a document
    repository; a world in which you can simply link documents in an ad-hoc way. It
    was document and sharing, not interactivity in any meaningful sense.


    Picture a rich desktop application for a moment. Imagine what you would think
    if, on every click, all of the components on the application screen re-draw from
    scratch. It seems a little, doesn''t it? On the web, that was the world we inhabited
    until Ajax came along.


    Ajax enables a new architecture. The important parts of this architecture are:


    - Small Server Side Events: Now components in a web application can make small
    requests back to a server, get some information, and tweak the page that is viewed
    by changing the DOM. No full page refresh.

    - Asynchronous: Requests posted back to the server do not cause the browser to
    block. The user can continue to use other parts of the application, and the UI
    can be updated to alert the user that a request is taking place.

    - onAnything: We can talk back to a server based on almost anything the user does.
    Modern browsers trap most of the same user events that the operating system does:
    mouse clicks, mouse events, keypresses, etc. Any user event can trigger an asynchronous
    request.


