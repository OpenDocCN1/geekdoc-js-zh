- md: "\n## Figure 6.2: Elements before scaling\n\nScaling a container element is\
    \ tricky if you also want everything contained inside scale along with it. Graphical\
    \ sublelements scale automatically with the container except `<img>` tags. `<img>`\
    \ tags must be scaled independently by applying a Scale effect directly to the\
    \ tag. For textual contents, the font size in the HTML page must be specified\
    \ in em units in order for scaling to work. Unfortunately, em isn't the default\
    \ sizing unit for text in most browsers, unless you explicitly apply a style to\
    \ your work that sets it to em units, Effect.Scale() will ignore the text and\
    \ scale the rest of the container around it.\n\nFigure 6.2 shows a `<div>` with\
    \ a contained `<div>` and some text in its original state.\n\n```html\n<div id=\"\
    window\" style=\"border: solid 1px black;\">\n<div id=\"windowbar\" style=\"background-color:\
    \ red; color: white;\">\nWindow title\nContent body.\n</div></div>\n```\n\nIf\
    \ you run a simple scale against this element, the container elements will scale\
    \ but not the text. This call doubles the size of the elements, as shown in Figure\
    \ 6.3, on the next page.\n\n```javascript\nnew Effect.Scale('window', 200);\n\
    ```\n\n## AJAX AND JAVASCRIPT FOR THE UI 107\n\n![](img/e950a16d093a2ad996943265f0f0b6cd_112_0.png)\n\
    \nFigure 6.3: Elements after simple scaling\n\nIn order to get the text to scale\
    \ along with the graphics, we'd need to apply a style to the original elements\
    \ to set the text to em units. Unfortunately, em units are not the standard in\
    \ any browser. If you don't size your text specifically using styles based on\
    \ em units, scaled elements will look horrible by default.\n\n```html\n<div id=\"\
    window\" style=\"border: solid 1px black; font-size:1.0em;\">\n<div id=\"windowbar\"\
    \ style=\"background-color: red; color: white;\">\nWindow title\n</div>\nContent\
    \ body.\n</div>\n```\n\nApplying the same scaling as before, we'd now get the\
    \ result shown in Figure 6.4, on the following page.\n\n## Highlight\n\nPopularized\
    \ by the venerable Yellow Fade Technique (or YFT, as it is more popularly known),\
    \ this effect simply transitions the background color of an element from a start\
    \ color to an end color by moving through the spectrum between them. The original\
    \ YFT resets the background color to a buttery yellow and fades back to white.\
    \ The effect brings the eye to an element where a change has occurred, but then\
    \ leaves the page in a pristine state after the transitions has completed.\n\n\
    ![](img/e950a16d093a2ad996943265f0f0b6cd_113_0.png)\n\nFigure 6.4: Scaling text\n\
    \nTo enable this, Effect.Highlight() has three effect-specific options you can\
    \ use:\n\n- startcolor: instantly changes background color of element to the start\
    \ of the effect\n- endcolor: target end color to transition to\n- restorecolor:\
    \ sets the background color to this after transition has completed\n\nThe animation\
    \ transitions between startcolor, and endcolor, and then the element is set to\
    \ restorecolor. The three color options only accept hexadecimal color values as\
    \ strings. The hex values can optionally start with '#'. You cannot use standardized\
    \ color descriptors such as 'red' and 'khaki' or short hex values such as 'f00'.\
    \ For examples.\n\n```javascript\n// simple Yellow Fade Technique\nnew Effect.Highlight('some_element');\n\
    // fade from red to blue, back to white\nnew Effect.Highlight({\n  startcolor:\
    \ '#ff0000',\n  endcolor: '#0000ff',\n  restorecolor: '#ffffff'\n});\n```\n\n\
    ## Parallel Effects\n\nThese four core effects are all very powerful by themselves.\
    \ Since they are asynchronous, you can apply multiple effects simultaneously to\
    \ get combined effects. Instead of having to wire up the combined effects yourself,\
    \ Script.aculo.us supplies the Parallel() effect that takes care of it. Instead\
    \ of supplying an element to Effect.Parallel(), you provide any of other Effects.\
    \ They don't necessarily have to all target the same element. Effect.Parallel()\
    \ will kill all the child effects simultaneously. You could, for example, use\
    \ Effect.Parallel to combine the Yellow Fade Technique and a pulsating Scale effect\
    \ to draw attention to something.\n\n```javascript\nnew Effect.Highlight('window',\
    \ { sync: true });\nnew Effect.Scale('window', 200,\n  sync: true,\n  transition:\
    \ Effect.Transitions.pulse\n},\nduration: 2.0);\n```\n\n## Combination Effects\n\
    \nLuckily, Script.aculo.us already provides a wide variety of combination effects\
    \ using Effect.Parallel and the four core effects. Once again proving you can\
    \ build great complexity from a simple building blocks, the range of available\
    \ effects is impressive. Using the effects is no more complicated than using the\
    \ core effects, either. The following is the list of combination effects available\
    \ as version 1.0.\n\n- Effect.Appear(): sets the opacity of the element to 0,\
    \ fades it up to 100, and ensures that it is visible if it was hidden\n- Effect.Fade():\
    \ sets the opacity of the element to 100, fades it to 0, then hits it at the end\n\
    - Effect.Puff(): combines Scale and Opacity, growing the element to 200% while\
    \ fading it out, hiding it at the\n- Effect.BlindUp(): sets the opacity of the\
    \ element to 0, fades it up to 100, and ensures that it is visible if it was hidden\n\
    - Effect.BlindDown(): sets the opacity of the element to 100, fades it to 0, then\
    \ hits it at the end\n- Effect.SwitchOff(): combines Scale and Opacity, growing\
    \ the element to 200% while fading it out, hiding it at the\n- Effect.SlideUp():\
    \ sets the opacity of the element to 0, fades it up to 100, and ensures that it\
    \ is visible if it was hidden\n- Effect.SlideDown(): sets the opacity of the element\
    \ to 100, fades it to 0, then hits it at the end\n- Effect.DropOut(): combines\
    \ Scale and Opacity, growing the element to 200% while fading it out, hiding it\
    \ at the\n- Effect.GrowUp(): sets the opacity of the element to 0, fades it up\
    \ to 100, and ensures that it is visible if it was hidden\n- Effect.GrowDown():\
    \ sets the opacity of the element to 100, fades it to 0, then hits it at the end\n\
    - Effect.Squish(): combines Scale and Opacity, growing the element to 200% while\
    \ fading it out, hiding it at the\n- Effect.Pulsate(): sets the opacity of the\
    \ element to 0, fades it up to 100, and ensures that it is visible if it was hidden\n\
    - Effect.Shake(): sets the opacity of the element to 100, fades it to 0, then\
    \ hits it at the end\n- Effect.Fold(): combines Scale and Opacity, growing the\
    \ element to 200% while fading it out, hiding it at the\n- Effect.Blink(): sets\
    \ the opacity of the element to 0, fades it up to 100, and ensures that it is\
    \ visible if it was hidden\n- Effect.Flick(): sets the opacity of the element\
    \ to 100, fades it to 0, then hits it at the end\n- Effect.Fading(): combines\
    \ Scale and Opacity, growing the element to 200% while fading it out, hiding it\
    \ at the\n\n## Advanced Techniques\n\nScript.aculo.us also provides more advanced\
    \ techniques, such as Drag and Drop. We'll examine these in the next chapter.\n\
    \n## Dojo\n\nDojo is a different kind of animal than Prototype.aculo.us. Whereas\
    \ those libraries are smaller, and focused on UI, Dojo is an entire platform for\
    \ building client applications. Dojo includes XHR support, widgets and utilities,\
    \ a logging module, a math module, and lots more. As we demonstrated in the previous\
    \ chapter, the\n\n## AJAX and JavaScript for the UI 111\n\nof Dojo is the IO libraries\
    \ and the eventing system. We won't cover that ground again. Instead, we'll introduce\
    \ you to the idea of Animations in Dojo, and take a look at how they are used\
    \ to create\n\n## Animations\n\nA Dojo animation is an object that defines the\
    \ parameters of a transition between two states. The states can be anything: opacity\
    \ levels, position, color. The animation isn't concerned with the states, only\
    \ the properties of the transition. When you create an animation, you supply four\
    \ parameters:\n\n- curve: a representation of an algorithm for returning values\
    \ between 0 and 1. Like in Script.aculo.us, this value will be used as a multiplier\
    \ against the current state, for creating frames of the animation.\n- duration:\
    \ number of milliseconds the animation will take.\n- acceleration: whether the\
    \ animation is accelerating or decelerating (not implemented at time of writing)\n\
    - repeat: number of times to repeat the animation (-1 means loop forever)\n\n\
    A curve is just an object that exposes a method, `getValue(n)`, where n is a number\
    \ between 0 and 1. The return value is an array of numbers that can be used to\
    \ calculate current state. For example, you could create a linear curve to move\
    \ from [0,0] to [100,100], tracing a line through a Cartesian plane that creates\
    \ a 45 degree angle. Or, you could create an arc curve to move from [255,0] to\
    \ [0,255], thereby providing a transition from red to blue. The Wiki for Dojo\
    \ offers the following example of a curve implementation, representing a linear\
    \ transition value.\n\n```javascript\nfunction Line(start, end) {\n  this.start\
    \ = start;\n  this.end = end;\n  this.dimensions = start.length;\n  //simple function\
    \ to find point on an n-dimensional, straight line\n  this.getValue = function(n)\
    \ {\n    var retVal = new Array(this.dimensions);\n    for(var i=0; i<this.dimensions;\
