  mdcn: "\n\n## Sajax 也可以这样工作\n\n在此时，Sajax 也可以与这段代码配合。让它运行的一种简单方法是创建一个包装函数，并像这样使用它：\n\
    \n```php\nfunction get_city_state($zip) {\n    return ZipService::get_city_state($zip);\n\
    }\n```\n\n不过很快我们将为 XOAD 修改更多类结构，它将不再适用于 Sajax。\n\n## 从过程化到面向对象 (OO)\n\nXOAD 与\
    \ Sajax 相似之处在于，它也使用基于 AJAX 的远程调用模型，你可以将 JavaScript 层绑定到服务器端代码。你可能会认为我们能够直接使用已经为\
    \ Sajax 创建的 Zip Service。但事实并非如此，因为 XOAD 重视类和面向对象编程（OO）。我们不会只导出方法，而是提供 XOAD 对象和类。这意味着我们需要将\
    \ Zip Service 改为一个类。\n\n## 修改后端\n\n我们可以用一种稍微巧妙的方式来实现。我们将 `get_city_state()` 函数和\
    \ `bool()` 提取出来，使它们成为 zip service 类中的静态方法。我们将代码封装在 `class ZipService { ... }`\
    \ 中，通过在定义之前添加 `static` 关键字来使函数变为静态（因此变为 `static function get_city_state($zip)\
    \ {...}`）。\n\nXOAD 在后端需要做的修改是向类添加元数据，用于描述什么应该被导出。这些元数据通过 zip service 的简单实例方法添加：\n\
    \n```php\nfunction naxajGetMeta() {\n    NAJAX_Client::mapMethods($this, array('get_city_state'));\n\
    \    NAJAX_Client::publicMethods($this, array('get_city_state'));\n}\n```\n\n\
    对于导出内容，你有一些选择。在示例中，我们提供了想要导出的方法映射，并将访问分配给公共方法。你可以通过 `XOAD_Client::privateMethods()`\
    \ 访问私有方法，并通过 `XOAD_Client::privateVariables()` 和 `XOAD_Client::publicVariables()`\
    \ 直接访问变量。任何面向对象纯主义者都会告诉你，这样做违反了封装原则：主要是，私有成员和数据字段应该只允许定义类或特定的受信任的实体访问。因此，在使用这些方法时要小心，并确保你获取的是实际所需的功能。\n\
    \n## 回到前端\n\n我们像处理 Sajax 一样从客户端开始。我们加载所有需要的内容，并定义所有 XOAD 的基础目录。在这种情况下，我们使用一个名为\
    \ 'najax' 的子目录。\n\n```php\ndefine('NAJAX_BASE', 'najax');\nrequire_once('/najax/najax.php');\n\
    require_once('/zipService.najax.php');\nNAJAX_Server::allowClasses('ZipService');\n\
    if (NAJAX_Server::runServer()) {\n    exit;\n}\n```\n\n我们还将注册想要远程调用的类。这在技术上并不是必须，但被认为是一种礼貌的做法。XOAD\
    \ 保留了两个充满类的哈希表，一个用于允许类，另一个用于拒绝类。在拒绝类上调用方法会导致错误；对允许或未分配方法的调用将继续。然而，为了符合建议的用法，我们将通过\
    \ `XOAD_Server::allowClasses()` 注册 ZipServer 类。\n\nXOAD 设置 XHR 请求返回到同一个 PHP 服务器，这意味着我们的\
    \ PHP 页面以两种模式被访问：一种是显示页面，另一种是访问回调函数。`XOAD_Server::runServer()` 中的检查是为了处理 XHR 请求；如果请求不是\
    \ XHR 回调，它会立即返回 `false`。否则，该方法将根据请求参数触发绑定的服务器方法并返回结果。\n\n我们再次快速完成了 PHP 头部代码，进入了\
    \ HTML 本身。我们需要包含所有的 XOAD 辅助 JavaScript 代码，这是在 HTML `head` 元素的顶部完成的：\n\n```php\n\
    <?= NAJAX_Utilities::header('najax') ?>\n```\n\n## XOAD 序列化器\n\n此时，XOAD 使用一个序列化对象以便在两个世界之间转换。我们在\
    \ PHP 5.1 上运行时发现了一个问题，并且不得不更改 `Serializer.class.php`，使函数 `serialize(&var)` 变为\
    \ `serialize($var)`。PHP 5 对处理引用传递语义有不同的规则（即我们删除了符号 `&`）。我们收到的错误是：\n\n```\nPHP\
    \ Fatal error: Only variables can be passed by reference in /path/to/najax/classes/Seria\n\
    ```\n\n我们提到过 XOAD 的核心是类和对象，而不仅仅是函数。要注册一个类并在 JavaScript 中访问它，你只需要另一个助手：\n\n```javascript\n\
    var obj = NAJAX_Client::register(new ZipService());\n```\n\n我们正在从服务器注册一个匿名对象，但你也可以像内联列表一样注册匿名项目。你只需执行如下操作：\n\
    \n```javascript\nvar arr = XOAD_Client::register(1, \"bob\", array(\"nested\"\
    ));\n```\n\n为了处理发生的错误，你遵循一种命名约定，该约定允许你对调用的每个方法拥有处理器。在 `obj.on(Name of method)Error()`\
    \ 格式中，方法的第一个字符是：\n\n```javascript\nobj.on(Name of method)Error(), function() {\n\
    \    // ...\n```\n\n```php\n<?= NAJAX_Utilities::header('najax') ?>\n```\n\n```javascript\n\
    obj.on(Name of method)Error(), function() {\n    // ...\n```\n\n*(注：原文后续部分存在大量重复和\
    \ OCR 错误，译文已根据核心逻辑进行了清理)*\n\n"
