    \ we need to figure out `getVisibleTiles()` is the position of the inner div relative\
    \ to the outer div. This is fairly easily:\n\n```javascript\nfunction getVisibleTiles()\
    \ {\n  var innerDiv = document.getElementById(\"innerDiv\");\n  var mapX = stripPx(innerDiv.style.left);\n\
    \  var mapY = stripPx(innerDiv.style.top);\n}\n```\n\nThe `stripPx()` function,\
