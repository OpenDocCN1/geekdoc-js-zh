    \ manner. We are going to take the get_city_state() functions and bool() to make\
    \ them static methods in a zip service class. We wrap the code in class ZipService\
    \ { ... }, and we make the functions static by adding the static keyword before\
    \ their definitions (so we have static function get_city_state($zip) {...}).\n\
    \nThe one we need to make to the back end for XOAD is the addition of metadata\
    \ to the class that describes what should be exported. This metadata gets added\
    \ via a simple instance method on the zip service:\n\n```php\nfunction naxajGetMeta()\
    \ {\n    NAJAX_Client::mapMethods($this, array('get_city_state'));\n    NAJAX_Client::publicMethods($this,\
