  - "[PAGE 101]\n\n# AJAX and JavaScript for The UI\n\nA final case is when you want\
    \ to eliminate the tags altogether. Imagine a div that contains a bibliography\
    \ entry, rendered so that the title of the book is underlined and the author's\
    \ name is boldfaced. You want to retrieve that as data; any embedded style notation\
    \ (or, `<b>` tags) are extraneous. String now has the strip-tags() method which\
    \ eliminates any angle brackets (and what's inside them) from the output. Whitespace\
    \ is otherwise maintained, allowing you to treat HTML as raw data.\n\n# Element\n\
    \nPrototype introduces a new class, Element, that controls some basic styling\
    \ properties of a DOM node. Element is a static class, in that you need not create\
    \ an instance of it to access its functionality. Its various methods all take\
    \ an element ID or an element itself as a parameter and perform some action on\
    \ it.\n\nWe spend a lot of hiding and showing nodes of a DOM tree. Error messages\
    \ are invisible until validation fails, for example, or trees collapsible nodes.\
    \ Most of the dynamic nature of a web page is wrapped in the mysterious appearance\
    \ and disappearance of blocks of data. The standard JavaScript strategy for accomplishing\
    \ that uses the `element.display` property.\n\n```\n<div id=\"hideOrShow\">\n\
    \  You can turn me on and off.\n</div>\n<input type=\"button\" value=\"Toggle\"\
    \ onclick=\"toggle('hideOrShow');\" />\n```\n\n```\n<script type=\"javascript/javascript\"\
    >\nfunction toggle(elemName) {\n  var elem = document.getElementById(elemName);\n\
    \  if(elem.style.display=='none') elem.style.display = '';\n  else elem.style.display\
    \ = 'none';\n}\n</script>\n```\n\nElement provides the toggle command which accomplishes\
    \ the exact thing, but with the added benefit of being able to pass in as many\
    \ element names (or elements) as you like to a single call. Toggle will iterate\
    \ over all the arguments, toggling the state of each in turn. This provides a\
    \ convenient way to swap visibility of elements.\n\n```\n<div id=\"up\">\n  <img\
    \ src=\"images/up.gif\"/>Up\n</div>\n<div id=\"down\" style=\"display:none\">\n\
