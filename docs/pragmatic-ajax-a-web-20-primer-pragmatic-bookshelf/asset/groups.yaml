    The vehicles for this change are the new classes Form and Field. Field provides
    three major UI-related methods:


    +   * select(): selects the current value of the field

    * focus(): moves the focus to the field

    * activate(): a combination of select() and focus()


    For example, you could create a form with certain fields visible at all times,
    but a second set of advanced options only visible when the user requests them.
    For convenience, you would want the user to begin typing into the topmost field
    immediately upon making visible, which you could accomplish with activate.


