    # Chapter 4


    # Creating Google Maps


    For many of us, Google Maps (http://maps.google.com) ignited the Ajax revolution.
    While ajaxian techniques were creeping into mainstream websites before Google
    Maps, nothing in recent memory presented commodity browsers with such a visually
    impressive experience. Google Maps showed the world that a wide world of potential
    lay hidden in the technologies we thought we understood well.


    The purpose of this chapter is to lay bare the techniques that Google used to
    wow us all with Google Maps. What we''ll discover here is fascinating and important;
    it also might be more than you want to bite off right now. If so, don''t worry
    about skipping ahead to the rest of the book and coming back later here; we won''t
    mind.


    # 4.1 Rocket Scientists?


    Shortly after Google Maps launched, entrenched commercial interests who relied
    upon the staness of standard HTML-based web interfaces to make money quick to
    claim that mainstream HTML developers need not attempt to create web interfaces
    like Google Maps. The CEO of Macromedia, maker of the popular Flash browser plug-in,
    stated in least one interview that such non-Flash web interfaces required the
    skills of “rocket scientists.” (Ironically, when Macromedia finally produced a
    clone of Google Maps in Flash four or five months later, it failed to function
    on the two Mac laptops to try it out—actually locking up the browser. Google Maps
    works fine on both machines. We''re actually not anti-Flash; we just found it
    ironic, that''s all.)


    Such statements have added to the general impression many developers are that
    creating something like Google Maps is just, well, hard.'
  - '[PAGE 44]


    In fact, some developers have even felt a little fear and intimidation—fear that
    someday soon, they''ll be asked to create something like Google Maps!


    Certainly many of us who have been writing HTML for years might like to believe
    that it took a team of rocket scientists to produce a litany of innovations supporting
    the technologies behind the Google Maps interface, if not enough to provide an
    excuse as to why we haven''t been writing apps like all this time. However, we
    believe all this about rocket science and intimidation is a bit exaggerated.


    In fact, after spending ten minutes examining Google Maps a bit deeper, we realized
    that, far from the product of rocket scientists, the Google Maps interface is
    actually fairly straight-forward to implement. Perhaps, some might say, easy.
    Not “same-amount-of-effort-as-a-PHP-web-form,” but we were able to implement something
    a great deal like it in about two hours. Not just two hours; you two hours spent
    in a crowded convention center during a technical conference whilst interrupted
    by our friends every minutes.


    So while there''s no doubt Google has recently hired some of the most visible
    computer scientists—perhaps the closest examples of “rocket scientist”—like brainpower
    in our industry, like Adam Bosworth (famed Microsoft innovator), and Vert Cer
    (famed Internet innovator)—we’re pretty sure they weren''t involved in the creation
    of the Google Maps interface. The reality is if we can create an interface like
    Google Maps in a couple of hours, imagine what a few capable web developers could
    do in a few weeks or a month.


    # 4.2 Your Own Google Maps


    In fact, we''ll spare you from putting your imagination to the test. Let us show
    you first-hand how you can create your own version of Google Maps. In the next
    few pages, we''ll walk you through the creation of “Ajaxian Maps,” our own derivative
    of the big GM. We''ll start out by explaining how the Google Maps user interface
    works.


    # Google Maps Deconstructed


    We’re going to break down the elements of Google Maps by one one. Let’s start
    out with the most dramatic feature: the big scrolling maps, the heart of the application.'
