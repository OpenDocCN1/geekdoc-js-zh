    应用与之前相同的缩放，我们现在将获得如下一页图 6.4 所示的结果。\n\n## 高亮\n\n该效果由备受推崇的黄色渐变技术（或更广为人知的 YFT）普及，它通过通过两种颜色之间的光谱，将元素的背景颜色从起始颜色过渡到结束颜色。原始的\
