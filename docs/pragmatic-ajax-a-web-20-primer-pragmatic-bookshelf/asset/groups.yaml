    \n**译文：**\n\n[content]\n\n## 4.4 结论\n\n在本章中展示的 AJAX Maps 代码与我们最初在两个小时内编写的草草率之版本相比并没有太大变化。我们又花了两个小时时间来完善细节、修复了几个\
    \ bug，并为 Internet Explorer 6.0 引入了兼容性更改（这涉及到我们刚刚讨论过的两个微小的透明度问题）。\n\n想象一下，如果你有两三名全职开发者投入其中几个月，这段代码可以被提升到什么种程度！无疑，Google\
    \ Maps 中剩余的所有界面功能都能在那段时间内被轻松实现。\n\n请自由使用本章的代码为你自己的项目实现自定义 Google Maps 界面，这最终可以泛化为一种解决方案，适用于任何你需要显示内存可以容纳的更大图像的场景，并允许注释显示在图像上方。\n\
    \n当下次有人再告诉你 Ajax 很难时？告诉他们你比他们懂。\n\n## 第 5 章\n\n## Ajax 框架\n\n到目前为止，我们要么从抽象的架构层面来看\
    \ Ajax，要么从结构下方的隧道内部来看它。DOM API 和 JavaScript 与其之间有时痛苦的交互构成了所有其他 Ajax 技巧的基础。虽然在遇到问题时理解这些内容至关重要，但你可能经常会感到困惑。也许你曾想过，是谁决定对所有就绪值使用魔术数字的？或者为什么行业标准的创建\
    \ XHR 实例的方法放在一个 `try/catch` 块中，而这个块在约 70% 的时间内会遇到异常。事实上，如果你和我们一样，你可能想过可以为这些东西写一个相当简单的包装器（wrapper），以便它们在生产代码中更易用。这些包装器非常常见；网上到处都是它们的遗骸。\n\
    \n少数库包装器幸存并繁荣发展，变成了全功能的工具包。它们为我们提供了更好的杠杆，来利用 Ajax 技术创建真实的应用程序。在本章中，我们将查看我们可以使用的几个此类框架，并使用最成熟、最流行的版本重写\
    \ Hector 的 CRM 应用。\n\n### 5.1 框架、工具包和库\n\n随着 Ajax 的兴起，我们被大量声称支持 Ajax 的项目。然而，由于该术语本身在大脑中具有如此广泛的含义，往往很难确切知道这意味着什么。该网站是否对服务器执行异步回调？它是否在页面内重新渲染新鲜数据？还是说它仅仅是操纵现有\
    \ DOM 节点的属性？\n\n图 5.1：Ajax 框架的层级\n\n图 5.1 阐明了 Ajax 本身的不同层。\n\n### 远程工具包\n\nAjax\
    \ 辅助工具的最低级是远程工具包。在 XMLHttpRequest 对象广泛采用之前，许多 Web 应用使用隐藏的 `iframe` 来完成与服务器的页面往返。`iframe`\
    \ 就像普通的 HTML 框架（一个可以指向 URL 并渲染结果的容器），不同的是它嵌入另一个页面中。这些应用程序只是创建一个 0px 的 `iframe`，这导致它再次刷新给定的\
    \ URL，以便从服务器拉回更多数据。\n\n虽然这种技术是有效的且适用于许多人，但存在两个固有问题。第一个是，如果你想要异步请求，就必须使用 `iframe`。第二个是很难管理页面的状态。第三个是很难优雅地处理错误。\n\
    \n### 工具包资源\n\n- Dojo\n- Prototype\n- DWR\n- Backbase\n- SmartClient\n- Ajax.NET\n\
    - SAJAX\n- JSON-RPC\n\n### UI 组件\n\n如 Dojo 之类的工具包为我们提供了树形、标签页或菜单等组件。这些是自包含的。\n\
    \n### Web 应用工具包\n\n如 SmartClient 之类的工具包旨在让应用程序看起来和感觉与 Windows 或 Mac 上的原生应用程序相同。结果仍然是\
    \ HTML。\n\n### 基于标记的\n\nBackbase 允许你通过标记 API 添加丰富的组件。你传统的 HTML 变成类似下面的内容：\n\n\
    ```html\n<cmp bbase=\"true\" style=\"display:none\" xmlns=\"http://www.backbase.com/site/nav\"\
    >\n  <s:event b:on=\"construct\" b:action=\"show\">\n    <!-- 永远不显示 - 这里 -->\n\
