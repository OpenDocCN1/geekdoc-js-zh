    In the world of HTTP, browsers communicate with servers using (typically) either
    GET or POST requests. A GET request is generated whenever you click on a hyperlink;
    the idea is that it *gets* the page. A POST request is sent when you hit the submit
    button on an HTML form. It *posts* the data from that form back to the application
    for processing.


