    - Effect.Flick()：将元素的透明度设置为 100，淡出到 0\n- Effect.Fading()：结合 `Scale` 和 `Opacity`，将元素缩放至\
    \ 200% 的同时淡出\n\n## 高级技术\n\nScript.aculo.us 还提供了更高级的技术，例如拖放（Drag and Drop）。我们将在下一章检查这些。\n\
