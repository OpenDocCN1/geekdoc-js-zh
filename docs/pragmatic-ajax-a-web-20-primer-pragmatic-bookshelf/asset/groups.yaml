  - "[PAGE 155]\n\n# Sajax Debug Mode\n\nBy setting $sajax_debug_mode = 1; Sajax will\
    \ provide you with helpful tracing information during the execution of code within\
    \ the page. The framework delivers the information via alert() calls which pop\
    \ up modal dialog boxes to display the information. The type of information you'll\
    \ see includes:\n\n+   * notification of the begin and end of server callback\
    \ functions\n* the name and parameters of the server function to be called\n*\
    \ the raw result of the callback\n\nOther responses are also possible. Be forewarned\
    \ that turning debug mode will severely hamper a users ability to actually use\
    \ the application, so only use it for designated testing purposes.\n\n```\n<?php\
    \ sajax_show_javascript(); ?>\n```\n\nYou can examine the generated JavaScript\
    \ code by doing a View Source on the page. In addition to a bunch of standard\
    \ code for instantiating the XHR object and wiring up its state callbacks, you\
    \ will also see methods generated specifically by your sajax_export() calls from\
    \ before. Each method that was exported gets a client-side helper method whose\
    \ name is x_name of original function(). In our case, the function is called x_get_city_state(),\
    \ shown here:\n\n```\nfunction x_get_city_state() {\n\tsajax_do_call(\"get_city_state\"\
    , x_get_city_state.arguments);\n}\n```\n\nWhat is the x_get_city_state_arguments()\
    \ all about? To allow for a variable length parameter, we are packaging all the\
    \ inputs into a single collection of values. These values mimic the server-side\
    \ function definition exactly, with one addition. To enable the full Ajax lifecycle\
    \ of a Sajax method, we have to provide an extra parameter, which is a function\
    \ to use as a callback when the request returns with an error. This method harvests\
    \ the results of the server call and performs the client-side work to display\
    \ and/or utilize the data. The function we have been using to this point is assignCityAndState(),\
    \ which"
  - "[PAGE 156]\n\nwe will just reuse in this context.\n\n```\nfunction assignCityAndState(data)\
    \ {\n    if (data.indexOf(',') > 0) {\n        var cityState = data.substring(1).split(',');\n\
    \        document.getElementById('city').value = cityState[0];\n        document.getElementById('state').value\
    \ = \ndocument.getElementById('zipError').innerHTML = \"\";\n    } else {\n  \
    \      document.getElementById('zipError').innerHTML = \"Error: \" + data;\n \
    \   }\n}\n```\n\nSince we are leaving the main part of our HTML identical to the\
    \ Ajax examples, we can wrap these calls with our faithful getZipData()\",\n\n\
    ```\nfunction getZipData(zipCode) {\n    x_get_city_state(zipCode, assignCityAndState);\n\
    }\n```\n\n# Gaining and Losing\n\nSo there you have it. We have shown how you\
    \ can take the Sajax framework, export server-side functions in a very simple\
    \ manner. Sajax is really simple to use, but there are some drawbacks. The main\
    \ drawback is that you only have the ability to return simple types from your\
    \ exported functions. You cannot return a rich object and have it jump into a\
    \ JavaScript object (via JSON or anything else). This means that you may often\
    \ need create wrapper functions around existing server-side code to wrap their\
    \ return types with simple String based information which can be parsed manually\
    \ on the client.\n\nSimilarly, other frameworks (like Dojo) offer transparent\
    \ failover support for all browsers. For example, Dojo can switch to use iframes\
    \ for remoting when the XHR object is not available. Sajax provides no such support;\
    \ it is a no-frills framework designed to make it easy to take advantage of Ajax\
    \ features in modern browsers. What you gain is simplicity: a standard programming\
    \ model with little to no JavaScript code to be written.\n\n# 9.3 XOAD\n\nSajax\
    \ isn' the only PHP Ajaxian framework in town. A newer kid on the block is XOAD.\
    \ We are going to port our CRM application from the Sajax version, and get a good\
    \ view of the similarities and differences between the two popular frameworks."
- md: "\n## Sajax Could Work This Way\n\nAt this point in time, Sajax could work with\
    \ this code too. A simple way to get it to work is to create a wrapper function\
    \ that we utilize like this:\n\n```php\nfunction get_city_state($zip) {\n    return\
    \ ZipService::get_city_state($zip);\n}\n```\n\nSoon we will change the class more\
    \ though for XOAD, and it will no longer work with Sajax.\n\n## From Procedural\
    \ to OO\n\nXOAD is similar to Sajax that it also uses an AJAX-based remoting model\
    \ where you bind your JavaScript layer to your server-side code. You would think\
    \ that we would be able to use exactly the Zip Service that we already created\
    \ for the Sajax. This isn't going to be the case, due to the fact that XOAD cares\
    \ about classes and OO. We will not export just methods, but will give XOAD objects\
    \ and classes. This means we need to change the Zip Service to be a class.\n\n\
    ## Changing the Back End\n\nWe can do this in a slightly cheeky manner. We are\
    \ going to take the get_city_state() functions and bool() to make them static\
    \ methods in a zip service class. We wrap the code in class ZipService { ... },\
    \ and we make the functions static by adding the static keyword before their definitions\
    \ (so we have static function get_city_state($zip) {...}).\n\nThe one we need\
    \ to make to the back end for XOAD is the addition of metadata to the class that\
    \ describes what should be exported. This metadata gets added via a simple instance\
    \ method on the zip service:\n\n```php\nfunction naxajGetMeta() {\n    NAJAX_Client::mapMethods($this,\
    \ array('get_city_state'));\n    NAJAX_Client::publicMethods($this, array('get_city_state'));\n\
    }\n```\n\nYou have some options on what to export. In our example, we give the\
    \ map of methods that we want to export, and we assign the access to public methods.\
    \ You can access private methods via XOAD_Client::privateMethods(), and variables\
    \ de-be accessed directly via XOAD_Client::privateVariables() and XOAD_Client::publicVariables().\
    \ Any OO purist will tell you that doing this violates the principles of encapsulation:\
    \ mainly, private members and data fields should be accessible only by defining\
    \ class or specifically trusted entities. Therefore, be careful when utilizing\
    \ these methods and ensure that you are getting the functionality you actually\
    \ need.\n\n## Back to Front\n\nWe start on the client side as we did with Sajax.\
    \ We load everything need, and define the base directory for all XOAD. In this\
    \ case, we are using a subdirectory called 'najax'.\n\n```php\ndefine('NAJAX_BASE',\
    \ 'najax');\nrequire_once('/najax/najax.php');\nrequire_once('/zipService.najax.php');\n\
    NAJAX_Server::allowClasses('ZipService');\nif (NAJAX_Server::runServer()) {\n\
    \    exit;\n}\n```\n\nWe will also register the classes we want to be remotable.\
    \ It is not technically necessary to do this, but it is considered the polite\
    \ thing to do. XOAD keeps two hashes full of classes, one for allowed classes\
    \ and one for denied classes. Calling methods on denied classes results in an\
    \ error; calls to methods on allowed or unassigned methods will proceed. However,\
    \ in keeping with suggested usage, we will register the ZipServer class with XOAD_Server::allowClasses().\n\
    \nXOAD sets up XHR requests to come back to the same PHP server means that our\
    \ PHP page is accessed in two modes. One is display the page, and the other is\
    \ to access the callback function. The check in XOAD_Server::runServer() is there\
    \ to handle the XHR request; it returns false immediately if the request is not\
    \ XHR callback. Otherwise, this method fires off the bound server methods according\
    \ to the request parameters and returns the results.\n\nOnce again we are quickly\
    \ done with the PHP header code, and we are into the HTML itself. We need to include\
    \ all of the XOAD helper JavaScript code, which is done at the top of the HTML\
    \ head element:\n\n```php\n<?= NAJAX_Utilities::header('najax') ?>\n```\n\n##\
    \ XOAD Serializer\n\nAt this point, XOAD uses a serializer object to be able to\
    \ convert the two worlds. We found an issue when running on PHP 5.1, and had to\
    \ change the Serializer.class.php so that the function serialize(&var) became\
    \ function serialize($var) PHP 5 has different rules for handling pass by reference\
    \ semantics (i.e. we removed the ampersand). The error we were receiving was:\n\
