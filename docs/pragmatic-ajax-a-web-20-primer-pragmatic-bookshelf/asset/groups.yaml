    \ what we've considered about JavaScript is specific to web browsers. In fact,\
    \ many people actually use JavaScript outside of web browsers. From here on, however,\
    \ we will start to consider properties unique to the JavaScript environment hosted\
    \ in modern web browsers.\n\nThe first consideration is how web pages interact\
    \ with JavaScript. If you've ever written JavaScript before, you probably know\
    \ that most JavaScript in the web page must be included inside a `<script>` tag.\
    \ By convention, this is typically included in the web page's `<head>` section,\
    \ as in:\n\n```html\n<html>\n<head>\n  <script type=\"text/javascript\">\n   \
    \ /* javascript code here */\n  </script>\n</head>\n<body>\n  // the web page\
    \ contents\n</body>\n</html>\n```\n\nActually, you can include `<script>` elements\
    \ anywhere in the web page; their contents will be executed in top-to-bottom order.\
    \ It is generally considered bad form to include them anywhere but in the `<head>`,\
    \ however.\n\n## JavaScript in the Web Page\n\nUp to now, nothing of what we've\
    \ considered about JavaScript is specific to web browsers. In fact, many people\
