- md: "\n# Transport Enforcement\n\nSometimes, we don’t want graceful, transparent\
    \ failover. If, for some reason, we must mandate that only certain kinds of post-back\
    \ transport mechanisms are used, we can pass in our rule on the dojo.io.bind()\
    \ call. If we want to enforce one transport-port, only we can do so by setting\n\
    \n```\ntransport: 'XMLHttpRequestTransport'\n```\n\nin the hash that we pass in.\n\
    \nthe right XMLHttpRequest object for your browser. If it can’t find one, it can\
    \ drop back to iframes to do the deed. All of this happens transparently to the\
    \ developer.\n\n# Submitting Forms\n\nDojo can submit a form asynchronously for\
    \ you as well as accessing a URL. All you need to do to submit your form is tell\
    \ Dojo about the form element in your HTML:\n\n```javascript\ndojo.io.bind({\n\
    \  url: \"http://your.formsub.url\",\n  load: function(type, obj) { /* use the\
    \ response */ },\n  formNode: document.getElementById('yourForm')\n})\n```\n\n\
    C'est tout.\n\n# Support for Browser back/forward Buttons\n\nThis feature is a\
    \ gem. One of the issues with using XMLHttpRequest, vs an iframe is that iframe\
    \ events are placed in the browser history, while XHR events are not. This can\
    \ cause an issue if a user clicks on something that causes an Ajax request which\
    \ changes the page, and then they hit the back button assuming that it will take\
    \ them to the state they were before that request. Instead, they are taken to\
    \ the page before the Ajax code (which could be away from your website!).\n\n\
    Dojo allows you to tie into the browser buttons, passing in the work that you\
    \ want to do when a user clicks on back or forward. In our CRM example, you could\
    \ save the current city and state information and clean it out in the form when\
    \ the user clicks \"back\". Then, if the user clicks \"forward\" you could reset\
    \ it into the form without having to go back to the server.\n\n```javascript\n\
    backButton: function() {\n  saveCityState();\n  cleanCityState();\n}\nforwardButton:\
    \ function() {\n  setupState();\n}\n```\n\nHow does Dojo do this? Is there a nice\
    \ API that Firefox and IE give you to hook in? No. The actual implementation differs\
    \ depending on the browser, but at a high level Dojo creates a hidden iframe,\
    \ it makes it go forward two requests, and then one back. Now, it is set ready\
    \ to do your bidding. If you click back on the onload event will call your backButton\
    \ callback. Ditto for the forward button.\n\n# Bookmark-ability\n\nAnother UI\
    \ issue with Ajax is making sure that the bookmark paradigm still works. We have\
    \ all seen Ajax applications that are just one page, and hence you can't bookmark\
    \ anything (Google’s Gmail is sometimes bad like this).\n\nDojo gives you a simple\
    \ hook to change the URL, and hence potentially allow for bookmarking events that\
    \ happen within an Ajax world.\n\nTo turn on this feature you have to set the\
    \ changeURL parameter in your calls to dojo.io.bind(). You can set it to either:\n\
    \n- *true*: change the content of the URL to form http://yoursite.com/yoururl.html#12345678,\
    \ where the content after the hash mark is a timestamp.\n\n```javascript\ndojo.io.bind(\n\
    \  url: \"http://your.sub.url\",\n  load: function(type, obj) { /* use the response\
    \ */ },\n  changeURL: true\n)\n```\n\n- *yourvalue*: The given string will be\
    \ added to the URL. If you set\n\n```javascript\ndojo.io.bind(\n  url: \"http://your.sub.url\"\
    ,\n  load: function(type, obj) { /* use the response */ },\n  changeURL: \"ajaxian\"\
    \n)\n```\n\nthe URL will be changed to be http://yoursite.com/yoururl.html#ajaxian\n\
    \n# Miscellaneous Options: method, content, postContent, sync, and cache\n\nYou\
    \ can pass other (rarely mentioned) options to dojo.io.bind().\n\n- method: You\
    \ can set the HTTP method to use for the request ('get' or 'post'), for example.\n\
    - content and postContent: You can think of this option as the request parameters\
    \ that you wish to post to the server in a hash form.\n`content: { key1: 'value1',\
    \ key2: 'value2' }`\npostContent is only sent if the method is POST, allowing\
    \ you to selectively post certain values on post requests.\n- sync: By default\
    \ your requests are asynchronous (which is good), but you can set `sync: true`\
    \ to change that.\n- useCache: Dojo can use a cache that you can dip into to bypass\
    \ server access. To turn this on you must set `useCache: true`\n\n# 5.3 Remoting\
    \ with the Prototype library\n\nPrototype jumped onto the scene with the rise\
    \ of the popular Ruby on Rails web framework. The Prototype library is another\
    \ open source JavaScript toolkit which provides a straightforward wrapper around\
    \ XHR and some foundational UI effects. Here we'll use Horton's axe to use the\
    \ Remoting capabilities in order to contrast it with Dojo.\n\n# Porting to Prototype\n\
    \nSince you have already seen the port to a remoting framework, this will probably\
    \ look similar. First, we need to point out our browser to pick up the Prototype\
    \ library:\n\n```html\n<script language=\"JavaScript\" type=\"text/javascript\"\
    \ src=\"../scripts/prototype/prototype-1.3.1\"></script>\n```\n\n# Ajax.Request()\n\
    \nThe dojo.io.bind() equivalent in Prototype is Ajax.Request(). It works in similar\
    \ way to dojo, in that you pass the work we want to do with the object itself.\
    \ The differences are subtle. First, you pass the url as the first parameter rather\
    \ than in the object. You also choose between a synchronous or asynchronous request.\
    \ 99% of the time you will want to use asynchronous, because you don't want to\
    \ freeze the browser while the request happens.\n\n# Evaluating the Return as\
    \ JavaScript\n\nIf you wish to use the model of having the server return JavaScript\
    \ for you to run, you can implement this by doing eval() yourself in the Success\
    \ callback.\n\n```javascript\nfunction getZipData(zipCode) {\n    new Ajax.Request(url,\
    \ {\n        asynchronous: true,\n        method: \"get\",\n        parameters:\
    \ \"zip=\" + zipCode + \"&type=eval\",\n        onSuccess: function(request) {\n\
    \            eval(request.responseText);\n        }\n    });\n}\n```\n\n# Returning\
    \ HTML to the Client\n\nRuby on Rails favors the technique of having HTML returned\
    \ from the server, and putting that HTML into the DOM via the `innerHTML` property.\
    \ Since Prototype is a good sister to Rails, it makes this very simple on the\
    \ JavaScript side. The trick is that you need to make sure the content that you\
    \ wish to change has been given an id attribute. Then, we can use an updater that\
    \ makes the XHR request, gets the output, and writes it to the element:\n\n| <tr\
    \ id=\"rewrite\">\n| <th>City</th><td><input id=\"city\" type=\"city\"></td> |\n\
    | <th>State</th><td><input id=\"state\" type=\"text\" size='3' maxlength='2'></td>\
    \ |\n</tr> |\n\nThen we associate an updater with the element with id=`rewrite`\
    \ by wiring up the Ajax.Updater.\n\n```javascript\nfunction getZipData(zipCode)\
    \ {\n  new Ajax.Updater(rewrite, url, {\n    asynchronous: true,\n    method:\
    \ \"get\",\n    parameters: \"zip\" + zipCode + \"&type=html\",\n    onFailure:\
    \ function(request) {\n      assignError(request.responseText);\n    }\n  });\n\
    }\n```\n"
