    >\n      <s:include burl=\"/data/navigation.xml\">\n      <s:include burl=\"/data/forms.xml\"\
    >\n      <!-- 非 BDOC 文档的监听器... -->\n      <div id=\"form\">\n        <s:event\
    \ b:on=\"show-page\" b:action=\"select\" b:target=\"id('formBuffer')\" />\n  \
    \    </div>\n    </</div>\n    <s:event b:on=\"nav-show-page\" b:action=\"select\"\
    \ b:target=\"id('shop_main')\" />\n  </div>\n  <!-- 包含保护缓冲区的引用 -->\n  <!-- 触发\
    \ 'command' 事件对它们执行 butterirty -->\n  <div id=\"clear_protected_trigger\">\n \
    \   <s:event b:on=\"command\">\n      <s:task b:action=\"command\" b:event=\"\
    command\" b:target=\"*\" b:test=\" />\n    </s:event>\n  </div>\n  <!-- 包含商店 -->\n\
    \  <s:include burl=\"/shop/shopIndex.html?cmd=index\" />\n</cmp>\n```\n\n这样的框架可能开启新一代的视觉化开发工具。此类工具的问题之一是标记与代码之间的冲突。传统的基于\
    \ JavaScript 的页面给此类工具带来了麻烦，因为很难为代码更改提供视觉表示。相反，全标记的框架将为这些开发环境提供正确的抽象。例如，ASP.NET、Tapestry\
    \ 和 Java Server Faces 中基于标记的组件。\n\n"
