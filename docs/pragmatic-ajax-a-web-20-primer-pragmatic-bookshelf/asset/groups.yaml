    \ a + b;\n}\nvar result = myFunction(); // result is 22\n```\n\nIn this example,\
    \ we've created a new function named myFunction(). The cool bit of it is that\
    \ the function is able to access the state of its enclosing block. We can reference\
    \ the a and b variables from within the function. This feature is often referred\
    \ to as a closure, and it's a very powerful feature. Normally, values in the enclosing\
    \ scope are lost when the scope terminates. A closure retains access to the state\
    \ of the enclosing block; when used, that state is still available to the closure.\n\
    \n## JavaScript Events: Binding to the Web Page\n\nUp to now, nothing of what\
    \ we've considered about JavaScript is specific to web browsers. In fact, many\
    \ people actually use JavaScript outside of web browsers. From here on, however,\
    \ we will start to consider properties unique to the JavaScript environment hosted\
    \ in modern web browsers.\n\nThe first consideration is how web pages interact\
    \ with JavaScript. If you've ever written JavaScript before, you probably know\
    \ that most JavaScript in the web page must be included inside a `<script>` tag.\
    \ By convention, this is typically included in the web page's `<head>` section,\
    \ as in:\n\n```html\n<html>\n<head>\n  <script type=\"text/javascript\">\n   \
    \ /* javascript code here */\n  </script>\n</head>\n<body>\n  // the web page\
    \ contents\n</body>\n</html>\n```\n\nActually, you can include `<script>` elements\
    \ anywhere in the web page; their contents will be executed in top-to-bottom order.\
    \ It is generally considered bad form to include them anywhere but in the `<head>`,\
    \ however.\n\n## Defining Events\n\nThe most common way to launch JavaScript code\
    \ from a web page is to use HTML events. These events provide hooks for web pages\
    \ to execute arbitrary JavaScript code when the user interacts in certain ways\
    \ with the web page. For example, in the last chapter, you saw an example of the\
    \ `onload` event registered on an `<input>` tag:\n\n```html\n<input onblur=\"\
    getData(this.value)\" type=\"text\"/>\n```\n\n## JavaScript in the Web Page\n\n\
    Up to now, nothing of what we've considered about JavaScript is specific to web\
    \ browsers. In fact, many people actually use JavaScript outside of web browsers.\
    \ From here on, however, we will start to consider properties unique to the JavaScript\
    \ environment hosted in modern web browsers.\n\nThe first consideration is how\
    \ web pages interact with JavaScript. If you've ever written JavaScript before,\
    \ you probably know that most JavaScript in the web page must be included inside\
