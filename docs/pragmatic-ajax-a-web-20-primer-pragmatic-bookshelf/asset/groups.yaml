    \ browser view. We will create a PHP file that creates the HTML for display, as\
    \ well as exports our server functions to the browser as JavaScript methods. In\
    \ figure_ed_screen_sajx.php, we include the main Sajaj PHP module (\"Sajax.php\"\
    ) as well as the Zip Service code that we created earlier (\"ZipService.sajx.php\"\
    ). In addition, we have to initialize Sajaj and choose the function that we want\
    \ to be able to call from client. We \"export\" the method via sajax_export(\"\
    get_city_state\").\n\n```php\nrequire_once(\"sajax/php/Sajax.php\");\nrequire_once(\"\
    zipService.sajx.php\");\nsajax_init();\n//$sajax_export_debug_mode = 1;\nsajax_export(\"\
    get_city_state\");\nsajax_handle_client_request();\n```\n\nWhat about the sajax_handle_client_request()?\
    \ That is where the magic happens. If we take a step back and think about what\
    \ actually happens at runtime, we realize that for this to work, three things\
    \ have to be true:\n\n- Something has to generate the client-side Ajax call\n\
    - Something has to be listening on the server for callback from the generated\
    \ method\n- The listener has to invoke the original server-side method (with parameters)\
    \ based on the callback from the client, and return the results\n\nThis is the\
    \ job of sajax_handle_client_request(). Though this is standard boilerplate code\
    \ that doesn't change, and which you don't have to write, it is important to understand\
    \ what is happening here. This is true both for debugging purposes, as well as\
    \ making appropriate use of the framework. First, the method harvests the server-side\
    \ function and arguments from specific parameters of request. It uses those to\
    \ dynamically invoke the server-side function. Notice also that for GET requests,\
    \ the method makes sure (as much as is possible) to prevent client-side caching\
    \ of the results, whereas for POST requests,\n\nit doesn't both. This is because\
    \ the HTTP specification notes that POST responses are not, by default, cacheable,\
    \ so there is no need to specify the various no-cache headers in the GET version.\n\
    \n```php\nfunction sajax_handle_client_request() {\n    global $ajax_export_list;\n\
    \    $mode = \"\";\n    if (!empty($_GET['rs'])) {\n        $mode = \"get\";\n\
    \    }\n    if (!empty($_POST['rs'])) {\n        $mode = \"post\";\n    }\n  \
    \  if (empty($mode)) {\n        return;\n    }\n    if ($mode == \"get\") {\n\
    \        // Bust cache in the head\n        header(\"Expires: Mon, 26 July 1997\
    \ 05:00:00 GMT\"; \" . gmdate(\"D, d M Y:i:s G\"));\n        header(\"Cache-Control:\
    \ no-cache, no-store, must-revalidate\");\n        header(\"Pragma: no-cache\"\
    );\n        header(\"Expires: 0\");\n        header(\"Last-Modified: \" . gmdate(\"\
    D, d M Y:i:s G\"));\n        $func_name = $_GET['rs'];\n        if (!empty($_GET['ajargs']))\
    \ {\n            $args = $_GET['ajargs'];\n        } else {\n            $args\
    \ = [];\n        }\n    } else {\n        $func_name = $_POST['rs'];\n       \
    \ if (!empty($_POST['ajargs'])) {\n            $args = $_POST['ajargs'];\n   \
    \     } else {\n            $args = [];\n        }\n    }\n    if (!in_array($func_name,\
    \ $ajax_export_list)) {\n        echo \"$func_name not callable\";\n    } else\
    \ {\n        $result = call_user_func_array($func_name, $args);\n        echo\
    \ $result;\n    }\n}\n```\n"
  mdcn: "\n然后我们创建 `get_city_state()` 方法：\n\n```php\nfunction get_city_state($zip)\
    \ {\n    if (!mysql_connect(DB_HOST, DB_USER, DB_PASS)) {\n        bail(\"Could\
    \ not connect to MySQL\");\n    }\n    if (!mysql_select_db(DB_NAME)) {\n    \
    \    bail(\"Could not use the '\" . DB_NAME . \" database in MySQL\");\n    }\n\
    \    $q = sprintf(\"SELECT city, state FROM zips WHERE zip = '%s\",\n        mysql_real_escape_string($zip));\n\
    \    $r = mysql_query($q);\n    $row = mysql_fetch_assoc($r);\n    if ($row['city']\
    \ && $row['state']) {\n        $return_string = $row['city'] . \",\" . $row['state'];\n\
    \    } else {\n        $return_string = \"Could not find a city or state for this\
    \ zip code\";\n    }\n    mysql_free_result($r);\n    return $return_string;\n\
    }\n```\n\n这里的代码相当多，但对 PHP 开发者来说很熟悉。我们首先使用 `mysql_connect()` 和 `mysql_select_db()`\
    \ 连接 MySQL。然后我们使用 `sprintf` 构建查询字符串，并通过 `mysql_real_escape_string()` 对输入进行转义。我们对输入字符串进行转义，以防止跨站脚本和\
    \ SQL 注入攻击。² 最后，我们使用 `mysql_query()` 和 `mysql_fetch_assoc()` 从数据库中获取一行数据。\n\n\
    完成所有这些操作后，我们要么返回匹配的城市和州，要么返回一个错误消息。作为优秀的开发者，我们在返回结果之前没有忘记使用 `mysql_free_result()`\
    \ 释放资源。这确保了结果所占用的任何内存被及时释放。对于你看到的这个脚本，我们不一定需要调用它，但为了清晰起见，我们包含了该调用。\n\n你可能已经注意到了辅助函数\
    \ `bail()`，当发生严重的系统问题（例如数据库宕机）时，它向浏览器返回错误。这是将 Ajax 直接集成到服务器端实现框架的有用之处之一。当服务器执行异步回调期间发生故障时，拥有一个内置的通道来将错误信息传回浏览器是有帮助的。\n\
    \n²关于此类攻击的更多信息，请参阅 XXX 和 XXX。\n\n```php\nfunction bail($message) {\n    header('Content-Type:\
    \ text/html; charset=utf-8');\n    echo \"<html><head><title>Zip Error</title></head><body><h2>$message</h2>\"\
    \ . mysql_error();\n}\n}\n```\n\n## 迁移到 Sajaj\n\n我们的后端代码已经编写完成，现在转向客户端浏览器视图。我们将创建一个创建显示\
    \ HTML 的 PHP 文件，并将我们的服务器函数作为 JavaScript 方法导出到浏览器。在 `figure_ed_screen_sajx.php`\
    \ 中，我们包含了主要的 Sajaj PHP 模块（\"Sajax.php\"）以及我们之前创建的 Zip 服务代码（\"ZipService.sajx.php\"\
    ）。此外，我们必须初始化 Sajaj 并选择我们想要从客户端调用的函数。我们通过 `sajax_export(\"get_city_state\")` “导出”该方法。\n\
    \n```php\nrequire_once(\"sajax/php/Sajax.php\");\nrequire_once(\"zipService.sajx.php\"\
    );\nsajax_init();\n//$sajax_export_debug_mode = 1;\nsajax_export(\"get_city_state\"\
    );\nsajax_handle_client_request();\n```\n\n`sajax_handle_client_request()` 是什么作用的？那是魔法发生的地方。如果我们退后一步，考虑运行时实际上发生了什么，就会发现要让此起作用，必须满足三个条件：\n\
    \n- 必须有某些东西生成客户端 Ajax 调用\n- 必须有某些东西在服务器上监听生成方法的回调\n- 监听器必须根据来自客户端的回调调用原始服务器端方法（带参数），并返回结果\n\
    \n这就是 `sajax_handle_client_request()` 的工作。虽然这是不需要更改的标准模板代码，你不需要编写它，但理解这里发生了什么是非常重要的。这对于调试目的以及为了恰当地使用框架都是如此。首先，该方法从特定的请求参数中提取服务器端函数和参数。它利用这些参数来动态调用服务器端函数。请注意，对于\
    \ GET 请求，该方法会确保（尽可能）防止客户端缓存结果，而对于 POST 请求，\n\n它没有同时这样做。这是因为 HTTP 规范指出 POST 响应默认是不可缓存的，因此在\
    \ GET 版本中没有指定各种无缓存标头。\n\n```php\nfunction sajax_handle_client_request() {\n  \
    \  global $ajax_export_list;\n    $mode = \"\";\n    if (!empty($_GET['rs']))\
    \ {\n        $mode = \"get\";\n    }\n    if (!empty($_POST['rs'])) {\n      \
    \  $mode = \"post\";\n    }\n    if (empty($mode)) {\n        return;\n    }\n\
    \    if ($mode == \"get\") {\n        // 在头部中破坏缓存\n        header(\"Expires: Mon,\
    \ 26 July 1997 05:00:00 GMT\"; \" . gmdate(\"D, d M Y:i:s G\"));\n        header(\"\
    Cache-Control: no-cache, no-store, must-revalidate\");\n        header(\"Pragma:\
    \ no-cache\");\n        header(\"Expires: 0\");\n        header(\"Last-Modified:\
    \ \" . gmdate(\"D, d M Y:i:s G\"));\n        $func_name = $_GET['rs'];\n     \
    \   if (!empty($_GET['ajargs'])) {\n            $args = $_GET['ajargs'];\n   \
    \     } else {\n            $args = [];\n        }\n    } else {\n        $func_name\
    \ = $_POST['rs'];\n        if (!empty($_POST['ajargs'])) {\n            $args\
    \ = $_POST['ajargs'];\n        } else {\n            $args = [];\n        }\n\
    \    }\n    if (!in_array($func_name, $ajax_export_list)) {\n        echo \"$func_name\
    \ not callable\";\n    } else {\n        $result = call_user_func_array($func_name,\
    \ $args);\n        echo $result;\n    }\n}\n```\n"
