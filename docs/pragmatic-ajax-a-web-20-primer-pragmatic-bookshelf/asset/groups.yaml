    However, we maintain that it''s not the geocoding features of Google Maps that
    is particularly innovative or impressive. MapQuest and other software packages
    have been doing this kind of work for years. No, what''s impressive about Google
    Maps is the map interface on top of the geocoding engine. And that''s interface
    that we find easy, not the geocoding under the covers.


    As our good friend Glenn Vanderbilt says, though: "Technically it''s easy, but
    the conception of this interface is the really amazing part, just having the idea
    and realizing that it could be done. So many things are simple once you''ve seen
    they''re possible." The take home lesson is that Google Maps shows once you have
    conceived of your next great UI idea, you can take comfort in knowing that the
    technical solution to implementing it might not be so daunting.


    # The Map


    As you know, the map works by allowing you to interactively move the map by dragging
    the map itself using the mouse. We''ve seen mouse dragging in browsers for years,
    but the impressive bit is that the scrolling map is massive in size, can have
    the zoom level and so. How do they do that?


    Of course, the browser could never fit such a map in memory at once. For example,
    a street-level map of the entire world would probably be about a million pixels
    square. How much memory would it take to display that map? For the sake of conversation,
    let''s assume that the map is displayed with just 256 colors, meaning each pixel
    would consume just one of memory per pixel. Such a map would require 1,000,000,000,000
    bytes of memory, or roughly one thousand gigabytes of RAM. So, simply displaying
    an <img> element just isn''t'
