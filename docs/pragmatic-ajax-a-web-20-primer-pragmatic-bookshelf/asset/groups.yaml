    # Toolkit Resources


    +   - Dojo: http://dojotoolkit.com

    - Prototype: http://prototype.conio.net/

    - Script.aculo.us: http://script.aculo.us

    - DWR: https://dwr.dev.java.net/

    - Backbase: http://www.backbase.com

    - SmartClient: http://www.isomorphic.com

    - Ajax.NET: http://ajax.schwarz-interactive.de/

    - SAJAX: http://www.modernmethod.com/sajax/

    - JSON-RPC: http://json-rpc.org/


    Others, such as DWR (Direct Remoting), couple a JavaScript client library with
    a server-side listener piece written for the Java platform. JSON-RPC itself has
    various bindings for many back-end languages.


    DWR, JSON-RPC, Ajax.NET, and SAJAX are all examples of ORB-based Ajax frameworks.
    They allow you to map JavaScript methods to back end services, treating the client-side
    JavaScript as though it could directly access your server-side objects.


    # UI Toolkit


    Above, or potentially alongside, remoting toolkits we find JavaScript UI libraries.
    These give us the ability to use rich UI components and effects out of the box,
    but differ in many ways.


    # Richer UI Components


    Toolkits such Dojo give us rich widgets like trees, tabbed panes or menus. These
    are self-contained, instantiable UI components that can be used to compose a rich,
    though still very “web-ish” application. The result is still unmistakably an HTML
    UI.'
