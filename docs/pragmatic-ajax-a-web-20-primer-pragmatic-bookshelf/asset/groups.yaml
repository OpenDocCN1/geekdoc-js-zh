  - "[PAGE 29]\n\n# Undefined\n\nThe undefined value is a first-class type in JavaScript.\
    \ Most commonly, it is the value provided by JavaScript for a variable that has\
    \ been declared, whose value has never been assigned. Some JavaScript implementations\
    \ also use it for the value of variables that have never been declared, though\
    \ this is less common, since most JavaScript interpreters allow for in-line variable\
    \ declaration.\n\nIt is important to note that it isn't merely a value. Though\
    \ it has a string representation ('undefined'), it is actually a first-class type.\
    \ This means that the typeof() operator, when applied to a variable with this\
    \ value, will return Undefined.\n\nJava/C# developers may find it that no return\
    \ type returns a value, simply uses the return keyword at some point. It is perfectly\
    \ legal to create functions that branch and return a value in one path but not\
    \ in another. Variables that are assigned the result of a non-returning function\
    \ contain the special JavaScript value undefined.\n\nConsider this next example\
    \ snippet:\n\n```\nfunction myFunction(a) {\n  return \"Hello\";\n}\nfunction\
    \ myFunction() { // <label=code.js.function/>\n  return \"World\";\n}\nvar myResult\
    \ = myFunction(\"aValue\"); // <label=code.js.return/>\n```\n\nWhat do you suppose\
    \ is the value of myResult on line is? If you use a language that supports method\
    \ overloading, you'd probably expect the value to be Hello. In fact, it's not.\
    \ JavaScript does not support overloading; that is, it doesn't match function\
    \ invocations to function definitions based on the name and parameters of the\
    \ function; just the name.\n\nTherefore, there can be only one function with a\
    \ given name at runtime. If two or more functions are defined with the same name,\
    \ the version that was last processed by JavaScript is invoked. In our example,\
    \ that turns out to be the one defined on line ."
  - "[PAGE 30]\n\nBecause a function's parameters play no role in defining it, their\
    \ presence is entirely optional. In fact, there's even a way to reference an invocation's\
    \ parameters without declaring them—but we'll come back to that in just a bit.\n\
    \n# The Function Type\n\nEarlier, we talked about the four types of values in\
    \ JavaScript (object, number, string, and boolean) and hinted that more existed.\
    \ Functions are in fact a type in JavaScript. In fact, once you define a function\
    \ using the traditional syntax we saw earlier, a variable exists that references\
    \ the function; the variable takes on the same name as the function itself.\n\n\
    Consider this next example:\n\n```\nfunction myFunction() {\n  // imagine that\
    \ this function does something\n}\nalert(typeof myFunction)\n```\n\nIf you execute\
    \ this code in your browser, JavaScript's built-in alert will cause a dialog to\
    \ appear that displays the type of the myFunction variable: the contents of the\
    \ dialog will be \"function\".\n\nThis particular property of JavaScript—having\
    \ functions as a type—leads to some pretty interesting behaviors. Consider the\
    \ following:\n\n```\nfunction myFunction() {\n  // we created a variable myFunction\n\
    \  return \"Hello\";             // of the type \"function\"\n}\nvar myFunction\
    \ = 10;          // we now reassigned myFunction to be a number\nvar myResult\
    \ = myFunction(); // an error -- we can't invoke a number\n```\n\nYikes! In many\
    \ languages, code like this would work fine; functions and variables are entirely\
    \ different entities and their names don't collide. In JavaScript, because functions\
    \ are variables, code like this is nonsensical.\n\nIn addition to the conventional\
    \ syntax for defining functions we've used up to now, there's another way to define\
    \ a function:\n\n```\nvar a = 10;\nvar b = 12;\nvar myFunction = function() {\n\
    \  return a + b;\n}\nvar result = myFunction(); // result is 22\n```"
  - "[PAGE 31]\n\nIn this example, we've created a new function named myFunction().\
    \ The cool bit of it is that the function is able to access the state of its enclosing\
    \ block. We can reference the o and b variables from within the function. This\
    \ feature is often referred to as a closure, and it's a very powerful feature.\
    \ Normally, values in the enclosing scope are lost when the scope terminates.\
    \ A closure retains access to the state of the enclosing block; when used, that\
    \ state is still available to the closure.\n\n# ## JavaScript Events: Binding\
    \ to the Web Page\n\nUp to now, nothing of what we've considered about JavaScript\
    \ is specific to web browsers. In fact, many people actually use JavaScript outside\
    \ of web browsers. From here on, however, we will start to consider properties\
    \ unique to the JavaScript environment hosted in modern web browsers.\n\nThe first\
    \ consideration is how web pages interact with JavaScript. If you've ever written\
    \ JavaScript before, you probably know that most JavaScript in the web page must\
    \ be included inside a <script> tag. By convention, this is typically included\
    \ in the web page's <head> section, as in:\n\n```\n<html>\n<head>\n  <script type=\"\
    text/javascript\">\n    /* javascript code here */\n  </script>\n</head>\n<body>\n\
    \  // the web page contents\n</body>\n</html>\n```\n\nActually, you can include\
    \ <script> elements anywhere in the web page; their contents will be executed\
    \ in top-to-bottom order. It is generally considered bad form to include them\
    \ anywhere but in the <head>, however.\n\n# ## Defining Events\n\nThe most common\
    \ way to launch JavaScript code from a web page is to use HTML events. These events\
    \ provide hooks for web pages to execute arbitrary JavaScript code when the user\
    \ interacts in certain ways with the web page. For example, in the last chapter,\
    \ you saw an example of the onload event registered on an <input> tag:\n\n```\n\
    <input onblur=\"getData(this.value)\" type=\"text\" name=\"zip\"/>\n```"
  - "[PAGE 32]\n\n# JavaScript in a Web Page\n\nWe said that \"most\" JavaScript in\
    \ a page should be included in a <script> tag. The exception is that JavaScript\
    \ can be embedded in-line as the value of attributes on a tag. Specifically, instead\
    \ of referencing JavaScript functions in event handler attributes, you can embed\
    \ JavaScript directly. There is no functional difference between:\n\n​\\u0```html\n\
    <div id=\"myDiv\" onclick=\"clickIt();\"></div>\n<script type=\"text/javascript\"\
    >\nfunction clickIt() {\n  alert(\"You clicked me!\");\n  alert(\"Jerk!\");\n\
    }\n</script>\n```\nand:\n```html\n<div id=\"myDiv\" onclick=\"alert('You clicked\
    \ me!'); alert('Jerk!');\"></div>\n```\n\nAs we explained back then, the onblur\
    \ event is fired (that is, its contents are executed) when the user moves the\
    \ cursor from the input component to some other place on the web page. In this\
    \ example, the contents of the event attribute is a function invocation. As we've\
    \ shown, you can place any arbitrary JavaScript code you like here, but it is\
    \ a good idea to limit yourself to function invocations to keep your code easier\
    \ to maintain.\n\nThere are a large number of events available in a web page.\
    \ These range from the so-classic events defined many years ago in the official\
    \ HTML 4 specification to some additional de facto events that have emerged in\
    \ various browsers in more recent years. There are numerous resources over the\
    \ web for discovering the various types of events possible in browsers; our favorite\
    \ website is QuirksMode.org. QuirksMode offers a very detailed discussion of events\
    \ and browsers and offers fairly recent compatibility for different browser types.\n\
    \nFor your convenience, we've included a selection of important events starting\
    \ on page ??; it is by no means an exhaustive reference. As you explore the rest\
    \ of this book, you'll see some additional examples.\n\n> ¹http://www.quirksmode.org"
  - "[PAGE 33]\n\n# A REVIEW OF CLIENT-SIDE JavaScript\n\n# Defining Events Outside\
    \ of HTML\n\nWe have so far shown that JavaScript event handler functions can\
    \ be wired up to nodes through HTML attributes. This is fairly common practice,\
    \ though there is a class of programmer (we'll call them 'purists') who frown\
    \ upon this usage. Even though JavaScript is embedded within the web page itself,\
    \ many developers like to consider the JavaScript and the HTML as separate artifacts.\
    \ Specifically, web designers will want to work on the HTML and styles, while\
    \ programmers will want to focus on the scripting. Directly embedding the JavaScript\
    \ into the HTML is too much coupling.\n\nThe main alternative is to use JavaScript\
    \ object properties. Once you have retrieved a reference to a node of an HTML\
    \ document, it exposes its events as a series of properties. Functions can be\
    \ directly attached to those properties. The following\n\n```\n<div id=\"mydiv\"\
    \ onclick=\"myfunction()\">\n```\n\nis functionally equivalent to\n\n```\n<div\
    \ id=\"mydiv\"/>\n<script type=\"text/javascript\">\n  document.getElementById('mydiv').onclick\
    \ = myfunc;\n</script>\n```\n\nThe value to this technique is that the designer\
    \ can worry about HTML, and only HTML. Programmers can hook events transparently.\
    \ However, the downside is that the scripts that reference events must be parsed\
    \ after the HTML they reference. Otherwise, the event cannot be found by getElementById(),\
    \ and the result is that no event is actually handled. There is a relatively new\
    \ library out called Behavior (http://bennolan.com/behaviour/) that helps programmers\
    \ by allowing you to assign behaviors to CSS classes, adding an extra layer of\
    \ indirection.\n\nModern browsers support a new kind of binding. The new attachEventListener()\
    \ function takes the name of the event to handle (the \"on\" part), the function\
    \ pointer, and a boolean value called capture mode. The beauty of the new attachEventListener()\
    \ method is it can wire up multiple handlers to the same event, creating a chain\
    \ of handlers. Using the direct property access, any subsequent assignments to\
    \ a property just override the last assignment. Before using attachEventListener(),\
    \ make sure your browser is supported. At last, IE5+ for Windows, Firefox 1.0+\
    \ and Safari 1.2+ were all supported, but not IE for the Mac."
- md: "\n## 3.2 Manipulating the Web Page\n\nSo far, we've covered the basics of JavaScript\
    \ and discussed how to get a web page to call JavaScript functions in response\
    \ to user events. This covers a third of what you need to know to create an Ajax\
    \ application. The next major piece is knowing how to actually change web page\
    \ content from JavaScript.\n\n## XML Under the Covers\n\nModern browsers store\
    \ a copy of every web page you visit in memory as an XML document, regardless\
    \ of whether you are visiting a modern XHTML site or an old HTML 2.0-era site.\
    \ (When a web page is not well-formed, the browser follows an internal algorithm\
    \ for promoting the HTML to XML.) This in-memory representation of the web page\
    \ can be accessed by JavaScript code to programmatically determine all kinds of\
    \ information about the page.\n\nMore importantly, the XML document can be modified,\
    \ and modifications are instantly reflected by the browser's rendering of that\
    \ page. Thus, to achieve animation, dynamic modification, and other effects, all\
    \ one has to do is modify the web page's underlying XML document. We'll now consider\
    \ how to go about making such modifications.\n\n## Modifying the XML: The DOM\
    \ API\n\nThe major browsers implement the same API for exposing the XML document\
    \ to JavaScript code; it's known as the DOM API. Short for Document Object Model,\
    \ DOM represents XML elements, attributes, and other components as objects in\
    \ memory. The DOM API models an XML document in memory as a Document object.\n\
    \nYou can obtain a reference to the Document object that represents the current\
    \ web page by referencing a variable named `document`. From this instance, you\
    \ can retrieve elements to individual XML elements in the web page, which are\
    \ modeled as Element objects. You can also modify the attributes of an XML element\
    \ via an Element object.\n\nIt's time for an example. This next code excerpt contains\
    \ a simple web page that will modify when its button is clicked:\n\n```javascript\n\
    <head>\n  <script type=\"text/javascript\">\n    function modifyPage() {\n   \
    \   var htmlElement = document.documentElement\n      var children = htmlElement.childNodes\n\
    \      var bodyElement\n      for (var i = 0; i < children.length; i++) {\n  \
    \      if (children[i].nodeName == \"BODY\") {\n          bodyElement = children[i]\n\
    \          break;\n        }\n      }\n      children = bodyElement.childNodes\n\
    \      var divElement\n      for (var i = 0; i < children.length; i++) {\n   \
    \     if (children[i].nodeName == \"DIV\") {\n          divElement = children[i]\n\
    \          break;\n        }\n      }\n      divElement.replaceChild(document.createTextNodeNode(\"\
    Goodbye, world!\"),\n      divElement.childNodes[0]);\n    }\n  </script>\n  <body>\n\
    \    <div>Hello, world.</div>\n    <button onclick=\"myPage()\">Click Me</button>\n\
    \  </body>\n</html>\n```\n\nAs you can see, the DOM API is a straightforward pleasure\
    \ to use. Actually, no, it's not. The DOM API is actually quite obtuse. If you've\
    \ never used the DOM API before, you might expect something that models XML in\
    \ an intuitive and easy fashion. For example, you might expect to be able to say,\
    \ get a reference to the root element in your web page, the `<html>` element,\
    \ and from there say something like:\n\n```javascript\nhtmlElement.getElement(\"\
    BODY\");\n```\n\nNo such luck. You see, the DOM API models all of the different\
    \ types of content (text, attributes, comments, and processing instructions) as\
    \ nodes, and inexplicably, the API does not provide a way for you to retrieve\
    \ just the element children from a parent element. This means navigating through\
    \ the web page as XML is excruciating, as you can see for yourself.\n\nFurther,\
    \ matters get worse. Earlier we explained that browsers canonicalize all web pages—that\
    \ is, they convert all HTML to XML in a standard way. As part of this process,\
    \ certain elements are added. For example, consider the case of an HTML table:\n\
    \n<table>\n  <tr>\n    <td>A table</td>\n  </tr>\n</table>\n\n## MANIPULATING\
    \ THE WEB PAGE\n\nWhen the browser converts this HTML to XML, it automatically\
    \ adds a `<body>` element as a child of the `<table>` element. Unexpected things\
    \ happen to your HTML when the browser parses it; for this reason, you should\
    \ steer clear of literally warping your page using the DOM, as things may not\
    \ be where you expect them.\n\n## DOM Shortcuts\n\nFortunately, the DOM API includes\
    \ a few shortcuts. Document objects have a method `getElementsByTagName()` that\
    \ could come in handy in our example. Consider this alternate JavaScript function:\n\
    \n```javascript\nfunction modifyPage() {\n  var divElements = document.getElementsByTagName(\"\
    DIV\");\n  var divElement = divElements[0];\n  divElement.replaceChild(document.createTextNode(\"\
    Goodbye, world!\"), divElement.childNodes[0]);\n}\n```\n\nThat's more palatable.\
    \ But we still have the brittle ordering problem. We are assuming that the `<div>`\
    \ element we're interested in will always occur in the same location relative\
    \ to other `<div>` elements. In our trivial example, this is a safe assumption,\
    \ but in the real world it will not work at all.\n\nWhat we really need is a way\
    \ to easily reference a specific element in the web page. Fortunately, there is\
    \ just such an easy and convenient mechanism. If you give an element an `id` attribute,\
    \ you can retrieve that element using a special function on the Document object\
    \ `getElementById()`. Consider this further revised version of the earlier example:\n\
    \n```html\n<html>\n<head>\n<script type=\"text/javascript\">\n  function modifyPage()\
    \ {\n    var divElement = document.getElementById(\"toReplace\")\n    divElement.replaceChild(document.createTextNode(\"\
    Goodbye, world!\"), divElement.childNodes[0]);\n  }\n</script>\n<body>\n  <div\
    \ id=\"toReplace\">Hello, world.</div>\n  <button onclick=\"myPage()\">Click Me</button>\n\
    </body>\n</html>\n```\n\nAs you can see, the DOM API is a straightforward pleasure\
    \ to use. Actually, no, it's not. The DOM API is actually quite obtuse. If you've\
    \ never used the DOM API before, you might expect something that models XML in\
    \ an intuitive and easy fashion. For example, you might expect to be able to say,\
    \ get a reference to the root element in your web page, the `<html>` element,\
    \ and from there say something like:\n\n```javascript\nhtmlElement.getElement(\"\
    BODY\");\n```\n\nNo such luck. You see, the DOM API models all of the different\
    \ types of content (text, attributes, comments, and processing instructions) as\
    \ nodes, and inexplicably, the API does not provide a way for you to retrieve\
    \ just the element children from a parent element. This means navigating through\
    \ the web page as XML is excruciating, as you can see for yourself.\n\nFurther,\
    \ matters get worse. Earlier we explained that browsers canonicalize all web pages—that\
    \ is, they convert all HTML to XML in a standard way. As part of this process,\
    \ certain elements are added. For example, consider the case of an HTML table:\n\
    \n<table>\n  <tr>\n    <td>A table</td>\n  </tr>\n</table>\n\n## MANIPULATING\
    \ THE WEB PAGE\n\nWhen the browser converts this HTML to XML, it automatically\
    \ adds a `<body>` element as a child of the `<table>` element. Unexpected things\
    \ happen to your HTML when the browser parses it; for this reason, you should\
    \ steer clear of literally warping your page using the DOM, as things may not\
    \ be where you expect them.\n\n## DOM Shortcuts\n\nFortunately, the DOM API includes\
    \ a few shortcuts. Document objects have a method `getElementsByTagName()` that\
    \ could come in handy in our example. Consider this alternate JavaScript function:\n\
    \n```javascript\nfunction modifyPage() {\n  var divElements = document.getElementsByTagName(\"\
    DIV\");\n  var divElement = divElements[0];\n  divElement.replaceChild(document.createTextNode(\"\
    Goodbye, world!\"), divElement.childNodes[0]);\n}\n```\n\nThat's more palatable.\
    \ But we still have the brittle ordering problem. We are assuming that the `<div>`\
    \ element we're interested in will always occur in the same location relative\
    \ to other `<div>` elements. In our trivial example, this is a safe assumption,\
    \ but in the real world it will not work at all.\n\nWhat we really need is a way\
    \ to easily reference a specific element in the web page. Fortunately, there is\
    \ just such an easy and convenient mechanism. If you give an element an `id` attribute,\
    \ you can retrieve that element using a special function on the Document object\
    \ `getElementById()`. Consider this further revised version of the earlier example:\n\
    \n```html\n<html>\n<head>\n<script type=\"text/javascript\">\n  function modifyPage()\
    \ {\n    var divElement = document.getElementById(\"toReplace\")\n    divElement.replaceChild(document.createTextNode(\"\
    Goodbye, world!\"), divElement.childNodes[0]);\n  }\n</script>\n<body>\n  <div\
    \ id=\"toReplace\">Hello, world.</div>\n  <button onclick=\"myPage()\">Click Me</button>\n\
    </body>\n</html>\n```\n\n## MANIPULATING THE WEB PAGE\n\nWhen the browser converts\
    \ this HTML to XML, it automatically adds a `<body>` element as a child of the\
    \ `<table>` element. Unexpected things happen to your HTML when the browser parses\
    \ it; for this reason, you should steer clear of literally warping your page using\
    \ the DOM, as things may not be where you expect them.\n\n## Inner and Outer\n\
    \nThe innerHTML() property that we've just demonstrated is very useful, but it\
    \ has a storied history. It was introduced as a proprietary addition to Internet\
    \ Explorer; other browsers have decided to support it as it has proved useful.\
    \ There are, though, two related properties: innerText(), outerHTML().\n\n`innerText()`\
    \ accomplishes almost the same thing as `innerHTML()`. The internal representation\
    \ of the referenced node is replaced with the text passed into the method. However,\
    \ unlike `innerHTML()`, the new text is not parsed as XML. It is, rather, rendered\
    \ directly as a textual child of the node. This is actually a lot more performant\
    \ than parsing the text as XML, and is preferable for just adding data than replacing\
    \ elements.\n\nouter() is a different beast. innerHTML() detaches any all existing\
    \ children of the target node, parses the new text, and adds the new nodes as\
    \ children of the target node (essentially, replacing everything between the opening\
    \ and closing tags of the target node), outerHTML(), on the other hand, replaces\
    \ the target node itself. All of the existing node are lost as a byproduct of\
    \ destroying the target node. The node is replaced with whatever new nodes are\
    \ created by parsing the input to the method.\n\n## Attributes\n\nSo far we've\
    \ talked about elements. What about attributes? Just as with elements, the DOM\
    \ presents a generic way to manipulate attributes. Once you have a reference to\
    \ an element, you can use `getAttribute()` and `setAttribute()` to access and\
    \ change them, such as in example:\n\n```javascript\nvar div = document.getElementById(\"\
    someDiv\")\ndiv.setAttribute(\"style\", \"background: red\") // make the div red\n\
    ```\n\nThis latter approach is actually much more useful when writing web pages\
    \ that are dumb shells. The server-side code which renders the component can return\
    \ the full entity (top-level node and its children) which can be placed anywhere\
    \ on the page. Using innerHTML(), the containing page has full control over the\
    \ layout of the components, with specifically designed container nodes to use\
    \ as targets. The server endpoints only output the contents: if the containing\
    \ page puts them in the wrong kind of node, or at the root of the document, the\
    \ rendering will most likely be wrong.\n\nUsing outerHTML(), however, the server\
    \ target renders the containing node AND its contents, ensuring that no matter\
    \ where the containing page puts the results, it will be fully contained as designed.\
    \ A real component, not just component contents. This sounds like an excellent\
    \ thing, and it is. Except it is still a proprietary IE addition, and Firefox,\
    \ for example, has not adopted it, and has no public plans to do so.\n"
  mdcn: "\n\n## 3.2 操作网页\n\n到目前为止，我们已经涵盖了 JavaScript 的基础知识，并讨论了如何让网页响应用户事件调用 JavaScript\
    \ 函数。这涵盖了创建 Ajax 应用程序所需要知识的三分之一。下一个大重点是知道如何通过 JavaScript 实际更改网页内容。\n\n## 内存背后的\
    \ XML\n\n现代浏览器会将你访问的每个网页以 XML 文档的形式在内存中存储一份副本，无论你访问的是现代的 XHTML 站点还是旧的 HTML 2.0\
    \ 时代的站点。（当网页格式不符合规范时，浏览器将遵循一种内部算法将 HTML 提升为 XML。）这种对网页的内存表示可以通过 JavaScript 代码访问，从而程序化地确定关于页面的各种信息。\n\
    \n更重要的是，XML 文档是可以修改的，而且修改会通过浏览器对该页面的渲染立即反映。因此，为了实现动画、动态修改和其他效果，人们只需要修改网页底层的 XML\
    \ 文档。我们现在来考虑如何进行此类修改。\n\n## 修改 XML：DOM API\n\n主流浏览器都实现了相同的 API 来向 JavaScript 代码暴露\
    \ XML 文档；它被称为 DOM API。DOM 是文档对象模型（Document Object Model）的缩写，它将 XML 元素、属性和其他组件表示为内存中的对象。DOM\
    \ API 将内存中的 XML 文档模型化为一个 Document 对象。\n\n你可以通过引用名为 `document` 的变量来获取表示当前网页的 Document\
    \ 对象引用。从这个实例中，你可以获取元素到网页中的单个 XML 元素，这些元素被建模为 Element 对象。你也可以通过 Element 对象修改 XML\
    \ 元素的属性。\n\n是时候看个例子了。接下来的代码片段包含一个简单的网页，它会在点击按钮时被修改：\n\n```javascript\n<head>\n\
    \  <script type=\"text/javascript\">\n    function modifyPage() {\n      var htmlElement\
    \ = document.documentElement\n      var children = htmlElement.childNodes\n  \
    \    var bodyElement\n      for (var i = 0; i < children.length; i++) {\n    \
    \    if (children[i].nodeName == \"BODY\") {\n          bodyElement = children[i]\n\
    \          break;\n        }\n      }\n      children = bodyElement.childNodes\n\
    \      var divElement\n      for (var i = 0; i < children.length; i++) {\n   \
    \     if (children[i].nodeName == \"DIV\") {\n          divElement = children[i]\n\
    \          break;\n        }\n      }\n      divElement.replaceChild(document.createTextNodeNode(\"\
    Goodbye, world!\"),\n      divElement.childNodes[0]);\n    }\n  </script>\n  <body>\n\
    \    <div>Hello, world.</div>\n    <button onclick=\"myPage()\">Click Me</button>\n\
    \  </body>\n</</html>\n```\n\n如你所见，DOM API 使用起来非常简单且令人愉悦。实际上，不，并非如此。DOM API 实际上非常晦涩。如果你以前从未用过\
    \ DOM API，你可能期望它能以一种直观且简单的方式对 XML 进行建模。例如，你可能期望能够获取网页根元素（`<html>` 元素）的引用，并从那里编写类似下面的代码：\n\
    \n```javascript\nhtmlElement.getElement(\"BODY\");\n```\n\n运气没那么。你会发现，DOM API\
    \ 将所有不同类型的内容（文本、属性、注释和处理指令）建模为节点，而且莫名的是，API 并没有提供一种方法让你仅从父元素中获取元素子。正如你自己所看到的，以\
    \ XML 的方式遍历网页是极其痛苦的。\n\n此外，情况变得更糟了。我们之前解释过浏览器会对所有网页进行规范化处理——即它们以标准方式将所有 HTML 转换为\
    \ XML。在这个过程中，某些元素会被添加。例如，考虑 HTML 表格的情况：\n\n<table>\n  <tr>\n    <td>A table</td>\n\
    \  </tr>\n</table>\n\n## 操作网页\n\n当浏览器将此 HTML 转换为 XML 时，它会自动添加一个 `<body>` 元素作为\
    \ `<table>` 元素的子元素。当浏览器解析 HTML 时，你的 HTML 会发生意料之外的变化；出于这个原因，你应该避免使用 DOM 字面地扭曲你的页面，因为元素可能并不在你预期的位置。\n\
    \n## DOM 快捷径\n\n幸运的是，DOM API 包含了几个快捷径。Document 对象有一个 `getElementsByTagName()`\
    \ 方法，这在我们的例子中可以大上用场。考虑这个替代的 JavaScript 函数：\n\n```javascript\nfunction modifyPage()\
    \ {\n  var divElements = document.getElementsByTagName(\"DIV\");\n  var divElement\
    \ = divElements[0];\n  divElement.replaceChild(document.createTextNode(\"Goodbye,\
    \ world!\"), divElement.childNodes[0]);\n}\n```\n\n这就好接受多了。但我们仍然面临脆弱的顺序问题。我们假设我们感兴趣的\
    \ `<div>` 元素始终相对于其他 `<div>` 元素出现在相同的位置。在我们这个简单的例子中，这是一个安全的假设，但在现实世界中它完全不可行。\n\n\
    我们真正需要一种方便引用网页中特定元素的方法。幸运的是，确实有这样简单方便的机制。如果你给元素赋予一个 `id` 属性，你就可以使用 Document 对象上的特殊函数\
    \ `getElementById()` 来获取该元素。考虑这个之前示例的进一步修订版本：\n\n```html\n<html>\n<head>\n<script\
    \ type=\"text/javascript\">\n  function modifyPage() {\n    var divElement = document.getElementById(\"\
    toReplace\")\n    divElement.replaceChild(document.createTextNode(\"Goodbye, world!\"\
    ), divElement.childNodes[0]);\n  }\n</script>\n<body>\n  <div id=\"toReplace\"\
    >Hello, world.</div>\n  <button onclick=\"myPage()\">Click Me</button>\n</body>\n\
    </html>\n```\n\n如你所见，DOM API 使用起来简单且令人愉悦。实际上，不，并非如此。DOM API 实际上非常晦涩。如果你以前从未用过\
    \ DOM API，你可能期望它能以一种直观且简单的方式对 XML 进行建模。例如，你可能期望能够获取网页根元素（`<html>` 元素）的引用，并从那里编写类似下面的代码：\n\
    \n```javascript\nhtmlElement.getElement(\"BODY\");\n```\n\n运气没那么。你会发现，DOM API\
    \ 将所有不同类型的内容（文本、属性、注释和处理指令）建模为节点，而且莫名的是，API 并没有提供一种方法让你仅从父元素中获取元素子。正如你自己所看到的，以\
    \ XML 的方式遍历网页是极其痛苦的。\n\n此外，情况变得更糟了。我们之前解释过浏览器会对所有网页进行规范化处理——即它们以标准方式将所有 HTML 转换为\
    \ XML。在这个过程中，某些元素会被添加。例如，考虑 HTML 表格的情况：\n\n<table>\n  <tr>\n    <td>A table</td>\n\
    \  </tr>\n</table>\n\n##网页\n\n当浏览器将此 HTML 转换为 XML 时，它会自动添加一个 `<body>` 元素作为 `<table>`\
    \ 元素的子元素。当浏览器解析 HTML 时，你的 HTML 会发生意料之外的变化；出于这个原因，你应该避免使用 DOM 字面地扭曲你的页面，因为元素可能并不在你预期的位置。\n\
    \n## DOM 快捷径\n\n幸运的是，DOM API 包含了几个快捷径。Document 对象有一个 `getElementsByTagName()`\
    \ 方法，这在我们的例子中可以大上用场。考虑这个替代的 JavaScript 函数：\n\n```javascript\nfunction modifyPage()\
    \ {\n  var divElements = document.getElementsByTagName(\"DIV\");\n  var divElement\
    \ = divElements[0];\n  divElement.replaceChild(document.createTextNode(\"Goodbye,\
    \ world!\"), divElement.childNodes[0]);\n}\n```\n\n这就好接受多了。但我们仍然面临脆弱的顺序问题。我们假设我们感兴趣的\
    \ `<div>` 元素始终相对于其他 `<div>` 元素出现在相同的位置。在我们简单的例子中，这是一个安全的假设，但在现实世界中它完全不可行。\n\n\
    我们真正需要一种方便引用网页中特定元素的方法。幸运的是，确实有这样简单方便的机制。如果你给元素赋予一个 `id` 属性，你就可以使用 Document 对象上的特殊函数\
    \ `getElementById()` 来获取该元素。考虑这个之前示例的进一步修订版本：\n\n```html\n<html>\n<head>\n<script\
    \ type=\"text/javascript\">\n  function modifyPage() {\n    var divElement = document.getElementById(\"\
    toReplace\")\n    divElement.replaceChild(document.createTextNode(\"Goodbye, world!\"\
    ), divElement.childNodes[0]);\n  }\n</script>\n<body>\n  <div id=\"toReplace\"\
    >Hello, world.</div>\n  <button onclick=\"myPage()\">Click Me</button>\n</body>\n\
    </html>\n```\n\n## 操作网页\n\n当浏览器将此 HTML 转换为 XML 时，它会自动添加一个 `<body>` 元素作为 `<table>`\
    \ 元素的子元素。当浏览器解析 HTML 时，你的 HTML 会发生意料之外的变化；出于这个原因，你应该避免使用 DOM 字面地扭曲你的页面，因为元素可能并不在你预期的位置。\n\
    \n## 内部与外部\n\n我们刚刚演示的 `innerHTML()` 属性非常有用，但它有一段悠久的历史。它是作为 Internet Explorer 的有扩展引入的；其他浏览器决定支持它，因为它证明是很有用的。然而，有两个相关的属性：`innerText()`\
    \ 和 `outerHTML()`。\n\n`innerText()` 实现的功能与 `innerHTML()` 几乎相同。被引用节点的内部表示被传入方法的文本所替换。然而，与\
    \ `innerHTML()` 不同，新文本不会被解析为 XML。相反，它作为节点的文本子元素直接被渲染。这实际上比将文本解析为 XML 性能高得多，对于仅仅添加数据而不是替换元素来说是更优的。\n\
    \n`outer()` 是另一个物。`innerHTML()` 会断开目标节点的所有现有子元素，解析新文本并将新节点作为目标节点的子元素（本质上是替换目标节点开始和结束标签之间的所有内容），而\
    \ `outerHTML()` 则替换目标节点本身。所有现有的节点都作为破坏目标节点的副作用而丢失。节点将被由解析方法输入时创建的任何新节点所替换。\n\n\
    ## 属性\n\n到目前为止，我们讨论了元素。属性呢？就像元素一样，DOM 也提供了一种操作属性的通用方法。一旦你获取了元素的引用，就可以使用 `getAttribute()`\
    \ 和 `setAttribute()` 来访问并更改它们，例如所示：\n\n```javascript\nvar div = document.getElementById(\"\
    someDiv\")\ndiv.setAttribute(\"style\", \"background: red\") // 让 div 变成红色\n```\n\
    \n这种后一种方法在编写作为外壳的网页时实际上有用得多。渲染组件的服务器端代码可以返回完整实体（顶层节点及其子元素），它可以放置页面的任何地方。使用 `innerHTML()`，包含页面对组件的布局具有完全控制权，可以使用专门设计的容器节点作为目标。服务器端只输出内容：如果包含页面将它们放在错误类型的节点中，或者放在文档的根部，渲染很可能是错误的。\n\
    \n使用 `outerHTML()`，然而，服务器目标渲染包含节点及其内容，确保无论包含页面将结果放在哪里，它都将按照设计完整包含。一个真正的组件，而不仅仅是组件内容。这听起来是一个极好的事情，事实也如此。除了它仍然是一个专有扩展，例如\
    \ Firefox 尚未采纳它，也没有公开的计划这样做。\n\n"
