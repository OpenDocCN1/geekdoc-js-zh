    \ 的库，它通过允许将行为分配给 CSS 类来帮助程序员，增加了一层间接性。\n\n现代浏览器支持一种新的绑定方式。新的 `addEventListener()`\
    \ 函数接收要处理的事件名称（去掉 \"on\" 的部分）、函数指针以及一个称为捕获模式的布尔值。新的 `addEventListener()` 方法的妙之处在于，它可以为同一个事件连接多个处理程序，创建一个处理程序链。使用直接属性访问，任何对属性的后续赋值都会覆盖上一次赋值。在使用\
    \ `addEventListener()` 之前，请确保你的浏览器支持它。最后，Windows 上的 IE5+、Firefox 1.0+ 和 Safari\
    \ 1.2+ 均已支持，但 Mac 版 IE 不支持。\n\n> ¹http://www.quirksmode.org\n\n"
