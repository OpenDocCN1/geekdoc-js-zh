    # Server-side Framework Integration


    Over the next four chapters, we''re going to introduce four web application development
    frameworks and examine the server-side integration techniques they use for incorporating
    Ajax. This kind of integration can be very valuable for a development team, allowing
    the members of the team to focus their efforts on one logical tier (the server)
    while simultaneously generating artifacts for two physical tiers (server and client).


    To explore these frameworks, we''re going to walk Hector''s team through porting
    their CRM application to each framework. Along the way, we''ll talk about the
    reasons why Hector might consider each port, and the relative strengths and challenges
    each choice presents. The four frameworks we''ll examine are:


    +   - PHP: Sajaz is the first Ajax integration toolkit for PHP, and we''ll examine
    it plus the newer Najax library.

    - Ruby on Rails: Rails integrates very closely with Prototype and Script.ulo.
    In fact, the authors of those two frameworks are also Rails committers.

    - Spring (Java): We''ll look at the integration of the DWR framework with Spring
    for Java web applications.

    - ASP.NET: we''ll look at both Ajax.NET, an open source Ajax library, and the
    upcoming Atlas toolkit from Microsoft itself.'
  - '[PAGE 146]


    As we look at these four frameworks, and port Hector''s application to each, bear
    in mind that we can''t compare and contrast every aspect of the frameworks. This
    isn''t a book about comparative web development; it is a book about Ajax and how
    to use it to make applications today. We hope that these server-side chapters
    give you the introduction you need to evaluate your current platforms are approaching
    Ajax, and how other frameworks you might not be familiar with tackling the same
    problems with different strategies. If you want to read more about comparative
    web development, we suggest XXX.


    # 8.1 Different Strategies for Integration


    There are several strategies that development teams choose for integration Ajax
    with their framework. The choice largely depends on the philosophy of the framework
    team: should developers be using visual tools for assembling the application?
    Are web applications really about HTML? Should my server-side code the primary
    metaphor for the entire application? In general, the strategies fall into three
    major categories: visual tool support, custom tag libraries (and helpers), and
    ORB-like removing.


    # Tooling


    Some frameworks are built around the idea of using visual development tools for
    creating the view artifacts. Examples are the ASP.NET framework with its support
    in Visual Studio .NET, and the JSF toolkit for Java with support in several Java
    IDEs. The aim of such frameworks are to provide developers with use components
    that are in charge of their own client-side rendering (like data tables and pickers).
    These are assembled into a unified page. The components themselves are manipulated
    through a series of declarative properties that affect everything from their visual
    style to the component''s lifecycle.


    These frameworks are now integrating Ajax support through these declarative properties.
    In fact, ASP.NET has had such support for some time now. The programmer merely
    selects one of the properties (like, updating for the data table) which enables
    in-page callbacks to the server to refresh data. The programmer might not even
    be aware that the result is, in fact, Ajax, just that the component now exhibits
    the desired behavior.'
