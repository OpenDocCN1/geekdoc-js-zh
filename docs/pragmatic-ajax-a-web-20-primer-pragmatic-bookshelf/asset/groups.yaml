- md: "\nfew minor changes to our code. First, we need to create some sort of global\
    \ state that tracks the current zoom level of our map. Second, we need to reference\
    \ this state in the all relevant places in our code (just one, actually).\n\n\
    Let's start with the global state. We'll create a variable to track the current\
    \ zoom level, and while we're at it, add a constant (in the form of a two-dimensional\
    \ array) for declaring the different sizes of the inner div:\n\n```\nvar zoom\
    \ = 0;\nvar zoomSizes = [ [ \"2000px\", \"1400px\" ], [ \"1500px\", \"1050px\"\
    \ ];\n```\n\nNow, in matter of cleanliness, we'll change the first line of our\
    \ init method from this:\n\n```\nsetInnerDivSize('2000px', '1400px');\n```\n\n\
    to this:\n\n```\nsetInnerDivSize(zoomSizes[0], zoomSizes[1]);\n```\n\nThere's\
    \ just one other place we need to wire in the zoom support: our checkTiles() function,\
    \ which creates the img elements for the tiles and gives them their URL. We need\
    \ to change this hard-coded zoom level code:\n\n```\nvar tileName = \"x\" + tileArray[0]\
    \ + \"y\" + tileArray[1] + \"z0\";\n```\n\nto this:\n\n```\nvar tileName = \"\
    x\" + tileArray[0] + \"y\" + tileArray[1] + \"z\";\n```\n\nAll that remains is\
    \ to implement the toggleDiv() function, which we've done here:\n\n```\nfunction\
    \ toggleDiv() {\n  zoom = (zoom == 0) ? 1 : 0;\n  var innerDiv = document.getElementById(\"\
    innerDiv\");\n  var imgs = innerDiv.getElementsByTagName(\"img\");\n  while (imgs.length\
    \ > 0) innerDiv.removeChild(imgs[0]);\n  setInnerDivSize(zoomSizes[0], zoomSizes[1]);\n\
    \  checkTiles();\n}\n```\n\nNothing tricky: swap the value of the zoom variable\
    \ between 0 and 1, delete all the \\<img` elements from the inner div, change\
    \ the size of the inner div based on the zoom level, and finally, invoke checkTiles()\
    \ to rebuild the map with the new zoom level's tiles.\n\n![](img/e950a16d093a2ad996943265f0f0b6cd_69_0.png)\n\
    \n# Figure 4.9: Ajaxian Maps Zoomed Out\n\nAnd now, we have zooming in our map\
    \ application! Cool. Figure [4.9] shows the zoom feature in action, with our map\
    \ zoomed to the smaller size.\n\n# Step 7: Push Pins and Dialogs\n\nThe final\
    \ feature: adding push pins with alpha transparency that when clicked show a dialog\
    \ that has alpha transparency. The hardest part here is actually creating the\
    \ images. We've created two images to serve these purposes, and they're available\
    \ at http://www.ajaxian.com/pragajax/code/ama and http://www.ajaxian.com/pragajax/code/maps/images/dialog.png,\
    \ respectively.\n\nWe're not going to implement a server-back end that searching,\
    \ etc., so just as with zooming we implemented a toggle, we'll implement a toggle\
    \ for our push pin. The graphic for the toggle is available at http://www.ajaxian.com/pragajox/code/amaps/images/pushpintoggle.\n\
    \nWe will place the push pin in right next to the zoom toggle by adding a new\
    \ div for:\n\n```html\n<body onload=\"init()\">\n  <p>\n    <h1>Ajaxian Maps</h1>\n\
    \  </p>\n  <div id=\"outerDiv\" style=\"position: absolute; top: 10px; left: 10px;\
    \ z-index:1\">\n    <img src=\"resources/zoom.png\" onclick=\"toggleZoom()\"/>\n\
    \  </div>\n  <div style=\"position: absolute; top: 10px; left: 87px; z-index:1\"\
    >\n    <img src=\"resources/pushpin.png\" onclick=\"togglePushPin()\"/>\n  </div>\n\
    \  <div id=\"innerDiv\" style=\"z-index:0\">\n    The Rain in Spain falls mainly\
    \ in the plains.\n  </div>\n</body>\n```\n\nNow we need to implement togglePushPin(),\
    \ frankly, it is a piece of cake. We'll just add an absolutely positioned image\
    \ with a z-index of 1 to the inner div, add an onclick handler to it, and where\
    \ handler to display the alert at an absolute position above the push pin:\n\n\
    ```\nfunction togglePushPin() {\n  var pin = document.getElementById(\"pushPin\"\
    );\n  if (pin) {\n    pin.parentNode.removeChild(pin);\n    var dialog = document.getElementById(\"\
    pinDialog\");\n    dialog.parentNode.removeChild(dialog);\n  }\n  var innerDiv\
    \ = document.getElementById(\"innerDiv\");\n  var image = document.createElement(\"\
    image\");\n  image.src=\"resources/image.png\";\n  image.style.position = \"absolute\"\
