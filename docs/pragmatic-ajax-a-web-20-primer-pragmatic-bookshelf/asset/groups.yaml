- md: "\n```html\n<input type=\"button\" value=\"Toggle\"\nonclick=\"Element.toggle('up',\
    \ 'down');\"/>\n```\n\nTo be sure, we don't always want to toggle. Element also\
    \ exposes arguments, which each takes a variable number of elements as arguments,\
    \ and ensures that each has its display property set correctly. Sometimes, toggling\
    \ isn't enough. Setting an element's display property to 'none' renders the rest\
    \ of the page layout as though the element did not exist in the DOM. However,\
    \ the mere existence of the element contained forms elements, for example, would\
