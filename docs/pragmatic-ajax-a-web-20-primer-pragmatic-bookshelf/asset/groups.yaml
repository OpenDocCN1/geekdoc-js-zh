    \n记得之前 ?? ?? 中的图吗？那一章查看了处于底层的框架，移除了工具包。本章向图表移动了一层，检查直接处理 UI 问题的工具包。事实证明，两者有大量的重叠。\n\
    \n# Prototype\n\nPrototype 库构建在基础 JavaScript 库（特别是 Scriptaculous）之上，这里提供了许多功能。Prototype\
    \ 是一个相对简单的 JavaScript 文件；截至版本 1.4.0_pre2，它只有 1041 行代码，但它在处理浏览器中的 UI 问题方面发挥了巨大的威力。我们在早期的章节中已经涵盖了\
    \ Prototype 在远程调用方面的作用。现在我们将检查它是如何替换标准的 DOM 和 CSS 惯用法来操作 UI 元素的。\n\n## 普通类型的扩展\n\
    \nPrototype 向其词汇表中添加了一系列实用的实用方法，要么通过提供全局可用的函数，或者在某些情况下扩展 JavaScript 或 DOM 中的现有类型。由于\
    \ JavaScript 类型可以在运行时扩展而无需修改原始源代码（动态语言的定义），因此这执行起来相对简单。结果是 Prototype 可以为常见功能提供极其实用的快捷方式，但以最自然的方式呈现：即作为我们期望出现此类特征的类型的属性和方法。\n\
    \n在 Ajax 库出现之前，DHTML 应用中最常见的两行 JavaScript 代码是：\n\n```javascript\nvar myElem =\
    \ document.getElementById('some_element');\nvar myValue = document.getElementById('some_other_element').value;\n\
    ```\n\n虽然这并不特别突出，但它很难阅读，并且甚至可以让最简单的函数也难以扫描和理解。请记住，带宽（即使在今天）也是一种昂贵的资源。因此，我向你介绍目前的\
    \ JavaScript 压缩器，你可以通过它们消除脚本中的所有空白以加快下载。鉴于上述代码无处不在且经常重复，寻找一种最小化这些语句的表面积的方法是有意义的。Prototype\
    \ 将它们替换为以下几行：\n\n```javascript\nvar myElem = $('some_element');\nvar myValue =\
    \ $F('some_other_element');\n```\n\n更好的是，$F 可以接受任意数量的 ID 并返回一个匹配这些元素的 Array。\n\
    \n```javascript\nvar elems = $('element_one', 'element_two', 'element_three');\n\
    for(var i=0;i<elems.length;i++) {\n  elems[i].value = 'changed';\n}\n```\n\n这种技术有一个主要的陷阱，Prototype\
    \ 并不会检查你传递的 ID 在文档内是否有效。在上面的情况下，如果没有 id 为 `element_two` 的元素，调用仍然返回一个长度为 3 的数组。然而，第二个元素是\
    \ `null` 而不是 DOM 节点的引用。此外请记住，$F() 只对输入元素有效。如果你正在寻找任意 DOM 节点包含的文本，$F() 是没用的。\n\n\
    ## innerHTML 的局限性\n\n根据 IE 的文档，`innerHTML` 属性对于以下包含标签是只读的：COL, COL-GROUP, FRAMSET,\
    \ HTML, STYLE, TABLE, TBODY, TFOOT, HEAD, TITLE, TR。这意味着你不能使用 `innerHTML` 属性来设置表格行的内容。这在所有浏览器中都能正常工作，但对于跨浏览器效果来说可能是严重的限制。\n\
    \nPrototype 还扩展了 document 对象，包含了一个新的 `getClassName()` 方法。你传入 CSS 类的字符串名称，该函数将收集\
    \ DOM 中所有包含该类的元素。无论该名称是元素列表中的第一个还是唯一的项，Prototype 都能找到它。\n\n```html\n<div id=\"\
    one\" class=\"class1\">\n<div id=\"two\" class=\"class2\">\n<div id=\"three\"\
    \ class=\"class1\">\n<div id=\"four\" class=\"class1 class2\">\n<script type=\"\
    text/javascript\">\nvar classOn = document.getElementsByClassName('class1').length;\
    \ // 3\nvar classTwos = document.getElementsByClassName('class2').length; // 2\n\
    var classThrees = document.getElementsByClassName('class3').length; // 0\n</script>\n\
    ```\n\n尽管此此方法只接受单个类名。如果你正在寻找实现列表之一的元素，由你来完成任何类型的并集。\n\n一旦你能够成功从 DOM 中检索节点，下一步就是操作它们。最常见的操作之一就是通过重置其\
    \ `innerHTML` 属性的值来更改节点的内容。`innerHTML` 只是属性内容的字符串表示。如果你用格式化适当的 HTML 填充它，浏览器将将其渲染出来。当你检索时，你可能希望保持原始格式的标签结构。其他时候，你可能实际上想将标签作为字符串显示，而不是被渲染为\
    \ HTML。Prototype 扩展了 JavaScript String 类并带有新方法。`escapeHTML()` 返回 `innerHTML`，但会对任何\
    \ HTML 标签进行转义，以便它们可以作为文本显示。`unescapeHTML()` 执行相反的操作。这在 HTML 页面内显示 HTML 源码非常有用。\n\
    \n## 用于 UI 的 AJAX 和 JavaScript\n\n最后一种情况是你想完全消除标签。想象一个包含参考文献条目的 `div`，其渲染使得书名带有下划线，作者姓名加粗。你想将其作为数据检索；任何嵌入的样式标记（或\
    \ `<b>` 标签）都是多余的。String 现在有了一个 `strip-tags()` 方法，它可以从输出中消除角括号（及其内容）。除此之外保留空白，允许将\
    \ HTML 视为原始数据。\n\n# Element\n\nPrototype 引入了一个新类 Element，用于控制 DOM 节点的某些基本样式属性。Element\
    \ 是一个静态类，即你无需创建它的实例即可访问其功能。它的各种方法都接受元素 ID 或元素本身作为参数并对其执行某些操作。\n\n我们花费大量时间隐藏和显示\
    \ DOM 树的节点。例如，错误信息在验证失败之前是不可见的，或者折叠节点。网页的大部分动态特性封装在数据块的神秘出现和消失中。实现该点的标准 JavaScript\
    \ 策略使用 `element.display` 属性。\n\n```html\n<div id=\"hideOrShow\">\n  你可以开启我。\n\
    </div>\n<input type=\"button\" value=\"Toggle\" onclick=\"toggle('hideOrShow');\
    \ />\n```\n\n```javascript\n<script type=\"javascript/javascript\">\nfunction\
    \ toggle(elemName) {\n  var elem = document.getElementById(elemName);\n  if(elem.style.display=='none')\
    \ elem.style.display = '';\n  else elem.style.display = 'none';\n}\n</script>\n\
    ```\n\nElement 提供了 `toggle` 命令完成了相同的事情，但额外的好处是可以向单个调用传递任意数量的元素名称（或元素）。Toggle 会遍历所有参数，轮流切换每个参数的状态。这为切换元素的可见性提供了一种方便的方法。\n\
    \n```html\n<div id=\"up\">\n  <img src=\"images/up.gif\"/>Up\n</</div>\n<div id=\"\
    down\" style=\"display:none\">\n  <img src=\"images/down.gif\"/>Down\n</div>\n\
    ```\n"
