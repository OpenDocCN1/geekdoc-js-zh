    # Watch That Back Button!


    Two things set the World Wide Web apart from everything that came before it: the
    back button, and the bookmark. Applications historically were guided tours. Users
    were encouraged to follow certain paths through the information provided. At best,
    users might be able to search for a specific item or screen and navigate directly
    to it. If they moved on, the only way to get back was to run the search again.
    And even this was a rare enough feature for an application. Consider Quicken circa
    1998, or those multimedia encyclopedias we all bought back in ''96. You had tables
    of contents, and search capabilities, but no notion of the history of your actions.


    The back button isn''t just a button; it is a symbol of freedom. It means you
    are free from the shackles of the guided tour. You forge your own path through
    the information at your fingertips, and can retrace your steps at your leisure.
    You become the master of the application, instead of the other way around. Don''t
