    # 三幕剧的故事


    这将由一个完全出乎意料的实体提供。以下是关于一个开发团队、那次火花，以及它如何改变我们处理 Web 软件的方式。


    ## 1.1 三幕剧的故事


    Hector 是一家 Web 应用开发商店的项目经理。他拥有丰富的 Perl CGI、ASP、Servlet 和 JSP 开发经验，Hector 算是个见多识广的人。在过去的一年里，他的团队一直在为一家在全球范围内设有办公室的大型财富500
    强公司构建一个 CRM 应用程序。该应用程序曾是一个绿屏大型机程序；而现在公司希望利用互联网的巨大覆盖范围，将应用程序部署到每个办公室。


    Hector 和他的团队将精力集中在应用程序的服务器端。他们一直使用 Java 社区的现代 MVC 框架之一来实现业务逻辑；使用高性能持久化框架来访问数据库；使用基于消息的基础设施来连接其他系统。


    ### 昨天


    在客户端，Hector 和他的团队已经成为 CSS 的大师。页面的外观随他们随心意欲；当客户想要圆角时，他们就能得到圆角。悬停颜色？那轻而易举。多种配色方案？没问题。事实上，Hector
    和他的团队很久以前就达到了一个不再真正担心用户界面的程度。要知道，Web 是单向的：它本质上是分发静态文档。当用户想要更多数据时，他们必须经历整个界面的刷新。从效率的角度来看这并不最优，但
    Web 就是这样工作的，用户也已经学会了忍受。


    然后，在几周前的某时候，Hector 的客户来参加了会议。这位客户通常是一个非常有礼貌、随和的人。他理解 Web，也理解为了获得互联网的覆盖范围而必须接受的限制。事实上，Hector
    从未见过他真正发火。直到这次会议。


    他一进门，团队就知道事情不妙。他带着笔记本电脑，而他以前从不带电脑。当他冲进房间时，团队成员环顾桌子：我们到底干了什么什么？客户坐在了桌旁。


    ### 今天


    自从那次会议以后，Hector 和他的团队一直像火如荼一样地重新思考用户界面。Hector 出去了解这里发生了什么，Google 是如何可能完全忽略常识并做出这种事情的。他偶然读到
    Jesse Garrett 的的一描述这种称为 Ajax 的东西。从那以后他一直在钻研，学习他能学会关于这种制作互联网应用的新方法的一切。


    团队正在重新实现 UI。他们正在使用 JavaScript 和 HTML5 技术来提供更动态的体验。最重要的是，他们开始利用现代浏览器中可用的一个有用对象，即使用
    `XMLHttpRequest`（简称 XHR）。这个方便的小家伙让 Hector 和他的团队能够从服务器请求并接收新数据，而无需重新加载页面上的所有内容。


    换句话说，Hector 牵头了从 Web 1.0 到 Web 2.0 的转变。他的客户又开心了。


    ### 明天


    Hector 的下一步将是什么？他的团队正在学习大量的 JavaScript，以及比他们以前学过的多得 CSS。团队对结果非常兴奋：用户体验就像任何其他应用程序一样，现在团队不需要像管理应用程序本身那样管理安装程序了。但他们意识到这一切也有负面影响。


    现在，他们正在编写大量的 代码。事实证明，所有的页面操作和 XHR 访问都需要大量真实的、实实在在地的代码。尽管 JavaScript 看起来很像 Java，但他们发现它实际上是完全不同的野兽。现在他们有两个代码库需要管理、测试和维护。


    所以 Hector 必须找到解决这些问题的方法。他将会看到大多数 Web 应用开发框架正在完全将 Ajax 工具整合到它们自己的套件中。很快，Hector
    和他的团队将利用 Tapestry 组件、Spring 标签库、ASP.NET Web 助手和 PHP 库来利用 Ajax，而无需引入第二工作模式。Ajax
    开发的未来是完全的、隐形的集成。这正是 Hector 所需的。


    ## 1.2 Google Maps：缺失的火花


    Google Maps (http://maps.google.com) 真正点燃了 Ajax 之火。而 Google 只是做这件事最出乎意料的候选人。想想是什么让
    Google 最初就一夜成功：最好的搜索结果和世界上最极简的 UI。它是一个白页面，中间有一个文本框和一个按钮。没有比这更极简的。如果 Google 有配乐，那将是
    Philip Glass 写的。


    当很明显 Google 将进入在线地图分页领域时，我们预期会有类似的东西。一种更直接、更侵入性的查看地图的方法。这正是我们得到的；我们没有得到的正是我们预期的。Google
    通过巧妙地使用 XHR 回调，提供了第一个页内滚动的地图。如果你想看下一格地图面板，Google 就会去获取并将旧的面板滑出视野。没有了杂乱的页面刷新；没有重新加载大量未改变的文本。特别是，不需要等待大量广告刷新。只有一个地图，以地图应该有的方式工作。


    然后我们点击大头针并得到了信息气泡。里面有实时文本。还有一个投影影。它是一个白页面，中间有一个文本框和一个按钮。没有比这更极简的了。如果 Google 有配乐，那将是
    Philip Glass 写的。


    （注：原文此后存在大量重复文本，翻译已按格式要求对应处理）


    ## 1.3 什么是 Ajax？


    ''Ajax'' 的名称代表异步 JavaScript 和 XML（Asynchronous JavaScript and XML）。它是允许 Web 页面在不重新加载整个页的情况下异步更新的技术set。这提供了更有交互性和响应性的用户体验。


    - 异步 JavaScript

    - 基于 JavaScript 的 DOM 操作

    - 基于 URL 的触发

    - 数据缓存


    - XML 格式

    - JSON 格式

    - HTML/CSS

    - 纯文本

    - 其他数据格式


    （注：原文此处后存在大量重复文本，翻译已按格式要求对应处理）


    ## Ajax: 架构


    Ajax 令人兴奋的演进在于你如何构建应用程序。让我们先看看传统的 Web：


    - 为应用程序的每个事件定义页面：查看项目、购买项目、结算等。

    - 每个事件或操作都向浏览器返回一个完整的页面。

    - 该页面渲染给用户。


    这在现在看来很自然。在 Web 创业初期这是合理的，因为当时的 Web 并不是关于应用程序的。Web 最初更像是一个文档库；一个你可以简单链接文档的世界。它是关于文档和共享，而不是任何意义上的交互。


    Ajax 开启了一种新的架构。这种架构的重要部分是：


    - 小型服务器端事件：现在 Web 应用程序组件可以向服务器发送小型请求，获取信息，并通过更改 DOM 来完善所看到的页面。无需刷新刷新。

    - 异步：向服务器发布的请求不会阻塞浏览器。用户可以继续使用应用程序的其他部分，UI 可以更新以提示用户正在进行请求。

    - 基于任何：我们可以根据用户的几乎任何行为与服务器进行通信。现代浏览器捕获的大多数与操作系统相同的用户事件：鼠标点击、鼠标事件、按键等。任何用户事件都可以触发异步请求。


