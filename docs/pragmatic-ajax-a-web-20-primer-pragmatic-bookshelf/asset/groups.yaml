    # Chapter 7


    # Ajax UI, Part II


    In the last chapter, we started to look at some of the available Ajax JavaScript
    libraries to drive the user interface in a browser. Understanding how these libraries
    help you more efficiently control the UI is Step 1. Step 2 is understanding what
    you should do with your new-found tools.


    This chapter will present some of the standard techniques for utilizing Ajax on
    the UI. We''ll talk through validation, notification and data management strategies
    that have proven themselves to increase the utility AND usability of web applications.
    Later, we''ll talk about some anti-patterns, too, the things you should avoid
    and the tests you should employ when Ajaxifying your application. This chapter
    isn''t exhaustive treatise. Our intent is to give you a set of foundational tools
    for deciding how to (and when not to) proceed.


