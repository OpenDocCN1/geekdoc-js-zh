    # 7.3 Conclusion


    In this chapter, we''ve talked about some common patterns for making effective
    use of Ajax in the UI. For the most part, what we''ve shown how to use Ajax to
    make web pages respond more like the rest of the user interfaces that our customers
    have grown accustomed to. Alerting our user to change data, or that have committed
    errors in their data entry are all just ways of increasing the responsiveness
    of the application while keeping with'
