    \ Events Outside of HTML)\n\n到为止，我们展示了 JavaScript 事件函数可以通过 HTML 属性连接到节点。这是一种常见的做法，尽管有一类程序员（我们称之为“纯洁主义者”）对这种用法表示不满。尽管\
