    ## Chapter 6


    ## Ajax UI, Part I


    In the last several chapters, we gave you an earful about what Ajax is, what it
    isn''t, and where it came from. By now, you''ve seen the “asynchronous” and “xml”
    parts. Over the next two chapters, we''re going to introduce you to the “JavaScript”
    and flashy UI parts of the framework. You''ll get to see the CRM application grow
    into a full-fledged rich client application and learn some of the emerging standard
    patterns for Ajaxifying the UI. Perhaps most importantly, we''ll walk you through
    a cautionary tale about going too far, and knowing when to say.


    ### 6.1 Ajax and JavaScript for the UI


    Dynamic HTML. The words roll around your brain and make you think of Nirvana,
    Lewinski and Razorfish. DHTML. Most readers might be wondering what''s Ajax got
    that HTML didn''t have? The answer, it turns out, is fairly complex. But it starts
    with maturity.


    When we were doing DHTML apps back in the ''90s, browsers were still duking it
    out the best way to render tags. Heck, we didn''t even have <div> tags until the
    late ''90s. Cascading stylesheets were just coming out, and the language hadn''t
    settled. There were browser-specific extensions to the DOM and the CSS language,
    and browsers couldn''t even be trusted to render their own extensions properly
    on a consistent basis.


    Fast forward to 2005. Browsers are still disagreeing about the best way to render
    tags, and there are still browser-specific extensions to worry about. But the
    amount of commonality betwen modern browsers has grown immensely in the intervening
    years, leaving a much greater common ground. Gone are the days when you had to
    have browser-specific rendering of simple CSS styles. We have a much broader scope
    of acceptable UI techniques that will work anywhere. Now this kind of common ground,
    which eliminates the need for vast tracts of browser-specific JavaScript and CSS,
    makes the development of rich client apps much more straightforward and accessible.


    Further, when we were developing DHTML applications then, we didn''t have the
    benefit of universal XMLHttpRequest support. IE4 had it built as an ActiveX component,
    but that can hardly be considered universal. Justin remembers telling the hard
    Windows web developers it in ''99'' and getting a lot of odd stares in response,
    so even for those developers to whom it was available, it wasn''t widely used.
    Without an asynchronous, embedded channel back to the server, DHTML applications
    were just about pop and flash. They added only marginal usability improvements
    and of themselves, and if we wanted to make them talk back to the server, we ended
    up jumping major hoops.


    Think of that ubiquitous DHTML widgets, the tree nav. It was easy to write DHTML-based
    trees. We involved a couple of CSS styles, so once click handlers and some crossed
    fingers, but it didn''t amount to effort. And, in return, we got collapsible,
    expandable tree navigation. What we didn''t get, unless we put in endless hours
    of effort, was a way to update versions of the tree from the server without reloading
    the whole thing. So we ended up putting the tree in a frame, all by its lonely
    self, and refreshing it en toto whenever the app demanded. This made for tortured
    JavaScript and a less ideal user experience.


    We went so far as to invent the iframe to allow us to execute background threads
    of operation. As we saw previously, the iframe is a convenient, nonstandard, way
    to cause a secondary request to be sent to the server. JavaScript can modify the
    src= attribute to cause a new request to be sent. This seems, at first glance,
    to provide everything. Dig down, though, and you''ll see so problems. iframes
    provide no graceful method for checking on the state of a request; once fired,
    either the iframe renders its results or it doesn''t. Secondly, the iframe automatically
    renders the response sent from the server. If the response isn''t HTML, the iframe
    must be navigated, DOM-style, to retrieve the results. All this is effective,
    but hard efficiently, and certainly not elegant.


    The ability to exert fine-grained control over pieces of the UI only becomes profound
    when we also exert similar fine-grained control over the data we are retrieving
    from the server. Being able to flash the background color of a <div> tag as the
    user mouses over it is pretty; being able to auto-update a text box as the user
    types into it is an actual usability improvement. The code to control the UI of
    the latter is not harder than for the former; it is the access to an asynchronous
    trip to the server to fetch more information that makes it special.


    ### Ajax Encourages OO Over DOM


    The biggest change from HTML to Ajax has to do with the way we think about JavaScript
    in the browser. In old HTML, we wrote JavaScript to manipulate the DOM; we treated
    the DOM as a giant repository of dumb entities, each with a collection of styles
    applied to it. We walked the DOM with nightmarish


    ```

    element.parent.sibling.child

    ```


    style code, and when we got there, we set text properties to interpreted as changes
    in the rendering engine. We wrote our common code as a series of functions, devoid
    of organizing classes or conventions. None of this looked like the server side
    code we were writing; it certainly did not feel modern in any way. JavaScript
    was an adjunct to our “real work,” and showed.


    Ajax strives to treat JavaScript in the browser as the first-class programming
    environment it can. Instead of writing procedural programs, we write class libraries
    to encapsulate our behavior. Instead of treating the DOM as a collection of dumb
    elements, we treat it as a hierarchy of types. Instead of thinking of them as
    properties of objects, to be constructed and parsed, modified individually. We
    write modern OO code, complete with error handling, instance methods, static methods
    and type hierarchies.


    Even better, though, we write this modern OO code using a language more expressive
    than the statically typed languages we use on the server. With JavaScript, we
    can extend types without modifying the base code. If we want to add functionality
    to the document object, we can declare a new function and supply it with an anonymous
    definition. This function has full access to the instance data of document, and
    can be called by any other type contained in our JavaScript. Functions can be
    sent around like data objects, invoked without the originating instance. In other
    words, metaprogramming without extraneous reflection syntax.


    We say that Ajax encourages this style of programming. There is not inherent in
    Ajax that mandates this, however. You can happily write the same old style of
    procedural, DOM-oriented JavaScript code and achieve Effects. The frameworks that
    have sprouted around Ajax, though, all eagerly pursue the more modern, object-oriented
    style of programming. They supply common APIs and types through which to modify
    the look and behavior of elements in the DOM. They provide better ways to navigate
    the DOM for items. Typically, these frameworks accomplish these goals object-oriented
    libraries and metaprogramming. For example, the Scriptous library adds a new method,
    getClassName(), to the document object at the root of the DOM. By injecting this
    method into the existing class, we get a more convenient method for navigating
    our DOM tree, through OO methods.


    ### Common UI Frameworks


    With the creation of Ajax, there has been a concomitant explosion of JavaScript
    libraries to help users take better advantage of the technology shift. Instead
    of making users find their own paths through the desert to the Oasis, these libraries
    drastically shorten the learning and adoption curves for Ajax. We''ve already
    talked about them at some length in the previous chapter; there, we focused on
    the libraries'' efforts to encapsulate the longterm features of JavaScript. Here,
    we will discover what they do for our UI code.


    The first area is DOM navigation. The DOM model is a beast to get around; as much
    as it seems navigating an XML infos be a highly standard operation, there can
    be interesting differences between navigation commands and their results as you
    move from browser to browser and version to version. Even if there were, though,
    navigating the DOM requires too much intimacy with the overall of the current
    page. Puttering around the DOM tree, using parent references and children collections
    often leads to finding the wrong element, or finding no element at all.


    The major UI frameworks find ways to help you around this problem. In addition
    to the standard getElementById() method, these frameworks allow you to discover
    elements by class, style, by tag, and a variety of other options. They give you
    ways to treat elements and

