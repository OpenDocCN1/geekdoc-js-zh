  - "[PAGE 122]\n\n# Validation Error Messages\n\nIn addition to displaying error\
    \ messages next to the fields they are associated with, it is also common (and,\
    \ dare we say, appropriate) to include a general message area that provides a\
    \ summary of all error messages. Adding one is left as an exercise for the reader.\n\
    \nThe input <span>s will be marked with a specific CSS class so that we can control\
    \ their look (in this case, we'll style the text red). Plus, we'll update the\
    \ input fields to have a unique ID, which we can use to extract the values at\
    \ runtime, and the new <span>s also has IDs so we fill them in with new innerHTML\
    \ after validation.\n\nSecondly, we'll need to hook our validation code up to\
    \ an event on the input fields. The standard event for this purpose is the onblur\
    \ event. This event fires whenever the user changes away from the field, by clicking\
    \ elsewhere or tapping away from it. We'll call a JavaScript method from the onblur\
    \ event that will perform the validation. The method is called validateField(),\
    \ and we will examine it more in a minute. Now know that the function takes four\
    \ parameters:\n\n+   - id: the id of the input field being validated\n- required:\
    \ whether or not this field is a required field\n- validation: the validation\
    \ rule to execute on the data\n- update: the id of the field used to display the\
    \ error message\n\nThe new version of the UI elements looks like this:\n\n```\n\
    <tr>\n  <th>Customer Name:</th>\n  <td>\n    <input type=\"text\" id=\"name\"\
    \ name=\"name\" onblur=\"validateField('name', 'required', 'name', 'nameError')/>\n\
    \  </td>\n  <td colspan=\"2\">\n    <span style=\"border-bottom: solid 1px red;\
    \ color: red; id=\"nameError\"></span>\n  </td>\n</tr>\n<tr>\n  <th>Address:</th>\n\
    \  <td>\n    <input type=\"text\" id=\"address\" name=\"address\">\n```"
