    \ required |\n|---|---|\n| Address: | |\n| Zip: | State: |\n| City: | |\n\nAdd\
    \ Customer\n\nDone | Adblock\n\nFigure 7.3: Form processing validation request\n\
    \n```html\n<td colspan=\"2\">\n<span style=\"border-bottom: solid 1px red; color:\
    \ red; id=\"nameError\">\n</span>\n</td>\n</tr>\n<tr>\n<td th:Address><td>\n<input\
