    \  this.start = start;\n  this.end = end;\n  this.dimensions = start.length;\n\
    \  //simple function to find point on an n-dimensional, straight line\n  this.getValue\
    \ = function(n) {\n    var retVal = new Array(this.dimensions);\n    for(var i=0;\
    \ i<this.dimensions; i++)\n      retVal[i] = ((this.end[i] - this.start[i]) *\
