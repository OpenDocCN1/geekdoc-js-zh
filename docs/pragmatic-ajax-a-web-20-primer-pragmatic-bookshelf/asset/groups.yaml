    We mentioned just a moment ago that the browser can''t fit the entire map in memory.
    Of course, dividing a single map into arbitrary number of tiles and then displaying
    all those at once would consume an equal amount of memory as the entire image.
    To compensate for memory limitations, Google Maps virtualizes the grid of tiles'
