    \n## Inserting Data\n\nShowing and hiding data is nice, but it implies that we\
    \ have a nice container dedicated for displaying that piece of data. Showing an\
    \ error message, for example, usually means that we have a hidden div or span\
    \ standing to take data, then display it to the user. Often, though, what we want\
    \ to add is more data to an existing element. Most commonly, we want to add items\
    \ to an already-visible list of items. The standard HTML way to do this is to\
    \ recreate a new version of the list items include the additions, then replace\
    \ the contents of the list with the new version. With Ajax, this would mean having\
    \ a server-side method which you call that sends the list back with any new items\
    \ appended. While effective, this might be extremely long-running, and the code\
    \ that generates the content of the list might, if it involved a database, mandates\
    \ at least a round trip to the datastore to re-fill the list.\n\nPrototype introduces\
    \ the Insertion class. Insertion allows us to add information to an existing container\
    \ without replacing what currently exists in the list. Insertion.Top() enters\
    \ the new data at the beginning of the container, while Insertion.Bottom() enters\
    \ it at the end. This means you can easily append single lines to a list without\
    \ re-rendering the whole list.\n\n```html\n<ul id=\"mylist\">\n  <li>one</li>\n\
    \  <li>two</li>\n  <li>three</li>\n</ul>\n<input type=\"text\" id=\"newval\"/>\n\
    <input type=\"button\"\n  onclick=\"new Insertion.Bottom('mylist');\n    <li>${(newval)}</li>\"\
    ;/>\n```\n\nKeep in mind that you have the full value you want rendered. In the\
    \ example, we are appending the text value of the input field to the bottom of\
    \ the list. We have to wrap it in the \\<li><li> tags in order to get it to render\
    \ as a list item; without those tags, the new value is just pasted as text inside\
    \ the list, which is rendered without the bullet, and as inline text.\n\nPrototype\
    \ actually goes a little further, and lets you append text around the container\
    \ as well. In all, Insertion offers four placements for your new data: Before(),\
    \ Bottom(), and After(). Figure 6.1, on the following page demonstrates where\
    \ each lives.\n\nThis is fairly powerful, since you can modify a section of the\
    \ page from which you do not have an ID (or there may be no ID at all).\n\n##\
    \ Forms\n\nWorking with forms has historically been a bit of a drag. Forms are\
    \ useful for one purpose: collecting data from a user. The input fields that exist\
    \ on a form, though varied in style, are essentially identical in nature. They\
    \ represent an item that a user can use to tell us something. Before Ajax and\
    \ the re-thinking of the DOM that it brought with, we had to treat forms and inputs\
    \ just like any other HTML elements, navigating the DOM to find them, modifying\
    \ their style properties to affect their behavior.\n\nPrototype gives us to think\
    \ about forms differently. Instead of representing a chunk of HTML that happens\
    \ to have input boxes embedded in it, Prototype encourages us to think of forms\
    \ as collections of data fields.\n\n## In-line elements\n\n| Before | Open tag\
    \ | Top | Internal Data | Bottom | Close tag | After |\n| :--- | :--- | :--- |\
    \ :--- | :--- | :--- | :--- |\n\n## Block elements\n\n| Before | | | | | | |\n\
    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| line break | | | | | | |\n\
    | Open tag | Top | Internal Data | Bottom | Close tag | | |\n| line break | |\
    \ | | | | |\n| After | | | | | | |\n\nUsing the library, we can manipulate the\
    \ properties of all the fields on a form simultaneously when that suits our needs,\
    \ and navigate them as an array of fields, not as scattered children in a subtree\
    \ of the DOM.\n\nThe vehicles for this change are the new classes Form and Field.\
    \ Field provides three major UI-related methods:\n\n- *select(): selects the current\
    \ value of the field\n- *focus(): moves the focus to the field*\n- *activate():\
    \ a combination of select() and focus()*\n\nFor example, you could create a form\
    \ with certain fields visible at all times, but a second set of advanced options\
    \ only visible when the user requests them. For convenience, you would want the\
    \ user to begin typing into the topmost field immediately upon making visible,\
    \ which you could accomplish with activate.\n\n```html\n<form action=\"postback.js\"\
    \ method=\"post\">\nFirst Name: <input type=\"text\" name=\"firstname\"/><br>\n\
    Last Name: <input type=\"text\" name=\"lastname\"/><br>\n<a href=\"#\" onclick=\"\
    Element.toggle('advanced_options');\">Advanced Options</a>\n<div id=\"advanced_options\"\
    \ style=\"display:none\">\nPet's name: <input type=\"text\" name=\"petname\"/><br>\n\
    Favorite color: <input type=\"text\" name=\"favoritecolor\"/>\n</div>\n</form>\n\
    ```\n\n## Beware After\n\nDon't get too carried away with Before() and After().\
    \ Imagine you have this:\n\n```html\n<ul id=\"mylist\">\n  <li>one</li>\n  <li>two</li>\n\
    \  <li>three</li>\n</ul>\n<input type=\"text\" id=\"newval\"/>\n<input type=\"\
    button\" value=\"Add Item\"\n  onclick=\"wrapList('mylist')\">\n<script type=\"\
    javascript\">\nfunction wrapList(listname) {\n  new Insertion.Before(listname,\
    \ '<h2>New Title</h2>');\n  new Insertion.After(listname, '</div>');\n}\n</script>\n\
    ```\n\nWhen you execute this result, the rendered DOM, you could see it like,\
    \ would be:\n\n```html\n<h2>New Title</h2>\n<ul id=\"mylist\">\n  <li>one</li>\n\
    \  <li>two</li>\n  <li>three</li>\n</ul>\n<input type=\"text\" id=\"newval\"/>\n\
    <input type=\"button\" value=\"Add Item\">\n</div>\n```\n\n```html\n</form>\n\
    ```\n\nForm offers three more UI related methods:\n\n- disable(): disables every\
    \ input field in the form (sets the background to gray and disallows changes)\n\
    - enable(): enables every input field in the form\n- focusFirstElement(): sets\
    \ the focus to the topmost field in the form\n\n## Position\n\nPrototype contains\
    \ several methods for understanding the current position of elements on a rendered\
    \ page. Specifically, they allow you to discover the relative position on an element\
    \ on a scrollable page, including whether the element is on the currently visible\
    \ portion of the page. If, not, you can retrieve the scroll offsets (horizontal\
    \ or vertical) to the element from the visible section. Most developers won't\
    \ use these features directly, but instead use frameworks that build on top of\
    \ them to provide higher-level features.\n\n## Script.aculo.us\n\nThomas Fuchs\
    \ has built on top of the base Prototype library to dramatically increase the\
    \ kind and effects that can be created with JavaScript. Script.aculo.us is the\
    \ result of his efforts. Where Prototype is focused on extending the baseline\
