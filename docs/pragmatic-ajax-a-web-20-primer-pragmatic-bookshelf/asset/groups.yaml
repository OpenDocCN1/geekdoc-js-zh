    # iframes


    Prior to the broad adoption of the XMLHttpRequest object, many web applications
    were using a hidden iframe to accomplish In-page round trips back to the server.
    An iframe is just like a normal HTML frame (a container that can be targeted at
    a URL and render the results) except that it is embedded in another page. These
    applications simply created an iframe of 0px, which caused it to refresh again
    a given URL in order to pull more data back from the server.


    While the technique is valid, and worked for many, there were two inherent problems.
    The first is, if you wanted multiple asynchronous requests, you had to have multiple
    iframes. This became a game of guessing how many you would need and embedding
    that many in the page, which is not a tremendous burden, just somewhat ungainly.


    More important is the question of coding intentionally: the use of iframe is a
    quintessential kludge. By that, we mean it''s the repurposing of a technology
    to do something it wasn''t quite meant to do. Though it works, it always feels
    a little like cheating. XMLHttpRequest, however poorly named, is an object specifically
    designed for initiating, monitoring, and harvesting the results of in-page postbacks.
    Programming against it feels natural, and lends itself to more readable (and therefore
    maintainable) code).


    A third issue, that mainly affects IE, is that the iframe issues audio feedback
    to the user whenever it makes a request. This comes in the form of a “click” sound,
    which can be jarring for the user since they usually have no other indication
    of ongoing asynchronous behavior.'
