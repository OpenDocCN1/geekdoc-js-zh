    # 书签让 Web 变得强大


    书签是后退按钮的亲表兄弟。它是用户控制的、浏览行为的元历史。现在书签索引页（欢迎页）没有像过去那样有用了。有了 Google 作为我们共享的书签，大多数人不再懒得去书签索引页了。只需运行
    Google，输入页面名称，然后点击生成的链接（甚至是点击“手气一向”按钮，尽管我们几乎从不这样做）。相反，我们使用书签进行深层链接（deep linking）。这意味着在你开始与应用程序或网站交互后的某个时间点，捕获其状态。可能是
    Amazon 上的搜索结果，或者是你在金融机构的当前持仓报告，或者是《纽约时报》上的某篇特定文章。


    深层链接意味着用户有暂停并返回你的应用程序的能力。如果状态被维护（cookie、长期会话、后端存储等等），并且用户可以指定在应用程序流的哪个位置恢复工作，那么他们就不会受制于你的时间表。我们经常发现自己正在某个应用程序上做某事，但被迫去接电话或赶着开会。我们希望在以后某个时间可以从离开的地方继续。


    所以我们把页面存为书签。如果我们回来并打开书签，结果却回到了索引页，我们会感到不悦。


    当用户到达一个 Ajax 化的页面时，地址栏中显示的 URL 是他们为了到达那里而输入或点击的任何内容。向浏览器添加书签时，它会制作地址栏中当前地址的副本。如果页面允许用户经过了成百上千次的交互，那么地址栏中的
    URL 与初始请求时完全相同。导航到书签的用户将始终回到页面的原始状态；基于 Ajax 的更改将被长期遗忘。


