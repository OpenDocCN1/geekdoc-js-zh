    standard conventions. Techniques like auto-updating text boxes allow customers
    to use our applications more efficiently. Sorting data, and drag and drop capabilities,
    make the UI more like the standard “thick” UI components of our desktop systems.


    As with anything, though, the trick is knowing when *not* to do it. The second
    half of our chapter was all about keeping ourselves focused on the most important
    point: usability. When these techniques make it easier for our users to accomplish
    a task, then the technique is successful. When they get in the way, when they
    cause our users to have to think about what they are doing, then we should reevaluate
    our decision. And above all, never surprise the user.'
