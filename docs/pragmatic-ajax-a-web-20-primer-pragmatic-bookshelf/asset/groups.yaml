    # 这并不全是鲜花与浪漫…… 136


    这种技术就足够了。但有时，你必须做得更多。也许是更改光标，也许是显示一个进度条。无论具体技术是什么，你都应该提供一种机制来警告你的用户：点击该链接、按下该按钮或进行任何操作，现在都已发送了请求，浏览器正在等待响应。


    # 不要重复轮子


    我们已经习惯了某些 UI 规范。现代操作系统及其窗口工具包为我们提供了某些抽象，这些抽象已经根于我们的意识中。例如，我们知道窗口是什么样子的。即使是我的父母，看到屏幕上出现一个带有外边框、顶部有标题、左上角或右上角有一些按钮的框时，也知道那个东西可以在屏幕上移动，并且可以关闭。我们知道按钮长什么样，以及恰当的操作是点击一下来按下。我们受过训练，窗口顶部边缘的文本可能意味着菜单，而且当我们把鼠标悬停在上面或点击它们时，它们可能会弹出一个小的子菜单。我实际上和我的家人做过这个实验。他们是
    Microsoft Windows 用户。如果我让他们坐到 Mac 面前，尽管实际的图形外观完全不同，他们仍然知道如何操作。他们不知道 Dock 是做什么的，但共同的抽象是显而易见的。同样，当他们坐在
    Linux 上的 Gnome 或 KDE 桌面时，一切都非常直观。


    网页教了我们一些额外的标准。现在，我们同意顶部或左侧边缘的文本可能是菜单，而将鼠标悬停在菜单上比点击它来显示子菜单更好。我们知道带下划线且通常是蓝色的文字——超链接将带我们进入新页面。文字旁边的方框是复选框，可以单独勾选或取消勾选；而灰色圆圈是单选按钮，点击其中一个会影响其他的。当光标变成一只小手手时，意味着我们悬停的任何东西上都是可以点击的。


    这些规范实现了通用的计算体验。它们是让用户无需在每次遇到新应用程序时都去“读说明书”（RTFM）的关键。它们让我们能够浏览网页，而网页实际上是由十亿只猴子设计的十亿个应用程序的积累。如果没有这些规范，每一个新网页都将是一种新的认知体验；我们必须花一天时间阅读帮助文档才能查看鹰的分数。网页将变得毫无用处。


    所以，不要自以为认为自己比集体更聪明。作为程序员和设计师，我们经常会陷入某种傲慢中，认为“我可以比最低公约数做得更好”。问题在于将“公约”误认为是“最低公约”。仅仅因为大家都这么做，并不意味着它是坏的。这种逻辑对我这个老古板来说是违背的，我对
    The Cure 和 Metallica 的痴迷源于一种信念：Phil Collins 绝不可能好，因为有这么多人在听他的音乐。


    例如，Ajax 让我们以正确的方式创建门户网站。（关于门户的进一步处理，请参见第 ?? 页 ??。）基本上，门户是一个在单个页面上显示多个内容区域的网站。可以是本地天气、当前登录该站的最后五封邮件、RSS
    馈等。每个内容区域都是自包含的，可以单独添加和删除，通常可以完全最小化，并拖动和重新定位。这让起了我们刚刚思考的内容……嗯，是什么来着……噢，窗口！门户中的内容区域就像窗口！我们目前有一套窗口设计规范，让用户知道如何操作它。这意味着一个优秀的门户网站看起来应该像下一页的图
    7.5。


    单个小部件是可以关闭和最小化的，发现它们是可拖动的，我们完全不会感到惊讶。诱惑是强化这一切——带有显性标题栏的圆角窗口，左下角点击即可关闭窗口的点。虽然我们是前卫设计的粉丝，但我们更喜欢在界面上斗争以弄清楚它是如何工作的。我们不那么喜欢被界面惊喜。坚持那些有效的方法。


    同样，基于页面的非标准交互向服务器发起异步调用，会让你的用户感到不知所措。将鼠标悬停在屏幕顶部明显的菜单上并导致菜单弹出是可以的，即使这涉及到（快速的）往返。在段落中的随机单词上移动鼠标时弹出菜单将令人惊恐。用户点击按钮时导致数据刷新是符合预期的。在用户点击链接时导致数据刷新可能会令人惊讶。老天爷，在开始抖动、吹气和挤压元素之前，请务必仔细思考。


