    ## 辅助标签（Helper Tags）


    集成 Ajax 的另一种方法是使用自定义标签库。像 AjaxAnywhere¹ 和 Ruby on Rails 这样的工具使用自定义标签库（或类似的结构）作为
    HTML 嵌入服务器功能的替代品。这些标签库（有时被称为辅助标签）由相应框架的模板引擎解析，然后由引擎根据自定义标签的属性生成客户端产物。


    结果是一个看起来像 HTML 的页面，但其实际内容是在解析时决定的。标签为将我们的服务器端代码集成到客户端模板提供了一层抽象。这是一种非常强大的能力，因为它允许开发者专注于单个产物（模板），而不是在模板和备用代码文件之间来回跳转。


    我们将在 ?? 的第 ?? 页查看 Ruby on Rails 的 Ajax 集成。


    ## 类似 ORB 的远程调用（ORB-like Remoting）


    我们与服务器框架集成 Ajax 的最后一类是使用类似 ORB 的远程调用将客户端 JavaScript 连接到现有的服务器端功能。使用 JSON-RPC、DWR（用于
    Java）、Ajax.NET 或任何 PHP 框架等工具，开发者可以为浏览器编写 JavaScript 代码，似乎可以直接访问服务器端域。这些框架的效果是，你的域代码现在可以在客户端层中复用，为两端提供了一个无缝的对象模型。


    我们将在 ?? 的第 ?? 页讨论 PHP 及其 Ajax 集成时，审视类似 ORB 的远程调用。首先，我们将查看所有 PHP/Ajax 集成项目的鼻祖 Sajax。接下来，我们将将其与一个较新的成员
    Najax 进行比较。


