    # Chapter 9


    ## Ajax with PHP


    PHP is the true choice for many web developers. It is free and open source, which
    means that it is widely adopted. For those who use it, they find that it is a
    pragmatic choice, one with a bustling community of users and developers. The community
    is so strong, in fact, that the library of available additions to the framework
    is quite large. If you find yourself wishing for a piece of functionality that
    isn''t in the PHP core, make sure you have Googled around a bit before running
    off and implementing it yourself. Chances are, someone in the PHP community has
    done that work already.


    This is true with the marriage of Ajax and PHP. There are several PHP-based frameworks
    out there, of various quality and richness of features. In fact, the first PHP
    frameworks were announced within days of the coinage of the term "Ajax". In this
    chapter, we will take a look at the most popular of these frameworks and will
    again rewrite Hector''s CRM application. We''ll finally focus on the server side
    of the application. Server-side framework integration means that we can utilize
    the abstractions we have available on the server to implement a decidedly client-side
    set of features. The JavaScript frameworks we talked about (Dojo, script.aculo.us),
    etc., will be put on the back burner for now (Dojo as we see what the server side
    can provide us).


    ### 9.1 The PHP Frameworks


    Back in ??, on page ?? we discussed the fact that Ajax support have been announced
    in JavaScript frameworks, right and center. Those frameworks were all written
    to run on the client, which in this case means within a browser. Server-side development
    frameworks face the same pressures for innovation that client-side frameworks
    do.


    We''ve long had support for client-side technologies in our server-side frameworks.
    From template-based view rendering technologies like JSP, ASP and RHTML, server-side
    objects with self-rendering capabilities like ASP.NET and JS components, these
    frameworks use a wide variety of methods to influence the client view. Now, they
    are adding the ability to generate JavaScript for the client to create Ajax effects
    and sometimes to hook up to server entities for data transfer. There are three
    major categories of Ajax integration support: visual tool support, tag libraries,
    and ORB-like remoting.


    ### 9.2 Working with Sajaj


    Let''s return to Hector and his CRM application. He''s decided to move his team
    to an open source platform, namely PHP. He''s convinced that team will be able
    to get more leverage by using an integrated Ajax framework. This means the team
    can add these new effects and callbacks without leaving the confines of PHP. We''ll
    first port the application to Sajax¹.


    ### What is Sajax?


    Sajax is one of the earliest Ajaxian web frameworks available, originally written
    for PHP. It is an open source project, and allows you to bind your web UI to server-side
    functions. It accomplishes this by exporting client-side JavaScript functions
    that invoke a Sajax bridge to the server-side code that is actually executed,
    wrapping it all in an XHR request.


    Sajax is an ORB-like remoting layer, which means that we will be able to first
    write the server side functions that we need (consisting of talking to the database,
    and returning the correct data back) and then bind our HTML UI directly to these
    functions. There will be no XMLHttpRequest object to be found, and you may even
    be surprised with some of the JavaScript calls that we can run, since we will
    not see them in the PHP code itself.


    There is some tension in the development community surrounding this kind of object
    remoting strategy. Some developers are very keen on


    > ¹http://www.modernmethod.com/sajax/


    # Sajax Language Support


    Sajax started with PHP and Coldfusion support, but now also supports:


    - ASP

    - Coldfusion

    - Perl

    - PHP

    - Python

    - Ruby


    If you do not see your favorite language, chances are Sajax will soon support
    it.


    using Web (XML) Services as the primary channel for communicating between application
    tiers. Depending on who you talk to, this can mean anything from a REST-ful, loosely
    coupled XML-over-HTTP architecture all the way to a WSDL, SOAP and WS.* implementation.
    What they have in common is a move away from object (and method) orientation and
    to a message transport and service oriented architecture.


    Object brokers, on the other hand, are entirely about enabling remote communications
    without disrupting the mental model of the object developer. You can tie client-side
    methods to server-side objects as though they were physically colocated, giving
    the illusion that there are no network calls and roundtrips separating the different
    entities. While this is a powerful abstraction, it is still just an abstraction.
    There are, in fact, network roundtrips involved and, if you look at the messages
    sent through surprisingly just like the messages sent through service oriented
    frameworks.


    Sajax chooses to expose its functionality through an object broker, thus placing
    a higher value on a standard experience for the developer across the physical
    application tiers. This might provide more efficiency at development time, but
    may come at the expense of efficiency at runtime. This is because any abstraction
    that hides the underlying remote nature of an architecture runs the risk of causing
    developers to forget about the costs of having such a remote system. It is the
    responsibility of developers when using such a framework to remember the costs
    associated with making remote calls and to program accordingly.


    # MySQLi and PEAR DB Interfaces


    The service code uses the original mysql PHP library. If you are running later
    versions of PHP you can use libraries such as mysqli and PEARDB.


    - mysqli offers increased functionality such such as support for prepared statements,
    and other performance related improvements.

    - PEARDB is a DBI/JDBC like database abstraction layer. This allows you to easily
    move between various databases.


    # Porting CRM to Sajax PHP


    In order to port the CRM application to Sajax, we will be changing the way we
    think about the application. Back in the chapters on JavaScript toolkits and frameworks
    such as Dojo and Prototype, we were very focused on the front-end HTML and JavaScript
    code, and little was mentioned about the back end. Now we will focus behind the
    scenes, and will use Sajax to generate the front end as much as possible. This
    means that instead of writing all of the JavaScript ourselves, we will have helper
    functions that can do magic for us.


    # Building Back End Functions


    Let us create PHP backend functions for the Zip to City/State server. We will
    build the get_city_state() function that will use a MySQL database to return the
    city and state for the given zip code. We will place this functionality in our
    PHP file, zipService.sajax.php, and will include it from our web-facing PHP code.


    We''ll start with the smallest things. We define some constants to hold information
    on the database itself:


    ```

    define(DB_HOST, ''localhost'');

    define(DB_USER, ''crmuser'');

    define(DB_PASS, ''crmpasswd'');

    define(DB_NAME, ''crm'');

    ```

