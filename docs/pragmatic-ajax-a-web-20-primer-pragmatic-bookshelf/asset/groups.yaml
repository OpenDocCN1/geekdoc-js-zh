    # The Backend


    We demonstrated how request city/state data from the server, but we never showed
    you how the server processed the request and generated the response. Unfortunately,
    this can be somewhat tricky to do; what programming language should we use to
    demonstrate the server process? Later in the book, starting with ??, on page ??,
    we talk fairly extensively about different programming frameworks for creating
    server processes that can interact with Ajax web pages; for now, take it on faith
    that there''s a server providing data to the page.


    # XMLHttpRequest


    The syntax we have used so far to create an instance of XMLHttpRequest is browser-specific.
    Microsoft''s Internet Explorer, the first browser to offer this feature, uses
