- md: "\n## Undefined\n\nThe undefined value is a first-class type in JavaScript.\
    \ Most commonly, it is the value provided by JavaScript for a variable that has\
    \ been declared, whose value has never been assigned. Some JavaScript implementations\
    \ also use it for the value of variables that have never been declared, though\
    \ this is less common, since most JavaScript interpreters allow for in-line variable\
    \ declaration.\n\nIt is important to note that it isn't merely a value. Though\
    \ it has a string representation ('undefined'), it is actually a first-class type.\
    \ This means that the `typeof()` operator, when applied to a variable with this\
    \ value, will return `undefined`.\n\nJava/C# developers may find it that no return\
    \ type returns a value, simply uses the return keyword at some point. It is perfectly\
    \ legal to create functions that branch and return a value in one path but not\
    \ in another. Variables that are assigned the result of a non-returning function\
    \ contain the special JavaScript value `undefined`.\n\nConsider this next example\
    \ snippet:\n\n```javascript\nfunction myFunction(a) {\n  return \"Hello\";\n}\n\
    function myFunction() { // <label=code.js.function/>\n  return \"World\";\n}\n\
    var myResult = myFunction(\"aValue\"); // <label=code.js.return/>\n```\n\nWhat\
    \ do you suppose is the value of myResult on line is? If you use a language that\
    \ supports method overloading, you'd probably expect the value to be Hello. In\
    \ fact, it's not. JavaScript does not support overloading; that is, it doesn't\
    \ match function invocations to function definitions based on the name and parameters\
    \ of the function; just the name.\n\nTherefore, there can be only one function\
    \ with a given name at runtime. If two or more functions are defined with the\
    \ same name, the version that was last processed by JavaScript is invoked. In\
    \ our example, that turns out to be the one defined on line.\n\nBecause a function's\
    \ parameters play no role in defining it, their presence is entirely optional.\
    \ In fact, there's even a way to reference an invocation's parameters without\
    \ declaring them—but we'll come back to that in just a bit.\n\n## The Function\
    \ Type\n\nEarlier, we talked about the four types of values in JavaScript (object,\
    \ number, string, and boolean) and hinted that more existed. Functions are in\
    \ fact a type in JavaScript. In fact, once you define a function using the traditional\
    \ syntax we saw earlier, a variable exists that references the function; the variable\
    \ takes on the same name as the function itself.\n\nConsider this next example:\n\
    \n```javascript\nfunction myFunction() {\n  // imagine that this function does\
    \ something\n}\nalert(typeof myFunction)\n```\n\nIf you execute this code in your\
    \ browser, JavaScript's built-in alert will cause a dialog to appear that displays\
    \ the type of the myFunction variable: the contents of the dialog will be \"function\"\
    .\n\nThis particular property of JavaScript—having functions as a type—leads to\
    \ some pretty interesting behaviors. Consider the following:\n\n```javascript\n\
    function myFunction() {\n  // we created a variable myFunction\n  return \"Hello\"\
    ;             // of the type \"function\"\n}\nvar myFunction = 10;          //\
    \ we now reassigned myFunction to be a number\nvar myResult = myFunction(); //\
    \ an error -- we can't invoke a number\n```\n\nYikes! In many languages, code\
