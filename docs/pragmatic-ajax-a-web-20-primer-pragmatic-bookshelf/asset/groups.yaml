  - "[PAGE 34]\n\n# 3.2 Manipulating the Web Page\n\nSo far, we've covered the basics\
    \ of JavaScript and discussed how to get a web page to call JavaScript functions\
    \ in response to user events. This covers a third of what you need to know to\
    \ create an Ajax application. The next major piece is knowing how to actually\
    \ change web page content from JavaScript.\n\n# XML Under the Covers\n\nModern\
    \ browsers store a copy of every web page you visit in memory as an XML document,\
    \ regardless of whether you are visiting a modern XHTML site or an old HTML 2.0-era\
    \ site. (When a web page is not well-formed, the browser follows an internal algorithm\
    \ for promoting the HTML to XML.) This in-memory representation of the web page\
    \ can be accessed by JavaScript code to programmatically determine all kinds of\
    \ information about the page.\n\nMore importantly, the XML document can be modified,\
    \ and modifications are instantly reflected by the browser's rendering of that\
    \ page. Thus, to achieve animation, dynamic modification, and other effects, all\
    \ one has to do is modify the web page's underlying XML document. We'll now consider\
    \ how to go about making such modifications.\n\n# Modifying the XML: The DOM API\n\
    \nThe major browsers implement the same API for exposing the XML document to JavaScript\
    \ code; it's known as the DOM API. Short for Document Object Model, DOM represents\
    \ XML elements, attributes, and other components as objects in memory. The DOM\
    \ API models an XML document in memory as a Document object.\n\nYou can obtain\
    \ a reference to the Document object that represents the current web page by referencing\
    \ a variable named `document`. From this instance, you can retrieve elements to\
    \ individual XML elements in the web page, which are modeled as Element objects.\
    \ You can also modify the attributes of an XML element via an Element object.\n\
    \nIt's time for an example. This next code excerpt contains a simple web page\
    \ that will modify when its button is clicked:\n\n```\n<head>\n  <script type=\"\
    text/javascript\">\n    function modifyPage() {\n      var htmlElement = document.documentElement\n\
    ```"
  - "[PAGE 35]\n\n```\nvar children = htmlElement.childNodes\nvar bodyElement\nfor\
    \ (var i = 0; i < children.length; i++) {\n  if (children[i].nodeName == \"BODY\"\
    ) {\n    bodyElement = children[i]\n    break;\n  }\n}\nchildren = bodyElement.childNodes\n\
    var divElement\nfor (var i = 0; i < children.length; i++) {\n  if (children[i].nodeName\
    \ == \"DIV\") {\n    divElement = children[i]\n    break;\n  }\n}\ndivElement.replaceChild(document.createTextNodeNode(\"\
    Goodbye, world!\"),\ndivElement.childNodes[0]);\n}\n</script>\n<body>\n  <div>Hello,\
    \ world.</div>\n  <button onclick=\"myPage()\">Click Me</button>\n</body>\n</html>\n\
    ```\n\nAs you can see, the DOM API is a straightforward pleasure to use. Actually,\
    \ no, it's not. The DOM API is actually quite obtuse. If you've never used the\
    \ DOM API before, you might expect something that models XML in an intuitive and\
    \ easy fashion. For example, you might expect to be able to say, get a reference\
    \ to the root element in your web page, the `<html>` element, and from there say\
    \ something like:\n\n```\nhtmlElement.getElement(\"BODY\");\n```\n\nNo such luck,\
    \ my. You see, the DOM API models all of the different types of content (text,\
    \ attributes, comments, and processing instructions) as nodes, and inexplicably,\
    \ the API does not provide a way for you to retrieve just the element children\
    \ from a parent element. This means navigating through the web page as XML is\
    \ excruciating, as you can see for yourself.\n\nFurther, matters get worse. Earlier\
    \ we explained that browsers canonicalize all web pages—that is, which convert\
    \ all HTML to XML in a standard way. As part of this process, certain elements\
    \ are added. For example, consider the case of an HTML table:\n\n<table>\n  <tr>\n\
    \    <td>A table</td>\n  </tr>\n</table>"
  - "[PAGE 36]\n\n# MANIPULATING THE WEB PAGE\n\nWhen the browser converts this HTML\
    \ to XML, it automatically adds a <body> element as a child of the <table> element.\
    \ Unexpected things happen to your HTML when the browser parses it; for this reason,\
    \ you should steer clear of literally warping your page using the DOM, as things\
    \ may not be where you expect them.\n\n# DOM Shortcuts\n\nFortunately, the DOM\
    \ API includes a few shortcuts. Document objects have a method getElementsByTagName()\
    \ that could come in handy in our example. Consider this alternate JavaScript\
    \ function:\n\n```\nfunction modifyPage() {\n  var divElements = document.getElementsByTagName(\"\
    DIV\");\n  var divElement = divElements[0];\n  divElement.replaceChild(document.createTextNode(\"\
    Goodbye, world!\"), divElement.childNodes[0]);\n}\n```\n\nThat's more palatable.\
    \ But we still have the brittle ordering problem. We are assuming that the <div>\
    \ element we're interested in will always occur in the same location relative\
    \ to other <div> elements. In our trivial example, this is a safe assumption,\
    \ but in the real world it will not work at all.\n\nWhat we really need is a way\
    \ to easily reference a specific element in the web page. Fortunately, there is\
    \ just such an easy and convenient mechanism. If you give an element an id attribute,\
    \ you can retrieve that element using a special function on the Document object\
    \ getElementById(). Consider this further revised version of the earlier example:\n\
    \n```\n<html>\n<head>\n<script type=\"text/javascript\">\n  function modifyPage()\
    \ {\n    var divElement = document.getElementById(\"toReplace\")\n    divElement.replaceChild(document.createTextNode(\"\
    Goodbye, world!\"), divElement.childNodes[0]);\n  }\n</script>\n</head>\n<body>\n\
    <div id=\"toReplace\">Hello, world.</div>\n<button onclick=\"modifyPage()\">Click\
    \ Me</button>\n</body>\n</html>\n```\n\nHey, that's not looking too bad. Line\
    \ 5 seems a fairly clear way to get the <div> we're looking for. Now, if only\
    \ we could clean up the next two lines; they still seem a bit complex. And actually,\
    \ we can.\n\nReport erratum"
  - "[PAGE 37]\n\n# MANIPULATING THE WEB PAGE\n\nThe official DOM requires that developers\
    \ manually manipulate all of an element's child nodes, and add new ones, in order\
    \ to change their contents. Some time ago, Internet Explorer introduced an alternative\
    \ mechanism for changing the contents of an element—one that is easier to use.\
    \ In recent years, Mozilla and Safari have both implemented support for this feature.\
    \ Take a look at the revised modifyPage() function:\n\n```\nfunction modifyPage()\
    \ {\n  var divElement = document.getElementById(\"Replace\")\n  divElement.innerHTML\
    \ = \"Goodbye, world!\"\n}\n```\n\nAhh, finally—it's so easy to write! The facto\
    \ innerHTML allows you to change the contents of an element by passing it string\
    \ that it will parse as XML and use to replace the current contents of the element.\
    \ Nice and easy.\n\nWhile the prose of these last sections has been biased against\
    \ the more traditional DOM API methods, you can choose for yourself which mechanism\
    \ seems most natural to you. Some folks prefer dealing with nodes directly and\
    \ actually enjoy writing code like the previous iterations of our example you\
    \ saw. In our experience, however, most people prefer these shortcut mechanisms\
    \ for retrieving elements and modifying their contents.\n\n# Attributes\n\nSo\
    \ far we've talked about dealing with XML elements using JavaScript. What about\
    \ attributes? Just as with elements, changes to attributes take effect immediately\
    \ in the browser's view of a web page, so manipulating them can be pretty handy.\n\
    \nThe DOM API presents a generic mechanism for manipulating attributes. Once you\
    \ have a reference to an element, you can use the getAttribute() and setAttribute()\
    \ functions to access and change attribute values, such as in this example:\n\n\
    ```\nvar div = document.getElementById(\"someDiv\")\ndiv.setAttribute(\"style\"\
    , \"background: red\") // make the div red\n```\n\nSurprisingly, this is fairly\
    \ easy. After dealing with the DOM API elements, you might have expected to have\
    \ to navigate through some obtuse list of attributes in order to change them.\
    \ In fact, changing attribute values can be even easier than this."
  - '[PAGE 38]


    # Inner and Outer


    The innerHTML() property that we''ve just demonstrated is very useful, but it
    has a rather storied history. It was introduced as a proprietary addition to Internet
    Explorer; other browsers have decided to support it as it has proved fairly useful,
    for obvious reasons. There are, though, two related properties: innerText(), outerHTML().


    innerText() accomplishes almost the same thing as innerHTML(). The internal representation
    of the referenced node is replaced with the text passed into the method. However,
    unlike innerHTML(), the new text is not parsed as XML. It is, rather, rendered
    directly as a textual child of the containing node. This is actually a lot more
    performant than parsing the text as XML, and is preferable for just adding data
    than replacing new elements to the tree.


    outer() is a different beast. innerHTML() detaches any and all existing children
    of the target node, parses the new text, and adds the new nodes as children of
    the target node (essentially, replacing everything between the opening and closing
    tags of the target node), outerHTML(), on the other hand, replaces the target
    node itself. All of the existing node are lost as a byproduct of destroying the
    target node. The node is replaced with whatever new nodes are created by parsing
    the input to the method.


    This latter approach is actually much more useful when writing web pages that
    are dumb shells. The server-side code which renders the component can return the
    full entity (top-level node and its children) which can be placed anywhere on
    the page. Using innerHTML(), the containing page has full control over the layout
    of the components, with specifically designed container nodes to use as targets.
    The server endpoints only output the contents: if the containing page puts them
    in the wrong kind of node, or at the root of the document, the rendering will
    most likely be wrong.


    Using outerHTML(), however, the server target renders the containing node AND
    its contents, ensuring that no matter where the containing page puts the results,
    it will be fully contained as designed. A real component, not just component contents.
    This sounds like an excellent thing, and it is. Except it is still a proprietary
    IE addition, and Firefox, for example, has not adopted it, and has no public plans
    to do so.'
- md: "\nCast your mind back to the CRM application we enhanced for Hector in the\
    \ last chapter. Specifically, let's review a particular JavaScript excerpt that\
    \ powered that application:\n\n```javascript\nfunction processZipData() {\n  if\
    \ (xhr.responseText == 4) {\n    var data = xhr.responseText;\n    var cityState\
    \ = data.split(',');\n    document.getElementById(\"city\").value = cityState[0];\n\
    \    document.getElementById(\"state\").value = cityState[1];\n  }\n}\n```\n\n\
    Take a look at lines 5 and 6. What thats that .value bit? What's actually doing\
    \ is changing the value attribute for the input element. Given what we just talked\
    \ about a few paragraphs ago, we ought to accomplish this using the setAttribute('value',\
    \ 'city'). What's that value property all?\n\nIt turns out that the DOM API also\
    \ defines a standard for mapping specific attributes from the HTML grammar directly\
    \ into the extended version of the DOM API that browsers use. Using these special\
    \ extensions, the element itself can set an attribute's value by modifying a property\
    \ of the object. Thus, when getElementById('city') returns an input element, we\
    \ can change its value attribute by setting the value property on the object.\
    \ Nifty!\n\n## 3.3 Retrieving Data\n\nWe've talked about JavaScript, how to manipulate\
    \ the web page with the DOM API, we're just missing one key element to explain\
    \ retrieving data. The heart of data retrieval is the XMLHttpRequest object (XHR\
    \ for short) that we introduced in the last chapter. In this section, we'll discuss\
    \ more details about XHR.\n\n### XMLHttpRequest\n\nIn the previous chapter, we\
    \ saw the basics on how to create an instance of an XHR and use it to retrieve\
    \ data. Let's review again here, briefly, in the context of a different example.\
    \ The following code listing shows how a simple web page can retrieve a message\
    \ from a server and display it.\n\n```html\n<html>\n<head>\n  <script type=\"\
    text/javascript\">\n    var xhr;\n\n    function modifyPage() {\n      try {\n\
    \        xhr = new XMLHttpRequest(\"Msxml2.XMLHttpRequest\");\n      } catch (e)\
    \ {\n        try {\n          xhr = new XMLHttpRequest(\"Microsoft.XMLHttpRequest\"\
    );\n        } catch (E) {\n          xhr = false;\n        }\n      }\n      if\
    \ (!xhr && typeof XMLHttpRequest != 'undefined') {\n        xhr = new XMLHttpRequest();\n\
    \      }\n      xhr.open(\"GET\", \"/message\");\n      xhr.onreadystatechange=function()\
    \ {\n        if (xhr.readyState != 4) return;\n        document.getElementById(\"\
    message\").innerHTML = xhr.responseText;\n      }\n      xhr.send(null);\n   \
    \ }\n  </script>\n</head>\n<body>\n  <div id=\"message\"><button onclick=\"modifyPage()\"\
    >Click Me</button></div>\n</body>\n</html>\n```\n\nThis HTML will render a very\
    \ simple web page that presents a button to the user. Once clicked, the page will\
    \ display the results of a query to the server in the page above the button. Line\
    \ 21 shows the requested URL as '/message'; you could implement this URL using\
    \ any web-enabled language. A Java Servlet implementation would look something\
    \ like this:\n\n```java\nimport javax.servlet.*;\nimport javax.servlet.http.*;\n\
    import java.io.IOException;\nimport java.util.Date;\npublic class MessageServlet\
    \ extends HttpServlet {\n  protected void doGet(HttpServletRequest request,\n\
    \      HttpServletResponse response)\n      throws ServletException, IOException\
    \ {\n    response.getWriter().println(\"Hello world, the current time is \" +\
    \ new Date());\n  }\n}\n```\n\nBut really, you could also implement the message\
    \ URL as a flat file containing plain text or an HTML snippet: it doesn't matter.\
    \ XHR requests the URL just like the browser, and returns the results just as\
    \ though you entered the URL in the browser field.\n\n## XHR in Detail\n\nLet's\
    \ talk about some of the other features of XHR that we haven't covered thus far.\n\
    \n### States\n\nThe onreadystatechange property is a key feature of XHR. It lets\
    \ you register an asynchronous callback handler that will be invoked as the state\
    \ of XHR changes during a request/response communication with a server. In the\
    \ last chapter, we looked at the five possible states of the readyState property.\
    \ Generally speaking, the important state is 4 (Completed). The other four states\
    \ are all different shades of \"incomplete\".\n\n### Headers\n\nIn addition to\
    \ exposing somewhat granular information about its current, XHR also lets you\
    \ modify or add HTTP headers in the request and view headers in the response.\
    \ This is accomplished using the setRequestHeader(), getResponseHeader(), and\
    \ getAllResponseHeaders() functions. In this example, we spoof the browser to\
    \ send the XHR:\n\n```javascript\nxhr.setRequestHeader(\"User-Agent\", \"My Custom\
    \ Browser\");\n```\n\n### Response Data\n\nIn the examples, we've used the responseText()\
    \ property to retrieve the response body from the server. There's another property,\
    \ responseXML(), which returns the response from the server as a DOM instance.\
    \ This can be useful if you want to send structured data back to the web page\
    \ from the server; you can use the DOM API to navigate through the data as XML\
    \ and update the web page as appropriate based on that data.\n\n## 3.4 Summary\n\
    \nThis chapter dives into the underpinnings of Ajax. You've seen the JavaScript\
    \ language and DOM model close up and personal. Though it is certainly possible\
    \ to write applications using only the constructs you've seen here, programmers\
    \ generally tend to...\n"
  mdcn: "\n回想一下我们在上一章中为 Hector 增强 CRM 应用程序。具体来说，让我们回顾一下驱动该应用程序的 JavaScript 代码段：\n\n\
    ```javascript\nfunction processZipData() {\n  if (xhr.responseText == 4) {\n \
    \   var data = xhr.responseText;\n    var cityState = data.split(',');\n    document.getElementById(\"\
    city\").value = cityState[0];\n    document.getElementById(\"state\").value =\
    \ cityState[1];\n  }\n}\n```\n\n看看第 5 行和第 6 行。那个 `.value` 部分是什么意思？它实际的操作是更改输入元素的\
    \ `value` 属性。考虑到我们几段话之前讨论的内容，我们本应该使用 `setAttribute('value', 'city')` 来实现这一点。这个\
    \ `value` 属性到底是怎么回事？\n\n事实证明，DOM API 还定义了一个标准，将 HTML 语法中的特定属性直接映射到浏览器使用的扩展版 DOM\
    \ API 中。通过使用这些特殊扩展，元素本身可以通过修改对象的属性来设置属性的值。因此，当 `getElementById('city')` 返回一个输入元素时，我们可以通过设置对象上的\
    \ `value` 属性来更改其 `value` 属性。非常巧妙！\n\n## 3.3 获取数据\n\n我们已经讨论了 JavaScript，以及如何使用\
    \ DOM API 操控网页，现在只缺少一个解释如何获取数据的关键元素。数据获取的核心是我们在上一章中引入的 `XMLHttpRequest` 对象（简称\
