- md: "\n# Synchronous Ajax?\n\nWe've misled you a little bit. It turns out that you\
    \ don't have to use XML-HttpRequest asynchronously. When you call the open function,\
    \ you pass a third argument of false; XMLHttpRequest will make its request without\
    \ spawning a background thread—thus allowing you to work with it in a synchronous\
    \ fashion, such as:\n\n```\nxhr.open(\"GET\", \"myURL\", false);\nxhr.send(null);\n\
    processZipData();\n```\n\nThis seems so much simpler than all of asynchronous\
    \ callback mambo-jumbo; why not use XMLHttpRequest this way?\n\nIt turns out that\
    \ when you use XMLHttpRequest in this fashion, the browser's interface becomes\
    \ non-responsive for the duration of the request. If the request takes a few milliseconds,\
    \ so do, that is really not a big deal. However, when it connects to networks,\
    \ one makes assumptions about latency; if the request takes a second or two, the\
    \ user is sure to notice. If it takes five or ten seconds, the user is sure to\
    \ become rather annoyed and will perhaps terminate the browser.\n\nIn short, you\
    \ should probably never do synchronous Ajax (err, Syntax).\n\n# Network Latency\n\
    \nWhen utilizing the synchronous version of XMLHttpRequest, one of the biggest\
    \ worries you have is latency. You have to be concerned with the length of time\
    \ it takes the response to arrive from the server, the browser will be blocked\
    \ and the user sitting idle while they wait.\n\nLess obvious, but just as important,\
    \ the effect latency can have on asynchronous requests. Take, for example, an\
    \ asynchronous Ajax request which should result in several fields being auto-populated.\
    \ If the background request takes too long to return, the user might begin populating\
    \ the fields by hand, expecting that some kind of error has occurred. When the\
    \ results arrive from the server, what should the page do? Overwrite the user\
    \ provided values, or drop the server-returned values? If it has to drop the server\
    \ values, should it do so silently or with a warning?\n\nIt really doesn't matter\
    \ what style of network you utilize in your application. Network speed is always\
    \ an issue on the UI, and it benefits your users when the code takes possible\
    \ delays into account.\n\n# 2.4 Wrapping Up\n\nAnd so, armed with his new Ajax\
    \ version of the customer screen, Hector is ready to satisfy his users by giving\
    \ them the rich interaction they demanded. There are some ridiculously fancy Ajax\
