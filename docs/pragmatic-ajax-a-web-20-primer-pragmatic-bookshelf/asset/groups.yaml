    # 真正的火箭科学


    好吧，好吧，我们承认——创建一个像 Google Maps 这样的东西并不容易。背后的地理编码功能（将地址映射到地图上的位置）、将地图特征与卫星图像进行归一化到令人惊叹的程度（使其能够相互叠加并看起来相当准确），以及从
    A 点到 B 点的路线规划，这些都是极其非凡的。


    然而，我们认为，Google Maps 特别具有创新性或令人印象深刻的并不是它的地理编码功能。MapQuest 和其他软件已经做了这类工作多年了。不，Google
    Maps 令人印象深刻的是地理编码引擎之上的地图界面。而我们觉得容易的是这个界面，而不是外壳下的地理编码。


    正如我们的好朋友 Glenn Vanderbilt 所说：“在技术上这很容易，但这个界面的构思才是真正神奇的部分，仅仅是有这个想法并意识到它是可以实现的。一旦你看到某些事情是可能的，很多事情就变得简单了。”
    我们得到的教训是：Google Maps 表明，当你构思出下一个伟大的 UI 创意后，你可以放心，实现它的技术解决方案可能并没有那么令畏。


    # 地图


    如你所知，地图的工作原理是允许你通过鼠标拖动地图本身来交互式移动地图。我们已经在浏览器中看到了多年的鼠标拖拽功能，但令人印象深刻的是，滚动的地图尺寸巨大，并且具有不同的缩放级别等。他们是如何做到的？


    当然，浏览器永远无法一次性将这样的地图放入内存中。例如，一张全球范围的街道级地图大约有一百万像素平方。显示这张地图需要多少内存？为了方便讨论，让我们假设地图仅以
    256 种颜色显示，这意味着每个像素仅消耗内存中的一个字节。这样的地图将需要 1,000,000,000,000 字节内存，或者大约一千 GB 的内存 RAM。因此，仅仅显示一个
    `<img>` 元素无法


    ![](img/e950a16d093a2ad996943265f0f0b6cd_46_0.png)


    # 图 4.1: Google Maps


    起作用。


    Google 工程师们为了解决我们桌面级 PC 有限的内存问题，将地图分成了各种瓦片（tiles）。这些瓦片连续排列以形成一张连贯的图像。下一页图 4.2
    显示了这些瓦片的示例。虽然这些瓦片的大小发生了变化，但目前的尺寸是 250 像素平方。


    所有的瓦片都排列在单个 HTML div 元素中，而这个 div 元素又包含在另一个 div 中；我们将这两个 div 分别称为内层 div 和外层 div。


    我们刚刚提到，浏览器无法将整个地图放入内存中。当然，将单张地图划分为任意数量的瓦片并一次性显示所有瓦片，消耗的内存将与整个图像一样多。为了补偿内存限制，Google
    Maps 对瓦片网格进行了虚拟化


    # 不止一百万像素


    我们在“地图”章节中说，一张全球街道级地图大约有一百万平方像素。实际上，那个数字被极大地低估了。在 Google 的最高放大倍数下，每平方英里消耗约 7,700,000
    个像素。估计地球包含 200,000,000 平方英里，但只有 30% 是陆地，所以让我们数字减少到 60,000,000 平方英里。


    将像素数量乘以地球的平方英里数量，得到了一个惊人的数字——4.62 亿个像素，这在 1670 万色（任何现代家用电脑的色彩深度）下，将消耗至少是该字节三倍的内存。当然，大多数图像查看程序都有某种分页内存子系统，每次只查看图像的一部分，但你明白我的意思……


    ![](img/e950a16d093a2ad996943265f0f0b6cd_47_0.png)


    图 4.2: Google Maps 瓦片


    在内存中并只显示用户可见的瓦片集，此外加上视图区域外的几个额外瓦片以保持滚动平滑。


    如果这整套网格虚拟化组合听起来有点复杂，别担心，它非常直观，尽管它是 UI 中最复杂的部分。


    # 缩放级别


    Google Maps 的另一个关键功能是放大和缩小能力，可以增大或减小地图尺寸，让你在瞬间看到整个世界，下一刻看到你的街道。这实际上是所有实现的功能中最简单的一个。更改缩放级别会改变内存中瓦片网格的大小，以及所请求的瓦片图像的
    URL。


    例如，屏幕上一个瓦片的 URL 是 `http://mt.google.com/mt?v=`。通过将最后一个参数 "zoom=3" 的值改为另一个值（例如
    "zoom=1"），你可以获取不同缩放级别的瓦片。在实践中，这并不简单，因为网格坐标随每个缩放级别发生巨大变化，并且它们通常会失效。


    他们是如何让缩放始终悬停在地图上的？


    # 大头针和对话框


    Google Maps 的另一个巧妙功能是点击后出现的大头针和对话框。下一页的图 4.3 显示了截图。我们将使用 PNG 图像，因为它们支持 Alpha 透明通道。PNG
    的优点之一是它可以缩放为任意大小，因此我们理论上可以为地图创建一个极其巨大的图像。然而，创建真正巨大的图像有点棘手，因为由于内存限制，我们必须渲染 SVG
    图像的部分，并在这些部分上生成瓦片，并有一个某种方案将一切统一起来。为了保持本章简单，我们将直接将地图限制在宽 2000 像素、高 1400 像素


