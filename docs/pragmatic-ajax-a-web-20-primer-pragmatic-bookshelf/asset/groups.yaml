    \ convention, this is typically included in the web page's `<head>` section, as\
    \ in:\n\n```html\n<html>\n<head>\n  <script type=\"text/javascript\">\n    /*\
    \ javascript code here */\n  </script>\n</head>\n<body>\n  // the web page contents\n\
    </body>\n</html>\n```\n\nActually, you can include `<script>` elements anywhere\
    \ in the web page; their contents will be executed in top-to-bottom order. It\
    \ is generally considered bad form to include them anywhere but in the `<head>`,\
    \ however.\n\n## A REVIEW OF CLIENT-SIDE JavaScript\n\n## Defining Events Outside\
    \ of HTML\n\nWe have so far shown that JavaScript event functions can be wired\
    \ up to nodes through HTML attributes. This is fairly practice, though there is\
    \ a class of programmer (we'll call 'purists') who frown upon this usage. Even\
    \ though JavaScript is embedded within the page, many developers like to consider\
    \ the JavaScript and the HTML as separate artifacts. Specifically, web designers\
    \ will want to work on the HTML and styles, while programmers will want to focus\
    \ on the scripting. Directly embedding the JavaScript into the HTML is too much.\n\
    \nThe main alternative is to use JavaScript properties. Once you have retrieved\
    \ a reference to a node of an HTML document, it exposes its events as a series\
    \ of properties. Functions can be directly attached to those properties. The following\n\
    \n```html\n<div id=\"mydiv\" onclick=\"myfunction()\">\n```\n\nis functionally\
    \ equivalent to\n\n```html\n<div id=\"mydiv\"/>\n<script type=\"text/javascript\"\
    >\n  document.getElementById('mydiv').onclick = myfunc;\n</script>\n```\n\nThe\
    \ value to this technique is that the designer can worry about HTML, and only\
    \ HTML. Programmers can hook events transparent. However, the downside is that\
    \ the scripts that reference events must be parsed after the HTML they reference.\
    \ Otherwise, the event cannot be found by getElementById(), and the result is\
    \ that no event is actually handled. There is a relatively new library out called\
    \ Behavior (http://bennolan.com/behaviour/) that helps programmers by allowing\
    \ you to assign behaviors to CSS classes, adding an extra layer of indirection.\n\
    \nModern browsers support a new kind of binding. The new attachEventListener()\
    \ function takes the name of the event to handle (the \"on\" part), the function\
    \ pointer, and a boolean value called capture mode. The beauty of the new attachEventListener()\
    \ method is it can wire up multiple handlers to the same event, creating a chain\
    \ of handlers. Using the direct property access, any subsequent assignments to\
    \ a property just override the last assignment. Before using attachEventListener(),\
    \ make sure your browser is supported. At last, IE5+ for Windows, Firefox 1.0+\
    \ and Safari 1.2+ were all supported, but not IE for the Mac.\n\n> ¹http://www.quirksmode.org\n"
  mdcn: "\n\n## 未定义 (Undefined)\n\n`undefined` 是 JavaScript 中的一种一等类型。最常见的情况下，它是 JavaScript\
    \ 为已声明但从未赋值的变量提供的默认值。某些 JavaScript 实现也将其用于从未声明的变量的值，尽管这并不常见，因为大多数 JavaScript 解释器都允许内联变量声明。\n\
    \n需要注意的是，它不仅仅是一个值。尽管它有字符串的表示形式（'undefined'），但它实际上是一个一等类型。这意味着当将 `typeof()` 运算符作用于具有该值的变量时，它将返回\
    \ `undefined`。\n\nJava/C# 开发者可能会发现，没有任何返回类型是不返回值的，而仅仅在某处使用 `return` 关键字。创建一个在路径分支并在其中一条路径上返回值、而在另一条路径上不返回值的函数是完全合法的。赋值了非返回函数结果的变量将包含特殊的\
    \ JavaScript 值 `undefined`。\n\n考虑接下来的这段代码片段：\n\n```javascript\nfunction myFunction(a)\
    \ {\n  return \"Hello\";\n}\nfunction myFunction() { // <label=code.js.function/>\n\
    \  return \"World\";\n}\nvar myResult = myFunction(\"aValue\"); // <label=code.js.return/>\n\
    ```\n\n你认为这一行 `myResult` 的值是什么？如果你使用的是支持方法重载的语言，你可能会期望值是 Hello。事实上，它不是。JavaScript\
    \ 不支持重载；也就是说，它不会根据函数的名称和参数来匹配函数调用和函数定义；仅根据名称。\n\n因此，在运行时给定名称只能有一个函数。如果定义了两个或多个同名的函数，将调用最后一个被\
    \ JavaScript 处理的版本。在我们的示例中，那是最后在该行定义的那一个。\n\n由于函数的参数在定义函数时不起任何作用，因此它们的存在完全是可选的。事实上，甚至有一种方法可以在不声明参数的情况下引用调用的参数——我们稍后会回到这一点。\n\
    \n## 函数类型 (The Function Type)\n\n早些时候我们讨论了 JavaScript 中的四种值类型（对象、数字、字符串和布尔），并暗示了还有更多类型。事实上，函数本身就是\
    \ JavaScript 中的一种类型。事实上，一旦你使用之前看到的传统语法定义了函数，就会存在一个引用该函数的变量；该变量的名称与函数本身相同。\n\n\
    考虑下一个示例：\n\n```javascript\nfunction myFunction() {\n  // 想象一下这个函数执行了某些操作\n}\n\
    alert(typeof myFunction)\n```\n\n如果你在浏览器中执行这段代码，JavaScript 内置的 `alert` 将弹出一个对话框，显示\
    \ `myFunction` 变量的类型：对话框的内容将是 \"function\"。\n\nJavaScript 的这种特性——将函数作为类型——会导致一些有趣的行为。考虑以下内容：\n\
    \n```javascript\nfunction myFunction() {\n  // 我们创建了一个变量 myFunction\n  return\
    \ \"Hello\";             // 类型为 \"function\"\n}\nvar myFunction = 10;        \
    \  // 我们现在将 myFunction 赋值为数字\nvar myResult = myFunction(); // 错误 -- 我们不能调用一个数字\n\
    ```\n\n哎！在许多语言中，这样的代码可以正常工作；函数和变量是完全不同的实体，它们的名称不会冲突。在 JavaScript 中，因为函数也是变量，这样的代码是无意义的。\n\
    \n除了我们目前为止使用的传统定义语法外，还有另一种定义函数的方法：\n\n```javascript\nvar a = 10;\nvar b = 12;\n\
    var myFunction = function() {\n  return a + b;\n}\nvar result = myFunction();\
    \ // result 是 22\n```\n\n在这个示例中，我们创建了一个名为 `myFunction()` 的新函数。酷的一点是，该函数能够访问其闭包块的状态。我们可以从函数内部引用变量\
    \ `a` 和 `b`。这种特征通常被称为闭包（closure），它是一个非常强大的特性。通常，当作用域结束时，作用域中的值就会丢失。闭包保留了对闭包块状态的访问；当使用时，该状态对闭包仍然可用。\n\
    \n## JavaScript 事件：绑定到网页 (JavaScript Events: Binding to the Web Page)\n\n到为止，我们考虑的\
    \ JavaScript 内容没有任何是特定于网页浏览器的。事实上，许多人在浏览器之外使用 JavaScript。然而，从这里开始，我们将开始考虑现代网页浏览器托管的\
    \ JavaScript 环境特有的属性。\n\n第一个考虑点是网页如何与 JavaScript 交互。如果你以前写过 JavaScript，你可能知道网页中的绝大多数\
    \ JavaScript 必须包含在 `<script>` 标签内。按照惯例，这通常包含在网页的 `<head>` 部分，如下：\n\n```html\n\
    <html>\n<head>\n  <script type=\"text/javascript\">\n    /* 此处编写 javascript 代码\
    \ */\n  </script>\n</head>\n<body>\n  // 网页内容\n</body>\n</html>\n```\n\n实际上，你可以在网页的任何地方包含\
    \ `<script>` 元素；它们的内容将按照从上到下的顺序执行。然而，将它们包含在 `<head>` 的任何地方通常被认为是不规范的。\n\n## 定义事件\
