    \ to make HTML look and act just like any other \"rich client\" platform. The\
    \ kinds of effects range from simple hiding and showing tricks all the way up\
    \ to drag-n-drop and sortability.\n"
  mdcn: "\n\n```html\n<input type=\"button\" value=\"Toggle\"\nonclick=\"Element.toggle('up',\
    \ 'down');\"/>\n```\n\n为了万无一失，我们并不总是想进行切换。Element 还暴露了其他方法，每个方法都可以接受任意数量的元素作为参数，并确保每个元素的\
    \ `display` 属性都被正确设置。有时，仅仅切换是不够的。将元素的 `display` 属性设置为 'none' 会让页面的其余布局看起来就像该元素在\
    \ DOM 中不存在一样样。然而，只要元素本身存在，其包含的表单元素（例如）仍然会被提交到 action 中，就好像它们是可见的一样。对于遍历 DOM 元素或操作页面布局的脚本也是如此。\n\
    \n与其仅仅将 `div` 的 `display` 属性设置为 'none'，我们不如将 `div` 从 DOM 树中完全移除。通常情况下，这意味着导航到\
    \ `div` 的父节点并从父节点的子列表中移除该 `div`。DOM 专门为此目的指定了一个 `removeChild` 方法。该节点将从树中移除，整个树将重新渲染，以防止该区块影响流布局。此外，包含它的元素将不再感知该节点的存在，脚本也将无法发现它。这是不可逆的，除非你已经在另一个变量中缓存了该节点的副本，并在稍后手动将其添加回来。Prototype\
    \ 将 `removeChild()` 功能暴露为了一个名为 `Element.remove()` 的函数。\n\n## 插入数据\n\n显示和隐藏数据固很好，但它意味着我们有一个专门的专用容器用于显示那部分数据。例如，显示错误消息通常意味着我们有一个隐藏的\
    \ `div` 或 `span` 准备好接收数据，然后将其显示给用户。然而，通常我们想要的是向现有元素中添加更多数据。最常见的情况是，我们想向已经可见的列表添加新项。实现此点的标准\
    \ HTML 方法是创建一个新版本的列表项（其中包含添加的内容），然后用新版本替换列表的内容。使用 Ajax，这意味着你需要调用一个服务器端方法，该方法会返回一个追加了任何新项的列表。虽然这种方法有效，但它可能会运行得非常缓慢，而且如果生成列表内容的代码涉及数据库，则可能至少需要与数据存储进行一次往返以重新填充列表。\n\
    \nPrototype 引入了 `Insertion` 类。`Insertion` 允许我们在不替换列表现有内容的情况下，向现有容器添加信息。`Insertion.Top()`\
    \ 将新数据插入到容器的开头，而 `Insertion.Bottom()` 将其插入到末尾。这意味着你可以轻松地向列表追加单行，而无需重新渲染整个列表。\n\
    \n```html\n<ul id=\"mylist\">\n  <li>one</li>\n  <li>two</li>\n  <li>three</li>\n\
    </ul>\n<input type=\"text\" id=\"newval\"/>\n<input type=\"button\"\n  onclick=\"\
    new Insertion.Bottom('mylist');\n    <li>${(newval)}</li>\";/>\n```\n\n请记住，你拥有想要渲染的完整值。在示例中，我们认为输入字段的文本值追加到列表底部。我们必须将其封装在\
    \ `<li></li>` 标签中，以便将其渲染为列表项；如果没有这些标签，新值将仅仅作为文本粘贴在列表中，渲染时将不带符号，且以内联文本的形式显示。\n\n\
    Prototype 实际上更进了一步，它还允许你在容器周围添加文本。总而言之，`Insertion` 为你的新数据提供了四种位置：`Before()`、`Bottom()`\
    \ 和 `After()`。下一页的图 6.1 展示了它们所在的位置。\n\n这非常强大，因为你可以修改页面中没有 ID（或可能根本没有 ID）的页面部分。\n\
    \n## 表单\n\n从历史上看，处理表单一直有点乏味。表单的用途只有一个：从用户那里收集数据。表单上存在的输入字段虽然样式各异，但本质上它们的性质是相同的。它们代表了用户可以使用来告诉我们某些信息的项。在\
    \ Ajax 出现以及它带来的对 DOM 的重新思考之前，我们必须像处理任何其他 HTML 元素一样处理表单和输入，遍历 DOM 找到它们，修改它们的样式属性以影响它们的行为。\n\
    \nPrototype 让我们以不同的方式来思考表单。与其将其看作恰好嵌入了输入框的 HTML 块，Prototype 鼓励我们把表单视为数据字段的集合。\n\
    \n## 内联元素\n\n| 之前 | 开启标签 | 顶部 | 内部数据 | 底部 | 闭标签 | 之后 |\n| :--- | :--- | :--- |\
    \ :--- | :--- | :--- | :--- |\n\n## 块级元素\n\n| 之前 | | | | | | |\n| :--- | :---\
    \ | :--- | :--- | :--- | :--- | :--- |\n| 换行 | | | | | | |\n| 换行 | | | | | | |\n\
    | 开启标签 | 顶部 | 内部数据 | 底部 | 闭标签 | | |\n| 换行 | | | | | | |\n| 之后 | | | | | |\n\n\
    这非常强大，因为你可以修改页面中没有 ID（或可能根本没有 ID）的页面部分。Prototype 包含了几种方法来理解元素在渲染页面上的当前位置。具体而言，它们允许你发现元素在滚动页面上的相对位置，包括该元素是否位于当前可见区域。如果不是，你可以获取从可见区域到元素的滚动偏移量（水平或垂直）。大多数开发者不会直接使用这些功能，而是使用构建在这些功能之上的框架来提供更高级的功能。\n\
    \n"
