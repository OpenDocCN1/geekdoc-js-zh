    The key to a successful Ajaxification is to not ignore important conventions.
    There are certain laws of the land that made the web so popular and accessible,
    in that other applications and technologies never were. As you add this new technology
    into your application, think both tactically and strategically. Ask yourself the
    following questions:


    +   - “Is I''m adding the usability of my application, or the length of my resume?”

    - “Does it break an ingrained habit of my users?”

    - “Is the value worth the cognitive dissonance such a break for my users?”


    Tactically, the change might increase the usability of this single page, but strategically,
    reduce the usability of the application as a whole.


