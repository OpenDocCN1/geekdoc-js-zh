    # Helper Tags


    A second approach to Ajax integration is custom tag libraries. Tools-like AjaxAnywhere¹,
    and Ruby on Rails use custom tag libraries (or similar constructs) as an HTML-embedded
    stand in for server-side functionality. These tag libraries, sometimes referred
    to as helper tags, are parsed by the template engine of the given framework, which
    in turn generates client-side artifacts based on the attributes of the custom-tag.


    The result is a page that looks like HTML, but whose actual content is determined
    at parse time. The tags provide a layer of abstraction for integrating our server-side
    code into client-side templates. This can be a quite powerful ability, as it allows
    the developer to focus on a single artifact (the template) instead of jumping
    around between template and alternate code files.


    We''ll look at Ruby on Rails'' Ajax integration in ??, on page ??.


    # ORB-like Remoting


    Our last category of Ajax integration with a server framework is to use ORB-like
    remoting to connect client-side JavaScript to existing server-side functionality.
    Using tools like JSON-RPC, DWR (for Java), Ajax.NET, or any PHP framework, developer
    can write JavaScript code for the browser that can seemingly access the server-side
    domain directly. The effect of these frameworks is that your domain code is now
    reusable across the client tier, providing a seamless object model for both.


    We''ll examine ORB-like remoting in ??, on page ??, as we discuss PHP and its
    Ajax integration. First, we''ll look at the grand-daddy of all the PHP/Ajax integration
    projects, Sajax. Next, we''ll compare to a newer player, Najax.


