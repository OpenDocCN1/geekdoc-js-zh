    ><img src=\"../progress.gif\" />\n</span>\n</td>\n<td colspan=\"2\">\n<span style=\"\
    border-bottom: solid 1px red; color: red; id=\"addressError\">\n</span>\n</td>\n\
    </tr>\n```\n\nSecondly, we have to update our request generating code. In the\
    \ last example, we use the Prototype library's Ajax.Updater object to perform\
    \ our round trip. We'll extend that example here. The options collect-\n\n## SOME\
    \ STANDARD USAGES\n\ncontains four event hooks: onLoading, onLoaded, oninteractive\
    \ and onComplete, each corresponding to one of the four readystate values. Prototype\
    \ simply implements the onreadyStatechange hook, then publishes the specific events,\
    \ as those values. We will trap the onLoading and onComplete events, to allow\
    \ us to show the image when the begins and hide it once a response has been received.\
    \ The values for the two events need to be function calls. Instead of simply calling\
    \ Element.show() and Element.hide() directly, we will wrap them in anonymous functions.\
    \ If you don't do this, the onload call never completes, the validation result\
    \ is never received, onComplete is never called and the little spinning wheel\
    \ will be the only thing about about page.\n\nFile 7\n\n```javascript\nfunction\
    \ validateField(fieldname, required, validation, update) {\n  var params = \"\
    type=\" + validation +\n    \"&required=\" + required +\n    \"&value=\" + $$(fieldname);\n\
    \  new Ajax.update(update, validationUrl, {\n    asynchronous: true,\n    method:\
    \ \"get\",\n    parameters: params,\n    onLoading: function(request) {Element.show(fieldname\
    \ + ' Progress');},\n    onComplete: function(request) {Element.hide(fieldname\
    \ + ' Progress');}\n  });\n}\n```\n\n## Update Notification\n\nWeb surfers are\
    \ largely trained to believe that something loaded on a page is static. They understand\
    \ that, in order to update the contents of a page, the page must be reloaded.\
    \ The only cognitive exception to this rule is animations. The web surfing population\
    \ understands that certain graphics are not static, but in fact loops of animation.\
    \ These are expected to repeat the same set of information over time, though,\
    \ and are not actually \"dynamic\" in any data-centric meaning of the term.\n\n\
    Ajax is all about breaking this particular expectation. That is, in fact, the\
    \ core of Ajax: break free from the bonds of static interaction. But it literally\
    \ goes against the foundation of most users' understanding of how the web works.\
    \ Which means we have to take special pains to ensure that when we break this\
    \ convention, users don't miss it.\n\nThe primogen of this pattern is the famous\
    \ Yellow Fade Technique, or YFT. Apparently created (or at least) by the crew\
    \ of 37signals, the YFT is a simple trick. Simply choose a color (canonically\
    \ and eponymously yellow), reset the background color of an element to this new\
    \ color, then slowly transition it back to the original. The effect is\n\n## Report\
    \ erratum\n\nto highlight an area of the page as though with a Highlighter so\
    \ as to draw the user's attention, but to have that intrusive effect disappear\
    \ so as not to detract from the overall look and feel of the page.\n\nTo do this,\
    \ you might write some code that manipulates the background-color of an element.\
    \ You might want to capture the original backgroundcolor so as to return the element\
    \ to its original state at the end of the effect. You would be forced to deal\
    \ with the fact that most browsers internally store colors in the form hex notation\
    \ (#ffffff) if you would prefer to work in rgb then you would have to convert\
    \ them yourself. Likewise, you would have to come up with some strategy for moving\
    \ from the original value to the target value for each color (red, green and blue)\
    \ simultaneously to get a smooth transition.\n\nLuckily, somebody else has already\
    \ done that for you. Previously, we've used the Prototype library to do server-side\
    \ validation and progress notification. We are now going to layer the Script.aculo.us\
    \ We'll modify the sample application to use the YFT to alert you when the content\
    \ of the City and State fields have been updated.\n\nFirst, we don't have to change\
    \ the HTML at all. We already have a container element with a unique ID that we\
    \ can use for the highlight effect. It's the `tr` that holds the City and State\
    \ fields. Its ID is `rewrite`.\n\n```html\n<tr id=\"rewrite\">\n  <th>City:</th>\n\
    \  <td>\n    <input id=\"city\" type=\"text\" name=\"city\"/>\n  </td>\n  <th>State:</th>\n\
    \  <td>\n    <input id=\"state\" type=\"text\" name=\"state\" size=\"3\" maxlength=\"\
    2\"/>\n  </td>\n</tr>\n```\n\nThe second part is to update the `getZipData()`\
    \ function to trigger the effect when the data has been loaded. Remember, XHR\
    \ features the onreadystatechange to alert your code when the status of the request\
    \ has- changed. In this case, though, Prototype offers us another option. As we\
    \ use two new events, onSuccess and onFailure, so that we can write error-aware\
    \ asynchronous methods. Our current version of `getZipData()` already makes use\
    \ of onFailure to alert the user if the request failed:\n\n```javascript\nhttp://script.aculo.us/\n\
    ```\n\n```javascript\nfunction getData(zipCode) {\n  new Ajax.Updater(\"rewrite\"\
    , url, {\n    asynchronous: true,\n    method: 'get',\n    parameters: \"zipCode=\"\
    \ + zipCode + \"&type=html\",\n    onFailure: function(request) {\n      assignError(request.responseText);\n\
    \    }\n  });\n}\n```\n\nWhen the request fails, the assignError() function is\
    \ called to display the message. We're now going to add a handler to the onSuccess\
    \ method to perform the YFT. We use onSuccess instead of onComplete because onComplete\
    \ will fire regardless of what's in the response. This would lead us to highlight\
    \ city and state even if their data doesn't update. Instead, we use onSuccess,\
    \ which only fires if the returned data ends up in the display fields.\n\n```javascript\n\
    function getData(zipCode) {\n  new Ajax.Updater(\"rewrite\", url, {\n    asynchronous:\
    \ true,\n    method: 'get',\n    parameters: \"zipCode=\" + zipCode + \"&type=html\"\
    ,\n    onSuccess: function(request) {\n      new Effect.Highlight('rewrite');\n\
    \    },\n    onFailure: function(request) {\n      assignError(request.responseText);\n\
    \    }\n  });\n}\n```\n\nThe effect of this handler is that the row containing\
    \ City and State will yellow whenever the request succeeds, then fade back to\
    \ white over a one second. Bear in mind, as we learned in the previous chapter,\
    \ you can affect the behavior of the transition by submitting options to the call.\
    \ For example, you can change the transition to go from cornflower to blue over\
    \ three seconds with a linear transition by changing the call to:\n\n```javascript\n\
    new Effect.Highlight('rewrite', {\n  startcolor: '#92A4E2',\n  duration: 3.0,\n\
    \  transition: Effect.Transitions.linear } );\n```\n\nYou can also choose the\
    \ end transition color (endcolor) and the final color to use (restorecolor) if\
    \ you need\n\n## Auto Update\n\nOne of those things that often sets traditional\
    \ clients apart from thin clients is the ability to quickly react to what the\
    \ user is doing. For example, there are lots of locally installed applications\
    \ that can react to what a user is typing, and make intelligent guesses about\
    \ how to complete the word(s) for the user. Google (once again) showed that the\
    \ same thing could be accomplished on the web with Suggest. Scriptacular provides\
