    \ Ajax 世界中发生的事件进行书签。\n\n要开启此功能，你必须在调用 `dojo.io.bind()` 时设置 `changeURL` 参数。你可以设置为：\n\
    \n- *true*: 将 URL 的内容更改为 http://yoursite.com/yoururl.html#12345678，其中 hash 之后的内容是一个戳。\n\
    \n```javascript\ndojo.io.bind(\n  url: \"http://your.sub.url\",\n  load: function(type,\
    \ obj) { /* 使用响应 */ },\n  changeURL: true\n)\n```\n\n- *yourvalue*: 选定的字符串将被添加到\
    \ URL 中。如果你设置\n\n```javascript\ndojo.io.bind(\n  url: \"http://your.sub.url\"\
    ,\n  load: function(type, obj) { /* 使用响应 */ },\n  changeURL: \"ajaxian\"\n)\n\
    ```\n\nURL 将更改为 http://yoursite.com/yoururl.html#ajaxian\n\n# 杂项选项：method, content,\
    \ postContent, sync 和 cache\n\n你可以向 `dojo.io.bind()` 传递其他（很少被提到的）选项。\n\n- method:\
    \ 你可以设置请求时使用的 HTTP 方法（例如，'get' 或 'post'）。\n- content 和 postContent: 你可以将此选项理解为你希望以\
    \ hash 形式发送到服务器的请求参数。\n`content: { key1: 'value1', key2: 'value2' }`\n只有在方法为 POST\
    \ 时才会发送 postContent，这允许你在 POST 请求中选择性地发送某些值。\n- sync: 默认情况下，你的请求是异步的（这是好事），但你可以设置\
    \ `sync: true` 来改变这一点。\n- useCache: Dojo 可以使用你可以利用的缓存来绕过服务器访问。要开启它，你必须设置 `useCache:\
    \ true`。\n\n# 5.3 使用 Prototype 库进行远程调用\n\n随着流行的 Ruby on Rails Web 框架的兴起，Prototype\
    \ 进入了舞台。Prototype 库是另一个开源 JavaScript 工具包，它为 XHR 和一些基础 UI 效果提供了直接的封装。在这里，我们将使用\
