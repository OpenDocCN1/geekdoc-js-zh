    \ src=\"../scripts/prototype/prototype-1.3.1\"></script>\n```\n\n# Ajax.Request()\n\
    \nPrototype 中等于 `dojo.io.bind()` 有 `Ajax.Request()`。它的工作方式与 dojo 类似，通过对象本身传递我们想要执行的工作。区别是微妙的。首先，你将\
    \ URL 作为第一个参数传递，而不是放在对象中。你还需要同步或异步请求之间进行选择。99% 的情况下你会想要使用异步，因为你不想在请求发生时冻结浏览器。\n\
