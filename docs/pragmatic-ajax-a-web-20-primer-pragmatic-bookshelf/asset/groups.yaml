    \n## Chapter 5\n\n## Ajax Frameworks\n\nUp until now, we've looked at Ajax either\
    \ at an abstract architectural level, or from down in the tunnels underneath the\
    \ structure. The DOM API and JavaScript's sometimes tortured interactions with\
    \ it form the basis of all other Ajaxian techniques. Though it is vital to understand\
    \ these things when you run into trouble, it is also likely that you've been left\
    \ scratching your head from time to time. Maybe you wondered who decided to use\
    \ magic numbers for all the ready values. Or why the industry standard way to\
    \ create an XHR instance is in a try/catch block that will encounter an exception\
    \ ~70% of the time. In fact, if you are anything like us, it probably occurred\
    \ to you that you could write a fairly simple wrapper around this stuff to make\
    \ it more usable in production code. These wrappers are fairly common; the internet\
    \ is littered with their corpses.\n\nA few library wrappers have survived and\
    \ flourished to become full-fledged toolkits. They provide us with better leverage\
    \ for using Ajaxian techniques to make real applications. In this chapter, we\
    \ will take a look at several of these frameworks at our disposal, and will rewrite\
    \ Hector's CRM application using the most mature and popular versions.\n\n###\
    \ 5.1 Frameworks, Toolkits, and Libraries\n\nAs Ajax has taken off, we have been\
    \ inundated with projects claiming to have Ajax support. Since the term itself\
    \ has such broad meaning in the popular consciousness, though, it is often hard\
    \ to know exactly what this means. Does the site perform asynchronous callbacks\
    \ to the server? Does it re-render fresh data in-page? Or does it just manipulate\
    \ the properties of existing DOM nodes?\n\nFigure 5.1: Layers of Ajax Frameworks\n\
    \nFigure 5.1 clarifies the distinct layers of Ajax proper.\n\n### Remoting Toolkit\n\
    \nThe lowest level of Ajax helpers is a remoting toolkit. If you were to create\
    \ your own toolkit, this would probably be where you started out: wrapping XMLHttpRequest\
    \ with your own API to make life easier. A really good remoting toolkit should\
    \ be to do much more than simply hide our ugly try/catch XHR instantiation. What\
    \ would happen if your Ajax page is loaded by a browser that does not support\
    \ XMLHttpRequest? It ought to find a way, if possible, to provide all (or at least\
    \ some) of its functionality by other means. For example, some remoting toolkits\
    \ will use a hidden iframe to fake XHR support to the page.\n\nFigure 5.1 lists\
    \ a handful of such frameworks, and shows what each attempts to provide to developers.\
    \ The Dojo Toolkit, JSON-RPC, and Prototype are pure JavaScript frameworks that\
    \ are agnostic about the world of the server side (although Prototype was built\
    \ with Ruby in mind).\n\n### iframes\n\nPrior to the broad adoption of the XMLHttpRequest\
    \ object, many web applications were using a hidden iframe to accomplish in-page\
    \ round trips back to the server. An iframe is just like a normal HTML frame (a\
    \ container that can be targeted at a URL and render the results) except that\
    \ it is embedded in another page. These applications simply created an iframe\
    \ of 0px, which caused it to refresh again a given URL in order to pull more data\
    \ back from the server.\n\nWhile the technique is valid, and worked for many,\
    \ there were two inherent problems. The first is, if you wanted asynchronous requests,\
    \ you had to use iframes. The second is that it was difficult to manage the state-state\
    \ of the page. The third is that it was very hard to handle errors gracefully.\n\
    \n### Toolkit Resources\n\n- Dojo\n- Prototype\n- DWR\n- Backbase\n- SmartClient\n\
    - Ajax.NET\n- SAJAX\n- JSON-RPC\n\n### UI Components\n\nToolkits such as Dojo\
    \ give us widgets like trees, tabbed panes or menus. These are self-contained.\n\
    \n### Web Application Toolkit\n\nToolkits such as SmartClient aim to give an application\
    \ that looks and feels the same as a native application on Windows or Mac. The\
    \ result is still very HTML.\n\n### Markup Based\n\nBackbase allows you to add\
    \ rich components through a markup-API. Your traditional HTML becomes something\
    \ like:\n\n```html\n<cmp bbase=\"true\" style=\"display:none\" xmlns=\"http://www.backbase.com/site/nav\"\
    >\n  <s:event b:on=\"construct\" b:action=\"show\">\n    <!-- everything that\
    \ is never shown - here -->\n    <div style=\"display:none;\">\n      <s:include\
    \ burl=\"/chrome/bb3/skin.xml\">\n      <s:include burl=\"/data/navigation.xml\"\
    >\n      <s:include burl=\"/data/forms.xml\">\n      <!-- listeners for non-BDOC\
    \ documents... -->\n      <div id=\"form\">\n        <s:event b:on=\"show-page\"\
    \ b:action=\"select\" b:target=\"id('formBuffer')\" />\n      </div>\n    </div>\n\
    \    <s:event b:on=\"nav-show-page\" b:action=\"select\" b:target=\"id('shop_main')\"\
    \ />\n  </div>\n  <!-- Contains references to protected buffers -->\n  <!-- Trigger\
    \ 'command' event to issue butterirty on them all -->\n  <div id=\"clear_protected_trigger\"\
    >\n    <s:event b:on=\"command\">\n      <s:task b:action=\"command\" b:event=\"\
    command\" b:target=\"*\" b:test=\" />\n    </s:event>\n  </div>\n  <!-- Include\
    \ shop -->\n  <s:include burl=\"/shop/shopIndex.html?cmd=index\" />\n</cmp>\n\
    ```\n\nSuch a framework could potentially enable a new generation of visual development\
    \ tools. Part of the problem with such tools is the conflict between markup and\
    \ code. Traditional JavaScript-based pages have caused problems for such tools\
    \ because it is difficult to provide visual representations of code changes. An\
    \ all-markup framework, on the other hand, would provide the right abstractions\
    \ for these kinds of development environments. See, for example, the markup-based\
    \ components in ASP.NET, Tapestry and Java Server Faces.\n"
