- fmt: "\n# Challenge #1\n\nWrite a function that produces the Fibonacci sequence\
    \ from 0 to `n` (where `n` is the function input)\n\nWhat’s the recurrence relation?\
    \ How do you test to see if the function works? What’s its complexity? How do\
    \ you make it bug-free? How do you make it ‘faster’? How would you code it if\
    \ you had limited RAM?\n\n# Challenge #2\n\nWrite a function that produces the\
    \ factorial for an input number.\n\nWhat’s the recurrence relation? How do you\
    \ test to see if the function works? What’s its complexity? How do you make it\
    \ bug-free? How do you make it ‘faster’? How would you code it if you had limited\
    \ RAM?\n\n# Chapter 1.1: Fibonacci Numbers\n\nIn short, a Fibonacci number is\
    \ comprised of the sum of the previous two numbers. For example, the 5th Fibonacci\
    \ number is the sum of the 4th and 3rd Fibonacci numbers; the 6th Fibonacci number\
    \ is the sum of the 5th and 4th Fibonacci numbers; and so on. Together, all the\
    \ Fibonacci numbers compose a limitless sequence.\n\nFor some entry-level and\
    \ intermediate positions, this may be a popular coding challenge to implement.\
    \ You may not need to explain what a Fibonacci sequence is, but you definitely\
    \ need to implement it in code - and sometimes be able to explain the details\
    \ behind it.\n\n## Recurrence Relation\n\nThe recurrence relation for Fibonacci\
    \ numbers is as follows:\n\n`F(0) = 0` or less;\n\n`F(1) = 1;`\n\n`F(n) = F(n-1)\
