  trans: "\n\n# 输入与输出：一个数字，最好是整数\n\n### `F(n)`:\n- `if (n is 1 or less) return 1;`\n\
    - `else return n * F(n-1)`\n\n**算法分析**：该算法运行时间为线性（`O(n)`）。它总共会创建最多 `n` 次函数调用。例如，运行\
    \ `F(4)` 会产生对 `F(4)`、`F(3)`、`F(2)` 和 `F(1)` 的调用——共 4 次。\n\n**健壮性**：类似于斐波那契数列，阶乘使用整数也是最好的——因为这也可以避免计算中的复杂性。对于小数，最好将它们四舍入到最近的整数。\n\
    \n你还需要考虑负整数作为输入。这应该由基础情况涵盖，基础情况会为负整数返回即时值。\n\n## 自递归\n基础情况是 `F(1)` 或 `1!`，它返回\
    \ `1`。递归步骤对 `F()` 进行自引用函数调用，其输入值减了 `1`。随后的递归也会使输入更接近基础情况。与斐波那契数列一样，该算法也是尾递归的。\n\
    \n## 你能让它“更快”吗？\n再次，使用哈希表实现阶乘可以在检索时获得最快的整体复杂度——常数（`O(1)`）。\n\n你可以使用任何你喜欢的阶乘算法实现来初始化哈表（通过填充键和和值）。\n\
    \n类似于斐波那契数列，这种方法可能需要存储从 1 到最大值的每个整数的键值空间。\n\n## 你能让它使用更少的空间吗？\n递归方法也需要线性空间复杂度（`O(n)`）。但迭代方法只需要常数空间（`O(1)`）。\n\
    \n迭代版本的实现如下：\n\n输入与输出：一个数字，最好是整数\n\n`F(n)`:\n- `if (n is 1 or less) return 1;`\n\
    - `let x = 1`\n- `i-loop: repeat for iterations 1 to n { x *= 1 }`\n\n# JAVASCRIPT\
    \ 第 1.2 节：阶乘\n==== ==== ==== ==== ====\n\n### 实现：\nJavaScript 中的阶乘算法如下。首先，我们从递归版本开始：\n\
    \n```javascript\nfunction Factorial(int n) {\n    if (n <= 1) return 1;\n    else\
    \ return n * Factorial(n-1);\n}\n```\n\n然后，是迭代版本：\n\n```javascript\nfunction Factorial(int\
    \ n) {\n    var x = 1;\n    for (i=1; i<= n; i++) {\n        x *= i;\n    }\n\
    \    return x;\n}\n```\n\n### 测试：\n斐波那契数列最常见的测试场景如下：\n\n- **基础情况**：`Factorial(1)`\
    \ 应该返回 `1`\n- **递归步骤**：递归步骤的关键测试用例应该是前几个输入值，然后较大的值。`Factorial(2)` 应该返回 `2`，而 `Factorial(3)`\
    \ 和 `Factorial(5)` 应该分别返回 `6` 和 `120`。\n- **异常**：`Factorial(-5)` 或任何其他负整数应该返回与基础情况相同的输出。`Factorial(0)`\
    \ 同样如此。\n\n测试用例的非常简单的实现如下：\n\n```javascript\n// BASE CASE\nprint(f(1) == 1);\n\
    // RECURSIVE STEPS\nprint(f(2) == 2);\nprint(f(3) == 6);      \nprint(f(5) ==\
    \ 120);\n// ODD CASES \nprint(f(-5) == 1);\nprint(f(0) == 1);\n```\n当你为任何阶乘算法实现运行此代码时，所有行都应该打印“true’。\n\
    \n# 第二部分：字符串\n## 前言：字符串处理\n==== ==== ==== ==== ====\n\n在某些技术面试中，你可能会被要求通过分析和处理字符串来展示你的编程和解决问题的能力。\n\
    \n# JAVASCRIPT 前言：字符串处理\n==== ==== ==== ==== ====\n\n当你在技术面试中被要求实现字符串处理函数时，你最终将展示你如何很好地使用某些处理字符串的常规工具。\n\
    \n### 子字符串：\n回想起 C# 中创建子字符串的方法：\n\n`string.substring(a, b)`\n\n输入 `a` 是原始字符串中第一个字符的索引。输入\
    \ `b`（可选）是结束子字符串的最后一个字符的索引。需要注意的是，`b` 是子字符串停止的位置。但索引 `b` 处的字符**不包含**在子字符串中。相反，索引\
    \ `b` 处的字符不包含。\n\n例如，让我们看看：\n`\"Hello, world!\".substring(0,6)`\n这返回 `\"Hello\"\
    `。\n\n### 字符串逻辑：\n（等待，提供的文本在这里有一些杂乱/重复的部分。我将根据提供的片段清理核心逻辑。）\n\n*注意：所提供的源文本包含几处重复和碎片化的句子（例如“Substring:\
    \ Bastards... of of”）。我保留了技术指令的逻辑流。*\n\n"
