    INTRODUCTION


    ==== ==== ==== ==== ====


    As one of the three core web technologies (besides HTML and CSS), Javascript originally
    provided functionality and dynamics to web design, web interfaces, and front-end
    technology.


    Though Javascript is a beginner-friendly language, its full capabilities were
    initially often underestimated and limited to only front-end based web programming. 
    However, with new frameworks, libraries, and other supporting technology for Javascript
    - such as Node, Bootstrap, JQuery, React, AngularJS, and countless others - Javascript
    becomes an immensely popular and universally used programming language. It has
    become sufficiently flexible to take on diverse programming projects, such as
    charts, graphics, advanced mathematics, dynamic web pages, server-side programming,
    and more.  Demand for Javascript programmers has steadily increased, and so has
    demand for particular Javascript technologies. Countless firms have even adopted
    Javascript into their tech stacks.


    And so it has become incredibly important to be sufficiently proficient in Javascript.
    Note that this language is also vastly different from other programming languages,
    especially other functional and object-oriented ones. Tech firms will thoroughly
