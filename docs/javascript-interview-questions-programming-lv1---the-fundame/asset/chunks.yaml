- fmt: "\n# INPUT & OUTPUT: a number, preferably an integer\n\n### `F(n)`:\n- `if\
    \ (n is 1 or less) return 1;`\n- `else return n * F(n-1)`\n\n**Algorithm Analysis**:\
    \ The algorithm runs in linear time (`O(n)`). It creates up to a total of `n`\
    \ function calls overall. For example, running `F(4)` would make function calls\
    \ to `F(4)`, `F(3)`, `F(2)`, and `F(1)` - 4 total calls.\n\n**Robustness**: Much\
    \ like Fibonacci numbers, it’s also best for factorials to use integers - as this\
    \ also avoids complications in calculations. For numbers with decimals, it’s also\
    \ best to round them to the nearest whole number.\n\nYou also need to account\
    \ for negative integers as inputs. This should be covered by the base case, which\
    \ returns an instant value for negative integers.\n\n## Self-Recursion\nThe base\
    \ case is `F(1)`, or `1!`, which returns `1`. The recursive step makes a self-referencing\
    \ function call to `F()`, with its input decremented by `1`. Subsequent recursions\
    \ also progress inputs closer to the base case. Much like the Fibonacci numbers,\
    \ this algorithm is also tail-recursive.\n\n## Can you make it “faster”?\nAgain,\
    \ implementing factorial numbers using a hash table gives you the fastest overall\
    \ complexity - constant (`O(1)`) - when retrieving.\n\nYou may initialize the\
    \ hash table (by populating it with keys and values) using any factorial algorithm\
    \ implementation you wish.\n\nMuch like Fibonacci numbers, this approach may require\
    \ space the keys and values of every positive integer - from 1 to the max value.\n\
    \n## Can you make it use less space?\nThe recursive approach would also require\
    \ linear space complexity (`O(n)`). But an iterative approach would only require\
    \ constant space (`O(1)`).\n\nThe implementation for the iterative version is\
    \ as follows:\n\nINPUT & OUTPUT: a number, preferably an integer\n\n`F(n)`:\n\
    - `if (n is 1 or less) return 1;`\n- `let x = 1`\n- `i-loop: repeat for iterations\
    \ 1 to n { x *= 1 }`\n\n# JAVASCRIPT Chapter 1.2: Factorials\n==== ==== ==== ====\
    \ ====\n\n### Implementation:\nThe Factorial algorithm in Javascript is as follows.\
    \ First, we start with the recursive version:\n\n```javascript\nfunction Factorial(int\
    \ n) {\n    if (n <= 1) return 1;\n    else return n * Factorial(n-1);\n}\n```\n\
    \nThen, the iterative one:\n\n```javascript\nfunction Factorial(int n) {\n   \
    \ var x = 1;\n    for (i=1; i<= n; i++) {\n        x *= i;\n    }\n    return\
    \ x;\n}\n```\n\n### Testing:\nThe most common test scenarios for Fibonacci series\
    \ is as follows:\n\n- **Base Cases**: `Factorial(1)` should return `1`\n- **Recursive\
    \ Steps**: The key test cases for the recursive step should be the first few input\
    \ values, then the larger ones. `Factorial(2)` should return `2`, while `Factorial(3)`\
    \ and `Factorial(5)` should return `6` and `120`, respectively.\n- **Odd Cases**:\
    \ `Factorial(-5)` or any other negative integer should return the equivalent output\
    \ of the base case. The same applies to `Factorial(0)`.\n\nA very simple implementation\
    \ of the test cases is as follows:\n\n```javascript\n// BASE CASE\nprint(f(1)\
    \ == 1);\n// RECURSIVE STEPS\nprint(f(2) == 2);\nprint(f(3) == 6);      \nprint(f(5)\
    \ == 120);\n// ODD CASES \nprint(f(-5) == 1);\nprint(f(0) == 1);\n```\nAll lines\
    \ should print ‘true’ when you run this code for any implementation of the factorial\
    \ algorithm.\n\n# PART II: Strings\n## PRELUDE: String Manipulation\n==== ====\
    \ ==== ==== ====\n\nIn some tech interviews, you may be asked to demonstrate your\
    \ programming and problem solving skills by analyzing and manipulating strings.\n\
    \n# JAVASCRIPT PRELUDE: String Manipulation\n==== ==== ==== ==== ====\n\nWhen\
    \ you’re asked to implement string manipulation functions during tech interviews,\
    \ you’ll eventually show how well you can use certain conventional tools for handling\
    \ strings. Here, we go over some of the important programming aspects for strings.\n\
    \n### Substrings:\nRecall that creating substrings in C# is done as so:\n\n`string.substring(a,\
    \ b)`\n\nInput `a` is the index of the first character within the original string.\
    \ Input `b` (optional) is the index of the last character which ends the substring.\
    \ It’s important to note that `b` is where the substring stops. But the character\
    \ at index `b` IS NOT included in the substring. Instead, the character at index\
    \ `b` is not included.\n\nFor example, let’s look at:\n`\"Hello, world!\".substring(0,6)`\n\
    This returns `\"Hello\"`.\n\n### String logic:\n(Wait, the provided text has some\
    \ garbled/repetitive sections here. I will clean up the core logic based on the\
    \ provided snippets.)\n\n*Note: The source text provided contained several repetitive\
    \ and fragmented sentences (e.g., \"Substring: Bastards... of of\"). I have preserved\
    \ the logical flow of the technical instructions.*\n"
