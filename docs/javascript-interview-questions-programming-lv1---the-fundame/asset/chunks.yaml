    \n## Challenge #1\n\nWrite a function that reverses a string.\n\nHow do you test\
    \ to see if the function works? What’s its complexity? How do you make it ‘faster’?\
    \ How would you code it if you had limited RAM?\n\n## Chapter 2.1: String Reversal\n\
    \nThe task is to create a function that takes a string and returns a version in\
    \ which the order of characters are reversed. For example, the function would\
    \ take the string “candy grams” and return “smarg ydnac”.\n\nThis is a commonly\
    \ asked tech interview question usually from local tech sectors. It may appear\
    \ simple, but applicants may be rated on how fast, efficient, or extensive they\
    \ solve this problem.\n\n### Algorithm\n\nThere are two main ways to approach\
    \ this problem: recursively and iteratively. The recursive algorithm would look\
    \ like so:\n\nINPUT & OUTPUT: a string\n\n`strRev(s)`:\n\n- `if (length of s <=\
    \ 1)` return `s;`\n- `else` return `(last char of s)` + `strRev(s with the first\
    \ & last chars removed)` + `+ (1st char of s)`\n\nThe iterative version has two\
    \ different approaches depending on whether you would iterate from first to last\
    \ or vice versa.\n\nINPUT & OUTPUT: a string\n\n`strRev(s)`:\n\nFirst to last:\n\
    \n- `let r = \"\"`\n- `i-loop`: repeat for iterations `0` to `(length of s) -1`\
    \ {\n- `set r to r + (char from s at position 0)}`\n- `return r`\n\nLast to first:\n\
    \n- `let r = \"\"`\n- `i-loop`: repeat for iterations `(length of s) -1` to `0`{\n\
    - `set r to (char from s at position 0) + r}\n- `return r`\n\n**Algorithm Analysis**:\
    \ The algorithm versions above are in linear time (`O(n)`). The recursive version\
    \ will have a number of function calls equal to half the string length. Hence\
    \ its time complexity is `O(0.5n)`. Both iterative versions will loop through\
    \ each character in the string, which results in a time complexity of `O(n)`.\n\
    \nThe recursive version will have a linear space complexity (`O(n)`), allocating\
    \ room in the runtime stack for each function call. Both iterative versions will\
    \ have constant space complexity (`O(1)`) because the number of function calls,\
    \ local variables, and values involved are constant - regardless of string length.\n\
    \n#### Can you make it “faster”?\n\nYes. If you implement a hash table for this\
    \ function, it can retrieve previously solved solutions in constant time (`O(1)`).\
    \ However, users have to enter new key-value combinations using the regular implementations.\n\
    \nThe hash implementation would then look like this:\n\nINPUT & OUTPUT: a string\n\
    \n`strRevHash(s)`:\n\n- `let x = return value of Hash(s)`\n- `if x isn’t empty\
    \ or null`, return `x`\n- `else` {\n- `let y = return value of strRev(s)` (using\
    \ any implementation you like)\n- `insert new hash entry:`\n`key = s`\n`value\
    \ = y`\n- `return y}\n\n#### Can you make it use less space?\n\nAs mentioned earlier,\
    \ the implementation with the least amount of space required is either one of\
    \ the iterative versions.\n\n## JAVASCRIPT Chapter 2.1: String Reversal\n\n###\
    \ Implementation\n\nHere are the various string reversal implementations in Javascript.\
    \ First, we have the recursive version:\n\n```javascript\nfunction strRev(s) {\n\
    \    var le = s.length;\n    if (le <= 1) return s;\n    else return s.substr(le-1,\
    \ 1)\n          + strRev(s.substr(1, le-2))\n          + s.substr(0, 1);\n}\n\
    ```\n\nNext are the iterative versions. Here is the last-to-first version:\n\n\
    ```javascript\nfunction strRev(s) {\n    var le = s.length;\n    var r = \"\"\
    ;\n    for(i=le-1;i>=0;i--){\n        r += s.substr(i, 1); \n    }\n    return\
    \ r; \n}\n```\n\nAnd here is the first-to-last version:\n\n```javascript\nfunction\
    \ strRev(s) {\n    var le = s.length;\n    var r = \"\";\n    for(i=0;i<le;i++){\n\
    \        r = s.substr(i, 1) + r;  \n    }\n    return r; \n}\n```\n\n### Testing\n\
    \nHere are some of the most common test scenarios for string reversals:\n\n**Base\
    \ Cases**: `strRev(\"\")` and `strRev(x)`, where `x` is any string with only a\
    \ single character, should both return their respective inputs.\n\n**Recursive\
    \ Steps**: Four key scenarios you want to test are short and long palindromes,\
    \ as well as short and long strings. `strRev()` should return short palindromes\
    \ (such as “bb” and “aba”) and long ones (“racecar” and “abcdefgfedcba”) as themselves.\
    \ `strRev()` should input strings and return properly reversed versions of those\
    \ inputs. For example, `strRev(“ab”)` should return “ba” and `strRev(“candygram”)`\
    \ should return “margydnac”.\n\nHere are a few simplified versions of the test\
    \ cases:\n\n```javascript\n// BASE CASE\nprint(strRev(\"\") == \"\");\nprint(strRev(\"\
    a\") == \"a\");\n\n// RECURSIVE STEPS\nprint(strRev(\"bb\") == (\"bb\"));\nprint(strRev(\"\
    ba\") == (\"ab\")); \nprint(strRev(\"racecar\") == (\"racecar\"));\nprint(strRev(\"\
    asdf\") == (\"fdsa\"));\nprint(strRev(\"candygram\") == (“margydnac\"));\n```\n\
    \nRegardless of which string reversal implementation you use, each line above\
    \ should print ‘true’ when run.\n"
  raw: 'NOTE: Try to attempt them on your own first! It’s part of the learning experience!


    Challenge #1:


    Write a function that reverses a string.


    How do you test to see if the function works? What’s its complexity? How do you
    make it ‘faster’? How would you code it if you had limited RAM?


    Chapter 2.1: String Reversal


    ==== ==== ==== ==== ====


    The task is to create a function that takes a string and returns a version in
    which the order of characters are reversed. For example, the function would take
    the string “candy grams” and return “smarg ydnac”.


    This is a commonly asked tech interview question usually from local tech sectors.
    It may appear simple, but applicants may be rated on how fast, efficient, or extensive
    they solve this problem.


    Algorithm


    There are two main ways to approach this problem: recursively and iteratively.
    The recursive algorithm would look like so:


    INPUT & OUTPUT: a string


    strRev(s):


    - if (length of s <= 1) return s;


    - else return (last char of s) + strRev(s with the first & last chars removed)


    + (1st char of s)


    The iterative version has two different approaches depending on whether you would
    iterate from first to last or vice versa.


    INPUT & OUTPUT: a string


    strRev(s):


    First to last:


    - let r = “”


    - i-loop: repeat for iterations 0 to (length of s) -1 {


    - set r to r + (char from s at position 0)}


    - return r


    Last to first:


    - let r = “”


    - i-loop: repeat for iterations (length of s) -1 to 0{


    - set r to (char from s at position 0) + r}


    - return r


    Algorithm Analysis: The algorithm versions above are in linear time (O(n)). The
    recursive version will have a number of function calls equal to half the string
    length. Hence its time complexity is O(0.5n). Both iterative versions will loop
    through each character in the string, which results in a time complexity of O(n). 


    The recursive version will have a linear space complexity (O(n)), allocating room
    in the runtime stack for each function call. Both iterative versions will have
    constant space complexity (O(1)) because the number of function calls, local variables,
    and values involved are constant - regardless of string length.


    Can you make it “faster”?


    Yes. If you implement a hash table for this function, it can retrieve previously
    solved solutions in constant time (O(1)). However, users have to enter new key-value
    combinations using the regular implementations.


    The hash implementation would then look like this:


    INPUT & OUTPUT: a string


    strRevHash(s):


    - let x = return value of Hash(s)


    - if x isn’t empty or null, return x


    - else {


    - let y = return value of strRev(s)


    (using any implementation you like)


    - insert new hash entry:


    key = s


    value = y


    - return y}


    Can you make it use less space?


    As mentioned earlier, the implementation with the least amount of space required
    is either one of the iterative versions.


    JAVASCRIPT Chapter 2.1: String Reversal


    ==== ==== ==== ==== ====


    Implementation:


    Here are the various string reversal implementations in Javascript. First, we
    have the recursive version:


         function strRev(s) {


            var le = s.length;


            if (le <= 1) return s;


            else return s.substr(le-1, 1)


                + strRev(s.substr(1, le-2))


                + s.substr(0, 1);}


    Next are the iterative versions. Here is the last-to-first version:


         function strRev(s) {


            var le = s.length;


            var r = "";


           for(i=le-1;i>=0;i--){


                r += s.substr(i, 1); }


    return r; }


    And here is the first-to-last version:


         function strRev(s) {


            var le = s.length;


            var r = "";


          for(i=0;i<le;i++){


               r = s.substr(i, 1) + r;  }


            return r; 


    }


    Testing:


    Here are some of the most common test scenarios for string reversals:


    Base Cases: strRev(“”) and strRev(x), where x is any string with only a single
    character, should both return their respective inputs.


    Recursive Steps: Four key scenarios you want to test are short and long palindromes,
    as well as short and long strings. strRev() should return short palindromes (such
    as “bb” and “aba”) and long ones (“racecar” and “abcdefgfedcba”) as themselves.
    strRev() should also input strings and return properly reversed versions of those
    inputs. For example, strRev(“ab”) should return “ba” and strRev(“candygram”) should
    return “margydnac”.


    Here are a few simplified versions of the test cases:


    // BASE CASE


            print(strRev("") == "");


            print(strRev("a") == "a");


    // RECURSIVE STEPS


            print(strRev("bb") == ("bb"));


            print(strRev("ba") == ("ab")); 


            print(strRev("racecar") == ("racecar"));


            print(strRev("asdf") == ("fdsa"));


            print(strRev("candygram") == (“margydnac"));


    Regardless of which string reversal implementation you use, each line above should
    print ‘true’ when run.'
