  trans: "\n\n注意：请先尝试自己完成！这是学习体验的一部分！\n\n## 挑战 #1\n\n编写一个反转字符串的函数。\n\n你如何测试该函数是否正常工作？它的复杂度是多少？你如何让它“更快”？如果\
    \ RAM 内存有限，你会如何编写？\n\n## 第 2.1 节：字符串反转\n\n任务是创建一个函数，该函数接收一个字符串并返回一个字符顺序反转后的版本。例如，函数接收字符串“candy\
    \ grams”并返回“smarg ydnac”。\n\n这是一个常见的技术面试题，通常来自当地的技术领域。它看起来可能很简单，但面试官可能会根据你解决此问题的速度、效率或全面性进行评分。\n\
    \n### 算法\n\n解决这个问题有两种主要方法：递归和迭代。递归算法如下：\n\n输入与输出：字符串\n\n`strRev(s)`:\n\n- `if\
    \ (length of s <= 1)` 返回 `s;`\n- `else` 返回 `(s 的最后一个字符)` + `strRev(去除了第一个和最后一个字符的\
    \ s)` + `+ (s 的第一个字符)`\n\n迭代版本有两种不同的方法，取决于你是从头到尾遍历，还是反过来遍历。\n\n输入与输出：字符串\n\n`strRev(s)`:\n\
    \n从头到尾：\n\n- `let r = \"\"`\n- `i-loop`: 重复 `0` 到 `(length of s) -1` 的迭代 {\n-\
    \ `将 r 设置为 r + (s 中位置为 0 的字符)}`\n- `return r`\n\n从尾到头：\n\n- `let r = \"\"`\n-\
    \ `i-loop`: 重复 `(length of s) -1` 到 `0` 的迭代 {\n- `将 r 设置为 (s 中位置为 0 的字符) + r}\n\
    - `return r`\n\n**算法分析**：上述算法版本均为线性时间复杂度（`O(n)`）。递归版本的函数调用次数等于字符串长度的一半。因此，其时间复杂度为\
    \ `O(0.5n)`。两种迭代版本都会遍历字符串中的每个字符，导致时间复杂度为 `O(n)`。\n\n递归版本具有线性空间复杂度（`O(n)`），因为它在运行时堆栈中为每个函数调用分配空间。两个迭代版本都具有常数空间复杂度（`O(1)`），因为涉及的函数调用次数、局部变量和值是固定的——与字符串长度无关。\n\
    \n#### 你能让它“更快”吗？\n\n可以。如果你为此函数实现哈希表，它可以以常数时间（`O(1)`）检索之前解决过的解决方案。然而，用户必须使用标准实现输入新的键值组合。\n\
    \n哈希实现看起来如下：\n\n输入与输出：字符串\n\n`strRevHash(s)`:\n\n- `let x = Hash(s) 的返回值`\n- `if\
    \ x 不为空或空`，返回 `x`\n- `else` {\n- `let y = strRev(s) 的返回值`（使用任何你喜欢的实现）\n- `插入新哈希项：`\n\
    `key = s`\n`value = y`\n- `return y}\n\n#### 你能让它更省空间吗？\n\n如前所述，空间消耗的实现是迭代版本之一。\n\
    \n## JAVASCRIPT 第 2.1 节：字符串反转\n\n### 实现\n\n以下是 JavaScript 中的各种字符串反转实现。首先是递归版本：\n\
    \n```javascript\nfunction strRev(s) {\n    var le = s.length;\n    if (le <= 1)\
    \ return s;\n    else return s.substr(le-1, 1)\n          + strRev(s.substr(1,\
    \ le-2))\n          + s.substr(0, 1);\n}\n```\n\n接下来是迭代版本。这里是从尾到头的版本：\n\n```javascript\n\
    function strRev(s) {\n    var le = s.length;\n    var r = \"\";\n    for(i=le-1;i>=0;i--){\n\
    \        r += s.substr(i, 1); \n    }\n    return r; \n}\n```\n\n这里是从头到尾的版本：\n\
    \n```javascript\nfunction strRev(s) {\n    var le = s.length;\n    var r = \"\"\
    ;\n    for(i=0;i<le;i++){\n        r = s.substr(i, 1) + r;  \n    }\n    return\
    \ r; \n}\n```\n\n### 测试\n\n以下是字符串反转一些常见的测试场景：\n\n**基础情况**：`strRev(\"\")` 和 `strRev(x)`（其中\
    \ `x` 是任何仅包含单个字符的字符串）都应返回相应的输入。\n\n**递归步骤**：你想测试的四个关键场景是短回文和长回文，以及短字符串和长字符串。`strRev()`应该将短回文（如“bb”和“aba”）和长回文（“racecar”和“abcdefgfedcba”）返回本身。`strRev()`\
    \ 应该输入字符串并返回这些输入的正确反转版本。例如，`strRev(\"ab\")` 应返回“ba”，而 `strRev(\"candygram\")`\
    \ 应返回“margydnac”。\n\n以下是几个简化的测试用例：\n\n```javascript\n// 基础情况\nprint(strRev(\"\"\
    ) == \"\");\nprint(strRev(\"a\") == \"a\");\n\n// 递归步骤\nprint(strRev(\"bb\") ==\
    \ (\"bb\"));\nprint(strRev(\"ba\") == (\"ab\")); \nprint(strRev(\"racecar\") ==\
    \ (\"racecar\"));\nprint(strRev(\"asdf\") == (\"fdsa\"));\nprint(strRev(\"candygram\"\
    ) == (“margydnac\"));\n```\n\n无论你使用哪种字符串反转实现，运行上述每一行都应打印“true’。\n\n"
