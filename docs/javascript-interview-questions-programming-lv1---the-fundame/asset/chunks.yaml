    \ be covered by the base case, which returns an instant value for negative integers.\n\
    \nSelf-Recursion\n\nThe base case is F(1), or 1!, which returns 1\\. The recursive\
    \ step makes a self-referencing function call to F(), with its input decremented\
    \ by 1\\. Subsequent recursions also progress inputs closer to the base case.\
    \ Much like the Fibonacci numbers, this algorithm is also tail-recursive.\n\n\
    Can you make it “faster”?\n\nAgain, implementing factorial numbers using a hash\
    \ table gives you the fastest overall complexity - constant (O(1)) - when retrieving.\n\
    \nYou may initialize the hash table (by populating it with keys and values) using\
    \ any factorial algorithm implementation you wish.\n\nMuch like Fibonacci numbers,\
    \ this approach may require space the keys and values of every positive integer\
    \ - from 1 to the max value.\n\nCan you make it use less space?\n\nThe recursive\
    \ approach would also require linear space complexity (O(n)). But an iterative\
    \ approach would only require constant space (O(1)).\n\nThe implementation for\
    \ the iterative version is as follows:\n\nINPUT & OUTPUT: a number, preferably\
    \ an integer\n\nF(n):\n\n- if (n is 1 or less) return 1;\n\n- let x = 1\n\n- i-loop:\
    \ repeat for iterations 1 to n {\n\nx *= 1\n\nJAVASCRIPT Chapter 1.2: Factorials\n\
    \n==== ==== ==== ==== ====\n\nImplementation:\n\nThe Factorial algorithm in Javascript\
    \ is as follows. First, we start with the recursive version:\n\nfunction Factorial(int\
    \ n) {\n\n        if (n <= 1) return 1;\n\n        else return n * Factorial(n-1);\n\
    \n}\n\nThen, the iterative one:\n\nfunction Factorial(int n) {\n\n           var\
    \ x = 1;\n\n            for (i=1; i<= n; i++) {\n\n                x *= i;\n\n\
                }\n\n            return x; \n\n}\n\nTesting:\n\nThe most common test\
    \ scenarios for Fibonacci series is as follows:\n\nBase Cases: Factorial(1) should\
    \ return 1\n\nRecursive Steps: The key test cases for the recursive step should\
    \ be the first few input values, then the larger ones. Factorial(2) should return\
    \ 2, while Factorial(3) and Factorial(5) should return 6 and 120, respectively.\n\
    \nOdd Cases: Factorial(-5) or any other negative integer should return the equivalent\
    \ output of the base case. The same applies to Factorial(0).\n\nA very simple\
    \ implementation of the test cases is as follows:\n\n// BASE CASE\n\n        print(f(1)\
    \ == 1);\n\n// RECURSIVE STEPS\n\n        print(f(2) == 2);\n\n        print(f(3)\
    \ == 6);      \n\n        print(f(5) == 120);\n\n// ODD CASES \n\n        print(f(-5)\
    \ == 1);\n\n        print(f(0) == 1);\n\nAll lines should print ‘true’ when you\
    \ run this code for any implementation of the factorial algorithm.\n\nPART II:\
    \ Strings\n\nPRELUDE: String Manipulation\n\n==== ==== ==== ==== ====\n\nIn some\
    \ tech interviews, you may be asked to demonstrate your programming and problem\
    \ solving skills by analyzing and manipulating strings.\n\nJAVASCRIPT PRELUDE:\
    \ String Manipulation\n\n==== ==== ==== ==== ====\n\nWhen you’re asked to implement\
    \ string manipulation functions during tech interviews, you’ll eventually show\
    \ how well you can use certain conventional tools for handling strings. Here,\
    \ we go over some of the important programming aspects for strings.\n\nSubstrings:\n\
    \nRecall that creating substrings in C# is done as so:\n\nstring.substring(a,\
    \ b)\n\nInput a is the index of the first character within the original string.\
    \ Input b (optional) is the index of the last character which ends the substring.\
    \ It’s important to note that b is where the substring stops. But the character\
    \ at index b IS NOT included in the substring. Instead, the one before it (index\
    \ b-1) is included and is the substring endpoint.\n\nFor example, let’s look at\
    \ the line below:\n\n\"Hello, world!\".substring(1,6)\n\nThe line prints the word\
    \ ‘Hello,’ when you run it. The substring starts at index 0, which is ‘H’. It\
    \ ends at index 6-1 = 5, which is ‘,’. Index 5 is a space bar which is the first\
    \ character just after the substring ends.\n\nSubstring Practice:\n\nWrite the\
    \ code to create the following substrings from the corresponding strings:\n\n\
    Substring:String:\n\n“Bastards”“Battle of the Bastards”\n\n“ant”“Kobe Bryant”\n\
    \n“hype”“hyperbole”\n\n“New”“Eye of Newt”\n\n“the”“Guardians of the Galaxy”\n\n\
    “winter”“Now is the winter of YOUR discontent.”\n\n“You lie.”“You need to believe\
    \ in me.”\n\nString Lengths:\n\nIn practice, identifying the length of a string\
    \ via code is an essential coding tool. Recall that getting the string length\
    \ in C# is as so:\n\nstring.length\n\nThe output of the code above is an integer.\
    \ Hence, it may only be written in the code where an integer is expected.\n\n\
    String Length Practice:\n\nWrite the code that gets the lengths of the following\
    \ strings:\n\n“Mayamuto”\n\n“Airplanes”\n\n“Jumanji Jumanji”\n\n“A Feast for Crows”\n\
    \n“I’ll Be Back”\n\nString Traversal\n\nSince a string is, by definition, a sequence\
    \ of characters, sometimes you’ll inevitably use iteration or recursion when manipulating\
    \ them. Therefore, it’s important to handle your loops and recursions - and avoid\
    \ loop-related exceptions and infinite loops.\n\nString Traversal: Recursion\n\
    \nFor a self-recursive approach, your recursive function call takes in a modified\
    \ version of your original string input as a parameter. It’s either an incremented\
    \ or decremented version, depending on the base case. To check for the base case,\
    \ you’ll have to utilize the string length.\n\nBelow is a generalized template\
    \ of a string-traversing recursive function:\n\nfunction procedure(x) {\n\n//\
    \ BASE CASE:\n\nif (x.length <= 0) {\n\nreturn <output>;}\n\n// RECURSIVE STEP:\n\
    \nelse {\n\n// (do something)\n\nvar xi = (string x with at least one char removed);\n\
    \nprocedure(xi);}}\n\nAlternatively, here is a version which increments the string\
    \ during the recursive step:\n\nfunction procedure(x) {\n\n// BASE CASE:\n\nvar\
    \ limit = <number your choice>\n\nif (x.length <= limit) {\n\nreturn <output>;\n\
    \n}\n\n// RECURSIVE STEP:\n\nelse {\n\n// (do something)\n\nvar y = (string to\
    \ add to x);\n\nvar xi = xi + y;\n\nprocedure(xi);\n\n}}\n\nString Traversal:\
    \ Iteration\n\nFor an iterative approach, the iterative loop process through each\
    \ character in the string one by one.\n\nBelow is a generalized template of an\
    \ iterative function, which goes from last to first:\n\nfunction procedure(x)\
    \ {\n\n        var le = x.length;\n\n       for(var i=le-1;i>=0;i--){\n\n // process\
    \ the string char here\n\n}\n\nreturn <output>; }\n\nBelow is another iterative\
    \ function, which goes from first to last:\n\nfunction procedure(x) {\n\n       \
    \ var le = x.length;\n\n       for(var i=le-1;i>=0;i--){\n\n // process the string\
    \ char here\n\n}\n\n        return <output>;\n\n}\n\nString Traversal Practice:\n\
    \nFor each of the following strings below, create a function that converts the\
    \ vowels into 1’s, consonants into 2’s, and everything else into 0’s, then prints\
    \ the result. Leave the spaces as just spaces. Use both recursion and iteration:\n\
    \n“”\n\n“ ”\n\n“a”\n\n“b”\n\n“*^%$”\n\n“As High As Honor.”\n\n“Supreme Leader”\n\
    \n“The Last Jedi”\n\n“KILL IT WITH FIRE !!!11”\n\nFor testing, the strings should\
    \ print out the following outputs:\n\n“”->“”\n\n“ ” ->“ ”\n\n“a” ->“a”\n\n“b”\
    \ ->“2”\n\n“*^%$”->“0000”\n\n“As High As Honor.”\n\n->“12 2122 12 212120”\n\n\
    “Supreme Leader” ->“2122121 211212”\n\n“The Last Jedi” ->“221 2122 2121”\n\n“KILL\
    \ IT WITH FIRE !!!11”\n\n->“2122 12 2122 2121 00000”\n\nChapter 2 Challenges\n\
    \n==== ==== ==== ==== ====\n\nBelow are the programming & problem solving challenges\
    \ for this chapter. Take a close, careful look at them at first. Then see if you\
    \ can attempt them on your own. After you’re finished, feel free to read ahead\
    \ to see how we approached them."
