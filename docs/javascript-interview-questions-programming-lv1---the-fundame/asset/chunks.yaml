    \n请记住，这不是一本你可以只需扫一眼就认为已经完成的书。你有多次机会来练习你的编程技能。此外，大多数章节都包含了技术面试中问过的**实际**问题。我建议你重读那些可能出现在你下一次技术面试中的问题。\n\
    \n最后，请尽情享受素材。你现在有机会在为潜在雇主做准备的同时展示你的编程技能。问问一位在现代科技公司工作的程序员，他/她会告诉你，为了精通编程投入时间和精力是值得的。\n\
    \n努力、勤奋，祝你好运！\n\n## 第一部分：数学\n\n### 第 1 章 挑战\n==== ==== ==== ==== ====\n以下是本章的编程与问题解决挑战。首先请仔细观察它们。然后看看你是否可以自己尝试。完成后，请随时向前阅读以查看我们是如何处理它们的。\n\
