  \n到目前为止，我们还没有为删除按钮和复选框添加任何功能，因为我们将在接下来的章节中介绍这些内容。\n\n# 使用 Supabase 设置数据库 (#toc.xhtml_s183a)\n\
  \n我们的应用现在从静态数组 `items` 渲染 UI，内容为 `[“去健身房”, “买杂货”, “取邮件”]`。在现实应用中，此类数据将存储在数据库中。我们将通过\
