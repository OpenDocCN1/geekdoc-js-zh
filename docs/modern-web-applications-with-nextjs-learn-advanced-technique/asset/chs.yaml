  **表 7.2：** 每种状态管理方案的优缺点\n\n## 使用 React state 和 hooks 实现状态管理\n\n让我们学习如何使用 React state\
  \ 实现状态管理，以及如何使用如 `useState` 和 `useContext` 等 hooks。\n\n`useState` 是 React 中的一个内置\
  \ hook，允许你向函数式组件中添加状态。它提供了一种在组件内部管理和更新状态的方法，而不再需要使用类组件。\n\n要使用 `useState` 实现状态管理，你可以遵循以下步骤：\n\
  \n1. 导入必要的依赖项：\n```javascript\nimport React, { useState } from ‘react';\n```\n\n\
  2. 使用 `useState` 定义并初始化状态：\n```javascript\nconst [state, setState] = useState(initialValue);\n\
  ```\n`state` 代表状态变量的当前值。\n`setState` 是一个用于更新状态的函数。\n`initialValue` 是你想要赋值给状态的初始值。\n\
  \n3. 在组件中使用该状态：\n```javascript\nreturn (\n  <div>\n    <p>Current state value: {state}</p>\n\
  \    <button onClick={() => setState(newValue)}>Update State</button>\n  </div>\n\
  );\n```\n\n4. 在 JSX 中使用 `{state}` 访问状态值。\n\n要更新状态，调用 `setState` 并传入你想要赋值的新值 (`newValue`)。\n\
  \n这是一个完整的示例，用于说明实现过程：\n```javascript\nimport React, { useState } from ‘react’;\n\
  \nconst MyComponent = () => {\n  const [count, setCount] = useState(0);\n  const\
  \ incrementCount = () => { \n    setCount(count + 1);\n  };\n\n  return (\n    <div>\n\
  \      <p>Count: {count}</p>\n      <button onClick={incrementCount}>Increment</button>\n\
  \    </div>\n  );\n};\n\nexport default MyComponent;\n```\n\n在这个示例中，`count` 是使用\
  \ `useState` 管理的状态变量，用于跟踪计数值。`incrementCount` 函数通过递增来更新 `count` 状态。该组件渲染当前的计数值和一个触发递增的按钮。\n\
  \n通过这些步骤，你可以轻松在函数式组件中使用 `useState` 实现状态管理。请记住，使用 `useState` 管理的状态对于声明它的组件是局部的。\n\
  \n`useContext` 是 React 中的一个内置 hook，允许你访问上下文对象的值。它提供了一种在函数式组件中消费上下文值的方法，而无需用上下文消费者包裹组件。\n\
  \n要使用 `useContext` 实现状态管理，你可以遵循以下步骤：\n\n* 使用 `React.createContext()` 创建上下文对象：\n\
  ```javascript\nconst MyContext = React.createContext();\n```\n* 使用 context provider\
  \ 包裹你的组件或多个组件并提供值：\n```javascript\nreturn (\n  <MyContext.Provider value={contextValue}>\n\
  \    { {/* 在此处放置你的组件 */}\n  </MyContext.Provider>\n);\n```\n`contextValue` 代表你想要在上下共享的值。\n\
  \n* 在组件中使用 `useContext` 消费上下文值：\n```javascript\nconst contextValue = useContext(MyContext);\n\
  ```\n在这里，`contextValue` 将包含由提供的值。\n\n这是一个完整的示例，用于说明实现过程：\n```javascript\nimport\
  \ React, { useContext } from ‘react’;\nconst MyContext = React.createContext();\n\
  \nconst ParentComponent = () => {\n  const contextValue = ‘Hello from context’;\n\
  \  return (\n    <MyContext.Provider value={contextValue}>\n      <ChildComponent\
  \ />\n    </MyContext.Provider>\n  );\n};\n\nconst ChildComponent = () => {\n  const\
  \ contextValue = useContext(MyContext);\n  return (\n    <div>\n      <p>Context\
  \ Value: {contextValue}</p>\n    </div>\n  );\n};\n\nexport default ParentComponent;\n\
  ```\n\n在这个示例中，`ParentComponent` 使用 context provider 包裹了 `ChildComponent`，提供了上下文值\
  \ `Hello from context`。`ChildComponent` 使用 `useContext` 消费并渲染该值。\n\n通过这些步骤，你可以使用\
  \ `useContext` 实现状态管理，并在函数式组件之间共享和消费上下文值。请记住根据你的特定用例和组件结构调整代码。\n\n## 在 Next.js 中管理状态的最佳实践\n\
  \n在 Next.js 应用中管理状态时，有几个最佳实践需要遵循以避免常见的错误并优化性能。以下是需要考虑的关键实践：\n\n* **最小化全局状态：** 通常建议尽可能减少全局状态的使用。全局状态会引入复杂性，并使难以难以推断应用程序中的数据流。相反，努力在单个组件或较小范围的上下文中进行局部化状态管理。\n\
  \n* **使用本地组件状态：** 利用 React 内置的状态管理能力（如 `useState`）来管理本地组件状态。这对于管理特定组件且不需要在多个组件之间共享的状态是理想的。\n\
  \n* **选择合适的状态管理库：** 如果你有复杂的状态管理需求，或需要在多个组件之间共享状态，请考虑使用 Redux 或 MobX 等状态管理库。这些库提供了管理状态的高级功能，并帮助扩展你的应用状态。\n\
  \n* **规范化状态形状：** 规范化你的状态结构以保持其简单和有序。这涉及将复杂的数据结构拆分为单独的实体并存储在规范化的格式中。规范化可以提高性能并简化数据检索和处理。\n\
  \n* **避免不必要的渲染：** 通过使用记忆化（memoization）和 `React.memo` 等技术优化组件以避免不必要的渲染。记忆化有助于防止昂贵的计算在每次渲染时重复，而\
  \ `React.memo` 可以在 props 发生变化时防止组件重新渲染。\n\n* **使用不可变性：** 不可变数据有助于优化性能，允许 React 高效判断组件是否需要重新渲染。避免直接修改状态对象，而是创建副本或使用\
  \ Immutable.js 或 Immer 等不可变数据结构。\n\n* **谨慎使用 react context：** React Context 是跨组件共享状态的强大工具，但如果过度使用可能会影响性能。请谨慎使用上下文，并考虑属性传递（props\
  \ drilling）或状态提升是否更适合你的特定用例。\n\n* **优化 API 请求：** 在从 API 获取数据时，实施缓存、防抖或分页等技术以减少不必要的请求并提高性能。考虑使用\
  \ SWR 或 React Query 等专为 React 应用设计的数据获取和缓存功能库。\n\n* **性能监控：** 使用 Lighthouse、Chrome\
  \ DevTools 或性能分析库等工具监控应用的性能。识别并解决与状态管理相关的瓶颈或性能问题。\n\n* **测试与重构：** 为你的状态管理代码编写全面的单元测试，以确保正确性和可维护性。定期审查并重构你的状态管理代码，以保持其整洁、有序和优化。\n\
  \n\n\n\n通过遵循这些最佳实践，你可以有效地管理 Next.js 应用中的状态，同时优化性能并避免常见的陷阱。请记住，应用程序的具体需求可能有所不同，因此在实施状态管理解决方案时，务必考虑你项目的上下文和需求。\n\
  \n## 在 Next.js 应用中使用 Redux 实现状态管理\n\n`Redux` 是一个常用于 React 和 Next.js 等 JavaScript\
  \ 框架的状态管理库。它通过执行一套严格的原则和模式，提供了一种可预测的方式来管理应用程序的状态。`Redux`遵循单向数据流，使得理解和调试状态变化变得更加容易。\n\
  \n`Redux` 的三个原则是：\n\n- 单一数据源：`Redux` 提倡为应用程序状态维护单一数据源的思想。整个状态存储在一个名为 Redux store\
  \ 的中心化对象中。这允许应用程序中的所有组件以一致且可预测的方式访问和更新状态。\n- 状态是只读且不可变的：在 `Redux` 中，状态被视为只读的，这意味着你不能直接修改它。相反，你通过派发动作（actions）来描述状态变化。这些动作是纯\
  \ JavaScript 对象，包含了关于应用程序中发生了什么的信息。Reducers 是 `Redux` 中的纯函数，接收当前状态和派发的动作作为输入，并返回一个新的状态对象，而不修改原始状态。这种不可变性确保了状态的可预测性，有助于高效的变更检测，并启用了如时间旅行调试等功能。\n\
  - 变化通过纯函数进行：`Redux` 依赖于称为 reducers 的纯函数来更新状态。Reducers 接收当前状态和动作并返回一个新状态。它们没有副作用，也不会直接与外部资源交互。通过遵循纯函数，`Redux`\
  \ 使状态变化变得可预测且可于测试。它还实现了代码的模块化和重用，因为 reducers 可以组合起来处理状态的不同部分。\n\n## Flux\n\n`Flux`\
  \ 是 Facebook 引入的一种架构模式，补充了 React 基于组件的架构。`Flux` 解决了大型应用中状态状态的挑战。它强制执行单向数据流并促进了清晰的关注点分离。\n\
  \n`Flux` 由几个关键组件组成：\n\n- 动作（Actions）：描述事件或用户意图，并包含与事件相关的数据。它们由用户交互或系统事件触发。\n- 派发器（Dispatcher）：`Dispatcher`\
  \ 负责接收动作并将它们派发到注册的 stores。它作为 `Flux` 架构中的中心枢纽。\n- 存储器（Stores）：持有应用程序状态和业务逻辑。它们接收来自\
  \ `Dispatcher` 的动作并相应地更新状态。Stores 负责决定状态如何响应动作而发生变化。\n- 视图（Views）：代表应用程序的用户界面组件。它们从\
  \ Stores 中检索数据，并根据状态渲染用户界面。\n- `Flux` 强制执行单向数据流，动作通过 `Dispatcher` 流向 Stores，然后由\
  \ Stores 更新状态。Views 监听状态的变化并在需要时重新渲染。\n\n### 结合 Redux 和 Flux\n\n`Redux` 和 `Flux`\
  \ 共享相似的概念和原则，使得它们在状态管理中是可以结合的。`Redux` 可以被看作 `Flux` 架构的一种实现，其中 `Redux` 的 store 替代了\
  \ `Flux` stores 的角色，而 `Redux` 的 reducers 替代了 `Flux` stores 的逻辑。\n\n在 `Redux` 和 `Flux`\
  \ 的结合方法中，你可以使用 `Redux` 作为底层的状态管理库，并遵循 `Redux` 的单一数据源、不可变性和纯 reducers 的原则。`Flux`\
  \ 提供的单向数据流和关注点分离可以与 `Redux` 集成，以增强应用程序状态管理的组织性和可扩展性。\n\n以下是关于如何结合 `Redux` 和 `Flux`\
  \ 的逐步说明：\n\n- 使用 `Redux` 作为状态管理库：在你的 Next.js 应用中设置 `Redux`，创建一个 Redux store，定义处理状态更新的\
  \ reducers，并使用 React Redux 的 `connect` 函数将组件连接到 Redux store。\n- 采用 `Flux` 的单向数据流：虽然\
  \ `Redux` 已经遵循了单向数据流，但你可以通过采用 `Flux` 的模式进一步增强它。动作从你的组件派发到 Redux store，store 使用 reducers\
  \ 更新状态。更新后的状态随后传播到组件，触发重新渲染。\n- 利用 `Flux` 的关注点分离：通过根据应用程序中的特定领域或功能组织你的 Redux reducers，来利用\
  \ `Flux` 的关注点分离。每个 reducer 可以处理状态的特定部分，类似于 `Flux` 的 stores 管理应用程序数据的不同部分。\n- 结合动作和\
  \ reducers：在 `Redux` 中创建动作来描述状态变化，就像你在 `Flux` 中做的那样。将这些动作派发到 Redux store，store 继之调用对应的\
  \ reducers。reducers 处理动作并遵循不可变性和纯函数的原则相应地更新状态。\n\n通过结合 `Redux` 和 `Flux`，你可以受益于 `Redux`\
  \ 强大的状态管理能力，同时利用 `Flux` 清晰的数据流和关注点分离。这种组合帮助你为应用程序状态维护单一数据源，确保状态更新的不可变性和可预测性，并以模块化和可扩展的方式组织你的状态管理逻辑。\n\
  \n请记住，虽然 `Redux` 和 `Flux` 可以结合，但考虑你应用程序的复杂性和需求是非常关重要的。如果你的应用程序较小，或者不需要广泛的状态管理，仅使用\
  \ `Redux` 可能就足够了。然而，对于更大更复杂的应用程序，将 `Redux` 与 `Flux` 结合可以为管理状态提供有效的解决方案。\n\n\n\n\n\
  \n首先使用你喜欢的方法设置基础的 Next.js 项目。你可以使用 Next.js CLI 或手动创建一个新项目。确保你已经安装了必要的依赖。\n\n###\
  \ 步骤 2：安装 Redux 及相关包\n\n在项目目录中，安装 Redux 和 Flux 集成所需的包。运行以下命令：\n\n```bash\nnpm install\
  \ redux react-redux redux-thunk\n```\n\n### 步骤 3：创建 Redux store\n\n在你的项目中，创建一个名为\
  \ `store.js` 的新文件。该文件将包含 Redux store 的配置。添加以下代码：\n\n```javascript\nimport { createStore,\
  \ applyMiddleware } from 'redux'; import thunk from 'redux-thunk';\n\n// 在此处导入你的\
  \ reducers\n\nimport rootReducer from './reducers';\n\nconst store = createStore(rootReducer,\
  \ applyMiddleware(thunk)); export default store;\n```\n\n确保你已经在 `reducers` 目录下的单独文件中定义了你的\
  \ reducers。\n\n### 步骤 4：定义你的 reducers\n\n在 `reducers` 目录中为每个 reducer 创建单独的文件。每个\
  \ reducer 文件都应该导出一个函数，该函数接收当前状态和 action 作为参数，并返回一个新的状态。例如：\n\n```javascript\n//\
  \ counterReducer.js 中的示例 reducer const initialState = {\n  count: 0,\n};\n\nconst\
  \ counterReducer = (state = initialState, action) => {\n  switch (action.type) {\n\
  \    case 'INCREMENT':\n      return { ...state, count: state.count + 1 };\n   \
  \ case 'DECREMENT':\n      return { ...state, count: state.count - 1 };\n    default:\n\
  \      return state;\n  }\n};\n\nexport default counterReducer;\n```\n\n### 步骤 5：创建你的\
  \ actions\n\n在 `actions` 目录中为每个 action 创建单独的文件。每个文件都应该导出返回 action 对象的 action creator\
  \ 函数（action 创建器函数）。例如：\n\n```javascript\n// counterActions.js 中的示例 actions export\n\
  const increment = () => ({\n  type: 'INCREMENT',\n});\n\nexport const decrement\
  \ = () => ({ type: 'DECREMENT', });\n```\n\n### 步骤 6：合并 reducers\n\n在你的 `reducers`\
  \ 目录中，创建一个 `index.js` 文件将所有的 reducers 合并为一个根 root reducer。例如：\n\n```javascript\n\
  // reducers/index.js\nimport { combineReducers } from 'redux'; import counterReducer\
  \ from './counterReducer';\n\nconst rootReducer = combineReducers({ counter: counterReducer,\
  \ });\n\nexport default rootReducer;\n```\n\n### 步骤 7：创建你的组件\n\n创建使用 Redux store\
  \ 并调度 actions 的 React 组件。例如：\n\n```javascript\n// Counter.js 中的示例组件 import React\
  \ from 'react';\nimport { connect } from 'react-redux';\nimport { increment, decrement\
  \ } from './actions/counterActions';\n\nconst Counter = ({ count, increment, decrement\
  \ }) => {\n  return (\n    <div>\n      <h1>Count: {count}</h1>\n      <button onClick={increment}>Increment</button>\n\
  \      <button onClick={decrement}>Decrement</button>\n    </div>\n  );\n};\n\n\
  const mapStateToProps = (state) => ({ count: state.counter.count, });\n\nconst mapDispatchToProps\
  \ = { increment,\n  decrement,\n};\n\nexport default connect(mapStateToProps, mapDispatchToProps)(Counter);\n\
  ```\n\n### 步骤 8：设置你的 Next.js 页面\n\n在你想要渲染连接 Redux 组件的地方创建一个 Next.js 页面。导入这些组件并在页面中使用它们。例如：\n\
  \n```javascript\n// pages/index.js\nimport React from 'react';\nimport Counter from\
  \ '../components/Counter'; const HomePage = () => {\n  return (\n    <div>\n   \
  \   <h1>Redux with Flux Example</h1>\n      <Counter />\n    </div>\n  );\n};\n\n\
  export default HomePage;\n```\n\n### 步骤 9：用 Redux provider 包裹你的 Next.js 应用\n\n在\
  \ `pages/_app.js` 文件中，使用 `Provider` 组件包裹你的 Next.js 应用，并提供在步骤 3 中创建的 Redux store。例如：\n\
  \n```javascript\n// pages/_app.js\nimport { Provider } from 'react-redux'; import\
  \ store from '../store';\nfunction MyApp({ Component, pageProps }) {\n  return (\n\
  \    <Provider store={store}>\n      <Component {...pageProps} />\n    </Provider>\n\
  \  );\n}\nexport default MyApp;\n```\n\n### 步骤 10：运行你的 Next.js 应用\n\n启动你的 Next.js\
  \ 开发服务器并导航到你使用过 Redux 连接组件的页面。你现在应该看到计数器组件，并带有用于增加和减少计数的按钮。\n\n大功告成！你已经在简单的 Next.js\
  \ 应用中使用 Redux 和 Flux 实现了状态管理。Redux 提供了单一事实来源和状态管理能力，而 Flux 关于 actions、dispatcher\
  \ 和 stores 的原则则已集成到 Redux 架构中。\n\n你可以根据需要按照相同的模式添加更多 actions、reducers 和组件。这种方法允许你有效地管理\
  \ Next.js 应用的状态，并轻松处理复杂的状态交互。\n\n# Redux Thunk\n\nRedux Thunk 是 Redux 的中间件，Redux\
  \ 是 JavaScript 中流行的状态管理库。它允许你编写返回函数而非普通 action 对象的 action creators。这使得你能够执行异步操作，例如\
  \ API 调用。\n\n### 为什么需要 Redux Thunk？\n\n在 Redux 中，actions 通常是带有 type 和 payload 的对象。但在某些情况下，你可能需要在调度\
  \ actions 之前执行异步操作，例如从 API 获取数据。\n\n### 带有代码实现 Redux Thunk\n\n要使用 Redux Thunk，你需要对其进行设置。\n\
  \n### 1. 设置 Thunk 中间件\n\n导入 `thunk` 中间件并将其应用于 store。\n\n```javascript\nimport {\
  \ createStore, applyMiddleware } from 'redux';\nimport thunk from 'redux-thunk';\n\
  import rootReducer from './reducers';\n\nconst store = createStore(rootReducer,\
  \ applyMiddleware(thunk));\nexport default store;\n```\n在这里，我们导入 `thunk` 中间件并将其应用于\
  \ store。`rootReducer` 代表合并后的 reducers。\n\n### 2. 创建 thunk action creators\n\nThunk\
  \ action creators 是可以调度 actions 的函数。例如：\n\n```javascript\n// actions.js\nimport\
  \ axios from 'axios'; export const fetchData = () => {\n  return async (dispatch)\
  \ => {\n    dispatch({ type: 'FETCH_DATA_REQUEST' });\n    try {\n      const response\
  \ = await axios.get('https://api.example.com/data');\n      dispatch({ type: 'FETCH_DATA_SUCCESS',\
  \ payload: response.data });\n    } catch (error) {\n      dispatch({ type: 'FETCH_DATA_FAILURE',\
  \ payload: error.message });\n    }\n  };\n};\n```\n在此示例中，`fetchData` 是一个从 API 获取数据的\
  \ thunk action creator。它返回一个接收 `dispatch` 函数作为参数的函数。在这个函数内部，你可以调度多个 actions 来表示异步操作的不同阶段。\n\
  \n### 3. 调度 thunk action creators\n\n要调度 thunk action creator，你需要使用 Redux 提供的 `dispatch`\
  \ 函数。这里有一个如何调度 `fetchData` thunk action creator 的示例：\n\n```javascript\n// component.js\n\
  import React, { useEffect } from 'react';\nimport { useDispatch, useSelector } from\
  \ 'react-redux';\nimport { fetchData } from './actions';\n\nconst Component = ()\
  \ => {\n  const dispatch = useDispatch();\n  const data = useSelector((state) =>\
  \ state.data);\n\n  useEffect(() => {\n    dispatch(fetchData());\n  }, [dispatch]);\n\
  \n  // 使用获取的数据渲染组件\n  // ...\n  return <div>{data}</div>;\n};\n\nexport default\
  \ Component;\n```\n在此示例中，我们使用来自 react-redux 库的 `useDispatch` 钩来获取 `dispatch` 函数。然后我们在\
  \ `useEffect` 钩子中调度 `fetchData` thunk action creator，以便在组件挂载时触发 API 调用。\n\n\n\n\n\
  以上是对 Redux Thunk 及其实现方式的基本概述。它允许你在 Redux actions 中处理异步操作并相应地管理状态。\n\n**注意：** *第\
  \ 12 章，使用 Next.js 开发 CRUD 应用程序,* 涵盖了我们在应用程序中对 Redux 和 Flux 的完整实现，提供了一个强大的状态管理解决方案。按照这些步骤学习如何设置\
  \ Redux store、定义 actions 和 reducers，以及连接组件以实现高效的数据流。\n\n## 在简单的 Next.js 中使用 React\
  \ context 实现状态管理\n\nReact context 是 React 中的一项功能，允许你在组件之间共享数据，而无需在组件树的每一层都显式地传递\
  \ props。它提供了一种创建全局状态的方法，树中的任何组件都可以访问该状态。\n\n### 问题可视化：\n\n- 假设你有两个组件 A 和 B，它们都在主\
  \ APP 组件内部。\n- 组件 B 需要来自组件 A 的状态值。\n- 由于组件结构的原因，直接传递此值非常棘手。\n\n![](img/Figure-7.2.jpg)\n\
  \n**图 7.2：** 问题陈述概述\n\n### 解决方案 1：状态提升（Uplifting State）：\n\n- 将所需的状态从组件 A 移动到父组件\
  \ APP。\n- 这解决了当前问题，但对于较大的应用程序来说并不实用用。\n\n![](img/Figure-7.3.jpg)\n\n**图 7.3：** 状态提升\n\
  \n### 解决方案 2：Context API：\n\n- Context API 提供了一种跨组件共享全局变量的方法。\n- 它是手动传递 prop（prop\
  \ drilling）的替代方案。\n- 当数据需要被嵌套层级的许多组件访问时效果最佳。\n\n![](img/Figure-7.4.jpg)\n\n**图 7.4：**\
  \ 引入 Context API 的解决方案\n\n### 创建 Context API：\n\n- 设置包含父 APP、组件 A 和组件 B 的目录结构。\n\
  - 创建名为 `Context.js` 的文件，并编写 `createContext` 创建 context 代码。\n\n### 创建 Provider：\n\
  \n- 从创建的 context 中提取 `Provider`。\n- 创建一个 `AppProvider` 组件，为消费它的组件提供值。\n- 在 `AppProvider`\
  \ 内部，使用 `useState` 为你想共享的数据设置状态。\n- 用 `AppProvider` 包裹你的父组件（APP）。\n\n### 消费 Context：\n\
  \n- 在想要消费 context 的组件中导入 `AppContext` 和 `useContext`。\n- 使用 `useContext` hook 访问\
  \ context 值。\n\n### Context 使用技巧：\n\n- 不要用 context 替换本地状态；尽可能任何时候使用本地状态。\n- 更改 context\
  \ 值会导致使用该 context 的组件重新渲染。\n- 避免用 context provider 包裹整个应用；在最小的必要父组件中使用它。\n\n###\
  \ 总结：\n\n- 使用 `createContext` 创建 Context。\n- 从 context 中提取 `Provider`。\n- 用 Provider\
  \ 包裹父组件。\n- 使用 `useContext` hook 消费 context。\n\nContext API 简化了组件之间的数据共享，避免了 prop\
  \ drilling。然而，明智地使用它并避免过度使用非常重要。它作为一种跨不同组件更新和访问该状态的机制。\n\n此流程代表了 React context 中的基本数据流。它概述了创建\
  \ context、设置 provider、定义 actions、消费 context、访问和更新状态以及重新渲染组件所涉及的步骤。\n\n要在简单的 Next.js\
  \ 应用程序中使用 React context 实现状态管理，你可以遵循以下步骤：\n\n### 第 1 步：设置 Next.js 项目\n\n首先使用你喜欢的方法设置基础的\
  \ Next.js 项目。你可以使用 Next.js CLI 或手动创建新项目。确保已安装必要的依赖项。\n\n### 第 2 步：创建一个新的 context\
  \ 文件\n\n在项目中创建一个名为 `AppContext.js` 的新文件。该文件将包含你的 React context 的设置。添加以下代码：\n\n```javascript\n\
  // AppContext.js\nimport React, { createContext, useState } from ‘react';\n\n//\
  \ 创建 context\nexport const AppContext = createContext();\n\n// 创建一个 provider 组件\n\
  export const AppProvider = ({ children }) => {\n  const [state, setState] = useState({\n\
  \    // 在此处定义你的初始状态\n    count: 0,\n  });\n  // 定义任何更新状态的 actions\n  const increment\
  \ = () => {\n    setState((prevState) => ({\n      …prevState,\n      count: prevState.count\
  \ + 1,\n    }));\n  };\n  const decrement = () => {\n    setState((prevState) =>\
  \ ({\n      …prevState,\n      count: prevState.count - 1,\n    }));\n  };\n  //\
  \ 向子组件提供状态和 actions\n  return (\n    <AppContext.Provider value={{ state, increment,\
  \ decrement }}>\n      {children}\n    </AppContext.Provider>\n  );\n};\n```\n\n\
  ### 第 3 步：用 AppProvider 包裹你的 Next.js 应用\n\n在 `pages` 目录下的 `_app.js` 文件中，用来自 `AppContext.js`\
  \ 文件的 `AppProvider` 组件包裹你的 Next.js 应用。例如：\n\n```javascript\n// pages/_app.js\nimport\
  \ { AppProvider } from '../AppContext';\n\nfunction MyApp({ Component, pageProps\
  \ }) {\n  return (\n    <AppProvider>\n      <Component {...pageProps} />\n    </AppProvider>\n\
  \  );\n}\n\nexport default MyApp;\n```\n\n### 第 4 步：创建你的组件\n\n创建将使用 context 管理状态的组件。导入\
  \ `AppContext` 并使用 `useContext` 访问状态。例如：\n\n```javascript\n// components/Counter.js\n\
  import React, { useContext } from 'react';\nimport { AppContext } from '../AppContext';\n\
  \nconst Counter = () => {\n  const { state, increment, decrement } = useContext(AppContext);\n\
  \  return (\n    <div>\n      <h1>Count: {state.count}</h1>\n      <button onClick={increment}>Increment</button>\n\
  \      <button onClick={decrement}>Decrement</button>\n    </div>\n  );\n};\n\n\
  export default Counter;\n```\n\n### 第 5 步：设置你的 Next.js 页面\n\n创建一个你想要渲染 context 链接组件的\
  \ Next.js 页面。导入组件并在你的页面中使用它们。例如：\n\n```javascript\n// pages/index.js\nimport React\
  \ from 'react';\nimport Counter from '../components/Counter';\n\nconst HomePage\
  \ = () => {\n  return (\n    <div>\n      <h1>React Context 示例</h1>\n      <Counter\
  \ />\n    </div>\n  );\n};\n\nexport default HomePage;\n```\n\n### 第 6 步：在组件外部访问\
  \ context（可选）\n\n如果你需要在组件外部访问 context（例如在实用函数或自定义 hook 中），你也可以使用 `useContext` hook。请注意，`useContext`\
  \ 只能在函数组件中使用。\n\n### 第 7 步：运行你的 Next.js 应用\n\n启动你的 Next.js 开发服务器并导航到你使用 context\
  \ 链接组件的页面。你现在应该能看到带有增加和减少计数按钮的计数器组件。\n\n就这样！你成功地在简单的 Next.js 应用程序中使用 React context\
  \ 实现了状态管理。React context 允许组件之间共享状态和 actions，而无需 prop drilling。它简化了应用程序中管理和更新共享状态的过程。\n\
  \n\n\n\n请记住，随着应用程序的增长，你可能需要更高级的功能，如中间件、异步操作或复杂的状态管理。在这种情况下，你可以考虑使用 `Redux` 或其他状态管理库。\n\
  \n然而，对于状态需求较简单的小型应用程序，`react context` 可以作为一个轻量级且有效的解决方案。\n\n**注意：** 请查看 GitHub 仓库中第\
  \ 7 章 *Building-Scalable-Web-Applications-with-Next.js-and-React* 的示例代码，以探索与章节内容相关的实际示例和实现。\n\
  \n# 案例研究与示例 (#toc.xhtml_s126a)\n\n在本节中，我们将看到如何在 Next.js 应用程序真实场景中实现状态管理。让我们探讨五个案例研究，以及处理复杂状态的最佳实践：\n\
  \n### 电子商务购物车：\n\n- **场景：** 假设你正在构建一个带有购物车功能的电子商务网站。\n- **实现方式：** 为了管理购物车状态，你可以使用\
  \ `Redux` 或 `React context`。在全局状态中存储购物车物品、数量和总价。实现动作（actions）和还原器（reducers）来处理购物车中物品的添加、删除或更新。将相关组件连接到状态管理解决方案以显示和更新购物车。\n\
  - **最佳实践：**\n    - 规范化购物车状态结构，以便高效处理大量物品。\n    - 使用选择器（selectors）或内存（memoization）技术优化渲染，防止购物车相关组件进行不重新渲染。\n\
  \    - 实现持久化以保存购物车状态，户户在关闭浏览器后也能返回购物车。\n\n### 社交媒体动态：\n\n- **场景：** 假设你正在构建一个包含不同用户帖子流的社交媒体应用程序。\n\
  - **实现方式：** 为了管理流状态，你可以利用 `React state` 或 `React context`。在组件状态或上下文中存储帖子及其元数据。实现函数来处理诸如添加新帖子、删除帖子或更新帖子点赞和评论等操作。根据状态数据渲染流组件。\n\
  - **最佳实践：**\n    - 考虑分页或无限滚动技术，以高效处理流中的大量数据。\n    - 使用异步操作或 API 调用来获取和更新帖子，确保无缝的用户体验。\n\
  \    - 实现缓存机制以提高性能，避免对同一帖子进行冗余的 API 调用。\n\n### 为天气应用实现 Redux：\n\n- **场景：** 开发一个显示不同位置天气信息的应用程序。\n\
  - **实现方式：** 使用 `Redux` 管理天气数据状态。将天气信息（如温度、状况和位置）存储在 `Redux store` 中。实现动作和还原器来获取和更新天气数据。使用\
  \ `react-redux` 库将相关组件连接到 store。\n- **最佳实践：**\n    - 使用规范化数据构建 `Redux store`，以高效管理和更新天气信息。\n\
  \    - 利用 `Redux Thunk` 或 `Redux Saga` 等中间件来处理异步操作，例如从 API 获取天气数据。\n    - 利用选择器从\
  \ store 中计算派生数据，减少不必要的计算并优化性能。\n\n### 为用户认证实现 React context：\n\n- **场景：** 构建一个具有用户身份验证功能的应用程序。\n\
  - **实现方式：** 使用 `React context` 管理用户身份验证状态。在文中存储用户信息（如用户名和身份验证令牌）。实现上下文提供者（providers）和消费者（consumers）来处理用户登录、注销和身份检查。使用\
  \ `useContext` 钩子在整个应用程序中使用身份验证状态。\n- **最佳实践：**\n    - 谨慎使用上下文，仅用于真正必要的全局共享状态。\n\
  \    - 在单独的模块或自定义钩子中实现身份验证逻辑，以提高重用性和可维护性。\n    - 考虑使用 `react-router` 等第三方库根据身份验证状态处理受保护路由。\n\
  \n### 为待办列表实现 React state：\n\n- **场景：** 构建一个简单的待办事项应用程序。\n- **实现方式：** 使用 `React\
  \ state` 管理任务列表。将任务以数组形式存储在组件状态中。实现添加新任务、标记任务为完成和删除任务的函数。使用 `useState` 钩子管理状态并根据用户更新列表。\n\
  - **最佳实践：**\n    - 将状态拆分为更小、可管理的部分，以避免不必要的重新渲染。\n    - 在更新状态时使用不可变性，以确保行为的可预测性并防止错误。\n\
  \    - 考虑使用 `useEffect` 钩子将待办列表持久化到本地存储中，户在关闭浏览器后也能访问其列表。\n\n在这些案例研究中，使用 `Redux`\
  \ 或 `React context` 实现状态管理为 Next.js 应用程序中处理复杂状态提供了集中且高效的解决方案。通过遵循最佳实践（如规范化状态结构、使用选择器或内存优化渲染，以及实现持久化或缓存），你可以确保流畅的性能和对复杂状态的有效管理。\n\
  \n请记住根据你的特定应用程序需求调整这些方法，并在实现状态管理解决方案时考虑你的项目需求。\n\n# 结论 (#toc.xhtml_s127a)\n\n本章广泛探讨了\
  \ Next.js 应用程序中状态管理的各个方面，并强调了其重要性。章节从介绍 Next.js 中的状态管理开始，强调了其在开发健壮 Web 应用程序中至关重要的作用。\n\
  \n并对 Next.js 中的各种状态管理选项进行了全面回顾，包括 `React state`、`Redux` 和 `React context`。讨论了每个选项的优缺点，有助于根据特定需求做出明智决策。\n\
  \n整个章节都强调了有效状态管理的最佳实践，涵盖了避免常见陷阱和性能优化。这些指南使开发者能够简化 Next.js 应用程序中的状态管理流程。\n\n探索了使用\
  \ `React state` 实现状态管理的技巧，包括利用 `useState` 和 `useContext` 等钩子。这些知识使开发者能够有效地管理组件内部的状态。\n\
  \n还涵盖了使用 `Redux` 实现状态管理的技巧，包括 store 的设置、动作和还原器的定义以及与组件的集成。这一全面的讲解让开发者掌握了在 Next.js\
  \ 应用程序中使用 Redux 进行高级状态管理的技能。\n\n此外，本章介绍了使用 `React context` 进行状态管理，涵盖了创建创建、提供者消费者的定义以及在组件中的用法。这种理解使开发者能够有效利用\
  \ `React context`。\n\n研究了真实的案例研究和示例，以加强理解并展示 Next.js 应用程序中状态管理的实际实现。这些场景展示了处理复杂状态的最佳实践，为开发者提供了宝贵的见解。\n\
  \n下一章将重点介绍 Next.js 应用程序中的 REST 和 GraphQL API。它将解释这些概念并展示如何使用它们构建健壮且灵活的 Web 应用程序。\n\
  \n# 多选题 (#toc.xhtml_s128a)\n\n1. Next.js 应用程序中状态管理的目的是什么？\n    1. 处理用户身份验证\n   \
  \ 2. 管理应用程序路由\n\n\n\n\n3. 在跨组件间高效地管理和共享数据\n4. 提高代码组织结构和可维护性\n\n2. 哪种状态管理选项是 React\
  \ 内置并提供的？\n1. Redux\n2. React state\n3. React context\n4. MobX\n\n3. 哪种状态管理选项基于\
  \ Flux 架构模式的？\n1. Redux\n2. React state\n3. React context\n4. MobX\n\n4. 使用 React\
  \ context 进行状态管理的主要优势是什么？\n1. 具有预测数据流的中心化状态管理\n2. 内置支持时间旅行调试\n3. 简单易用\n4. 高性能和高效更新\n\
  \n5. 在 Next.js 中，通常什么时候推荐将 Redux 作为状态管理选项？\n1. 适用于小型和简单的应用程序\n2. 处理复杂状态和数据流时\n3.\
  \ 当需要服务端渲染时\n4. 当需要实时数据更新时\n\n## 答案\n\n1. C\n2. B 和 C\n3. A\n4. C\n5. B\n\n注意：这些问题旨在测试关于\
  \ Next.js 状态管理的通用知识。请参考你学习材料中所涵盖的特定内容和概念以获得准确答案。\n\n# 第 8 章\n\n# Restful 和 GraphQL\
  \ API 实现\n\n## 引言\n\n在 Web 开发领域，API（应用程序编程接口）对于构建健壮的应用程序至关重要。它们实现了软件系统之间无缝通信和数据交换。本章将探索\
  \ API 在现代 Web 开发中的意义。\n\n在本章中，我们将介绍 API 并强调它们作为应用程序之间桥梁的重要性，提供访问外部功能的途径。我们将讨论 RESTful\
  \ 和 GraphQL API 之间的差异以及它们对于设计的处。实践涵盖了如何在 Next.js 中设置 RESTful API 以及为 CRUD 操作创建端点。我们还将探索如何使用\
  \ Apollo Server 在 Next.js 中设置 GraphQL API，构建用于精确数据检索的强大 API 端点。\n\n与 Next.js 应用程序的集成将侧重于服务端渲染，通过更快的页面加载提升用户体验。此外还讨论了\
  \ API 安全和身份验证的错误处理最佳实践。\n\n在整个章节中，实际示例和提示将增强读者的理解。到结束时，你将对 Next.js 开发中的 API 有一个全面的理解。让我们开启\
  \ Web 开发中 API 的威力吧！\n\n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n* API 简介及其在现代 Web 开发中的重要性\n*\
  \ 理解 RESTful 和 GraphQL API 之间的差异\n    * 在 Next.js 中设置和配置 RESTful API\n    * 使用 Apollo\
  \ Server 等流行框架在 Next.js 中设置和配置 GraphQL API\n    * 构建用于 CRUD（创建、读取、更新、删除）的 RESTful\
  \ 和 GraphQL API 端点\n* 将 API 端点与 Next.js 集成\n* 处理 API 调用中的错误和异常\n* Next.js 应用程序中\
  \ API 安全和身份验证的最佳实践\n\n## API 简介及其在现代 Web 开发中的重要性\n\nAPI 可以被视为一组定义了软件组件应如何交互的规则和协议。它指定了开发者可以用于在应用程序之间请求和交换信息的方法、数据格式和端点。\n\
  \n### API 类型：\n\n* Web APIs：这些 API 旨在允许基于网络的系统进行通信。它们使用 `HTTP`（超文本传输协议）作为底层协议，通常以\
  \ `JSON`（JavaScript 对象表示法）或 `XML`（可扩展标记语言）格式提供数据。\n\n* 服务 APIs：这些 API 由各种软件服务暴露，允许开发者访问这些服务的特定功能。例如，支付网关服务可能提供一个开发者可以在其应用程序中处理支付的\
  \ API。\n\n### API 在现代 Web 开发中的重要性：\n\n* 集成：API 允许不同的应用程序无缝集成并共享数据、功能和服务。这种集成允许开发者利用现有的平台和服务，来快速增强他们的应用程序。\n\
  * 效率：API 促进了代码重用和模块化。开发者不需要从零开始一切，而是可以使用 API 访问预构建的功能，从而节省时间和精力的。\n* 可扩展性：API 促进了应用程序的可扩展性。开发者可以利用外部服务或平台来处理存储、身份验证或支付处理等任务，释放资源专注于应用程序的核心功能。\n\
  * 协作：API 促进了开发者和团队之间的协作。通过 API 暴露特定功能，开发者可以同时处理不同的组件，确保更快的开发周期。\n\nAPI 是如何工作的？\n\
  \n当开发者想要与 API 交互时，他们使用适当的 `HTTP` 方法（`GET`、`POST`、`PUT`、`DELETE` 等）向特定端点（`URL`）发送请求。API\
  \ 处理请求，执行必要的操作，并返回带有请求数据或指示操作成功失败状态的响应。\n\n## API 协议与架构\n\nAPI 协议和架构是指规范 API 设计、通信和交互模式的标准和框架。以下是一些常用的\
  \ API 协议和架构：\n\n* REST（表述状态转移）：REST 是一种广泛采用的用于网络应用的架构风格。RESTful API 使用 `HTTP` 方法（`GET`、`POST`、`PUT`、`DELETE`\
  \ 等）与由 `URLs`（统一资源定位符）标识的资源进行交互。REST API 强调无状态通信、可扩展性和关注点分离。它们被广泛用于 Web 开发，并遵循资源导向设计、无状态和统一接口等原则。\n\
  \n* SOAP（简单对象访问协议）：SOAP 是一种用于使用 `XML` 在 Web 服务中交换结构化信息的协议。SOAP API 使用 `WSDL`（Web\
  \ 服务描述语言）描述的 `XML` 契来定义消息格式、操作和合同。SOAP 以其丰富的功能、对复杂数据类型的支持、安全性和事务能力而闻名。它通常用于企业级集成和面向服务的架构。\n\
  \n* gRPC（Google 远程过程调用）：gRPC 是一个由 Google 开发的高性能、语言无关的框架。它使用 `Protocol Buffers`（`protobuf`）来定义服务和消息。gRPC\
  \ API 通过远程过程调用（`RPC`）实现服务之间高效且跨平台的通信。gRPC 以其速度、对双向流的支持、流量控制和身份验证而闻名。它通常用于微服务架构和分布式系统。\n\
  \n* GraphQL：GraphQL 是一种用于 API 的开源查询语言和运行时。它允许客户端通过构建灵活且精确的查询来请求特定数据。与由服务器决定响应形状的\
  \ REST 不同，GraphQL 将控制权交给了客户端。GraphQL API 提供单一端点，并只返回客户端请求的数据，减少了数据的过度获取和获取不足。GraphQL\
  \ 常用于对灵活性、高效数据检索和客户端驱动数据需求的场景。\n\n\n\n\n\n这些是一些广泛使用的 API 协议和架构。每种协议都有其自身的优势和适用场景，选择取决于应用程序性质、性能需求、与现有系统的兼容性以及开发者的偏好等因素。\n\
  \n在本章中，你将全面理解这两种流行的 API 类型：REST 和 GraphQL API。我们将讨论它们的特点、使用场景，以及如何实现和消费每种 API。这些知识将使你能够根据项目需求，在\
  \ REST 和 GraphQL 之间做出明智的决策，并优化你的 API 设计和集成策略。\n\n## RESTful 对比 GraphQL API\n\n下表解释了\
  \ RESTful API 和 GraphQL API 之间的区别：\n\n|    | RESTful APIs | GraphQL APIs |\n| :---\
  \ | :--- | :--- |\n| 数据获取 | 使用多个端点获取多个资源 | 从单个端点获取数据，允许客户端精确指定它们所需的数据 |\n| 过度获取\
  \ (Over-fetching) | 常见现象，客户端收到的数据比需要的多 | 通过允许客户端仅请求所需的字段，消除了过度获取 |\n| 获取不足 (Under-fetching)\
  \ | 需要多次请求来检索相关数据 | 通过允许客户端在单个查询中请求嵌套数据，解决了获取不足的问题 |\n| 版本控制 | 通常需要版本控制来引入破坏性更改\
  \ | 不需要版本控制，因为响应的结构可以由客户端控制 |\n| 端点结构 | 基于资源，不同资源有不同的端点 | 处理所有数据查询、变异和订阅的单一端点 |\n\
  | 请求灵活性 | 灵活性有限，因为服务器决定响应格式 | 高度灵活，因为客户端在查询中指定数据需求 |\n| 缓存 | 支持端点级别的缓存 | 由于动态查询和不可预测的数据需求，缓存可能具有挑战性\
  \ |\n| 复杂性管理 | 在处理嵌套或相关资源时可能会变得复杂 | 为查询相关数据提供了简单性，并通过精确选择数据避免了复杂 |\n| 客户端服务器约定 |\
  \ 服务器决定响应的结构和格式 | 客户端通过指定所需的字段来决定响应的结构和格式 |\n| 学习曲线 | 容易理解和实现 | 需要额外学习和理解 GraphQL\
  \ 查询语言和解析函数 (resolver) |\n| 生态成熟度 | 完善，拥有成熟的生态系统和工具 | 生态系统不断增长，工具不断演进，但不如 RESTful\
  \ API 成熟 |\n\n**表 8.1：** RESTful API 和 GraphQL API 之间的区别\n\n## 在 Next.js 中设置和配置\
  \ RESTful API\n\n要在 Next.js 中使用不同的 HTTP 方法（GET, POST, PUT, PATCH 和 DELETE）设置并配置\
  \ RESTful API，请按照以下步骤操作：\n\n### 步骤 1：设置新的 Next.js 项目\n\n* 为项目创建一个新目录并使用终端或命令提示符进入目录。\n\
  * 运行以下命令初始化一个新的 Next.js 项目：\n\n```bash\nnpx create-next-app\n```\n这将在当前目录下创建一个基础的\
  \ Next.js 项目。\n\n### 步骤 2：创建 API 路由\n\n* 在项目目录内创建一个名为 `pages/api` 的新目录。\n* 在 `api`\
  \ 目录下创建一个新的 JavaScript 文件，例如 `example.js`。该文件将代表你的 API 路由。\n\n### 步骤 3：为不同 HTTP\
  \ 方法定义 API 路由：\n\n1. **GET 方法：从服务器检索数据。**\n\n在 `example.js` 中，为 `GET` 方法定义 API 路由。例如：\n\
  \n```javascript\nexport default function handler(req, res) {\n  if (req.method ===\
  \ ‘GET’) {\n    // 处理 GET 请求的逻辑\n    res.status(200).json({ message: ‘GET request\
  \ received.’ });\n  } else {\n    // 处理其他 HTTP 方法\n    res.status(405).json({ message:\
  \ ‘Method Not Allowed’ });\n  }\n}\n```\n\n2. **POST 方法：向服务器发送数据以创建新资源。**\n\n为了处理\
  \ `POST` 请求，向 `example.js` 中添加以下代码：\n\n```javascript\nexport default function handler(req,\
  \ res) {\n  if (req.method === ‘POST’) {\n    // 处理 POST 请求的逻辑\n    const data =\
  \ req.body;\n    res.status(200).json({ message: ‘POST request received.’, data\
  \ });\n  } else {\n    // 处理其他 HTTP 方法\n    res.status(405).json({ message: ‘Method\
  \ Not Allowed’ });\n  }\n}\n```\n\n注意：对于 `POST` 方法，你需要解析请求体以访问数据。你可以使用 `body-parser`\
  \ 或内置的 `express.json()` 中间件来实现这一点。\n\n3. **PUT 方法：向服务器发送数据以更新现有资源。**\n\n对于 `PUT`\
  \ 方法，你可以使用以下代码：\n\n```javascript\nexport default function handler(req, res) {\n\
  \  if (req.method === ‘PUT’) {\n    // 处理 PUT 请求的逻辑\n    const { id } = req.query;\
  \ // 动态 URL\n    const data = req.body;\n    res.status(200).json({ message: `PUT\
  \ request received for ID: ${id}`, data });\n  } else {\n    // 处理其他 HTTP 方法\n \
  \   res.status(405).json({ message: ‘Method Not Allowed’ });\n  }\n}\n```\n\n在此示例中，`PUT`\
  \ 方法期望一个动态 URL `id` 来识别要更新的资源。`PUT` 和 `PATCH` 方法之间的主要区别如下：\n\n* **PUT：** `PUT` 方法用于用新表示完全替换现有资源。在发送\
  \ `PUT` 请求时，通常会在请求负载中发送整个资源。这意味着请求请求负载中未包含的任何字段都将被删除或重置为默认值。`PUT` 通常用于全量更新且是幂等的，这意味着多次发送相同的\
  \ `PUT` 请求将产生相同的结果。\n* **PATCH：** `PATCH` 方法用于部分更新现有资源。`PATCH` 请求通常不发送整个资源，而是只包含需要修改的特定字段或属性。这允许在不影响资源其他部分的情况下进行更细粒度的更新。`PATCH`\
  \ 用于部分更新，且不一定是幂等的，这意味着多次发送相同的 `PATCH` 请求可能会产生不同的结果。\n\n4. **DELETE 方法：向服务器发送请求以删除特定资源。**\n\
  \n对于 `DELETE` 方法，你可以使用以下代码：\n\n```javascript\nexport default function handler(req,\
  \ res) {\n  if (req.method === ‘DELETE’) {\n    // 处理 DELETE 请求的逻辑\n    const {\
  \ id } = req.query; // 动态 URL\n    res.status(200).json({ message: `DELETE request\
  \ received for ID: ${id}` });\n  } else {\n    // 处理其他 HTTP 方法\n    res.status(405).json({\
  \ message: ‘Method Not Allowed’ });\n  }\n}\n```\n\n在此示例中，`DELETE` 方法期望一个动态 URL\
  \ 参数 `id` 来识别要删除的资源。\n\n### 步骤 4：测试 API 路由\n\n在项目目录下运行以下命令启动 Next.js 开发服务器：\n\n\
  ```bash\nnpm run dev\n```\n\n使用 Postman 或 cURL 等工具向你的 API 路由发送请求。例如，你可以向 `http://localhost:3000/api/example`\
  \ 发送 `GET` 请求以查看 图 8.1：\n\n![](img/8.1.jpg)\n\n**图 8.1：** Postman 调用 API\n\n## 使用\
  \ Apollo Server 在 Next.js 中设置和配置 GraphQL API\n\n\n\n\n\n在 GraphQL API 中，三个基本组件包括查询（queries）、变异（mutation）和解析器（resolvers）。\n\
  \n*   **Query (查询)**：GraphQL 查询用于从服务器请求数据。它遵循 GraphQL schema 定义的特定结构，允许客户端指定想要检索的精确字段和关系。查询是并行执行的，响应结果与查询的形状匹配。\n\
  *   **Mutation (变异)**：GraphQL 变异用于修改服务器上的数据。它允许客户端对资源执行创建、更新或删除操作。与查询一样，变异定义在 GraphQL\
  \ schema 中并有其自己的结构。当进行会对服务器产生副作用的变化时，通常使用变异。\n*   **Resolver (解析器)**：解析器负责解析 GraphQL\
  \ 中的查询或变异函数。它充当 API 与底层数据源之间的桥梁。schema 中的每个字段都定义了解析器，包含了获取或操作请求数据的逻辑。执行解析器以满足客户端的请求并返回对应的数据。\n\
  \n总的来说，查询用于检索数据，变异用于修改数据，而解析器处理这些请求的执行并提供请求的数据或执行必要的操作。\n\n按照以下步骤在 Next.js 中使用 Apollo\
  \ Server 设置并配置 GraphQL API：\n\n### 步骤 1：建立新的 Next.js 项目\n\n*   为你的项目创建一个新目录，并使用终端或命令行提示进入该目录。\n\
  *   运行以下命令初始化一个新的 Next.js 项目：\n\n    ```\n    npx create-next-app\n    ```\n   \
  \ 将在当前目录下设置一个基础的 Next.js 项目。\n\n### 步骤 2：安装所需的依赖项\n\n*   在你的项目目录中，运行以下命令安装 GraphQL\
  \ 和 Apollo Server 需要的包：\n\n    ```bash\n    npm install apollo-server-micro graphql\n\
  \    ```\n\n### 步骤 3：为 GraphQL 创建 API 路由\n\n*   在你的项目目录内，创建一个名为 `pages/api` 的新目录。\n\
  *   在 `api` 目录中创建一个新的 JavaScript 文件，例如 `graphql.js`。该文件将代表你的 GraphQL API 路由。\n\n\
  ### 步骤 4：定义 GraphQL schema 和解析器\n\n在 `graphql.js` 中，使用来自 `graphql-tools` 包的 `makeExecutableSchema`\
  \ 函数定义 GraphQL schema。例如：\n\n```javascript\nimport { ApolloServer, gql } from 'apollo-server-micro';\n\
  \nconst typeDefs = gql`\n  type Book {\n    id: ID!\n    title: String!\n    author:\
  \ String!\n  }\n\n  type Query {\n    books: [Book!]!\n    book(id: ID!): Book\n\
  \  }\n\n  type Mutation {\n    addBook(title: String!, author: String!): Book!\n\
  \    updateBook(id: ID!, title: String, author: String): Book\n    deleteBook(id:\
  \ ID!): Book\n  }\n`;\n\nconst books = [\n  { id: '1', title: 'Book 1', author:\
  \ 'Author 1' },\n  { id: '2', title: 'Book 2', author: 'Author 2' },\n];\n\nconst\
  \ resolvers = {\n  Query: {\n    books: () => books,\n    book: (parent, args) =>\
  \ books.find((book) => book.id === args.id),\n  },\n  Mutation: {\n    addBook:\
  \ (parent, args) => {\n      const newBook = { id: String(books.length + 1), ...args\
  \ };\n      books.push(newBook);\n      return newBook;\n    },\n    updateBook:\
  \ (parent, args) => {\n      const index = books.findIndex((book) => book.id ===\
  \ args.id);\n      if (index >= 0) {\n        const updatedBook = { ...books[index],\
  \ ...args };\n        books[index] = updatedBook;\n        return updatedBook;\n\
  \      }\n      return null;\n    },\n    deleteBook: (parent, args) => {\n    \
  \  const index = books.findIndex((book) => book.id === args.id);\n      if (index\
  \ >= 0) {\n        const deletedBook = books[index];\n        books.splice(index,\
  \ 1);\n        return deletedBook;\n      }\n      return null;\n    },\n  },\n\
  };\n```\n\n\n\n\n`author`\n\n`}`\n}`\n\n### Mutation：添加新书籍\n```graphql\nmutation\
  \ {\n  addBook(title: “The Great Gatsby”, author: “F. Scott Fitzgerald”)\n  {\n\
  \    id\n    title\n    author\n  }\n}\n```\n\n### Mutation：更新书籍\n```graphql\nmutation\
  \ {\n  updateBook(id: “bookId”, title: “New Title”, author: “New Author”) {\n  \
  \  id\n    title\n    author\n  }\n}\n```\n将 `bookId` 替换为想要更新的书籍的实际 ID。\n\n### Mutation：删除书籍\n\
  ```graphql\nmutation {\n  deleteBook(id: “bookId”) {\n    id\n    title\n    author\n\
  \  }\n}\n```\n将 `bookId` 替换为想要删除书籍的实际 ID。\n\n你可以在 GraphQL Playground 界面中使用上述查询和变异与你的\
  \ GraphQL API 交互，并执行添加、更新和删除书籍等操作（参见图 8.2 和 图 8.3）。\n\n![](img/8.2.jpg)\n**图 8.2：**\
  \ 从 GraphQL API 获取数据\n\n图 8.3 显示了从 GraphQL API 添加数据：\n\n![](img/8.3.jpg)\n**图 8.3：**\
  \ 从 GraphQL API 添加数据\n\n按照惯例，GraphQL 查询应该作为 POST 请求发送，因为查询的复杂性和数据需求可能差异很大。POST 请求允许发送更大的有效负载和更复杂的查询结构。\n\
  \n然而，GraphQL 也支持对于仅检索数据而不产生副作用的简单查询使用 GET 请求。在 GET 请求中，查询通常作为 URL 参数传递。\n\n若要在 GraphQL\
  \ 中使用 GET 请求，你需要相应地修改服务器配置和客户端实现。在服务器端，你需要配置你的 GraphQL 服务器以接受 GET 请求并进行妥善处理。在客户端，你需要将\
  \ GraphQL 查询构建为 URL 参数并将其包含在 GET 请求中。\n\n需要注意的是，由于请求大小限制和潜在的安全考量，通常不建议对复杂查询或变异（mutation）使用\
  \ GET 请求。POST 请求是大多数 GraphQL 交互的推荐方法。\n\n因此，虽然 GraphQL 查询确实可以同时通过 POST 和 GET 方法工作，但建议对大多数\
  \ GraphQL 操作使用 POST 请求，并仅在必要时对简单的只读查询使用 GET 请求。\n\n# 在 Next.js 中将 API 端点集成到客户端(#toc.xhtml_s137a)\n\
  \n在将 REST API 集成到 Next.js 之前，你需要如何在 Next.js 中使用 SWR hook。此外，为了集成 GraphQL API，你可以利用\
  \ Apollo Client 库。让我让我分别解释每个库及其属性，并使用一个简短的代码示例进行说明。\n\nNext.js 中的 SWR（Stale-While-Revalidate）hook\
  \ 是一个内置的数据获取库，它简化了数据获取、缓存以及客户端与服务器之间的同步。它提供了一种直观的方式来处理实时数据更新并优化应用程序的性能。以下是 SWR hook\
  \ 属性及其用法说明：\n\n`useSWR`(key: string, fetcher: Function, options?: Config)`：这是 SWR\
  \ hook 的主函数，用于获取和管理数据。它接受三个参数：\n\n* `key`：正在获取的数据的唯一标识符。它可以是一个 URL、API 端点或任何代表数据源的字符串。\n\
  * `fetcher`：负责执行实际 API 调用并返回响应的函数。fetcher 函数可以是异步的，并且通常应该以特定格式（如 JSON）返回获取的数据。\n\
  * `options`（可选）：一个允许你为 SWR hook 配置额外行为和选项的对象。它包含了属性如 `revalidateOnMount`、`revalidateOnFocus`、`revalidateOnReconnect`、`refreshInterval`\
  \ 等。\n\n这里有一个演示 SWR hook 用法的示例：\n\n```javascript\nimport useSWR from ‘swr’;\nconst\
  \ fetcher = (url) => fetch(url).then((res) => res.json());\nconst MyComponent =\
  \ () => {\n  const { data, error } = useSWR‘/api/data’, fetcher);\n  if (error)\
  \ return <<div>加载数据出错</</div>>;\n  if (!data) return <<div>加载中…</</div>>;\n  return\
  \ <<div>>{data.message}</</div>>;\n};\n```\n\n在前面的示例中，我们使用 `useSWR` 通过 `fetcher`\
  \ 函数从 `/api/data` 端点获取数据。`data` 和 `error` 变量捕获 API 调用的结果，可以在组件中相应地进行渲染。\n\n* `data`：数据属性持有获取的数据。初始时它将是\
  \ `undefined` 或 `useSWR` hook 中指定的默认值。\n* `error`：如果在数据获取过程中发生错误，错误属性将包含错误详情。你可以检查此属性以妥善处理错误情况。\n\
  \n此外，该 hook 还提供了以下函数：\n\n* `mutate`(data?, `shouldRevalidate`?, options?)：`mutate`\
  \ 函数允许你手动更改数据。你可以使用它来更新数据。它接受三个参数：\n    * `data`：要设置的新数据。\n    * `shouldRevalidate`：布尔值，指示变异后是否应该进行重新验证。默认是\
  \ true。\n    * `options`：变异的额外选项，例如 `revalidate`。\n* `revalidate()`：revalidate 函数触发数据的重新验证。\n\
  * `isValidating`：`isValidating` 属性是一个布尔值，指示 SWR 是否正在验证（获取）数据。\n\nApollo Client：Apollo\
  \ Client 是一个强大的 GraphQL 客户端，用于 Next.js 应用程序中的数据获取和管理。它提供了缓存、本地状态管理和订阅等功能。以下是 Apollo\
  \ Client 属性及其用法说明：\n\n### 1. 在 Next.js 中设置 Apollo Client\n要在 Next.js 中使用 Apollo\
  \ Client，你需要安装必要的包：\n\n```bash\nnpm install @apollo/client graphql\n```\n\n安装完成后，你可以创建一个带有所需的\
  \ Apollo Client 实例，通常在一个单独的文件中：\n\n```javascript\nimport { ApolloClient, InMemoryCache\
  \ } from ‘@apollo/client’;\n\nconst client = new ApolloClient({\n  uri: ‘https://localhost:3000.com/graphql’,\
  \ // 替换为你的 GraphQL API 端点\n  cache: new InMemoryCache(),\n});\n\nexport default\
  \ client;\n```\n\n在前面的示例中，我们创建一个带有相应 GraphQL API 端点 (`uri`) 和用于数据缓存的 `InMemoryCache`\
  \ 的 Apollo Client 实例。\n\n### 2. Next.js 中的 Apollo Provider\nNext.js 提供了 `ApolloProvider`\
  \ 组件来封装应用程序，并为层次结构所有组件提供 Apollo Client 实例。你通常可以在 `pages/_app.js` 文件中进行设置：\n\n```javascript\n\
  import { ApolloProvider } from ‘@apollo/client’;\nimport client from ‘../path/to/apolloClient’;\n\
  \nfunction MyApp({ Component, pageProps }) {\n  return (\n    <ApolloProvider client={client}>\n\
  \      <Component {…pageProps} />\n    </ApolloProvider>\n  );\n}\n\nexport default\
  \ MyApp;\n```\n\n通过用 `ApolloProvider` 封装你的应用并传递 `client` 实例，应用程序中的所有组件都可以访问并利用 Apollo\
  \ Client 进行数据获取和管理。\n\n#### 3. 使用 Apollo Client 查询数据：\n\n\n\n\n\n要使用 Apollo Client\
  \ 从 GraphQL API 获取数据，你可以使用 `@apollo/client` 提供的 `useQuery` hook。这是一个示例：\n\n```javascript\n\
  import { gql, useQuery } from ‘@apollo/client’;\n\nconst GET_USERS = gql`\n  query\
  \ {\n    users {\n      id\n      name\n    }\n  }\n`;\n\nfunction MyComponent()\
  \ {\n  const { loading, error, data } = useQuery(GET_USERS);\n  if (loading) return\
  \ <div>Loading…</div>;\n  if (error) return <div>Error loading data</div>;\n  return\
  \ (\n    <ul\n      {data.users.map((user) => (\n        <li key={user.id}>{user.name}</li>\n\
  \      ))}\n    </ul>\n  );\n}\n```\n\n在上述述示例中，我们使用 `@apollo/client` 中的 `gql` 标签定义了一个\
  \ GraphQL 查询。然后使用 `useQuery` hook 根据 `GET_USERS` 查询获取数据。`loading` 属性表示数据是否正在获取中，`error`\
  \ 属性捕获过程中发生的任何错误，而 `data` 属性包含包含获取的数据。\n\n### 使用 Apollo Client 进行 Mutation：\n\n\
  Apollo Client 提供了 `useMutation` hook 来处理 GraphQL 中的变异（数据修改）。这是一个示例：\n\n```javascript\n\
  import { gql, useMutation } from ‘@apollo/client’;\n\nconst ADD_USER = gql`\n  mutation\
  \ AddUser($input: UserInput!) {\n    addUser(input: $input) {\n      id\n      name\n\
  \    }\n  }\n`;\n\nfunction MyComponent() {\n  const [addUser, { loading, error,\
  \ data }] = useMutation(ADD_USER);\n  const handleAddUser = async () => {\n    try\
  \ {\n      const { data } = await addUser({\n        variables: {\n          input:\
  \ {\n            name: “John Doe”,\n          },\n        },\n      });\n      console.log(data);\n\
  \    } catch (error) {\n      console.error(error);\n    }\n  };\n  if (loading)\
  \ return <div>Loading…</div>;\n  if (error) return <div>Error adding user</div>;\n\
  \  return (\n    <div>\n      <button onClick={handleAddUser}>Add User</button>\n\
  \    </div>\n  );\n}\n```\n\n在上述示例中，我们使用 `@apollo/client` 中的 `gql` 标签定义了一个 GraphQL\
  \ 变异。使用 `useMutation` hook 来处理 `ADD_USER` 变异。它返回一个函数 `addUser`，可以通过调用它来触发变异。变异的结果（包括\
  \ `loading`、`error` 和 `data`）被捕获在相应的变量中。\n\n在 `handleAddUser` 函数中，我们调用了 `addUser`\
  \ 函数并提供了变异所需的变量。在这种情况下，我们正在添加一个名为“John Doe”的用户。可以相应地访问并利用响应数据。\n\n### Apollo Client\
  \ 缓存：\n\nApollo Client 利用缓存来存储和管理获取的数据。缓存允许进行高效的数据检索和同步。默认情况下，Apollo Client 使用 `InMemoryCache`\
  \ 实现，它提供了强大的缓存功能。\n\n你可以根据自己的需求自定义缓存行为。例如，你可以修改缓存选项、定义自定义缓存解析器，甚至实现客户端的数据操纵。\n\n\
  这些是在 Next.js 中使用 Apollo Client 的一些关键方面。Apollo Client 还提供了许多功能和能力，包括本地状态管理、订阅和错误处理。它为在\
  \ Next.js 中使用 GraphQL 提供了全面的解决方案，简化了数据获取、缓存和操纵。\n\n**要使用 SWR (Stale-While-Revalidate)\
  \ hook 在 Next.js 应用中集成 REST API 端点，你可以遵循以下步骤：**\n\n1. 安装必要的依赖：\n   `npm install\
  \ swr`\n\n2. 创建新文件 `api.js`，使用 `fetch` 函数或你选择的任何 HTTP 库来处理 API 请求。该文件将包含用于每个 API\
  \ 端点的函数：\n\n```javascript\nexport const fetchTodos = async () => {\n  const response\
  \ = await fetch‘/api/todos’);\n  const data = await response.json();\n  return data;\n\
  };\n\nexport const createTodo = async (todo) => {\n  const response = await fetch‘/api/todos’,\
  \ {\n    method: ‘POST’,\n    headers: {\n      ‘Content-Type’: ‘application/json’,\n\
  \    },\n    body: JSON.stringify(todo),\n  });\n  const data = await response.json();\n\
  \  return data;\n};\n\nexport const updateTodo = async (id, todo) => {\n  const\
  \ response = await fetch`/api/todos/${id}`, {\n    method: ‘PUT’,\n    headers:\
  \ {\n      ‘Content-Type’: ‘application/json’,\n    },\n    body: JSON.stringify(todo),\n\
  \  });\n  const data = await response.json();\n  return data;\n};\n```\n\n3. 在你的\
  \ Next.js 组件中，导入必要的依赖项并使用 SWR 获取和管理数据：\n\n```javascript\nimport useSWR from ‘swr’;\n\
  import { fetchTodos } from './api';\n\nconst TodoList = () => {\n  const { data:\
  \ todos, error } = useSWR‘/api/todos’, fetchTodos);\n\n  if (error) return <p>{error.message}</p>;\n\
