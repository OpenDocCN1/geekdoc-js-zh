  ![](img/image1_1.jpg)\n\n\n\n\n\n我们已经在我们的计算机上成功搭建了一个 Next.js 13 。\n\n\nNext.js 13\
  \ 引入了基于 React Server Components（服务器组件）的新 App Router 结构，它支持嵌套路由、共享布局、错误处理和加载状态。App\
  \ Router 在一个名为 `app` 的新文件夹中工作，它可以与 `pages` 目录并存。这有助于渐进地采用新的 App Router，并允许开发者按照自己的节奏学习新概念。在本章中，我们将重点关注随\
  \ `v13` 引入的新功能。\n\n\n在 App Router 中，文件夹用于定义路由。路由是由嵌套文件夹组成的单个路径，它们遵循从顶层根文件夹到包含 `page.js`\
  \ 文件的最后一个叶子文件夹的层级结构。`page.js` 用于定义为特定路由显示的 UI。例如，如果我们在浏览器中访问 Next.js 13 应用程序的链接\
  \ [`mathewdony.com/dashboard`](https://mathewdony.com/dashboard)，应用程序将渲染位于 `app`\
  \ 文件夹下 `dashboard` 文件夹中 `page.tsx` 文件中的 UI。\n\n\n```\nmy-app\n│  ├─ dashboard\n\
  │  │  ├─ page.tsx\n```\n### 文件约定\n\nNext.js 提供了一系列特殊文件，用于在嵌套路由创建具有特定行为的 UI。让我们来看看主要的几个：\n\
  - `page.js`: 用于渲染路由的 UI 并使路径对用户公开。\n- `layout.js`: 用于为片段及其子级创建共享 UI。布局会封装一个页面或子片段，并可用于渲染跨多个路由共享的\
  \ UI，例如导航菜单或页眉组件。\n- `loading.js`: 用于为片段及其子级创建加载 UI。`loading.js` 在它们加载时显示加载 UI，其工作原理是将页面或子片段封装在\
  \ React Suspense Boundary（悬挂边界）中。\n\n## 客户端组件与服务器组件\n\n\n客户端组件是从客户端（浏览器）获取并在客户端上渲染的，而服务器组件是从服务器上获取并在服务器上渲染的。\n\
  \n\n在这种情况下，服务器组件非常有用。浏览器只需要下载客户端组件的 JavaScript 文件，而组件被定义为服务器组件是因为服务器构建了该组件并返回了服务器组件的渲染后的\
  \ HTML。这可以加速浏览器渲染并增强用户体验。\n\n\n在 Next.js 13 新引入的 `app` 目录中，所有组件默认都是服务器组件。这意味着只要你指定该组件应在客户端渲染，否则所有组件和页面都将在服务器上渲染。以下是服务器组件在\
  \ `Next.js 13` 中看起来的样子：\n\nexport default function Page() {\nreturn <h1>Hello, Next.js\
  \ 13!</h1>;\n}\n\n你可以从前面的代码中看到它只是一个普通的 React 组件，但由于 `Next.js 13` 中所有组件默认都是服务器组件，它会自动变成一个服务器组件。\n\
  \n\n如果我们需要在应用中添加一个计数器，那么我们可以如下所示在 React 组件中导入 `useState`：\n\nimport React, { useState\
  \ } from \"react\";\nexport default function Page() {\nconst [count, setCount] =\
  \ useState(0);\n}\n```\n\n\n![](img/4.2.jpg)\n\n\n要执行前面的代码，我们需要将服务器组件转换为客户端组件。可以通过在组件文件顶部添加\
  \ `use client` 指令来实现，如下：\n\n\"use client\";\nimport React, { useState } from \"\
  react\";\nexport default function Page() {\nreturn <h1>Current Count: {count}</h1>;\n\
  }\n```\n这解决了错误，应用程序如下所示正常运行：\n\n![](img/image2_1.jpg)\n**图 4.3：** 错误后正常运行\n\n##\
  \ 路由\nNext.js 使用基于文件系统的路由器，每个文件夹定义一个路由。每个文件夹代表一个映射到 URL 段的路由，嵌套文件夹创建嵌套路由。\n\n# 动态路由\n\
  在开发 Web 应用程序时，某些情况下开发者或用户无法预知段名称，并希望根据动态数据创建路由。在这种情况下，我们可以使用动态段（Dynamic Segment）。\n\
  \n动态段可以通过将文件夹名称在方括号中创建。\n例如，如果你想渲染从 URL 段获取的动态数据，例如 `app/blog/[slug]/page.js`，其中\
  \ `[slug]` 是博客文章的动态段，你可以这样写 `page.js`：\n\n```\nreturn <div>My Post with ID {params.slug}</div>;\n\
  }\n```\n如果我们访问 URL `app/blog/1234`，我们将在 `params` 属性中获得 `1234`，正如示例所示。\n\n### 错误处理\n\
  `error.js` 文件约定允许开发者处理嵌套路由中的运行时错误。它可以用于将路由及其嵌套子级封装在 React Error Boundary 中。这允许开发者创建针对特定片段的错误\
  \ UI。`error.js` 文件约定的一个主要优势是允许错误隔离，而不影响应用的其他部分。通过在路由段中创建 `error.js` 文件并导出 React\
  \ 组件，可以轻松添加错误 UI。\n\n## 中间件\n我们可以在请求完成之前使用中间件执行代码。可以根据传入的请求通过重写、重定向、更改请求或响应标头来修改响应。\n\
  \n# 渲染\n在 Next.js 中，路由可以是静态渲染或动态渲染的。在静态路由中，组件在构建时在服务器上进行渲染。这些工作会被缓存并在随后的请求中重用，而在动态路由中，组件在请求时在服务器上进行渲染。\n\
  \n### 静态渲染\n\n\n\n静态渲染是 Next.js 应用的默认渲染模式，它能够提高性能，因为所有的渲染工作都是提前完成的，并且可以通过地理位置更接近用户的内容分发网络（CDN）提供。\n\
  \n我们也可以通过在布局（layout）或页面中使用动态函数或动态数据获取来选择动态渲染，这将导致 Next.js 在请求时 动态地渲染整个路由。\n## 动态渲染\n\
  \n如果在静态渲染期间检测到动态函数或无缓存模式下的 `fetch()` 请求，Next.js 将在请求时切换为动态渲染整个路由。在动态渲染期间，任何缓存的数据请求仍然可以重用。动态数据获取是指其\
  \ `cache` 选项设置为‘no-store’或将 `revalidate` 设置为 0 的 `fetch` 请求。我们将在下一节中探索更多数据获取模式。\n\
  # 数据获取\n\nReact 和 Next.js 13 引入了在应用程序中获取和管理数据的新方法。新的数据获取系统工作在 app 目录中，并基于 `fetch()`\
  \ Web API 构建。\n`fetch()` 是一个用于获取远程资源的 Web API，返回一个 promise。React 扩展了 `fetch` 以提供自动请求去重，而\
  \ Next.js 扩展了 `fetch` 选项对象，允许每个请求设置自己的缓存和重新验证。\n\n### Server Components 中的 async\
  \ 和 await\n以下是在 Server Components 中使用 `async` 和 `await` 获取数据的代码示例代码：\n\n```javascript\n\
