  \ // 这将激活最近的 error.js Error Boundary\n  }\n  return res.json();\n}\nexport default\
  \ async function Page() {\n  const data = await getData();\n  return <p>{data}</p>;\n\
  ```\n\n### 静态数据获取\n默认情况下，`fetch` 将自动对数据进行无限期的 `fetch` 和缓存：\n\n```javascript\n```\n\
