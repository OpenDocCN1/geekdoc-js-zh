  \ 数据库条目\n\n我们正在进展！部分是通过 API 调用从我们的 Next.js 应用获取这些数据并渲染到我们的 UI 中。幸运的是，Supabase 提供了一种简单的方法，如\
  \ 图 12.14 所示：\n\n![](img/image12.jpg)\n\n**图 12.14：** Supabase 仪表板\n\n打开我们的 Next.js\
  \ 应用并安装 `@supabase/supabase-js` 包。\n\n在根级别创建一个新的 `utils` 文件夹，并创建一个文件 `SupabaseClient.js`，用\
  \ Supabase 服务器初始化应用：\n\n```javascript\nimport { createClient } from “@supabase/supabase-js”;\n\
  const supabase = createClient(\n  supabaseUrl,\n  supabaseKey\n);\nexport default\
  \ supabase;\n```\n\n将 `supabaseUrl` 和 `supabaseKey` 替换为你 Supabase 帐户中的 API 密钥。\n\
  \n更新 `crud/page.js` 为：\n\n```javascript\n“use client”;\nimport styles from “./page.module.css”;\n\
  import TodoItem from “@/components/ToDoItem”;\nimport List from “@mui/material/List”;\n\
  import supabase from “@/utils/SupabaseClient”;\n\nexport default async function\
  \ Crud() {\n  let { data: items, error } = await supabase.from(“items”).select(“*\"\
  );\n  return (\n    <div className={styles.main}>\n      <h2>待办事项</h2>\n      <List>\n\
  \        {items.map((item) => (\n          <TodoItem item={item} key={index} />\n\
  \        ))}\n      </List>\n    </div>\n  );\n}\n```\n\ncomponents/ToDoItem.jsx\n\
  \n```javascript\n“use client”;\nimport React from { useState };\nimport styles from\
  \ “ToDoItem.module.css”;\nimport ListItem from “@mui/material/ListItem”;\nimport\
  \ ListItemButton from “@mui/material/ListItemButton”;\nimport ListItemIcon from\
  \ “@mui/material/ListItemIcon”;\nimport Checkbox from “@mui/material/Checkbox”;\n\
  import ListItemText from “@mui/material/ListItemText”;\n\nconst ToDoItem = ({ item\
  \ }) => {\n  const [checked, setChecked] = useState([]);\n\n  const handleToggle\
  \ = (key) => {\n    let newChecked = [...checked];\n    const currentIndex = newChecked.indexOf(key);\n\
  \    if (currentIndex !== -1) {\n      newChecked.splice(currentIndex, 1);\n   \
  \ } else {\n      newChecked.push(key);\n    }\n    setChecked(newChecked);\n  };\n\
  \n  return (\n    <ListItem ...>\n      <ListItemButton onClick={handleToggle(key)}>\n\
  \        <ListItemIcon>\n          <Checkbox\n            checked={checked.indexOf(key)\
  \ !== -1}\n            tabIndex={-1}\n            className={styles.checkbox}\n\
  \          />\n        </ListItemIcon>\n        <ListItemText primary={item} />\n\
