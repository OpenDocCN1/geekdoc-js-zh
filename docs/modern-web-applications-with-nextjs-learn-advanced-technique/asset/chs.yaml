  \ 中的路由\n\n## 引言\n\n路由就像 Web 应用的骨干，确保无无缝导航和愉悦的用户体验。在 Next.js 世界中，由于其内置路由器，路由变得轻而易举，它负责处理页面间跳转和处理动态路由时所有的繁重工作。所以，请系好安全带，让我们开启\
  \ Next.js 路由领域的精彩之旅。\n\n总体而言，本章旨在全面理解 Next.js 中路由是如何运作的。它涵盖了 Next.js 路由的基础、页面间的导航、动态路由的处理，以及利用\
  \ `Link` 组件实现高效的客户端导航。\n\n## 结构\n\n本章涵盖的主题如下：\n\n- 理解 Next.js 路由的作用\n- 理解 Next.js\
  \ 的 `Link` 组件及其用法\n- 使用路由器在 Next.js 中进行页面跳转\n- 在 Next.js 中处理动态路由\n\n## 理解 Next.js\
  \ 路由的作用\n\n本节提供了 Next.js 路由的概述及其在处理客户端导航中的重要性。Next.js 路由负责管理应用的路由，并根据请求的 URL 渲染相应的组件。\n\
  \nNext.js 路由在管理 Next.js 应用内的路由中起着至关重要的作用。它负责根据 URL 处理不同页面之间的导航，并相应地渲染合适的组件。Next.js\
  \ 路由基于 `React Router`（流行的客户端路由库），并添加了特定于 Next.js 的功能和优化。\n\n为了更好地理解 Next.js 路由的作用，让我们考虑一个示例。假设我们有一个三个页面的\
  \ Next.js 应用：`Home`、`About` 和 `Contact`。每个页面都有自己的 URL 和相应的组件。这些页面的 URL 如下：\n\n-\
  \ Home: \"/home\"\n- About: \"/about\"\n- Contact: \"/contact\"\n\n当用户在浏览器中输入应用程序的\
  \ URL 时，Next.js 路由负责将 URL 与定义的路由匹配并渲染相应的组件。\n\n例如，如果用户在浏览器地址栏输入 `/about` 并回车，Next.js\
  \ 路由会检测到 `/about` URL 并渲染对应的 About 组件。路由器无缝处理这一过程，确保在不刷新页的情况下显示正确的组件。\n\nNext.js\
  \ 路由还支持嵌套路由，允许我们创建复杂的页面结构。例如，我们可以为博客文章创建一个嵌套路由：\n\n- Blog Post: \"/blog/[slug]\"\
  \n\n在这种情况下，`[slug]` 代表一个可以是任何值的参数。Next.js 路由可以从 URL 中提取 `slug` 参数的值并将其作为 prop 传递给相应的组件。\n\
  \n总体，Next.js 路由简化了根据当前 URL 管理路由和渲染的过程。它在 Next.js 应用内部提供了无缝的导航体验。\n\n### 示例用法\n\n\
  在 Next.js 中定义路由，我们在页面目录中创建单独的文件。例如，我们可以创建一个名为 `pages/about.js` 的文件来定义 About 路由。在\
  \ `about.js` 文件中，我们将导出一个代表 `About` 页面的 React 组件：\n\n```javascript\n// pages/about.js\n\
  import React from \"react\";\n\nconst About = () => {\n  return (\n    <div>\n \
  \     <h1>About Page</h1>\n    </div>\n  );\n}\n```\n\n\n\n\n\n`<p>这是 About 页面的内容。\
  \ </p>`\n\n`</div>`\n\n`);\n\n`};`\n\nexport default About;\n\n同样，我们可以为其他页面（如 Home\
  \ 和 Contact）创建文件，每个文件都导出各自的 React 组件。\n\n在有了 Next.js 路由之后，我们可以使用 `<Link>` 组件在这些页面之间导航。例如，要从首页跳转到\
  \ `About` 页面，我们可以使用以下代码：\n\n```javascript\n// pages/index.js (Home page)\nimport\
  \ React from “react”;\nimport Link from “next/link”;\n\nconst Home = () => {\n \
  \ return (\n    <div>\n      <h1>首页首页</h1>\n      <p>欢迎来到首页。</p>\n      <Link href=”/about\"\
  >\n        <a>前往 About 页面 (Go to About page)</a>\n      </Link>\n    </div>\n  );\n\
  };\n\nexport default Home;\n```\n\n在此代码段中，`<Link>` 组件被用于创建指向 About 页面 (`/about`)\
  \ 的链接。当用户点击“前往 About 页面（Go to About page）”链接时，Next.js 路由会处理导航并渲染 `About` 组件，而无需刷新整个页面。\n\
  \nNext.js 路由使得定义路由和在页面间导航变得非常简单，在 Next.js 应用内提供了无缝的用户体验。\n\n在最新的 Next.js 版本（13+）中，路由结构经过了细微调整。以下是更新后的文件夹结构及其简单描述：\n\
  \n- `app`\n- `about`\n- `page.js` # 现在映射到 “/about”\n- `products`\n- `[productId]`\n\
  - `page.js` # 现在映射到 “/products/:productId”\n\n该结构展示了 `app` 目录下的层级关系。值得注意的是，`about`\
  \ 页面和 `products` 路由现在位于各自的文件夹中。重要的是，这些文件夹中的文件（如 `page.js`）已经过优化，可以直接与特定的 URL 路由对应。这种改进增强了\
  \ Next.js 路由系统的整体组织结构和用户友好性，促进了更高效、直观的 Web 应用程序开发方法。\n\n## 理解 Next.js Link 组件及其用法\n\
  \nNext.js Link 组件是用于 Next.js 应用中创建客户端导航链接的强大工具。它提供了一种优化的导航处理方式，确保快速的页面切换并保留应用状态。本节将解释\
  \ Link 组件的用法及其各种属性和选项。\n\nNext.js Link 组件是一个内置功能，能够在 Next.js 应用内的页面之间进行客户端导航。它提供了一种简单且优化的链接创建方式，确保快速的页面切换并保留应用状态。以下是\
  \ Link 组件属性的说明，以及演示其用法的代码示例：\n\n- `href (字符串或对象):`\n  `href` 属性指定链接的目标目标 URL。它可以是一个表示静态路由的字符串，也可以是一个包含动态路由参数的对象。\n\
  \n  ```javascript\n  import Link from ‘next/link’;\n  // 静态路由\n  <Link href=”/about\"\
  >\n    <a>关于 (About)</a>\n  </Link>\n\n  // 带有参数的动态路由\n  <Link href=”/users/[id]”\
  \ as=”/users/1\">\n    <a>用户资料 (User Profile)</a>\n  </Link>\n  ```\n\n- `as (字符串,\
  \ 可选):`\n  `as` 属性与动态路由结合使用，用于指定在浏览器地址栏中显示的实际 URL。仅在使用动态路由时需要它。\n\n- `replace (布尔值,\
  \ 可选):`\n  `replace` 属性决定导航应该是替换浏览器历史记录中的当前页面还是添加新条目。默认情况下，设置为 `false`，这意味着将添加新条目。\n\
  \n  ```javascript\n  <Link href=”/contact” replace>\n    <a>联系 (Contact)</a>\n \
  \ </Link>\n  ```\n\n- `scroll (布尔值或字符串, 可选):`\n  `scroll` 属性控制点击链接时的滚动行为。可以设置为 `true`\
  \ 以滚动到页面顶部，`false` 保留当前滚动位置，或设置为字符串值以滚动到目标页面上的特定元素 ID。\n\n  ```javascript\n  <Link\
  \ href=”/blog” scroll={true}>\n    <a>博客 (Blog)</a>\n  </Link>\n  ```\n\n- `shallow\
  \ (布尔值, 可选):`\n  `shallow` 属性启用浅路由（shallow routing），这意味着如果仅更改查询参数，页面组件将不会重新渲染。当你想要在更新\
  \ URL 而不获取新数据或重新运行页面的初始 props 时，它非常有用。\n\n  ```javascript\n  <Link href=”/products”\
  \ shallow>\n    <a>产品 (Products)</a>\n  </Link>\n  ```\n\n- `prefetch (布尔值, 可选):`\n\
  \  `prefetch` 属性启用在后台自动预取链接页的数据。这可以通过减少访问被链接页面时的加载时间来提升用户体验。\n\n  ```javascript\n\
  \  <Link href=”/dashboard” prefetch>\n    <a>仪表板 (Dashboard)</a>\n  </Link>\n  ```\n\
  \nLink 组件封装了锚点标签 (`<a>`)，为客户端导航提供了必要的功能。它处理点击事件并防止浏览器的默认导航行为。\n\n通过使用 Link 组件，Next.js\
  \ 优化了导航过程，并利用其内置能力增强了用户体验。它实现了页面间的平滑过渡并提升了性能。\n\n- `passHref (布尔值, 可选):`\n  `passHref`\
  \ 属性设置为 `true` 时，会将 `href` 属性传递给底层的 `<a>` 标签。这在需要应用自定义样式时非常有用。\n\n  ```javascript\n\
  \  <Link href=”profile” passHref>\n    <a className=”custom-link”>个人资料 (Profile)</a>\n\
  \  </Link>\n  ```\n\n- `active (布尔值, 可选):`\n  `active` 属性允许在链接匹配当前路由时应用特定的样式或类。这对于在导航菜单中高亮链接很有帮助。\n\
  \n  ```javascript\n  <Link href=”about” active={true}>\n    <a>关于 (About)</a>\n\
  \  </Link>\n  ```\n\n- `onClick (函数, 可选):`\n  `onClick` 属性允许定义定义点击链接时执行的自定义函数。这在导航之前执行额外操作或触发事件时有用。\n\
  \n  ```javascript\n  const handleClick = () => {\n    // 执行额外操作\n    console.log('Link\
  \ clicked');\n  };\n\n  <Link href=”/contact” onClick={handleClick}>\n    <a>联系\
  \ (Contact)</a>\n  </Link>\n  ```\n\n- **链接外部 URL:**\n  除了内部导航，Link 组件还可以用于创建指向外部\
  \ URL 的链接。只需将完整 URL 作为 `href` 属性提供，Next.js 将处理跳转。\n\n  ```javascript\n  <Link href=”https://www.example.com”>\n\
  \    <a>外部链接 (External Link)</a>\n  </Link>\n  ```\n\nNext.js Link 组件简化了在 Next.js\
  \ 应用中创建导航链接的过程。它确保了高效的客户端导航，处理了动态路由，并提供了自定义和优化选项。通过利用 Link 组件，可以在构建 Next.js 应用时创建无缝的用户体验。\n\
  \n\n\n\n\n### 访问路由器对象\n\n在组件中使用 `useRouter` 钩子来获取路由器对象。\n\n```javascript\nconst\
  \ router = useRouter();\n```\n\n## 执行导航\n\n使用路由器对象提供的方法在页面间进行导航。常用的方法是 `push`，它允许你导航到一个新页面。\n\
  \n```javascript\nconst handleNavigation = () => {\n  router.push('/about');\n};\n\
  ```\n\n你也可以使用其他方法，如 `replace` 来替换浏览器历史记录中的当前页面，或者使用 `back` 返回到上一个页面。\n\n## 处理导航事件\n\
  \nNext.js 提供了多种事件，你可以在导航发生时对它们进行监听。例如，你可以监听 `routeChangeStart` 事件在路由切换前执行某些操作，或者监听\
  \ `routeChangeComplete` 事件在路由切换后执行操作。\n\n```javascript\nuseEffect(() => {\n  const\
  \ handleRouteChangeStart = () => {\n    // 在路由切换前执行的操作\n  };\n  const handleRouteChangeComplete\
  \ = () => {\n    // 在路由切换后执行的操作\n  };\n  router.events.on('routeChangeStart', handleRouteChangeStart);\n\
  \  router.events.on('routeChangeComplete', handleRouteChangeComplete);\n  return\
  \ () => {\n    router.events.off('routeChangeStart', handleRouteChangeStart);\n\
  \    router.events.off('routeChangeComplete', handleRouteChangeComplete);\n  };\n\
  }, []);\n```\n\n以下是关于 Next.js 中 `useRouter` 钩子及其属性的更多细节：\n\n### query (object)\n\
  \n路由对象的 `query` 属性包含从 URL 解析出的查询字符串参数。它允许你访问并检索传递给当前页面的查询参数。\n\n```javascript\n\
  // URL: /products?id=123\nconsole.log(router.query.id); // 输出: 123\n```\n\n### pathname\
  \ (string)\n\n`pathname` 属性代表当前的 URL 路径，不包含查询参数。它提供了应用程序内当前页面路径。\n\n```javascript\n\
  console.log(router.pathname); // 输出: /products\n```\n\n### route (string)\n\n`route`\
  \ 属性返回当前匹配的路由模式。它代表与当前页面相关的路由。\n\n```javascript\nconsole.log(router.route); // 输出:\
  \ /products\n```\n\n### basePath (string)\n\n`basePath` 属性返回应用程序的基础路径。它代表应用程序中所有页面共同拥有的\
  \ URL 部分。\n\n```javascript\nconsole.log(router.basePath); // 输出: /\n```\n\n### isFallback\
  \ (boolean)\n\n`isFallback` 属性指示当前页面是否正在作为回退（fallback）静态生成。它在回退状态下渲染回退内容非常有用。\n\n\
  ```javascript\nif (router.isFallback) {\n  return <div>Loading…</div>;\n}\n```\n\
  \n### events (EventEmitter)\n\n`events` 属性提供了一个 `EventEmitter` 对象，用于触发与路由切换相关的事件。你可以用它监听各种事件，例如路由切换开始、完成和路由切换错误。\n\
  \n```javascript\nrouter.events.on('routeChangeStart', () => {\n  console.log('Route\
  \ change started');\n});\n```\n\n记得使用 `router.events.on()` 订阅事件，并使用 `router.events.off()`\
  \ 清理事件监听器。\n\n### push (method)\n\n路由对象的 `push` 方法允许你通过程序方式导航到新页面。你可以将目标 URL 作为字符串参数传递给\
  \ `push` 方法。\n\n```javascript\nconst handleNavigation = () => {\n  router.push('/about');\n\
  };\n```\n\n### replace (method)\n\n`replace` 方法与 `push` 类似，但它是替换浏览器历史记录中的当前页面而不是添加新条目。它对于实现返回按钮或你不希望用户通过浏览器的后退按钮访问当前页面非常有用。\n\
  \n```javascript\nconst handleNavigation = () => {\n  router.replace('/about');\n\
  };\n```\n\n### back (method)\n\n`back` 方法允许你返回浏览器历史记录中的上一个页面。它等同于浏览器的后退功能。\n\n```javascript\n\
  const handleNavigation = () => {\n  router.back();\n};\n```\n\n### prefetch (method)\n\
  \n`prefetch` 方法允许你在后台预取并缓存特定页面的资源（HTML、JavaScript、CSS 等）。在用户导航到页面之前预加载所需的资产，可以提高性能。\n\
  \n```javascript\nconst prefetchPage = () => { router.prefetch('/about'); };\n```\n\
  \n### isReady (boolean)\n\n`isReady` 属性指示路由器对象是否就绪，以及所有初始值（如查询参数）是否已填充。它对于根据路由的就绪状态进行条件渲染非常有用。\n\
  \n```javascript\nif (!router.isReady) {\n  return <div>Loading…</div>;\n}\n```\n\
  \n\n\n\n在前面的示例中，使用了 `useRouter` 钩子来获取路由对象。`router.query` 对象包含了动态参数，可以通过对象解构来访问（例如，`const\
  \ { productId } = router.query`）。随后，你可以使用该动态参数（在本例中为 `productId`）来获取并显示相关的产品详情。\n\
  \n在 Next.js 中处理动态路由允许你构建能够处理不同参数的页面，这为根据动态值显示内容提供了一种灵活且可重用的方式。`Link` 组件简化了到动态路由的导航，而\
  \ `useRouter` 钩子则允许在组件内部访问动态参数。\n\n## 结论\n\n*理解 Next.js 中的路由* 这一章节是一份全面的指南，探索了核心的路由概念和技术，为开发者在\
  \ Next.js 应用中进行导航和处理路由提供了坚实的基础。它涵盖了 Next.js 路由的基础知识、页面导航、动态路由处理、`Link` 组件、`useRouter`\
  \ 钩子以及基于文件的路由。通过理解路由的作用，开发者可以深入了解页面导航是如何管理的，以及不同的路由是如何映射到其相应组件的。`Link` 组件的使用简化了用于页面切换的锚点标签的，在保留服务器渲染优势的同时确保了优化的客户端导航。动态路由允许处理带有动态参数的路由，构建出灵活且可重用的组件，根据提供的参数渲染不同的内容。`useRouter`\
  \ 钩子赋予了对路由对象的访问权限，为路由工作提供了各种属性和方法。基于文件的路由通过将文件结构映射到 URL 结构，简化了路由的组织。本章让开发者掌握了这些知识，使他们能够在页面间跳转、处理动态路由、利用\
  \ `Link` 组件进行优化的客户端导航，并利用 `useRouter` 的 `useRouter` 钩子来增强路由控制和交互，从而在他们的 Next.js\
  \ 应用中创建动态、交互且无缝的路由体验。下一章“Next.js 中的状态管理”将探索用于在 Next.js 应用中管理状态的各种技术和库。\n\n请参考 GitHub\
