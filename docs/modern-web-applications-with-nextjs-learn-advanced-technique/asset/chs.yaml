  \n进入 `Table Editor` 选项卡，将表命名为 `items,`，创建以下四个列，并点击 `Save`：\n\n![](img/image1_2.jpg)\n\
  \n**图 12.12：** 数据库架构\n\n现在，使用 `Insert` 按钮添加与我们在 Next.js 中使用的相同的 Todo 事项。目前你可以使用\
