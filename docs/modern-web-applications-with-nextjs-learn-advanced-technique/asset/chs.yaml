  \n\n在本章将涵盖以下主题：\n\n* 安装、设置和创建新的 Next.js 项目\n* 理解 Next.js 项目的文件夹结构\n* 理解页面在 Next.js\
  \ 中的作用\n* 使用 CSS Modules 在 Next.js 中实现 CSS 样式\n\n## 介绍 Next.js 框架及其优势\nNext.js 是一个强大的、开源的基于\
  \ React 的框架，用于构建服务端渲染和静态生成的应用程序。它由 Vercel 开发和维护，使用 JavaScript 构建，并利用了 React、Node.js\
  \ 和 JavaScript 生态系统的力量。该框架旨在通过自动代码分割、预取和热代码加载等功能提供优化的用户体验。\n\n这里是一个基础 Next.js 组件的示例：\n\
  ```javascript\n// 一个基础的 Next.js 组件\nfunction HomePage() {\n}\n\nexport default HomePage;\n\
  \n\n\n\n- **静态站点生成 (SSG)**: Next.js 可以在构建时生成静态 HTML，减少对服务器的需求。这一功能对于内容更新不频繁的博客或文档站点非常理想。\n\
  - **增量静态重新生成 (ISR)**: 这是 SSR 和 SSG 的结合。ISR 允许你在构建过程后增量更新静态页面，在保持内容最新的同时提供优的性能。\n\
  - **API 路由**: Next.js 允许你在构建页面的同时构建 API 路由，简化了后端开发。\n\n例如：\n```\n// An example of\
  \ API route in Next.js\nexport default function handler(req, res) {\n}\n```\n\n\
  - **内置 CSS 和 Sass 支持**: Next.js 内置对 CSS 和 Sass 的支持，同时也支持如 styled components 或 emotion\
  \ 等 CSS-in-JS 解决方案。\n- **TypeScript 支持**: Next.js 开箱即用支持 TypeScript，允许在项目实现强类型。\n\
  \n\nNext.js 在多个方面与 Create React App (CRA) 和 Gatsby 等 JavaScript 框架脱而出。虽然 CRA 非常适合构建单页应用\
  \ (SPA)，但它缺乏 Next.js 的 SSR 和 SSG 功能，而这些功能对于 SEO 和性能至关重要。另一方面，Gatsby 强调 SSG 但原生不支持\
  \ SSR 或 ISR。此外，Next.js 的自动路由和 API 路由使其成为全栈开发的更全面的解决方案。\n\n\n```\n// A dynamic route\
  \ in Next.js\nfunction Post({ post }) {\n  // Render post…\n}\n  const { id } =\
  \ context.params\n  // Fetch data based on id…\n  return { props: { post } }\nexport\
  \ default Post;\n```\n\n\n由于其多功能性和强大的特性集，许多知名公司在技术栈中使用了 Next.js。Netflix、Twitch 和\
  \ Uber 等公司已经利用 Next.js 的力量来构建快速、可扩展且对 SEO 友 Web 应用程序。这些真实世界的应用验证了 Next.js 框架的实用性和企业级就绪性。\n\
  \n\nNext.js 广泛的特性集减少了对其他框架中可能需要的额外配置或插件的需求。它的服务端渲染能力允许改进 SEO，而静态站点生成和增量静态重新生成为根据你的特定需求优化性能提供了多种选择。\n\
  \n\n```\n// Static Site Generation in Next.js\nexport async function getStaticPaths()\
  \ {\n  // Determine the paths at build time…\n}\n  // Fetch data based on params…\n\
  \  return { props: { … } }\n}\n  // Render the post…\n}\n```\n内置的路由系统简化了页面创建，原生\
  \ API 路由功能意味着你可以在同一个框架内处理后端功能，从而无缝的全栈开发体验。\n\n此外，Next.js 为 CSS 和 Sass、TypeScript\
  \ 以及流行的 CSS-in-JS 解决方案提供了开箱即用的支持，消除了手动设置这些功能的需要。这种内置功能结合自动的热代码重载，带来了极的开发者体验。\n在将\
  \ Next.js 与 CRA 和 Gatsby 等其他流行框架进行比较时，显然 Next.js 为构建现代 Web 应用提供了更全面的工具集。虽然 CRA 和\
  \ Gatsby 各有优处，但 Next.js 的多功能性使其成为许多用例的有力竞争者。\n\nNetflix、Uber 和 Twitch 等知名公司采用 Next.js\
  \ 进一步证明了它的能力实用性。这些公司需要高性能、可扩展且可靠的 Web 应用，他们选择使用 Next.js 表明该框架能够满足这些需求。\n无论你是刚开始\
  \ JavaScript 开发，还是寻求简化工作流的资深开发者，Next.js 提供的系列优势使其成为你下一个项目的绝佳选择。\n\n## 安装并创建新的 Next.js\
  \ 项目\n在本节中，我们将介绍安装 Next.js 的前提条件，并分析 Next.js 的目录结构。\n\n## 安装 Next.js 的前提条件\n在开始使用\
  \ Next.js 之前，我们需要确保机器上安装了必要的工具。Node.js 和 `npm`（包管理器）对于设置 Next.js 项目至关重要。Node.js\
  \ 是一个允许我们在服务器上运行 JavaScript 的 运行时，而 npm 是一个包管理器。\n\n你可以通过在终端中运行以下命令来检查是否安装了 Node.js\
  \ 和 npm 并查看版本：\n```\nnode -v\nnpm -v\n\n如果你没有安装 Node.js，可以从 Node.js 官网 (https://nodejs.org)\
  \ 下载。\n\n\n一旦安装了 Node.js 和 npm，得益于 `create-app` 命令，设置一个新的 Next.js 应用变得轻而易举。\n\n\n\
  ```\nnpx create-app@latest my-next-app\n\n在此命令中，`my-next-app` 是你的项目名称。将其替换为你所需的名称。\n\
  \n\n`create-app` 命令以你的名称创建一个新目录，设置了必要的文件和文件夹并安装了依赖。它本质上是一个准备就绪的 Next.js 应用。\n\n\n\
  ```\ncd my-next-app\n\n要启动开发服务器，使用 `npm` dev 命令：\n\nnpm dev\n```\n\n\n## 理解初始设置\n\
  \n\n- `pages`: 该目录包含你的应用程序页面。每个文件根据其文件名对应一个路由。\n- `public`: 该目录存储静态文件（如图像），这些文件通过根（/）URL\
  \ 路径服务。\n- `package.json`: 该文件包含关于你的项目及其依赖的元数据。\n\n这是 Next.js 项目的目录结构：\n```\nmy-next-app\n\
  ├── pages\n│   ├── api\n│   └── index.js\n├── public\n│   ├── globals.css\n│   └──\
  \ Home.module.css\n└── package.json\n\n\n\n\n`pages` 目录包含一个 `index.js` 文件，它对应于 `/`\
  \ 路由，以及 `_app.js`，这是一个用于初始化页面的自定义 App 组件。你可以通过覆盖它来控制页面初始化或添加全局样式。\n\n\n初始设置为你的 Next.js\
  \ 项目奠定了坚实的基础，随着你在 Next.js 旅程中的进展，你将更多地了解这些组件中的每一个。\n\n\n理解 Next.js 项目的文件和文件夹结构至关重要，因为它能让你更好地感知项目的组织，并使开发更加顺畅。\n\
  \n\n新创建的 Next.js 应用具有以下文件夹结构：\n\nmy-next-app\n├── pages\n│   ├── _app.js\n│   └──\
  \ index.js\n├── public\n├── styles\n│   └── Home.module.css\n├── .gitignore\n├──\
  \ package.json\n```\n\n让我们逐一查看这些目录和文件，以更好地理解它们的角色。\n## 探索 ‘pages’ 目录\n\n`pages`\
  \ 目录是 Next.js 项目最重要的目录之一。你将在这里为应用程序添加所有页面。该目录中的每个文件都根据其文件名对应一个路由。\n例如，如果你在 `pages`\
  \ 目录中创建一个 `about.js` 文件，它将可以通过 `http://localhost:3000/about` 访问。\n\n```\nexport\
  \ default function About() {\nreturn <h1>About Us</h1>\n}\n\n`pages` 目录包含 `_app.js`\
  \ 文件，这是一个自定义 App 组件。该文件允许你覆盖用于初始化页面的默认 App 组件。你可以用它来在页面之间保持状态、添加全局 CSS 或添加全局布局。\n\
  \n\n```javascript\n// pages/api/hello.js\nres.status(200).json({ text: ‘Hello’ })\n\
  }\n```\n## 探索 public 目录\n\n`public` 目录是可以添加静态资源（如图像、字体或 robots.txt 文件）的地方。这些文件将从根路径\
  \ (`/`) URL 路径提供服务。例如，如果你在 `public` 目录中添加一个 `logo.png` 文件，你可以通过 `http://localhost:3000/logo.png`\
  \ 访问它。\n此目录也用于 `manifest.json`、`robots.txt` 以及任何你想添加到域名根目录的静态文件。\n\n## 探索 styles\
  \ 目录\nNext.js 开箱支持 CSS 导入。`styles` 目录是你添加 CSS 文件的地方。默认情况下，Next.js 配置你的项目支持 CSS Modules，这允许你将\
  \ CSS 直接导入到 JavaScript 文件中。\n\n例如，你可以创建一个 `Button.module.css` 文件：\n```css\n/* Button.module.css\
  \ */\n.button {\nbackground-color: #0070f3;\ncolor: #fff;\nborder: none;\n}\n```\n\
  \n\n```javascript\n// pages/index.js\nexport default function Home() {\nreturn <button\
  \ className={styles.button}>Click Me</button>\n}\n\n`globals.css` 文件默认包含，可用于全局样式。这些样式将应用于应用程序中的所有页面和组件。你也可以使用此文件将其他\
  \ CSS 文件作为全局导入。\n\n\n`package.json` 文件包含项目的元数据并列出了它的依赖项。当你运行 `npm install <package>`\
  \ 时，该包将作为依赖项添加。\n\n\n在 Next.js 中，页面是一个 React 组件，它根据 `pages` 目录中的文件名与路由相关联。这个概念是\
  \ Next.js 的基础方面之一，理解它对于使用该框架构建应用程序至关重要。\n\n\n在 Next.js 中，`pages` 目录中的每个文件都会变成一个自动被处理和渲染的路由。假设你有一个文件\
  \ `pages/about.js`，它将可以通过 `http://localhost:3000/about` 访问。\n\n\n```javascript\n\
  // pages/about.js\nreturn <h1>About Us</h1>\n}\n```\n### 自动路由\n在 Next.js 中， `pages`\
  \ 目录中的每个文件都会变成一个自动被处理和渲染的路由。假设你有一个文件 `pages/about.js`，它将可以通过 `http://localhost:3000/about`\
  \ 访问。\n\n\n```javascript\n// pages/about.js\nreturn <h1>About Us</h1>\n}\n```\n\
  # 动态路由\n如果你在 `pages` 目录中创建一个 `pages/[id].js` 文件，它将可以通过 `/any-id` 访问。\n\n// pages/[id].js\n\
  import { useRouter } from 'next'\n\n// 此处代码示例不完整，但保持逻辑逻辑\n}\n```\n### 嵌套路由\n你可以通过在\
  \ `pages` 目录中添加文件夹来创建嵌套路由。例如，`pages/blog/first.js` 将可以通过 `/blog/first` 访问。\n\n`pages`\
  \ 内部的 `api` 目录是你创建 API 路由的地方。该目录中的每个文件都对应一个路由，可以用于创建一个完整的 API。\n\n```javascript\n\
  export default function handler(req, res) {\nres.status(200).json({ text: ‘Hello’\
  \ })\n}\n\n### 错误页面\nNext.js 有内置的 404 页面，当路由不存在时会自动提供。你可以通过创建一个 `pages/404.js` 文件来自定义\
  \ 404 页面：\n```javascript\n// pages/404.js\nexport default function Custom404() {\n\
  }\n```\n\n\n## 在 Next.js 中创建和渲染基础页面\n\n\n正如之前提到的，Next.js 中的页面是来自 `pages` 目录中的 **.js**、**.jsx**、**.ts**\
  \ 或 **.tsx** 文件的 React 组件。每个页面都根据其文件名与路由相关联。\n\n在 Next.js 中创建新页面只需在 `pages` 目录中创建一个新文件。让我们为我们的应用程序创建一个新的\
  \ **About** 页面。在你的项目中，在 `pages/about.js` 创建新文件并添加以下代码：\n\n```javascript\nexport\
  \ default function About() {\n  return (\n    <div>\n    </div>\n  )\n}\n\n\n\n\n\
  <p>我们是一个专注于使用 Next.js 构建 Web 应用的开发者团队。</p>\n\n)\n}\n\n\n### 查看新页面\n\n\n### 页面之间的链接\n\
  \n\n让我们从 `Home` 页面创建一个到 `About` 页面的 `Link`。打开 `pages/index.js` 文件并按如下所示更新：\n\n//\
  \ pages/index.js\nimport Link from ‘next/link’\nexport default function Home() {\n\
  \    <div>\n      <h1>Home</h1>\n      <p>欢迎来到我们的网站！</p>\n    </div>\n  )\n}\n\n\
  在这段代码中，我们从 `next/link` 导入了 `Link` 组件，并使用它链接到 `About` 页面。`href` 属性用于指定链接的目标路由。\n\n\
  \n### 理解渲染过程\n\n\n1. **服务器接收请求**：当你导航到 Next.js 应用中的某个路由时，服务器会接收到该路由的请求。\n2. **服务器获取页面组件**：Next.js\
  \ 随后从 `pages` 目录获取该路由的 React 组件。\n4. **服务器发送 HTML 响应**：HTML 结果被发送到客户端，并带有用于水合（hydration）的极简\
  \ JavaScript 代码。\n5. **页面变为交互式**：JavaScript 代码在客户端运行，将 HTML **水合**为完全可交互的 React\
  \ 应用。\n\n\n### 总结\n\n\n### 创建布局组件\n\n\n让我们创建一个布局组件，渲染一个带有指向 `Home` 和 `About` 页面链接的导航栏：\n\
  \n// components/Layout.js\nimport Link from ‘next/link’\nexport default function\
  \ Layout({ children }) {\n    <div>\n      <nav>\n        <Link href=”/\">首页</Link>\n\
  \      </nav>\n      {children}\n    </div>\n}\n```\n\n\n现在，你可以在页面中使用此 `Layout`\
  \ 组件：\n\n// pages/index.js\nimport Layout from ‘../components/Layout’\nexport default\
  \ function Home() {\n    <Layout>\n      <h1>首页</h1>\n      <p>欢迎来到我们的网站！</p>\n\
  \  )\n}\n\nimport Layout from ‘../components/Layout’\nexport default function About()\
  \ {\n  return (\n      <h1>关于我们</h1>\n      <p>我们是一个专注于使用 Next.js 构建 Web 应用的开发者团队。</p>\n\
  \    </Layout>\n}\n```\n\n\n在下一节中，我们将查看如何使用 CSS Modules 在 Next.js 中进行样式设置。\n\n\n\
  样式是任何 Web 应用的重要组成部分。在 Next.js 中，CSS Modules 提供了一种通过局部作用域样式应用的强大方法。\n\n\nCSS Modules\
  \ 是类名默认局部作用域的 CSS 文件。CSS Modules 的核心思想是确保样式不会在组件之间泄漏。\n\n\n要创建一个 CSS Module，你需要创建一个\
  \ `.module.css` 文件。在你的项目目录下创建一个名为 `About.module.css` 文件：\n\n/* About.module.css\
  \ */\n.container {\n  margin: 20px;\n  border: 1px solid #ddd;\n}\n\n  color: #007f3;\n\
  \  font-size: 2em;\n  margin-bottom: 10px;\n\n.content {\n  font-size: 1.2em;\n\
  }\n```\n\n\n### 如何使用 CSS module\n\n\n```javascript\n// pages/about.js\nimport Layout\
  \ from ‘../components/Layout’\nexport default function About() {\n  return (\n \
  \     <div className={styles.container}>\n        <h1 className={styles.title}>关于我们</h1>\n\
  \        <p className={styles.content}>我们是一个专注于使用 Next.js 构建 Web 应用的开发者团队。</p>\n\
  \    </Layout>\n  )\n}\n\n在这个文件中，我们导入了之前创建的 CSS Module 并在组件中使用这些类。样式仅适用于此组件，其他组件使用了相同的类名。\n\
  \n\nCSS Modules 允许组合样式，这意味着你可以在当前模块中使用其他 CSS Modules 的样式。它还支持全局样式，全局样式适用于整个应用程序。\n\
  \n\n```css\n/* Global.module.css */\n  color: #007f3;\n}\n\n@import ‘./Global.module.css’;\n\
  .container {\n  composes: title from ‘./Global.module.css’;\n}\n```\n\n\n\n\n\n\
