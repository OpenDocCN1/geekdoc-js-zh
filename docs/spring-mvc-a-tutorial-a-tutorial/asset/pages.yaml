  md: '# The Views


    The application utilizes JSP pages for the views of the application. The first
    page, ProductForm.jsp, is displayed if the action is input-product. The second
    page, ProductDetails.jsp, is shown for save-product. ProductForm.jsp is given
    in Listing 2.5 and ProductDetails.jsp in Listing 2.6.


    Listing 2.5: The ProductForm.jsp page


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Add Product Form</title>

    <style type="text/css">@import url(css/main.css);</style>

    </head>

