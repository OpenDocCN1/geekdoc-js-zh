  md: "# Working with HTML Forms\n\nA web application almost always contains one or\
    \ more HTML forms to take user input. You can easily send an HTML form from a\
    \ servlet to the browser. When the user submits the form, values entered in the\
    \ form are sent to the server as request parameters.\n\nThe value of an HTML input\
    \ field (a text field, a hidden field, or a password field) or text area is sent\
    \ to the server as a string. An empty input field or text area sends an empty\
    \ string, as ServletRequest.getParameter takes an input field name never returns\
    \ null.\n\nAn HTML select element also sends a string to the server. If none of\
    \ the options in the select element is selected, the value of the option that\
    \ is displayed is sent.\n\nA multiple-value select element (a select element allows\
    \ multiple selection and is indicated by <select multiple>) sends a string array\
    \ and has to be handled by ServletRequest.getParameterValues.\n\nA checkbox is\
    \ a bit extraordinary. A checked checkbox sends the string \"on\" to the server.\
    \ An unchecked checkbox sends nothing to the server and ServletRequest.getParameter(fieldName)\
    \ returns null.\n\nRadio buttons send the value of the selected button to the\
    \ server. If none of the buttons is selected, nothing is sent to the server and\
    \ ServletRequest.getParameter(fieldName) returns null.\n\nIf a form contains multiple\
    \ input elements with the same name, all values will be submitted and you have\
    \ to use ServletRequest.getParameterValues to retrieve them. ServletRequest.getParameter\
    \ will only return the last value.\n\nThe FormServlet class in Listing C.4 demonstrates\
    \ how to work with an HTML form. Its doGet method sends an order to the browser.\
    \ Its doPost method retrieves the values and prints them. This servlet is part\
    \ of the servletapi2 application.\n\n# Listing C.4: The FormServlet class\n\n\
    ```\npackage servletapi2;\nimport java.io.IOException;\nimport java.io.PrintWriter;\n\
    import java.util.Enumeration;\nimport javax.servlet.ServletExceptionException;\n\
    import javax.servlet.annotation.WebServlet;\nimport javax.servlet.http.HttpServlet;\n\
    import javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
    \n@WebServlet(name = \"FormServlet\", urlPatterns = {\"/form\"})\npublic class\
    \ FormServlet extends HttpServlet {\n    private static final long serialVersionUID\
    \ = 54L;\n    private static final String TITLE = \"Order Form\";\n\n    @Override\n\
    \    public void doGet(HttpServletRequest request,\n```"
