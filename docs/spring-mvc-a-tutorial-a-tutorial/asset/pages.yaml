  md: "# # File Upload with Servlet 3 or Later\n\nWith Servlet 3, you don't need the\
    \ duo Commons Upload and Commons IO components. Server side file upload programming\
    \ in Servlet 3 and later containers around the MultipartConfig annotation type\
    \ and the javax.servlet.Part interface. Servlets that handle uploaded files must\
    \ be annotated with @MultipartConfig.\n\nThe following are attributes that may\
    \ appear in the MultipartConfig annotation type. All attributes are optional.\n\
    \n+   - maxSize. The maximum size for uploaded files. Files larger than the specified\
    \ value will be rejected. By default, the value of maxSize is -1, which means\
    \ unlimited.\n- maxRequestSize. The maximum size allowed for multipart HTTP requests.\
    \ By default the value is -1, which translates to unlimited.\n- location. The\
    \ location when the uploaded file is saved to disk by calling the write method\
    \ on the Part.\n- fileSize. The threshold after which the uploaded file will be\
    \ written to disk.\n\nThe Spring MVC DispatcherServlet handles most or all requests.\
    \ Unfortunately, you cannot annotate the servlet without changing the source code.\
    \ Fortunately, there is an easier way to make a servlet MultipartConfig servlet\
    \ in Servlet 3: by passing values to the servlet declaration in the deployment\
    \ descriptor (the web.xml file). This has the same effect as annotating DispatcherServlet\
    \ with @MultipartConfig.\n\n```\n<servlet>\n  <servlet-name>springmvc</servlet-name>\n\
    \  <servlet-class>\n    org.springframework.web.servlet.DispatcherServlet\n  </servlet-class>\n\
    \  <init-param>\n    <param-name>contextConfigLocation</param-name>\n    <param-value>\n\
    \      /WEB-INF/config/springmvc-config.xml\n    </param-value>\n  </init-param>\n\
    \  <multipart-config>\n    <file-size>2048820</file-size>\n    <max-request-size>41801841</max-request-size>\n\
    \    <file-size-threshold>1048576</file-size-threshold>\n  </multipart-config>\n\
    </servlet>\n```\n\nAs simple as that. On top of that, you need to use a different\
    \ multipart resolver for Spring MVC configuration file. Here is it.\n\n```\n<bean\
    \ id=\"multipartResolver\"\n     class=\"org.springframework.web.multipart.support.\n\
    \     StandardServletMultipartResolver\">\n```"
  merge: -1
  pgno: 323
