  md: '# # An Overview of JSP


    A JSP page is essentially servlet. However, working with JSP pages may be easier
    than dealing with servlets for two reasons. First, you do not have to compile
    JSP pages. Second, JSP pages are basically text files with jsp extension and you
    can use any text editor to write them.


    JSP pages run on a JSP container. A servlet container is normally also a JSP container.
    Tomcat, for instance, is a servlet/JSP container.


    The first time a JSP page is invoked, a servlet/JSP container does two things:


    +   - Translate the JSP page into a JSP page implementation, which is a Java class
    that implements the javax.servlet.jsp.JspPage interface or its subinterface javax.servlet.http.HttpJspPage.
    Psp is a subinterface of javax.servlet.Servlet and this makes every JSP page a
    servlet. The class name of the generated servlet is dependent on the servlet/JSP
    container. You do not have to worry about this because you do not have to work
    with it directly. If there is a translation error, an error message will be sent
    to the client.

    - If the translation was successful, the servlet/JSP container compiles the servlet
    class. The container then loads and instantiates the JSP bytecode as well as performs
    the lifecycle operations it normally does a servlet.


    For subsequent requests for the same JSP, the servlet/JSP container checks if
    the JSP page has been modified since the last time it was translated. If so, it
    will be re-translated, re-compiled and executed. If not, the JSP servlet already
    in memory is executed. This way, the first invocation of a JSP page always takes
    longer than subsequent requests because it involves translation and compilation.
    To get around this problem, you can do one of the:


    +   - Configure the application so that all JSP pages will be called (and, in
    effect, translated and compiled) when the application starts, rather than at first
    requests.

    - Precompile the JSP pages and deploy them as servlets.


    JSP comes with an API that carries four packages:


    +   - javax.servlet.jsp. Contains core classes and interfaces used by the servlet/JSP
    container to translate JSP pages into servlets. The JspPage and HttpJspPage interfaces
    are important members of this package. All JSP implementation classes must either
    implement JspPage or HttpJspPage. In the HTTP environment, JspPage is the obvious
    choice.

    - javax.servlet.jsp.tagext. Contains types for developing custom tags.

    - javax.servlet.jsp.el. Provides the API for the Unified Expression Language.

    - javax.servlet.jsp.el. Provides classes that must be supported by a servlet/JSP
    container to support the Expression Language in JSP.


    With the exception of javax.servlet.jsp.tagext, you rarely have to use the JSP
    API'
