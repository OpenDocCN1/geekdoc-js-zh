  md: 'Of special importance is the org.springframework.ui.Model type. This is not
    a Servlet API type, but rather a Spring MVC type that contains a Map. Every time
    a request-handling method is invoked, Spring MVC creates a Model object and populates
    its Map with potentially various objects.


    A request-handling method can return one of these objects.


    +   - A ModelAndView

    - A Model object

    - A Map containing the attributes of the model

    - A View object

    - A String representing the logical view name

    - void

    - An HttpEntity or ResponseEntity object to provide access to the Servlet response
    HTTP headers and contents

    - A Callable

    - A DeferredResult

    - Any other return type. In this case, the return value will be considered a model
    attribute to be exposed to the view


    You’ll learn how to write request-handling methods in the sample applications
    given later in this chapter.'
