  md: '# The select Tag


    The select tag renders an HTML select element. The options for the rendered element
    may come from a collection or a map or an array assigned to its items attribute
    or from a nested option or options tag. The properties of the select tag are given
    in Table 5.11. All attributes are optional and none of the HTML attributes is
    included in the table.


    | Attribute | Description |

    | --- | --- |

    | cssClass | Specifies the CSS class to be applied to the rendered input element.
    |

    | cssStyle | Specifies the CSS style to be applied to the rendered input element
    |

    | cssErrorClass | Specifies the CSS class to be applied to the rendered input
    element if the bound property contains errors, overriding the value of the cssClass
    |

    | htmlEscape | Accepts true or false indicating whether or not the rendered value(s)
    should be HTML-escaped. |

    | items | The Collection, Map, or array of objects used to generate the input
    elements. |

    | itemLabel | The property of the objects in the collection/Map/array specified
    in the items attribute that is to supply the label for each input element. |

    | itemValue | The property of the objects in the collection/Map/array specified
    in the items attribute that is to supply the value for each input element. |

    | path | The path to the property to bind |


    **Table 5.11: The select tag’s attributes**


    The items attribute is particularly useful as it may be bound to a collection,
    a map, or an array of objects to generate the options for the select element.


    For example, the following select tag is bound to the id property of the category
    property of the form-backing object. Its options come from categories model attribute.
    The value for each option comes from the id property of the objects in the categories
    collection/map/array, and its label comes from name property.


    ```

    <form:select id="category" path="category.id"

    items="${categories}" itemLabel="name"

    itemValue="id"/>

    ```'
