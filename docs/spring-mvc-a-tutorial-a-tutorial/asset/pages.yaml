  md: '# Formatting Collections


    Since the EL defines how to write expressions and not functions, unsurprisingly
    there is nothing that can be be directly used to print or format collections.
    After all, printing and formatting are not the domain of the EL. However, printing
    and formatting are two important tasks that cannot be ignored.


    If you are new to the EL 3.0 but familiar with JSP, the easiest way to format
    collections is to use the JSTL, which is discussed in Chapter 6, "JSTL." However,
    that would be a shame because with such powerful features, the EL 3.0 alone should
    be enough to resolve these issues and allow us to ditch JSTL completely.


    The EL 3.0 specification says nothing about formatting collections. However, the
    new features in the EL 3.0 are powerful enough to present such an opportunity.
    For example, you might try forEach, which at first glance looks similar to JSTL''s
    forEach. In fact, the following actually works in Tomcat 8.


    ```

    $cities.stream().forEach(x -> pageContext.out.println(x))

    ```


    Sadly, this does not work in GlassFish 4, so forEach is definitely out.


    The two solutions I finally came up with are not as clean as forEach, but at least
    they work with all major servlet containers. The first solution works with Java
    SE 7. The second solution is arguably a more elegant solution than the first,
    but only works with Java SE 8.


    Here they are.'
  merge: -1
  pgno: 228
- img_proc: true
  md: "# Using HTML Comments\n\nA string representation of a List looks like this:\n\
    \n```\n[ element-1, element-2, ... ]\n```\n\nNow, if I want to present the elements\
    \ in an HTML list, I need to write it like so.\n\n```\n<ul>\n  <li>element-1</li>\n\
    \  <li>element-2</li>\n  ...\n</ul>\n```\n\nNow, you've probably noticed that\
    \ each element must be turned to `<li>element-n</li>`.\\ How do I do that? If\
    \ you've been paying close attention, you'll probably still remember that the\
    \ map method can be used to transform each element. So, I'll have something like\
    \ this:\n\n```\n$myList.stream().map(x -> \"<li>\" += x += \"</li>\").toList()\n\
    ```\n\nwhich gives me a List like this:\n\n```\n[ <li>element-1</li>, <li>element-2</li>,\
    \ ... ]\n```\n\nClose enough, but you still need to remove the brackets and commas.\
    \ Unfortunately, you have no control over the string representation of a List.\
    \ Fortunately though, you can use HTML comments.\n\nSo, here is an example:\n\n\
    ```\n<ul>\n<!--${cities.stream().map(x -> \"--><<li>\"+x+=\"</li>---\").toList()}-->\n\
    </ul>\n```\n\nThe result looks like this:\n\n```\n<ul>\n<!--[]-->Paris/</li><!--,\
    \ ---->Strasbourg/</li><!--,\n  ---->London/</li><!--, ----><li>New York/</li><!--,\n\
    \  ----><li>Beijing/</li><!--, ----><li>Amsterdam/</li><!--, ---->San\nFrancisco/</li><!---]\n\
    \  ---->\n</ul>\n```\n\nThis effectively comments out the brackets and commas.\
    \ The result looks a bit messy, but it is nonetheless valid HTML and, more importantly,\
    \ it works!\n\nFigure 8.2 shows how it is rendered."
  merge: -1
