  md: "Like a dummy, a stub is also an implementation of a dependency interface. The\
    \ difference between a dummy and a stub is that methods in a stub return hard-coded\
    \ values and those methods are actually used.\n\nListing 13.9 shows a stub that\
    \ can be used to test the ProductServiceImpl class in Listing 13.6.\n\n# Listing\
    \ 13.9: The ProductDAOStub class\n\n```\npackage com.example.stub;\nimport java.math.BigDecimal;\n\
    import com.example.dao.ProductDAO;\n\npublic class ProductDAOStub implements ProductDAO\
    \ {\n    public BigDecimal calculateDiscount() {\n        return new BigDecimal(14);\n\
    \    }\n    public boolean isOnSale(int productId) {\n        return false;\n\
    \    }\n}\n```"
