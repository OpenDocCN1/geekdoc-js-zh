  md: "# Web Fragments\n\nServlet 3.0 added web fragments, a new feature for deploying\
    \ plug-ins or frameworks in an existing application. Web fragments are designed\
    \ to complement the deployment descriptor without having to edit the web.xml file.\
    \ A web fragment is basically a package (jar file) containing the usual objects,\
    \ such as servlets, filter, and listeners, and other resources, such as JSP pages\
    \ and static images. A web fragment can also have a descriptor, which is an XML\
    \ document similar to the deployment descriptor. The web fragment must be named\
    \ web-fragment.xml and reside in the META-INF directory of the package. The web-app\
    \ element in the deployment descriptor, plus some web-fragment specific elements.\
    \ An application can have multiple web fragments.\n\nListing E.2 shows the skeleton\
    \ of the web fragment descriptor. The text printed in bold highlights the difference\
    \ between it and the deployment descriptor. The root element in a web fragment\
    \ is, unspringly, web-fragment. The web-element can even have the metadata-complete\
    \ attribute. If the value of the metadata-complete attribute is true, annotations\
    \ in the classes contained by the web fragment will be skipped.\n\nListing E.2:\
    \ The skeleton of a web-fragment.xml\n\n```\n<xml version=\"1.0\" encoding=\"\
    ISO-8859-1\"?>n<web-fragment version=\"3.1\" xmlns=\"http://www.jspcp.org/ns/javaee\"\
    \n     xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n     xsi:schemaLocation=\"\
    http://www.jspcp.org/ns/javaee\n     http://www.jspcp.org/ns/javaee/web-fragment_3_1.xsd\"\
    >\n  <metadata-complete>true</metadata-complete>\n  ...\n</web-fragment>\n```\n\
    \nAs an example, the fragmentdemo application is practically empty except for\
    \ a web fragment in fragment.jar file. The jar file has been imported to the WEB-INF/lib\
    \ directory of fragmentdemo. The focus of this example is not on fragmentdemo\
    \ but rather on the fragment project, which contains a servlet (fragment.servlet.FragmentServlet,\
    \ printed in Listing E.3) and a web-fragment.xml file (given in Listing E.4).\n\
    \nListing E.3: The FragmentServlet class\n\n```\npackage fragment.servlet;\nimport\
    \ java.io.IOException;\nimport java.io.PrintWriter;\nimport javax.servlet.ServletExceptionException;\n\
    import javax.servlet.http.HttpServlet;\nimport javax.servlet.http.HttpServletRequest;\n\
    import javax.servlet.http.HttpServletResponse;\n```"
  merge: -1
