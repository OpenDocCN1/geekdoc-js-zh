  md: '# Formatting Numbers


    To format a number, again you can take advantage of the fact that the EL 3.0 allows
    you to reference static methods. The String class''s format method is a static
    method that can be used to format numbers.


    For example, the following expression returns a double with two decimal points.


    ```

    ${String.format("-10.2f%n", 125.178)}

    ```


    More formatting rules can be found in the JavaDoc for java.text.DecimalFormat.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# Formatting Dates


    You can also use String.format() to format a date and a time. For example, the
    following expression formats a date.


    ```

    $${d = LocalDate.now().plusDays(2); String.format("%tB %te, %tY%n", d)}


    ```


    First, LocalDate.now().plusDays(2) is evaluated and its return value is stored
    in d. Next, String.format() is used to format the LocalDate, referring to d three
    times.


    More date formatting rules can be found here:


    https://docs.oracle.com/javase/tutorial/java/data/numberformat.html'
  merge: -1
