  md: "# The RequestMapping Annotation Type\n\nInside a controller you write request\
    \ handling methods that will handle an action. To tell Spring which method handles\
    \ which action, you need to map URIs to methods using the `org.springframework.web.bind.annotation.RequestMapping`\
    \ annotation type.\n\nThe RequestMapping annotation type does what its name implies:\
    \ map a request and a method. You can use @RequestMapping to annotate a method\
    \ or a class.\n\nA method annotated with @RequestMapping becomes a request-handling\
    \ method and will be invoked when the dispatcher servlet receives a request with\
    \ a matching URI.\n\nHere is a controller with a RequestMapping-annotated method.\n\
    \n```\npackage com.example.controller;\nimport org.springframework.stereotype.Controller;\n\
    import org.springframework.web.bind.annotation.RequestMapping;\n...\n\n@Controller\n\
    public class CustomerController {\n\n    @RequestMapping(value = \"input-customer\"\
    )\n    public String inputCustomer() {\n\n        // do something here\n     \
    \   return \"CustomerForm\";\n    }\n}\n```\n\nYou specify the URI mapped to the\
    \ method using the value attribute in the RequestMapping annotation. In the example\
    \ above, the URI input-customer is mapped with the inputCustomer method. This\
    \ means, the inputCustomer method can be invoked using a URL having this pattern.\n\
    \n```\nhttp://domain/context/input-customer\n```\n\nSince the value attribute\
    \ is the default attribute of the RequestMapping annotation type, you can omit\
    \ the attribute name if it is the only attribute used in the RequestMapping annotation.\
    \ In other words, these two annotations have the same meaning.\n\n```\n@RequestMapping(value\
    \ = \"input-customer\")\n@RequestMapping(\"/input-customer\")\n```\n\nHowever,\
    \ if more than one attributes appear in @RequestMapping, you must write the value\
    \ attribute name.\n\nThe value of a request mapping can be an empty string, in\
    \ which case the method is mapped to the following URL:\n\n```\nhttp://domain/context\n\
    ```"
  merge: -1
