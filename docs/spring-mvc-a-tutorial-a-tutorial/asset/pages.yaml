  md: '# applicationScope, sessionScope, requestScope and pageScope


    You use the applicationScope implicit object to obtain the value of an application-scoped
    variable. For example, if you have an application-scoped variable called myVar,
    you may use this expression to access the attribute:


    ```

    ${applicationScope.myVar}

    ```


    Note that in servlet/JSP programming a scoped object is an object placed as an
    attribute in any of the following objects: PageContext, ServletRequest, HttpSession,
    or ServletContext. The sessionScope, requestScope, and pagescope implicit objects
    are similar to applicationScope. However, the scopes are session, request, and
    page, respectively.


    A scoped object can also be accessed in an EL expression without the scope. In
    this case, the JSP container will return the first identically named object in
    the PageContext, ServletRequest, HttpSession, or ServletContext. Searches are
    conducted starting from the narrowest scope (PageContext) to the widest (ServletContext).
    For example, the following expression will return the object referenced by today
    in any scope.


    ```

    ${today}

    ```'
