  md: "# GenericServlet\n\nThe preceding examples showed how to write servlets by\
    \ implementing the Servlet interface. However, did you notice that you had to\
    \ provide implementations for all the methods in Servlet even though some of them\
    \ did not contain code? In addition, you needed to preserve the ServletConfig\
    \ object into a class level variable.\n\nFortunately, the GenericServlet abstract\
    \ class comes to the rescue. In keeping with the spirit of early code writing\
    \ in object-oriented programming, GenericServlet implements both Servlet and ServletConfig\
    \ and perform the following tasks:\n\n+   * Assign the ServletConfig in the init\
    \ method to a class level variable so that it can be retrieved by getting servletConfig.\n\
    * Provide default implementations of all methods in the Servlet interface.\n*\
    \ Provide methods that wrap the methods in the ServletConfig.\n\nGenericServlet\
    \ preserves the ServletConfig object by assigning it to a class level variable\
    \ servletConfig in the init method. Here is the implementation of init in GenericServlet.\n\
    \n```\npublic void init(ServletConfig servletConfig)\n    throws ServletException\
    \ {\n    this.servletConfig = servletConfig;\n    this.init();\n}\n```\n\nHowever,\
    \ if you override this method in your class, the init method in your servlet will\
    \ be called instead and you have to call super.init(servletConfig) to preserve\
    \ the ServletConfig. To save you from having to do so, GenericServlet provides\
    \ a second init method, which does not take arguments. This method is called by\
    \ the first init method after ServletConfig is assigned to a variable servletConfig.\
    \ Here is the implementation of the first init method in GenericServlet.\n\n```\n\
    public void init(ServletConfig servletConfig)\n    throws ServletException {\n\
    \    this.servletConfig = servletConfig;\n    this.init();\n}\n```\n\nThis means,\
    \ you can initialize code by overriding the no-argument init method and the ServletConfig\
    \ will still be preserved by the GenericServlet instance.\n\nThe GenericServletDemoClass\
    \ in Listing C.3 is a rewrite of ServletConfigDemoServlet in Listing C.2. Note\
    \ that the new servlet extends GenericServlet instead of implementing ServletConfig.\n\
    \n# Listing C.3: The GenericServletDemoServlet class\n\n```\npackage servletapi;\n\
    nimport java.io.IOException;\n```"
