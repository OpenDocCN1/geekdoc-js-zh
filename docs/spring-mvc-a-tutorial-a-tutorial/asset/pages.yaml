  md: "# The out Tag\n\nThe out tag evaluates an expression and outputs the result\
    \ to the current JspWriter. The syntax for out has two forms, with and without\
    \ a body content:\n\n```\n<c:out value=\"value\" [escapeXml=\"{true|false}\"]\n\
    [default=\"defaultValue\"]/>\n```\n\n```\n<c:out value=\"value\" [escapeXml=\"\
    {true|false}\"]\n  default value\n</c:out>\n```\n\n# Note\n\nIn a tag's syntax,\
    \ [ ] indicates optional attributes. The underlined value, if any, indicates the\
    \ default value.\n\nThe body content for out is JSP. The list of the tag's attributes\
    \ is given in Table 9.2.\n\n| Attribute | Type | Description |\n|---|---|---|\n\
    | value* | Object | The expression to be evaluated. |\n| escapeXml+ | boolean\
    \ | Indicates whether the characters <, >, &, ', and \" in the result will be\
    \ converted to the corresponding character entity codes, i.e. < to &lt;, etc.\
    \ |\n| default+ | Object | The default value |\n\nTable 9.2: The out tag's attributes\n\
    \nFor example, following the out tag prints the value of the scoped variable x:\n\
    \n```\n<c:out value=\"${x}\"/>\n```\n\nBy default, out encodes the special characters\
    \ <, >, ', \", and & to their corresponding character entity codes &lt;, &gt;,\
    \ #039;, #034;, and &amp;, respectively.\n\nPrior to JSP 2.0, the out tag was\
    \ the easiest way to print the value of a scoped object. JSP 2.0 or later, unless\
    \ you need to XML-escape a value, you can safely use an EL expression:\n\n```\n\
    ${x}\n```\n\n# Warning\n\nIf a string containing one or more special characters\
    \ is not XML escaped, its value may not be rendered correctly in the browser.\
    \ On top of that, unescaped special characters will make your web site susceptible\
    \ to cross-site scripting attacks, i.e. someone can post a JavaScript function/expression\
    \ that will be automatically executed.\n\nThe default attribute in out lets you\
    \ assign a default value that will be displayed if the EL"
