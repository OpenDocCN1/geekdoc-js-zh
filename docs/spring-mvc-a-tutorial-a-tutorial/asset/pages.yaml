  md: '# The HTTP Request


    The HTTP request consists of three components:


    - Method—Uniform Resource Identifier (URI)—Protocol/Version

    - Request headers

    - Entity body


    Here is a sample HTTP request:


    ```

    POST /default.jsp HTTP/1.1

    Accept: text/plain; text/html

    Accept-Language: en-gb

    Connection: Keep-Alive

    Host: localhost

    User-Agent: Mozilla/5.0 (Macintosh; U; Intel Mac OS X 10.5; rv/1.9.2.6) Gecko/20100625
    Firefox/3.6.6

    Content-Length: 30

    Content-Type: application/x-www-form-encoded

    Accept-Encoding: gzip, deflate

    lastName=Blanks&firstName=Mike

    ```


    The method—protocol version appears as the first line of the request.


    ```

    POST /examples/default.jsp HTTP/1.1

    ```


    Here POST is the request method, /examples/default.jsp the URI, and HTTP/1.1 the
    Protocol/Version section.


    An HTTP request can use one of the many request methods specified in the HTTP
    standards. HTTP 1.1 supports GET, POST, HEAD, OPTIONS, PUT, DELETE, and TRACE.
    GET and POST are most commonly used in Internet applications.


    The URI specifies an Internet resource. A Uniform Resource Locator (URL) is actually
    a type of URI (See http://www.ietf.org/rfc/rfc2396.txt).


    In an HTTP request, the request header contains useful information about the client
    environment and the entity body of the request. For instance, it may contain the
    language the browser is set, the length of the entity, and so on. Each header
    is separated by a carriage return/linefeed (CRLF) sequence.


    Between the headers and the entity body is a blank line (CRLF) that is important
    to the HTTP request format. The CRLF tells the server where the entity body begins.
    In some Internet programming books, this CRLF is considered the fourth component
    of an HTTP request.


    In the previous HTTP request, the entity body is simply the following line:


    ```

    lastName=Blanks&firstName=Mike

    ```


    The entity body can easily be much longer in a typical HTTP request.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# The HTTP Response


    Similar to the HTTP request, the HTTP response also consists of three parts:


    +   - Protocol—Status code—Description

    - Response headers

    - Entity body


    The following is an example of an HTTP response:


    ```

    HTTP/1.1 200 OK

    Server: Apache-Coyote/1.1

    Date: Thu, 29 Sep 2013 13:13:33 GMT

    Content-Type: text/html

    Last-Modified: Wed, 28 Sep 2013 13:13:12 GMT

    Content-Length: 112


    <html>

    <head>

    <title>HTTP Response Example</title>

    </head>

    <body>

    Welcome to Brainy Software

    </body>

    </html>

    ```


    The first line of the response header is similar to the first line of the request
    header. It tells you that the protocol used is HTTP version 1.1, and that the
    request succeeded (200 is the success code).


    The response headers contain useful information similar to the headers in an HTTP
    request. The entity body of the response is the HTML content of the response itself.
    The headers and the entity body are separated by a sequence of CRLFs.


    Status code 200 is only issued if the web server was able to find the resource
    requested. If a resource cannot be found or the request cannot be understood,
    the server sends a different request. For instance, 401 is the status code for
    an unauthorized access and 405 indicates that the HTTP method is not allowed.
    For a complete list of HTTP status codes, refer to this online document.


    > http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html'
  merge: -1
