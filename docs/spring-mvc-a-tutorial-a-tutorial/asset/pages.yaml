  md: 'FileSystemXmlApplicationContext and WebAppContext. All expect an XML document
    or multiple XML documents that contain information on the beans that it will manage.
    A ClassPathXmlApplicationContext will try to find the configuration files in the
    class path whereas a FileSystemXmlApplicationContext will try to find them in
    the file system. A WebAppContext by default will look in the web application directory.


    For example, here is code to create an ApplicationContext that searches for config1.xml
    and config2.xml files in the class path.


    ```

    ApplicationContext context = new ClassPathXmlApplicationContext(

    new String[] {"config1.xml", "config2.xml"});

    ```


    To obtain a bean from the ApplicationContext, call its getBean.


    ```

    Product product = context.getBean("product", Product.class);

    ```


    The getBean method above looks for a bean with the id product that is of type
    Product.


    # Note


    Ideally, you only need to create an ApplicationContext in a test class, and your
    application should not know that it is being managed by Spring. With Spring MVC
    you do not deal with ApplicationContext directly. Instead you use a Spring servlet
    to handle the ApplicationContext.'
