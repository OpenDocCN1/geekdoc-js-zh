  md: '# About This Book


    This section presents an overview of each chapter.


    Chapter 1, “The Spring Framework” introduces the popular open source framework.


    Chapter 2, “Model 2 and the MVC Pattern” discusses the pattern on which Spring
    MVC was built.


    Chapter 3, “Introduction to Spring MVC” presents a gentle introduction to Spring
    MVC. In this chapter you will learn to write your first Spring MVC application.


    Chapter 4, “Annotation-Based Controllers” discusses one of the main pillars of
    the MVC pattern, the controller. In this chapter you will learn how to write annotation-based
    controllers, an approach introduced in Spring MVC 2.5.


    Chapter 5, “Data Binding and the Form Tags” discusses one of the most powerful
    features in Spring MVC and how to use it to repopulate form fields.


    Chapter 6, “Converters and Formatters” talks about two object types that help
    with data binding, the converter and the formatter.


    Chapter 7, “Validators” teaches you how to validate user input by building validators.


    Chapter 8, “The Expression Language” explains one of the most important features
    added in JSP 2.0, the Expression Language (EL). The EL aims to make it possible
    to author script-free JSP pages and can help you write shorter and more effective
    JSP pages. In this chapter you will learn to use EL to access JavaBeans and scoped
    objects.


    Chapter 9, “JSTL” explains the most important libraries in the JavaScript Pages
    Standard Tag Library (JSTL), a collection of custom tag libraries for solving
    common problems such as iterating over a map or collection, conditional testing,
    XML processing, and even database access and data manipulation.


    Chapter 10, “Internationalization” shows how to build multi-language websites
    using Spring MVC.


    Chapter 11, “File Upload” shows how to write controllers that can handle uploaded
    files. Two approaches are discussed.


    Chapter 12, “File Download” explains how to send a resource to the browser programmatically.


    Chapter 13, “Testing Your Application” explains unit testing and integration testing
    with JUnit, Mockito and Spring MVC Test.


    Appendix A, “Tomcat” explains how to install and configure Tomcat and run it in
    multiple operating systems.


    Appendix B, “Using Spring Tool Suite with Maven” explains how to install and configure
    Spring Tool Suite use it to create and run Spring MVC applications


    Appendix C, “Servlet” introduces the Servlet API and presents several simple servlets.
    This chapter focuses on two of the four Java packages in Servlet API, the'
