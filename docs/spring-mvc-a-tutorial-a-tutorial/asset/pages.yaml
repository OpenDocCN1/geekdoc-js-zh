- img_proc: true
  md: '# # Appendix E

    Deployment


    Deploying a Servlet 3.0 or Servlet 3.1 application is a breeze. Thanks to the
    servlet annotation types, you can deploy a servlet/JSP application without the
    deployment descriptor. Having said that, the deployment descriptor is still needed
    in many circumstances where more refined configuration is required. When the deployment
    descriptor is present, it must be named web.xml and located under the WEB-INF
    directory. Java classes must reside in WEB-INF/classes and Java libraries in WEB-INF/lib.
    All application resources must then be packaged into a single war file. A war
    file is basically a zip file with .war extension.


    This appendix discusses deployment and the deployment descriptor.'
  merge: -1
  pgno: 468
- img_proc: true
  md: "# Deployment Descriptor Overview\n\nBefore Servlet 3.0 deployment has always\
    \ involved a web.xml file, the deployment descriptor. With Servlet 3 the deployment\
    \ descriptor is optional because you can use annotations to map a resource with\
    \ a URL pattern. However, the deployment descriptor is needed if one of these\
    \ applies to you.\n\n+   - You need to pass initial parameters to the ServletContext.\n\
    - You have multiple filters and you want to specify the order in which the filters\
    \ are invoked.\n- You need to change the session timeout.\n- You want to restrict\
    \ access to a resource collection and provide a way for the user to authenticate\
    \ themselves.\n\nListing E. 1 shows the skeleton of the deployment descriptor.\
    \ It must be named web.xml and reside in the WEB-INF directory of the application\
    \ directory.\n\nListing E.1: The skeleton of the deployment descriptor\n\n```\n\
    ```xml\n<?xml version=\"1.0\" encoding=\"ISO-8859-1\"?>\n<web-app version=\"3.1\"\
    \ xmlns=\"http://xmlns.jcp.org/ns/javaee\"\n  xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \n  xsi:schemaLocation=\"http://xmlns.jcp.org/ns/javaee/web-app_3_1.xsd\">\n \
    \ [ metadata-complete=\"true|false\"]\n\n...\n\n</web-app>\n```\n```\n\nThe xsi:schemaLocation\
    \ specifies the location of the schema against which the deployment descriptor\
    \ can be validated. The version attribute specifies the Servlet version used.\n\
    \nThe optional metadata-complete attribute specifies whether the deployment descriptor\
    \ is complete. If it is true, the servlet/JSP container must ignore servlet-specific\
    \ annotations like @WebServlet. If this element is set to false or if it's not\
    \ present, the container must examine the class files deployed with the application\
    \ for servlet-specific annotations and scan for web fragments.\n\nThe web-app\
    \ element is the root element and can have subelements for specifying:\n\n+  \
    \ - servlet declarations\n- servlet mappings\n- ServletContext initial parameters\n\
    - session configuration\n- listener classes\n- filter definitions and mappings"
  merge: -1
  pgno: 469
- img_proc: true
  md: '+   - MIME type mappings

    - welcome file list

    - error pages

    - JSP-specific settings

    - JNDI settings


    The rules for each of the elements that may appear in a deployment descriptor
    are given in the web-app_3_1.xsd schema that can be downloaded from this site.


    ```

    http://xmlns.jcp.org/xml/ns/javaee/web-app_3_1.xsd

    ```


    The web-app_3_1.xsd schema includes another schema (web-common_3_1.xsd) that contains
    most of the information. The included schema can be found here.


    ```

    http://xmlns.jcp.org/xml/ns/javaee/web-common_3_1.xsd

    ```


    In turn, web-common_3_1.xsd includes two other schemas:


    +   - javaee_7.xsd, which defines common elements shared by other Java EE 7 deployment
    types (EAR, JAR and RAR)

    - jsp_2_3.xsd, which defines elements for configuring the JSP part of an application
    according to JSP 2.3 specification


    The rest of this section lists servlet and JSP elements that may appear in the
    deployment descriptor. It does not include Java EE elements that are not in the
    Servlet or JSP specification.'
  merge: -1
