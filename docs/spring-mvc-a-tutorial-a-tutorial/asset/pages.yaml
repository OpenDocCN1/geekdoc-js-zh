  md: '# Configuring the EL in JSP 2.0 and Later Versions


    With the EL, JavaBeans, and custom tags, it is now possible to write script-free
    JSP pages. JSP 2.0 and later versions even provide a switch to disable scripting
    in all JSP pages. Software architects can now enforce the writing of script-free
    JSP pages.


    On the other hand, in some circumstances you’ll probably want to disable the EL
    in your applications. For example, you’ll want to do so if you are using a JSP
    2.0-compliant container but are not ready yet to upgrade to JSP 2.0. In this case,
    you can disable the evaluation of EL expressions.


    This section discusses how to enforce script-free JSP pages and how to disable
    the EL in JSP 2.0 and later.'
  merge: -1
  pgno: 234
- img_proc: true
  md: "# Achieving Script-Free JSP Pages\n\nTo disable scripting elements in JSP pages,\
    \ use the **jsp-property-group** element with two subelements: **url-pattern**\
    \ and **scripting-invalid**. The url pattern defines the URL pattern to which\
    \ scripting disablement will apply. Here is how you disable scripting in all JSP\
    \ pages in an application:\n\n```\n<jsp-config>\n  <jsp-property-group>\n    <url-pattern>*.jsp</url-pattern>\n\
    \    <scripting-invalid>true</scripting-invalid>\n  </jsp-property-group>\n</jsp-config>\n\
    ```\n\n# Note\n\nThere can be only one **jsp-config** element in the deployment\
    \ descriptor. If you have specified a **jsp-property-group** for deactivating\
    \ the EL, you must write your **jsp-property-group** for disabling scripting under\
    \ the same **jsp-config** element."
  merge: -1
  pgno: 235
- img_proc: true
  md: "# Deactivating EL Evaluation\n\nIn some circumstances, such as when you need\
    \ to deploy JSP 1.2 applications in a JSP 2.0 or later container, you may want\
    \ to deactivate EL evaluation in a JSP page. When you do so, an occurrence of\
    \ the EL construct will not be evaluated as an EL expression. There are two ways\
    \ to deactivate EL evaluation in a JSP.\n\nFirst, you can set the isELIgnored\
    \ attribute of the page directive to true, such as in the following:\n\n```\n\
    <@ page isELIgnored=\"true\" %>\n```\n\nThe default value of the isELIgnored attribute\
    \ is false. Using the isELIgnored attribute recommended if you want to deactivate\
    \ EL evaluation in one or a few JSP pages.\n\nSecond, you can use the jsp-property-group\
    \ element in the deployment descriptor. The jsp-property-group element is a subelement\
    \ of the jsp-config element. You use jsp-property-group to apply certain settings\
    \ to a set of JSP pages in the application.\n\nTo use the jsp-property-group element\
    \ to deactivate EL evaluation, you may have two subelements: url-pattern and el-ignored.\
    \ The url-pattern element specifies the URL pattern to which EL evaluation will\
    \ apply. The el-ignored element must be set to true.\n\nAs an example, here is\
    \ how to deactivate EL in a JSP page named noEL.jsp.\n\n```\n<jsp-config>\n  <jsp-property-group>\n\
    \    <url-pattern>noEL.jsp</url-pattern>\n    <el-ignored>true</el-ignored>\n\
    \  </jsp-property-group>\n</jsp-config>\n```\n\nYou can deactivate the EL evaluation\
    \ in all the JSP pages in an application by assigning *.jsp to the url-pattern\
    \ element, as element in the following:\n\n```\n<jsp-config>\n  <jsp-property-group>\n\
    \    <url-pattern>*.jsp</url-pattern>\n    <el-ignored>true</el-ignored>\n  </jsp-property-group>\n\
    </jsp-config>\n```\n\nEL evaluation in a JSP page will be deactivated if either\
    \ the isELIgnored attribute of its page directive is set to true or its URL matches\
    \ the pattern in the jsp-property-group element whose el-ignored subelement is\
    \ set to true. For example, if you set the page directive's isELIgnored attribute\
    \ of a JSP page to false but its URL matches the pattern of JSP pages where EL\
    \ evaluation must be deactivated in the deployment descriptor, EL evaluation of\
    \ that page will be deactivated.\n\nIn addition, if you use the deployment descriptor\
    \ that is compliant to Servlet 2.3 or earlier, the EL evaluation is already disabled\
    \ by default, even though you are using a JSP 2.0 or later container."
  merge: -1
  pgno: 236
