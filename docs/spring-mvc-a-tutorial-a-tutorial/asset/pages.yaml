  md: '# Using A Destroy Method


    Some classes come with methods that should be called before instances of the classes
    are put for garbage collection. Spring supports this notion too. In your bean
    declaration, you can use the destroy-method attribute to name a method that should
    be invoked before the object is decommissioned.


    For example, the following bean element instructs Spring to create an instance
    of java.util.concurrent.ExecutorService by calling the static method newCachedThreadPool
    on the java.util.concurrent.Executors class. The bean definition defines the shutdown
    method as the value of its destroy-method attribute. As a result, Spring will
    call shutdown before destroying the ExecutorService instance.


    ```

    <bean id="executorService" class="java.util.concurrent.Executors" factory-method="newCachedThreadPool"
    destroy-method="shutdown"/>

    ```'
