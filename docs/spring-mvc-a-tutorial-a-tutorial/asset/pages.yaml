  md: '# The forTokens Tag


    You use the forTokens tag to iterate over tokens that are separated by the specified
    delimiters. The syntax for this action is as follows:


    ```

    <c:forTokens items="stringOfTheTokens delimiters="delimiters"

    [var="varName"] [varStatus="varStatusName"]

    [begin="begin"] [end="end"] [step="step"]


    body content

    </c:forTokens>

    ```


    The body content is JSP. The list for the forTokens tag''s attributes is given
    in Table 9.7.


    | Attribute | Type | Description |

    | --- | --- | --- |

    | var | String | The name of the scoped variable that references the current item
    of the iteration. |

    | items+ | String | The string of tokens to iterate over. |

    | varStatus | String | The name of the scoped variable that holds the status of
    the iteration. The value is of type javax.servlet.jsp.core.LoopTagStatus. |

    | begin+ | int | The start index of the iteration, where index is zero-based.
    If specified, begin must be 0 or greater. |

    | end+ | int | The end index of the iteration, where index is zero-based. |

    | step+ | int | Iteration will process only every step tokens of the string, with
    the first one. If specified, step must be 1 or greater. |

    | delims+ | String | The set of delimiters. |


    Table 9.7: The forTokens tag''s attributes


    Here is an example of forTokens:


    ```

    <c:forTokens var="item" items="Argentina, Brazil, Chile" delims=",

    <c:out value="${item}"/><br/>

    </c:forTokens>

    ```


    When pasted in a JSP, the preceding forTokens will result in the following:


    Argentina

    Brazil

    Chile'
  merge: -1
