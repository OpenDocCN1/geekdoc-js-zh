  md: '# Summary


    In this chapter you learned about converters and formatter, which you can use
    to direct data binding in a Spring MVC application. Converters are a general-purpose
    tool for converting any type to another type whereas formatters are for converting
    String to another Java type. Formatters are more suitable to be used in the web-tier.'
