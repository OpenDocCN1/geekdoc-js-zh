    \ the file directory under the application directory.\n\nThe html5.jsp page in\
    \ Listing 11.10 contains JavaScriptId that allows the user to select multiple\
    \ files and upload them in one button click. The files themselves will be uploaded\
    \ one at a time.\n\n# Listing: 11.10: The html5.jsp page\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<script>\n  var totalFileLength, totalUploaded, fileCount, filesUploaded;\n\
