- img_proc: true
  md: '# Spring MVC Annotation Types


    There are several advantages of using annotation-based controllers. For one, a
    controller class can handle multiple actions. (By contrast, a controller that
    implements the Controller interface can only handle one action.) This means, related
    actions can be written in the same controller class, thus reducing the number
    of classes in your application.


    Secondly, with annotation-based controllers request mappings do not need to be
    stored in a configuration file. Using the RequestMapping annotation type, a method
    can be annotated to make it a request-handling method.


    Controller and RequestMapping annotation types are two most important annotation
    types in the Spring MVC API. This chapter focuses on these two and briefly touches
    on some other less popular annotation types.'
  merge: -1
