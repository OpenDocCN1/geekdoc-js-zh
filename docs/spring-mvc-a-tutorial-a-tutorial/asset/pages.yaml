  md: '# State Testing vs. Behavior Testing


    Most of the time you are only interested in whether or not a method returns the
    correct result. This is called state testing. Sometimes, however, you also perform
    behavior testing (also known as interaction testing) when you want to make sure
    that a method''s behavior is correct. For example, you might want to verify that
    a method calls some other methods in the correct order. Or, you might want to
    make sure that your method calls another method exactly $n times during an operation.


    You will learn how to perform both state testing and behavior testing later in
    this chapter.'
