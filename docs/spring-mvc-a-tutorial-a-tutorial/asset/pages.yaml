  md: "# The Controller Interface\n\nPrior to Spring 2.5, the only way to write a\
    \ controller was by implementing the **org.springframework.web.servlet.mvc.Controller**\
    \ interface. This interface exposes a **handleRequest** method that must be overridden\
    \ by implementing classes. Here is the signature of the method.\n\n```\nModelAndView\
    \ handleRequest(HttpServletRequest request,\n    HttpServletResponse response)\n\
    ```\n\nAn implementation has access to the **HttpServletRequest** and **HttpResponse**\
    \ of the corresponding request. The implementation must also return a **ModelAndView**\
    \ that contains a view path or a view path and a model.\n\nA controller implementing\
    \ the **Controller** interface can only handle one single action. On the other\
    \ hand, an annotation-based controller can house many request-handling methods\
    \ and do not have to implement any interface. You will learn about the latter\
    \ in Chapter 4, \"Annotation-based Controllers.\""
