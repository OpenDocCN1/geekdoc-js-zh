- img_proc: true
  md: '# limit


    The limit method limits the number of elements in a stream. Consider the following
    List called cities that contains seven cities:


    > [Paris, Strasbourg, London, New York, Beijing, Amsterdam, San Francisco]


    The following code limits the number of elements to three.


    ```

    ${cities.stream().limit(3).toList()}

    ```


    When executed, the expression will return this List:


    > [Paris, Strasbourg, London]


    If the argument passed to limit() is greater than the number of elements, all
    the elements will be returned.'
