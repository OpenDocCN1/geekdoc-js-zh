    attribute name indicates that the attribute is required. A plus sign (+) indicates
    the value of the rtexprvalue element for that attribute is true, which means the
    attribute can be assigned a static string or a dynamic value (a Java expression,
    an Expression Language expression, or a value set by a <jsp:attribute>). A value
    of false for rtexprvalue means that the attribute can only be assigned a static
    string only.


    # Note


    The body content of a JSTL tag can be empty, JSP, or tagdependent.'
