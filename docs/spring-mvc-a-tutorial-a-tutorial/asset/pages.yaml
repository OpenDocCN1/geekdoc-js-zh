  md: "# Spring Validators\n\nRight from the start, Spring has been designed with\
    \ input validation in mind. This was even before JSR 303 (Java validation specification)\
    \ was conceived. As such, the Spring Validation framework was commonplace even\
    \ today, although JSR 303 validators are generally recommended for new projects.\n\
    \nTo create a Spring validator, implement the org.springframework.validation.Validator\
    \ interface. This interface is given in Listing 7.1 and has two methods, supports\
    \ and validates.\n\n+   Listing 7.1: The Spring Validator interface\n\n```\npackage\
    \ org.springframework.validation;\npublic interface Validator {\n    boolean supports(Class<?>\
    \ clazz);\n    void validate(Object target, Errors errors);\n}\n```\n\nThe supports\
    \ method return true if the validator can handle the specified Class. The validate\
    \ method validates the target object and populate the Errors object with validation\
    \ errors.\n\nAn Errors object is an instance of the org.springframework.validation.Errors\
    \ interface. An Errors object contains a list of FieldError and ObjectError objects.\
    \ A FieldError represents an error that is related to one of the properties of\
    \ the validated object. For example, if the price of a product must not be negative\
    \ and the price of a Product being validated is negative, then a FieldError needs\
    \ to be created. ObjectError is an error that is not a Field. For example, if\
    \ a Book that is for sale in Europe is being purchased on an American online,\
    \ then an ObjectError should be raised.\n\nWhen writing a validator, you don't\
    \ need to create an error object directly as instantiating ObjectError or FieldError\
    \ takes a lot of logging effort. This is because the ObjectError class's constructor\
    \ expects four arguments and the FieldError class's constructor takes seven, as\
    \ you can see in the constructor signatures below.\n\n```\nObjectError(String\
    \ objectName, String[] codes, Object[] arguments,\nString defaultMessage)\n\n\
    FieldError(String objectName, String field, Object rejectedValue,\nboolean bindingFailure,\
    \ String[] codes, Object[] arguments,\nString defaultMessage)\n```\n\nThe easier\
    \ way to add an error to the Errors object is by calling one of the reject or\
    \ rejectValue methods on the Errors object. You can call reject to add an ObjectError\
    \ and rejectValue to add a FieldError.\n\nHere are some of the method overloads\
    \ of reject and rejectValue."
  merge: -1
