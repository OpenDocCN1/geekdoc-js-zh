  md: '# The url Tag


    The url tag is surprisingly useful. In short, this tag does either of:


    +   - If the current context path is "/" (i.e. the application is deployed as
    the default context), it prepends an empty string to the specified path.

    - If the current context path is not "/", it prepends the context path to the
    specified path.


    Why this is very important can be explained by presenting a small application
    whose structure is given in Figure 9.1.


    ![](img/9df6b4b4bce0bca1a5859c20a724e196_245_0.png)


    Figure 9.1: The structure of the demo application


    The application consists of two JSP pages, main.jsp and admin.jsp. The main.jsp
    file is located in the application directory and the admin.jsp file in the admin
    folder. Both need to display the two images in the image folder, image1.png and
    image2.png. Note that the absolute paths to the images are as follows.


    ```

    http://host/context/image/image1.png

    http://host/context/image/image2.png

    ```


    Because both images are referenced several times from different locations, it
    is convenient to reference them from an include file and add the file to any JSP
    page that needs to display the images. Four include files in the include folder
    depict four attempts to do this.


    Listing 9.1 shows the content of the first include file, inc1.jsp.


    # Listing 9.1: The content of inc1.jsp


    ```

    inc1.jsp

    <img src="image/image1.png">\n<img src="../image/image2.png"/>

    ```'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'As you can see, the first include file contains paths that are relative the
    current page.

    Assuming the URL to the main.jsp page is http://host/context/main.jsp, the URLs
    to both

    images will be resolved to these URLs:


    ```

    http://host/context/image/image1.png

    http://host/context/../image2.png

    ```


    It is not hard to imagine that the result is less than satisfactory. The first
    image is shown as

    expected, but not the second image.


    The admin page can be invoked using http://host/context/admin/admin.jsp. Referenced

    from this page, the URLs to the images will be resolved as follows.


    ```

    http://host/context/admin/image1.png

    http://host/context/admin/../image2.png

    ```


    As a result, the first image won''t show the second image will.


    It is clear that using paths that are relative to the current page does not work
    because the

    include file may be called from JSP pages in different directories. Our only hope
    is to

    make the images relative to the application itself. So comes the second include,

    inc2.jsp, printed in Listing 9.2.


    # Listing 9.2: The content of inc2.jsp


    ```

    inc2.jsp

    <img src="image/image1.png"/>

    <img src="image/image2.png"/>

    ```


    This looks good and should work; Unfortunately, it does not work in all cases.
    This

    is because the deployment context path is not known at the time the application

    is being developed. Depending on whether or not the application is deployed as
    the default

    context, the admin.jsp page may have one of the following URLs:


    ```

    http://localhost/jst1-demo/admin/admin.jsp

    http://localhost/admin/admin.jsp

    ```


    In both cases the browser does not know the context. In fact, in case of the first
    URL,

    it thinks that the application is deployed as the default context and jstl-demo
    is a directory.

    As such, it will resolve the URI to the first image as http://localhost/image/image1.png,

    which makes the image retrievable.


    Both images will display if the application has been deployed as the default context.

    However, this is enough to illustrate that inc2.jsp is not the right solution.


    The url tag comes to the rescue. Look at the content of inc3.jsp in Listing 9.3
    that uses

    turl tag.


    # Listing 9.3: The content of inc3.jsp


    ```

    <% taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>

    inc3.jsp

    <c:url value="image/image1.png"/>

    ```'
