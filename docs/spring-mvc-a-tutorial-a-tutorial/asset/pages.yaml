  md: '# The password tag Tag


    The password tag renders an <input type="password}/> element and its attributes
    are given in Table 5.4. The password tag is similar to the input tag except that
    it has a showPassword attribute.


    | Attribute | Description |

    | --- | --- |

    | cssClass | Specifies the CSS class to be applied to the rendered input element.
    |

    | cssStyle | Specifies the CSS style to be applied to the rendered input element
    |

    | cssErrorClass | Specifies the CSS class to be applied to the rendered input
    element if the bound property contains errors, overriding the value of the cssClass
    attribute. |

    | htmlEscape | Accepts true or false indicating whether or not the rendered value(s)
    should be HTML-escaped. |

    | path | The path to the property to bind. |

    | showPassword | Indicates whether the password should be shown rather than masked.
    The default is false. |


    Table 5.4: The password tag''s attributes


    All attributes in Table 5.4 are optional and the table does not include HTML attributes.
    Here is an example of the password tag.


    ```

    <form:password id="pwd" path="password" cssClass="normal"/>

    ```'
