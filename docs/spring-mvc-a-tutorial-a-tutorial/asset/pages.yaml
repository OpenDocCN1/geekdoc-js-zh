  md: '# Using the message Tag


    The easiest way to display localized messages in Spring MVC is using the Spring
    message tag. To use this, declare this taglib directive at the top of all JSP
    pages that use the tag.


    ```

    <@taglib prefix="spring" uri="http://www.springframework.org/tags"/>

    ```


    The attributes that may appear in the tag are given in Table 10.3. All attributes
    are optional.


    | Attribute | Description |

    |---|---|n| arguments | Arguments for this tag written as a delimited string,
    an object array, or a single object |

    | argumentSeparator | The character used for separating arguments to this tag.
    |

    | code | The key to retrieve the message. |

    | htmlEscape | Accepts true or false indicating whether or not the rendered text
    should be HTML-escaped. |

    | JavaScriptEscape | Accepts true or false indicating whether or not the rendered
    text should be free from JavaScript |

    | message | A MessageSourcevable argument. |

    | scope | The scope to store the variable defined in the var attribute |

    | text | The default text to render if the code attribute is not present or the
    given code failed to retrieve a message |

    | var | A scoped variable for storing the message. |


    Table 10.3: The message tag’s attributes'
