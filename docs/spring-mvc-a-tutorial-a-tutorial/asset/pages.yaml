    \ in the HttpServletRequest.\n\nIn application, as is the case for most Model\
    \ 2 applications, you need to prevent the JSP pages from being accessed directly\
    \ from the browser. There are a number of ways to achieve this, including:\n\n\
    +   - Putting the JSP pages under **WEB-INF**. Anything under **WEB-INF** or a\
    \ subdirectory under **WEB-INF** is protected. If you put your JSP pages under\
    \ **WEB-INF** you cannot access them directly from the browser, but the controller\
    \ can still dispatch requests to those pages. However, this is not a recommended\
    \ approach since not all containers implement this feature.\n- Using a servlet\
    \ filter and filter requests for JSP pages.\n- Using security restriction in the\
    \ deployment descriptor. This is easier than using a filter since you do not have\
    \ to write a filter class. This method is chosen for this application."
