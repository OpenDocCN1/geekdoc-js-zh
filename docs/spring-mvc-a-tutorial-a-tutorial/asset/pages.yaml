  md: "# Listing 2.13: The DependencyInjector class\n\n```\npackage util;\nimport\
    \ action.PDFAction;\nimport service.PDFService;\n\npublic class DependencyInjector\
    \ {\n    public void start() {\n        // initialization code\n    }\n\n    public\
    \ void shutdown() {\n        // clean-up code\n    }\n    /*\n     * Returns an\
    \ instance of type. type is of type Class\n     * and not String because it's\
    \ easy to misspell a class name\n     */\n    public Object getObject(Class type)\
    \ {\n        if (type == PDFService.class) {\n            return new PDFService();\n\
    \        } else if (type == PDFAction.class) {\n            PDFService pdfService\
    \ = (PDFService)getObject(PDFService.class);\n            PDFAction action = new\
    \ PDFAction();\n            action.setPDFService(pdfService);\n            return\
    \ action;\n        }\n        return null;\n    }\n}\n```\n\nTo obtain an object\
    \ from a DependencyInjector, call its getObject method, passing the Class of the\
    \ expected object. DependencyInjector supports two types, PDFAction and PDFService.\
    \ For example, to get an instance of PDFAction, you would call getObject by passing\
    \ PDFAction.class.\n\n```\nPDFAction pdfAction = (PDFAction)\ndependencyInjector.getObject(PDFAction.class);\n\
    ```\n\nThe beauty of DependencyInjector (and all dependency injection frameworks)\
    \ is that the object it returns comes with dependencies. If a dependency has dependencies,\
    \ the dependency is also injected with its own dependencies. For instance, a PDFAction\
    \ you obtain from a DependencyInjector already contains a PDFService. There is\
    \ no need to create a PDFService yourself in the PDFAction class.\n\nThe server\
    \ controller in design4 is in Listing 2.14. Note that it instantiates the DependencyInjector\
    \ in its init method and calls the DependencyInjector's shutdown method in its\
    \ destroy method. The server never creates a dependency its own. Instead, it obtains\
    \ it from the DependencyInjector."
