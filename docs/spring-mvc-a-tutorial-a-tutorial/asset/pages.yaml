  md: "# Example 2: Preventing Cross-Referencing\n\nCompetitors might try to \"steal\"\
    \ by cross-referencing them, i.e displaying your valuables in their websites as\
    \ if they were theirs. You can prevent this from happening by programmatically\
    \ sending the resources only if the referer header contains your domain name.\
    \ Of course the most determined thieves will still be able to download your properties.\
    \ However, they can't without breaking a sweat. The download application uses\
    \ the ImageController in Listing 12.4 to send images to the browser, if the referer\
    \ header is not null. This will prevent the images from being downloaded directly\
    \ by tying their URLs in the browser.\n\n+   Listing 12.4: The ImageController\
    \ class\n\n```\npackage controller;\nimport java.io.IOException;\nimport java.nio.file.Files;\n\
    import java.nio.file.Path;\nimport java.nio.file.Paths;\nimport java.servlet.http.HttpServletRequest;\n\
    import java.servlet.http.HttpServletResponse;\nimport org.apache.commons.logging.Log;\n\
    import org.springframework.stereotype.Controller;\nimport org.springframework.web.bind.annotation.PathVariable;\n\
    import org.springframework.web.bind.annotation.RequestHeader;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\
    import org.springframework.web.bind.annotation.RequestMethod;\n\n@Controller\n\
    public class ImageController {\n\n    private static final Log Log = LogFactory.getLogger(ImageController);\n\
    \n    @RequestMapping(value=\"/get-image/{id}\", method = RequestMethod.GET)\n\
    \    public void getImage(@PathVariable String id, HttpServletResponse response,\n\
    \        @RequestHeader String referer) {\n        if (referer == null) {\n  \
    \          String imageDirectory = request.getServletContext()\n             \
    \   getRealPath(\"/WEB-INF/image/\");\n            Path file = Paths.get(imageDirectory,\
    \ id + \".jpg\");\n            if (file.exists(file)) {\n                response.setContentType(\"\
    image/jpg\");\n                try {\n                    Files.copy(file, response.getOutputStream());\n\
    \                } catch (IOException e) {\n                    e.printStackTrace();\n\
    \                }\n            }\n        }\n    }\n}\n```"
