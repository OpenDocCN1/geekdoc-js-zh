  md: "# Core Elements\n\nThis section discusses the more important elements in detail.\
    \ Subelements of <web-app> can appear in any order. Certain elements, such as\
    \ session-config, jsp-config, and login-config, can appear only once. Others,\
    \ such as servlet, filter, and welcome-file-list, can appear many times.\n\nThe\
    \ more important elements that can appear directly under <web-app> are given a\
    \ separate section. To find the description of an element which is not directly\
    \ under <web-app>, trace its parent element. For example, the taglib element can\
    \ be found under the subsection \"jsp-config\" and the load-on-startup element\
    \ under \"servlet.\" The subsections under this section are presented in alphabetical\
    \ order.\n\n# context-param\n\nThe context-param element passes values to the\
    \ ServletContext. These values can be read from any servlet/JSP page. This element\
    \ contains a name/value pair that can be retrieved by calling the getParameter\
    \ method on the ServletContext. You can have multiple context-param elements as\
    \ long as the parameter names are throughout the application. ServletContext.getParameterNames()\
    \ returns all Servlet parameter names.\n\nThe context-param element must contain\
    \ a param-name element and a param-value element contains the parameter value.\
    \ Optionally, a description element can also be present to describe the parameter.\n\
    \nThe following are two example context-param elements.\n\n```\n<context-param>\n\
    \  <param-name>location</param-name>\n  <param-value>localhost</param-value>\n\
    </context-param>\n<context-param>\n  <param-name>port</param-name>\n  <param-value>8080</param-value>\n\
    \  <description>The port number used</description>\n</context-param>\n```\n\n\
    # distributable\n\nIf present, the distributable element indicates that the application\
    \ is written to be deployed into a distributed servlet/JSP container. The distributable\
    \ element must be empty. For example, here is a distributable element.\n\n```\n\
    <distributable/>\n```\n\n# error-page\n\nThe error-page element contains a mapping\
    \ between an HTTP error code to a resource path or from a Java exception to a\
    \ resource path. The error-page element dictates the container that the specified\
    \ resource should be returned in the event of the HTTP error"
  merge: -1
  pgno: 471
- img_proc: true
  md: "or if the specified exception is thrown.\nThis element must contain the following\
    \ subelements.\n\n+   - error-code, to specify an HTTP error code\n- exception-type,\
    \ to specify the fully-qualified name of the Java exception type to be captured\n\
    - location, to specify the location of the resource to be displayed in the event\
    \ of an error or exception. The location element must start with a /\n\nFor example,\
    \ the following is an error-page element that tells the servlet/JSP container\
    \ to display the error.html page located at the application directory every time\
    \ an HTTP 404 error code occurs:\n\n```\n<error-page>\n  <error-code>404</error-code>\n\
    \  <location>/error.html</location>\n</error-page>\n```\n\nThe following is an\
    \ error-page element that maps all servlet exceptions with the exceptions.html\
    \ page.\n\n```\n<error-page>\n  <exception-type>javax.servlet.ServletException</exception-type>\n\
    \  <location>/exception.html</location>\n</error-page>\n```\n\n# filter\n\nThis\
    \ element specifies a servlet filter. At the very minimum, this must contain a\
    \ filter-name element and a filter-class element. Optionally, it can also contain\
    \ the following elements: icon, display-name, description, init-param, and async-supported.\n\
    \nThe filter-name element defines the name of the filter. The filter name must\
    \ be unique within the application. The filter-class element specifies the fully\
    \ qualified name of the filter class. and the init-param element is used to specify\
    \ an initial parameter for the filter A filter can have multiple init-param elements.\n\
    \nThe following are two filter elements whose names are Upper Case Filter and\
    \ Image Filter, respectively.\n\n```\n<filter>\n  <filter-name>Upper Case Filter</filter-name>\n\
    \  <filter-class>com.example.UpperCaseFilter</filter-class>\n</filter>\n<filter>\n\
    \  <filter-name>Image Filter</filter-name>\n  <filter-class>com.example.ImageFilter</filter-class>\n\
    \  <init-param>\n    <param-name>frequency</param-name>\n    <param-value>1909</param-value>\n\
    ```"
  merge: -1
  pgno: 472
- img_proc: true
  md: '```

    </init-param>

    <init-param>

    <param-name>resolution</param-name>

    <param-value>1024</param-value>

    </init-param>

    </filter>

    ```


    # filter-mapping


    The filter-mapping element specifies the resource or resources a filter is applied
    to. A filter can be applied to either a servlet or a URL pattern. Mapping a filter
    to a servlet causes the filter to work on the servlet. Mapping a filter to a URL
    pattern makes filtering to occur on any resource whose URL matches the URL pattern.
    Filtering is performed in the same order as the appearance of the filter-mapping
    elements in the deployment descriptor.


    The filter-mapping element contains a filter-name element and a url-pattern element
    or a servlet-name element.


    The filter-name value must match one of the filter names declared using the filter
    elements


    The following are two filter elements and two filter-mapping elements:


    ```

    <filter>

    <filter-name>Logging Filter</filter-name>

    <filter-class>com.example.LoggingFilter</filter-class>

    </filter>

    <filter>

    <filter-name>Security Filter</filter-name>

    <filter-class>com.example.SecurityFilter</filter-class>

    </filter>


    <filter-mapping>

    <filter-name>Logging Filter</filter-name>

    <servlet-name>FirstServlet</servlet-name>

    </filter-mapping>

    <filter-mapping>Security Filter</filter-mapping>

    <url-pattern>/*</url-pattern>

    </filter-mapping>

    ```


    # listener


    The listener element registers a listener. It contains a listener-class element,
    which defines the fully qualified name of the listener class. Here is an example.


    ```

    <listener>

    <listener-class>com.example.AppContext</listener-class>

    </listener>

    ```


    # locale-encoding-mapping-list and locale-encoding-mapping


    The locale-encoding-mapping-list element contains one or more locale-encoding'
