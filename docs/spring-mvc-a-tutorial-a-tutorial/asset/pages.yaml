    In addition to the . and [] operators, the EL also provides several other operators:
    arithmetic operators, relational operators, logical operators, the conditional
    operator, and the empty operator. Using these operators, you can perform various
    operations. However, because the aim of the EL is to facilitate the authoring
    of script-free JSP pages, these EL operators are of limited use, except for the
    conditional operator.


    The EL operators are given in the following subsections.'
