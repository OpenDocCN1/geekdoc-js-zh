  md: '# Accessing JavaBeans


    You can use either the . operator or the [] operator to access a bean’s property.
    Here are the constructs:


    ```

    ${beanName["propertyName"]}

    ${beanName.propertyName}",

    ```


    For example, to access the property secret on a bean named myBean, use the following
    expression:


    ```

    ${myBean.secret}

    ```


    If the property is an object that in turn has a property, you can access the property
    of the second object too, again using the . or [] operator. Or, if the property
    is a Map, a List, or an array, you can use the same rule explained in the preceding
    section to access the Map’s values or the members of the List or the element of
    the array.'
