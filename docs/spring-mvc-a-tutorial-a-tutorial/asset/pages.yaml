- img_proc: true
  md: "# Functions\n\nIn addition to custom actions, JSTL 1.1 and 1.2 define a set\
    \ of standard functions you can use in EL expressions. These functions are grouped\
    \ in the function tag library. To use the functions, you must use the following\
    \ taglib directive on-top of your JSP.\n\n```\n<%@taglib uri=\"http://java.sun.com/jsp/jstl/functions\"\
    \n      prefix=\"fn\" %>\n```\n\nTo invoke a function, you use an EL in this format.\n\
    \n```\n${fn:functionName}\n```\n\nwhere functionName is the name of the function.\n\
    \nMost of the functions are for string manipulation. For instance, the length\
    \ function works for both strings and collections, returning the number of items\
    \ in a collection or array or the number of characters in a string.\n\n+   All\
    \ these functions are described in the sections to follow."
  merge: -1
  pgno: 278
- img_proc: true
  md: '# The contains Function


    The **contains** function tests whether string contains the specified substring.
    The return value is **true** if the string contains the substring, and **false**
    otherwise. Its syntax is as follows:


    ```

    contains(string, substring).

    ```


    For example, both of these EL expressions return **true**:


    ```

    <<c:set var="myString" value="Hello World"/>

    ${fn:contains(myString, "Hello")}


    ${fn:contains("Stella Cadente", "Cadente")}",

    ```'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# The containsIgnoreCase Function


    The containsIgnoreCase function is similar to the contains function, but testing
    is performed in a case-insensitive way. The syntax is as follows:


    ```

    containsIgnoreCase(string, substring)

    ```


    For instance, the following EL expression returns true:


    ```

    ${{fn:containsIgnoreCase("Stella Cadente", "CADENTE")}

    ```'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# The endsWith Function


    The **endsWith** function tests whether a string ends with the specified suffix.
    The return value is a **Boolean**. Its syntax is as follows:


    ```

    endsWith(string, suffix)

    ```


    For example, the following EL expression returns **true:**


    ```

    ${{fn:endsWith("Hello World", "World")}

    ```'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# The escapeXml Function


    This function is useful for encoding a String. The conversion is the same as the
    out tag with its escapeXml attribute set to true. The syntax of escapeXml is as
    follows:


    ```

    escapeXml(string)

    ```


    For example, the EL expression


    ```

    ${fn:escapeXml("Use <br/> to change lines")}

    ```


    is rendered as the following:


    ```

    Use &lt;br;&gt; to change lines

    ```'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# The indexOf Function


    The indexOf function returns the index within a string of the first occurrence
    of the specified substring. If the substring is not found, it returns -1. Its
    syntax is as follows:


    ```

    indexOf(string, substring)

    ```


    For instance, the following EL expression returns 7:


    ```

    ${fn:indexOf("Stella Cadente", "Cadente")}

    ```'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# The join Function


    The join function joins all elements of a String array into a string, separated
    by the specified separator. The syntax is as follows:


    ```

    join(array, separator)

    ```


    If the array is null, an empty string is returned.


    For example, if myArray is a String array having the two elements “my” and “world”,
    the EL expression


    ```

    ${fn:join(myArray,",")}

    ```


    returns “my,world”.'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# The length Function


    The length function returns the number of items in a collection, or the number
    of characters in a string. Its syntax is as follows:


    ```

    length{input}

    ```


    As an example, the following EL expression returns 14:


    ```

    ${fn:length("Stella Cadente", "Cadente")}

    ```'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# The replace Function


    The replace function replaces all occurrences of beforeString with afterString
    in a string and returns the result. Its syntax is as follows:


    ```

    replace(string, beforeSubstring, afterSubstring)

    ```


    For example, the EL expression


    ```

    ${{fn:replace("Stella Cadente", "e", "E")}

    ```


    returns "Stella CadEntE".'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# The split Function


    The split function splits a string into an array of substrings. It does the opposite
    of the join function. For example, the following code splits the string "my,world"
    and stores the result in the scoped variable split. It then formats split into
    an HTML table using the forEach tag.


    ```

    <c:set var="split" value=''${fn:split("my,world","")}'' />

    <table>

    <c:forEach var="substring" items="${split}">

    <tr><td>${substring}</td></tr>

    </c:forEach>

    </table>

    ```


    The result is this:


    ```

    <table>

    <tr><td>my</td></tr>

    <tr><td>world</td></td></tr>

    </table>

    ```'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# The startsWith Function


    The **startsWith** function tests whether a string starts with the specified prefix.
    The syntax is as follows:


    ```

    startsWith(string, prefix)

    ```


    For instance, the following EL expression returns **true**:


    ```

