  md: "# The Controller class\n\nYou can use a Spring validator in a controller class\
    \ by directly instantiating the validator class. The saveProduct method in the\
    \ ProductController class in Listing 7.5 creates a ProductValidator and calls\
    \ its validate method. To check if the validator generated an error message, call\
    \ the hasErrors method on the BindingResult.\n\nListing 7.5: The ProductController\
    \ class\n\n```\npackage controller;\nimport org.apache.commons.logging.Log;\n\
    import org.apache.commons.logging.LogFactory;\nimport org.springframework.framework.stereotype.ui.Model;\n\
    import org.springframework.framework.validation.BindingResult;\nimport org.springframework.framework.validation.FieldError;\n\
    import org.springframework.framework.web.bind.annotation.ModelAttribute;\nimport\
    \ org.springframework.framework.web.bind.annotation.RequestMapping;\nimport domain.Product;\n\
    import validator.ProductValidator;\n\n@Controller\npublic class ProductController\
    \ {\n\n    private static final Log logger = LogFactory\n        .getLogger(ProductController.class);\n\
    \n    @RequestMapping(value = \"/add-product\")\n    public String inputProduct(Model\
    \ model) {\n        model.addAttribute(\"product\", new Product());\n        return\
    \ \"ProductForm\";\n    }\n\n    @RequestMapping(value = \"/save-product\")\n\
    \    public String saveProduct(@ModelAttribute Product product, \n        BindingResult\
    \ bindingResult, Model model) {\n        ProductValidator productValidator = new\
    \ ProductValidator();\n        productValidator.validate(product, bindingResult);\n\
    \n        if (bindingResult.hasErrors()) {\n            FieldError fieldError\
    \ = bindingResult.getFieldError();\n            logger.debug(\"Code:\" + fieldError.getCode()\
    \ + \", field:\" \n                + fieldError.getField());\n            return\
    \ \"ProductForm\";\n        }\n\n        // save product here\n        model.addAttribute(\"\
    product\", product);\n        return \"ProductDetails\";\n    }\n}}\n```"
