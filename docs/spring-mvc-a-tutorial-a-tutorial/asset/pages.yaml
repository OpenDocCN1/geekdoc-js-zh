- img_proc: true
  md: 'Note that andExpect another instance of ResultActions, which can be chained,
    as means multiple calls to andExpect as you can see later in an upcoming example.


    The MockMvcResultMatchers class provides static methods to easily create a ResultMatcher.
    MockMvcResultMatchers belongs to the org.springframework.test.web.servlet package.
    Table 13.4 shows some of its methods.


    | Method | Return Type | Description |

    | --- | --- | --- |

    | cookie | CookieResultMatchers | Returns a ResultMatchers for asserting cookie
    values |

    | header | HeaderResultMatchers | Returns a ResultMatchers for asserting HTTP
    response headers |

    | model | ModelResultMatchers | Returns a ResultMatchers for asserting the model
    associated with the invoked request-handling |

    | status | StatusResultMatchers | Returns a ResultMatchers for asserting the HTTP
    response status |

    | view | ViewResultMatchers | Returns a ResultMatchers for asserting the view
    associated with the invoked request-handling |


    # Table 13.4: More important methods in MockMvcResultMatchers


    For instance, to make sure that the request mapping for the controller''s method
    is correct, you can use the status method:


    ```

    mockMvc.perform(get("/getBook")).andExpect(status().isOK());

    ```


    The isOK method asserts that the response status code is 200, and notice how easy
    it is to integration test a controller using MockMvc and its related classes?'
