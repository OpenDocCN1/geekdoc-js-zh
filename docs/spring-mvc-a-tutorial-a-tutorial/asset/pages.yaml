  md: '# MockHttpRequest and MockHttpServletResponse


    When invoking a controller, chances are you may need to pass an HttpRequest and
    HttpServletResponse. In production objects are provided by the servlet container
    itself. In a test environment, you can use Spring MockHttpRequest and MockHttpServletResponse
    classes from the org.springframework.framework.mock.web package.


    These two classes are easy to use. You can create an instance by invoking their
    no-argument constructors:


    ```

    MockHttpRequest request = new MockHttpRequest();

    MockHttpServletResponse response = new MockResponse();

    ```


    The MockHttpRequest implements javax.servlet.http.HttpServletRequest and allows
    you to configure the instance to look like a real HttpServletRequest. It provides
    methods to set all the properties in an HttpServletRequest as well as obtain the
    values of its properties. Table 13.1 shows some of its methods.


    | Method | Description |

    | --- | --- |

    | addHeader | Adds an HTTP header |

    | addParameter | Adds a request parameter |

    | getAttribute | Returns the specified attribute, if any |

    | getAttributeNames | Returns Enumeration containing all the attribute names |

    | getContextPath | Returns the context path |

    | getCookies | Returns all the cookies |

    | setMethod | Sets the HTTP method |

    | setParameter | Sets a value for the specified HTTP parameter |

    | setQueryString | Sets the query string |

    | setRequestURI | Sets the request URI |


    Table 13.1: More important methods in MockHttpRequest


    MockHttpServletResponse implements javax.servlet.http.HttpServletResponse and
    offers additional methods to configure an instance. Table 13.2 shows some of its
    important methods.


    | Method | Description |

    | --- | --- |

    | addCookie | Adds a cookie. |'
