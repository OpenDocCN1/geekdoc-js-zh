    \ rather than when the servlet is first called. Using load-on-startup means the\
    \ first call to the servlet will take no longer than subsequent calls. This is\
    \ especially useful if the init method of the servlet takes a while to complete.\n\
    \nAnother advantage of using the deployment descriptor is that you don't need\
