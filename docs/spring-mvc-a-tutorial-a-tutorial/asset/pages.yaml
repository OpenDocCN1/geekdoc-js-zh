  md: "# # File Upload with Commons FileUpload\n\nOnly servlet containers that implement\
    \ Servlet 3.0 or later specification file upload. For pre-Servlet 3.0 containers,\
    \ you need the Apache Commons FileUpload component that you can download from\
    \ this web page.\n\n```\nhttp://commons.apache.org/proper/commons-fileupload/\n\
    ```\n\nCommons FileUpload is an open project. In order for Commons FileUpload\
    \ to work successfully, it needs another Apache Commons component, Apache Commons\
    \ IO. You can download Apache Commons IO from here.\n\n```\nhttp://commons.apache.org/proper/commons-io/\n\
    ```\n\nTherefore, you need to copy two JARS to the WEB-INF/lib directory of your\
    \ application. The Commons FileUpload JAR will have a name that follows this pattern:\n\
    \n```\ncommons-fileupload-x.y.jar\n```\n\nwhere x is the major version and y the\
    \ minor version of the software. For example, the one used in this chapter is\
    \ commons-fileupload-1.3.jar.\n\nThe name of the Commons IO JAR follows this pattern.\n\
    \n```\ncommons-io-x.y.jar\n```\n\nHere, x is the major version and y the minor\
    \ version of the software. For instance, the one used in this chapter is commons-io-2.4.jar.\n\
    \nIn addition, you need to define this multipartResolver bean in your Spring MVC\
    \ configuration file.\n\n```\n<bean id=\"multipartResolver\">\n    class=\"org.springframework.web.multipart.commons.CommonsMultipartResolver\"\
    >\n    <property name=\"maxUploadSize\" value=\"20000000\"/>\n</bean>\n```\n\n\
    The upload1 example shows how to use Commons FileUpload to handle uploaded files.\
    \ This example will also work in Servlet 3.0 containers. upload1 has one domain\
    \ class, the Product class, which contains a list of MultipartFile objects. You\
    \ learn in this example how to write a controller that can handle uploaded product\
    \ images."
