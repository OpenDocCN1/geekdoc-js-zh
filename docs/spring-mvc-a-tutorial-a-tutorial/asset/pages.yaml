- img_proc: true
  md: '# Telling Spring MVC What Locale to Use


    The most common method for choosing a locale for a user is probably reading the
    value of the accept-language header of the user browser. The accept-language header
    carries information about the user’s language preferences.


    Other methods for choosing a locale include reading a certain session attribute
    or a cookie.


    To select a locale in Spring MVC, you use the locale resolver bean. There are
    several implementations, including the following.


    +   * AcceptHeaderLocaleResolver

    * SessionLocaleResolver

    * CookieLocaleResolver


    All these implementations are part of the org.springframework.web.servlet.i18n
    package. AcceptHeaderLocaleResolver is probably the easiest to use. If you choose
    this locale resolver, Spring MVC will read the browser’s accept-language header
    to determine the locale(s) that the browser will accept. If one of the browser’s
    locales matches a locale supported by the Spring MVC application, that one will
    be used. If nothing matched, the default locale will be used.


    Here is the definition of the localeResolver bean that uses AcceptHeaderLocaleResolver.


    ```

    <bean id="localeResolver" class="org.springframework.web.servlet.i18n.AcceptHeaderLocaleResolver">

    </bean>

    ```'
