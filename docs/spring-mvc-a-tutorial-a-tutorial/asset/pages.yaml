  md: "# Formatters\n\nA formatter is like a converter, also converts a type to another\
    \ type. However, the source type for a formatter must be a String whereas a converter\
    \ can work with any source type. Formatters are more suitable for the web-tier\
    \ whereas converters can be used in any tier. For converting user input in a form\
    \ in a Spring MVC application, you should always choose a formatter over a converter.\n\
    \nTo create a formatter, write a Java class that implements the org.springframework.format.Formatter\
    \ interface. Here is the declaration of the interface.\n\n```\npublic interface\
    \ Formatter<T>\n```\n\nHere, T represents the type to which the input string should\
    \ be converted. The interface has two methods that all implementations must override,\
    \ parse and print.\n\n```\nparse(String text, java.util.Locale locale)\nprint(T\
    \ object, java.util.Locale locale)\n```\n\nThe parse method parses a String to\
    \ the target type using the specified Locale. The print method does the reverse,\
    \ it returns the string representation of the target object.\n\nAs an example,\
    \ the formatter-demo application employs a LocalDateFormatter for converting a\
    \ String to a LocalDate. It does the same job as the StringToLocalDateConverter\
    \ in converter-demo.\n\nThe LocalDateFormatter class is given in Listing 6.5.\n\
    \nListing 6.5: The LocalDateFormatter class\n\n```\npackage formatter;\nimport\
    \ java.text.ParseException;\nimport java.time.LocalDate;\nimport java.time.format.DateTimeFormatter;\n\
    import java.time.format.DateTimeParseException;\nimport java.util.Locale;\nimport\
    \ org.springframework.format.Formatter;\n```\n\n```\npublic class LocalDateFormatter\
    \ implements Formatter<LocalDate> {\n\n    private DateTimeFormatter formatter;\n\
    \    private String datePattern;\n\n    public LocalDateFormatter(String datePattern)\
    \ {\n        this.datePattern = datePattern;\n        formatter = DateTimeFormatter.ofPattern(datePattern);\n\
    \    }\n\n    @Override\n    public String print(LocalDate date, Locale locale)\
    \ {\n        return date.format(formatter);\n    }\n```"
