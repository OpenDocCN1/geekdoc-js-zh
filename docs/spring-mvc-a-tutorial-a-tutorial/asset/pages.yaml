  md: "# # Changing the Web Root in Integration Testing\n\nBy default, a Spring integration\
    \ test class that is annotated with @WebApplication will use the /src/main/webapp\
    \ directory, relative to the project directory, as the root directory. This does\
    \ not rely on Maven, unless you are not using STS and instead using an IDE that\
    \ does not rely on Eclipse or Beans, this could be problematic in some rare cases.\
    \ For example, if you need to use the value from ServletContext.getPath(), you\
    \ get a value that is relative to /src/main/webapp and not relative to your web\
    \ application directory.\n\nUnfortunately, you cannot just use the /src/main/webapp/WEB-INF/classes\
    \ directory as an output directory in Eclipse which is forbidden in Eclipse. it\
    \ would mean nesting within a source directory. Fortunately, this problem can\
    \ be easily fixed by passing the actual application directory to @WebApplicationConfiguration.\
    \ For example, the following will make any @WebApplicationConfiguration use to\
    \ /approot as the application directory.\n\n```\n@WebApplicationConfiguration(\"\
    /approot\")\n```\n\nAs an example, Listing 13.29 shows a WebAuthController class\
    \ that has a method that returns the real path of an online resource.\n\n**Listing\
    \ 13.29: The WebAuthController class**\n\n```\npackage controller;\nimport javax.servlet.ServletContext;\n\
    import org.springframework.framework.beans.factory.annotation.Autowired;\nimport\
    \ org.springframework.framework.stereotype.Controller;\nimport org.springframework.framework.ui.Model;\n\
    import org.springframework.framework.bind.annotation.RequestMapping;\n\n@Controller\n\
    public class WebAuthController {\n    // ServletContext cannot be used as a method\
    \ parameter, inject\n    // instead.\n    @Autowired\n    private ServletContext\
    \ servletContext;\n\n    @RequestMapping(value=\"/getWebAppDirPath\")\n    public\
