  md: '# HttpServletRequest


    HttpServletRequest represents the servlet request in the HTTP environment. It
    extends the javax.servlet.ServletRequest interface and adds several methods. Some
    of the methods added are as follows.


    ```

    java.lang.String getContextPath()

    ```


    Returns the portion of the request URI that indicates the context of the request.


    ```

    Cookie[] getCookies()

    ```


    Returns an array of Cookie objects.


    ```

    java.lang.String getHeader(java.lang.String name)

    ```


    Returns the value of the specified HTTP header.


    ```

    java.lang.String getMethod()

    ```


    Returns the name of the HTTP method with which this request was made.


    ```

    java.lang.String getQueryString()

    ```


    Returns the query string in the request URL.


    ```

    HttpSession getSession()

    ```


    Returns the session object associated with this request. If none is found, creates
    a new session object.


    ```

    HttpSession getSession(boolean create)

    ```


    Returns the current session object associated with this request. If none is found
    and the create argument is true, creates a new session object.'
