  md: '# # Choosing Between Converters and Formatters


    A converter is used as a general purpose utility to convert one type to another,
    such as a String to a LocalDate or a Long to a LocalDate. A converter can be used
    not only in the web tier, but also in other tiers.


    On the other hand, a formatter can only convert a String to another Java type,
    such as a String to a Date. It cannot be used to convert a Long to a LocalDate,
    for instance. Therefore, a formatter is suitable for the web tier and as such,
    in a Spring MVC application, a formatter is more appropriate than a converter.'
  merge: -1
  pgno: 166
