- img_proc: true
  md: '# # JSTL Libraries


    JSTL is referred to as the standard tag library; however, it exposes its actions
    through multiple tag libraries. The tags in JSTL 1.2 can be categorized into five
    areas, which are summarized in Table 9.1.


    | Area | Subfunction | URI | Prefix |

    |---|---|---|-|

    | Core | Variable Support | | |

    | | Flow Control | http://java.sun.com/jsp/jstl/core | c |

    | | URL Management | | |

    | | Miscellaneous | | |

    | XML | Flow Control | http://java.sun.com/jsp/jstl/xml | x |

    | | Transformation | | |

    | I18n | Locale | | |

    | | Message formatting | http://java.sun.com/jsp/jstl/fmt | fmt |

    | | Number and date formatting | | |

    | Database | SQL | http://java.sun.com/jsp/jstl/sql | sql |

    | Functions | Collection length; String manipulation | http://java.sun.com/jsp/jstl/functions
    | fn |


    **Table 9.1:** JSTL Tag Libraries


    To use a JSTL library in a JSP page, use the taglib directive with the following
    format:


    ```

    <@ taglib uri="uri" prefix="prefix" %>

    ```


    For instance, to use the Core library, declare this at the beginning of the JSP
    page:


    ```

    <@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>

    ```


    The prefix can be anything. However, using the convention makes your code more
    familiar to the other developers in your team who later join the project. It is'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'therefore recommended to use the prescribed prefixes.


    # Note


    Each of the tags discussed in this chapter is presented in its own section and
