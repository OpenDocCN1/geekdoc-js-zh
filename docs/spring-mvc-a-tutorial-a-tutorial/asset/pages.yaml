  md: '# Formatting Actions


    JSTL provides tags for formatting and parsing numbers and dates. The tags are
    formatNumber, formatDate, timeZone, setTimeout, parseNumber, and parseDate. These
    tags are discussed in the sections to follow.'
  merge: -1
  pgno: 266
- img_proc: true
  md: "# The formatNumber Tag\n\nYou use formatNumber to format numbers. This tag\
    \ gives you the flexibility of using various attributes to get a format that suits\
    \ your need. The syntax of formatNumber has two ways. The first is used without\
    \ a body content:\n\n```\n<fmt:formatNumber value=\"numericValue\"\n  type={number|currency|percent}\"\
    \n  pattern=\"customPattern\"\n  currencyCode=\"currencyCode\"\n  currencySymbol=\"\
    currencySymbol\"\n  groupingUsed={true|false}\n  maxIntegerDigits=\"maxIntegerDigits\"\
    \n  minIntegerDigits=\"minIntegerDigits\"\n  maxFractionDigits=\"maxFractionDigits\"\
    \n  minFractionDigits=\"minFractionDigits\"\n  var=\"varName\"\n  scope=\"page|request|session|application\"\
    \n/>\n```\n\nThe second form is used with a body content:\n\n```\n<fmt:formatNumber\
    \ type={number|currency|percent}\n  pattern=\"customPattern\"\n  currencyCode=\"\
    currencyCode\"\n  currencySymbol=\"currencySymbol\"\n  groupingUsed={true|false}\n\
    \  maxIntegerDigits=\"maxIntegerDigits\"\n  minIntegerDigits=\"minIntegerDigits\"\
    \n  maxFractionDigits=\"maxFractionDigits\"\n  minFractionDigits=\"minFractionDigits\"\
    \n  var=\"varName\"\n  scope=\"page|request|session|application\">\n  numeric\
    \ value to be formatted\n</fmt:formatNumber>\n```\n\nThe body content is JSP.\
    \ The formatNumber tag's attributes are given in Table 9.8.\n\n| Attribute | Type\
    \ | Description |\n|---|---|---|\n| value+ | String or Number | Numeric value\
    \ to be formatted. |\n| type+ | String | Indicates whether the value is to be\
    \ formatted as number, currency, or percentage. The value of this attribute is\
    \ one of the following: number, currency, percent. |\n| pattern+ | String | Custom\
    \ formatting pattern. |\n| currency+ | String | ISO 4217 code. See Table 9.9.\
    \ |"
  merge: -1
  pgno: 267
- img_proc: true
  md: "| currencySymbol+ | String | Currency symbol. |\n--- | --- | --- |\n groupingUsed+\
    \ | Boolean | Indicates whether the output will contain grouping separators. |\n\
    \ maxIntegerDigits+ | int | The maximum number of digits in the integer portion\
    \ of the output. |\n minIntegerDigits+ | int | The minimum number of digits in\
    \ the integer portion of the output. |\n maxFractionDigits+ | int | The maximum\
    \ number of digits in the fractional portion of the output. |\n minFractionDigits+\
    \ | int | The minimum number of digits in the fractional portion of the output.\
    \ |\n\n**Table 9.8: The formatNumber tag's attributes**\n\nOne of the uses of\
    \ formatNumber is to format numbers as currencies. For this, you can use the currencyCode\
    \ attribute to specify an ISO 4217 currency code. Some of the codes are given\
    \ in Table 9.9.\n\n| Currency | ISO 4217 Code | Major Unit Name | Minor Unit Name\
    \ |\n--- | --- | --- | --- |\n Canadian Dollar | CAD | dollar | cent |\n Chinese\
    \ Yuan | CNY | yuan | jiao |\n Euro | EUR | euro | euro-cent |\n Japanese Yen\
    \ | JPY | yen | sen |\n Sterling | GBP | pound | pence |\n US Dollar | USD | dollar\
    \ | cent |\n\n**Table 9.9: ISO 4217 Currency Codes**\n\nThe examples of how to\
    \ use formatNumber are given in Table 9.10."
  merge: -1
  pgno: 268
- img_proc: true
  md: '| Action | Result |

    |---|---|

    | <fmt:formatNumber value="12" type="number"/> | 12 |

    | <fmt:formatNumber value="12" type="number" minIntegerDigits="3"/> | 012 |

    | <fmt:formatNumber value="12" type="number" minFractionDigits="2"/> | 12.00 |

    | <fmt:formatNumber value="123456.78" pattern="#.000"/> | 123456.780 |

