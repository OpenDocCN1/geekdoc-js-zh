  md: "Another way of using a Spring validator is by writing an `initBinder` method\
    \ in your controller, and passing the validator to the `WebDataBinder` and calling\
    \ its `validate` method.\n\n```\n@org.springframework.web.bind.annotation.InitBinder\n\
    public void initBinder(WebDataBinder binder) {\n    // this will apply the validator\
    \ to all request-handling methods\n    binder.setValidator(new ProductValidator());\n\
    \    binder.validate();\n}\n```\n\nPassing a validator to the `WebDataBinder`\
    \ will apply the validator to all request-handling methods in the controller class.\n\
    \nAlternatively, you can annotate the object argument to be validated with `@javax.validation.Valid`.\
    \ For example,\n\n```\npublic String saveProduct(@ModelAttribute Product product,\n\
    \    BindingResult bindingResult, Model model) {\n```\n\nThe `Valid` annotation\
    \ type is defined in JSR 303 and I will defer any discussion of JSR 303 until\
    \ the next section."
