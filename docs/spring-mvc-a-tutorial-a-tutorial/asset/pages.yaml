    You can also use an EL expression if you want, as shown in inc4.jspf in Listing
    9.4.


    # Listing 9.4: The content of inc4.jsp


    ```

    inc4.jsp

    --${cp=pageContext.request.contextPath}--

    <img src="${cp=${?""" : cp}/image/image1.png">

    <img src="${cp=${?""" : cp}/image/image2.png"/>

    ```


    The context path can be obtained by using this expression:


    ```

    ${pageContext.request.contextPath}

    ```


    The same expression will be used several times, so I created a shortcut cp.


    ```

    ${cp=pageContext.requestPath}

    ```


    The value, however, will still be sent to the browser, which is why it is put
    in an HTML comment. Then, you just need to test if the context path is "/" (default
    context) or something else.


    ```

