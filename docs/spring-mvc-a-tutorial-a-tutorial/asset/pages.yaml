  md: "# @ModelAttribute\n\nIn the previous section I talked about the Model type\
    \ that Spring MVC creates an instance of every time a request-handling method\
    \ is invoked. You can add a Model as an argument of your method if you intend\
    \ to use it in your method to decorate a Model. The ModelAttribute annotation\
    \ type can be used to decorate a Model instance in a method. This annotation is\
    \ also part of the org.springframework.web.bind.annotation package.\n\n@ModelAttribute\
    \ can be used to annotate a method argument or a method. A method annotated with\
    \ @ModelAttribute will have an instance of it retrieved or created and added to\
    \ the Model object if the method body does not it explicitly. For example, Spring\
    \ MVC will create an instance of Order every time this submitOrder is invoked.\n\
    \n```\n@RequestMapping(method = RequestMethod.POST)\npublic String submitOrder(@ModelAttribute(\"\
    newOrder\") Order order,\nModel model) {\n\n}\n```\n\nThe instance retrieved or\
    \ created will be added to the Model object with attribute key Order. If no key\
    \ name is defined, the name will be derived from the name of the type to be added\
    \ to the Model. For instance, every time the following method is invoked, an instance\
    \ of Order be retrieved and added to the Model using attribute key order.\n\n\
    ```\npublic String submitOrder(@ModelAttribute Order order, Model model)\n```\n\
    \nThe second use of @ModelAttribute is to annotate a non-request-handling method.\
    \ Methods annotated with @ModelAttribute will be invoked every time a request-handling\
    \ method in the same controller is invoked. This, if a controller has two request-handling\
    \ methods and another method annotated with @ModelAttribute method, the annotated\
    \ method will likely be invoked more often than each of the request-handling methods.\n\
    \nA method annotated with @ModelAttribute will be invoked right before a request-handling\
    \ method. Such a method may return an object or have a void type. If it returns\
    \ an object, the object is automatically added to the Model that was created for\
    \ the request-handling method. For example, the return value of this method will\
    \ be added to the Model.\n\n```\n@ModelAttribute\nublic Product addProduct(@RequestParam\
    \ String productId) {\n  return productService.get(productId);\n}\n```\n\nIf your\
    \ annotated method returns void, then you must also add a Model argument type"
