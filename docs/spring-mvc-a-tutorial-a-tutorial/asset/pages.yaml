  md: "# Dummies\n\nThe most primitive type of test double, a dummy is an implementation\
    \ of a collaborator that does not do anything and does not change the behavior\
    \ of the SUT. It is often used so that the SUT can be instantiated. Dummies are\
    \ only used in the very early development stage.\n\nFor example, consider the\
    \ ProductServiceImpl class in Listing 13.6. This class depends on a ProductDAO\
    \ passed to the class's constructor.\n\n+   Listing 13.6: The ProductServiceImpl\
    \ class\n\n```\npackage com.example.service;\nimport com.example.dao.ProductDAO;\n\
    \npublic class ProductServiceImpl implements ProductService {\n    private ProductDAO\
    \ productDAO;\n\n    public ProductServiceImpl(ProductDAO productDAOArg) {\n \
    \       if (productDAOArg == null) {\n            throw new NullPointerException(\"\
    ProductDAO cannot be null.\");\n        }\n        this.productDAO = productDAOArg;\n\
    \    }\n\n    @Override\n    public BigDecimal calculateDiscount() {\n       \
    \ return productDAO.calculateDiscount();\n    }\n\n    @Override\n    public boolean\
    \ isOnSale(int productId) {\n        return productDAO.isOnSale(productId);\n\
    \    }\n}\n```\n\nThe ProductServiceImpl class cannot be instantiated without\
    \ a null ProductDAO. At the same time, the ProductDAO is not used in the methods\
    \ to be tested. As a result, just so that ProductServiceImpl can be instantiated,\
    \ you can create a dummy like the one in Listing 13.7.\n\n+   Listing 13.7: The\
    \ ProductDAOdummy class\n\n```\npackage com.example.dummy;\nimport java.math.BigDecimal;\n\
    import com.example.dao.ProductDAO;\n\npublic class ProductDAOdummy implements\
    \ ProductDAO {\n    public BigDecimal calculateDiscount() {\n        return null;\n\
    \    }\n\n    public boolean isOnSale(int productId) {\n        return false;\n\
    \    }\n}\n```"
