  md: '# ## Model Overview


    Model 2 is based on the Model-View-Controller (MVC) design pattern, the central
    concept behind the Smalltalk-80 user interface. As the term “design pattern” had
    not been coined at that time, it was called the MVC paradigm.


    An application implementing the MVC pattern consists of three modules: model,
    view and controller. The view takes care of the display of the application. The
    model encapsulates the application data and business logic. The controller receives
    user input and commands the model and/or the view to change accordingly.


    In Model 2, you have a servlet or a filter acting as the controller. All modern
    web frameworks MVC Model 2 implementations. Frameworks such as Struts 1, Java
    Faces and Spring MVC employ a servlet in their MVC architectures, whereas Struts
    2, another popular framework, uses a filter. Generally JSP pages are employed
    as the views of the application, even though other technologies are supported.
    As the models, you POJOs (POJO is an acronym for Plain Old Object). POJOs are
    ordinary objects, as opposed to Enterprise JavaBeans (EJB) or special objects.
    Many people choose to use JavaBeans (plain JavaBeans, not EJBs) to store the states
    of model objects and move business logic to action classes.


    Figure 2.1 shows the architecture of a Model 2 application.


    ![](img/9df6b4b4bce0bca1a5859c20a724e196_42_0.png)


    Figure 2.1: Model 2 architecture


    In a Model 2 application, every HTTP request must be directed to the controller.
    The request’s Uniform Resource Identifier (URI) tells the controller which action
    to invoke. The term “action” refers to an operation that the application is able
    to perform. The Java object associated with an action is called an object. A single
    action class may be used to serve different actions (as in Struts 2 and Spring
    MVC) or a single action (as in Struts 1).


    A seemingly trivial operation may take more than one action. For instance, adding
    a product to a database would require two actions:


    +   1. Display an “Add Product” form for the user to enter product information.


    +   2. Save the product information in the database.


    As mentioned above, you use the URI to tell the controller which action to invoke.
    For instance, to get the application to send the “Add Product” form, you would
    use a URI like this:'
  merge: -1
