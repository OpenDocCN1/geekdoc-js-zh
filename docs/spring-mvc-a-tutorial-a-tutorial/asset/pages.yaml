  md: '# Chapter 13


    # Testing Your Application


    The importance of testing in software development cannot be overstated. The main
    objective of testing is to find bugs early, right when the code is being developed
    if possible. It is logical to think that the sooner a bug is found, the cheaper
    it is to fix it. If you find a bug when you are programming, you can change your
    code right away. If a teammate finds your bug after you have released your code
    to a shared repository, it has now involved at least two people. Imagine if the
    bug is found by a customer after the software has been released.


    There are a number of different tests in software development. Two of these, unit
    testing and integration testing, are the topics of this chapter. You normally
    start with unit testing to test individual methods in your classes, then proceed
    with integration testing to test if different modules can work together seamlessly.


    The examples in this chapter were written using the JUnit test framework as well
    as types in the spring-test module. The API in the module can be used for both
    unit testing and integration testing. You can find Spring test-related types in
    the org.springframework.test and its subpackages as well as in org.springframework.mock.*
    packages. The examples are grouped into two accompanying projects called unit-test
    and integration-test. The first project contains classes and unit tests.'
  merge: -1
  pgno: 344
- img_proc: true
  md: "# Unit Testing Overview\n\nWith unit testing, the idea is to create a test\
    \ class for each of your classes and a test method for each method in the class,\
    \ excluding trivial methods such as getter and setter methods that simply return\
    \ and assign values to fields.\n\nIn test parlance, the class being tested is\
    \ the system under test (SUT).\n\nUnit tests are meant to run fast and often.\
    \ They verify the code itself and not its dependencies. Any dependencies should\
    \ be replaced by helper objects test doubles, which will be explained later in\
    \ this chapter. Testing that involves dependencies is normally done in integration\
    \ testing, not unit testing.\n\nAt first glance, writing unit tests looks like\
    \ unnecessary extra work. After all, you can test a class from the class itself\
    \ using the main method. However, you should consider the benefits of unit tests.\
    \ First, test code in a separate test class does not clutter your class. Second,\
    \ unit tests can be used in regression testing to make sure still works when some\
    \ logic was changed. Another benefit of unit testing is it can be automated in\
    \ a continuous integration setup. Continuous integration refers to a development\
    \ approach whereby programmers commit their code into a shared repository often\
    \ and each code commit triggers an automated build that includes running all unit\
    \ tests. Continuous integration allows for problems to be detected early.\n\n\
    In unit testing, classes are instantiated using the new operator. The Spring Framework\
    \ dependency injection is not used to create beans.\n\nLet's take a look at the\
    \ class in Listing 13.1.\n\n# Listing 13.1: A class to be tested\n\n```\npackage\
    \ com.example.util;\npublic class MyUtility {\n\n    public int method1(int a,\
    \ int b) { ... }\n    public long method2(long a) { ... }\n\n}\n```\n\nTo test\
    \ this class, create a new class like in Listing 13.2. Note that each method should\
    \ have at least one test method.\n\n# Listing 13.2: A test class\n\n```\npackage\
    \ com.example.util;\npublic class MyUtilityTest {\n\n    public void testMethod1()\
    \ {\n        MyUtility utility = new MyUtility();\n        int result = utility.method1(100,\
    \ 200);\n        // assert that result equals the expected value\n}\n```"
  merge: -1
  pgno: 345
- img_proc: true
  md: "```\npublic void testMethod2() {\n    MyUtility utility = new MyUtility();\n\
    \    long result = utility.method2(100L);\n    // assert that result equals the\
    \ expected value\n}\n```\n\nThe convention is to name your test class the same\
    \ name as the SUT suffixed with Test. Therefore, the test class for MyUtility\
    \ should be named MyUtilityTest. The test class should also have the same package\
    \ as the SUT, to allow the former to access the protected and default members\
    \ of the latter. However, test classes should be placed in a separate source folder\
    \ than the classes they test.\n\nA test method does not have a return value. In\
    \ it you instantiate the class to be tested, invoke the method to be tested and\
    \ verify the result. To make writing test classes easier, you should use a framework,\
    \ such as JUnit or TestNG. This chapter presents examples written with JUnit,\
    \ the de facto standard unit test framework for Java."
