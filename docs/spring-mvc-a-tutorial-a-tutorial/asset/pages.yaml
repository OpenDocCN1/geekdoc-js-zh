    \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\
    \n     xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n     xmlns:p=\"\
    http://www.springframework.org/schema/p\"\n     xmlns:mvc=\"http://www.springframework.org/schema/mvc\"\
    \n     xmlns:context=\"http://www.springframework.org/schema/context\"\n     xsi:schemaLocation=\"\
    http://www.springframework.org/schema/beans\n     http://www.springframework.org/schema/beans/spring-beans.xsd\n\
    \     http://www.springframework.org/schema/mvc\n     http://www.springframework.org/schema/mvc/spring-mvc.xsd\n\
    \     http://www.springframework.org/schema/context\n     http://www.springframework.org/schema/context/spring-context.xsd\"\
    >\n\n  <context:component-scan base-package=\"controller\" />\n  <mvc:annotation-driven\
    \ />\n  <mvc:resources mapping=\"css/**\" location=\"/css/\" />\n  <mvc:resources\
    \ mapping=\"*.html\" location=\"/\" />\n  <mvc:resources mapping=\"image/**\"\
    \ location=\"/image/\" />\n\n  <bean id=\"viewResolver\"\n        class=\"org.springframework.web.servlet.view.InternalResourceViewResolver\"\
    >\n        <property name=\"prefix\" value=\"WEB-INF/jsp/\" />\n        <property\
    \ name=\"suffix\" value=\".jsp\" />\n  </bean>\n\n  <bean id=\"multipartResolver\"\
    \n        class=\"org.springframework.web.multipart.CommonsMultipartResolver />\n\
    \  </bean>\n</beans>\n```\n\nYou can use the maxUploadSize property of the multipartResolver\
    \ to set the maximum file size that will be accepted. Without this property, there\
    \ is no maximum size. Setting restriction on the file size does not mean you can\
    \ upload any size. A very large file will take a long time to upload and cause\
    \ the server to time out. To handle very large files, you can slice the file using\
    \ the HTML5 File API and upload each chunk separately."
