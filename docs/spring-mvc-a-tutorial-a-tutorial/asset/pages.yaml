  md: '# The input Tag


    The input tag renders <input type="text"> element. The most important attribute
    of this tag, the path attribute, binds this input field to a property of the form-backing
    object. For example, the commandName attribute of the enclosing <form> tag is
    assigned book and the path attribute of the input tag is given the value isbn,
    the input tag will be bound to the isbn property of the Book object.


    Table 5.3 shows all the attributes in the input tag. All attributes in Table 5.3
    are optional and the table does not include HTML attributes.


    | Attribute | Description |

    |---|---|n| cssClass | Specifies the CSS class to be applied to the rendered input
    element. |

    | cssStyle | Specifies the CSS style to be applied to the rendered input element
    |

    | CssErrorClass | Specifies the CSS class to be applied to the rendered input
    element if the bound property contains errors, overriding the value of the CssAttribute.
    |

    | htmlEscape | Accepts true or false indicating whether or not the rendered value(s)
    should be HTML-escaped. |

    | path | The path to the property to bind. |


    **Table 5.3: The input tag''s attributes**


    As an example, this input tag is bound to the isbn property of the form-backing
    object.


    ```

    <input id="isbn" path="isbn" cssErrorClass="errorBox"/>

    ```


    This will be rendered as the following <input> element:


    ```

    <input type="text" id="isbn" name="isbn"/>

    ```


    The cssErrorClass has no effect unless there is an input validation error in the
    isbn property and the same form is used to redisplay the user input, in which
    case the input tag will be rendered as this input element.


    ```

    <input type="text" id="isbn" name="isbn" class="errorBox"/>

    ```


    The input tag can also be bound to a property in a nested object. For example,
    the following input is bound to the id property of the category property of the
    form-backing object.


    ```

    <form:input path="category.id"/>

    ```'
  merge: -1
  pgno: 126
