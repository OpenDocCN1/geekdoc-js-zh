- img_proc: true
  md: 'protocol://IP address[:port][/context][/resource]?[?query string | path variable]


    The parts in square brackets are optional, therefore a URL can be as simple as
    http://yahoo.co or http://192.168.1.9. An Internet Protocol (IP) address, by the
    way, is a numerical label assigned to a computer or other device. In other words,
    instead of typing http://google.com, a domain, use its IP address: http://173.194.46.35.
    To find out the IP address of a domain, use the ping program on your computer
    console:


    ```

    ping google.com

    ```


    An address is hard to remember, so people prefer to use the domain. A computer
    may host more than one domain, so multiple domains have the same IP address. And,
    did you know you can''t buy example.com or example.org because they are reserved
    for documentation purpose?


    The host of a URL may represent and identify a different location on the Internet
    or intranet. For instance, http://yahoo.com (no host) brings you to a different
    location than http://mail.yahoo.com (with a host). Over the years www has been
    the most popular host name and become the default. Normally, however, .domainName
    mapped to http://domainName.


    80 is the default port of HTTP. Therefore, if a web server runs on port 80, you
    don''t need the port number to reach the server. Sometimes, a web server doesn''t
    run on port 80 and you need to type the port number. For example, Tomcat by default
    runs on port 8080 so you need to supply the port number when requesting a resource:


    ```

    http://localhost:8080/index.html

    ```


    localhost is a reserved name typically used to refer to the local computer, i.e.
    the same computer we browser is running on.


    The context of a URL refers to the application name, but this is also optional.
    A web server can run multiple contexts (applications) and one of them can be configured
    to be the default context. To request a resource in the default context, you skip
    the context in a URL.


    Finally, a context can have one or more default resources (ordinarily index.html
    or index.htm or default.htm). A URL without a resource is considered to identify
    a default resource. Of course, if more than one default resource exists in a context,
    the one with the highest priority will always be returned when a client does not
    specify a resource


    After a resource name comes one or more query string or path variable. A query
    string is a key/value pair that can be passed to the server to be processed. Two
    query strings are separated by an ampersand (&). A path variable is like a query
    string, but contains only the value part. Two path variables are separated with
    a forward slash (/).


    The following subsections discuss HTTP requests and responses in more detail.'
  merge: -1
