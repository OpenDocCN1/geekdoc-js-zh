  md: '# Writing A Basic Servlet Application


    Writing a servlet application is surprisingly easy. All you have to do is create
    a directory structure and place your servlet classes in a certain directory.


    In this section you''ll learn how to write a simple servlet application named
    servletapi1. Initially it will contain one servlet, MyServlet, which sends a greeting
    to the user.


    You need a servlet container to run your servlets. Tomcat, an open source servlet
    container, is available free of charge and runs on any platform where Java is
    available. Appendix A, “Tomcat” shows how to install Tomcat and manage it outside
    an IDE.'
  merge: -1
