  md: "# # Using Test Doubles\n\nThe system under test (SUT) seldom lives in isolation.\
    \ Often in order to test a class, you need dependencies. In test speak, dependencies\
    \ that your SUT need are called collaborators.\n\nCollaborators are often replaced\
    \ by other objects test doubles. Test double is a term coined by Gerard Meszaros\
    \ in his book xUnit Patterns: Refactoring Test Code. His explanation can be found\
    \ in this web page:\n\n```\nhttp://xunitpatterns.com/Test%20Double.html\n```\n\
    \nThere are several reasons for using test doubles.\n\n+   * The real dependencies\
    \ are not ready yet at the time of writing the class.\n* Some dependencies, such\
    \ as HttpServletRequest and HttpServletResponse objects, are obtained from the\
    \ servlet container. It would be time-consuming to create these objects yourself.\n\
    * Some dependencies are slow to start and initialize. For example, DAO objects\
    \ that access the database can be too slow for a unit test.\n\nTest doubles are\
    \ used extensively in unit testing, even though they are in integration testing\
    \ too. There exist many frameworks for creating test doubles. Even Spring has\
    \ its own classes for creating test doubles.\n\nA mocking framework can be used\
    \ to create test doubles and verify your code behavior. Here are some popular\
    \ frameworks.\n\n+   * Mockito\n* EasyMock\n* jMock\n\nIn addition to the libraries\
    \ above, Spring also ships with classes for creating mock objects. You will learn\
    \ to use Spring classes to unit test Spring MVC controllers in the next section.\
    \ In this section, you learn to Mockito.\n\nNo direct download is available for\
    \ Mockito, so you have to use Maven. However, the sample project for this chapter\
    \ includes the Mockito distribution (a mockito.jar file) and its dependency, an\
    \ objenesis.jar file.\n\nTo download Mockito using Maven, add the following dependency\
    \ to your pom.xml file.\n\n```\n<dependency>\n  <groupId>org.mockito</groupId>\n\
    \  <artifactId>mockito-core</artifactId>\n  <version>2.0.43-beta</version>\n \
    \ <type>pom</type>\n</dependency>\n```"
