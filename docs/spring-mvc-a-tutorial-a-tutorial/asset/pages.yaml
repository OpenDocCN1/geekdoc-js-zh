  md: 'Then, in your method signature, add an identically named variable annotated
    with @PathVariable. Take a look at the signature of viewProduct in Listing 4.11.
    When the method is invoked, the id value in the request URL will be copied to
    the path variable and can be used in the method. The type of a path variable does
    not need to be String. Spring MVC will be discussed in detail in Chapter 5, “Data
    Binding and the Form Tags."


    You can use multiple path variables in your request mapping. For example, the
    following defines two path variables, userId and orderId.


    ```

    @RequestMapping(value = "view-product/{userId}/{orderId}")

    ```


    To test the path variable in the viewProduct method, direct your browser to this
    URL.


    ```

    http://localhost:8080/annotated2/view-product/1

    ```


    There is a slight problem when employing variables: in some cases it may be confusing
    to the browser. Consider the following URL..


    ```

    http://example.com/context/abc

    ```


    The browser will think (correctly) that abc is the context. Any relative reference
    to a static file, such as this, will be resolved using http://example.com/context
    as the base. This is to say, if the page sent by the server contains this img
    element


    ```

    <img src="logo.png">

    ```


    The browser will look for logo.png in http://example.com/context/logo.png.


    However, note that if the same application is deployed as the default context
    (where the path to the default context is an empty string), the URL for the same
    target would be:


    ```

    http://example.com/abc

    ```


    Now, consider the following URL that carries a path variable in an application
    deployed to the default context:


    ```

    http://example.com/abc/1

    ```


    In this case, the browser will think abc is the context, not the. If you refer
    to <img src="logo.png"/> in your page, the browser will look for the image in
    http://example.com/abc/logo.png and it won’t find the image.


    Lucky for us there is an easy solution, i.e. by using the JSTL url tag. (JSTL
    is discussed in Chapter 8, “JSTL.”) The tags fix the issue by correctly resolving
    the URL. For example, all CSS imports in the JSP pages annotated2 have been changed
    to


    ```

    <style type="text/css">@import url(css/main.css);</style>

    ```'
