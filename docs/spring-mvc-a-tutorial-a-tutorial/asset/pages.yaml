  md: "# Disabling Scripting Elements\n\nWith the advance of the Expression Language\
    \ in JSP 2.0, the recommended practice is to use the EL to access server-side\
    \ objects and not to write Java code in JSP pages. For this reason, starting JSP\
    \ 2.0 scripting elements may be disabled by defining a **scripting-invalid** element\
    \ within <jsp-property-group> in the deployment descriptor. The **jsp-property-group**\
    \ element must be nested within <jsp-config>.\n\n```\n<jsp-config>\n  <jsp-property-group>\n\
    \    <url-pattern>*.jsp</url-pattern>\n    <scripting-invalid>true</scripting-invalid>\n\
    \  </jsp-property-group>\n</jsp-config>\n```"
  merge: -1
  pgno: 461
- img_proc: true
  md: '# Actions


    Actions are the third type of syntactic element. They are translated into Java
    code that performs an operation, such as accessing a Java object or invoking a
    method. This section discusses standard actions that must be supported by all
    JSP containers. In addition to standard actions, you can also create custom tags
    that perform certain operations.


    The following are some of the standard actions.'
  merge: -1
  pgno: 462
- img_proc: true
  md: "# useBean\n\nThis action creates a scripting variable associated with a Java\
    \ object. It was one of the earliest efforts to separate presentation and business\
    \ logic. Thanks to other technologies such as tags and the Expression Language,\
    \ useBean is rarely used.\n\nAs an example, the useBeanTest.jsp page in Listing\
    \ D.9 creates an instance of java.util.Date and associates it with scripting variable\
    \ today, which then be used in an an expression.\n\n+   Listing D.9: The useBeanTest.jsp\
    \ page\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>useBean</title>\n</head>\n\
    <body>\n  <jsp:useBean id=\"today\" class=\"java.util.Date\"/>\n  <%=today%>\n\
    </body>\n</html>\n```\n\nThe action will be translated into this code in Tomcat.\n\
    \n```\njava.util.Date today = null;\ntoday = (java.util.Date) _jsp_page_context.getAttribute(\"\
    today\",\njavax.servlet.jsp.PageContext.REQUEST_SCOPE);\nif (today == null) {\n\
    \  today = new java.util.Date();\n  _jsp_page_context.setAttribute(\"today\",\
    \ today,\n  javax.servlet.jsp.PageContext.REQUEST_SCOPE);\n}\n```\n\nRunning this\
    \ page prints the current date and time in your browser."
  merge: -1
  pgno: 463
- img_proc: true
  md: "setProperty action getProperty\nThe setProperty action sets a property in a\
    \ Java object and getProperty prints a object's property. As an example, the getPropertyTest.jsp\
    \ page in Listing D.11 sets and gets the firstName property of an instance of\
    \ the Employee class, defined in Listing D.10.\n\n# Listing D.10: The Employee\
    \ class\n\n```\npackage jspdemo;\npublic class Employee {\n    private String\
    \ id;\n    private String firstName;\n    private String lastName;\n\n    public\
    \ String getId() {\n        return id;\n    }\n\n    public void setId(String\
    \ id) {\n        this.id = id;\n    }\n\n    public String getFirstName() {\n\
    \        return firstName;\n    }\n\n    public void setFirstName(String firstName)\
    \ {\n        this.firstName = firstName;\n    }\n\n    public String getLastName()\
    \ {\n        return lastName;\n    }\n\n    public void setLastName(String lastName)\
    \ {\n        this.lastName = lastName;\n    }\n}\n```\n\n# Listing D.11: The getPropertyTest.jsp\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>getProperty and setProperty</title>\n\
    </head>\n<body>\n<jsp:Bean id=\"employee\" class=\"jspdemo.Employee\"/>\n<jsp:setProperty\
    \ name=\"employee\" property=\"firstName\" value=\"Abigail\"/>\nFirst Name: <jsp:getProperty\
    \ name=\"employee\" property=\"firstName\"/>\n</body>\n</html>\n```"
  merge: -1
  pgno: 464
- img_proc: true
  md: "The include action is used to include another resource dynamically. You can\
    \ include another JSP page, a servlet, or a static HTML page. For example, the\
    \ jspIncludeTest.jsp page in Listing D.12 uses the include action to include the\
    \ menu.jsp page.\n\n# Listing D.12: The jspIncludeTest.jsp page\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>Include action</title>\n</head>\n<body>\n<jsp:include\
    \ page=\"jsp/menu.jsp\">\n  <jsp:param name=\"text\" value=\"How are you?\"/>\n\
    </jsp:include>\n</body>\n</html>\n```\n\nIt is important that you understand the\
    \ difference between the include directive and the include action. With the include\
    \ directive, inclusion occurs at page translation time, i.e. when the JSP container\
    \ translates the page into a generated servlet. With the include action, inclusion\
    \ occurs at request time. As such, you can pass parameters using the include action,\
    \ but not the include directive.\n\nThe second difference is that with the include\
    \ directive, the file extension of the included resource does not matter. With\
    \ the include action, the file extension must be jsp for it to be processed as\
    \ a JSP page. Using jspf in the include action, for example, will make the JSP\
    \ segment be treated as a static file."
  merge: -1
  pgno: 465
- img_proc: true
  md: "# forward\n\nthe forward action forwards the current page to a different resource.\
    \ For example, the following forward action forwards the current page to the login.jsp\
    \ page. \n\n```\n<jsp:forward page=\"jspf/login.jsp\">\n<jsp:param name=\"text\"\
    \ value=\"Please login\"/>\n</jsp:forward>\n```\n\nError Handling is well supported\
    \ in JSP. Java code can be handled using the try statement, however you can also\
    \ specify a page that will be displayed any of the pages in the application encounters\
    \ an uncaught exception. In such events, your users will see a well designed page\
    \ that explains what happened, and not an error message that makes them frown.\n\
    \nYou make a JSP page error by using the isErrorPage attribute directive. The\
    \ value of the attribute must be true. Listing D.13 such an error handler.\n\n\
    # Listing D.13: the errorHandler.jsp page\n\n```\n<@page isErrorPage=\"true\"\
    >\n<!DOCTYPE html><html>\n<head><title>Error</title></head>\n<body>\nAn error\
    \ has occurred. <br/>\nError message:\n<%\nout.println(exception.toString());\n\
    %>\n</body>\n</html>\n```\n\nOther pages that need protection against uncaught\
    \ exceptions will have to use the errorPage attribute of the page directive, citing\
    \ the path to the error handling page as the value. For example, the buggy.jsp\
    \ page in Listing D.14 uses the error handler in Listing D.13.\n\n# Listing D.14:\
    \ The buggy.jsp page\n\n```\n<@page errorPage=\"errorHandler.jsp\">\nDeliberately\
    \ throw an exception\n<%%\nInteger.parseInt(\"Throw me\");\n%>\n```\n\nIf you\
    \ run the buggy.jsp page, it will throw an exception. However, you will not see\
    \ an error message generated by the servlet/JSP container. Instead, the content\
    \ of the errorHandler.jsp page is displayed."
  merge: -1
  pgno: 466
- img_proc: true
  md: '# Summary


    JSP is the second technology for building web applications in Java, invented to
    complement Servlet technology and not to replace it. Well designed Java web applications
    use both servlets and JSP.


    In this appendix you''ve learned how JSP works and how to write JSP pages. By
    now, you should know all there is to know about the implicit objects and be able
    to use the three syntactic elements that can be present in a JSP page, directives,
    scripting elements, and actions.'
