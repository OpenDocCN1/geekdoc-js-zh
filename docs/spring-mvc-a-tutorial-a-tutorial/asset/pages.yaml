  md: '# HTTP Servlets


    Most, if not all, servlet applications you write will work with HTTP. This means,
    you can make use of the features offered by HTTP. The javax.servlet.http package
    is the second package in the Servlet API that contains classes and interfaces
    for writing servlet applications. Many of the types in javax.servlet.http override
    those in javax.servlet.


    Figure C.5 shows the main types in javax.servlet.http.


    ![](img/9df6b4b4bce0bca1a5859c20a724e196_423_0.png)


    Figure C.5: The more important members of javax.servlet.'
