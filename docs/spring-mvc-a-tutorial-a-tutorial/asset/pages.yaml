  md: 'mapping elements. a locale-encoding-mapping element maps a locale name with
    an encoding and contains an encoding element. The value for <locale> must be either
    a language-code defined in ISO 639, such as “en”, or a language-code_country-code,
    such as “en_US”. When a language-code_country-code is used, the country-code part
    must be one of the country codes defined in ISO 3166.


    For instance, there is a locale-encoding-mapping-list that contains a locale-encoding-mapping
    that maps the Japanese language to Shift_JIS encoding.


    ```

    <locale-encoding-mapping-list>

    <locale-encoding-mapping>

    <locale>ja</locale>

    <encoding>Shift_JIS</encoding>

    </locale-encoding-mapping>

    </locale-encoding-mapping-list>

