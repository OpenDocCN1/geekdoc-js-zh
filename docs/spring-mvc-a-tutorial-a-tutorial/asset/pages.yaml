  md: '# Unit Testing Spring MVC Controllers


    You have learned how to test individual classes in a Spring MVC application. Controllers
    are a bit different because they normally interact with Servlet API objects such
    as HttpServletRequest, HttpServletResponse, HttpSession, etc. In many cases you
    will need to mock these objects to test your controllers properly.


    Frameworks like Mockito or EasyMock are general-purpose mocking frameworks that
    can mock any Java objects. You have to configure the generated objects yourself
    (using a series of when statements). Spring-Test mock objects are specially built
    for working with Spring and resemble the real objects much closer and are easier
    to use.


    The following subsections discuss some of the more important types for unit testing
    controllers.'
