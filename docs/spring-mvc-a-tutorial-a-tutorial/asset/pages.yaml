  md: '# # Appendix D

    # JavaServer Pages


    There are two drawbacks associated with servlets. First, all HTML tags written
    in a servlet must be enclosed in Java strings, making sending HTTP response a
    tedious effort. Second, all text and HTML tags are hardcoded; as, even minor changes
    to the presentation layer, such as changing a background color, require recompilation.


    JavaServer Pages (JSP) solves the two problems in servlets. JSP does not replace
    Servlet, though. Rather, it complements it. Modern Java web applications use both
    servlets and JSP pages. The latest version of JSP at the time of writing is 2.3.


    JSP can be written in standard syntax or XML syntax. JSP pages written in XML
    syntax are called JSP documents. JSP in XML syntax is very rarely used and is
    not covered here. In this appendix you will learn JSP in standard syntax.


    This appendix starts with an overview of JSP and discusses comments, implicit
    objects and three syntactic elements (directives, scripting elements, and actions).
    Error handling is covered towards the end of this appendix.


    # Note


    Good design says that you should not write Java code in JSPs, unless your application
    will only consist of one or two simple JSP pages and will never grow. Instead,
    you should embrace Model 2, which dictates that JSP pages be used only for displaying
    values in Java objects.'
  merge: -1
  pgno: 438
