  md: "# Dependency Injection with @Autowired and @Service\n\nOne of the benefits\
    \ of using injection in a Spring MVC application is that you get dependency injection\
    \ for free. After all, Spring started as a dependency injection container. The\
    \ easiest way to inject a dependency to a Spring MVC controller is by annotating\
    \ a field or method with @Autowired. The AutAutowired annotation type belongs\
    \ to the org.springframework.beans.factory.annotation package.\n\nIn order for\
    \ a dependency to be found, its class must be annotated with @Service. A member\
    \ of the org.springframework.stereotype package, the Service annotation type indicates\
    \ that the annotated class is a service. In addition, in your configuration file\
    \ you need to add a <component-scan> to scan the base package for your dependencies.\n\
    \n```\n<context:component-scan base-package=\"dependencyPackage\"/>\n```\n\nAs\
    \ an example of dependency injection in a Spring MVC, consider another example,\
    \ the annotated2 application. The ProductController class in the annotated2 application\
    \ (See Listing 4.6) has been modified from the identically named class in annotated1.\n\
    \n# Listing 4.6: The ProductController class in annotated2\n\n```\npackage controller;\n\
    import java.math.BigDecimal;\nimport org.apache.commons.logging.Log;\nimport org.apache.commons.logging.LogFactory;\n\
    import org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Controller;\n\
    import org.springframework.web.ui.Model;\nimport org.springframework.web.bind.annotation.PathVariable;\n\
    import org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RequestMethod;\n\
    import org.springframework.web.servlet.support.RedirectAttributes;\nimport domain.Product;\n\
    import form.ProductForm;\nimport service.ProductService;\n\n@Controller\npublic\
    \ class ProductController {\n\n    private static final Log logger = LogFactory\n\
