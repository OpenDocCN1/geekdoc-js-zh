  md: '# Implicit Objects


    The servlet container passes several objects to the servlets it is running. For
    instance, you get an HttpServletRequest and an HttpServletResponse in the servlet''s
    service method and a ServletConfig in the init method. In addition, you can obtain
    an HttpSession by calling getSession on the HttpServletRequest object.


    In JSP you can retrieve these objects by using implicit objects. Table D.1 lists
    the objects.


    | Object | Type |

    |---|---|

    | request | javax.servlet.http.HttpServlet |

    | response | javax.servlet.http.HttpServletResponse |

    | out | javax.servlet.jsp.JspWriter |

    | session | javax.servlet.http.HttpSession |

    | application | javax.servlet.ServletContext |

    | config | javax.servlet.ServletConfig |

    | pageContext | javax.servlet.jsp.PageContext |

    | page | javax.servlet.jsp.JspPage |

    | exception | java.lang.Throwable |


    Table D.1: JSP Implicit Objects


    For example, the request implicit object represents the HttpServletRequest passed
    by the servlet/JSP container to the servlet''s service method. You can use request
    as if it was a variable reference to the HttpServletRequest. For instance, the
    following code retrieves the userName parameter from the HttpServletRequest object.


    ```

    String userName = request.getParameter("userName");

    ```


    pageContext refers to the javax.servlet.jsp.PageContext created for the page.
    It provides useful context information and access to various servlet-related objects
    via its self-explanatory methods, such as getRequest, getResponse, getServletContext,
    getServletConfig, and getSession. These methods are not very useful in scriptlets
    since the objects they return can be accessed more directly through the implicit
    objects request, response, session and application. However, the PageContext allows
    those objects to be'
  merge: -1
  pgno: 445
- img_proc: true
  md: 'accessed using the Expression Language.


    Another set of interesting methods offered by PageContext are those for getting
    and setting attributes, the getAttribute and setAttribute methods. Attributes
    can be stored in one of four scopes: page, request, session and application. The
    page scope is the narrowest scope and attributes are here available in the same
    JSP page. The request scope refers to the current HttpServlet, the session scope
    the current HttpSession, and the application scope the ServletContext.


    The setAttribute method in PageContext has the following signature:


    ```

    public abstract void setAttribute(java.lang.String name, java.lang.Object value,
    int scope)

    ```


    The value of scope can be one of the following static final ints in PageContext:
    PAGE_SCOPE, REQUEST_SCOPE, SESSION_SCOPE, and APPLICATION_SCOPE.


    Alternatively, to store an attribute in the page scope, you can use this setAttribute
    overload:


    ```

    public abstract void setAttribute(java.lang.String name, java.lang.Object value)

    ```


    For example, the following scriptlet stores an attribute in the ServletRequest


    ```

    // product is a Java object

    pageContext.setAttribute("product", product, pageContext.REQUEST_SCOPE);

    ```


    The Java code above has the same effect as:


    ```

    request.setAttribute("product", product);

    ```


    The implicit object references a javax.servlet.jsp.JspWriter, which is similar
    to the java.io.PrintWriter you get from calling getWriter() on the HttpServletResponse.
    You can call its print method overloads as you would use a PrintWriter to send
    messages to the browser. For instance:


