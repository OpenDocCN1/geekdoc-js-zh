  md: '# Conditional Actions


    Conditional actions are used to deal with situations in which the output of a
    page depends on the value of certain input, which in Java are solved using **if,
    if ... else, and switch** statements.


    There are four tags that perform conditional actions in JSTL: **if, choose, when,
    and otherwise.** Each will be discussed in a section below.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# The if Tag


    The if tag tests a condition and processes its body content if the condition evaluates
    to true. The test result is stored in a Boolean object, a scoped variable is created
    to reference the Boolean object. You specify the name of the scoped variable using
    the var attribute and the scope in the scope attribute.


    The syntax of if has two forms. The first form has no body content:


    ```

    <c:if test="testCondition" var="varName"

    scope=${page|request|session|application}">

    ```


    In this case, normally the scoped object specified by var will be tested by some
    other tag at a later stage in the same JSP.


    The second form is used with a body content:


    ```

    <c:if test="testCondition" var="varName"

    scope=${page|request|session|application|}

    body content

    </c:if>

    ```


    The body content is JSP and will be processed if the test condition evaluates
    to true. The list of the if tag''s attributes is given in Table 9.5.


    | Attribute | Type | Description |

    |---|---|---|

    | test+ | Boolean | The test condition that determines any existing body content
    should be processed |

    | var | String | The name of the scoped variable that references the value of
    the test condition; the type of var is Boolean |

    | scope | String | The scope of the scoped variable specified by var |


    Table 9.5: The if tag''s attributes


    For example, the following if tag displays “You logged in successfully” if there
    exists a request parameter named user and its value is ken and there exists a
    request parameter named password and its value is blackjack:


    ```

    <c:if test="${param.user=''ken'' && param.password=''blackcomb''}>

    You logged in successfully.

    </c:if>

    ```


    To simulate else, use if tags with conditions that are opposite. For instance,
    the following snippet displays “You logged in successfully” if the user and password
    parameters are ken and blackjack, respectively. Otherwise, it displays “Login
    failed.”


    ```

    <c:if test="${param.user=''ken'' && param.password=''blackcomb''}>

    You logged in successfully.

    </c:if>

    ```'
