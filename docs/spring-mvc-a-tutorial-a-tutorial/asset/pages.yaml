  md: "# The parseNumber Tag\n\nYou use parseNumber to parse a string representation\
    \ of a number, a currency, or a percentage in a locale-sensitive format into a\
    \ number. The syntax has two forms. The first form is used without body content:\n\
    \n```\n<fmt:parseNumber value=\"numericValue\"\n  [type=\"number|currency|percent\"\
    ]\n  [pattern=\"customPattern\"]\n  [parselocaleparseLocale\"]\n  [integerOnly={true|false}]\n\
    \  [var=\"varName\"]\n  scope=\"page|request|session|application\"]\n/>\n```\n\
    \nThe second form is used with body content:\n\n```\n<fmt:parseNumber type=\"\
    number|currency|percent\">\n  [pattern=\"customPattern\"]\n  [parselocale=parseLocale\"\
    ]\n  [integerOnly={true|false}]\n  [var=\"varName\"]\n  scope=\"page|request|session|application\"\
    ]>\n  numeric value to be parsed\n</fmt:parseNumber>\n```\n\nThe body content\
    \ is JSP. The parseNumber tag's attributes are given in Table 9.14.\n\nAs an example,\
    \ the following parseNumber tag parses the value referenced by the scoped quantity\
    \ and stores the result in the formattedNumber variable.\n\n```\n<fmt:parseNumber\
    \ var=\"formattedNumber\" type=\"number\"\n  value=\"${quantity}\"/>\n```\n\n\
    | Attribute | Type | Description |\n| --- | --- | --- |\n| value+ | String | String\
    \ to be parsed |\n| type+ | String | Indicates whether the string to be parsed\
    \ is parsed as a number, currency, or percentage |\n| pattern+ | String | Custom\
    \ formatting pattern that determines how the string in the value attribute is\
    \ to be parsed |\n| parseLocale+ | String or java.util.Locale | Locale whose default\
    \ formatting pattern is to be used during the parse operation, or to which the\
    \ pattern specified via the pattern attribute is applied |\n| integerOnly+ | Boolean\
    \ | Indicates whether only the integer portion of the given value should be parsed\
    \ |"
  merge: -1
  pgno: 275
- img_proc: true
