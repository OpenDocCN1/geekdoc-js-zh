  md: "# Dependency Injection\n\nPeople have been using dependency injection in the\
    \ past decade as a solution to, among others, code testability. In fact, dependency\
    \ injection is behind great frameworks such as Spring MVC and Struts 2. So, what\
    \ is dependency injection?\n\nMartin Fowler wrote an excellent article on this\
    \ subject:\n\n```\nhttp://martinfowler.com/articles/injection.html\n```\n\nBefore\
    \ Fowler coined the term \"dependency injection,\" the phrase \"inversion of control\"\
    \ was often used to mean the same thing. As Fowler notes in his article, the two\
    \ are not exactly the same.\n\nIf you have two components, A and B, and A depends\
    \ on B, you can say A is dependent on B or B is a dependency of A. Suppose A has\
    \ a method, importantMethod, that uses B as defined in the following code fragment:\n\
    \n```\npublic class A {\n    public void importantMethod() {\n        B b = ...\
    \ // get an instance of B\n        b.usefulMethod();\n    }\n}\n```\n\nA must\
    \ obtain an instance of B before it can use B. While it is straightforward as\
    \ using the new keyword if B is a Java concrete class, it can be problematic if\
    \ B is not and there are various implementations of B. You will have to choose\
    \ an implementation of B and by doing so you ensure the reusability of A because\
    \ you cannot use A with implementations of B that you did not choose.\n\nAs an\
    \ example, consider the appdesign4 application that illustrates the use of a home-made\
    \ dependency injector. In real-world applications, you should use Spring inject.\n\
    \nThe sample application is used to generate PDFs. It has two actions, form and\
    \ pdf. The first does not have an action class and simply forwards to a form that\
    \ can be used to enter some text. The second generates a PDF file and uses a PDFAction\
    \ class. The action class itself relies on a service class that generates the\
    \ PDF.\n\nThe PDFAction and PDFService classes are given in Listing 2.11 and Listing\
    \ 2.12, respectively.\n\nListing 2.11: The PDFAction class\n\n```\npackage action;\n\
    import service.PDFService;\n\npublic class PDFAction {\n    private PDFService\
    \ pdfService;\n```"
  merge: -1
