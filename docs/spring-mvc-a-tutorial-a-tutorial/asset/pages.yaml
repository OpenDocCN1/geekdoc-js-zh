  md: '# # Running A Unit Test


    Eclipse or STS know if a class is a JUnit test class. To run a test class, right-click
    on the test class in the Package Explorer, and then select **Run As > JUnit Test**.
    Alternatively, open the test class with an editor and press **Ctrl+F11**.


    When a test is complete, Eclipse or STS will open the JUnit view if it is not
    already open. If the unit test completes successfully, you will see a green bar
    in the JUnit view as shown in Figure 13.1.


    ![](img/9df6b4b4bce0bca1a5859c20a724e196_351_0.png)


    Figure 13.1: A successful test


    If one of the tests failed, you will see a red bar like the one in Figure 13.2.


