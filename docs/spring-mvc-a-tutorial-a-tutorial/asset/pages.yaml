  md: '# The errors Tag


    The **errors** tag renders one or more HTML **span** element that each contains
    a field error message. This tag can be used to display a specific field error
    or all field errors.


    The attributes of the **errors** tag are listed in Table 5.14. All attributes
    are optional and the table does not include HTML attributes that may appear in
    the HTML **span** elements.


    | Attribute | Description |

    | --- | --- |

    | cssClass | Specifies the CSS class to be applied to the rendered input element.
    |

    | cssStyle | Specifies the CSS style to be applied to the rendered input element
    |

    | delimiter | Delimiter for separating multiple error messages. |

    | element | Specifies an HTML element to enclose the error messages. |

    | htmlEscape | Accepts true or false indicating whether or not the rendered value(s)
    should be HTML-escaped. |

    | path | The path to the errors object to bind. |


    Table 5.14: The errors tag''s attributes


    For example, this **errors** tag path="*" displays all field errors.


    ```

    <form:errors path="*/>

    ```


    The following **errors** tag displays a field error associated with the **author**
    property of the form-backing object.


    ```

    <form:errors path="author"/>

    ```'
