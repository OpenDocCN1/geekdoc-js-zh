  md: '# ServletContext


    The ServletContext represents the servlet application. There is only one context
    per web application. In a distributed environment where an application is deployed
    simultaneously to multiple containers, there is one ServletContext object per
    Java Virtual Machine.


    You can obtain the ServletContext by calling the getServletContext method on the
    ServletConfig. In addition, there is also a getServletContext method in ServletRequest,
    which returns the same ServletContext.


    The ServletContext is there so that you can share information that can be accessed
    from all resources in the application and to enable dynamic registration of web
    objects. The former is done by storing objects in an internal Map within the ServletContext.
    Objects stored in ServletContext are called attributes.


    The following methods in ServletContext deal with attributes:


    ```

    java.lang.Object getAttribute(java.lang.String name)

    java.util.Enumeration<java.lang.String> getAttributeNames()

    void setAttribute(java.lang.String name, java.lang.Object object)

    void removeAttribute(java.lang.String name)

    ```'
