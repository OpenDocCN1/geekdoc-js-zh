  md: '# The [ ] and . Operators


    An EL expression can return any type. If an EL expression results in an object
    that has a property, you can use the [ ] or . operators to access the property.
    The [ ] and . operators function similarly; [ ] is a more generalized form, .
    provides a nice shortcut.


    To access an object''s property, you can use one of the following forms.


    ```

    ${object["propertyName"]}

    ${object.propertyName}

    ```


    However, you can only use the [ ] operator if propertyName is not a valid Java
    variable name. For instance, the following EL expressions can be used to access
    the HTTP header header["host"]


    ```

    ${header["host"]}

    ${header.host}

    ```


    However, to access the accept-language header, you can only use the [ ] operator
    because accept-language is not a legal Java variable name. Using the . operator
    to access it will cause an exception to be thrown.


    If an object''s property happens to return another object that in turn has a property,
    you can use either [ ] or . to access the property of the second object. For example,
    the pageContext implicit object represents the PageContext object of the current
    JSP. The request servletPath property, which represents the HttpServletRequest.
    The HttpServletRequest servletPath property of the EL expressions are equivalent
    and result in the value of the servletPath property of the HttpServletRequest
    in pageContext:


    ```

    ${pageContext["request"]["servletPath"]}

    ${pageContext.request["servletPath"]}

    ${pageContext.request.servletPath}

    ${pageContext["request"].servletPath

    ```


    To access the HttpServlet, you use this syntax:


    ```

    ${pageContext.session}

    ```


    For example, this expression prints the session identifier.


    ```

    ${pageContext.session.id}

    ```'
  merge: -1
