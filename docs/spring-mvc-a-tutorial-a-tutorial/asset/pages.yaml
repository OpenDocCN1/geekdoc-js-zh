  md: '# JSR 303 Validation


    JSR 303, “Bean Validation” (published in November 2009) and JSR 349, “Bean Validation
    1.1” (published in May 2013) specify a set of API’s for applying constraints on
    object properties through annotations. JSR 303 and JSR 349 can be downloaded from
    these URLs, respectively.


    ```

    http://jcp.org/en/jsr/detail?id=303

    http://jcp.org/en/jsr/detail?id=349

    ```


    Of course, JSR is just a specification document and of little use until someone
    writes an implementation of it. In the case of bean validation JSR’s, there are
    currently two implementations. The first is Hibernate Validator, which is currently
    at version 5 and implement both JSR 303 and JSR 349. It can be downloaded from
    this site.


    ```

    http://sourceforge.net/projects/hibernate/files/hibernate-validator/

    ```


    The second implementation, there is no validator to write. Instead, you embed
    constraints in the domain class by using JSR 303 annotation types. The list of
    constraints is given in Table 7.1


    | Constraint | Description | Example |

    |---|---|---|n| @AssertFalse | Applied to a boolean property. The value of the
    property must be false. | @AssertFalse boolean hasChildren; |

    | @AssertTrue | Applied to a boolean property. The value of the property must
    be true. | @Assert boolean isEmpty; |

    | @DecimalMax | The value of the property must be a decimal value lower than equal
    to the specified value. | @DecimalMax(“1.1”) BigDecimal price; |

    | @DecimalMin | The value of the property must be a decimal value greater than
    or equal to the specified value. | @DecimalMin(“0.04”) BigDecimal price; |

    | @Digits | The value of the property must be within the specified range. The
    integer attribute specifies the maximum integral digits for the number and the
    fraction attribute the maximum fractional digits for the number. | @Digits(integer=5,
    fraction=2) BigDecimal price; |'
  merge: -1
  pgno: 179
- img_proc: true
  md: '| | | |

    |---|---|---|n| @Future | The value of the property must be a date in the future.
    | @Future Date shippingDate; |

    | @Max | The value of the property must be an integer lower or equal to the specified
    value | @Max(150) int; |

    | @Min | The value of the property must be an integer greater than or equal to
    the specified value | @Min(0) int; |

    | @NotNull | The property must not be null | @NotNull String firstName; |

    | @Null | The property must be null | @Null String testString; |

    | @Past | The value of the property must be a date in the past. | @Past Date birthDate;
    |

    | @Pattern | The value of the property must match the specified regular expression
    | @Pattern(regex="\d{3}") String areaCode; |

    | @Size | The size of the property must be within the specified range. | Size(min=2,
    max=140) String description; |


    **Table 7.1: JSR 303 Constraints**


    Once you understand how it works, JSR 303 validation is easier to use than Spring
    validators. With Spring validators, you can overwrite error messages from a JSR
    303 validator by using property keys in this format in your properties file.


    ```

    constraint.object.property

    ```


    For example, to overwrite a message from @Size constraining the **name** property
    of a **Product** object, use this key in your properties file.


    ```

    Size.product.name

    ```


    To overwrite a message from @Past constraining the **productionDate** property
    of a **Product** object, use this key.


    ```

    Past.product.productionDate

    ```'
