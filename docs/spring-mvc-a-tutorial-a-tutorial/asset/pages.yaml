  md: '# The MultipartFile Interface


    Handling uploaded files is very easy in Spring MVC. A file uploaded to a Spring
    MVC application will be wrapped in a MultipartFile object. Your only responsibility
    is to write a domain class with a property of type MultipartFile.


    The org.springframework.web.multipart.MultipartFile interface has methods for
    getting the name and content of an uploaded file. Table 11.1 shows these methods.


    | Method | Description |

    | --- | --- |

    | getBytes | Returns the file content as a byte array. |

    | getContentType | Returns the content type of the file. |

    | getInputStream | Returns the file content as an InputStream. |

    | getName | Returns the name of the parameter in the multipart form. |

    | getOriginalFilename | Returns the original file name in the client''s local
    drive. |

    | getSize | Returns the file size in bytes as a long. |

    | isEmpty | Indicates whether or not the uploaded file is empty. |

    | tranferTo | Saves the uploaded file as a java.io.File. |


    Table 11.1: The methods in MultipartFile


    For example, to save the uploaded file, you can use the transferTo method:


    ```

    File file = new File(...);

    multipartFile.transferTo(file);

    ```


    The examples in the following sections show how you can retrieve an uploaded file
    in a controller.'
