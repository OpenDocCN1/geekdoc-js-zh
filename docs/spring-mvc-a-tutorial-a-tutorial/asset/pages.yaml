  md: "# The Deployment Descriptor and Spring MVC Configuration File\n\nNow look at\
    \ the deployment descriptor (web.xml file) in Listing 3.1\n\nListing 3.1: The\
    \ deployment descriptor for springmvc-introl\n\n```\n<xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<web-app version=\"3.1\"\nxmlns=\"http://xmlns.jcp.org/xml/ns/javaee\"\
    \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\nsxi:schemaLocation=\"\
    http://xmlns.jcp.org/xml/ns/javaee http://xmlns.jcp.org/xml/ns/javaee/web-app_3.1.xsd\"\
    >\n\n<servlet>\n  <servlet-name>springmvc</servlet-name>\n  <servlet-class>\n\
    \    org.springframework.web.servlet.DispatcherServlet</servlet-class>\n  <load-on-startup>1</load-on-startup>\n\
    </servlet>\n\n<servlet-mapping>\n  <servlet-name>springmvc</servlet-name>\n  <!--\
