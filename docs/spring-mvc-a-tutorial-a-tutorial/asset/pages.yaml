  md: "RequestMapping has other attributes besides value. For instance, the method\
    \ attribute takes a set of HTTP methods that will be handled by the corresponding\
    \ method.\n\nFor example, the processOrder method below can only be invoked with\
    \ the HTTP POST or PUT method.\n\n```\nimport org.springframework.stereotype.Controller;\n\
    import org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RequestMethod;\n\
    \n@RequestMapping(value=\"/process-order\",\n    method={RequestMethod.POST, RequestMethod.PUT})\n\
    public String processOrder() {\n\n    // do something here\n\n    return \"OrderForm\"\
    ;\n}\n```\n\nIf there is only one HTTP request method assigned to the method the\
    \ bracket is optional.\n\n```\n@RequestMapping(value=\"/process-order\", method=RequestMethod.POST)\n\
    ```\n\nIf the method attribute is not present, the request-handling method will\
    \ handle any HTTP method.\n\nThe RequestMapping annotation type can also be used\
    \ to annotate a controller class like this:\n\n```\nimport org.springframework.stereotype.Controller;\n\
    \n@Controller\n@RequestMapping(value=\"/customer\")\npublic class CustomerController\n\
    ```\n\nIn this case, method-level request mappings will be deemed the class-level\
    \ request mapping. For instance, consider the following deleteCustomer method\n\
    \n```\nimport org.springframework.stereotype.Controller;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\
    import org.springframework.web.bind.annotation.RequestMethod;\n\n@Controller\n\
    @RequestMapping(\"/customer\")\npublic class CustomerController {\n\n    @RequestMapping(value=\"\
    /delete\",\n        method={RequestMethod.POST, RequestMethod.PUT})\n    public\
    \ String deleteCustomer() {\n```"
