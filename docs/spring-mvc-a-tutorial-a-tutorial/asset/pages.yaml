  md: "# Iterator Actions\n\nIterator actions are useful when you need to iterate\
    \ a number of times or over a collection of objects. JSTL provides two tags that\
    \ perform iterator actions, forEach and forTokens, both of which are discussed\
    \ in the following sections.\n\nThe ForEach Tag iterates a body content a number\
    \ of times or iterates over a collection of objects. Objects that can be iterated\
    \ include include implementations of java.util.Collection and java.util.Map, and\
    \ arrays of objects or primitive types. You can also iterate over a java.util.Iterator\
    \ and java.util.Enumeration, but by you should not use Iterator or Enumeration\
    \ in more than one action because neither Iterator nor Enumeration will be reset.\n\
    \nThe syntax for forEach has two forms. The first form is for repeating the body\
    \ content a fixed number of times:\n\n```\n<c:forEach [var=\"varName\"] begin=\"\
    begin\" end=\"end\" step=\"step\">\n  body content\n</c:forEach>\n```\n\nThe second\
    \ form is used to iterate over a collection of objects:\n\n```\n<c:forEach items=\"\
    collection\" [var=\"varName\">\n  [varstatus=\"varStatus\"] [begin=\"begin\"]\
    \ [end=\"end\"]\n  [step=\"step\">\n  body content\n</c:forEach>\n```\n\nThe body\
    \ content is JSP. The forEach tag's attributes are given in Table 9.6.\n\n| Attribute\
    \ | Type | Description |\n| --- | --- | --- |\n| var | String | The name of the\
    \ scoped variable that references the current item of the iteration. |\n| items+\
    \ | Any of the supported type | Collections of objects to iterate over. |\n| varStatus\
    \ | String | The name of the scoped variable that holds the status of the iteration.\
    \ The value is of type javax.servlet.jsp.jstl.core.LoopTagStatus. |\n| begin+\
    \ | int | If items is specified, iteration begins at the item located at the specified\
    \ index, in which the first item of the collection has an index of 0. If items\
    \ is not specified, iteration begins with the index set at the value specified.\
    \ If specified, the value of |"
  merge: -1
  pgno: 256
- img_proc: true
  md: 'begin must be equal to or greater than zero.


    | end+ | int | If items is specified, iteration ends at the item located at the
    specified index (inclusive). If items is not specified, iteration ends when index
    reaches the value specified. |

    | step+ | int | Iteration will process every step items of the collection, starting
    with the first one. If present, the value of step must be equal to or greater
    than 1. |


    Table 9.6: The forEach Tag attributes


    For example, the following forEach displays "1, 2, 3, 4, 5".


    ```

    <c:forEach var="x" begin="1">

    <c:out value="${x}"/>

    </c:forEach>

    ```


    And, the following forEach tag iterates over the phones property of an address
    scoped variable.


    ```

    <c:forEach var="phone" items="${address.phones}">

    ${phone}<br/>

    </c:forEach>

    ```


    For each iteration, the forEach tag creates a scoped variable whose is specified
    by the var attribute. In this case, the scoped variable is named phone. The EL
    expression within the forEach tag is used to display the value of phone. The scoped
    variable is only available from the beginning and closing forEach tags, and will
    be removed before the closing forEach tag.


    The forEach tag has a varStatus variable of type javax.servlet.jsp.LoopTag. The
    LoopTag interface has the count property that returns the "count" of the current
    round of iteration. The value of status is 1 for the first iteration, 2 for the
    second iteration, and so on. By testing the remainder of status%2, you know whether
    the passing is an even-numbered or odd-numbered.


    As an example, consider the BooksServlet servlet and books.jsp in the iterator
    sample application. The BooksServlet class, presented in Listing 9.5, creates
    three Book objects in its doGet method and puts Books in a List that is then stored
    as a ServletRequest attribute. The Book class is given in Listing 9.6. At the
    end of the doGet method, the servlet forwards to the books.jsp page that iterates
    over the book collection using the forEach tag.


    Listing 9.5: The BooksServlet class


    ```

    package servlet;

    import java.io.IOException;

    import java.util.ArrayList;

    import java.util.List;

    ```'
