  md: "# Using the Deployment Descriptor\n\nAs you can see in the previous examples,\
    \ writing and deploying a servlet application is easy. One aspect of deployment\
    \ is configuring the mapping of your servlet with a path. In the examples, you\
    \ mapped a servlet with a path using the WebServlet annotation type.\n\nUsing\
    \ the deployment descriptor is another way of configuring a servlet application.\
    \ The deployment descriptor is always named web.xml and located under the WEB-INF\
    \ directory. In this appendix I show how to create a servlet application named\
    \ servletapi3 and use a web.xml file for it.\n\nThe servletapi3 has two servlets,\
    \ SimpleServlet and WelcomeServlet, and a deployment descriptor to map the servlets.\
    \ Listing C.5 and C.6 show SimpleServlet and WelcomeServlet, respectively. Note\
    \ that the servlet classes are not annotated @WebServlet. The deployment descriptor\
    \ is given in Listing C.7.\n\nListing C.5: The unannotated SimpleServlet class\n\
    \n```\npackage servletapi3;\nimport java.io.IOException;\nimport java.io.PrintWriter;\n\
    import java.servlet.ServletException;\nimport java.servlet.http.HttpServlet;\n\
    import java.servlet.http.HttpServletRequest;\nimport java.servlet.http.HttpServletResponse;\n\
    ```\n\n```\npublic class SimpleServlet extends HttpServlet {\n    private static\
    \ final long serialVersionUID = 28946L;\n\n    @Override\n    public void doGet(HttpServletRequest\
    \ request,\n                       HttpServletResponse response)\n           \
    \ throws ServletException, IOException {\n        response.setContentType(\"text/html\"\
    );\n        PrintWriter writer = response.getWriter();\n        writer.print(\"\
    <!DOCTYPE html><html><head>\" + \n                \"<html><body>Simple Servlet</body></html>\"\
    );\n    }\n}\n```\n\nListing C.6: The unannotated WelcomeServlet class\n\n```\n\
    package servletapi3;\nimport java.io.IOException;\nimport java.io.PrintWriter;\n\
    import java.servlet.ServletException;\nimport java.servlet.http.HttpServlet;\n\
    import java.servlet.http.HttpServletRequest;\nimport java.servlet.http.HttpServletResponse;\n\
    ```\n\n```\npublic class WelcomeServlet extends HttpServlet {\n    private static\
    \ final long serialVersionUID = 27126L;\n```"
