  md: "# # HttpServlet\n\nHttpServlet class overrides the javax.servlet.GenericServlet\
    \ class. When using HttpServlet, you will also work with the HttpServletRequest\
    \ and HttpServletResponse objects that represent the servlet request and the servlet\
    \ response, respectively. The HttpServletRequest interface extends javax.servlet.ServletRequest\
    \ and HttpServletResponse extends javax.servlet.ServletResponse.\n\nOverrides\
    \ the service method in GenericServlet and adds another service method with the\
    \ following signature:\n\n```\nprotected void service(HttpServletRequest request,\n\
    \    HttpServletResponse response)\n    throws ServletException, java.io.IOException\n\
    ```\n\nThe difference between the new **service method** and the one in javax.servlet.Servlet\
    \ is that the former accepts an HttpServletRequest and an HttpServletResponse,\
    \ instead of a ServletRequest and a ServletResponse.\n\nThe servlet container,\
    \ as usual, calls the original **service method** in javax.servlet.Servlet, which\
    \ in HttpServlet is written as follows:\n\n```\npublic void service(ServletRequest\
    \ req, ServletResponse res)\n    throws ServletException,\n    HttpServletRequest\
    \ request;\n    HttpServletResponse response;\n    try {\n        request = (HttpServletRequest)\
    \ req;\n        response = (HttpServletResponse) res;\n    } catch (ClassCastException\
    \ e) {\n        throw new ServletException(\"non-HTTP request or response\");\n\
    \    }\n    service(request, response);\n```\n\nThe **service method** downcasts\
    \ the request and response objects from the servlet container to HttpServletRequest\
    \ and HttpServletResponse, and call the new service method. The downcasting is\
    \ always successful because the servlet container always passes an HttpServletRequest\
    \ and an HttpServletResponse when calling a servlet’s service method, to anticipate\
    \ the use of HTTP. Even if you are implementing javax.servlet.Servlet or extending\
    \ javax.servlet.GenericServlet, you can downcast the servlet request and response\
    \ passed to the service method to HttpServletRequest and HttpServletResponse,\
    \ respectively.\n\nThe new service method in HttpServlet then examines the HTTP\
    \ method used to send the request (by calling `request.getMethod()`) and call\
    \ one of the following methods: **doGet, doPost, doGet, doPut, doTrace, doGetOptions,\
    \ and delete**. Each of the seven methods represents an HTTP method. **doGet**\
    \ and **doPost** are the most often used. As such, you rarely need to override\
    \ the service method anymore. Instead, you override **doGet** or **doPost** or\
    \ both **doGet** and **doPost**.\n\nTo summarize, there are two features in HttpServlet\
    \ that you do not find in"
