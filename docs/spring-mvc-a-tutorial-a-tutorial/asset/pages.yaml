  md: '# Scripting Elements


    The second type of JSP syntactic elements, scripting elements incorporate Java
    code into a JSP page. There are three types of scripting elements: scriptlets,
    declarations, and expressions. They are discussed in the following subsections.'
  merge: -1
  pgno: 454
- img_proc: true
  md: "# Scriptlets\n\nA scriptlet is a block of Java code. A scriptlet starts with\
    \ <% and ends with %>. For example, the scriptletTest.jsp page in Listing D.6\
    \ uses scriptlets.\n\nListing D.6: Using a scriptlet (scriptletTest.jsp)\n\n```\n\
    <@page import=\"java.util.Enumeration\">\n<!DOCTYPE html>\n<html>\n<head><title>Scriptlet\
    \ example</title></head>\n<body>\n<b>Http headers:</b><br/>\n<!-- first scriptlet\
    \ --%\n<%\nfor (Enumeration<String> e = request.getHeaderNames();\n  e.hasMoreElements();\
    \ ) {\n  String header = e.nextElement();\n  out.println(header + \": \" + request.getHeader(header)\
    \ + \"<br/>\\n}\nString message = \"Thank you.\";\n%\n<hr/>\n<%-- second scriptlet\
    \ --%>\n<%\nout.println(message);\n</body>\n</html>\n```\n\nThere are two scriptlets\
    \ in the JSP page in Listing D.6. Note that variables defined in a scriptlet is\
    \ visible to the other scriptlets below it.\n\nIt is legal for the first line\
    \ of code in a scriptlet to be in the same line as the <% tag and for the %%>\
    \ tag to be in the same line as the last line of code. However, this would result\
    \ in a less readable page."
  merge: -1
  pgno: 455
- img_proc: true
  md: "# Expressions\n\nAn expression is evaluated and its result fed to the print\
    \ method of the out implicit object. An expression starts with <%= and ends with\
    \ %>. For example, the text in bold in the following line is an expression:\n\n\
    ```\nToday is <%=java.util.Calendar.getInstance().getTime()>\n```\n\nNote that\
    \ there is no semicolon after an expression.\n\nWith this expression, the JSP\
    \ container first evaluates java.util.Calendar.getInstance().getTime(), and then\
    \ passes the result to out.print(). This is the same as writing this scriptlet:\n\
    \n```\nToday is\n<%\n  out.print(java.util.Calendar.getInstance().getTime());\n\
    %>\n```"
  merge: -1
  pgno: 456
- img_proc: true
  md: "# Declarations\n\nYou can declare variables and methods that can be used in\
    \ a JSP page. You enclose a declaration with <%! and %>. For example, the declarationTst.jsp\
    \ page in Listing D.7 shows a JSP page that declares a method named getTodaysDate.\n\
    \n# Listing D.7: Using a declaration (declarationTst.jsp)\n\n```\n<!%\npublic\
    \ String getTodaysDate() {\n  return new java.util.Date();\n}\n<!DOCTYPE html>\n\
    <html>\n<head><title>Declarations</title></head>\n<body>\nToday is <%=getTodaysDate()\
    \ %>\n</body>\n</html>\n```\n\nA declaration can appear anywhere in a JSP page\
    \ and there can be multiple declarations in the same page.\n\nYou can use declarations\
    \ to override the init and destroy methods in the implementation class. To override\
    \ init, declare a jspInit method. To override destroy, declare a jspDestroy method.\
    \ The two methods are explained below.\n\n+   * jspInit. This method is similar\
    \ to the init method in javax.servlet.Servlet. jspInit is invoked when the JSP\
    \ page is initialized. Unlike the init method, jspInit does not take arguments.\
    \ You can still obtain the ServletConfig object through the config implicit object.\n\
    * jspDestroy. This method is similar to the destroy method in Servlet and is invoked\
    \ when the JSP page is destroyed.\n\nListing D.8 presents the lifecycle.jsp page\
    \ that demonstrates how you can override jspInit and jspDestroy.\n\n# Listing\
    \ D.8: The lifecycle.jsp\n\n```\n<!%\npublic void jspInit() {\n  System.out.println(\"\
    jspInit...\");\n}\npublic void jspDestroy() {\n  System.out.println(\"jspDestroy...\"\
    );\n}\nn<!DOCTYPE html>\n<html>\n<head><title>jspInit and jspDestroy</title></head>\n\
    <body>\nOverriding jspInit and jspDestroy\n</body>\n```"
  merge: -1
  pgno: 457
