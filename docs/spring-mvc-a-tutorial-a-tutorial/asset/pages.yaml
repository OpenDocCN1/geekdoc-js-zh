    \ called before any test method is invoked and you can write code that prepares\
    \ the tests, such as creating an object that will be used by the test methods.\n\
    \nYou can also create a clean-up method by annotating a method with @org.junit.After.\
    \ A clean-up method gets called after all test methods in a test class are executed\
    \ and can be used to release resources used during the test.\n\nListing 13.3 shows\
    \ a Calculator class that needs to be unit-tested.\n\n# Listing 13.3: The Calculator\
