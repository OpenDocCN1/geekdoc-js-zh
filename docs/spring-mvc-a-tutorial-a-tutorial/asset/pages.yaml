  md: '# XML-Based Spring Configuration


    Spring supports XML-based configuration since version 1.0 as well as annotation-based
    configuration starting version 2.5. The following section discusses how an XML
    configuration file would look like. The root element of a Spring configuration
    file is always beans.


    ```

    <xml version="1.0" encoding="UTF-8"?>

    <beans xmlns="http://www.springframework.org/schema/beans"

    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"

    xsi:schemaLocation="http://www.springframework.org/schema/beans

    http://www.springframework.org/schema/beans/spring-beans.xsd">



    </beans>

    ```


    You can add more the schemaLocation attribute if you need more Spring functionality
    in your application. You can even use a version-specific schema like this rather
    than the default schema:


    http://www.springframework.org/schema/beans/spring-beans-4.2.xsd


    However, I recommend you use the default schema so you can upgrade the Spring
    libraries without changing your configuration files.


    You can split your XML configuration file into multiple files to make it more
    modular. Implementations of ApplicationContext are designed to read multiple configuration
    files. Alternatively, you can have a main XML configuration file that imports
    other configuration files.


    Here is an example of importing three XML configuration files from a main configuration
    file.


    ```

    <xml version="1.0" encoding="UTF-8"?>

    <beans xmlns="http://www.springframework.org/schema/beans"

    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"

    sxi:schemaLocation="http://www.springframework.org/schema/beans

    http://www.springframework.org/schema/beans/spring-beans.xsd">


    <import resource="config1.xml"/>

    <import resource="module2.xml"/>

    <import resource="/resources/config3.xml"/>


    </beans>

    ```


    You will learn the other subelements of <beans> in the next section.'
  merge: -1
