  md: '# Chapter 3


    # Introduction to Spring MVC


    In Chapter 2, “Model 2 and the MVC Pattern” you learned that the widely used design
    of modern web applications follow the MVC pattern. You also learned the advantages
    of Model 2 architecture and how to build Model 2 applications. Spring MVC is a
    framework that helps developers write MVC applications more rapidly.


    This chapter starts by discussing the benefits of Spring MVC and how it expedites
    Model 2 application development. It also discusses some basic components of Spring
    MVC, such as the Dispatcher Servlet, and teaches you how to write “old-style”
    controllers that were the only way of writing controllers in older versions of
    Spring prior to version 2.5. Another type of controller is covered in Chapter
    4, “Annotation-based Controllers.” The old style controller is discussed here
    because you might still have to work with legacy code written with older versions
    of Spring. For new developments, however, you should use annotation-based controllers.


    Introducing Spring MVC configuration is another objective of this chapter. Most
    Spring MVC applications will have an XML file for declaring various beans that
    are used in the applications.'
  merge: -1
