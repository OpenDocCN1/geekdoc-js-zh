  md: "# Fakes\n\nA fake behaves like a real collaborator but is not suitable for\
    \ production because it contains shortcuts. An in-memory store is a perfect example\
    \ of a fake because it behaves like a DAO but does not persist its states to a\
    \ hard drive.\n\nAs an example, consider the Member and MemberServiceImpl classes\
    \ in Listing 13.14 and Listing 13.15, respectively. The Member class contains\
    \ an identifier and a name for a member. The MemberServiceImpl class can add Members\
    \ to a store and retrieve all stored members.\n\n# Listing 13.14: The Member class\n\
    \n```\npackage com.example.model;\npublic class Member {\n    private int id;\n\
    \    private String name;\n    public Member(int idArg, String nameArg) {\n  \
    \      this.id = idArg;\n        this.name = nameArg;\n    }\n\n    public int\
    \ getId() {\n        return id;\n    }\n\n    public void setId(int idArg) {\n\
    \        this.id = idArg;\n    }\n\n    public String getName() {\n        return\
    \ name;\n    }\n\n    public void setName(String nameArg) {\n        this.name\
    \ = nameArg;\n    }\n}\n```\n\n# Listing 13.15: The MemberServiceImpl class\n\n\
    ```\npackage com.example.service;\nimport java.util.List;\nimport com.example.dao.MemberDAO;\n\
    import com.example.model.Member;\n```\n\n```\npublic class MemberServiceImpl implements\
    \ MemberService {\n    private MemberDAO memberDAO;\n    public void setMemberDAO(MemberDAO\
    \ memberDAOArg) {\n        this.memberDAO = memberDAO;\n    }\n\n    @Override\n\
    \    public void add(Member member) {\n        memberDAO.add(member);\n    }\n\
    ```"
