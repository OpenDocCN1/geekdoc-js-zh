  md: '# Validation Overview


    Converters and formatters on the field level. In an MVC application, they convert
    or format a String to another Java type, such as a java.time.LocalDate. A validator,
    on the other hand, works on the object level. It determines whether or not all
    fields in an object are valid and pre-defined rules are followed. A typical Spring
    MVC application uses both formatters/converters and validators.


    The sequence of events in an application that employs both formatters and validators
    goes like this. During the invocation of a controller, one or more formatters
    will try to convert input strings to values in the domain object. Once formatting
    is successful, the validators step in.


    For example, an Order object may have a shippingDate property (of type LocalDate,
    obviously) whose value cannot be earlier than today''s date. When the OrderController
    is invoked, LocalDateFormatter would convert a string to a LocalDate and assign
    it to the shippingDate property of the Order object. If the conversion failed,
    the user will be invoked to check if shippingDate is earlier than today.


    Now, you may ask if it is wise to move the validation logic to the LocalDateFormatter.
    After all, it is not hard to compare dates. The answer is No. First, the LocalDateFormatter
    may be used for formatting other strings to dates, such as birthDate or purchaseDate.
    Both dates have different rules than shippingDate. In fact, an employee''s date
    of birth, for example, cannot be a future date. Second, a validator may work by
    inspecting the relationship between two or more fields, each of which is supported
    by a different formatter. For example, given an Employee object with a birthDate
    property and a startDate property, a validator may rule that there is no someone
    starts working in the company before he she was born. Therefore, a valid Employee
    object must have its birthDate property value that is earlier than its startDate
    value. That''s a job for a validator.'
