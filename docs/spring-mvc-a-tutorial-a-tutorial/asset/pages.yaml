  md: "# Upload Clients\n\nWhile the file upload feature in Servlet 3 makes file upload\
    \ a breeze to program on the server side, it does nothing to enhance user experience.\
    \ An HTML form alone will not let display a progress bar or show the number of\
    \ files successfully uploaded. Developers have used different techniques to improve\
    \ the user interface, such as inquiring the server using a separate browser thread\
    \ so that upload progress can be reported, or by using third-party plug-in technologies\
    \ such as Java applets, Adobe Flash, and Microsoft Silverlight.\n\nThese plug-in\
    \ technologies used to work. To some extent and with limitation. Today Java applets\
    \ and Silverlight are practically dead. Chrome no longer allow applets and Silverlight,\
    \ and Edge, Microsoft new browser that replaced Internet Explorer, does not support\
    \ plug-ins at all.\n\nYou can still use Flash, as Chrome can still run it and\
    \ is integrated in Edge. However, its days are numbered as more and more people\
    \ embrace HTML5.\n\nHTML5 adds a File API to its DOM to allow file access. Compared\
    \ to applets, Flash, and Silverlight, HTML5 seems ideal as the perfect solution\
    \ to client side file upload limitations.\n\nTo demonstrate the power of HTML5,\
    \ the html5.jsp page in upload2 (given in Listing 11.5) uses JavaScript and the\
    \ HTML5 File API to provide a bar that reports the upload progress. The upload\
    \ application also contains a copy of the MultipleUploadsServlet to save uploaded\
    \ files on the server. However, as Javascript is beyond the scope of this book,\
    \ explanation will only be givenにつき.\n\nIn short, we're interested in the change\
    \ event of the HTML5 input element, which is triggered by the value of an element\
    \ changes. We're also interested in the progress event added to the XMLHttpRequest\
    \ object in HTML5. XMLHttpRequest is of course the backbone of AJAX. When the\
    \ XMLHttpRequest is used asynchronously to upload a file, it triggers the progress\
    \ event continuously until the upload process is complete or until the process\
    \ is halted by an error. By listening to the progress event, you can easily monitor\
    \ the progress of a file upload operation.\n\nThe Html5FileUploadController in\
    \ upload2 has the capability of saving an uploaded file to the file directory\
    \ under the application directory. The UploadedFile class in Listing 11.8 shows\
    \ a simple class that contains only one property.\n\n# Listing 11.8: The UploadedFile\
    \ domain class\n\n```\npackage domain;\nimport java.io.Serializable;\nimport org.springframework.web.multipart.MultipartFile;\n\
    \npublic class UploadedFile implements Serializable {\n    private static final\
    \ long serialVersionUID = 1L;\n    private MultipartFile multipartFile;\n```"
  merge: -1
  pgno: 326
- img_proc: true
  md: "```\npublic MultipartFile getMultipartFile() {\n    return multipartFile;\n\
    }\npublic void setMultipartFile(MultipartFile multipartFile) {\n    this.multipartFile\
    \ = multipartFile;\n}\n```\n\nThe HtmlFileUploadController class is given in Listing\
    \ 11.9.\n\n# Listing 11.9: The HtmlFileUploadController class\n\n```\npackage\
    \ controller;\nimport java.io.File;\nimport java.io.IOException;\nimport javax.servlet.http.HttpServletRequest;\n\
    import org.apache.commons.logging.Log;\nimport org.apache.commons.logging.LogFactory;\n\
    import org.springframework.framework.stereotype.Controller;\nimport org.springframework.framework.ui.Model;\n\
    import org.springframework.framework.validation.BindingResult;\nimport org.springframework.framework.web.bind.annotation.ModelAttribute;\n\
    import org.springframework.framework.web.bind.annotation.RequestMapping;\nimport\
    \ org.springframework.web.multipart.MultipartFile;\nimport domain.UploadedFile;\n\
    ```\n\n```\n@Controller\npublic class HtmlFileUploadController {\n\n    private\
    \ static final Log logger = LogFactory.getLogger(HtmlFileUploadController.class);\n\
    \n    @RequestMapping(value = \"/html5\")\n    public String inputProduct() {\n\
    \        return \"html5\";\n    }\n\n    @RequestMapping(value = \"/file_upload\"\
    )\n    public void saveFile(HttpServletRequest servletRequest,\n        @ModelAttribute\
    \ UploadedFile uploadedFile,\n        BindingResult bindingResult, Model model)\
    \ {\n\n        MultipartFile multipartFile = uploadedFile.getMultipartFile();\n\
    \        String fileName = multipartFile.getOriginalFilename();\n        try {\n\
    \            File file = new File(servletRequest.getServletContext().getPath(\"\
    /file\"), fileName);\n            multipartFile.transferTo(file);\n        } catch\
    \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n}\n```"
