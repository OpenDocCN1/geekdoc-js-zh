  md: "# The Resource File\n\nYou don't need to explicitly register a validator. However,\
    \ if you want the error messages to be taken from a properties file, you need\
    \ to tell Spring where to find the file by declaring a messageSource bean. Here\
    \ is the messageSource declaration in spring-validator.\n\n```\n<bean id=\"messageSource\"\
    \ class=\"org.springframework.context.support.ReloadableResourceBundleMessageSource\"\
    >\n    <property name=\"basename\" value=\"/WEB-INF/resource/messages\"/>\n</bean>\n\
    ```\n\nThe bean essentially says that error codes and error messages can be found\
    \ in the messages.properties file under /WEB-INF/resource.\n\nListing 7.4 shows\
    \ the content of the messages.properties file.\n\n# Listing 7.4: The messages.properties\
    \ file\n\n```\nproductName.required.product.name=Please enter a product name\n\
    price.negative=Price cannot be less than 0\nproductionDate.required=Please enter\
    \ a production date\nproductionDate.invalid=Please ensure the production date\
    \ is not later than today\ntypemismatch.productionDate=Invalid production date\n\
    ```"
