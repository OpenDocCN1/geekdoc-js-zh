  md: "# ModelAndViewAssert\n\nThe ModelAndViewAssert class, part of the org.springframework.web.servlet\
    \ package, is another useful Spring class for testing a ModelAndView returned\
    \ from a controller's request-handling method. Recall from Chapter 4, “Annotation-Based\
    \ Controllers” that ModelAndView is one of the types that a request-handling method\
    \ can return. Recall also that a ModelAndView is a bean that contains information\
    \ about the model and view of a request-handling method.\n\nTable 13.3 shows some\
    \ of the methods in ModelAndViewAssert.\n\n| Method | Description |\n|---|---|n|\
