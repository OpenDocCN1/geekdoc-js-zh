- img_proc: true
  md: "# The formatDate Tag\n\nYou use the formatDate tag to format dates. The syntax\
    \ is as follows:\n\n```\n<fmt:formatDate value=\"date\"\n  [type=\"{time|date|both}\"\
    ]\n  [date=\"default|short|medium|long|full\"]\n  [timeStyle=\"default|short|medium|long|full\"\
    ]\n  [pattern=\"customPattern\"]\n  [timezone=\"TimeZone\"]\n  [var=\"varName\"\
    ]\n  [scope=\"page|request|session|application\"]\n/>\n```\n\nThe body content\
    \ is JS. The formatDate tag's attributes are given in Table 9.11.\n\n| Attribute\
    \ | Type | Description |\n|---|---|---|\n| value+ | java.util.Date | Date andor\
    \ time to be formatted |\n| type+ | String | Indicates whether the time, the date,\
    \ or both the time and the date components are to formatted |\n| date+ | String\
    \ | Predefined formatting style for dates that follows the semantics defined in\
    \ java.text.DateFormat. |\n| timeStyle | String | Predefined formatting style\
    \ for times that follows the semantics defined in java.text.DateFormat. |\n| pattern\
    \ | String | The custom pattern for formatting |\n| timezone+ | String or java.util.Timezone\
    \ | The time in which to represent the time |\n| var | String | The name of the\
    \ scoped variable to store the result as a string |\n| scope | String | Scope\
    \ of var. |\n\n**Table 9.11: The formatDate tag's attributes**\nFor possible values\
    \ of the timezone attribute, see the section, “The timeZone”.\n\nThe following\
    \ code uses the formatDate tag to format the java.util.Date object referenced\
    \ by the scoped variable ${now}.\n\n```\nDefault: <fmt:formatDate value=\"${now}\"\
    />\nShort: <fmt:formatDate value=\"${now}\" dateStyle=\"short\"/>\nMedium: <fmt:formatDate\
    \ value=\"${now}\" dateStyle=\"medium\"/>\nLong: <fmt:formatDate value=\"${now}\"\
    \ dateStyle=\"long\"/>\nFull: <fmt:formatDate value=\"${now}\" dateStyle=\"full\"\
    />\n```"
  merge: -1
  pgno: 270
- img_proc: true
  md: 'The following formatDate tags are used to format times.


    ```

    Default: <fmt:formatDate type="time" value="${now}">

    Short: <fmt:formatDate type="time" value="${now}"

    timeStyle="short"/

    Medium: <fmt:formatDate type="time" value="${now}"

    timeStyle="medium"/

    Long: <fmt:formatDate type="time" value="${now}" TextStyle="long"/

    Full: <fmt:formatDate type="time" value="${now}" TextStyle="full"/>

    ```


    The formatDate tags are used to format dates and times.


    ```

    Default: <fmt:formatDate type="both" value="${now}">

    Short date short time: <fmt:formatDate type="both"

    value="${now}" dateStyle="short" TextStyle="short"/

    Long date time format: <fmt:formatDate type="both"

    value="${now}" dateStyle="long" TextStyle="long"/>

    ```


    The formatDate tags are used to format times with time zones.


    ```

    Time zone CT: <fmt:formatDate type="time" value="${now}"

    timeZone="CT"/><br/>nTime zone HST: <fmt:formatDate type="time" value="${now}"

    timeZone="HST"/><br/>

    ```


    The formatDate tags are used to format dates and times using custom patterns.


    ```

    <fmt:formatDate type="both" value="${now}" pattern="dd.MM.yy"/

    <fmt:formatDate type="both" value="${now}" pattern="dd.MM.yyyy"/>

    ```'
