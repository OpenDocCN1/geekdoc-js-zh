  md: '# The Hypertext Transfer Protocol (HTTP)


    The Hypertext Transfer Protocol (HTTP) enables web servers and browsers to exchange
    data over the Internet or an intranet. The World Wide Web Consortium (W3C), an
    international community that develops standards, is responsible for revising and
    maintaining this protocol. The first version of HTTP was HTTP 0.9, which was replaced
    by HTTP 1.0. Superseding HTTP 1.1, which is defined in the W3C''s Request for
    Comments (RFC) 2616. At the time of writing, HTTP 1.1 is still the most popular
    version of HTTP. HTTP/2, was released in May 2015. Table 1 shows the HTTP versions
    and their release dates. Note that the second major version of HTTP is commonly
    referred as HTTP/2 rather than HTTP 2.


    | Version | Date |

    |---|-|

    | HTTP 0.9 | 1991 |

    | HTTP 1.0 | 1996 |

    | HTTP 1.1 | First released in 1997 and updated in 1999 |

    | HTTP/2 | May 2015 |


    Table I.1: HTTP versions and release dates (also known as a web server) runs 24x7
    waiting for HTTP clients (normally web browsers) to connect to it and ask for
    resources. In HTTP it is always the client that initiates a connection, a server
    is never in a position to contact a client.


    To locate a resource, an Internet user would click a link that contains a Uniform
    Resource Locator (URL) or enter one in the Location box of his/her browser. Here
    are two examples of URLs:


    ```

    http://google.com/index.html

    http://facebook.com/index.html

    ```


    The first part of the URLs is http, which identifies the protocol. Not all URLs
    use HTTP. For instance, these two URLs are valid even though they are not HTTP-based
    URLs:


    ```

    mailto:joe@example.com

    ftp://marketing@ftp.example.com

    ```


    In general an HTTP-based URL has this format:


    ```

    protocol://[host].domain[:port][/context][/resource]?query string

    | variable

    ```


    or'
  merge: -1
