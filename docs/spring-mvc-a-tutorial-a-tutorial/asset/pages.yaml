  md: '# The checkboxes Tag


    The checkboxes tag renders multiple <input type="checkbox/> elements. The attributes
    that may appear within checkboxes are given in Table 5.9. All attributes are optional
    and the table does not include HTML attributes.


    | Attribute | Description |

    | --- | --- |

    | cssClass | Specifies the CSS class to be applied to the rendered input element
    |

    | cssStyle | Specifies the CSS style to be applied to the rendered input element
    |

    | cssErrorClass | Specifies the CSS class to be applied to the rendered input
    element if the bound property contains errors, overriding the value of the cssClass
    attribute |

    | delimiter | Specifies a delimiter between two input elements. By default, there
    is no delimiter |

    | element | Specifies an HTML element to enclosed each rendered input element.
    The default is ‘span’. |

    | htmlEscape | Accepts true or false indicating whether or not the rendered value(s)
    should be HTML-escaped |

    | items | The Collection, Map, or array of objects used to generate the input
    elements |

    | itemLabel | The property of the objects in the collection/Map/array specified
    in the items attribute that is to supply the label for each input element |

    | itemValue | The property of the objects in the collection/Map/array specified
    in the items attribute that is to supply the value for each input element |

    | path | The path to the property to bind |


    Table 5.9: The checkboxes tag’s attributes


    For example, the following checkboxes render the content of model attribute categoryList
    as check boxes. The checkboxes tag allows multiple selections.


