    , servletContext.getRealPath(\"/\"));\n        return \"success\";\n    }\n\n\
    ```\n\nListing 13.30 shows a test class for integration testing the WebAuthController\
    \ class. Note the value passed to the @WebApplicationConfiguration annotation.\n\
    \n**Listing 13.30: The WebAuthControllerTest class**"
