- img_proc: true
  md: "# The Evaluation Rule\n\nAn EL expression is evaluated from left to right.\
    \ For an expression of the form expr[expr-b], here is how the EL expression is\
    \ evaluated:\n\n+   1. Evaluate expr-a to get value-a.\n2. If value-a is null,\
    \ return null.\n3. Evaluate expr-b to get value-b.\n4. If value-b is null, return\
    \ null.\n5. If the type of value-a is java.util.Map, check whether value-b is\
    \ a key in the Map. If it is, return value-a.get(value-b). If it is not, return\
    \ null.\n6. If the type of value-a is java.util.List or if it is an array, do\
    \ the following:\n   a. Coerce value-b to int. If coercion fails, throw an exception.\n\
    \   b. If value-a.get(value-b) throws an IndexOutOfBoundsException or if Array.get(value-a,\
    \ value-b) throws an ArrayIndexOutOfBoundsException, return null. return value-a.get(value-b)\
    \ if value-a is a List, or return Array.get(value-a, value-b) if value-a is an\
    \ array.\n7. If value-a is not a Map, a List, or an array, value-a must be a JavaBean.\
    \ In this case, coerce value-b to String. If value-b is a readable property of\
    \ value-a, call the getter of the property and return the value from the getter\
    \ method. If the getter method throws an exception, the expression is invalid.\
    \ Otherwise, the expression is invalid."
  merge: -1
  pgno: 190
