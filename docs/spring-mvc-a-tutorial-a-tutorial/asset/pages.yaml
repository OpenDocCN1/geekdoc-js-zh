  md: '# Servlet JSP Overview


    Java Servlet technology, or Servlet for short, the underlying technology for developing
    web applications in Java. Sun Microsystems released it in 1996 to compete with
    the Common Gateway Interface (CGI), the then standard for generating dynamic content
    on the web. The main problem with the CGI was the fact that it spawned a new process
    for every HTTP request. This made it difficult to write scalable CGI programs
    because creating a process took a lot of CPU cycles. A servlet, on the other hand,
    is much faster than a CGI program because a servlet stays in memory after its
    first request, waiting for subsequent requests.


    Since the day Servlet emerged, a number of Java-based web frameworks have been
    developed to help programmers write web applications more rapidly. These frameworks
    let you focus on the business logic and spend less time writing boilerplate code.
    However, you still have to understand the nuts and bolts of Servlet. Java Pages
    (JSP), which was later released to make servlets easier. You may be using a framework
    like Spring MVC, Struts 2, or JavaServer Faces. Without excellent knowledge of
    Servlet and JSP, you won''t be able to code effectively and efficiently. Servlets,
    by the way, are Java classes that run on a servlet container. A servlet container
    or engine is like a web server that has the ability to generate dynamic content,
    not just static resources. Servlet 3.1, the current version, is defined in Java
    Specification Request (JSR) 340 (http://jcp.org/en/jsr/detail?id=340). It requires
    Java Standard Edition 6 or later. JSP 2.3 is defined in JSR 245 (http://jcp.org/en/jsr/detail?id=245).
    This book assumes you know Java and object-oriented programming. If you''re new
    to Java, Java: A Beginner''s Tutorial (Fourth Edition), ISBN 9780992133047.


    A servlet is a Java program. A servlet application consists of one or more servlets.
    A JSP page is translated and compiled into a servlet.


    A servlet application runs inside a servlet container and cannot run on its own.
    A servlet container passes requests from the user to the servlet application and
    responses from the servlet application back to the user. Most servlet applications
    include at least JSP pages. As such, it''s more appropriate to use the term "servlet/JSP
    application" to refer to a Java web application to leave JSP out.


    Web users use a browser as Internet Explorer, Mozilla Firefox, or Google Chrome
    to access servlet applications. A browser is referred to as a web client. I.1
    shows the architecture of a servlet/JSP application.


    ![](img/9df6b4b4bce0bca1a5859c20a724e196_14_0.png)


    Figure I.1: Servlet/JSP application architecture'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'The server and the web client communicate in a language they both are fluent
    in: the Hypertext Transfer Protocol (HTTP). Because of this, a web server is also
    called HTTP server.


    A servlet/JSP container is a special web server that can process servlets as well
    as static contents. In the past, people were more comfortable using a servlet/JSP
    container as a module of an HTTP server such as the Apache HTTP Server because
    it was considered more robust than a servlet/JSP container. In this scenario the
    servlet/JSP container would be tasked with generating dynamic content and the
    HTTP server with serving static resources. Today servlet/JSP containers are considered
    mature and widely deployed servlet/JSP containers are free and open-source. You
    can download them from http://tomcat.apache.org and http://jetty.codehaus.org,
    respectively.


    Servlet and JSP are two of a multitude of technologies defined in the Java Enterprise
    Edition (EE). Other Java EE technologies include Java Message Service (JMS), Enterprise
    JavaBeans (EJB), JavaServer Faces (JSF), and Java Persistence. The complete list
    of technologies in the Java EE version 7 (the current version) can be found here.


    http://www.oracle.com/technetwork/java/javaee/tech/index.html


    To run a Java EE application, you need a Java EE container, such as GlassFish,
    Jboss, Oracle WebLogic, and IBM WebSphere. You can deploy a servlet/JSP application
    in a Java EE container, but a servlet/JSP container is sufficient and is more
    lightweight than a Java EE container. Tomcat and Jetty are not Java EE containers,
    so they cannot run EJB or JMS.'
  merge: -1
