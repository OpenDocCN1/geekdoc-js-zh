  md: 'You need a SpringJUnit4ClassRunner.class with your @RunWith annotation:

    @RunWith(SpringJUnit4ClassRunner.class)


    This runner allows you to use Spring.

    Then, you need to annotate your test class with these annotation types:


    ```

    @SpringBootConfiguration

    @ContextConfiguration("...")

    ```


    The WebApplication annotation type is used to declare that the ApplicationContext
    loaded for an integration test should be of type WebApplicationContext. The ContextConfiguration
    annotation type tells the test runner how to load and configure the WebApplicationContext.


    In addition to the annotations, you need two objects in your test class:


    ```

    private WebApplicationContext webAppContext;

    private MockMvc mockMvc;

    ```'
