  md: '# # Integration Testing with Spring MVC Test


    Integration testing is testing that is performed to test if different modules
    can work together. It also makes sure data flows between two modules seamlessly.
    The Spring Framework dependency injection container is used and wiring of beans
    must be checked.


    Without a proper tool, integration can take a lot of time. Imagine if you are
    building an online store and you have to use a web browse to test if the shopping
    cart calculates correctly. Each time you change your code, you have to launch
    your browser, login to the system, add the several items to the shopping cart
    and check out to see if the total amount is correct. Each iteration could easily
    take five minutes!


    Luckily, Spring comes with a module for integration testing: Spring Test.


    While the Spring classes MockHttpRequest, MockHttpResponse and ModelAndViewAssert
    are good for unit testing MVC controllers, they lack features that are normally
    associated with integration testing. For example, they invoke request-handling
    methods directly and cannot be used to test request mappings and data binding.
    They also do not test bean wiring as SUT classes are instantiated using the new
    operator.


    For integration testing, you need a different set of Spring MVC Test types. The
    following subsections discuss the API for integration testing and provide an example.'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# The API


    A module of Spring, Spring MVC Test provides utility classes that make it easy
    to perform integration testing on a Spring MVC application. Beans are created
    using the Spring dependency injector and obtained from an ApplicationContext,
    which is just like a real Spring application.


    The MockMvc class, part of the org.springframework.test.web.servlet package, is
    the main class in Spring MVC Test to aid in integration testing. This class allows
    you to invoke request-handling methods with predefined request mappings. Here
    is a common way to create an instance of MockMvc:


    ```

    MockMvc mockMvc = MockMvcBuilders.setUp(webAppContext).build();

    ```


    Here, webAppContext is a reference to an instance of WebApplicationContext, which
    is a subclass of ApplicationContext discussed in Chapter 2, “The Spring Framework”
    and every Spring developer should be familiar with. To get a WebApplicationContext,
    you must declare this in your test class:


    ```

    @Autowired private WebApplicationContext appContext;

    ```


    The MockMvcBuilder reads a Spring configuration file or files defined for the
    test class. I will discuss how you can specify configuration for your test class,
    but first I would like to discuss MockMvc.


    MockMvc is a very simple class. In fact, it has only one method, perform, that
    is used to invoke a Spring MVC controller indirectly through a URI.


    The perform method has the following signature


    ```

    ResultActions perform(RequestBuilder requestBuilder);

    ```


    To test a request-handling method, you need to create a RequestBuilder. Fortunately,
    there is the MockMvcRequests class which offers static methods with the same names
    as HTTP methods: get, post, head, put, patch, delete, and so on. To test a controller
    using the HTTP GET method, you would use get, to test with a POST, use post, and
    so forth. These static methods are easy to use, you just need to pass a string
    that contains the URI for the controller''s request-handling method.


    For example, to invoke a request-handling method named getEmployee, you would
    write code like this:


    ```

    ResultActions resultActions = mockMvc.performget("/getEmployee"));

    ```


    Of course, you have to import the static get method of MockMvcRequestBuilders.


    To verify if a test was successful, you would need to call the andExpect method
    of ResultActions. Here is the signature of andExpect.


    ```

    ResultActions andExpect(ResultMatcher matcher);

    ```'
