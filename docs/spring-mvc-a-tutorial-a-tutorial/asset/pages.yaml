  md: "# # Reading the Properties Files\n\nResourceBundle is an abstract class. Nonetheless,\
    \ you can obtain an instance of ResourceBundle by calling its static getBundle\
    \ method. The signatures of its overloads are\n\n```\npublic static ResourceBundle\
    \ getBundle(java.lang.String baseName)\npublic static ResourceBundle getBundle(java.lang.String\
    \ baseName,\nLocale locale)\n```\n\nFor example:\n\n```\nResourceBundle rb = ResourceBundle.getBundle(\"\
    MyResources\", Locale.US);\n```\n\nThis will load the ResourceBundle with the\
    \ values in the corresponding properties file.\n\nIf a suitable properties file\
    \ is not found, the ResourceBundle object will fall back to the default properties\
    \ files. The name of the default properties file will be the base name with a\
    \ properties extension. In this case, the default file would be MyResources.properties.\
    \ If the default properties file is not found, java.util.MissingResourceException\
    \ will be thrown.\n\nTo read a value, use the ResourceBundle class's getString\
    \ method, passing a key.\n\n```\npublic java.lang.String getString(java.lang.String\
    \ key)\n```\n\nIf the entry with the specified key is not found, a java.util.MissingResourceException\
    \ will be thrown.\n\nIn Spring MVC, you do not work with ResourceBundle directly.\
    \ Instead, you use the messageSource to tell Spring MVC where you store properties\
    \ files. For example, the following messageSource reads two properties files.\n\
    \n```\n<bean id=\"messageSource\" class=\"org.springframework.context.support.ReloadableResourceBundleMessageSource\"\
    >\n  <property name=\"basenames\">\n    <list>\n      <value>resource/messages</value>\n\
