  md: '# Referencing Static Fields and Methods


    You can reference static fields and methods defined in any Java classes. Before
    you can reference a static field or method in a JSP page, however, you have to
    import the class or the class package using the package directive. The java.lang
    package is an exception because it is automatically imported.


    For instance, the following page directives import the java.time package.


    ```

    <@page import="java.time.*">

    ```


    Alternatively, you can import a single class, e.g.


    ```

    <@page import="java.time.LocalDate">

    ```


    As a result, you can reference the LocalDate class’s now method, which is a static
    method, like so.


    Today is ${LocalDate.now()}


    You will learn how to format a later date in this chapter.


    Here is another example of referencing a static member and a static field of a
    class.


    ```

    <p>

    &radic;<span style="text-decoration:underline;">&nbsp;36&nbsp;/span

    = ${Math.sqrt(36)}

    </p>

    <p>

    &pi; = ${Math.PI}

    </p>

    ```


    Math is a member of java.lang, you do not need to import this class. Figure 8.1
    shows how this code is rendered in a JSP page.


    ![](img/9df6b4b4bce0bca1a5859c20a724e196_211_0.png)


    Figure 8.1: Referencing static members of a class


    Another way of importing a package is by doing so programmatically in a Servlet
    listener. Listing 8.1 shows a listener that imports two packages, java.time and
    java.util.


    +   Listing 8.1: Importing types programmatically


    ```

    package listener;

    import javax.el.ELContextEvent;

    import javax.servlet.ServletContextEvent;

    import javax.servlet.ServletContextListener;

    import javax.servlet.annotation.WebListener;

    import javax.servlet.jsp.JspFactory;

    ```'
