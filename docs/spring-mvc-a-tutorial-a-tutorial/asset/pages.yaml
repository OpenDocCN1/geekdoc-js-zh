  md: "# JSP-Specific Elements\n\nThe jsp-config element under <web-app> contains\
    \ elements specific to JSP. It can have zero or more taglib elements and zero\
    \ or more jsp-property-group elements. The taglib element is explained in the\
    \ first subsection of this section and the jsp-property-group element in the second\
    \ subsection.\n\n# taglib\n\nThe taglib element describes a JSP custom tag library.\
    \ The taglib element contains a taglib-uri element and a taglib-location element.\n\
    \nThe taglib-uri element specifies the URI of the tag library used in the servlet/JSP\
    \ application. The value for <taglib-uri> is relative to the location of the deployment\
    \ descriptor.\n\nThe taglib-location element specifies the location of the TLD\
    \ file for the tag library. The following is an example taglib element.\n\n```\n\
    <jsp-config>\n  <taglib>\n    <taglib-uri>\n      http://braininysoftware.com/taglib/complex\n\
    \    </taglib-uri>\n    <taglib-location>WEB-INF/jsp/complex.tld\n    </taglib-location>\n\
    \  </taglib>\n</jsp-config>\n```\n\n# jsp-property-group\n\nThe jsp-property-group\
    \ element groups a number of JSP files so they can be given global property information.\
    \ You can use subelements under <jsp-property-group> to do the following.\n\n\
    +   - Indicate whether EL is ignored\n- Indicate whether scripting elements are\
    \ allowed\n- Indicate page encoding information\n- Indicate that a resource is\
    \ a JSP document (written in XML)\n- Prelude and code automatic includes\n\nThe\
    \ jsp-property-group element has the following subelements:\n\n+   - an optional\
    \ description element\n- an optional display-name element\n- an optional icon\
    \ element\n- one or more url-pattern elements\n- an optional el-ignored element\n\
    - an optional page-encoding element\n- an optional scripting-invalid element\n\
    - an optional is-xml element"
  merge: -1
  pgno: 480
- img_proc: true
  md: "+   - zero or more include-prelude elements\n- zero or more include-code elements\n\
    \nThe url-pattern element is used to specify a URL pattern that will be affected\
    \ by the property settings.\n\nThe el-ignored element can have a boolean value\
    \ of true or false. A value of true means that the EL expressions will not be\
    \ evaluated in the JSP pages whose URL match the specified URL pattern(s). The\
    \ default value of this element is false.\n\nThe page-encoding element specifies\
    \ the encoding for the JSP pages whose URL pattern(s) is the same as the value\
    \ of the pageEncoding attribute of the page directive used in a matching JSP page.\
    \ There will be a translation-time error to name a different encoding in the pageEncoding\
    \ attribute of the page directive of a JSP and in a JSP configuration matching\
    \ the page. It is also a translation-time error to name a different encoding in\
    \ the prolog or text declaration of a document in XML syntax and in a JSP configuration\
    \ element matching the document. It is legal to name the same encoding through\
    \ multiple mechanisms.\n\nThe scripting-invalid element accepts a boolean value.\
    \ A value of true means that scripting is not allowed in the JSP pages whose URLs\
    \ match the specified pattern(s). By default, the value of the scripting-invalid\
    \ element is false.\n\nThe is-xml element accepts a boolean value and true indicates\
    \ that the JSP pages URLs match the specified pattern(s) are JSP documents.\n\n\
    The include-prelude element is a context-relative path that must correspond to\
    \ an element in the server/JSP application. When the element is present, the given\
    \ path will be automatically included (as in an include directive) at the beginning\
    \ of each JSP page whose URL matches the specified pattern(s).\n\nThe include-coda\
    \ element is a context-relative path that must correspond to an element in the\
    \ application. When the element is present, the given path will be automatically\
    \ included (as in the include directive) at the end of each JSP page in this jsp-property-group\
    \ element.\n\nFor example, here is a jsp-property-group element that causes EL\
    \ evaluation in all JSP pages to be ignored.\n\n```\n<jsp-config>\n  <jsp-property-group>\n\
    \    <url-pattern>*.jsp</url-pattern>\n    <el-ignored>true</el-ignored>\n  </jsp-property-group>\n\
    </jsp-config>\n```\n\nAnd, here is a jsp-property-group element that is used to\
    \ enforce script-free JSP pages throughout the application.\n\n```\n<jsp-config>\n\
    \  <jsp-property-group>\n    <url-pattern>*.jsp</url-pattern>\n```"
