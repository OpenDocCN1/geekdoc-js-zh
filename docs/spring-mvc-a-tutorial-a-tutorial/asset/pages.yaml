  md: "# Validators\n\nInput validation is an important step in performing an action.\
    \ Validation ranges from simple tasks like checking if an input field has a value\
    \ to more complex ones like verifying a credit card number. In fact, validation\
    \ play such an important role that the Java community has published JSR 303, \"\
    Bean Validation\" to standardize input validation in Java. Modern MVC frameworks\
    \ offer both programmatic and declarative validation methods. In programmatic\
    \ validation, you write code to validate user input. In declarative validation,\
    \ you provide validation rules in XML documents or properties files.\n\n# Note\n\
    \nEven though you can perform client-side input validation with HTML5 or JavaScript,\
    \ don't rely on it because the savvy user can bypass it easily. Always perform\
    \ server-side input validation!\n\nThe following example features a new application\
    \ (appdesign3) that extends the servlet controller-based Model 2 application in\
    \ appdesign1. The new application incorporates a product validator whose class\
    \ is given in Listing 2.8.\n\n+   Listing 2.8: The ProductValidator class\n\n\
    ```\npackage appdesign3.validator;\nimport java.util.ArrayList;\nimport java.util.List;\n\
    import appdesign3.form.ProductForm;\n\npublic class ProductValidator {\n    public\
    \ List<String> validate(ProductForm productForm) {\n        List<String> errors\
    \ = new ArrayList<>();\n        String name = productForm.getName();\n       \
    \ if (name == null || name.trim().isEmpty()) {\n            errors.add(\"Product\
    \ must have a name\");\n        }\n        String price = productForm.getPrice();\n\
    \        if (price == null || price.trim().isEmpty()) {\n            errors.add(\"\
    Product must have a price\");\n        } else {\n            try {\n         \
    \       Float.parseFloat(price);\n            } catch (FormatException e) {\n\
    \                errors.add(\"Invalid price value\");\n            }\n       \
    \ }\n        return errors;\n    }\n}\n```\n\nThe ProductValidator class in Listing\
    \ 2.8 offers a validate method that works on a ProductForm. The validator makes\
    \ sure that a product has a non-empty name and its price is a valid number. The\
    \ validate method returns a List of Strings containing"
  merge: -1
