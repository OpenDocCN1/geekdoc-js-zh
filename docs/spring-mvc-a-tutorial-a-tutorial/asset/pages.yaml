  md: "# The Controller Annotation Type\n\nThe org.springframework.stereotype.Controller\
    \ annotation type is used to annotate a Java class to indicate instances of the\
    \ class are controllers. Here is an example of a class annotated with @Controller.\n\
    \n```\npackage com.example.controller;\n\nimport org.springframework.stereotype;\n\
    ...\n\n@Controller\npublic class CustomerController {\n\n    // request-handling\
    \ methods\n\n}\n```\n\nSpring uses a scanning mechanism to find all annotation-based\
    \ classes in an application. To ensure Spring can find your controllers, there\
    \ are two things you need to do. First, you need to declare the spring-context\
    \ schema in your Spring MVC configuration file, like so:\n\n```\n<beans\n    xmlns:context=\"\
    http://www.springframework.org/schema/context\"\n    ...\n>\n```\n\nSecond, you\
    \ need to use a <component-scan> element in your configuration file:\n\n```\n\
    context:component-scan base-package=\"basePackage\"/>\n```\n\nIn your <component-scan/>\
    \ element, specify the base package of your controller classes. For example, if\
    \ you put all your controller classes under com.example.controller and its subpackages,\
    \ you need to write a <component-scan/> element like so:\n\n```\ncontext:component-scan\
    \ base-package=\"com.example.controller\"/>\n```\n\nIntegrating <component-scan/>,\
    \ your configuration file would look like:\n\n```\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\n    \
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n     xmlns:p=\"http://www.springframework.org/schema/p\"\
    \n     xmlns:context=\"http://www.springframework.org/schema/context\"\n     xsi:schemaLocation=\"\
    http://www.springframework.org/schema/beans\n     http://www.springframework.org/schema/beans/spring-beans.xsd\n\
    \     http://www.springframework.org/schema/context\n     http://www.springframework.org/schema/context/spring-context.xsd\n\
    \     http://www.springframework.org/schema/context\n     http://www.springframework.org/schema/context/spring-context.xsd\"\
    >\n\n<context:component-scan base-package=\"com.example.controller\"/>\n```"
