  md: "# Spring MVC DispatcherServlet\n\nRecall that in Chapter 2, \"Model 2 and the\
    \ MVC Pattern\" you built a simple MVC framework that consisted of a servlet that\
    \ acted as a dispatcher. With Spring MVC, you do not have to do that. Spring MVC\
    \ comes with a dispatcher servlet that you can instantly use. Its fully qualified\
    \ name is org.springframework.web.servlet.DispatcherServlet.\n\nTo use this servlet,\
    \ you need to configure it in your deployment descriptor (web.xml) using the servlet\
    \ and servlet-mapping elements, like this.\n\n```\n<servlet>\n  <servlet-name>springmvc</servlet-name>\n\
    \  <servlet-class>\n    org.springframework.web.servlet.DispatcherServlet\n  </servlet-class>\n\
    \  <load-on-startup>1</load-on-startup>\n</servlet>\n```\n\n```\n<servlet-mapping>\n\
    \  <servlet-name>springmvc</servlet-name>\n  <!-- map all requests to the DispatcherServlet\
    \ -->\n  <url-pattern>/</url-pattern>\n</servlet-mapping>\n```\n\nThe load-on-startup\
    \ element under <servlet> is optional. If it is present, it will load the servlet\
    \ and call its init method when the application is started. Without the load-on-startup\
    \ element, the servlet will be loaded when it is first requested.\n\nBy itself\
    \ the servlet will use many default components that come with Spring MVC. In addition\
    \ it will look for a configuration file in the WEB-INF directory of the application.\
    \ The name of the XML file must conform to this pattern\n\n```\nservletName-servlet.xml\n\
    ```\n\nwhere servletName is the name given to the Spring dispatcher servlet in\
    \ the deployment descriptor. If you have given the servlet name springmvc, you\
    \ will need to have springmvc-servlet.xml file under the WEB-INF directory of\
    \ your application directory.\n\nHowever, you can place your Spring MVC configuration\
    \ file anywhere within your application directory as long as you tell the dispatcher\
    \ servlet to find it. You do do this by using an init-param element under the\
    \ servlet descriptor. The init-param element would have a param-name element that\
    \ has the value contextLocation. You also have a param-value element containing\
    \ the path to your configuration file. For example, you can change the default\
    \ name and location of the configuration file to /WEB-INF/simple-config.xml by\
    \ using this init-param element.\n\n```\n<servlet>\n  <servlet-name>springmvc</servlet-name>\n\
    \  <servlet-class>\n    org.springframework.web.servlet.DispatcherServlet\n  </servlet-class>\n\
    ```"
  merge: -1
