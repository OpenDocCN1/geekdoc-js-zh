  md: "The user interface in the html5.jsp page consists mainly of a div element called\
    \ progressBar\n\nThere are two things to note from the form. First, the input\
    \ element identified as files has a multiple attribute to support multiple file\
    \ selection. Second, the is not a submit button. So, clicking it will not submit\
    \ the containing form. In fact, the script uses the XMLHttpRequest object to do\
    \ the upload.\n\nNow, let's look at the Javascript code. This assumes some knowledge\
    \ of the scripting language.\n\nWhen the script is executed, the first thing it\
    \ does is allocate space for four variables.\n\n```\nvar totalFileLength, totalUploaded,\
    \ fileCount, filesUploaded;\n```\n\nThe totalFileLength variable holds the total\
    \ length of the files to be uploaded. totalUploaded is the number of bytes uploaded\
    \ so far. fileCount contains the number of files to be uploaded, and filesUploaded\
    \ indicates the number of files that have been uploaded.\n\nThen the function\
    \ assigned to window.onload is called after the window loads.\n\n```\nwindow.onload\
    \ = function() {\n  document.getElementById('files').addEventListener(\n    'change',\
    \ onFileSelect, false);\n  document.getElementById('uploadButton').\n    addEventListener('click',\
    \ startUpload, false);\n}\n```\n\nThis maps the files input element's change event\
    \ with the onFileSelect function and the button's click event with startUpload.\n\
    \nThe change event occurs every time the user changes a different set of files\
