  md: '# Directives


    Directives are the first type of JSP syntactic elements. They are instructions
    for the JSP translator on how a JSP page should be translated into a servlet.
    There are several directives defined in JSP 2.3, but only the two most important
    ones, **page** and **include**, are discussed in this appendix. The other directives
    are **taglib**, **tag**, **attribute**, and **variable.**'
  merge: -1
  pgno: 449
- img_proc: true
  md: '# The page Directive


    You use the page directive to the JSP translator on certain aspects of the current
    JSP page. For example, you can tell the JSP translator the size of the buffer
    that should be used for the out implicit object, what content type to use, what
    Java types to import, and so on.


    The page directive has the following syntax:


    ```

    <@ page attribute1="value1" attribute2="value2" ... %>

    ```


    The space between @ and page is optional and attribute1, attribute2, and so are
    on the page directive''s attributes. Here is the list of attributes for the page
    directive.


    +   * import. Specifies a type or Java types that will be imported and used by
    the Java code in this page. For example, specifying import="java.util.List" imports
    the List interface. You can use the wildcard * to import the whole package, such
    as in import="java.util.*". To import multiple types, separate types with a comma,
    such as in import="java.util.ArrayList, java.util.Calendar, java.io.PrintWriter".
    All types in the following packages are implicitly imported: java.lang, java.servlet,
    java.servlet.http, java.servlet.jsp.

    * session. A value of true indicates that this page participates in session management,
    and a value of false indicates otherwise. By default, the value is true, which
    means the invocation of a JSP page will cause a javax.servlet.http.HttpSession
    instance to be created if one does not yet exist.

    * buffer. Specifies the size of the out object in kilobytes. The suffix kb is
    mandatory. The default buffer size is 8kb or more, depending on the JSP container.
    It is also possible to assign none to this attribute to indicate that no buffering
    be used, which will cause the output to be written directly to the corresponding
    PrintWriter.

    * autoFlush. A value of true, indicates that the buffered output should be flushed
    automatically when the buffer is full. A value of false indicates that the buffer
    is only flushed if the flush method of the response implicit object is called.
    Consequently, an exception will be thrown in the event of buffer overflow.

    * isThreadSafe. Indicates the level of thread safety implemented in the page.
    JSP authors are advised against using this attribute as it could result in a generated
    servlet containing deprecated code.

    * info. Specifies the return value of the getServletInfo method of the generated
    servlet.

    * errorPage. Indicates the page that will handle errors that may occur in this
    page.

    * isErrorPage. Indicates if this page is an error handler.

    * contentType. Specifies the content type of the response implicit object of this
    page. By default, the value is text/html.

    * pageEncoding. Specifies the character encoding for this page. By default, the
    value is ISO-8859-1.

    * isELigned. Indicates whether EL expressions are ignored.

    * language. Specifies the scripting language used in this page. By default, its
    value is java and this is the only valid value in JSP 2.2.

    * extends. Specifies the superclass that this JSP page''s implementation class
    must'
  merge: -1
  pgno: 450
- img_proc: true
  md: 'extend. This attribute is rarely used and should only be used with extra caution.

    - deferredSyntaxAllowedAsLiteral. Specifies whether or not the character sequence
    # is allowed as a String literal in this page and translation unit. The default
    value is false. # is important because it is a special character sequence in the
    Expression Language.

    - trimDirectiveWhites. Indicates whether or not text that contains only white
    spaces is removed from the output. The default is false; in other words, not to
    trim spaces.


    The page directive can appear anywhere in a page. The exception is when it contains
    the contentType or the pageEncoding attribute, in which case it must appear before
    any template data and before sending any content using Java code. This is because
    the content type and the character encoding must be set prior to sending any content.


    The page directive can also appear multiple times. However, an attribute that
    appears in multiple page directives must have the same value. An exception to
    this rule is the import attribute. The effect of the import attribute appearing
    in multiple page directives is cumulative. For example, the following page directives
    import both java.util.ArrayList and java.io.File.


    ```

    <@page import="java.util.ArrayList%

    <@page import="java.util.Date%">

    ```


    This is same as


    ```

    <@page import="java.util.ArrayList, java.util.Date%">

    ```


    As another example, here is a page directive that sets the session attribute and
    allocates 16KB to the page buffer:


    ```

    <@page session="false" buffer="16kb%">

    ```'
  merge: -1
  pgno: 451
- img_proc: true
  md: '# The include Directive


    You use the **include** to include the content of another file in the current
    JSP page. You can use multiple include directives in a JSP page. Modularizing
    a particular content into an include file is useful if that content is used by
    different pages or used by a page in different places.


    The syntax of the **include** directive is as follows:


    ```

    <@ include file="url">

    ```


    where the space between @ and **include** is optional and *url* represents the
    relative path to an include file. If url begins with a forward slash (/), it is
    interpreted as an absolute path on the server. If it does not, it is interpreted
    relative to the current JSP page.


    The JSP translator translates the **include** directive by replacing the directive
    with the content of the include file. In other words, if you have written the
    **copyright.jsp** file in Listing D.4.


    # Listing D.4: The copyright.jspf include file


    ```

    <hr/>

    &copy;2015 Brainy Software Inc.

    <hr/>

    ```


    And, you have the **main.jsp** page in Listing D.5.


    # Listing D.5: The main.jsp page


    ```

    <!DOCTYPE html>

    <head>

    <title>Including a file</title></head>

    <body>

    This is the included content: <hr/>

    <@ include file="copyright.jspf"%

    </body>

    </html>

    ```


    Using the **include** directive in the **main.jsp** page has the same effect as
    writing the following JSP page.


    ```

    <!DOCTYPE html>

    <head>

    <title>Including a file</title></head>

    <body>

    This is the included content: <hr/>

    &copy;2015 Brainy Software Inc.

    <hr/>

    </body>

    </html>

    ```


    For the above **include** directive to work, the **copyright.jsp** file must reside
    in the same directory as the include page.'
  merge: -1
  pgno: 452
- img_proc: true
  md: 'By convention an include file has jsp extension, which stands for JSP fragment.
    Today JSP fragments are called JSP segments but the jsp extension is still retained
    for consistency.


    Note that you can also include static HTML files.


    The include action, discussed in the section “Actions” later in this appendix,
    is similar to the include directive. The subtle difference is explained in the
    section “Actions” and it is important you understand the difference between the
    two.'
  merge: -1
