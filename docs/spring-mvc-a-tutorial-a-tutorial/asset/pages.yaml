  md: '# Downloading Spring Manually


    If you do not want to use Gradle or Maven to build your applications, your safest
    bet is to download the Spring libraries from its repository.


    http://repo.spring.io/release/org/springframework/spring/


    Click the link to the latest version (currently version 4.2.5) and select a distribution
    zip file. The name of the distribution zip file has this format:


    spring-framework-x,y.z.RELEASE-dist.zip


    Here, x.y.z indicates the major and minor versions.


    Once you download the zip file, extract it to a folder of your choice. The zip
    file includes documentation and Java sources. The libs folder in the extract directory
    contains the Jar files you need to develop applications with the Spring Framework.'
