- img_proc: true
  md: '# Chapter 10

    Internationalization


    In this era of globalization, it is now more compelling than ever to be able to
    write applications that can be deployed in different countries and regions that
    speak different languages. There are two terms you need to be familiar with in
    this regard. The first is internationalization, often abbreviated to i18n because
    the word starts with an i and ends with an n, and there are 18 characters between
    the first i and the last n. Internationalization is a technique for developing
    applications that support multiple languages and data formats without rewriting
    the programming logic.


    The second term in localization, which is the technique for adapting an internationalized
    application to support a specific locale. A locale is a specific geographical,
    political, or cultural region. An operation that takes a locale into consideration
    is said to be locale-sensitive. For example, displaying a date is locale-sensitive
    because the date must be in the format used by the country or region of the user.
    The fifteenth day of November 2016 is written 11/15/2016 in the US, but printed
    as 15/11/2016 in Australia. For the same region internationalization is abbreviated
    i18n, localization is abbreviated l10n.


    Java was designed with internationalization in mind, employing Unicode for characters
    and strings. Making internationalized applications in Java is therefore easy.
    How you internationalize your applications depends on how much static data needs
    to be presented in different languages. There are two approaches.


    +   1. If a large amount of data is static, create a separate version of the resource
    for each locale. This approach normally applies to web application with lots of
    static HTML pages. This is straightforward and will not be discussed in this chapter.


    +   2. If the amount of static data that needs to be internationalized is limited,
    isolate textual elements as component labels and error messages into text files.
    Each text file stores the translations of all textual elements for a locale. The
    application retrieves each element dynamically. The advantage is clear. Each textual
    element can be edited easily without recompiling the application. This is the
    technique that will be discussed in this chapter.


    This chapter starts by explaining what a locale is. Next comes the technique for
    internationalizing your applications, followed by a Spring MVC example.'
  merge: -1
  pgno: 296
- img_proc: true
  md: "# Locales\n\nThe java.util.Locale class represents a locale. There are three\
    \ main components of a Locale object: language, country, and variant. The language\
    \ is obviously the most important part; however, sometimes the language itself\
    \ is not sufficient to differentiate a locale. For example, the English language\
    \ is spoken in countries such as the US and England. However, the English language\
    \ spoken in the US is not exactly the same as the one used in the UK. Therefore,\
    \ it is necessary to specify the country of the language. Another example, the\
    \ Chinese language used in China is not exactly the same as the one used in Taiwan.\n\
    \nThe variant argument is a vendor- or browser-specific code. For example, you\
    \ use WIN for Windows, MAC for Macintosh, and POSIX for POSIX. Where there are\
    \ two variants, separate them with an underscore, and put the most important one\
    \ first. For example, a Traditional Spanish collision might construct a locale\
    \ with parameters for language, country, and variant as es, ES, Traditional_WIN,\
    \ respectively.\n\nTo construct a Locale object, use one of the Locale class's\
    \ constructors.\n\n```\npublic Locale(java.lang.String language)\npublic Locale(java.lang.String\
    \ language, java.lang.String country)\npublic Locale(java.lang.String language,\
    \ java.lang.String country,\n      java.lang.String variant)\n```\n\nThe language\
    \ code is a valid ISO language code. Table 10.1 displays examples of language\
    \ codes.\n\nThe country argument is a valid ISO country code, which is a two-letter,\
    \ uppercase code specified in ISO 3166 (http://minipage.chemie.fu-berlin.de/diverse/doc/ISO_3166.html).\
    \ Table 10.2 lists some of the country codes in ISO 3166.\n\n| Code | Language\
    \ |\n|---|--|\n| de | German |\n| el | Greek |\n| en | English |\n| es | Spanish\
    \ |\n| fr | French |\n| hi | Hindi |\n| it | Italian |\n| ja | Japanese |"
  merge: -1
