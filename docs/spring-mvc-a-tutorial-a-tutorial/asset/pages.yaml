  md: '# Chapter 5


    # Data Binding and the Form Tag Library


    Data binding is a feature that binds user input to the domain model. Thanks to
    data binding, HTTP request parameters, which are always of type String, can be
    used to populate object properties of various types. Data binding also makes form
    beans (e.g. instances of ProductForm in the previous chapters) redundant.


    To use data binding effectively, you need the Spring form tag library. This chapter
    explains data binding and the form tag library and provides examples that highlight
    the use of the tags in the form tag library.'
  merge: -1
  pgno: 121
- img_proc: true
  md: "# # Data Binding Overview\n\nDue to the nature of HTTP, all HTTP request parameters\
    \ are strings. Recall that in the previous chapters you had to parse a string\
    \ to a BigDecimal in order to get the correct product price. To refresh your memory,\
    \ here is some code from the ProductController class's saveProduct method in the\
    \ sample applications in Chapter 4.\n\n```\n@RequestMapping(value=\"save-product\"\
    )\npublic String saveProduct(Product productForm, Model model) {\n    logger.info(\"\
    saveProduct called\");\n    // no need to create and instantiate a ProductForm\n\
    \    // Create Product\n    Product product = new Product();\n    product.setName(productForm.getName());\n\
    \    product.setDescription(productForm.getDescription());\n    try {\n      \
    \  product.setPrice(new BigDecimal(productForm.getPrice()));\n    } catch (NumberFormatException\
    \ e) {\n```\n\nYou had to parse the price property in the ProductForm because\
    \ it was a String and you needed a BigDecimal to populate the Product's price\
    \ property. With data binding you can replace the saveProduct method fragment\
    \ above with this.\n\n```\n@RequestMapping(value=\"save-product\")\npublic String\
    \ saveProduct(Product product, Model model)\n```\n\nThanks to data binding, you\
    \ don't need the ProductForm class anymore and no parsing is necessary for the\
    \ price property of the Product object.\n\nAnother benefit of data binding is\
    \ repopulating an HTML form when input validation fails. With manual HTML coding,\
    \ you have to worry about repopulating the input fields with the values you previously\
    \ entered. With Spring data binding and the form tag library, this is taken care\
    \ of you."
  merge: -1
  pgno: 122
- img_proc: true
  md: '# The Form Tag Library


    The form tag library contains tags you can use to render HTML elements in your
    JSP pages. To use the tags, declare this taglib directive at the top of your JSP
    pages.


    ```

    <@taglib prefix="form"

    uri="http://www.springframework.org/tags/form" %>

    ```


    Table 5.1 shows the tags in the form tag library.


    Each of the tags will be explained in the following subsections. A sample application
    presented in the section, “Data Binding Example” demonstrates the use of data
    binding with the form tag library.


    | Tag | Description |

    |---|---|

    | form | Renders a form element. |

    | input | Renders an <input type="text">/> element |

    | password | Renders an <input type="password">/> element |

    | hidden | Renders an <input type="hidden">/> element |

    | textarea | Renders a textarea element |

    | checkbox | Renders an <input type="checkbox">/> element |

    | checkboxes | Renders multiple <input type="checkbox">/> element |

    | radiobutton | Renders an <input type="radio">/> element |

    | radiobuttons | Renders multiple <input type="checkbox">/> element |

    | select | Renders a select element |

    | option | Renders an option element. |

    | options | Renders a list of option elements. |

    | errors | Renders field errors in a span element. |


    Table 5.1: The Form tags'
  merge: -1
  pgno: 123
- img_proc: true
  md: "# The form Tag\n\nThe form tag renders an HTML form. You must have a form tag\
    \ to use any of the other tags that render a form input field. The attributes\
    \ of the form tag are given in Table 5.2.\n\n| Attribute | Description |\n| ---\
    \ | --- |\n| acceptCharset | Specifies the list of character encodings accepted\
    \ by the server. |\n| commandName | The name of the model attribute under which\
    \ the form object is exposed. The default is 'command'. |\n| cssClass | Specifies\
    \ the CSS class to be applied to the rendered form element. |\n| cssStyle | Specifies\
    \ the CSS style to be applied to the rendered form element |\n| htmlEscape | Accepts\
    \ true or false indicating whether or not the rendered value(s) should be HTML-escaped.\
    \ |\n| modelAttribute | The name of the model attribute under which the form-backing\
    \ object is exposed. The default is 'command'. |\n\n**Table 5.2: The form's attributes**\n\
    \nAll attributes in Table 5.2 are optional. The table does not include HTML attributes,\
    \ such as **method** and **action**.\n\nThecommandName** attribute is probably\
    \ the most important attribute as it specifies the name of the model attribute\
    \ that contains a backing object whose properties will be used to populate the\
    \ generated form. If this attribute is present, you must add the corresponding\
    \ model attribute in the request-handling method that returns the view containing\
    \ this form. For instance, in the `tags`-demo application that accompanies this\
    \ chapter, the following **form tag** is specified in the **BookAddForm.jsp**.\n\
    \nThe **input** method in the **Controller** class is the request-handling method\
    \ that returns **BookAddForm.jsp**. Here is the **input** method.\n\n```\n<form:commandName=\"\
    book\" action=\"save-book\" method=\"post\">\n\n</form>\n```\n\n```\n@RequestMapping(value=\"\
    /input-book\")\npublic String inputBook(Book model) {\n    ...\n    model.addAttribute(\"\
    book\", new Book());\n    return \"BookAddForm\";\n}\n```\n\nAs you can see, a\
    \ Book object is created and added to the **Model** with attribute name **book**.\
    \ Without the model attribute, the **BookAddForm.jsp** page will throw an exception"
