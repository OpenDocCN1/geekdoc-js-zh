  md: "# Writing Request-Handling Methods\n\nA request-handling method can have a\
    \ mix of argument types as well as one of a variety of return types. For example,\
    \ if you need to access the HttpServlet object in your method, you can add HttpSession\
    \ as an argument and Spring will pass the correct object for you:\n\n```\n```java\n\
    @RequestMapping(\"/uri\")\npublic String myMethod(HttpSession session) {\n   \
    \ ...\n    session.addAttribute(key, value);\n}\n```\n```\n\nOr, if you need the\
    \ client locale and the HttpServletRequest, you can include both as method arguments\
    \ like this:\n\n```\n```java\n@RequestMapping(\"/uri\")\npublic String myOtherMethod(HttpServletRequest\
    \ request,\nLocale locale) {\n    ...\n    // access Locale and HttpServletRequest\
    \ here\n}\n```\n```\n\nHere is the list of argument types that can appear as arguments\
    \ in a request-handling method.\n\n+   - java.servlet.ServletRequest or java.servlet.http.HttpServletRequest\n\
    - java.servlet.ServletResponse or java.servlet.http.HttpServletResponse\n- java.servlet.http.HttpSession\n\
    - org.springframework.web.context.request.WebRequest or\norg.springframework.web.context.request.NativeWebRequest\n\
    - java.util.Locale\n- java.io.InputStream or java.io.Reader\n- java.io.OutputStream\
    \ or java.io.Writer\n- java.security.Principal\n- HttpEntity<?> parameters\n-\
    \ java.util.Map / org.springframework.ui.ModelMap /\n- org.springframework.web.servlet.mvc.RedirectAttributes\n\
    - org.springframework.framework.validation.Errors /\n- org.springframework.framework.validation.BindingResult\n\
    - Command or form objects\n- org.springframework.web.bind.SessionStatus\n- org.springframework.web.util.UiComponentsBuilder\n\
    - Types annotated with @PathVariable, @MatrixVariable, @RequestParam,\n@Request,\
    \ @RequestBody, or @RequestPart."
