  md: '# Chapter 11


    # File Upload


    Once upon a time long after Servlet technology had emerged, file upload programming
    was still a challenging task that involved parsing raw responses on the server
    side. To alleviate the pain, developers would resort to commercial file upload
    components. Fortunately, in 2003 the Apache Software Foundation released its open
    source Commons FileUpload component, which soon became a hit with servlet/JSP
    programmers worldwide.


    It took years before the designers of Servlet realized that file upload was essential,
    file upload was finally a built-in feature in Servlet 3. Servlet 3 developers
    do not have to import the Commons FileUpload component into their projects anymore.


    As such, there are two methods for handling file upload in Spring MVC:


    +   1. By using Apache Commons FileUpload component.

    2. By taking advantage of Servlet 3.0 or later built-in support. You can only
    use this approach if you will deploy your application to a container that supports
    Servlet 3.0 or later.


    No matter approach you choose, you''ll be using the same Spring API to handle
    the uploaded files. This chapter shows how to make use of the Commons FileUpload
    and Servlet 3 file upload feature in a Spring MVC application that need support
    for file upload. In addition, it also demonstrates how you can enhance user experience
    with HTML5.'
  merge: -1
  pgno: 312
