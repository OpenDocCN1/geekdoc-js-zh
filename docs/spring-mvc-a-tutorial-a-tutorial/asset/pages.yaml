  md: "# Converters\n\nA Spring converter is an object that converts a type to another\
    \ type. For example, user input for a date can be in many forms. “December 25,\
    \ 2016,” “12/25/2016,” “2016-12-25” can all represent the same date. By default,\
    \ Spring expects the input to be in the same pattern as the current locale, which\
    \ is probably in MM/dd/yyyy format if you live in the United States. If you want\
    \ to Spring use a different date pattern when binding an input string to a LocalDate,\
    \ you need to write a string-to-date converter. The java.time.LocalDate class\
    \ is a new type in Java 8 that replaces java.util.Date. You should use the new\
    \ Date/Time API instead of the old Date and Calendar classes.\n\nTo create a converter,\
    \ you must write a Java class that implements the org.springframework.core.converter.Converter\
    \ interface. The declaration of this interface is parameterized:\n\n```\npublic\
    \ interface Converter<S, T>\n```\n\nHere, S represents the source type and T the\
    \ target type. For instance, create a converter that can convert a Long to a LocalDate,\
    \ you would declare your converter class like so.\n\n```\npublic class MyConverter\
    \ implements Converter<Long, LocalDate> { }\n```\n\nIn your class body, you need\
    \ to write an implementation of the convert method from the Converter interface.\
    \ The signature of the method is as follows.\n\n```\nT convert(S source)\n```\n\
    \nFor example, Listing 6.1 shows a converter that can work with any date pattern.\n\
    \n+   Listing 6.1: The SpringToLocalDate converter\n\n```\npackage converter;\n\
    import java.time.LocalDate;\nimport java.time.format.DateTimeFormatter;\nimport\
