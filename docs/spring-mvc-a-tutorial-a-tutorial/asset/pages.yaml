  md: '# map


    This method maps each element in a stream and returns another stream that contains
    the mapping results. This method accepts a lambda expression that will be used
    in the mapping.


    For example, this map method takes a lambda expression x -> 2 * x, which practically
    doubles each of the elements and return them in a new stream.


    ```

    ${[1, 3, 5].stream().map(x -> 2 * x).toList()}

    ```


    Executed, this expression returns this List:


    +   [2, 6, 10]


    As another example, this map method capitalizes a stream of strings.


    ```

    ${cities.stream().map(x -> x.toUpperCase()).toList()}

    ```


    It returns the following List.


    +   [PARIS, STRASBOUR, LONDON, NEW YORK, BEIJING, AMSTERDAM, SAN FRANCISCO]'
