  md: '# Summary


    Testing is an important step in software development and there are two types of
    tests that you should perform early in your development cycle, unit testing and
    integration testing. Unit testing verifies the functionality of a class without
    dependencies. In unit testing, dependencies are commonly replaced by test doubles,
    which may include dummies, stubs, spies, fakes, and mock objects. JUnit is a popular
    framework that aids in unit testing and is often used in conjunction with a mocking
    framework such as Mockito or EasyMock.


    Integration testing makes sure that different modules in the same application
    can work together and request mapping and data binding also work. Spring Test
    MVC is a Spring module that provides an API that makes it easy to perform integration
    testing on Spring applications. In this chapter you have learned how to use Spring
    Test MVC.'
  merge: -1
  pgno: 383
