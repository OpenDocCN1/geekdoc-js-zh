  md: '# # Installing the Spring Tool Suite (STS)


    The Spring Tool Suite is an Eclipse-based integrated development environment (IDE).
    It is an excellent tool suite and is probably the best IDE for working with Spring
    framework. It is also a one stop shop that includes other libraries and applications
    that you need for Spring MVC application development. For example, it ships with
    Maven and the developer edition Pivotal tc Server, a modified Tomcat. If you have
    not decided which IDE to use, I would recommend that you get the STS a try.


    To starting with STS, first download it from this web page:


    https://spring.io/tools/sts


    The STS is distributed as a zip file. Once you download the zip file, extract
    the content to a directory of your choice. The zip file contains an sts-bundle
    directory that in turn contains three directories:


    +   1. **Legal license agreements of various tools.**

    2. **pivotal-tc-server-developer-x.y.z.RELEASE.** Contains Pivotal tc Server developer
    version x,y.z.

    3. **sts-x.y.z.RELEASE.** Contains STS, where x,y.z is the major and minor versions
    of STS.


    You will find an STS.exe in the Windows version and a STS file in the Linux version
    of this distribution. Double-click the exe file or run the STS file from the command
    line to launch STS. If it is the first time you run STS, you will be prompted
    to select a workspace. Click **OK** and you will see the STS main page, like that
    in Figure B.1.


    ![](img/9df6b4b4bce0bca1a5859c20a724e196_392_0.png)


    Figure B.1: The STS welcome page'
