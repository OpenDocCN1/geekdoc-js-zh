  md: '# Summary


    In this chapter you have learned about the Model 2 architecture, which is based
    on the MVC pattern, and how to write Model 2 applications using either a servlet
    controller or a filter dispatcher. These two types of Model 2 applications were
    demonstrated in appdesign1 and appdesign2, respectively. One clear advantage of
    using a servlet as the controller over a filter is that you can configure the
    servlet as a welcome page. In a Model 2 application, JSP pages are often used
    as the view, even though other technologies such as Apache Velocity and FreeMarker
    can also be used. If JSP pages are used as the view in a Model 2 architecture,
    those pages are used to display values only and no scripting elements should be
    present in them.


    In this chapter you have also built a simple MVC framework incorporating a validator
    and equips it with a dependency injector. While the homemade framework serves
    as a good educational tool, going forward you should base your MVC projects on
    a mature MVC framework like Spring MVC and not try to reinvent the wheel.'
