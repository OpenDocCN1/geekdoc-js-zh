- img_proc: true
  md: '# # Downloading and Configuring Tomcat


    You should first download the latest version of Tomcat from http://tomcat.apache.org.
    You should get the latest distribution in either zip or gz. Tomcat 8 requires
    JRE 7 or JDK 7 to run. Earlier versions of Tomcat required a JDK because they
    needed a Java compiler to compile code in JSP pages. Tomcat 5.5 and later bundle
    Eclipse Java compiler so they no longer require a JDK.


    After you download the zip or gz file, unpack the file. You will see several directories
    under the installation directory.


    In the bin directory, you will find programs to start and stop Tomcat. The webapps
    directory is important because you can deploy your applications there. In addition,
    the conf directory contains configuration files, including the server.xml and
    tomcat-users.xml. The lib directory is also of interest since it contains the
    Servlet and JSP APIs that you need to compile your servlets and custom tags.


    After extracting the zip or gz file, set the JRE_HOME or JAVA_HOME environment
    variable to a JRE or JDK installation directory. The easiest way to do so is by
    creating a setenv.sh file (in Linux or Mac OSX) or setenv.bat file (in Windows)
    in Tomcat’s bin directory. This file should contain a single line of code that
    will be executed when Tomcat is started.


    Here is an example setenv.sh file:


    ```

    JRE_HOME=/opt/java/jdk1.7.0_79

    ```


    And, here is a sample setenv.bat file:


    ```

    JAVA_HOME=C:\Program Files\Java\jdk1.7.0_06

    ```


    Windows users can also download and configure Tomcat using a Windows installer,
    which can be downloaded from Tomcat’s website.'
  merge: -1
  pgno: 385
- img_proc: true
  md: '# Starting and Stopping Tomcat


    Once you’ve downloaded and extracted a Tomcat binary, you can start Tomcat by
    running the **startup.bat** (on Windows) or the **startup.sh** file (on Unix/Linux/Mac
    OS). Both files reside under the **bin** directory of Tomcat’s installation directory.
    By default, Tomcat runs on port 8080, so you can test Tomcat by directing your
    browser to this address:


    ```

    http://localhost:8080

    ```


    To stop Tomcat, run the **shutdown.bat** (on Windows) or **shutdown.sh** file
    (on Unix/Linux/Mac OS) in the **bin** directory.'
