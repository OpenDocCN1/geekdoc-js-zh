  md: "# The Set Tag\n\nYou can use the set tag to do the following.\n\n+   1. Create\
    \ a string and a scoped variable that references the string.\n2. Create a scoped\
    \ variable that references an existing scoped object.\n3. Set the property of\
    \ a scoped object.\n\nIf set is used to create a scoped variable, the variable\
    \ can be used throughout the same JSP page after the occurrence of the tag.\n\n\
    The set tag's syntax has four forms. The first form is used to create a scoped\
    \ variable in which the value attribute specifies the string to be created or\
    \ an existing scoped object.\n\n```\n<c:set value=\"value\" var=\"varName\"\n\
    \  scope=\"{page|request|session|application}\"/>\n```\n\nwhere the scope attribute\
    \ specifies the scope of the scoped variable.\n\nFor instance, the following set\
    \ tag creates the “The wisest fool” and assigns it to the newly created page-scoped\
    \ variable foo.\n\n```\n<c:set var=\"foo\" value=\"The wisest fool\"/>\n```\n\n\
    The set tag creates a scoped variable job that references the request-scoped object\
    \ position. The variable job has a page scope.\n\n```\n<c:set var=\"job\" value=\"\
    ${requestsScope.position}\" scope=\"page\"/>\n```\n\n# Note\n\nThe last example\
    \ might be a bit confusing because it created a page-scoped variable that references\
    \ a request-scoped object. This should not be if you bear in mind the scoped object\
    \ itself is not really “inside” the HttpServletRequest. Instead, a reference (named\
    \ position) exists that references the object. With the set tag in the last example,\
    \ you were simply creating another scoped variable (job) that referenced the same\
    \ object.\n\nThe second form is similar to the first form, except that the string\
    \ to be created or the scoped object to be referenced is passed as the body content.\n\
    \n```\n<c:set var=\"varName\" scope=\"{page|request|session|application}\"\n \
    \ body content\n</c:set>\n```\n\nThe second form allows you to have JSP content\
    \ in the body content.\n\nThe third form sets the value of a scoped object's property.\
    \ The target attribute specifies the scoped object and the property attribute\
    \ specifies the scoped object's property. The value to assign to the property\
    \ is specified by the value attribute attribute.\n\n```\n<c:set target=\"target\"\
    \ property=\"propertyName\" value=\"value\"/>\n```"
  merge: -1
  pgno: 249
- img_proc: true
  md: 'For example, the following set tag assigns the string "Tokyo" to the city property
    of the scoped object address.


    ```

    <c:set target="${address}" property="city" value="Tokyo"/>

    ```


    Note that you must use an EL expression in the target attribute to reference the
    scoped object.


    The fourth form is similar to the third form, but the value to assign is passed
    as body content.


    ```

    <c:set target="target" property="propertyName">

    body content

    </c:set>

    ```


    For example, the following set tag assigns the string "Beijing" to the city property
    of the scoped object address.


    ```

    <c:set target="${address}" property="city">Beijing</c:set>

    ```


    The list of the set tag''s attributes is given in Table 9.3.


    | Attribute | Type | Description |

    | --- | --- | --- |

    | value+ | Object | The string to be created, or the scoped object to reference,
    or the new property value. |

    | var | String | The scoped variable to be created. |

    | scope | String | The scope of the newly created scoped variable. |

    | target+ | Object | The scoped object whose property will be assigned a new value;
    this must be a Java instance or a java.util.Map object. |

    | property+ | String | The name of the property to be assigned a new value. |


    Table 9.3: The set tag''s attributes'
