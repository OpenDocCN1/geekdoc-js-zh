- img_proc: true
  md: '# Chapter 8


    # The Expression Language


    One of the most important features in JSP 2.0 was the Expression Language (EL),
    which JSP authors can use to access application data. Inspired by both the ECMAScript
    and the XPath expression languages, the EL is designed to make it possible and
    easy to author script-free JSP pages, that is, pages that do not use JSP declarations,
    expressions or scriptlets. (Chapter 11, “Application Design” explains why script-free
    JSP pages are considered good practice.)


    This chapter shows how you can use EL expressions to display data and object properties
    in your JSP pages. It covers the EL 3.0, the latest release of the technology.


    All examples in this chapter can be found in the el-demo project in the zip file
    that accompanies this book.'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# A Brief History of the Expression Language


    The EL that was adopted into JSP 2.0 first appeared in the JSP Standard Tag Library
    (JSTL) 1.0 specification. JSP 1.2 programmers could use the language by importing
    the standard libraries into their applications. JSP 2.0 and later developers can
    use the EL without JSTL, even though JSTL is still needed in many applications
    as it also contains tags not related to the EL.


    The EL in JSP 2.1 and JSP 2.2 is an attempt to unify the EL in JSP 2.0 and the
    expression language defined in JavaServer Faces (JSF) 1.0. JSF is a framework
    for rapidly building web applications in Java. Because JSP 1.2 lacked an integrated
    expression language and the EL did not meet all the requirements of JSF, a variant
    of the EL was developed for JSF 1.0. The two language variants were unified.


    As of version 3.0, which was released in May 2013 under JSR 341, the EL is no
    longer part of JSP or any other technologies. An independent specification, the
    EL 3.0 adds support for lambda expressions and allows for collection manipulation.
    The lambda support in the EL 3.0 does not require Java SE 8. Java SE 7 is good
    enough.'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# The Expression Language Syntax


    An EL expression can be specified using one of these two constructs:


    ```

    ${expression}

    #{expression}

    ```


    For example, to write the expression x+y, you use the following construct:


    ```

    ${{x+y}

    ```


    or


    ```

    #{x+y}

    ```


    Both ${exp} and #{exp} constructs are evaluated in the same way by the EL engine.

    However, when the EL is not being used as a stand-alone engine but rather with
    an underlying technology, such as JSF or JSP, that technology may interpret the
    constructs differently. For instance, in JSF the ${exp} construct is said for
    immediate evaluation and the #{expr} construct for deferred evaluation. An expression
    is said to use deferred evaluation when the expression is not evaluated until
    its value is needed by the system. The other hand, expressions that require immediate
    evaluation are compiled when the containing JSP page is compiled and executed
    when the JSP page is executed. In addition, in JSP 2.1 and later, #{exp} expressions
    are only allowed in tag attributes that accept deferred expressions and cannot
    be used elsewhere.


    It is common to concatenate two expressions. A sequence of expressions will be
    evaluated from left to right, coerced to Strings, and concatenated. If a+b equals
    8 and c+d equals 10, the following two expressions yield 810:


    ```

    ${a+b}${c+d}

    ```


    And ${a+b}${c+d} results in 8and10.


    If an EL expression is used in an attribute value of a custom tag, the expression
    will be evaluated and the resulting string coerced to the attribute''s expected
    type:


    ```

    <my:tag someAttribute="${expression}/>

    ```


    The ${} sequence of characters denotes the beginning of an EL expression. If you
    want to send the literal ${ instead, you need to escape the first character: \${}.'
  merge: -1
