  md: '# Application Directory Structure


    A servlet application must be deployed in a certain directory structure. Figure
    C.2 shows the directory structure for this application.


    ![](img/9df6b4b4bce0bca1a5859c20a724e196_413_0.png)


    Figure C.2: The application directory


    The web directory at the top of the structure is the application directory. Under
    the application directory is a WEB-INF directory. It may have the following subdirectories,
    both optional:


    +   * classes. Your servlet classes and other Java classes must reside here. The
    directories under classes reflect the class package. In Figure C.2 there is one
    class deployed, servletapi1.MyServlet.


    +   * lib. Deploy jar files required by your servlet application here. Because
    the servlet container already has a copy of it.


    A servlet/JSP application normally has JSP pages, HTML files, image files, and
    other subdirectories. These should go under the application directory and are
    often organized in subdirectories. For instance, all image files can go to an
    image directory, all JSP pages to jsp, and so on.


    Any resource you put under the application directory is directly accessible to
    the user by typing the URL to the resource. If you want to include a resource
    that can be accessed by a servlet but not accessible to the user, put it in under
    WEB-INF or a directory under it.'
  merge: -1
