  md: "# The ProductForm Class\n\nA class is mapped to an HTML form. It is the representation\
    \ of the HTML form on the server. The ProductForm class, given in Listing 2.2,\
    \ contains the String values of a product. At a glance the ProductForm class is\
    \ similar to the Product class and you might question why ProductForm needs to\
    \ exist at all. A form object, as you can see in the section \"Validators\" later\
    \ in this chapter, passing the ServletRequest to is a servlet-specific type and\
    \ should not be exposed to the other layers of the applications.\n\nThe second\
    \ purpose of a form object is to preserve and redisplay user input in its original\
    \ form if input validation fails. You will learn how to do this in the section\
    \ \"Validators\" later in this chapter.\n\nNote that most of the time a form class\
    \ does not have to implement Serializable\\as form objects are readily stored\
