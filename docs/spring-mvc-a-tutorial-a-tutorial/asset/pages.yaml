- img_proc: true
  md: "# Writing and Compiling the Servlet Class\n\nAfter making sure you have a servlet\
    \ container on your local machine, the next step is to write and compile a servlet\
    \ class. The servlet class for this example, MyServlet, is given in Listing C.1.\
    \ By convention, the name of a servlet class is suffixed with Servlet.\n\nListing\
    \ C.1: The MyServlet class\n\n```\npackage servletapi1;\nimport java.io.IOException;\n\
    import java.io.PrintWriter;\nimport javax.servlet.Servlet;\nimport javax.servlet.ServletConfig;\n\
    import javax.servlet.ServletException;\nimport javax.servlet.ServletRequest;\n\
    import javax.servlet.ServletResponse;\nimport javax.servlet.annotation.WebServlet;\n\
    \n@WebServlet(name = \"MyServlet\", urlPatterns = { \"/my\" })\npublic class MyServlet\
    \ implements Servlet {\n\n    private ServletConfig servletConfig;\n\n    @Override\n\
    \    public void init(ServletConfig servletConfig)\n        throws ServletException\
    \ {\n        this.servletConfig = servletConfig;\n    }\n\n    @Override\n   \
    \ public ServletConfig getServletConfig() {\n        return servletConfig;\n \
    \   }\n\n    @Override\n    public String getServletInfo() {\n        return \"\
    My Servlet\";\n    }\n\n    @Override\n    public void service(ServletRequest\
    \ request,\n        ServletResponse response) throws ServletException {\n    \
    \    IOException {\n        String servletName = servletConfig.getServletName();\n\
    \        response.setContentType(\"text/html\");\n        PrintWriter writer =\
    \ response.getWriter();\n        writer.print(\"<!DOCTYPE html\")\n          \
    \  + \"<body>Hello from \" + servletName\n            + \"</body></html>\");\n\
    \    }\n\n    @Override\n    public void destroy() {\n    }\\}\n```"
  merge: -1
  pgno: 411
- img_proc: true
  md: "}\nThe first thing that you may notice when reading the code in Listing C.1\
    \ is this annotation.\n\n```\n@WebServlet(name = \"MyServlet\") annotation type\
    \ is used to declare a servlet. You can declare the servlet as\nwell as tell the\
    \ container that URL invokes the servlet. The name attribute is optional\nand,\
    \ present, ordinarily given the name of the servlet class. What's important is\
    \ the\nurlPatterns attribute, which is also optional but almost always present.\
    \ In MyServlet,\nurlPattern tells the container that the pattern/my should invoke\
    \ the servlet.\n```\n\nNote that a URL pattern must begin with a forward slash.\n\
    The servlet's init method is called once and sets the private transient servletConfig\n\
    variable to the ServletConfig object passed to the method.\n\n```\ntransient ServletConfig\
    \ servletConfig;\n@Override\npublic void init(ServletConfig servletConfig)\n \
    \   throws ServletException {\n    this.servletConfig = servletConfig;\n}\n```\n\
    \nYou need to assign the ServletConfig passed to init to a class variable if you\
    \ intend to use\nthe ServletConfig inside your servlet.\nThe service method sends\
    \ the String \"Hello from MyServlet\" to the browser. service is\ninvoked for\
    \ every incoming HTTP request that targets the servlet.\n\nIf you are using an\
    \ IDE, you never have to worry about having to compile a servlet\nclass manually.\
    \ If you are not using an IDE, to compile the servlet you have to include the\n\
    types in the Servlet API in your class path. Tomcat comes with the servlet-api.jar\
    \ file that\npackages members of the javax.servlet and javax.servlet.http packages.\
    \ The jar file is\nlocated in the lib directory under Tomcat's installation directory."
