  md: '# Model with A Filter Dispatcher


    While a servlet is the most common controller in a Model 2 application, a filter
    can act as a controller too. Note, however, a filter does not have the privilege
    to act as a welcome page. Simply typing the domain name won''t invoke a filter
    dispatcher. Struts 2 uses a filter as a controller because the filter is used
    to serve static contents.


    The following example (appdesign2) is a Model 2 application that uses a filter
    dispatcher. The directory structure of appdesign2 is shown in Figure 2.5.


    ![](img/9df6b4b4bce0bca1a5859c20a724e196_56_0.png)


    Figure 2.5: appdesign2 directory structure


    The JSP pages and the Product class are the same as the ones in appdesign1. However,
    instead of a servlet as controller, you have a filter called FilterDispatcher
    (given in Listing 2.7).


    # Listing 2.7: The DispatcherFilter class


    ```

