- img_proc: true
  md: "# Using String.join()\n\nThis second solution works because the EL 3.0 allows\
    \ you to reference static methods. It so happens that Java 8 adds some new static\
    \ methods to the String class. One of the methods, join, is exactly the solution\
    \ I was looking for. There are two overloads of join, but here is the one that\
    \ is of interest.\n\n```\npublic static String join(CharSequence delimiter,\n\
    \    Iterable<? extends CharSequence> elements)\n```\n\nThis method returns a\
    \ String composed of copies of the CharSequence elements joined together with\
    \ a copy of the specified delimiter. This is perfect because the java.util.Collection\
    \ interface extends Iterable. Therefore, you can pass a Collection to join().\n\
    \nFor example, here is how you would format a List as an HTML ordered list:\n\n\
    ```\n${\\<ol><li>\" += String.join(\"</li><li>\", cities) += \"</li></ol>\"}\n\
    ```\n\nThis expression is good for collections with at least one element. If there\
    \ is a possibility that you are dealing with an empty collection, here is a better\
    \ expression:\n\n```\n${\\empty cities? \"\" : \"<ol><li>\"\n    += String.join(\"\
    </li><li>\", cities.stream().sorted().toList())\n    += \"</li></ol>\"}\n```"
  merge: -1
