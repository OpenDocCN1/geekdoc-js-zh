  md: '# ServletRequest


    For every HTTP request, the servlet container creates an instance of ServletRequest
    and passes it to the servlet''s service method. The ServletRequest encapsulates
    information about the request.


    These are some of the methods in the ServletRequest interface.


    ```

    public int getContentLength()

    ```


    Returns the number of bytes in the request body. If the length is not known, the
    method returns -1.


    ```

    public java.lang.String getContentType()

    ```


    Returns the MIME type of the request body or null if the type is not known.


    ```

    public java.lang.String getParameter(java.lang.String name)

    ```


    Returns the value of the specified parameter.


    ```

    public java.lang.String getProtocol()

    ```


    Returns the name and version of the protocol of this HTTP request.


    **getParameter** is the most frequently used method in ServletRequest. A common
    use of this method is to return the value of an HTML form field. You''ll learn
    how you can retrieve values in the section “Working with Forms” later in this
    appendix.


    **getParameter** can also be used to get the value of a query string. For example,
    if a servlet is invoked using this URI


    ```

    http://domain/context/servletName?id=123

    ```


    you can retrieve the value of id from inside your servlet using this statement:


    ```

    String id = request.getParameter("id")

    ```


    Note that **getParameter** returns null if the parameter does not exist.


    In addition to **getParameter**, you can also use **getParameterNames**, **getParameterMap**,
    and **getParameterValues** to retrieve field names and values as well as query
    strings. See the section “HttpRequest” for examples of how you can use these methods.'
  merge: -1
  pgno: 415
- img_proc: true
  md: '# ServletResponse


    The javax.servlet.ServletResponse interface represents a servlet response. Prior
    to invoking a servlet''s service method, the servlet container creates a ServletResponse
    and pass it as the second argument to the service method. The ServletResponse
    hides the complexity of sending the response to the browser.


    One of the methods defined in ServletResponse is the getWriter method, which returns
    a java.io.PrintWriter that can send text to the client. By default, the PrintWriter
    object uses ISO-8859-1 encoding.


    When sending a response to a client, most of the time you send it as HTML.


    # Note


    There is also another method that you can use to send output to the browser: getOutputStream.
    However, this method is for sending binary data, so in most cases you will use
    getWriter and not getOutputStream.


    Before sending any HTML tag, you should set the content type of the response by
    calling the setContentType method, passing "text/html" as an argument. This is
    how you tell the browser that the content type is HTML. Most browsers by default
    render a response as HTML in the absence of a content type. However, some browsers
    will display HTML tags as plain text if you don''t set the response content type.'
  merge: -1
  pgno: 416
