  md: "# ServletConfig\n\nThe servlet container passes a ServletConfig to the servlet's\
    \ init method when the servlet container initializes the servlet. The ServletConfig\
    \ encapsulates configuration information that you can pass to a servlet through\
    \ @WebServlet or the deployment descriptor. The deployment descriptor is an XML\
    \ file that contain configuration values. It may or may not be present in a servlet/JSP\
    \ application.\n\nEvery piece of information passed to the ServletConfig is called\
    \ an initial parameter. An initial parameter has two components: key and value.\n\
    \nTo retrieve the value of an initial parameter from inside a servlet, call the\
    \ getInitParameter method on the ServletConfig. The signature of getInitParameter\
    \ is as follows:\n\n```\njava.lang.String getInitParameter(java.lang.String name)\n\
    ```\n\nIn addition, the getInitParameterNames returns an Enumeration of all initial\
    \ parameter names:\n\n```\njava.util.Enumeration<java.lang.String> getInitParameterNames()\n\
    ```\n\nFor example, to retrieve the value of a parameter, use this:\n\n```\nString\
    \ contractName = servletConfig.getInitParameter(\"contextName\");\n```\n\nOn top\
    \ of getInitParameter and getInitParameterNames, ServletConfig offers another\
    \ useful method, getServletContext. Use this to retrieve the ServletContext inside\
    \ a servlet. See the section \"ServletContext\" later in this appendix for a discussion\
    \ about this object.\n\nAs an example of ServletConfig, let's add a servlet named\
    \ ServletConfigDemoServlet to servletapi1. The new servlet is given in Listing\
    \ C.2.\n\nListing C.2: The ServletConfigDemoServlet class\n\n```\npackage servletapi1;\n\
    import java.io.IOException;\nimport java.io.PrintWriter;\nimport javax.servlet.Servlet;\n\
    import javax.servlet.ServletConfig;\nimport javax.servlet.ServletException;\n\
    import javax.servlet.ServletRequest;\nimport javax.servlet.ServletResponse;\n\
    import javax.servlet.annotation.WebServletParam;\nimport javax.servlet.annotation.WebServlet;\n\
    \n@WebServlet(\"ServletConfigDemoServlet\")\nurlPatterns = { \"/servletConfigDemo\"\
    \ },\ninitParams = {\n  @WebServletParam(name=\"admin\", value=\"Harry Tiacjak\"\
    ),\n```"
