    # mime-mapping


    The mime-mapping element maps a MIME type to an extension. It contains an extension
    element and a mime-type element. The extension element describes the extension
    and the mime-type element specifies the MIME type. For example, here is a mime-mapping
    element.


    ```

    <mime-mapping>

    <extension>txt</extension>

    <mime-type>text/plain</mime-type>

    </mime-mapping>

    ```


    # security-constraint


    The security-constraint element allows you to restrict access to a collection
    of resources declaratively.


    The security-constraint element contains an optional display-name element, one
    or more web-resource-collection elements, an optional auth-constraint element,
    and an optional user-data-constraint element.


    The web-resource-collection element identifies a collection of resources to which
    access needs to be restricted. In it you can define the URL pattern(s) and the
    restricted HTTP method or methods. If no HTTP method is present, the security
    constraint applies to all HTTP methods.


    The auth-constraint element specifies the user roles that should have access to
    the resource collection. If no auth-constraint element is specified, the security
    constraint applies to all roles.


    The user-data-constraint element is used to indicate how data transmitted between
    the client and servlet/JSP container must be protected.


    A web-resource-collection element contains a web-resource-name element, an optional
    description element, zero or more url-pattern elements, and zero or more http-method
    elements.


    The web-resource-name element contains a name associated with the protected resource.


    The http-method element can be assigned one of the HTTP methods, such as GET,
    POST, or TRACE.


    The auth-constraint element contains an optional description element and zero
    or more role-name element. The role-name element contains the name of a security
    role.


    The user-data-constraint element contains an optional description element and
    a transport-guarantee element. The transport-guarantee element must have one of
    the'
  merge: -1
  pgno: 475
- img_proc: true
  md: "following values: NONE, INTEGRAL, or CONFIDENTIAL. NONE indicates that the\
    \ data application does not require transport guarantees. INTEGRAL means that\
    \ the data between the server and the client should be sent in such a way that\
    \ it can't be changed in transit. CONFIDENTIAL means that the data transmitted\
    \ be encrypted. In many cases, Secure Socks Layer (SSL) is used for either INTEGRAL\
    \ or CONFIDENTIAL.\n\nThe following example uses a security-constraint to restrict\
    \ access to any resource with a URL matching the pattern /members/*. Only a user\
    \ in the payingMember will be allowed. The login-config element requires the user\
    \ to log in and the Digest access authentication method is used.\n\n```\n<security-constraint>\n\
    <web-resource-collection>\n  <web-resource-name>Members Only</web-resource-name>\n\
    \  <url-pattern>/members/*</url-pattern>\n</web-resource-collection>\n<auth-constraint>\n\
    \  <role-name>payingMember</role-name>\n</auth-constraint>\n</security-constraint>\n\
    \n<login-config>\n  <auth-method>Digest</auth-method>\n  <realm-name>Digest Access\
    \ Authentication</realm-name>\n</login-config>\n```\n\n# security-role\n\nThe\
    \ security-role element specifies the declaration of a security role used in security\
    \ constraints. It has an optional description element and a role-name element.\
    \ The following is an example security-role element.\n\n```\n<security-role>\n\
    \  <role-name>payingMember</role-name>\n</security-role>\n```\n\n# servlet\n\n\
    The servlet element is used to declare a servlet. It can contain the following\
    \ elements.\n\n+   * an optional icon element\n* an optional description element\n\
    * an optional display-name element\n* a servlet-name element\n* a servlet-class\
    \ element or a jsp-file element\n* zero or more init-param elements\n* an optional\
    \ load-on-startup element\n* an optional run-as element\n* an optional enabled\
    \ element\n* an optional async-supported element\n* an optional multipart-config\
    \ element"
  merge: -1
  pgno: 476
- img_proc: true
  md: "+   * zero or more security-role-ref elements\n\nAt a minimum a servlet must\
    \ contain a servlet-class element, or a servlet-name element and a jsp-file element.\
    \ The servlet-name element defines the name for that servlet and must be unique\
    \ throughout the application.\n\nThe servlet-class element specifies the fully\
    \ qualified class of the servlet.\n\nThe jsp-file element specifies the full path\
    \ to a JSP page within the application. The full path must begin with a /.\n\n\
    The init-param subelement can be used to pass an initial parameter name and value\
    \ to the servlet. The element descriptor of init-param is the same as context-param.\n\
    \nYou use the load-on-startup element to load the servlet automatically into memory\
    \ when the servlet/JSP container starts up. Loading a servlet instantiating the\
    \ servlet and calling its init method. You use this element to avoid delay in\
    \ the response for the first request to the servlet, caused by the servlet loading\
    \ to memory. If this element is present and a jsp-file element is specified, the\
    \ JSP file is precompiled into a servlet and the resulting servlet is loaded.\n\
    \nload-on-startup is either empty or has an integer value. The value indicates\
    \ the order of loading this servlet when there are multiple servlets in the same\
    \ application. For example, if there are both load-on-startup element, the servlet\
    \ with the lower load-on-startup value loaded first. If the value of the load-on-startup\
    \ is empty or a negative number, it is up to the web container to decide when\
    \ to load the servlet. If two servlets have the same load-on-startup value, the\
    \ loading order between the two servlets cannot be determined.\n\nrun-as overrides\
    \ the security identity for calling an Enterprise JavaBean by that servlet in\
    \ this application. The role name is one of the security roles defined for the\
    \ current web application.\n\nThe security-role-ref element maps the name of the\
    \ role called from a servlet using isUserInRole(name) to the name of a security\
    \ role for the application. The security-role-ref element contains an optional\
    \ description element, a role-name element, and a role-link element.\n\nThe role-link\
    \ element is used to link a security role reference to a defined security role.\
    \ The role-link element must contain the name of one of the security roles defined\
    \ in the security-elements.\n\nThe async-supported element is an optional element\
    \ that can have a true or false value. It indicates whether or not your servlet\
    \ supports asynchronous processing.\n\nThe enabled element is also an optional\
    \ element whose value can be true or false. Setting this element to false disables\
    \ this servlet.\n\nFor example, to map the security role reference “PM” to the\
    \ security role with role-name “payingMember”, the syntax would be as follows.\n\
    \n```\n<security-role-ref>\n  <role-name>PM</role-name>\n```"
