  md: '# # Chapter 12

    File Download


    A static resource, such as an image or an HTML file, can be downloaded by simply
    pointing the browser to the right URL. As long as the resource is located in the
    application directory or a subdirectory under it and not under WEB-INF, the servlet/JSP
    container will send the resource to the browser. However, sometimes a static resource
    is stored outside the application directory or in a database, or sometimes you
    want to control over scenarios who can see it and prevent other websites from
    cross-referencing it. If any of these scenarios applies to you, then you have
    to send the resource programmatically.


    In short, programmatic file download lets you selectively send a file to the browser.
    This chapter explains what it takes to programmatically send a resource to the
    browser and presents two examples.'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# # File Download Overview


    To send a resource such as a file to the browser, you need to do the the following
    in your controller.


    +   1. Use the `void` return type for your request-handling method and add `HttpServletResponse`
    as an argument to the method.

    2. Set the response''s content type to the file''s content type. The `Content-Type`
    header specifies the type of data in the entity and consists of the media type
    and subtype identifiers. Visit http://www.iana.org/assignments/media-types for
    standard content types. If you do not know the content type is or want the browser
    to always display the Save As dialog, set it to `APPLICATION/OCTET-STREAM`. This
    value is not sensitive matter.

    3. Add an HTTP response header `Content-Disposition` and give it the value `attachment`;
    where `fileName` is the default file name that should appear in the File Download
    dialog box. This is normally the same name as the file, but does not have to be.


    For instance, this code sends a file to the browser.


    ```

    FileInputStream fis = new FileInputStream(file);

    BufferedInputStream bis = new BufferedInputStream(fis);

    byte[] bytes = new byte[bis.available()];

    response.setContentType(contentType);

    OutputStream os = response.getOutputStream();

    is.write(bytes);

    ```


    The code above first reads the file as a `InputStream` and load the content to
    a byte array. Then, it obtains the `HttpServlet`''s `OutputStream` and calls its
    `write` method, passing the byte array.


    A better way of sending a file to an HTTP client is using Java NIO''s `Files.copy()`


    ```

    Path file = Paths.get(...);

    Files.copy(file, response.getOutputStream());

    ```


    The code is shorter and runs much faster.'
  merge: -1
