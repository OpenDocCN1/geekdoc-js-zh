  md: "In this case, the servlet invoked by a user belonging to the “payingMember”\
    \ security role calls isUserInRole(\"payingMember\"), the result would be true.\n\
    \nThe following are two example elements:\n\n```\n<servlet>\n  <servlet-name>UploadServlet</servlet-name>\n\
    \  <servlet-class>com.brainisoft.UploadServlet</servlet-class>\n  <load-on-startup>10</load-on-startup>\n\
    </servlet>\n<servlet>\n  <servlet-name>SecureServlet</servlet-name>\n  <servlet-class>com.brainisoft.SecureServlet</servlet-class>\n\
    \  <load-on-startup>20</load-on-startup>\n</servlet>\n```\n\n# servlet-mapping\n\
    \nThe servlet-mapping element maps a servlet to a URL pattern. The servlet-mapping\
    \ element must have a servlet-name element and a url-pattern.\n\nThe following\
    \ servlet-mapping element maps a servlet with the URL pattern /first.\n\n```\n\
    <servlet>\n  <servlet-name>FirstServlet</servlet-name>\n  <servlet-class>com.brainisoft.FirstServlet</servlet-class>\n\
    </servlet>\n<servlet-mapping>\n  <servlet-name>FirstServlet</servlet-name>\n \
    \ <url-pattern>/first</url-pattern>\n</servlet-mapping>\n```\n\n# session-config\n\
    \nThe session-config element defines parameters for javax.servlet.HttpSession\
    \ instances. This element may contain one or more of the following elements: session-timeout,\
    \ cookie-config, and tracking-mode.\n\nThe session-timeout element specifies the\
    \ default session timeout interval in minutes. This value must be an integer.\
    \ If the value of the session-timeout element is zero or a negative number, the\
    \ session will never time out.\n\nThe cookie-config element defines the configuration\
    \ of the session tracking cookies created by this servlet/JSP application.\n\n\
    The tracking-mode element defines the tracking mode for sessions created by this\
    \ web application. Valid values are COOKIE, URL, or SSL.\n\nThe following session-config\
    \ element causes the HttpSession objects in the current application to be invalidated\
    \ after twelve minutes of inactivity."
