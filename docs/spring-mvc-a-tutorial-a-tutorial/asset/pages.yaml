  md: '# Manipulating Collections


    The EL 3.0 brings a lot of goodies. One of its main contributions is a feature
    to manipulate collections. You can make full use of this feature by first converting
    a collection to a stream by calling the stream method.


    Here is how you convert a list to a stream, assuming myList is a java.util.List:


    ```

    ${ myList.stream() }

    ```


    Many of the stream''s operations return another stream, enabling these operations
    to be chained.


    ```

    ${ myList.stream().operation-1().operation-2().toList() }

    ```


    At the end of the chain, you normally call the toList method so that the result
    can be printed or formatted.


    The following subsections presents some of the operations that you can perform
    on a stream.'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'The toList method returns a List containing the same members as the stream
    on which the method is called. The main reason why you would call this method
    is so that you can easily print or manipulate the stream elements. Here is an
    example of converting a List to a Stream and back to a List:


    ```

    ${ [100, 200, 300].stream().toList()}

    ```


    Of course this example does not do anything useful. You will see more examples
    that make more sense later in the next subsections.'
