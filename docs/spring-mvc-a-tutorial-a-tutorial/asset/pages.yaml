  md: "# The ValidationUtils Class\n\nThe org.springframework.validation.ValidationUtils\
    \ class is a utility that can help you write a Spring validator. Instead of writing\
    \ this.\n\n```\nif (firstName == null || firstName.isEmpty()) {\n    errors.rejectValue(\"\
    price\");\n}\n```\n\nyou can use the ValidationUtils'class rejectEmpty method\
    \ like this.\n\n```\nValidationUtils.rejectEmpty(\"price\");\n```\n\nOr instead\
    \ of this.\n\n```\nif (firstName == null || firstName.trim().isEmpty()) {\n  \
    \  errors.rejectValue(\"price\");\n}\n```\n\nyou can write this.\n\n```\nValidationUtils.rejectEmptyOrWhitespace(\"\
    price\");\n```\n\nHere are the complete method overloads of rejectEmpty rejectEmptyOrWhitespace\
    \ methods in ValidationUtils.\n\n```\npublic static void rejectEmpty(Errors errors,\
    \ String field, String errorCode)\npublic static void rejectEmpty(Errors errors,\
    \ String field, String errorCode, Object[] args)\npublic static void rejectEmpty(Errors\
    \ errors, String field, String errorCode, Object[] args, String defaultMessage)\n\
    public static void rejectEmpty(Errors errors, String field, String errorCode,\
    \ String defaultMessage)\npublic static void rejectEmptyOrWhitespace(Errors errors,\
    \ String field, String errorCode)\npublic static void rejectEmptyOrWhitespace(Errors\
    \ errors, String field, String errorCode, Object[] args)\npublic static void rejectEmptyOrWhitespace(Errors\
    \ errors, String field, String errorCode, Object[] args, String defaultMessage)\n\
    public static void rejectEmptyOrWhitespace(Errors errors, String field, String\
    \ errorCode, String defaultMessage)\n```\n\nIn addition, ValidationUtils also\
    \ has an invokeValidator method for invoking a.\n\n```\npublic static void invokeValidator(Validator\
    \ validator, Object obj, Errors errors)\n```\n\nLearn how to use this useful tool\
    \ in the example in the next section."
