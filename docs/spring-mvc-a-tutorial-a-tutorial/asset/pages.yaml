  md: '# filter


    This method filters all elements in a stream against a lambda expression and returns
    a new stream containing elements that passed.


    For example, the following expression tests if a city starts with an "S" and returns
    all that do.


    ```

    $${cities.stream().filter(x -> x.startsWith("S")).toList()}

