  md: "# Defining A Context\n\nTo deploy a servlet/JSP application to Tomcat, you\
    \ need to define a Tomcat context either explicitly or implicitly. Each Tomcat\
    \ context represents a web application in Tomcat.\n\nThere are several ways of\
    \ defining a Tomcat context explicitly:\n\n+   - Creating an XML file in Tomcat's\
    \ conf/Catalina/localhost directory.\n- Adding a Context element in Tomcat's conf/server.xml\
    \ file.\n\nIf you decide to create an XML file for each context, the file name\
    \ is important as the context path is derived from it. For example, if you place\
    \ a commerce.xml file in the conf/Catalina/localhost directory, the context path\
    \ of your application will be commerce and a resource can be invoked using this\
    \ URL:\n\n```\nhttp://localhost:8080/commerce/resourceName\n```\n\nA context file\
    \ must contain a Context element as its root element. Most of the times the element\
    \ does not have child elements and is the only element in the file. For example,\
    \ here is an example context file, consisting of a single line.\n\n```\n<Context\
    \ docBase=\"C:/apps/commerce\" reloadable=\"true/>\n```\n\nThe only required attribute\
    \ is docBase, which specifies the location of the application. The reloadable\
    \ attribute is optional, but if it is and its value is set to true, Tomcat will\
    \ monitor the application for any addition, deletion, or update of a Java class\
    \ file and other resources. When such a change is detected, Tomcat will reload\
    \ the application. Setting reloadable to true is recommended during development\
    \ but not in production.\n\nWhen you add a context file to the specified directory,\
    \ Tomcat will automatically load the application. When you delete it, Tomcat will\
    \ unload the application.\n\nAnother way of defining a context is by adding a\
    \ Context element in the conf/server.xml file. To do this, open the file and create\
    \ a Context element under the Host element. Unlike the previous method, defining\
    \ a context here requires that you specify the path attribute for your context\
    \ path. Here is an example:\n\n```\n<Host name=\"localhost\" appBase=\"webapps\"\
    \ unpackWARs=\"true\"\n  autoDeploy=\"true\">\n  <Context path=\"/commerce\"\n\
    \    docBase=\"C:/apps/commerce\"\n    reloadable=\"true\">\n</Host>\n```\n\n\
    Generally, managing contexts through server.xml is not recommended as updates\
    \ will only take effect after you restart Tomcat. However, if you have a bunch\
    \ of applications that need to test quickly, like when you are learning to write\
    \ servlets and JSP pages,"
