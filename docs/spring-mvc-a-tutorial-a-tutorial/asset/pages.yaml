  md: "# # Defining A Resource\n\nYou can define a JNDI resource that your application\
    \ can use in your Tomcat context definition. A resource is represented by the\
    \ Resource element under the Context element.\n\nFor instance, to add a DataSource\
    \ resource that opens connections to a MySQL database, add this Resource element.\n\
    \n```\n<Context [path=\"/appName\"] docBase=\"...\">\n  <Resource name=\"jdbc/dataSourceName\"\
    \n    auth=\"Container\"\n    type=\"javax.sql.DataSource\"\n    username=\"\"\
    \n    password=\"...\"\n    driverClassName=\"com.mysql.jdbc.Driver\"\n    url=\"\
    ...\"\n  />\n</Context>\n```\n\nMore information on the Resource element can be\
    \ found here.\n\nhttp://tomcat.apache.org/tomcat-8.0-doc/jndi-resources-howto.html"
