- img_proc: true
  md: "```\npublic void setPDFService(PDFService pdfService) {\n    this.pdfService\
    \ = pdfService;\n}\n\npublic void createPDF(String path, String input) {\n   \
    \ pdfService.createPDF(path, input);\n}\n```\n\nListing 2.12: The PDFService class\n\
    \n```\npackage service;\nimport util.PDFUtil;\n\npublic class PDFService {\n \
    \   public void createPDF(String path, String input) {\n        PDFUtil.createDocument(path,\
    \ input);\n    }\n}\n```\n\nPDFService uses a PDFUtil class, which in turn employs\
    \ the Apache PDFBox library to create PDF documents. Feel free to look up the\
    \ PDFUtil class in appdesign4 if you are interested in working with PDF.\n\nWhat's\
    \ important is this. As shown in Listing 2.11, PDFAction requires a PDFService\
    \ to do its job. In other words, PDFAction is dependent on PDFService. Without\
    \ dependency injection, you would have to instantiate the PDFService inside the\
    \ PDFAction class and this would make PDFAction less testable. On top of that,\
    \ you have to recompile PDFAction if you need to change the implementation of\
    \ PDFService.\n\nWith dependency injection every component has its dependencies\
    \ injected to it you're making each component easier. For a to be used in a dependency\
    \ injection environment, you have to inject-ready. One way to do is to create\
    \ a method for each dependency. For example, the PDFAction class has a setPDFService\
    \ method that can be called to pass a PDFService. Injection can also occur through\
    \ a constructor or a class field.\n\nOnce all your classes are inject-ready, you\
    \ can choose a dependency injection framework and import it to your project. Spring\
    \ Framework, Google Guice, Weld, and PicoContainer have some good ones.\n\n# Note\n\
    \nDependency injection in Java is specified in JSR 330 and JSR 299.\n\nThe appdesign4\
    \ application uses the DependencyInjector in 2.13 in lieu of a dependency injection\
    \ framework. (In a real-world application, course you would use a proper framework.)\
    \ This class has been designed to work with appdesign4 alone and can be instantiated\
    \ easily, with or without a container. Once instantiated, its start method must\
    \ be called to perform initialization. After use, the shutdown method should be\
    \ called to release resources. In this example, both start and shutdown are empty."
