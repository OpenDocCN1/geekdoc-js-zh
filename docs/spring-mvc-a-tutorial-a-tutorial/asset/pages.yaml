  md: '# Summary


    This appendix explained how you can configure and deploy your servlet/JSP applications.
    The appendix started by introducing the directory structure of a typical application
    and then moved to an explanation of the deployment descriptor.


    After the application is ready for deployment, you can deploy it by retaining
    the files and directory structure of your application. Alternatively, you can
    package the application into a WAR file and deploy the whole application as a
    single file.'
