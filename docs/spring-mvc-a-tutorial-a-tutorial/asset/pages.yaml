    void reject(String errorCode)

    void reject(String errorCode, String defaultMessage)

    void rejectValue(String field, String errorCode)

    void rejectValue(String field, String errorCode,

    String defaultMessage)

    ```


    Most of the time, you just need to pass an error code to the reject or rejectValue
    method. Spring can then look up the error code against a properties file to obtain
    the corresponding error message. You can also pass a default message that will
    be used if the error code is not found.


    The error messages in an Errors object can be displayed on an HTML page by using
    the errors tag of the form tag library. Error messages can be localized through
    the internationalization feature that Spring supports. More about internationalization
    can be found in Chapter 10, “Internationalization.”'
