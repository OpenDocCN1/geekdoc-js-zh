  md: "```\npublic class FragmentServlet extends HttpServlet {\n    private static\
    \ final long serialVersionUID = 940L;\n\n    public void doGet(HttpServletRequest\
    \ request, HttpServletResponse response)\n            throws ServletException,\
    \ IOException {\n        response.setContentType(\"text/html\");\n        PrintWriter\
    \ out = response.getWriter();\n        out.println(\"A plug-in\");\n    }\n}\n\
    ```\n\n**Listing E.4: The web-fragment.xml encoding in project fragment**\n\n\
    ```\n<<?xml version=\"1.0\" encoding=\"ISO-8859-1?>\n<web-fragment version=\"\
    3.1\" xmlns=\"http://xmlns.jcp.org/xml/ns/javaee\"\n     xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \ \n     xsi:schemaLocation=\"http://xmlns.jcp.org/xml/ns/javaee web-fragment-3_1.xsd\"\
    >\n<servlet>\n    <servlet-name>FragmentServlet</servlet-name>\n    <servlet-class>fragment.FragmentsServlet</servlet-class>\n\
    </servlet>\n<servlet-mapping>\n    <servlet-name>FragmentServlet</servlet-name>\n\
    \    <url-pattern>/fragment</url-pattern>\n</servlet-mapping>\n</web-fragment>\n\
    ```\n\n**FragmentServlet** is a simple servlet that sends a string to the browser.\
    \ The structure of the **fragment.jar** file is depicted in Figure E.1.\n\n![](img/9df6b4b4bce0bca1a5859c20a724e196_485_0.png)\n\
    \nFigure E.1: The structure of the fragment.jar file\n\nYou can test the **Fragment**\
    \ servlet by invoking this URL:\n\n```\nhttp://localhost:8080/fragmentdemo/fragment\n\
    ```\n\nYou can see the output from the **Fragment** servlet."
