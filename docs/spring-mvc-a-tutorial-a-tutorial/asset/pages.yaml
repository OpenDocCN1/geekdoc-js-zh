- img_proc: true
  md: '# The timezone Tag


    The timezone is used to specify the time zone in which time information is to
    be formatted or parsed in its body content. The syntax is as follows:


    ```

    <fmt:setTime value="timezone">

    body content

    </fmt:setTime>

    ```


    The body content is JSP. The attribute value can be passed a dynamic value of
    type String or java.util.TimeZone. The values for US and Canada time zones are
    given in Table 9.12.


    If the attribute is null or empty, the GMT time zone is used.


    The following examples use the timeZone to format dates with time zones.


    ```

    <fmt:setTime value="GMT+1:00">

    <fmt:formatDate value="${now}" type="both"

    dateStyle="full" time="full"/>

    </fmt:setTime>

    <fmt:setTime value="HST">

    <fmt:formatDate value="${now}" type="both"

    dateStyle="full" time="full"/>

    </fmt:setTime>

    <fmt:setTime value="CST">

    <fmt:formatDate value="${now}" type="both"

    dateStyle="full" time="full"/>

    </fmt:setTime>

    ```


    | Abbreviation | Full Name | Time Zone |

    | NST | Newfoundland Standard Time | UTC-3:30 hours |

    | NDT | Newfoundland Daylight Time | UTC-2:30 hours |

    | AST | Atlantic Standard Time | UTC-4 hours |

    | ADT | Atlantic Daylight Time | UTC-3 hours |

    | EST | Eastern Standard Time | UTC-5 hours |

    | EDT | Eastern Daylight Saving Time | UTC-4 hours |

    | ET | Eastern Time, as EST or EDT | * |

    | CST | Central Standard Time | UTC-6 hours |

    | CDT | Central Daylight Saving Time | UTC-5 hours |

    | CT | Central Time, as either CST or CDT | * |'
  merge: -1
  pgno: 272
- img_proc: true
  md: '| | | |

    |---|---|---|

    | MST | Mountain Standard Time | UTC-7 hours |

    | MDT | Mountain Daylight Saving Time | UTC-6 hours |

    | MT | Mountain Time, as either MST or MDT | * |

    | PST | Pacific Standard Time | UTC-8 hours |

    | PDT | Pacific Daylight Saving Time | UTC-7 hours |

    | PT | Pacific Time, as either PST or PDT | * |

    | AKST | Alaska Standard Time | UTC-9 hours |

    | AKDT | Alaska Standard Daylight Saving Time | UTC-8 hours |

    | HST | Hawaiian Standard Time | UTC-10 hours |


    Table 9.12: US and Canada Time Zones'
