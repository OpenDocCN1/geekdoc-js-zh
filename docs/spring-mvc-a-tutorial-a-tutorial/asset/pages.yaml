  md: '# Running All or Multiple Tests With A Test Suite


    In a small project with a dozen classes, you will have a dozen test classes. With
    a bigger project, you will have more. Running one test class is easy with Eclipse
    or STS, but how about running all your tests?


    With JUnit the solution is very simple. Create a Java class and annotate it with
    @RunWith(Suite.class) and @SuiteClasses(). The latter should list all classes
    and other suite tests that you want to run. Listing 13.5 shows an example. The
    class body may be empty.


    # Listing 13.5: A test suite


    ```

    package com.example;

    import org.junit.runner.RunWith;

    import org.junit.runners.Suite;

    import org.junit.runners.SuiteClasses;


    @RunWith(Suite.class)

    @SuiteClasses({MyTest1.class, MyTest2.class})

    public class MyTestSuite {

    }

    ```


    If you are using a CI server, you can set up the server to run your unit tests
    automatically every time new or modified code is committed.'
