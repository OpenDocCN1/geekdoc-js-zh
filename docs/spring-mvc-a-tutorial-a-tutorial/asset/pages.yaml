  md: "# The remove Tag\n\nYou use the remove tag to remove a scoped variable. The\
    \ syntax is as follows:\n\n```\n<c:remove var=\"varName\"\n  [scope=\"{page|request|session|application}\"\
    ]/\n```\n\nNote that the object referenced by the scoped variable is not removed.\
    \ Therefore, if another scoped variable is also referencing the same object, you\
    \ can still access the object through the other scoped variable.\n\nThe list of\
    \ the remove tag’s attributes is given in Table 9.4.\n\n| Attribute | Type | Description\
    \ |\n| --- | --- | --- |\n| var | String | The name of the scoped variable to\
    \ remove. |\n| scope | String | The scope of the scoped variable to be removed\
    \ |\n\nTable 9.4: The remove tag’s attributes\n\nAs an example, the following\
    \ remove tag removes the page-scoped variable job.\n\n```\n<c:remove var=\"job\"\
    \ scope=\"page\"/\n```"
