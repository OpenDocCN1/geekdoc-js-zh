    # login-config


    The login-config element is used to specify the authentication method used to
    authenticate the user, the realm name, and the attributes needed by the form login
    mechanism if form-based authentication is used. A login-config element has an
    optional auth-method element, an optional realm-name element, and an optional
    form-login-config element.


    The auth-method element specifies the access authentication method. Its value
    is one of the following: BASIC, DIGEST, FORM, or CLIENT-CERT.


    The realm-name element specifies the realm name to use in Basic access authentication
    and Digest access authentication.


    The login-config element specifies the login and error pages that should be used
    if form-based authentication is not used, these elements are ignored.


    The login-config element has a form-login-page element and a form-error-page element.
    The form-login-page element specifies the path to a resource that displays a Login
    page. The path must start with a / and is relative to the application directory.


    The form-error-page element specifies the path to a resource that displays an
    error when login fails. The path must begin with a / and is relative to the application
    directory.


    As an example, here is an example of the login-config element.


    ```

    <login-config>

    <auth-method>DIGEST</auth-method>

    <realm-name>Members Only</realm-name>

    </login-config>

    ```


    And, here is another example.


    ```

    <login-config>

    <auth-method>FORM</auth-method>

    <form-login-config>

    ```'
