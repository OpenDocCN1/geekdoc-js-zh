- img_proc: true
  md: '# Arithmetic Operators


    There are five arithmetic operators:


    +   - Addition (+)

    - Subtraction (-)

    - Multiplication (*)

    - Division (/ and div)

    - Remainder/modulo (% and mod)


    The division and remainder operators have two forms, to be consistent with XPath
    and ECMAScript.


    Note that an EL expression is evaluated from the highest to the lowest precedence,
    and then from left to right. The following are the arithmetic operators in the
    decreasing lower precedence:


    +   - * / div % mod

    - +


    This means that *, /, div, %, mod operators have the same level of precedence,
    and + has the same precedence as - , but lower than the first group. Therefore,
    the expression


    ```

    ${{1+2*3}

    ```


    results in 7 and not 6.'
  merge: -1
