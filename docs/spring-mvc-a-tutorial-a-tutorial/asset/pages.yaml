  md: "# Mock Objects\n\nA mock object is philosophically different from the other\
    \ test doubles. You use dummies, stubs, spikes and fakes for state testing, i.e.\
    \ to verify the output of a method. By contrast, you use mock objects to perform\
    \ behavior (interaction) testing to make sure a certain method is really called\
    \ or to verify a method is called a number of times during the execution of another\
    \ method.\n\nFor example, consider the MathUtil class in Listing 13.18.\n\n# Listing\
    \ 13.18: The MathUtil class\n\n```\npackage com.example;\npublic class MathUtil\
    \ {\n    private MathHelper mathHelper;\n    public MathUtil(MathHelper mathHelper)\
    \ {\n        this.mathHelper = mathHelper;\n    }\n    public MathUtil() {\n \
    \   }\n    public int multiply(int a, int b) {\n        int result = 0;\n    \
    \    for (int i = 1; i <= a; i++) {\n            result = mathHelper.add(result,\
    \ b);\n        }\n        return result;\n    }\n}\n```\n\nMathUtil has one method,\
    \ multiply, that performs multiplications. It does very naively, using multiple\
    \ additions. In other words, 3 x 8 is calculated as 8 + 8 + 8. The MathUtil class\
    \ does not even know how to do additions. For this, it depends on a MathHelper\
    \ object, whose class is printed in Listing 13.19.\n\n# Listing 13.19: The MathHelper\
    \ class\n\n```\npackage com.example;\npublic class MathHelper {\n    public int\
    \ add(int a, int b) {\n        return a + b;\n    }\n}\n```\n\nYou are interested\
    \ not in the result of the multiply method, but in finding out if the multiply\
    \ method behaves as expected. Therefore, it should call MathHelper.add(three)\
    \ three times when calculating 3 x 8. Listing 13.20 shows a test class that uses\
    \ a mock of MathHelper. Mockito, a popular mocking framework is used to create\
    \ the mock object. I will explain more about Mockito later in this chapter. In\
    \ this section, I want to show you the concept.\n\n# Listing 13.20: The MathUtil\
    \ class"
  merge: -1
  pgno: 363
- img_proc: true
  md: "```\npackage com.example;\nimport static org.mockito.Mockito.mock;\nimport\
    \ static org.mockito.Mockito.times;\nimport static org.mockito.Mockito.verify;\n\
    import static org.mockito.Mockito.when;\nimport org.junit.Test\n```\n\n```\n@Test\n\
    public void testMultiply() {\n    MathHelper mathHelper = mock(MathHelper.class);\n\
    \    for (int i = 0; i < 10; i++) {\n        when(mathHelper.add(i * 8)).thenReturn(i\
    \ * 8 + 8);\n    }\n    MathUtil mathUtil = new MathUtil(mathHelper);\n    mathUtil.multiply(3,\
    \ 8);\n    verify(mathHelper, times(1)).add(0, 8);\n    verify(mathHelper, times(1)).add(8,\
    \ 8);\n    verify(mathHelper, times(1)).add(16, 8);\n}\n```\n\nCreating a mock\
    \ object with Mockito is very easy, simply call the mock method of the org.mockito.Mockito\
    \ class. Here is how you create a MathHelper object.\n\n```\nMathHelper mathHelper\
    \ = mock(MathHelper.class);\n```\n\nNext, you need to prepare the mock object\
    \ using the when method. Basically, you tell it given a method call using this\
    \ set of arguments, the mock object must return this value. For instance, this\
    \ statement says that if mathHelper.add(10, 20) is called, the new return value\
    \ must be 10 + 20;\n\n```\nwhen(mathHelper.add(10, 20)).thenReturn(10 + 20);\n\
    ```\n\nFor this test, prepare the mock object with ten sets of arguments (not\
    \ all argument sets will be used).\n\n```\nfor (int i = 0; i < 10; i++) {\n  \
    \  when(mathHelper.add(i * 8)).thenReturn(i * 8 + 8);\n}\n```\n\nYou create the\
    \ object to be tested and call it its argument.\n\n```\nMathUtil mathUtil = new\
    \ MathUtil(mathHelper);\nmathUtil.multiply(3, 8);\n```\n\nThe next three statements\
    \ are behavior tests. To do this, you call the verify method:\n\n```\nverify(mathHelper,\
    \ times(1)).add(0, 8);\nverify(mathHelper, times(1)).add(8, 8);\nverify(mathHelper,\
    \ times(1)).add(16, 8);\n```"
