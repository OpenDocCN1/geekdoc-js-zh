  md: "# The choose, when and otherwise Tags\n\nThe choose and when tags act similarly\
    \ to the switch and case keywords in Java, that is, they are used to provide the\
    \ context for mutually exclusive conditional execution. The choose must have one\
    \ or more when tags nested it, and each when tag represents a case that can be\
    \ evaluated and processed. The otherwise tag is used for a default conditional\
    \ block that will be processed if none of the when tags' conditions evaluates\
    \ to true. If present, otherwise must appear after the last when.\n\nchoose and\
    \ otherwise do not have attributes. when must have the test attribute specifying\
    \ the test condition that determines whether the body content should be processed.\n\
    \nAs an example, the following code tests the value of a parameter called status.\
    \ If the value of status is full, it displays \"You are a full member\". If the\
    \ value is student, it displays \"You are a student member\". If the parameter\
    \ status does not exist or if its value is neither full nor student, the code\
    \ displays nothing.\n\n```\n<c:choose>\n  <c:when test=\"${param.status=='full\"\
    >\n    You are a full member\n  </c:when>\n  <c:when test=\"${param.status=='student\"\
    >\n    You are a student member\n  </c:when>\n</c:choose>\n```\n\nThe following\
    \ example is similar to the preceding one, but it uses the otherwise tag to display\
    \ \"Please register\" if the status parameter does not exist or if its value is\
    \ not full or student:\n\n```\n<c:choose>\n  <c:when test=\"${param.status=='full\"\
    >\n    You are a full member\n  </c:when>\n  <c:when test=\"${param.status=='student\"\
    >\n    You are a student member\n  </c:when>\n  <c:otherwise>\n    Please register\n\
    \  </c:otherwise>\n</c:choose>\n```"
  merge: -1
  pgno: 255
