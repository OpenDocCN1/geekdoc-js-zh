  md: "# Redirect and Flash Attributes\n\nAs a seasoned servlet/JSP programmer, you\
    \ must know the difference between a forward and a redirect. A forward is faster\
    \ than a redirect because a redirect requires a round-trip to the server and a\
    \ forward does not. However, there are circumstances where a redirect is preferred.\
    \ One of such events is when you need to redirect to an external site, like a\
    \ different web site. You cannot use a forward to target an external site so a\
    \ redirect is your only choice.\n\nAnother scenario where you want to use a redirect\
    \ instead of a forward is when you want to avoid the same action from being invoked\
    \ when the user reloads the page. For example, in annotated1 when you submit the\
    \ Product form, the saveProduct method will be invoked and this method will do\
    \ what it's supposed to do. In a real-world application, this might include adding\
    \ the product to the database. However, if you reload the page after you submit\
    \ the form, saveProduct will be called and the same product would potentially\
    \ be added the second time. To avoid this, after a submit, you may prefer to redirect\
    \ the user to a different page. This page should have no side-effect when called\
    \ repeatedly. For instance, in annotated1, you could redirect the user to a ViewProduct\
    \ page after a form submit.\n\nIn annotated2 you probably noticed that the saveProduct\
    \ method in the Controller class ends with this line:\n\n```\nreturn redirect:/view-product/\
    \ + savedProduct.getId();\n```\n\nHere, use a redirect instead of a forward to\
    \ prevent the saveProduct method being called twice if the user reloads the page.\n\
    \nThe trade-off when using a redirect is you cannot easily pass the value to the\
    \ target page. With a forward, you can add attributes to the Model object and\
    \ the attributes will be accessible to the view. Since a redirect is a round trip\
    \ to the server, everything in the Model is lost when you redirect. Fortunately,\
    \ Spring version 3.1 and later provide a way of preserving values in a redirect\
    \ by using flash attributes.\n\nTo use flash attributes you must have an <annotation-driven/>\
    \ element in your Spring MVC configuration file. And then, you must also add a\
    \ new argument of type org.springframework.web.servlet.mvc.RedirectAttributes\
    \ in your method. The saveProduct method in ProductController annotated2 is reprinted\
    \ in Listing 4.10.\n\n+   Listing 4.10: Using flash attributes\n\n```\n@RequestMapping(value\
    \ = \"save-product\", method = RequestMethod.POST)\npublic String saveProduct(ProductForm\
    \ form,\n    RedirectAttributes redirectAttributes) {\n    logger.info(\"saveProduct\
    \ called\");\n    // no need to create and instantiate a ProductForm\n    // create\
    \ Product\n    Product product = new Product();\n    product.setName(form.getName());\n\
    ```"
