  md: '# # Appendix A


    # # Tomcat


    Tomcat is the most popular servlet/JSP container today. It''s free, mature, and
    open-source. You need Tomcat 8 or another compliant servlet/JSP container to run
    the sample applications accompanying this book. This appendix provides a quick
    installation and configuration guide and is by no means a comprehensive tutorial.'
  merge: -1
