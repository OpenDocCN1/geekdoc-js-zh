- img_proc: true
  md: '# Isolating Textual Components into Properties Files


    An internationalized application stores its textual elements in a properties file
    for each locale. Each file contains key/value pairs, and each uniquely identifies
    a locale-specific object. Keys are always strings, and values can be strings or
    any other type of object. For example, to support English, German, and Chinese
    you will have three properties files, all of which have the same keys.


    The following is the English version of the properties file. Note that it has
    two keys: greetings and farewell.


    ```

    greetings=Hello

    farewell=Goodbye

    ```


    The German version would be as follows:


    ```

    greetings=Hallo

    farewell=Tschü

    ```


    And the properties file for the Chinese language would be


    ```

    greetings=\u4f60好

    farewell=\u518d见

    ```


    If you are a Chinese speaker, you can use any Chinese text editor and write the
    Kanji characters. Once you are finished, convert the file to Unicode.


    Now, you need to master the java.util.ResourceBundle class. It enables you to
    easily choose and read the properties file specific to the user''s locale and
    look up the values. ResourceBundle is an abstract class, but it provides static
    getBundle methods that return an instance of a concrete subclass.


    A ResourceBundle has a base, which can be any name. In order for a ResourceBundle
    to pick up properties file, the filename must be composed of the ResourceBundle
    base name, followed by an underscore, followed by the language code, and optionally
    followed by another underscore and the country code. The format for the properties
    file is as follows:


    ```

    basename_languageCodeCountry

    ```


    For example, suppose the base name is MyResources and you define the following
    locales:


    +   * US-en

    * DE-de

    * CN-zh


    Then you would have these three properties files:


    +   * MyResources_en_US.properties

    * MyResources_de_DE.properties'
