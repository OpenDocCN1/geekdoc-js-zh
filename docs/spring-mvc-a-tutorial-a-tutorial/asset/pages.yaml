  md: '# The setTimeZone Tag


    You use the setTimeZone tag to store the specified time zone in a scoped variable
    or the time configuration variable. The syntax of setTimeZone is as follows:


    ```

    <fmt:setTimeZone value="timezone" [var=varName] [scope="page|request|session|application}"]
    />

    ```


    Table 9.13 presents the setTimeZone tag''s attributes.


    | Attribute | Type | Description |

    | --- | --- | --- |

    | value+ | String or java.util.TimeZone | The time zone |

    | var | String | The name of the scoped variable to hold the time zone of type
    java.util.TimeZone |

    | scope | String | The scope of var or the time zone configuration variable |


    Table 9.13: The setTimeZone tag''s attributes'
