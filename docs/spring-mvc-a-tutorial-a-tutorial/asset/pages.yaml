  md: '# toArray


    Similar to toList, but returns a Java array. Again, it is often useful to present
    elements in an array because many Java methods take an array as their argument.
    Here is an example of toArray:


    ```

    $[ "One", "Two", "Three"].stream().toArray()

    ```


    Unlike toList, however, toArray does not print the elements. Therefore, toList
    is more frequently used that toArray.'
