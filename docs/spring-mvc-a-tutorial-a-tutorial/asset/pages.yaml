  md: "```\nhttp://domain/appName/input-product\n```\n\nTo get the application to\
    \ save a product, the URI would be:\n\n```\nhttp://domain/appName/save-product\n\
    ```\n\nThe controller examines the URI to decide which action to invoke. It also\
    \ stores the model object in a place that can be accessed from the browser, so\
    \ server-side values can be displayed on the browser. Finally, the controller\
    \ uses a RequestDispatcher or HttpServletResponse.sendRedirect() to forward/redirect\
    \ to a view (a JSP page or another resource). In the JSP page, you use the Expression\
    \ Language and custom tags to display values.\n\nNote that calling RequestDispatcher.forward()\
    \ or HttpServletResponse.sendRedirect() does not prevent the code below it being\
    \ executed. Therefore, unless the last line is in a method, you need to return\
    \ explicitly.\n\n```\nif (action.equals(...)) {\n    RequestDispatcher rd = request.getRequestDispatcher(dispatchUrl);\n\
    \    rd.forward(request, response);\n    return;//explicit return. Or else, the\
    \ code below will be executed\n}\n// do something else\n```\n\nMost of the time,\
    \ you use a RequestDispatcher to forward to a view because it is faster than a\
    \ redirect which causes the server to send the HTTP response status code 302 with\
    \ a Location header containing a new URL to the browser. Upon receiving the status\
    \ 302, the browser makes a new HTTP request to the URL found in the Location header.\
    \ In other words, a redirect requires a round-trip that makes it slower than a\
    \ forward.\n\nWhat is the advantage of using a redirect over a forward? With a\
    \ redirect, you can direct the browser to a different application. You cannot\
    \ do this with a forward. If a redirect is used to hit a different resource in\
    \ the same application, it yields a different URI than the original request. As\
    \ such, if the user accidentally presses the browser Reload/Refresh button after\
    \ a response is rendered, the code associated with the original request will not\
    \ be executed again. For instance, you would not want the same code that makes\
    \ a credit card payment re-executed just because the user accidentally pressed\
    \ the Reload or Refresh button of her browser.\n\nThe last example in this chapter,\
    \ the appdesign4 application, shows an example of a redirect and demonstrates\
    \ how it can be done."
