  md: '# # Appendix C


    # ## The Servlet API


    Servlet is the underlying technology behind Spring MVC. Understanding the Servlet
    API is your gateway to becoming a formidable Spring MVC developer. There are more
    than seventy types in this API and it is imperative that you be familiar with
    the most important ones.


    This appendix introduces the classes and interfaces in the Servlet API that you
    should know. In addition, it teaches you to write servlets. All examples can be
    found in the **servletapi1, servletapi2 and servletapi3** sample applications.'
  merge: -1
  pgno: 405
- img_proc: true
  md: '# # Servlet API Overview


    The Servlet API comes in four Java packages. The packages are as follows.


    +   - javaxax.servlet. Contains classes and interfaces that define the contract
    between a servlet and a servlet container.

    - javaxax.servlet.http. Contains classes and interfaces that define the contract
    between an HTTP servlet and a servlet container.

    - javaxax.servlet.annotation. Contains annotations to annotate servlets, filters,
    and listeners. It also specifies metadata for annotated components.

    - javaxax.servlet.descriptor. Contains types that provide programmatic access
    to a web application''s configuration information.


    This appendix focuses on members of javax.servlet and javax.servlet.http.'
  merge: -1
  pgno: 406
- img_proc: true
  md: '# # The jav.servlet Package


    Figure C.1 shows the main types in javax.servlet.


    ![](img/9df6b4b4bce0bca1a5859c20a724e196_407_0.png)


    Figure C.1: Prominent members of java.servlet


    At the center of Servlet technology is **Servlet**, an interface that all servlet
    classes must implement either directly or indirectly. You implement it directly
    when you write a servlet class that implements Servlet. You implement it indirectly
    when you extend a class that implements this interface.


    The **Servlet** interface defines a contract between a servlet and the servlet
    container. The contract boils down to the promise by the servlet container to
    load the servlet class into memory and call specific methods on the servlet instance.
    There can be only one instance for each servlet type in an application.


    A user request causes the servlet container to call a servlet''s **service** method,
    passing an instance of **ServletRequest** and an instance of **ServletResponse**.
    The **ServletRequest** encapsulates the current HTTP request so that servlet developers
    do not have to parse and manipulate raw HTTP data. The **ServletResponse** represents
    the HTTP response for the current user and makes it easy to send response back
    to the user.


    For each application the servlet container also creates an instance of **ServletContext**.
    This object encapsulates the environment details of the context (application).
    There is only one **ServletContext** for each context. For each servlet instance,
    there is also a **ServletConfig** that encapsulates the servlet configuration.


    Let''s first look at the **Servlet** interface. Other interfaces mentioned above
    will be explained in the other sections of this appendix.'
  merge: -1
  pgno: 407
- img_proc: true
  md: "# Servlet\n\nThe Servlet interface defines these five methods.\n\n```\n```java\n\
    void init(ServletConfig config) throws SQLException\nvoid service(ServletRequest\
    \ request, ServletResponse response)\n    throws ServletException, java.io.IOException\n\
    void destroy()\\nlang.String getServletInfo()\nServletConfig getServletConfig()\n\
    ```\n```\n\nNote that the convention for writing a Java method signature is to\
    \ use fully-qualified names for types that are not in the same package as the\
    \ type containing them. However, in the signature of the **service method, javax.servlet.ServletException**,\
    \ which is in the same package as **Servlet**, is written without the package\
    \ information whereas **java.io.Exception** is written fully.\n\n+   **init, service,\
    \ and destroy** are lifecycle methods. The servlet container invokes these methods\
    \ according to these rules.\n* **init**: The servlet container invokes this method\
    \ the first time the servlet is requested. This method is not called at subsequent\
    \ requests. When invoking this method, the servlet container passes a **ServletConfig**\
    \ to initialization code. Normally, you will assign the **ServletConfig** to a\
    \ class level variable so that this object can be used from other points in the\
    \ servlet class.\n* **service**: The servlet container invokes this method each\
    \ time the servlet is requested. You write the code that the servlet is supplied\
    \ to do here. The first time the servlet is requested, the container calls the\
    \ **init method** and the **service method**. For subsequent requests, only **service**\
    \ is invoked.\n* **destroy**: The servlet container invokes this method when the\
    \ servlet is about to be destroyed. This occurs when the application is unloaded\
    \ or when the servlet container is being shut down. Normally, you write clean-up\
    \ code in this method.\n\nThe other methods in **Servlet** are non-life cycle\
    \ methods: **getServletInfo** and **getServletConfig**.\n\n+   **getServletInfo**:\
    \ This method returns the description of the servlet. You can return any string\
    \ that might be useful or even null.\n* **getServletConfig**: This method returns\
    \ the **ServletConfig** passed by the servlet container to the **init method**.\
    \ However, in order for **getServletConfig** to return a null value, you must\
    \ have assigned the **ServletConfig** passed to a method to a class level variable.\
    \ **ServletConfig** is explained in the section \"ServletConfig\" in this appendix.\n\
    \nAn important point to note is thread safety. A servlet instance is shared by\
    \ all users in an application, so class-level variables are not recommended, unless\
    \ they are read-only or members of the **java.util.concurrent.atomic** package."
  merge: -1
  pgno: 408
