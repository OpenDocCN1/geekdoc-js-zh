  md: '# The Benefits of Spring MVC


    When writing a Model 2 application without a framework, it is your responsibility
    to write a dispatcher servlet and controller classes. Your dispatcher servlet
    must be capable of doing these things:


    +   - Determine from the URI what action to invoke.

    - Instantiate the correct controller class.

    - Populate a form bean with request parameter values.

    - Call the correct method in the controller object.

    - Forward control to a view (JSP page).


    Spring MVC is an MVC framework that employs a dispatcher servlet that invokes
    methods in controllers and forwards control to a view. This is the first benefit
    of using Spring MVC: You don''t need to write your dispatcher servlet. Here is
    the list of features that Spring MVC is equipped with to make development more
    rapid.


    +   - Spring MVC provides a dispatcher servlet, saving your writing one.

    - Spring MVC employs an XML-based configuration file that you can edit without
    recompiling the application.

    - Spring MVC instantiates controller classes and populates beans with user inputs.

    - Spring MVC automatically binds user input with the correct type. For example,
    Spring MVC can automatically parse a string and sets a property of type float
    or decimal.

    - Spring MVC validates user input and redirects the user back to the input form
    if validation failed. Input validation is optional and can be done programmatically
    or declaratively. On top of that, Spring MVC provides built-in validators for
    most of the tasks you may encounter when building a web application.

    - Spring MVC is part of the Spring framework. You get everything Spring has to
    offer.

    - Spring MVC supports internationalization and localization. This means, you can
    display messages in multiple languages depending on the user locale.

    - Spring MVC supports multiple view technologies. Most of the time you''ll be
    JSP, but other technologies are supported, including Velocity and FreeMarker.'
