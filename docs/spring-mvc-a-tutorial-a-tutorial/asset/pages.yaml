    \ \"\\\"\");\n    }\n}\n}\n```\n\nNote that the convert method in Listing 6.1\
    \ converts a String to a LocalDate using the date pattern passed to the constructor.\n\
    \nTo use custom converters in a Spring MVC application, you need to write a conversionService\
    \ bean in your Spring MVC configuration file. The class name for the bean must\
    \ be org.springframework.context.support.ConversionServiceFactoryBean The bean\
    \ must contain a converters property that lists all converters to be used in the\
    \ application. For example, the following bean declaration registers the StringToDateConverter\
    \ in Listing 6.1.\n\n```\n<bean id=\"conversionService\" class=\"org.springframework.context.support\
    \ ConversionServiceFactoryBean\">\n    <property name=\"converters\">\n      \
    \  <list>\n            <bean class=\"converter.StringToLocalDateConverter\">\n\
    \                <constructor-arg type=\"java.lang.String\" value=\"MM-dd-yyyy\"\
    />\n            </bean>\n        </list>\n    </property>\n</bean>\n```\n\nAfter\
    \ that, you need to assign the bean name (in this case, conversionService) to\
    \ the conversion-service attribute of the annotation-driven element, like so\n\
    \n```\n<mvc:annotation-driven conversion-service=\"conversionService\"/>\n```\n\
