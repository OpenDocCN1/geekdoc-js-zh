  md: '# # Downloading Spring or Using STS with Maven/Gradle


    The Spring Framework website recommends that you use Maven or Gradle to download
    Spring and its dependencies. A dependency is a piece of software that your application
    depends on and without which your application cannot run. A modern application
    may have a lot of dependencies that in turn have.Maven and Gradle are popular
    dependency management systems. Using a dependency manager saves you from having
    to download and resolve dependencies yourself. In addition, these software suites
    help build, test, and package your apps. Using Maven or Gradle is a good idea
    if you already know how to use it. The fact, there are many Java developers out
    there who are not familiar with Maven or Gradle, who do not like using it or choose
    not to use it. Asking them to learn Maven or Gradle before being able to build
    and test their Spring applications defeats the purpose of a good tutorial. As
    such, I present all examples in this book in two forms: one for Maven/Gradle-free
    distribution and one for Maven-based distribution. If you are not familiar with
    Maven or Gradle, you will not be forced to learn it.


    Maven used to be the sole dependency management system that Spring supported.
    In fact, the Spring development tool, an Eclipse-based IDE called Spring Tool
    Suite (STS), bundles a recent version of Maven. This is good news for those who
    do not know Maven but STS and can enjoy dependency management without learning
    Maven. If you are familiar with Eclipse, you will feel at home. However, at the
    time of writing, the latest version of STS is not without its flaws. For example,
    when using STS to create a Spring MVC application, the generated application lacks
    the servlet deployment descriptor (web.xml file) and the Maven plug-in gives you
    an error message. This can be frustrating because you are forced to handle a Maven
    issue. Of course, you can fix it by simply creating a web.xml file. However, a
    web.xml file is optional since Servlet 3.0 and you can build a Spring MVC app
    without a web.xml file.


    These subsections provide instructions on working with Spring and without Maven/Gradle.'
  merge: -1
  pgno: 16
