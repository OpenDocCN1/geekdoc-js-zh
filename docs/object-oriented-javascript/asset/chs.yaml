  \n### 编辑 Plunker 脚本\n\n随意运行和编辑你在书中找到的任何 Plunker 脚本。当你修改并保存它们时，不会对原始文件产生任何影响。\n\n\
  ## 我为什么要写这本书？\n\n我决定写这本书有几个原因：\n\n1. 我是一个老牌 C++ 开发者，因此在过去开发软件时，我比硬件比 JavaScript\
  \ 强制执行的“安全”距离更接近底层。然而，我发现理解对象（引用类型）如何在内存中被创建和存储，与原始类型（内建类型，如 Number）如何存储，可以开启 JavaScript\
  \ 开发者对整个 JavaScript 解释器以及真实发生情况的理解。我发现这一切非常迷人（这也是我想写这本书的另一个原因）。\n\n\n\n\n2. 凭借我的背景，我对事物的看法与我在许多其他书中看到的解释略有不同，因此我非常想给出自己的解释，为正在发生的情况提供一个不同的视角。\n\
  \n3. 我热爱写作，专注于特定的主题，并像研究科学家一样，一步步地审视编程语言。\n\n我相信所有这些理由都会让这本书读起来更加有趣、更有意思。\n\n##\
  \ 关于内存模型的重要说明\n\n在写完前两章后，我回到了这段引言添加了这段备注，因为我确定有人会对我表示某些内存中对象或项目的方式产生意见。首先，我们来聊聊字符串（strings）。在某个时刻，某人看到我展示内存中字节的地方，然后你会想：“等一下，字符串是不可变的，而且每次更改字符串时内存都会重新分配，这不可能是的。”\n\
  \n### 用于指令的简化模型\n\n请理解，我创建了简化的内存模型（插图），以便帮助用户一次专注于一个概念，并从其他问题中孤立地学习该点。这些插图和解释的目的不是为了提供\
  \ JavaScript 在内存中的精确实现，而是为了解释这些可能是如何实现的，从而引导读者坚实地理解这些底层内容如何影响他们的 JavaScript 代码。\n\
  \n这里是关于我的介绍，因为你可能从未听说过我。\n\n## 关于作者\n\n### 经验\n\n自 1993 年以来，我一直作为专业人士开发软件（编写计算机程序）。\n\
  \n### 广泛的技术范围\n\n我编写过 `C++`、`Visual C++`、`Visual Basic`（版本 1.0、3.0、5.0、6.0 和 `VB.Net`）、`Java`（不要与\
  \ JavaScript 混淆）、`C#`、`PERL`、`Python` 以及 `JavaScript`。以及许多其他编程语言（一些脚本语言）。\n\n###\
  \ 丰富的行业经验\n\n我曾在规模从极小（50 人或以下）到极大（数千员工）的公司工作过。这些公司涉及各个行业，如土木工程、房地产管理、法律数据存储与检索、抵押贷款、生物技术和电子商务。\n\
  \n### 丰富的经验\n\n我的起步是在一家小型电脑店组装电脑。后来我转到了客户支持（帮助台），那里每个电话那头都是一个愤怒的人，他们需要立即解决方案。我一路进入\
  \ `Software QA`（质量保证——软件测试），并最终拼进了计算机编程的世界。\n\n## 这本书的独特之处\n\n这本书之所以不同，是因为我不同。可能很多计算机书籍作者都是真正的软件工程师，他们拥有学术背景且极其聪明。\n\
  \n### 剥洋葱\n\n我并不极端聪明。相反，我只是努力。你懂我的意思吗？我可能不是抽屉里最利的刀，但我能切开洋葱。老天，我曾曾在没有桨的情况下被困在河上，必须把自己从木头堵塞中救出来。我曾因为没有*快速*开发出软件解决方案，而被脸红脖脖的经理对我大吼大叫并威胁我的工作。我曾工作到凌晨\
  \ 3 点来解决棘手的问题。我曾让自己置于风险之中，用尽我的一切来让程序运行起来。\n\n你可以访问我的网站：http://www.NewtonSaber.com\n\
  你可以访问书籍的网站：http://NewtonSaber.com/OOJavascript\n\n你可以通过 newton@newtonsaber.com 联系我。\n\
  \n现在，让我们开始吧。\n\n# 第一章\n\n### 奠定基础：类型\n\n由于大脑运作运作，当我们一次只关注一件事时最容易学习。然而，在面对像 `JavaScript`\
  \ 这样庞大的课题（它自 1995 年 9 月由 Brendan Eich 最初为 `Netscape Navigator 2.0` 创建以来就一直在使用），要知道先关注什么可能是一个挑战。此外，如果你没有建立好基础基础，以后学习高级概念将困难得多。这就是为什么我想带你回到一个非常基础的概念，它是\
  \ `JavaScript` 中发生一切事情的基础：类型系统（The Type System）。\n\n## JavaScript 如何处理类型\n\n在 `JavaScript`\
  \ 中——就像许多高级语言一样——所有类型都可以组织成两类：\n\n1. 原始类型（Primitive types）——内存地址指示数据（或值）的存储位置。\n\
  2. 引用类型（Reference types）——内存地址指示对象存储的位置。\n\n* 这一陈可能会让人困惑。我稍后就会为你解释它。\n\n首先，让我们看看原始类型。\n\
  \n`JavaScript` 中只有五种原始类型，它们是：\n1. `Number`\n2. `Boolean`\n3. `String`\n4. `undefined`\n\
  5. `null`\n\n最后两个对你来说可能有点奇怪，我们会提到它们，但首先让我们看看前三个，并了解为什么理解它们都是原始类型是非常重要的。然后，我们将深入研究引用类型以及它们的不同之处。这两种类型对比的知识实际上有助于你理解运行你所有\
  \ `JavaScript` 代码的 `JavaScript 器` 是如何工作的，以及为什么创建 `Objects`（引用类型）与创建其他是如此不同。\n\n\n\
  \n\n现在让我回到我之前关于原始类型（primitives）的那个有点奇怪的陈述，当时我提到：\n\n“内存地址指示了数据（或值）存储的位置。”\n\n这意味着什么？\n\
  \n为了更好地理解它，你必须记住，所有数据都存储在内存中某个可寻址的位置。数据必须这样存储，以便其他程序元素可以访问它。否则，如果没有方法告诉程序数据存储在哪里，计算机程序就无法操作或显示这些数据，这些数据将变得无法访问且毫无用处。\n\
  \n*你编写 JavaScript，你就控制了内存芯片*\n\n此外，请记住，在底层的某个地方，你指示要存储的值实际上存储在内存中某个具有唯一地址的区域。没错，你仅仅通过输入以下代码，实际上就在控制计算机内部某处内存芯片上的开关：\n\
  \n```javascript\nvar x = 55;\n```\n\n再次，在 JavaScript 中创建一个 `Number`，你只需要编写如下代码：\n\
  \n```javascript\nvar x = 31;\nvar z = 56;\n```\n\n## JavaScript 解释器做了什么\n\nJavaScript\
  \ 解释器注意到你将值设置为了数值，并决定该类型将是 `Number`。由于它是 `Number`，解释器知道需要特定数量的字节来存储一个最大值。\n\n解释器必须知道它是什么类型，是因为在后台——即计算的底层——实际上发生了某些事情。当你仅仅创建一个\
  \ `Number` 变量（`var counter = 5;`）时，JavaScript 解释器必须做一些事情，以便计算机的处理器知道你想做什么。\n\n以下是解释器做的一些工作：\n\
  1. 找到一个具有足够连续槽来存储 `Number` 类型的内存位置。\n2. 在内部查找表中创建一个条目，存储你的变量名以及该变量名——这样当你使用定义的名称引用变量时，它就知道你的变量存储在内存的什么位置。\n\
  \n### 第一步：寻找内存\n\n为了完成第一步，JavaScript 解释器必须知道 `Number` 类型在内存中占据的字节数。\n\n### JavaScript\
  \ 解释器的架构师\n\n在原始类型（`Number`、`Boolean`、`String` 等）的情况下，创建 JavaScript 解释器的架构师决定，每个类型在内存中将占据预定的字节数。\n\
  \n### JavaScript 原始类型 Number：64 位（8 字节）\n\n目前在浏览器中运行的 JavaScript 中，`Number` 类型获得\
  \ 8 字节（64 位）的内存空间。某些架构师做出这个决定，是在你能够存储的最大值与程序中每个 `Number` 占用的内存之间进行的一种权衡。\n\n在 CPU（主处理器）运行并按位读取内存的底层，当数据被写入顺序内存地址时，这对于低级程序员来说会变得容易得多。\n\
  \n#### 它看起来是什么样的\n\n当你创建一个新的数字变量时，JavaScript 解释器会在其可用的寻址内存空间内寻找 8 个连续的字节，并设置找到找到的位来表示你存储的值。\n\
  \n```javascript\nvar counter = 27;\n```\n\n解释器将 `27` 存储在地址 `0x00FFC0`。\n\n![](img/00004.gif)*图\
  \ 2：存储在内存中的值 27*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure2.png\n\n仔细观察图\
  \ 2：存储在内存中的值 27。\n\n想象每个矩形代表一个内存字节。大多数现代计算机只允许你寻址字节内存（而不是位级别），因此每个地址代表那一个字节。在我们案例中，当我们写\
  \ `var counter = 27;` 时，解释器找到了从地址 `0x00CCF0` 开始的 8 字节内存，并将位设置为 `27`。另外请注意，尽管我们可以将值存储在第一个字节中，解释器（以及网络浏览器和操作系统）实际上预留了整个\
  \ 8 字节内存块。我将这些字节的所有位清零，以表示它们正在被使用。这意味着其他东西不能使用这些字节，否则 JavaScript 将解释为 `counter`\
  \ 的值已经发生了变化。该内存完全由 JavaScript 控制，用于存储到 `counter` 变量的值。\n\n### 读取和写入该内存\n\n在 JavaScript\
  \ 解释器记住你的名称 `counter` 后，它将以此找到那块内存。这样，当程序后续代码执行类似下面的操作时：\n\n```javascript\ncounter++;\
  \ // 计数器加 1\n```\n\n它就可以检索存储在那的值（`27`），将该值加 1，并再次存储在相同的位置，这样内存现在看起来就像图 3 所示：存储在某处的值\
  \ 28。\n\n![](img/00005.gif)*图 3：存储在某处的值 28*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure3.png\n\
  \n## 地址存储的值已更改\n\n这里的点是，存储在内存地址上的**值**已经了。而且，现在解释器已经存储了该数据所在的地址，你不能在此程序内更改该地址。它是被锁定的。这意味着你可以通过更改变量的值来更新地址的值，但你永远无法更改变量所指向的地址。噢，事实上，在其他语言（C,\
  \ C++）中，存在指针变量允许你更改变量所指向的地址。\n\n稍后我们将此与引用类型（Reference type）改变时发生的情况对比，这对于你理解 JavaScript\
  \ 如何工作至关重要。\n\n## 现在 现在更有意义了\n\n现在我解释了这些，我就可以向你解释 `undefined` 原始值了。记得我告诉过你当你给变量设置一个值时，JavaScript\
  \ 解释器决定它是什么类型吗？\n\n假设你在 JavaScript 中执行以下操作：`var x;`\n\n`x` 是什么类型？\n\n它是 `undefined`，我们可以通过以下代码证明这一点：\n\
  \n```javascript\nvar x;\nconsole.log(\"x is \" + typeof x + \" type\");\n```\n\n\
  现在，让我们思考 JavaScript 在这种情况下必须做什么。它无法确定类型，但它必须跟踪你创建新变量的事实。但是，它的值应该是什么？在许多语言（C++, C#,\
  \ Java – 与 JavaScript 无关）中，它的值是 `null`。但在 JavaScript 中，架构师为这种情况创建了这种特殊值 `undefined`。\n\
  \n在这种情况下，变量还没有被分配任何内存。它不能被分配，因为解释器不知道这个东西在内存中将占据多少空间。\n\n## 对对 如何定义的猜想\n\n这是我对 JavaScript\
  \ 做的猜想。\n\n在内存深处的某处，有一个孤独的地址，坐着一个 `undefined` 类型的值。它看起来可能像图 4 所示：地址空间中唯一的一个 undefined\
  \ 对象。\n\n![](img/00006.gif)*图 4：地址空间中唯一的一个 undefined 对象*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure4.png\n\
  \n那么，当你创建一个没有设置其值的新变量时，解释器将你的变量名存储在它的查找表中，然后将其值设置为该位置（`0x000001`），这样当你询问 `var x`\
  \ 是什么类型时，它会返回它指向的类型：`undefined`。这应该是向 JavaScript 开发者指示该变量还没有设置过值。\n\n好的，那么 `null`\
  \ 呢？好的，到为止我们已经看了两个原始类型 `Number` 和 `undefined`。让我们快速看一下 `Boolean` 和 `String` 类型，因为它们与\
  \ `Number` 非常相似，然后我们将查看引用类型，这样理解 `null` 类型会稍微容易一点。\n\n### 布尔值很简单，但要记住 true/false\
  \ 大写\n\n布尔值允许你创建一个只存储两种状态的变量：true 或 false。\n\n你可以非常容易地创建一个布尔变量：\n\n```javascript\n\
  var isConfigured = false;\nconsole.log(\"isConfigured is a \" + typeof isConfigured);\n\
  ```\n\n\n\n\n\n(http://uncoveryourlife.com/learnJs/runanyjs.htm) 你将看到图 5 所示的结果：创建布尔值的结果。\n\
  \n*图 5：创建布尔值的结果*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure5.png 你可以在此处查看这两个布尔脚本的\
  \ Plunker：http://plnkr.co/edit/KCNVZvljPhVkNssZwqZp?p=preview\n\n注意，`false` 是小写的。这是因为\
  \ `true` 和 `false` 是 JavaScript 中的关键字，而 `True` 和 `False` 则不是。\n\n你可以通过运行这段代码看到这一点：\n\
  \n```javascript\nvar isConfigured = False;\nconsole.log(\"isConfigured is a \" +\
  \ typeof isConfigured);\n```\n\n`False` 在 JavaScript 中是未定义的（undefined），所以当你一尝试设置该变量就会得到错误。\n\
  \n## 布尔值，可能存储一个字节\n\n布尔值可能存储一个字节，因为你字面上可以将其存储在一个位中（1 或 0）。布尔值看起来可能与图 6 所示相似：存储在内存中的布尔值\
  \ true (1)。\n\n![](img/00007.gif)*图 6：存储在内存中的布尔值 true (1)**\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure6.png\n\
  \n如果值为 `false`，那么可能所有位都是 0，最终值为 `0\\`。然而，再次注意，它存储的是该内存地址处变量的值。\n\n## 字符串类型 (String\
  \ Type)\n\n最后，让我们来看字符串类型（String）。\n\n你可以使用以下代码创建一个字符串：\n\n```javascript\nvar firstName\
  \ = \"robert\";\nconsole.log(\"firstName is a \" + typeof firstName);\n```\n\n你可以在图\
  \ 7 中看到这段代码的结果：创建一个字符串类型。\n\n*图 7：创建一个字符串类型*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure7.png\
  \ 你可以在此处查看此代码的 Plunker：\n\nhttp://plnkr.co/edit/BoYunjGYMQ9MkGfDzOcI?p=preview\n\
  \n字符串略有不同，因为字符串中的每个字符都需要一个字节来存储，但在变量设置值之前，无法确定字符串的长度。\n\n解释器（Interpreter）以及更底层（如网络浏览器和底层的操作系统）仍然受到限制，必须找到连续的内存来存储字符串。\n\
  \n这意味着底层部分需要执行更多工作来存储你的字符串。\n\n让我们通过观察使用以下 JavaScript 存储字符串时的内存，来更仔细地观察这一点：\n\n\
  ```javascript\nvar companyName = \"Big House\";\n```\n\n看图 8：内存中的字符串。\n\n![](img/00008.gif)*图\
  \ 8：内存中的字符串*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure8.png\n\n### 终止字符\
  \ (Terminating Character)\n\n首先注意位于 `0x00CD01` 处的最后一个奇数字符。由于字符串可以是任何长度，因此必须有一种方法来确定与字符串关联的最后一个字节。在\
  \ C 和 C++ 中，他们使用 `\\0`（反斜杠后跟零）来表示。JavaScript 中可能也是一样。这里要取的观点是，必须有人处理字符串长度不同，以及变量关联内存必须是连续的限制。\n\
  \n### 如果字符串增长了怎么办？\n\n这应该会立刻联想到这个问题：如果你将其设置为一个新的字符串值，字符串变长了怎么办？\n\n例如，如果稍后在程序中存储：\n\
  \n```javascript\ncompanyName = \"Big House Crafts\";\n```\n\n程序突然需要额外的七个连续的字节。但是，如果\
  \ `0x00CD01` 之后的字节已经被其他变量占用了怎么办？\n\n## 字符串可能通过引用实现\n\n这就是为什么 JavaScript 中的字符串极可能不是通过值实现的，而是通过引用实现的。现在，我们正在向对引用类型（Reference\
  \ Types）的理解迈进。\n\n## 引用类型与原始类型之间的主要区别\n\n原始类型（Primitive types）在内存地址处存储实际值。引用类型在内存地址处存储一个地址。让我再说一遍：引用类型不是在内存地址处存储实际数据值，而是存储一个指向内存中另一个地方的地址，数据实际上存储在那里。\n\
  \n想想我目前为止向你展示的那些内存图片，并将其与图 9 进行比较：存储引用类型，这是我们存储一个引用类型时内存的样子。\n\n![](img/00009.gif)*图\
  \ 9：存储引用类型*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure9.png\n\n首先，在图 9\
  \ 中，我仍然在向你展示原始类型 `Number` 的存储（在 `0x00CCF0 - 0x00CCF7` 中）。然而，我们想要关注存储在位置 `0x00CCF8`\
  \ 的值（另一个地址）。\n\n### 大蓝条：内存墙\n\n大蓝条简单代表左侧内存与右侧内存的分隔，以便向你展示引用类型存储了一个内存地址，该地址指向另一部分内存，那里是字符串实际数据的存储处。\n\
  \n它指向的内存地址是 `0x00AA01\\`。这是存储变长字符串（在此情况下为 16 字节 + 1 字节终止符）的基地址。\n\n### 为什么它们要存储地址而不是值？\n\
  \n字符串类型指出了将占用不同数量字节的挑战。\n\n### 子系统处理问题\n\n这涉及很多工作，因为字符串改变了。\n\n### 当字符串改变时会发生什么？\n\
  \n接下来，解释器所做的只是存储地址。\n\n## 最后是对象 (Objects)\n\n这带我们进入引用类型的领域。\n\n引用类型是对象或用户定义类型（UDT）。用户定义类型也会根据其定义方式需要不同数量的字节。\n\
  \n## 对象在内存中占用不同数量的字节\n\n让我们来看一个基础对象（Object），并更多地了解为什么它在内存中占用不同数量的字节。\n\n这是在 JavaScript\
  \ 中创建新对象的一种方法：\n\n```javascript\nvar firstObj = {};\nconsole.log(\"firstObj is an\
  \ \" + typeof first););``````\n\n运行代码时，你的浏览器中会显示以下内容：\n\nfirst is Empty Object,\
  \ St Object Empty Memory\n\n该对象基本上是空的，因为我们还没有向它添加任何属性。我不知道它在内存中占用多少字节，因为取决于 JavaScript\
  \ 解释器架构如何实现基础 JavaScript 对象。对于我们而言，只知道解释器请求子系统在内存中创建一个对象，并请求该对象的基地址并将其存储以便以后再次访问。\n\
  \n它看起来可能像图 10 所示：内存中的空对象。\n\n## 对象由其他类型组成\n\n然而，对象可以——且通常是——由其他类型组成。\n\n例如，如果我们取之前的对象并添加几个项，我们需要更多的内存来存储整个对象。\n\
  \n```javascript\nfirstObj.name = \"builder\";\nfirstObj.counter = \"0\";\nfirstObj.isConfigured\
  \ = false;\n```\n\n\n\n\n此时，我们至少需要 17 字节来存储所有内容：7 字节字符串 + 1 字节字符串终止符 + 8 字节数字 +\
  \  1 字节布尔值。然而，`Object` 是引用类型，所以这并不重要。相反发生的是分配了新内存并将基地址报告给后台并由解释器存储。\n\n# JavaScript\
  \ 数组是引用类型\n\n还有其他引用类型吗？是的，JavaScript 的 `Array` 是引用类型，因为它在内存中的大小是可变的，而且你可以向数组中推送（push）或弹出（pop）项。\n\
  \n你可以创建一个数组并对其进行推送和弹出操作（动态更改其大小）。这是一个向数组中添加了大量内容的高级脚本。运行它或查看图 11 中的输出：数组包含对象及更多，因为这应该让你思考数组中的项在内存中是动态增长的这一事实。这非常重要。\n\
  \n```javascript\nvar allItems=[];\n\nallItems.push({});\n\nallItems.push({});\n\n\
  console.log(\"There are \" + allItems.length + \" items in allItems.\");\n\nallItems[0].x\
  \ = 55;\n\nallItems[0].today = new Date(); console.log(allItems[0]);\n```\n\n![](img/00011.jpeg)*图\
  \ 11: 数组包含对象及更多*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure11.png\n\n\
  你可以在 Plunker 上仔细检查脚本并对其进行修改：http://plnkr.co/edit/sMcU70Gg1bRAofaRtLir?p=preview\n\
  \n注意，Chrome 开发者工具允许你将数组项输出到控制台，然后检查该项内部的内容。在图 11：数组包含对象及更多的示例中，你可以看到我向数组中添加了一个大小可变的对象，该对象在内存中的大小也是变化的。这一切之所以成为可能，是因为引用类型。\n\
  \n# 理解所有这些内存知识对 JavaScript 程序员重要吗？\n\n好了，现在你已经知道了基本类型（在地址处存储其值）和引用类型（在初始内存地址处存储内存地址）之间的区别，但这对你作为\
  \ JavaScript 开发者来说有什么影响呢？我很高兴你问这个问题，因为这对理解你的代码有巨大影响。\n\n# 基本类型与引用类型如何影响 JavaScript\
  \ 开发者？\n\n如果你读过了之前的材料并对其有了基本的掌握，那么你已经处于与 90% 的 JavaScript 开发者不同的位置，因为他们并不理解基本类型和引用类型的存储方式不同。深入理解这一点有助于我们构建更健壮的代码。让我们来看一个示例来展示这有多重要。\n\
  \n# 第一个简单问题：复制时会发生什么？\n\n现在，我们可以开始讨论复制基本类型与复制引用类型时会发生什么区别。\n\n复制基本类型与复制引用类型是不同的，这种不同是因为这些不同类型在内存中的存储方式不同。\n\
  \n让我们现在通过一个显示差异的脚本来看这个问题。\n\n注意：我在这里提供了整个脚本，你可以在 http://UncoverYourLife.com/LearnJS/RunAnyJS.htm\
  \ 运行。然而，在当前格式下可能很难阅读，因此我也放置了一张带有输出的脚本图片，即图 12：基本类型的复制与引用类型的复制。\n\n```javascript\n\
  // ### 创建基本类型并将其复制到另一个基本类型中 ###\n\nvar numberOfChildren = 1; // 步骤 1 console.log(\"\
  numberOfChildren is : \" + numberOfChildren + \" - STEP 1\"); numberOfChildren =\
  \ 3; // 步骤 2 console.log(\"Changed numberOfChildren to : \" + numberOfChildren +\
  \ \" - STEP 2\");\n\nvar numberOfGrandkids =\n\nnumberOfChildren; // 步骤 3\n\nconsole.log(\"\
  numberOfGrandkids is : \" + numberOfGrandkids + \" - STEP 3\"); console.log(\"changing\n\
  \nnumberOfGrandkids to 5...\");\n\nnumberOfGrandKids = 5; // 步骤 4 console.log(\"\
  numberOfChildren is still : \" + numberOfChildren + \" STEP 4\");\n\n// ### 创建引用并将其复制到另一个引用类型中\
  \ ####\n\nvar infoOrig = {} // 步骤 5\n\ninfoOrig.children = 2; // 步骤 6 console.log(\"\
  infoOrig.children is : \" + infoOrig.children + \" - STEP 5 & 6\");\n\ninfoOrig.children\
  \ = 4; // 步骤 7 console.log(\"Changed\n\ninfoOrig.children to : \" +\n\ninfoOrig.children\
  \ + \" - STEP 7\");\n\nvar infoCopy = infoOrig; // 步骤 8 console.log(\"infoCopy.children\
  \ : \" + infoCopy.children + \" - STEP 8\");\n\ninfoCopy.children = 7; // 步骤 9 console.log(\"\
  infoOrig.children HAS CHANGED!!: \" + infoOrig.children + \"\n\n- STEP 9\");\n```\n\
  \n你可以在 Plunker 上更仔细地检查脚本：http://plnkr.co/edit/IDbJAGTEfvdAh3fyOj5Z?p=preview\n\n\
  看看图 12：基本类型的复制与引用类型的复制以查看输出。接下来我将带你通过每一个步骤，并展示内存中实际发生了什么，以及为什么引用类型的复制看起来行为很异。\n\n\
  ![](img/00012.jpeg)*图 12: 基本类型的复制与引用类型的复制* http://NewtonSaber.com/OOJavaScript/Images/Figure12.png\n\
  \n## 复制类型的逐步说明\n\n现在，将以下步骤与脚本中看到的步骤相对应，你就会发现为什么引用类型的复制似乎在做错，尽管它的行为完全符合 JavaScript\
  \ 解释器架构师的设计。\n\n***步骤 1***\n\n创建一个基本类型（`numberOfChildren`）并将其值设为 1（它是一个 `Number`\
  \ 类型）。\n\n![](img/00013.gif)*图 13: 步骤 1 - 创建数字基本类型*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure13.png\n\
  \n注意，我们有一个基内存地址 `0x00CCF0`，值为 1。我将所有字节都设为 `numberOfChildren`，只是为了让你看到这些字节在程序的生命周期内被分配给该基本类型。更改\
  \ `numberOfChildren` 的值。由于这是一个基本类型，解释器知道基内存地址并将该内存设置为值 3。`00000011` 是二进制 3。*\n\n\
  ![](img/00014.gif)*图 14: 步骤 2 - 更改 numberOfChildren 的值*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure14.png\n\
  \n***步骤 3***\n\n创建一个名为 `numberOfGrandkids` 的新基本类型（`Number` 类型），并将 `numberOfChildren`\
  \ 的值复制进去。当新基本类型创建时，它获得了基地址 `0x00CCF9`，值 3 被复制到该内存地址。\n\n![](img/00015.gif)*图 15:\
  \ 步骤 3 - 创建基本类型并将其复制到其中*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure15.png\n\
  \n将 `numberOfGrandkids` 的值设为 5；\n\n![](img/00016.gif)*图 16: 设置 numberOfGrandkids\
  \ = 5*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure16.png\n\n仔细查看图 16：设置\
  \ numberOfGrandkids = 5 并识别两点：\n\n1. `numberOfGrandkids` 的值现在是 5（二进制 `00000101`）\n\
  2. `numberOfChildren` 的值**没有** way。它仍然是 3。脚本打印了这个值以显示。\n\n***步骤 5***\n\n现在我们创建一个名为\
  \ `infoOrig` 的引用类型（`Object`）。记得可以使用 `{}` 括号初始化空对象。\n\n![](img/00017.gif)*图 17: 创建引用类型（Object)*\n\
  \nhttp://NewtonSaber.com/OOJavaScript/Images/Figure17.png\n\n正如我们之前学过的，我们看到解释器为内存中的对象获取了基地址（`0x00AA01`），并将该基地址存储在它的地址空间（`0x00CCF8`\
  \ 处），而不是值。\n\n***步骤 6***\n\n现在，我们为刚刚创建的对象（`infoOrig`）添加名为 `children` 的新基本类型（`Number`），然后将基本类型的值设为\
  \ 2。\n\n![](img/00018.gif)*图 18: 添加基本类型到引用类型中\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure18.png\n\
  \n你可以从图 18：添加基本类型到引用类型中看到基本类型已被创建并存储在内存中（黄色高亮部分）。\n\n***基本类型由引用类型拥有***\n\n\n\n\n\
  请记住，名为 `children` 的原始类型现在由 `Reference` 类型（`infoOrig`）拥有，因此由它管理该特定项目的内存。这意味着该引用项占据了新原始类型的全部内存空间，加上引用对象本身占用的任何内存——例如地址\
  \ `0x00AA01` 处的内存。\n\n## 引用类型：内存中可扩展的\n\n这是 `Object` 成为 `Reference` 类型的主要原因之一：因为它是一个`User\
  \ Defined Type`（自定义类型），因此它在内存中的大小是无法预定的。在这种情况下，我们的 UDT 仅由一个 `Number` 组成，但在其他情况下，对象可能包含任意数量的原始类型和/或其他引用类型。\n\
  \n### 第 7 步\n\n第 7 步与我们在第 2 步处理第一个原始类型（`numberOfChildren`）时类似。在第 7 步中，我们将 `children`\
  \ 的值改为 4。唯一的区别是这个原始类型由引用类型（`infoOrig`）拥有。然而，在此时你实际上看不出任何区别。\n\n内存现在看起来就像图 19 所示：修改由引用类型拥有的原始类型的值——现在\
  \ `children` 的值为 4（二进制 00000100）。\n\n![](img/00019.gif)**图 19：修改由引用类型拥有的原始类型的值*\
  \ http://NewtonSaber.com/OOJavaScript/Images/Figure19.png\n\n## 创建引用类型的拷贝\n\n现在我们为一种极其有趣的变化做准备，这种变化将让你惊讶，并将彻底开启你的思维，从一个全新的角度理解编程。\n\
  \n### 第 8 步\n\n理解这一个概念将让你在所有语言中成为一名更好的程序员，因为你将理解编写代码时真正发生了什么。\n\n创建一个拷贝简单意味着创建一个新的变量名，并将之前创建的值赋值给该变量名。我们已经在原始类型上这样做过，现在我们对通过这一行代码执行同样的事情：\n\
  \n```\nvar infoCopy = infoOrig;\n```\n\n然而，这行代码大不相同，因为我们正尝试创建一个新的 `Reference Type`，它的值与之前创建的\
  \ `Reference type` 相同。\n\n但你必须记住，存储为引用类型的值是一个地址（指向内存中对象所在位置的内存位置）。\n\n## 我的示例中内存不足（空间）\n\
  \n我的示例图中似乎内存（空间）不够了，因此我将取 `0x00CCEE` 处的值（假设这些值已被清空且未被使用）。我这样做仅仅是为了打印空间。\n\n当 JavaScript\
  \ `Interpreter` 看到这行代码时，它执行以下操作：\n\n1. 在其内部表中创建一个新的 `Reference object` (`infoCopy`）。\n\
  2. 将 `infoOrig` 的地址 (`0x00AA01`）保存到它引用 `infoCopy` 的地址 (`0x00AA01`) 处。\n\n这看起来就像图\
  \ 20 所示：创建了 `infoCopy` 引用类型。注意，现在你有两个指向内存中同一位置的变量。这两个变量*引用*内存中的同一个对象——地址为 `0x00AA01`\
  \ 的那个对象。\n\n![](img/00020.gif)**图 20：创建了 infoCopy 引用类型* http://NewtonSaber.com/OOJavaScript/Images/Figure20.png\n\
  \n### 第 9 步：你的两个引用都指向同一个东西\n\n这就是为什么现在当你通过 JavaScript `infoCopy.children = 7` 修改\
  \ `infoCopy` 的值时，你也修改了 `infoOrig.children` 的值。\n\n当 `Interpreter` 运行那行代码时，它查找 `infoCopy`\
  \ 的基础地址并获取 (`0x00AA01`)。然后它在该对象内部找到名为 `children` 的属性并设置为值 7。\n\n当这种情况发生时，你的另一个变量（`infoOrig`）仍然引用同一内存，因此你也修改了该值。\n\
  \n现在内存看起来就像图 21 所示：`infoCopy` 和 `infoOrig` 都指向同一个地址。\n\n![](img/00021.gif)**图 21：infoCopy\
  \ 和 infoOrig 都指向同一个地址* http://NewtonSaber.com/OOJavaScript/Images/Figure21.png\n\
  \n你看到现在创建一个对象的拷贝（也称为新引用）有多快了吗？\n\n你学到的关于 JavaScript 对象的其他知识都是基于此的，这就是为什么知道幕后到底发生了什么是如此重要的原因。\n\
  \n在我们阅读这本书的过程中，我们将进一步研究 `Reference types` 的影响，但现在你已经知道了这一点，你将能够更好地理解这本书的剩余部分。我在本章留下了关于\
  \ `Assembly Language`（汇编语言）的侧栏，我们将在下一章再次讨论 JavaScript `Functions`（它们也是引用类型）。\n\n\
  ## 侧栏 - 汇编语言？我以为这是 JavaScript\n\n在过去，程序员没有我们现在这样好的 GUI（图形用户界面），他们必须知道如何直接与计算机的 `CPU`（主处理器）通信，并告诉它将数据存储在特定的内存位置（地址）。\n\
  \n他们使用 `Assembly language`（汇编语言），甚至在此之前使用 `Machine language`（机器语言）——这使用的是处理器所说的完全加密的语言。\n\
  \n有时，他们的代码——在 `Machine Language` 中——看起来看起来就是一串 0 和 1：\n\n```\n1110010101110000100101101\n\
  ```\n\n这会告诉 `CPU` 在内存地址 `0x0CCEE` 处存储值。\n\n### 易错性\n\n计算机科学家在尝试确定它时犯了许多错误，眼睛都看直了，这似乎是三个\
  \ 1 和一个 0。\n\n### 第三代语言\n\n你现在使用的是 `3GL`（第三代语言）或高级语言，因为你不需要直接与处理器通信。\n\n### JavaScript\
  \ 解释器为你工作\n\n在我们案例中，做这些工作的是 JavaScript `Interpreter`，它运行在浏览器内部。这意味着我们开发者现在可以编写更容易学习的代码。不需要理解处理器\
  \ `Op Codes`（操作码）和内存地址，要在内存位置存储一个值，只需输入以下有效的 JavaScript\n\n```\nvar x = 15;\n```\n\
  \n# 第 2 章\n\n### 函数：它们也是对象\n\n我们在上一章学习了许多关于幕后发生了什么的知识，本章将继续讨论。上次我们学习了可以通过以下方式创建一个对象：\n\
  \n```\nvar person = {};\nperson.firstName = \"frank\";\nperson.lastName = \"smith\"\
  ;\n```\n\n但是，现在假设你想创建另一个人。你想这样做，是因为你不想再次输入添加这些属性（lastName 和 firstName）的代码。你可能会想：“好吧，我会这样做：”\n\
  \n```\nvar person2 = person;\n```\n\n然而，正如我们在上一章学到的，这并没有创建一个新对象。它只是使用新的变量名对同一个对象创建了引用。如果我们希望\
  \ person2 拥有不同的 firstName 和 lastName（即新的内存地址来存储新值），这对我们来说并没有帮助。\n\n在其他语言（如 C++、Java\
  \ 或 C#）中，我们会创建一个 `class` 模板，然后将其实例化为对象。它看起来像如下：\n\n```csharp\n// C# 代码对比\nclass\
  \ person\n{\n    // 这是构造函数，在实例化新对象\n    // 时自动调用\n    public person(firstName, lastName);\n\
  \    public string lastName;\n    public string firstName;\n}\n```\n\n那么，每当我们想使用这个对象时，只需要这样做：\n\
  \n```csharp\n// ### C# 代码 ########\nperson ted = new person();\nted.firstName =\
  \ \"ted\";\nted.lastName = \"jones\";\n```\n\n\n\n\n# 定义\n实例化（Inst）意味着在物理内存中分配内存并构造对象。这意味着该对象是存在于内存中的一个有效结构，并且（取决于访问权限）对你的程序是可访问且可。\n\
  \n在 C++、Java、C# 中，你拥有 `new` 关键字，它允许你创建一个存在新内存地址的新对象。每当你需要一个新对象时，只需告诉编译器：`person\
  \ variableName = new person()` 即可得到一个。\n\n## JavaScript 的 new 运算符\nJavaScript 确实有一个\
  \ `new` 运算符，但它没有类模板的概念。幸运的是，在 JavaScript 中，我们可以通过函数来模拟我在上面的 C# 示例中展示的内容。\n\n这是因为函数实际上也是对象。既然函数是对象，让我们来简单聊一下对象的另一个方面。\n\
  \n## 对象拥有自己的内存\n记住，对象拥有自己的内存空间。另一种说法是，对象可能包含其他原始类型（`Number`、`Boolean` 等）和其他引用类型（`Objects`、`Arrays`\
  \ 等），无法在不通过实例化对象的情况下获取这些内容。\n\n在代码中，它看起来如下：\n\n```\nperson.firstName = \"Wilma\"\
  ;\n```\n\nJavaScript 没有提供其他获取 `firstName` 的方法，除非通过实例化的 `person` 对象。对象的内存是隔离的。\n\n\
  ## 对象是内存包装器\n另一种说法可能是，对象是内存包装器。让我们再次看一眼内存的图。这次我们将创建一个更高级的对象，它包含一个 `Number`、`String`、`Boolean`\
  \ 和一个 `Array`（引用类型）。\n\n以下是 JavaScript 代码：\n\n```javascript\nvar person = {};\n\
  person.firstName = \"Ted\"; person.age = 53;\nperson.hasChildren = true; person.children\
  \ = [];\nperson.children.push(\"sam\"); person.children.push(\"sara\"); person.children.push(\"\
  sandy\");\n```\n\n通过检查图 22：内存中的 person 对象，你可以看到 `person` 对象在内存中可能的样子。\n\n![](img/00022.gif)*图\
  \ 22：内存中的 person 对象*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure22.png\n\
  \n### 深入观察内存中的 person 对象\n在图 22 中，你可以看到：\n\n1. `person` 对象的基地址是 `0x00AA01` – 该地址指向内存中实际\
  \ person 对象（图 22 中的浅橙色区域）所在的位置。\n2. `person` 对象包含一个名为 `children` 的引用类型（`Array` 对象），它指向位于\
  \ `0x10FF00` 处数组对象的基地址（图 22 中的浅绿色区域）。\n3. `children` 中每个字符串的字节存储在数组对象中。\n\n你可以通过\
  \ Plunker 链接更细致地检查代码：http://plnkr.co/edit/ou3IpPVMhQqNu89fS7J9?p=preview\n\n如果不通过\
  \ `Array` 对象，你就无法获取 `childrenArray` 内部的值。例如，如果你想要其中一个值，可以使用以下 JavaScript 代码段来引用它。\n\
  \n```javascript\nconsole.log(person.children[0]);\n```\n\n这是因为如果不引用数组本身，你就没有办法引用该数组内部包含的内存。这就像是\
  \ `Array` 对象在这些值周围筑了墙，你必须来到 `Array` 对象才能获取这些值。\n\n`person` 对象中包含的项也是如此。事实上，我们可以把对象称为容器。你无法在不执行如下\
  \ JavaScript 代码的情况下获取 `person` 对象中的任何项：\n\n```javascript\nconsole.log(person.age);\n\
  ```\n\n### JavaScript 的另一种表述方式\n那种 JavaScript 语法就像是在说：\n\n进入 `person` 对象并查看内部（`.\
  \ `），找到一个名为 `age` 的属性，并告诉我存储在那里的值。\n\n### 等同于 JavaScript 的自然语言表述\n这基本上是另一种说法：\n\n\
  在内部 JavaScript 表格中查找 `person` 对象的地址。它是 `0x00AA01`，所以去该地址查找 `age` `Number`（原始类型）的地址。该地址是\
  \ `0x00AA05`，因此查看内存并确定存储在那里的值。\n\n### 包装器也是作用域\n这些对象包装器的有趣之处在于它们创建了作用域。它们限制了你查看其内部包含的值的范围。\n\
  \n事实上，Java、C++ 和 C# 使用了一些关键字来指示属性是否在对象外部可见。你在之前的示例代码中就看到了这一点，当时我有一些以 `public` 单词开头的语句。\n\
  \n## 错误指示作用域\n你可以看到作用域是受限的，因为如果你在脚本中添加以下行：\n\n```javascript\nconsole.log(age);\n\
  ```\n\n在 Google Chrome 中，你将收到一条显示“age is not defined”的错误。\n\n这是因为你查看的是应用程序作用域，而不是你的\
  \ `personobject` 作用域。\n\n我向你展示了这一切，让你现在能更好地理解函数。在 JavaScript 中，函数是对象，并且拥有作用域。\n\n\
  ## 函数是对象，它们拥有作用域\n作用域在编程世界非常重要。在 JavaScript 世界中，它可能会非常令人困惑。\n\n我们在代码中使用函数的主要原因之一是将它们拆分为我们可以处理的小部分。每个函数都有自己的作用域，并允许我们管理它们所使用的变量。这种作用域如何帮助我们程序员。函数在\
  \ JavaScript 中也是类型。\n\n## 什么是一等类型？\n仅仅是函数被视为类型。如果你阅读关于 JavaScript 的内容，可能会有人说“函数是一等对象”或“函数是一等类型”。\n\
  \n这仅仅意味着函数实际上变成了类型。就像有 `Number` 原始类型或 `Object` 引用类型一样，函数也是引用类型。\n\n## 使用 JavaScript\
  \ typeof\n通过 `typeof` 运算符我们可以看到这种新类型（`function`）。\n\n首先，我们需要定义一个可以测试的函数。这是一个简单的函数，计算传入字符串长度：\n\
  \n```javascript\nfunction charCounter(targetString)\n{\n  return targetString.length;\n\
  }\n```\n\n这里是使用该函数的代码：\n\n```javascript\nvar el = document.getElementById(\"first\"\
  );\nvar output = \"这个字符串的长度为 \";\nel.innerHTML = output + charCounter(output);\n\
  ```\n\n现在，我们可以检查名为 `charCounter` 的对象的类型。\n\n```javascript\nvar element2 = document.getElementById(\"\
  second\");\nelement2.innerHTML = \"charCounter 是 \" + typeof charCounter;\n```\n\
  \n当然，一旦你运行该代码，你会发现显示：charCounter 是 function JavaScript 解释器知道这是一个函数对象。\n\n## 函数与作用域\n\
  正如我们学过的对象拥有作用域，我们也了解到函数拥有作用域。\n\n看以下函数：\n\n```javascript\nfunction getRandomInteger()\n\
  {\n  var randomVal = Math.ceil(Math.random()*1000);\n}\n```\n\n// 调用函数生成随机数\ngetRandomInteger();\n\
  \n尽管上面的函数生成了随机数，但你只能在函数内部访问该值。显然，我们可以向函数添加以下行，以便我们能够获取该值：\n\n```javascript\nreturn\
  \ randomVal;\n```\n\n这里的点是函数有自己的作用域，这对 JavaScript 程序员很有帮助，可以让你保持值清晰。\n\n// 创建应用程序作用域的变量\n\
  var randomVal = 55;\n\nel1 = document.getElementById(\"first\");\nel1.innerHTML\
  \ = \"randomVal 是 : \" + randomVal;\n\nfunction getRandomInteger()\n{\n  // 创建具有函数作用域的变量\n\
  \  var randomVal = Math.ceil(Math.random()*1000);\n  var el2 = document.getElementById(\"\
  second\");\n  el2.innerHTML = \"在 getRandomInteger 内部 randomVal 是 \" + randomVal;\n\
  }\n\nvar el3 =\n\n\n\n\n\n```javascript\ndocument.getElementById(\"third\");\n\n\
  el3.innerHTML = \"back outside\n\ngetRandomInteger, randomVal is \" +\n\nrandomVal;\n\
  ```\n\n如果你运行这段代码，你会发现修改函数内部的 `randomVal` 对应用程序作用范围内的 `randomVal` 没有任何影响。\n\n输出结果如下所示：\n\
  \n![](img/00023.jpeg)**图 23: 函数作用域与变量*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure23.png\n\
  \n由于第一个 `randomVal` 定义在函数外部，而另一个定义在函数内部，因此它们是存储在两个独立内存位置的两个变量。\n\n## 函数是引用类型：对象\n\
  \n函数是一种 `Reference`（引用）类型，其存储方式与对象相同——它们本身就是对象——因此内存结构与我们之前看到的非常相似。请查看图 24 所示的最后一个程序的内存视图：内存中的函数对象。\n\
  \n![](img/00024.gif)**图 24: 内存中的函数对象*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure24.png\n\
  \n在你查看图 24 时，有许多需要仔细观察的地方。\n\n1. 左侧的 `randomVal`（橙色）是全局变量，它与右侧的 `randomVal`（绿色）不是同一个，后者是作用域于\
  \ `getRandomInteger` 函数的。如你所见，它们具有不同的基内存地址，设置其中一个不会影响另一个。\n\n2. 内存中的函数（右侧绿色）看起来与我们之前关于其他\
  \ `Reference` 类型的示例完全一样。这是因为它是一个 `Reference` 类型，并继承自 JavaScript 的基础 `Object` 类型。\n\
  \n3. 应用程序作用域包含两个指向 `HtmlDivElements` 的 `Reference` 类型（`el1` 和 `el3`）。函数作用域包含一个指向\
  \ `HtmlDivElement` 的引用。这些仅用于输出字符串以便你看到，因此我没有显示这些额外的内存占用。只需注意，这三项也变成了引用，因为它们是 HTML\
  \ 元素的引用。\n\n4. 此处需要注意的另一点：在我们的示例中，函数内部的 `randomVal` 得到了值 897，这无法放入 8 位（一个字节）中，因此你会发现设置二进制值时，它溢出到了第二个字节（地址\
  \ `0x00AA03`），因为我们需要更多位来存储那么大的值。整个值看起来像如下：`00000011 10000001`。只是想指出这一点，因为它与我们之前的示例不同。\n\
  \n## 向函数传递对象和原始类型\n\n现在，你已经看到函数是对象，这就会更加明显：我们可以将函数作为参数传递给函数，就像我们可以将对象传递给另一个函数一样。\n\
  \n由于还没有仔细检查它，让我们来看看传递 `Primitive`（原始）类型与传递像 `Number`、`Boolean` 等原始类型有何不同。\n\n再次，你会发现这对你来说将更加清晰，因为你理解了内存模型——JavaScript（以及子系统）为这些每种类型分配内存的方式。\n\
  \n```javascript\nfunction double(inNumber)\n{\ninNumber = inNumber * 2;\n}\n```\n\
  \n在 plnkr.co 查看此示例：\n\nhttp://plnkr.co/edit/lD3b4BbmLgXzjnqTdujI?p=preview\n\n以下是该示例的代码，你可以在此处运行：\n\
  \nhttp://uncoveryourlife.com/LearnJS/RunAnyJs.htm\n\n```javascript\nvar el = document.getElementById(\"\
  first\");\nvar el2 = document.getElementById(\"second\");\nvar el3 = document.getElementById(\"\
  third\");\nvar paramVal = 17;\n\nfunction double(inNumber) {\ninNumber = inNumber\
  \ * 2;\nel2.innerHTML = \"inNumber, inside double(), is \" + inNumber;\n}\n\nel.innerHTML\
  \ = \"paramVal, BEFORE being passed to double(), is \" + paramVal;\ndouble(paramVal);\n\
  el3.innerHTML = \"paramVal, AFTER being passed to double(), is \" + paramVal;\n\
  ```\n\n此示例仅创建了一个名为 `paramVal` 的应用程序变量，我们用它来传递给 `double()` 函数。\n\n在 `double()` 函数内部，我们没有创建新变量，而是直接将\
  \ `inNumber` 的值设为倍。\n\n然后，当我们从 `double()` 函数返回时，我们发现 `paramVal` 仍然保持它最初设置的值（17）。\n\
  \n## 原始类型参数具有函数作用域\n\n这是因为 `inNumber` 原始类型的内存是在 `double()` 函数作用域内创建的。\n\n让我们查看之前代码的内存模型，以了解实际发生了什么。检查图\
  \ 25：向函数传递原始类型，我将在下方解释正在发生的情况。\n\n![](img/00025.gif)**图 25: 向函数传递原始类型*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure25.png\n\
  \n**注意**：图 25 中 `inNumber` 的值为 34（函数运行后的值）。\n\n在检查内存模型后，你可以看到：\n\n1. `paramVal`\
  \ 被创建为全局变量——（橙色）`paramVal` 的基地址位于 `0x000CCF0`。\n\n2. 参数被创建为原始类型，其作用域于函数对象 `double()`。换句话说，`inNumber`\
  \ 获得了一个基地址（`0x00AA03`）。\n\n3. `paramVal` 没有受到影响，因为它是值传递。\n\n## 向函数传递引用类型\n\n你可能认为这看起来很简单，然而让我们观察传递引用类型会发生什么。\n\
  \n```javascript\nvar container = {};\ncontainer.paramVal = 17;\n```\n\n现在，我们在代码中添加：\n\
  \n```javascript\ndouble(container);\n```\n\n这意味着我们将整个对象传递给了函数。\n\n以下是更新后的代码，你可以在\
  \ RunJS 页面运行，或者可以在 plnkr.co 查看代码：\n\nhttp://plnkr.co/edit/C8RRuFh7ALVgM?p=preview\n\
  \n```javascript\nvar el = document.getElementById(\"first\");\nvar el2 = document.getElementById(\"\
  second\");\nvar el3 = document.getElementById(\"third\");\nvar container = {};\n\
  container.paramVal = 17;\n\nfunction double(inNumber) {\ninNumber.paramVal = inNumber.paramVal\
  \ * 2;\nel2.innerHTML = \"inNumber, inside double(), is \" + inNumber.paramVal;\n\
  }\n\nel.innerHTML = \"paramVal, BEFORE being passed to double(), is \" + container.paramVal;\n\
  double(container);\nel3.innerHTML = \"paramVal, AFTER being passed to double(),\
  \ is \" + container.paramVal;\n```\n\n如果你运行这段代码，你现在会看到类似下面的输出，它试图向你展示**传递的对象的原始值被\
  \ double() 函数修改了**。\n\n### paramVal, BEFORE being passed to double(), is 17 inNumber,\
  \ inside double(), is 34 paramVal, AFTER being passed to double(), is 34\n\n由于我们已经在内存中过过这一切，你可能理解为什么对象类型被修改了。图\
  \ 26：传递引用类型：部分 1 在内存中展示了这一点。注意在调用 `double()` 函数之前，`container.paramVal` 的值为 17。\n\
  \n![](img/00026.gif)**图 26: 传递引用类型：部分 1*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure26.png\n\
  \n这意味着 `inNumber` 参数指向可以找到对象的内存地址，从而能够获取存储在内部的原始值。\n\n\n\n\n\n## 值发生了变化，因为内存地址相同\n\
  \n这就是值发生变化的原因。在在上一个示例中，对于基本数据类型，我们看到有两个内存位置（每个基本数据类型一个）。然而，由于我们传递的是容器对象的引用，现在该基本数据类型只有一个内存地址（作用域于容器对象）。\n\
  \n这意味着当我们更改值时，我们正在更改原始容器对象内部的值。\n\n显示了该过程的第 2 步——在函数更改容器对象内部的 `paramVal` 之后。\n\n\
  ![](img/00027.gif) *图 27：传递引用类型：部分 2*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure27.png\n\
  \n## 引用传递与基本值传递的总结\n\n带框中的值现在是 34，而之前是 17。当你通过引用（通过对象）传递时，你操作的是你正在传递的对象的内存。\n\n\
  然而，当你传递一个基本数据类型（按值传递）时，你只是传递了值，并会创建新的内存来存储该值。\n\n现在你已经知道传递引用类型与传递基本数据类型会得到不同的结果，这将帮助你理解\
  \ JavaScript 如何在内存中处理这些类型，并让你更好地理解代码的执行。\n\n现在我们的措辞将变得有点奇怪，因为我们将讨论将一个函数传递给另一个函数。这听起来有点奇怪吗？我觉得确实是。\n\
  \n## 将函数传递给函数\n\n既然你已经知道可以向函数传递一个对象，并且知道函数也是一个对象，你将能够理解 JavaScript 以及计算机科学领域中最令人困惑的事情之一：将函数传递给函数。\n\
  \n### 函数是引用类型\n\n首先，从根本上说所有的函数都是对象。这意味着它们是引用类型。这意味着当你传递函数时，你传递的是它在内存中基地址的地址：就像对象一样。\n\
  \n我重复这一点，是因为这与我们对作用域的理解密切相关。函数为它所封装的所有变量创建一个作用域，就像对象一样。然而，当你将函数传递给另一个函数时，你将获得函数的基地址，并能够操作位于这些地址上的值，这意味着你修改了传入函数的对象（函数）。这一切意味着你需要小心，并准确地知道你正在尝试做什么。\n\
  \n然而，此时你可能会在想，“我为什么要将一个函数传递给另一个函数呢？”这看起来确实像是一件奇怪的事，但它是许多 JavaScript 内置函数的工作方式，例如\
  \ `setTimeout()` 函数。\n\n## setTimeout – 传递函数\n\nJavaScript 中的全局 `window` 对象有一个 `setTimeout()`\
  \ 函数，你可以调用它在稍后的时间执行函数。\n\n`setTimeout` 接受两个参数。第一个是函数，第二个是在调用函数之前等待的毫秒数。你传递给 `setTimeout`\
  \ 的函数代表了在 N 毫秒后计时器触发时想要运行的命令。\n\n```\nsetTimeout(functionName, millis);\n```\n\n\
  这是一个你可以尝试或观看的快速示例。\n\n```javascript\nvar el = document.getElementById(\"first\"\
  );\nel.innerHTML = \"3 秒后 (3000ms) 你将看到另一条消息。\";\n\nvar el2 = document.getElementById(\"\
  second\");\nsetTimeout(showAnswer, 3000);\n\nfunction showAnswer() {\n    el2.innerHTML\
  \ = \"从我被要求运行以来已经过了大约 3 秒。\";\n    setTimeout(hideAnswer, 3000);\n}\n\nfunction\
  \ hideAnswer() {\n    el2.innerHTML = \"\";\n    setTimeout(showAnswer, 3000);\n\
  }\n```\n\n你可以在我的 plnkr.co 上查看类似的示例：http://plnkr.co/edit/BJn9UZiYpSWu34ydRCR7?p=preview\n\
  \n我让这个脚本在两个不同的地方调用了 `setTimeout()` 方法，以便文本出现后它会消失，当它消失后，它会再次出现。这样你就能确保看到整个过程。\n\n\
  现在你至少可以看到一个原因（还有很多其他原因）将一个函数传递给另一个函数，让我们来看看如何创建一个接受函数作为参数并使用它的函数。\n\n## 在传递函数中揭示的架构原理\n\
  \n在我们查看将函数传递给另一个函数时，接下来的示例将微妙地向你揭示一个架构原理。这是初始代码：\n\n```javascript\nfunction displayData(item)\
  \ {\n    alert(item);\n}\n\nfunction mainWork(targetFunc) {\n    var allThings =\
  \ [];\n    allThings.push(\"thing1\"); allThings.push(\"thing2\"); allThings.push(\"\
  thing3\"); allThings.push(\"thing4\");\n    for (x in allThings) {\n        targetFunc(allThings[x]);\n\
  \    }\n}\n\nmainWork(displayData);\n```\n\n如果你去该代码的 Plunker 或使用 RunAnyJS 运行它，你会立即发现这相当烦人，因为它使用\
  \ `alert()` 模态对话框向用户提供信息。\n\nhttp://plnkr.co/edit/cVmbtIeYVqDXUEuIdLvr?p=preview\n\
  \n## 回调函数\n\n注意 `mainWork` 方法接收一个函数，稍后将使用该函数向用户显示数据。这就是计算机科学中的概念——尽管这是一个非常简单的示例——**回调函数**。这意味着，被另一个函数调用或使用的功能被分离出来，以便方便地替换。\n\
  \n### 分离功能以备后替换\n\n由于我们传递的是函数，我们可以将 `displayData` 替换为任何兼容的函数。\n\n### 无需测试替换功能\n\n\
  现在，我们不需要因为修改了 `mainWork` 中的某些内容而对其进行重新测试，只需要替换 `displayData`。这是一种巨大的架构原理，让你更接近设计解决方案而不是堆砌脚本。\n\
  \n让我给你展示它在以下示例中是如何工作的。基本上我们添加了一个名为 `displayDataDiv` 的新函数。该函数非常简单，并将 `item` 的值添加到\
  \ DIV 中。\n\n```javascript\nfunction displayDataDiv(item) {\n    el.innerHTML +=\
  \ \" \" + item;\n}\n```\n\n最后，我们只需将原始的 `mainWork(displayData)` 调用更改为新的 `displayDataDiv`。现在它将在\
  \ DIV 中显示数据，而不是那些烦人的弹窗。完整的代码列表如下，你可以尝试一下。或者运行这个 Plunker：http://plnkr.co/edit/BKK6RhEmFnyIL8f8Y?p=preview\n\
  \n```javascript\nfunction displayData(item) {\n    alert(item);\n}\n\n// 初始化输出的\
  \ div\nvar el = document.getElementById(\"first\");\nel.innerHTML = \"\";\n\nfunction\
  \ displayDataDiv(item) {\n    el.innerHTML += \" \" + item;\n}\n\nfunction mainWork(targetFunc)\
  \ {\n    var allThings = [];\n    allThings.push(\"thing1\"); allThings.push(\"\
  thing2\"); allThings.push(\"thing3\"); allThings.push(\"thing4\");\n    for (x in\
  \ allThings) {\n        targetFunc(allThings[x]);\n    }\n}\n\nmainWork(displayDataDiv);\n\
  ```\n\n关于这个新脚本有几点需要注意：\n\n1. 旧的 `displayData` 函数不需要删除或修改。这意味着旧的功能可以像以前一样运行。现在，我们只需实现新功能即可。这对于持续开发非常好，因为我们不会破坏旧代码。\n\
  2. 我们仍然需要保持函数的公共接口不变。这意味着该函数仍然接收一个 item，在这种情况下该 item 是一个字符串。如果我们真的想将其分离出来，那么该类型可以是基类型（继承链的顶端），并且该类型实现一个特定的、始终不变的接口。我们将在查看依赖注入时学习更多更多内容，但我想在这里简单提一下。\n\
  \n现在，在结束本章之前，我想回到那个老短语，*函数是一类等公民类型*。\n\n\n\n\n在其他语言中，函数既不是对象，也没有真正的独立类型。因此，在这些语言中，函数不被视为一等类型。它们是未被正式承认的“二等公民”。\n\
  \n事实上，在 C++、Java 和 C# 中，它们并不是类型，因此将函数作为参数传递给另一个函数是困难甚至是不可能的。\n\nC++（同 C 语言）实现了指针，使得你可以将函数传递给函数。C++\
  \ 中的指针简单来说就是一个你可以传递的地址。该地址可以`point to`任何类型（整数、字符串或函数）。然而，这种语法非常丑陋。例如，如果你有一个名为 `getDouble`\
  \ 的函数，它不返回内容（`void`）并接受一个整数，那么你的函数指针看起来像如下：\n\n```cpp\nvoid(*ptrName)(int*); //\
  \ 这创建了 ptrName 变量\n\n// 要设置指针指向该函数，你需要这样做\n\nptrName = &getDouble;\n```\n\n最后这一行带有\
  \ `&`（取地址符）符号的意思是：获取内存中名为 `getDouble` 的函数所在的地址，并将其保存到 `ptrName` 变量中。\n\n关于这种丑陋性的介绍到此为止了。\n\
  \n## JavaScript 让这一切变得简单\n\n我只是想提到，JavaScript 让这一切变得容易得多，因为你可以将函数名作为函数参数传递。\n\n\
  既然你已经理解了关于内存中对象的这些非常重要但很少被解释的细节，现在你将更容易理解我们如何使用 JavaScript 函数来创建模板（类似于 Java、C++\
  \ 和 C# 中的类），用于我们想要在应用程序中重用的常用自定义类型（UDT）。\n\n## 创建模板对象进行实例化\n\n首先，我将向你展示编写创建简单模板对象的\
  \ JavaScript 代码，然后我将展示你如何实例化它。\n\n```javascript\nfunction Person(firstName, lastName,\
  \ startDate, workTitle) {\n    this.firstName = firstName; \n    this.lastName =\
  \ lastName; \n    this.startDate = startDate; \n    this.workTitle = workTitle;\
  \ \n    this.empId = getEmployeeId(); \n    function getEmployeeId() {\n       \
  \ return Math.ceil(Math.random() * 5000000); \n    }\n}\n```\n\n要使用我们刚刚创建的模板，我们使用\
  \ JavaScript 的 `new` 运算符。代码如下：\n\n```javascript\nvar employee = new Person(\"elmer\"\
  , \"fudd\",\"2012-03-14\",\"manager\");\n```\n\n你可以在此处看到一个使用了该模板对象的简单脚本：http://plnkr.co/edit/GWAq6VGkOyUOulVT8uys?p=preview\n\
  \n由于你理解了函数（以及对象）是如何存储在内存中的，你将更容易理解这里发生了什么。你只需要知道以下几点：\n\n1. `this` 关键字\n2. `new`\
  \ 关键字\n\n当你还没有见过内存中的对象时，这些是令人困惑的概念，但再次强调，既然你现在拥有了它，一切都会迎刃合。\n\n好了，让我们来看看内存中的模板对象。它看起来就像图\
  \ 28 所示：函数作为对象的模板。\n\n![](img/00028.gif) *图 28: 函数作为对象的模板*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure28.png\n\
  \n图 28 中有很多许多需要仔细检查的地方。1. `Person` 包含五个属性和 1 个函数（用橙色显示）。\n\n2. 我将字符串类型显示为引用，因为它们很可能是以这种方式实现的，因为它们在内存中的大小是波动的。（你将在下一张图中看到这些从空值变为地址。）\n\
  3. 我将 `empId` 初始化为 0，并将每个引用初始化为 `null`，尽管我不确定网络浏览器/JavaScript 究竟将它们初始化为什么值。请记住，这是一个为了增加我们理解而设计的简化模型，而不是为了让我们变成计算机科学家。\n\
  \n4. 这是在我们根据此模板 `new` 出另一个对象之前 `Person` 函数的视图。\n\n现在，让我们看看在使用 `new` 运算符实例化 `employeeobject`\
  \ 后，内存中发生了什么。\n\n## JavaScript new 运算符\n\n`new` 运算符告诉 JavaScript 我们想要一个未被任何对象使用的新内存块。\n\
  \n### 在新内存地址创建 Person 对象\n\n当 JavaScript 解释器遇到以下代码行时，它知道不是将 `Person` 对象复制到新变量中，而是在新的内存地址处创建一个全新的\
  \ `Person Object`。\n\n```javascript\nvar employee = new Person(\"elmer\", \"fudd\"\
  ,\"2012-03-14\",\"manager\");\n```\n\n解释器现在不会将 `Person` 函数的地址复制到我们的 `employee` 变量中，而是获取\
  \ `Person` 对象并在另一个内存位置创建一个新对象，并返回该地址。这意味着，内存现在看起来就像你在图 29 中所示：新对象意味着新内存。\n\n![](img/00029.gif)\
  \ *图 29: 新对象意味着新内存*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure29.png\n\
  \n图 29 右侧的蓝色区域代表对象在实例化瞬间以及初始化（通过参数中发送的值）之前的状态。你可以看到为这个新对象预留了一块新内存。当然，根据我们之前的调查，你现在理解这意味着在内存中有一个新的实体。\n\
  \n### 在对象内部引用\n\n你需要 `this` 运算符，因为没有其他方法可以引用你当前所在的内部的对象。在对象外部我们将其称为 `employee` 对象，但在对象内部我们将其称为\
  \ `this`。\n\n## 关于 this 如何？\n\n`this` 运算符在初始化阶段起作用。现在内存已经为该对象预留，它可以表示一个真实世界中的事物，例如带有\
  \ `empId` 的员工。\n\n## 构造：自动执行代码\n\n当创建新对象时，会发生一次构造过程，代码封装在另一个函数中。\n\n在我们情况下，自动执行的代码如下：\n\
  \n```javascript\nthis.firstName = firstName; \nthis.lastName = lastName; \nthis.startDate\
  \ = startDate; \nthis.workTitle = workTitle; \nthis.empId = getEmployeeId();\n```\n\
  \n就像普通函数中一样，代码从上到下执行，除非在我们的 `getEmployeeId()` 函数中。\n\n此外，考虑另一点：在对象实例化后，没有办法再次运行上述代码。\n\
  \n### 构造函数每个应用程序运行一次\n\n你明白为什么了吗？答案是因为没有办法再次访问这些行。你无法在程序的任何地方特指这些行。这构成了我们基于模板对象构建的新对象的构造代码。\n\
  \n相比之下，注意你可以通过编写编写 JavaScript 代码随时运行 `getEmployeeId()` 函数：\n\n```javascript\nemployee.getEmployeeId();\
  \ // 返回随机数\n```\n\n查看图 30：使用 this 运算符初始化新对象，你会看到内存中初始化的员工对象，而原始模板对象没有被修改。\n\n![](img/00030.gif)\
  \ *图 30: 使用 this 运算符初始化新对象*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure30.png\n\
  \n我将 `empId` 的设置为 7 仅作为我们的示例。设置该值的函数简单地生成 1 到 5,000,000 之间的随机值。\n\n\n\n\n这意味着你对该对象所做的任何操作，都是在对对象本身进行操作。\n\
  \n### 关于 getEmployeeId 函数的地址如何？\n\n你可能已经注意到，在模板对象（`Person`）和新对象（`employee`）中，我将指向\
  \ `getEmployeeId` 函数的地址都设置为同一个值（`0x2CFC01`）。我这样做是因为我认为解释器应该足够聪明，能够看出这些是相同的函数（因为它们执行的工作相同），并且解释器会进行这种优化以节省内存。否则，同一个函数将以不同的地址被加载到内存中，然后由每个对象（`Person`\
  \ 和 `employee`）分别引用。在我看来这似乎是浪费内存。\n\n### 总结\n\n现在你已经理解了对象在内存中是如何创建的、如何创建模板以及以及使用\
  \ `new` 和 `this` 操作符，你已经准备好学习更高级的内容了。我相信你发现自己对 JavaScript 的理解已经在脑海中呈指数级增长。\n"
