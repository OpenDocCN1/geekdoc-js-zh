    is defined within the function they are two different variables stored at two
    seperate memory locations.


    ## **Functions Are Reference Types: Objects**


    A function is a Reference type and is stored in memory the same way objects are
    – they are objects -- so memory will look very similar to what we saw earlier.
    Take a look at the view of memory for this last program shown in Figure 24: function
    object in memory.


    ![](images/00024.gif)*Figure 24: function object in memory*


    http://NewtonSaber.com/OOJavaScript/Images/Figure24.png


    While you are examining Figure 24 there are a number of things to examine closely.


    1\. The randomVal on the left (orange color) is the application-wide variable
    not the same one as the randomVal on the right (green color) which is the one
    which is scoped to the getRandomInteger function. As you can see, they have different
    base memory addresses and setting one will have no affect on the other.


    2\. The function in memory (green color on the right) looks just like our previous
    examples of other Reference types. That is because it is a Reference type and
    inherits from the JavaScript base Object type.


    3\. The application scope contains two Reference types to HtmlDivElements (el1
    and el3). The function scope contains one reference to an HtmlDivElement. Those
    are used simply to output the strings so you can see them so I have not shown
    the extra memory for those. Just be aware that those three items become References
    also, since they are references to HTML elements.


    4\. One more thing to notice here is that in our sample the randomVal inside the
    function got the value of 897 which will not fit into 8 bits (one byte) so you''ll
    see that to set the binary value it leaks over into the second byte (address 0x00AA03)
    since we need more bits to store that large of a value. The entire value would
    look like the following: 00000011 10000001 The Just wanted to point this out since
    it is different than our previous samples.


    ## **Passing Objects and Primitives to Functions**


    Now, that you''ve seen that functions are objects it will be a bit more obvious
    that we can pass a function as a parameter on a function, just as we can pass
    an object to another function.


    Since, we haven''t examined it closely, let''s take a look at how that passing
    a Primitive type is different than passing a primitive type like a Number, Boolean,
    etc.


    Again, you will see that this will be much more clear to you, because you understand
    the memory model – the way JavaScript (and subsystems) allocate memory for each
    of these types.


    function double(inNumber)


    {


    inNumber = inNumber * 2;


    }


    View this sample at plnkr.co:


    http://plnkr.co/edit/lD3b4BbmLgXzjnqTdujI?p=preview


    Below is the code for this example, which you can run at:


