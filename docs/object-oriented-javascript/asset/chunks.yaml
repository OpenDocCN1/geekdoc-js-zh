    ![](images/00028.gif)*Figure 28: Function As An Object Template*


    http://NewtonSaber.com/OOJavaScript/Images/Figure28.png


    There are a number of things to examine closely in Figure 28\. 1\. The Person
    contains five properties and 1 function (shown in orange).


    2\. I''m showing the string types as references, as they most likely are implemented
    that way since their sizes in memory fluctuate. (You''ll see these go from null
    values to addresses in the next image.)


    3\. I''ve initialized empId to 0 and each of the references to null although I
    am not sure exactly what values web browsers / JavaScript initialize these to.
    Keep in mind this is a simplified model to increase our understanding, not turn
    us into Computer Scientists.


    4\. This is a view of the Person function before wenewup another object based
    upon this template.


    Now, let''s take a look at what happens in memory after the employeeobject is
    instantiated with thenewoperator.


    ## **JavaScript new Operator**


    The new operator tells JavaScript that we want a new slice of memory that is not
    used by any other object.


    ***Create Person Object At New Memory Address***


    When the JavaScript Interpreter comes across the following line of code it knows
    that it is not copying the Person object into a new variable, but it will create
    an entirely new Person Object at a new memory address.


    var employee = new Person("elmer", "fudd","2012-03-14","manager");


    Instead of copying the address of the Person function into our employee variable,
    the Interpreter will now take the Person object and create a new on at another
    memory location and return that address. That means, the memory will now look
    something like what you see in Figure 29: New Object Means New Memory.


    ![](images/00029.gif)*Figure 29: New Object Means New Memory*


    http://NewtonSaber.com/OOJavaScript/Images/Figure29.png


    The blue area on the right in Figure 29 represents the object at the moment it
    is instantiated and before it is initialized (by the values sent in the parameters).
    You can see that there is a new chunk of memory set aside for this new object.
    Of course, from our previous investigation you now understand that means you have
    a new entity in memory instead of just a another reference to the same memory
    the Person template points to. This is a significant difference in your JavaScript
    programs, since you will not be overwriting memory that is used by another object.


    ## **What About this?**


    The initialization is where thethisoperator comes in to play.


    Now that new memory has been set aside for this object and the object has been
    instantiated in memory it is a common thing to want to initialize values in the
    new object so that it is ready to represent a real-world thing, such as an employee
    with a name and employeeId.


    ## **Construction: Automatically Running Code**


    When the new object is created in memory a one-time construction process occurs
    as the code which is not wrapped in another function automatically runs.


    In our case the code that automatically runs is the following:


    this.firstName = firstName; this.lastName = lastName; this.startDate = startDate;
    this.workTitle = workTitle; this.empId = getEmployeeId();


    Just as it does in a normal function, the code runs from the top down, unless
    it is wrapped in another function – as in the case with ourgetEmployeeId()function.


    Also, consider another point: there is no way to run the lines above again, after
    the object is instantiated.


    ***Constructor Runs Only Once Per Application***


    Do you see why? The answer is because there is no way to access those lines again.
    You cannot refer specifically to those lines from anywhere else in the program.
    This becomes the constructor code for our new object which is built off of the
    template object.


    In contrast, notice that you can run the getEmployeeId() function any time simply
    by writing the following JavaScript code:


    employee.getEmployeeId(); // returns random number


    Take a look at Figure 30: New Object Initialized Using this Operator and you''ll
    see the initialized employee object in memory, while the original template object
    has not been altered. You can see the changed values in the boxed area of the
    blue object.


    ![](images/00030.gif)*Figure 30: New Object Initialized Using this Operator*


    http://NewtonSaber.com/OOJavaScript/Images/Figure30.png


    I set the value of the empId to 7 just for our example. The function that sets
    that value simply generates a random value between 1 and 5,000,000.


    ***More About this***


    The this operator is really a short-hand way that JavaScript allows you to use
    to refer to the base memory address. When you call this inside the object, you
    are saying, go ahead and look at this object and add a property named firstName
    and set it to the value that came in (named firstName).


    ***Reference From Inside An Object***


    You need the this operator, because there would be no other way to refer to the
    object that you are currently inside of. Outside the object we refer to it as
    the employee object, but within the object itself we refer to it as the this.'
