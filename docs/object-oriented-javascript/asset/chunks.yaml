  trans: "\n在其他语言中，函数既不是对象，也没有真正的独立类型。因此，在这些语言中，函数不被视为一等类型。它们是未被正式承认的“二等公民”。\n\n事实上，在\
    \ C++、Java 和 C# 中，它们并不是类型，因此将函数作为参数传递给另一个函数是困难甚至是不可能的。\n\nC++（同 C 语言）实现了指针，使得你可以将函数传递给函数。C++\
    \ 中的指针简单来说就是一个你可以传递的地址。该地址可以`point to`任何类型（整数、字符串或函数）。然而，这种语法非常丑陋。例如，如果你有一个名为\
    \ `getDouble` 的函数，它不返回内容（`void`）并接受一个整数，那么你的函数指针看起来像如下：\n\n```cpp\nvoid(*ptrName)(int*);\
    \ // 这创建了 ptrName 变量\n\n// 要设置指针指向该函数，你需要这样做\n\nptrName = &getDouble;\n```\n\n\
    最后这一行带有 `&`（取地址符）符号的意思是：获取内存中名为 `getDouble` 的函数所在的地址，并将其保存到 `ptrName` 变量中。\n\n\
    关于这种丑陋性的介绍到此为止了。\n\n## JavaScript 让这一切变得简单\n\n我只是想提到，JavaScript 让这一切变得容易得多，因为你可以将函数名作为函数参数传递。\n\
    \n既然你已经理解了关于内存中对象的这些非常重要但很少被解释的细节，现在你将更容易理解我们如何使用 JavaScript 函数来创建模板（类似于 Java、C++\
    \ 和 C# 中的类），用于我们想要在应用程序中重用的常用自定义类型（UDT）。\n\n## 创建模板对象进行实例化\n\n首先，我将向你展示编写创建简单模板对象的\
    \ JavaScript 代码，然后我将展示你如何实例化它。\n\n```javascript\nfunction Person(firstName, lastName,\
    \ startDate, workTitle) {\n    this.firstName = firstName; \n    this.lastName\
    \ = lastName; \n    this.startDate = startDate; \n    this.workTitle = workTitle;\
    \ \n    this.empId = getEmployeeId(); \n    function getEmployeeId() {\n     \
    \   return Math.ceil(Math.random() * 5000000); \n    }\n}\n```\n\n要使用我们刚刚创建的模板，我们使用\
    \ JavaScript 的 `new` 运算符。代码如下：\n\n```javascript\nvar employee = new Person(\"\
    elmer\", \"fudd\",\"2012-03-14\",\"manager\");\n```\n\n你可以在此处看到一个使用了该模板对象的简单脚本：http://plnkr.co/edit/GWAq6VGkOyUOulVT8uys?p=preview\n\
    \n由于你理解了函数（以及对象）是如何存储在内存中的，你将更容易理解这里发生了什么。你只需要知道以下几点：\n\n1. `this` 关键字\n2. `new`\
    \ 关键字\n\n当你还没有见过内存中的对象时，这些是令人困惑的概念，但再次强调，既然你现在拥有了它，一切都会迎刃合。\n\n好了，让我们来看看内存中的模板对象。它看起来就像图\
    \ 28 所示：函数作为对象的模板。\n\n![](img/00028.gif) *图 28: 函数作为对象的模板*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure28.png\n\
    \n图 28 中有很多许多需要仔细检查的地方。1. `Person` 包含五个属性和 1 个函数（用橙色显示）。\n\n2. 我将字符串类型显示为引用，因为它们很可能是以这种方式实现的，因为它们在内存中的大小是波动的。（你将在下一张图中看到这些从空值变为地址。）\n\
    3. 我将 `empId` 初始化为 0，并将每个引用初始化为 `null`，尽管我不确定网络浏览器/JavaScript 究竟将它们初始化为什么值。请记住，这是一个为了增加我们理解而设计的简化模型，而不是为了让我们变成计算机科学家。\n\
    \n4. 这是在我们根据此模板 `new` 出另一个对象之前 `Person` 函数的视图。\n\n现在，让我们看看在使用 `new` 运算符实例化 `employeeobject`\
    \ 后，内存中发生了什么。\n\n## JavaScript new 运算符\n\n`new` 运算符告诉 JavaScript 我们想要一个未被任何对象使用的新内存块。\n\
    \n### 在新内存地址创建 Person 对象\n\n当 JavaScript 解释器遇到以下代码行时，它知道不是将 `Person` 对象复制到新变量中，而是在新的内存地址处创建一个全新的\
    \ `Person Object`。\n\n```javascript\nvar employee = new Person(\"elmer\", \"fudd\"\
    ,\"2012-03-14\",\"manager\");\n```\n\n解释器现在不会将 `Person` 函数的地址复制到我们的 `employee`\
    \ 变量中，而是获取 `Person` 对象并在另一个内存位置创建一个新对象，并返回该地址。这意味着，内存现在看起来就像你在图 29 中所示：新对象意味着新内存。\n\
    \n![](img/00029.gif) *图 29: 新对象意味着新内存*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure29.png\n\
    \n图 29 右侧的蓝色区域代表对象在实例化瞬间以及初始化（通过参数中发送的值）之前的状态。你可以看到为这个新对象预留了一块新内存。当然，根据我们之前的调查，你现在理解这意味着在内存中有一个新的实体。\n\
    \n### 在对象内部引用\n\n你需要 `this` 运算符，因为没有其他方法可以引用你当前所在的内部的对象。在对象外部我们将其称为 `employee`\
    \ 对象，但在对象内部我们将其称为 `this`。\n\n## 关于 this 如何？\n\n`this` 运算符在初始化阶段起作用。现在内存已经为该对象预留，它可以表示一个真实世界中的事物，例如带有\
    \ `empId` 的员工。\n\n## 构造：自动执行代码\n\n当创建新对象时，会发生一次构造过程，代码封装在另一个函数中。\n\n在我们情况下，自动执行的代码如下：\n\
    \n```javascript\nthis.firstName = firstName; \nthis.lastName = lastName; \nthis.startDate\
    \ = startDate; \nthis.workTitle = workTitle; \nthis.empId = getEmployeeId();\n\
    ```\n\n就像普通函数中一样，代码从上到下执行，除非在我们的 `getEmployeeId()` 函数中。\n\n此外，考虑另一点：在对象实例化后，没有办法再次运行上述代码。\n\
    \n### 构造函数每个应用程序运行一次\n\n你明白为什么了吗？答案是因为没有办法再次访问这些行。你无法在程序的任何地方特指这些行。这构成了我们基于模板对象构建的新对象的构造代码。\n\
    \n相比之下，注意你可以通过编写编写 JavaScript 代码随时运行 `getEmployeeId()` 函数：\n\n```javascript\n\
    employee.getEmployeeId(); // 返回随机数\n```\n\n查看图 30：使用 this 运算符初始化新对象，你会看到内存中初始化的员工对象，而原始模板对象没有被修改。\n\
    \n![](img/00030.gif) *图 30: 使用 this 运算符初始化新对象*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure30.png\n\
    \n我将 `empId` 的设置为 7 仅作为我们的示例。设置该值的函数简单地生成 1 到 5,000,000 之间的随机值。\n"
- fmt: '

    That means that anything you do to the this object you are doing to the object
    itself.


    ### What About getEmployeeId Function Address?


    You may have noticed that in the template object (`Person`) and the new object
    (`employee`) I decided to set both of the addresses which point to the `getEmployeeId`
    function to the same value (`0x2CFC01`). I did that because it makes sense to
    me that the Interpreter would be smart enough to see that those are the same functions
    since they are going to do the same work and that the Interpreter would do this
    optimization to save memory. Otherwise, it would have the same function loaded
    into memory at different addresses that each object (`Person` and `employee`)
    would then refer to. That seems like a waste of memory to me.


    ### Summary


    Now that you understand how objects are created in memory, how to create template
    objects and how to use the `new` and `this` operators, you are ready for even
    more and I''m sure you''re finding that your understanding of JavaScript has expanded
    exponentially in your mind.

    '
