- fmt: "\nKeep in mind that the primitive named `children` is now owned by the `Reference`\
    \ type (`infoOrig`) so it manages the memory of that particular item. That also\
    \ means that the reference item takes up the entire memory space of the new primitive\
    \ plus any memory that the reference object itself takes up – such as the memory\
    \ at address `0x00AA01`.\n\n## Reference Types: Expandable In Memory\n\nThis is\
    \ one of the primary reasons an `Object` is a `Reference` type: because it's size\
    \ in memory cannot be predetermined since it is a `User Defined Type` (UDT). In\
    \ this case our UDT is only made up of a `Number`, but in other cases the object\
    \ may contain any number of primitives and/or other reference types.\n\n### Step\
    \ 7\n\nStep 7 is similar to what we did in Step 2 when we worked with the first\
    \ primitive type (`numberOfChildren`). In Step 7 we are simply changing the value\
    \ of `children` to 4. The only difference is that this primitive is owned by the\
    \ reference type (`infoOrig`). However, you see effectively no difference at this\
    \ point.\n\nMemory will now look like what you see in Figure 19: Alter value of\
    \ primitive type owned by reference type – now the value of `children` is 4 (binary\
    \ 00000100).\n\n![](images/00019.gif)*Figure 19: Alter value of primitive type\
    \ owned by reference type* http://NewtonSaber.com/OOJavaScript/Images/Figure19.png\n\
    \n## Create Copy of Reference Type\n\nNow we set up for the extremely interesting\
    \ change which should amaze you and will definitely open your mind to understanding\
    \ programming from a new angle.\n\n### Step 8\n\nUnderstanding this one concept\
    \ will make you a better programmer in all languages, because you will understand\
    \ what is really happening when you write code.\n\nTo create a copy simply means\
    \ to create a new variable name and assign that variable name the previously created\
    \ value. We did it with the primitive and now we'll do the same thing with this\
    \ one line of code:\n\n```\nvar infoCopy = infoOrig;\n```\n\nHowever, that one\
    \ line of code is vastly different, because we are attempting to create a new\
    \ `Reference Type` which has the same value of the previously created `Reference\
    \ type`.\n\nWhat you have to remember though, is that the value stored for a reference\
    \ type is an address (memory location which points to the place in memory where\
    \ the object exists).\n\n### Ran Out of Memory (Spaces) In My Example\n\nI seem\
    \ to have ran out of memory (spaces) in my example figures so I will take the\
    \ value at `0x00CCEE` (assuming that those values were emptied out and not used).\
    \ I'm doing this simply for the print space.\n\nWhen the JavaScript `Interpreter`\
    \ sees the line of code it does the following:\n\n1. creates a new `Reference\
    \ object` (`infoCopy`) in its internal table.\n2. Saves the address of `infoOrig`\
    \ (`0x00AA01`) at the address where it refers to `infoCopy` (`0x00AA01`)\n\nIt\
    \ all looks like what you see in Figure 20: `infoCopy` Reference Type Created.\
    \ Notice that now, you have two variables which point to the same place in memory.\
    \ Both of these variables *refer* to the same object in memory – the one at address\
    \ `0x00AA01`.\n\n![](images/00020.gif)*Figure 20: infoCopy Reference Type Created*\
    \ http://NewtonSaber.com/OOJavaScript/Images/Figure20.png\n\n### Step 9: Both\
    \ of Your References Point To The Same Thing\n\nThis is the reason that now when\
    \ you alter the value of `infoCopy` with the JavaScript `infoCopy.children = 7`\
    \ you are also altering the value of `infoOrig.children`.\n\nWhen the `Interpreter`\
    \ runs that line of code, it looks up the base address for `infoCopy` and gets\
    \ (`0x00AA01`). It then finds the property named `children` inside that object\
    \ and sets it to the value 7.\n\nWhen that happens, your other variable (`infoOrig`)\
    \ is still referencing the same memory so you have altered that value also.\n\n\
    Now memory looks like what you see in Figure 21: `infoCopy` and `infoOrig` Both\
    \ Point to Same Address.\n\n![](images/00021.gif)*Figure 21: infoCopy and infoOrig\
    \ Both Point to Same Address* http://NewtonSaber.com/OOJavaScript/Images/Figure21.png\n\
    \nDo you see how fast it is to create a copy – also known as a new reference --\
    \ of an object now?\n\nEverything else you learn about JavaScript objects is based\
    \ upon this and that is why it is so important to know what is actually going\
    \ on behind the scenes.\n\nWe will look further into the implications of `Reference\
    \ types` as we go through the book, but now that you know that you will be able\
    \ to understand that rest of the book even more. I'll leave you in this chapter\
    \ with the sidebar on `Assembly Language` and we'll meet again in the next chapter\
    \ to talk about JavaScript `Functions` (they're reference types too).\n\n## Sidebar\
    \ - Assembly Language? I Thought This Was JavaScript\n\nIn the past programmers\
    \ didn't have all the nice GUI (graphical user interfaces) we have now and they\
    \ had to know how to talk directly to the `CPU` (main processor) of the computer\
    \ and tell it to store their data at a specific memory location (address).\n\n\
    They used `Assembly language` or even before that they used `Machine language`\
    \ – which spoke the exact cryptic language that the processor spoke.\n\nAt times,\
    \ their code – in `Machine Language` – literally looked like a list of zeros and\
    \ ones:\n\n```\n11100101011100000100101010001101001\n```\n\nThat would tell the\
    \ `CPU` to store the value 15 at memory address `0x00CCEE`.\n\n### Mistake Prone\n\
    \nLots of mistakes were made as computer scientists' eyes crossed as they tried\
    \ to determine if it was three ones and a zero.\n\n### 3rd Generation Language\n\
    \nYou are now using `3GL` (`Generation Language`) or a high-level language, because\
    \ you don't have to speak directly to the processor.\n\n### JavaScript Interpreter\
    \ Works For You\n\nThe something that does that work in our case is the JavaScript\
    \ `Interpreter` and the `Interpreter` runs inside the web browser. The `Interpreter`\
    \ determines how to translate the JavaScript commands you type into commands the\
    \ computer can understand and carry out.That means that us developers can now\
    \ write code that is much easier to learn (JavaScript). Instead of having to understand\
    \ processor `Op Codes` (operation codes) and memory addresses, all you have to\
    \ do to store a value at a memory location is type the following valid JavaScript\n\
    \n```\nvar x = 15;\n```\n\n# Chapter 2\n\n### Functions: They're Objects Too\n\
    \nWe learned a lot about what happens behind the scenes in the last chapter and\
    \ this chapter will continue on the same way. Last time we learned that we could\
    \ create an object in the following way:\n\n```\nvar person = {};\nperson.firstName\
    \ = \"frank\";\nperson.lastName = \"smith\";\n```\n\nBut, now suppose you want\
    \ to create another person. You want to do so, because you don't want to have\
    \ to type all the code to add the properties (lastName and firstName). You might\
    \ think, \"okay, I'll do the following:\"\n\n```\nvar person2 = person;\n```\n\
    \nHowever, as we learned in the last chapter, that doesn't create a new object.\
    \ Instead it just makes a new reference to the same object using a new variable\
    \ name. That doesn't help us if we want person2 to have a different firstName\
    \ and lastName i.e. new memory addresses where we can store new values.\n\nIn\
    \ other languages, like C++, Java, or C#, we would create a `class` template which\
    \ we could then instantiate into an object. It would look something like the following:\n\
    \n```csharp\n// C# code comparison\nclass person\n{\n    // this is constructor,\
    \ which is automatically called\n    // when the new object is instantiated\n\
    \    public person(firstName, lastName);\n    public string lastName;\n    public\
    \ string firstName;\n}\n```\n\nThen whenever we wanted to use this object we would\
    \ just do the following:\n\n```csharp\n// ### C# CODE ########\nperson ted = new\
    \ person();\nted.firstName = \"ted\";\nted.lastName = \"jones\";\n```\n"
  raw: 'Keep in mind that the primitive named childrenis now owned by the Reference
    type (infoOrig) so it manages the memory of that particular item. That also means
    that the reference item takes up the entire memory space of the new primitive
    plus any memory that the reference object itself takes up – such as the memory
    at address0x00AA01.


    ***Reference Types : Expandable In Memory***


    This is one of the primary reasons an Object is a Reference type: because it''s
    size in memory cannot be predetermined since it is a User Defined Type (UDT).
    In this case our UDT is only made up of a Number, but in other cases the object
    may contain any number of primitives and/or other reference types.


    ***Step 7***


    Step 7 is similar to what we did in Step 2 when we worked with the first primitive
    type (numberOfChildren). In Step 7 we are simply changing the value ofchildrento
    4\. The only difference is that this primitive is owned by the reference type
    (infoOrig). However, you see effectively no difference at this point.


    Memory will now look like what you see in Figure 19: Alter value of primitive
    type owned by reference type – now the value ofchildrenis 4 (binary 00000100).


    ![](images/00019.gif)*Figure 19: Alter value of primitive type owned by reference
    type* http://NewtonSaber.com/OOJavaScript/Images/Figure19.png


    ## **Create Copy of Reference Type**


    Now we set up for the extremely interesting change which should amaze you and
    will definitely open your mind to understanding programming from a new angle.


    ***Step 8***


    Understanding this one concept will make you a better programmer in all languages,
    because you will understand what is really happening when you write code.


    To create a copy simply means to create a new variable name and assign that variable
    name the previously created value. We did it with the primitive and now we''ll
    do the same thing with this one line of code:


    var infoCopy = infoOrig;


    However, that one line of code is vastly different, because we are attempting
    to create a new Reference Type which has the same value of the previously created
    Reference type.


    What you have to remember though, is that the value stored for a reference type
    is an address (memory location which points to the place in memory where the object
    exists).


    ***Ran Out of Memory (Spaces) In My Example***


    I seem to have ran out of memory (spaces) in my example figures so I will take
    the value at 0x00CCEE (assuming that those values were emptied out and not used).
    I''m doing this simply for the print space.


    When the JavaScript Interpreter sees the line of code it does the following:


    1\. creates a new Reference object (infoCopy) in its internal table.


    2\. Saves the address of infoOrig (0x00AA01) at the address where it refers to
    infoCopy (0x00AA01)


    It all looks like what you see in Figure 20: infoCopy Reference Type Created.
    Notice that now, you have two variables which point to the same place in memory.
    Both of these variables ***refer*** to the same object in memory – the one at
    address 0x00AA01.


    ![](images/00020.gif)*Figure 20: infoCopy Reference Type Created*


    http://NewtonSaber.com/OOJavaScript/Images/Figure20.png


    ***Step 9


    Both of Your References Point To The Same Thing***


    This is the reason that now when you alter the value of infoCopy with the JavaScriptinfoCopy.children
    = 7 you are also altering the value of infoOrig.children.


    When the Interpreter runs that line of code, it looks up the base address for
    infoCopy and gets (0x00AA01). It then finds the property named children inside
    that object and sets it to the value 7.


    When that happens, your other variable (infoOrig) is still referencing the same
    memory so you have altered that value also.


    Now memory looks like what you see in Figure 21: infoCopy and infoOrig Both Point
    to Same Address.


    ![](images/00021.gif)*Figure 21: infoCopy and infoOrig Both Point to Same Address*


    http://NewtonSaber.com/OOJavaScript/Images/Figure21.png


    Do you see how fast it is to create a copy – also known as a new reference --
    of an object now?


    Everything else you learn about JavaScript objects is based upon this and that
    is why it is so important to know what is actually going on behind the scenes.


    We will look further into the implications of Reference types as we go through
    the book, but now that you know that you will be able to understand that rest
    of the book even more. I''ll leave you in this chapter with the sidebar on Assembly
    Language and we''ll meet again in the next chapter to talk about JavaScript Functions
    (they''re reference types too).


    ## **SIDEBAR - Assembly Language? I Thought This Was JavaScript**


    In the past programmers didn''t have all the nice GUI (graphical user interfaces)
    we have now and they had to know how to talk directly to the CPU (main processor)
    of the computer and tell it to store their data at a specific memory location
    (address).


    They used Assembly language or even before that they used Machine language – which
    spoke the exact cryptic language that the processor spoke.


    At times, their code – in Machine Language – literally looked like a list of zeros
    and ones:


    11100101011100000100101010001101001.


    That would tell the CPU to store the value 15 at memory address 0x00CC10\. Not
    really, I just made it up. But, honestly, their code really was just a list of
    zeros and ones in Machine language.


    **Mistake Prone**


    Lots of mistakes were made as computer scientists'' eyes crossed as they tried
    to determine if it was three ones and a zero or four ones and a zero. Debugging
    that code was killer hard. And, hard on the eyes.


    **3^(rd) Generation Language**


    You are now using a 3GL (3^(rd)Generation Language) or a high-level language,
    because you don''t have to speak directly to the processor. Instead you write
    code which looks a bit more like natural language and something turns that code
    into something the computer can understand.


    **JavaScript Interpreter Works For You**


    The something that does that work in our case is the JavaScript Interpreter and
    the Interpreter runs inside the web browser. The Interpreter determines how to
    translate the JavaScript commands you type into commands the computer can understand
    and carry out.That means that us lucky developers can now write code that is much
    easier to learn (JavaScript). Instead of having to understand cryptic processor
    Op Codes (operation codes) and memory addresses, all you have to do to store a
    value at a memory location is type the following valid JavaScript:var x = 15;


    # Chapter 2


    ### Functions: They''re Objects Too


    We learned a lot about what happens behind the scenes in the last chapter and
    this chapter will continue on in the same way. Last time we learned that we could
    create an object in the following way:


    var person = {};


    person.firstName = "frank";


    person.lastName = "smith";


    But, now suppose you want to create anotherperson.


    You want to do so, because you don''t want to have to type all the code to add
    the properties (lastNameand firstName again).


    You might think, okay, I''ll do the following:


    var person2 = person;


    However, as we learned in the last chapter, that doesn''t create a new object.
    Instead it just makes a new reference to the same object using a new variable
    name.


    That doesn''t help us if we want person2to have a different firstNameand lastName
    i.e. new memory addresses where we can store new values.


    In other languages, like C++, Java, or C# we would create a class template which
    we could then instantiate into an object. It would look something like the following:


    // C# code comparison


    class person


    {


    // this is constructor, which is automatically called


    // when the new object is


    instantiated


    public person(firstName,


    lastName);


    public string lastName;


    public string firstName;


    }


    Then whenever we wanted to use this object we would just do the following:


    // ### C# CODE ########


    person ted = new person();


    ted.firstName = "ted";


    ted.lastName = "jones";'
