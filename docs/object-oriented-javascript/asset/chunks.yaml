    document.getElementById("first"); var el2 =


    document.getElementById("second"); var el3 =


    document.getElementById("third");


    var container = {};


    container.paramVal = 17;


    function double(inNumber) {


    inNumber.paramVal =


    inNumber.paramVal * 2;


    el2.innerHTML = "inNumber, inside double(), is " + inNumber.paramVal; }


    el.innerHTML = "paramVal, BEFORE being passed to double(), is " + container.paramVal;


    double(container);


    el3.innerHTML = "paramVal, AFTER being passed to double(), is " + container.paramVal;


    If you run that code, you will now see some output which looks similar to the
    following and is attempting to show you that **the primitive value of the passed
    object is altered by the double() function**.


    ### paramVal, BEFORE being passed to double(), is 17 inNumber, inside double(),
    is 34 paramVal, AFTER being passed to double(), is 34


    Because we have gone through this in memory, you may understand why the Object
    type is altered. Figure 26: Passing Reference type : part 1 shows this in memory.
    Notice that the contain.paramVal has a value of 17 – before the double() function
    is called.


    ![](images/00026.gif)*Figure 26: Passing Reference type : part 1*


    http://NewtonSaber.com/OOJavaScript/Images/Figure26.png


    ***Reference (Base Memory Address) Is Passed To Function*** When the function
    is called, the reference to the container is passed. We can think of this reference
    as the base memory address of the container variable (Object)l.


