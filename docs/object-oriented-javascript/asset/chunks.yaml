    address of the function and be able to manipulate the values located at those
    addresses, which means you will alter the object (function) that is passed in
    to the function. All of this means you need to be careful and know exactly what
    you are attempting to do.


    However, at this point you might wonder, "why would I ever want to pass a function
    to a function?" It does seem to be an odd thing to want to do, but it is how numerous
    built-in JavaScript functions work, such as thesetTimeout() function.


    ## **setTimeout – Pass A Function**


    The global window object in JavaScript has a setTimeout() function which you can
    call to invoke a function at a later time.


    setTimeout takes two parameters. The first one is a function and the second one
    is the number of milliseconds to wait before the function is called. The function
    you pass to the setTimeout represents the commands you want to run when the timer
    fires after N milliseconds.


    setTimeout(functionName, millis);


    Here''s a quick example you can try or watch.


    var el =


    document.getElementById("first"); el.innerHTML = "After 3 seconds (3000ms) you
    will see another message.";


    var el2 =


    document.getElementById("second"); setTimeout(showAnswer, 3000);


    function showAnswer()


    { el2.innerHTML = "It has been


    approx. 3 seconds, since I was told


    to run.";


    setTimeout(hideAnswer,3000);


    }


    function hideAnswer() {


    el2.innerHTML = "";


    setTimeout(showAnswer,3000);


    }


    You can watch a similar sample at my plnkr.co: http://plnkr.co/edit/BJn9UZiYpSWu34ydRCR7?p=preview


    I''ve made this script call the setTimeout() method in two different places so
    that after the text appears it will disappear and then when it disappears, it
    will appear again. That way you will be sure to see it all happen.


    Now you can see at least one reason (and there are many more) to pass a function
    to a function let''s go ahead and take a look at how we can create a function
    that takes a function as a parameter and uses it.


    ## **Architectural Principle Revealed In Passing Function**


    This next example will subtly reveal an architectural principle to you while we
    look at passing a function to a function. Here''s the initial code.


    function displayData(item)


    {


    alert(item);


    }


    function mainWork(targetFunc) {


    var allThings = [];


    allThings.push("thing1"); allThings.push("thing2"); allThings.push("thing3");
    allThings.push("thing4"); for (x in allThings) {


    targetFunc(allThings[x]); }


    }


    mainWork(displayData);


    If you go to the Plunker for that code or run it using RunAnyJS you will immediately
    learn that it is quite annoying, because it uses an alert() modal dialog box to
    provide the user with information.


    http://plnkr.co/edit/cVmbtIeYVqDXUEuIdLvr?p=preview


    ## **A Callback Function**


    Notice that the mainWork method takes a function that it will later use to display
    the data to the user. This is the computer science concept – albeit a very simplistic
    example – of a callback function. That means, the functionality which will be
    called or used by another function is separated out so it can easily be replaced.


    ***Separating Functionality To Replace Later*** Since it is a function that we
    pass in, we can replace our displayData function with any compatible function.


    ***Replacing Functionality With Less Testing***


    Now, instead of forcing all of the code in mainWork to be retested because we
    change something in it, we can just replace the displayData function and we only
    have to test to insure that the replacement function works.


    This is a huge architectural principle and gets you closer to designing architectural
    solutions rather than just pasting some scripts together.


    Let me show you how it works with the following sample. Basically we add a new
    function named


    displayDataViaDiv(item);


    That function is simple and basically says just append the value of item to the
    DIV''s text.


    function displayDataViaDiv(item)


    {


    el.innerHTML += " " + item;


    }


    Finally, we simply change the original call to


    mainWork(displayData) with the new one to call our new function mainWork(displayDataViaDiv);


    That''s it. Now it will display the data in the DIV instead of those annoying
    pop-ups.


    The entire code listing is below so can try it. Or run this Plunker and check
    it out:


    http://plnkr.co/edit/BKK6RhEmXFnyILPE8f8Y?p=preview


    function displayData(item)


    {


    alert(item);


    }


    // initialize our div for output


    var el =


    document.getElementById("first");


    el.innerHTML = "";


    function displayDataViaDiv(item)


    {


    el.innerHTML += " " + item;


    }


    function mainWork(targetFunc) {


    var allThings = [];


    allThings.push("thing1"); allThings.push("thing2"); allThings.push("thing3");
    allThings.push("thing4"); for (x in allThings) {


    targetFunc(allThings[x]); }


    }


    mainWork(displayDataViaDiv);


    A few things to notice about this new script are:


    1\. The old displayData function does not have to be deleted or altered. That
    means the old functionality can run as it did. Now, we simply implement the new
    functionality. This is great for ongoing development because we don''t break old
    code.


    2\. We still have to keep our function''s public interface the same. This just
    means that the function still takes an item and that item is a string in this
    case. If we had really wanted to separate this out then that type could have been
    a base type (top of an inheritance chain) and the type would implement a specific
    interface that is known and always the same. We''ll learn more about this as we
    look at dependency injection, but I thought I might just mention it here.


    Now, before closing this chapter I''d like to return to that old phrase, *functions
    are first-class types*.


    ## **Functions Are First-class Types**'
