    ***Terminating Character***


    First of all notice that last odd character located at 0x00CD01. Since the string
    can be any length, there has to be a way to determine the last byte that is associated
    with the string. In C and C++ they used a \0 (backslash followed by zero) to denote
    this. It''s probably the same in JavaScript. The point to take away from this
    is that someone has to handle the issue that strings are of different lengths
    and the constraint that associated memory for a variable has to be contiguous.


    ***What If The String Grows?***


    Instantly this should bring to mind the problem. What if the string becomes longer,
    because you set it to a new string value?


    For example, if later in the program you store:


    companyName = "Big House Crafts";


    Suddenly the program needs seven more contiguous bytes. But, what if the bytes
    past 0x00CD01 are already taken for use with other variables?


    ## **Strings Are Probably Implemented With References**


    That is why that most likely a string in JavaScript is not actually implemented
    by value, but by reference. Now, we are moving toward our understanding of Reference
    Types.


    ## **Main Difference Between Reference and Primitive Types**


    While primitive types store the actual value at the memory address. Reference
    types store an address at the memory address. Let me say that again. Instead of
    storing the actual data value at the memory address, reference types store an
    address which points to another place in memory where the data is actually stored.


    Think about those pictures of memory I''ve shown you so far and compare it to
    the one in Figure 9: Storing a Reference Type, which is what memory looks like
    when we store a Reference type.


    ![](images/00009.gif)*Figure 9: Storing a Reference Type*


    http://NewtonSaber.com/OOJavaScript/Images/Figure9.png


    First of all, in Figure 9 I am still showing you the storage of the Number primitive
    (in 0x00CCF0 - 0x00CCF7). However, we want to focus on the value (which is another
    address) that is stored at location 0x00CCF8.


    ***Big Blue Bar : Wall of Memory***


    The big blue bar simply represents a separation of the memory on the left to the
    memory on the right so I can show you that the Reference type stored a memory
    address which points to another section of memory, which is where the actual data
    for the string is stored.


    The memory address it points to is 0x00AA01\. That is the base address where the
    variable length string (in this case 16 bytes + 1 byte for terminator) is stored.


    ***Why Would They Store the Address Instead of Value?***


    The string type points out the challenge of storing a type which will take up
    a variable number of bytes in memory. As soon as you change the length you need
    a different block of memory and so the Interpreter would have to keep changing
    that value in its lookup table. Instead of doing that the architects can simply
    store an address and then go to the address whenever it changes, because the string
    has changed.


    ***Let The Sub-system Handle the Problem***


    There is a lot more to it than this, because some other lower level process (beneath
    the Interpreter) would also have to find the contiguous bytes of memory and that''s
    why the Interpreter handles Reference types this way: to make it easier on itself
    and let the sub-system handle that problem.


    ## **What Happens When a String Is Changed?**


    Now, you can see that when a string is changed, all the Interpreter does is count
    the bytes in the string and ask a subsystem to go and store the string and then
    report back the base address where the string is stored. Next, all the Interpreter
    has to do is store the address.


