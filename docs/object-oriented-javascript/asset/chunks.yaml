    If you run that code you''ll see that altering the `randomVal` inside the function
    has no affect on the `randomVal` at the application scope.


    The output looks like what you see in


    ![](images/00023.jpeg)**Figure 23: Function scope and variables*


    http://NewtonSaber.com/OOJavaScript/Images/Figure23.png


    Since the first `randomVal` is defined outside of the function and the other one
    is defined within the function they are two different variables stored at two
    seperate memory locations.


    ## Functions Are Reference Types: Objects


    A function is a `Reference` type and is stored in memory the same way objects
    are – they are objects -- so memory will look very similar to what we saw earlier.
    Take a look at the view of memory for this last program shown in Figure 24: function
    object in memory.


    ![](images/00024.gif)**Figure 24: function object in memory*


    http://NewtonSaber.com/OOJavaScript/Images/Figure24.png


    While you are examining Figure 24 there are a number of things to examine closely.


    1. The `randomVal` on the left (orange color) is the application-wide variable
    not the same one as the `randomVal` on the right (green color) which is the one
    which is scoped to the `getRandomInteger` function. As you can see, they have
    different base memory addresses and setting one will have no affect on the other.


    2. The function in memory (green color on the right) looks just like our previous
    examples of other `Reference` types. That is because it is a `Reference` type
    and inherits from the JavaScript base `Object` type.


    3. The application scope contains two `Reference` types to `HtmlDivElements` (`el1`
    and `el3`). The function scope contains one reference to an `HtmlDivElement`.
    Those are used simply to output the strings so you can see them so I have not
    shown the extra memory for those. Just be aware that those three items become
    References also, since they are references to HTML elements.


    4. One more thing to notice here is that in our sample the `randomVal` inside
    the function got the value of 897 which will not fit into 8 bits (one byte) so
    you''ll see that to set the binary value it leaks over into the second byte (address
    `0x00AA03`) since we need more bits to store that large of a value. The entire
    value would look like the following: `00000011 10000001` The Just wanted to point
    this out since it is different than our previous samples.


    ## Passing Objects and Primitives to Functions


    Now, that you''ve seen that functions are objects it will be a bit more obvious
    that we can pass a function as a parameter on a function, just as we can pass
    an object to another function.


    Since, haven''t examined it closely, let''s take a look at how that passing a
    `Primitive` type is different than passing a primitive type like `Number`, `Boolean`,
    etc.


    Again, you will see that this will be much more clear to you, because you understand
    the memory model – the way JavaScript (and subsystems) allocate memory for each
    of these types.


    ```javascript

    function double(inNumber)

    {

    inNumber = inNumber * 2;

    }

    ```


    View this sample at plnkr.co:


    http://plnkr.co/edit/lD3b4BbmLgXzjnqTdujI?p=preview


    Below is the code for this example, which you can run at:


    http://uncoveryourlife.com/LearnJS/RunAnyJs.htm


    ```javascript

    var el = document.getElementById("first");

    var el2 = document.getElementById("second");

    var el3 = document.getElementById("third");

    var paramVal = 17;


    function double(inNumber) {

    inNumber = inNumber * 2;

    el2.innerHTML = "inNumber, inside double(), is " + inNumber;

    }


    el.innerHTML = "paramVal, BEFORE being passed to double(), is " + paramVal;

    double(paramVal);

    el3.innerHTML = "paramVal, AFTER being passed to double(), is " + paramVal;

    ```


    This sample, simply creates an application variable named `paramVal` which we
    use to pass in to our `double()` function.


    Inside of the `double()` function we do not create a new variable, but instead,
    just set the value of `inNumber` to double its value.


    Then, when we return from our `double()` function we see that our `paramVal` still
    has the value it was originally set to (17).


    ## Primitive Type Parameters Have Function Scope


    That''s because the memory for the `inNumber` primitive is created in the `double()`
    function scope.


    Let''s take a look at the memory model for the previous code to get an idea of
    what is really happening. Examine Figure 25: Passing a primitive to a function
    and I''ll explain what is happening below.


    ![](images/00025.gif)**Figure 25: Passing a primitive to a function*


    http://NewtonSaber.com/OOJavaScript/Images/Figure25.png


    **Note**: the value of `inNumber` in Figure 25 is 34 (the value after the function
    has run).


    After examining the memory model you can see that:


    1. The `paramVal` is created as an application-wide variable – (in orange color)
    `paramVal` has its base address at `0x000CCF0`.


    2. The parameter is created as a primitive which is scoped to the function object
    `double()`. In other words, `inNumber` gets a base address (`0x00AA03`).


    3. The `paramVal` is not affected because it was passed by value.


    ## Passing A Reference Type To Function


    You may believe that seems quite, however, lets change our examination to what
    happens when you pass a Reference type.


    ```javascript

    var container = {};

    container.paramVal = 17;

    ```


    Now, we''ll just add to the code:


    ```javascript

    double(container);

    ```


    This means we are passing the entire object to the function.


    Below is the updated code which you can run at the RunAnyJS page or you can check
    out the code at plnkr.co:


    http://plnkr.co/edit/C8RRuFh7ALVgMvw?p=preview


    ```javascript

    var el = document.getElementById("first");

    var el2 = document.getElementById("second");

    var el3 = document.getElementById("third");

    var container = {};

    container.paramVal = 17;


    function double(inNumber) {

    inNumber.paramVal = inNumber.paramVal * 2;

    el2.innerHTML = "inNumber, inside double(), is " + inNumber.paramVal;

    }


    el.innerHTML = "paramVal, BEFORE being passed to double(), is " + container.paramVal;

    double(container);

    el3.innerHTML = "paramVal, AFTER being passed to double(), is " + container.paramVal;

    ```


    If you run that code, you will now see some output which looks similar to the
