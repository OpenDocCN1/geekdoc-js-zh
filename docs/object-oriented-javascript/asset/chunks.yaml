    document.getElementById("first"); var el2 =


    document.getElementById("second"); var el3 =


    document.getElementById("third");


    var paramVal = 17;


    function double(inNumber) {


    inNumber = inNumber * 2;


    el2.innerHTML = "inNumber, inside double(), is " + inNumber;


    }


    el.innerHTML = "paramVal, BEFORE being passed to double(), is " + paramVal;


    double(paramVal);


    el3.innerHTML = "paramVal, AFTER being passed to double(), is " + paramVal;


    This sample, simply creates an application variable named paramVal which we use
    to pass in to our double() function.


    Inside of the double() function we do not create a new variable, but instead,
    just set the value of inNumber to double its value.


    Then, when we return from our double() function we see that our paramVal still
    has the value it was originally set to (17).


    ## **Primitive Type Parameters Have Function Scope**


    That''s because the memory for the inNumber primitive is created in the double()
    function scope.


    Let''s take a look at the memory model for the previous code to get an idea of
    what is really happening. Examine Figure 25: Passing a primitive to a function
    and I''ll explain what is happening below.


    ![](images/00025.gif)*Figure 25: Passing a primitive to a function*


    http://NewtonSaber.com/OOJavaScript/Images/Figure25.png


    **Note**: the value ofinNumberin Figure 25 is 34 (the value after the function
    has run).


    After examining the memory model you can see that


    1\. The paramValis created as an application-wide variable – (in orange color)paramValhas
    its base address at 0x000CCF0.


    2\. The parameter is created as a primitive which is scoped to the function object
    double(). In other words, inNumbergets a base address (0x00AA02) that is created
    within thedouble()function.


    3\. Since, inNumbergets its own memory the value **does not affect the original
    value** (paramVal) which was sent in to thedouble()function.


    You may believe that seems quite obvious, however, lets change our examination
    to what happens when you pass a Reference type to a function.


    ***Passing A Reference Type to A Function***


    Let''s leave most of our previous example the same as it was. Instead, we''ll
    just add a new object which will contain the primitive which we will pass in to
    thedouble()function.


    The JavaScript to create the new application object will look like the following:


    var container = {}; // create object


    container.paramVal = 17;


    Now, instead of passing theparamValitself, we will pass the entire container object
    to the function.


    Now, the function call will look like the following: double(container);


    That means we are passing an object to the function so we''ll have to alter the
    code in the function a bit to get the primitive out of the object. It''ll look
    like the following:


