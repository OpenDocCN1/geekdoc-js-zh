  trans: '


    这意味着你对该对象所做的任何操作，都是在对对象本身进行操作。


    ### 关于 getEmployeeId 函数的地址如何？


    你可能已经注意到，在模板对象（`Person`）和新对象（`employee`）中，我将指向 `getEmployeeId` 函数的地址都设置为同一个值（`0x2CFC01`）。我这样做是因为我认为解释器应该足够聪明，能够看出这些是相同的函数（因为它们执行的工作相同），并且解释器会进行这种优化以节省内存。否则，同一个函数将以不同的地址被加载到内存中，然后由每个对象（`Person`
    和 `employee`）分别引用。在我看来这似乎是浪费内存。


    ### 总结


    现在你已经理解了对象在内存中是如何创建的、如何创建模板以及以及使用 `new` 和 `this` 操作符，你已经准备好学习更高级的内容了。我相信你发现自己对
    JavaScript 的理解已经在脑海中呈指数级增长。

    '
