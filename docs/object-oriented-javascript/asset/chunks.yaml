  trans: "\n\n# 定义\n实例化（Inst）意味着在物理内存中分配内存并构造对象。这意味着该对象是存在于内存中的一个有效结构，并且（取决于访问权限）对你的程序是可访问且可。\n\
    \n在 C++、Java、C# 中，你拥有 `new` 关键字，它允许你创建一个存在新内存地址的新对象。每当你需要一个新对象时，只需告诉编译器：`person\
    \ variableName = new person()` 即可得到一个。\n\n## JavaScript 的 new 运算符\nJavaScript\
    \ 确实有一个 `new` 运算符，但它没有类模板的概念。幸运的是，在 JavaScript 中，我们可以通过函数来模拟我在上面的 C# 示例中展示的内容。\n\
    \n这是因为函数实际上也是对象。既然函数是对象，让我们来简单聊一下对象的另一个方面。\n\n## 对象拥有自己的内存\n记住，对象拥有自己的内存空间。另一种说法是，对象可能包含其他原始类型（`Number`、`Boolean`\
    \ 等）和其他引用类型（`Objects`、`Arrays` 等），无法在不通过实例化对象的情况下获取这些内容。\n\n在代码中，它看起来如下：\n\n```\n\
    person.firstName = \"Wilma\";\n```\n\nJavaScript 没有提供其他获取 `firstName` 的方法，除非通过实例化的\
    \ `person` 对象。对象的内存是隔离的。\n\n## 对象是内存包装器\n另一种说法可能是，对象是内存包装器。让我们再次看一眼内存的图。这次我们将创建一个更高级的对象，它包含一个\
    \ `Number`、`String`、`Boolean` 和一个 `Array`（引用类型）。\n\n以下是 JavaScript 代码：\n\n```javascript\n\
    var person = {};\nperson.firstName = \"Ted\"; person.age = 53;\nperson.hasChildren\
    \ = true; person.children = [];\nperson.children.push(\"sam\"); person.children.push(\"\
    sara\"); person.children.push(\"sandy\");\n```\n\n通过检查图 22：内存中的 person 对象，你可以看到\
    \ `person` 对象在内存中可能的样子。\n\n![](img/00022.gif)*图 22：内存中的 person 对象*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure22.png\n\
    \n### 深入观察内存中的 person 对象\n在图 22 中，你可以看到：\n\n1. `person` 对象的基地址是 `0x00AA01` – 该地址指向内存中实际\
    \ person 对象（图 22 中的浅橙色区域）所在的位置。\n2. `person` 对象包含一个名为 `children` 的引用类型（`Array`\
    \ 对象），它指向位于 `0x10FF00` 处数组对象的基地址（图 22 中的浅绿色区域）。\n3. `children` 中每个字符串的字节存储在数组对象中。\n\
    \n你可以通过 Plunker 链接更细致地检查代码：http://plnkr.co/edit/ou3IpPVMhQqNu89fS7J9?p=preview\n\
    \n如果不通过 `Array` 对象，你就无法获取 `childrenArray` 内部的值。例如，如果你想要其中一个值，可以使用以下 JavaScript\
    \ 代码段来引用它。\n\n```javascript\nconsole.log(person.children[0]);\n```\n\n这是因为如果不引用数组本身，你就没有办法引用该数组内部包含的内存。这就像是\
    \ `Array` 对象在这些值周围筑了墙，你必须来到 `Array` 对象才能获取这些值。\n\n`person` 对象中包含的项也是如此。事实上，我们可以把对象称为容器。你无法在不执行如下\
    \ JavaScript 代码的情况下获取 `person` 对象中的任何项：\n\n```javascript\nconsole.log(person.age);\n\
    ```\n\n### JavaScript 的另一种表述方式\n那种 JavaScript 语法就像是在说：\n\n进入 `person` 对象并查看内部（`.\
    \ `），找到一个名为 `age` 的属性，并告诉我存储在那里的值。\n\n### 等同于 JavaScript 的自然语言表述\n这基本上是另一种说法：\n\
    \n在内部 JavaScript 表格中查找 `person` 对象的地址。它是 `0x00AA01`，所以去该地址查找 `age` `Number`（原始类型）的地址。该地址是\
    \ `0x00AA05`，因此查看内存并确定存储在那里的值。\n\n### 包装器也是作用域\n这些对象包装器的有趣之处在于它们创建了作用域。它们限制了你查看其内部包含的值的范围。\n\
    \n事实上，Java、C++ 和 C# 使用了一些关键字来指示属性是否在对象外部可见。你在之前的示例代码中就看到了这一点，当时我有一些以 `public`\
    \ 单词开头的语句。\n\n## 错误指示作用域\n你可以看到作用域是受限的，因为如果你在脚本中添加以下行：\n\n```javascript\nconsole.log(age);\n\
    ```\n\n在 Google Chrome 中，你将收到一条显示“age is not defined”的错误。\n\n这是因为你查看的是应用程序作用域，而不是你的\
    \ `personobject` 作用域。\n\n我向你展示了这一切，让你现在能更好地理解函数。在 JavaScript 中，函数是对象，并且拥有作用域。\n\
    \n## 函数是对象，它们拥有作用域\n作用域在编程世界非常重要。在 JavaScript 世界中，它可能会非常令人困惑。\n\n我们在代码中使用函数的主要原因之一是将它们拆分为我们可以处理的小部分。每个函数都有自己的作用域，并允许我们管理它们所使用的变量。这种作用域如何帮助我们程序员。函数在\
    \ JavaScript 中也是类型。\n\n## 什么是一等类型？\n仅仅是函数被视为类型。如果你阅读关于 JavaScript 的内容，可能会有人说“函数是一等对象”或“函数是一等类型”。\n\
    \n这仅仅意味着函数实际上变成了类型。就像有 `Number` 原始类型或 `Object` 引用类型一样，函数也是引用类型。\n\n## 使用 JavaScript\
    \ typeof\n通过 `typeof` 运算符我们可以看到这种新类型（`function`）。\n\n首先，我们需要定义一个可以测试的函数。这是一个简单的函数，计算传入字符串长度：\n\
    \n```javascript\nfunction charCounter(targetString)\n{\n  return targetString.length;\n\
    }\n```\n\n这里是使用该函数的代码：\n\n```javascript\nvar el = document.getElementById(\"first\"\
    );\nvar output = \"这个字符串的长度为 \";\nel.innerHTML = output + charCounter(output);\n\
    ```\n\n现在，我们可以检查名为 `charCounter` 的对象的类型。\n\n```javascript\nvar element2 = document.getElementById(\"\
    second\");\nelement2.innerHTML = \"charCounter 是 \" + typeof charCounter;\n```\n\
    \n当然，一旦你运行该代码，你会发现显示：charCounter 是 function JavaScript 解释器知道这是一个函数对象。\n\n## 函数与作用域\n\
    正如我们学过的对象拥有作用域，我们也了解到函数拥有作用域。\n\n看以下函数：\n\n```javascript\nfunction getRandomInteger()\n\
    {\n  var randomVal = Math.ceil(Math.random()*1000);\n}\n```\n\n// 调用函数生成随机数\n\
    getRandomInteger();\n\n尽管上面的函数生成了随机数，但你只能在函数内部访问该值。显然，我们可以向函数添加以下行，以便我们能够获取该值：\n\
    \n```javascript\nreturn randomVal;\n```\n\n这里的点是函数有自己的作用域，这对 JavaScript 程序员很有帮助，可以让你保持值清晰。\n\
    \n// 创建应用程序作用域的变量\nvar randomVal = 55;\n\nel1 = document.getElementById(\"first\"\
    );\nel1.innerHTML = \"randomVal 是 : \" + randomVal;\n\nfunction getRandomInteger()\n\
    {\n  // 创建具有函数作用域的变量\n  var randomVal = Math.ceil(Math.random()*1000);\n  var\
    \ el2 = document.getElementById(\"second\");\n  el2.innerHTML = \"在 getRandomInteger\
    \ 内部 randomVal 是 \" + randomVal;\n}\n\nvar el3 =\n\n"
