    # Does Understanding All This Memory Stuff Matter to JavaScript Programmers?


    Okay, so now you know about this distinction between primitive types which store
    their values at the address and reference types which store a memory address in
    the initial memory address, but how does that impact you as a JavaScript developer?
    I''m glad you asked, because it has a huge impact on understanding your code.


    # How Does Primitive Versus Reference Type Impact JavaScript Developers?


    If you''ve read through the previous material and you have a basic handle on it,
    then you are at a different place than 90% of the JavaScript developers out there,
    because they do understand that primitives and reference types are stored differently.
    Understanding this in depth helps us build more robust code. Let''s take a look
    at a sample to show you how important it is.


    # First Easy One, What Happens When You Copy?


