  trans: "\n请记住，名为 `children` 的原始类型现在由 `Reference` 类型（`infoOrig`）拥有，因此由它管理该特定项目的内存。这意味着该引用项占据了新原始类型的全部内存空间，加上引用对象本身占用的任何内存——例如地址\
    \ `0x00AA01` 处的内存。\n\n## 引用类型：内存中可扩展的\n\n这是 `Object` 成为 `Reference` 类型的主要原因之一：因为它是一个`User\
    \ Defined Type`（自定义类型），因此它在内存中的大小是无法预定的。在这种情况下，我们的 UDT 仅由一个 `Number` 组成，但在其他情况下，对象可能包含任意数量的原始类型和/或其他引用类型。\n\
    \n### 第 7 步\n\n第 7 步与我们在第 2 步处理第一个原始类型（`numberOfChildren`）时类似。在第 7 步中，我们将 `children`\
    \ 的值改为 4。唯一的区别是这个原始类型由引用类型（`infoOrig`）拥有。然而，在此时你实际上看不出任何区别。\n\n内存现在看起来就像图 19 所示：修改由引用类型拥有的原始类型的值——现在\
    \ `children` 的值为 4（二进制 00000100）。\n\n![](img/00019.gif)**图 19：修改由引用类型拥有的原始类型的值*\
    \ http://NewtonSaber.com/OOJavaScript/Images/Figure19.png\n\n## 创建引用类型的拷贝\n\n\
    现在我们为一种极其有趣的变化做准备，这种变化将让你惊讶，并将彻底开启你的思维，从一个全新的角度理解编程。\n\n### 第 8 步\n\n理解这一个概念将让你在所有语言中成为一名更好的程序员，因为你将理解编写代码时真正发生了什么。\n\
    \n创建一个拷贝简单意味着创建一个新的变量名，并将之前创建的值赋值给该变量名。我们已经在原始类型上这样做过，现在我们对通过这一行代码执行同样的事情：\n\n\
    ```\nvar infoCopy = infoOrig;\n```\n\n然而，这行代码大不相同，因为我们正尝试创建一个新的 `Reference Type`，它的值与之前创建的\
    \ `Reference type` 相同。\n\n但你必须记住，存储为引用类型的值是一个地址（指向内存中对象所在位置的内存位置）。\n\n## 我的示例中内存不足（空间）\n\
    \n我的示例图中似乎内存（空间）不够了，因此我将取 `0x00CCEE` 处的值（假设这些值已被清空且未被使用）。我这样做仅仅是为了打印空间。\n\n当 JavaScript\
    \ `Interpreter` 看到这行代码时，它执行以下操作：\n\n1. 在其内部表中创建一个新的 `Reference object` (`infoCopy`）。\n\
    2. 将 `infoOrig` 的地址 (`0x00AA01`）保存到它引用 `infoCopy` 的地址 (`0x00AA01`) 处。\n\n这看起来就像图\
    \ 20 所示：创建了 `infoCopy` 引用类型。注意，现在你有两个指向内存中同一位置的变量。这两个变量*引用*内存中的同一个对象——地址为 `0x00AA01`\
    \ 的那个对象。\n\n![](img/00020.gif)**图 20：创建了 infoCopy 引用类型* http://NewtonSaber.com/OOJavaScript/Images/Figure20.png\n\
    \n### 第 9 步：你的两个引用都指向同一个东西\n\n这就是为什么现在当你通过 JavaScript `infoCopy.children = 7`\
    \ 修改 `infoCopy` 的值时，你也修改了 `infoOrig.children` 的值。\n\n当 `Interpreter` 运行那行代码时，它查找\
    \ `infoCopy` 的基础地址并获取 (`0x00AA01`)。然后它在该对象内部找到名为 `children` 的属性并设置为值 7。\n\n当这种情况发生时，你的另一个变量（`infoOrig`）仍然引用同一内存，因此你也修改了该值。\n\
    \n现在内存看起来就像图 21 所示：`infoCopy` 和 `infoOrig` 都指向同一个地址。\n\n![](img/00021.gif)**图\
    \ 21：infoCopy 和 infoOrig 都指向同一个地址* http://NewtonSaber.com/OOJavaScript/Images/Figure21.png\n\
    \n你看到现在创建一个对象的拷贝（也称为新引用）有多快了吗？\n\n你学到的关于 JavaScript 对象的其他知识都是基于此的，这就是为什么知道幕后到底发生了什么是如此重要的原因。\n\
    \n在我们阅读这本书的过程中，我们将进一步研究 `Reference types` 的影响，但现在你已经知道了这一点，你将能够更好地理解这本书的剩余部分。我在本章留下了关于\
    \ `Assembly Language`（汇编语言）的侧栏，我们将在下一章再次讨论 JavaScript `Functions`（它们也是引用类型）。\n\
    \n## 侧栏 - 汇编语言？我以为这是 JavaScript\n\n在过去，程序员没有我们现在这样好的 GUI（图形用户界面），他们必须知道如何直接与计算机的\
    \ `CPU`（主处理器）通信，并告诉它将数据存储在特定的内存位置（地址）。\n\n他们使用 `Assembly language`（汇编语言），甚至在此之前使用\
    \ `Machine language`（机器语言）——这使用的是处理器所说的完全加密的语言。\n\n有时，他们的代码——在 `Machine Language`\
    \ 中——看起来看起来就是一串 0 和 1：\n\n```\n1110010101110000100101101\n```\n\n这会告诉 `CPU` 在内存地址\
    \ `0x0CCEE` 处存储值。\n\n### 易错性\n\n计算机科学家在尝试确定它时犯了许多错误，眼睛都看直了，这似乎是三个 1 和一个 0。\n\n\
    ### 第三代语言\n\n你现在使用的是 `3GL`（第三代语言）或高级语言，因为你不需要直接与处理器通信。\n\n### JavaScript 解释器为你工作\n\
    \n在我们案例中，做这些工作的是 JavaScript `Interpreter`，它运行在浏览器内部。这意味着我们开发者现在可以编写更容易学习的代码。不需要理解处理器\
    \ `Op Codes`（操作码）和内存地址，要在内存位置存储一个值，只需输入以下有效的 JavaScript\n\n```\nvar x = 15;\n\
    ```\n\n# 第 2 章\n\n### 函数：它们也是对象\n\n我们在上一章学习了许多关于幕后发生了什么的知识，本章将继续讨论。上次我们学习了可以通过以下方式创建一个对象：\n\
    \n```\nvar person = {};\nperson.firstName = \"frank\";\nperson.lastName = \"smith\"\
    ;\n```\n\n但是，现在假设你想创建另一个人。你想这样做，是因为你不想再次输入添加这些属性（lastName 和 firstName）的代码。你可能会想：“好吧，我会这样做：”\n\
    \n```\nvar person2 = person;\n```\n\n然而，正如我们在上一章学到的，这并没有创建一个新对象。它只是使用新的变量名对同一个对象创建了引用。如果我们希望\
    \ person2 拥有不同的 firstName 和 lastName（即新的内存地址来存储新值），这对我们来说并没有帮助。\n\n在其他语言（如 C++、Java\
    \ 或 C#）中，我们会创建一个 `class` 模板，然后将其实例化为对象。它看起来像如下：\n\n```csharp\n// C# 代码对比\nclass\
    \ person\n{\n    // 这是构造函数，在实例化新对象\n    // 时自动调用\n    public person(firstName,\
    \ lastName);\n    public string lastName;\n    public string firstName;\n}\n```\n\
    \n那么，每当我们想使用这个对象时，只需要这样做：\n\n```csharp\n// ### C# 代码 ########\nperson ted = new\
    \ person();\nted.firstName = \"ted\";\nted.lastName = \"jones\";\n```\n"
- fmt: "\n# Definition\nInst means to allocate memory and construct the object in\
    \ the physical memory. It means the object is a valid structure residing in memory\
    \ and (depending upon accessibility) is accessible and usable to your program.\n\
    \nIn C++, Java, C# you have the `new` keyword which allows you to create a new\
    \ object that exists at a new memory address. Whenever you want a new one, you\
    \ simply tell the compiler : `person variableName = new person()` and you get\
    \ one.\n\n## JavaScript's new Operator\nJavaScript does have a `new` Operator,\
    \ however it does not have the concept of a class template. Fortunately, in JavaScript,\
    \ we can mimic what I showed you in C# sample above, by using functions.\n\nThat\
    \ is because functions are actually objects. Since functions are objects, let's\
    \ talk about another aspect of objects for a moment.\n\n## Objects Have Their\
    \ Own Memory\nRemember that objects have their own memory space. Another way to\
    \ say that is objects may contain other primitive types (`Number`, `Boolean`,\
    \ etc) and other reference types (`Objects`, `Arrays`, etc) and you cannot get\
    \ to those without going through the instantiated object.\n\nIn code it looks\
    \ like the following:\n\n```\nperson.firstName = \"Wilma\";\n```\n\nJavaScript\
    \ does not provide any other way to get to `firstName`, except to go through the\
    \ instantiated `person` object. The object memory is segregated.\n\n## Objects\
    \ Are Memory Wrappers\nAnother way to say this, might be to say that objects are\
    \ memory wrappers. Let's take a look at a picture of memory again. This time we'll\
    \ create a more advanced object which contains a `Number`, `String`, `Boolean`\
    \ and an `Array` (Reference type).\n\nHere's the JavaScript code:\n\n```javascript\n\
    var person = {};\nperson.firstName = \"Ted\"; person.age = 53;\nperson.hasChildren\
    \ = true; person.children = [];\nperson.children.push(\"sam\"); person.children.push(\"\
    sara\"); person.children.push(\"sandy\");\n```\n\nYou can see what the `person`\
    \ object might look like in memory by examining Figure 22: person Object In Memory.\n\
    \n![](images/00022.gif)*Figure 22: person Object In Memory*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure22.png\n\
    \n### A Closer Look at person Object In Memory\nIn Figure 22, you can see :\n\n\
    1. The base address of the `person` object is `0x00AA01` – that address points\
    \ to where the actual person object (light orange area in Figure 22) is located\
    \ in memory\n2. The `person` object contains a reference type (`Array` object)\
    \ named `children` which points to the base address of the array object at `0x10FF00`\
    \ (light green area in Figure 22.\n3. The bytes of each string in `children` are\
    \ stored in the array object.\n\nYou can examine the code more closely at the\
    \ Plunker: http://plnkr.co/edit/ou3IpPVMhQqNu89fS7J9?p=preview\n\nYou cannot get\
    \ to the values inside the `childrenArray` without going through the `Array` object.\
    \ For example if you want one of those values you can reference it with the following\
    \ JavaScript snippet.\n\n```javascript\nconsole.log(person.children[0]);\n```\n\
    \nThat is because you have no way of referencing the memory which is contained\
    \ within that array without referring to the array itself. It is as if the `Array`\
    \ object has built walls around those values and you have to come to the `Array`\
    \ object to get to the values.\n\nThe same is true for the items which are contained\
    \ within the `person` object. As a matter of fact, we can call an object a container.\
    \ You cannot get to any of the items in the `person` object without doing something\
    \ like the following JavaScript:\n\n```javascript\nconsole.log(person.age);\n\
    ```\n\n### Another Way To State The JavaScript\nThat JavaScript syntax is like\
    \ saying :\n\nGo to the `person` object and look inside (`. ) and find a property\
    \ called `age` and tell me the value that is stored there.\n\n### Natural Language\
    \ Statement Equal to JavaScript\nThis is basically another way of saying:\n\n\
    Look in the internal JavaScript table and find the address of the `person` object.\
    \ It is `0x00AA01`, so go to that address and lookup the address of the `age`\
    \ `Number` (primitive). That address is `0x00AA05` so look at the memory and determine\
    \ what value is stored there.\n\n### The Wrapper Is Also Scope\nThe interesting\
    \ thing about these object wrappers is that they create a scope. They limit the\
    \ scope of how you can view the values which are contained within them.\n\nAs\
    \ a matter of fact Java, C++, and C# use some keywords to indicate whether or\
    \ not a property is viewable outside of an object. You saw that in the sample\
    \ code earlier where I had some statements which began with the word `public`.\n\
    \n## Error Indicates Scope\nYou can see that the scope is limited because if you\
    \ add the following line to your script:\n\n```javascript\nconsole.log(age);\n\
    ```\n\nIn Google Chrome you will receive an error that states: \"age is not defined\"\
    \n\nThat's because you are looking in your application scope and not your `personobject`\
    \ scope.\n\nI showed you all that that you may now better understand functions.\
    \ In JavaScript, functions are objects and they have scope.\n\n## Functions Are\
    \ Objects, They Have Scope\nScope is very important in the programming world.\
    \ And, it can be very confusing in the JavaScript world.\n\nOne of the main reasons\
    \ to use functions in our code is to break them up into manageable pieces we can\
    \ work on. Each function has its own scope and allows us to manage the variables\
