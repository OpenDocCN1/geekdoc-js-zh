    # JavaScript 数组是引用类型


    还有其他引用类型吗？是的，JavaScript 的 `Array` 是引用类型，因为它在内存中的大小是可变的，而且你可以向数组中推送（push）或弹出（pop）项。


    你可以创建一个数组并对其进行推送和弹出操作（动态更改其大小）。这是一个向数组中添加了大量内容的高级脚本。运行它或查看图 11 中的输出：数组包含对象及更多，因为这应该让你思考数组中的项在内存中是动态增长的这一事实。这非常重要。


    ```javascript

