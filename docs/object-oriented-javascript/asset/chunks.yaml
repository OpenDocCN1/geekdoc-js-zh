- fmt: "\n## Value Changed, Because Memory Address Is Same\n\nThat is why the value\
    \ is changed. In the previous example, with the primitive we saw that we had two\
    \ memory locations (one for each primitive). However, since we've passed a reference\
    \ to the container object, we now have one memory address for the primitive (scoped\
    \ to the container object).\n\nThat means when we change the value, we are changing\
    \ the value inside the original container object.\n\nShows step 2 of the process\
    \ – after the function changes the `paramVal` inside the container object.\n\n\
    ![](images/00027.gif) *Figure 27: Passing Reference type: part 2*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure27.png\n\
    \n## Summary of Pass by Reference Versus Pass By Primitive\n\nThe value with the\
    \ box around it is now 34, whereas previously it was 17. When you pass by reference\
    \ (by object) you manipulate the memory of the object that you passing passing.\n\
    \nHowever, when you pass a primitive (by value) you are only passing the value\
    \ and new memory is created to store the value.\n\nNow that you know you will\
    \ get different results when passing Reference types versus passing Primitive\
    \ types you will understand how JavaScript is manipulating these types in memory\
    \ and you will better understand how code executes.\n\nNow our phrasing is going\
    \ to get a bit odd, because we are going to talk about passing a function to a\
    \ function. Doesn't that sound a bit odd? I think it does.\n\n## Passing Functions\
    \ To Functions\n\nNow that you know that you can pass an Object to a function\
    \ and you know that a function is an Object you will be able to understand one\
    \ of the most confusing things in JavaScript and in the Computer Science world:\
    \ passing functions to functions.\n\n### Functions are Reference Types\n\nFirst\
    \ of all, at their roots all functions are objects. That means they are reference\
    \ types. That means when you pass the function, you are passing an address to\
    \ its base address in memory: just like an object.\n\nI repeat this simply because\
    \ this is all tied up with our understanding of scope. The function creates a\
    \ scope for all those variables it wraps, just as an object does. However, when\
    \ you pass the function into a function you will get the base address of the function\
    \ and be able to manipulate the values located at those addresses, which means\
    \ you will alter the object (function) that is passed in to the function. All\
    \ of this means you need to be careful and know exactly what you are attempting\
    \ to do.\n\nHowever, at this point you might wonder, \"why would I ever want to\
    \ pass a function to a function?\" It does seem to be an odd thing to want to\
    \ do, but it is how numerous built-in JavaScript functions work, such as the `setTimeout()`\
    \ function.\n\n## setTimeout – Pass A Function\n\nThe global window object in\
    \ JavaScript has a `setTimeout()` function which you can call to invoke a function\
    \ at a later time.\n\n`setTimeout` takes two parameters. The first one is a function\
    \ and the second is the number of milliseconds to wait before the function is\
    \ called. The function you pass to the `setTimeout` represents the commands you\
    \ want to run when the timer fires after N milliseconds.\n\n```\nsetTimeout(functionName,\
    \ millis);\n```\n\nHere's a quick example you can try or watch.\n\n```javascript\n\
    var el = document.getElementById(\"first\");\nel.innerHTML = \"After 3 seconds\
    \ (3000ms) you will see another message.\";\n\nvar el2 = document.getElementById(\"\
    second\");\nsetTimeout(showAnswer, 3000);\n\nfunction showAnswer() {\n    el2.innerHTML\
    \ = \"It has been approx. 3 seconds, since I was told to run.\";\n    setTimeout(hideAnswer,\
    \ 3000);\n}\n\nfunction hideAnswer() {\n    el2.innerHTML = \"\";\n    setTimeout(showAnswer,\
    \ 3000);\n}\n```\n\nYou can watch a similar sample at my plnkr.co: http://plnkr.co/edit/BJn9UZiYpSWu34ydRCR7?p=preview\n\
    \nI've made this script call the `setTimeout()` method in two different places\
    \ so that after the text appears it will disappear and then when it disappears,\
    \ it will appear again. That way you will be sure to see it all happen.\n\nNow\
    \ you can see at least one reason (and there are many more) to pass a function\
    \ to a function let's go ahead and take a look at how we can create a function\
    \ that takes a function as a parameter and uses it.\n\n## Architectural Principle\
    \ Revealed In Passing Function\n\nThis next example will subtly reveal an architectural\
    \ principle to you while we look at passing a function to a function. Here's the\
    \ initial code.\n\n```javascript\nfunction displayData(item) {\n    alert(item);\n\
    }\n\nfunction mainWork(targetFunc) {\n    var allThings = [];\n    allThings.push(\"\
    thing1\"); allThings.push(\"thing2\"); allThings.push(\"thing3\"); allThings.push(\"\
    thing4\");\n    for (x in allThings) {\n        targetFunc(allThings[x]);\n  \
    \  }\n}\n\nmainWork(displayData);\n```\n\nIf you go to the Plunker for that code\
    \ or run it using RunAnyJS you will immediately learn that it is quite annoying,\
    \ because it uses an `alert()` modal dialog box to provide the user with information.\n\
    \nhttp://plnkr.co/edit/cVmbtIeYVqDXUEuIdLvr?p=preview\n\n## A Callback Function\n\
    \nNotice that the `mainWork` method takes a function that it will later use to\
    \ display the data to the user. This is the computer science concept – albeit\
    \ a very simplistic example – of a callback function. That means, the functionality\
    \ which will be called or used by another function is separated out so it can\
    \ easily be replaced.\n\n### Separating Functionality To Replace Later\n\nSince\
    \ it is a function that we pass in we can replace `displayData` with any compatible\
    \ function.\n\n### Replacing Functionality With Less Testing\n\nNow, instead of\
    \ forcing all of the code in `mainWork` to be retested because we change something\
    \ in it, we just replace `displayData` and insure it works. This is a huge architectural\
    \ principle and gets you closer to designing architectural solutions rather than\
    \ just some scripts together.\n\nLet me show you how it works with the following\
    \ sample. Basically we add a new function named `displayDataViaDiv`. That function\
    \ is simple and says append the value of item to the DIV's text.\n\n```javascript\n\
    function displayDataViaDiv(item) {\n    el.innerHTML += \" \" + item;\n}\n```\n\
    \nFinally, we simply change the original call to `mainWork(displayData)` with\
    \ the new one to call `displayDataViaDiv`. Now it will display the data in the\
    \ DIV instead of those annoying pop-ups. The entire code listing is below so can\
    \ try it. Or run this Plunker and check it out: http://plnkr.co/edit/BKK6RhEmXFnyILPE8f8Y?p=preview\n\
    \n```javascript\nfunction displayData(item) {\n    alert(item);\n}\n\n// initialize\
    \ our div for output\nvar el = document.getElementById(\"first\");\nel.innerHTML\
    \ = \"\";\n\nfunction displayDataViaDiv(item) {\n    el.innerHTML += \" \" + item;\n\
    }\n\nfunction mainWork(targetFunc) {\n    var allThings = [];\n    allThings.push(\"\
    thing1\"); allThings.push(\"thing2\"); allThings.push(\"thing3\"); allThings.push(\"\
    thing4\");\n    for (x in allThings) {\n        targetFunc(allThings[x]);\n  \
    \  }\n}\n\nmainWork(displayDataViaDiv);\n```\n\nA few things to notice about this\
    \ new script are:\n\n1. The old `displayData` function does not have to be deleted\
    \ or altered. That means the old functionality can run as it did. Now, we simply\
    \ implement the new functionality. This is great for ongoing development because\
    \ we don't break old code.\n2. We still have to keep our function's public interface\
    \ the same. This just means that the function still takes an item and that item\
    \ is a string in this case. If we had really wanted to separate this out then\
    \ that type could have been a base type (top of an inheritance chain) and the\
    \ type would implement a specific interface that is known and always the same.\
    \ We'll learn more about this as we look at dependency injection, but I thought\
    \ I might just mention it here.\n\nNow, before closing this chapter I'd like to\
    \ return to that old phrase, *functions are first-class types*.\n"
