- fmt: '

    Now allow me to go back to that somewhat odd statement I made about primitives
    where I stated:


    "memory address indicates where the data (or value) is stored."


    What does that mean?


    To understand it better you have to remember that all data is stored in memory
    at some addressable location. Data has to be stored that way so that other program
    elements can access it. Otherwise, if there was no way to tell where the data
    was stored there would be no way the computer program could manipulate or display
    the data and that data would become inaccessible and useless.


    *You Write JavaScript, You Control Memory Chips*


    Also, keep in mind that down at the bottom, somewhere the value you indicated
    you want to store is actually stored in memory somewhere which has a unique address.
    That''s right, you are actually controlling the switches on a memory chip somewhere
    in the computer simply by typing:


    ```javascript

    var x = 55;

    ```


    Again, all you have to do to create a `Number` in JavaScript is write code like
    the following:


    ```javascript

    var x = 31;

    var z = 56;

    ```


    ## What The JavaScript Interpreter Does


    The JavaScript Interpreter notices that you''ve set the value to a numeric and
    decides that the type will be `Number`. Since it is a `Number`, the Interpreter
    knows that it will take a certain number of bytes to store up to a maximum value.


    It is necessary for the Interpreter to know what type it is because of what is
    really going on behind the scenes – at the lower level of computing. When you
    simply create a `Number` variable (`var counter = 5;`) the Javascript Interpreter
    has to do a some things so the computer''s processor knows what you want to do.


    Here are some of those things the Interpreter does:

    1. find a memory location which has enough contiguous slots to store a `Number`
    type.

    2. Create an entry in an internal lookup table to store the name of your variable
    with the name of your variable – so it can know where your variable is stored
    in memory when you refer to it using the name you defined.


    ### First Step: Find Memory


    To complete the first step, the JavaScript Interpreter has to know the number
    of bytes that a `Number` type takes up in memory.


    ### The Architects of the JavaScript Interpreter


    In the case of a primitive type (`Number`, `Boolean`, `String`, etc) the architects
    who created the JavaScript Interpreter have decided that each of them will take
    a predetermined number of bytes in memory.


    ### JavaScript Primitive Number: 64 bits (8 bytes)


    Currently in JavaScript running in browsers `Number` types get 8 bytes (64 bits)
    of memory space. Some architect made that decision as a trade-off on the max value
    that you can store and the memory it will take up for every `Number` in your program.


    At the lower level where the CPU (main processor) is running and where memory
    is read in bits, it makes things much easier for a low-level programmer when data
    is written in sequential memory addresses.


    #### What It Looks Like


    When you create a new number variable the JavaScript Interpreter goes out and
    finds 8 sequential bytes in the addressable memory space that is available to
    it and sets the bits it finds there to represent the value you have stored.


    ```javascript

    var counter = 27;

    ```


    Interpreter stores `27` at the address `0x00FFC0`.


    ![](images/00004.gif)*Figure 2: Value 27 stored in memory*


    http://NewtonSaber.com/OOJavaScript/Images/Figure2.png


    Take a close look at Figure 2: Value 27 stored in memory.


    Imagine that each rectangle represents a byte of memory. Most modern computers
    only allow you to address one byte of memory (not down to bit level) and so each
    address represents that one byte. In our case when we wrote `var counter = 27;`
    the Interpreter found 8 bytes of memory which starts at address `0x00CCF0` and
    it sets the bits to equal `27`. Also, note that even though we can store the value
    in the first byte, the Interpreter (and web browser and Operating System) actually
    set aside the entire 8 byte block of memory. I''ve set those bytes to have all
    their bits zeroed out to indicate that they are in use. That means nothing else
    can use those bytes or else JavaScript would interpret that to mean that the value
    of `counter` had changed. That memory is solely under the control of JavaScript
    for the purpose of storing values to the `counter` variable.


    ### Reading and Writing That Memory


    After the JavaScript Interpreter remembers that your name of `counter` is how
    it will get to that memory. That way when code further down in your program does
    something like:


    ```javascript

    counter++; // increment the counter.

    ```


    Then it can retrieve the value that is stored there (`27`), add one to that value
    and store it in the same place again so that memory will now look like what you
    see in Figure 3: Value 28 stored at location.


    ![](images/00005.gif)*Figure 3: Value 28 stored at location*


    http://NewtonSaber.com/OOJavaScript/Images/Figure3.png


    ## Value Stored At Address Is Changed


    The point here is that the **value** stored at the memory address has changed.
    Also, now that the Interpreter has stored the address where this data is located,
    you cannot change that address within this program. It is locked. That means you
    can update the value at the address by changing the value of your variable, but
    you can never change the address that the variable points to. Ah, as a matter
    of fact, in other languages (C, C++) there are pointer variables which allow you
    to change the address the variable points to.


    In just a moment we will contrast this to what happens when a Reference type is
    changed and it is very important to your understanding of how JavaScript works.


    ## undefined Will Make More Sense Now


    Now that I''ve explained that, I can explain to you the `undefined` primitive
    value. Remember when I told you that when you set the variable to a value then
    the JavaScript Interpreter decides what type it is?


    Well, suppose you do the following in JavaScript: `var x;`


    What type is `x`?


    It is an `undefined` and we can prove it with the following code:


    ```javascript

    var x;

    console.log("x is " + typeof x + " type");

    ```


    Now, let''s think about what JavaScript has to do in this case. It cannot determine
    the type and yet it has to keep track of the fact that you created a new variable.
    But, what should it''s value be? In many languages (C++, C#, Java – no relation
    to JavaScript) it has a value of `null`. But in JavaScript the architects have
    created this special value of `undefined` for this case.


    In this case, the variable has not had any memory assigned to it. It cannot, because
    the Interpreter has no idea how much memory the thing will take up in memory.


    ## My Guess At How undefined Is Defined


    Here''s my guess at what JavaScript does.


    Somewhere way down in memory, there is one lonely address that has an `undefined`
    type sitting in it. It may look something like what you see in Figure 4: the one
    undefined object in the address space.


    ![](images/00006.gif)*Figure 4: the one undefined object in the address space*


    http://NewtonSaber.com/OOJavaScript/Images/Figure4.png


    Then, when you create a new variable without setting it''s value, the Interpreter
    stores the name of your variable in its lookup table and then sets its value to
    that location (`0x000001`) so that when you ask what type `var x` is, it returns
    the type it is pointing to: `undefined`. That is supposed to indicate to the JavaScript
    developer that the variable has not had its value set yet.


    Okay, so what about null? Okay, so far far we''ve looked at two of the primitive
    types `Number` and `undefined`. Let''s take a quick look at the `Boolean` and
    `String` types, because they are very similar to `Number`, then we''ll look at
    our Reference types and it''ll be a bit easier to understand the `null` type.


    ### Booleans Are Easy, But Remember true/false Case


    A Boolean simply allows you to create a variable that stores only two states:
    true or false.


    You can create a Boolean variable very easily:


    ```javascript

    var isConfigured = false;

    console.log("isConfigured is a " + typeof isConfigured);

    ```


