    # Introduction


    The person who knows how will always have a job.


    The person who knows why will always be his boss. ~Diane Ravitch


    ## Who Is This Book For?


    This book is for advanced beginners of JavaScript and software developers who
    have experience in other languages but little experience in JavaScript. I''ll
    attempt to go fast in this book, always driving the reader''s focus to the main
    point: Object Oriented JavaScript Principles. So, if you don''t even know how
    to declare variable in JavaScript (`var x = 15;`) you are going to get lost fast.


    However, notice that I am not excluding JavaScript developers who have only beginning
    experience. That is because all through the book I attempt to explain everything
    as if you are learning it for the first time. (No, I won''t treat you like a dummy.
    I''ll just explain things in order, with diagrams and in ways you haven''t seen
    them explained before.) That''s why I include Advanced Beginners of JavaScript.
    What is an Advanced Beginner? To me, he is someone who is first and foremost excited
    at the prospect of developing in JavaScript. Passion makes up for a lot of other
    short-comings. In other words, if someone is forcing you to read this book, then
    maybe you should read something else.


    But, if the idea of understanding how Object Oriented Programming in JavaScript
    works and how the JavaScript Interpreter really handles that code excites you
    then I believe you''ll find this book a valuable investment of your time. In an
    attempt to further define The Advanced Beginner, I would say she is also someone
    who has written a few scripts which use arrays, objects and maybe even done some
    event handling. The Advanced Beginner has definitely written his own functions
    and knows the syntax to do so:


    ```javascript

    function <functionName>(<params>) { code;


    code;


    more code;


    }

    ```


    ## What Do You Need To Know To Use This Book?


    ### Getting Around the File System


    You need to know how to get around your file system and of course how to get your
    web browser going. I''ll provide a skeleton HTML file but you''ll need to know
    how to reference a script from the HTML file.


    ```html

    <script src="main.js"></script>

    ```


    ### getElementById?


    You should probably be familiar with:


    ```javascript

    document.getElementById("idName").innerHTML = "some text";

    ```


    The main reason you need to know `getElementById` is because I use it in my samples
    to output example text so you can see the result.


    ### jQuery?


    I might even get lazy at some point and include jQuery in a script or five so
    I can use the jQuery selector:


    ```javascript

    $("#idName").text("some text");

    ```


    So, if you''ve ever used jQuery at all, you are ready. If not, figure out the
    jQuery selector I just showed you and you''ll be fine.


    ### Web Browser Developer''s Tools


    I also use `console.log` and I use Google Chrome a lot with the Developer''s Tools
    which show up at the bottom of the browser window – obviously with the console
    to view output.


    Have you ever used Developer''s Tools in any browser? If you have, then you are
    an advanced beginner. If not, you should learn how to get to them (F12 will get
    you to them in both Chrome and Internet Explorer).


    ### Web Browsers


    You can use any browser you want as long as it''s one of the Big 5 (Microsoft
    Internet Explorer, Google Chrome, Mozilla FireFox, Apple Safari or Opera). Whatever
    version you use must support HTML5, that way we know it is new enough.


    ### Are You Ready?


    If you understand all of what I just said, you are ready for this book and you''ll
    have no trouble getting through it. If you understand 80% you are fine, because
    all of those things are very simple. You can just look them up as we go, it''ll
    just slow you down a bit. If you only understand 25% of what I just said, but
    you are very excited about learning these advanced JavaScript concepts then you''ll
    be okay too. Just expect to have to look up some additional things along the way.


    ## Where Can You Get The Code Samples


    I have made all of the code samples avaialable at : http://NewtonSaber.com/OOJavaScript/OOamples.zip


    I am also building this scripts at plnkr.co (Plunker) so you may click the associated
    link in the book and see the sample run before your eyes.


    ### Plunker


    Just keep the following in mind when examining the Plunker code.


    The HTML and JavaScript are split into different files so when you click the link
    to one of the Plunker samples you''ll see something like what is shown in Illustration
    1.


    The sample will display the HTML by default, but to see the associatd JavaScript
    code, please click `script.js` (indicated by the red arrow in the illustration).


    ![](images/00002.jpeg)*Illustration 1: Plunker sample*


    http://NewtonSaber.com/OOJavaScript/Images/Illus1.png


    ### Editing Plunker Scripts


    Feel free to run and edit any of the Plunker scripts you find in this book. When
    you alter them and save them it doesn''t do any harm to the originals.


    ## Why Did I Write This Book?


    There are a few reasons I decided to write this book:


    1. I am an old C++ developer so I''ve been a little closer to the metal when I''ve
    developed software in the past than the "safe" distance JavaScript enforces. I
    find it interesting, however, that understanding how objects (reference types)
    are created and stored in memory versus how primitives (intrinsic types, like
    Number) are stored can open up a JavaScript developer''s understanding of the
    entire JavaScript Interpreter and what is really going on. I find all of this
    fascinating (yet another reason I wanted to write this book).

