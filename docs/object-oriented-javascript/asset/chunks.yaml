  trans: "\n\n## 值发生了变化，因为内存地址相同\n\n这就是值发生变化的原因。在在上一个示例中，对于基本数据类型，我们看到有两个内存位置（每个基本数据类型一个）。然而，由于我们传递的是容器对象的引用，现在该基本数据类型只有一个内存地址（作用域于容器对象）。\n\
    \n这意味着当我们更改值时，我们正在更改原始容器对象内部的值。\n\n显示了该过程的第 2 步——在函数更改容器对象内部的 `paramVal` 之后。\n\
    \n![](img/00027.gif) *图 27：传递引用类型：部分 2*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure27.png\n\
    \n## 引用传递与基本值传递的总结\n\n带框中的值现在是 34，而之前是 17。当你通过引用（通过对象）传递时，你操作的是你正在传递的对象的内存。\n\n\
    然而，当你传递一个基本数据类型（按值传递）时，你只是传递了值，并会创建新的内存来存储该值。\n\n现在你已经知道传递引用类型与传递基本数据类型会得到不同的结果，这将帮助你理解\
    \ JavaScript 如何在内存中处理这些类型，并让你更好地理解代码的执行。\n\n现在我们的措辞将变得有点奇怪，因为我们将讨论将一个函数传递给另一个函数。这听起来有点奇怪吗？我觉得确实是。\n\
    \n## 将函数传递给函数\n\n既然你已经知道可以向函数传递一个对象，并且知道函数也是一个对象，你将能够理解 JavaScript 以及计算机科学领域中最令人困惑的事情之一：将函数传递给函数。\n\
    \n### 函数是引用类型\n\n首先，从根本上说所有的函数都是对象。这意味着它们是引用类型。这意味着当你传递函数时，你传递的是它在内存中基地址的地址：就像对象一样。\n\
    \n我重复这一点，是因为这与我们对作用域的理解密切相关。函数为它所封装的所有变量创建一个作用域，就像对象一样。然而，当你将函数传递给另一个函数时，你将获得函数的基地址，并能够操作位于这些地址上的值，这意味着你修改了传入函数的对象（函数）。这一切意味着你需要小心，并准确地知道你正在尝试做什么。\n\
    \n然而，此时你可能会在想，“我为什么要将一个函数传递给另一个函数呢？”这看起来确实像是一件奇怪的事，但它是许多 JavaScript 内置函数的工作方式，例如\
    \ `setTimeout()` 函数。\n\n## setTimeout – 传递函数\n\nJavaScript 中的全局 `window` 对象有一个\
    \ `setTimeout()` 函数，你可以调用它在稍后的时间执行函数。\n\n`setTimeout` 接受两个参数。第一个是函数，第二个是在调用函数之前等待的毫秒数。你传递给\
    \ `setTimeout` 的函数代表了在 N 毫秒后计时器触发时想要运行的命令。\n\n```\nsetTimeout(functionName, millis);\n\
    ```\n\n这是一个你可以尝试或观看的快速示例。\n\n```javascript\nvar el = document.getElementById(\"\
    first\");\nel.innerHTML = \"3 秒后 (3000ms) 你将看到另一条消息。\";\n\nvar el2 = document.getElementById(\"\
    second\");\nsetTimeout(showAnswer, 3000);\n\nfunction showAnswer() {\n    el2.innerHTML\
    \ = \"从我被要求运行以来已经过了大约 3 秒。\";\n    setTimeout(hideAnswer, 3000);\n}\n\nfunction\
    \ hideAnswer() {\n    el2.innerHTML = \"\";\n    setTimeout(showAnswer, 3000);\n\
    }\n```\n\n你可以在我的 plnkr.co 上查看类似的示例：http://plnkr.co/edit/BJn9UZiYpSWu34ydRCR7?p=preview\n\
    \n我让这个脚本在两个不同的地方调用了 `setTimeout()` 方法，以便文本出现后它会消失，当它消失后，它会再次出现。这样你就能确保看到整个过程。\n\
    \n现在你至少可以看到一个原因（还有很多其他原因）将一个函数传递给另一个函数，让我们来看看如何创建一个接受函数作为参数并使用它的函数。\n\n## 在传递函数中揭示的架构原理\n\
    \n在我们查看将函数传递给另一个函数时，接下来的示例将微妙地向你揭示一个架构原理。这是初始代码：\n\n```javascript\nfunction displayData(item)\
    \ {\n    alert(item);\n}\n\nfunction mainWork(targetFunc) {\n    var allThings\
    \ = [];\n    allThings.push(\"thing1\"); allThings.push(\"thing2\"); allThings.push(\"\
    thing3\"); allThings.push(\"thing4\");\n    for (x in allThings) {\n        targetFunc(allThings[x]);\n\
    \    }\n}\n\nmainWork(displayData);\n```\n\n如果你去该代码的 Plunker 或使用 RunAnyJS 运行它，你会立即发现这相当烦人，因为它使用\
    \ `alert()` 模态对话框向用户提供信息。\n\nhttp://plnkr.co/edit/cVmbtIeYVqDXUEuIdLvr?p=preview\n\
    \n## 回调函数\n\n注意 `mainWork` 方法接收一个函数，稍后将使用该函数向用户显示数据。这就是计算机科学中的概念——尽管这是一个非常简单的示例——**回调函数**。这意味着，被另一个函数调用或使用的功能被分离出来，以便方便地替换。\n\
    \n### 分离功能以备后替换\n\n由于我们传递的是函数，我们可以将 `displayData` 替换为任何兼容的函数。\n\n### 无需测试替换功能\n\
    \n现在，我们不需要因为修改了 `mainWork` 中的某些内容而对其进行重新测试，只需要替换 `displayData`。这是一种巨大的架构原理，让你更接近设计解决方案而不是堆砌脚本。\n\
    \n让我给你展示它在以下示例中是如何工作的。基本上我们添加了一个名为 `displayDataDiv` 的新函数。该函数非常简单，并将 `item` 的值添加到\
    \ DIV 中。\n\n```javascript\nfunction displayDataDiv(item) {\n    el.innerHTML +=\
    \ \" \" + item;\n}\n```\n\n最后，我们只需将原始的 `mainWork(displayData)` 调用更改为新的 `displayDataDiv`。现在它将在\
    \ DIV 中显示数据，而不是那些烦人的弹窗。完整的代码列表如下，你可以尝试一下。或者运行这个 Plunker：http://plnkr.co/edit/BKK6RhEmFnyIL8f8Y?p=preview\n\
    \n```javascript\nfunction displayData(item) {\n    alert(item);\n}\n\n// 初始化输出的\
    \ div\nvar el = document.getElementById(\"first\");\nel.innerHTML = \"\";\n\n\
    function displayDataDiv(item) {\n    el.innerHTML += \" \" + item;\n}\n\nfunction\
    \ mainWork(targetFunc) {\n    var allThings = [];\n    allThings.push(\"thing1\"\
    ); allThings.push(\"thing2\"); allThings.push(\"thing3\"); allThings.push(\"thing4\"\
    );\n    for (x in allThings) {\n        targetFunc(allThings[x]);\n    }\n}\n\n\
    mainWork(displayDataDiv);\n```\n\n关于这个新脚本有几点需要注意：\n\n1. 旧的 `displayData` 函数不需要删除或修改。这意味着旧的功能可以像以前一样运行。现在，我们只需实现新功能即可。这对于持续开发非常好，因为我们不会破坏旧代码。\n\
    2. 我们仍然需要保持函数的公共接口不变。这意味着该函数仍然接收一个 item，在这种情况下该 item 是一个字符串。如果我们真的想将其分离出来，那么该类型可以是基类型（继承链的顶端），并且该类型实现一个特定的、始终不变的接口。我们将在查看依赖注入时学习更多更多内容，但我想在这里简单提一下。\n\
    \n现在，在结束本章之前，我想回到那个老短语，*函数是一类等公民类型*。\n\n"
- fmt: "\nIn other languages, functions are not objects nor do they really have their\
    \ own type. So in those languages functions are not considered first-class types.\
    \ They are second-class citizens who are not formally recognized.\n\nAs a matter\
    \ of fact, in C++, Java, and C# they aren't types so it is difficult or impossible\
    \ to pass a function to a function.\n\nC++ (along with C) implemented a pointer\
    \ so you could pass a function to a function. A pointer is C++ is simply an address\
    \ which you can pass. That address may `point to` any type (integer, string, or\
    \ function). However, the syntax was quite ugly. For example if you had a function\
    \ named `getDouble`, which returned nothing (`void`) and took an integer your\
    \ function pointer would look like the following:\n\n```cpp\nvoid(*ptrName)(int*);\
    \ // this creates the ptrName variable\n\n// to set the pointer to point to the\
    \ function you'd do this\n\nptrName = &getDouble;\n```\n\nThat last line with\
    \ the `&` (ampersand) means, get the address where the function named `getDouble`\
    \ exists in memory and save it in the `ptrName` variable.\n\nThat's about enough\
    \ of that ugliness.\n\n## JavaScript Makes It Easier\n\nI just wanted to mention\
    \ that JavaScript makes it a whole lot easier since you can pass the name of the\
    \ function as the function parameter.\n\nNow that you understand all of these\
    \ very important, but rarely explained details about Objects in memory, it will\
    \ now be much easier to understand how we can use JavaScript functions to create\
    \ templates (almost like classes in Java, C++ and C#) for common UDT (User Defined\
    \ Types) that we want to re-use in our applications.\n\n## Create Template Objects\
    \ For Instantiation\n\nFirst I'll show you the JavaScript you write to create\
    \ a simple template object and then I'll show you how to instantiate it.\n\n```javascript\n\
    function Person(firstName, lastName, startDate, workTitle) {\n    this.firstName\
    \ = firstName; \n    this.lastName = lastName; \n    this.startDate = startDate;\
    \ \n    this.workTitle = workTitle; \n    this.empId = getEmployeeId(); \n   \
    \ function getEmployeeId() {\n        return Math.ceil(Math.random() * 5000000);\
    \ \n    }\n}\n```\n\nTo use the template we just created we use the JavaScript\
    \ `new` operator. The code looks like the following:\n\n```javascript\nvar employee\
    \ = new Person(\"elmer\", \"fudd\",\"2012-03-14\",\"manager\");\n```\n\nYou can\
    \ see a simple script which uses this template object at: http://plnkr.co/edit/GWAq6VGkOyUOulVT8uys?p=preview\n\
    \nBecause you understand how functions (and objects) are stored in memory, it\
    \ will be much easier for you to understand what is going on here. There are just\
    \ a couple of things you need to know about:\n\n1. the `this` keyword\n2. the\
    \ `new` keyword\n\nThose are confusing concepts when you haven't seen an object\
    \ in memory, but again, since you have it'll all come together now.\n\nOkay, so\
    \ let's take a look at the template object in memory. It'll look something like\
    \ what you see in Figure 28: Function As An Object Template.\n\n![](images/00028.gif)\
    \ *Figure 28: Function As An Object Template*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure28.png\n\
    \nThere are a number of things to examine closely in Figure 28. 1. The `Person`\
    \ contains five properties and 1 function (shown in orange).\n\n2. I'm showing\
    \ the string types as references, as they most likely are implemented that way\
    \ since their sizes in memory fluctuate. (You'll see these go from null values\
    \ to addresses in the next image.)\n3. I've initialized `empId` to 0 and each\
    \ of the references to null although I am not sure exactly what values web browsers\
    \ / JavaScript initialize these to. Keep in mind this is a simplified model to\
    \ increase our understanding, not turn us into Computer Scientists.\n4. This is\
    \ a view of the `Person` function before we new up another object based upon this\
    \ template.\n\nNow, let's take a look at what happens in memory after the `employeeobject`\
    \ is instantiated with the `new` operator.\n\n## JavaScript new Operator\n\nThe\
    \ `new` operator tells JavaScript that we want a new slice of memory that is not\
    \ used by any other object.\n\n### Create Person Object At New Memory Address\n\
    \nWhen the JavaScript Interpreter comes across the following line of code it knows\
    \ that it is not copying the `Person` object into a new variable, but it will\
    \ create an entirely new `Person Object` at a new memory address.\n\n```javascript\n\
    var employee = new Person(\"elmer\", \"fudd\",\"2012-03-14\",\"manager\");\n```\n\
    \nInstead of copying the address of the `Person` function into our `employee`\
    \ variable, the Interpreter will now take the `Person` object and create a new\
    \ on at another memory location and return that address. That means, the memory\
    \ will now look something like what you see in Figure 29: New Object Means New\
    \ Memory.\n\n![](images/00029.gif) *Figure 29: New Object Means New Memory*\n\n\
    http://NewtonSaber.com/OOJavaScript/Images/Figure29.png\n\nThe blue area on the\
    \ right in Figure 29 represents the object at the moment it is instantiated and\
    \ before it is initialized (by the values sent in the parameters). You can see\
    \ that there is a new chunk of memory set aside for this new object. Of course,\
    \ from our previous investigation you now understand that means you have a new\
    \ entity in memory instead of just a another reference to the same memory the\
    \ `Person` template points to. This is a significant difference in your JavaScript\
    \ programs, since you will not be overwriting memory that is used by another object.\n\
    \n## What About this?\n\nThe initialization is where the `this` operator comes\
    \ in play. Now that new memory has been set aside for this object the object has\
    \ been instantiated it is common to be ready to represent a real-world thing,\
    \ such as an employee with a name and `empId`.\n\n## Construction: Automatically\
    \ Running Code\n\nWhen the new object is created a one-time construction process\
    \ occurs the code which is wrapped in another function.\n\nIn our case the code\
    \ that automatically runs is the following:\n\n```javascript\nthis.firstName =\
    \ firstName; \nthis.lastName = lastName; \nthis.startDate = startDate; \nthis.workTitle\
    \ = workTitle; \nthis.empId = getEmployeeId();\n```\n\nJust as it does in a normal\
    \ function, the code runs from the top down, unless it is wrapped in another function\
    \ – as in the case with our `getEmployeeId()` function.\n\nAlso, consider another\
    \ point: there is no way to run the lines above, after the object is instantiated.\n\
    \n### Constructor Runs Only Per Application\n\nDo you see why? The answer is because\
    \ there is no way to access those lines again. You cannot refer specifically to\
    \ those lines from anywhere else in the program. This becomes the constructor\
    \ code for our new object which is built off the template object.\n\nIn contrast,\
    \ notice that you can run the `getEmployeeId()` function any time simply by writing\
    \ the JavaScript code:\n\n```javascript\nemployee.getEmployeeId(); // returns\
    \ random number\n```\n\nTake a look at Figure 30: New Object Initialized Using\
    \ this Operator and you'll see the initialized employee object in memory, while\
    \ the original template object has not been altered.\n\n![](images/00030.gif)\
    \ *Figure 30: New Object Initialized Using this Operator*\n\nhttp://NewtonSaber.com/OOJavaScript/Images/Figure30.png\n\
    \nI set the value of the `empId` to 7 just for our example. The function that\
    \ sets that value simply generates a random value between 1 and 5,000,000.\n\n\
    The `this` operator is really a short-hand way that JavaScript allows you to use\
    \ to refer to the base memory address. When you call `this` inside the object,\
    \ you are saying, go ahead and look at this object and add a property named `firstName`\
    \ and set it to the value that came in (named `firstName`).\n\n### Reference From\
    \ Inside An Object\n\nYou need the `this` operator, because there would be no\
    \ other way to refer to the object that you are currently inside of. Outside the\
    \ object we refer to it as the `employee` object, but within the object itself\
    \ we refer to it as the `this`.\n"
