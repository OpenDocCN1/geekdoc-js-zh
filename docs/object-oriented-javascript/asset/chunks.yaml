  raw: '**Definition** : Instantiate means to allocate memory and construct the object
    in the physical memory. It means the object is a valid structure residing in memory
    and (depending upon accessibility) is accessible and usable to your program.


    In C++, Java, C# you have the newkeyword which allows you to create a new object
    that exists at a new memory address. Whenever you want a new one, you simply tell
    the compiler : person variableName = new person()and you get one.


    ## **JavaScript''s new Operator**


    JavaScript does have a new Operator, however it does not have the concept of a
    class template. Fortunately, in JavaScript, we can mimic what I showed you in
    C# sample above, by using functions.


    That is because functions are actually objects. Since functions are objects, let''s
    talk about another aspect of objects for a moment.


    ## **Objects Have Their Own Memory**


    Remember that objects have their own memory space. Another way to say that is
    objects may contain other primitive types (Number, Boolean, etc) and other reference
    types (Objects, Arrays, etc) and you cannot get to those without going through
    the instantiated object.


    In code it looks like the following:


    person.firstName = "Wilma";


    JavaScript does not provide any other way to get to firstName, except to go through
    the instantiated person object. The object memory is segregated.


    ## **Objects Are Memory Wrappers**


    Another way to say this, might be to say that objects are memory wrappers. Let''s
    take a look at a picture of memory again. This time we''ll create a more advanced
    object which contains a Number, String, Boolean and an Array (Reference type).


    Here''s the JavaScript code:


    var person = {};


    person.firstName = "Ted"; person.age = 53;


    person.hasChildren = true; person.children = [];


    person.children.push("sam"); person.children.push("sara"); person.children.push("sandy");


    You can see what the person object might look like in memory by examining Figure
    22: person Object In Memory.


    ![](images/00022.gif)*Figure 22: person Object In Memory*


    http://NewtonSaber.com/OOJavaScript/Images/Figure22.png


    ***A Closer Look at person Object In Memory***


    In Figure 22, you can see :


    1\. The base address of the person object is 0x00AA01 – that address points to
    where the actual person object (light orange area in Figure 22) is located in
    memory


    2\. The person object contains a reference type (Array object) named childrenwhich
    points to the base address of the array object at 0x10FF00 (light green area in
    Figure 22.


    3\. The bytes of each string in childrenare stored in the array object.


    You can examine the code more closely at the Plunker: http://plnkr.co/edit/ou3IpPVMhQqNu89fS7J9?p=preview


    You cannot get to the values inside the childrenArray without going through theArrayobject.
    For example if you want one of those values you can reference it with the following
    JavaScript snippet.


    console.log(person.children[0]);


    That is because you have no way of referencing the memory which is contained within
    that array without referring to the array itself. It is as if the Array object
    has built walls around those values and you have to come to the Array object to
    get to the values.


    The same is true for the items which are contained within the person object. As
    a matter of fact, we can call an object a container. You cannot get to any of
    the items in theperson object without doing something like the following JavaScript:


    console.log(person.age);


    ***Another Way To State The JavaScript***


    That JavaScript syntax is like saying :


    Go to the person object and look inside (dot .) and find a property called age
    and tell me the value that is stored there.


    ***Natural Language Statement Equal to JavaScript***


    This is basically another way of saying:


    Look in the internal JavaScript table and find the address of the person object.
    It is 0x00AA01, so go to that address and lookup the address of the age Number
    (primitive). That address is 0x00AA05 so look at the memory and determine what
    value is stored there.


    ***The Wrapper Is Also Scope***


    The interesting thing about these object wrappers is that they create a scope.
    They limit the scope of how you can view the values which are contained within
    them.


    As a matter of fact Java, C++, and C# use some keywords to indicate whether or
    not a property is viewable outside of an object. You saw that in the sample code
    earlier where I had some statements which began with the word public.


    ## **Error Indicates Scope**


    You can see that the scope is limited because if you add the following line to
    your script:


    console.log(age);


    In Google Chrome you will receive an error that states: "age is not defined"


    That''s because you are looking in your applicationscope and not yourpersonobject
    scope.


    I showed you all that so that you may now better understand functions. In JavaScript,
    functions are objects and they have scope.


    ## **Functions Are Objects, They Have Scope**


    Scope is very important in the programming world. And, it can be very confusing
    in the JavaScript world.


    One of the main reasons to use functions in our code is to break them up into
    manageable pieces we can work on. Each function has its own scope and allows us
    to manage the variables they manipulate so we can be sure that something else
    is not manipulating them behind our backs.


    That is how scope helps us as programmers. We''ll talk more about scope as we
    look closer at functions. Functions are also a type in JavaScript.


    ## **What Does First-class Type Mean?**


    It just so happens that functions are also considered First-class types in JavaScript.


    If you read around about JavaScript you will probably stumble upon people saying
    "functions are first-class objects" or "functions are first-class types". However,
