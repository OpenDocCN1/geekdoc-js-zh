    ***Editing Plunker Scripts***


    Feel free to run and edit any of the Plunker scripts you find in this book. When
    you alter them and save them it doesn''t do any harm to the originals.


    ## **Why Did I Write This Book?**


    There are a few reasons I decided to write this book:


    1\. I am an old C++ developer so I''ve been a little closer to the metal when
    I''ve developed software in the past than the “safe” distance JavaScript enforces.
    I find it interesting, however, that understanding how objects (reference types)
    are created and stored in memory versus how primitives (intrinsic types, like
    Number) are stored can open up a JavaScript developer''s


    understanding of the entire JavaScript Interpreter and what is really going on.
    I find all of this fascinating (yet another reason I wanted to write this book).'
