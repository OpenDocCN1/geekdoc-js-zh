    # 引言


    知道如何做的人永远会有工作做。


    知道为什么要做的人将永远是他的老板。 ~戴安·拉维奇


    ## 这本书是给谁看的？


    本书适用于 JavaScript 的高级初学者，以及具有其他语言经验但 JavaScript 经验较少的软件开发者。我尝试在书中保持进度，始终引导读者的注意力在核心点上：面向对象的
    JavaScript 原则。所以，如果你甚至不知道如何在 JavaScript 中声明变量（`var x = 15;`），你很快就会迷失方向。


    然而，请注意，我并没有排除只有初级经验的 JavaScript 开发者。这是因为在整本书中，我尝试像你是第一次学习它一样来解释一切。（不，我不会把你当白痴。我只是按照顺序、结合图表用你以前从未见过的方式来解释这些。）这就是为什么我包含了
    JavaScript 高级初学者。什么是高级初学者？对我来说，他首先是一个对开发 JavaScript 前景感到兴奋的人。热情可以弥补许多其他缺点。换句话说，如果有人强迫你读这本书，那么你可能应该读其他的。


    但是，如果理解 JavaScript 中面向对象编程的工作原理以及 JavaScript 解释器究竟如何处理这些代码让你感到兴奋，那么我相信你会发现这本书是对你时间非常有价值的投资。为了进一步定义“高级初学者”，我会说她也是那些写过几个使用数组、对象甚至可能进行过事件处理的脚本的人。高级初学者绝对写过自己的函数，并且知道编写这些函数的语法：


    ```javascript

    function <functionName>(<params>) { code;


    code;


    more code;


    }

    ```


    ## 使用本书你需要了解什么？


    ### 熟悉文件系统


    你需要了解如何在你的文件系统中导航，当然还包括如何启动你的 Web 浏览器。我会提供一个骨架 HTML 文件，但你需要知道如何从 HTML 文件引用脚本。


    ```html

    <script src="main.js"></script>

    ```


    ### getElementById?


    你可能应该熟悉：


    ```javascript

    document.getElementById("idName").innerHTML = "some text";

    ```


    你需要了解 `getElementById` 的主要原因是因为我在示例中使用它来输出示例文本，以便你可以看到结果。


    ### jQuery?


    我可能在某个时候会偷懒，在几个脚本中包含 jQuery，这样我就可以使用 jQuery 选择器：


    ```javascript

    $("#idName").text("some text");

    ```


    所以，如果你曾经用过 jQuery，你就准备好了。如果没有，搞清楚我刚才向你展示的 jQuery 选择器你就没问题了。


    ### Web 浏览器开发者工具


    我还会使用 `console.log`，并且经常使用 Google Chrome 的开发者工具，这些工具显示在浏览器窗口的底部——显然有一个查看输出的控制台。


    你曾经在任何浏览器中使用开发者工具吗？如果你用过，那么你就是一个高级初学者。如果没有，你应该学习如何进入它们（在 Chrome 和 Internet Explorer
    中，按 F12 即可进入）。


    ### Web 浏览器


    你可以使用任何你想要的的浏览器，只要它是五大浏览器之一（Microsoft Internet Explorer、Google Chrome、Mozilla
    Firefox、Apple Safari 或 Opera）。无论你使用哪个版本，必须支持 HTML5，这样我们才知道它足够新。


    ### 你准备好了吗？


    如果你理解我刚才说的所有内容，你就准备好读这本书，并且阅读过程中不会遇到困难。如果你理解了 80%，也没关系，因为所有这些都非常简单。你可以边学边查阅，这只会稍微放慢你的速度。如果你只理解了我刚才所说的
    25%，但你对学习这些高级 JavaScript 概念非常兴奋，那么你也可以的。只需要预料在过程中需要查找一些额外的内容即可。


    ## 在哪里可以获得代码示例


    我已将所有的代码示例发布在：http://NewtonSaber.com/OOJavaScript/OOamples.zip


    我还在 plnkr.co (Plunker) 上构建这些脚本，所以你可以点击书中的相关链接，并在眼前看到示例运行。


    ### Plunker


    在查看 Plunker 代码时，请记住以下几点。


    HTML 和 JavaScript 分在不同的文件中，所以当你点击一个 Plunker 示例的链接时，你会看到类似于图 1 所示的内容。


    示例默认显示 HTML，但要查看相关的 JavaScript 代码，请点击 `script.js`（如插图中红色箭头所示）。


    ![](img/00002.jpeg)*图 1：Plunker 示例*


    http://NewtonSaber.com/OOJavaScript/Images/Illus1.png


    ### 编辑 Plunker 脚本


    随意运行和编辑你在书中找到的任何 Plunker 脚本。当你修改并保存它们时，不会对原始文件产生任何影响。


    ## 我为什么要写这本书？


    我决定写这本书有几个原因：


    1. 我是一个老牌 C++ 开发者，因此在过去开发软件时，我比硬件比 JavaScript 强制执行的“安全”距离更接近底层。然而，我发现理解对象（引用类型）如何在内存中被创建和存储，与原始类型（内建类型，如
    Number）如何存储，可以开启 JavaScript 开发者对整个 JavaScript 解释器以及真实发生情况的理解。我发现这一切非常迷人（这也是我想写这本书的另一个原因）。


