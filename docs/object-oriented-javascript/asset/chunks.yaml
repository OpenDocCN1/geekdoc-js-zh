    # Chapter 1


    ### Setting the Foundation: Types


    Because of the way the mind works, it is easiest to learn when we focus on one
    thing at a time. However, when taking on a subject as large as `JavaScript` which
    has been in use since it was originally created by Brendan Eich for use in `Netscape
    Navigator 2.0` back in September of 1995, it can be a challenge to know what to
    focus on first. Additionally, if you don''t get your basic foundations set in
    place it can be much more difficult to learn advanced concepts later. That''s
    why I want to take you back to a very basic concept which underlies everything
    that goes on in `JavaScript`: The Type System.


    At first look, you may think focusing on the type system is too simple and boring,
    but I promise I''ll keep it short and lively and when we''re done you''ll understand
    how `JavaScript` works better than ever.


    ## How JavaScript Handles Types


    In `JavaScript` – as in many high-level languages – all types can be organized
    into two categories:


    1. Primitive types -- memory address indicates where the data (or value) is stored.

    2. Reference types -- memory address indicates where there object is stored.


    * This statement may be confusing. I''ll explain this in just a few moments.


    First, let''s take a look at the primitives.


    There are only five primitive types in `JavaScript` and they are:

    1. `Number`

    2. `Boolean`

    3. `String`

    4. `undefined`

    5. `null`


    Those last two probably look a little odd to you and we''ll get to them, but first
    let''s take a look at the first three and learn why it is important to understand
    that all of these are primitive types. Then, we''ll delve into Reference Types
    and how they are different. The knowledge of the contrast of these two types will
    actually help you understand how the `JavaScript Interpreter` – which runs all
    of your `JavaScript` code – works and how that creating `Objects` (Reference types)
    is so much different than creating these Primitive types.


    Creating any one of the Primitive types is very easy in `JavaScript`.


    Just type the `var` keyword followed by the name you want to refer to your variable
    and then set it to some value. `var counter = 0;`, `var Configured = false;`,
    `var firstName = "David";`


    ### typeof Operator Indicates Type From JavaScript Interpreter


    We can use `typeof` operator to determine what type `JavaScript Interpreter` believes
    a variable is. Of course, whatever `JavaScript Interpreter` believes your variable
    type to be is what it is.


    Here''s some code to show how `typeof` operator works:


    ```javascript

    var counter = 0;

    var Configured = false;

    var firstName = "David";


    console.log("counter is a " + typeof counter);

    console.log("isConfigured is a " + typeof Configured);

    console.log("firstName is a " + typeof firstName);

    ```


    After you run this code and view the console output you should see the following:


    counter is a number

    isConfigured is a boolean

    firstName is a string


    ### See It Run Plunker


    Plunker provides a way to see JavaScript samples run, so I''ll add these scripts
    there. If you want to see this first script''s code and see it run simply go to
    the Plunker I created at: http://plnkr.co/edit/MHEokt?p=preview


    ### Easy Way To Run Code Examples: RunAnyJS


    If you''d like to run the code example above without having to create an HTML
    page and include the JavaScript and save the files, you can point your browser
    at: http://uncoveryourlife.com/learnjs/runanyjs.htm


    You can then copy the JavaScript code above into the textarea on that page and
    click the `[Update Script]` button – to indicate that you''ve added a script you
    want to run. Then after that simply click the `[Run Script]` button and the code
    will run.


    You can see what it looks like in Figure 1: Chrome RunAnyjs.htm with Console window.


    ![](images/00003.jpeg)


    *Figure 1: Chrome RunAnyjs.htm with Console window* http://NewtonSaber.com/OOJavaScript/Images/Figure1.png
