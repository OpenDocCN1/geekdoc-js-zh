    - [Chapter 7: JavaScript Arrays](#part0000_split_010.html_ch7)……………………43

    - [Chapter 8: JavaScript Conditions (if, else & switch) and Loops (for, while
    & do while)](#part0000_split_011.html_ch8).46

    - [Summary](#part0000_split_012.html_summary)…………………………………………………61


    ## Introduction

    JavaScript is one the language which helps you make browser to do what you want
    to do. This is easy language to learn and I am going to teach you now. My language
    will be user friendly and I will try to tell difficult stuffs in easy language
    with examples. Let’s move on one by one with JavaScript lessons. This is 3 days
    basic JavaScript Learning Course.


    Before starting JavaScript, I am assuming that you have at least basic knowledge
    of `HTML` & `CSS`. If you don’t have knowledge of `HTML` & `CSS`, then you should
    go and study that first via online tutorials. You may be able to learn basic `HTML`
    & `CSS` in 2-3 days.


    - Day 1 = Learn Chapter 1 & 2

    - Day 2 = Learn Chapter 3, 4 & 5

    - Day 3 = Learn Chapter 6, 7 & 8


    ## Chapter 1: JavaScript Basics

    JavaScript can change HTML Contents. If you are PHP developer and if you want
    to get done some work without page loads or you want `HTML` & `CSS` to perform
    work then you will need JavaScript.


    ### `<script>` Tag

    JavaScript can be placed inside body and head tag. The JavaScript codes should
    be inside `<script>` and `</script>` tags.


    ```html

    <script>

    document.getElementById("demo").innerHTML = "My First JavaScript Code";

    </script>

    ```


    ### JavaScript Events

    JavaScript codes are triggered on events. Events are performed when a person perform
    an event. There are many events provided by browser like `onclick`, `onmouseover`,
    `onkeyup`, `onkeydown`, `ondoubleclick` and many more. When any of events performs
    then JS Codes triggered and do something according to codes.


    ```html

    <button onclick="myFunction()">Press Me!</button>

    ```

    Explanation – here, `onclick` is event and `myFunction()` is JS function.


    ### JavaScript Function

    JavaScript block of codes which is inside `<script>` and `</script>` tags which
    are used to perform some work is called function.


    ```html

    <script>

    function myFunction(){

    document.getElementById("demo").innerHTML = "My First JavaScript Code";

    }

    </script>

    ```


    ### Best Place for JavaScript

    Explanation – `myFunction()` is inside `script` tags.


    ```html

    <script>

    function myFunction(){

    document.getElementById("demo").innerHTML = "My First JavaScript Code";

    }

    </script>

    ```


    ### External Files

    Explanation – `myFunction()` is inside `script` tags.


    ```html

    <script src="newScript.js"></script>

    ```


    ## Chapter 2: JavaScript Output/Display Codes

    JavaScript uses four ways to output.


    #### 1st Way: `document.write()`

    It is used to write anything in the webpage.


    ```html

    <script>

    function add(){

    document.write(6);

    }

    </script>

    ```

    Explanation – When you click the button, `document.write()` shows output.


    #### 2nd Way: `window.alert()`

    It is used to display message in alert box.


    ```html

    <script>

    window.alert("Warning");

    </script>

    ```

    Explanation – When you open the webpage, `window.alert()` contains "Warning".


    #### 3rd Way: `innerHTML`

    This method is used for writing inside HTML element like paragraph, `textarea`
    and etc.


    ```html

    <script>

    function something(){

    document.getElementById("demo").innerHTML = "Paragraph is filled";

    }

    </script>

    ```

    Explanation – When you click the button, `document.getElementById()` takes ID
    and writes inside through `innerHTML`.


    #### 4th Way: `console.log()`

    It is used to write inside console, click on F12 key in your firefox, chrome,
    IE browser.


    ```html

    <script>

    console.log(2+2);

    </script>

    ```

    Explanation – Click F12 key and go to console tag to see results.


    ## Chapter 3: JavaScript Variables, Statements, Comments & Keywords

    ### JavaScript Variables

    Variables are used to stored data in any language. In JavaScript variables do
    the same like C and other high languages. Variables are stored in the form of
    data types like `int`, `str` and etc. however at JS, you can use `var` keyword
    for all types of data types.


    Writing String: For writing string, you need to use single or double quote.


    Example:

    ```javascript

    var x = "This is a Boy.";

    var y = ''This is a Girl.'';

    ```

    Note: semi colon `;` is used to end the line.


    Writing Numeric: For writing numeric, you need not to use double or single quotes.
    If you use it then JS will take it as string.


    Example:

    ```javascript

    var x = 8;

    var y = 6;

    var z = x+y;

    ```


    ### JavaScript Statements

    JavaScript statements are set of instructions which are executed by browser.


    Example1: Change HTML Content

    Think of the scenario; if you want to add some content on anywhere in HTML by
    clicking one button. You can do this work easily through PHP but the page will
    be reloaded. With the help of JavaScript you can do this work without page reloads.


    ```html

    <<html>

    <body>

    <h1>Change Content of Box</h1>

    <p id="demo">JavaScript will change HTML content.</p>

    <button type="button" onclick="document.getElementById(''demo'').innerHTML = ''I
    learnt first example!''">

    Press Me!

    </button>

    </body>

    </html>

    ```

