- fmt: "\n# Explanation\n\nHere, I made on paragraph with html `p` tag and gave `id`\
    \ name “demo”. Secondly I made one button with `onclick` event. I wrote one JavaScript\
    \ code `document.getElementById('demo').innerHTML = 'I learnt first example!'`.\
    \ You will learn all these in coming chapters but let’s start now. `document`\
    \ is JavaScript object and `getElementById` is `document` method. It clearly shows\
    \ that get element by id (demo). Here, it will get element by id `demo` which\
    \ is the `id` of `p` tag and then `innerHTML` tells that inside the `p` HTML tag\
    \ make changes. And you have to perform the change which is written after equal\
    \ to sign. Now when you press the button `<p id=\"demo\">` inner html tag is changed\
    \ to “I learnt first example!”. . I hope you will get this, if not read it again\
    \ and even not. Not a problem, we will see many examples ahead to know all these.\n\
    \n## Example 2: Change CSS Style\n\nIf you want to change the color of some text\
    \ in HTML page by clicking one button then you can do this work easily through\
    \ JavaScript. I am going to show you color changing in example.\n\n```html\n<html>\n\
    <body>\n<h1>Change Color of paragraph</h1>\n<p id=\"demo\">JavaScript will change\
    \ the color.</p>\n<script>\nfunction colorChange() {\n    var x = document.getElementById(\"\
    demo\");   \n    x.style.color = \"red\";\n}\n</script>\n<button type=\"button\"\
    \ onclick=\"colorChange()\">Press Me!</button>\n</body>\n</html>\n```\n\n### Explanation\n\
    \nIf you read the first example, you can understand the paragraph `p` tag `id`\
    \ is `demo` and button `onclick` event. In previous example, we have written the\
    \ code directly on event name `onclick`. As the code was small so we wrote inline,\
    \ but now code is big so we used `<script> </script>` tag to write JavaScript\
    \ code. Inside the code, we made one function named `colorChange()` and open the\
    \ function with curly bracket ‘{ ‘ and close the function with ‘}’ bracket. I\
    \ will teach you regarding function in later chapters. For understanding it, just\
    \ assume that function is the place where we write code which we can use at many\
    \ places. Function always has one name, and function is called by its name. Now\
