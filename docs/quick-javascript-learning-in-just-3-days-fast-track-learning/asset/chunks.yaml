    ```javascript\nvar x = null; // `x` 是 null\n```\n\n# JavaScript 运算符\n\nJavaScript\
    \ 具有许多运算符，如算术运算符、赋值运算符、字符串运算符、逻辑运算符和比较运算符。\n\n## 1. 算术运算符\n– 对数字进行某些数学运算的运算符称为算术运算符。\n\
    \n示例：\n\n| 算术运算符 | 描述 |\n| :--- | :--- |\n| `+` | 加 |\n| `-` | 减 |\n| `*` | 乘\
    \ |\n| `/` | 除 |\n| `%` | 取模 |\n| `++` | 增增 |\n| `--` | 递减 |\n\n## 2. 赋值运算符\n\
    – 赋值运算符用于赋值。\n\n示例：\n\n| 运算符 |\n| :--- |\n| `=` |\n| `+=` |\n| `-=` |\n| `*=`\
    \ |\n| `/=` |\n| `%=` |\n\n## 3. 字符串运算符\n– 你可以使用 `+` 运算符拼接字符串。\n\n示例：\n```javascript\n\
    var name = \"Jonnie\";\nvar surname = \"Smith\";\nvar full name = \"Jonnie\" +\
    \ \"Smith\";\n```\n\n## 4. 比较与逻辑运算符\n\n示例：\n\n| 运算符 | 描述 |\n| :--- | :--- |\n\
    | `==` | 等于 |\n| `===` | 值相等且类型相等 |\n| `!=` | 不等于 |\n| `!==` | 值不等或类型不等 |\n| `>`\
    \ | 大于 |\n| `<` | 小于 |\n\n# 第 5 章：JavaScript 函数\n\n函数是用于执行任何任务的代码块，并且可以在许多地方重用。函数在被调用时执行。语法非常简单，如下所示：\n\
    \n### 语法：\n```javascript\nfunction myFun(parameter1, parameter2, parameter3, ...)\n\
    {\n    //代码块\n}\n```\n这里，`myFun` 是函数名，`parameter1`、`parameter2` 和 `parameter3`\
    \ 是参数（是可选的），然后大括号开始并结束。在大括号之间将是会在函数被调用时执行的代码。\n\n### 示例：\n```html\n<html>\n<head>\n\
    \    <script>\n        function myFun(x,y){\n            var x;\n            var\
    \ y;\n            var z=x+y;\n            document.getElementById(\"demo\").innerHTML\
    \ = z;\n        }\n    </script>\n</head>\n<body>\n    <p id=\"demo\"></p>\n \
    \   <button onclick=\"myFun(5,10)\">点击这里!</button>\n</body>\n</html>\n```\n在这里，当我们点击“点击这里!”(Press\
    \ IT!)按钮时，会生成一个 `onclick` 事件并执行 `myFun(5,10)` 函数。当函数执行时，我们向函数传递两个带有值的参数，这些值将变成函数的\
    \ `x` 和 `y`，最后存储在变量 `z` 中并进入 `p` 标签。\n\n### 函数返回\n函数在遇到 `return` 语句时停止执行。`Return`\
    \ 是用于停止执行并向函数返回值的内置语句。你可以认为“函数的整体值”可以用 `return` 语句来表示。\n\n示例：\n```html\n<html\n\
    <head>\n</head>\n<body>\n    <p id=\"demo\"></p>\n    <script>\n        function\
    \ myFun(x,y){\n            var x;\n            var y;\n            var z=x+y;\n\
    \            return z;\n        }\n        document.getElementById(\"demo\").innerHTML\
    \ = myFun(5,0);\n    </script>\n</body>\n</html>\n```\n在这里，`myFun(5,0)` 的值将赋值给\
    \ id 为 `demo` 的元素。在这里你看到我在 `body` 标签内部编写了脚本，因为 `head` 标签在调用时执行，而 `body` 标签在 body\
    \ 加载时会自动执行。在这里，我没有提供任何如 `onclick` 之类的事件，因此将整个脚本写在了 `body` 标签内部。\n\n# 第 6 章：JavaScript\
    \ 对象\n\n将对象想象成真实的物体，例如 `car`（汽车）就是一个对象。它可以执行任何任务；它拥有属性和方法。属性如它的 `color`（颜色）、`model`（型号），方法如\
    \ `start`（启动）、`stop`（停止）等。\n\n### 对象属性\n```javascript\nvar car = {color:\"red\"\
    , model:\"552\", weight:\"900kgs\"};\n```\n属性通过两种语法类型调用：\n1. `Object.property`\n\
    2. `Object[\"property\"]`\n\n示例：\n```html\n<html\n<head>\n</head>\n<body>\n  \
    \  <p id=\"demo\"></p>\n    <script>\n        var car = {color:\"red\", model:552,\
    \ weight:\"900kgs\"};\n        document.getElementById(\"demo\").innerHTML = car.color;\n\
    \    </script>\n</body>\n</html>\n```\n\n### 对象方法\n对象方法是对象内部用于执行特定任务的函数。它的调用语法是\
    \ `object.method()`。\n\n示例：\n```html\n<html\n<head>\n</head>\n<body>\n    <p id=\"\
    demo\"></p>\n    <script>\n        var car = {\n            color:\"red\",\n \
    \           model:552,\n            weight:\"900kgs\",\n            fullDetails:\
    \ function () {\n                return \"汽车颜色是 \"+ this.color + \". 型号是 \"+ this.model\
    \ + \"，重量是 \"+this.weight; \n            }\n        };\n        document.getElementById(\"\
    demo\").innerHTML = car.fullDetails();\n    </script>\n</body>\n</html>\n```\n\
    \n### 对象构造函数\n`Constructor` 用于创建对象。\n```javascript\nfunction person(name, model,\
    \ weight) {\n    this.name = name;\n    this.model = model;\n    this.weight =\
    \ weight;\n}\n```\n这里 `person` 用于创建对象。\n```javascript\nvar myFriend = new person(\"\
    Jonnie\", \"552\", \"900kgs\");\n```\n`myFriend` 拥有属性 `name`、`model` 和 `weight`。\n\
    \n### JavaScript 原型\n所有的 JavaScript 原型表示类似于 `object.prototype`。\n\n```javascript\n\
    function person(name, model, weight) {\n    this.name = name;\n    this.model\
    \ = model;\n    this.weight = weight;\n}\n```\n你可以向现有对象添加一些方法。\n```javascript\n\
    person.prototype.stop = function() {\n    console.log(\"汽车停止\");\n};\n```\n\n"
