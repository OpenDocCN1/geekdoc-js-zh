    Example:


    var cars = Array("BMW", "Volvo", "Jeep");             


    var cars = new Array("BMW", "Volvo", "Jeep");             


    Array are made with or without new keyword, here three values are stored in cars
    variable.


    cars[0]=“BMW”


    cars[1]=“Volvo”


    cars[2]=“Jeep”


    It means all values are actually index of one variable “cars”. It means array
    stores multiple values in the form of indexes.


    If you would like to access any array then you can simply access by writing its
    index.


