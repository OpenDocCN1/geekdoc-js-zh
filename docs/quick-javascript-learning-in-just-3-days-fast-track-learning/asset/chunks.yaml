    ## 目录

    - 引言……………………………………………4

    - 第一章：JavaScript 入门……………..…….5

    - 第二章：JavaScript 输出/显示代码……………………………………………………..9

    - 第三章：JavaScript 变量、语句、注释与关键字 ………………….…....14

    - 第四章：JavaScript 数据类型与运算符……………………………………………….25

    - 第五章：JavaScript 函数………………32

    - 第六章：JavaScript 对象…………..….…36

    - 第七章：JavaScript 数组……………………43

    - 第八章：JavaScript 条件判断 (if, else & switch) 与循环 (for, while & do while).46

    - 总结…………………………………………………61


    ## 引言

    JavaScript 是帮助你让浏览器执行你想要操作的语言之一。这是一门容易学习的语言，现在我将教你。我的语言将是易于用户的，我会尝试用简单的语言和示例来解释复杂的内容。让我们一个一个地开始
    JavaScript 课程。这是一份 3 天 JavaScript 基础课程。


    在开始学习 JavaScript 之前，我假设你至少具有 `HTML` & `CSS` 的基础知识。如果你没有 `HTML` & `CSS` 知识，那么你应该先通过在线教程学习它们。你可以在
    2-3 天内学会基础的 `HTML` & `CSS`。


    - 第 1 天 = 学习第 1 & 2 章

    - 第 2 天 = 学习第 3, 4 & 5 章

    - 第 3 天 = 学习第 6, 7 & 8 章


    ## 第一章：JavaScript 基础

    JavaScript 可以改变 HTML 内容。如果你是 PHP 开发者，并且想在不刷新页的情况下完成某些工作，或者你想让 `HTML` & `CSS` 执行任务，那么你需要
    JavaScript。


    ### `<script>` 标签

    JavaScript 可以放在 `body` 和 `head` 标签中。JavaScript 代码应该放在 `<script>` 和 `</script>`
    标签之间。


    ```html

    <script>

    document.getElementById("demo").innerHTML = "My First JavaScript Code";

    </script>

    ```


    ### JavaScript 事件

    JavaScript 代码是由事件触发的。当人执行某项操作时就会触发事件。浏览器提供了许多事件，如 `onclick`、`onmouseover`、`onkeyup`、`onkeydown`、`ondoubleclick`
    等。当事件发生时，JavaScript 执行代码。


    ```html

    <button onclick="myFunction()">Press Me!</button>

    ```


    ### JavaScript 函数

    JavaScript 函数是放在 `<script>` 和 `</script>` 标签内的。


    ```html

    <script>

    function myFunction(){

    document.getElementById("demo").innerHTML = "My First JavaScript Code";

    }

    </script>

    ```


    ### JavaScript 的最佳位置

    JavaScript 在 `<script>` 标签内。


    ```html

    <script>

    function myFunction(){

    document.getElementById("demo").innerHTML = "My First JavaScript Code";

    }

    </script>

    ```


    ### 外部文件

    JavaScript 在 `<script>` 标签。


    ```html

    <script src="newScript.js"></script>

    ```


    ## 第二章：JavaScript 输出/显示代码

    JavaScript 有四种输出方式。


    #### 第一种方式：`document.write()`

    它用于在网页上写入任何内容。


    ```html

    <script>

    function add(){

    document.write(6);

    }

    </script>

    ```

    解释：点击按钮时，`document.write()` 输出。


    #### 第二种方式：`window.alert()`

    它用于在警告框中显示消息。


    ```html

    <script>

    window.alert("Warning");

    </script>

    ```

    解释：打开网页时，`window.alert()` 显示“警告”。


    #### 第三种方式：`innerHTML`

    该方法用于在 HTML 元素（如段落、`textarea` 等）内部写入。


    ```html

    <script>

    function something(){

    document.getElementById("demo").innerHTML = "Paragraph is filled";

    }

    </script>

    ```

    解释：点击按钮时，`getElementById()` 获取 ID 并通过 `innerHTML` 写入。


    #### 第四种方式：`console.log()`

    用于在控制台中写入，在你的 firefox、chrome 浏览器中按 F12 键。


    ```html

    <script>

    console.log(2+2);

    </script>

    ```

    解释：点击 F12 键并在控制台标签查看结果。


    ## 第三章：JavaScript 变量、语句、注释与关键字

    ### JavaScript 变量

    变量在任何语言中用于存储数据。JavaScript 中的变量与 C 等其他语言相似。变量以 `int`、`str` 等数据类型的形式存储，但在 JS 中，你可以使用
    `var` 关键字处理所有数据类型。


    写入字符串：写入字符串时需要使用单引号或双引号。


    示例：

    ```javascript

    var x = "This is a Boy.";

    var y = ''This is a Girl.'';

    ```

    注意：分号 `;` 用于结束行。


    写入数字：写入数字不需要双引号或单引号。如果你使用了，JS 将其视为字符串。


    示例：

    ```javascript

    var x = 8;

    var y = 6;

    var z = x+y;

    ```


    ### JavaScript 语句

    JavaScript 语句是浏览器执行的指令集。


    示例 1：改变 HTML 内容

    想象一下，你想通过点击按钮在 HTML 的任何地方添加某些内容。你可以通过 PHP 轻松地完成此工作，但页面会刷新。借助 JavaScript，你可以在不刷新页面的情况下完成此工作。


    ```html

    <<<html>

    <body>

    <h1>Change Content of Box</h1>

    <p id="demo">JavaScript will change HTML content.</p>

    <button type="button" onclick="document.getElementById(''demo'').innerHTML = ''I
    learnt first example!''">

    Press Me!

    </button>

    </body>

    </html>

    ```


