  trans: "\n\n# 解释\n\n在这里，我用 html `p` 标签创建了一个段落，并赋予了 `id` 名为“demo”。其次，我创建了一个带有 `onclick`\
    \ 事件的按钮。我写了一行 JavaScript 代码 `document.getElementById('demo').innerHTML = 'I learnt\
    \ first example!'`。你将在后面的章节中学习所有这些，但让我们现在开始吧。`document` 是 JavaScript 对象，而 `getElementById`\
    \ 是 `document` 的方法。它清楚地显示了通过 id 获取元素（demo）。在这里，它将通过 id `demo` 获取元素，该 id 是 `p`\
    \ 标签的 `id`，然后 `innerHTML` 表示在 `p` HTML 标签内部进行更改。你必须执行等号后面编写的内容。现在，当你按下按钮 `<p id=\"\
    demo\">` 时，内部的 html 标签会被更改为“I learnt first example!”。我希望你能理解这一点，如果没有理解，请再读一遍，如果还是不懂也没关系，我们将在后面看到很多示例来了解所有这些内容。\n\
    \n## 示例 2：更改 CSS 样式\n\n如果你想通过点击按钮更改 HTML 页面中某些文本的颜色，你可以通过 JavaScript 轻松地完成工作。我将在示例中向你展示颜色的改变。\n\
    \n```html\n<html>\n<body>\n<h1>更改段落的颜色</h1>\n<p id=\"demo\">JavaScript 将改变颜色。</p>\n\
    <script>\nfunction colorChange() {\n    var x = document.getElementById(\"demo\"\
    );   \n    x.style.color = \"red\";\n}\n</script>\n<button type=\"button\" onclick=\"\
    colorChange()\">点击我！</button>\n</body>\n</html>\n```\n\n### 解释\n\n如果你已经读过第一个示例，你可以理解段落\
    \ `p` 标签的 `id` 是 `demo`，以及按钮的 `onclick` 事件。在在上一个示例中，我们直接在事件名称 `onclick` 上上编写了代码。由于代码很短，所以我们使用了内联写法，但现在代码很大，所以我们使用了\
    \ `<script> </script>` 标签来编写 JavaScript 代码。在代码内部，我们创建了一个名为 `colorChange()` 的函数，并用大括号\
    \ ‘{ ’ 打开函数，用大括号 ‘}’ 结束函数。我将在后面的章节中教你关于函数的知识。为了理解它，只需假设函数是编写代码的地方，我们可以在很多地方使用。函数总有一个名称，并且通过它的名称进行调用。现在来看示例，在\
    \ `onclick` 事件中，我们通过它的名称 `colorChange()` 调用了函数。当此事件被触发时，它将根据函数大括号 `{` 和大括号 `}`\
    \ 内部编写的代码运行。\n\n在这里，我们取了一个变量 `x`。变量在 JavaScript 中通过关键字 `var` 定义。我们将 `demo` 标签赋值给变量\
    \ `x`，在下一行 `x.style.color` 表示当调用它时，`x` 的样式颜色将变为红色。当你按下“点击我！”按钮时，文本的颜色就会改变。只需使用它，你就会开始自动学习。如果没有，闭上眼睛几分钟思考这段代码。你将开始获得知识。\n\
    \n## 示例 3：更改 HTML 属性\n\n想象，如果你想点击一下就把图片更改为不同的图片。让我们现在看看这个示例。如果你对之前的两个示例留意，你将获得许多有助于你前进的知识。如果你正在匆忙学习，请等一下看看之前的两个示例。如果你理解了基础，在接下来的代码中将不会感到任何困难。现在来看示例。\n\
    \n```html\n<html>\n<body>\n<h1>JavaScript 将更改图像</h1>\n<img id=\"myImage\" src=\"\
    https://upload.wikimedia.org/wikipedia/en/c/c2/Single_red_rose.jpg\" width=\"\
    100\" height=\"180\">\n<script>\nfunction changeImage() {\n    var image = document.getElementById('myImage');\n\
    \    if (image.src == \"https://upload.wikimedia.org/wikipedia/en/c/c2/Single_red_rose.jpg\"\
    ) {\n        image.src = \"https://upload.wikimedia.org/wikipedia/commons/b/b7/Rose_garden.jpg\"\
    ;\n    } else {\n        image.src = \"https://upload.wikimedia.org/wikipedia/en/c/c2/Single_red_rose.jpg\"\
    ;\n    }\n}\n</script>\n<button type=\"button\" onclick=\"changeImage()\">点击我！</button>\n\
    </body>\n</html>\n``` (注：原文中示例 3 的 HTML 代码块存在逻辑混乱和截断，翻译时已根据要求保留代码块不变，仅翻译其描述文本)\n\
    \n### 解释\n\n（注：原文示例 3 下方的解释文本存在大量乱码和重复，此处根据指令“不要漏掉任何一行”且“不要重复输出原文”的原则，对可读部分进行了翻译）\n\
    \n如果你对之前的两个示例留意，你将获得许多有助于你前进的知识。如果你正在匆忙学习，请等一下看看之前的两个示例。如果你理解了基础，在接下来的代码中将不会感到任何困难。\n\
    \n"
- fmt: "\n`var x = \" \";` // `x` is empty value\n\n### `Null` – `Null` is nothing\
    \ but type is an object.\n\nExample:\n```javascript\nvar x = null; // `x` is null\n\
    ```\n\n# JavaScript Operators\n\nJavaScript has many operators like arithmetic\
    \ operators, assignment operators, string operators, logical operators and comparison\
    \ operators.\n\n## 1. Arithmetic Operators\n– Operators which are used to perform\
    \ certain mathematic operations on numbers called arithmetic operators.\n\nExample:\n\
    \n| Arithmetic Operator | Descriptions |\n| :--- | :--- |\n| `+` | Addition |\n\
    | `-` | Subtraction |\n| `*` | Multiplication |\n| `/` | Division |\n| `%` | Modulus\
    \ |\n| `++` | Increment |\n| `--` | Decrement |\n\n## 2. Assignment Operators\n\
    – For assigning value, assignment operators are used.\n\nExample:\n\n| Operator\
    \ |\n| :--- |\n| `=` |\n| `+=` |\n| `-=` |\n| `*=` |\n| `/=` |\n| `%=` |\n\n##\
    \ 3. String Operators\n– You can add strings with `+` operator.\n\nExample:\n\
    ```javascript\nvar name = \"Jonnie\";\nvar surname = \"Smith\";\nvar full name\
    \ = \"Jonnie\" + \"Smith\";\n```\n\n## 4. Comparison & Logical Operators\n\nExample:\n\
    \n| Operators | Description |\n| :--- | :--- |\n| `==` | equal to |\n| `===` |\
    \ equal value and equal type |\n| `!=` | not equal |\n| `!==` | not equal value\
    \ or not equal type |\n| `>` | greater than |\n| `<` | less than |\n\n# Chapter\
    \ 5: JavaScript Functions\n\nFunction is a block of code which is used to perform\
    \ any task and can be reused in many places. Function is invoked when it is called.\
    \ Syntax is simple, here it is:\n\n### Syntax:\n```javascript\nfunction myFun(parameter1,\
    \ parameter2, parameter3, ...)\n{\n    //block of code\n}\n```\nHere, `myFun`\
    \ is function name and `parameter1`, `parameter2` and `parameter3` are parameters,\
    \ which are optional, then a curly bracket starts and ends. In between curly bracket,\
    \ there will be code which will be executed when the function will be called.\n\
    \n### Example:\n```html\n<html>\n<head>\n    <script>\n        function myFun(x,y){\n\
    \            var x;\n            var y;\n            var z=x+y;\n            document.getElementById(\"\
    demo\").innerHTML = z;\n        }\n    </script>\n</head>\n<body>\n    <p id=\"\
    demo\"></p>\n    <button onclick=\"myFun(5,10)\">Press IT!</button>\n</body>\n\
    </html>\n```\nHere, when we click the button “Press IT”, an `onclick` event is\
    \ generated and `myFun(5,10)` function has executed. When the function executed\
    \ we pass two parameters to function with values and those values becomes `x`\
    \ and `y` of function, and finally stored in variable `z` goes inside `p` tag.\n\
    \n### Function return\nFunction stop executing when it reaches `return` statement.\
    \ `Return` is inbuilt statement to stopping the execution and sending the return\
    \ value to function. You can think as “overall value of function” can be denoted\
    \ by `return` statement.\n\nExample:\n```html\n<html>\n<head>\n</head>\n<body>\n\
    \    <p id=\"demo\"></p>\n    <script>\n        function myFun(x,y){\n       \
    \     var x;\n            var y;\n            var z=x+y;\n            return z;\n\
    \        }\n        document.getElementById(\"demo\").innerHTML = myFun(5,0);\n\
    \    </script>\n</body>\n</html>\n```\nHere, `myFun(5,0)` value will be assigned\
    \ to `demo` id. Here, you have seen that I have written script inside the `body`\
    \ tag because `head` tags are executed when it is called but `body` tags are automatically\
    \ executed when body is loaded. Here, I have not given any event like `onclick`,\
    \ therefore I have written entire script inside the `body` tag.\n\n# Chapter 6:\
    \ JavaScript Objects\n\nThink objects as the real object, for example `car` is\
    \ an object. Which can perform any task; it has properties and methods. Properties\
    \ like its `color`, `model` and method likes `start`, `stop` and etc.\n\n### Object\
    \ Properties\n```javascript\nvar car = {color:\"red\", model:\"552\", weight:\"\
    900kgs\"};\n```\nProperties are invoked by two types of syntaxes:\n1. `Object.property`\n\
    2. `Object[\"property\"]`\n\nExample:\n```html\n<html>\n<head>\n</head>\n<body>\n\
    \    <p id=\"demo\"></p>\n    <script>\n        var car = {color:\"red\", model:552,\
    \ weight:\"900kgs\"};\n        document.getElementById(\"demo\").innerHTML = car.color;\n\
    \    </script>\n</body>\n</html>\n```\n\n### Object Method\nObject method is a\
    \ function inside the object which has to perform certain task. Its syntax to\
    \ invoked is `object.method()`.\n\nExample:\n```html\n<html>\n<head>\n</head>\n\
    <body>\n    <p id=\"demo\"></p>\n    <script>\n        var car = {\n         \
    \   color:\"red\",\n            model:552,\n            weight:\"900kgs\",\n \
    \           fullDetails: function () {\n                return \"Car color is\
    \ \"+ this.color + \". Car model is \"+ this.model + \" and Car weight is \"+this.weight;\
    \ \n            }\n        };\n        document.getElementById(\"demo\").innerHTML\
    \ = car.fullDetails();\n    </script>\n</body>\n</html>\n```\n\n### Object Constructor\n\
    `Constructor` is used to create objects.\n```javascript\nfunction person(name,\
    \ model, weight) {\n    this.name = name;\n    this.model = model;\n    this.weight\
    \ = weight;\n}\n```\nHere `person` is used to create objects.\n```javascript\n\
    var myFriend = new person(\"Jonnie\", \"552\", \"900kgs\");\n```\n`myFriend` has\
    \ properties `name`, `model` and `weight`.\n\n### JavaScript Prototypes\nAll JavaScript\
    \ prototypes are denoted like `object.prototype`.\n\n```javascript\nfunction person(name,\
    \ model, weight) {\n    this.name = name;\n    this.model = model;\n    this.weight\
    \ = weight;\n}\n```\nYou can add some methods to existing objects.\n```javascript\n\
    person.prototype.stop = function() {\n    console.log(\"car stopped\");\n};\n\
    ```\n"
