    \n# Chapter 8: JavaScript Conditions (if, else, else if & Switch) and Loops (for\
    \ & while)\n\n## JavaScript Conditions (if, else, else if & switch)\n\nIn JavaScript,\
    \ many times you have to choose one condition or many conditions for performing\
    \ any task.\n\n### Syntax\n\n```javascript\nIf(condition){\n    Block of code\
    \ will execute, when if condition becomes true.\n} else {\n    Block of code will\
    \ execute, when if condition becomes false.\n}\n```\n\n### Using if statement\n\
    \nWhen you have to perform one task on any condition, and “if” condition becomes\
    \ true then “if statement block” will execute.\n\n### Using else statement\n\n\
    When “if” condition becomes false, then “else” block will be executed.\n\nExample:\
    \ if age is above 18 then the person can vote and if the person below 18 age then\
    \ cannot vote.\n\n```html\n<html>\n    <head>\n        <title>Vote Eligibility</title>\n\
    \    </head>\n    <body>\n        <div>Vote Eligibility</div>\n        <script>\n\
    \            function myfunction(){\n                var age = document.getElementById(\"\
    age\").value;\n                if(age>=18){\n                    var eligibility\
    \ = \"this person can vote\";\n                    document.getElementById(\"\
    demo\").innerHTML = eligibility;\n                }else{\n                   \
    \ var eligibility = \"this person cannot vote\";\n                    document.getElementById(\"\
    demo\").innerHTML = eligibility;\n                }\n            }\n        </script>\n\
    \        Enter Age: <input type=\"text\" id=\"age\" name=\"age\" /><br>\n    \
    \    <p id=\"demo\"></p>\n        <input type=\"button\" onclick=\"myfunction()\"\
    \ value=\"Check Eligibility\">\n    </body>\n</html>\n```\n\n### Using else if\
    \ statement\n\nWhen we have more than one condition we use “else if” statement.\n\
    \nSyntax:\n\n```javascript\nIf(condition 1){\n    Block of code will execute,\
    \ when condition 1 becomes true.\n} else if(condition 2){\n    Block of code will\
    \ execute, when condition 2 becomes true.\n} else {\n    Block of code will execute\
    \ when conditions becomes false.\n}\n```\n\nExample: if a person meets before\
    \ 12 hours, we wish him good morning, if he meets 16 hours, we wish him good afternoon\
    \ and if both the conditions become false then we wish evening.\n\n```html\n<html>\n\
    \    <head>\n        <title>Example</title>\n    </head>\n    <body>\n       \
    \ <div>Greet Message (Enter Time in 24 hours) </div>\n        <script>\n     \
    \       function myfunction(){\n                var time = document.getElementById(\"\
    time\").value;\n                if(time<12){\n                    var greet =\
    \ \"Good Morning\";\n                    document.getElementById(\"demo\").innerHTML\
    \ = greet;\n                }else if(time<16){\n                    var greet\
    \ = \"Good Afternoon\";\n                    document.getElementById(\"demo\"\
    ).innerHTML = greet;\n                }else{\n                    var greet =\
    \ \"Good Evening\";\n                    document.getElementById(\"demo\").innerHTML\
    \ = greet;\n                }\n            }\n        </script>\n        Enter\
    \ Time: <input type=\"text\" id=\"time\" name=\"time\" /><br>\n        <p id=\"\
    demo\"> Greet Message :</p>\n        <input type=\"button\" onclick=\"myfunction()\"\
    \ value=\"Check Greet\">\n    </body>\n</html>\n```\n\n### Switch Statement\n\n\
    By this we can increase as many else if conditions. For many conditions we can\
    \ use switch statement. Switch statement is used when you have many conditions\
    \ to check. You can do the same work with else if but switch is better than else\
    \ statement. You need to put `break` after each condition and `default` if no\
    \ condition will be executed.\n\nSyntax:\n\n```javascript\nswitch(expression)\
    \ {\n    case x:\n        block will execute.\n        break;\n    case y:\n \
    \       block will execute.\n        break;\n    default:\n        block will\
    \ execute.\n}\n```\n\nExample:\n\n```html\n<html>\n    <head>\n        <title>Example</title>\n\
    \    </head>\n    <body>\n        <script>\n            function myfunction(){\n\
    \                var today = new Date().getDay();\n                switch (today)\
    \ {\n                    case 0:\n                        day = \"Today is Sunday\"\
    ;\n                        break;\n                    case 1:\n             \
    \           day = \"Today is Monday\";\n                        break;\n     \
    \               case 2:\n                        day = \"Today is Tuesday\";\n\
    \                        break;\n                    case 3:\n               \
    \         day = \"Today is Wednesday\";\n                        break;\n    \
    \                case 4:\n                        day = \"Today is Thursday\"\
    ;\n                        break;\n                    case 5:\n             \
    \           day = \"Today is Friday\";\n                        break;\n     \
    \               case 6:\n                        day = \"Today is Saturday\";\n\
    \                        break;\n                }\n                document.getElementById(\"\
    demo\").innerHTML = day;\n            }\n        </script>\n        What Day is\
    \ Today:\n        <p id=\"demo\"></p>\n        <input type=\"button\" onclick=\"\
    myfunction()\" value=\"Check Today's Day\">\n    </body>\n</html>\n```\n\n## JavaScript\
    \ Loops\n\nJavaScript Loops are used to execute one code many times by changing\
    \ values. For example, you want to write 1 to 1000 in one page. By doing manually,\
    \ it will take huge time but with loops, it will be done in few seconds.\n\nExample:\n\
    \n```html\n<html>\n    <head>\n        <title>Example</title>\n    </head>\n \
    \   <body>\n        <script>\n            function myfunction(){ \n          \
    \      var star=\"\";\n                for(var i=1; i<1000; i++){\n          \
    \          star += i + \"<Br>\";\n                }\n                document.getElementById(\"\
    demo\").innerHTML = star ;\n            }\n        </script>\n        <p id=\"\
    demo\"></p>\n        <input type=\"button\" onclick=\"myfunction()\" value=\"\
    Check Loop\">\n    </body>\n</html>\n```\n\n### For Loop\n\nIn the previous example,\
    \ you saw that loop needs three statements.\n\n- First statement – to initialize\
    \ the value\n- Second statement – to check the condition\n- Third statement –\
    \ to increase or decrease the counter\n\nSyntax:\n\n```javascript\nfor (statement\
    \ 1; statement 2; statement 3) {\n    This code block to be executed\n}\n```\n\
    \nIn the previous example, loop begins with statement 1 which is `var i=1`, here\
    \ we are initializing the value of `i` and then statement 2 checks the condition,\
    \ if condition is fulfilled then block of code executes. Here statement 3 works\
    \ after block of code execution, then statement 3 works to increase or decrease\
    \ the value of `i`.\n\n### While Loop\n\nWhen we need to execute the block of\
    \ code when any condition fulfills then we use while loop.\n\nSyntax:\n\n```javascript\n\
    while (condition) {\n    This code block to be executed\n}\n```\n\nExample:\n\n\
    ```html\n<html>\n    <head>\n        <title>Example</title>\n    </head>\n   \
    \ <body>\n        <script>\n            function myfunction(){\n             \
    \   var num=\"\";\n                var i=1;\n                while (i < 20) {\n\
    \                    num += \"Number is \" + i +\"<Br>\";\n                  \
    \  i++;\n                }\n                document.getElementById(\"demo\").innerHTML\
    \ = num ;\n            }\n        </script>\n        <p id=\"demo\"></p>\n   \
    \ </body>\n</html>\n```\n"
