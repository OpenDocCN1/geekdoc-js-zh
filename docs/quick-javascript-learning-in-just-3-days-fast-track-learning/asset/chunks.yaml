    \ Eligibility</div>\n\n        <script>\n\n            function myfunction(){\n\
    \n                var age = document.getElementById(\"age\").value;\n\n               \
    \ if(age>=18){\n\n                var eligibility = \"this person can vote\";\n\
    \n                document.getElementById(\"demo\").innerHTML = eligibility;\n\
    \n                    }else{\n\n                var eligibility = \"this person\
    \ cannot vote\";\n\n                document.getElementById(\"demo\").innerHTML\
    \ = eligibility;\n\n                    }\n\n            }\n\n        </script>\n\
    \n        Enter Your Age: <input type=\"text\" id=\"age\" name=\"age\" /><br>\n\
    \n        <p id=\"demo\"></p>\n\n        <input type=\"button\" onclick=\"myfunction()\"\
    \ value=\"Check Eligibility\">\n\n    </body>\n\n</html>\n\nUsing else if statement\n\
    \n              When we have more than one condition then we use “else if” statement.\n\
    \nSyntax:\n\nIf(condition 1){\n\n              Block of code will execute, when\
    \ if condition 1 becomes true.\n\n} else if(condition 2){\n\n              Block\
    \ of code will execute, when if condition2 becomes true.\n\n} else {\n\n             \
    \ Block of code will execute when both conditions becomes false.\n\n}\n\nExample:\
    \ if a person meets before 12 hours, we wish him good morning, if he meets after\
    \ 16 hours, we wish him good afternoon and if both the conditions become false\
    \ then we wish good evening.\n\n<html>\n\n    <head>\n\n        <title>Example</title>\n\
    \n    </head>\n\n    <body>\n\n        <div>Greet Message (Enter Time in 24 hours\
    \ format) </div>\n\n        <script>\n\n            function myfunction(){\n\n\
                    var time = document.getElementById(\"time\").value;\n\n               \
    \ if(time<12){\n\n                var greet = \"Good Morning\";\n\n               \
    \ document.getElementById(\"demo\").innerHTML = greet;\n\n                   \
    \ }else if(time<16){\n\n                var greet = \"Good Afternoon\";\n\n               \
    \ document.getElementById(\"demo\").innerHTML = greet;\n\n                   \
    \ }else{\n\n                var greet = \"Good Evening\";\n\n                document.getElementById(\"\
    demo\").innerHTML = greet;\n\n                    }\n\n            }\n\n       \
    \ </script>\n\n        Enter Time: <input type=\"text\" id=\"time\" name=\"time\"\
    \ /><br>\n\n       <p id=\"demo\"> Greet Message Here :</p>\n\n        <input\
    \ type=\"button\" onclick=\"myfunction()\" value=\"Check Greet Message\">\n\n\
        </body>\n\n</html>\n\nBy this we can increase as many as else if conditions\
    \ in the code. For many conditions we can also use switch statement.\n\nSwitch\
    \ Statement\n\nSwitch statement is used when you have many conditions to check.\
    \ You can do the same work with else if but switch is better than else if statement.\
    \ You need to put “break” command after each condition and one condition will\
    \ “default” if no condition will be executed.\n\nSyntax:\n\nswitch(expression)\
    \ {\n\n    case x:\n\n        this code block will execute.\n\n        break;\n\
    \n    case y:\n\n        this code block will execute.\n\n        break;\n\n   \
    \ default:\n\n        this code block will execute.\n\n}\n\nExample:\n\n<html>\n\
    \n    <head>\n\n        <title>Example</title>\n\n    </head>\n\n    <body>\n\n\
            <script>\n\n            function myfunction(){\n\n                var\
    \ today = new Date().getDay();\n\n               switch (today) {\n\n                   \
    \ case 0:\n\n                        day = \"Today is Sunday\";\n\n                       \
    \ break;\n\n                    case 1:\n\n                        day = \"Today\
    \ is Monday\";\n\n                        break;\n\n                    case 2:\n\
    \n                        day = \"Today is Tuesday\";\n\n                       \
    \ break;\n\n                    case 3:\n\n                        day = \"Today\
    \ is Wednesday\";\n\n                        break;\n\n                    case\
    \ 4:\n\n                        day = \"Today is Thursday\";\n\n                       \
    \ break;\n\n                    case 5:\n\n                        day = \"Today\
    \ is Friday\";\n\n                        break;\n\n                    case 6:\n\
    \n                        day = \"Today is Saturday\";\n\n                       \
    \ break;\n\n                }\n\n                document.getElementById(\"demo\"\
    ).innerHTML = day;   \n\n            }\n\n        </script>\n\n        What Day\
    \ is Today:\n\n       <p id=\"demo\"></p>\n\n        <input type=\"button\" onclick=\"\
    myfunction()\" value=\"Check To See Today's Day\">\n\n    </body>\n\n</html>\n\
    \nJavaScript Loops\n\nJavaScript Loops are used to execute one code many times\
    \ by changing values. For example, you want to write 1 to 1000 in one page in\
    \ each line. By doing manually, it will take huge time but with loops, it will\
    \ be done in few seconds.\n\nExample:\n\n<html>\n\n    <head>\n\n        <title>Example</title>\n\
    \n    </head>\n\n    <body>\n\n        <script>\n\n            function myfunction(){  \n\
    \n                var star=\"\";\n\n                for(var i=1; i<1000; i++){\n\
    \n                  star += i + \"<Br>\";\n\n                }\n\n                \
    \ document.getElementById(\"demo\").innerHTML = star ;\n\n            }\n\n       \
    \ </script>\n\n       <p id=\"demo\"></p>\n\n        <input type=\"button\" onclick=\"\
    myfunction()\" value=\"Check Loop\">\n\n    </body>\n\n</html>\n\nFor Loop\n\n\
    \ In the previous example, you saw that loop needs three statements.\n\nFirst\
    \ statement – to initialize the value\n\nSecond statement – to check the condition\n\
    \nThird statement – to increase or decrease the counter\n\nSyntax:\n\n             \
    \ for (statement 1; statement 2; statement 3) {\n\n                              \
    \ This code block to be executed\n\n}\n\nIn the previous example, loop begins\
    \ with statement 1 which is var i=1, here we are initializing the value of “i”\
    \ and then statement 2 checks the condition, if condition is fulfilled then block\
    \ of code executes. Here statement 3 works after block of code execution, then\
    \ statement 3 works to increase or decrease the value of “i”.\n\nWhile Loop\n\n\
    When we need to execute the block of code when any condition fulfills then we\
    \ use while loop.\n\nSyntax:\n\nwhile (condition) {\n\n   This code block to be\
    \ executed\n\n}\n\nExample:\n\n<html>\n\n    <head>\n\n        <title>Example</title>\n\
    \n    </head>\n\n    <body>\n\n        <script>\n\n            function myfunction(){\n\
    \n                var num=\"\";\n\n                var i=1;\n\n               \
    \ while (i < 20) {\n\n                 num += \"Number is \" + i +\"<Br>\";\n\n\
                     i++;\n\n             }\n\n                 document.getElementById(\"\
    demo\").innerHTML = num ;\n\n            }\n\n        </script>\n\n       <p id=\"\
    demo\"></p>\n\n        <input type=\"button\" onclick=\"myfunction()\" value=\"\
    Check Loop\">\n\n    </body>\n\n</html>"
