  trans: "\n\n在这里，`while` 语句检查条件并执行代码，然后增加 `i` 的值，再次检查语句并执行代码，以此此类推……\n\n## do while\
    \ 循环\n\n`do while` 循环用于需要至少执行一次代码块的场景，首先执行 `do` 语句，然后由 `while` 语句检查条件。\n\n###\
    \ 语法\n\n```javascript\ndo{\n    This block of code will execute.\n}while(condition)\n\
    ```\n\n### 示例\n\n```html\n<<html>\n    <head>\n        <title>Example</title>\n\
    \    </head>\n    <body>\n        <script>\n            function myfunction(){\n\
    \                var num=\"\";\n                var i=1;\n                do {\n\
    \                num += \"Number is \" + i +\"<Br>\";\n                i++;\n\
    \                }\n                while (i < 10);\n                document.getElementById(\"\
    demo\").innerHTML = num ;\n            }\n        </script>\n        <p id=\"\
    demo\"></p>\n        <input type=\"button\" onclick=\"myfunction()\" value=\"\
    Check Loop\">\n    </body>\n</html>\n```\n\n在这里，首先执行 `do` 语句，然后检查条件；如果条件为真，则执行\
    \ `do` 语句中的代码。\n\n## 总结\n\n你已经成功学会了 JavaScript，现在可以编写自己的 JS 代码并在实际场景中工作了。希望你喜欢这三天的课程。\n\
    \n"
