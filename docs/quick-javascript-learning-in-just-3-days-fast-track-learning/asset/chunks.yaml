                  JavaScript has many operators like arithmetic operators, assignment
    operators, string operators, logical operators and comparison operators.


    1.  Arithmetic Operators – Operators which are used to perform certain mathematic
    operations on numbers called arithmetic operators.


    Example:


    | Arithmetic Operator | Descriptions |


    | + | Addition |


    | - | Subtraction |


    | * | Multiplication |


    | / | Division |


    | % | Modulus |


    | ++ | Increment |


    | -- | Decrement |


    2.  Assignment Operators – For assigning value, assignment operators are used.


    Example:             


    | Operator |


    | = |


    | += |


    | -= |


    | *= |


    | /= |


    | %= |


    3.  String Operators – You can add strings with + operator.


    Example:


    var name = “Jonnie”;                                                                     


    var surname = “Smith”;


    var full name = “Jonnie” + “Smith”;


    4.  Comparison & Logical Operators


    Example:


    | Operators | Description |


    | == | equal to |


    | === | equal value and equal type |


    | != | not equal |


    | !== | not equal value or not equal type |


    | > | greater than |


    | < | less than |


    Chapter 5


    JavaScript Functions


    Function is a block of code which is used to perform any task and can be reused
    in many places. Function is invoked when it is called. Syntax is simple, here
    it is:


    Syntax:


    function myFun(parameter1, parameter2, parameter3, …)


    {


    //block of code


    }


    Here, myFun is function name and parameter1, parameter2 and parameter 3 are parameters,
    which are optional, then a curly bracket starts and ends. In between curly bracket,
    there will be code which will be executed when the function will be called.


    Example:             


    <html>


    <head>


                  <script>


                  function myFun(x,y){


                  var x;


                  var y;


                  var z=x+y;


                  document.getElementById("demo").innerHTML = z;             


                  }


                  </script>


    </head>


    <body>


                  <p id="demo"></p>


                  <button onclick="myFun(5,10)">Press IT!</button>


    </body>


    </html>             


    Here, when we click the button “Press IT”, an onclick event is generated and myFun(5,10)
    function has executed. When the function executed, we pass two parameters to function
    with values and those values becomes x and y value of function, and finally results
    stored in variable and z variable data goes inside the p tag.


    Function return


    Function is stop executing when it reaches to return statement. Return is JavaScript
    inbuilt statement to stopping the execution and sending the return value to function.
    You can think as the “overall value of function” can be denoted by return statement.


    Example


    <html>


    <head>


    </head>


    <body>


                  <p id="demo"></p>


                  <script>


                  function myFun(x,y){


                  var x;


                  var y;


                  var z=x+y;


                  return z;


                  }


                  document.getElementById("demo").innerHTML = myFun(150,10);


                  </script>


    </body>


    </html>


    Here, myFun(150,10) value will be assigned to demo id. Here, you have seen that
    I have written script inside the body tag, because head tags are executed when
    it is called but body tags are automatically executed when body is loaded on browser.
    Here, I have not given any event like onclick, therefore I have written entire
    script inside the body tag.


    Chapter 6


    JavaScript Objects


                  Think objects as the real object, for example car is an object.
    Which can perform any task; it has its properties and methods. Properties like
    its color, model, weight and method likes start, stop and etc.


    Object Properties Example


    var car = {color:”red”, model=“5520”, weight=“900kgs”};


    Properties are invoked by two types of syntaxes.


    1st syntax = Object.property ;


    2nd Syntax = Object[“property”];


    Example:


    <html>


    <head>


    </head>


    <body>


                  <p id="demo"></p>


                  <script>


                  var car = {color:"red", model:552, weight:"900kgs"};


                  document.getElementById("demo").innerHTML = car.color;


                  </script>


    </body>


    </html>


    Object Method


    Object method is a function inside the object which has to perform certain task.
    Its syntax to invoked is = object.method();


    Example:


    <html>


    <head>


    </head>


    <body>


                  <p id="demo"></p>


                  <script>


                  var car = {


                  color:"red",


                  model:552,


                  weight:"900kgs",


                  fullDetails: function () {


                  return "Car color is "+ this.color + ". Car model is "+ this.model
    + " and Car weight is "+this.weight; }


                  };             


                  document.getElementById("demo").innerHTML = car.fullDetails();


                  </script>


    </body>


    </html>


                  Here, a method fullDetails is made as a function and it is invoked
    by car.fullDetails(). Here, you have seen new keyword “this”. “this” is used to
    use own properties of any object. You cannot directly write color, model and weight.
    You need to use this.color, this.model and this.weight to use inside the function.


    Object Constructor


    It is best way to use constructor for using objects with parameters.


    function person(name, age, weight, height){


                  this.name = name;


                  this.age = age;


                  this.weight = weight;


                  this.height = height;


    }


    Here person is the constructor object


    Create an object


    For creating an object, new keyword is used in JavaScript as it is used in PHP,
    C and in many languages.


    var myFriend = new person(Jonnie, Smith, 50kg, 6ft);


    Here, myFriend is new object of person Object. Now, myFriend can access whole
    properties and methods of object person.


    myFriend.name                             //accessing property


    myFriend.age                             //accessing property


    JavaScript Prototypes


    All JavaScript objects are inherited with their object prototypes which are denoted
    like object.prototype. Example: new Date() is used to create new Date object and
    inherit Date.prototype.


    Creating a Prototype


    function person(firstname, surname, age) {


        this.firstname = firstname;


        this.surname = surname;


        this.age = age;


        }


    Creating new objects with new  keyword


    var student = new person("John", "Smith", 12, "blue");


    Adding Properties, Methods to  Objects


    Sometime you want to add some properties, methods to objects, all existing objects
    or to a prototype object.


    Adding property to an object


    student.haircolor = “Gray”;


    Adding property to a prototype


    You can not directly add property to a prototype as similar to object. You need
    to do by this way.


    person.haircolor = “Gray”;


    Adding method to an object


    student.fullname = function(){


    return this.firstname + “ “ + this.surname;


    };


    Adding method to a prototype


    function person(firstname, surname, age) {


        this.firstname = firstname;


        this.surname = surname;


        this.age = age;


        this.fullname = function(){


        return this.firstname + “ “ + this.surname; };


        }


    Chapter 7


    JavaScript Arrays


