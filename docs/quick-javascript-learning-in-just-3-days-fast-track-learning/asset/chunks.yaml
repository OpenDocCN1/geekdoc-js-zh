  trans: "\n\n```javascript\nvar cars = Array(\"BMW\", \"Volvo\", \"Jeep\");\ndocument.getElementById(\"\
    demo\").innerHTML = cars[1];\n```\n\n## 访问数组\n\n你可以直接或间接地通过索引值访问任何数组。\n\n```javascript\n\
    var carname = cars[0];\n```\n\n或者\n\n```javascript\ncars[0];\n```\n\n## 数组作为对象\n\
    \n对象使用名称索引，而数组使用数字索引。这意味着数组使用数字来访问元素，而对象使用名称来访问元素。\n\n### 示例\n\n```javascript\n\
    var person = [\"John\", \"Smith\", 12]; //数组\nvar person = {firstname:\"John\"\
    , lastname:\"Smith\", age:12}; //对象\n```\n\n# 第 8 章：JavaScript 条件 (if, else, else\
    \ if & Switch) 和 循环 (for & while)\n\n## JavaScript 条件 (if, else, else if & switch)\n\
    \n在 JavaScript 中，很多时候你必须为执行任何任务选择一个条件或多个条件。\n\n### 语法\n\n```javascript\nIf(condition){\n\
    \    // 当 if 条件为真时，将执行代码块。\n} else {\n    // 当 if 条件为假时，将执行代码块。\n}\n```\n\n###\
    \ 使用 if 语句\n\n当你需要在任何条件下执行某项任务时，如果“if”条件为真，则将执行“if 语句块”。\n\n### 使用 else 语句\n\n\
    当“if”条件为假时，将执行“else”块。\n\n示例：如果年龄大于 18 岁，则该人员可以投票；如果人员年龄小于 18 岁，则无法投票。\n\n```html\n\
    <<html>\n    <head>\n        <title>投票资格</title>\n    </head>\n    <body>\n  \
    \      <div>投票资格</div>\n        <script>\n            function myfunction(){\n\
    \                var age = document.getElementById(\"age\").value;\n         \
    \       if(age>=18){\n                    var eligibility = \"此人可以投票\";\n    \
    \                document.getElementById(\"demo\").innerHTML = eligibility;\n\
    \                }else{\n                    var eligibility = \"此人无法投票\";\n \
    \                   document.getElementById(\"demo\").innerHTML = eligibility;\n\
    \                }\n            }\n        </script>\n        输入年龄：<input type=\"\
    text\" id=\"age\" name=\"age\" /><br>\n        <p id=\"demo\"></p>\n        <input\
    \ type=\"button\" onclick=\"myfunction()\" value=\"检查资格\">\n    </body>\n</html>\n\
    ```\n\n### 使用 else if 语句\n\n当我们有多个条件时，我们使用“else if”语句。\n\n语法：\n\n```javascript\n\
    If(condition 1){\n    // 当条件 1 为真时，将执行代码块。\n} else if(condition 2){\n    // 当条件\
    \ 2 为真时，将执行代码块。\n} else {\n    // 当条件都为假时，将执行代码块。\n}\n```\n\n示例：如果一个人在 12 点前见面，我们向他问早安；如果他在\
    \ 16 点前见面，我们向他问下午好；如果两个条件都为假，我们向他问晚上好。\n\n```html\n<html>\n    <head>\n      \
    \  <title>示例</title>\n    </head>\n    <body>\n        <div>问候信息（输入 24 小制时间） </div>\n\
    \        <script>\n            function myfunction(){\n                var time\
    \ = document.getElementById(\"time\").value;\n                if(time<12){\n \
    \                   var greet = \"早上好\";\n                    document.getElementById(\"\
    demo\").innerHTML = greet;\n                }else if(time<16){\n             \
    \       var greet = \"下午好\";\n                    document.getElementById(\"demo\"\
    ).innerHTML = greet;\n                }else{\n                    var greet =\
    \ \"晚上好\";\n                    document.getElementById(\"demo\").innerHTML =\
    \ greet;\n                }\n            }\n        </script>\n        输入时间：<input\
    \ type=\"text\" id=\"time\" name=\"time\" /><br>\n        <p id=\"demo\"></p>\n\
    \        <input type=\"button\" onclick=\"myfunction()\" value=\"检查资格\">\n   \
    \ </body>\n</html>\n```\n\n### Switch 语句\n\n当有多个条件时，可以使用 `switch` 语句。它根据表达式的值执行不同的代码块。`default`\
    \ 在在所有条件都不满足时执行。\n\n语法：\n\n```javascript\nswitch(expression) {\n    case x:\n\
    \        // 当表达式匹配 x 时，将执行代码块。\n        break;\n    default:\n        // 当所有条件都不满足时，将执行代码块。\n\
    }\n```\n\n示例：\n\n```html\n<html>\n    <head>\n        <title>示例</title>\n    </head>\n\
    \    <body>\n        <script>\n            function myfunction(){\n          \
    \      var today = new Date().getDay();\n                switch (today) {\n  \
    \                  case 0:\n                        day = \"星期日\";\n         \
    \               break;\n                    case 1:\n                        day\
    \ = \"星期一\";\n                        break;\n                    case 2:\n  \
    \                      day = \"星期二\";\n                        break;\n      \
    \              case 3:\n                        day = \"星期三\";\n             \
    \           break;\n                    case 4:\n                        day =\
    \ \"星期四\";\n                        break;\n                    case 5:\n    \
    \                    day = \"星期五\";\n                        break;\n        \
    \            case 6:\n                        day = \"星期六\";\n               \
    \         break;\n                }\n                document.getElementById(\"\
    demo\").innerHTML = day;\n            }\n        </script>\n        今天是：\n   \
    \     <p id=\"demo\"></p>\n        <input type=\"button\" onclick=\"myfunction()\"\
    \ value=\"检查星期\">\n    </body>\n</html>\n```\n\n## JavaScript 循环\n\nJavaScript\
    \ 循环通过改变值来多次执行一段代码。例如，你想在页面上写 1 到 1000。手动这样做需要很长时间，但使用循环几秒钟即可完成。\n\n示例：\n\n```html\n\
    <html>\n    <head>\n        <title>示例</title>\n    </head>\n    <body>\n     \
    \   <script>\n            function myfunction(){ \n                var star=\"\
    \";\n                for(var i=1; i<1000; i++){\n                    star += i\
    \ + \"<Br>\";\n                }\n                document.getElementById(\"demo\"\
    ).innerHTML = star ;\n            }\n        </script>\n        <p id=\"demo\"\
    ></p>\n        <input type=\"button\" onclick=\"myfunction()\" value=\"检查循环\"\
    >\n    </body>\n</html>\n```\n\n### for 循环\n\n在上例中，你看到循环需要三个语句。\n\n- 第一个语句：初始化值\n\
    - 第二个语句：检查条件\n- 第三个语句：增加或减少计数器\n\n语法：\n\n```javascript\nfor (statement 1; statement\
    \ 2; statement 3) {\n    要执行代码块\n}\n```\n\n在上示例中，循环从语句 1 开始，即 `var i=1`，这里我们初始化\
    \ `i` 的值，然后语句 2 检查条件，如果条件满足则执行代码块。在这里语句 3 在代码块执行后运行，然后语句 3 用于增加或减少 `i` 的值。\n\n\
    ### while 循环\n\n当我们需要在任何条件满足时执行代码块时，我们使用 while 循环。\n\n语法：\n\n```javascript\nwhile\
    \ (condition) {\n    要执行代码块\n}\n```\n\n示例：\n\n```html\n<html>\n    <head>\n  \
    \      <title>示例</title>\n    </head>\n    <body>\n        <script>\n        \
    \    function myfunction(){\n                var num=\"\";\n                var\
    \ i=1;\n                while (i < 20) {\n                    num += \"数字是 \"\
    \ + i +\"<Br>\";\n                    i++;\n                }\n              \
    \  document.getElementById(\"demo\").innerHTML = num ;\n            }\n      \
    \  </script>\n        <p id=\"demo\"></p>\n    </body>\n</html>\n```\n\n"
- fmt: "\nHere, while checks the statement, and execute the code and then increase\
    \ the value of `i` and again checks the statement and execute the code and so\
    \ on…\n\n## Do while Loop\n\n`do while` loop is used when you need to execute\
    \ the block of code atleast one time, first `do` statement works and then `while`\
    \ statement checks the condition.\n\n### Syntax\n\n```javascript\ndo{\n    This\
    \ block of code will execute.\n}while(condition)\n```\n\n### Example\n\n```html\n\
    <<html>\n    <head>\n        <title>Example</title>\n    </head>\n    <body>\n\
    \        <script>\n            function myfunction(){\n                var num=\"\
    \";\n                var i=1;\n                do {\n                num += \"\
    Number is \" + i +\"<Br>\";\n                i++;\n                }\n       \
    \         while (i < 10);\n                document.getElementById(\"demo\").innerHTML\
    \ = num ;\n            }\n        </script>\n        <p id=\"demo\"></p>\n   \
    \     <input type=\"button\" onclick=\"myfunction()\" value=\"Check Loop\">\n\
    \    </body>\n</html>\n```\n\nHere, firstly `do` statements works and then checks\
    \ the condition, if condition becomes true then `do` statement code executes.\n\
    \n## Summary\n\nYou have successfully learnt JavaScript, now make your own JS\
    \ codes and work in real working scenario. I hope you enjoyed this three days\
    \ course.\n"
