  md: '# JS-Flash API Basics


    Figure 10-2 shows the Yahoo! Maps JS-Flash API loaded in your HTML document. The
    map should be displaying hybrid map tiles of Moscow at a zoom level of 10 (about
    city level). Beneath the map are some format elements. Changing the value in the
    dropdown should change the map view type. The text area below, labeled "Event
    Output," will display the new map view as it changes.


    # How It Works


    As in the previous example, the initial code in the exercise sets the placements
    and instantiates the map object. The map view type is passed when the map object
    is created, setting it to use hybrid tiles.


    The dropdown element calls the mapView() JavaScript function through the onClick
    handler. Within this function, the setMapViewType method is called against the
    map instance, passing the newly selected map type.


    Once the map view type is changed, the mapChanged event fires and its view property
    is displayed in the form''s text area. This will relay the newly modified map
    type.


    # Map Positioning Methods and Events


    This set of basic methods enables you to control the positioning of the map. In
    addition, these methods allow you toggle built-in functionalities of the API.


    # setCenterById()


    The setCenterById() method accepts two parameters, address and duration. A successful
    address is a full street address with city, state and ZIP. (Certain major metropolitan
    areas will work well.) The address is converted by the API geo-coder to a latitude/longitude
    and the map reloads its tiles and centers on value.


    To handle this transition smoothly, you can use the duration parameter to tell
    the API how long it should take to pan from its current position to the new one
    you have defined. The duration parameter is the number of milliseconds the map
    will pan to.


    ```

    map.setCenterById(address, duration);

    ```


    This example shows what the code would be like to change the address to Casablanca
    and pan from its current location for 300 milliseconds:


    ```

    var address:String = "Casablanca"

    var duration:Number = 300;

    \myMap.setCenterById(address, duration);

    ```


    # setCenterByIdAndZoom()


    Developers looking to change the map location and zoom level in one shot have
    some options. setCenterByIdAndZoom() is a very capable method and combines the
    power of setCenterById() with setZoomLevel().


    101'
