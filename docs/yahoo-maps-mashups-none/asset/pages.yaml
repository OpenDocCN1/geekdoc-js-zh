    It also needs to consider its initial address or latitude/longitude and load tiles
    for that location. Once all this occurs, the map fires EVENT_INITIALIZE, signifying
    that it is ready to receive code.


    In order for the application to list for EVENT_INITIALIZE, a method called addEventListener
    must be added to the map''s instance. This method accepts two parameters: the
    event (com.yahoo.maps.api.flash.YahooMap.EVENT_INITIALIZE) and what method to
    call when the event is detected (onInitMap).


