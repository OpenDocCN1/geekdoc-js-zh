  md: '# Chapter 11


    # Marker Methods and Classes


    This small set of methods represents the most used functions featured in mashups:
    adding markers. Each method enables you to ultimately control the location and
    appearance of every marker you add on the map.


    # addMarkerByAddress()


    This method lets you add markers to a location using an address:


    ```

    mapInstance.addMarkerByAddress(markerClass, address, data);

    ```


    The markerClass parameter defines what type of marker you are adding. To successfully
    add a marker you must import the class of the type you refer to in this parameter.
    The various markers, reviewed in the following sections, carry unique functionality
    and presentation attributes.


    An address variable must be passed in order for the marker to be added with this
    method. The address will need to be geo-coded, so this method does not process
    as quickly as its latlon counterpart. If you intend the marker to appear in the
    center of the map, you may use setCenterByAddress() with the same address.


    Finally, the properties of the markerClass you choose must be defined in the last
    parameter. As you see in the following sections, each marker class carries with
    it different properties that are defined when this data object is created.


    # addMarkerByLatLon()


    This method lets you add markers to a location using a latitude/longitude coordinate:


    ```

    mapInstance.addMarkerByLatLon(markerClass, latlon, data);

    ```


    Working in the same way as addMarkerByAddress(), the markerClass parameter is
    the type of marker you are adding. The types can vary within the same mashup but
    require their respective classes to be imported.


    The second parameter defines the location at which the marker will be added. The
    Latlon class must be imported or referenced in order to properly cast the latitude/longitude
    coordinates into a Latlon object.


    Once again, the properties of the markerClass you choose must be defined in the
    last parameter. These properties will be discussed with each marker class in the
    following sections.


    # CustomPOIMarker


    POI stands for point of interest. This class lets you add a marker with the custom
    properties of index, title, description, marker color and stroke color. The two
    color properties reflect the body of the marker and its border respectively. These
    properties let you make the marker look the way you want without having to create
    a completely new marker. Although that feature is available with the JS-Flash
    API, which you will see later in the chapter, this marker class is an efficient
    means of customizing.


    Another feature of this marker class is expandability. This replicates a feature
    offered by standard markers, in that as user rolls over the marker, it expands
    to reveal more detail. As part of this feature, this'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# JS-Flash API Advanced Features


    class includes open() and close() functions that let you control the marker with
    other code based on user interaction.


    # WaypointMarker


    A waypoint is a reference on the map, often used in navigation to plot points
    along a route. This class lets you plot waypoints as markers. It is a very simple
    class, with no customization other than the ability to define it. If you are familiar
    with the consumer offering of Yahoo! Maps, you will recognize the waypoint marker
    as the same indicator to use points along driving routes.


    Because the API does not support driving directions, you will find other very
    useful ways to use the WaypointMarker class. These include plotting points along
    cruises, flights, running paths, bike races and walking trails.


    The class has two methods that let you modify the marker after it has been added.
    The currentIndex() lets you change the index displayed in the marker. The getArrayIndex()
    returns the string representing the current index set to the marker. As mentioned,
    the index is initially set when the marker is added, so the getArrayIndex() can
    be called once the marker is added.


    # CustomImageMarker


    This class lets you add an image or SWF anywhere on the map as a marker. This
    is a slightly more approach than the CustomPolyMarker discussed earlier, in that
    an image or SWF that you create becomes the marker. The marker you add is completely
    of your own design, the only property of this class is the url of the image (JPEG)
    or SWF you create.


    Unlike with the CustomPolyMarker, this class does not inherently have the feature
    of expandability or the open/close functions. This may confuse users familiar
    with the common functionality of a marker. On the other hand, depending on the
    focus of your mashup, you may find an image or content-driven SWF to be much more
    useful in your application.


    When the API adds a marker, it creates an empty movie clip at location. The image
    or SWF mapped is loaded into that space, appearing at the precise marker location.
    The benefit of creating an SWF as a customImageMarker instead of a JPEG is that
    JPEG images do not support transparency. While you can interact if your customImageMarker
    is an SWF, I recommend that you leverage the CustomSWFMarker class coming up next.


    # CustomSWFMarker


    This class provides one of the key capabilities of the Flash APIs, it lets you
    develop and design your own interactive marker in the form of an SWF. Once the
    marker is added to the map, this class lets you a method, callCustomMethod, against
    the marker itself. This means you have control over the marker after you have
    added it.


    When adding a customSWFMarker, you need to pass some additional properties. At
    the end of the addMarkerByLatLon or addMarkerByAddress method must include the
    URL of the customSWFMarker you are adding. An additional property ref can also
    be passed to sync sync with other data later in your code.


    ```

    mapInstance.addMarkerByAddress(CustomSWFMarker, (url, ref));

    ```


    ![](img/1617eb1f737d2e225712aa0e0bbc3d21_138_0.png)'
