- img_proc: true
  md: '# Developing with Yahoo! Maps


    What makes Flickr such a great source for mashups is such very comprehensive API.
    The API consists of a great catalog of methods with which to search for and get
    much of the attributes associated with a photo. These attributes range from a
    tag on the photo to the date it was taken, who uploaded it and what set it may
    belong to.


    Flickr works great with mashups because so many photos are uploaded with tags
    referencing geo-spatial information. In, many photos have tags that let you know
    where they were. Mashups show a series of photos as a marker. With the Flash API,
    you can build a customSWFMarker that lets users browse through sets of photos
    in a sleek interface. That marker is plotted at the very place was taken, the
    place that it is associated with.


    # Upcoming.org


    One of the web''s premiere calendar applications is Upcoming.org. Upcoming is
    free and enables anyone to enter information about any event for public consumption.
    Users can log an event anywhere in the world, from Lithuania to Luxembourg. When
    someone adds a new event, event attributes as category, start date and time, end
    date and time, name description and event URL are collected. The site offers a
    list of venues to which you can assign your event. If your venue isn''t listed,
    you can add it through a very simple interface.


    There is a unique social aspect to Upcoming. When adding an event, you can specify
    if it''s personal or private or even self-promotion. Once the event is added,
    you and other users on Upcoming can find and register members as attending. Others
    can leave a comment on the event.


    Upcoming''s value as a mashup service lies in the information collected when an
    event is logged. The venue information, whether previously existing or newly entered,
    includes a precise location. Like Flickr''s API, Upcoming gets you access to events
    and their locations. These events can easily be depicted as markers or markers
    in overlays. Data can be retrieved in such a way as to allow the event title or
    venue to be displayed by default. When a user engages with the marker, additional
    information on the event or venue, such as address and date, can be displayed.


    # HotJobs


    HotJobs is another location-based web site that is very friendly with map APIs.
    The service lets employees post jobs for free and invites job seekers to search
    postings for free. It is a very simple model, one that has very successful for
    several sites like


    Users search job openings by keyword, location (city, state or ZIP) or category.
    You can expand the search to include surrounding cities as well. A useful addition
    to HotJobs is the search agent. This feature lets you save a search you make,
    register your email and receive notifications as jobs that meet set of criteria
    are posted. Additional resources like career tools and topics on résumés, interviewing,
    networking and salary calculations round out a very helpful resource.


    A good mashup scenario involving HotJobs is not hard to imagine. People move often
    and need to find new jobs. Pulling HotJobs data through its API and displaying
    those data in the Yahoo! Maps API helps users gauge the distance between potential
    jobs and where they rent or buy home'
  merge: -1
