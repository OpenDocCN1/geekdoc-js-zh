  md: "# Chapter 20\n\n# Set Methods\n\nThese basic methods are responsible for changing\
    \ properties of the map. You will recognize quickly that the naming convention\
    \ of these methods reflects exactly what each method does. This is to make it\
    \ easy to code with them as well as for other developers to identify their purpose\
    \ in your application.\n\n# setCenterById()\n\nsetCenterById() method accepts\
    \ two parameters, address and duration. A successful address is a full street\
    \ address with city, state and ZIP. (Certain major metropolitan areas will work\
    \ as well.) The address is converted by the API geo-coder into a latitude and\
    \ longitude, and the map reloads its tiles and center on value.\n\nTo handle this\
    \ transition smoothly, you can use the duration parameter to tell the API how\
    \ long it should take pan from its current position to the new one you have defined.\
    \ The duration parameter is the number of milliseconds the map will take to pan.\n\
    \n```\nmapInstance.setCenterById(address:String, duration:Number);\n```\n\nThis\
    \ example shows what the code would be like to change the address to San Francisco\
    \ and pan from its current location for 300 milliseconds:\n\nFor the Flex class:\n\
    \n```\nvar address:String = \"San Francisco\"\nvar duration:Number = 300;\n```\n\
    \n```\nmapConnector.setCenterById(address, duration);\n```\n\nFor the MapConnector\
    \ class:\n\n```\npublic function setCenterById(address:Number, duration:Number):void\
    \ {\n    send(\"_flashClient\", setCenterById(\", { address:address,nduration:duration}));\n\
    }\n```\n\nFor the Flash class:\n\n```\nmyMap.setCenterById(address, duration);\n\
    ```\n\nSome useful events are fired when setCenterById() is called. EVENT_MAP_GEOCODE_SUCCESS\
    \ is dispatched when the API has successfully geoded the address passed in and\
    \ has resolved it as a latitude/longitude coordinate. If the address entered cannot\
    \ be geo-coded, the EVENT_MAP_GEOCODE_ERROR is broadcast. If this should happen,\
    \ an array of suggested addresses will be sent as a data object with this event\
    \ along the originalAddress. You can use the message attribute returned with this\
    \ event to alert users to try a new address or select a suggested one. Because\
    \ international geo-coding recognizes so many variations of city names, it is\
    \ difficult to generate a geo-coded error event."
