  md: '# Chapter 22


    # The Flash Client


    To build the Flash client, as you have done in previous chapters, you will need
    to use the Flash IDE to compile the AS-Flash API. The Flash client of the application
    contains the API component attached to its stage. When compiled, all the classes
    and functionalities of the map API will become available to the application. To
    allow the Flash client to talk to the Flex client, you will add some simple lines
    of code to enable the local connection. This will allow it to receive calls from
    the Flex client interface and control the map accordingly.


    # Architect the ActionScript


    Just as with XML, it is a good practice to architect the Flash client piece of
    the application. This step is an even better idea on the Flash side since it involves
    thinking out the user elements that may exist by way of the visual authoring approach
    with the Flash IDE. While this mash does not contain any Flash-based interaction
    elements, other than the map itself, this is still a very helpful step. The tasks
    to complete the Flash client are


    +   1. Import all the classes that the map will need.

    2. Create a local connection instance and register the Flex client.

    3. Add event listeners to field events broadcast from the map instance.

    4. Field the map instance events and set initial map properties.

    5. Build functions to handle local connection calls and return data as necessary.


    # Importing the Classes


    The first step to building the ActionScript for the Flash client is importing
    the classes:


    ```

    //Import PanTool class

    import com.yahoo.maps.tools.PanTool;

    ```


    ```

    //Import CustomPOIMarker class

    import com.yahoo.maps.markers.CustomPOIMarker;

    ```


    ```

    //Import LatLon class

    import com.yahoo.maps.LatLon

    ```


    Here you have imported the PanTool class that will allow your users drag the map
    around. The Custom POIMarker class will enable you to add a marker of this type
    to the map. You will need the LatLon class to cast the latitude and longitude
    properties of the golf shot and center the map on that location.


    # Create the Local Connection


    The local connection is an extremely important part of the Flex 2/AS-Flash API
    approach .


    ```

    //Create local connection object

    var connectedMap:LocalConnection = new LocalConnection();


    //Connect to local connection as _flashClient

    connectedMap.connect("_flashClient");

    ```'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# The Flex 2 Mashup


    The LocalConnection class is built into Flash and does not need to be imported
    to work. The connectedMap object you are creating here will act as the local connection
    instance. You can call the method against that instance to register the Flash
    client of the application as _flashClient.


    # Add Event Listeners


    As you learned in previous chapters, events are fired at key points of the application.
    These events are often dispatched by map occurrences or user interaction.


    ```

    //Add Initialize Listener to map instance

    myMap.addEventListener(com.yahoo.maps.api.flash.YahooMap.EVENT_INITIALIZE,

    initMap);

    ```


    ```

    //Add Zoom Event Listener to map instance

    myMap.addEventListener(com.yahoo.maps.api.flash.YahooMap.EVENT_ZOOM_STOP, zoom);

    ```


    The EVENT_INITIALIZE event fires when the map initializes and calls onInitMap
    to carry on activity. You are adding the EVENT_ZOOM_STOP listener so the application
    knows when the map finishes zooming. You will see this, this is a necessary timing
    step to allow the map to center itself and zoom before changing the map type view.


    # Field Map Instance Events


    The next step is to code the pass-through functions for the events. The functions
    carry on the event and data that are picked up by your listeners.


    ```

    //Function that executes when initialize is fired

    function onInitMap(eventData)

    {

    ```


    ```

    //Add the PanTool to the map instance

    myMap.addTool(new PanTool(), true);

    ```


    ```

    //Position map to show Sunol Valley Golf club

    myMap.centerByAndZoom("7000 Mission Road, Sunol, CA", 2, 0)

    ```


    ```

    //Send init via local connection

    connectedMap.send("_flashClient", "mapInitialized");

    }

    ```


    ```

    //Function that executes when map is zoomed

    function onZoom() {

    myMap.setViewType("satellite");

    }

    ```


    The onInitMap function will add the pan tool and center the map to its initial
    address. It will also call to the local connection instance that the map has initialized.
    This local connection depends on this occurrence to permit communication back
    to the Flash client. You may recall the conditional in the MapConnector class
    that establishes this.


    The onZoom function will call the setViewType against the map instance to change
    the tiles to satellite. This delay needs to occur since the map cannot handle
    changing its view type at the same time as centering and zooming.'
