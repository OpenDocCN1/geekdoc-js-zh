  md: '# The Ajax API


    The Ajax API shares two key benefits with the JavaScript API (covered from Chapter
    8, "The JS-Flash API" through Chapter 12, "The JS Mashup"). First, since Yahoo!
    hosts the classes, you can always access the latest version of the API by including
    them in your application through the API libraries. This means that you can always
    have access to the latest classes to code with to offer your users, simply by
    modifying the version number in the JavaScript tag. To keep up with a faster version,
    as well as the changes it features, visit http://developer.yahoo.com/maps/


    Finally, the Ajax API is a very effective means of building map mashups, as it
    does not require of coding software or server technology to work. In the simplest
    form possible, you can actually edit the files using Notepad and load them locally
    with your Internet browser. This is very convenient for someone who is not a web
    developer by trade and wants to get started building map-based web pages.


    # Summary


    This chapter introduced the Ajax API with the following key concepts:


    +   - Ajax is not a language, rather an approach combining web technologies including
    JavaScript, CSS and DHTML.


    +   - JavaScript consists of a simple syntax that enables you to work with functions
    and events.


    +   - The XMLHttpRequest object is what enables Ajax to work. It is instantiated
    differently in Internet Explorer and in other browsers.


    +   - The Yahoo! Maps Ajax API inherits the benefits of the Ajax approach, including
    a faster experience than is provided by the typical HTML documents.'
