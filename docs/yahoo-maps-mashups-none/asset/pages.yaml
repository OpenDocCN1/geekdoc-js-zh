  pgno: 302
- img_proc: true
  md: "# Chapter 20\n\nsetCenterByLon() also accepts the duration parameter. Since\
    \ there is no conversion between address and lat/lon, the panning effect will\
    \ engage you much more quickly:\n\n```\nmapInstance.setCenterByLatLon(lat:LatLon,\
    \ duration:Number);\n```\n\nYou'll notice that the latlon variable does not belong\
    \ to any of the variable types defined in the last chapter. That is the latlon\
    \ variable being passed is an instance of the map API's LatLon object. You must\
    \ pass a LatLon object as the first parameter of theCenterByLatLon() method, and\
    \ to do that, you must cast the latitude/longitude to pass as one.\n\nTo create\
    \ a LatLon object, using the coordinates 40.713696, -74.00564 for New York City,\
    \ you must import or reference the LatLon class. The following code demonstrates\
    \ this using the setCenterByLatLon() method:\n\nFor the Flex client:\n\n```\n\
    var LatLon:Object = new com.yahoo.maps.LatLon(40.713696, -74.00564);\nvar duration:Number\
    \ = 300;\n```\n\n```\nmapConnector.setCenterByLatLon(latlon, duration);\n```\n\
    \nFor the MapConnector class:\n\n```\npublic function setCenterByLatLon(latlon,\
    \ duration:Number):void\n{\n  send(\"_flashClient\", \"setCenterByLatLon \\ {latlon:latlon,\n\
    \  duration:duration});\n}\n```\n\nFor the Flash client:\n\n```\nmyMap.setCenterByLatLon(latlon,\
    \ duration);\n```\n\n# setCenterByLatLonAndZoom()\n\nLike setCenterByAddressZoom(),\
    \ this method gives you access to a lot of functionality in one shot. The scene,\
    \ reviewed before, is slightly different as no address must be converted to latitude/longitude;\
    \ if you have selected this method, you already know the latitude and longitude.\
    \ As a result, like its simpler counterpart setCenterByLatLon(), works a bit more\
    \ efficiently, generating faster results.\n\nThe order of operation for this method\
    \ is as follows:\n\n+   1. The method is called:\nmapInstance.setCenterByLatLonAndZoom(latlon:LatLon,\
    \ zoomLevel:Number,\nduration:Number);\n2. The map pans based on the duration,\
    \ in milliseconds, defined in the duration parameter.\n3. The map centers on the\
    \ resolved latitude/longitude coordinate.\n\n276"
