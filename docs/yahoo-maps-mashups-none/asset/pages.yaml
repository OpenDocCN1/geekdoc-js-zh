  md: '# The AS-Flash API


    “There is more in the diary than just the map.” — Indiana Jones and the Last Crusade,
    1989


    It is time to explore ActionScript (AS-Flash) API. This is the Yahoo! Maps API
    that leverages the power of Flash and ActionScript. This chapter discusses the
    fundamentals of ActionScript, Flash and the AS-Flash API, including


    +   - What is the AS-Flash API is


    +   - The Flash IDE and how it''s used


    +   - Fundamentals of ActionScript 2


    +   - Benefits of the AS-Flash API


    # What Is the AS-Flash API?


    In the previous chapter I began to sing the praises of Flash as a premiere visual
    and dynamic application platform. Now that we are discussing the AS-Flash API,
    it''s time to delve deeper into what makes Flash, well, flashy.


    This chapter is designed to give you some essential background on Flash. One of
    the benefits of the AS-Flash API is that you can start developing right away without
    very much knowledge of coding in Flash.


    However, the more you know, the more you can take advantage of the creative flexibility
    provided by the Flash IDE (integrated development environment). This ability of
    Flash is what has made it such a successful tool for designing and developing
    some of the web''s most engaging applications.'
