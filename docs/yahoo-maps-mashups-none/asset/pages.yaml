  md: '# Chapter 19


    If you have already registered an AppID, you can still register a new one for
    each API you will use. Here are the steps to getting your Yahoo! AppID:


    +   1. Open your browser and go to http://api.search.yahoo.com/webservices/register_application.

    2. You may be prompted to log in with your Yahoo! user account. If you do not
    have an account, you will need to get one as instructed.

    3. After log in, your username will be displayed next to the words "Yahoo! id."

    4. Enter your desired application ID (AppID) in the field marked "Requested application
    id."

    5. You can provide an e-mail in "Alternate email (optional)." By default, the
    e-mail you provided with your Yahoo! account will be associated with your AppID.
    Refer to Figure 19-1.


    ![](img/1617eb1f737d2e225712aa0e0bbc3d21_283_0.png)


    Figure 19-1


    Write down or save the AppID somewhere. You will need it later in this chapter.


    # Software Requirements


