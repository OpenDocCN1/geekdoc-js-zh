    # Summary


    This chapter introduced you to the more advanced classes and methods available
    in the Ajax API. To get ready for building the mashup in the next chapter, here
    is what you learned:


    +   - There are two methods for adding markers. Marker() places a simple marker
    on the map while addOverlay() enables you to add a customizable HTML marker. You
    can also add an image as a marker using the Yimage class.

    - Tools can help you save time by adding prepackaged button interfaces to your
    map. The tools you can help you save time by adding prepackaged button interfaces
    to your map. The tools you can add will let the user change map type, pan with
    precision and zoom with or without a slider feature.

    - Very little coding is needed to add the dynamic feature of overlays. The YPolyline
    overlay class can connect specified points on the map with a line in the style
