  md: "# Chapter 8\n\n```\n/*\n * This is a good way to\n * comment out multiple\n\
    \ * lines of code.\n */\n```\n\n# Functions and Methods\n\nA function is a means\
    \ of executing a task in JavaScript. A key benefit of coding a function, as you\
    \ learned earlier in this chapter, is that it can become available to your entire\
    \ application. Using functions can save you lot of time if there are tasks that\
    \ will be called more once.\n\nFunctions accept parameters, values that can be\
    \ passed when the function itself is called. This example shows the sample method\
    \ to pass the URL to as a parameter:\n\n```\n<html>\n<head>\n<title>Javascript\
    \ > New Window</title>\n<meta http-equiv=\"Content-Type\" content=\"text/html;\
    \ charset=iso-8859-1\">\n<script language=\"javascript\">\nfunction newWindow(url)\
    \ {\n  launchWindow = window.open(url, \"newWin\",width=800,height=600)\n}\n</script>\n\
    </head>\n<body>\n<a href=\"javascript:newWindow('http://www.mashupeperts.com')\"\
    >Launch Window</a>\n</body>\n</html>\n```\n\nInstead of the URL being coded inside\
    \ the function, it is now passed into the function as the URL parameter. This\
    \ is a much better practice, as it generalizes the function you should want to\
    \ call it in other places and have it different URLs.\n\nIn the JS-Flash API,\
    \ internal functions of the API are exposed to you when the classes are imported\
    \ as methods. These methods can be called against the map container instance to\
    \ control the map. Methods are so important in working with the API that each\
    \ API featured in this book has a chapter dedicated to reviewing the methods available.\
    \ As you learned with functions, you can pass parameters with methods like order\
    \ or location to change the map's location.\n\n# Events\n\nEvents are an important\
    \ and often overlooked feature of JavaScript. They represent user interactions\
    \ or code occurrences that can be further handled by additional functions. Events\
    \ are executed by means of event handlers. An event handler is the script that\
    \ executes when an event occurs. An example of an event is a user moving the mouse\
    \ over an element, like an image. The user action will fire called onMouseOver.\
    \ The event handler would look something like this:\n\n```\n<img src=\"someImage.jpg\"\
    \ onMouseOver=\"newWindow('someImage.jpg');\"\" />\n```\n\nThis code will call\
    \ the newwindow function, passing the image as a parameter when it is rolled over\
    \ with the mouse."
