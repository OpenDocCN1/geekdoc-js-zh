- img_proc: true
  md: '# Your Map, Your World


    > “When I have the map, I will be free, and the world will be different,

    because I have understanding.” —Time Bandits, 1981


    This chapter discusses


    +   - What map APIs are

    - What map applications can do

    - The core principles of map technology, including map projection and scaling

    - Why Yahoo! offers three types of map APIs


    # What Is a Map API?


    As an avid web user, you probably use map applications the time, even daily. Map
    applications, like the Yahoo! Maps beta enable millions of users to find locations
    by address, get directions and search for businesses based on location. These
    useful applications become some of the most popular and desirable sets of functions
    on the web.


    As a developer, you have probably worked with APIs. API stands for application
    programming interface. It is an interface for programming an application, a collection
    of functions to program against. An API, like the Yahoo! Maps API, is designed
    to expose key functionality as functions that, when simply added to your application,
    enable you to access and control the features of the application. In the coming
    chapters you will see that many API calls, like setCenterAddress(), setZoomLevel()
    and setMapViewType(), are named after their respective functionalities.


    A map API enables you to develop with much of the useful and dynamic functionality
    of map applications. When it is combined with your existing application, your
    users will benefit from unparalleled, very useful features.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Chapter 1


    # The Four Types of Map APIs


    Yahoo! released version 3 of its Maps in November 2005, and with it a new wave
    of map APIs. Your development world is truly about to expand as you learn about
    each API. There is an Ajax API and two Flash-based APIs, and each type or flavor
    of API features its own set of characteristics. The technology behind each API
    flavor leads to some unique benefits, and as a result, the basic and advanced
    functionalities vary while offering many of the core features. The most distinct
    thing about each API is the way it is implemented.


    The Ajax API is known for its universal adoption and browser compatibility. This
    API was very skillfully built and has benefited from tremendous support. Ajax
    is spreading widely across the web and has been key in what has become known as
    the Web 2.0 revolution. Its ability to send and receive data without the browser
    refreshed has changed the way map applications are used on the web.


    The three Flash APIs, while implemented differently, are all built on a similar
    code base. There is a JavaScript implementation, which implements almost identically
    to the Ajax API. When Flash is used as an optimal rendering engine, calls to this
    API are made via JavaScript and then channeled into the Flash.


    The AS-Flash API requires you to develop with the Adobe (formerly Macromedia)
    Flash IDE. However, with this requirement comes the ability to control the appearance
    of the map in a way that no other API can offer. The Flash IDE enables you to
    work with the API instance on Flash''s stage, as well as with the programmatic
    instantiation of the API through ActionScript 2.


    Flex is a framework on Flash that allows extremely easy control of user interface
    (UI) elements with a language called Mxml. Flex still requires more use of ActionScript,
    it provides an environment that allows much more rapid deployment. A big strength
    of Flex is its ability to bind control elements with dynamic data sources. With
    the Flex API, you can build what are considered more enterprise-level applications.


    With either the AS-Flash or Flex APIs, you will find it very easy to integrate
    UI elements alongside the map, or blend them within it. This creates a seamless
    and rich user experience, ensuring that your application will be well received
    by your users.


    While each API has its own benefits, the Flash-based APIs offer some very special
    functionality. As you will see in the introduction to map features and tools in
    Chapter 2, “Developing with Yahoo! Maps,” offers several ways to create your map
    application.


    # Understanding Map Technology


    To build a map with Yahoo!’s APIs really requires very little, if any, understanding
    of map technology. The more details you understand, the however, the better you''ll
    be to make your map application.


    The first concept is that of map projection. Most people know the world is round,
    just like globes in elementary school classrooms. Yet online maps, as we provide
    for driving directions, are flat. From the spherical presentation of Earth to
    a flat one is called projection. If you were to merely peel off of a globe and
    put it on paper, each piece would connect only at the equator. In other words,
    you could lay each piece of the globe side by side, but you would see gaps grow
    between the pieces up and down from the middle.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'A projection model called Mercator, named after the sixteenth-century Flemish
    cartographer, solves this problem. This concept of map projection maintains consistent
    with different pieces of a globe. However, to fill in the gaps above and below
    the equator, Mercator stretches the north and south of the map. As you move further
    away from the equator in each direction, the depiction of Earth on the map is
    gradually stretched. This provides a rectangular representation of a map, one
    that fills the window of a browser and the screen on your monitor. See Figure
    1-1.


    ![](img/1617eb1f737d2e225712aa0e0bbc3d21_30_0.png)


    Figure 1-1


    Another concept in mapping technology is scaling. Scaling simply enables you to
    relate the distance on a map to actual distance on the ground. Take a look at
    any map. You will probably see a pair of lines, usu- on the bottom-left corner,
    showing the distances that represent miles and kilometers on the map. In dynamic
    web-based maps, the scale changes as you zoom in and out of the map.


    # # Common Map Features and API Tools


    Because many of the features in Yahoo! Maps are offered in the APIs, your users
    will likely be familiar with what they come in your applications. Before building
    your application and implementing the map APIs, it is important to get an overview
    of the tools that make map applications work. These are many of the fundamentals
    you will build on creating your map applications with Yahoo! Maps APIs.


    # # Map and Satellite Imagery


    At the core of the map application is the map itself. In most map applications,
    including Yahoo! Maps, map images are displayed with a combination of tiles. These
    tiles represent portions of the map cut into fixed sizes and served to the application.
    When these tiles are combined, they form the viewable map area. To keep the application
    running efficiently, only those tiles in view, as well as some additional rows
    and columns of tiles, are downloaded as a buffer.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Chapter 1


    The Yahoo! Maps API offers three different view types and, with these, three different
    sets of image tiles. The default view, map, presents the standard map. These tiles
    combine two elements. First is the labels layer, displaying street, landmark and
    area names. Landmark labels include parks, lakes, shopping-mills, learning institutions
    and railroad tracks, to name a few. The second element is a layer of color-coded
    areas. An array of simple colors is used to indicate with exceptional accuracy
    the size and location of water, roads, commercial zones and recreational areas
    such as ballparks and marinas. Both elements are generated from data and keep
    the maps fairly small in size.


    The satellite view, perhaps the most fascinating element of web-based map applications,
    the layer made up of aerial images. These mostly taken from a satellite, give
    us a unique perspective on our world. The ideal satellite view will be taken with
    no clouds and with little angle as possible.(In some cities, like New York or
    Chicago, angles that cast shadows are inevitable due to the height of buildings.)Satellite
    images are larger in size than map images, as they feature high-resolution photography.
    Unlike the map layer, satellite images are cut up into smaller pieces. This allows
    the map application to download the tiles progressively as opposed to downloading
    one image.


    The hybrid view is a combination of both map and satellite layers. This provides
    a very effective feature. Street names and labels are displayed on top of satellite
    images, providing more detailed information and removing some of the obscurity
    satellite tiles by themselves. While the satellite layers in the hybrid view are
    the same, the map layers are slightly different. The second element is removed,
    which creates a transparent effect in the map layer, letting the satellite imagery
    over the street, landmark and area names on top.


    In the map application, a set of buttons enables the user to toggle between map-view
    types. Working with the API, you can set the map-view type as a default parameter,
    allowing your users to see either the map, hybrid or satellite layers by default.
    There are several ways to introduce controls that allow toggling between layers.
    In addition to creating your own buttons with calls like getMapViewTypes(), you
    can also add a satelliteControlWidget that mimics the buttons in the Yahoo! Maps.


    # Zooming


    Maps have zoom capability to allow the user to display different magnitudes of
    the same layer. With the satellite images, photographic layers are compiled at
    several different distances. The map''s layers are rendered at these respective
    distances as well. The action of moving between these layers, moving your view
    of the map closer and farther away, is zooming.


    Past HTML and JavaScript-based map applications included zooming. However, when
    zoom levels changed, the application needed to completely refresh, loading the
    new layer. Yahoo! Maps APIs allow zooming that does not require the browser to
    refresh. Flash APIs also feature a much dazzling effect. As the user zooms from
    one distance to the next, the layers actually fade into one another, creating
    a very attractive transition effect.


    There are 16 zoom levels enabled in the APIs. Zoom levels are changed by the user
    using the zoom-bar, a user interface that usually features plus and minus buttons.
    The plus buttons zoom in and the minus buttons zoom out. In the Flash APIs, a
    slide mechanism is placed between the buttons of the zoombar. When the slider
    is selected and moved up or down, to the scrollbar on the side of a web browser,
    the map will respond by zooming in and out accordingly.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Your Map, Your World


    The zoom level can be set by default when the API loads. By calling methods like
    setZoomLevel(), you can programmatically modify the zoom level of the API instance.
    Methods like setCenterByAddressAndZoom() enable you to move the map to a new destination
    as well as to prompt a zoom level change. In the Flash APIs, changing zoom levels
    by calling the API methods will induce the transition effects. See Figure 1-2.


    ![](img/1617eb1f737d2e225712aa0e0bbc3d21_32_0.png)


    Figure 1-2


    # Panning


    A key functionality of web-based map applications is the ability to pan. Commonly
    referred to as making the map draggable, *panning* is the action of moving the
    view of the map in any direction. You may be surprised to know that this feature
    is overall fairly new to map applications. In fact, several map applications still
    do not have panning abilities. Traditionally, maps without panning require you
    to click on the direction in which you want to move the map. Once you choose the
    direction, the application must refresh to create new tiles. Yahoo! Maps and the
    API feature very well implemented ability to pan, and you can do it in several
    ways.


    In film and television, panning is the technique of moving a camera to create
    a sweeping shot. The effect is called *panoramic*. Panning applied to maps creates
    a transition so the map within the API moves with the component container moving
    around the screen. In the API, this is achieved by the masking capabilities of
    Flash.


    The best way to pan is to click the map with your mouse and drag it around. Effectively,
    what you are doing is moving the map view layer, with all its tiles. Because the
    map view layer downloads tiles as it needs them, panning far enough in any direction
    will likely prompt the application to download and display additional tiles. A
    buffer exists to be displayed so the application has tiles to show as you pan
    beyond the initial downloaded layer.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Chapter 1


    A less discoverable, but very effective, way to pan over the map is with your
    arrow keys. Using your keyboard, the map will pan in the direction of the arrow
    key you press. Those users who like to use shortcut keys will find this very suitable.
    Like an airplane''s throttle, each key actually moves the map in the opposite
    direction. Pressing the up-arrow and right-key simultaneously will move the map
    diagonally.


    When working with the API, you can adding functionality as addTool(). One of the
    advantages of using the Flash APIs, as we will explore, is the support of a hand
    icon instead of a mouse cursor. This adds better discoverability to the panning
    feature, as users know what areas they can drag.


    # Geo-coding


    A map''s ability to plot an address is called geo-coding. By means of sophisticated
    backend technology capable of correlating countries, states, ZIP codes, streets
    and street addresses, an address is turned into latitude and longitude. You may
    remember latitude and longitude (referred to in maps development) as lat/lon from
    elementary school. Lat/lon are the axes of a map.


    Since most developers don''t know lat/lon coordinates by heart, the map APIs offer
    built-in geo-coding. This means you can pass an address in the API''s initial
    parameters, then that address will be converted by the server to lat/lon, and
    the API instance will display and load to that location. You can call a method
    setCenterAddress() to perform a similar function and change the address during
    runtime.


    If you know what lat/lon is, you can set that for when the API loads. By using
    methods setCenterLon(), you can change the location the map centers on. A method
    getCenter() returns a Lat object representing the center point of the map. In
    the event that an address returns an error, the sophisticated API will likely
    return a SuggestedAddress or an array of them. This can be provided to your users
    and help them narrow down address selection.


    # Markers and Custom Markers


    Markers are locations plotted on a map at specific locations, indicated with icons,
    images and media. They are placed at lat/lon coordinates derived from the server
    on an entered lat/lon or address. Acting as indicators, markers can represent
    several aspects of data being shown on maps.


    Yahoo! APIs offer several ways to display markers, using methods like addMarkerAddress
    and addMarkerByLon. More impressive are the type of markers you can add and features
    of out-of-the-box interactivity when the user rolls over it. When the user engages
    this type of marker, a dynamic title will be shown. These markers can be defined
    with custom colors.


    CustomImageMarkers let you define a marker with a JPEG or SWF file. However, with
    the Flash API you have an even better option. Using CustomSWFMarker not only defines
    a marker with a custom SWF, but also lets you call methods on SWF with callCustomMethod.
    Basically, you can create your own Flash and serialize it as your marker. This
    feature will be explored more in later examples found in Chapter 16, "AS-Flash
    API Advanced Features." For now, look at Figure 1-3.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# # Your Map, Your World


    ![](img/1617eb1f737d2e225712aa0e0bbc3d21_34_0.png)


    # ## Overlays


    Adding an overlay to the map creates another layer that stays with the map as
    it pans and zooms. An overlay can contain various elements, all displaying on
    a transparent layer above the map. When you add a set of markers to an overlay
    instead of that, you can control them collectively, hide () and show().


    Packaged with the Flash API are two powerful overlays, LocalSearchOverlay and
    TrafficOverlay. LocalSearchOverlay adds the ability to search Yahoo!''s powerful
    database. Your users will be entering local search criteria and a method search().
    Based on those criteria as well as the center/lon of the map, the API will take
    data returned from the server and add a set of markers representing several local
    findings. The markers in the overlay will display the business name and, when
    engaged by the user, will display address, contact and rating information for
    establishment.


    The TrafficOverlay add some very useful information technology to the API. When
    activated, this overlay displays special markers, based on the map''s location,
    featuring traffic incidents such as accidents and closed roads.


    The possibilities of the overlay are limitless. As you will learn, the results
    from many data sources can be neatly and effectively contained within an overlay.
    Like markers, the API offers much customization with classes like CustomSWFOverlay.


    # ## Navigation


    An API element found only with the Flash APIs is the NavigatorWidget. This represents
    a unique set of user interfaces that provides users with an intuitive means of
    moving the map around. The NavigatorWidget consists of two elements, a zoomable
    and a miniature version of the map, called mini-map.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Chapter 1


    The zoombar handles much like the one we discussed in the earlier section “Zooming.”
    There are two buttons, a plus button and a minus button, which handle zooming
    in and out respectively when pressed. The slider in the middle is draggable and
    changes the zoom level of the map as it is pressed and dragged.


    Adding to the panning ability of the map is the mini-map element of the NavigatorWidget.
    Featured here is a smaller version of the map, displaying a bird’s-view of the
    main viewable area. Just like the main map, the mini-map also consists of layers,
    but it is restricted for usability reasons to displayed map tiles. Hovering within
    the mini-map is a distinct gray rectangle. When clicked and dragged within the
    boundaries of the mini-map, this square prompts the map to pan along with it.
    Another feature that usually goes unnoticed is that this gray actually maintains
    the ratio of the main map when the browser window is resized. See Figure 1-4.


    ![](img/1617eb1f737d2e225712aa0e0bbc3d21_35_0.png)


    Figure 1-4


    # Summary


    In this chapter, you learned the following:


    +   - What a map API is and the basics of its application

    - The three flavors of Yahoo! Maps APIs and their respective technologies that
    will be covered in this book

    - Projection and scaling map technologies

    - Several of the common features of map applications and the map APIs

    - How map tools and interfaces work in the map APIs'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# # Developing with Yahoo! Maps


    In the last chapter, you learned what map applications and their APIs can do.
    As stand-alone applications, they are more than engaging. Now we''ll explore how
    applying various technologies and a wealth of online data to map APIs will form
    a mashup.


    This chapter discusses


    +   - What a map mashup is

    - Keys and fundamentals of mashup technology

    - A sampling of free online data sources primed for map mashups

    - How Yahoo! supports you in development with the map APIs


    # ## What Is a Mashup?


    Think of a mashup as a web cocktail, a mixture of two or more sources of content
    that creates a new web application. To understand mashups and the spirit of them,
    you must first understand Web 2.0. Over the past five years, web developers have
    begun to use dynamic technologies and concepts like Ajax, Flash, PHP and content
    syndication in order to build more collaborative and rapid-publishing applications.
    The fruit of this innovation is the wealth of blogs, free APIs, comment-driven
    sites and wikis enjoying on the web today.


    Many of the Internet giants, the Yahoo''s and ebays of the web, have realized
    to give data away is to promote the depth of their own sites. Web developers are
    enjoying unprecedented access to the very data and programming interfaces that
    were once locked up by such successful web pioneers. Access to this content is
    granted almost completely free, with little monitoring, so that you can combine
    it with your own web application.'
  merge: -1
  pgno: 36
- img_proc: true
  md: "# Chapter 2\n\nThis practice of combining data has become so much an art form\
    \ that developers have begun mixing data from one site with data from another's.\
    \ In the case of Yahoo!, which has so many properties, data can be combined between\
    \ two entities like Sports and Local or Flickr and Travel. The essence of mashups\
    \ is the act of combining these data to offer your users and the web with your\
    \ own new application.\n\n# XML\n\nExtensible Markup Language (XML) is a file\
    \ that can describe data as well as contain them. Think of XML as a database,\
    \ but in a file format. XML is human-readable, meaning you can read it when you\
    \ open it in Notepad or a coding IDE. As a file format, XML is very cleanly syntacted\
    \ and the patterns within it are very easy to follow. XML has the most recommended\
    \ way to share data between web sites, software applications and operating systems.\n\
    \nThe code that follows is an example of an XML file, used to store album information\
    \ in an MP3 player application:\n\n```\n<Albums>\n  <Album>\n    <Title>Abbey\
    \ Road</Title>\n    <Artist>The Beatles</Artist>\n    <Total_Tracks>17</Total_Tracks>\n\
    \  </Album>\n  <Album>\n    <Title>The Fall</Title>\n    <Artist>On The Surface</Artist>\n\
    \    <Total_Tracks>12</Total_Tracks>\n  </Album>\n</Albums>\n```\n\nWrapped in\
    \ the Albums nodes, information about each individual album is listed within its\
    \ own Album node. The code you will use to read or parse this XML will look up\
    \ a specific album's data by stepping through each set of nodes.\n\n# REST\n\n\
    Many APIs used to develop mashups REST (Representational State Transfer), an architecture\
    \ built on a GET and RESPONSE model. Using a URL with appended queries, web applications\
    \ can talk with each other and exchange data. When a request is sent it prompts\
    \ the service to return data. Those data come in the form of XML.\n\nYour application\
    \ will likely need to get data from another source. You will start with the web\
    \ service's URL, the hostname of the REST service you will call for. After you\
    \ append the query corresponding to the data you want, string will be coded somewhere\
    \ in your application and tied to a user interaction. The XML returned will ultimately\
    \ generate markers on your map application.\n\nThe code that follows is an example\
    \ of a REST query and a response in the Yahoo! Local Search API:\n\n```\nhttp://api.local.yahoo.com/LocalSearchService/V3/localSearch?appid=WroxyMaps&query=pizza&zip=60609&results=1\n\
    ```"
  merge: -1
  pgno: 37
- img_proc: true
  md: "# Developing with Yahoo! Maps\n\nThis query requests locations in the ZIP code\
    \ of 60609 that have the keyword pizza. The results parameter forces the response\
    \ to be limited to one.\n\n```\n<xml version=\"1.0\"?>\n<ResultSet totalResultsAvailable=\"\
    108\" totalResultsReturned=\"1\">\n <firstResultPosition=\"1\">\n <Result id=\"\
    173378103\">\n  <Title>Pizza Nova</Title>\n  <Address>558 W 43 St</Address>\n\
    \  <City>Chicago</City>\n  <State>IL</State>\n  <Phone>(773) 548-5100</Phone>\n\
    \  <Latitude>41.816437</Latitude>\n  <Longitude>-87.640051</Longitude>\n </Result>\n\
    </ResultSet>\n```\n\nThe XML returned detailed data, including the latitude and\
    \ longitude of the location, wrapped in the ResultSet node. REST-based APIs will\
    \ be explored in more detail later in this chapter.\n\n# RSS and GeoRSS Feeds\n\
    \nRSS stands for Simple Syndication and is a form of XML. Having one of the most\
    \ popular data formats online, RSS is used to replicate content found on web sites,\
    \ websites (blogs) and podcasts. News sources like CNN, MSN and Yahoo! offer RSS\
    \ feeds so that the headlines and stories report can be displayed almost verbatim\
    \ across the web. In addition, shopping sites such as Amazon, eBay and Yahoo offer\
    \ free feeds that relay product information such as pricing and availability.\n\
    \nRSS consists of four common attributes: title, link, description and pubdate\
    \ (the date the feed was published). On occasion, there may be other attributes\
    \ or objects mixed in, such as images that accompany the text.\n\nThe code below\
    \ is an example of an RSS feed from Yahoo! Sports listing headlines about the\
    \ Red Sox. The link and description nodes represent standard data in how RSS feed\
    \ results:\n\n```\n<xml version=\"1.0\" encoding=\"UTF-8\"?>\n<xml-stylesheet\
    \ href=\"rss.xsl\" type=\"text/xml\" media=\"screen\"?>\n<rss version=\"2.0\"\
    \ xmlns:media=\"http://search.yahoo.com/mrss\">\n <item>\n <title>Interleague\
    \ Capsules</title>\n <link>http://sports.yahoo.com/mlb/news?slug=ap-interleaguecapsules</link>\n\
    \ <description>David Ortiz hit his seventh walk-off homer...</description>\n <pubDate>Sat,\
    \ 24 Jun 2006 14:34:09 PDT</pubDate>\n </item>\n```\n\nUsers can take these feeds,\
    \ usually by a URL, and load them in RSS aggregators. One such aggregator is My\
    \ Yahoo! Here, within a space customized to your personal preferences, you can\
    \ define your own content based on thousands of RSS feeds. An aggregator takes\
    \ the feed and displays it for you."
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Chapter 2


    RSS feeds work particularly well with map APIs when the feeds include geographically
    encoded objects, as GeoRSS does. In addition to the standard attributes, geographically
    encoded objects add a georss:point tag to the feed. Featuring a latitude/longitude
    coordinate, this tag will add a location to the entry in the RSS feed:


    ```

    <georss:point>42.346524,-71.097381</georss:point>

    ```


    In this book I''ll cover the ability of each flavor of the Yahoo! Maps API to
    aggregate GeoRSS feeds.


    # Prime Mashup Sources


    Now that you have a solid understanding of mashups and the types of APIs and data
    out there, it''s time to introduce you to some of the great sources available
    to you. These are the ingredients in your cocktail, and combining them with each
    other and ultimately with Yahoo! Maps makes for some fun and effective mashups.


    # Flickr


    Flickr has become one of the most popular and exciting web services around. One
    of the best photo sites, Flickr enables its users to share and manage their photos
    from almost any source (see Figure 2-1). These sources include a user''s desktop,
    his or her mobile phone or device and, of course, the web. A huge objective of
    Flickr is to expose photos through as many outlets as possible. Photos in Flickr''s
    repository are viewable in e-mail messages, widgets, blogs, plug-ins and RSS feeds,
    as well as the website www.flickr.com.


    ![](img/1617eb1f737d2e225712aa0e0bbc3d21_39_0.png)


    The success of Flickr is largely due to the tagging feature supported in the application.
    When a user uploads a photo, rather than just titling the photo, that user can
    add keywords called tags to it. These tags allow Flickr''s search engine to identify
    both photos and sets of photos by association. When another user browses photos
    on Flickr, a search for an existing tag will pull up all the photos tagged accordingly.'
  merge: -1
