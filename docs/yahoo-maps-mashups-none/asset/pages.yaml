  md: '# The JS-Flash API


    "According to the map we''ve only gone four inches." — Dumb & Dumber, 1994


    The JavaScript-Flash (JS-Flash) Map API offering from Yahoo! offers you the best
    of both worlds. It combines implementation using the common web technologies of
    JavaScript and HTML with the enhanced performance and feature-rich experience
    of Flash-generated maps.


    This chapter discusses


    +   - The JS-Flash API

    - Fundamentals of JavaScript

    - Fundamentals of CSS and HTML

    - Benefits of the JS-Flash API


    # What is the JS-Flash API?


    Most Flash applications fall into a special category of web applications called
    rich internet applications (RIAs). These applications create a more engaging and
    dynamic environment for web users in terms of their flexible, intuitive design.
    Using Flash and Flash-based technology, RIAs are able to break out of the common
    constraints of HTML and JavaScript.


    Using Flash technology with maps introduces many features to the mapping experience.
    Some of the most notable include:


    +   - Flash maps smooth transitioning when zooming between tiles, which creates
    a nice effect for the user. Rather than jumping from one layer to the next, Flash-generated
    maps'' tiles fade as you zoom in and out. This helps users maintain perspective
    on a specific location as they change zoom levels.'
  merge: -1
  pgno: 102
- img_proc: true
  md: "# Chapter 8\n\nFlash maps support development of custom SWF tools, overlays\
    \ and markers. As you will in the upcoming chapters, this enables you to introduce\
    \ truly unique and effective elements into your mashup. As SWF, the compiled output\
    \ of Flash, usually means an interactive and dynamic element unparalleled in most\
    \ other web technologies.\n\nThe mashup you create with Flash will stay consistent\
    \ throughout browsers and platforms capable of running the latest version of the\
    \ Flash Player.\n\nThere is a learning curve to being able to build a Flash application.\
    \ While it may be a very small one, time and ability are two variables that may\
    \ prevent you from tackling it. The JS-Flash API gives developers the ability\
    \ to leverage the benefits of Flash mashup without having any Flash development\
    \ skills.\n\nThe JS-Flash API enables you to add Flash-generated maps in an almost\
    \ identical way to the Ajax API. This means that if you completed the Ajax API\
    \ chapters, the remainder of this chapter should be very familiar to you. As you\
    \ will, JavaScript, CSS and HTML are used to position and further control the\
    \ JS-Flash API, just as in the Ajax API. The difference is that time you will\
    \ be loading a map layer generated with Flash instead of Ajax.\n\n# Fundamentals\
    \ of JavaScript\n\nWhile the API itself uses Flash, the map of your applications\
    \ will feature JavaScript interacting with the map classes. It is very important\
    \ to gain a solid understanding of the fundamentals and capabilities of JavaScript.\n\
    \nJavaScript is a web-scripting language with ties to the programming language\
    \ Java. It runs in the browser and is executed as an interpreted language. This\
    \ means that it does not need to be compiled into another file or build to run.\
    \ JavaScript became a very significant language early on, adding new levels of\
    \ interaction and browser control. Web designers used it initially for effects\
    \ like image animation, browser detection, plug-in detection, status messages\
    \ in the browser and HTML form validation.\n\nAs any language that's been around\
    \ for 10 years, JavaScript has reverted several times. While its fundamentals\
    \ have pretty stayed the same, the many new uses of the language have been realized.\
    \ Its dependency on the browser has helped in its evolution. With new browsers\
    \ invariably new abilities. Developers explored new ways to make their HTML and\
    \ JavaScript applications engaging.\n\nOne of the keys to JavaScript's success\
    \ and its prevalence to this day is the simple syntax it uses. Here is a sample\
    \ of a popular JavaScript code used with HTML to launch a new browser window:\n\
    \n```\n<html>\n<head>\n<title>Javascript > New Window</title>\n<meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=8859-1\">\n<script language=\"javascript\"\
    >\nfunction newWindow(url) {\n  launchWindow = window.open(url, \"newWin\", \"\
    width=800,height=600\")\n}\n</script>\n</head>\n<body>\n```\n\n76"
  merge: -1
