  md: '# AS-Flash API

    Advanced Features


    Learning the more advanced features of the ActionScript-Flash (AS-Flash) API will
    help you further unlock the full capabilities of this API and its technology.


    This chapter discusses


    +   - A more in-depth look at the API classes, as well as the more advanced methods
    and events available

    - How to implement the various tools, including the must-have pan tool

    - How to work with widgets like Navigator and Satellite, how to import each widget
    class and use to the methods available to manage them

    - An in-depth look at adding markers to your map, walking through each marker
    type and the unique properties that make up the marker classes

    - How you can take advantage of the power of overlays, replicating some of the
    richest features of the Yahoo! consumer application


    # API Classes in Depth


    Now that you are familiar with the fundamentals of the AS-Flash API, it is time
    to learn the more advanced features. In the last chapter you learned how to control
    the map using most of the API methods. In this chapter you will discover how to
    add functionality to the map API. Combining the fundamentals and the examples
    you built with elements like tools, widgets, mark- and overlays will lead you
    to ultimate mashup.


    In previous sections, many of the topics in this chapter have already been covered
    elsewhere in the book along with their API. The AS-Flash API has its own unique
    and very effective way of integrating these elements. In addition, this API offers
    many exclusive features that will tap your creativity and imagination.'
