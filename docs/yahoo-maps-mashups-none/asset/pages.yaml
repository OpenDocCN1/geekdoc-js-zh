  md: '# Chapter 13


    ![](img/1617eb1f737d2e225712aa0e0bbc3d21_177_0.png)


    Figure 13-5


    # Events


    ActionResult 2 gives you a way to send messages between classes that are otherwise
    not lined together. Based on user action, data activity or general operation of
    the application, code can broadcast events. Objects called listeners are set up
    to detect broadcasted events, and based on the event fired, they will perform
    the specified action by calling a method. In many cases, object data is passed
    along with the event and thus as parameters when the method is ultimately called.


    Many that that the map API are capable of interfere with broadcasting events.
    From the start, an event called EVENT_INITIALIZE is broadcast when the map loads.
    As you will see in the chapters to come, many of the API''s events are triggered
    based on this one. Another good example of an event is the series of events fired
    in order to zoom the map. The event EVENT_ZOOM is fired when the map starts zooming,
    followed by EVENT_ZOOM_STOP, which is broadcast when the map stops zooming.


    As mentioned earlier in this chapter, the event handler is always paired with
    a method to follow with the purpose of the event as well as the object data it
    passes. This method is often given a name similar to that of the event. It is
    good practice to do this, as it will enable you and other developers looking at
    your code to easily identify what event is doing when it is called within your
    code. Large applications often have a class set that handles events exclusively.


    Methods paired with events can also be called by this code. This makes for very
    efficient coding as you can accomplish actions in your code by listening for events
    and by calling a method based on user interaction. Event listeners can also be
    deleted programmatically, if at such a point in your code you no longer need to
    handle a specific event. This does affect the method paired with the deleted event
    listener, ensuring its availability to other processes in your application that
    may call it.


    # Benefits of the AS-Flash API


    As you can see, Flash and ActionScript are very powerful tools when used together.
    The AS-Flash API is special because of the Flash platform it leverages. Working
    with the API and developing this technology,'
