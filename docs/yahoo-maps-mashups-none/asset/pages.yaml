  md: '# Setting the Stage


    This part of the chapter will guide you through laying out the visual elements
    of the mashup based on this list of actions you established above. Once again,
    you will use the Flash IDE to your advantage at first. Having many of the elements
    available to drag and drop will save initial time in getting the mashup up running.


    # The Layout


    First, you need to itemize each interface element you will need to provide the
    user so or she can interact with your mashup. Taking advantage of the pre-built
    V2 components that come with the Flash IDE, you will need to identify which components
    to use:


    +   - The Yahoo! Maps API component to display the map

    - Tools and widgets for the map API that will let the user interact with the mashup

    - A Label component to prompt the user to enter the keyword

    - A TextInput component where the user will type in the keyword

    - A button component that the user will click to submit the keyword


    It is now time to add each of these items to the stage in Flash and begin to see
    the mashup take shape.


    # Add the Map Instance


    Creating the map instance requires you to compile the AS-Flash API in the Flash
    IDE. The resulting SWF will be connected to the Flex 2 application.


    +   1. Create a new .fla file and save it as as_mashup_scrolling.fla

    2. In the properties panel, change the size of the stage to W:750, H:550

    3. In the timeline panel, rename Layer 1 as myMap

    4. Drag the Yahoo! Maps component from the components panel to the stage.

    5. Enter an instance name of myMap.

    6. Change the x/y coordinates of myMap to x:0, y:75.

    7. Change the width and height of myMap to W:750, H:400

    8. Click the parameters tab, and in the table enter your appID.

    9. Enter an address of "Topeka, KS" (as shown in Figure 17-1).'
