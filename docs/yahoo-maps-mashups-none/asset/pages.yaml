  md: '# 7


    # # The Ajax Mashup


    The goal of this chapter is for you to build an Ajax maps mashup using the Ajax
    API and Flickr.

    To do this, you will also do the following:


    +   - Establish an idea for your mashup and plan out the key details and development
    approach

    - Learn how to retrieve external data from the Flickr API and display it on the
    map

    - Create links that center the map on a photo stored in Flickr


    # # Time to Mash Up


    Now that you have learned all the methods and classes of the Ajax API, it''s time
    to build a mashup.

    As with the other APIs featured in this book, this chapter will guide you through
    building a mashup

    with a data source and the map API.


    # # The Big Idea


    Way back at the beginning of the book, you discovered just a few of all the most
    popular sites that are

    the subject of mashups. Perhaps the granddaddy of all is Flickr. You will see
    more Flickr

    mashups than almost any other kind, and for good reason. As a leading photo collection
    and

    repository, Flickr serves a wealth of its users'' photos.


    As stand-alone visual interfaces, maps themselves can be more than sufficient
    in captivating the

    user. Displaying photos taken by any one of Flickr''s millions of users, on subjects
    ranging from

    new babies to mountops, is just as good. Combining the two, displaying photos
    exactly

    where they were taken in the world against an interactive map, is even better.


    In this chapter you will build a mashup that will enable you to display your photos
    as markers on

    t Ajax-generated Yahoo! map. Using the geo-tagging data widely available from
    Flickr, these

    image markers will be positioned precisely where you took the photo.'
