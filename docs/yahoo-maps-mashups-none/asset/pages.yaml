- img_proc: true
  md: "# Chapter 7\n\nInstead of XML, this request will return a string of text looking\
    \ like this:\n\n```\njsonFlickrApi({\"page\":1, \"pages\":17, \"perpage\":100,\
    \ \"total\":1679\",\n  \"photo\":[{\"id\":259649440, \"owner\":\"...\", \"secret\"\
    :\"...\", \"server\":\"...\",\n  \"title\":\"The Mush pit at Yahoo!\", \"ispublic\"\
    :1, \"isfriend\":0, \"isfamily\":0,\n  \"latitude\":37.418363, \"longitude\":-122.025135,\
    \ \"accuracy\":\"16\"}], \"stat\":\"ok\"})\n```\n\nAs you can see, most of the\
    \ XML ‘fat’ has indeed been removed. These removed data are still easy to read\
    \ and even, better in format similar to a JavaScript array, that can be parsed\
    \ much more smoothly.\n\n# Using the JSON Callback\n\nLooking at the syntax using\
    \ JSON, you can see that the string begins with a defined method name. By default,\
    \ the Flickr response starts with the function name jsonFlickrApi. When JavaScript\
    \ loads this response, it will automatically call the function and pass the data\
    \ of the response itself.\n\nTo properly handle a JSON response, you will need\
    \ to define a function, matching that in the response, to receive the response\
    \ data. Using the default jsonFlickrApi, here is how that function may look in\
    \ your code:\n\n```\nfunction jsonFlickrApi(rsp) {\n  if (rsp.stat == \"ok\")\
    \ {\n    alert(rsp.photos.photo.length);\n  }\n}\n```\n\nThis function will execute\
    \ when the JSON is returned. The response data will be passed as jsonFlickrApi\
    \ as the object rsp. Within the function is a condition checking for the property\
    \ of the JSON response. If it has the value ok, the JavaScript will execute an\
    \ alert with the number of photos in the response. You can see how rsp, the datum\
    \ from the JSON response, is handled as an array. This means JSON results can\
    \ be looped easily easily.\n\nIf you want to change the default function in the\
    \ JSON response, you can add the parameter jsoncallback followed by the desired\
    \ function name. Additionally, if you are looking to get the JSON data without\
    \ a defined callback function, you can use the parameter nojsoncallback=1.\n\n\
    # Build the Mashup\n\nIt is now time to put it all together and build your mashup\
    \ of the Yahoo! Maps Ajax API and Flickr. You will need the following information\
    \ from Yahoo! Maps and Flickr to complete this mashup:\n\n+   - Your Yahoo! Maps\
    \ application ID\n- Your Flickr API key\n- Your Flickr user ID (You can also look\
    \ up another user’s ID, but working with your own photos should be fun.)"
