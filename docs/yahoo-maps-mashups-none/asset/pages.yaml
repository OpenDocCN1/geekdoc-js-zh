    # getTrip


    As you can get the get by its name, this call is positioned to return certain
    values based on given parameters. The getTrip method will return a specific trip
    and its details based on a trip ID being passed as a parameter.


    This call requires two parameters, the AppID and the trip ID to look up. It is
    ideal for requesting your trip, and so the trip ID you define will be one of you.


    ```

    http://travel.yahoo.com/TripService/V1/getTrip?appid=(your_YDN_appID)&id=585440

    ```


    The XML data returned by this call, after you substitute the necessary values,
    will be similar to those of the getTrip call. While this call returns no latitude/longitude
    points, it could be helpful for your application in displaying more detail about
    a specific trip.


    # Understanding JSON


    > This section is similar to the one covered in Chapter 3, “The Ajax API.\ However,
    there are some differences between the Flickr API and the Yahoo! Travel API that
    are worth noting.


    JSON stands for JavaScript Object Notation and is a simplified version of XML.
    It was developed to be a much more lightweight and faster way to pump data into
    JavaScript. Its popularity has grown with the increase of web pages built with
    Ajax. As with XML, data in JSON is organized easily and human-readable, meaning
    it can be understood without code interpretation.


    Favorable articles on JSON say that it “cuts the fat” out of XML by removing the
    cumbersome tag syntax. One benefit is its ability to be loaded directly into JavaScript.
    As you will see in the example in the next section, JSON has a callback ability,
    which lets it virtually parse itself by calling it when it is returned.'
