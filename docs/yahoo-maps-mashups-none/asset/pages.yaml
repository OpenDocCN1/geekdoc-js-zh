  md: '# JS-Flash API Basis


    The getZoomLevel () method lets you obtain the current zoom level of the map.
    It can be used to adjust a custom zoom or zooming interface that you have created.
    You will also see this in the next chapter, knowing the current zoom level is
    important when you are using overlays and other custom features of the API.


    ```

    mapInstance.getZoomLevel ( );

    ```


    The following is an example showing how the method works if the map is set to
    a zoom level of 5:


    ```

    var currentZoomLevel = myMap.getZoomLevel();


    alert(currentZoomLevel);

    // Outputs: 5

    ```


    Now that you have learned the set and get methods, as well as the associated event
    for changing the zoom level, it is time to put it all together.


