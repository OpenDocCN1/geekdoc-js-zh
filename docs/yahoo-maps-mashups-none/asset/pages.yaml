  md: '# JS-Flash API Advanced Features


    As you will see, the overlays have the incredible ability to act as their own
    masters. Some of the overlay classes will actually request data, parse the response
    and add markers by itself. It is good to test each overlay, it may save you some
    time as well enable you to add even more functional- to what you will ultimately
    build.


    # Overlay Methods and Classes


    Just like widely, tools and markers, overlays can be added and removed with a
    simple pair of methods. It is good practice, after importing the overlay class,
    to create an instance variable for that new overlay.


    Overlay classes as built-in mashups. With the LocalSearchOverlay and TrafficOverlay
    classes, your application will be directly connected to the popular local search
    and traffic data. These two classes in particular enable you to replicate functionality
    featured on the Yahoo! Maps consumer application.


    Also available is the GeoRSSclass. This class, when imported and instantiated,
    is capable of picking out locations from geoRSS feeds and displaying markers to
    those locations. GeoRSS is a special standard that represents standard RSS data
    with location data objects embedded within each item.


    # addOverlay(overlay)


    Once the map is initialized, the overlay instance can be added using addOverlay().
    addOverlay() accepts one parameter, the overlay instance you are adding to the
    map.


    ```

    mapInstance.addOverlay(overlay);

    ```


    # removeOverlay(overlay)


    removeOverlay() will remove the specified overlay instance from the map:


    ```

    mapInstance.removeOverlay(overlay);

    ```


    # LocalSearchOverlay


    LocalSearchOverlay adds a feature that taps the power of Yahoo!''s local search
    database. The functionality lets you call a keyword search and display results
    in the form of markers. This feature closely resembles that of the Find on Map
    on the Yahoo! Maps consumer application. The markers are enriched with very useful
    data for any user, including business name, address, and available, rating.


    The overlay class features a method search() that sends a service call to the
    API to generate results. It is used for finding businesses such as restaurants,
    and its criteria work simply on a keyword. The method accepts several other parameters
    that let you manage the results in various ways.


    ```

    localSearchOverlayInstance.search(searchTerms, latlon, startIndex, radius, categoryFilter,
    ratingFilter);

    ```


    You will notice that as with widgets, this method is called only the first two
    parameters to work. To let your users make the most of this method, you will likely
    want to collect the searchTerms from a value entered into a text field or component.'
