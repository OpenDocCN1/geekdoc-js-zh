  md: '# # Get Started with the AS-Flash API


    It is time to get immersed in ActionScript and start developing with the ActionScript-Flash
    (AS-Flash) API.


    This chapter discusses


    +   - The steps to getting an application ID — in case you don''t have one yet

    - The software requirements for developing with the AS-Flash API

    - How to download and install the component

    - The various ways to add the component to Flash and set its initial properties


    # ## Get an Application ID


    If you have already completed one of the other sections in the book, be it on
    the Ajax JavaScript Flash (JS-Flash) API or the Flex API, you will already be
    familiar with these steps. Otherwise, this step is a critical one and needs to
    be completed so you can properly develop with the map APIs.


    The first step to achieving greatness is to register an application ID with the
    Yahoo! Developer Network via their registration form (shown in Figure 14-1). The
    free ID is a string of your choice, used by YDN to track usage of all Yahoo! web
    services. Since the ID is tied to your Yahoo! user ID, it also gives you a way
    to track usage of your own API and gauge the total traffic it generated.


    If you have already registered an AppID, you can still register a new one for
    each API you will use. Here are the steps to getting your Yahoo! AppID:'
