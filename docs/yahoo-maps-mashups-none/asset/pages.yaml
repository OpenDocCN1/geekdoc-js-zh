  md: '# Chapter 9


    You should see the Yahoo! Maps JS-Flash API load in your HTML document. The map
    should be loaded displaying satellite map tiles of Sydney, Australia, at a zoom
    level of 6 (about state/province level).


    # How It Works


    The upper part of this code is pretty much identical to the first example in this
    chapter. It is responsible, once again, for becoming familiar with this code by
    now. The JS-Flash API library of classes in your web page. mapContainer has stayed
    the same, as it creates a holder in the map which will ultimately be displayed.
    Consistent with the first example, this is the way the map object is instantiated.
    YMap class passed the div location, in this case the mapContainer, to load the
    API.


    The difference starts when the latitude/longitude coordinates are defined. Using
    the LatLon class, the latitude/longitude object will tell the map where to center
    when it initializes its tiles. The JS-Flash API (as well as other Yahoo! Maps
    APIs) needs to have the latitude/longitude coordinates turned into an object to
    process them. The LatLon object serves this purpose by creating a JavaScript variable
    called latlon. Most developers don''t know latitude/longitude coordinates offhand,
    so the address option used in the first example may be a bit easier to leverage


    Once the latlon object is created, it can be passed as a parameter of the map
    constructor along with the desired zoom level. This will resolve the coordinate,
    center the map on that location and call for tiles at the specified zoom level.
    The last action in this example is to define the type of tiles used. Regular tiles
    will show up by default. In the example, by using setMapViewType against the map
    instance, you are defining that satellite tiles will be showing initially.


    The following are some notes to help you understand the transition between the
    Ajax and JS-Flash APIs:


    +   The LatLon class is the equivalent of the YGeoPoint class in the Ajax API.


    +   The method setMapViewType is similar to the setMapType method in the Ajax
    API.


    +   To load satellite tiles, the JS-Flash API uses the simplified property satellite,
    rather than the lengthier YAHOO_MAP_SAT property of the Ajax API.


    The next chapter will discuss these methods and more in detail. You now have a
    very strong foundation for building your JS-Flash maps mashups. You are about
    to do a whole lot more with this API and Yahoo! Maps.


    # Summary


    After reading this chapter, you are well on your way to mastering the JS-Flash
    API and have done the following:


    +   Obtained a YDN AppID


    +   Become familiar with Yahoo!’s terms of use for the API'
