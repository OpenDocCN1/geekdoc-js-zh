    # Basic API Methods


    As you have already seen in earlier examples, methods are the building blocks
    of working with an API. These are the exposed functions that let you call for
    specific functionality and control against the instance of the map API you are
    working with.


    The Ajax API methods are the most distinct of the four APIs covered in this book.
    However, the naming conventions are very common from one API to the next. To get
    coding with the methods, it is good to leverage the strong event support the API
    offers. As you will see, many of these basic methods have associated events that
    are dispatched as the method code is executed.


    As you learn each method, this book will cover any available events in parallel.
    Whether you are coding along while while each method is introduced, or are working
    with the available code samples, working with the events will help you get a better
    understanding of the timing and activity of each method.'
