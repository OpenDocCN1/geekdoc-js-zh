    }\n\n// Receives the selected Item and passes it to local connection\n// Plays\
    \ the selected video clip\nprivate function playVideo(selectedItem:Object):void\n\
    {\n    vidPlayer.source = selectedItem.url;\n    mapConnector.addMarkerByLon(selectedItem.lat,\
    \ selectedItem.lon, selectedItem.label);\n    playVideo.play();\n}\n]]>\n</mx:Script>\n\
    ```\n\nThe listSelect function is called from the List event handler when the\
    \ list is changed. The object that is sent as part of the event carries with it\
