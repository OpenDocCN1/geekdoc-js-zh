  md: '# API Example and Mashup Index


    Throughout the book, several examples are created to demonstrate the various methods
    and classes of each API discussed. This index provides file inventories and descriptions
    for each of the Yahoo! Maps APIs featured in the book. While the code for these
    examples is covered comprehensively within the chapters of the book, these indexes
    should provide you easy access to the online repository of Yahoo! Maps examples
    at www.mashupexperts.com.


    # Ajax API Examples


    The following files can be found at www.mashupexperts.com/maps/ajax and represent
    examples of API methods and classes covered in Chapters 3 through 7. Additional
    examples will be posted as new features are released. These .html files feature
    JavaScript, and you can view your source using the View Source feature in your
    browser, a coding IDE or a simple text reader as Notepad.


    | Filename | Description |

    |---|---|n| ajax_addControls | Adds the zoomControl, panControl and mapControlType
    to a map centered on Seattle, WA. |

    | ajax_addImageMarker | Adds an instance of an image marker of a lighthouse on
    the island of Nantucket. This example also features satellite tiles. |

    | ajax_addMarker | Adds a basic marker in downtown Boston, MA. |

    | ajax_addOverlay_geoRSS | Using geoRSS XML, adds markers of colleges in and around
    Boston, MA. |

    | ajax_addOverlay_polyline | Using polyline, draws a yellow line to indicate the
    route of a cruise ship from Ft. Lauderdale, to the Bahamas and back. |'
