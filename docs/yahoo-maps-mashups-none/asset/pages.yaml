- img_proc: true
  md: '# Get Started with Yahoo! Maps and Flex 2


    It is time to get immersed in ActionScript and start developing with the ActionScript-Flash
    (AS-Flash) API. At the end of this chapter you will have integrated the API with
    Flex 2 and will be ready to build a mashup with Flex technology. This chapter
    will have you complete the following-tasks:


    +   - Get an application ID (AppID) and obtain the AS-Flash API component.

    - Build the Flash client part of the application in the Flash IDE, generating
    a SWF that will connect with its counterpart in Flex 2. This will require you
    to add a simple connection to an otherwise stand-alone map application.

    - Code the MapConnector class to handle the local connection and communication
    between the two clients.

    - Write the MXML in Flex Builder 2 that will communicate with the Flash-generated,
    AS-Flash API-based SWF. This will call map methods against it and enable you to
    build your map mashup in Flex.


    # Get an Application ID


    If you have completed one of the other sections in the book, be it the AJAX API,
    JS Flash API or Flex2/AS-Flash API, then you will already be familiar with these
    steps. Otherwise, this step is a critical one and needs to be completed so you
    can properly develop with the map APIs.


    The first step to achieving mashup greatness is to register an application ID
    with the Yahoo! Developer Network via their registration form (shown in Figure
    19-1). This free ID is a string of your choice, used by YDN to track usage of
    all Yahoo! web services. Because the ID is tied to your Yahoo! user ID, it also
    gives you a way to track usage of your own API and gauge the total traffic it
    has generated.'
