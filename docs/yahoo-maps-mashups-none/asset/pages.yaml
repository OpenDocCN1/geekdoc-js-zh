  md: '# How It Works


    By defining the JavaScript source using the Ajax API library, you have made all
    the classes available to your web page. You set the src attribute of the JavaScript
    tag. This effectively operates or "pulls in" the very latest fields available,
    under the version you specified in the URL.


    The next step is to create a map on your web page, a container for displaying
    the Ajax-generated map tiles. Using the style tag, you create a style class mapContainer.
    This is set to have a width of 500 pixels (500px) and a height of (400px). In
    the future, you can change these dimensions based on the viewable area of the
    map you design in your web.


    Within the body tag of your html, you add a div with the ID mapContainer. This
    will assign the properties of the mapContainer class in the style the div you
    are creating. Effectively, this will size the div to 500 by 400 and fully fill
    the space in a map of that size.


    Still within the body tag, additional JavaScript will actually trigger the map
    to turn on with some example properties. This section of code deserves close review,
    as it is your first use of the Ajax API code itself.


    ```

    <script type="text/javascript">

    // Create a map

    var map = new YMap(document.getElementById(''mapContainer''));

    // Positions the map centered on a given address

    map.drawZoomAndCenter(''Boston, MA'', 5);

    </script>

    ```


    You create the map by instantiating (creating an instance of) the YMap object.
    When creating the YMap instance, you need to pass into the object the getElementById
    method against the Javascript DOM object "document" achieves this. What it is
    actually doing is looking up a div container in the HTML that will be the home
    for the map within your web page. By specifying mapContainer, this tells the Ajax
    API library where to load a new map and its tiles.


    Lastly, the Ajax API requires an initial address or latitude/longitude coordinate
    to load in order to display. Having the map instance of the API, you can call
    drawZoomAndCenter against that instance. The parameters you pass are followed
    by the initial zoom level you want to display. Methods like this will be reviewed
    in great detail in the next two chapters.


    As I mentioned earlier, with this exercise you have built the foundation for every
    Ajax API example to come. For the remainder of this chapter, as well as the next
    three, you will be using this code. Although it is very basic, you must understand
    the order in which the code is placed and executed.


    # Setting Initial Map Parameters


    While most of the methods of the Ajax API will be covered in each of the next
    two chapters, this example will get you on setting initial map parameters for
    the map. These values will be used when the map originally rendering, giving your
    users their first view of the location around which you are building your mashup.'
