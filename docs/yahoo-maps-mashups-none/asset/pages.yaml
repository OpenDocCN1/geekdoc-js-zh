  md: '# 12


    # # The JS-Flash Mashup


    The goal of this chapter is for you to build a JavaScript-Flash (JS-Flash) maps
    mashup using the JS-Flash API and Yahoo! Travel. To achieve this, you will also
    accomplish the following:


    +   - Establish an idea for your mashup and plan out the details and development
    approach

    - Learn how to retrieve external data from the Yahoo! Travel API and display it
    on the map

    - Create links that center the map on a trip planner stored in Yahoo! Travel


    # # Time to Mash Up


    Now that you have learned all the methods and classes of the JS-Flash API, it''s
    time to build a mashup. As with the other APIs featured in this book, this chapter
    will guide you through building-a mashup with a data source and the map API.


    # # The Big Idea


    Yahoo! Travel is a property of Yahoo! that lets users book airline tickets, hotel
    reservations and rentals. Your new trip planner lets out trips they are looking
    to take as well as to trips that they have taken.


    Trips are naturally compatible with maps since every trip has a location. While
    maps themselves are sufficient stand-alone applications, displaying trip data
    on top of a map is even more useful.


    In this chapter you will build a mashup between Maps and Yahoo! Travel from your
    trip planner. Upon completion, you will see and be able to show your trips that
    have been or will be taken across Europe. Each trip will be marked by a thumbnail
    of a photo taken at that location. You will add functionality so that the marker
    will send your users to the trip planner site to view more details of that trip.


    This highly scalable and adaptable project will introduce you to common functionality
    that you can apply with several other APIs and web services.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# Chapter 12


    # Planning and Approach


    As with any application, planning and approach are important. It helps to know
    the APIs and services you are working with very well. Having completed the previous
    chapters on the JS-Flash API, you should have all you need to work with the map.
    If you completed Chapter 7, “The Ajax Mashup,” you will also know much about working
    with JSON. Later in this chapter you will know the Yahoo! Travel API, how the
    request is constructed and what data to expect upon a successful request.


    Before coding, it is always good to lay out your objectives and determine how
    best you will achieve those tasks. Begin with thinking out what your application
    should achieve. Through the rest of the chapter, you will see how these steps
    are developed into the mashup.


    +   - Display the map initially.

    - Position the map and set its view type accordingly.

    - Call the external API and retrieve the data.

    - Give the user the ability to navigate through the data.

    - Display the data as markers on the map based on user selection.


    What you see listed here is a simple flow, and this pattern of user interaction
    should be easily replicated with other APIs and web services.


    # The Yahoo! Travel API


    Yahoo! Travel API enables developers to search trips posted on the trip planner
    based on some very simple parameters. It also lets you access details of specific
    trips based on more specific criteria.


    Since Yahoo! Travel is obviously a property of Yahoo!, the support for its API
    is similar to that for the Yahoo! Maps APIs. Like Maps, the Yahoo! Travel API
    and its documentation are supported by the Yahoo! Developer Network (YDN). To
    check out the web service, visit http://developer.yahoo.com/travel/ for the most-to-date
    documentation and news on the API.


    # How Travel Content Contains Location


    Yahoo! Travel trip planner uses a form-based interface to collect initial details
    about a user’s trip. After entering a trip title, the dates the trip occurred
    or will occur and personal identification information, the user is presented with
    a console to enter further detail.


    The schedule view lets users enter popular locations visited on the trip based
    on the initial location entered. With each entry, the user can add details about
    that location or the overall trip. As cataloged locations like hotels, restaurants
    and amusement parks are entered, the respective address information is also saved.


    Moving on to the map view, Travel displays an internal mashup of its own that
    leverages the Ajax API to display all locations entered from the previous view
    (see Figure 7-1 in Chapter 7). This is a prime usage'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# The JS-Flash Mashup


    of the Yahoo! Maps API and as confirmation of all the locations entered thus far.
    Looking at this interface, you can already see how well trip data works with maps.


    Finally, the trip journal lets you add photos to a trip album. Users can upload
    their photos or photo links right from their Flickr. It is a simple and powerful
    interface designed to encourage as much data entry as possible. Using photos to
    tell the story of a trip helps in documenting it.


    This last feature adds a lot of value to the Travel API, since photos become better
    markers for you to display in your mashup. See Figure 12-1.


    ![](img/1617eb1f737d2e225712aa0e0bbc3d21_156_0.png)


    Figure 12-1


