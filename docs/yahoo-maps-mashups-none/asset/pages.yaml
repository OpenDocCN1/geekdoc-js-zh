    In the Ajax, internal functions of the API are exposed to you when the classes
    are imported as methods. These methods can be called against the map container
    instance to control the map. Methods are so important in working with the API
    that each API featured in this book has a chapter dedicated to reviewing the methods
    available for it. As you learned with functions, you can pass parameters with
    methods like order or latlon to change the map''s location.


    # Events


    Events are an important and often overlooked part of JavaScript. They represent
    user interactions or code occurrences that can be further handled by additional
    functions. Events are executed with event handlers. An event handler is the script
    that executes when an event occurs. An example of this is when a user brings the
    mouse over an element, such as an image. The user action will fire an event onMouseOver.
    The event handler would look something like this:


    ```

    <img src="someImage.jpg" onMouseOver="newWindow(''someImage.jpg'');" />

    ```


    This code will call the newwindow function, passing the image as a parameter when
    it is rolled over by the mouse.


    Events play as big a role with Ajax, based much on code occurrence than user interaction.
    Working with more data and code execution, events can be fired to signal when
    data have been sent or received when certain code is completed in the application.
    The map API dispatches many events tied to map activity, including startPan, changeZoom
    and onGeocode. Each of these refers to an activity of the map as it happens. Setting
    up event handlers for these events lets you call other functions based on map
    occurrences.


    # XMLHttpRequest


    Prior to the adoption of Ajax, or the discovery of the Ajax approach, many interactive
    web flows worked like this:


    +   - HTML loads a form.

    - The user fills out the form and submits it.

    - Form data is submitted to CGI or ASP and processed.

    - The script returns HTML, which loads as the browser refreshes.'
