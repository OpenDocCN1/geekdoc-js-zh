  md: '# Yahoo! Maps and Flex 2


    “What led you to assume there’s this invisible map?” — National Treasure, 2004

    As of this writing, Yahoo! Maps APIs do not cater specifically to the latest offerings
    of Flex 2. However, developers wanting to get more out of Yahoo’s existing ActionScript-Flash
    (AS-Flash) and Flex API support have found ways. Building mashups with Flex 2
    is very rewarding.


    This chapter discusses


    +   - Flex is, its history and the technology behind it

    - The Flex 2 development environment, built on Eclipse and the example applications
    that come out of the box

    - Fundamentals of MXML and how Flex applications work

    - Benefits of using the AS-Flash API with Flex 2


    # Finding Out About Flex


    Like Flash, Flex applications drive the rich Internet applications (RIAs) that
    have sprung up on the web in recent years. Flex is a Flash platform technology
    and, when compiled, results in the SWF extension. Flex relies on ActionScript
    to execute much of its advanced capabilities. However, Flex enables you to program
    the user interface using a language called MXML.


    MXML, interpreted by Flex when an application is compiled, gives you full layout
    and stylistic control. It also acts as an efficient conductor between the Flex
    controls you add to your application and the data services and remote logic you
    choose. As you will see in the coming chapters, MXML is easy to learn and code.
    It makes Flex highly reliable, scalable and a remarkably effective platform for
    developing map mashups.'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# Chapter 18


    # # The History of Flex


    Macromedia, now Adobe, first released Flex 1.0 in 2004. It was quickly followed
    by the updated and improved version 1.5. Flex promised an improvement over Flash
    MX 2004, the existing version of Flash at the time, in several ways. With Flex,
    a developer can


    +   - Develop rich Internet applications without knowledge or experience of Flash

    - Create a development model that would be familiar to ColdFusion, JSP (Java Server
    Pages) and ActionScript.NET (Active Server Pages) programmers

    - Build a simple application layout using containers, a methodology used in prominent
    object-oriented application languages


    Flex also enabled users to implement easy integration between a simple design
    layer and business logic, and supported control styling (and skinning) with common
    CSS (Cascading Style Sheets).


    Flex was initially presented to companies as an ideal enterprise-rich media solution,
    it was met with a divided reception. Designers and those who had mastered RIA
    development with Flash dismissed it as not substantial and too cumbersome. That
    latter claim was far off. Because Flex needed to carry its framework, no matter
    big or small an application was, chances, the end result was going to be a little
    top heavy. Flash loyalists argued that they could design and deploy RIAs that
    were much lighter and more configurable.


    On the other hand, hard-line IT groups that were comfortable with their existing
    infrastructures and simple approaches were introduced in Flex. It gave them the
    chance to join the dynamic flow of the web without giving up much of their conservative
    methodologies. They saw no animation or timeline design in Flex. From them it
    was a different way of doing things.


    Flex was adopted and used in many high-profile sites including KodakGallery (then
    Ofoto), Dow Jones, Yahoo! Maps and the Yahoo! Maps Flex API. See Figure 18-1.


    As technology evolved, so both Flex and Flash grew. When released, Flex 1.5 and
    Flash MX 2004 both pushed the limits of the current Flash Player, version 7. In
    August 2005, Flash 8 and Flash Player 8 were released, there was no match release
    from the Flex side.


    Finally, in July of 2006, Flash Player 9 was released. Interestingly, unlike its
    predecessor, the new player was not accompanied by its Flex IDE counterpart. Adobe
    proved Flex 2, outperforming improvements in speed, size and affordability. Still
    leveraging MXML, Flex 2 also performs well on ActionScript 3, the new version
    of ActionScript that takes full advantage of the many upgrades found in the Flash
    9 Player.


    Flex 2 is a bit more welcoming to Flex developers, mostly because of the new authoring
    environment you will learn about later in this chapter called Flex Builder 2.
    Without a visual authoring environment, timeline, stage or frames, Flex Builder
    2 instead uses XML to drive very simple layouts. Adding ActionScript 3 gives you
    a substantial improvement over event handling, transitions and other elements
    that enhance the interactivity of your application.


    244'
  merge: -1
  pgno: 271
- img_proc: true
  md: '![](img/1617eb1f737d2e225712aa0e0bbc3d21_272_0.png)


    Since Flex 2 uses ActionScript 3 (the common name among developers for ActionScript
    3), it is not compatible with Flex 1.5. This is because they use two completely
    separate virtual machines to render their code. While ActionScript 2, Flex 1.5
    applications will run on Flash Player 9, ActionScript 3 and Flex 2-based applications
    cannot run on versions prior to 9. Furthermore, applications built on Flex 1.5
    and ActionScript 2 cannot be integrated into the same code base with Flex 2 projects.
    This limitation prevents older classes and components from being imported and
    working with Flex 2.


    # # Yahoo! Maps Works in Flex


    You may have noticed that this chapter, unlike the others that begin each API
    section, is not named after any specific API. The reality is that there exists
    a Yahoo! Flex API, it is no longer a viable solution for new developers. The reason
    is that the Flex API is built on Flex 1.5 and, as you learned, this means it is
    not compatible with Flex 2. Since Flex 1.5 is no longer available for trial-download
    from Adobe, it simply did not seem practical to cover it thoroughly in this book.


    The good news is that, through some innovation in the Flex community, a very good
    solution has appeared for allowing a Yahoo! Maps API to work rather well with
    Flex 2. This approach gives you the best of both worlds, as you will be able to
    work with maps while getting familiar with the cutting-edge RIA-platform technology
    of Flex 2.


    Figure 18-1'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Chapter 18


    The solution, which will be explored step-by-step in the next chapter, uses a
    successfully compiled ActionScript2-based map application using the AS-Flash API.
    In a unique and effective approach, you can create a simple map application and
    link it to your Flex 2 project. The technique is called local connection and enables
    it to bridge Action 2-based SWFs with Flex 2 applications.


    The solution was born of an article posted by Peter Ent of Adobe. Because Flash
    Player 9 was targeted to completely outperform its predecessors, it had to be
    run on ActionScript 3 independently from ActionScript 2. It can, however, run
    ActionScripts in virtual machines — the compartments of Flash player where only
    one version can run at a time.


    Picking up on this concept, Nahul Foronda from asfusion adapted successfully for
    Yahoo! Maps. This concept allows for the AS-Flash API to run (using an ActionScript
    2 virtual machine) on one side and establishes a bridge to that of the ActionScript
    3-based Flex application on the other side. The local connection itself be established
    with very little code and creates a solid line of communication between the two
    SWFs. Both the AS-Flash based map application and the Flex 2 application are compiled
    as SWFs.


    If you skipped ahead to this chapter and section of the Flex, it would be helpful
    to go back and review Chapters 13–17 on the AS-Flash API. In the next chapters
    and to come, you will learn how to code this今回 and build your map application
    with the cutting-edge technology of Flex 2.


    # Getting Flex 2


    Adobe can be obtained at Adobe''s product site: www.adobe.com/products/flex/.
    If you are new to Flex 2, you can download a 30-day trial and evaluate the technology
    during that time. You may need to log in or create an Adobe account. The site
    is wealthy with demos, solutions and technical information on the platform. It
    also features some video interviews with teams that have successfully implemented
    Flex 2 solutions.


    If you are downloading the trial, these steps will guide you through the download
    and installation process:


    +   1. Choose Flex Builder 2 by selectingEnglish Windows file size and click Download.

    2. Save the file to the folder of your choice and the somewhat lengthy download
    will begin. Once it''s complete, click run.

    3. The Install Shield Wizard for Flex 2 will run. Click Next and the installation
    will extract the necessary files. It may take some time.

    4. When prompted to install an set, choose Flex Builder and Flex SDK. This will
    install the IDE for Flex, Flex Builder 2 as well as useful SDK and debugging tools.
    As the instructions note, Flash Player 9 will also be installed, if you don''t
    have it. Click Next and the installation will be begin.

    5. Read the terms and accept them. Click Next to continue. The installation process
    will continue, prompting you at various points. Choose the best options for you.
    Finally, the actual will occur.

    6. Lastly, the installation will prompt you about Cold Fusion documentation. This
    step is not necessary for working with maps. To launch Flex Builder 2, find the
    Adobe folder in your Programs menu and click Adobe Builder 2.'
