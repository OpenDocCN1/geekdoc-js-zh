  md: '# # Yahoo! Maps MASHUPS


    Your development world is about to greatly expand because of the new wave of Yahoo
    Maps APIs. Written by Charles Freedman, a senior Flash developer at Yahoo, this
    book provides you with all the information you''ll need to know these APIs in
    order to build amazing mashups. You will find in-depth coverage of Yahoo mapping
    tools and technologies and a variety of techniques for using them.


    ! Maps Mashups explores each API flavor, guiding you through the comprehensive
    set of API calls. This will help you gain a great understanding of the capabilities
    of each map technology. Freedom also uses each API''s uniqueness to explore the
    basic and advanced set of API methods, classes, and events. With this information,
    you will be able to download, install, and develop mashups with one or all of
    the Yahoo Maps APIs.


    # What you will learn from this book


    +   * All about Yahoo! Maps API and the technology that drives it

    * How to build mashups featuring popular web services like Flickr; Hot Jobs; Yahoo
    Travel; local, real-time traffic; and video

    * How to easily adapt from Ajax to the JS-Flash API

    * Techniques for building Flex 2 mashups using the AS-Flash API

    * How to use map features such as panning and zooming, markers, and geocoding


    # Who is this book for


    This book is for Web developers who have some experience with languages and technologies
    as HTML, JavaScript, Ajax, XML, or Flash/ActionScript. Everything in the book
    is explained in detail along source code, which makes this a useful resource regardless
    of your experience level.


    # More Wrox Mashup books available:


