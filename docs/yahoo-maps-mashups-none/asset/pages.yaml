  md: '# Summary


    This chapter introduced using the AS-Flash API with Flex 2, as well as the new
    technology from Adobe itself. You now know the following:


    +   - Flex 2 improves upon many of the code efficiencies and methodologies released
    earlier as Flex 1.5. With its wide array of containers and components, most of
    what you will ever do with Flex is already built in to these highly configurable
    elements.


    +   - Flex 2, unlike Flash, does not feature a timeline, frame or layer interface.
    Many hardcore application developers consider this an advantage of the Flex platform.


    +   - MXML is an XML-based layout and business-logic document that is all a simple
    Flex application needs to be compiled.


    +   - The AS-Flash API can work with Flex 2 using a local connection, which Flash
    platform-based technologies used to register SWFs with each other and communicate.'
