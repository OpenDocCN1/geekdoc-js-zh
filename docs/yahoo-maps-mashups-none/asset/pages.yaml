  md: '# The AS-Flash API


    As with layers, you may eventually come to prefer handling instances in ActionScript
    instead of managing them with symbols on the stage.


    # Fundamentals of ActionScript 2


    ActionScript 2 (AS 2) is the fuel to the fire of modern-day Flash applications.
    ActionScript 2 changed the way developers use Flash. It changed the caliber of
    web tools built with Flash, enabling users to go from animation and website movies
    to full-fledged dynamic web applications.


    The effects of the introduction of ActionScript 2 were also seen outside the Flash
    community. Developers who had written off Flash as nothing more than a design
    tool started to look closely. They saw in ActionScript 2 a familiar syntax, one
    that closely resembled the JavaScript, Java and object-oriented programming languages
    they valued for many years.


    Before ActionScript 2, ActionScript was authored in the Flash IDE. The code was
    added to specific frames as well as to symbols based on the tasks they needed
    to perform. With ActionScript 2, code can be included into a frame by means of
    #include. This enables you to author ActionScript 2 code outside the Flash IDE
    and import it at compile time into the SWF.


    The ability to code outside the Flash IDE becomes much easier when you''re writing
    classes. Since class is a stand-alone file, other tools began sprouting up to
    making coding ActionScript2 classes easier. These tools PrimalScript by Sapien,
    PJ/Y and Eclipse. Eclipse is an open-source IDE, meaning that it is free and supported
    by the development community.


    ActionScript 2 relies on a virtual machine, a platform that runs on many operating
    systems, to process compiled code. Flash Player 7 and 8 include the virtual machine
    and can handle all ActionScript 2 in the compiled Flash applications. At the time
    of writing, ActionScript 3 has just been released. ActionScript 3, coinciding
    with the release of Flash Player 9, improves even more on Flash technology. However,
    ActionScript 3 is built on a different virtual machine, meaning its compatibility
    with ActionScript 2 is extremely limited.


    # The Actions Panel


    The easiest way to add ActionScript to Flash is through the actions panel in the
    Flash IDE. As I mentioned previously, code is usually attached to a frame in the
    Flash IDE. However, it needs to be authored in this panel.


    The panel is not open by default and can be a little tricky to locate for a new
    developer. To open the panel, go to Window Development Panels Actions. You can
    also use the shortcut F9. Refer to Figure 3-4.


    The actions panel has some useful features. You will see several icons in the
    top left. The first one, the plus symbol, is very useful to a beginner. When clicked,
    this will let you add any line of ActionScript available to your application.
    What is great about this feature is that after you add a line of code, such as
    a method, it will then assist you with the parameters that can be passed to round
    out what works best for you. As you begin to develop, you should explore these
    features and start using a third-party IDE, much of the information provided by
    these features will be second nature to you.


    145'
