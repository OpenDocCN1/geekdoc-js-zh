  md: '# Chapter 15


    # setZoomLevel()


    setZoomLevel() sets the zoom level of the map. It accepts one parameter, a number,
    that is the value of the zoom level you want to change the map. The zoomLevel
    can be set to a value between 1 and 16.


    ```

    mapInstance.setZoomLevel(zoomLevel:Number);

    ```


    In this sample, the zoomLevel is set to 6:


    ```

    myMap.setZoomLevel(6);

    ```


    Two events are broadcast when the zooming is engaged in the API. EVENT_ZOOM_START
    is fired when the API starts zooming, and EVENT_ZOOM_STOP is sent when the API
    has completed zooming.


    You can set the zoomLevel with user interaction. You can design buttons to increase
    or decrease the zoom level of the map. You can combine those buttons with a slider,
    ranging in value from 1 to 16, to create a zoombar. In Chapter 16, “AS-Flash API
    Advanced Features,” you will learn how to use the NavigatorWidget, an interface
    that combines a zoombar with other useful tools to help users navigate your map.


    # setCenterAddress()


    The setCenterByAddress() accepts two parameters, address and duration. A successful
    address is a full street address with city, state and ZIP. (Certain metropolitan
    areas will work as well.) The address is converted by the API ge-coder to a latitude
    and longitude, and the map reloads its tiles and center on that value.


    To handle this transition smoothly, you can use the duration parameter to tell
    the API how long it should take to pan from its current position to the one you
    have defined. The duration parameter is the number of milliseconds the map will
    take to pan.


    ```

    mapInstance.setCenterByAddress(address:String, duration:Number);

    ```


    This example shows what the code would be to change the map to San Francisco and
    pan from its current location for 300 milliseconds:


    ```

    var address:String = "San Francisco"

    var duration:Number = 300;

    ```


    ```

    myMap.setCenterByAddress(address, duration);

    ```


    Some events are fired when setCenterByAddress() is called. EVENT_MAP_GEOCODE_SUCCESS
    is dispatched when the API has successfully ge-coded the address and has resolved
    it as a latitude/longitude coordinate. If the address entered cannot be ge-coded,
    the EVENT_MAP_GEOCODE_ERROR is broadcast. If this should happen, an array of suggested
    addresses will be sent as a data object with this event along with the originalAddress.
    You can use the message attribute returned with this event to alert users to try
    a new address or select a suggested one. Since international geo-coding recognizes
    many variations of city names, it is difficult to generate a ge-coded error'
