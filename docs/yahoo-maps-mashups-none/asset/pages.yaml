    Take a look at the CSS code on the right (shown in Figure 18-3). Dropping this
    into your application code provides a simple way of customizing a highly functional
    yet-ordering control into something with your own flavor. Notice how you do not
    need to apply a file or draw a square symbol as in the Flex IDE. While some developers
    like the total control of Flex, many are finding the efficient way of styling
    controls, as this example application shows, to be a very virtuous feature of
