    \ of Florida, at a zoom level of 11. Appearing over the map should be a series\
    \ of yellow lines connecting Ft. Lauderdale, Florida, with various points in the\
    \ Bahamas.\n\n# How It Works\n\nAfter setting up the map to display with the usual\
    \ style definition and div tag, the initial map properties are set. The map type\
    \ is defined when the map object is created and is set to display hybrid tiles.\
    \ Using zoomAndCenter, the map is centered on an address and the zoom level.\n\
    \nA series of GeoPoints are defined and will represent the points the lines will\
    \ be drawn to and from. The Polyline object is created and passes the list of\
    \ defined points, along with properties defining the line style to be thin, semitransparent.\n\
    \nAs the YPolyline object, represented by polyOverlay, is added, the API will\
    \ draw a series of lines in a layer above the map. This layer will stay attached\
    \ to the map as you pan, drag and zoom it.\n\n# GeoRSS\n\nThis class and type\
    \ of overlay enables you to populate the map with markers defined from a geo-coded\
    \ feed. This special version of RSS XML contains geo-coded objects. A geoRSS feed\
    \ adds extra data like latitude/longitude or address in addition to location information.\
    \ The following is a sample of the geoRSS feed that will be used in the following\
    \ exercise:\n\n```\n<item>\n  <title>Title to appear in Marker</title>\n  <link>Link\
