  md: '# Chapter 16


    # CustomSWFOver


    The customSWFOOverlay combines the flexibility of the geoRSSOverlay with the potential
    of the customSWFMarker. Essentially, instead of your geoRSS feed loading images
    as markers, it can load SWFs. In addition, you can call methods against those
    SWFs through the callCustomMethod method, reviewed in detail with the CustomSWFMarker
    class example in this chapter.


    Since few geoRSS feed load SWFs, particularly ones that have exposed methods,
    this is not a very frequently featured class in AS-Flash-based mashups.


    # Summary


    This chapter explored the advanced features of the AS-Flash API, rounding out
    the roster of methods, events and classes available with the API. After reading
    this chapter, you are now able to


    +   - Listen for various panning and zooming events and program timely functions


    +   - Add widgets that will enhance the usability of your map application while
    saving loads of development time


    +   - Implement the essential pan tool as well as create your own mouse interaction-based

    customSWFTool


    +   - Add several types of markers, both prepackaged and custom-based on your
    own creativity, at latitude/longitude and address


    +   - Work with the API’s built-in mashup engines, called overlays, adding features
    like local search results and real-time traffic to your map'
