  md: '# The JS-Flash API


    ```

    <a href="javascript:newWindow(''http://www.mashupeperts.com/'')">Launch Window</a>

    </body>

    </html>

    ```


    You will notice that the meat of the script is set in the head of the HTML. This
    is where the JavaScript is defined and where the function is set. This function
    becomes available to the rest of the code within the HTML and can execute the
    same code over and again as called upon. The newInput function will create a new
    browser window by calling open the current browser window object, the one you
    are in. The function is actually called when the "launch window" is clicked. This
    link is tagged with javascript:newWindow, which tells the browser to call the
    function of that name within the JavaScript set of code.


    JavaScript, as mentioned above, has a strong ability to control and manipulate
    the browser''s elements (or objects). It does this by the DOM (document object
    model) of the browser. This includes the window, location, history, document and
    navigator elements and objects of the browser. DOM control is a key ingredient
    in controlling how the JS-Flash maps API appear on the web page.


    Since JavaScript is an ECMAScript language, there are some common abilities featured
    in other languages that follow this standard. In the book you will work with ActionScript,
    the language of Flash and the key ingredient in working with the JavaScript-Flash
    (AS-Flash) API.


    # Including External Code


    JavaScript can be coded in a stand-alone file with the .js extension. Using these
    files can limit the amount of JavaScript in your .html document and make it easier
    to maintain. You can add a .js file to your web page with a simple line of code:


    ```

    <script type="text/javascript" src="javascriptToLoad.js"></script>

    ```


    When included in your web page, the .js file is referred to as a library. JavaScript
    libraries are used in both the Ajax and JS-Flash APIs. Including them in the code
    makes available to you all the classes and methods of the API. As you will see
    in the next chapter, including the JavaScript library for the JS-Flash API will
    ultimately cause the SWF of the Flash-generated map to be displayed.


    # Commenting Code


    As many languages, JavaScript provides a way to disable code. This is an important
    part of development. If you are new to JavaScript, one of your first passes at
    applications will be the result of much trial and error. You will need to master
    the simple art of commenting code as you try different ways to do things and keep
    code throughout your first set of classes and the application you develop.


    Commenting is very important when you use code that will be shared with other
    developers. It gives you a way to tell developers what you were doing and why.
    It is good practice to leave comments before each set of variables as well as
    above each function. Good third-party JavaScript editors change code to gray when
    it is commented out. This is a very helpful feature as it helps you identify and
    ignore unused sections of code.


    There are two ways to comment out in JavaScript. The first uses two backslashes
    like this:


    ```

    //This line is commented out.

    This line is not.

    ```'
  merge: -1
