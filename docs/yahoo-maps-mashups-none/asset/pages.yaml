- img_proc: true
  md: '# Advanced Features: Flex 2 Using the AS-Flash API


    EVENT_ZOOM_STOP and EVENT_ZOOM_START pair up much like the events discussed earlier
    and are dispatched when the map begins zooming and when it ends, respectively.
    These events work like EVENT_ZOOM, but offer even more precise timing when they
    are fired. These events enable you to trigger other actions in your application
    exactly when the map starts zooming and exactly when it stops. The data available
    are similar to that in EVENT_ZOOM, just without the currentZoomLevel property.


    # Working with Widgets


    Widgets are the prepackaged sets of user interfaces that ship with the map API.
    They reflect some of the most commonly used technology on consumer map applications
    like Yahoo! Adding widgets can save you time over having to replicate the functionality
    with your own UI. Using your knowledge to existing asFlashAPI, MapConnector and
    Flex2Maps classes requires little modification.


    # Widget Methods


    The simple methods available for widgets are part of the map class. These methods
    are available when the map instance is initialized. However, without importing
    the class you want to add, you cannot use these methods.


    # addWidget()


    This method simply adds a widget to your map instance. In most cases, you will
    want to create an instance of the widget first and then plug instance name into
    the map as its line parameter.


    ```

    mapInstance.addWidget(widget:Object);

    ```


    # removeWidget()


    Like the tool methods, this removes the widget, effectively deactivating its functionality
    to the user. It too accepts one parameter, the instance name of the widget it
    is removing.


    ```

    mapInstance.removeWidget(widget:Object);

    ```


    # Widget Classes


    These classes included with the API come with all you need to turn on of their
    functionalities for your users. Each class must be imported and you should create
    an instance of the widget before adding it to the map. This lets you reference
    instance throughout your code, so you can remove it more easily and add event
    listeners to it.


    +   NavigatorWidget: The Navigator represents the most functional out-of-the-box
    feature that comes with the API. While not customizable in appearance, the Navigator
    widget provides several functionalities with very little code. The NavigatorWidget
    has the ability to appear open (expanded) or close (collapsed). Two methods, open()
    and close(), are included in the class. They can be called against the widget''s
    instance to change its state after it has been.


    +   ToolbarWidget: This adds a menu of icons to the top-left corner of your map.
    It acts as a start menu, like the one found at the base of the screen in your
    operating system. Its contents are a row of icons, each representing a tool you
    have added to the map.'
  merge: -1
