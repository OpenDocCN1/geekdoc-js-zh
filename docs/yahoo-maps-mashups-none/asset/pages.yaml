  md: '# Yahoo! Maps and Flex 2


    ![](img/1617eb1f737d2e225712aa0e0bbc3d21_276_0.png)


    Figure 18-3


    # # Fundamentals of MXML


    MXML is the markup language of Flex. Its primary function is to store the interface
    and application structure of your Flex 2 application. Closely resembling XML in
    format, MXML induces careful coding and practices by easily separating the presentation
    and data logic of your application.


    Unlike Flash, Flex 2 has no .fla to localize its source code. However, Flex 2
    does let you code ActionScript stand-alone classes. A simple Flex 2 application
    may feature one MXML file, whereas a medium to large application may need several
    MXML and ActionScript (.as) files to operate. For the simple application, the
    MXML file acts like the .fla, providing the blueprint for the application.


    Many developers like this approach since the interface layout coexists with the
    functionality and logic of the application in one file. Since no user interface
    elements or components are setting within a timeline on layers and frames, MXML-based
    Flex 2 applications can be replicated easily. They also tend to be more easily
    maintained by RIA development teams.


    MXML files can be edited in IDEs other than Flex Builder 2. The most common and
    powerful tool out there happens to be the very tool Flex Builder 2 is built on.
    Eclipse, mentioned in Chapter 13, "The AS-Flash API," is capable of editing many
    language files and has long been a favorite development tool.


    249'
