  md: '# Chapter 19


    With the AS-Flash API, all code that you will write starts to execute when EVENT_INITIALIZE
    is fired. So, listening effectively for this event is key to building your mashup.
    While events will be explored much more in the chapters to come, this exercise
    will end being the foundation for what you will do with this API.


    In order for the application to use EVENT_INITIALIZE, a method called addEventListener
    must be added to the map component''s instance. This method accepts two parameters:
    the event (com.yahoo.maps.api.YahooMap.EVENT_INITIALIZE) and the method to call
    (onInitMap) when the event is detected:


    ```

    myMap.addEventListener(com.yahoo.maps.api.YahooMap.EVENT_INITIALIZE,

    onInitMap);

    ```


    This code tells the map component to actively listen for the event to be called.
    Once it “hears” the event, it calls the function onInitMap. Within this function,
    the pan tool is initialized. The event is ultimately forwarded via the local connection
    to the _flexClient of the application.


    # Create the MapConnector Class


    Think of the MapConnector class you are about to create as the communication bridge
    between the Flash and Flex clients of this application. This class will be used
    by the Flex client as its local connection object, facilitating commands to the
    Flash client as well as handling incoming events.


    # Coding the MapConnector Class in ActionScript


    This is a stand-alone class, although ultimately referenced by the MXML you will
    write, that will live as an .as file. ActionScript classes are coded with the
