    # Map Get Methods


    Using these methods you will retrieve map settings for other functions in your
    application. Just as with the set methods, the naming convention of these methods
    helps you identify what data they will return to you.


    Get methods work efficiently in the API. Since the value is already set, most
    likely by calling the set method counterparts of the get methods, all the API
    needs to do is return the value to you. For development, get methods are very
    easy to implement, as they require no parameters to operate.


    As you code your application, you will find that get methods make development
    much easier. Rather make sure your code “remembers” what values have been set
    throughout your application’s operation, you can call a get method anytime and
    have the latest value. The get methods also help with user interface implementation.
    You will need a starting point, a default value at which to position your interface
    elements. The get methods will provide those data.'
