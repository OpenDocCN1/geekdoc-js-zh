  md: '# # Acknowledgments


    I have benefited from the support and encouragement of many people during the
    long and rewarding journey of writing this book. First let me thank the folks
    who make the APIs covered in the book worth writing about, the Yahoo! Maps Team.
    A special thanks to the product and engineering managers and developers, and particularly
    to Aaron King and Zach Graves. Their personal dedication to the quality and performance
    of the Flash APIs is represented in the spirit of this book.


    While more than half of this book covers Flash, a technology I am proud to consider
    myself a champion of, an important part covers the incredibly versatile Ajax API
    Mirek Grymuza has crafted this API and technology into the widely adopted, well-engineered
    and admirable solution that it is. In addition to lending his valuable services
    as technical editor for the Ajax chapters of this book, Mirek''s influence on
    my appreciation and understanding of Ajax will remain long after these pages are
    written.


    Many thanks to friends and family for your patience and understanding, while I
    took on this huge endeavor. Especially my brother Nathaniel who made sure I didn''t
    miss my entire California summer. (More about that in Chapter 22.) Thanks to Rob
    Abbott for never letting me forget the importance of what I was writing. Also,
    thanks to Clint Modien for bringing the opportunity for writing the book to my
    attention in the first place.


    Thank you to the editors at Wiley for helping me along with your guidance and
    direction.


    A most endearing thank you to my wife, Jamie, who didn''t think twice when insisting
    that I take on this project. She knew how important this was to me. Her encouragement
    from the beginning allowed me to dive into this book and never look back.'
