    # How It Works


    The local connection object starts with a simple line of code. This object will
    handle establishing the connection as sending events on behalf of the __flashClient
    side of the application. The local connection will also listen for events sent
    through the same local connection by the _flexclient counterpart. You will code
    this a bit later in this chapter.


    In order for you to be able to control the map, it needs to initiate first. The
    map has initialized when it fully loads. The API broadcasts an event named EVENT_INITIALIZE.
    Since the component is busy building the map display based on the initial parameters,
    it does not accept code very well until it has completed loading. In other words,
    it is best not to attempt to control the map until it initializes.'
