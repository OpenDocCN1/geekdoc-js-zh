  md: '# Flex Builder 2: The Flex Authororing Tool


    The Flex IDE is the authoring tool used to develop applications for Flash. The
    term Flex can refer to the player or the platform technology, it is usually to
    mean the authoring tool. Flash was originally made popular by Macromedia, an innovative
    company purchased by Adobe in 2005. Flex is available as stand-alone software
    for purchase online and in stores. It has been bundled with other multimedia offerings
    from Flash and Dreamweaver.


    Files generated with Flash are commonly output examples as SWF (ShockWave Flash)
    files. The main visual elements of Flash are vector and raster graphics. While
    JPEG images have been displayable in Flash for some time, the latest versions
    are also to display GIFs and PNGs.


    As a multimedia tool, Flash has little competition. One of its greatest strengths
    is the ability to embed and stream compressed data. This video technology is aptly
    named Flash Video with the extension .flv. The video, as well as audio, can be
    sent and received, creating some unparalleled communication possibilities.


    A version of the Flex IDE is required to develop and take full advantage of the
    Yahoo! AS-Flash Maps API.


    # Exploring the Flex Sample Applications


    Flex Builder 2 features fully coded examples to get started. These useful examples
    are accessible from the Flex start page that loads by default when you run Flex
    Builder 2. Adobe''s inclusion of these examples is intended to get you up and
    running as quickly as possible. This makes Flex easy to pick up and give you a
    head start building your Flex-based mashup.


    The first example is certainly not an application you would likely build yourself.
    The Flex Component Explorer is provided to give full-on working examples of the
    Flex components. Like the ActionScript components in Flash, these components are
    built to offer pre-built design and code wrapped in a highly reusable and deployable
    package.


    Launching the Flex 2 Component Explorer (in Figure 18-2), you will see a list(a
    pretty good example of the tree component) in the left pane. Expand the Visual
    Components nodes, the first folder icon, to see a list of visual controls. You
    will see very familiar terms, like “Button,” “Data,” “Text” and “Menu.” Click
    Controls and that node will expand. Click Button and boxes on the right side of
    the application will become populated. The top box shows a simulated layout with
    examples of the control compiled in different ways. The simulated layout is operational,
    and clicking each button will populate the window to the right of buttons.


    The bottom pane reveals the exact code executed to display the buttons. You are
    looking at MXML, the proprietary format of Flex. You will learn MXML in much more
    detail later in this chapter.


    While in the Flex Component Explorer, browse around, discover and play with several
    (if not all) of the controls. Take a look at the VideoDisplay component within
    Loader Controls or the list featured in General Controls. These represent some
    of the simplistic building blocks of Flex 2. Over the next few chapters, you will
    likely use several of these components to add instant usability to your Flex-based
    mashup.'
