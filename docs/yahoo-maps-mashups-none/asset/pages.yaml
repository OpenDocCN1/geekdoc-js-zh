  md: '# API Method Comparison Chart


    Developers looking to move between the Ajax and Flash APIs covered in this book
    will find the chart in this appendix very helpful. It is meant to act as a Rosetta
    stone for the APIs, indexing and comparing the various methods and classes available.
    Each common Ajax API method and class is paired with its equivalent among the
    Flash-based APIs.


    # Basic Set Methods and Classes


    As classified from chapter to chapter, the basic set methods and classes are those
    that offer primary functionality for controlling and manipulating the map''s location,
    zoom level and display type.


    | Ajax Method | Flash Method |

    |---|--|

    | YMap(mapContainer, mapType, mapSize) | Map(container, appid, location, zoom,
    mapViewType) |


    The code for creating a map object is nearly identical for both API types. The
    Flash API lets add location, zoom level and map view type.


    ```

    setZoomLevel(zlevel)

    setZoomRange(minZoomLevel,maxZoomLevel)

    addZoomScale()

    removeZoomScale()

    ```


    ```

    setZoomLevel(zoomLevel)

    ```


    This is one of those rare times when the methods are identical. In addition to
    setting the zoom, the Ajax API lets you set zoom zoom range and manipulate zoom
    scale.'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# Appendix A


    | drawZoomAndCenter(LocationType, ZoomLevel) panToLatLon(YGeoPoint) | setCenterByAddress(address,
    duration) setCenterByAddressAndZoom(address, zoomLevel, duration) setCenterByLatLon(lat,
    duration) setCenterByLatLonZoom(lat, zoom, duration) |


    You can center the map easily with the Ajax API call, which accepts both latitude
    and longitude. With the Flash API, you must choose what parameter to use to center
    the map on. However, the Flash centering methods come with panning and zooming
    ability built in.


    | mapType(mapType) | setMapViewType(mapType) |


    The only variation in changing the map view between APIs is that the Flash API
    refers to lite type as map view.


    | panToXY(YCoordPoint) | setCenterByPointDelta(point, duration) |


    In addition to centering and panning the map to latitude/longitude and address,
    both APIs change the map''s location based on x/y coordinates.


    | YGeoPoint(lat, lon) convertLatLonXY(YGeoPoint) | LatLon(latitude, longitude)
    |


    Most methods for both APIs require the latitude/longitude to be cast in an object.
    The processes for doing this are very similar. The Ajax API provides a method
    for converting a LatLon (YGeoPoint) object into XY.


    | resizeTo(new YSize,height) | setSize(width, height) |


    The APIs offer unique but similar ways to resize the appearance of the map when
    it is displayed in the mashup or application. The Ajax API requires the height
    and width values to be cast as a YSize object.


    | convertXYLatLon(new YCoordPoint(x,y)) | Point (x, y) |


    With latitude/longitude, both APIs make it easy to cast x/y coordinates into a
    Point or YCoordPoint object. Once again, the Ajax API provides a conversion method
    to go from an x/y coordinate object to latitude/longitude.'
  merge: -1
