    Another example looking at is the Flex Style Explorer. Run this example and you
    will get a good idea of the stylistic capabilities of Flex. When it was first
    released, the customizability of Flex was often called into question. Developers
    who had grown accustomed to Flex''s freestyle design for were not certain of how
    creativity could flow in the MXML-driven environment of Flex.


    The Style Explorer should point out some of the concerns that Flex does not support
    thorough customization. In this example, you can select one of several control
