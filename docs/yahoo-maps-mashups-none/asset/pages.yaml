  md: '# Chapter 22


    # Field Local Connection Events


    The ActionScript needs to listen for events from the local connection to field
    calls sent through it from the Flex client.


    ```

    //Listen for addMarker from local connection

    connectedMap.addMarkerByLatLon = function (connectionData:Object):Void

    {

    n//Clear out any existing marker(s)

    myMap.removeAllMarkers();


    //Create latlon object based on lat and lon properties from local connection

    var latlon = new LatLon(connectionData.lat, connectionData.lon);


    //Create marker object with index property for CustomPOIMarker

    var marker:Object = { index:connectionData.index };


    //Add the instance of the CustomPOIMarker to map with a latlon

    myMap.addMarkerByLatLon(CustomPOIMarker, latlon, marker);


    //Center map on latlon matching the position of the marker

    myMap.setCenterByLatLon(latlon);

    }

    ```


    This code sets up the Flex client to receive the addMarkerByLatLon call coming
    through the local connection. It is coded against the local instance of connectedMap.
    Once it fires, the first step is to clear out all markers. Pulling in the data
    from the connectionData object, you can cast a latlon with the lat and lon properties
    passed through the local connection call''s object. The index property of this
    object is used to define the property of the same name to create the new marker.


    A marker will then be added against the instance of the map, using the CustomPOIMarker
    class, the latitude/longitude and the newly created marker object, featuring the
    index property. This index is actually the title of the golf shot selected by
    the user from the List control in the Flex client. Lastly, the map will center
    itself on newly created marker using the same latitude and longitude at which
    the marker was added.


    # Completing the ActionScript


    You now take each piece you have reviewed so far and put them all together. After
    you finish this code and compile it, the SWF becomes available to be published
    to the Flex client.


    +   1. With the Flex IDE, open the Flex document asFlashAPI.fla.

    2. Save it asasFlashAPI_golf.fla.

    3. Select the first frame in the timeline. If the timeline is not visible, go
    to Timeline (Ctrl + Alt + T).

    4. Go to Window Development Panels Actions select it (or press F9).'
