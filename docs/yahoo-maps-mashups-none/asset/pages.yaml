  md: '# Chapter 14


    # Adding to the Stage


    The fastest way to start using the map API is to add the component to the stage.
    This uses the visual authoring approach to Flash, as you will be physically moving
    an element on the stage and setting its properties manually. This is advantageous
    to designers as well as developers looking for an easy way to jazz up their mashups.


    Once the API is on the stage, you will be able to add other user interface elements
    around, behind and on top of the component using the layers.


    # Try It Out Create a New Flash Document


    For the first time through, this task will be broken into several steps. In future
    exercises, I''ll simply say "Create a new Flash document."


    +   1. Open Flash.

    2. Go to File > New (or press Ctrl + N).

    3. The New Document window will open. Select Flash Document.

    4. Go to File > Save As (Ctrl + Shift + S).

    5. The Save As window will open. Create a name for your .fla file (most exercises
    in this chapter will save a file name) and enter it in the File name box.

    6. Click Save.


    Another task you will need to repeat throughout the Flash exercises is opening
    a Flash document.


    # Try It Out Open a Flash Document


    Just as in the previous exercise, the next few steps will be repeated in future
    exercises. I''ll simply say "Open the Flash document."


    +   1. Open Flash.

    2. Go to File > Open (Ctrl + O).

    3. Browse to and select the file to open.

    4. Click Open.


    The simple process of generating an application from your code is called compiling.
    The following steps to compile a Flash document into a movie will be required
    for each Flash exercise.


    # Try It Out Compile the Movie


