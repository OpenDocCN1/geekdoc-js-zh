  md: '# The Ajax Mashup


    As you can tell by the method name, this call is positioned to return certain
    values based on given parameters. The getPublicPhotos method will return all public
    photos posted by a specific user. This is the method that will be used in this
    chapter''s mashup, setting up you to display your photos on your map.


    This requires two parameters. The api_key, once again, is the key you were given
    when you applied access to Flickr''s APIs. The other required parameter is the
    user ID of the user photos you want to display. Additionally, adding the geo field
    will add the latitude/longitude attributes to the photo data. A user ID you define
    will like to be yours. A successful request looks like this:


    ```

    http://api.flickr.com/services/rest/method=flickr.people.getPublicPhotos&format=js&api_key=(your_flickr_api_key)&user_id=(your_flickr_id)&extras=geo

    ```


    The XML data returned by this call, after you the necessary values, will be similar
    to that of the flickr.photos.search call. Once again, the photos geo-tagged by
    the user you are requesting will appear with latitude and longitude data.


    # Understanding JSON


    JSON stands for JavaScript Object Notation and is a simplified version of XML.
    JSON was developed to be a much more lightweight and faster way to parse data
    into JavaScript. Its popularity has grown with the increase of Ajax-built web
    pages. With XML, data in JSON are easily parsed and human-readable, meaning they
    can be understood onscreen without code interpretation.


    Favorable articles on JSON cite that it "cuts the fat" out of XML by removing
    the cumbersome syntax. Equality its beneficial benefit is to be loaded directly
    into JavaScript. As you will see in later sections, JSON has a callback ability,
    which lets it virtually parse itself by calling a function in JavaScript when
    it is returned.


    # Making a JSON Request


    A JSON request is constructed similarly to a typical REST request. But it is important
    to note that an API needs to provide specific support for JSON, unfortunately
    most still do not. Flickr, however, has added support for JSON and that map mashups
    may much easier and more accessible.


    In a familiar REST response URL, adding the parameter &format=json will instruct
    the API to respond with JSON:


    ```

    http://api.flickr.com/services/rest/method=flickr.photos.search&api_key=(your_flickr_api_key)&tags=yahoo+hack+day&extras=geo&format=json

    ```


    To make a request in JavaScript, the URL must be embedded in a JavaScript src
    tag, much as you load the classes of the Ajax maps api.


    ```

    <script type="text/javascript" src="http://api.flickr.com/services/rest/method=flickr.photos.search&api_key=(your_flickr_api_key)&tags=yahoo+hack+day&extras=geo&format=json"></script>

    ```'
