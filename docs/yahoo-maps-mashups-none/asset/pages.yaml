    # Working with Widgets


    Widgets are the repackaged sets of user interfaces that ship with the map API.
    They reflect some of the

    most-used technology on consumer map applications like Yahoo! Maps. Adding existing
    widgets can

    save you time over having to replicate the functionality with your own UI. Applying
    this knowledge to

    your existing asFlashAPI, timeCounter and FlexMaps classes requires little modification.


    # Widget Methods


    The simple methods available for widgets are part of the map class. These methods
    are available when

    tmap instance is initialized. However, unless you import the class of the widget
    you want to add, you

    cannot use these methods.


    These classes included the API come with all you need to turn on each of their
    compact functional-

    ty your users. Each class must be imported and it is suggested that you create
    an instance of the wid-

    before adding it to the map. This lets you reference that instance throughout
    your code, letting you

    remove and add event listeners to it easily.


    # addWidget()


    This adds a widget to your map instance. In most cases, you will want to create
    an instance of the

    widget first and then plug that instance into the method as its lone parameter.


    ```

    mapInstance.addWidget(widget);

    ```


    # removeWidget()


    Like the tool methods, this removes the widget, effectively deactivating its functionality
    to the

    user. It accepts just one parameter, the instance name of the widget it is removing.


    ```

    mapInstance.removeWidget(widget);

    ```


    # NavigatorWidget


    This is the most functional out-of-the-box feature that comes with the API. While
    it is not customizable

    in appearance, adding the navigator widget provides several functionalities with
    very little code.


    Many of the methods you learned in the last chapter let you programmatically center
    the map, the pan

    map and change its zoom level. The navigator, with its mini-map combined with
    the zoombar, lets the

    user do all that in one space.'
