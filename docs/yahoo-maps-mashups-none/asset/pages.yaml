- img_proc: true
  md: '# Ajax Method Comparison Chart


    APIs, their functionalities are very similar. The Ajax API comes with much overlay
    functionality built in its map class. The Flash API does offer several avenues
    of customizability through a series of CustomSWF classes, such as the CustomSWFMarker.


    | Ajax Method | Flash Method |

    |---|---|

    | addMarker(YGeoPoint, id) | addMarkerByLatLon(markerClass, latlon, data) addMarkerByAddress(markerClass,
    address, data) |


    Adding markers to the map is a simple task with both of APIs. You use the open-ended
    addMarker method in the Ajax API. For the Flash API, you can choose your method
    based on whether you are adding the marker by latitude/longitude or address.


    | removeMarker(id) | removeMarker(marker) |


    Removing a marker is nearly identical between the API types.


    | removeMarkersAll | removeAllMarkers() |


    Both APIs provide the same method for removing all added markers to the map instance.


    | addOverlay(Overlay) | addOverlay(overlay) |


    The blanket method for adding overlays to the map instance is identical between
    APIs.


    | removeOverlay(overlayObject) | removeOverlay(overlay) |


    Once you have an overlay instance, the method for removing it is the same in both
    APIs.


    | searchLocal(YGeoPoint, query, radius, nresults) | LocalSearchOverlay() |


    The LocalSearchOverlay() class in the Flash API leverages a built-in hook to the
    Yahoo! Local API. Once you have added the LocalSearchOverlay() class, calling
    search() against this overlay instance will return results as markers on the map.
    The Ajax API has a similar built-in ability to query the Yahoo! API and return
    location data.


    | searchTraffic(YGeoPoint,radius) | TrafficOverlay() |


    Comparable to the local search functionality, the traffic overlay will add traffic
    indicators based on the map. Both APIs have an effective solution for this.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# Appendix A


    | YGeoRSS(URL) | GeoRSSOverlay(url) |

    | getGeoBox(points) | |

    | geoCodeAddress(address) | |


    The ability to add geo-encoded RSS feeds is built in the map class of the Ajax
    API. To add a geoRSS overlay in the Flash API, you need to add an instance of
    the GeoRSSOverlay class.


    | YPolyline(points, color, width, alpha) | PolylineOverlay(url) |

    | getPolylineIds(id) | |

    | getPolylineObject(id) | |


    Polyline functionality is added to the map instance of the Ajax map with the YPolyline
    class. Within its constructor, you can define the points to plot, as well as the
    color, width and alpha value of the line. All this information can be built in
    an XML file and added with the PolylineOverlay class of the Flash APIs.


    | YImage(srcImg,sizeImg, offsetSmartWindow,offset) | CustomImageMarker(url) |


    You add an image marker with the Flash API by defining the CustomImageMarker class
    and the path to the marker when adding a marker instance. With the Ajax API, it''s
    a bit more involved, requiring you to create a YImage instance and define parameters
    before the marker.


    | YMarker(YGeoPoint, YImage, ID) | CustomPOIMarker(index, title, description,
    markerColor, strokeColor) CustomSWFMarker(url, ref) WaypointMarker(waypointIndex)
    |


    The generic marker class is very standard with the Ajax API. In the Flash API,
    along with the CustomImageMarker, you can add a customPOIMarker, build your own
    Flash marker with CustomSWFMarker, or add a basic WayPointMarker.'
  merge: -1
