    # # How It Works


    By defining the JavaScript source using the src attribute of the JS-Flash API
    library, you have made all the classes available to your web page. You set the
    JavaScript tag. This effectively imports or "pulls in the latest fields available,
    under the version you specified in the URL.


    The next step is to create a space on your web page, a container for displaying
    the Flash-generated map tiles. Using the style tag, you create a style class `mapContainer`.
    This is set to have a width of 800 pixels (800px) and a height of 400 pixels (400px).
    In the future, these dimensions can change based on the viewable area of the map
    you design in your web page.


    Within the body tag of your HTML, you add a div tag with the ID mapContainer.
    This will assign the properties of the mapContainer class in the style tag you
    are creating. Effectively, this will size the DIV to 800 by 400 pixels and ultimately
    fill the free space in a map with that of size.


    Still within the body tag, additional JavaScript will actually trigger the map
    to turn on with some example properties. This section of code deserves close review,
    as it is your first usage of the JS-Flash API code itself:


