  md: '# Fundamentals of CSS and DHTML


    CSS is a means of defining style for laying out HTML in the browser. The standard
    was designed to address the layout and appearance limitations of native HTML.
    Styles let you define sets of styles as classes within a style tag. These styles
    can be referenced and applied throughout your HTML.


    Within the sets of styles you will usually find properties like color, width,
    height, font weight and other style attributes. Style sheets can be coded within
    the head tag of the HTML code. If you are looking to apply the same style classes
    to multiple HTML documents, you can central the CSS in its own file and reference
    it to any HTML document. This enables you to maintain one file for your site or
    web application.


    While styles are referenced within everyday HTML tags, they are more frequently
    used with tags span and div. These tags are part of DHTML (Dynamic HTML), a slight
    modification to the language that allows for more dynamic handling of web content.
    Both tags build containers, which are elements that exist on the web page, over
    or outside the boundaries of regular HTML. These containers rely heavily on CSS
    for positioning and appearance.


    The syntax of CSS can be tricky, but it is easy to get the hang of. This example
    shows how CSS and DHTML are used to position the DIV container for the Ajax API:


    ```

    <html>

    <head>

    <style type="text/css">

    #container {

    position: absolute;

    left: 100;

    top: 100;

    border-style: solid;

    border-color: #FF0000;

    border-width: medium;

    }

    </style>

    </head>

    <body>

    <div id="container">

    </div>

    </body>

    </html>

    ```


    The combination of CSS and DHTML in this sample will create a small rectangle
    that appears 100 by 100 pixels from the top-left corner of the browser. The rectangle
    has a sharp red border and displays the text within. As you can see, all the style
    properties are inherited when the div tag references container in its id attribute.
    See Figure 3-1.'
  merge: -1
  pgno: 50
