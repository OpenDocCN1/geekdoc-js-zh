  md: '# Chapter 10


    The order of operation for this method is as follows:


    +   1. The method is called:

    mapInstance.setCenterAddress(address, zoomLevel, duration);


    +   2. The address is geocoded, firing EVENT_MAP_GECODE_SUCCESS or

    EVENT_MAP_GECODE_ERROR.


    +   3. The map pans based on the duration, in milliseconds, defined in the duration
    parameter.

    4. The map centers on the resolved latitude/longitude coordinate.


    +   5. The map zooms to the level defined in the zoomLevel parameter.


    Common usage of this method looks like this:


    ```

    var address:String = "Casablanca"

    var zoomLevel:Number = 6;

    var duration:Number = 3000;

    myMap.setCenterAddress(address, zoomLevel, duration);

    ```


    The first three lines declare and the variables to pass inside the method. Finally,
    the method is called. Note that zoomLevel is placed between address and duration.


    # mapGeocodeSuccess, mapGeocodeError


    There are some useful events when setCenterAddress() and setCenterAddressAndZoom
    are called. EVENT_MAP_GECODE_SUCCESS is dispatched when the API has successfully
    geocoded the address passed and has resolved it as a latitude/longitude coordinate.
    If the address cannot be geo-coded, then the EVENT_MAP_GECODE_ERROR is broadcast.


    If the latter should happen, an array of suggested addresses is sent as a data
    object with this event along with the originalAddress. You can use the message
    attribute to alert users to try a new address or select from a suggested one.
    Since international geo-coding recognizes many variations of cities, it is difficult
    to generate a geo-code error event.


    # setCenterLatLon()


    If you know the latitude/longitude coordinate on you want to center the map, you
    can use setCenterLatLon(). A major benefit of this method is that it executes
    more quickly than setCenterAddress(). The reason for this is that this method
    does not need to get geo-code address and resolve a latitude/longitude.


    setCenterLatLon() also accepts the duration parameter. Because there is no conversion
    between address and lat, the panning effect will engage much more quickly.


    ```

    mapInstance.setCenterLatLon(latlon:LatLon, duration);

    ```


    You''ll notice that the latlon variable does not belong to any of the variable
    types in the last chapter. Because the latlon variable being passed is an instance
    of the map API''s LatLon object. You must pass a LatLon object as the first parameter
    of the setCenterLatLon() method, and for that to happen, the latitude/longitude
    you want to pass needs to be cast as a parameter.'
