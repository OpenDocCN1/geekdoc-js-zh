  md: '# Chapter 5


    # How It Works


    Much like the example at the beginning of this chapter, this web page starts by
    importing the Ajax Maps API library. After defining the style and positioning
    the map, a form is constructed. This form features a text input field labeled
    “New Address” paired with a button labeled “Go.” Also part of the form is a text
    area for displaying data as they occur.


    The JavaScript handles the population of the map. Note that the satellite tile
    definition is included in the constructor of the map instance. Once the map is
    created, the initial position of the map is set to Denver, Colorado, using the
    drawZoomAndCenter method.


    The drawZoomAndCenter() method appears again, inside the drawMap() function. This
    function is called when the Go button within the form is clicked, instructing
    the map to redraw itself to a location the user defines. While this method supports
    changing the zoom level as well, the exercise does not include support for that
    functionality. Would combine elements from the first exercise in this chapter
    to include it.


    Once the map re-centers, the endMapDraw event is fired. The YEvent will hear this
    and call for onMapChange. This function populates the text area in the form with
    the latitude and longitude of the center of the map.


    Secondly, a YEvent Capture will pick up the onPan event. As you learned in this
    section of the chapter, the onPan event is fired when the map is clicked and dragged.
    Tying this event to the same onMapChange function creates the unique effect of
    continuously displaying the updated map center as the map is dragged. The level
    of activity of this functionality displays further evidence of how well the Yahoo!
    Maps API really performs.


    # Summary


    This chapter introduced you to several of the basic methods available in the Ajax
    API. Here is a summary of what was covered in this very significant chapter:


    +   - The Ajax API dispatches events that can be captured and handled with one
    simple line of code.

    - set methods are responsible for defining and changing different elements of
    the map.

    - get methods can be called to retrieve specific properties of the map instance.

    - HTML form elements, working with the Ajax API, can let users control and change
    most aspects of the map’s functionality.'
  merge: -1
