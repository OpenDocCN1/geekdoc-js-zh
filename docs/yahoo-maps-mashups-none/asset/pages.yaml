    # Working with Markers


    You can''t really create a mashup without adding markers. Markers are the indicators
    of locations on your map. They are added by address or latitude/longitude. In
    addition to methods, there are ways to remove markers programmatically based on
    user interaction. Marker classes enable you to define the type of marker you add,
    be they standard markers or markers you can design and develop from scratch.


    You can add markers one by one as well as adding certain overlays. If you have
    a database, XML file, web-service response or other data source with many addresses
    and lat coordinates, you will likely use a looping method for/each to add markers.


    # Marker Methods


    This small set of methods represents the most commonly used functions in mashups:
    adding markers. Each method lets you control the location and appearance of every
    marker you add on the map.


    # addMarkerByAddress()


    This method lets you add markers to a location using an address.


    ```

    mapInstance.addMarkerByAddress(markerClass:Class, address:String, data:Object);

    ```


    The MarkerClass defines what type of marker you are adding. To successfully add
    a marker you must import the class of the type of marker you reference in this
    parameter. The types of markers, reviewed in the following sections, have unique
    functionality and presentation attributes.


