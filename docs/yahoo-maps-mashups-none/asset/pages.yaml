  md: "# Chapter 3\n\nThe key to most Ajax-based applications is the JavaScript object\
    \ XMLHttpRequest. This object enables server communication to occur within the\
    \ browser and is commonly referred to as the Ajax engine. Rather than the browser\
    \ submitting data and refreshing with the server's response, this object handles\
    \ all the work. The flow looks like this:\n\n+   1. HTML loads a form, which is\
    \ displayed with JavaScript and CSS.\n2. The user fills out the form and submits\
    \ it.\n3. Ajax submits the data and receives the response.\n4. The JavaScript\
    \ loads the response with CSS, without refreshing the browser.\n\nXMLHttpRequest\
    \ is constructed within JavaScript in your HTML document. There is one quirk in\
    \ the process that needs to be met. Microsoft Internet Explorer does not use the\
    \ native object; rather it uses an ActiveX version of it XMLHttpRequest. When\
    \ coding the code, you can use the object to determine how the XMLHttpRequest\
    \ object can be set.\n\n```\nvar xmlhttp = null;\nif (window.XMLHttpRequest) {\n\
    \  xmlhttp = new XMLHttpRequest();\n} else if (window.ActiveXObject) {\n  xmlhttp\
    \ = new ActiveXObject(\"Microsoft.XMLHTTP\");\n}\n```\n\nThis script checks for\
    \ the native object support first. If it is not, the application will assume the\
    \ browser is Internet Explorer and set the object to the Microsoft.XMLHttpRequest\
    \ object. The next step is to create the:\n\n```\nxmlhttp.open('GET', url, true);\n\
    xmlhttp.send(null);\n```\n\nThe URL acts as a placeholder for where the actual\
    \ web service or API URL is placed. You can begin to see how the internal handling\
    \ of the Ajax call is formed. Finally, it is time to handle the returned data.\
    \ The XMLHttpRequest returns data using an event handler called onreadystatechange.\n\
    \n```\nxmlhttp.onreadystatechange = function() {\n  if (xmlhttp.readyState ==\
    \ 4 && xmlhttp.status == 200) {\n    // do something with the results\n  } else\
    \ {\n    // wait for the call to complete\n  }\n}\n```\n\nUsing built-in properties,\
    \ it is easy to check the status of the response. This example is very basic and\
    \ you will find this and other slight variations at the core of many Ajax applications.\
    \ In the next chapter you will learn how to construct and implement Ajax using\
    \ the Yahoo! Maps Ajax API."
  merge: -1
  pgno: 49
