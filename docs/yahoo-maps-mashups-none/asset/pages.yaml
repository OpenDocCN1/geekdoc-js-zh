  md: '# Ajax API Advanced Features


    # addZoomLong()


    One of the most engaging features of the Yahoo! Maps APIs is the ability it gives
    the user to zoom between layers of the map. The map while comes with an interesting
    trick, the ability to zoom the map with the scroll wheel, this tool adds a more
    obvious interface for the effect.


    This tool has a minus and plus button at the top and bottom of the map, respectively.
    Clicking allows you either zoom out or zoom in. The space between the minus and
    plus buttons is occupied by a slider mechanism. Clicking on this and dragging
    it up and down will zoom the map out and in.


    ```

    mapInstance.addPanControl();

    ```


    This line will add the long zoom control tool to the top-right corner of your
    map.


    # addZoomShort()


    The short zoom is a “lite” version of the long zoom tool. This zoom interface
    features the plus and minus buttons without the slider in between. This tool is
    best used when you are trying to save map estate or in conjunction with other
    tools.


    ```

    mapInstance.addZoomControl();

    ```


    This line will add the short zoom control tool to the top right of your map.


    # removePanControl() and removeZoomControl()


    These methods can be called, usually based on user interaction, to remove tools
    added to the map. Adding and removing tools can be confusing to the user. The
    combination of adding and zooming usually indicates a change in mode of the map,
    and can be effective when used in moderation.


    ```

    mapInstance.removePanControl();

    mapInstance.removeZoomControl();

    ```


    The first method will remove the panControl tool from the map. The second method
    will remove whichever zoom control has been added.


