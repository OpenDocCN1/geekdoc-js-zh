    to load the API.


    The difference starts when the latitude/longitude coordinates are defined. Using
    the YGeoPoint class, the latitude/longitude object will tell the map where to
    center on it initially loads its tiles. The Ajax API (as well as the other Yahoo
    Maps APIs) needs to have the latitude/longitude coordinates turned into an object
    to process them. The YGeoPoint serves this purpose, as it creates a JavaScript
    variable called lation. Most developers do not know latitude/longitude coordinates
    firsthand, so the option used in the first example will be a bit easier to leverage.


    Once the lation object is created, it can be passed as a parameter of the drawZoomAndCenter
    method, along with the desired initial zoom level. This will resolve the coordinates,
    center the map on that location and call for tiles for the specified zoom level.
    The last action in this sequence is to define the type of tiles. Regular tiles
    will show up by default. In the example, which uses setMapType against the map
    instance, you are specifying that satellite tiles will be showing initially.


