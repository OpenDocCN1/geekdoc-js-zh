  md: '# Chapter 5


    # endMapDraw


    This event is fired when the map completes redrawing as a result of drawZoomAndCenter.
    In addition, since the methods for zooming to change, the changeZoom event may
    also be fired if the method calls for a zoomLevel change.


    ```

    yEvent.Capture(map, EventsList.endMapDraw, onMapDraw);

    ```


    This code will listen to the map instance for the endMapDraw event. Here, the
    endMapDraw event is defined as a property of the EventList class. Finally, onMapDraw()
    is a function that will be called when the event is heard (captured).


    # panToLatLon()


    panToLatLon() is one of two manual panning methods. This method enables you to
    define a new YGeoPoint to change the map position. Calling this method will force
    the map to pan to the new location. The one parameter to pass is YGeoPoint, the
    latitude/longitude you want the map to pan to.


    ```

    mapInstance.panToLatLon(YGeoPoint);

    ```


    This example shows the code to pan the map to the specified latitude/longitude
    coordinate:


    ```

    var myPoint = new YGeoPoint(37.826701, -122.423103);

    map.panToLatLon(myPoint);

    ```


    # panTOY()


    panTOY() mimics the functionality of panToLatLon. Instead of passing a latitude/longitude
    YGeoPoint, this method accepts an x/y YCoordPoint as a parameter. Calling this
    method will force the map to pan to the new location.


    ```

    mapInstance.panTOY(YCoordPoint);

    ```


    This example shows the code to pan the map to the x/y coordinate:


    ```

    var myPoint = new YCoordPoint (100, 100);

    map.panTOY(myPoint);

    ```


    # startAutoPan and endAutoPan


    Accompanying the panToLatLon and panTOY() methods are two events called startAutoPan
    and endAutoPan. These are fired when the first is called and when the call''s
    actions complete, respectively.


    # disableDragMap() and enableDragMap()


    One of the features that Yahoo! Maps APIs have the ability of the user to click
    on the map and drag it around. This level of interactivity is one of the most
    popular features of Yahoo!''s developer offerings, and the Ajax API does not disappoint.
    With the Ajax API, this feature enabled by default. Should'
