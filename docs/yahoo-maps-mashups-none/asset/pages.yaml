    # SatelliteControlWidget


    The satelliteControlWidget class attaches three redesigned buttons to the map
    that allows users to toggle between the map view types. Once again, this is a
    great alternative to creating and coding your own buttons if time is important.
    These buttons are set to detect the map view type and will reflect by selecting
    the corresponding type''s button in the widget.


