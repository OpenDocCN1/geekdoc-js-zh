  md: '# About the Author


    Charles Freedman is a Senior Flash Developer for Yahoo! with a communications
    degree in film and television from Boston University. His development approach
    combines an education in multimedia with expertise and passion for building engaging
    and intuitive applications and content.


    In recent years, Charles has produced some of the most highly visible Flash platform
    work, leading development for Yahoo! Maps and deploying modules for the home pages
    of eBay, eBay China and Fidelity. Born in Boston, Charles relocated with his wife
    Jamie to sunny Santa Clara, California, to join Yahoo! in 2005. Still a season
    ticket holder, he plans many trips back East to see his beloved Red Sox win another
    World Series.'
