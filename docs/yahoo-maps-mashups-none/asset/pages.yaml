  md: '# Chapter 13


    # Flash in Greater Depth


    Most Flash applications fall into a special category of web applications called
    rich internet applications (RIAs). These applications create a more engaging and
    dynamic environment for web users, because of their flexible, intuitive design.
    Using Flash and Flash-based technology, RIAs are able to break out of the main
    constraints of HTML and JavaScript.


    Design plays a big part, as elements are created in Flash that cannot be replicated
    in the HTML world. These elements include both interface objects like buttons
    and form elements as well as background design that illuminate the backdrop of
    any white or gray interface. Another advantage of Flash is that the transitions
    are often applied to these design elements. A disciplined user (UI) designer will
    know how to just adjust the right amount of transitions, often referred to as
    animation, to elements. That kind of activity can call certain actions and areas
    of the interface to the attention of the user.


    # The Flash IDE


    The Flash IDE is the authoring tool to develop applications for Flash. While the
    term Flash can refer to the player or the platform technology, it is usually used
    to mean the authoring tool. Flash was originally made by Macromedia, an innovative
    company purchased by Adobe in 2005. Flash is available as stand-alone software
    for purchase online and in stores. It has also been bundled with other multimedia
    offerings such as Fireworks and Dreamweaver.


    Files generated with Flash are commonly output as SWF (ShockWave Flash) files.
    The main ingredients of Flash are vector and raster graphics. While JPEG images
    have been displayable in Flash for some time, the latest versions are also able
    to display GIFs and PNGs.


    As a multimedia tool, Flash has competition. One of its greatest strengths is
    the ability to enable and stream compressed video. This video technology is aptly
    named Flash Video with the extension .flv. The video, as well as audio, can be
    sent and received, creating some unparalleled communication possibilities.


    A version of the Flash IDE is required to develop and take full advantage of the
    Yahoo! AS-Flash Maps API.


    # Working with the Stage


    Flash is a visual medium and can easily be authored as one. While ActionScript
    2 has permanently changed the way Flash applications are developed, the fact is
    that a majority of Flash''s portfolios are dominated by visually authored tools.
    Flash IDE versions up to 7 (a.k.a. Flash MX 2004) centered on a timeline and stage.
    These were the primary tools used to author Flash content.


    The timeline represents the frame count of the movie. Certain frames can be marked
    as transition points in the movie. These are called keyframes. Adjusting the number
    of frames keyframes affects the speed of the transition. Frames can be named as
    well, allowing the movie clip to jump around the timeline based on user interaction.
    The frame rate is also adjustable, enabling you to define how many frames play
    a second. This affects the speed at which animations and transitions resolve when
    the movie is compiled.'
