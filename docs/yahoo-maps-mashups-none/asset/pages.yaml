  md: '# Chapter 21


    ![](img/1617eb1f737d2e225712aa0e0bbc3d21_331_0.png)


    # Summary


    This chapter reviewed many of the advanced functionalities of the AS-Flash API,
    first introduced in Chapter 16, “AS-Flash API Advanced Features.” You were re-acquainted
    with the more complex line of classes, methods and events that make this API so
    capable. Having completed the exercises in the last few chapters, in addition
    to the CustomPOIMarker and TrafficOverlay exercises in this chapter, you have
    a solid foundation for making Flex 2 map applications using the AS-Flash API.


    Coming up on the next chapter, you will use what you have learned as the foundation
    to create your most complete Yahoo! Maps mashup yet.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# The Flex 2 Mashup


    The goal of this chapter is for you to build a Flex 2 mashup using the ActionScript-Flash
    (AS-Flash) API. To achieve this, you will also accomplish the following:


    +   - Establish an idea for your mashup and plan out the key details and development
    approach

    - Learn how to create your own data to mash up in MXML

    - Convert and play flash video dynamically in your mashup

    - Establish communication between Flex and Flash to control and add markers dynamically
    to the map API instance


    # Time to Mash Up


    Now that you have learned all the methods and classes of the AS-Flash API, as
    they are used with Flex 2 and the local connection method, it''s time to build
    a mashup. With the other APIs featured in this book, this chapter will guide you
    through building a mashup with a data source and map API.


    The means you employ to use the AS-Flash API is something of a workaround due
    to the absence of a Flex 2-compatible maps component. Because of this, what you
    have learned through the previous chapters is very fundamental. Coding the Flex
    client, MapConnector class and Flash client pieces can be time-consuming and may
    cause you to sacrifice the creative spirit you used working with the AS-Flash
    API. Having mastered many of the techniques necessary to work with Flex 2 and
    Yahoo! Maps, you can now explore the space freely with this mashup project.


    # The Big Idea


    Throughout the book, you have built some great mashups, combining the power of
    Yahoo! Maps with other data services. The mashup for this chapter will not point
    to outside data like a web service, RSS feed or API. This time, the mashup will
    be between the Yahoo! Maps API and data you will provide.'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# Chapter 22


    The idea of using your data in a mashup came as no surprise. Much of the web today
    is built on user content. User-generated content drives numerous blogs and accounts
    for the amazing growth of websites in the last few years. You''ll find user content
    on sites that feature product reviews, comments and feedback.


    Maps provide a great platform for displaying your user content. Much of what you
    do, on the weekends for example, likely have some geographical relevance. Each
    event can be marked on a map, providing a unique way for you to document your
    weekend, generating a mashup with your own content. Perhaps you took a trip over
    the weekend, went camping or drove into the city for a shop or attend a ball game.
    Or maybe you hit the links for a round of golf.


    Golf, as it turns out, is a mighty activity. Recurring in a defined and consistent
    space, each play of the game takes place on a stretch of land and is marked by
    each shot. On August 13, 2006, I played 18 holes at Sun Valley Golf Club in Macon,
    California. It happened to be a special occasion, my brother Nathaniel''s 26th
    birthday, and so I took my video camera to grab some clips of our swinging away.
    While there were no birthday hole-in-ones, we managed to collect some decent and
    entertaining footage of various shots. I happened to note where some of the shots,
    both golf and video, were taken.


    The mashup you build will have defined structured data within the application.
    These data will organize a series of golf shots and contain the following information:


    +   - The player hitting the shot

    - The hole was taken on

    - The latitude and longitude of the hole on the course

    - The path to the .fly (Flash video) file of the captured shot


    Your user will be able to select a golf shot, watch the video play and see where
    the shot was taken on a zoomed-in map featuring satellite imagery of the golf
    course. This highly adaptable mashup can be transformed into many things, like
    a recap of your vacation or video tour of your favorite city. One thing is for
    sure, it will be as much fun to code as it is for your users to experience.


    # Planning and Approach


    As with any application, planning and approach are important. It helps to know
    the APIs and web services you are working with every few. Having completed the
    previous chapters on the AS-Flash API, you should have all you need to work with
    the map.


    Before coding, it is always good to lay out your objectives and then determine
    how to achieve those tasks. Begin with thinking out what your application should
    achieve. Through the rest of the chapter, you will see how these steps are used
    to build the mashup.


    +   1. Display the map initially.

    2. Position the map and set its view type accordingly.

    3. Author the data you will mash up with the map API.

    4. Give the user the ability to navigate through the data.'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# The Flex 2 Mashup


    +   5. Display the data as markers on the map based on user selection.

    6. Play the video clip based on user selection.


    This is a simple flow and pattern of user interaction should be easily replicated
    with other APIs and web services.


    # The Flex Client


    For this project, it is best to reverse the order of construction of your application.
    You will recall that in previous chapters the order of completion for the Flex
    2/AS-Flash API project was to build the Flash client SWF first. That was followed
    by the local connection MapConnector class, and then you built the Flex client
    to round it out.


    Since you are defining your own data in mashup, it is best to start developing
    the Flex client first as is where the data will reside. Another reason to start
    with the Flex client is to code the user controls first. Since layout and user
    interaction are such a factor in this chapter''s mashup, you will need to establish
    these pieces before setting up the supporting code for the actual map. As you''ve
    learned in the last few chapters by using the Flex 2/AS-Flash API approach, while
    the map is still contained in the Flex client, user-interaction controls are written
    in the MXML as part of the Flex client.


    # Architect the MXML


    As you have done with previous mashups in this book, it is now time to architect
    the mashup. Starting with the MXML, and repeating for each of the three pieces
    of the application, this step will help you think out your project before coding
    it. Here are the ingredients for developing the Flex client MXML for this mashup:


    +   1. Import all classes that the map will need.

    2. Structure the data that will be mashed up. Since you will be providing your
    own data, it can be hard-coded within the application code.

    3. Add the interaction and display elements.

    4. Code the event handler.

    5. Call the method in the local connection, passing along the necessary values.


    # The Data


    Defining your own data when building a mashup has some nice advantages. The obvious
    is that you do not have to gain knowledge or adapt to the data format from an
    external source. This means you can skip past some of the steps necessary in building
    previous mashups, like exploring the data source. Another is that the data will
    always be there, as they source load with the application. This simply means that
    you do not need to connect to an external data source, trusting that the connection
    and access information are there, to populate your mashup.'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# Chapter 22


    There are downsides too, the fact that you will be limited to only the data you
    define. Defining your own data also takes the fun out of getting familiar with
    other products and your APIs. Since you are still working with the AS-Flash API
    here, many of the mashup concepts used in Chapter 17, "The AS-Flash Mashup," still
    apply here. For this mashup, you will learn how to define data in MXML for Flex
    2.


    You can add data to Flex 2 in several ways. You can write XML in an external file,
    include it with your application and load it as if it were a web service. Flex
    2 supports an ActionScript XML object similar to that of ActionScript 2 for Flash.
    There is also a new, more efficient XML model called E4X that supports coding
    XML native format inline with the MXML.


    For this mashup, you can use the Model control. This control lets you declare
    a data model inline with the MXML. It is a common pattern for referencing other
    controls and components, as each node is parsed, this model will unlimited become
    the data provider, source of data, for a List component which you will add. Each
    node will represent a new list item, marker location and video.


    ```

    <xml:Model id="golfShots">

    <shots>

    <label label="Late on 3" lat="37.57562" lon="-121.88887">

    <url href="http://www.mashupext.com/yahomashups/flex/video/nate.flv"/>

    <label label="Jesse on 6" lat="37.57371" lon="-121.893579">

    <url href="http://www.mashupext.com/yahomashups/flex/video/jesse1.flv"/>

    <label label="Chuck on 7" lat="37.5763" lon="-121.892002">

    <url href="http://www.mashupext.com/yahomashups/flex/video/chuck1.flv"/>

    <label label="Late on 9" lat="37.57958" lon="-121.887668">

    <url href="http://www.mashupext.com/yahomashups/flex/video/nate2.flv"/>

    <label label="Jesse on 11" lat="37.573256" lon="-121.88932">

    <url href="http://www.mashupext.com/yahomashups/flex/video/jesse2.flv"/>

    <label label="Chuck on 18" lat="37.580042" lon="-121.888741">

    <url href="http://www.mashupext.com/yahomashups/flex/video/chuck3.flv"/>

    </shots>

    </xml:Model>

    ```


    The label property will be displayed in the List component you will add. The lat
    and lon properties will become the Laton object when the marker is added to the
    map. This will represent the golf shot hit from. The URL property represents the
    path to the video clip of the golf shot.


    # The Layout


    Now that you have the data to code, it is time to consider the layout elements
    of the mashup. First, you need to itemize each element you need to provide to
    the user so he can interact with your mashup. Taking advantage of the pre-built
    Flex controls provided by Flex  Builder, you will need to identify which components
    to use.


    +   A Label control to display the title of the mashup

    A List control to display the list of video clips

    A VideoLoader to play the video

    A set of button controls to allow playing, pausing and stopping of the video'
