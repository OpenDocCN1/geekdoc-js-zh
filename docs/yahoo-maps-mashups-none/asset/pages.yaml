    # # Working with Overlays


    An Overlay adds a new layer over the existing map layer. It moves with the map
    as it is panned. Overlays are most used as containers for sets of markers representing
    related data such as local search results and traffic.


    As you will see in this section, the overlays have an incredible ability of acting
    as their own mashups. Adding some of the overlay classes will actually request
    data, parse the response and add all markers by it. It is good to test each overlay,
    as it may save you some time as well as add even more functionality to what you
    will ultimately build.


    # ## Overlay Methods


    Just like widgets, tools and markers, overlays can be added and removed with a
    simple pair of methods. It is good practice, after importing the map layer, to
    create an instance variable for that new overlay.


    ```

    // LocalSearchOverlay

    import com.yahoo.maps.overlays.LocalSearchOverlay;


    // CreateLocalSearch instance

    var localSearch = new LocalSearchOverlay();

    ```


    298'
