    \ you should import or reference the MapViews class.\n\nHere is how the setMapViewType()\
    \ call should.\n\nFor the Flash client:\n\n```\nvar newMapViewType:String = com.yahoo.maps.MapViews.SATELLITE;\n\
    myMap.setMapViewType(newMapViewType);\n```\n\nFor the MapConnector class:\n\n\
    ```\npublic function setMapViewType(mapType:String):void\n{\n    send(\"_flashClient\"\
