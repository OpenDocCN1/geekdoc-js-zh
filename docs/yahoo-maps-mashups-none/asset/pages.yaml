  md: '# Chapter 16


    # NavigatorWidget


    The Navigator represents the most functional out-of-the-box feature that comes
    with the API. While customizable in appearance, the Navigator widget provides
    several functionalities with very little code.


    Many of the methods you learned in the last chapter let you programmatically center
    the map, pan it and change its zoom level. The navigator, with its minimap with
    zoombar, lets the user do all that in one space. It''s a very good alternative
    to creating custom buttons and UI elements to do these things separately.


    The first piece of the navigator is a small map inside a square. The map displayed
    here will always map view tiles and correspond to the location and zoom level
    of the main map. The perspective here is supposed to give the user a bird''s-eye
    view of the main map itself, so the zoom level is actually several higher. On
    top of this minimap is a small square that when dragged and released will control
    both the map and the minimap. This lets users control the position of the map,
    the map will respond by panning to reveal more map in that same direction.


    The other piece of the map is a zoombar. This is a combination of several elements
    that put together create a tool with which your users can zoom in and out of the
    map. The main elements are a plus button, a minus button and a slider. Each button,
    when clicked, zooms the map in or out. Using the richness of Flash, zooming in
    or out with this tool forces the map to transition between tile layers. The effect
    is a gradual expansion of the existing tiles and a fade into the new layer loaded
    beneath the current one. This feature gives users the feeling of moving closer
    to the event when they zoom in and the reverse when they zoom out. The slider
    adds a more organic feel to the zoombar and like the dragability of the square
    in the minimap, allows for more natural control.


    The NavigatorWidget has the ability to appear open (expanded) or closed (collapsed).
    Two methods, open() and close(), are included in the class. They can be called
    against the widget''s instance to change its state after it has been added.


