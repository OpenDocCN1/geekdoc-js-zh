  md: '# Basic Methods: Flex 2 Using the AS-Flash


    ![](img/1617eb1f737d2e225712aa0e0bbc3d21_302_0.png)


    Figure 20-1


    # How It Works


    Closely based on the functionality you coded in the last, this exercise should
    not be too much of a brain buster. Instead of the TabBar you now have a text field
    and you''ve added a button. As you coded events to handle the Tab and hSlider,
    you coded one to handle the button press. When the user presses the Refresh Map
    button, the values from the TextInput and hSlider are sent to the local connection
    with the call setCenterByAddressZoom().


    The local connection, now instantiated by the MapConnector_address, receives the
    call and data from the Flex client and passes them to the Flash client. The SWF
    you created hears the call and channels the data into the method (of the same
    name) against the map instance.


    You should use the approach in this example as you try out the rest of the methods
    and sample code in this chapter.


    # setCenterByLatLon()


    If you know the latitude/longitude you want to center the map on, you can use
    setCenterByLatLon(). A major benefit of this method is that it executes much faster
    than setCenterByAddress(). This is because this method does not need to geo-code
    an address and resolve a latitude/longitude, since it already knows it.


    275'
