  md: '# Variable Types


    Variable typing was introduced to Flash in ActionScript 2. Several recognized
    data types exist, reflecting the wide array of classes Flash comes packaged with.
    This table lists the most common variable types as well as those that apply most
    frequently to developing with the AS-Flash map API.


    | Data Types | Description |

    |---|---|

    | Array | Holds a series of data elements as a list. |

    | Boolean | Has a value of true or false, converted to 1 and 0 as needed. |

    | Date | Represents date and time values relative to UTC or local platform. |

    | MovieClip | Allows control of MovieClip symbols using the MovieClip class. |

    | Null | A data type with only one value, meaning "empty value.\ |

    | Number | A double-precision floating-point number. |

    | Object | A collection of properties, specified with a dot (). |

    | String | A sequence of characters not treated as variables. |

    | Undefined | Indicates that the variable has not been assigned a value. |

    | XML | Represents the XML document tree able to be parsed and sent.


    # Typing Variables


    Typing variables is declaring what data type a variable is. It is not required
    but is considered best practice and will also trigger code hinting on an ideal
    IDE like Flash 8. Code hinting is a feature that most IDEs have and prompts you
    with various property and method options when a variable is recognized after being
    typed. Another benefit to typing variables is the activation of error handling.


    Variables properly typed looked like this:


    ```

    var myObject:Object = new Object();

    var myNumber:Number = 1;

    var myString:String = "Enter your address";

    ```


    # Case Sensitivity


    ActionScript 2.0 is a case-sensitive language. This means if variable names differ
    in any way in terms of case, they are considered different variables.


    ```

    var address:String;

    var Address:String;

    ```


    It is good practice to choose your case carefully as you code out variables. Good
    ActionScript developers will choose a pattern that all variables in their applications
    will adhere to.'
