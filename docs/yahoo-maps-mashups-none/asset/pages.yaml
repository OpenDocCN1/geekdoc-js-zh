  md: '# Advanced Features: Flex 2 Using the AS-Flash


    # Overlay Classes in Review


    +   - WaypointMarker: A waypointMarker is a reference on the map, often used in
    navigation to plot points along a route. This class lets you plot as markers.
    It is a very simple class, with almost no customization other than defining an
    index. If you are familiar with the consumer offering of Yahoo! Maps, you will
    recognize the waypoint marker as the same indicator used to plot points along
    driving routes.

    - CustomImageMarker: This class lets you add an image or SWF anywhere on the map
    as a marker. It is a slightly more customized approach than the CustomPOIMarker
    discussed earlier in an image or SWF that you create the marker. Since the marker
    you add is completely of your own design, the only property of this class is the
    url of the image (JPEG) or SWF.

    - CustomSWFMarker: This is one of the key features of the AS-Flash API, as it
    lets you develop and design your own interactive marker in the form of a SWF.
    Once the marker is added to the map instance, this class lets you call a method,
    callCustomMethod, against the marker itself. This means you have control over
    the marker after you have added it.


    # CustomPOIMarker


    POI stands for point of interest. This class lets you add a marker with the custom
    properties of index, title, description, marker color and stroke color. The two
    color properties reflect the body of the marker and its border properly. These
    properties let you adapt the marker into your visualization without creating a
    completely new one. Although that feature is available with the AS-Flash API,
    as you will see later in the chapter, this class is an efficient method of achieving
    customization.


