  md: '# AS-Flash API Base


    # setCenterByLatLon()


    If you know the latitude/longitude you want to center the map on, you can use
    setCenterByLatLon(). A major benefit of this method is that it executes much faster
    than setCenterByAddress(). This is because this method does not need to geo-code
    an address and resolve a latitude/longitude, since it already knows it.


    setCenterByLatLon() also accepts the duration parameter. Since there is no conversion
    between address and lat/lon, the panning effect will engage much more quickly:


    ```

    mapInstance.setCenterByLatLon(lat:LatLon, duration:Number);

    ```


    You''ll notice that the latitude variable does not belong to any of the types
    defined in the last chapter. It is because the latitude variable is being passed
    as an instance of the map API''s LatLon object. You must pass a LatLon object
    as the first parameter of the setCenterByLatLon() method, and to do that, you
    must create the latitude/longitude to pass as one.


    To create a LatLon object, using the coordinates 40.713696, -74.00564 for New
    York City, you must import or reference the LatLon class. The following code demonstrates
    this using the setCenterByLatLon() method:


    ```

    var latLon:Object = new com.yahoo.maps.LatLon(40.713696,-74.00564);

    var duration:Number = 300;

    ```


    myMap.setCenterByLatLon(latLon, duration);


    # setCenterByLatLonAndZoom()


    Like setCenterByAddressAndZoom(), this method gives you access to a lot of functionality
    in one shot. The sequence, as before, is slightly different as no address must
    be converted to a latitude/longitude; if you have selected this, you already know
    the latitude and longitude. As a result, this method, like its simpler counterpart
    setCenterByLatLon(), works a bit more efficiently, generating faster results.


    The order of operation for this method is as follows:


    +   1. The method is called:

    mapInstance.setCenterByLatLon(lat:LatLon, zoomLevel:Number, duration:Number);

    2. The map pans based on the duration, in milliseconds, defined in the duration
    parameter.

    3. The map centers on the resolved latitude/longitude coordinate.

    4. The map zooms to the level zoomed in the zoomLevel parameter.


    Common usage of this method looks like this:


    ```

