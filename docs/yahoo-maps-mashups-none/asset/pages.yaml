    Two markers appear close to the center of the map near Salzburg. The top marker
    is a customPOIMarker displaying "Castle Anif." When clicked, this marker should
    reveal more information on that location. The other marker is a customImageMarker,
    displaying a static image of the castle.


    # ## How It Works


    The API''s class library is imported, exposing all the methods and classes to
    your HTML and JavaScript. Using CSS, the mapContainer style is defined and implemented
    with the `div` a few lines later.


    The map object is created, passing the mapContainer for placement, as well as
    the initial location and zoom level. A listener is added to the map using `addEventListener`.
    This method will listen for the map''s `initialize` event and then call the `on`
    function when it is heard.


    Within the `initialize` function, two markers are added to the map using the `addMarkerByAddress`
    method. In order for the marker to be added, an instance of that marker must be
    created consisting of the necessary parameters. The `CustomPOIMarker`, parameters
    including marker title, marker hover text, marker description, outline color and
    background color must be defined. The marker description will appear when the
    marker is clicked. The second marker type added is an instance of the `CustomImageMarker`
    class. This instance requires just one parameter, the URL of the image to load.'
