  md: '# # Basic Methods: Flex 2 Using the AS-Flash API


    # # It Works


    The button fires an event that prompts the Flex client to call the getCenter method
    on Map Connector_getcenter, representing the local connection. The method is passed
    through the local connection, where it is picked up by the client. In the SWF,
    getCenter is now called again the map API instance.


    The returned data from getCenter are saved and wrapped as data that are passed
    in an event to the local connection. MapConnector_getCenter fields the data and
    passes them in a final call to the Flex client.


    # # Additional Get Methods of the AS-Flash API


    In addition to getCenter(), you can use the following methods to retrieve accurate
    data from the map instance. You can easily replicate the example you have just
    completed for each of these methods:


    +   - getZoomLevel(0): The ZoomLevel() method lets you obtain the current zoom
    level of the map. It can be used to adjust a custom zoom or zooming interface
    that you have created. As you will see in the next chapter, knowing the current
    zoom level plays a key role in overlays and other custom features of the API.


    +   - getMapViewType(0): You want to getMapViewType(type) to determine which tiles
    are currently displaying. This is useful if you have created your own buttons
    that let your users toggle over map view types. You may also include some effects
    in your application that activate depending on what layer is currently displaying.
    Choosing their map view can add a hint of customization to the application. Not
    to mention that being able to display satellite images of the world, from space
    all the way down to street level, is quite an enticing feature that will draw
    users to your mashup.


    # # Summary


    This chapter introduced you to several of the basic methods available in the AS-Flash
    API when it is used with Flex 2. The two major examples represent big steps that
    you have taken in creating your mashups.


    In the next chapter you will be reintroduced to the more advanced methods and
    classes of the AS-Flash API. This time, you will learn how to adapt these methods
    to work with the Flex client, MapConnector local connection class and Flash client.'
  merge: -1
