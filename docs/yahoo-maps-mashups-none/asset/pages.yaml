  md: '# Advanced Features: Flex 2 Using the AS-Flash API


    Back in Chapter 16, “AS-Flash API Advanced Features,” you learned in great detail
    about the advanced capabilities of the ActionScript-Flash (AS-Flash) API. This
    chapter will re-familiarize you with those capabilities and present some examples
    of implementing advanced AS-Flash API with Flex 2.


    While much of this chapter will be a review, you should keep the templates you
    developed in the last few chapters ready. Each of the classes, events and methods
    can be applied to the Flex 2 AS-Flash API architecture you have already been implementing.
    In this chapter you will


    +   - Review advanced methods, classes and events of the AS-Flash API


    +   - Compile AS-Flash API examples for inclusion in Flex 2


    +   - Build local connection classes to allow communication in certain advanced
    methods


    +   - Code Flex 2 example applications that incorporate advanced AS-Flash API
    methods within their functionality and integrate maps


    # Advanced AS-Flash API Classes


    Developing with the AS-Flash API for Flex 2 requires you to know as much about
    the API as possible. Now that you’re thinking Flex 2, it is necessary to review
    the advanced API classes and capabilities. Having learned the basic methods of
    this API and applied some of them to the Flex 2 environment, you should get familiar
    with the advanced methods and objects that can make your map application more
    complete.'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# Chapter 21


    # Reviewing Objects and Methods


    Having learned the basic functionalities of the AS-Flash API, it''s time to dig
    deeper. The following methods and objects, while not used as frequently, are very
    powerful in enabling map application development:


    +   - LatLonRect defines the boundaries (commonly referred to as the bounds or
    envelope) of the map being displayed. This object contains four properties that
    when combined can let your application determine what to display and what is displayed.


    +   - getBounds() returns a LatLonRect representing the existing boundaries of
    the map being displayed. This method is useful for overlaying map data on top
    of the map API files. In other words, this information lets you sync other data.
    Certain data, like parks and schools zones, are available from various services.
    The setBounds method passes a LatLonRect to change the current boundaries of the
    map and effectively modify the map being displayed.


    +   - setBounds() passes a LatLonRect to change the current boundaries of the
    map and effectively modify the map being displayed.


    # Reviewing Events


    As you learned, events can be instrumental in controlling the timing of your application.
    While reviewing these events, keep in mind that the data fired with the event
    can be as important as the event itself. It is always good to explore the data
    object returned with an event when you first use it. In creating your Flex 2 to
    AS-Flash application, you can explore the event data easily when you construct
    your base SWF.


    +   - EVENT_MOVE is broadcast whenever the map moves, whether by panning, zooming
    or recentering. The detection can be user-initiated or based on code that is executed.
    This event comes with a lot of useful data each time it is fired. Using the for/
    method, you can drill down into the event''s object and trace the object''s properties
    and values.


    +   - EVENT_PAN_START and EVENT_PAN_STOP are broadcast when the map starts and
    stops panning respectively; they are tied to the setCenter methods discussed in
    the chapter. The pan events do not include data with more than the standard target
    and type properties. However, they can be very useful in the activity of design
    and interface elements in your application. The benefit of pan is that you know
    where the location is centering to, a latitude/longitude or address, has already
    been resolved.


    The setCenterAddress method inside the OnInitMap function is responsible for making
    the map pan. Since the listeners have been added for panning and stopping, their
    respective onPanStart and onPanStop functions will tell you when those events
    fired. You can replace them with other useful calls to perform actions throughout
    your application.


    +   - EVENT_ZOOM occurs when the map zooms by methods like setCenterByLatLon,
    setCenterAddressZoom and setCenterByLatLonAndZoom. This event carries with a lot
    of useful data that can be used to reset values throughout your application. Depending
    on the complexity of your map mash, you may want to keep track of the map''s zoom
    level and other properties by updating variables. In addition, whenever the map
    changes location and zoom, it''s important to track those properties to enable
    precise movements of the other elements in your application.'
