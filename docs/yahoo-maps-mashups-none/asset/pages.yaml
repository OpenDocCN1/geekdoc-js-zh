  md: '# The AS-Flash API


    you will experience how rich and capable it is. While maps are first and most
    informative tools, the AS-Flash API is the foundation of more eye-catching and
    entertaining map applications.


    The AS-Flash API lets you immerse map content within a completely rich environment.
    The API is designed to enable you to produce truly rich applications. As you have
    learned in this chapter, Flash has always been useful as a visual authoring tool.
    With this API, it is not all programming. You can create many effective, dazzling
    and unintuitive elements. Working with the API component on the stage, you and/or
    your designer can apply creativity in various ways.


    # Mashups Outside the Browser


    The AS-Flash API can run outside the browser. That''s right, you can make your
    mashup run from the desktop as long as you have an Internet connection. Using
    settings available in Flash IDE, you can have Flash export your mashup as an EXE
    (Windows executable file). The best part is that you can do this without making
    a modification to the browser-based mashup you originally developed.


    # Mobile Mashup Possibilities


    Displaying maps on a mobile device is an obviously usefulness for which there
    is increasing demand. However, there is no formal API support for mobile development.
    The AS-Flash API provides the next best thing. Adobe''s foray into mobile Flash
    development support is through Flash Lite, a smaller version of the desktop computer,
    capable of reaching millions of users.


    The AS-Flash API needs at least Flash Player 7, Flash Lite just won''t cut it.
    In early 2006, Adobe released Flash 7 Player for Pocket PC and Windows Mobile
    devices. Using a browser with memory, a mashup developed with the AS-Flash API
    can be displayed and work rather nicely on a mobile device. This opens up many
    possibilities for map-based applications in the exciting mobile development arena.


    # Summary


    This chapter introduced the AS-Flash API with the following key concepts:


    +   - The Flash IDE is both a visual and code authoring tool.

    - Certain aspects of ActionScript 2 are put in play with the AS-Flash API.

    - The AS-Flash API lets you create visually captivating mashups with little programming
    knowledge. However, the more code you know, the more advanced a mashup you will
    create.'
