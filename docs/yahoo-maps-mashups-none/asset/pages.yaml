  md: "# Chapter 13\n\n# Classes\nActionScript2 supports development with classes.\
    \ As in all object-oriented programming languages, classes are implemented to\
    \ define objects in an application and how they are built. Classes usually start\
    \ by declaring their properties. Using `private` when declaring a property variable\
    \ will make it available only within the class, while using public exposes the\
    \ property to the entire application.\n\nThe first method in a class is actually\
    \ its constructor; this method is often called by other classes in the application\
    \ to instantiate this class. Additional methods defined in the class can be declared\
    \ with `private` and `public` to define the visibility to the rest of the application.\
    \ These methods perform functionalities that carry out the purpose of the class\
    \ manipulating the properties of the object it is defining.\n\nThe AS-Flash API\
    \ uses several classes to define various objects used in the map API. As the examples\
    \ show, to make these classes and their functionalities available to your mashup,\
    \ you will use import. In any application, this is how one class is able to call\
    \ `public` methods in another class.\n\nA simple map looks like this:\n\n```\n\
    class map\n{\n//declare public variables\npublic zoomLevel:Number\n\n//declare\
    \ private variables\nprivate address:String\n\n//constructor\nfunction map() {}\n\
    \n//public methods\nublic function setZoomLevel(zoomLevel:Number):Void\n{\n  zoomLevel\
    \ = 1;\n}\n\n//private methods\nprivate function getAddress():String\n{\n  return\
    \ address;\n}\n}\n```\n\n# Methods\nA method's purpose is to define an object's\
    \ behavior. This includes the actions an object can take as well as what actions\
    \ are allowed against the object. The preceding examples reflect two objects.\
    \ The first method defines `zoomLevel` and the action taken against the object\
    \ setting it. The other example method defines `address`; in this case the action\
    \ performed is the ability to return the address value."
