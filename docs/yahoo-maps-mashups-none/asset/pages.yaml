    # Basic API Methods


    Having completed the JavaScript-Flash (JS-Flash) API and the AS-Flash API, you
    will likely be familiar with many of the basic API calls. As you go through this
    chapter, keep in mind that using Flex 2 and the AS-Flash API requires its own
    unique code and approach. What you learned in previous chapters will help, but
    you should pay special attention to the naming conventions and parameters passed
    to each method.


    The sample code and examples in this chapter will feature one method from each
    of similar methods available in the AS-Flash API. You will see that these code
