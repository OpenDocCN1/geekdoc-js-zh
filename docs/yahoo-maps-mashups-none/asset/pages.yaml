    several parameters that let you manage the results in several ways.


    ```

    localOverlayInstance.search(searchTerms, latlon:Laton,

    startIndex:Number, results:Number, radius:Number, categoryFilter:String,

    ratingFilter:String);

    ```


    You will notice that with these widgets, this method is called against the overlay
    instance. The search requires just the first two parameters to work. To let your
    users make the most of this method, you will likely want to collect the searchTerms
    from a value entered into a text input field or component. The other parameter
    can be obtained at any time using the getCenter method on the map instance. The
    additional parameters provide various ways to manage the results. startIndex and
    results let you create pagination from one set of results to the next. categoryFilter
    and ratingFilter offers ways to narrow search.


    There are two main events tied to the search method LocalSearchOverlay. EVENT_SUCCESS
    and EVENT_SEARCH_ERROR are based on the success or failure of a search. The success
    counter offers some structural data within the object passed that helps facilitate
    a narrower search, as described earlier.


    ```

    localOverlayInstance.addEventListener(com.yahoo.maps.overlays.LocalSearchOverlay

    .EVENT_SEARCH_SUCCESS, onSearchSuccess);

    ```


    ```

    localOverlayInstance.addEventListener(com.yahoo.maps.overlays.LocalSearchOverlay

    y.EVENT_SEARCH_ERROR, onSearchError);

    ```


    Once again, you will find the event listeners are added to the overlay instance
    rather than to the map instance. You will also notice that the event reference
    path extends the overlay path of the map class path. Both events call functions
    to carry out their dispatches. With that the data objects It is always a good
    idea to use the for/in method to explore the data object returned from an event.


