- img_proc: true
  md: 'SatelliteControlWidget: The satelliteControlWidget class attaches three predefined
    buttons to the map that allow users to toggle the map view types. Once again,
    this is a great alternative to creating and coding your own buttons if time is
    important. These buttons are set to detect the existing map view type and reflect
    that by selecting the corresponding type''s button in the widget.


    # Working with Tools


    Tools are features of the map that leverage mouse interaction. Two tool classes
    are included with the AS-Flash API. The pan tool includes the drag-panning feature
    that has become standard in the current generation of richer map applications.
    This functionality is not available by default and needs to be added. The other
    tool class is CustomSWTool, which enables you to create your own tool with which
    your users can better engage with the map.


    # Tool Methods


    The tools are available with the map class that is loaded by default when the
    map instance is created. They are responsible for adding, removing and activating
    the tools you make available to your users. A special widget, discussed later
    in this chapter, adds a menu of tools to your map application. This is called
    the ToolBar and its contents depends on the results of these methods.


    # addTool()


    A simple method that lets you add instances of tools to the map. This method must
    be called after the map instance initializes, and is usually placed within onInitMap.


    ```

    mapInstance.addTool(tool:Object, isActive:Boolean);

    ```


    In order to add a tool, you must first import the tool''s class and create an
    instance of it. That instance is the first parameter of this method. The second
    parameter is isActive. When it is set to true, the tool will be added and become
    active to your users right away.


    # setActiveTool()


    Should you add a tool with isActive to false, you will need to run this method
    later in your code. This method accepts just one parameter, and that is the instance
    of the tool you want to activate.


    ```

    mapInstance.setActiveTool(tool:Object);

    ```


    # removeTool()


    removeTool() is used to remove and thus reactivate the tool from the map instance.
    Its only parameter is the instance of the tool it is called to remove.


    ```

    mapInstance.removeTool(tool);

    ```'
