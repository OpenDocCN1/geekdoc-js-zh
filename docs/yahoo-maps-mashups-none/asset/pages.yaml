  md: "# Chapter 20\n\nEvents are broadcast when the zooming is engaged in the API.\
    \ EVENT_ZOOM_START is fired when the API starts zooming and EVENT_ZOOM_STOP is\
    \ sent when the API has completed zooming.\n\nYou can set the zoomLevel with user\
    \ interaction. You can design buttons to increase or decrease the zoom level of\
    \ the map. You can combine these buttons with a slider, ranging in value from\
    \ 1 to 16, to create a zoombar. In Chapter 16, \"AS-Flash API Advanced Features,\"\
    \ you learned how to use the NavigatorWidget, an interface that combines a zoombar\
    \ with other useful tools to help users navigate your map.\n\nRefer to the base\
    \ application developed in the last chapter to see a fully integrated example\
    \ of setZoomLevel.\n\n# setCenterPointDelta(point, duration)\n\nsetCenterPointDelta()\
    \ is a unique method of recentering the map that lets you use other relative points\
    \ on the stage. A point is a pixel coordinate defined by an x/y point. The first\
    \ parameter of method is not a point on the map, but a latitude/longitude coordinate,\
    \ or rather the total difference of points within the map tile matrix.\n\nKeep\
    \ in mind that you are not moving to a specific point. You are moving the difference\
    \ in x/y from its current position. In other words, if you were using this method\
    \ to pan the map to the right 20 pixels and 30 pixels, you would pass a point\
    \ value of (-20, -30). Essentially, the map's center moves up and to the left,\
    \ revealing more area to the bottom and to the right.\n\nUsing this method, you\
    \ can have the map pan over center to other elements added to the map application.\
    \ These can be design elements added programmatically or via the visual authoring\
    \ methods learned in the chapter. This method can be used with markers (Examples\
    \ later in the chapter will explore these possibilities.)\n\nThe point parameter\
    \ of this method works similarly to how the latlon parameter related to the Latlon\
    \ object worksByLatLon() and setCenterAddressZoom(). The point is not a number\
    \ or Latlon object, but a point object. To properly pass this value, you must\
    \ call the Point class. Unlike the Latlon class, which is packaged with the API,\
    \ the Point class is available as part of the Flash MX package. Here is how to\
    \ properly call the setCenterPointDelta() method by creating an instance of a\
    \ Point first.\n\nFor the Flex class:\n\n```\nvar point:Object = new mx.graphics.Point(100,\
    \ 100);\nvar duration:Number = 3000;\n```\n\n```\nmapConnector.setCenterPointDelta(point,\
    \ duration);\n```\n\nFor the MapConnector class:\n\n```\npublic function setCenterPointDelta(point,\
    \ duration:Number):void\n{\n  send(\"_flashClient\", \"setCenterPointDelta \"\
    , { point :point ,\n  duration:duration });\n}\n```"
