  md: '# Chapter 13


    Both layering and masking can be done with very simple ActionScript. More advanced
    Flash developers prefer not to use the timeline panel too much. Instead, they
    find it easier to handle all symbol management in the ActionScript itself. You
    will find, especially with things like managing depth, that code will ultimately
    provide a much cleaner means of handling symbols using layers. Refer to Figure
    13-2.


    ![](img/1617eb1f737d2e225712aa0e0bbc3d21_171_0.png)


    Figure 13-2


    # Defining an Instance


    When you add a symbol, movie clip, button or graphic to the stage, you are creating
    an instance of it. You can name instance in the properties panel beneath the stage.
    The instance name is used in the ActionScript code to refer to symbol. This will
    enable you to modify properties of that symbol, or if there is code related to
    it, to call methods against it.


    In later chapters discussing the AS-Flash API, you will learn how to define the
    instance name of the API component. It is often labeled myMap (as it is in Figure
    13-3), and all code in your project will use this instance name to change settings
    of the map, including the view type (changing the map to satellite), zoom level
    and what address or latitude/longitude the map will center on.


    ![](img/1617eb1f737d2e225712aa0e0bbc3d21_171_1.png)


    Figure 13-3


