  md: '# Advanced Features: Flex 2 Using the AS-Flash API


    # Tool Classes


    Tools offer a mixed bag of functionality. On the one hand you have the pan tool,
    representing probably the most commonly used feature of any map application you
    will build. On the other hand is CustomSWFTool, which represents what is likely
    the least used yet most creative way to engage your users with your map application.


    # Overlay Classes in Review


    +   - PanTool adds all-important feature of letting itself drag the map and pan.
    Because it is associated with that tool activates within the map instance itself,
    some events are associated with that work with the map events discussed earlier
    in the chapter. The EVENT_DRAG_STOP and EVENT_DRAG_START methods track the map
    dragging and are not to be confused with EVENT_PAN_START and EVENT_PAN_STOP. To
    effectively listen to these events, you must listen to the tool directly.


    +   - CustomSWFTool provides you with a way to extend the interactivity of the
    map into more engaging tools. Use the pan tool, this class relies on mouse interaction
    to engage the user. As with other custom SWF classes discussed in this chapter
    (CustomSWFMarker and CustomSWFOverlay), to take advantage of this feature, you
    will need to build your own SWF and add it to the map using methods local to this
    class.


    # Working with Markers


    You can''t really create a mashup without adding markers. Markers are the indicators
    of locations on your map. They are added by address or latitude/longitude. In
    addition to methods, there are ways to remove markers programmatically based on
    user interaction. Marker classes enable you to define the type of marker you add,
    be the standard markers or markers you can design and develop from scratch.


    You can add markers one by one as by loading certain overlays. If you have a database,
    XML, web-service response or other data source with many addresses or latlon coordinates,
    you will likely use a looping method for/each to add markers.


    # Marker Methods


    This small set of methods represents the most commonly used functions in mashups:
    adding markers. Each method lets you ultimately control the location and appearance
    of every marker you add to the map.


    # addMarkerByAddress()


    This method lets you add markers to a location using an address.


    ```

    markerInstance.addMarkerByAddress(markerClass:Class, address:String, data:Object);

    ```


    The markerClass parameter defines what type of marker you are adding. To successfully
    add a marker, you must import the class of the type of marker you reference in
    this parameter. The types of markers, reviewed in the following sections, have
    unique functionality and presentation attributes.'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# Chapter 21


    An address variable must be passed in order for the marker to be added with this
    method. The address will need to be geo-coded, so this method does not process
    as quickly as its latlon counterpart. If you intend the marker to appear in the
    center of the map, you may want to setCenterById() with the same address.


    Finally, the properties of the markerClass you choose must be defined in the last
    parameter. As you learn in the following sections, each marker class carries with
    different properties that are defined when this data object is cast.


    # addMarkerByLatLon()


    This method adds you to a location using a latitude/longitude coordinate.


    ```

    mapInstance.addMarkerByLatLon(markerClass:Class, latlon:LatLon, data:Object);

    ```


    As with the addByAddress(), the markerClass is the type of marker you are adding.
    The types can vary within the same mash but require their respective classes to
    be imported.


    The second parameter defines the location where the marker will be added. The
    LatLon class must be imported or referenced in order to properly cast the latitude/longitude
    coordinates into a LatLon object.


    Once again, the properties of the markerClass you choose must be defined in the
    last parameter. These properties will be discussed with each marker class below.


    # removeMarker(marker)


    To remove a specific marker, you can call removeMarker() against the marker instance
    you have added.


    ```

    mapInstance.removeMarker(marker:Object);

    ```


    # removeAllMarkers()


    removeAllMarkers() will clear out all markers that have been loaded to the map
    instance. Since this method does not affect one single marker, but rather all
    markers, it does not need a parameter.


    ```

    mapInstance.removeAllMarkers();

    ```


    # Marker Classes


    Marker classes are packages of elements and other classes that enable you to add
    a variety of marker types to your map. Each of each marker class is a different
    marker type. A variety of markers are available in the AS-Flash API, ranging from
    the simple black waypoint marker to the customizable custom POI marker. You can
    apply your creativity and Flash design skills to developing your own custom SWF
    marker. The various marker classes have their own properties, each set when the
    marker object is created. When adding the marker to the map, you define what type
    of marker you are adding by passing the class and the properties you have in the
    marker object.'
