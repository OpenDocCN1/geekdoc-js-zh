  md: '# Chapter 6


    # How It Works


    After setting up the map to display with the usual style definition and div tag,
    the initial map properties are set. The map''s type is defined when the map object
    is created and set to display satellite tiles. Using drawZoomAndCenter, the map
    is centered on an address and the zoom level is set.


    An instance of the YImage is created to ultimately display an image within a marker.
    Once this instance is created, a series of methods are called against the imageMarker
    instance to set the source, size and offset positioning of the image.


    Simple steps are repeated to create the marker instance. The YMarker constructor
    is passed the location as well as the imageMarker instance. In setting the properties
    of the marker instance, it is necessary to code the event listener to register
    when the user clicks the marker. This will call a function that launches the popup
    state of the marker. This marker is populated with HTML that features a description
    of the photo in the imageMarker and a link.


    Finally, the marker instance is added using the addOverlay() method of the YMap
    instance. This loads the marker on the map, featuring the image you defined.


    # Working with Tools


    Tools are prepackaged sets of user interfaces that ship with the Ajax API. They
    reflect some of the most commonly used technology on consumer map applications
    like Yahoo! Maps. Adding existing tools can save you time over having to replicate
    the functionality with your user interface.


    # Control Methods


    The simple methods available for tools are part of the map class. These methods
    become available when the map instance is initialized.


    # addType()


    The control is a widget that lets you toggle the map type among regular, satellite
    and hybrid tiles. This method saves time but does not offer the flexibility of
    creating your own buttons, as you learned in the last chapter with the map type
    methods.


    ```

    mapInstance.addTypeControl();

    ```


    This line will add the type control to the top-left corner of your map.


    # addPanControl()


    This tool adds to the map featuring four directional arrow buttons. Clicking each
    button will pan the map in the corresponding direction. The map comes with a default
    panning functionality. This tool adds some precision and more direct navigation
    to the map.


    ```

    mapInstance.addPanControl();

    ```


    This line will add the pan control tool to the top-right corner of your map.'
