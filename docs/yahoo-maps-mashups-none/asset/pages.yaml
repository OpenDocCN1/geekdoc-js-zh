  md: "# The Ajax API\n\nAs Ajax has become more accepted and better understood, it\
    \ has gained some serious traction in web development. Due to the strictly object-oriented\
    \ approach of Ajax, those developers teams tasked with deploying Ajax applications\
    \ be considered more than just web developers. Front-end engineering is now known\
    \ as the role of implementing dynamic web pages, most likely driven by Ajax.\n\
    \n# Fundamentals of JavaScript\n\nWhile the API itself uses Ajax, much of the\
    \ map application you will build will consist of JavaScript interacting with the\
    \ map classes. It is very important to gain a solid understanding of the fundamentals\
    \ and capabilities of JavaScript.\n\nJavaScript is a web-scripting language that\
    \ has some ties to the programming language Java. It runs in the browser and is\
    \ executed as an interpreted language. This means it does not need to be compiled\
    \ into another file or build to run. JavaScript became a very significant language\
    \ early on, adding new levels of interaction and control over the web. Designers\
    \ it initially for effects like animation, browser detection, plug-in, status\
    \ messages in the browser and HTML validation.\n\nAs with any language that's\
    \ been around for 10 years, JavaScript has been reverted times. While its fundamentals\
    \ have pretty stayed the same, through the years many new uses of the language\
    \ have been realized. Its dependency on the browser has helped in its evolution.\
    \ With new browsers invariably came new abilities. Developers explored new ways\
    \ to make their HTML and JavaScript applications more engaging.\n\nOne of the\
    \ keys to JavaScript's success and its continued prevalence is the simple syntax\
    \ it uses. Here is a sample of a popular JavaScript code used with HTML to launch\
    \ a new browser window:\n\n```\n<html>\n<head>\n  <title>JavaScript > New Window</title>\n\
    \  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=iso-8859-1\"\
    >\n  <script language=\"javascript\">\n    function newWindow() {\n      window\
    \ = window.open(\"http://www.mashupexperts.com\", \"newwin\", \"width=800,height=600\"\
    );\n    }\n  </script>\n</head>\n<body>\n  <a href=\"javascript:newWindow()\"\
    >Launch Window</a>\n</body>\n</html>\n```\n\nYou will notice that the meat of\
    \ the set is in the Head tags of the HTML. This is where JavaScript is defined\
    \ and where theWindow Function is set. This function becomes available to the\
    \ rest of the code within the HTML and can execute the same code over and again\
    \ as called upon. The newWindow function will create a new browser window by calling\
    \ open against the current browser object, the one you are in. The function is\
    \ actually called when the \"Launch Window\" link is clicked. This link is tagged\
    \ with javascript:newWindow, which tells the browser to call the function of name\
    \ within the JavaScript set of code."
