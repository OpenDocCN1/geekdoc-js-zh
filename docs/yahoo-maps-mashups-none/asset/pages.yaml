  md: '# Chapter 5


    # The YEvent Class


    Events are an important part of Ajax development. Working with maps, they represent
    different actions that the API code takes to position and modify the map tiles.
    Events enable you to develop with these actions, perfecting the timing of certain
    user interactions and interface elements within your web page.


    Capturing is the process of telling your code to actively listen for. You can
    do this using the aptly named Capture method found in the YEvent class. This useful
    method consists of one line of code:


    ```

    YEvent.Capture(objectInstance, event, callback)

    ```


    The first parameter of the Capture method is the object instance you are listening
    to. (The methods discussed in this chapter focuses on the instance of the map
    you created. In the next chapter, you will explore listening to other instances
    created, like markers). The event parameter defines the actual event you are listening
    for. Lastly, callback is the function you will call in your code to carry out
    the event.


    The YEvent class will be used heavily in this chapter to help you understand how
    many methods affect the map. As you complete this chapter, you will learn each
    event that is tied to a method of the API. As you will see, many methods are tied
    to associated user interactions.


    # Map Zoom Methods and Events


    The API offers a set of methods and events to programmatically control zooming.
    These methods can be tied to user interaction, such as clicking on a button outside
    the map to change the zoom level of the map tiles displayed.


    # setZoomLevel()


    setZoomLevel() sets the zoom level of the map. It accepts one parameter, a number
    that is the value of the zoomLevel you want to change the map to. The ZoomLevel
    can be set between 1 and 16.


    ```

    mapInstance.setZoomLevel(zlevel);

    ```


    In this sample, the zoomLevel is set to 6:


    ```

    myMap.setZoomLevel(6);

    ```


    The next chapter will introduce you to two built-in zooming user interfaces, ZoomLong
    and ZoomShort. These tools feature preesigned buttons and code that will add instant
    zooming control to your map with minimal coding.


    # changeZoom


    The changeZoom event is dispatched when the map''s zoom level changes and includes
    the following actions:


    +   - setZoomLevel() has been called from within the code and changes the zoom
    level of the map.


    +   - drawZoomAndCenter() has been called from within the code. (You will work
    with this method bit later in this chapter.)'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# Ajax API Basics


    +   - The user is zooming in and out of the map using the scroll wheel on his
    or her mouse.


    +   - The user has clicked on either the ZoomLong or ZoomShort built-in-zooming
    tool. (You will work with this in the next chapter.)


    Using YEvent, here is how to capture the changeZoom event:


    ```

    YEvent.Capture(map, EventsList.changeZoom, onChangeZoom);

    ```


    This code will listen to the map instance for the changeZoom event. Here, the
    changeZoom event is defined as a property of the EventList class. Finally, onChangeZoom
    is a function that will be called when the event is heard (captured).


    # getZoomLevel()


    get methods work very efficiently in the API. Since the value is already set,
    most likely by calling their set method counterparts, the API needs to return
    the value to you. For development, get methods are very easy to implement, as
    they require no parameters to operate.


    As you code your application, you will find that get methods make development
    much easier. Rather than sure your code "remembers" what values have been set
    through your application''s operation, you can call a get method anytime and have
    the latest value. The get methods also help with user interface implementation.
    You need a starting point, a default value at which to position your user elements.
    The get methods provide this data.


    The getZoomLevel() method enables you to obtain the current zoom level of the
    map. You can use it to adjust a custom toolbar or zooming interface that you have
    created. You will see this in the next chapter, knowing the current zoom level
    plays a key role when you are overlays and other custom features of the API.


    ```

    mapInstance.getZoomLevel();

    ```


    The following is an example showing how the method works if the map is set to
    a ZoomLevel of 5:


    ```

    var currentZoomLevel = myMap.getZoomLevel();

    alert(currentZoomLevel);

    // Outputs: 5

    ```


    Now that you have the set and get methods, as well as the event associated with
    the zoom level, it is time to put it all together.


