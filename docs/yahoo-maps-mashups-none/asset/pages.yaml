  md: '# JS-Flash API Basics


    The map should be loaded displaying regular map tiles of Italy at a zoom level
    of 12 (about level). Beneath the map are some form elements. Changing the value
    in the first text field and clicking Zoom should change the zoom level. The text
    area below that, labeled "Event Output," will display the new zoom level as it
    changes.


    # How It Works


    After importing the JS-Flash API library, the classes become available to your
    JavaScript and HTML. The mapContainer style defines the size and placement of
    the map. The div tags display the map as it is rendered and inherit the style
    sheet properties of the mapContainer class.


    The apiForm is written in HTML and will do two things. First, the form contains
    an input field and a button. These elements together will allow the user to enter
    a new zoom level and submit it. It will ultimately change the zoom level of the
    map. The other purpose of the form is to create a space for displaying event data
    related to the example, as it occurs. This is a text area that will display the
    map''s new zoom level when the zoom has fired.


    The zoom level changes when the Submit button is clicked within the onClick()
    event handler calls the zoomLevel function. Within this function, the setZoomLevel
    method is called against the map instance. JavaScript references the user-entered
    zoom level and that is passed as the zoomLevel parameter.


    You use the addEventListener method to listen for the zoomEnd event. That event
    is fired from the map when the zoom change is complete. The event listener calls
    the zoomEnd function defined to carry out the event. This function will populate
    the text-area element eventDisplay, which is inside the apiForm, with the new
    zoom level. This value is attained by calling the getZoomLevel() method against
    the map.


    This example is designed to be easily replicated for each set of methods and events
    to follow in this chapter. By simply customizing the form to let the user enter
    relevant data, you will be able to call other methods against the map API instance.
    The event-display part of the example is very flexible. All you need to modify
    the event being listened for, as well as the data being displayed, and you are
    all set to test other methods and events together.


    # Map Type Methods and Events


    The JS-Flash API considers the map view to be the type of tiling loaded. You may
    recall an example in the last chapter that set the map view type so the map would
    display satellite tiles. The JS-Flash API supports three types of tiles: regular,
    satellite and hybrid. Hybrid tiles are a combination of regular tiles and satellite
    tiles.


    # setViewType()


    The setViewType() accepts one parameter, the map view type you want to change
    the map to. Here is how it should look:


    ```

    var newMapType = "satellite";


    myMap.setViewType(newMapType);

    ```'
