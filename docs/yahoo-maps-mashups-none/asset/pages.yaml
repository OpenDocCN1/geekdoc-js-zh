  md: '# Chapter 11


    The first piece of the navigator is a small map inside a square. The map displayed
    here will always display map view tiles and respond to the location and zoom level
    of the main map. The perspective is supposed to use the bird''s-eye view of the
    main map, so the zoom level is actually several levels higher. On top of this
    minimap is a small gray square that, when dragged and released, will control both
    the map and the minimap. This lets users control the position of the map with
    loose precision in a natural manner. When this square is dragged and held in either
    direction, the map will respond by panning to reveal more of the map in that direction.


    The other piece of the map is a zoombar. This is a combination of several elements
    that put together create an easy tool with which users can zoom in and out of
    the map. The elements are a plus button, a minus button and a slider. Each button,
    when clicked, zooms the map in or out. The richness of Flash, zooming in or out
    with this tool forces the map to transition between tile layers. The effect is
    a gradual expansion of the existing tiles and then a fade to a new tile layer
    beneath it. The feat achieves the feeling of users moving the earth when they
    zoom in and in the reverse when they zoom out. The slider adds a somewhat organic
    feel to the zoom and, like the dragability of the square in the minimap, allows
    for a more natural control.


    The NavigatorWidget has the ability to appear open (expanded) or close (collapsed).
    Two methods, open() and close(), are included in the class. They can be called
    against the widget''s instance to change its state after it has been added.


    # SatelliteControlWidget


    The satelliteControlWidget class attaches three preesigned buttons to allow users
    to toggle among the map view types. Once again, this is a great alternative to
    creating and coding your own buttons if it is important. These buttons are set
    to detect the extending map type and will reflect it by selecting the corresponding
    type''s button in the widget.


    # ToolbarWidget


    This widget adds a menu of icons to the top-left corner of your map. It acts as
    a start menu, like the one found at the base of your operating system. Its contents
    are a row of icons representing each tool that you have added to the map.


    Having learned about tools earlier in the chapter, you know their limitless possibilities.
    You also know that the main tool, Pan, will likely be added to more of your mashups
    as map core functionality. If that is all you add, you will likely not need this
    widget. However, if you develop and add several tools of advanced functionality,
    it will be very useful to your users to have a menu to activate and/or use those
    tools. That is where this widget becomes very valuable. The map is intended to
    have only one tool active at a time.


    # Working with Overlays


    An overlay adds a new layer over the existing map layer. It moves along with the
    map as it is panned. Overlays are generally used as containers for sets of markers
    representing related data, such as local search results and traffic.'
