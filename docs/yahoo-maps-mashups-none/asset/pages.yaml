  md: '# Chapter 16


    The search method passes the criteria to the local search web service. The parameters
    in this example call for all locations with the keyword "pizza," at the location
    defined by the latlon (in this case Chicago). The remaining parameters passed
    for the overlay to display markers with the first locations and show only ten
    results. As mentioned earlier, these parameters and the others available for the
    search method enable you to control results. By manipulating the start index,
    the third parameter, you can create an effect of pagination, which allows the
    user to conduct a search in ten location intervals.


    The data are returned to the map in a format that enables you to display markers
    at a precise location for each result. Markers (set to the style representing
    that of a POI marker) display location information including a five-star rating
    interface, links to local data, and business address and phone number.


    To use the data returned for the locations, you can use the object data returned
    when EVENT_SUCCESS is processed. In this example, the searchFilter object and
    some of its properties are traced to show you how to narrow the criteria of future
    searches. Also displayed are the total results of the local search, which once
    again enable you to organize the returned data.


    As you can see, this overlay has acted like a built-in mashup, giving you access
    to some very useful data through a simple set of overlays.


    # TrafficOverlay


    Trafficoverlay is another overlay that replicates the power of a very popular
    and useful feature of the Yahoo! consumer application. Real-time traffic incident
    information can add a desirable functionality to your application, giving it an
    extra edge over other applications. A benefit to this overlay class is that it
    has no methods, since all the functionality is built in.


    The overlay class requests traffic information for the area map it is currently
    centered on. It takes the data returned and displays each item as a CustomPOIMarker,
    complete with incident information. The markers reflects traffic incidents ranging
    from accidents to road construction to medical emergencies. Each incident is represented
    with a different color and universal symbol.


