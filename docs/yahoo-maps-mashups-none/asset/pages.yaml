    # Enhancing the Mashup


    While the steps and code provided and reviewed in this chapter give you a solid
    mashup, it is just a start. There are many ways to enhance both the code and presentation
    of your AS-Flash API-based mashup.


    Within the code itself, there are several things you can do to scale the application.
    Here are suggestions:


    +   * Experiment with different component events, changing user interaction to
    make it more intuitive.

