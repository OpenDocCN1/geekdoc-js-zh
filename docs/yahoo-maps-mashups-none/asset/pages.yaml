    # getMapTypes()


    getMapTypes() is most useful if you want to create your own map view buttons.
    Letting your users choose their map view can add a hint of customization to it.
    Not to mention that the ability to display satellite images of the world, from
    space all the way down to street level, is quite an enticing feature that will
    draw users to your mashup.


    ```

    mapInstance.getMapTypes() ;

    ```


    This method is a little more complex than the other basic methods, as it returns
    an array. That means the data returned by this method appear in something like
    a list. To view each item, you must loop through this list and trace out each
    value within the array. Whereas earlier you used a for/in loop to view the contents
    of EVENT_MAP_GECODE_SUCCESS and EVENT_MAP_GECODE_ERROR, here you will use a for/each
    loop. (The for/each loop will be discussed more in the next example.)


    ```

    var mapTypes = map.getMapTypes();

    ```


    ```

    alert(mapTypes);

    // Outputs: YAHOO_MAP, YAHOO_SAT, YAHOO_HYB

    ```


    # Map Positioning Methods and Events


    This set of basic methods enables you to control the positioning of the map. In
    addition, these methods let you toggle certain built-functionalities of the API.


    # drawZoomAndCenter()


    drawZoomAndCenter() accepts two parameters, address or YGeoPoint (latitude/longitude)
    and zoomLevel. A successful address can be a ZIP code or a street name, city,
    state and ZIP code. Certain major metropolitan areas will work as well. The address
    is converted by the API ge-coder into a latitude/longitude pair, and the map reloads
    its tiles and centers on that value.


    YGeoPoint is the class in the Ajax API that converts latitude/longitude coordinates
    into an object that can be properly handled by the API. This method gives you
    the option of passing either address or YGeoPoint, depending on what you have
    available:


    ```

    mapInstance.drawZoomAndCenter(address, zoomLevel);

    ```


    or


    ```

    mapInstance.drawZoomAndCenter(YGeoPoint, zoomLevel);

    ```


    This example shows the code to set or change the address to San Francisco and
