    feed. Lastly, the ttl field communicates the “time to live” value of the feed.
    This is time in minutes that the field should be cached. This gives you the option
    to set a timer for this value and recycle the field at certain intervals.


    Within the image node are data that support displaying the HotJobs logo with the
    data you display. You can see the path to the image, a title, a link to the image
    when it is clicked as well as the width and height properties of the image. Adding
    the web service or API log to display in your mashup is usu- a requirement of
    the user terms.


    The item node is where the individual job data come from. Usually, this node will
    be repeated up 50 times in a single response, detailing 50 job lists. It is from
    here that you will cre-ate a marker to display the information within. The HotJobs
    web response is not a geoRSS feed, instead, every job listing title ends with
    the city, state and country of the job listing. Additional data available are
    a link to link back to the listing, description and the publisher data, pubdate.
    The field is the unique ID of HotJobs listing.


    # Architecting the Mashup


    A very helpful step is to lay out the plan for your mashup. Often reserved for
    much bigger applications, this step helps with coding and let you program much
    more effectively and efficiently. Based on the known user behaviors of the application
    as well as what you know about the Yahoo! Maps AS-Flash and HotJobs web services,
    you should be able to create a blueprint for what code will be needed.


    +   1. Import all classes that you will need.

    2. Add an event handler when the button component is clicked.

    3. Add a conditional that checks for valid data in the TextInput component. This
    will prevent a request going through without user entry.

    4. Construct the URL for the HotJobs web service, including the value of the TextInput
    compo-nent as the job type parameter.

    5. Build a function that submits the request and loads it into an XML object.

    6. Build a function to parse the successfully loaded XML into a well-organized
    object.

    7. Parse the object into relevant data and store each job title, job description
    and job location into an array.

    8. Iterate through the array, adding a marker on the map based on the job location.
    Populate the mashup with the job title and description.


    # Loading the XML


    You will now build the ActionScript class that gets the data from the web service
    for your mashup. This will be a separate, stand-alone file from the .fla file
    you''ve been working with.


    +   1. Using Flash (or any other IDE like Eclipse, PrimalScript or SEPY), create
    a new ActionScript class file. Go to File->New (Ctrl + N) and select ActionScript
    File.

    2. Save the file as getData as as_mashup_scrolling.fla.'
