  md: '# The Ajax Mashup


    ![](img/1617eb1f737d2e225712aa0e0bbc3d21_92_0.png)


    As you will see in the coming Flickr API methods, the latitude and longitude of
    a photo, when available, can be collected with a field called geo. There is actually
    a set of method calls specific to the management of the geo-tags for a specific
    photo.


    Geo-tagging photos is a natural process, as every photo taken can be associated
    with a location. The performance of this real-world mashup, between Yahoo! Maps
    APIs and Flickr, is proof of how effective working with photos and maps can be.


    # API Authentication


    Flickr has an authentication process different from most YDN-supported APIs and
    web services. You must receive authentication for your mashup from Flickr in the
    form of an API key. You can apply for and receive the key at http://www.flickr.com/services/misc.api_keys.html.


    The current application requires your name and e-mail, declaration of a commercial
    or non-commercial usage, and a description of how you plan to use your mashup.
    You must also acknowledge the usage terms of the Flickr API. You will likely be
    given an API key immediately upon submitting your application.


    You will need the API to complete the mashup for this chapter. As you learn the
    steps to piecing together a call to the Flickr API, the following text will appear
    as an indication of where you need to plug in your API key:


    ```

    (your_flickr_api_key)

    ```


