    +   6. Save the file (Ctrl + S) and compile the movie. See Figure 16-2.


    The satellite widget will load, reflecting the map view currently displayed in
    the map.


    # How It Works


    The buttons and all the logic for this widget becomes available when the class
    is imported. Since Satellite doesn''t have open or closed states like the Navigator,
    you can create and add the widget instance with one line of code, as demonstrated
    in the example.


    Since you have not changed the map view type, the widget in turn represents the
    default map button as selected. When the button is selected, the user cannot click
    it anyore. Had you changed the default map view type or called setMapType() in
    this example, the buttons may have reflected another state.'
