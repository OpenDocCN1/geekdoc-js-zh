    means that the same AppID you received in earlier chapters of this book, will
    work with this API.


    In the steps ahead that guide you through building the mashup, you will be prompted
    necessary to enter your personal AppID. However, as the API is broken down in
    the following sections, this variable will indicate where your AppID will go:


    ```

    (your_YDN_appID)

    ```'
