  md: "# 3\n\n# The Ajax API\n\n> > “We found this map that said that underneath this\
    \ place there’s buried treasure.\n — The Goonies, 1985\n\nThe Yahoo! Maps Ajax\
    \ API applies a technology that has become one of the most significant web technologies\
    \ ever. In this chapter, you will be introduced to the technology that fueled\
    \ Web 2.0 and spelled the end of the HTML browser refresh as you know it.\n\n\
    This chapter discusses the fundamentals of JavaScript, Ajax and the Yahoo! Maps\
    \ Ajax API, including\n\n+   - What the Ajax API is\n- How Ajax works in many\
    \ exceptional applications\n- Fundamentals of JavaScript, CSS and HTML\n- How\
    \ Ajax uses the XMLHttpRequest object\n- Benefits of the Ajax API\n\n# What the\
    \ Ajax API Is\n\nThe first of the four maps APIs covered in this book is the Ajax\
    \ API. This API makes available the full library of classes and elements necessary\
    \ for you to display the Yahoo! Maps developer offering. This includes the maps,\
    \ navigation ai elements, and well as key mapping functionality.\n\nThe Ajax API\
    \ is not installed, nor does it need to run on your server. As you will see, you\
    \ can get all you need to display maps to users by referencing and importing a\
    \ simple JavaScript file into your HTML. Once the files are automatically included\
    \ in your code, which you can achieve by including the API’s library file within\
    \ a JavaScript tag, you can create an instance of the map. This instance is actually\
    \ built on a container element defined by CSS (Cascading Style Sheets), a definition\
    \ of how content will be laid out in HTML."
