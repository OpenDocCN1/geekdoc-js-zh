  md: 'Developers find working with IDEs an improved coding experience for many reasons.
    One of these file management. Dreamweaver and Eclipse feature ways to manage your
    files alongside the coding window. This enables you to open and move around all
    the files within your site. Dreamweaver adds FTP ability, a way to actually upload
    your files right to the server as you code. The other great benefit, which helps
    coders at all skill levels, is this special feature, based on the language you
    are coding with, allows the IDE to colorize specific elements of the code. It
    can also offer up a list of properties and methods available as you type an object
    or variable.


    # # Transitioning Between APIs


    Having amazed the Ajax API chapters, developing many examples and a full-fledged
    mashup, you already have a solid understanding of building Yahoo! Maps-based mashups.
    As you transition from Ajax-generated maps to Flash map APIs, by way of learning
    the JS-Flash API, you may note some key differences in form and functionality.


    While the JS-Flash API benefits from being included in your HTML in a nearly identical
    way to the Ajax API, some key differences exist. Those differences will be pointed
    out in this chapter and the next to ease the transition between APIs. The slight
    differences will different names for classes and methods as well as different
    means of creating objects.


    As you move into the basic- and advanced-feature chapters in this book about the
    JS-Flash API, you will be introduced to many new tools, widgets and marker types
    that become available with the Flash APIs. Also new will be the custom SWF classes,
    consisting of marker, overlay and tool capabilities that can be be completely
    customized by you.


    # # Integrating the JS-Flash API


    This chapter features two examples that will walk through the simple steps of
    integrating the JS-Flash API with your HTML. The web pages you build here will
    become the foundation of each sample and mashup you build over the next few chapters.
    Keep in mind how to include the API as well as how to set initial parameters.
    All that methods and classes discussed here will be covered in much more detail
    in subsequent chapters.


    # # Including the API Classes


    Unlike of the other map APIs covered in this book, the JS-Flash API is not a component.
    To include the API in your HTML, you simply need to include the API library in
    your document. You do this by defining the library src URL in the JavaScript tag
    within your HTML document. This includes all the latest classes and methods that
    enable you to display and control the map within your. The first exercise will
    set you up with the baseline code you will use throughout the next several chapters.'
