    # Marker Classes


    Marker classes are packages of elements and other classes that enable you to add
    a variety of marker types to your map. Think of each marker class as a different
    marker type. A variety of markers are available in the AS-Flash API, ranging from
    the simple black waypoint marker to the customizable custom POI marker. You can
    apply your creativity and Flash design skills to developing your own custom SWF
    marker.


    The various marker classes have their own properties, each set when the marker
    object is created. When adding the marker to the map, you define what type of
    marker you are adding by passing the class and properties you have set in the
    marker object.'
