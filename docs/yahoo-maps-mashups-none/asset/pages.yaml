  md: '# Chapter 20


    Get methods work very efficiently in the API. Since the value is already set,
    most likely by you calling the set method counterparts of the get methods, all
    the API needs to return the value to you. For development, get methods are very
    easy to implement, as they require no parameters to operate.


    As you code your application, you will find that get methods make development
    much easier. Rather than sure your code "remembers" what values have been throughout
    your application''s operation, you can call a get method and have the latest value.
    The get methods also help with user interface implementation. The get methods
    provide those data. Coding get methods for Flex 2 with the AS-Flash API is a bit
    challenging. It requires an additional layer of code on top of what you use to
    integrate set methods. The reason for this is not only Flex 2 send a call, it
    must be set to receive the data being returned. This means that the local connection
    must be set to handle two-way communication. While the process is a bit extensive,
    the results are rewarding and will pay dividends in the performance of your mashup.


    # Center()


    center() returns the pixel coordinate is centered as a Point coordinate. Remember
    that this value looks like a latitude/longitude coordinate, but is actually an
    x/y coordinate.


    ```

    mapInstance.getCenter() : Point;

    ```


    Now it''s time to try this out in an example using Flex 2 and the AS-Flash API
    approach to building Yahoo! Maps APIs will adapt the base application (from the
    last chapter and used earlier in this chapter) to pass a getCenter() call and
    receive what it returns through the local connection.


    # Try it Out Display the Map''s Center Coordinates


    In this example, you will need to modify each of the three application parts you
    created in the last chapter. Start with the Flex client by modifying the MXML
    in Flex Builder 2.


    +   1. Open the Flex Document asFlashAPI.fla.

    2. Save it asFlashAPI_getCenter.fla.

    3. Select the first frame in the timeline. If the timeline is not visible, go
    to Window Timeline (Ctrl + Alt + T).

    4. Go to Development Panels > Actions and select it (or press F9).

    5. Replace the contents of the application with the following code:


    ```

    //Create local connection object

    var connectedMap:LocalConnection = new LocalConnection();


    //Import PanTool class

    import com.yahoo.maps.tools.PanTool;


    //Add Initialize Event Listener to map instance

    myMap.addEventListener(com.yahoo.maps.api.flash.YahooMap.EVENT_INITIALIZE, initComponents);


    //Function that executes when initialize event is fired

    ```'
