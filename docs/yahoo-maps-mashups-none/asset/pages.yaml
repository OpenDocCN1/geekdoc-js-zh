  md: '# Chapter 2


    # Weather


    On the news, you will never hear weather mentioned unless it is affecting. Weather
    is news based on location, and makes it a perfect ingredient to be mashed up with
    Yahoo! Maps. The weather API offered by Yahoo! gives you up-to-date weather information
    on an area, using a ZIP code or location ID.


    XML returned by the weather API is in RSS format and features attributes such
    as wind (wind chill, direction and speed), atmosphere (humidity, visibility and
    pressure), and astronomy (sunrise and sunset). Most useful is the forecast attribute,
    which lays out what the weather is in an area and what it will be.


    Forecasts feature a code that adheres to the weather API’s code index, enabling
    you to look up a code to see the weather condition is. Combine that information
    with the latitude/longitude value and the magical CustomSWFMarker in the Flash
    APIs and you can creatively create actual weather markers right on the map.


    # Traffic


    Yahoo! offers a REST API and RSS feed for traffic, and both play very nicely with
    the map APIs. The Traffic API is used to mark any traffic problems based on the
    location you use. In your mashup, you can tie the code, as it is dynamically prompted
    based on user interaction, and pass it into the Traffic API. The XML returned
    can be represented with markers (see Figure 2-2) or as a set of markers within
    an overlay.


    ![](img/1617eb1f737d2e225712aa0e0bbc3d21_41_0.png)


    Figure 2-2


    The TrafficOverlay class mentioned previously will be explored with the Flash
    APIs a later in this book. A benefit to using this built-in overlay is that it
    leverages a wide set of preloaded custom markers designed to reflect various traffic
    alerts.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Developing with Yahoo! Maps


    # Local Search


    As I demonstrated the REST example, local search is a very powerful example of
    data perfect for the map APIs. After being successfully queried, local search
    data returns XML featuring some very comprehensive location-based data. The information
    available includes business name, contact information, address and the categories
    related to the business. Also is included for the business, as an attribute representing
    the collective rating given to the business by Yahoo! users.


    The LocalSearchOverlay mentioned previously will be featured in some of the mashup
    examples that use the Flash APIs. Included in this class are special markers that
    display local business information and a five-star rating interface.


    # Yahoo! Developer Support


    Yahoo! has a tremendous reputation for offering developers trustworthy and well-supported
    APIs. The map APIs are no different. Yahoo! offers a wide range of very helpful
    code references, documentation, examples and source code. Particularly useful
    with maps are the “Getting Started” examples available. Like the exercises in
    this book, these examples are cut-and-paste, ready to be inserted and launched.


    # Developer Network


    Developer Network (YDN) is responsible for spreading the word about all Yahoo!
    APIs and development platforms. This group also works to distribute and govern
    the APIs. All APIs listed and supported by YDN receive the same high-quality support,
    no matter old or new the API is. The support offered by YDN, documentation and
    all, is very consistent from one Yahoo! API to the next. This is a big advantage
    to developers, making it easy to explore the wide offering of APIs. You may not
    have noticed, each of the APIs in the previous section is a Yahoo! property and
    all are supported under the same roof of YDN.


    Yahoo Developer Network can be accessed at http://developer.yahoo.com.


    # Message Group


    The Maps message group is a welcome support line for all developers using the
    map APIs. Messages posted here are read by other API developers you like as well
    as Yahoo! developers actually working on the APIs. Messages posted consist of
    questions and answers regarding best practices, requests for source code and assistance
    and suggested alternatives to implementing the API. The message group is also
    used by API developers to post bugs, learning of upcoming releases and share their
    latest mashups with others.


    Several support groups use Yahoo! Groups. The yws-maps group is a popular place
    to discuss maps and map mashups. Here, developers of the maps team exchange ideas
    for working with maps.


    This group can be found at http://tech.groups.yahoo.com/group/yws-maps/.'
