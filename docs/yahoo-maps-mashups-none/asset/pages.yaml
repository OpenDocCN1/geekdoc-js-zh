  md: '# Chapter 22


    # Making the Video


    There''s a little bonus for you in this mashup project: you get to work with Flash
    Video. Flash''s Video for- (FLV) represents one of the most compressed best quality
    video formats available. Since its introduction in 2002, Flash video has benefited
    from the high impression usage of the Flash Player.


    Flash video can live within your Flash application in three different ways: Embedded,
    the video material lives within the Flash application, enabling you to manipulate
    actual video content over the timeline. The major downside to this method is that
    the video cannot be dynamic. Also, if the video is too long, it may cause performance
    issues for the user.


    Another way to include Flash video is via progressive download. This is the most
    common technique. It requires you to keep the video outside the Flash application,
    meaning that it is loaded dynamically. The main benefit is that you should change
    the video you not need to recompile your application. Another benefit is that
    the video can be loaded by other Flash applications, as it will likely be hosted
    on your server.


    The last option for including video in your application is to stream. This is
    the best way to feature video, it is not a popular option for independent developers.
    This is to stream video, you will need to leverage the Flash Media Server (FMS,
    formerly Flash Communication Server). Streaming video and using FMS introduces
    all sorts of new features, including the ability to control and monitor performance
    as well as the ability to use cameras for real-time chatting.


    For this mashup, you will be applying the progressive download method. While the
    FLV you will be using is already created and available (you added the links to
    the FLV files you coded the MXAML), you will now learn the steps to create your
    own FLV files.


    # Converting Media to Flash Video


    You by creating or obtaining your own video content. Using a hard drive or media-based
    camera a Sanyo HD1 or Canon Euro is your best bet. This is how you can pull video
    right off the camera or its removable video. You can also use a digital camera,
    but that will require you to pull the video off using firewire technology. For
    a quick and cheap way of obtaining your own video, you can use a standard webcam
    and capture its output to your computer.


    Once you have obtained the video, it is time to convert it to FLV. This process
    requires you to load the video into FLV, compress and export it as an FLV.


    # Make an FLV File


    You will need to acquire a video file (.mov, .avi, .mpeg4 and many others) to
    complete these steps. You should also have a server account where you can host
    and serve the FLVs from. (The following may vary slightly with newer versions
    of the Flash IDE).


    +   1. With the Flash IDE open, create a new Flash document.

    2. Save the Flash document as Ymaps_video.fla.

    3. Go to File ➔ Import to Library.

    4. Browse to where you have stored the video file on your system and press Open.'
