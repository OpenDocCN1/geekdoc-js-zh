  md: "# Chapter 7\n\n# API Methods\n\nLike the Maps APIs, Flickr offers a wide set\
    \ of functional yet simple API methods. Each method is responsible for letting\
    \ you, the developer, interact with Flickr in important ways. The methods can\
    \ be organized into categories based on functionality. The most relevant methods\
    \ for mashing up photos and their data with maps will be reviewed in this chapter\
    \ to give you a solid overview of the capabilities of the API.\n\nFlickr supports\
    \ its API calls through a very effective and intuitive interface. The documentation\
    \ is actually a live, breathing interface that enables you to test each API call\
    \ and view the responses. By default, the documentation crafts the call as a REST\
    \ request and returns readable XML.\n\n# flickr.photos.search\n\nThis popular\
    \ Flickr call returns a list of photos based on given parameters. It effectively\
    \ enables you to search through nearly all of Flickr's photo repository. Since\
    \ Flickr users can mark their photos visible only to certain users, this call\
    \ requires certain authentication or permissions to view all photos.\n\nThe only\
    \ required parameter for this API call is api_key. A useful mashup parameter is\
    \ the optional extras. You can here add the field geo, which will return the photo's\
    \ latitude and longitude as defined by the user. Another useful parameter for\
    \ this is tags, which enables you to search for photos based on the tag uploader.\
    \ This is often a precise means of filtering out photos you want to display.\n\
    \nThe fully constructed flickr.photos.search REST call looks like this:\n\n```\n\
    http://api.flickr.com/services/rest?method=flickr.photos.search&api_key=(your_flick_api_key)&tags=yahoo+hack+day&extras=geo\n\
    ```\n\nYou can see the parameter which to plug in your api_key. The searching\
    \ tags yahoo+hack+day instruct the search to return photos tagged with those words.\
    \ Finally, the extras-geo parameter will return the latitude and longitude of\
    \ each photo, where available.\n\nCopying and pasting the preceding into your\
    \ browser will result in XML that anyone can parse. An excerpt of such a response\
    \ to this method call looks like this:\n\n```\n<?xml version=\"1.0\" encoding=\"\
    utf-8\" ?>\n<rsp status=\"ok\">\n  <photos page=\"1\" page=\"17\" perpage=\"100\"\
    \ total=\"1679\">\n    <photo id=\"259464940\" owner=\"...\" secret=\"...\" server=\"\
    45\" title=\"The Mosh pit at Yahoo! ispublic=\"1\" isfamily=\"0\" latitude=\"\
    37.418363\" longitude=\"-122.025135\" accuracy=\"16\" />\n  </photos>\n</rsp>\n\
    ```\n\nAmong the attributes of this actual photo in Flickr, you can see the latitude\
    \ and longitude. As you will see later in this chapter, parameters from a call\
    \ like this one will be used to place a marker on the map with the specified coordinates."
