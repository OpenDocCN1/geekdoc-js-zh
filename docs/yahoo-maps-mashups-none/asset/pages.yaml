  md: '# Chapter 12


    # API Methods


    Not to say the Travel APIs are limited, thankfully it offers only two methods
    for interaction. It is not a reflection of the quality of the API or the data
    available. It is a more concentration of function that the service is currently
    designed to provide.


    Yahoo! Travel supports its API calls through a Yahoo! Developer Network site similar
    to that for Maps. By default, the documentation crafts the method as a REST request
    and returns very readable XML.


    # tripSearch


    This method lets you search for user-entered trips based on loose criteria. It
    also enables you to search for trips posted by a specific user.


    To search for posted trip plans, you will need to pass a query parameter in addition
    to the required AppID parameter. This is a keyword as “New York” or “Europe.”
    Using the parameter, the method will return all trips tagged with the query value.


    The fully constructed tripSearch REST call looks like this:


    ```

    http://travel.yahoo.com/TripService/V1/tripSearch?appid=(your_YDN_appID)&query=

    erurope

    ```


    You can see how to plug in your API. The query value of europe instructs the search
    to return trips tagged with this word. Additional parameters for this method include
    results, a value that quantifies the number of results returned and can take a
    value from 10 to 50, and start, a value that determines what value will be returned
    initially. The latter is helpful for paging results.


    Copying and pasting this code into your browser will return XML that an application
    can parse. An excerpt of such response for this method looks like this:


    ```

    <<?xml version="1.0" encoding="UTF-8" ?>

