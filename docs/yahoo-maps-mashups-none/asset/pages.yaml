  md: '# Get Started with the AS-Flash API


    ![](img/1617eb1f737d2e225712aa0e0bbc3d21_186_0.png)


    Figure 14-4


    # # How It Works


    When the component is compiled, the API checks for what has been set in the parameters
    first. By setting the parameters in the Properties window, you are actually changing
    the default values of the initial variables the map is loading. This means that
    the component is processing these values as if they were right inside the API
    classes themselves.


    Setting the default values is good practice because it gives your application
    a starting point for what to load. In the next chapter you will learn how to call
    methods to change the default values based on user interaction.


    # # Initialization


    The map has initialized when it fully loads. At that time, the API broadcasts
    an event named EVENT_INITIALIZE. Because the component is busy building the map
    display based on the initial parameters, it does not accept code very well until
    it has completed loading. In other words, it is best not to bother the map until
    it initializes.


    With the AS-Flash API, almost all the code that you will write to execute when
    EVENT_INITIALIZE is fired. So listening effectively for this event is key to building
    your mashup. While events will be explored much more in the chapters to come,
    this exercise should end up being the foundation for what you will do with this
    API Grab a hold of your mouse and get ready to start ActionScripting!


    # # Try Out Add Code Behind the API


    Finally, here is where you will jump into coding ActionScript with the AS-Flash
    API. This exercise will unlock for you almost everything you will be doing to
    make your application into the ultimate AS-Flash mashup.'
