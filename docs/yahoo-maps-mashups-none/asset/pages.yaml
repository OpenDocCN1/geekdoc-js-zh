  md: '# Chapter 11


    The map should be a form consisting of two radio buttons and a text area. The
    radio button labeled "PanTool" is selected, indicating that this feature is not
    active.


    # How It Works


    After importing the JS-Flash API library, the classes become available to your
    JavaScript and HTML. The mapContainer style defines the size and placement of
    the map. The div tags will display the map as it is rendered and inherit the style-sheet
    properties of the mapContainer.


    The apiForm is written in HTML and will do two things. First, the form contains
    a pair of radio buttons labeled "PanTool" and "Pan off". The map loads without
    the PanTool loaded, so that the two radio buttons is selected by default. Each
    radio button has an onClick event handler to call the togglePan function.


    The map is created by creating a new map, including the parameters to set default
    location and zoom level. After that, an instance of the PanTool is created. Creating
    the PanTool instance does not add the tool to the map. This will be performed
    within the togglePan function.


    Clicking either radio button calls the togglePan function, passing it the toolAction
    parameter. This determines, by a conditional (if/ then statement) within the togglePan
    function, whether the PanTool be added or removed. The API methods addTool and
    removeTool, with the PanTool instance as their parameter, accomplish these tasks.


    You use the addEventListener method to listen for the toolAdded and toolRemoved
    events. These events are fired from the map when the tool is added or removed.
    Each event listener calls a corresponding function to update displays and status
    as the tool that has been affected, using the data object''s tool.type property.


    This exercise, like most in the book, is intended to be flexible and should enable
    you to try out adding and removing the other tools and widgets featured in the
    JS-Flash API.


    # CustomSWool


    CustomSWFTool enables you to extend the interactivity of the map into more engaging
    tools. Like the PanTool, this relies on mouse interaction to engage the user.
    With other customSWF classes discussed in this chapter (CustomSWFMarker and CustomSWFOverlay),
    to take advantage of this feature you will need to build your own SWF and add
    it to the map using the methods local to this.


    Through a series of events, your customSWFTool will be able to listen for mouse
    events. Various developers have used the customSWFTool to create drawing utilities,
    advanced zooming interfaces and unique navigation controls.


    In addition to the tool, you can create an icon for the tool. The icon should
    be an SWF measuring 26 by 26 pixels. It should offer a simple icon representing
    what the tool will do. For example, the icon that comes prepackaged with the PanTool
    resembles a hand.


    Both the tool and the icon can be passed when the CustomSWFTool is created.'
