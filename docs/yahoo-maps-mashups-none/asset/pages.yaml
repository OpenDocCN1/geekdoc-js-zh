  md: '# The AS-Flash API


    APIs are ultimately about the methods they expose to developers. What APIs enable
    developers to do is reach into the map application and access those methods that
    have been made accessible. While there are many methods within an application
    itself, to keep APIs simple, only the most effective methods are made available
    and documented to develop against.


    As the API is explored further, you will see that it is through methods that events
    of the API are handled. This is an important function of methods as they are able
    to carry forth the actions to objects set in user interaction.


    # The Trace(object) Method


    In every language there is a way to debug code as you develop. Flash is no different,
    and its version of the traditional Echo command is the trace() method. When using
    this method, you can trace values as you compile the code and run the application.
    Tracing becomes very valuable in checking values of variables, as they are set
    dynamically.


    When you are developing mashups, tracing is effective in determining latitude/longitude
    values as the map''s center point changes. Most often, you will want to add a
    trace statement within an event handler, so you know the time of certain events
    in your application. Later in this chapter, the example will use a trace to verify
    every event and interaction with the map.


    The output stream of trace method is picked in Flash and displayed in an output
    panel. When you are compiling the application, if trace() is called, the output
    window will open automatically and display the data. There are third-party output
    listeners that have been developed to work outside the Flash IDE. It is best practice
    to remove or "comment out" all trace calls before launching your application for
    public use.


    # Components


    The AS-Flash maps API is distributed as a component. Components in Flash are prepackaged
    applications. Shipped with the Flash IDE are numerous components, intended to
    support you in rapidly deploying RIAS. Some examples of out-of-the-box components
    shipped with Flash IDE are ComboBox, TextInput, DataGrid and ScrollPane.


    In addition, some components support media playback for FLV and MP3 files. Also
    included are components supporting fast development with XML and web services.
    Adobe has also released additional components to support related Flash platform
    technologies. Flash Communication Server components display web streams and chat
    sessions. Flash Remoting components include a component to enable removing services,
    as well as a debugger.


    Components are intended to enable developers to build and package a reusable application
    using a common architecture. Once the application is built, developers can share
    and distribute the variety components. This gives others the ability to install
    and drop them into existing applications for the variety of functionalities provide
    (see Figure 13-5).


    Channels like Adobe''s Developer enable to upload your components, offer them
    for free or even sell them. Browsing through the wide opening of components, you
    will see tools for everything from dynamic charting to animation effects to e-commerce.
    Well-established developers and firms package and sell their components as well
    as the consulting needed to implement them.'
