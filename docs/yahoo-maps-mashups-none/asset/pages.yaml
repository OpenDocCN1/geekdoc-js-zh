- img_proc: true
  md: '# API Method Comparison Chart


    # Basic Get Methods


    The basic get methods for the APIs enable you to retrieve important data about
    and settings for the map at any given time. Retrieving data about the map''s current
    position, zoom level, size and map (view) type can be in coding after the user
    has begun to engage the map.


    | Ajax Method | Flash Method |

    | --- | --- |

    | getZoomLevel(input) | getZoomLevel() |

    | getBestZoomAndCenter(input) | |

    | getZoomValidLevels | |

    | getUnitsPerPixel(ZoomLevel) | |


    Both APIs support methods to retrieve the current zoom level of the map. The Ajax
    API offers similar methods using as bestZoomAndCenter, which suggests to you the
    best settings to display an array of locations.


    This method retrieves the map''s current view (tile) type.


    | getCurrentMapType() | getCurrentMapType() |

    | --- | --- |


    With the only difference being the added view in the name of the Flash API''s
    method, this method returns an array of valid tile types.


    | getCenterLatLon | getCenter() |

    | --- | --- |


    The APIs provide a similar way to retrieve the center position of the map. Both
    methods return their respective latitude/Longitude objects.


    | getContainerSize | getHeight() |

    | getWidth() | |


    To retrieve the height and width of the map, the Flash API offers two methods.
    The Ajax API does with one method and returns an object with the two properties,
    width and height.


    # Tools and Widgets


    The definitions of the terms tool and widget vary between the API types. Tools
    in the Ajax API are similar to widgets in the Flash APIs. They are sets of buttons
    and interactive elements that give the user interface control of the map. Tools
    in the Flash APIs are defined as maneuverability elements that control the map,
    primarily based on mouse movement and events.'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# # Appendix A


    | Ajax Method | Flash Method |

    |---|---|

    | addControlType() | addWidget(new SatelliteControlWidget()) |


    To add a set of buttons that let users toggle between map types, the Ajax API
    provides the addTypeControl method. The Flash API requires a new instance of the
    SatelliteControlWidget, which is then added using addWidget.


    | enableDragMap | addTool(new PanTool(), isActive) |

    |---|---|

    | disabledDragMap | EdgePan() |

    | isDragMapEnabled | CustomSWTool(url, iconURL) |

    | disablePanOnDoubleClick() | |

    | disableKeyControls() | |


    The dragging of the map is a key functionality of both the Ajax and Flash APIs.
    The Ajax API provides a series of methods for controlling this functionality,
    including the ability to enable and disable certain interactions with the map.
    The Flash API lets you enable dragging of the map by adding the PanTool. Advanced
    mouse interaction with the Flash API allows for unique tools like EdgePan. You
    can also develop your own mouse interaction using the CustomSWTool.


    | addZoomLong | addWidget(new NavigatorWidget) |

    |---|---|

    | addZoomShort | |

    | addPanControl | |


    Through a collection of tools, you can add various zoom buttons and pan arrows
    to your Ajax mashup. The Flash API enables all this with one effective widget,
    the NavigatorWidget. Like the engaging device found at maps.yahoo.com, this widget
    combines an interactive zoom and minimap.


    | removePanControl | removeTool(tool) |

    |---|---|


    The Ajax API offers a specific method for removing the pan tool. In the Flash
    API, you must use removeTool, passing the instance of the tool you want to remove
    from the map.


    | removeZoomControl | removeWidget(widget) |

    |---|---|


    You can remove any added widgets in the Flash API by passing their instance into
    removeWidget. RemoveZoomControl is another example of an Ajax method provided
    to move a specific tool.


    # ## Markers and Overlays


    These sets of methods and classes enable the organized addition of data to the
    map instance. While the methods for adding markers and overlays to the map differ
    in many ways between the Ajax and Flash'
  merge: -1
