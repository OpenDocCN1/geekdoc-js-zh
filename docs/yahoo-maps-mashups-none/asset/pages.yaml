  md: "# Basic Methods: Flex 2 Using the AS-Flash\n\nFor the Flash client:\n\n```\n\
    myMap.setCenterPointDelta(point, duration);\n```\n\n# setMapViewType()\n\nYou\
    \ learned in the last chapter that one of the default properties of the API is\
    \ the map view type. The three map view types are map for map tiles, satellite\
    \ for satellite tiles and hybrid for a view that features a combination of map\
    \ tile elements layered on top of satellite tiles.\n\n```\nmapInstance.setMapViewType(mapType:String);\n\
    ```\n\nThe setMapViewType() accepts one parameter, the map view type you want\
