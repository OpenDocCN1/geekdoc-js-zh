  md: '# The JS-Flash API


    Events play a big role with the JS-Flash API, and are based much more on code
    occurrence than user interaction. Working more with data and code execution, events
    can be fired to signal when data has been sent or received when certain code is
    completed in the application. Maps API dispatches many events tied to map activity,
    including startPan, changeZoom and onGeocoder. Each of these refer to an activity
    of the map as it happens. Setting up event handlers for these events lets you
    call other functions based on map occurrences.


    # Fundamentals of CSS and HTML


    CSS (Cascading Style Sheets) is a means of defining style for laying out HTML
    in the browser. The standard was designed to address the layout and appearance
    limitations of native HTML. Style sheets let you define styles as classes within
    a style tag. These styles can be referenced and applied through your HTML.


    Within the sets of styles you will usually find properties like color, width,
    height, font-weight, font-style and other style attributes. Styles can be coded
    within the head of the HTML. If you are looking to apply the same style classes
    to multiple HTML documents, you can centralize the CSS in its own file and reference
    it from any HTML document. This enables you to maintain one file for your site
    or web application.


    While styles can be referenced in everyday HTML tags, they are more frequently
    used with tags like span and DIV. These tags are part of HTML (Dynamic HTML),
    a slight modification to the language that allows for more dynamic handling of
    web content. Style sheets build containers, elements that exist on the web page
    outside, within, or outside the boundaries of regular HTML. These containers rely
    heavily on CSS for positioning and appearance.


    The syntax of CSS can be tricky, but is easy to get the hang of it. This example
    shows how CSS and HTML are used to position the DIV container for the JS-Flash
    API:


    ```

    <html>

    <head>

    <style type="text/css">

    #container {

    position: absolute;

    left: 200;

    top: 200;

    border-style: ridge;

    border-color: #FFFF00;

    border-width: medium;

    }

    </style>

    </head>

    <body>

    <div id="container">

    This is a positioned DIV container.

    </div>

    </body>

    </html>

    ```


    79'
