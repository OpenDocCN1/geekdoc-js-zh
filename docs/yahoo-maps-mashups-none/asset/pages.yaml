    # How It Works


    After overlaying the overlay class, you will want to set the location for the
    map to load using inline LatLon method. The overlay instance is created. You will
    notice that this can occur at any time after the overlay class has been imported.
    A benefit to setting the variable of the instance initialize function is that
    it becomes a class variable and will be available to all functions.


    The overlay cannot be added, however, until the map initializes. This is because
    the addoverlay() method must be called against the map instance. Event listeners
    are then added to the overlay instance localsearch, which you set earlier in the
    code.


    Using setCenterAndZoom, you change the map''s location. The EVENT_MOVE listener
    is added to the map instance. When this fires, the map will recenter and thus
    have a new set of coordinates. At this time, you execute the search method against
    the local search overlay.


