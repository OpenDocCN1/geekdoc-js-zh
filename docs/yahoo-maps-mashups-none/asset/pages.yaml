  md: '# Chapter 16


    # Advanced Map Objects and Methods


    The last chapter focused on many of the basic methods of the AS-Flash API. There
    are some additional methods that are not used as frequently but are very much
    reviewing. This combination of set and get methods enables you to control the
    map and relay map states to your code.


    # LatRect(minLat, minLon, maxLat, maxLon)


    The LatRect object defines the boundaries (commonly referred to as the bounds
    or envelope) of the map being displayed. This object contains four properties
    that when combined can let your application determine what to display and what
    is being displayed:


    ```

    LatRect.maxLon      //Maximum longitude map is displaying

    LatRect.minLon      //Minimum longitude map is displaying

    LatRect.maxLat      //Maximum latitude map is displaying

    LatRect.minLat      //Minimum latitude map is displaying

    ```


    # setBounds() and getBounds()


    The setBounds() method passes a LatRect to change the current boundaries of the
    map and effectively modify the map being displayed.


    ```

    mapInstance.setBounds(bounds:LatRect);

    ```


    getBounds() returns a LatRect representing the existing boundaries of the map
    displayed. This method is useful for overlaying other map on top of the map API
    tiles. In other words, this information lets you sync other data tiles like land
    parcels, school zones and other imagery are available from various sources.


    If you know the boundaries of the current display, the various latitude/longitude
    readings enable you to add an additional layer on top of the existing one(s).
    This either occurs by serving up tiles or requesting data from a geographic information
    system (GIS).


    ```

    mapInstance.getBounds() : LatRect;

    ```


    When implementing this, you can call a specific property of the LatRect object
    coding it.


    ```

    mapInstance.getBounds()..maxLat;

    ```


    When working with a web service to request GIS data, you will likely need to define
    the bounds (or bound box) in your request. Since you can''t pass an object as
    a URL parameter in a request, you will need to append each property of the LatRect
    object as shown in the previous example.


    # Working with Events


    We discussed AS-Flash API events in the last few chapters. In this more comprehensive
    list, you will learn more about events the API fires as certain user interactions
    take place. These events, well positioned in your application, can add important
    timing, delays and control to how you execute other features of your mashup.'
