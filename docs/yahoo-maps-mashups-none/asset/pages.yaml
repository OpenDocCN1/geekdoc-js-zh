    var overlay = new CustomOverlay();\nmapInstance.addOverlay(overlay);\n```\n\n\
    Most commonly, you will use addOverlay to add a new overlay class and layer to\
    \ the map. However, you can also use it to add markers to the map. To use this\
    \ alternative approach, you will need to create an instance of the marker first\
    \ and then add it as an overlay.\n\n# YPolyline\n\nThe YPolyline class gives you\
    \ the ability to connect points on the map with colored lines. This unique functionality\
    \ allows you to define hiking or biking routes throughout a national park, for\
