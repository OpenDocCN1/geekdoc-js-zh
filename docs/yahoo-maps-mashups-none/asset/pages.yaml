  md: '# Advanced Features: Flex 2 Using the AS-Flash API


    Here, you can see after importing the LocalSearchOverlay class, which is discussed
    in detail in the following sections, the localSearch variable is set to the new
    overlay instance.


    # addOverlay(overlay)


    Once the map instance is initialized, the overlay instance can be added using
    addOverlay().

    addOverlay() accepts one parameter, the overlay instance you are adding to the
    map.


    ```

    mapInstance.addOverlay(overlay);

    ```


    # removeOverlay(overlay)


    removeOverlay() will remove the specified overlay instance from the map.


    ```

    mapInstance.removeOverlay(overlay);

    ```


    # Overlay Classes


    Overlay classes act as built-in matchups. With the LocalSearchOverlay and TrafficOverlay
    classes, your application will be directly connected to the popular search and
    traffic data. These two classes in particular allow you to replicate functionality
    featured on the Yahoo! Maps consumer application.


    Also available is the GeoRSSOverlay class. This class, when imported and instantiated,
    is capable of picking out from geoRSS feeds and displaying markers relative to
    those locations. GeoRSS is a special standard that represents standard RSS data
    with location objects embedded within each item.


    # Overlay Classes in Review


    +   - The LocalSearchOverlay adds a feature that taps the power of Yahoo!''s local
    search database. The functionality lets you call a keyword search and display
    results in the form of markers. This feature closely resembles that of the "Find
    on Map" feature on the Yahoo! Maps consumer application. The markers are enriched
    with some very useful data for any user and consumer, including business name,
    address, and where available, business rating.


    +   - The GeoRSSOverlay class and type of overlay lets populate the map with markers
    defined from a geo-coded RSS feed. This special version of RSS XML contains geo-coded
    objects. A geoRSS feed adds extra data like latitude/longitude or address in addition
    to location information.


    +   - The CustomSWFOverlay combines the functionality of the geoRSSOverlay with
    the potential of the customSWFMarker. Essentially, instead of your geoRSS loading
    images as markers, it can load SWFs. In addition, you can call methods after those
    marker SwFs through the callCustomMethod method, which is reviewed in detail with
    the CustomSWFMarker class


    # TrafficOverlay


    TrafficOverlay is another overlay class that replicates the power of a very popular
    and useful feature of the Yahoo! consumer application. Real-time traffic incident
    information can add a desirable functionality to your application, giving it an
    extra edge over other application capabilities. A benefit to this overlay class
    is that it has no methods since all the functionality is built in.'
