  md: '# Chapter 11


    The other parameter can be obtained at any time using the getCenter() method on
    the map instance. The additional parameters provide various ways to manage the
    results. startIndex and results let you create pagination from one set of results
    to the next. radius, categoryFilter and ratingFilter offer ways to narrow search
    results.


    Two events are tied to the search method using LocalSearchOverlay. EVENT_SEARCH_SUCCESS
    and EVENT_SEARCH_ERROR are fired on the success or failure of a search. Success
    offers some structural data within the object passed that help facilitate a narrower
    search.


    ```

    localSearchOverlayInstance.addEventListener(com.yahoo.maps.overlays.LocalSearchOverlay,EVENT_SEARCH_SUCCESS,onSuccess);

    ```


    ```

    localSearchOverlayInstance.addEventListener(com.yahoo.maps.overlays.LocalSearchOverlay,EVENT_SEARCH_ERROR,
    onError);

    ```


    Once again, you will see that the event listeners are added to the overlay instance
    rather than the map class instance. You will also notice that the event paths
    references to the overlay path through the map class path. Both events call functions
    to carry out their respective dispatches. With that are the data objects. You
    should always explore the object data returned from an event for/in method.


    # TrafficOverlay


    TrafficOverlay is another class that replicates the power of a very popular and
    useful feature of the Yahoo! consumer application. Real-time traffic information
    can add a desirable functionality to your application, giving it an extra edge.
    Benefit to this overlay class is that it has no methods, because all the functionality
    is built inin.


    The overlay class requests traffic information for the map is currently centered
    on. It takes the data returned and displays each item as a CustomPOIMarker, complete
    with incident information. The markers reflect reflect traffic incidents ranging
    from road construction to medical emergencies. Each incident is rendered with
    a different color and universal symbol.


