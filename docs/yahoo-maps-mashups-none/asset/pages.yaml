    The attachMovie() method used in this example uses three parameters. This method
    is called against a target MovieClip. In the example, the targetMovieClip is this.
    It represents the scope or relativity of the MovieClip class you are working off.
    Here, this refers to the base level (stage) of the .fla file.


    The first parameter of attachMovie() is the link ID. This is an ID defined in
    the library panel of the working file. Linkage is a property of all symbols, that
    you can define when the symbol is created or by accessing the Linkage or Properties
    when you right-click on the symbol in the library panel. Linkage, simply, makes
    the symbol available to bematically attached. Components, like Yahoo! AS-Flash
    component, come with linkage available by default.


    The second parameter in attachMovie is the name of the symbol. This lets you define
    the instance name of the symbol when you are copying and attaching. You will recall
    from previous examples that the instance name is usually defined when you drag
    the symbol onto the stage. Because you are doing it programmatically, this method
    assigns the instance name.


    The third parameter is the depth at which the symbol is being placed. As I discussed
    with regard to layer and depth in the last chapter, here you define the display
    level of the new MovieClip. If you were to attach another symbol with a depth
    of 2, that symbol would appear in a layer above the component you are attaching.


    The attachMovie() returns the path to the new MovieClip instance it creates. To
    capture this properly and reference it for future use, a variable has been created
    myMap and cast as a MovieClip. This is good practice for attachMovie(), as it
    prevents you from having to type the full path to a MovieClip in more complex
    applications.


    Moving on with example, you should recognize the handling of EVENT_INITIALIZE.
    Within the onInitMap function, onInitMap(eventData) you are applying some new
