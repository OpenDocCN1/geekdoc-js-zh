    to be called. Once it "hears" the event, it calls the function OnInitMap. While
    this function sets to receive a parameter called eventData, that parameter is
    not actually used. As you will see, by default event-related methods will be set
    up to receive this eventData parameter, as it represents any object data that
    may be passed from the event.


    ```

