    coding. Later, after more rewrites than I’d like to admit, I realize I should
    have planned the data structure first.


    Perhaps this can be best expressed with some Latin:


    > Carpe datum—Seize the data!


    Alternatively, one could look back to one of the classic sets of “Rules” of programming
    authored by Rob Pike in his 1989 paper, “Notes on Programming in C”:^([[18]](#f_0041.xhtml_FOOTNOTE-18))


    Rule 5\. Data dominates. If you’ve chosen the right data structures and organized
    things well, the algorithms will almost always be self­-evident. Data structures,
    not algorithms, are central to programming.


    In that spirit, before building the vector embedding service and committing code,
    we’ll take a moment to model the data. Thoughtful data modeling is key to enabling
    meaningful vector operations later. While this project includes standard models
    for users, articles, tags, and comments, we’ll only venture into the ones most
    relevant to vector search.


    In the blog platform we’re building, we’ll have the following entities:


    *   Users


    *   Articles


    *   Tags


    *   Comments


    Each of these entities will have specific attributes that define them and their
    relationships with other entities. Let’s take a look at the Article model, the
    one most associated with the vector search functionality for the platform.


    ### Defining the Article Model


    The Article model will represent the blog posts on the platform. Users will be
    able to create articles, add tags to articles, and comment on articles. The Article
    model will store information about each article, such as the title, body, author,
    tags, and comments. The Article model will also establish relationships with the
    user entity, as each article will have an author, and with the tag entity, as
    each article can have multiple tags.


    The Article model will have the following attributes:


    *   id: A unique identifier for the article.


    *   slug: A unique slug for the article, derived from the title.


    *   title: The title of the article.


    *   description: A short description or summary of the article.


    *   body: The body or content of the article.


    *   author: The user ID of the author of the article.


    *   tagList: An array of tag IDs for tags associated with the article.


    *   comments: An array of comment IDs for comments on the article.


    *   favoritesCount: The number of users who have selected the article as a favorite.


    Looking at the author attribute, we can see that it’s a user ID, establishing
    a relationship between the article entity and the user entity. The comments attribute
    is an array of comment IDs, establishing a relationship between the article entity
    and the comment entity. Similarly, the tagList attribute is an array of tag IDs,
    establishing a relationship between the article entity and the tag entity. As
    we did when describing the User model, let’s visualize the Article model and its
    relationships to further understand the data model:


    ![Article Model](images/mermaid_graphs/article_model.png "Article Model")


    Now that we have a good understanding of the data model for the article entity,
    let’s write the code using Ottoman.js to define the Article model. Create a new
    file called Article.js in the models/ folder and import the necessary dependencies:


    [implementing_vector_generation_service/create_article_model.js](http://media.pragprog.com/titles/bgvector/code/implementing_vector_generation_service%2Fcreate_article_model.js)


    | ​  | ​**import**​ { Schema, model, getModel } ​**from**​ ​*''ottoman''*​; |


    | ​  | ​**import**​ slugify ​**from**​ ​*''slugify''*​; |


    In the preceding code, we’re importing functions and modules from Ottoman.js,
    a JavaScript library, to help us interact with our database from our models, namely
    the Schema, model, and getModel functions. You’ll also notice a unique import
    for the Article model, which is the slugify library.^([[19]](#f_0041.xhtml_FOOTNOTE-19))
    This library will help us generate unique slugs for the articles based on the
    title. All of these imports are part of a couchbaseClient that we’ll create at
    the end of this chapter.


    Next, let’s define the schema for the Article model using the syntax from Ottoman.js:


    [implementing_vector_generation_service/create_article_model.js](http://media.pragprog.com/titles/bgvector/code/implementing_vector_generation_service%2Fcreate_article_model.js)


