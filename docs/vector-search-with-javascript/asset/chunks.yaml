    "Search Index Query Flow")


    The key advantage of a search index is its speed. Instead of scanning through
    every piece of data in real time, the system compares the query vector against
    the pre-built indexed vectors in the search index. This comparison is where similarity
    metrics, such as the dot product or cosine similarity, come into play. These metrics
    measure how closely aligned the vectors are, which translates to how semantically
    similar the documents are to the query.


    The system computes these similarity scores and ranks the documents by relevance.
    Documents with higher similarity scores appear at the top of the search results,
    ensuring that users receive the most relevant content first.


    Now that we understand what a vector search index is and how it works, let’s start
    building one using Couchbase and Ottoman.js.


    ## Creating a Vector Search Index


