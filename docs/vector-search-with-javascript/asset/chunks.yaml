  trans: "\n你会发现许多实现这种逻辑的方法，但以下这个简单的示例可以帮助你上手。\n\n[`optimizing_search_results/stopWordProcessor.js`](http://media.pragprog.com/titles/bgvector/code/optimizing_search_results%2FstopWordProcessor.js)\n\
    \n```javascript\nconst preservedPhrases = [\n  \"how to\",\n  \"learn to\",\n\
    \  \"step by step\",\n];\nconst stopWords = new Set([\n  \"a\",\n  \"an\",\n \
    \ \"the\",\n  \"is\",\n  \"of\",\n  \"on\",\n  \"to\",\n  \"in\",\n  \"for\",\n\
    \  \"by\",\n  \"with\",\n  \"and\",\n  \"or\",\n]);\n\n/**\n * 通过移除停用词并保留关键短语来处理查询字符串。\n\
    \ * @param {string} query - 来自原始查询字符串。\n * @returns {string} - 处理后的查询字符串。\n */\n\
    const processQuery = (query) => {\n  if (typeof query !== \"string\") {\n    throw\
    \ new Error(\"Query must be a string\");\n  }\n  // 将查询转换为小写以进行一致处理\n  const normalizedQuery\
    \ = query.toLowerCase();\n  // 检查保留的短语\n  for (const phrase of preservedPhrases)\
    \ {\n    if (normalizedQuery.includes(phrase)) {\n      // 如果发现保留的短语，返回原始查询\n\
    \      return query;\n    }\n  }\n  // 将查询拆分为单词\n  const words = query.split(/\\\
    s+/);\n  // 过滤掉停用词，保留所有非停用词\n  const filteredWords = words.filter((word) => !stopWords.has(word.toLowerCase()));\n\
    \  // 重构查询字符串\n  const cleanedQuery = filteredWords.join(\" \");\n  return cleanedQuery;\n\
    };\n\nexport { processQuery };\n```\n\n让我们用通俗易懂的话解释一下这段代码示例。`processQuery` 函数接收原始用户查询作为输入，并返回清理后的查询字符串。它首先将查询转换为小写以确保处理的一致性。然后它检查查询中是否存在预定义的保留短语。如果函数发现了保留的短语，它将返回原始查询以保持其完整性。如果没有找到保留短语，它会将查询拆分为单个单词，并过滤掉任何停用词。随后，该函数将剩余单词重构为清理后的查询字符串并返回给调用者。\n\
    \n正如我们提到的，通过在查询处理的最早期进行此类预处理工作，我们可以确保所有后续操作（从嵌入生成到数据库查询）都能受益于更干净、更精确的。在此阶段进行预处理对于提高搜索结果的相关性和准确性至关重要。另一个显著优势是，减少查询嵌入的大小也可以减少计算开销，取决于你如何架构系统，它可以节省机器资源和成本。\n\
    \n### 在搜索流水线中整合停用词移除\n\n一旦你实现了该工具，请将其整合到搜索 API 流水线中。在将查询字符串转换为向量嵌入之前，运行预处理步骤，以确保系统在后续操作中使用清理后的查询。\n\
    \n为了实现这一点，请修改 `searchController.js` 文件中的 `performSearch` 函数以使用 `processQuery`\
    \ 工具。\n\n[`optimizing_search_results/performSearch_with_search_method_routing.js`](http://media.pragprog.com/titles/bgvector/code/optimizing_search_results/performSearch_with_search_method_routing.js)\n\
    \n```javascript\nimport asyncHandler from 'express-async-handler';\nimport { Query\
    \ } from 'query';\nimport Logger from '../config/logger';\nimport { processQuery\
    \ } from '../services/stopWordProcessor';\n\nconst log = Logger.child({ namespace:\
    \ 'searchController' });\n\nconst performSearch = asyncHandler(async (req, res)\
    \ => {\n  const { query } = req.body;\n\n  // 校验查询是否存在\n  if (!query || typeof\
    \ query !== \"string\") {\n    log.debug('Invalid or missing query');\n    return\
    \ res.status(400).json({\n      message: 'Search query is required and must be\
    \ a string',\n    });\n  }\n\n  log.debug(`Received raw query: ${query}`);\n\n\
    \  // 预处理查询以移除停用词\n  const cleanedQuery = processQuery(query);\n  log.debug(`Cleaned\
    \ query: ${cleanedQuery}`);\n\n  // 根据查询类型确定搜索方法\n  const searchMethod = cleanedQuery.includes(\"\
    \ \") ? 'exact' : 'conceptual';\n  log.debug(`Detected search method: ${searchMethod}`);\n\
    \n  try {\n    // 将查询路由到相应的模块\n    if (searchMethod === 'exact') {\n      // 执行关键词搜索\n\
    \      // 在此处实现关键词搜索\n    } else {\n      // 执行向量搜索\n      // 在此处实现向量搜索\n    }\n\
    \n    // 返回搜索结果\n    return res.status(200).json({ results: [], count: 0 });\n\
    \  } catch (error) {\n    log.error(error, 'Error performing search');\n    return\
    \ res.status(500).json({\n      message: 'An error occurred while processing the\
    \ search',\n    });\n  }\n});\n\nexport { performSearch };\n```\n"
- fmt: "\nThe first step in building a hybrid search system is to define the criteria\
    \ for when to use vector search versus keyword search. Base these criteria on\
    \ the characteristics of the query and the desired search experience. For example,\
    \ you might consider the following factors:\n\n* Query length: Short queries with\
    \ specific terms indicate a keyword search is more appropriate, while longer queries\
    \ with broader concepts could benefit from vector search.\n* Query structure:\
    \ The system might trigger keyword searches for queries containing specific keywords\
    \ or phrases, while it could route general terms to vector search.\n* User preferences:\
    \ The system could allow users to choose their search method and select the approach\
    \ that best fits their needs.\n\nYou establish a foundation for building a flexible\
    \ and user-centric hybrid search system by defining clear criteria for selecting\
    \ the search method. These criteria will guide the logic that evaluates user queries\
    \ and determines the appropriate search module.\n\nOne important consideration\
    \ is to resist the urge to overengineer a solution. While building a complex system\
    \ that dynamically switches between search methods based on many factors may be\
    \ tempting, simplicity is often the best approach. By focusing on a few key criteria,\
    \ or even a single criterion, that align with user needs and application goals,\
    \ you can create a hybrid search system that is both effective and maintainable.\n\
    \nTo avoid overengineering, we can start with a simple distinction: users either\
    \ perform an exact search—they look for a specific article or author—or do a conceptual\
    \ search based on a topic or idea. While other applications may require more complex\
    \ criteria like query length or structure, this binary approach works well for\
    \ a blog platform and offers a practical starting point.\n\n### Routing Queries\
    \ to the Appropriate Search Module\n\nWith the search method selection criteria\
    \ defined, we can now implement the logic for routing queries to the appropriate\
    \ search module. We’ll distinguish between exact and conceptual searches to determine\
    \ whether to use vector or keyword searches.\n\nTo achieve this, we’ll update\
    \ the `performSearch` function in the `searchController.js` file to evaluate the\
    \ query and route it to the correct search module. Here’s the updated part of\
    \ the file with pseudo-code describing where to implement the logic for a hybrid\
    \ switch:\n\n[optimizing_search_results/performSearch_with_search_method_routing.js](http://media.pragprog.com/titles/bgvector/code/optimizing_search_results%2FperformSearch_with_search_method_routing.js)\n\
    \n```javascript\n// Determine the search method based on query type\nconst searchMethod\
    \ = cleanedQuery.includes('\"') ? 'exact' : 'conceptual';\n\nlog.debug(`Detected\
    \ search method: ${searchMethod}`);\n\ntry {\n  // Route the query to the appropriate\
    \ search module\n  if (searchMethod === 'exact') {\n    // Perform keyword-based\
    \ search\n    // Implement keyword search logic here\n  } else {\n    // Perform\
    \ vector-based search\n    // Implement vector search logic here\n  }\n}\n// Return\
    \ search results\nreturn res.status(200).json({ results: [], count: 0 });\n```\n\
    \nIn this updated code snippet, we first preprocess the query by using the `processQuery`\
    \ utility to remove stop words. We then evaluate the cleaned query to determine\
    \ the search method based on whether it contains quotation marks (indicating an\
    \ exact search) or not (indicating a conceptual search). The system stores the\
    \ search method in the `searchMethod` variable and routes the query to the appropriate\
    \ search module.\n\nWe know how to complete the vector-based search as part of\
    \ the `else` block, but how do we implement the keyword-based search? We’ll leave\
    \ that as an exercise for you to complete. You can use traditional search techniques\
    \ like full-text search to implement the keyword-based search logic. Combining\
    \ both search methods allows you to create a hybrid search system that provides\
    \ users with a comprehensive search experience tailored to their needs.\n\n##\
    \ Key Takeaways\n\nIn this chapter, we explored optimization techniques, including\
    \ weighted ranking, intelligent stop-word removal, and hybrid search, to enhance\
    \ the relevance and performance of our search service. We’ve built a system that\
    \ better aligns with user intent by combining vector similarity with external\
    \ signals, refining query precision, and flexibly routing between keyword and\
    \ vector methods.\n\nHere are the key takeaways:\n\n* Dynamic metrics like recency\
    \ and popularity can be calculated and stored in the database to create a more\
    \ nuanced ranking system, ensuring users see timely and relevant results.\n* Preprocessing\
    \ user queries with stop-word removal enhances the quality of vector embeddings\
    \ and reduces computational overhead.\n* Exception handling and preserved phrases\
    \ during stop-word removal ensure that critical context is not lost, maintaining\
    \ the intent of the user’s query.\n* Hybrid search systems allow seamless integration\
    \ of both vector-based and keyword-based methods, offering flexibility for diverse\
    \ user requirements.\n* A modular utility for stop-word removal ensures reusable,\
    \ maintainable code that adapts to evolving application needs.\n* Routing queries\
    \ dynamically based on predefined criteria simplifies the hybrid search implementation\
    \ while keeping the user experience intuitive and efficient.\n\nYou’ve now built\
    \ a refined and efficient vector search system focused on accuracy, relevance,\
    \ and user experience. Next, we’ll wrap up our time together by exploring practical\
    \ applications built with vector search today.\n\nCopyright © 2025, The Pragmatic\
    \ Bookshelf.\n\n# Chapter 11 Practical Applications and Next Steps\n\nIn this\
    \ book we’ve explored the fundamentals of vector search and learned how to build\
    \ a vector search system from scratch. We’ve covered many topics, from understanding\
    \ vector embeddings and setting up the environment to implementing vector generation\
    \ services and creating vector search indexes. We’ve also discussed incorporating\
    \ search functionality into applications, optimizing search results, and testing\
    \ and monitoring the system for performance and reliability.\n\nAs we conclude\
    \ this journey, it’s essential to reflect on the key takeaways and consider the\
    \ future of vector search technology. The search field is rapidly evolving, driven\
    \ by advancements in machine learning, artificial intelligence, and natural language\
    \ processing.\n\nFirst, before we explore what’s next, take a moment to celebrate\
    \ how far you’ve come. This technology includes jargon that often intimidates\
    \ newcomers and even seasoned developers. But you’ve made it through the book\
    \ and built a vector search system from scratch. That’s no small feat! As a reminder,\
    \ the source code for the application is available on GitHub,^([[26]](#f_0069.xhtml_FOOTNOTE-26))\
    \ so you can always refer back to it as you continue to explore and learn more\
    \ about vector search. In addition to the GitHub repository, make sure to bookmark\
    \ the web page for the book,^([[27]](#f_0069.xhtml_FOOTNOTE-27)) as it will be\
    \ updated with new resources and information to keep you informed about the latest\
    \ developments in vector search technology.\n\n## Exploring Upcoming New Developments\n"
  raw: 'The first step in building a hybrid search system is to define the criteria
    for when to use vector search versus keyword search. Base these criteria on the
    characteristics of the query and the desired search experience. For example, you
    might consider the following factors:


    *   Query length: Short queries with specific terms indicate a keyword search
    is more appropriate, while longer queries with broader concepts could benefit
    from vector search.


    *   Query structure: The system might trigger keyword searches for queries containing
    specific keywords or phrases, while it could route general terms to vector search.


    *   User preferences: The system could allow users to choose their search method
    and select the approach that best fits their needs.


    You establish a foundation for building a flexible and user-centric hybrid search
    system by defining clear criteria for selecting the search method. These criteria
    will guide the logic that evaluates user queries and determines the appropriate
    search module.


    One important consideration is to resist the urge to overengineer a solution.
    While building a complex system that dynamically switches between search methods
    based on many factors may be tempting, simplicity is often the best approach.
    By focusing on a few key criteria, or even a single criterion, that align with
    user needs and application goals, you can create a hybrid search system that is
    both effective and maintainable.


    To avoid overengineering, we can start with a simple distinction: users either
    perform an exact search—they look for a specific article or author—or do a conceptual
    search based on a topic or idea. While other applications may require more complex
    criteria like query length or structure, this binary approach works well for a
