  trans: "\n\n想象一下你正在写这本书。没错，写正文花费了一些时间，但你成功地完成了一切……突然之间，你遇到了写作瓶颈。你需要为这本书起一个标题，但你无法想出一个既是一个很棒的标题，又符合你出版社书名风格的名字。我当时就是这样，你猜怎么着，我使用向量搜索来帮助我为这本书找到了最合适的标题。\n\
    \n现在你将遵循同样的流程。使用 `OpenAI API`，将为真实的 Pragmatic 书名生成嵌入（embeddings），将它们存储在本地，并与你自己的标题想法进行比较。这个练习在我们解析背后的深层概念之前，为你提供了一种实用且易于上手的参与方式。你只需要一个文件、一个小数据集以及探索的意愿。\n\
    \n## 设置项目\n\n创建一个名为 `name_this_book.js` 的新文件。这个文件将为你完成所有工作：爬取网站、生成嵌入、进行比较并返回顶部匹配项。嵌入是文本的数值表示，能够捕捉其含义和语境。嵌入是本书中的核心概念，我们将随着内容的推进进行更深入地探索它们。\n\
    \n在安装所需的库之前，请确保你已经安装了 Node.js。你可以从官方网站下载它。安装 Node.js 也会安装 `npm`，这是我们在本书中将到的包管理器。\n\
    \n一旦安装好 Node.js，你需要安装几个库：\n\n```bash\nnpm install node-fetch dotenv cheerio\n\
    ```\n\n你需要在本地的 `.env` 文件中一个 OpenAI API 密钥：\n\n```bash\necho \"OPENAI_API_KEY=your-key-here\"\
    \ > .env\n```\n\n## 爬取标题\n\n我们将开始从 Pragmatic Bookshelf 目录中爬取所有标题。他们的网站使用分页，因此我们将遍历所有页面并提取标题、副标题和书籍\
    \ URL。\n\n这是实现该功能的函数：\n\n`[getting_started_with_vector_search/name_this_book.js](http://media.pragprog.com/titles/bgvector/code/getting_started_with_vector_search%2Fname_this_book.js)`\n\
    \n```javascript\nasync function scrapeTitles() {\n  const baseURL = 'https://pragprog.com';\n\
    \  const maxPages = 27;\n  const maxTitles = 50;\n  const allBooks = [];\n\n \
    \ console.log(`Scraping up to ${maxTitles} book titles from Pragmatic Bookshelf...`);\n\
    \n  for (let page = 1; page <= maxPages; page++) {\n    const pageURL = page ===\
    \ 1\n      ? `${baseURL}/titles/`\n      : `${baseURL}/titles/page/${page}`;\n\
    \n    console.log(` - Fetching page ${page}`);\n\n    const res = await fetch(pageURL);\n\
    \    const html = await res.text();\n    const $ = cheerio.load(html);\n\n   \
    \ $('.category-title-container').each((_, el) => {\n      if (allBooks.length\
    \ >= maxTitles) return false;\n      const anchor = $(el).find('a').first();\n\
    \      const title = $(el)\n        .find('.category-title-title b')\n       \
    \ .text()\n        .trim();\n      const subtitle = $(el)\n        .find('.category-title-subtitle')\n\
    \        .text()\n        .trim();\n      const url = anchor.attr('href');\n \
    \     if (title && url) {\n        allBooks.push({ title, subtitle, url });\n\
    \      }\n    });\n\n    if (allBooks.length >= maxTitles) break;\n  }\n\n  const\
    \ unique = Array.from(\n    new Map(allBooks.map(b => [b.url, b])).values()\n\
    \  );\n\n  console.log(`Finished scraping.${unique.length} titles.`);\n  return\
    \ unique;\n}\n```\n\n该函数遍历每一个页面，使用 JavaScript 库 `Cheerio` 解析标题和副标题，并返回一个唯一条目列表。你处理的是真实的\
    \ HTML。爬取通常是混乱的且需要耐心。Pragmatic 目录的结构很干净，但请记住网站可能会改变。这种工作始终是脆弱的。如果网站布局或类名发生变化，你的爬虫可能会崩溃。这意味着你的下游流程（例如生成嵌入或运行比较）可能会在使用不完整或过时的数据上工作。\n\
    \n## 为标题嵌入\n\n接下来，我们将使用 OpenAI 的 `text-embedding-small` 模型为每个完整标题生成嵌入。让我们定义一个辅助函数来生成单个嵌入：\n\
    \n`[getting_started_with_vector_search/name_this_book.js](http://media.pragprog.com/titles/bgvector/code/getting_started_with_vector_search%2Fname_this_book.js)`\n\
    \n```javascript\nasync function getEmbedding(text) {\n  console.log(`Generating\
    \ embedding for \"${text}\"`);\n  try {\n    const res = await fetch('https://api.openai.com/v1/embeddings',\
    \ {\n      method: 'POST',\n      headers: {\n        Authorization: `Bearer ${process.env.OPENAI_API_KEY}`,\n\
    \        'Content-Type': 'application/json',\n      },\n      body: JSON.stringify({\n\
    \        input: text,\n        model: 'text-embedding-small',\n      }),\n   \
    \ });\n\n    if (!res.ok) {\n      console.error(`API request failed with status\
    \ ${res.status}: ${res.statusText}`);\n      return null;\n    }\n\n    const\
    \ data = await res.json();\n\n    if (!data || !data.data || !Array.isArray(data.data)\
    \ || data.data.length === 0) {\n      console.error('Unexpected API response:',\
    \ JSON.stringify(data, null, 2));\n      return null;\n    }\n\n    if (!data.data[0].embedding)\
    \ {\n      console.error('No embedding found in response:', JSON.stringify(data.data[0],\
    \ null, 2));\n      return null;\n    }\n\n    return data.data[0].embedding;\n\
    \  } catch (error) {\n    console.error(`Error generating embedding for \"${text}\"\
    `, error.message);\n    return null;\n  }\n}\n```\n\n然后，使用该函数对所有标题进行嵌入：\n\n`[getting_started_with_vector_search/name_this_book.js](http://media.pragprog.com/titles/bgvector/code/getting_started_with_vector_search%2Fname_this_book.js)`\n\
    \n```javascript\nasync function embedTitles(books) {\n  console.log(\"Generating\
    \ embeddings for all titles...\");\n  const promises = books.map((book, i) =>\
    \ {\n    const fullTitle = book.subtitle\n      ? `${book.title}:${book.subtitle}`\n\
    \      : book.title;\n\n    console.log(` (${i + 1}/${books.length}) ${fullTitle}`);\n\
    \n    return getEmbedding(fullTitle).then(embedding => {\n      book.embedding\
    \ = embedding;\n      return book;\n    });\n  });\n\n  const booksWithEmbeddings\
    \ = await Promise.all(promises);\n  // 过滤掉未能获取嵌入的书籍\n  const validBooks = booksWithEmbeddings.filter(book\
    \ => book.embedding !== null);\n\n  if (validBooks.length < books.length) {\n\
    \    console.log(`Warning: ${books.length - validBooks.length} books failed to\
    \ get embeddings and were excluded.`);\n  }\n}\n```\n\n"
- fmt: "\n| ​� | `return` validBooks; |\n\n| ​� | } |\n\nThis combines the title and\
    \ subtitle (if present) and generates one embedding per book. All embedding requests\
    \ are fired off at the same time and processed in parallel. This speeds things\
    \ up, but if you’re working with large datasets or strict API rate limits, you\
    \ may want to throttle or batch requests instead.\n\nDon’t worry if the process\
    \ still feels mysterious. In the next chapter, we’ll unpack exactly how embeddings\
    \ work and what makes them such a powerful tool for search and recommendation.\n\
    \n## Comparing to Your Title Idea\n\nNow you’ll embed a new title idea and compare\
    \ it to the catalog using cosine similarity. Here’s how we compute similarity\
    \ between vectors:\n\n[getting_started_with_vector_search/name_this_book.js](http://media.pragprog.com/titles/bgvector/code/getting_started_with_vector_search%2Fname_this_book.js)\n\
    \n```javascript\nfunction cosineSimilarity(a, b) {\n  const dot = a.reduce(\n\
    \    (sum, ai, i) => {\n      return sum + ai * b[i];\n    },\n    0\n  );\n \
    \ const magA = Math.sqrt(\n    a.reduce((sum, ai) => {\n      return sum + ai\
    \ * ai;\n    }, 0)\n  );\n  const magB = Math.sqrt(\n    b.reduce((sum, bi) =>\
    \ {\n      return sum + bi * bi;\n    }, 0)\n  );\n  return dot / (magA * magB);\n\
    }\n```\n\nAnd here’s how we find and rank the top matches:\n\n[getting_started_with_vector_search/name_this_book.js](http://media.pragprog.com/titles/bgvector/code/getting_started_with_vector_search%2Fname_this_book.js)\n\
    \n```javascript\nfunction compareTitles(queryEmbedding, books) {\n  console.log('Comparing\
    \ against catalog...');\n  return books\n    .map(book => ({\n      ...book,\n\
    \      similarity: cosineSimilarity(\n        book.embedding,\n        queryEmbedding\n\
    \      ),\n    }))\n    .sort((a, b) => b.similarity - a.similarity)\n    .slice(0,\
    \ 5);\n}\n```\n\n## Putting It All Together\n\nFinally, let’s connect everything.\
    \ This `main()` function runs the entire flow: scrape, embed, store, and compare.\n\
    \n[getting_started_with_vector_search/name_this_book.js](http://media.pragprog.com/titles/bgvector/code/getting_started_with_vector_search%2Fname_this_book.js)\n\
    \n```javascript\nasync function main() {\n  const DATA_FILE = 'pragprog_titles.json';\n\
    \  let books;\n\n  if (fs.existsSync(DATA_FILE)) {\n    console.log(`Loading cached\
    \ data from ${DATA_FILE}...`);\n    books = JSON.parse(fs.readFileSync(DATA_FILE,\
    \ 'utf8'));\n  } else {\n    console.log('No cached data found. Starting fresh.');\n\
    \n    books = await scrapeTitles();\n    books = await embedTitles(books);\n \
    \   fs.writeFileSync(\n      DATA_FILE,\n      JSON.stringify(books, null, 2)\n\
    \    );\n\n    console.log(`Saved ${books.length} books to ${DATA_FILE}`);\n \
    \ }\n\n  const query = process.argv.slice(2).join(' ');\n  if (!query) {\n   \
    \ console.error(\n      'Please pass a proposed title as a command-line argument'\n\
    \    );\n  }\n}\n```\n"
