  trans: "\n\n- 文档数据库：`MongoDB`, `Pinecone`\n- 图谱数据库：`Neo4j`, `TigerGraph`\n- SQL\
    \ 数据库：`Supabase`, `Neon`\n\n每个选项都提供了多种部署方法、定价结构和功能 set，包括托管型和自托管解决方案。虽然全面的对比超出了我们的讨论范围，但我鼓励你探索并选择最符合你需求和预算的选项。\n\
    \n在本书中，我们将使用 `Couchbase` 作为我们选定的数据库。`Couchbase` 优化了高维数据的存储和查询，使其非常适合存储向量嵌入。它还提供了\
    \ `Capella`，这是一个完全托管的云服务，可以一键部署到 `AWS`、`Google Cloud` 或 `Azure`。除了技术能力外，`Capella`\
    \ 还提供了慷慨的免费层级，这对于像这样项目中的实验和学习非常理想。\n\n我们正在使用文档数据库，具体是一个 `JSON` 文档数据库，因为它允许我们处理灵活的半结构化数据。`JSON`（JavaScript\
    \ 对象表示）是一种轻量级且易于阅读的格式，用于以键值对的形式存储数据。它在 Web 开发中被广泛使用，并与基于 `JavaScript` 的工具无缝协作。文档模型使其易于存储和查询各种数据类型，包括向量嵌入、博客文章和用户配置，所有这些格式都与我们正在构建的应用程序结构高度契合。\n\
    \n设置 `Node.js` 项目的下一步是安装必要的依赖项。依赖项是项目正常运行所依赖的外部库或包。\n\n## 安装依赖项\n\n在本节中，我们将为 `Node.js`\
    \ 项目安装依赖项，包括我们将用于与向量数据库交互，以及为博客文章生成并存储嵌入的库和工具。\n\n为了在我们的项目中安装依赖项，我们需要在项目根目录下准备一个\
    \ `package.json` 文件。`package.json` 文件是一个清单文件，包含了关于项目的元数据，包括项目名称、版本、描述和依赖项。它是 `npm`\
    \ 用于安装包包和管理项目依赖项的主要文件。\n\n幸运的是，`npm` 提供了一个可以为你生成 `package.json` 文件的命令。要生成 `package.json`\
    \ 文件，请在项目根目录下运行以下命令：\n\n```\nnpm init -y\n```\n\n`-y` 标志告诉 `npm` 在运行 `npm init`\
    \ 命令时，对通常出现的提示使用默认值。命令执行完成后，它将在终端中输出 `package.json` 文件的结构。它应该类似于以下：\n\n```json\n\
    {\n  \"name\": \"vector-blog-platform\",\n  \"version\": \"1.0.0\",\n  \"description\"\
    : \"\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"test\": \"echo \\\"\
    Error: no test specified\\\" && exit 1\"\n  },\n  \"keywords\": [],\n  \"author\"\
    : \"\",\n  \"license\": \"ISC\",\n  \"dependencies\": {\n    \"ottoman\": \"².5.1\"\
    ,\n    \"openai\": \"⁴.96.2\",\n    \"dotenv\": \"¹⁶.5.0\"\n  }\n}\n```\n\n现在我们已经有了\
    \ `package.json` 文件，可以开始为项目安装依赖项了。我们进展非常顺利！在这个阶段，我们本可以直接列出要安装的依赖项，但那样你就只是在“复制和粘贴”，而不理解你安装了什么。让我们花点时间了解我们将要安装的依赖项以及为什么需要它们。\n\
    \n在安装依赖项时，我们需要考虑应用程序开发的三个领域。数据库是其中之一，正如我们之前讨论的，我们不能使用任何数据库，而是需要一个能够存储、索引和查询向量嵌入的数据库。我们将使用\
    \ `ORM`（或对象关系映射库）来与数据库交互。`ORM` 是一种编程结构，使我们能够像使用面向对象的编程语言一样，使用对象与数据库中的数据进行交互。通过示例可能会更容易理解。\n\
    \n我们在本项目中使用的的大部分库（包括 `OpenAI SDK` 和 `Ottoman`）都执行异步操作。这些操作需要时间——例如查询数据库或发送网络请求——在通常情况下会阻止程序的继续运行。为了处理这个问题，我们将使用\
    \ `JavaScript` 的 `async/await` 语法。`async/await` 允许我们编写看起来和行为上更像普通同步代码的异步代码，使其更容易阅读和维护。在书中，每当我们获取数据、存储嵌入或与外部\
    \ API 交互时，都会看到这种模式。\n\n假设你的应用程序有用户，用户模型可能像所示：\n\n```json\n{\n  \"id\": 1,\n  \"\
    name\": \"John Doe\",\n  \"email\": \"john.doe@example.com\",\n  \"password\"\
    : \"hashed_password\",\n  \"created_at\": \"2024-01-01T00:00:00Z\",\n  \"updated_at\"\
    : \"2024-05-01T00:00:00Z\"\n}\n```\n\n`User` 类表示数据库中的一条用户记录。你可以创建一个新的 `User` 对象，设置其属性并将其保存到数据库中。`ORM`\
    \ 库负责将对象翻译为数据库查询。这是关于 `ORM` 如何工作以及它为什么在应用程序开发中有所帮助的层层概述。\n\n使用 `ORM` 的最大优势之一是它简化了数据查询。与其编写原始查询或复杂的数据库调用，像\
    \ `Ottoman` 这样的 `ORM` 让你使用熟悉的 JavaScript 方法和链式调用来表达你想要的内容。这在查询 `JSON` 文档数据库中常见的嵌套或层次结构数据时特别有用。例如，查找带有特定标签的所有博客文章或根据相似分数检索用户记录，可以使用直观的方法（如带有过滤条件的\
    \ `Model.find()`）完成，`Ottoman` 会在后台将其转换为优化的查询。这不仅提高了可读性，还降低了编写低效或错误查询的风险。\n\n"
- fmt: "\nThe second key step is transforming blog content into vector embeddings,\
    \ allowing us to perform similarity searches. We’ll also transform users’ queries\
    \ into vector embeddings to search the content. The generation of a new embedding\
    \ for every query needs to happen quickly, so we’ll need to consider performance\
    \ and make sure that the process takes as little time as possible. Recent research\
    \ into user behavior shows that 40 percent of users will leave a website if a\
    \ response takes more than three seconds to load.([[12]](#f_0037.xhtml_FOOTNOTE-12))\
    \ That’s a lot of pressure, so we need to ensure the platform we choose and the\
    \ SDK we build with can handle the load.\n\nThe transformation of the content\
    \ into embeddings can happen at the time of content creation, so we’ll also need\
    \ to establish criteria for when to update embeddings as authors add new content.\
    \ For example, does every edit warrant a revised embedding? Or only certain edits?\
    \ These are questions we’ll need to answer as we build out the functionality of\
    \ the blog platform. For now, it’s safe to say that a single typo correction probably\
    \ shouldn’t trigger a new embedding generation. Or should it? We’ll leave that\
    \ for later on as we discuss optimizing search results and other more advanced\
    \ topics.\n\nThe last application management area we’ll rely on is environment\
    \ variables. Environment variables are set outside your application to configure\
    \ it at runtime. They store sensitive data, such as API keys or database connection\
    \ strings, keeping this information out of your codebase. Using environment variables\
    \ makes your application secure and easily configurable across different environments.\n\
    \nI would be remiss if I didn’t mention the obligatory security warning. When\
    \ working with environment variables, it’s important that you do not commit sensitive\
    \ information to your version control system. Always add your environment variables\
    \ to a `.env` file and include that file in your `.gitignore` to prevent it from\
    \ being committed. This will help keep your sensitive information secure during\
    \ development.\n\nFor production environments, however, storing secrets in a `.env`\
    \ file is not recommended. Instead, use a secure method such as injecting environment\
    \ variables from a secrets manager at runtime or reading them from a mounted secrets\
    \ location provided by your cloud platform or container orchestration system.\
    \ This adds an extra layer of protection and ensures your secrets are handled\
    \ safely in production.\n\nWith that background on the why and what of our dependencies,\
    \ let’s specify the dependencies we’ll be installing for our project. We’ll be\
    \ using the following libraries and tools to build our blog platform:\n\n*   `Ottoman.js`:\
    \ A Node.js ORM library (to be more precise, an ODM library since we are working\
    \ with JSON documents for our data and not a relational model) for Couchbase that\
    \ will allow us to interact with the Couchbase database using objects.\n*   `OpenAI\
    \ Node.js SDK`: The official Node.js SDK for the `OpenAI` API that will allow\
    \ us to generate vector embeddings for the content and user queries in our blog\
    \ platform.\n*   `dotenv`: A zero-dependency module that loads environment variables\
    \ from a `.env` file into `process.env` to keep our sensitive information secure.\n\
    \nTo install these three dependencies, you can run the following command in the\
    \ root directory of your project:\n\n```\nnpm install ottoman openai dotenv\n\
    ```\n\nYou can verify that `npm` installed the dependencies correctly by checking\
    \ the `package.json` file or by running the following command:\n\n```bash\nnpm\
    \ list\n```\n\nUpon running `npm list`, you’ll see an output similar to this one:\n\
    \n```\nvector-blog-platform@1.0.0 /path/to/your/project\n  ├── dotenv@16.4.5\n\
    \  ├── openai@4.58.2\n  └── ottoman@2.5.0\n```\n\nThis output shows the dependencies\
    \ were installed successfully and are now available for use in your project. With\
    \ the dependencies installed, you are now ready to start building out the functionality\
    \ of your blog platform!\n\n## Key Takeaways\n\nIn this chapter, you laid the\
    \ groundwork for building a vector search application by setting up your development\
    \ environment and preparing the tools and structure needed to support vector embedding\
    \ workflows.\n\nHere’s a quick summary of what you’ve accomplished so far and\
    \ what to carry forward as we begin implementing vector search in your application:\n\
    \n*   You set up your development environment by installing Node.js, scaffolding\
    \ your project structure, and selecting a suitable vector database.\n*   You learned\
    \ that vector embeddings are unstructured, high-dimensional data that require\
    \ specialized indexing to enable fast and accurate search.\n*   You explored the\
    \ types of databases that can store vector data, including document, graph, and\
    \ relational databases, and understood why document databases are a strong fit.\n\
    *   You installed and configured core dependencies, including an ORM (`Ottoman`),\
    \ the `OpenAI` SDK for embedding generation, and `dotenv` for environment variable\
    \ management.\n\nIn the next chapter, we’ll begin implementing the search functionality\
    \ in our Node.js application. We’ll cover how to query our vector database for\
    \ similar embeddings and return relevant results to the user.\n\n## Footnotes\n\
    \n[[8]](#f_0034.xhtml_FNPTR-8)\n[https://github.com/gothinkster/realworld](https://github.com/gothinkster/realworld)\n\
    [[9]](#f_0034.xhtml_FNPTR-9)\n[https://codebase.show/projects/realworld](https://codebase.show/projects/realworld)\n\
    \n[[10]](#f_0034.xhtml_FNPTR-10)\n[https://github.com/hummusonrails/vector-example-blog-platform](https://github.com/hummusonrails/vector-example-blog-platform)\n\
    \n[[11]](#f_0035.xhtml_FNPTR-11)\n[https://cloud.couchbase.com](https://cloud.couchbase.com)\n\
