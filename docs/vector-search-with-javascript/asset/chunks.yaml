    In this implementation, we connect to the Couchbase cluster, access the target
    bucket and scope, and construct a vector search request using couchbase.VectorSearch.fromVectorQuery.
    This method takes the embedding field name and the query embedding as inputs.
    We specify how many top candidates to return (in this case, 5) and execute the
    query using scope.search. Results are mapped and ranked by similarity score before
    being returned to the user.


    A single call to the vector search index now replaces the manual dot product logic
    we previously implemented. Here’s a breakdown of the updated process:


    *   Initialize search by setting up a Couchbase cluster connection and accessing
    the target bucket and scope.


    *   Construct and send vector query using VectorQuery, then execute it on the
    “embeddings” field via the vector search index.


    *   Retrieve and map results from the top five matches based on similarity score,
    extracting articleId and similarityScore.


    *   Sort and return results in descending order by similarity before sending them
    back to the caller.


    This streamlined flow shows how embedding-based search brings more meaning to
    user queries. Instead of relying on exact term matches, vector search enables
    semantic relevance by comparing embeddings across stored documents. The VectorQuery
    interface hides much of the operational complexity, letting developers focus on
    what they want to retrieve rather than how to retrieve it.


    Scoping the search to a specific bucket and scope keeps the query efficient and
    ensures it operates only on the intended dataset. This design avoids unnecessary
    overhead and aligns well with how NoSQL JSON document databases organize data.


    Because results include both content identifiers and similarity scores, they can
    be ranked and filtered based on relevance. This makes vector search a strong fit
    for use cases like personalized recommendations, semantic filtering, and natural
    language search all within a consistent and scalable interface.


    ## Key Takeaways


    This chapter shifted from manual similarity calculations to a more sustainable,
    performant, and advanced approach: creating a vector search index within a data
    platform like Couchbase. While the previous chapter introduced us to the fundamentals
    of vector search, this chapter took it further by leveraging a NoSQL database’s
    capabilities to handle these operations efficiently. By offloading the search
    calculations to the database, we simplified our back end and optimized the search
    service’s performance, transforming it into a scalable solution ready for production.


    Here are the key takeaways:


    *   Setting up a vector search index reduces back-end complexity by managing similarity
    calculations at the database level.


    *   The integration with Couchbase allows us to handle large datasets seamlessly,
    making the service faster and more reliable.


    *   Leveraging Ottoman.js for query management keeps the codebase clean and modular,
    supporting future growth and scalability.


    Looking ahead, we’ll build on this foundation by integrating user-facing features
    into our back end, such as finishing the search API to make the vector search
    functionality accessible within our application. Our search service will be robust,
    user-friendly, and production-ready by the end.


