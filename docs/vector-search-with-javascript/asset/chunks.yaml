  trans: '


    ![Search Index Query Flow](img/search_index_query_flow.png "Search Index Query
    Flow")


    搜索索引的核心优势在于其速度。系统并不是实时扫描每一条数据，而是将查询向量与搜索索引中预构建的索引向量进行比较。这种比较正是相似性度量（如点积或余弦相似度）大显身场。这些指标衡量了向量之间的对齐程度，这反映了文档与查询之间的语义相似性。


    系统计算这些相似分并按相关性对文档进行排序。相似分较高的文档出现在搜索结果的最顶部，确保用户首先收到最相关的内容。


    现在我们已经了解了什么是向量搜索索引以及它是如何工作的，让我们开始使用 Couchbase 和 Ottoman.js 来构建一个吧。


    ## 创建向量搜索索引


    在继续之前，确保你已经向你的博客平台添加了至少几篇文章并为它们生成了嵌入（embeddings）。如果你还没有这样做，可以创建原始文章或使用你现有的任何内容。请遵循
    RealWorld 项目的文章规范以确保兼容性。


    只有当向量嵌入已保存到 Couchbase 中，向量搜索索引才能工作。有关如何执行此操作的详细信息，请参阅第 7 章，*创建向量搜索服务*。


    本节将使用 `cbshell` 命令行界面在 Couchbase 中创建一个向量搜索索引。我们将设置索引使用点积作为相似性度量，允许我们高效地在数据库中搜索相似向量。


    首先，什么是 `cbshell`？它是一个让你从终端与数据库交互的命令行工具。处理数据的其他方法包括使用 Web 界面或 IDE 扩展。然而，当你已经处于终端时，使用
    CLI 工具可以让你方便地执行任务，而无需切换上下文。


    设置 `cbshell` 相对简单。你需要为它提供指向你的集群和身份验证信息的配置详情。一旦设置完成，你就可以运行命令与数据库交互。在这种情况下，获取这些配置信息最快的方法是在浏览器中登录你的
    Couchbase Capella 账户并按照几个步骤操作。让我们在继续之前确保已设置好。


    ### 获取 cbshell 的配置详情


    要获取配置详情，请导航到你的 Couchbase Capella 账户并按照以下步骤操作：


    在集群详情的仪表板视图中，点击 Connect 按钮。你会看到一个类似下面的页面：


    ![Couchbase Capella Connect Screen](img/capella_connect_screen.png "Couchbase
    Capella Connect Screen")


    你会注意到左侧导航栏上有一个 Couchbase Shell 链接。那就是你接下来要去的地方。点击该链接。


    CLI 随后会提供配置 `cbshell` 配置文件的选项，例如使用哪个集群凭据。一旦你选择了所需的凭据，请复制配置详情并将其粘贴到安装 CLI 工具后创建的
    `.cbsh` 文件夹内名为 `config` 的新文件中。


    ![Couchbase Capella Shell Configuration Screen](img/capella_cbshell_config_screen.png
    "Couchbase Capella Shell Configuration Screen")


    最后，在配置文件中，将密码的占位符替换为你的实际密码。


    现在设置已完成，你可以使用 `cbshell` CLI 进行所有的数据库交互了。


    ### 创建向量搜索索引


    一旦我们使用 `cbshell` 创建了新的向量搜索索引，我们就可以从代码库中移除手动点积计算了。将相似性计算交给数据库将使我们的搜索操作更高效、更具扩展性。


    你可能会问自己，为什么我们不从这种方法开始。学习某事物如何工作的最好方法之一是从第一原理开始。通过手动构建点积计算，你可能已经更深入地理解了底层是如何运作的。现在我们已经有了这种理解，可以利用
    Couchbase 的内置功能来处理这个问题。


    让我们开始吧，首先打开 CLI：


    ```bash

    ./cbsh

    ```


    你应该会看到类似这样的提示：


    ```bash

    >

    ```


    通过调用 `buckets` 命令，你可以运行一个快速测试命令，检查一切是否已设置好并按预期工作。`buckets` 命令将返回集群中桶的列表：


    ```bash

    > buckets

    ```


    如果一切正常，你将在类似下面的输出中看到你的桶。如果不是，或者你遇到了任何问题，你可能需要重新检查配置设置。


    ```text

    | ───┬─────────┬───────────────┬───────────┬──────────┬ |

    | # │ cluster │ name │ type │ replicas │ |

    | ───┼─────────┼───────────────┴───────────┴────────┼ |

    | 0 │ default │ beer-sample │ couchbase │ 1 │ |

    | 1 │ default │ default │ couchbase │ 1 │ |

    | 2 │ default │ targetBucket │ couchbase │ 0 │ |

    | 3 │ default │ travel-sample │ couchbase │ 1 │ |

    ```


    既然我们已经确认 `cbshell` 按预期工作，我们现在可以创建向量搜索索引了。创建新向量索引的命令是 `vector create-index`。该命令本身需要我们提供的几个参数——即存储嵌入的桶名称、要使用的相似性度量、我们想要创建的索引名称、包含嵌入的字段名称以及嵌入的维度数。


    由于我们要使用点积作为相似性度量来创建应用程序，我们将使用以下命令创建索引：


    ```bash

    vector create-index \

    --bucket bucket_name \

    --similarity-metric dot_product \

    vector-search-index embedding 1536

    ```


    在此命令中，将 `name_of_your_bucket` 替换为存储嵌入的桶名称。`vector-search-index` 是我们要创建的索引名称，`embedding`
    是包含嵌入的字段名称，`1536` 是嵌入的维度数。维度数应匹配你为文档创建嵌入时使用的的大小。


    你可以通过查询所有索引来进行快速检查，以确保索引已创建，你应该能在列表中看到新索引：


    ```bash

    query indexes

    ```


    就是这样！你已经成功使用 `cbshell` 在 Couchbase 中创建了向量搜索索引。该索引允许你通过将相似性计算的密集任务交给数据库，更高效地执行相似性搜索。让我们使用
    Couchbase Node SDK 和 Ottoman.js 将此索引集成到我们的应用程序中。这部分涉及删除代码，这总是很有趣趣的！


