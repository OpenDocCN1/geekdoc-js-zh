    \ idx) => acc + curr * vectorB[idx], 0\n  );\n};\n\nexport { dotProduct };\n```\n\
    \n`dotProduct` 函数接收两个向量，检查它们的长度是否相同，然后使用 `reduce` 方法将相应的元素相乘并求和结果。得到的值是两个向量的点积，这有助于我们衡量查询嵌入与存储的文章嵌入之间的相似性。与我们之前实现的代码一样，我们还引入了一个新的自定义错误类\
    \ `VectorLengthError`，以处理向量长度不相同的情况。再次，打开 `utils\\` 目录下的 `errorHandlers.js` 文件，在现有错误类之后添加以下代码，并确保在导出语句中添加了\
    \ `VectorLengthError`：\n\n[creating_vector_search_service/errorHandlers.js](http://media.pragprog.com/titles/bgvector/code/creating_vector_search_service%2FerrorHandlers.js)\n\
    \n```javascript\nclass VectorLengthError extends Error {\n  constructor(message)\
    \ {\n    super(message);\n    this.name = 'VectorLengthError';\n    Error.captureStackTrace(this,\
    \ this.constructor);\n  }\n}\n```\n\n当 `getAllStoredEmbeddings` 和 `dotProduct`\
    \ 函数都就绪后，系统现在就可以计算用户查询与存储文章之间的相似性，并将点积作为相关性的衡量标准。\n\n我们已经成功实现了使用点积作为相似性指标进行向量搜索的所有后端功能！这是一个回首并感谢你所进展的好时刻。\n\
    \n## 核心要点\n\n在本章中，你构建了向量搜索。以下是核心要点：\n\n*   通过点积，你改变了搜索。\n*   通过嵌入，你支持了搜索。\n* \
    \  你增加了自定义错误以确保搜索的可靠性。\n*   接下来，我们将关注索引。\n\nCopyright © 2025, The Pragmatic Bookshelf.\n\
    \n## 理解搜索索引\n\n在构建向量搜索索引之前，让我们回退一步，了解什么是搜索索引以及它为什么如此重要。\n\n搜索索引可以被视为数据库快速查找数据的路线图。与其扫描整个数据集来查找信息（随着数据集的增长，这可能会变得缓慢且低效），索引可以帮助数据库直接跳转到内容。它像一个高效的目录或索引，使搜索变得快得多。\n\
    \n对于传统数据库，索引通常使用键或特定字段（如标题或标签）构建，以使搜索更高效。然而，我们不仅仅是在寻找精确匹配。我们正在尝试寻找与给定查询在概念或语义上相似的数据。这就是向量搜索索引用用场。\n\
    \n在底层，向量搜索索引使用智能快捷径来避免逐个比较每一个向量。它们不是使用暴力破解法，而是使用分组或组织向量的方法来加速搜索。\n\n某些索引使用树形结构将数据拆分为较小的部分，这样搜索就可以集中在最有可能找到匹配项的地方。其他索引则使用类似于哈希的方法，将相似的向量分到桶中。第三种方法将向量连接成某种路线图或图，系统可以快速地从一个邻近向量移动到另一个，逐步接近最佳匹配。\n\
    \n这些技术的目标都是减少所需的比较次数。结果是更快速、更具可扩展性的搜索。当你运行查询时，索引利用这些快捷径快速找到少量候选结果，然后根据相似性对它们进行排名。\n\
    \n让我们来看展示向量搜索索引流程的图表，如所示。\n\n"
- fmt: '

    ![Search Index Query Flow](images/mermaid_graphs/search_index_query_flow.png "Search
    Index Query Flow")


    The key advantage of a search index is its speed. Instead of scanning through
    every piece of data in real time, the system compares the query vector against
    the pre-built indexed vectors in the search index. This comparison is where similarity
    metrics, such as the dot product or cosine similarity, come into play. These metrics
    measure how closely aligned the vectors are, which translates to how semantically
    similar the documents are to the query.


    The system computes these similarity scores and ranks the documents by relevance.
    Documents with higher similarity scores appear at the top of the search results,
    ensuring that users receive the most relevant content first.


    Now that we understand what a vector search index is and how it works, let’s start
    building one using Couchbase and Ottoman.js.


    ## Creating a Vector Search Index


    Before continuing, make sure you’ve added at least a few articles to your blog
    platform and generated embeddings for them. If you haven’t done this yet, you
    can either create original articles or use any existing content of yours. Follow
    the article spec from the RealWorld project to ensure compatibility.


    The vector search index will only work if vector embeddings are already saved
    in Couchbase—refer back to Chapter 7, *Creating a Vector Search Service*, for
    details on how to do this.


    This section will create a vector search index in Couchbase using the `cbshell`
    command-line interface. We’ll set up the index to use the dot product as the similarity
    metric, allowing us to search for similar vectors in our database efficiently.


    First of all, what is `cbshell`? It’s a command-line tool that allows you to interact
    with your database from the terminal. Other ways to work with your data include
    using a web interface or an IDE extension. However, when you’re already in the
    terminal, using a CLI tool allows you to conveniently perform tasks without switching
    contexts.


    Setting up `cbshell` is relatively straightforward. You need to provide it with
    configuration details pointing to your cluster and authentication information.
    Once you have that set up, you can run commands to interact with your database.
    In this case, the fastest way to get that configuration information is to log
    in to your Couchbase Capella account in a browser and follow a few steps. Let’s
    make sure that’s set up before we proceed.


    ### Fetching Configuration Details for cbshell


    To get your configuration details, navigate to your Couchbase Capella account
    and follow these steps:


    Click the Connect button from the dashboard view inside your cluster details.
    You’ll see a page similar to this:


    ![Couchbase Capella Connect Screen](images/capella_connect_screen.png "Couchbase
    Capella Connect Screen")


    You’ll notice a Couchbase Shell link on the left-hand navigation bar. That’s where
    you should go next. Click that link.


    The CLI then presents options to configure your `cbshell` configuration file,
    such as which cluster credential to use. Once you’ve selected your desired credentials,
    copy the configuration details and paste them into a new file named `config` inside
    the `.cbsh` folder created after installing the CLI tool.


    ![Couchbase Capella Shell Configuration Screen](images/capella_cbshell_config_screen.png
    "Couchbase Capella Shell Configuration Screen")


    Finally, in the configuration file, replace the placeholder value for your password
    with your actual password.


    Now that your setup is complete, you can use the `cbshell` CLI for all your database
    interactions.


    ### Creating a Vector Search Index


    Once we’ve created the new vector search index using `cbshell`, we can remove
    the manual dot product calculation from our codebase. Offloading the similarity
    calculations to the database will make our search operations more efficient and
    scalable.


    You may be asking yourself why we didn’t start with this approach. One of the
    best ways to learn how something works is to start from the first principles.
    By building the dot product calculation manually, you’ve hopefully gained a deeper
    understanding of how it all works under the hood. Now that we have that understanding,
    we can leverage Couchbase’s built-in capabilities to handle this.


    Let’s go ahead and do it by first opening up the CLI:


    ```bash

    ./cbsh

    ```


    You should see a prompt like this:


    ```bash

    >

    ```


    By invoking the `buckets` command, you can run a quick test command to see if
    everything is set up and working as expected. The `buckets` command will return
    the list of buckets in your cluster:


    ```bash

    > buckets

    ```


    If all is good, you’ll see your buckets listed in an output similar to the one
    that follows. If not, or if you encounter any issues, you may need to revisit
    your configuration settings.


    ```text

    | ───┬─────────┬───────────────┬───────────┬──────────┬ |

    | # │ cluster │ name │ type │ replicas │ |

    | ───┼─────────┼───────────────┴───────────┴────────┼ |

    | 0 │ default │ beer-sample │ couchbase │ 1 │ |

    | 1 │ default │ default │ couchbase │ 1 │ |

    | 2 │ default │ targetBucket │ couchbase │ 0 │ |

    | 3 │ default │ travel-sample │ couchbase │ 1 │ |

    ```


    We can create our vector search index now that we’ve confirmed that `cbshell`
    is working as expected. The command to create a new vector index is `vector create-index`.
    The command itself takes several arguments we will need to provide—namely, the
    name of the bucket where the embeddings are stored, the similarity metric to use,
    the name of the index we wish to create, the name of the field containing the
    embeddings, and the number of dimensions in the embeddings.


    Since we’re creating our application using dot product as the similarity metric,
    we’ll use the following command to create the index:


    ```bash

    vector create-index \

    --bucket bucket_name \

    --similarity-metric dot_product \

    vector-search-index embedding 1536

    ```


    In this command, replace `name_of_your_bucket` with the bucket’s name where your
    embeddings are stored. The `vector-search-index` is the name of the index we’re
    creating, `embedding` is the name of the field containing the embeddings, and
    `1536` is the number of dimensions in the embeddings. The number of dimensions
    should match the size of the embeddings you used when you created the embeddings
    for the documents in your database.


    You can perform a quick check to ensure the index was created by querying for
    all the indexes, and you should see the new index in the list:


    ```bash

    query indexes

    ```


    That’s it! You’ve successfully created a vector search index in Couchbase using
    `cbshell`. This index will allow you to perform similarity searches more efficiently
    by offloading the heavy lifting of similarity calculations to the database. Let’s
    integrate this index into our application using the Couchbase Node.js SDK and
    Ottoman.js. This part involves deleting code, which is always fun!


    ## Integrating the Vector Search Index


    We’ll continue to use the Couchbase Node SDK and Ottoman.js to interact with the
    database and query the vector search index. By leveraging Ottoman.js, we can simplify
    the process of building and executing queries, making it easier to work with our
    vector search index.

    '
