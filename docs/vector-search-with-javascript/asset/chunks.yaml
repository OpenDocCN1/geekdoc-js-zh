    # Chapter 5


    Structuring the Back End for Vector Search


    It’s time to implement one of the core features of vector search. In earlier chapters,
    we discussed how embeddings represent documents in a high-dimensional space and
    allow us to compare meaning across content. Now let’s start writing real application
    code to support that functionality.


    We’ll extend the Real World Project,^([[16]](#f_0041.xhtml_FOOTNOTE-16)) an open
    source Medium.com clone with an existing API spec. The project already includes
    user accounts, posts, tags, and comments. You’ll build on top of that by adding
    vector search to power more relevant content discovery.


    You’re at a key point in your vector search journey. Let’s get started!


    ## Introduction to the Back-End Architecture


    To support vector embeddings and search, we’ll add a new services/ folder to the
    existing back-end structure. This is where we’ll place logic for calling external
    APIs, such as OpenAI’s embedding endpoint, and for running similarity queries.


    This keeps embedding logic separate from routes and controllers, aligning with
    back-end best practices. Here’s what the updated folder structure looks like:


    | ​  | vector-blog-platform/ |


    | ​  | ├── api/ |


    | ​  | ├── config/ |


    | ​  | ├── controllers/ |


    | ​  | ├── middleware/ |


    | ​  | ├── models/ |


    | ​  | ├── routes/ |


    | ​  | ├── services/ # New folder |


    | ​  | ├── views/ |


    If you want to explore or follow along with the full codebase, you can find it
    on GitHub.^([[17]](#f_0041.xhtml_FOOTNOTE-17))


    ## Creating Data Models for the Platform'
