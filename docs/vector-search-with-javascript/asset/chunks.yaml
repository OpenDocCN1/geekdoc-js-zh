    | ​  | ); |


    | ​  |  |


    | ​  | ​**return**​ searchResults; ​*// Return ranked results*​ |


    | ​  | } ​**catch**​ (error) { |


    | ​  | console.error( |


    | ​  | ​*''Error performing similarity search:''*​, error |


    | ​  | ); |


    | ​  | ​**throw**​ error; |


    | ​  | } |


    | ​  | }; |


    | ​  |  |


    | ​  | ​**export**​ { performSearch }; |


    The primary change we need to make is to introduce new functionality that only
    returns the articles most similar to the user query. Before, we needed to fetch
    all of the embeddings and calculate the dot product for each one. Now, we can
    query the vector search index in Couchbase to return only the most relevant documents.
    This shift provides a considerable performance improvement.


    [creating_vector_search_index/performSearch.js](http://media.pragprog.com/titles/bgvector/code/creating_vector_search_index%2FperformSearch.js)


    | ​  | ​**import**​ { getCluster } ​**from**​ ​*''../clients/couchbaseClient''*​;
    |


