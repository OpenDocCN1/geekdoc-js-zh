    \ - 第二个向量。\n * @returns {number} - 两个向量的点积。\n */\nconst dotProduct = (vectorA,\
    \ vectorB) => {\n  if (vectorA.length !== vectorB.length) {\n    throw new VectorLengthError('Vectors\
