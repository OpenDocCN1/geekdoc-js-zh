  trans: "\n\n构建混合搜索系统的第一步是定义何时使用向量搜索与何时使用关键词搜索的标准。这些标准应基于查询的特征和预期的搜索体验。例如，你可能考虑以下因素：\n\
    \n*   查询长度：带有特定术语的短查询表明关键词搜索更合适，而具有更广泛概念的长查询则可能受益于向量搜索。\n*   查询结构：系统可能会对包含特定关键词或短语的查询触发关键词搜索，而将通用术语路由到向量搜索。\n\
    *   用户偏好：系统允许用户选择自己的搜索方法，并选择最符合其需求的方法。\n\n通过定义选择搜索方法的清晰标准，你为构建灵活且以用户为中心的混合搜索系统奠定了基础。这些标准将引导评估用户查询并确定合适搜索模块的逻辑。\n\
    \n一个重要的考虑是抵制过度工程设计解决方案的冲动。虽然构建一个能够根据许多因素在搜索方法之间动态切换的复杂系统可能很有吸引，但简单往往是最佳方法。通过专注于与用户需求和应用目标对齐的几个关键标准（甚至是一个标准），你可以创建一个既有效又易于维护的混合搜索系统。\n\
    \n为了避免过度设计，我们可以从一个简单的区分开始：用户要么执行精确搜索——他们寻找特定的文章或作者——要么基于主题或想法进行概念搜索。虽然其他应用程序可能需要更复杂的标准（如查询长度或结构），但这种二分方法对于博客平台非常好，并提供了一个实用的起点。\n\
    \n### 将查询路由到相应的搜索模块\n\n定义好方法选择标准后，我们现在可以实现将查询路由到相应搜索模块的逻辑。我们将区分精确搜索和概念搜索，以决定使用向量搜索还是关键词搜索。\n\
    \n为了实现这一点，我们将更新 `searchController.js` 文件中的 `performSearch` 函数，以评估查询将其路由到正确的搜索模块。以下是文件的更新部分，带有伪代码描述在何处实现混合切换逻辑：\n\
    \n[optimizing_search_results/performSearch_with_search_method_routing.js](http://media.pragprog.com/titles/bgvector/code/optimizing_search_results%2FperformSearch_with_search_method_routing.js)\n\
    \n```javascript\n// 根据查询类型确定搜索方法\nconst searchMethod = cleanedQuery.includes('\"\
    ') ? 'exact' : 'conceptual';\n\nlog.debug(`Detected search method: ${searchMethod}`);\n\
    \ntry {\n  // 将查询路由到相应的搜索模块\n  if (searchMethod === 'exact') {\n    // 执行基于关键词的搜索\n\
    \    // 在此处实现关键词搜索逻辑\n  } else {\n    // 执行基于向量的搜索\n    // 在此处实现向量搜索逻辑\n  }\n\
    }\n// 返回搜索结果\nreturn res.status(200).json({ results: [], count: 0 });\n```\n\n\
    在更新后的代码段中，我们首先使用 `processQuery` 工具对查询进行预处理以去除停用词。然后评估清理后的查询，根据其是否包含引号（表示精确搜索）来确定搜索方法（表示概念搜索）。系统将搜索方法存储在\
    \ `searchMethod` 变量中，并将查询路由到相应的搜索模块。\n\n我们知道如何在 `else` 块中完成基于向量的搜索，但如何实现基于关键词的搜索呢？我们将此留给你完成。你可以使用全文搜索等传统搜索技术来实现关键词搜索逻辑。结合这两种搜索方法可以让你创建一个混合搜索系统，为用户提供量身定制的全面搜索体验。\n\
    \n## 核心总结\n\n在本章中，我们探索了优化技术，包括加权排名、智能停用词移除和混合搜索，以增强我们搜索服务的相关性和性能。我们通过结合向量相似性与外部信号、精炼查询精度以及在关键词和向量方法之间灵活路由，构建了一个更符合用户意图的系统。\n\
    \n以下是核心要点：\n\n*   时效性和流行度等动态指标可以在数据库中进行计算并存储，以创建一个更细致的排名系统，确保用户看到及时且相关的结果。\n*\
    \   使用停用词移除对用户查询进行预处理可以提高向量嵌入的质量并减少计算开销。\n*   停用词移除过程中的异常处理和保留短语确保确保了关键语境不丢失，从而维持用户查询的意图。\n\
    *   混合搜索系统允许基于向量和基于关键词的方法无缝集成，为多样化的用户需求提供了灵活性。\n*   用于停用词移除的模块化工具确保了代码的可重用和维护性，能够适应不断变化的应用需求。\n\
    *   根据预定义的标准动态路由查询简化了混合搜索的实现，同时保持了用户体验的直观和高效。\n\n你现在建立了一个专注于准确性、相关性和用户体验的精炼且高效的向量搜索系统。接下来，我们将通过探索今天向量搜索构建的实际应用来结束我们的合作。\n\
    \nCopyright © 2025, The Pragmatic Bookshelf.\n\n# 第 11 章 实际应用与后续步骤\n\n在书中，我们探索了向量搜索的基础知识，并学习了如何从零构建向量搜索系统。我们涵盖了许多主题，从理解向量嵌入和设置环境到实现向量生成服务以及创建向量搜索索引。我们还讨论了将搜索功能整合到应用程序中、优化搜索结果以及对系统的性能和可靠性进行测试和监控。\n\
    \n结束这段旅程之际，回顾核心要点并考虑向量搜索技术的未来至关重要。搜索领域在机器学习、人工智能和自然语言处理进步的推动下正在快速演进。\n\n首先，在探索后续之前，请花点时间庆祝你所取得的成就。这项技术包含了许多让初学者甚至资深开发者都感到畏惧的术语。但你读完了这本书并从零构建了一个向量搜索系统。这不是一项小事举！提醒一下，应用程序的代码可以在\
    \ GitHub 上获取^([[26]](#f_0069.xhtml_FOOTNOTE-26))，因此在你继续探索和学习更多向量搜索知识时，可以随时查阅。除了\
    \ GitHub 仓库外，请务必收藏书的网页^([[27]](#f_0069.xhtml_FOOTNOTE-27))，它将更新新的资源和信息，让你了解向量搜索技术的最新进展。\n\
    \n## 探索即将出现的新进展\n\n"
- fmt: 'The field of vector search is rapidly evolving, with new techniques, algorithms,
    and tools emerging regularly. As you continue your journey, staying informed about
    these advancements will help ensure your systems remain efficient, relevant, and
    competitive.


    ## The Promise of Federated Learning


    Federated learning trains models across multiple devices or institutions without
    centralizing the data. Instead of sending raw data to a central server, it shares
    only model updates, preserving user privacy.


    This opens the door for privacy-preserving personalization in vector search. A
    phone could, for instance, train a model locally on a user’s preferences without
    transmitting private data. This model can then inform more relevant and secure
    search results.


    To learn more, check out TensorFlow Federated, Google’s illustrated overview,
    and recent research exploring federated learning for advanced query processing.


    ## Advancements in Vector Quantization


    Vector quantization reduces the size of vector representations, enabling faster
    similarity calculations. Recent innovations in locally adaptive vector quantization
    (`LVQ`) optimize this process by dynamically adjusting granularity based on data
    density.


    This technique is especially valuable for real-time applications like fraud detection
    and recommendation engines. For a deeper dive, see Qdrant’s intro, a `PyTorch`
    library for experimentation, Intel’s scalable implementation, and a hands-on tutorial
    from GeeksForGeeks.


    ## Searching Offline First


    Offline-first search prioritizes functionality even in low- or no-connectivity
    environments. By storing indexes locally and syncing with the server when possible,
    applications can remain usable and responsive regardless of network conditions.


    Learn more from the Offline-First GitHub project, a tutorial on vector search
    on `iOS`, and an article on edge-based search with `Couchbase Mobile`.


    ## Taking a Look at Real-World Use Cases


    Vector search transforms industries by enabling smarter, faster, and more relevant
    search experiences. Its flexibility allows teams to apply it across various fields,
    from financial services to entertainment. In this section, we’ll explore three
    distinct use cases that illustrate the power of vector search in real-world scenarios.
    Each example highlights how vector search solves critical business challenges,
    drives innovation, and creates value for organizations.


    ### Fraud Detection in Financial Services


    Fraud prevention is a top priority for financial institutions, where the stakes
    are high and the window to detect and respond to threats is narrow. Revolut, a
    leading Fintech company, uses vector search to power its fraud detection system,
    `Sherlock`.


    `Sherlock` analyzes real-time transaction patterns and identifies anomalies that
    could indicate fraudulent behavior. The system converts each transaction into
    a vector, capturing features like amount, merchant, location, and time. It compares
    these vectors to historical patterns and flags transactions as fraudulent if a
    match suggests suspicious behavior, often within 50 milliseconds.


    Vector search, machine learning, and an optimized database architecture deliver
    this speed. `Couchbase` stores user and merchant profiles, enabling fast retrieval
    and real-time responses. The team continually updates `Sherlock` with new models
    to stay ahead of emerging threats.


    ### Personalized Music Content Recommendations


    Spotify, a global leader in music streaming, uses vector search to power its recommendation
    engine. Personalized playlists like `Discover Weekly` and `Release Radar` rely
    on vector embeddings that represent both users and content.


    User vectors are built from listening habits, liked songs, and playlist interactions.
    Content vectors represent musical traits like genre, tempo, and artist similarity.
    Spotify compares these vectors in real time to surface highly relevant music and
    podcast recommendations.


    This dynamic recommendation system keeps users engaged while showcasing vector
    search’s performance and personalization benefits.


    ### Enhanced Customer Support


    Zendesk, a major player in the customer-support software space, leverages vector
    search to improve its knowledge base and ticket-resolution systems.


    When a customer submits a support ticket or searches the help center, their query
    is converted into a vector and matched against support content. This semantic
    similarity approach returns relevant results even when the query uses a language
    different from the stored content.


    For example, a question like “How do I reset my password?” might return documents
    titled “Password Recovery Steps” or “Account Login Help.” Delivering semantically
    relevant results in this way leads to faster resolution times, improved customer
    satisfaction, and reduced agent workload.


    You have made it to the end of this journey, and that is no small achievement.
    You’ve navigated complex ideas, implemented practical code, and built a fully
    functioning vector search system from scratch. Whether you’re a seasoned developer
    or new to this domain, you now have the tools, understanding, and confidence to
    integrate vector search into real-world projects. Please take a moment to appreciate
    how far you’ve come; you’ve earned it.


    Whether holding a physical copy of this book or reading a digital edition, the
    content here represents a final, committed version. However, your journey with
    vector search doesn’t end here! The resources shared represent a final, committed
    version. However, your journey with vector search doesn’t end here! The resources
    shared represent a final, committed version. However, your journey with vector
    search doesn’t end here!

