    | ​  | ​*"name"*​: ​*"John Doe"*​, |


    | ​  | ​*"email"*​: ​*"john.doe@not_a_real_email.com"*​, |


    | ​  | ​*"password"*​: ​*"hashed_password"*​, |


    | ​  | ​*"created_at"*​: ​*"2024-01-01T00:00:00Z"*​, |


    | ​  | ​*"updated_at"*​: ​*"2024-05-01T00:00:00Z"*​ |


    | ​  | } |


    If you’re working with a relational database, you’d have a User table in your
    database that would parallel the structure of a user, whereas if you’re working
    with a document database, you’d have user documents, one for each user, that would
    likewise parallel the structure of a user. Now, this is where the benefit of an
    ORM comes in. The focus of this book is not about ORMs, but we need to take a
    moment together to understand how an ORM can simplify the process of interacting
    with databases, regardless of the type of database you’re using.


    In the example of the User model, you’d have somewhere in your codebase a User
    class that would look something like this:


    [building_the_foundation_for_vector_search/example_user_class.js](http://media.pragprog.com/titles/bgvector/code/building_the_foundation_for_vector_search%2Fexample_user_class.js)


    | ​  | ​**class**​ User { |


    | ​  | ​**constructor**​(id, name, email, password, created_at, updated_at) {
    |


    | ​  | ​**this**​.id = id; |


    | ​  | ​**this**​.name = name; |


    | ​  | ​**this**​.email = email; |


    | ​  | ​**this**​.password = password; |


    | ​  | ​**this**​.created_at = created_at; |


    | ​  | ​**this**​.updated_at = updated_at; |


    | ​  | } |


    | ​  | } |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ User; |


    The User class represents a user record in your database. You can create a new
    User object, set its properties, and save it to the database. The ORM library
    handles translating the object into a database query. This is a high-level overview
    of how an ORM works and why it can be helpful in application development.


    One of the biggest advantages of using an ORM is how it simplifies querying data.
    Rather than writing raw queries or complex database calls, an ORM, like Ottoman,
    lets you use familiar JavaScript methods and chaining to express what you’re looking
    for. This is especially helpful when querying nested or hierarchical data common
    in JSON document databases. For example, finding all blog posts with a certain
    tag or retrieving user records based on a similarity score can be done using intuitive
    methods like Model.find() with filter conditions, which Ottoman translates into
    optimized queries behind the scenes. This not only improves readability but also
    reduces the risk of writing inefficient or incorrect queries.'
