    # Chapter 11


    Practical Applications and Next Steps


    In this book we’ve explored the fundamentals of vector search and learned how
    to build a vector search system from scratch. We’ve covered many topics, from
    understanding vector embeddings and setting up the environment to implementing
    vector generation services and creating vector search indexes. We’ve also discussed
    incorporating vector search functionality into applications, optimizing search
    results, and testing and monitoring the system for performance and reliability.


    As we conclude this journey, it’s essential to reflect on the key takeaways and
    consider the future of vector search technology. The search field is rapidly evolving,
    driven by advancements in machine learning, artificial intelligence, and natural
    language processing. Researchers and engineers constantly develop new techniques
    and algorithms to improve search accuracy, relevance, and efficiency.


    First, before we explore what’s next, take a moment to celebrate how far you’ve
    come. This technology includes jargon that often intimidates newcomers and even
    seasoned developers. But you’ve made it through the book and built a vector search
    system from scratch. That’s no small feat! As a reminder, the source code for
    the application is available on GitHub,^([[26]](#f_0069.xhtml_FOOTNOTE-26)) so
    you can always refer back to it as you continue to explore and learn more about
    vector search. In addition to the GitHub repository, make sure to bookmark the
    web page for the book,^([[27]](#f_0069.xhtml_FOOTNOTE-27)) as it will be updated
    with new resources and information to keep you informed about the latest developments
    in vector search technology.


    The world of vector search continues to evolve, driven by advancements in machine
    learning, artificial intelligence, and computational efficiency. As we conclude
    this book, let’s turn our attention to the future of vector search and its exciting
    possibilities.


    ## Exploring Upcoming New Developments'
