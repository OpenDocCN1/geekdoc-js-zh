    ### Defining the Other Models


    As mentioned near the start of this chapter, the blog platform holds models for
    users, articles, comments and tags. The Article model is the centerpiece of the
    vector search process, as it will hold the vector embeddings the platform creates.
    The rest of the models are vital to the platform but not as relevant to the focus
    of our exploration. Here’s a brief overview of each of the other models. The full
    code for each model can be found at the GitHub repository for the project.


    *   The User model can author articles, follow other users, and favorite articles.
    These relationships may later help personalize vector search results if you wish
    to extend the functionality you’ve learned in this book to create filters to search
    by followed users’ articles or favorited articles.


    *   Comments are associated with articles and written by users. While they’re
    not directly embedded or indexed for vector search, they add contextual richness
    that could later be used in further enhancements with hybrid search strategies.


    *   Tags are used to categorize articles and support basic filtering. Since we
    won’t generate or store vector embeddings for tags, we don’t need to expand upon
    them further here.


    With this high-level understanding of the supporting models in place, we can now
    shift our focus back to preparing the back end to generate and persist vector
    embeddings where they matter most—in the articles themselves.


    ### Connecting Articles to the Database


    To generate and store embeddings, we need a back end that can persist data reliably
    and respond to embedding service calls efficiently. In our case, we’re using Couchbase
    as the underlying database and Ottoman.js as the ODM (Object Document Mapper)
    to interact with it.


    Ottoman makes it easy to model documents in JavaScript and handle relationships
    between entities like users, articles, and tags. But before we can use it in our
    models or service logic, we need to configure a shared connection instance to
    the Couchbase cluster.


    Let’s set that up now.


    Create a new file called couchbaseClient.js in a new subfolder named clients inside
    the services/ directory. This file will hold our shared Couchbase connection logic
    and expose a configured Ottoman instance that other parts of the app can reuse.


