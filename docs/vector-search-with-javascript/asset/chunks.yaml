  trans: "\n\n- **流行度**：考虑浏览量、点赞或分享等指标，以突出那些引起用户极大兴趣的文章。\n\n这些信号共同增强了向量相似性评分，创建了一个既考虑概念相关性又考虑用户驱动的平衡排名系统。\n\
    \n### 计算和存储排名指标\n\n在将新鲜性和流行度集成到我们的搜索排名之前，我们必须为数据库中的每篇文章计算并存储这些指标。让我们从新鲜性开始。你可以根据文章的发布日期推导出此指标。我们将新鲜性表示为文章发布以来的天数，并进行反向缩放，使得较新的文章具有更高的分数，例如：\n\
    \n| | `recency = max_days - (current_date - publication_date)` |\n\n在这里，`max_days`\
    \ 是一个代表被认为相关的最大时间范围的常量（例如一年为 365 天）。超过此范围的文章新鲜性分将为 0。为了计算此值，我们将如下所示更新数据模型中的逻辑：\n\
    \n`/optimizing_search_results/updated_article_model.js`\n\n```javascript\nArticleSchema.pre('save',\
    \ function (next) {\n  const currentDate = new Date();\n  const maxDays = 365;\n\
    \  const publicationDate = this.publicationDate || currentDate;\n\n  this.recency\
    \ = Math.max(\n    0,\n    maxDays - Math.floor(\n      (currentDate - publicationDate)\
    \ / (1000 * 60 * 60 * 24)\n    )\n  );\n\n  next();\n});\n```\n\n接下来，让我们处理流行度。此指标可以根据互动数据计算，例如文章获得的浏览次数或点赞次数。为了简单起见，我们将流行度定义为这些因素的加权和：\n\
    \n| | `popularity = (0.7 * views) + (0.3 * likes)` |\n\n与新鲜性类似，我们将在文章文档中计算并存储此值。每当文章被查看或点赞时，我们将根据应用程序的需求，使用事件驱动的方法或定期批量更新过程来更新其流行度评分。我们将由你在应用程序中实现这部分用户互动跟踪。\n\
    \n一旦这些字段集成到数据库中，我们的文章将拥有三个关键指标：`similarity_score`、`recency` 和 `popularity`，它们可用于对搜索结果进行排名。有了这些字段，我们就为在搜索\
    \ API 中引入加权排名奠定了基础。\n\n### 在搜索 API 中集成加权排名\n\n在有了必要的字段后，我们可以修改搜索 API 以纳入加权排名。让我们重新回顾排名公式：\n\
    \n| | `final_score = (0.7 * similarity_score) + (0.2 * recency) + (0.1 * popularity)`\
    \ |\n\n让我们用通俗易懂的语言解释这个公式。`final_score` 是三个组件的加权和：`similarity_score`、`recency`\
    \ 和 `popularity`。`similarity_score` 是首要因素，占了最终总评分的 70%。新鲜度和流行度分别贡献了 20% 和 10%。这种分布确保了向量相似性仍然是主要的排名因素，而新鲜度和流行度提供了额外的上下文。\n\
    \n根据你的应用程序的具体需求调整这些权重。例如，如果新鲜度比流行度更关键，你可以增加其在公式中的权重。关键在于尝试不同的权重，以找到最符合用户需求的平衡点。\n\
    \n要实现这一点，我们将更新控制器的 `performSearch` 方法。\n\n`/optimizing_search_results/updated_performSearch.js`\n\
    \n```javascript\nimport asyncHandler from 'express-async-handler';\nimport { Query,\
    \ getDefaultInstance } from 'ottoman';\n\nconst performSearch = asyncHandler(async\
    \ (req, res) => {\n  const { query } = req.body;\n\n  if (!query || typeof query\
    \ !== 'string') {\n    return res.status(400).json({\n      message: 'Search query\
    \ is required and must be a string',\n    });\n  }\n\n  const searchQuery = new\
    \ Query(\n    {\n      where: {\n        embedding: {\n          $search: query,\n\
    \          metric: 'dot_product',\n        },\n      },\n    }\n  )\n  .sort({\
    \ final_score: -1 })\n  .limit(10)\n  .build();\n\n  const ottoman = getDefaultInstance();\n\
    \  const { rows } = await ottoman.query(searchQuery);\n\n  res.status(200).json({\n\
    \    results: rows.map((row) => ({\n      id: row.id,\n      title: row.title,\n\
    \      description: row.description,\n      final_score: row.final_score,\n  \
    \  })),\n    count: rows.length,\n  });\n});\n\nexport { performSearch };\n```\n\
    \n在这里，`final_score` 是使用存储的 `similarity`、`recency` 和 `popularity` 值计算出的。\n\n"
- fmt: "\nYou’ll find many different ways to implement this logic, but the following\
    \ simple example will get you started.\n\n[`optimizing_search_results/stopWordProcessor.js`](http://media.pragprog.com/titles/bgvector/code/optimizing_search_results%2FstopWordProcessor.js)\n\
    \n```javascript\nconst preservedPhrases = [\n  \"how to\",\n  \"learn to\",\n\
    \  \"step by step\",\n];\nconst stopWords = new Set([\n  \"a\",\n  \"an\",\n \
    \ \"the\",\n  \"is\",\n  \"of\",\n  \"on\",\n  \"to\",\n  \"in\",\n  \"for\",\n\
    \  \"by\",\n  \"with\",\n  \"and\",\n  \"or\",\n]);\n\n/**\n * Processes a query\
    \ string by removing stop words and preserving key phrases.\n * @param {string}\
    \ query - The raw query string from the user.\n * @returns {string} - The processed\
    \ query string.\n */\nconst processQuery = (query) => {\n  if (typeof query !==\
    \ \"string\") {\n    throw new Error(\"Query must be a string\");\n  }\n  // Normalize\
    \ the query to lowercase for consistent processing\n  const normalizedQuery =\
    \ query.toLowerCase();\n  // Check for preserved phrases\n  for (const phrase\
    \ of preservedPhrases) {\n    if (normalizedQuery.includes(phrase)) {\n      //\
    \ Return the original query if a preserved phrase is found\n      return query;\n\
    \    }\n  }\n  // Tokenize the query into words\n  const words = query.split(/\\\
    s+/);\n  // Filter out stop words, preserving all non-stop words\n  const filteredWords\
    \ = words.filter((word) => !stopWords.has(word.toLowerCase()));\n  // Reconstruct\
    \ the query string\n  const cleanedQuery = filteredWords.join(\" \");\n  return\
    \ cleanedQuery;\n};\n\nexport { processQuery };\n```\n\nLet’s break this code\
    \ example down in plain English. The `processQuery` function takes a raw user\
    \ query as input and returns a cleaned query string. It first normalizes the query\
    \ to lowercase for consistent processing. It then checks for predefined preserved\
    \ phrases in the query. If the function finds a preserved phrase, it returns the\
    \ original query to maintain its integrity. If it doesn’t find preserved phrases,\
    \ it tokenizes the query into individual words and filters out any stop words.\
    \ The function then reconstructs the remaining words into a cleaned query string\
    \ and returns it to the caller.\n\nAs we mentioned, by doing this preprocessing\
    \ work at the earliest stage of query handling, we ensure that all the subsequent\
    \ operations, from embedding generation to database queries, benefit from cleaner\
    \ and more precise input. Preprocessing at this stage is critical in enhancing\
    \ the relevance and accuracy of our search results. As an additional significant\
    \ benefit, reducing the size of the query embedding can also reduce computational\
    \ overhead, which, depending on how you’ve architected your system, can save on\
    \ machine resources and cost.\n\n### Incorporating Stop-Word Removal in the Search\
    \ Pipeline\n\nOnce you implement the utility, incorporate it into the search API\
    \ pipeline. Run the preprocessing step before transforming the query string into\
    \ a vector embedding to ensure the system uses the cleaned query in subsequent\
    \ operations.\n\nTo achieve this, modify the `performSearch` function in the `searchController.js`\
    \ file to use the `processQuery` utility. Here’s the updated code:\n\n[`optimizing_search_results/performSearch_with_search_method_routing.js`](http://media.pragprog.com/titles/bgvector/code/optimizing_search_results/performSearch_with_search_method_routing.js)\n\
    \n```javascript\nimport asyncHandler from 'express-async-handler';\nimport { Query\
    \ } from 'query';\nimport Logger from '../config/logger';\nimport { processQuery\
    \ } from '../services/stopWordProcessor';\n\nconst log = Logger.child({ namespace:\
    \ 'searchController' });\n\nconst performSearch = asyncHandler(async (req, res)\
    \ => {\n  const { query } = req.body;\n\n  // Validate the presence of the query\n\
    \  if (!query || typeof query !== \"string\") {\n    log.debug('Invalid or missing\
    \ query');\n    return res.status(400).json({\n      message: 'Search query is\
    \ required and must be a string',\n    });\n  }\n\n  log.debug(`Received raw query:\
    \ ${query}`);\n\n  // Preprocess the query to remove stop words\n  const cleanedQuery\
    \ = processQuery(query);\n  log.debug(`Cleaned query: ${cleanedQuery}`);\n\n \
    \ // Determine the search method based on query type\n  const searchMethod = cleanedQuery.includes(\"\
    \ \") ? 'exact' : 'conceptual';\n  log.debug(`Detected search method: ${searchMethod}`);\n\
    \n  try {\n    // Route the query to the appropriate module\n    if (searchMethod\
    \ === 'exact') {\n      // Perform keyword-based search\n      // Implement keyword\
    \ search here\n    } else {\n      // Perform vector-based search\n      // Implement\
    \ vector search here\n    }\n\n    // Return search results\n    return res.status(200).json({\
    \ results: [], count: 0 });\n  } catch (error) {\n    log.error(error, 'Error\
    \ performing search');\n    return res.status(500).json({\n      message: 'An\
    \ error occurred while processing the search',\n    });\n  }\n});\n\nexport {\
    \ performSearch };\n```\n"
