    \n这一切都是在所谓的“高维数据”基础上运行的。高维数据意味着每个项目由许多数值特征描述（有时是数百个甚至数千个），而不是仅仅两个或三个。\n\n这就是向量搜索的核心思想：将事物表示为共享空间中的数字，并衡量它们之间的距离。但在你看到这些数字是如何运作之前，这可能会感觉很抽象。\n\
    \n让我们来简化一下。暂时忘记高维空间。假设我们正在比较颜色。我们可以使用红、绿、蓝的 RGB 值来描述一种颜色。这三个数字组成了一个向量。蓝色是 `[0,\
    \ 0, 255]`，红色是 `[255, 0, 0]`，黄色是 `[255, 255, 0]`，依此类推。如果你有一个新颜色，比如石板蓝（`[91, 124,\
    \ 153]`），你可以将它与已知颜色进行比较，看看它最接近什么。\n\n这正是我们对书名所做的。唯一的区别在于维度。我们处理的不是 RGB 那样的 3 个数字，而是\
    \ 1536 个数字。但目标是相同的：将每个项目表示为一个向量，然后找到最近的一个。\n\n当你看到标题 `Learning Vector Search with\
    \ JavaScript` 生成了顶级匹配项，如 `A Common-Sense Guide to Data Structures and Algorithms\
    \ in JavaScript` 和 `Machine Learning in Elixir` 时，你就看到了实际操作。系统并没有匹配精确的单词。它是在比较高维向量，并在数百个抽象特征中寻找模式。指向相似方向的向量被判断为更加相似。\n\
    \n那么是什么产生了这些向量呢？我们如何从原始文本变为捕捉含义的数字？这就是嵌入大显用场的地方。\n\n## 解析嵌入的概念\n\n文本比颜色更复杂。你需要一种方法为标题或段落生成向量，使得两个含义相似的文本在向量空间中产生彼此接近的点。一种常用技术是创建所谓的“嵌入”（embedding）。\n\
    \n嵌入是一个长数字列表。每个数字代表由机器学习模型提取的特征。如果你使用 OpenAI 的嵌入模型，每个向量都有 1536 维。你可以将这些想象为巨大坐标空间中的轴。\n\
    \n目标是让意义相似的文本具有相似的嵌入。例如，“Learning JavaScript”（学习 JavaScript）和“Mastering JavaScript”（精通\
    \ JavaScript）这两个短语在向量空间中应该彼此，因为它们共享相同的内容和教育意图。“Exploring Ruby”（探索 Ruby）这样的短语可能接近，因为它具有相似的结构和目的。但像“Deploying\
    \ Kubernetes at Scale”（大规模部署 Kubernetes）这样的短语就会远得多，尽管它也描述了一种技术技能，但因为它属于完全不同的领域。\n\
    \n你通过将文本输入预训练模型来创建嵌入。该模型已经通过在海量数据集上的训练学习了语言是如何运作的。它将自己所知的一切压缩到一组内部权重中。当你传入新文本时，它会产生一个捕捉输入关键层面的向量。这个过程现在可能像一个黑盒，但我们将逐步揭开它的神秘。\n\
    \n## 理解相似性\n\n一旦你有了嵌入，下一个问题就是如何比较它们。换句话说，你如何判断哪些向量是彼此靠近的？\n\n为了比较嵌入，我们需要一种衡量两个向量之间相似程度的方法。最常见的方法是余弦相似度（衡量向量之间的角度，不考虑其大小）和点积（同时考虑它们的方向和幅度）。余弦相似度回答了“这些向量指向相同的方向吗？”，而点积增加了一个问题：“那个信号有多强？”\n\
    \n为了让它更具象化，想象正在比较水果。假设我们使用虚构的 3D 嵌入来表示“苹果”、“香蕉”和“橙子”。这些数字可能反映每种水果的甜度、纤维质或酸度。如果向量很接近，我们就假设水果是相似的。\n\
    \n事实上，让我们计算一下。\n\n[understanding_vector_search/similarity_applies_bananas_oranges.js](http://media.pragprog.com/titles/bgvector/code/understanding_vector_search%2Fsimilarity_applies_bananas_oranges.js)\n\
    \n```javascript\nconst vectors = {\n  Apple: [0.9, 0.1, 0.0],\n  Banana: [0.7,\
    \ 0.3, 0.0],\n  Orange: [0.8, 0.2, 0.1],\n};\n\n/**\n * 计算两个向量的点积。\n * @param\
    \ {Array<number>} vec1 - 第一个向量。\n * @param {Array<number>} vec2 - 第二个向量。\n * @returns\
    \ {number} - 向量的点积。\n */\nconst calculateDotProduct = (vec1, vec2) =>\n  vec1.reduce((sum,\
    \ value, index) => sum + value * vec2[index], 0);\n```\n"
- fmt: "\nEmbeddings are dense vector representations of data that capture the relationships\
    \ between different entities. We use embeddings to represent data, making performing\
    \ operations such as similarity calculations easier. The embeddings capture both\
    \ the semantic and syntactic relationships between entities. For example, in the\
    \ case of words, embeddings can capture relationships such as king is to queen,\
    \ which is a semantic relationship, and king is to kings, which is a syntactic\
    \ relationship.\n\nWhat does that look like in reality? Let’s take the king and\
    \ queen example and show how we represent them as embeddings. In the case of word\
    \ embeddings, the word king might be represented as a vector embedding that looks\
    \ like this:\n\n```\n[\n  0.010183674,\n  -0.003974117,\n  0.0073341774,\n  -0.011770561,\n\
    \  -0.031903327,\n  0.018601075,\n  -0.014723551,\n  -0.03132377,\n  ...\n]\n\
    ```\n\nWhy did I include an ellipsis at the end of the vector? Because the vector\
    \ is much longer than what I’ve shown here! That’s because, depending on the model\
    \ that generates the embeddings, the vector can be of different lengths and are\
    \ usually long.\n\n### Did You Know? Embeddings and Language\n\nEmbeddings are\
    \ widely used in natural language processing (NLP) to represent words and phrases\
    \ in a way that captures their meaning. This helps with challenges like polysemy,\
    \ which are words like `dive` with multiple meanings depending on context. Embeddings\
    \ disambiguate based on usage.\n\nThey also outperform techniques like stemming\
    \ (reducing `jogging, jogged, jogs` to `jog`) and lemmatization (reducing `ran,\
    \ running, runs` to `run`). Rather than relying on rules, embeddings capture these\
    \ relationships naturally by learning from context.\n\nIn this instance, the model\
    \ that generated the word king embedding was `text-embedding-ada-002` from OpenAI.\
    \ The embeddings created by this model have 1,536 dimensions. The number of dimensions\
    \ means that the vector is a list of 1,536 values, each representing a different\
    \ aspect of the word king. In Chapter 9, Incorporating Vector Search Functionality,\
    \ we explore optimizing the embedding results by reducing the vectors’ dimensionality.\
    \ Vector dimensionality reduction is a complex subject since it involves a trade-off\
    \ between the quality of the embeddings and the computational resources required\
    \ to generate them. Yet, it can impact your overall performance and cost efficiency.\n\
    \nThe values represented by each of those floating point numbers represent a different\
    \ semantic and syntactic aspect of the word king. The model that generated the\
    \ embeddings has learned to represent the word king in a way that captures its\
    \ relationships with other words. As we said above, this means king and queen\
    \ will be close together in the vector space, while king and apple will be farther\
    \ apart.\n\n### Did You Know? Embedding vs. Generative Models\n\nEmbedding models\
    \ (like OpenAI’s `Ada`) create dense vector representations of data, capturing\
    \ semantic relationships that are beneficial for search or recommendations. In\
    \ contrast, generative models (like `GPT`) produce content—such as text, images,\
    \ or audio. Both use transformers, but embedding models focus on contextual vector\
    \ creation, whereas generative models generate coherent content sequentially.\n\
    \n## Generating Embeddings with the OpenAI API\n\nYou’re now ready to take your\
    \ first step into working with vector search. Over the past several chapters,\
    \ you’ve explored the concepts behind vectors, vector embeddings, generative and\
    \ embedding models, and more. All this knowledge has equipped you to begin developing\
    \ your first application of vector search. In software development, we aim to\
    \ make things understandable, not mysterious. That’s why we’ve spent this time\
    \ building your understanding so you can build confidence.\n\nAs mentioned earlier,\
    \ we’ll use the OpenAI Embeddings API to generate embeddings. The OpenAI Embeddings\
    \ API is a powerful tool that allows you to generate embeddings for text, images,\
    \ and more. The API is easy to use and well-documented, making it an excellent\
    \ choice for developers new to working with embeddings. In this section, we’ll\
    \ learn how to generate embeddings using the OpenAI API. We’ll explore the various\
    \ options available in the API and how to work with them to create embeddings\
    \ for your data.\n\nOpenAI maintains an official SDK for Node.js, which incorporates\
    \ the functionality of the OpenAI APIs, including the Embeddings API. You install\
    \ the SDK with `npm`, the Node.js package manager, by running the following command:\n\
    \n```\nnpm install openai\n```\n\nIn addition to using the SDK, you can also make\
    \ an API call directly using `cURL`. The OpenAI documentation provides code snippets\
    \ in `cURL`, Node.js, and Python for all of the relevant examples. We’ll use those\
    \ code examples in this book wherever appropriate.\n\nWhether using the SDK or\
    \ making an API call using `cURL`, you’ll still need an API key to authenticate\
    \ your requests. You can obtain an API key by signing up for an account on the\
    \ OpenAI platform. Once you have an API key, you can use it to authenticate your\
    \ requests and access the OpenAI APIs. For the `cURL` request, you’ll need to\
    \ include the API key in the request header. For the Node.js SDK, you’ll provide\
    \ the API key when instantiating a new instance of the `OpenAI` client.\n\nHere’s\
    \ an example request in `cURL` taken from the official documentation; we’ll look\
    \ at each of the parameters in detail:\n\n```bash\ncurl https://api.openai.com/v1/embeddings\n\
    \  -H \"Content-Type: application/json\"\n  -H \"Authorization: Bearer $OPENAI_API_KEY\"\
    \n  -d '{\n    \"input\": \"Your text string goes here\",\n    \"model\": \"text-embedding-3-small\"\
    \n  }'\n```\n\nFirst, we see the API endpoint’s URL, `https://api.openai.com/v1/embeddings`.\
    \ Next, we see the headers in the request. The `Content-Type` header specifies\
    \ that the request body is JSON. The `Authorization` header consists of the API\
    \ key used to authenticate the request. Finally, we see the request body, which\
    \ includes the input text and the model for generating the embeddings. In this\
    \ case, the input text is “Your text string goes here\", and the model is “text-embedding-3-small”.\n\
    \nThe list of available models can also be found in the documentation, and new\
    \ models are introduced from time to time while existing models are updated. In\
    \ effect, the two parameters we need to provide, whether in a `cURL` request or\
    \ the SDK, are `input` and `model`. That same request would look like the following\
    \ using the SDK:\n\n`basics_of_vector_embeddings/first_api_request.js`\n\n```javascript\n\
    const main = async () => {\n  try {\n    const embedding = await openai.embeddings.create({\n\
    \      model: \"text-embedding-ada-002\",\n      input: \"Your text string goes\
    \ here\",\n      encoding_format: \"float\",\n    });\n\n    console.log(embedding.data[0].embedding);\n\
    \    console.log(\"Model used:\", embedding.model);\n    console.log(\"Tokens\
    \ consumed:\", embedding.usage.total_tokens);\n  } catch (error) {\n    console.error(\"\
    Error generating embedding:\", error);\n  }\n};\n\nmain();\n```\n\nDid you notice\
    \ the additional `encoding_format` parameter in the request created with the SDK?\
    \ This parameter is one of two main ones you can use to fine-tune your request\
    \ to fit your needs. Let’s explore them:\n"
  raw: 'Embeddings are dense vector representations of data that capture the relationships
    between different entities. We use embeddings to represent data, making performing
    operations such as similarity calculations easier. The embeddings capture both
    the semantic and syntactic relationships between entities. For example, in the
    case of words, embeddings can capture relationships such as king is to queen,
    which is a semantic relationship, and king is to kings, which is a syntactic relationship.


    What does that look like in reality? Let’s take the king and queen example and
    show how we represent them as embeddings. In the case of word embeddings, the
    word king might be represented as a vector embedding that looks like this:


    | ​  | [ |


    | ​  | 0.010183674, |


    | ​  | -0.003974117, |


    | ​  | 0.0073341774, |


    | ​  | -0.011770561, |


    | ​  | -0.031903327, |


    | ​  | 0.018601075, |


    | ​  | -0.014723551, |


    | ​  | -0.03132377, |


    | ​  | ... |


    | ​  | ] |


    Why did I include an ellipsis at the end of the vector? Because the vector is
    much longer than what I’ve shown here! That’s because, depending on the model
    that generates the embeddings, the vector can be of different lengths and are
    usually long.


    Did You Know? Embeddings and Language


    Embeddings are widely used in natural language processing (NLP) to represent words
    and phrases in a way that captures their meaning. This helps with challenges like
    polysemy, which are words like dive with multiple meanings depending on context.
    Embeddings disambiguate based on usage.


    They also outperform techniques like stemming (reducing jogging, jogged, jogs
    to jog) and lemmatization (reducing ran, running, runs to run). Rather than relying
    on rules, embeddings capture these relationships naturally by learning from context.


    In this instance, the model that generated the word king embedding was text-embedding-ada-002
    from OpenAI.^([[3]](#f_0030.xhtml_FOOTNOTE-3)) The embeddings created by this
    model have 1,536 dimensions. The number of dimensions means that the vector is
    a list of 1,536 values, each representing a different aspect of the word king.
    In Chapter 9, [​*Incorporating Vector Search Functionality*​](#f_0056.xhtml_chp.incorporating_vector_search_functionality),
    we explore optimizing the embedding results by reducing the vectors’ dimensionality.
    Vector dimensionality reduction is a complex subject since it involves a trade-off
    between the quality of the embeddings and the computational resources required
    to generate them. Yet, it can impact your overall performance and cost efficiency.


    The values represented by each of those floating point numbers represent a different
    semantic and syntactic aspect of the word king. The model that generated the embeddings
    has learned to represent the word king in a way that captures its relationships
    with other words. As we said above, this means king and queen will be close together
    in the vector space, while king and apple will be farther apart.


    Did You Know? Embedding vs. Generative Models


    Embedding models (like OpenAI’s Ada) create dense vector representations of data,
    capturing semantic relationships that are beneficial for search or recommendations.
    In contrast, generative models (like GPT) produce content—such as text, images,
    or audio. Both use transformers, but embedding models focus on contextual vector
    creation, whereas generative models generate coherent content sequentially.


    ## Generating Embeddings with the OpenAI API


    You’re now ready to take your first step into working with vector search. Over
    the past several chapters, you’ve explored the concepts behind vectors, vector
    embeddings, generative and embedding models, and more. All this knowledge has
    equipped you to begin developing your first application of vector search. In software
    development, we aim to make things understandable, not mysterious. That’s why
    we’ve spent this time building your understanding so you can build confidence.


    As mentioned earlier, we’ll use the OpenAI Embeddings API to generate embeddings.
    The OpenAI Embeddings API is a powerful tool that allows you to generate embeddings
    for text, images, and more. The API is easy to use and well-documented, making
    it an excellent choice for developers new to working with embeddings. In this
    section, we’ll learn how to generate embeddings using the OpenAI API. We’ll explore
    the various options available in the API and how to work with them to create embeddings
    for your data.


    OpenAI maintains an official SDK for Node.js,^([[4]](#f_0030.xhtml_FOOTNOTE-4))
    which incorporates the functionality of the OpenAI APIs, including the Embeddings
    API. You install the SDK with npm, the Node.js package manager, by running the
    following command:


    | ​  | npm install openai |


    In addition to using the SDK, you can also make an API call directly using cURL.
    The OpenAI documentation^([[5]](#f_0030.xhtml_FOOTNOTE-5)) provides code snippets
    in cURL, Node.js, and Python for all of the relevant examples. We’ll use those
    code examples in this book wherever appropriate.


    Whether using the SDK or making an API call using cURL, you’ll still need an API
    key to authenticate your requests. You can obtain an API key by signing up for
    an account on the OpenAI platform.^([[6]](#f_0030.xhtml_FOOTNOTE-6)) Once you
    have an API key, you can use it to authenticate your requests and access the OpenAI
    APIs. For the cURL request, you’ll need to include the API key in the request
    header. For the Node.js SDK, you’ll provide the API key when instantiating a new
    instance of the OpenAI client.


    Here’s an example request in cURL taken from the official documentation; we’ll
    look at each of the parameters in detail:


    | ​  | curl https://api.openai.com/v1/embeddings ​*\*​ |


    | ​  | -H “Content-Type: application/json” ​*\*​ |


    | ​  | -H “Authorization: Bearer $OPENAI_API_KEY” ​*\*​ |


    | ​  | -d ​*''{*​ |


    | ​  | ​ *“input”: “Your text string goes here”,*​ |


    | ​  | ​ *“model”: “text-embedding-3-small”*​ |


    | ​  | ​ *}''*​ |


    First, we see the API endpoint’s URL, https://api.openai.com/v1/embeddings. Next,
    we see the headers in the request. The Content-Type header specifies that the
    request body is JSON. The Authorization header consists of the API key used to
    authenticate the request. Finally, we see the request body, which includes the
    input text and the model for generating the embeddings. In this case, the input
    text is “Your text string goes here", and the model is “text-embedding-3-small”.


    The list of available models can also be found in the documentation,^([[7]](#f_0030.xhtml_FOOTNOTE-7))
    and new models are introduced from time to time while existing models are updated.
    In effect, the two parameters we need to provide, whether in a cURL request or
    the SDK, are input and model. That same request would look like the following
    using the SDK:


    [basics_of_vector_embeddings/first_api_request.js](http://media.pragprog.com/titles/bgvector/code/basics_of_vector_embeddings%2Ffirst_api_request.js)


    | ​  | ​**const**​ main = ​**async**​ () => { |


    | ​  | ​**try**​ { |


    | ​  | ​**const**​ embedding = ​**await**​ openai.embeddings.create({ |


    | ​  | model: ​*"text-embedding-ada-002"*​, |


    | ​  | input: ​*"Your text string goes here"*​, |


    | ​  | encoding_format: ​*"float"*​, |


    | ​  | }); |


    | ​  |  |


    | ​  | console.log(embedding.data[0].embedding); |


    | ​  | console.log(​*"Model used:"*​, embedding.model); |


    | ​  | console.log(​*"Tokens consumed:"*​, embedding.usage.total_tokens); |


    | ​  | } ​**catch**​ (error) { |


    | ​  | console.error(​*"Error generating embedding:"*​, error); |


    | ​  | } |


    | ​  | }; |


    | ​  |  |


    | ​  | main(); |


    Did you notice the additional encoding_format parameter in the request created
    with the SDK? This parameter is one of two main ones you can use to fine-tune
    your request to fit your needs. Let’s explore them:'
