- fmt: "\nThe code we previously created in `performSearch.js` implements the similarity\
    \ search logic. It currently uses the manual dot product calculation we built\
    \ in `utils/mathUtils.js` to compare the query embedding with the embeddings stored\
    \ in the database. We’ll remove this manual calculation and replace it with a\
    \ query to the vector search index we created in Couchbase.\n\nWe no longer need\
    \ the `utils/mathUtils.js` file now that Couchbase handles vector similarity calculations\
    \ for us. You can safely delete this file to clean up your codebase.\n\nThe new\
    \ function will take the search query embedding from the user as an argument and\
    \ return the most similar documents from the database based on the vector search\
    \ index. Previously, `performSearch` operated in the following manner:\n\n[creating_vector_search_service/performSearch.js](http://media.pragprog.com/titles/bgvector/code/creating_vector_search_service%2FperformSearch.js)\n\
    \n```javascript\nimport { getAllStoredEmbeddings } from './fetchEmbeddings';\n\
    import { dotProduct } from '../utils/mathUtils';\n\n/**\n * Perform similarity\
    \ search by comparing query embedding with stored embeddings.\n * @param {Array}\
    \ queryEmbedding - The query vector embedding.\n * @returns {Promise<Array>} -\
    \ A ranked list of relevant articles based on similarity.\n */\nconst performSearch\
    \ = async (queryEmbedding) => {\n  try {\n    // Fetch all stored embeddings from\
    \ Couchbase\n    const storedEmbeddings = await getAllStoredEmbeddings();\n\n\
    \    // Perform dot product for each article embedding\n    const searchResults\
    \ = storedEmbeddings.map(\n      ({ articleId, embedding }) => {\n        const\
    \ similarityScore = dotProduct(queryEmbedding, embedding);\n        return { articleId,\
    \ similarityScore };\n      }\n    );\n\n    // Rank articles by similarity score\
    \ in descending order\n    searchResults.sort((a, b) => b.similarityScore - a.similarityScore);\n\
    \n    return searchResults; // Return ranked results\n  } catch (error) {\n  \
    \  console.error('Error performing similarity search:', error);\n    throw error;\n\
    \  }\n};\n\nexport { performSearch };\n```\n\nThe primary change we need to make\
    \ is to introduce new functionality that only returns the articles most similar\
    \ to the user query. Before, we needed to fetch all of the embeddings and calculate\
    \ the dot product for each one. Now, we can query the vector search index in Couchbase\
    \ to return only the most relevant documents. This shift provides a considerable\
    \ performance improvement.\n\n[creating_vector_search_index/performSearch.js](http://media.pragprog.com/titles/bgvector/code/creating_vector_search_index%2FperformSearch.js)\n\
    \n```javascript\nimport { getCluster } from '../clients/couchbaseClient';\nimport\
    \ couchbase from 'couchbase';\n\n/**\n * Perform similarity search by comparing\
    \ query embedding with stored embeddings.\n * @param {Array} queryEmbedding -\
    \ The query vector embedding.\n * @returns {Promise<Array>} - A ranked list of\
    \ relevant articles based on similarity.\n */\nconst performSearch = async (queryEmbedding)\
    \ => {\n  try {\n    const cluster = await getCluster();\n    const scope = cluster.bucket('default').scope('_default');\n\
    \    const searchIndex = 'vector-search-index';\n\n    const searchReq = couchbase.SearchRequest.create(\n\
    \      couchbase.VectorSearch.fromVectorQuery(\n        couchbase.VectorQuery.create(\n\
    \          \"default.embedding\", queryEmbedding\n        ).numCandidates(5)\n\
    \      )\n    );\n\n    const result = await scope.search(searchIndex, searchReq);\n\
    \n    return result.rows\n      .map((row) => ({\n        articleId: row.id.replace('embedding::',\
    \ ''),\n        similarityScore: row.score,\n      }))\n      .sort((a, b) =>\
    \ b.similarityScore - a.similarityScore);\n  } catch (error) {\n    console.error('Error\
    \ performing similarity search:', error);\n    throw error;\n  }\n};\n```\n"
