    # Chapter 8


    Creating a Vector Search Index


    In Chapter 7, [​*Creating a Vector Search Service*​](#f_0047.xhtml_chp.creating_vector_search_service),
    we implemented vector search manually using dot product calculations, which gave
    us a solid grasp of the fundamentals. In this chapter, we’ll take the next step
    by integrating Couchbase’s native vector search indexing and using the Ottoman.js
    library to simplify query building. This approach will replace our manual vector
    operations, improving our application’s performance, scalability, and maintainability.


    ## Understanding Search Indexes


    Before we build our vector search index, let’s take a step back and understand
    what a search index is and why it’s so important for optimizing search functionality.


    A search index can be considered a database’s roadmap for quickly finding data.
    Instead of scanning the entire dataset to find relevant information (which can
    be slow and inefficient, especially as the dataset grows), an index helps the
    database jump directly to the appropriate pieces of information. It acts like
    an efficient catalog or table of contents, making it easier for search engines
    or databases to retrieve results much faster.


    For traditional databases, indexes are often built using keys or specific fields,
    like titles or tags, to make search queries more efficient. However, we’re not
    just searching for exact matches in vector search. We’re trying to find data conceptually
    or semantically similar to a given query. This is where a vector search index
    comes in.


    Under the hood, vector search indexes use smart shortcuts to avoid comparing every
    single vector one by one. Instead of brute force, they use methods that group
    or organize vectors to speed up the search.


    Some indexes use tree-like structures that split the data into smaller sections,
    so the search can focus only where it’s most likely to find a match. Others use
    a method similar to hashing, where similar vectors are grouped into buckets. A
    third approach connects vectors into a kind of roadmap or graph, where the system
    can quickly move from one nearby vector to the next, getting closer to the best
    match step by step.


    These techniques all aim to reduce the number of comparisons needed. The result
    is a faster and more scalable search. When you run a query, the index uses these
    shortcuts to quickly find a handful of promising candidates, then ranks them by
    similarity.


    A vector search index optimizes searches that use vector embeddings. Instead of
    manually calculating this similarity between vectors (as we did in Chapter 7,
    [​*Creating a Vector Search Service*​](#f_0047.xhtml_chp.creating_vector_search_service)),
    we can offload this task to a specialized database service, such as Couchbase,
    which can handle these operations much more efficiently.


    Let’s take a look at a diagram that illustrates the flow of a vector search index,
    as [shown](#f_0052.xhtml_fig.ch8.1).'
