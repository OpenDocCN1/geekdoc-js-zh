    # Part 2


    Building a Vector Search Service


    # Chapter 4


    Building the Foundation for Vector Search


    In the last few chapters, you’ve explored the fundamentals of vector search, from
    embeddings and embedding models to neural networks and NLP concepts. Along the
    way, you created vector embeddings. Now it’s time to shift from theory to practice.
    From here on out, we’ll focus on building a real-world application powered by
    vector search.


    In the coming chapters, you’ll gain real experience integrating vector search
    into your application. We’ll cover all aspects of building from the ground up.
    We’ll start with setting up your development environment, learning about the different
    developer tooling we’ll be using, and configuring a vector database to store the
    embeddings that will power the search in your application.


    Ready to get started? Let’s get going!


    ## Scaffolding Your Node.js Project


    Before we dive into scaffolding, it’s helpful to understand the project you’ll
    be building throughout this book. As we discussed in Chapter 2, [​*Understanding
    Vector Search*​](#f_0022.xhtml_chp.understanding_vector_search), vector search
    can have many practical use cases, from anomaly detection to content recommendation
    engines to similarity search. You’ll be creating a fully featured blog platform
    that uses vector search to respond to user queries. Instead of relying on exact
    keyword matches, the search bar will return results based on how closely a query
    semantically aligns with blog post content that will help users discover relevant
    material even when they don’t know the right keywords.'
