  trans: "\n\n现在是时候将我们的设计转换为功能性端点了。我们将遵循现有应用程序的结构，并遵守代码组织、可读性和可维护性的最佳实践。\n\n### 准备搜索路由\n\
    \n实现搜索 API 的第一步是在 `routes/` 目录中添加新路由。该路由将把用于搜索查询的传入 POST 请求重定向到相应的控制器方法。为了与应用程序的其他部分保持一致，我们将在\
    \ `routes/` 目录中创建一个新文件 `searchRoutes.js`。以下是初始路由文件可能包含的内容：\n\n[incorporating_vector_search_functionality/searchRoutes.js](http://media.pragprog.com/titles/bgvector/code/incorporating_vector_search_functionality%2FsearchRoutes.js)\n\
    \n```javascript\nimport express from 'express';\nimport { performSearch } from\
    \ '../controllers/searchController';\n\nconst router = express.Router();\n\n//\
    \ 执行向量搜索的路由\nrouter.post('/', performSearch);\n\nexport default router;\n```\n\
    \n这种设置确保了所有传入的搜索请求都直接路由到 `performSearch` 控制器方法，简化了对搜索功能的访问。\n\n### 创建搜索控制器\n\n\
    接下来，我们在 `controllers/` 目录下的新文件 `searchController.js` 中实现搜索 API 的核心逻辑。该文件将定义 `performSearch`\
    \ 函数，该函数处理传入请求、验证输入并与数据库接口以从向量搜索索引获取结果。\n\n以下是控制器的初始实现：\n\n[incorporating_vector_search_functionality/searchController.js](http://media.pragprog.com/titles/bgvector/code/incorporating_vector_search_functionality%2FsearchController.js)\n\
    \n```javascript\nimport asyncHandler from 'express-async-handler';\nimport { Query,\
    \ getDefaultInstance } from 'ottoman';\nimport { Logger } from '../config/logger';\n\
    \nconst log = Logger.child({ namespace: 'searchController' });\n\nconst performSearch\
    \ = asyncHandler(async (req, res) => {\n  const { query } = req.body;\n\n  //\
    \ 验证 query 输入是否存在\n  if (!query || typeof query !== 'string') {\n    log.debug('Invalid\
    \ or missing search query');\n    return res.status(400).json({\n      message:\
    \ 'Search query is required and must be a string',\n    });\n  }\n\n  log.debug(`Received\
