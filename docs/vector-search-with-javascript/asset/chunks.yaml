    If you ever get stuck at any stage of the book, you can always find the code for
    the entire project we’ll be building on GitHub.^([[10]](#f_0037.xhtml_FOOTNOTE-10))
    At various stages of the process, we’ll refer back to the codebase, so you don’t
    even need to bookmark this page.


    The first step in creating the scaffolding for our Node.js project is to create
    the necessary directories and files. We’ll start by creating a new directory for
    our project and then creating the necessary subdirectories within that directory.
    We’ll need the following directories, starting with the root-level directory for
    our project, which you can name whatever you like, perhaps vector-blog-platform.


    We’ll begin by setting up the back end of our blog platform as an API service.
    To do that, we’ll organize our project into a clear directory structure that separates
    concerns like data storage, embedding logic, and routing. This layout makes it
    easier to expand the app in the future, including adding a front end that you
    can either build yourself or copy from the GitHub repository.


    Go ahead and create the following directories in the root directory of your project:


    *   api/: Contains the core API logic and configuration for the back end, including
    security and database connectivity.


    *   config/: Contains the configuration files for the back end, including environment
    variables and database connection settings.


    *   controllers/: Contains the controller files, which handle requests and responses
    for various routes.


    *   middleware/: Contains custom middleware logic, such as authentication and
    JWT verification.


    *   models/: Contains the model files, which define the structure of the data
    stored in the database.


    *   routes/: Contains route definitions for different endpoints in the application.


    *   views/: Contains the default view rendered by the server if the API service
    is accessed via a web browser.


    When you’ve created all these folders, your folder structure should look like
    the following:


    | ​  | vector-blog-platform/ |


    | ​  | ├── api/ |


    | ​  | ├── config/ |


    | ​  | ├── controllers/ |


    | ​  | ├── middleware/ |


    | ​  | ├── models/ |


    | ​  | ├── routes/ |


    | ​  | ├── views/ |


    You’ve now created the basic folder structure for the project. Throughout the
    book, we’ll be adding files and directories to this structure as we build out
    the functionality of the blog platform. The next steps are to install the necessary
    dependencies for the project and configure the vector database that will store
    the embeddings for the blog posts.


    Before we move on to installing dependencies, it’s a good time to discuss the
    importance of database specialization for vector embeddings and vector search.
    The special nature of vectors means we need to think carefully about efficient
    storage for them that can also provide us with fast querying abilities. In the
    next section, we’ll discuss the considerations you should take into account when
    choosing a database for your project.


    ## Choosing a Vector Database


    You may look at this section title and think to yourself, “Why do I need a special
    database for vector embeddings? Can’t I just use any database?” In the example
    project we’ll be building, we need a database that can handle “regular” data—that
    is, the data that is not vector embeddings, like the blog content, user profiles,
    and similar information, and we also need a database that can store, index, and
    query vector embeddings efficiently. We could separate out those concerns, but
    our intention is to not introduce any additional complexity and to reduce the
    sprawl of our database infrastructure. So we need a database that can handle diverse
    types of data, including structured, unstructured, and semi-structured data.


    Vector embeddings are unstructured data, and they’re also high-dimensional. As
    we discussed in Chapter 2, [​*Understanding Vector Search*​](#f_0022.xhtml_chp.understanding_vector_search),
    high-dimensional means that the embedding has many features to describe the data.
    The OpenAI Ada embedding model has 1,536 dimensions, which means each embedding
    is a list of 1,536 values. This is a lot of data to store and query, especially
    when you consider that we’ll be storing embeddings for every blog post and user
    query! As a result, we also need a database that efficiently handles high-dimensional
    data.


    Optimizing for performance translates to also having the ability to properly index
    the vector embedding data. Indexing vector embeddings means creating a data structure
    that allows for fast retrieval of vectors based on their similarity to a query
    vector. Unlike traditional indexing, which might rely on exact matches (like keyword
    search, as we explained in Chapter 3, [​*Generating Vector Embeddings*​](#f_0027.xhtml_chp.basics_of_vector_embeddings)),
    vector indexing is focused on similarity search, which is to say finding vectors
    that are closest to the query in high-dimensional space.


    We will discuss in detail the mechanics of, and setting up, vector search indexes
    in Chapter 7, [​*Creating a Vector Search Service*​](#f_0047.xhtml_chp.creating_vector_search_service),
    but for now, it’s important to understand that the database we choose must be
    able to handle indexing vector embeddings efficiently. The database must be able
    to create and update indexes quickly, and it must be able to query the indexes
    to return results in a timely manner.


    Now that we have a better understanding of the requirements for our database,
    let’s take a look at the different types of databases that are available for storing
    and querying vector embeddings:


    *   Document databases are databases that store data in a document format, such
    as JSON or XML. Document databases are well suited for storing unstructured data,
    such as vector embeddings, as they do not require a predefined schema. Document
    databases can be optimized for querying and indexing high-dimensional data, making
    them a good choice for storing vector embeddings.


    *   Graph databases are databases that store data in a graph format, with nodes
    representing entities and edges representing relationships between entities. Graph
    databases are well suited for storing and querying complex relationships between
    data, such as the relationships between vector embeddings. Graph databases can
    also optimize querying and indexing of high-dimensional data, making them another
    good choice for storing vector embeddings.


    *   SQL databases are relational databases that store data in tables with rows
    and columns. SQL databases are well suited for storing structured data, such as
    user profiles and blog content, but they can also be used to store vector embeddings.
    While perhaps not the most conventional path to take, they’re nonetheless capable
    of storing and querying vector embeddings.


    Other Database Options


    Many options are available for deploying a database in any one of these three
    categories. What follows is a thoroughly non-exhaustive list of databases that
    you could consider for your project, organized by type of database:'
