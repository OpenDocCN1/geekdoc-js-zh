- fmt: "\nImagine you’re writing this book. Sure, writing the text took a while, but\
    \ you managed to finish everything … when all of a sudden you get writer’s block.\
    \ You need a title for the book, and you can’t figure out what would not only\
    \ be a great title but something that fits in with your publisher’s style of book\
    \ titles. That was me, and guess what, I used vector search to help me come up\
    \ with just the right title for this book.\n\nYou now get to follow that same\
    \ process. Using the `OpenAI API`, you’ll generate embeddings from real Pragmatic\
    \ titles, store them locally, and compare them to a title idea of your own. This\
    \ exercise gives you a practical and approachable way to engage with vector search\
    \ before we unpack the deeper concepts behind it. All you need is one file, a\
    \ small dataset, and a willingness to explore.\n\n## Setting Up the Project\n\n\
    Create a new file named `name_this_book.js`. This file will do everything for\
    \ you: scrape the website, generate embeddings, compare them, and return the top\
    \ matches. Embeddings are numerical representations of text that capture its meaning\
    \ and context. Embeddings are a central concept throughout this book, and we’ll\
    \ explore them in much greater depth as we go.\n\nBefore installing the required\
    \ libraries, make sure you have Node.js installed. You can download it from the\
    \ official website. Installing Node.js will also install `npm`, which is the package\
    \ manager we’ll use throughout this book.\n\nOnce done installing Node.js, you’ll\
    \ need to install a few libraries:\n\n```bash\nnpm install node-fetch dotenv cheerio\n\
    ```\n\nAnd you’ll need an OpenAI API key in a local `.env` file:\n\n```bash\n\
    echo \"OPENAI_API_KEY=your-key-here\" > .env\n```\n\n## Scraping the Titles\n\n\
    We’ll start by scraping all the titles from the Pragmatic Bookshelf catalog. Their\
    \ site uses pagination, so we’ll loop through all pages and extract the title,\
    \ subtitle, and book URL.\n\nHere’s the function to do that:\n\n`[getting_started_with_vector_search/name_this_book.js](http://media.pragprog.com/titles/bgvector/code/getting_started_with_vector_search%2Fname_this_book.js)`\n\
    \n```javascript\nasync function scrapeTitles() {\n  const baseURL = 'https://pragprog.com';\n\
    \  const maxPages = 27;\n  const maxTitles = 50;\n  const allBooks = [];\n\n \
    \ console.log(`Scraping up to ${maxTitles} book titles from Pragmatic Bookshelf...`);\n\
    \n  for (let page = 1; page <= maxPages; page++) {\n    const pageURL = page ===\
    \ 1\n      ? `${baseURL}/titles/`\n      : `${baseURL}/titles/page/${page}`;\n\
    \n    console.log(` - Fetching page ${page}`);\n\n    const res = await fetch(pageURL);\n\
    \    const html = await res.text();\n    const $ = cheerio.load(html);\n\n   \
    \ $('.category-title-container').each((_, el) => {\n      if (allBooks.length\
    \ >= maxTitles) return false;\n      const anchor = $(el).find('a').first();\n\
    \      const title = $(el)\n        .find('.category-title-title b')\n       \
    \ .text()\n        .trim();\n      const subtitle = $(el)\n        .find('.category-title-subtitle')\n\
    \        .text()\n        .trim();\n      const url = anchor.attr('href');\n \
    \     if (title && url) {\n        allBooks.push({ title, subtitle, url });\n\
    \      }\n    });\n\n    if (allBooks.length >= maxTitles) break;\n  }\n\n  const\
    \ unique = Array.from(\n    new Map(allBooks.map(b => [b.url, b])).values()\n\
    \  );\n\n  console.log(`Finished scraping.${unique.length} titles.`);\n  return\
    \ unique;\n}\n```\n\nThis function loops through every page, uses `Cheerio`, a\
    \ JavaScript library, to parse titles and subtitles, and returns a list of unique\
    \ entries. You’re working with real-world HTML. Scraping is often messy and requires\
    \ patience. The structure of Pragmatic’s catalog is clean, but keep in mind that\
    \ websites can change. This kind of work is always fragile. If the site layout\
    \ or class change, your scraper could break. That means your downstream processes,\
    \ like generating embeddings or running comparisons, might be working with incomplete\
    \ or outdated data.\n\n## Embedding the Titles\n\nNext, we’ll use OpenAI’s `text-embedding-small`\
    \ model to generate an embedding for each full title. Let’s define helper function\
    \ to generate a single embedding:\n\n`[getting_started_with_vector_search/name_this_book.js](http://media.pragprog.com/titles/bgvector/code/getting_started_with_vector_search%2Fname_this_book.js)`\n\
    \n```javascript\nasync function getEmbedding(text) {\n  console.log(`Generating\
    \ embedding for \"${text}\"`);\n  try {\n    const res = await fetch('https://api.openai.com/v1/embeddings',\
    \ {\n      method: 'POST',\n      headers: {\n        Authorization: `Bearer ${process.env.OPENAI_API_KEY}`,\n\
    \        'Content-Type': 'application/json',\n      },\n      body: JSON.stringify({\n\
    \        input: text,\n        model: 'text-embedding-small',\n      }),\n   \
    \ });\n\n    if (!res.ok) {\n      console.error(`API request failed with status\
    \ ${res.status}: ${res.statusText}`);\n      return null;\n    }\n\n    const\
    \ data = await res.json();\n\n    if (!data || !data.data || !Array.isArray(data.data)\
    \ || data.data.length === 0) {\n      console.error('Unexpected API response:',\
    \ JSON.stringify(data, null, 2));\n      return null;\n    }\n\n    if (!data.data[0].embedding)\
    \ {\n      console.error('No embedding found in response:', JSON.stringify(data.data[0],\
    \ null, 2));\n      return null;\n    }\n\n    return data.data[0].embedding;\n\
    \  } catch (error) {\n    console.error(`Error generating embedding for \"${text}\"\
    `, error.message);\n    return null;\n  }\n}\n```\n\nThen, use that function to\
    \ embed all the titles:\n\n`[getting_started_with_vector_search/name_this_book.js](http://media.pragprog.com/titles/bgvector/code/getting_started_with_vector_search%2Fname_this_book.js)`\n\
    \n```javascript\nasync function embedTitles(books) {\n  console.log(\"Generating\
    \ embeddings for all titles...\");\n  const promises = books.map((book, i) =>\
    \ {\n    const fullTitle = book.subtitle\n      ? `${book.title}:${book.subtitle}`\n\
    \      : book.title;\n\n    console.log(` (${i + 1}/${books.length}) ${fullTitle}`);\n\
    \n    return getEmbedding(fullTitle).then(embedding => {\n      book.embedding\
    \ = embedding;\n      return book;\n    });\n  });\n\n  const booksWithEmbeddings\
    \ = await Promise.all(promises);\n  // Filter out books that failed to get embeddings\n\
    \  const validBooks = booksWithEmbeddings.filter(book => book.embedding !== null);\n\
    \n  if (validBooks.length < books.length) {\n    console.log(`Warning: ${books.length\
    \ - validBooks.length} books failed to get embeddings and were excluded.`);\n\
    \  }\n}\n```\n"
  raw: 'Imagine you’re writing this book. Sure, writing the text took a while, but
    you managed to finish everything … when all of a sudden you get writer’s block.
    You need a title for the book, and you can’t figure out what would not only be
    a great title but something that fits in with your publisher’s style of book titles.
    That was me, and guess what, I used vector search to help me come up with just
    the right title for this book.


    You now get to follow that same process. Using the OpenAI API, you’ll generate
    embeddings from real Pragmatic titles, store them locally, and compare them to
    a title idea of your own. This exercise gives you a practical and approachable
    way to engage with vector search before we unpack the deeper concepts behind it.
    All you need is one file, a small dataset, and a willingness to explore.


    ## Setting Up the Project


    Create a new file named name_this_book.js. This file will do everything for you:
    scrape the website, generate embeddings, compare them, and return the top matches.
    Embeddings are numerical representations of text that capture its meaning and
    context. Embeddings are a central concept throughout this book, and we’ll explore
    them in much greater depth as we go.


    Before installing the required libraries, make sure you have Node.js installed.
    You can download it from the official website.^([[2]](#f_0021.xhtml_FOOTNOTE-2))
    Installing Node.js will also install npm, which is the package manager we’ll use
    throughout this book.


    Once done installing Node.js, you’ll need to install a few libraries:


    npm install node-fetch dotenv cheerio


    And you’ll need an OpenAI API key in a local .env file:


    echo "OPENAI_API_KEY=your-key-here" > .env


    ## Scraping the Titles


    We’ll start by scraping all the titles from the Pragmatic Bookshelf catalog. Their
    site uses pagination, so we’ll loop through all pages and extract the title, subtitle,
    and book URL.


    Here’s the function to do that:


    [getting_started_with_vector_search/name_this_book.js](http://media.pragprog.com/titles/bgvector/code/getting_started_with_vector_search%2Fname_this_book.js)


    | ​  | ​**async**​ ​**function**​ scrapeTitles() { |


    | ​  | ​**const**​ baseURL = ​*''https://pragprog.com''*​; |


    | ​  | ​**const**​ maxPages = 27; |


    | ​  | ​**const**​ maxTitles = 50; |


    | ​  | ​**const**​ allBooks = []; |


    | ​  |  |


    | ​  | console.log(​*`*​ |


    | ​  | ​ *Scraping up to* ​${maxTitles}​ *book titles from Pragmatic Bookshelf...*​
    |


    | ​  | ​ *`*​); |


    | ​  |  |


    | ​  | ​**for**​ (​**let**​ page = 1; page <= maxPages; page++) { |


    | ​  | ​**const**​ pageURL = page === 1 |


    | ​  | ? ​*`*​${baseURL}​*/titles/`*​ |


    | ​  | : ​*`*​${baseURL}​*/titles/page/*​${page}​*/`*​; |


    | ​  |  |


    | ​  | console.log(​*` - Fetching page* ​${page}​*`*​); |


    | ​  |  |


    | ​  | ​**const**​ res = ​**await**​ fetch(pageURL); |


    | ​  | ​**const**​ html = ​**await**​ res.text(); |


    | ​  | ​**const**​ $ = cheerio.load(html); |


    | ​  |  |


    | ​  | $(​*''.category-title-container''*​).each((_, el) => { |


    | ​  | ​**if**​ (allBooks.length >= maxTitles) ​**return**​ ​**false**​; |


    | ​  | ​**const**​ anchor = $(el).find(​*''a''*​).first(); |


    | ​  | ​**const**​ title = $(el) |


    | ​  | .find(​*''.category-title-title b''*​) |


    | ​  | .text() |


    | ​  | .trim(); |


    | ​  | ​**const**​ subtitle = $(el) |


    | ​  | .find(​*''.category-title-subtitle''*​) |


    | ​  | .text() |


    | ​  | .trim(); |


    | ​  | ​**const**​ url = anchor.attr(​*''href''*​); |


    | ​  | ​**if**​ (title && url) { |


    | ​  | allBooks.push({ title, subtitle, url }); |


    | ​  | } |


    | ​  | }); |


    | ​  |  |


    | ​  | ​**if**​ (allBooks.length >= maxTitles) ​**break**​; |


    | ​  | } |


    | ​  |  |


    | ​  | ​**const**​ unique = Array.​**from**​( |


    | ​  | ​**new**​ Map(allBooks.map(b => [b.url, b])).values() |


    | ​  | ); |


    | ​  |  |


    | ​  | console.log(​*`*​ |


    | ​  | ​ *\nFinished scraping.* ​${unique.length}​ *titles captured.*​ |


    | ​  | ​ *`*​); |


    | ​  |  |


    | ​  | ​**return**​ unique; |


    | ​  | } |


    This function loops through every results page, uses Cheerio, a JavaScript library,
    to parse the titles and subtitles, and returns a list of unique book entries.


    You’re now working with real-world HTML. Scraping is often messy and requires
    patience. The structure of Pragmatic’s catalog is structurally clean, but keep
    in mind that websites can change. This kind of work is always fragile by nature.
    If the site layout or class names change, your scraper could break. That means
    your downstream processes, like generating embeddings or running similarity comparisons,
    might be working with incomplete or outdated data.


    ## Embedding the Titles


    Next, we’ll use OpenAI’s text-embedding-3-small model to generate an embedding
    for each full book title.


    Let’s define a helper function to generate a single embedding:


    [getting_started_with_vector_search/name_this_book.js](http://media.pragprog.com/titles/bgvector/code/getting_started_with_vector_search%2Fname_this_book.js)


    | ​  | ​**async**​ ​**function**​ getEmbedding(text) { |


    | ​  | console.log(​*`Generating embedding for: "*​${text}​*"`*​); |


    | ​  | ​**try**​ { |


    | ​  | ​**const**​ res = ​**await**​ fetch(​*''https://api.openai.com/v1/embeddings''*​,
    { |


    | ​  | method: ​*''POST''*​, |


    | ​  | headers: { |


    | ​  | ​*''Authorization''*​: ​*`Bearer* ​${process.env.OPENAI_API_KEY}​*`*​,
    |


    | ​  | ​*''Content-Type''*​: ​*''application/json''*​, |


    | ​  | }, |


    | ​  | body: JSON.stringify({ |


    | ​  | input: text, |


    | ​  | model: ​*''text-embedding-3-small''*​, |


    | ​  | }), |


    | ​  | }); |


    | ​  |  |


    | ​  | ​**if**​ (!res.ok) { |


    | ​  | console.error( |


    | ​  | ​*`API request failed with status* ​${res.status}​*:* ​${res.statusText}​*`*​
    |


    | ​  | ); |


    | ​  | ​**return**​ ​**null**​; |


    | ​  | } |


    | ​  |  |


    | ​  | ​**const**​ data = ​**await**​ res.json(); |


    | ​  |  |


    | ​  | ​**if**​ ( |


    | ​  | !data &#124;&#124; |


    | ​  | !data.data &#124;&#124; |


    | ​  | !Array.isArray(data.data) &#124;&#124; |


    | ​  | data.data.length === 0 |


    | ​  | ) { |


    | ​  | console.error( |


    | ​  | ​*''Unexpected API response:''*​, JSON.stringify(data, ​**null**​, 2) |


    | ​  | ); |


    | ​  | ​**return**​ ​**null**​; |


    | ​  | } |


    | ​  |  |


    | ​  | ​**if**​ (!data.data[0].embedding) { |


    | ​  | console.error( |


    | ​  | ​*''No embedding found in response:''*​, |


    | ​  | JSON.stringify(data.data[0], ​**null**​, 2) |


    | ​  | ); |


    | ​  | ​**return**​ ​**null**​; |


    | ​  | } |


    | ​  |  |


    | ​  | ​**return**​ data.data[0].embedding; |


    | ​  | } ​**catch**​ (error) { |


    | ​  | console.error( |


    | ​  | ​*`Error generating embedding for "*​${text}​*":`*​, |


    | ​  | error.message |


    | ​  | ); |


    | ​  | ​**return**​ ​**null**​; |


    | ​  | } |


    | ​  | } |


    Then, use that function to embed all the titles:


    [getting_started_with_vector_search/name_this_book.js](http://media.pragprog.com/titles/bgvector/code/getting_started_with_vector_search%2Fname_this_book.js)


    | ​  | ​**async**​ ​**function**​ embedTitles(books) { |


    | ​  | console.log(​*`Generating embeddings for all titles...`*​); |


    | ​  |  |


    | ​  | ​**const**​ promises = books.map((book, i) => { |


    | ​  | ​**const**​ fullTitle = book.subtitle |


    | ​  | ? ​*`*​${book.title}​*:* ​${book.subtitle}​*`*​ |


    | ​  | : book.title; |


    | ​  |  |


    | ​  | console.log(​*` (*​${i + 1}​*/*​${books.length}​*)* ​${fullTitle}​*`*​);
    |


    | ​  |  |


    | ​  | ​**return**​ getEmbedding(fullTitle).then(embedding => { |


    | ​  | book.embedding = embedding; |


    | ​  | ​**return**​ book; |


    | ​  | }); |


    | ​  | }); |


    | ​  |  |


    | ​  | ​**const**​ booksWithEmbeddings = ​**await**​ Promise.all(promises); |


    | ​  |  |


    | ​  | ​*// Filter out books that failed to get embeddings*​ |


    | ​  | ​**const**​ validBooks = booksWithEmbeddings.filter(book => book.embedding
    !== ​**null**​); |


    | ​  |  |


    | ​  | ​**if**​ (validBooks.length < books.length) { |


    | ​  | console.log(​*`*​ |


    | ​  | ​ *Warning:*​ |


    | ​  | ​ ​${books.length - validBooks.length}​ *books failed to get embeddings
    and*​ |


    | ​  | ​ *were excluded.*​ |


    | ​  | ​ *`*​); |


    | ​  | } |


