    \   similarity: {\n            query: query,\n            metric: 'dot_product',\n\
    \          },\n        },\n      },\n      limit: 10,\n      limit: 'articles',\n\
    \    }).build();\n\n    log.debug(`Generated Couchbase query: ${couchbaseQuery}`);\n\
    \n    // 使用 Ottoman.js 执行查询\n    const ottoman = getDefaultInstance();\n    const\
    \ { rows } = await ottoman.query(couchbaseQuery);\n\n    // 结构化并返回结果\n    const\
    \ results = rows.map(row => ({\n      id: row.id,\n      title: row.title,\n \
    \     description: row.description,\n    }));\n\n    return res.status(200).json({\
    \ results, count: results.length });\n  } catch (error) {\n    log.error(error,\
    \ 'Error performing search');\n    return res.status(500).json({\n      message:\
    \ 'An error occurred while processing the search',\n    });\n  }\n});\n\nexport\
    \ { performSearch };\n```\n\n此实现确保了所有用户都可以访问搜索功能，同时处理了后端服务的三个关键方面：输入验证、结构化日志和错误处理。让我们来看看\
    \ `performSearch` 控制器是如何管理每项任务的。\n\n在执行任何数据库操作之前，控制器会检查传入搜索查询的有效性。具体而言，它确保 `query`\
    \ 字段是请求体中存在的字符串。如果验证失败，API 将以 400 Bad Request 状态码响应，确保用户能够收到关于错误错误的清晰反馈。\n\n日志记录是任何后端应用程序中不可或缺的一部分。在该控制器中，结构化日志捕获了关键事件，例如接收查询和生成的数据库查询。捕获这些事件有助于开发者监控\
    \ API 使用情况并有效地调试问题。例如，控制器中的这段代码记录了从用户处收到的搜索查询：\n\n`log.debug(`Received search\
    \ query: ${query}`)`\n\n最后，控制器包含了错误处理，以管理搜索过程中的意外问题。如果在查询数据库或处理结果时发生错误，API 将以\
    \ 500 Internal Server Error 状态码响应，表示服务器端问题。系统会记录错误详情以供进一步调查，帮助开发者快速识别并解决问题。\n\n\
    ### 整合一切\n\n路由和控制器准备完成后，最后一步是将新路由集成到应用程序中。更新 `api/index.js` 文件以包含 `searchRoutes`：\n\
    \n[incorporating_vector_search_functionality/api/index.js](http://media.pragprog.com/titles/bgvector/code/incorporating_vector_search_functionality%2Fapi%2Findex.js)\n\
    \n```javascript\nimport searchRoutes from '../routes/searchRoutes';\napp.use('/api/search',\
    \ searchRoutes);\n```\n\n此集成使得新的搜索端点成为应用程序 API 的一部分，允许用户无缝提交搜索查询并接收结果。\n\n让我们查看搜索\
    \ API 端点流程的视觉化表示。下面的图表说明了搜索功能的请求-响应周期，突出了处理搜索查询的关键组件和交互。\n\n![搜索 API 的路由和控制器流程](img/search_api_route_and_controller_flow.png\
    \ \"搜索 API 的路由和控制器流程\")\n\n随着搜索 API 端点的实现，我们成功地将向量搜索功能集成到了应用程序的后端。用户可以提交搜索查询，API\
    \ 将根据 Couchbase 执行的向量相似度计算返回相关文章。这一步标志着我们在构建基于向量搜索的健壮搜索服务的程中取得了一个重要里程碑。\n\n在下一节中，我们将探索如何处理搜索\
    \ API 中的错误和验证，确保用户获得清晰的反馈，并保持服务的可靠与安全。\n\n"
- fmt: "\nIn our search API, middleware monitors incoming requests and enforces rate\
    \ limiting based on criteria such as client IP addresses or API keys. When a client\
    \ exceeds the defined limits, the middleware can respond with an error message,\
    \ such as “Too many search requests from this IP, please try again after a minute,”\
    \ and log the incident for further analysis. This approach helps maintain service\
    \ availability, protect against abuse, and provide valuable insights into usage\
    \ patterns.\n\nHere’s an example of rate-limiting middleware:\n\n[incorporating_vector_search_functionality/rateLimiter.js](http://media.pragprog.com/titles/bgvector/code/incorporating_vector_search_functionality%2FrateLimiter.js)\n\
    \n```javascript\nimport rateLimit from 'express-rate-limit';\n\nconst searchRateLimiter\
    \ = rateLimit({\n  windowMs: 60 * 1000, // 1-minute window\n  max: 30, // Limit\
    \ each IP to 30 requests per windowMs\n  message: 'Too many search requests, please\
    \ try again in a minute.',\n  handler: (req, res, next, options) => {\n    log.warn(`Rate\
    \ limit exceeded for IP: ${req.ip}`);\n    res.status(429).json({ error: options.message\
    \ });\n  }\n});\n\nexport default searchRateLimiter;\n```\n\nThis middleware,\
    \ built with the `express-rate-limit` npm package, restricts clients to a reasonable\
    \ number of search requests per minute. It also logs incidents of rate-limit breaches,\
    \ providing valuable data for monitoring and auditing. Applying this middleware\
    \ to the search API route is as simple as wrapping it around the route definition:\n\
    \n`router.get('/search', searchRateLimiter, searchController.searchArticles);`\n\
    \nRate limiting is just one piece of the puzzle. Security considerations for a\
    \ public-facing API extend beyond managing request frequency. We must address\
    \ several key areas to protect the search API, including injection attacks and\
    \ resilience against distributed denial-of-service (DDoS) attacks.\n\nSearch APIs\
    \ are particularly vulnerable to injection attacks, where bad actors craft malicious\
    \ input to manipulate back-end operations. Although our API uses `Ottoman.js`\
    \ to query the `Couchbase` database, it’s crucial to rigorously validate and sanitize\
    \ all inputs. The `validateText` function that we built earlier in the `services/utils`\
    \ folder, for example, ensures that query strings, limits, and offsets conform\
    \ to expected formats and prevent harmful payloads.\n\nHaving these validation\
    \ functions in place ensures that user inputs are sanitized and validated before\
    \ being processed and sent to the database. This helps prevent malicious activities\
    \ that could compromise the integrity of the search service. Using parameterized\
    \ queries in `Ottoman.js` adds an extra layer of protection by separating input\
    \ values from query logic, thus neutralizing attempts to inject rogue commands\
    \ into the database.\n\nIn addition to injection attacks, DDoS attacks pose a\
    \ significant threat to API availability. These attacks flood the server with\
    \ high requests, overwhelming its capacity and causing downtime. To mitigate this\
    \ risk, we can employ DDoS protection services, such as `Cloudflare` or `AWS Shield`,\
    \ which filter incoming traffic and block malicious requests before they reach\
    \ the server. These services use sophisticated algorithms to detect and respond\
    \ to DDoS attacks in real time, ensuring that the search API remains accessible\
    \ and responsive to legitimate users.\n\nMany resources are out there to help\
    \ you understand and implement these security measures. To learn more about security\
    \ best practices, you can check out the `OWASP API Security Top 10`, which provides\
    \ a comprehensive guide to securing APIs against common threats.\n\nBy implementing\
    \ rate limiting and addressing security concerns, we fortify the search API against\
    \ misuse and malicious activities, ensuring it remains stable, performant, and\
    \ secure. When combined with robust error handling and structured logging, these\
    \ measures create a resilient back-end service that can handle a wide range of\
    \ search requests while protecting user data and maintaining service availability.\n\
    \n## Key Takeaways\n\nIn this chapter, we took significant steps to bring vector\
    \ search functionality to life in our application. By building a dedicated search\
    \ API, we’ve bridged the gap between the back end and the user experience, enabling\
    \ fast and relevant search results powered by the vector search index created\
    \ earlier. We explored critical concepts along the way, from designing RESTful\
    \ endpoints to implementing robust input validation, rate limiting, and security\
    \ measures.\n\nThese are the key takeaways:\n\n*   Understanding the API service\
    \ layer: We revisited the structure of our application’s API layer, emphasizing\
    \ the roles of routes, controllers, and middleware, which laid the foundation\
    \ for integrating the new search endpoint.\n*   Designing and implementing the\
    \ search API: We applied RESTful principles to create an intuitive, idempotent\
    \ search endpoint, ensuring flexibility for future enhancements and consistency\
    \ with the existing architecture.\n*   Error handling and security: We emphasized\
    \ the importance of structured error handling, robust input validation, and defensive\
    \ programming practices to safeguard the API against misuse and ensure a seamless\
    \ user experience.\n*   Rate limiting and stability: By incorporating rate-limiting\
    \ mechanisms, we protected the service against overuse while maintaining fair\
    \ user access.\n\nIn the next chapter, we’ll focus on further enhancing the search\
    \ functionality, diving into optimization techniques that refine accuracy, handle\
    \ complex queries, and prepare the service for real-world demands.\n"
  raw: 'In our search API, middleware monitors incoming requests and enforces rate
    limiting based on criteria such as client IP addresses or API keys. When a client
    exceeds the defined limits, the middleware can respond with an error message,
    such as “Too many search requests from this IP, please try again after a minute,”
    and log the incident for further analysis. This approach helps maintain service
    availability, protect against abuse, and provide valuable insights into usage
    patterns.


    Here’s an example of rate-limiting middleware:


    [incorporating_vector_search_functionality/rateLimiter.js](http://media.pragprog.com/titles/bgvector/code/incorporating_vector_search_functionality%2FrateLimiter.js)


    | ​  | ​**import**​ rateLimit ​**from**​ ​*''express-rate-limit''*​; |


    | ​  |  |


    | ​  | ​**const**​ searchRateLimiter = rateLimit({ |


    | ​  | windowMs: 60 * 1000, ​*// 1-minute window*​ |


    | ​  | max: 30, ​*// Limit each IP to 30 requests per windowMs*​ |


    | ​  | message: ​*''Too many search requests, please try again in a minute.''*​,
    |


    | ​  | handler: (req, res, next, options) => { |


    | ​  | log.warn(​*`Rate limit exceeded for IP:* ​${req.ip}​*`*​); |


    | ​  | res.status(429).json({ error: options.message }); |


    | ​  | } |


    | ​  | }); |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ searchRateLimiter; |


    This middleware, built with the express-rate-limit npm package, restricts clients
    to a reasonable number of search requests per minute. It also logs incidents of
    rate-limit breaches, providing valuable data for monitoring and auditing. Applying
    this middleware to the search API route is as simple as wrapping it around the
    route definition:


    | ​  | router.​**get**​(​*''/search''*​, searchRateLimiter, searchController.searchArticles);
    |


    Rate limiting is just one piece of the puzzle. Security considerations for a public-facing
    API extend beyond managing request frequency. We must address several key areas
    to protect the search API, including injection attacks and resilience against
    distributed denial-of-service (DDoS) attacks.


    Search APIs are particularly vulnerable to injection attacks, where bad actors
    craft malicious input to manipulate back-end operations. Although our API uses
    Ottoman.js to query the Couchbase database, it’s crucial to rigorously validate
    and sanitize all inputs. The validateText function that we built earlier in the
    services/utils folder, for example, ensures that query strings, limits, and offsets
    conform to expected formats and prevent harmful payloads.


    Having these validation functions in place ensures that user inputs are sanitized
    and validated before being processed and sent to the database. This helps prevent
    malicious activities that could compromise the integrity of the search service.
    Using parameterized queries in Ottoman.js adds an extra layer of protection by
    separating input values from query logic, thus neutralizing attempts to inject
    rogue commands into the database.


    In addition to injection attacks, DDoS attacks pose a significant threat to API
    availability. These attacks flood the server with high requests, overwhelming
    its capacity and causing downtime. To mitigate this risk, we can employ DDoS protection
    services, such as Cloudflare or AWS Shield, which filter incoming traffic and
    block malicious requests before they reach the server. These services use sophisticated
    algorithms to detect and respond to DDoS attacks in real time, ensuring that the
    search API remains accessible and responsive to legitimate users.


    Many resources are out there to help you understand and implement these security
    measures. To learn more about security best practices, you can check out the OWASP
    API Security Top 10,^([[25]](#f_0061.xhtml_FOOTNOTE-25)) which provides a comprehensive
    guide to securing APIs against common threats.


    By implementing rate limiting and addressing security concerns, we fortify the
    search API against misuse and malicious activities, ensuring it remains stable,
    performant, and secure. When combined with robust error handling and structured
    logging, these measures create a resilient back-end service that can handle a
    wide range of search requests while protecting user data and maintaining service
    availability.


    ## Key Takeaways


    In this chapter, we took significant steps to bring vector search functionality
    to life in our application. By building a dedicated search API, we’ve bridged
    the gap between the back end and the user experience, enabling fast and relevant
    search results powered by the vector search index created earlier. We explored
    critical concepts along the way, from designing RESTful endpoints to implementing
    robust input validation, rate limiting, and security measures.


    These are the key takeaways:


    *   Understanding the API service layer: We revisited the structure of our application’s
    API layer, emphasizing the roles of routes, controllers, and middleware, which
    laid the foundation for integrating the new search endpoint.


    *   Designing and implementing the search API: We applied RESTful principles to
    create an intuitive, idempotent search endpoint, ensuring flexibility for future
    enhancements and consistency with the existing architecture.


    *   Error handling and security: We emphasized the importance of structured error
    handling, robust input validation, and defensive programming practices to safeguard
    the API against misuse and ensure a seamless user experience.


    *   Rate limiting and stability: By incorporating rate-limiting mechanisms, we
    protected the service against overuse while maintaining fair user access.


    In the next chapter, we’ll focus on further enhancing the search functionality,
    diving into optimization techniques that refine accuracy, handle complex queries,
    and prepare the service for real-world demands.


    Footnotes


    [[25]](#f_0060.xhtml_FNPTR-25)


    [https://owasp.org/www-project-api-security/](https://owasp.org/www-project-api-security/)


    Copyright © 2025, The Pragmatic Bookshelf.


    # Chapter 10


    Optimizing Search Results


    You’ve covered much on your journey into vector search—from theory and algorithms
    to building a working search service. Now you’re ready to take your search experience
    even further. In this chapter, you’ll enhance your search by integrating weighted
    rankings to incorporate factors like popularity and recency, optimizing query
    efficiency by handling stop words, and introducing hybrid search to leverage vector
    and keyword-based approaches.


    Search is not only about matching queries to results but also about ensuring those
    results align closely with user intent and expectations. Adding weighted ranking
    will deliver more relevant and timely results, while tackling stop words will
    improve search precision. Additionally, a hybrid search system will ensure your
    application intelligently chooses between vector and keyword searches, offering
    users the most effective results. Let’s get started by exploring weighted ranking.


    ## Weighted Ranking


    As users interact with search applications, their expectations go beyond simple
    matches. They seek results that feel timely, impactful, and aligned with their
    intent. While vector similarity is a powerful mechanism for matching concepts,
    it’s often insufficient to provide a complete picture of relevance. We can combine
    vector similarity with external factors like recency and popularity by incorporating
    weighted rankings to create a richer, more intuitive search experience.


    Consider the query “latest advancements in AI.” A stand-alone vector search might
    prioritize articles based solely on their conceptual similarity to the query.
    However, if some of these articles are outdated or have had little engagement,
    they may not be the most useful to the user. Weighted ranking helps address this
    by introducing additional criteria influencing how results are sorted and presented.
    In this chapter, we’ll focus on two such criteria:


    *   Recency: Prioritizing articles published more recently to ensure that users
    see the latest content.'
