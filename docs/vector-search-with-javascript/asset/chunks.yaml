  trans: "\n\n在我们的搜索 API 中，中间件会监控传入的请求并根据客户端 IP 地址或 API 密钥等标准实施速率限制。当客户端超过定义的限制时，中间件可以返回错误信息，例如“此\
    \ IP 的搜索请求过多，请在一分钟后重试”，并记录该事件以供进一步分析。这种方法有助于维护服务的可用性、防止滥用，并为使用模式提供价值见解。\n\n以下是速率限制中间件的示例：\n\
    \n[incorporating_vector_search_functionality/rateLimiter.js](http://media.pragprog.com/titles/bgvector/code/incorporating_vector_search_functionality%2FrateLimiter.js)\n\
    \n```javascript\nimport rateLimit from 'express-rate-limit';\n\nconst searchRateLimiter\
    \ = rateLimit({\n  windowMs: 60 * 1000, // 1-分钟窗口\n  max: 30, // 每个 IP 在 windowMs\
    \ 内的限制为 30 次请求\n  message: 'Too many search requests, please try again in a minute.',\n\
    \  handler: (req, res, next, options) => {\n    log.warn(`Rate limit exceeded\
    \ for IP: ${req.ip}`);\n    res.status(429).json({ error: options.message });\n\
    \  }\n});\n\nexport default searchRateLimiter;\n```\n\n该中间件使用 `express-rate-limit`\
    \ npm 包构建，限制客户端每分钟的搜索请求处于合理范围内。它还会记录违反速率限制的事件，为监控和审计提供价值数据。将此中间件应用于搜索 API 路由简单，只需将其封装在路由定义周围：\n\
    \n`router.get('/search', searchRateLimiter, searchController.searchArticles);`\n\
    \n速率限制只是冰山一角。面向公共 API 的安全考虑超出了管理请求频率的范围。我们必须处理几个关键领域来保护搜索 API，包括注入攻击和防御分布式拒绝服务（DDoS）攻击的弹性。\n\
    \n搜索 API 特别容易受到注入攻击，攻击者构造恶意输入来操纵后端操作。尽管我们的 API 使用 `Ottoman.js` 来查询 `Couchbase`\
    \ 数据库，但对所有输入进行严格的验证和清洗至关重要。例如，我们之前在 `services/utils` 文件夹中构建的 `validateText` 函数确保了查询字符串、限制和偏移量符合预期格式，并防止了有害负载。\n\
    \n配备这些验证函数可以确保用户输入在处理和发送到数据库之前经过了清洗和验证。这有助于防止可能损害搜索服务完整性的恶意活动。在 `Ottoman.js` 中使用参数化查询通过将输入值与查询逻辑分离来增加额外的保护，从而抵消了向数据库注入流根命令的尝试。\n\
    \n除了注入攻击外，DDoS 攻击对 API 的可用性构成了重大威胁。这些攻击通过大量请求淹没服务器，使其超出容量并导致停机。为了降低这种风险，我们可以采用\
    \ DDoS 保护服务，例如 `Cloudflare` 或 `AWS Shield`，它们在流量到达服务器之前过滤传入流量并拦截恶意请求。这些服务使用复杂的算法实时检测并响应\
    \ DDoS 攻击，确保搜索 API 对合法用户保持可访问性和响应能力。\n\n目前有许多资源可以帮助你理解和实施这些安全措施。要了解更多安全最佳实践，你可以查看\
    \ `OWASP API Security Top 10`，它提供了一份保护 API 免受常见威胁的全面指南。\n\n通过实施速率限制并解决安全问题，我们增强了搜索\
    \ API 防御误用和恶意活动的能力，确保其保持稳定、高效和安全。与健壮的错误处理和结构化日志相结合，这些措施创建了一个具有弹性的后端服务，能够在处理各种搜索请求的同时保护用户数据并维护服务可用性。\n\
    \n## 核心要点\n\n在本章中，我们采取了重要步骤，在应用程序中实现了向量搜索功能。通过构建一个专用的搜索 API，我们弥合了后端与用户体验之间的差距，能够通过之前创建的向量搜索索引提供快速且相关的搜索结果。在此过程中，我们探索了关键概念，从设计\
    \ RESTful 端点到实现健壮的输入验证、速率限制和安全措施。\n\n以下是要点：\n\n*   理解 API 服务层：我们重新回顾了应用程序 API\
    \ 层的结构，强调了路由、控制器和中间件的作用，为集成新的搜索端点奠定了基础。\n*   设计并实现搜索 API：我们应用 RESTful 原则创建了一个直观、幂等的搜索端点，确保了未来增强的灵活性以及与现有架构的一致性。\n\
    *   错误处理与安全：我们强调了结构化错误处理、健壮的输入验证和防御性编程实践对于保护 API 免受误用以及确保无缝用户体验重要性。\n*   速率限制与稳定性：通过引入速率限制机制，我们保护服务免受过度使用，同时维护了用户的的公平访问。\n\
    \n在下一章中，我们将重点关注进一步增强搜索功能，深入研究优化技术，以提高准确性、处理复杂查询并为服务应对现实需求做好准备。\n\n"
- fmt: "\n- **Popularity**: Factoring in metrics such as views, likes, or shares to\
    \ highlight articles that have garnered significant user interest.\n\nTogether,\
    \ these signals augment the vector similarity score, creating a balanced ranking\
    \ system that accounts for conceptual relevance and user-driven context.\n\n###\
    \ Calculating and Storing Ranking Metrics\n\nBefore integrating recency and popularity\
    \ into our search ranking, we must calculate and store these metrics for each\
    \ article in our database. Let’s start with recency. You can derive this metric\
    \ from the publication date of an article. We’ll represent recency as the number\
    \ of days since the article was published, inversely scaled so that newer articles\
    \ have higher scores, like this for example:\n\n| | `recency = max_days - (current_date\
    \ - publication_date)` |\n\nHere, `max_days` is a constant representing the maximum\
    \ time period considered relevant (such as 365 days for one year). Articles older\
    \ than this range will have a recency score of zero. To calculate this value,\
    \ we’ll update the logic in our data model as follows:\n\n`/optimizing_search_results/updated_article_model.js`\n\
    \n```javascript\nArticleSchema.pre('save', function (next) {\n  const currentDate\
    \ = new Date();\n  const maxDays = 365;\n  const publicationDate = this.publicationDate\
    \ || currentDate;\n\n  this.recency = Math.max(\n    0,\n    maxDays - Math.floor(\n\
    \      (currentDate - publicationDate) / (1000 * 60 * 60 * 24)\n    )\n  );\n\n\
    \  next();\n});\n```\n\nNext, let’s address popularity. This metric can be computed\
    \ based on engagement data, such as the number of views or likes an article has\
    \ received. For simplicity, we’ll define popularity as a weighted sum of these\
    \ factors:\n\n| | `popularity = (0.7 * views) + (0.3 * likes)` |\n\nSimilar to\
    \ recency, we’ll calculate and store this value in the article document. Whenever\
    \ an article is viewed or liked, we’ll update its popularity score using an event-driven\
    \ approach or a periodic batch-update process, depending on the application’s\
    \ needs. We’ll leave it to you to implement this aspect of user engagement tracking\
    \ in your application.\n\nOnce these fields are integrated into the database,\
    \ our articles will have three key metrics: `similarity_score`, `recency`, and\
    \ `popularity`, which can be used to rank search results. With these fields, we\
    \ have the foundation for incorporating weighted ranking into our search API.\n\
    \n### Integrating Weighted Ranking in the Search API\n\nWith the necessary fields\
    \ in place, we can modify the search API to incorporate weighted ranking. Let’s\
    \ revisit our ranking formula:\n\n| | `final_score = (0.7 * similarity_score)\
    \ + (0.2 * recency) + (0.1 * popularity)` |\n\nLet’s explain this formula in plain\
    \ English. The `final_score` is a weighted sum of three components: `similarity_score`,\
    \ `recency`, and `popularity`. The `similarity_score` is the primary factor, accounting\
    \ for 70 percent of the final score. Recency and popularity contribute 20 percent\
    \ and 10 percent, respectively. This distribution ensures that vector similarity\
    \ remains the primary ranking factor, while recency and popularity provide additional\
    \ context.\n\nAdjust these weights based on your application’s specific requirements.\
    \ For example, if recency is more critical than popularity, you could increase\
    \ its weight in the formula. The key is to experiment with different weightings\
    \ to find the balance that best suits your users’ needs.\n\nTo implement this,\
    \ we’ll update our controller’s `performSearch` method.\n\n`/optimizing_search_results/updated_performSearch.js`\n\
    \n```javascript\nimport asyncHandler from 'express-async-handler';\nimport { Query,\
    \ getDefaultInstance } from 'ottoman';\n\nconst performSearch = asyncHandler(async\
    \ (req, res) => {\n  const { query } = req.body;\n\n  if (!query || typeof query\
