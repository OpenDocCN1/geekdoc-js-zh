    | ​  | { |


    | ​  | where: { |


    | ​  | embedding: { |


    | ​  | $similarity: { |


    | ​  | query: query, |


    | ​  | metric: ​*''dot_product''*​, |


    | ​  | }, |


    | ​  | }, |


    | ​  | }, |


    | ​  | limit: 10, |


    | ​  | }, |


    | ​  | ​*''articles''*​ |


    | ​  | ).build(); |


    | ​  |  |


    | ​  | log.debug(​*`Generated Couchbase query:* ​${couchbaseQuery}​*`*​); |


    | ​  |  |


    | ​  | ​*// Execute the query using Ottoman.js*​ |


    | ​  | ​**const**​ ottoman = getDefaultInstance(); |


