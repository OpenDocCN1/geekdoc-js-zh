  raw: 'In the preceding code, we’re defining a validateText function that takes a
    text input as a parameter and performs various validations on the input. The function
    checks if the input is a string, is not empty or just whitespace, does not exceed
    a maximum length, meets a minimum length, is not too repetitive, and does not
    contain excessive punctuation. If any validations fail, the function throws a
    ValidationError with an appropriate error message. If all validations pass, the
    function returns true.


    You may have noticed that the preceding code uses ValidationError, which imports
    from the errorHandlers.js utility. However, the utility doesn’t exist yet, so
    let’s create it next.


    #### Handling Errors


    The errorHandlers.js utility handles errors during vector embedding operations.
    It defines custom error classes the application can use to throw and catch specific
    errors. These classes provide more context and detail, making debugging and resolving
    issues easier.


    Here’s an example of what the errorHandlers.js utility might look like. The actual
    error classes you define may vary, depending on your requirements, but, as previously,
    this example should give you a good starting point:


    [implementing_vector_generation_service/errorHandlers.js](http://media.pragprog.com/titles/bgvector/code/implementing_vector_generation_service%2FerrorHandlers.js)


    | ​  | ​**class**​ ValidationError ​**extends**​ Error { |


    | ​  | ​**constructor**​(message) { |


    | ​  | ​**super**​(message); |


    | ​  | ​**this**​.name = ​*''ValidationError''*​; |


    | ​  | Error.captureStackTrace(​**this**​, ​**this**​.​**constructor**​); |


    | ​  | } |


    | ​  | } |


    At this point in our application development, we only create a single custom error
    class, ValidationError, which extends the built-in Error class. The ValidationError
    class takes a message parameter and sets the error name to ValidationError. We
    also use Error.captureStackTrace to capture the stack trace of the error, which
    can be helpful for debugging purposes. The ValidationError class throws validation
    errors when text input doesn’t meet the requirements for generating vector embeddings.


    As we build out further our application in the following chapters, we’ll define
    additional custom error classes to handle different types of errors that may occur
    during the vector embedding operations. The ValidationError class will be a foundation
    for our error-handling strategy.


    With the utilities for text validation and error handling in place, we’ve created
    a foundation that makes our vector embedding service easier to refactor and maintain.
    These utilities ensure valid text input and proper error handling during vector
    operations. Next, we’ll implement the logic to persist embeddings, beginning with
    creating saveEmbedding.js in the services/embeddings/ folder.


    ## Storing Embeddings in the Database


    The saveEmbedding.js module stores embeddings in the database alongside their
    corresponding articles. Storing this data together enables efficient similarity
    searches based on vector distance.


    We’ll place the saveEmbedding.js file inside the services/embeddings/ folder at
    the root of our project. Let’s create this folder and structure it as follows
    if you haven’t already:


    | ​  | embeddings/ |


    | ​  | ├── createEmbedding.js |


    | ​  | ├── saveEmbedding.js |


    In this section, we’ll only focus on the saveEmbedding.js functionality, but you
    can see that we also have created a createEmbedding.js file. We’ll build out the
    functionality of generating article embeddings in [​*Creating Vector Embeddings*​](#f_0045.xhtml_sect.creating_vector_embeddings).
    For now, let’s focus on storing the embeddings in the database.


    The core responsibility of saveEmbedding.js is to store the embedding and its
    related article in the database. Since we’re using Couchbase for this project,
    the save function will utilize Couchbase’s document database capabilities. Here’s
    an outline of the steps we’ll take:


    1.  Establish a database connection: Connect to the Couchbase instance using the
    credentials from the configuration.


    2.  Prepare the embedding data: Ensure the embedding and associated article data
    are ready to be stored in a document.


    3.  Insert the embedding into the database: Insert the article and its embedding
    into Couchbase in a specific bucket.


    The following diagram shows the step-by-step flow between the components, saving
    the embedding for the database.


    ![Flow of Saving Document](images/mermaid_graphs/save_document_flow.png "Flow
    of Saving Document")


    Now, let’s walk through an implementation of this in the saveEmbedding.js file:


    [implementing_vector_generation_service/saveEmbedding.js](http://media.pragprog.com/titles/bgvector/code/implementing_vector_generation_service%2FsaveEmbedding.js)


    | ​  | ​**import**​ Article ​**from**​ ​*''../models/Article''*​; |


    | ​  | ​**import**​ { ValidationError } ​**from**​ ​*''../utils/errorHandlers''*​;
    |


    | ​  |  |


    | ​  | ​*// Function to save embedding and article data*​ |


    | ​  | ​**const**​ saveEmbedding = ​**async**​ (articleId, articleContent, embedding)
    => { |


    | ​  | ​**if**​ (!articleId &#124;&#124; !embedding &#124;&#124; !articleContent)
    { |


    | ​  | ​**throw**​ ​**new**​ ValidationError( |


    | ​  | ​*''Article ID, content, and embedding are required to save.''*​ |


    | ​  | ); |


    | ​  | } |


    | ​  |  |


    | ​  | ​**try**​ { |


    | ​  | ​*// Find the existing article or create a new instance*​ |


    | ​  | ​**let**​ article = ​**await**​ Article.findById(articleId); |


    | ​  |  |


    | ​  | ​**if**​ (!article) { |


    | ​  | article = ​**new**​ Article({ |


    | ​  | slug: articleContent.slug, ​*// Article slug*​ |


    | ​  | title: articleContent.title, ​*// Article title*​ |


    | ​  | description: articleContent.description, ​*// Article description*​ |


    | ​  | body: articleContent.body, ​*// Article content*​ |


    | ​  | author: articleContent.author, ​*// Article author ID*​ |


    | ​  | tagList: articleContent.tagList, ​*// Tags associated with the article*​
    |


    | ​  | favoritesCount: 0, ​*// Initialize favorites count*​ |


    | ​  | comments: [], ​*// Initialize comments*​ |


    | ​  | embedding ​*// Save the embedding*​ |


    | ​  | }); |


    | ​  | } ​**else**​ { |


    | ​  | ​*// Update the existing article''s embedding*​ |


    | ​  | article.embedding = embedding; |


    | ​  | } |


    | ​  |  |


    | ​  | ​*// Save the article with its embedding*​ |


    | ​  | ​**await**​ article.save(); |


    | ​  | console.log(​*''Article and embedding saved successfully''*​); |


    | ​  | } ​**catch**​ (error) { |


    | ​  | console.error(​*''Error saving article and embedding:''*​, error); |


    | ​  | ​**throw**​ error; |


    | ​  | } |


    | ​  | }; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ saveEmbedding; |


    In the preceding code, we’re defining a saveEmbedding function that takes an articleId,
    articleContent, and embedding as parameters. The function first checks if the
    required parameters are provided and throws a ValidationError if any are missing.
    It then attempts to find the existing article in the database based on the articleId.
    If the article does not exist, the code creates a new instance of the Article
    model with the article data and the embedding. If the article exists, the embedding
    is updated. Finally, the article with its embedding is saved to the database using
    the save method.


    Updating an article’s embedding is essential because its usefulness depends on
    how well it reflects the underlying content. If the article changes, its embedding
    should be updated, too, ensuring that search results remain accurate and relevant.
    Later, we’ll explore optimizing this process by detecting meaningful changes before
    triggering updates. We’ve successfully defined the logic for saving embeddings
    to the database for now. Let’s move on to generating embeddings for articles in
    the next section.


