  trans: "\n第二个关键步骤是将博客内容转换为向量嵌入（vector embeddings），以便我们能够进行相似性搜索。我们还将用户的用户的查询转换为向量嵌入，用以搜索内容。为每个查询生成新的嵌入需要快速完成，因此我们需要考虑性能，并确保该过程尽可能耗短。近期对用户行为的研究显示，如果响应加载时间超过三秒，40%\
    \ 的用户将离开网站。（[[12]](#f_0037.xhtml_FOOTNOTE-12））这是一个巨大的压力，因此我们需要确保选择的平台和我们构建的 SDK\
    \ 能够处理这些负载。\n\n内容到嵌入的转换可以在内容创建时进行，因此我们还需要建立一套标准，规定在作者添加新内容时何时更新嵌入。例如，是否每次编辑都值得修订嵌入？还是说只有某些编辑需要？这些都是我们在构建博客平台功能时需要回答的问题。目前，可以安全地说，纠正一个简单的拼写错误可能不应该触发新的嵌入生成。或者应该呢？我们将这个问题留到以后在讨论优化搜索结果和其他更高级的话题时讨论。\n\
    \n我们将依赖的最后一个应用程序管理领域是环境变量。环境变量设置在应用程序之外，以便在运行时对其进行配置。它们存储敏感数据，例如 API 密钥或数据库连接字符串，将这些信息排除在代码库之外。使用环境变量使得你的应用程序更加安全，并且在不同环境中易于配置。\n\
    \n如果我不提到强制性的安全警告，将是失职的。在处理环境变量时，重要的是不要将敏感信息提交到你的版本控制系统中。务始终将你的环境变量添加到 `.env` 文件中，并将该文件包含在\
    \ `.gitignore` 中防止其被提交。这将有助于在开发过程中保持你的敏感信息安全。\n\n然而，对于生产环境，不建议在 `.env` 文件中存储密钥。相反，请使用安全的方法，例如在运行时从密钥管理器注入环境变量，或从云平台或容器编排系统提供的挂载密钥位置读取它们。这增加了额外的保护层，并确保你的密钥在生产环境中安全地处理。\n\
    \n在了解了这些依赖项的原因和内容后，让我们指定一下将为项目安装的依赖项。我们将使用以下库和工具来构建博客平台：\n\n*   `Ottoman.js`:\
    \ 一个用于 Couchbase 的 Node.js ORM 库（更准确地说，是一个 ODM 库，因为我们使用的是 JSON 文档数据而非关系关系模型），它允许我们使用对象与\
    \ Couchbase 数据库交互。\n*   `OpenAI Node.js SDK`: 用于 `OpenAI` API 的官方 Node.js SDK，允许我们为博客平台中的内容和用户查询生成向量嵌入。\n\
    *   `dotenv`: 一个零依赖模块，可从 `.env` 文件将环境变量加载到 `process.env` 中，以保持我们的敏感信息安全。\n\n要安装这三个依赖项，你可以在项目的根目录下运行以下命令：\n\
    \n```\nnpm install ottoman openai dotenv\n```\n\n你可以通过检查 `package.json` 文件或运行以下命令来验证\
    \ `npm` 是否正确安装了依赖：\n\n```bash\nnpm list\n```\n\n运行 `npm list` 后，你将看到类似下面的输出：\n\
    \n```\nvector-blog-platform@1.0.0 /path/to/your/project\n  ├── dotenv@16.4.5\n\
    \  ├── openai@4.58.2\n  └── ottoman@2.5.0\n```\n\n此输出显示依赖项已成功安装，现在可以在项目中使用。安装好依赖项后，你现在准备好开始构建博客平台的功能了！\n\
    \n## 核心要点\n\n在本章中，你通过搭建开发环境并准备支持向量嵌入工作流所需的工具和结构，为构建向量搜索应用程序奠定了基础。\n\n以下是你目前为止所成就的快速总结，以及在我们开始在应用程序中实现向量搜索时需要继续进行的内容：\n\
    \n*   你通过安装 Node.js、搭建项目结构骨架以及选择合适的向量数据库，搭建了开发环境。\n*   你学习到向量嵌入是非结构化的、高维数据，需要专门的索引来以实现快速且准确的搜索。\n\
    *   你探索了可以存储向量数据的数据库类型，包括文档数据库、图数据库和关系数据库，并理解了为什么文档数据库非常适合。\n*   你安装并配置了核心依赖项，包括一个\
    \ ORM (`Ottoman`)、用于生成嵌入的 `OpenAI` SDK 以及用于环境变量管理的 `dotenv`。\n\n在下一章中，我们将开始在 Node.js\
    \ 应用程序中实现搜索功能。我们将涵盖如何查询向量数据库以获取相似的嵌入并向用户返回相关结果。\n\n## 注释\n\n[[8]](#f_0034.xhtml_FNPTR-8)\n\
    [`github.com/gothinkster/realworld`](https://github.com/gothinkster/realworld)\n\
    [[9]](#f_0034.xhtml_FNPTR-9)\n[`codebase.show/projects/realworld`](https://codebase.show/projects/realworld)\n\
    \n[[10]](#f_0034.xhtml_FNPTR-10)\n[`github.com/hummusonrails/vector-example-blog-platform`](https://github.com/hummusonrails/vector-example-blog-platform)\n\
    \n[[11]](#f_0035.xhtml_FNPTR-11)\n[`cloud.couchbase.com`](https://cloud.couchbase.com)\n\
    \n[[12]](#f_0036.xhtml_FNPTR-12)\n[`www.forbes.com/advisor/business/software/website-statistics/`](https://www.forbes.com/advisor/business/software/website-statistics/)\n\
    \n[[13]](#f_0036.xhtml_FNPTR-13)\n[`ottomanjs.com/`](https://ottomanjs.com/)\n\
    \n[[14]](#f_0036.xhtml_FNPTR-14)\n[`github.com/openai/openai-node`](https://github.com/openai/openai-node)\n\
    \n[[15]](#f_0036.xhtml_FNPTR-15)\n[`www.npmjs.com/package/dotenv`](https://www.npmjs.com/package/dotenv)\n"
- fmt: "\nA lot of times when I’m excited to build something new, I jump straight\
    \ into coding. Later, after more rewrites than I’d like to admit, I realize I\
    \ should have planned the data structure first.\n\nPerhaps this can be best expressed\
    \ with some Latin:\n\n> Carpe datum—Seize the data!\n\nAlternatively, one could\
    \ look back to one of the classic sets of “Rules” of programming authored by Rob\
    \ Pike in his 1989 paper, “Notes on Programming in C”:\n\nRule 5. Data dominates.\
    \ If you’ve chosen the right data structures and organized things well, the algorithms\
    \ will almost always be self-evident. Data structures, not algorithms, are central\
    \ to programming.\n\nIn that spirit, before building the vector embedding service\
    \ and committing code, we’ll take a moment to model the data. Thoughtful data\
    \ modeling is key to enabling meaningful vector operations later. While this project\
    \ includes standard models for users, articles, tags, and comments, we’ll only\
    \ venture into the ones most relevant to vector search.\n\nIn the blog platform\
    \ we’re building, we’ll have the following entities:\n\n* Users\n* Articles\n\
    * Tags\n* Comments\n\nEach of these entities will have specific attributes that\
    \ define them and their relationships with other entities. Let’s take a look at\
    \ the Article model, the one most associated with the vector search functionality\
    \ for the platform.\n\n### Defining the Article Model\n\nThe Article model will\
    \ represent the blog posts on the platform. Users will be able to create articles,\
    \ add tags to articles, and comment on articles. The Article model will store\
    \ information about each article, such as the title, body, author, tags, and comments.\
    \ The Article model will also establish relationships with the user entity, as\
    \ each article will have an author, and with the tag entity, as each article can\
    \ have multiple tags.\n\nThe Article model will have the following attributes:\n\
    \n* `id`: A unique identifier for the article.\n* `slug`: A unique slug for the\
    \ article, derived from the title.\n* `title`: The title of the article.\n* `description`:\
    \ A short description or summary of the article.\n* `body`: The body or content\
    \ of the article.\n* `author`: The user ID of the author of the article.\n* `tagList`:\
    \ An array of tag IDs for tags associated with the article.\n* `comments`: An\
    \ array of comment IDs for comments on the article.\n* `favoritesCount`: The number\
    \ of users who have selected the article as a favorite.\n\nLooking at the `author`\
    \ attribute, we can see that it’s a user ID, establishing a relationship between\
    \ the article entity and the user entity. The `comments` attribute is an array\
    \ of comment IDs, establishing a relationship between the article entity and the\
    \ comment entity. Similarly, the `tagList` attribute is an array of tag IDs, establishing\
    \ a relationship between the article entity and the tag entity. As we did when\
    \ describing the User model, let’s visualize the Article model and its relationships\
    \ to further understand the data model:\n\n![Article Model](images/mermaid_graphs/article_model.png\
    \ \"Article Model\")\n\nNow that we have a good understanding of the data model\
    \ for the article entity, let’s write the code using Ottoman.js to define the\
    \ Article model. Create a new file called `Article.js` in the `models/` folder\
    \ and import the necessary dependencies:\n\n```javascript\nimport { Schema, model,\
    \ getModel } from 'ottoman';\nimport slugify from 'slugify';\n```\n\nIn the preceding\
    \ code, we’re importing functions and modules from Ottoman.js, a JavaScript library,\
    \ to help us interact with our database from our models, namely the `Schema`,\
    \ `model`, and `getModel` functions. You’ll also notice a unique import for the\
    \ Article model, which is the `slugify` library. This library will help us generate\
    \ unique slugs for the articles based on the title. All of these imports are part\
    \ of a `couchbaseClient` that we’ll create at the end of this chapter.\n\nNext,\
    \ let’s define the schema for the Article model using the syntax from Ottoman.js:\n\
    \n```javascript\nconst articleSchema = new Schema({\n  slug: {\n    type: String,\n\
    \    unique: true,\n    lowercase: true,\n    index: true,\n  },\n  title: {\n\
    \    type: String,\n    required: true,\n  },\n  description: {\n    type: String,\n\
    \    required: true,\n  },\n  body: {\n    type: String,\n    required: true,\n\
    \  },\n  // Creates an array of tags, defaulting to an empty array\n  // () =>\
    \ [] is used instead of [] to avoid shared references\n  tagList: {\n    type:\
    \ [{ type: String, ref: 'Tag' }],\n    default: () => [],\n  },\n  author: {\n\
    \    type: String,\n    ref: 'User',\n  },\n  favoritesCount: {\n    type: Number,\n\
    \    default: 0,\n  },\n  // Comments are stored as an array of references to\
    \ documents\n  // Again, default is a function to return a fresh array\n  comments:\
    \ {\n    type: [{ type: String, ref: 'Comment' }],\n    default: () => [],\n \
    \ },\n  embedding: {\n    type: [Number],\n    default: () => [],\n  },\n}, {\n\
    \  timestamps: true,\n});\n\n// Before saving updates, regenerate the slug based\
    \ on the new title\n// This ensures the slug stays in sync when the title changes\n\
    articleSchema.pre('update', function (document) {\n  document.slug = slugify(document.title,\
    \ {\n    lower: true,\n    replacement: '-',\n  });\n});\n\n// Converts the article\
    \ instance to a response object for API output,\n// including author profile and\
    \ favorited status\narticleSchema.methods.toArticleResponse = async function (user)\
    \ {\n  const User = getModel('User');\n  const authorObj = await User.findById(this.author);\n\
    \  return {\n    slug: this.slug,\n    articleSlug: this.slug,\n    title: this.title,\n\
    \    description: this.description,\n    body: this.body,\n    createdAt: this.createdAt,\n\
    \    updatedAt: this.updatedAt,\n    tagList: this.tagList,\n    favorited: user\
    \ ? user.isFavorite(this.id) : false,\n    favoritesCount: this.favoritesCount,\n\
    \    author: authorObj.toProfileJSON(user)\n  };\n};\n\n// Adds a comment reference\
    \ to the article's comments array,\n// if not already present\narticleSchema.methods.addComment\
    \ = async function (commentId) {\n  if (this.comments.indexOf(commentId) === -1)\
    \ {\n    this.comments.push(commentId);\n  }\n  return this.save();\n};\n\n//\
    \ Removes a comment reference from the article's comments array,\n// if present\n\
    articleSchema.methods.removeComment = async function (commentId) {\n  const idx\
    \ = this.comments.indexOf(commentId);\n  if (idx !== -1) {\n    this.comments.splice(idx,\
    \ 1);\n  }\n  return this.save();\n};\n```\n"
