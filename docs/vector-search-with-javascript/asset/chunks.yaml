  trans: "\n\n`createEmbedding.js` 文件根据文章内容生成文章向量嵌入（vector embeddings）。这些嵌入捕捉了每篇文章的语义含义和上下文，能够实现返回相关结果的相似性搜索。为了编写可重用的代码，我们还将使用此服务为用户的搜索查询生成嵌入。\n\
    \n准备好开始编写创建服务了吗？让我们开始吧！\n\n## 设计创建嵌入逻辑\n\n`createEmbedding.js` 的核心职责是为文章内容生成向量嵌入。由于该项目使用了\
    \ OpenAI API，因此 `create` 函数将利用该 API 生成嵌入。以下是我们将采取的步骤大纲：\n\n1. 连接到 OpenAI API：使用\
    \ OpenAI 客户端建立与 OpenAI API 的连接。\n2. 准备文章内容：确保文章内容已就绪，可以传递给 API 进行嵌入生成。\n3. 生成嵌入：使用\
    \ OpenAI API 为文章内容生成向量嵌入。\n4. 存储嵌入：使用 `saveEmbedding.js` 功能将生成的嵌入保存到数据库。\n\n生成嵌入的交互流程涉及几个关键组件：\n\
    \n* 用户向后端 API 提交新文章。\n* 后端 API 触发 `createEmbedding.js` 函数。\n* `createEmbedding.js`\
    \ 将文章内容发送到 OpenAI API。\n* OpenAI API 返回生成的嵌入。\n* `createEmbedding.js` 带嵌入调用 `saveEmbedding.js`。\n\
    * `saveEmbedding.js` 将嵌入保存到 Couchbase 数据库。\n* Couchbase 数据库向 `saveEmbedding.js`\
    \ 确认保存成功。\n* `saveEmbedding.js` 向 `createEmbedding.js` 确认已保存。\n* `createEmbedding.js`\
    \ 通知后端 API 成功。\n* 后端 API 向用户确认文章已带嵌入保存。\n\n这一序列确保了文章内容在被处理为嵌入并在向用户确认成功之前，可靠地存储在数据库中。\n\
    \n在我们开始编写 `createEmbedding.js` 功能的代码之前，我们必须先创建 OpenAI 客户端功能，以便我们能够连接到 OpenAI API。在对服务中嵌入创建流程有了良好了解的情况下，让我们花点时间在\
    \ `services/clients/` 文件夹中构建 OpenAI 客户端。\n\n## 设计 OpenAI API 客户端\n\nOpenAI 客户端将连接到\
    \ OpenAI API 并为文本生成向量嵌入。该客户端将提供与 API 交互并处理响应的接口。通过将连接 OpenAI API 的功能封装在客户端中，我们可以轻松地在应用程序的不同部分重用客户端，并保持与\
    \ API 交互的一致性。\n\nOpenAI 客户端位于项目根目录下的 `services/clients/` 文件夹中。该文件夹包含连接 OpenAI\
    \ API 和生成向量嵌入的逻辑。如果我们还没有，就开始创建 `services/clients/` 文件夹并将其结构如下：\n\n```\n| clients/\
    \ |\n| ├── openaiClient.js |\n```\n\n此部分将重点实现 `openaiClient.js` 模块，该模块处理到 OpenAI\
    \ API 的连接以及向量嵌入的生成。\n\nOpenAI 客户端的核心职责是连接到 OpenAI API 并为文本输入生成向量嵌入。客户端将提供与 OpenAI\
    \ API 交互并处理 API 响应的接口。以下是我们将采取的步骤大纲：\n\n1. 连接到 OpenAI API：使用 API key 建立 OpenAI\
    \ API 的连接。\n2. 生成嵌入：使用 OpenAI API 为文本输入生成向量嵌入。\n3. 处理响应：解析并处理来自 OpenAI API 的响应以提取嵌入。考虑到我们需要完成的步骤，让我们在\
    \ `openaiClient.js` 文件中查看实现。我们是参考 OpenAI Embeddings API 文档进行构建的。\n\n以下是 `openaiClient.js`功能可能性的示例：\n\
    \n```javascript\nimport OpenAI from 'openai';\n// 导入用于 API 错误的自定义错误类\nimport {\
    \ EmbeddingServiceError, ValidationError } from '../utils/errorHandlers';\n//\
    \ 导入用于输入验证的 validateText 工具\nimport validateText from '../utils/validateText';\n\
    \nconst OPENAI_API_KEY = process.env.OPENAI_API_KEY;\n\n// 使用提供的配置创建实例\nconst\
    \ client = new OpenAI({\n  apiKey: OPENAI_API_KEY,\n});\n\n// 为给定文本生成嵌入的\nconst\
    \ callEmbeddingAPI = async (text) => {\n  try {\n    validateText(text);\n   \
    \ // 向 OpenAI API 发送请求\n    const response = await client.embeddings.create({\n\
    \      model: 'text-embedding-002',\n      input: text,\n    });\n    // 从响应中提取嵌入\n\
    \    const embedding = response.data[0]?.embedding;\n    if (!embedding) {\n \
    \     throw new EmbeddingServiceError('Failed to retrieve embedding');\n    }\n\
    \    return embedding;\n  } catch (error) {\n    if (error instanceof OpenAI.APIError)\
    \ {\n      console.error(`OpenAI API Error ${error.status}]: ${error.message}`);\n\
    \    } else if (error instanceof ValidationError) {\n      console.error(`Validation\
    \ Error: ${error.message}`);\n    } else if (error instanceof EmbeddingServiceError)\
    \ {\n      console.error(`Embedding Service Error: ${error.message}`);\n    }\
    \ else {\n      console.error('Unexpected Error:', error);\n    }\n    throw error;\n\
    \  }\n};\n\nexport { callEmbeddingAPI };\n```\n\n我们应该强调这段代码的几个关键部分。首先，我们正在使用 OpenAI\
    \ Node.js SDK 来构建客户端。该 SDK 提供了一种与 OpenAI API 进行嵌入和其他服务进行交互的方便方法。\n\n我们还使用了之前构建的\
    \ `validateText` 工具，以确保在向 API 发送嵌入生成之前的文本输入是有效的。这是一种良好的做法，可以确保在继续嵌入生成过程之前输入是干净且有意义的。\n\
    \n我们处理错误的方式也很有意义。我们捕获不同类型的错误，例如 API、验证和意外错误，并对其进行适当的记录。这有助于我们快速高效地识别并解决问题。然而，你是否注意到我们的错误处理有什么不对劲？我们正在使用一个尚未定义的自定义\
    \ `EmbeddingServiceError` 类！\n\n让我们重新打开 `services/utils/` 文件夹中的 `errorHandlers.js`\
    \ 文件，现在向其中添加 `EmbeddingServiceError` 类。\n\n```javascript\nclass EmbeddingServiceError\
    \ extends Error {\n  constructor(message, status) {\n    super(message);\n   \
    \ this.name = 'EmbeddingServiceError';\n  }\n}\n```\n\n"
