  trans: "\n\n```javascript\nthis.status = status;\nError.captureStackTrace(this,\
    \ this.constructor);\n}\n```\n\n前面的代码定义了一个继承自内置 `Error` 类的 `EmbeddingServiceError`\
    \ 类。`EmbeddingServiceError` 类接收 `message` 和 `status` 参数，并将错误名称设置为 `EmbeddingServiceError`。我们还使用\
    \ `Error.captureStackTrace` 来捕获异常的堆栈跟踪，这对于调试非常有帮助。`EmbeddingServiceError` 类将处理在与\
    \ OpenAI API 交互过程中出现的错误。通过定义 `EmbeddingServiceError` 类，我们成功构建了 OpenAI 客户端，它允许我们连接到\
    \ OpenAI API 并为文本输入生成向量嵌入。该客户端将是向量嵌入服务的关键组件，因为它使能够为文章和用户搜索查询创建嵌入。\n\n构建好 OpenAI-API\
    \ 客户端后，我们已经准备好编写 `createEmbedding.js` 功能的代码了。让我们开始创建为文章生成嵌入的功能。\n\n### 编写创建嵌入的逻辑\n\
    \n`createEmbedding.js` 将使用我们之前构建的代码来抽象 OpenAI API 客户端、文本验证和错误处理。由于我们之前的工作，为文章和搜索查询生成嵌入的代码将非常简洁，并专注于生成嵌入的核心功能。让我们深入研究\
    \ `createEmbedding.js` 功能的代码。\n\n[实现向量生成服务/createEmbedding.js](http://media.pragprog.com/titles/bgvector/code/implementing_vector_generation_service%2FcreateEmbedding.js)\n\
    \n```javascript\n// 导入用于生成嵌入的 OpenAI 客户端\nimport { callEmbeddingAPI } from '../clients/openaiClient';\n\
    // 导入用于输入验证的 validateText 工具函数\nimport validateText from '../utils/validateText';\n\
    // 导入 saveEmbedding 以存储已生成的嵌入\nimport { saveEmbedding } from './saveEmbedding';\n\
    \n/**\n * 为给定内容创建嵌入，\n * 并根据类型将其保存或返回。\n * @param {string} identifier - 实体体的唯一标识符（例如文章\
    \ ID、查询 ID）。\n * @param {string} content - 需要创建嵌入的内容（例如文章正文、用户查询）。\n * @param\
    \ {string} type -内容的类型（例如 'article'）。\n * @returns {Promise<object | void>} -\
    \ 如果类型为 'query' 则返回嵌入，否则将其保存。\n */\nconst createEmbedding = async (identifier,\
    \ content, type) => {\n  try {\n    validateText(content);\n    const embedding\
    \ = await callEmbeddingAPI(content);\n    if (type === 'article') {\n      await\
    \ saveEmbedding(identifier, embedding, type);\n      console.log(`Successfully\
    \ saved embedding for article ID: ${identifier}`);\n    } else if (type === 'query')\
    \ {\n      console.log(`Generated embedding for query with ID: ${identifier}`);\n\
    \      return embedding;\n    }\n  } catch (error) {\n    console.error('Error\
    \ creating embedding:', error.message);\n    throw error;\n  }\n};\n\nexport {\
    \ createEmbedding };\n```\n\n在前面的代码中，我们定义了一个 `createEmbedding` 函数，它接收 `identifier`、`content`\
    \ 和 `type` 作为参数。该函数首先使用 `validateText` 工具函数验证内容以确保输入有效。然后，使用 OpenAI 客户端中的 `callEmbeddingAPI`\
    \ 函数为内容生成嵌入。最后，如果嵌入针对文章，则使用 `saveEmbedding` 函数将嵌入保存到数据库中；否则，它返回搜索查询的嵌入。函数在成功创建并保存或返回嵌入时会记录一条成功消息。当过程中发生错误时，它也会记录一条错误消息。\n\
    \n这段代码是多功能且灵活的，因为它可以为应用程序中的不同类型内容生成嵌入，无论是文章还是用户搜索查询。通过以通用可重用的方式编写函数，我们确保了整个应用程序的一致性并简化了未来的维护。核心嵌入生成逻辑完成后，我们的向量生成服务已经完成，并准备好为向量搜索提供支持。\n\
    \n## 核心要点\n\n在本章中，我们构建了应用程序生成向量嵌入的核心功能。通过将可重用的工具函数、模块化的 OpenAI 客户端和结构化的服务逻辑分层，我们为搜索体验提供了技术基础。\n\
    \n以下是进入后续章节的关键要点：\n\n*   我们为向量嵌入功能引入了清晰的服务结构，将关注点分离在 `embeddings/`、`clients/`、`search/`\
    \ 和 `utils/` 文件夹中。\n*   `validateText.js` 和 `errorHandlers.js` 等工具函数确保系统只处理干净、有意义的输入并优雅地处理失败。\n\
    *   `saveEmbedding.js` 模块处理嵌入持久化到数据库，确保更新后的内容产生更新的嵌入。\n*   `openaiClient.js` 文件封装了与\
    \ OpenAI API 交互的逻辑，包括验证和错误管理。\n\n"
- fmt: "\nThe system then ranks the results based on the similarity scores generated\
    \ by the comparison. Higher similarity scores indicate closer matches between\
    \ the user’s search term and the stored data. The system can return the top results\
    \ to the user depending on how we set up the ranking algorithm. The system repeats\
    \ this process whenever the user enters a new search query, ensuring the search\
    \ results remain relevant and up-to-date.\n\nThe first step in the search process\
    \ is to convert the user query into a vector embedding. The good news is that\
    \ you’ve already become well-versed in this process! We have also set up the necessary\
    \ skeleton for the search service in the `services/` folder by scaffolding the\
    \ file structure and defining the core functions.\n\nWe’ll use the functionality\
    \ in `embeddings/createEmbedding.js` to generate the vector representation of\
    \ the user query. `search/embedQuery.js` will call this function and handle the\
    \ flow to the next step in the search process. We can reuse the existing embedding\
    \ generation logic because we built `createEmbedding` to be versatile and flexible,\
    \ as the process of generating an embedding is essentially the same regardless\
    \ of the input source. The primary difference is what the final output of the\
    \ `createEmbedding` function is, and we can see that in the following code snippet\
    \ from that function:\n\n[implementing_vector_generation_service/createEmbedding.js](http://media.pragprog.com/titles/bgvector/code/implementing_vector_generation_service%2FcreateEmbedding.js)\n\
    \n```javascript\nif (type === 'article') {\n  await saveEmbedding(identifier,\
    \ embedding, type);\n  console.log(`Successfully saved embedding for article ID:\
    \ ${identifier}`);\n} else if (type === 'query') {\n  console.log(`Generated embedding\
    \ for query with ID: ${identifier}`);\n  return embedding;\n}\n```\n\nThis snippet\
    \ shows that the function can differentiate between an article and a query based\
    \ on the `type` parameter. For an article, the system saves the embedding to the\
    \ database using `saveEmbedding`, while it returns the embedding to the caller\
    \ for a query. This flexibility allows us to seamlessly integrate the embedding\
    \ generation process into the search service without duplicating code or creating\
    \ unnecessary complexity.\n\nIf you’re eager to test how query embeddings are\
    \ generated before wiring them into the full search flow, you can run a quick\
    \ CLI utility we’ve prepared for that purpose. Before running it, make sure you’ve\
    \ set your OpenAI API key in a `.env` file at the root of the project or in your\
    \ shell environment using the variable `OPENAI_API_KEY`.\n\n[creating_vector_search_service/testEmbeddingCLI.js](http://media.pragprog.com/titles/bgvector/code/creating_vector_search_service%2FtestEmbeddingCLI.js)\n\
    \n```javascript\nimport 'dotenv/config';\nimport readline from 'readline';\nimport\
    \ { createEmbedding } from '../embeddings/createEmbedding.js';\nimport { ValidationError\
    \ } from '../utils/errorHandlers.js';\n\nconst rl = readline.createInterface({\n\
    \  input: process.stdin,\n  output: process.stdout,\n});\n\nrl.question('Enter\
    \ a search query: ', async (query) => {\n  try {\n    if (!query) {\n      throw\
    \ new ValidationError('Query content is missing', 'query');\n    }\n    const\
    \ embedding = await createEmbedding('cli-test-query', query, 'query');\n    console.log('\\\
    nFirst 5 dimensions of the embedding:\\n');\n    console.log(embedding.slice(0,\
    \ 5).map(n => n.toFixed(4)).join(', ') + '...');\n  } catch (error) {\n    console.error('Error\
    \ generating embedding:', error.message);\n  } finally {\n    rl.close();\n  }\n\
    });\n```\n\nTo run the CLI utility, execute the following command in your terminal:\n\
    \n```bash\nnode testEmbeddingCLI.js\n```\n\nEnter a search query when prompted.\
    \ The script generates an embedding using the OpenAI API and prints the first\
    \ few dimensions of the resulting vector. This gives you a quick, firsthand look\
    \ at what embedding a query looks like before you integrate it into the broader\
    \ search system.\n\nAfter generating a query embedding from the command line,\
    \ you can now integrate that functionality into the service layer. Build out the\
    \ code in `embedQuery.js` to move one step closer to a fully functional vector\
    \ search service.\n\n[creating_vector_search_service/embedQuery.js](http://media.pragprog.com/titles/bgvector/code/creating_vector_search_service%2FembedQuery.js)\n\
    \n```javascript\nimport { createEmbedding } from '../embeddings/createEmbedding';\n\
    import { performSearch } from './performSearch';\nimport { ValidationError } from\
    \ '../utils/errorHandlers';\n\n/**\n * Embeds a user query and performs a search.\n\
    \ * @param {string} queryId - The unique ID for the query.\n * @param {string}\
    \ query - The query entered by the user.\n * @returns {Promise<object>} - The\
    \ search results\n */\nconst embedSearch = async (queryId, query) => {\n  try\
    \ {\n    if (!query) {\n      throw new ValidationError('Query content is missing',\
    \ 'query');\n    }\n    const queryEmbedding = await createEmbedding(queryId,\
    \ query, 'query');\n    const searchResults = await performSearch(queryEmbedding);\n\
    \    return searchResults;\n  } catch (error) {\n    if (error instanceof ValidationError)\
    \ {\n      console.error(`Validation Error: ${error.message}`);\n    } else {\n\
    \      console.error(`Error: ${error.message}`);\n    }\n    throw error;\n  }\n\
    };\n\nexport { embedSearch };\n```\n\nThe `embedSearch` function is the entry\
    \ point for embedding a user query and performing the search. First, it validates\
    \ the query content to ensure it’s not empty. If it passes validation, it calls\
    \ `createEmbedding` to generate the query embedding and then passes the new embedding\
    \ to `performSearch` to find the most relevant articles. If an error occurs during\
    \ the process, the system catches and handles it appropriately to remain robust\
    \ and user-friendly.\n\nSpeaking about validation, you may have noticed we included\
    \ a `ValidationError` class in the error handling, but we have not yet written\
    \ the code for it. This will be a new custom error class similar to the others\
    \ we have defined, like `EmbeddingServiceError`. Let’s implement that now by reopening\
    \ the `errorHandlers.js` file in `utils/` and adding the following code after\
    \ the existing error classes:\n\n[creating_vector_search_service/errorHandlers.js](http://media.pragprog.com/titles/bgvector/code/creating_vector_search_service%2FerrorHandlers.js)\n\
    \n```javascript\nclass ValidationError extends Error {\n  constructor(message)\
    \ {\n    super(message);\n    this.name = 'ValidationError';\n    Error.captureStackTrace(this,\
    \ this.constructor);\n  }\n}\n```\n\nMake sure to add the new `ValidationError`\
    \ to the export statement at the end of the file to make it accessible to other\
    \ application parts like `embedQuery.js`. With this new error class in place,\
    \ we can now handle validation errors in a more structured and consistent manner,\
    \ improving the overall reliability of our system.\n"
