    # 第 9 章：集成向量搜索功能


    你已经取得了巨大的进展。在学习旅程的现在，你已经在一个健壮的 Node.js 后端构建了一个功能完整的向量搜索工具，探索了向量搜索背后的理论，并学习了驱动它的数学知识和算法。为你已经取得的成就感到自豪吧。


    在剩下的章节中，我们将专注于为实际应用场景集成并优化你的向量搜索功能。本章将通过向你的后端添加搜索 API 开启这一过程。我们将涵盖速率限制、错误处理以及请求和响应的结构化，以确保流畅且高效的搜索体验。到结束时，你将拥有一个基于你创建的向量搜索服务构建的完整搜索
    API。


    ## 理解当前的 API 服务层


    我们应用程序的 API 服务层充当客户端界面与后端功能之间的桥梁。它的设计用于管理用户请求、执行安全策略并高效地处理数据事务。当我们准备将向量搜索 API
    集成到此架构时，你必须理解当前 API 结构是如何工作的。


    每个路由文件都使用 `Express Router` 实例来定义和分组端点。例如，在 `articleRoutes.js` 中，我们看到了 `/feed`
    和 `:slug` 等端点的路由。每个路由将端点与 `articlesController.js` 文件中的特定控制器函数关联，该函数封装了每个操作所需的业务逻辑。


    安全性是 API 服务层至关重要的一个方面，特别是在涉及用户身份验证和授权的应用程序中。为此，应用程序使用如 `verifyJWT` 等中间件函数对特定路由实施访问控制。位于
    `middleware/` 文件夹的 `verifyJWT` 中间件会检查每个传入请求授权头中是否存在有效的 JSON Web Token (JWT)。如果令牌有效，则验证用户身份，并在随后的控制器函数中使其详细信息可访问。


    这种模块化结构在我们在本章中继续后续设计和实现向量搜索功能的搜索 API 时将大有裨益。我们将为搜索功能创建一个专门的路由文件，并定义允许用户执行基于向量搜索的端点。通过保持路由、控制器和中间件之间清晰的分离，我们可以在不破坏现有架构的情况下集成此新功能。


    如果这些文字内容很多，那么现在是时候通过可视化来帮助你理解 API 服务层的结构了。请查看下面的图，以了解路由、控制器和中间件在我们应用程序的 API 服务层内部是如何相互作用的。


    ![API 服务层流程](img/api_service_layer_flow.png "API Service Layer Flow")


    有了这个基础，我们准备好探索设计新搜索功能的细节。在接下来的页面中，我们将探索如何添加专门的向量搜索 API 端点，将其无缝集成到此架构中，并利用我们的向量搜索索引提供快速、相关的搜索结果。让我们开始设计新的搜索端点吧。


    ## 设计搜索 API 端点


    API 端点将作为网关，用户通过它提交搜索查询，并根据我们之前在 Couchbase 中设置的向量搜索索引接收相关的结果。设计此端点不仅仅是返回结果；它关乎构建一个用户友好、高效且健性的搜索体验，以满足性能和安全预期。


    我们将为搜索端点使用 `POST` 方法，允许我们在请求体中传递如 `query`、`limit` 和 `offset` 等搜索参数。在请求体中传递参数为处理在
    URL 中会很繁琐的长查询和过滤器提供了灵活性。


    尽管 `POST` 在 REST API 中通常不是幂等的，但我们的搜索端点仍然应该以幂等的方式运行。如果多次发送一个请求产生的结果与发送一次相同，则该请求被认为是等幂等的。在搜索情况下，重复的相同请求应该返回相同的结果，而不会产生副作用或更改服务器状态。


    为了支持幂等性，我们将设计搜索 API 为无状态的。每个请求都将独立运行，仅使用提供的参数，且不依赖于任何之前的请求。无状态的方法确保了重试或重复调用始终返回一致、可预测的结果。


    接下来，让我们检查请求负载的结构以及我们期望收到的参数。


    我们搜索端点的主要参数是 `query`，即用户的搜索字符串。系统将此字符串转换为向量嵌入，并将其与存储的嵌入进行比较。可选参数如 `limit` 和 `offset`
    支持分页并控制结果大小，使端点对于快速查找和深度浏览都具有灵活性。


    响应将是一个结构化的 JSON 对象，包含按相似性排序的文章数组。每个结果都将包含元数据，如 `title`、`summary` 和 `similarity
    score`，帮助前端展示有利且相关的结果。


    用户并不完美，我们为他们构建的系统也是。我们的 API 必须优雅地处理错误，无论是由于意外输入还是恶意行为。它将返回有意义的错误信息和适当的状态码以提供清晰的反馈。例如，如果
    `query` 参数缺失或格式错误，系统将返回 `400 Bad Request`。如果发生服务器错误，API 将响应 `500 Internal Server
    Error` 并在后端记录细节以便进一步分析。


    正如我们所讨论过的，生成嵌入和计算相似性评分是资源密集型的。为了防止滥用并保护性能，我们将在搜索 API 上实施速率限制。这限制了用户在给定时间内可以发出的请求次数，确保公平使用。通过实施合理的限制，我们保持了
    API 的响应能力，减轻了后端压力，并更有效地管理了资源消耗。


    让我们看看新向量搜索端点的结构视觉流程。图表 提供了请求和响应流程的高级概述，阐明了处理搜索查询时的关键组件和交互。


    ![搜索 API 端点流程](img/api_search_endpoint_flow.png "Search API Endpoint Flow")


    此图捕捉了搜索 API 的请求-响应周期。客户端通过 `POST` 请求发送搜索查询，查询首先通过输入验证。验证后，搜索查询将经过处理、转换为向量嵌入并发送到我们的向量索引。数据库服务执行相似性计算并返回匹配结果，随后
    API 将这些结果结构化为用户友好的 JSON 格式发送回客户端。


    在对端点的目的和流程有了清晰理解后，我们准备好进入实际实现阶段。这项工作将使我们的理论设计变为现实，为我们的应用程序用户提供实时、高效的向量搜索。


