    created_at\": \"2024-01-01T00:00:00Z\",\n  \"updated_at\": \"2024-05-01T00:00:00Z\"\
    \n}\n```\n\nThe `User` class represents a user record in your database. You can\
    \ create a new `User` object, set its properties, and save it to the database.\
    \ The `ORM` library handles translating the object into a database query. This\
    \ is a high-level overview of how an `ORM` works and why it can be helpful in\
    \ application development.\n\nOne of the biggest advantages of using an `ORM`\
    \ is how it simplifies querying data. Rather than writing raw queries or complex\
    \ database calls, an `ORM`, like `Ottoman`, lets you use familiar JavaScript methods\
    \ and chaining to express what you’re looking for. This is especially helpful\
    \ when querying nested or hierarchical data common in `JSON` document databases.\
