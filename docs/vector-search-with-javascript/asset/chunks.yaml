    \nCopyright © 2025, The Pragmatic Bookshelf.\n\n# Chapter 6: Building the Vector\
    \ Embedding Generation Service\n\nIn the last chapter, we laid the foundation\
    \ for vector search by structuring the back end and defining the core data models.\
    \ It’s time to bring that structure to life with functionality that can generate\
    \ vector embeddings from article content.\n\nThis chapter will walk you through\
    \ building a service that transforms plain text into high-dimensional vectors\
    \ that make vector search possible.\n\n## Structuring the Embedding Service\n\n\
    The vector embedding generation service will generate embeddings for articles\
    \ and store them in the database. This service will be a critical component of\
    \ the blog platform, as it will be the foundation for enabling users to search\
    \ for articles based on semantic similarity and relevance.\n\nThe `services/`\
    \ folder at the project’s root will contain all the vector embedding creation\
    \ and search functionality. The contents of this folder are where we’ll define\
    \ the logic for generating embeddings, storing them in the database, and performing\
    \ similarity searches. Let’s start by first properly structuring the `services/`\
    \ folder to maintain separation of concerns and keep the code organized.\n\nWhen\
    \ we think about the operations of the vector search service in the application,\
    \ we can break it down into its distinct components:\n\n* New article or edit\
    \ an existing article:\n    * Generate a vector embedding for the article.\n \
    \   * Save the vector embedding to the database.\n* User search query:\n    *\
    \ Generate a vector embedding for the search query.\n    * Perform a similarity\
    \ search in the database.\n\nWe also introduce a couple of utilities to help us\
    \ with vector operations; namely, we’ll wish to help with the following:\n\n*\
    \ Validating text input for generating embeddings.\n* Handling errors that may\
    \ occur during the vector operations.\n\nLastly, we’ll need a client to interact\
    \ with the OpenAI API to generate embeddings. You started creating a `services/`\
    \ folder earlier, but now, let’s put it all together. With these components in\
    \ mind, let’s structure the `services/` folder as follows:\n\n| | services/ |\n\
    | :--- | :--- |\n| | ├── clients/ |\n| | │ ├── couchbaseClient.js |\n| | │ ├──\
    \ openaiClient.js |\n| | ├── embeddings/ |\n| | │ ├── createEmbedding.js |\n|\
    \ | │ ├── saveEmbedding.js |\n| | ├── search/ |\n| | │ ├── embedQuery.js |\n|\
    \ | │ ├── performSearch.js |\n| | ├── utils/ |\n| | │ ├── errorHandlers.js |\n\
    | | │ ├── validateText.js |\n\nIt may be helpful to see the flow of interactions\
    \ between these components for the two most common use cases, which are creating\
    \ embeddings for articles and performing searches based on user queries. Let’s\
    \ visualize the flow for these operations as shown in the [diagram](#f_0043.xhtml_fig.ch6.1).\n\
    \n![Embedding Process through Files Flow](images/mermaid_graphs/embedding_process_through_files_flow.png\
    \ \"Embedding Process through Files Flow\")\n\nThe flow for a new article begins\
    \ when the application passes the article content to `validateText.js` to ensure\
    \ it meets quality standards before proceeding. If the input passes validation,\
    \ `createEmbedding.js` invokes the OpenAI client via `openaiClient.js` to generate\
    \ a vector embedding. The resulting embedding is then stored using `saveEmbedding.js`,\
    \ which handles the database operations. Throughout this process, `errorHandlers.js`\
    \ ensures any issues are handled gracefully.\n\nThe user query flow starts when\
    \ the application receives a search query and passes it to `embedQuery.js` to\
    \ generate a vector embedding for the search text. The code then uses the OpenAI\
    \ client to create this query embedding. It passes the embedding to `performSearch.js`,\
    \ which runs a similarity search against the stored article embeddings to find\
    \ relevant results. Like the article flow, the process includes validation and\
    \ error handling to ensure smooth operation and accurate search results.\n\n##\
    \ Building the Utilities\n\nBefore we dive into the core functionality of the\
    \ vector embedding generation service, we’ll start by building the utilities that\
    \ handle text validation and error management. These tools ensure the system performs\
    \ vector operations correctly and responds gracefully to errors.\n\nThe `services/utils/`\
    \ folder at the project’s root will contain the utilities. This folder will include\
    \ the logic for validating text input and handling errors. Let’s start by creating\
    \ the `services/utils/` folder and structuring it as follows:\n\n| | utils/ |\n\
    | :--- | :--- |\n| | ├── validateText.js |\n| | ├── errorHandlers.js |\n\nNext,\
    \ we create the `validateText.js` functionality.\n\n### Validating Text Input\n\
    \nThe `validateText.js` utility will validate text input before generating vector\
    \ embeddings. This utility ensures that the text input meets the requirements\
    \ for generating embeddings and appropriately handles errors.\n\nYou might wonder\
    \ why validating text input matters before generating embeddings. Besides general\
    \ data quality and security concerns, generating vector embeddings involves real\
    \ computational and financial costs. Validation ensures we generate embeddings\
    \ only for meaningful, expected input.\n\nHere’s an example of what the `validateText.js`\
    \ utility might look like. The actual validations you’ll want in your application\
    \ may vary, but this should give you a starting point:\n\n```javascript\nimport\
    \ { ValidationError } from './errorHandlers';\n\nconst validateText = (text) =>\
    \ {\n  if (typeof text !== 'string') {\n    throw new ValidationError('Input must\
    \ be a string');\n  }\n  if (text.trim() === '') {\n    throw new ValidationError('Input\
    \ cannot be empty or just whitespace');\n  }\n  const maxLength = 5000; // Adjust\
    \ as necessary\n  if (text.length > maxLength) {\n    throw new ValidationError(`Input\
    \ exceeds maximum length of ${maxLength} characters`);\n  }\n  // Define a minimum\
    \ length for the text\n  const minLength = 5; // Adjust as necessary\n  if (text.length\
    \ < minLength) {\n    throw new ValidationError(`Input text is too short, must\
    \ be at least ${minLength} characters`);\n  }\n  // Check for repetitive content\
    \ (such as too many duplicate words)\n  const words = text.split(' ');\n  const\
    \ uniqueWords = new Set(words);\n  // More than 70% repetitive words\n  if (uniqueWords.size\
    \ / words.length < 0.3) {\n    throw new ValidationError('Input text is too repetitive');\n\
    \  }\n  // Check for excessive punctuation\n  const excessivePunctuationRegex\
    \ = /[!?..*]{5,}/;\n  if (excessivePunctuationRegex.test(text)) {\n    throw new\
    \ ValidationError('Input text contains excessive punctuation');\n  }\n  return\
    \ true;\n};\n\nexport default validateText;\n```\n"
  raw: "[[18]](#f_0040.xhtml_FNPTR-18)\n\n[http://www.catb.org/esr/writings/taoup/html/ch01s06.html#rule5](http://www.catb.org/esr/writings/taoup/html/ch01s06.html#rule5)\n\
    \n[[19]](#f_0040.xhtml_FNPTR-19)\n\n[https://www.npmjs.com/package/slugify](https://www.npmjs.com/package/slugify)\n\
    \nCopyright © 2025, The Pragmatic Bookshelf.\n\n# Chapter 6\n\nBuilding the Vector\
    \ Embedding Generation Service\n\nIn the last chapter, we laid the foundation\
    \ for vector search by structuring the back end and defining the core data models.\
    \ It’s time to bring that structure to life with functionality that can generate\
    \ vector embeddings from article content.\n\nThis chapter will walk you through\
    \ building a service that transforms plain text into high-dimensional vectors\
    \ that make vector search possible.\n\n## Structuring the Embedding Service\n\n\
    The vector embedding generation service will generate embeddings for articles\
    \ and store them in the database. This service will be a critical component of\
    \ the blog platform, as it will be the foundation for enabling users to search\
    \ for articles based on semantic similarity and relevance.\n\nThe services/ folder\
    \ at the project’s root will contain all the vector embedding creation and search\
    \ functionality. The contents of this folder are where we’ll define the logic\
    \ for generating embeddings, storing them in the database, and performing similarity\
    \ searches. Let’s start by first properly structuring the services/ folder to\
    \ maintain separation of concerns and keep the code organized.\n\nWhen we think\
    \ about the operations of the vector search service in the application, we can\
    \ break it down into its distinct components.\n\n*   New article or edit an existing\
    \ article:\n\n    *   Generate a vector embedding for the article.\n\n    *  \
    \ Save the vector embedding to the database.\n\n*   User search query:\n\n   \
    \ *   Generate a vector embedding for the search query.\n\n    *   Perform a similarity\
    \ search in the database.\n\nWe also introduce a couple of utilities to help us\
    \ with vector operations; namely, we’ll wish to help with the following:\n\n*\
    \   Validating text input for generating embeddings.\n\n*   Handling errors that\
    \ may occur during the vector operations.\n\nLastly, we’ll need a client to interact\
    \ with the OpenAI API to generate embeddings. You started creating a services/\
    \ folder earlier, but now, let’s put it all together. With these components in\
    \ mind, let’s structure the services/ folder as follows:\n\n| ​  | services/ |\n\
    \n| ​  | ├── clients/ |\n\n| ​  | │ ├── couchbaseClient.js |\n\n| ​  | │ ├── openaiClient.js\
    \ |\n\n| ​  | ├── embeddings/ |\n\n| ​  | │ ├── createEmbedding.js |\n\n| ​  |\
    \ │ ├── saveEmbedding.js |\n\n| ​  | ├── search/ |\n\n| ​  | │ ├── embedQuery.js\
    \ |\n\n| ​  | │ ├── performSearch.js |\n\n| ​  | ├── utils/ |\n\n| ​  | │ ├──\
    \ errorHandlers.js |\n\n| ​  | │ ├── validateText.js |\n\nIt may be helpful to\
    \ see the flow of interactions between these components for the two most common\
    \ use cases, which are creating embeddings for articles and performing searches\
    \ based on user queries. Let’s visualize the flow for these operations as shown\
    \ in the [diagram](#f_0043.xhtml_fig.ch6.1).\n\n![Embedding Process through Files\
    \ Flow](images/mermaid_graphs/embedding_process_through_files_flow.png \"Embedding\
    \ Process through Files Flow\")\n\nThe flow for a new article begins when the\
    \ application passes the article content to validateText.js to ensure it meets\
    \ quality standards before proceeding. If the input passes validation, createEmbedding.js\
    \ invokes the OpenAI client via openaiClient.js to generate a vector embedding.\
    \ The resulting embedding is then stored using saveEmbedding.js, which handles\
    \ the database operations. Throughout this process, errorHandlers.js ensures any\
    \ issues are handled gracefully.\n\nThe user query flow starts when the application\
    \ receives a search query and passes it to embedQuery.js to generate a vector\
    \ embedding for the search text. The code then uses the OpenAI client to create\
    \ this query embedding. It passes the embedding to performSearch.js, which runs\
    \ a similarity search against the stored article embeddings to find relevant results.\
    \ Like the article flow, the process includes validation and error handling to\
    \ ensure smooth operation and accurate search results.\n\n### Building the Utilities\n\
    \nBefore we dive into the core functionality of the vector embedding generation\
    \ service, we’ll start by building the utilities that handle text validation and\
    \ error management. These tools ensure the system performs vector operations correctly\
    \ and responds gracefully to errors.\n\nThe services/utils/ folder at the project’s\
    \ root will contain the utilities. This folder will include the logic for validating\
    \ text input and handling errors. Let’s start by creating the services/utils/\
    \ folder and structuring it as follows:\n\n| ​  | utils/ |\n\n| ​  | ├── validateText.js\
    \ |\n\n| ​  | ├── errorHandlers.js |\n\nNext, we create the validateText.js functionality.\n\
    \n#### Validating Text Input\n\nThe validateText.js utility will validate text\
    \ input before generating vector embeddings. This utility ensures that the text\
    \ input meets the requirements for generating embeddings and appropriately handles\
    \ errors.\n\nYou might wonder why validating text input matters before generating\
    \ embeddings. Besides general data quality and security concerns, generating vector\
    \ embeddings involves real computational and financial costs. Validation ensures\
    \ we generate embeddings only for meaningful, expected input.\n\nHere’s an example\
    \ of what the validateText.js utility might look like. The actual validations\
    \ you’ll want in your application may vary, depending on your requirements, but\
    \ this example should give you a good starting point:\n\n[implementing_vector_generation_service/validateText.js](http://media.pragprog.com/titles/bgvector/code/implementing_vector_generation_service%2FvalidateText.js)\n\
    \n| ​  | ​**import**​ { ValidationError } ​**from**​ ​*'./errorHandlers'*​; |\n\
    \n| ​  |  |\n\n| ​  | ​**const**​ validateText = (text) => { |\n\n| ​  | ​**if**​\
    \ (​**typeof**​ text !== ​*'string'*​) { |\n\n| ​  | ​**throw**​ ​**new**​ ValidationError(\
    \ |\n\n| ​  | ​*'Input must be a string'*​ |\n\n| ​  | ); |\n\n| ​  | } |\n\n\
    | ​  |  |\n\n| ​  | ​**if**​ (text.trim() === ​*''*​) { |\n\n| ​  | ​**throw**​\
    \ ​**new**​ ValidationError( |\n\n| ​  | ​*'Input cannot be empty or just whitespace'*​\
    \ |\n\n| ​  | ); |\n\n| ​  | } |\n\n| ​  |  |\n\n| ​  | ​**const**​ maxLength\
    \ = 5000; ​*// Adjust as necessary*​ |\n\n| ​  | ​**if**​ (text.length > maxLength)\
    \ { |\n\n| ​  | ​**throw**​ ​**new**​ ValidationError( |\n\n| ​  | ​*`Input text\
    \ exceeds maximum length of* ​${maxLength}​ *characters`*​ |\n\n| ​  | ); |\n\n\
    | ​  | } |\n\n| ​  |  |\n\n| ​  | ​*// Define a minimum length for the text*​\
    \ |\n\n| ​  | ​**const**​ minLength = 5; ​*// Adjust as necessary*​ |\n\n| ​ \
    \ | ​**if**​ (text.length < minLength) { |\n\n| ​  | ​**throw**​ ​**new**​ ValidationError(\
    \ |\n\n| ​  | ​*`Input text is too short, must be at least* ​${minLength}​ *characters`*​\
    \ |\n\n| ​  | ); |\n\n| ​  | } |\n\n| ​  |  |\n\n| ​  | ​*// Check for repetitive\
    \ content (such as too many duplicate words)*​ |\n\n| ​  | ​**const**​ words =\
    \ text.split(​*' '*​); |\n\n| ​  | ​**const**​ uniqueWords = ​**new**​ Set(words);\
    \ |\n\n| ​  | ​*// More than 70% repetitive words*​ |\n\n| ​  | ​**if**​ (uniqueWords.size\
    \ / words.length < 0.3) { |\n\n| ​  | ​**throw**​ ​**new**​ ValidationError( |\n\
    \n| ​  | ​*'Input text is too repetitive'*​ |\n\n| ​  | ); |\n\n| ​  | } |\n\n\
    | ​  |  |\n\n| ​  | ​*// Check for excessive punctuation*​ |\n\n| ​  | ​**const**​\
    \ excessivePunctuationRegex = ​*/*​​*[*​​*!?.*​​*]{5,}*​​*/*​; |\n\n| ​  | ​**if**​\
    \ (excessivePunctuationRegex.test(text)) { |\n\n| ​  | ​**throw**​ ​**new**​ ValidationError(\
    \ |\n\n| ​  | ​*'Input text contains excessive punctuation'*​ |\n\n| ​  | ); |\n\
    \n| ​  | } |\n\n| ​  |  |\n\n| ​  | ​**return**​ ​**true**​; |\n\n| ​  | }; |\n\
    \n| ​  |  |\n\n| ​  | ​**export**​ ​**default**​ validateText; |"
