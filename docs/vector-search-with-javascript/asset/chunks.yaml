  trans: "\n\n很多时候，当我兴奋于构建新事物时，我会直接开始写代码。后来，在经历了比我愿意承认更多的重构之后，我意识到我本应该先规划数据结构。\n\n\
    也许用一句拉丁语最能表达这一点：\n\n> Carpe datum—抓住数据！\n\n或者，可以回溯 Rob Pike 在其 1989 年的论文《C 语言编程笔记》中编写的经典编程“规则”之一：\n\
    \n规则 5。数据主宰一切。如果你选择了正确的数据结构并良好地组织了内容，那么算法几乎是显而易见的。数据结构而非算法，才是编程的核心。\n\n本着这种精神，在构建向量嵌入服务并提交代码之前，我们将花一点时间对数据进行建模。深思的数据建模是以后实现有意义向量操作的关键。虽然此项目包含了用户、文章、标签和评论的标准模型，但我们只涉及与向量搜索最相关的部分。\n\
    \n在我们正在构建的博客平台中，将拥有以下实体：\n\n* 用户 (Users)\n* 文章 (Articles)\n* 标签 (Tags)\n* 评论 (Comments)\n\
    \n每个实体都具有特定的属性，用于定义它们以及与其他实体的关系。让我们来看文章模型，它是与平台向量搜索功能关联密切的模型。\n\n### 定义文章模型 (Article\
    \ Model)\n\n文章模型将代表平台上的博客文章。用户将创建文章、为文章添加标签并对文章发表评论。文章模型将存储每篇文章的信息，例如标题、正文、作者、标签和评论。文章模型还将与用户实体建立关系（因为每篇文章都有作者），并与标签实体建立关系（因为每篇文章可以多个标签）。\n\
    \n文章模型具有以下属性：\n\n* `id`: 文章的唯一标识符。\n* `slug`: 文章的唯一 slug，衍生自标题。\n* `title`: 文章的标题。\n\
    * `description`: 文章的简短描述或摘要。\n* `body`: 文章的正文或内容。\n* `author`: 文章作者的 ID ID。\n\
    * `tagList`: 与文章关联的标签 ID 数组。\n* `comments`: 文章下评论的评论 ID 数组。\n* `favoritesCount`:\
    \ 将该文章选为收藏的用户数量。\n\n查看 `author` 属性，我们可以看到它是用户 ID，在文章实体和用户实体之间建立了关系。`comments`\
    \ 属性是评论 ID 数组，在文章实体和评论实体之间建立了关系。同样，`tagList` 属性是标签 ID 数组，在文章实体和标签实体之间建立了关系。正如我们在描述用户模型时做的那样，让我们将文章模型及其关系可视化，以进一步理解数据模型：\n\
    \n![Article Model](img/article_model.png \"Article Model\")\n\n现在我们对文章实体的数据模型有了良好的理解，让我们使用\
    \ Ottoman.js 编写代码来定义文章模型。在 `models/` 文件夹中创建一个名为 `Article.js` 的新文件并导入必要的依赖：\n\n\
    ```javascript\nimport { Schema, model, getModel } from 'ottoman';\nimport slugify\
    \ from 'slugify';\n```\n\n在前面的代码中，我们正在从 Ottoman.js（一个 JavaScript 库）导入函数和模块，以帮助我们从模型与数据库交互，即\
    \ `Schema`、`model` 和 `getModel` 函数。你还会注意到对文章模型有一个独特的导入，即 `slugify` 库。该库将帮助我们根据标题为文章生成唯一的\
    \ slug。所有这些导入都是我们将在本文末尾创建的 `couchbaseClient` 的。\n\n接下来，让我们使用 Ottoman.js 的语法定义文章模型的架构：\n\
    \n```javascript\nconst articleSchema = new Schema({\n  slug: {\n    type: String,\n\
    \    unique: true,\n    lowercase: true,\n    index: true,\n  },\n  title: {\n\
    \    type: String,\n    required: true,\n  },\n  description: {\n    type: String,\n\
    \    required: true,\n  },\n  body: {\n    type: String,\n    required: true,\n\
    \  },\n  // 创建一个标签数组，默认为空数组\n  // 使用 () => [] 而不是 []是为了避免共享引用\n  tagList: {\n\
    \    type: [{ type: String, ref: 'Tag' }],\n    default: () => [],\n  },\n  author:\
    \ {\n    type: String,\n    ref: 'User',\n  },\n  favoritesCount: {\n    type:\
    \ Number,\n    default: 0,\n  },\n  // 评论存储为指向文档的引用数组\n  // 再次，默认是一个返回新数组的函数\n\
    \  comments: {\n    type: [{ type: String, ref: 'Comment' }],\n    default: ()\
    \ => [],\n  },\n  embedding: {\n    type: [Number],\n    default: () => [],\n\
    \  },\n}, {\n  timestamps: true,\n});\n\n// 在保存更新之前，根据新标题重新生成 slug\n// 这确保了标题更改时\
    \ slug 保持同步\narticleSchema.pre('update', function (document) {\n  document.slug\
    \ = slugify(document.title, {\n    lower: true,\n    replacement: '-',\n  });\n\
    });\n\n// 将文章实例转换为用于 API 输出的响应对象，\n// 包括作者资料和收藏状态\narticleSchema.methods.toArticleResponse\
    \ = async function (user) {\n  const User = getModel('User');\n  const authorObj\
    \ = await User.findById(this.author);\n  return {\n    slug: this.slug,\n    articleSlug:\
    \ this.slug,\n    title: this.title,\n    description: this.description,\n   \
    \ body: this.body,\n    createdAt: this.createdAt,\n    updatedAt: this.updatedAt,\n\
    \    tagList: this.tagList,\n    favorited: user ? user.isFavorite(this.id) :\
    \ false,\n    favoritesCount: this.favoritesCount,\n    author: authorObj.toProfileJSON(user)\n\
    \  };\n};\n\n// 将评论引用添加到文章评论数组中，\n// 如果尚未存在\narticleSchema.methods.addComment\
    \ = async function (commentId) {\n  if (this.comments.indexOf(commentId) === -1)\
    \ {\n    this.comments.push(commentId);\n  }\n  return this.save();\n};\n\n//\
    \ 从文章评论数组中移除评论引用，\n// 如果存在\narticleSchema.methods.removeComment = async function\
    \ (commentId) {\n  const idx = this.comments.indexOf(commentId);\n  if (idx !==\
    \ -1) {\n    this.comments.splice(idx, 1);\n  }\n  return this.save();\n};\n```\n\
    \n"
