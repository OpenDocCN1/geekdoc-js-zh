    \   password: process.env.COUCHBASE_PASSWORD,\n  });\n  await startOttoman();\n\
    \n  clusterInstance = await couchbase.connect(\n    process.env.COUCHBASE_CONNECTION_STRING,\n\
    \    {\n      username: process.env.COUCHBASE_USERNAME,\n      password: process.env.COUCHBASE_PASSWORD,\n\
