  raw: 'The second key step is transforming blog content into vector embeddings, allowing
    us to perform similarity searches. We’ll also transform users’ queries into vector
    embeddings to search the content. The generation of a new embedding for every
    query needs to happen quickly, so we’ll need to consider performance and make
    sure that the process takes as little time as possible. Recent research into user
    behavior shows that 40 percent of users will leave a website if a response takes
    more than three seconds to load.^([[12]](#f_0037.xhtml_FOOTNOTE-12)) That’s a
    lot of pressure, so we need to ensure the platform we choose and the SDK we build
    with can handle the load.


    The transformation of the content into embeddings can happen at the time of content
    creation, so we’ll also need to establish criteria for when to update embeddings
    as authors add new content. For example, does every edit warrant a revised embedding?
    Or only certain edits? These are questions we’ll need to answer as we build out
    the functionality of the blog platform. For now, it’s safe to say that a single
    typo correction probably shouldn’t trigger a new embedding generation. Or should
    it? We’ll leave that for later on as we discuss optimizing search results and
    other more advanced topics.


    The last application management area we’ll rely on is environment variables. Environment
    variables are set outside your application to configure it at runtime. They store
    sensitive data, such as API keys or database connection strings, keeping this
    information out of your codebase. Using environment variables makes your application
    secure and easily configurable across different environments.


    I would be remiss if I didn’t mention the obligatory security warning. When working
    with environment variables, it’s important that you do not commit sensitive information
    to your version control system. Always add your environment variables to a .env
    file and include that file in your .gitignore to prevent it from being committed.
    This will help keep your sensitive information secure during development.


    For production environments, however, storing secrets in a .env file is not recommended.
    Instead, use a secure method such as injecting environment variables from a secrets
    manager at runtime or reading them from a mounted secrets location provided by
    your cloud platform or container orchestration system. This adds an extra layer
    of protection and ensures your secrets are handled safely in production.


    With that background on the why and what of our dependencies, let’s specify the
    dependencies we’ll be installing for our project. We’ll be using the following
    libraries and tools to build our blog platform:


    *   Ottoman.js:^([[13]](#f_0037.xhtml_FOOTNOTE-13)) A Node.js ORM library (to
    be more precise, an ODM library since we are working with JSON documents for our
    data and not a relational model) for Couchbase that will allow us to interact
    with the Couchbase database using objects.


    *   OpenAI Node.js SDK:^([[14]](#f_0037.xhtml_FOOTNOTE-14)) The official Node.js
    SDK for the OpenAI API that will allow us to generate vector embeddings for the
    content and user queries in our blog platform.


    *   dotenv:^([[15]](#f_0037.xhtml_FOOTNOTE-15)) A zero-dependency module that
    loads environment variables from a .env file into process.env to keep our sensitive
    information secure.


    To install these three dependencies, you can run the following command in the
    root directory of your project:


    | ​  | npm install ottoman openai dotenv |


    You can verify that npm installed the dependencies correctly by checking the package.json
    file or by running the following command:


    | ​  | npm list |


    Upon running npm list, you’ll see an output similar to this one:


    | ​  | vector-blog-platform@1.0.0 /path/to/your/project |


    | ​  | ├── dotenv@16.4.5 |


    | ​  | ├── openai@4.58.2 |


    | ​  | └── ottoman@2.5.0 |


    This output shows the dependencies were installed successfully and are now available
    for use in your project. With the dependencies installed, you are now ready to
    start building out the functionality of your blog platform!


    ## Key Takeaways


    In this chapter, you laid the groundwork for building a vector search application
    by setting up your development environment and preparing the tools and structure
    needed to support vector embedding workflows.


    Here’s a quick summary of what you’ve accomplished so far and what to carry forward
    as we begin implementing vector search in your application:


    *   You set up your development environment by installing Node.js, scaffolding
    your project structure, and selecting a suitable vector database.


    *   You learned that vector embeddings are unstructured, high-dimensional data
    that require specialized indexing to enable fast and accurate search.


    *   You explored the types of databases that can store vector data, including
    document, graph, and relational databases, and understood why document databases
    are a strong fit.


    *   You installed and configured core dependencies, including an ORM (Ottoman),
    the OpenAI SDK for embedding generation, and dotenv for environment variable management.


    In the next chapter, we’ll begin implementing the search functionality in our
    Node.js application. We’ll cover how to query our vector database for similar
    embeddings and return relevant results to the user.


