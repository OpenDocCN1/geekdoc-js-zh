  trans: "\n\n[[18]](#f_0040.xhtml_FNPTR-18)\n[`www.catb.org/esr/writings/taoup/html/ch01s06.html#rule5`](http://www.catb.org/esr/writings/taoup/html/ch01s06.html#rule5)\n\
    [[19]](#f_0040.xhtml_FNPTR-19)\n[`www.npmjs.com/package/slugify`](https://www.npmjs.com/package/slugify)\n\
    \nCopyright © 2025, The Pragmatic Bookshelf.\n\n# 第 6 章：构建向量嵌入生成服务\n\n在上一章中，我们通过结构化后端和定义核心数据模型为向量搜索奠定了基础。现在是时候通过能够从文章内容生成向量嵌入的功能来让这些结构运行起来了。\n\
    \n本章将引导你构建一个服务，该服务可以将纯文本转换为高维向量，从而实现向量搜索。\n\n## 结构化嵌入服务\n\n向量嵌入生成服务将为文章生成嵌入并将其存储在数据库中。该服务将是博客平台的关键组件，因为它是实现用户根据语义相似性和相关性搜索文章的基础。\n\
    \n项目根目录下的 `services/` 文件夹将包含所有的向量嵌入创建和搜索功能。该文件夹的内容我们将定义生成嵌入、存储在数据库中以及执行相似性搜索的逻辑。让我们从妥妥地结构化\
    \ `services/` 文件夹开始，以保持关注点分离并保持代码整洁。\n\n当我们考虑应用程序中向量搜索服务的操作时，可以将其拆分为不同的组件：\n\n\
    *   创建新文章或编辑现有文章：\n    *   为文章生成向量嵌入。\n    *   将向量嵌入保存到数据库。\n*   用户搜索查询：\n   \
    \ *   为搜索查询生成向量嵌入。\n    *   在数据库中执行相似性搜索。\n\n我们还引入了几个工具类来帮助处理向量操作；具体来说，我们需要处理以下内容：\n\
    \n* 验证用于生成嵌入的文本输入。\n*   处理向量操作过程中可能出现的错误。\n\n最后，我们需要一个客户端来与 OpenAI API 交互以生成嵌入。你之前已经创建了\
    \ `services/` 文件夹，但现在，让我们把它们整合在一起。考虑到这些组件，我们如下结构化 `services/` 文件夹：\n\n| | services/\
    \ |\n| :--- | :--- |\n| | ├── clients/ |\n| | │ ├── couchbaseClient.js |\n| |\
    \ │ ├── openaiClient.js |\n| | ├── embeddings/ |\n| | │ ├── createEmbedding.js\
    \ |\n| | │ ├── saveEmbedding.js |\n| | ├── search/ |\n| | │ ├── embedQuery.js\
    \ |\n| | │ ├── performSearch.js |\n| | ├── utils/ |\n| | │ ├── errorHandlers.js\
    \ |\n| | │ ├── validateText.js |\n\n通过查看这些组件在两个最常见用例（即为文章创建嵌入和根据用户查询执行搜索）之间的交互流可能会有所帮助。让我们将这些操作的流程可视化，如图图所示。\n\
    \n![通过文件的嵌入流程图](img/embedding_process_through_files_flow.png \"通过文件的嵌入流程图\")\n\
    \n新文章的流程开始于应用程序将文章内容传递给 `validateText.js`，以确保在继续之前符合质量标准。如果输入通过了验证，`createEmbedding.js`\
    \ 将通过 `openaiClient.js` 调用 OpenAI 客户端生成向量嵌入。生成的嵌入随后使用 `saveEmbedding.js` 进行存储，它处理数据库操作。在整个过程中，`errorHandlers.js`\
    \ 确保任何问题都能被优雅地处理。\n\n用户查询流程开始于应用程序接收搜索查询并将其传递给 `embedQuery.js` 为搜索文本生成向量嵌入。代码随后使用\
    \ OpenAI 客户端创建此查询嵌入。它将嵌入传递给 `performSearch.js`，后者针对存储的文章嵌入运行相似性搜索以找到相关结果。与文章流程一样，该过程包含了验证和错误处理，以确保运行顺且搜索结果准确。\n\
    \n## 构建工具类\n\n在深入向量嵌入生成服务的核心功能之前，我们将从构建处理文本验证和错误管理的工具开始。这些工具确保系统正确执行向量操作并对错误做出优雅响应。\n\
    \n项目根目录下的 `services/utils/` 文件夹将包含这些工具。该文件夹将包含验证文本输入和处理错误的逻辑。让我们从创建 `services/utils/`\
    \ 文件夹并按如下方式对其进行结构化开始：\n\n| | utils/ |\n| :--- | :--- |\n| | ├── validateText.js\
    \ |\n| | ├── errorHandlers.js |\n\n接下来，我们创建 `validateText.js` 功能。\n\n### 验证文本输入\n\
    \n`validateText.js` 工具将在生成向量嵌入之前验证文本输入。该工具确保文本输入符合生成嵌入的要求并妥善地处理错误。\n\n你可能会疑惑为什么在生成嵌入之前验证文本输入很重要。除了通用的数据质量和安全考虑外，生成向量嵌入涉及真实的计算和财务成本。验证确保我们只对有意义且符合预期的输入生成嵌入。\n\
    \n以下是 `validateText.js` 工具可能性的示例。你在应用程序中需要的实际验证可能会有所不同，但这应该能给你一个起点：\n\n```javascript\n\
    import { ValidationError } from './errorHandlers';\n\nconst validateText = (text)\
    \ => {\n  if (typeof text !== 'string') {\n    throw new ValidationError('Input\
    \ must be a string');\n  }\n  if (text.trim() === '') {\n    throw new ValidationError('Input\
    \ cannot be empty or just whitespace');\n  }\n  const maxLength = 5000; // 根据需要调整\n\
    \  if (text.length > maxLength) {\n    throw new ValidationError(`Input exceeds\
    \ maximum length of ${maxLength} characters`);\n  }\n  // 为文本定义最小长度\n  const minLength\
    \ = 5; // 根据需要调整\n  if (text.length < minLength) {\n    throw new ValidationError(`Input\
    \ text is too short, must be at least ${minLength} characters`);\n  }\n  // 检查重复内容（例如过多的重复单词）\n\
    \  const words = text.split(' ');\n  const uniqueWords = new Set(words);\n  //\
    \ 重复单词超过 70%\n  if (uniqueWords.size / words.length < 0.3) {\n    throw new ValidationError('Input\
    \ text is too repetitive');\n  }\n  // 检查过多的标点符号\n  const excessivePunctuationRegex\
    \ = /[!?..*]{5,}/;\n  if (excessivePunctuationRegex.test(text)) {\n    throw new\
    \ ValidationError('Input text contains excessive punctuation');\n  }\n  return\
    \ true;\n};\n\nexport default validateText;\n```\n\n"
- fmt: "\nIn the preceding code, we’re defining a `validateText` function that takes\
    \ a text input as a parameter and performs various validations on the input. The\
    \ function checks if the input is a string, is not empty or just whitespace, does\
    \ not exceed a maximum length, meets a minimum length, is not too repetitive,\
    \ and does not contain excessive punctuation. If any validations fail, the function\
    \ throws a `ValidationError` with an appropriate error message. If all validations\
    \ pass, the function returns `true`.\n\nYou may have noticed that the preceding\
    \ code uses `ValidationError`, which imports from the `errorHandlers.js` utility.\
    \ However, the utility doesn’t exist yet, so let’s create it next.\n\n### Handling\
    \ Errors\n\nThe `errorHandlers.js` utility handles errors during vector embedding\
    \ operations. It defines custom error classes the application can use to throw\
    \ and catch specific errors. These classes provide more context and detail, making\
    \ debugging and resolving issues easier.\n\nHere’s an example of what the `errorHandlers.js`\
    \ utility might look like. The actual error classes you define may vary, depending\
    \ on your requirements, but, as previously, this example should give you a good\
    \ starting point:\n\n[implementing_vector_generation_service/errorHandlers.js](http://media.pragprog.com/titles/bgvector/code/implementing_vector_generation_service%2FerrorHandlers.js)\n\
    \n```javascript\nclass ValidationError extends Error {\n  constructor(message)\
    \ {\n    super(message);\n    this.name = 'ValidationError';\n    Error.captureStackTrace(this,\
    \ this.constructor);\n  }\n}\n```\n\nAt this point in our application development,\
    \ we only create a single custom error class, `ValidationError`, which extends\
    \ the built-in `Error` class. The `ValidationError` class takes a `message` parameter\
    \ and sets the error name to `ValidationError`. We also use `Error.captureStackTrace`\
    \ to capture the stack trace of the error, which can be helpful for debugging\
    \ purposes. The `ValidationError` class throws validation errors when text input\
    \ doesn’t meet the requirements for generating vector embeddings.\n\nAs we build\
    \ out further our application in the following chapters, we’ll define additional\
    \ custom error classes to handle different types of errors that may occur during\
    \ the vector embedding operations. The `ValidationError` class will be a foundation\
    \ for our error-handling strategy.\n\nWith the utilities for text validation and\
    \ error handling in place, we’ve created a foundation that makes our vector embedding\
    \ service easier to refactor and maintain. These utilities ensure valid text input\
    \ and proper error handling during vector operations. Next, we’ll implement the\
    \ logic to persist embeddings, beginning with creating `saveEmbedding.js` in the\
    \ `services/embeddings/` folder.\n\n## Storing Embeddings in the Database\n\n\
    The `saveEmbedding.js` module stores embeddings in the database alongside their\
    \ corresponding articles. Storing this data together enables efficient similarity\
    \ searches based on vector distance.\n\nWe’ll place the `saveEmbedding.js` file\
    \ inside the `services/embeddings/` folder at the root of our project. Let’s create\
    \ this folder and structure it as follows if you haven’t already:\n\n```text\n\
    embeddings/\n  ├── createEmbedding.js\n  └── saveEmbedding.js\n```\n\nIn this\
    \ section, we’ll only focus on the `saveEmbedding.js` functionality, but you can\
    \ see that we also have created a `createEmbedding.js` file. We’ll build out the\
    \ functionality of generating article embeddings in [Creating Vector Embeddings](#f_0045.xhtml_sect.creating_vector_embeddings).\
    \ For now, let’s focus on storing the embeddings in the database.\n\nThe core\
    \ responsibility of `saveEmbedding.js` is to store the embedding and its related\
    \ article in the database. Since we’re using Couchbase for this project, the save\
    \ function will utilize Couchbase’s document database capabilities. Here’s an\
    \ outline of the steps we’ll take:\n\n1. Establish a database connection: Connect\
    \ to the Couchbase instance using the credentials from the configuration.\n2.\
    \ Prepare the embedding data: Ensure the embedding and associated article data\
    \ are ready to be stored in a document.\n3. Insert the embedding into the database:\
    \ Insert the article and its embedding into Couchbase in a specific bucket.\n\n\
    The following diagram shows the step-by-step flow between the components, saving\
    \ the embedding for the database.\n\n![Flow of Saving Document](images/mermaid_graphs/save_document_flow.png\
    \ \"Flow of Saving Document\")\n\nNow, let’s walk through an implementation of\
    \ this in the `saveEmbedding.js` file:\n\n[implementing_vector_generation_service/saveEmbedding.js](http://media.pragprog.com/titles/bgvector/code/implementing_vector_generation_service%2FsaveEmbedding.js)\n\
    \n```javascript\nimport Article from '../models/Article';\nimport { ValidationError\
    \ } from '../utils/errorHandlers';\n\n// Function to save embedding and article\
    \ data\nconst saveEmbedding = async (articleId, articleContent, embedding) =>\
    \ {\n  if (!articleId || !embedding || !articleContent) {\n    throw new ValidationError(\n\
    \      'Article ID, content, and embedding are required to save.'\n    );\n  }\n\
    \n  try {\n    // Find the existing article or create a new instance\n    let\
    \ article = await Article.findById(articleId);\n    if (!article) {\n      article\
    \ = new Article({\n        slug: articleContent.slug,\n        title: articleContent.title,\n\
    \        description: articleContent.description,\n        body: articleContent.body,\n\
    \        author: articleContent.author,\n        tagList: articleContent.tagList,\n\
