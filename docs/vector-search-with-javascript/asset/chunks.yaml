  trans: "\n\n在前面的代码中，我们定义了一个 `validateText` 函数，它接受一个文本输入作为参数并对输入进行各种验证。该函数会检查输入是否为字符串、是否为空或仅包含空格、是否超过最大长度、是否符合最小长度、是否过于重复以及是否包含过多的标点符号。如果任何验证失败，该函数将抛出一个带有适当错误消息的\
    \ `ValidationError`。如果所有验证均通过，函数将返回 `true`。\n\n你可能已经注意到前面的代码使用了 `ValidationError`，它是从\
    \ `errorHandlers.js` 工具类导入的。然而，该工具类尚未存在，所以让我们接下来创建它。\n\n### 处理错误\n\n`errorHandlers.js`\
    \ 工具类负责处理向量嵌入操作期间的错误。它定义了应用程序可以自定义错误类，用于抛出和捕获特定错误。这些类提供了更多的上下文和细节，使得调试和解决问题变得更容易。\n\
    \n以下是 `errorHandlers.js` 工具类的可能示例。你定义的实际错误类可能会根据需求有所不同，但正如之前提到的，这个示例应该为你提供一个良好的起点：\n\
    \n[实现向量生成服务/errorHandlers.js](http://media.pragprog.com/titles/bgvector/code/implementing_vector_generation_service%2FerrorHandlers.js)\n\
    \n```javascript\nclass ValidationError extends Error {\n  constructor(message)\
    \ {\n    super(message);\n    this.name = 'ValidationError';\n    Error.captureStackTrace(this,\
    \ this.constructor);\n  }\n}\n```\n\n在应用程序开发的目前阶段，我们只创建了一个单一自定义错误类 `ValidationError`，它继承自内置的\
    \ `Error` 类。`ValidationError` 类接收一个 `message` 参数并将错误名称设置为 `ValidationError`。我们还使用\
    \ `Error.captureStackTrace` 来捕获错误的堆栈跟踪，这对于调试目的非常有帮助。当文本输入不符合生成向量嵌入的要求时，`ValidationError`\
    \ 类会抛出验证错误。\n\n随着我们在接下来的章节中进一步构建应用程序，我们将定义额外的自定义错误类，以处理在向量嵌入期间可能发生的不同类型的错误。`ValidationError`\
    \ 类将成为我们错误处理策略的基础。\n\n有了文本验证和错误处理工具类，我们创建了一个基础，使得我们的向量嵌入服务更容易重构和维护。这些工具类确保了向量操作期间的有效文本输入和正确的错误处理。接下来，我们将实现持久化嵌入的逻辑，从在\
    \ `services/embeddings/` 文件夹中创建 `saveEmbedding.js` 开始。\n\n## 在数据库中存储嵌入\n\n`saveEmbedding.js`\
    \ 模块将嵌入与其对应的文章存储在数据库中。将这些数据存储在一起允许基于向量距离进行高效的相似性搜索。\n\n我们将 `saveEmbedding.js`\
    \ 文件放在项目根目录下的 `services/embeddings/` 文件夹。如果你还没有该文件夹，请按照以下结构创建它：\n\n```text\nembeddings/\n\
    \  ├── createEmbedding.js\n  └── saveEmbedding.js\n```\n\n在本节中，我们仅关注 `saveEmbedding.js`\
    \ 功能，但你可以看到我们也创建了 `createEmbedding.js` 文件。我们将在创建向量嵌入 中构建生成文章嵌入的功能。现在，让我们专注于在数据库中存储嵌入。\n\
    \n`saveEmbedding.js` 的核心职责是将嵌入及其相关文章存储在数据库中。由于我们在项目中使用的是 Couchbase，因此保存函数将利用 Couchbase\
    \ 的文档数据库功能。以下是我们将采取的步骤概述：\n\n1. 建立数据库连接：使用配置中的凭据连接到 Couchbase 实例。\n2. 准备嵌入数据：确保嵌入和关联文章数据准备好存储在文档中。\n\
    3. 将嵌入插入数据库：将文章及其嵌入插入 Couchbase 的特定桶（bucket）中。\n\n下面的图显示了组件之间将嵌入保存到数据库的逐步流。\n\n\
    ![保存文档的流程](img/save_document_flow.png \"保存文档的流程\")\n\n现在，让我们在 `saveEmbedding.js`\
    \ 文件中遍历这一功能的实现：\n\n[实现向量生成服务/saveEmbedding.js](http://media.pragprog.com/titles/bgvector/code/implementing_vector_generation_service%2FsaveEmbedding.js)\n\
    \n```javascript\nimport Article from '../models/Article';\nimport { ValidationError\
    \ } from '../utils/errorHandlers';\n\n// 保存嵌入和文章数据的函数\nconst saveEmbedding = async\
    \ (articleId, articleContent, embedding) => {\n  if (!articleId || !embedding\
    \ || !articleContent) {\n    throw new ValidationError(\n      '保存需要文章 ID、内容和嵌入。'\n\
    \    );\n  }\n\n  try {\n    // 查找现有文章或创建新实例\n    let article = await Article.findById(articleId);\n\
    \    if (!article) {\n      article = new Article({\n        slug: articleContent.slug,\n\
    \        title: articleContent.title,\n        description: articleContent.description,\n\
    \        body: articleContent.body,\n        author: articleContent.author,\n\
    \        tagList: articleContent.tagList,\n        favoritesCount: 0,\n      \
    \  comments: [],\n        embedding\n      });\n    } else {\n      // 更新现有文章的嵌入\n\
    \      article.embedding = embedding;\n    }\n\n    // 保存文章及其嵌入\n    await article.save();\n\
    \    console.log('文章和嵌入保存成功');\n  } catch (error) {\n    console.error('保存文章和嵌入时出错:',\
    \ error);\n    throw error;\n  }\n};\n\nexport default saveEmbedding;\n```\n\n"
- fmt: "\nThe `createEmbedding.js` file generates vector embeddings for articles based\
    \ on their content. These embeddings capture the semantic meaning and context\
    \ of each article, enabling similarity searches that return relevant results.\
    \ To write code that is reusable, we’ll also use this service to generate embeddings\
    \ for user search queries.\n\nReady to begin writing the creation service? Let’s\
    \ get into it!\n\n## Designing the Create Embedding Logic\n\nThe core responsibility\
    \ of `createEmbedding.js` is to generate a vector embedding for the article content.\
    \ Since we’re using the OpenAI API for this project, the `create` function will\
    \ utilize the API to generate the embeddings. Here’s an outline of the steps we’ll\
    \ take:\n\n1. Connect to the OpenAI API: Use the OpenAI client to establish a\
    \ connection to the OpenAI API.\n2. Prepare the article content: Ensure the article\
    \ content is ready to be passed to the API for embedding generation.\n3. Generate\
    \ the embedding: Use the OpenAI API to generate the vector embedding for the article\
    \ content.\n4. Store the embedding: Save the generated embedding in the database\
    \ using the `saveEmbedding.js` functionality.\n\nThe flow of interactions for\
    \ generating an embedding involves several key components:\n\n* User submits a\
    \ new article to the back-end API.\n* Back-end API triggers the `createEmbedding.js`\
    \ function.\n* `createEmbedding.js` sends article content to the OpenAI API.\n\
    * OpenAI API returns the generated embedding.\n* `createEmbedding.js` calls `saveEmbedding.js`\
    \ with the embedding.\n* `saveEmbedding.js` saves the embedding to the Couchbase\
    \ database.\n* Couchbase database confirms the save to `saveEmbedding.js`.\n*\
    \ `saveEmbedding.js` acknowledges the save to `createEmbedding.js`.\n* `createEmbedding.js`\
    \ notifies the back-end API of success.\n* Back-end API confirms article saved\
    \ with embedding to the User.\n\nThis sequence ensures the article content is\
    \ processed into an embedding and reliably stored in the database before confirming\
    \ success to the user.\n\nBefore we begin writing the code for the `createEmbedding.js`\
    \ functionality, we must first create the OpenAI client functionality that will\
    \ allow us to connect to the OpenAI API. With a good sense of how the creation\
    \ of embeddings will flow in the service, let’s take a moment to build the OpenAI\
    \ client in the `services/clients/` folder.\n\n## Designing the OpenAI API Client\n\
    \nThe OpenAI client will connect to the OpenAI API and generate vector embeddings\
    \ for text input. This client will provide an interface for interacting with the\
    \ API and handling its responses. By encapsulating the functionality of connecting\
    \ to the OpenAI API in a client, we can easily reuse the client across different\
    \ application parts and maintain a consistent way of interacting with the API.\n\
    \nThe OpenAI client will live in the `services/clients/` folder at the project’s\
    \ root. The folder contains the logic for connecting to the OpenAI API and generating\
    \ vector embeddings. Let’s start by creating the `services/clients/` folder and\
    \ structuring it as follows if you haven’t already:\n\n```\n| clients/ |\n| ├──\
    \ openaiClient.js |\n```\n\nThis section will focus on implementing the `openaiClient.js`\
    \ module, which handles the connection to the OpenAI API and the generation of\
    \ vector embeddings.\n\nThe core responsibility of the OpenAI client is to connect\
    \ to the OpenAI API and generate vector embeddings for text input. The client\
    \ will provide an interface for interacting with the OpenAI API and handling the\
    \ responses from the API. Here’s an outline of the steps we’ll take:\n\n1. Connect\
    \ to the OpenAI API: Establish a connection to the OpenAI API using the API key.\n\
    2. Generate the embedding: Use the OpenAI API to generate the vector embedding\
    \ for the text input.\n3. Handle the response: Parse and process the response\
    \ from the OpenAI API to extract the embedding.\n\nWith the steps we need to accomplish\
    \ in mind, let’s walk through an implementation of this in the `openaiClient.js`\
    \ file. We’re building using the OpenAI Embeddings API documentation as a reference.\n\
    \nHere’s an example of what the `openaiClient.js` functionality might look like:\n\
    \n```javascript\nimport OpenAI from 'openai';\n// Importing custom error class\
    \ for API errors\nimport { EmbeddingServiceError, ValidationError } from '../utils/errorHandlers';\n\
    // Importing validateText utility for input validation\nimport validateText from\
    \ '../utils/validateText';\n\nconst OPENAI_API_KEY = process.env.OPENAI_API_KEY;\n\
    \n// Creating an instance with the provided configuration\nconst client = new\
    \ OpenAI({\n  apiKey: OPENAI_API_KEY,\n});\n\n// Function to generate embedding\
    \ for a given text\nconst callEmbeddingAPI = async (text) => {\n  try {\n    validateText(text);\n\
    \    // Making a request to OpenAI API\n    const response = await client.embeddings.create({\n\
    \      model: 'text-embedding-002',\n      input: text,\n    });\n    // Extract\
    \ the embedding from response\n    const embedding = response.data[0]?.embedding;\n\
    \    if (!embedding) {\n      throw new EmbeddingServiceError('Failed to retrieve\
    \ embedding');\n    }\n    return embedding;\n  } catch (error) {\n    if (error\
    \ instanceof OpenAI.APIError) {\n      console.error(`OpenAI API Error ${error.status}]:\
    \ ${error.message}`);\n    } else if (error instanceof ValidationError) {\n  \
    \    console.error(`Validation Error: ${error.message}`);\n    } else if (error\
    \ instanceof EmbeddingServiceError) {\n      console.error(`Embedding Service\
    \ Error: ${error.message}`);\n    } else {\n      console.error('Unexpected Error:',\
    \ error);\n    }\n    throw error;\n  }\n};\n\nexport { callEmbeddingAPI };\n\
    ```\n\nWe should highlight several key components of this code. First, we’re using\
    \ the OpenAI Node.js SDK to build the client. This SDK provides a convenient way\
    \ to interact with the OpenAI API for embeddings and other services.\n\nWe’re\
    \ also using the `validateText` utility we built earlier to ensure the text input\
    \ is valid before sending it to the API for embedding generation. This is a good\
    \ practice to ensure the input is clean and meaningful before proceeding with\
    \ the embedding generation process.\n\nThe way we’re handling errors is also meaningful.\
    \ We’re catching different types of errors, such as API, validation, and unexpected\
    \ errors, and logging them appropriately. This helps us identify and resolve issues\
    \ quickly and efficiently. However, did you notice something amiss about our error\
    \ handling? We’re using a custom `EmbeddingServiceError` class that we’ve not\
    \ defined yet!\n\nLet’s reopen the `errorHandlers.js` file in the `services/utils/`\
    \ folder and add the `EmbeddingServiceError` class to it right now.\n\n```javascript\n\
    class EmbeddingServiceError extends Error {\n  constructor(message, status) {\n\
    \    super(message);\n    this.name = 'EmbeddingServiceError';\n  }\n}\n```\n"
  raw: 'The createEmbedding.js file generates vector embeddings for articles based
    on their content. These embeddings capture the semantic meaning and context of
    each article, enabling similarity searches that return relevant results. To write
    code that is reusable, we’ll also use this service to generate embeddings for
    user search queries.


    Ready to begin writing the creation service? Let’s get into it!


    ### Designing the Create Embedding Logic


    The core responsibility of createEmbedding.js is to generate a vector embedding
    for the article content. Since we’re using the OpenAI API for this project, the
    create function will utilize the API to generate the embeddings. Here’s an outline
    of the steps we’ll take:


    1.  Connect to the OpenAI API: Use the OpenAI client to establish a connection
    to the OpenAI API.


    2.  Prepare the article content: Ensure the article content is ready to be passed
    to the API for embedding generation.


    3.  Generate the embedding: Use the OpenAI API to generate the vector embedding
    for the article content.


    4.  Store the embedding: Save the generated embedding in the database using the
    saveEmbedding.js functionality.


    The flow of interactions for generating an embedding involves several key components:


    *   User submits a new article to the back-end API.


    *   Back-end API triggers the createEmbedding.js function.


    *   createEmbedding.js sends article content to the OpenAI API.


    *   OpenAI API returns the generated embedding.


    *   createEmbedding.js calls saveEmbedding.js with the embedding.


    *   saveEmbedding.js saves the embedding to the Couchbase database.


    *   Couchbase database confirms the save to saveEmbedding.js.


    *   saveEmbedding.js acknowledges the save to createEmbedding.js.


    *   createEmbedding.js notifies the back-end API of success.


    *   Back-end API confirms article saved with embedding to the User.


    This sequence ensures the article content is processed into an embedding and reliably
    stored in the database before confirming success to the user.


    Before we begin writing the code for the createEmbedding.js functionality, we
    must first create the OpenAI client functionality that will allow us to connect
    to the OpenAI API. With a good sense of how the creation of embeddings will flow
    in the service, let’s take a moment to build the OpenAI client in the services/clients/
    folder.


    #### Designing the OpenAI API Client


    The OpenAI client will connect to the OpenAI API and generate vector embeddings
    for text input. This client will provide an interface for interacting with the
    API and handling its responses. By encapsulating the functionality of connecting
    to the OpenAI API in a client, we can easily reuse the client across different
    application parts and maintain a consistent way of interacting with the API.


    The OpenAI client will live in the services/clients/ folder at the project’s root.
    The folder contains the logic for connecting to the OpenAI API and generating
    vector embeddings. Let’s start by creating the services/clients/ folder and structuring
    it as follows if you haven’t already:


    | ​  | clients/ |


    | ​  | ├── openaiClient.js |


    This section will focus on implementing the openaiClient.js module, which handles
    the connection to the OpenAI API and the generation of vector embeddings.


    The core responsibility of the OpenAI client is to connect to the OpenAI API and
    generate vector embeddings for text input. The client will provide an interface
    for interacting with the OpenAI API and handling the responses from the API. Here’s
    an outline of the steps we’ll take:


    1.  Connect to the OpenAI API: Establish a connection to the OpenAI API using
    the API key.


    2.  Generate the embedding: Use the OpenAI API to generate the vector embedding
    for the text input.


    3.  Handle the response: Parse and process the response from the OpenAI API to
    extract the embedding.


    With the steps we need to accomplish in mind, let’s walk through an implementation
    of this in the openaiClient.js file. We’re building using the OpenAI Embeddings
    API documentation^([[20]](#f_0046.xhtml_FOOTNOTE-20)) as a reference.


    Here’s an example of what the openaiClient.js functionality might look like:


