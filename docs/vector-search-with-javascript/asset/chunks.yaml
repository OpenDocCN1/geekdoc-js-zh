    }\n```\n\nThe preceding code defines an `EmbeddingServiceError` class that extends\
    \ the built-in `Error` class. The `EmbeddingServiceError` class takes a `message`\
    \ and `status` parameter and sets the error name to `EmbeddingServiceError`. We\
    \ also use `Error.captureStackTrace` to capture the stack trace of the error,\
    \ which can be helpful for debugging purposes. The `EmbeddingServiceError` class\
    \ will handle the mistakes during interactions with the OpenAI API. With the `EmbeddingServiceError`\
    \ class defined, we’ve successfully built the OpenAI client that will allow us\
    \ to connect to the OpenAI API and generate vector embeddings for text input.\
    \ This client will be a critical component of the vector embedding service, as\
    \ it will enable us to create embeddings for articles and user search queries.\n\
    \nWith the OpenAI-API client built, we’re ready to write the code for the `createEmbedding.js`\
    \ functionality. Let’s move on to creating the functionality for generating embeddings\
    \ for articles.\n\n### Writing the Create Embedding Logic\n\nThe `createEmbedding.js`\
    \ will use the earlier code we built to abstract the OpenAI API client, text validation,\
    \ and error handling. As a result of our earlier work, the code for generating\
    \ embeddings for articles and search queries will be concise and focused on the\
    \ core functionality of generating embeddings. Let’s dive into the code for the\
    \ `createEmbedding.js` functionality.\n\n[implementing_vector_generation_service/createEmbedding.js](http://media.pragprog.com/titles/bgvector/code/implementing_vector_generation_service%2FcreateEmbedding.js)\n\
    \n```javascript\n// Importing the OpenAI client for generating embeddings\nimport\
    \ { callEmbeddingAPI } from '../clients/openaiClient';\n// Importing validateText\
    \ utility for input validation\nimport validateText from '../utils/validateText';\n\
    // Importing saveEmbedding to store the generated embedding\nimport { saveEmbedding\
    \ } from './saveEmbedding';\n\n/**\n * Create an embedding for the given content\
    \ and\n * either save it or return it based on the type.\n * @param {string} identifier\
    \ - A unique identifier for the\n * entity (for instance article ID, query ID).\n\
    \ * @param {string} content - The content for which the embedding\n * is to be\
    \ created (for instance article body, user query).\n * @param {string} type -\
    \ The type of content (such as 'article').\n * @returns {Promise<object | void>}\
    \ - Returns the embedding if\n * the type is 'query', otherwise saves it.\n */\n\
    const createEmbedding = async (identifier, content, type) => {\n  try {\n    validateText(content);\n\
    \    const embedding = await callEmbeddingAPI(content);\n    if (type === 'article')\
    \ {\n      await saveEmbedding(identifier, embedding, type);\n      console.log(`Successfully\
    \ saved embedding for article ID: ${identifier}`);\n    } else if (type === 'query')\
    \ {\n      console.log(`Generated embedding for query with ID: ${identifier}`);\n\
    \      return embedding;\n    }\n  } catch (error) {\n    console.error('Error\
    \ creating embedding:', error.message);\n    throw error;\n  }\n};\n\nexport {\
    \ createEmbedding };\n```\n\nIn the preceding code, we’re defining a `createEmbedding`\
    \ function that takes an `identifier`, `content`, and `type` as parameters. The\
    \ function first validates the content using the `validateText` utility to ensure\
    \ the input is valid. It then generates an embedding for the content using the\
    \ `callEmbeddingAPI` function from the OpenAI client. Finally, it saves the embedding\
    \ in the database using the `saveEmbedding` function if the embedding is for an\
    \ article. Otherwise, it returns the embedding for a search query. The function\
    \ logs a success message when it successfully creates and saves or returns the\
    \ embedding. It also logs an error message when an error occurs during the process.\n\
    \nThis code is versatile and flexible in that it can generate embeddings for different\
    \ types of content in the application, whether an article or a user search query.\
    \ By writing the function in a generic, reusable way, we ensure consistency across\
    \ the application and simplify future maintenance. With the core embedding generation\
    \ logic in place, our vector generation service is complete and ready to power\
    \ vector search.\n\n## Key Takeaways\n\nIn this chapter, we built our application’s\
    \ core functionality required for generating vector embeddings. By layering together\
    \ reusable utilities, a modular OpenAI client, and structured service logic, we\
    \ laid the technical foundation that powers our search experience.\n\nThese are\
    \ the key points to take with you into the next chapters:\n\n*   We introduced\
    \ a clear service structure for the vector embedding functionality, separating\
    \ concerns across `embeddings/`, `clients/`, `search/`, and `utils/` folders.\n\
    *   Utilities such as `validateText.js` and `errorHandlers.js` ensure the system\
    \ processes only clean, meaningful input and gracefully handles failures.\n* \
    \  The `saveEmbedding.js` module handles the persistence of embeddings into the\
    \ database, ensuring that updated content results in updated embeddings.\n*  \
    \ The `openaiClient.js` file wraps the logic for interacting with the OpenAI API,\
    \ including validation and error management.\n"
