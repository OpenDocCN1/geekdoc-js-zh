  raw: '*   Popularity: Factoring in metrics such as views, likes, or shares to highlight
    articles that have garnered significant user interest.


    Together, these signals augment the vector similarity score, creating a balanced
    ranking system that accounts for conceptual relevance and user-driven context.


    ### Calculating and Storing Ranking Metrics


    Before integrating recency and popularity into our search ranking, we must calculate
    and store these metrics for each article in our database. Let’s start with recency.
    You can derive this metric from the publication date of an article. We’ll represent
    recency as the number of days since the article was published, inversely scaled
    so that newer articles have higher scores, like this for example:


    | ​  | recency = max_days - (current_date - publication_date) |


    Here, max_days is a constant representing the maximum time period considered relevant
    (such as 365 days for one year). Articles older than this range will have a recency
    score of zero. To calculate this value, we’ll update the logic in our data model
    as follows:


    [optimizing_search_results/updated_article_model.js](http://media.pragprog.com/titles/bgvector/code/optimizing_search_results%2Fupdated_article_model.js)


    | ​  | ArticleSchema.pre(​*''save''*​, ​**function**​ (next) { |


    | ​  | ​**const**​ currentDate = ​**new**​ Date(); |


    | ​  | ​**const**​ maxDays = 365; |


    | ​  | ​**const**​ publicationDate = ​**this**​.publicationDate &#124;&#124; currentDate;
    |


    | ​  |  |


    | ​  | ​**this**​.recency = Math.max( |


    | ​  | 0, |


    | ​  | maxDays - Math.floor( |


    | ​  | (currentDate - publicationDate) / (1000 * 60 * 60 * 24) |


    | ​  | ) |


    | ​  | ); |


    | ​  |  |


    | ​  | next(); |


    | ​  | }); |


    Next, let’s address popularity. This metric can be computed based on engagement
    data, such as the number of views or likes an article has received. For simplicity,
    we’ll define popularity as a weighted sum of these factors:


    | ​  | popularity = (0.7 * views) + (0.3 * likes) |


    Similar to recency, we’ll calculate and store this value in the article document.
    Whenever an article is viewed or liked, we’ll update its popularity score using
    an event-driven approach or a periodic batch-update process, depending on the
    application’s needs. We’ll leave it to you to implement this aspect of user engagement
    tracking in your application.


    Once these fields are integrated into the database, our articles will have three
    key metrics: similarity_score, recency, and popularity, which can be used to rank
    search results. With these fields, we have the foundation for incorporating weighted
    ranking into our search API.


    ### Integrating Weighted Ranking in the Search API


    With the necessary fields in place, we can modify the search API to incorporate
    weighted ranking. Let’s revisit our ranking formula:


    | ​  | final_score = (0.7 * similarity_score) + (0.2 * recency) + (0.1 * popularity)
    |


    Let’s explain this formula in plain English. The final_score is a weighted sum
    of three components: similarity_score, recency, and popularity. The similarity_score
    is the primary factor, accounting for 70 percent of the final score. Recency and
    popularity contribute 20 percent and 10 percent, respectively. This distribution
    ensures that vector similarity remains the primary ranking factor, while recency
    and popularity provide additional context.


    Adjust these weights based on your application’s specific requirements. For example,
    if recency is more critical than popularity, you could increase its weight in
    the formula. The key is to experiment with different weightings to find the balance
    that best suits your users’ needs.


    To implement this, we’ll update our controller’s performSearch method.


    [optimizing_search_results/updated_performSearch.js](http://media.pragprog.com/titles/bgvector/code/optimizing_search_results%2Fupdated_performSearch.js)


    | ​  | ​**import**​ asyncHandler ​**from**​ ​*''express-async-handler''*​; |


    | ​  | ​**import**​ { Query, getDefaultInstance } ​**from**​ ​*''ottoman''*​;
    |


    | ​  |  |


    | ​  | ​**const**​ performSearch = asyncHandler(​**async**​ (req, res) => { |


    | ​  | ​**const**​ { query } = req.body; |


    | ​  |  |


    | ​  | ​**if**​ (!query &#124;&#124; ​**typeof**​ query !== ​*''string''*​) {
    |


    | ​  | ​**return**​ res.status(400).json({ |


    | ​  | message: ​*''Search query is required and must be a string''*​, |


    | ​  | }); |


    | ​  | } |


    | ​  |  |


    | ​  | ​**const**​ searchQuery = ​**new**​ Query( |


    | ​  | { |


    | ​  | where: { |


    | ​  | embedding: { |


    | ​  | $similarity: { |


    | ​  | query: query, |


    | ​  | metric: ​*''dot_product''*​, |


    | ​  | }, |


    | ​  | }, |


    | ​  | }, |


    | ​  | orderBy: [{ final_score: ​*''DESC''*​ }], |


    | ​  | limit: 10, |


    | ​  | }, |


    | ​  | ​*''articles''*​ |


    | ​  | ).build(); |


    | ​  |  |


    | ​  | ​**const**​ ottoman = getDefaultInstance(); |


    | ​  | ​**const**​ { rows } = ​**await**​ ottoman.query(searchQuery); |


    | ​  |  |


    | ​  | ​**return**​ res.status(200).json({ |


    | ​  | results: rows.map((row) => ({ |


    | ​  | id: row.id, |


    | ​  | title: row.title, |


    | ​  | description: row.description, |


    | ​  | final_score: row.final_score, |


    | ​  | })), |


    | ​  | count: rows.length, |


    | ​  | }); |


    | ​  | }); |


    | ​  |  |


    | ​  | ​**export**​ { performSearch }; |


    Here, the final_score field is calculated on the database side using the stored
    values for similarity, recency, and popularity. This approach offloads the ranking
    logic to the database, reducing back-end complexity and improving performance.


    From the user’s perspective, weighted ranking ensures they immediately see results
    that are semantically relevant but also timely and popular. For example, if your
    site offers technical tutorials, users will first see recent, trending articles
    with current implementation advice. Without weighted ranking, users might need
    to search through older results to find the most current information.


    ## Understanding Stop Words


    While weighted ranking improves result prioritization, the quality of the query
    still determines how effective those results are. Stop words, such as the, is,
    and and, can introduce noise into vector embeddings, reducing the precision of
    search results. For example, the query “the rise of AI” might be less effective
    than “rise AI” because the and of contribute little semantic meaning.


    However, removing stop words must be done carefully so we don’t remove important
    context from a query. For instance, the word to might be a stop word in general
    text but critical in a query like “how to code.”


    Effective stop-word removal requires more than a static list; it must consider
    the context. For instance, common phrases like “how to” carry essential meaning,
    especially in technical tutorials, and should be preserved during preprocessing
    to maintain query accuracy.


    The real-world impact of context-aware stop-word removal is clear. A large IT
    consultancy team building an internal vector search system for closed support
    tickets found their search failed whenever queries involved negation. Their system
    removed crucial words without considering context, leading to irrelevant results.
    Addressing this required analyzing how stop words appeared in actual queries and
    adjusting their approach accordingly, greatly improving accuracy.


    In our implementation, we preprocess queries by first detecting predefined meaningful
    phrases. If such phrases appear, we preserve them entirely; otherwise, we remove
    stop words selectively, respecting exceptions critical to our application. This
    preprocessing occurs before generating vector embeddings, resulting in more precise
    and relevant search results.


    Let’s implement and integrate this improved stop-word handling into our vector
    search API.


    ### Implementing Stop-Word Removal


    Place the stop-word removal logic in a new file named stopWordProcessor.js inside
    the utils/ directory within the services/ folder. This file exports a single function,
    processQuery, which accepts a raw user query and returns a cleaned query string.'
