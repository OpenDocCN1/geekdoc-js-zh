    Run the script like this:


    node name_this_book.js "Vector Search for Everyone"


    The script will output the top five most similar titles from the catalog along
    with their similarity scores. A score close to 1 means your title idea is very
    similar in meaning to a published Pragmatic title, while lower scores indicate
    less similarity. You can use these results to evaluate whether your idea fits
    the style and themes of the publisher’s catalog. You might also use the output
    to spark new ideas based on which titles rank highly in similarity.


    When you run the script, you’ll see the top five matches ranked by similarity.
    For example, testing the title idea *Learning Vector Search with JavaScript* produced
    results that leaned into themes of “learning,” “programming,” and “JavaScript.”
    The closest match, *A Common-Sense Guide to Data Structures and Algorithms in
    JavaScript*, shared both the language and the educational framing through its
    use of “learning”-adjacent phrasing. Other top matches included *Machine Learning
    in Elixir* and *Programming Phoenix LiveView*, which shows that the system focused
    on action-oriented words like “learning” and “programming” as strong signals.
    This kind of feedback helps you understand not just which titles are similar but
    why. Often, they share verbs, technologies, or a how-to tone. You can use that
    insight to tweak your phrasing or steer your idea toward a more distinctive niche.


    ## Key Takeaways


    In this chapter, you used vector search to compare your own book title idea to
    real titles from the Pragmatic Bookshelf catalog. Along the way, you wrote a complete
    program that scraped live data, generated embeddings using OpenAI, and ranked
    results using cosine similarity, all with just a few lines of code. If you haven’t
    already, take a moment to come up with a title idea of your own and plug it into
    the script to see how it compares.


    Let’s summarize your major wins:


    *   You scraped and parsed real book titles from the web.


    *   You generated vector embeddings with the OpenAI API.


    *   You compared your title idea to the catalog using cosine similarity.


    *   You followed the same approach the author used to name this book.


    Now that you’ve seen vector search in action, the next step is to understand how
    it works.


