    \n### 定义其他模型\n\n正如本章开头提到的，博客平台拥有用户、文章、评论和标签的模型。`Article` 模型是向量搜索过程的核心，因为它将持有平台创建的向量嵌入。其他模型对平台至关重要，但与我们探索重点的相关性不那么大。以下是其他模型的简要概述。每个模型的完整代码可以在项目的\
