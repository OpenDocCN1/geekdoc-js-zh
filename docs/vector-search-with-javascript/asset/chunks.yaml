    Once connected, Ottoman provides the interface for defining models and interacting
    with them. At the same time, we also initialize and store a separate clusterInstance
    using the Couchbase Node.js SDK. This gives us low-level access to Couchbase features
    beyond what Ottoman provides, for example, if we later need to work directly with
    key-value operations, indexes, or run raw data queries.


    The module exports everything from Ottoman, so we can use those APIs throughout
    the app, and also provides a getCluster() function for retrieving the Couchbase
    cluster instance once it’s connected. This gives us flexibility: we can build
    most of our app using Ottoman but still drop down to the raw Couchbase SDK whenever
    we need full control.


    Now that we’ve configured the data layer, our back end is ready to store and retrieve
    vector data alongside standard document data like articles and users.


    ## Key Takeaways


    In this chapter, we focused on structuring the back end to support vector search
    functionality. We introduced a dedicated services folder to house vector-related
    logic, carefully modeled the article entity as the primary object for embeddings,
    and established a flexible and maintainable connection to the Couchbase database.
    This foundation ensures that our application is well prepared to generate and
    store vector embeddings in the chapters ahead.


    Key takeaways from this chapter include the following:


    *   We introduced a services/ folder to house embedding and search logic, keeping
    it cleanly separated from the rest of the application architecture.


    *   We designed the Article model to include a new embedding field, setting the
    stage for incorporating vector search.


    *   We briefly reviewed the User, Comment, and Tag models, highlighting how they
    relate to articles.


    *   We configured a shared database connection using both Ottoman.js and the Couchbase
    Node.js SDK, giving us flexibility to work at both the model and raw query levels.


    With the back-end structure, database connection, and core model in place, we’re
    now ready to build the vector embedding generation service that will bring search
    relevance to life.


