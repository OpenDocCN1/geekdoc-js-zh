  trans: "\n嵌入（Embeddings）是数据的密集向量表示，能够捕捉不同实体之间的关系。我们使用嵌入来表示数据，使得相似性计算等操作变得更加简单。嵌入同时捕捉实体之间的语义关系和句法关系。例如，在单词的情况下，嵌入可以捕捉诸如“国王之于女王”这种语义关系，以及“国王之于多个国王（复数）”这种句法关系。\n\
    \n这在现实中是什么样子的？让我们以国王和女王的为例，展示我们如何将它们表示为嵌入。在单词嵌入的情况下，单词 `king` 可能被表示为如下所示向量嵌入：\n\
    \n```\n[\n  0.010183674,\n  -0.003974117,\n  0.0073341774,\n  -0.011770561,\n\
    \  -0.031903327,\n  0.018601075,\n  -0.014723551,\n  -0.03132377,\n  ...\n]\n\
    ```\n\n为什么我在向量末尾包含了省略号？因为这个向量比我在这里展示的要得多！这是因为取决于生成嵌入的模型，向量的长度可以是不同的，而且通常很长。\n\n\
    ### 你知道吗？嵌入与语言\n\n嵌入被广泛应用于自然语言处理（NLP），以一种捕捉其含义的方式来表示单词和短语。这有助于解决多义性等挑战，例如像 `dive`\
    \ 这样的词根据上下文的不同有多种含义。嵌入根据用法来消除歧义。\n\n它们的性能也优于词干（stemming，将 `jogging, jogged, jogs`\
    \ 还原为 `jog`）和词还原（lemmatization，将 `ran, running, runs` 还原为 `run`）。嵌入并不依赖规则，而是通过从上下学习来自然地捕捉这些关系。\n\
    \n在此例中，生成单词 `king` 嵌入的模型是 OpenAI 的 `text-embedding-ada-002`。该模型创建的嵌入具有 1,536 个维度。维度意味着向量是一个包含\
    \ 1,536 个值的列表，每个值代表单词 `king` 的一个不同方面。在第 9 章“引入向量搜索功能”中，我们将探索如何通过减少向量的维度来优化嵌入结果。向量降维是一个复杂的课题，因为涉及到嵌入质量与生成这些嵌入所需的计算资源之间的权衡。然而，它会影响你的整体性能和成本效益。\n\
    \n这些浮点数中的每个值都代表了单词 `king` 的不同语义和句法方面。生成嵌入的模型已经学习如何以一种捕捉其与其他单词关系的方式来表示单词 `king`。正如我们上面所说，这意味着\
    \ `king` 和 `queen` 在向量空间中将彼此很近，而 `king` 和 `apple` 之间的距离会更远。\n\n### 你知道吗？嵌入模型 vs\
    \ 生成式模型\n\n嵌入模型（如 OpenAI 的 `Ada`）创建数据的密集向量表示，捕捉有利于搜索或推荐的语义关系。相比之下，生成式模型（如 `GPT`）产生内容——如文本、图像或音频。两者都使用了\
    \ transformers，但嵌入模型聚焦于上下文向量的创建，而生成式模型则顺序生成连贯的内容。\n\n## 使用 OpenAI API 生成嵌入\n\n\
    你现在准备好迈出向量搜索的第一步了。在过去的几个章节中，你已经探索了向量背后的概念、向量嵌入、生成式模型和嵌入模型等。所有这些知识已让你能够开始开发你的第一个向量搜索应用程序。在软件开发中，我们的目标是让事物变得易懂，而不是神秘。这就是为什么我们花这段时间建立你的理解，以便你建立信心。\n\
    \n如之前提到的，我们将使用 OpenAI Embeddings API 来生成嵌入。OpenAI Embeddings API 是一个强大的工具，允许你为文本、图像等生成嵌入。该\
    \ API 易于使用且文档齐全，对于初接触嵌入的开发者来说是一个极佳的选择。在本节中，我们将学习如何使用 OpenAI API 生成嵌入。我们将探索 API\
    \ 中提供的各种选项，以及如何利用它们为你的数据创建嵌入。\n\nOpenAI 为 Node.js 维护了一个官方 SDK，该 SDK 包含了 OpenAI\
    \ APIs 的所有功能，包括 Embeddings API。你可以通过 Node.js 包管理器 `npm` 运行以下命令来安装 SDK：\n\n```\n\
    npm install openai\n```\n\n除了使用 SDK 之外，你还可以直接使用 `cURL` 发起 API 调用。OpenAI 文档为所有相关示例都提供了\
    \ `cURL`、Node.js 和 Python 的代码片段。我们将在书中适当的地方使用这些代码示例。\n\n无论是使用 SDK 还是使用 `cURL`\
    \ 发起 API 调用，你都需要一个 API key 来验证你的请求。你可以通过在 OpenAI 平台上注册账户来获取 API key。一旦有了 API key，就可以使用它来验证请求并访问\
    \ OpenAI APIs。对于 `cURL` 请求，你需要在请求头中包含该 API key。对于 Node.js SDK，你将在节实例化 `OpenAI`\
    \ 客户端的新实例时提供 API key。\n\n这里有一个取自官方文档的 `cURL` 请求示例；我们将详细查看每个参数：\n\n```bash\ncurl\
    \ https://api.openai.com/v1/embeddings\n  -H \"Content-Type: application/json\"\
    \n  -H \"Authorization: Bearer $OPENAI_API_KEY\"\n  -d '{\n    \"input\": \"Your\
    \ text string goes here\",\n    \"model\": \"text-embedding-3-small\"\n  }'\n\
    ```\n\n首先，我们看到 API 端点的 URL `https://api.openai.com/v1/embeddings`。接下来，我们看到请求头。`Content-Type`\
    \ 头指定请求体为 JSON。`Authorization` 头包含用于验证请求的 API key。最后，我们看到请求体，它包含了输入文本和模型。在这种情况下，输入文本是“Your\
    \ text string goes here”，模型是“text-embedding-3-small”。\n\n可用模型列表也可以在文档中找到，新模型不时推出，现有模型也会更新。实际上，无论是在\
    \ `cURL` 请求还是 SDK 中，我们需要提供的两个参数都是 `input` 和 `model`。使用 SDK 的相同请求将如下：\n\n`basics_of_vector_embeddings/first_api_request.js`\n\
    \n```javascript\nconst main = async () => {\n  try {\n    const embedding = await\
    \ openai.embeddings.create({\n      model: \"text-embedding-ada-002\",\n     \
    \ input: \"Your text string goes here\",\n      encoding_format: \"float\",\n\
    \    });\n\n    console.log(embedding.data[0].embedding);\n    console.log(\"\
    Model used:\", embedding.model);\n    console.log(\"Tokens consumed:\", embedding.usage.total_tokens);\n\
    \  } catch (error) {\n    console.error(\"Error generating embedding:\", error);\n\
    \  }\n};\n\nmain();\n```\n\n你注意到使用 SDK 创建的请求中有一个额外的 `encoding_format` 参数吗？该参数是你可以使用的两个主要参数之一，用于微调请求以满足你的需求。让我们探索它们：\n\
    \n"
- fmt: "\n*   `encoding_format`: Decide what format you want the data returned in,\
    \ either as floating point numbers or base64 encoded. The default is `float`,\
    \ but `base64` offers advantages if you prioritize compatibility and portability.\
    \ Base64 data can further compress the data if storage is a significant constraint,\
    \ and many communications protocols handle base64 encoded data more easily.\n\n\
    *   `Dimensions`: Here, you get to specify how many dimensions you want your output\
    \ to be. This feature is only supported, as of the time of this writing, for the\
    \ `text-embedding-3` model from OpenAI. The more dimensionality an embedding has,\
    \ the more context it has—both semantic and syntactic—but it also means the more\
    \ space it takes up. Figuring out the right balance for your data involves fine-tuning\
    \ to achieve the optional dimensionality. In many instances, it’s safer to use\
    \ the default provided by the model.\n\nOnce you’ve submitted your request, the\
    \ API returns the data in the following format:\n\n`[basics_of_vector_embeddings/embedding_api_example_response.json](http://media.pragprog.com/titles/bgvector/code/basics_of_vector_embeddings%2Fembedding_api_example_response.json)`\n\
    \n```json\n| | { |\n| | \"object\": \"list\", |\n| | \"data\": [ |\n| | { |\n\
    | | \"object\": \"embedding\", |\n| | \"embedding\": [ |\n| | 0.0023064255, |\n\
    | | -0.009327292, |\n| | -0.0028842222 |\n| | ], |\n| | \"index\": 0 |\n| | }\
    \ |\n| ], |\n| | \"model\": \"text-embedding-ada-002\", |\n| | \"usage\": { |\n\
    | | \"prompt_tokens\": 8, |\n| | \"total_tokens\": 8 |\n| | } |\n| } |\n```\n\n\
    The API returns the actual embedding inside the `data` array, nested within the\
    \ `embedding` object. In addition to the embedding, you receive information on\
    \ the `model` you used and the total number of tokens created to generate the\
    \ embedding. Tokens are how the language model breaks down text into smaller units\
    \ for processing; they represent chunks of text, as we explained earlier, that\
    \ the model uses to compute embeddings. Understanding the number of tokens consumed\
    \ is important because APIs often charge based on token usage, so monitoring token\
    \ counts helps you manage costs and optimize your application’s performance.\n\
    \nNow that we’ve walked through using the API with the Node.js SDK and explored\
    \ the response from the API, why don’t you send your first request?\n\nCreate\
    \ a new file called `request.js` and add the following, replacing the “Your text\
    \ string goes here” in the input parameter with whatever you wish to turn into\
    \ a vector embedding:\n\n`[basics_of_vector_embeddings/first_api_request.js](http://media.pragprog.com/titles/bgvector/code/basics_of_vector_embeddings%2Ffirst_api_request.js)`\n\
    \n```javascript\nimport OpenAI from \"openai\";\nimport dotenv from \"dotenv\"\
    ;\n\ndotenv.config();\n\nconst openai = new OpenAI({\n  apiKey: process.env.OPENAI_API_KEY,\n\
    });\n\nconst main = async () => {\n  try {\n    const embedding = await openai.embeddings.create({\n\
    \      model: \"text-embedding-ada-002\",\n      input: \"Your text string goes\
    \ here\",\n      encoding_format: \"float\",\n    });\n\n    console.log(embedding.data[0].embedding);\n\
    \    console.log(\"Model used:\", embedding.model);\n    console.log(\"Tokens\
    \ consumed:\", embedding.usage.total_tokens);\n  } catch (error) {\n    console.error(\"\
    Error generating embedding:\", error);\n  }\n};\n\nmain();\n```\n\nCreate a `.env`\
    \ file in the root folder alongside the file and add the following environment\
    \ variable, replacing the your-api-key-here value with your actual OpenAI API\
    \ key:\n\n```text\nOPENAI_API_KEY=your-api-key-here\n```\n\nRemember, do not commit\
    \ your environment variables to any public code repository, such as GitHub.\n"
