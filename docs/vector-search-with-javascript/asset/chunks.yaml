    | ​  | log.debug(​*`Cleaned search query:* ​${cleanedQuery}​*`*​); |


    | ​  |  |


    | ​  | ​*// Determine the search method based on query type*​ |


    | ​  | ​**const**​ searchMethod = cleanedQuery.includes(​*''"''*​) ? ​*''exact''*​
    : ​*''conceptual''*​; |


    | ​  |  |


    | ​  | log.debug(​*`Detected search method:* ​${searchMethod}​*`*​); |


    | ​  |  |


    | ​  | ​**try**​ { |


    | ​  | ​*// Route the query to the appropriate search module*​ |


    | ​  | ​**if**​ (searchMethod === ​*''exact''*​) { |


    | ​  | ​*// Perform keyword-based search*​ |


    | ​  | ​*// Implement keyword search logic here*​ |


    | ​  | } ​**else**​ { |


    | ​  | ​*// Perform vector-based search*​ |


    | ​  | ​*// Implement vector search logic here*​ |


    | ​  | } |


    | ​  |  |


    | ​  | ​*// Return search results*​ |


    | ​  | ​**return**​ res.status(200).json({ results: [], count: 0 }); |


    | ​  | } ​**catch**​ (error) { |


    | ​  | log.error(error, ​*''Error performing search''*​); |


    | ​  | ​**return**​ res.status(500).json({ |


    | ​  | message: ​*''An error occurred while processing the search''*​, |


    | ​  | }); |


    | ​  | } |


    | ​  | }); |


    | ​  |  |


    | ​  | ​**export**​ { performSearch }; |


    First, we import the processQuery utility from the stopWordProcessor.js file.
    We then call this utility to clean the raw query string before proceeding with
    the search operation. The system uses the cleaned query to generate the vector
    search query, removing stop words and focusing on relevant terms.


    By integrating stop-word removal into our search pipeline, we’ve sharpened the
    focus of user queries, delivering more relevant results without losing essential
    context. This improvement optimizes our vector search service and lays a solid
    foundation for future enhancements.


    ## Optimizing Results with a Hybrid Search System


    Hybrid search is another effective optimization technique that complements vector
    search by combining its semantic strengths with traditional keyword matching.
    Vector embeddings excel at understanding concepts but may not always be ideal
    for specific searches, such as locating an exact article title or author. In these
    cases, integrating keyword searches can significantly improve precision and user
    satisfaction by quickly pinpointing exact matches.


    To build a hybrid search system, we’ll create a mechanism that dynamically selects
    between vector and keyword methods based on the query type. You can implement
    this flexibility through user-driven options, such as letting users search explicitly
    “by author” or “by topic,” or through automated logic that detects query intent.
    Offering both approaches ensures relevant results, streamlines the search experience,
    and optimizes the platform’s performance.


    ### Defining Search Method Selection Criteria'
