    # Chapter 3


    Generating Vector Embeddings


    You now understand how embeddings represent meaning in vector form and how they’re
    used in similarity calculations. In this chapter, you’ll learn how to generate
    those embeddings using the OpenAI API. We’ll walk through what the API offers,
    how to use it in code, and how to interpret the results.


    ## Breaking Down an Individual Embedding'
