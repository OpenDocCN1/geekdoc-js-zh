  \nCopyright © 2025, The Pragmatic Bookshelf.\n\n# 第一部分\n\n向量搜索基础\n\n# 第 1 章\n\n\
  入门向量搜索\n\n让我们通过一个快速的示例项目来热身，看看向量搜索有多用。你将在随后的章节中学习所有的底层概念，但现在，我们只是来玩玩，看看向量搜索是如何工作的。在本书之后，你将基于一个广泛采用的开源项目从零开始构建一个可运行的向量搜索项目。本章邀请你处理真实数据、运行真实代码并看到有意义的结果。\n\
  \n\n\n\n想象一下你正在写这本书。没错，写正文花费了一些时间，但你成功地完成了一切……突然之间，你遇到了写作瓶颈。你需要为这本书起一个标题，但你无法想出一个既是一个很棒的标题，又符合你出版社书名风格的名字。我当时就是这样，你猜怎么着，我使用向量搜索来帮助我为这本书找到了最合适的标题。\n\
  \n现在你将遵循同样的流程。使用 `OpenAI API`，将为真实的 Pragmatic 书名生成嵌入（embeddings），将它们存储在本地，并与你自己的标题想法进行比较。这个练习在我们解析背后的深层概念之前，为你提供了一种实用且易于上手的参与方式。你只需要一个文件、一个小数据集以及探索的意愿。\n\
  \n## 设置项目\n\n创建一个名为 `name_this_book.js` 的新文件。这个文件将为你完成所有工作：爬取网站、生成嵌入、进行比较并返回顶部匹配项。嵌入是文本的数值表示，能够捕捉其含义和语境。嵌入是本书中的核心概念，我们将随着内容的推进进行更深入地探索它们。\n\
  \n在安装所需的库之前，请确保你已经安装了 Node.js。你可以从官方网站下载它。安装 Node.js 也会安装 `npm`，这是我们在本书中将到的包管理器。\n\
  \n一旦安装好 Node.js，你需要安装几个库：\n\n```bash\nnpm install node-fetch dotenv cheerio\n```\n\
  \n你需要在本地的 `.env` 文件中一个 OpenAI API 密钥：\n\n```bash\necho \"OPENAI_API_KEY=your-key-here\"\
  \ > .env\n```\n\n## 爬取标题\n\n我们将开始从 Pragmatic Bookshelf 目录中爬取所有标题。他们的网站使用分页，因此我们将遍历所有页面并提取标题、副标题和书籍\
  \ URL。\n\n这是实现该功能的函数：\n\n`[getting_started_with_vector_search/name_this_book.js](http://media.pragprog.com/titles/bgvector/code/getting_started_with_vector_search%2Fname_this_book.js)`\n\
  \n```javascript\nasync function scrapeTitles() {\n  const baseURL = 'https://pragprog.com';\n\
  \  const maxPages = 27;\n  const maxTitles = 50;\n  const allBooks = [];\n\n  console.log(`Scraping\
  \ up to ${maxTitles} book titles from Pragmatic Bookshelf...`);\n\n  for (let page\
  \ = 1; page <= maxPages; page++) {\n    const pageURL = page === 1\n      ? `${baseURL}/titles/`\n\
  \      : `${baseURL}/titles/page/${page}`;\n\n    console.log(` - Fetching page\
  \ ${page}`);\n\n    const res = await fetch(pageURL);\n    const html = await res.text();\n\
  \    const $ = cheerio.load(html);\n\n    $('.category-title-container').each((_,\
  \ el) => {\n      if (allBooks.length >= maxTitles) return false;\n      const anchor\
  \ = $(el).find('a').first();\n      const title = $(el)\n        .find('.category-title-title\
  \ b')\n        .text()\n        .trim();\n      const subtitle = $(el)\n       \
  \ .find('.category-title-subtitle')\n        .text()\n        .trim();\n      const\
  \ url = anchor.attr('href');\n      if (title && url) {\n        allBooks.push({\
  \ title, subtitle, url });\n      }\n    });\n\n    if (allBooks.length >= maxTitles)\
  \ break;\n  }\n\n  const unique = Array.from(\n    new Map(allBooks.map(b => [b.url,\
  \ b])).values()\n  );\n\n  console.log(`Finished scraping.${unique.length} titles.`);\n\
  \  return unique;\n}\n```\n\n该函数遍历每一个页面，使用 JavaScript 库 `Cheerio` 解析标题和副标题，并返回一个唯一条目列表。你处理的是真实的\
  \ HTML。爬取通常是混乱的且需要耐心。Pragmatic 目录的结构很干净，但请记住网站可能会改变。这种工作始终是脆弱的。如果网站布局或类名发生变化，你的爬虫可能会崩溃。这意味着你的下游流程（例如生成嵌入或运行比较）可能会在使用不完整或过时的数据上工作。\n\
  \n## 为标题嵌入\n\n接下来，我们将使用 OpenAI 的 `text-embedding-small` 模型为每个完整标题生成嵌入。让我们定义一个辅助函数来生成单个嵌入：\n\
  \n`[getting_started_with_vector_search/name_this_book.js](http://media.pragprog.com/titles/bgvector/code/getting_started_with_vector_search%2Fname_this_book.js)`\n\
  \n```javascript\nasync function getEmbedding(text) {\n  console.log(`Generating\
  \ embedding for \"${text}\"`);\n  try {\n    const res = await fetch('https://api.openai.com/v1/embeddings',\
  \ {\n      method: 'POST',\n      headers: {\n        Authorization: `Bearer ${process.env.OPENAI_API_KEY}`,\n\
  \        'Content-Type': 'application/json',\n      },\n      body: JSON.stringify({\n\
  \        input: text,\n        model: 'text-embedding-small',\n      }),\n    });\n\
  \n    if (!res.ok) {\n      console.error(`API request failed with status ${res.status}:\
  \ ${res.statusText}`);\n      return null;\n    }\n\n    const data = await res.json();\n\
  \n    if (!data || !data.data || !Array.isArray(data.data) || data.data.length ===\
  \ 0) {\n      console.error('Unexpected API response:', JSON.stringify(data, null,\
  \ 2));\n      return null;\n    }\n\n    if (!data.data[0].embedding) {\n      console.error('No\
  \ embedding found in response:', JSON.stringify(data.data[0], null, 2));\n     \
  \ return null;\n    }\n\n    return data.data[0].embedding;\n  } catch (error) {\n\
  \    console.error(`Error generating embedding for \"${text}\"`, error.message);\n\
  \    return null;\n  }\n}\n```\n\n然后，使用该函数对所有标题进行嵌入：\n\n`[getting_started_with_vector_search/name_this_book.js](http://media.pragprog.com/titles/bgvector/code/getting_started_with_vector_search%2Fname_this_book.js)`\n\
  \n```javascript\nasync function embedTitles(books) {\n  console.log(\"Generating\
  \ embeddings for all titles...\");\n  const promises = books.map((book, i) => {\n\
  \    const fullTitle = book.subtitle\n      ? `${book.title}:${book.subtitle}`\n\
  \      : book.title;\n\n    console.log(` (${i + 1}/${books.length}) ${fullTitle}`);\n\
  \n    return getEmbedding(fullTitle).then(embedding => {\n      book.embedding =\
  \ embedding;\n      return book;\n    });\n  });\n\n  const booksWithEmbeddings\
  \ = await Promise.all(promises);\n  // 过滤掉未能获取嵌入的书籍\n  const validBooks = booksWithEmbeddings.filter(book\
  \ => book.embedding !== null);\n\n  if (validBooks.length < books.length) {\n  \
  \  console.log(`Warning: ${books.length - validBooks.length} books failed to get\
  \ embeddings and were excluded.`);\n  }\n}\n```\n\n\n\n\n\n| ​� | `return` validBooks;\
  \ |\n\n| ​� | } |\n\n这会将标题和副标题（如果存在）合并，并为每本书生成一个嵌入（embedding）。所有的嵌入请求会同时发出并并行处理。这可以提高速度，但如果你正在处理大型数据集或有严格的\
  \ API 速率限制，可能希望对请求进行节流或批量处理。\n\n如果这个过程仍然让你感到神秘，请担心。在下一章节中，我们将详细解析嵌入的工作原理，以及为什么它们是搜索和推荐领域如此强大的工具。\n\
  \n## 与你的标题想法进行比较\n\n现在你将嵌入一个新的标题想法，并使用余弦相似度与目录进行比较。以下是计算向量之间相似度的方法：\n\n[getting_started_with_vector_search/name_this_book.js](http://media.pragprog.com/titles/bgvector/code/getting_started_with_vector_search%2Fname_this_book.js)\n\
  \n```javascript\nfunction cosineSimilarity(a, b) {\n  const dot = a.reduce(\n  \
  \  (sum, ai, i) => {\n      return sum + ai * b[i];\n    },\n    0\n  );\n  const\
  \ magA = Math.sqrt(\n    a.reduce((sum, ai) => {\n      return sum + ai * ai;\n\
  \    }, 0)\n  );\n  const magB = Math.sqrt(\n    b.reduce((sum, bi) => {\n     \
  \ return sum + bi * bi;\n    }, 0)\n  );\n  return dot / (magA * magB);\n}\n```\n\
  \n以下是我们查找并排序顶部匹配项的方法：\n\n[getting_started_with_vector_search/name_this_book.js](http://media.pragprog.com/titles/bgvector/code/getting_started_with_vector_search%2Fname_this_book.js)\n\
  \n```javascript\nfunction compareTitles(queryEmbedding, books) {\n  console.log('Comparing\
  \ against catalog...');\n  return books\n    .map(book => ({\n      ...book,\n \
  \     similarity: cosineSimilarity(\n        book.embedding,\n        queryEmbedding\n\
  \      ),\n    }))\n    .sort((a, b) => b.similarity - a.similarity)\n    .slice(0,\
  \ 5);\n}\n```\n\n### 整合一切\n\n最后，让我们将一切连接起来。这个 `main()` 函数运行整个流程：爬取、嵌入、存储和比较。\n\n\
  [getting_started_with_vector_search/name_this_book.js](http://media.pragprog.com/titles/bgvector/code/getting_started_with_vector_search%2Fname_this_book.js)\n\
  \n```javascript\nasync function main() {\n  const DATA_FILE = 'pragprog_titles.json';\n\
  \  let books;\n\n  if (fs.existsSync(DATA_FILE)) {\n    console.log(`Loading cached\
  \ data from ${DATA_FILE}...`);\n    books = JSON.parse(fs.readFileSync(DATA_FILE,\
  \ 'utf8'));\n  } else {\n    console.log('No cached data found. Starting fresh.');\n\
  \n    books = await scrapeTitles();\n    books = await embedTitles(books);\n   \
  \ fs.writeFileSync(\n      DATA_FILE,\n      JSON.stringify(books, null, 2)\n  \
  \  );\n\n    console.log(`Saved ${books.length} books to ${DATA_FILE}`);\n  }\n\n\
  \  const query = process.argv.slice(2).join(' ');\n  if (!query) {\n    console.error(\n\
  \      'Please pass a proposed title as a command-line argument'\n    );\n  }\n\
  }\n```\n\n\n\n此前，你为真实的书名生成了嵌入（embeddings），并使用余弦相似度对它们进行比较。每个标题变成了一个数字列表，即向量，而你建议的标题也以相同的方式嵌入。然后，脚本根据这些向量的相似程度对结果进行排序。\n\
  \n这一切都是在所谓的“高维数据”基础上运行的。高维数据意味着每个项目由许多数值特征描述（有时是数百个甚至数千个），而不是仅仅两个或三个。\n\n这就是向量搜索的核心思想：将事物表示为共享空间中的数字，并衡量它们之间的距离。但在你看到这些数字是如何运作之前，这可能会感觉很抽象。\n\
  \n让我们来简化一下。暂时忘记高维空间。假设我们正在比较颜色。我们可以使用红、绿、蓝的 RGB 值来描述一种颜色。这三个数字组成了一个向量。蓝色是 `[0, 0,\
  \ 255]`，红色是 `[255, 0, 0]`，黄色是 `[255, 255, 0]`，依此类推。如果你有一个新颜色，比如石板蓝（`[91, 124, 153]`），你可以将它与已知颜色进行比较，看看它最接近什么。\n\
  \n这正是我们对书名所做的。唯一的区别在于维度。我们处理的不是 RGB 那样的 3 个数字，而是 1536 个数字。但目标是相同的：将每个项目表示为一个向量，然后找到最近的一个。\n\
  \n当你看到标题 `Learning Vector Search with JavaScript` 生成了顶级匹配项，如 `A Common-Sense Guide\
  \ to Data Structures and Algorithms in JavaScript` 和 `Machine Learning in Elixir`\
  \ 时，你就看到了实际操作。系统并没有匹配精确的单词。它是在比较高维向量，并在数百个抽象特征中寻找模式。指向相似方向的向量被判断为更加相似。\n\n那么是什么产生了这些向量呢？我们如何从原始文本变为捕捉含义的数字？这就是嵌入大显用场的地方。\n\
  \n## 解析嵌入的概念\n\n文本比颜色更复杂。你需要一种方法为标题或段落生成向量，使得两个含义相似的文本在向量空间中产生彼此接近的点。一种常用技术是创建所谓的“嵌入”（embedding）。\n\
  \n嵌入是一个长数字列表。每个数字代表由机器学习模型提取的特征。如果你使用 OpenAI 的嵌入模型，每个向量都有 1536 维。你可以将这些想象为巨大坐标空间中的轴。\n\
  \n目标是让意义相似的文本具有相似的嵌入。例如，“Learning JavaScript”（学习 JavaScript）和“Mastering JavaScript”（精通\
  \ JavaScript）这两个短语在向量空间中应该彼此，因为它们共享相同的内容和教育意图。“Exploring Ruby”（探索 Ruby）这样的短语可能接近，因为它具有相似的结构和目的。但像“Deploying\
  \ Kubernetes at Scale”（大规模部署 Kubernetes）这样的短语就会远得多，尽管它也描述了一种技术技能，但因为它属于完全不同的领域。\n\
  \n你通过将文本输入预训练模型来创建嵌入。该模型已经通过在海量数据集上的训练学习了语言是如何运作的。它将自己所知的一切压缩到一组内部权重中。当你传入新文本时，它会产生一个捕捉输入关键层面的向量。这个过程现在可能像一个黑盒，但我们将逐步揭开它的神秘。\n\
  \n## 理解相似性\n\n一旦你有了嵌入，下一个问题就是如何比较它们。换句话说，你如何判断哪些向量是彼此靠近的？\n\n为了比较嵌入，我们需要一种衡量两个向量之间相似程度的方法。最常见的方法是余弦相似度（衡量向量之间的角度，不考虑其大小）和点积（同时考虑它们的方向和幅度）。余弦相似度回答了“这些向量指向相同的方向吗？”，而点积增加了一个问题：“那个信号有多强？”\n\
  \n为了让它更具象化，想象正在比较水果。假设我们使用虚构的 3D 嵌入来表示“苹果”、“香蕉”和“橙子”。这些数字可能反映每种水果的甜度、纤维质或酸度。如果向量很接近，我们就假设水果是相似的。\n\
  \n事实上，让我们计算一下。\n\n[understanding_vector_search/similarity_applies_bananas_oranges.js](http://media.pragprog.com/titles/bgvector/code/understanding_vector_search%2Fsimilarity_applies_bananas_oranges.js)\n\
  \n```javascript\nconst vectors = {\n  Apple: [0.9, 0.1, 0.0],\n  Banana: [0.7, 0.3,\
  \ 0.0],\n  Orange: [0.8, 0.2, 0.1],\n};\n\n/**\n * 计算两个向量的点积。\n * @param {Array<number>}\
  \ vec1 - 第一个向量。\n * @param {Array<number>} vec2 - 第二个向量。\n * @returns {number} -\
  \ 向量的点积。\n */\nconst calculateDotProduct = (vec1, vec2) =>\n  vec1.reduce((sum,\
  \ value, index) => sum + value * vec2[index], 0);\n```\n\n\n\n嵌入（Embeddings）是数据的密集向量表示，能够捕捉不同实体之间的关系。我们使用嵌入来表示数据，使得相似性计算等操作变得更加简单。嵌入同时捕捉实体之间的语义关系和句法关系。例如，在单词的情况下，嵌入可以捕捉诸如“国王之于女王”这种语义关系，以及“国王之于多个国王（复数）”这种句法关系。\n\
  \n这在现实中是什么样子的？让我们以国王和女王的为例，展示我们如何将它们表示为嵌入。在单词嵌入的情况下，单词 `king` 可能被表示为如下所示向量嵌入：\n\n\
  ```\n[\n  0.010183674,\n  -0.003974117,\n  0.0073341774,\n  -0.011770561,\n  -0.031903327,\n\
  \  0.018601075,\n  -0.014723551,\n  -0.03132377,\n  ...\n]\n```\n\n为什么我在向量末尾包含了省略号？因为这个向量比我在这里展示的要得多！这是因为取决于生成嵌入的模型，向量的长度可以是不同的，而且通常很长。\n\
  \n### 你知道吗？嵌入与语言\n\n嵌入被广泛应用于自然语言处理（NLP），以一种捕捉其含义的方式来表示单词和短语。这有助于解决多义性等挑战，例如像 `dive`\
  \ 这样的词根据上下文的不同有多种含义。嵌入根据用法来消除歧义。\n\n它们的性能也优于词干（stemming，将 `jogging, jogged, jogs`\
  \ 还原为 `jog`）和词还原（lemmatization，将 `ran, running, runs` 还原为 `run`）。嵌入并不依赖规则，而是通过从上下学习来自然地捕捉这些关系。\n\
  \n在此例中，生成单词 `king` 嵌入的模型是 OpenAI 的 `text-embedding-ada-002`。该模型创建的嵌入具有 1,536 个维度。维度意味着向量是一个包含\
  \ 1,536 个值的列表，每个值代表单词 `king` 的一个不同方面。在第 9 章“引入向量搜索功能”中，我们将探索如何通过减少向量的维度来优化嵌入结果。向量降维是一个复杂的课题，因为涉及到嵌入质量与生成这些嵌入所需的计算资源之间的权衡。然而，它会影响你的整体性能和成本效益。\n\
  \n这些浮点数中的每个值都代表了单词 `king` 的不同语义和句法方面。生成嵌入的模型已经学习如何以一种捕捉其与其他单词关系的方式来表示单词 `king`。正如我们上面所说，这意味着\
  \ `king` 和 `queen` 在向量空间中将彼此很近，而 `king` 和 `apple` 之间的距离会更远。\n\n### 你知道吗？嵌入模型 vs\
  \ 生成式模型\n\n嵌入模型（如 OpenAI 的 `Ada`）创建数据的密集向量表示，捕捉有利于搜索或推荐的语义关系。相比之下，生成式模型（如 `GPT`）产生内容——如文本、图像或音频。两者都使用了\
  \ transformers，但嵌入模型聚焦于上下文向量的创建，而生成式模型则顺序生成连贯的内容。\n\n## 使用 OpenAI API 生成嵌入\n\n你现在准备好迈出向量搜索的第一步了。在过去的几个章节中，你已经探索了向量背后的概念、向量嵌入、生成式模型和嵌入模型等。所有这些知识已让你能够开始开发你的第一个向量搜索应用程序。在软件开发中，我们的目标是让事物变得易懂，而不是神秘。这就是为什么我们花这段时间建立你的理解，以便你建立信心。\n\
  \n如之前提到的，我们将使用 OpenAI Embeddings API 来生成嵌入。OpenAI Embeddings API 是一个强大的工具，允许你为文本、图像等生成嵌入。该\
  \ API 易于使用且文档齐全，对于初接触嵌入的开发者来说是一个极佳的选择。在本节中，我们将学习如何使用 OpenAI API 生成嵌入。我们将探索 API 中提供的各种选项，以及如何利用它们为你的数据创建嵌入。\n\
  \nOpenAI 为 Node.js 维护了一个官方 SDK，该 SDK 包含了 OpenAI APIs 的所有功能，包括 Embeddings API。你可以通过\
  \ Node.js 包管理器 `npm` 运行以下命令来安装 SDK：\n\n```\nnpm install openai\n```\n\n除了使用 SDK\
  \ 之外，你还可以直接使用 `cURL` 发起 API 调用。OpenAI 文档为所有相关示例都提供了 `cURL`、Node.js 和 Python 的代码片段。我们将在书中适当的地方使用这些代码示例。\n\
  \n无论是使用 SDK 还是使用 `cURL` 发起 API 调用，你都需要一个 API key 来验证你的请求。你可以通过在 OpenAI 平台上注册账户来获取\
  \ API key。一旦有了 API key，就可以使用它来验证请求并访问 OpenAI APIs。对于 `cURL` 请求，你需要在请求头中包含该 API key。对于\
  \ Node.js SDK，你将在节实例化 `OpenAI` 客户端的新实例时提供 API key。\n\n这里有一个取自官方文档的 `cURL` 请求示例；我们将详细查看每个参数：\n\
  \n```bash\ncurl https://api.openai.com/v1/embeddings\n  -H \"Content-Type: application/json\"\
  \n  -H \"Authorization: Bearer $OPENAI_API_KEY\"\n  -d '{\n    \"input\": \"Your\
  \ text string goes here\",\n    \"model\": \"text-embedding-3-small\"\n  }'\n```\n\
  \n首先，我们看到 API 端点的 URL `https://api.openai.com/v1/embeddings`。接下来，我们看到请求头。`Content-Type`\
  \ 头指定请求体为 JSON。`Authorization` 头包含用于验证请求的 API key。最后，我们看到请求体，它包含了输入文本和模型。在这种情况下，输入文本是“Your\
  \ text string goes here”，模型是“text-embedding-3-small”。\n\n可用模型列表也可以在文档中找到，新模型不时推出，现有模型也会更新。实际上，无论是在\
  \ `cURL` 请求还是 SDK 中，我们需要提供的两个参数都是 `input` 和 `model`。使用 SDK 的相同请求将如下：\n\n`basics_of_vector_embeddings/first_api_request.js`\n\
  \n```javascript\nconst main = async () => {\n  try {\n    const embedding = await\
  \ openai.embeddings.create({\n      model: \"text-embedding-ada-002\",\n      input:\
  \ \"Your text string goes here\",\n      encoding_format: \"float\",\n    });\n\n\
  \    console.log(embedding.data[0].embedding);\n    console.log(\"Model used:\"\
  , embedding.model);\n    console.log(\"Tokens consumed:\", embedding.usage.total_tokens);\n\
  \  } catch (error) {\n    console.error(\"Error generating embedding:\", error);\n\
  \  }\n};\n\nmain();\n```\n\n你注意到使用 SDK 创建的请求中有一个额外的 `encoding_format` 参数吗？该参数是你可以使用的两个主要参数之一，用于微调请求以满足你的需求。让我们探索它们：\n\
  \n\n\n\n\n*   `encoding_format`: 决定你希望返回的数据格式，可以是浮点数或 base64 编码。默认值为 `float`，但如果你优先考虑兼容性和可移植性，`base64`\
  \ 则更具优势。如果存储是一个主要的限制因素，Base64 数据可以进一步压缩数据，而且许多通信协议更方便地处理 base64 编码数据。\n\n*   `Dimensions`:\
  \ 在此处，你可以指定输出的维度。截至本文编写时，此功能仅支持 OpenAI 的 `text-embedding-3` 模型。嵌入的维度越高，它包含的上下文（包括语义和句法）就越多，但也意味着它占用的空间越大。为你的数据找到合适的平衡需要通过微调来达到可选的维度。在许多情况下，使用模型提供的默认值更为安全。\n\
  \n一旦提交了请求，API 将以以下格式返回数据：\n\n[basics_of_vector_embeddings/embedding_api_example_response.json](http://media.pragprog.com/titles/bgvector/code/basics_of_vector_embeddings%2Fembedding_api_example_response.json)\n\
  \n```json\n| | { |\n| | \"object\": \"list\", |\n| | \"data\": [ |\n| | { |\n| |\
  \ \"object\": \"embedding\", |\n| | \"embedding\": [ |\n| | 0.0023064255, |\n| |\
  \ -0.009327292, |\n| | -0.0028842222 |\n| | ], |\n| | \"index\": 0 |\n| | } |\n\
  | ], |\n| | \"model\": \"text-embedding-ada-002\", |\n| | \"usage\": { |\n| | \"\
  prompt_tokens\": 8, |\n| | \"total_tokens\": 8 |\n| | } |\n| } |\n```\n\nAPI 在 `data`\
  \ 数组中返回实际嵌入，嵌套在 `embedding` 对象中。除了嵌入之外，你还会收到关于使用的 `model` 信息以及生成嵌入所需的的 token 总数。Token\
  \ 是语言模型将文本拆分为较小单元进行处理的方式；正如我们之前解释过的，它们代表了模型用于计算嵌入的文本块。理解消耗的 token 数量非常重要，因为 API\
  \ 通常根据 token 使用情况计费，因此监控 token 计数有助于你管理成本并优化应用程序的性能。\n\n现在我们已经学习了如何使用 Node.js SDK\
  \ 调用 API 并探索了 API 的响应，为什么不发送你的第一个请求呢？\n\n创建一个名为 `request.js` 的新文件并添加以下内容，将输入参数中的“Your\
  \ text string goes here”替换为你任何想要转换为向量嵌入的文本：\n\n[basics_of_vector_embeddings/first_api_request.js](http://media.pragprog.com/titles/bgvector/code/basics_of_vector_embeddings%2Ffirst_api_request.js)\n\
  \n```javascript\nimport OpenAI from \"openai\";\nimport dotenv from \"dotenv\";\n\
  \ndotenv.config();\n\nconst openai = new OpenAI({\n  apiKey: process.env.OPENAI_API_KEY,\n\
  });\n\nconst main = async () => {\n  try {\n    const embedding = await openai.embeddings.create({\n\
  \      model: \"text-embedding-ada-002\",\n      input: \"Your text string goes\
  \ here\",\n      encoding_format: \"float\",\n    });\n\n    console.log(embedding.data[0].embedding);\n\
  \    console.log(\"Model used:\", embedding.model);\n    console.log(\"Tokens consumed:\"\
  , embedding.usage.total_tokens);\n  } catch (error) {\n    console.error(\"Error\
  \ generating embedding:\", error);\n  }\n};\n\nmain();\n```\n\n在与该文件相同的根目录下创建一个\
  \ `.env` 文件，并添加以下环境变量，将 `your-api-key-here` 值替换为你真实的 OpenAI API 密钥：\n\n```text\n\
  OPENAI_API_KEY=your-api-key-here\n```\n\n记住，不要将你的环境变量提交到任何公共代码仓库（例如 GitHub）。\n\n\
  \n\n\n现在你已经知道了要构建什么，让我们来奠定基础。\n\n脚手架搭建（Scaffolding）涉及创建必要的目录和文件、安装依赖以及配置核心设置。\n\n\
  不过，我们并不会从零开始构建博客平台！相反，我们将利用 `RealWorld Example Apps` 项目，该项目旨在用尽可能多的编程语言和框架创建功能完整的示例应用程序。`RealWorld\
  \ Example Apps` 项目提供了一个功能齐全的博客平台，包括用户身份验证、文章创建、文章编辑、文章删除和文章搜索功能。`RealWorld` 项目的创建者将这些博客称为\
  \ `Conduit`，你可以按照前端、后端和全栈版本找到社区已经创建的所有实现版本。\n\n如果你在本书的任何阶段遇到困难，你随时可以在 GitHub 上找到我们正要构建的整个项目的代码。在整个过程的不同阶段，我们都会回溯到代码库，因此你甚至不需要书签此页面。\n\
  \n为我们的 `Node.js` 项目创建脚手架的第一步是创建必要的目录和文件。我们将首先为项目创建一个新目录，然后在该目录内创建必要的子目录。我们需要以下目录，从项目的根目录开始，你可以将其命名为任何名称，例如\
  \ `vector-blog-platform`。\n\n我们将开始将博客平台的后端设置为一个 `API service`。为了实现这一点，我们将项目组织成清晰的目录结构，将数据存储、嵌入逻辑和路由等关注点分离。这种布局使得未来扩展应用程序变得容易，包括添加一个既可以自己构建、也可以从\
  \ GitHub 仓库中复制的前端。\n\n请在你的项目根目录中创建以下目录：\n\n*   `api/`：包含后端的的核心 `API` 逻辑和配置，包括安全性和数据库连接。\n\
  *   `config/`：包含后端的配置文件，包括环境变量和数据库连接设置。\n*   `controllers/`：包含控制器文件，用于处理各种路由的请求和响应。\n\
  *   `middleware/`：包含自定义中间件逻辑，例如身份验证和 `JWT` 验证。\n*   `models/`：包含模型文件，定义存储在数据库中的数据结构。\n\
  *   `routes/`：包含应用程序中不同端点的路由定义。\n*   `views/`：如果通过 Web 浏览器访问 `API service`，则包含服务器渲染的默认视图。\n\
  \n当你创建了所有文件夹后，你的文件夹结构应该如下所示：\n\n```\n| vector-blog-platform/\n|├── api/\n|├── config/\n\
  |├── controllers/\n|├── middleware/\n|├── models/\n|├── routes/\n|├── views/\n```\n\
  \n你现在已经创建了项目的基础文件夹结构。在书中，随着我们构建博客平台的功能，我们将向此结构中添加文件和目录。下一步是为项目安装必要的依赖，并配置存储博客文章嵌入的向量数据库。\n\
  \n在继续安装依赖之前，是讨论向量嵌入和向量搜索的数据库专门化的重要性。向量的特殊性质意味着我们需要仔细考虑为它们提供高效的存储方式，同时还要为我们提供快速查询的能力。在下一节中，我们将讨论在为项目选择数据库时应该考虑的因素。\n\
  \n## 选择向量数据库\n\n你可能会看到这个节标题并心想：“为什么我为向量嵌入需要一个特殊的数据库？我难道不能直接使用任何数据库吗？”在我们要构建的示例项目中，我们需要一个可以处理“常规”数据的数据库——即非向量嵌入的数据，如博客内容、用户配置和类似信息，我们还需要一个能够高效存储、索引和查询向量嵌入的数据库。我们可以将这些关注点分开，但我们的意图是不引入任何额外的复杂性，并减少数据库基础设施的扩散。因此，我们需要一个能够处理多种类型数据的数据库，包括结构化、非结构化和半结构化数据。\n\
  \n向量嵌入是非结构化数据，它们也是高维的。正如我们在第 2 章*理解向量搜索*中讨论过的，高维意味着嵌入有许多描述数据的特征。`OpenAI Ada` 嵌入模型有\
  \ 1,536 维，这意味着每个嵌入都是包含 1,536 个值的列表。这是一个大量需要存储和查询的数据，特别是考虑到我们还要为每篇博客文章和每个用户查询存储嵌入！因此，我们还需要一个能够高效处理高维数据的数据库。\n\
  \n针对性能进行优化意味着还要具有正确索引向量嵌入数据的能力。索引向量嵌入意味着创建一个数据结构，允许根据向量与查询向量的相似性快速检索向量。与依赖精确匹配的传统索引（如关键词搜索，正如我们在第\
  \ 3 章*生成向量嵌入*中解释的那样）不同，向量索引侧重于相似性搜索，也就是说找到与查询最接近的向量。\n\n我们将在第 7 章*创建向量搜索服务*中详细讨论向量搜索索引的机制和设置，但现在重要的是理解，我们选择的数据库必须能够高效处理嵌入索引。数据库必须能够快速创建和更新索引，并且能够查询索引以及时返回结果。\n\
  \n现在我们对数据库的要求有了更好的了解，让我们来看看可用于存储和查询向量嵌入的各种类型数据库：\n\n*   **文档数据库**是以文档格式（如 `JSON`\
  \ 或 `XML`）存储数据的数据库。文档数据库非常适合存储非结构化数据（如向量嵌入），因为它们不需要预定义的模式。文档数据库可以针对高维数据的查询和索引进行优化，使其存储向量嵌入的良好选择。\n\
  *   **图数据库**是以图格式存储数据的数据库，其中节点表示实体，边表示实体之间的关系。图数据库非常适合存储和查询数据之间复杂的关系，例如向量嵌入之间的关系。图数据库还可以优化高维数据的查询和索引，使其存储向量嵌入的另一个良好选择。\n\
  *   **SQL 数据库**是以行和列表格形式存储数据的关系型数据库。SQL 数据库非常适合存储结构化数据（如用户配置和博客内容），但它们也可以用于存储向量嵌入。虽然这可能不是最常见的路径，但它们确实能够存储和查询向量嵌入。\n\
  \n## 其他数据库选项\n\n在上述三类数据库的任何一类中都有许多部署选项。以下是你可以供项目考虑的数据库详尽但非穷尽的列表，按数据库类型分类：\n\n\n\n\
  \n\n- 文档数据库：`MongoDB`, `Pinecone`\n- 图谱数据库：`Neo4j`, `TigerGraph`\n- SQL 数据库：`Supabase`,\
  \ `Neon`\n\n每个选项都提供了多种部署方法、定价结构和功能 set，包括托管型和自托管解决方案。虽然全面的对比超出了我们的讨论范围，但我鼓励你探索并选择最符合你需求和预算的选项。\n\
  \n在本书中，我们将使用 `Couchbase` 作为我们选定的数据库。`Couchbase` 优化了高维数据的存储和查询，使其非常适合存储向量嵌入。它还提供了\
  \ `Capella`，这是一个完全托管的云服务，可以一键部署到 `AWS`、`Google Cloud` 或 `Azure`。除了技术能力外，`Capella`\
  \ 还提供了慷慨的免费层级，这对于像这样项目中的实验和学习非常理想。\n\n我们正在使用文档数据库，具体是一个 `JSON` 文档数据库，因为它允许我们处理灵活的半结构化数据。`JSON`（JavaScript\
  \ 对象表示）是一种轻量级且易于阅读的格式，用于以键值对的形式存储数据。它在 Web 开发中被广泛使用，并与基于 `JavaScript` 的工具无缝协作。文档模型使其易于存储和查询各种数据类型，包括向量嵌入、博客文章和用户配置，所有这些格式都与我们正在构建的应用程序结构高度契合。\n\
  \n设置 `Node.js` 项目的下一步是安装必要的依赖项。依赖项是项目正常运行所依赖的外部库或包。\n\n## 安装依赖项\n\n在本节中，我们将为 `Node.js`\
  \ 项目安装依赖项，包括我们将用于与向量数据库交互，以及为博客文章生成并存储嵌入的库和工具。\n\n为了在我们的项目中安装依赖项，我们需要在项目根目录下准备一个\
  \ `package.json` 文件。`package.json` 文件是一个清单文件，包含了关于项目的元数据，包括项目名称、版本、描述和依赖项。它是 `npm`\
  \ 用于安装包包和管理项目依赖项的主要文件。\n\n幸运的是，`npm` 提供了一个可以为你生成 `package.json` 文件的命令。要生成 `package.json`\
  \ 文件，请在项目根目录下运行以下命令：\n\n```\nnpm init -y\n```\n\n`-y` 标志告诉 `npm` 在运行 `npm init`\
  \ 命令时，对通常出现的提示使用默认值。命令执行完成后，它将在终端中输出 `package.json` 文件的结构。它应该类似于以下：\n\n```json\n\
  {\n  \"name\": \"vector-blog-platform\",\n  \"version\": \"1.0.0\",\n  \"description\"\
  : \"\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"test\": \"echo \\\"\
  Error: no test specified\\\" && exit 1\"\n  },\n  \"keywords\": [],\n  \"author\"\
  : \"\",\n  \"license\": \"ISC\",\n  \"dependencies\": {\n    \"ottoman\": \"².5.1\"\
  ,\n    \"openai\": \"⁴.96.2\",\n    \"dotenv\": \"¹⁶.5.0\"\n  }\n}\n```\n\n现在我们已经有了\
  \ `package.json` 文件，可以开始为项目安装依赖项了。我们进展非常顺利！在这个阶段，我们本可以直接列出要安装的依赖项，但那样你就只是在“复制和粘贴”，而不理解你安装了什么。让我们花点时间了解我们将要安装的依赖项以及为什么需要它们。\n\
  \n在安装依赖项时，我们需要考虑应用程序开发的三个领域。数据库是其中之一，正如我们之前讨论的，我们不能使用任何数据库，而是需要一个能够存储、索引和查询向量嵌入的数据库。我们将使用\
  \ `ORM`（或对象关系映射库）来与数据库交互。`ORM` 是一种编程结构，使我们能够像使用面向对象的编程语言一样，使用对象与数据库中的数据进行交互。通过示例可能会更容易理解。\n\
  \n我们在本项目中使用的的大部分库（包括 `OpenAI SDK` 和 `Ottoman`）都执行异步操作。这些操作需要时间——例如查询数据库或发送网络请求——在通常情况下会阻止程序的继续运行。为了处理这个问题，我们将使用\
  \ `JavaScript` 的 `async/await` 语法。`async/await` 允许我们编写看起来和行为上更像普通同步代码的异步代码，使其更容易阅读和维护。在书中，每当我们获取数据、存储嵌入或与外部\
  \ API 交互时，都会看到这种模式。\n\n假设你的应用程序有用户，用户模型可能像所示：\n\n```json\n{\n  \"id\": 1,\n  \"\
  name\": \"John Doe\",\n  \"email\": \"john.doe@example.com\",\n  \"password\": \"\
  hashed_password\",\n  \"created_at\": \"2024-01-01T00:00:00Z\",\n  \"updated_at\"\
  : \"2024-05-01T00:00:00Z\"\n}\n```\n\n`User` 类表示数据库中的一条用户记录。你可以创建一个新的 `User` 对象，设置其属性并将其保存到数据库中。`ORM`\
  \ 库负责将对象翻译为数据库查询。这是关于 `ORM` 如何工作以及它为什么在应用程序开发中有所帮助的层层概述。\n\n使用 `ORM` 的最大优势之一是它简化了数据查询。与其编写原始查询或复杂的数据库调用，像\
  \ `Ottoman` 这样的 `ORM` 让你使用熟悉的 JavaScript 方法和链式调用来表达你想要的内容。这在查询 `JSON` 文档数据库中常见的嵌套或层次结构数据时特别有用。例如，查找带有特定标签的所有博客文章或根据相似分数检索用户记录，可以使用直观的方法（如带有过滤条件的\
  \ `Model.find()`）完成，`Ottoman` 会在后台将其转换为优化的查询。这不仅提高了可读性，还降低了编写低效或错误查询的风险。\n\n\n\n\
  \n第二个关键步骤是将博客内容转换为向量嵌入（vector embeddings），以便我们能够进行相似性搜索。我们还将用户的用户的查询转换为向量嵌入，用以搜索内容。为每个查询生成新的嵌入需要快速完成，因此我们需要考虑性能，并确保该过程尽可能耗短。近期对用户行为的研究显示，如果响应加载时间超过三秒，40%\
  \ 的用户将离开网站。（[[12]](#f_0037.xhtml_FOOTNOTE-12））这是一个巨大的压力，因此我们需要确保选择的平台和我们构建的 SDK\
  \ 能够处理这些负载。\n\n内容到嵌入的转换可以在内容创建时进行，因此我们还需要建立一套标准，规定在作者添加新内容时何时更新嵌入。例如，是否每次编辑都值得修订嵌入？还是说只有某些编辑需要？这些都是我们在构建博客平台功能时需要回答的问题。目前，可以安全地说，纠正一个简单的拼写错误可能不应该触发新的嵌入生成。或者应该呢？我们将这个问题留到以后在讨论优化搜索结果和其他更高级的话题时讨论。\n\
  \n我们将依赖的最后一个应用程序管理领域是环境变量。环境变量设置在应用程序之外，以便在运行时对其进行配置。它们存储敏感数据，例如 API 密钥或数据库连接字符串，将这些信息排除在代码库之外。使用环境变量使得你的应用程序更加安全，并且在不同环境中易于配置。\n\
  \n如果我不提到强制性的安全警告，将是失职的。在处理环境变量时，重要的是不要将敏感信息提交到你的版本控制系统中。务始终将你的环境变量添加到 `.env` 文件中，并将该文件包含在\
  \ `.gitignore` 中防止其被提交。这将有助于在开发过程中保持你的敏感信息安全。\n\n然而，对于生产环境，不建议在 `.env` 文件中存储密钥。相反，请使用安全的方法，例如在运行时从密钥管理器注入环境变量，或从云平台或容器编排系统提供的挂载密钥位置读取它们。这增加了额外的保护层，并确保你的密钥在生产环境中安全地处理。\n\
  \n在了解了这些依赖项的原因和内容后，让我们指定一下将为项目安装的依赖项。我们将使用以下库和工具来构建博客平台：\n\n*   `Ottoman.js`: 一个用于\
  \ Couchbase 的 Node.js ORM 库（更准确地说，是一个 ODM 库，因为我们使用的是 JSON 文档数据而非关系关系模型），它允许我们使用对象与\
  \ Couchbase 数据库交互。\n*   `OpenAI Node.js SDK`: 用于 `OpenAI` API 的官方 Node.js SDK，允许我们为博客平台中的内容和用户查询生成向量嵌入。\n\
  *   `dotenv`: 一个零依赖模块，可从 `.env` 文件将环境变量加载到 `process.env` 中，以保持我们的敏感信息安全。\n\n要安装这三个依赖项，你可以在项目的根目录下运行以下命令：\n\
  \n```\nnpm install ottoman openai dotenv\n```\n\n你可以通过检查 `package.json` 文件或运行以下命令来验证\
  \ `npm` 是否正确安装了依赖：\n\n```bash\nnpm list\n```\n\n运行 `npm list` 后，你将看到类似下面的输出：\n\n\
  ```\nvector-blog-platform@1.0.0 /path/to/your/project\n  ├── dotenv@16.4.5\n  ├──\
  \ openai@4.58.2\n  └── ottoman@2.5.0\n```\n\n此输出显示依赖项已成功安装，现在可以在项目中使用。安装好依赖项后，你现在准备好开始构建博客平台的功能了！\n\
  \n## 核心要点\n\n在本章中，你通过搭建开发环境并准备支持向量嵌入工作流所需的工具和结构，为构建向量搜索应用程序奠定了基础。\n\n以下是你目前为止所成就的快速总结，以及在我们开始在应用程序中实现向量搜索时需要继续进行的内容：\n\
  \n*   你通过安装 Node.js、搭建项目结构骨架以及选择合适的向量数据库，搭建了开发环境。\n*   你学习到向量嵌入是非结构化的、高维数据，需要专门的索引来以实现快速且准确的搜索。\n\
  *   你探索了可以存储向量数据的数据库类型，包括文档数据库、图数据库和关系数据库，并理解了为什么文档数据库非常适合。\n*   你安装并配置了核心依赖项，包括一个\
  \ ORM (`Ottoman`)、用于生成嵌入的 `OpenAI` SDK 以及用于环境变量管理的 `dotenv`。\n\n在下一章中，我们将开始在 Node.js\
  \ 应用程序中实现搜索功能。我们将涵盖如何查询向量数据库以获取相似的嵌入并向用户返回相关结果。\n\n## 注释\n\n[[8]](#f_0034.xhtml_FNPTR-8)\n\
