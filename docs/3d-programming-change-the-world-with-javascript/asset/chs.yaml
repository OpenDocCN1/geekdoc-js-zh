  \ a Copy）。（见图 3，选择“制作副本”，第 36 页）。我们将这个项目命名为“我的虚拟形象：键盘控制”，如图 4，“命名项目”，第 36 页所示。\n\
  \n至此，我们已准备好添加键盘控制。\n\n![](img/Image00176.jpg) 图 3——选择“制作副本”\n![](img/Image00177.jpg)\
  \ ![](img/Image00178.jpg) ![](img/Image00179.jpg) 图 4——命名项目\n![](img/Image00180.jpg)\n\
  \n### 4.2 使用键盘事件构建交互系统\n\n到目前为止，本书中的代码都是非常线性的——它沿着一条直线执行。我们先制作了一个封面、一个形状和一个网格，然后将对象添加到场景中。接着我们处理下一个网格，同样将其添加到场景中。虽然可以编写大量类似这样的\
  \ JavaScript 代码，但大多数 JavaScript 程序往往截然不同。\n\n这是因为 JavaScript 通常在 Web 浏览器中运行。在 Web\
  \ 浏览器中，JavaScript 代码必须响应事件。键盘按键被按下、鼠标按钮被点击、鼠标指针在页面上移动，这些都是 Web 浏览器中的事件。每个网页上可能发生大量事件，而大多数情况下，这些事件都被忽略了。\n\
  \n但我们不会忽略按键事件。我们将使用一种称为事件监听器（event listener）的东西来监听事件。让我们在代码的最底部，即我们在第 3 章“项目：制作虚拟形象”（第\
  \ 25 页）中添加的 `animate()` 行下方，添加以下代码。\n\n### 将键盘事件转换为虚拟形象移动\n\n```javascript\n// 监听按键事件\n\
  document.addEventListener('keydown', function (event) { \n    alert(event.keyCode);\n\
  });\n```\n\n这为整个页面添加了一个事件监听器。它监听 `keydown` 事件。当我们的代码检测到 `keydown` 时，它会弹出一个包含刚刚发生事件的\
  \ `keyCode` 的警告框。\n\n什么是 `keyCode`？为了回答这个问题，我们来试试看！点击页面顶部工具栏中的“隐藏代码”按钮，然后按下键盘上的\
  \ A 键。你应该会看到类似这样的警告对话框。\n\n![](img/Image00181.jpg)\n\n这个 65 是什么？请记住，计算机存储所有内容，甚至字母，都是以数字形式存储的。计算机在向人类显示正确的字母时，会将该数字转换为字母。当我们想到字母\
  \ a 时，计算机想到的是 65。\n\n为什么我们需要知道这个？如果你还没有点击警告框上的“确定”按钮，请先点击。然后对键盘上的左、上、右、下箭头键重复此操作。对于左箭头，你会发现计算机认为是\
  \ 37。对于上箭头，计算机认为是 38。对于右箭头，计算机检测到的键码是 39。对于下箭头，计算机认为是 40。\n\n让我们利用这些 `keyCode` 来移动我们的虚拟形象！\n\
  \n## 4.3 将键盘事件转换为虚拟形象移动\n\n通过使用键盘事件监听器，我们现在知道了四个箭头键对应的数字。我们将这些箭头键和数字转换为虚拟形象的移动，如下所示：\n\
  \n| 箭头键 | 计算机数字 | 虚拟形象方向 |\n| :--- | :--- | :--- |\n| 左 | 37 | 向左 |\n| 上 | 38 |\
  \ 向前 |\n| 右 | 39 | 向右 |\n| 下 | 40 | 向后 |\n\n那么，让我们来实现这一点。删除 `document.addEventListener()`\
  \ 内部的 `alert(event.keyCode)` 行。用以下代码替换它，从 `var code` 语句开始。\n\n```javascript\ndocument.addEventListener('keydown',\
  \ function (event) {\n    var code = event.keyCode; \n    if (code == 37) avatar.position.x\
  \ = avatar.position.x - 5; // 左\n    if (code == 38) avatar.position.z = avatar.position.z\
  \ - 5; // 上\n    if (code == 39) avatar.position.x = avatar.position.x + 5; // 右\n\
  \    if (code == 40) avatar.position.z = avatar.position.z + 5; // 下\n});\n```\n\
  \n我们在“项目：制作虚拟形象”中见过 `if` 语句。在这里，我们检查 `keyCode` 是否等于某个箭头键的计算机数字。如果键码是 37（左箭头键），那么我们将\
  \ `avatar` 的 `X` 位置减去 5。\n\n在 JavaScript 中，双等号（`==`）用于检查某物是否等于另一物——单等号（`=`）用于将值赋给另一物。在我们上面的代码示例中，我们将\
  \ `code` 设置为等于 `event.keyCode`。然后我们检查它是否等于不同的箭头键值。\n\n![](img/Image00182.jpg)\n\n\
  **试一试！**\n点击“隐藏代码”按钮，然后试一试。使用箭头键移动虚拟形象。它是否按你预期的方式工作？记住：如果出现问题，请检查 JavaScript 控制台！\n\
  \n如果一切正常，那么你应该能够将虚拟形象移动到远处、近处、最左边或最右边，甚至移出屏幕。\n\n![](img/Image00183.jpg)\n\n在第 3.6\
  \ 节“做侧手翻”（第 32 页）中，我们添加了做侧手翻的能力，你学会了如何确保虚拟形象的手和脚随身体一起移动。由于手和脚是添加到 `avatar` 对象而不是\
  \ `scene` 中的，因此移动 `avatar` 意味着手和脚也会随之移动。\n\n**挑战：开始/停止动画**\n让我们看看如果其中一条腿没有连接到虚拟形象上会发生什么。在这里，我们将修改\
  \ `left_foot`，使其添加到 `scene` 而不是 `avatar` 中。\n\n```javascript\nvar left_foot = new\
  \ THREE.Mesh(foot, cover); \nleft_foot.position.set(75, -125, 0); \nscene.add(left_foot);\n\
  ```\n\n运行这段代码，左脚就会消失。\n\n![](img/Image00184.jpg)\n\n不要低估这个概念的力量。我们稍后会用它做一些疯狂的事情。现在，别忘了将你的左脚固定到\
  \ `avatar` 上！\n\n## 4.4 挑战：开始/停止动画\n\n还记得我们在第 3 章“项目：制作虚拟形象”（第 25 页）中构建虚拟形象时使用的\
  \ `is_cartwheeling` 和 `is_flipping` 值吗？让我们在键盘事件监听器中再添加两个 `if` 语句。如果按下 C 键（计算机认为是数字\
  \ 67），则虚拟形象应开始或停止做侧手翻。如果按下 F 键（计算机认为是数字 70），则翻转例程应开始或停止。\n\n**提示**：使用非运算符在 `true`\
  \ 和 `false` 之间切换。在 JavaScript 中，非运算符是感叹号 `!`。你可以使用这个非运算符将 `is_cartwheeling` 的值赋为其相反值，例如\
  \ `is_cartwheeling = !is_cartwheeling`。我们将在“布尔值”部分再次看到这一点。\n\n希望你能自己实现它。以下是处理侧手翻和翻转的\
  \ `animate()` 函数。\n\n```javascript\nvar is_cartwheeling = false; \nvar is_flipping\
  \ = false; \n\nfunction animate() {\n    requestAnimationFrame(animate); \n    if(is_cartwheeling)\
  \ {\n        avatar.rotation.z = avatar.rotation.z + 0.05; \n    }\n    if (is_flipping)\
  \ {\n        avatar.rotation.x = avatar.rotation.x + 0.05;\n    }\n    renderer.render(scene,\
  \ camera);\n} \nanimate();\n```\n\n以下是用于移动、翻转和侧手翻虚拟形象的完整键盘事件监听器。\n\n```javascript\n\
  document.addEventListener('keydown', function (event) {\n```\n\n\n\n\n`var code\
  \ = event.keyCode; if (code == 37) avatar.position.x = avatar.position.x-5; // 左移\
  \ if (code == 38) avatar.position.z = avatar.position.z-5; // 上移 if (code == 39)\
  \ avatar.position.x = avatar.position.x+5; // 右移 if (code == 40) avatar.position.z\
  \ = avatar.position.z+5; // 下移 if (code == 67) is_cartwheeling = !is_cartwheeling;\
  \ // C if (code == 70) is_flipping = !is_flipping; // F`\n\n`}) ;`\n\n如果你做对了，你应该能让角色在移出屏幕时做出后空翻和侧手翻。\n\
  \n![](img/Image00185.jpg) 实际上，角色能离开屏幕这件事相当疯狂。我们稍后会修复这个问题，但首先，让我们添加一些树木，让角色可以穿行其中。\n\
  \n## 4.5 用函数建造森林\n\n我们的森林需要很多树木。我们可以一棵一棵地建造，但我们不会这么做。相反，让我们在所有角色身体部件之后添加以下 JavaScript\
  \ 代码：\n\n`makeTreeAt( 500, 0) ;`\n\n`makeTreeAt(-500, 0) ;`\n\n`makeTreeAt( 750,\
  \ -1000) ;`\n\n`makeTreeAt(-750, -1000) ;`\n\n### 用函数建造森林\n\n```\nfunction makeTreeAt(x,\
  \ z) {\n  var trunk = new THREE.Mesh(\n    new THREE.CylinderGeometry(50, 50, 200),\n\
  \    new THREE.MeshBasicMaterial({color: 0xA0522D})\n  );\n  var top = new THREE.Mesh(\n\
  \    new THREE.SphereGeometry(150),\n    new THREE.MeshBasicMaterial({color: 0x228B22})\n\
  \  );\n  top.position.y = 175;\n  trunk.add(top);\n  trunk.position.set(x, -75,\
  \ z);\n  scene.add(trunk);\n}\n```\n\n如果你正确输入了所有代码，你会看到角色站在一片由四棵树组成的森林前。\n\n![](img/Image00186.jpg)\
  \ 这很酷，但我们是怎样做到的呢？\n\n### 分解步骤\n\n建造森林的第一部分很容易理解。我们在场景中不同的 X 和 Z 坐标（记住 Y 是上下方向）处添加树木。\n\
  \n`makeTreeAt( 500, 0) ;`\n\n`makeTreeAt(-500, 0) ;`\n\n`makeTreeAt( 750, -1000)\
  \ ;`\n\n`makeTreeAt(-750, -1000) ;`\n\n这很简单，但那个 `makeTreeAt()` 是如何工作的呢？\n\n正如我们将在第\
  \ 5 章“函数：反复使用”（第 49 页）中看到的，JavaScript 函数是一种重复运行相同代码的方式。在这里，我们在名为 `makeTreeAt()`\
  \ 的函数中完成了建造树干和树冠的所有重复性工作。我们可以给它起任何名字，但我们给它起了一个能说明其功能的名字——在这种情况下，它会在我们指定的坐标处建造一棵树。\n\
  \n我们应该对这个函数内部的大部分内容都很熟悉。\n\n```\nfunction makeTreeAt(x, z) {\n❶ var trunk = new\
  \ THREE.Mesh(\n    new THREE.CylinderGeometry(50, 50, 200),\n    new THREE.MeshBasicMaterial({color:\
  \ 0xA0522D})\n  );\n❷ var top = new THREE.Mesh(\n    new THREE.SphereGeometry(150),\n\
  \    new THREE.MeshBasicMaterial({color: 0x228B22})\n  );\n❸ top.position.y = 175;\n\
  ❹ trunk.add(top);\n❺ trunk.position.set(x, -75, z);\n❻ scene.add(trunk);\n}\n```\n\
  \n❶ 用圆柱体制作树干。  \n❷ 用球体制作树冠。  \n❸ 将树冠向上移动（记住 Y 是上下方向）到树干顶部。  \n❹ 将树冠添加到树干上。  \n❺\
  \ 将树干的位置设置为调用函数时传入的 x 和 z 值——例如 `makeTreeAt(500,0)`。Y 值为 -75 将树干向下移动，使其看起来像树干。 \
  \ \n❻ 将树干添加到场景中。\n\n重要的是要记住，我们必须将树冠添加到树干上，而不是添加到场景中。如果我们将树冠添加到场景中，那么当我们尝试移动树木时，只有树干会被移动，而树冠不会。如果我们将树冠添加到场景中，我们还需要设置树冠的位置——将其添加到树干上意味着树冠的位置与树干相同。\n\
  \n到目前为止，我们已经很擅长用形状和材质构建对象并将它们放置在屏幕上了。你可能不用费太大力气就能做出四棵树。对于一棵树，你需要一个 `THREE.CylinderGeometry`\
  \ 作为树干，一个 `THREE.SphereGeometry` 作为树冠。如果你将绿色的树叶添加到树冠上，那么你就可以一起移动这两个部分了。\n\n### 让摄像机跟随角色移动\n\
  \n然后你需要再重复三次同样的操作，才能总共做出四棵树。四棵树需要输入很多代码。别忘了：我们程序员不喜欢打字。永远记住我们很懒。而这次让我们偷懒的东西就是函数。\n\
  \n这里还有一个新东西：颜色。我们从维基百科的颜色名称列表（http://en.wikipedia.org/wiki/X11_color_names）中选取了这些颜色。树干的颜色是赭色。如果你喜欢，可以尝试自己的颜色。颜色来自该网页的第一列，但我们需要将网页上的\
  \ `#` 符号替换为 `0x`，以便 JavaScript 能够识别。因此，`#A0522D` 变成了 `0xA0522D`。\n\n现在我们已经有了森林，让我们看看能否让摄像机在角色穿越场景时跟随角色移动。\n\
  \n## 4.6 让摄像机跟随角色移动\n\n回想一下，为了让手和脚随着角色一起移动，我们将它们添加到了角色的身体上，而不是添加到场景中。这正是我们需要对摄像机做的事情。首先，找到写着\
  \ `scene.add(camera)` 的那一行，并将其删除。然后，在角色被添加到场景的那一行下方，在 `makeTreeAt()` 函数上方，将摄像机添加到角色上：\n\
  \n```\nvar left_foot = new THREE.Mesh(foot, cover);\nleft_foot.position.set(75,\
  \ -125, 0);\navatar.add(left_foot);\n\n❶ avatar.add(camera);  // ❶ 添加这一行。\n```\n\
  \n隐藏代码后，你会看到当角色移动时，摄像机始终保持在角色正前方。\n\n![](img/Image00187.jpg)\n\n它始终位于角色前方 500 个单位处（`camera.position.z\
  \ = 500`）。由于我们从未用 `position.y` 定义摄像机的高度，所以摄像机始终与角色保持相同高度。由于我们尚未用 `position.x` 设置左右位置，所以摄像机始终位于正前方。\n\
  \n你可以把摄像机想象成用一根无形的链条拴在角色上。\n\n![](img/Image00188.jpg) ![](img/Image00189.jpg) 无论角色走到哪里，摄像机都会跟着走。\n\
  \n![](img/Image00190.jpg) ![](img/Image00191.jpg)\n\n很酷，对吧？嗯，这种方法有一个大问题。如果角色开始做侧手翻或后空翻（记住我们用的是\
  \ C 和 F 键），会发生什么？自己试试看！\n\n角色似乎保持不动，但其他所有东西都开始旋转！（见图 5，“所有东西都开始旋转！”，第 45 页。）\n\n\
  这是因为摄像机被拴在角色身上的无形链条上。如果角色旋转，摄像机也会跟着旋转。（见图 6，“摄像机随角色旋转”，第 45 页。）\n\n这可不是我们想要的。我们真正想要的是将摄像机锁定在角色的位置上，而不是锁定在角色本身上。\n\
  \n在 3D 编程中，没有简单的方法可以可靠地将某物只锁定到另一个物体的位置上。但并非无计可施。\n\n### 让摄像机跟随角色移动\n\n![](img/Image00192.jpg)\
  \ 图 5——所有东西都开始旋转！\n\n![](img/Image00193.jpg) ![](img/Image00194.jpg) 图 6——摄像机随角色旋转\n\
  \n![](img/Image00195.jpg) 我们将在游戏中添加一个角色位置标记。\n\n![](img/Image00196.jpg) 如果我们将摄像机和角色都锁定到这个标记上，那么移动标记就会同时移动角色和摄像机。\n\
  \n![](img/Image00197.jpg) 但更重要的是，当角色做侧手翻时，摄像机不会移动。角色在做侧手翻，但标记不会旋转。由于标记不旋转，摄像机也不会旋转。\n\
  \n![](img/Image00198.jpg)\n\n在 3D 编程中，这个标记只是一个标记。它应该是不可见的。所以我们不想为此使用网格或几何体。相反，我们使用\
  \ `Object3D`。让我们在角色生成代码之前，紧接在 `START CODING ON THE NEXT LINE` 之后添加以下代码。\n\n```\n\
  var marker = new THREE.Object3D();\nscene.add(marker);\n```\n\n现在，我们修改角色，将其添加到标记上，而不是添加到场景中：\n\
  \n```\nvar avatar = new THREE.Mesh(body, cover);\nmarker.add(avatar);\n```\n\n我们还需要修改摄像机的添加方式。不再将摄像机添加到角色上，而是将其添加到标记上。\n\
  \n\n\n\n`marker.add(camera);` 最后需要修改的是键盘事件监听器。我们不再改变角色的位置，而是改变标记的位置。\n\n```\ndocument.addEventListener(\
  \ 'keydown' , function (event) {\n\nvar code = event.keyCode; if (code == 37) marker.position.x\
  \ = marker.position.x-5; // left if (code == 38) marker.position.z = marker.position.z-5;\
  \ // up if (code == 39) marker.position.x = marker.position.x+5; // right if (code\
  \ == 40) marker.position.z = marker.position.z+5; // downif (code == 67) is_cartwheeling\
  \ = !is_cartwheeling; // C if (code == 70) is_flipping = !is_flipping; // F\n\n\
  }) ;\n```\n\n这样一来，我们可以用键盘移动角色的位置，但当我们翻转或侧翻时，摄像机保持直立。\n\n![](img/Image00199.jpg)\n\
  ### 4.7 到目前为止的代码\n如果你想核对一下目前的代码，请与第 220 页的 A1.4 节《代码：移动角色》中的代码进行比较。\n### 4.8 接下来是什么\n\
  本章我们学习了一项非常重要的技能。随着游戏技能的提升，我们会反复将对象像这样分组。分组可以简化一起移动、扭转、旋转、放大和缩小物体的操作。\n\nPrepared\n\
  在给角色添加更多内容之前，我们先休息一下，以便更深入地探索 JavaScript 函数。我们已经用它们来创建森林、制作动画和监听事件。我们还能用它们做更多酷炫的事情。\n\
  \n完成本章后，你将：\n\n• 理解程序员的一个超强工具（函数）\n• 知道使用函数的两个理由\n• 识别一些常见的 JavaScript 错误并知道如何修复它们\n\
  \n## 第 5 章 函数：反复使用\n我们已经多次遇到函数。最近一次是在第 4 章《项目：移动角色》（第 35 页）中，我们用它们来创建森林。如果你仔细观察，可能会发现我们在同一章中也用函数构建了键盘事件监听器。\n\
  \n虽然我们已经使用过函数，但还没有深入讨论它们。你可能已经感觉到它们非常强大，那么现在让我们仔细看看。\n\n我们不会讨论函数的方方面面——它们可能会变得相当复杂。我们只讨论到足以理解本书中使用的函数的程度。\n\
  \n### 5.1 开始\n在 ICE 代码编辑器中创建一个新项目。使用空项目模板，并将其命名为“Functions”。\n\n在开头的`<script>`标签之后，删除写着“Your\
  \ code goes here”的那一行，然后输入以下 JavaScript 代码。\n\n```\nvar log = document.createElement('div'\
  \ ) ; log.style.height\n= '75px' ; log.style.width = '450px' ; log.style.overflow\
  \ =\n'auto' ; log.style.border = '1px solid #666' ;\n\nlog.style.backgroundColor\
  \ = '#ccc' ; log.style.padding =\n'8px' ; log.style.position = 'absolute' ; log.style.bottom\
  \ =\n'10px' ; log.style.right = '20px' ;\n\ndocument.body.appendChild(log);\n\n\
  var message = document.createElement('div' ) ; message.textContent = 'Hello, JavaScript\
  \ functions!' ; log.appendChild(message);message = document.createElement('div'\
  \ ) ; message.textContent = 'My name is Chris.' ; log.appendChild(message);\n\n\
  message = document.createElement('div' ) ; message.textContent = 'I like popcorn.'\
  \ ; log.appendChild(message);\n```\n\nPrepared\n第一段代码在浏览器中创建了一个记录消息的地方。最后三个代码块向该日志写入了三条不同的消息。如果一切输入正确，你应该会在页面右下角看到这三条消息。\n\
  \n![](img/Image00200.jpg) ![](img/Image00201.jpg) 回到\n![](img/Image00202.jpg) 第\
  \ 3 章，\n![](img/Image00203.jpg) 项目：创建角色\n![](img/Image00204.jpg) ，第 25 页\n![](img/Image00205.jpg)，我们使用了一个函数\n\
  ![](img/Image00206.jpg) 来避免重复四次创建树的相同过程。所以\n![](img/Image00207.jpg) 你大概能猜到我们首先要改什么。让我们改变记录这三条消息的方式。\n\
  \n首先，删除从第一行`var message`到最后一个`log.appendChild`行的所有内容。在原来代码的位置，添加以下内容。\n\n```\nlogMessage('Hello,\
  \ JavaScript functions!' , log); logMessage('My name is\nChris.' , log); logMessage('I\
  \ like popcorn.' , log);function logMessage(message, log) {\n\nvar holder = document.createElement('div'\
  \ ) ; holder.textContent = message; log.appendChild(holder);}\n```\n\n当我们编写这段代码时，发生了一件令人惊讶的事情——它变得更容易阅读了。即使是非程序员也能读懂前三行，并知道它们向日志发送了一条消息。这对我们这样的程序员来说是一个巨大的胜利。\n\
  \n如果我们后来决定要在每条消息前添加时间，现在找出在哪里修改就更容易了。\n\n## 开始\n![](img/Image00208.jpg) 可读的代码以后更容易修改\n\
  \n区分优秀程序员和普通程序员的技能之一就是修改现有代码的能力。优秀的程序员知道，当代码易于阅读时，修改起来更容易。\n\n显然我们需要修改函数内部的内容。以前，我们需要花一些时间才能弄清楚那三个代码块是在写日志消息，以及如何修改它们。\n\
  \n这也引出了一个非常重要的规则。\n\n![](img/Image00209.jpg) 保持代码 DRY——不要重复自己\n\n这本书与一本著名的书《程序员修炼之道》出自同一家出版社。如果你继续编程，总有一天会读到那本书。书中有一个绝妙的建议：程序员应该保持代码\
  \ DRY——遵循“不要重复自己”（简称 DRY）的规则。\n\n当我们最初编写代码时，我们重复了三件事：\n1. 为消息创建一个容器\n2. 向容器添加文本消息\n\
  3. 将消息容器添加到日志中\n\n很容易看出我们在重复自己，因为三个代码块中的代码除了消息内容外完全相同。这又是我们偷懒的机会。如果我们添加超过三条消息，只需多输入一行，而不是三行。\n\
  \n当然，如果我们需要修改日志消息的某些内容，只需修改一个函数，而不是三个不同的代码块。\n\n我们在这里还没有完全结束函数的使用。如果你查看所有代码，会发现需要很长时间才能到达重要的部分。（见图\
  \ 7，函数之前的大量垃圾代码，第 52 页。）\n\n重要的工作——写入消息——直到第 15 行才开始。在向日志写入消息之前，我们需要一个日志，但其他所有内容都只是干扰。\n\
  \n为了解决这个问题，让我们将干扰代码移到一个函数中，放在`logMessage()`行下方。在调用`logMessage()`的三行和定义`logMessage()`函数之间，添加一个名为`makeLog()`的新函数。创建日志容器的“干扰”代码\n\
  \nPrepared\n![](img/Image00210.jpg) 图 7——函数之前的大量垃圾代码\n\n![](img/Image00211.jpg)\
  \ 从`var log = document.createElement('div');`这一行开始，到`document.body.appendChild(holder)`这一行结束。将这些行及其之间的所有内容移到`makeLog()`中：\n\
  \n```\nfunction makeLog() {\n\nvar holder = document.createElement('div' ) ; holder.style.height\
  \ =\n'75px' ; holder.style.width = '450px' ; holder.style.overflow = 'auto' ;\n\
  holder.style.border = '1px solid #666' ;\n\nholder.style.backgroundColor = '#ccc'\
  \ ; holder.style.padding = '8px' ;\nholder.style.position = 'absolute' ; holder.style.bottom\
  \ = '10px' ;\nholder.style.right = '20px' ; document.body.appendChild(holder);return\
  \ holder;\n\n}\n```\n\n注意我们将`log`改成了`holder`。另外，不要忘记最后一行，它返回`holder`以便我们可以用它做其他事情。\n\
  \n我们可以用这个函数创建日志。在开头的`<script>`标签之后，前四行变成以下内容：\n\n```\nvar log = makeLog(); logMessage('Hello,\
  \ JavaScript functions!' , log);\n```\n\n\n\n\n\n`logMessage('My name is Chris.'\
  \ , log);` `logMessage('I like popcorn.' , log);`\n\n## 理解简单函数\n\n这段代码非常易读！写出这样的代码比想象中要难。真正优秀的程序员知道，在没有充分理由之前不要使用函数。换句话说，伟大的程序员正是像我们这样做的：先写出能运行的代码，再寻找改进的方法。\n\
  \n## 始终从丑陋的代码开始\n\n![](img/Image00212.jpg)\n\n你是一个非常聪明的人。能走到这一步，你必然很聪明。所以你可能会想：“哦，我一开始就能写出可读性好的代码。”\n\
  \n![](img/Image00213.jpg)\n\n请相信我，你做不到。程序员对此深有体会，甚至给这种尝试起了个专门的名称：过早泛化。用花哨的说法就是，在写出丑陋的代码之前就猜测函数将如何使用，这是一个错误。程序员对我们常犯的错误都有花哨的名称。\n\
  \n## 5.2 理解简单函数\n\n到目前为止，我们已经了解了为什么要使用函数。现在来看看函数是如何工作的。\n\n从代码中删除三行 `logMessage()`。在\
  \ `var log = makeLog` 这一行之后，写入以下内容。\n\n```\nlogMessage(hello('President Obama' ),\
  \ log);\nlogMessage(hello('Mom' ), log);\nlogMessage(hello('Your Name' ), log);\n\
  function hello(name) {\n  return 'Hello, ' + name + '! You look very pretty today\
  \ :)' ;\n}\n```\n\n这个 `hello()` 函数的结果是首先返回短语“Hello, President Obama! You look very\
  \ pretty today :)”。记录这些短语的效果应该如下所示：\n\n![](img/Image00214.jpg)\n\n`hello` 函数内部有很多内容需要处理，让我们把它分解成更小的部分。\n\
  \n```\n❶ function hello(name) {\n❷   return 'Hello, ' + name + '! You look very\
  \ pretty today :)' ;\n}\n```\n\n准备就绪\n\n函数的组成部分如下：\n\n❶ 关键字 `function`，告诉 JavaScript\
  \ 我们正在创建一个函数。\n\n函数的名称——这里是 `hello`。\n\n函数参数。在这个例子中，我们接受一个参数（`name`），它将在函数体内部使用。当我们用参数调用函数时——例如\
  \ `hello(Fred)` ——我们告诉函数，任何时候使用 `name` 参数，都等同于使用 `Fred`。\n\n函数体以左花括号 `{` 开始，以右花括号\
  \ `}` 结束。你在写英文时可能从未使用过花括号，但在写 JavaScript 时会经常用到。\n\n❷ 关键字 `return` 告诉 JavaScript\
  \ 我们想要函数返回的结果。它可以是任何东西：数字、字母、单词、日期，甚至更有趣的东西。\n\n![](img/Image00215.jpg)\n\nJavaScript\
  \ 中的每一行，即使是函数内部的，都应该以分号结尾。\n\n### 字母、单词和句子都是字符串\n\n引号内的内容，比如 `'Hello'`，被称为字符串。即使在其它编程语言中，字母、单词和句子通常也被称为字符串。\n\
  \n务必确保关闭引号。如果忘记，你会遇到非常奇怪且难以修复的错误。\n\n接下来，让我们故意破坏它，以便了解出错时该如何处理。\n\n## 5.3 当事情出错时\n\
  \n让我们戴上黑客的帽子，尝试破坏一些函数。\n\n虽然用 JavaScript 函数做错事很容易，但找出错在哪里却并不容易。程序员最常犯的错误会产生奇怪的错误信息。让我们来看看，以便你做好更充分的准备。\n\
  \n### 当事情出错时\n\n#### 黑客，而非破解\n\n![](img/Image00216.jpg)\n\n别担心！我们不会真的破坏任何东西。破坏东西是破解，而不是黑客。黑客是好事。你经常会听到非程序员错误地使用“黑客”这个词。既然你现在是程序员了，你需要知道这个词的含义以及如何正确使用它。黑客意味着我们在玩弄代码、应用程序或\n\
  \n![](img/Image00217.jpg)\n\n网站。我们玩弄它们是为了学习，而不是造成破坏。有时我们会尝试破坏自己的代码——但只是为了更好地理解它。\n\
  \n永远做黑客，绝不做破解者。\n\n### 意外错误\n\n最常见的情况是忘记花括号：\n\n```\n// 缺少花括号 - 这不会工作！\nfunction\
  \ hello(name)\n  return 'Hello, ' + name + '! You look very pretty today :)' ;\n\
  }\n```\n\n这是 JavaScript 中的编译时错误——JavaScript 在尝试读取、编译和运行时能够检测到的错误之一——我们在\n\n![](img/Image00218.jpg)\
  \ 第 2.5 节\n\n![](img/Image00219.jpg) ![](img/Image00220.jpg) 控制台调试\n\n![](img/Image00221.jpg)\
  \ 第 20 页中遇到过。由于这是一个编译时\n\n![](img/Image00222.jpg) 错误，ICE 代码编辑器会告诉我们问题所在。\n\n![](img/Image00223.jpg)\
  \ ![](img/Image00224.jpg) 如果我们把花括号放回去，但移除 `return` 语句后面的花括号，会发生什么？\n\n```\n// 缺少花括号\
  \ - 这不会工作！\nfunction hello(name) {\n  return 'Hello, ' + name + '! You look very\
  \ pretty today :)' ;\n```\n\n我们的 `hello` 函数中没有错误，但代码最底部有一个错误。\n\n![](img/Image00226.jpg)\
  \ ![](img/Image00227.jpg)\n\n这可能是一个难以修复的错误。程序员常常在意识到自己犯了错误之前，已经写了很多行代码，甚至可能写了几个函数。然后需要花时间找出你原本打算在哪里添加花括号。\n\
  \n#### 挑战\n\n准备就绪\n\n尝试自己找出以下有问题的代码。错误出现在哪里？提示：如第 2.5 节“控制台调试”第 20 页所述，其中一些可能是运行时错误。\n\
  \n- 忘记给参数加括号：\n```\nfunction hello name {\n  return 'Hello, ' + name + '! You look\
  \ very pretty today :)' ;\n}\n```\n- 忘记函数的参数：\n```\nfunction hello() {\n  return\
  \ 'Hello, ' + name + '! You look very pretty today :)' ;\n}\n```\n- 函数内部使用了错误的变量名：\n\
  ```\nfunction hello(name) {\n  return 'Hello, ' + person + '! You look very pretty\
  \ today :)' ;\n}\n```\n- 调用函数时使用了错误的名称：\n```\nlogMessage(helo('President Obama'\
  \ ), log);\nfunction hello(name) {\n  return 'Hello, ' + name + '! You look very\
  \ pretty today :)' ;\n}\n```\n\n哇！破坏函数的方式可真多。请相信我，当你逐渐成为一名优秀的程序员时，你会以这些方式以及其他许多方式破坏函数。\n\
  \n### 伟大的程序员总是搞砸事情\n\n![](img/Image00228.jpg)\n\n正因为他们经常搞砸，所以他们非常擅长修复问题。这是让伟大程序员变得伟大的另一项技能。\n\
  \n如果你搞砸了代码，千万不要自责。搞砸的代码是学习的机会。别忘了像你在“玩转控制台与查找错误”中学到的那样，使用 JavaScript 控制台来帮助排查问题！\n\
  \n## 5.4 函数的奇特技巧\n\n函数在 JavaScript 中非常特殊，你可以对它们做各种疯狂的事情。关于“函数式”JavaScript 的整本书都写出来了，但让我们先看一个我们以后会用到的小技巧。\n\
  \n### 递归\n\n像这样修改 `hello`：\n\n```\nfunction hello(name) {\n  var ret = 'Hello, '\
  \ + name + '! ' + 'You look very pretty today :)' ;\n  if (!name.match(/again/))\
  \ { ❶\n    ret = ret + ' /// ' + hello(name + ' (again)' ) ;\n  }\n  return ret;\n\
  }\n```\n\n❶ 仔细看这里。在函数 `hello` 的函数体内部，我们正在调用函数 `hello`！\n\n这将记录两次问候消息。\n\n\n\n\n\n\
  ![](img/Image00229.jpg) 像这样调用自身的函数其实并不疯狂。它非常常见，以至于有一个专门的名称：递归函数。使用递归函数时要小心！如果没有东西阻止递归函数反复调用自身，你的浏览器就会卡死，你只能进入纯编辑模式来修复它，如第\
  \ 23 页的 2.6 节“当 ICE 崩溃时如何恢复”所述。在这个例子中，我们通过仅在`name`变量不等于`\"again\"`时再次调用`hello`函数来停止递归。如果`name`不等于`\"\
  again\"`，我们就用`name + \"(again)\"`调用`hello()`，这样下一次调用就会包含`\"again\"`。\n\n递归可能是一个难以理解的概念，但你的代码编辑器的名字就是一个很好的例子：\n\
  \n- ICE Code Editor 中的 I 代表什么？\n- 它代表 ICE Code Editor。\n\n- ICE Code Editor 中的 I\
  \ 代表什么？\n- 它代表 ICE Code Editor。\n\n- ICE Code Editor 中的 I 代表什么？\n- …\n\n你可以永远问下去，但最终你会厌倦的。计算机不会厌倦提问，所以你必须告诉它们何时停止。\n\
  \n## 5.5 到目前为止的代码\n\n如果你想核对本章的代码，请参考第 222 页的 A1.5 节“代码：函数：反复使用”。\n\n## 5.6 接下来是什么\n\
  \n函数对于 JavaScript 程序员来说是非常强大的工具。正如我们所看到的，使用函数的两个主要原因是代码复用和让代码更易读。我们创建了一个`logMessage()`函数，以便反复使用它的功能。我们创建了`makeLog()`函数，将一大段杂乱的代码从更重要的代码中移开。我们甚至还瞥见了函数的一些疯狂用法，比如递归。\n\
  \n而我们才刚刚触及皮毛！\n\n很快你就会看到，在接下来的章节中我们会大量使用函数。让我们从下一章开始，教我们的虚拟角色如何移动手脚！\n\n当你完成本章后，你将：\n\
  \n- 理解一些 3D 游戏的重要数学知识\n- 知道如何让物体来回摆动\n- 拥有一个看起来在行走的虚拟角色\n\n## 第 6 章 项目：移动手脚\n\n\
  当我们上次在第 4 章“项目：移动虚拟角色”（第 35 页）中看到我们的虚拟角色时，它已经能很好地移动了，但有点僵硬。即使身体移动了，手脚却仍然静止。在本章中，我们将让虚拟角色更加生动。\n\
  \n### 6.1 开始\n\n在本章中，我们再次基于前几章的工作进行构建。既然我们在“项目：移动虚拟角色”中做了大量工作让虚拟角色动起来，那么让我们复制那个项目，以便在本章中使用。\n\
  \n如果它还没有在 ICE Code Editor 中打开，请打开我们命名为“我的虚拟角色：键盘控制”的项目。点击菜单按钮，从菜单中选择“制作副本”来复制它。\n\
  \n将项目命名为“我的虚拟角色：移动手脚”，然后点击“保存”按钮。这样，我们就准备好为虚拟角色注入活力了！\n\n### 6.2 移动一只手\n\n让我们从一只手开始。回顾前几章，手和脚只是从身体伸出的球体。我们用以下\
  \ JavaScript 代码构建了右手：\n\n```javascript\nvar right_hand = new THREE.Mesh(hand, cover);\n\
  right_hand.position.set(-150, 0, 0);\navatar.add(right_hand);\n```\n\n如你所知，我们用来设置手位置的三个数字分别是\
  \ X 位置（左/右）、Y 位置（上/下）和 Z 位置（前/后）。对于右手，我们将其放置在距离虚拟角色中心 -150 的位置。\n\n除了同时设置位置的三个数字外，我们还可以通过更新\
  \ `position.x`、`position.y` 或 `position.z` 来只改变其中一个位置。要向前（朝向观察者）移动右手，请添加下面所示的 `position.z`\
  \ 行。\n\n```javascript\nvar right_hand = new THREE.Mesh(hand, cover);\nright_hand.position.set(-150,\
  \ 0, 0);\navatar.add(right_hand);\nright_hand.position.z = 100;\n```\n\n将 `position.z`\
  \ 的值从 100 改为 -100。会发生什么？如果你在 100 和 -100 之间不断切换，会发生什么？当 `z` 为 100 时，手向前移动。\n\n![](img/Image00230.jpg)\n\
  \n当 `z` 为 -100 时，手向后移动，以至于我们几乎看不到手在身体后面。\n\n![](img/Image00231.jpg)\n\n当你在 -100\
  \ 和 100 之间来回改变 `position.z` 时，手就像在来回摆动。恭喜！你刚刚学会了一种著名的动画技术！\n\n在某些游戏中，将物体从一个地方移动到另一个地方就足以让它看起来在移动。但在我们的游戏中，我们可以做得更好。\n\
  \n首先删除设置 `position.z` 的那一行。我们不想只设置一次。我们想要让它动起来。所以，删除那一行后，转到 `animate()` 函数。在第 4\
  \ 章“项目：移动虚拟角色”（第 35 页）之后，我们已经实现了侧手翻和后空翻的动画。\n\n```javascript\nvar is_cartwheeling\
  \ = false;\nvar is_flipping = false;\n\nfunction animate() {\n  requestAnimationFrame(animate);\n\
  \  if (is_cartwheeling) {\n    avatar.rotation.z = avatar.rotation.z + 0.05;\n \
  \ }\n  if (is_flipping) {\n    avatar.rotation.x = avatar.rotation.x + 0.05;\n \
  \ }\n  renderer.render(scene, camera);\n}\nanimate();\n```\n\n我们的 `animate()` 函数中有很多内容。从第\
  \ 5 章“函数：反复使用”（第 49 页）我们知道，这种“噪音”会让代码难以阅读。我们还要向 `animate()` 中添加更多内容。如果不采取措施，`animate()`\
  \ 函数会变得非常非常庞大。\n\n所以，让我们创建一个 `acrobatics()` 函数来处理后空翻和侧手翻。我们顺便把 `is_cartwheeling`\
  \ 和 `is_flipping` 变量也移过去。然后我们可以在 `animate()` 中调用 `acrobatics()`，使代码更易读。\n\n```javascript\n\
  function animate() {\n  requestAnimationFrame(animate);\n  acrobatics();\n  renderer.render(scene,\
  \ camera);\n}\nanimate();\n\nvar is_cartwheeling = false;\nvar is_flipping = false;\n\
  \nfunction acrobatics() {\n  if (is_cartwheeling) {\n    avatar.rotation.z = avatar.rotation.z\
  \ + 0.05;\n  }\n  if (is_flipping) {\n    avatar.rotation.x = avatar.rotation.x\
  \ + 0.05;\n  }\n}\n```\n\n花点时间确认一切仍然正常工作。如果出了问题，请检查 JavaScript 控制台！\n\n现在让我们向 `animate()`\
  \ 函数中添加三样东西。\n\n```javascript\nvar clock = new THREE.Clock(true);\n\nfunction animate()\
  \ {\n  requestAnimationFrame(animate);\n  walk();\n  acrobatics();\n  renderer.render(scene,\
  \ camera);\n}\n\nanimate();\n\nfunction walk() {\n  var position = Math.sin(clock.getElapsedTime()\
  \ * 10) * 100;\n  right_hand.position.z = position;\n}\n```\n\n❶ 我们将使用这个 3D 时钟作为动画的计时器。\n\
  \n❷ 除了表演杂技，现在我们还要行走。\n\n❸ 这是移动手脚的函数。\n\n正如你可能从名字中猜到的，`Math.sin()` 与数学有关。事实上，它是一个非常神奇的数学函数，叫做正弦，有各种各样的用途。这里我们利用了\
  \ `Math.sin()` 会随时间生成一个介于 -1 和 1 之间的数字这一特性。\n\n将 100 乘以 `Math.sin()` 意味着 `position`\
  \ 将是一个介于 -100 和 100 之间的数字。在 JavaScript 中，星号字符（`*`）用于乘法。\n\n我们将在“深入理解 JavaScript\
  \ 基础”中进一步讨论如何处理数学运算。\n\n如果你正确输入了所有内容，你应该会看到虚拟角色的右手在来回抖动：\n\n![](img/Image00232.jpg)\
  \ ![](img/Image00233.jpg)\n\n来回：\n\n![](img/Image00234.jpg) ![](img/Image00235.jpg)\n\
  \n而且它应该移动得相当快。\n\n![](img/Image00236.jpg)\n\n**自己试试**\n\n尝试修改 `animate()` 中的数字。如果你把\
  \ 10 改成 100，会发生什么？如果你把 100 改成 1000，会发生什么？尝试使用 `position.x` 或 `position.y` 代替 `position.z`。尝试同时使用\
  \ `position.y` 和 `position.z`。\n\n\n\n\n\n![](img/Image00251.jpg) ![](img/Image00252.jpg)\
  \ 同时。\n\n![](img/Image00253.jpg) 一旦你对这些数字有了感觉，尝试另一只手 ![](img/Image00254.jpg) 和脚。\n\
  \n## 6.3 同时摆动双手和双脚\n\n效果如何？你能让所有的手和脚都前后摆动吗？有没有遇到什么问题？\n\n如果你尝试以相同的方式移动手和脚，你可能会注意到我们的虚拟角色移动得非常奇怪。两只脚和两只手同时向前移动，然后两只脚和两只手同时向后摆动。现实生活中没有人这样走路。\n\
  \n当你走路时，一只脚在前，另一只脚在后。用虚拟角色的术语来说，一只脚在 Z 正方向，另一只在 Z 负方向：\n\n```javascript\nvar position\
  \ = Math.sin(clock.getElapsedTime()*5) * 50 ; \nright_foot.position.z = - position;\
  \ \nleft_foot.position.z = position;\n```\n\n人们通常也会在左脚向前时向前移动右手。如果右手向前，那么左手应该向后。我们可以通过以下代码让虚拟角色做到这一点：\n\
  \n```javascript\nfunction walk() {\n    var position = Math.sin(clock.getElapsedTime()*5)\
  \ * 50 ; \n    right_hand.position.z = position; \n    left_hand.position.z = -\
  \ position; \n    right_foot.position.z = - position;\n    left_foot.position.z\
  \ = position;\n}\n```\n\n这样，我们的手和脚就会以良好的行走姿态前后摆动。![](img/Image00255.jpg)\n\n## 6.4\
  \ 移动时行走\n\n目前，我们的虚拟角色一直在行走——即使我们没有使用第 4 章“项目：移动虚拟角色”（第 35 页）中的控制键来控制它。让我们解决这个问题。\n\
  \n### 准备\n首先，我们在 `walk()` 函数中添加一行代码。\n\n```javascript\nfunction walk() {\n    if\
  \ (!isWalking()) return ; \n    var position = Math.sin(clock.getElapsedTime()*5)\
  \ * 50 ; \n    right_hand.position.z = position; \n    left_hand.position.z = -\
  \ position;\n    right_foot.position.z = - position; \n    left_foot.position.z\
  \ = position; \n}\n```\n\n你注意到函数的第一行了吗？这行代码的意思是，如果虚拟角色没有在行走，则立即从函数中返回。调用 `return`\
  \ 意味着我们立即离开函数，并且函数中的其他代码都不会执行。也就是说，如果虚拟角色没有在行走，则离开 `walk()` 函数，不运行任何让虚拟角色看起来在行走的代码。\n\
  \n如果你一直非常仔细地观察，可能会好奇那个 `isWalking()` 是什么。这是一个我们现在要编写的函数！\n\n我们将在 `keydown` 事件监听器之前添加这段代码。\n\
  \n```javascript\nvar is_moving_right, is_moving_left, is_moving_forward, is_moving_back;\
  \ \nfunction isWalking() { \n    if (is_moving_right) return true; \n    if (is_moving_left)\
  \ return true; \n    if (is_moving_forward) return true; \n    if (is_moving_back)\
  \ return true; \n    return false;\n}\n```\n\n在 `isWalking()` 函数之前，我们声明了“正在移动”的变量，这些变量很快就会被用到。我们使用了一个\
  \ JavaScript 快捷方式——逗号分隔列表——在一行中声明了所有四个变量，并且只使用了一个 `var`。\n\n在函数内部，我们使用 `return`\
  \ 关键字立即退出函数。这次我们返回一个 `true` 或 `false` 值。如果虚拟角色控制的任何移动属性为 `true`，那么 `isWalking()`\
  \ 将返回 `true`。换句话说，如果控制的任何移动属性表明虚拟角色正在移动，那么虚拟角色就是 `isWalking()`。\n\n函数 `isWalking()`\
  \ 的最后一行返回 `false`，只有当所有移动控制属性都不为 `true` 时才会执行。如果虚拟角色控制的移动属性都没有开启，那么我们就返回 `false`，以表明虚拟角色没有在行走。\n\
  \n现在我们需要打开和关闭这些移动控制。我们在事件监听器中执行此操作，该监听器已经根据按下的键移动虚拟角色。添加如下所示的代码行。\n\n```javascript\n\
  document.addEventListener('keydown' , function (event) { \n    var code = event.keyCode;\n\
  \    if (code == 37) { // 左 \n        marker.position.x = marker.position.x-5;\n\
  \        is_moving_left = true; \n    }\n    if (code == 38) { // 上 \n        marker.position.z\
  \ = marker.position.z-5;\n        is_moving_forward = true; \n    }\n    if (code\
  \ == 39) { // 右 \n        marker.position.x = marker.position.x+5;\n        is_moving_right\
  \ = true; \n    }\n    if (code == 40) { // 下 \n        marker.position.z = marker.position.z+5;\n\
  \        is_moving_back = true; \n    }\n    if (code == 67) is_cartwheeling = !is_cartwheeling;\
  \ // C \n    if (code == 70) is_flipping = !is_flipping; // F\n});\n```\n\n1. 虚拟角色正在向左移动。\n\
  2. 虚拟角色正在向前移动。\n3. 虚拟角色正在向右移动。\n4. 虚拟角色正在向后移动。\n\n这打开了移动控制，但我们还需要能够关闭它们。由于我们使用 `keydown`\
  \ 来判断按键何时被按下，你大概能猜到我们将如何判断按键何时被释放。\n\n在 `keydown` 事件监听器代码的最后一行（`});` 行之后），添加以下 `keyup`\
  \ 事件监听器代码。\n\n```javascript\ndocument.addEventListener('keyup' , function (event)\
  \ { \n    var code = event.keyCode;\n    if (code == 37) is_moving_left = false;\
  \ \n    if (code == 38) is_moving_forward = false; \n    if (code == 39) is_moving_right\
  \ = false; \n    if (code == 40) is_moving_back = false;\n});\n```\n\n这样，我们应该能够使用方向键移动虚拟角色，并看到虚拟角色的手和脚前后摆动。当我们松开这些键时，虚拟角色的行走应该会停止。\n\
  \n### 挑战：更好的杂技控制\n准备 ![](img/Image00256.jpg)\n\n如果你愿意接受挑战，让我们争取更好的杂技控制。既然我们有代码来监听\
  \ `keydown` 和 `keyup` 事件，试着让侧手翻和后空翻在按下 `C` 或 `F` 键时开始，并在松开 `C` 或 `F` 键时停止。你觉得这样控制更好吗？如果是，就保留它们——这是你的游戏！\n\
  \n## 6.5 到目前为止的代码\n如果你想核对本章的代码，请参阅附录 A1.6“代码：移动手和脚”（第 223 页）。\n\n## 6.6 下一步\n我们现在有了一种让虚拟角色活起来的新方法。在第\
  \ 4 章“项目：移动虚拟角色”（第 35 页）中，我们能够在场景中移动虚拟角色并执行后空翻和侧手翻。在本章中，我们能够让虚拟角色的部分移动——使虚拟角色看起来更加生动。\n\
  \n本章的大概念不是 JavaScript 的东西，甚至不是 3D 的东西。它是一个数学概念：正弦。即使你在数学课上学过这些，我敢打赌你没有像我们这样使用它们！\n\
  \n我们的虚拟角色仍然缺少的一个能力是转身。即使虚拟角色向左或向右移动，它仍然面朝前方。这有点奇怪，对吧？在第 8 章“项目：旋转我们的虚拟角色”（第 79 页）中，我们将介绍如何旋转整个虚拟角色。\n\
  \n但首先，让我们短暂休息一下，更仔细地看看 JavaScript。\n\n当你完成本章后，你将：\n- 知道许多 JavaScript 的东西（比如 `var`）是什么。\n\
  \n\n\n\n\n# 第 7 章 深入理解 JavaScript 基础\n\n在继续之前，让我们更深入地了解 JavaScript。与其他编程语言一样，JavaScript\
  \ 的设计初衷是让计算机和人类都能理解。JavaScript 编程可以看作是对事物及其行为的描述，就像英语和其他语言一样。当我们构建虚拟角色时，我们用 JavaScript\
  \ 描述了它的头部、手和脚。我们还描述了 3D 渲染器如何在浏览器中绘制场景。总而言之，JavaScript 拥有计算机和人类都能理解的关键字。让我们来看看。\n\
  \n### 7.1 开始\n\n本章中，我们不再绘制和移动形状，而是探索 JavaScript 编程语言。大部分操作可以在 JavaScript 控制台中完成，所以请先打开它。如果你不记得如何打开，请参考第\
  \ 18 页的 2.2 节“打开和关闭 JavaScript 控制台”。有些我们要看的 JavaScript 代码对于控制台来说太大了。这时，我们需要在 ICE\
  \ 代码编辑器中创建一个新项目。使用 3D 入门项目模板，并将其命名为“Just JavaScript”。\n\n![](img/Image00257.jpg)\n\
  \nJavaScript 控制台中的代码。\n\n本章开头只是介绍一些概念，所以在 JavaScript 控制台中操作是最简单的。一定要多尝试！\n\n准备就绪\n\
  \n### 7.2 在 JavaScript 中描述事物\n\n你有没有注意到我们是如何在 JavaScript 中引入新事物的？\n\n```\n// 你不需要输入这行代码：\n\
  var head_shape = new THREE.SphereGeometry(100);\n```\n\n`var`关键字在 JavaScript 中声明新事物。它告诉计算机和阅读代码的人：“准备好了——有新东西要来了！”\n\
  \nJavaScript 中有很多不同种类的事物。在你刚才看到的那一小段代码中，我们创建了一个新的 3D 球体形状。事物也可以是数字：\n\n```\nvar\
  \ my_height = 1.5;\n```\n\n它们可以是文字：\n\n```\nvar title = \"3D Game Programming for\
  \ Kids\";\n```\n\n程序员通常把引号内的内容称为字符串。这里的`title`是一个字符串，它保存了本书的书名。\n\n### 字符串很容易出错\n\
  \n![](img/Image00258.jpg) ![](img/Image00259.jpg) 一定要记得关闭引号。如果忘记，你会遇到非常奇怪的错误，而且很难修复。\n\
  \n![](img/Image00260.jpg)\n\n![](img/Image00261.jpg) 它们可以是 ![](img/Image00262.jpg)\
  \ 布尔值： ![](img/Image00263.jpg) ![](img/Image00264.jpg)\n\n```\nvar am_i_cool = true;\n\
  var am_i_dumb = false;\n```\n\n它们甚至可以是表示“无意义”的奇怪 JavaScript 事物：\n\n```\nvar i_mean_nothing\
  \ = null;\nvar i_also_mean_nothing = undefined;\n```\n\n![](img/Image00265.jpg)\n\
  \n### 为什么用`var`？`null`和`undefined`是什么？\n\n通常你不需要担心`undefined`或`null`。创建这样的东西没有太大意义。如果你看到它们，通常是在函数中——表示函数没有找到或创建任何东西。\n\
  \n`var`关键字是变量（variable）的缩写。变量是可以改变的事物：\n\n```\nvar game = \"started\";\n// 在这里做一些工作\n\
  game = \"over\";\n```\n\n一开始游戏还没结束。然后，过了一段时间，游戏结束了。如果我们在`// 在这里做一些工作`的位置编写代码，那段代码会认为游戏仍在进行中。能够更新变量很快就会派上用场。\n\
  \n关于以两个斜杠开头的行……\n\n### 注释\n\n双斜杠表示注释。计算机知道它应该忽略`//`之后该行的所有内容。换句话说，注释仅供人类阅读：\n\n\
  ```\n// 返回今天的日期\nvar today = new Date();\n\n// 这是 2013 年 1 月 1 日\nvar jan1 = new\
  \ Date(2013, 1, 1);\n```\n\n![](img/Image00266.jpg)\n\n### 你不需要输入注释\n\n本书中的注释旨在为你提供有用的提示。你不需要输入它们，但最好还是输入。当你以后打开代码进行修改时，注释会帮助你记住当初为什么这样做。真的，你也应该添加自己的注释。\n\
  \n### 7.3 改变事物\n\n我们知道可以改变事物，但每种变量在 JavaScript 中如何改变呢？让我们逐一来看。\n\n### 数字\n\n你可以使用标准的数学符号在\
  \ JavaScript 中进行加减运算。在 JavaScript 控制台中尝试以下操作：\n\n```\n5 + 2;\n10 - 9.5;\n23 - 46;\n\
  84 + -42;\n```\n\n你应该得到以下答案（答案显示在数学问题下方的注释中）：\n\n```\n5 + 2;   // 7\n10 - 9.5; //\
  \ 0.5\n23 - 46;  // -23\n84 + -42; // 42\n```\n\n所以它甚至适用于负数。记住这一点；负数在我们处理 3D 图形时会很有用。\n\
  \n好了，加减法在 JavaScript 中相当简单。乘除法呢？大多数键盘上有加号和减号，但没有×和÷键。\n\n乘法使用星号（`*`）字符：\n\n```\n\
  3 * 7;   // 21\n2 * 2.5; // 5\n-2 * 4;  // -8\n7 * 6;   // 42\n```\n\n除法使用斜杠（`/`）字符：\n\
  \n```\n45 / 9;   // 5\n100 / 8;  // 12.5\n84 / 2;   // 42\n```\n\n关于数字，还有一点需要了解：当同时进行大量算术运算时，可以使用括号进行分组。括号内的数学运算总是先计算：\n\
  \n```\n5 * (2 + 4); // 30\n(5 * 2) + 4; // 14\n```\n\n没有括号会发生什么？你能猜出原因吗？[¹]\n\n\
  ### 几何\n\n本书涉及 3D 游戏概念，这意味着几何。我们将在需要几何知识的各个项目章节中更详细地讨论几何。现在，我们先考虑两个几何函数：正弦和余弦。如果你不了解它们，别担心——你会在游戏中逐渐熟悉它们。\n\
  \n只需记住，在 JavaScript 中，我们不使用度数，而是使用弧度。什么是弧度？当我们绕圆旋转半圈时，我们不说转了 180°，而是说转了π弧度。\n\n\
  ![](img/Image00267.jpg)\n\nπ是数学中的一个特殊数字。它的值大约是 3.14159。你经常会看到符号π表示π。我们称之为 pi，因为\
  \ JavaScript 中叫它`Math.PI`。\n\n绕圆一整圈是 180°旋转的两倍——通常称为 360°旋转，即 2π弧度，或 2×π。\n\n![](img/Image00268.jpg)\n\
  \n顺便说一下，2×π就是我们之前在第 6 页“用立方体形状制作盒子”中首次讨论旋转时提到的完整旋转的 6.3。因为π的数值大约是 3.15，所以 2×π就是\
  \ 2×3.15，即 6.3。\n\n![](img/Image00269.jpg)\n\n[¹]: 没有括号时，先做乘法，再做除法。还记得数学课上的“运算顺序”吗！\n\
  \n在 JavaScript 中，π被称为`Math.PI`。所以 360°就是`2 * Math.PI`。下面是一个方便的换算表：\n\n| 度数 | 弧度\
  \ | JavaScript |\n|------|------|------------|\n| 0°   | 0    | 0          |\n|\
  \ 45°  | π ÷ 4 | `Math.PI/4` |\n| 90°  | π ÷ 2 | `Math.PI/2` |\n| 180° | π    |\
  \ `Math.PI`   |\n| 360° | 2 × π | `2 * Math.PI` |\n| 720° | 4 × π | `4 * Math.PI`\
  \ |\n\n几何函数也可以在 JavaScript 的`Math`模块中找到。例如我们在第 6 章“项目：移动手和脚”（第 59 页）中看到的正弦函数。JavaScript\
  \ 将正弦及其伴侣余弦分别简写为`sin`和`cos`：\n\n```\nMath.sin(0);       // 0\nMath.sin(2*Math.PI);\
  \ // 0\nMath.cos(0);       // 1\n```\n\n### 非常非常接近零\n\n![](img/Image00270.jpg)\n\
  \n根据你的计算机，当你在 JavaScript 控制台中尝试`Math.sin(2*Math.PI)`时，可能没有得到正确的答案。2×π的正弦是零，但你可能会看到类似`-2.4492127076447545e-16`的结果。这表明计算机并不完美。有时它们的计算可能会有微小的误差。\n\
  \n![](img/Image00271.jpg)\n\n当 JavaScript 在数字末尾有`e-16`时，表示这是一个小数点向左移动 16 位的小数。换句话说，`-2.45e-16`等同于`0.000000000000000245`。这是一个非常非常小的数字——你需要把它加更多次\n\
  \n\n\n\n我们不会经常用到这些 `Math` 函数。随着学习的深入，它们会时不时地出现。大多数情况下，我们可以使用简单的算术运算符进行加、减、乘、除。\n\
  \n## 字符串\n\nJavaScript 中的字符串有点无聊。你实际上只能将两个字符串连接成更大的字符串。有趣的是，加号运算符就是用来连接它们的。在 JavaScript\
  \ 控制台中尝试以下代码。\n\n```\nvar str1 = \"Howdy\" ; var str2 = \"Bob\" ;\n\nstr1 + \" \"\
  \ + str2; // \"Howdy Bob\"\n```\n\n很疯狂，不是吗？鉴于大多数键盘上没有乘法和除法键，肯定也没有将两个字符串粘在一起的键。所以\
  \ JavaScript 偷懒了，再次使用了加号。\n\n你猜如果你尝试连接一个字符串和一个数字会发生什么？试试看：\n\n```\nvar str = \"\
  The answer to 7 + 4 is \" ; var answer = 7 + 4 ; str + answer;\n```\n\n自己试试\n\n\
  ![](img/Image00272.jpg) ![](img/Image00273.jpg) 执行此操作并在 JavaScript 控制台中检查！\n\n![](img/Image00274.jpg)\
  \ 结果是，当组合字符串和数字时，JavaScript 会将数字视为字符串：\n\n```\nvar str = \"The answer to 7 + 4 is\
  \ \" ; var answer = 7 + 4 ;\n\nstr + answer;\n\n// \"The answer to 7 + 4 is 11 \"\
  \n```\n\n## 布尔值\n\n布尔值没什么复杂的。它要么是 `true`，要么是 `false`。可以使用非运算符来转换布尔值。在 JavaScript\
  \ 中，感叹号就是非运算符：\n\n```\nvar yes = true; var the_opposite = ! yes; var\n\nthe_opposite_of_the_opposite\
  \ = !! yes; yes; // true\n\nthe_opposite;\n\n// false\n\nthe_opposite_of_the_opposite;\
  \ // true\n```\n\n我们不会经常这样直接使用布尔值。我们通常会看到生成布尔值的比较运算符：\n\n```\n// The > symbol checks\
  \ for values greater than others\nvar is_ten_greater_than_six = 10 > 6 ;\n\nis_ten_greater_than_six;\
  \ // true\n```\n\n```\n// Two equal signs check if values are equal\nvar is_twelve_the_same_as_eleven\
  \ = 12 == 11 ;\n\nis_twelve_the_same_as_eleven;\n\n// false\n```\n\n### 双等号 vs.\
  \ 单等号\n\n![](img/Image00275.jpg) JavaScript 中的双等号（`==`）用于检查某个值是否等于另一个值。它不会改变任何东西——它只检查值并产生一个布尔值。\n\
  \n正如我们在本书中看到的，单等号（`=`）使一个值等于另一个值。通常称为赋值运算符，单等号确实会改变一个值——它更新一个变量或首次为其赋值。\n\n你可能会想，让两个截然不同的运算符看起来如此相似是否明智。并不明智。这是一个非常常见的错误来源——即使对于编程多年的人来说也是如此。但是，由于它已经存在了很长时间，可能短期内不会改变。所以要警惕这类错误。\n\
  \n我们会经常看到这类布尔值。事实上，它们就在下一节中。\n\n### 7.4 使用 while 和 if 重复和跳过代码\n\n通常，JavaScript 代码是从上到下运行的。程序顶部的代码行首先运行。一旦计算机运行完这些行，就会继续执行下一行。这个过程一直持续到程序文件的底部。\n\
  \n但有时我们并不希望所有代码都运行。而其他时候我们希望代码运行多次。在这些情况下，我们使用控制关键字。本书中最常见的关键字是 `while` 和 `if`。\n\
  \n使用 while 和 if 重复和跳过代码\n\n![](img/Image00277.jpg) 在 ICE 中编写代码，在控制台中检查\n\n本章剩余部分的代码对于\
  \ JavaScript 控制台来说太大了，所以请在 ICE 中将其添加到 START CODING 行之后。确保保持 JavaScript 控制台打开——即使我们没有在那里输入代码，我们仍然会用它来显示消息。\n\
  \n### While\n\n如果一段代码（我们称之为块）以 `while` 开头，那么该块会反复运行，直到某个条件发生变化。需要变化的条件放在 `while`\
  \ 关键字后面的括号中：\n\n```\nvar i = 0 ;\nwhile (i < 5) {\n    console.log(\"i is now:\"\
  \ + i);\n    i = i + 1 ;\n}\n```\n\n如果你尝试这个并在 JavaScript 控制台中检查，你会看到类似下面的内容：\n\n\
  ```\ni is now: 0\ni is now: 1\ni is now: 2\ni is now: 3\ni is now: 4\n```\n\n每次执行代码块时，我们都会将变量\
  \ `i` 记录到 JavaScript 控制台。我们还进行了一点数学运算。我们将 `i` 的旧值加 1。然后计算机将再次运行 `while` 块——只要 `i`\
  \ 小于 5（`<` 符号表示小于）。一旦 `i` 等于 5，计算机就会停止重新运行 `while` 块，并继续执行后续行。\n\n自己试试\n\n![](img/Image00278.jpg)\
  \ ![](img/Image00279.jpg) 如果你运行以下代码会发生什么？\n\n![](img/Image00280.jpg)\n\n```\nvar\
  \ i = 0 ;\n\nwhile (i < 5) {\n\n    console.log(\"Chris is awesome!!!!\" ) ;\n\n\
  \    i = i + 1 ;\n\n}\n```\n\n一定要试试你自己的名字！\n\n### 仅在条件为真时运行代码\n\n有时我们希望完全跳过某些代码。在这些情况下，我们使用\
  \ `if` 关键字。就像 `while` 一样，`if` 关键字对代码块执行操作：\n\n```\nvar game = \"started\" ;\n\n\
  // More code here that might change the variable \"game\"\n// to something else...\n\
  if (game == \"over\" ) {\n    console.log(\"Game Over!!!\" ) ;\n}\n```\n\n`if` 关键字允许我们编写仅在某个条件为真时才运行的\
  \ JavaScript 代码。在这个例子中，我们使用双等号（`==`）运算符检查 `game` 是否等于字符串 `over`。\n\n我们还可以使用 `else\
  \ if` 和 `else` 来扩展 `if` 语句。考虑以下代码，我们将在第 20 章（项目：河流漂流，第 185 页）中使用它来转向和移动木筏：\n\n```\n\
  document.addEventListener( \"keydown\" , function (event) {\n    var code = event.keyCode;\n\
  \n    ❶ if (code == 32) pushRaft(); // space\n    ❷ else if (code == 37) rotateRaft(-1);\
  \ // left\n    ❸ else if (code == 39) rotateRaft(1); // right\n    ❹ else { // Something\
  \ else\n        console.log(code);\n    }\n}) ;\n```\n\n我们将在项目章节中进一步讨论这段代码，但我们可以看到：\n\
  \n❶ 如果代码是空格键代码，则我们将木筏向前推\n\n❷ 否则，如果代码是左箭头键，则我们将木筏向左转\n\n❸ 否则，如果代码是右箭头键，则我们向右转\n\n\
  ❹ 否则，按下了某个奇怪的键，我们只需将代码记录到 JavaScript 控制台\n\n### 不要过度使用 If\n\n![](img/Image00281.jpg)\
  \ ![](img/Image00282.jpg) ![](img/Image00283.jpg) ![](img/Image00284.jpg) `if`、`else\
  \ if` 和\n\n![](img/Image00285.jpg) `else`\n\n![](img/Image00286.jpg) ![](img/Image00287.jpg)\
  \ ![](img/Image00288.jpg) ![](img/Image00289.jpg) 非常强大，但可能会被过度使用。我们\n\n![](img/Image00290.jpg)\
  \ 将在一些项目章节中讨论更好的方法。\n\n![](img/Image00291.jpg)\n\n### 7.5 列出事物\n\n有时能够描述一个事物列表非常方便。在\
  \ JavaScript 中，列表使用方括号创建。一个精彩电影的列表可能如下所示：\n\n```\nvar amazing_movies = [\n    'Star\
  \ Wars' ,\n    'The Empire Strikes Back' ,\n    'Indiana Jones and the Raiders of\
  \ the Lost Ark'\n] ;\n```\n\n列表中的事物可以是到目前为止我们讨论过的任何类型：字符串、数字、布尔值。甚至可以创建一个包含各种类型事物的列表：\n\
  \n```\n// Don't do this:\nvar useless_list = [\n    true, 3.14 ,'OK'\n] ;\n```\n\
  \n但不要这样做。这很愚蠢。就像在现实生活中一样，计算机列表应该包含相同类型的事物。在购物清单上包含你最喜欢的颜色、朋友过来的时间或昨晚比赛的得分是没有意义的。在商店购买物品的清单应该只包含商店里有的物品。\n\
  \n使用列表的方法有很多，但我们在本书中最常用的是为列表中的每个项目调用一个函数：\n\n```\nvar amazing_movies = [\n    'Star\
  \ Wars' ,\n    'The Empire Strikes Back' ,\n    'Indiana Jones and the Raiders of\
  \ the Lost Ark'\n] ;\n\namazing_movies.forEach( function (movie) {\n    console.log(\"\
  GREAT: \" + movie);\n}) ;\n```\n\n将 `forEach()` 函数视为一种方式，表示对于列表中的“每个”事物，\n\n- 给它一个昵称——在前面的代码中我们称之为\
  \ `movie`\n- 在函数内部对其进行操作——我们将其记录为 `\"GREAT\"`\n\n\n\n如果你输入这段代码并查看 JavaScript 控制台，你会得到如下输出：\n\
  GREAT: Star Wars\nGREAT: The Empire Strikes Back\nGREAT: Indiana Jones and the Raiders\
  \ of the Lost Ark\n\n我们将在后续的一些章节中再次看到列表。\n\n### 7.6 JavaScript 的独特之处\n\nJavaScript\
  \ 与许多其他语言不同，但对我们来说最重要的是它被设计为在浏览器中运行。这意味着它可以非常轻松地完成许多网页相关的工作。正如我们在第 4 章《项目：移动角色》（第\
  \ 35 页）中看到的，JavaScript 可以打开浏览器警告对话框：\n\n```javascript\nalert('Stop what you are\
  \ doing and shout \"Yay!\"');\n```\n\nJavaScript 也非常擅长修改网页内容。虽然本书中不会大量涉及网页修改，但在某些游戏制作计分板时我们会讨论这个话题。\n\
  \n### 7.7 下一步\n\n本章包含大量信息。如果有些内容暂时不理解，不必担心。当你学习后续章节时，如果遇到问题可以回到这里查阅。随着学习的深入，你会逐渐理解这些内容。\n\
  \n我们在这里介绍的基础知识就像是 JavaScript 语言的名词。我们在第 5 章《函数：反复使用》（第 49 页）中看到的函数则像是动词——它们告诉基础知识需要做什么才能让事情发生。说到让事情发生，让我们回到为角色添加酷炫功能的工作中！\n\
  \n完成本章后，你将能够：\n- 掌握更多用于 3D 编程的有趣数学知识\n- 知道如何旋转物体使其朝向特定方向\n- 能够制作平滑的动画\n\n# 第 8 章\
  \ 项目：旋转我们的角色\n\n我们的角色动画已接近完成。在第 4 章《项目：移动角色》（第 35 页）中，我们学会了如何让角色移动。在第 6 章《项目：移动手脚》（第\
  \ 59 页）中，我们让角色看起来像是在行走。现在我们需要让角色在切换方向时能够转向。转向（或旋转）对我们来说并不陌生——我们在翻转和侧翻时已经让角色旋转过。但这次我们希望角色朝向特定的方向。\n\
  \n### 8.1 开始\n\n如果尚未在 ICE 代码编辑器中打开，请打开我们命名为“我的角色：移动手脚”的项目（来自《项目：移动手脚》）。点击菜单按钮，选择“制作副本”，将其复制一份。将项目命名为“我的角色：转向”，然后点击“保存”按钮。\n\
  \n### 8.2 朝向正确的方向\n\n让角色朝向正确的方向相当简单——尤其是我们已经掌握了这么多知识。就像我们添加手脚行走动作时一样，我们将编写一个新函数来旋转角色。我们将这个函数命名为\
  \ `turn()`，因此在 `animate()` 函数中添加对该函数的调用。\n\n```javascript\nfunction animate() {\n\
  \    requestAnimationFrame(animate);\n    walk(); \n    turn();\n    acrobatics();\n\
  \    renderer.render(scene, camera);\n} \nanimate();\n```\n\n接下来编写 `turn()` 函数。JavaScript\
  \ 不关心你将这个函数放在哪里，但由于我们在 `animate()` 函数中是在 `walk()` 之后调用它，我们不妨将其放在 `walk()` 函数之后。在\
  \ `walk()` 函数的右花括号后面输入以下内容：\n\n```javascript\nfunction turn() {\n    var direction\
  \ = 0; \n    if (is_moving_forward) direction = Math.PI; \n    if (is_moving_back)\
  \ direction = 0; \n    if (is_moving_right) direction = Math.PI/2; \n    if (is_moving_left)\
  \ direction = -Math.PI/2;\n    avatar.rotation.y = direction; \n}\n```\n\n这样一来，当我们向左或向右行走时，角色就会面向它移动的方向：\n\
  \n![](img/Image00292.jpg)\n\n这真是太棒了。你现在已经制作了一个复杂的游戏角色。想想你完成了什么：\n- 为角色赋予了身体、手和脚\n\
  - 让角色移动时所有部件随之移动\n- 让角色能够侧翻和翻转\n- 将摄像机固定在角色上\n- 将摄像机固定在角色的位置上，这样翻转和侧翻就不会让我们头晕\n\
  - 让角色行走时手脚前后摆动\n- 让角色停止移动时手脚也停止摆动\n- 让角色面向它行走的方向\n\n### 分解说明\n这是非常了不起的 JavaScript\
  \ 3D 编程。你能走到这一步已经很棒了，但我们还能做得更多。首先，让我们仔细看看 `turn()` 函数，确保我们理解其中的原理。\n\n## 8.3 分解说明\n\
  \n在 `turn()` 函数中，为什么我们将 `direction` 设置为 `Math.PI` 和 `-Math.PI/2` 这样的值？\n\n回想一下第\
  \ 71 页的《几何学》部分，角度（旋转量）使用的是弧度而非度数。角色初始时面朝后方，朝向摄像机。因此 0° 旋转对应 0 弧度，即面朝后方。而 180° 对应\
  \ π 弧度，即面朝屏幕前方。下表是我们在 `turn()` 函数中使用的完整列表。\n\n| 方向 | 弧度 | JavaScript | 度数 |\n| :---\
  \ | :--- | :--- | :--- |\n| 前方 | 180° | `Math.PI` | π |\n| 右方 | 90° | `Math.PI/2`\
  \ | π ÷ 2 |\n| 左方 | -90° | `-Math.PI/2` | -π ÷ 2 |\n| 后方 | 0° | `0` | 0 |\n\n###\
  \ 为什么是 `rotation.y`？\n这解释了我们在 `turn()` 函数中为 `direction` 变量使用的数值，但为什么设置的是 `rotation.y`？而不是\
  \ `rotation.z` 或 `rotation.x`？\n\n原因之一是，我们在做侧翻时已经改变了 `rotation.x`，在做翻转时改变了 `rotation.z`。我们设置\
  \ `rotation.y` 是因为我们希望角色绕 y 轴旋转。回想一下，在 3D 中，y 轴是上下方向的。想象一根杆子从角色正中间竖直穿过，那就是角色的 y\
  \ 轴：\n\n![](img/Image00293.jpg)\n\n让角色绕这根杆子旋转，就是绕 y 轴旋转角色。\n\n### 别忘了 `avatar.rotation`！\n\
  如果你尝试旋转 `marker.rotation` 而不是 `avatar.rotation`，你可能会注意到不仅角色旋转了，其他所有东西似乎也跟着旋转了。这是因为我们将摄像机附加到了角色的标记上：\n\
  \n```javascript\nvar marker = new THREE.Object3D();\nscene.add(marker); \nmarker.add(camera);\n\
  ```\n\n可以把 `marker` 想象成一个容纳角色部件的隐形盒子。通过将摄像机添加到 `marker` 上，我们把它固定在了 `marker` 的一侧。如果我们旋转这个盒子，摄像机也必须跟着一起转：\n\
  \n![](img/Image00294.jpg)\n\n这也是为什么我们将手脚添加到角色的头部而不是角色的 `marker` 上。当我们在 `marker`\
  \ 内部旋转角色时，它的手脚需要随之移动——而不是与 `marker` 一起保持静止。\n\n## 8.4 动画化旋转\n\n目前，当我们旋转角色时，它会立即面向新方向。让我们通过动画化转向新方向的过程，使其更逼真一些。为此，我们需要一个新的\
  \ JavaScript 库。这个库将帮助我们实现不同位置和旋转之间的动画。这个库叫做 `Tween`。\n\n为此，请转到代码顶部。添加 `Tween.js`\
  \ 的 `<script>` 标签，如下所示：\n\n```html\n<body></body>\n<script src=\"http://gamingJS.com/Three.js\"\
  ></script>\n<script src=\"http://gamingJS.com/Tween.js\"></script>\n<script src=\"\
  http://gamingJS.com/ChromeFixes.js\"></script>\n```\n\n### 动画化旋转\n`Tween` 库用于在起始状态和结束状态之间进行动画过渡。这里我们希望从一个旋转角度动画过渡到另一个旋转角度。\n\
  \n使用 `Tween` 的第一步是将其 `update()` 函数添加到我们的 `animate()` 函数中：\n\n```javascript\nfunction\
  \ animate() {\n    requestAnimationFrame(animate); \n    TWEEN.update();\n    walk();\
  \ \n    turn();\n    acrobatics();\n    renderer.render(scene, camera);\n} \nanimate();\n\
  ```\n\n接下来，我们需要修改刚刚编写的 `turn()` 函数。不再立即设置方向，而是调用一个新函数，该函数将使角色旋转到新方向。将 `turn()` 函数的最后一行改为调用\
  \ `spinAvatar()`：\n\n```javascript\nfunction turn() {\n    var direction = 0; \n\
  \    if (is_moving_forward) direction = Math.PI;\n    if (is_moving_back) direction\
  \ = 0; \n    if (is_moving_right) direction = Math.PI/2; \n    if (is_moving_left)\
  \ direction = -Math.PI/2;\n    spinAvatar(direction);\n}\n```\n\n\n\n\n\n`Math.PI/2`;`spinAvatar(direction)`;\
  \ }  \n最后，我们需要编写`spinAvatar()`函数的代码。Tween 代码初看可能有些奇怪。阅读时请记住，我们希望从角色头部当前面对的方向（`avatar.rotation.y`）开始旋转，最终旋转到传入`spinAvatar()`作为`direction`参数的新方向。\n\
  \n在`turn()`函数之后编写以下`spinAvatar()`函数：\n\n```\nfunction spinAvatar(direction) {\n\
  \  new TWEEN.Tween({y: avatar.rotation.y})\n    .to({y: direction}, 100)\n    .onUpdate(function\
  \ () {\n      avatar.rotation.y = this.y;\n    })\n    .start();\n}\n```\n\n从上到下阅读该函数，新的\
  \ Tween 从 Y 旋转值`avatar.rotation.y`开始——即角色当前面对的方向。然后我们告诉 Tween 要旋转到传入`spinAvatar()`函数的新\
  \ Y 旋转值。每次动画运行时，都会执行`onUpdate()`中的内容。角色头部的旋转会更新为 Tween 的 Y 旋转值。最后一行启动整个过程。\n\n该函数中每行末尾的句点表示方法链。在\
  \ JavaScript 中，分号结束一段代码“句子”。与英语不同，JavaScript 中的句点表示我们想对当前代码做其他事情——代码句子尚未结束。\n\n\
  我们本可以将所有这些代码放在一行，但将代码分行阅读对人类来说更容易（计算机并不在意）。方法链仅适用于某些 JavaScript 对象，如 Tween。这在 JavaScript\
  \ 中是一种比较常见的做法，尽管我们不会频繁使用它。\n\n自己试试  \n![](img/Image00295.jpg)\n\n我们告诉 Tween 库它将在\
  \ 100 毫秒内从开始运行到结束。这个数字位于以`to`开头的行末尾。\n\n![](img/Image00296.jpg)\n\n1000 毫秒等于 1 秒，因此\
  \ 100 毫秒小于 1 秒。角色的旋转耗时不到 1 秒。尝试调整这个数字，直到你满意为止。1000 太长了吗？10 太短了吗？你来决定！\n\n### 8.5\
  \ 到目前为止的代码\n\n如果你想核对本章的代码，请参阅第 226 页的 A1.8 节《代码：旋转我们的角色》。\n\n### 8.6 接下来是什么\n\n\
  哇！我们简单的角色模拟已经变得相当复杂了，不是吗？我们已经为角色投入了不少精力，但你可能已经注意到它可以直接穿过我们的树木。在下一个项目章节中，我们将讨论碰撞检测，并用它来让角色在撞到树木时停下来。\n\
  \n但首先，让我们仔细看看我们开始这个项目时自动添加的所有那些 JavaScript 代码。\n\n当你完成本章后，你将  \n• 了解一些关于制作网页的知识\
  \  \n• 理解起始代码  \n• 能够自如地修改起始代码\n\n# 第 9 章  \n那些其他代码都是什么？\n\n当我们从 3D 起始模板创建新项目时，里面已经有很多代码了。在本章中，我们将了解它们都是什么意思。\n\
  \n### 9.1 开始\n\n在 ICE 代码编辑器中从 3D 起始模板创建一个新项目。将其命名为“所有其他代码”。\n\n### 9.2 HTML 快速入门\n\
  \n我们代码的最顶部是以下 HTML：\n\n```\n<body></body>\n```\n\nHTML 不是一种编程语言。那么它为什么出现在我们漂亮的 JavaScript\
  \ 代码中呢？\n\nHTML 是超文本标记语言。它用于构建网页，而不是让网页做有趣的事情。\n\n尽管它不是编程语言，但我们仍然需要 HTML 来运行 JavaScript。由于\
  \ JavaScript 是一种 Web 编程语言，我们需要一个可以编程的网页——即使只是一个简单的页面。\n\n第一行包含一个开始和结束的`<body>`标签。在这两个标签之间，HTML\
  \ 作者通常会放置文字——指向图片和其他页面的链接。我们不在里面放任何东西，因为我们是在编程，而不是制作网页。\n\n为了了解 HTML 的作用，在两个`<body>`标签之间添加以下\
  \ HTML，如下所示：\n\n```\n<body>\n<h1> 你好！</h1>\n<p>\n你可以制作 <b>粗体</b> 文字、\n<i>斜体</i>\
  \ 文字，甚至\n<u>下划线</u> 文字。\n</p>\n<p>\n你可以链接到\n<a href=\"http://gamingJS.com\">其他页面</a>。你还可以添加来自网络服务器的图片：\n\
  <img src=\"/images/purple_fruit_monster.png\">\n</p>\n</body>\n```\n\n![](img/Image00297.jpg)\
  \ 忽略 HTML 的 ICE 警告\n\n![](img/Image00298.jpg) 你的 HTML 代码可能会出现红色 X 警告。这些可以安全地  \n\
  ![](img/Image00299.jpg) 忽略。ICE 是用来编辑 JavaScript 的，而不是 HTML，所以它可能会  \n![](img/Image00300.jpg)\
  \ 混淆。\n\n![](img/Image00301.jpg) 如果你在 ICE 代码编辑器中隐藏代码，你会看到类似这样的内容：\n\n![](img/Image00302.jpg)\
  \ ![](img/Image00303.jpg) 这是一本关于 JavaScript 的书，而不是 HTML 的书，但你已经看到了 HTML 的一些  \n\
  ![](img/Image00304.jpg) 可能性。\n\n在`<body>`标签之后是两个`<script>`标签。与`<body>`标签一样，这些`<script>`标签也是\
  \ HTML，但它们从网络其他地方加载 JavaScript，以便我们可以在当前页面中使用它。\n\n```\n<script src=\"http://gamingJS.com/Three.js\"\
  ></script>\n<script src=\"http://gamingJS.com/ChromeFixes.js\"></script>\n```\n\n\
  这两行告诉浏览器加载两个库。这里，我们加载了一个名为`Three.js`的 3D JavaScript 库，以及一个修复 Chrome 浏览器中 ICE 代码编辑器错误的小型库。\n\
  \n设置场景\n\nJavaScript 不一定来自其他位置。在本书的大部分内容中，我们都是在 HTML 网页内部编写代码。\n\n### 9.3 设置场景\n\
  \n要在 3D 编程中做任何事情，我们需要一个场景。将场景视为所有动作发生的宇宙。对于如此重要的东西，创建起来却非常简单。ICE 中的以下代码就做到了这一点：\n\
  \n```\n// 这是游戏中所有事情发生的地方：\nvar scene = new THREE.Scene();\n```\n\n场景使用起来非常简单。我们在整本书中一直在向场景中添加对象。一旦对象被添加到场景中，场景就负责跟踪所有内容。事实上，这就是我们需要了解的场景的全部内容——创建场景后，我们向其中添加大量对象，场景会处理其余的事情。\n\
  \n### 9.4 使用摄像机捕捉场景\n\n场景在跟踪所有内容方面做得很好，但它们不会向我们展示发生了什么。要看到场景中的任何东西，我们需要一个摄像机。注意\
  \ ICE 中的以下代码：\n\n```\n// 这是看到所有东西的东西：\nvar aspect_ratio = window.innerWidth / window.innerHeight;\n\
  var camera = new THREE.PerspectiveCamera(75, aspect_ratio, 1, 10000);\ncamera.position.z\
  \ = 500;\nscene.add(camera);\n```\n\n`aspect_ratio` 的目的是确定浏览器的形状。这与电影屏幕和电视机的宽高比是同一个概念。一个宽高比为\
  \ 4:3 的大电视可能宽 4 米，高 3 米（好吧，那真是一台非常大的电视）。一个更大的 4:3 屏幕可能宽 12 米，高 9 米（将 4:3 中的 4 和\
  \ 3 都乘以 3 得到 12:9）。如今大多数电影都以 16:9 的宽高比制作，这意味着一个 9 米高的屏幕宽 16 米——与相同高度的 4:3 宽高比相比，多了\
  \ 4 米。\n\n这对我们来说为什么重要？如果你试图将一部 16:9 的电影投影到 4:3 的屏幕上，就需要进行大量压缩。同样，一部 4:3 的电影需要在 16:9\
  \ 的屏幕上拉伸才能显示。大多数电影不会拉伸或压缩，而是被裁剪，这样你就会错过那 4 米的动作。我们的`Three.js`库不会裁剪——它会拉伸或压缩。换句话说，正确设置宽高比非常重要。\n\
  \n\n\n\n当我们构建好一个新相机后，需要将其添加到场景中。与 3D 编程中的其他元素一样，相机默认位于我们添加它的场景中心。我们将其沿 Z 轴方向（即屏幕“向外”方向）移动\
  \ 500 个单位，以便能够清晰地观察场景中心发生的情况。\n\n### 9.5 使用渲染器投射相机所见的画面\n\n场景和相机足以描述场景的外观以及我们从何处观察，但要在网页上显示它，还需要一个额外的步骤。这就是渲染器的工作。它负责显示（或渲染）相机所见的场景：\n\
  \n```\n// This will draw what the camera sees onto the screen:\nvar renderer = new\
  \ THREE.CanvasRenderer();\nrenderer.setSize(window.innerWidth, window.innerHeight);\n\
  document.body.appendChild(renderer.domElement);\n```\n\n我们必须告诉渲染器它将要绘制的屏幕尺寸。我们将视图大小设置为占据整个浏览器窗口（`window.innerWidth`\
  \ 和 `window.innerHeight`）。\n\n要将渲染器包含在网页中，我们使用它的 `domElement` 属性。`domElement` 是\
  \ HTML 标签的另一种称呼，就像本章前面添加的那些标签一样。不过，这个 `domElement` 承载的不是标题或段落，而是我们精彩的 3D 世界。\n\n\
  我们将这个 `domElement` 添加到 `document.body` 中——也就是之前存放 HTML 的同一个 `<body>` 标签。`appendChild()`\
  \ 函数负责将 `domElement` 添加到文档主体中。如果你好奇为什么会有像 `appendChild()` 和 `domElement` 这样的名称，我只能告诉你，庆幸自己是一名\
  \ 3D 游戏程序员，而不是 Web 程序员。Web 程序员不得不一直使用这种愚蠢（且难记）的名称。\n\n此时，渲染器已经可以绘制到屏幕上了，但我们仍然需要告诉它进行渲染，否则什么都不会显示。这就是为什么在代码末尾要使用\
  \ `renderer.render()`。\n\n```\n// Now, show what the camera sees on the screen:\n\
  renderer.render(scene, camera);\n```\n\n渲染器可能像一个烦人的弟弟或妹妹，只有当我们给出极其明确的指令时才会做正确的事情。从某种意义上说确实如此，但从另一种意义上说，所有编程都是这样。除非我们以完全正确的方式告诉计算机该做什么，否则它常常会做出完全出乎意料的事情。\n\
  \n### 9.6 探索不同的相机和渲染器\n\n就渲染器而言，我们已经可以看出拥有这种控制权的好处。在某些实验中，我们只渲染一次。但在许多项目中，我们会在 `animate()`\
  \ 函数内重复渲染。如果没有这种控制，挑选合适的渲染风格就会困难得多。\n\n你可能已经注意到，我们将相机称为 `PerspectiveCamera`，将渲染器称为\
  \ `CanvasRenderer`。如果这些名称显得过于具体，那是因为还有其他类型的相机和渲染器。我们一直使用这些，是因为大多数浏览器和硬件都支持它们。正如我们将在第\
  \ 12 章《灯光与材质》（第 109 页）中看到的，一些我们可能想添加到 3D 游戏中的酷炫效果需要不同的相机和渲染器，而这些只能在相对较新的计算机上运行。\n\
  \n![](img/Image00305.jpg)\n\n**你不必亲自运行这些示例**\n\n有些计算机可能无法运行本章剩余部分的示例。这是因为它们依赖于一种名为\
  \ WebGL 的技术，我们将在第 12 章《灯光与材质》（第 109 页）中更详细地讨论。由于你的计算机可能不支持 WebGL，因此你不必在 ICE 代码编辑器中跟着本节操作。\n\
  \n### 介绍 WebGL 渲染器\n\n另一个重要的渲染器是 `WebGLRenderer`。它的使用方式与 `CanvasRenderer` 完全相同。我们只需要更改名称：\n\
  \n```\n// This will draw what the camera sees onto the screen:\nvar renderer = new\
  \ THREE.WebGLRenderer();\nrenderer.setSize(window.innerWidth, window.innerHeight);\n\
  document.body.appendChild(renderer.domElement);\n```\n\nWebGL 是一项相当新的技术，它允许程序员实现有趣的\
  \ 3D 编程技术，如光照、阴影和雾效。它的动画运行速度也远快于 `CanvasRenderer`。我们将在《灯光与材质》中进一步探讨。\n\n### 快速了解一个名称古怪的相机\n\
  \n另一种相机称为正交相机。为了理解正交相机的作用，我们可以添加一条红色道路，让紫色水果怪物在上面行走。在“在下一行开始编码”之后添加以下代码：\n\n```\n\
  var shape = new THREE.CubeGeometry(200, 1000, 10);\nvar cover = new THREE.MeshBasicMaterial({color:0x990000});\n\
  var road = new THREE.Mesh(shape, cover);\nscene.add(road);\nroad.position.set(0,\
  \ 400, 0);\nroad.rotation.set(-Math.PI/4, 0, 0);\n```\n\n我们的透视相机使道路看起来像这样：\n\n![](img/Image00306.jpg)\n\
  \n这是一条矩形道路，但看起来并不像矩形。它看起来像是越远越小。透视相机为我们实现了这一点：\n\n```\nvar aspect_ratio = window.innerWidth\
  \ / window.innerHeight;\nvar camera = new THREE.PerspectiveCamera(75, aspect_ratio,\
  \ 1, 10000);\n```\n\n另一方面，如果我们使用正交相机，一切看起来都是扁平的：\n\n![](img/Image00307.jpg)\n\n\
  这是上一张图片中的同一条道路。我们只是将创建透视相机的两行代码替换为以下内容：\n\n```\nvar width = window.innerWidth, height\
  \ = window.innerHeight;\nvar camera = new THREE.OrthographicCamera(\n  -width/2,\
  \ width/2, height/2, -height/2, 1, 10000\n);\n```\n\n正如你可能想象的那样，能让一切呈现三维感的透视相机在\
  \ 3D 游戏中非常有用。那么为什么还要使用正交相机呢？\n\n正交相机在两种情况下很有用。第一种是当你想要制作一个扁平的 2D 游戏时。在平面游戏中使用 3D\
  \ 相机看起来会很奇怪——尤其是在屏幕边缘。另一种情况是当我们制作距离非常非常远的游戏时，比如太空游戏。事实上，我们可以在稍后的一些太空模拟中使用正交相机。\n\
  \n### 9.7 接下来是什么\n\n既然我们已经了解了相机、场景和 JavaScript 库，我们将越来越多地改变它们。但首先，让我们教会游戏角色不要穿过树木。\n\
  \n完成本章后，你将能够：\n\n- 阻止游戏元素相互穿过\n- 理解碰撞（这在游戏中很重要）\n- 为你的角色设置游戏边界\n\n## 第 10 章 项目：碰撞\n\
  \n我们有一个相当酷的游戏角色。它能移动、能行走、甚至能转身。但你可能注意到了角色的一些奇怪之处：它可以穿过树木。\n\n![](img/Image00308.jpg)\n\
  \n在本章中，我们将使用 Three.js 3D JavaScript 库内置的工具来防止角色穿树的效果。（正如我们将在其他章节中看到的，还有其他方法可以实现同样的目的。）\n\
  \n### 10.1 开始\n\n如果项目尚未在 ICE 代码编辑器中打开，请打开“项目：旋转我们的角色”中名为“我的角色：旋转”的项目。\n\n复制我们的角色项目。在\
  \ ICE 代码编辑器的菜单中，选择“制作副本”，并将新项目名称设为“我的角色：碰撞”。\n\n![](img/Image00309.jpg)\n\n### 10.2\
  \ 射线与相交\n\n我们防止角色穿过树木的方法其实很简单。想象一下从角色身上向下指着一支箭。\n\n\n\n\n![](img/Image00310.jpg)在几何学中，我们将箭头指向称为射线。射线就是从一个点出发并指向某个方向所得到的结果。在这里，这个点就是我们的虚拟角色所在的位置，而方向是向下。有时给这样简单的概念命名似乎有些愚蠢，但对程序员来说，了解这些名称很重要。程序员喜欢给简单的概念起花哨的名字。![](img/Image00311.jpg)了解简单概念的命名，能让你更容易与从事相同工作的人交流。程序员把这些名称称为模式。现在，我们有了指向下方的射线，想象一下地面上围绕树木的圆圈。![](img/Image00312.jpg)下面是我们防止虚拟角色撞上树木的极其简单的方法：我们并不阻止它！相反，我们阻止虚拟角色的射线穿过树木的圆圈。\n\
  \n## 射线与相交\n\n![](img/Image00313.jpg)如果在任何时候，我们发现下一步移动会导致虚拟角色的射线指向穿过圆圈，我们就阻止虚拟角色移动。仅此而已！《星际迷航\
  \ 2：可汗之怒》![](img/Image00314.jpg)这看起来可能有些奇怪，但观看某些科幻电影会让你的程序员生活更轻松。有时程序员会说出一些奇怪的话，结果发现是电影台词。并不要求你观看甚至喜欢这些电影，但这确实有帮助。其中一句经典台词来自《星际迷航\
  \ 2：可汗之怒》：“他很聪明，但缺乏经验。他的模式表明他是二维思维。”\n\n### 准备\n\n![](img/Image00315.jpg)电影中的反派不习惯三维思考，而这被用来对付他。在这里，尽管我们在构建一个三维游戏，但我们只想在二维空间中考虑碰撞。我们只考虑二维（X\
  \ 和 Z 轴）的碰撞，完全忽略上下方向的 Y 轴。这又是尽可能“作弊”的一个例子。真正的三维碰撞很难处理，需要新的 JavaScript 库。但我们可以通过更简单的技巧来作弊，并在许多情况下获得相同的效果。此时，你应该已经在脑海中形成了下一步该做什么的画面。我们需要一个列表，记录这些虚拟角色不允许进入的树木圆圈边界。我们需要在构建树木时构建这些圆圈边界，并检测虚拟角色何时即将进入圆圈边界。最后，我们需要阻止虚拟角色进入这些禁止区域。让我们建立保存所有禁止边界的列表。在`START\
  \ CODING ON THE NEXT LINE`行下方，添加以下代码。\n\n```\nvar not_allowed = [] ;\n```\n\n回忆一下第\
  \ 77 页的 7.5 节“列出事物”，方括号是 JavaScript 创建列表的方式。这里，空方括号创建了一个空列表。`not_allowed`变量是一个空列表，用于存储虚拟角色不允许进入的空间。接下来，找到`makeTreeAt()`的定义位置。当我们创建树木时，也要创建边界。在添加树冠到树干的那行代码之后，在设置树干位置的那行代码之前，添加以下代码。\n\
  \n```\nvar boundary = new THREE.Mesh( new THREE.CircleGeometry(300), new THREE.MeshNormalMaterial())\
  \ ;\nboundary.position.y = -100 ;\nboundary.rotation.x = - Math.PI/2;\ntrunk.add(boundary);\n\
  not_allowed.push(boundary);\n```\n\n这里没有什么特别花哨的东西。我们创建了一个普通的 3D 网格——这次使用简单的圆形几何体。我们旋转它使其平放，并将其定位在树木下方。当然，最后我们将其添加到树木中。但边界网格的处理还没完。最后，我们将其推入禁止空间列表。现在，每次我们使用`makeTreeAt()`函数创建树木时，都会构建这个列表。让我们对这个列表做点什么。在代码的最底部，`</script>`标签上方，添加以下代码来检测碰撞。\n\
  \n```\nfunction detectCollisions() {\n  var vector = new THREE.Vector3(0, -1, 0)\
  \ ;\n  var ray = new THREE.Ray(marker.position, vector);\n  var intersects = ray.intersectObjects(not_allowed);\n\
  \  if (intersects.length > 0) return true;\n  return false;\n}\n```\n\n这个函数返回一个布尔值——是或否的答案——取决于虚拟角色是否与边界发生碰撞。这就是我们创建射线来检查它是否穿过任何物体的地方。如前所述，射线是方向（或向量，这里指向下）和点（这里是虚拟角色的`marker.position`）的组合。然后我们询问该射线是否穿过（相交）任何`not_allowed`对象。如果射线确实与其中一个对象相交，那么`intersects`变量的长度将大于零。在这种情况下，我们检测到了碰撞，并返回`true`。否则，没有碰撞，返回`false`。在许多情况下，碰撞是一个棘手的问题，所以你能跟着做已经很棒了。但我们还没完成。我们现在可以检测虚拟角色何时与边界碰撞，但还没有真正阻止虚拟角色。让我们在`keydown`监听器中实现这一点。在`keydown`监听器中，如果按下了方向键，我们会改变虚拟角色的位置。\n\
  \n```\nif (code == 37) { // 左\n  marker.position.x = marker.position.x-5;\n  is_moving_left\
  \ = true;\n}\n```\n\n这样的改变可能意味着虚拟角色现在进入了边界。如果是这样，我们必须立即撤销移动。在`keydown`事件监听器的底部（紧接在`if\
  \ (code == 70)`之后）添加以下代码。\n\n```\nif (detectCollisions()) {\n  if (is_moving_left)\
  \ marker.position.x = marker.position.x+5;\n  if (is_moving_right) marker.position.x\
  \ = marker.position.x-5;\n  if (is_moving_forward) marker.position.z = marker.position.z+5;\n\
  \  if (is_moving_back) marker.position.z = marker.position.z-5;\n}\n```\n\n准备 仔细阅读这几行代码，确保你理解它们。这段代码的意思是：如果检测到碰撞，则检查我们移动的方向。如果正在向左移动，则撤销虚拟角色刚刚执行的移动——向相反方向移动相同的量。这样，我们的虚拟角色可以走到树木边界前，但无法再前进。\n\
  \n![](img/Image00316.jpg) 耶！这看起来可能是一段相当简单的代码，但你刚刚解决了游戏编程中一个非常困难的问题。\n\n## 10.3 到目前为止的代码\n\
  \n如果你想核对本章的代码，请参见第 230 页的附录 A1.10“代码：碰撞”。\n\n## 10.4 下一步是什么\n\n游戏中的碰撞检测是一个非常棘手的问题，所以恭喜你走到了这一步。当你还需要考虑上下移动，而不仅仅是左右、前后移动时，问题会变得更加困难。但概念是相同的。通常我们依赖其他人编写的代码库来帮助我们处理这些情况。在接下来我们将要尝试的一些游戏中，我们会使用这样的代码库。但首先，我们要为我们的虚拟角色游戏画上点睛之笔。在下一章中，我们将添加声音和计分。让我们开始吧！完成本章后，你将能够：\n\
  \n- 为游戏添加声音\n- 为游戏添加简单的计分\n- 拥有一个可以玩的简单游戏\n\n# 第 11 章 项目：水果狩猎\n\n我们有了虚拟角色，有了树木。让我们制作一个游戏，让虚拟角色从树木中获取东西。树木里藏着虚拟角色想要的美味水果。如果虚拟角色能及时拿到水果，计分板上就会增加分数。最终效果大致如下：\n\
  \n![](img/Image00317.jpg) 祝贺我们的游戏程序员同行 Sophie H.，她提出了本章使用的获胜游戏概念！\n\n### 11.1 开始\n\
  \n要制作这个游戏，我们需要本书中一直在使用的虚拟角色、树木和碰撞检测函数。在第 10 章“项目：碰撞”（第 93 页）之后，我们已经拥有了开始所需的一切。\n\
  \n\n\n\n准备工作已就绪，开始这个项目。让我们复制一份我们一直在做的项目。在 ICE 代码编辑器的菜单中，选择“制作副本”，并将新项目命名为“水果猎人！”。为了在这个游戏中记录分数，我们需要一个新东西——记分板。ICE\
  \ 代码编辑器中内置了一个相当不错的记分板，但我们需要先加载库。在第 9 章“那些其他代码是什么？”的第 85 页，我们了解了通过代码最顶部的 `<script>`\
  \ 标签加载的库。我们需要再添加一个。\n\n同样，为了在游戏中播放声音，我们需要声音库。所以，让我们在代码顶部添加第二个 `<script>` 标签。我们通过在页面顶部带有\
  \ `src` 属性的三个 `<script>` 标签之后另起一行来进行这些更改。新行应该在第 5 行。添加以下 `<script>` 标签以引入记分板和声音库：\n\
  \n```\n<script src=\"http://gamingJS.com/Scoreboard.js\" ></script> <script src=\"\
  http://gamingJS.com/Sounds.js\" ></script>\n```\n\n由于这只是我们程序的“入门”部分，这些行实际上不会改变游戏中的任何内容。要看到记分板，我们需要配置并启用它。接下来我们就这么做。\n\
  \n### 11.2 从零开始记分板\n\n本章的其余代码将放在“从下一行开始编码”这一行之下。为了给我们的游戏添加一个记分板，我们使用 `new` 关键字创建一个新的记分板。然后我们告诉记分板启动一个倒计时器，显示分数，并添加一条帮助信息。为了做到这些，我们首先在引入\
  \ `not_allowed` 变量的那一行之后输入以下代码：\n\n```\nvar scoreboard = new Scoreboard();\n\nscoreboard.countdown(45);\
  \ scoreboard.score();\n\nscoreboard.help('使用方向键移动。' +\n\n'按空格键跳向水果。' +\n\n'注意摇晃的树上有水果。'\
  \ +\n\n'靠近树并在水果消失前跳跃！') ;\n```\n\n这些行在我们的屏幕上添加了一个漂亮的记分板，包括游戏剩余时间（45 秒）、当前分数（零）以及一条提示，告诉玩家他们可以按问号（?）键获取帮助。\n\
  \n记分板应该如下所示：\n\n给树一点摇晃\n\n![](img/Image00318.jpg)\n\n在让游戏按照帮助文本所说的那样运行之前，我们需要教会游戏在时间耗尽时该做什么。为此，在所有记分板代码之后的那一行添加以下内容：\n\
  \n```\nvar game_over = false; scoreboard.onTimeExpired(function () {\n\nscoreboard.message(\"\
  游戏结束！\") ;\n\ngame_over = true;}) ;\n```\n\n这告诉记分板，当时间耗尽时，它应该运行一个函数，将记分板消息设置为“游戏结束！”，并且\
  \ `game_over` 变量应设置为 `true`。\n\n构建记分板就是这么简单。现在，让我们想办法让玩家为记分板增加分数。\n\n### 11.3 给树一点摇晃\n\
  \n这个游戏的目标是在树上找到水果，我们称之为宝藏。在任何给定时间，只有一棵树会有宝藏。为了显示是哪棵树，我们会让它稍微摇晃一下。但首先我们需要一个树的列表。\n\
  \n找到创建森林的代码——应该有四行不同的 `makeTree()` 调用。我们早在第 4 章“项目：移动化身”的第 35 页添加了这些代码。我们需要对将树添加到场景的代码部分做一点小改动。\n\
  \n我们首先添加两个变量。第一个是 `tree_with_treasure`，你可能已经猜到它将指向当前拥有宝藏的树。第二个变量是一个包含所有树的列表，我们称之为\
  \ `trees`。然后我们将构成森林的所有树推入这个列表。将你的四行 `makeTreeAt()` 代码改为以下内容：\n\n```\nvar tree_with_treasure;\
  \ var trees = []\n\n;\n\ntrees.push(makeTreeAt( 500, 0)) ; trees.push(makeTreeAt(-500,\
  \ 0)) ;\n准备工作\ntrees.push(makeTreeAt( 750, -1000)) ; trees.push(makeTreeAt(-750,\
  \ -1000)) ;\n```\n\n为了让这段代码生效，我们需要修改 `makeTreeAt()` 函数，使其返回一些东西。如果 `makeTreeAt()`\
  \ 不返回任何东西，那么我们将把空值推入树的列表。在 `makeTreeAt()` 函数的最底部，最后一个花括号之前添加以下行：\n\n```\nfunction\
  \ makeTreeAt(x, z) {\n\n// 不要更改开头的任何代码...\n\n// ... 但在末尾添加以下行： return top;\n\n}\n\
  ```\n\n这样，树顶（绿色的球/叶子）被返回并添加到树的列表中。我们本可以返回树干，甚至是我们在“项目：碰撞”中添加的碰撞边界。树顶是我们最需要处理的部分（因为宝藏将藏在那里），所以返回它以便将其推入树的列表是合理的。\n\
  \n现在我们有了树的列表，我们可以将宝藏藏在一棵树中并让它摇晃。在 `makeTreeAt()` 函数之后，添加以下函数和函数调用：\n\n```\nfunction\
  \ shakeTree() {\n\ntree_with_treasure = Math.floor(Math.random() * trees.length);new\
  \ TWEEN\n\n.Tween({x: 0})\n\n.to({x: 2*Math.PI}, 200)\n\n.repeat(20)\n\n.onUpdate(function\
  \ () { trees[tree_with_treasure].position.x = 75 * Math.sin(this.x); })\n\n.start();setTimeout(shakeTree,\
  \ 12*1000) ; } shakeTree();\n```\n\n我们将在第 20 章“项目：河流漂流”的第 185 页讨论 `Math.floor()`\
  \ 和 `Math.random()`。现在，我们只需知道 `shakeTree()` 中的第一行会随机选择一棵树。我们已经见过 Tween 库，它可以将事物从一个值移动到另一个值。在这里，我们再次沿着正弦曲线移动。正弦和余弦非常棒，因为当从\
  \ 0 移动到 360°（`2*Math.PI`）时，它们开始和结束于相同的值。我们使用正弦。当 Tween 的值从 0 移动到 `2*Math.PI` 时，`Math.sin()`\
  \ 的值从 0 到 1，然后回到 0，再到 -1，最后回到 0。换句话说，它非常适合让物体轻微摇晃。\n\n跳跃得分\n\n`shakeTree()` 的最后一部分设置了一个\
  \ 12 秒的超时。12 秒过后，这个超时会再次调用 `shakeTree()` 函数，并分配一棵新的带有宝藏的树。\n\n在这段代码之后，应该会有一棵不同的树不停地摇晃，告诉玩家有宝藏可以收集。让我们给化身一个获取宝藏的方式。\n\
  \n### 11.4 跳跃得分\n\n在这个游戏中，化身需要跳到当前有宝藏的树旁边。当这种情况发生时，我们要做两件事：化身将获得一些分数，并且我们会制作一个漂亮的宝藏动画并播放声音。\n\
  \n但首先我们需要一个触发跳跃的按键。我们通过在 `keydown()` 监听器中添加以下 `if` 语句来实现：\n\n```\nif (code == 32)\
  \ jump(); // 空格键\n```\n\n你可以将该 if 代码添加到控制化身转向的其他 `if` 语句之上。\n\n现在，我们添加 `jump()`\
  \ 函数，该函数由 case 语句调用。这个函数可以放在 `detectCollisions()` 函数之后。它检查宝藏并在屏幕上动画化跳跃：\n\n```\n\
  function jump() { checkForTreasure();\n\nanimateJump();\n\n}\n```\n\n为了检查化身是否足够接近以获取宝藏，在代码底部（最后一个\
  \ `<script/>` 标签之前）添加以下函数：\n\n```\nfunction checkForTreasure() {\n\nif (tree_with_treasure\
  \ == undefined) return ;\n\nvar treasure_tree = trees[tree_with_treasure], p1 =\n\
  \ntreasure_tree.parent.position, p2 = marker.position;var distance = Math.sqrt(\n\
  \n(p1.x - p2.x)*(p1.x - p2.x) +\n\n(p1.z - p2.z)*(p1.z - p2.z)准备工作\n\n) ;if (distance\
  \ < 500) { scorePoints();\n\n}\n\n}\n```\n\n`checkForTreasure()` 函数做了三件事：\n\n- 如果没有活动的树——如果它是\
  \ `undefined`，如“用 JavaScript 描述事物”中所述——则立即返回，不做任何其他操作。\n- 如果化身附近有一棵活动的树，那么 `checkForTreasure()`\
  \ 计算树与化身之间的距离。\n- 如果距离小于 500，则调用 `scorePoints()` 函数。\n\n![](img/Image00319.jpg)\n\
  \n勾股定理警告\n\n\n\n\n如果你已经学过一点三角学，你可能已经认出了 `checkForTreasure()` 函数中的勾股定理。我们用这个定理来计算两点之间的距离：角色和当前激活的树。\n\
  \n现在，我们先把 `scorePoints()` 函数写得非常简单。把它添加到 `checkForTreasure()` 函数之后。我们只用它来给记分板加分：\n\
  \n```\nfunction scorePoints() {\n  if (scoreboard.getTimeRemaining() === 0) return\
  \ ;\n  scoreboard.addPoints(10);\n}\n```\n\n一定要加上函数中的第一行；否则玩家在时间结束后还能得分！\n\n最后需要做的是让跳跃动起来，这样我们就能在屏幕上看到它。我们把之前见过的两个东西结合起来：补间动画和正弦函数。接下来添加\
  \ `animateJump()` 函数：\n\n```\nfunction animateJump() {\n  new TWEEN\n    .Tween({jump:\
  \ 0})\n    .to({jump: Math.PI}, 500)\n    .onUpdate(function () {\n      marker.position.y\
  \ = 200*Math.sin(this.jump);\n    })\n    .start();\n}\n```\n\n这样就完成了！如果你隐藏代码，现在就可以四处移动，找到激活的树，然后跳跃从树中获取宝藏。如果你动作够快，甚至可以在激活的树旁边多次跳跃来获得多个分数。\n\
  \n这已经是一个有趣的游戏了，但我们还可以做一些调整让它变得更好。\n\n# 11.5 让我们的游戏更出色\n\n在这本书中，我们花了很多时间给角色添加动画。这样做部分是为了理解像分组对象这样的重要概念，但也是因为\
  \ 3D 游戏程序员经常做这类工作。\n\n我们的角色并不需要像真实生活中那样有会动的手和脚，但这种动画有助于让游戏看起来更真实。在这个例子中，游戏玩法非常简单：在宝藏附近按空格键就能得分。\n\
  \n让游戏引人入胜、让玩家不断回来的，是趣味玩法与偶尔出现的真实感的结合。\n\n## 添加动画和音效\n\n添加多少调整取决于你——游戏程序员。但本章我们添加两个：当角色获取宝藏果实时，我们会看到动画并听到声音。给游戏添加声音是两者中较简单的，所以我们先处理它。\n\
  \n首先，在 `scorePoints()` 函数中添加 `Sounds.bubble.play()`：\n\n```\nfunction scorePoints()\
  \ {\n  if (scoreboard.getTimeRemaining() === 0) return ;\n  scoreboard.addPoints(10);\n\
  \  Sounds.bubble.play();\n}\n```\n\n你可以在第 277 页的 A2.5 节“Sounds.js”中找到关于 `Sounds.js`\
  \ 库的更多信息。这个库可供选择的音效数量相当少，但应该足够开始编写游戏了。\n\n添加这行代码后，当角色跳起来抓取宝藏果实时，我们就能得分并听到声音。但实际上我们并没有从树上得到任何金色果实。\n\
  \n为了给果实添加动画，我们需要把果实添加到角色的参考系中，然后对它进行补间。这个补间会和我们之前做过的有些不同，因为它要同时动画化两个东西：果实会升到角色上方并旋转。下面的代码可以添加到\
  \ `scorePoints()` 函数之后，实现所有这些效果：\n\n```\nvar fruit;\nfunction animateFruit() {\n\
  \  if (fruit) return ;\n  fruit = new THREE.Mesh(new THREE.CylinderGeometry(25,\
  \ 25, 5, 25) , new THREE.MeshBasicMaterial({color: 0xFFD700}) ) ;\n  fruit.rotation.x\
  \ = Math.PI/2;\n  marker.add(fruit);\n  new TWEEN.\n    Tween({ height: 150, spin:\
  \ 0 }).\n    to({height: 250 , spin: 4 }, 500).\n    onUpdate(function () {\n  \
  \    fruit.position.y = this.height;\n      fruit.rotation.z = this.spin;\n    }).\n\
  \    onComplete(function () {\n      marker.remove(fruit);\n      fruit = undefined;\n\
  \    }).\n    start();\n}\n```\n\n我们会在第 159 页的第 17 章“项目：学习 JavaScript 对象”中更详细地讨论花括号内的属性。现在，只需知道我们设置了两个不同的数字属性：果实的旋转和高度。旋转从零开始，在整个动画过程中旋转四次。果实还会在动画过程中从屏幕上的\
  \ 150 位置上升到 250 位置。\n\n当然，`animateFruit()` 函数需要被调用才能生效。在 `scorePoints()` 函数的底部添加对它的调用，使其看起来像这样：\n\
  \n```\nfunction scorePoints() {\n  if (scoreboard.getTimeRemaining() === 0) return\
  \ ;\n  scoreboard.addPoints(10);\n  Sounds.bubble.play();\n  animateFruit();\n}\n\
  ```\n\n结果是一个漂亮的动画，在角色收集果实时会播放。\n\n耶！得分！到目前为止的代码 ![](img/Image00320.jpg)\n\n## 我们还能添加什么？\n\
  \n这就是我们从第 25 页的第 3 章“项目：制作角色”开始从头构建的角色。但这并不意味着你不能让这个游戏变得更好！\n\n在这个游戏中，从树上摘取果实非常容易。也许你可以添加一个调整，让角色每棵树只能摘一个果实？或者，如果角色在树未激活、没有摆动时跳跃，可以惩罚玩家——比如\
  \ `subtractPoints()`。如果你觉得玩家移动得太快或太慢，也许可以在按键监听器中寻找改进的方法。你可以构建一个充满各种角落、缝隙和奖品的游戏。\n\
  \n这就是游戏设计师的工作，而你就是设计师。复制到目前为止的代码，看看你能添加什么，让游戏按照你想要的方式运行。你打算如何让这个游戏变得出色？\n\n# 11.6\
  \ 到目前为止的代码\n\n如果你想核对本章的代码，请翻到第 234 页的 A1.11 节“代码：水果猎人”。\n\n准备就绪\n\n# 11.7 下一步做什么\n\
  \n这可能是我们角色项目的终点，但还有很多事情要做。接下来，我们将探索 3D 编程中更多的小细节，从灯光、材质和阴影开始。\n\n完成本章后，你将学会：\n\n\
  * 理解如何制作不同的颜色\n* 能够使形状有光泽或难以看清\n* 知道如何在 3D 游戏中制作阴影\n\n# 第 12 章 使用灯光和材质\n\n在本章中，我们将介绍如何构建有趣的形状和材质，效果如下：\n\
  \n![](img/Image00321.jpg) ![](img/Image00322.jpg) 回到\n\n![](img/Image00323.jpg)\
  \ 第 1 章，\n\n![](img/Image00324.jpg) 项目：创建简单形状\n\n![](img/Image00325.jpg) ，第 1 页\n\
  \n![](img/Image00326.jpg)，我们讨论了![](img/Image00327.jpg)3D 库中的形状。这里我们将讨论这些形状的不同“外皮”。要学习外皮，就不能不学习灯光。即使在现实世界中，材质和灯光也是相辅相成的。如果材质有光泽，就意味着它能更好地反射光线。如果材质暗淡无光，那么可能需要非常明亮的光线才能看到它。\n\
  \n我们到目前为止使用的 `MeshNormalMaterial` 在最初构建游戏时很有帮助，但对于真正的游戏来说并不是一个好选择。它无法控制颜色、光泽度或任何其他属性。让我们看看几种可以改变这一点的材质。\n\
  \n### 12.1 开始\n\n在 ICE 中启动一个新项目。从菜单中选择 3D 入门项目模板，然后将其保存为“灯光和材质”。\n\n### 12.2 改变颜色\n\
  \n在“START CODING ON THE NEXT LINE”下方添加以下代码：\n\n准备就绪\n\n```\nvar shape = new THREE.SphereGeometry(100);\n\
  var cover = new THREE.MeshBasicMaterial();\ncover.color.setRGB(1, 0, 0) ;\nvar ball\
  \ = new THREE.Mesh(shape, cover);\nscene.add(ball);\n```\n\n### MeshBasicMaterial\n\
  \n注意，我们现在使用的是 `MeshBasicMaterial`，而不是之前用来包裹物体的 `MeshNormalMaterial`。由于这是一种基础材质，我们能做的并不多。但我们可以改变颜色，这是新的功能。\n\
  \n你应该会在屏幕上看到一个红色的球：\n\n![](img/Image00329.jpg) ![](img/Image00330.jpg) 计算机程序中的颜色用\n\
  \n![](img/Image00331.jpg) RGB 数字表示\n\n\n\n\n\n![](img/Image00332.jpg)，它描述了![](img/Image00333.jpg)红色（R）、绿色（G）和蓝色（B）的使用量。信不信由你，通过组合这三种颜色，你几乎可以调出所有颜色。组合\
  \ RGB 颜色可能并不像你想象的那样——例如，通过混合红色和绿色可以得到黄色：`cover.color.setRGB(1,1,0)`。![](img/Image00334.jpg)维基百科有一个非常详细的颜色列表\n\
  \n维基百科列表位于 `http://en.wikipedia.org/wiki/List_of_colors`，其中包含 RGB 百分比，你需要将其写成小数形式。例如，该列表中的第一种颜色是“英国皇家空军蓝”，其\
  \ RGB 百分比为：36%、54%、66%。要让我们的球体变成这种颜色，可以使用以下代码：`cover.color.setRGB(0.36, 0.54, 0.66)`。这种基础材质在实际游戏中比我们之前使用的\
  \ `MeshNormalMaterial` 更有用一些。它特别适合用于背景和平坦表面。即便如此，它也不是我们能选择的最逼真的材质。无论什么光照，颜色看起来都一样。它不会反射光线，也不会产生阴影。话虽如此，尽可能使用它——因为计算机绘制起来很容易。现在让我们来看一种更有趣的材质。但首先，把红色的基础球体移开：`ball.position.set(500,\
  \ 0, 0)`；\n\n### 12.3 真实感：光泽度\n\n我们首先要做的是切换渲染器。我们在第 9 章“其他代码都是什么？”（第 85 页）中讨论过渲染器。请记住，渲染器是在计算机屏幕上绘制游戏的东西。我们在那一章简要讨论了不同类型的渲染器。现在我们要使用它们。我们一直使用的\
  \ `CanvasRenderer` 在大多数计算机上都能工作，但无法实现我们游戏中可能想要的一些酷炫效果。这在你的计算机上可能无法工作！！![](img/Image00335.jpg)要实现真实感，你的计算机必须支持\
  \ WebGL。如果你的计算机不支持 WebGL，那么你应该只阅读本章剩余部分，但不要输入任何代码，![](img/Image00336.jpg)因为代码无法运行。能够看到这些效果固然好，但对于我们大多数游戏来说并非必需。判断你的计算机和浏览器是否支持\
  \ WebGL 的最简单方法是访问 `http://get.webgl.org/`。如果你在该页面上看到一个旋转的立方体，那么你的计算机支持 WebGL。要切换到\
  \ `WebGLRenderer`，找到渲染器代码（大约在第 15 行附近），将 `CanvasRenderer` 改为 `WebGLRenderer`，使代码看起来像这样：\n\
  \n```\n// 这将把相机看到的内容绘制到屏幕上：\nvar renderer = new THREE.WebGLRenderer();\n```\n\n\
  如果你仍然能看到右侧的球体，那么一切正常，你的计算机支持 WebGL。如果没有，请切换回 `CanvasRenderer`，并阅读本章内容，但不要进行上述修改。在球体代码下方，让我们用\
  \ Phong 材质创建一个甜甜圈：\n\n```\nvar shape = new THREE.TorusGeometry(100, 50, 8, 20) ;\n\
  var cover = new THREE.MeshPhongMaterial();\ncover.emissive.setRGB(0.8, 0.1, 0.1)\
  \ ;\nvar donut = new THREE.Mesh(shape, cover);\nscene.add(donut);\n```\n\n如果你操作正确，你应该会看到一个非常暗淡的红色甜甜圈。你可能会想：“就这样？”嗯，当然不是！缺少的是光。在现实生活中，当某物有光泽时，意味着光线——阳光、手电筒等——会从它上面明亮地反射出来。在电脑游戏中也是如此。所以让我们添加一个光源。在甜甜圈代码下方，添加一些阳光：\n\
  \nPrepared\n\n```\nvar sunlight = new THREE.DirectionalLight();\nsunlight.intensity\
  \ = 0.5 ;\nsunlight.position.set(100, 100, 100) ;\nscene.add(sunlight);\n```\n\n\
  我们将阳光定位在甜甜圈的右侧、上方和前方。结果应该是一个看起来很酷的甜甜圈：\n\n![](img/Image00337.jpg)\n\n### 自发光\n\n\
  与 `MeshBasicMaterial` 封面不同——我们调整了 `color` 属性——对于 `MeshPhongMaterial`，我们调整 `emissive`\
  \ 属性来描述颜色：`cover.emissive.setRGB(0.8, 0.1, 0.1)`；我们不能直接使用 `color`，因为在使用 `MeshPhongMaterial`\
  \ 时，我们需要调整多个与颜色相关的属性。`emissive` 属性描述了封面“发射”的颜色——即它本身的颜色。\n\n### 高光\n\n`Specular`\
  \ 是我们可以调整的另一个颜色属性。`specular` 属性描述了物体高光部分的颜色。如果我们不设置这个值，它就不会很亮。让我们让它变亮。在设置 `emissive`\
  \ 颜色的那一行下面添加 `specular` 行：\n\n```\nvar shape = new THREE.TorusGeometry(100, 50,\
  \ 8, 20) ;\nvar cover = new THREE.MeshPhongMaterial();\ncover.emissive.setRGB(0.8,\
  \ 0.1, 0.1) ;\ncover.specular.setRGB(0.9, 0.9, 0.9) ;\nvar donut = new THREE.Mesh(shape,\
  \ cover);\nscene.add(donut);\n```\n\n如果所有 RGB 值都相同，那么我们会看到黑色、白色或某种灰色。全零是黑色。全一是白色。介于两者之间的是灰色。在这种情况下，我们将\
  \ `specular` 颜色——高光的颜色——设置为三个 0.9 的值，这非常接近全 1.0 的白色。换句话说，我们看到的高光更多一些：\n\n![](img/Image00338.jpg)\
  \ ![](img/Image00339.jpg) 始终使用灰色或白色作为高光颜色\n\n![](img/Image00340.jpg) 你可以为 `specular`\
  \ 属性使用任何你喜欢的颜色。![](img/Image00341.jpg) 但通常最好坚持使用灰色或白色。例如，![](img/Image00342.jpg)\
  \ 我们照在甜甜圈上的阳光是白色的，但依然可以将 `specular` 颜色设为黄色（将最后一个数字改为 0.0）。![](img/Image00343.jpg)\
  \ 但这很奇怪——白光产生黄色高光。![](img/Image00344.jpg) 我们已经介绍了 `emissive` 和 `specular`；还有另外两个与颜色相关的属性可以在\
  \ Phong 材质上设置：`ambient` 和普通的 `color`。`ambient` 颜色仅在使用“环境光”时适用——一种无处不在的光。`color`\
  \ 属性仅在附近没有强光时使用。在本书中，我们将坚持使用 `emissive` 和 `specular`——它们能制作出更酷的物体。\n\n### 12.4 阴影\n\
  \n我们给甜甜圈打上了光，但还没有阴影。通常你可以跳过渲染阴影，但有时它们确实很有用。\n\n![](img/Image00356.jpg)不要过度使用阴影\n\
  \n计算机绘制阴影需要大量工作，所以只在确实需要的地方使用它们。这是一个艰难的选择，因为阴影几乎总是能让游戏看起来更好。但正如我们将看到的，它会让计算机在主要游戏之外的其他事情上更费力，而且正确设置起来也有点麻烦。首先，我们需要告诉渲染器要处理阴影。在\
  \ WebGL 渲染器行下方添加设置 `shadowMapEnabled` 属性的行：\n\n```\n// 这将把相机看到的内容绘制到屏幕上：\nvar renderer\
  \ = new THREE.WebGLRenderer();\nrenderer.shadowMapEnabled = true;\n```\n\n这似乎已经足够了——我们告诉渲染器它应该绘制阴影，它应该处理其他所有事情。但阴影需要计算机做大量工作。如果每个光源都产生阴影，每个物体都投射阴影，每个物体都能接收阴影……那么计算机将把所有能力都用于绘制阴影，而没有剩余能力让用户真正玩游戏。下一步是将甜甜圈标记为产生阴影。为此，我们在将甜甜圈添加到场景后设置\
  \ `castShadow` 属性。在 `scene.add(donut)` 之后添加 `donut.castShadow` 行：\n\n```\nvar shape\
  \ = new THREE.TorusGeometry(100, 50, 8, 20) ;\nvar cover = new THREE.MeshPhongMaterial();\n\
  cover.emissive.setRGB(0.8, 0.1, 0.1) ;\ncover.specular.setRGB(0.9, 0.9, 0.9) ;\n\
  var donut = new THREE.Mesh(shape, cover);\n```\n\n\n\n\n\n`scene.add(donut); donut.castShadow\
  \ = true;`\n\n现在，通过设置 `sunlight` 上的 `castShadow` 属性，告诉阳光它也能产生阴影。同样，在 `scene.add(sunlight)`\
  \ 之后添加 `sunlight.castShadow = true;` 这一行：\n\n```\nvar sunlight = new THREE.DirectionalLight();\n\
  sunlight.intensity = 0.5;\nsunlight.position.set(100, 100, 100);\nscene.add(sunlight);\n\
  sunlight.castShadow = true;\n```\n\n最后，我们需要一个让阴影投射的地方。在现实生活中，我们会在建筑物或地面上看到阴影。让我们在甜甜圈下方创建一些地面，让阴影投射在上面：\n\
  \n```\nvar shape = new THREE.PlaneGeometry(1000, 1000);\nvar cover = new THREE.MeshBasicMaterial();\n\
  var ground = new THREE.Mesh(shape, cover);\nscene.add(ground);\nground.position.set(0,\
  \ -200, 0);\nground.rotation.set(-Math.PI/2, 0, 0);\nground.receiveShadow = true;\n\
  ```\n\n注意，这里我们使用了平面和基础材质。始终使用你能用到的最简单的对象。\n\n这样，你应该能看到我们炫酷的甜甜圈正在投射阴影：\n\n![](img/Image00357.jpg)\
  \ ![](img/Image00358.jpg)\n\n### 12.5 让我们开始动画！\n\n![](img/Image00359.jpg)\n\n这一切都很酷，但你知道比一个闪闪发光并投射阴影的甜甜圈更酷的是什么吗？一个闪闪发光、投射阴影并且旋转的甜甜圈！\n\
  \n替换代码底部的 `renderer.render()`：\n\n```\nvar clock = new THREE.Clock();\nfunction\
  \ animate() {\n    requestAnimationFrame(animate);\n    var time = clock.getElapsedTime();\n\
  \    donut.rotation.set(time, 2*time, 0);\n    renderer.render(scene, camera);\n\
  }\nanimate();\n```\n\n我们之前见过很多这样的代码，但现在正是解释它的好时机。我们的 3D 库提供了 `clock`。它对于了解动画开始以来经过了多少时间非常有用。这个“经过的时间”对于各种动画效果都非常有用。\n\
  \n在这段代码中，我们用它来设置甜甜圈绕 x 轴和 y 轴的旋转。随着时间一秒秒流逝，甜甜圈的旋转角度将从 0 到 0.5，再到 1，最终达到 2 × π（一整圈）。然后它会继续旋转，再转一圈到\
  \ 4 × π，再到 6 × π，如此循环往复（直到计算机无法再数那么大的数为止）。我们让 y 轴的旋转速度是 x 轴的两倍，从而产生一种疯狂、摇晃的运动。\n\
  \n用秒数来表示旋转量有点奇怪。但话说回来，它们都只是数字。`clock.getElapsedTime()` 调用返回的是秒数，而我们用这个数字来表示甜甜圈旋转的弧度数。\n\
  \n`animate()` 函数中另一个有趣的地方是 `requestAnimationFrame()`。这是现代网络浏览器内置的一个函数，它们非常擅长判断绘制画面的最佳时机。通过使用\
  \ `requestAnimationFrame()` 函数，我们可以获得非常流畅的动画。\n\n`requestAnimationFrame()` 真正有趣的地方在于，我们给它传递了另一个函数——就是当前正在运行的\
  \ `animate()` 函数本身。我们没有在 `animate` 后面加括号，因为那样会立即调用 `animate()` 函数。通过给 `requestAnimationFrame()`\
  \ 一个对 `animate()` 的引用，我们告诉浏览器：下次它准备好进行绘制时（这应该在几毫秒后），它应该再次调用这个 `animate` 函数。\n\n\
  就这样，你凭空创造了一个甜甜圈，并让它疯狂旋转起来。![](img/Image00360.jpg) 这有多酷？\n\n![](img/Image00361.jpg)\n\
  \n### 12.6 到目前为止的代码\n\n如果你想核对本章的代码，请翻到第 240 页的附录 A1.12，代码：使用灯光和材质。\n\n### 12.7 接下来是什么\n\
  \n灯光和材质是高级主题，我们只是触及了可能性的表面。有很多设置需要大量练习才能适应。仅仅用红、绿、蓝值来设置颜色一开始就有点奇怪。但这并不是它们成为高级主题的原因。灯光和材质非常酷，但你必须意识到，你不应该总是使用它们。在任何编程中，这都是一条重要的经验，不仅仅是\
  \ JavaScript 游戏开发：能做的事不代表应该做。世界上最优秀的程序员都深知这条规则。现在，你也知道了！\n\n让我们在下一章中好好运用我们新学的灯光技能，构建一个太阳系模拟。\n\
  \n当你完成本章后，你将能够：\n\n- 知道如何让物体做圆周运动\n- 理解如何制作太阳光源\n- 能够在同一场景中切换两个摄像机\n- 理解一个人类花了数千年才解开的谜团\n\
  \n## 第 13 章 项目：构建你自己的太阳系\n\n让我们暂时放下我们的虚拟角色，来做一些不同但同样酷的事情：让太阳系动起来。最终效果如下：\n\n![](img/Image00362.jpg)\n\
  \n不，这不是一个游戏，但它仍然很有趣。\n\n### 13.1 开始\n\n在 ICE 中新建一个项目。选择 3D 入门项目模板，并将此项目命名为 `Planets`。\n\
  \n### 13.2 太阳、地球和火星\n\n既然我们在处理太空，我们需要调整常规的摄像机并切换渲染器。我们对 `START CODING ON THE NEXT\
  \ LINE` 上方的代码进行这些修改。\n\n创建摄像机，使其能看到最远 `1e6` 的距离，这是 1 后面跟六个零（即 1,000,000）的简写。同时，将摄像机从屏幕中心移开\
  \ 1000 个单位。\n\n```\n// 这是用来观察物体的：\nvar aspect_ratio = window.innerWidth / window.innerHeight;\n\
  var camera = new THREE.PerspectiveCamera(75, aspect_ratio, 1, 1e6);\ncamera.position.z\
  \ = 1000;\nscene.add(camera);\n```\n\n我们要做的另一个更改是切换到 `WebGLRenderer`，就像我们在第 12 章“使用灯光和材质”（第\
  \ 109 页）中所做的那样。\n\n```\n// 这将把摄像机看到的内容绘制到屏幕上：\nvar renderer = new THREE.WebGLRenderer();\n\
  renderer.setSize(window.innerWidth, window.innerHeight);\ndocument.body.appendChild(renderer.domElement);\n\
  ```\n\n![](img/Image00363.jpg)\n\n**如果 WebGLRenderer 在你的电脑上无法工作**\n\n如果你在第 12 章“使用灯光和材质”（第\
  \ 109 页）测试时，`WebGLRenderer` 在你的电脑上无法工作，你仍然可以完成本章的大部分内容。你需要在这里保留 `CanvasRenderer`。在下面的代码中，将\
  \ `MeshPhongMaterial` 引用替换为 `MeshBasicMaterial`。模拟效果不会那么酷——而且你无法完成最后一部分——但大部分内容仍然可以工作。\n\
  \n现在，我们在 `START CODING ON THE NEXT LINE` 之后开始编码。首先，让我们为太空模拟做一件重要的事：让太空变成黑色。\n\n\
  ```\ndocument.body.style.backgroundColor = 'black';\n```\n\n现在，将太阳添加到我们的模拟中。\n\n\
  ```\nvar surface = new THREE.MeshPhongMaterial({ambient: 0xFFD700});\nvar star =\
  \ new THREE.SphereGeometry(50, 28, 21);\nvar sun = new THREE.Mesh(star, surface);\n\
  scene.add(sun);\n\nvar ambient = new THREE.AmbientLight(0xffffff);\nscene.add(ambient);\n\
  \nvar sunlight = new THREE.PointLight(0xffffff, 5, 1000);\nsun.add(sunlight);\n\
  ```\n\n太阳的颜色是金色，取自 http://en.wikipedia.org/wiki/List_of_colors（回忆一下，在创建 JavaScript\
  \ 颜色时，我们将该页面上的 `#` 替换为 `0x`）。我们将其设为环境色，因为不会有其他光照在太阳上。这是它仅仅因为存在而获得的颜色。\n\n为了使环境色生效，我们需要添加一个环境光，我们已经添加了。为了让太阳照亮我们太阳系中的行星，我们需要在太阳中心添加一个点光源。点光源从一个点向所有方向发光，就像真正的太阳一样。\n\
  \n\n\n\n那么，我们来创建行星，并将它们放置在离太阳稍远的位置（显然不是按比例！）。\n\n```\nvar surface = new THREE.MeshPhongMaterial({ambient:\
  \ 0x1a1a1a, color: 0x0000cd});\nvar planet = new THREE.SphereGeometry(20, 20, 15);\n\
  var earth = new THREE.Mesh(planet, surface);\nearth.position.set(250, 0, 0);\nscene.add(earth);\n\
  \nvar surface = new THREE.MeshPhongMaterial({ambient: 0x1a1a1a, color: 0xb22222});\n\
  var planet = new THREE.SphereGeometry(20, 20, 15);\nvar mars = new THREE.Mesh(planet,\
  \ surface);\nmars.position.set(500, 0, 0);\nscene.add(mars);\n```\n\n这样我们就得到了太阳、地球和火星。到目前为止，它们还不会动。让我们通过将最后一行代码从单次渲染改为\
  \ `animate()` 函数来解决这个问题。\n\n```\nclock = new THREE.Clock();\n\nfunction animate()\
  \ {\n    requestAnimationFrame(animate);\n    var time = clock.getElapsedTime();\n\
  \    var e_angle = time * 0.8;\n    earth.position.set(250 * Math.cos(e_angle),\
  \ 250 * Math.sin(e_angle), 0);\n    var m_angle = time * 0.3;\n    mars.position.set(500\
  \ * Math.cos(m_angle), 500 * Math.sin(m_angle), 0);\n    // 现在，在屏幕上显示相机看到的内容：\n\
  \    renderer.render(scene, camera);\n}\nanimate();\n```\n\n我们之前在第 6 章“项目：移动手脚”（第\
  \ 59 页）中已经使用过 3D 时钟计时器，当时我们想让角色的手脚来回摆动。为了让手脚来回摆动，我们没有使用 JavaScript——而是用了数学。具体来说，我们用了正弦函数。对于我们的行星，我们再次使用了正弦函数，但还使用了一个新函数——余弦函数。\n\
  \n如果我们只使用正弦函数，行星就会像角色的手脚一样来回穿过太阳。但我们希望行星也能上下移动。这就是余弦函数的作用。当正弦函数让行星穿过太阳时，余弦函数会将其推向另一个方向。随着时间的推移，这就形成了一个完美的圆形。\n\
  \n这样一来，我们的行星就能绕着太阳运行了！在现实生活中，行星并不是以完美的圆形轨道运行的，但这仍然很酷，对吧？\n\n准备\n\n我们的太空模拟还缺少一样东西：星星。要制作星星，我们将使用粒子系统。在添加粒子系统时请小心，使用以下代码（注意后面的警告）。\n\
  \n```\nvar stars = new THREE.Geometry();\nwhile (stars.vertices.length < 1e4) {\n\
  \    var lat = Math.PI * Math.random() - Math.PI / 2;\n    var lon = 2 * Math.PI\
  \ * Math.random();\n    stars.vertices.push(new THREE.Vector3(\n        1e5 * Math.cos(lon)\
  \ * Math.cos(lat),\n        1e5 * Math.sin(lon) * Math.cos(lat),\n        1e5 *\
  \ Math.sin(lat)\n    ));\n}\nvar star_stuff = new THREE.ParticleBasicMaterial({size:\
  \ 500});\nvar star_system = new THREE.ParticleSystem(stars, star_stuff);\nscene.add(star_system);\n\
  ```\n\n在 ICE 中添加`while`语句时要小心\n\n![](img/Image00364.jpg) ![](img/Image00365.jpg)\
  \ ![](img/Image00366.jpg)\n\n`while`语句会一直运行，直到有东西阻止它。如果没有东西阻止它，浏览器就会卡死。当这种情况发生在\
  \ ICE 中时，你唯一的选择就是切换到仅编辑模式（参见“当 ICE 崩溃时如何恢复”）。\n\n为了防止卡死，你可以先注释掉`while`语句，直到你输入完整个代码块。也就是说，你可以在`while`前面加上双斜杠进行注释，然后输入代码块中的其他所有内容。之后再回去删除双斜杠，就能在屏幕上看到`while`语句的结果了。\n\
  \n我们不会过多关注粒子系统的细节。本质上，粒子系统是一种在不给计算机带来很大负担的情况下，向模拟中添加大量对象的方法。在这里，我们向场景中添加了大量星星。\n\
  \n地球摄像头！\n\n![](img/Image00368.jpg)\n\n## 13.3 地球摄像头！\n\n让我们添加从地球观察火星的能力。当你从地球观察火星几个月时，火星在天空中的位置会以一种相当奇怪的方式变化。这种变化如此奇怪，以至于古代天文学家无法解释它。但我们可以。\n\
  \n要从地球观察火星，除了俯视太阳系的相机外，我们还需要另一个相机。所以我们要做的第一件事就是给我们的太阳系俯视相机起一个更好的名字。我们叫它 `above_cam`。将代码顶部的\
  \ `camera` 改为 `above_cam`：\n\n```\n// 这是用来观察物体的相机：\nvar aspect_ratio = window.innerWidth\
  \ / window.innerHeight;\nvar above_cam = new THREE.PerspectiveCamera(75, aspect_ratio,\
  \ 1, 1e6);\nabove_cam.position.z = 1000;\nscene.add(above_cam);\n```\n\n接下来，我们添加一个名为\
  \ `earth_cam` 的新相机。\n\n```\nvar earth_cam = new THREE.PerspectiveCamera(75, aspect_ratio,\
  \ 1, 1e6);\nscene.add(earth_cam);\n```\n\n我们代码的其余部分期望有一个名为 `camera` 的相机，所以我们就给它一个。首先，让\
  \ `camera` 与 `above_cam` 指向同一个对象。\n\n```\nvar camera = above_cam;\n```\n\n接下来，我们需要将\
  \ `earth_cam` 添加到地球上，并旋转它使其指向火星。我们在 `animate()` 函数内部完成这个操作。在设置火星位置的那一行之后、`renderer.render`\
  \ 那一行之前，添加以下代码。\n\n准备\n\n```\nvar y_diff = mars.position.y - earth.position.y,\n\
  \    x_diff = mars.position.x - earth.position.x,\n    angle = Math.atan2(x_diff,\
  \ y_diff);\n\nearth_cam.rotation.set(Math.PI / 2, -angle, 0);\nearth_cam.position.set(earth.position.x,\
  \ earth.position.y, 22);\n```\n\n如果你知道两个物体的 X 和 Y 坐标之差，你就可以再次使用数学来计算它们之间的旋转角度。这就是我们使用\
  \ `x_diff` 和 `y_diff` 变量所做的——我们计算火星和地球的 X、Y 位置相差多少。而 `Math.atan2()` 函数则告诉我们这个角度。\n\
  \n![](img/Image00369.jpg)\n\n用一个`var`声明多个变量\n\n你可能注意到了，在前面的代码中，我们只使用了一个 `var` 关键字来构建变量列表。JavaScript\
  \ 程序员通常认为这是一种将一组相关变量组合在一起的好方法——在这里，就是两个点以及它们之间的角度。在函数开头这样做尤其常见。\n\n一旦我们知道了旋转角度，就可以将相机放置在地球的位置，然后旋转它使其面向火星。\n\
  \n最后，我们需要添加使用键盘在两个相机之间切换的功能。我们用 A 键切换到 `above_cam`，用 E 键切换到 `earth_cam`。A 的计算机代码是\
  \ 65，E 的计算机代码是 69。因此，在代码的最底部，结束的 `<script>` 标签之前，添加以下事件监听器。\n\n```\ndocument.addEventListener(\"\
  keydown\", function(event) {\n    var code = event.keyCode;\n    if (code == 65)\
  \ { // A\n        camera = above_cam;\n    }\n    if (code == 69) { // E\n     \
  \   camera = earth_cam;\n    }\n});\n```\n\n这样就完成了！现在，如果你隐藏代码，你应该能够在“地球摄像头”和“太阳系俯视摄像头”之间来回切换。从\n\
  \n\n\n\n\n# 迄今为止的代码\n\n地球，你应该注意到一些奇怪的现象（但不幸的是，只有当你使用 WebGL 渲染器时才能看到）。火星通常看起来会随着时间的推移向左移动。但时不时地，它会停下来，似乎还会向后移动一小段时间。\n\
  \n如果你走到户外，连续几个月观察火星在天空中的位置，你会看到同样的现象。古代天文学家称这种现象为“逆行运动”。因为他们认为地球是宇宙的中心，所以无法很好地解释为什么会出现逆行运动。哦，他们中的一些人想出了疯狂的解释，但都不像我们刚刚模拟的这么简单。\n\
  \n但我们现在知道是怎么回事了，不是吗？如果你在火星刚开始向后移动时切换到 `above_cam`，你会看到当地球追上火星并超过它时，就会发生逆行运动。这有点像一辆快车超过一辆慢车——慢车（火星）看起来几乎像是在向后移动。\n\
  \n你只用了不到一百行 JavaScript 代码就解决了一个几千年来世界上最聪明的人都无法解决的问题。太棒了！\n\n## 13.4 迄今为止的代码\n\n\
  如果你想核对本章中的代码，请参考第 241 页的附录 A1.13《代码：构建你自己的太阳系》。\n\n## 13.5 接下来是什么\n\n我们在这里看到了一个相当令人惊叹的太阳系视图，对于一个快速、单章的项目来说，这已经很不错了！你不仅解开了一个困扰伟大头脑的谜团，还在此过程中学到了一些关于\
  \ 3D 编程的非常有用的知识。你现在知道了如何让物体做圆周运动。更酷的是，你可以向 3D 场景中添加多个摄像机，移动摄像机，并在它们之间来回切换。\n\n我们将在下一章中基于这个项目做一些每个\
  \ 3D 程序员迟早都要做的事情：模拟月球绕地球公转时的相位变化。\n\n### 准备\n\n当你完成本章后，你将：\n\n- 了解 3D 程序员虚拟工具箱中最重要的技巧\n\
  - 掌握对现有代码进行重大修改的策略\n- 比大多数人（但可能不如《玩具总动员》的动画师）更了解月相\n\n# 第 14 章 项目：月相\n\n逆行运动那一章相当精彩，但本章我们将涵盖每个\
  \ 3D 程序员都必须学习的内容：如何可视化月球及其相位。最终效果会像这样：\n\n![](img/Image00370.jpg)\n\n为什么模拟月相很重要？首先，这是一个足够简单的问题——太阳照射在月球上，而月球绕地球公转——这让我们能够运用关于光照和材质的知识。它还能让我们运用之前练习过的相对定位技巧，就像我们处理虚拟角色的手和脚那样。\n\
  \n如果你仍然觉得这不重要，那就去看看《玩具总动员》吧。这是第一部全电脑动画长片，背后的程序员们确保他们做对了——当伍迪和巴斯被安迪留在加油站后争吵时，背景中可以看到一弯娥眉月。如果这对那些电影制作人来说足够重要，那对我们来说也足够重要！\n\
  \n### 14.1 开始\n\n本章我们将做一些不同的事情。与其从头开始，不如复制一份我们的火星项目。在 ICE 代码编辑器的菜单中，选择“制作副本”。\n\n\
  准备\n\n![](img/Image00371.jpg)\n\n在出现的常规项目对话框中，将这个项目命名为“月相”。\n\n### 14.2 将火星变成月球\n\
  \n我们需要做的第一件事是将所有 `mars` 的实例重命名为 `moon`。先做这件事，并确保没有留下任何 `mars` 变量（应该有六处改动）。\n\n完成之后，你仍然会有一颗红色行星绕太阳公转。仅仅改名并不会改变它的外观或行为——我们需要修改代码才能实现这一点。\n\
  \n这是重要的第一步。我们没有试图一次性改变所有东西，只是改了代码中一个东西的名字。当一切行为与之前一致时，我们就可以进行下一步了。永远不要试图一次性改变所有东西——你几乎总会搞砸一切。第一步中最糟糕的情况可能是动画消失了，因为我们漏掉了某个地方的\
  \ `mars`，但这很容易发现和修正。小步前进总是赢家。\n\n接下来，让我们改变月球的外观。将月球的颜色属性改为全白：`0xffffff`。我们还应该让月球比地球小一点，同时让它不那么粗糙。大小应为\
  \ 15，垂直分段数为 30，水平分段数为 25。\n\n```\nvar surface = new THREE.MeshPhongMaterial({ambient:\
  \ 0x1a1a1a, color: 0xffffff});\nvar planet = new THREE.SphereGeometry(15, 30, 25);\n\
  var moon = new THREE.Mesh(planet, surface);\n```\n\n### 14.3 最酷的技巧：参考系\n\n接下来，我们需要让月球的行为更像月球。它不应该绕太阳公转，而应该绕地球公转。因此，删除设置月球位置的代码行，并将其添加到场景中。由于月球不再添加到场景中，它会消失——这没关系。我们马上会把它加回来。\n\
  \n但首先，让我们移除让月球移动的代码。在 `animate()` 函数的花括号内，删除计算 `y_diff`、`x_diff` 和 `angle` 的代码行。同时删除设置\
  \ `earth_cam` 旋转和位置的两行代码。\n\n最后，删除用正弦和余弦设置月球位置的那一行，也就是 `var m_angle` 下面那一行。我们仍然需要为地球做这些，但我们将尝试一些新的方法来移动月球。\n\
  \n现在我们已经移除了所有让月球表现得像火星的代码，接下来准备让它做月球该做的事——主要是绕地球公转。为了实现这一点，我们将采用一个非常巧妙的方法。\n\n###\
  \ 最酷的技巧：参考系\n\n在创建月球之后，我们创建月球的轨道，它只是一个空的 3D 对象——类似于我们在第 3 章《项目：制作虚拟角色》（第 25 页）中所做的。然后我们将轨道添加到地球上：\n\
  \n```\nvar moon_orbit = new THREE.Object3D();\nearth.add(moon_orbit);\n```\n\n像这样将\
  \ `moon_orbit` 添加到地球上，意味着它以地球为中心。而且，无论地球走到哪里，这个 `moon_orbit` 对象都会与地球保持在一起。\n\n这可能看起来没什么，但这是\
  \ 3D 编程中一个极其重要的技巧。事实上，它如此重要，以至于有一个花哨的名字：参考系。我们的 `moon_orbit` 就是一个新的参考系。为了展示参考系思维的威力，我们将月球添加到\
  \ `moon_orbit` 中，并将其移动 100 个单位远离中心：\n\n```\nmoon_orbit.add(moon);\nmoon.position.set(0,\
  \ 100, 0);\n```\n\n这样，我们应该再次看到月球，只不过现在它紧挨着地球，随着地球绕太阳公转。\n\n由于 `moon_orbit` 参考系始终以地球为中心，月球现在始终距离地球\
  \ 100 个单位。我们还需要让月球绕地球公转。我们将地球的摄像机添加到 `moon_orbit` 参考系中，并旋转它使其面向月球：\n\n```\nmoon_orbit.add(earth_cam);\n\
  earth_cam.rotation.set(Math.PI/2, 0, 0);\n```\n\n现在到了参考系最酷的部分。回到 `animate()` 函数中，我们将让\
  \ `moon_orbit` 旋转。添加第二行代码，并将 `m_angle`（月球轨道改变的量）修改如下：\n\n```\nvar m_angle = time\
  \ * 4;\nmoon_orbit.rotation.set(0, 0, m_angle);\n```\n\n这样，月球就应该绕地球公转了！\n\n如果你仔细观察，会发现我们并没有移动月球。相反，我们是在旋转月球的轨道——也就是说，我们在旋转月球的参考系。如果你隐藏代码并按\
  \ E 键切换到地球摄像机视角，你会看到，由于我们将摄像机添加到了月球的参考系中，它会一直旋转指向月球。\n\n你可以把这个参考系想象成一个盘子，我们把摄像机和月球粘在上面：\n\
  \n![](img/Image00372.jpg) ![](img/Image00373.jpg)\n\n当我们旋转盘子时，月球和摄像机也随之旋转。\n\n\n\
  \n\n\n![](img/Image00374.jpg) ![](img/Image00375.jpg)\n\n## 挑战：创建地球轨道参考系\n\n结果是我们几乎不需要做太多工作就能绕月球轨道运行，或者让地球摄像头对准月球。而对于火星，我们不得不进行各种复杂的正弦、余弦和距离计算。我们必须通过\
  \ `animate()` 序列来定位地球、火星和摄像头。有了参考系，我们只需旋转一个物体。懒惰真是件好事。\n\n哦，你可能会想：为什么我们不对地球使用同样的技巧呢？很高兴你问这个问题。\n\
  \n## 14.4 挑战：创建地球轨道参考系\n\n你可以做到。只需按照我们为月球采取的步骤：\n\n- 创建一个 3D 对象来容纳地球，并将其添加到太阳中。\n\
  - 将地球添加到新的轨道参考系中，而不是场景中。\n- 删除设置地球位置的 `animate()` 代码。\n- 旋转地球的轨道。\n\n完成这些后，你就拥有了一个非常复杂的天文模拟，它完全基于简单的参考系构建——没有任何复杂的正弦或余弦！\n\
  \n## 14.5 暂停模拟\n\n看到月球绕地球公转，同时地球绕太阳公转，这很酷。但要真正理解月相，我们需要能够从地球观察月球——就像我们在夜空中看到的那样。暂停一切也很有帮助，这样我们就可以在俯视摄像头和地球摄像头之间来回切换。\n\
  \n要暂停，我们需要对 `animate()` 函数做一些修改。当模拟暂停时，我们仍然需要执行动画并渲染场景，但不应更新地球或月球的位置。这意味着我们必须将 `renderer.render()`\
  \ 调用移到 `animate()` 函数的前面——它需要在检查模拟是否暂停之前进行渲染。我们还需要想出一种不同的计时方式。我们一直使用的 `THREE.Clock()`\
  \ 无法暂停。\n\n因此，删除 `animate()` 函数上方的 `clock = THREE.Clock` 语句。用下面三个变量（`time`、`speed`\
  \ 和 `pause`）替换它：\n\n```javascript\nvar time = 0,\n    speed = 1,\n    pause = false;\n\
  \nfunction animate() {\n    requestAnimationFrame(animate);\n    renderer.render(scene,\
  \ camera);\n    if (pause) return;\n    time = time + speed;\n    var e_angle =\
  \ time * 0.001;\n    earth.position.set(250 * Math.cos(e_angle), 250 * Math.sin(e_angle),\
  \ 0);\n    var m_angle = time * 0.02;\n    moon_orbit.rotation.set(0, 0, m_angle);\n\
  }\nanimate();\n```\n\n其中还有其他变化：\n\n- `renderer.render()` 行不再位于底部。现在它是 `animate()`\
  \ 中的第二行。\n- 如果 `pause` 为真，我们添加了一个返回语句。\n- 我们通过每次将 `speed` 加到 `time` 上来增加时间。\n- 用于计算\
  \ `e_angle` 和 `m_angle` 的 `time` 乘数变小了。\n\n完成所有这些更改后，模拟应该会像以前一样再次运行。我们进行这些更改是为了能够通过按键来更改某些设置。\n\
  \n为此，找到 `keydown` 监听器并将其更改为以下内容：\n\n```javascript\ndocument.addEventListener(\"\
  keydown\", function(event) {\n    var code = event.keyCode;\n    if (code == 67)\
  \ changeCamera(); // C\n    if (code == 32) changeCamera(); // space\n    if (code\
  \ == 80) pause = !pause; // P\n    if (code == 49) speed = 1; // 1\n    if (code\
  \ == 50) speed = 2; // 2\n    if (code == 51) speed = 10; // 3\n});\n\nfunction\
  \ changeCamera() {\n    if (camera == above_cam) camera = earth_cam;\n    else camera\
  \ = above_cam;\n}\n```\n\n现在，如果你隐藏代码，你可以按 `C` 键或空格键来切换摄像头。按 `P` 键可以暂停或恢复。你甚至可以通过按\
  \ `1`、`2` 或 `3` 来改变速度。\n\n试试看！\n\n## 理解月相\n\n## 14.6 理解月相\n\n月球有四个主要月相：新月、上弦月、满月和下弦月。新月是指月球位于地球和太阳之间。由于太阳照射在月球我们看不到的那一面，此时我们看不到月球（而且它也在天空中与太阳同一区域）。\n\
  \n上弦月意味着月球绕其轨道运行了四分之一。这并不意味着它被照亮了四分之一——正如你所见，它是一半被照亮。\n\n![](img/Image00376.jpg)\n\
  \n当月球绕地球运行了四分之二（也就是一半）时，就是满月。我们看到的月球部分完全被照亮。\n\n![](img/Image00377.jpg)\n\n你知道下弦月是什么。月球绕地球运行了四分之三，再次被照亮一半。\n\
  \n![](img/Image00378.jpg)\n\n在新月和上弦月之间，月球是月牙形。\n\n![](img/Image00379.jpg) ![](img/Image00380.jpg)\
  \ ![](img/Image00381.jpg) ![](img/Image00382.jpg)\n\n在上弦月与满月之间，以及满月与下弦月之间，月球被称为\n\
  \n![](img/Image00383.jpg) ![](img/Image00384.jpg) 凸月。\n\n![](img/Image00385.jpg)\
  \ ![](img/Image00386.jpg) ![](img/Image00387.jpg) ![](img/Image00388.jpg)\n\n当被照亮的一面在增大时，称为“盈”。当它在减小时，称为“亏”。现在你几乎了解了关于月相的一切。更棒的是，你有了自己的模拟！\n\
  \n## 14.7 到目前为止的代码\n\n如果你想核对本章的代码，请参见第 243 页的附录 A1.14《代码：月相》。\n\n不，它不包括使用地球参考系的挑战。自己动手吧！\n\
  \n## 14.8 接下来是什么\n\n本书中的太空模拟到此结束。恭喜你——你已经完成了 3D 编程中的一个伟大传统。希望你学到了一些关于太空的知识。更重要的是，对于你的计算机技能来说，你已经接触到了参考系的概念，我们肯定会在游戏中用到它。\n\
  \n说到游戏，让我们在下一章开始吧！\n\n完成本章后，你将\n\n- 知道如何在游戏中计分\n- 理解当物体碰撞时如何计分（或执行其他操作）\n- 了解物理如何在游戏中应用的一个例子\n\
  \n## 第 15 章 项目：紫色水果怪物游戏\n\n在本章中，我们将制作一个跳跃游戏。玩家将使用键盘让紫色水果怪物跳跃和移动，以捕获尽可能多的滚动水果，同时不能接触地面。最终效果如下所示：\n\
  \n![](img/Image00389.jpg)\n\n这是一个相当简单的游戏，但它将让我们领略一些重要的游戏概念。\n\n### 15.1 开始\n\n在\
  \ ICE 中启动一个新项目。选择 3D 入门项目模板，并将此项目命名为“紫色水果怪物”。\n\n### 15.2 让我们来制作物理！\n\n对于这个游戏，我们需要两个新的\
  \ JavaScript 库和一些配置设置。在文件的最顶部，添加两个新的 `<script>` 标签：\n\n```html\n<body></body>\n\
  ```\n\n```html\n<script src=\"http://gamingJS.com/Three.js\"></script> ❶\n<script\
  \ src=\"http://gamingJS.com/physi.js\"></script> ❷\n<script src=\"http://gamingJS.com/Scoreboard.js\"\
  ></script>\n<script src=\"http://gamingJS.com/ChromeFixes.js\"></script>\n```\n\n\
  ❶ 我们将在游戏中使用物理。我们使用 Physijs 库，这样就不必自己编写所有物理代码。\n\n❷ 这个库将帮助在游戏中计分。\n\n然后，在 3D 入门项目模板代码的顶部，紧跟在没有\
  \ `src=` 属性的 `<script>` 标签下方，进行以下更改：\n\n```html\n<script>\n// 物理设置\n❶ Physijs.scripts.ammo\
  \ = 'http://gamingJS.com/ammo.js';\n❷ Physijs.scripts.worker = 'http://gamingJS.com/physijs_worker.js';\n\
  \n// 这是游戏中事情发生的地方：\n❸ var scene = new Physijs.Scene({ fixedTimeStep: 2 / 60 });\n\
  ❹ scene.setGravity(new THREE.Vector3(0, -100, 0));\n\n// 这是观察事物的东西：\nvar aspect_ratio\
  \ = window.innerWidth / window.innerHeight;\nvar camera = new THREE.PerspectiveCamera(75,\
  \ aspect_ratio, 1, 10000);\n❺ camera.position.z = 200;\n❻ camera.position.y = 100;\n\
  scene.add(camera);\n\n// 这将把摄像头看到的内容绘制到屏幕上：\n❼ var renderer = new THREE.WebGLRenderer();\n\
  renderer.setSize(window.innerWidth, window.innerHeight);\ndocument.body.appendChild(renderer.domElement);\n\
  ```\n\n\n\n\n\n// ******** 在下一行开始编码 ********  \n❶ 一个 `Physijs` 设置让 `Physijs` 决定物体何时相互碰撞。\
  \  \n❷ 一个工作线程在后台运行，执行所有物理计算。  \n❸ 我们需要使用 `Physijs.scene` 而不是 `THREE.scene`。  \n\
  ❹ 即使启用了物理引擎，我们也不会拥有重力，除非将其添加到场景中。这里，我们在 Y 轴负方向（即向下）添加重力。  \n❺ 将摄像机稍微拉近一点以观察动作。 \
  \ \n❻ 将摄像机向上移动一点，以便更好地观察动作。  \n❼ `WebGLRenderer` 比常规的 `CanvasRenderer` 效果更好。如果你的浏览器不支持\
  \ WebGL，别担心——本章仍然适用（尽管你可能看不到地面）。\n\n至此，我们已准备好开始编写跳跃游戏。\n\n### 15.3 规划游戏\n\n在编码之前，让我们思考如何组织代码。能读到本书这里，你已经编写了大量代码。有时，在代码中穿梭查看已写内容可能会变得困难。你不是第一个遇到这个问题的程序员，也不会是最后一个。幸运的是，你可以从前人的错误中学习。\n\
  \n组织代码最简单的方法之一就是将其视为写作。写文章时，你可能会先列一个大纲。有了大纲后，再填充细节。\n\n组织代码时，先写大纲再在其下方添加代码会很有帮助。由于我们在编程，大纲也是用代码写的。在\
  \ `START CODING ON THE NEXT LINE` 下方输入以下内容，包括双斜线。\n\n```javascript\n//var ground\
  \ = addGround();\n//var avatar = addAvatar();\n//var scoreboard = addScoreboard();\n\
  //animate();\n//gameStep();\n```\n\n回顾第 69 页的“注释”部分，每行开头的双斜线表示 JavaScript 注释。这意味着\
  \ JavaScript 会忽略这些行。这是好事，因为我们还没有定义这些函数。\n\n程序员称此为“注释掉代码”，使其不会运行。程序员这样做有很多原因。这里我们这样做是为了避免\
  \ JavaScript 在调用未定义的函数时报错。\n\n当我们定义每个函数时，会回到这个代码大纲，移除函数调用前的双斜线。程序员移除注释符号时，我们称之为“取消注释代码”。\n\
  \n这种方法使查找代码更容易。只需查看代码大纲，我们就知道 `addGround()` 函数会在 `addAvatar()` 之前定义。我们越快找到代码，就能越快修复或添加内容。当你编写大量代码时，这样的技巧确实有助于保持条理。\n\
  \n准备就绪\n\n在这个游戏中，我们需要地面、一个角色和一个记分板。我们将动作分为两部分：动画和游戏逻辑。所有这些都列在我们的代码大纲中。让我们开始编写与大纲匹配的代码。\n\
  \n## 为游戏添加地面\n\n代码大纲中的第一个函数调用是 `addGround()`。就在代码大纲下方（在注释掉的 `//gameStep()` 行之后），按如下方式定义该函数：\n\
  \n```javascript\nfunction addGround() {\n  document.body.style.backgroundColor =\
  \ '#87CEEB';\n  ground = new Physijs.PlaneMesh(\n    new THREE.PlaneGeometry(1e6,\
  \ 1 e6),\n    new THREE.MeshBasicMaterial({color: 0 x7CFC 00})\n  );\n  ground.rotation.x\
  \ = - Math.PI/2;\n  scene.add(ground);\n  return ground;\n}\n```\n\n`Physijs` 库将我们的\
  \ 3D 对象“包装”在代码中，使碰撞检测更容易。这就是为什么地面是 `Physijs.PlaneMesh` 而不是我们通常使用的 `THREE.Mesh`。\n\
  \n我们在第 10 章“项目：碰撞”（第 93 页）中做的碰撞检测只适用于简单碰撞。在这个游戏中，我们需要检测与地面和水果的碰撞。多重碰撞要困难得多，因此我们将使用\
  \ `Physijs` 库来简化工作。\n\n除了 `Physijs.PlaneMesh`，这个函数中的一切都是熟悉的。我们创建一个大的绿色平面，将其旋转为水平，并添加到场景中。\n\
  \n定义好这个函数后，我们在代码大纲中取消对 `addGround()` 的注释。如果一切正常，我们应该看到绿色的地面和蓝色的天空背景。\n\n## 构建一个简单的角色\n\
  \n创建角色类似。我们使用 `Physijs.Box` 来包裹一个紫色立方体。我们还对角色做了两件事：让它开始移动，并添加碰撞事件监听器。\n\n```javascript\n\
  function addAvatar() {\n  avatar = new Physijs.BoxMesh(\n    new THREE.CubeGeometry(40,\
  \ 50, 1),\n    new THREE.MeshBasicMaterial({color: 0x800080})\n  );\n  avatar.position.set(-50,\
  \ 50, 0);\n  scene.add(avatar);\n  avatar.setAngularFactor(new THREE.Vector3(0,\
  \ 0, 0)); // 无旋转\n  avatar.setLinearFactor(new THREE.Vector3(1, 1, 0)); // 仅在 X/Y\
  \ 轴上移动\n  avatar.setLinearVelocity(new THREE.Vector3(0, 150, 0));\n  avatar.addEventListener('collision',\
  \ function (object) {\n    if (object.is_fruit) {\n      scoreboard.addPoints(10);\n\
  \      avatar.setLinearVelocity(new THREE.Vector3(0, 50, 0));\n      scene.remove(object);\n\
  \    }\n    if (object == ground) {\n      game_over = true;\n      scoreboard.message(\"\
  Game Over!\");\n    }\n  });\n  return avatar;\n}\n```\n\n我们在第 4 章“项目：移动角色”（第 35\
  \ 页）中熟悉了 JavaScript 事件监听器，当时我们用它来监听键盘按键。这里我们监听的是不同的事件：紫色水果怪物与某物碰撞。\n\n如果角色与水果碰撞，我们给记分板加\
  \ 10 分，给角色一个向上的小弹跳，并将水果从屏幕上移除（因为紫色水果怪物吃掉了水果）。如果角色与地面碰撞，则游戏结束，紫色水果怪物不能再吃任何东西。\n\n\
  这个函数中有很多内容。最重要的是碰撞事件监听器，所有动作都在这里发生。\n\n该函数中还有其他几个值得提及的新内容。首先是 `THREE.Vector3()`。如果你看过电影《神偷奶爸》，你就会知道向量是一个带有方向和大小（哦，没错！）的箭头。这意味着向量包含两条信息：它指向的方向以及在该方向上的强度。你可以用向量来描述需要多大力气才能跳到一个位于左上方的高台。\n\
  \n向量在物理学中非常重要，这就是为什么它们被用于 `Physijs` 相关的东西。正如注释所暗示的，将“角因子”设置为全零向量可以防止角色旋转。设置“线性因子”可以防止向上、向下、向左、向右、向前或向后的运动。由于我们希望角色只向上、向下、向左和向右移动（但不能进入或离开屏幕），我们将向量的\
  \ X 和 Y 分量设置为 1（允许运动），Z 分量设置为 0（不允许运动）。最后，物体的线速度是指物体移动的速度和方向。我们让角色以 150 的速度垂直向上开始运动。如果角色与水果碰撞，我们也会给角色一个\
  \ 50 的垂直向上小弹跳。\n\n在代码大纲中取消对 `addAvatar()` 的注释。我们还没有创建 `animate()` 函数，所以目前还没有任何东西在移动。“角色”应该停在地面上。目前，它只是一个紫色矩形——稍后我们会让它更花哨一些。\n\
  \n## 添加计分\n\n准备就绪\n\n接下来我们添加记分板：\n\n```javascript\nfunction addScoreboard() {\n\
  \  var scoreboard = new Scoreboard();\n  scoreboard.score(0);\n  scoreboard.help('Use\
  \ arrow keys to move and the space bar to jump');\n  return scoreboard;\n}\n```\n\
  \n这类似于我们在第 11 章“项目：水果狩猎”中使用的记分板。\n\n\n\n\n\n在第 99 页，所以代码应该看起来很熟悉。取消代码大纲中`addScoreboard()`函数的注释，你应该会看到一个显示零分的记分板。\n\
  \n## 为场景添加动画\n\n现在，我们应该有一个显示零分的记分板和一个可爱的紫色方块立在地面上。为了让场景动起来，我们将代码底部的`renderer.renderer(scene,\
  \ camera)`移到我们常用的`animate()`函数中——这次稍有不同。\n\n```\nvar game_over = false;\nfunction\
  \ animate() {\n  if (game_over) return ;\n  requestAnimationFrame(animate);\n  scene.simulate();\
  \ // 运行物理模拟\n  renderer.render(scene, camera);\n}\n```\n\n这里新增了一个检查游戏是否结束的逻辑。如果游戏结束，我们从函数中返回，从而停止动画。另外新增了`scene.simulate()`这一行。正如注释所说，这一行是必需的，这样物理库才能移动物体（让它们跳跃、下落、滚动）并检测碰撞。别忘了这一行！\n\
  \n一旦`animate()`函数准备就绪，回到代码大纲，取消对`animate()`调用的注释。如果一切正常，角色应该跳向空中然后落回地面，游戏结束。\n\n\
  ## 创建游戏元素\n\n到目前为止，我们还没有为紫色水果怪物提供任何水果。我们在`gameStep()`函数中添加这些内容。我们之前没见过这个函数，但它在 3D\
  \ 游戏编程中非常有用。动画和物理模拟正在忙碌运行。我们不想在它们每次执行操作时都中断它们，来判断是否该开始滚动另一个水果。\n\n因此，我们使用一个独立的`gameStep()`函数，它每三秒运行一次。在`animate()`函数下方输入以下代码：\n\
  \n```\nfunction gameStep() {\n  if (game_over) return ;\n  launchFruit();\n  setTimeout(gameStep,\
  \ 3*1000) ;\n}\n```\n\n第一次调用`gameStep()`时，我们通过`launchFruit()`函数向角色发射一些水果。经过 3 秒的超时后，该函数再次调用自身，从而发射另一个水果。让一个函数“超时”后再执行其他操作，这是`setTimeout()`的工作。`setTimeout()`是\
  \ JavaScript 内置的函数，用于等待一段时间（以毫秒为单位），然后调用给定的函数。在这个例子中，`gameStep()`在`3*1000`毫秒（即 3\
  \ 秒）后调用自身。\n\n与`animate()`函数一样，如果游戏结束，我们立即从`gameStep()`中返回。\n\n当然，除非我们定义了发射水果的函数，否则这一切都不会生效：\n\
  \n```\nfunction launchFruit() {\n  var fruit = new Physijs.ConvexMesh(\n    new\
  \ THREE.CylinderGeometry(20, 20, 1, 24) ,\n    new THREE.MeshBasicMaterial({color:\
  \ 0xff0000})\n  ) ;\n  fruit.is_fruit = true;\n  fruit.setAngularFactor( new THREE.Vector3(\
  \ 0, 0, 1 )) ;\n  fruit.setLinearFactor(new THREE.Vector3( 1, 1, 0 )) ;\n  fruit.position.set(300,\
  \ 20, 0) ;\n  fruit.rotation.x = Math.PI/2;\n  scene.add(fruit);\n  fruit.setLinearVelocity(new\
  \ THREE.Vector3(-150, 0, 0) ) ;\n}\n```\n\n`launchFruit()`函数中没有什么新内容。它的任务是创建一个支持物理的圆形，将其添加到场景中，并让它滚动起来。更有趣的是`gameStep()`函数，我们将在后续章节中再次使用它。\n\
  \n完成`gameStep()`和`launchFruit()`函数后，取消代码大纲中对`gameStep()`调用的注释。如果一切正常，你应该会看到红色水果片向角色滚去。一旦角色落地，游戏应该结束，水果停止移动。\n\
  \n在基础游戏中，我们只剩下一件事要做——为角色添加控制。\n\n## 创建角色控制\n\n为了控制角色，我们使用前面章节中见过的`keydown`事件监听器。在`gameStep()`和`launchFruit()`函数下方添加以下代码：\n\
  \n```\ndocument.addEventListener(\"keydown\" , function (event) {\n  var code =\
  \ event.keyCode;\n  if (code == 37) left(); // 左箭头\n  if (code == 39) right(); //\
  \ 右箭头\n  if (code == 38) up(); // 上箭头\n  if (code == 32) up(); // 空格键\n}) ;\n\n\
  function left() { move(-50, 0); }\nfunction right() { move(50, 0); }\nfunction up()\
  \ { move(avatar.getLinearVelocity().x, 50); }\n\nfunction move(x, y) {\n  avatar.setLinearVelocity(\
  \ new THREE.Vector3(x, y, 0) ) ;\n}\n```\n\n有了这些，我们应该能够向上、向左、向右移动角色，吃掉美味的水果！（见图\
  \ 8，紫色方块怪物，第 141 页。）\n\n恭喜！你刚刚又从头编写了一个游戏。当然，你可能还想对游戏做很多改进：\n\n- 让水果移动得更快以获得更高分数\n\
  - 添加紫色水果怪物不喜欢的东西，当它吃掉时分数会下降\n\n![](img/Image00390.jpg) 图 8——紫色方块怪物\n\n![](img/Image00391.jpg)\n\
  \n- 如果太多水果从紫色水果怪物身边溜走，则停止游戏\n- 游戏结束时重置\n- 加入图形\n\n虽然我们可以添加更多内容让游戏变得更好，但游戏的核心已经完成。我们可以控制角色。我们可以判断玩家何时得分。我们可以判断游戏何时结束。我们可以显示分数。这已经很多了。\n\
  \n## 添加简单图形\n\n当然，我们有紫色水果怪物的图形资源，所以让我们把它们加进去。首先，在`addAvatar()`函数中，将`MeshBasicMaterial`设为不可见，并添加紫色水果怪物图像：\n\
