  准备就绪\n\n## 附录 2 本书使用的 JavaScript 库\n\n本附录列出了本书使用的 JavaScript 库，并详细说明如何获取每个库的更多信息。\n\
  \n### A2.1 Three.js\n\n`Three.js` JavaScript 库是本书使用的主要库。该项目的首页是 http://threejs.org/\
  \ 。首页包含许多酷炫的动画和示例，其中很多可以在 ICE 代码编辑器中尝试。\n\n我们使用的是`Three.js`的第 52 版。本书未讨论的属性和方法的详细文档可以在\
  \ http://gamingjs.com/docs/ threejs/ 找到。\n\n### A2.2 Physijs\n\n本书使用的物理引擎是`Physijs`。该库的首页是\
  \ http://chandlerprall.github.io/Physijs/ 。该页面包含简短的示例和一些介绍性文章。\n\n`Physijs`项目的文档不如`Three.js`项目丰富，但项目维基上有一些文档：\
  \ https://github.com/chandlerprall/Physijs/ wiki 。我们使用的是与`Three.js` 52 兼容的`Physijs`版本。由于`Physijs`持续发展，维基可能提及比我们使用的版本所支持的更新的功能。\n\
  \n### A2.3 Tween.js\n\n在本书中，当我们希望随时间改变数值（位置、旋转、速度）时，我们使用`Tween`库。项目首页是 http://github.com/sole/tween.js\
  \ 。构建一个`Tween`涉及几个部分。一个`Tween`需要起始值、结束值、从起始值到结束值所需的时间，以及在`Tween`运行时调用的函数。`Tween`还需要启动和更新才能工作。\n\
  \n第 11 章“项目：水果猎人”（第 99 页）中的`Tween`包含一个很好的示例。\n\n```javascript\nnew TWEEN.\nTween({\
  \ height: 150\n, spin: 0 }).\nto({height: 250 , spin: 4 }, 500).\nonUpdate(function\
  \ () {\n```\n\n\n\n\n`fruit.position.y = this.height; fruit.rotation.z = this.spin;\
  \ }). start();` 这段代码在两个值之间移动：高度和旋转。在半秒（500 毫秒）内，高度从 150 移动到 250，旋转从 0 移动到 4。每次更新\
  \ Tween 时，我们都会改变正在动画的水果的位置和旋转。当前正在补间的值作为特殊`this`对象的一个属性提供。在前面的示例中，我们做的最后一件事是启动 Tween。\n\
  \nTween 还需要一些东西来告诉它们更新。在 3D 编程中，我们通常在`animate()`函数中通过调用`TWEEN.update()`来实现。\n\n\
  ```\nfunction animate() {\n  requestAnimationFrame(animate);\n  TWEEN.update();\n\
  \  renderer.render(scene, camera);\n}\n```\n\n除了`onUpdate()`之外，还有`onStart()`和`onComplete()`方法，它们会在\
  \ Tween 开始和完成时调用一个函数。\n\n## A2.4 Scoreboard.js\n\nScoreboard.js 库是一个简单的 JavaScript\
  \ 库，提供了游戏中计分的基本功能。它支持的配置很少，但旨在让程序员易于使用。Scoreboard.js\n\n项目主页是 https://github.com/eee-c/scoreboard.js\
  \ 。Scoreboard.js 库支持消息、帮助文本、计分、经过时间计时器和倒计时计时器。\n\n### 计分板消息\n\n使用消息向游戏玩家提供游戏内消息。如果你用\
  \ `var scoreboard = new Scoreboard()` 创建了一个计分板，则可以使用以下方法：\n\n- `scoreboard.message('your\
  \ message here')` — 设置当前计分板消息。这将替换任何现有消息。如果计分板的消息部分尚未显示，则会显示它。\n- `scoreboard.addMessage('your\
  \ message here')` — 向当前计分板消息添加更多消息。\n- `scoreboard.addMessage('your message here')`\
  \ — 向当前计分板消息添加更多消息。\n- `scoreboard.showMessage()` — 显示计分板的消息部分。\n- `scoreboard.hideMessage()`\
  \ — 隐藏计分板的消息部分。\n- `scoreboard.clearMessage()` — 清除计分板的消息部分。\n\n### 帮助\n\n计分板帮助提供了一种向玩家提供说明的方式，而不会使计分板的消息部分显得杂乱。玩家需要输入问号才能看到计分板上的帮助。如果你用\
  \ `var scoreboard = new Scoreboard()` 创建了一个计分板，则可以使用以下方法：\n\n- `scoreboard.help('your\
  \ help instructions here')` — 设置计分板帮助。这将替换任何现有帮助。如果计分板的帮助部分尚未显示，则会显示它。\n- `scoreboard.showHelp()`\
  \ — 显示计分板的帮助部分。\n- `scoreboard.hideHelp()` — 隐藏计分板的帮助部分。\n\n### 计分\n\n计分板的这一功能用于跟踪玩家在游戏中获得的分数。如果你用\
  \ `var scoreboard = new Scoreboard()` 创建了一个计分板，则可以使用以下方法：\n\n- `scoreboard.score(42)`\
  \ — 设置游戏中的当前分数。这将替换任何现有分数。如果未提供数字，则使用零。如果计分板的分数部分尚未显示，则会显示它。\n- `scoreboard.showScore()`\
  \ — 显示计分板的分数部分。\n- `scoreboard.hideScore()` — 隐藏计分板的分数部分。\n- `scoreboard.getScore()`\
  \ — 返回游戏中的当前分数。\n- `scoreboard.addPoints(10)` — 将游戏中的分数增加指定数量。\n- `scoreboard.subtractPoints(10)`\
  \ — 将游戏中的分数减少指定数量。\n\n### 计时器\n\n这一功能用于跟踪游戏中经过的总时间。\n\n如果你用 `var scoreboard = new\
  \ Scoreboard()` 创建了一个计分板，则可以使用以下方法：\n\n- `scoreboard.timer()` — 启动游戏中的计时器。如果计分板的计时器部分尚未显示，则会显示它。\n\
  - `scoreboard.showTimer()` — 显示计分板的计时器部分。\n- `scoreboard.hideTimer()` — 隐藏计分板的计时器部分。\n\
  - `scoreboard.stopTimer()` — 停止计时器继续计时。\n- `scoreboard.startTimer()` — 开始计时器计时。\n\
  - `scoreboard.resetTimer()` — 将计时器从零重新开始。\n- `scoreboard.getTime()` — 返回游戏中经过的秒数。\n\
  \n### 倒计时\n\n这一功能用于跟踪游戏中经过的总时间。\n\n如果你用 `var scoreboard = new Scoreboard()` 创建了一个计分板，则可以使用以下方法：Sounds.js\n\
  \n- `scoreboard.countdown(60)` — 使用提供的秒数启动游戏中的倒计时。如果未指定时间，则使用 60 秒。如果计分板的倒计时部分尚未显示，则会显示它。\n\
  - `scoreboard.showCountdown()` — 显示计分板的倒计时部分。\n- `scoreboard.hideCountdown()` —\
  \ 隐藏计分板的倒计时部分。\n- `scoreboard.stopCountdown()` — 停止倒计时继续计时。\n- `scoreboard.startCountdown()`\
  \ — 开始倒计时计时。\n- `scoreboard.resetCountdown(60)` — 将倒计时重置为指定的秒数。\n\n- `scoreboard.getTimeRemaining()`\
