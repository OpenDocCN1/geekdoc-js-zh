  \n## 3.6 做侧手翻\n\n稍后我们会为虚拟角色添加控制。但在进入下一课之前，先让虚拟角色做一些翻转和侧手翻。\n\n就像我们在第 1 章“项目：创建简单形状”（第\
  \ 1 页）末尾所做的那样，我们首先更改代码的最后一行（即编辑器末尾 `</script>` 标签上方的那一行）。我们不再让浏览器只显示一次场景，而是按如下方式对场景进行动画处理。\n\
  \n```\n// Now, animate what the camera sees on the screen:\nfunction animate() {\n\
  \  requestAnimationFrame(animate);\n  avatar.rotation.z = avatar.rotation.z + 0.05;\n\
  \  renderer.render(scene, camera);\n}\nanimate();\n```\n\n如果你正确输入了所有代码，可能会注意到一个奇怪的现象。只有头部在旋转，而不是整个虚拟角色。\n\
