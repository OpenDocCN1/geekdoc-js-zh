  \n第 16 章 项目：倾斜板 • 145\n\n### 16.1 开始\n\n在 ICE 中新建一个项目。选择 3D 入门项目模板，并将项目命名为 Tilt-aBoard。\n\
  \n![](img/Image00400.jpg)\n\n这是一个 WebGL 游戏\n\n如果你的浏览器不支持 WebGL，你将不得不跳过本章。判断你的电脑和浏览器是否支持\
  \ WebGL 的最简单方法是访问 http://get.webgl.org/ 。如果页面上显示旋转的立方体，那么你拥有 WebGL。如果没有，你将需要做其他项目。\n\
  \n### 16.2 重力及其他设置\n\n就像我们在紫色水果怪物游戏中所做的那样，我们需要在“在下一行开始编码”这一行之前做一些准备工作。按照以下代码中的说明进行修改。\n\
  \n```\n<body> < /body >\n\n<script src=\"http://gamingJS.com/Three.js \"></script>\n\
  <script src=\" http://gamingJS.com/physi.js\"></script>\n<script src=\"http://gamingJS.com/ChromeFixes.js\"\
  > < /script >\n<script>\n// 物理设置\nPhysijs.scripts.ammo = 'http://gamingJS.com/ammo.js'\
  \ ;\nPhysijs.scripts.worker = 'http://gamingJS.com/physijs_worker.js' ;\n\n// 游戏中所有内容发生的地方：\n\
  var scene = new Physijs.Scene({ fixedTimeStep: 2 / 60 }) ;\nscene.setGravity(new\
  \ THREE.Vector3( 0, -50, 0 )) ;\n\n// 这是观察场景的视角：\nvar aspect_ratio = window.innerWidth\
  \ / window.innerHeight;\nvar camera = new THREE.PerspectiveCamera(75, aspect_ratio,\
  \ 1, 10000) ;\ncamera.position.set(0, 100, 200) ;\ncamera.rotation.x = - Math.PI/8;\n\
  scene.add(camera);\n\n// 这将把相机看到的内容绘制到屏幕上：\nvar renderer = new THREE.WebGLRenderer();\n\
  renderer.shadowMapEnabled = true;\nrenderer.setSize(window.innerWidth, window.innerHeight);\n\
  document.body.appendChild(renderer.domElement);\n\n// ******** 在下一行开始编码 ********\n\
  ```\n\n准备工作\n\n❶ 加载物理库。\n\n❷ 告诉物理库在哪里可以找到额外的碰撞检测帮助。\n\n❸ 设置一个工作线程来执行所有物理计算。\n\n\
  ❹ 创建一个支持物理的 `Physijs.scene`。\n\n❺ 启用重力。\n\n❻ 将相机稍微上移，以便更好地观察动作。\n\n❼ 倾斜相机，以便更好地观察动作。\n\
  \n❽ 使用 WebGL 渲染器。\n\n❾ 在渲染器中启用阴影以增加真实感。\n\n这个开头与我们在第 15 章“项目：紫色水果怪物游戏”（第 133 页）中使用的开头之间的唯一区别是相机的旋转和投射阴影的能力。现在我们已经准备好处理物理，让我们开始编写“在下一行开始编码”之后的代码。\n\
  \n### 16.3 游戏大纲\n\n我们的游戏中需要以下元素：一个小球、一个游戏板、一个目标、光照和太空背景。像往常一样，我们还需要让游戏动起来，并且会有一个单独的函数来处理不需要像动画那样频繁执行的游戏逻辑。输入以下代码大纲，包括双斜杠。\n\
  \n```\n//addLights();\n//var ball = addBall();\n//var board = addBoard();\n//addControls();\n\
  //addGoal();\n//addBackground();\n//animate();\n//gameStep();\n```\n\n就像我们在第 15\
  \ 章“项目：紫色水果怪物游戏”（第 133 页）中所做的那样，当我们定义这些函数时，我们会取消对这些函数调用的注释。\n\n### 添加光照\n\n准备工作\n\
  \n在做其他事情之前，我们先在场景中添加一些光照。没有光照，游戏中的其他内容将很难看清。\n\n在注释掉的代码大纲下方，添加以下 `addLights()` 函数定义。\n\
  \n```\nfunction addLights() {\n  scene.add(new THREE.AmbientLight(0x999999));\n\
  \  var back_light = new THREE.PointLight(0xffffff);\n  back_light.position.set(50,\
  \ 50, -100);\n  scene.add(back_light);\n  var spot_light = new THREE.SpotLight(0xffffff);\n\
  \  spot_light.position.set(-250, 250, 250);\n  spot_light.castShadow = true;\n \
  \ scene.add(spot_light);\n}\n```\n\n我们在第 12 章“使用光照和材质”（第 109 页）和第 13 章“项目：构建你自己的太阳系”（第\
  \ 117 页）中已经见过光照。这里我们使用了三种光照。环境光是一种无处不在的光——它不会投射阴影或使物体发光，但会显现物体的颜色。点光源就像灯泡——我们将其放置在场景中心的上方和后方，以便它能照射到游戏平台。聚光灯正如其名——我们用它从侧面照射光线并投射阴影。\n\
  \n现在我们已经添加了函数定义，取消代码大纲中对 `addLights()` 的注释。\n\n### 添加游戏小球\n\n让我们开始编写 `addBall()`\
  \ 函数，在 `addLights()` 函数定义下方添加以下代码。\n\n```\nfunction addBall() {\n  var ball = new\
  \ Physijs.SphereMesh(\n    new THREE.SphereGeometry(10, 25, 21),\n    new THREE.MeshPhongMaterial({\n\
  \      color: 0x333333,\n      shininess: 100.0,\n      ambient: 0xff0000,\n   \
  \   emissive: 0x111111,\n      specular: 0xbbbbbb\n    })\n  );\n  ball.castShadow\
  \ = true;\n  scene.add(ball);\n  resetBall(ball);\n  return ball;\n}\n```\n\n从之前的工作中，我们熟悉了将\
  \ 3D 形状和材质包裹在物理感知网格中的方法。我们也见过各种颜色设置。在这里，我们将小球做成非常闪亮的红色（`0xff0000` 是红色）。我们将它的 `castShadow`\
  \ 属性设置为 `true`，以便它能有阴影。最后，我们将其添加到场景中。所有这些都非常标准——除了我们现在添加的 `resetBall()` 函数。\n\n\
  ```\nfunction resetBall(ball) {\n  ball.__dirtyPosition = true;\n  ball.position.set(-33,\
  \ 50, -65);\n  ball.setLinearVelocity(0,0,0);\n  ball.setAngularVelocity(0,0,0);\n\
  }\n```\n\n![](img/Image00401.jpg)\n\ndirty 以两个下划线开头\n\n确保在 `dirtyPosition` 前加两个下划线。不是\
  \ `_dirtyPosition`。设置是 `__dirtyPosition`。如果只用一个下划线，不会报错，但移动控制将无法工作。\n\n这个 `resetBall()`\
  \ 函数以非常有趣的 `ball.__dirtyPosition` 设置开始。程序员有时会有奇怪的幽默感，dirty position 就是其中一个例子。程序员经常用“dirty”这个词来标记某些已被更改的东西，通常是以错误的方式。\n\
  \n在这里，我们通过改变小球的位置做了一件非常错误的事情。在现实生活中，物体不会突然改变位置。在 3D 物理世界中也是如此。物体不能突然出现在一个新位置。但我们需要在游戏开始时以及游戏重置时改变小球的位置。\n\
  \n所以 `__dirtyPosition` 是我们告诉游戏物理引擎的方式：“听着，我知道这不对，但我知道我在做什么，我需要立即改变以下位置。” 而且，由于我们如此礼貌地请求，游戏物理引擎会回答：“没问题！只是如果你以后还需要这样做，别忘了这个设置。”\n\
  \n![](img/Image00402.jpg)\n\n这难道不是过早的泛化吗？\n\n\n\n\n\n回到《函数：反复使用》中，我曾说过程序员永远不应该先编写漂亮的代码。我们本可以直接在\
  \ `addBall()` 内部添加位置代码。但我们没有这样做，原因有二。第一，我们已经知道需要重置游戏——就像我们在《项目：紫色水果怪物游戏》中讨论的那样。第二，我不希望你在输入代码后还要修改一大堆内容。不过，在做类似操作时还是要谨慎。\n\
  \n现在我们已经将 `addBall()` 函数定义添加到游戏中，可以取消代码大纲中 `addBall()` 调用的注释。我们的代码大纲现在应该如下所示：\n\n\
  ```\naddLights(); var ball = addBall(); //var board = addBoard();//addControls();\
  \ //addGoal();\n\n//addBackground();//animate(); //gameStep();\n```\n\n## Prepared\
  \ 添加游戏板\n\n现在我们应该有一个悬浮在半空中的球。让我们添加游戏板，让球有事可做。按如下方式添加 `addBoard()` 函数（警告：这个函数需要输入大量代码）。\n\
  \n```\nfunction addBoard() { var material = new THREE.MeshPhongMaterial({\n\ncolor:\
  \ 0 x333333, shininess: 40 ,\n\nambient: 0 xffd700, emissive: 0\n\nx111111, specular:\
  \ 0 xeeeeee}) ;var beam = new Physijs.BoxMesh(\n\nnew THREE.CubeGeometry(50, 2,\
  \ 200) , material,\n\n0) ; beam.position.set(-37, 0, 0) ;\n\nbeam.receiveShadow\
  \ = true;var beam2 = new Physijs.BoxMesh(\n\nnew THREE.CubeGeometry(50, 2, 200)\
  \ , material) ; beam2.position.set(75, 0, 0) ;\n\nbeam2.receiveShadow = true; beam.add(beam2);var\
  \ beam3 = new Physijs.BoxMesh(\n\nnew THREE.CubeGeometry(200, 2, 50) ,\n\nmaterial)\
  \ ;\n\nbeam3.position.set(40, 0, -40) ; beam3.receiveShadow = true; beam.add(beam3);var\
  \ beam4 = new Physijs.BoxMesh(\n\nnew THREE.CubeGeometry(200, 2, 50) , material)\
  \ ; beam4.position.set(40, 0, 40) ;\n\nbeam4.receiveShadow = true; beam.add(beam4);\n\
  \nbeam.rotation.set(0.1, 0, 0) ; scene.add(beam); return beam; }\n```\n\n这里有很多代码，但大部分你都知道。我们创建了四个横梁，并将它们组合在一起形成游戏板。最后，我们稍微倾斜了板子（以便让球滚动），并将其添加到场景中。注意，我们将每个横梁标记为可以接收阴影。\n\
  \n有一个新东西是第一个横梁中的 `0`：\n\n```\nvar beam = new Physijs.BoxMesh(\n\nnew THREE.CubeGeometry(50,\
  \ 2, 200) ,\n\nmaterial,\n\n0) ;\n```\n\n这个 `0` 告诉物理库重力不作用于该对象（或其添加的任何对象）。如果没有这个零，我们的游戏板就会直接掉出屏幕！\n\
  \n取消代码大纲中 `addBoard()` 调用的注释，你应该会看到球悬浮在游戏板上方。\n\n## 启用动画\n\n在启用游戏板控制之前，我们需要让场景动起来。在代码的最底部，将\
  \ `renderer.render()` 这一行移入 `animate()` 函数中，如下所示：\n\n```\nfunction animate() {\n\
  \nrequestAnimationFrame(animate); scene.simulate(); // 运行物理引擎\n\nrenderer.render(scene,\
  \ camera);}\n```\n\n从代码大纲中取消 `animate()` 函数（它位于最后的 `gameStep()` 调用之前）的注释。虽然不会有什么变化，但现在我们可以添加游戏控制了。\n\
  \n## 添加游戏控制\n\n现在我们已经有了球和板子，接下来为游戏板添加控制。在我们刚刚添加的 `animate()` 函数上方，添加以下 `addControls()`\
  \ 函数定义。\n\n```\nfunction addControls() {\n\ndocument.addEventListener(\"keydown\"\
  \ , function (event) {\n\nvar code = event.keyCode;if (code == 37) left(); if (code\
  \ == 39) right(); if (code == 38) up();\n\nif (code == 40) down();}) ;\n\n}\n```\n\
  \n到现在为止，我们已经非常熟悉使用 JavaScript 事件来控制游戏玩法了。而且我们开始记住方向键的计算机编号了！\n\n注意，我们还需要定义几个函数来让游戏板向左、向右、向上、向下倾斜。添加以下五个函数定义。\n\
  \n```\nfunction left() { tilt('z' , 0.02); } function right() { tilt('z' , -0.02);\
  \ } function up() { tilt('x' , -0.02); } function down() { tilt('x' , 0.02); }function\
  \ tilt(dir, amount) {\n\nboard.__dirtyRotation = true;\n\nboard.rotation[dir] =\
  \ board.rotation[dir] + amount;}\n```\n\nPrepared`left()`、`right()`、`up()` 和 `down()`\
  \ 函数非常容易理解。它们非常简短，以至于我们可以将整个函数定义放在一行！我们在每个函数调用的 `tilt()` 函数中所做的事情稍微复杂一些。\n\n我们已经从《添加游戏球》中的\
  \ `__dirtyPosition` 了解了 `__dirtyRotation`（并且我们知道它以下划线开头）。\n\n我们正在改变游戏板的旋转。尽管板的旋转只改变了一点点，但我们需要告诉物理库我们确实想要这样做。\n\
  \n`tilt()` 中真正巧妙的是 `board.rotation[dir]`。当调用 `left()` 函数时，它会以字符串 `'z'` 作为 `dir`\
  \ 的值来调用 `tilt()`。在这种情况下，它等同于更新 `board.rotation['z']`。这是新东西！我们见过像 `board.rotation.z`\
  \ 这样的写法，但从未见过方括号加字符串的写法。\n\n`board.rotation['z']` 等同于 `board.rotation.z`。JavaScript\
  \ 将两者都视为更改旋转的 `z` 属性。利用这个技巧，我们只需一行代码就能在 `tilt()` 中更新所有不同的方向。\n\n`board.rotation[dir]\
  \ = board.rotation[dir] + amount;` 如果没有这样的技巧，我们可能不得不使用四个不同的 `if` 语句。所以我们这些懒惰的程序员喜欢这个技巧！\n\
  \n取消代码大纲中 `addControls()` 调用的注释，然后试试游戏板。你应该能够向左、向右、向上、向下倾斜它。\n\n## 添加目标\n\n我们需要在游戏板下方的某个位置放置一个目标。即使我们看不到它，我们也知道有一个目标。当球完全穿过洞口时，我们就击中了目标并赢得了游戏。在\
  \ `addControls()` 函数定义的下方，输入以下内容。\n\n```\nfunction addGoal() {\n\nvar light = new\
  \ THREE.Mesh(\n\nnew THREE.CylinderGeometry(20, 20, 1000) , new\n\nTHREE.MeshPhongMaterial({transparent:true,\
  \ opacity: 0.15 ,\n\nshininess: 0 , ambient: 0 xffffff,\n\nemissive: 0 xffffff})\n\
  \n) ; scene.add(light);var score = new Physijs.ConvexMesh(\n\nnew THREE.PlaneGeometry(20,\
  \ 20) ,\n\nnew THREE.MeshNormalMaterial({wireframe: true}) ) ; score.position.y\
  \ = -50 ; score.rotation.x = Math.PI/2; scene.add(score);score.addEventListener(\
  \ 'collision' , function () {\n\nflashGoalLight(light); resetBall(ball);\n\n}) ;\n\
  \n}\n```\n\n这个函数的第一部分向场景添加了一个光源，但并不是真正的光源。这不是一个发光的灯，而是一个假光源，用来显示目标的位置。通过几何体和材质可以看出它是一个假光源——两者都是用于常规形状的。为了让它看起来像聚光灯照射在重要物体上，我们将其标记为透明并赋予较低的不透明度。换句话说，我们让它很容易被看穿。\n\
  \n将光源添加到场景后，我们添加实际的目标。这只是一个添加到游戏板下方场景中的小平面。这个目标的重要之处在于我们添加的碰撞事件监听器。当球与目标碰撞时，我们会闪烁目标灯并重置球。由于有了\
  \ `resetBall()` 函数，重置球很容易。\n\n## 线框显示\n\n![](img/Image00403.jpg)\n\n你可能已经注意到，在创建目标时我们将\
  \ `wireframe` 设置为 `true`。线框让我们能够看到几何体，而无需材质包裹。这是一个探索形状和绘制平面的有用工具，就像我们在这里所做的那样。\n\
  \n![](img/Image00404.jpg)\n\n通常，你应该在完成的游戏代码中移除线框属性（也可以移除包裹它的花括号）。在这个游戏中，将 `wireframe:\
  \ true` 改为 `visible:false` 可能最有意义，这样目标对玩家来说就是不可见的。\n\n为了闪烁灯光，我们需要定义 `flashGoalLight()`\
  \ 函数，如下所示。\n\n```\nfunction flashGoalLight(light, remaining) {\n\nif (typeof (remaining)\
  \ == 'undefined' ) remaining = 9 ;if (light.material.opacity == 0.4) {\n\nlight.material.ambient.setRGB(1,1,1);\
  \ light.material.emissive.setRGB(1,1,1); light.material.color.setRGB(1,1,1); light.material.opacity\
  \ = 0.15 ;}\n\nelse {\n```\n\n\n\n\n\n`light.material.ambient.setRGB(1,0,0); light.material.emissive.setRGB(1,0,0);`\n\
  \n`light.material.color.setRGB(1,0,0); light.material.opacity = 0.4 ; }if (remaining\
  \ > 0) {`\n\n```\nsetTimeout(function () {flashGoalLight(light, remaining-1);},\
  \ 500) ; } }\n```\n\n准备就绪该函数的大部分内容用于设置球门灯的颜色和不透明度（即透过它看到的难易程度）。如果不透明度原本是 0.4，那么我们将其设置为\
  \ 0.15（使其更易透视），并将聚光灯颜色改为白色。否则，我们将颜色设置为红色，不透明度设置为 0.4。这是函数的主体部分，但并非最有趣的部分。当调用 `flashGoalLight()`\
  \ 时，会传入要闪烁的球门灯以及剩余闪烁次数。我们在碰撞事件中调用 `flashGoalLight()` 时，并没有告诉它剩余闪烁次数——我们调用时没有传入参数。如果\
  \ JavaScript 函数被调用时缺少部分参数，这些参数的值就是 `undefined`，我们首次在第 67 页的“7.2 用 JavaScript 描述事物”中讨论过这一点。\n\
  \n在这种情况下，如果 `remaining` 是 `undefined`，则说明这是该函数第一次被调用，我们将其设置为再闪烁 9 次。\n\n这个函数真正有趣的地方在于结尾。如果剩余闪烁次数大于零，我们会从函数内部再次调用它自身。\n\
  \n```\nif (remaining > 0) {\n  setTimeout(function () {flashGoalLight(light, remaining-1);},\
  \ 500) ;\n}\n```\n\n这是一个递归的实际例子，我们首次在“函数：反复使用”中遇到过。这里，我们用相同的灯光参数调用同一个 `flashGoalLight()`，但将剩余闪烁次数减一。因此，我们以剩余\
  \ 8 次调用它，然后它又以剩余 7 次调用自身，依此类推，直到剩余 0 次。当剩余 0 次时，我们不再调用 `flashGoalLight()`，递归停止。在这段代码的最后还有\
  \ `setTimeout()`。它会在等待一小段时间后调用函数。这里我们等待 500 毫秒，即半秒。\n\n至此，球门部分就完成了，所以回到代码大纲，取消对\
  \ `addGoal()` 调用的注释。\n\n## 添加背景\n\n让我们将第 117 页“第 13 章 项目：构建你自己的太阳系”中的星空背景添加到这个游戏中。在\
  \ `addGoal()` 函数定义下方，添加以下代码：\n\n```\nfunction addBackground() {\n  document.body.style.backgroundColor\
  \ = 'black' ;\n  var stars = newTHREE.Geometry();\n  while (stars.vertices.length\
  \ < 1000) {\n    var lat = Math.PI * Math.random() - Math.PI/2;\n    var lon = 2*Math.PI\
  \ * Math.random();\n    stars.vertices.push(new THREE.Vector3(\n      1000 * Math.cos(lon)\
  \ * Math.cos(lat),\n      1000 * Math.sin(lon) * Math.cos(lat),\n      1000 * Math.sin(lat)\n\
  \    ));\n  }\n  var star_stuff = new THREE.ParticleBasicMaterial({size: 5});\n\
  \  var star_system = new THREE.ParticleSystem(stars, star_stuff);\n  scene.add(star_system);\n\
  }\n```\n\n这与行星模拟器中的太空背景类似。完成后，取消代码大纲中 `addBackground()` 函数的注释。\n\n## 游戏逻辑\n\n正如我们在第\
  \ 133 页“第 15 章 项目：紫色水果怪物游戏”中看到的，以动画工作的频率来处理游戏逻辑并不是一个好主意。因此，在这个游戏中，我们再次将两者分开。在 `addBackground()`\
  \ 函数体下方添加以下游戏逻辑定义：\n\n```\nfunction gameStep() {\n  if (ball.position.y < -100)\
  \ resetBall(ball);\n  setTimeout(gameStep, 1000 / 60) ;\n}\n```\n\n首先，我们的游戏逻辑告诉\
  \ Physijs 在场景中模拟物理。然后我们检查球是否掉出了棋盘。我们每秒处理 60 次游戏逻辑。也就是说，我们将该函数的超时时间设置为 1000 毫秒除以\
  \ 60，即 16.67 毫秒。因此 `gameStep()` 每 16.67 毫秒处理一次，这看起来非常频繁。但在计算机中，这并不算频繁。在这 1000 毫秒内，动画至少会更新\
  \ 16 次，很可能更多。说实话，在这个案例中，将游戏逻辑分离出来并不那么重要。对于大多数计算机来说，在这个简单游戏中处理物理并判断球的 Y 坐标是否小于 -100\
  \ 并不是太大的负担。不过，在编写游戏时，这是一个值得养成的好习惯。现在，取消代码大纲中 `gameStep()` 函数的注释，然后…… 准备就绪 • 156\n\
  \n## 到目前为止的代码\n\n就是这样！至此，你应该拥有一个功能完备、太空时代的倾斜板游戏了。使用方向键倾斜板子并得分。\n\n### 16.4 到目前为止的代码\n\
  \n如果你想核对本章的代码，请参考第 249 页的“A1.16 代码：倾斜板”。\n\n### 16.5 下一步\n\n这是我们迄今为止最好的游戏。我们将编写\
  \ 3D 游戏的技能与制作阴影和材质的新技能结合了起来。倾斜板游戏看起来确实很漂亮。编写代码当然花了不少时间，但很值得。在接下来的章节中，我们将更深入地探讨 JavaScript。具体来说，我们将介绍**对象**，我们一直在使用它们，但还没有讨论如何创建它们。一旦掌握了这项技能，我们将再构建几个非常酷的游戏。\n\
  \n## 第 17 章 项目：学习 JavaScript 对象\n\n• 157\n\n完成本章后，你将能够：\n\n- 理解我们一直使用的 `new` 关键字的意义\n\
  - 定义自己的对象\n- 知道如何复制对象\n\n## 第 17 章 项目：学习 JavaScript 对象\n\n到目前为止，我们已经取得了相当惊人的进展。我们有了一个可以在屏幕上行走并撞到障碍物的化身。我们构建了一个太阳系的动画模型和一个月球运动的模拟。我们还尝试用新技能创建了几个相当酷的游戏。事实上，我们已经取得了如此大的进步，以至于我们达到了\
  \ JavaScript 所能做到的极限——至少在不引入新概念的情况下是如此。为了理解为什么我们需要学习这个新概念，想想我们的化身。我们可以制作很多让化身独自玩耍的游戏，但如果玩家想和其他人一起玩呢？如果两个玩家同时出现在屏幕上，我们如何添加所有的手、脚和身体，而不把它们搞混？如何让每个化身独立移动？如何为每个化身分配不同的颜色和形状？如果我们试图用目前所学的知识来完成所有这些事情，事情很快就会失控。所以，是时候学习对象并看看我们能拿它们做什么了。\n\
  \n### 这是一个具有挑战性的章节\n\n![](img/Image00405.jpg) ![](img/Image00406.jpg) 本章包含许多新概念。你可能会发现最好先快速浏览一遍，然后再回来深入学习。\
  \ ![](img/Image00407.jpg) ![](img/Image00408.jpg) ![](img/Image00409.jpg)\n\n###\
  \ 17.1 开始\n\n![](img/Image00410.jpg) 在 ICE 代码编辑器中创建一个新项目。对于这个练习，我们使用 3D 入门项目模板，并将其命名为“Objects”。\n\
  \n本章我们不会创建可视化内容。相反，我们将在 ICE 中创建对象，并在 JavaScript 控制台中查看它们。所以请确保 JavaScript 控制台已打开。\n\
  \n准备就绪\n\n### 17.2 简单对象\n\n程序员将事物称为**对象**。现实世界中任何我们可以触摸或谈论的东西，都可以在计算机世界中描述为一个对象。以电影为例。我想我们都同意《星球大战》是有史以来最伟大的电影，对吧？那么，这里我们将《星球大战》描述为一个\
  \ JavaScript 对象：\n\n```\nvar best_movie = {\n  title: 'Star Wars' ,\n  year: 1977\n\
  ```\n\n\n\n\n`};`尽管这个例子很短，但其中包含了很多内容。首先，我们看到 JavaScript 中花括号除了包裹函数定义和 if 语句之外，还有另一种用途。花括号也可以包裹\
  \ JavaScript 对象。此外，我们看到 JavaScript 对象就像数字和字符串一样——它们可以被赋值给一个变量（本例中是 `best_movie`）。更重要的是，对象让我们能够以不同的方式描述事物。在这个例子中，我们可以用标题、导演和制作年份来描述一部电影。我们用来描述事物的不同信息片段被称为**属性**。对象的属性可以是任何东西。在我们的《星球大战》示例中，属性是字符串和数字。我们也可以使用布尔值、列表，甚至函数。\n\
  \n```\nvar best_movie = {\n\ntitle: 'Star Wars' , year: 1977 , stars: ['Mark Hamill'\
  \ , 'Harrison Ford' , 'Carrie Fisher' ]\n\n, aboutMe: function () {console.log(this.title\
  \ + ', starring: ' + this.stars); }\n\n} ;\n\nbest_movie.aboutMe();\n\n// => Star\
  \ Wars, starring: Mark Hamill,Harrison Ford,Carrie Fisher\n```\n\n在我们的 `best_movie`\
  \ 对象上调用 `aboutMe()` 函数会在 JavaScript 控制台中输出“Star Wars, starring…”消息。这就是 `console.log()`\
  \ 调用的作用——它将我们想要的内容记录到 JavaScript 控制台中。\n\n## 复制对象\n\n当我们在对象中使用函数时，我们用一个不同的名称来称呼它们：**方法**。方法让我们能够修改对象，或者像这里所做的那样，返回关于对象的其他信息。看看\
  \ `aboutMe()` 方法以及我们如何使用 `this` 关键字。`this` 关键字是我们引用当前对象的方式。如果我们使用 `title` 而不是 `this.title`，就会收到一条错误消息，告诉我们\
  \ `title` 未定义。在这个例子中，`title` 未定义是因为代码在程序的其他地方寻找名为 `title` 的变量。通过使用 `this.title`，我们指定要获取分配给当前对象的\
  \ `title` 属性。\n\n![](img/Image00412.jpg)\n\n## `console.log()` 是你的朋友\n\nWeb 程序员经常使用\
  \ `console.log()` 来双重检查变量是否具有我们期望的值。它永远不会出现在网页或游戏中，但程序员可以看到它——并在出现问题时进行修复。只需记得在完成后删除\
  \ `console.log()`——在没有大量 `console.log()` 消息的情况下使用 JavaScript 控制台会容易得多！\n\n## 17.3\
  \ 复制对象\n\n在现实生活中，你通过复制某个酷想法或事物的所有功能，并在这里或那里做一些修改使其变得更好，来复制它。你复制的东西成为了新做法的原型。JavaScript\
  \ 以类似的方式处理对象的复制。要描述另一部电影，我们可以使用 `Object.create` 复制原型对象 `best_movie`：\n\n```\nvar\
  \ great_movie = Object.create(best_movie);\n\ngreat_movie.aboutMe();\n\n// => Star\
  \ Wars, starring: Mark Hamill,Harrison Ford,Carrie Fisher\n```\n\n`Object.create`\
  \ 会创建一个新对象，该对象具有我们之前创建的原型对象的所有相同属性和方法。因此，新对象 `great_movie` 与原始对象 `best_movie` 具有相同的标题和演员。它也具有相同的\
  \ `aboutMe()` 方法。我们不需要对 `aboutMe()` 方法做任何修改。我们仍然希望它将电影标题和演员列表记录到 JavaScript 控制台中。即使标题和演员列表发生变化，`aboutMe()`\
  \ 方法也保持不变——它可能会记录不同的信息，但会使用相同的属性来实现。\n\n然而，我们确实希望更新新对象中的标题和其他信息。让我们让这个新对象引用一部所有像我们这样的\
  \ 3D 程序员都喜欢的电影：《玩具总动员》。\n\n```\ngreat_movie.title = 'Toy Story' ; great_movie.year\
  \ = 1995 ;\n\ngreat_movie.stars = ['Tom Hanks' , 'Tim Allen' ] ; great_movie.aboutMe();\n\
  \nPrepared\n\n// => Toy Story, starring: Tom Hanks,Tim Allen\n\nbest_movie.aboutMe();\n\
  \n// => Star Wars, starring: Mark Hamill,Harrison Ford,Carrie Fisher\n```\n\n在前三行中，我们修改了当前对象的属性。然后我们让\
  \ `aboutMe()` 方法执行它的操作，它使用我们刚刚提供的新信息完成了任务。这一小点魔法要归功于 `aboutMe()` 中的 `this` 关键字。`this.title`\
  \ 始终引用当前对象的 `title` 属性。请注意，更新新对象 `great_movie` 上的属性不会影响 `best_movie` 对象。`best_movie`\
  \ 的所有属性保持不变，其 `aboutMe()` 方法仍然显示原始结果。所有这些关于原型和原型对象的讨论，并不仅仅是为了抛出花哨的词汇。事实上，原型的概念在\
  \ JavaScript 中非常重要，并且回答了你可能从本书第一章就有的一个问题：我们一直输入的 `new` 关键字是什么？\n\n## 17.4 构造新对象\n\
  \n我们现在对 JavaScript 中的对象有了很好的理解。我们也看到了对象如何作为原型对象，并充当创建类似对象的模板。像这样创建新对象可能相当繁琐且容易出错。考虑一下：如果我们忘记为\
  \ `great_movie` 赋值 `year` 属性，那么该对象会认为《玩具总动员》是在 1977 年制作的。除非我们告诉对象不同，否则它会从原始对象（`star_wars`）复制所有属性，包括年份\
  \ 1977！我们还可以使用一个简单的函数在 JavaScript 中构建对象——是的，就是我们在第 5 章“函数：使用与复用”（第 49 页）中首次看到的简单函数。令人惊讶的是，我们不需要对函数做任何特殊处理来创建新对象。通常，作为一种风格，程序员在创建新对象的函数名称时会使用大写字母。例如，一个用于创建电影对象的函数可能被命名为\
  \ `Movie`。\n\n```\nfunction Movie(title, stars) {\n\nthis.title = title; this.stars\
  \ = stars; this.year = (new Date()).getFullYear();}\n\nvar kung_fu_movie = new Movie('Kung\
  \ Fu Panda' , ['Jack Black' , 'Angelina Jolie' ]) ; \n\nconsole.log(kung_fu_movie.title);\n\
  \n// => Kung Fu Panda\n\nconsole.log(kung_fu_movie.stars);\n\n// => ['Jack Black',\
  \ 'Angelina Jolie']\n```\n\n\n\n\n`console.log(kung_fu_movie.year); // => 2013`\n\
  \n你可能注意到《功夫熊猫》电影的年份是错误的（它是在 2008 年上映的）。这是因为我们的构造函数只知道将 `year` 属性设置为当前年份。如果你想挑战一下，可以修改构造函数，让它接受第三个参数——年份。如果设置了年份，就在构造函数中使用该年份，而不是当前年份。\n\
  \n现在我们知道我们的 3D JavaScript 库的创建者是如何编写所有代码的了，因此我们可以这样写：\n\n```\nvar shape = new THREE.SphereGeometry(100);\n\
  var cover = new THREE.MeshNormalMaterial();\nvar ball = new THREE.Mesh(shape, cover);\n\
  ```\n\n`SphereGeometry`、`MeshNormalMaterial` 和 `Mesh` 都是 Three.js 库中的构造函数。\n\n一个谜题解开了，但还有一个：如果我们使用函数构造函数来构建对象，如何为这些对象创建方法呢？答案就是我们之前在上一节中强调的“原型”（prototype）。要为使用\
  \ `Movie()` 构造函数创建的对象创建一个 `aboutMe()` 方法，我们需要在构造函数的原型上定义该方法。也就是说，对于一个原型电影，我们希望 `aboutMe()`\
  \ 方法看起来像下面这样。\n\n```\nMovie.prototype.aboutMe = function () {\n  console.log(this.title\
  \ + ', starring: ' + this.stars);\n};\n```\n\n有了这个方法，我们就可以向 `kung_fu_movie` 询问 `aboutMe()`\
  \ 的答案了。\n\n```\nkung_fu_movie.aboutMe();\n// => Kung Fu Panda, starring: Jack Black,\
  \ Angelina Jolie\n```\n\nJavaScript 对象可以有任意数量的方法，比如 `aboutMe()`，但最好保持方法数量较少。如果你发现自己写了十二个以上的方法，那么可能是时候创建一个带有新构造函数的新对象了。\n\
  \n## 17.5 到目前为止的代码\n\n如果你想核对本章中的代码，请参阅第 253 页的 A1.17 节《代码：学习 JavaScript 对象》。\n\n\
  ## 17.6 接下来是什么\n\n面向对象编程是一个难以理解的概念。如果你理解了本章的所有内容，那么你比我当初学习这些概念时做得更好。如果有些内容没有完全理解，也不用担心。我们在接下来的几个游戏中会用到一些例子，它们应该有助于澄清这些问题。\n\
  \n在编写了一两个使用对象的游戏之后，重新阅读本章可能会有所帮助。随着你自己创作的游戏越来越复杂，你会希望依靠对象来帮助组织代码。\n\n完成本章后，你将能够：\n\
  \n- 知道如何用鼠标移动物体\n- 拥有另一个完整的游戏可以分享\n\n# 第 22 章 项目：洞穴谜题\n\n在本章中，我们将构建一个基于动作的益智游戏。在游戏中，角色只能向左或向右移动，但要获胜，角色需要到达屏幕顶部。玩游戏的人可以移动和旋转斜坡，帮助角色到达屏幕顶部并获胜。为了增加挑战性，游戏板中包含一些无法移动的物体。\n\
  \n游戏的草图可能如下所示：\n\n![](img/Image00413.jpg)\n\n在本章中，我们将充分利用新学到的面向对象编程技能，因此如有需要，请参考第\
  \ 159 页的第 17 章《项目：学习 JavaScript 对象》。\n\n## 开始\n\n我们首先在 ICE 代码编辑器中创建一个新项目。这次我们使用\
  \ 3D 入门项目（带物理引擎）模板（你需要更改模板），并将其命名为“Cave Puzzle”。\n\n你可能已经猜到，这个模板包含了我们在第 133 页的第\
  \ 15 章《项目：紫色水果怪物游戏》中手动添加的大部分物理引擎工作。\n\n在 `START CODING` 行之前，我们还需要做一些修改。首先，我们需要再引入两个\
  \ JavaScript 库——一个用于计分，一个用于处理鼠标。在第 4 行之后，紧挨着普通的 `<script>` 标签之前，新起一行，添加以下两个 `<script>`\
  \ 标签：\n\n```\n<script src=\"http://gamingJS.com/Scoreboard.js\"></script>\n<script\
  \ src=\"http://gamingJS.com/Mouse.js\"></script>\n```\n\n重要的是，`Mouse.js` 的 `<script>`\
  \ 标签要放在 `physi.js` 的 `<script>` 标签之后，这样它才能为支持物理引擎的对象添加鼠标功能。\n\n我们需要做的另一件事是选择一个更好的背景颜色来营造游戏氛围。我们不希望它完全黑暗，但稍微灰暗一些、更深一些的颜色会让屏幕感觉更像洞穴内部。因此，在\
  \ `START CODING` 行上方，将背景颜色设置为以下值：\n\n```\ndocument.body.style.backgroundColor =\
  \ '#9999aa';\n```\n\n### 计算机喜欢十六进制数\n\n![](img/Image00414.jpg)\n\n我想我们都同意 99 是一个数字。但\
  \ `aa` 怎么能是数字呢？因为计算机喜欢二进制数（1 和 0），它们喜欢用十六进制数来工作。计算机不是数到九然后用两位数（1 和 0）表示十，而是喜欢一直数到十五才增加一位数字。由于人类只有十个一位数（0、1、2、3、4、5、6、7、8\
  \ 和 9），我们使用字母来表示十六进制数，从 `a` 开始。\n\n![](img/Image00415.jpg)\n\n在普通数字系统和十六进制中，数字 0\
  \ 到 9 是相同的。普通数字 10 在十六进制中是 `a`，数字 11 是 `b`，以此类推，直到 15 在十六进制中是 `f`。下一个数字 16 在十六进制中是\
  \ `10`。\n\n计算机颜色通常是两位十六进制数——尤其是在网页上。两位十六进制数在计算机中有一个特殊的名称：一个字节。用两位十六进制数，我们可以从零（`00`）数到\
  \ 255（`ff`）。\n\n因此，十六进制 `99` 告诉计算机将颜色打开到其全亮度的约 60%。十六进制 `aa` 稍微亮一些——约为全亮度的 66%。`ff`\
  \ 会将颜色调到全亮度，而 `00` 则完全关闭它。\n\n### 设置游戏边界\n\n前两个数字是我们想要使用的红色量，中间两个数字是绿色量，最后两个是蓝色量。对于洞穴，我们使用等量的红色和绿色（`99`），但通过将蓝色设置为\
  \ `aa` 来增加一点蓝色。\n\n在 `START CODING` 行上方，我们要做的最后一件事是切换到我们在第 89 页的《快速浏览一个名字奇怪的相机》中使用过的正交相机。这更像是一个二维游戏，因此正交相机更适合我们的目的。\n\
  \n![](img/Image00416.jpg)\n\n### 仅限 WebGL\n\n仅当你的计算机支持第 111 页的 12.3 节《真实感：光泽》中描述的\
  \ WebGL 时，才进行以下更改。即使你的计算机支持 WebGL，也可以跳过这些设置，以便更容易与他人分享此游戏。\n\n注释掉透视相机，并取消注释正交相机的三行代码：\n\
  \n```\n//var camera = new THREE.PerspectiveCamera(75, aspect_ratio, 1, 10000);\n\
  var camera = new THREE.OrthographicCamera(\n  -width/2, width/2, height/2, -height/2,\
  \ 1, 10000\n);\n```\n\n并且，由于正交相机仅在 WebGL 中工作，我们需要切换渲染器：\n\n```\n// 这将把相机看到的内容绘制到屏幕上：\n\
  var renderer = new THREE.WebGLRenderer();\n```\n\n至此，我们准备开始编码。\n\n### 设置游戏边界\n\n\
  这个游戏中的所有动作都将在屏幕上进行。因此，我们需要一些东西来将角色限制在屏幕内。我们需要边界——四个边界。由于我们需要添加四个相同的东西，我们将通过一个 `makeBorder()`\
  \ 函数来实现。这个函数将使用 `x` 和 `y` 位置来决定边界放置的位置。它还将定义 `width` 和 `height` 来构建正确的形状。让我们在 `START\
  \ CODING` 行下方添加以下代码：\n\n```\nfunction makeBorder(x, y, w, h) {\n  var border = new\
  \ Physijs.BoxMesh(\n    new THREE.CubeGeometry(w, h, 100),\n    Physijs.createMaterial(\n\
  \      new THREE.MeshBasicMaterial({color: 0x000000}),\n      0.2,\n      1.0\n\
  \    ),\n    0\n  );\n  border.position.set(x, y, 0);\n  return border;\n}\n```\n\
  \n这将创建与我们在第 15 章中使用的相同类型的支持物理引擎的网格。\n\n\n\n15，项目：紫色水果怪物游戏，第 133 页。请注意，矩形框的深度始终为\
  \ 100。这将确保角色不会意外掉落到边界的前方或后方。`makeBorder()`函数用于构建网格。我们还需要将这些网格添加到场景中。使用以下四行代码添加左、右、上、下边界（如果你不喜欢，可以不包含所有空格）：`scene.add(makeBorder(width/-2,\
  \ 0, 50, height)); scene.add(makeBorder(width/2, 0, 50, height)); scene.add(makeBorder(0,\
  \ height/2, width, 50)); scene.add(makeBorder(0, height/-2, width, 50));`\n\n![](img/Image00417.jpg)\n\
  \n## 为透视相机调整边界\n\n![](img/Image00418.jpg)如果你使用的是透视相机，那么边界将无法完全到达屏幕边缘。为了正确定位它们，我们需要将边界稍微放大，并将它们向外移动一点。要放大边界，将宽度和高度乘以\
  \ 1.2：`new THREE.CubeGeometry(1.2*w, 1.2*h, 100)`，\n\n要将边界向外移动一点，同样将 x 和 y 位置乘以\
  \ 1.2：`border.position.set(1.2*x, 1.2*y, 0);` 这样，我们就有了四个边界来将角色限制在屏幕上。现在让我们添加角色。\n\
  \n## 从一个简单的角色开始\n\n在这个游戏中，我们将保持角色简单。完成后，你可以随意使用第 15 章（项目：紫色水果怪物游戏，第 133 页）或第 12\
  \ 章（使用灯光和材质，第 109 页）中的一些技巧，但最好从简单开始，之后再增加复杂性。我们之前已经做过大部分工作，所以让我们快速浏览接下来的代码。将角色的网格制作成一个带有红色表面的扁平圆柱体：\n\
  \n### 设置游戏边界\n\n```javascript\nvar avatar = new Physijs.ConvexMesh(\n    new THREE.CylinderGeometry(30,\
  \ 30, 5, 16),\n    Physijs.createMaterial(new THREE.MeshBasicMaterial({color:0xbb0000}),\
  \ 0.2, 0.5)\n);\n```\n\n由于这是一个物理模拟，我们使用 0.2 这个数字使材质变得光滑（1.0 会非常难以移动），并使用 0.5 这个数字使其具有一定的弹性（1.0\
  \ 会非常有弹性）。接下来我们将角色添加到场景中：\n\n```javascript\navatar.rotation.set(Math.PI/2, 0, 0);\n\
  avatar.position.set(0.5 * width/-2, -height/2 + 25 + 30, 0);\nscene.add(avatar);\n\
  avatar.setAngularFactor(new THREE.Vector3(0, 0, 0)); // 不旋转\navatar.setLinearFactor(new\
  \ THREE.Vector3(1, 1, 0)); // 仅在 X 和 Y 轴上移动\n```\n\n我们将角色旋转 90 度（`Math.PI/2`），使其直立而不是平躺。我们将其定位在稍微靠左且刚好在底部边界上方（25\
  \ 是边界宽度的一半，30 是角色的大小）。与项目：紫色水果怪物游戏一样，我们设置角度因子，使角色不会平躺，并设置线性因子，使其仅上下移动（不进出屏幕）。\n\n\
  接下来，我们决定当角色与某物碰撞时该怎么做。大多数情况下我们并不关心。角色撞到墙壁或斜坡并不重要。只有当物体是目标时才重要：\n\n```javascript\n\
  avatar.addEventListener('collision', function(object) {\n    if (object.isGoal)\
  \ gameOver();\n});\n```\n\n我们稍后添加目标时会处理`isGoal`属性。\n\n接下来我们需要处理键盘交互：\n\n```javascript\n\
  document.addEventListener(\"keydown\", function(event) {\n    var code = event.keyCode;\n\
  \    if (code == 37) move(-50); // 左箭头\n    if (code == 39) move(50); // 右箭头\n});\n\
  ```\n\n这里没有什么新内容。我们仍然需要告诉角色，每当按下左/右箭头键时，速度增加 50：\n\n```javascript\nfunction move(x)\
  \ {\n    var v_y = avatar.getLinearVelocity().y,\n        v_x = avatar.getLinearVelocity().x;\n\
  \    if (Math.abs(v_x + x) > 200) return;\n    avatar.setLinearVelocity(new THREE.Vector3(v_x\
  \ + x, v_y, 0));\n}\n```\n\n准备好的这个`move()`函数相当智能。首先它确定角色当前移动的速度。我们需要知道角色向左或向右移动的速度，以便我们可以增加或减少速度（取决于按下的箭头键）。我们还需要知道角色向上或向下移动的速度，以便不改变它。对于一个正在下落的角色突然停止下落是没有意义的。我们还在这里做了一些巧妙的事情。我们设置角色速度永远不会超过\
  \ 200。`Math.abs()`函数会去除数字的负号（你可能在数学课上见过绝对值——这里的 abs 就代表它）。换句话说，`Math.abs(-200)`等于\
  \ 200——就像`Math.abs(200)`一样。这让我们可以说，“如果角色的速度是-200（向左移动）或 200（向右移动），那么完全不改变速度。”玩家需要以不超过\
  \ 200 的速度赢得游戏。角色部分就这些。现在让我们添加目标。\n\n## 构建一个随机、不可达的目标\n\n让我们把目标做成一个绿色的甜甜圈。别忘了将普通的\
  \ 3D 网格包裹在物理网格中，以便轻松检测碰撞。\n\n```javascript\nvar goal = new Physijs.ConvexMesh(\n\
  \    new THREE.TorusGeometry(100, 25, 20, 30),\n    Physijs.createMaterial(new THREE.MeshBasicMaterial({color:0x00bb00})),\n\
  \    0\n);\ngoal.isGoal = true;\n```\n\n最后一行是我们告诉角色这是目标的方式。我们创建角色的碰撞检测时，让它检查这个`isGoal`属性。游戏中没有其他物体设置了这个属性，这让我们可以确定角色确实到达了目标。接下来我们做一些不同的事情：我们将目标放置在三个随机位置之一。在\
  \ JavaScript 中，随机数来自`Math.random()`。它是一个介于 0 和 1 之间的数字。因此，如果随机数小于 0.33，我们将目标放置在左上角（`width/-2,\
  \ height/2`）。如果随机数大于 0.66，我们将目标放置在右上角（`width/2, height/2`）。否则，我们将目标放置在洞穴天花板中间（`0,\
  \ height/2`）。\n\n```javascript\nfunction placeGoal() {\n    var x = 0,\n       \
  \ rand = Math.random();\n    if (rand < 0.33) x = width / -2;\n    if (rand > 0.66)\
  \ x = width / 2;\n    goal.position.set(x, height/2, 0);\n    scene.add(goal);\n\
  }\nplaceGoal();\n```\n\n我们将其做成一个函数，以便可以反复调用。当我们在下一章为游戏添加多个关卡时，每当玩家完成一个关卡，我们都需要调用`placeGoal()`。添加游戏重置功能时也是如此。如果你多次更新代码，你应该会看到目标在屏幕顶部移动到不同的位置。当然，这些目前都无关紧要——角色还没有办法到达屏幕顶部！！[](Image00419.jpg)\
  \ 让我们添加一种方法。\n\n## 构建可拖动的斜坡\n\n到达屏幕顶部还有很长的路要走。玩家至少需要两个斜坡才能到达顶部。为了构建两个行为相同但独立的斜坡，我们需要像第\
  \ 17 章（项目：学习 JavaScript 对象，第 159 页）那样构建一些 JavaScript 对象。我们首先定义斜坡构造函数。由于它构造对象，我们将构造函数名称大写为`Ramp`。在构造函数中，我们定义一个属性——斜坡网格，并调用三个方法：\n\
  \n```javascript\nfunction Ramp(x, y) {\n    this.mesh = new Physijs.ConvexMesh(\n\
  \        new THREE.CylinderGeometry(5, height * 0.05, height * 0.25),\n        Physijs.createMaterial(new\
  \ THREE.MeshBasicMaterial({color:0x0000cc}), 0.2, 1.0),\n        0\n    );\n   \
  \ this.move(x, y);\n    this.rotate(2*Math.PI*Math.random());\n    this.listenForEvents();\n\
  }\n```\n\n准备好的\n\n我们现在已经熟悉网格了，所以关于这个网格没什么好说的。与项目：紫色水果怪物游戏一样，我们将其制作成 Physijs 网格，以便\n\
  \n\n\n这样，角色就能在斜坡上加速。我们在构造函数末尾调用的三个方法用于初始化一个新的斜坡。`this.move()` 方法会根据构造函数中指定的数值移动斜坡。如果我们用\
  \ `new Ramp(100, 100)` 创建一个新斜坡，那么 `this.move(x, y)` 会将斜坡移动到 X=100, Y=100 的位置。接着，我们随机旋转斜坡一个角度。最后，我们告诉斜坡对象它需要监听事件。下面我们逐一查看这些方法。\n\
  \n`move()` 方法需要两个数值参数，用于指定斜坡需要移动的距离：\n\n```\nRamp.prototype.move = function (x,\
  \ y) {\n  this.mesh.position.x = this.mesh.position.x + x;\n  this.mesh.position.y\
  \ = this.mesh.position.y + y;\n  this.mesh.__dirtyRotation = true;\n  this.mesh.__dirtyPosition\
  \ = true;\n};\n```\n\n当我们移动斜坡时，实际上是在违背物理规律——前一秒斜坡可能还在屏幕中央且没有旋转，下一秒它就可能出现在 X=100,\
  \ Y=100 的位置并随机旋转。每当我们这样做时，都必须告诉物理引擎我们正在做一些非物理的操作，这就是为什么我们要设置 `__dirtyPosition` 和\
  \ `__dirtyRotation`。别忘了，就像在“添加游戏球”（第 148 页）中那样，这两个“脏”变量前面都有两个下划线。\n\n`rotate()`\
  \ 方法非常类似：构建可拖拽的斜坡\n\n```\nRamp.prototype.rotate = function (angle) {\n  this.mesh.rotation.z\
  \ = this.mesh.rotation.z + angle;\n  this.mesh.__dirtyRotation = true;\n  this.mesh.__dirtyPosition\
  \ = true;\n};\n```\n\n接下来是 `listenForEvents()` 方法，所有实际动作都在这里发生：\n\n```\nRamp.prototype.listenForEvents\
  \ = function () {\n  var me = this,\n      mesh = this.mesh;\n  mesh.addEventListener('drag',\
  \ function (event) {\n    me.move(event.x_diff, event.y_diff);\n  });\n  document.addEventListener('keydown',\
  \ function (event) {\n    if (!mesh.isActive) return;\n    if (event.keyCode !=\
  \ 83) return; // S\n    me.rotate(0.1);\n  });\n};\n```\n\n我们在这个方法开始时将 `this` 赋值给一个新变量\
  \ `me`，将 `this.mesh` 赋值给一个新变量 `mesh`。这样做主要是因为 JavaScript 对 `this` 的处理有时会出人意料——尤其是在处理事件时。JavaScript\
  \ 对 `this` 的修改有充分的理由，但在本书中我们不会深究。\n\n首先，我们监听拖拽事件，当游戏玩家点击并拖拽某个物体时触发。在这个例子中，斜坡会根据\
  \ `event.x_diff` 和 `event.y_diff` 的数值被拖拽，我们通过之前创建的 `move()` 方法让斜坡移动自身。\n\n接着，如果游戏玩家点击了一个斜坡（使其变为激活状态）并按下\
  \ S 键，那么我们会将斜坡旋转一小段角度。\n\n拖拽事件和 `isActive` 属性都来自我们在第 18.1 节“开始”（第 165 页）中添加的 `Mouse.js`\
  \ 库。没有这个库，这两者都无法工作。\n\n就是这样！我们现在可以按需构建任意数量的斜坡了。每个构建的斜坡都有自己的网格，并且可以自行移动。为了看到实际效果，让我们创建两个斜坡并将它们的网格添加到场景中：\n\
  \n```\nvar ramp1 = new Ramp(-width/4, height/4);\nscene.add(ramp1.mesh);\n\nvar\
  \ ramp2 = new Ramp(width/4, -height/4);\nscene.add(ramp2.mesh);\n```\n\n如果你用鼠标点击并拖拽这些斜坡，你会发现它们可以在游戏区域内任意移动。如果你点击斜坡并按下\
  \ S 键，可以让它们旋转。甚至有可能赢得游戏：\n\n![](img/Image00420.jpg)\n\n我们拥有一个包含相当复杂元素的游戏。唯一缺少的是结局。那么，让我们通过创建\
  \ `gameOver()` 函数来结束本章。\n\n准备就绪\n\n## 18.5 赢得游戏\n\n在本章开头，我们添加了两个 `<script>` 标签。我们已经充分利用了\
  \ `Mouse.js` 库来让斜坡移动和旋转。但我们还没有对 `Scoreboard.js` 库做任何操作。这里我们将用它来为游戏设置时间限制，并设置游戏结束消息。\n\
  \n让我们添加一个计分板，包含一个计时器、一个从 40 开始的倒计时、一些帮助文本，以及游戏结束时要执行的操作：\n\n```\nvar scoreboard\
  \ = new Scoreboard();\n\nscoreboard.timer();\nscoreboard.countdown(40);\n\nscoreboard.help(\"\
  获取绿色圆环。\" +\n  \"点击并拖拽蓝色斜坡。\" +\n  \"点击蓝色斜坡并按 S 键旋转。\" +\n  \"左右箭头移动玩家。\" +\n  \"\
  动作要快！\");\n\nscoreboard.onTimeExpired(function () {\n  scoreboard.setMessage(\"\
  游戏结束！\");\n  gameOver();\n});\n```\n\n赢得游戏\n\n这里我们几乎用到了 `Scoreboard.js` 的所有功能。其中大部分是计分板外观的简单指令：显示计时器、倒计时以及一些帮助文本。\n\
  \n我们对计分板做的最后一件事是使用一个函数来描述时间耗尽时发生的情况——将计分板消息设置为“游戏结束！”并调用 `gameOver()` 函数。\n\n我们已经调用过这个\
  \ `gameOver()` 函数——当角色与目标碰撞时我们调用了它。因此我们知道 `gameOver()` 需要处理时间还有剩余的情况。也就是说，如果角色在时间耗尽前到达目标，玩家就赢得了游戏。在这种情况下，我们将计分板消息设置为“胜利！”：\n\
  \n```\nvar pause = false;\nfunction gameOver() {\n  if (scoreboard.getTimeRemaining()\
  \ > 0)\n    scoreboard.setMessage('胜利！');\n  scoreboard.stopCountdown();\n  scoreboard.stopTimer();\n\
  \  pause = true;\n}\n```\n\n我们还告诉计分板停止它的计时器。最后，我们设置了一个 `pause` 变量。我们将用 `pause` 来告诉动画和物理函数停止运行。在这两个函数中，如果\
  \ `paused == true`，我们就在它们有机会再次调用自身之前返回。更新 `animate()` 函数，添加检查 `pause` 的代码行：\n\n\
  ```\nfunction animate() {\n  if (pause) return;\n  requestAnimationFrame(animate);\n\
  \  renderer.render(scene, camera);\n}\nanimate();\n```\n\n对 `gameStep()` 函数也做同样的处理：\n\
  \n```\nfunction gameStep() {\n  if (pause) return;\n  scene.simulate();\n  // 每秒更新物理\
  \ 60 次，使运动平滑\n  setTimeout(gameStep, 1000/60);\n}\ngameStep();\n```\n\n如果一切正常，并且你非常非常熟练，现在你应该能够赢得游戏。你甚至可能打破我的最高分！\n\
  \n![](img/Image00421.jpg)\n\n## 18.6 到目前为止的代码\n\n如果你想核对本章的代码，请参见第 255 页的附录 A1.18“代码：洞穴谜题”。\n\
  \n## 18.7 下一步\n\n这一章我们写了不少代码，但很值得，你不觉得吗？我们第一次体验了真正的面向对象编程。而我们的努力也换来了一款相当酷的游戏。\n\n\
  我们还可以对这个游戏做更多改进。在下一章中，我们将把它改造成一个多关卡的游戏。而且每个关卡的游戏难度都会增加！\n\n准备就绪\n\n完成本章后，你将：\n\n\
  • 掌握构建多关卡游戏的策略\n• 理解如何重置倒计时器\n• 看到编写逐步增加难度游戏的示例\n\n## 第 19 章 项目：多关卡游戏\n\n一旦你掌握了我们在第\
  \ 18 章“项目：洞穴谜题”（第 165 页）中编写的洞穴谜题游戏的玩法，赢得游戏就变得相当容易。作为游戏玩家，它很快就会变得无聊，你想继续体验更刺激的内容。作为游戏设计师，我们的职责是构建让玩家想一直玩下去的游戏。游戏应该从简单开始，然后逐渐变难（但绝不能不可能——玩不可能的游戏毫无乐趣）。考虑到这一点，让我们重新审视上一章的游戏草图。\n\
  \n![](img/Image00422.jpg)\n\n上次我们一直没有添加那些不可移动的障碍物，对吧？现在让我们来做这件事——但只在玩家第一次到达目标之后才添加。\n\
  \n### 19.1 开始之前\n\n在开始这个游戏之前，你需要先完成上一章的游戏。如果你已经完成了整个程序，让我们通过点击三线菜单按钮并选择“制作副本”来复制一份：\n\
  \n![](img/Image00423.jpg)\n\n我们制作副本是因为我们有一个花了些时间才写好的、运行良好的游戏。如果这个新游戏效果很好，我们以后可以随时删除旧版本，但制作副本总没有坏处。\n\
  \n\n\n\n# 永远不要丢弃可运行的代码\n\n![](img/Image00424.jpg)\n\n如果你有可运行的代码，务必确保在某个地方保留一份副本。你可能觉得接下来的改动很小，不会破坏任何东西。但在编程时，搞砸事情其实非常容易。一旦发生这种情况，备份就像黄金一样珍贵。你可以参考备份，或者删除新代码重新开始。\n\
  \n点击“制作副本”后，会弹出常规的保存对话框。将这个游戏命名为“多层洞穴谜题”，然后点击保存。\n\n![](img/Image00425.jpg) 现在我们可以开始编码了——所有的物理和摄像机工作已经在上一章完成了。\n\
  \n## 19.2 构建关卡\n\n程序员有很多方法让玩家在不同关卡之间移动。一种方法是清除屏幕上的所有内容——甚至场景本身——然后在下一关从头重建一个新场景。为此，游戏需要存储当前玩家的分数、玩家可能捡起的物品以及已完成的关卡等信息。这种方法在\
  \ Wii 或 Xbox 等主机上效果很好。\n\n### 构建关卡\n\n另一种处理关卡切换的方法是移除并创建特定的游戏元素——比如平台和障碍物——而场景的其他部分保持不变。随着游戏变得复杂，这种方法会变得非常困难。但在这个游戏中，我们只有少量障碍物，所以这种方法完全可行。\n\
  \n我们来构建一个 `Levels` 对象来存储这些信息。这与上一章中使用对象的原因略有不同。上一章我们使用 `Ramp` 对象来轻松创建多个斜坡。这次我们构建\
  \ `Levels` 对象，是因为将其视为一个整体会更方便思考。\n\n在记分板代码之后、`animate()` 函数之前添加 `Levels` 代码。按如下方式创建\
  \ `Levels` 函数构造函数，使其设置四个属性：\n\n```\nfunction Levels(scoreboard, scene) {\n  this.scoreboard\
  \ = scoreboard;\n  this.scene = scene;\n  this.levels = [];\n  this.current_level\
  \ = 0;\n}\n```\n\n`Levels` 对象需要了解这些信息才能完成其工作。它需要访问 `scoreboard` 来重置关卡之间的计数器。它需要访问\
  \ `scene` 来绘制和移除障碍物。它需要拥有不同关卡中物体的列表。最后，它需要知道当前是第几关。\n\n### 对象应只操作自己的属性\n\n![](img/Image00426.jpg)\n\
  \n我们其实不需要将 `scoreboard` 和 `scene` 对象传入构造函数。因为所有代码都在同一个地方，`Levels` 对象可以直接对 `scoreboard`\
  \ 变量进行操作。但永远不要这样做。\n\n![](img/Image00427.jpg)\n\n有两个原因。首先，如果我们将所有代码拆分成独立的 JavaScript\
  \ 库，那么 `scoreboard` 和 `scene` 在库中可能并不总是被定义。其次，你的代码会更整洁。面向对象编程并不容易。尽可能利用各种规则来避免混乱。这是一个好规则。\n\
  \n构造函数完成后，我们来定义 `Levels` 对象的方法。首先，我们需要一种添加新关卡的方法：\n\n```\nLevels.prototype.addLevel\
  \ = function (things_on_this_level) {\n  this.levels.push(things_on_this_level);\n\
  };\n```\n\n这个方法接收一个属于新关卡的物体列表。该列表包含玩家到达该关卡时需要显示的所有内容，也包含玩家完成该关卡时需要移除的所有内容。我们将它推入所有关卡的列表中。如果你觉得\
  \ `push` 这个名字很奇怪，那并不只有你一个人这么想。有时程序员不得不记住一些奇怪的名字。\n\n接下来，我们需要一种快速获取当前关卡中定义的对象的方法：\n\
  \n```\nLevels.prototype.thingsOnCurrentLevel = function () {\n  return this.levels[this.current_level];\n\
  };\n```\n\n记住，计算机喜欢从零开始计数。如果当前关卡是第零关，那么这个方法将返回 `this.levels[0]`，这是查找列表中第一个元素的另一种方式。\n\
  \n接下来，我们需要能够在场景中绘制当前关卡：\n\n```\nLevels.prototype.draw = function () {\n  var scene\
  \ = this.scene;\n  this.thingsOnCurrentLevel().forEach(function (thing) {\n    scene.add(thing);\n\
  \  });\n};\n```\n\n我们使用刚刚创建的 `thingsOnCurrentLevel()` 方法来获取需要绘制的物体列表。然后，对于每个物体，我们运行一个函数将其添加到场景中。\n\
  \n### 函数可能对 `this` 做出意外操作\n\n![](img/Image00428.jpg)\n\nJavaScript 函数可能会对 `this`\
  \ 做出奇怪的操作，这就是为什么我们要复制 `scene` 变量。在“项目：学习 JavaScript 对象”中，我们看到 `this` 通常指向当前对象。这没错，但在函数内部除外。在函数内部（比如我们用来向场景添加物体的那个函数），`this`\
  \ 指向函数本身。为了处理 JavaScript 的这个怪癖，程序员通常会在函数调用前复制 `this`（或其某个属性）。\n\n既然有绘制对象的方法，那么也需要有擦除它们的方法：\n\
  \n```\nLevels.prototype.erase = function () {\n  var scene = this.scene;\n  this.thingsOnCurrentLevel().forEach(function\
  \ (obstacle) {\n    scene.remove(obstacle);\n  });\n};\n```\n\n### 构建关卡\n\n现在轮到\
  \ `Levels` 做有趣的工作了。它需要能够在玩家通关后升级关卡。只要还有更多关卡，升级就应该擦除当前关卡，增加当前关卡编号，然后绘制下一关。最后，我们需要让倒计时计时器重置，但时间要稍微少一点。\n\
  \n```\nLevels.prototype.levelUp = function () {\n  if (!this.hasMoreLevels()) return;\n\
  \n  this.erase();\n  this.current_level++;\n  this.draw();\n\n  this.scoreboard.resetCountdown(50\
  \ - this.current_level * 5);\n};\n```\n\n## 准备就绪\n\n这是一个简洁的小方法，完全按照我们的意愿工作。编写像简单指令一样易读的代码并不容易（有时甚至不可能），但这样的代码是我们应该追求的。\n\
  \n`Levels` 对象还没有完全完成。`levelUp()` 方法做的第一件事是询问是否还有更多关卡。我们需要添加如下方法：\n\n```\nLevels.prototype.hasMoreLevels\
  \ = function () {\n  var last_level = this.levels.length - 1;\n  return this.current_level\
  \ < last_level;\n};\n```\n\n如果游戏中有两个关卡，那么在第一关时 `hasMoreLevels()` 应为 `true`，在第二关时应为\
  \ `false`。由于 JavaScript 喜欢从零开始计数，第一关时 `this.current_level` 为 0，第二关时为 1。换句话说，在两个关卡的游戏中，最后一关对应\
  \ `this.current_level` 为 1。\n\n### 从零开始计数可能很困难\n\n![](img/Image00429.jpg)\n\n从零而不是从一开始计数时进行数学运算可能会令人困惑。通常代入实际数字会有所帮助——尤其是列表末尾之前和之后的数字。\n\
  \n这样就完成了 `Levels` 对象的定义。在尝试使用它之前，添加以下 `buildObstacle()` 方法：\n\n```\nfunction buildObstacle(shape_name,\
  \ x, y) {\n  var shape;\n  if (shape_name == 'platform') {\n    shape = new THREE.CubeGeometry(height/2,\
  \ height/10, 10);\n  } else {\n    shape = new THREE.CylinderGeometry(50, 2, height);\n\
  \  }\n  var material = Physijs.createMaterial(\n    new THREE.MeshBasicMaterial({color:0x333333}),\n\
  \    0.2,\n    1.0\n  );\n  var obstacle = new Physijs.ConvexMesh(shape, material,\
  \ 0);\n  obstacle.position.set(x, y, 0);\n  return obstacle;\n}\n```\n\n这个方法构建两种不同类型的障碍物——平台和钟乳石。现在我们可以构建关卡了。创建一个新的\
  \ `Levels` 对象并添加前两个关卡：\n\n```\nvar levels = new Levels(scoreboard, scene);\nlevels.addLevel([]);\n\
  levels.addLevel([\n  buildObstacle('platform', 0, 0.5 * height/2 * Math.random())\n\
  ]);\n```\n\n钟乳石在天花板上。石笋在地面上。钟乳石紧紧抓住天花板。石笋从地面开始，可能触及天花板。\n\n\n\n\n]) ; 第一层没有任何障碍物，第二层有一个来自\
  \ `buildObstacle()` 函数的平台。最后需要做的是，当玩家在当前关卡到达目标时，调用 `levelUp()` 方法。为此，找到为角色添加碰撞事件监听器的代码，它应该类似这样：\n\
  \n```\navatar.addEventListener( 'collision' , function (object) { if (object.isGoal)\
  \ gameOver();\n}) ;\n```\n\n删除这段代码。\n\n现在，回到关卡代码下方，添加以下内容：\n\n```\navatar.addEventListener(\
  \ 'collision' , function (object) {\nif (!object.isGoal) return ; if (!levels.hasMoreLevels())\
  \ return gameOver(); moveGoal(); levels.levelUp();\n}) ;\n```\n\n这稍微修改了碰撞代码。如果角色撞到的不是目标（比如墙壁、斜坡和障碍物），我们仍然不做任何操作。我们还添加了一个检查，看是否还有更多关卡。如果没有更多关卡，则返回\
  \ `gameOver()` 函数的结果。如果还有关卡，则移动目标并升级关卡。\n\n### 为游戏添加收尾润色\n\n以下代码将移动目标（延迟 2 秒后）：\n\
  \n```\nfunction moveGoal() { scene.remove(goal); setTimeout(placeGoal, 2*1000) ;\n\
  }\n```\n\n这样就完成了。现在，如果你在第一关到达目标，你不会看到记分牌上显示“胜利！”消息，而是会看到一个只有单个障碍物的新关卡。如果你技术高超，可以在第二关后获胜：\n\
  \n准备就绪 ![](img/Image00430.jpg)\n\n### 19.3 为游戏添加收尾润色\n\n这已经是一个相当酷的游戏了，但我们为添加一些能让它更独特、更有趣的润色做好了准备。最明显的事情就是添加新关卡。你可以在第一关之后、`avatar.addEventListener()`\
  \ 之前尝试以下代码（也可以自己添加一些）：\n\n```\nlevels.addLevel([\nbuildObstacle('platform' , 0,\
  \ 0.5 * height/2 * Math.random()), buildObstacle('platform' , 0, -0.5 * height/2\
  \ * Math.random())]) ; levels.addLevel([\nbuildObstacle('platform' , 0, 0.5 * height/2\
  \ * Math.random()), buildObstacle('platform' , 0, -0.5 * height/2 * Math.random()),\
  \ buildObstacle('stalactite' , -0.33 * width, height/2), buildObstacle('stalactite'\
  \ , 0.33 * width, height/2)]) ;\n```\n\n我们还可以添加第 11 章“项目：水果狩猎”（第 99 页）中的一些音效。我们可以让角色在撞到非目标物体时发出“咔哒”声，在到达目标时播放吉他声。在\
  \ `avatar.addEventListener()` 下方、`moveGoal()` 之前添加以下代码：\n\n```\navatar.addEventListener(\
  \ 'collision' , function (object) {\nif (object.isGoal) Sounds.guitar.play(); else\
  \ Sounds.click.play();\n}) ;\n```\n\n如果需要音效，别忘了在顶部添加 `Sounds.js` 库：\n\n```\n<script\
  \ src=\"http://gamingJS.com/Sounds.js\"> < /script >\n```\n\n为了让游戏对玩家来说尽可能特别，你可以做各种各样的事情。发挥创意吧！\n\
  \n### 19.4 到目前为止的代码\n\n如果你想核对本章的代码，请将你的代码与附录 A1.19“代码：多关卡游戏”（第 259 页）中的代码进行对比。\n\
  \n### 19.5 下一步是什么\n\n这个游戏中的大部分动作都发生在二维空间中。诚然，我们使用了一些令人印象深刻的编程技巧（甚至一点点 3D 编程）来制作这个游戏。不过，让我们在下一个游戏中回到\
  \ 3D 编程。\n\n我们将在下一章中运用所有技能，所以开始吧！\n\n准备就绪\n\n完成本章后，你将能够：\n\n• 制作一个完整的 3D 游戏\n• 为游戏添加计分功能\n\
  • 理解如何将形状扭曲成新的东西\n\n## 第 20 章：项目：河流漂流\n\n作为我们的最终项目，让我们构建一个河流漂流游戏，玩家需要操控木筏沿着河流航行，躲避障碍物并尽可能收集加分点。游戏看起来像这样：\n\
  \n![](img/Image00431.jpg)\n\n我们还会添加一些自己的小玩意。\n\n### 20.1 开始\n\n我们首先在 ICE 代码编辑器中创建一个新项目。使用\
  \ 3D 入门项目（带物理引擎）模板，并将其命名为“河流漂流”。\n\n我们需要一个游戏记分牌，所以在第 4 行之后、普通的 `<script>` 标签之前插入一行，并添加以下内容：\n\
  \n```\n<script src=\"http://gamingJS.com/Scoreboard.js\"> < /script >\n```\n\n在\
  \ `<script>` 标签之后，将重力从 -100 改为 -20：\n\n```\nscene.setGravity(new THREE.Vector3(\
  \ 0, -20, 0 )) ;\n```\n\n你可以在完成项目后尝试调整这个数值，但这样会比初始的 -100 更真实。\n\n我们也要调整摄像机位置。在构建游戏时，鸟瞰视角会很有帮助。我们需要删除设置摄像机位置的那行代码——但不要删除下一行将摄像机添加到场景的代码！用以下两行替换它：\n\
  \n```\ncamera.position.set(250, 250, 250) ; camera.lookAt(new THREE.Vector3(0, 0,\
  \ 0)) ;\n```\n\n这会将摄像机向右、向上、向前移动 250 个单位。移动摄像机后，我们需要让它看向屏幕中心，第二行代码就是做这个的。\n\n最后，这是一个\
  \ WebGL 游戏，所以我们必须将 `CanvasRenderer` 改为 `WebGLRenderer`：\n\n```\nvar renderer = new\
  \ THREE.WebGLRenderer();\n```\n\n这就是目前需要在“开始编码”行上方做的所有事情。让我们向下移动到其余代码，开始制作内容吧！\n\
  \n### 20.2 组织代码\n\n我们的漂流游戏代码大纲可能如下所示：\n\n```\n// 不要输入这段代码！！！\naddSunlight(); addScoreboard();\n\
  addRiver(); addRaft();\n```\n\n现在先不要输入——我们的游戏最终看起来会有点不同。但你明白意思。\n\n我们将像第 15 章“项目：紫色水果怪物游戏”（第\
  \ 133 页）和第 16 章“项目：倾斜板”（第 145 页）那样使用代码大纲，但工作方式会略有不同。我们不会先写大纲，而是在构建函数的同时构建代码大纲。\n\
  \n开始一个项目没有绝对正确或错误的方法——选择最适合你的方式。一旦你完成了这个项目，你将在本书中尝试几种不同的方法，并可以为你的下一个项目选择最喜欢的一种。\n\
  \n组织代码 准备就绪\n\n### 添加阳光\n\n我们的木筏将要跳跃并撞到东西。如果有阴影，这会更有趣。为了有阴影，我们需要光。让我们在“开始编码”行下方开始我们的代码大纲，调用\
  \ `addSunlight()`：\n\n```\naddSunlight(scene);\n```\n\n为游戏添加阳光是一门艺术。既然你已经是程序员了，我告诉你一个秘密：当程序员说某件事更像是艺术而非科学时，我们其实只是在猜测。换句话说，我们尝试一些数值，然后调整它们直到看起来合适。以下数值对我们来说应该合适（但你可以随意自己调整！）：\n\
  \n```\nfunction addSunlight(scene) { var sunlight = new THREE.DirectionalLight();\n\
  sunlight.intensity = 0.5 ; sunlight.castShadow = true;\nsunlight.position.set(250,\
  \ 250, 250) ; sunlight.shadowCameraNear = 250\n; sunlight.shadowCameraFar = 600\
  \ ; sunlight.shadowCameraLeft = -200 ;\nsunlight.shadowCameraRight = 200 ; sunlight.shadowCameraTop\
  \ = 200 ;\nsunlight.shadowCameraBottom = -200 ; sunlight.shadowMapWidth =\n```\n\
  \n\n\n\n\n`4096 ; sunlight.shadowMapHeight = 4096 ;scene.add(sunlight); }` 这段代码看起来很多，似乎只是为了实现一个简单的光照。其实大部分内容都与\
  \ 3D 编程的艺术有关。实际上，只有前两行是真正必需的。它们告诉光源不要太亮（`intensity = 0.5`）并且要投射阴影（`castShadows =\
  \ true`）。那么剩下的行是做什么的呢？嗯，剩下的数字有助于生成漂亮的阴影，同时不让计算机负担过重。如果你不需要了解细节，可以跳到下一节。\n\n在场景中添加方向光就像在天空中加一个太阳。我们在场景中给方向光设置的位置描述了太阳在天空中的位置。这里它位于场景中心右侧\
  \ 250、前方 250、上方 250 的位置。因此，当这个方向光照射下来时，阴影会向左、向后投射，并落在地面上。\n\n我们本可以将每个数字都设为 1，效果也是一样的。太阳仍然会从天空中的同一方向（右侧、前方、上方）照射下来。我们使用\
  \ 250 并不是为了让“太阳”更远，而是因为将光源位置移远会移动光源的阴影盒。除了描述方向光在天空中的位置外，方向光的位置还为阴影盒提供了一个起点。计算机试图在场景中到处绘制阴影会耗费太多工作量。阴影盒是场景中绘制阴影的区域。这个盒子从方向光的位置开始。\n\
  \n`addSunlight()` 函数中的其余属性描述了该游戏的阴影盒。`shadowCameraNear` 属性指定了我们希望阴影从距离光源多远的地方开始出现。在这个例子中，直到光源距离相机\
  \ 200 时我们才需要阴影。通过将 `shadowCameraFar` 设置为 600，我们告诉相机在距离 600 之后可以停止绘制阴影。盒子的厚度为 400，这有助于计算机减少绘制阴影的工作量，从而将更多时间用于更重要的任务。`shadowCameraLeft`、`shadowCameraRight`、`shadowCameraTop`\
  \ 和 `shadowCameraBottom` 属性描述了阴影盒的宽度和长度。所有这些值都是通过实验选定的。在完成游戏编码后，欢迎你回来自己调整这些值。最后两个数字\
  \ `shadowMapWidth` 和 `shadowMapHeight` 描述了阴影的细节程度。数字越大，细节越多（计算机的工作量也越大，所以不要设得太大）。如果我们完全不设置这些属性，默认值\
  \ 512 对于我们的目的来说太低了，阴影会难以看清。4096 这个值是通过艺术手段或随机实验找到的。\n\n现在，我们的漂流游戏有了光照，接下来添加另一个重要的东西：用于记录分数的记分板。\n\
  \n## 记分\n\n我们将使用与《项目：紫色水果怪物游戏》和《项目：洞穴谜题》中类似的记分板。首先，在代码大纲中添加第二行：\n\n```\naddSunlight(scene);\n\
  var scoreboard = addScoreboard();\n```\n\n然后在 `addSunlight()` 函数下方添加以下函数定义：\n\n\
  准备就绪\n\n```\nfunction addScoreboard() {\n    var scoreboard = new Scoreboard();\n\
  \    scoreboard.score(0);\n    scoreboard.timer();\n    scoreboard.help('left /\
  \ right arrow keys to turn. ' +\n        'space bar to move forward.'\n    );\n\
  \    return scoreboard;\n}\n```\n\n我们之前见过这个 `Scoreboard` 代码。我们构造了一个带有计时器的新记分板对象，包含一些帮助文本，并将分数初始化为零。\n\
  \n在编写代码时，我们应该牢记代码大纲。现在我们的代码大纲中依次有 `addSunlight()` 和 `addScoreboard()`。在代码大纲下方，我们添加了\
  \ `addSunlight()` 函数，接着是 `addScoreboard()` 函数。我们将继续这样向大纲和函数定义中添加内容，以便于查找。\n\n这两个函数完成后，我们就可以进入下一节，开始编写一些非常酷的\
  \ 3D 编程代码了。\n\n## 20.3 变形形状以创造独特物体\n\n到目前为止，本书中我们通过组合基本形状成功构建了有趣的游戏。这通常足以创造出独特且具有挑战性的游戏。但有时我们需要将\
  \ 3D 编程再推进一步，以构建真正有趣的形状和地形。在本游戏中，我们将为河流这样做。\n\n我们将只用两个部分来构建河流：陆地和河水。我们的陆地是一个平面。河水也是一个平面，位于陆地稍下方。为了制作河流，我们将把部分陆地拉到水面以下。这是\
  \ 3D 动画中非常强大的技术，借助物理定律，它变得更加强大。让我们开始吧。\n\n将 `addRiver()` 函数添加到代码大纲的底部，使大纲现在看起来像这样：\n\
  \n```\naddSunlight(scene);\nvar scoreboard = addScoreboard();\nvar river = addRiver(scene);\n\
  ```\n\n在 `addRiver()` 函数内部（我们将它编码在 `addScoreboard()` 函数下方），我们将添加另一个代码大纲。这个代码大纲将描述如何构建河流：\n\
  \n```\nfunction addRiver(scene) {\n    var ground = makeGround(500);\n    addWater(ground,\
  \ 500);\n    addLid(ground, 500);\n    scene.add(ground);\n    return ground;\n\
  }\n```\n\n我们的代码现在调用了三个不存在的函数，因为我们还没有编写它们。这会在 JavaScript 控制台中产生错误，更重要的是，会破坏我们的代码，导致\
  \ ICE 代码编辑器屏幕上什么也不显示。为了防止这种情况，添加以下骨架函数：\n\n```\nfunction makeGround(size) { }\n\
  function addWater(ground, size) { }\nfunction addLid(ground, size) { }\n```\n\n\
  这些函数在被调用时不会做任何事情，但由于它们已被定义，就不会再出现错误，我们的代码也能再次运行。\n\n每个函数都会向我们的游戏世界添加平面。唯一复杂的是地面，因为我们需要将部分地面拉低以露出河水。最后一个函数绘制的盖子将是地面上的一个隐形屏障，这样我们的木筏就不会跳出河流。\n\
  \n让我们从 `makeGround()` 函数开始：\n\n```\nfunction makeGround(size) {\n    var faces =\
  \ 100;\n    var shape = new THREE.PlaneGeometry(size, size, faces, faces);\n   \
  \ var cover = Physijs.createMaterial(new THREE.MeshPhongMaterial({\n        emissive:\
  \ new THREE.Color(0x339933), // 略带绿色\n        specular: new THREE.Color(0x333333)\
  \  // 深灰色 / 不反光\n    }),\n    1,   // 高摩擦（难以移动）\n    0.1  // 弹性不大\n    );\n    var\
  \ ground = new Physijs.HeightfieldMesh(\n        shape, cover, 0\n    );\n    ground.rotation.set(-Math.PI/2,\
  \ 0.2, Math.PI/2);\n    ground.receiveShadow = true;\n    ground.castShadow = true;\n\
  \    return ground;\n}\n```\n\n这将生成一个平坦的绿色平面。（和往常一样，你不需要输入代码中的注释，尽管它们以后可能有助于你理解代码的含义。）\n\
  \n![](img/Image00432.jpg) ![](img/Image00433.jpg) 乍一看，这很像我们从第 1 章《项目：创建简单形状》（第 1\
  \ 页）开始就一直构建的网格。再仔细看一点，\n\n\n\n\n然而，仔细观察，你会发现一些不同之处。首先，我们构建了一个包含 100 个面（正方形）的平面。我们需要很多面，这样拉下其中一个面的角落时，不会拉下整个平面——只会影响它的一小部分。函数中的其他大部分代码都是我们已经见过的——使用\
  \ `Physijs.createMaterial()` 创建物理材质，并告诉网格它可以投射和接收阴影。这段代码中新增的是一个称为高度场网格的东西。这让物理引擎能够处理扭曲的形状（我们稍后会讲到）。另一个不同之处在于，我们需要在三个方向上旋转这个网格。实际上，两个\
  \ 90°（`Math.PI/2`）的旋转并不令人意外——它们让地面平躺而不是竖立。而 0.2 的轻微旋转则是一个巧妙的技巧，让河流看起来像是在推动木筏。就像球会滚下坡一样，我们的木筏也会如此。游戏玩家不需要知道是坡让木筏移动——他们可以相信是河流的作用。\n\
  \n当然，我们还没有河流，更不用说顺流而下的木筏了。现在就来解决这个问题。我们需要在 `makeGround()` 中添加两行代码来挖掘河流。第一行调用一个函数来实际挖掘，另一行将河流中的点列表添加到地面网格中。现在我们在创建地面形状的那一行下面添加以下代码：\n\
  \n```\nvar river_points = digRiver(shape, faces + 1);\n```\n\n然后在地面的阴影属性之后添加以下点：\n\
  \n```\nground.river_points = river_points;\n```\n\n整个 `makeGround()` 函数现在应该如下所示：\n\
  \n```\nfunction makeGround(size) {\n  var faces = 100;\n  var shape = new THREE.PlaneGeometry(size,\
  \ size, faces, faces);\n  var river_points = digRiver(shape, faces + 1);\n  var\
  \ cover = Physijs.createMaterial(\n    new THREE.MeshPhongMaterial({\n      emissive:\
  \ new THREE.Color(0x339933), // 一点绿色\n      specular: new THREE.Color(0x333333)\
  \ // 深灰色 / 不反光\n    }),\n    1, // 高摩擦（难以移动）\n    0.1 // 不太有弹性\n  );\n  var ground\
  \ = new Physijs.HeightfieldMesh(\n    shape, cover, 0\n  );\n  ground.rotation.set(-Math.PI/2,\
  \ 0.2, -Math.PI/2);\n  ground.receiveShadow = true;\n  ground.castShadow = true;\n\
  \  ground.river_points = river_points;\n  return ground;\n}\n```\n\n你能看出问题所在吗？没错——这会导致代码出错，因为我们还没有定义\
  \ `digRiver()` 函数。接下来我们就来做这件事。\n\n## 拉下角落\n\n我们通过在 `makeGround()` 函数之后输入以下代码来挖掘河流：\n\
  \n```\nfunction digRiver(shape, size) {\n  var center_points = [];\n  for (var row=0;\
  \ row<size; row++) {\n    var center = Math.sin(4*Math.PI*row/size);\n    center\
  \ = center * 0.1 * size;\n    center = Math.floor(center + size/2);\n    center\
  \ = row*size + center;\n    for (var distance=0; distance<12; distance++) {\n  \
  \    shape.vertices[center + distance].z = -5 * (12 - distance);\n      shape.vertices[center\
  \ - distance].z = -5 * (12 - distance);\n    }\n    center_points.push(shape.vertices[center]);\n\
  \  }\n  shape.computeFaceNormals();\n  shape.computeVertexNormals();\n  return center_points;\n\
  }\n```\n\n这个函数的主要目的是找到河流的中心，以便将中心及其周围的点拉下。我们通过将 `z` 属性设置为负数来拉下形状的顶点。\n\n在前面的函数中，我们逐行处理整个平面。第一个\
  \ `for` 循环将 `row` 变量设置为零，然后计算出该行河流中心的位置。从第 6 章“项目：移动准备好的手脚”（第 59 页）中，我们已经知道 `Math.sin()`\
  \ 可以生成一条优美的蜿蜒路径，所以这里再次使用它。\n\n计算并重新计算中心的四行代码决定了曲线数量、弯曲距离中心的偏移量、该点在当前行中的位置，以及该点在整个顶点列表中的位置。你可以尝试修改第一行中的\
  \ `4` 和第二行中的 `0.1`。如果你在学校学过三角学，就会知道这些数字代表正弦波的频率和振幅。不过，主要乐趣在于调整它们。\n\n我们在每一行中挖出一条沟渠，然后将它们组合成河流。我们从每行的中心点开始，向两侧各延伸十个顶点（正负距离）。最后，我们存储中心顶点，以便以后可以用来在河流上放置物体。\n\
  \n当所有行都挖出部分沟渠后，我们需要重新计算法线。3D 渲染器会努力跟踪面及其角点的指向方向。这个方向称为法线，它有助于光照、着色和阴影。我们不需要过多担心法线的工作原理，但需要告诉渲染器我们已经改变了它们，通过让形状调用\
  \ `computeFaceNormals()` 和 `computeVertexNormals()`。\n\n这样，我们就有了河流流经的沟渠（见图 9，“河流沟渠”，第\
  \ 194 页）。接下来添加实际的河流。\n\n## 欺骗眼睛\n\n添加河水以及防止木筏跳出河道的盖子对我们来说相当简单。我们需要两个平面——一个用于水，将是蓝色的，另一个用于盖子，将是不可见的。我们已经有了空的\
  \ `addWater()` 和 `addLid()` 函数，只需定义它们即可。我们添加以下代码来绘制水：\n\n```\nfunction addWater(ground,\
  \ size) {\n  var water = new Physijs.ConvexMesh(\n    new THREE.CubeGeometry(1.4*size,\
  \ 1.4*size, 10),\n    Physijs.createMaterial(\n      new THREE.MeshBasicMaterial({color:\
  \ 0x0000bb}),\n      0, // 无摩擦（像冰一样滑）\n      0.01 // 几乎没有弹性\n    ),\n    0 // 永不移动\n\
  \  );\n  water.position.z = -20;\n  water.receiveShadow = true;\n  ground.add(water);\n\
  }\n```\n\n这里的所有内容我们都熟悉，不过有几点值得一提。我们使用立方体而不是平面，以防止意外掉入水中。物理引擎虽然很酷，但并不完美。给水增加一点厚度可以减少这种错误发生的可能性。\n\
  \n水的尺寸是地面的 1.4 倍，这样木筏到达终点时就不会掉出世界。最后要注意的是，我们改变的是 Z 位置而不是通常的 Y 位置来上下移动。这是因为地面在添加到场景时已经被旋转了。\n\
  \n准备就绪\n\n## 建造比赛用的木筏\n\n这样，我们就拥有了一条蜿蜒穿过陆地的酷炫河流：\n\n![](img/Image00437.jpg) ![](img/Image00438.jpg)\n\
  \n最后，我们将盖子函数定义如下：\n\n![](img/Image00439.jpg)\n\n```\nfunction addLid(ground, size)\
  \ {\n  var lid = new Physijs.ConvexMesh(\n    new THREE.CubeGeometry(size, size,\
  \ 1),\n    new THREE.MeshBasicMaterial({visible:false})\n  );\n  ground.add(lid);\n\
  }\n```\n\n这个不可见的盖子是一个简单的添加，用于防止木筏跳出河岸。说到木筏，我们接下来就添加它。\n\n### 20.4 建造比赛用的木筏\n\n甜甜圈形状非常适合作为河流木筏。将\
  \ `addRaft()` 调用添加到顶部的代码大纲中：\n\n```\naddSunlight(scene);\nvar scoreboard = addScoreboard();\n\
  var river = addRiver(scene);\nvar raft = addRaft(scene);\n```\n\n现在，在河流代码的最后部分（应该是\
  \ `addLid()`）之后，我们像这样开始 `addRaft()`：\n\n```\nfunction addRaft(scene) {\n  var mesh\
  \ = new Physijs.ConvexMesh(\n    new THREE.TorusGeometry(2, 0.5, 8, 20),\n    Physijs.createMaterial(\n\
  \      new THREE.MeshPhongMaterial({\n        emissive: 0xcc2222,\n        specular:\
  \ 0xeeeeee\n      }),\n      0.1,\n      0.01\n    )\n  );\n  mesh.rotation.x =\
  \ -Math.PI/2;\n  mesh.castShadow = true;\n  scene.add(mesh);\n  mesh.setAngularFactor(new\
  \ THREE.Vector3(0, 0, 0));\n  var rudder = new THREE.Mesh(\n    new THREE.SphereGeometry(0.5),\n\
  \    new THREE.MeshBasicMaterial({color: 0x000099})\n  );\n  rudder.position.set(3,\
  \ 0, 0);\n  mesh.add(rudder);\n  return mesh;\n}\n```\n\n我们现在已经熟悉这段代码了。我们使用两个形状来构建木筏：一个圆环和一个球体。球体是一个小点，我们将其添加到木筏的前部，以便知道木筏的朝向。\n\
  \n\n\n此时木筏已添加到场景中，但并未位于河流起点。我们将在代码的下一部分中修改这一点。\n\n## 重置游戏\n\n到目前为止，在代码大纲中，我们有三个变量分别保存记分板、河流和木筏。这三个对象都已添加到场景中，因此除了让它们为游戏开始做好准备之外，没有太多其他操作。开始游戏并不总是与重置游戏完全相同，但在此情况下两者是一致的。因此，让我们在代码大纲中添加另一个函数\
  \ `startGame()`：\n\n```\naddSunlight(scene);\nvar scoreboard = addScoreboard();\n\
  var river = addRiver(scene);\nvar raft = addRaft(scene);\nstartGame(raft, river,\
  \ scoreboard);\n```\n\n在 `addRaft()` 下方，添加以下内容：\n\n```\nfunction startGame(raft,\
  \ river, scoreboard) {\n    var start = river.river_points[100];\n    raft.__dirtyPosition\
  \ = true;\n    raft.position.set(start.y, start.z + 100, 0);\n    raft.setLinearVelocity(new\
  \ THREE.Vector3());\n    scoreboard.resetTimer();\n    scoreboard.score(0);\n  \
  \  updateCamera();\n    camera.lookAt(new THREE.Vector3(start.y, 0, 0));\n}\n```\n\
  \n别忘了 `__dirtyPosition` 以两个下划线字符开头！\n\n## 准备就绪\n\n此函数中的代码必须同时适用于开始游戏和重新开始游戏。`setLinearVelocity()`\
  \ 调用每次都将木筏的速度设为零。如果没有这一行，玩家在比赛中途重新开始游戏时，会在起跑线上就以全速重新开始。\n\n除了将木筏放置在起跑线并重置记分板外，这段代码还通过先移动摄像机，然后让它看向起跑线来重新定位摄像机。`updateCamera()`\
  \ 移动摄像机；这是一个新函数，我们需要将其添加到 `startGame()` 函数正下方的代码中：\n\n```\nfunction updateCamera()\
  \ {\n    camera.position.set(\n        raft.position.x + 75,\n        raft.position.y\
  \ + 40,\n        raft.position.z\n    );\n}\n```\n\n我们将 `updateCamera()` 设为独立函数，以便\
  \ `animate()` 可以在每次场景更新时调用它。我们在 `animate()` 中 `renderer.render()` 这一行上方添加对 `updateCamera()`\
  \ 的调用，如下所示：\n\n```\nfunction animate() {\n    requestAnimationFrame(animate);\n\
  \    updateCamera();\n    renderer.render(scene, camera);\n}\nanimate();\n```\n\n\
  这确保了每次渲染场景时摄像机都会位于木筏前方。\n\n此时，你应该能看到木筏沿河流向下移动，摄像机全程跟随。当然，如果没有控制功能，这几乎毫无用处。\n\n以下键盘监听器和两个函数为游戏提供了基本控制。将它们添加到代码的最底部（在最后的\
  \ `</script>` 标签之前）。\n\n```\ndocument.addEventListener(\"keydown\", function (event)\
  \ {\n    var code = event.keyCode;\n    if (code == 32) pushRaft(); // 空格键\n   \
  \ if (code == 37) rotateRaft(-1); // 左箭头\n    if (code == 39) rotateRaft(1); //\
  \ 右箭头\n    if (code == 82) startGame(raft, river, scoreboard); // R 键\n});\n\nfunction\
  \ pushRaft() {\n    var angle = raft.rotation.z;\n    raft.applyCentralForce(\n\
  \        new THREE.Vector3(\n            500 * Math.cos(angle), 0,\n           \
  \ -500 * Math.sin(angle)\n        )\n    );\n}\n\nfunction rotateRaft(direction)\
  \ {\n    raft.__dirtyRotation = true;\n    raft.rotation.z = raft.rotation.z + direction\
  \ * Math.PI / 10;\n}\n```\n\n到目前为止我们已经多次见过键盘监听器，因此 `document.addEventListener()`\
  \ 应该已经很熟悉了。`pushRaft()` 函数使用了一个针对物理对象的新方法：`applyCentralForce()`。这不过是一种花哨的说法，意思是“从中间而不是边缘推动物体”。最后，旋转部分（包括\
  \ `__dirtyRotation`）应该也很熟悉——我们上次见到它是在第 18 章“项目：洞穴谜题”的第 165 页。\n\n至此，我们拥有了一个相当酷的游戏的基本组件！左箭头和右箭头键可以转动木筏，空格键则推动木筏朝其面向的方向前进。\n\
  \n我们还可以对这个游戏做更多改进。接下来将添加简单的计分功能以及河流中的一两个障碍物。\n\n## 20.5 设置终点线\n\n最终木筏会到达终点线。然后它会继续前进，一直前进。不如我们暂停游戏，让玩家在再次尝试之前有时间欣赏一下自己的分数。我们需要在四个地方进行修改：代码大纲、`startGame()`、`animate()`\
  \ 和 `gameStep()`。\n\n先从代码大纲开始。在调用 `startGame()` 函数之前，我们需要添加一行用于 `paused` 变量：\n\n\
  ```\nvar paused;\nstartGame(raft, river, scoreboard);\n```\n\n其他函数将使用该变量来决定是否需要运行动画或更新游戏。JavaScript\
  \ 对于变量的声明时机相当严格。经验法则是变量在使用前必须先声明。`paused` 变量将在调用 `startGame()`、`animate()` 和 `gameStep()`\
  \ 时被使用，因此我们在调用这些函数之前声明它。\n\n我们在 `startGame()` 函数中首次设置 `paused`。每当游戏启动时（这正是 `startGame()`\
  \ 所做的），游戏不应处于暂停状态。因此，我们在 `startGame()` 的底部将 `paused` 设为 `false`：\n\n```\nfunction\
  \ startGame(raft, river, scoreboard) {\n    var start = river.river_points[100];\n\
  \    raft.__dirtyPosition = true;\n    raft.position.set(start.y, start.z + 100,\
  \ 0);\n    raft.setLinearVelocity(new THREE.Vector3());\n    scoreboard.resetTimer();\n\
  \    scoreboard.score(0);\n    scoreboard.message('');\n    updateCamera();\n  \
  \  camera.lookAt(new THREE.Vector3(start.y, 0, 0));\n    paused = false;\n}\n```\n\
  \n接下来，我们告诉 `animate()` 函数，当游戏暂停时，它不需要渲染场景。也就是说，如果 `paused` 被设为 `true`，那么我们在更新摄像机或渲染场景之前就退出\
  \ `animate()` 函数：\n\n```\nfunction animate() {\n    requestAnimationFrame(animate);\n\
  \    if (paused) return;\n    updateCamera();\n    renderer.render(scene, camera);\n\
  }\n```\n\n我们在调用 `requestAnimationFrame()` 之后检查 `paused`，这样动画函数会继续运行——尽管它什么也不做。这样，当游戏重置且\
  \ `paused` 被设为 `true` 时，动画仍在运行，计算机无需额外工作即可更新摄像机。\n\n我们在 `gameStep()` 函数中也做了类似处理。如果游戏暂停，则立即退出该函数，不执行任何常规步骤：\n\
  \n```\nfunction gameStep() {\n    // 每秒更新物理 60 次，使运动平滑\n    setTimeout(gameStep,\
  \ 1000 / 60);\n    if (paused) return;\n    checkForGameOver();\n    scene.simulate();\n\
  }\n```\n\n注意，我们更改了 `gameStep()` 中函数调用的顺序，以适应暂停功能。`scene.simulate()` 和 `checkForGameOver()`\
  \ 调用都位于 `if (paused)` 语句之后——当游戏暂停时，模拟物理或检查游戏是否结束都没有意义。\n\n`checkForGameOver()` 函数是新增的。它可以紧跟在\
  \ `gameStep()` 函数之后，内容如下：\n\n```\nfunction checkForGameOver() {\n    if (raft.position.x\
  \ < 250) return;\n    paused = true;\n    scoreboard.stopTimer();\n    scoreboard.message(\"\
  你成功了！\");\n}\n```\n\n如果木筏的 X 位置尚未到达终点线（即 X 小于 250），则该函数什么也不做——立即返回，不执行其他操作。如果木筏已到达终点线，则将\
  \ `paused` 设为 `true`，以便所有其他函数停止工作。同时停止记分板计时器并添加一条显示消息。\n\n游戏应在河流终点处暂停，并显示玩家完成比赛所用的时间，以及“你成功了！”的消息。你甚至可能很快就能完成：\n\
  \n![](img/Image00440.jpg)\n\n## 按距离计分\n\n在某些游戏中，玩家仅仅因为离起点更远就能获得分数。计分属于 `gameStep()`\
  \ 方法中的逻辑，因为它是游戏逻辑，而非动画（动画应放在 `animate()` 函数中）。\n\n如果你希望木筏沿河流前进时分数不断增加，可以在 `gameStep()`\
  \ 中添加对 `updateScore()` 函数的调用：\n\n```\nfunction gameStep() {\n    // 每秒更新物理 60 次，使运动平滑\n\
  \    setTimeout(gameStep, 1000 / 60);\n    if (paused) return;\n    // ...（函数其余部分）\n\
  }\n```\n\n\n\n\n`updateScore(); checkForGameOver(); scene.simulate();` 由于我们旋转河流场景的方式，木筏的\
  \ X 位置会随着它沿河而下而改变。为了在木筏每前进 25 个单位距离时增加分数，我们可以使用以下代码（放在 `gameStep()` 函数下方）：\n\n```\n\
  var next_x;\nfunction updateScore() {\n    if (!next_x) next_x = raft.position.x\
  \ + 25 ;\n    if (raft.position.x >\n        next_x) {\n        scoreboard.addPoints(10);\n\
  \        next_x = next_x + 25 ;\n    }\n}\n```\n\n每次木筏到达下一个 X 得分点时，该函数会为分数增加 10\
  \ 分，并重新计算下一个 X 得分区域，使其再向前 25 个单位。\n\n另一个基于距离的得分功能是，在限定时间内完成漂流路线可获得时间奖励。我们通过在 `checkForGameOver()`\
  \ 函数中添加以下最后三行代码来实现：\n\n```\nfunction checkForGameOver() {\n    if (raft.position.x\
  \ < 250) return ;\n    paused = true;\n    scoreboard.stopTimer();\n    scoreboard.message(\
  \ \"You made it!\" ) ;\n    if (scoreboard.getTime() < 30) scoreboard.addPoints(100);\n\
  \    if (scoreboard.getTime() < 25) scoreboard.addPoints(200);\n    if (scoreboard.getTime()\
  \ < 20) scoreboard.addPoints(500);\n}\n```\n\n如果玩家在 30 秒内完成，将额外获得 100 分。如果玩家在 25\
  \ 秒内完成，则同时获得 100 分和额外的 200 分。如果玩家在 20 秒内完成，则获得 100 分、200 分以及额外的 500 分，总共可能赢得 800\
  \ 额外分。你能做到吗？\n\n## 能量道具得分\n\n许多游戏会奖励玩家收集奖励物品。如果我们想在木筏游戏中实现这一点，需要做两件事：将这些物品添加到河流中，并在木筏撞到这些物体时为玩家增加分数。\n\
  \n我们希望在游戏重置时添加物品，因此大部分工作需要在 `startGame()` 函数内部及其之后完成。但首先，我们需要声明一个变量来保存游戏中的物品列表。在代码大纲中，将其添加到\
  \ `paused` 变量和第一次调用 `startGame()` 之前：\n\n```\nvar game_items = [] ;\nvar paused;\n\
  startGame(raft, river, scoreboard);\n```\n\n然后，在 `startGame()` 的定义中，添加对 `resetItems()`\
  \ 的调用：\n\n```\nfunction startGame(raft, river, scoreboard) {\n    var start = river.river_points[100];\n\
  \    raft.__dirtyPosition = true;\n    raft.position.set(start.y, start.z + 100,\
  \ 0) ;\n    raft.setLinearVelocity(new THREE.Vector3());\n    scoreboard.resetTimer();\n\
  \    scoreboard.score(0);\n    scoreboard.clearMessage();\n    updateCamera();\n\
  \    camera.lookAt(new THREE.Vector3(start.y, 0, 0)) ;\n    resetItems(river, scoreboard);\n\
  \    paused = false;\n}\n```\n\n由于对 `resetItems()` 的调用在相机更改之后，因此 `resetItems()`\
  \ 函数的定义应放在像 `updateCamera()` 这样的相机函数之后。这个函数的定义很简单。它调用了另外两个函数——一个用于从屏幕上移除所有现有物品，另一个用于向屏幕添加新物品：\n\
  \n```\nfunction resetItems(ground, scoreboard) {\n    removeItems();\n    addItems(ground,\
  \ scoreboard);\n}\n```\n\n从游戏中移除物品只需将每个物品从场景中移除即可。一旦每个物品被移除，我们就可以将游戏物品列表设置为空列表：\n\
  \n```\nfunction removeItems() {\n    game_items.forEach(function (item) {\n    \
  \    scene.remove(item);\n    }) ;\n    game_items = [] ;\n}\n```\n\n向河流中添加物品才是开始变得有趣的地方。地面仍然具有\
  \ `river_points` 属性。我们将使用该点列表在河流的若干位置随机放置能量水果。随机放置水果将使每局新游戏对玩家来说都是不同的挑战。\n\n不过我们并不希望完全随机。如果完全随机，可能会将两个水果放在同一位置，或者一个正好放在起点。\n\
  \n回想一下，地面有 100 个面，并且我们使用地面上的 100 个点来描述河流的中间位置。让我们在河流点 20 附近随机放置一个能量水果，在点 70 附近再放一个。以下代码可以实现我们的需求：\n\
  \n```\nfunction addItems(ground, scoreboard) {\n    var points = ground.river_points;\n\
  \    var random20 = Math.floor(20 + 10 * Math.random()),\n        fruit20 = addFruitPowerUp(points[random20],\
  \ ground, scoreboard);\n    game_items.push(fruit20);\n    var random70 = Math.floor(70\
  \ + 10 * Math.random()),\n        fruit70 = addFruitPowerUp(points[random70], ground,\
  \ scoreboard);\n    game_items.push(fruit70);\n}\n```\n\n这段代码的主要目的是调用我们即将构建的 `addFruitPowerUp()`\
  \ 函数。然后将 `fruit20` 和 `fruit70` 物品推入所有游戏物品的列表中（以便后续可以按需移除）。\n\n`random20` 和 `random70`\
  \ 数字乍看可能有点复杂，但仔细看，它们应该是有意义的。我们只看 `random20` 来更好地理解。`Math.random()` 函数生成一个介于 0 和\
  \ 1 之间的数字。\n\n- 如果 `Math.random()` 为 0，则 `10 * Math.random()` 为 0，使得 `20 + 10 *\
  \ Math.random()` 最终为 20。\n- 如果 `Math.random()` 为 0.5，则 `10 * Math.random()` 为 5，使得\
  \ `20 + 10 * Math.random()` 最终为 25。\n- 如果 `Math.random()` 为 1，则 `10 * Math.random()`\
  \ 为 10，使得 `20 + 10 * Math.random()` 最终为 30。\n\n换句话说，由于 `Math.random()` 保证在 0 到 1\
  \ 之间，我们保证得到一个介于 20 和 30 之间的数字。\n\n随机数被包裹在 `Math.floor()` 函数调用中。`Math.floor()` 会去掉小数点后的所有内容。如果\
  \ `Math.random()` 返回 0.01，那么 `10 * Math.random()` 将得到 0.1。`Math.floor()` 去掉小数点及其后的内容，剩下\
  \ 0。\n\n随机数从 `river_points` 属性中获取一个点，然后传递给 `addFruitPowerUp()`。该函数主要执行我们之前见过的操作——构建一个物理网格，分配碰撞事件监听器，并将黄色水果添加到场景中：\n\
  \n```\nfunction addFruitPowerUp(location, ground, scoreboard) {\n    var mesh =\
  \ new Physijs.ConvexMesh(\n        new THREE.SphereGeometry(10, 25),\n        new\
  \ THREE.MeshPhongMaterial({emissive: 0xbbcc00}),\n        0\n    );\n    mesh.receiveShadow\
  \ = true;\n    mesh.castShadow = true;\n    mesh.addEventListener('collision', function\
  \ () {\n        var list_index = game_items.indexOf(mesh);\n        game_items.splice(list_index,\
  \ 1);\n        scene.remove(mesh);\n        scoreboard.addPoints(200);\n       \
  \ scoreboard.message('Yum!');\n        setTimeout(function () {\n            scoreboard.clearMessage();\n\
  \        }, 2.5 * 1000);\n    });\n    ground.updateMatrixWorld();\n    var p =\
  \ new THREE.Vector3(location.x, location.y, -20);\n    ground.localToWorld(p);\n\
  \    mesh.position.copy(p);\n    scene.add(mesh);\n    return mesh;\n}\n```\n\n\
  在碰撞处理函数中，我们做的第一件事是将水果从游戏物品列表中移除。JavaScript 并不容易做到这一点——我们获取要移除物品的索引（在列表中的位置），然后通过拼接从该索引到下一个索引来移除它。有一本著名的\
  \ JavaScript 书叫 *JavaScript: The Good Parts* ——从列表中移除东西绝对不在那本书里（你应该读一读）。\n\n- 204\
  \ 到目前为止的代码\n\n另一个新内容是使用 `localToWorld()` 方法将局部坐标转换为世界坐标。在本书的大部分内容中，我们发现使用参考坐标系非常有用——这对\
  \ 3D 程序员来说是一个宝贵的技巧。但有时我们不得不将物体放回常规的场景坐标中。这就是其中一次。`localToWorld()` 方法为我们提供了随机河流点的场景坐标，这样当水果被添加到场景中时，看起来就像是被添加到了河流中。\n\
  \n在调用 `localToWorld()` 之前，最好先对需要世界坐标的物体调用 `updateMatrixWorld()`。矩阵是一种数学方式，用于描述 3D\
  \ 中的位置、方向和其他值。`updateMatrixWorld()` 调用确保这些值都是最新且准确的。\n\n至此，我们有了两个水果，它们可以帮助你在游戏中疯狂得分。你甚至可能打破我的最高分：\n\
  \n\n\n\n\n# 20.6 到目前为止的代码\n\n如果你想核对本章中的代码，请参考第 265 页的附录 A1.20《代码：河流漂流》。\n\n# 20.7\
  \ 接下来是什么\n\n代码量很大，但值得。我们运用了许多技能，涉及物理、光照和材质。我们还通过拉取形状的顶点并将局部坐标转换为“世界”坐标，初步领略了 3D\
  \ 编程的其他可能性。\n\n和我们的其他游戏一样，不要认为这是最终版本。你还可以添加很多内容。也许你可以加入障碍物来扣分？添加一些跳跃？像我们在第 177 页第\
  \ 19 章《项目：多层级游戏》中那样，做成多层级游戏？让赛道更长？你可以尝试添加摄像机控制，这样就能从漂流乘客的视角观看，而不是从上方俯视一切。或者，你可能已经有了我甚至无法想象的改进这个游戏的想法。\n\
  \n在最后一章中，我们将转换方向，把我们的项目发布到网络上。完成本章后，你将：\n\n- 更清楚地了解构成网站的各个部分\n- 理解构建我们自己的网站需要什么\n\
  - 知道如何将项目发布到像 Tumblr 这样的网站上\n\n# 第 21 章：将代码发布到 Web 上\n\n既然我们在用 Web 语言编程，那么快速了解一下\
  \ Web 的工作原理是值得的。我们不会深入太多细节——只够让我们理解为什么在本书中要做某些事情。\n\n## 一张抽象图胜过千言万语\n\n![](img/Image00442.jpg)\n\
  \n你可能听说过“一图胜千言”这句话。像你我这样的程序员，大脑中做了大量工作。当我们思考一个问题或试图想出一种酷炫的新方法时，我们会在脑海中形成问题的图像。这些脑海中的图像被称为**抽象**。\n\
  \n抽象并不总是包含大量细节。它们通常只包含足够帮助我们理解问题的信息。云的抽象可能是它由一大堆棉球组成。这个心理图像足以理解云的形状和外观，有时这就足够了。\n\
  \n但抽象并不总是够用。如果我们试图理解云为什么会下雨，那么“云是由棉球组成的”这个想法根本帮不上忙。\n\n在我们讨论 Web 时请记住这一点。我们正在使用抽象，它们在大多数时候会有所帮助。但有时它们会是湿棉球。\n\
  \n## 21.1 强大无比的浏览器\n\n请看强大的浏览器：\n\n![](img/Image00444.jpg)\n\nWeb 浏览器是一种我们每天使用的极其复杂的技术。令人惊讶的是，它在某些方面也相当笨拙。\n\
  \n当我们告诉浏览器我们想要一个网站或网站上的某个页面时，它会通过互联网向一台公开可用的机器发送请求：\n\n![](img/Image00445.jpg)\n\
  \n如你所见，当你让浏览器显示一个网站时，浏览器会通过互联网发出一个请求。这个请求向某个特定的 Web 服务器索要它拥有的信息。这些信息可能是 HTML 网页、图像、视频，也可能是\
  \ JavaScript。\n\n为了到达正确的服务器，我们的浏览器必须查找 Web 服务器的公共互联网地址。Google 的`www.google.com`的互联网地址是`173.194.73.147`。地址中的数字足以让互联网将浏览器的请求发送到\
  \ Web 服务器。\n\n### Web 服务器必须在互联网上公开可用\n\n请记住，承载网站的机器必须在互联网上公开可用。你在家里使用的机器几乎从不公开可用。即使互联网上的其他人知道你的机器的网络地址，他们仍然无法访问它，因为它不是公开可用的。\n\
  \n![](img/Image00446.jpg)\n\n不幸的是，这意味着你通常需要花一点钱才能让你酷炫的 Web 游戏在互联网上可用。你需要向 Web 托管公司付费来托管你的游戏。\n\
  \n当浏览器的请求到达 Web 服务器时，服务器会检查它是否有请求的项目。Web 服务器可以存储各种信息：\n\n![](img/Image00447.jpg)\n\
  \n通常，浏览器发送给服务器的第一个请求是请求一个 HTML 网页：\n\n![](img/Image00448.jpg)\n\n如果服务器有用户正在寻找的网页，那么它会将其发送回浏览器：\n\
  \n![](img/Image00449.jpg)\n\n这就是比较笨拙的部分。网页通常很小且无趣。网页通常看起来漂亮并做很多了不起的事情，但单独来看它们并不漂亮。一个网页本身无法做很多了不起的事情。要想有任何有趣的事情发生，网页需要告诉浏览器发出大量其他请求。\n\
  \n我们在第 85 页第 9 章《其他代码都是什么？》中见过 HTML 网页。它们有尖括号，这些是对浏览器重要的标记：\n\n```html\n<body>\n\
  <h1> 你好！</h1>\n<p>你可以制作<b> 粗体</b>字、<i> 斜体</i>字，\n甚至<u> 下划线</u>字。\n</p>\n<p>\n你可以链接到\n\
  <a href=\"http://gamingJS.com\"> 其他页面</a>。你还可以添加来自\nWeb 服务器的图像：\n<img src=\"/images/purple_fruit_monster.png\"\
  >\n</p>\n</body>\n```\n\n一些标记包含 JavaScript 文件、图像或样式，这些能让酷炫的事情发生。因此，一旦浏览器获取了它请求的网页，它就必须请求大量其他东西：\n\
  \n![](img/Image00450.jpg)\n\n而这一切中最笨拙的部分是：浏览器通常必须等待大部分或所有这些内容返回后，才能做重要的事情。\n\n有两种方法可以在做重要工作之前等待一切就绪。第一种是我们一直在做的——将最重要的内容放在\
  \ HTML 文档的最后：\n\n```html\n<body></body>\n<script>\n// 这就是我们一直编码的地方——在<body>标签之后\n\
  </script>\n```\n\n在这种情况下，我们将`<script>`标签放在文档的最底部，这意味着浏览器会在运行我们的代码之前显示网页内容（文本、图像、样式信息等）。希望当浏览器运行那段代码时，其他所有内容都已准备就绪。\n\
  \n另一种处理这种情况的方法是使用一种称为`on-dom-ready`的浏览器技巧。DOM 代表文档对象模型。当浏览器思考网页时，它们使用 DOM。浏览器还允许\
  \ Web 程序员使用 DOM 来修改网页（更改颜色、显示弹出框）。当浏览器读取网页并将其转换为 DOM 时，DOM 被称为“就绪”。通过`on-dom-ready`，我们监听文档：\n\
  \n```javascript\n// 等待网页完全加载\ndocument.addEventListener(\"DOMContentLoaded\", function\
  \ () {\n    document.body.appendChild(renderer.domElement);\n});\n```\n\n这个技巧放在\
  \ JavaScript 中，而不是网页中，并利用了网页的一个重要特性：它们喜欢大声宣布发生的事情。很多时候，当浏览器大声宣布时，没有人或任何东西在监听。但知道浏览器会这样做，就给了我们力量。\n\
  \n在这种情况下，我们有能力监听一个特定的浏览器事件：`DOMContentLoaded`。当浏览器加载页面所需的所有内容时，浏览器会向任何感兴趣的人宣布。在这里，我们告诉浏览器，是的，我们感兴趣，并且当这样的事件发生时，我们应该将我们的\
  \ 3D 渲染器添加到页面中。\n\n## 21.2 免费网站\n\n之前我们提到，只有公开可用的 Web 服务器才能提供网页、图像、JavaScript 等。通常这需要花一些钱。但有一些方法可以让你的网页和\
  \ JavaScript 游戏免费公开可用：\n\n- Tumblr\n- Blogger\n- WordPress\n\n![](img/Image00451.jpg)\n\
  \n### 何时可能需要付费\n\n\n\n\n我们刚刚讨论了如何在不付费的情况下获得一个公开网站。那为什么还需要付费呢？答案是：当你的网站需要存储新信息时，你就需要付费。如果网站需要记录用户信息，那么你需要付费来获得存储这些信息的空间。如果网站需要记住玩家的分数，那么你也需要付费来保存这些数据。\n\
  \n1. http://tumblr.com\n2. http://blogger.com\n3. http://www.wordpress.com\n\n#\
  \ 将代码部署到其他网站\n\n大多数免费网站都有自己创建网页、脚本文件和图片的方式。为了了解如何将我们的一些项目复制到真实网站中，我们将以在 Tumblr 上部署一个\
  \ 3D 动画为例。\n\n## 21.3 将代码部署到其他网站\n\n本节假设你已经拥有一个 Tumblr 账户（或其他类似服务的账户）。这些说明应该适用于大多数网站，但所有发布服务都有各自的特性，你可能需要自行调试。另外请注意，Tumblr\
  \ 的控件可能会随时间变化，外观和功能可能与这里展示的不完全一致。\n\n将我们的代码发布到 Tumblr 相当简单。像平常一样开始一篇新帖子，但务必点击帖子工具栏中的\
  \ `<html>` 按钮：\n\n![](img/Image00452.jpg)\n\n启用后，`<html>` 按钮应显示为蓝色（但根据你的 Tumblr\
  \ 主题，颜色可能不同）。\n\n接下来，添加一些 HTML 代码，并为你的模拟程序预留一个位置。以下代码创建了一个短段落，接着是放置 3D 游戏的位置，然后是另一个短段落：\n\
  \n```\n<p> 这是我做的！</p>\n<div id=\"ice-code-2013-06-06\">\n<p>它来自《3D 游戏编程》的第一章\n<a\
  \ href=\"http://gamingjs.com \">3D 游戏编程</a>。 </p>\n```\n\n重要的是，`<div>` 的 `id=` 属性必须是唯一的——页面上不能有其他标签使用相同的\
  \ `id=`。一个好的命名方案是结合用途（如 `ice-editor`）和当前日期（例如 `2013-06-06`）。你可以随意更改 `<p>` 标签内的文字。\n\
  \n接下来，从 ICE 中复制你的代码，并粘贴到 Tumblr 帖子中。从 ICE 复制代码时，务必跳过包含 `<body> </body>` 的第一行。只从第一个\
  \ `<script>` 标签复制到末尾。\n\n将这段代码粘贴到我们之前添加的 HTML 下方（参见第 214 页的图 10，Tumblr 帖子）。\n\n\
  我们还没有完成。本书中编写的代码会占据整个浏览器窗口。而在这些帖子中，我们只想占用帖子的一小部分。我们还需要将动画附加到之前添加的 `<div>` 上。\n\n\
  准备就绪\n\n![](img/Image00453.jpg)\n\n图 10——Tumblr 帖子\n\n![](img/Image00454.jpg)\n\n\
  要调整大小，请修改 `aspect_ratio` 和渲染器尺寸。要使渲染器宽 400、高 300，你可以这样写：\n\n```\n// 这将把相机看到的内容绘制到屏幕上：\n\
  var renderer = new THREE.CanvasRenderer();\nrenderer.setSize(400, 300);\n```\n\n\
  那么宽高比如下：\n\n```\n// 这是观察物体的视角：\nvar aspect_ratio = 400/300;\nvar camera = new THREE.PerspectiveCamera(75,\
  \ aspect_ratio, 1, 10000);\n```\n\n数学高手们会知道，你也可以将宽高比写成 `4/3`。你不必使用这些数字——可以自行实验，找到最适合页面的数值。\n\
  \n## 接下来做什么\n\n最后，将动画附加到 `<div>` 标签。找到添加 `renderer.domElement` 的那一行（它应该类似于 `document.body.appendChild(renderer.domElement)`）。将其修改为将渲染器的\
  \ `domElement` 添加到 `<div>` 标签中：\n\n```\ndocument.getElementById('ice-code-2013-06-06').appendChild(renderer.domElement);\n\
  ```\n\n请确保将 `getElementById()` 方法调用中的值替换为你之前为 `<div>` 标签设置的 `id=` 值。\n\n完成这些后，你应该能够发布帖子并看到你的成果：\n\
  \n![](img/Image00455.jpg)\n\n别忘了在本书论坛上分享你的作品：http://pragprog.com/book/csjava/3dgameprogramming-for-kids?tab=tab-forums\
  \ ！\n\n## 21.4 接下来做什么\n\n现在你要靠自己了！我已经倾囊相授，是时候释放你的创造力了。本书中的所有游戏都不是最终成品。每个游戏都可以变得更好，但前提是你需要添加代码并增强游戏体验。坚持读完这本书，你已经学到了很多。而现在才是真正有趣的时候——你会发现凭借自己能做到什么。这是我能想象到的最激动人心的冒险。\n\
  \n祝你好运！如果需要帮助，别忘了在本书论坛上提问！我期待听到你的进展。\n\n准备就绪\n\n# 附录 1 项目代码\n\n本附录包含本书中所有项目的完整版本。你的代码可能与以下代码不完全相同——这没关系。提供这些代码是为了方便你在遇到问题时，能够与可运行的版本进行对比。\n\
