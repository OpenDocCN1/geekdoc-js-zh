  \n## A2.5 Sounds.js\n\nSounds.js JavaScript 库包含了游戏中所需的最基本的声音。完整的最新文档可在 https://github.com/eee-c/Sounds.js\
  \ 获取。\n\n要使用 Sounds.js 库，必须在 `<script>` 标签中引入它：\n\n```\n<script src=\"http://gamingJS.com/Sounds.js\"\
  ></script>\n```\n\n在撰写本文时，共有十一种声音可用：bubble、buzz、click、donk、drip、guitar、knock、scratch、snick、spring\
  \ 和 swish。每种声音都可以通过类似下面的代码播放：\n\n`Sounds.bubble.play();`\n\n要让声音重复播放，将 `play()`\
  \ 方法替换为 `repeat()`：\n\n`Sounds.bubble.repeat();`\n\n要在稍后停止声音，调用 `stop()` 方法：\n\n\
  `Sounds.bubble.stop();`\n\n如果你希望声音重复播放固定时间，那么可以启动重复声音，并设置一个超时来停止声音：\n\n`Sounds.bubble.repeat();\
  \ setTimeout(function (){Sounds.bubble.stop();}, 5*1000);`\n\n上面的代码会启动重复的气泡声。5 秒后，超时函数运行，停止重复的气泡声。\n"
