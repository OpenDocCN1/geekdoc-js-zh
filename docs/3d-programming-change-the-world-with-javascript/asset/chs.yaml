  \ `rotation.z` 的变化，那你的猜测不错。但那样行不通。手和脚会像头部一样在原地旋转。\n\n这个问题的答案是一种非常强大的 3D 编程技术。我们将所有身体部分组合在一起，然后旋转这个组。这是一个简单的想法，但正如你之后会发现的那样，它出奇地强大。\n\
  \n要将身体部分组合在一起，我们将各部分添加到虚拟角色上，而不是场景中。\n\n### 做侧手翻\n\n如果你回头看右手的代码，会发现我们把它添加到了场景中。我们将更改那一行。\n\
  \n```\nvar right_hand = new THREE.Mesh(hand, cover);\nright_hand.position.set(-150,\
  \ 0, 0);\n❶ scene.add(right_hand);\n```\n\n❶ 更改这一行。不再将手添加到场景，而是添加到虚拟角色上：\n\n```\n\
  var right_hand = new THREE.Mesh(hand, cover);\nright_hand.position.set(-150, 0,\
  \ 0);\n❶ avatar.add(right_hand);\n```\n\n❶ 这一行现在将右手添加到虚拟角色上，而不是场景中。对 `left_hand`、`right_foot`\
  \ 和 `left_foot` 也做同样的操作后，你的虚拟角色应该就能做侧手翻了——而且不会丢失任何部件！\n\n![](img/Image00173.jpg)\
  \ 有时我们可能不希望虚拟角色做侧手翻。让我们添加一行代码来控制它。\n\n```\n❶ var is_cartwheeling = false;\nfunction\
  \ animate() {\n  requestAnimationFrame(animate);\n  ❷ if (is_cartwheeling) {\n \
  \   avatar.rotation.z = avatar.rotation.z + 0.05;\n  }\n  renderer.render(scene,\
  \ camera);\n}\nanimate();\n```\n\n❶ 这里我们指定虚拟角色是否在做侧手翻。如果设为 `true`，则虚拟角色在做侧手翻。如果设为\
  \ `false`（就像我们这里做的），则虚拟角色不会做侧手翻。\n\n❷ 将 `avatar.rotation` 包裹在 `if` 中，如图所示。不要忘记这一行和\
  \ `avatar.rotation` 行之后的花括号。\n\n将 `is_cartwheeling` 的值从 `false` 改为 `true`。虚拟角色是否又开始做侧手翻了？\n\
