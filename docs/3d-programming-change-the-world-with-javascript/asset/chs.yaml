  \ 4 章“项目：移动虚拟角色”（第 35 页）中要做的事情。\n\n\n\n\n现在，花点时间调整构成你虚拟形象的各部分的大小、位置和旋转角度。完成本章后，你将能够：\n\
  \n*   使用键盘移动虚拟形象\n*   初步了解 JavaScript 事件\n*   能够随虚拟形象移动摄像机\n\n# 第 4 章 项目：移动虚拟形象\n\
  \n在第 3 章“项目：制作虚拟形象”（第 25 页）中，我们介绍了如何构建一个游戏虚拟形象。一个无法移动的虚拟形象相当乏味。因此，在本章中，你将学习如何让虚拟形象向不同方向移动。我们还会给它一个小森林供其穿梭。最终效果大致如下：\n\
  \n![](img/Image00175.jpg)\n\n### 4.1 准备工作\n\n本章基于我们在“项目：制作虚拟形象”中所做的工作。如果你尚未完成该章的练习，请先返回完成后再继续。特别地，你需要完成该章末尾的\
