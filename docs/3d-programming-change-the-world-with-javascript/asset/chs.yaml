- "# 3D 编程：JavaScript 改变世界\n\n\n\n## 引言\n\n欢迎来到编程世界！\n\n说实话，编程有时会让人感到沮丧（我每周至少哭一次）。但这一切痛苦都是值得的。你可以让这个世界随心所欲地运转，可以与别人分享你的世界，可以建造真正改变世界的东西。\n\
  \n你手中这本充满渴望的书，是开始编程的绝佳途径。它充满了清晰易懂的解释。最棒的是，我们还能制作一些相当酷的游戏。这将是一次激动人心的旅程。\n\n### 我是如何学会编程的\n\
  \n小时候，我从书中抄写电脑游戏程序。那是很久以前的事了，所以我买的书里全是程序，然后我把它们输入到电脑里。\n\n\n\n\n当我刚开始做这件事时，我完全不知道自己在做什么。渐渐地，我开始识别出一些反复出现的模式，并几乎理解了它们。我开始做出一些改变——起初只是小改动——看看会发生什么。然后我开始进行更大的改动。最终，我变得相当熟练。经过很长一段时间，我能够编写自己的程序了。我希望这本书能让你做到同样的事情，但有一个重要的区别：我会解释其中的原理，这样你就不必再猜测太多。\n\
  \n## 本书所需条件\n\n并非所有网页浏览器都能生成我们在本书中将要构建的炫酷 3D 游戏对象。为了充分利用本书，你应该在计算机上安装谷歌 Chrome 浏览器（https://www.google.com/chrome/）。其他浏览器也能工作，但本书中的一些练习依赖于谷歌\
  \ Chrome 独有的功能。有一个浏览器肯定无法完成这些练习，那就是微软 Internet Explorer。\n\n对于本书中的大部分练习，任何安装了谷歌\
  \ Chrome 的计算机都足够了。后续涉及有趣光照、阴影和 3D 材质的练习则需要一台支持 WebGL 的计算机。你可以访问 Get WebGL 网站（http://get.webgl.org/）来测试你的计算机性能。不必过于担心\
  \ WebGL；即使你的计算机无法处理高级 3D 图形，你也能完成大量编程工作。\n\n## 什么是 JavaScript？\n\n编程语言有很多很多。有些程序员喜欢争论哪种语言最好，但事实是，所有语言都有其独特且有价值的地方。\n\
  \n在本书中，我们将使用`JavaScript`编程语言。我们之所以用`JavaScript`编程，是因为它是 Web 的语言。它是唯一一种所有网页浏览器无需额外软件就能理解的编程语言。如果你能用`JavaScript`编程，那么你不仅能制作本书中将要学习的各种游戏，还能为几乎所有网站编写程序。\n\
  \n我们不会成为`JavaScript`专家。我们将只学习足够的`JavaScript`知识，以便能够编写本书中的游戏。这已经涉及相当多的`JavaScript`——足以让你在之后轻松学会其余部分。\n\
  \n## 如何阅读本书\n\n你会看到两种章节：项目章节和学习章节。项目章节以“项目”开头，就像第 1 章“项目：创建简单形状”一样。其他所有章节都是学习章节。\n\
  \n如果你想按照我学习编程的方式来做，只需阅读项目章节，并跟着完成所有练习。你将创建出相当酷的游戏角色和可供游玩的游戏世界。你将制作太空模拟场景。你将制作紫色怪物。你将制作各种精彩的东西。\n\
  \n如果你对游戏为何以这种方式编写有疑问，那么请阅读学习章节。我们不会涵盖编程的所有内容，但应该有足够的内容帮助你理解我们为什么这样做。这些章节正是我小时候希望拥有的。\n\
  \n## 让我们开始吧！\n\n介绍得够多了——让我们直接跳入编程吧！当你完成本章后，你将能够：\n- 了解什么是代码编辑器以及如何使用它进行编程\n- 知道如何制作各种\
  \ 3D 形状\n- 能够编写简单的`JavaScript`程序\n- 理解如何让 3D 形状移动\n\n# 第 1 章 项目：创建简单形状\n\n本书后面会有充足的时间进行详细解释。现在，让我们开始编程吧！\n\
  \n## 1.1 使用 ICE 代码编辑器进行编程\n\n在本书中，我们将使用 ICE 代码编辑器进行编程。ICE 代码编辑器直接在浏览器中运行。它让我们可以输入编程代码并立即看到结果。\n\
  \n首先，使用谷歌 Chrome 浏览器打开 ICE 代码编辑器，网址为`http://gamingJS.com/ice`。在本章中，我们将创建一个名为`Shapes`的新项目。\n\
  \n要在 ICE 代码编辑器中创建新项目，我们点击屏幕右上角的菜单按钮（带有三条水平线的按钮），然后从下拉菜单中选择`New`。在文本字段中输入项目名称`Shapes`，然后点击`Save`按钮。将模板保留为`3D\
  \ starter project`。\n\n请记住，如果你在 Internet Explorer 中使用 ICE 代码编辑器，本书中的任何项目都无法运行。虽然有些练习可以在\
  \ Mozilla Firefox 中运行，但为了所有项目的一致性，最好坚持使用单一浏览器（谷歌 Chrome）。\n\n### 使用 ICE 代码编辑器编码\n\
  \n我们将在本书中一直使用 ICE 代码编辑器。你只需要在第一次连接`http://gamingJS.com/ice/`时拥有网络访问权限。首次访问后，ICE\
  \ 会存储在浏览器中，因此即使没有联网，你也可以继续工作。\n\n当 ICE 打开一个新的 3D 项目时，文件中已经有很多代码。我们稍后会仔细查看这些代码，但现在让我们从第\
  \ 20 行开始我们的编程冒险。找到写着`START CODING ON THE NEXT LINE`的那一行。在第 20 行，输入以下内容：\n\n```javascript\n\
  var shape = new THREE.SphereGeometry(100); \nvar cover = new THREE.MeshNormalMaterial();\
  \ \nvar ball = new THREE.Mesh(shape, cover); \nscene.add(ball);\n```\n\n输入完成后，你应该会看到一些很酷的东西：我们输入的球体——我们编程得到的球体——出现在了\
  \ ICE 中。恭喜！你刚刚编写了你的第一个`JavaScript`程序！\n\n暂时不必担心代码的结构；你将在“深入了解 JavaScript 基础”中熟悉它。现在，让我们检查一下我们刚刚完成的\
  \ 3D 编程。\n\n3D 物体由两部分构成：形状和覆盖形状的东西。这两者的组合（形状及其覆盖物）在 3D 编程中有一个专门的名称：`mesh`。\n\n`Mesh`是\
  \ 3D 物体的一个花哨术语。网格需要形状（有时称为`geometry`）和覆盖它们的东西（有时称为`materials`）。在本章中，我们将研究不同的形状。我们将在“使用光照和材质”中处理不同的覆盖物。\n\
  \n一旦我们有了一个`mesh`，我们就把它添加到`scene`中。`scene`是 3D 编程中魔法发生的地方。它是所有事物发生的世界。在这个例子中，它是我们的球体所在的地方，等待着一些朋友。让我们向`scene`中添加一些其他形状，这样球体就不会孤单了。\n\
  \n### 你的工作会自动保存\n\n你的工作会自动保存，因此你无需手动保存。如果你仍然想自己保存代码，请点击 ICE 中的三线菜单按钮，然后从下拉菜单中选择`Save`选项。\n\
  \n## 1.2 使用 JavaScript 制作形状\n\n到目前为止，我们只看到了一种形状：球体。形状可以很简单，比如立方体、金字塔、圆锥体和球体。形状也可以更复杂，比如人脸或汽车。在本书中，我们将坚持使用简单形状。当我们构建像树这样的东西时，我们会组合简单的形状（如球体和圆柱体）来制作它们。\n\
  \n### 创建球体\n\n在几何学和 3D 编程中，球体总是被称为球体。在`JavaScript`中，有两种方法可以控制球体的形状。\n\n**大小：`SphereGeometry(100)`**\n\
  \n控制球体的第一种方法是描述它的大小。当我们说`new THREE.SphereGeometry(100)`时，我们创建了一个半径为 100 的球体。当你将半径改为\
  \ 250 时会发生什么？\n\n```javascript\nvar shape = new THREE.SphereGeometry(250); \nvar\
  \ cover = new THREE.MeshNormalMaterial(); \nvar ball = new THREE.Mesh(shape, cover);\n\
  ```\n\n\n\n\n### 控制球体形状\n\n```javascript\nTHREE.Mesh(shape, cover); scene.add(ball);\n\
  ```\n这里指明了修改球体大小的位置。将数值从 `250` 改为 `10` 会使球体变得非常小。这是控制球体形状的一种方法。\n\n### 避免块状感：`SphereGeometry(100,\
  \ 20, 15)`\n如果你在 ICE 中点击**隐藏代码**按钮，可能会注意到我们的球体并非真正光滑的球体。计算机通过拼接许多正方形（有时是三角形）来模拟球体。为了让球体看起来更平滑，可以在\
  \ `SphereGeometry()` 行中添加额外的数字：\n\n```javascript\nvar shape = new THREE.SphereGeometry(100,\
  \ 20, 15); \nvar cover = new THREE.MeshNormalMaterial(); \nvar ball = new THREE.Mesh(shape,\
  \ cover); \nscene.add(ball);\n```\n\n第一个数字是大小，第二个数字是球体周围的分块数量，第三个数字是球体上下方向的分块数量。\n\
  \n### 除非必要，否则不要更改分块数量\n形状中的分块越多，计算机绘制它所需的工作量就越大。通常，通过为形状选择不同的覆盖材质，计算机更容易让物体看起来平滑。\n\
  \n当你完成调整后，通过设置球体的位置将其移开：\n\n```javascript\nvar shape = new THREE.SphereGeometry(100);\
  \ \nvar cover = new THREE.MeshNormalMaterial(); \nvar ball = new THREE.Mesh(shape,\
  \ cover); \nscene.add(ball);\nball.position.set(-250, 250, -250);\n```\n\n`ball.position.set()`\
  \ 中的三个数字分别将球体向左、向上和向后移动。\n\n### 使用立方体形状制作盒子\n立方体（或盒子）有三种改变形状的方式：宽度、高度和深度。\n\n###\
  \ 尺寸：`CubeGeometry(300, 100, 20)`\n要创建一个盒子，请输入以下代码：\n\n```javascript\nvar shape\
  \ = new THREE.CubeGeometry(100, 100, 100); \nvar cover = new THREE.MeshNormalMaterial();\
  \ \nvar box = new THREE.Mesh(shape, cover); \nscene.add(box);\n```\n\n如果你看到的是正方形而不是盒子，那是因为摄像机正对着其中一个面。要解决这个问题，请旋转盒子：\n\
  \n```javascript\nvar shape = new THREE.CubeGeometry(100, 100, 100); \nvar cover\
  \ = new THREE.MeshNormalMaterial(); \nvar box = new THREE.Mesh(shape, cover); \n\
  scene.add(box);\nbox.rotation.set(0.5, 0.5, 0);\n```\n\n这三个数字分别使盒子向下、逆时针和左右旋转。\n\
  \n### 自己尝试\n旋转物体需要适应。完整旋转一圈是 `6.3`。尝试将其中两个数字设为 `0`，另一个设为 `0.1`，然后设为 `0.25`，最后设为\
  \ `0.5`。\n\n要更改尺寸（例如，宽 300、高 100、深 20），请使用：\n\n```javascript\nvar shape = new THREE.CubeGeometry(300,\
  \ 100, 20); \nvar cover = new THREE.MeshNormalMaterial(); \nvar box = new THREE.Mesh(shape,\
  \ cover); \nscene.add(box); \nbox.rotation.set(0.5, 0.5, 0);\n```\n\n要将盒子移开：\n\n\
  ```javascript\nvar shape = new THREE.CubeGeometry(300, 100, 20); \nvar cover = new\
  \ THREE.MeshNormalMaterial(); \nvar box = new THREE.Mesh(shape, cover); \nscene.add(box);\
  \ \nbox.rotation.set(0.5, 0.5, 0); \nbox.position.set(250, 250, -250);\n```\n\n\
  ### 使用圆柱体制作各种形状\n圆柱体（或管状体）可用于制作树干、易拉罐、轮子、圆锥体、常青树，甚至金字塔。\n\n### 尺寸：`CylinderGeometry(20,\
  \ 20, 100)`\n要创建一个圆柱体，请输入：\n\n```javascript\nvar shape = new THREE.CylinderGeometry(20,\
  \ 20, 100); \nvar cover = new THREE.MeshNormalMaterial(); \nvar tube = new THREE.Mesh(shape,\
  \ cover); \nscene.add(tube);\n```\n\n要旋转管状体，请添加：\n`tube.rotation.set(0.5, 0, 0);`\n\
  \n在 `CylinderGeometry()` 中，前两个数字描述顶部和底部的大小，最后一个数字是高度。\n\n### 自己尝试\n- 扁平的圆柱体就是一个圆盘。\n\
  - 顶部或底部大小为 `1` 的圆柱体就是一个圆锥体。\n\n\n\n\n\n![](img/Image00073.jpg) 还没结束。我们还有一招。金字塔：`CylinderGeometry(1,\
  \ 100, 100, 4)` 你注意到圆柱体看起来有棱角吗？那么，你可以控制圆柱体的棱角程度也就不足为奇了。例如，如果你将圆盘的分段数设为 20，就像这样：\n\
  \n```\nvar shape = new THREE.CylinderGeometry(100, 100, 10, 20);\nvar cover = new\
  \ THREE.MeshNormalMaterial();\nvar tube = new THREE.Mesh(shape, cover);\nscene.add(tube);\n\
  tube.rotation.set(0.5, 0, 0);\n```\n\n那么你应该会看到类似这样的效果：\n\n![](img/Image00074.jpg)\
  \ ![](img/Image00075.jpg) 和球体一样，只有在\n\n![](img/Image00073.jpg) 真正需要的时候，才应该使用这么多分段。\n\
  \n你能想到如何把它变成金字塔吗？你已经掌握了所有需要的线索。\n\n### 用 JavaScript 制作形状\n\n准备就绪\n\n### 自己试试\n\n\
  ![](img/Image00076.jpg) ![](img/Image00077.jpg) 试试不同的数字，看看你能创造出什么！\n\n![](img/Image00078.jpg)\
  \ 你想明白了吗？没想明白也别担心。我们接下来要用的方法\n\n![](img/Image00079.jpg) 其实相当巧妙。答案是，你需要减少制作圆锥体所用的分段数。如果你将顶部半径设为\
  \ 1，底部半径设为 100，高度设为 100，![](img/Image00080.jpg) 分段数设为 4，那么你会得到这样的效果：\n\n![](img/Image00081.jpg)\
  \ ![](img/Image00082.jpg) 用这种方法来创建金字塔可能看起来像是在作弊，但\n\n![](img/Image00083.jpg) 这引出了编程中非常重要的一条建议：\n\
  \n![](img/Image00084.jpg) ### 尽可能作弊\n\n在现实生活中你不应该作弊，但在编程中——尤其是在 3D 编程中——你应该总是寻找更简单的方法来做事。即使有常规的做法，也可能存在更好的方式。\n\
  \n到目前为止你做得很好。像我们对立方体和球体那样，把圆管移出中心位置：\n\n```\ntube.position.set(250, -250, -250);\n\
  ```\n\n现在让我们进入本章的最后两个形状。\n\n### 用平面构建平坦表面\n\n平面是一个平坦的表面。平面特别适合用来做地面，但在游戏中标记门和边缘时也很有用。`PlaneGeometry(100,\
  \ 100)` 由于平面只是平坦的方形，它们比我们见过的其他对象简单得多。输入以下代码：\n\n```\nvar shape = new THREE.PlaneGeometry(100,\
  \ 100);\nvar cover = new THREE.MeshNormalMaterial();\nvar ground = new THREE.Mesh(shape,\
  \ cover);\nscene.add(ground);\nground.rotation.set(0.5, 0, 0);\n```\n\n别忘了最后一行中的旋转。平面非常薄，当你直视它时可能看不到。\n\
  \n构建平面时的数字是宽度和深度。一个宽度为 300、深度为 100 的平面\n\n![](img/Image00085.jpg) 300 宽\n\n![](img/Image00086.jpg)\
  \ 100\n\n![](img/Image00087.jpg) ![](img/Image00088.jpg) 深，看起来可能像这样：\n\n![](img/Image00089.jpg)\
  \ ![](img/Image00090.jpg) 关于平面，需要了解的基本就是这些。把我们的平面移开：\n\n```\nvar shape = new THREE.PlaneGeometry(300,\
  \ 100);\nvar cover = new THREE.MeshNormalMaterial();\nvar ground = new THREE.Mesh(shape,\
  \ cover);\nscene.add(ground);\nground.position.set(-250, -250, -250);\n```\n\n现在让我们进入世界上最棒的形状。\n\
  \n### 用圆环渲染甜甜圈（不是吃的那种）\n\n在 3D 编程术语中，甜甜圈被称为圆环。我们能创建的最简单的圆环需要指定两个值：一个是从中心到外边缘的距离，另一个是管道的粗细。`TorusGeometry(100,\
  \ 25)` 在 ICE 中输入以下代码：\n\n```\nvar shape = new THREE.TorusGeometry(100, 25);\nvar\
  \ cover = new THREE.MeshNormalMaterial();\nvar donut = new THREE.Mesh(shape, cover);\n\
  scene.add(donut);\n```\n\n你应该会看到一个非常粗糙的甜甜圈，如图 1 所示，第 13 页的“粗糙的甜甜圈”。\n\n到现在为止，你可能已经知道如何让甜甜圈不那么粗糙了。\n\
  \n### 用 JavaScript 制作形状\n\n准备就绪\n\n![](img/Image00092.jpg) 图 1——粗糙的甜甜圈\n\n![](img/Image00093.jpg)\
  \ `TorusGeometry(100, 25, 8, 25)` 和球体一样，甜甜圈形状也是由分段构成的。围绕内管的分段可以变大或变小，我们可以在定义 `TorusGeometry`\
  \ 时包含第三个数字来设置。我们还可以通过包含第四个数字来调整甜甜圈外侧的分段大小。尝试像下面这样的数字，看看会发生什么。\n\n```\nvar shape\
  \ = new THREE.TorusGeometry(100, 25, 8, 25);\nvar cover = new THREE.MeshNormalMaterial();\n\
  var donut = new THREE.Mesh(shape, cover);\nscene.add(donut);\n```\n\n![](img/Image00094.jpg)\
  \ 现在\n\n![](img/Image00095.jpg) 这是一个好看的甜甜圈：\n\n![](img/Image00096.jpg) ![](img/Image00097.jpg)\
  \ `TorusGeometry(100, 25, 8, 25, 3.14)` 我们还可以对甜甜圈玩另一个把戏。尝试在 `TorusGeometry` 形状中添加另一个数字\
  \ 3.14：\n\n```\nvar shape = new THREE.TorusGeometry(100, 25, 8, 25, 3.14);\nvar\
  \ cover = new THREE.MeshNormalMaterial();\nvar donut = new THREE.Mesh(shape, cover);\n\
  scene.add(donut);\n```\n\n这应该会做出一个被咬了一半的甜甜圈。\n\n## 1.3 让形状动起来\n\n在结束我们的第一次编程会话之前，让我们做点酷的事情。让所有形状疯狂旋转。\n\
  \n在 ICE 中，在所有形状代码之后添加以下代码：\n\n```\nvar clock = new THREE.Clock();\nfunction animate()\
  \ {\n    requestAnimationFrame(animate);\n    var t = clock.getElapsedTime();\n\
  \    ball.rotation.set(t, 2*t, 0);\n    box.rotation.set(t, 2*t, 0);\n    tube.rotation.set(t,\
  \ 2*t, 0);\n    ground.rotation.set(t, 2*t, 0);\n    donut.rotation.set(t, 2*t,\
  \ 0);\n    renderer.render(scene, camera);\n}\nanimate();\n```\n\n暂时不用担心这段代码中每行是什么意思——我们会在本书后面更详细地研究所有这些行。现在，只要知道在特定的时间间隔内，我们正在改变形状的旋转。每次改变后，我们告诉渲染程序在屏幕上重新绘制当前的形状。\n\
  \n![](img/Image00098.jpg) ### 如果 ICE 卡住了\n\n在进行动画和其他复杂编程时，ICE 代码编辑器有可能完全卡住。这没什么大不了的。如果\
  \ ICE 停止响应，你需要撤销你最后做的任何更改。如何做到这一点的说明在“当 ICE 崩溃时恢复”中。\n\n## 1.4 到目前为止的代码\n\n为了方便起见，这个项目的完整版本包含在附录\
  \ A1.1 中，第 217 页的“代码：创建简单形状”。在练习过程中使用该代码来检查你的工作，但不要将代码复制粘贴到 ICE 中。除非你自己编写代码，否则不可能学会和理解编程。\n\
  \n准备就绪\n\n## 1.5 接下来是什么\n\n哇！这真是太疯狂了。我们学到了很多，而且才刚刚开始！我们已经知道如何在 ICE 代码编辑器中编写项目。我们知道如何制作许多不同的形状。我们甚至知道如何用\
  \ JavaScript 移动和旋转物体。最棒的是，在制作完形状后，我们只用了十五行代码就创建了一个相当酷的动画。这是一个好的开始。\n\n既然我们已经尝到了\
  \ 3D 编程的滋味，让我们稍微谈谈在网页浏览器中编程。\n\n当你完成本章后，你将能够：\n\n- 打开/关闭 JavaScript 控制台\n- 知道如何在\
  \ JavaScript 控制台中查找错误\n- 能够在 ICE 卡住时修复项目\n\n## 第 2 章 玩转控制台并找出问题所在\n\n在网页浏览器中编程时，能够使用浏览器的\
  \ JavaScript 控制台非常有用。大多数现代浏览器都有 JavaScript 控制台，但这里我们使用的是 Google Chrome。\n\n![](img/Image00099.jpg)\
  \ ### 编程可能会让人不知所措\n\n有时它会让你想把电脑扔到墙上（别这么做）。在做这些事情时，请记住这两个事实：\n\n- 会有你不知道的事情——这没关系。\n\
  - 你的程序会出问题——这没关系。\n\n只要记住每个人都会遇到这些困难，你会没事的。\n\n### 2.1 开始\n\n![](img/Image00100.jpg)\
  \ 了解 ICE 代码编辑器\n\n\n\n\n我们仍然在使用第 1 章“项目：创建简单形状”（第 1 页）中使用的 ICE 代码编辑器。如果你还没有开始使用\
  \ ICE，请回到那一章熟悉一下编辑器。\n\n## 开始一个新项目\n\n你在 ICE 中已经完成的任何工作都应该自动保存，所以我们可以直接开始一个新项目。点击菜单按钮，然后从菜单中选择`New`：\n\
  \n![](img/Image00101.jpg) ![](img/Image00102.jpg) \n\n让我们将新项目命名为 ![](img/Image00103.jpg)\
  \ ![](img/Image00104.jpg) `Breaking Things`。\n\n![](img/Image00105.jpg) ![](img/Image00106.jpg)\
  \ 确保将模板设置为 ![](img/Image00107.jpg) `3D starter project` ![](img/Image00108.jpg)\
  \ ![](img/Image00109.jpg) ![](img/Image00110.jpg)。\n\n![](img/Image00111.jpg) 现在让我们打开浏览器的\
  \ JavaScript 控制台。\n\n### 2.2 打开和关闭 JavaScript 控制台\n\n浏览器中的 JavaScript 控制台是网页程序员最好的朋友。它告诉我们哪里出了错误。\n\
  \n![](img/Image00112.jpg) 打开和关闭 JavaScript 控制台 ![](img/Image00113.jpg) `Ctrl+Shift+J`（同时按住`Ctrl`、`Shift`和`J`键）可以打开和关闭\
  \ JavaScript 控制台。如果你使用的是苹果电脑，可以使用`Cmd+Option+J`来打开和关闭控制台。\n\n第一次打开 JavaScript 控制台时，如果看到大量警告和错误，不用担心。它会记录网页或\
  \ ICE 代码编辑器中发生的事件。如果消息太多，你可以使用带有斜线圆圈的按钮清除日志。打开 JavaScript 控制台的相同组合键也可以关闭它（但本章中请保持打开状态）。\n\
  \n## ICE 中的调试：红色 X\n\n让我们从破坏一些 ICE 代码编辑器能检测到的简单东西开始。\n\n### 2.3 ICE 中的调试：红色 X\n\n\
  代码旁边的红色 X 表示 ICE 发现了一个会阻止代码运行的问题。让我们写一些非常糟糕的 JavaScript 来演示这一点。\n\n在“START CODING\
  \ ON THE NEXT LINE”下方输入以下行：\n\n```javascript\nbad()javascript\n```\n\n这是一段糟糕的 JavaScript！想知道为什么吗？糟糕是因为括号后面不应该有单词。如果你这样写代码，ICE\
  \ 会在有问题的行旁边显示一个红色 X，表示该行需要修复。将鼠标指针移到红色 X 上会显示实际的错误信息，例如“missing ; before statement”。\n\
  \n![](img/Image00114.jpg) ICE 不会告诉你括号后面放了单词。它只知道括号应该在一行的末尾，而这里不是这样。当它检测到该行未完成时，会触发一个错误警告：“嘿！你忘了在行末加分号！”我们需要自己找出该行应该在何处结束。\n\
  \n看到红色 X 时，需要检查代码中的一些事项：\n- 是否忘了加分号？\n- 如果在红色 X 行看不到问题，也请检查上一行。ICE 有时无法确定问题从何处开始，可能会偏差一两行。\n\
  \n### 2.4 ICE 中的调试：黄色三角形\n\n与红色 X 不同，代码左侧出现的黄色三角形不会阻止程序运行。即使代码行被标记了黄色三角形，你的代码可能仍然能运行，但可能无法正确运行。最好在出现这些三角形时就消除它们。\n\
  \n让我们通过写一些更糟糕（但没那么糟糕）的 JavaScript 来实践一下。首先，删除上一节中的`bad()javascript`行，并添加以下行：\n\n\
  ```javascript\nfood; eat(food);\n```\n\n在这种情况下，ICE 会通过黄色三角形告诉我们`food`这一行没有做任何事情。\n\
  \n![](img/Image00115.jpg) 我们可以通过将`food`行改为赋值语句来修复问题，如下所示：\n\n```javascript\nfood\
  \ = 'Cookie'; eat(food);\n```\n\nICE 应该接受新的`food`行，并且不再显示任何错误。然而，即使 ICE 没有报告更多问题，这段代码仍然存在问题。\n\
  \n#### 在控制台中调试\n\n### 2.5 在控制台中调试\n\n这就是 JavaScript 控制台派上用场的地方，我们可以看到程序实际在做什么。打开控制台后，你会看到一个错误消息，提示`eat()`未定义。\n\
  \n![](img/Image00116.jpg) 当浏览器尝试运行这段糟糕的 JavaScript 代码时，它意识到出了问题。在我们的程序中，我们告诉浏览器运行`eat()`函数，但我们从未告诉浏览器如何执行它。尝试运行代码时发现的错误称为运行时错误。\n\
  \n我们将在第 5 章“函数：反复使用”（第 49 页）中更详细地讨论函数。现在，只需知道函数是一种可以反复运行的代码编写方式即可。\n\nICE 用红色 X\
  \ 和黄色三角形标记的错误称为编译时错误。编译时错误是在计算机读取代码并决定如何处理它时捕获的。编译指的是计算机决定如何处理代码。JavaScript 控制台帮助我们修复运行时错误。\n\
  \n#### 在控制台中调试\n\n为了解决这个问题，让我们告诉 JavaScript 程序如何吃东西。我们通过在`eat(food)`行之后添加一个解释如何吃的函数来实现。\n\
  \n```javascript\nfood = 'Cookie'; eat(food);\n\nfunction eat(food) { \n    console.log(food\
  \ + \"! Nom. Nom. Nom.\"); \n}\n```\n\n此时，ICE 中应该没有编译时错误，JavaScript 控制台中也没有运行时错误，并且控制台中会显示消息“Cookie!\
  \ Nom. Nom. Nom.”。\n\n在结束本章之前，让我们看看一些常见的 3D 编程错误。在`eat()`函数的右花括号之后添加以下代码：\n\n```javascript\n\
  var shape = new THREE.SpherGeometry(100); \nvar cover = new Three.MeshNormalMaterial();\
  \ \nvar ball = new THREE.Mesh(shape, cover); \nscene.ad(ball);\n```\n\n你会注意到，这段代码在\
  \ ICE 中没有编译时错误。浏览器读取 JavaScript 代码并说：“嗯，这看起来是完全正确的 JavaScript。我现在就运行它！”然而，当代码实际运行时，问题就会出现，你会在\
  \ JavaScript 控制台中看到运行时错误。\n\n#### 可能的错误消息——未定义不是函数\n\n让我们看看哪里出了问题。首先，如果 JavaScript\
  \ 控制台 ![](img/Image00117.jpg) 还没有打开，请打开它。在那里，你应该会看到一条非常不友好的消息。\n\n![](img/Image00118.jpg)\
  \ ![](img/Image00119.jpg) 这条消息 ![](img/Image00120.jpg) 试图 ![](img/Image00121.jpg)\
  \ 告诉我们 `SphereGeometry` ![](img/Image00123.jpg) 拼写错误。检查 ![](img/Image00124.jpg)\
  \ 代码；原来我们漏掉了一个`e`，输入了`SpherGeometry`。JavaScript 控制台中的消息非常糟糕且不友好。\n\n这里有两个问题需要处理。首先，“未定义不是函数”实际上没有告诉我们任何信息，而且不容易理解。即使是\
  \ JavaScript 专家也会被这条消息搞糊涂。\n\n第二个问题是错误消息中的行号。在这个例子中，`gamingjs.com:25` 表示浏览器认为问题发生在程序的第\
  \ 25 行（你的行号可能略有不同）。然而，拼写错误的单词并不在 ICE 的第 25 行。我们的问题实际上发生在第 28 行。是的，JavaScript 专家也会被这个搞糊涂。\n\
  \n![](img/Image00125.jpg) 准备好的控制台行号并不总是精确的\n\n\n\n\nICE 会尽力在控制台中显示正确的行号，有时也能成功——甚至现在对你来说可能就是正确的——但有时也会偏差几行。先从精确的行号开始查看。如果看起来与错误不符，那就检查接下来的几行。\n\
  \n我们回到“undefined is not a function”这个错误消息，它实际上指向 ICE 中的第 28 行。这个错误意味着当浏览器尝试运行我们的代码时，它正在寻找一个函数，但找到了一个它不认识的东西。`THREE.SpherGeometry`\
  \ 没有被定义，因为实际的函数叫做 `THREE.SphereGeometry`。幸运的是，这个问题很容易修复，我们只需要加上字母 `e`。\n\n## 可能的错误消息——Three\
  \ 未定义\n\n然而，即使我们正确拼写了 `SphereGeometry`，球体仍然没有出现在屏幕上。我们的代码还是有问题。\n\n查看 JavaScript\
  \ 控制台，你应该会看到类似下面的内容。\n\n![](img/Image00126.jpg) ![](img/Image00127.jpg) 这里，JavaScript\
  \ 控制台告诉我们，我们忘记了\n\n![](img/Image00128.jpg) `THREE` 应该始终 ![](img/Image00129.jpg)\
  \ ![](img/Image00130.jpg) 全部大写。不存在 `Three` 这个东西，而我们写的就是 `Three`，JavaScript 控制台正是在告诉我们这一点。\n\
  \n这是使用 3D 库时一个非常常见的错误，所以下次看到这个错误时，请务必记住这一点。\n\n我们可以通过将代码中的 `Three` 替换为 `THREE` 来修复这个问题。\n\
  \n## 可能的错误消息——Undefined: No Method\n\n即使修复了这两个问题，球体仍然不可见，控制台中又出现了另一个晦涩的错误消息。\n\n\
  ## 当 ICE 崩溃时如何恢复\n\n![](img/Image00131.jpg) ![](img/Image00132.jpg) 不用担心消息中的\n\n\
  ![](img/Image00133.jpg) `Object [object Object]`\n\n![](img/Image00134.jpg) ![](img/Image00135.jpg)\
  \ ![](img/Image00136.jpg) 部分，因为它目前没有提供任何有用的信息。\n\n在这种情况下，我们告诉浏览器有一个名为 `ad()` 的方法，但它无法在文件中找到任何相关信息。修复方法与之前的例子相同。我们应该使用的方法是\
  \ `add()`，而不是 `ad()`。换句话说，我们不是要把球体“ad”（广告）到屏幕上，而是要“add”（添加）它。\n\n修复那一行之后，你最终会看到一个球体，并且\
  \ JavaScript 控制台中会出现“Nom. Nom. Nom.”的消息。\n\n![](img/Image00138.jpg) ![](img/Image00139.jpg)\n\
  \n## 2.6 当 ICE 崩溃时如何恢复\n\n![](img/Image00140.jpg) ![](img/Image00141.jpg)\n\n弄坏一个网页浏览器出奇地容易。如果你创建一个包含一百万个分块的球体，浏览器会崩溃。如果你创建一个没有停止点的递归函数（我们会在《函数：反复使用》中讨论），浏览器也会崩溃。\n\
  \n如果浏览器崩溃了，那么 ICE 代码编辑器也就崩溃了，对吧？\n\n嗯，是的，但有一个简单的修复方法：在 URL 中添加 `?e` 或 `?edit-only`，这样你看到的就是\
  \ `http://gamingjs.com/ice/?e`。这是 ICE 的纯编辑模式。\n\n准备就绪\n\n修复你最后输入的那段导致 ICE 崩溃的代码，然后从\
  \ URL 中移除纯编辑模式的问号，回到 `http://gamingjs.com/ice/`。现在你应该又能看到预览了。\n\n在某些电脑上，你可能需要先关闭浏览器标签页或窗口，然后再尝试。然后你可以打开一个新窗口或标签页，输入\
  \ ICE 的纯编辑模式 URL。特别是 Google Chromebook，按照这个步骤运行纯编辑模式效果更好。\n\n## 2.7 接下来是什么\n\n既然我们已经知道如何制作形状，以及出错时去哪里检查，那么让我们开始制作第一个游戏，构建我们自己的化身。\n\
  \n完成本章后，你将学会：\n\n- 如何在屏幕上组合放置物体\n- 拥有一个可以在后续章节和游戏中使用的化身\n\n# 第 3 章 项目：制作一个化身\n\n\
  开发游戏需要构建很多部分，比如游戏区域、游戏中的玩家，以及阻碍玩家的东西。在这个项目章节中，我们将创建一个可以在游戏中使用的玩家——一个化身。它最终看起来会像这样：\n\
  \n![](img/Image00142.jpg)\n\n化身就是你在游戏世界中的身份。它显示你在游戏中的位置以及你在做什么。由于它应该代表你和我，所以它应该给人一种良好的感觉。我们想要比一个简单的方块更好的东西来代表我们。\n\
  \n玩家与化身的区别 ![](img/Image00143.jpg) 在本书中，我们将使用“玩家”一词来指代玩游戏的人。而“化身”一词将用来描述游戏中的玩家。\n\
  \n### 3.1 开始\n\n让我们再次打开 ICE 代码编辑器 1，创建一个名为 My Avatar 的新项目（如果你不记得如何操作，请查看第 17 页的“开始一个新项目”）。\n\
  \n1. `http://gamingJS.com/ice` 准备就绪\n\n![](img/Image00144.jpg) 确保将模板设置为 3D 入门项目。这样，我们就可以准备好在“START\
  \ CODING ON THE NEXT LINE”之后的那一行开始编程了。\n\n### 3.2 用部件组合整体\n\n从第 1 章《项目：创建简单形状》第\
  \ 1 页开始，我们已经知道如何制作基本形状。让我们从制作一个球体作为身体开始，来构建我们的玩家化身。\n\n```\nvar cover = new THREE.MeshNormalMaterial();\n\
  var body = new THREE.SphereGeometry(100);\nvar avatar = new THREE.Mesh(body, cover);\n\
  scene.add(avatar);\n```\n\n我们已经知道输入这些代码后会发生什么——我们会在场景中心得到一个球体。\n\n![](img/Image00145.jpg)\
  \ ![](img/Image00146.jpg) 接下来，让我们在身体旁边添加一只手。在你已经输入的创建身体的代码下面，添加以下几行。\n\n![](img/Image00147.jpg)\n\
  \n```\nvar hand = new THREE.SphereGeometry(50);\nvar right_hand = new THREE.Mesh(hand,\
  \ cover);\nright_hand.position.set(-150, 0, 0);\nscene.add(right_hand);\n```\n\n\
  ### 用部件组合整体\n\n注意，我们没有为手创建新的覆盖材质。而是重复使用了同一个覆盖材质，也就是我们在化身身体上使用的那个，我们将其命名为 `cover`。这节省了一些输入。少打字是件好事，因为我们都是程序员，而程序员骨子里都是懒惰的。这让我想起了一些编程智慧，想与大家分享：\n\
  \n![](img/Image00148.jpg)\n\n### 好程序员是懒惰的\n\n我并不是说程序员讨厌做工作。实际上，我们热爱自己的工作，并且经常因为太热爱而花过多时间工作。\n\
  \n不，我所说的懒惰是指我们讨厌做那些计算机更擅长的工作。因此，与其单独创建手和脚，我们更愿意编写一个单独的手/脚，然后根据需要复制多次。\n\n懒惰在两个非常重要的方面对我们有益：\n\
  \n- 我们输入得更少。信不信由你，这是一个巨大的胜利。不仅第一次输入得更少，而且以后想要更新时，需要阅读的内容也更少。\n- 如果我们想改变某个肢体的创建方式，只需要修改一处。也就是说，如果将来想改变手的覆盖材质甚至形状，我们只需要在一个地方进行修改。\n\
  \n那么，让我们看看在创建化身的左手时，能否更加懒惰：\n\n```\nvar left_hand = new THREE.Mesh(hand, cover);\n\
  left_hand.position.set(150, 0, 0);\nscene.add(left_hand);\n```\n\n我们不仅没有为左手创建新的覆盖材质，而且也没有创建新的形状！我们只是为左手使用了与右手相同的形状。这才叫懒惰！\n\
  \n这样一来，我们的化身应该看起来像图 2《带手的化身》第 28 页那样。\n\n好吧，我承认这看起来不太像带手的身体。请再忍耐一会儿，你会看到的。\n\n准备就绪\
  \ ![](img/Image00149.jpg) 图 2——带手的化身\n\n![](img/Image00150.jpg)\n\n### 3.3 分解说明\n\
  \n让我们快速看一下为什么我们为手使用了那些数字。如果你没有耐心，可以跳到第 3.4 节《添加行走的脚》第 29 页，继续构建我们的游戏化身。\n\n当任何物体被添加到场景中时，它最初位于正中心。所以当我们添加身体和一只手时，它开始看起来像这样：\n\
  \n\n\n\n\n![](img/Image00151.jpg) 在 3D 编程和数学中，左和右被称为 X 方向。上和下被称为 Y 方向。\n\n这就是为什么我们改变手的\
  \ X 位置：\n\n```\nvar left_hand = new THREE.Mesh(hand, cover);\nleft_hand.position.set(150,\
  \ 0, 0);\nscene.add(left_hand);\n```\n\n`left_hand.position.set(150, 0, 0)` 中的数字分别是左手的\
  \ X、Y 和 Z 位置（Z 方向是前后）。我们将 X 设为 150，而 Y 和 Z 均为 0。这实际上等同于 `left_hand.position.x =\
  \ 150`。稍后我们会看到，在一行中设置多个值会非常方便。\n\n## 添加行走的脚\n\n但为什么是 150？答案是身体的半径为 100，手的半径为 50。我们需要将手在\
  \ X（左/右）方向上移动 100 + 50，即 150：\n\n![](img/Image00152.jpg) 如果我们只将手的中心移动 100，那么手就会有一部分嵌入身体内部：\n\
  \n![](img/Image00153.jpg) ![](img/Image00154.jpg)\n\n### 自己试试\n\n![](img/Image00155.jpg)\
  \ ![](img/Image00156.jpg) 如果你不信，可以自己试试。通过调整第一个数字来改变 X 位置：\n\n![](img/Image00157.jpg)\
  \ `right_hand.position.set(`\n\n![](img/Image00158.jpg) ![](img/Image00159.jpg)\
