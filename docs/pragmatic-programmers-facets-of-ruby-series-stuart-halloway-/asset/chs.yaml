  \n<tr>\n<th>Canonical</th>\n<th>Legalname</th>\n<th>Birthplace</th>\n<th>Birthdate</th>\n\
  <th>Deathdate</th>\n</tr>\n<!-- 为了简洁省略了许多行 -->\n```\n\n要获取作者的 XML 版本，请指定 `text/xml:`\
