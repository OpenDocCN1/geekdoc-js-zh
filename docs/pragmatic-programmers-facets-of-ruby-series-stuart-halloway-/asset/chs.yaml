  \ )) puts r['content-type' ]\n\nputs r.body\n```\n\n服务器返回默认的 MIME 类型 `text/html`：\n\
  \n[下载 code/rails_xt/sample_output/get_authors_html.txt](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/sample_output/get_authors_html.txt)\n\
