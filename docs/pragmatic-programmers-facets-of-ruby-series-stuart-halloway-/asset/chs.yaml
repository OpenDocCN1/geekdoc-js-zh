  \ ]\n\nputs res.body\n```\n\n现在服务器返回数据的 XML 版本，MIME 类型为 `text/xml:`：\n\n[下载 code/rails_xt/sample_output/get_authors_accept_xml.txt](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/sample_output/get_authors_accept_xml.txt)\n\
