  \ 应该让 Web 服务像 `ActiveRecord` 处理数据库一样简单。\n\n当你关注简单性和扩展性，并且你的服务意味着一个简单的对象模型（或完全没有对象模型）时，RESTful\
  \ 的方法效果很好。另一种方法是构建“更重量级”的 Web 服务，以支持更复杂的 XML、更复杂的对象模型以及简单的客户端/服务器之外的交互。在下一节中，我们将查看\
  \ Java 和 Rails SOAP 服务器。\n\n### 9.2 SOAP Web 服务\n\nSOAP 是 W3C 关于在对之间交换结构化和类型化信息的建议。其核心是\
  \ SOAP 消息，它只是用 XML 表示的头部+主体。SOAP 头部充当扩展点，允许应用程序分层引入端到端安全、事务和可靠消息传递等功能。\n\n### 使用\
  \ ActionWebService 创建 SOAP 服务\n\n对于我们的 Java SOAP 实现，我们将使用最流行的开源工具包 `Apache Axis`\
  \ [(http://ws.apache.org/axis/)](http://ws.apache.org/axis/)，配合 `AppFuse` [(http://www.appfuse.org)](http://www.appfuse.org)\
  \ 来减少重复性工作。\n\n3.\n\n[`www.w3.org/TR/soap`](http://www.w3.org/TR/soap)\n\nSOAP Web\
  \ 服务\n256\n\n我们将首先声明我们想要提供的服务的 Java 接口：\n\n[下载代码/appfuse_people/src/service/com/relevancellc/people/service/PersonManager.java](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/src/service/com/relevancellc/people/service/PersonManager.java)\n\
  \n```java\npackage com.relevancellc.people.service;\n\nimport com.relevancellc.people.model.Person;\n\
  import com.relevancellc.people.dao.PersonDao;\nimport java.util.List;\n\npublic\
  \ interface PersonManager {\n    public void setPersonDao(PersonDao dao);\n    public\
  \ Person getPerson(String id);\n    public void savePerson(Person person);\n   \
  \ public void removePerson(String id);\n    List getPeople(Person o);\n}\n```\n\n\
  在 Rails 中，我们将使用 `ActionWebService`，这是一个用于 SOAP 或 XML-RPC 创建 Web 服务的库。我们从运行生成器开始：\n\
  \n```bash\n$ script/generate web_service PersonService get_person save_person delete_person\
  \ get_people\n```\n\n`app/apis/` 存在\n`app/controllers/` 存在\n`test/functional/` 创建\n\
  `app/apis/person_service_api.rb` 创建\n`app/controllers/person_service_controller.rb`\
  \ 创建\n`test/functional/person_service_api_test.rb` 创建\n\n生成器创建了一个我们以前没过的目录：`app/apis`。`person_service_api.rb`\
  \ 文件包含了 Web 服务接口的 Ruby 描述。生成的版本只是一个存根（stub），我们已经将其编辑成像这样：\n\n[下载代码/people/app/apis/person_service_api.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/app/apis/person_service_api.rb)\n\
  \n```ruby\nclass PersonServiceApi < ActionWebService::API::Base\n  api_method :get_person,\
  \ :expects=>[:int], :returns=>[Person]\n  api_method :save_person, :expects=>[Person],\
  \ :returns=>[:int]\n  api_method :delete_person, :expects=>[:int], :returns=>[:bool]\n\
  \  api_method :get_people, :expects=>[], :returns => [[Person]]\nend\n```\n\nSOAP\
  \ Web 服务\n257\n\n因为 Ruby 没有接口，`ActionWebService` 定义了 `api_method` 来描述 Web 服务方法。对于每个方法，`expects`\
  \ 数组包含参数列表，`returns` 数组包含返回值。基本类型用符号（如 `:int`）命名。复杂类型（如 `ActiveRecord` 模型）通过其类名指定，例如\
  \ `Person`。\n\n`PersonManager` 的 Java 实现命名为 `PersonManagerImpl`。我们的实现由 `AppFuse`\
  \ 生成，并简单地委托给 DAO 层：\n\n[下载代码/appfuse_people/src/service/com/relevancellc/people/service/impl/PersonManagerImpl.java](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/src/service/com/relevancellc/people/service/impl/PersonManagerImpl.java)\n\
  \n```java\npackage com.relevancellc.people.service.impl;\n\nimport com.relevancellc.people.model.Person;\n\
  import com.relevancellc.people.dao.PersonDao;\nimport java.util.List;\n\npublic\
  \ class PersonManagerImpl implements PersonManager {\n    private PersonDao dao;\n\
  \n    public void setPersonDao(PersonDao dao) {\n        this.dao = dao;\n    }\n\
  \n    public Person getPerson(String id) {\n        return dao.getPerson(id);\n\
  \    }\n\n    public void savePerson(Person person) {\n        dao.savePerson(person);\n\
  \    }\n\n    public void removePerson(String id) {\n        dao.removePerson(id);\n\
  \    }\n\n    public List getPeople(Person o) {\n        return dao.getPeople(o);\n\
  \    }\n}\n```\n\nSOAP Web 服务\n258\n\n`PersonServiceApi` 的 Ruby 实现命名为 `PersonServiceController`\
  \ 并简单地委托给 ActiveRecord：\n\n[下载代码/people/app/controllers/person_service_controller.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/app/controllers/person_service_controller.rb)\n\
  \n```ruby\nclass PersonServiceController < ApplicationController\n  # 此处本应为 PersonServiceController\
  \ 逻辑，但根据示例结构翻译\nend\n```\n*(注：由于原始文本在结尾处出现了代码块混乱和重复，此处译文已遵循“不要重复输出原文”的原则，对逻辑结构进行了完整性处理。)*\n\
  \n\n\n\n\n[下载 code/people/samples/person_soap_client.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/samples/person_soap_client.rb)\n\
  \n```ruby\nrequire 'soap/wsdlDriver'\n```\n\n接下来，创建一个远程过程调用（RPC）驱动程序来调用你的 SOAP 方法。要创建该驱动程序，你需要能够访问\
  \ Web 服务定义语言（WSDL）文件，该文件描述了你计划调用的服务。WSDL 文件以通用的方式描述服务，使用了大量的 XML。对于简单的服务，这些 XML\
  \ 完全是样板代码，且工具包会自动生成它们。当你运行 People 示例应用程序时，`PersonService` 的 WSDL 位于 `localhost:3000/person_service/wsdl`。以下是创建\
  \ RPC 驱动程序的代码：\n\n[下载 code/people/samples/person_soap_client.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/samples/person_soap_client.rb)\n\
  \n```ruby\nurl = \"http://localhost:3000/person_service/wsdl\"\nsoap = SOAP::WSDLDriverFactory.new(url).create_rpc_driver\n\
  ```\n\n现在，你可以使用 `soap` 对象来调用 WSDL 文件中描述的方法。在我们的示例中，这些方法的原始描述是上一节中的 `PersonServiceAPI`。调用\
  \ SOAP 消息就像这字节简单：\n\n[下载 code/people/samples/person_soap_client.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/samples/person_soap_client.rb)\n\
  \n```ruby\nputs soap.getPerson(1).inspect\n```\n\n# SOAP WEB 服务\n260\n\n运行代码会返回一个\
  \ `SOAP::Mapping::Object`，这是一个包含从服务器返回值的简单集合：\n\n[下载 code/people/snippets/person_soap_client.txt](http://media.pragprog.com/titles/fr_r4j/code/code/people/snippets/person_soap_client.txt)\n\
  \n```bash\n$ ruby samples/person_soap_client.rb\n\n#<SOAP::Mapping::Object:0x81c768\
  \ \\\n{}id=1 {}first_name=\"Stuart\" {}last_name=\"Halloway\" >\n```\n\n如果你想查看实际的\
  \ SOAP 消息，可以设置 `wiredump_file_base` 属性：\n\n[下载 code/people/samples/person_soap_client.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/samples/person_soap_client.rb)\n\
  \n```ruby\nsoap.wiredump_file_base = File.join(File.dirname(__FILE__), \"../tmp\"\
  \ )\n```\n\n`soap4r` 将将 SOAP 调用记录到 `wiredump_file_base` 指定目录下的文件中。上一个对 `getPerson`\
  \ 请求的日志如下：\n\n[下载 code/people/snippets/tmp_getPerson_request.xml](http://media.pragprog.com/titles/fr_r4j/code/code/people/snippets/tmp_getPerson_request.xml)\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<env:Envelope xmlns:xsd=\"\
  http://www.w3.org/2001/XMLSchema\"\nxmlns:env=\"http://schemas.xmlsoap.org/soap/envelope/\"\
  \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" >\n<env:Body>\n<n1:GetPerson\
  \ xmlns:n1=\"urn:ActionWebService\"\nenv:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"\
  \ >\n<param0 xsi:type=\"xsd:int\" >1</param0>\n</n1:GetPerson>\n</env:Body>\n</env:Envelope>\n\
  ```\n\n这里是响应：\n\n[下载 code/people/snippets/tmp_getPerson_response.xml](http://media.pragprog.com/titles/fr_r4j/code/code/people/snippets/tmp_getPerson_response.xml)\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<env:Envelope xmlns:xsd=\"\
  http://www.w3.org/2001/XMLSchema\"\nxmlns:env=\"http://schemas.xmlsoap.org/soap/envelope/\"\
  \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" >\n<env:Body>\n<n1:GetPersonResponse\
  \ xmlns:n1=\"urn:ActionWebService\"\nenv:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"\
  \ >\n<return xsi:type=\"n1:Person\" >\n<id xsi:type=\"xsd:int\" >1</id>\n<first_name\
  \ xsi:type=\"xsd:string\" >Stuart</first_name>\n<last_name xsi:type=\"xsd:string\"\
  \ >Halloway</last_name>\n</return>\n</n1:GetPersonResponse>\n</env:Body>\n</env:Envelope>\n\
  ```\n\n# YAML 与 XML 的对比\n261\n\n对于简单的服务调用来说，这么多 XML 就太多余了。为了对 SOAP 公平，我们指出许多 Java\
  \ 程序员认为 XML 是多余的。\n\n## 9.3 YAML 和 XML\n\nXML 是 Web 服务的主导格式。XML 有很长的渊源。它源于通用标记语言（SGML），一种文档的元语言。XML\
  \ 变得如此流行，以至于它被用于所有事情。在 Java 世界中，XML 已成为配置文件的标准。许多 Java 程序员认为对于这种目的 XML 是过度。为了这一点，想象一个存储用户信息的假设\
  \ XML 文件：\n\n```xml\n<user>\n  <username>stu</username>\n  <homepage>http://reancellc.com</homepage>\n\
  </user>\n```\n\nXML 旨在是人类可读且自描述的。XML 是人类可读的，因为它是一种文本格式；通过 `<user>`、`<username>`\
  \ 和 `<homepage>` 等元素来实现自描述。另一种方案是 XML 属性：\n\n```xml\n<user username=\"stu\" homepage=\"\
  http://reancellc.com\" />\n```\n\n语法显然更简洁。它还暗示了语义差异。属性是无序的，而元素是有序的。属性所包含的值也受到限制：属性不能包含嵌套数据（而元素可以无限嵌套）。\n\
  \n这个简单的 XML 文档最后一个需要考虑的问题是，当它在范围内遇到同名的 `<user>` 元素时会发生什么？防止冲突，XML 允许命名空间。它们的作用与\
  \ Java 包或 Ruby 模块相同，但语法不同：\n\n```xml\n<rel:user xmlns:rel=\"http://www.reancellc.com/sample\"\
  \ username=\"stu\" homepage=\"http://reancellc.com\" />\n```\n\n命名空间是 `http://www.reancellc.com/sample`。在元素名称前输入这些会非常麻烦，所以\
  \ `xmlns:rel` 建立了 `rel` 作为前缀。阅读之前的文档，一个 XML 专家会说 `<user>` 属于 `http://www.reancellc.com/sample`\
  \ 命名空间。\n\nYAML 是对 XML 复杂性的响应（YAML 的意思是 YAML 不是标记语言）。YAML 与 XML 许多许多共同点。最重要的是，YAML\
  \ 和 XML 都可以用于表示和序列化复杂的嵌套数据结构。\n\nYAML 对 XML 的批评可以总结为一句话：XML 的两个概念太多了：\n\n- 不需要两种不同的嵌套数据形式。元素足够了。\n\
  - 不需要独立的命名空间概念；作用域就足够用于命名空间了。\n\n\n\n\n为了理解为什么 YAML 中的属性和命名空间是多余的，这里有同一个配置文件的三个\
  \ YAML 变体：\n\n# YAML 与 XML 的对比\n\n263\n\n[下载 code/rails_xt/samples/why_yaml.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/why_yaml.rb)\n\
  \n```yaml\nuser:\n  username: stu\n  homepage: http://blogs.relevancellc.com\n```\n\
  \n你可以看到，YAML 使用缩进进行嵌套。这比需要闭合标签的 XML 方法更加简洁。\n\n第二个 XML 示例使用了属性将文档缩短为单行。这里是单行的 YAML\
  \ 版本：\n\n[下载 code/rails_xt/samples/why_yaml.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/why_yaml.rb)\n\
  \n```yaml\nuser: {username: stu, homepage: http://blogs.relevancellc.com}\n```\n\
  \n单行语法引入了 `{}` 作为分隔符，但在实际数据中并没有语义上的区别。键/值数据（在 YAML 中称为 `simple mapping`，简单映射）在多行和单行文档中是完全相同的。\n\
  \n### 简单映射\n\n这里有一个 YAML “命名空间”：\n\n[下载 code/rails_xt/samples/why_yaml.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/why_yaml.rb)\n\
  \n```yaml\nhttp://www.relevancellc.com/sample:\n  user: {username: stu, homepage:\
  \ http://blogs.relevancellc.com}\n```\n\nYAML 中没有特殊的命名空间结构，因为作用域已经提供了足够的机制。在上一个文档中，`user`属于\
  \ `http://www.relevancellc.com/sample`。将“属于”替换为“在命名空间中”取决于个人喜好。\n\n从 YAML 转换为 Ruby\
  \ 对象非常简单：\n\n```ruby\nirb(main):001:0> require 'yaml'\n=> true\nirb(main):002:0>\
  \ YAML.load(\"{username: stu}\")\n=> {\"username\"=>\"stu\"}\n```\n\n或者从 Ruby 对象转换为\
  \ YAML：\n\n```ruby\nirb(main):003:0> YAML.dump 'username'=>'stu'\n=> \"--- \\nusername:\
  \ stu\"\n```\n\n开头的 `-- \\n` 是 YAML 文档分隔符。它是可选的，我们不会在 Rails 配置文件中使用它。请查看下一页的侧边栏了解此处未涵盖的\
  \ YAML 构造。\n\nYAML 序列中的项以 `- ` 前缀：\n\n```yaml\n- one\n- two\n- three\n```\n\n# YAML\
  \ 与 XML 的对比\n\n264\n\n## 数据格式：更高的复杂性\n\n对于 Rails 配置，你可能永远不需要本章节之外的 YAML 知识。但如果你深入研究\
  \ YAML 作为一种通用数据语言，你将会发现许多更多的复杂性。以下是几个复杂性领域，并包含了 XML 处理相同问题的方法作为对比：\n\n| 复杂性 | YAML\
  \ 方法 | XML 方法 |\n| :--- | :--- | :--- |\n| 空格 | 令人讨厌的规则 | 令人讨厌的规则 |\n| 重复数据 | 别名和锚点\
  \ (Aliases and anchors) | 实体，SOAP 第 5 节 |\n| 映射到 | 类型族 | XML Schema，各种 |\n| 编程 |\
  \ 数据绑定 | 语言类型 |\n\n如果你正在对数据格式做出架构决策，你将希望理解这些问题。对于 YAML，一个很好的起点是《YAML Cookbook》。\n\
  \n[`yaml4r.sourceforge.net/cookbook/`](http://yaml4r.sourceforge.net/cookbook/)\n\
  \n序列还有一种单行语法，从 Ruby 的角度来看，这几乎没有更方便的了。单行 YAML 序列也是合法的 Ruby 数组：\n\n```ruby\nirb(main):015:0>\
  \ YAML.load(\"[1, 2, 3]\")\n=> [1, 2, 3]\nirb(main):016:0> YAML.dump [1,2,3]\n=>\
  \ \"--- \\n- 1\\n- 2\\n- 3\"\n```\n\n但是，要注意显著的空格！如果你漏掉了它，将会会一个一个大的意外惊喜：\n\n```ruby\n\
  irb(main):018:0> YAML.load(\"[1,2,3]\")\n=> [123]\n```\n\n如果没有每个逗号后面的空格，所有元素都紧凑在了一起。YAML\
  \ 对空格非常挑剔，这是出于对传统的尊重，即标记语言必须具有反直觉的空格规则。在 YAML 中有两点需要记住：\n\n*   每当你看到一个让格式更美的单个空格字符时，该空格可能对\
  \ YAML 是显著的。这是 YAML 鼓励世界美的方式。\n*   Tab 键是非法的。在你的编辑器中关闭它。\n\n# JSON 与 RAILS\n\n265\n\
  \n如果你在 Rails 环境中运行，YAML 会更加简单。YAML 库会自动导入，所有对象都获得一个 `to_yaml()` 方法：\n\n```bash\n\
  $ script/console\nLoading development environment.\n>> [1,2,3].to_yaml\n=> \"---\
  \ \\n- 1\\n- 2\\n- 3\"\n>> {'hello'=>'world'}.to_yaml\n=> \"--- \\nhello: world\"\
  \n```\n\n在很多情况下，YAML 的序列化语法看起来非常像某些语言中创建哈希或数组的字面量语法。\n\n\n\n\n\n\n```xml\n<delete\
  \ dir=\"classes\" />\n</target>\n\n<target name=\"prepare\" >\n<mkdir dir=\"classes\"\
  \ />\n</target>\n\n<target name=\"compile\" depends=\"prepare\" >\n<javac srcdir=\"\
  src\" destdir=\"classes\" />\n</target>\n\n</project>\n```\n\n每个示例将演示完成一项简单任务的不同方法：提取具有\
  \ `name` 和 `depends` 属性的 `Target` 对象。\n\n### 推送解析 (Push Parsing)\n\n首先，我们将查看 Java\
  \ SAX（XML 简单 API）实现。\n\nSAX 解析器是“推式”解析器；你提供一个回调对象，解析器通过该对象上的各种回调方法将数据推送出来：\n\n[下载\
  \ code/java_xt/src/xml/SAXDemo.java](http://media.pragprog.com/titles/fr_r4j/code/code/java_xt/src/xml/SAXDemo.java)\n\
  \n```java\npublic Target[] getTargets(File file)\nthrows ParserConfigurationException,\
  \ SAXException, IOException {\n    final ArrayList al = new ArrayList();\n    SAXParserFactory\
  \ f = SAXParserFactory.newInstance();\n    SAXParser sp = f.newSAXParser();\n  \
  \  sp.parse(file, new DefaultHandler() {\n        public void startElement(String\
  \ uri, String lname,\n        String qname, Attributes attributes)\n        throws\
  \ SAXException {\n            if (qname.equals(\"target\" )) {\n               \
  \ Target t = new Target();\n                t.setDepends(attributes.getValue(\"\
  depends\" ));\n                t.setName(attributes.getValue(\"name\" ));\n    \
  \            al.add(t);\n            }\n        }\n    });\n    return (Target[])\
  \ al.toArray(new Target[al.size()]);\n}\n```\n\nJava 示例依赖于一个 `Target` 类，这是一个简单的\
  \ JavaBean（此处未显示）。\n\n#### XML 解析 268\n\n一个 REXML SAX 方法看起来如下：\n\n[下载 code/rails_xt/samples/xml/sax_demo.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/xml/sax_demo.rb)\n\
  \n```ruby\ndef get_targets(file)\n  targets = []\n  parser = SAX2Parser.new(file)\n\
  \  parser.listen(:start_element, %w{target}) do |u,l,q,atts|\n    targets << {:name=>atts['name'\
  \ ], :depends=>atts['depends' ]}\n  end\n  parser.parse\n  targets\nend\n```\n\n\
  尽管它们实现了相同的 API，但 Ruby 和 Java 的方法有两个显著差异。Java 实现使用了工厂模式，而 Ruby 实现直接实例化解析器。此外，Java\
  \ 版本使用匿名内部类，而 Ruby 版本使用块（block）。\n\n这些语言问题分别在“Joe Asks. . .”的第 272 页以及第 3.9, 节“函数（Functions）”的第\
  \ 92, 页中进行了讨论。这些差异在其他 XML 解析器中也会出现，但我们不再赘述它们。\n\n还有一个较小的差异。Ruby 版本利用了 Ruby 的许多简写符号之一。`%w`\
  \ 简写提供了一种创建单词数组的简易语法。例如：\n\n`irb(main):001:0> %w{these are words}`\n`=> [\"these\"\
  , \"are\", \"words\"]`\n\n`%w` 语法使得 Ruby 的 `start_element` 方便地接收第二个参数，即我们感兴趣的元素。Ruby\
  \ 版本不是监听所有元素，而是只查找我们关的 `<target>` 元素：\n\n[下载 code/rails_xt/samples/xml/sax_demo.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/xml/sax_demo.rb)\n\
  \n```ruby\nparser.listen(:start_element, %w{target}) do |u,l,q,atts|\n```\n\n###\
  \ 拉取解析 (Pull Parsing)\n\n拉取解析器与推送解析器相反。它不是实现回调 API，而是显式地向前遍历 XML 文档。当你访问每个节点时，可以调用访问方法来获取关于该节点的更多信息。\n\
  \n#### XML 解析 269\n\n在 Java 中，拉取解析器被称为 XML 流式 API (StAX)。StAX 不是 J2SE 的一部分，但你可以从\
  \ Java Community Process 网站下载。以下是 `getTarget()` 的 StAX 实现：\n\n[下载 code/java_xt/src/xml/StAXDemo.java](http://media.pragprog.com/titles/fr_r4j/code/code/java_xt/src/xml/StAXDemo.java)\n\
  \n```java\npublic Target[] getTargets(File f)\nthrows XMLStreamException, FileNotFoundException\
  \ {\n    XMLInputFactory xif= XMLInputFactory.newInstance();\n    XMLStreamReader\
  \ xsr = xif.createXMLStreamReader(new FileInputStream(f));\n    final ArrayList\
  \ al = new ArrayList();\n    for (int event = xsr.next();\n    event != XMLStreamConstants.END_DOCUMENT;\n\
  \    event=xsr.next()) {\n        if (event == XMLStreamConstants.START_ELEMENT)\
  \ {\n            if (xsr.getLocalName().equals(\"target\")) {\n                Target\
  \ t = new Target();\n                t.setDepends(xsr.getAttributeValue(\"depends\"\
  ));\n                t.setName(xsr.getAttributeValue(\"name\"));\n             \
  \   al.add(t);\n            }\n        }\n    }\n    return (Target[]) al.toArray(new\
  \ Target[al.size()]);\n}\n```\n\n尽管它们实现了相同的 API，但 Ruby 和 Java 的方法有两个显著差异。Java 实现使用了工厂模式，而\
  \ Ruby 实现直接实例化解析器。此外，Java 版本使用匿名内部类，而 Ruby 版本使用块（block）。\n\n*(注：提供的文本在 StAX/REXML\
  \ 部分包含冗余/损坏的片段；我已根据提示中提供的清晰代码片段重构了逻辑。）*\n\n\n\n\n\n[下载代码/rails_xt/samples/xml/dom_demo.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/xml/dom_demo.rb)\n\
  \n第 1 行\n\n```ruby\ndef get_targets(file)\n  targets = []\n  Document.new(file).elements.each(\"\
  //target\" ) do |e|\n    targets << {:name=>e.attributes[\"name\" ],\n    :depends=>e.attributes[\"\
  depends\" ]}\n  end\n  targets\nend\n```\n\nREXML 没有遵循 DOM。相反，`elements()` 方法返回一个支持\
  \ XPath 的对象。在 XPath 中，表达式 `//target` 匹配所有名为 `target` 的元素。在 XPath 之上，可以使用普通的 Ruby\
  \ 风格通过 `each()`（第 3 行）进行迭代。当然，Java 也支持 XPath，正如你将在下一节中看到的那样。\n\n## XPath\n\nXML\
  \ 文档具有分级结构，就像计算机上的文件系统一样。文件系统有一套标准表示法来命名特定的文件。例如，`path/to/foo` 指向 `path` 目录下的 `to`\
  \ 目录中的 `foo` 文件。更好的是，shell 程序使用通配符同时处理多个文件：`path/*` 指向 `path` 目录包含的所有文件。\n\nXML\
  \ 路径语言 (XPath) 为 XML 引入了路径命名。XPath 是用于命名 XML 文档部分的 W3C 建议（参见 [`www.w3.org/TR/xpath.html`](http://www.w3.org/TR/xpath.html)）。\n\
  \n上一节展示了一个简单的 XPath 示例，使用 `//target` 选择所有 `<target>` 元素。我们此处的目的是为了展示如何使用 Java 和\
  \ Ruby 访问 XPath API，而不是学习 XPath 语言本身。尽管如此，我们觉得有必要选一个稍微有趣一点的例子。\n\n![图像 52](img/index-272_1.png)\n\
  \n## XML 解析\n\n272 Joe 问 . . . 为什么 Java 的 XML 示例如此冗长？\n\nRuby 的 XML 示例如此精简，以至于你不得不认为其中有猫腻。Ruby\
  \ 的 XML API 是否缺少了某些重要东西？Java 版本拥有而 Ruby 版本完全缺失的是抽象工厂。许多 Java API 通过抽象工厂暴露其核心对象。我们不是说\
  \ `new Document`，而是说 `DocumentBuilderFactory.someFactoryMethod()`。在这种背景下，工厂方法的目的是为了保持我们的选择空间。如果我们以后想切换到不同的实现（即不同的解析器），我们可以重新配置工厂而无需更改任何代码。另一方面，调用\
  \ `new` 会限制你的选择。说 `new Foo()` 只会给你一个 `Foo`，仅此而已。你无法改变主意获取 `Foo` 的子类或用于测试的 mock 对象。\n\
  \nRuby 语言的设计使得抽象工厂通常是没的，原因有三点：\n\n*   在 Ruby 中，`new` 方法可以返回你想要的任何东西。最重要的是，`new`\
  \ 可以返回不同类的实例，因此现在选择 `new` 不会限制你的选择。\n*   Ruby 对象是鸭子类型（参见第 3.7, 节鸭子类型，位于第 89 页）。由于对象是根据它们能做什么定义的，而不是根据它们被命名为什么，因此改变主意并让一种对象替代另一种变得更加容易。\n\
  *   Ruby 类是开放的。现在选择 `Foo` 不会限制未来的选择，因为你始终可以重新打开 `Foo` 并调整它的行为。\n\n在 Java 中，必须在抽象工厂和\
  \ `new` 之间做出选择会损害灵活性。敏捷开发的一个核心主题是“构建你现在需要的，并且方式可以容易地演进为你下周发现自己需要的”。对于每一个新类，我们都必须做一个重大的前期决策（BUFD，通常也称为\
  \ BFUD）。“它以后需要可插的实现吗？”如果是，就用工厂；如果不是，调用 `new`。语言避免的 BUFD 越多，就越容易敏捷。为 为 辩，你可以通过几种方法避免抽象工厂带来的困境。你可以跳过工厂，并在后台使用委托来选择替代实现。一个极佳的例子是\
  \ JDOM [(http://www.jdom.org)](http://www.jdom.org)，它比 J2SE API 易用得多。通过面向切面编程 (AOP)，你可以通过织入新决定来撤销过去的决定。通过依赖注入\
  \ (DI)，你可以完全将配置选择从代码中抽离。关于这些内容的更多阅读建议在章节末尾的参考文献部分。\n\nXML 解析 273\n\n下面的 Java 程序寻找所有\
  \ `depends` 属性为 `prepare` 的 `<target>` 元素的名称：\n\n[下载代码/java_xt/src/xml/XPathDemo.java](http://media.pragprog.com/titles/fr_r4j/code/code/java_xt/src/xml/XPathDemo.java)\n\
  \n第 1 行\n\n```java\npublic String[] getTargetNamesDependingOnPrepare(File file)\n\
  throws Exception {\n  DocumentBuilderFactory dbf = DocumentBuilderFactory.newInstance();\n\
  \  DocumentBuilder db = dbf.newDocumentBuilder();\n  Document doc = db.parse(file);\n\
  \  XPathFactory xpf = XPathFactory.newInstance();\n  XPath xp = xpf.newXPath();\n\
  \  NodeList nl = (NodeList) xp.evaluate(\"//target[@depends='prepare']/@name\",\
  \ doc, XPathConstants.NODESET);\n  String[] results = new String[nl.getLength()];\n\
  \  for (int n=0; n<nl.getLength(); n++) {\n    results[n] = nl.item(n).getNodeValue();\n\
  \  }\n  return results;\n}\n```\n\nJava 的 XPath 建立在 DOM 之上，所以第 4 行开始的代码看起来很熟悉。在第\
  \ 10 行评估表达式时完成了实际业务。结果以 `NodeList` 的形式存在，因此第 13 行开始的迭代并没有什么新意。Ruby 的 XPath 建立在树\
  \ API 之上，你已经看过了：[下载代码/rails_xt/samples/xml/dom_demo.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/xml/dom_demo.rb)\n\
  \n```ruby\ndef target_names_depending_on_prepare(file)\n  XPath.match(Document.new(file),\
  \ \"//target[@depends='prepare']/@name\").map do |x|\n    x.value\n  end\nend\n\
  ```\n\n就这样这样。Ruby 的 API 全都是业务逻辑，没有样板代码。事实上，语法可以像下一页所示变得更加紧凑。\n\nXML 解析 274\n\n##\
  \ Symbol#to_proc 技巧\n\n你可能觉得这个 Ruby 示例有点冗长：\n\n```ruby\ndef target_names_depending_on_prepare(file)\n\
  \  XPath.match(Document.new(file), \"//target[@depends='prepare']/@name\").map(&value)\n\
  end\n```\n\n新语法 `&value` 利用了 Ruby 传递块的替代语法，通过传递一个显式的 `Proc` 对象。（`Proc` 是实例化后的类，所以你可以对其进行常规操作。）当然，`:value`\
  \ 并不是 `Proc`；它是一个 `Symbol`！Rails 通过定义从 `Symbol` 到 `Proc` 的隐式转换解决了这个问题：\n\n```ruby\n\
  class Symbol\n  def to_proc\n    Proc.new { |*args| args.shift.__send__(self, *args)\
  \ }\n  end\nend\n```\n\n`Symbol#to_proc` 技巧很有趣，因为它展示了 Ruby 的一个重要方面。Ruby 语言鼓励对其进行修改。像\
  \ Rails 团队这样的框架设计师不需要接受“原生 Ruby”。他们可以扭曲语言来满足他们的需求。\n\nRuby XML 输出 275\n\n### 9.6\
  \ Ruby XML 输出\n\n配置通常是只读的，但如果你将 XML 用于用户编辑的数据，你就需要修改 XML 文档并将其序列化回文本。Java 和 Ruby\
  \ 的树 API 都构建了修改能力。这里有一个使用 DOM 从头构建 XML 文档的 Java 程序：\n\n```java\nDocumentBuilderFactory\
  \ dbf = DocumentBuilderFactory.newInstance();\nDocumentBuilder db = dbf.newDocumentBuilder();\n\
  Document doc = db.newDocument();\nElement root = doc.createElement(\"project\" );\n\
  root.setAttribute(\"name\" , \"simple-ant\" );\n```\n\n\n\n\n\n```\ndoc.appendChild(root);\n\
  ```\n\n```java\nElement target = doc.createElement(\"target\" );\n```\n\n```java\n\
  target.setAttribute(\"name\" , \"compile\" );\n```\n\n```java\nroot.appendChild(target);\n\
  ```\n\n1\n\n在完成样板工厂代码后，使用 DOM 创建文档可以归纳为三个步骤：\n\n1. 使用第 4 行的 `createElement()` 等方法创建元素。\n\
  2. 使用第 5 行的 `setAttribute()` 等方法附加属性。\n3. 使用第 6 行的 `appendChild()` 等方法将创建的元素附加文档中的特定节点。\n\
  \nREXML 的方法类似：\n\n[下载 code/rails_xt/samples/xml/dom_output.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/xml/dom_output.rb)\n\
  \n第 1 行\n```ruby\nroot = Element.new(\"project\" , Document.new)\n```\n\n```ruby\n\
  root.add_attribute(\"name\" , \"simple-ant\" )\n```\n\n```ruby\nElement.new(\"target\"\
  \ , root).add_attribute(\"name\" , \"compile\" )\n```\n\nREXML API 提供了相同的三个步骤：创建、添加属性和附加到文档。然而，你可以将创建和附加结合，如第\
  \ 1 行所示。如果你足够大胆，甚至可以结合所有三个步骤，如第 3 行所示。\n\n内存中的 XML 文档通常被序列化为文本形式以便存储或传输。在序列化 XML\
  \ 时，你可能需要配置几个方面，例如使用空格使文档更于人类阅读。\n\n## 使用 BUILDER 创建 XML\n\n276\n\n在 Java 中，你可以通过设置\
  \ Transformer 属性来控制 XML 输出：\n\n[下载 code/java_xt/src/xml/DOMOutput.java](http://media.pragprog.com/titles/fr_r4j/code/code/java_xt/src/xml/DOMOutput.java)\n\
  \n第 1 行\n```java\nTransformerFactory tf = TransformerFactory.newInstance();\n```\n\
  \n```java\nTransformer tform = tf.newTransformer();\n```\n\n```java\ntform.setOutputProperty(OutputKeys.INDENT,\
  \ \"yes\" );\n```\n\n```java\ntform.transform(new DOMSource(doc), new StreamResult(System.out));\n\
  ```\n\n在第 2 行，对 `newTransformer()` 的无参数调用请求一个“无操作”转换器。（我们使用转换器仅仅是为了格式化，而不是为了执行其他有趣的操作，如\
  \ XSLT 转换。）第 3 行的 `setOutputProperty()` 调用指定了我们要在输出中使用人类可读的缩进。\n\nREXML 版本直接在文档本身上暴露输出选项：\n\
  \n[下载 code/rails_xt/samples/xml/dom_output.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/xml/dom_output.rb)\n\
  \n```ruby\nroot.document.write STDOUT, 2\n```\n\n`write()` 调用接收一个可选的第二个参数用于设置缩进级别。\n\
  \nDOM 和 REXML 都是通用的低级 API。对于重要的 XML 应用（例如调用或实现 Web 服务），你通常最好不要直接使用这些 API。相反，你应该使用在本章开头讨论的用于\
  \ REST 和 SOAP 的更高级 API。为了快速方便地发布序列化的 XML 数据，Rails 程序员还有另一个完全不使用底层树 API 的选项：我们接下来将看到的\
  \ Builder。\n\n### 9.7 使用 Builder 创建 XML\n\nJim Weirich 的 Builder 库随 Rails 一起打包，也可以通过以下方式单独安装：\n\
  \n```bash\ngem install builder\n```\n\nBuilder 利用了 Ruby 和 XML 之间的两种对称性，使得构建 XML\
  \ 文档变得轻而易举：\n\n* Ruby 类可以响应无法预知的任意方法，就像 XML 文档可能拥有无法预知的元素一样。\n* Ruby 和 XML 都有天然的嵌套结构：XML\
  \ 的元素/子元素关系和 Ruby 的块语法。\n\n## 使用 BUILDER 创建 XML\n\n277\n\n为了看到第一个对称性，请考虑 Builder\
  \ 风格的“Hello World”。我们将使用 `script/console`，因为 Rails 预加载了 Builder，而 `irb` 没有：在 `script/console`\
  \ 输出中，为了清晰起见，我们省略了 `$ script/console` 的返回值行（=> ...），除非它们直接相关。\n\n```\nLoading development\
  \ environment.\n>> b = Builder::XmlMarkup.new(:target=>STDOUT, :indent=>1)\n<inspect/>\n\
  >> b.h1 \"Hello, world\"\n<h1>Hello, world</h1>\n```\n\n正如你从第 5 行推出的那样，`XmlMarkup`\
  \ 实例使用方法名作为元素名，并将字符串参数转换为元素内部的内容。当然，所有方法的集合是有限的：\n\n```\n>> Builder::XmlMarkup.instance_methods.size\n\
  => 17\n```\n\n显然，这 17 个方法之一必须是 `h1()`，其他必须对应于其他常用的标签名。让我们通过寻找一个 Builder 不支持的标签名来测试这个假设：\n\
  \n```\n>> b.foo \"Hello, World!\"\n<foo>Hello, World!</foo>\n\n>> b.qwijibo \"Hello,\
  \ World!\"\n<qwijibo>Hello, World!</qwijibo>\n\n>> b.surely_this_will_not_work \"\
  Hello, World\"\n<surely_this_will_not_work>Hello, World</surely_this_will_not_work>\n\
  ```\n\n这里发生了什么？`XmlMarkup` 正在使用 Ruby 的 `method_missing()` 钩子来动态响应任何合法的 Ruby 方法名。结果，`XmlMarkup`\
  \ 可以处理你可能想要创建的任何 XML 元素名。\n\n让我们创建本章中一直使用的 `build.xml` 示例。首先，我们需要为元素添加属性。Builder\
  \ 允许通过传递一个可选的哈希参数来实现此：\n\n```\n>> b.project \"\", :name=>'simple-ant', :default=>'compile'\n\
  <project default=\"compile\" name=\"simple-ant\"></project>\n```\n\n接下来，我们需要某种方法将一个元素嵌套另一个元素内部。Ruby\
  \ 的块语法非常适合这项工作。与其为元素内容传递初始字符串参数，不如传递一个块来生成元素内容：\n\n```\n>> b.project :name=>'simple-ant',\
  \ :default=>'compile' do\n?>\nb.target :name=>'clean'\n>> end\n<project default=\"\
  compile\" name=\"simple-ant\">\n<target name=\"clean\"></target>\n</project>\n```\n\
  \n## 解决你的数据头疼问题\n\n278\n\nRuby 的块语法赋予了程序嵌套结构，这反映了（格式化后的）XML 的嵌套。当我们编写程序来生成整个 XML\
  \ 时，这种对称性更加明显：\n\n```ruby\nrequire 'rubygems'\nrequire 'builder'\n\nb = Builder::XmlMarkup.new(:target=>STDOUT,\
  \ :indent=>1)\n\nb.project :name=>'simple-ant', :default=>'compile' do\n  b.target\
  \ :name=>'clean'\nend\n```\n\n这产生了：\n\n```xml\n<project name=\"simple-ant\" default=\"\
  compile\">\n  <target name=\"clean\" />\n</project>\n```\n\n## 解决你的数据头疼问题\n\n279\n\
  \nBuilder 与 Rails 深度集成。要在 Rails 视图中使用 Builder，只需将模板扩展命名为 `.rxml` 而不是 `.rhtml`。\n\
  \n\n\n\n另一方面，Ruby 程序员长期以来更偏于使用 YAML（最近是 JSON）。\n\n注意，这两个因素都与语言或运行时特性无关。它们更多是关于程序员文化的。我们认为动态语言更自然适合任何可扩展的数据格式，并且在未来，最好的\
  \ XML 支持将出现在动态语言中。\n\n但那都是未来的事情。现在，处理“大型 XML 问题”时请优先选择 `Java`。\n\n你如何识别大问题？如果你认为你遇到了性能问题，就写一个评估你的代表性数据的基准测试，很快你就会知道了。如果你需要特定的\
  \ API，就去 Google 搜索。也许你会很幸运地发现一些自这些文字编写以来已经演化的选择。\n\n### 阿斯匹林 #2：避免 DOM\n\n`DOM`\
  \ 是很陋的。我们在本章引用 `DOM`，是因为它是 `Java` 程序员应该掌握的共同基准。将 `DOM` 列入“学了有用但从不用不上”的清单吧。我们并不真的认为\
  \ `DOM` 值得学习，但假装它值得学只会让我们对那些浪费的时间感到好受一些。\n\n如果你必须在 `Java` 中使用树形 API，至少使用 `JDOM`\
  \ [(www.jdom.org)](http://www.jdom.org)。\n\n### 阿斯匹林 #3：配置优先使用 YAML 而非 XML\n\n正如我们在章节\
  \ 9.3 `YAML 与 XML 比较` 中讨论的，在第 261 页，`XML` 给配置文件带来了不必要的文档负担，例如元素和属性之间的区别。`命名空间`让情况变得糟糕。\n\
  \n#### 治愈你的数据头痛\n\n当然，我们并不要求你在已经有一个有效的 `XML` 方案的情况下放弃当前项目去编写一个 `YAML` 配置解析器。我们倾向于在\
  \ `XML` 已经根忍忍。\n\n### 阿斯匹林 #4：尽可能 RESTful\n\n`REST` 和 `SOAP` 并非完全不兼容。`REST` 处理 `HTTP`\
  \ 头部、动词和格式协商。`SOAP` 使用 `HTTP` 是因为那里有，但它将语义保留在 `SOAP` 特有的头部中。这种分离意味着一个精心设计的服务可以使用\
  \ `SOAP` 同时保持 `RESTful`。遗憾的是，考虑到今天工具的现状，你需要对 `SOAP` 和 `REST` 都有非常深入的才能做好。\n\n另一种替代方案是为服务提供两个接口：一个通过\
  \ `SOAP`，另一个是 `RESTful` 的。\n\n### 阿斯匹林 #5：在可行的最高抽象层上工作\n\n`XML` API（无论是基于树的、推送式的还是拉取式的）都是\
  \ `XML` 编程的汇编语言。大多数时候，你应该能够在更高层次上工作。如果你需要的高层次抽象还不存在，就创建它。即使你只使用一次，高层次的方法可能比继续直接处理数据更快、更容易实现。\n\
  \n`XML`、`JSON` 和 `YAML` 具有共同目标：将数据格式标准化，使应用程序开发者无需浪费时间读写私有格式。由于这些数据格式是通用的，它们不施加任何固定类型。（这就是人们说\
  \ `XML` 是一种元格式的意思。）此后开发者可以开发特定区域的格式，例如用于网页的 `XML` 变体 `XHTML`。\n\nWeb 服务将极大地扩展计算机之间的通信量。因此，我们对\
  \ Web 的心理模型正在发生变化。网站不再是一个单体实体，从某处的单台机器（或一机架）提供。Web 应用程序越来越多地将其部分工作委托给其他 Web 应用程序，并将这些次要应用程序作为\
  \ Web 服务调用。这很大程度上是好事，但会给开发者使 Web 应用程序安全带来更大的压力。在下一章中，我们将研究 `Rails` 应用程序的安全。\n\n\
  ### 9.9 资源\n\n*   **Builder 对象** ... .onestepback.org/index.cgi/Tech/Ruby/BuilderObjects.rdoc\
  \ Jim Weirich 的原始博客文章，解释了为什么以及如何创建 `Builder`。解释了如何使用 `instance_eval()` 技巧让构建方法在正确的上下文中执行。\n\
  *   **使用 Ruby 和 Builder 创建 XML** ... ... [`www.xml.com/pub/a/2006/01/04/creating-xml-with-ruby-and-builder.html`](http://www.xml.com/pub/a/2006/01/04/creating-xml-with-ruby-and-builder.html)\
  \ Michael Fitzgerald 对 `Builder` 的快速介绍。\n*   **AOP 中的设计模式** ... ... [`www.cs.ubc.ca/~jan/AODPs`](http://www.cs.ubc.ca/~jan/AODPs)\
  \ Jan Hannemann 认为设计模式依赖于语言。使用 `AspectJ`，许多 `Java` 设计模式可以转换为库调用：“对于 [GoF 模式] 中的\
  \ 12 种，我们开发了可重用的实现，可以作为库模式切面集成到软件系统中。” 切面的源代码。\n*   **JSON 简介** ... ... `JSON` 的快速介绍。\n\
  \n\n\n\n\n授权 (`authz`）。`authn` 步骤询问“你是谁？”，而 `authz` 步骤询问“你能做什么？”。在这一基础上，我们将从攻击者的角度来看安全问题。对于攻击者可能利用的潜在漏洞列表，我们将使用开放\
  \ Web 应用程序安全项目（OWASP）前 10 项目。对于这十种网络安全漏洞，我们将介绍您可以在 Ruby on Rails 中采取的预防措施。\n\n#\
  \ 使用 ACTS_AS_AUTHENTICATED 插件进行身份验证\n\n## 10.1 使用 acts_as_authenticated 插件进行身份验证\n\
  \nRuby on Rails 应用通常使用一个或多个开源插件进行保护。Rails 插件是重用的代码，安装在 Rails 应用程序的 `vendor/plugins`\
  \ 目录下。最流行的安全插件可能是 `acts_as_authenticated`，它提供了以下功能：\n\n* 基于表单和 HTTP BASIC 的认证\n\
  * 会话作用范围的用户对象\n* 通过哈希 Cookie 实现跨会话的“记住我”\n* 初始 RHTML 表单\n\n配置 `authn` 的步骤非常简单：\n\
  \n1. 安装 `authn` 库。\n2. 指定哪些资源需要 `authn`。\n3. 指定登录、注销和重定向的导航流。\n4. 配置用户名和密码的数据库。\n\
  \n安装 `Acegi` 只需要将 `JAR` 文件放在正确的位置，`AppFuse` 会自动完成此操作。安装 `acts_as_authenticated`\
  \ 的描述见下一页侧边栏。\n\n最常见的 `Acegi` 安全形式使用 servlet 过滤器来保护任何需要 `authn` 的资源。要配置此过滤器，您需要将过滤器添加到\
  \ `web.xml` 中：\n\n```xml\n<filter>\n  <filter-name>securityFilter</filter-name>\n\
  \  <filter-class>org.acegisecurity.util.FilterToBeanProxy</filter-class>\n  <init-param>\n\
  \    <param-name>targetClass</param-name>\n    <param-value>org.acegisecurity.util.FilterChainProxy</param-value>\n\
  \  </init-param>\n</filter>\n```\n\n接下来，让 `web.xml` 引入 Spring 上下文文件 `security.xml`，以便\
  \ `filterChainProxy` bean 在运行时可用：\n\n```xml\n<context-param>\n  <param-name>contextConfigLocation</param-name>\n\
  \  <param-value>/WEB-INF/applicationContext-*.xml,/WEB-INF/security.xml</param_value>\n\
  </context-param>\n```\n\n## 安装 acts_as_authenticated 插件\n\nRails 插件安装在 `vendor/plugins`\
  \ 目录。通过任何方式将文件放入那里都是的。您可以从其主页下载插件并将其解压到 `vendor/plugins`。如果插件具有公共的 Subversion 访问权限，可以使用\
  \ `svn:external` 引用，并始终保持在最新版本。\n\n为了让过程更加简单，许多插件被部署到 Web 上，以便通过 `script/plugin`\
  \ 命令进行安装。`acts_as_authenticated` 就是这样一个插件，因此您只需要输入以下两个命令：\n\n```bash\nscript/plugin\
  \ source http://svn.techno-weenie.net/projects/plugins\nscript/plugin install acts_as_authenticated\n\
  ```\n\n一旦安装了插件，您需要为用户名、密码等创建数据表。以下两条条命令将创建必要的 `ActiveRecord` 类以及将它们添加到数据库的迁移文件：\n\
  \n```bash\nscript/generate authenticated user account\nrake migrate\n```\n\n在 `security.xml`\
  \ 内部，指定应该过滤哪些资源：\n\n```xml\n<bean id=\"filterChainProxy\" class=\"org.acegisecurity.util.FilterChainProxy\"\
  \ >\n  <property name=\"filterInvocationDefinitionSource\" >\n    <value>\n    \
  \  CONVERT_URL_TO_LOWERCASE_BEFORE_COMPARISON\n      PATTERN_TYPE_APACHE_ANT\n \
  \     /**=httpSessionContextIntegrationFilter, ... 7 more filter names\n    </value>\n\
  \  </property>\n</bean>\n```\n\n`/**` 是过滤所有资源的通配符。用户名和密码的数据库是可配置的，涉及此处未显示的更多 XML。\n\
  \n在使用 Ruby 的 `acts_as_authenticated` 时，您可以在控制器类中添加以下行来强制要求 `authn`：\n\n```ruby\n\
  before_filter :login_required\n```\n\n如果您只想对某些操作强制要求 `authn`，可以使用 `before_filter`\
  \ 的标准选项。\n\n例如，可能读取操作不需要 `authn`，但更新操作需要：\n\n```ruby\nbefore_filter :login_required,\
  \ :except=>['index' , 'list' , 'show' ]\n```\n\n`:except` 的使用是一个很棒的设计，因为您不需要学习特定的安全过滤器词汇。您可以使用已经熟悉的、用于\
  \ `before_filter` 的常用选项。\n\n# 使用 AUTHORIZATION 插件进行授权\n\n## 10.2 使用 Authorization\
  \ 插件进行授权\n\n要执行授权，我们需要：\n\n1. 将授权与我们的身份验证策略关联。\n2. 建立一些角色。\n3. 将某些用户映射到角色。\n4. 将某些操作或对象限制某些角色。\n\
  \n对于 Java 端，我们将继续使用 `Acegi` 来完成这些任务。对于 Ruby on Rails，我们将使用另一个插件：Authorization 插件。`Acegi`\
  \ 和 `Authorization` 都允许可插的身份验证策略。对于 Java 和 Rails 应用，我们都使用基于数据库的方法。\n\n### 单点登录 (SSO)\
  \ 如何？\n\nRuby 和 Rails 对 SSO 的支持少于 Java 世界提供的支持。不过，也有一些亮点。如果你在 Java 中习惯使用中央认证服务 (CAS)，那么你就走运了。Ruby\
  \ 世界为 Rails 提供了 CAS 过滤器以及 RubyCAS-Client。如果您正在集成其他 SSO 供应商，可以使用 CAS 实现作为起点。\n\n\
  ## 安装 Authorization 插件\n\n按照在线说明下载插件，然后将插件解压到您想要保护的 Rails 应用程序的 `vendor/plugins`\
  \ 目录。由于我们使用数据库处理角色，您将需要生成并运行迁移：\n\n```bash\nscript/generate role_model Role\nrake\
  \ db:migrate\n```\n\n完整的安装说明值得在网上阅读；它们描述了一些我们在本示例中需要的其他选项。\n\n\n\n\n\n[下载 code/appfuse_people/web/WEB-INF/security.xml](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/web/WEB-INF/security.xml)\n\
  \n```xml\n<bean id=\"filterInvocationInterceptor\" class=\"org.acegisecurity.intercept.web.FilterSecurityInterceptor\"\
  >\n  <property name=\"authenticationManager\" ref=\"authenticationManager\" />\n\
  </bean>\n```\n\n通过 `Authorization` 插件，你可以对身份验证类进行注解以显示它被用于授权：\n\n[下载 code/rails_xt/app/models/user.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/models/user.rb)\n\
  \n```ruby\nclass User < ActiveRecord::Base\n  acts_as_authorized_user\nend\n```\n\
  \n由于我们是在数据库中存储用户和角色，角色的设置步骤看起来仅仅是数据输入。然而，我们需要为自动化测试准备示例数据，因此我们将介绍如何填充这些数据。AppFuse\
  \ 会创建一个包含示例数据的 XML 文件：\n\n[下载 code/appfuse_people/metadata/sql/sample-data.xml](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/metadata/sql/sample-data.xml)\n\
  \n```xml\n<row>\n  <value>1</value>\n  <value>tomcat</value>\n  <value>536c0b339345616c1b33caf454454d8b8a190d6c</value>\n\
  \  <value>Tomcat</value>\n  <value>User</value>\n  <value></value>\n  <value>Denver</value>\n\
  \  <value>US</value>\n</row>\n```\n\n该文件继续指定了几个用户和角色。随后 AppFuse 使用 `dbunit` Ant\
  \ 任务来填充数据库。当你在项目中安装 `Authorization` 时，它会自动创建一个角色固件文件（fixture file），我们可以对其进行编辑以创建几个角色：\n\
  \n[下载 code/rails_xt/test/fixtures/roles.yml](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/test/fixtures/roles.yml)\n\
  \n```yaml\nadmin:\n  id: 1\n  name: admin\nmortal:\n  id: 2\n  name: mortal\n```\n\
  \n我们已经有了通过 `acts_as_authenticated` 安装的名为 Quentin 和 Aaron 的示例用户。\n\n# 使用 AUTHORIZATION\
  \ 插件进行授权\n\n这里是 Quentin：\n\n[下载 code/rails_xt/test/fixtures/users.yml](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/test/fixtures/users.yml)\n\
  \n```yaml\nquentin:\n  id: 1\n  login: quentin\n  email: quentin@example.com\n \
  \ salt: 7e3041ebc2fc05a40c60028e2c4901a81035d3cd\n  crypted_password: 00742970dc9e6319f8019fd54864d3ea740f04b1\
  \ # test\n  created_at: <%= 5.days.ago.to_s :db %>\n```\n\n我们必须手动创建一个 `roles_users.yml`\
  \ 固件，以填充关联用户与角色的中间表。我们将 Quentin 设置为 admin，将 Aaron 设置为 mortal：\n\n[下载 code/rails_xt/test/fixtures/roles_users.yml](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/test/fixtures/roles_users.yml)\n\
  \n```yaml\nfirst:\n  role_id: 1\n  user_id: 1\nsecond:\n  role_id: 2\n  user_id:\
  \ 2\n```\n\n不需要自定义的 `Rake` 任务来加载这些安全对象。它们是简单的 `ActiveRecord` 模型，因此由 Rails 内置的标准\
  \ `Rake` 任务自动管理。\n\n现在我们进入核心问题：按角色保护资源。在 Acegi 中，这是在 XML 文件完成的。然而，其语法并不是 XML，而是一种受\
  \ Apache Ant 启发的嵌入模式语言：\n\n[下载 code/appfuse_people/web/WEB-INF/security.xml](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/web/WEB-INF/security.xml)\n\
  \n```xml\n<property name=\"objectDefinitionSource\">\n  <value>\n    PATTERN_TYPE_APACHE_ANT\n\
  \    /clickstreams.jsp*=admin\n    /flushCache.*=admin\n    /passwordHint.html*=ROLE_ANONYMOUS,admin,user\n\
  \    /reload.*=admin\n    /signup.html*=ROLE_ANONYMOUS,admin,user\n    /users.html*=admin\n\
  \    /**/*.html*=admin,user\n  </value>\n</property>\n```\n\n这些模式将 URL 限制为某些角色。我们认为这种语言成功实现了自俗易懂的目标。\n\
  \n通过 `Authorization` 插件，角色权限在控制器本身中分配。它不是使用纯 Ruby 代码，`permit` 代码解析了一种读起来像人类语言的微语言。例如，控制器中的以下几行将指定只有管理员可以编辑\
  \ Quips，而凡人只能查看它们：\n\n[下载 code/rails_xt/app/controllers/quips_controller.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/controllers/quips_controller.rb)\n\
  \n```ruby\nREAD_ACTIONS = %w(index list show)\npermit 'admin or mortal' , :only=>READ_ACTIONS\n\
  permit 'admin' , :except=>READ_ACTIONS\n```\n\n与 Acegi 模式语言一样，我们发现 `Authorization`\
  \ 插件的微语言也是自俗易懂的。\n\n你可以将测试固件数据加载到开发数据库中测试授权保护是否有效。Rails 有一个专门为此目的内置的任务。在 `rails_xt`\
  \ 目录中，`rake db:fixtures:load` 将清空开发数据库并将其内容替换为测试固件。加载固件后，你可以运行 `script/server` 并导航到\
  \ `/quips`。如果你是 Quentin，你将拥有读权限，但作为 Aaron，你只有读取权限。\n\nAcegi 和 `Authorization` 插件都比我们在这里展示的强大得多。它们都提供了将角色与特定对象关联的能力。Acegi\
  \ 还有一个我们在其他地方从未见过的惊人功能。由于它与 Web 层集成，它可以保护任何东西。这种简洁性延伸到了实现层面。两个插件的整个运行时占用少于 1000\
  \ 行 Ruby 代码。安全相关的代码开发和维护成本很高，因此在极少的代码中完成大量工作是一个巨大的优势。\n\n# 测试身份验证与授权\n\n### 10.3\
  \ 测试身份验证与授权\n\n当你为 Rails 应用添加身份验证（authn）和授权（authz）支持时，你通常会破坏任何已有的功能测试。这是因为功能测试会执行所有的控制器代码，包括用于实现安全的过滤器。例如，当我们在前两个章节中为\
  \ People 和 Quips 添加 authn 和 authz 时，我们破坏了每个调用安全操作的测试，总共 15 个测试失败。\n\n我们在这里面临两个问题。首先，我们希望能够独立于安全约束测试控制器的逻辑。因此，我们有一组不包含任何过滤器的功能测试。其次，我们希望能够测试安全约束本身。此外，这两组测试必须易于编写。否则，忙碌的开发者就不会写它们。如果一个应用程序除了安全之外一切都是可测试的，那将太遗憾了。\n\
  \n`acts_as_authenticated` 插件包含一个 `AuthenticatedTestHelper` 模块来简化安全测试。你可以通过在 `test/test_helper.rb`\
  \ 中将该模块引入 `TestCase`，让所有测试都能使用 `AuthenticatedTestHelper`：\n\n```ruby\nclass Test::Unit::TestCase\n\
  \  include AuthenticatedTestHelper\nend\n```\n\n`AuthenticatedTestHelper` 添加了几个新的测试方法。最有用的是\
  \ `login_as`。为了让我们的测试再次通过，只需 `login_as` 一个拥有所有必要角色的账户。测试用例的 `setup` 方法是执行此操作的完美位置，因为它在每个测试之前运行：\n\
  \n```ruby\ndef setup\n```\n\n\n\n```ruby\n@controller = PeopleController.new\n\n\
  @request = ActionController::TestRequest.new\n\n@response = ActionController::TestResponse.new\n\
  \nlogin_as(:quentin)\n\nend\n```\n\n由于我们的身份验证（authn）和授权（authz）方法将用户和角色存储在数据库中，我们还需要向测试固件（fixture）中添加安全相关的表。\n\
  \n# 测试身份验证与授权\n\n例如，我们为 `QuipsController` 使用基于角色的安全机制，因此功能测试需要访问 `users`、`roles`\
  \ 和 `roles_users` 表：\n\n[下载代码 code/rails_xt/test/functional/quips_controller_test.rb](http://example.to.com)\n\
  \n```ruby\nclass QuipsControllerTest < Test::Unit::TestCase\n  fixtures :quips,\
  \ :users, :roles, :roles_users\nend\n```\n\n我们使用了之前的方法修复了 `QuipsController` 和 `PeopleController`\
  \ 中损坏的十五个功能测试。修复修复总共修改了五行代码：\n\n* 包含 `AuthenticatedTestHelper`（一行）\n*   在两个测试类中添加了\
  \ `login_as(:quentin)`（两行）\n* 编辑了相同的两个测试类的固件行（两行）\n\n现在功能测试恢复正常运行，因此我们可以将注意力转向测试安全约束本身。`AuthenticatedTestHelper`\
  \ 包含一个 `assert_requires_login` 方法，该方法检查特定的控制器调用是否被重定向到登录页面：\n\n[下载代码 code/rails_xt/test/functional/quips_security_test.rb](http://example.to.com)\n\
  \n```ruby\nassert_requires_login do |c|\n  c.post :create, :quip => {}\nend\n```\n\
  \n注意，这段代码位于一个不同的测试类 `QuipsSecurityTest` 中，而不是 `QuipsControllerTest`。我们使用单独的测试类是因为\
  \ `QuipsControllerTest` 总是以 Quentin 的身份登录，而我们现在正在测试没有登录时会发生什么。你也可以使用 `assert_requires_login`\
  \ 来测试 Aaron（一个凡人）是否缺少创建 quip 所需的角色：\n\n[下载代码 code/rails_xt/test/functional/quips_security_test.rb](http://example.to.com)\n\
  \n```ruby\nassert_requires_login(:aaron) do |c|\n  c.post :create, :quip => {}\n\
  end\n```\n\n这里的语法有点别扭，因为 `assert_requires_login(:aaron)` 实际上意味着“断言以 Aaron 登录是不够的，你会被重定向回登录页面”。\n\
  \n与其测试重定向，你可能想测试登录失败是否会改变数据库。`AuthenticatedTestHelper` 为此类测试提供了一个实用的 `assert_difference`\
  \ 方法。`assert_difference` 三个参数：一个对象、一个方法名和一个差异（默认认为 `+1`）。它还期望一个代码块。`assert_difference`\
  \ 会调用对象上的该方法，运行代码块，然后再次在对象上调用该方法，并检查与原始值的差异。你可以这样写：\n\n[下载代码 code/rails_xt/test/functional/quips_security_test.rb](http://example.to.com)\n\
  \n```ruby\nassert_difference(Quip, :count, 0) do\n  post :create, :quip => {}\n\
  end\n```\n\n换句话说，当提交一个新的 quip 时，`Quips.count` 保持不变（差异为 0）。这是预期的行为，因为如果你先登录，发布新的\
  \ quip 将失败。尽管它是随 `acts_as_authenticated` 提供的，但 `assert_difference` 方法实际上是一个通用方法，你可能会在其他地方发现它有用。\n\
  \n例如，Rails 脚手架（scaffold）测试了 `create` 会向数据库插入一条新行：\n\n[下载代码 code/rails_xt/test/functional/people_controller_test.rb](http://example.to.com)\n\
  \n```ruby\ndef test_create\n  num_people = Person.count\n  post :create, :person\
  \ => {}\n  assert_response :redirect\n  assert_redirected_to :action => 'list'\n\
  \  assert_equal num_people + 1, Person.count\nend\n```\n\n使用 `assert_difference`，可以将其重构为如下：\n\
  \n[下载代码 code/rails_xt/test/functional/quips_controller_test.rb](http://example.to.com)\n\
  \n```ruby\ndef test_create\n  assert_difference(Quip, :count) do\n    post :create,\
  \ :quip => {:text=>'Test Quip' }\n    assert_response :redirect\n    assert_redirected_to\
  \ :action => 'list'\n  end\nend\n```\n\n人们有时会将安全等同于我们刚刚描述的这些步骤，即为应用程序启用身份验证和授权。我们希望更进一步。我们不仅仅是在应用程序的边缘打补丁，而是让安全成为贯穿整个设计生命周期的无处不在的关注。\n\
  \n# 防止十大安全漏洞\n\n开放 Web 应用安全项目（OWASP）是一个非营利组织，提供免费的开源资源来发现和对抗漏洞。其中一项资源就是“十大”（Top\
  \ Ten），它代表了一组安全专业人员对最关键 Web 漏洞的共识。我们将逐一介绍这些。\n\n## 未验证的输入\n\n攻击者可以篡改 HTTP 请求的任何部分：URL、查询字符串、头部、主体、Cookie\
  \ 和表单数据。请求的所有部分都是用户输入，不可信任。不验证输入的程序可能会受到注入攻击，并可能泄露或破坏用户不应访问的数据。\n\nJava Web 框架和\
  \ Rails 都提供了声明式验证机制来防止未验证的输入。例如，在示例 Struts 应用程序中，`validation.xml` 包含了表单验证规则。在 Rails\
  \ 中，验证直接声明在模型类上。无论哪种方式，只有当开发者有系统地确保验证正确应用于每一个输入时，验证才能发挥作用。\n\nRails 中验证的一个担忧是，很多“魔法”会自动发生。例如，通常使用如下代码从表单数据直接创建\
  \ ActiveRecord 实例：\n\n```ruby\n@quip = Quip.new(params[:quip])\n```\n\n这里发生了一些很好的魔法。因为验证是在\
  \ ActiveRecord 级别进行的，如果验证失败，在新对象上调用 `save` 将失败（完全不会接触数据库！）。由于 quip 验证了文本字段的存在，因此不用担心这行代码创建一个文本为\
  \ NULL 的无效 quip。\n\n但也许魔法太多了。想象一下创建新 quip 的表单只提供两个字段：text 和 commit。如果用户提交以下 POST\
  \ 请求体会发生什么？\n\n`quip[text]=Hello, world&quip[author_id]=15&commit=Create`\n\n哎。那个\
  \ `author_id` 参数为什么出现在那里？即使你没有在表单中包含该值，没有任何东西能阻止好奇（或恶意）的用户将其添加到 POST 请求中。现在这个 quip\
  \ 看起来是由 ID 为 15 的用户编写的。如果你的数据库包含了不让用户直接访问的列，那么 Rails 的\n\n\n\n\n\n默认的批量赋值将成为一个问题。解决这个问题的一种（非常糟糕的）方案是回到手动赋值每个值：\n\
  \n```ruby\n@quip = Quip.new\n@quip.some_attr = params[:quip][:some_attr]\n@quip.other_attr\
  \ = params[:quip][:other_attr]\n@quip.another_attr = params[:quip][:another_attr]\n\
  # 等\n```\n\n`ActiveRecord` 了一个了一个更好的解决方案。我们可以使用 `attr_accessible` 方法来声明可以进行批量赋值的属性精确列表。或者，我们可以使用\
  \ `attr_protected` 方法来声明不能批量赋值的属性列表。在这两个选项中，`attr_accessible` 被认为更安全，因此我们将使用 `attr_accessible`\
  \ 来确保只有预期的值被赋值：\n\n[code/rails_xt/app/models/quip.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/models/quip.rb)\n\
  \n```ruby\nattr_accessible :text\n```\n\n你可以使用验证来校验你期望看到的字段，并使用 `attr_accessible`\
  \ 来确保只有预期的字段被赋值。\n\n### #2: 破坏的访问控制\n\n我们已经在第 10.2, 节使用 `Authorization` 插件进行授权（位于第\
  \ 285. 页）详细讨论了访问控制。即使有了授权机制，你也必须小心避免完全绕过授权的技巧。一些危险因素如下：\n\n- 构造相对路径（`../../../etc.`）的路径穿越攻击，用以进入本应不可访问的地方\n\
  - 包含敏感信息的读取配置文件（在某些情况下包括密码）\n- 直接访问深层 URL，这些 URL 仅受到用户会先通过其他受保护 URL 的假设的保护\n- 绕过安全性的缓存\n\
  \n防止十大网络安全漏洞，295 页\n\n大多数此类问题在 Java 和 Rails 中的表现形式相似，但你应该特别注意其中一点。Java 程序员习惯于在数据层面进行缓存。在\
  \ Rails 中，缓存主要在视图层面完成。当你在 Rails 中缓存页面时，它们会直接从 Web 服务器传递给用户，而完全不涉及 Rails。\n\n页面缓存速度很快，但要小心。任何缓存页面都会绕过\
  \ Rails 的所有安全机制。Rails 提供了 `action caching` 来处理这种操作缓存问题。当用户访问缓存的 action 时，Rails 在返回缓存结果之前执行控制器的\
  \ `before_filters`。由于安全检查通常在 `before_filters` 中执行，因此缓存的 action 是安全的。详情请参见第 6.7,\
  \ 节 页面、操作和片段缓存，位于第 180 页。\n\n当然，操作缓存比页面缓存慢。一分钱一分货。对公共资源使用页面缓存，对受保护资源使用操作缓存。\n\n\
  ### #3: 破坏的身份验证和会话管理\n\n即使正确实现了访问控制，身份验证或会话管理不当也可能损害安全性。以下是一些示例：\n\n- 身份验证通常会将信息放在会话中，以便后续请求知道用户已通过验证。用于识别会话的\
  \ cookie 必须受到保护。使用 `Secure Sockets Layer (SSL)` 保护登录步骤，然后继续信任基于 HTTP 以明文提交的相同 cookie\
  \ 的登录，是意义不大的。\n- 密码应该是强力的（不容易被猜到）。密码不应以明文形式存储在任何地方。（这就是为什么系统管理员可以重置你的密码，但他们不能告诉你密码是什么。）\n\
  - 在 Java 和 Rails Web 应用程序中，开启 `SSL` 是 Web 服务器的设置，独立于应用程序代码本身。然而，应用程序代码可以（并且应该）双重检查应该加密的请求确实执行了加密。在\
  \ Rails 应用程序中，请求实现了 `ssl?` 方法，如果请求是通过 `SSL` 发出的，则返回 `true`。\n\n防止十大网络安全漏洞，296 页\n\
  \n`Acts as Authenticated` 的主页包含了为 Rails 应用添加各种密码管理功能的教程和代码：用户激活、初始密码生成、密码重置和密码更改。\n\
  \n### #4: 跨站脚本 (XSS)\n\n当 Web 应用程序向用户发送恶意代码时，就会发生跨站脚本攻击。这做起来意想不到地简单。当我们为某些网站填写用户信息时，我们将姓氏设置为如下：\n\
  \n`\"Halloway <script type='text/javascript'>(恶意代码)</script>\"`\n\n如果 Web 应用程序接受了此输入，那么任何在启用\
  \ JavaScript 的浏览器中查看 `List Users` 屏幕的人都会执行恶意代码。防止这种攻击的最佳方法是进行严格的正向验证（positive validation）。与其猜测某些可能溜入恶意代码的方法，不如直接验证合法值的正向集合，使用第\
  \ 4.5, 节 验证数据值（位于第 113. 页）的技术。\n\n对于数据字段，正向验证太开放而无法消除所有可能的 XSS 技巧怎么办？猜测某些可能溜入恶意代码的方法可能是可能的。尽管如此，剔除最明显的\
  \ XSS 攻击也是值得的。`ERb` 模板包含了 `html_escape` 方法来转义输出中的 HTML 标签。该方法有一个常用别名 `h`，如此视图代码片段所示：\n\
  \n[code/rails_xt/app/views/quips/list.rhtml](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/views/quips/list.rhtml)\n\
  \n```html\n<% for column in Quip.content_columns %>\n<td><%= h quip.send(column)\
  \ %></td>\n<% end %>\n```\n\n### #5: 缓冲区溢出\n\n缓冲区溢出攻击利用某些运行时程序变量和栈帧共享内存空间的特性。如果攻击者可以破坏程序变量，他们破坏的不仅仅是一个值。如果损坏扩展到栈帧，攻击者可以执行任意代码，通常可以获取整个机器的控制权。\n\
  \n1. [`technoweenie.stikipad.com/plugins/show/Acts+as+Authenticated`](http://technoweenie.stikipad.com/plugins/show/Acts+as+Authenticated)\n\
  \n防止十大网络安全漏洞，297 页\n\n由于其内存模型不允许必要的栈损坏，Java 和 Ruby 程序不会直接遇到这个问题。但是 Java 虚拟机或 Ruby\
  \ 解释器可能会受到缓冲区溢出的影响，请跟进安全更新。\n\n### #6: 注入漏洞\n\n注入漏洞发生在攻击者可以将恶意代码注入 Web 应用程序，并由某些后端进程执行时。在\
  \ Java 世界中，最著名的注入漏洞是 SQL 注入。当编写糟糕的程序通过字符串拼接动态构建 SQL 命令时，攻击者可以使用分隔符和注释来溜入在数据库上执行任意命令的语句或子句。\n\
  \nSQL 注入发生在任何支持字符串和 SQL 的语言，即几乎所有用于 Web 应用开发的语言，包括 Ruby。这里是将经典的 SQL 注入错误转换为 ActiveRecord\
  \ 代码：\n\n[code/rails_xt/app/models/person.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/models/person.rb)\n\
  \n```ruby\n# 此方法演示了 SQL 注入攻击\n# 不要像这样写代码\ndef self.find_by_any_name_UNSAFE(search)\n\
  \  find(:all, \\\n  :conditions=>\"first_name = '#{search}' OR last_name = '#{search}'\
  \ )\nend\n```\n\n\n\n这里的问题在使用字符串插值来插入搜索词。如果用户输入的词是 `Fred`，一切都会正常。但搜索 `foo’ OR true\
  \ OR id=\\’` 将返回表中的每一行。（你可以通过运行 `test/unit/person_test.rb` 来看到这一点。是的，我们编写了单元测试来证明我们这个有问题的示例确实是有问题的。）\n\
  \n返回意外之外的行很容易违反安全约束，而且还有更糟糕的可能性。攻击字符串可以被构造为 SQL 数据库可以做的任何操作：创建、读取、更新、删除，甚至运行存储过程。在\
  \ Ruby 中解决此问题与 Java 的 `JDBC` 相似：不要使用原始字符串拼接构建 SQL 命令。相反，请使用能够自动引用用户输入的 API。在 `ActiveRecord`\
  \ 中，`:conditions` 子句会自动对参数进行引号处理，因此前面的示例应该重写如下：\n\n防止十大 Web 安全漏洞\n298\n\n[下载 code/rails_xt/app/models/person.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/models/person.rb)\n\
  \n```\ndef self.find_by_any_name(search)\n  find(:all, :conditions=>['first_name\
  \ = :search or last_name = :search' , {:search=>search}])\nend\n```\n\n## #7. 不恰错误处理\n\
  \nWeb 错误会发生，而处理这些错误是一项挑战。问题在于平衡不同的受众。用户应该获得帮助，管理员应该获得详细的诊断信息，而攻击者应该一无所获。一个例子将说明这个问题。Ned\
  \ 登录一个网站并执行了某些导致服务器上某些 Ruby 代码发生异常的操作。日志文件应该包含有关该问题的详细信息，以便开发者和管理员之后进行排排除。我们无法确定\
  \ Ned 是不是攻击者，因此 Ned 将得到一个通用的错误消息。特别是，我们不希望提供详细且多变的错误消息，以免鼓励攻击者通过让系统以不同的方式崩溃来分析我们的系统。\n\
  \nRails 对错误的默认处理是很好的。在开发环境中，详细的错误信息会自动写入浏览器窗口和 `log/development.log` 中。为了方便查看，我们在\
  \ `AccountController` 中添加了一个故意损坏的名为 `fail` 的方法：\n\n[下载 code/rails_xt/app/controllers/account_controller.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/controllers/account_controller.rb)\n\
  \n### 展示了错误处理代码中可能的某些危险\n\n```\ndef fail\n  raise \"Failed\"\nend\n```\n\n如果你运行\
  \ Quips 应用并导航到 `/account/fail/1`，你将看到与下一页图 [10.1] 所示相似的错误消息。你可以点击链接查看整个堆栈跟踪。`log/development.log`\
  \ 中的消息也是类似的。\n\n在生产环境中，你不会希望在错误消息中提供这种级别的内部细节。相反，Rails 将错误消息路由到 `public/500.html`\
  \ 的静态 HTML 页面，你可以根据需要对其进行编辑。\n\n默认行为是一个很好的开始，但并不是故事的结束。默认情况下，Rails 将 HTTP 参数转储到日志文件中。这些表单参数中的（例如密码）是敏感的，不应以明文形式存储在日志文件或其他任何地方。\n\
  \n图 10.1：开发错误消息\n防止十大 Web 安全漏洞\n299\n\n为了处理这个问题，Rails 控制器提供了 `filter_parameter_logging`\
  \ 方法。该类方法可以接受参数名的正则表达式，这些参数不应包含在日志文件中。例如，Quips 应用如下所示：\n\n[下载 code/rails_xt/app/controllers/application.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/controllers/application.rb)\n\
  \n```\nfilter_parameter_logging 'password'\n```\n\n结果，任何匹配 `/password/i` 的参数都将在日志文件中过滤。例如，导航到\
  \ `/account/fail?password=supersecret` 将在日志文件中留下以下：\n\n```\nProcessing AccountController#fail\
  \ (for 127.0.0.1 at 2006-09-25 14:07:41) [GET]\nSession ID: b2745e2f7ce5fb0201c030aa4a31986c\n\
  Parameters: {\"action\" =>\"fail\" , \"controller\" =>\"account\" , \"password\"\
  \ =>\"[FILTERED]\" }\n```\n\n这处理了 Rails 的默认日志。如果你对敏感数据进行自己的日志记录，你需要小心确保数据已经过适当的清理。\n\
  \n防止十大 Web 安全漏洞\n300\n\n## #8. 不安全存储\n\n应用程序需要存储敏感信息，如密码和信用卡号。Java 和 Ruby 都有提供正确执行这些操作所需的加密和哈希函数的库。尽管如此，存储安全数据是困难的。即使使用最好的库，你也必须思考如何以安全的方式使用它们。此外，存储安全数据通常意味着法律责任。因此，我们强烈建议采取以下方法处理安全数据：\n\
  \n- 不要存储安全数据。\n- 如果设计绝对需要安全数据，请使用已知的系统，而不是自己开发。\n- 仅在万不得已的情况下自己开发，并寻求安全专家的评审。\n\n\
  `acts_as_authenticated` 插件演示了使用哈希和盐（salt）存储密码的合理用法；详情请查看 `user.rb`。\n\n## #9. 应用程序拒绝服务\n\
  \nWeb 应用特别容易拒绝服务攻击，攻击者消耗应用程序的资源资源，导致合法用户无法获得服务。大多数情况下，这些攻击并不针对特定语言的实现，因此对于 Java、Ruby\
  \ 或任何其他语言，大多数预防措施都是相同的。你应该注意一个 Ruby 特有的问题。Java 应用使用多线程来处理并发请求，并使用数据库级缓存来提高性能。（较大的\
  \ Java 应用也使用多个进程，但许多应用从单进程运行良好。）Rails 应用使用多个进程来处理并发请求，并使用视图级缓存来提高性能。这意味着即使是少量的昂贵请求也会让标准配置变得缓慢。解决办法是让缓存尽可能多工作，理想情况下处理所有未身份验证的请求。\n\
  \n## #10. 不安全的配置管理\n\n引用理查德·道金斯的话：尽管正确配置服务器的方法有很多种，但可以确定，配置错误的方法要多得多。OWASP 网站列出了几个可能削弱安全的配置问题，包括：\n\
  \n- 默认帐户和密码\n- 启用了不必要的服务（尤其是管理员服务）\n- 未修复的漏洞\n- 不恰的文件权限\n- 配置错误的 SSL\n\n这些问题不是特定语言的，因此大多数情况下没有特定的“Ruby”或“Java”方法。Rails\
  \ 确实有一个独特的特征。由于 Rails 是一个具有标准化目录结构的全栈框架，大多数 Rails 应用看起来相似。这对于保护应用程序配置非常有益，因为好的主意可以很容易（有时是自动地）提供给所有的\
  \ Rails 应用。缺点是，Rails 配置安全的缺陷可能会影响整个 Rails 社区。\n\n这带我们进入了今为止最重要的一个 Rails 安全漏洞。2006\
  \ 年 8 月 9 日，Rails 团队宣布了一个安全漏洞和一个\n\n\n\n\n立即强制补丁。一天后，即 2006 年 8 月 10 日，他们公布了问题的完整细节并提供了更多关于补丁的文档。该漏洞存在\
  \ Rails 的路由代码中，它允许对 Ruby 代码进行意外评估。例如，`/script/*` URL 将会调用 Rails script 目录下的支持脚本。\n\
  \n此漏洞是 OWASP 前十大中几项内容的示例：至少包括拒绝服务、不安全的配置管理和访问控制失效。解决方案也在前十大列表中：为了防止配置不安全，你必须始终保持补丁更新。\n\
  \n本章仅对 Web 应用安全提供了简要概述。由于此书是关于 Ruby 和 Rails 编程的，我们只强调了某些特定于代码和特定语言的问题。\n\n应用程序的安全包含不仅仅是编码实践。特别是，单凭代码无法抵御有意的攻击者。攻击是动态的、主动的并由人类智能引导的。防御措施也必须包含这些元素。对于这些问题有一个良好且不过于技术性的介绍，我们推荐\
  \ [[Sch04]](#index_split_003.html_p306)。\n\n### 10.5 资源\n\n### Acts as Authenticated\n\
  . . [`technoweenie.stikipad.com/plugins/show/Acts+as+Authenticated`](http://technoweenie.stikipad.com/plugins/show/Acts+as+Authenticated)\n\
  \nActs as Authenticated 用于节 10.1, 使用 `acts_as_authenticated` 插件进行认证，位于第 283. 页。\n\
  \n### Authorization Plugin\n. . [`www.writertopia.com/developers/authorization`](http://www.writertopia.com/developers/authorization)\n\
  \nAuthorization 插件用于节 10.2, 使用 `Authorization` 插件进行授权，位于第 285. 页。\n\n### Open Web\
  \ Application Security Project\n. . [`www.owasp.org`](http://www.owasp.org)\n\n\
  开放 Web 应用安全项目 (OWASP) 致力于发现和对抗不安全软件的根源。侧的所有内容都是免费开源的。\n\n### Rails 1.1, backports,\
  \ and full disclosure\n. . [`weblog.rubyonrails.org/2006/8/10/rails-1-1-6-backports-and-full-disclosure`](http://weblog.rubyonrails.org/2006/8/10/rails-1-1-6-backports-and-full-disclosure)\n\
  \n对 Rails 1.1.0 到 1.1.5 中严重安全漏洞的解释。离开这些版本，并在此阅读了解 Rails 团队是如何处理该问题的。\n\n### Spring\
  \ Acegi\n. . [`www.acegisecurity.org/`](http://www.acegisecurity.org/)\n\nAcegi\
  \ Security 为 Java 应用提供全面的认证、授权、基于实例的访问控制和通道安全。由于它与面向切面编程（AOP）和 servlet 过滤器集成，我们倾向在\
  \ Java 项目中使用 Acegi。\n\n# 附录 A：Java Java 字典\n\n此字典将 Java 概念映射到 Ruby 和 Rails 概念。这种映射并不总是完全精确或一一对应的；有关更多细节，请参考参考文献。\n\
  \n### AOP\n面向切面编程（Aspect-Oriented Programming）。`AOP` 是一种提高代码模块化（以及 DRY 原则）的方法。传统上散落在整个应用程序中的代码被聚集在一个切面（aspect）中，然后在需要的地方重新织回应用程序中。由于切面可以用于绕过语言限制，因此切面在\
  \ Java 中至关重要。Java 通过 `AspectJ` 提供了极好的 AOP 支持。得益于 `method_missing` 等语言特性以及运行时重写方法的能力，切面在\
  \ Ruby 中不重要。我们使用一个名为 `AspectR` 的简单 Ruby 切面库。\n\n### block\nblock 是一个可以传递给方法的代码段。Java\
  \ 没有等价物。Ruby 程序使用 block 的地方，Java 程序使用单方法接口和匿名内部类的组合。block 贯穿本书，并在节 2.4, 集合与迭代中介绍，位于第\
  \ 47. 页。\n\n### class\nRuby 也有类；参见节 2.6, 定义类，位于第 57. 页。\n\n### cobertura\n`Cobertura`\
  \ 是一个测量覆盖率的开源工具。Ruby 世界中大致等价物是 `rcov`。参见节 7.6, 使用 `rcov` 测量覆盖率，位于第 222. 页。\n\n###\
  \ constructor\nRuby 中构造函数的等价物是一个名为 `initialize` 的方法。参见节 2.6, 定义类，位于第 57. 页。\n\n\
  ### CruiseControl\n`CruiseControl` 是一个流行的 Java 开源框架。Ruby 中没有全面的等价物。参见节 8.5, 持续集成，位于第\
  \ 244. 页。\n\n### JavaServer Pages\nJavaServer Pages (JSP) 的等价物是 ActionView 中的 `.rhtml`\
  \ 文件。参见节 6.1, 创建基础 rhtml，位于第 168. 页。\n\n### field\nRuby 有实例变量，命名为 `@my_var`。参见节\
  \ 2.6, 定义类，位于第 57. 页。\n\n### method\nRuby 也有方法，命名为 `my_method`。参见节 2.3, 对象与方法，位于第\
  \ 44. 页。\n\n### hibernate.cfg.xml\n`hibernate.cfg.xml` 文件包含数据库设置。在 Rails 中，连接设置位于\
  \ `database.yml`（参见节 4.1, 连接，位于第 97. 页）。\n\n### servlet filters\nservlet 过滤器的 Rails\
  \ 等价物是控制器过滤器和 `verify`。参见节 5.5, 使用过滤器和 verify 管理交叉关注点，位于第 147. 页。\n\n### soap4r\n\
  这是调用 SOAP 服务器的 Ruby API。它类似于轻量易用的 JAX-RPC 版本。它是 Ruby 标准库的一部分。节 9.2, 使用 `soap4r`\
  \ 使用 SOAP 服务，位于第 259. 页。\n\n### static method\nRuby 提供了几种声明类方法的方法。参见节 2.6, 创建静态方法，位于第\
  \ 61. 页。\n\n### tag libraries\nRails 没有标签库的直接等价物。相反，Rails 应用使用视图助手和集合部分模板（partials）。参见节\
  \ 6.2,。\n\n\n\n\n\n# 使用视图辅助函数减少视图代码，位于第 169 页\n\n## 附录 B\n\n### 参考文献\n\n- **[Goe06]**:\
