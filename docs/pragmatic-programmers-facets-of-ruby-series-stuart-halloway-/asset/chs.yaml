  \ | DELETE | `/authors/1` (Accept) | | destroy |\n| Delete | DELETE | `/authors/1.xml`\
  \ | text/xml | destroy |\n\n图 9.1: RESTful 路由示例\n\n之前的三个示例说明了 Rails 处理 REST 方法中的核心概念：\n\
