- "# 务实程序员系列：Ruby 的多个面； Stuart Halloway Justin Gehtland；Java 开发者的 Rails 指南；务实程序员 2007\n\
  \n\n\n![](img/cover.jpeg)\n\n![Image 1](img/index-1_1.jpg)\n\n# 读者对《Rails for Java\
  \ Developers》的评价\n\n**读者对《Rails for Java Developers》的评价**\n每一个 Java 开发者都应该接触不同语言的思想，而\
  \ Ruby/Rails 是优秀思想的源泉。阅读这本书——它将帮助你学习 Ruby 和 Rails，并为你提供可以到 Java 的新思路。\n\n> **David\
  \ Bock**\n> FGM Inc. 联邦与商业部门技术总监\n\nStuart 和 Justin 完成了一项我曾认为不可完成的任务：将 Java 开发者理解\
  \ Ruby on Rails 所需的所有知识整合。在这本书出现之前，你可能需要至少读三本书（多达数千页的内容）才能获得这本精辟文本所总结的相同理解。他们清楚地理解等式的两端（`RoR`\
  \ 和 `Java`），这使他们能够切除无关信息并直击重点。对于不仅仅是学习 Rails 的人来说，这本书应该是必读的：每个 Java 开发者都能从学习 Rails\
  \ 传授的重要教训中受益。\n\n> **Neal Ford**\n> Thoughtworks 应用架构师/开发者\n\n如果你是一个 Java 开发者并想探索\
  \ Ruby on Rails，那么这本书就是你需要的。Justin 和 Stu 以精湛的技巧从 Java 开发者的视角揭示了 Ruby 和 Ruby on Rails\
  \ 的复杂之处。不仅如此，这本书还写得极好，读起来是一种享受。\n\n> **David Geary**\n> 《Graphic Java Swing》作者、《Core\
  \ JavaServer Faces》合著者\n\nStu 和 Justin 为 Java 开发者提供了一个独特的机会，通过从熟悉且舒适的视角展示 Rails\
  \ 堆栈，让他们“读懂” Rails。通过这种方式，他们证明了 Rails 和 Java 并不是互斥的。\n\n> **Ted Neward**\n> 《Effective\
  \ Enterprise Java》作者\n\n如果你是一个试图学习 Rails 的 Java 开发者，这本书是你的开始之地。没有比这更优质的能让你快速上手 Rails、Ruby、`Rake`\
  \ 和 `ActiveRecord` 的资源了。\n\n> **Mark Richards**\n> IBM 高级 IT 架构师\n\n听某些人说，Java 和\
  \ Rails Web 开发阵营之间存在紧张的竞争关系，但从我的立场来看很难看到这一点。我认识的大多数快乐 Rails 开发者都有很长的 Java 程序员历史，虽然我们热爱\
  \ Java 擅长之处，但 Java 的 Web 开发仍有许多不足。Rails 像是一股令人悦目的清风，我深信这本书将打开许多其他寻找更佳构建 Web 应用方法的\
  \ Java 开发者的眼界。\n\n> **Glenn Vanderburg**\n> 独立 Ruby 和 Java 顾问\n\n\n\n\n![Image 2](img/index-6_1.png)\n\
