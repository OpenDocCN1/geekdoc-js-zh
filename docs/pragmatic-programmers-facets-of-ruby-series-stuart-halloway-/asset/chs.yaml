  \n## 鸭子类型 (DUCK TYPING)\n\n89\n\n方法的粒度（ think 一下 `Runnable`）。Ruby 程序员可以通过调用 `kind_of?`\
  \ 进行更前期的类型检查。例如：\n\n[下载 code/rails_xt/samples/poly_demo.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/poly_demo.rb)\n\
  \n```ruby\nclass Object\n  def must_be(*types)\n    types.each {|type| raise \"\
  Must be #{type}\" unless self.kind_of?(type)}\n  end\nend\n```\n\n程序可以调用 `must_be`\
  \ 并传递对象必须支持的任意数量的类型（类或模块）：\n\n[下载 code/rails_xt/samples/poly_demo.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/poly_demo.rb)\n\
  \n```ruby\nme = BusinessPerson.new(\"Stu\" , \"Halloway\" )\nme.must_be(Person,\
  \ Employer, Employee)\n```\n\n尽管 Ruby 程序员可以开发像 `must_be` 这样的惯用法，但他们很少这样做。相反，他们拥抱鸭子类型。\n\
  \n### 3.7 鸭子类型\n\n鸭子类型意味着一个对象的类型取决于它能做什么，而不是取决于它是什么。“如果它走起来像鸭子，叫起来也像鸭子，那么对于解释器来说，它就是一只鸭子。”鸭子类型允许你在无需进行大量重复工作的情况下接入新的实现。只需编写一个实现了所需方法的对象，然后将其放入系统中以替换其他对象即可。在实践中，这在三个主要方面节省了时间（和代码）：\n\
  \n*   为单元测试编写存根对象（stub objects）非常容易。如果你在单元测试中需要某个对象的虚拟版本，鸭子类型让这变得轻而易举——只需实现测试所需的精确方法即可。\n\
  *   鸭子类型打破了导致重复代码的人为边界。\n*   鸭子类型使得从特定关系重构为更通用的关系变得更容易。\n\n鸭子类型也有一个明显的缺点：自动化工具很难猜测与变量相关的可能方法（尽管并非不可能）。由于这一点（以及迄为止缺乏投入），Ruby\
  \ IDE 提供的代码补全和重构水平远不能与最优秀的 Java IDE 媲提并语。\n\n## 混入 (MIXINS)\n\n90\n\n### 3.8 混入\n\
  \n在第 3.6, 页“多态与接口”章节中，第 85, 页，你学习了在 Java 中如何调用多态方法。通常，多个多态实现是相似的，它们委托给相同的底层代码。\n\
  \n对于 `Employer` 的实现，我们选择让 `Company` 和 `BusinessPerson` 都委托给辅助类 `EmployerImpl`。以下是来自\
  \ `Company` 的代码，我们将省略 `BusinessPerson` 中几乎相同的代码：\n\n[下载 code/java_xt/src/poly/Company.java](http://media.pragprog.com/titles/fr_r4j/code/code/java_xt/src/poly/Company.java)\n\
  \n```java\npackage poly;\n\npublic class Company implements Employer {\n  private\
  \ String name;\n  private EmployerImpl employerImpl;\n\n  public Company(String\
  \ name) {\n    this.name = name;\n    this.employerImpl = new EmployerImpl();\n\
  \  }\n\n  public int employeeCount() {\n    return employerImpl.getEmployees().length;\n\
  \  }\n\n  public Employee[] getEmployees() {\n    return employerImpl.getEmployees();\n\
  \  }\n\n  public void addEmployee(Employee e) {\n    employerImpl.addEmployee(e);\n\
  \  }\n\n  public void removeEmployee(Employee e) {\n    employerImpl.removeEmployee(e);\n\
  \  }\n}\n```\n\n这可以直接翻译成 Ruby，或者可以像第 3.5, 页第 83. 页“委托”章节所示进行改进。Ruby 混入提供了另一种方法：代码只需编写一次，就可以根据需要混入到任意数量的类或模块中。以下是用于混入使用的模块形式\
  \ `Employer`：\n\n[下载 code/rails_xt/samples/employer.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/employer.rb)\n\
  \n```ruby\nmodule Employer\n  def employees\n    @employees ||= []\n  end\n\n  def\
  \ add_employee(employee)\n    @employees << employee\n  end\n\n  def remove_employee(employee)\n\
  \    @employees.delete(employee)\n  end\nend\n```\n\n`BusinessPerson` 类可以通过调用 `include`\
  \ 获得 `Employer` 的功能，从而：\n\n[下载 code/rails_xt/samples/poly_demo.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/poly_demo.rb)\n\
  \n```ruby\nclass BusinessPerson < Person\n  include Employer\nend\n```\n\n`Company`\
  \ 类也可以这样实现：\n\n```ruby\nclass Company < Person\n  include Employer\n\n  def initialize(name)\n\
  \    @name = name\n  end\n\n  def employees\n    employerImpl.getEmployees\n  end\n\
  end\n```\n\n\n\n不同的标准，或者在运行时可能会出现新的标准，你很快就会想要一个可能像这样的通用的解决方案：\n\n```java\nCollections.sort(al,\
  \ sortByWordLength);\n```\n\n在英语中，这可以被读为“使用函数 `sortByWordLength()` 对集合 `al` 进行排序以比较单词。”事实上，Java\
  \ 的工作方式完全如此——只不过没有那个以 f 开头的单词（function）。4. 你不需要直接使用函数，而是可以使用你现有的部分来构建一个类似函数的对象：接口和继承。Java\
  \ 的集合 API 提供了一个 `Comparator` 接口：\n\n```java\npublic interface Comparator {\n   \
  \ int compare(Object o, Object o1);\n}\n```\n\n你可以编写自己的实现 `Comparator` 的自定义类，并根据你关心的某些标准来比较字符串。如果第一个对象较小，返回负数；如果对象相等，返回\
  \ 0；如果第二个对象是两者中较小的，则返回正数。为了指定排序顺序而创建一个全新的类往往会分散你的精力，因此 Java 提供了一个名为匿名内部类的快捷方法。通过使用匿名内部类，你可以直接在调用\
  \ `sort` 内部指定排序“函数”：\n\n[下载 code/java_xt/src/SortWords2.java](http://media.pragprog.com/titles/fr_r4j/code/code/java_xt/src/SortWords2.java)\n\
  \n```java\nCollections.sort(al, new Comparator() {\n    public int compare(Object\
  \ o, Object o1) {\n        return ((String)o).length() - ((String)o1).length();\n\
  \    }\n});\n```\n\nJava 的匿名内部类在以这种方式使用时，除了名字之外，处处都是函数。让排序函数返回负数、0 或正数在 Java 和 Ruby（以及许多其他语言）中都是通用的。在\
  \ Ruby 中，你可以使用块（block）来实现这种排序“函数”：\n\n[下载 code/rails_xt/samples/sort_words_2.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/sort_words_2.rb)\n\
  \n```ruby\nsorted = readlines.sort {|x,y| x.length-y.length}\nputs \"sorted:\\n#{sorted.join}\"\
  \n```\n\n块语法（大括号或 `do...end`）与你在第 2.4 部分“集合与迭代”章节第 47 页过的语法是相同的。在 Ruby 中，每当你想要“向方法传递一个函数”时，通常都会使用块。函数传递在\
  \ Java 和 Ruby 中都是非常常见的惯用法。Java 中其他明显的例子包括 Swing 中的事件处理、使用并发 API 调度 `Callables` 以及在\
  \ `PrivilegedAction` 上强制执行约束。在 Ruby 和 Rails 中，这种惯用法更为常见。\n\n块非常适合实现任务的包装器。例如，假设你想调用一个预计会抛出异常的函数。你可以写这样一个包装器：\n\
  \n[下载 code/rails_xt/samples/expect_exception.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/expect_exception.rb)\n\
  \n```ruby\ndef expect_exception(type)\n  begin\n    yield\n  rescue type => e\n\
  \    return\n  end\n  raise \"Expected exception: #{type}\"\nend\n```\n\nRuby 的\
  \ `yield` 语句会执行块中的代码，前提是向函数传递了块 `yield`。`expect_exception` 的工作原理如下：“调用传入的块，如果抛出了类型为指定类型的异常，则返回。否则，抛出异常。”根据\
  \ `expect_exception` 的定义，以下代码将正常返回：\n\n[下载 code/rails_xt/samples/expect_exception.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/expect_exception.rb)\n\
  \n```ruby\nexpect_exception(ZeroDivisionError) {10/0}\n```\n\n当 `expect_exception`\
  \ 遇到 `yield` 时，会执行块 `(10/0)` 中的代码。接下来的调用将失败并抛出 `Expected exception: ZeroDivisionError`：\n\
  \n[下载 code/rails_xt/samples/expect_exception.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/expect_exception.rb)\n\
  \n```ruby\nexpect_exception(ZeroDivisionError) {}\n```\n\n调用块还有第二种语法。你不需要使用 `yield`，可以使用显式参数来捕获块（如果存在）。块参数必须列在最后，并以波浪符号\
  \ `&` 前缀：\n\n[下载 code/rails_xt/samples/expect_exception_2.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/expect_exception_2.rb)\n\
  \n```ruby\ndef expect_exception(type, &blk)\n  begin\n    blk.call if block_given?\n\
  \  rescue type => e\n    return\n  end\n  raise \"Expected exception: #{type}\"\n\
  end\n```\n\n无论你选择哪种语法，都可以调用 `block_given?` 来判断是否实际向方法传递了块。（在 `expect_exception`\
  \ 的情况下，不传递块代表了极度的偏执——可能认为什么都不做不会抛出异常！）\n\n块在 Ruby 编程中极其常见，是 Java 程序员最大的语法障碍之一。记住，块提供了一种简洁的语法来执行你在\
  \ Java 中会执行的操作。\n\n# 函数\n\n# 4 使用 ActiveRecord 访问数据\n\nMartin Fowler 在 2006 年的 RailsConf\
  \ 主演讲中，将 ActiveRecord 描述为他见过的最好且最完整的“Active Record”模式的实现。该模式和库在模型数据的对象上暴露了持久化行为。通过将这些知识嵌入到对象中，ActiveRecord\
  \ 在模型与其底层数据库之间建立了紧密耦合。当人们说 Rails 是一种“有主见的软件”时，他们通常指的是 ActiveRecord 以及它关于对象与数据表映射的观点。\n\
  \n### 4.1 **连接**\n\n虽然 ActiveRecord 是 Rails 的一部分，你也可以作为一个独立的 gem 安装：\n\n```bash\n\
  gem install activerecord\n```\n\n在本章的大部分内容，我们将直接使用 ActiveRecord gem。这对于与 Hibernate\
  \ [(http://www.hibernate.org)](http://www.hibernate.org) 进行比较非常有帮助，这是一个高质量的 O/RM\
  \ 框架，可能是 Java 世界最流行的选择。正如你在本章中所看到的，ActiveRecord 和 Hibernate 在一个深层基础上的不同：Hibernate\
  \ 支持缓存，而 ActiveRecord 不。因此，在某些用法模式下，Hibernate 的性能更好，但 ActiveRecord 更容易使用。\n\n\n\n\
  \nJDBC 与你目标特定 RDBMS 之间的桥梁。作为 Java 开发人员，你的工作是安装相应的驱动程序、实例化它并将其传递给 JDBC 库以便在应用程序中使用。\n\
  \nActiveRecord 同样使用提供者模型，但将提供者称为适配器（adapters）。适配器可以是纯 Ruby 实现，也可以是 Ruby/C 扩展混合适配器。在应用程序代码中，你只需要指定想要使用的适配器名称；ActiveRecord\
  \ 将提供 Ruby 桥接代码，并处理加载原生扩展（如有必要）。如果未提供适配器或无法加载，ActiveRecord 将抛出一个异常并详细说明问题所在。\n\n\
  你可以通过编程方式配置 ActiveRecord，也可以通过配置文件配置 Ruby。要通过编程方式配置连接，可以在 `ActiveRecord::Base` 上调用\
  \ `establish_connection` 方法：\n\n[下载 code/rails_xt/samples/activerecord/connecting.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/activerecord/connecting.rb)\n\
  \n```ruby\nrequire 'rubygems'\nrequire_gem 'activerecord'\n\nActiveRecord::Base.establish_connection(\n\
  \  :adapter=>:mysql,\n  :database=>:rails4java_development\n)\n```\n\n除了指定适配器和数据库外，你还需要指定用户名和密码等连接设置。\n\
  \n# 配置 Rails XT 应用\n\nRails XT 应用程序有一些初始设置要求，因为它演示了 Rails 平台的几个第三方扩展。接下来列出了设置步骤，我们将在书中对应的部分进行更详细的解释。\n\
  \n1. 安装 Rails XT 需要的第三方 gems：\n```bash\ngem install mocha\ngem install flexmock\n\
  gem install selenium\ngem install markaby\n```\n\n2. Rails XT 应用程序演示了 Rails 1.2\
  \ 的功能。在本书此时，Rails 1.2 尚未发布。在正式发布之前，你可以遵循 Rails 网站上的说明并安装最新的发布候选（Release Candidate）。\n\
  \n3. 创建应用程序数据库。如果你使用 MySQL 控制台，请使用以下命令：\n\n```bash\n$ mysql -u root\nWelcome to\
  \ the MySQL monitor.\nCommands end with ; or \\g.\nYour MySQL connection id is 1\
  \ to server version: 4.1.12-standard\nType 'help;' or '\\h' for help. Type '\\c'\
  \ to clear the buffer.\nmysql> create database rails4java_development;\nQuery OK,\
  \ 1 row affected (0.30 sec)\nmysql> create database rails4java_test;\nQuery OK,\
  \ 1 row affected (0.30 sec)\nmysql> exit\nBye\n```\n\n4. 下载代码后，你可以运行 Rake 任务来创建数据库表：\n\
  ```bash\ncd rails_xt\nrake migrate\n```\n\n如果此命令失败，请验证你是否安装了可以运行的 MySQL 且 root 用户没有密码。（这是\
  \ MySQL 的默认设置。）\n\nActiveRecord 会在尽可能的情况下使用默认参数，因此之前的连接将使用 root/无密码，这是 MySQL 的标准初始设置。在\
  \ Rails 应用程序中，你不需要自己建立连接。Rails 会自动从 `config/database.yml` 读取连接设置。默认情况下，`database.yml`\
  \ 包含开发（development）、测试（test）和生产（production）环境的设置：\n\n```yaml\ndevelopment:\n  adapter:\
  \ mysql\n  database: rails4java_development\n  username: root\n  password:\n  host:\
  \ localhost\ntest:\n  adapter: mysql\n  database: rails4java_test\n  username: root\n\
  \  password:\n  host: localhost\n# production looks similar\n```\n\n该文件是 YAML 格式（YAML\
  \ 并不是标记语言）。如你所见，配置是重复的。如果你愿意，可以使用 YAML 的别名（aliases）和锚点（anchors）来对其进行 DRY 处理。和符号\
  \ `&` 引入别名，随后的星号 `*` 则创建一个引用该别名的锚点。\n\n```ruby\nirb(main):004:0> YAML.load \"[&foo\
  \ 1, *foo, *foo]\"\n=> [1, 1, 1]\n```\n\n对 Rails 数据库配置的共同部分应用别名后结果如下：\n\n[下载 code/rails_xt/config/database.yml](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/config/database.yml)\n\
  \n```yaml\ncommon: &shared\n  adapter: mysql\n  username: root\n  password:\n  host:\
  \ localhost\n\ndevelopment:\n  database: rails4java_development\n  <<: *shared\n\
  ```\n\n1. DRY 代表 Don’t Repeat Yourself（不要重复自己）。我们将 DRY 同时作为名词和动词使用，因此“DRY 你的代码”意味着消除重复。请参见《The\
  \ Pragmatic Programmer [[HT00]](#index_split_003.html_p306) 以深入讨论为什么 DRY 如此重要。\n\
  \n# 使用迁移（Migrations）管理架构版本\n\n## 多数据库该怎么办？\n\n默认情况下，Rails 假设所有模型都来自同一个数据库。如果你需要从不同的数据库提取不同的模型，可以在特定的模型类上重写\
  \ `establish_connection()`。此外，ActiveRecord 在类型层级中遵循这些设置。每个模型类都使用与其距离最近的连接设置。\n\n\
  什么让代码变得敏捷（即易于更改）？大多数开发者会回答“自动化测试和版本控制”。\n\n### 使用迁移\n\n默认情况下，Rails 假设所有模型都来自同一个数据库。如果你需要从不同的数据库提取不同的模型，可以在特定的模型类上重写\
  \ `establish_connection()`。此外，ActiveRecord 在类型层级中遵循这些设置。每个模型类都使用与其距离最近的连接设置。\n\n\
  一个迁移是一段可以执行两个任务的 Ruby 代码：更改数据库架构并撤销该更改。通过迁移，你的架构可以像代码一样敏捷。单个迁移将架构更改与特定的时间点关联，而 Rails\
  \ 提供了向前和向后运行架构的脚本。迁移是 Rails 创建、修改和版本化架构的方式。\n\n我们现在展示如何使用迁移为示例应用程序创建数据架构。第一个对象是\
  \ Quip，它是博客世界中的某些幽默格言。为了创建 quip，我们运行了此：\n\n```bash\n> script/generate migration\
  \ create_quips\n```\n\n这创建了一个名为 `db/migrate/001_create_quips.rb` 的新迁移。然后我们对迁移文件进行了如下：\n\
  \n[下载 code/rails_xt/db/migrate/001_create_quips.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/db/migrate/001_create_quips.rb)\n\
  \n```ruby\nclass CreateQuips < ActiveRecord::Migration\n  def self.up\n    create_table\
  \ :quips do |t|\n      t.column :text, :text\n      t.column :author_id, :int\n\
  \    end\n  end\n\n  def self.down\n    drop_table :quips\n  end\nend\n```\n\n`self.up()`\
  \ 方法指示如何创建 quips 表，而 `self.down()` 方法指示如何撤销该过程。注意，表的创建是用 Ruby 完成的，而不是原始 SQL。这使得迁移可以在不同的数据库之间迁移。如果你需要访问特定数据库的功能或执行当前迁移\
  \ API 不支持的操作，也可以使用原始 SQL。\n\n你可以通过运行 `rake migrate` 来执行迁移：\n\n```bash\n$ rake migrate\n\
  (in /Users/stuart/FR_RAILSJAVA/Book/code/rails_xt)\n== CreateQuips: migrating ============================\n\
  -- create_table(:quips)\n-> 0.3117s\n== CreateQuips: migrated (0.3133s) ===================\n\
  ```\n\n现在你的数据库有了一个 quips 表。你也可以使用运行迁移：\n\n\n\n\n特定的版本号。所有迁移都包含一个版本号作为文件名的前缀，例如 `001_create_quips.rb`。当你迁移到特定版本时，Rails\
  \ 会检查架构（schema）当前版本。\n\n如果你请求一个较新（编号更高）的版本，Rails 将调用相应的 `up( )` 方法。如果你请求一个较旧（编号更低）的版本，Rails\
  \ 将向后回溯并调用 `down( )` 方法。\n\n# 使用迁移管理架构版本\n\n## Java 中的架构版本控制\n对于许多 Java 来说，数据架构的维护往往被忽视。根据我们的经验，很少发现数据架构是由版本控制系统管理的，更不用说以易于跟踪架构版本的方式进行管理了。某些库为此提供了解决方案；例如，`Hibernate`\
  \ 和 `Kodo` 提供了从元数据生成架构（或反之）的工具，这导致了一种自动化策略，用于跟踪数据库随时间推移发生的变化。\n\n使用 `Hibernate`，如果你对业务对象进行了更改并想管理架构更新，你可以在\
  \ `.hbm.xml` 文件中指定新属性，然后运行 `Hibernate` 提供的 `SchemaUpdate` 工具。它会尝试获取当前架构并将其与最新 `.hbm`\
  \ 文件中的值进行比较。任何当前 `JDBC` 驱动程序可以处理的差异将被写入数据库。这很方便，但有两个主要缺点：第一，如果驱动程序无法处理更改，则更改不会生效；其次，没有自动化方法可以撤该过程。同样，`Kodo`\
  \ 提供了 `Mapping Tool` 来确保数据架构与当前对象模型保持同步，但它没有提供独立管理架构的自动化策略，而只关注单向转换。\n\n由于 `CreateQuips`\
  \ 是我们的第一次迁移，我们能回退的数字只有 0，或者回到起点：\n\n```\n$ rake migrate VERSION=0\n(in /Users/stuart/FR_RAILS4JAVA/Book/code/rails_xt)\n\
  == CreateQuips: reverting ============================\n-- drop_table(:quips)\n\
  -> 0.2387s\n== CreateQuips: reverted (0.2401s) ===================\n```\n\nRails\
  \ 在数据库中通过一个额外的表来跟踪迁移版本。如果你查看 Rails 应用，你会看到一个名为 `schema_info` 的表。该表有一列，称为 `version`，以及一行，其中包含架构的当前版本号。\n\
  \n像我们在这里做的，在单次迁移中向前或向后滚动并不值得麻烦。迁移变得强大的地方在于你随时间推移进行了一系列数据库修改的情况。例如，假设你需要更改一个已经在生产环境中运行的应用架构。你可以在开发和测试环境中构建并测试迁移，一旦你确认一切运行正常，就可以在生产环境中运行它们。如果你犯了错，可以始终运行向下迁移（down\
  \ migration），将架构恢复到上一次已良好的状态。\n\n由于这些迁移是用 Ruby 编写的而不是 SQL，因此它们依赖数据库适配器来生成适当的 SQL\
  \ 语句来实现所需的修改。只要你坚持使用纯 Ruby API，你在 `MySQL` 上运行此迁移就像在 `Oracle` 上运行一样简单。迁移中实现此点的有趣功能之一是主键字段的自动生成。请注意，在创建\
  \ `quips` 表时，我们从未指定 `id` 列。对于 `users` 和 `roles` 表，`ActiveRecord` 会自动名为 `id` 的列，并使用当前数据库的默认方法来管理该列的值。\n\
  \n迁移可以在 Rails 之外使用。事实上，这种架构版本的迁移方法非常有用，以至于我们在所有的 Java 项目中也使用它。如果你像我们一样生活多语言环境中，迁移可以提供一种很好的方法，通过支持现有的\
  \ Java 项目来练习 Ruby。\n\n我们以敏捷的方式构建了示例应用程序，根据需要增量扩展架构。查看 `db/migrate` 中的迁移，感受一下迁移能提供的功能。\n\
  \n### 4.3 将数据映射到类\n在 `Hibernate`、`JDO`、`EJB` 以及其他 Java 持久化库中，映射一直是在独立的 XML 或属性文件中完成的。对于\
  \ `Hibernate`，有 `hibernate-configuration.xml` 以及大量的 `.hbm.xml` 文件。对于 `Kodo`，有 `persistence.xml`\
  \ 文件。对于 `EJBs`，有所有的描述符文件。最近随着 Java 5.0 注解、`Jakarta Commons Annotations` 项目以及 `Spring`\
  \ 元数据支持的发布，内联配置变得越来越普遍。\n\n`ActiveRecord` 依赖于“约定优于配置”。在可能的情况下，`ActiveRecord` 会通过反射数据架构来猜测正确的配置。当你确实需要特定的覆盖时，直接在你的模型类中指定覆盖。\n\
  \n### 约定\n给定一个架构，这里是创建 `Hibernate` 模型类的过程。首先，创建一个具有合理命名字段的普通 Java 对象（POJO）：\n\n\
  ```java\nprivate long id;\nprivate String firstName;\nprivate String lastName;\n\
  ```\n\n为这些字段创建 JavaBean 访问器（accessor）：\n\n```java\npublic String getFirstName()\
  \ {\n    return firstName;\n}\n\npublic void setFirstName(String firstName) {\n\
  \    this.firstName = firstName;\n}\n```\n\n然后创建一个映射，告诉 Hibernate 如何将列与对象属性关联：\n\
  \n```xml\n<?xml version=\"1.0\" ?>\n<!DOCTYPE hibernate-mapping PUBLIC \"-//Hibernate/Hibernate\
  \ MappingTD 3.0//EN\"\n\"http://hibernate.sourceforge.net/hibernate-mapping-3.0.dtd\"\
  \ >\n<hibernate-mapping>\n<class name=\"Person\" table=\"people\" >\n    <id name=\"\
  id\" type=\"java.Long\" >\n        <generator class=\"native\" />\n    </id>\n \
  \   <version name=\"version\" column='lock_version'/>\n    <property name=\"firstName\"\
  \ type=\"string\" column=\"first_name\" />\n    <property name=\"lastName\" type=\"\
  string\" column=\"last_name\" />\n    <property name=\"middleName\" type=\"string\"\
  \ column=\"middle_name\" />\n    <property name=\"bio\" type=\"string\" column=\"\
  bio\" />\n    <property name=\"url\" type=\"string\" column=\"url\" />\n    <set\
  \ name=\"quips\" inverse=\"true\" cascade=\"all\" >\n        <key column=\"author_id\"\
  \ />\n        <one-to-many class=\"Quip\" />\n    </set>\n</class>\n</hibernate-mapping>\n\
  ```\n\n`ActiveRecord` 的方法只需要一行 Ruby 代码，不需要 YAML 或 XML。只需创建一个具有正确名称的类：\n\n```ruby\n\
  class Person < ActiveRecord::Base; end\n```\n\n就如此。`ActiveRecord` 扫描数据库元数据，寻找名为\
  \ people（类名 Person 的复数）的表。然后它会自动生成所有必要的构造函数、字段、访问器方法甚至是查找方法。\n\n### 覆盖默认值\n约定优于配置在猜测一切正确时看起来非常棒。真正的测试是你需要进行一些自定义时。假设你的类名和表名不符合\
  \ Rails 约定。对于你的 people 表，你想要有一个 Peeps 类。没问题：\n\n```ruby\n$ script/console\n>> class\
  \ Peeps < ActiveRecord::Base\n>> set_table_name :people\n>> ended\n```\n\n`set_table_name(\
  \ )` 类方法覆盖了 Rails 的常规命名规则。其他约定也有自己的覆盖方法，因此你永远不会困在“Rails 方式”中。注意，这种配置是类定义内部的 Ruby\
  \ 代码。这与大多数 Java 有显著不同。\n\n\n\n配置，通常是存储在单独文件中的 XML。\n\n我们在脚本/控制台会话中执行了之前的 Peeps 示例。\n\
  \n我们通常不会在这样的交互式会话中编写模型代码，但它很好地演示了 Rails 在响应你的意图时是多么简单和动态。只需之前的三个行代码，你现在就拥有了对 people\
  \ 表的完整访问权限：\n\n```\n>> Peeps.create :first_name=>'Dave', :last_name=>'Thomas'\n\
  => #<Peeps:0x2459e0c ...>\n\n>> Peeps.count\n=> 3\n\n>> Peeps.find(:all, :order=>'first_name\
  \ asc').map(&:first_name)\n=> [\"Dave\", \"Justin\", \"Stuart\"]\n```\n\n我们将在下一节中查看这些以及\
  \ CRUD（创建、读取、更新和删除）方法是如何工作的。\n\n# 创建、读取、更新和删除：访问模式\n\n### 4.4 创建、读取、更新和删除：访问模式\n\
  \n一旦你有了数据库架构和一些对象映射，就可以访问数据了。由于 `ActiveRecord` 是一个对象/关系映射（O/RM）框架，你通常通过面向对象的 API\
  \ 访问数据。\n\n然而，正如任何 O/RM 框架一样，这些方法并不总是适用于当前任务。在必要时，你可以跳过面向对象的外壳，直接利用 SQL 语句来对数据库执行你需要的操作。\n\
  \n### 加载数据\n\n在 `Hibernate` 中，加载数据的唯一机制是通过 `Session` 对象。要从数据库中加载单个对象，你使用 `session.load`；要加载对象集合，你使用\
  \ `session.find` 或 `session.criteria_query`。让我们看看最简单的形式，即通过 ID 加载单个对象：\n\n[下载代码/hibernate_examples/src/AccessPatterns.java](http://media.pragprog.com/titles/fr_r4j/code/code/hibernate_examples/src/AccessPatterns.java)\n\
  \n```\nQuip quip = null;\nSession sess = null;\n\ntry {\n  sess = factory.openSession();\n\
  \  quip = (Quip)sess.get(Quip.class, new Long(1));\n} finally {\n  sess.close();\n\
  }\n```\n\n`Hibernate` 希望确保你的持久化类是 POJO。因此，持久化对象对 `Hibernate` 一无所知。实际的持久化 API 是通过\
  \ Hibernate 对象 `Session` 提供的。\n\n持久化方法是在 `Session` 上调用的，并传入请求的持久化类型。这段代码还演示了使用 `Hibernate`\
  \ 的黄金模板：始终使用 `finally` 块尽早关闭会。\n\n2. 纯主义者可能会说“几乎没有”，因为这些类知道它们在数据库中的 ID。\n3. 不要将“关闭会”变成一种用于复制/粘贴用的模式。相反，请使用像\
  \ Spring 的 `HibernateTemplate` 之类的。\n\n`ActiveRecord` 更具侵入性，要求持久化类型继承一个公共祖类：`ActiveRecord::Base`。作为回报，模型直接提供持久化，不需要任何类似\
  \ `Session` 的东西。这里是 ActiveRecord 版本：\n\n[下载代码/rails_xt/samples/activerecord/access_patterns.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/activerecord/access_patterns.rb)\n\
  \n```\nq = Quip.find(1)\n```\n\n持久化行为是持久化类本身的一部分，而不是第三个实体。因此，你直接在 `Quip` 上调用 `find()`。连接管理完全是隐式的，因此你不需要关闭连接。这是\
  \ `Hibernate` 加载所有 Quips 的一种方法。\n\n既然我们已经提到了需要关闭会，我们就不不会在文中继续显示那些代码。\n\n[下载代码/hibernate_examples/src/AccessPatterns.java](http://media.pragprog.com/titles/fr_r4j/code/code/hibernate_examples/src/AccessPatterns.java)\n\
  \n```\nquips = sess.createCriteria(Quip.class).list();\n```\n\n这里是 `ActiveRecord`\
  \ 的实现：\n\n[下载代码/rails_xt/samples/activerecord/access_patterns.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/activerecord/access_patterns.rb)\n\
  \n```\nquips = Quip.find(:all)\n```\n\n再次，`Hibernate` 是非侵入性的，将查找方法放在 `Session` 上，而\
  \ `ActiveRecord` 直接使用 `Quip`。这里还有另一个区别。`Hibernate` 的会有许多不同的方法，而 `ActiveRecord` 倾向于使用一组带有各种可选参数的少量方法，例如之前的\
  \ `:all`。这种差异直接源于类型系统的不同。`Java` API 需要不同的方法来处理不同的返回类型。\n\n接下来，让我们应用一些条件来限制查询结果。`Hibernate`\
  \ 暴露了一个面向对象的 `Criteria` API 来访问各种条件。例如，让我们加载一些 `Persons`，但只加载名字为 Justin 的那些。当然，还要按姓排序：\n\
  \n[下载代码/hibernate_examples/src/AccessPatterns.java](http://media.pragprog.com/titles/fr_r4j/code/code/hibernate_examples/src/AccessPatterns.java)\n\
  \n```\npeople = sess.createCriteria(Person.class)\n  .add(Expression.eq(\"firstName\"\
  , \"Justin\"))\n  .addOrder(Order.asc(\"lastName\"))\n  .list();\n```\n\n与其链式调用，`ActiveRecord`\
  \ 应用了允许 hash 标准技术：\n\n[下载代码/rails_xt/samples/activerecord/access_patterns.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/activerecord/access_patterns.rb)\n\
  \n```\np = Quip.find(:all, :conditions => \"first_name = 'Justin'\", :order => \"\
  last_name\")\n```\n\n# 创建、读取、更新和删除：访问模式\n\n之前的代码示例假设你使用硬编码条件进行查询（“Justin”是一个字面量且不可更改）。如果你需要根据用户输入查询，之前的方法是不安全的，因为存在注入攻击。避免\
  \ SQL 注入的最简单方法是使用参数化查询，而不是通过字符串拼接 SQL 语句。假设 `name` 是来自用户的安全的变量，你可以：\n\n[下载代码/hibernate_examples/src/AccessPatterns.java](http://media.pragprog.com/titles/fr_r4j/code/code/hibernate_examples/src/AccessPatterns.java)\n\
  \n```\nCriterion c = Restrictions.sqlRestriction(\"{alias}.first_name = ?\", name,\
  \ Hibernate.STRING);\np = sess.createCriteria(Person).add(c).list();\n```\n\n在 `ActiveRecord`\
  \ 中，正如你所期的，这是通过 `find( )` 的可选参数实现的：\n\n[下载代码/rails_xt/samples/activerecord/access_patterns.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/activerecord/access_patterns.rb)\n\
  \n```\np = Quip.find(:all, :conditions => [\"first_name = :fname\", {:fname=>name}])\n\
  ```\n\n`:conditions` 选项被设置为值的数组。数组中的第一个值是参数化的 SQL 片段；数组其余部分是包含设置参数的键值对的 Ruby hash。我们不详细介绍许多其他选项。例如，你可以指定\
  \ `:first` 而不是 `:all` 来只返回第一个结果。如果你可以将一个索引数组作为第一个参数，`ActiveRecord` 将查找主键在该列表中所有的类实例。\n\
  \n`ActiveRecord` 还允许你通过属性搜索记录。例如，你可以说：\n\n[下载代码/rails_xt/samples/activerecord/access_patterns.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/activerecord/access_patterns.rb)\n\
  \n```\np = Person.find_by_first_name('Justin' )\nps = Person.find_all_by_first_name('Justin'\
  \ )\n```\n\n`ActiveRecord` 在自动创建查询的同时，仍然正确地转义条件的值。这些查找方法对于对象上的所有属性以及所有属性的所有组合都可用。它们也接受与常规\
  \ `find` 方法相同的所有选项。所以你也可以说：\n\n\n\n\n\n[下载 code/rails_xt/samples/activerecord/access_patterns.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/activerecord/access_patterns.rb)\n\
  \n```ruby\np = Person.find_by_first_name_and_last_name('Justin' , 'Gehtland' )\n\
  \np = Person.find_by_first_name('Justin' , :order=>'last_name ASC' )\n```\n\n##\
  \ 持久化数据\n\n将更改保存到数据库意味着许多复杂性，其中许多将在本章的稍后部分进行介绍。例如，你如何将更改封装在事务中（参见第 4.8 节 事务、并发与性能，第\
  \ 125) 页）？验证规则在何时应用？（参见第 4.5 节 验证数据值，第 113) 页）？更改是如何跨关系进行级联的？（参见第 4.7 节 传递持久化，第\
  \ 121) 页）？现在，我们将关注向数据库行通信简单更改的简单任务。\n\n## 插入新记录\n\n在 Hibernate 中，创建新记录的路径非常直接。只需创建目标类的实例即可。由于\
  \ Hibernate 与 POJO 一 一工作，因此你如何创建对象并不重要。你可以调用构造函数、调用工厂，或从其他框架获取对象。重要的任务是最终将对象与会话关联，例如通过调用\
  \ `save()`：\n\n[下载 code/hibernate_examples/src/AccessPatterns.java](http://media.pragprog.com/titles/fr_r4j/code/code/hibernate_examples/src/AccessPatterns.java)\n\
  \n```java\nPerson p = new Person();\n\np.setFirstName(\"Dave\" );\n\np.setLastName(\"\
  Thomas\" );\n\nsess = factory.openSession();\n\nsess.save(p);\n\nsess.flush();\n\
  ```\n\nActiveRecord 允许类似的方法，但你直接在模型对象上调用 `save()`：\n\n[下载 code/rails_xt/samples/activerecord/access_patterns.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/activerecord/access_patterns.rb)\n\
  \n```ruby\np = Person.new\n\np.first_name = 'Dave'\n\np.last_name = 'Thomas'\n\n\
  p.save\n```\n\n`save()` 方法配置为在记录无法保存时返回 `false`。如果你更喜欢在失败时抛出异常，请使用 `save!` 方法。（我们将在第\
  \ 4.5 节 验证数据值，第 113. 页 中查看有关失败的更具体信息）。\n\n## 那些查找器（Finders）是从哪里来的？\n\n一旦考虑到所有组合，ActiveRecord\
  \ 查找器似乎拥有近乎无限数量的方法：\n`Person.find_by_first_name`\n`Person.find_by_last_name`\n`Person.find_by_middle_name`\n\
  `Person.find_by_first_name_and_middle_name`\n`Person.find_by_first_name_and_last_name`\n\
  # 等等\n\n技巧在于 `method_missing()`。如果一个 Ruby 类实现了 `method_missing()`，那么对于任何不匹配特定方法的方法名，都会被调用。例如，这段代码：\n\
  \n[下载 code/rails_xt/samples/activerecord/do_anything.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/activerecord/do_anything.rb)\n\
  \n```ruby\nclass DoAnything\n  def method_missing(name, *args)\n    puts \"I can\
  \ do anything, even #{name}\"\n  end\nend\n\nd = DoAnything.new\nd.jump\nd.dance\n\
  d.find_by_first_name_and_last_name\n```\n\n将输出以下内容：\n```\nI can do anything, even\
  \ jump\nI can do anything, even dance\nI can do anything, even find_by_first_name_and_last_name\n\
  ```\n\n`method_missing` 的方法类似于在 Java 中编写 `InvocationHandler` 并使用该处理程序创建动态代理。与 `InvocationHandlers`\
  \ 一样，`method_missing` 应该谨慎使用。过度依赖 `method_missing()` 的程序很容易让开发者和开发工具都困惑。\n\n## 为什么\
  \ ActiveRecord 不需要重新附加到会话？\n\n你无法“重新附加到会话”，因为……嗯，没有会话。为什么 Hibernate 不能同样简单呢？Hibernate\
  \ 的 `session` 不仅仅是数据库的连接；它还是一个缓存作用域。Hibernate `session` 的复杂性为你换来了一些：缓存的功能，包括我们提到的更新写后处理（write-behind）。这是一个纯粹的权衡：你是想要简单性，还是想要缓存？\n\
  \nHibernate 使用写后处理进行插入。与其立即写入数据库，Hibernate 会累积更新并在可能时执行它们。ActiveRecord 不提供这种级别的抽象。ActiveRecord\
  \ 总是立即执行操作。ActiveRecord 总是接受属性：[下载 code/rails_xt/samples/activerecord/access_patterns.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/activerecord/access_patterns.rb)\n\
  \n```ruby\n# p 是某处的 person\n@person.update_attributes(params[:person])\np.save\n\
  ```\n\n如果这看起来像代码太多，你可以通过调用 `create!` 在一步内完成 `new()` 和 `save()`：ActiveRecord 总是立即执行。\n\
  \n```ruby\n@person.update_attributes(params[:person])\n```\n\n你甚至可以在一步内结合 `find()`\
  \ 和 `create()`。以以下方法：[下载 code/rails_xt/samples/activerecord/access_patterns.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/activerecord/access_patterns.rb)\n\
  \n```ruby\nPerson.find_by_first_name_and_last_name('Dave', 'Thomas')\n```\n\n##\
  \ 更新现有记录\n\n最常见的模式（Hibernate 风格）是简单的：从数据库检索记录，从会话分离，允许用户进行修改，然后持久化修改：\n\n[下载 code/hibernate_examples/src/AccessPatterns.java](http://media.pragprog.com/titles/fr_r4j/code/code/hibernate_examples/src/AccessPatterns.java)\n\
  \n```java\n//p 是从会话分离的 Person\nsess = factory.openSession();\nsess.saveUpdate(p);\n\
  p.setMiddleName(\"Brian\");\nsess.flush();\n```\n\n这里稍微困难的部分是记住附加会话。许多方法都可以这样做；`saveOrUpdate()`\
  \ 最容易使用，因为你不需要知道是否存在于数据库中。ActiveRecord 重用 `save()` 方法进行简单的更新。就像 Hibernate 的 `saveOrUpdate()`\
  \ 一样，ActiveRecord 的 `save()` 会“正确处理”，根据对象是否存在于数据库来选择插入或更新：\n\n[下载 code/rails_xt/samples/activerecord/access_patterns.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/activerecord/access_patterns.rb)\n\
  \n```ruby\n# p 是某处的 person\np.middle_name = 'Brian'\np.save!\n```\n\nActiveRecord\
  \ 提供了一个快捷方法来更新特定的记录，而此时你不需要持有该实例。与其加载实体、更新其值然后保存它，你可以调用 `update()`，它接收一个 ID 和一个要保存的属性哈希：\n\
  \n```ruby\nPerson.update(2, :middle_name=>'Brain')\n```\n\n的方法的方法调用 `update_attributes()`。给定一个实例，该方法将设置多个属性并将更改提交到数据库。这在\
  \ Rails 控制器方法中非常方便：\n\n[下载 code/rails_xt/app/controllers/people_controller.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/controllers/people_controller.rb)\n\
  \n```ruby\n@person = Person.find(params[:id])\n\nif @person.update_attributes(params[:person])\n\
  ```\n\n\n\n\n# 更新成功...\n\n在这里，你可以看到端到端命名规范带来的简单性。在单行代码中，参数从 Web 表单中提取出来，赋值给对象，并提交到数据库。4.\n\
  \n直接将表单参数转换为模型属性会引发安全问题。我们将在第 10.4, 节 #1 未经验证的输入中展示 Rails 如何解决这个问题，详见第 293. 页。\n\
  \n## 验证数据值 113\n\n### 删除记录\n\nHibernate 提供了一个简单的单一机制来删除对象。调用 `session.delete()`\
  \ 并传入你想要删除的持久化对象：\n\n[下载 code/hibernate_examples/src/AccessPatterns.java](http://media.pragprog.com/titles/fr_r4j/code/code/hibernate_examples/src/AccessPatterns.java)\n\
  \n```java\nsess = factory.openSession();\nPerson p = (Person) sess.get(Person.class,\
  \ new Long(2));\nsess.delete(p);\nsess.flush();\n```\n\n Hibernate 在执行 session flush\
  \ 时，会发出 `delete` 语句以从数据库中移除该记录。在不发布自定义查询的情况下，这就是 Hibernate 中删除记录的所有可用选项。\n\n另一方面，ActiveRecord\
  \ 提供了许多删除记录的不同策略。显而易见的方法是在你想删除的实例上调用 `destroy()`。会导致 ActiveRecord 立即发出移除记录所需的 `delete`\
  \ 语句：\n\n[下载 code/rails_xt/samples/activerecord/access_patterns.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/activerecord/access_patterns.rb)\n\
  \n```ruby\np = Person.find(2)\np.destroy\n```\n\n这消除了底层的记录，但如果你需要引用原始值，内存中的实例 `p`\
  \ 仍然存在。该内存实例被冻结（frozen）了，因此你不会无意将其误认为活跃对象（live object）。关于 Ruby 冻结的描述，请参见第 3.2, 节\
  \ 可变与不可变对象，位于第 74 页。\n\n还有一个平行的类级 `destroy()` 方法，接受 ID 或 ID 数组作为参数。对于传递的每个 ID，`destroy()`\
  \ 会先加载给对象，然后调用它的 `destroy()` 方法。这似乎多此一举，但它为生命周期回调提供了运行的机会。例如，你可能有一个过滤器，由于某些安全约束阻止删除。（请参见第\
  \ 4.6, 节 生命周期周期回调，位于第 116. 页）。\n\n### 4.5 验证数据值\n\n声明式验证是对象模型的一个强大补充功能。你不需要编写代码，只需声明约束，然后这些约束可以在对象生命周期的各个点被强制执行。例如，这里是使用\
  \ Hibernate Validator 声明的一些模型约束：\n\n## 验证数据值 114\n\n[下载 code/hibernate_examples/src/User.java](http://media.pragprog.com/titles/fr_r4j/code/code/hibernate_examples/src/User.java)\n\
  \n```java\n@NotNull\n@Length(min=3,max=40)\npublic String getLogin() {\n    return\
  \ login;\n}\n```\n\n即使你从未用过 Java 5 注解，这些验证规则的作用也显而易见。`login` 属性不能为空，且长度必须在 3 到 40\
  \ 个字符之间。\n\n以下是 ActiveRecord 中类似的验证：\n\n[下载 code/rails_xt/app/models/user.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/models/user.rb)\n\
  \n```ruby\nvalidates_presence_of :login, :email\nvalidates_length_of :login, :within\
  \ => 3..40\n```\n\n同样，`login` 不能为 nil，且长度必须在 3 到 40 个字符之间。\n\nHibernate 验证声明在它们引用的属性之前之前。ActiveRecord\
  \ 验证显式地命名它们引用的属性，因此之前的代码可以在同一行中约束 `login` 和 `email`。ActiveRecord 验证可以在模型类的任何地方声明，但通常声明在顶部。\n\
  \n一旦你声明了一些验证，就可以显式地验证一个对象。在 Hibernate 中，`ClassValidator.getInvalidValues()` 将返回一个对象上所有无效值的数组：\n\
  \n[下载 code/hibernate_examples/src/Validations.java](http://media.pragprog.com/titles/fr_r4j/code/code/hibernate_examples/src/Validations.java)\n\
  \n```java\nUser u = new User();\nClassValidator v = new ClassValidator(User.class);\n\
  InvalidValue[] errors = v.getInvalidValues(u);\n```\n\n在 ActiveRecord 中，如 `errors`\
  \ 等验证方法是在模型对象本身上调用的：\n\n```bash\n$ script/console\nLoading development environment.\n\
  >> u = User.new\n>> u.valid?\n=> false\n>> u.errors[:login]\n=> [\"is too short\
  \ (minimum is 3 characters)\", \"can't be blank\"]\n```\n\n调用 `valid()` 会填充 `errors`\
  \ 哈希。键是属性名。\n\n## 验证数据值 115\n\n### 哪一层进行验证？\n\n当用 Java 编写 Web 应用时，你可以通过两种方式之一处理验证：\n\
  - 你可以在客户端验证表单输入。\n- 你可以验证持久化属性。\n\n表单验证示例包括 Spring Validator。在持久化层，你可能会使用 Hibernate。遗憾的是，这些层是不连接的。如果你需要在两个层中执行类似的操作，你必须显式地调用验证器。例如，Hibernate\
  \ 的 Validator 可以自动应用于对象级别，但在 Web 层手动应用。（这可以通过 AOP 改进）。\n\nRails 作为一个统一的开发栈，为你提供了一个单一的地方来表达验证规则。这些规则描述在你的模型类中，在持久化时应用，并一直报告到\
  \ Web 视图。\n\n除了显式验证外，O/RM 框架在保存记录之前应该进行隐式验证。在 Hibernate 中，尝试保存无效对象会抛出异常：\n\n```java\n\
  assertThrows(PropertyValueException.class, new Callable() {\n    public Object call()\
  \ throws Exception {\n        User u = new User();\n        return sess.save(u);\n\
  \    }\n});\n```\n\n在 ActiveRecord 中，`save()` 对于无效对象将返回 false，而 `save!` 将抛出异常：\n\
  \n```ruby\n>> u.save\n=> false\n>> u.save!\nActiveRecord::RecordInvalid: Validation\
  \ failed: ...\n```\n\n在本文编写时，ActiveRecord 验证有一个重大局限性。错误消息用英语报告，且 Rails 没有国际化设施。采用\
  \ Rails 的团队要么引入第三方国际化库，要么接受自行实现的成本。参见 [`wiki.rubyonrails.org/rails/pages/Internationalization`](http://wiki.rubyonrails.org/rails/pages/Internationalization)\
  \ 获取入门建议。\n\n## 4.6 生命周期回调 116\n\n###\n\n在大多数情况下，模型类像其他类一样使用。特别是，模型实例不需要时刻感知 O/RM\
  \ 层。然而，在某些情况下，对象可能确实想知道 O/RM 层正在做什么。例如，Rails XT 应用的 `User` 类需要对其密码属性进行特别 care。\n\
  \n\n\n\n\nevents. Hibernate 提供了几种不同的生命周期技术。例如，Hibernate 的事件系统可以钩入 Hibernate 的任何\
  \ session 方法。以下是如何使用事件来管理 User 的密码和哈希值：\n\n[下载 code/hibernate_examples/src/UserEventListener.java](http://media.pragprog.com/titles/fr_r4j/code/code/hibernate_examples/src/UserEventListener.java)\n\
  \n第 1 行\n\n```java\npublic class UserEventListener extends DefaultSaveOrUpdateEventListener\
  \ {\n\n    public void onSaveOrUpdate(SaveOrUpdateEvent event)\n    throws HibernateException\
  \ {\n        Object o = event.getObject();\n        if (o instanceof User) {\n \
  \           try {\n                ((User) o).hashPassword();\n            } catch\
  \ (NoSuchAlgorithmException e) {\n                throw new HibernateException(e);\n\
  \            }\n        }\n        super.onSaveOrUpdate(event);\n    }\n}\n```\n\
  \n### 生命周期回调（Lifecycle Callbacks）\n\n与 Hibernate 的哲学一致，生命周期回调不在 `User` 模型本身。相反，`SaveOrUpdateEventListener`\
  \ 接口充当 session 上所有保存或加载事件的钩子。（其他 session 方法也存在同名的接口）。由于钩子会看到所有模型类型的加载和保存事件，因此我们使用\
  \ `if` 语句来将范围缩小到 `Users`（第 5 行）。事件监听器的实际业务仅仅是要求模型对象对其密码进行哈希处理（第 7 行），其余代码是样板代码。Hibernate\
  \ 事件监听器必须注册。虽然有 API 可以实现，但更常见的是使用 XML 配置文件。例如：\n\n[下载 code/hibernate_examples/config/hibernate.cfg.xml](http://media.pragprog.com/titles/fr_r4j/code/code/hibernate_examples/config/hibernate.cfg.xml)\n\
  \n```xml\n<event type=\"save-update\" >\n    <listener class=\"UserEventListener\"\
  \ />\n</event>\n```\n\n在 ActiveRecord 中，生命周期方法通常直接添加到模型类本身：\n\n[下载 code/rails_xt/app/models/user.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/models/user.rb)\n\
  \n```ruby\nbefore_save :encrypt_password\n```\n\n`before_save` 方法直接在 `User` 类上调用，并接收一个在保存之前要调用的方法名。（持久化生命周期中所有其他有趣的方法也存在同名方法）。事实上，`before_save`\
  \ 还有其他形式。你也可以传递一个块（block）：\n\n```ruby\nbefore_save do\n  #在这里加密\nend\n```\n\n与其调用类方法\
  \ `before_save`，你你可以实现一个同样命名为 `before_save` 的实例方法：\n\n```ruby\ndef before_save\n\
  \  #在这里加密\nend\n```\n\n使用上述任何技术，保存用户都将自动对密码进行哈希。你可以轻松地在脚本/控制台中验证这一点：\n\n```ruby\n\
  >> u = User.new\n>> u.login = 'Tom'\n>> u.password = u.password_confirmation = 'wombat'\n\
  >> u.email = 'contact@relevancellc.com'\n>> u.crypted_password\n=> nil\n>> u.save\n\
  >> u.password\n=> nil\n>> u.crypted_password\n=> \"81f8a1a1c0f9b92d74c5f65c8d0d5164772fc60a\"\
  \n```\n\nActiveRecord 还允许你解耦生命周期方法，将生命周期方法移动到与模型类类类中。我们认为这对于 `User` 类没有必要，因此我们没有在\
  \ Rails XT 应用中进行此更改。\n\n但是，在脚本/控制台中临时更改并观察外部生命周期方法如何运作是简单的。只需任选一个类并让它定义 `before_save()`。由于我们在模型类之外，该方法将接收一个模型参数：\n\
  \n```ruby\n>> class SomeLifecycleCallback\n>> def before_save(model)\n>> puts \"\
  about to save instance of #{model.class}\"\n>> end\n>> end\n```\n\n现在，我们可以通过 `before_save()`\
  \ 的另一种变体将 `SomeLifecycleCallback` 与 `User` 关联：\n\n```ruby\n>> class User; before_save\
  \ SomeLifecycleCallback.new; end\n```\n\n要验证 `SomeLifecycleCallback` 被调用，只需保存一个（有效的！）`User`：\n\
  \n```ruby\n>> u = User.find(:first)\n>> u.save\nabout to save instance of User\n\
  ```\n\n如果你想为所有模型注册回调，更类似于 Hibernate 的事件系统？简单。只需将 `SomeLifecycleCallback` 添加到 `ActiveRecord::Base`\
  \ 中：\n\n```ruby\n>> class ActiveRecord::Base; before_save SomeLifecycleCallback.new;\
  \ end\n```\n\n现在，各种模型对象都获得了 `SomeLifecycleCallback`：\n\n```ruby\n>> p = Person.find(:first)\n\
  >> q = Quip.find(:first)\n>> p.save\nabout to save instance of Person\n>> q.save\n\
  about to save instance of Quip\n```\n\nActiveRecord 的生命周期回调非常好用。它们仅仅是 Ruby 代码，不需要单独的配置。生命周期回调天生就是松类型类型和松耦合的。因此，生命周期回调在\
  \ Ruby 这样的动态语言中感觉非常自然。\n\n### 4.7 关联与继承\n\n到本章为止，我们建立了一个简单的关联：一个表中的某行意味着一个类的一个实例。简单的系统更为复杂。在数据库侧，表通过外键链接。在对象侧，类通过继承关联。任何\
  \ ORM 框架的主要任务是让关系变得可访问，即使术语不同。\n\n#### 一对多关系（One-to-Many Relationships）\n\n在一对多关系中，一个表中的单行与另一个表中的任意数量行关联。第二个表有一个指向第一个表主键的外键。为了在\
  \ Hibernate 对象层面暴露这种关系，我们首先创建关联 Quips 的 JavaBeans：\n\n```java\nprivate Person author;\n\
  public Person getAuthor() {\n    return author;\n}\npublic void setAuthor(Person\
  \ author) {\n    this.author = author;\n}\n```\n\n反方向，这里是 Persons 到 Quips：\n\n```java\n\
  private Set quips;\npublic Set getQuips() {\n    return quips;\n}\npublic void setQuips(Set\
  \ quips) {\n    this.quips = quips;\n}\n```\n\n接下来，我们告诉 Hibernate 这些关系。在“一”的一侧，我们在\
  \ `person.hbm.xml` 中添加了行：\n\n[下载 code/hibernate_examples/config/person.hbm.xml](http://media.pragprog.com/titles/fr_r4j/code/code/hibernate_examples/config/person.hbm.xml)\n\
  \n```xml\n<set name=\"quips\" inverse=\"true\" cascade=\"all\" >\n    <key column=\"\
  author_id\" />\n    <one-to-many class=\"Quip\" />\n</set>\n```\n\n对于“多”的一侧，我们更新了\
  \ `quip.hbm.xml`：\n\n[下载 code/hibernate_examples/config/quip.hbm.xml](http://media.pragprog.com/titles/fr_r4j/code/code/hibernate_examples/config/quip.hbm.xml)\n\
  \n```xml\n<many-to-one name=\"author\" column=\"author_id\" class=\"Person\" />\n\
  ```\n\n在 ActiveRecord 中，Quips 与 People 之间的关系直接在模型源码中声明。Person 有许多 Quips：\n\n[下载\
  \ code/rails_xt/app/models/person.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/models/person.rb)\n\
  \n```ruby\nhas_many :quips, :foreign_key=>'author_id'\n```\n\nActiveRecord 代码读起来几乎就像文档。`foreign_key`\
  \ 指定了用于连接的外键是 `author_id`。根据 Rails 对约定优于偏好，`foreign_key` 有一个合理的默认值：表的单数名称加上 `_id`。如果我们将数据库列命名为\
  \ `person_id` 而不是 `author_id`，就可以省略 `foreign_key` 选项。\n\n\n\n\n在运行时，我们可以执行如下内容：\n\
  \n[下载 code/rails_xt/sample_output/has_many.irb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/sample_output/has_many.irb)\n\
  \n```\n>> p = Person.create :first_name=>'Justin', :last_name=>'Gehtland'\n=> (...description\
  \ of p...)\n\n>> p.quips\n=> []\n\n>> q = p.quips.create :text=>'Have fun storming\
  \ the castle!'\n=> (...description of q...)\n\n>> p.quips.empty?\n=> false\n\n>>\
  \ p.quips\n=> [(...description of q...)]\n\n>> p.quips.find(:first)\n=> (...description\
  \ of q...)\n```\n\n我们没有为 `quips`、`create`、`empty?` 或 `find` 方法编写任何代码。这些便利方法以及其他几个方法都是由\
  \ `has_many` 自动创建的。\n\n# 关联与继承\n\n在 Quip 端，我们使用 `belongs_to` 在反方向上声明关系：\n\n[下载 code/rails_xt/app/models/quip.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/models/quip.rb)\n\
  \n```\nbelongs_to :author, :class_name=>'Person' , :foreign_key=>'author_id'\n```\n\
  \n同样，`foreign_key` 是必要的，以覆盖默认设置。在这种情况下还需要第二次覆盖。ActiveRecord 会根据 `foreign_key` 推测拥有该实例的类名，这导致了类名\
  \ `Author`。`class_name` 覆盖了这一点并选择了正确的类 `Person`。\n\n就与 `has_many` 一样，ActiveRecord\
  \ 会自动为 `belongs_to` 关联创建一组访问器方法。在上一个例子中，对 `author`、`nil?` 和 `create_author` 方法的调用演示了\
  \ `belongs_to` 为 `Quip` 添加的一些方法。\n\n## 传递持久化 (Transitive Persistence)\n\n以下是用于测试\
  \ `Persons` 和 `Quips` 之间一对多关系的代码。\n\n[下载 code/hibernate_examples/src/Relationships.java](http://media.pragprog.com/titles/fr_r4j/code/code/hibernate_examples/src/Relationships.java)\n\
  \n```java\nsess.beginTransaction();\nPerson person = new Person();\nperson.setFirstName(\"\
  John\" );\nQuip q = new Quip();\nq.setText(\"A stitch in time...\" );\nq.setAuthor(person);\n\
  HashSet hs = new HashSet();\nhs.add(q);\nperson.setQuips(hs);\nsess.save(person);\n\
  sess.getTransaction().commit();\n```\n\n`Person` 和 `Quip` 类的使用非常直观。注意，我们需要在两个方向上设置关联：第\
  \ 6 行的 `setAuthor` 和第 9 行的 `setQuips`。由于对象是 POJOs，在两个方向上建立关系是我们的责任。\n\n调用 `save(person)`\
  \ 了一个有趣的问题。到底应该保存什么？一个死板的 O/RM 只会保存 person，而隐式地忘记关联的 quips。另一种替代方案是传递持久化：当你保存一个对象时，框架会保存所有相关对象。\n\
  \n在 Hibernate 中，两种替代方案都是可能的——但通过代码无法判断是哪一种。在我们的示例项目中，保存 person 也会保存任何 quips，这源于\
  \ `person.hbm.xml` 中的以下配置行：\n\n```xml\n<set name=\"quips\" inverse=\"true\" cascade=\"\
  all\">\n```\n\n`cascade` 属性可以取多种值，以便不同的操作产生不同的级联行为。此外，不同的关系可以设置不同的 `cascade`。对于双向关系，一个方向的\
  \ `cascade` 可以与另一个不同。最后，如果你不想担心级联设置，可以始终显式地调用 `session.save`。\n\nActiveRecord 处理传递持久化的方法更简单但活性较低。每种关系类型都有级联规则，且这些规则是固定的。保存操作将一对多进行级联：\n\
  \n```\n>> p = Person.new :first_name=>'Lewis'\n>> p.add_quips Quip.new(:text=>'Twas\
  \ brillig...')\n>> p.save\n>> p.quips[0].new_record?\n=> false\n```\n\n保存 `Person`\
  \ 自动保存了 `Quip`。但保存操作不会从多对一进行级联：\n\n```\n>> p = Person.new :first_name=>'Mr.'\n>>\
  \ p.add_quips Quip.new(:text=>'I pity the fool...')\n>> p.quips[0].save\n>> p.new_record?\n\
  => true\n```\n\nHibernate 对传递持久化的支持更为优，尽管它的用法可能会令人困惑。\n\n## 一对一、多对多、多态和通过关联 (Through)\n\
  \n### 关联\n\n上一节中关于一对多的讨论代表了 Hibernate 和 ActiveRecord 中处理关联的通用方法。与其纠结于细枝节，我们将进行总结并提供一些实用的观察结果：\n\
  \n- 在 Hibernate 中，关联是在 XML 中描述的，然后在 POJOs 中编写了相应的 getter 和 setter 方法。\n- 在 ActiveRecord\
  \ 中，关联在模型类本身中用 Ruby 代码描述。这就是你需要的所有内容。\n- 使用 Hibernate，你必须做大量的重复性工作。你最终需要在三个地方描述关联：数据模式、模型类和配置。\n\
  - 使用 ActiveRecord，重复工作较少：你只需要创建数据模式和模型类。“配置”就在语言中，而不是 XML。\n\n除了一对多，ActiveRecord\
  \ 还支持其他常见关联：一对一和多对多。ActiveRecord 还支持通过中间表（through）的关联。ActiveRecord 也支持多态关联，其中关联的一侧允许多个具体的实现类。\n\
  \n## 在数据层建模继承\n\n在之前的章节中，我们讨论了关联——即从数据世界传播到对象世界的关系。我们也可以反向操作。继承是对象世界的一个概念，O/RM 框架可以映射到数据世界。\n\
  \n由于继承被用于建模层级，我们将使用你可能在学校学过的层级：天体。在基类 `CelestialBody` 下，可能会有 `Star` 和 `Planet`。这是一个简化的表定义：\n\
  \n[下载 code/rails_xt/db/migrate/005_create_celestial_bodies.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/db/migrate/005_create_celestial_bodies.rb)\n\
  \n```ruby\ncreate_table :celestial_bodies do |t|\n  # 共享属性\n  t.column :name, :string\n\
  \  t.column :type, :string\n  # 恒星属性\n  t.column :magnitude, :decimal\n  t.column\
  \ :classification, :char\n  # 行星属性\n  t.column :gas_giant, :boolean\n  t.column\
  \ :moons, :int\nend\n```\n\n模式只定义了一个表，但我们关联的对象模型有三个类。O/RM 层如何知道创建哪种类型？最简单的解决方案是在模式中添加一个鉴别列（discriminator\
  \ column）。鉴别列简单地告诉 O/RM 为特定的数据行实例化哪个具体类。在 Hibernate 中，你在配置文件声明声明别器：\n\n[下载 code/hibernate_examples/config/celestialbody.hbm.xml](http://media.pragprog.com/titles/fr_r4j/code/code/hibernate_examples/config/celestialbody.hbm.xml)\n\
  \n```xml\n<discriminator column=\"type\" type=\"string\" />\n```\n\n然后，鉴别的某些值与特定的子类及其属性关联：\n\
  \n```xml\n<subclass name=\"Planet\" discriminator-value=\"Planet\" >\n  <property\
  \ name=\"moons\" type=\"integer\" />\n  <property name=\"gasGiant\" column=\"gas_giant\"\
  \ type=\"boolean\" />\n</subclass>\n```\n\n\n\n你可以像定义其他持久化类一样定义 `Planet` 和 `Star`。（你不需要为判别器声明属性。）唯一的新之处在于，针对\
  \ `CelestialBody` 的查询可能会返回多种不同的具体类：\n\n```ruby\n//List 可能包含 Stars 或 Planets\nList\
  \ list = sess.createQuery(\"from CelestialBody\" ).list();\n```\n\n如果存在 `type` 列，`ActiveRecord`\
  \ 将把对象的类名存储在 `type` 列中。当从数据库中检索对象时，`ActiveRecord` 会使用 `type` 来创建正确的类：\n\n```ruby\n\
  >> s = Star.new :name=>'Sol', :classification=>'G'\n>> s.save\n>> o = CelestialBody.find_by_classification\
  \ 'G'\n>> o.name\n=> \"Sol\"\n>> o.class\n=> Star\n```\n\n由于 `ActiveRecord` 采用零配置、零代码的方法，它无法知道哪些列适用于哪些类。因此，你可以为任何子类设置任何属性。你可以给行星设置一个分类：\n\
  \n```ruby\n>> p = Planet.create :name=>'Jupiter', :gas_giant=>true\n>> p.classification\
  \ = 'a very big planet!'\n```\n\n或者，你可以让恒星拥有卫星：\n\n```ruby\n>> s = Star.create :name=>'Antares',\
  \ :classification=>'M', :magnitude=>0.9\n>> s.moons = 250\n```\n\n# 事务、并发与性能\n\n\
  动态语言的支持者认为这种灵活性是一个特性而非缺陷。然而，如果你想保证行星永远不会获得恒星的属性，只需添加一个验证：\n\n[code/rails_xt/app/models/planet.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/models/planet.rb)\n\
  \n```ruby\nclass Planet < CelestialBody\n  validates_each :magnitude, :classification\
  \ do |obj, att, value|\n    obj.errors.add att, 'must be nil' if value\n  end\n\
  end\n```\n\n`validates_each` 方法注册了一个块，该块会对 `classification` 和 `magnitude` 属性各调用一次。现在，行星的行为变得好了一点：\n\
  \n```ruby\n>> p = Planet.create!(:name=>'Saturn', :classification=>'A ringed planet')\
  \ ActiveRecord::RecordInvalid: Validation failed: Classification must be nil\n```\n\
  \n使用一个表来支持多个模型类的技术被称为单表继承，或每个类层次结构的表。Hibernate 的单表继承还支持其他方法，例如每个子类一个表。在每个子类一个表的模式下，继承分布在多个表中，Hibernate\
  \ 负责将这些部分重新连接起来的记录工作。\n\n`ActiveRecord` 不支持每个子类一个表。在实践中，这并不重要。在 Java 中，让 O/RM 为继承提供强大的支持是重要的，因为继承本身就是重要的。\n\
  \n在 Java 中，继承层次结构通常是应用程序设计的中心。另一方面，地道的 Ruby 程序是鸭子类型的，继承层次结构中的“是”（is-a）关系重要性相对较小。事实上，类层次结构通常几乎是完全扁平的。在我们投入生产环境的数百个\
  \ `ActiveRecord` 类中，我们很少感到甚至有单表继承的需求，更不用说任何更奇的技术了。\n\n### 4.8 事务、并发与性能\n\n在许多应用程序中，数据库拥有数据，因此数据库的性能和正确性至关重要。O/RM\
  \ 框架的目标之一是让程序员免受数据库复杂性的影响。事实上，使用良好的 O/RM 设计进行大部分编程可以专注于业务逻辑，将“硬骨头”留给 O/RM。那是大部分编程，而不是全部。程序员仍然需要担心三个（至少！）与数据相关任务：\n\
  \n- 相关的的工作单元必须分组，并作为一个单元成功或失败。否则，部分失败的组合将导致复杂性的爆炸。这个问题通过事务解决。\n- 必须优化“为更新而读取”场景，以平衡并发读取与数据完整性。到目前为止，最好的第一步是乐观锁。\n\
  - 出于性能考虑，对象模型的导航应该每个用户操作对应一次（或更少）数据库操作。要避免的危险是某些表中的每行对应一次数据库操作。这些问题中最常见的是众著名的 N+1\
  \ 问题。\n\n接下来我们将展示 `ActiveRecord` 如何处理事务、乐观锁和 N+1 问题。\n\n### 本地事务\n\nHibernate 包含一个\
  \ `Transaction` API，它映射到底层数据库的事务能力。以下是一个将多个操作分组到单个事务中的示例：\n\n[code/hibernate_examples/src/Validations.java](http://media.pragprog.com/titles/fr_r4j/code/code/hibernate_examples/src/Validations.java)\n\
  \n```java\npublic void saveUsersInTx(User... users) {\n  Session sess = Hibernate.sf.getCurrentSession();\n\
  \  Transaction tx = sess.beginTransaction();\n  try {\n    for (User user: users)\
  \ {\n      sess.save(user);\n    }\n    tx.commit();\n  } catch (HibernateException\
  \ e) {\n    tx.rollback();\n    throw e;\n  }\n}\n```\n\n`saveUsersInTx` 方法遍历用户对象数组，尝试保存每一个。这些用户具有第\
  \ 113 页第 4.5 节“验证数据值”中描述的声明式验证。如果所有用户都是有效的，每次保存将成功，并且 `tx.commit` 将写入数据库。但如果任何用户无效，`Validator`\
  \ 会抛出 `HibernateException`。如果发生这种情况，`tx.rollback` 将撤销任何之前的保存。这里是 ActiveRecord 的版本：\n\
  \n[code/rails_xt/app/models/user.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/models/user.rb)\n\
  \n```ruby\ndef User.save(*users)\n  User.transaction do\n    users.each {|user|\
  \ user.save!}\n  end\nend\n```\n\n任何 `ActiveRecord` 类（如 `User`）都有一个 `transaction`\
  \ 方法，它在底层连接上启动事务。提交和回滚是隐式的。退出块的异常会导致回滚。正常退出块会导致提交。规则简单易懂。\n\n`ActiveRecord` 还支持对象自身的事务语义。当你将参数传递给\
  \ `transaction` 时，这些参数受到事务保护。如果数据库回滚，模型对象上的单个属性也会回滚。这种实现是 Ruby 的巧妙演示，但在实践中该功能很少被使用。\n\
  \n### 所有其他事务\n\nHibernate 的事务支持远超以前描述的本地事务。最重要的是容器管理事务和分布式事务。\n\n在容器管理事务（又称声明式事务）中，程序员不需要编写显式的事务代码。相反，应用程序代码运行在容器内部，由容器在正确的时间启动、提交和中止事务。“正确的时间”指定在配置文件中，通常是\
  \ XML。`ActiveRecord` 不提供容器管理事务的支持，而且我们很少想念它们。（任何用容器管理事务完成的任务也可以通过编程事务完成。）\n\n分布式事务跨不同的数据库管理数据。而且，它们甚至可以跨数据库、消息队列和文件系统管理数据。`ActiveRecord`\
  \ 不提供分布式事务的支持，当我们我们需要它们时，会感到非常迫切。Rails 目前不适用于必须跨不同数据库强制事务语义的系统。但别灰心！JRuby 团队 (http://www.jruby.org)\
  \ 是\n\n\n\n\n\n致力于让 JRuby 在 Rails 上变得可行。一旦实现，我们就可以使用 Java 的事务 API。\n\n## 乐观锁\n\n\
  想象一个没有乐观锁的世界。\n\n**Jane：**\n我想查看罗利利-达姆和芝加哥之间的可用航班。\n\n**计算机：**\n给你！\n\n**John：**\n\
  你能帮我规划从芝加哥到波士顿的旅行吗？\n\n**计算机：**\n抱歉，Jane 现在正在制定旅行计划。请稍后再试。\n\n许多应用场景都是“读后更新”的：例如查看可用航班和座位列表，然后购买机票。问题在于如何平衡数据完整性和吞吐量。如果只有\
  \ Jane 可以使用系统（或某个特定的表或表中的某行），那么数据完整性得到了保证，但 John 只能一直等待。如果你让 John 和 Jane 都使用系统，就会面临他们可能会产生冲突更新的风险。\n\
  \n你可以采用许多技巧来平衡数据完整性和吞吐量。最简单且有效的方法之一是在数据库中使用版本列进行乐观锁。每行数据都保留一个版本号列。当用户读取一行数据时，他们也会读取版本号。当他们尝试更新该行时，会增加版本号。更新是有条件的：只有当版本号未改变时，才会更新该行。现在，John\
  \ 和 Jane 都可以使用系统了。\n\nJohn 偶尔会尝试更新一条刚刚被 Jane 修改过的行。为了防止 Jane 的更改丢失，我们要求 John 使用新数据重新开始。乐观锁之所以运行良好，是因为在大多数系统中，更新冲突是罕见的——通常\
  \ John 和 Jane 都能完成自己的修改。\n\n在 Hibernate 中实现乐观锁轻而易举。在数据库中定义一个列，并在模型对象中定义关联的 JavaBean\
  \ 属性。通常该 JavaBean 属性名为 `version`：\n\n```java\nprivate int version;\npublic int getVersion()\
  \ { return version;}\npublic void setVersion(int version) {\n    this.version =\
  \ version;\n}\n```\n\n### 事务、并发与性能\n\n在 `Person` 的 Hibernate 配置文件中，将 `version` 属性与数据库中的版本列关联。如果数据库列名为\
  \ `lock_version`，如下所示：\n\n```xml\n<version name=\"version\" column='lock_version'/>\n\
  ```\n\n那么 Hibernate 在读取 `Person` 时会填充版本列，并在更新 `Person` 时尝试增加该列的值。如果版本列已发生变化，Hibernate\
  \ 将抛出 `StaleObjectStateException`。\n\nActiveRecord 处理锁的方式相同，但有一个额外的特殊之处。如果你将列命名为\
  \ `lock_version`，ActiveRecord 会自动执行乐观锁。无需在应用程序中添加任何代码或配置。\n\nRails XT 应用中的所有表都使用\
  \ `lock_version`。当 John 和 Jane 同时尝试重置同一个用户的密码时，会发生以下情况。首先，Jane 开始如下操作：\n\n```ruby\n\
  aaron = User.find_by_email('aaron@example.com' )\naaron.password = aaron.password_confirmation\
  \ = 'setme'\n```\n\n在其他地方，John 进行几乎相同的操作：\n\n```ruby\nu = User.find_by_email('aaron@example.com'\
  \ )\nu.password = u.password_confirmation = 'newpass'\n```\n\nJane 先保存了她的更改：\n```ruby\n\
  aaron.save\n```\n\n然后 John 尝试保存：\n```ruby\nu.save\n```\n\n由于 Jane 先完成了更新，John 的更新将由于\
  \ `ActiveRecord::StaleObjectError` 而失败。\n\n如果你的命名约定与 ActiveRecord 不匹配，可以覆盖它。要告诉\
  \ ActiveRecord `User` 类使用一个名为 `version` 的列，你可以这样写：\n\n```ruby\nclass User < ActiveRecord::Base\n\
  \  set_locking_column :version\nend\n```\n\n你可以通过此设置完全关闭乐观锁：\n```ruby\nActiveRecord::Base.lock_optimistically\
  \ = false\n```\n\n有时，现有的数据表结构无法修改以包含版本列。如果你设置了 `optimistic-lock=\"all\"`，Hibernate\
  \ 可以根据整条记录进行版本检查。ActiveRecord 不支持此功能。\n\n## 防止 N+1 问题\n\nN+1 问题很容易演示。假设你想打印每个人的名字，紧接着打印每位作者的格言。首先，获取所有人：\n\
  \n```bash\n$ script/console\n>> people = Person.find(:all)\n```\n\n现在，遍历这些人，并打印他们的名字和格言：\n\
  \n```ruby\n>> people.each do |p|\n  puts p.full_name\n  p.quips do |q|\n    puts\
  \ q.text\n  end\nend\n```\n\n这段代码运行正常且易于理解。问题出在数据库端。在尝试上面的代码后，请参考 `log/development.log`\
  \ 中最新的条目。你会看到类似的内容：\n\n```text\nPerson Load (0.004605)\nSELECT * FROM people\nPerson\
  \ Load (0.003437)\nSELECT * FROM quips WHERE author_id = 1\nQuip Load (0.005988)\n\
  SELECT * FROM quips WHERE author_id = 2\n```\n\n数据库的往返是昂贵的。我们预先知道需要每个人的所有格言。因此，我们可以通过一次获取\
  \ N 个人来提高性能。随着数据增加或关系变得复杂，N+1 问题会迅速恶化。SQL（结构化查询语言）擅长指定你所需的精确行集。但我们使用 O/RM 框架是为了避免处理（大量的）SQL。由于\
  \ N+1 问题非常重要，O/RM 框架通常提供了避免它的方法。\n\n在 Hibernate 中，你可以在查询中添加提示，以指定你接下来需要的其他数据。如果你正在获取人，但也需要格言，你可以说：\n\
  \n```java\nCriteria c = sess.createCriteria(Person.class)\n  .setFetchMode(\"quips\"\
  , FetchMode.JOIN);\nSet people = new HashSet(c.list());\n```\n\n`setFetchMode` 告诉\
  \ Hibernate 使用 SQL 返回任何关联的格言。结果列表会为了每个 `Quip` 重复 `Person` 实例，因此我们使用 `HashSet` 来筛选唯一的人。\n\
  \n在 ActiveRecord 中，你可以使用 `:include` 选项指定预加载的关系：\n\n```ruby\n>> p = Person.find(:all,\
  \ :include=>:quips)\n```\n\n如果你想要原生 SQL 的那种控制力，也可以这样做。在 Hibernate 中，代码如下：\n\n```java\n\
  SQLQuery q = sess.createSQLQuery(\"SELECT p.* FROM PEOPLE p\")\n.addEntity(Person.class);\n\
  Set people = new HashSet(q.list());\n```\n\n在 ActiveRecord 中，代码如下：\n\n```ruby\n\
  >> p = Person.find_by_sql(\"SELECT * from people\")\n```\n\n### 4.9 使用连接池节省资源\n\n\
  Hibernate 和其他 Java OR/M 框架都以某种方式管理连接池。Hibernate 自带了一个默认的连接池机制，并方便配置为使用第三方池。\n\n\n\
  \n\n管理器。`Hibernate` 需要这种灵活性，是因为它可以被应用于各种类型的应用程序。相比之下，`ActiveRecord` 是为了单一类型的应用程序设计的：Web\
  \ 应用程序。任何体谱的 Web 服务器都已以线程池的形式提供了内置的池化；`ActiveRecord` 通过将任务交由 Web 服务器的线程池器，简化了连接池问题。\n\
  \n这意味着尽管 `Hibernate` 将连接分配到一个（假设是线程安全的）外部连接池中，但 `ActiveRecord` 是将打开的连接分配到线程本地存储（thread-local\
  \ storage）中。发送到服务器的所有请求都会分发到这些工作线程之一，而绑定到这些线程的 `ActiveRecord` 类将共享那里发现的打开连接。只要 `ActiveRecord`\
  \ 使用在生产级的 Web 服务器中，这种模式就是生效的。\n\n然而，如果你尝试在其他环境中使用 `ActiveRecord`，例如在手动编写的分布式应用程序中，或者在\
  \ RubyQT 前端之后，那么这种“每个线程一个打开连接”的策略可能会失败。取决于线程创建、池化或丢弃的方式，数据库连接可能无法及时回收，甚至根本无法回收。如果线程被丢弃而连接处于打开但不可访问的状态，那么数据库最终将耗尽可用连接资源，从而关闭应用程序。\n\
  \n这些场景非常罕见；`ActiveRecord` 是为 `Rails` 构建的，而 `Rails` 是为了 Web 构建的。不过，为了满足世界其他地区的需求，一个提供更健壮的连接池策略的补丁正在开发中。\n\
  \n对于许多人来说，`ActiveRecord` 是 `Rails` 的巅峰成就。它没有提供所有的 O/RM 服务，但它通过一个清晰、简单且美丽的 API 实现了“活动记录”设计模式。现在你已经获取了数据，是时候将转向如何通过\
  \ Web 界面操作这些数据了。\n\n### 4.10 资源\n\n### **Ruby on Rails 复合主键** ... [`compositekeys.rubyforge.org/`](http://compositekeys.rubyforge.org/)\n\
  `composite_primary_keys` 插件允许你在 `Rails` 应用程序中处理复合主键。\n\n### **跨越边界：探索 ActiveRecord**\
  \ ... [`www-128.ibm.com/developerworks/java/library/j-cb03076/index.html`](http://www-128.ibm.com/developerworks/java/library/j-cb03076/index.html)\n\
  Bruce Tate 很好地介绍了 `ActiveRecord`，并将其与 Java 的各种选项进行了比较。\n\n### **iBatis** ... [`ibatis.apache.org/`](http://ibatis.apache.org/)\n\
  `iBatis` 是一个数据映射框架。如果你在 SQL 级别需要更多的控制，数据映射可能比“活动记录”设计模式更好。`iBatis` 已移植到 `Ruby`，如果你需要编写一个访问旧数据模式的\
  \ `Rails` 应用程序，它是一个选项。\n\n## 第 5 章 使用 ActionController 协调活动\n\n控制器在 MVC 范式中协调视图和模型的活动。控制器负责以下工作：\n\
  \n* 从用户处收集输入\n* 创建模型对象以处理用户请求\n* 选择适当视图代码进行渲染\n\n在此过程中，控制器负责与用户请求相关的逻辑（而不是与特定的模型对象相关）。此类逻辑包括：\n\
  \n* 身份验证与授权\n* 涉及多个模型对象的业务规则\n* 审计\n* 错误处理\n\n除了这些职责，大多数 Web 应用程序框架还赋予控制器一种 Web\
  \ 特有的职责。Web 控制器为 Web 的惯用法提供了对象模型封装：URL、HTTP 请求、标头、Cookie 等。在控制器级别，Web 应用程序是显式的 Web\
  \ 编程。（相比之下，模型层代码更容易在 Web 应用程序之外复用。）在 `Rails` 中，`ActionController` 库实现了控制器层。在本章中，我们将通过与\
  \ `Struts` 应用程序进行比较来引入 `ActionController`。我们将从基础的 CRUD 开始，然后深入更高级的问题，如会话管理、过滤器和缓存。\n\
  \n## 5.1 路由基础：从 URL 到控制器+方法\n\n要访问 Web 应用程序，你需要一个 URL。对于我们的 `Struts` 示例应用程序，人员列表视图位于\
  \ /appfuse_people/editPerson.html?method=Search。\n\n这个 URL 是如何路由到 Java Web 应用程序中运行的代码的？通常，名称的第一部分（`appfuse_people`）标识服务器上对应特定\
  \ Web 应用程序的 `.war` 文件或目录。Java 应用程序通常包含一个 `Ant` 任务，将应用程序代码和资源复制到服务器上相应的目录。\n\n[下载代码/appfuse_people/build.xml](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/build.xml)\n\
  \n```xml\n<target name=\"deploy-web\" depends=\"compile-jsp\" if=\"tomcat.home\"\
  \ description=\"仅将 web 类部署到 servlet 容器的部署目录\" >\n  <echo message=\"Deploying web\
  \ application to ${tomcat.home}/webapps\" />\n  <copy todir=\"${tomcat.home}/webapps/${webapp.name}\"\
  >\n    <fileset dir=\"${webapp.target}\" excludes=\"**/test.xml,**/web.xml,**/*.xml\"\
  \ />\n  </copy>\n</target>\n```\n\n对于 `Struts` 应用程序，名称的下一部分（`editPerson.html`）通过\
  \ `web.xml` 中的映射到 `ActionServlet`。许多 `Struts` 应用程序使用 `.do` 后缀；在我们的示例中，我们遵循了 AppFuse\
  \ 的做法，简单地 `.html`：\n\n[下载代码/appfuse_people/WEB-INF/web.xml](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/WEB-INF/web.xml)\n\
  \n```xml\n<servlet>\n  <servlet-name>action</servlet-name>\n  <servlet-class>org.apache.struts.action.ActionServlet</servlet-class>\n\
  \  <load-on-startup>2</load-on-startup>\n</servlet>\n<servlet-mapping>\n  <servlet-name>action</servlet-name>\n\
  \  <url-pattern>*.html</url-pattern>\n</servlet-mapping>\n```\n\n这两个步骤在 `Rails`\
  \ 开发中并不存在。在开发期间，`Rails` 代码在单个目录树中编写并执行。`Rails` 不在一个进程中运行多个 Web 应用程序——如果你有多个 Web\
  \ 应用程序，请在单独的进程中运行。由于所有 `Rails` 代码都路由到 `ActionController` 层，你不需要单独配置“我想使用 ActionController”。\n\
  \n大多数 Java 开发者找到了简化这两个步骤的方法。`AppFuse` 等框架会为你创建相应的 `build.xml` 和 `web.xml` 设置。受 `Rails`\
  \ 的启发，许多 Java 开发者现在从同一个目录运行开发代码，避免了编译/部署循环的部分开销。\n\n\n\n\nRails 的路由不是用 XML 描述的，而是用\
  \ Ruby 代码。这是一个简单的路由文件：\n\n[下载 code/people/config/routes.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/config/routes.rb)\n\
  \n```ruby\nActionController::Routing::Routes.draw do |map|\n  map.connect ':controller/:action/:id'\n\
  end\n```\n\n路由中的 `:controller` 部分将 URL 的第一部分映射到控制器类。它使用了标准的大小写和类命名惯例，因此 `people`\
  \ 变为 `PeopleController`。这种机制是通用的，因此此路由条目意味着以 `foo` 开头的 URL 将尝试寻找（在本例中不存在的）`FooController`。\n\
  \n路由中的 `:action` 部分将第二个路径位置组件映射到方法上。因此，`list` 调用了 `list` 方法。同样，这种机制是通用的，因此 `/people/foo`\
  \ 将尝试在 `PeopleController` 上寻找不存在的 `foo` 方法。最后，`:id` 映射到 `id` 参数，它是可选的。在需要对象进行操作的\
  \ `create` 和 `update` 等方法中，`id` 习惯是一个主键。\n\n## 5.2 List 和 Show Action：CRUD 中的 R\n\
  \n许多 Rails 的反对者批评了这种默认路由，因为他们不喜欢这种隐含的命名方案。这完全偏离了重点。Rails 的默认路由让简单的事情变得更简单。你可以轻松启动一个带有许多使用默认路由控制器的\
  \ Rails 服务器。\n\n设计哲学是“按需付费”（pay as you go）。默认路由为你提供了简单、通用且免费的东西。如果你想要更多控制，你也可以，但你必须编写一些路由配置，就像你在\
  \ Struts 中做的那样。你将在第 5.6 节深度路由看到更高级的路由，位于第 151 页。\n\n既然我们可以从 URL 路由到代码，让我们来看代码。在我们的\
  \ Struts 应用程序中，`/appfuse_people/editPerson.html?method=Search` 将我们带到 `PersonAction`\
  \ 的 `search` 方法：\n\n[下载 code/appfuse_people/src/web/com/relevancellc/people/webapp/action/PersonAction.java](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/src/web/com/relevancellc/people/webapp/action/PersonAction.java)\n\
  \n```java\npublic ActionForward search(ActionMapping mapping, ActionForm form,\n\
  \    HttpServletRequest request,\n    HttpServletResponse response)\nthrows Exception\
  \ {\n    PersonManager mgr = (PersonManager) getBean(\"personManager\");\n    List\
  \ people = mgr.getPeople(null);\n    request.setAttribute(Constants.PERSON_LIST,\
  \ people);\n    return mapping.findForward(\"list\");\n}\n```\n\n该方法的签名包含访问 Web\
  \ 对象模型（`request` 和 `response`）以及 Struts 对象模型（`mapping` 和 `form`）的特定参数。然后通过以下步骤加载人员并转发到视图：\n\
  \n1. 在第 5 行，我们查找实际工作的管理器对象。\n2. 在第 6 行，我们获取将在视图中渲染员对象。\n3. 在第 7 行，我们将人员添加到请求中，使视图可以使用这些人员。\n\
  4. 最后在第 8 行，我们选择应该渲染列表的视图。\n\n背后有许多分层。管理器转而委托给 `DAO`，由它实际执行数据访问。管理器层和 `DAO` 层各需要两个\
  \ Java 源文件：指向该层的接口和至少一个实现。此外，层与层之间的连接使用 `Spring Dependency Injection` 进行配置。在链的末端，是执行工作的代码：\n\
  \n[下载 code/appfuse_people/src/dao/com/relevancellc/people/dao/hibernate/PersonDaoHibernate.java](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/src/dao/com/relevancellc/people/dao/hibernate/PersonDaoHibernate.java)\n\
  \n```java\npublic List getPeople(Person person) {\n    return getHibernateTemplate().find(\"\
  from Person\");\n}\n```\n\n如果你理解这一切在 Struts 中是如何工作的，那么过渡到 Rails 就是简单的。一个典型的 Rails\
  \ 控制器执行相同的步骤。这初看起来并不显而，因为在每一步中，Rails 的方法都做了不同的风格选择。代码如下：\n\n[下载 code/people/app/controllers/people_controller.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/app/controllers/people_controller.rb)\n\
  \n```ruby\ndef list\n  @search = params[:search]\n  if @search.blank?\n    @person_pages,\
  \ @people = paginate :people, :per_page => 10\n  else\n    query = ['first_name\
  \ = :search or last_name = :search',\n             {:search=>@search}]\n    @person_pages,\
  \ @people = paginate :people, :per_page => 10, :conditions=>query\n  end\nend\n\
  ```\n\nRails 的 `list` 没有参数！当然，同样类型的信息是可用的。区别在于 Rails 方法做了不同的风格选择。Java 的哲学是“显式优于隐式”。你可以轻松启动一个带有许多使用这种默认路由控制器的\
  \ Rails 服务器。这种设计哲学是“按需付费”。默认路由为你提供了简单、通用且免费的东西。如果你想要更多控制，你也可以，但你必须编写一些路由配置，就像你在\
  \ Struts 中做的那样。\n\n\n\n稍将看到，Rails 提供了一个你可以使用的 `render` 方法来覆盖这种行为。\n\n# 列表和显示动作：CRUD\
  \ 中的 R\n\n现在你已经看到了列表动作（list action），接下来你将查看显示单个人员编辑表单的代码。我们的 Struts 实现使用一个名为 `edit`\
  \ 的单一 action 来同时处理“新增”和“更新”类型：\n\n[下载 code/appfuse_people/src/web/com/relevancellc/people/webapp/action/PersonAction.java](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/src/web/com/relevancellc/people/webapp/action/PersonAction.java)\n\
  \n```java\npublic ActionForward edit(ActionMapping mapping, ActionForm form,\nHttpServletRequest\
  \ request,\nHttpServletResponse response)\nthrows Exception {\n    PersonForm personForm\
  \ = (PersonForm) form;\n    if (personForm.getId() != null) {\n        PersonManager\
  \ mgr = (PersonManager) getBean(\"personManager\" ); \n        Person person = mgr.getPerson(personForm.getId());\n\
  \        personForm = (PersonForm) convert(person);\n        updateFormBean(mapping,\
  \ request, personForm);\n    }\n    return mapping.findForward(\"edit\" );\n}\n\
  ```\n\n这段代码经过了你之前看到的一系列步骤：调用另一个层获取对象，将对象放入 request 作用域，并选择到视图的映射。新之处在于与表单 bean（form\
  \ bean）的交互。表单是 `PersonForm` 的实例。表单 bean 代表与人员相关的 Web 表单数据。由于表单在功能上是 `Person` 模型的子集，表单\
  \ bean 类可以自动生成。你可以通过在 `Person` 类顶部的 `XDoclet` 标签来实现这一点：\n\n```\n@struts.form include-all=\"\
  true\" extends=\"BaseForm\"\n```\n\n为了显示编辑表单，`edit` 动作需要将数据从模型 `person` 复制到它的表单表示中。`convert`\
  \ 方法执行了这一操作。你可以为应用程序中的每个模型/表单对编写单独的 `convert` 方法。更简单的方法是使用 JavaBean 内省（introspection）来编写一个通用的\
  \ `convert` 方法。我们的方法使用了包含在 AppFuse 中的通用 `convert` 方法。\n\nRails 的对应版本使用了两个动作：`new`\
  \ 和 `edit`：\n\n[下载 code/people/app/controllers/people_controller.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/app/controllers/people_controller.rb)\n\
  \n```ruby\ndef edit\n  @person = Person.find(params[:id])\nend\n\ndef new\n  @person\
  \ = Person.new\nend\n```\n\n# 创建、更新和删除动作\n\nRails 版本执行了相同的事情，但方式不同。在 Rails 应用中，模型对象和表单\
  \ bean 之间没有区别；`ActiveRecord` 对象兼顾了这两个用途。因此，没有表单参数或 `convert` 步骤。Rails 版本有两个方法，是因为\
  \ Rails 应用通常使用两个不同的模板来渲染“new”和“edit”。（这听起来并没有想象中那么冗余；这两个模板委托给一个实际上绘制表单的单一局部模板（partial\
  \ template）。）\n\n## 5.3 创建、更新和删除动作\n\n创建、更新和删除动作往往具有更有趣的代码，因为它们改变了状态。因此，它们必须处理验证、状态消息和重定向。这里是一个保存或更新人员的\
  \ Struts 动作方法：\n\n[下载 code/appfuse_people/src/web/com/relevancellc/people/webapp/action/PersonAction.java](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/src/web/com/relevancellc/people/webapp/action/PersonAction.java)\n\
  \n```java\npublic ActionForward save(ActionMapping mapping, ActionForm form,\nHttpServletRequest\
  \ request,\nHttpServletResponse response)\nthrows Exception {\n    ActionMessages\
  \ messages = new ActionMessages();\n    PersonForm personForm = (PersonForm) form;\n\
  \    boolean isNew = (\"\".equals(personForm.getId()));\n    PersonManager mgr =\
  \ (PersonManager) getBean(\"personManager\" ); \n    Person person = (Person) convert(personForm);\n\
  \    mgr.savePerson(person);\n    if (isNew) {\n        messages.add(ActionMessages.GLOBAL_MESSAGE,\n\
  \        new ActionMessage(\"person.added\" ));\n        saveMessages(request.getSession(),\
  \ messages);\n        return mapping.findForward(\"mainMenu\" );\n    } else {\n\
  \        messages.add(ActionMessages.GLOBAL_MESSAGE,\n        new ActionMessage(\"\
  person.updated\" ));\n        saveMessages(request, messages);\n        return mapping.findForward(\"\
  viewPeople\" );\n    }\n}\n```\n\n让我们先考虑用户编辑成功的理想情况。这段代码的大部分与之前的示例相似；新部分是添加了状态消息。在第\
  \ 5 行，我们创建了一个 `ActionMessages` 实例来保存状态消息，在第 12–14 行和 17–19 行中，我们将 `ActionMessages`\
  \ 保存到 request 中，以便在视图中渲染。\n\n这里是更新的 Rails 版本：\n\n[下载 code/people/app/controllers/people_controller.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/app/controllers/people_controller.rb)\n\
  \n```ruby\ndef update\n  @person = Person.find(params[:id])\n  if @person.update_attributes(params[:person])\n\
  \    flash[:notice] = 'Person was updated.'\n    redirect_to :action => 'show',\
  \ :id => @person.id\n  else\n    render :edit\n  end\nend\n```\n\n`update_attributes`\
  \ 是一个 `ActiveRecord` 方法，可以一次性设置多个属性。就像它的兄弟 `create` 和 `save` 一样，`update_attributes`\
  \ 会自动执行验证。类似于 Struts 的更新，Rails 的更新版本设置了状态消息。在第 4 行，“Person was updated.”被添加到一个名为\
  \ flash 的特殊对象。flash 的设计是为了处理更新通常会被重定向这一事实。\n\n所以，将状态保存到成员变量中是没有用的——重定向后，状态变量将会丢失。反而保存到\
  \ session 中是可行的，但你之后需要从 session 中移除它。这正是 flash 所做的：将对象保存到 session 并在下次重定向后将其移除。\n\
  \nflash 是一个巧妙的技巧。遗憾的是，通常放入 flash 的数据一点并不明智。Rails 原生不支持国际化，状态消息直接以字符串的形式存储（通常是英语）。对比\
  \ Struts 应用，它存储的是如“person.added.”之类的键。视图可以使用这些键来查找本地化的字符串。缺乏国际化支持是 Rails 的一个大缺陷。如果你的应用需要国际化，你将需要自己实现或使用第三方库。\n\
  \n在成功更新操作后，控制器应该重定向到一个执行读取操作的 URL。这使得用户不太可能书签一个执行更新的 URL，否则之后可能会产生奇怪的结果。可能的选择有刚刚编辑的对象的显示视图、相似对象的列表视图，或者顶层视图。Struts\
  \ 版本通过调用 `findForward` 来重定向：\n\n```java\nreturn mapping.findForward(\"mainMenu\"\
  \ );\n```\n\n要验证这个跳转确实是重定向，你可以查看 `struts.xml` 配置文件。一切看起来正常：\n\n```xml\n<global-forwards>\n\
  \    <forward name=\"mainMenu\" path=\"/mainMenu.html\" redirect=\"true\" />\n \
  \   <!-- 等等 -->\n</global-forwards>\n```\n\nStruts 使用 `findForward` 同时处理渲染和重定向，而\
  \ Rails 有两个独立的方法。在保存后，控制器会发出显式的重定向：\n\n```ruby\nredirect_to :action => 'show', :id\
  \ => @person\n```\n\n注意，重定向是根据 action 和参数命名的。Rails “反向”运行路由表，将 action 和参数转换回 URL。使用默认路由时，该\
  \ URL 将是 /people/show/(some_int).)\n\n\n\n\n更新失败。Struts 和 Rails 都提供了验证用户输入的机制。\n\
  \n在 Struts 中，`Validator` 对象根据 `XML` 文件中的声明式设置自动对表单单元（form beans）进行验证。验证与表单相关。要指定“firstName”为必填项，你可以像这样使用\
  \ `XML`：\n\n[下载代码/appfuse_people/snippets/person_form.xml](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/snippets/person_form.xml)\n\
  \n```xml\n<form name=\"personForm\" >\n  <field property=\"firstName\" depends=\"\
  required\" >\n    <arg0 key=\"personForm.firstName\" />\n  </field>\n  <!-- 其他字段\
  \ -->\n</form>\n```\n\n这种离散验证语言的原始意图是关注点分离。但有时将相关的关注点放在一起会更方便。我们没有手动编写 `validation.xml`\
  \ 文件，而是通过这种方式在 `Person` 模型类中使用 `XDoclet` 注解来生成验证规则：\n\n[下载代码/appfuse_people/src/dao/com/relevancellc/people/model/Person.java](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/src/dao/com/relevancellc/people/model/Person.java)\n\
  \n```java\n/**\n * @hibernate.property column=\"first_name\" length=\"50\"\n * @struts.validator\
  \ type=\"required\"\n */\npublic String getFirstName() {\n  return firstName;\n\
  }\n```\n\n在 `Ant` 构建步骤期间，`struts.validator` 注解会在 `validation.xml` 文件中生成相应的行。（在 Java\
  \ 5 及更高版本中，注解提供了一种更简单、集成的注解机制。）在 Rails 中，没有独立的表单单元，验证直接声明在 `Person` 模型类上。你已经在第 4.5,\
  \ 节 验证数据值中见过这一点，页面位于第 113 页：\n\n[下载代码/people/app/models/person.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/app/models/person.rb)\n\
  \n```ruby\nclass Person < ActiveRecord::Base\n  validates_presence_of :first_name,\
  \ :last_name\nend\n```\n\nStruts 版本和 Rails 版本处理验证错误的方式相同：重新渲染页面，并用错误消息标记需要修正的表单字段。在\
  \ Struts 中，这种重定向是在 `Validator` 中处理的。如 `PersonForm` 类的表单单元继承了 Struts 类 `org.apache.struts.validator.ValidatorForm`。`ValidatorForm`\
  \ 类提供了 `validate` 方法。Struts 框架会自动调用 `validate`，如果任何项目验证失败，则表单页面将重新渲染。Rails 的方法更显显式。当你对\
  \ `ActiveRecord` 模型调用 `save` 或 `update_attributes` 时，布尔值 `false` 可能表示验证失败。如果发生了这种情况，你可以使用\
  \ `render` 重新渲染 `edit` 动作：\n\n[下载代码/people/snippets/update_fails.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/snippets/update_fails.rb)\n\
  \n```ruby\nif @person.update_attributes(params[:person])\n  # ...省略了成功的情况...\nelse\n\
  \  render :action => 'edit'\nend\n```\n\n验证错误存储在 `@person` 对象的 `errors` 属性中，因此你不需要执行其他操作即可将错误传递给表单视图。第\
  \ 6.5, 节 构建 HTML 表单（位于第 174 页）描述了如何在视图中渲染验证。\n\n# 使用 Session 跟踪用户状态\n\nRails 中标准的\
  \ `create` 和 `update` 动作没有演示任何额外的平台特性，因此我们不再赘述它们。\n\n## 5.4 使用 Session 跟踪用户状态\n\n\
  Web 主要是无状态的。换句话说，`HTTP` 请求带有定位/生成响应所需的所有信息。无状态简化了客户端服务器之间的交互模型，并有助于 Web 应用程序扩展。添加“笨的”缓存、代理和负载均衡器很容易。这些中间件不需要知道对话之前的任何状态，因为根本不存在之前的状态。\n\
  \n程序员可以通过添加服务器端 `sessions` 来让 Web 变为有状态的。与其让整个对话在请求和响应流量中“明文传输”，不如客户端在服务器上逐步建立状态。服务器将此状态与一个唯一键关联，并将其传递给客户端（通常通过\
  \ `HTTP cookies`）。这种 Web 的有状态视图产生了一个复杂得多的局面。缓存等中间件无法为有状态的 URL 返回缓存值，因为 `URL` 不再能唯一标识一个资源。要生成正确的响应，你现在需要一个\
  \ `URL`、客户端的 `cookie` 以及服务器上相关的（特定应用程序的）状态。这听起来像是一个反对 session 的无懈可击的理由，如果扩展性是唯一目标的话确实如此。但问题在于\
  \ session 可能非常有用。Session 通常用于各种目的：\n\n- Session 用于身份验证和授权目的维护用户身份信息。\n- Session\
  \ 存储正在进行中的状态，即用户已做出决策。\n- Session 有时用于存储用户偏好，包括语言。常见的“购物车”就是一个很好的例子。你已经在第 5.3, 节\
  \ 创建、更新和删除动作中见过 session 的一种用法。Struts 和 Rails 都使用 session 来保持信息存活。但记住扩展性问题，在可行的情况下避免使用\
  \ session。\n\n# 使用 Session 跟踪状态\n\n在 Java 中，session 是 `request` 对象的属性：\n\n[下载代码/appfuse_people/src/web/com/relevancellc/people/webapp/LocaleFilter.java](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/src/web/com/relevancellc/people/webapp/LocaleFilter.java)\n\
  \n```java\nHttpSession session = request.getSession(false);\n```\n\n`session` 对象提供了一个简单的\
  \ API 来管理键值对。以下代码是将 `Locale` 实例存储在用户的 session 中：\n\n[下载代码/appfuse_people/src/web/com/relevancellc/people/webapp/LocaleFilter.java](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/src/web/com/relevancellc/people/webapp/LocaleFilter.java)\n\
  \n```java\nsession.setAttribute(Constants.PREFERRED_LOCALE_KEY, preferredLocale);\n\
  ```\n\n在 Rails 中，session 是控制实例的属性。与其 Java 类似类似，Rails session 提供了一个简单的 API 来管理键值对。以下代码来自\
  \ `acts_as_authenticated` 插件：\n\n[下载代码/rails_xt/lib/authenticated_system.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/lib/authenticated_system.rb)\n\
  \n```ruby\ndef store_location\n  session[:return_to] = request.request_uri\nend\n\
  ```\n\n`store_location` 方法在我们重定向用户到登录时调用。当前 URL 存储在 session 的 `:return_to` 中。然后，在登录后，我们可以将用户重定向回之前的地方并清除\
  \ session 值：\n\n```ruby\ndef redirect_back_or_default(default)\n  session[:return_to]\
  \ ? redirect_to_url(session[:return_to]) \\\n  : redirect_to(default)\n  session[:return_to]\
  \ = nil\nend\n```\n\nJava 和 Rails 的 session API 有一个共同的烦恼：它们都在没有使用适用于该目的的语言习惯的情况下管理键值集合。在\
  \ Java servlets 中，session 没有实现 `HashMap`；在 Rails 中，session 没有实现 `Hash` 的所有方法。但这些细微的瑕疵之外，两个\
  \ API 都易于学习和使用。session 的有趣之处不在于 API，而是底层的\n\n\n\n\n并发和扩展性问题，我们将在后续章节讨论。\n\n在 Java\
  \ 中，单个 servlet 进程可以有多个用户操作活跃。因此，对 session 对象的访问必须使用线程同步原语进行保护。这比大多数人想象的要复杂，即使是同步也可能不够用。《Java\
  \ 并发编程》的首席作者 Brian Goetz [[Goe06]](#index_split_003.html_p306) 指出，无论你添加了任何并发原语，以下简单的代码示例都是损坏的：\n\
  \n```java\nFoo foo = session.getAttribute(\"foo\" );\nfoo.setBar(newBar);\n```\n\
  \n问题在于，session 机制并不知道 session 已经变化，因为它并不知道 `foo` 发生了变化。为了避免这个问题，你需要重置已经存在于 session\
  \ 中的属性：\n\n```java\nFoo foo = session.getAttribute(\"foo\" );\nfoo.setBar(newBar);\n\
  //确保确保 session 知道某些内容发生了变化！\nsession.setAttribute(\"foo\" , foo);\n```\n\nRails\
  \ 不会受这个问题的影响，因为无论 session 是否发生变化，Rails 都会重新保存 session。这消除了一个微妙的 bug 来源，但它让 session\
  \ 变得更加昂贵。每次使用 Rails session 都意味着对 session 存储进行读一写。当你进行性能优化时，可以在不需要的地方禁用 session。你可以在控制器中通过以下方式关闭\
  \ session：\n\n```ruby\nsession :off\n```\n\n或者，你可以针对每个 action 这样做：\n\n```ruby\n\
  session :off, :only => %w[index list rss]\n```\n\nsession 的性能和扩展性很大程度上取决于 session\
  \ 如何存储的。在 Rails 中，与 Java Web 框架一样，你可以使用多种不同的 session 存储选项。以下是一些帮助入门的规则：\n\n- 默认\
  \ session 存储使用文件系统上的文件。这适用于开发，但不符合大多数部署场景。\n- 你可以使用 `ActiveRecord` 将 session 存储在数据库中。若要在项目中开启此功能，请创建并运行迁移文件以添加\
  \ sessions 表：\n\n```\nrake db:sessions:create\nrake db:migrate\n```\n\n然后，在你的 `environment.rb`\
  \ 中取消下行的注释：\n\n```ruby\nconfig.action_controller.session_store = :active_record_store\n\
  ```\n\n使用 `ActiveRecord` session 存储，直到性能分析显示你有性能问题，届时参考本章末尾的资源。\n\n## 5.5 使用过滤器和\
  \ Verify 管理跨切关注点\n\n仅使用前几节描述的基本 CRUD action 就可以构建复杂的 Web 应用。这是可能的，但是浪费的。通常，程序逻辑需要应用于多个\
  \ action 甚至多个控制器。这些元素被称为跨切关注点（cross-cutting concerns）。描述通常引用安全、日志和事务。除了这些，验证和重定向规则有时也通用到可以使用跨切方法。\n\
  \n让我们从日志开始。如果你想记录某个 action 被调用，可以只需在方法本身中添加调用。在 Struts 应用中，你可以这样做：\n\n```java\n\
  public ActionForward delete(ActionMapping mapping, ActionForm form,\nHttpServletRequest\
  \ request,\nHttpServletResponse response)\nthrows Exception {\n  if (log.isDebugEnabled())\
  \ {\n    log.debug(\"Entering delete method\" );\n  }\n}\n```\n\n你可以在 Rails 中执行同样的操作：\n\
  \n```ruby\ndef destroy\n  logger.debug('Entering delete method' )\nend\n```\n\n\
  如果你想记录所有的 action 方法，这种方法将非常繁琐。相反，你可能会选择使用 servlet 过滤器（filter）来添加日志。要定义 servlet 过滤器，你需要创建一个\
  \ `javax.servlet.Filter` 实例，其 `doFilter` 方法有机会在请求路由到 servlet 之前和之后处理请求。\n\n这是一个在分发请求之前记录请求\
  \ URI 的 `Filter`：\n\n```java\npublic void\ndoFilter(ServletRequest req, ServletResponse\
  \ resp, FilterChain filterChain) throws IOException, ServletException {\n  if (log.isDebugEnabled())\
  \ {\n    HttpServletRequest r= (HttpServletRequest)req;\n    log.debug(\"Entering\
  \ \" + r.getRequestURI());\n  }\n  filterChain.doFilter(req, resp);\n}\n```\n\n\
  为了将此过滤器与某些 URL 关联，你还需要在 `web.xml` 中为过滤器指定名称：\n\n```xml\n<filter>\n  <filter-name>LoggingFilter</filter-name>\n\
  \  <filter-class>com.relevancellc.people.webapp.filter.LoggingFilter</filter-class>\n\
  </filter>\n\n<filter-mapping>\n  <filter-name>LoggingFilter</filter-name>\n  <url-pattern>/appfuse_people/*</url-pattern>\n\
  </filter-mapping>\n```\n\n在 Rails 中，你可以在控制器内部创建过滤器方法。要在 `PeopleController` 的每个 action\
  \ 之前添加日志，请向 `PeopleController` 添加以下内容：\n\n```ruby\nbefore_filter do |controller|\n\
  \  logger.debug \"About to handle #{controller.action_name}\"\nend\n```\n\n`before_filter`\
  \ 块会在每个 action 之前被调用。让我们看看这与 servlet 过滤器方法的不同之处。首先，servlet 过滤器有显式的 `request` 和 `response`\
  \ 参数。Rails 的 `before_filter` 有 `controller` 块参数。`request` 和 `response` 通过 `controller`\
  \ 上的方法可用。\n\nservlet 过滤器的 `doFilter` 方法还有第三个参数 `filterChain`。`filterChain` 将处理传递给链中的下一个过滤器（如果这是链中的最后一个过滤器，则传递给\
  \ servlet）。在 Rails 中，将控制传递给链中的下一个过滤器是隐式的，基于 `before_filter` 的返回值。如果 Rails 的 `before_filter`\
  \ 返回 `true`，控制传递给下一个过滤器。如果 `before_filter` 返回 `false`，处理完成。\n\nservlet 过滤器方法为每个过滤器提供了一个显式名称，而之前的\
  \ `before_filter` 使用的是匿名块。作为替代方案，你可以向 `before_filter` 传递一个符号（symbol），指定要作为之前过滤器调用的方法。这是一个带有命名\
  \ `log_action` 的 `before_filter`：\n\n```ruby\nbefore_filter :log_action\n\ndef log_action\n\
  \  logger.debug \"About to handle #{self.action_name}\"\nend\n```\n\nservlet 过滤器可以根据\
  \ `web.xml` 中的 `filter-mapping` 配置应用于 URL 的子集。在 Rails 中，你可以通过 `:only` 和 `:except`\
  \ 选项将 `before_filter` 应用于 action 子集。此 `before_filter` 只记录 `index` 和 `show` action：\n\
  \n\n\n\n[下载 code/people/app/controllers/people_controller.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/app/controllers/people_controller.rb)\n\
  \n```ruby\nbefore_filter :log_action, :only=>[:index,:show]\n```\n\n此 `before_filter`\
  \ 使用 `except` 来记录除 index 之外的所有动作：\n\n[下载 code/people/app/controllers/people_controller.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/app/controllers/people_controller.rb)\n\
  \n```ruby\nbefore_filter :log_action, :except=>[:index]\n```\n\n除了 `before_filter`\
  \ 之外，Rails 控制器还可以使用 `around_filter` 和 `after_filter`。正如其名称所示，这些方法分别在控制器动作的前和之后执行。\n\
  \n由于 servlet 过滤器（servlet filter）是在 URL 级别适的，因此可以跨多个 servlet 进行过滤。如果你将过滤器-映射的 `url-pattern`\
  \ 从 `/appfuse_people/*` 改为 `/*`，那么 `loggingFilter` 将作用于所有 URL。在 Rails 中，你可以通过将代码移动到\
  \ `app/controllers/application.rb` 中的 `ApplicationController` 类来影响多个控制器。`ApplicationController`\
  \ 是所有控制器的基类，因此在那里声明的方法对所有控制器可用。同样，在 `ApplicationController` 类上的过滤器也会应用于所有控制器。\n\n\
  值得注意的是，servlet 过滤器和 Rails 过滤器的应用时间点并不完全相同。servlet 过滤器是针对传入的 URL 进行评估的，在 fact URL\
  \ 转换为控制器的动作之前。（事实上，URL 可能永远不会被转换为控制器的动作，因为并不是所有 servlet 都使用 MVC。）在 Rails 中，过滤器是在控制器/动作级别应用的的，是在\
  \ URL 针对路由表进行评估之后应用的。根据我们的经验，这种区别在实践中影响不大。servlet 过滤器和 Rails 过滤器倾向于用于同类型的任务。例如，Spring\
  \ ACEGI 中的安全限制是通过 servlet 过滤器强制执行的，而在 Rails 的 `acts_as_authenticated` 插件中，它们是通过\
  \ `before_filter` 强制执行的。\n\n详情请参见第 282 页第 10 章“安全”。\n\n过滤器最常见的用途之一是将请求重定向到更合适的端点。Rails\
  \ 通过 `verify` 方法对这种用例提供了特定的支持。`verify` 接受单个哈希，包含一组建立动作先决条件的选项：\n\n* `:except` 包含此\
  \ `verify` 不适用的动作。\n* `:flash` 包含必须在 `flash` 中的键。\n* `:method` 包含允许的 HTTP 方法（例如\
  \ `:get`）。\n* `:only` 包含此 `verify` 应用的动作。\n* `:params` 包含必须在参数中存在的键。\n* `:session`\
  \ 包含必须在 session 中的键。\n* `:xhr` 可以设置为 true 以要求 Ajax，或设置为 false 以禁止它。\n\n相同的参数哈希指定了在不满足条件时该做什么：\n\
  \n* `:render` 指定要渲染的模板。\n* `:redirect_to` 指定要重定向的 URL，使用的参数与 `url_for` 相同。\n* `:add_flash`\
  \ 向 flash 添加键/值对。\n\nRails 脚手架（scaffold）提供了 `verify` 的良好示例。Rails 脚手架定义了一组公共动作：`show`、`edit`、`create`、`new`、`list`、`update`\
  \ 和 `destroy`。其中某些动作会改变应用程序状态，并应该需要 HTTP POST。这里是 `verify`：\n\n[下载 code/people/app/controllers/people_controller.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/app/controllers/people_controller.rb)\n\
  \n```ruby\nverify :method => :post, :only => [ :destroy, :create, :update ],\n:redirect_to\
  \ => { :action => :list }\n```\n\n如果用户尝试使用 POST 以外的任何动词访问 create、update 或 delete，他将被重定向到\
  \ GET 获取 list 动作。\n\n# 5.6 深度解析路由\n\n正如第 134 页第 5.1 节“路由基础：从 URL 到控制器+方法”所示，默认的\
  \ Rails 路由做了大量的工作。从 `:controller/:action/:id` 中，你可以处理无限可能的控制器、方法和 ID，而无需添加任何其他路由。但是，你应用程序的结构直接暴露在每个\
  \ URL 中。在本节中，我们将展示几个示例，说明设计需求如何在 URL 和控制器代码之间引入了更多的间接性。\n\n首先，我们将引入一点术语。为了路由目的，URL\
  \ 由由分隔符隔的组件组成。默认的组件路由有三个组件，由斜杠分隔。路由将这些组件转换为控制器、动作，以及可能指向动作的某些参数。\n\n让我们从 Rails XT\
  \ 中的登录和注销 URL 开始。这些 URL 指向 `AccountController` 的 `login` 和 `logout` 方法。你将在第 283\
  \ 页第 10.1 节“使用 acts_as_authenticated 插件进行身份验证”中看到这些方法是如何工作的；现在我们关注的是 URL。用户认为 `/account/login`\
  \ 太冗余，想简单地使用 `/login`。注销也是如此。我们在 `routes.rb` 中添加以下行：\n\n```ruby\nmap 'login', :controller=>'account',\
  \ :action=>'login'\nmap 'logout', :controller=>'account', :action=>'logout'\n```\n\
  \n`connect` 的第一个参数是静态组件：`login` 精确匹配 URL 中的相同组件。第二个参数是指定控制器和动作的哈希。为什么默认路由没有指定控制器和动作呢？默认路由由冒号开头的组件组成，例如\
  \ `:controller`。这些动态组件匹配任何组件并根据匹配结果分配命名值。所以，`:controller` 匹配 foo 并选择控制器。让我们添加一个显示最近编辑过的格言的路由。要查看修改次数最多的\
  \ 20 个，使用 `/quips/recent/20`。如果没有指定数字，默认应该是十。\n\n```ruby\nmap 'quips/recent/:count',\n\
  :defaults => {:count => '10' },\n:requirements => {:count => /\\d+/},\n:controller=>'quips',\
  \ :action=>'recent'\n```\n\n## 如何测试路由？\n\nRails 有内置用于测试路由的断言。`assert_recognizes`\
  \ 断言 URL 是否如你预期的那样被识别，`assert_generates` 断言一组参数是否生成了特定的 URL。你可以通过 `assert_routing`\
  \ 同时测试两个方向。以下是本节涵盖路由的测试代码：\n\n[下载 code/rails_xt/test/functional/routing_test.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/test/functional/routing_test.rb)\n\
  \n```ruby\nrequire File.dirname(__FILE__) + '/../test_helper'\n\nclass RoutingTest\
  \ < Test::Unit::TestCase\n  def test_default_route\n    assert_routing '/quips/show/1',\n\
  \    :controller=>'quips', :action=>'show', :id=>'1'\n  end\n\n  def test_account_routes\n\
  \    assert_routing 'login',\n    :controller=>'account', :action=>'login'\n   \
  \ assert_routing 'logout',\n    :controller=>'account', :action=>'logout'\n  end\n\
  \n  def test_recent_routes\n    assert_routing '/quips/recent/20',\n    :controller=>'quips',\
  \ :action=>'recent', :count=>'20'\n    assert_routing '/quips/recent',\n    :controller=>'quips',\
  \ :action=>'recent', :count=>'10'\n  end\n\n  def test_conditional_routes\n    assert_routing\
  \ '/quips/edit/1',\n    :controller=>'quips', :action=>'edit', :id=>'1'\n  end\n\
  end\n```\n\n这些是功能性测试。功能性测试将在详细介绍。\n\n\n\n\n\n在第 7.2, 功能测试章节，第 210. 页，路由通过任何使用 URL\
  \ 访问功能的测试进行隐式测试，包括集成测试（第 7.4, 集成测试，第 216) 页）和 selenium 测试（第 6.10, 使用 Selenium 的黑盒测试，第\
  \ 192) 页）。\n\n## 日志、调试与基准测试\n\n此路由演示了两个新选项：`requirements` 和 `defaults`。`requirements`\
  \ 选项限制了动态组件的可能值。如果指定 `:count`，它必须是一个或多个数字。`defaults` 选项在 URL 中不存在该动态组件时，会为该组件填充值。如果省略了\
  \ `:count`，`params[:count]` 将设置为 `'10'`。\n\n我们孜不倦的用户还有一个最后的请求。同一个 URL 应该同时处理编辑和更新：`/quips/edit`。下面是该路由：\n\
  \n[下载 code/rails_xt/config/routes.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/config/routes.rb)\n\
  \n```ruby\nmap.edit 'quips/edit/:id' ,\n:conditions => {:method => 'get' },\n:controller=>'quips'\
  \ , :action=>'edit'\n\nmap.edit 'quips/edit/:id' ,\n:conditions => {:method => 'post'\
  \ },\n:controller=>'quips' , :action=>'update'\n```\n\n此路由进一步演示了路由的两个功能：`conditions`\
  \ 和命名路由。`conditions` 子句允许你根据 URL 以外的其他因素进行路由。（此功能需要 Rails 1.2。）在这里，我们检查 HTTP 动词，并将\
  \ `GET` 路由到一种方式，将 `POST` 路由到另一种方式。\n\n我们没有使用 `map.connect`，而是通过调用任意命名路由名称 `map.edit`\
  \ 创建了一个命名路由。命名路由会生成特殊名称的方法，这些方法对于将路由组织成相关组非常有用。例如，`map.edit` 创建了方法 `edit_url`。你可以使用\
  \ `edit_url` 代替 `url_for` 使代码更易读。\n\n在这里，我们展示了路由识别——Rails 如何将 URL 转换为控制器、动作和参数。相反的方向是路由生成，处理的是\
  \ Rails 如何将控制器、动作和参数转换为 URL。路由生成在第 6.2, 使用视图辅助程序减少视图代码章节，第 169. 页中介绍。\n\n### 5.7\
  \ 日志、调试与基准测试\n\nWeb 应用程序框架倾向于大量使用日志进行诊断和故障排除。一个良好的日志文件可以帮助你在问题发生时重现发生过程，甚至在问题出现之前检测到即将发生的问题。Web\
  \ 应用较少使用 GUI 调试器；尽管如此，在追踪困难问题时，一个良好的 GUI 调试器可能是无价之。最后，性能调优是应用程序开发的最后步骤之一。\n\n我们在本节中讨论的技术不仅限于控制器层。事实上，所有这些技术都涉及整个应用程序。我们选择在这里介绍它们，是因为控制器层将一切结合在了一起。设计良好的系统的各个部分通常非常简单。当这些部分被控制器结合在一起，就会出现棘手且意之外的交互。日志、调试和基准测试将帮助你理解这些交互。\n\
  \n### 日志\n\n在 Java 中，日志的事实标准是一个名为 `log4j` 的开源项目。要理解 `log4j`，你需要处理四个基本概念：日志级别（log\
  \ levels）、输出器（appenders）、布局（layouts）和日志器（loggers）。日志级别指定日志消息的紧急程度。消息范围从极其紧急到信息性不等。消息量之间往往存在反相关关系：紧急消息很少，而信息性消息可能会如雪般到来。大多数\
  \ Java 开发者使用一组预定义的日志级别：\n\n*   **FATAL**：致命消息是应用程序在某种灾难性结束前的最后遗言。不应该有许多 `FATAL`\
  \ 日志条目。\n*   **ERROR**：错误消息表示严重状况，可能需要人工干预（例如重启进程、修复 bug、修复损坏的数据等）。\n*   **WARNING**：警告消息表示存在潜在问题，但没有立即错误。\n\
  *   **INFO**：信息性消息报告健康应用程序中的正常事件。\n*   **DEBUG**：调试消息提供了调试系统时有用的额外信息。调试消息类似于信息性消息，但数量可能多得多，而且它们通常在生产系统中是被禁用的。\n\
  *   **TRACE**：追踪消息用于非常细粒度的故障排除，类似于 `DEBUG` 但程度更深。我们很少使用 `TRACE`。\n\n`appender`（输出器）是附加消息的目的地。在开发环境中，输出器通常是控制台窗口或本地文件。在生产环境中，输出器可能更健壮，写入套接字或数据库。`layout`（布局）决定消息的格式，指定消息包含哪些字段以及如何分隔。日志条目通常包含时间戳和一些关于消息来源的信息。输出器和布局是为一个或多个日志器配置的。日志器具有名称，通常与\
  \ Java 包名相关。名称是层次级的，并具有合理的继承规则。这让你能够说如“我希望所有日志器记录级别为 `WARNING` 或更高的消息，发送到文件。我正在调试\
  \ `com.foo` 包，所以将 `com.foo` 日志器设置为 `DEBUG`，发送到控制台。”`log4j` 可以使用属性文件或 XML 配置。我们倾向于属性文件，因为它更容易读。这里是用于\
  \ Struts 应用的基础输出器和布局：\n\n[下载 code/appfuse_people/web/WEB-INF/classes/log4j.properties](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/web/WEB-INF/classes/log4j.properties)\n\
  \n```\nlog4j.appender.stdout=org.apache.log4j.ConsoleAppender\nlog4j.appender.stdout.layout=org.apache.log4j.PatternLayout\n\
  ```\n\n这些行请求控制输出。整个文件包含了这些基础设置的扩展和改进。最重要的是针对特定包的级别设置：\n\n[下载 code/appfuse_people/web/WEB-INF/classes/log4j.properties](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/web/WEB-INF/classes/log4j.properties)\n\
  \n```\nlog4j.logger.com.relevanalyticsc.people=DEBUG\nlog4j.logger.com.relevanalyticsc.people.webapp.filter=ERROR\n\
  log4j.logger.com.relevanalyticsc.people.webapp.listener.UserCounterListener=WARN\n\
  log4j.logger.com.relevanalyticsc.people.util=WARN\n```\n\n`com.relevanalyticsc.people`\
  \ 包包含了我们的代码。我们设置为 `DEBUG`，是因为我们在开发应用程序时想要看到大量信息。`com.relevanalyticsc.people` 下的三个子包包含生成的代码，假设没有\
  \ bug。我们不希望被这些代码的详细日志消息淹没，所以日志级别大幅降低到 `WARN` 或 `ERROR`。我们是如何在 `WARN` 和 `ERROR` 之间选择的？在这种情况下我们并没有选择。当\
  \ AppFuse 创建应用程序骨架时，这些设置已经存在。\n\n### Joe 问 . . .\n\nJDK 1.4 日志呢？\n\n除了 `log4j` 包之外，Java\
  \ 程序员还可以访问一个官方的日志 API，它是被添加到 Java\n\n\n\n\n\n# Java 日志\n\n`JDK 1.4` 中的 SDK。这是一个罕见且尴尬的例子，社区选择了一个工具（`log4j`），而\
  \ Java 社区进程（`JCP`）却选择了另一个。糟糕的是，还有一个名为 `Commons Logging` 的元框架，它允许你针对通用 API 编写代码，然后接入\
  \ `log4j` 或 `JDK 1.4` 日志。日志记录并没有复杂到需要这种程度的间接层！\n\nJava 日志的故事是一个关于如何不写软件的有趣趣闻，但它对学习\
  \ Ruby 和 Rails 的任务没有任何帮助，所以我们不再提它了。\n\n这些设置的效果是，我们永远看不到来自这些包的消息。没有消息就是好消息，所以我们接受了这些设置并继续后续。\n\
  \n要记录一条消息，你需要一个 `logger` 对象。在 Java 中，你通常将 `logger` 实例化为类的一个静态成员：\n\n[下载 code/appfuse_people/src/web/com/relevancellc/people/webapp/action/BaseAction.java](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/src/web/com/relevancellc/people/webapp/action/BaseAction.java)\n\
  \n```java\nprotected final Log log = LogFactory.getLog(getClass());\n```\n\n然后只需在\
  \ `logger` 上调用方法。`Loggers` 为不同的日志级别拥有命名的方法，因此要记录调试消息，请使用以下代码：\n\n```java\nif (log.isDebugEnabled())\
  \ {\n    log.debug(\"Entering delete method\");\n}\n```\n\n调用 `log.isDebugEnabled`\
  \ 是一种性能优化。如果禁用了 `DEBUG` 级别的日志，那么对 `log.debug` 的调用将在不执行任何操作的情况下返回。我们仍然需要方法调用的开销（这很小）以及创建调试参数的开销（这可能是不容小眼的）。通过检查\
  \ `isDebugEnabled`，我们避免了对 `debug` 进行不必要的调用。\n\n# Rails 日志\n\nRails 对日志的支持比 `log4j`\
  \ 更简单、易用，但灵活性较差。在 Rails 中，你不需要配置 `logger`。`ActiveRecord` 和 `ActionControl` 的实例提供了一个\
  \ `logger` 方法，并带有预配置的 `logger`。`logger` 为不同日志级别拥有命名的方法，就像在 Java 中一样。要记录一条 `INFO`\
  \ 消息，执行以下操作：\n\n[下载 code/rails_xt/app/controllers/people_controller.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/controllers/people_controller.rb)\n\
  \n```ruby\ndef destroy\n  logger.info \"Entering destroy method\"\nend\n```\n\n\
  这足够简单，但你不会在 Rails 应用中经常看到那种日志。Rails 在其自身的日志语句中包含了大量的信息，这些信息通常足够充分，使得你不需要对 `logger`\
  \ 进行任何额外调用。以下是创建一个新人的时的日志输出：\n\n[下载 code/people/snippets/create_person.log](http://media.pragprog.com/titles/fr_r4j/code/code/people/snippets/create_person.log)\n\
  \n```text\nProcessingController#create (for 127.0.0.1 at 2006-10-30 11:58:17) [POST]\n\
  Session ID: 08ecf4526b2d1b38406396d58a538e02\nParameters: {\"commit\"=>\"Create\"\
  , \"action\"=>\"create\", \"controller\"=>\"people\", \"person\"=>{\"first_name\"\
  =>\"Jean\", \"last_name\"=>\"Dough\"}}\nPerson Columns (0.001395)\nSHOW FIELDS FROM\
  \ people\nSQL (0.000290)\nBEGIN\nSQL (0.273139)\nINSERT INTO people (‘first_name‘,\
  \ ‘last_name‘) VALUES('Jean', 'Dough')\nSQL (0.186078)\nCOMMIT\nRedirected to http://localhost:3000/people/list\n\
  Completed in 0.47041 (2 reqs/sec) | DB: 0.46090 (97%) | 302 Found [http://localhost/people/create]\n\
  ```\n\nRails 日志为每个请求提供以下信息：\n- URL、主机、时间和 HTTP 动词（第 1 行）\n- 用户会话 ID（第 2 行）\n- 请求参数，包括控制器和动作（第\
  \ 3 行）\n- 执行的 SQL 语句以及带有时间信息（第 5 行）\n- 渲染的模板或发出的重定向（第 10 行）\n- HTTP 响应码和处理请求的总时间（第\
  \ 11 行）\n\n默认情况下，Rails 日志输出 ANSI 控制序列，为支持的终端使日志行彩色。对于所有其他查看器，这些控制序列只是乱码，因此我们通常在\
  \ `environment.rb` 中关闭它们：\n\n[下载 code/people/config/environment.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/config/environment.rb)\n\
  \n```ruby\nActiveRecord::Base.colorize_logging = false\n```\n\nRails 的日志级别名称与 `log4j`\
  \ 的默认值几乎相同：`DEBUG`、`INFO`、`WARN`、`ERROR` 和 `FATAL`。（没有 `TRACE`。）这些级别来自 `Logger`\
  \ 类。这些级别在 `environment.rb` 中设置，例如，在开发环境使用 `DEBUG`，在测试环境使用 `INFO`，而在生产环境中使用 `WARN`：\n\
  \n[下载 code/people/config/environment.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/config/environment.rb)\n\
  \n```ruby\nconfig.log_level = :debug\n```\n\n默认情况下，Rails 日志是“干净”的——它显示了你可能习惯的消息。然而，`Logger`\
  \ 类提供了一个你可以覆盖的 `format_message`。我们将通过子类 `Logger` 并提供自己的 `format_message` 来克服这个问题：\n\
  \n```ruby\nclass BetterLogger < Logger\n  Format = \"[%s#%d] %s\\n\"\n  def format_message(severity,\
  \ timestamp, progname)\n    Format % [timestamp, progname, msg]\n  end\nend\n```\n\
  \n为了让 `BetterLogger` 默认化，我们必须在 `environment.rb` 中添加一行。我们将设置 `progname` 以出现在日志中：\n\
  \n[下载 code/rails_xt/config/environment.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/config/environment.rb)\n\
  \n```ruby\nconfig.logger = BetterLogger.new \"#{RAILS_ROOT}/log/#{RAILS_ENV}.log\"\
  \nconfig.logger.progname = 'rails_xt'\n```\n\nRails 日志具有一些块的特性。而不是向日志方法传递字符串，你可以传递一个块。运行块的结果将是要记录的消息。与其使用以下代码：\n\
  \n```ruby\n# 糟糕的 Ruby 风格！\nif logger.info?\n  logger.info expensive_message\nend\n\
  ```\n\n你可以简单地说：\n\n```ruby\nlogger.info {expensive_message}\n```\n\n块的语义保证 `expensive_message`\
  \ 只在 `INFO` 级别启用时才会求值。例如，此日志调用在 `DEBUG` 日志启用的情况下避免了对 `inspect` 的调用：\n\n[下载 code/rails_xt/app/controllers/people_controller.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/controllers/people_controller.rb)\n\
  \n```ruby\ndef edit\n  @person = Person.find(params[:id])\n  logger.debug {\"Found\
  \ person #{@person.inspect}\" }\nend\n```\n\n在几个地方，Rails 使用 `silence` 惯用法在块期间调整日志级别。当调用\
  \ `silence` 时，日志级别会被提高（通常提高到 `ERROR`），从而抑制日志消息。Rails 利用此来隐藏日志中的无关细节。例如，`ActiveRecord`\
  \ 会话存储实现静默了日志，以便你的日志显示领域对象的 `ActiveRecord` 消息，而不是会话对象的：\n\n[下载 code/rails/actionpack/lib/action_controller/session/active_record_store.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails/actionpack/lib/action_controller/session/active_record_store.rb)\n\
  \n```ruby\ndef update\n  if @session\n    ActiveRecord::Base.silence { @session.save\
  \ }\n  end\nend\n```\n\nRails 默认日志远不如 `log4j` 的地方在于它支持各种 appender（日志消息目的地）。幸运的是，\n\
  \n\n\n\n有一个名为 `log4r` 的项目，灵感来自 `log4j`。如果你需要比我们展示的更强大的日志功能，可以轻松地切换到 `log4r`。由于 Ruby\
  \ 的鸭子类型（duck typing），你不需要像 Java 的 `Commons Logging` 那样的适配器层。\n\n## 基准测试\n\nRails\
  \ 包含了三个帮助测试应用程序性能的工具：`script/performance/benchmarker`、`script/performance/profiler`\
  \ 以及控制器方法 `benchmark`。为了测试它们的性能，请考虑以下问题：Rails 的 `XT` 应用能够实现每秒处理 5,000 次登录吗？\n\n\
  `benchmarker` 命令测量在应用程序环境中运行的某些 Ruby 代码的耗用时间。我们没有发现示例应用中存在任何主要的性能问题，但我们知道安全函数通常很慢。让我们尝试在\
  \ Rails `XT` 应用中验证 `user2`：\n\n```\n$ script/performance/benchmarker 'User.authenticate(\"\
  quentin\",\"test\")'\n```\n```\nuser\nsystem\ntotal\nreal\n#1\n0.010000\n0.000000\n\
  0.010000 (\n0.000836)\n```\n这些数字（以秒为单位）非常小，所以让我们尝试连续运行五十次基准测试：\n\n```\n$ script/performance/benchmarker\
  \ 50 'User.authenticate(\"quentin\",\"test\")'\n```\n```\nuser\nsystem\ntotal\n\
  real\n#1\n0.020000\n0.010000\n0.030000 (\n0.090123)\n```\n看来我们的系统在每秒内验证比多五十个用户完全没有问题。对于许多应用程序来说，这已经足够了。\n\
  \n但我们提出的目标要高得多：我们希望在一秒内验证 5,000 个用户。此外，`benchmarker` 只测量了 API 调用，而没有测量在关键方法调用之前之后\
  \ Web 栈的执行过程。我们应该添加更多的 Web 服务器、尝试优化 `authenticate` 方法、使用一些原生代码，还是放弃基于 Ruby 的方法？\n\
  \n为了回答这些问题，我们需要知道 `User.authenticate` 将时间消耗在了哪里。进入性能分析器（profiler）。分析器会对代码进行插桩，告诉我们\
  \ `authenticate` 调用了哪些方法以及在每个方法上花费的相对时间：\n\n```\n$ script/performance/profiler 'User.authenticate(\"\
  quentin\",\"test\")' 50\n```\n```\nLoading Rails...\nUsing the standard Ruby profiler.\n\
  %\ncumulative\nself\nself\ntotal\ntime\nseconds\nseconds calls ms/call ms/call\n\
  name\n5.78\n0.10\n0.10\n51\n1.96\n29.41\nActiveRecord::Base#method_missing\n5.20\n\
  0.19\n0.09\n1229\n0.07\n0.10\nHash#[]\n5.20\n0.28\n0.09\n354\n0.25\n0.25\nKernel.==\n\
  4.62\n0.36\n0.08\n50\n1.60\n12.00\nActiveRecord::Base#find_every\n4.62\n0.44\n0.08\n\
  21\n3.81\n4.29\nGem::GemPathSearcher#matching_file\n4.62\n0.52\n0.08\n50\n1.60\n\
  4.00\nEnumerable.each_with_index\n4.62\n0.60\n0.08\n50\n1.60\n14.00\nActiveSupport::Deprecation.silence\n\
  4.62\n0.68\n0.08\n77\n1.04\n2.21\nClass#new\n4.05\n0.75\n0.07\n50\n1.40\n5.40\n\
  ActiveRecord::Base#construct_condi...\n4.05\n0.82\n0.07\n200\n0.35\n0.35\nActiveRecord::Base#current_scoped_...\n\
  ... 还有约 100 行重要性降低的行 ...\n```\n\n2. 我们在这里使用的安全 API 在第 282 页的第 10 章“安全”中进行了详细讨论。`quentin/test`\
  \ 组合来自我们的固件数据（fixture data）。注意这里的几点：\n\n*   在分析器下，一切操作的时间都比基准测试长得多。这不是一个问题；它仅仅表明了性能分析的开销。（作为一个经验法则，`benchmarker`\
  \ 提供有用的绝对数值，而 `profiler` 提供有用的相对数值。）\n*   没有一个占据大部分耗用时间的“真罪祸首”级方法。如果我们开始优化 Ruby\
  \ 代码，甚至为某些方法切换到原生代码，我们预期的是百分比级的改进，而不是数量级的改进。\n*   我们看到 `Class.new` 和 `Gem::GemPathSearcher#matching_file`，让我们怀疑我们看到的启动成本并不能应用程序的长期运行行为。\n\
  \n鉴于最后一点，让我们再次运行分析器，但是 500 次迭代而不是 50 次：\n\n```\n$ script/performance/profiler 'User.authenticate(\"\
  quentin\",\"test\")' 500\n```\n```\nLoading Rails...\nUsing the standard Ruby profiler.\n\
  %\ncumulative\nself\nself\ntotal\ntime\nseconds\nseconds calls ms/call ms/call\n\
  name\n5.78\n0.10\n0.10\n51\n1.96\n29.41\nActiveRecord::Base#method_missing\n5.20\n\
  0.19\n0.09\n1229\n0.07\n0.10\nHash#[]\n5.20\n0.28\n0.09\n354\n0.25\n0.25\nKernel.==\n\
  4.62\n0.36\n0.08\n50\n1.60\n12.00\nActiveRecord::Base#find_every\n4.62\n0.44\n0.08\n\
  21\n3.81\n4.29\nGem::GemPathSearcher#matching_file\n4.62\n0.52\n0.08\n50\n1.60\n\
  4.00\nEnumerable.each_with_index\n4.62\n0.60\n0.08\n50\n1.60\n14.00\nActiveSupport::Deprecation.silence\n\
  4.62\n0.68\n0.08\n77\n1.04\n2.21\nClass#new\n4.05\n0.75\n0.07\n50\n1.40\n5.40\n\
  ActiveRecord::Base#construct_condi...\n4.05\n0.82\n0.07\n200\n0.35\n0.35\nActiveRecord::Base#current_scoped_...\n\
  ```\n\n在实践中，这通常是不必要的。Rails 已经对各种活动进行了基。最重要的是，Rails 同时测量了处理请求的总时间以及在数据库上花费的时间。\n\n\
  如果我们相信应用程序可以线性扩展（这是一种理想状态），那么我们就有公式：`M = 5000 / R`\n\n在这个方程中，`R` 是单台机器每秒的请求数，而 `M`\
  \ 是我们需要的 Web 层机器数量。让我们切换到生产模式并运行生产服务器（Mongrel）。我们将使用示例数据加载生产数据库。\n\n```\nRAILS_ENV=production\
  \ rake db:migrate\nRAILS_ENV=production rake db:fixtures:load\nRAILS_ENV=production\
  \ mongrel_rails\n```\n在生产数据库数据上执行这些操作时，请务必小心！\n\n现在，我们可以通过 Web 界面登录，然后在 Rails 日志中查看性能数据。我们在开发环境中看到的是：\n\
  \n\n\n笔记本电脑 (2.16GHz MacBook Pro, 2GB RAM，后台运行着各种开发者程序)：\n\n```\nProcessing `AccountController#login`\
  \ (for 127.0.0.1 at 2006-10-31 13:05:04) [POST]\nSession ID: 80dcc7858d5fcef6385f50a0e90e9f94\n\
  Parameters: {\"commit\"=>\"Log in\", \"action\"=>\"login\", \"controller\"=>\"account\"\
  , \"login\"=>\"quentin\", \"password\"=>\"[FILTERED]\"}\nRedirected to http://localhost:3000/quips\n\
  Completed in 0.00262 (381 reqs/sec) | DB: 0.00038 (14%)\n| 302 Found [http://localhost/login]\n\
  ```\n\n有两个数字非常显眼。首先是每秒 381 次请求。如果这是我们能做到的极限，那么我们需要 `5000/381`，即大约 14 台 Web 服务器才能允许每秒\
  \ 5,000 次登录。其次，数据库（`DB`）占时间的比例很低，仅为 14%。注意，14% 并不能告诉我们 `MySQL` 进程负载有多大，只能告诉我们等了多久。这表明，我们至少可以有五到六台\
  \ Web 服务器同时访问数据库，而不会损失吞吐量，而且可能更多。\n\n我们还没有见过前端有多达十四台 Web 服务器的 Rails 部署，因此我们不会轻率地假设那里没有潜伏的问题。但我们见过前端有四台甚至八台\
  \ Web 服务器的 Rails 部署。考虑到这里展示的数字，你敢打赌用八台 Web 服务器就能处理每秒 5,000 次登录吗？这个简单的练习已经让我们非常接近这个数量级，而且我们还未进行任何优化。我们坚信这是可能的。\n\
  \n这与 Java 的性能分析（profiling）方案相比如何？如果性能分析是你主要的关注点，那么 Java 完胜 Ruby。Java 拥有更多、更好的性能分析工具。商业和开源选项都有。由于\
  \ Java 平台包含一个带有记录的性能分析钩子（hooks）的虚拟机规范，它不仅在实践上胜过 Ruby 性能分析，在概念也是如此。\n\n尽管如此，我们在编写\
  \ Ruby 和 Rails 应用时，并没有怀念 Java 那些酷的性能分析器。我们在 Java 中很少使用它们，在 Ruby 中也很少使用它们较差的替代品。根据我们的经验，大多数经过良好测试、结构良好的应用程序运行已经足够快了。当它们不够快时，解决方案通常只需要两个工具：对应用程序和日志文件的观察，以及一点纸笔推算。在三十多年的软件开发中，我们对开发过的几乎每一个应用程序都进行过某种形式的日志记录、调试和基准测试（BENCHMARKING）调优。在\
  \ 95% 的应用中，我们从未想过或需要性能分析器。\n\n## Debugging\n\n作为 Java 开发者，我们习惯为应用程序使用强大的 GUI 调试器。在\
  \ Ruby 中，调试的支持是非常原始的。我们尝试过一些开源和商业调试器。它们都太慢了，以至于我们从不启动它们。\n\n我们很少想念调试器，因为我们的开发方法使用各种不同的测试来捕捉程序错误。但“很少”并不等同于“从未”，如果能有一个良好的\
  \ Ruby GUI 调试器将不胜感激。\n\n在传说中的 GUI 调试器出现之前，你可以使用基于控制台的替代方案。Rails 包含一个基于 `ruby-breakpoint4`\
  \ 库的控制台调试器。要使用这个调试器，只需在代码的任何地方添加断点（breakpoint）语句。要查看断点的作用，请考虑这段错误的代码：\n\n```ruby\n\
  class Widget\n  attr_accessor :name\n\n  def initialize(value)\n    name = value\n\
  \  end\nend\n\nw = Widget.new('zipper')\nputs w.name\n```\n\n你可能期望这段代码打印“zipper”；然而，它打印的是“nil”——为了找出原因，我们在\
  \ `initialize` 的结尾添加一个断点：\n\n```ruby\ndef initialize(value)\n  name = value\n  breakpoint\n\
  end\n```\n\n当程序到达断点时，它会启动一个 `irb` 会话。你可以使用这个会话检查或修改程序值。我们将显示当前的 `instance_variables`，让你看到我们的\
  \ `name` 发生了什么：\n\n```\n$ ruby samples/debug_me.rb\nExecuting break point at samples/debug_me.rb:19\
  \ in ‘initialize'\nirb(#<Widget:0x2a8c2d8>):001:0> instance_variables\n=> [\"@__bp_file\"\
  , \"@__bp_line\"]\n```\n\n以 `@__bp` 前缀的变量是断点库内部使用的，与我们无关。更重要的是，没有 `@name` 变量。下一步要查看\
  \ `local_variables`：\n\n```\nirb(#<Widget:0x2a8c2d8>):002:0> local_variables\n=>\
  \ [\"value\", \"name\", \"_\"]\nirb(#<Widget:0x2a8c2d8>):003:0> value\n=> \"zipper\"\
  \n```\n\n破案！Ruby 将 `name` 视为一个局部变量。Ruby 将我们的 `name=` 理解为“设置局部变量 name”，而我们错误地期望它意为“调用\
  \ name= 方法”。现在我们理解了问题，可以通过输入 `exit`（所有平台）、`Ctrl-D`（Unix）或 `Ctrl-Z`（Windows）跳过断点继续。然后，我们将修正代码使用\
  \ `self.name=` 来避免歧义：\n\n```ruby\ndef initialize(value)\n  self.name = value\nend\n\
  ```\n\n\n\n\n这是系列从实现角度描述 Rails 路由的文章中的第一篇。路由本身已经非常灵活了；掌握了这些信息，你可以按照自己喜欢的方式对其进行扩展。\n\
  \n### 使用 memcached 进行 Ruby on Rails 的会话存储\n. . . [`railsexpress.de/blog/articles/2006/01/24/using-memcached-for-ruby-on-rails-session-storage`](http://railsexpress.de/blog/articles/2006/01/24/using-memcached-for-ruby-on-rails-session-storage)\n\
  \n这是 Stefan Kaes 使用 `memcached` 的测试结果。Stefan 定期会在他的博客上更新新的测试结果，因此除了本文外，请确保也阅读了他最近的文章。\n\
  \n# 第 6 章：使用 ActionView 渲染输出\n\n`ActionView` 是 Rails MVC 模式中的视图层。`ActionView` 接收控制器创建的对象并渲染输出，通常是\
  \ HTML 或 XML 格式。`ActionView` 在一个名为 `ActionPack` 的 Ruby gem 中与 `ActionController`\
  \ 封装在一起，而该 gem 被包含在 Rails 中。与 `ActiveRecord` 一起，`ActionView` 和 `ActionController`\
  \ 成了 Rails 的核心。\n\n虽然可以从控制器直接渲染内容，但几乎 100% 的 Rails 应用都使用了 `ActionView`。`ActionView`\
  \ 通过插件化的模板机制支持多种渲染方法。`ActionView` 自带三种风格的模板：\n\n- **嵌入式 Ruby (ERb) 模板**：存储在 `.rhtml`\
  \ 文件中，混合标记和嵌入式 Ruby 来构建动态内容。\n- **Builder 模板**：存储为 `.rxml` 文件，使用纯 Ruby 构建 XML 输出。\n\
  - **JavaScript 模板**：存储在 `.rjs` 文件中，使用 Ruby API 构建 JavaScript 输出。\n\n添加新的模板类型非常容易，无论是自定义的还是来自第三方的。为了演示这一点，我们还将查看\
  \ `Markaby`，这是一个使用纯 Ruby 渲染 HTML 的第三方 gem。\n\nJava Web 应用采用了多种技术来编写动态视图代码：内联 Java、标签库、`JSTL`\
  \ 表达式语言以及“对象图表示语言（Object Graph Notation Language）”。在 `ActionView` 中，这些角色大部分由以辅助方法（helpers）形式存在的普通\
  \ Ruby 代码来承担。像标签库一样，Rails 辅助方法减少了视图中的代码量。然而，Rails 辅助方法并没有试图隐藏它们的 Ruby 特性。\n\n##\
  \ 创建基础的 .rhtml 文件\n\nRails 以其 `Ajax` 支持而闻名。在有限的篇幅内，我们只能开始介绍 `Ajax` API，并使用各种 API\
  \ 的部分示例来演示核心概念。我们还涵盖了使用 `Selenium` 进行验收测试。`Selenium` 并不是 Rails 的一部分，甚至不是 Rails 特有的，但它在确保质量方面有着重要作用。`Selenium`\
  \ 允许你在浏览器中编写、录制、逐步执行和回放测试，从而运行整个应用程序。\n\n### 6.1 创建基础的 .rhtml 文件\n\n在 Java Web 应用中，JavaServer\
  \ Pages (`JSPs`) 是基础页面渲染的规范。`JSPs` 包含了静态内容以及动态代码块。若要在 JSP 中执行代码，请将其放在 `<% %>` 内部。若要执行\
  \ Java 代码并将结果写入页面，请使用 `<%= %>`。这是一个“Hello, World”页面，它包含了你的名字（如果查询字符串中有该参数的话）：\n\n\
  [下载 code/java_xt/snippets/hello.jsp](http://media.pragprog.com/titles/fr_r4j/code/code/java_xt/snippets/hello.jsp)\n\
  \n```html\n<h1>Hello</h1>\n<% if request.getParameter('name' ) %>\n  Welcome, <%=\
  \ request.getParameter('name' ) %>\n<% end %>\n```\n\n在 `ActionView` 中，JSP 的角色由\
  \ `.rhtml` 文件承担。Rails 使用嵌入式 Ruby (`ERb`) 评估 `.rhtml` 文件，`ERb` 是 Ruby 标准库的一部分模板库。如果你熟悉\
  \ JSP 语法，`ERb` 看起来会很熟悉：\n\n[下载 code/people/app/views/people/hello.rhtml](http://media.pragprog.com/titles/fr_r4j/code/code/people/app/views/people/hello.rhtml)\n\
  \n```html\n<h1>Hello</h1>\n<% unless request.params['name'].blank? %>\n  Welcome,\
  \ <%= request.params['name'] %>\n<% end %>\n```\n\n在 JSP 和 `ActionView` 中，视图代码都可以访问控制器所看到的同一个\
  \ Web 对象模型：`request`（如前面的示例所示）、`response`、`session` 等。因此，在视图模板内部构建整个应用程序是可能的。但不要这样做。在\
  \ JSP 和 Rails 中，在视图中进行大量的代码编写都是**坏事（Bad Thing）**。HTML 标记与模板代码的结合难以阅读、测试和维护。视图层中唯一的代码应该是专门用于输出格式的代码。\n\
  \n## 通过视图辅助方法减少视图代码\n\nJSP 和 `ActionView` 都有减少视图模板“代码化”程度的机制。在 JSP 中，有声明和标签库。`ActionView`\
  \ 提供了辅助方法（helpers）、布局（layouts）和部分模板（partials）。\n\n### 6.2 使用视图辅助方法减少视图代码\n\n与其在\
  \ JSP 中直接编写 Java 代码，许多许多 Java 程序员更倾向于使用标签库。标签库是由标签库 Java 代码支持的自定义标记。创建标签库需要多一些工作：你必须在\
  \ Java 中实现代码，创建标签库描述符（TLD），然后配置页面（或 Web 应用）使该标签库可用。其优点是视图中的语法整洁。与其混合标记和 Java 代码，你可以拥有纯标记。\n\
  \n最常用的标签库之一是 `JSTL` 核心库，它包含了用于流程控制和输出的标签。使用这些标签，JSP “Hello, World”示例如下：\n\n[下载 code/appfuse_people/web/hello.jsp](http://media.pragprog.com/titles/fr_r4j/code/appfuse_people/web/hello.jsp)\n\
  \n```jsp\n<%@ taglib uri=\"http://java.sun.com/jstl/core\" prefix=\"c\" %>\n<h1>Hello</h1>\n\
  <c:if test=\"not empty request.name\" >\n  Welcome, <c:out value=\"request.name\"\
  \ />\n</c:if>\n```\n\n所有的 Java 代码都被标签取代了。`c:if` 标签替换了 `if` 语句，`c:out` 标签替换了 JSP\
  \ 表达式。这有两个目标：首先，标签比 Java 代码更易于阅读视图代码的页面设计师。其次，标签允许不需要解析 Java（或理解 Java 堆栈跟踪）的情况下进行验证。缺点是学习两种语法：自定义标签词汇以及例如在\
  \ `c:if` test 属性中创建布尔表达式的表达式语言。\n\n## 编写自定义辅助方法\n\n内置的 ActionView 辅助方法非常有用，但无法涵盖所有情况。因此，Rails\
  \ 为你自己的辅助方法提供了一个标准位置。`app/helpers` 目录包含应用程序中每个控制器的辅助文件。当你使用 `script/generate` 创建控制器\
  \ `FooController` 时，Rails 也会创建一个辅助文件 `app/helpers/foo_helper.rb`。这段代码会自动包含在 `Foo`\
  \ 的所有视图中。\n\n由于 Rails 包含了许多内置辅助方法，简单的 Web 应用可能不需要许多（或任何）自定义辅助方法。你会知道何时以及是否需要它们。当你看到视图多处重复了相同的代码时，就是时候编写辅助方法了。\n\
  \n作为一个简单的例子，想象 Rails 应用的用户希望对格言妙语（quips）设置一个礼貌过滤器。他们的具体要求是，当礼貌过滤器开启时，四个字母的单词应该渲染为\
  \ !@#$ 我们作为一个辅助方法在 `QuipsHelper` 中添加此功能：\n\n\n\n\n\n[下载 code/rails_xt/app/helpers/quips_helper.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/helpers/quips_helper.rb)\n\
  \n```ruby\nmodule QuipsHelper\n  # See http://en.wikipedia.org/wiki/Bowdler\n\n\
  \  def bowdlerize_four_lettered(str)\n    h(str.to_s.gsub(/\\b\\w{4}\\b/, '!@#$'\
  \ ))\n  end\n\n  alias_method :bfl, :bowdlerize_four_lettered\nend\n```\n\n这个实现可能比预想的要字面一点点，但我们喜欢按照规范编写代码。我们自动进行\
  \ HTML 转义（使用 `h` 方法），因为我们很偷懒，不想在所有视图中都同时调用 `h` 和 `bfl`。我们为这个方法起了一个有意义的名字和一个短别名。这在我们希望拥有自文档化名称的愿望与该特定方法可能会被频繁使用的事实之间取得了良好的平衡。有了这个\
  \ helper，quips 的显示视图可以像这样简单：\n\n[下载 code/rails_xt/app/views/quips/filtered_show.rhtml](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/views/quips/filtered_show.rhtml)\n\
  \n```html\n<% for column in Quip.content_columns %>\n  <p>\n    <b><%= column.human_name\
  \ %>:</b> <%= bfl @quip.send(column.name) %>\n  </p>\n<% end %>\n\n<%= link_to 'Edit',\
  \ :action => 'edit', :id => @quip %> |\n<%= link_to 'Back', :action => 'list' %>\n\
  ```\n\n![Image 46](img/index-171_1.png)\n\n# 编写自定义 helper\n171\n\nJoe 问. . .\n\n\
  ## 如何测试自定义 helper？\n\nRails 会自动为模型代码创建 `test/unit`，为控制器代码创建 `test/functional`。对于\
  \ helper 代码，并没有没有对应的 `test/helper`。不要让这困扰你；自己创建自己的即可。这里有一个可以添加到 `lib/tasks` 中的 Rake\
  \ 任务用于管理 helper 测试：\n\n[下载 code/rails_xt/lib/tasks/test_helpers.rake](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/lib/tasks/test_helpers.rake)\n\
  \n```ruby\nnamespace :test do\n  desc \"Run the helper tests in test/helpers\"\n\
  \  Rake::TestTask.new(:helpers => [ :prepare_test_database ]) do |t|\n    t.libs\
  \ << \"test\"\n    t.pattern = 'test/helpers/**/*_test.rb'\n    t.verbose = true\n\
  \  end\nend\ntask :default => [ 'test:helpers' ]\n```\n\n这里是正文中 `bfl` 方法的一个测试示例。注意，我们\
  \ stub 了任何所需的 Rails helper（如 `h`），以便将测试与 Rails 解耦。\n\n[下载 code/rails_xt/test/helpers/quips_helper_test.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/test/helpers/quips_helper_test.rb)\n\
  \n```ruby\nrequire File.dirname(__FILE__) + '/../test_helper'\nrequire 'quips_helper'\n\
  \nclass QuipsHelperTest < Test::Unit::TestCase\n  include QuipsHelper\n\n  # 手制的\
  \ stub 方法\n  def h(s); s; end\n\n  def test_bfl\n    assert_equal 'safely sized\
  \ words' , bfl('safely sized words' )\n    assert_equal '!@#$ and !@#$' , bfl('darn\
  \ and drat' )\n  end\nend\n```\n\n# 使用布局和部分进行复用\n172\n\n## 6.4 使用布局和部分进行复用\n\n视图模板通常需要共享代码。在\
  \ JSP 中，你可以将共同代码移动到单独的 `.jsp` 文件中然后使用 include 指令。include 指令通常组合页面的关键元素，例如页眉、页脚、菜单、状态消息和内容。例如，这里是\
  \ Struts 示例应用程序中的一个 JSP 页面，经过编辑只显示基本的页面结构：\n\n```html\n<div id=\"page\" >\n  <div\
  \ id=\"header\" class=\"clearfix\" >\n    <jsp:include page=\"/common/header.jsp\"\
  \ />\n  </div>\n  <div id=\"content\" class=\"clearfix\" >\n    <div id=\"main\"\
  \ >\n      <jsp:include page=\"/common/messages.jsp\" %>\n      <!-- 此处为主内容！ -->\n\
  \    </div>\n    <div id=\"nav\" >\n      <div class=\"wrapper\" >\n        <jsp:include\
  \ page=\"/WEB-INF/pages/menu.jsp\" />\n      </div>\n    </div>\n  </div>\n  <div\
  \ id=\"footer\" class=\"clearfix\" >\n    <jsp:include page=\"/common/footer.jsp\"\
  \ />\n  </div>\n</div>\n```\n\n`jsp:include` 标签拉取了页眉、消息、导航和页脚。你你可以在多个页面中复用这些 JSP\
  \ 片段。ActionView 执行了类似的操作。实际上是两件事：布局（layouts）和部分（partials）。布局是一个在页面主部分内容周围自动渲染的模板。部分是从另一个模板中显式调用的模板。页面会自动使用布局，如果可用的话。\n\
  \n默认情况下，布局是 `app/views/layouts/application.html`。如果没有特定控制器的布局，ActionView 将使用 `app/views/layouts/application.html`。上面示例中的\
  \ `jsp:include` 标签演示了 Rails 中的布局和部分：\n\n[下载 code/rails_xt/app/views/layouts/application.html](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/views/layouts/application.html)\n\
  \n```html\n<html>\n<head>\n  <title><%= page_title %></title>\n  <%= stylesheet_link_tag\
  \ 'scaffold' %>\n</head>\n<body>\n  <%= include_partial 'header' %>\n  <%= yield\
  \ %>\n  <%= include_partial 'footer' %>\n</body>\n</html>\n```\n\n\n\n\n\n以下是用于渲染人员姓和和名输入元素的\
  \ Struts 代码：\n\n[下载 code/appfuse_people/web/pages/personForm.jsp](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/web/pages/personForm.jsp)\n\
  \n```html\n<li\n  <label for=\"firstName\" class=\"desc\" >First Name </label>\n\
  \  <html:errors property=\"firstName\" />\n  <html:text property=\"firstName\" styleId=\"\
  firstName\" styleClass=\"text medium\" />\n</li>\n\n<li\n  <label for=\"lastName\"\
  \ class=\"desc\" >Last Name </label>\n  <html:errors property=\"lastName\" />\n\
  \  <html:text property=\"lastName\" styleId=\"lastName\" styleClass=\"text medium\"\
  \ />\n</li\n```\n\n你应该注意这里的几点。首先，自定义标签与原生 HTML 之间存在无缝的切换。`label` 标签是 HTML，但带有 `html-`\
  \ 前缀的标签调用了自定义代码。`html:errors` 标签根据具名的表单属性查找错误消息。`html:text` 标签生成一个 HTML 的 `type=\"\
  text\"`。`styleId` 和 `styleClass` 属性在生成的输入元素上变为 `id` 和 `class` 属性。\n\n用于编辑人员属性的 Rails\
  \ scaffold 代码位于 `app/views/people/_form.rhtml`：\n\n构建 HTML 表单\n175\n\n[下载 code/people/app/views/people/_form.rhtml](http://media.pragprog.com/titles/fr_r4j/code/code/people/app/views/people/_form.rhtml)\n\
  \n```html\n<p><label for=\"person_first_name\" >First name</label><br/>\n<%= text_field\
  \ 'person', 'first_name' %><%= error_message_on 'person', 'first_name' %></p>\n\n\
  <p><label for=\"person_last_name\" >Last name</label><br/>\n<%= text_field 'person',\
  \ 'last_name' %><%= error_message_on 'person', 'last_name' %></p>\n```\n\nStruts\
  \ 版本使用了页面构建标签，而 Rails 版本使用了内置的表单助手。`error_message_on` 方法输出验证错误。`text_field` 方法在这里接收两个参数。Rails\
  \ 结合这两个参数来创建一个参数名，因此 `text_field 'person', 'first_name'` 变成一个名为 `person[first_name]`\
  \ 的参数。当参数提交到服务器时，Rails 会自动将这种方式命参数转换为哈。这非常方便，因为 `ActiveRecord` 构造函数接受一个哈参数。\n\n\
  Struts 表单验证有两个 Rails 不具备的功能：\n- 可以使用客户端 JavaScript 验证。\n- 错误消息是国际化的。\n\n如果你在 Rails\
  \ 应用中需要这些功能，你将需要找到插件或自己编写一个。我们发现 Rails 在其他方面的优势超过了这些缺陷，但在估算项目开发工作时，意识到这些点是非常重要的。Rails\
  \ 包含了适用于每种 HTML 表单输入的表单助手方法。以下是一些表单助手的示例：\n\n[下载 code/rails_xt/app/views/examples/forms.rhtml](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/views/examples/forms.rhtml)\n\
  \n## 绑定到查询参数的表单字段\n\n```html\n<%= start_form_tag %>\n<table>\n  <tr>\n    <td><label\
  \ for=\"sample_text\" >Text</label></td>\n    <td><%= text_field :sample, :text\
  \ %></td>\n  </tr>\n  <tr>\n    <td><label for=\"sample_password\" >Passsword</label></td>\n\
  \    <td><%= password_field :sample, :password, {:style=>'color:blue;'} %></td>\n\
  \  </tr>\n  <tr>\n    <td><label for=\"sample_area\" >Text Area</label></td>\n \
  \   <td><%= text_area :sample, :area, {:size=>'10x10'} %></td>\n  </tr>\n</table>\n\
  <%= end_form_tag %>\n```\n\n构建 HTML 表单\n176\n\n在第 6 行，你看到了表单标签助手的双参数版本。第一个参数是实例变量名，第二个参数是该实例上存取访问器（accessor）的名称。Rails\
  \ 将从实例变量中填充初始值，并将查询字符串参数转换为一个与实例变量同名的哈。在第 10 行，你看到了三参数版本。第三个参数是一个转换为标签上属性的哈。在这里我们设置了\
  \ CSS 样式。\n\n在第 14 行，你看到了另一个三参数助手。然而这次第三个参数不是 HTML 属性。参数是 `size=>’10x10’，但一个标准的\
  \ `textarea` 期望 `rows` 和 `cols`。在这里 Rails 提供了一个快捷方式。如果你愿意，可以指定单独 `rows` 和 `cols`，但\
  \ Rails 对 `text_area_tag` 的选项进行了特殊处理，将 `size` 参数转换为 `rows` 和 `cols`。在你编写视图代码时，留意这些可以简化常用任务的助手。\n\
  \nRails 表单助手是感知验证的。如果模型对象有验证错误，Rails 表单助手会将无效数据的表单标签放在 `<div class=\"fieldWithErrors\"\
  >` 内部。你可以使用 CSS 样式来关注错误。HTML 生成的重复性表明我们应该使用自定义表单构建器。\n\n### 自定义表单构建器实现\n\n```ruby\n\
  class TabularFormBuilder < ActionView::Helpers::FormBuilder\n  (field_helpers -\
  \ %w(hidden_field)).each do |selector|\n    src = <<-END_SRC\n  def #{selector}(field,\
  \ *args, &proc)\n    \"<tr>\" +\n    \"<td><label for='#{field}'>#{field.to_s.humanize}:</label></td>\"\
  \ +\n    \"<td>\" + super + \"</td>\" +\n    \"</tr>\"\n  end\nEND_SRC\n    class_eval\
  \ src, __FILE__, __LINE__\n  end\n\n  def submit_tag(value)\n    \"<tr>\" +\n  \
  \  \"<td>&nbsp;</</td>\" +\n    \"<td><input name='commit' type='submit' value='#{value}'/></td>\"\
  \ +\n    \"</tr>\"\n  end\nend\n```\n\n为了使用我们的自定义表单构建器，我们需要为 `form_for` 的第三参数传递一个命名选项。我们将通过名为\
  \ `tabular_form_for` 的新助手方法捕捉它：\n\n```ruby\nrequire 'tabular_form_builder'\n\nmodule\
  \ ApplicationHelper\n  def tabular_form_for(name, object, options, &proc)\n    concat(\"\
  <table>\", proc.binding)\n    form_for(name, object, options.merge(:builder => TabularFormBuilder),\
  \ &proc)\n    concat(\"</table>\", proc.binding)\n  end\nend\n```\n\n\n\n\n对 `concat`\
  \ 的调用是 ERb 版本的 `puts`，而 `form_for` 的调用将 `:builder` 设置为我们的 `TabularFormBuilder`。\n\
  \n# 使用 Markaby 构建 HTML\n\n使用 `TabularFormBuilder`，我们的表单代码简化为如下形式：\n\n[下载 code/rails_xt/app/views/examples/tabular_form_for.rhtml](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/views/examples/tabular_form_for.rhtml)\n\
  \n## 表格表单 (Tabular Form)\n\n```html\n<% form_for :sample, @sample do |f| %>\n\n\
  <%= f.text_field :text %>\n\n<%= f.password_field :password, {:style=>'color:blue;'}\
  \ %>\n\n<%= f.text_area :area, {:size=>'10x10'} %>\n\n<% end %>\n```\n\n可读性有了巨大的提升。尽管\
  \ `FormBuilder` 代码看起来很复杂，但你不需要从零开始。我们从 `FormBuilder` 基类中复制了 `src` 块并不断调整，直到结果满意。\n\
  \n有时你可能需要一个与模型对象关联的表单。`text_field` 等方法假设有一个关联的模型对象，但 Rails 还有另一组方法，它们不会将查询参数限制在特定对象上。你应该使用\
  \ `text_field_for` 而不是 `text_field`。对于所有其他表单输入类型，也存在命名相似的方法。\n\n### 6.6 使用 Markaby\
  \ 构建 HTML\n\n在 Java 世界中，`JSPs` 是 MVC Web 栈中最受争议的部分。`JSPs` 经常被鄙视，有时甚至被完全取代。我们可以花一整本书来讨论其中的原因，并比较各种替代方案。\n\
  \n但这里的底层动荡源于一个简单的事：视图层是程序员、交互设计师和图形设计师都必须共同工作的地方。这些群体有不同的目标、技能和工具。`JSP` 语法的存在，部分是因为\
  \ Java 语法对设计师来说是陌生的，且无法被纯 HTML 工具处理。但从那里开始，你会感觉到自己像在剥洋葱。`JSP` 标签库的存在是因为 `JSP` 太像\
  \ Java 了。像 `Velocity2` 这样的模板引擎的存在是因为 `JSP` 标签库太晦奥，它们需要新的 Java 代码来支持最简单的动态任务。`Tapestry3`\
  \ 组件隐藏在普通 HTML 标签的属性中，应该能够与 HTML 工具“和谐相处”。\n\n许多人发现这种创造性的混乱令人不安——为什么没有一种创建动态视图的正确方法？我们认为这种多样性是健康的，原因有两个：首先，它验证了模型、视图和控制器的分离。分离的目的是允许每一层都独立于其他层发生变化，而在实践中，这一目标在视图层实现的频率最高。其次，视图的多样性意味着竞争，它激发了新的创新。你可以通过视图技术的多样性和持续发展来判断\
  \ Java Web 世界是健康的。\n\nRails 也是如此。虽然大多数 Rails 程序确实使用内置的 `.rhtml` 模板，但有越来越多的少数人使用第三方模板库。在这里我们将向你展示这些库之一：`Markaby`。`Markaby`\
  \ 拥有纯 Ruby 语法，使得视图代码比 `.rhtml` 文件更简洁、更易读。如果你的视图代码由 Ruby 程序员开发和维护，`Markaby` 可能非常适合你。要将\
  \ `Markaby` 作为 Rails 插件安装，请使用：\n\n`script/plugin install http://code.whytheluckystiff.net/svn/markaby/trunk`\n\
  \n你也可以也可以作为 gem 安装 `Markaby`：`gem install markaby`。如果你作为 gem 安装 `Markaby`，则需要手动将\
  \ `Markaby` 注册为处理 `.mab` 扩展文件的模板处理器：\n\n[下载 code/rails_xt/config/environment.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/config/environment.rb)\n\
  \n```ruby\nrequire 'markaby'\nrequire 'markaby/rails'\n\nActionView::Base::register_template_handler('mab'\
  \ ,\nMarkaby::ActionViewTemplateHandler)\n```\n\n这是用 Markaby 编写的 Rails 脚手架布局：\n\n\
  [下载 code/rails_xt/app/views/layouts/astro.mab](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/views/layouts/astro.mab)\n\
  \n```ruby\nhtml do\n  head do\n    title action_name\n    stylesheet_link_tag 'scaffold'\n\
  \  end\n  body do\n    p flash[:notice], :style=>\"color: green\"\n    self << @content_for_layout\n\
  \  end\nend\n```\n\n- 第 1 行演示了如何生成元素。只需通过元素名调用，并为任何嵌套在元素内部的内容传递一个块。\n- 第 3 行显示了如何设置元素的内容，只需将其作为字符串传递。\n\
  - 第 4 行演示了如何调用 Rails 辅助方法。\n- 第 7 行显示了通过传递哈希来创建 HTML 属性。\n- 第 8 行演示了如何通过连接到 `self`\
  \ 来直接写入内容。为了演示更多 `Markaby` 的功能，这里有一个简单的模板：[下载 code/rails_xt/app/views/layouts/astro.mab](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/views/layouts/astro.mab)\n\
  \n```ruby\ndiv.planet! do\n  for column in content_columns\n    p column.name\n\
  \  end\n  link_to 'Edit', :action => 'edit', :id => @planet\n  link_to 'Back', :action\
  \ => 'list'\n```\n\n- 第 1 行演示了生成元素 ID。带感叹号的方法变成元素的 ID，因此 `div.planet!` 变成了 `<div\
  \ id=\"planet\">`。\n- 第 4 行显示了如何添加 CSS 类。有意义的方法变成 CSS 类，因此 `span.emphasis` 变成了 `<span\
  \ class=\"emphasis\">`。\n\n## 6.7 缓存页面、动作和片段\n\n概括来说，可以说 Java 世界缓存模型，而 Rails 世界缓存视图。由于\
  \ Java 中没有广泛使用的视图缓存机制，本节将仅涵盖 Rails，不与 Java 进行比较。\n\n缓存是一种性能优化，Rails 使得在开发过程的合适时机应用缓存。缓存应该在应用程序运行正常且有性能测量表明需要之后才进行。（我们构建的大多数\
  \ Rails 程序根本没有使用缓存。是的，它很容易添加，在很多情况下应用程序运行得更快。但在没有需求的情况下，我们不会编写它。）\n\n`ActionView`\
  \ 提供了三个缓存级别：页面、动作和片段。页面缓存缓存整个页面。开启页面缓存非常简单。在控制器中，列出要缓存的动作，如下：[下载 code/people/app/controllers/people_controller.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/app/controllers/people_controller.rb)\n\
  \n```ruby\ncaches_page :show, :edit\n```\n\n当 Rails 首次渲染页面缓存的动作时，它会将结果复制到公共目录。后续页面请求将不会遇到\
  \ Rails。由于页面现在公共目录下，它将像其他静态资源一样被返回。页面缓存的性能是。遗憾的是，页面缓存通常是不恰的。任何具有个人用户行为（如安全检查）、个人状态（会话）或随时间变化的页面都无法缓存。\n\
  \n如果你的应用程序需要安全检查等个人用户行为，可以使用缓存动作而不是缓存页面。语法几乎相同：\n\n\n\n\n\n`caches_action : :show,\
  \ :edit`\n\n当 Rails 第一次渲染缓存的 action 时，它会保存结果。Rails 并没有将页面保存在公共目录，而是将页面缓存在一个 Web\
  \ 服务器不可感知的位置（默认是 `tmp/cache`）。随后的请求会进入控制器层，在其中所有的 `before` 过滤器（如安全检查）都会执行。如果 `before`\
  \ 过滤器执行成功，Rails 将从缓存中渲染页面，而不再执行 action 代码。缓存 action 的性能提升远不如缓存页面，但它们保留了访问控制的完整性。\n\
  \n如果你的 Web 应用为不同的用户产生不同的内容，那么即使是 action 缓存也不可用。即使是像“已以‘Stu’身份登录 2 小时”这样简单的状态行也意味着每个用户的页面都是不同的，因此\
  \ action 缓存不可行。这时就需要片段缓存（fragment caching）。如果你能识别出页面某个通用且渲染缓慢的部分，它就是片段缓存的候选对象。\n\
  \n假设我们想要缓存控制器的 `show` action。这次，我们的页面布局包含了每个用户的数据，因此我们无法缓存整个 action。相反，在 `show.rhtml`\
  \ 中，我们可以将输出包裹在 `cache` `do...end:` 中：\n\n[下载 code/rails_xt/app/views/people/show.rhtml](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/views/people/show.rhtml)\n\
  \n```html\n<% cache :fragment=>'show' do %>\n\n<% for column in Person.content_columns\
  \ %>\n<p>\n<b><%= column.human_name %>:</b> <%=h @person.send(column.name) %>\n\
  </p>\n<% end %>\n\n<%= link_to 'Edit', :action => 'edit', :id => @person %> |\n\
  <%= link_to 'Back', :action => 'list' %>\n<% end %>\n```\n\n片段缓存与 action 缓存存放在一起，并使用相同的命名约定。这意味着可能会发生名称冲突。更重要的是，单个视图可能有多个片段需要缓存。因此，你应该始终通过向\
  \ `cache` do 传递一个键值对来为片段提供一个唯一的名称。Rails 解析名称/值对的方式类似于类似于 `url_for` 的参数。我们倾向于使用一个在应用程序路由中其他地方未被使用且能清晰指示片段的键名。因此，如之前所使用的，“fragment”是一个不错的名称。\n\
  \n当 Rails 第一次遇到 `cache` 方法时，它会渲染块内部的代码并将其保存在缓存中。随后的请求不会执行该块，因为 `cache` 会先检查缓存，如果存在则使用缓存的内容。\n\
  \n你已经看到了如何开启页面、action 和片段缓存。那是简单部分。困难的部分是确保在数据变化时使缓存项失效。有几种可能的方法：\n\n-   不要管它，让应用程序显示过时信息。这在大多数应用程序中可能都是一个坏主意。\n\
  -   从 Rails 外部清理缓存，使用后台进程删除缓存文件，也许可以定时执行。\n-   手动过期缓存项。每当控制器保存会导致缓存失效的修改时，显式地调用\
  \ `expire_page`、`expire_action` 或 `expire_fragment`。\n-   使用 Rails sweeper（观察者模式的一种形式）根据模型的变化使页面过期。\n\
  \n我们推荐使用 sweeper 方法，因为它将缓存与程序的其余逻辑清晰地分离开。以下是使用 sweepers 来管理我们在本节之前创建的各种缓存示例的方法。\n\
  \n首先，我们将处理 People 应用中 `PeopleController` 上的页面缓存。在 `models` 目录下，我们创建了一个 `PersonSweeper`：\n\
  \n[下载 code/people/app/models/person_sweeper.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/app/models/person_sweeper.rb)\n\
  \n```ruby\nclass PersonSweeper < ActionController::Caching::Sweeper\n  CACHED_ACTIONS\
  \ = ['show' , 'edit' ]\n\n  observe Person\n\n  def expire_cache_for_instance(inst)\n\
  \    CACHED_ACTIONS.each do |action|\n      expire_page(:controller=>'people' ,\
  \ :action=>action, :id=>inst) \n    end\n  end\nend\n```\n\n它的工作原理如下：\n\n1. 第 1\
  \ 行，`PersonSweeper` 类继承了 `ActionController::Caching::Sweeper`。\n2. 第 3 行，`observe`\
  \ 告诉 Rails 要观察哪个模型。\n3. 第 6 行，`expire_cache_for_instance` 会在 `show` 和 `edit` 时被调用。\n\
  4. 第 9 行，我们使用 `alias_method` 将 `after_save` 和 `after_destroy` 链接到 `expire_cache_for_instance`。\n\
  \n## 你测试缓存吗？\n\n由于 Rails 没有附带任何用于测试缓存的断言，许多 Rails 开发者可能会跳过这一步。损坏的缓存实现可能会返回错误数据并违反安全策略。Rails\
  \ Cache Test Plugin 让这一切变得简单。以下是针对 People 示例应用的简单测试：\n\n```ruby\nrequire \"#{File.dirname(__FILE__)}../test_helper\"\
  \n\nclass PersonCachingTest < ActionController::IntegrationTest\n  fixtures :people\n\
  \n  def test_caching\n    assert_cache_pages('/show/1' , '/edit/1' )\n  end\n\n\
  \  def test_expiry\n    assert_expire_pages('/show/1' , '/edit/1' ) do\n      post\
  \ '/destroy/1'\n    end\n  end\nend\n```\n\n第 6 行，`assert_cache_pages` 接收页面列表并验证获取\
  \ 每个页面是否导致该页面被缓存。第 9 行，`assert_expire_pages` 执行代码块，然后验证参数中的每个页面是否已从缓存中移除。\n\n##\
  \ 使用 Ajax 动态页面\n\n### 6.8 Ajax 概述\n\nAjax（异步 JavaScript 和 XML）席卷了 Web 世界。该术语由 Jesse\
  \ Garrett 在 2005 年 2 月提出，到 2006 年 9 月，一份调查报告显示几乎 70% 的受访者已经在使用或计划使用 Ajax 技术。这种成功的原因之一是\
  \ Ajax 术语定义的模糊性。在本书中我们将 Ajax 指为任何打破了 Web 页面隐喻且在现代浏览器中无需额外软件即可运行的 Web 应用技术。\n\n\n\
  \n\n引入异步性符合这一定义：典型的 `XMLHttpRequest` 对象，加上使用框架、脚本标签和图像标签的各种技巧。\n\n## JavaScript\
  \ 库：Prototype 和 Scriptaculous\n\n任何 Ajax 架构的核心都是一个或多个 JavaScript 库。这些库运行在客户端浏览器中，响应用户输入，提交异步请求，处理服务器响应并更新用户界面。\n\
  \n从理论来说，这些库与你的服务器端框架是解耦的。由于 Ajax 中所有的实际通信都是通过 `HTTP` 进行，因此任何 Ajax 客户端代码都可以与任何编写良好的服务器代码共存。在实践中，这部分是真的。最流行的\
  \ Ajax 库确实用于不同的服务器端技术栈。根据最近的调查，`Prototype` 是最流行的 Ajax 框架。我们见过 `Prototype` 用于带有 `Rails`、`.NET`、`Java`\
  \ 和 `PHP` 后端的项目。\n\n尽管 Ajax 和服务器端框架在逻辑上是分离的，但存在向集成解决方案发展的压力。如果服务器端框架包含了为特定 Ajax\
  \ 框架生成代码的自定义标签或辅助方法，那么使用该框架将会变得更容易。\n\n这在 `Rails` 中确实如此。`Rails` 包含了专门针对两个 JavaScript\
  \ 框架的辅助方法：`Prototype` 和 `Scriptaculous`。由于这些辅助方法在 `Rails` 中非常易用，大多数 `Rails` 项目在不进一步考虑的情况下就会选择这些库。\n\
  \n要在 `Rails` 应用中包含 Ajax，第一步是包含 `Prototype` 和 `Scriptaculous` 库的脚本标签。由于脚本标签通常位于 HTML\
  \ 文档的 head 中，包含这些标签的最佳位置是控制器的布局（layout）：\n\n[下载 code/rails_xt/app/views/layouts/quips.rhtml](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/views/layouts/quips.rhtml)\n\
  \n```\n<%= javascript_include_tag :defaults %>\n```\n\n## 使用 AJAX 创建动态页面\n\n`defaults`\
  \ 经过特殊处理以包含所有 `Rails` 默认的 JavaScript 库，因此上一行代码翻译为以下内容：\n\n```html\n<script src=\"\
  /javascripts/prototype.js?1149008954\" type=\"text/javascript\" >\n</script>\n<script\
  \ src=\"/javascripts/effects.js?1149008954\" type=\"text/javascript\" >\n</script>\n\
  <script src=\"/javascripts/dragdrop.js?1149008954\" type=\"text/javascript\" >\n\
  </script>\n<script src=\"/javascripts/controls.js?1149008954\" type=\"text/javascript\"\
  \ >\n</script>\n<script src=\"/javascripts/application.js?1149008954\" type=\"text/javascript\"\
  \ >\n</script>\n```\n\n`application.js` 文件用于你编写的任何自定义 JavaScript。如果你需要更多的 JavaScript\
  \ 文件，可以向 `javascript_include_tag` 传递一个字符串：\n\n[下载 code/rails_xt/app/views/layouts/quips.rhtml](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/views/layouts/quips.rhtml)\n\
  \n```\n<%= javascript_include_tag 'mylibrary' %>\n```\n\n这渲染出以下内容：\n\n```html\n\
  <script src=\"/javascripts/mylibrary.js?\" type=\"text/javascript\" ></script>\n\
  ```\n\n## Rails Ajax 辅助方法\n\n现在我们已经有了客户端 JavaScript 库，可以让应用程序的页面更加可用。让我们从脚手架（scaffold）的\
  \ `show` 和 `edit` 操作开始。与其让用户切换页面来从 `show` 切换到 `edit` ，为什么不让他用一个页面兼顾两者呢？有一种可能的方法：当鼠标悬停在\
  \ `show` 操作中的属性值上时，文本变热并改变颜色。点击文本会动态打开该字段的小型编辑表单，然后使用 Ajax 向服务器发送更新。\n\n我们选择这个设计只有一个原因是：`Scriptaculous`\
  \ 支持它，而且 `Rails` 包含一个使其轻而易举的辅助方法。我们在 `Quips` 的 `show` 操作中加入了 `InPlaceEditor`：\n\n\
  [下载 code/rails_xt/app/views/quips/show.rhtml](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/views/quips/show.rhtml)\n\
  \n```ruby\n<% for column in Quip.content_columns %>\n<p>\n  <b<%= column.human_name\
  \ %>:</b>\n  <%= in_place_editor_field \"quip\" , column.name %>\n</p>\n<% end %>\n\
  ```\n\n就是这样。与非 Ajax 视图唯一的区别在于调用了 `in_place_editor_field`，它显示特定列的当前值，然后添加 JavaScript\
  \ 来完成其他工作：在鼠标悬停时高亮字段、显示编辑表单、通过 Ajax 提交编辑，并根据服务器响应更新字段。以下是一个列生成的 HTML，为了可读性进行了重新格式化：\n\
  \n[下载 code/rails_xt/sample_output/in_place.html](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/sample_output/in_place.html)\n\
  \n```html\n<span class=\"in_place_editor_field\" id=\"quip_text_1_in_place\" >This\
  \ is quip</span>\n<script type=\"text/javascript\" >\nnew Ajax.InPlaceEditor('quip',\
  \ '/quips/set_quip')\n</script>\n```\n\n`Ajax.InPlaceEditor` 是为了 `Scriptaculous`。正如你从\
  \ HTML 中推测的那样，`Scriptaculous` 有自己的命名规则来管理 HTML 属性。`Ajax.InPlaceEditor` 的第二个参数是服务器\
  \ URL `/quips/set_quip`。在标准的 Rails 中，这涉及到控制器的：\n\n[下载 code/rails_xt/app/controllers/quips.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/controllers/quips.rb)\n\
  \n`in_place_editor_field` 是模型和列名。这里我们会在控制器中需要一个 `search` 操作：\n\n```ruby\ndef search\n\
  \  @quips = Quip.find_text_like(params[:search])\n  render :partial=>'search_results'\
  \ if request.xhr?\nend\n```\n\n## 使用 AJAX 创建动态页面\n\n`find_text_like` 调用假设 `Quip`\
  \ 上有一个类方法来查找某些值：\n\n[下载 code/rails_xt/app/models/quip.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/models/quip.rb)\n\
  \n```ruby\ndef self.find_text_like(value)\n  find(:all, :conditions=> \"text LIKE\
  \ \" + ActiveRecord::connection.quote(\"%#{value}%\"))\nend\n```\n\n`render :partial`\
  \ 让搜索 操作处理 Ajax 和非 Ajax 请求。如果 `request.xhr?` 返回真，则请求是通过 Ajax 发出的。我们不想渲染整个页面，只渲染更改的部分，我们计划将其放在名为\
  \ `_search_results` 的部分。否则，我们将跳出方法，Rails 会自动渲染 `search.rhtml`。\n\n现在我们需要创建一个 `search.rhtml`，它将显示\
  \ quips 集合以及一个提交搜索字符串的表单：\n\n[下载 code/rails_xt/app/views/quips/search.rhtml](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/views/quips/search.rhtml)\n\
  \n```html\n<h1>Search quips</h1>\n<%= image_tag 'loading.gif', :id=>'spinner', :style=>\"\
  display:none; float:right;\" %>\n<% form_tag do %>\n  <%= text_field_tag 'search',\
  \ @search %>\n  <%= observe_field :search,\n      :frequency => 0.5,\n      :update\
  \ => 'search-results',\n      :complete=>\"Element.hide('spinner')\" ,\n      :before=>\"\
  Element.show('spinner')\" ,\n      :with=>\"'search=' + encodeURIComponent(value)\"\
  \ ,\n      :url=>{:action=>'search'} %>\n<% end %>\n<div id=\"search-results\" >\n\
  \  <%= render :partial=>'search_results' %>\n</div>\n```\n\n\n\n\n\n```ruby\n<%=\
  \ link_to 'List', :action => 'list' %>\n```\n\n我们最初是通过复制和粘贴 `show` 的模板 `show.rhtml`\
  \ 来创建此文件的。然后，我们进行了以下更改：\n\n- `image_tag` 显示一个动画 GIF 作为进度指示器，这样用户就能看出我们正在进行异步调用。由于最初没有\
  \ Ajax 调用，此图像被设置为 `:style=>\"display:none\"`。\n- 有一个用于搜索操作的表单，包含一个搜索字段。\n- 表单内部有一个对\
  \ `observe_field` 辅助方法的调用。这就是 Ajax 发生的地方，稍后会进行更详细的描述。\n- 实际表格并没有在这里渲染，而是在名为 `search_results`\
  \ 的部分模板（partial）中渲染。\n- 该部分模板被包裹在一个 `div id=\"search-results\"` 中。\n\n`observe_field`\
  \ 的调用接受一个必需的单数参数，以及大量的可选参数。我们在这里使用的参数如下：\n\n- `:search` 是要观察字段的 ID。它指向 `text_field_tag`。\n\
  - `:frequency` 是检查字段变化的频率（以秒为单位）。较小的值响应更快，但对服务器的负载也更大。（零是一个特殊情况，会导致在退出控件时检查该字段。）\n\
  - `:update` 是要用 Ajax 调用结果更新的 DOM ID。这就是为什么我们需要将部分模板包裹在一个已知的 DOM ID 中。\n- `:complete`\
  \ 和 `:before` 指定了在 Ajax 调用之前和之后执行的 JavaScript。这用于显示和隐藏进度指示器。\n- `:with` 指定了 Ajax\
  \ 请求的查询字符串。对 `encodeURIComponent` 的调用是 JavaScript。\n- `:url` 指定要调用的服务器 URL，使用标准的\
  \ Rails `url_for` 参数。\n\n## Ajax 规划\n\n这两个示例仅触及 Rails Ajax 支持的冰角。除了 `in_place_editor_field`\
  \ 之外，还有用于其他用户界面增强的辅助方法，包括拖放。除了 `observe_field` 之外，还有辅助方法可以处理浏览器界面中可能发生的几乎所有情况：链接、表单、按钮点击、定时器等。\n\
  \n涵盖这些功能（以及它们的许多可选参数）大约需要半本书的内容。我们并不打算这样做，而是重新回顾这两个示例，以就 Ajax 设计以及 Rails 中的 Ajax\
  \ 实现得出一些通用性观点。\n\n首先，我们将讨论设计方面。我们在这里展示的两个示例演示了在某些情况下可能很有用的，但并非在所有情况下都适用。添加 `InPlaceEditor`\
  \ 假设你想允许一次编辑一个字段。\n\n尽管这很方便，但在几种情况下你应该避免这样做：\n\n- 许多用户可能没有意识到原位编辑器的存在。你可能需要添加更多的视觉指示，或以某种方式训练用户。\n\
  - 某些模型对象具有跨越多个字段或多行的验证约束。允许逐字段编辑可能会使这些对象处于无效状态，或使某些有效状态无法实现。\n- 原位编辑对服务器的要求更高。\n\
  \n一个巨大的设计考虑是没有启用 Ajax 浏览器的用户。在我们的示例中，即使禁用 Ajax，一切仍然可以工作——你可以通过禁用浏览器中的 JavaScript\
  \ 来验证这一点。但这种可降级的 Ajax（degradable Ajax）需要我们在最初介绍示例时没有提到的提前思考。原位编辑示例在没有 Ajax 的情况下可以使用，因为\
  \ `Edit` 链接仍然在那里。如果 Ajax 不可用，只需通过普通的页面跳转从显示（Show）切换到编辑（Edit）模式。\n\n搜索示例之所以在没有 Ajax\
  \ 的情况下工作，是因为我们编写控制器的方式。如果关闭了 JavaScript，那么表单观察器自然无法工作。但是，用户仍然可以通过按回车键以旧方式提交表单。表单将提交到与\
  \ Ajax 调用相同的 URL，`/quips/search`。然而，对 `request.xhr?` 的调用将返回 `false`，Rails 将渲染 `search.rhtml`\
  \ 作为响应。我们可以通过在搜索表单中包含一个提交按钮来让非 Ajax 情况变得更加清晰，然后使用 JavaScript 在感知 Ajax 的环境中隐藏该按钮。只要你足够细心，Rails\
  \ 就让可降级的 Ajax 成为可能。\n\n我们在这里展示的两个示例演示了 Rails Ajax 开发的一些最重要的主题：\n\n- Rails 辅助方法隐藏了\
  \ Prototype 和 Scriptulous 的细节。只要你保持在辅助方法的范围内，你就不真的需要理解 JavaScript。（尽管我们认为你应该理解。）\n\
  - 只要你足够细心，可降级的 Ajax 是可能的。一种简单的方法是让同一个控制器方法兼顾双重职责，并根据 `request.xhr?` 进行分支。\n- Ajax\
  \ 辅助方法倾向于通过最后的 `Hash` 参数接收几个必需参数和许多可选参数。许多选项名称在多个方法之间共享的，减少了你需要学习的内容。\n- 许多 Rails\
  \ Ajax 辅助方法鼓励一种依赖于返回 HTML 片的 Ajax 风格（与 AJAX 缩写所建议的 XML 相对于这种风格简化了向现有 Web 应用程序增量添加\
  \ Ajax 功能，但如果你正在构建一个更全面的 Ajax 化应用程序，它可能用较小。\n\n另一种 Ajax 开发方法是在响应 Ajax 请求时发送 JavaScript\
  \ 代码。虽然这听起来可能不太可能，但 Rails 包含了一种巧妙的 JavaScript 生成机制，允许你用 Ruby 代码编写页面更新。下一节将向你展示。\n\
  \n### 6.9 使用 RJS 渲染 JavaScript\n\nRJS (Rails JavaScript) 允许通过对服务器上的页面对象编程来更新页面。这个用\
  \ Ruby 编写的页面对象实际上是一个代码生成器，将 Ruby 转换为 JavaScript，然后 Rails 返回给客户端。这听起来很，但用法非常简单。例如，我们将创建一个名为\
  \ `better_search` 的搜索动作。\n\n`better_search` 动作的工作方式与 `search` ，但还会报告返回的项目数量。此报告将存在于单独的部分模板中。从主视图文件\
  \ `better_search.rhtml`，我们将引用此部分模板：\n\n```html\n<div id=\"search-count\">\n<%= render\
  \ :partial=>'search_count%>\n</div>\n```\n\n部分模板本身足够简单：\n\n```html\nFound <%= @quips.size\
  \ %> matching your request.\n```\n\n现在是挑战：在用户触发搜索后，两个不同的 div 应该更新：包含表格的 `search-results`\
  \ div 和带有结果数量的 `search-count` div。如果你尝试在带有 `:update` 选项的情况下使用 `observe_field`，你将会有两个选择：\n\
  \n- 将两个 div 包裹在一个更高级的 HTML 元素中，并更新它。\n- 发起两个独立的 Ajax 请求，每个元素一个。\n\n\n\n\nRJS 来救你的急了。有了\
  \ RJS，进行多次更新变得轻而易举。\n\n这里是 `better_search` action 使用的 RJS 模板：\n\n[下载 code/rails_xt/app/views/quips/_search_update.rjs](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/views/quips/_search_update.rjs)\n\
  \n```\npage.replace_html 'search-results' , :partial=>'search_results'\npage.replace_html\
  \ 'search-count' , :partial=>'search_count'\npage.visual_effect :highlight, 'search-count'\n\
  ```\n\n之前的 `replace_html` 方法接收一个 DOM ID 和一个部分模板（partial）。Rails 随后生成 JavaScript，用渲染部分模板的结果来替换每个\
  \ DOM ID 的内容。对 `visual_effect` 的调用会高亮搜索计数，以便用户能够察觉发生了变化。\n\n在控制器中，访问 RJS 模板就像访问任何其他模板一样。事实上，你无法从控制器代码中看出使用的是哪种模板：\n\
  \n[下载 code/rails_xt/app/controllers/quips_controller.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/app/controllers/quips_controller.rb)\n\
  \n```\ndef better_search\n  @quips = Quip.find_text_like(params[:search])\n  render\
  \ :partial=>'search_update' if request.xhr?\nend\n```\n\n除了基础的 DOM 更新外，RJS 还包含了用于警报、定时器、重定向以及\
  \ Scriptaculous 拖放的方法。\n\n### 6.10 使用 Selenium 进行黑盒测试\n\n在 Rails 应用中，`test/functional`\
  \ 中的测试用于测试控制器。它们在某种程度上也测试了视图代码，因为当控制器 action 被调用时，视图模板会被渲染。这些测试是“白盒测试”，因为它们可以访问（并测试）控制器和视图运行的内部白盒细节。这些测试在第\
  \ 7 章 测试中详见第 198 页。\n\n白盒测试的对面是黑盒测试。在黑盒测试中，测试程序对被测试程序的内部运行机制一无所知。黑盒测试通常由系统的开发者和使用者共同进行。当以这种方式使用时，黑盒测试就是验收测试。验收测试，从字面上说，是对系统成功的验收。\n\
  \n由于验收测试对实现细节一无所知，因此验收测试工具并不特定于任何语言或库。我们使用开源工具 Selenium 为 Web 应用构建验收测试。使用 Selenium\
  \ 测试 Rails 应用通常涉及三个独立的库：\n\n* `Selenium Core` 是底层的 Selenium 引擎。`Selenium Core` 可以在大约十种不同的浏览器平台上运行测试。\n\
  * `Selenium IDE` 是一个用于记录测试的 Firefox 扩展。在 `Selenium IDE` 中记录的测试随后可以使用 `Selenium Core`\
  \ 在其他浏览器上运行。\n* `Selenium on Rails` 是一个 Rails 插件，提供了一个基于 Ruby 的库来调用 `Selenium`。对于大量的测试，这个库比\
  \ `Selenium IDE` 产出的测试格式更容易操作。\n\n要查看这些库的运行情况，请按照 Selenium 主页上的说明安装 `Selenium Core`\
  \ 和 `Selenium IDE`。我们将使用 `Selenium IDE` 为 People 应用记录一个测试。\n\n1. 安装 `Selenium IDE`\
  \ 后，重启 Firefox。\n2. 在测试环境中运行 People 应用：\n   `RAILS_ENV=test script/server`\n3. 打开\
  \ Firefox，并导航到 People 索引页 `/people`。\n4. 从 Firefox 工具菜单中选择 `Selenium Recorder` 以开启\
  \ `Selenium Recorder`。调整浏览器窗口和录制器的大小，以便能同时看到它们。\n5. 点击 `New Person` 链接创建一个新成员。注意录制器正在记录你的操作。\n\
  6. 点击 `Create` 按钮创建一个新人。这应该会失败，因为该人没有名字。\n7. 在浏览器窗口选择错误消息“can’t be blank”。右键点击选定内容，选择\
  \ `Append Selenium Command | verifyTextPresent`。\n8. 输入名和姓，再次点击 `Create`。\n9. 选择状态消息“Person\
  \ was successfully created”并追加另一个 Selenium 命令来验证此文本是否存在。\n10. 切换到 `Selenium Recorder`，并将测试保存为\
  \ `test/selenium/people/create_person.html`。\n\n使用 `Selenium IDE` 运行你的测试。IDE 顶部的\
  \ `Play` 按钮将启动测试，你可以以三种不同的速度运行：`Run`（运行）、`Walk`（演示）或 `Step`（单步）。`Selenium IDE` 还有其他我们在这里不会显式介绍的功能：\n\
  \n* `command` 字段是一个弹出窗口，列出了所有（大量的）可能的 Selenium 命令。\n* `Log` 标签页保留了过去测试的日志信息。\n*\
  \ `Reference` 标签页记录了当前命令，并与你选择的任何命令自动同步。\n\n在 Rails 应用中，运行整个测试套件简单的方法是安装 `Selenium\
  \ on Rails` 插件：\n`script/plugin install http://svn.openqa.org/`\n\n我们发现连字符与 Rails\
  \ 1.2 兼容性不好。将插件重命名为使用下划线（`selenium_on_rails`）可以解决这个问题。\n\n### 图 6.1：使用 Selenium\
  \ 运行测试\n\n如果你打开保存的 IDE 测试源码，你会看到一个包含表格的 HTML 文件。单个测试步骤以表格行的格式化，例如导航到 `/people` 的步骤：\n\
  \n```html\n<tr>\n  <td>open</td>\n  <td>/people</td>\n  <td></td>\n</tr>\n```\n\n\
  Selenium on Rails 提供了另一种使用 Ruby 语法的测试格式。这在编写复杂的测试时非常方便。要创建一个 Selenium on Rails 测试，使用以下生成器：\n\
  `./script/generate selenium your_test`\n\n这将创建一个名为 `test/selenium/your_test.rsel`\
  \ 文件。用 RSelenese 命令填充测试。（RSelenese 命令在 Selenium on Rails 的文档中有记录。）\n\n```ruby\n\
  setup :fixtures=>:all\nopen '/account/login'\ntype 'login', 'quentin'\ntype 'password',\
  \ 'test'\nclick 'commit'\nwait_for_page_to_load 2000\n```\n\n该测试从加载所有测试固件开始。登录后，测试等待\
  \ 2000 毫秒以重定向到登录后的页面。注意此测试文件名以下划线开头。借用 Rails 视图命名法，这是一个部分模板测试。由于所有测试都需要登录，此测试通过\
  \ RSelenese 命令 `include_partial` 从其他测试调用。\n\nSelenium on Rails 还包含一个 `test:acceptance`\
  \ Rake 任务。你可以使用此任务运行你所有的 Selenium 测试。\n\n### 6.11 结论\n\n视图层是程序员、交互设计师和图形设计师会合的地方。在\
  \ Java 世界中，视图层通常构建\n\n\n\n\n\n这种方法假设程序员熟悉 Java，而设计师熟悉 HTML。因此，大量的精力被用于创建一个动态环境，以弥补\
  \ Java 与 HTML/脚本世界之间的差异。标签库（Tag libraries）、`JSTL` 表达式语言以及 `OGNL` 都旨在在不引入 Java 语法复杂性的情况下提供动态内容。\n\
  \n如果我们必须用一句话来总结 Rails 方法的独特之处，那就是“以 Ruby 为中心的简单性”。其愿景是让每个人（包括页面设计师）都只需要了解一点 Ruby，而不需要其他知识。由于\
  \ Ruby 是一门脚本语言，它对设计师和程序员来说已经足够友好了。因此，不需要像标签库和自定义表达式语言这样的中间环节。一切都只是简单的 Ruby。\n\n\
  这两种方法都不是完美的。在费了大量精力将 Java “简化”为标签和表达式语言之后，我们看到程序员和设计师都仍在苦苦于理解动态页面上正在发生什么。如果你在动态语言与静态语言的辩论中选了边，那么无论你站在哪一边，这都是令人沮丧的。Java\
  \ Web 层将静态的、编译的代码（`Java`）与动态评估的代码（标签库调用、表达式语言）混合在一起。要排查 Java Web 程序的错误，你需要对这两个世界都有深入的理解。\n\
  \n排查 Rails 应用同样不容易。由于只有一种语言，事情变得简单了一些，但问题仍然存在。目前的工具支持非常少，尽管我们预计 Ruby 日益普及将推动主要工具的重大改进。视图中的堆栈跟踪（Stack\
  \ traces）非常深且难以阅读，无论在 Ruby 还是 Java 中都是如此。\n\n由于追踪一直渗透到视图的问题是非常痛苦的，我们最好确保这类问题少之无几。幸运的是，Rails\
  \ 为测试提供了良好的支持，这是下一章的主题。\n\n### 6.12 资源\n\n- **HAML: HTML 抽象标记语言**。[`unspace.ca/discover/haml/`](http://unspace.ca/discover/haml/)\n\
  \  HAML 是 Rails 的一种替代模板引擎。\n- **Markaby: 标记即 Ruby**。[`code.whytheluckystiff.net/markaby/`](http://code.whytheluckystiff.net/markaby/)\n\
  \  Markaby 是一种用纯 Ruby 方法生成 HTML 标记的方法。它痴迷于便利，并愿意为了实现目标而尽可能使用地道的 Ruby 代码。\n- **Rails\
  \ Cache Test Plugin**。[`blog.cosinux.org/pages/page-cache-test`](http://blog.cosinux.org/pages/page-cache-test)\n\
  \  Rails Cache Test Plugin 提供了断言，用于测试内容的缓存和缓存内容的过期。即使在关闭缓存的情况下（测试环境中通常是关闭的），测试也能运行，因为该插件存根（stub\
  \ out）了缓存相关的方法。\n- **Selenium**。[`www.openqa.org/selenium/`](http://www.openqa.org/selenium/)\n\
  \  Selenium 是一种用于 Web 应用的测试工具。Selenium 直接运行在浏览器中，因此适用于功能测试、验收测试以及跨浏览器兼容性测试。\n- **Selenium\
  \ IDE**。[`wiki.openqa.org/display/SIDE/Home`](http://wiki.openqa.org/display/SIDE/Home)\n\
  \  Selenium IDE 是一个 Firefox 扩展，你可以用它记录、执行和调试 Selenium 测试。\n- **Selenium on Rails**。[`www.openqa.org/selenium-on-rails/`](http://www.openqa.org/selenium-on-rails/)\n\
  \  Selenium on Rails 是一个 Rails 插件，为 Rails 项目提供标准的 Selenium 目录、用于调用 Selenium 测试的\
  \ Ruby 语法，以及用于验收测试的 `Rake` 任务。\n\n## 第 7 章：测试\n\n测试从小处开始，从单元测试开始。单元测试是对小块代码（单元）的自动化单元测试。通过在最小粒度上进行测试，你可以确保系统的基础构建模块能够正常工作。当然，你不必止于此！在测试更高层级的系统时，你也可以应用许多单元测试的技术。\n\
  \n单元测试并不能直接确保设计的良好或有用。单元测试确保的是功能运行符合预期。事实证明，这对设计有间接的积极影响。以后，你可以通过良好的单元测试轻松地改进代码。当你想到改进点时，直接将其加入即可。单元测试会迅速告诉你，你的“向前迈两步”是否在某处让你付出了后退一步（或更多步）的代价。\n\
  \n`Test::Unit` 框架是 Ruby 标准库的一部分。对于任何熟悉 Java `JUnit` 的人来说，`Test::Unit` 看起来非常熟悉——这些框架以及类似的框架非常相似，以至于通常被描述为\
  \ `XUnit` 框架。与 `JUnit` 一样，`Test::Unit` 提供了：\n\n- 用于单元测试的基类以及一组命名约定，以便于于调用特定测试或一组相关测试\n\
  - 一组断言，当断言遇到意外之外的结果时，它们将（通过抛出异常）使测试失败\n- 生生命周期方法（`setup()` 和 `teardown()`），为需要它的测试保证一致的系统状态。\n\
  \n在本章中，我们将涵盖 `Test::Unit` 以及 `Rake` 任务如何简化编写和运行测试。我们还将涵盖 `Test::Unit` 添加的自定义断言以及测试中常用的其他工具：用于\
  \ mock 对象的 `FlexMock` 和用于代码覆盖率的 `rcov`。\n\n### 7.1 从 Test::Unit 开始\n\n理解 `Test::Unit`\
  \ 最简单的方法是实际测试一些东西，所以我们开始吧。想象有一个创建一个 HTML 标签的简单方法。该方法接受两个参数：标签名称和可选的标签 `body`。这里是\
  \ Java 中一个快速而粗陋的实现：\n\n```java\npackage unit;\n\npublic class Simple {\n    public\
  \ static String tag(String name) {\n        return tag(name, \"\");\n    }\n\n \
  \   public static String tag(String name, String body) {\n        return \"<\" +\
  \ name + \">\" + body + \"</\" + name + \">\";\n    }\n}\n```\n\n这里是 Ruby 中对应的代码：\n\
  \n```ruby\nmodule Simple\n  def tag(name, body='')\n    \"<#{name}>#{body}</#{name}>\"\
  \n  end\nend\n```\n\n测试这种代码的方法是启动 `irb`，引入文件并尝试一些输入：\n\n```ruby\nirb(main):001>\
  \ require 'simple_tag_1'\n=> true\nirb(main):004> include Simple\n=> Object\nirb(main):006>\
  \ tag 'h1'\n=> \"<h1></h1>\"\nirb(main):007> tag 'h1', 'hello'\n=> \"<h1>hello</h1>\"\
  \nirb(main):008> tag nil\n=> \"<></>\"\n```\n\n这种交互式测试很有用，并且让你快速探索边界情况（注意 `tag nil`\
  \ 的结果可能是不理想的）。\n\n这种交互式测试的缺点是，你——程序员——必须在场进行交互。这第一次是可以的，但我们希望能够自动化这种测试。这就是单元测试和断言大显身场。大多数\
  \ Java 开发者使用 `JUnit` 编写单元测试。虽然 `JUnit` 不是 Java 本身的一部分，但它的应用非常广泛。你可以在 `http://www.junit.org`\
  \ 下载它，或者包含在大多数 Java IDE 以及各种其他项目中。这里有一个简单的 JUnit `TestCase`：\n\n```java\npackage\
  \ unit;\n\nimport junit.framework.TestCase;\n\npublic class SimpleTest extends TestCase\
  \ {\n    public void testTag() {\n    }\n}\n```\n\n\n\n\n\n```\nassertEquals(\"\
  <h1></h1>\" , Simple.tag(\"h1\" )); assertEquals(\"<h1>hello</h1>\" , Simple.tag(\"\
  h1\" , \"hello\" ));\n\n}\n```\n\nJUnit 依赖于几种约定来最大限度地减少你编写测试的工作量。JUnit 将任何 `TestCase`\
  \ 的子类识别为单元测试的容器，并将任何名称以 `test` 开头的方法视为测试。诸如 `assertEquals()` 这样接收两个值的断言会先列出预期值，然后列出实际值。JUnit\
  \ 测试可以在多种测试运行器中运行，包括图形界面和控制台（详细信息请咨询您的 IDE 文档或访问 [`www.junit.org`](http://www.junit.org)）。\n\
  \n等价的 Ruby `TestCase` 极其相似：\n\n[下载代码/rails_xt/samples/unit/simple_tag_1_test.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/unit/simple_tag_1_test.rb)\n\
  \n```ruby\nrequire 'test/unit'\n\nrequire 'simple_tag_1'\n\nclass SimpleTest < Test::Unit::TestCase\n\
  \  include Simple\n\n  def test_tag\n    assert_equal(\"<h1></h1>\" , tag(\"h1\"\
  \ ))\n    assert_equal(\"<h1>hello</h1>\" , tag(\"h1\" , \"hello\" ))\n  end\nend\n\
  ```\n\n`Test::Unit` 将任何 `Test::Unit::TestCase` 的子类识别为单元测试的容器，并将任何名称以 `test` 开头的方法视为测试。与\
  \ JUnit 类似，诸如 `assert_equal()` 这样接收两个值的断言会先列出预期值，然后列出实际值。你可以通过让 Ruby 指向该 `.rb` 文件来运行测试：\n\
  \n```bash\n$ ruby simple_tag_1_test.rb\nLoaded suite simple_tag_1_test\nStarted\n\
  .\nFinished in 0.001918 seconds.\n1 tests, 2 assertions, 0 failures, 0 errors\n\
  ```\n\n当测试失败时，你应该应该得到一个描述性消息和一个堆栈跟踪。对于我们的 `Simple` 示例，一个期望标签名称自动转换为小写的测试应该失败：\n\n\
  [下载代码/java_xt/src/unit/FailingTest.java](http://media.pragprog.com/titles/fr_r4j/code/code/java_xt/src/unit/FailingTest.java)\n\
  \n```java\npublic void testTag() {\n    assertEquals(\"<h1></h1>\" , Simple.tag(\"\
  H1\" ));\n}\n```\n\n以下是 JUnit 控制台的错误报告：\n\n```text\njunit.framework.ComparisonFailure:\n\
  Expected:<h1>\nActual:<H1></H1>\nat unit.FailingTest.testTag(FailingTest.java:6)\n\
  at sun.reflect.NativeMethodAccessorImpl.invoke0(Native Method)\n(...more stack...)\n\
  ```\n\n这里是失败测试的 Ruby 版本：\n\n[下载代码/rails_xt/samples/unit/failing_test.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/unit/failing_test.rb)\n\
  \n```ruby\nrequire 'test/unit'\nrequire 'simple_tag_1'\n\nclass FailingTest < Test::Unit::TestCase\n\
  \  include Simple\n\n  def test_tag\n    assert_equal(\"<h1></h1>\" , tag(\"H1\"\
  \ ))\n  end\nend\n```\n\n与 JUnit 一样，控制台输出将报告失败的方法名、问题的原因以及一些堆栈跟踪信息：\n\n```bash\n\
  $ ruby failing_test.rb\n(...snip...)\n1) Failure:\ntest_tag(FailingTest) [failing_test.rb:8]:\n\
  <\"<h1></h1>\"> expected but was\n<\"<H1></H1>\">.\n1 tests, 1 assertions, 1 failures,\
  \ 0 errors\n```\n\n当你现在编写测试时，在此时此刻，你的脑海中拥有问题的整个上下文。在未来的某个时刻，重构可能会破坏你的测试。请可一下可怜的\
  \ Howard 吧，他是那个在不幸日子运行测试的程序员。在这一刻之前，他从未看过你的代码，脑海中也没有有用的上下文。如果你不相信利他主义，请记住 Howard\
  \ 可能就是你！你可以通过提供显式的错误消息来增加你的业报。在 JUnit 中，使用 `assertEquals()` 方法的另一种变形式，并将错误消息作为第一个参数：\n\
  \n[下载代码/java_xt/src/unit/SelfDocumentingTest.java](http://media.pragprog.com/titles/fr_r4j/code/code/java_xt/src/unit/SelfDocumentingTest.java)\n\
  \n```java\npublic void testTag() {\n    assertEquals(\"tag should lowercase element\
  \ names\" ,\n    \"<h1></h1>\" , Simple.tag(\"H1\" ));\n}\n```\n\n现在，失败测试的控制台报告将包含你的错误消息：\n\
  \n```text\njunit.framework.ComparisonFailure: tag should lowercase element names\n\
  Expected:<h1>\nActual:<H1></H1>\nat unit.SelfDocumentingTest.testTag(SelfDocumentingTest.java:7)\n\
  (...more stack...)\n```\n\n注意！这次 Ruby 版本包含一个惊喜。你可以添加一个可选的错误消息，但它是最后一个参数，而不是第一个。这与\
  \ JUnit 不一致，但与 Ruby 风格一致：将可选参数放在最后。\n\n[下载代码/rails_xt/samples/unit/simple_tag_1.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/unit/simple_tag_1.rb)\n\
  \n```ruby\nrequire 'test/unit'\nrequire 'simple_tag_1'\n\nclass SelfDocumentingTest\
  \ < Test::Unit::TestCase\n  include Simple\n\n  def test_tag\n    assert_equal(\"\
  <h1></h1>\" , tag(\"H1\" ), \"tag should lowercase names\")\n  end\nend\n```\n\n\
  控制台输出现在将包含你的错误消息：\n\n```bash\n$ ruby failing_test.rb\n(...snip...)\n1) Failure:\n\
  test_tag(SelfDocumentingTest) [simple_test.rb:8]:\n<\"<h1></h1>\"> expected but\
  \ was\n<\"<H1></H1>\">.\n```\n\n接下来，让我们测试如果用户向 `tag()` 传递 `null` 会发生什么。早期的 JUnit\
  \ 使用注解来标记预期异常的测试。示例所示：\n\n[下载代码/java_xt/src/unit/FailingTest.java](http://media.pragprog.com/titles/fr_r4j/code/code/java_xt/src/unit/FailingTest.java)\n\
  \n```java\n@Test(expected = IllegalArgumentException.class)\npublic void nullTag()\
  \ {\n    assertEquals(\"<h1></h1>\" , Simple.tag(null));\n}\n```\n\n当 JUnit 使用注解时，`Test::Unit`\
  \ 利用了 Ruby 的块语法：\n\n[下载代码/rails_xt/samples/unit/test_nil.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/unit/test_nil.rb)\n\
  \n```ruby\ndef test_nil\n  assert_raises (ArgumentError) {tag(nil)}\nend\n```\n\n\
  这个测试应该失败，因为我们还没有按照预期处理 `nil` 情况：\n\n```bash\n$ ruby simple_tag_1_test.rb\nLoaded\
  \ suite simple_tag_1_test\nStarted\nF.\nFinished in 0.025861 seconds.\n1) Failure:\n\
  test_nil(SimpleTest) [simple_tag_1_test.rb:11]:\n<ArgumentError> exception expected\
  \ but none thrown.\n```\n\n现在我们可以修复 `tag` 的实现以拒绝 `nil`：\n\n[下载代码/rails_xt/samples/unit/simple_tag_2.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/unit/simple_tag_2.rb)\n\
  \n```ruby\nmodule Simple\n  def tag(name, body='')\n    raise ArgumentError, \"\
  Must specify tag\" unless name\n    \"<#{name}>#{body}</#{name}>\"\n  end\nend\n\
  ```\n\n\n\n\n\n- 等价（Equality）不等于同一性（identity）。使用 `assert_equal()` 测试相等性，使用 `assert_same()`\
  \ 测试同一性。\n- `false` 不等于 `nil`（尽管 `nil` 在布尔上下文中表现为 `false`）。使用 `assert_nil()` 和 `assert_not_nil()`\
  \ 来处理 `nil`。\n- 零 (0) 在布尔上下文中求值为真。不要编写任何强制任何人记住这一点的代码。\n- Ruby 使用 `raise` 来抛出异常，因此你使用\
  \ `assert_raises` 测试异常。不要误调用 `assert_throws` 方法！`assert_throws` 用于测试 Ruby 的 `throw/catch`\
  \ 机制，该机制（尽管名字如此）并不是用于处理异常的。\n\n你可以编写自己的断言，因为它们仅仅是方法调用。通常情况下，你的断言通过调用一个或多个内置断言，来断言更复杂的、特定领域的条件。\n\
  \n## 生命周期方法\n\n通常，多个测试依赖于共同的设置。例如，如果你正在测试数据对象，那么你所有的测试可能都依赖于共同的数据库连接。在每个测试中重复这段代码是浪费的，因此单元测试框架提供了生命周期回调方法。\n\
  \nJUnit 定义了 `setUp()` 和 `tearDown()` 方法，这些方法会在每个测试之前和之后自动调用。同样，`Test::Unit` 定义了\
  \ `setup()` 和 `teardown()` 方法。为了看到它们的运行效果，请考虑这个来自 Rails 代码库的真实示例：`ActiveRecord`\
  \ 的单元测试需要测试线程数据库连接。\n\n`ActiveRecord` 连接的“线程化”涉及一些全局的设置和销毁。因此，任何对线程连接的测试之前，必须先运行代码将\
  \ `ActiveRecord` 置于线程状态。\n\n[下载 code/rails/activerecord/test/threaded_connections_test.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails/activerecord/test/threaded_connections_test.rb)\n\
  \n```ruby\ndef setup\n  @connection = ActiveRecord::Base.remove_connection\n  @connections\
  \ = []\n  @allow_concurrency = ActiveRecord::Base.allow_concurrency\nend\n```\n\n\
  注意，某些原始的测试前全局变量被保存在变量中（`@connection` 和 `@allow_concurrency`）。这些值在测试完成后会被重置：\n\n\
  [下载 code/rails/activerecord/test/threaded_connections_test.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails/activerecord/test/threaded_connections_test.rb)\n\
  \n```ruby\ndef teardown\n  # 清空连接缓存\n  ActiveRecord::Base.send(:clear_all_cached_connections!)\n\
  \  # 将 allow_concurrency 设置为保存的值\n  ActiveRecord::Base.allow_concurrency = @allow_concurrency\n\
  \  # 建立旧连接\n  ActiveRecord::Base.establish_connection(@connection)\nend\n```\n\n\
  你可能会发现 `setup()` 经常有用，可以避免相似启动状态的重复代码。由于 Ruby 是垃圾回收的，`teardown()` 使用的频率较少，通常用于清理应用程序范围的设置。\n\
  \n为了说明它们的相对频率，这里是 Rails 的一些简单统计数据：\n\n```bash\n$ ruby rails_stats.rb\n631 .rb 文件\n\
  212 个测试类\n126 个 setup 方法\n20 个 teardown 方法\n```\n\n生成这些统计数据的程序非常简单。它使用 Ruby 的 `Dir.glob`\
  \ 遍历文件，并使用正则表达式匹配来“估算” `setup()` 和 `teardown()` 的相对使用率：\n\n[下载 code/rails_xt/samples/rails_stats.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/rails_stats.rb)\n\
  \n```ruby\nbase ||= \"../../rails\" # 为你自己的需求设置\nfiles = tests = setups = teardowns\
  \ = 0\nDir.glob(\"#{base}/**/*.rb\" ).each do |f|\n  files += 1\n  File.open(f)\
  \ do |file|\n    file.each do |line|\n      tests += 1 if /< Test::Unit::TestCase/=~line\n\
  \      teardowns += 1 if /def teardown/=~line\n      setups += 1 if /def setup/=~line\n\
  \    end\n  end\nend\nputs \"#{files} .rb files\"\nputs \"#{tests} test classes\"\
  \nputs \"#{setups} test setup methods\"\nputs \"#{teardowns} test teardown methods\"\
  \n```\n\n## 7.2 Rails 测试规范\n\n从历史上看，Java 框架并没有对测试强制执行目录结构或命名规范。这种灵活性意味着每个项目都略有不同。在处理新项目时，你通常需要查阅\
  \ `Ant build.xml` 文件来了解项目结构。一些程序员发现这种灵活性弊大于于利，现在使用 [Apache Maven](http://maven.apache.org/)]\
  \ 来在项目间强制执行通用的结构。\n\nRails 项目具有标准的布局和命名规范。因此，大多数 Rails 项目看起来与大多数其他 Rails 项目非常相似。例如，应用程序代码位于\
  \ `app` 目录中，而对应的测试代码位于 `test` 目录。这种约定使得阅读和理解不熟悉的项目变得容易。\n\nRails 的命名规范通过各种生成器（generators）实例化。当你调用\
  \ `script/generate` 时，`Rails` 会创建测试类的存根版本，以及它们运行所需的环境。Rails 最初支持两种测试：针对模型类的单元测试和针对控制器的功能测试。自\
  \ Rails 1.1 起，你还可以生成第三种测试，称为集成测试，它可以测试多个控制器和模型类。\n\n### 单元测试\n\n与本书大部分不同，本章不包含用于对比的\
  \ Java 代码，因为没有广泛使用的对应 Java 框架。让我们从测试一个 Rails 模型开始。我们清理了 `script/generate` 的输出，只显示为\
  \ `Person` 模型创建的文件：\n\n```bash\nscript/generate model Person\ncreate app/models/person.rb\n\
  create test/unit/person_test.rb\ncreate test/fixtures/people.yml\ncreate db/migrate/002_create_people.rb\n\
  ```\n\n`app/models/person.rb` 和 `db/migrate/002_create_people.rb` 文件处理 ActiveRecord\
  \ 模型本身，并在第 4 章第 96 页中有详细介绍。使用 ActiveRecord 访问数据，第 96 页。我们关注的是测试目录下的文件。针对 `Person`\
  \ 类的单元测试文件是 `test/unit/person_test.rb`，它初始看起来如下：\n\n```ruby\nrequire File.dirname(__FILE__)\
  \ + '../test_helper'\n\nclass PersonTest < Test::Unit::TestCase\n  fixtures :people\n\
  \n  # 将此替换为你的真实测试\n  def test_truth\n    assert true\n  end\nend\n```\n\n第一行在经过路径处理后引入了\
  \ `test/test_helper.rb` 文件。`test/test_helper.rb` 文件会在任何 Rails 应用程序中自动创建，并提供三个有用工具：\n\
  \n- 一个为测试准备的环境，包含了你可能需要的一切：环境设置、活动数据库连接、模型类访问、`Test::Unit` 以及 Rails 对 `Test::Unit`\
  \ 的自有扩展。\n- 访问 fixtures，即测试样本数据。我们稍后会详细讨论 fixtures。\n- 你可能编写的任何应用程序范围内的测试助手或断言。\n\
  \n有一点——那行 `fixtures :people`。这一行让固件数据对你的测试可用。它的工作原理如下....\n\n\n\n\nRails 的固件（fixture）系统会寻找与\
  \ `:people` 对应的固件文件，并位于 `test/fixtures` 目录下。这产生了一个名为 `test/fixtures/people.yml`\
  \ 的文件，这也是由 `script/generate` 创建的另一个文件。\n\n`people.yml` 的初始版本如下：\n\n```yaml\n# 请先阅读\
  \ http://ar.rubyonrails.org/classes/Fixtures.html \n\nid: 1\n\nanother:\nid: 2\n\
  ```\n\n该文件采用 YAML 格式，在章节 9.3, YAML 与 XML 比较中有详细介绍，位于第 261. 页。Rails 使用左侧（未缩进）的项来命名\
  \ `Person` 对象：`first` 和 `another`。Rails 使用每个项下方缩进的键值对来初始化供你的测试可用的模型对象。你可以（也应该）根据需要添加键值对，以便为你的测试创建合理的对象。这里有一个更完整的\
  \ `people` 固件版本：\n\n[下载 code/rails_xt/test/fixtures/people.yml](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/test/fixtures/people.yml)\n\
  \n```yaml\nfirst:\n  id: 1\n  first_name: Stuart\n  last_name: Halloway\nanother:\n\
  \  id: 2\n  first_name: Justin\n  last_name: Gehtland\n```\n\nRAILS 测试惯例\n\n在测试中使用固件时，请调用与你的模型类复数形式同名的方法。因此，`:first`\
  \ 人可以通过 `people(:first)` 访问。然后你可以在测试期间根据需要使用该对象：\n\n[下载 code/rails_xt/test/unit/person_test.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/test/unit/person_test.rb)\n\
  \n```ruby\ndef test_find_by_first_name\n  assert_equal people(:first),\n  Person.find_by_first_name('Stuart'\
  \ )\nend\n```\n\nRails 在将固件对象注入你的数据库方面非常聪明。在测试期间，Rails 使用特定于测试的数据库，因此单元测试不会破坏你的开发（或生产！）数据。由于固件提供了可靠的初始设置，你会发现你的模型测试很少需要实现\
  \ `setup()` 方法。\n\n### 管理你的固件数据\n\n遗憾的是，固件的编辑通常变得更加复杂、重复且容易出错。这里有一个走向灾难的 quips 固件：\n\
  \n```yaml\nquip_1:\n  id: 1\n  author_id: 1\n  text: This is quip 1\nquip_2:\n \
  \ id: 2\n  author_id: 1\n  text: This is quip 1\n# 还有 48 个...\n```\n\n幸运的是，Rails\
  \ 为这种重复提供了一种优雅的解决方案。在将固件交给 YAML 解析器之前，Rails 将该文件作为嵌入 Ruby (ERb) 模板进行处理。ERb 是 Ruby\
  \ 的模板语言，这意味着你可以在模板中穿插 Ruby 代码。\n\n使用 ERb，quips 固件变成了这样：\n\n[下载 code/rails_xt/test/fixtures/quips.yml](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/test/fixtures/quips.yml)\n\
  \n```erb\n<% (1..50).each do |i| %>\n  quip_<%= i %>:\n    id: <%= i %>\n    author_id:\
  \ <%= 1+(i%2) %>\n    text: This is quip <%= i %>\n<% end %>\n```\n\nERb 也用于 Rails\
  \ 视图中；请参阅章节 6, 使用 ActionView 输出，位于第 167 页以获取更多 ERb 示例。\n\n验证 quips 是否正确加载非常简单。你可以使用\
  \ `Rake` 任务加载所有固件，然后使用 `script/console` 观察一下：\n\n```bash\n$ rake db:fixtures:load\n\
  (in /Users/stuart/FR_RAILS4JAVA/Book/code/rails_xt)\n$ script/console\nLoading development\
  \ environment.\n>> Quip.count\n=> 50\n```\n\n### 功能性测试\n\n现在你已经看到了模型测试的运行情况，让我们来看看测试一个\
  \ Rails 控制器。\n\n```bash\n$ script/generate controller People\ncreate app/views/people\n\
  create app/controllers/people_controller.rb\ncreate test/functional/people_controller_test.rb\n\
  create app/helpers/people_helper.rb\n```\n\n`app/controllers/people_controller.rb`\
  \ 文件是控制器本身，在章节 5, 使用 ActionController 协调活动中有详细介绍，位于第 133. 页。`app/views/people` 和\
  \ `app/helpers/people_helper.rb` 都是视图代码，在章节 6, 使用 ActionView 输出中有介绍，位于第 167 页。剩下的功能性测试文件\
  \ `test/functional/people_controller_test.rb` 初始看起来如下：\n\n```ruby\nrequire File.dirname(__FILE__)\
  \ + '/../test_helper'\nrequire 'people_controller'\n\n# 抛出控制器捕获的错误。\nclass PeopleController;\n\
  \  def rescue_action(e) \n    raise e \n  end\n\nend\n\nclass PeopleControllerTest\
  \ < Test::Unit::TestCase\n  def setup\n    @controller = PeopleController.new\n\
  \    @request = ActionController::TestRequest.new\n    @response = ActionController::TestResponse.new\n\
  \  end\n\n  # 将此替换为你的真实测试。\n  def test_truth\n    assert true\n  end\nend\n```\n\
  \n如你所见，Rails 中的功能性测试无非针对控制器的单元测试。这里的大部分代码与模型测试用例相似，但有两个值得注意的区别：\n\n- 控制器测试重新打开控制器以重新定义\
  \ `rescue_action()`（等一下：控制器测试重新打开控制器以重新定义 `rescue_action()`）。在生产代码中，`rescue_action()`\
  \ 处理未处理异常的报告和日志。这是类的用处的一个例子，在章节 3.1, 扩展类。\n- 控制器测试有一个 `setup()` 方法，建立了 `@request`\
  \ 和 `@response` 以模拟 HTTP 请求。\n\n### 使用 Rake 进行测试自动化\n\n在前面的示例中，我们从单个 `.rb` 文件运行测试。Rails\
  \ 应用还包含了 `Rake` 任务来自动化运行测试集。`Rake` 是类似于 Ant 的自动化工具，在章节 8, 自动化开发过程中有详细介绍。以下是使用 `test:units`\
  \ Rake 任务运行所有测试的方法：\n\n```bash\n$ rake test:units\n(in /Users/stuart/FR_RAILS4JAVA/Book/code/rails_xt)\n\
  /opt/local/bin/ruby -Ilib:test \"/opt/local/lib/ruby/gems/rake-0.7.1/lib/rake_test_loader.rb\"\
  \n\"test/unit/person_test.rb\" \"test/unit/quip_test.rb\"\nStarted\n..\nFinished\
  \ in 0.315247 seconds.\n2 tests, 2 assertions, 0 failures, 0 errors\n```\n\n`test:units`\
  \ 任务是几个标准测试任务之一，所有任务汇总在下面的图 7.1,。\n\n| 任务 | 用法 |\n| :--- | :--- |\n| `default` |\
  \ 运行单元和功能测试 |\n| `test` | 运行单元和功能测试 |\n| `test:functionals` | 运行所有功能（控制器）测试 |\n\
  | `test:integration` | 运行所有集成测试（跨多个控制器的多会话测试） |\n| `test:plugins` | 测试此 Rails 应用使用的第三方插件\
  \ |\n| `test:recent` | 运行过去十分钟内更改的文件 |\n| `test:uncommitted` | 运行尚未提交到版本控制的文件 |\n\
  \n| `test:units` | 运行所有单元测试 |\n\n此时有人可能会认为你已经拥有了测试 Rails 应用的所有内容。你有一个测试框架（`Test::Unit`）、一个自动化工具（`rake`）以及一个代码生成器（`script/generate`），它们建立了简单易于记忆的命名规范。在章节\
  \ 7.3, Rails 对 Test::Unit 的扩展中，你会看到 Rails 提供了 Test::Unit 的扩展以及一个生成器（script/generate\
  \ scaffold）来向你展示如何使用它们。\n\n\n\n\n\n开始学习 Rails 对 `Test::Unit` 扩展最好的方法是查看 Rails 脚手架（scaffold）免费提供的测试：\n\
  \n```bash\n$ script/generate scaffold Person\n```\n\n大部分脚手架代码在《十五分钟 Rails 战》第 21\
  \ 页的“Rails 应用程序”章节中进行过。在这里，我们将重点关注一个生成的文件，即功能测试 `test/functional/people_controller_test.rb`。我们将逐行分解\
  \ `PeopleControllerTest` 类。首先，测试包含了固件（fixtures）：\n\n[下载代码 code/rails_xt/test/functional/people_controller_test.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/test/functional/people_controller_test.rb)\n\
  \n```ruby\nfixtures :people, :users\n```\n\n脚手架生成器假设 `PeopleController` 处理的是人员（people），并此设置了固件。除了最简单的应用程序外，你都会发现控制器有时会与多个一个模型类交互。当发生这种情况时，只需在\
  \ `fixtures` 行中添加更多模型即可。例如：\n\n```ruby\nfixtures :people, :widgets, :thingamabobs,\
  \ :sheep\n```\n\n接下来是 `setup` 方法：\n\n```ruby\ndef setup\n  @controller = PeopleController.new\n\
  \  @request = ActionController::TestRequest.new\n  @response = ActionController::TestResponse.new\n\
  end\n```\n\n几乎所有的功能测试都会模拟一个（或多个）网络请求/响应循环。因此，`@request` 和 `@response` 变量会在每个测试中实例化。\n\
  \n现在来看真正的测试。脚手架生成了一个索引页，它只需渲染模型内容的列表视图。这是索引页的测试：\n\n```ruby\ndef test_index\n  get\
  \ :index\n  assert_response :success\n  assert_template 'list'\nend\n```\n\n首先，`get()`\
  \ 方法模拟控制器上的 HTTP GET。这里看到的单参数版本指定了一个 Rails action 名称。然后，Rails 断言 `assert_response\
  \ :success` 断言响应是成功的，即 HTTP 状态码 200。Rails 断言 `assert_template 'list'` 断言响应是从 list\
  \ 模板渲染的。\n\n作为 Java 程序员，我们忍不住想问：“对象在哪里？”也许 `test_index()` 应该更像下面的代码，带有显式对象：\n\n\
  ```ruby\n# 假设，带有显式对象\n@controller.get :index\nassert_equal :success, @response.status\n\
  assert_equal 'list' , @response.template\n```\n\n之前的两个示例在功能上是等价。区别在于风格。在 Java 中，我们倾向于让对象显式化。在\
  \ Ruby 中，特别是在 Rails 中，我们倾向于尽可能让显而易见的事情保持隐式。尝试大声读这两个版本，以更好地感受差异。接下来，脚手架测试了 list action：\n\
  \n```ruby\ndef test_list\n  get :list\n  assert_response :success\n  assert_template\
  \ 'list'\n  assert_not_nil assigns(:people)\nend\n```\n\n这段代码大部分内容在 `test_index()`\
  \ 中已经熟悉。新部分是以下：\n\n```ruby\nassert_not_nil assigns(:people)\n```\n\n`assigns` 变量是特殊的。如果你在控制器中创建一个实例变量，该变量将魔法般地对你的视图模板可用。这种魔法其实非常简单：Rails\
  \ 使用反射将控制器变量复制到一个集合中，然后该集合被复制回视图实例中。该集合命名为 `assigns`，因此之前的断言可以读作“断言控制器了一个名为 people\
  \ 的非空变量”。\n\n接下来，脚手架测试了 show action：\n\n```ruby\ndef test_show\n  get :show, :id\
  \ => 1\n  assert_response :success\n  assert_template 'show'\n  assert_not_nil assigns(:person)\n\
  \  assert assigns(:person).valid?\nend\n```\n\n这个测试看起来有点不同，因为 `show` 方法期望显示一个特定的人。Rails\
  \ 的默认行为是通过在 URL 中添加 `id` 来识别特定的模型实例，因此对 `get()` 的调用包含了第二个参数来传递人的 id：\n\n```ruby\n\
  get :show, :id => 1\n```\n\n`get()` 的通用形式可以处理请求的任何可能：`get(action=nil, parameters=nil,\
  \ session=nil, flash=nil)`\n\n我们如何确保 ID 为 1 的人员存在？首先查看固件文件 `test/fixtures/people.yml`：\n\
  \n[下载代码 code/rails_xt/test/fixtures/people.yml](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/test/fixtures/people.yml)\n\
  \n```yaml\nid: 1\nfirst_name: Stuart\nlast_name: Halloway\n```\n\n`test_show()`\
  \ 的另一个新颖之处是 `valid?()` 测试：\n\n```ruby\nassert assigns(:person).valid?\n```\n\n这只是\
  \ ActiveRecord 对验证的标准支持，在第 113 页的第 4.5 节“验证数据值”中讨论过。当你向 `Person` 类添加验证方法时，`valid()`\
  \ 调用将自动变得更智能。\n\n脚手架的 `test_new()` 没有引入任何新概念，所以我们跳过它。接下来是 `test_create()`：\n\n[下载代码\
  \ code/rails_xt/test/functional/people_controller_test.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/test/functional/people_controller_test.rb)\n\
  \n```ruby\ndef test_create\n  num_people = Person.count\n  post :create, :person\
  \ => {}\n  assert_response :redirect\n  assert_redirected_to :action => 'list'\n\
  \  assert_equal num_people + 1, Person.count\nend\n```\n\n这引入了一些新想法。与之前的方法不同，`create`\
  \ 会实际改变数据库。这对我们的测试有几个影响。首先，测试调用 `post()` 而不是 `get()`，因为 `create()` 操作不是幂等的。其次，我们想要测试数据库的变化。以下行：\n\
  \n```ruby\nnum_people = Person.count\n```\n\n捕获了操作之前的人数，接下来的行：\n\n```ruby\nassert_equal\
  \ num_people + 1, Person.count\n```\n\n验证确实创建了一个人。另一个操作意味着我们应该期望 `:success` 响应。相反，成功的更新会重定向到\
  \ show action。以下行：\n\n```ruby\nassert_response :redirect\nassert_redirected_to :action\
  \ => 'list'\n```\n\n验证了 `create()` 正确重定向。\n\n剩余的脚手架方法 `test_edit()`、`test_update()`\
  \ 和 `test_destroy()` 没有引入新概念，尽管你可能想阅读它们来巩固对脚手架的理解。\n\n幂等操作可以执行任意次而不会产生除执行一次之外的影响。幂等操作对代理和缓存非常友好，因为偶尔额外执行操作除了浪费带宽外没有坏处。幂等操作有自己的\
  \ HTTP 动（GET）。\n\n为什么脚手架在 POST 后重定向\n\n在 POST 后重定向使用户难以意外提交相同的更新。（你可能在编写的 Web 应用中见过双更新问题。一个症状是浏览器警告“您准备重新提交包含\
  \ POST 数据的。确定吗？”）\n\nRails 应用通常不受双更新问题的影响，因为一个合理的解决方案（重定向）已经内置在脚手图中。\n\n**7.4 集成测试**\n\
  \n集成测试是在 Rails 1.1 中引入的。你可以使用 `integration_test` 生成器创建集成测试：\n\n```bash\nscript/generate\
  \ integration_test QuipsSample\n```\n\n集成测试与其他测试一样开始，包含 `TestHelper` 和任何必要的固件。唯一的区别是它们扩展了\
  \ `ActionController::IntegrationTest`：\n\n[下载代码 code/rails_xt/test/integration/quips_sample_test.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/test/integration/quips_sample_test.rb)\n\
  \n```ruby\nrequire \"#{File.dirname(__FILE__)}/../test_helper\"\n```\n\n\n\n\n```ruby\n\
  class QuipsSampleTest < ActionController::IntegrationTest\n  fixtures :quips, :users,\
  \ :roles, :roles_users\nend\n```\n\n在最简单的情况下，集成测试看起来就像功能测试的另一种语法：\n\n```ruby\ndef\
  \ test_index_redirects_to_login\n  get '/quips/index'\n  assert_response :redirect\n\
  \  follow_redirect!\n  assert_response :success\n  assert_template 'account/login'\n\
  end\n```\n\n在 `test_index_redirects_to_login` 中，对 `get` 的调用接收实际 URL，而不是路由参数的哈希。这同时也隐式地测试了路由代码。如果你不想这样做，可以始终传递标准的\
  \ `url_for` 参数。\n\n# 集成测试\n\n集成测试的闪光之处在于将低级测试原语组合成可识别的用户操作。为了演示这一点，让我们写一个测试，用于演示一个假设的用户（Quentin）登录并销毁一条\
  \ quip（短消息/动态）。首先，我们编写测试本身：\n\n```ruby\ndef test_quentin_deletes_post\n  user_session(:login=>:quentin,\
  \ :password=>:test) do |quentin|\n    quentin.logs_in\n    quentin.destroys_quip(1)\n\
  \  end\nend\n```\n\n这种语法的巧妙之处在于非常像英语：“使用凭据 `quentin/test`，Quentin 登录并销毁 Quip 1。”\
  \ 现在我们只需要让这种语法工作起来。\n\n集成测试提供了一个 `open_session` 方法，它创建一个会话来表示单个用户与应用程序的交互。我们可以基于\
  \ `open_session` 实现我们的 `user_session`：\n\n```ruby\ndef user_session(credentials)\n\
  \  open_session do |sess|\n    sess.extend UserActions\n    sess.credentials = credentials\n\
  \    yield sess\n  end\nend\n```\n\n`open_session` 返回的 `sess` 对象实现了所有的集成测试方法：`get`、`post`、`assert_response`、`follow_redirect!`\
  \ 等。当然，它没有实现我们领域特定的方法 `logs_in` 和 `deletes_quip`。不用担心。在 `user_session` 中，我们只需让 `sess`\
  \ 扩展一个名为 `UserActions` 的模块，该模块提供了这些方法。\n\n最后，我们创建一个私有模块 `UserActions` 来定义我们的领域特定方法：\n\
  \n```ruby\nprivate\nmodule UserActions\n  attr_accessor :credentials\n  def logs_in\n\
  \    post '/account/login' , credentials\n    assert_response :redirect\n    follow_redirect!\n\
  \    assert_response :success\n    assert_template 'account/index'\n  end\n\n  def\
  \ destroys_quip(id)\n    post '/quips/destroy' , :id=>id\n    assert_response :redirect\n\
  \    follow_redirect!\n    assert_response :success\n    assert_template 'quips/list'\n\
  \  end\nend\n```\n\n现在我们有了 `logs_in` 和 `deletes_quip`，我们可能会在许多其他测试中重用它们。\n\n你可能认为我们是倒着完成整个示例的。我们从顶部开始（可识别的用户操作），并构建了底层的管道管道设施。在很多情况下，从底部开始然后组合高层操作可能会更容易。\n\
  \nRuby 的一个很棒的特性是你可以双向进行（或中间的任何方式）。有时从顶部开始可以帮助你创建一个更好的 API：暂时忘记什么是可能的，只管写出你意图的最佳表达式。然后利用\
  \ Ruby 的灵活性让语法为你你服务，而不是反之。\n\n你可能还会选择用在 Web 浏览器中运行的自动化测试来补充或取代集成测试。在浏览器中进行测试评估的是系统的外部接口，而无需对实现细节有任何知识或假设。\n\
  \n`Selenium` 是这种测试的极佳开源框架，并涵盖在章节 6.10, 使用 Selenium 进行黑盒测试中，位于第 192. 页。\n\n# 7.5\
  \ Rails 测试示例\n\n本节演示了几个来自真实世界的单元测试：Rails 自身的测试套件。我们挑选了这些测试来突出 Ruby 库或语言如何导致了在 Java\
  \ 中是不寻常甚至不可思议的方法。\n\n## 测试 Inflector\n\n`Inflector` 模块实现了 Rails 对名称的所有巧妙管理，例如在单数和复数之间的转换：\n\
