  \ Inflector 部分混乱部分的还原性翻译：**\n\n`Inflector` 模块实现了 Rails 对名称的所有巧妙管理，例如单数和复数之间的转换：\n\
  \n```bash\n$ script/console\nLoading development environment.\n>> Inflector.pluralize\
  \ \"robot\"\n=> \"robots\"\n>> Inflector.pluralize \"pony\"\n=> \"ponies\"\n>> Inflector.pluralize\
