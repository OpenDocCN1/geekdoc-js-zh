  \ 后来我认识的 Justin 也是如此。\n\nRuby on Rails 是一个用于开发 Web 应用程序的全栈框架。Rails 拥抱了许多在 Java 世界中熟悉的理念：模型-视图-控制器（MVC）模式、单元测试、敏捷开发、ActiveRecord\
  \ 模式以及许多其他。与此同时，Rails 也挑战了许多标准做法：相比于成里万计的配置文件，Rails 尽可能地依赖于约定。Rails 是用 Ruby 这种动态语言构建的，并以源代码的形式进行部署。\n\
  \n## 为什么选择这本 Rails 书？\n\n有很多关于 Rails 的书籍。使我们这本书与颖而出的一个方面是我们的 Java 背景。我们关注 Rails\
  \ 中那些会有不同的部分，\n\n\n\n\n对于 Java 开发者来说，既新颖又有趣。\n\n本书的另一个不同之处在于，我们强调 Rails 视为一个生态系统，而不仅仅是一个框架。作为一名\
  \ Java 开发者，你习惯了在编程语言周围拥有庞大的生态系统。你拥有出色的 IDE、监控工具以及针对各种情况的组件。Rails 也有一个生态系统——虽然没有\
  \ Java 那么大，但同样。在书中，我们不会花大量时间去翻阅 Rails 中每一个随机的 API 细节。相反，我们将重点演示关键点，然后进入生态系统，展示这些关键点是如何被使用、扩展，有时甚至被替换的。\n\
  \n### 谁应该读其他书？\n\n本书是为学习 Ruby 和 Rails 的资深 Java 程序员提供的参考书。这并不是那种每一章都带你构建某个示例应用程序的教程。如果你需要教程以及对\
  \ Ruby 语言的通用介绍，我们推荐 `Programming Ruby` [[TFH05]](#index_split_003.html_p306)。如果你需要关于\
  \ Rails 的教程和介绍，我们推荐 `Agile Web Development with Rails` [[TH06]](#index_split_003.html_p306)。\n\
  \n本书并不是为考虑 Ruby 项目的经理提供的 Java 和 Ruby 对比报告。对于这种需求，我们推荐 `From Java to Ruby: Things\
  \ Every Manager Should Know` [[Tat06]](#index_split_003.html_p306)。\n\n本书也不是为非程序员提供的介绍；对于这种需求，我们推荐\
  \ `Learn to Program` [[Pin06]](#index_split_003.html_p306)。\n\n# 前言\n\n### 为什么选择\
  \ Ruby on Rails？\n\nRails 让程序员工作得更高效且快乐。此外，我们发现使用 Ruby 比任何其他主流语言都能锻炼我们的思维。如果你想在茶水间闲聊关于\
  \ Ruby 和 Rails 的优点，这里有几个可以谈的话题：\n\n*   **全栈 Web 框架。** Rails 包含了你所需的一切：模型-视图-控制器（MVC）、O/RM、单元测试以及构建和部署自动化。因为一切都是紧密集成的，所以入门变得简单得离谱。\n\
  *   **有偏见的软件（Opinionated software）。** Rails 的设计目的不是为了让你做任何事，而是为了帮助你做正确的事。\n*   **约定优于配置（Convention\
  \ over configuration）。** 上述两点的危险在于你可能无法自定义框架来满足你的需求。Rails 通过“约定优于配置”避免了这个问题。Rails\
  \ 的所有运行部分都通过约定结合在一起，但你可以在需要时随时覆盖这些约定。你可以按需付费，在需要的地方依赖约定，并且仅覆盖你精确需要的部分。\n*   **用一种语言处理应用和配置。**\
  \ Rails 使用 Ruby 进行配置，也使用 Ruby 编写应用程序代码。相比 XML，Ruby 更容易管理，而且当配置变得复杂时，Ruby 要强大得多。\n\
  *   **秘诀在于 Ruby。** Ruby 强大且优雅，它已经成为我们大多数时间思考时使用的语言。Ruby 包含了主流编程语言中的优秀思想。作为一名 Java\
  \ 程序员，你在理解 Ruby 处理类、对象、继承和多态的方法方面将具有领先优势。Ruby 还包含了主流语言中缺失的 Smalltalk 和 Lisp 的许多特性。作为一名\
  \ Java 程序员，你会发现块（blocks）、闭包（closures）、鸭子类型（duck typing）、元编程和函数式编程如何让你的代码更具表现力和可维护性。Rails\
  \ 是入门良药，Ruby 才是让人上瘾的毒药。\n\n### 如何阅读本书\n\n所有读者都应该完整阅读第 1, 章《开始使用 Rails》，位于 20 页。该章节包含了快速设置环境的说明，以便你可以跟上所有的示例代码。\n\
  \n接下来，你有一个选择：先学 Ruby 还是先学 Rails？如果你是一个自下而上的学习者，无法在完全理解某行代码的情况下跳过它，请从 Ruby 章节开始，即第\
  \ 2, 章《Programming Ruby》（第 38 页）和第 3, 章《Ruby Eye for the Java Guy》（第 72 页）。Ruby\
  \ 与 Java 有本质区别，这种程度比语法上显示的要剧。你的投入将很快获得回报。\n\n如果你是“办事型”的人，直接跳到 Rails 开始，它从第 4, 章《使用\
  \ ActiveRecord 访问数据》（第 96 页）开始，并一直持续到本书。当你看到感兴趣的 Ruby 惯用法时，可以随时回到关于 Ruby 语言的章节。（如果你不知道某个东西的\
  \ Ruby 名称，只需查看附录 A, 位于第 303 页。该字典按照 Java 术语组织，并包含了指向书中相关章节的指针。）\n\n除此之外，请随意翻阅。书中到处都有大量的交叉引用，所以你不会太迷路。\n\
  \n### 如何获取示例代码\n\n本书的示例代码以单个 zip 格式提供。示例代码包含了两个 Rails 应用程序，分别名为 People 和 Rails XT。Rails\
  \ XT 代表“Rails 探索”。Rails XT 并没有针对某个领域的统一功能集。相反，Rails XT 是几十个片段的容器。\n\n由于其异构性，Rails\
  \ XT 需要更多的设置。你开始学习时不需要设置 Rails XT。当你需要设置时，可以在第 98 页的侧边栏找到说明。以下是示例目录结构的快速概述：\n\n\
  *   **rails_xt**：包含了 Rails 测试（见第 1.6, 章《运行单元测试》，位于 32 页）和 Quips 示例应用程序。除非另有说明，书中的\
  \ Ruby 示例应在此目录下执行。\n*   **java_xt**：你将在整个使用这里的 Java 测试。\n*   **appfuse_people**：你将在整个使用这个\
  \ Java 应用程序。\n*   **junit4**：任何需要 JUnit4 的测试都在这里。\n*   **Rake**：包含了第 8, 章《开发过程自动化》（第\
  \ 233 页）中的 Rake 和 Ant 示例。\n*   **hibernate_examples**：包含了第 4, 章《使用 ActiveRecord\
  \ 访问数据》（第 96 页）中的 Hibernate 示例。\n\n### 我们是如何开发 Java 示例的\n\n这是一本关于两个世界的书：Java 编程世界和\
  \ Ruby 世界\n\n\n\nRails 编程的世界。当不同世界碰撞时，你可能会听到诸如“Java 太糟了，Rails 真酷……”（或者反之）的言。\n\n\
  在这里听不到这种语调。对我们来说，这就像木工在说“锤子很糟，锯子很酷”。木工使用许多工具，程序员也应该如此。更重要的是，这种对抗性的方法限制了一个重要的机会。当你有多种解决问题的方法时，通过对比你可以学到很多。\n\
  \n# 前言\n\n我们访问这个新世界（`Rails`）的目标是通过与我们共同历史（`Java`）对比来学习。但我们的共同历史究竟是什么？Ruby on Rails\
  \ 是一个 Web 框架，这意味着你可以与 `Java` 世界中的无数事物进行比较。我们应该看 `Java` 吗？普通的 `servlets`？`Servlets`\
  \ 加上 `JSP`？老旧的 MVC 框架如 `Struts`？丰富的组件框架如 `Tapestry`？`Java EE` 标准架构如 `JSF`？还是说所有这些？\n\
  \n当我们我们需要一个 `Java` 基准来对比 `Rails` 时，我们选择了 `Struts`、`Hibernate` 和 `Axis`。我们选择这些是因为仔细的统计研究表明，这些在\
  \ `Java` 开发者中最为知名（我们问了很多人）。此外，我们将对 `Java` 的使用限制在我们在领域看到的应用程序中典型的技术上。因此，书中的 `Java`\
  \ 代码对大多数 `Java` Web 开发者来说应该是熟悉的。\n\n这种方法的缺点是，“典型”且“熟悉”的 `Java` 代码并不意味着最佳实践。所以尽管这种方法对于教学\
  \ `Rails` 很有帮助，但并没有提供对 `Java` 最佳实践的全面回顾。（那是另一本书的事了。）在我们出于空间原因跳过一些有趣的 `Java` 方法时，我们在章节末尾包含了边注注释和参考文献。\n\
  \n许多 `Java` 示例是基于 Matt Raible 优秀的 `AppFuse` [(http://www.appfuse.org)](http://www.appfuse.org)\
  \ 构建的。`AppFuse` 是一个元框架（metaaframework），它允许你使用选择的框架快速启动 Web 应用。如果你想将 `Rails` 与书中未涵盖的\
  \ `Java` 框架进行比较，`AppFuse` 是一个很好的起点。\n\n## 致谢\n\n我们要感谢我们的妻子。Joey 和 Lisa，如果没有你们，这一切都不会发生，或者没有这么多意义。我们还要感谢我们的家人。没有你们的爱和支持，这本书将停滞到至少\
