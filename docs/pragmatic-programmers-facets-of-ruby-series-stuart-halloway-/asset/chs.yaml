  \n```ruby\n# 假设\ndef test_pluralize\n  assert_equal \"searches\" , Inflector.pluralize(\"\
  search\" )\n  assert_equal \"switches\" , Inflector.pluralize(\"switch\" )\n  #\
  \ 等\nend\n```\n\n实际的测试代码看起来像这样：\n\n```ruby\nSingularToPlural = {\n  \"search\" =>\
  \ \"searches\",\n  \"switch\" => \"switches\",\n  \"fix\" => \"fixes\"\n}\n\nSingularToPlural.each\
  \ do |singular, plural|\n  define_method \"test_pluralize_#{singular}\" do\n   \
  \ assert_equal plural, Inflector.pluralize(singular)\n  end\nend\n```\n\n(注：由于您提供的原文在\
  \ `Inflector` 之后存在大量重复和乱码，上述翻译已根据文档工程师逻辑对内容进行了修复和整合，确保通顺且符合 Markdown 格式)。\n\n\n\n\
  \n在 Rails 中，当测试的设置（setup）和清理（teardown）需要一些“小技巧”时，这个问题偶尔会出现。Rails 代码库中最常见的例子是重置常量。通常，重置常量并不是好主意，并且产生警告。但当你为特定测试创建沙箱时，重置常量可能正是你所需要的。许多\
  \ Rails 测试使用了名为 `Post` 的示例结构体（struct）的不同版本。这不会引起警告，因为冲突的 `Post` 版本是在 `silence_warnings`\
  \ 内部创建的：\n\n[下载 code/rails/actionpack/test/template/date_helper_test.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails/actionpack/test/template/date_helper_test.rb)\n\
  \n```ruby\nsilence_warnings do\n  Post = Struct.new(\"Post\" , :written_on, :updated_at)\n\
  end\n```\n\n`silence_warnings()` 方法在块执行期间关闭警告。这种块语法在这里特别好，因为通过缩进，你不需要了解 Ruby 就能猜出\
  \ `silence` 的作用。它的工作原理如下：\n\n[下载 code/rails/activesupport/lib/active_support/core_ext/kernel/reporting.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails/activesupport/lib/active_support/core_ext/kernel/reporting.rb)\n\
  \n```ruby\ndef silence_warnings\n  old_verbose, $VERBOSE = $VERBOSE, nil\n  yield\n\
  \  ensure\n    $VERBOSE = old_verbose\n  end\nend\n```\n\n`silence_warnings()` 保存了当前的\
  \ `$VERBOSE` 级别，将 `$VERBOSE` 设置为 `nil`，执行其块，并恢复原来的 `$VERBOSE` 级别。你会发现，每当你需要这种“包装”行为时，块都是非常有用的。\n\
  \nJava 中存在相同的句用法吗？某种程度上是。另一个“包装”行为有用的地方是打开和关闭数据库连接。在 Java 中，Spring 框架封装了 JDBC 调用，因此你不需要手动管理\
  \ `finally` 块并显式地 `close()` JDBC 连接：\n\n```java\n//t 是一个 Spring JDBCTemplate\nList\
  \ l = t.query(\"SELECT title FROM events\" , new RowMapper() {\n  public Object\
  \ mapRow(ResultSet rs, int i) throws SQLException {\n    return rs.getString(\"\
  title\" );\n  }\n});\n```\n\n在 Ruby 中你会使用块，而在 Java 中你会看到一个单方法接口（例如 `RowMapper`），加上一个用于实现单个方法的匿名内部类（例如\
  \ `mapRow()`）。语法很重要。匿名内部类的句法足够臃肿，以至于它通常不被使用，即使在那些可以极大地减少代码重复（DRY）的地方也是如此。Ruby 的块在\
  \ Java 中使用匿名内部类的大多数地方都是合适的。\n\n### 7.6 使用 rcov 测量代码覆盖率\n\n代码覆盖率衡量测试对代码的覆盖程度。代码覆盖率自\
  \ 20 世纪 60 年代一直存在。在 Java 世界，代码覆盖由 `Cobertura` 等开源工具以及包括 `Clover` 在内的商业产品提供。在 Ruby\
  \ 世界，你可以使用开源的 `rcov` 进行代码覆盖。`rcov` 以 gem 的形式提供，你可以通过以下方式安装：\n\n```bash\ngem install\
  \ rcov\n```\n\n测量代码覆盖率所需的插桩可能会让你的测试运行变慢——慢得多。为了抵消这一点，`rcov` 包含一个原生扩展，使得 `rcov` 的运行速度快了\
  \ 100 倍。你绝对应该编译这些扩展。安装 `rcov` 后，进入安装 `rcov` 的 gems 目录，运行以下命令：\n\n```bash\nruby setup.rb\n\
  ```\n\n安装完成后，`rcov` 可以作为 Rake 任务和命令行工具 `rcov` 使用。我们将演示 Rake 任务版本。在 People 示例应用程序中，有一个覆盖任务：\n\
  \n[下载 code/people/lib/tasks/rcov.rake](http://media.pragprog.com/titles/fr_r4j/code/code/people/lib/tasks/rcov.rake)\n\
  \n```ruby\nnamespace 'rcov' do\n  begin\n    require 'rcov/rcovtask'\n    Rcov::RcovTask.new\
  \ do |t|\n      t.name = 'test'\n      t.libs << \"test\"\n      t.test_files =\
  \ FileList['test/**/*test.rb' ]\n      t.verbose = true\n      t.rcov_opts = ['-x'\
  \ , '^lib,^config/boot' ]\n    end\n  rescue LoadError\n    # ignore missing rcov\n\
  \  end\nend\n```\n\n![Image 49](img/index-223_1.jpg)\n图 7.2：rcov 报告表明需要测试\n\n在第\
  \ 7 行，`test_files` 访问器指定了要运行的测试。运行测试时，`rcov` 将生成一份报告显示哪些行被覆盖了。`rcov` 会自动从报告中排除某些文件（可能你对\
  \ Ruby 标准库或测试本身的代码覆盖并不感兴趣）。我们想要排除更多文件，因此在第 9 行，`rcov_opts` 排除了 `lib,config/boot`。\n\
  \n任务就完成后，`rake rcov:test` 将生成一组 HTML 报告。点击文件名将用绿色显示已覆盖的行，红色显示未覆盖的行。![Image 50](img/index-224_1.jpg)\n\
  图 7.3：带有颜色的 rcov 报告\n\n添加相应的测试后，再次运行 `rcov` 显示所有行均已覆盖。\n\n我们发现代码覆盖是整体策略的重要部分，但如果没有上下文，原始百分比是没有意义的。几个因素会产生虚高或虚低的覆盖率：\n\
  \n字体 写入方法（如 `attr_accessor`）创建了没有对应源代码的方法。行覆盖中这些是不可见的。\n- 行覆盖也会遗漏其他情况。如果一个方法组合了多个布尔表达式并产生分支，简单的行覆盖无法保证所有表达式都经过了测试。\n\
  - 报告的文件选择可能会噪声淹没数据。\n\n与其纠结于绝对数值，跨库或跨时间比较覆盖率更有用。如果某些模块的覆盖率始终低于其他模块，为什么呢？可能有合理的理由，记录下来是明智的。如果特定模块的覆盖率随时间推移而上升或下降，这表明测试质量发生了真实变化，还是其他现象的产物？覆盖率在估算变更请求相关的风险时特别有用。如果代码的覆盖率很高，那么该代码的工作估算可能会更可靠。\n\
  \n我们还发现代码覆盖测试也有边缘益处。`rcov` 运行测试的顺序与 Rake 不同。由于测试应该是独立的，运行顺序不应该有影响。但根据我们的经验，意外的依赖往往会渗透，而\
  \ `rcov` 经常会将这些问题暴露。我们认识的一个团队将其推向极端，在 Rake 中添加了随机器，使得每次运行测试的顺序都不同。\n\n## 7.7 使用\
  \ Mock 对象测试交互\n\n到目前为止，本章的示例关注测试对象状态。大多数测试都是这样编写的：\n\n1. 创建要测试的对象。\n2. 在对象上调用方法。\n\
  3. 断言对象的状态是有效的。\n\n这种测试方法在你想要时可能会导致问题：\n\n\n\n测试的对象与其他对象存在非平凡的关系。想象以下场景：\n\n1. 创建一个你想要测试的对象\
  \ `A`。\n2. 调用 `A` 上的某些方法。这些方法调用了对象 `B` 和 `C` 上的其他方法。\n3. 断言 `A`、`B` 和 `C` 处于有效状态。\n\
  \n哎。现在我们对 `A` 的测试依赖于 `B` 和 `C` 的实现细节。理想情况下，我们希望隔离测试 `A`。这个困境的解决方案是 mock 对象（模拟对象）。mock\
  \ 对象执行两个任务：首先，mock 对象替换了我们不感兴趣的对象；其次，它记录了对该对象的调用。稍后我们可以验证是否执行了正确的调用以及顺序顺序。我们不是在测试状态，而是在测试交互。之前的场景变成了：\n\
  \n1. 创建一个你想要测试的对象 `A`。\n2. 为 `B` 和 `C` 创建 mock 对象。\n3. 为 `B` 和 `C` 如何被使用设置期望：即期望（expectations）。\n\
  4. 调用 `A` 上的某些方法。这些方法调用了（模拟！）对象 `B` 和 `C` 的其他方法。\n5. 断言 `A` 处于有效状态。\n6. 验证 mock\
  \ 对象。验证会将你的期望与对 `B` 和 `C` 执行的实际调用进行比较，如果不匹配则测试失败。\n\n# 使用 mock 对象测试交互\n\n为了看到 mock\
  \ 对象在实践中如何有用，考虑你将如何为我们的 Struts 示例应用程序中的管理层编写测试。如 `PersonManager` 等类将其大部分工作委托给 DAO\
  \ 层中的实例，例如 `PersonDao`。要测试 `PersonManager`，我们需要为 `PersonDao` 创建一个 mock 实例。然后我们可以对该\
  \ mock 设置期望，调用 `PersonManager` 上的某些方法，并验证 `PersonDao` 是否按预期被使用。\n\n由于 Java SDK 不包含对\
  \ 对象的支持，第一步是选择一个第三方框架。我们将使用流行的开源库 `jMock`：\n\n[下载代码/appfuse_people/test/service/com/relevancellc/people/service/PersonManagerTest.java](http://media.pragprog.com/titles/fr_r4j/code/code/appfuse_people/test/service/com/relevancellc/people/service/PersonManagerTest.java)\n\
  \n```java\nimport org.jmock.Mock;\n```\n\n我们在测试设置中实例化对象：\n\n```java\nprotected void\
  \ setUp() throws Exception {\n    super.setUp();\n    personDao = new Mock(PersonDao.class);\n\
  \    personManager.setPersonDao((PersonDao) personDao.proxy());\n}\n```\n\n接下来，我们编写测试：\n\
  \n```java\npublic void testGetPeople() throws Exception {\n    List results = new\
  \ ArrayList();\n    person = new Person();\n    results.add(person);\n    personDao.expects(once()).method(\"\
  getPeople\" )\n        .will(returnValue(results));\n    List people = personManager.getPeople(null);\n\
  \    assertTrue(people.size() == 1);\n    personDao.verify();\n}\n```\n\n在第 6 行，我们为\
  \ `personDao` 设置了期望。`getPeople` 方法应该被调用一次，返回 `Person` 对象的列表。注意这些 API 调用读起来几乎像英语。接下来，我们调用\
  \ `personManager`。最后，在第 10 行，我们验证了 `personManager` 的行为符合预期。在这种情况下，我们完全没有测试任何状态；我们只是在测试\
  \ `personManager` 是否按预期与 `personDao` 进行了交互。\n\n与 Java 一样，Ruby 也不自带 mock 对象库。我们将使用\
  \ `FlexMock`。你可以通过 RubyGems 安装 FlexMock：\n\n```bash\ngem install flexmock\n```\n\
  \n为了让 `FlexMock` 在 Rails 应用程序中的所有测试可用，请在 `test_helper.rb` 中引入它：\n\n[下载代码/rails_xt/test/test_helper.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/test/test_helper.rb)\n\
  \n```ruby\nrequire 'flexmock'\n```\n\n现在来写测试。Rails XT 示例应用程序没有管理层，因此我们将在控制器层引入一个新功能。用户不再简单地访问所有的\
  \ quips，而是被允许根据其偏好过滤 quips。我们的应用程序将用户偏好存储在 session 中，并使用第三方 API 过滤内容。第三方 API 将通过控制器上的\
  \ `@filter_service` 实例来实现。\n\n可以通过独立类调用 `FlexMock` API。然而，更简单的方法是通过包含 `FlexMock::TestCase`\
  \ 开始我们的测试用例：\n\n[下载代码/rails_xt/test/functional/quips_controller_test.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/test/functional/quips_controller_test.rb)\n\
  \n```ruby\ninclude FlexMock::TestCase\n```\n\n添加 `FlexMock::TestCase` 为我们提供了创建 mock\
  \ 对象的辅助方法，并在拆卸阶段（teardown）期间自动验证 mock 对象。\n\n`QuipsController` 应该提供一个新方法 `list_with_user_filter`。该方法应该返回所有\
  \ quips，减去任何被 `FilterService` 拒绝的 quips。以下是测试代码：\n\n[下载代码/rails_xt/test/functional/quips_controller_test.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/test/functional/quips_controller_test.rb)\n\
  \n```ruby\ndef test_list_with_user_filter\n  filter = flexmock(\"filter\")\n  controller.instance_variable_set('@filter_service',\
  \ filter)\n  get :list_with_user_filter\n  assert_equal [quips(:quip_1)], assigns(:quips)\n\
  \  assert_response :success\n  assert_template 'list_with_user_filter'\nend\n```\n\
  \n\n\n\n# 使用存根对象（Stub Objects）减少依赖\n\n229\n\n## 7.8 使用存根对象减少依赖\n\n编写依赖于其他类的脆弱测试是非常容易的。想一下你会如何测试这个简单的控制器方法：\n\
  \n[下载 code/people/app/controllers/people_controller.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/app/controllers/people_controller.rb)\n\
  \n```ruby\ndef create\n  @person = Person.new(params[:person])\n  if @person.save\n\
  \    flash[:notice] = 'Person was successfully created.'\n    redirect_to :action\
  \ => 'list'\n  else\n    render :action => 'new'\n  end\nend\n```\n\n为了测试代码的两个分支，你需要一个有效的\
  \ `Person` 对象和一个无效的 `Person` 对象。问题在于，你本应该测试 `PersonController`，而不是 `Person`。如果你为真实的\
  \ `Person` 类选择了有效和无效的参数，你就引入了对 `Person` 的依赖。这是一个维护上的头疼。当你更改 `Person` 时，你会破坏 `PersonTest`（没关系），但你也会破坏\
  \ `PersonControllerTest`（哎）。\n\n为了避免这个问题，我们可以测试 `Person` 的存根版本。存根将 `Person` 替换为我们在本地定义的行为，从而打破外部依赖。这听起来可能与上一节的模拟对象（mock\
  \ objects）相似，事实确实如此。事实上，我们将对存根使用相同的库 `FlexMock`。以下是一个创建 `Person` 的基于存根的测试：\n\n[下载\
  \ code/people/test/functional/people_controller_test.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/test/functional/people_controller_test.rb)\n\
  \n```ruby\ndef test_create_succeeds\n  flexstub(Person).should_receive(:new).and_return\
  \ {\n    flexmock('person' ) do |m|\n      m.should_receive(:save).and_return(true)\n\
  \    end\n  }\n  post :create\n  assert_response :redirect\n  assert_redirected_to\
  \ :action => 'list'\nend\n```\n\n在第 2 行，`flexstub` 临时修改了 `Person` 的行为。在本次测试的剩余时间内，对\
  \ `Person.new` 的调用将执行这段代码块。在第 3 行我们模拟了一个 `Person` 实例，在第 4 行我们让 `save` 始终成功。这个测试方法将测试控制器如何处理成功的\
  \ `Person` 创建，而取决于真实的 `Person` 类如何工作。\n\n## 进阶考虑\n\n测试失败情况稍微复杂一些，因为失败情况会将 `Person`\
  \ 实例交给 `new.rhtml`。模板期望 `Person` 实现了各种访问器并返回一个可以运行的 `errors` 属性。这需要另一个对 `errors`\
  \ 集合的 mock，外加上 `should_ignore_missing` 调用来让 mock 更具包容性：\n\n[下载 code/people/test/functional/people_controller_test.rb](http://media.pragprog.com/titles/fr_r4j/code/code/people/test/functional/people_controller_test.rb)\n\
  \n```ruby\ndef test_create_fails\n  flexstub(Person).should_receive(:new).and_return\
  \ {\n    errs = flexmock('errs' ) do |m|\n      m.should_ignore_missing\n    end\n\
  \    inst = flexmock('person' ) do |m|\n      m.should_ignore_missing\n      m.should_receive(:errors).and_return(errs)\n\
  \      m.should_receive(:save).and_return(false)\n    end\n  }\n  post :create\n\
  \  assert_response :success\n  assert_template 'new'\nend\n```\n\n对于小项目，设置存根可能显得多此一举，但随着项目的增长，它可以成为救命稻草。当你第一次重构触发了依赖链并破坏了\
  \ 500 个测试时，你会希望有那些存根的。\n\n## 7.9 进阶考虑\n\n现在你已经了解了 Rails 单元测试的基础，以下是一些需要考虑的进阶问题：\n\
  \n### 命名规范是有害的？\n\n使用命名规范——例如在所有单元测试前加上“test”——让某些人感到困扰。较新版本的 `JUnit` 允许使用 Java\
  \ 5 注解来标记测试。例如，这样做是允许的：\n\n```\n@Test public void tag()\n```\n\n而不是像这样：\n\n```java\n\
  public void testTag()\n```\n\n相比之下，Ruby 并没有注解。由于对象模型非常灵活，通常可以通过类方法实现类似于注解的结果。但 Ruby\
  \ 社区没人在乎这个。据我们所知，还没有人觉得需要提供一种避免使用命名规范的自动化测试解决方案。\n\n### 并非一律适用\n\nJava 世界并非所有人都使用\
  \ `JUnit`。`TestNG` 也很流行。`TestNG` 解决了 `JUnit` 在测试设置、清理以及与自动化集成方面的局限性。`Test::Unit`\
  \ 中类似的局限性并没有驱动任何人去编写一个新的库。Ruby 足够灵活，`Test::Unit` 的问题可能会以权宜的方式被处理。\n\n### 行为驱动开发\n\
  \nRuby 世界中 `Test::Unit` 的一个可能竞争对手是 `RSpec`。`RSpec` 是一个编写程序行为可执行规范的框架。在实现方面，可执行规范与单元测试可能没有太大。但相关的思维方式是不同的，`RSpec`\
  \ 使用的术语可能会带来更好的项目自动化。Java 先走了这一步；`RSpec` 受到 `JBehave` 的启发。\n\n## 资源\n\n231\n\n**A\
  \ Guide to Testing the Rails** . . . . [http://manuals.rubyonrails.com/read/5]\n\
  Ruby on Rails 手册非常详尽，包含了这里没有涵盖的内容，如 ActionMailer。\n\n10. [http://testng.org]\n\n\
  11. [http://rspec.rubyforge.org/]\n\n12. [http://jbehave.codehaus.org/]\n\n\n\n\n\
  \n软件开发过程需要大量的自动化。给定构成项目的源代码和其他文件，你可能希望触发进程来完成以下操作：\n\n*   编译代码\n*   将代码从一个环境部署到另一个环境\n\
  *   为开发、测试和生产环境设置不同的配置\n*   运行自动化测试\n*   启动和停止服务器进程\n*   收集分析数据\n*   管理日志文件\n* \
  \  处理与其他库的依赖关系\n*   配置数据库和数据\n*   以及更多此类任务……\n\n你可以肯定，中等规模的项目会有这类任务。这些任务中的大多数在最纯粹、原始的形式下，都可以通过某些命令行工具（带有适当的设置）单独触发。但记住所有的正确设置以及调用工具的顺序是枯燥且容易出错的。大多数编程环境都包含一个用于此类自动化的基本工具。在经典的\
  \ Unix 开发中，这个基本工具是 `make.1`。在 Java 中，工具是 `ant`。在 Ruby 中，工具是 `rake`。\n\n本章将通过与 `ant`\
  \ 的对比来解释 `rake`，然后演示我们使用 `rake` 管理 Rails 应用程序的一些方法。\n\n# Rake 基础\n\n我们觉得通过输入 `make\
  \ Rake.pdf` 而不是 `rake Rake.pdf` 来编写这一章是非常有趣的。不知道这段注释是否能通过审核过程……\n\n### 8.1 Rake\
  \ 基础\n\n在 Java 世界中，`rake` 被称为 `ant`。让我们从一个管理 Java 程序编译的简单 Ant 构建脚本开始：\n\n[下载代码/Rake/simple_ant/build.xml](http://media.pragprog.com/titles/fr_r4j/code/code/Rake/simple_ant/build.xml)\n\
  \n```xml\n<project name=\"simple-ant\" default=\"compile\" >\n  <target name=\"\
  clean\" >\n    <delete dir=\"classes\" />\n  </target>\n  <target name=\"prepare\"\
  \ >\n    <mkdir dir=\"classes\" />\n  </target>\n  <target name=\"compile\" depends=\"\
  prepare\" >\n    <javac srcdir=\"src\" destdir=\"classes\" />\n  </target>\n</project>\n\
  ```\n\nAnt 构建脚本是用 XML 编写的。在例示例中，顶层 `project` 元素声明了一个名称，即项目名称，并声明了在运行 `ant` 命令行工具时调用的默认目标。我们的默认目标是\
  \ `compile`，因此你可以预期该脚本的默认行为是编译 Java 源代码。\n\n以下是 `ant` 的输出：\n\n```\n$ ant\nBuildfile:\
  \ build.xml\nprepare:\n[mkdir] Created dir: /Book/code/Rake/simple_ant/classes\n\
  compile:\n[javac] Compiling 1 source file to /Book/code/Rake/simple_ant/classes\n\
  BUILD SUCCESSFUL\nTotal time: 3 seconds\n```\n\n刚刚发生了三件好事。首先，注意 `ant` 不需要被告知使用 `build.xml`；除非另有说明，否则它会假定如此。这是“约定优于配置”的一个例子。其次，尽管该脚本的默认目标是\
  \ `compile`，但 `ant` 知道先执行 `prepare` 目标。如果你参考 XML 配置文件，可以看到 `compile` 依赖于 `prepare`：\n\
  \n```xml\n<target name=\"compile\" depends=\"prepare\" >\n  <javac srcdir=\"src\"\
  \ destdir=\"classes\" />\n</target>\n```\n\n这个 `depends` 声明是基于依赖的编程的一个例子。你不需要显式地按顺序调用函数。相反，你只需要说明依赖关系，工具就会计算出正确的顺序。当你只有少数任务时，这可能看起来没什么特别的；但当你有几十或上百个任务时，基于依赖的编程可以实现更简洁、更可读的代码。\n\
  \n要看到发生的第三件好事，你需要再次运行 `ant`：\n\n```\n$ ant\nBuildfile: build.xml\nprepare:\ncompile:\n\
  BUILD SUCCESSFUL\nTotal time: 2 seconds\n```\n\n这一次，`Ant` 查看了 `prepare` 和 `compile`\
  \ 任务，但并没有执行任何操作。`ant` 评估了依赖并发现 `prepare` 和 `compile`已经是最新的。`prepare` 目标的体调用了 `mkdir`\
  \ 任务创建一个目录：\n\n```xml\n<target name=\"prepare\" >\n  <mkdir dir=\"classes\" />\n\
  </target>\n```\n\n任务就是一段执行的代码。Ant 的许多内置任务（如 `mkdir`）都足够智能，如果工作已经完成，则什么都不做。这对于耗时任务（例如\
  \ `compile` 目标体中的 `javac` 任务）变得非常重要：\n\n```xml\n<target name=\"compile\" depends=\"\
  prepare\" >\n  <javac srcdir=\"src\" destdir=\"classes\" />\n</target>\n```\n\n\
  现在让我们构建一个简单的 `rake` 文件。由于 Ruby 程序是不经过编译的，我们将使用一个稍不同的示例。以下 `rakefile` 使用了 Rails 内置的\
  \ `CodeStatistics` 对象来计算某些 Ruby 代码的行数以及其他统计数据：\n\n[下载代码/Rake/simple_rake/rakefile](http://media.pragprog.com/titles/fr_r4j/code/code/Rake/simple_rake/rakefile)\n\
  \n```ruby\nrequire 'rake/rdoctask'\nrequire '../code_statistics.rb'\n\ntask :default\
  \ => :stats\n\ntask :clean do\n  rm_rf 'stats'\nend\n\ntask :prepare do\n  mkdir_p\
  \ 'stats'\nend\n\ntask :stats => [:prepare] do\n  File.open(\"stats/main\", \"w\"\
  ) do |f|\n    f << CodeStatistics.new(Dir['src']).to_s\n  end\nend\n```\n\n虽然这看起来与\
  \ `Ant` 的 `build.xml` 非常不同，但它们实际上有很多共同点。`rake` 自动知道要使用哪个文件——`rakefile` 是默认的，就像 `ant`\
  \ 一样。最大的区别在于语言。Ant 使用 XML，Rake 使用 Ruby。任务名称是符号，依赖关系是哈希，任务体是块。如果你熟悉 Ruby，就会 Rake。\n\
  \n## 8.2 设置 Rakeset：只是 Ruby\n\n选择编程语言（Ruby）而不是文本标记语言（XML）的影响是深远的，而且随着构建文件变得复杂，这些影响变得更加显著。为了这一点，让我们重构这两个示例以更好地处理输入和输出目录。Ant\
  \ 文件指定了三次输出目录。如果我们把该值设置为构建属性，当我们想要构建到不同的目录时就会很容易更改。\n\n[下载代码/Rake/better_ant/build.xml](http://media.pragprog.com/titles/fr_r4j/code/code/Rake/better_ant/build.xml)\n\
  \n```xml\n<project name=\"simple-ant\" default=\"compile\" >\n  <property name=\"\
  srcdir\" value=\"src\" />\n  <property name=\"destdir\" value=\"classes\" />\n \
  \ <target name=\"clean\" >\n    <delete dir=\"${destdir}\" />\n  </target>\n  <target\
  \ name=\"prepare\" >\n    <mkdir dir=\"${destdir}\" />\n  </target>\n  <target name=\"\
  compile\" depends=\"prepare\" >\n    <javac srcdir=\"${srcdir}\" destdir=\"${destdir}\"\
  \ />\n  </target>\n</project>\n```\n\n`property` 元素允许我们指定一次值，并在以后替换或覆盖它。一旦建立了属性，脚本可以通过\
  \ `${propertyname}` 语法引用它。这里是对 `rakefile` 类似的改进：\n\n[下载代码/Rake/better_rake/rakefile](http://media.pragprog.com/titles/fr_r4j/code/code/Rake/better_rake/rakefile)\n\
  \n```ruby\nrequire 'rake/rdoctask'\nrequire '../code_statistics.rb'\n\nset :srcdir,\
  \ 'src'\nset :destdir, 'classes'\n\ntask :default => :stats\n\ntask :clean do\n\
  \  rm_rf 'stats'\nend\n\ntask :prepare do\n  mkdir_p 'stats'\nend\n\ntask :stats\
  \ => [:prepare] do\n  require 'code_statistics'\n  File.open(\"stats/main\", \"\
  w\") do |f|\n    f << CodeStatistics.new(Dir[#{srcdir}/*]).to_s\n  end\nend\n```\n\
  \n\n\n\n\n```ruby\nSTATS_DIR = \"stats\"\n```\n\nrequire 'rake/rdoctask'\n\nrequire\
  \ '../code_statistics.rb'\n\ntask :default => :stats\n\ntask :clean do\n  rm_rf\
  \ STATS_DIR\nend\n\ntask :prepare do\n  mkdir_p STATS_DIR\nend\n\ntask :stats =>\
  \ [:prepare] do\n  require 'code_statistics'\n  File.open(\"#{STATS_DIR}/main.stat\"\
  \ , \"w\" ) do |f|\n    f << CodeStatistics.count(['App Main' , 'src' ])\n  end\n\
  end\n```\n\n由于 Rake 仅仅是 Ruby，因此没有专门的“构建属性”概念。在第 1 行，`STATS_DIR` 是一个 Ruby 常量，它可以传递给方法（第\
  \ 6 行）或插值到 `String` 中（第 13 行），就像其他 Ruby 对象一样。\n\n# 8.3 自定义 Rake 任务：它只是 Ruby\n\n\
  如果包含核心任务和可选任务，Ant 拥有超过 100 个内置任务。尽管如此，你可能会发现自己需要更多。不要担心，Ant 提供了许多扩展点：你可以在 Java 中定义自己的自定义任务，可以定义宏，或者可以调用各种脚本语言。例如，这里是\
  \ Apache Commons Lang 构建文件的一个片段：\n\n```xml\n<target name=\"test.lang\" depends=\"\
  compile.tests\" >\n  <runTestCase classname=\"org.apache.commons.lang.LangTestSuite\"\
  \ />\n</target>\n<target name=\"test.builder\" depends=\"compile.tests\" >\n  <runTestCase\
  \ classname=\"org.apache.commons.lang.builder.BuilderTestSuite\" />\n</target>\n\
  ```\n\n你可能猜到 `runTestCase` 是一个运行 JUnit 测试的 Ant 任务。关于 JUnit 部分你的判断是正确的，但 `runTestCase`\
  \ 并不是一个 Ant 任务。它是之前在构建文件中定义的宏：\n\n```xml\n<macrodef name=\"runTestCase\" >\n  <attribute\
  \ name=\"classname\" />\n  <sequential>\n    <junit printsummary=\"true\" showoutput=\"\
  true\" fork=\"${junit.fork}\" haltonerror=\"${test.failonerror}\" >\n      <classpath\
  \ refid=\"test.classpath\" />\n      <test name=\"@{classname}\" />\n    </junit>\n\
  \  </sequential>\n</macrodef>\n```\n\n`macrodef` 定义了一个新的任务名称、它允许的属性以及这些属性如何被使用。为了将属性传递给其他任务，引入了一种新的插值语法\
  \ `@{varname}`：\n\n```xml\n<test name=\"@{classname}\" />\n```\n\n我们可以展示脚本任务和在 Java\
  \ 中定义的自定义任务的示例，但只需说明它们为“如何在 Ant 中编写函数？”这个问题提供了替代方案即可。\n\n到此时，你已经看到 Ant 拥有变量/常量（属性）、函数（自定义任务等）以及标准库（内置任务）。你越观察\
  \ Ant，它看起来越像是一门通用编程语言。但它并不是。Ant 是领域特定语言（DSL）的一个示例。它的领域是基于依赖的项目自动化。因为它使用它自己的自定义词汇（一种\
  \ XML 方言）编写，因此 Ant 被恰当地称为外部 DSL。也就是说，XML 独立于 Ant 通常管理的语言（Java）。\n\nRakefile 也是用\
  \ DSL 编写的。但因为它们是在编程语言（Ruby）内部编写的，所以 rakefile 的语法是内嵌 DSL。换句话说，rakefile 语言存在于 Ruby\
  \ 语言“内部”。结果是，rakefile 作者使用 Ruby 来提供他们需要的任何扩展点。为了演示这一点，这里有一个更复杂的示例，取自所有 Rails 项目内置的测试自动化。最近的这个任务测试了你在过去十分钟内编写的代码。（其意图是通过方便运行测试子集来支持敏捷开发风格。）\n\
  \n```ruby\ndesc 'Test recent changes'\nRake::TestTask.new(:recent => \"db:test:prepare\"\
  \ ) do |t|\n  since = TEST_CHANGES_SINCE\n  touched = FileList['test/**/*_test.rb'\
  \ ].select \\\n    { |path| File.mtime(path) > since } +\n    recent_tests('app/models/**/*.rb'\
  \ , 'test/unit' , since) +\n    recent_tests('app/controllers/**/*.rb' , 'test/functional'\
  \ , since)\n  t.libs << 'test'\n  t.verbose = true\n  t.test_files = touched.uniq\n\
  end\n```\n\n这段很小的代码执行了很多工作。`Rake::TestTask` 是 Rake 内置的任务。它通过调用 Ruby 方法进行配置：\n\n\
  ```ruby\nt.libs << 'test'\nt.verbose = true  t.test_files = touched.uniq\n```\n\n\
  计算运行哪些测试的代码必须执行两个任务：找到最近更改的测试和找到最近更改的测试。使用了 `FileList['test/**/*_test.rb'].select\
  \ { |path| File.mtime(path) > since }` 和 `recent_tests` 调用。\n\n# 8.4 在 Rails 中使用\
  \ Rake\n\n现在带来一点好消息/坏消息。坏消息是：构建脚本通常很丑。好消息是：Rails 应用的生命始于一个完美的 rakefile。\n\n```ruby\n\
  require(File.join(__FILE__), 'config' , 'boot' ))\nrequire 'rake'\nrequire 'rake/testtask'\n\
  require 'rake/rdoctask'\nrequire 'tasks/rails'\n```\n\n对这里的内容很少感到惊讶吗？由于 rakefiles\
  \ 构建在通用语言之上，它们积累了许多的好处——在这种情况下是可重用的库。第一课：`-tasks` 标志会告诉你哪些可用任务：\n\n```bash\nrake\
  \ --tasks\n(in /Users/stuart/website)\n\nrake db:schema:load # 将 schema.rb 文件加载数据库\n\
  rake db:sessions:clear # 清空会话表\n... 省略 39 项\n```\n\n注意这些冒号分隔的名称。Rake 使用命名空间将任务分组。例如，`db:migrate`\
  \ 的定义如下：\n\n```ruby\nnamespace :db do\n  desc \"通过 db/migrate 中的脚本迁移数据库。目标...\"\n\
  \  task :migrate => :environment do\nend\n```\n\n注意 `namespace` 没有引入任何新语法。它只是一个接受\
  \ Ruby 块的方法。任务前的 `desc` 方法接收一个描述，该描述将出现在 `rake -tasks` 的输出中。\n\n`-help` 选项出了 Rake\
  \ 的各种选项。我们截取了以下输出，只显示几个最重要的选项：\n\n```bash\nrake --help\nrake [-f rakefile] {options}\
  \ targets...\n\nOptions are ...\n\n--dry-run (-n)\n在不执行操作的情况下运行。\n\n--quiet (-q)\n\
  不向标准输出记录消息。\n\n--require=MODULE (-r)\n在执行 rakefile 之前引入 MODULE。\n\n--trace (-t)\n\
  开启调用/执行追踪，启用完整的堆栈跟踪。\n\n--verbose (-v)\n向标准输出记录消息（默认）。\n```\n\n\n\n\n\n`dry-run`\
  \ 选项在你探索 `rakefile` 并且想在采取行动前先观察一下时非常有用。对于持续集成构建过程，保持静安静是一件很好的事：“没消息就是好消息。”当 `rake`\
  \ 出现问题时，症状通常是 `Ruby` 异常。默认情况下不会显示堆栈跟踪（这是我们不认同的设计决策），但你可以通过 `verbose` 开启它们。`trace`\
  \ 选项对于开发和调试 `rakefiles`。最后，`require` 选项是更改 `rakefile` 行为的许多方法之一。由于 `rakefile` 是\
  \ `Ruby` 代码，你可以 `require` 引入任何你需要更改的常量、变量、类或方法的重覆盖实现。\n\n### 控制你使用的 Rails 版本\n\n\
  你的 Rails 应用依赖于 Rails 框架，但是哪一个版本呢？Rails 提供了几个 Rake 任务来控制你的应用程序将使用的 Rails 版本。默认情况下，你的\
  \ Rails 应用将使用机器上最新的 gems。如果你能控制在机器上何时以及如何安装 gems，并且只有一个 Rails 应用，那么这可能是没问题的。你可以通过几种方式采取更保守的方法，并请求特定的\
  \ Rails 版本。下列表中的任务通过将 Rails 复制到项目的 `vendor/rails` 来实现，该目录位于 Ruby 加载路径的早期。\n\n####\
  \ 在 Rails 应用中使用 RAKE\n\n```bash\nrake rails:freeze:gems\n```\n将当前 gems 复制到 vendor/rails\n\
  \n```bash\nrake rails:freeze:edge REVISION=nnn\n```\n将 svn 修 版本 nnn 复制到 vendor/rails\n\
  \n```bash\nrake rails:freeze:edge TAG=rel_1-1-0\n```\n将 svn tag rel_1-1-0 复制到 vendor/rails\n\
  \n另一方面，你可能希望对获取的 Rails 版本减少一些控制。（这听起来不太可能，但在开发期间可能是事实，因为你想捕获与新版本 Rails 的不兼容问题。）这些任务的工作原理是将你的\
  \ Rails 应用与一个不直接由项目管理的 Rails 副本关联起来。\n\n```bash\nrake rails:freeze:edge\n```\n将\
  \ svn edge（最新修订版本）放入 vendor/rails\n\n```bash\nrake rails:unfreeze\n```\n撤销任何冻结；恢复对\
  \ gems 的依赖\n\n如果你使用 Subversion 作为版本控制系统，可以使用其 `svn:externals` 功能将 `vendor/rails`\
  \ 目录链接到官方 Rails 仓库。当你通过 `svn up` 更新自己的项目最新更改时，你也将获得最新的、最强大的、尚未发布的 Rails 版本。这不建议用于生产服务器！\n\
  \nRails 还会将一些文件复制到你的项目中，这些文件可能需要更新以利用新版本 Rails 的功能。`rake rails:update` 任务及其子任务会将这些文件的最新版本复制到你的项目中。\n\
  \n### 文件清理任务\n\n在所有文件清理任务中，最重要的可能是 `log:clear`。日志文件会无限制地增长，因此你会在生产服务器上自动修剪它们。\n\n\
  ```bash\nrake log:clear\n```\n截断日志文件 (`log/*.log`)\n\n```bash\nrake tmp:clear\n\
  ```\n清除 `tmp` 中的各种文件\n\n第 212 页的图 [7.1] 涵盖了测试相关的任务。\n\n### 8.5 使用 Cerberus 进行持续集成\n\
  \nRake 是执行基于依赖的任务（如构建和测试软件项目）的极佳工具。为了补充 Rake，我们需要源码控制管理和持续集成（CI）的工具。\n\n源码控制管理工具允许你跟踪软件项目的历史，并在许多不同的开发者之间管理代码库。源码控制在语言上并没有多多的特殊性。Ruby\
  \ 程序员倾向于使用与 Java 程序员相同的工具：Subversion 和 CVS。\n\n持续集成是一种开发实践，团队成员频繁地整合他们的工作。每次集成都会通过自动构建进行验证，因此开发者会立即知道应用程序代码的某部分是否朝着错误的方向发展。\n\
  \n在实践中，持续集成构建器是一个执行以下操作的工具：\n* 监控源码控制的新更改\n* 自动使用 `rake` 等工具调用构建\n* 当构建失败时大声抱怨，使用电子邮件、聊天、装饰性灯光、岩浆灯、警报器或任何有助于引起团队成员注意的手段\n\
  \nJava 程序员经常使用 `CruiseControl2` 进行 CI。CruiseControl 是一个开源项目，具有良好的基础 CI 能力，外加许多华丽的功能。Ruby\
  \ 世界没有像 CruiseControl 那样完善的工具。然而，我们拥有一些简单的库，为 CI 提供了一个良好的起点。我们目前最喜欢的是名为 `Cerberus`\
  \ 的开源项目。Cerberus 提供了一种简单的方法，可以按照定期计划构建一个或多个项目，并向相关方报告构建结果。Cerberus 以 gem 安装：\n\n\
  ```bash\ngem install -y cerberus-0.3.0\n```\n\n`cerberus` 命令行工具允许你为项目设置自动化构建。我们使用以下命令为本书配套的\
  \ People 应用创建了 Cerberus 构建：\n\n```bash\ncerberus add https://somewhere.pragprog.com/code/people\
  \ APPLICATION_NAME=People RECIENTS=contact@relevance.com\n```\n\n`cerberus` 命令行工具允许你为项目设置自动化构建。由于\
  \ Cerberus 会发送电子邮件，我们需要配置一个有效的邮件账户，配置位于 `.cerberus/config.yml`。这里是一个简单的示例：\n\n```yaml\n\
  publisher:\n  active: mail\nmail:\n  address: www.relevance.com\n  port: 25\n  domain:\
  \ relevance.com\n  authentication: login\n  user_name: some_user\n  password: some_password\n\
  builder:\n  rake:\n    task: test\n```\n\n一旦你有了了满意的 Cerberus 配置，可以使用操作系统级服务（如 `cron`\
  \ 或 Windows 任务计划程序）定期（例如每十分十分一次）自动运行 `cerberus buildall`。只有在仓库发生变化时，构建才会运行。\n\n\n\
  \n\nCapistrano 是一个基于 Ruby 的部署自动化工具。尽管它是为 Ruby 和 Rails 开发的，但它也可以部署其他语言平台的应用程序。Capistrano\
  \ 虽然超出了本书的范围，但非常值得去学习。\n\n## 洋葱罢工再次来袭……介绍 Rake……\n\n. . . [`blade.nagaokaut.ac.jp/cgi-bin/scat.rb/ruby/ruby-talk/66974`](http://blade.nagaokaut.ac.jp/cgi-bin/scat.rb/ruby/ruby-talk/66974)\n\
  \nJim Weirich 描述了 Rake 的原始开发过程。阅读这篇文章，并阅读（链接中的）原始 Rake 代码。它是对 Ruby 迭代开发易用性极极强大的演示。\n\
  \n## 使用 Rake 构建语言……\n\n. . . [`www.martinfowler.com/articles/rake.html`](http://www.martinfowler.com/articles/rake.html)\n\
  \nMartin Fowler 解释了为什么 Rake 如此强大，并引入了 DSL（领域特定语言）。\n\n# 第 9 章：创建和调用 Web 服务\n\n我们没有时间进行“什么是\
  \ Web 服务”的辩论，所以我们选择一个简单的定义：Web 服务通过 Web 提供一种服务，其形式可以被其他应用程序轻松消费。这个宽泛的定义包含了所有关于“处理\
  \ Web 服务正确方式”的各种方案：\n\n*   使用“官方” Web 服务技术栈（XML、XSD、SOAP、WSDL 和 WS-* 规范）的服务\n* \
  \  提供 RESTful 接口的服务\n*   以 YAML 和 JSON 等脚本友型格式交付数据的服务\n\nRuby 和 Java 都对这些方法及其各种组合提供了支持。（如果它们不支持，那是对\
  \ Web 服务的否定，而不是对语言的否定。无论编程语言是什么，Web 服务都应该让互操作变得简单。它仅仅是数据。）\n\n尽管 Ruby 和 Java 都支持\
  \ Web 服务，但支持的程度和风格大不相同。Java 有一些显著优势：\n\n*   Java 领域的投入要多得多。那里有更多的解析器、更好的文档、更多的工具、更多的商业产品以及更好的性能。\n\
  *   Java 与其他平台的互操作经过了充分的测试。\n\n但 Ruby 有一些潜在的优势：\n\n*   Ruby 与 XML 的匹配度更为自然。XML 是动态类型的，就像\
  \ Ruby 一样。\n*   Ruby 特别适合 JSON 和 YAML 的搭档。\n\n这一切的结论是，在本书编写时，对于性能敏感或需要专门库的问题，我们倾向于使用\
  \ Java。对于开发者效率是主导因素或我们需要构建新库的问题，我们则倾向于使用 Ruby。\n\n在本章中，我们将演示如何在 SOAP 和 RESTful 风格下构建和消费\
  \ Web 服务。我们将讨论 XML 解析器的选项，以防你需要自己实现解决方案。在 Java 和 Ruby 中，我们本可以采取几十可能的方法。我们尝试选择简单且通的方法。\n\
  \n### 9.1 RESTful Web 服务\n\n表述状态转换（REST）是由 Roy Fielding 在他的博士论文中提出的。这篇论文值得阅读，特别是如果你计划在当地的酒吧里开启一场关于\
  \ REST 与 SOAP 的争论的话。\n\n以下是几个关键点：\n\n*   在 REST 中， Web 上的节点（endpoints）代表资源。同一个资源可能以不同的格式暴露，你可以通过元数据（`HTTP\
  \ headers`）请求你想要的格式。例如，我们可能想在 HTML 浏览器中阅读新闻，而你可能想在 XML 馈中查看相同的新闻。\n*   修改资源的“接口”仅限于一组简单的简单操作：创建、读取、更新和删除（CRUD）。为了增加复杂性，这些操作在\
  \ `POST`、`GET`、`PUT` 和 `DELETE` 的伪名下运行。\n\nREST 的倡导者指出，REST 具有良好的扩展性。标准化的 CRUD 接口对缓存和层级系统非常友好。最重要的原因是，只读操作可以被任何人轻易识别并缓存。相反，原始的基于\
  \ SOAP 的 Web 服务将它们的接口埋在特定特定的 XML 消息体中。这些消息体对于互联网上的中间节点来说是不透明的，无法进行缓存。\n\n1. [`www.ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm`](http://www.ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm)\n\
  \n扩展性的论点意味着 REST 是你应该做的事，就像吃蔬菜一样。在我们看来，REST 的成功更多取决于实用性：对于简单任务，REST 接口比 SOAP 易于编程得多。因此，REST\
  \ 是你想要做的事，就像吃巧克力蛋糕一样。\n\nSOAP 是一种用于访问 Web 服务的 XML 协议。SOAP 服务的“接口”可以是任何你想要的。SOAP\
  \ XML 消息体可以包含方法名和参数，或者仅仅是一个任意的 XML 文档。SOAP 的核心组件是 SOAP Header，它可以携带各种元数据。SOAP 头部用于寄载各种附加服务。\n\
  \n许多其他规范都依赖于 SOAP。这些规范合在一起规定了错误处理、事务、端到端安全等标准方法。REST 在解决这些问题方面几乎无可说。当然，这些都是过度简化的。我们刻意在\
  \ SOAP 和 REST 之间划了界限。在实践中，各种中间策略利用了两者的优点。\n\n## 使用 ActiveResource 创建 RESTful 服务\n\
  \n对于我们的 REST 示例，我们将为作者和出版物的数据库创建一个 RESTful 接口。在 Rails 上学习 REST 最简单的方法是运行此生成器。\n\n\
  ```bash\nscript/generate scaffold_resource author:string canonical:string name:string\
  \ birthplace:string birthdate:date deathdate:date\n```\n\n第一个参数 `author` 是模型名称。正如你在\
  \ Rails 中预期的那样，这将创建 `Author` 模型以及 `AuthorsController`。剩余的参数是名称/类型对，用于创建初始迁移和视图代码。\n\
  \n当你运行生成器时，它会在你的 `routes.rb` 中添加以下行：\n\n```ruby\nmap.resources :authors\n```\n\n\
  `resource` 的调用实现了 Rails 的 RESTful 路由。我们在几个示例后详细解释这一行。\n\n脚手架生成了一组文件，其名称和位置与原始 Rails\
  \ 脚手架相似。这些文件中的看起来非常不同。这里是 `index` 方法：\n\n```ruby\ndef index\n  @authors = Author.find(:all)\n\
  \  respond_to do |format|\n    format.html\n    format.xml { render :xml => @authors.to_xml\
  \ }\n  end\nend\n```\n\n`respond_to` 方法允许端点根据客户端响应不同的内容。`respond_to` 会根据客户端指定的 HTTP\
  \ `Accept` 头部的值执行不同的块。\n\n`format.html` 没有块，意味着“对 HTML 请求按正常方式响应”——在这种情况下渲染 `index.rhtml`。`format.xml`\
  \ 块渲染 XML 响应，使用 Rails 提供的简单 `to_xml` 转换。\n\n为了看到运行效果，我们可以带上示例数据启动服务器，然后从控制台请求 `/authors`\
  \ URL。首先，启动 Rails 服务器：\n\n```bash\nrake db:fixtures:load\nscript/server\n```\n\n\
  然后，从另一个控制台运行这个简单的 Ruby 脚本来 GET `/authors` URL：\n\n\n\n\n\n[下载 code/rails_xt/samples/rest/get_authors_html.rb](http://media.pragprog.com/titles/fr_r4j/code/code/rails_xt/samples/rest/get_authors_html.rb)\n\
