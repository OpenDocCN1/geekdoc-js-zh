    代码训练营的主要优势是其周期较短。获得计算机科学学位需要多年时间才能完成。相比之下，训练营只需要几周或几个月。结果是，训练营的费用较低，尽管学费可能仍然非常贵。另一方面，短的周期意味着学生无法花费更多的时间来学习。这导致了许多争议。


    一些代码训练营因为未能充分让学生做好在现实世界中工作的准备而饱受批评。尽管收取了数千甚至数万美元的学费，毕业生可能并没有准备好通过代码测试或在工作面试中取得成功。一些毕业生已成功起诉他们就读过的训练营，理由是对方没有教授他们宣称的技能。另一些毕业生则不仅没有工作，还背负了数万美元的债务。


    然而，许多代码训练营确实为学生找工作做了准备。有些训练营甚至在你找到工作之前不需要你支付课程费用。与所有层次的教育一样，代码训练营的质量存在巨大差异。


    如果你考虑参加训练营，应该确保查看了他们的统计数据，关于学生按时完成课程的比例、毕业后不久找到工作的比例，以及他们的起薪情况。这些信息应该来自中立的第三方，而不仅仅是训练营本身。在过去，一些训练营因为使用误导和虚假的统计数据来宣传其服务而被迫关闭。结果报告诚信委员会（`CIRR`）在网上发布了许多代码训练营的数据。


    ### 自学


    自学诸如 `JavaScript` 等编程语言有很多资源。当地图书馆和学校图书馆通常会有自学材料。你可以学习该语言如何工作以及如何编写代码。


    然而，自学编程语言最常见的方式是通过网络。网上有无数免费网站教授 `JavaScript` 和其他编程语言的基础知识。一个很好的学习网站是 `w3schools.com`。它会引导你学习
    `HTML`、`CSS` 以及 `JavaScript`。一旦你学会了这三种语言，就可以设计你自己的简单网站。


    ![](img/main-43.jpg)


    `w3schools.com` 是在线学习编程的可用资源之一。


    从那里，你需要学习更多关于各种 `JavaScript` 库和框架。虽然像 `Node.js` 和 `React` 等工具主要用 `JavaScript`
    编写，但它们有其你需要学习的独特之处。正是这些更高级的工具使得在短时间内创建精美的网站成为可能。仅用 `HTML`、`CSS` 和 `JavaScript`
    手写所有代码是一个耗时的过程，而且它迫使你为那些可以由 `JavaScript` 框架或库轻松解决常见问题寻找解决方案。


    在这样做时，拥有自己的电脑是有用的，这样你可以编写代码并查看它是否有效。如果你在从事前端 Web 开发，你只需要在电脑上安装一个浏览器。如果你在从事后端，你还需要
    `Node.js`。要创建应用，你需要在开始之前下载一个框架。


    ### 技术工作


    对软件开发人员和 Web 开发人员的需求正在快速增长。你可能听过学校系统和劳动力市场中对 `STEM`（科学、技术、工程和数学）的重视。这是今天教育和政治领域的热话题，因为劳动力市场正在发生变化，掌握这四个学科知识的高技能工人需求量非常大。


    根据美国劳工部的数据，预计平均工作在 2014 年到 2024 年之间将实现 7% 的增长。然而，软件开发人员的数量预计将增长 17%，而 Web 开发人员的数量预计将增长
    27%！如果你想成为软件开发人员，这是一个极好的消息。你很可能在你选择的领域找到工作。由于该领域对工人需求量且供应有限，薪水可能很高。


    为《波士顿环报》撰稿的记者 John Dodge 讨论了 2016 年马萨诸塞州软件开发人员的短缺是如何影响该州的：


    马萨诸塞州对技术人才的竞争有多激烈？


    刚毕业的软件开发人员可以获得高达 90,000 美元的起薪。一旦入职，他们每天可能会有多达二十个招聘电话试图说服他们离开去公司。当他们跳槽时，薪水增加 20%
    到 25% 并不罕见。


    ![](img/main-44.jpg)


    技术领域的终身收入受你的具体职位以及教育水平的影响。


    技能技术工人的短缺已成为马萨诸塞许多公司的首要问题，也是该州创新经济日益增长的关注。技术高管将招聘环境描述为残酷的——甚至比 20 世纪 90 年代的网络泡沫还要糟糕——并且对他们扩张、开发新技术和持续增长的能力构成了威胁。


    虽然这篇文章关注马萨诸塞州，但同样的问题也面临着全国乃至全球的公司。


    ### 对外包的恐惧


    自 20 世纪 90 年代以来，一直担心外包——让外部公司接手某些任务——会导致公司将工作转移海外，从而导致美国就业短缺。


    技术世界对外包的恐惧可能最为剧烈。2008 年，技术作家 Steve Holzner 编写了一篇文章，详细说明了技术领域对外包的担忧是多么广泛。他引用了全国计算机科学专业招生人数的下降，以及程序员对可能失去工作的悲观情绪。然而，正如
    Holzner 当时所说，这种恐惧被放大了。尽管外包是全球范围内面临的一个相关问题，但美国科技行业仍继续蓬勃发展。


    ### 硅谷


    '
- fmt: '

    Tech jobs can be found all over the United States and the world. However, there
    are some regions that are particularly important in the sector. This means it
    may be easier to find jobs in these locations, since there are so many companies
    seeking employees. It also means that people trying to rise to the top of the
    field often move to these areas to give themselves the most opportunities for
    advancement.


    The states with the most computer programmers are California, Texas (home to Dallas),
    New York, Illinois (home to Chicago), and New Jersey. One reason for these groupings
    is the large population in these states, but they are also home to important tech
    centers. Cities like New York City (and nearby New Jersey), Chicago, and Dallas,
    as well as San Francisco and Los Angeles in California are full of tech companies.
    Computer programmers often move to these cities to find employment and sometimes
    relocate among them because many companies have offices in more than one of them.


    ![](images/main-45.jpg)


    ## Silicon Valley


    Silicon Valley is home to numerous leading tech companies.


    But in tech, no place is as famous as Silicon Valley— an area in California’s
    San Francisco Bay Area. It is the undisputed king of the tech industry, and its
    name is known around the world. Many of the biggest names in the industry are
    headquartered in Silicon Valley, including Google, Apple, and Facebook.


    Silicon Valley has played an important role in the history of computing. It gained
    its name in 1971 based on the concentration of electronics manufacturers in the
    region. Silicon is used to make the chips that make electronics like phones and
    computers run. But even before 1971, the region played an integral role in the
    tech sector.


    Silicon Valley’s prominence is largely due to the fact that Stanford University
    is located in its heart. A professor, and later dean and provost, of Stanford
    University by the name of Frederick Terman played a large role in efforts to make
    the valley a center of technology. In 1939, two of Terman’s former students, William
    Hewlett and David Packard, founded Hewlett-Packard (HP) in a garage in the valley
    with Terman’s encouragement. Today, HP sells nearly 20 percent of all personal
    computers in the world. While HP was the first company founded by Stanford graduates
    in the region, it was not the last. Google and Yahoo! would follow it years later,
    and Stanford continues to be a leader of the industry.


    Silicon Valley is not only home to the headquarters of many of the biggest and
    well-established tech companies, it is also the place with the most startups in
    the world. Start-ups generally rely on money that is given to them by rich investors
    or investment banks to get off the ground. This allows them to create their product
    and pay their employees’ salaries while they work on their initial product. This
    initial investment in companies that do not offer stock is called venture capital.


    Venture capital can often be substantial. For instance, just a few months after
    its founding in 2004, Facebook received $500,000 from an angel investor. At the
    time, the company was quite small and still run by university students. The company
    went on to receive much more capital over the years. Most notably, in 2011 the
    investment bank Goldman Sachs invested $450 million in Facebook—a staggering sum.


    If you decide to try to launch a start-up and are looking for venture capital,
    there is no better place than Silicon Valley. An astounding 25 percent of the
    world’s venture capital—more than $10 billion in 2012—is invested in Silicon Valley.
    In fact, Silicon Valley sees more venture capital investment than the entire continent
    of Europe.


    This influx of huge sums of money into the region also has its drawbacks. Property
    values and the cost of living in Silicon Valley are extraordinarily high. This
    is something to keep in mind if you are offered a job in the area. The median
    home price in Silicon Valley is about $1 million dollars. For comparison, the
    median home price in Chicago is less than $300,000. While salaries in Silicon
    Valley are higher than Chicago on average, it’s not enough to offset the huge
    difference in housing costs.


    Nevertheless, netting a job in Silicon Valley remains the dream of many computer
    programmers. While entry-level employees don’t get paid enough to lead glamorous
    lifestyles in the expensive area, successful start-up founders and senior employees
    at large companies can bring home impressive salaries.


    ## Electron and GitHub


    o o o


    One of the most recent innovations in the world of JavaScript is the ability to
    easily create desktop applications for computers using the language. This is largely
    due to the new framework called `Electron` that began in 2013 (under the name
    `Atom Shell`). `Electron` makes it possible to create desktop apps for computers
    running Windows, Mac, and Linux operating systems. You can write the code in JavaScript
    (as well as HTML and CSS), and the resulting program looks like a native computer
    application.


    There are many desktop apps that have been built with `Electron`. `WordPress`,
    a popular platform for easily creating websites, has an application that was built
    with `Electron`, and `Discord`—a popular voice and text communication app used
    by gamers—was also made with it. `Electron` itself was developed by the start-up
    `GitHub`.


    `GitHub` is a cloud-based service that stores code. Individuals and businesses
    can purchase memberships that allow them to store their programs. The benefits
    of this are that `GitHub` simplifies the process of many people working on the
    same code. Users can request that other people review their code—this provides
    them with feedback and improves the final product. These features not only benefit
    businesses, but also the many open-source projects that developers rely on. Many
    JavaScript libraries and frameworks are open-source projects. Countless developers
    who use them in their work also contribute to them online so they function better
    for everyone. If you need to download a JavaScript framework like `React`, you
    can often do it on `GitHub`. Once you''ve learned how to code, you can also propose
    changes to open-source projects like `React` on `GitHub`—this can be a good way
    to build your resume.


    `Electron` also benefits from being open source. According to `GitHub`''s website:


    ```Electron 1.0 is the result of a community effort by hundreds of developers.
    Outside of the core framework, there have been hundreds of libraries and tools
    released to make building, packaging, and deploying Electron apps easier.```


    There is now a new community page that lists many of the `Electron` tools, apps,
    libraries, and frameworks being developed. You can also check out the `Electron`
    and `Electron Userland` organizations to see some of these fantastic projects.


    `GitHub` is an extremely important website for developers around the world. As
    of May 2017, Amazon''s Alexa estimates that it is the forty-sixth most popular
    website in the United States, and the sixty-third most popular in the entire world.
    This is due to the fact that millions of programmers and developers use it on
    a regular basis. If you spend much time coding, it is almost certain that you
    will use `GitHub` and its many resources for developers—it''s not necessary to
    pay for a membership unless you want to host your own private projects there.


    ### Jobs and JavaScript


    Once you know how to code in JavaScript, a wide variety of career options open
    up. One of the first choices you need to make is whether to go into web development
    or not. Web development is focused on the creation of websites. Often, web developers
    will have some experience with graphic design since they may be responsible for
    designing the layout of the website as well as the functional, technical aspects
    of it.

