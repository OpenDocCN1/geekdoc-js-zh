    Opposite: Many students begin learning to code in school. It is never too early
    to start!


    ![](images/image_005_.jpg)


    ## Getting Started with JavaScript


    Technology is one of the fastest-growing employment fields around the world. It
    is an exciting time to enter the sector. If you master a programming language
    like `JavaScript`, you can expect to earn a high salary for your expertise. It
    is also a relatively easy field to get started in, compared to other employment
    opportunities that require a license or certification, like health care and education.


    ### Career and Salary Prospects


    If you decide you want a coding job, the first question you have to ask yourself
    is what programming languages you will learn. In 2017, online developer community
    `Stack Overflow` surveyed sixty thousand developers to see what languages professionals
    know. Unsurprisingly, `JavaScript` was the most commonly used language. Some 66.7
    percent of developers reported using it. This is a compelling reason to learn
    `JavaScript`—it is a requirement for the majority of programming jobs.


    Furthermore, 72.6 percent of respondents to the survey identified themselves as
    web developers, making it by far the most popular role. Among web developers,
    knowledge of `JavaScript` is almost always necessary. Even if you plan on working
    on the server side, where `JavaScript` is not ubiquitous, some familiarity is
    useful.


    One question you might have is how the salaries of developers who work in different
    languages compare. This is a difficult question to answer precisely because of
    the difficulty of gathering data on so many people. `Stack Exchange`’s survey
    relies on the self-reported income of respondents, but it is not a representative
    survey. Only 32 percent of respondents provided their salary. Among them, `C++`
    proved the most lucrative language to know that is also used by more than 7 percent
    of programmers. The average annual salary for developers who used `C++` was selfreported
    at $100,890. This was followed closely by `C` at $100,000; `Python` at $99,000;
    `Ruby` at $97,000; `Java` at $96,000; and `JavaScript` at $90,000.


    Another source, data taken from the popular job site `Indeed.com`, gives a somewhat
    different view. It has `Ruby` as the most highly compensated programming language
    at an average of $117,147. This is followed by `Python` at $116,027; `C++` at
    $115,597; `JavaScript` at $110,062; `Java` at $102,043; and `C` at $95,045.


    Ruby, `Python`, and `C++` alternate among the top spots of both lists; however,
    the position of `JavaScript` varies greatly. This may be due to the fact that
    `JavaScript` is so flexible. Developers in many different roles, such as web development
    and app development, use the language. These roles sometimes have very different
    salary expectations.

