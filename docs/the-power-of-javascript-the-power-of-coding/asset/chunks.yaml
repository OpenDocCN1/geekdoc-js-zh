  raw: 'This popularity comes with a number of benefits. It means that JavaScript
    is a popular language for programmers to learn, since it is a requirement for
    so many jobs. If you are expected to do anything related to website development,
    at least a basic knowledge of JavaScript is required. Working on the front end,
    a detailed knowledge ofJavaScript and likely its libraries and frameworks is also
    needed. Consequently, there are many jobs available for someone who knows JavaScript
    well. While knowledge of less popular programming languages is also lucrative,
    there are not always hundreds of job openings at any given time for someone well-versed
    in these languages. For instance, more professional programmers reported using
    the AngularJS framework in 2016 than both Ruby and Objective-C combined, according
    to a survey. These survey results are stunning because the majority of people
    who used JavaScript did not use AngularJS. There are so many developers using JavaScript
    that even those who used AngularJS topped the respondents who use Ruby and Objective-C.


    JavaScript’s popularity is also a drawback in some ways. Widespread technologies
    are often the first to be targeted by hackers because of their popularity. It
    makes more sense to try to find vulnerabilities in common features of websites
    and programs—such as JavaScript—rather than rarely used features.


    One of the most notorious vulnerabilities that JavaScript has is known as Cross-Site
    Scripting (XSS). The basic idea of cross-site scripting is rather simple—the hacker
    tries to get a website to execute a script that sends malicious scripts to other
    users of a website. You might wonder how this is possible, and the answer can
    be surprising.


    The simplest kind ofXSS attacks rely on a website’s own input field, like a search
    bar or username field. Rather than a username, a hacker inputs code and sees if
    the websites executes it. If the website is secure, it will determine that it
    should not run the code, but if it is vulnerable, it may execute it. The hacker
    can then design code that directs the website to send malicious scripts to other
    users as well. Since these scripts come from the trusted website, they are executed
    by the browsers of other users.


    The end result is that the attacker can access the cookies (what websites use
    to track visitors) and other information of innocent users who visit the affected
    website. In a worst-case scenario, these cookies may contain credit card numbers
    and other sensitive personal information. While this simple form of XSS, relying
    on input fields, has become so well known that almost all websites protect against
    it, more sophisticated XSS vulnerabilities still exist on the web. According to
    High-Tech Bridge, a computer-security firm, in 2015 some 80 percent of security vulnerabilities
    were related to XSS. Unsurprisingly, almost all XSS vulnerabilities relate to
    JavaScript since it is the only client-side scripting language.


    ##### Users without JavaScript


    One serious drawback of JavaScript is that some users do not receive content that
    relies on it. The exact number of people who view websites without the enhancement
    of JavaScript is hard to say. One of the most rigorous studies on the issue was
    conducted by the British Government Digital Service in 2013. Their finding was
    that about 1.1 percent of users did not properly receive content that required
    JavaScript. Interestingly, only 0.2 percent had JavaScript disabled; JavaScript
    simply didn’t work properly for the remaining 0.9 percent of users.


    While this percent of users is quite low, it can be an extremely large number
    of people on a high-traffic website. For example, Facebook saw an average of 1.28
    billion daily users in the first quarter of 2017. If 1.1 percent of that number
    could not properly see content relying on JavaScript, it would be 14 million people.
    However, it is interesting to note that Facebook will not even let you view the
    site with JavaScript disabled, most likely since it relies so heavily on Ajax. If
    you try to access Facebook with JavaScript disabled, the site displays a message
    that says “Facebook doesn’t work properly without JavaScript enabled” and redirects
    you to the mobile site. Other popular sites like Amazon will allow you to navigate
    without JavaScript, since otherwise they might lose 1 percent of their customers,
    although some functions are lacking when it is disabled.


    Because of this issue, web developers are left with a choice of whether or not
    to optimize websites for users without JavaScript. It can be time-consuming to
    ensure that a stripped-down version of a website is functional when JavaScript
    is disabled, but often developers will take the time to do so rather than lose approximately
    1 percent of a site’s traffic.


    ##### Full-Stack Web Development


    There are many different parts to a fully functioning website. It is necessary
    to have a front end (that the user sees) and a back end (that manipulates data and
    handles server requests). At a large company like Facebook or Amazon, different
    teams of people generally work on these different parts of the website. For example,
    the people who manipulate and structure Facebook’s databases don’t work on the
    user interface. Each team has highly specialized skills that relate to their area
    of expertise. There is then an additional team with a general knowledge of the
    front end and back end that integrates the two parts.


    The development of a typical website without the reach of Facebook is a different
    matter, however. On smaller websites, a single developer often designs and maintains
    the site. In fact, this is one of the largest fields of employment related to
    computer programming. It is called full-stack web development. Full-stack web developers
    are able to work on both the front end and back end of a website. They typically
    have knowledge and experience with all aspects of building a website, although
    they may not have the specialized skills of someone who, for example, works only
    on databases on the back end.


