    来自另一个求职网站 `gooroo.io` 的数据清楚地说明了这一点。该网站根据 `JavaScript` 开发者所负责使用的框架划分了薪资情况。根据他们的招聘信息，主要使用
    `Node.js` 的开发者平均薪为 98,003 美元，而使用 `React` 的开发者平均薪为 78,603 美元。你如何利用你 `JavaScript`
    的知识会对你的薪水产生巨大影响。


    总而言之，目前还不清楚一个从事 `JavaScript` 工作的人与使用 `Ruby` 或 `C++` 等其他语言的同行相比，可以获得多少收入。明确的是，`JavaScript`
    是最广泛使用的编程语言之一，它在科技行业许多不同领域的开发者中都很受欢迎。


    ## 更多学习语言的动力


    除了找工作，还有其他学习编程的良好理由。学习编程语言可以教你理性地思考和解决问题。许多人已经解释了学习编程带来的无数益处，许多有影响力的人认为所有学生至少应该学习编程的基础知识，为以后生活做好准备。在
    1995 年的一次采访中，苹果创始人 `Steve Jobs` 表达了他对为什么学习编程如此重要的个人观点：


    > 我认为这个国家的每个人都应该学会如何编写程序，应该学习一种计算机语言，因为它教你如何思考。这就像去法学院一样。我不认为每个人都应该当律师，但我认为去法学院实际上是有用的，因为它教你如何以某种方式思考——计算机编程以同样的方式（略有不同的方式）教你如何思考。我将计算机科学视为一门自由艺术。它应该是每个人都应该学习的东西——在生命中花一年时间，他们学习课程之一就是学习如何编程。


    ![](img/main-40.jpg)


    Steve Jobs 认为每个人都应该学习编程。


    一旦你决定学习编程，下一个问题就是如何做。三个主要选择是大学、代码训练营或自自学。这三者都有各自独特的优缺点，哪种最适合你是一个极具个人色彩的选择。这取决于你对独立学习还是小组学习的偏好，以及你愿意在教育上花费多少钱。大学是目前最贵的选项（在没有丰厚学金的情况下），其次是代码训练营，其费用也可能高达数千美元。另一方面，如果你有一台可以上网的电脑，或者可以在图书馆使用电脑，自学几乎是免费的。


    ## 大学的问题


    要出的最大决定之一是是否上大学学习与代码相关的领域。这是一个具有争议的问题，许多人认为考虑到高昂的成本，这是没有必要的且是浪费钱的。


    首先，让我们来看看支持学位的论点。事实是，大多数专业人士都拥有学位。根据 `Stack Exchange` 的调查，76% 的开发者拥有学位。在这些人中，超过四分之一的人主修计算机科学。此外，20%
    的受访者表示拥有硕士学位。


    ![](img/main-41.jpg)


    ## 薪资与教育


    薪资往往随着受教育程度的增加而增加。根据监测劳动力市场的分析公司 `Burning Glass Technologies` 2015 年的一份报告，“89%
    的职业型工作通常需要学士学位。”对于本报告而言，职业型工作被定义为时薪超过 15 美元的工作。


    也许上大学最有说服力的理由是个人修养。你可能会发现自己对以前从未接触过的科目感兴趣。此外，`计算机科学` 在行业内仍然很受欢迎。


    尽管如此，许多人认为对于成功的职业来说，学位并不是必不可少的。著名的例子是微软创始人 `Bill Gates` 和苹果创始人 `Steve Jobs`。他们都没有完成本科学业。


    反对上学的一个论点是该行业快节奏的特点。它的某些方面，例如使用哪种 `JavaScript` 框架，以惊人的速度变化的。当你完成一个为期四年的课程时，你所学的可能已经过时了。反对上大学的财务论据也被提出。拥有学位者的薪资通常高于自学者。然而，随着职业生涯的不断深入，这种差异会缩小，而且学费的成本无法抵消其收益。


    ![](img/main-42.jpg)


    耶尔大学教授 Gelernter


    许多人认为大学课程本身与现实世界脱节。2015 年，一家创业公司的负责人兼教授 `David Gelernter` 在《华尔街日报》的评论版发表了这一观点的文章：


    > 我在开发者身上寻找的不是计算机科学学位。大学的计算机科学系状况糟糕：比一个每十分钟变化一次的领域落后了十年。计算机科学系为学生从事学术或研究职业做准备，并蔑视那些真正给钱的工作。他们教学生如何设计操作系统，但不教他们如何与真实的、活跃的开发团队合作。耶尔大学或普林斯大学的计算机科学系中没有一门关于
    iPhone 或 Android 的课程。哈佛大学有一个，但你无法在一个学期内培养出一个优秀的开发者。


    ## 训练营


    代码训练营——如何编程的速成课程是一个具有争议的话题。这些项目通常持续二到六个月，旨在让学生为计算机编程或 Web 开发领域的入门工作做准备。`JavaScript`
    是训练营涵盖的许多编程语言之一。


    '
- fmt: '

    The primary benefit of a coding boot camp is its short time frame. A computer
    science degree takes years to complete. Alternatively, a boot camp takes just
    weeks or months. As a result, boot camps are less expensive, although tuitions
    can still be quite steep. On the other hand, the short time frame means students
    are not able to spend as much time learning. This has led to numerous controversies.


    Some boot camps have come under fire for not adequately preparing their students
    to find a job in the real world. Despite charging thousands or tens of thousands
    of dollars in tuition, graduates may not be prepared to pass a coding test or
    succeed in a job interview. Some graduates have successfully sued boot camps they
    attended for not teaching them the skills they advertised. Other graduates have
    been left without a job and with tens of thousands of dollars in debt.


    However, many boot camps do prepare their students for finding a job. Some do
    not even require you to pay for the cost of the program unless you manage to find
    a job. As with all levels of education, there is a great deal of disparity in
    the quality of coding boot camps.


    If you decide to look into attending a boot camp, you should make sure to review
    their statistics regarding what percentage of students finish the program on time,
    find a job soon after graduation, and what their starting salary is. This information
    should be available from a neutral third party and not just the boot camp itself.
    In the past, some boot camps have been forced to shut down due to misleading and
    false statistics they used to advertise their services. The Council on Integrity
    in Results Reporting (`CIRR`) publishes data for a number of coding boot camps
    online.


    ### Learning Alone


    There are many resources for learning a programming language like `JavaScript`
    on your own. Local libraries and school libraries often have materials for self-study.
    You can learn how the language works and how to write code.


    However, the most common way to learn a programming language on your own is online.
    There are countless free websites that teach the basics of `JavaScript` and other
    programming languages. One good website for learning is `w3schools.com`. It walks
    you through learning `HTML` and `CSS`, as well as `JavaScript`. Once you know
    these three languages, it is possible to design your own simple websites.


    ![](images/main-43.jpg)


    `w3schools.com` is one available resource for learning to code online.


    From there, you need to learn more about various `JavaScript` libraries and frameworks.
    While tools like `Node.js` and `React` are primarily written in `JavaScript`,
    they have their own quirks that you need to learn. It is these more advanced tools
    that make it possible to create sleek websites in a short timeframe. Coding everything
    yourself in just `HTML`, `CSS`, and `JavaScript` is a time-consuming process,
    and it forces you to find solutions to common problems that can be easily solved
    by a `JavaScript` framework or library.


    It’s useful to have your own computer when you do this so that you can write code
    and see if it works. If you’re working on front-end web development, you just
    need a browser installed on the computer. If you’re working on the back end, you
    will also need `Node.js`. To create apps, you’ll need to download a framework
    before you can get started.


    ### Tech Jobs


    The demand for software developers and web developers is growing rapidly. You
    have likely heard of the emphasis on `STEM` (science, technology, engineering,
    and mathematics) both in school systems and in the work force. It is a hot topic
    today in education and in politics, as the labor market changes and highly skilled
    workers with knowledge of these four subjects are in high demand.


    According to the US Department of Labor, the average job is expected to experience
    7 percent growth between 2014 and 2024. However, the number of software developers
    is expected to grow 17 percent, while the number of web developers is expected
    to grow 27 percent! This is great news if you want to become a software developer.
    It is likely you will be able to find a job in your chosen field. Salaries are
    also likely to be high due to the high demand and limited supply for workers in
    the field.


    Correspondent John Dodge, writing for the Boston Globe, discussed how the shortage
    of software developers in Massachusetts was affecting the state in 2016:


    How fierce is the competition for technical talent in Massachusetts?


    Software developers right out of college can command starting salaries of up to
    $90,000. Once in their jobs, they can get as many as twenty recruiting calls a
    day trying to convince them to leave for another company. And when they do, a
    20 percent to 25 percent bump in salary is not unusual.


    ![](images/main-44.jpg)


    Lifetime earnings in the tech field are affected by your exact job title as well
    as your educational level.


    The shortage of skilled technology workers has become the No. 1 issue for many
    Massachusetts companies and a growing concern for the state’s innovation economy.
    Tech executives describe the hiring environment as brutal—worse even than the
    dot-com boom in the late 1990s—and a threat to their ability to expand, develop
    new technologies, and keep growing.


    While this article focuses on Massachusetts, the same issues confront companies
    around the country and the globe.


    ### Fears about Outsourcing


    Since the 1990s, there have been fears that outsourcing—having an outside company
    take over some task—would lead to a scarcity of jobs in the United States as companies
    moved jobs overseas.


    The fear of outsourcing was perhaps most intense in the tech world. In 2008, tech
    author Steve Holzner wrote an article detailing just how widespread the worries
    about outsourcing were in the tech field. He cited dropping enrollment numbers
    in computer science programs around the country and pessimism among programmers
    that they might lose their jobs. However, as Holzner said at the time, fears were
    overblown. While outsourcing is a relevant issue for economies around the world,
    the tech sector continues to boom in the United States.


    The US Department of Labor projections provide an interesting snapshot of this
    issue. According to their figures, the number of computer programmers in the United
    States is projected to decline 8 percent between 2014 and 2024—a shocking fact
    given the average career is expected to grow 7 percent. The US Department of Labor
    explains this is the result of the fact that “Computer programming can be done
    from anywhere in the world, so companies sometimes hire programmers in countries
    where wages are lower.”


    At first glance, outsourcing overseas seems to be a discouraging prospect. However,
    upon closer inspection, this is not the case. The number of software developers
    (as opposed to computer programmers) is expected to increase 17 percent. Furthermore,
    the average salary of a software developer was $102,280 in 2016, compared to an
    average salary of $79,840 for computer engineers. While the lower-paid work is
    being lost to companies overseas, more highly compensated work in the same sector
    is growing quickly in the United States. Most likely, this is due to the fact
    that work that requires collaboration (and is best done in the country) is also
    typically higher paying than work that can be done in isolation—and can be outsourced
    easily.


    ### Silicon Valley

