    free and open to the public. He encouraged his employer to make the web available
    to everyone and not to retain any control.


    Since its earliest days, the most basic language of the web has been HTML. In
    fact, websites are simply documents in HTML. You likely view them through a browser,
    which links them to other websites, fills them with images, animates their contents,
    and changes them as you interact with them (almost always via JavaScript). But
    you could simply open a text document and see the exact same website in its HTML
    format. HTML documents are plain text. Through their words and numbers, they spell
    out just how a website will appear when it is opened in a browser.


    HTML is not a programming language. Programming languages must contain instructions that
    are then completed. HTML simply marks up data to define what it is. As its name
    states, it is a markup language. Using tags (which function as commands) like
    <header> and <link>, HTML structures web pages. These tags make it possible for
    your browser to display the data correctly. But despite the fact it is not a programming
    language, HTML is a cornerstone of the internet.


    ##### DHTML and DOM


    Websites can be built just using HTML, but those websites are static. When you
    click on a link, the whole web page reloads. The viewer cannot interact with the
    website. It is impossible to create tabs or other basic functions that we now
    expect to see on the web.


    JavaScript solved this problem. As a client-side programming language, it allowed
    the website to change without a request being sent to the server. As a result,
    the new concept of DHTML (Dynamic HyperText Markup Language) took off in 1997
    with the release of Internet Explorer 4\. The same year, Netscape Navigator 4
    was released. Both browsers used DHTML, but they did so in different ways. Once again,
    it proved difficult for websites to be designed to work in both browsers.


    ![](images/main-14.jpg)


    The Document Object Model (DOM) structures documents . This is an example of a
    simple HTML document .


    DHTML is not a programming or markup language. Instead, it is a collection of
    technologies (chiefly HTML and JavaScript) that allow websites to be more interactive
    and dynamic. For instance, when you move your cursor over a button and the appearance
    of the button changes, it is DHTML that makes this possible. Before the advent
    of JavaScript and DHTML, this didn’t happen.


    To combat the rise of two different versions of DHTML, the World Wide Web Consortium
    (W3C) stepped in. Founded by Berners-Lee (who still heads it), the W3C recommended
    that browsers adopt the Document Object Model (DOM) to standardize DHTML across
    different browsers. The DOM relates to another markup language: XML. XML stands
    for extensible Markup Language, a text format used to store and transport data.
    The XML format is datacentric. It is concerned with accurately recording data.
    This is different from HTML, which focuses on displaying data on a web page. As
    a result, both markup languages are often used on the same web page.


    Like DHTML, the DOM is not a programming language. It provides structure for HTML
    and XML documents. According to the DOM, HTML and XML documents are represented
    as a structured group of nodes and objects. The DOM provides a way to categorize
    and map the documents. Due to this mapping, JavaScript is able to manipulate any
    component of the complex HTML and XML documents.


    ##### The Final Piece of the Puzzle


    So far, we have looked at both HTML and JavaScript. They remain the foundation
    of most websites to this day. But there is one missing piece we have not looked at:
    Cascading Style Sheets (CSS). CSS is the last of three languages that define the
    World Wide Web today. CSS is a style sheet language, and as its name suggests,
    it focuses on the presentation of a document (in practice, almost always an HTML
    document).


    CSS allows web developers to quickly and easily format a website to look more
    appealing. Using CSS, they can manipulate color, font, font size, margins, and more.
    While HTML is capable of doing much of this work, it does not do so efficiently.
    CSS allows you to format things like headings, links, and backgrounds across all
    the many web pages that make up a website. To do the same thing in HTML, you would
    have to format each HTML document individually.


    For instance, if you wanted every paragraph on a website to have text that was
    blue, centered in the middle, and the size of twelve pixels, you could write the
    following code:


    P {


    font-size: 12px;


    color: blue;


    text-align: center;


    }


    There is no quick way to accomplish the same task in HTML.


    ##### Ajax


    With the creation of CSS in 1996 and the DOM in 1998, the stage was set for a
    revolution. JavaScript had allowed websites to become more and more dynamic and
    interactive. Bodies like the W3C and the ECMA had also managed to create standards
    that were widely adopted and allowed websites to be compatible across different
    browsers. Websites—once static pages—were growing more sophisticated all the time.
    Previously, desktop applications had far surpassed the capabilities of websites,
    but this was soon to change.


    In 2004, Google released Gmail, an email service, soon followed by Google Maps.
    The two websites were capable of far more than was typical of the time. Others
    soon followed Google’s lead, and website functionality increased like never before.
    In 2005, interface designer and information architect Jesse James Garrett coined
    the term Ajax (Asynchronous JavaScript and XML) to describe the way that these new
    sites worked.


    Ajax is not a programming language. Instead, it is a way that a website can access
    a web server. It allows websites to communicate with a server in the background.
    This in turn lets websites update what they display in real time, without the
    need for the website to refresh. Nowadays, Ajax is used all the time by websites
    we visit every day. It is how Facebook and other sites can have a never-ending
    stream of up-to-date information. As you read one comment, more load below it
    so that you can scroll down and see new content. It is Ajax that makes this possible. Before
    the advent of Ajax, you had to refresh a web page to see new content.


    The word “asynchronous” as used in Ajax means that all of the activity is happening
    in the background. JavaScript is used to send a request to the server—in the case
    of Facebook, this request occurs when you scroll down and more content is needed.
    The server sends a response back, and this response is read by JavaScript and
    able to be displayed immediately in the browser.


    ##### Web 2.0


    Around the same time, a man named Tim O’Reilly said that a fundamental reshaping
    of the web was underway. He referred to this new web as Web 2.0. The static web
    pages of old were being replaced by interactive ones—often based on collective
    intelligence and user engagement, like Wikipedia. Blogging became popular and
    replaced the old idea of personal web pages. Facebook was founded the same year
    as O’Reilly began talking about Web 2.0\. The web that we are familiar with today
    was taking shape.'
