    然而，对于网站开发而言，API 填充了一个你可能已经见过很多次的特定领域。它们允许网站轻松地将 `third-party`（第三方）组件嵌入你的网站中。许多网站允许你使用
    Gmail 地址或 Facebook 账户创建账户正是如此。许多网站嵌入 YouTube 视频也是这样实现的。


    让我们看看 Google Maps 来了解它是如何运作的。要在你的网站上添加一个带有标记的地图，你只需要在完成一些准备工作后，将以下 JavaScript
    代码粘贴到你的网站中：


    ```html

    <script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">

    </script>

    ```


    ![](img/main-23.jpg)


    API 让开发者能够轻松将 Google Maps 嵌入到网站中。在离线状态，Google Maps 标记甚至进入了艺术领域，例如 Aram Bartholl
    的这件雕塑。


    然后，当你的网站加载时，它将包含一个由 Google Maps 提供的地图，该地图在你之前指定的位置有一个标记。这比自己创建地图和标记要简单得多。你的用户还可以利用
    Google Maps 内置的许多功能，例如路线和卫星视图。这说明了 API 的强大之处以及用于将它们添加到网站的简短 JavaScript 代码。只需少少的努力，网页开发者就可以利用
    Google Maps 和 YouTube 这样完善的网站来改进自己的网站，并提供像视频播放和精确地图这样难以编码的服务。


    最流行的 JavaScript 库是 `jQuery`。和所有库一样，你需要下载 `jQuery` 库，或者链接到互联网上的内容分发网络（CDN）来使用它。Google
    托管了一个免费提供 `jQuery` 的 CDN。一旦你获取了 `jQuery`，你就可以简化你网站上的许多不同过程。`jQuery` 的一些主要用途是 `DOM`
    操作（网页的结构）、`Ajax` 支持以及图像动画。虽然 `jQuery` 有许多不同的、离散的用途，但它仍然被认为是一个库，因为它不是一个从根本上改变你构建网站方式的通用框架。


    你可以使用 `jQuery` 做的另一件方便的事是创建回调函数。由于 JavaScript 语句是按行执行的，当某行代码在它依赖的上一行代码完成执行之前执行时，就会发生错误。为了防止这个问题，使用了回调函数。回调函数允许你指定只有在另一个函数完成后，才执行另一个函数。许多开发者在没有
    `jQuery` 帮助的情况下创建回调函数，但使用像 `jQuery` 这样的库可以简化这一过程。


    ![](img/image_002_.jpg)


    Gmail 在单个网页上执行许多不同操作（如查看不同的收件箱和起草电子邮件）的能力归功于 JavaScript。


    截至 2017 年，最常用的 JavaScript 框架是 `AngularJS`。它是一个由 Google 维护的开源项目，其重点是简化使用 `HTML`
    和 JavaScript 创建单页应用（SPA）。单页应用是功能上某种程度上类似于应用程序或程序的单个网页。它们不需要像由许多不同页面组成的传统网站那样加载不同的网页。例如，`Gmail`
    就是一个单页应用。一旦你登录并访问你的账户，你就可以读取邮件、起草邮件，并查看不同的收件箱，而无需导航到不同的页面。


    `AngularJS` 比库要广泛得多——它的目标是成为构建客户端单页应用所需的唯一资源（它不扩展到服务端）。`AngularJS` 的网站按方式描述了它：


    > AngularJS 是一个用于动态 Web 应用程序的结构性框架。它让你使用 `HTML` 作为你的模板语言，并让你扩展 `HTML` 的语法以清晰、简洁地表达你的应用程序组件……


    `AngularJS` 并不是构建 Web 应用客户端整体拼图中的某一部分。它处理了你曾经手动编写的所有 `DOM` 和 `Ajax` [连接不同组件以便它们相互兼容的代码]，并将其置于一个定义良好的结构中。


    `AngularJS` 人气最大的竞争对手是 `React`。`React` 是一个库而不是框架，但大多数时候，开发者会使用其中一个来创建网站。哪一个更好通常取决于网站的具体性质，尽管开发者的体验有时也会起作用——许多开发者对其中一个比另一个更熟悉。


    使用像 `AngularJS` 这样的框架的主要优点之一是减少了你必须编写的代码量。它让你无需处理回调函数等问题，而如果你在框架之外编写代码，这些问题是不可少的，并且可能会占用开发者大量的时间，却无法显性地改进网站。框架可以让你更多关注宏观问题，例如网站的功能以及你想通过它实现的目标。


    ### 异步 JavaScript


    代码通常是同步的。这意味着它是按顺序执行的。然而，正如之前提到的，某些同步代码有一个主要的缺点。通常需要等待上一个命令执行完毕后才能完成下一个命令。这可能导致同步代码加载缓慢。如果一个过程耗时很长，执行就会停滞。


    为了解决这个问题，可以以异步方式编写 JavaScript。你可以控制代码执行的时机，确保缓慢的过程不会导致你的网页出现很长的加载时间。事实上，异步是如此重要，以至于“异步”（异步）是
    `Ajax` 中的“A”。如果没有放置异步请求（即不会让网页等待响应的请求）的能力，`Ajax` 就无法实现快速交互式的网页。


    尽管如此，某些 JavaScript 的异步特性对开发者来说可能是一个巨大的头疼。要在正确的地方编写简单、直接异步代码是困难的。事实上，错误处理回调函数（异步代码的一个重要工具）是导致意大利面代码（spaghetti
    code）最常见的原因之一：代码组织就像一碗意大利面。


    幸运的是，许多 JavaScript 库和框架可以帮助你避免异步代码的常见问题。某些 JavaScript 引擎甚至包含了两个函数 `async` 和 `await`，这将简化编写异步代码的任务。虽然这两个函数尚未被
    `ECMA` 采用并加入标准 JavaScript，但它们很可能在未来的某个时候被采纳。


    #### 使用 JavaScript 进行黑客


    o o o


    ![](img/main-24.jpg)


    一台被勒索软件感染的计算机。


    JavaScript 较少为人知的用途之一是用于非法目的。恶意软件（malware）偶尔会完全用 JavaScript 编写。最近，出现了两起使用 JavaScript
    攻击有漏洞计算机的高知名案例。


    2016 年，一种新型勒索软件出现在互联网上。勒索软件加密计算机上的文件并锁定所有者的访问权限。除非他们向黑客支付赎金，否则他们无法访问这些文件。虽然勒索软件是一种典型的恶意软件，但这次攻击引人注目，因为勒索软件是用
    JavaScript 编写的。


    JavaScript 是该恶意软件的一个明智选择，因为程序倾向于信任 JavaScript 文件。你可以轻松地从邮件打开此类文件，许多邮件客户端不会警告用户此类操作是不安全的。它们直接运行代码——在这种情况下，这导致了除非所有者支付
    250 美元，否则感染计算机上的数据就会被劫持。


    '
- fmt: "\nThe malware was named `RAA`. As always, the best way to avoid infection\
    \ was to not open the attachment from the original email delivering the malware.\
    \ `RAA` was the first time that ransomware was created solely using `JavaScript`.\
    \ But given the popularity of the language, it is unlikely to be the last.\n\n\
    Researchers have also used `JavaScript` to take over computers and phones using\
    \ the so-called `Rowhammer` exploit. This attack relies on the hardware—or physical\
    \ components—of a device rather than its programs. Usually, `JavaScript` from\
    \ a website is forbidden from accessing the most vital memory locations of a device.\
    \ This prevents websites from stealing sensitive information like passwords or\
    \ taking over your computer. However, when memory locations are accessed in a\
    \ certain way, there is a small chance that neighboring memory locations are changed.\
    \ `Rowhammer` takes advantage of this fact and is capable of taking over devices\
    \ by repeatedly accessing its memory until it can corrupt and take over the most\
    \ important parts of the device's memory—parts that it is usually locked out of.\n\
    \nAccording to researchers, it is \"the first remote software-induced hardware-fault\
    \ attack.\" In other words, it is the first time that a program has been able\
    \ to exploit a vulnerability found in the physical nature of a device from a location\
    \ across the world. Other hardware-fault attacks have relied on having physical\
    \ access to the device: an example is shining a laser on a device may be able\
    \ to crack encryption in some cases.\n\n`Rowhammer` represents a threat of the\
    \ future and one reason that security researchers are so concerned about it is\
    \ its use of `JavaScript`. There are few steps that you can take to prevent a\
    \ website from running `JavaScript` if you have it enabled. And since the weakness\
    \ it targets is in a device's hardware, no easy fix is possible.\n\n## Making\
    \ Phone Apps\n\nCoding phone apps has often been a time-consuming activity. The\
    \ prevalence of `iOS` and `Android` operating systems on phones means that apps\
    \ usually have to be programmed in two different programming languages. Traditionally,\
    \ this was `Objective-C` for `iOS` and `Java` for `Android`. However, this has\
    \ changed in recent years. `Objective-C` has been largely replaced by the programming\
    \ language `Swift`. Developed by Apple in 2014, it is similar to `Objective-C`\
    \ but tries to be simpler and easier to learn. This was a major step forward for\
    \ making app development easier for companies and individuals alike.\n\nToday,\
    \ `JavaScript` frameworks also allow apps to be programmed in only `JavaScript`.\
    \ By far the most popular of these frameworks is Facebook’s `React Native`. `React\
    \ Native` is very different from `React`—the `JavaScript` library that focuses\
    \ on website interfaces. `React Native` is considered a framework rather than\
    \ a library, and it is solely concerned with the creation of apps for `iOS` and\
    \ `Android` devices—not websites.\n\nTo get started with `React Native`, you simply\
    \ need to download the free files available on Facebook’s website and ensure that\
    \ you have `Node.js` on your computer. Then, you are ready to start coding. `React`’s\
    \ website gives the following code as an example that creates an app displaying\
    \ the words “Hello world!”:\n\n```javascript\nimport React, { Component } from\
    \ 'react';\nimport { AppRegistry, Text } from 'react-native';\n\nexport default\
    \ class HelloWorldApp extends Component {\n  render() {\n    return (\n      <Text>Hello\
    \ world!</Text>\n    );\n  }\n}\n\n// skip this line if using Create React Native\
    \ App\n\nAppRegistry.registerComponent('HelloWorldApp', () => HelloWorldApp);\n\
    ```\n\nThere are a number of features of `JavaScript` that you might recognize.\
    \ Semicolons are used at the end of statements. Camel case is used in the code,\
    \ and two backslashes mark the beginning of a comment in the code that is not\
    \ executed. However, this is a very simple example of an app programmed with `React\
    \ Native`. Fully developed apps can be quite complex, despite the use of a framework\
    \ to simplify things.\n\n![Image](page53_image4.jpg)\n\nOpposite: `JavaScript`\
    \ is everywhere, including your inbox. But that doesn't mean that it's the best\
    \ language for all web development.\n\n![](images/image_003_.jpg)\n\n### Strengths\
    \ and Weaknesses\n\n`JavaScript` has a number of strengths and weaknesses. Some\
    \ are the result of its popularity, while others are the result of its very design\
    \ as a programming language. Like all programming languages, many of the design\
    \ decisions that shaped the language came with benefits and drawbacks. Multiple\
    \ languages can accomplish the same tasks with varying levels of difficulty—the\
    \ best language to use for a project depends on your goal. However, `JavaScript`\
    \ is unique in a number of very important ways. This is why it is the programming\
    \ language most commonly used by professional developers. There is often no way\
    \ to replace `JavaScript`—especially in web development.\n\nTherefore, it is unlikely\
    \ to fade in popularity any time soon. In this chapter, we look at a number of\
    \ advantages and disadvantages of `JavaScript`.\n\n## The Only Client-Side Scripting\
    \ Language\n\n`JavaScript` remains the only real choice for a client-side scripting\
    \ language. This is an absolutely essential role in website development. It is\
    \ what allows your browser to change the display of a website and check that you\
    \ have completed forms without sending a request to the server. The lack of such\
    \ a language was the reason for `JavaScript`’s creation, but unlike many other\
    \ languages, `JavaScript` has never seen a serious competitor try to take its\
    \ place. For this reason, `JavaScript` is a fixture in the realm of web development.\n\
    \nThe benefits of such a language are multifaceted. They allow websites to be\
    \ far faster and servers to be put under less stress. This is due to the fact\
    \ that more can happen on the user’s machine rather than through repeated communications.\
    \ Less online communication means that the user has to wait less time for the\
    \ website to refresh. Instead, it can update instantaneously as client-side scripts\
    \ specify that the appearance should change or a request should not be made because\
    \ required form is blank.\n\nClient-side programming languages are also a necessary\
    \ component of `Ajax` (which is why `JavaScript` is the “J” in the acronym). `JavaScript`\
    \ allows websites to update constantly behind the scenes so that components like\
    \ Facebook’s news feed can scroll endlessly with new content without the need\
    \ for the web page to refresh. Here, too, `JavaScript` is impossible to replace.\
    \ This benefit is hugely important. All made possible by JavaScript.\n\n## Popularity:\
    \ A Blessing and a Curse\n\nOne of the chief benefits of learning `JavaScript`\
    \ is its incredible utility. No other language can be used to do so many different\
    \ things. Not only is `JavaScript` required to build a modern website, it can\
    \ also be used to make phone apps and desktop apps if you download free, open-source\
    \ frameworks.\n\nTherefore, if you learn `JavaScript` well, you can complete all\
    \ sorts of projects on your own.\n\nAccording to surveys, `JavaScript` is used\
    \ by a greater number of computer programmers than any other programming language.\
    \ It is popular not only among front-end web developers—where it is virtually\
    \ required—but also among back-end developers who have other options like `Java`.\
    \ It is also gaining popularity in app creation as frameworks like `React Native`\
    \ are refined.\n\n![](images/main-31.jpg)\n\n`React Native` allows developers\
    \ to create apps for both `Android` and `iOS` phones, the two most popular operating\
    \ systems for smartphones.\n"
  raw: 'The malware was named RAA . As always, the best way to avoid infection was
    to not open the attachment from the original email delivering the malware . RAA
    was the first time that ransomware was created solely using JavaScript . But given
    the popularity of the language, it is unlikely to be the last .


    Researchers have also used JavaScript to take over computers and phones using
    the so-called Rowhammer exploit . This attack relies on the hardware—or physical
    components—of a device rather than its programs . Usually, JavaScript from a website
    is forbidden from accessing the most vital memory locations of a device . This
    prevents websites from stealing sensitive information like passwords or taking
    over your computer. However, when memory locations are accessed in a certain way,
    there is a small chance that neighboring memory locations are changed . Rowhammer
    takes advantage of this fact and is capable of taking over devices by repeatedly
    accessing its memory until it can corrupt and take over the most important parts
    of the device''s memory—parts that it is usually locked out of.


    According to researchers, it is "the first remote software-induced hardware-fault
    attack . " In other words, it is the first time that a program has been able to
    exploit a vulnerability found in the physical nature of a device from a location
    across the world . Other hardware-fault attacks have relied on having physical
    access to the device: an example is shining a laser on a device may be able to
    crack encryption in some cases .


    Rowhammer represents a threat of the future and one reason that security researchers
    are so concerned about it is its use of JavaScript . There are few steps that
    you can take to prevent a website from running JavaScript if you have it enabled
    . And since the weakness it targets is in a device''s hardware, no easy fix is
    possible.


    ##### Making Phone Apps


    Coding phone apps has often been a time-consuming activity. The prevalence of
    iOS and Android operating systems on phones means that apps usually have to be programmed
    in two different programming languages. Traditionally, this was Objective-C for
    iOS and Java for Android. However, this has changed in recent years. Objective-C
    has been largely replaced by the programming language Swift. Developed by Apple
    in 2014, it is similar to Objective-C but tries to be simpler and easier to learn.
    This was a major step forward for making app development easier for companies
    and individuals alike.


    Today, JavaScript frameworks also allow apps to be programmed in only JavaScript.
    By far the most popular of these frameworks is Facebook’s React Native. React
    Native is very different from React—the JavaScript library that focuses on website
    interfaces. React Native is considered a framework rather than a library, and
    it is solely concerned with the creation of apps for iOS and Android devices—not
    websites.


    To get started with React Native, you simply need to download the free files available
    on Facebook’s website and ensure that you have Node.js on your computer. Then,
    you are ready to start coding. React’s website gives the following code as an
    example that creates an app displaying the words “Hello world!”:


    import React, { Component } from ''react''; import { AppRegistry, Text } from
    ''react-native'';


    export default class HelloWorldApp extends Component {


    render() { return (


    <Text>Hello world!</Text>


    );


    }


    }


    // skip this line if using Create React Native App


    AppRegistry.registerComponent(''HelloWorldApp'', () => HelloWorldApp);


    There are a number of features of JavaScript that you might recognize. Semicolons
    are used at the end of statements. Camel case is used in the code, and two backslashes
    mark the beginning of a comment in the code that is not executed. However, this
    is a very simple example of an app programmed with React Native. Fully developed
    apps can be quite complex, despite the use of a framework to simplify things.


    ![Image](page53_image4.jpg)


    Opposite: JavaScript is everywhere, including your inbox . But that doesn''t mean
    that it''s the best language for all web development .


    ![](images/image_003_.jpg)


    ### Strengths and Weaknesses


    JavaScript has a number of strengths and weaknesses. Some are the result of its
    popularity, while others are the result of its very design as a programming language.
    Like all programming languages, many of the design decisions that shaped the language
    came with benefits and drawbacks. Multiple languages can accomplish the same tasks
    with varying levels of difficulty—the best language to use for a project depends
    on your goal. However, JavaScript is unique in a number of very important ways.
    This is why it is the programming language most commonly used by professional
    developers. There is often no way to replace JavaScript—especially in web development.


    Therefore, it is unlikely to fade in popularity any time soon. In this chapter,
    we look at a number of advantages and disadvantages of JavaScript.


    ##### The Only Client-Side Scripting Language


    JavaScript remains the only real choice for a client-side scripting language.
    This is an absolutely essential role in website development. It is what allows
    your browser to change the display of a website and check that you have completed
    forms without sending a request to the server. The lack of such a language was
    the reason for JavaScript’s creation, but unlike many other languages, JavaScript
    has never seen a serious competitor try to take its place. For this reason, JavaScript
    is a fixture in the realm of web development.


    The benefits of such a language are multifaceted. They allow websites to be far
    faster and servers to be put under less stress. This is due to the fact that more can
    happen on the user’s machine rather than through repeated communications between
    the client and server. Less online communication means that the user has to wait
    less time for the website to refresh or update as it sends requests over the internet.
    Instead, it can update virtually instantaneously as client-side scripts specify
    that the appearance should change or a request should not be made because a required
    form is blank.


    Client-side programming languages are also a necessary component of Ajax (which
    is why JavaScript is the “J” in the acronym). JavaScript allows websites to update
    constantly behind the scenes so that components like Facebook’s news feed can
    scroll endlessly with new content without the need for the web page to refresh.
    Here, too, JavaScript is impossible to replace. This benefit is hugely important.
    Without Ajax, the World Wide Web would be a very different place—and it is all
    made possible by JavaScript.


    ##### Popularity: A Blessing and a Curse


    One of the chief benefits of learning JavaScript is its incredible utility. No
    other language can be used to do so many different things. Not only is JavaScript required
    to build a modern website, it can also be used to make phone apps and desktop
    apps if you download free, open-source frameworks.


    Therefore, if you learn JavaScript well, you can complete all sorts of projects
    on your own. From building fully functional websites to mobile games, JavaScript
    can do it all.


    According to surveys, JavaScript is used by a greater number of computer programmers
    than any other programming language. It is popular not only among front-end web
    developers—where it is virtually required—but also among back-end developers who
    have other options like Java. It is also gaining popularity in app creation as
    frameworks like React Native are refined.


    ![](images/main-31.jpg)


    React Native allows developers to create apps for both Android and iOS phones,
    the two most popular operating systems for smartphones.'
