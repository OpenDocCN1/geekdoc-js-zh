    responsible for finding your own clients. You need to market yourself to find
    paying work, and you still do answer to your clients even if they are not your
    boss. Furthermore, you have to motivate yourself to do your work; the fact that
    no one is setting your hours can quickly become a problem if you procrastinate.


    ##### Landing a Job


    If you decide to look for a job rather than strike out as a freelancer, you need
    to work on perfecting your resume and honing your skills. Generally, large companies
    like Google or Facebook require a strong computer science background. While you
    might send off an application, you should also look at smaller companies that
    have more relaxed standards if you taught yourself or went to a coding boot camp.
    In general, small starts-ups are the most willing to give self-taught programmers
    a chance.


    To improve your chance of landing a job, you can take a number of steps. The most
    important is to practice coding and programming. Even if you went to a boot camp
    or graduated with a degree in computer science, it is important to refine your
    skills and prepare for coding tests—they are often part of the hiring process.
    Interviewers will often ask questions to test your knowledge, and time spent coding
    and learning how to code is time well spent.


    ![](images/main-46.jpg)


    Getting involved in projects on GitHub is a great way to show off your coding
    skills .


    ![](images/main-47.jpg)


    Steve Jobs (left) and Steve Wozniak (right) started Apple in a garage .


    You can also build your resume by working on projects even before you are hired
    for your first job. If there are apps or websites you built on your own to add
    to your resume, this demonstrates your ability to code and your talent. Additionally,
    you can contribute to open-source projects online to show that you are a capable programmer.
    Adding accomplishments like this to your resume can be especially important if
    you are self-taught. It is proof that your skills are up to par and you would make
    a valuable addition to a programming team.


    In addition to these programming-specific tips, it is also important to follow
    general advice for seeking a job. You should make sure your resume is polished and
    proofread. Employers want to know that you are attentive to details and take pride
    in your work. Also, networking is important in the programming world just as in
    any other field. Many people get jobs when they hear about them from a friend
    or acquaintance.


    Perhaps the most important thing is to keep trying to find a job. Most openings
    have dozens of applicants, so it is necessary to keep trying even if you don’t
    find one right away. Programming is in such high demand that if your skills are
    sharp, you can find a job eventually if you keep trying and practicing coding.


    ##### JavaScript: The Language that Changed the Web


    Since its creation in 1995, JavaScript has been an integral language for computer
    programmers. Its development resulted in interactive web pages, which spurred
    the modern growth of the web and led to the collaborative, social web that we
    know today. Since then, its usage has also expanded into app creation and other
    domains of programming. Its reach is unmatched by any other programming language,
    and virtually all professional programmers have some knowledge ofJavaScript. Nevertheless,
    it is a powerful language and mastering it—and its popular frameworks and libraries—is
    a difficult task.


    Yet with some effort and practice, mastery is a possibility for all kinds of learners.
    The payoffs of learning JavaScript are huge. Fluency in the language truly opens
    doors to a wide range of careers. It also gives you the opportunity to leave your
    mark on the web.


    <Glossary/>


    **angel investor** A wealthy individual who gives a large amount of money to a
    start-up or individual entrepreneur.


    **AngularJS** A popular JavaScript Framework that is designed to create single-page
    web applications .


    **array** In JavaScript, a kind of variable that can hold more than one value
    .


    **back end** The part of the website that your browser communicates with over
    the internet . It consists of the server and sometimes databases and applications
    . It is also known as the server side .


    **Boolean** A data type that stores the information "true" or "false


    **callback** A JavaScript function used to order when lines of code will execute
    .


    **compatible** Two or more items that can work together.


    **data type** A classification of data; common data types are numbers and strings
    (of characters, generally words or sentences) .


    **elements** In HTML, elements are individual components of the HTML document
    . They often have start and end tags, such as <p> and </p> for a paragraph, but
    sometimes they are one tag, such as <br> for a line break .


    **encrypted** The quality of being encoded for security reasons .


    **framework** JavaScript frameworks structure your code and are intended to simplify
    some processes so that you can focus on the content of your website or app rather
    than writing code .


    **freelancer** A person who is self-employed rather than the employee of a company.


    **front** end The part of a website that is visible to the user and often changes
    based on their input . It is also called the client side .


    **library** JavaScript libraries are collections of pre-written code that can
    help developers save time . They are generally less all-encompassing than frameworks
    .


    **methods** In JavaScript, methods are actions that can be performed on objects
    .


    **native** Native code is designed to run on a particular system— making it faster.
    Code that isn''t native tends to run slower.


    **open source** The source code of open-source software is freely available and
    people are allowed to modify it . There are often communities that maintain and
    improve popular open-source software .


    **operating system** The software responsible for a computer or smartphone''s
    basic functionality.


    **properties** The values associated with a JavaScript object; for example, if
    the object is a vehicle, the properties could be its weight and color.


    **React** A JavaScript library created by Facebook that primarily deals with the
    user interface of web pages .


    **React Native** A JavaScript framework created by Facebook that allows users
    to create Android and iOS applications using JavaScript .


    **referendum** A direct vote by the people on a single political issue, rather
    than the typical legislative process of representatives voting on a law.


    **runtime** The time period when a computer program executes.


    **scripting language** A programming language that executes commands at runtime
    .


    **self-employed** Working as a freelancer or small business owner rather than
    as an employee of another person or business .


    **source code** Instructions for a computer that can be understood by people .


    **spaghetti code** An informal and pejorative phrase for code that is needlessly
    complex and difficult to work with as a result of poor programming .


    **start-up** A new business that hopes to grow quickly and usually has outside
    funding .


    **static** Unchanging .


    **strings** A set of characters that can include letters and numbers . It is a
    common data type that is used to store words and sentences .


    **syntax** The "grammar" of a programming language .


    **third-party** Developed by an outside company.'
