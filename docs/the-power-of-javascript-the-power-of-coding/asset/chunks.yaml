    The technological bedrock of Web 2.0 was `Ajax`. It is what allowed websites to
    be so dynamic and interactive. `Ajax` was only made possible because of `JavaScript`.
    `JavaScript`, running on the client side rather than on a server, allowed web
    pages to change constantly with user input.


    Tim O’Reilly defines Web 2.0 in the following way:


    Web 2.0 is the network as platform, spanning all connected devices; Web 2.0 are
    those that make the most of the intrinsic advantages of that platform: delivering
    software as a continually-updated service that gets better the more people use
    it, consuming and remixing data from multiple sources, including individual users,
    while providing their own data and services in a form that allows remixing by
    others, creating network effects through an “architecture of participation,” and
    going beyond the page metaphor of Web 1.0 to deliver rich user experiences.


    Since 2005, websites have continued to increase in complexity. But the ideas of
    collaboration and a rich user experience have remained the same. Even the technology
    of `Ajax` has remained constant, although it has changed to some degree in its
    execution.


    ![](images/main-15.jpg)


    The iPhone, released in 2007, was the first smartphone that looks like today''s
    smartphones.


    ## The Smartphone Revolution


    The next great step forward in technology was the rise of smartphones. Smartphones
    developed gradually with the rise in popularity of both mobile phones and personal
    digital assistants (hand-held devices that could send emails and connect to the
    internet). The two devices were combined into one device—capable of placing calls
    and connecting to the internet.


    Early smartphones looked quite different from what we are accustomed to today.
    They often had small keyboards and pens attached. The screens were colorless and
    difficult to navigate. That all changed in 2007 with the release of the iPhone.
    The new innovation by Apple sent shockwaves across the tech world. Its large touchscreen
    and streamlined design signaled a shift in the industry. Even though the iPhone
    was largely rejected by businesses at the time in favor of older models of smartphones,
    it shaped the way that the world saw connectivity.


    A year after the release of the iPhone, Google released the `Android` mobile operating
    system. Like the iPhone, it was for use on devices with large touchscreens like
    the ones we use today. The struggle between Apple and Google (as well as other
    smartphone companies) would set the stage for the so-called smartphone wars, which
    began in 2009 and continue to this day. Companies secured patents for technologies
    they used in their phones and sued competitors in courts around the world for
    patent infringement.


    At the same time, titans like Apple and Samsung competed to sell the most phones
    and expand their customer base. In 2011, just 35 percent of Americans owned a
    smartphone according to the Pew Research Center. Today, more than 75 percent do.
    The rapid expansion of this market has had a huge effect on the programming world.
    The development of smartphone apps has become a significant industry around the
    globe.


    ## Facebook and JavaScript


    You''ve almost certainly heard of Facebook, and you might be one of the hundreds
    of millions of people who use it every day. But what you might not know is just
    how important the company is to the modern landscape of `JavaScript`. Before we
    look at the specifics of their contributions to `JavaScript`, let''s look at their
    more humble beginnings as a company.


    Facebook was founded in 2004 by Mark Zuckerberg, then a student at Harvard University.
    The site''s popularity expanded extraordinarily quickly. Within a month, half
    of Harvard''s undergraduates had accounts. In 2005, it had six million users.
    By March 2017, there were nearly two billion.


    Facebook became one of the most highly valued companies in the world. At the beginning
    of 2017, the value of its stock was valued at $381 billion. With its meteoric
    rise, Facebook has branched out from the world of social media into different
    areas. The company bought popular messaging service WhatsApp in 2014 and is heavily
    involved in the field of virtual reality.


    In 2013, Facebook released `React—a JavaScript library`. `JavaScript` libraries
    aim to make coding simpler and easier. They often include prewritten chunks of
    `JavaScript` that developers can use and manipulate without starting from scratch.
    While they still require a detailed knowledge of the programming language to use
    them, they can save programmers time and energy. It is also possible for websites
    to use more than one `JavaScript` library. In fact, most large websites use many
    different libraries to achieve different goals and solve different problems that
    might present themselves.


    `React` is primarily built for the creation of user interfaces, the appearance
    of some technology that the user then interacts with. For a website, this includes
    features like navigation bars and input fields, which the user interacts with
    to accomplish tasks.


    According to its creators, the purpose of `React` is to "[encourage] the creation
    of reusable `UI` components which present data that changes over time." Think
    about Facebook''s user interface. There are many different scrolling sections
    and links that make up a very complex display. Facebook uses `React` to make manipulating
    this user interface as simple as possible. Without `React`, you can build a site
    like Facebook using `JavaScript`, but it is a much more timeconsuming task to
    create and maintain it as user interface changes over time.


    According to Facebook, `React` also has the added benefit of helping developers
    improve their products since it forces us to break our applications down into
    discrete components, each representing a single view. In 2015, with the release
    of `React Native,a JavaScript framework that focuses on the creation of phone
    apps`, Facebook expanded its reach further into the world of `JavaScript` and
    coding resources. It remains to be seen how much the company will do in this domain.


    Mobile app development has been greatly influenced by the two main mobile operating
    systems: Apple’s `iOS` (which is restricted to Apple devices) and Google’s `Android`
    (used by nearly every phone manufacturer except Apple). In the beginning, apps
    could not be written in the same programming language and run on both `iOS` and
    `Android`. It was a situation reminiscent of the browser wars, when websites had
    to choose between running well on `Netscape Navigator` or `Internet Explorer`.


    `Android` apps were typically written in `Java`, while `iOS` apps were written
    using `Objective-C`. The two different programming languages made development
    across both operating systems costly and time consuming. To this day, apps are
    often released on one platform before being reworked and released on the other.


    ### JavaScript Conquers the Phone


    In the beginning, the closest you could come to creating an app with `JavaScript`
    was a mobile web app. Despite their name, these kinds of apps are not truly applications
    at all. Instead, they are web pages, viewed in a browser, which seek to emulate
    the style and layout of an app. They cannot be downloaded from an app store, and
    they require a browser to open them.


    But this changed in 2008. A company by the name of Nitobi Software developed a
    mobile application development framework called `PhoneGap`. It allows developers
    to create phone apps using `JavaScript`, `HTML`, and `CSS`—the three languages
    of website development. The apps can then run on both `Android` and `iOS` devices
    without the need to program the app in two different programming languages.

