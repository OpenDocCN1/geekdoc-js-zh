  raw: 'Data from another job website, gooroo.io, makes this clear. The site breaks
    down what JavaScript developers make based on the framework they are responsible
    for using. According to their postings, the average salary of a developer who
    primarily uses Node.js is $98,003, while the average salary of one who uses React
    is $78,603\. What you do with your knowledge of JavaScript can have a big impact
    on your salary.


    To sum up, it is unclear what exactly a person who works with JavaScript could
    expect to earn compared to a peer who worked with another language like Ruby or
    C++. What is clear is that JavaScript is one of the most widely used programming
    languages, and it is popular among developers who work in many different fields
    in the tech industry.


    ##### More Motivation to Learn a Language


    Outside of getting a job, there are other good reasons to learn how to program.
    Learning a programming language teaches you to think rationally and to solve problems.
    Many people have explained the myriad benefits that learning to code brings, and
    many influential people think all students should at least learn the basics of
    how to code to prepare them for life. In a 1995 interview, Apple founder Steve
    Jobs expressed his own views about why learning to program is so important:


    I think everybody in this country should learn how to program a computer, should
    learn a computer language, because it teaches you how to think. It’s like going
    to law school. I don’t think anybody should be a lawyer, but I think going to
    law school would actually be useful because it teaches you how to think in a certain way—in
    the same way, computer programming teaches you, in a slightly different way, how
    to think. I view computer science as a liberal art. It should be something everyone
    learns—takes a year in their life, one of the courses they take is learning how
    to program.


    ![](images/main-40.jpg)


    Steve Jobs believed everyone should learn to code .


    Once you’ve decided to learn how to code, the next question is how to go about
    it. The three main options are college, coding boot camp, or learning on your
    own. All three have their distinctive advantages and disadvantages, and which
    one is best for you is a highly personal choice. It depends on your preference for
    learning alone or in a group, as well as how much money you want to spend on education.
    College is by far the most expensive option (without significant scholarships),
    followed by coding boot camps, which can also cost thousands of dollars. Self-study,
    on the other hand, can be virtually free if you have a computer with internet
    access or can use one at a library.


    ##### The Question of College


    One of the biggest decisions to make is whether or not to attend college to study
    a field related to coding, such as computer science or computer programming. This
    is a controversial question, and many people argue that you should get a degree
    in the field. Others say it is unnecessary and a waste of money given the high
    cost of tuition (and often four years outside the job market).


    First, let’s look at the arguments in favor of a degree. The fact is that the
    majority of professional developers have at least a bachelor’s degree. According to
    the Stack Exchange survey, 76.5 percent of respondents did. Of these, almost 80
    percent majored in a field related to computers. The numbers show that you’d be
    in good company if you decided to pursue a degree at college. Furthermore, more
    than a quarter of respondents reported having a master’s or doctoral degree in
    the discipline. Traditional schooling is still quite popular in the industry.


    ![](images/main-41.jpg)


    Salary tends to increase the more education you receive .


    According to reports, employers often want to see a degree as well. According
    to a 2015 report by Burning Glass Technologies, an analytics software company
    that monitors the technology labor market, “89 percent of coding jobs typically
    require at least a bachelor’s degree, compared to 44 percent of all career-track
    jobs.” For the purposes of this report, career-track jobs are defined as those
    that pay more than $15 an hour.


    Perhaps the most compelling reason to go to college is for your own education
    and enrichment. A bachelor’s degree often requires a number of elective courses
    in the humanities and other fields. You might discover you are interested in some
    subjects you had never been exposed to before. Also, you will likely have to take
    a computer science class that covers the more theoretical aspects of computer
    science, such as how computing relates to mathematics.


    Nevertheless, there are many people who say that a degree is not necessary for
    a successful career as a developer. The prominent examples for such arguments are
    often Bill Gates, the founder of Microsoft, and Steve Jobs, the founder ofApple.
    Neither one completed their own undergraduate studies (although they both began
    degrees). Instead, they left college to begin the work of starting their own companies
    that then went on to become two pillars of the tech industry.


    One argument for not going to school to study programming is the fast-paced nature
    of the industry. Aspects of it, like what JavaScript framework is used to program
    apps, change at breakneck speed. By the time you finish a four-year degree program,
    it is likely that much of what you learned is hopelessly out of date.


    Financial arguments are also put forward to argue against going to college. Salaries
    among those with degrees are typically slightly higher than among the self-taught.
    However, this difference drops off the further into one’s career you look. And
    the fact of the matter is that a few thousand dollars a year does not offset the cost
    of school tuition and four years outside the job market in most cases.


    ![](images/main-42.jpg)


    Yale professor David Gelernter


    Many people argue that the university courses themselves are out of touch with
    the real world and the job market. In 2015, a start-up head and Yale professor
    David Gelernter published an argument to this effect in the Wall Street Journal
    op-ed section:


    The thing I don’t look for in a developer is a degree in computer science. University
    computer science departments are in miserable shape: ten years behind in a field
    that changes every ten minutes. Computer science departments prepare their students
    for academic or research careers and spurn jobs that actually pay money. They
    teach students how to design an operating system, but not how to work with a real,
    live development team.


    There isn’t a single course in iPhone or Android development in the computer science departments
    of Yale or Princeton. Harvard has one, but you can’t make a good developer in one
    term.


    In the end, whether or not to attend college is a personal choice. There are good
    arguments both for and against it. Even if you do go to college, you will likely
    have to teach yourself a number of skills to be a marketable developer. If you
    decide not to go to college, there are other options to look at.


    ##### Boot Camps


    Coding boot camps—crash courses in how to code— are a controversial subject. The
    programs typically last from two to six months and aim to prepare students for
    an entry-level job in the field of computer programming or web development. JavaScript
    is a popular programming language, among many others, for boot camps to cover
    since it is so common.


    In the past, boot camps have been endorsed by many notable people such as President
    Obama. It was hoped that they might both prepare unemployed people for work and
    fill the shortage of computer programmers in the United States. However, because
    many boot camps are for-profit, expensive, and do not always lead to employment,
    their reputation has declined over time.'
