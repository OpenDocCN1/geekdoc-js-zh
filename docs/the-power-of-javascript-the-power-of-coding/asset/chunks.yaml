    `Java` 或 `Objective-C`。


    `PhoneGap` 创建的是混合应用（hybrid apps）而非原生应用。混合应用的编码方式与网站类似，然后封装在原生容器中，这样它们就可以从应用商店下载并访问手机摄像头等硬件。`PhoneGap`
    以及其他类似的混合应用开发框架的一个缺点是，与原生应用相比，它们的性能可能较差。根据操作系统的，用 `Java` 或 `Objective-C` 编写的应用程序运行速度通常比
    `PhoneGap` 应用快。这可能是一个显著缺点缺点，公司权衡使用 `JavaScript` 与其他编程语言的优势时，必须考虑这一担忧。


    ![](img/main-17.jpg)


    马克·扎克伯格（Mark Zuckerberg）于 2004 年创立了 Facebook。2015 年，Facebook 创建了 JavaScript 框架
    `React Native`。


    然而，最近的进展意味着 `JavaScript` 可以用于真正的原生应用，而不仅仅是混合应用。使用 `JavaScript` 构建原生应用的领先框架之一是
    `React Native`。`React Native` 由 Facebook 于 2015 年创建——它被用于制作 Facebook 的应用，以及 Instagram
    和沃尔玛等知名公司的应用。


    通过 `React Native`，你可以用 `JavaScript` 编写代码，但当应用运行时，用户界面将使用原生组件显示。得益于该框架，你不再需要在性能较慢的混合应用，与需要用
    `Objective-C` 和 `Java` 等困难语言编写多次以同时在 iOS 和 Android 上运行的原生应用之间进行选择。


    随着 `React Native` 以及其他类似框架的兴起，`JavaScript` 将有望进一步扩展到应用开发领域。程序员现在仅需一种语言即可构建网站并创建应用。`JavaScript`
    巨大的力量和实用性意味着它是当今最广泛使用的编程语言，因此，它通常是新程序员学习的第一门语言。


    ![](img/main-18.jpg)


    反之：`JavaScript` 之前的浏览器（如 Mosaic）看起来与我们习惯的非常不同。


    ![](img/main-19.jpg)


    ## 工作原理


    `JavaScript` 的工作原理取决于它的使用方式。最初，`JavaScript` 仅用于客户端的 Web 开发（也称为前端）。前端编程语言运行在用户的计算机上，具体说是他们的浏览器中。当你浏览网站时，它会创建并更改计算机上显示的内容。今天，`JavaScript`
    仍然是担任这一角色的流行编程语言。考虑到后端（或服务器端）有许多流行的语言，如 `Java`、`Ruby`、`PHP`、`C` 和 `Python`，这真是一个令人惊讶的事实。


    后端编程语言运行在托管网站的服务器上。它们在网站显示之前就已经运行结束了，而 `JavaScript` 可以在网站显示时继续工作。后端编程语言负责处理幕后运行的工作。例如，当你在线上购买商品时，是后端在处理你输入的信息、验证交易并开始发货流程。


    ### 前端 Web 开发


    `JavaScript` 作为最重要的前端编程语言的地位仍在持续。它与 `HTML` 和 `CSS` 一起，通常负责创建在浏览器中显示的网站用户界面。


    为了实现这一点，`JavaScript` 被直接编码在网站的 `HTML` 文档中。查看 `HTML` 文档的基本格式有助于理解其工作原理。在精简形式下，网站看起来如下：


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title> 此内容显示在浏览器的顶部 </title>

    </head>

    <body>

    <p > 这是一个段落。</p>

    </body>

    </html>

    ```


    让我们看看这个示例的各个部分以初步掌握 `HTML`。`<!DOCTYPE html>` 这一行明确了接下来的文档是 `HTML` 格式的；它位于网上绝大多数网站的顶部。`<html>`
    标签标记了所谓的页面根元素的开始。在页面的最末尾，`</html>` 标志着该元素的结束。在 `HTML`（以及其他一些语言）中，反斜杠（`/`）被用于标记组件的结束。通过这种方式，`HTML`
    标签通常被成对提到，有一个起始标签（如 `<html>`）和一个结束标签（如 `</html>`）。


    这对标签内部包含有 `head` 和 `body` 元素。`head` 包含元数据——或者说是数据的描述。写在这个元素中的内容不会显示在实际网页本身上，尽管在大多数现代浏览器中，`title`
    元素的内容出现在网页上方的标签页中。在 `body` 元素内部，是网页本身的内容。在这个示例中，有一个段落出现在 `<p>` 和 `</p>` 对内部。此文本的任何格式通常会在
    `CSS` 中完成，而不是 `HTML`。


    上面的示例完全用 `HTML` 编写。它将是一个只有一句话的静态网页。为了让它变成动态的，你可以在 `HTML` 中插入 `JavaScript`。这里有一个使用
    `JavaScript` 创建按钮的示例：


    ```html

    <!DOCTYPE html>

    <html>

    <head></head>

    <body>

    <p> 1+1 的答案是多少？ </p>

    <p> 点击按钮获取答案！ </p>

    <button type="button" onclick="document.write(1 + 1)">点击此处显示答案。</button>

    </body>

    </html>

    ```


    如你所见，这段代码大部分是 `HTML`。文档类型、`HTML`、`body` 和段落标签都是基础 `HTML`。然而，创建按钮的代码部分是用 `JavaScript`
    编写的。这部分让网页变得动态。当你点击出现的按钮时，所有的文本都被数字“2”替换。这种变化发生在客户端。这意味着没有向服务器发送请求。这就是为什么 `JavaScript`
    如此重要——它仍然是能够完成此任务的唯一流行语言。其他语言可以进行加一并更改网页，但它们需要用户刷新并向服务器发送另一个请求。在这里，得益于用户计算机上完成的操作，用户的显示立即变化。


    ### JavaScript 基础


    为网站添加按钮是 `JavaScript` 一个常见且简单的示例，但它可以实现更多功能。`JavaScript` 的许多功能取决于它是一种面向对象的编程语言。这意味着它使用对象来完成任务。对象是数据和对数据执行的操作的集合。


    让我们来看简单的对象来说明什么是对象。假设你想存储关于某人的数据。你可以编写以下代码来实现：


    ```javascript

    var person = {firstName:"John", lastName:"Doe", age:17, eyeColor:"brown"};

    ```

