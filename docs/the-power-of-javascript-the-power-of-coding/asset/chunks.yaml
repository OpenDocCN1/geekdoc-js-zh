    另一方面，`JavaScript` 直到代码实际被解释和运行（即运行时）时才会检查数据类型错误。这意味着在程序员意识到错误存在之前，用户可能已经遇到了错误。从调试的角度来看，静态类型检查（编译期间）和动态类型检查（运行期间）都各有优劣。静态类型检查让开发者更有可能在用户之前发现错误；然而，编译你的代码可能是一个漫长的过程，因此通过静态类型检查来调试细微更改可能会浪费大量时间。


    ## 开发速度


    由于以下几个原因，在 `JavaScript` 中编写代码可以非常快。与其他语言相比，这是一个优势，因为在其他语言中，开发者在开始之前必须在阶段花费更多时间。


    `JavaScript` 容易上手的原因之一是因为它是一种弱类型语言。这意味着你不需要指定值的数据类型。如果你给一个对象赋值为 `5`，`JavaScript`
    会认为它是一个数字。如果你给一个对象赋值为 `"Hello world,"`，它会认为它是一个字符串。不需要编写代码来声明值的数据类型。这与 `C` 这样的强类型编程语言不同。在这些语言中，你必须指定每个值的数据类型。不需要这样做让编写
    `JavaScript` 变得更快。


    ## JSON 与 XML


    正如第一章所讨论，`Ajax` 是当今网络开发的关键组件。它允许浏览器和服务器在后台进行通信，无需重新加载整个网站即可更改你正在查看的内容。为了实现这一点，浏览器和服务器交换数据。


    从历史上看，服务器和网页交换的数据是 `XML` 文件（XML 是一种特定的数据格式方法）。但在实践中，现在的数据并不总是 `XML` 文件。它通常是 `JSON`（JavaScript
    对象表示法）。`JSON` 比 `XML` 更精简，在近年来越来越流行。程序员编写和读取它更快，因为在两种语言中编写的相似语句在 `JSON` 中更短。


    这是一个 `JSON` 数组的示例：


    ```json

    {"employees":[

    { "firstName":"Jane", "lastName":"Doe" },

    { "firstName":"John", "lastName":"Smith" },

    { "firstName":"Michael", "lastName":"Jones" }

    ]}

    ```


    将其与用 `XML` 编写相同的数据进行对比：


    ```xml

    <employees>

    <employee>

    <firstName>Jane</firstName> <lastName>Doe</lastName>

    </employee>

    <employee>

    <firstName>John</firstName> <lastName>Smith</lastName>

    </employee>

    <employee>

    <firstName>Michael</firstName> <lastName>Jones</lastName>

    </employee>

    </employees>

    ```


    很容易看出 `JSON` 简洁了多少。这节省了程序员工作时的时间。它也让他们的代码一目了然更容易理解。`JSON` 格式没有那么多标签和换行符那么杂乱。


    然而，程序员仍然继续使用 `XML` 而不是 `JSON`，或与之结合。它可以完成一些 `JSON` 无法完成的复杂任务。需要注意的是，`JSON` 预示了
    `JavaScript` 不仅作为网络开发的客户端和服务器端，而且作为两者之间数据交换格式的崛起。


    弱类型语言的缺点是，数据类型仍然必须匹配你尝试的操作。如果你在 `JavaScript` 中尝试相加数字和字符串，它将返回错误并停止进程。对于其他阅读你代码的人来说，可能更难看出发生了什么，因为数据类型总是隐含的，从未明确说明。


    `JavaScript` 容易上手的另一个原因是内存管理在后台由你处理了。虽然大多数语言都是如此，但某些语言仍然要求你处理程序与设备内存的交互。这可能是一个耗时的过程。在
    `JavaScript` 中，你的脚本将使用它所需的内存，然后将其释放回系统。


    这源于一种被称为垃圾回收的自动内存管理形式。垃圾回收语言自动执行移除不再需要的对象的过程。这确保了计算机内存不会产生不必要的负担——开发者不需要花费时间编写控制内存管理的代码。


    像 `C` 这样的语言要求程序员显式地管理内存。要做到这一点可能困难，错误可能会损害程序的性能。因此，直接使用 `JavaScript` 这样的语言开始编码要容易得多。


    ![](img/main-36.jpg)


    反之：许多学生在学校开始学习编码。开始得什么时候都不太早！


    ![](img/image_005_.jpg)


    ## 开始学习 JavaScript


    技术是全球增长最快的就业领域之一。进入该领域是一个令人兴奋的时刻。如果你精通像 `JavaScript` 这样的编程语言，你可以预期为你的专业知识获得高薪水。与其他需要执照或认证的就业机会（如医疗保健和教育）相比，这是一个相对容易入手的领域。


    ### 职业与薪前景


    如果你决定想找一份编码工作，你需要问自己的第一个问题是你将学习哪些编程语言。2017 年，在线开发者社区 `Stack Overflow` 对六万名开发者进行了调查，以查看专业人士了解哪些语言。意乎意料的是，`JavaScript`
    是最常用的语言。约 66.7% 的开发者报告使用过它。这是学习 `JavaScript` 的一个有力理由——它是大多数编程工作的要求。


    此外，72.6% 的受访者认为自己是网络开发者，这使其成为范围内最受欢迎的角色。在网络开发者中，熟悉 `JavaScript` 几乎是必要的。即使你计划在
    `JavaScript` 并不普及的服务器端工作，了解它也是有用的。


    你可能会问的问题是使用不同语言的开发者薪水如何比较。这是一个很难回答的问题，因为很难收集大量数据。`Stack Exchange` 的调查依赖于受访者的自报告收入，但这并不是具有代表性的调查。只有
    32% 的受访者提供了薪水。在他们中，`C++` 证明是利润最丰厚的语言，且有超过 7% 的程序员使用。使用 `C++` 的开发者平均年水为 100,890
    美元。紧随其后的是 `C` 的 100,000 美元、`Python` 的 99,000 美元、`Ruby` 的 97,000 美元、`Java` 的 96,000
    美元，以及 `JavaScript` 的 90,000 美元。


    另一个来源，来自热门招聘网站 `Indeed.com` 的数据提供了一个不同的视角。它将 `Ruby` 列为薪最高的编程语言，平均为 117,147 美元。随其后的是
    `Python` 的 116,027 美元、`C++` 的 115,597 美元、`JavaScript` 的 110,062 美元、`Java` 的 102,043
    美元，以及 `C` 的 95,045 美元。

