    ### JavaScript 的历史


    JavaScript 是世界上最广泛使用的语言。它是网站不可或缺的组成部分。尽管知名度很高，JavaScript 是由 Eich 在十天内设计并创建的。尽管他当时不知道，他的创作将改变人们的方式。但在查看今天
    JavaScript 的重要用途之前，让我们看看它的历史。


    1995 年，互联网还处于婴儿阶段。万维网刚刚向公众开放，使用起来仍然非常原始且枯燥。在使用拨号调制器访问互联网时，打开一个网页通常需要 30 秒甚至更久。由于如此，在互联网上填写表单（例如创建一个账户）是一个痛苦的过程。如果你忘记填写某个字段，就必须等待你的计算机向服务器发送请求。然后服务器会返回一个指出错误的响应。


    JavaScript 的创建是为了解决这个问题。它允许网页在向服务器发送请求之前检查所有必要字段是否已填写。这意味着如果用户留了空白，在他们的计算机（也称为客户端）与服务器开始长时间通信之前，就能收到通知。


    JavaScript 是第一个流行的客户端语言。它的广泛应用标志着互联网历史的一个根本性转变。任务现在可以轻松地在客户端和服务器端完成。JavaScript
    的功能迅速增长，很快被用于许多检查表单和其他基础任务之外的事情。


    #### 浏览器大战


    JavaScript 的历史与所谓的“浏览器大战”密切在一起，这是微软和 Netscape 之间争夺全球领先网络浏览器供应商的竞争。Netscape 是新兴网络浏览器市场的早期主导力量。它在
    1994 年发布了第一个浏览器，并迅速占据了大部分市场。它似乎将成为该领域无可争议的领导者。


    然而，在 1995 年，微软回应了。由于 Windows 的流行，微软已经是一家科技巨头，他们也意图接管浏览器市场。该公司推出了 Internet Explorer，与
    Netscape 竞争。它开始随几乎所有电脑的 Windows 操作系统免费提供该软件。


    '
- fmt: '

    The war was over quickly. Within five years, `Windows` controlled 95 percent of
    the browser market. `Netscape` was destroyed. Microsoft’s hardball tactics had
    worked, but they would soon be used against the tech giant. The Justice Department
    of the United States went after the company for being a monopoly and unfairly
    using `Windows` to crush competitors. `Netscape`’s CEO was called to the stand
    during the proceedings, and Microsoft was vilified in court.


    At one point, Microsoft was ordered by the court to temporarily remove `Internet
    Explorer` from the basic version of `Windows`. Microsoft lawyers responded by
    arguing that `Internet Explorer` was an integral part of `Windows` and difficult
    to remove. However, the judge, `Thomas Jackson`, noted that he had uninstalled
    it in less than two minutes by himself and criticized the company’s lawyers. In
    the end, `Judge Jackson` found that Microsoft was a monopoly and the company should
    be split into two separate companies: one focused on `Windows`, the other on software
    such as `Internet Explorer` and `Word`. It was a momentous decision that might
    have had far-reaching consequences.


    However, it was overturned when Microsoft’s lawyers appealed the decision. `Judge
    Jackson` was also rebuked over his handling of the case and obvious disdain for
    Microsoft’s arguments. The appellate court ruled that Microsoft was indeed a monopoly,
    but it need not split into two companies. It was a ruling that changed the history
    of computing technology.


    ## JavaScript''s Birth


    ![](images/main-11.jpg)


    `Netscape Navigator`'' s popularity plummeted with the release of Microsoft''s
    `Internet Explorer`.


    The events of the browser war would shape JavaScript during its foundational years.
    `Brendan Eich` was a `Netscape` employee and created JavaScript in 1995. It was
    originally called `LiveScript`, but the name was changed just before release.
    A completely different programming language by the name of `Java` had gained popularity
    at the time. `Netscape` hoped that by naming its own language JavaScript, it too
    would surge in popularity, despite the fact that the two were unrelated. It was
    a decision that still causes confusion to this day among people unfamiliar with
    programming.


    ### Brendan Eich


    o o o


    Brendan Eich was in the middle of his career when he invented JavaScript in 1995.
    He had previously worked at `Silicon Graphics` for seven years and spent three
    years at `MicroUnity Systems Engineering` before joining the team at `Netscape`.
    At `Silicon Graphics`, he had built new programming languages for the company.
    He had even built programming languages while he attended college to hone his
    understanding of programming `syntax`. It was these experiences that allowed him
    to create JavaScript in just ten days in 1995—an astonishing accomplishment.


    In 1998, `Eich` took a leading role in `Netscape`''s new project `Mozilla`. The
    name `Mozilla` was an early name for `Netscape`''s browser, used by employees
    before the product was released as `Netscape Navigator`. The word was a combination
    of "Mosaic" (the leading browser when `Netscape Navigator` launched in 1994) and
    "killer"—the intended goal of the new program. But in 1998, `Mosaic` was long
    dead. `Mozilla` was supposed to support `Netscape`''s new approach to releasing
    both the browser and its code for free to the general public. It was a bold experiment
    to promote transparency and harness the public to make improvements to already
    existing programs.


    However, `Netscape` went on to lose the browser war, and its popularity continued
    to decline. `AOL`, the owner of `Netscape`, largely stopped supporting its development
    in 2003. This led to the launch of the nonprofit `Mozilla Foundation` as an independent
    organization with `Mozilla` as a subsidiary. The following year, `Mozilla` released
    `Firefox`—a new browser based on `Netscape Navigator`''s code that was also open
    source, meaning its code was available to the public. Soon after, `Eich` was promoted
    to chief technology officer (CTO), an executive position that focuses on the development
    of new technology. He remained in that role for ten years.


    In 2014, `Eich` was promoted to chief executive officer (CEO) of `Mozilla`. However,
    he was soon struck by a major scandal that made headlines around the country.
    It came out that he had donated $1,000 to support a controversial referendum in
    2008. The referendum, called `Proposition 8`, sought to ban same-sex marriage
    in California. It passed at the time, but the marriage ban was later overturned
    by the `California Supreme Court` on the grounds that it unnecessarily stripped
    rights from a "disfavored group" to please the majority.


    Even though a majority of Californians had supported `Proposition 8` in 2008 like
    `Eich` did, his donation was wildly unpopular. He became the target of intense
    and sustained criticism. The tech industry has a reputation for supporting gay
    rights, and many people lambasted `Eich`, including some of his own employees.
    As a result, less than two weeks after his promotion, `Eich` stepped down as CEO.
    His resignation raised a number of ethical issues. Many questioned whether CEOs
    ought to be held accountable for private actions, such as donating to a political
    campaign. Others saw it as evidence that the distinction between work and home
    life was breaking down—a troubling sign for those who valued their private lives
    as much as their career. It remains a thorny issue of privacy and, `Eich`''s career
    did not end with his public resignation. however. In 2015, he founded a start-up
    named `Brave Software` that aims to make the internet safer and faster. He remains
    its CEO today.


    ### Brendan Eich (continued)


    Needless to say, this situation was far from ideal. People had to switch between
    the two browsers to surf the web effectively or resign themselves to not viewing
    some websites. The internet seemed poised for a permanent split due to the browser
    war.


    Consequently, `Netscape` began working on standardizing the new languages. They
    submitted `JavaScript 1.1` to the `European Computer Manufacturers Association
    (ECMA)` as a proposed standard to be used across companies. Programmers representing
    both `Netscape` and `Microsoft`, as well as other companies, met to create a new
    standard that would be adopted by all of them. The result was `ECMAScript`—a programming
    language that standardized the basics of JavaScript and `JScript`. While both
    of these languages continued to exist and built on the core of `ECMAScript`, there
    was now a standard that all websites could use. It was an important step for both
    JavaScript and the internet, as it made it easier for websites to be compatible
    with both `Netscape Navigator` and `Internet Explorer`.


    ![](images/main-13.jpg)


    #### The World Wide Web


    Before moving on to the next chapter in JavaScript’s history, it is necessary
    to look at the history of website development in general. The World Wide Web was
    invented in 1989 by computer scientist `Tim Berners-Lee`. He programmed the first
    internet browser the following year. He called the browser the `WorldWideWeb`—at
    the time, his browser was the only way to access the internet.


    Berners-Lee invented three different technologies that remain the foundation of
    the web today:


    1. `HTTP` (HyperText Transfer Protocol): a system that allows websites to link
    to one another.

