    ### The History of JavaScript


    JavaScript is the most widely used language in the world. It is an essential component
    of websites. Despite its high profile, JavaScript was designed and created in
    ten days by Eich. Although he did not know it at the time, his creation would
    revolutionize the way people. But before we look at the important ways JavaScript
    is used today, let’s look at its history.


    In 1995, the internet was still in its infancy. The World Wide Web had just been
    made available to the public, and it was still rudimentary and tedious to use.
    To open a new web page generally took at least thirty seconds, if not more, on
    the telephone-line modems used to access the internet. Because of this, filling
    out forms on the internet (for instance, to open a new account), was a painstaking
    process. If you forgot to fill in a field, you would have to wait while your computer
    sent a request to the server. The server would then send a response pointing out
    the error.


    JavaScript was created to remedy this issue. It enabled web pages to check if
    every required field was filled before sending a request to the server. This meant
    that if users left a field blank, they could be informed before the lengthy communication
    between their computer (also known as the client) and the server began.


    JavaScript became the first popular client-side language. Its widespread adoption
    marked a fundamental shift in internet history. Tasks could now be accomplished
    both client-side and server-side with ease. The functions of JavaScript quickly
    grew, and it was soon used for many things other than simply checking forms and
    other basic tasks. It allowed websites to become more interactive and paved the
    way for the modern landscape.


    #### Browser Warfare


    The history of JavaScript is bound up with the so-called browser war, a competition
    between Microsoft and Netscape to become the dominant web browser supplier to
    the world. Netscape was the early dominant force in the fledgling web browser
    market. It released its first browser in 1994 and rapidly took a majority of the
    market. It seemed poised to become the unquestioned leader of the industry.


    However, in 1995, Microsoft responded. Already a tech giant due to the popularity
    of Microsoft Windows, Microsoft’s founder Bill Gates intended to take over the
    browser market as well. The company launched Internet Explorer, a new browser,
    to compete with Netscape Navigator. It began including the software for free with
    Windows, the operating system that came with nearly all computers.

