    side, where JavaScript is not ubiquitous, some familiarity is useful.


    One question you might have is how the salaries of developers who work in different
    languages compare. This is a difficult question to answer precisely because of
    the difficulty of gathering data on the salaries of so many people. Stack Exchange’s
    survey relies on the self-reported income of respondents, but it is not a representative
    survey. Only 32 percent of respondents provided their salary. Among them, C++
    proved the most lucrative language to know that is also used by more than 7 percent
    of programmers (more-obscure languages top the chart). The average annual salary for
    American developers who used C++ was selfreported at $100,890\. This was followed
    closely by C at $100,000; Python at $99,000; Ruby at $97,000; Java at $96,000;
    and JavaScript at $90,000.


    Another source, data taken from the popular job site Indeed.com, gives a somewhat
    different view. It has Ruby as the most highly compensated programming language
    at an average of $117,147. This is followed by Python at $116,027; C++ at $115,597;
    JavaScript at $110,062; Java at $102,043; and C at $95,045.


    Ruby, Python, and C++ alternate among the top spots of both lists; however, the
    position of JavaScript varies greatly. This may be due to the fact that JavaScript
    is so flexible. Developers in many different roles, such as web development and
    app development, use the language. These roles sometimes have very different salary
    expectations.'
