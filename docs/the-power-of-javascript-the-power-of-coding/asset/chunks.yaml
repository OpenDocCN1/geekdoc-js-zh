    On the other hand, `JavaScript` does not check for data type errors until the
    code is actually being interpreted and run, at runtime. This means that a user
    may stumble upon an error before the programmer is even aware there is one. From
    a debugging perspective, there are pros and cons of both static type checking
    (during compilation) and dynamic type checking (during runtime). Static type checking
    makes it more likely a developer will find an error before a user; however, compiling
    your code can be a lengthy process, so debugging minor changes through static
    type checking can waste a great deal of time.


    ## Speed of Development


    It is possible to code quite quickly in `JavaScript` for a couple of reasons.
    This is a benefit compared to other languages where developers must spend more
    time at the beginning stages before getting started.


    One reason it’s easy to get started with `JavaScript` is because it is a weakly-typed
    language. This means that you don’t have to specify the data type of values. If
    you assign an object the value `5`, `JavaScript` will assume it is a number. If
    you assign an object a value of `"Hello world,"`, it will assume it is a string.
    There is no need to write code stating what data type a value is. This is different
    from strongly-typed programming languages like `C`. In these languages, you must
    specify the data type of every value. Not having to do this makes coding `JavaScript`
    faster.


    ## JSON versus XML


    As discussed in the first chapter, `Ajax` is a key component of web development
    today. It allows the browser and server to communicate in the background, changing
    the website you are viewing without the need to reload it in its entirety. To
    do this, the browser and server exchange data.


    Historically, the data exchanged by the server and web page was an `XML` file.
    (`XML` is a specific way of formatting data.). But in practice, the data is not
    always an `XML` file today. It is often in `JSON` (JavaScript Object Notation).
    `JSON` is more streamlined than `XML` and has gained in popularity in recent years.
    It is quicker for programmers to write and read it because similar statements
    written in both languages are shorter in `JSON`.


    Here is an example of an array in `JSON`:


    ```json

    {"employees":[

    { "firstName":"Jane", "lastName":"Doe" },

    { "firstName":"John", "lastName":"Smith" },

    { "firstName":"Michael", "lastName":"Jones" }

    ]}

    ```


    Compare it to the same data written in `XML`:


    ```xml

    <employees>

    <employee>

    <firstName>Jane</firstName> <lastName>Doe</lastName>

    </employee>

    <employee>

    <firstName>John</firstName> <lastName>Smith</lastName>

    </employee>

    <employee>

    <firstName>Michael</firstName> <lastName>Jones</lastName>

    </employee>

    </employees>

    ```


    It is easy to see just how much shorter `JSON` is. This saves the programmer time
    when they are working. It also makes their code easier to understand at a glance.
    The `JSON` format is less cluttered with tags and numerous line breaks.


    However, `XML` continues to be used by programmers instead of, or in addition
    to, `JSON`. It can accomplish some complicated tasks that `JSON` cannot. The important
    thing to note is that `JSON` heralds the rise of `JavaScript` not only as a client
    side and server side of web development but also as a format for data interchange
    between the two.


    The downside of weakly-typed languages is that the data type still has to match
    what you are trying to do. If you try to add a number and a string in `JavaScript`,
    it will return an error and halt the process. It can also be more difficult for
    other people reading your code to figure out what is going on since the data type
    is always just implied and never stated.


    Another reason that `JavaScript` is easy to get started with is that memory management
    is handled for you behind the scenes. While this is true of most languages, some
    still require you to handle how your program interacts with a device’s memory.
    This can be a time-consuming process. With `JavaScript`, your script will use
    as much memory as it needs and then release it back to the system.


    This results from a form of automatic memory management known as garbage collection.
    Garbage collection languages automate the process of removing objects that are
    no longer needed. This ensures there is no unnecessary drag on a computer’s memory—and
    that the developer doesn’t need to use their time writing code that governs memory
    management.


    Some languages like `C` require the programmer to manage memory explicitly. This
    can be tricky to do well, and mistakes can harm the performance of your program.
    Therefore, it is much easier to jump right into coding with a language like `JavaScript`.


