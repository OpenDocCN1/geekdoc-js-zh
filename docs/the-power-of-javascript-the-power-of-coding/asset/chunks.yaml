- fmt: '

    However, for the purposes of website development, APIs fill a particular niche
    that you have probably seen many times before. They allow websites to easily embed
    `third-party` components into your website. This is how many websites allow you
    to create an account using your Gmail address or Facebook account. It is also
    how many websites will have YouTube videos embedded in them.


    Let''s look at Google Maps to see how this works. To add a map with a marker on
    it to your website, you simply need to paste the following JavaScript into your
    website after completing some preparatory tasks:


    ```html

    <script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">

    </script>

    ```


    ![](images/main-23.jpg)


    APIs make it easy for developers to embed Google Maps into websites. Offline,
    Google Maps markers have even made their way into art, like this sculpture by
    Aram Bartholl.


    Then, when your website loads, it will contain a map provided by Google Maps that
    has a marker at a location you previously specified. This is much easier than
    creating your own map and marker. And your users are also able to take advantage
    of the many features that Google Maps has built into it, such as directions and
    satellite view. This illustrates the power of APIs and the short lines of JavaScript
    that are used to add them to websites. With very little effort, web developers
    can take advantage of polished websites like Google Maps and YouTube to improve
    their own websites and provide difficult-to-code services like video playback
    and precise maps.


    The most popular JavaScript library is `jQuery`. Like all libraries, you need
    to download the `jQuery` library or link to a Content Delivery Network (CDN) on
    the internet to use it. Google hosts a CDN that supplies `jQuery` for free. Once
    you have access to `jQuery`, you can simplify many different processes on your
    website. Some of the main uses of `jQuery` are `DOM` manipulation (the structure
    of a web page), `Ajax` support, and the animation of images. While `jQuery` has
    many different, discrete uses, it is still considered a library because it isn’t
    an overarching framework that radically changes how you build a website.


    Another convenient thing you can do with `jQuery` is create callback functions.
    Since JavaScript statements are executed line by line, errors can occur when a
    line of code is executed before a previous line that it depends on has finished
    executing. To prevent this issue, callback functions are used. A callback function
    allows you to specify that another function should be executed only after another
    one has finished. Many developers create callback functions without the aid of
    `jQuery`, but it is possible to simplify the process using a library like `jQuery`.


    ![](images/image_002_.jpg)


    Gmail''s ability to do many different things on one webpage, like look at different
    inboxes and draft emails, is thanks to JavaScript.


    As of 2017, the most-used JavaScript framework is `AngularJS`. It is an open-source
    project maintained by Google, and its focus is on streamlining the creation of
    single-page apps using `HTML` and JavaScript. Single-page apps are single web
    pages that function somewhat like an app or program. They don’t require loading
    different web pages like a traditional website made up of many different pages.
    For example, `Gmail` is a single-page app. Once you log in and access your account,
    you can read emails, draft them, and look through different inboxes, all without
    navigating to a different page.


    `AngularJS` is more extensive than a library—its goal is to be the only resource
    needed to build a single-page app on the client side (it does not extend to the
    server side). `AngularJS`’s website describes it in the following way:


    > AngularJS is a structural framework for dynamic web apps. It lets you use `HTML`
    as your template language and lets you extend `HTML`’s syntax to express your
    application’s components clearly and succinctly ...


    `AngularJS` is not a single piece in the overall puzzle of building the client-side
    of a web application. It handles all of the `DOM` and `Ajax` [code that connects
    different components so they become compatible] you once wrote by hand and puts
    it in a well-defined structure.


    The chief competitor to `AngularJS`’s popularity is `React`. `React` is a library
    and not a framework, but most of the time, developers use one or the other to
    create a website. Which one is better often depends on the exact nature of the
    website, although the experience of the developer also sometimes plays a role—many
    developers are more familiar with one over the other.


    One of the primary benefits of using a framework like `AngularJS` is that it reduces
    the amount of code you have to write. It makes it unnecessary for you to handle
    issues like callbacks, which are a necessity if you are coding outside of a framework
    and can take up quite a bit of a developer’s time without visibly improving a
    site. Frameworks can let you focus more on big picture issues like the functionality
    of the website and what you are trying to accomplish with it.


    ### Asynchronous JavaScript


    Code is often synchronous. This means it is executed in order. However, as previously
    mentioned, there is a major drawback with some synchronous code. It is often necessary
    to wait for a previous command to be executed before the next one can be completed.
    This can cause synchronous code to load slowly. If one process is taking a long
    time, execution grinds to a halt.


    To get around this problem, JavaScript can be written asynchronously. You can
    manipulate when code is executed and ensure that slow processes don’t result in
    long load times on your web page. In fact, asynchrony is so important that “asynchronous”
    is the “A” in `Ajax`. Without the ability to place asynchronous requests—that
    don’t make the web page wait for a response—`Ajax` wouldn’t allow for fast, interactive
    web pages.


    Nevertheless, the asynchronous nature of some JavaScript can be a huge headache
    for developers. It is difficult to write simple, direct code that is asynchronous
    in the correct places. In fact, the mishandling of callbacks, one important tool
    for asynchronous code, is one of the most common reasons for spaghetti code: code
    that is as well organized as a bowl of spaghetti.


    Luckily, many JavaScript libraries and frameworks can help you avoid common problems
    with asynchronous code. Some JavaScript engines even include two functions `async`
    and `await` that will simplify the task of writing asynchronous code. While the
    two functions have not yet been adopted by the `ECMA` and added to standard JavaScript,
    they likely will be at some point in the future.


    #### Hacking with JavaScript


    o o o


    ![](images/main-24.jpg)


    A computer infected with ransomware.


    One of the less well-known uses of JavaScript is for nefarious purposes. Malware—or
    malicious software—has been written completely in JavaScript on occasion. Recently,
    there have been two high-profile cases where JavaScript was used to attack vulnerable
    computers.


    In 2016, a new kind of ransomware appeared on the internet. Ransomware encrypts
    the files on a computer and locks the owner out of them. They are unable to access
    the files unless they pay a ransom to the hackers. While ransomware is a typical
    kind of malware, this attack was notable because the ransomware was coded in JavaScript.


    JavaScript was a clever choice for the malware because programs tend to trust
    JavaScript files. You can open such a file from an email easily, and many email
    clients do not warn the user that such as action is not secure. They simply run
    the code—and in this case that resulted in the data on the infected computers
    being held hostage unless the owner paid $250.

