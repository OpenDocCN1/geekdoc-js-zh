  trans: "\n\n2. `URI`（统一资源标识符）：一种标识网络资源的唯一名称。URI 的一种类型是网站的 `URL`，或地址。\n\n3. `HTML`（超文本标记语言）：用于格式化网页的语言。\n\
    \n这三项创新共同为当今的互联网奠定了基础。在当时，他的想法并没有立即获得赞誉。事实上，他的老板在他关于万维网的提案上写了一条备注，简单地写了一句话：“模糊但令人兴奋”。尽管如此，伯纳斯-李（Berners-Lee）还是得到了时间来开发他的项目。\n\
    \n在接后的几年里，万维网的普及程度呈爆炸式增长。这无疑是伯纳斯-李决心让他的创造对公众免费且开放的结果。他鼓励他的雇主让所有人都能使用网络，而不是保留任何控制权。\n\
    \n从早期阶段开始，网页最基础的语言一直是 `HTML`。事实上，网站仅仅是 `HTML` 文档。你可能通过浏览器查看它们，浏览器将它们与其他网站链接起来，为它们填充图像，使它们内容动起来，并在你与之交互时改变它们（几乎总是通过\
    \ `JavaScript`）。但你只需打开一个文本文档，就能在 `HTML` 格式中看到完全相同的网站。`HTML` 文档是纯文本。通过这些文字和数字，它们勾勒出了网站在浏览器中打开时的呈现方式。\n\
    \n`HTML` 不是一种编程语言。编程语言必须包含可以被执行的指令。`HTML` 仅仅是对数据进行标记以定义其内涵。正如其名称所示，它是一种标记语言。通过使用标签（功能上类似于命令）如\
    \ `<header>` 和 `<link>`，`HTML` 构建了网页结构。这些标签使得你的浏览器能够正确显示数据。但尽管它不是一种编程语言，`HTML`\
    \ 仍然是互联网的基石。\n\n### DHTML 和 DOM\n\n网站可以仅使用 `HTML` 构建，但那些网站是静态的。当你点击链接时，整个网页都会重新加载。用户无法与网站进行交互。无法创建标签页或其他我们现在期望在网页上看到的其他基本功能。\n\
    \n`JavaScript` 解决了这个问题。作为一种客户端编程语言，它允许网站在不向服务器发送请求的情况下发生变化。因此，`DHTML`（动态超文本标记语言）的新概念随着\
    \ Internet Explorer 4 在 1997 年的发布而兴起。同年，`Netscape Navigator 4` 也发布了。这两个浏览器都使用了\
    \ `DHTML`，但方式不同。这再次证明了要设计能够在两个浏览器中运行的网站是困难的。\n\n![](img/main-14.jpg)\n\n文档对象模型（`DOM`）构建文档。这是一个简单的\
    \ `HTML` 文档示例。\n\n`DHTML` 不是编程语言或标记语言。相反，它是一个技术的集合（主要是 `HTML` 和 `JavaScript`），允许网站更具交互性和动态性。例如，当你将光标移动到按钮上，按钮的外观发生变化时，是\
    \ `DHTML` 实现了这种可能性。在 `JavaScript` 和 `DHTML` 出现之前，这种情况并没有发生。\n\n为了应对两个不同版本的 `DHTML`\
    \ 的崛起，万维网联盟（`W3C`）介入了。`W3C` 由伯纳斯-李创立（他仍担任负责人），`W3C` 建议浏览器采用文档对象模型（`DOM`），以在不同浏览器中标准化\
    \ `DHTML`。`DOM` 涉及到另一种标记语言：`XML`。`XML` 代表可扩展标记语言，是一种用于存储和传输数据的文本格式。`XML` 格式是以数据为中心的。它关注的是准确记录数据。这与\
    \ `HTML` 不同，后者关注的是在网页上显示数据。因此，两种标记语言经常同时用于同一个网页上。\n\n像 `DHTML` 一样，`DOM` 也编程语言。它为\
    \ `HTML` 和 `XML` 文档提供了结构。根据 `DOM`，`HTML` 和 `XML` 文档被表示为结构化的节点和对象组。`DOM` 提供了一种对文档进行分类和映射。由于这种映射，`JavaScript`\
    \ 能够操作复杂的 `HTML` 和 `XML` 文档的任何组件。\n\n### 拼图的最后一块\n\n到目前为止，我们已经查看了 `HTML` 和 `JavaScript`。直到今天，它们仍然是大多数网站的基础。但我们还有一个尚未看过的缺失部分：级联样式表（`CSS`）。`CSS`\
    \ 是定义当今万维网的三种语言中的最后一种。`CSS` 是一种样式表语言，正如其名称，它专注于文档的呈现（在实践中，几乎总是 `HTML` 文档）。\n\n\
    `CSS` 允许 Web 开发者快速方便地格式化网站，使其看起来更有吸引力。使用 `CSS`，他们可以操纵颜色、字体、字体大小、边距等。虽然 `HTML`\
    \ 能够完成这大部分工作，但它的效率并不高。`CSS` 允许你对构成网站的许多网页中的标题、链接和背景进行格式化。要在 `HTML` 中完成相同的操作，你必须单独对每个\
    \ `HTML` 文档进行格式化。\n\n例如，如果你想网站上的每个段落的文字都是蓝色的、居中对齐的、大小为十二像素，你可以编写以下代码：\n\n```css\n\
    P {\n  font-size: 12px;\n  color: blue;\n  text-align: center;\n}\n```\n在 `HTML`\
    \ 中没有快速完成这项任务的方法。\n\n### Ajax\n\n随着 1996 年 `CSS` 的创建和 1998 年 `DOM` 的出现，变革的舞台已经铺好。`JavaScript`\
    \ 让网页变得更加动态和交互。像 `W3C` 和 `ECMA` 这样的机构也成功创建了被广泛采用的标准。在此之前，桌面应用程序的能力远超网站，但这种情况很快发生了变化。\n\
    \n2004 年，Google 发布了 Gmail（一种电子邮件服务），随后发布了 Google Maps。这两个网站的能力远超当时的典型水平。2005 年，界面设计师和信息架构师\
    \ Jesse Garrett 创造了 `Ajax`（异步 `JavaScript` 和 XML）术语，用来描述这些新网站的工作方式。\n\n"
