    Web 2.0 的技术基石是 `Ajax`。它让网站变得如此动态且具有交互性。`Ajax` 的实现完全得益于 `JavaScript`。`JavaScript`
    在客户端而非服务器端，允许网页随着用户的输入不断发生变化。


    蒂姆·奥雷（Tim O’Reilly）对 Web 2.0 的定义如下：


    Web 2.0 是作为平台的网络，跨越所有连接的设备；Web 2.0 是那些充分利用该平台内在优势的服务：提供一种持续更新的软件服务，使用的人越多，它就越好用；消费并重新混合来自包括个人用户在内的多个源的数据，同时以一种允许他人进行重新混合的格式提供他们自己的数据和服务；通过一种“参与式架构”创造网络效应，并超越了
    Web 1.0 的页面比喻，提供丰富的用户体验。


    自 2005 年以来，网站的复杂性不断增加。但协作和丰富用户体验的理念保持不变。即使 `Ajax` 技术也保持不变，尽管它在执行上在某种程度上发生了变化。


    ![](img/main-15.jpg)


    2007 年发布的 iPhone 是第一款看起来像今天手机的智能手机。


    ## 智能手机革命


    技术的下一个巨大飞跃是智能手机的兴起。智能手机随着手机和个人数字助理（可以发送电子邮件和连接互联网的手持设备）的普及而逐渐发展起来。这两种设备被合并为一台设备——既能拨打电话又能连接互联网。


    早期的智能手机与我们今天习惯的样式大不相同。它们通常带有小键盘并附有手写笔。屏幕是彩色的，且难以导航。这一切在 2007 年随着 iPhone 的发布而改变。苹果的这项新创新在科技界引起了震动。它的大触摸屏和流线型设计标志着行业的转型。尽管
    iPhone 很大程度上被企业拒绝（他们转而选择旧款智能手机型号），但它塑造了世界看待连接的方式。


    iPhone 发布一年后，谷歌发布了 `Android` 移动操作系统。与 iPhone 类似，它用于像我们今天使用的带有大触摸屏的设备。苹果与谷歌（以及其他智能手机公司）之间的斗争为所谓的“智能手机大战”奠定了舞台，这场战争从
    2009 年开始持续至今。公司为其手机中使用的技术获得专利，并在全球范围内的法院起诉竞争对手侵犯专利。


    与此同时，苹果和三星等巨头竞争销售最多的手机并扩大其客户群。根据皮尤研究中心的数据，2011 年，只有 35% 的美国人拥有智能手机。而今天，这一比例已超过了
    75%。这一市场的快速扩张对编程世界产生了巨大影响。智能手机应用开发已成为全球的一项重要产业。


    ## Facebook 和 JavaScript


    你几乎肯定听过 Facebook，你可能就是每天使用它的数亿人之一。但你可能不知道的是这家公司对于现代 `JavaScript` 格局有多么重要。在我们查看他们对
    `JavaScript` 贡献的具体细节之前，让我们看看他们作为一家公司谦卑的起步。


    Facebook 于 2004 年由马克·扎克伯格（Mark Zuckerberg）创立，当时他还是哈佛大学的学生。该网站的普及速度极异常快。在一个月内，半数哈佛的本科生就有了账户。2005
    年，它有 600 万用户。到 2017 年 3 月，人数接近 20 亿。


    Facebook 成为世界上价值最高的公司之一。在 2017 年初，其股票价值估为 3810 亿美元。随着其流星般的崛起，Facebook 已从社交媒体世界扩展到不同领域。该公司在
    2014 年购买了流行的即时通讯服务 WhatsApp，并深度参与虚拟现实领域。


    2013 年，Facebook 发布了 `React—一个 JavaScript 库`。`JavaScript` 库旨在让编码变得更简单、更容易。它们通常包含预先写的
    `JavaScript` 代码段，开发者可以使用并操作这些代码，而无需从零开始。虽然使用它们仍然需要对编程语言有深入了解，但它们可以节省程序员的时间和精力。网站也可以使用多个一个
    `JavaScript` 库。事实上，大多数大型网站都使用许多不同的库来实现不同的目标，并解决可能出现的各种问题。


    `React` 主要为创建用户界面而构建，即用户与之交互的技术呈现。对于网站来说，这包括导航栏和输入框等功能，用户通过与这些交互来完成任务。


    根据创建者的说法，`React` 的目的是“[鼓励]创建可重用的 `UI` 组件，以展示随时间变化的数据。”想看 Facebook 的用户界面。有许多不同的滚动区域和链接构成了一个非常复杂的显示。Facebook
    使用 `React` 让操作这个用户界面的变得尽可能简单。没有 `React`，你可以使用 `JavaScript` 构建像 Facebook 那样的网站，但随着用户界面随时间推移的变化，创建和维护它将是一项耗耗时的任务。


    根据 Facebook 的说法，`React` 还有一个额外好处，可以帮助开发者改进产品，因为它强制我们把应用程序拆分为离散的组件，每个组件代表一个单一视图。2015
    年，随着 `React Native，一个专注于创建手机应用的 JavaScript 框架` 的发布，Facebook 将其触角进一步扩展到 `JavaScript`
    世界和编码资源领域。该公司在该领域将做多少还有待观察。


    移动应用开发受到了两个主要移动操作系统的影响：苹果的 `iOS`（限于苹果设备）和谷歌的 `Android`（被苹果之外的几乎所有手机制造商使用）。最初，应用程序无法用同一种编程语言编写并在
    `iOS` 和 `Android` 上运行。这种局面让人想起浏览器大战，当时网站必须在 `Netscape Navigator` 或 `Internet Explorer`
    之间做出选择以获得良好运行。


    `Android` 应用通常用 `Java` 编写，而 `iOS` 应用用 `Objective-C` 编写。两种不同的编程语言使得跨操作系统的开发成本高昂且耗时。直到今天，应用程序通常会先在一个平台发布，然后再重新开发发布到另一个平台。


    ### JavaScript 征服手机


    最初，用 `JavaScript` 创建应用的最接近的是移动 Web 应用。尽管尽管如此，这类应用并非真正的程序。相反，它们是在浏览器中查看的网页，模仿应用程序的样式和布局。它们无法从应用商店下载，并且需要浏览器打开。


    但这种情况在 2008 年改变了。名为 Nitobi Software 的公司开发了一个名为 `PhoneGap` 的移动应用开发框架。它允许开发者使用 `JavaScript`、`HTML`
    和 `CSS`（这三种网站开发语言）来创建手机应用。这些应用程序可以在 `Android` 和 `iOS` 设备上运行，而无需在两种不同的编程语言中编写应用程序。


