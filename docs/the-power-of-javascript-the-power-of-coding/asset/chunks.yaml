  trans: '

    战争很快结束了。在五年内，`Windows` 占据了 95% 的浏览器市场。`Netscape` 被消灭了。微软的强硬手段奏效了，但这些手段很快就会被用来对付这家科技巨头。美国司法部因该公司垄断并不公平地利用
    `Windows` 打压竞争对手而起诉。。在诉讼过程中，`Netscape` 的执行官被传唤作庭，微软在法庭上受到了指责。


    曾几何，微软被法院命令从 `Windows` 的基础版本中临时移除 `Internet Explorer`。微软的律师辩辩称，`Internet Explorer`
    是 `Windows` 的不可或缺的一部分，很难移除。然而，法官 `Thomas Jackson` 注意到他自己花不到两分钟就卸载了它，并对该公司的律师表示批评。最后，`Jackson
    法官` 认定微软是一个垄断者，该公司应该被拆分为两家独立的公司：一家专注于 `Windows`，另一家专注于 `Internet Explorer` 和 `Word`
    等软件。这是一个具有重大意义的决定，可能会产生深远的影响。


    然而，当微软律师对该判决提出上诉时，它被推翻了。`Jackson 法官` 也因其处理案件的方式以及对微软论点的明显蔑视而受到斥。上诉法院裁定微软确实是一个垄断者，但不需要拆分为两家公司。这项裁决改变了计算技术的历史。


    ## JavaScript 的诞生


    ![](img/main-11.jpg)


    随着微软 `Internet Explorer` 的发布，`Netscape Navigator` 的人气急剧下降。


    浏览器大战的事件将塑造 JavaScript 的奠基性阶段。`Brendan Eich` 曾是 `Netscape` 的员工，并在 1995 年创建了 JavaScript。它最初被称为
    `LiveScript`，但在发布前更改了名称。当时，一种名为 `Java` 的完全不同的编程语言已经非常流行。`Netscape` 希望通过将自己的语言命名为
    JavaScript，让它也能声声鹊起，尽管两者之间毫无关系。这一决定直到今天仍让不熟悉编程的人们感到困惑。


    ### Brendan Eich


    o o o


    Brendan Eich 在 1995 年发明 JavaScript 时正处于职业生涯的途中。他在此之前在 `Silicon Graphics` 工作了七年，在加入
    `Netscape` 团队之前，在 `MicroUnity Systems Engineering` 工作了三年。在 `Silicon Graphics`，他为公司构建了新的编程语言。他甚至在大学期间就构建过编程语言，以深化对编程语法
    `syntax` 的理解。正是这些经历让他能够在 1995 年仅用十天时间就了 JavaScript——这是一项惊人的成就。


    1998 年，`Eich` 在 `Netscape` 的新项目 `Mozilla` 中担任领导角色。`Mozilla` 是 `Netscape` 浏览器的早期名称，员工在产品作为
    `Netscape Navigator` 发布之前使用它。这个词是“Mosaic”（马赛克，1994 年 `Netscape Navigator` 发布时的领先浏览器）和“killer”（杀手锏）的结合——这是新程序旨在的目标。但到
    1998 年，`Mosaic` 早已过时。`Mozilla` 本旨在支持 `Netscape` 的新发布方式，即将浏览器及其代码免费向公众开放。这是一项旨在提高透明度并利用公众力量改进现有程序的大胆实验。


    然而，`Netscape` 最终还是在浏览器大战中中败北，人气继续下降。`Netscape` 的所有者 `AOL` 在 2003 年基本停止了对其开发的支持。这导致了非营利组织
    `Mozilla Foundation` 作为独立机构成立，`Mozilla` 为其子公司。来年，`Mozilla` 发布了 `Firefox`——基于 `Netscape
    Navigator` 代码的新浏览器，它也是开源的，这意味着它的代码对开放。不久后，`Eich` 被提升为首席技术官（CTO），这是一个专注于新技术开发的执行职位。他在该职位上留了十年。


    2014 年，`Eich` 被提升为 `Mozilla` 的首席执行官（CEO）。然而，他很快陷入了一场引起全国头条新闻的大丑闻。结果发现他在 2008 年捐了
    1000 美元支持一项有争议的公投。该公投被称为 `Proposition 8`，旨在禁止加利福尼亚州的同性婚姻。该提案在当时通过了，但这项婚姻禁后来被 `加州最高法院`
    推翻，理由是它为了迎合多数人而不必要地剥夺了一个“不受欢迎的群体”的权利。


    尽管 2008 年大多数加利福尼亚人像 `Eich` 一样支持了 `Proposition 8`，但他的捐款极不受欢迎。他成为了严厉且持续批评的目标。科技行业以支持同性恋权利闻名，许多人抨击
    `Eich`，包括他自己的一些员工。结果，在他升职后不到两周，`Eich` 就辞掉了 CEO 职位。他的辞职引发了许多伦理问题。许多人质疑 CEO 是否应该为私人行为（如向政治竞选捐款）负责。其他人将其视为工作与家庭生活界限正在崩溃的证据——对于那些同样看重私人生活的人来说，这是一个不安的信号。这仍然是一个关于隐私的棘手问题，而且
    `Eich` 的职业并没有随着他的公开辞职而结束。2015 年，他创立了一家名为 `Brave Software` 的初创公司，旨在让互联网更安全更快速。今天他仍是其
    CEO。


    ### Brendan Eich（续）


    无需多说，这种情况远非理想。人们必须在两个浏览器之间切换才能有效上网，或者被迫无法查看某些网站。由于浏览器大战，互联网似乎将面临永久分裂。


    因此，`Netscape` 开始致力于标准化这些语言。他们将 `JavaScript 1.1` 提交给 `欧洲计算机制造商协会 (ECMA)`，作为跨公司使用的建议标准。代表
    `Netscape` 和 `Microsoft` 以及其他公司的程序员会面，创建一个可以被所有人采纳的新标准。结果是 `ECMAScript`——一种规范了
    JavaScript 和 `JScript` 基本内容的编程语言。尽管这些语言继续存在并在 `ECMAScript` 的核心基础上构建，但现在有了所有网站都可以使用的标准。这对
    JavaScript 和互联网来说都是重要的一步，因为它使得网站更容易兼容 `Netscape Navigator` 和 `Internet Explorer`。


    ![](img/main-13.jpg)


    #### 万维网


    在进入 JavaScript 历史的下一个章节之前，有必要回顾一下网站开发的历史。万维网由科学家 `Tim Berners-Lee` 于 1989 年发明。他在次一年编写了第一个互联网浏览器。他将浏览器命名为
    `WorldWideWeb`——在当时，他的浏览器是访问互联网的唯一方式。


    Berners-Lee 发明了三种至今仍是基础的技术：


    1. `HTTP`（超文本传输协议）：允许网站之间相互链接的系统。


