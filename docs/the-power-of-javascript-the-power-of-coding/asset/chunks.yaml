- fmt: '

    So far, we have just looked at the different types of data that can be stored
    about an object. But properties can also be methods. Methods in JavaScript are
    actions that can be performed on objects. There are a huge number of methods in
    JavaScript since they allow you to manipulate data and give JavaScript much of
    its functionality. One common example used on web pages is the `sort()` method,
    which sorts the elements of an `array` (a special variable that can store more
    than one value). One method that acts on strings is the `toUpperCase()` method—it
    converts a string to all capital letters.


    At first glance, it might looks relatively easy to write code like:


    ```javascript

    var person = {firstName:"John", lastName:"Doe", age:17, eyeColor:"brown"};

    ```


    But the syntax—or rules that govern how code is written—can take some time to
    master. If your code doesn’t comply with JavaScript’s syntax, it will not work.
    Let’s look at some of the basic rules of writing JavaScript.


    JavaScript is case sensitive, unlike some other programming languages. This means
    it is important whether any given character is capital or lowercase. A single
    mistake with regards to capitalization might render your code unusable. Capitalization
    is important because by convention JavaScript uses a format known as `camel case`.
    This means that compound words do not have a space between them and individual
    words are capitalized. In the name example, you can see this in the way that `firstName`,
    `lastName`, and `eyeColor` are written. In JavaScript, the first word is usually
    left lower case, but the words after it are capitalized.


    There are a number of other syntax rules like this in JavaScript. For instance,
    semicolons must be used at the end of some lines of code, but not others. Beginning
    programmers often struggle to do this perfectly, and many problems can crop up
    as a result.


    To leave a comment in your code, you put `/*` or `//` in front of the text. This
    allows you to leave notes to yourself or other programmers working on the project.
    Making sure your code is easy to understand for other people looking at it (or
    even yourself in the future) is an important part of being a good programmer.


    All of these syntax rules can be quite overwhelming when you are learning to code.
    It can also be confusing because different programming languages have different
    rules. Often they overlap to a certain degree, but there are small differences
    that can make even an experienced programmer make mistakes if they are not careful.


    ### Debugging


    One of the trickiest parts of programming is debugging. Whenever you write a large
    block of code, it almost always has bugs. These can be mistakes in syntax—how
    the code is formatted—or logical mistakes. Logical mistakes can take many forms.
    One example is trying to call a nonexistent property. This results in an error
    because the property cannot be acted on if it does not exist.


    Luckily, there are many tools available to help you debug your code. In fact,
    most internet browsers have a built-in tool for debugging JavaScript. Tools can
    point out mistakes in your code so that you can fix them. Some browsers can even
    help you improve the performance of your web page. They can analyze how long it
    takes each event to occur on your web page and let you pinpoint any performance
    issues that are leading to slow load times.


    ### Where to Write Code


    Many programmers use an Integrated Development Environment (IDE). An IDE is a
    program that you type your code into. While it’s possible to write code for a
    website in a simple text editor like Notepad, an IDE makes writing code a lot
    easier. If you forget a semicolon in Notepad, you won’t notice until you go to
    run your code. Then, when it doesn’t work, you have to search through all that
    you’ve written and try to diagnose the problem. An IDE can prevent this by pointing
    out when you’ve made a mistake like a missing semicolon or the failure to use
    proper capitalization.


    ![](images/main-22.jpg)


    Integrated Development Environments add color to your code to make it easier to
    see each piece.


    ### Back-end Web Development


    So far, we have mostly looked at front-end web development—which relies on HTML—but
    JavaScript is also used on the back end or server side. The front end is what
    you see when you look at a web page. In fact, you can even view the code of any
    website in your browser. (The steps to do so vary based on the browser you use.)
    Your browser will display the HTML—and almost always CSS and JavaScript as well—that
    is creating what you are viewing.


    On the other hand, the back end functions largely behind the scenes. For instance,
    when you Google something, Google’s server uses an algorithm to create a list
    of websites that match your search. This happens entirely on the back end. Google
    then sends you to a new web page that displays the results that were created on
    their server. The actions that take place on the server aren’t visible to the
    user. This is why the exact code of Google’s search algorithm isn’t known.


    ![](images/image_001_.jpg)


    Hashing algorithms on the back end protect users'' passwords.


    Databases are one of the most important parts of the back end. They can store
    different kinds of information that are often needed to make a website function
    properly. One example of stored information is usernames. You might think passwords
    are stored in databases as well, but in fact they never are. Storing passwords
    there would be a huge security risk if the database were compromised.


    Instead, hashed passwords are generally stored on the web server. Hashed passwords
    are strings of random characters that are generated based on a password that you
    enter. Hashed passwords are like encrypted passwords, but encryption can be easily
    reversed if you have the encryption key. With hashed passwords, there is no easy
    way to generate the original password.


    A JavaScript runtime is required to execute JavaScript on the back end. On the
    front end, the browser handles this. By far the most popular JavaScript runtime
    on the back end is `Node.js`. It has been used by many websites of high-profile
    companies, including Netflix, Microsoft, and Walmart. `Node.js` allows you to
    use JavaScript on the back end to meet the needs described above, rather than
    a different programming language like Java or Ruby.


    ### Libraries and Frameworks


    Once you’ve learned the basics of JavaScript, there are many libraries and frameworks
    to help you build websites. The boundary between libraries and frameworks is somewhat
    difficult to pinpoint. In general, libraries contain JavaScript objects and functions
    that you can then incorporate into your own code. This is much easier than starting
    from scratch and trying to code everything yourself. Most websites use more than
    one library. On the other hand, frameworks are much more robust than libraries.
    They try to simplify many aspects of development, and to do this, they often use
    many different libraries.


    #### APIs


    One important concept in programming is that of an API (Application Program Interface).
    An API dictates how two software components will communicate with one another.
    This broad definition means that APIs are used to complete a variety of tasks.
    For instance, if you are developing software, you will use operating system APIs
    to integrate the app and the operating system. Many extensive online databases
    also release their own APIs to give researchers more powerful tools. For example,
    the Digital Public Library of America has an API that programmers can take advantage
    of in order to manipulate DPLA data more easily.

