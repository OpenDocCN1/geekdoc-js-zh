    到目前为止，我们只是查看了可以存储关于对象的不同数据类型。但属性也可以是方法。JavaScript 中的方法是可以在对象上执行的操作。JavaScript
    中有海量的方法，因为它们允许你操作数据并赋予了 JavaScript 许多功能。网页上常用的一个常见示例是 `sort()` 方法，它用于对 `array`（一种可以存储多个值的特殊变量）的元素进行排序。另一种作用于字符串的方法是
    `toUpperCase()` 方法——它将字符串转换为全大写字母。


    初看之下，编写这样的代码可能相对简单：


    ```javascript

    var person = {firstName:"John", lastName:"Doe", age:17, eyeColor:"brown"};

    ```


    但是语法——即规定代码编写方式的规则——可能需要一些时间来掌握。如果你的代码不符合 JavaScript 的语法，它将无法运行。让我们来看一些编写 JavaScript
    的基础规则。


    与某些其他编程语言不同，JavaScript 是大小写敏感的。这意味着，任何给定字符是大写还是小写非常重要。关于大小写的一个微小错误就可能导致你的代码无法使用。大小写很重要，是因为按照惯，JavaScript
    使用一种名为`驼峰命名法`（camel case）的格式。这意味着复合词之间没有空格，并且每个单词的首字母大写。在名称示例中，你可以从 `firstName`、`lastName`
    和 `eyeColor` 的写法中看到这一点。在 JavaScript 中，第一个单词通常保持小写，其后的单词首字母大写。


    JavaScript 中还有许多其他类似的语法规则。例如，某些代码行末尾必须使用分号，而另一些行则不需要。初学者往往苦于无法完美做到这一点，并因此导致许多问题的出现。


    要在代码中留注释，你可以在文本前面加上 `/*` 或 `//`。这允许你为自己或参与该项目的其他程序员留下笔记。确保你的代码对于查看它的人（甚至是未来的你自己）来说是易于理解的，是成为一名优秀程序员的重要部分。


    当你学习编写代码时，所有这些语法规则可能会让你感到无从从。这可能也会令人困惑，因为不同的编程语言有不同的规则。它们通常在某种程度上是重叠的，但细微的差异可能即使是经验丰富的程序员如果不小心也会出错。


    ### 调试


    编程中最棘手的部分之一是调试。每当你编写一大块代码时，它几乎总是会有漏洞。这些漏洞可能是语法错误——代码的格式问题——或者是逻辑错误。逻辑错误可以有多种形式。一个例子是尝试调用不存在的属性。这会导致错误，因为如果属性不存在，就无法对其进行操作。


    幸运的是，有很多工具可以帮助你调试代码。事实上，大多数网络浏览器都内置了调试 JavaScript 的工具。工具可以指出你代码中的错误，以便你修复它们。某些浏览器甚至可以帮助提高网页的性能。它们可以分析网页上每个事件发生需要多长时间，并让你精准定位任何导致加载速度缓慢的性能问题。


    ### 代码编写位置


    许多程序员使用集成开发环境（IDE）。IDE 是一个你在其中输入代码的程序。虽然可以使用像记事本这样的简单文本编辑器来为网站编写代码，但 IDE 会让编写代码变得容易得多。如果你在记事本中忘记了分号，在运行代码之前你不会注意到它。然后，当代码无法工作时，你必须搜索你写过的所有内容并尝试诊断问题。IDE
    可以通过指出你何时犯了漏掉分号或未使用正确大小写等错误来防止这种情况。


    ![](img/main-22.jpg)


    集成开发环境为你的代码添加颜色，使其更容易看到每个部分。


    ### 后端 Web 开发


    到目前为止，我们主要查看了前端网页开发——它依赖于 HTML——但 JavaScript 也用于后端或服务器端。前端是你查看网页时看到的内容。事实上，你甚至可以在浏览器中查看任何网站的代码。（具体步骤取决于你使用的浏览器。）你的浏览器将显示创建你所看内容的
    HTML——以及几乎总是包含的 CSS 和 JavaScript。


    另一方面，后端功能在很大程度上在幕后运行。例如，当你在 Google 上搜索某个内容时，Google 的服务器使用算法创建一个与你的搜索匹配的网站列表。这完全在后端进行。然后，Google
    将你引导到一个新网页，显示在他们的服务器上创建的结果。在服务器上的操作对用户是不可见的。这就是为什么 Google 搜索算法的精确代码未知。


    ![](img/image_001_.jpg)


    后端的哈希算法保护用户的密码。


    数据库是后端最重要的部分之一。它们可以存储为了网站正常运行所需的各种信息。存储信息的一个例子是用户名。你可能认为密码也存储在数据库中，但事实上它们从未如此。如果数据库被破解，在其中存储密码将面临巨大的安全风险。


    相反，哈希后的密码通常存储在 Web 服务器上。哈希密码是根据你输入的密码生成的随机字符字符串。哈希密码类似于加密密码，但如果你有加密密钥，加密很容易被反转。对于哈希密码，没有简单的方法可以生成原始密码。


    在后端执行 JavaScript 需要一个 JavaScript 运行时。在前端，浏览器处理这一点。到目前，后端最流行的 JavaScript 运行时是 `Node.js`。它已被
    Netflix、微软和沃尔玛等许多网站使用。`Node.js` 你在后端使用 JavaScript 来满足上述需求，而不是使用 Java 或 Ruby 等其他编程语言。


    ### 库与框架


    一旦你学习了 JavaScript 的基础，就有许多库和框架可以帮助你构建网站。库和框架之间的边界很难界定。通常，库包含 JavaScript 对象和函数，你可以将它们整合到自己的代码中。这比从零开始尝试自己编写一切要容易得多。大多数网站使用多个库。另一方面，框架比库要健壮得多。它们试图简化开发的许多方面，为了实现这一点，它们通常使用许多不同的库。


    #### API


    编程中的一个重要概念是 API（应用程序接口）。API 规定了软件组件之间如何相互通信。这种宽泛的定义意味着 API 被用于完成各种任务。例如，如果你正在开发软件，你会使用操作系统的
    API 来集成应用和操作系统。许多大型在线数据库也会发布自己的 API 以为研究人员提供更强大的工具。例如，数字公共图书馆有一个程序员可以利用的 API，以便更容易地处理
    DPLA 数据。

