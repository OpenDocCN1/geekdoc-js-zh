    \ 部分使用 `CSS` 语法，它将不起作用。文本的对齐方式不会发生变化。这表明要犯可能影响网页外观的简单错误是多么么容易。\n\n虽然这两个示例非常简单，但\
    \ `CSS`、`HTML` 和 `JavaScript` 的交互对现代网站来说至关重要。它允许各种动态功能，使用户能够与响应式用户界面交互，而不是一个枯燥的静态页面。\n\
    \n## 支持程度\n\n`JavaScript` 和 `MEAN` 栈的流行带来了使用 `JavaScript` 的另一个优势：网络上有无数资源可以使 `JavaScript`\
    \ 编程变得更简单。存在大型社区，你可以在那里提问，并且有数百个网站拥有关于如何在 `JavaScript` 中实现编程目标的教程。\n\n即使在你精通了这种语言后，大量的\
    \ `JavaScript` 库和框架也可以简化你的生活。存在可以处理大量专门任务的库。此外，许多此类库和框架都是开源的。这意味着由用户社区不断进行更新。\n\
    \n![](img/image_004_.jpg)\n\n## 渲染问题\n\n使用 `JavaScript` 的一个主要缺点是网站的外观可能会取决于查看它的浏览器。这对于网页开发者来说是一个头疼的问题，解决由此引起的问题可能花费大量的时间。浏览器渲染问题是使简单项目变成网页开发者时间黑洞的因素之一。必须在许多不同的浏览器中测试网站，以确保它们在每个浏览器中正常运行。如果存在问题，通常必须编写额外的代码。\n\
    \n![](img/main-34.jpg)\n\n两个不同浏览器中的同一个网站\n\n正如我们之前看到的，`ECMA` 为浏览器应该支持的功能制定了标准。根据目前在线提供的数据，不同浏览器支持的功能百分比差异很大。例如，`Opera`\
    \ 和 `Chrome` 支持 94% 的 `ECMAScript 2016`（`JavaScript` 实现的内容）。然而，`Internet Explorer\
    \ 11` 仅支持 3%，而 `Microsoft Edge 15` 支持 76%。\n\n如果你网站上的某个功能不受观众浏览器的支持，它可能会干扰网站的外观和功能。花费多少时间来确保网站在可能使用的每个浏览器中都能运行取决于开发者的决定。由于许多人使用旧版本的浏览器（这些浏览器可能支持更的功能），这些问题变得更加严重。\n\
    \n有许多最佳实践可以减少由某些浏览器引起的问题。如果你从一开始就以特定的方式编写代码，就可以避免以后可能出现的很多问题。然而，这些实践需要时间和经验来学习。为单个浏览器编写代码可以解决许多问题，但也意味着随着新版本的发布，你的网站需要不断更新。\n\
    \n### 解释型语言\n\nJavaScript 是一门解释型语言，这一事实带来了各种优缺点。编程语言有两种：解释型语言和编译型语言。计算机无法执行用 `JavaScript`\
    \ 或 `C` 等编程语言编写的代码。相反，源代码在执行之前必须先经过解释或编译。\n\n编译型语言被直接转换为字节码或计算机能够读取的机器码。编译是在代码执行之前提前完成的，对于复杂的程序来说，可能非常耗时。相比之下，解释型语言是逐行解释并翻译成计算机运行的指令的。这意味着解释型代码开始运行所需的时间较短，但从长远来看，解释可能会花费更长时间，因为重复的代码行每次出现时都必须通过解释器运行。\n\
    \n`JIT`（即时编译）编译器在 `JavaScript` 中越来越受到关注，并包含在现代浏览器中。这些编译器编译部分 JavaScript 而不是总是解释它。因此，JavaScript\
    \ 的执行速度比它过去纯作为解释型语言时要快。\n\n解释型和编译型语言之间的差异在数据类型方面同样重要。数据类型是决定字符串、对象、数字等可以做和不能做什么操作的重要因素。例如，尝试将字符串（由文本组成）与数字相加是无法工作的。编译型语言通常在编译源代码时检查数据类型。它们会在代码执行之前通知程序员任何错误。\n\
