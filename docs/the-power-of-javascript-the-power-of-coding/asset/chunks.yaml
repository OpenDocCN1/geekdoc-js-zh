    Objective-C. The two different programming languages made development across both
    operating systems costly and time consuming. To this day, apps are often released on
    one platform before being reworked and released on the other.


    ##### JavaScript Conquers the Phone


    In the beginning, the closest you could come to creating an app with JavaScript
    was a mobile web app. Despite their name, these kinds of apps are not truly applications
    at all. Instead, they are web pages, viewed in a browser, which seek to emulate
    the style and layout of an app. They cannot be downloaded from an app store, and
    they require a browser to open them.


    But this changed in 2008\. A company by the name of Nitobi Software developed
    a mobile application development framework called PhoneGap. It allows developers
    to create phone apps using JavaScript, HTML, and CSS—the three languages of website development.
    The apps can then run on both Android and iOS devices without the need to program
    the app in two different programming languages.'
