    科技工作遍布整个美国和世界。然而，某些地区在该领域尤为重要。这意味着在这些地方寻找工作可能更容易，因为有许多公司在寻求员工。这同时也意味着试图晋入该领域顶端的人士通常会搬到这些地区，以为自己争取最多的晋升机会。


    计算机程序员最多的州是加利福尼亚州、德克萨斯州（达拉斯所在地）、纽约州、伊利诺伊州（芝加哥所在地）和新泽西州。这些地区聚集的原因之一是这些州的人口众多，但它们也是重要科技中心的所在地。像纽约市（以及附近的新泽西州）、芝加哥、达拉斯，以及加利福尼亚州的旧金山和洛杉矶，充满了科技公司。计算机程序员经常搬到这些城市寻找工作，有时会在这些城市之间搬迁，因为许多公司在其中多个城市都设有办公室。


    ![](img/main-45.jpg)


    ## 硅谷


    硅谷是众多领先科技公司的所在地。


    但在科技领域，没有哪个地方像硅谷这样闻名——它是位于加利福尼亚州旧金山湾的一个地区。它是科技领域无可争议的王者，其名字闻名全球。该行业中许多顶级品牌的总部都设在硅谷，包括
    Google、Apple 和 Facebook。


    硅谷在计算历史上扮演了重要角色。它在 1971 年根据该地区电子制造商的集中程度而得此名。硅被用于制造让手机和电脑等电子设备运行的芯片。即使在 1971 年之前，该地区在科技领域也扮演了不可或缺的角色。


    硅谷的显赫很大程度上是因为斯坦福大学位于其核心位置。一位名叫弗德里克·特曼（Frederick Terman）的斯坦福大学教授以及后的院长和教务长在将硅谷打造为科技中心的努力中发挥了巨大作用。1939
    年，特曼的两个学生威廉·休尔特（William Hewlett）和大卫·帕纳（David Packard）在特曼的鼓励下，在谷的一个车库里创立了惠普（HP）。今天，HP
    销售了全球近 20%的个人电脑。虽然 HP 是斯坦福大学毕业生在该地区创立的第一家公司，但它并不是最后一家。Google 和 Yahoo!在年后相随其后，斯坦福大学继续作为该行业的领导者。


    硅谷不仅是许多最大且最成熟科技公司的总部，还是全球初创公司最多的地方。初创公司通常依赖于富有的投资者或投资银行提供的资金来启动。这允许他们在开发初始产品时创建自己的产品并支付员工工资。这种对不提供股票公司的初始投资被称为风险投资。


    风险投资的金额通常非常巨额。例如，Facebook 在 2004 年成立仅短短几个月后，就从一位天使投资人处处收了 50 万美元。当时，这家公司规模很小，仍然由大学学生运营。该公司在随后的几年里获得了得多的资金。最值得注意的是，2011
    年，投资银行高盛向 Facebook 投资了 4.5 亿美元——这是一个惊震惊的数字。


    如果你决定尝试创立初创公司并正在寻找风险投资，没有没有比硅谷更好的地方了。全球惊人的 25%的风险投资（2012 年超过了 100 亿美元）投入了硅谷。事实上，硅谷的风险投资额甚至超过了整个欧洲大陆的总和。


    巨额资金流入该地区也有其缺点。硅谷的房产价值和生活成本高得惊人。如果你在该地区获得了一份工作，这是需要记住的。硅谷的房屋中位约为 100 万美元。相比之下，芝加哥的中位房价低于
    30 万美元。虽然硅谷的平均薪水高于芝加哥，但不足以抵消住房成本的巨大差异。


    尽管如此，在硅谷获得一份工作仍然许多计算机程序员的梦想。虽然初级员工的薪水不足以让他们在这个昂贵的地区过上奢华的生活，但成功的初创公司创始人大型公司的高级员工可以带回令人深刻目的薪水。


    ## Electron 和 GitHub


    o o o


    JavaScript 世界最近的创新之一是可以使用该语言轻松地为计算机创建桌面应用程序。这在很大程度上归功于名为`Electron`的新型框架，它始于 2013
    年（当时名为`Atom Shell`）。`Electron`使得为运行 Windows、Mac 和 Linux 操作系统的计算机创建桌面应用成为可能。你可以用
    JavaScript（以及 HTML 和 CSS）编写代码，生成的程序看起来像原生的计算机应用程序。


    有许多使用`Electron`构建的桌面应用。`WordPress` 是一个轻松创建网站的流行平台，它有一个使用`Electron`构建的应用，而`Discord`——一个游戏玩家常用的语音和文本通信应用——也是用它制作的。`Electron`本身是由初创公司`GitHub`开发的。


    `GitHub`是一个存储代码的云端服务。个人和企业可以购买会员，允许他们存储自己的程序。这样做的好处是`GitHub`简化了许多人协作同一代码的过程。用户可以请求其他人审查他们的代码——这为他们提供了反馈并改进了最终产品。这些功能不仅造福企业，也造了开发者依赖的许多开源项目。许多
    JavaScript 库和框架都是开源项目。在工作中使用这些项目的无数开发者也在网上对它们做出贡献，以便它们对每个人都运行得更好。如果你需要下载像`React`这样的
    JavaScript 框架，你通常可以在`GitHub`上完成。`Electron`也受益于开源。根据`GitHub`网站的：


    ```Electron 1.0 是社区努力的结果。在核心框架之外，已经发布了数百个库和工具用于构建、打包和部署 Electron 应用。```


    现在有一个新的社区页面列出了许多正在开发的`Electron`工具、应用、库和框架。你也可以查看`Electron`和`Electron Userland`组织来了解这些精彩的项目。


    `GitHub`对于全球开发者来说是一个极其重要的网站。截至 2017 年 5 月，亚马逊的 Alexa 估计它是美国第四十六位最受欢迎网站，全球第六十三位最受欢迎网站。这是由于数百万程序员和开发者经常使用它。如果你花费大量时间编写代码，你几乎会使用`GitHub`及其提供的许多开发人员资源——除非你想在上面托管私有项目，否则不需要支付会员费。


    ### 工作与 JavaScript


    一旦你学会了用 JavaScript 编写代码，各种职业选择就会开启。你需要做的第一个选择之一是是否进入 Web 开发。Web 开发专注于创建网站。通常，Web
    开发人员会有一些图形设计方面的经验，因为他们可能负责设计网站的布局以及功能性、技术性的方面。


