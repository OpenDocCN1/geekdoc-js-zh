- fmt: '

    This was a massive step forward. It opened up the new arena of mobile app development
    to `JavaScript`, the old standard of website development. The many programmers
    who already knew the languages necessary to create websites could now begin work
    on mobile apps, without needing to learn `Java` or `Objective-C`.


    `PhoneGap` creates hybrid apps rather than native apps. Hybrid apps are coded
    similarly to websites and then packaged in a native container so that they can
    be downloaded from the app store and access hardware like the phone camera. One
    drawback of `PhoneGap`, and other hybrid app development frameworks like it, is
    that they can perform poorly when compared to native apps. Apps coded in `Java`
    or `Objective-C`, depending on the operating system, tend to run faster than `PhoneGap`
    apps. This can be a significant drawback, and it is a concern that companies have
    to weigh against the benefit of using `JavaScript` rather than the other programming
    languages.


    ![](images/main-17.jpg)


    Mark Zuckerberg started Facebook in 2004. In 2015, Facebook created the JavaScript
    framework `React Native`.


    However, recent advances mean that `JavaScript` can be used to make truly native
    apps and not just hybrid apps. One of the leading frameworks that makes native
    apps using `JavaScript` is `React Native`. `React Native` was created by Facebook
    in 2015—it was used to make Facebook’s app as well as the apps of other high-profile
    companies like Instagram and Walmart.


    With `React Native`, you can code in `JavaScript`, but when the app runs, the
    user interface is displayed using native components. Thanks to the framework,
    you no longer have to choose between a hybrid app with slower performance or a
    native app programmed multiple times in difficult languages such as `Objective-C`
    and `Java` to function on both iOS and Android.


    With the rise of `React Native` and other frameworks like it, `JavaScript` is
    poised to expand even further into the field of app development. It is now possible
    for programmers to build websites and create apps using just one language. The
    incredible power and utility of `JavaScript` mean it is the most used programming
    language today, and consequently, it is commonly the first language that new programmers
    learn.


    ![](images/main-18.jpg)


    Opposite: Browsers before the era of `JavaScript`, like Mosaic, looked very different
    from what we''re used to.


    ![](images/main-19.jpg)


    ## How It Works


    How `JavaScript` works depends on how it is used. Originally, `JavaScript` was
    used solely for web development on the client side (also known as the front end).
    A programming language on the front end runs on the user’s computer, specifically
    their browser. It creates and changes what appears on the computer as you browse
    a website. Today, `JavaScript` remains the only popular programming language that
    fills this role. This is an astonishing fact considering there are numerous popular
    languages used on the back end (or server side), such as `Java`, `Ruby`, `PHP`,
    `C`, and `Python`.


    Back-end programming languages run on the server that hosts a website. They finish
    running before the website is displayed, while `JavaScript` can continue to work
    while the website is displayed. Backend programming languages are responsible
    for doing the work that goes on behind the scenes. For instance, when you purchase
    something online, it is the back end that processes the information you entered,
    verifies the transaction, and begins the shipping process.


    ### Front-End Web Development


    `JavaScript`’s reign as the most important front-end programming language is ongoing.
    Together with `HTML` and `CSS`, it is usually responsible for creating a website’s
    user interface that is displayed in a browser.


    To do this, `JavaScript` is coded directly into the `HTML` document that is a
    website. It is useful to look at the basic format of an `HTML` document to understand
    how this works. In stripped-down form, a website looks like this:


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title> This is displayed at the top of a browser </title>

    </head>

    <body>

    <p >This is a paragraph.</p>

    </body>

    </html>

    ```


    Let’s look at the parts of this example to get a basic grasp of `HTML`. The line
    `<!DOCTYPE html>` clarifies that the following document is in `HTML`; it is at
    the top of most websites on the web. The `<html>` tag marks the beginning of what
    is called the root element of the page. At the very end of the page, the `</html>`
    signals the end of this element. In `HTML` (and some other languages), the back
    slash (`/`) is used to signal the end of a component. In this way, `HTML` tags
    are often spoken of as pairs, with a beginning tag, such as `<html>`, and an end
    tag, such as `</html>`.


    Within this pair of tags are the head and body elements. The head contains metadata—or
    a description of the data. What is written in this element is not displayed on
    the actual web page itself, although the contents of the title element do appear
    in a tab above the web page in most modern browsers. Inside the body element,
    there are the contents of the web page itself. In this example, there is one paragraph
    that appears inside the `<p>` and `</p>` pair. Any formatting of this text would
    generally be done in `CSS`, not `HTML`.


    The above example is written entirely in `HTML`. It would be a static web page
    of just one sentence. In order to make it dynamic, you could insert `JavaScript`
    into the `HTML`. Here’s an example of `JavaScript` used to create a button:


    ```html

    <!DOCTYPE html>

    <html>

    <head></head>

    <body>

    <p> What is the answer to 1+1? </p>

    <p> Click on the button to find out! </p>

    <button type="button" onclick="document.write(1 + 1)">Click here to show the answer.</button>

    </body>

    </html>

    ```


    As you can see, most of this code is `HTML`. The document type, `HTML`, `body`,
    and paragraph tags are all basic `HTML`. However, the part of the code that creates
    the button is written in `JavaScript`. This part makes the web page dynamic. When
    you click on the button that appears, all the text is replaced by the number “2.”
    This change takes place on the client side. That means there is no request sent
    to the server. This is why `JavaScript` is so important—it remains the only widespread
    language able to complete this task. Other languages could add one plus one and
    change the web page, but they would require the user to refresh and for there
    to be another request sent to the server. Here, the user’s display changes instantly
    thanks to processes completed on their own computer.


    ### JavaScript Basics


    Adding a button to a website is a common and easy example of `JavaScript`, but
    it can accomplish a lot more. Much of `JavaScript`’s functionality depends on
    the fact that it is an object-oriented programming language. This means that it
    uses objects to accomplish tasks. An object is a collection of data and actions
    that can be performed on data.


    Let’s look at a simple object to illustrate what an object is. Imagine you want
    to store data about a person. You could write the following code to do that:


    ```javascript

    var person = {firstName:"John", lastName:"Doe", age:17, eyeColor:"brown"};

    ```


    `var` at the beginning stands for “variable,” and it declares the name of the
    object: `person`. Then, there are four different properties: `firstName`, `lastName`,
    `age`, and `eyeColor`. Properties are values. These values can be different data
    types. Here, three of the values are strings—or text—and one is a number, but
    they could also be Booleans. Boolean data types have the value “true” or “false.”
    For instance, a person might have a Boolean data type specifying whether they
    are married or unmarried. It is either true or false.

