    这种普及也带来了许多好处。这意味着 `JavaScript` 是一种程序员学习的一门流行语言，因为它是许多职位的任要求。如果你预计要从事任何与网站开发相关的工作，至少需要
    `JavaScript` 的基础知识。在从事前端工作时，通常还需要对 `JavaScript` 及其相关的库和框架有深入的了解。因此，对于精通 `JavaScript`
    的人来说，有很多工作机会。虽然掌握不那么流行的编程语言也可能有丰厚的回报，但对于精通这些语言的人来说，在任何给定时间内，并不总有数百个职位空缺可供。例如，根据一项调查显示，在
    2016 年，更专业的程序员中，报告使用 `AngularJS` 框架的人数甚至多于 `Ruby` 和 `Objective-C` 的总和。这些调查结果令人震惊，因为大多数使用
    `JavaScript` 的人并没有使用 `AngularJS`。使用 `JavaScript` 的开发者如此之多，以至于即使使用 `AngularJS`
    的人数也超过了使用 `Ruby` 和 `Objective-C` 的受访者人数。


    在某些方面，`JavaScript` 的普及也是一个缺点。广泛使用的技术由于其流行程度，往往是黑客攻击的目标。尝试在网站和程序的常用功能（如 `JavaScript`）中寻找漏洞比在很少使用的功能中寻找更有意义。


    `JavaScript` 最臭名昭著的漏洞之一是跨站脚本（`XSS`）。跨站脚本的基本原理相当简单——黑客试图让网站执行一段脚本，该脚本向网站的其他用户发送恶意脚本。你可能会想这怎么可能实现，而答案可能会让你惊讶。


    最简单的 `XSS` 攻击依赖于网站自身的输入字段，例如搜索栏或用户名字段。黑客输入的不是用户名，而是代码，并观察网站是否会执行它。如果网站是安全的，它会判断不应该运行该代码；但如果它存在漏洞，就可能会执行它。然后黑客可以设计代码，引导网站向其他用户发送恶意脚本。由于这些脚本来自受信任的网站，它们会被其他用户的浏览器执行。


    最终结果是，攻击者可以访问访问影响网站的无辜用户的 cookie（网站用于跟踪访问者的的工具）和其他信息。在最坏的情况下，这些 cookie 可能包含信用卡号和其他敏感的个人信息。虽然这种依赖输入字段的简单
    `XSS` 形式已为人知，几乎所有网站都对其采取防护措施，但网上仍然存在更复杂的 `XSS` 漏洞。根据计算机安全公司 High-Tech Bridge 的数据，2015
    年约 80% 的安全漏洞与 `XSS` 相关。不出意外的是，几乎所有的 `XSS` 漏洞都与 `JavaScript` 相关，因为它是唯一的客户端脚本语言。


    ## 没有 JavaScript 的用户


    `JavaScript` 的一个严重缺点是某些用户无法接收依赖于它的内容。在没有 `JavaScript` 增强的情况下查看网站的切人数很难说定。英国政府数字服务部门在
    2013 年对该问题进行了最严谨的研究之一。他们的发现是，约 1.1% 的用户没有正确接收到需要 `JavaScript` 的内容。有趣的是，只有 0.2%
    的用户禁用了 `JavaScript`；对于剩下的 0.9% 用户来说，`JavaScript` 无法正常工作。


    虽然这个用户百分比较低，但对于高流量网站来说这可能是一个巨大的数字。例如，Facebook 在 2017 年第一季度平均每天有 12.8 亿用户。如果这个数字的
    1.1% 无法正常看到依赖 `JavaScript` 的内容，将是 1400 万人。不过有趣的是，Facebook 甚至不允许你在禁用 `JavaScript`
    的情况下查看网站，这很可能是因为由于高度依赖 `Ajax`。如果你尝试在禁用 `JavaScript` 的情况下访问 Facebook，网站会显示一条信息：“启用
    JavaScript 后 Facebook 才能正常工作”，并将你重重定向到移动端网站。像 Amazon 等其他热门网站将允许你在没有 `JavaScript`
    的情况下进行浏览，否则它们可能会失去 1% 的客户，尽管在禁用时某些功能会缺失。


    由于这个问题，Web 开发者面临一个选择，即是否为没有 `JavaScript` 的用户优化网站。确保在禁用 `JavaScript` 的情况下网站的精简版本仍然可用可能非常耗时，但开发者通常会花时间这样做，而不是失去网站大约
    1% 的流量。


    ## 全栈 Web 开发


    一个功能完备的网站有许多不同的部分。它必须既有前端（用户看到的）又有后端（处理数据和处理服务器请求的）。在像 Facebook 或 Amazon 这样的大公司里，不同的团队通常负责网站的这些不同部分。例如，处理和构建
    Facebook 数据库的人不负责用户界面。每个团队都拥有与其专业领域相关的高度专门化的技能。然后还有一个具有前端和后端通用知识的团队，将这两个部分整合在一起。


    `MEAN` 栈一术诞生于 2013 年，它仍然是人们设计网站的一种流行方式。(images/32.jpg)


    一个全栈 Web 开发者需要良好掌握 `HTML`、`CSS` 和 `JavaScript` 作为起点。后端也有许多常用的语言，例如 `SQL` 和 `Java`。对于全栈开发者来说，`JavaScript`
    相比其他语言的一个显著优势是，可以使用 `JavaScript` 以及 `HTML` 和 `CSS` 之外的任何语言来创建一个网站或应用。


    事实上，`JavaScript` 是唯一可以做到此点的语言。最流行的开源 JavaScript 栈被称为 `MEAN` 栈。`MEAN` 代表 `MongoDB`（处理数据库）、`Express.js`（一个
    Web 框架）、`AngularJS` 和 `Node.js`。这四者都是使用 JavaScript 编写的。


    使用单一语言编写的栈有几个不同的优势。首先，可以在前端和后端使用相同的代码。这可以减少为了完成相同或类似任务而在不同语言中编写代码花费的时间。其次，如果你刚开始学习编程，掌握
    `JavaScript` 比掌握许多不同的编程语言要容易得多。第三，如果你是一个团队的一部分，团队的所有成员都使用 `JavaScript` 工作，因此可以更紧密地协作。如果你的栈包含多种不同的语言，团队中的所有成员就不可能理解它们所有的语言。


    #### JavaScript、CSS 和 HTML


    `JavaScript` 的重要特性之一是它能够与 `CSS` 和 `HTML` 交互的能力——这是创建高质量 Web 页面所需的另外两种语言。让我们来看一个使用
    `HTML`、`CSS` 和 `JavaScript` 构建的简单网页的示例，看看这些交互是如何发生的：


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <style>

    P {

    color: blue; text-align: center;

    }

    </style>

    </head>

    ```


