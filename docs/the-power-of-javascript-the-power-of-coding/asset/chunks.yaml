- fmt: "\n```html\n</head>\n<body>\n<p id=\"demo\" onclick=\"myFunction()\">Original\
    \ Paragraph.</p>\n<script>\nfunction myFunction() {\n  document.getElementByid(\"\
    demo\").innerHTML = \"Displayed after click.\";\n}\n</script>\n</body>\n</html>\n\
    ```\n\nThe `<html>`, `<head>`, and `<body>` tags are necessary HTML tags to structure\
    \ the page. These tags organize the web page according to the `DOM`. Inside the\
    \ `HTML` style tag (located in the `<head>`), you can find lines of `CSS`. These\
    \ lines of code specify that all text inside `HTML` paragraph tags (`<p>` and\
    \ `</p>`) is blue and centered in the middle of the page. Inside the `<body>`,\
    \ there is one paragraph that is given an `id` of `\"demo\"` and contains the\
    \ text `\"Original Paragraph.\"`. When a user first loads this web page, these\
    \ two words (in blue at the center of the page) are all that appear.\n\nThus far,\
    \ it appears to be a static web page. However, the JavaScript that follows makes\
    \ it dynamic. The lines of code contained within the `<script>` tags interact\
    \ with `onclick=\"myFunction()\"` within the paragraph tags. Consequently, when\
    \ the viewer clicks on the text `\"Original Paragraph,\"` these two words are\
    \ replaced by text reading `\"Displayed after click.\"`. This text is styled the\
    \ same way—in blue and centered—due to the `CSS` at the top of the page. In this\
    \ way, `JavaScript` is capable of interacting with `HTML`.\n\nLet's look at a\
    \ similar example that shows JavaScript interacting with `CSS`:\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<style>\nP {\n  color: blue; text-align: center;\n}\n\
    </style>\n</head>\n<body>\n<p id=\"p1\">Styled by CSS above</p>\n<p id=\"p2\"\
    >Style changed by JavaScript below</p>\n<script>\ndocument.getElementById(\"p2\"\
    ).style.color = \"red\";\ndocument.getElementById(\"p2\").style.textAlign = \"\
    left\";\ndocument.getElementById(\"p2\").style.fontFamily = \"Arial\";\ndocument.getElementById(\"\
    p2\").style.fontSize = \"larger\";\n</script>\n\n#### JavaScript, CSS, and HTML\
    \ (cont . )\n\n- <p>This is styled by the CSS at the top.</p>\n</body>\n</html>\n\
    ```\n\nIn this example, there are three paragraphs. The top two have `ids` and\
    \ the bottom one does not. The first and last paragraphs are styled according\
    \ to the `CSS` at the top: blue and centered. However, the middle paragraph `\"\
    p2\"` is not. Its style is changed by the `JavaScript`. When this `HTML` document\
    \ is opened in a browser, it will be larger, red text at the left of the page\
    \ in `Arial` font. `JavaScript` was used to change the formatting first defined\
    \ by `CSS`.\n\nIf you look at the formatting of this example, you can see differences\
    \ between the `CSS` and `JavaScript`. Between the `<style>` tags, we use `text-align`.\
    \ But between the `<script>` tags, we use `textAlign`—note the camel case rather\
    \ than the hyphen. If you try to use the `CSS` syntax in the `JavaScript` section,\
    \ it will not work. The alignment of the text will not change. This shows just\
    \ how easy it is to make simple mistakes that may affect how your web page looks.\n\
    \nWhile these two examples are quite simple, the interaction of `CSS`, `HTML`,\
    \ and `JavaScript` is extremely important to modern websites. It allows all sorts\
    \ of dynamic functions that let the user interact with a responsive user interface\
    \ rather than a boring, static page.\n\n## The Level of Support\n\nThe popularity\
    \ of `JavaScript` and the `MEAN` stack have led to another benefit of using `JavaScript`:\
    \ there are countless resources on the web to make programming in `JavaScript`\
    \ easier. Large communities exist where you can ask questions, and hundreds of\
    \ websites have tutorials on how to reach programming goals in `JavaScript`.\n\
    \nEven after you have mastered the language, the huge number of `JavaScript` libraries\
    \ and frameworks that exist can simplify your life. Libraries exist that can handle\
    \ of large number of specialized tasks. Additionally, many of these libraries\
    \ and frameworks are open source. This means they are updated constantly by their\
    \ community of users.\n\n![](images/image_004_.jpg)\n\n## Rendering Concerns\n\
    \nOne major disadvantage of using `JavaScript` is the fact that a website’s appearance\
    \ can vary depending on the browser that is used to view it. This is a headache\
    \ for web developers, and the issues this causes can take an extraordinary amount\
    \ of time to address. Browser rendering issues are one of the factors that make\
    \ a straightforward project turn into a time sink for web developers. It is necessary\
    \ to test websites in many different browsers to ensure they are functioning properly\
    \ in each one. If there are issues, additional code often has to be written.\n\
    \n![](images/main-34.jpg)\n\nThe same website in two different browsers\n\nAs\
    \ we saw previously, the `ECMA` sets the standards for what features browsers\
    \ should support. According to their current data available online, the percentage\
    \ of features that different browsers support varies widely. For instance, `Opera`\
    \ and `Chrome` support 94 percent of `ECMAScript 2016` (which `JavaScript` implements).\
    \ However, `Internet Explorer 11` supports just 3 percent, and `Microsoft Edge\
    \ 15` supports 76 percent.\n\nIf a feature on your website is unsupported by the\
    \ browser of a viewer, it can interfere with the site’s appearance and functionality.\
    \ It is up to the developer to decide how much time to spend to make sure that\
    \ a website functions in each and every browser that may be used. These problems\
    \ are compounded by the fact that many people use old versions of browsers that\
    \ may support fewer features.\n\nThere are a number of best practices that minimize\
    \ the issues caused by some browsers. If you write code a certain way from the\
    \ beginning, it can avoid many problems that may crop up later. However, these\
    \ practices take time and experience to learn. Writing code for individual browsers\
    \ can solve many issues, but it also means your website will need to be updated\
    \ constantly as new versions are released.\n\n### An Interpreted Language\n\n\
    The fact that JavaScript is an interpreted language comes with a variety of advantages\
    \ and disadvantages. There are two kinds of programming languages: interpreted\
    \ languages and compiled languages. Computers cannot execute code written in programming\
    \ languages like `JavaScript` or `C`. Instead, the source code must first be interpreted\
    \ or compiled before it can be executed.\n\nCompiled languages are converted directly\
    \ into bytecode, or machine code that the computer is capable of reading. Compiling\
    \ is done up front before the code is executed and can be quite time-consuming\
    \ for a complicated program. In contrast, interpreted languages are interpreted\
    \ line by line and translated into instructions that the computer then runs. This\
    \ means it takes less time for interpreted code to begin running, but in the long\
    \ run interpretation can take longer because repetitive lines of code must be\
    \ run through an interpreter every time they occur.\n\n`JIT` (Just in Time) compilers\
    \ are gaining traction with `JavaScript` and are included in modern browsers.\
    \ These compile some JavaScript rather than always interpreting it. As a result,\
    \ JavaScript executes faster than it used to when it was strictly an interpreted\
    \ language.\n\nThe differences between interpreted and compiled languages matter\
    \ when it comes to data types as well. Data types are an important factor in what\
    \ can and can’t be done with a string, object, number, and more. For instance,\
    \ code that tries to add a string (composed of text) to a number won’t work. Compiled\
    \ languages generally check data types when they compile the source code. They\
    \ will notify the programmer of any errors before the code is even executed.\n"
