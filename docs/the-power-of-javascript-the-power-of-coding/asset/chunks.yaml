  trans: "\n\n该恶意软件命名为 `RAA`。一如既往，避免感染的最好方法是不打开发送恶意软件的原始邮件中的附件。`RAA` 是第一次仅使用 `JavaScript`\
    \ 创建的勒索软件。但考虑到这种语言的普及，这不太可能是最后一次。\n\n研究人员还利用 `JavaScript` 通过所谓的 `Rowhammer` 漏洞来接管计算机和手机。这种攻击依赖于设备的硬件（或物理组件），而不是其程序。通常，来自网站的\
    \ `JavaScript` 被禁止访问设备最关键的内存位置。这防止了网站窃取密码等敏感信息或接管你的计算机。然而，当以特定方式访问内存位置时，有极小的概率相邻的内存位置发生变化。`Rowhammer`\
    \ 利用了这一事实，通过反复访问内存，直到能够损坏并接管设备内存中最重要的部分（这些部分通常是被锁定在之外的），从而接管设备。\n\n根据研究人员的说法，这是“首次远程软件诱发的硬件故障攻击”。换句话说，这是程序第一次能够从世界另一端利用设备物理特性中发现的漏洞。其他的硬件故障攻击依赖于对设备的物理访问：例如，在某些情况下，将激光照射到设备上可能会破解加密。\n\
    \n`Rowhammer` 代表了未来的威胁，安全研究人员如此关注它的原因之一是它对 `JavaScript` 的使用。如果你开启了 `JavaScript`，几乎没有采取采取措施可以阻止网站运行它。而且由于它针对的弱点在设备硬件中，因此没有简单的修复方法。\n\
    \n## 手机应用开发\n\n编写手机应用通常是一项耗时的活动。由于 `iOS` 和 `Android` 操作系统在手机上的普及，意味着应用通常需要用两种不同的编程语言进行编写。传统上，`iOS`\
    \ 使用 `Objective-C`，`Android` 使用 `Java`。然而，这种情况在最近几年发生了变化。`Objective-C` 已在很大程度上被编程语言\
    \ `Swift` 取代。`Swift` 由苹果公司于 2014 年开发，与 `Objective-C` 类似，但试图变得更简单、更容易学习。这对于让公司和个人都能更容易进行应用开发来说是的一大进步。\n\
    \n今天，`JavaScript` 框架也允许仅使用 `JavaScript` 来编写应用。目前这些框架中最流行的是 Facebook 的 `React Native`。`React\
    \ Native` 与 `React` 非常不同——`React` 是一个专注于网站界面的 `JavaScript` 库。`React Native` 被认为是一个框架而不是库，它专门用于为\
    \ `iOS` 和 `Android` 设备创建应用，而不是网站。\n\n要开始使用 `React Native`，你只需要下载 Facebook 网站上的免费文件并确保计算机上安装了\
    \ `Node.js`。然后，你就可以开始编码了。`React` 网站提供了以下代码作为示例，创建一个显示“Hello world!”字样的应用：\n\n\
    ```javascript\nimport React, { Component } from 'react';\nimport { AppRegistry,\
    \ Text } from 'react-native';\n\nexport default class HelloWorldApp extends Component\
    \ {\n  render() {\n    return (\n      <Text>Hello world!</Text>\n    );\n  }\n\
    }\n\n// 使用 Create React Native App 时跳过此行\n\nAppRegistry.registerComponent('HelloWorldApp',\
    \ () => HelloWorldApp);\n```\n\n你可能识别出 `JavaScript` 的一些特性。语句末尾使用分号。代码中使用驼峰命名法，两个反斜杠标记代码中不执行的注释的开头。然而，这只是用\
    \ `React Native` 编写的应用的非常简单的示例。尽管使用了框架来简化事情，但完全开发的应用可能会相当复杂。\n\n![Image](img/page53_image4.jpg)\n\
    \n相反：`JavaScript` 无处不在，包括你的收件箱。但并不意味着它是所有 Web 开发的最佳语言。\n\n![](img/image_003_.jpg)\n\
    \n### 优点与缺点\n\n`JavaScript` 许多许多优点和缺点。其中一些是其普及程度的结果，而另一些是其作为编程语言的设计初衷。和所有编程语言一样，塑造该语言的许多设计决策都伴随着利与弊端。多种语言可以以不同的难度完成相同的任务——用于某个项目的最优语言取决于你的目标。然而，`JavaScript`\
    \ 在许多非常重要的方面是独特的。这就是为什么它是专业开发人员最常用的编程语言。通常没有办法可以取代 `JavaScript`——特别是在 Web 开发中。\n\
    \n因此，它的流行程度在短期内不太可能下降。在本章中，我们将研究 `JavaScript` 的许多优缺点。\n\n## 唯一的客户端脚本语言\n\n`JavaScript`\
    \ 仍然是客户端脚本语言的唯一真正选择。这在网站开发中是一个至关重要的角色。它允许你的浏览器更改网站的显示，并在不向服务器发送请求的情况下检查你是否完成了表单。缺乏这种语言是\
    \ `JavaScript` 产生的原因，但与其他许多语言不同，`JavaScript` 从未见过严肃的竞争对手试图取代它的位置。由于这个原因，`JavaScript`\
    \ 是 Web 开发领域的常客。\n\n这种语言的处是多方面的。它们让网站运行快得多，减轻了服务器的压力。这是因为更多操作可以在用户的机器上完成，而不是通过反复通信。更少的在线通信意味着用户等待网站刷新的时间更短。相反，它可以根据客户端脚本指定的更改外观，或者因为表单为空而不发送请求。\n\
    \n客户端编程语言也是 `Ajax` 的必要组件（这就是为什么 `JavaScript` 是该缩写词中的“J”）。`JavaScript` 允许网站在后台不断更新，使得像\
    \ Facebook 新闻流这样的组件可以无限滚动新内容，而无需刷新网页。在这里，`JavaScript` 也是不可替代的。这种优势极其重要。这一切都由 JavaScript\
    \ 实现。\n\n## 流行：是祝福也是诅咒\n\n学习 `JavaScript` 的主要益处之一是其惊人的实用性。没有其他语言可以用于如此多不同的事情。`JavaScript`\
    \ 不仅是构建现代网站所必需的，如果你下载了免费的开源框架，它还可以用于制作手机应用和桌面应用。\n\n因此，如果你良好地学习 `JavaScript`，你就可以完成各种项目。\n\
    \n根据调查，使用 `JavaScript` 的计算机程序员比任何其他编程语言都多。它不仅在前端 Web 开发人员中流行（在那里它几乎是必不可少的），在有如\
    \ `Java` 等其他选择的后端开发人员中也流行。随着 `React Native` 等框架的完善，它在应用创建中也变得流行。\n\n![](img/main-31.jpg)\n\
    \n`React Native` 允许开发者为 `Android` 和 `iOS` 手机创建应用，这是手机最流行的两种操作系统。\n\n"
- fmt: '

    This popularity comes with a number of benefits. It means that `JavaScript` is
    a popular language for programmers to learn, since it is a requirement for so
    many jobs. If you are expected to do anything related to website development,
    at least a basic knowledge of `JavaScript` is required. Working on the front end,
    a detailed knowledge of `JavaScript` and likely its libraries and frameworks is
    also needed. Consequently, there are many jobs available for someone who knows
    `JavaScript` well. While knowledge of less popular programming languages is also
    lucrative, there are not always hundreds of job openings at any given time for
    someone well-versed in these languages. For instance, more professional programmers
    reported using the `AngularJS` framework in 2016 than both `Ruby` and `Objective-C`
    combined, according to a survey. These survey results are stunning because the
    majority of people who used `JavaScript` did not use `AngularJS`. There are so
    many developers using `JavaScript` that even those who used `AngularJS` topped
    the respondents who use `Ruby` and `Objective-C`.


    `JavaScript`’s popularity is also a drawback in some ways. Widespread technologies
    are often the first to be targeted by hackers because of their popularity. It
    makes more sense to try to find vulnerabilities in common features of websites
    and programs—such as `JavaScript`—rather than rarely used features.


    One of the most notorious vulnerabilities that `JavaScript` has is known as Cross-Site
    Scripting (`XSS`). The basic idea of cross-site scripting is rather simple—the
    hacker tries to get a website to execute a script that sends malicious scripts
    to other users of a website. You might wonder how this is possible, and the answer
    can be surprising.


    The simplest kind of `XSS` attacks rely on a website’s own input field, like a
    search bar or username field. Rather than a username, a hacker inputs code and
    sees if the websites executes it. If the website is secure, it will determine
    that it should not run the code, but if it is vulnerable, it may execute it. The
    hacker can then design code that directs the website to send malicious scripts
    to other users as well. Since these scripts come from the trusted website, they
    are executed by the browsers of other users.


    The end result is that the attacker can access the cookies (what websites use
    to track visitors) and other information of innocent users who visit the affected
    website. In a worst-case scenario, these cookies may contain credit card numbers
    and other sensitive personal information. While this simple form of `XSS`, relying
    on input fields, has become so well known that almost all websites protect against
    it, more sophisticated `XSS` vulnerabilities still exist on the web. According
    to High-Tech Bridge, a computer-security firm, in 2015 some 80 percent of security
    vulnerabilities were related to `XSS`. Unsurprisingly, almost all `XSS` vulnerabilities
    relate to `JavaScript` since it is the only client-side scripting language.


    ## Users without JavaScript


    One serious drawback of `JavaScript` is that some users do not receive content
    that relies on it. The exact number of people who view websites without the enhancement
    of `JavaScript` is hard to say. One of the most rigorous studies on the issue
    was conducted by the British Government Digital Service in 2013. Their finding
    was that about 1.1 percent of users did not properly receive content that required
    `JavaScript`. Interestingly, only 0.2 percent had `JavaScript` disabled; `JavaScript`
    simply didn’t work properly for the remaining 0.9 percent of users.


    While this percent of users is quite low, it can be an extremely large number
    of people on a high-traffic website. For example, Facebook saw an average of 1.28
    billion daily users in the first quarter of 2017. If 1.1 percent of that number
    could not properly see content relying on `JavaScript`, it would be 14 million
    people. However, it is interesting to note that Facebook will not even let you
    view the site with `JavaScript` disabled, most likely since it relies so heavily
    on `Ajax`. If you try to access Facebook with `JavaScript` disabled, the site
    displays a message that says “Facebook doesn’t work properly without `JavaScript`
    enabled” and redirects you to the mobile site. Other popular sites like Amazon
    will allow you to navigate without `JavaScript`, since otherwise they might lose
    1 percent of their customers, although some functions are lacking when it is disabled.


    Because of this issue, web developers are left with a choice of whether or not
    to optimize websites for users without `JavaScript`. It can be time-consuming
    to ensure that a stripped-down version of a website is functional when `JavaScript`
    is disabled, but often developers will take the time to do so rather than lose
    approximately 1 percent of a site’s traffic.


    ## Full-Stack Web Development


    There are many different parts to a fully functioning website. It is necessary
    to have a front end (that the user sees) and a back end (that manipulates data
    and handles server requests). At a large company like Facebook or Amazon, different
    teams of people generally work on these different parts of the website. For example,
    the people who manipulate and structure Facebook’s databases don’t work on the
    user interface. Each team has highly specialized skills that relate to their area
    of expertise. There is then an additional team with a general knowledge of the
    front end and back end that integrates the two parts.


    The term `MEAN` stack was coined in 2013, and it remains a popular way for people
    to design websites.![](images/32.jpg)


