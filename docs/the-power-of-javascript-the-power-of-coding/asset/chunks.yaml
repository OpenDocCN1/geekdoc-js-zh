- fmt: '

    Data from another job website, `gooroo.io`, makes this clear. The site breaks
    down what `JavaScript` developers make based on the framework they are responsible
    for using. According to their postings, the average salary of a developer who
    primarily uses `Node.js` is $98,003, while the average salary of one who uses
    `React` is $78,603\. What you do with your knowledge of `JavaScript` can have
    a big impact on your salary.


    To sum up, it is unclear what exactly a person who works with `JavaScript` could
    expect to earn compared to a peer who worked with another language like `Ruby`
    or `C++`. What is clear is that `JavaScript` is one of the most widely used programming
    languages, and it is popular among developers who work in many different fields
    in the tech industry.


    ## More Motivation to Learn a Language


    Outside of getting a job, there are other good reasons to learn how to program.
    Learning a programming language teaches you to think rationally and to solve problems.
    Many people have explained the myriad benefits that learning to code brings, and
    many influential people think all students should at least learn the basics of
    how to code to prepare them for life. In a 1995 interview, Apple founder `Steve
    Jobs` expressed his own views about why learning to program is so important:


    > I think everybody in this country should learn how to program a computer, should
    learn a computer language, because it teaches you how to think. It’s like going
    to law school. I don’t think anybody should be a lawyer, but I think going to
    law school would actually be useful because it teaches you how to think in a certain
    way—in the same way, computer programming teaches you, in a slightly different
    way, how to think. I view computer science as a liberal art. It should be something
    everyone learns—takes a year in their life, one of the courses they take is learning
    how to program.


    ![](images/main-40.jpg)


    Steve Jobs believed everyone should learn to code.


    Once you’ve decided to learn how to code, the next question is how to go about
    it. The three main options are college, coding boot camp, or learning on your
    own. All three have their distinctive advantages and disadvantages, and which
    one is best for you is a highly personal choice. It depends on your preference
    for learning alone or in a group, as well as how much money you want to spend
    on education. College is by far the most expensive option (without significant
    scholarships), followed by coding boot camps, which can also cost thousands of
    dollars. Self-study, on the other hand, can be virtually free if you have a computer
    with internet access or can use one at a library.


    ## The Question of College


    One of the biggest decisions to make is whether or not to attend college to study
    a field related to coding. This is a controversial question, and many people argue
    it is unnecessary and a waste of money given the high cost.


    First, let’s look at the arguments in favor of a degree. The fact is that the
    majority of professionals have a degree. According to the `Stack Exchange` survey,
    76 percent of developers did. Of these, more than a quarter majored in computer
    science. Furthermore, 20 percent of respondents reported having a master’s degree.


    ![](images/main-41.jpg)


    ## Salary and Education


    Salary tends to increase the more education you receive. According to a 2015 report
    by `Burning Glass Technologies`, an analytics company that monitors the labor
    market, “89 percent of career-track jobs typically require a bachelor’s degree.
    For the purposes of this report, career-track jobs are defined as those that pay
    more than $15 an hour.


    Perhaps the most compelling reason to go to college is for personal enrichment.
    You might discover you are interested in subjects you had never been exposed to.
    Also, `computer science` is still popular in the industry.


    Nevertheless, there are many people who say a degree is not necessary for a successful
    career. The prominent examples are `Bill Gates`, the founder of `Microsoft`, and
    `Steve Jobs`, the founder of `Apple`. Neither one completed their undergraduate
    studies.


    One argument for not going to school is the fast-paced nature of the industry.
    Aspects of it, like what `JavaScript` framework is used, change at breakneck speed.
    By the time you finish a four-year program, it is likely what you learned is outdated.
    Financial arguments are also put forward against going college. Salaries among
    those with degrees are typically higher than the self-taught. However, this difference
    drops off the further into one’s career you look, and the cost of tuition does
    not offset the gain.


    ![](images/main-42.jpg)


    Yale professor Gelernter


    Many people argue that the university courses themselves are out of touch with
    the real world. In 2015, a start-up head and professor `David Gelernter` published
    an argument to this effect in the `Wall Street Journal` op-ed section:


    > The thing I don’t look for in a developer is a degree in computer science. University
    computer science departments are in miserable shape: ten years behind a field
    that changes every ten minutes. Computer science departments prepare their students
    for academic or research careers and spurn jobs that actually pay money. They
    teach students how to design an operating system, but not how to work with a real,
    live development team. There isn’t a single course in iPhone or Android development
    in the computer science departments of Yale or Princeton. Harvard has one, but
    you can’t make a good developer in one term.


    ## Boot Camps


    Coding boot camps—crash courses in how to code—are a controversial subject. The
    programs typically last from two to six months and aim to prepare students for
    an entry-level job in the field of computer programming or web development. `JavaScript`
    is a popular programming language, among many others, for boot camps to cover.

