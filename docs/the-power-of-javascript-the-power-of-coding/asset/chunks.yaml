    ### The History of JavaScript


    JavaScript is the most widely used programming language in the world. It is an
    essential component of most websites—a fact that has earned it the nickname “the
    language of the web.” It is also used to develop applications (apps) for phones
    and other devices. Despite its high profile, JavaScript was designed and created
    in just ten days by one person: Brendan Eich. Although he did not know it at the
    time, his creation would revolutionize the way that people use the internet and
    make web pages. Since its creation in 1995, JavaScript has been an integral part
    of web development. Millions of programmers use JavaScript to do their jobs and
    develop the programs that shape our lives. But before we look at the important
    ways that JavaScript is used today, let’s look at its fascinating history in the
    early years on the internet.


    In 1995, the internet was still in its infancy. The World Wide Web had just been
    made available to the public in 1991, and it was still quite slow and tedious
    to use. Internet browsers—used to view web pages—were still rudimentary and had
    long load times. To open a new web page generally took at least thirty seconds, if
    not more, on the telephone-line modems people used to access the internet. Because
    of this, filling out forms on the internet (for instance, to open a new email account),
    was a painstaking process. If you forgot to fill in a field, you would have to
    wait while your computer sent a request to the server. The server would then send
    a response back pointing out the error. In this way, even the most basic online
    tasks became tiresome because of the need for your computer to communicate over
    the slow internet to accomplish anything.


    JavaScript was created to remedy this issue. It enabled web pages to check to
    see if every required field was filled in before sending a request to the server. This
    meant that if users left a field blank, they could be informed before the lengthy
    communication between their computer (also known as the client) and the server
    began.


    JavaScript became the first popular client-side programming language. Its widespread
    adoption marked a fundamental shift in internet history. Tasks could now be accomplished
    both client-side and server-side with ease. The functions of JavaScript quickly grew,
    and it was soon used for many things other than simply checking forms and other
    basic tasks. It allowed websites to become more interactive and paved the way
    for the modern landscape of the internet.


    ##### Browser Warfare


    The history of JavaScript is bound up with the so-called browser war, a competition
    between Microsoft and Netscape to become the dominant web browser supplier to
    the world. Netscape was the early dominant force in the fledgling web browser
    market. It released its first browser in 1994 and rapidly took a majority of the
    browser market. It seemed poised to become the unquestioned leader of the industry.


    However, in 1995, Microsoft responded. Already a tech giant due to the popularity
    of Microsoft Windows, Microsoft’s founder Bill Gates intended to take over the
    browser market as well. The company launched Internet Explorer, a new browser,
    to compete with Netscape Navigator. It began including the software for free with
    Windows, the operating system that came with nearly all computers at the time.


