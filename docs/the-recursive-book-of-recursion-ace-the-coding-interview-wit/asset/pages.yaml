  md: "**158**   Chapter 7\n\nintegers returned by the fibonacci() function given\
    \ that argument. Every \n\nfunction call first checks if its nthNumber argument\
    \ is already in the cache. If \n\nso, the cached return value is returned 2. Otherwise,\
    \ the function runs as \n\nnormal (though it also adds the result to the cache\
    \ just before the function \n\nreturns 3 4.)\n\nThe memoized function is effectively\
    \ expanding the number of base \n\ncases in the Fibonacci algorithm. The original\
    \ base cases are only for \n\nthe first and second Fibonacci numbers: they immediately\
    \ return 1. But \n\nevery time a recursive case returns an integer, it becomes\
    \ a base case for \n\nall future fibonacci() calls with that argument. The result\
    \ is already in \n\nfibonacciCache and can be immediately returned. If you’ve\
    \ already called \n\nfibonacci(99) once before, it becomes a base case just like\
    \ fibonacci(1) and \n\nfibonacci(2). In other words, memoization improves the\
    \ performance of \n\nrecursive functions with overlapping subproblems by increasing\
    \ the number \n\nof base cases. Notice that the second time our program tries\
    \ to find the \n\n10th Fibonacci number 5, it immediately returns the memoized\
    \ result: 55.\n\nKeep in mind that while memoization can reduce the number of\
    \ \n\nredundant function calls a recursive algorithm makes, it doesn’t necessar­\n\
    \nily reduce the growth of frame objects on the call stack. Memoization won’t\
    \ \n\nprevent stack overflow errors. Once again, you may be better off foregoing\
    \ a \n\nrecursive algorithm for a more straightforward iterative one.\n\n**Python’s\
    \ functools Module**\n\nAdding a global variable for a cache and the code to manage\
    \ it for every \n\nfunction you’d like to memoize can be quite a chore. Python’s\
    \ standard \n\nlibrary has a functools module with a function decorator named\
    \ @lru\\_cache() \n\nthat automatically memoizes the function it decorates. In\
    \ Python syntax, \n\nthis means adding @lru\\_cache() to the line preceding the\
    \ function’s def \n\nstatement.\n\nThe cache can have a memory size limit set.\
    \ The *lru* in the decorator \n\nname stands for the *least recently used* cache\
    \ replacement policy, mean­\n\ning that the least recently used entry is replaced\
    \ with new entries when \n\nthe cache limit is reached. The LRU algorithm is simple\
    \ and fast, though \n\nother cache replacement policies are available for different\
    \ software \n\nrequirements.\n\nThe *fibonacciFunctools.py* program demonstrates\
    \ the use of the @lru\\_\n\ncache() decorator. The additions to the original *fibonacciByRecursion.py*\
    \ pro­\n\ngram from Chapter 2 have been marked in bold:\n\n*Python*\n\n**import\
    \ functools**\n\n**@functools.lru\\_cache()**\n\ndef fibonacci(nthNumber):\n\n\
    \ print('fibonacci(%s) called.' % (nthNumber))\n\n if nthNumber == 1 or nthNumber\
    \ == 2:\n\n # BASE CASE\n\n print('Call to fibonacci(%s) returning 1.' % (nthNumber))\n\
    \n return 1\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
