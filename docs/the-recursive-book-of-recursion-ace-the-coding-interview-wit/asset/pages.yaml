  md: "Recursion Vs. Iteration   **27**\n\n }\n\n return a;\n\n};\n\ndocument.write(fibonacci(10));\n\
    \n</script>\n\nWhen you run this code to calculate the 10th Fibonacci number,\
    \ the \n\noutput looks like this:\n\na = 1, b = 1\n\na = 1, b = 2\n\na = 2, b\
    \ = 3\n\n*\\--snip--*\n\na = 34, b = 55\n\n55\n\nThe program needs to track only\
    \ the latest two numbers of the \n\nsequence at a time. Since the first two numbers\
    \ in the Fibonacci sequence \n\nare defined as 1, we store 1 in variables a and\
    \ b 1. Inside the for loop, the \n\nnext number in the sequence is calculated\
    \ by adding a and b 2, which \n\nbecomes the next value of b, while a obtains\
    \ the previous value of b. By \n\nthe time the loop is finished, b contains the\
    \ *n*th Fibonacci number, so it is \n\nreturned.\n\n***The Recursive Fibonacci\
    \ Algorithm***\n\nCalculating Fibonacci numbers involves a recursive property.\
    \ For example, \n\nif you want to calculate the tenth Fibonacci number, you add\
    \ the ninth and \n\neighth Fibonacci numbers together. To calculate those Fibonacci\
    \ numbers, \n\nyou add the eighth and seventh, then the seventh and sixth Fibonacci\
    \ num­\n\nbers. A lot of repeat calculations occur: notice that adding the ninth\
    \ and \n\neighth Fibonacci numbers involves calculating the eighth Fibonacci number\
    \ \n\nagain. You continue this recursion until you reach the base case of the\
    \ first \n\nor second Fibonacci numbers, which are always 1.\n\nThe recursive\
    \ Fibonacci function is in this *fibonacciByRecursion.py* \n\nPython program:\n\
    \ndef fibonacci(nthNumber):\n\n print('fibonacci(%s) called.' % (nthNumber))\n\
    \n if nthNumber == 1 or nthNumber == 2: 1\n\n # BASE CASE\n\n print('Call to fibonacci(%s)\
    \ returning 1.' % (nthNumber))\n\n return 1\n\n else:\n\n # RECURSIVE CASE\n\n\
    \ print('Calling fibonacci(%s) and fibonacci(%s).' % (nthNumber - 1, nthNumber\
    \ - 2))\n\n result = fibonacci(nthNumber - 1) + fibonacci(nthNumber - 2)\n\n print('Call\
    \ to fibonacci(%s) returning %s.' % (nthNumber, result))\n\n return result\n\n\
    print(fibonacci(10))\n\nThe Recursive Book of Recursion (Early Access) © 2022\
    \ by Al Sweigart"
