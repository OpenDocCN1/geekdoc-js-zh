  md: "**134**   Chapter 6\n\n*\\--snip--*\n\nReturning \\['JJJJ', 'JJJP', 'JJJB',\
    \ 'JJJ1', 'JJJ2', 'JJJ3', \n\n'JJPJ', 'JJPP', 'JJPB', 'JJP1', 'JJP2', 'JJP3',\
    \ 'JJBJ', 'JJBP', \n\n'JJBB', 'JJB1', 'JJB2', 'JJB3', 'JJ1J', 'JJ1P', 'JJ1B',\
    \ 'JJ11', \n\n'JJ12', 'JJ13', 'JJ2J', 'JJ2P', 'JJ2B', 'JJ21', 'JJ22', 'JJ23',\
    \ \n\n'JJ3J', 'JJ3P', 'JJ3B', 'JJ31', 'JJ32', 'JJ33', 'JPJJ', \n\n*\\--snip--*\n\
    \nThe getPermsWithRep() function has a prefix string argument that begins \n\n\
    as a blank string by default. When the function is called, it first checks for\
    \ \n\nthe base case 1. If permLength, the length of the permutations, is 0, an\
    \ array \n\nwith prefix is returned.\n\nOtherwise, in the recursive case, for\
    \ each character in the chars argu­\n\nment the function creates a new prefix 2\
    \ to pass to the recursive getPerm­\n\nsWithRep() call. This recursive call passes\
    \ permLength - 1 for the permLength \n\nargument.\n\nThe permLength argument starts\
    \ at the length of the permutations and \n\ndecreases by one for each recursive\
    \ call 3. And the prefix argument starts \n\nas the blank string and increases\
    \ by one character for each recursive call. \n\nSo by the time the base case of\
    \ k == 0 is reached, the prefix string is the full \n\npermutation length of k.\n\
    \nFor example, let’s consider the case of calling getPermsWithRep('ABC', 2). \n\
    \nThe prefix argument defaults to the blank string. The function makes a \n\n\
    recursive call with each character of ABC concatenated to the blank prefix \n\n\
    string as the new prefix, making these three recursive calls:\n\n• \n\ngetPermsWithRep('ABC',\
    \ 1, 'A')\n\n• \n\ngetPermsWithRep('ABC', 1, 'B')\n\n• \n\ngetPermsWithRep('ABC',\
    \ 1, 'C')\n\nEach of these three calls will make its own three recursive calls,\
    \ but \n\npass 0 for permLength instead of 1. The base case occurs when permLength\
    \ == 0, \n\nso these return their prefixes. This is how all nine of the permutations\
    \ are \n\ngenerated. The getPermsWithRep() function generates permutations of\
    \ larger \n\nsets the same way.\n\n**Getting K-Combinations with Recursion**\n\
    \nRecall that order is not significant for combinations in the way it is for per­\n\
    \nmutations. Yet generating all *k*\\-combinations of a set is a bit tricky because\
    \ \n\nyou don’t want your algorithm to generate duplicates: if you create the\
    \ \n\nAB 2-combination from the set {A, B, C}, you don’t want to also create BA,\
    \ \n\nbecause it’s the same 2-combination as AB.\n\nTo figure out how we can write\
    \ recursive code to solve this problem, \n\nlet’s see how a tree can visually\
    \ describe generating all the *k*\\-combina­\n\ntions of a set. Figure 6-4 shows\
    \ a tree with all the combinations from the \n\nset {A, B, C, D}.\n\nThe Recursive\
    \ Book of Recursion (Early Access) © 2022 by Al Sweigart"
