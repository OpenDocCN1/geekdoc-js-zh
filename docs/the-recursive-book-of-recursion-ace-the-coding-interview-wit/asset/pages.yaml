  md: "File Finder    **213**\n\nThe name *unlink* is used instead of *delete* because\
    \ of the technical detail \n\nthat it removes the filename linked to the file.\
    \ But since most files have \n\nonly one linked filename, this unlinking also\
    \ deletes the file. It’s all right if \n\nyou don’t understand these filesystem\
    \ concepts; just know that os.unlink() \n\ndeletes a file.\n\nCalling os.unlink()\
    \ permanently deletes the file, which can be danger­\n\nous if a bug in your program\
    \ causes the function to delete the wrong file. \n\nInstead, you can use the send2trash\
    \ module’s send2trash() function to put the \n\nfile in your operating system’s\
    \ Recycle Bin. To install this module, run pip \n\ninstall --user send2trash from\
    \ the command prompt on Windows or run \n\npip3 install --user send2trash from\
    \ the terminal on macOS or Linux. Once \n\nthe module is installed, you’ll be\
    \ able to import it with import send2trash.\n\nEnter the following into the interactive\
    \ shell:\n\n*Python*\n\n\\> **open('deleteme.txt', 'w').close()** # Create a blank\
    \ file.\n\n\\> **import send2trash**\n\n\\> **send2trash.send2trash('deleteme.txt')**\n\
    \nThis example creates a blank file named *deleteme.txt*. After calling \n\n­send2trash.send2trash()\
    \ (the module and function share the same name), \n\nthis file is removed to the\
    \ Recycle Bin.\n\n**Summary**\n\nThis chapter’s file-search project uses recursion\
    \ to “walk” across the con­\n\ntents of a folder and all of its subfolders. The\
    \ file-finder program’s walk() \n\nfunction navigates these folders recursively,\
    \ applying custom search criteria \n\nto every file in every subfolder. The search\
    \ criteria is implemented as match \n\nfunctions, which are passed to the walk()\
    \ function. This allows us to change \n\nthe search criteria by writing new functions\
    \ instead of modifying the code \n\nin walk().\n\nOur project had two match functions,\
    \ for finding files with an even byte \n\nfile size or containing every vowel\
    \ in its name, but you can write your own \n\nfunctions to pass to walk(). This\
    \ is the power behind programming; you can \n\ncreate features for your own needs\
    \ that are not available in commercial apps.\n\n**Further Reading**\n\nThe documentation\
    \ for Python’s built-in os.walk() function (similar to the \n\nwalk() function\
    \ in the file-finder project) is at *https://docs.python.org/3/library/*\n\n*os.html#os.walk*.\
