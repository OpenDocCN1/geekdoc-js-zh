  md: "**9**\n\n**DR AW ING F R AC TA L S**\n\nCertainly, the most fun application\
    \ of \n\nrecursion is drawing fractals. *Fractals* are \n\nshapes that repeat\
    \ themselves, sometimes \n\nchaotically, at different scales. The term was \n\n\
    coined by the founder of fractal geometry, Benoit B. \n\nMandelbrot, in 1975 and\
    \ is derived from the Latin \n\n*fr**ā**ctus*, meaning broken or fractured, like\
    \ shattered \n\nglass. Fractals include many natural and artificial shapes. In\
    \ nature, you \n\nmight see them in the shapes of trees, fern leaves, mountain\
    \ ranges, light­\n\nning bolts, coastlines, river networks, and snowflakes. Mathematicians,\
    \ \n\nprogrammers, and artists can create elaborate geometric shapes based on\
    \ \n\na few recursive rules.\n\nRecursion can produce elaborate fractal art using\
    \ surprisingly few \n\nlines of code. This chapter covers Python’s built-in turtle\
    \ module for gen­\n\nerating several common fractals with code. To create turtle\
    \ graphics with \n\nJavaScript, you can use Greg Reimer’s jtg library. For simplicity,\
    \ this chapter \n\npresents only the Python fractal drawing programs and not the\
    \ JavaScript \n\nequivalents. However, the jtg JavaScript library is covered in\
    \ this chapter.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_200_0.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_200_1.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_200_2.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_200_3.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_200_4.png)\n\
