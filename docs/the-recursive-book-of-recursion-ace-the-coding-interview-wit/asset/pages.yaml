  md: "Droste Maker   **285**\n\nfrom PIL import Image\n\n \n\n \n\ndef makeDroste(baseImage,\
    \ stopAfter=10):\n\n # If baseImage is a string of an image filename, load that\
    \ image:\n\n if isinstance(baseImage, str):\n\n baseImage = Image.open(baseImage)\n\
    \n if stopAfter == 0:\n\n # BASE CASE\n\n return baseImage\n\n # The magenta color\
    \ has max red/blue/alpha, zero green:\n\n if baseImage.mode == 'RGBA':\n\n magentaColor\
    \ = (255, 0, 255, 255)\n\n elif baseImage.mode == 'RGB':\n\n magentaColor = (255,\
    \ 0, 255)\n\n # Find the dimensions of the base image and its magenta area:\n\n\
    \ baseImageWidth, baseImageHeight = baseImage.size\n\n magentaLeft = None\n\n\
    \ magentaRight = None\n\n magentaTop = None\n\n magentaBottom = None\n\n for x\
    \ in range(baseImageWidth):\n\n for y in range(baseImageHeight):\n\n if baseImage.getpixel((x,\
    \ y)) == magentaColor:\n\n if magentaLeft is None or x < magentaLeft:\n\n magentaLeft\
    \ = x\n\n if magentaRight is None or x > magentaRight:\n\n magentaRight = x\n\n\
    \ if magentaTop is None or y < magentaTop:\n\n magentaTop = y\n\n if magentaBottom\
    \ is None or y > magentaBottom:\n\n magentaBottom = y\n\n if magentaLeft is None:\n\
    \n # BASE CASE - No magenta pixels are in the image.\n\n return baseImage\n\n\
    \ # Get a resized version of the base image:\n\n magentaWidth = magentaRight -\
    \ magentaLeft + 1\n\n magentaHeight = magentaBottom - magentaTop + 1\n\n baseImageAspectRatio\
    \ = baseImageWidth / baseImageHeight\n\n magentaAspectRatio = magentaWidth / magentaHeight\n\
    \n if baseImageAspectRatio < magentaAspectRatio:\n\n # Make the resized width\
    \ match the width of the magenta area:\n\n widthRatio = magentaWidth / baseImageWidth\n\
    \n resizedImage = baseImage.resize((magentaWidth, \n\n int(baseImageHeight \\\
    * widthRatio) + 1), Image.NEAREST)\n\n else:\n\n # Make the resized height match\
    \ the height of the magenta area:\n\n heightRatio = magentaHeight / baseImageHeight\n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
