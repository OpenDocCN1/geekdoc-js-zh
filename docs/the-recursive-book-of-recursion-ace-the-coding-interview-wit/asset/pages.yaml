  md: "**118**   Chapter 5\n\nLookup 7 \\* 1 = 7\n\nLookup 7 \\* 2 = 14\n\nSolved\
    \ 07 \\* 11 = 77\n\nSolved 70 \\* 92 = 6440\n\nSolved 1357 \\* 2468 = 3349076\n\
    \n1357 \\* 2468 = 3349076\n\nThe first part of this program happens before karatsuba()\
    \ is called. Our \n\nprogram needs to create the multiplication lookup table in\
    \ the MULT\\_TABLE \n\nvariable 1. Normally, lookup tables are hardcoded directly\
    \ in the source \n\ncode, from MULT\\_TABLE\\[\\[0, 0\\]\\] = 0 to MULT\\_TABLE\\\
    [\\[9, 9\\]\\] = 81. But to reduce \n\nthe amount of typing, we’ll use nested\
    \ for loops to generate each product. \n\nAccessing MULT\\_TABLE\\[\\[m, n\\]\\\
    ] gives us the product of integers m and n.\n\nOur karatsuba() function also relies\
    \ on a helper function named padZe­\n\nros(), which pads a string of digits with\
    \ additional zeros on the left or right \n\nside of the string. This padding is\
    \ done in the fifth step of the Karatsuba \n\nalgorithm. For example, padZeros(\"\
    42\", 3, \"left\") returns the string 00042, \n\nwhile padZeros(\"99\", 1, \"\
    right\") returns the string 990.\n\nThe karatsuba() function itself first checks\
    \ for the base case, where x \n\nand y are single-digit numbers. These can be\
    \ multiplied using the lookup \n\ntable, and their product is immediately returned.\
    \ Everything else is a recur­\n\nsive case.\n\nWe need to convert the x and y\
    \ integers into strings and adjust them \n\nso that they contain the same number\
    \ of digits. If one of these numbers is \n\nshorter than the other, zeros are\
    \ padded to the left side. For example, if x is \n\n13 and y is 2468, our function\
    \ calls padZeros() so that x can be replaced with \n\n0013. This is required because\
    \ we then create the a, b, c, and d variables to \n\neach contain one-half of\
    \ the digits of x and y 2. The a and c variables must \n\nhave the same number\
    \ of digits for the Karatsuba algorithm to work, as do \n\nthe b and d variables.\n\
    \nNote that we use division and rounding down to calculate how much is \n\nhalf\
    \ of the digits of x 3. These mathematical operations are as complicated \n\n\
    as multiplication and might not be available to the low-level hardware we \n\n\
    are programming the Karatsuba algorithm for. In a real implementation, \n\nwe\
    \ could use another lookup table for these values: HALF\\_TABLE = \\[0, 0, 1,\
    \ 1, \n\n2, 2, 3, 3...\\], and so on. Looking up HALF\\_TABLE\\[n\\] would evaluate\
    \ to half \n\nof n, rounded down. An array of a mere 100 items would be sufficient\
    \ for \n\nall but the most astronomical numbers and save our program from division\
    \ \n\nand rounding. But our programs are for demonstration, so we’ll just use\
    \ the \n\n/ operator and built-in rounding functions.\n\nOnce these variables\
    \ are set up correctly, we can begin making the \n\nrecursive function calls 4.\
    \ The first three steps involve recursive calls with \n\narguments a and b, c\
    \ and d, and finally a + b and c + d. The fourth step sub­\n\ntracts the results\
    \ of the first three steps from each other 5. The fifth step \n\npads the results\
    \ of the first and fourth steps with zeros on the right side, \n\nthen adds them\
    \ to the results of the second step 6.\n\nThe Recursive Book of Recursion (Early\
    \ Access) © 2022 by Al Sweigart"
