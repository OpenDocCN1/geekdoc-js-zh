  md: "**154**   Chapter 7\n\nhas been called once, twice, or a million times before.\
    \ A function might \n\nmodify local variables inside the function, but these changes\
    \ are local to \n\nthe function and remain isolated from the rest of the program.\n\
    \nNow consider an addToTotal() function, which adds the numeric argu­\n\nment\
    \ to a global variable named TOTAL:\n\n*Python*\n\n\\> **TOTAL = 0**\n\n\\> **def\
    \ addToTotal(amount):**\n\n... **global TOTAL**\n\n... **TOTAL += amount**\n\n\
    ... **return TOTAL**\n\n...\n\n\\> **addToTotal(10)**\n\n10\n\n\\> **addToTotal(10)**\n\
    \n20\n\n\\> **TOTAL**\n\n20\n\nThe addToTotal() function does have a side effect,\
    \ because it modifies an \n\nelement that exists outside of the function: the\
    \ TOTAL global variable. \n\nSide effects can be more than mere changes to global\
    \ variables. They \n\ninclude updating or deleting files, printing text onscreen,\
    \ opening a data­\n\nbase connection, authenticating to a server, or any other\
    \ manipulation of \n\ndata outside the function. Any trace that a function call\
    \ leaves behind after \n\nreturning is a side effect.\n\nIf a function is both\
    \ deterministic and has no side effects, it’s known as \n\na *pure function*.\
    \ Only pure functions should be memoized. You’ll see why in \n\nthe next sections\
    \ when we memoize the recursive Fibonacci function and \n\nthe impure functions\
    \ of the doNotMemoize program.\n\n***Memoizing the Recursive Fibonacci Algorithm***\n\
    \nLet’s memoize our recursive Fibonacci function from Chapter 2. Remember \n\n\
    that this function is extraordinarily inefficient: on my computer, the recur­\n\
    \nsive fibonacci(40) call takes 57.8 seconds to compute. Meanwhile, an iterative\
    \ \n\nversion of fibonacci(40) is literally too fast for my code profiler to measure:\
    \ \n\n0.000 seconds. \n\nMemoization can greatly speed up the recursive version\
    \ of the func­\n\ntion. For example, Figure 7-2 shows the number of function calls\
    \ the origi­\n\nnal and memoized fibonacci() function makes for the first 20 Fibonacci\
    \ \n\nnumbers. The original, non-memoized function is doing an extraordinary \n\
    \namount of unnecessary computation.\n\nThe number of function calls sharply increases\
    \ for the original fibonacci() \n\nfunction (left) but only slowly grows for the\
    \ memoized fibonacci() function \n\n(right).\n\nThe Recursive Book of Recursion\
    \ (Early Access) © 2022 by Al Sweigart"
