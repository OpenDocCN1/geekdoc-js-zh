  md: "Introduction   **xxi**\n\nbeginner programmers or freshman computer science\
    \ students. Most recur­\n\nsion lessons are hard to follow and make the subject\
    \ seem frustrating, even \n\nfearsome. For these readers, I hope that this book’s\
    \ direct explanations and \n\nample examples can help make the topic finally click.\n\
    \nThe only prerequisite for this book is basic programming experience \n\nwith\
    \ either the Python or JavaScript programming languages, which the \n\nchapters’\
    \ code examples use. The book’s programs have been stripped \n\ndown to their\
    \ essences; if you know how to call and create functions and \n\nthe difference\
    \ between global and local variables, you know enough to work \n\nthrough the\
    \ programming examples.\n\n**About This Book**\n\nThis book has 14 chapters:\n\
    \n**Introduction   ** Covers how to set up Python and JavaScript on your com­\n\
    \nputer to follow along with the code examples in the rest of the book.\n\n**Part 1:\
    \ Understanding Recursion**\n\n**Chapter 1: What Is Recursion?   ** Explains recursion\
    \ and how it is the \n\nnatural result of the way programming languages implement\
    \ functions \n\nand function calls. This chapter also argues that recursion isn’t\
    \ nearly \n\nthe elegant, mystical concept many claim it is.\n\n**Chapter 2: Recursion\
    \ vs. Iteration   ** Dives into the differences (and \n\nmany similarities) between\
    \ recursive and iterative techniques.\n\n**Chapter 3: Classic Recursion Algorithms \
    \  ** Covers famous recursive \n\nprograms such as the Tower of Hanoi, the flood\
    \ fill algorithm, and \n\nothers.\n\n**Chapter 4: Backtracking and Tree Traversal\
    \ Algorithms   ** Discusses a \n\nproblem for which recursion is particularly\
    \ suited: traversing tree data \n\nstructures, such as when solving mazes and\
    \ navigating a directory.\n\n**Chapter 5: Divide-and-Conquer Algorithms   ** Discusses\
    \ how recursion \n\nis useful for splitting large problems into smaller subproblems\
    \ and cov­\n\ners several common divide-and-conquer algorithms.\n\n**Chapter 6:\
    \ Permutations and Combinations   ** Covers recursive algo­\n\nrithms involving\
    \ ordering and matching, as well as the common pro­\n\ngramming problems to which\
    \ these techniques are applied.\n\n**Chapter 7: Memoization and Dynamic Programming \
    \  ** Explains some \n\nsimple tricks to improve code efficiency when applying\
    \ recursion in the \n\nreal world.\n\n**Chapter 8: Tail Call Optimization   **\
    \ Covers tail call optimization, a \n\ncommon technique used to improve the performance\
    \ of recursive algo­\n\nrithms, and how it works.\n\n**Chapter 9: Drawing Fractals \
    \  ** Tours the intriguing art that can be pro­\n\ngrammatically produced by recursive\
    \ algorithms. This chapter makes \n\nuse of turtle graphics for generating its\
    \ images.\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
