  md: "**10**   Chapter 1\n\nFrame objects are created and pushed onto the stack when\
    \ a function \n\nis called. When the function returns, that frame object is popped\
    \ off the \n\nstack. If we call a function that calls a function that calls a\
    \ function, the call \n\nstack will have three frame objects on the stack. When\
    \ all of these functions \n\nreturn, the call stack will have zero frame objects\
    \ on the stack.\n\nProgrammers don’t have to write code dealing with frame objects,\
    \ since \n\nthe programming language handles them automatically. Different pro­\n\
    \ngramming languages have different ways of implementing frame objects, \n\nbut\
    \ in general they contain the following:\n\n• \n\nThe return address, or the spot\
    \ in the program where the execution \n\nshould move when the function returns\n\
    \n• \n\nThe arguments passed to the function call\n\n• \n\nA set of local variables\
    \ created during the function call\n\nFor example, take a look at the following\
    \ *localVariables.py* program, \n\nwhich has three functions, just as our previous\
    \ *functionCalls.py* and *function­*\n\n*Calls.html* programs did:\n\n*Python*\n\
    \ndef a():\n\n 1 spam = 'Ant'\n\n 2 print('spam is ' + spam)\n\n 3 b()\n\n print('spam\
    \ is ' + spam)\n\ndef b():\n\n 4 spam = 'Bobcat'\n\n print('spam is ' + spam)\n\
    \n 5 c()\n\n print('spam is ' + spam)\n\ndef c():\n\n 6 spam = 'Coyote'\n\n print('spam\
    \ is ' + spam)\n\n7 a()\n\nThis *localVariables.html* is the equivalent JavaScript\
    \ program:\n\n*JavaScript*\n\n<script type=\"text/javascript\">\n\nfunction a()\
    \ {\n\n 1 let spam = \"Ant\";\n\n 2 document.write(\"spam is \" + spam + \"<br\
    \ />\");\n\n 3 b();\n\n document.write(\"spam is \" + spam + \"<br />\");\n\n\
    }\n\nfunction b() {\n\n 4 let spam = \"Bobcat\";\n\n document.write(\"spam is\
    \ \" + spam + \"<br />\");\n\n 5 c();\n\n document.write(\"spam is \" + spam +\
    \ \"<br />\");\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al\
    \ Sweigart"
