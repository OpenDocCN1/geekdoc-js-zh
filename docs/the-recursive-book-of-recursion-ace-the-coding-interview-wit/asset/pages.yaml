  md: "Recursion Vs. Iteration   **41**\n\nSearching for a specific filename in a\
    \ folder is a recursive problem: you \n\nsearch the folder and then recursively\
    \ search the folder’s subfolders. Folders \n\nwith no subfolders are the base\
    \ cases that cause the recursive searching to \n\nstop. If your recursive algorithm\
    \ doesn’t find the filename it’s looking for, it \n\nbacktracks to a previous\
    \ parent folder and continues searching from there.\n\nThe third point is a matter\
    \ of practicality. If your tree structure has so \n\nmany levels of branches that\
    \ a recursive function would cause a stack over­\n\nflow before it can reach the\
    \ leaves, then recursion isn’t a suitable solution.\n\nOn the other hand, recursion\
    \ is the best approach for creating pro­\n\ngramming language compilers. Compiler\
    \ design is its own expansive sub­\n\nject and beyond the scope of this book.\
    \ But programming languages have \n\na set of grammar rules that can break source\
    \ code into a tree structure \n\nsimilar to the way grammar rules can break English\
    \ sentences into a tree \n\ndiagram. Recursion is an ideal technique to apply\
    \ to compilers.\n\nWe’ll identify many recursive algorithms in this book, and\
    \ they often \n\nhave the tree-like structure or backtracking features that lend\
    \ themselves to \n\nrecursion well.\n\n**Coming Up with Recursive Algorithms**\n\
    \nHopefully, this chapter has given you a firm idea of how recursive functions\
    \ \n\ncompare to the iterative algorithms you’re likely more familiar with. The\
    \ \n\nrest of this book dives into the details of various recursive algorithms.\
    \ But \n\nhow should you go about writing your own recursive functions?\n\nThe\
    \ first step is always identifying the recursive case and the base case. \n\n\
    You can take a top-down approach by breaking the problem into subprob­\n\nlems\
    \ that are similar to the original problem but smaller; this is your *recur­*\n\
    \n*sive case*. Then consider when the subproblems are small enough to have a \n\
    \ntrivial answer; this is your *base case*. Your recursive function may have more\
    \ \n\nthan one recursive case or base case, but all recursive functions will always\
    \ \n\nhave at least one recursive case and at least one base case.\n\nThe recursive\
    \ Fibonacci algorithm is an example. A Fibonacci num­\n\nber is the sum of the\
    \ previous two Fibonacci numbers. We can break the \n\nproblem of finding a Fibonacci\
    \ number into the subproblems of finding \n\ntwo smaller Fibonacci numbers. We\
    \ know the first two Fibonacci numbers \n\nare both 1, so that provides the base\
    \ case answer once the subproblems are \n\nsmall enough.\n\nSometimes it helps\
    \ to take a bottom-up approach and consider the base \n\ncase first, and then\
    \ see how larger and larger problems are constructed \n\nand solved from there.\
    \ The recursive factorial problem is an example. The \n\nfactorial of 1! is 1.\
    \ This forms the base case. The next factorial is 2!, and \n\nyou create it by\
    \ multiplying 1! by 2. The factorial after that, 3!, is created by \n\nmultiplying\
    \ 2! by 3, and so on. From this general pattern, we can figure out \n\nwhat the\
    \ recursive case for our algorithm will be.\n\nThe Recursive Book of Recursion\
    \ (Early Access) © 2022 by Al Sweigart"
