  md: "**76**   Chapter 4\n\n preorderTraverse(node\\[\"children\"\\]\\[i\\]); //\
    \ Traverse child nodes.\n\n }\n\n }\n\n // BASE CASE\n\n 2 return;\n\n}\n\npreorderTraverse(root);\n\
    \n</script>\n\nThe output of these programs is the node data in preorder order:\n\
    \nA B D C E G H F\n\nWhen you look at the tree in Figure 4-1, notice that preorder\
    \ traversal \n\norder displays the data in left nodes before right nodes, and\
    \ bottom nodes \n\nbefore top nodes.\n\nAll tree traversals begin by passing the\
    \ root node to the recursive func­\n\ntion. The function makes a recursive call\
    \ and passes each of the root node’s \n\nchildren as the argument. Since these\
    \ child nodes have children of their \n\nown, the traversal continues until a\
    \ leaf node with no children is reached. \n\nAt this point, the function call\
    \ simply returns.\n\nThe recursive case occurs if the node has any child nodes 1,\
    \ in which \n\ncase a recursive call is made with each of the children as the\
    \ node argu­\n\nment. Whether or not the node has children, the base case always\
