    \ \\`board\\`\n\n // until it finds a solution or reaches the \\`maxMoves\\` limit.\n\
    \n // Returns true if a solution was found, in which case \\`movesMade\\`\n\n\
    \ // contains the series of moves to solve the puzzle. Returns false\n\n // if\
    \ \\`movesRemaining\\` is less than 0.\n\n if (movesRemaining < 0) {\n\n // BASE\
    \ CASE - Ran out of moves.\n\n return false;\n\n }\n\n if (JSON.stringify(board)\
    \ == SOLVED\\_BOARD) {\n\n // BASE CASE - Solved the puzzle.\n\n return true;\n\
    \n }\n\nThe attemptMove() function has four parameters. The board parameter \n\
    \ncontains a tile puzzle board data structure to solve. The movesMade parameter\
    \ \n\ncontains a list or array that attemptMove() modifies in place, adding the\
    \ UP, \n\nDOWN, LEFT, and RIGHT values that the recursive algorithm has made.\
    \ If attempt­\n\nMove() solves the puzzle, movesMade will contain the moves that\
    \ led to the solu­\n\ntion. This list or array is also what the solutionMoves\
    \ variable in the solve() \n\nfunction refers to.\n\nThe solve() function uses\
    \ its maxMoves variable as the movesRemaining \n\nparameter in the initial call\
    \ to attemptMove(). Each recursive call passes max­\n\nMoves - 1 for the next\
    \ value of maxMoves, causing it to decrease as more recur­\n\nsive calls are made.\
    \ When it becomes less than 0, the attemptMove() function \n\nstops making additional\
    \ recursive calls and returns False.\n\nFinally, the prevMove parameter contains\
    \ the UP, DOWN, LEFT, or RIGHT \n\nvalue that the previous call to attemptMove()\
    \ made so that it doesn’t undo \n\nthat move. For the initial call to attemptMove(),\
    \ the solve() function passes \n\nPython’s None or JavaScript’s null value for\
    \ this parameter, since no previous \n\nmove exists.\n\nThe beginning of the attemptMove()\
    \ code checks for two base cases, \n\nreturning False if movesRemaining has become\
    \ less than 0, and returning True \n\nif board is in the solved state. The SOLVED\\\
    _BOARD constant contains a board in \n\nthe solved state that we can compare to\
    \ the data structure in board.\n\nThe next part of attemptMove() performs each\
    \ of the valid moves it can \n\ndo on this board. The Python code is as follows:\n\
    \n*Python*\n\n # RECURSIVE CASE - Attempt each of the valid moves:\n\n for move\
    \ in getValidMoves(board, prevMove):\n\n # Make the move:\n\n makeMove(board,\
    \ move)\n\n movesMade.append(move)\n\n if attemptMove(board, movesMade, movesRemaining\
    \ - 1, move):\n\n # If the puzzle is solved, return True:\n\nThe Recursive Book\
    \ of Recursion (Early Access) © 2022 by Al Sweigart"
