    ...2nd base case. Returning \\['(())'\\]\n\n..2nd base case. Returning \\['(())'\\\
    ]\n\n.Adding close parenthesis.\n\n..Start of pairs=2, openRem=1, closeRem=1,\
    \ current=\"()\"\n\n..Adding open parenthesis.\n\n...Start of pairs=2, openRem=0,\
