    \ shortest()\n\n File \"shortest.py\", line 2, in shortest\n\n shortest()\n\n\
    \ File \"shortest.py\", line 2, in shortest\n\n shortest()\n\n \\[Previous line\
    \ repeated 996 more times\\]\n\nRecursionError: maximum recursion depth exceeded\n\
    \nThe JavaScript output of *shortest.html* looks like this in the Google \n\n\
    Chrome web browser (other browsers will have similar error messages):\n\nUncaught\
    \ RangeError: Maximum call stack size exceeded\n\n at shortest (shortest.html:2)\n\
    \n at shortest (shortest.html:3)\n\n at shortest (shortest.html:3)\n\n at shortest\
    \ (shortest.html:3)\n\n at shortest (shortest.html:3)\n\n at shortest (shortest.html:3)\n\
    \n at shortest (shortest.html:3)\n\n at shortest (shortest.html:3)\n\n at shortest\
    \ (shortest.html:3)\n\n at shortest (shortest.html:3)\n\nThis kind of bug is called\
    \ a *stack overflow*. (This is where the popular web­\n\nsite *https://stackoverflow.com*\
    \ gets its name.) The constant function calls with no \n\nreturns grows the call\
    \ stack until it uses up all of the computer’s memory allo­\n\ncated for the call\
    \ stack. To prevent this, the Python and JavaScript interpret­\n\ners crash the\
    \ program after a certain limit of function calls that don’t return. \n\nThis\
    \ limit is called the *maximum recursion depth *or *maximum call stack size*.\
    \ \n\nFor Python, this is set to 1,000 function calls. For JavaScript, the maximum\
    \ call \n\nstack size depends on the browser running the code but is generally\
    \ at least \n\n1,000 as well. Think of a stack overflow as happening when the\
    \ call stack gets \n\n“too high” (that is, consumes too much computer memory),\
    \ as in Figure 1-8.\n\nSTACK TOO HIGH\n\n!\n\nb()\n\nspam =\n\n'Bobcat′\n\nc()\n\
    \nspam =\n\n'Coyote′\n\n*Figure 1-8: A stack overflow happens when *\n\n*the call\
    \ stack becomes too high, with too many *\n\n*frame objects taking up the computer’s\
    \ memory.*\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
