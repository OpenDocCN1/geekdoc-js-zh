  md: "**290**   Chapter 14\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_315_0.png)\n\
    \n*Figure 14-4: The base image with the magenta area in the monitor (top), the\
    \ resized *\n\n*image over the base image (middle), and the final recursive image\
    \ that replaces only the *\n\n*magenta pixels (bottom)*\n\nWe cannot simply resize\
    \ the base image to the dimensions of the \n\nmagenta area because it’s unlikely\
    \ the two share the same *aspect ratio*, or \n\nproportion of the width divided\
    \ by the height. Doing so results in a recur­\n\nsive image that looks stretched\
    \ or squished, like Figure 14-5.\n\nInstead, we must make the resized image large\
    \ enough to completely \n\ncover the magenta area but still retain the image’s\
    \ original aspect ratio. \n\nThis means either setting the width of the resized\
    \ image to the width of the \n\nmagenta area such that the height of the resized\
    \ image is equal to or larger \n\nthan the height of the magenta area, or setting\
    \ the height of the resized \n\nimage to the height of the magenta area such that\
    \ the width of the resized \n\nimage is equal to or larger than the width of the\
    \ magenta area.\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al\
    \ Sweigart"
