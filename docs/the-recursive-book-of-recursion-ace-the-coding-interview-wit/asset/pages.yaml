  md: "**42**   Chapter 2\n\n**Summary**\n\nIn this chapter, we covered calculating\
    \ factorials and the Fibonacci \n\nsequence, two classic recursive programming\
    \ problems. This chapter fea­\n\ntured both iterative and recursive implementations\
    \ for these algorithms. \n\nDespite being classic examples of recursion, their\
    \ recursive algorithms suf­\n\nfer from critical flaws. The recursive factorial\
    \ function can cause stack over­\n\nflows, while the recursive Fibonacci function\
    \ performs so many redundant \n\ncalculations that it’s far too slow to be effective\
    \ in the real world.\n\nWe explored how to create recursive algorithms from iterative\
    \ algo­\n\nrithms and how to create iterative algorithms from recursive algorithms.\
    \ \n\nIterative algorithms use a loop, and any recursive algorithm can be per­\n\
    \nformed iteratively by using a loop and a stack data structure. Recursion \n\n\
    is often an overly complicated solution, but programming problems that \n\ninvolve\
    \ a tree-like structure and backtracking are particularly suitable for \n\nrecursive\
    \ implementations.\n\nWriting recursive functions is a skill that improves with\
    \ practice and \n\nexperience. The rest of this book covers several well-known\
    \ recursion exam­\n\nples and explores their strengths and limitations.\n\n**Further\
    \ Reading**\n\nYou can find more information about comparing iteration and recursion\
    \ \n\nin the Computerphile YouTube channel’s video “Programming Loops vs. \n\n\
    Recursion” at *https://youtu.be/HXNhEYqFo0o*. If you want to compare the \n\n\
    performance of iterative and recursive functions, you need to learn how \n\nto\
    \ use a profiler. Python profilers are explained in Chapter 13 of my book \n\n\
    *Beyond the Basic Stuff with Python* (No Starch Press, 2020), which can be read\
    \ \n\nat *https://inventwithpython.com/beyond/chapter13.html*. The official Python\
    \ \n\ndocumentation also covers profilers at *https://docs.python.org/3/library/profile.*\n\
    \n*html*. The Firefox profiler for JavaScript is explained on Mozilla’s website\
    \ at \n\n*https://developer.mozilla.org/en-US/docs/Tools/Performance*. Other browsers\
    \ have \n\nprofilers similar to Firefox’s.\n\n**Practice Questions**\n\nTest your\
    \ comprehension by answering the following questions:\n\n 1. What is 4! (that\
    \ is, the factorial of 4)?\n\n 2. How can you use the factorial of (*n* – 1) to\
    \ calculate the factorial of *n*?\n\n 3. What is the critical weakness of the\
    \ recursive factorial function?\n\n 4. What are the first five numbers of the\
    \ Fibonacci sequence?\n\n 5. What two numbers do you add to get the *n*th Fibonacci\
    \ number?\n\n 6. What is the critical weakness of the recursive Fibonacci function?\n\
    \n 7. What does an iterative algorithm always use?\n\n 8. Is it always possible\
    \ to convert an iterative algorithm into a recursive one?\n\nThe Recursive Book\
    \ of Recursion (Early Access) © 2022 by Al Sweigart"
