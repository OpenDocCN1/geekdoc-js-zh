  md: "**126**   Chapter 6\n\nTable 6-2: Calculating the Number of Possible Permutations\
    \ and Combinations, with \n\nand without Repetition, of a Set of *n* Elements\n\
    \nPermutations\n\nCombinations\n\nWithout repetition\n\n*n*!\n\n2^n\n\nWith repetition\n\
    \n*n*^(*n*)\n\n2*n* choose *n*, or\n\n(2*n*)! / (*n*!)²\n\nNote that permutations\
    \ without repetition are always the same size as the \n\nset. For example, the\
    \ permutations of {A, B, C} are always three letters long: \n\nABC, ACB, BAC,\
    \ and so forth. However, permutations with repetition can be of \n\nany length.\
    \ Table 6-1 shows the three-letter permutations of {A, B, C} ranging \n\nfrom\
    \ AAA to CCC, but you could also, for example, have five-letter permuta­\n\ntions\
    \ with repetition ranging from AAAAA to CCCCC. The number of per­\n\nmutations\
    \ with repetition of *n* elements that are *k* elements long is *n*^(*k*). Table 6-2\
    \ \n\nlists it as *n*^(*n*) for permutations with repetition that are also *n*\
    \ elements long.\n\nOrdering matters for permutations, but not combinations. While\
    \ AAB, \n\nABA, and BAA are considered the same combination with repetition, they\
    \ \n\nare considered three separate permutations with repetition.\n\n**Finding\
    \ All Permutations Without Repetition: **\n\n**A Wedding Seating Chart**\n\nImagine\
    \ you must arrange the seating chart for a wedding reception with \n\ndelicate\
    \ social requirements. Some of the guests hate each other, while \n\nothers demand\
    \ to sit near an influential guest. The seats at the rectangu­\n\nlar table form\
    \ one long, straight row, rather than a circle. It’d be helpful \n\nfor your planning\
    \ to see every possible ordering of guests—that is, every \n\npermutation without\
    \ repetition of the set of guests. No repetition occurs, \n\nbecause each guest\
    \ appears in the seating chart only once. \n\nLet’s use a simple example of Alice,\
    \ Bob, and Carol, or {A, B, C}. \n\nFigure 6-2 shows all six possible permutations\
    \ of these three wedding guests.\n\nOne way we can determine the number of permutations\
    \ without repeti­\n\ntion is with a head-tail recursive strategy. We select one\
    \ element from the \n\nset as the head. We then get every permutation of the rest\
    \ of the elements \n\n(which constitute the tail), and for each permutation we\
    \ place the head in \n\nevery possible location in the permutation. \n\nIn our\
    \ ABC example, we’ll start with Alice (A) as the head and Bob and \n\nCarol (BC)\
    \ as the tail. The permutations of {B, C} are BC and CB. (How we \n\ngot BC and\
    \ CB is explained in the next paragraph, so just put that question \n\naside for\
    \ now.) We’ll put A in every possible location in BC. That is, we put \n\nAlice\
    \ before Bob (ABC), in between Bob and Carol (BAC), and after Carol \n\n(BCA).\
    \ This creates the permutations ABC, BAC, and BCA. We also put A \n\nin every\
    \ possible position in CB, creating ACB, CAB, and CBA. This creates \n\nall six\
    \ permutations of Alice, Bob, and Carol sitting at the reception table. \n\nNow\
    \ we can pick the arrangement that results in the fewest fights (or the \n\nmost\
    \ fights, if you want a memorable wedding reception).\n\nThe Recursive Book of\
    \ Recursion (Early Access) © 2022 by Al Sweigart"
