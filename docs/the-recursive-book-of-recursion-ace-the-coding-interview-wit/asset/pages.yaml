    \n**When Do You Need to Use Recursion?**\n\nYou never *need* to use recursion.\
    \ No programming problem *requires* recur­\n\nsion. This chapter has shown that\
    \ recursion has no magical power to do \n\nthings that iterative code in a loop\
    \ with a stack data structure cannot do. \n\nIn fact, a recursive function might\
    \ be an overcomplicated solution for what \n\nyou’re trying to achieve.\n\nHowever,\
    \ as the exponent functions we created in the previous section \n\nshow, recursion\
    \ can provide new insights into how to think about our pro­\n\ngramming problem.\
    \ Three features of a programming problem, when pres­\n\nent, make it especially\
    \ suitable to a recursive approach:\n\n• \n\nIt involves a tree-like structure.\n\
    \n• \n\nIt involves backtracking.\n\n• \n\nIt isn’t so deeply recursive as to\
    \ potentially cause a stack overflow.\n\nA tree has a *self-similar* structure:\
    \ the branching points look similar to \n\nthe root of a smaller subtree. Recursion\
    \ often deals with self-similarity and \n\nproblems that can be divided into smaller,\
    \ similar subproblems. The root of \n\nThe Recursive Book of Recursion (Early\
    \ Access) © 2022 by Al Sweigart"
