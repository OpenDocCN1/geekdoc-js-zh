  md: "**270**   Chapter 13\n\nA fifth parameter, depth, is handled by drawFractal()’s\
    \ recursive call to itself \n\nand defaults to 0. You don’t need to specify it\
    \ when you call drawFractal().\n\n***Setting Up the Function***\n\nThe first thing\
    \ the drawFractal() function does is check for its two base \n\ncases:\n\n*Python*\n\
    \ndef drawFractal(shapeDrawFunction, size, specs, maxDepth=8, depth=0):\n\n if\
    \ depth > maxDepth or size < 1:\n\n return # BASE CASE\n\nIf depth is greater\
    \ than maxDepth, the function will stop the recursion and \n\nreturn. The other\
    \ base case occurs if size is less than 1, at which point the \n\nshapes being\
    \ drawn would be too small to be seen on the screen and so the \n\nfunction should\
    \ simply return.\n\nWe keep track of the turtle’s original position and heading\
    \ in three \n\nvariables: initialX, initialY, and initialHeading. This way, no\
    \ matter where \n\nthe shape-drawing function leaves the turtle positioned or\
    \ what direction \n\nit is headed, drawFractal() can revert the turtle back to\
    \ the original position \n\nand heading for the next recursive call:\n\n*Python*\n\
    \n # Save the position and heading at the start of this function call:\n\n initialX\
    \ = turtle.xcor()\n\n initialY = turtle.ycor()\n\n initialHeading = turtle.heading()\n\
    \nThe turtle.xcor() and turtle.ycor() functions return the absolute x- and \n\n\
    y-coordinates of the turtle on the screen. The turtle.heading() function \n\n\
    returns the direction in which the turtle is pointed in degrees.\n\nThe next few\
    \ lines call the shape-drawing function passed to the shape­\n\nDrawFunction parameter:\n\
    \n*Python*\n\n # Call the draw function to draw the shape:\n\n turtle.pendown()\n\
    \n shapeDrawFunction(size, depth)\n\n turtle.penup()\n\nBecause the value passed\
    \ as the argument for the shapeDrawFunction \n\nparameter is a function, the code\
    \ shapeDrawFunction(size, depth) calls this \n\nfunction with the values in size\
    \ and depth. The pen is lowered before and \n\nraised after the shapeDrawFunction()\
    \ call to ensure that the shape-drawing \n\nfunction can consistently expect the\
    \ pen to be down when the drawing \n\nbegins.\n\n***Using the Specifications Dictionary***\n\
    \nAfter the call to shapeDrawFunction(), the rest of drawFractal()’s code is \n\
    \ndevoted to making recursive calls to drawFractal() based on the specification\
    \ \n\nin the specs list’s dictionaries. For each dictionary, drawFractal() makes\
    \ one \n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
