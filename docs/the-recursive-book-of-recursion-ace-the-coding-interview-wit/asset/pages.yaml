  md: "**5**\n\n**DI V IDE-A N D - CONQ U E R **\n\n**A L GOR I T H M S**\n\n*Divide-and-conquer\
    \ algorithms *are those that \n\nsplit large problems into smaller subprob­\n\n\
    lems, then divide those subproblems into \n\nsmaller subproblems yet, until they\
    \ become \n\ntrivial to conquer. This approach makes recursion an \n\nideal technique\
    \ to use: the recursive case divides the \n\nproblem into self-similar subproblems,\
    \ and the base \n\ncase occurs when the subproblem has been reduced \n\nto a trivial\
    \ size. One benefit of this approach is that \n\nthese problems can be worked\
    \ on in parallel, allowing multiple central \n\nprocessing unit (CPU) cores or\
    \ computers to work on them.\n\nIn this chapter, we’ll look at some common algorithms\
    \ that use recur­\n\nsion to divide and conquer, such as binary search, quicksort,\
    \ and merge \n\nsort. We’ll also reexamine summing an array of integers, this\
    \ time with a \n\ndivide-and-conquer approach. Finally, we’ll take a look at the\
    \ more esoteric \n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_118_0.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_118_1.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_118_2.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_118_3.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_118_4.png)\n\
