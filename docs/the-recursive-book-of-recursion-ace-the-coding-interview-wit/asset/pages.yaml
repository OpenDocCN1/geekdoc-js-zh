  md: "Fractal Art Maker   **273**\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_298_0.png)\n\
    \n*Figure 13-9: The Four Corners fractal with the first dictionary removed from\
    \ the **specs** list*\n\n***Applying the Specifications ***\n\nLet’s look at how\
    \ the code in drawFractal() actually does everything we’ve \n\ndescribed:\n\n\
    *Python*\n\n # RECURSIVE CASE\n\n for spec in specs:\n\n # Each dictionary in\
    \ specs has keys 'sizeChange', 'xChange',\n\n # 'yChange', and 'angleChange'.\
    \ The size, x, and y changes\n\n # are multiplied by the size parameter. The x\
    \ change and y\n\n # change are added to the turtle's current position. The angle\n\
    \n # change is added to the turtle's current heading.\n\n sizeCh = spec.get('sizeChange',\
    \ 1.0)\n\n xCh = spec.get('xChange', 0.0)\n\n yCh = spec.get('yChange', 0.0)\n\
    \n angleCh = spec.get('angleChange', 0.0)\n\nThe for loop assigns an individual\
    \ specification dictionary in the specs \n\nlist to the loop variable spec on\
    \ each iteration of the loop. The get() dic­\n\ntionary method calls pull the\
    \ values for the sizeChange, xChange, yChange, and \n\nangleChange keys from this\
    \ dictionary and assign them to the shorter-named \n\nsizeCh, xCh, yCh, and angleCh\
    \ variables. The get() method substitutes a default \n\nvalue if the key doesn’t\
    \ exist in the dictionary.\n\nNext, the turtle’s position and heading are reset\
    \ to the values indicated \n\nwhen drawFractal() was first called. This ensures\
    \ that the recursive calls \n\nThe Recursive Book of Recursion (Early Access)\
    \ © 2022 by Al Sweigart"
  merge: -1
  pgno: 298
- img_proc: true
  md: "**274**   Chapter 13\n\nfrom previous loop iterations don’t leave the turtle\
    \ in some other place. \n\nThen the heading and position are changed according\
    \ to the angleCh, xCh, \n\nand yCh variables:\n\n*Python*\n\n # Reset the turtle\
    \ to the shape's starting point:\n\n turtle.goto(initialX, initialY)\n\n turtle.setheading(initialHeading\
    \ + angleCh)\n\n turtle.forward(size \\* xCh)\n\n turtle.left(90)\n\n turtle.forward(size\
    \ \\* yCh)\n\n turtle.right(90)\n\nThe x-change and y-change positions are expressed\
    \ relative to the tur­\n\ntle’s current heading. If the turtle’s heading is 0,\
    \ the turtle’s relative x-axis \n\nis the same as the actual x-axis on the screen.\
    \ However, if the turtle’s head­\n\ning is, say, 45, the turtle’s relative x-axis\
    \ is at a 45-degree tilt. Moving “right” \n\nalong the turtle’s relative x-axis\
    \ would then move at an up-right angle. \n\nThis is why moving forward by size\
    \ \\* xCh moves the turtle along its rela­\n\ntive x-axis. If xCh is negative,\
    \ turtle.forward() moves left along the turtle’s \n\nrelative x-axis. The turtle.left(90)\
    \ call points the turtle along the turtle’s \n\nrelative y-axis, and turtle.forward(size\
    \ \\* yCh) moves the turtle to the next \n\nshape’s starting position. However,\
    \ the turtle.left(90) call changed the \n\nturtle’s heading, so turtle.right(90)\
    \ is called to reset it back to its original \n\ndirection.\n\nFigure 13-10 shows\
    \ how these four lines of code move the turtle to the \n\nright along its relative\
    \ x-axis and up along its relative y-axis and leave it in \n\nthe correct heading,\
    \ no matter what its initial heading was.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_299_0.png)\n\
    \n*Figure 13-10: In each of these four images, the turtle always moves 100 units\
    \ “right” and “up” along the rela­*\n\n*tive x-axis and y-axis of its initial\
    \ heading.*\n\nFinally, with the turtle in the correct position and heading for\
    \ the next \n\nshape, we make the recursive call to drawFractal():\n\n*Python*\n\
    \n # Make the recursive call:\n\n drawFractal(shapeDrawFunction, size \\* sizeCh,\
    \ specs, maxDepth, \n\n depth + 1)\n\nThe Recursive Book of Recursion (Early Access)\
    \ © 2022 by Al Sweigart"
  merge: -1
  pgno: 299
- img_proc: true
  md: "Fractal Art Maker   **275**\n\nThe shapeDrawFunction, specs, and maxDepth arguments\
    \ are passed to the \n\nrecursive drawFractal() call unchanged. However, size\
    \ \\* sizeCh is passed for \n\nthe next size parameter to reflect the change in\
    \ the size of the recursive \n\nshape, and depth + 1 is passed for the depth parameter\
    \ to increment it for the \n\nnext shape-drawing function call.\n\n**Creating\
    \ the Example Fractals**\n\nNow that we’ve covered how the shape-drawing functions\
    \ and recursive draw­\n\nFractal() function work, let’s look at the nine example\
    \ fractals that come \n\nwith the Fractal Art Maker. You can see these examples\
    \ in Figure 13-1.\n\n***Four Corners***\n\nThe first fractal is *Four Corners*,\
    \ which begins as a large square. As the func­\n\ntion calls itself, the fractal’s\
    \ specifications cause four smaller squares to be \n\ndrawn in the four corners\
    \ of the square:\n\n*Python*\n\nif DRAW\\_FRACTAL == 1:\n\n # Four Corners:\n\n\
    \ drawFractal(drawFilledSquare, 350,\n\n \\[{'sizeChange': 0.5, 'xChange': -0.5,\
    \ 'yChange': 0.5},\n\n {'sizeChange': 0.5, 'xChange': 0.5, 'yChange': 0.5},\n\n\
    \ {'sizeChange': 0.5, 'xChange': -0.5, 'yChange': -0.5},\n\n {'sizeChange': 0.5,\
    \ 'xChange': 0.5, 'yChange': -0.5}\\], 5)\n\nThe call to drawFractal() here limits\
    \ the maximum depth to 5, as any \n\nmore tends to make the fractal so dense that\
    \ the fine detail becomes hard \n\nto see.\n\n***Spiral Squares***\n\nThe *Spiral\
    \ Squares fractal *also starts as a large square, but it creates just one \n\n\
    new square on each recursive call:\n\n*Python*\n\nelif DRAW\\_FRACTAL == 2:\n\n\
    \ # Spiral Squares:\n\n drawFractal(drawFilledSquare, 600, \\[{'sizeChange': 0.95,\n\
    \n 'angleChange': 7}\\], 50)\n\nThis square is slightly smaller and rotated by\
    \ 7 degrees. The centers of \n\nall the squares are unchanged, so there’s no need\
    \ to add xChange and yChange \n\nkeys to the specification. The default maximum\
    \ depth of 8 is too small to \n\nget an interesting fractal, so we increase it\
    \ to 50 to produce a hypnotic spiral \n\npattern.\n\nThe Recursive Book of Recursion\
    \ (Early Access) © 2022 by Al Sweigart"
  merge: -1
  pgno: 300
