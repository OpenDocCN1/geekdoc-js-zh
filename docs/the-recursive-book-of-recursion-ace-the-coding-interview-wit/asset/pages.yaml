  md: "Drawing Fractals   **179**\n\nPython\n\nDescription\n\nshowturtle()\n\nShows\
    \ the triangle that represents the turtle.\n\ntracer(* drawingUpdates*, \n\n*delay*)\n\
    \nAdjusts the speed of drawing. Pass 0 for *delay* for a \n\ndelay of 0 milliseconds\
    \ after each line the turtle draws. \n\nThe larger the number passed for *drawingUpdates*,\
    \ the \n\nfaster the turtle draws by increasing the number of draw­\n\nings before\
    \ the module updates the screen.\n\nupdate()\n\nDraws any buffered lines (explained\
    \ later in this section) \n\nto the screen. Call this after the turtle has completed\
    \ \n\ndrawing.\n\nsetworldcoordinates \n\n(* llx*, *lly*, *urx* *ury*)\n\nReadjusts\
    \ which part of the coordinate plane the window \n\nshows. The first two arguments\
    \ are the x, y coordinates \n\nfor the lower-left corner of the window. The latter\
    \ two \n\narguments are the x, y coordinates for the upper-right \n\ncorner of\
    \ the window.\n\nexitonclick()\n\nPauses the program and closes the window when\
    \ the \n\nuser clicks anywhere. Without this at the end of your pro­\n\ngram,\
    \ the turtle graphics window may close as soon as \n\nthe program ends.\n\nIn\
    \ Python’s turtle module, lines are displayed on the screen immedi­\n\nately.\
    \ However, this can slow programs that draw thousands of lines. It’s \n\nfaster\
    \ to *buffer*—that is, hold off displaying several lines and then display \n\n\
    them all at once.\n\nBy calling turtle.tracer(1000, 0), you can instruct the turtle\
    \ module to \n\nhold off displaying lines until 1,000 lines have been created\
    \ by your program. \n\nAfter your program has finished calling line-drawing functions,\
    \ make a final \n\ncall to turtle.update() to display any remaining buffered lines\
    \ to the screen. If \n\nyour program is still taking too long to draw an image,\
    \ pass a larger integer \n\nsuch as 2000 or 10000 as the first argument to turtle.tracer().\n\
    \n**The Sierpi****ń****ski Triangle**\n\nThe easiest fractal to draw on paper\
    \ is the *Sierpi**ń**ski triangle*, introduced \n\nin Chapter 1 This fractal was\
    \ described by Polish mathematician Wacław \n\nSierpiński in 1915 (predating even\
    \ the term *fractal*). However, the pattern is \n\nat least hundreds of years\
    \ older. \n\nTo create a Sierpi*ń*ski triangle, start by drawing an equilateral\
    \ triangle—\n\na triangle with equal-length sides, like the one on the left in\
    \ Figure 9-3. \n\nThen draw an upside-down equilateral triangle inside the first\
    \ triangle, as \n\non the right in Figure 9-3. You’ll form a shape that, if you’re\
    \ familiar with \n\nthe *Legend of Zelda* video games, looks like the Triforce.\n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
