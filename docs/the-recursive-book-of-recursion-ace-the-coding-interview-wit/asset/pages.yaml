  md: "Recursion Vs. Iteration   **29**\n\nrecursive call but before the second recursive\
    \ call,” and “after the second \n\nrecursive call.” But the same principles apply.\
    \ And don’t think that because a \n\nbase case is reached, no more code remains\
    \ to run after either recursive call. \n\nThe recursive algorithm is finished\
    \ only after the original function call has \n\nreturned.\n\nYou might ask, “Isn’t\
    \ the iterative Fibonacci solution simpler than the \n\nrecursive Fibonacci solution?”\
    \ The answer is “Yes.” Even worse, the recursive \n\nsolution has a critical inefficiency\
    \ that is explained in the next section.\n\n***Why the Recursive Fibonacci Algorithm\
    \ Is Terrible***\n\nLike the recursive factorial algorithm, the recursive Fibonacci\
    \ algorithm \n\nalso suffers from a critical weakness: it repeats the same calculations\
    \ over \n\nand over. Figure 2-3 shows how calling fibonacci(6), marked in the\
    \ tree dia­\n\ngram as fib(6) for brevity, calls fibonacci(5) and fibonacci(4).\n\
    \nfib(5)\n\nfib(4)\n\nfib(3)\n\nfib(6)\n\nfib(3)\n\nfib(2)\n\nfib(2)\n\nfib(1)\n\
    \n1\n\n1\n\n1\n\nfib(4)\n\nfib(3)\n\nfib(2)\n\nfib(2)\n\nfib(1)\n\n1\n\n1\n\n\
    1\n\n1\n\n1\n\nfib(2)\n\nfib(1)\n\n*Figure 2-3: A tree diagram of the recursive\
    \ function calls made s *\n\n*tarting with **fibonacci(6)**. The redundant function\
    \ calls are in gray.*\n\nThis causes a cascade of other function calls until they\
    \ reach the \n\nbase cases of fibonacci(2) and fibonacci(1), which return 1. But\
    \ notice \n\nthat fibonacci(4) is called twice, and fibonacci(3) is called three\
    \ times, \n\nand so on. This slows the overall algorithm with unnecessarily repeated\
    \ \n\ncalculations. This inefficiency gets worse as the Fibonacci number you \n\
    \nwant to calculate gets larger. While the iterative Fibonacci algorithm can \n\
    \ncomplete fibonacci(100) in less than a second, the recursive algorithm \n\n\
    would take over a million years to complete.\n\n**Converting a Recursive Algorithm\
    \ into an Iterative Algorithm**\n\nConverting a recursive algorithm into an iterative\
    \ algorithm is always pos­\n\nsible. While recursive functions repeat a calculation\
    \ by calling themselves, \n\nthis repetition can be performed instead by a loop.\
    \ Recursive functions \n\nalso make use of the call stack; however, an iterative\
    \ algorithm can replace \n\nthis with a stack data structure. Thus, any recursive\
    \ algorithm can be per­\n\nformed iteratively by using a loop and a stack.\n\n\
    The Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
