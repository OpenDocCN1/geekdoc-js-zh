    \ nodes represent dead ends. \n\nThe recursive case occurs when the tree traversal\
    \ algorithm moves from \n\none node to the next. If the tree traversal reaches\
    \ a leaf node (a dead end \n\nin the maze), the algorithm has reached a base case\
    \ and must backtrack to \n\nan earlier node and follow a different path. Once\
    \ the algorithm reaches the \n\nexit node, the path it took from the root node\
    \ represents the maze solution. \n\nLet’s ask our three recursive algorithm questions\
