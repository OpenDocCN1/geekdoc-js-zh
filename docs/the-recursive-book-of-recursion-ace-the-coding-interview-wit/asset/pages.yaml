  md: "Permutations and Combinations   **131**\n\nAnd *nestedLoopPermutations.html*\
    \ contains the equivalent JavaScript \n\nprogram:\n\n<script>\n\nfor (a of \\\
    ['A', 'B', 'C', 'D', 'E'\\]) {\n\n for (b of \\['A', 'B', 'C', 'D', 'E'\\]) {\n\
    \n for (c of \\['A', 'B', 'C', 'D', 'E'\\]) {\n\n for (d of \\['A', 'B', 'C',\
    \ 'D', 'E'\\]) {\n\n document.write(a + b + c + d + \"<br />\")\n\n }\n\n }\n\n\
    \ }\n\n}\n\n</script>\n\nThe output of these programs looks like this:\n\nA A\
    \ A A\n\nA A A B\n\nA A A C\n\nA A A D\n\nA A A E\n\nA A B A\n\nA A B B\n\n*\\\
    --snip--*\n\nE E E C\n\nE E E D\n\nE E E E\n\nThe problem with generating permutations\
    \ with four nested loops is \n\nthat it works for only exactly four-character\
    \ permutations. Nested loops \n\ncannot generate permutations for arbitrary lengths.\
    \ Instead, we can use a \n\nrecursive function, as described in the next section.\n\
    \nYou can remember the difference between permutations with and \n\nwithout repetition\
    \ with the examples in this chapter. Permutations *without* \n\nrepetition go\
    \ through all possible orderings of the elements in a set, like \n\nour wedding\
    \ guest seating chart example. Permutations *with* repetition go \n\nthrough all\
    \ the possible combinations of a combination lock; the order mat­\n\nters, and\
    \ the same element can appear more than once.\n\n**Permutations with Repetition:\
    \ A Password Cracker**\n\nImagine you have received a sensitive encrypted file\
    \ from a recently deceased \n\njournalist. In their final message, the journalist\
    \ told you the file contains \n\nrecords of tax evasion by a nefarious trillionaire.\
    \ They didn’t have the pass­\n\nword to decrypt the file, but they did know that\
    \ it is exactly four characters \n\nlong; also, the possible characters are the\
    \ numbers 2, 4, and 8 and the letters \n\nJ, P, and B. These characters can appear\
    \ more than once. For example, pos­\n\nsible passwords are JPB2, JJJJ, and 2442.\
    \ \n\nTo generate a list of all possible four-character passwords based on this\
    \ \n\ninformation, you want to obtain all possible four-element permutations \n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
