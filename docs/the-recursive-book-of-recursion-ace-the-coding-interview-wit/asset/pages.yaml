  md: "**282**   Chapter 14\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_307_0.png)\n\
    \n*Figure 14-1: The recursive illustration on a tin *\n\n*of Droste’s Cacao*\n\
    \nUsing a graphics program such as Microsoft Paint or Adobe Photoshop, \n\nyou’ll\
    \ prepare the image by covering an area of it with a pure magenta \n\ncolor, indicating\
    \ where to place the recursive image. The Python program \n\nuses the Pillow image\
    \ library to read this image data and produce a recur­\n\nsive image.\n\nFirst,\
    \ we’ll cover how to install the Pillow library and how the Droste \n\nMaker algorithm\
    \ works. Next, we’ll present the Python source code for the \n\nprogram with accompanying\
    \ explanation of the code.\n\n**Installing the Pillow Python Library**\n\nThis\
    \ chapter’s project requires the Pillow image library. This library allows \n\n\
    your Python programs to create and modify image files including PNGs, \n\nJPEGs,\
    \ and GIFs. It has several functions to perform resizing, copying, crop­\n\nping,\
    \ and other common actions on images.\n\nTo install this library on Windows, open\
    \ a command prompt window \n\nand run py -m pip install --user pillow. To install\
    \ this library on macOS \n\nor Linux, open a Terminal window and run python3 -m\
    \ pip install --user \n\nThe Recursive Book of Recursion (Early Access) © 2022\
    \ by Al Sweigart"
