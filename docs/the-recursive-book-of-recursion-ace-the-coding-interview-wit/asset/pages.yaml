  md: "**258**   Chapter 13\n\n**The Built-in Fractals**\n\nYou can direct your computer\
    \ to create an unlimited number of fractals. \n\nFigure 13-1 shows the nine fractals\
    \ that come with the Fractal Art Maker \n\nprogram that we’ll use in this chapter.\
    \ These are produced from functions \n\nthat draw a simple square or equilateral\
    \ triangle as the base shape, then \n\nintroduce slight differences in their recursive\
    \ configuration to produce \n\ncompletely different images.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_283_0.png)\n\
    \nFour corners\n\nSpiral squares\n\nDouble spiral squares\n\nTriangle spiral\n\
    \nConway’s game of life glider\n\nSierpinski triangle\n\nWave\n\nHorn\n\nSnowﬂake\n\
    \n*Figure 13-1: The nine example fractals that come with the Fractal Art Maker\
    \ program*\n\nYou can produce all of these fractals by setting the DRAW\\_FRACTAL\
    \ constant \n\nat the top of the program to an integer from 1 to 9 and then running\
    \ the \n\nFractal Art Maker program. You can also set DRAW\\_FRACTAL to 10 or\
    \ 11 to draw \n\nthe basic square and triangle shapes, respectively, that compose\
    \ these frac­\n\ntals, as shown in Figure 13-2.\n\nThese shapes are fairly simple:\
    \ a square filled with either white or gray, \n\nand a simple outline of a triangle.\
    \ The drawFractal() function uses these \n\nbasic shapes to create amazing fractals.\n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
