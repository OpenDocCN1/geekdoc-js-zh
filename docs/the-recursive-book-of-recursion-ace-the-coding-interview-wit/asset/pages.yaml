    \ % (fibonacciCache\\[nthNumber\\]))**\n\n **return fibonacciCache\\[nthNumber\\\
    ] **2\n\n if nthNumber == 1 or nthNumber == 2:\n\n # BASE CASE\n\n print(indentation\
    \ + 'Base case fibonacci(%s) returning 1.' % (nthNumber))\n\n **fibonacciCache\\\
    [nthNumber\\] = 1 **3** # Update the cache.**\n\n return 1\n\n else:\n\n # RECURSIVE\
    \ CASE\n\n print(indentation + 'Calling fibonacci(%s) (nthNumber - 1).' % (nthNumber\
