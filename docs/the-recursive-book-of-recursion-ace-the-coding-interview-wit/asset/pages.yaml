  md: "**204**   Chapter 10\n\nbranch into other subfolders. We’ll write a recursive\
    \ function to navigate \n\nthis tree.\n\n**N O T E**\n\n*Since browser-based JavaScript\
    \ has no way to access the folders on your computer, the *\n\n*program for this\
    \ chapter’s project is written in Python only. *\n\n**The Complete File-Search\
    \ Program**\n\nLet’s begin by taking a look at the complete source code for the\
    \ recursive \n\nfile-search program. The rest of this chapter explains each section\
    \ of code \n\nindividually. Copy the source code for the file-search program to\
    \ a file \n\nnamed *fileFinder.py*: \n\nimport os\n\ndef hasEvenByteSize(fullFilePath):\n\
    \n \"\"\"Returns True if fullFilePath has an even size in bytes,\n\n otherwise\
    \ returns False.\"\"\"\n\n fileSize = os.path.getsize(fullFilePath)\n\n return\
    \ fileSize % 2 == 0\n\ndef hasEveryVowel(fullFilePath):\n\n \"\"\"Returns True\
    \ if the fullFilePath has a, e, i, o, and u,\n\n otherwise returns False.\"\"\"\
    \n\n name = os.path.basename(fullFilePath).lower()\n\n return ('a' in name) and\
    \ ('e' in name) and ('i' in name) and ('o' in name) and ('u' in \n\nname)\n\n\
    def walk(folder, matchFunc):\n\n \"\"\"Calls the match function with every file\
    \ in the folder and its\n\n subfolders. Returns a list of files that the match\
    \ function\n\n returned True for.\"\"\"\n\n matchedFiles = \\[\\] # This list\
    \ holds all the matches.\n\n folder = os.path.abspath(folder) # Use the folder's\
    \ absolute path.\n\n # Loop over every file and subfolder in the folder:\n\n for\
    \ name in os.listdir(folder):\n\n filepath = os.path.join(folder, name)\n\n if\
    \ os.path.isfile(filepath):\n\n # Call the match function for each file:\n\n if\
    \ matchFunc(filepath):\n\n matchedFiles.append(filepath)\n\n elif os.path.isdir(filepath):\n\
    \n # Recursively call walk for each subfolder, extending\n\n # the matchedFiles\
    \ with their matches:\n\n matchedFiles.extend(walk(filepath, matchFunc))\n\n return\
    \ matchedFiles\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al\
    \ Sweigart"
  merge: -1
  pgno: 229
