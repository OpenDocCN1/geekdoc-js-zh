  md: "**10**\n\n**F IL E F IN DE R **\n\nIn this chapter, you’ll write your own recur­\n\
    \nsive program to search for files according \n\nto custom needs. Your computer\
    \ already \n\nhas some file-searching commands and apps, \n\nbut often they’re\
    \ limited to retrieving files based on a \n\npartial filename. What if you need\
    \ to make esoteric, \n\nhighly specific searches? For example, what if you need\
    \ \n\nto find all files that have an even number of bytes, or \n\nfiles with names\
    \ that contain every vowel? \n\nYou likely won’t ever need to do these searches\
    \ specifically, but you’ll \n\nprobably have odd search criteria someday. You’ll\
    \ be out of luck if you can’t \n\ncode this search yourself.\n\nAs you’ve learned,\
    \ recursion is especially suited to problems that have a \n\ntree-like structure.\
    \ The filesystem on your computer is like a tree, as you saw \n\nback in Figure 2-6.\
    \ Each folder branches into subfolders, which in turn can \n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_228_0.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_228_1.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_228_2.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_228_3.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_228_4.png)\n\
    \n**T H E R E C U R S I V E **\n\n**B O O K O F **\n\n**R E C U R S I O N**\n\n\
    **A C E**\n\n**T H E**\n\n**C O D I N G**\n\n**I N T E R V I E W**\n\n**W I T\
    \ H **\n\n**P Y T H O N**\n\n**A N D**\n\n**J A V A S C R I P T**\n\n**T H E R\
    \ E C U R S I V E **\n\n**B O O K O F **\n\n**R E C U R S I O N**\n\n**A C E**\n\
    \n**T H E**\n\n**C O D I N G**\n\n**I N T E R V I E W**\n\n**W I T H**\n\n**P\
    \ Y T H O N**\n\n**A N D**\n\n**J A V A S C R I P T**\n\n**THERECURSIVE**\n\n\
    **BOOKOF **\n\n**RECURSION**\n\n**ACETHECODINGINTERVIEWWITH**\n\n**PYTHONANDJAVASCRIPT**\n\
    \n![](img/4317e0d10a2a71da22fc74ce42e2668a_228_5.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_228_6.png)\n\
