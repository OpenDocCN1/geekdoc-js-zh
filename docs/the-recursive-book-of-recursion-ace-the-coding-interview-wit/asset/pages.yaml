    \n2 < 5\n\n5 < 9\n\n8 < 9\n\n9\n\n**1**\n\n**2**\n\n**3**\n\n**4**\n\n*Figure 5-4:\
    \ The merge step compares the two values at the *\n\n*start of the smaller sorted\
    \ lists and moves them to the larger *\n\n*sorted list. Merging four cards requires\
    \ only four steps.*\n\nLet’s ask our three recursive algorithm questions about\
    \ the merge sort \n\nalgorithm:\n\n**What is the base case?   ** Being given a\
    \ list to sort that has zero or one \n\nitem in it, which is already in sorted\
    \ order.\n\n**What argument is passed to the recursive function call?   ** Lists\
    \ made \n\nfrom the left and right halves of the original list to sort.\n\n**How\
    \ does this argument become closer to the base case?   ** The lists \n\npassed\
