  md: "Drawing Fractals   **187**\n\n**Fractal Trees**\n\nWhile the artificial fractals\
    \ such as the Sierpiński triangle and carpet \n\nare perfectly self-similar, fractals\
    \ can include shapes that do not have \n\nperfect self-similarity. Fractal geometry,\
    \ as envisioned by mathematician \n\nBenoit B. Mandelbrot (whose middle initial\
    \ recursively stands for Benoit \n\nB. Mandelbrot) included natural shapes such\
    \ as mountains, coastlines, \n\nplants, blood vessels, and the clustering of galaxies\
    \ as fractals. Upon close \n\nexamination, these shapes continued to consist of\
    \ “rougher” shapes not \n\neasily contained by the smooth curves and straight\
    \ lines of simplified \n\ngeometry.\n\nAs an example, we can use recursion to\
    \ reproduce *fractal trees*, whether \n\nperfectly or imperfectly self-similar.\
    \ Generating trees requires creating a \n\nbranch with two child branches that\
    \ issue from their parent at set angles \n\nand decrease at set lengths. The Y\
    \ shape that they produce is recursively \n\nrepeated to create a convincing drawing\
    \ of a tree, as in Figure 9-11 and \n\nFigure 9-12.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_212_0.png)\n\
    \n*Figure 9-11: A perfectly self-similar fractal tree generated with the *\n\n\
    *left and right branches using consistent angles and lengths*\n\nMovies and video\
    \ games can use such recursive algorithms in *procedural *\n\n*generation*, the\
    \ automatic (rather than manual) creation of 3D models such \n\nas trees, ferns,\
    \ flowers, and other plants. Using algorithms, computers can \n\nquickly create\
    \ entire forests consisting of millions of unique trees, saving an \n\narmy of\
    \ human 3D artists the painstaking effort.\n\nThe Recursive Book of Recursion\
    \ (Early Access) © 2022 by Al Sweigart"
  merge: -1
  pgno: 212
- img_proc: true
  md: "**188**   Chapter 9\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_213_0.png)\n\
    \n*Figure 9-12: A more realistic tree created using random changes *\n\n*to branch\
    \ angle and lengths*\n\nOur fractal tree program displays a new, randomly generated\
    \ tree every \n\ntwo seconds. The source code for *fractalTree.py* is as follows:\n\
    \n*Python*\n\nimport random\n\nimport time\n\nimport turtle\n\nturtle.tracer(1000,\
    \ 0) # Increase the first argument to speed up the drawing.\n\nturtle.setworldcoordinates(0,\
    \ 0, 700, 700)\n\nturtle.hideturtle()\n\ndef drawBranch(startPosition, direction,\
    \ branchLength):\n\n if branchLength < 5:\n\n # BASE CASE\n\n return\n\n # Go\
    \ to the starting point & direction.\n\n turtle.penup()\n\n turtle.goto(startPosition)\n\
    \n turtle.setheading(direction)\n\n # Draw the branch (thickness is 1/7 the length).\n\
    \n turtle.pendown()\n\n turtle.pensize(max(branchLength / 7.0, 1))\n\n turtle.forward(branchLength)\n\
    \n # Record the position of the branch's end.\n\n endPosition = turtle.position()\n\
    \n leftDirection = direction + LEFT\\_ANGLE\n\n leftBranchLength = branchLength\
    \ - LEFT\\_DECREASE\n\n rightDirection = direction - RIGHT\\_ANGLE\n\n rightBranchLength\
    \ = branchLength - RIGHT\\_DECREASE\n\nThe Recursive Book of Recursion (Early\
    \ Access) © 2022 by Al Sweigart"
  merge: -1
  pgno: 213
- img_proc: true
  md: "Drawing Fractals   **189**\n\n # RECURSIVE CASE\n\n drawBranch(endPosition,\
    \ leftDirection, leftBranchLength)\n\n drawBranch(endPosition, rightDirection,\
    \ rightBranchLength)\n\nseed = 0\n\nwhile True:\n\n # Get pseudorandom numbers\
    \ for the branch properties.\n\n random.seed(seed)\n\n LEFT\\_ANGLE = random.randint(10,\
    \ 30)\n\n LEFT\\_DECREASE = random.randint( 8, 15)\n\n RIGHT\\_ANGLE = random.randint(10,\
    \ 30)\n\n RIGHT\\_DECREASE = random.randint( 8, 15)\n\n START\\_LENGTH = random.randint(80,\
    \ 120)\n\n # Write out the seed number.\n\n turtle.clear()\n\n turtle.penup()\n\
    \n turtle.goto(10, 10)\n\n turtle.write('Seed: %s' % (seed))\n\n # Draw the tree.\n\
    \n drawBranch((350, 10), 90, START\\_LENGTH)\n\n turtle.update()\n\n time.sleep(2)\n\
    \n seed = seed + 1\n\nThis program produces perfectly self-similar trees, as the\
    \ LEFT\\_ANGLE, \n\nLEFT\\_DECREASE, RIGHT\\_ANGLE, and RIGHT\\_DECREASE variables\
    \ are initially randomly \n\nchosen but stay constant for all the recursive calls.\
    \ The random.seed() func­\n\ntion sets a seed value for Python’s random functions.\
    \ The *random number *\n\n*seed value* causes the program to produce random-seeming\
    \ numbers, but it \n\nuses the same sequence of random numbers for each branch\
    \ of the tree. In \n\nother words, the same *seed *value reproduces the same *tree\
    \ *each time you run \n\nthe program. (I never apologize for my puns.)\n\nTo see\
    \ this in action, enter the following into the Python interactive \n\nshell:\n\
    \n*Python*\n\n\\> **import random**\n\n\\> **random.seed(42)**\n\n\\> **\\[random.randint(0,\
    \ 9) for i in range(20)\\]**\n\n \\[1, 0, 4, 3, 3, 2, 1, 8, 1, 9, 6, 0, 0, 1,\
    \ 3, 3, 8, 9, 0, 8\\]\n\n\\> **\\[random.randint(0, 9) for i in range(20)\\]**\n\
    \n \\[3, 8, 6, 3, 7, 9, 4, 0, 2, 6, 5, 4, 2, 3, 5, 1, 1, 6, 1, 5\\]\n\n\\> **random.seed(42)**\n\
    \n\\> **\\[random.randint(0, 9) for i in range(20)\\]**\n\n \\[1, 0, 4, 3, 3,\
    \ 2, 1, 8, 1, 9, 6, 0, 0, 1, 3, 3, 8, 9, 0, 8\\]\n\nIn this example, we set the\
    \ random seed to 42. When we generate 20 \n\nrandom integers, we get 1, 0, 4,\
    \ 3, and so on. We can generate another 20 \n\nintegers and continue to receive\
    \ random integers. However, if we reset the \n\nseed to 42 and generate 20 random\
    \ integers again, they’ll be the same “ran­\n\ndom” integers as before.\n\nThe\
    \ Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
