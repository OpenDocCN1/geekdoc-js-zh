  md: "**210**   Chapter 10\n\n\\> **folder**\n\n'C:/Windows/system32'\n\n\\> **file**\n\
    \n'notepad.exe'\n\nYou can use any of Python’s string methods on these string\
    \ values to \n\nhelp evaluate the file against your search criteria, such as lower()\
    \ in the \n\nhasEveryVowel() match function.\n\n***Finding Information About the\
    \ File’s Timestamps***\n\nFiles have timestamps indicating when they were created,\
    \ last modified, and \n\nlast accessed. Python’s os.path.getctime(), os.path.getmtime(),\
    \ and os.path.\n\ngetatime(), respectively, return these timestamps as floating-point\
    \ values \n\nindicating the number of seconds since the *Unix epoch*, midnight\
    \ on January \n\n1, 1970 in the Coordinated Universal Time (UTC) time zone. Enter\
    \ the fol­\n\nlowing into the interactive shell:\n\n*Python*\n\n\\> **import os**\n\
    \n\\> **filename = 'C:/Windows/system32/notepad.exe'**\n\n\\> **os.path.getctime(filename)**\n\
    \n1625705942.1165037\n\n\\> **os.path.getmtime(filename)**\n\n1625705942.1205275\n\
    \n\\> **os.path.getatime(filename)**\n\n1631217101.8869188\n\nThese float values\
    \ are easy for programs to use since they’re just single \n\nnumbers, but you’ll\
    \ need functions from Python’s time module to make \n\nthem simpler for humans\
    \ to read. The time.localtime() function converts \n\na Unix epoch timestamp into\
    \ a struct\\_time object in the computer’s time \n\nzone. A struct\\_time object\
    \ has several attributes whose names begin with tm\\_ \n\nfor obtaining date and\
    \ time information. Enter the following into the inter­\n\nactive shell:\n\n*Python*\n\
    \n\\> **import os**\n\n\\> **filename = 'C:/Windows/system32/notepad.exe'**\n\n\
    \\> **ctimestamp = os.path.getctime(filename)**\n\n\\> **import time**\n\n\\>\
    \ **time.localtime(ctimestamp)**\n\ntime.struct\\_time(tm\\_year=2021, tm\\_mon=7,\
    \ tm\\_mday=7, tm\\_hour=19, \n\ntm\\_min=59, tm\\_sec=2, tm\\_wday=2, tm\\_yday=188,\
    \ tm\\_isdst=1)\n\n\\> **st = time.localtime(ctimestamp)**\n\n\\> **st.tm\\_year**\n\
    \n2021\n\n\\> **st.tm\\_mon**\n\n7\n\n\\> **st.tm\\_mday**\n\n7\n\n\\> **st.tm\\\
    _wday**\n\n2\n\n\\> **st.tm\\_hour**\n\nThe Recursive Book of Recursion (Early\
    \ Access) © 2022 by Al Sweigart"
