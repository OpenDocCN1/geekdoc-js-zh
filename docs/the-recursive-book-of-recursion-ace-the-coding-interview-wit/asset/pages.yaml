  md: "**128**   Chapter 6\n\n # RECURSIVE CASE\n\n permutations = \\[\\]\n\n head\
    \ = chars\\[0\\] 2\n\n tail = chars\\[1:\\]\n\n tailPermutations = getPerms(tail,\
    \ indent + 1)\n\n for tailPerm in tailPermutations: 3\n\n print('.' \\* indent\
    \ + 'When chars =', chars, 'putting head', head, 'in all places in', \n\ntailPerm)\n\
    \n for i in range(len(tailPerm) + 1): 4\n\n newPerm = tailPerm\\[0:i\\] + head\
    \ + tailPerm\\[i:\\]\n\n print('.' \\* indent + 'New permutation:', newPerm)\n\
    \n permutations.append(newPerm)\n\n print('.' \\* indent + 'When chars =', chars,\
    \ 'results are', permutations)\n\n return permutations\n\nprint('Permutations\
    \ of \"ABCD\":')\n\nprint('Results:', ','.join(getPerms('ABCD')))\n\nThe equivalent\
    \ JavaScript program is in *permutations.html*:\n\n<script type=\"text/javascript\"\
    >\n\nfunction getPerms(chars, indent) {\n\n if (indent === undefined) {\n\n indent\
    \ = 0;\n\n }\n\n document.write('.'.repeat(indent) + 'Start of getPerms(\"' +\
    \ chars + '\")<br />');\n\n if (chars.length === 1) { 1\n\n // BASE CASE\n\n document.write('.'.repeat(indent)\
    \ + \"When chars = \\\\\"\" + chars + \n\n \"\\\\\" base case returns \" + chars\
    \ + \"<br />\");\n\n return \\[chars\\];\n\n }\n\n // RECURSIVE CASE\n\n let permutations\
    \ = \\[\\];\n\n let head = chars\\[0\\]; 2\n\n let tail = chars.substring(1);\n\
    \n let tailPermutations = getPerms(tail, indent + 1);\n\n for (tailPerm of tailPermutations)\
    \ { 3\n\n document.write('.'.repeat(indent) + \"When chars = \" + chars + \n\n\
    \ \" putting head \" + head + \" in all places in \" + tailPerm + \"<br />\");\n\
    \n for (let i = 0; i < tailPerm.length + 1; i++) { 4\n\n let newPerm = tailPerm.slice(0,\
    \ i) + head + tailPerm.slice(i);\n\n document.write('.'.repeat(indent) + \"New\
    \ permutation: \" + newPerm + \"<br />\");\n\n permutations.push(newPerm);\n\n\
    \ }\n\n }\n\n document.write('.'.repeat(indent) + \"When chars = \" + chars +\
    \ \n\n \" results are \" + permutations + \"<br />\");\n\n return permutations;\n\
    \n}\n\ndocument.write(\"<pre>Permutations of \\\\\"ABCD\\\\\":<br />\");\n\ndocument.write(\"\
    Results: \" + getPerms(\"ABCD\") + \"</pre>\");\n\n</script>\n\nThe Recursive\
    \ Book of Recursion (Early Access) © 2022 by Al Sweigart"
