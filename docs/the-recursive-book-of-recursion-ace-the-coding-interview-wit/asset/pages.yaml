  md: "**206**   Chapter 10\n\n***Finding the Files with an Even Number of Bytes***\n\
    \nThe first matching function finds files with an even byte size:\n\n*Python*\n\
    \nimport os\n\ndef hasEvenByteSize(fullFilePath):\n\n \"\"\"Returns True if fullFilePath\
    \ has an even size in bytes,\n\n otherwise returns False.\"\"\"\n\n fileSize =\
    \ os.path.getsize(fullFilePath)\n\n return fileSize % 2 == 0\n\nWe import the\
    \ os module, which is used throughout the program to \n\nget information about\
    \ the files on your computer through functions such \n\nas getsize(), basename()\
    \ and others. Then we create a match function named \n\nhasEvenByteSize(). All\
    \ match functions take a single string argument named \n\nfullFilePath, and return\
    \ either True or False to signify a match or miss.\n\nThe os.path.getsize() function\
    \ determines the size of the file in \n\nfullFilePath in bytes. Then we use the\
    \ % modulus operator to determine \n\nwhether this number is even. If it’s even,\
    \ the return statement returns \n\nTrue; if it’s odd, it returns False. For example,\
    \ let’s consider the size of the \n\nNotepad application that comes with the Windows\
    \ operating system (on \n\nmacOS or Linux, try running this function on the */bin/ls*\
    \ program):\n\n*Python*\n\n\\> **import os**\n\n\\> **os.path.getsize('C:/Windows/system32/notepad.exe')**\n\
    \n211968\n\n\\> **211968 % 2 == 0**\n\nTrue\n\nThe hasEvenByteSize() match function\
    \ can use any Python function to \n\nfind more information about the fullFilePath\
    \ file. This gives you the power­\n\nful capability to write code for any search\
    \ criteria you want. As walk() calls \n\nthe match function for each file in the\
    \ folder and subfolders it walks across, \n\nthe match function returns True or\
    \ False for each one. This tells walk() \n\nwhether the file is a match.\n\n***Finding\
    \ the Filenames That Contain Every Vowel***\n\nLet’s take a look at the next match\
    \ function:\n\ndef hasEveryVowel(fullFilePath):\n\n \"\"\"Returns True if the\
    \ fullFilePath has a, e, i, o, and u,\n\n otherwise returns False.\"\"\"\n\n name\
    \ = os.path.basename(fullFilePath).lower()\n\n return ('a' in name) and ('e' in\
    \ name) and ('i' in name) and ('o' in name) and ('u' in \n\nname)\n\nWe call os.path.basename()\
    \ to remove the folder names from the file path. \n\nPython does case-sensitive\
    \ string comparisons, which ensures that hasEvery­\n\nVowel() doesn’t miss any\
    \ vowels in the filename because they are uppercase. \n\nFor example, calling\
    \ os.path.basename('C:/Windows/system32/notepad.exe') \n\nThe Recursive Book of\
    \ Recursion (Early Access) © 2022 by Al Sweigart"
