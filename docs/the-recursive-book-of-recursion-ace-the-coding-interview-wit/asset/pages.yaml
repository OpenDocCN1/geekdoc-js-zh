  md: "**14**   Chapter 1\n\nStack overflows don’t damage the computer. The computer\
    \ just detects \n\nthat the limit of function calls without returns has been reached\
    \ and termi­\n\nnates the program. At worse, you’ll lose any unsaved work the\
    \ program had. \n\nStack overflows can be prevented by having something called\
    \ a *base case*, \n\nwhich is explained next.\n\n**Base Cases and Recursive Cases**\n\
    \nThe stack overflow example has a shortest() function that calls shortest() \n\
    \nbut never returns. To avoid a crash, there needs to be a case, or set of cir­\n\
    \ncumstances, where the function stops calling itself and instead just returns.\
    \ \n\nThis is called a *base case*. By contrast, a case where the function recursively\
    \ \n\ncalls itself is called a *recursive case*. \n\nAll recursive functions require\
    \ at least one base case and at least one \n\nrecursive case. If there is no base\
    \ case, the function never stops making \n\nrecursive calls and eventually causes\
    \ a stack overflow. If there is no recursive \n\ncase, the function never calls\
    \ itself and is an ordinary function, not a recur­\n\nsive one. When you start\
    \ writing your own recursive functions, a good start­\n\ning step is to figure\
    \ out what the base case and recursive case should be.\n\nTake a look at this\
    \ *shortestWithBaseCase.py* program, which defines the \n\nshortest recursive\
    \ function that won’t crash from a stack overflow:\n\n*Python*\n\ndef shortestWithBaseCase(makeRecursiveCall):\n\
    \n print('shortestWithBaseCase(%s) called.' % makeRecursiveCall)\n\n if not makeRecursiveCall:\n\
    \n # BASE CASE\n\n print('Returning from base case.')\n\n 1 return\n\n else:\n\
    \n # RECURSIVE CASE\n\n 2 shortestWithBaseCase(False)\n\n print('Returning from\
    \ recursive case.')\n\n return\n\nprint('Calling shortestWithBaseCase(False):')\n\
    \n3 shortestWithBaseCase(False)\n\nprint()\n\nprint('Calling shortestWithBaseCase(True):')\n\
    \n4 shortestWithBaseCase(True)\n\nThis code is equivalent to the following *shortestWithBaseCase.html*\
    \ \n\nprogram:\n\n*JavaScript*\n\n<script type=\"text/javascript\">\n\nfunction\
    \ shortestWithBaseCase(makeRecursiveCall) {\n\n document.write(\"shortestWithBaseCase(\"\
    \ + makeRecursiveCall + \n\n \") called.<br />\");\n\n if (makeRecursiveCall ===\
    \ false) {\n\n // BASE CASE\n\n document.write(\"Returning from base case.<br\
    \ />\");\n\n 1 return;\n\nThe Recursive Book of Recursion (Early Access) © 2022\
    \ by Al Sweigart"
