  md: "Backtracking and Tree Traversal Algorithms   **73**\n\n***A Tree Data Structure\
    \ in Python and JavaScript***\n\nTree data structures are often drawn growing\
    \ downward, with the root at \n\nthe top. Figure 4-2 shows a treecreated with\
    \ the following Python code (it’s \n\nalso valid JavaScript code):\n\nroot = {'data':\
    \ 'A', 'children': \\[\\]}\n\nnode2 = {'data': 'B', 'children': \\[\\]}\n\nnode3\
    \ = {'data': 'C', 'children': \\[\\]}\n\nnode4 = {'data': 'D', 'children': \\\
    [\\]}\n\nnode5 = {'data': 'E', 'children': \\[\\]}\n\nnode6 = {'data': 'F', 'children':\
    \ \\[\\]}\n\nnode7 = {'data': 'G', 'children': \\[\\]}\n\nnode8 = {'data': 'H',\
    \ 'children': \\[\\]}\n\nroot\\['children'\\] = \\[node2, node3\\]\n\nnode2\\\
    ['children'\\] = \\[node4\\]\n\nnode3\\['children'\\] = \\[node5, node6\\]\n\n\
    node5\\['children'\\] = \\[node7, node8\\]\n\nPreorder:\n\nA B D C E G H F\n\n\
    Postorder:\n\nD B G H E F C A\n\nInorder:\n\nD B A G E H C F\n\nRoot and\n\nparent\
    \ node\n\n'B′\n\nParent and\n\nchild node\n\nChild and\n\nleaf nodes\n\n'C′\n\n\
    'G′\n\n'H′\n\n'F′\n\n'D′\n\n'E′\n\n'A′\n\n*Figure 4-2: A tree with root **A**\
    \ and leaves **D** , **G**, **H**, and **F**, along with its traversal orders*\n\
    \nEach node in the tree contains a piece of data (a string of a letter from \n\
    \nA to H) and a list of its child nodes. The preorder, postorder, and inorder\
    \ \n\ninformation in Figure 4-2 is explained in the subsequent sections.\n\nIn\
    \ the code for this tree, each node is represented by a Python diction­\n\nary\
    \ (or JavaScript object) with a key data that stores the node’s data, and a \n\
    \nkey children that has a list of other nodes. I use the root and node2 to node8\
    \ \n\nvariables to store each node and make the code more readable, but they \n\
    \naren’t required. The following Python/JavaScript code is equivalent to the \n\
    \nprevious code listing, though harder for humans to read:\n\nroot = {'data':\
    \ 'A', 'children': \\[{'data': 'B', 'children': \n\n\\[{'data': 'D', 'children':\
    \ \\[\\]}\\]}, {'data': 'C', 'children': \n\n\\[{'data': 'E', 'children': \\[{'data':\
    \ 'G', 'children': \\[\\]}, \n\n{'data': 'H', 'children': \\[\\]}\\]}, {'data':\
    \ 'F', 'children': \\[\\]}\\]}\\]}\n\nThe tree in Figure 4-2 is a specific kind\
    \ of data structure called a \n\n*directed acyclic graph* *(DAG)*. In mathematics\
    \ and computer science, a *graph* \n\nis a collection of nodes and edges, and\
    \ a tree is kind of graph. The graph \n\nis *directed* because its edges have\
    \ one direction: from parent to child node. \n\nThe Recursive Book of Recursion\
    \ (Early Access) © 2022 by Al Sweigart"
