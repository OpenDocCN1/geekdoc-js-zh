  md: "**132**   Chapter 6\n\nwith repetition of the set {J, P, B, 2, 4, 8}. Each\
    \ of the five characters in the \n\npassword can be one of the six possible characters,\
    \ making 6 × 6 × 6 × 6, or \n\n6⁴, or 1,296 possible permutations. We want to\
    \ generate the permutations \n\nof {J, P, B, 2, 4, 8} and not the combinations\
    \ because the ordering matters; \n\nJPB2 is a different password from B2JP.\n\n\
    Let’s ask the three recursive algorithm questions about our permuta­\n\ntions\
    \ function. Instead of *k*, we’ll use the more descriptive name permLength:\n\n\
    **What is the base case?   ** A permLength argument of 0, meaning a per­\n\nmutation\
    \ zero characters long, signals that the prefix argument now \n\ncontains the\
    \ complete permutation and so prefix should be returned in \n\nan array.\n\n**What\
    \ argument is passed to the recursive function call?   ** The chars \n\nstring\
    \ of the characters to get permutations of, a permLength argument \n\nthat begins\
    \ as the length of chars, and a prefix argument that begins \n\nas the blank string.\
    \ Recursive calls decrement the permLength argument \n\nwhile appending a character\
    \ from chars to the prefix argument.\n\n**How does this argument become closer\
    \ to the base case?   ** Eventually, \n\nthe permLength argument decrements to\
    \ 0.\n\nThe algorithm for recursive permutations with repetition is imple­\n\n\
    mented in *permutationsWithRepetition.py*:\n\ndef getPermsWithRep(chars, permLength=None,\
    \ prefix=''):\n\n indent = '.' \\* len(prefix)\n\n print(indent + 'Start, args=(\"\
    ' + chars + '\", ' + str(permLength) + ', \"' + prefix + '\")')\n\n if permLength\
    \ is None:\n\n permLength = len(chars)\n\n # BASE CASE\n\n if (permLength == 0):\
    \ 1\n\n print(indent + 'Base case reached, returning', \\[prefix\\])\n\n return\
    \ \\[prefix\\]\n\n # RECURSIVE CASE\n\n # Create a new prefix by adding each character\
    \ to the current prefix.\n\n results = \\[\\]\n\n print(indent + 'Adding each\
    \ char to prefix \"' + prefix + '\".')\n\n for char in chars:\n\n newPrefix =\
    \ prefix + char 2\n\n # Decrease permLength by one because we added one character\
    \ to the prefix.\n\n results.extend(getPermsWithRep (chars, permLength - 1, newPrefix))\
    \ 3\n\n print(indent + 'Returning', results)\n\n return results\n\nprint('All\
    \ permutations with repetition of JPB123:')\n\nprint(getPermsWithRep('JPB123',\
    \ 4))\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
