  md: "**6**\n\n**PE R M U TAT ION S A N D **\n\n**COM BIN AT ION S**\n\nProblems\
    \ involving permutations and com­\n\nbinations are especially suited to recursion.\
    \ \n\nThese are common in *set theory*, a branch of \n\nmathematical logic that\
    \ deals with the selection, \n\narrangement, and manipulation of collections of\
    \ objects. \n\nDealing with small sets in our short-term memory is simple. We\
    \ can eas­\n\nily come up with every possible order (that is, *permutation*) or\
    \ combination \n\nof a set of three or four objects. Ordering and combining items\
    \ in a larger \n\nset requires the same process but quickly turns into an impossible\
    \ task for \n\nour human brains. At that point, it becomes practical to bring\
    \ in computers \n\nto handle the combinatorial explosion that occurs as we add\
    \ more objects \n\nto a set. \n\nAt its heart, calculating permutations and combinations\
    \ of large groups \n\ninvolves calculating permutations and combinations of smaller\
    \ groups. This \n\nmakes these calculations suitable for recursion. In this chapter,\
    \ we’ll look at \n\nrecursive algorithms for generating all possible permutations\
    \ and combina­\n\ntions of characters in a string. We’ll expand on this to generate\
    \ all possible \n\ncombinations of balanced parentheses (orderings of open parentheses\
    \ \n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_148_0.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_148_1.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_148_2.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_148_3.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_148_4.png)\n\
    \n**T H E R E C U R S I V E **\n\n**B O O K O F **\n\n**R E C U R S I O N**\n\n\
    **A C E**\n\n**T H E**\n\n**C O D I N G**\n\n**I N T E R V I E W**\n\n**W I T\
