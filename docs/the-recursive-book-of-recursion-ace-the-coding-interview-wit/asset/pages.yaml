  md: "**7**\n\n**M E MO I Z AT ION A N D DY N A M IC **\n\n**PROG R A M M ING**\n\
    \nIn this chapter, we’ll explore memoiza­\n\ntion, a technique for making recursive\
    \ \n\nalgorithms run faster. We’ll discuss what \n\nmemoization is, how it should\
    \ be applied, and \n\nits usefulness in the areas of functional programming \n\
    \nand dynamic programming. We’ll use the Fibonacci \n\nalgorithm from Chapter 2\
    \ to demonstrate memoizing \n\ncode we write and the memoization features we can\
    \ \n\nfind in the Python standard library. We’ll also learn \n\nwhy memoization\
    \ can’t be applied to every recursive \n\nfunction.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_176_0.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_176_1.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_176_2.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_176_3.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_176_4.png)\n\
