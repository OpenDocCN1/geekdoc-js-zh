  md: "**180**   Chapter 9\n\n*Figure 9-3: An equilateral triangle (left) with an\
    \ upside-down triangle added to form a *\n\n*Sierpi**ń**ski triangle, with additional\
    \ triangles recursively added*\n\nAn interesting thing happens when you draw the\
    \ inner, upside-down \n\ntriangle. You form three new, right-side-up equilateral\
    \ triangles. Inside \n\neach of these three triangles, you can draw another upside-down\
    \ triangle, \n\nwhich will create nine triangles. This recursion can continue\
    \ forever math­\n\nematically, though in reality your pen won’t be able to keep\
    \ drawing tinier \n\ntriangles.\n\nThis property, describing a full object that\
    \ is similar to a part of itself, \n\nis called *self-similarity*. Recursive functions\
    \ can produce these objects, since \n\nthey “call” themselves again and again.\
    \ Practically, this code must hit a base \n\ncase eventually, but mathematically,\
    \ these shapes have infinite resolution: \n\nyou could theoretically zoom in on\
    \ the shape forever.\n\nLet’s write a recursive program to create the Sierpiński\
    \ triangle. The \n\nrecursive drawTriangle() function will draw an equilateral\
    \ triangle, and then \n\nrecursively call this function three times to draw the\
    \ inner equilateral tri­\n\nangles, as in Figure 9-4. The midpoint() function\
    \ finds the point equidistant \n\nfrom two points passed to the function. This\
    \ will be important as the inner \n\ntriangles use these equidistant points for\
    \ their vertices.\n\n*Figure 9-4: The three inner triangles, with midpoints shown\
    \ with large dots *\n\nNote that this program calls turtle.setworldcoordinates(0,\
    \ 0, 700, 700), \n\nwhich makes the 0, 0 origin at the lower-left corner of the\
    \ window. The \n\nupper-right corner has the x, y coordinates 700, 700. The source\
    \ code for \n\n*sierpinskiTriangle.py* is as follows:\n\nimport turtle\n\nturtle.tracer(100,\
    \ 0) # Increase the first argument to speed up the drawing.\n\nturtle.setworldcoordinates(0,\
    \ 0, 700, 700)\n\nturtle.hideturtle()\n\nThe Recursive Book of Recursion (Early\
    \ Access) © 2022 by Al Sweigart"
