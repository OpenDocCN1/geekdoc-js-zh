  md: "Tail Call Optimization   **171**\n\n } else {\n\n // RECURSIVE CASE\n\n return\
    \ !isOdd(number - 1);\n\n }\n\n}\n\ndocument.write(isOdd(42) + \"<br />\");\n\n\
    document.write(isOdd(99) + \"<br />\");\n\n*\\--snip--*\n\nWe have two base cases\
    \ for isOdd(). When the number argument is 0, the \n\nfunction returns False to\
    \ indicate *even*. For simplicity, our implementation \n\nof isOdd() works for\
    \ only positive integers. The recursive case returns the \n\nopposite of isOdd(number\
    \ – 1). \n\nYou can see why this works with an example: when isOdd(42) is called,\
    \ the \n\nfunction can’t determine if 42 is even or odd but does know that the\
    \ answer \n\nis the opposite of whether 41 is odd or even. The function will return\
    \ not \n\nisOdd(41). This function call, in turn, returns the opposite Boolean\
    \ value of \n\nisOdd(40), and so on, until isOdd(0) returns False. The number\
    \ of recursive \n\nfunction calls determines the number of not operators that\
    \ act on return val­\n\nues before the final return value is returned.\n\nHowever,\
    \ this recursive function results in stack overflows for large-\n\nnumber arguments.\
    \ Calling isOdd(100000) results in 100,001 function calls \n\nwithout returning—which\
    \ far exceeds the capacity of any call stack. We can \n\nrearrange the code in\
    \ the function so that the last action of the recursive \n\ncase is returning\
    \ the results of the recursive function call, making the func­\n\ntion tail recursive.\
    \ We do this in isOddTailCall() in *isOdd.py*. Here is the rest \n\nof the *isOdd.py*\
    \ program:\n\n*Python*\n\n*\\--snip--*\n\ndef isOddTailCall(number, inversionAccum=False):\n\
    \n if number == 0:\n\n # BASE CASE\n\n return inversionAccum\n\n else:\n\n # RECURSIVE\
    \ CASE\n\n return isOddTailCall(number - 1, not inversionAccum)\n\nprint(isOddTailCall(42))\n\
    \nprint(isOddTailCall(99))\n\nThe JavaScript equivalent is in the rest of *isOdd.html*:\n\
    \n*JavaScript*\n\n*\\--snip--*\n\nfunction isOddTailCall(number, inversionAccum)\
    \ {\n\n if (inversionAccum === undefined) {\n\n inversionAccum = false;\n\n }\n\
    \n if (number === 0) {\n\n // BASE CASE\n\n return inversionAccum;\n\n } else\
