  md: "**184**   Chapter 9\n\nThe base case is reached when the rectangles of the\
    \ 3 × 3 become \n\nsmaller than six steps on a side. You can change the MIN\\\
    _SIZE constant to a \n\nlarger value to make the program reach the base case sooner.\
    \ The source \n\ncode for *sierpinskiCarpet.py* is as follows:\n\nimport turtle\n\
    \nturtle.tracer(10, 0) # Increase the first argument to speed up the drawing.\n\
    \nturtle.setworldcoordinates(0, 0, 700, 700)\n\nturtle.hideturtle()\n\nMIN\\_SIZE\
    \ = 6 # Try changing this to decrease/increase the amount of recursion.\n\nDRAW\\\
    _SOLID = True\n\ndef isTooSmall(width, height):\n\n # Determine if the rectangle\
    \ is too small to draw.\n\n return width < MIN\\_SIZE or height < MIN\\_SIZE\n\
    \ndef drawCarpet(x, y, width, height):\n\n # The x and y are the lower-left corner\
    \ of the carpet.\n\n # Move the pen into position.\n\n turtle.penup()\n\n turtle.goto(x,\
    \ y)\n\n # Draw the outer rectangle.\n\n turtle.pendown()\n\n if DRAW\\_SOLID:\n\
    \n turtle.fillcolor('black')\n\n turtle.begin\\_fill()\n\n turtle.goto(x, y +\
    \ height)\n\n turtle.goto(x + width, y + height)\n\n turtle.goto(x + width, y)\n\
    \n turtle.goto(x, y)\n\n if DRAW\\_SOLID:\n\n turtle.end\\_fill()\n\n turtle.penup()\n\
    \n # Draw the inner rectangles.\n\n drawInnerRectangle(x, y, width, height)\n\n\
    def drawInnerRectangle(x, y, width, height):\n\n if isTooSmall(width, height):\n\
    \n # BASE CASE\n\n return\n\n else:\n\n # RECURSIVE CASE\n\n oneThirdWidth = width\
    \ / 3\n\n oneThirdHeight = height / 3\n\n twoThirdsWidth = 2 \\* (width / 3)\n\
    \n twoThirdsHeight = 2 \\* (height / 3)\n\nThe Recursive Book of Recursion (Early\
    \ Access) © 2022 by Al Sweigart"
