  md: "**1**\n\n**W H AT I S R ECU R S ION?**\n\nRecursion has an intimidating reputation.\
    \ \n\nIt’s considered hard to understand, but \n\nat its core, it depends on only\
    \ two things: \n\n­function calls and stack data structures. \n\nMost new programmers\
    \ trace through what a program does by follow­\n\ning the execution. It’s an easy\
    \ way to read code: you just put your finger \n\non the line of code at the top\
    \ of the program and move down. Sometimes \n\nyour finger will loop back; other\
    \ times, it will jump into a function and later \n\nreturn. This makes it easy\
    \ to visualize what a program does and in what \n\norder.\n\nBut to understand\
    \ recursion, you need to become familiar with a less \n\nobvious data structure,\
    \ called a *stack*, that controls the program’s flow of \n\nexecution. Most programming\
    \ beginners don’t know about stacks, because \n\nprogramming tutorials often don’t\
    \ even mention them when discussing \n\nfunction calls. Furthermore, the call\
    \ stack that automatically manages func­\n\ntion calls doesn’t appear anywhere\
    \ in the source code. \n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_28_0.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_28_1.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_28_2.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_28_3.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_28_4.png)\n\
    \n**T H E R E C U R S I V E **\n\n**B O O K O F **\n\n**R E C U R S I O N**\n\n\
