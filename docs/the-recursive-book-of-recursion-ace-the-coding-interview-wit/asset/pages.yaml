  md: "**54**   Chapter 3\n\nThe base case returns True because a zero- or one-character\
    \ string is \n\nalways a palindrome. Otherwise, the string argument is broken\
    \ into three \n\npieces: the first character 1, the last character 3, and the\
    \ middle charac­\n\nters between them 2.\n\nThe return statement in the recursive\
    \ case 4 makes use of *Boolean *\n\n*short-circuiting*, a feature of almost every\
    \ programming language. In an \n\nexpression joined with the and or && Boolean\
    \ operators, if the left-side \n\nexpression is False, it doesn’t matter if the\
    \ right-side expression is True or \n\nFalse because the entire expression will\
    \ be False. Boolean short-circuiting \n\nis an optimization that skips the evaluation\
    \ of the right-side expression of \n\nan and operator if the left side is False.\
    \ So in the expression head == last and \n\nisPalindrome(middle), if head == last\
    \ is False, the recursive call to isPalin­\n\ndrome() is skipped. This means that\
    \ as soon as the head and last strings don’t \n\nmatch, the recursion stops and\
    \ simply returns False.\n\nThis recursive algorithm is still sequential, like\
    \ the summation and \n\nreverse-string functions in the previous sections, except\
    \ that instead of \n\ngoing from the start of the data to the end, it goes from\
    \ both ends of the \n\ndata toward the middle. The iterative version of this algorithm\
    \ that uses a \n\nsimple loop is more straightforward. We cover the recursive\
    \ version in this \n\nbook because it’s a common coding interview problem.\n\n\
    **Solving the Tower of Hanoi**\n\nThe *Tower of Hanoi* is a puzzle involving a\
    \ tower of stacked disks. The puzzle \n\nbegins with the largest disk on the bottom,\
    \ and the disk sizes decrease \n\ngoing up. Each disk has a hole in its center\
    \ so the disks can be stacked on \n\ntop of one another on a pole. Figure 3-4\
    \ shows a wooden Tower of Hanoi \n\npuzzle.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_79_0.png)\n\
    \n*Figure 3-4: A wooden Tower of Hanoi puzzle set*\n\nThe Recursive Book of Recursion\
    \ (Early Access) © 2022 by Al Sweigart"
