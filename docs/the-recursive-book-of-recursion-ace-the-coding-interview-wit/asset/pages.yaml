  md: "**IN T ROD U C T ION**\n\nThe programming technique of recursion \n\ncan produce\
    \ elegant code solutions. More \n\noften, however, it produces confused pro­\n\
    \ngrammers. This doesn’t mean programmers \n\ncan (or should) ignore recursion.\
    \ Despite its reputa­\n\ntion for being challenging, recursion is an important\
    \ \n\ncomputer science topic and can yield keen insights \n\ninto programming\
    \ itself. At the very least, knowing \n\nrecursion can help you nail a coding\
    \ job interview.\n\nIf you’re a student with an interest in computer science,\
    \ recursion is a \n\nnecessary hurdle you’ll have to overcome to understand many\
    \ popular algo­\n\nrithms. If you’re a programming bootcamp graduate or self-taught\
    \ program­\n\nmer who managed to bypass the more theoretical computer science\
    \ topics, \n\nrecursion problems are still sure to come up during whiteboard coding\
    \ \n\ninterviews. And if you’re an experienced software engineer who has never\
