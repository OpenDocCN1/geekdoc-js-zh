  md: "**292**   Chapter 14\n\n else:\n\n # Make the resized height match the height\
    \ of the magenta area:\n\n heightRatio = magentaHeight / baseImageHeight\n\n resizedImage\
    \ = baseImage.resize((int(baseImageWidth \\* \n\n heightRatio) + 1, magentaHeight),\
    \ Image.NEAREST)\n\nIf the base image’s aspect ratio is less than the magenta\
    \ area’s aspect \n\nratio, the resized image’s width should match the width of\
    \ the magenta \n\narea. If the base image’s aspect ratio is greater, the resized\
    \ image’s height \n\nshould match the height of the magenta area. We then determine\
    \ the other \n\ndimension by multiplying the base image’s height by the width\
    \ ratio, or the \n\nbase image’s width by the height ratio. This ensures that\
    \ the resized image \n\nboth completely covers the magenta area and remains proportional\
    \ to its \n\noriginal aspect ratio.\n\nWe call the resize() method once to produce\
    \ a new Pillow Image object \n\nresized to match either the width of the base\
    \ image or the height of the \n\nbase image. The first argument is a (width, height)\
    \ tuple for the new \n\nimage’s size. The second argument is the Image.NEAREST\
    \ constant from the \n\nPillow library that tells the resize() method to use the\
    \ nearest neighbor \n\nalgorithm when resizing the image. This prevents the resize()\
    \ method from \n\nblending the colors of the pixels to produce a smooth image.\n\
    \nWe don’t want this, because it could blur the magenta pixels with neigh­\n\n\
    boring non-magenta pixels in the resized image. Our makeDroste() function \n\n\
    relies on detecting magenta pixels with the exact RGB color of (255, 0, 255) \n\
    \nand would ignore these slightly off magenta pixels. The end result would \n\n\
    be a pinkish outline around the magenta areas that would ruin our image. \n\n\
    The nearest neighbor algorithm doesn’t do this blurring, leaving our \n\nmagenta\
    \ pixels exactly at the (255, 0, 255) magenta color.\n\n**Recursively Placing\
    \ the Image Within the Image**\n\nOnce the base image has been resized, we can\
    \ place the resized image over \n\nthe base image. But the pixels from the resized\
    \ image should be placed over \n\nonly magenta pixels in the base image. The resized\
    \ image will be placed \n\nsuch that the top-left corner of the resized image\
    \ is at the top-left corner of \n\nthe magenta area:\n\n*Python*\n\n # Replace\
    \ the magenta pixels with the smaller, resized image:\n\n for x in range(magentaLeft,\
    \ magentaRight + 1):\n\n for y in range(magentaTop, magentaBottom + 1):\n\n if\
    \ baseImage.getpixel((x, y)) == magentaColor:\n\n pix = resizedImage.getpixel((x\
    \ - magentaLeft, y - magentaTop))\n\n baseImage.putpixel((x, y), pix)\n\nTwo nested\
    \ for loops iterate over every pixel in the magenta area. \n\nRemember that the\
    \ magenta area does not have to be a perfect rectangle, \n\nso we check whether\
    \ the pixel at the current coordinates is magenta. If so, \n\nwe get the pixel\
    \ color from the corresponding coordinates in the resized \n\nThe Recursive Book\
    \ of Recursion (Early Access) © 2022 by Al Sweigart"
