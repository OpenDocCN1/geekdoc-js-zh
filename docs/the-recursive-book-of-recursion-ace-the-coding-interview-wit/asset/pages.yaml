    \ and then set the nextX and nextY variables with \n\nthe coordinates of the neighboring\
    \ space in this direction.\n\nAfter this, we add the x, y coordinates of nextX\
    \ and nextY to the has­\n\nVisited list or array before making the recursive call\
    \ for this neighbor­\n\ning space. In this way, the visit() function continues\
    \ to visit neighboring \n\nspaces, carving out the maze hallways by setting locations\
    \ in maze to EMPTY. \n\nThe connecting hallway between the current space and neighboring\
    \ space \n\nis also set to EMPTY.\n\nWhen no neighbors exist, the base case simply\
    \ returns to an earlier \n\nlocation. In the visit() function, the execution jumps\
    \ back to the start of \n\nthe while loop. The code in the while loop again checks\
    \ which neighbor­\n\ning spaces haven’t been visited and makes a recursive visit()\
    \ call on one of \n\nthem, or returns if all neighboring spaces have already been\
    \ visited.\n\nAs the maze fills up with hallways and each space has been visited,\
    \ the \n\nrecursive calls will continue to return until the original visit() function\
    \ \n\ncall returns. At this point, the maze variable contains the completely gener­\n\
    \nated maze.\n\n**Starting the Chain of Recursive Calls**\n\nThe recursive visit()\
