  md: "Divide-and-Conquer Algorithms   **119**\n\n**The Algebra Behind the Karatsuba\
    \ Algorithm**\n\nThese steps may seem like magic, so let’s dive into the algebra\
    \ that shows \n\nwhy they work. Let’s use 1357 for *x* and 2468 for *y* as the\
    \ integers we want to \n\nmultiply. Let’s also consider a new variable *n*, for\
    \ the number of digits in *x* \n\nor *y*. Since *a* is 13 and *b* is 57, we can\
    \ calculate the original *x* as 10^(n/2) × *a* + *b*, \n\nwhich is 10² × 13 +\
    \ 57 or 1300 + 57, or 1357. Similarly, *y* is the same as 10^(n/2) × \n\n*c* +\
    \ *d*.\n\ncomp: In the preceding and next paragraph, in the 10^(n/2) and 10^n,\
    \ the n should also be italic\n\nThis means that the product of *x* × *y* = (10^(n/2)\
    \ × *a* + *b*) × (10^(n/2) × *c* + *d*). \n\nDoing a bit of algebra, we can rewrite\
    \ this equation as *x* × *y* = 10^n × *ac* + \n\n10^(n/2) × (*ad* + *bc*) + *bd*.\
    \ With our example numbers, this means 1357 × 2468 = \n\n10,000 × (13 × 24) +\
    \ 100 × (13 × 68 + 57 × 24) + (57 × 68). Both sides of this \n\nequation evaluate\
    \ to 3,349,076.\n\nWe’ve broken the multiplication of *xy* into the multiplications\
    \ of *ac*, \n\n*ad*, *bc*, and *bd*. This forms the basis of our recursive function:\
    \ we’ve defined \n\nthe multiplication of *x* and *y* by using multiplication\
    \ of smaller numbers \n\n(remember, *a*, *b*, *c*, and *d* are half the digits\
    \ of *x* or *y*) that approach the base \n\ncase of multiplying single-digit numbers.\
    \ And we can perform single-digit \n\nmultiplication with a lookup table rather\
    \ than multiplying.\n\nSo we need to recursively compute *ac* (the first step\
    \ of the Karatsuba \n\nalgorithm) and *bd* (the second step). We also need to\
    \ calculate (*a* + *b*)(*c* + *d*) \n\nfor the third step, which we can rewrite\
    \ as *ac* + *ad* + *bc* + *bd*. We already have \n\n*ac* and *bd* from the first\
    \ two steps, so subtracting those gives us *ad* + *bc*. This \n\nmeans we need\
    \ only one multiplication (and one recursive call) to calculate \n\n(*a* + *b*)(*c*\
    \ + *d*) instead of two to calculate *ad* + *bc*. And *ad* + *bc* is needed for\
    \ \n\nthe 10^(n/2) × (*ad* + *bc*) part of our original equation.\n\ncomp: In\
    \ the preceding and next paragraph, in the 10^(n/2) and 10^n, the n should also\
    \ be italic\n\nMultiplying by the 10^n and 10^(n/2) powers of 10 can be done by\
    \ padding \n\nzero digits: for example, 10,000 × 123 is 1,230,000. So, there’s\
    \ no need to \n\nmake recursive calls for those multiplications. In the end, multiplying\
    \ *x* × *y* \n\ncan be broken into multiplying three smaller products with three\
    \ recursive \n\ncalls: karatsuba(a, c), karatsuba(b, d), and karatsuba((a + b),\
    \ (c + d)).\n\nWith some careful study of this section, you can understand the\
    \ algebra \n\nbehind the Karatsuba algorithm. What I can’t understand is how Anatoly\
    \ \n\nKaratsuba was clever enough to devise this algorithm in less than a week\
    \ as \n\na 23-year-old student in the first place.\n\n**Summary**\n\nDividing\
    \ problems into smaller, self-similar problems is at the heart of \n\nrecursion,\
    \ making these divide-and-conquer algorithms especially suited \n\nfor recursive\
    \ techniques. In this chapter, we created a divide-and-conquer \n\nversion of\
    \ Chapter 3’s program for summing numbers in an array. One ben­\n\nefit of this\
    \ version is that upon dividing a problem into multiple subprob­\n\nlems, the\
    \ subproblems can be farmed out to other computers to work on in \n\nparallel.\n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
