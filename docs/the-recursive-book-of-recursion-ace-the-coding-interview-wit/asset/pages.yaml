  md: "**94**   Chapter 5\n\nKaratsuba multiplication algorithm, developed in 1960,\
    \ that laid the basis \n\nfor computer hardware’s fast integer multiplication.\n\
    \n**Binary Search: Finding a Book in an Alphabetized Bookshelf**\n\nLet’s say\
    \ you have a bookshelf of 100 books. You can’t remember which \n\nbooks you have\
    \ or their exact locations on the shelf, but you do know that \n\nthey are sorted\
    \ alphabetically by title. To find your book *Zebras: The Complete *\n\n*Guide*,\
    \ you wouldn’t start at the beginning of the bookshelf, where *Aaron *\n\n*Burr\
    \ Biography* is, but rather toward the end of the bookshelf. Your zebra \n\nbook\
    \ wouldn’t be the very last book on the shelf if you also had books on \n\nzephyrs,\
    \ zoos, and zygotes, but it would be close. Thus, you can use the facts \n\nthat\
    \ the books are in alphabetical order and that *Z* is toward the end of the \n\
    \nalphabet as *heuristics*, or approximate clues, to look toward the end of the\
    \ \n\nshelf rather than the beginning.\n\n*Binary search* is a technique for locating\
    \ a target item in a sorted list \n\nby repeatedly determining which half of the\
    \ list the item is in. The most \n\nimpartial way to search the bookshelf is to\
    \ start with a book in the middle, \n\nand then ascertain if the target book you’re\
    \ looking for is in the left half or \n\nthe right half.\n\nYou can then repeat\
    \ this process, as shown in Figure 5-1: look at the \n\nbook in the middle of\
    \ your chosen half and then determine whether your \n\ntarget book is in the left-side\
    \ quarter or the right-side quarter. You can do \n\nthis until you either find\
    \ the book, or find the place where the book should \n\nbe but isn’t and declare\
    \ that the book doesn’t exist on the shelf.\n\nA\n\nZ\n\nA\n\nZ\n\nA\n\nZ\n\n\
