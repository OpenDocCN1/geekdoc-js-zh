  md: "**272**   Chapter 13\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_297_0.png)\n\
    \n*Figure 13-8: Each step of the Four Corners example from left to right, top\
    \ to bottom. Each square recursively *\n\n*produces four more squares at its corners,\
    \ with colors alternating between white and gray.*\n\nTo determine the x-coordinate\
    \ of the next square, the first dictionary’s \n\nxChange value, \\-0.5 in this\
    \ case, is multiplied by the size. When size is 350, \n\nthis means the next square\
    \ has an x-coordinate of \\-175 units relative to the \n\nturtle’s current position.\
    \ This xChange value and the yChange key’s value of \n\n0.5 places the next square’s\
    \ position a distance of 50 percent of the current \n\nsquare’s size, to the left\
    \ and above the current square’s position. This hap­\n\npens to center it on the\
    \ top-left corner of the current square.\n\nIf you look at the three other dictionaries\
    \ in the specs list, you’ll notice \n\nthey all have a sizeChange value of 0.5.\
    \ The difference between them is that \n\ntheir xChange and yChange values place\
    \ them in the other three corners of the \n\ncurrent square. As a result, the\
    \ next four squares are drawn centered on the \n\nfour corners of the current\
    \ square.\n\nThe dictionaries in the specs list for this example don’t have an\
    \ \n\nangleChange value, so this value defaults to 0.0 degrees. A positive angleChange\
    \ \n\nvalue indicates a counterclockwise rotation, while a negative value indicates\
    \ \n\na clockwise rotation.\n\nEach dictionary represents a separate square to\
    \ be drawn each time the \n\nrecursive function is called. If we were to remove\
    \ the first dictionary from \n\nthe specs list, each drawFractal() call would\
    \ produce only three squares, as in \n\nFigure 13-9.\n\nThe Recursive Book of\
    \ Recursion (Early Access) © 2022 by Al Sweigart"
