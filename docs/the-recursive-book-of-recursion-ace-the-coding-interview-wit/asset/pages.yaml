  md: "Divide-and-Conquer Algorithms   **97**\n\n**BIG O ALGORITHM ANALYSIS**\n\n\
    If your data is already in sorted order, performing a binary search is much \n\
    \nfaster than a *linear search*, which starts from one end of an array and checks\
    \ \n\neach value in a brute-force manner. We can compare the efficiency of these\
    \ \n\ntwo algorithms with *big O algorithm analysis*. The “Further Reading” section\
    \ on \n\npage xx has links to more information on this topic.\n\nIf your data\
    \ isn’t in sorted order, sorting it first (using an algorithm such as \n\nquicksort\
    \ or merge sort) and then performing a binary search would be slower \n\nthan\
    \ just performing a linear search. However, if you need to perform repeat \n\n\
    searches on the data, the performance gain of binary search pays for the sort­\n\
    \ning. It’s like spending an hour to sharpen an axe before cutting down trees;\
    \ the \n\nincreased speed of chopping with a sharp axe makes up for the hour spent\
    \ \n\nsharpening it.\n\n**Quicksort: Splitting an Unsorted Pile of Books into\
    \ **\n\n**Sorted Piles**\n\nRemember that binarySearch()’s speed advantage comes\
    \ from the fact that \n\nthe values in items are sorted. If the values are out\
    \ of order, the algorithm \n\nwon’t work. Enter *quicksort*, a recursive sorting\
    \ algorithm developed by com­\n\nputer scientist Tony Hoare in 1959.\n\nQuicksort\
    \ uses a divide-and-conquer technique called *partitioning*. \n\nThink of partitioning\
    \ this way: imagine you have a large pile of unalphabet­\n\nized books. Grabbing\
    \ one book and placing it in the right spot on the shelf \n\nmeans you’ll spend\
    \ a lot of time rearranging the bookshelf as it gets full. It \n\nwould help if\
    \ you first turned the pile of books into two piles: an *A* to *M* pile \n\nand\
    \ an *N* to *Z* pile. (In this example, *M* would be our *pivot*.)\n\nYou haven’t\
    \ sorted the pile, but you have *partitioned* it. And partition­\n\ning is easy:\
    \ the book doesn’t have to go into the correct place in one of \n\nthe two piles,\
    \ it just has to go into the correct pile. Then you can further \n\npartition\
    \ these two piles into four piles: *A* to *G*, *H* to *M*, *N* to *T*, and *U*\
    \ to *Z*. \n\nThis is shown in Figure 5-2. If you keep partitioning, you end up\
    \ with piles \n\nthat contain one book each (the base case), and the piles are\
    \ now in sorted \n\norder. This means the books are now in sorted order as well.\
    \ This repeated \n\npartitioning is how quicksort works. \n\nFor the first partitioning\
    \ of *A* to *Z*, we select *M* as the pivot value \n\nbecause it’s the middle\
    \ letter between *A* and *Z*. However, if our collection \n\nof books consisted\
    \ of 1 book about Aaron Burr and 99 books about zebras, \n\nzephyrs, zoos, zygotes,\
    \ and other *Z* topics, our two partitioned piles would \n\nbe heavily unbalanced.\
    \ We would have the single Aaron Burr book in the *A* \n\nto *M* pile and every\
    \ other book in the *M* to *Z* pile. The quicksort algorithm \n\nworks fastest\
    \ when the partitions are evenly balanced, so selecting a good \n\npivot value\
    \ at each partition step is important.\n\nThe Recursive Book of Recursion (Early\
    \ Access) © 2022 by Al Sweigart"
