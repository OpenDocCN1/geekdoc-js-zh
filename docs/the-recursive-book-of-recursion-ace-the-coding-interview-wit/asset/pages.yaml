  md: "**286**   Chapter 14\n\n resizedImage = baseImage.resize((int(baseImageWidth\
    \ \\* \n\n heightRatio) + 1, magentaHeight), Image.NEAREST)\n\n # Replace the\
    \ magenta pixels with the smaller, resized image:\n\n for x in range(magentaLeft,\
    \ magentaRight + 1):\n\n for y in range(magentaTop, magentaBottom + 1):\n\n if\
    \ baseImage.getpixel((x, y)) == magentaColor:\n\n pix = resizedImage.getpixel((x\
    \ - magentaLeft, y - magentaTop))\n\n baseImage.putpixel((x, y), pix)\n\n # RECURSIVE\
