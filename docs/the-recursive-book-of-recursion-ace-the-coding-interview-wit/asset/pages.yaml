  md: "**266**   Chapter 13\n\non the size parameter, like turtle.forward(size) or\
    \ turtle.forward(size \\* 2). \n\nIn Python’s turtle module, turtle.forward(1)\
    \ moves the turtle by one *unit*, \n\nwhich is not necessarily the same as one\
    \ pixel.\n\nThe shape-drawing functions’ second parameter is the recursive depth\
    \ \n\nof drawFractal(). The original call to drawFractal() has the depth parameter\
    \ \n\nset to 0. Recursive calls to drawFractal() use depth + 1 as the depth param­\n\
    \neter. In the Wave fractal, the first triangle in the center of the window has\
    \ \n\na depth argument of 0. The three triangles created next have a depth of\
    \ 1. \n\nThe nine triangles around those three triangles have a depth of 2, and\
    \ so \n\non.\n\nYour shape-drawing function can ignore this argument, but using\
    \ it can \n\ncause interesting variations to the basic shape. For example, the\
    \ drawFilled­\n\nSquare() shape-drawing function uses depth to alternate between\
    \ drawing \n\nwhite squares and gray squares. Keep this in mind if you’d like\
    \ to create \n\nyour own shape-drawing functions for the Fractal Art Maker program,\
    \ as \n\nthey must accept a size and depth argument. \n\n***The drawFilledSquare()\
    \ Function***\n\nThe drawFilledSquare() function draws a filled-in square with\
    \ sides of length \n\nsize. To color the square, we use the turtle module’s turtle.begin\\\
    _fill() and \n\nturtle.end\\_fill() functions to make the square either white\
    \ or gray, with \n\na black border, depending on whether the depth argument is\
    \ even or odd. \n\nBecause these squares are filled in, any squares drawn on top\
    \ of them later \n\nwill cover them.\n\nLike all shape-drawing functions for the\
    \ Fractal Art Maker program, \n\ndrawFilledSquare() accepts a size and depth parameter:\n\
    \ndef drawFilledSquare(size, depth):\n\n size = int(size)\n\nThe size argument\
    \ could be a floating-point number with a fractional \n\npart, which sometimes\
    \ causes the turtle module to make slightly asym­\n\nmetrical and uneven drawings.\
    \ To prevent this, the first line of the function \n\nrounds size down to an integer.\n\
    \nWhen the function draws the square, it assumes the turtle is in the cen­\n\n\
    ter of the square. Thus, the turtle must first move to the top-right corner of\
    \ \n\nthe square, relative to its initial heading:\n\n*Python*\n\n # Move to the\
    \ top-right corner before drawing:\n\n turtle.penup()\n\n turtle.forward(size\
    \ // 2)\n\n turtle.left(90)\n\n turtle.forward(size // 2)\n\n turtle.left(180)\n\
    \n turtle.pendown()\n\nThe drawFractal() function always has the pen down and\
    \ ready to draw \n\nwhen the shape-drawing function is called, so drawFilledSquare()\
    \ must call \n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
