  md: "**130**   Chapter 6\n\n**Getting Permutations with Nested Loops: **\n\n**A\
    \ Less-Than-Ideal Approach**\n\nLet’s say we have a simple bicycle lock, as in\
    \ Figure 6-3, with a four-digit \n\ncombination. The combination has 10,000 possible\
    \ permutations of digits \n\n(0000 to 9999), but only one will unlock it. (They\
    \ are called *combination *\n\n*locks*; however, in this context it’d be more\
    \ accurate to call them *permuta­*\n\n*tions with repetition*, since the order\
    \ matters.) \n\nNow let’s say we have a much simpler lock with only the five letters\
    \ A to \n\nE. We can calculate the number of possible combinations as 5⁴, or 5\
    \ × 5 × \n\n5 × 5, or 625. A combination lock of *k* characters, each character\
    \ selected \n\nfrom a set of *n* possibilities, is *n*^(*k*). But getting a list\
    \ of the combinations \n\nthemselves is a bit more involved.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_155_0.png)\n\
    \n*Figure 6-3: A four-digit combination bicycle lock has 4*^(*10*)*, or 10,000,\
    \ possible permuta­*\n\n*tions with repetition.*\n\nOne way to get permutations\
    \ with repetition is with *nested loops*—that \n\nis, a loop within another loop.\
    \ The inner loop goes through every element \n\nin a set, while the outer loop\
    \ does the same while repeating the inner loop. \n\nCreating all possible *k*\\\
    -character permutations, each character selected \n\nfrom a set of *n* possibilities,\
    \ requires *k* nested loops.\n\nFor example, *nestedLoopPermutations.py* contains\
    \ code that generates all \n\n3-combinations of {A, B, C, D, E}:\n\nfor a in \\\
    ['A', 'B', 'C', 'D', 'E'\\]:\n\n for b in \\['A', 'B', 'C', 'D', 'E'\\]:\n\n for\
    \ c in \\['A', 'B', 'C', 'D', 'E'\\]:\n\n for d in \\['A', 'B', 'C', 'D', 'E'\\\
    ]:\n\n print(a, b, c, d)\n\nThe Recursive Book of Recursion (Early Access) © 2022\
    \ by Al Sweigart"
