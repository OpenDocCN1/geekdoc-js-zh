  md: "Permutations and Combinations   **125**\n\npermutations *without* *replacement*,\
    \ because each element doesn’t appear in \n\nthe permutation more than once. \n\
    \nA *combination* is a selection of elements of a set. More formally, a *k-com­*\n\
    \n*bination* is a subset of *k* elements from a set. Unlike permutations, combina­\n\
    \ntions don’t have an ordering. For example, the 2-combinations of the set {A,\
    \ \n\nB, C} are {A, B}, {A, C}, and {B, C}. The 3-combination of the set {A, B,\
    \ C} is \n\n{A, B, C}.\n\nThe term *n choose k* refers to the number of possible\
    \ combinations \n\n(without repetition) of *k* elements that can be selected from\
    \ a set of *n* ele­\n\nments. (Some mathematicians use the term *n choose r*.)\
    \ This concept has \n\nnothing to do with the elements themselves, just the number\
    \ of them. For \n\nexample, 4 choose 2 is 6, because there are six ways to choose\
    \ two elements \n\nfrom a set of four elements like {A, B, C, D}: {A, B}, {A,\
    \ C}, {A, D}, {B, C}, {B, \n\nD}, and {C, D}. Meanwhile, 3 choose 3 is 1, because\
    \ there’s only one 3-com­\n\nbination from a set of three elements like {A, B,\
    \ C}; that is, {A, B, C} itself. \n\nThe formula for calculating *n* choose *k*\
    \ is (*n!*) / (*k*! × (*n* – *k*)!). Recall that *n*! \n\nis the notation for\
    \ factorials: 5! is 5 × 4 × 3 × 2 × 1.\n\nThe term *n multichoose k* refers to\
    \ the number of possible combinations \n\n*with repetition* of *k* elements that\
    \ can be selected from a set of *n* elements. \n\nBecause *k*\\-combinations are\
    \ sets and sets do not have duplicate elements, a \n\n*k*\\-combination does not\
    \ have repetition. When we use *k*\\-combinations with \n\nduplicate elements,\
    \ we specifically call them *k-combinations with repetition*. \n\nKeep in mind\
    \ that, both with and without repetition, you can think \n\nof permutation as\
    \ a certain arrangement of all elements in a set, while \n\na combination is an\
    \ orderless selection of certain elements from a set. \n\nPermutations have an\
    \ ordering and use all the elements from a set, while \n\ncombinations don’t have\
    \ an ordering and use any number of elements from \n\na set. To get a better idea\
    \ of these terms, Table 6-1 shows the difference \n\nbetween permutations and\
    \ combinations, with and without repetition, of \n\nthe set {A, B, C}.\n\nTable 6-1:\
    \ All Possible Permutations and Combinations, with and without Repetition, \n\n\
    of the Set {A. B. C}\n\nPermutations\n\nCombinations\n\nWithout repetition\n\n\
    ABC, ACB, BAC, BCA, CAB\n\n(None), A, B, C, AB, AC, BC, \n\nABC\n\nWith repetition\n\
    \nAAA, AAB, AAC, ABA, ABB, \n\nABC, ACA, ACB, ACC, BAA, \n\nBAB, BAC, BBA, BBB,\
    \ BBC, \n\nBCA, BCB, BCC, CAA, CAB, \n\nCAC, CBA, CBB, CBC, CCA, \n\nCCB, CCC\n\
    \n(None), A, B, C, AA, AB, AC, \n\nBB, BC, CC, AAA, AAB, AAC, \n\nABB, ABC, ACC,\
    \ BBB, BBC, \n\nBCC, CCC\n\nIt’s surprising how fast the number of permutations\
    \ and combinations \n\ngrows as we add elements to a set. This *combinatorial\
    \ explosion* is captured \n\nby the formulas in Table 6-2. For example, a set\
    \ of 10 elements has 10!, or \n\n3,628,800, possible permutations, but a set of\
    \ twice as many elements has \n\n20!, or 2,432,902,008,176,640,000, permutations.\n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
