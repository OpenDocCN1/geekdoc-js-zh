  md: "Classic Recursion Algorithms   **65**\n\nfind these iterative flood fill algorithms\
    \ implemented in *floodFillIterative.py* \n\nand *floodFillIterative.html* in\
    \ the downloadable resources at *https://nostarch.*\n\n*com/recursive-book-recursion*.\n\
    \n**Using the Ackermann Function**\n\nThe *Ackermann function* is named after\
    \ its discoverer, Wilhelm Ackermann. \n\nA student of mathematician David Hilbert\
    \ (whose Hilbert curve fractal \n\nwe discuss in Chapter 9), Ackermann published\
    \ his function in 1928. \n\nMathematicians Rózsa Péter and Raphael Robinson later\
    \ developed the ver­\n\nsion of the function featured in this section. \n\nWhile\
    \ the Ackermann function has some application in advanced \n\nmathematics, it\
    \ is mostly known for being an example of a highly recursive \n\nfunction. Even\
    \ slight increases to its two integer arguments cause a large \n\nincrease in\
    \ the number of recursive calls it makes.\n\nThe Ackermann function takes two\
    \ arguments, m and n, and has a base \n\ncase of returning n + 1 when m is 0.\
    \ There are two recursive cases: when n \n\nis 0, the function returns ackermann(m\
    \ – 1, 1), and when n is greater than \n\n0, the function returns ackermann(m\
    \ – 1, ackermann(m, n – 1)). These cases \n\nlikely aren’t meaningful to you,\
    \ but suffice it to say, the number of recursive \n\ncalls the Ackermann function\
    \ makes grows quickly. Calling ackermann(1, 1) \n\nresults in three recursive\
    \ function calls. Calling ackermann(2, 3) results in 43 \n\nrecursive function\
    \ calls. Calling ackermann(3, 5) results in 42,437 recursive \n\nfunction calls.\
    \ And calling ackermann(5, 7) results in . . . well, actually I don’t \n\nknow\
    \ how many recursive function calls, because it would take several times \n\n\
    the age of the universe to calculate.\n\nLet’s answer the three questions we ask\
    \ when constructing recursive \n\nalgorithms:\n\n**What is the base case?   **\
    \ When m is 0.\n\n**What arguments are passed to the recursive function call? \
    \  ** Either m \n\nor m – 1 is passed for the next m parameter; and 1, n – 1,\
    \ or the return \n\nvalue of ackermann(m, n – 1) is passed for the next n parameter.\n\
    \n**Do these arguments become closer to the base case?   ** Yes, because the \n\
    \nm argument is always either decreasing or staying the same size, so it will\
    \ \n\neventually reach 0.\n\nHere is an *ackermann.py* Python program:\n\ndef\
    \ ackermann(m, n, indentation=None):\n\n if indentation is None:\n\n indentation\
    \ = 0\n\n print('%sackermann(%s, %s)' % (' ' \\* indentation, m, n))\n\n if m\
    \ == 0:\n\n # BASE CASE\n\n return n + 1\n\n elif m > 0 and n == 0:\n\n # RECURSIVE\
    \ CASE\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
