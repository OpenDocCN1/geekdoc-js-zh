  md: "Fractal Art Maker   **259**\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_284_0.png)\n\
    \n*Figure 13-2: The results of calling **drawFilledSquare()** (left) and **drawTriangleOutline()**\
    \ (right) on their own*\n\n**The Fractal Art Maker Algorithm**\n\nThe Fractal\
    \ Art Maker’s algorithm has two major components: a shape-\n\ndrawing function\
    \ and the recursive drawFractal() function. \n\nThe shape-drawing function draws\
    \ a basic shape. The Fractal Art \n\nMaker program comes with the two shape-drawing\
    \ functions shown previ­\n\nously in Figure 13-2, drawFilledSquare() and drawTriangleOutline(),\
    \ but you \n\ncan also create your own. We pass a shape-drawing function to the\
    \ drawFrac­\n\ntal() function as an argument, just as we passed the match functions\
    \ to the \n\nfile finder’s walk() function in Chapter 10.\n\nThe drawFractal()\
    \ function also has a parameter indicating changes to \n\nthe size, position,\
    \ and angle of the shapes between recursive calls to draw­\n\nFractal(). We’ll\
    \ cover these specific details later in this chapter, but let’s look \n\nat one\
    \ example: fractal 7, which draws a wave. \n\nThe program produces the Wave fractal\
    \ by calling the drawTriangle­\n\nOutline() shape-drawing function, which creates\
    \ a single triangle. The \n\nadditional arguments to drawFractal() tell it to\
    \ make three recursive calls to \n\ndrawFractal(). Figure 13-3 shows the triangle\
    \ produced by the original call \n\nto drawFractal() and the triangles produced\
    \ by the three recursive calls.\n\nThe Recursive Book of Recursion (Early Access)\
    \ © 2022 by Al Sweigart"
