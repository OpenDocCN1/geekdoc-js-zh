  md: "Divide-and-Conquer Algorithms   **101**\n\nNote that a partitioned array is\
    \ not the same thing as a sorted one: \n\nalthough the two items to the left of\
    \ 42 are less than 42, and the five items to \n\nthe right of 42 are greater than\
    \ 42, the items are not in sorted order.\n\nThe bulk of the quicksort() function\
    \ is the partitioning step. To get an \n\nidea of how partitioning works, imagine\
    \ an index j that begins at the left \n\nend of the range and moves to the right\
    \ end 2. We compare the item at \n\nindex j with the pivot value and then move\
    \ right to compare the next item. \n\nThe pivot value can be arbitrarily chosen\
    \ from any value in the range, but \n\nwe’ll always use the value at the right\
    \ end of the range.\n\nImagine a second index i that also begins at the left end.\
    \ If the item \n\nat index j is less than or equal to the pivot, the items at\
    \ indexes i and j are \n\nswapped 3 and i is increased to the next index. So while\
    \ j always increases \n\n(that is, moves right) after each comparison with the\
    \ pivot value, i increases \n\nonly if the item at index j is less than or equal\
    \ to the pivot.\n\nThe names i and j are commonly used for variables that hold\
    \ array \n\nindexes. Someone else’s quicksort() implementation may instead use\
    \ j and \n\ni, or even completely different variables. The important thing to\
    \ remember \n\nis that two variables store indexes and behave as shown here.\n\
    \nAs an example, let’s work through the first partitioning of the array \n\n\\\
    [0, 7, 6, 3, 1, 2, 5, 4\\], and the range defined by left of 0 and right of 7\
    \ to \n\ncover the full size of the array. The pivot will be the value at the\
    \ right end, \n\n4. The i and j index begin at index 0, the left end of the range.\
    \ At each step, \n\nindex j always moves to the right. Index i moves only if the\
    \ value at index j \n\nis less than or equal to the pivot value. The items array,\
    \ the i index, and the \n\nj index begin as follows:\n\nitems: \\[0, 7, 6, 3,\
    \ 1, 2, 5, 4\\]\n\nIndexes: 0 1 2 3 4 5 6 7\n\n ^\n\ni = 0 i\n\nj = 0 j\n\nThe\
    \ value at index j (which is 0) is less than or equal to the pivot value \n\n\
    (which is 4), so swap the values at i and j. This results in no actual change\
    \ \n\nsince i and j are the same index. Also, increase i so it moves to the right.\
    \ \n\nThe j index increases for every comparison with the pivot value. The state\
    \ \n\nof the variables now looks like this:\n\nitems: \\[0, 7, 6, 3, 1, 2, 5,\
    \ 4\\]\n\nIndexes: 0 1 2 3 4 5 6 7\n\n ^\n\ni = 1 i\n\nj = 1 j\n\nThe Recursive\
    \ Book of Recursion (Early Access) © 2022 by Al Sweigart"
