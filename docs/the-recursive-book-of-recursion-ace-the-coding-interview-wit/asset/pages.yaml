  md: "**2**\n\n**R ECU R S ION V S. I T E R AT ION**\n\nNeither recursion nor iteration\
    \ is a superior \n\ntechnique in general. In fact, any recursive \n\ncode can\
    \ be written as iterative code with a \n\nloop and a stack. Recursion doesn’t\
    \ have some \n\nspecial power enabling it to perform calculations that \n\nan\
    \ iterative algorithm cannot. And any iterative loop \n\ncan be rewritten as a\
    \ recursive function. \n\nThis chapter compares and contrasts recursion and iteration.\
    \ We’ll \n\nlook at the classic Fibonacci and factorial functions and see why\
    \ their \n\nrecursive algorithms have critical weaknesses. We’ll also explore\
    \ the \n\ninsights a recursive approach can yield by considering an exponent algo­\n\
    \nrithm. Altogether, this chapter shines light on the supposed elegance of \n\n\
    recursive algorithms and shows when a recursive solution is useful and \n\nwhen\
    \ it is not.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_46_0.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_46_1.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_46_2.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_46_3.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_46_4.png)\n\
