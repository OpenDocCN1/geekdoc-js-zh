  md: "**4**\n\n**BACK T R ACK ING A N D T R E E **\n\n**T R AV E R S A L A L GOR\
    \ I T H M S**\n\nIn previous chapters, you learned that \n\nrecursion is especially\
    \ suited for problems \n\nthat involve a tree-like structure and back­\n\ntracking,\
    \ such as maze-solving algorithms. To \n\nsee why, consider that a tree’s trunk\
    \ splits off into \n\nmultiple branches. Those branches themselves split \n\n\
    off into other branches. In other words, a tree has a \n\nrecursive, self-similar\
    \ shape. \n\nA maze can be represented by a tree data structure, since mazes branch\
    \ \n\noff into different paths, which in turn branch off into more paths. When\
    \ \n\nyou reach a dead end in a maze, you must backtrack to an earlier branching\
    \ \n\npoint. \n\nThe task of traversing tree graphs is tightly linked with many\
    \ recursive \n\nalgorithms, such as the maze-solving algorithm in this chapter\
    \ and the \n\nmaze-generation program in Chapter 11. We’ll take a look at tree\
    \ traversal \n\nalgorithms and employ them to find certain names in a tree data\
    \ structure. \n\nWe’ll also use tree traversal for an algorithm to obtain the\
    \ deepest node in \n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_96_0.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_96_1.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_96_2.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_96_3.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_96_4.png)\n\
    \n**T H E R E C U R S I V E **\n\n**B O O K O F **\n\n**R E C U R S I O N**\n\n\
