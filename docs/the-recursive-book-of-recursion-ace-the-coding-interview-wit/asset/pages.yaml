  md: "**64**   Chapter 3\n\nWhen you run this code, the program fills the interior\
    \ of the shape \n\ndrawn by the # characters starting at coordinates 3, 3. It\
    \ replaces all of the \n\nperiod characters (.) with o characters. The output\
    \ shows the before and \n\nafter images:\n\n..########################...........\n\
    \n..#......................#...#####...\n\n..#..........########....#####...#...\n\
    \n..#..........#......#............#...\n\n..#..........########.........####...\n\
    \n..######......................#......\n\n.......#..#####.....###########......\n\
    \n.......####...#######................\n\n..########################...........\n\
    \n..#oooooooooooooooooooooo#...#####...\n\n..#oooooooooo########oooo#####ooo#...\n\
    \n..#oooooooooo#......#oooooooooooo#...\n\n..#oooooooooo########ooooooooo####...\n\
