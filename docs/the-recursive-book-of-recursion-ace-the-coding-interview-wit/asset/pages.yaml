  md: "**260**   Chapter 13\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_285_0.png)\n\
    \n*Figure 13-3: The triangle produced by the first call to **drawFractal()** (left)\
    \ and the first set of three recursive *\n\n*calls (right)*\n\nThe first recursive\
    \ call tells drawFractal() to call drawTriangleOutline() but \n\nwith a triangle\
    \ that is half the size and positioned to the top left of the pre­\n\nvious triangle.\
    \ The second recursive call produces a triangle to the top right \n\nof the previous\
    \ triangle that is 30 percent of its size. The third recursive call \n\nproduces\
    \ a triangle below the previous triangle that is half of its size and \n\nrotated\
    \ 15 degrees compared to it. \n\nEach of these three recursive calls to drawFractal()\
    \ makes three more \n\nrecursive calls to drawFractal(), producing nine new triangles.\
    \ The new tri­\n\nangles have the same changes to their size, position, and angle\
    \ relative to \n\ntheir previous triangle. The top-left triangle is always half\
    \ the size of the \n\nprevious triangle, while the bottom triangle is always rotated\
    \ 15 degrees \n\nmore. Figure 13-4 shows the triangles produced by the first and\
    \ second level \n\nof recursion.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_285_1.png)\n\
    \n*Figure 13-4: The first level of recursive calls to **drawFractal()** (left)\
    \ and the nine new triangles of the second *\n\n*level of recursive calls (right)*\n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
