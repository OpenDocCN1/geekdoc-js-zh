  md: "Recursion Vs. Iteration   **37**\n\ndoing it recursively requires only 23 multiplications\
    \ and divisions. When \n\nrunning the Python code under a performance profiler,\
    \ calculating 3^(1000) \n\niteratively 100,000 times takes 10.633 seconds, but\
    \ the recursive calculating \n\ntakes only 0.406 seconds. That is a huge improvement!\n\
    \n***Creating an Iterative Exponents Function Based on Recursive Insights***\n\
    \nOur original iterative exponents function took a straightforward approach: \n\
    \nloop the same number of times as the exponent power. However, this \n\ndoesn’t\
    \ scale well for larger powers. Our recursive implementation forced \n\nus to\
    \ think about how to break this problem into smaller subproblems. This \n\napproach\
    \ turns out to be much more efficient.\n\nBecause every recursive algorithm has\
    \ an equivalent iterative algo­\n\nrithm, we could make a new iterative exponents\
    \ function based on the \n\npower rule that the recursive algorithm uses. The\
    \ following *exponentWith­*\n\n*PowerRule.py* program has such a function:\n\n\
    *Python*\n\ndef exponentWithPowerRule(a, n):\n\n # Step 1: Determine the operations\
    \ to be performed.\n\n opStack = \\[\\]\n\n while n > 1:\n\n if n % 2 == 0:\n\n\
    \ # n is even.\n\n opStack.append('square')\n\n n = n // 2\n\n elif n % 2 == 1:\n\
    \n # n is odd.\n\n n -= 1\n\n opStack.append('multiply')\n\n # Step 2: Perform\
