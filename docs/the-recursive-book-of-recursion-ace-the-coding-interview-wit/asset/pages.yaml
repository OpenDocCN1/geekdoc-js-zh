  md: "**FOR E WOR D**\n\nWhen I was approached by Al to write the foreword to this\
    \ book, I was \n\npretty excited about the prospect. A book on recursion! Now,\
    \ that’s some­\n\nthing that you just don’t see every day. Considered by many\
    \ to be one of the \n\nmore mysterious topics in programming, the use of recursion\
    \ is often dis­\n\ncouraged. Oddly, this stands in stark contrast to its storied\
    \ use in weird job \n\ninterview questions. \n\nHowever, there are all sorts of\
    \ practical reasons to learn about recursion. \n\nRecursive thinking is very much\
    \ a mindset about problem solving. At its core, \n\nlarger problems get broken\
    \ into smaller problems. And sometimes along the \n\nway, hard problems are rewritten\
    \ into equivalent, but easier-to-solve simple \n\nproblems. This sort of thinking\
    \ can be a useful tool when applied to software \n\ndesign—even when recursion\
    \ is not being used. Thus, it’s a worthy topic of \n\nstudy for programmers of\
    \ all skill levels. \n\nIn my unbridled excitement to say more about recursion,\
    \ I originally \n\nwrote this foreword in the form of a few short stories involving\
    \ friends who’d \n\napplied recursive thinking in different ways but achieved\
    \ a similar result. First, \n\nthere was the story of Ben, who learned about recursion,\
    \ took it too far, and \n\nsomehow managed to disappear off the face of the earth\
    \ under mysterious \n\ncircumstances after committing the following Python code\
    \ into production: \n\nresult = \\[(lambda r: lambda n: 1 if n < 2 else r(r)(n-1)\
    \ + r(r)(n-2))(\n\n (lambda r: lambda n: 1 if n < 2 else r(r)(n-1) + r(r)(n-2)))(n)\n\
    \n for n in range(37)\\]\n\nThe Recursive Book of Recursion (Early Access) © 2022\
    \ by Al Sweigart"
  merge: -1
  pgno: 16
- img_proc: true
  md: "**xvi**   Foreword\n\nThen, there was the story of Chelsea, who became so effective\
    \ at real-\n\nworld problem solving that she was promptly fired! Oh, you wouldn't\
    \ believe \n\nhow much all of the fine editors at No Starch (bless their hearts)\
    \ hated \n\nthese stories. “You can’t start a book by telling people stories like\
    \ that. It’s \n\njust going to scare everyone away!” To be fair, they probably\
    \ have a point. In \n\nfact, they *even* made me move a more reassuring paragraph\
    \ about recursion \n\nfrom later in this foreword up to the second paragraph just\
    \ so you wouldn't \n\nfirst read about the stories of Ben and Chelsea and run\
    \ away in a screaming \n\nhorror to read a book about design patterns instead.\
    \ \n\nClearly, writing the foreword to a book is serious business. So, regret­\n\
    \ntably, I’ll have to share the true stories of Ben and Chelsea with you another\
    \ \n\ntime. But, getting back to the book, it’s true that recursion is not a tech­\n\
    \nnique that gets applied to the vast majority of problems in day-to-day pro­\n\
    \ngramming. As such, it often carries an aura of magic about it. This book \n\n\
    hopes to dispel much of that. This is a good thing.\n\nFinally, as you set off\
    \ upon your recursive journey, be prepared to have \n\nyour brain bent in new\
    \ directions. Not to worry—this is normal! However, \n\nit’s also important to\
    \ stress that recursion is supposed to be a bit of fun. \n\nWell, at least a little\
    \ bit. So, enjoy the ride!\n\n—David Beazley\n\nAuthor of *Python Cookbook* and\
    \ *Python Distilled*\n\nTeacher of aspiring problem solvers\n\n*https://www.dabeaz.com*\n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
