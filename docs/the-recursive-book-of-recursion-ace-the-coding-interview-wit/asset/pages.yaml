  md: "Sliding-Tile Solver   **255**\n\nAll of this is done for each of the valid\
    \ directions. If none of the calls to \n\nattemptMove() for these directions finds\
    \ a solution before reaching the maxi­\n\nmum number of moves, the attemptMove()\
    \ function returns False.\n\n**Starting the Solver**\n\nThe solve() function is\
    \ useful for kicking off the initial call to attemptMove(), \n\nbut the program\
    \ still needs to do some setup. The Python code for this is as \n\nfollows:\n\n\
    *Python*\n\n\\# Start the program:\n\nSOLVED\\_BOARD = getNewBoard()\n\npuzzleBoard\
    \ = getNewPuzzle()\n\ndisplayBoard(puzzleBoard)\n\nstartTime = time.time()\n\n\
    The JavaScript code for this setup is as follows:\n\n*JavaScript*\n\n// Start\
    \ the program:\n\nconst SOLVED\\_BOARD = JSON.stringify(getNewBoard());\n\nlet\
    \ puzzleBoard = getNewPuzzle();\n\ndisplayBoard(puzzleBoard);\n\nlet startTime\
    \ = Date.now();\n\nFirst, the SOLVED\\_BOARD constant is set to an ordered, solved\
    \ board as \n\nreturned by getNewBoard(). This constant isn’t set at the top of\
    \ the source \n\ncode because the getNewBoard() function needs to be defined before\
    \ it can \n\nbe called.\n\nNext, a random puzzle is returned from getNewPuzzle()\
    \ and stored in \n\nthe puzzleBoard variable. This variable contains the puzzle\
    \ board data struc­\n\nture that will be solved. If you want to solve a specific\
    \ 15-puzzle instead of \n\na random one, you can replace the call to getNewPuzzle()\
    \ with a list or array \n\ncontaining the puzzle you do want to solve.\n\nThe\
    \ board in puzzleBoard is displayed to the user, and the current time \n\nis stored\
    \ in startTime so that the program can calculate the runtime of the \n\nalgorithm.\
    \ The Python code continues as follows:\n\n*Python*\n\nmaxMoves = 10\n\nwhile\
    \ True:\n\n if solve(puzzleBoard, maxMoves):\n\n break # Break out of the loop\
    \ when a solution is found.\n\n maxMoves += 1\n\nprint('Run in', round(time.time()\
    \ - startTime, 3), 'seconds.')\n\nThe JavaScript code is as follows:\n\nlet maxMoves\
    \ = 10;\n\nwhile (true) {\n\n if (solve(puzzleBoard, maxMoves)) {\n\n break; //\
    \ Break out of the loop when a solution is found.\n\n }\n\nThe Recursive Book\
    \ of Recursion (Early Access) © 2022 by Al Sweigart"
