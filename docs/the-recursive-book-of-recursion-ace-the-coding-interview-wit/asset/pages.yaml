  md: "**120**   Chapter 5\n\nA binary search algorithm searches a sorted array by\
    \ repeatedly narrow­\n\ning the range to search in half. While a linear search\
    \ starts searching at the \n\nbeginning and searches the entire array, a binary\
    \ search takes advantage \n\nof the array’s sorted order to home in on the item\
    \ it is looking for. The \n\nperformance improvement is so great that it may be\
    \ worthwhile to sort an \n\nunsorted array in order to enable a binary search\
    \ on its items.\n\nWe covered two popular sorting algorithms in this chapter:\
    \ quicksort \n\nand merge sort. Quicksort divides an array into two partitions\
    \ based on a \n\npivot value. The algorithm then recursively partitions these\
    \ two partitions, \n\nrepeating the process until the partitions are the size\
    \ of a single item. At \n\nthis point, the partitions, and the items in them,\
    \ are in sorted order. Merge \n\nsort takes an opposite approach. The algorithm\
    \ splits the array into smaller \n\narrays first, and then merges the smaller\
    \ arrays into sorted order afterward.\n\nFinally, we covered Karatsuba multiplication,\
    \ a recursive algorithm \n\nfor performing integer multiplication when the \\\
    * multiplication opera­\n\ntor isn’t available. This comes up in low-level hardware\
    \ programming that \n\ndoesn’t offer a built-in multiplication instruction. The\
    \ Karatsuba algorithm \n\nbreaks down multiplying two integers into three multiplications\
    \ of smaller \n\nintegers. To multiply single-digit numbers for the base case,\
    \ the algorithm \n\nstores every product from 0 × 0 to 9 × 9 in a lookup table.\n\
    \nThe algorithms in this chapter are the part of many data structure and \n\n\
    algorithm courses that freshman computer science students take. In the \n\nnext\
    \ chapter, we’ll continue to look at other algorithms at the heart of com­\n\n\
    puting with algorithms that calculate permutations and combinations.\n\n**Further\
    \ Reading**\n\nThe Computerphile channel on YouTube has videos on quicksort at\
    \ *https://*\n\n*youtu.be/XE4VP\\_8Y0BU* and merge sort at *https://youtu.be/kgBjXUE\\\
    _Nwc*. If \n\nyou want a more comprehensive tutorial, the free “Algorithmic Toolbox”\
    \ \n\nonline course covers many of the same topics that a freshman data struc­\n\
    \ntures and algorithms course would cover, including binary search, quick­\n\n\
    sort, and merge sort. You can sign up for this Coursera course at *https://*\n\
    \n*www.coursera.org/learn/algorithmic-toolbox*.\n\nSorting algorithms are often\
    \ compared to each other in lessons on big \n\nO algorithm analysis, which you\
    \ can read about in Chapter 13 of my book \n\n*Beyond the Basic Stuff with Python*\
    \ (No Starch Press, 2020). You can read this \n\nchapter online at *https://inventwithpython.com/beyond*.\
    \ Python developer Ned \n\nBatchelder describes big O and “how code slows as your\
    \ data grows” in his \n\n2018 PyCon talk of the same name at *https://youtu.be/duvZ-2UK0fc*.\n\
    \nDivide-and-conquer algorithms are useful because they often can \n\nbe run on\
    \ multiple computers in parallel. Guy Steele Jr. gave a Google \n\nTechTalk titled\
    \ “Four Solutions to a Trivial Problem” on this topic at *https://*\n\n*youtu.be/ftcIcn8AmSY*.\n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
