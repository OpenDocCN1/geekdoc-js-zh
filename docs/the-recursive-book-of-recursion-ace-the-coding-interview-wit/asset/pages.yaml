  md: "File Finder    **209**\n\nname meaning *the current directory*, for the first\
    \ argument to walk() so that it \n\nuses the folder the program was run from as\
    \ the base folder to search:\n\n*Python*\n\nprint('All files with even byte sizes:')\n\
    \nprint(walk('.', hasEvenByteSize))\n\nprint('All files with every vowel in their\
    \ name:')\n\nprint(walk('.', hasEveryVowel))\n\nThe output of this program depends\
    \ on what files are on your com­\n\nputer, but this demonstrates how you can write\
