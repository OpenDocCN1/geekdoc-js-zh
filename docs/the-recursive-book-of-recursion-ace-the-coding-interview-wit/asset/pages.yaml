    Starting with m = 2, n = 3:<br />\");\n\ndocument.write(ackermann(2, 3) + \"<br\
    \ />\");\n\ndocument.write(\"</pre>\");\n\n</script>\n\nWhen you run this code,\
    \ the indentation of the output (set by the inden­\n\ntation argument) tells you\
    \ how deep on the call stack the given recursive \n\nfunction call is:\n\nStarting\
    \ with m = 1, n = 1:\n\nackermann(1, 1)\n\n ackermann(1, 0)\n\n ackermann(0, 1)\n\
    \n ackermann(0, 2)\n\n3\n\nStarting with m = 2, n = 3:\n\nackermann(2, 3)\n\n\
    \ ackermann(2, 2)\n\n ackermann(2, 1)\n\n ackermann(2, 0)\n\nThe Recursive Book\
    \ of Recursion (Early Access) © 2022 by Al Sweigart"
