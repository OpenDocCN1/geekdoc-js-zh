  md: "Backtracking and Tree Traversal Algorithms   **81**\n\nChecking if Darya is\
    \ 8 letters...\n\nVisiting node Caroline...\n\nChecking if Caroline is 8 letters...\n\
    \nFound an 8-letter name: Caroline\n\nThe find8LetterName() function operates\
    \ in the same way as our previ­\n\nous tree traversal functions, except instead\
    \ of printing the node’s data, the \n\nfunction checks the name stored in the\
    \ node and returns the first eight-\n\nletter name it finds. You can change the\
    \ preorder traversal to a postorder \n\ntraversal by commenting out the earlier\
    \ name length comparison and \n\nChecking if line 1 and uncommenting the later\
    \ name length comparison \n\nand Checking if line 2. When you make this change,\
    \ the first eight-letter \n\nname the function finds is Hadassah:\n\nVisiting\
    \ node Alice...\n\nVisiting node Bob...\n\nVisiting node Darya...\n\nChecking\
    \ if Darya is 8 letters...\n\nChecking if Bob is 8 letters...\n\nVisiting node\
    \ Caroline...\n\nVisiting node Eve...\n\nVisiting node Gonzalo...\n\nChecking\
    \ if Gonzalo is 8 letters...\n\nVisiting node Hadassah...\n\nChecking if Hadassah\
    \ is 8 letters...\n\nFound an 8-letter name: Hadassah\n\nWhile both traversal\
    \ orders correctly find an eight-letter name, chang­\n\ning the order of a tree\
    \ traversal can alter the behavior of your program. \n\n**Getting the Maximum\
    \ Tree Depth**\n\nAn algorithm can determine the deepest branch in a tree by recursively\
    \ ask­\n\ning its child nodes how deep they are. The *depth* of a node is the\
    \ number of \n\nedges between it and the root node. The root node itself has a\
    \ depth of 0, \n\nthe immediate child of the root node has a depth of 1, and so\
    \ on. You may \n\nneed this information as part of a larger algorithm or to gather\
    \ informa­\n\ntion about the general size of the tree data structure. \n\nWe can\
    \ have a function named getDepth() take a node for an argument \n\nand return\
    \ the depth of its deepest child node. A leaf node (the base case) \n\nsimply\
    \ returns 0.\n\nFor example, given the root node of the tree in Figure 4-1, we\
    \ could \n\ncall getDepth() and pass it the root node (the A node). This would\
    \ return the \n\ndepth of its children, the B and C nodes, plus one. The function\
    \ must make a \n\nrecursive call to getDepth() to find out this information. Eventually,\
    \ the A node \n\nwould call getDepth() on C, which would call it on E. When E\
    \ calls ­getDepth() \n\nwith its two children, G and H, they both return 0, so\
    \ g­etDepth() called on E \n\nreturns 1, making getDepth() called on C return\
    \ 2, making ­getDepth() called on \n\nA (the root node) return 3. Our tree’s greatest\
    \ depth is three levels.\n\nThe Recursive Book of Recursion (Early Access) © 2022\
    \ by Al Sweigart"
