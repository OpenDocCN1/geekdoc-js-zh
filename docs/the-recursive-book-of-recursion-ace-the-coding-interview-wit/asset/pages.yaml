  md: "Permutations and Combinations   **143**\n\n...Adding close parenthesis.\n\n\
    ....Start of pairs=2, openRem=0, closeRem=0, current=\"()()\"\n\n....1st base\
    \ case. Returning \\['()()'\\]\n\n...2nd base case. Returning \\['()()'\\]\n\n\
    ..2nd base case. Returning \\['()()'\\]\n\n.2nd base case. Returning \\['(())',\
    \ '()()'\\]\n\n2nd base case. Returning \\['(())', '()()'\\]\n\nResults: \\['(())',\
    \ '()()'\\]\n\nThe getBalancedParens() function 1 accepts a single argument, the\
    \ \n\nnumber of pairs of parentheses, when called by the user. However, it \n\n\
    needs to pass additional information in the arguments to its recursive \n\ncalls.\
    \ These include the number of opening parentheses that remain to \n\nbe added\
    \ (­openRem), the number of closing parentheses that remain to be \n\nadded (closeRem),\
    \ and the current balanced parentheses string being built \n\n(current). Both\
    \ openRem and closeRem start as the same value as the pairs argu­\n\nment, and\
    \ current starts as the blank string. An indent argument is used \n\nonly for\
    \ the debugging output to show the program’s level of recursive \n\n­function\
    \ call.\n\nThe function first checks the number of opening and closing paren­\n\
    \ntheses remaining to be added 2. If both are 0, we’ve reached the first base\
    \ \n\ncase, and the string in current is finished. Since the getBalancedParens()\
    \ func­\n\ntion returns a list of strings, we put current in a list and return\
    \ it 3.\n\nOtherwise, the function continues on to the recursive case. If possible\
    \ \n\nopening parentheses remain 4, the function calls getBalancedParens() with\
    \ \n\nan opening parenthesis added to the current argument. If more closing \n\
    \nparentheses are remaining than opening parentheses 5, the function calls \n\n\
    getBalancedParens() with a closing parenthesis added to the current argu­\n\n\
    ment. This check ensures that an unmatched closing parenthesis won’t be \n\nadded,\
    \ as this would make the string unbalanced, such as the second clos­\n\ning parenthesis\
    \ in ()).\n\nAfter these recursive cases is an unconditional base case that returns\
    \ \n\nall the strings returned from the two recursive function calls (and, of\
    \ \n\ncourse, the recursive function calls made by these recursive function calls,\
    \ \n\nand so on) 6.\n\n**Power Set: Finding All Subsets of a Set**\n\nThe *power\
    \ set* of a set is the set of every possible subset of that set. For \n\nexample,\
    \ the power set of {A, B, C} is {{}, {A}, {B}, {C}, {A, B}, {A, C}, {B, C}, {A,\
    \ \n\nB, C}}. This is equivalent to the set of every possible *k*\\-combination\
    \ of a set. \n\nAfter all, the power set of {A, B, C} contains all of its 0-combinations,\
    \ 1-com­\n\nbinations, 2-combinations, and 3-combinations. \n\nIf you’re looking\
    \ for a real-world example in which you would need \n\nto generate the power set\
    \ of a set, imagine a job interviewer asked you to \n\n­generate the power set\
    \ of a set. It is astronomically unlikely you’ll need \n\nto generate the power\
    \ set of a set for any other reason, including the job \n\nyou are interviewing\
    \ for.\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
