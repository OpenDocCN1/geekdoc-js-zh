  md: "**194**   Chapter 9\n\n**The Hilbert Curve**\n\nA *space-filling curve* is\
    \ a one-dimensional line that curves around until \n\nit completely fills a two-dimensional\
    \ space without crossing over itself. \n\nGerman mathematician David Hilbert described\
    \ his space-filling *Hilbert *\n\n*curve* in 1891. If you split a two-dimensional\
    \ area into a grid, the single, \n\none-dimensional line of the Hilbert curve\
    \ can run through every cell in \n\nthe grid. \n\nFigure 9-17 contains the first\
    \ three recursions of the Hilbert curve. \n\nThe next recursion contains four\
    \ copies of the previous recursion, and the \n\ndashed line shows how the four\
    \ copies connect to one another.\n\n*Figure 9-17: The first three recursions of\
    \ the Hilbert space-filling curve*\n\nAs the cells become infinitesimal points,\
    \ the one-dimensional curve \n\ncan fill the entire two-dimensional space the\
    \ same way a two-dimensional \n\nsquare does. Counterintuitively, this creates\
    \ a two-dimensional shape from \n\na strictly one-dimensional line!\n\nThe source\
    \ code for *hilbertCurve.py* is as follows:\n\n*Python*\n\nimport turtle\n\nturtle.tracer(10,\
    \ 0) # Increase the first argument to speed up the drawing.\n\nturtle.setworldcoordinates(0,\
    \ 0, 700, 700)\n\nturtle.hideturtle()\n\nLINE\\_LENGTH = 5 # Try changing the\
    \ line length by a little.\n\nANGLE = 90 # Try changing the turning angle by a\
    \ few degrees.\n\nLEVELS = 6 # Try changing the recursive level by a little.\n\
    \nDRAW\\_SOLID = False\n\n#turtle.setheading(20) # Uncomment this line to draw\
    \ the curve at an angle.\n\ndef hilbertCurveQuadrant(level, angle):\n\n if level\
    \ == 0:\n\n # BASE CASE\n\n return\n\n else:\n\n # RECURSIVE CASE\n\n turtle.right(angle)\n\
    \n hilbertCurveQuadrant(level - 1, -angle)\n\nThe Recursive Book of Recursion\
    \ (Early Access) © 2022 by Al Sweigart"
  merge: -1
  pgno: 219
- img_proc: true
  md: "Drawing Fractals   **195**\n\n turtle.forward(LINE\\_LENGTH)\n\n turtle.left(angle)\n\
    \n hilbertCurveQuadrant(level - 1, angle)\n\n turtle.forward(LINE\\_LENGTH)\n\n\
    \ hilbertCurveQuadrant(level - 1, angle)\n\n turtle.left(angle)\n\n turtle.forward(LINE\\\
    _LENGTH)\n\n hilbertCurveQuadrant(level - 1, -angle)\n\n turtle.right(angle)\n\
    \n return\n\ndef hilbertCurve(startingPosition):\n\n # Move to starting position.\n\
    \n turtle.penup()\n\n turtle.goto(startingPosition)\n\n turtle.pendown()\n\n if\
    \ DRAW\\_SOLID:\n\n turtle.begin\\_fill()\n\n hilbertCurveQuadrant(LEVELS, ANGLE)\
    \ # Draw lower left quadrant.\n\n turtle.forward(LINE\\_LENGTH)\n\n hilbertCurveQuadrant(LEVELS,\
    \ ANGLE) # Draw lower right quadrant.\n\n turtle.left(ANGLE)\n\n turtle.forward(LINE\\\
    _LENGTH)\n\n turtle.left(ANGLE)\n\n hilbertCurveQuadrant(LEVELS, ANGLE) # Draw\
    \ upper right quadrant.\n\n turtle.forward(LINE\\_LENGTH)\n\n hilbertCurveQuadrant(LEVELS,\
    \ ANGLE) # Draw upper left quadrant.\n\n turtle.left(ANGLE)\n\n turtle.forward(LINE\\\
    _LENGTH)\n\n turtle.left(ANGLE)\n\n if DRAW\\_SOLID:\n\n turtle.end\\_fill()\n\
    \nhilbertCurve((30, 350))\n\nturtle.exitonclick()\n\nTry experimenting with this\
    \ code by decreasing LINE\\_LENGTH to shorten \n\nthe line segments while increasing\
    \ LEVELS to add more levels of recursion. \n\nBecause this program uses only relative\
    \ movements for the turtle, you can \n\nuncomment the turtle.setheading(20) line\
    \ to draw the Hilbert curve at a \n\n20-degree angle. Figure 9-18 shows the drawing\
    \ produced with LINE\\_LENGTH \n\nof 10 and LEVELS of 5.\n\nThe Recursive Book\
    \ of Recursion (Early Access) © 2022 by Al Sweigart"
