  md: "Fractal Art Maker   **279**\n\n**Creating Your Own Fractals**\n\nCreate your\
    \ own fractals by changing the specification passed to the draw­\n\nFractal()\
    \ function. Start by thinking about how many recursive calls you’d \n\nlike each\
    \ call to drawFractal() to generate, and how the size, position, and \n\nheading\
    \ of the shapes should change. You can use the existing shape-draw­\n\ning functions\
    \ or create your own. \n\nFor example, Figure 13-11 shows the nine built-in fractals,\
    \ except the \n\nsquare and triangle functions have been swapped. Some of these\
    \ produce \n\nbland shapes, but others can result in unexpected beauty.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_304_0.png)\n\
    \n*Figure 13-11: The nine fractals that come with Fractal Art Maker, with the\
    \ shape-drawing functions swapped*\n\nThe Recursive Book of Recursion (Early Access)\
    \ © 2022 by Al Sweigart"
