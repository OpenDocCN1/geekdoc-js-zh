  md: "Memoization and Dynamic Programming   **159**\n\n else:\n\n # RECURSIVE CASE\n\
    \n print('Calling fibonacci(%s) (nthNumber - 1).' % (nthNumber - 1))\n\n result\
    \ = fibonacci(nthNumber - 1)\n\n print('Calling fibonacci(%s) (nthNumber - 2).'\
    \ % (nthNumber - 2))\n\n result = result + fibonacci(nthNumber - 2)\n\n print('Call\
    \ to fibonacci(%s) returning %s.' % (nthNumber, result))\n\n return result\n\n\
    print(fibonacci(99))\n\nCompared to the additions required to implement our own\
    \ cache in \n\n*fibonacciByRecursionMemoized.py*, using Python’s @lru\\_cache()\
    \ decorator is \n\nmuch simpler. Normally, calculating fibonacci(99) with the\
    \ recursive algo­\n\nrithm would take a few centuries. With memoization, our program\
    \ displays \n\nthe 218922995834555169026 result in a few milliseconds.\n\nMemoization\
    \ is a useful technique for recursive functions with overlap­\n\nping subproblems,\
    \ but it can be applied to any pure function to speed up \n\nruntime at the expense\
    \ of computer memory.\n\n**What Happens When You Memoize Impure Functions?**\n\
    \nYou should not add the @lru\\_cache to functions that are not pure, mean­\n\n\
    ing they are nondeterministic or have side effects. Memoization saves time \n\n\
    by skipping the code in the function and returning the previously cached \n\n\
    return value. This is fine for pure functions but can cause various bugs for \n\
    \nimpure functions. \n\nIn nondeterministic functions, such as a function that\
    \ returns the cur­\n\nrent time, memoization causes the function to return incorrect\
    \ results. For \n\nfunctions with side effects, such as printing text to the screen,\
    \ memoization \n\ncauses the function to skip the intended side effect. The *doNotMemoize.py*\
    \ \n\nprogram demonstrates what happens when the @lru\\_cache function decora­\n\
    \ntor (described in the previous section) memoizes these impure functions:\n\n\
    *Python*\n\nimport functools, time, datetime\n\n@functools.lru\\_cache()\n\ndef\
    \ getCurrentTime():\n\n # This nondeterministic function returns different values\
    \ each time\n\n # it's called.\n\n return datetime.datetime.now()\n\n@functools.lru\\\
    _cache()\n\ndef printMessage():\n\n # This function displays a message on the\
    \ screen as a side effect.\n\n print('Hello, world!')\n\nprint('Getting the current\
    \ time twice:')\n\nprint(getCurrentTime())\n\nThe Recursive Book of Recursion\
    \ (Early Access) © 2022 by Al Sweigart"
