  md: "**6**   Chapter 1\n\ninstructions at three different places in a program, instead\
    \ of copying and \n\npasting the source code three times, you can write the code\
    \ in a function \n\nonce and call the function three times. The beneficial result\
    \ is a shorter and \n\nmore readable program. The program is also easier to change:\
    \ If you need \n\nto fix a bug or add features, you need to change your program\
    \ in only one \n\nplace instead of three.\n\nAll programming languages implement\
    \ four features in their functions:\n\n 1. Functions have code that is run when\
    \ the function is called.\n\n 2. * Arguments* (that is, values) are passed to\
    \ the function when it’s called. \n\nThis is the input to the function, and functions\
    \ can have zero or more \n\narguments.\n\n 3. Functions return a *return value*.\
    \ This is the output of the function, \n\nthough some programming languages allow\
    \ functions to not return \n\nanything or return null values like undefined or\
    \ None.\n\n 4. The program remembers which line of code called the function and\
    \ \n\nreturns to it when the function finishes its execution.\n\nDifferent programming\
    \ languages might have additional features, or \n\ndifferent options for how to\
    \ call functions, but they all have these four gen­\n\neral elements. You can\
    \ visually see the first three of these elements because \n\nyou write them in\
    \ the source code, but how does a program keep track of \n\nwhere the execution\
    \ should return to when the function returns? \n\nTo get a better sense of the\
    \ problem, create a *functionCalls.py* program \n\nthat has three functions: a(),\
    \ which calls b(), which calls c():\n\n*Python*\n\ndef a():\n\n print('a() was\
    \ called.')\n\n 1 b()\n\n print('a() is returning.')\n\ndef b():\n\n print('b()\
    \ was called.')\n\n 2 c()\n\n print('b() is returning.')\n\ndef c():\n\n print('c()\
    \ was called.')\n\n print('c() is returning.')\n\na()\n\nThis code is equivalent\
    \ to the following *functionCalls.html* program:\n\n*JavaScript*\n\n<script type=\"\
    text/javascript\">\n\nfunction a() {\n\n document.write(\"a() was called.<br />\"\
    );\n\n 1 b();\n\n document.write(\"a() is returning.<br />\");\n\n}\n\nThe Recursive\
    \ Book of Recursion (Early Access) © 2022 by Al Sweigart"
