    \ if (k == 0) {\n\n // BASE CASE\n\n document.write(debugMsg + \" base case returns\
    \ \\[''\\]<br />\");\n\n return \\[\"\"\\];\n\n } else if (chars == \"\") {\n\n\
    \ // BASE CASE\n\n document.write(debugMsg + \" base case returns \\[\\]<br />\"\
    );\n\n return \\[\\];\n\nThe Recursive Book of Recursion (Early Access) © 2022\
    \ by Al Sweigart"
