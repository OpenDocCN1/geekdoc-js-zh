    \ to the \n\npivot, and everything to the right of the i index is greater than\
    \ the pivot.\n\nThe entire process repeats as we recursively call quicksort()\
    \ on the left \n\nand right partitions. When we partition these two halves (and\
    \ then parti­\n\ntion the four halves of these two halves with more recursive\
    \ quicksort() \n\ncalls, and so on), the entire array ends up sorted.\n\nWhen\
    \ we run these programs, the output shows the process of sorting \n\nthe \\[0,\
    \ 7, 6, 3, 1, 2, 5, 4\\] list. The rows of periods are meant to help you \n\n\
