    \ \n\nfrom freshman computer science curricula) can touch \n\nupon them too. This\
    \ chapter covers six classic prob­\n\nlems in recursion, along with their solutions.\n\
    \nThese algorithms include simple ones such as summing the numbers \n\nin an array,\
