  md: "Divide-and-Conquer Algorithms   **111**\n\nAs you can see from the output,\
    \ the function divides the \\[2, 9, 8, 5, 3, \n\n4, 7, 6\\] list into \\[2, 9,\
    \ 8, 5\\] and \\[3, 4, 7, 6\\] and passes these to recursive \n\nmergeSort() calls.\
    \ The first list is further split into \\[2, 9\\] and \\[8, 5\\]. That \\[2, \n\
    \n9\\] list is split into \\[2\\] and \\[9\\]. These single-value lists cannot\
    \ be divided any­\n\nmore, so we have reached our base case. These lists are merged\
    \ back into \n\nsorted order as \\[2, 9\\]. The function divides the \\[8, 5\\\
    ] list into \\[8\\] and \\[5\\], \n\nreaches the base case, and then merges back\
    \ into \\[5, 8\\].\n\nThe \\[2, 9\\] and \\[5, 8\\] lists are individually in\
    \ sorted order. Remember, \n\nmergeSort() doesn’t simply *concatenate* the lists\
    \ into \\[2, 9, 5, 8\\], which would \n\nnot be in sorted order. Rather, the function\
    \ *merges* them into the sorted list \n\n\\[2, 5, 8, 9\\]. By the time the original\
    \ mergeSort() call returns, the full list it \n\nreturns is completely sorted.\n\
    \n**Summing an Array of Integers**\n\nWe already covered summing an array of integers\
    \ in Chapter 3 with the \n\nhead-tail technique. In this chapter, we’ll use a\
    \ divide-and-conquer strategy. \n\nSince the associative property of addition\
    \ means that adding 1 + 2 + 3 + 4 is \n\nthe same as adding the sums of 1 + 2\
    \ and 3 + 4, we can divide a large array \n\nof numbers to sum into two smaller\
    \ arrays of numbers to sum. \n\nThe benefit is that for larger sets of data to\
    \ process, we could farm out \n\nthe subproblems to different computers and have\
    \ them all work together in \n\nparallel. There’s no need to wait for the first\
    \ half of the array to be summed \n\nbefore another computer can start summing\
    \ the second half. This is a large \n\nadvantage of the divide-and-conquer technique,\
    \ as CPUs aren’t getting \n\nmuch faster but we can have multiple CPUs work simultaneously.\n\
    \nLet’s ask the three questions about recursive algorithms for our summa­\n\n\
    tion function:\n\n**What is the base case?   ** Either an array containing zero\
    \ numbers \n\n(where we return 0) or an array containing one number (where we\
    \ \n\nreturn the number).\n\n**What argument is passed to the recursive function\
    \ call?   ** Either the \n\nleft half or the right half of the array of numbers.\n\
    \n**How does this argument become closer to the base case?   ** The size of \n\
    \nthe array of numbers is half each time, eventually becoming an array \n\ncontaining\
    \ zero or one number.\n\nThe *sumDivConq.py* Python program implements the divide-and-con­\n\
    \nquer strategy for adding numbers in the sumDivConq() function:\n\n*Python*\n\
    \ndef sumDivConq(numbers):\n\n if len(numbers) == 0: # BASE CASE\n\n 1 return\
    \ 0\n\n elif len(numbers) == 1: # BASE CASE\n\n 2 return numbers\\[0\\]\n\n else:\
    \ # RECURSIVE CASE\n\n 3 mid = len(numbers) // 2\n\n leftHalfSum = sumDivConq(numbers\\\
    [0:mid\\])\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
