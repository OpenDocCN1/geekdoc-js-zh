  md: "Maze Generator    **221**\n\n**Setting Up the Maze Generator’s Constants**\n\
    \nThe maze generator uses several constants, which we can change before \n\nrunning\
    \ the program to alter the size and appearance of the maze. The \n\nPython code\
    \ for these constants is as follows:\n\n*Python*\n\nimport random\n\nWIDTH = 39\
    \ # Width of the maze (must be odd).\n\nHEIGHT = 19 # Height of the maze (must\
    \ be odd).\n\nassert WIDTH % 2 == 1 and WIDTH >= 3\n\nassert HEIGHT % 2 == 1 and\
    \ HEIGHT >= 3\n\nSEED = 1\n\nrandom.seed(SEED)\n\nThe JavaScript code is as follows:\n\
    \n*JavaScript*\n\n<script type=\"text/javascript\">\n\nconst WIDTH = 39; // Width\
    \ of the maze (must be odd).\n\nconst HEIGHT = 19; // Height of the maze (must\
    \ be odd).\n\nconsole.assert(WIDTH % 2 == 1 && WIDTH >= 3);\n\nconsole.assert(HEIGHT\
    \ % 2 == 1 && HEIGHT >= 3);\n\nThe constants WIDTH and HEIGHT dictate the size\
    \ of the maze. They must \n\nbe odd numbers, because our maze data structure requires\
    \ walls between \n\nthe visited spaces of the maze, leaving us with odd-numbered\
    \ dimensions. \n\nTo make sure the WIDTH and HEIGHT constants are set correctly,\
    \ we use asser­\n\ntions to stop the program if the constants aren’t odd or are\
    \ too small.\n\nThe program relies on a random seed value to reproduce the same\
    \ \n\nmaze, given the same seed value. The Python version of this program lets\
    \ us \n\nset this value by calling the random.seed() function. Unfortunately,\
    \ JavaScript \n\ndoesn’t have a way to set the seed value explicitly and will\
    \ generate different \n\nmazes each time we run the program.\n\n**N O T E**\n\n\
    *The “random” numbers the Python program generates are actually predictable, *\n\
    \n*because they’re based on a starting seed value; the program generates the same\
    \ “ran­*\n\n*dom” maze given the same seed. This can be useful when trying to\
    \ debug the program *\n\n*by having it reproduce the same maze as when we first\
    \ noticed the bug. *\n\nThe Python code continues by setting a few more constants:\n\
    \n*Python*\n\n\\# Use these characters for displaying the maze:\n\nEMPTY = ' '\n\
    \nMARK = '@'\n\nWALL = chr(9608) # Character 9608 is '^█'\n\nNORTH, SOUTH, EAST,\
    \ WEST = 'n', 's', 'e', 'w'\n\nThe Recursive Book of Recursion (Early Access)\
    \ © 2022 by Al Sweigart"
