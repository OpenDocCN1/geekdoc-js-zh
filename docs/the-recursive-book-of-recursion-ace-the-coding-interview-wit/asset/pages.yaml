  md: "**72**   Chapter 4\n\na tree. Finally, we’ll see how mazes can be represented\
    \ as a tree data struc­\n\nture, and employ tree traversal and backtracking to\
    \ find a path from the \n\nstart of the maze to the exit.\n\n**Using Tree Traversal**\n\
    \nIf you program in Python and JavaScript, you’re used to working with list, \n\
    \narray, and dictionary data structures. You’ll encounter tree data structures\
    \ \n\nonly if you are dealing with low-level details of certain computer science\
    \ \n\nalgorithms such as abstract syntax trees, priority queues, Adelson-Velsky-\n\
    \nLandis (AVL) trees, and other concepts beyond the scope of this book. \n\nHowever,\
    \ trees themselves are simple enough concepts.\n\nA *tree data structure* is a\
    \ data structure composed of nodes that are con­\n\nnected to other nodes by edges.\
    \ The *nodes* contain data, while the *edges* rep­\n\nresent a relationship with\
    \ another node. Nodes are also called *vertices*. The \n\nstarting node of a tree\
    \ is called the *root*, and the nodes at the end are called \n\n*leaves*. Trees\
    \ always have exactly one root.\n\n*Parent nodes* at the top have edges to zero\
    \ or more *child nodes* beneath \n\nthem. Therefore, leaves are the nodes that\
    \ do not have children, par­\n\nent nodes are the non-leaf nodes, and child nodes\
    \ are all of the non-root \n\nnodes. Nodes in a tree can have edges to multiple\
    \ child nodes. The parent \n\nnodes that connect a child node to the root node\
    \ are also called the child \n\nnode’s *ancestors*. The child nodes between a\
    \ parent node and a leaf node \n\nare called the parent node’s *descendants*.\
    \ Parent nodes in a tree can have \n\nmultiple child nodes. But every child node\
    \ has exactly one parent, except \n\nfor the root node, which has zero parents.\
    \ In trees, only one path can exist \n\nbetween any two nodes.\n\nFigure 4-1 shows\
    \ an example of a tree and three examples of things \n\nthat are not trees.\n\n\
    B\n\nC\n\nTree\n\nG\n\nH\n\nF\n\nD\n\nE\n\nA\n\nB\n\nD\n\nC\n\nNot a tree\n\n\
    (Child node loops back\n\nto an ancestor node)\n\nG\n\nH\n\nF\n\nE\n\nA\n\nD\n\
    \nH\n\nC\n\nE\n\nF\n\nG\n\nB\n\nNot a tree\n\n(Child node has\n\nmultiple parents)\n\
    \nA\n\nG\n\nH\n\nB\n\nC\n\nE\n\nF\n\nD\n\nNot a tree\n\n(Multiple root\n\nnodes)\n\
    \nA\n\nZ\n\n*Figure 4-1: A tree (left) and three examples of non-trees (middle\
    \ and right)*\n\nAs you can see, child nodes must have one parent and not have\
    \ an edge \n\nthat creates a loop, or else the structure is no longer considered\
    \ a tree. \n\nThe recursive algorithms we cover in this chapter apply only to\
    \ tree data \n\nstructures.\n\nThe Recursive Book of Recursion (Early Access)\
    \ © 2022 by Al Sweigart"
