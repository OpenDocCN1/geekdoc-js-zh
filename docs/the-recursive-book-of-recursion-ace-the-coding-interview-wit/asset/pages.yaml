  md: "Backtracking and Tree Traversal Algorithms   **91**\n\nTo get a better idea\
    \ of how this algorithm works, uncomment the two \n\nprintMaze(MAZE) calls 3 4\
    \ inside the solveMaze() function. These will display \n\nthe maze data structure\
    \ as it attempts new paths, reaches dead ends, back­\n\ntracks, and tries different\
    \ paths.\n\n**Summary**\n\nThis chapter explored several algorithms that make\
    \ use of tree data struc­\n\ntures and backtracking, which are features of a problem\
    \ that make it suit­\n\nable for solving with recursive algorithms. We covered\
    \ tree data structures, \n\nwhich are composed of nodes that contain data and\
    \ edges that relate nodes \n\ntogether in parent-child relationships. In particular,\
    \ we examined a spe­\n\ncific kind of tree called a directed acyclic graph (DAG)\
    \ that is often used \n\nin recursive algorithms. A recursive function call is\
    \ analogous to traversing \n\nto a child node in a tree, while returning from\
    \ a recursive function call is \n\nanalogous to backtracking to a previous parent\
    \ node.\n\nWhile recursion is overused for simple programming problems, it is\
    \ \n\nwell matched for problems that involve tree-like structures and backtrack­\n\
    \ning. Using these ideas of tree-like structures, we wrote several algorithms\
    \ \n\nfor traversing, searching, and determining the depth of tree structures.\
    \ We \n\nalso showed that a simply connected maze has a tree-like structure, and\
    \ \n\nemployed recursion and backtracking to solve a maze.\n\n**Further Reading**\n\
    \nThere is far more to trees and tree traversal than the brief description \n\n\
    of DAGs presented in this chapter. The Wikipedia articles at *https://*\n\n*en.wikipedia.org/wiki/Tree\\\
    _(data\\_structure)* and *https://en.wikipedia.org/wiki/*\n\n*Tree\\_traversal*\
    \ provide additional context for these concepts, which are often \n\nused in computer\
    \ science.\n\nThe Computerphile YouTube channel also has a video titled “Maze\
    \ \n\nSolving” at *https://youtu.be/rop0W4QDOUI* that discusses these concepts.\
    \ V. \n\nAnton Spraul, author of *Think Like a Programmer* (No Starch Press, 2012),\
    \ \n\nalso has a video on maze solving titled “Backtracking” at *https://youtu.be/*\n\
    \n*gBC\\_Fd8EE8A*. The freeCodeCamp organization (*https://freeCodeCamp *\n\n\
    *.org*) has a video series on backtracking algorithms at *https://youtu.be/*\n\
    \n*A80YzvNwqXA*.\n\nIn addition to maze solving, the recursive backtracker algorithm\
    \ \n\nuses recursion to generate mazes. You can find out more about this \n\n\
    and other maze-generating algorithms at *https://en.wikipedia.org/wiki/*\n\n*Maze\\\
    _generation\\_algorithm#Recursive\\_backtracker*.\n\nThe Recursive Book of Recursion\
    \ (Early Access) © 2022 by Al Sweigart"
