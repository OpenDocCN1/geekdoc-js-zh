    \ a Move***\n\nNext, as part of the backtracking in the recursive algorithm, our\
    \ program \n\nneeds to undo moves. This is as simple as making a move in the opposite\
    \ \n\ndirection as the initial move. The Python code for the undoMove() function\
    \ is \n\nas follows:\n\n*Python*\n\ndef undoMove(board, move):\n\n \"\"\"Do the\
    \ opposite move of \\`move\\` to undo it on \\`board\\`.\"\"\"\n\n if move ==\
    \ UP:\n\n makeMove(board, DOWN)\n\n elif move == DOWN:\n\n makeMove(board, UP)\n\
    \n elif move == LEFT:\n\n makeMove(board, RIGHT)\n\n elif move == RIGHT:\n\n makeMove(board,\
    \ LEFT)\n\nThe JavaScript code for the undoMove() function is as follows:\n\n\
    *JavaScript*\n\nfunction undoMove(board, move) {\n\n // Do the opposite move of\
    \ \\`move\\` to undo it on \\`board\\`.\n\n if (move === UP) {\n\n makeMove(board,\
    \ DOWN);\n\n } else if (move === DOWN) {\n\n makeMove(board, UP);\n\n } else if\
    \ (move === LEFT) {\n\n makeMove(board, RIGHT);\n\n } else if (move === RIGHT)\
    \ {\n\n makeMove(board, LEFT);\n\n }\n\n}\n\nWe’ve already programmed the swapping\
    \ logic into the makeMove() func­\n\ntion, so undoMove() can just call that function\
