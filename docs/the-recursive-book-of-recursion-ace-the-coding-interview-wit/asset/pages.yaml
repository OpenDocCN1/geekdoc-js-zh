  md: "**98**   Chapter 5\n\nA - Z\n\nN - Z\n\nA - M\n\nA - G\n\nH - M\n\nN - T\n\n\
    U - Z\n\n*Figure 5-2: Quicksort works by repeatedly *\n\n*partitioning items into\
    \ two sets.*\n\nHowever, if you don’t know anything about the data you’re sorting,\
    \ it’s \n\nimpossible to select an ideal pivot. This is why the generic quicksort\
    \ algo­\n\nrithm simply uses the last value in the range for the pivot value.\n\
    \nIn our implementation, each call to quicksort() is given an array of \n\nitems\
    \ to sort. It is also given left and right arguments specifying the range \n\n\
    of indexes in that array to sort, similar to binarySearch()’s left and right argu­\n\
    \nments. The algorithm selects a pivot value to compare with the other values\
    \ \n\nin the range, then places the values to either the left side of the range\
    \ (if \n\nthey’re less than the pivot value) or the right side (if they’re greater\
    \ than \n\nthe pivot value). This is the partition step. Next, the quicksort()\
    \ function \n\nis recursively called on these two, smaller ranges until a range\
    \ has been \n\nreduced to zero. The list becomes more and more sorted as the recursive\
    \ \n\ncalls are made, until finally the entire list is in correct order.\n\nNote\
    \ that the algorithm modifies the array in place. See “Modifying a \n\nList or\
    \ Array in Place” on page xx for details. As such, the quicksort() func­\n\ntion\
    \ doesn’t return a sorted array. The base case merely returns to stop pro­\n\n\
    ducing more recursive calls.\n\nLet’s ask the three recursion questions about\
    \ our binary search \n\nimplementation:\n\n**What is the base case?   ** Being\
    \ given a range to sort that contains zero \n\nor one item and that is already\
    \ in sorted order.\n\n**What argument is passed to the recursive function call? \
    \  ** The indexes \n\nof the left and right end of the range in the list we are\
    \ sorting.\n\n**How does this argument become closer to the base case?   ** The\
    \ range \n\nhalves in size for each recursive call, so it eventually becomes empty.\n\
    \nThe following quicksort() function in the *quicksort.py* Python program \n\n\
    sorts the values in the items list into ascending order:\n\ndef quicksort(items,\
    \ left=None, right=None):\n\n # By default, \\`left\\` and \\`right\\` span the\
    \ entire range of \\`items\\`:\n\n if left is None:\n\n left = 0 # \\`left\\`\
    \ defaults to the 0 index.\n\n if right is None:\n\n right = len(items) - 1 #\
    \ \\`right\\` defaults to the last index.\n\nThe Recursive Book of Recursion (Early\
    \ Access) © 2022 by Al Sweigart"
