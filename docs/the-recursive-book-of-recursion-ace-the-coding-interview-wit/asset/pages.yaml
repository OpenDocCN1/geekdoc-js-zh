  md: "**60**   Chapter 3\n\nThe Python version has an interactive mode too, where\
    \ you can solve \n\nthe puzzle yourself. Uncomment the lines of code at the end\
    \ of *towerOf­*\n\n*HanoiSolver.py* to play the interactive version.\n\nYou can\
    \ start by running the program with the smaller cases by setting \n\nthe TOTAL\\\
    _DISKS constant 1 at the top of the program to 1 or 2. In our pro­\n\ngram, a\
    \ list of integers in Python and array of integers in JavaScript repre­\n\nsents\
    \ a pole. The integer represents a disk, with larger integers representing \n\n\
    larger disks. The integer at the start of the list or array is at the bottom of\
    \ \n\nthe pole, and the integer at the end is at the pole’s top. For example,\
    \ \\[6, 5, \n\n4, 3, 2, 1\\] represents the starting pole with six disks with\
    \ the largest on the \n\nbottom, while \\[\\] represents a pole with no disks.\
    \ The TOWERS variable con­\n\ntains three of these lists 2.\n\nThe base case merely\
    \ moves the smallest disk from the start pole to the \n\nend pole 3. The recursive\
    \ case for a tower of *n* disks carries out three steps: \n\nsolving the *n* –\
    \ 1 case 4, moving the *n*th disk 5, and then solving the *n* – 1 \n\ncase again 6.\n\
    \n**Using Flood Fill**\n\nGraphics programs commonly use the *flood fill algorithm*\
    \ to fill an arbitrary-\n\nshaped area of the same color with another color. Figure 3-6\
    \ shows one \n\nsuch shape at the top left. The subsequent panels show three different\
    \ \n\nsections of the shape flood-filled with a gray color. The flood fill begins\
    \ \n\non a white pixel and spreads until it meets a non-white pixel, filling the\
    \ \n\nenclosed space.\n\nThe flood fill algorithm is recursive: it begins by changing\
    \ a single \n\npixel to a new color. The recursive function is then called on\
    \ any neighbors \n\nof the pixel with its same old color. It then moves on to\
    \ the neighbors of \n\nthe neighbors, and so on, converting each pixel to the\
    \ new color until the \n\nenclosed space is filled in. \n\nThe base case is a\
    \ pixel whose color is the edge of image or not the old \n\ncolor. Since reaching\
    \ the base case is the only way to stop the “spread” of \n\nrecursive calls for\
    \ every pixel in image, this algorithm has the emergent \n\nbehavior of changing\
    \ all the contiguous pixels from the old color to the \n\nnew color.\n\nLet’s\
    \ ask the three recursive algorithm questions about our floodFill() \n\nfunction:\n\
    \n**What is the base case?   ** When the x- and y-coordinates are for a pixel\
    \ \n\nthat is not the old color, or are at the edge of the image.\n\n**What arguments\
    \ are passed to the recursive function call?   ** The x- \n\nand y-coordinates\
    \ of the four neighboring pixels of the current pixel \n\nare the arguments to\
    \ four recursive calls.\n\n**How do these arguments become closer to the base\
    \ case?   ** The neigh­\n\nboring pixels run up to a different color than the\
    \ old color or the edge \n\nof the image. Either way, eventually the algorithm\
    \ runs out of pixels to \n\ncheck.\n\nThe Recursive Book of Recursion (Early Access)\
    \ © 2022 by Al Sweigart"
