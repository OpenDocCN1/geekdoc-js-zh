    \ case, we form head from \n\nthe first character in theString 2, and tail from\
    \ every character after the \n\nfirst 3. The recursive case then returns the reverse\
    \ of tail followed by the \n\nhead character 4.\n\n**Detecting Palindromes**\n\
    \nA *palindrome* is a word or phrase that is spelled the same when written for­\n\
    \nward and backward. *Level*, *race car*, *taco cat*, and *a man, a plan, a canal\
    \ . . . *\n\n*Panama*! are all examples of palindromes. If you would like to detect\
    \ whether \n\na string is a palindrome, you can write a recursive isPalindrome()function.\
    \ \n\nThe base case is a zero- or one-character string, which by its nature is\
    \ \n\nalways the same, whether forward or backward. We’ll use an approach simi­\n\
    \nlar to the head-tail technique, except that we’ll split the string argument\
    \ \n\ninto head, middle, and last strings instead. If the head and last character\
    \ \n\nare the same and the middle characters also form a palindrome, the string\
    \ \n\nis a palindrome. The recursion comes from passing the middle string to \n\
    \nisPalindrome().\n\nLet’s ask the three recursive algorithm questions about the\
    \ isPalin­\n\ndrome() function:\n\n**What is the base case?   ** A zero- or one-character\
    \ string, which returns \n\nTrue because it is always a palindrome.\n\n**What\
