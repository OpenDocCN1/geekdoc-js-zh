    \ *hello.html* file:\n\n<script type=\"text/javascript\">\n\ndocument.write(\"\
    Hello, world!<br />\");\n\n</script>\n\nThe two code listings act as a Rosetta\
    \ Stone, describing programs that \n\nproduce the same results in two different\
    \ languages. \n\n**N O T E**\n\n*The **<br />** HTML tag in *hello.html* is a\
    \ *break return*, also called a *newline*, *\n\n*which prevents all the output\
    \ from appearing on a single line. Python’s **print()*\n\n*­function automatically\
    \ adds break returns to the end of the text, while JavaScript’s *\n\n*document.write()**\
    \ function doesn’t.*\n\nI encourage you to manually copy these programs by using\
    \ your key­\n\nboard, rather than simply copying and pasting their source code\
    \ into a new \n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
