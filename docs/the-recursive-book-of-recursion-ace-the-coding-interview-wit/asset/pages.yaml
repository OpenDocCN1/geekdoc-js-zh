  md: "**90**   Chapter 4\n\nrepresenting a single character in the maze. This allows\
    \ us to access MAZE\\[y\\]\n\n\\[x\\] (note that y comes first) to get the character\
    \ at the x, y coordinate in \n\nthe original MAZE string. The printMaze() function\
    \ can accept this list-of-list \n\ndata structure and display the maze on the\
    \ screen. The findStart() function \n\naccepts this data structure and returns\
    \ the x, y coordinates of the S starting \n\npoint. Feel free to edit the maze\
    \ string yourself—although remember that, \n\nin order for the solving algorithm\
    \ to work, the maze cannot have any loops.\n\nThe recursive algorithm is in the\
    \ solveMaze() function. The arguments to \n\nthis function are the maze data structure,\
    \ the current x- and y-coordinates, \n\nand a visited list (which is created if\
    \ none was supplied) 1. The visited list \n\ncontains all the coordinates that\
    \ have previously been visited, so that when \n\nthe algorithm backtracks from\
    \ a dead end to an earlier intersection, it knows \n\nwhich paths it has tried\
    \ before and can try a different one. The path from \n\nthe start to the exit\
    \ is marked by replacing the spaces (matching the EMPTY \n\nconstant) in the maze\
    \ data structure with periods (from the PATH constant).\n\nThe maze-solving algorithm\
    \ is similar to our flood fill program in \n\nChapter 3 in that it “spreads” to\
    \ neighboring coordinates, though when it \n\nreaches a dead end, it backtracks\
    \ to an earlier intersection. The solveMaze() \n\nfunction receives the x, y coordinates\
    \ indicating the algorithm’s current \n\nlocation in the maze. If this is the\
    \ exit, the function returns True , caus­\n\ning all of the recursive calls to\
    \ also return True. The maze data structure \n\nremains marked with the solution\
    \ path.\n\nOtherwise, the algorithm marks the current x, y coordinates in the\
    \ \n\nmaze data structure with a period and adds the coordinates to the visited\
    \ \n\nlist 2. Then it looks to the x, y coordinates north of the current coordinates\
    \ \n\nto see if that point is not off the edge of the map, is either the empty\
    \ or exit \n\nspace, and has not been visited before. If these conditions are\
    \ met, the algo­\n\nrithm makes a recursive call to solveMaze() with the northern\
    \ coordinates. If \n\nthese conditions aren’t met or the recursive call to solveMaze()\
    \ returns False, \n\nthe algorithm continues on to check the south, east, and\
    \ west coordinates. \n\nLike the flood fill algorithm, recursive calls are made\
    \ with the neighboring \n\ncoordinates.\n\n**MODIF YING A LIST OR ARRAY IN PLACE**\n\
    \nPython doesn’t pass a copy of lists, and JavaScript doesn’t pass a copy of \n\
    \narrays, to function calls. Rather, they pass a reference to the list. Therefore,\
    \ any \n\nchanges made to a list or array (such as the ones in maze and visited)\
    \ remain \n\neven after the function returns. This is called modifying the list\
    \ *in place*. For \n\nrecursive functions, you can think of the maze data structure\
    \ and collection of \n\nvisited coordinates as a single copy shared among all\
    \ of the recursive function \n\ncalls, unlike the x and y arguments. This is why\
    \ the data structure in MAZE is still \n\nmodified after the first call to solveMaze()\
    \ returns.\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
