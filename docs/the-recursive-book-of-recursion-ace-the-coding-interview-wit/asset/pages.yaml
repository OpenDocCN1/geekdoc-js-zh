    \ = makeDroste('museum.png')\n\nrecursiveImage.save('museum-recursive.png')\n\n\
    recursiveImage.show()\n\nBefore you run this program, place your image file in\
    \ the same folder \n\nas *drostemaker.py*. The program will save the recursive\
    \ image as *museum-*\n\n*recursive.png* and then open an image viewer to display\
    \ it. If you want to \n\nrun the program on your own image that you’ve added a\
