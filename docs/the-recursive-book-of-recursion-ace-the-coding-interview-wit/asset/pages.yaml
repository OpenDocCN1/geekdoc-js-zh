  md: "Memoization and Dynamic Programming   **153**\n\nOne approach in dynamic programming\
    \ is to memoize the recursive \n\nfunction so that previous calculations are remembered\
    \ for future function \n\ncalls. Overlapping subproblems become trivial if we\
    \ can reuse previous \n\nreturn values.\n\nUsing recursion with memoization is\
    \ called *top-down dynamic program­*\n\n*ming*. This process takes a large problem\
    \ and divides it into smaller overlap­\n\nping subproblems. A contrasting technique,\
    \ *bottom-up dynamic programming*, \n\nstarts with the smaller subproblems (often\
    \ related to the base case) and \n\n“builds up” to the solution of the original,\
    \ large problem. The iterative \n\nFibonacci algorithm, which begins with the\
    \ base cases of the first and \n\nsecond Fibonacci numbers, is an example of bottom-up\
    \ dynamic program­\n\nming. Bottom-up approaches don’t use recursive functions.\n\
    \nNote that there is no such thing as top-down recursion or bottom-up \n\nrecursion.\
    \ These are commonly used but incorrect terms. All recursion is \n\nalready top-down,\
    \ so *top-down recursion* is redundant. And no bottom-up \n\napproach uses recursion,\
    \ so there’s no such thing as *bottom-up recursion*. \n\n***Memoization in Functional\
    \ Programming***\n\nNot all functions can be memoized. To see why, we must discuss\
    \ *functional *\n\n*programming*, a programming paradigm that emphasizes writing\
    \ functions \n\nthat don’t modify global variables or any *external state* (such\
    \ as files on the \n\nhard drive, internet connections, or database contents).\
    \ Some program­\n\nming languages, such as Erlang, Lisp, and Haskell, are heavily\
    \ designed \n\naround functional programming concepts. But you can apply functional\
    \ \n\nprogramming features to almost any programming language, including \n\n\
    Python and JavaScript. \n\nFunctional programming includes the concepts of deterministic\
    \ and \n\nnondeterministic functions, side effects, and pure functions. The sqrt()\
    \ \n\nfunction mentioned in the introduction is a *deterministic* function because\
    \ \n\nit always returns the same value when passed the same argument. However,\
    \ \n\nPython’s random.randint() function, which returns a random integer, is *non­*\n\
    \n*deterministic* because even when passed the same arguments, it can return \n\
    \ndifferent values. The time.time() function, which returns the current time,\
    \ \n\nis also nondeterministic because time is constantly moving forward.\n\n\
    *Side effects* are any changes a function makes to anything outside its own \n\
    \ncode and local variables. To illustrate this, let’s create a subtract() function\
    \ \n\nthat implements Python’s subtraction operator (\\-):\n\n*Python*\n\n\\>\
    \ **def subtract(number1, number2):**\n\n... **return number1 - number2**\n\n\
    ...\n\n\\> **subtract(123, 987)**\n\n\\-864\n\nThis subtract() function has no\
    \ side effects; calling this function doesn’t \n\naffect anything in the program\
    \ outside of its code. There’s no way to tell \n\nfrom the program’s or the computer’s\
    \ state whether the subtract() function \n\nThe Recursive Book of Recursion (Early\
    \ Access) © 2022 by Al Sweigart"
