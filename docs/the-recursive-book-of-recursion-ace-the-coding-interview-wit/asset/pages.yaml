  md: "Fractal Art Maker   **269**\n\nAt this point, the turtle is ready to start\
    \ drawing the triangle, so we \n\nlower the pen by calling turtle.pendown(). A\
    \ for loop will handle drawing the \n\nthree sides:\n\n*Python*\n\n # Draw the\
    \ three sides of the triangle:\n\n for i in range(3):\n\n turtle.forward(size)\n\
    \n turtle.right(120)\n\nDrawing the actual triangle is a matter of moving forward\
    \ by size units, \n\nand then turning 120 degrees to the right, three separate\
    \ times. The third \n\nand final 120-degree turn leaves the turtle facing its\
    \ original direction. You \n\ncan see these movements and turns in Figure 13-7.\n\
    \n120°\n\n120°\n\n120°\n\n*Figure 13-7: Drawing an equilateral triangle involves\
    \ three forward movements and three *\n\n*120-degree turns.*\n\nThe drawTriangleOutline()\
    \ function draws only the outline and not a \n\nfilled-in shape, so it doesn’t\
    \ call turtle.begin\\_fill() and turtle.end\\_fill() as \n\ndrawFilledSquare()\
    \ does. \n\n**Using the Fractal Drawing Function**\n\nNow that we have two sample\
    \ drawing functions to work with, let’s examine \n\nthe main function in the Fractal\
    \ Art Maker project, drawFractal(). This func­\n\ntion has three required parameters\
    \ and one optional one: shapeDrawFunction, \n\nsize, specs, and maxDepth.\n\n\
    The shapeDrawFunction parameter expects a function, like drawFilledSquare() \n\
    \nor drawTriangleOutline(). The size parameter expects the starting size passed\
    \ \n\nto the drawing function. Often, a value between 100 and 500 is a good starting\
    \ \n\nsize, though this depends on the code in your shape-drawing function, and\
    \ \n\nfinding the right value may require experimentation. \n\nThe specs parameter\
    \ expects a list of dictionaries that specify how the \n\nrecursive shapes should\
    \ change their size, position, and angle as drawFractal() \n\nrecursively calls\
    \ itself. These specifications are described later in this section.\n\nTo prevent\
    \ drawFractal() from recursing until it causes a stack overflow, \n\nthe maxDepth\
    \ parameter holds the number of times drawFractal() should \n\nrecursively call\
    \ itself. By default, maxDepth has a value of 8, but you can pro­\n\nvide a different\
    \ value if you want more recursive shapes or fewer. \n\nThe Recursive Book of\
    \ Recursion (Early Access) © 2022 by Al Sweigart"
