  md: "**xx**   Introduction\n\ntouched a recursive algorithm before, you might find\
    \ recursion to be an \n\nembarrassing gap in your knowledge.\n\nThere’s no need\
    \ to worry. Recursion isn’t as hard to understand as it \n\nis to teach. As I’ll\
    \ explain in Chapter 1, I attribute the widespread misun­\n\nderstanding of recursion\
    \ to poor instruction rather than any inherent dif­\n\nficulty. And since recursive\
    \ functions aren’t commonly used in day-to-day \n\nprogramming, many folks get\
    \ along just fine without them. \n\nBut a certain conceptual beauty lies behind\
    \ recursive algorithms that can \n\naid your understanding of programming even\
    \ if you don’t often apply them. \n\nRecursion has a visual beauty as well. The\
    \ technique is behind the amazing \n\nmathematical art of *fractals*, the self-similar\
    \ shapes shown in Figure 0-1.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_21_0.png)\n\
    \n*Examples of fractals such as a Sierpi**ń**ski triangle (left), a Hilbert curve\
    \ (center), and a Koch snowflake (right)*\n\nHowever, this book is not entirely\
    \ in praise of recursion. I include some \n\nsharp criticisms of this technique.\
    \ Recursion is overused in cases where a \n\nsimpler solution exists. Recursive\
    \ algorithms can be hard to understand, \n\nhave worse performance, and are susceptible\
    \ to crash-causing stack over­\n\nflow errors. And a certain kind of programmer\
    \ may use recursion not \n\nbecause it’s the right technique for a given problem,\
    \ but simply because \n\nthey feel smarter when they write code that other programmers\
    \ struggle \n\nto understand. Computer scientist Dr. John Wilander once said,\
    \ “When \n\nyou finish a PhD in computer science, they take you to a special room\
    \ and \n\nexplain that you must never use recursion in real life. Its only purpose\
    \ is to \n\nmake programming hard for undergrads.”\n\nSo, whether you’re reading\
    \ this book to get an edge in coding inter­\n\nviews, to create beautiful mathematical\
    \ art, or because you stubbornly seek \n\nto finally understand the intriguing\
    \ properties of this concept, this book \n\nwill be your guide down the rabbit\
    \ hole that is recursion (and the rabbit \n\nholes within that rabbit hole). Recursion\
    \ is one of the computer science \n\ntopics that separates the professionals from\
    \ the beginners. By reading this \n\nbook, you’ll master a great skill and learn\
    \ its dark secret: recursion isn’t as \n\ncomplicated as people think it is.\n\
    \n**Who Is This Book For?**\n\nThis book is for those who are intimidated or intrigued\
    \ by recursive algo­\n\nrithms. Recursion is one of those topics that seems like\
    \ black magic to \n\nThe Recursive Book of Recursion (Early Access) © 2022 by\
    \ Al Sweigart"
