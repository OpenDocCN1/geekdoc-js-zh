  md: "**3**\n\n**CL A S S IC R ECU R S ION **\n\n**A L GOR I T H M S**\n\nIf you\
    \ take a computer science course, \n\nthe unit on recursion is sure to cover some\
    \ \n\nof the classic algorithms presented in this \n\nchapter. Coding interviews\
