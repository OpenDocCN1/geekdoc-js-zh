  md: "Divide-and-Conquer Algorithms   **95**\n\nThis process scales efficiently;\
    \ doubling the number of books to search \n\nadds only one step to the search\
    \ process. Searching a shelf with 50 books \n\nlinearly from one end to the other\
    \ takes 50 steps, and linearly searching \n\na shelf with 100 books takes 100\
    \ steps. But binary search of a shelf with \n\n50 books takes only 6 steps, and\
    \ a shelf with 100 books takes only 7 steps. \n\nLet’s ask the three recursion\
    \ questions about our binary search \n\nimplementation:\n\n**What is the base\
    \ case?   ** Searching a range of items that is only one \n\nitem in length.\n\
    \n**What argument is passed to the recursive function call?   ** The indexes \n\
    \nof the left and right ends of the range in the list we are searching.\n\n**How\
    \ does this argument become closer to the base case?   ** The \n\nrange halves\
    \ in size for each recursive call, so it eventually becomes \n\none item long.\n\
    \nExamine the following binarySearch() function in our *binarySearch.py* \n\n\
    program, which locates a value, needle, in a sorted list of values, haystack:\n\
    \n*Python*\n\ndef binarySearch(needle, haystack, left=None, right=None):\n\n #\
    \ By default, \\`left\\` and \\`right\\` are all of \\`haystack\\`:\n\n if left\
    \ is None:\n\n left = 0 # \\`left\\` defaults to the 0 index.\n\n if right is\
    \ None:\n\n right = len(haystack) - 1 # \\`right\\` defaults to the last index.\n\
    \n print('Searching:', haystack\\[left:right + 1\\])\n\n if left > right: # BASE\
    \ CASE\n\n return None # The \\`needle\\` is not in \\`haystack\\`.\n\n mid =\
    \ (left + right) // 2\n\n if needle == haystack\\[mid\\]: # BASE CASE\n\n return\
    \ mid # The \\`needle\\` has been found in \\`haystack\\`\n\n elif needle < haystack\\\
    [mid\\]: # RECURSIVE CASE\n\n return binarySearch(needle, haystack, left, mid\
    \ - 1)\n\n elif needle > haystack\\[mid\\]: # RECURSIVE CASE\n\n return binarySearch(needle,\
    \ haystack, mid + 1, right)\n\nprint(binarySearch(13, \\[1, 4, 8, 11, 13, 16,\
    \ 19, 19\\]))\n\nThe *binarySearch.html* program has this JavaScript equivalent:\n\
    \n*JavaScript*\n\n<script type=\"text/javascript\">\n\nfunction binarySearch(needle,\
    \ haystack, left, right) {\n\n if (left === undefined) {\n\n left = 0; // \\`left\\\
    ` defaults to the 0 index.\n\n }\n\n if (right === undefined) {\n\n right = haystack.length\
    \ - 1 // \\`right\\` defaults to the last index.\n\n }\n\nThe Recursive Book of\
    \ Recursion (Early Access) © 2022 by Al Sweigart"
