  md: "Fractal Art Maker   **271**\n\nrecursive call to drawFractal(). If specs is\
    \ a list with one dictionary, every call \n\nto drawFractal() results in only\
    \ one recursive call to drawFractal(). If specs is a \n\nlist with three dictionaries,\
    \ every call to drawFractal() results in three recur­\n\nsive calls to drawFractal().\n\
    \nThe dictionaries in the specs parameter provide specifications for each \n\n\
    recursive call. Each of these dictionaries has the keys sizeChange, xChange, \n\
    \nyChange, and angleChange. These dictate how the size of the fractal, the posi­\n\
    \ntion of the turtle, and the heading of the turtle change for a recursive draw­\n\
    \nFractal() call. Table 13-1 describes the four keys in a specification.\n\nTable 13-1:\
    \ Keys in the Specification Dictionaries\n\nKey\n\nDefault value\n\nDescription\n\
    \nsizeChange\n\n1.0\n\nThe next recursive shape’s size value is the current \n\
    \nsize multiplied by this value.\n\nxChange\n\n0.0\n\nThe next recursive shape’s\
    \ x-coordinate is the current \n\nx-coordinate plus the current size multiplied\
    \ by this \n\nvalue.\n\nyChange\n\n0.0\n\nThe next recursive shape’s y-coordinate\
    \ is the current \n\ny-coordinate plus the current size multiplied by this \n\n\
    value.\n\nangleChange\n\n0.0\n\nThe next recursive shape’s starting angle is the\
    \ current \n\nstarting angle plus this value.\n\nLet’s take a look at the specification\
    \ dictionary for the Four Corners \n\nfractal, which produces the top-left image\
    \ shown previously in Figure 13-1. \n\nThe call to drawFractal() for the Four\
    \ Corners fractal passes the following \n\nlist of dictionaries for the specs\
    \ parameter:\n\n*Python*\n\n\\[{'sizeChange': 0.5, 'xChange': -0.5, 'yChange':\
    \ 0.5},\n\n {'sizeChange': 0.5, 'xChange': 0.5, 'yChange': 0.5},\n\n {'sizeChange':\
    \ 0.5, 'xChange': -0.5, 'yChange': -0.5},\n\n {'sizeChange': 0.5, 'xChange': 0.5,\
    \ 'yChange': -0.5}\\]\n\nThe specs list has four dictionaries, so each call to\
    \ drawFractal() that \n\ndraws a square will, in turn, recursively call drawFractal()\
    \ four more times \n\nto draw four more squares. Figure 13-8 shows this progression\
    \ of squares \n\n(which alternate between white and gray).\n\nTo determine the\
    \ size of the next square to be drawn, the value for the \n\nsizeChange key is\
    \ multiplied by the current size parameter. The first diction­\n\nary in the specs\
    \ list has a sizeChange value of 0.5, which makes the next recur­\n\nsive call\
    \ have a size argument of 350 \\* 0.5, or 175 units. This makes the next \n\n\
    square half the size of the previous square. A sizeChange value of 2.0 would,\
    \ \n\nfor example, double the size of the next square. If the dictionary has no\
    \ \n\nsizeChange key, the value defaults to 1.0 for no change to the size.\n\n\
    The Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
