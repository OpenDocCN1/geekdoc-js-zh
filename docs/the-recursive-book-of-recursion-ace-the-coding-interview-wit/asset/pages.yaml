  md: "**256**   Chapter 12\n\n maxMoves += 1;\n\n}\n\ndocument.write(\"Run in \"\
    \ + Math.round((Date.now() - startTime) / 100) / 10 + \" seconds.<br \n\n/>\"\
    );\n\n</script>\n\nThe program begins trying to solve the puzzle in puzzleBoard\
    \ in a \n\nmaximum of 10 moves. The infinite while loop calls solve(). If a solution\
    \ is \n\nfound, solve() prints the solution on the screen and returns True. In\
    \ that \n\ncase, the code here can break out of the infinite while loop and print\
    \ the \n\ntotal runtime of the algorithm. \n\nOtherwise, if solve() returns False,\
    \ maxMoves is incremented by 1 and the \n\nloop calls solve() again. This lets\
    \ the program try progressively longer com­\n\nbinations of moves to solve the\
    \ puzzle. This pattern continues until solve() \n\nfinally returns True.\n\n**Further\
    \ Reading**\n\nThe Wikipedia entry for 15-puzzles at *https://en.wikipedia.org/wiki/15\\\
    _puzzle* \n\ndetails their history and mathematical background.\n\nYou can find\
    \ the Python source code for a playable version of the \n\nsliding-tile puzzle\
    \ game in my book *The Big Book of Small Python Projects* (No \n\nStarch Press,\
    \ 2021) and online at *https://inventwithpython.com/bigbookpython/*\n\n*project68.html*.\n\
    \n**Summary**\n\nA 15-puzzle is a good example of adapting the principles of recursion\
    \ to a \n\nreal-world problem. Recursion can perform a depth-first search on the\
    \ tree \n\ngraph of states that a 15-puzzle produces to find the path to a solution\
    \ state. \n\nHowever, a purely recursive algorithm won’t work, which was why we\
    \ had to \n\nmake certain adjustments.\n\nThe problem arises because a 15-puzzle\
    \ has a massive number of possi­\n\nble states and doesn’t form a DAG. The edges\
    \ in this graph are undirected, \n\nand the graph contains loops, or cycles. Our\
    \ solving algorithm needs to \n\nensure that it doesn’t make moves that immediately\
    \ undo the previous \n\nmove, so that it traverses the graph in one direction.\
    \ It also needs to have \n\na maximum number of moves the algorithm is willing\
    \ to make before it \n\nbegins to backtrack; otherwise, the loops guarantee that\
    \ the algorithm will \n\neventually recurse too much and cause a stack overflow.\n\
    \nRecursion isn’t necessarily the best approach for solving sliding-tile \n\n\
    puzzles. All but the easiest puzzles simply have too many combinations for a \n\
    \ntypical laptop to solve within a reasonable amount of time. However, I like\
    \ \n\nthe 15-puzzle as an exercise in recursion because it connects the theoretical\
    \ \n\nideas of DAGs and DFS into a real-world problem. While 15-puzzles were \n\
    \ninvented over a century ago, the advent of computers provides a rich tool \n\
    \nfor exploring techniques to solve these amusing toys.\n\nThe Recursive Book\
    \ of Recursion (Early Access) © 2022 by Al Sweigart"
