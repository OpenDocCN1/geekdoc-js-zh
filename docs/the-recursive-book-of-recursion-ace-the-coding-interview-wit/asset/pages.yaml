    )\n\n..Adding each char to prefix \"JJ\".\n\n...Start, args=(\"JPB123\", 1, \"\
    JJJ\")\n\n...Adding each char to prefix \"JJJ\".\n\n....Start, args=(\"JPB123\"\
    , 0, \"JJJJ\")\n\n....Base case reached, returning \\['JJJJ'\\]\n\n....Start,\
