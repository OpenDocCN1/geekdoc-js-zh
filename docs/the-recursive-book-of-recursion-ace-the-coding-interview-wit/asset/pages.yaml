    os.path.getmtime()\n\ntime.localtime()\n\ntime.asctime()\n\n.tm\\_year\n\n.tm\\\
    _mon\n\n.tm\\_mday\n\n.tm\\_wday\n\n.tm\\_hour\n\n.tm\\_min\n\n.tm\\_sec\n\ntime.gmtime()\n\
    \nos.path.getatime()\n\n*Figure 10-2: Going from the filename to the individual\
    \ attributes of a timestamp*\n\nThe Recursive Book of Recursion (Early Access)\
    \ © 2022 by Al Sweigart"
