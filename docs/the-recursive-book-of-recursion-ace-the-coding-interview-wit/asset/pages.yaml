    \ i # Needle found.\n\n i = i + 1\n\n return -1 # Needle not found.\n\ndef findSubstringRecursive(needle,\
    \ haystack, i=0):\n\n if i >= len(haystack):\n\n return -1 # BASE CASE (Needle\
    \ not found.)\n\n if haystack\\[i:i + len(needle)\\] == needle:\n\n return i #\
    \ BASE CASE (Needle found.)\n\n else:\n\n # RECURSIVE CASE\n\n return findSubstringRecursive(needle,\
    \ haystack, i + 1)\n\nprint(findSubstringIterative('cat', 'My cat Zophie'))\n\n\
    print(findSubstringRecursive('cat', 'My cat Zophie'))\n\nThis *findSubstring.html*\
