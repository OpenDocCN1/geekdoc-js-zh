  md: "Permutations and Combinations   **129**\n\nThe output of these programs is\
    \ the following:\n\nPermutations of \"ABCD\":\n\nStart of getPerms(\"ABCD\")\n\
    \n.Start of getPerms(\"BCD\")\n\n..Start of getPerms(\"CD\")\n\n...Start of getPerms(\"\
    D\")\n\n...When chars = \"D\" base case returns D\n\n..When chars = CD putting\
    \ head C in all places in D\n\n..New permutation: CD\n\n..New permutation: DC\n\
    \n..When chars = CD results are \\['CD', 'DC'\\]\n\n.When chars = BCD putting\
    \ head B in all places in CD\n\n.New permutation: BCD\n\n.New permutation: CBD\n\
    \n.New permutation: CDB\n\n.When chars = BCD putting head B in all places in DC\n\
    \n.New permutation: BDC\n\n.New permutation: DBC\n\n.New permutation: DCB\n\n\
    .When chars = BCD results are \\['BCD', 'CBD', 'CDB', 'BDC', 'DBC', 'DCB'\\]\n\
    \n*\\--snip--*\n\nWhen chars = ABCD putting head A in all places in DCB\n\nNew\
    \ permutation: ADCB\n\nNew permutation: DACB\n\nNew permutation: DCAB\n\nNew permutation:\
    \ DCBA\n\nWhen chars = ABCD results are \\['ABCD', 'BACD', 'BCAD', 'BCDA', 'ACBD',\
    \ 'CABD', \n\n'CBAD', 'CBDA', 'ACDB',\n\n'CADB', 'CDAB', 'CDBA', 'ABDC', 'BADC',\
    \ 'BDAC', 'BDCA', 'ADBC', 'DABC', \n\n'DBAC', 'DBCA', 'ADCB', 'DACB', 'DCAB',\
    \ 'DCBA'\\]\n\nResults: ABCD,BACD,BCAD,BCDA,ACBD,CABD,CBAD,CBDA,ACDB,CADB,CDAB,CDBA,ABDC,\n\
    \nBADC,BDAC,BDCA,ADBC,DABC,DBAC,DBCA,ADCB,DACB,DCAB,DCBA\n\nWhen getPerms() is\
    \ called, it first checks for the base case 1. If the chars \n\nstring is only\
    \ one character long, it can have only one permutation: the \n\nchars string itself.\
    \ The function returns this string in an array.\n\nOtherwise, in the recursive\
    \ case, the function splits the chars argument’s \n\nfirst character into the\
    \ head variable and the rest into the tail variable 2. The \n\nfunction makes\
    \ a recursive call to getPerms() to get all of the permutations of \n\nthe string\
    \ in tail. A first for loop 3 iterates over each of these permutations, \n\nand\
    \ a second for loop 4 creates a new permutation by placing the head char­\n\n\
    acter in every possible place in the string.\n\nFor example, if getPerms() is\
    \ called with ABCD for the chars argument, \n\nhead is A and tail is BCD. The\
    \ getPerms('BCD') call returns an array of the \n\ntail permutations, \\['BCD',\
    \ 'CBD', 'CDB', 'BDC', 'DBC', 'DCB'\\]. The first for \n\nloop starts with the\
    \ BCD permutation, and the second for loop places the A \n\nstring in head in\
    \ each possible place, producing ABCD, BACD, BCAD, BCDA. This is \n\nrepeated\
    \ with the remaining tail permutations, and the entire list is then \n\nreturned\
    \ by the getPerms() function.\n\nThe Recursive Book of Recursion (Early Access)\
    \ © 2022 by Al Sweigart"
