  md: "**Further Reading**\n\nThere are websites online that allow you to create fractals.\
    \ Interactive \n\nFractal Tree at *https://www.visnos.com/demos/fractal* has sliders\
    \ to change \n\na binary tree fractal’s angle and size parameters. Procedural\
    \ Snowflake \n\nat *https://procedural-snowflake.glitch.me* generates new snowflakes\
    \ in your \n\nbrowser. Nico’s Fractal Machine at *https://sciencevsmagic.net/fractal*\
    \ creates \n\nanimated drawings of fractals. You can find others by searching\
    \ the web for \n\n*fractal maker* or *fractal generator online*.\n\n**Summary**\n\
    \nThe Fractal Art Maker projects demonstrate the endless possibilities of \n\n\
    recursion. A simple recursive drawFractal() function, paired with a shape-\n\n\
    drawing function, can create a large variety of detailed geometric art.\n\nAt\
    \ the core of the Fractal Art Maker is the recursive drawFractal() func­\n\ntion,\
    \ which accepts another function as an argument. This second function \n\ndraws\
    \ a basic shape repeatedly by using the size, position, and heading given \n\n\
    in the list of specification dictionaries. \n\nYou can test an unlimited number\
    \ of shape-drawing functions and \n\nspecification settings. Let your creativity\
    \ drive your fractal projects as you \n\nexperiment with the code in this program.\n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
