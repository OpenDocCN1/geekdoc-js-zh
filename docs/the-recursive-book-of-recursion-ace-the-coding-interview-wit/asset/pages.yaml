    \ \\[0, 1, 2, 3, 4, 7, 5, 6\\]\n\nquicksort() called on this range: \\[7, 5, 6\\\
    ]\n\n................The full list is: \\[0, 1, 2, 3, 4, 7, 5, 6\\]\n\n....................The\
    \ pivot is: 6\n\n....After swapping, the range is: \\[5, 6, 7\\]\n\nRecursively\
    \ calling quicksort on: \\[5\\] and \\[7\\]\n\nquicksort() called on this range:\
    \ \\[5\\]\n\n................The full list is: \\[0, 1, 2, 3, 4, 5, 6, 7\\]\n\n\
    quicksort() called on this range: \\[7\\]\n\n................The full list is:\
    \ \\[0, 1, 2, 3, 4, 5, 6, 7\\]\n\nSorted: \\[0, 1, 2, 3, 4, 5, 6, 7\\]\n\nQuicksort\
    \ is a commonly used sorting algorithm because it is straight­\n\nforward to implement\
    \ and, well, quick. The other commonly used sorting \n\nalgorithm, merge sort,\
    \ is also fast and uses recursion. We cover it next.\n\n**Merge Sort: Merging\
    \ Small Piles of Playing Cards into **\n\n**Larger Sorted Piles**\n\nComputer\
    \ scientist John von Neumann developed *merge sort* in 1945. This \n\nefficient,\
    \ general-purpose sorting algorithm is used to particularly to sort \n\nlinked\
    \ list data structures. It uses a divide-merge approach: each recursive \n\ncall\
    \ to mergeSort() divides the unsorted list into halves until they’ve been \n\n\
    whittled down into lists of lengths of zero or one. Then, as the recursive \n\n\
    calls return, these smaller lists are merged together into sorted order. \n\n\
    When the last recursive call has returned, the entire list will have been \n\n\
    sorted.\n\nFor example, the divide step takes a list, such as \\[2, 9, 8, 5, 3,\
    \ 4, \n\n7, 6\\], and splits it into two lists, like \\[2, 9, 8, 5\\] and \\[3,\
    \ 4, 7, 6\\], to \n\npass to two recursive function calls. At the base case, the\
    \ lists have been \n\ndivided into lists of zero or one item. A list with nothing\
    \ or one item is \n\nnaturally sorted. After the recursive calls return, the code\
    \ merges these \n\nsmall, sorted lists together into larger sorted lists until\
    \ finally the entire \n\nlist is sorted. Figure 5-3 shows an example using merge\
    \ sort on playing \n\ncards.\n\nThe Recursive Book of Recursion (Early Access)\
    \ © 2022 by Al Sweigart"
