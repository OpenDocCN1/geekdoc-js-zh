    \ LEFT, RIGHT values.\n\n let solved = attemptMove(board, solutionMoves, maxMoves,\
    \ null);\n\nThe solve() function has two parameters: board contains the data struc­\n\
    \nture of the puzzle to solve, and maxMoves is the maximum number of moves \n\n\
