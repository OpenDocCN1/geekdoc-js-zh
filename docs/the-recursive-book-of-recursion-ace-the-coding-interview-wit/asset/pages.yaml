  md: "What is Recursion?   **17**\n\nnumber variable for each frame on the call stack.\
    \ This is another often con­\n\nfusing point about recursion: even though, from\
    \ the source code, it looks \n\nlike there is only one number variable, remember\
    \ that because it is a local \n\nvariable, there is actually a different number\
    \ variable for each function call.\n\nWhen countDownAndUp(3) is called 5, a frame\
    \ is created, and that frame’s \n\nlocal number variable is set to 3. The function\
    \ prints the number variable to the \n\nscreen 1. As long as number isn’t 0, countDownAndUp()\
    \ is recursively called with \n\nnumber - 1 2. When it calls countDownAndUp(2) 3,\
    \ a new frame is pushed onto \n\nthe stack, and that frame’s local number variable\
    \ is set to 2. Again, the recur­\n\nsive case is reached and calls countDownAndUp(1) 3,\
    \ which again reaches the \n\nrecursive case and calls countDownAndUp(0).\n\n\
    This pattern of making consecutive recursive function calls and then \n\nreturning\
    \ from the recursive function calls is what causes the countdown \n\nof numbers\
    \ to appear. Once countDownAndUp(0) is called, the base case is \n\nreached 2,\
    \ and no more recursive calls are made. However, this isn’t the \n\nend of our\
    \ program! When the base case is reached, the local number vari­\n\nable is 0.\
    \ But when that base case returns, and the frame is popped off \n\nthe call stack,\
    \ the frame under it has its own local number variable, with the \n\nsame 1 value\
    \ it’s always had. As the execution returns back to the previous \n\nframes in\
    \ the call stack, the code *after* the recursive call is executed 4. \n\nThis\
    \ is what causes the count up of numbers to appear. Figure 1-9 shows \n\nthe state\
    \ of the call stack as countDownAndUp() is recursively called and then \n\nreturns.\n\
    \nEmpty\n\ncountDownAndUp()\n\nnumber = 1\n\ncountDownAndUp()\n\nnumber = 2\n\n\
    countDownAndUp()\n\nnumber = 3\n\ncountDownAndUp()\n\nnumber = 2\n\ncountDownAndUp()\n\
    \nnumber = 1\n\ncountDownAndUp()\n\nnumber = 0\n\nEmpty\n\ncountDownAndUp()\n\n\
    number = 3\n\n*Figure 1-9: The call stack keeping track of the values in the number\
    \ local variable for each function call*\n\nThe Recursive Book of Recursion (Early\
    \ Access) © 2022 by Al Sweigart"
