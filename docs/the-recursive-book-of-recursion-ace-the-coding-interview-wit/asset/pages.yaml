  md: "Permutations and Combinations   **141**\n\nThe *balancedParentheses.py* file\
    \ contains the Python code for our bal­\n\nanced parentheses recursive function:\n\
    \ndef getBalancedParens(pairs, openRem=None, closeRem=None, current='', indent=0):\n\
    \n if openRem is None: 1\n\n openRem = pairs\n\n if closeRem is None:\n\n closeRem\
    \ = pairs\n\n print('.' \\* indent, end='')\n\n print('Start of pairs=' + str(pairs)\
    \ + ', openRem=' + \n\n str(openRem) + ', closeRem=' + str(closeRem) + ', current=\"\
    ' + current + '\"')\n\n if openRem == 0 and closeRem == 0: 2\n\n # BASE CASE\n\
    \n print('.' \\* indent, end='')\n\n print('1st base case. Returning ' + str(\\\
    [current\\]))\n\n return \\[current\\] 3\n\n # RECURSIVE CASE\n\n results = \\\
    [\\]\n\n if openRem > 0: 4\n\n print('.' \\* indent, end='')\n\n print('Adding\
    \ open parenthesis.')\n\n results.extend(getBalancedParens(pairs, openRem - 1,\
    \ closeRem, \n\n current + '(', indent + 1))\n\n if closeRem > openRem: 5\n\n\
    \ print('.' \\* indent, end='')\n\n print('Adding close parenthesis.')\n\n results.extend(getBalancedParens(pairs,\
    \ openRem, closeRem - 1, \n\n current + ')', indent + 1))\n\n # BASE CASE\n\n\
    \ print('.' \\* indent, end='')\n\n print('2nd base case. Returning ' + str(results))\n\
    \n return results 6\n\nprint('All combinations of 2 balanced parentheses:')\n\n\
    print('Results:', getBalancedParens(2))\n\nThe *balancedParentheses.html* file\
    \ contains the JavaScript equivalent of \n\nthis program:\n\n<script type=\"text/javascript\"\
    >\n\nfunction getBalancedParens(pairs, openRem, closeRem, current, indent) {\n\
    \n if (openRem === undefined) { 1\n\n openRem = pairs;\n\n }\n\n if (closeRem\
    \ === undefined) {\n\n closeRem = pairs;\n\n }\n\n if (current === undefined)\
    \ {\n\n current = \"\";\n\n }\n\nThe Recursive Book of Recursion (Early Access)\
    \ © 2022 by Al Sweigart"
