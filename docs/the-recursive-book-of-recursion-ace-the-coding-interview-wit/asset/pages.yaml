  md: "**186**   Chapter 9\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_211_0.png)\n\
    \n*Figure 9-9: The Sierpi**ń**ski carpet, with only the outlines of the rectangles\
    \ drawn*\n\nAnother 3D Sierpiński carpet uses cubes instead of squares. In this\
