  md: "Drawing Fractals   **181**\n\nMIN\\_SIZE = 4 # Try changing this to decrease/increase\
    \ the amount of recursion.\n\ndef midpoint(startx, starty, endx, endy):\n\n #\
    \ Return the x, y coordinate in the middle of the four given parameters.\n\n xDiff\
    \ = abs(startx - endx)\n\n yDiff = abs(starty - endy)\n\n return (min(startx,\
    \ endx) + (xDiff / 2.0), min(starty, endy) + (yDiff / 2.0))\n\ndef isTooSmall(ax,\
    \ ay, bx, by, cx, cy):\n\n # Determine if the triangle is too small to draw.\n\
    \n width = max(ax, bx, cx) - min(ax, bx, cx)\n\n height = max(ay, by, cy) - min(ay,\
    \ by, cy)\n\n return width < MIN\\_SIZE or height < MIN\\_SIZE\n\ndef drawTriangle(ax,\
    \ ay, bx, by, cx, cy):\n\n if isTooSmall(ax, ay, bx, by, cx, cy):\n\n # BASE CASE\n\
    \n return\n\n else:\n\n # RECURSIVE CASE\n\n # Draw the triangle.\n\n turtle.penup()\n\
    \n turtle.goto(ax, ay)\n\n turtle.pendown()\n\n turtle.goto(bx, by)\n\n turtle.goto(cx,\
    \ cy)\n\n turtle.goto(ax, ay)\n\n turtle.penup()\n\n # Calculate midpoints between\
    \ points A, B, and C.\n\n mid\\_ab = midpoint(ax, ay, bx, by)\n\n mid\\_bc = midpoint(bx,\
    \ by, cx, cy)\n\n mid\\_ca = midpoint(cx, cy, ax, ay)\n\n # Draw the three inner\
    \ triangles.\n\n drawTriangle(ax, ay, mid\\_ab\\[0\\], mid\\_ab\\[1\\], mid\\\
    _ca\\[0\\], mid\\_ca\\[1\\])\n\n drawTriangle(mid\\_ab\\[0\\], mid\\_ab\\[1\\\
    ], bx, by, mid\\_bc\\[0\\], mid\\_bc\\[1\\])\n\n drawTriangle(mid\\_ca\\[0\\],\
    \ mid\\_ca\\[1\\], mid\\_bc\\[0\\], mid\\_bc\\[1\\], cx, cy)\n\n return\n\n\\\
    # Draw an equilateral Sierpinski triangle.\n\ndrawTriangle(50, 50, 350, 650, 650,\
    \ 50)\n\n\\# Draw a skewed Sierpinski triangle.\n\n#drawTriangle(30, 250, 680,\
    \ 600, 500, 80)\n\nturtle.exitonclick()\n\nWhen you run this code, the output\
    \ looks like Figure 9-5.\n\nThe Recursive Book of Recursion (Early Access) © 2022\
    \ by Al Sweigart"
