  md: "Tail Call Optimization   **165**\n\nTo understand how tail call optimization\
    \ works, remember from \n\nChapter 1 what happens when a function is called. First,\
    \ a frame object is \n\ncreated and stored on the call stack. If the function\
    \ call calls another func­\n\ntion, another frame object is created and placed\
    \ on top of the first frame \n\nobject on the call stack. When a function returns,\
    \ your program automati­\n\ncally deletes the frame object from the top of the\
    \ stack.\n\nA stack overflow happens when too many function calls are made with­\n\
    \nout returning, causing the number of frame objects to exceed the capac­\n\n\
    ity of the call stack. This capacity is 1,000 function calls for Python and \n\
    \nabout 10,000 for JavaScript programs. While these amounts are more than \n\n\
    enough for typical programs, recursive algorithms could exceed this limit \n\n\
    and cause a stack overflow that crashes your program.\n\nRecall from Chapter 1\
    \ that a frame object stores the local variables in \n\nthe function call as well\
    \ as the return address of the instruction to return to \n\nwhen the function\
    \ finishes. However, if the last action in the recursive case \n\nof a function\
    \ is to return the results of a recursive function call, there’s no \n\nneed to\
    \ retain the local variables. The function does nothing involving the \n\nlocal\
    \ variables after the recursive call, so the current frame object can be \n\n\
    deleted immediately. The next frame object’s return address information \n\ncan\
    \ be the same as the old deleted frame object’s return address.\n\nSince the current\
    \ frame object is deleted instead of retained on the \n\ncall stack, the call\
    \ stack never grows in size and can never cause a stack \n\noverflow!\n\nRecall\
    \ from Chapter 1 that all recursive algorithms can be imple­\n\nmented with a\
    \ stack and a loop. Since tail call optimization removes the \n\nneed for a call\
    \ stack, we are effectively using recursion to simulate a loop’s \n\niterative\
    \ code. However, earlier in this book, I stated that the problems suit­\n\nable\
    \ for recursive solutions involve a tree-like data structure and backtrack­\n\n\
    ing. Without a call stack, no tail recursive function could possibly do any \n\
    \nbacktracking work. In my view, every algorithm that can be implemented \n\n\
    with tail recursion would be easier and more readable to implement with \n\na\
    \ loop instead. There’s nothing automatically more elegant about using \n\nrecursion\
    \ for recursion’s sake.\n\n**Accumulators in Tail Recursion**\n\nThe disadvantage\
    \ of tail recursion is that it requires rearranging your \n\nrecursive function\
    \ so that the last action is returning the recursive call’s \n\nreturn value.\
    \ This can make our recursive code even more unreadable. \n\nIndeed, the factorial()\
    \ function in this chapter’s *factorialTailCall.py* and \n\n*factorialTailCall.html*\
    \ is a bit harder to comprehend than the version in \n\nChapter 2’s *factorialByRecursion.py*\
    \ and *factorialByRecursion.html* programs.\n\nIn the case of our tail call factorial()\
    \ function, a new parameter named \n\naccum keeps track of the calculated product\
    \ as recursive function calls are \n\nmade. This is known as an *accumulator*\
    \ parameter, which keeps track of a \n\npartial result of a calculation that would\
    \ otherwise have been stored in a \n\nlocal variable. Not all tail recursive functions\
    \ use accumulators, but they act \n\nThe Recursive Book of Recursion (Early Access)\
    \ © 2022 by Al Sweigart"
