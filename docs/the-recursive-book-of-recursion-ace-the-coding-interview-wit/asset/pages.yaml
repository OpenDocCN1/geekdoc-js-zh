  md: "**276**   Chapter 13\n\n***Double Spiral Squares***\n\nThe *Double Spiral Squares\
    \ fractal* is similar to Spiral Squares, except each \n\nsquare creates two smaller\
    \ squares. This creates an interesting fan effect, \n\nas the second square is\
    \ drawn later and tends to cover up previously drawn \n\nsquares:\n\n*Python*\n\
    \nelif DRAW\\_FRACTAL == 3:\n\n # Double Spiral Squares:\n\n drawFractal(drawFilledSquare,\
    \ 600,\n\n \\[{'sizeChange': 0.8, 'yChange': 0.1, 'angleChange': -10},\n\n {'sizeChange':\
    \ 0.8, 'yChange': -0.1, 'angleChange': 10}\\])\n\nThe squares are created slightly\
    \ higher or lower than their previous \n\nsquare and rotated either 10 or \\-10\
    \ degrees. \n\n***Triangle Spiral***\n\nThe *Triangle Spiral* *fractal*, another\
    \ variation of the Spiral Square, uses the \n\ndrawTriangleOutline() shape-drawing\
    \ function instead of drawFilledSquare():\n\n*Python*\n\nelif DRAW\\_FRACTAL ==\
    \ 4:\n\n # Triangle Spiral:\n\n drawFractal(drawTriangleOutline, 20,\n\n \\[{'sizeChange':\
    \ 1.05, 'angleChange': 7}\\], 80)\n\nUnlike the Spiral Square, the Triangle Spiral\
    \ begins at the small size \n\nof 20 units and slightly increases in size for\
    \ each level of recursion. The \n\nsizeChange key is greater than 1.0, so the\
    \ shapes are always increasing in size. \n\nThis means the base case occurs when\
    \ the recursion reaches a depth of 80, \n\nbecause the base case of size becoming\
    \ less than 1 is never reached.\n\n***Conway’s Game of Life Glider***\n\n*Conway’s\
    \ Game of Life* is a famous example of cellular automata. The game’s \n\nsimple\
    \ rules cause interesting and wildly chaotic patterns to emerge on a \n\ntwo-dimensional\
    \ grid. One such pattern is a *Glider fractal* consisting of five \n\ncells in\
    \ a 3 × 3 space:\n\n*Python*\n\nelif DRAW\\_FRACTAL == 5:\n\n # Conway's Game\
    \ of Life Glider:\n\n third = 1 / 3\n\n drawFractal(drawFilledSquare, 600,\n\n\
    \ \\[{'sizeChange': third, 'yChange': third},\n\n {'sizeChange': third, 'xChange':\
    \ third},\n\n {'sizeChange': third, 'xChange': third, 'yChange': -third},\n\n\
    \ {'sizeChange': third, 'yChange': -third},\n\n {'sizeChange': third, 'xChange':\
    \ -third, 'yChange': -third}\\])\n\nThe Glider fractal here has additional Gliders\
    \ drawn inside each of its \n\nfive cells. The third variable helps precisely\
    \ set the position of the recursive \n\nshapes in the 3 × 3 space.\n\nThe Recursive\
    \ Book of Recursion (Early Access) © 2022 by Al Sweigart"
  merge: -1
  pgno: 301
- img_proc: true
  md: "Fractal Art Maker   **277**\n\nYou can find a Python implementation of Conway’s\
    \ Game of Life online \n\nat *https://inventwithpython.com/bigbookpython/project13.html*.\
    \ Tragically, John \n\nConway, the mathematician and professor who developed Conway’s\
    \ Game \n\nof Life, passed away of complications from COVID-19 in April 2020.\n\
    \n***Sierpi******ń******ski Triangle***\n\nWe created the *Sierpi**ń**ski Triangle\
    \ fractal* in Chapter 9, but our Fractal Art \n\nMaker can re-create it as well\
    \ by using the drawTriangleOutline() shape func­\n\ntion. After all, a Sierpiński\
    \ triangle is an equilateral triangle with three \n\nsmaller equilateral triangles\
    \ drawn in its interior:\n\n*Python*\n\nelif DRAW\\_FRACTAL == 6:\n\n # Sierpinski\
    \ Triangle:\n\n toMid = math.sqrt(3) / 6\n\n drawFractal(drawTriangleOutline,\
    \ 600,\n\n \\[{'sizeChange': 0.5, 'yChange': toMid, 'angleChange': 0},\n\n {'sizeChange':\
    \ 0.5, 'yChange': toMid, 'angleChange': 120},\n\n {'sizeChange': 0.5, 'yChange':\
    \ toMid, 'angleChange': 240}\\])\n\nThe center of these smaller triangles is size\
    \ \\* math.sqrt(3) / 6 units \n\nfrom the center of the previous triangle. The\
    \ three calls adjust the heading \n\nof the turtle to 0, 120, and 240 degrees\
    \ before moving up on the turtle’s rela­\n\ntive y-axis.\n\n***Wave***\n\nWe discussed\
    \ the *Wave fractal* at the start of this chapter. This relatively sim­\n\nple\
    \ fractal creates three smaller and distinct recursive triangles:\n\n*Python*\n\
    \nelif DRAW\\_FRACTAL == 7:\n\n # Wave:\n\n drawFractal(drawTriangleOutline, 280,\n\
    \n \\[{'sizeChange': 0.5, 'xChange': -0.5, 'yChange': 0.5},\n\n {'sizeChange':\
    \ 0.3, 'xChange': 0.5, 'yChange': 0.5},\n\n {'sizeChange': 0.5, 'yChange': -0.7,\
    \ 'angleChange': 15}\\])\n\n***Horn***\n\nThe *Horn fractal* resembles a ram’s\
    \ horn:\n\n*Python*\n\nelif DRAW\\_FRACTAL == 8:\n\n # Horn:\n\n drawFractal(drawFilledSquare,\
    \ 100,\n\n \\[{'sizeChange': 0.96, 'yChange': 0.5, 'angleChange': 11}\\], 100)\n\
    \nThis simple fractal is made up of squares, each of which is slightly \n\nsmaller,\
    \ moved up, and rotated 11 degrees from the previous square. We \n\nincrease the\
    \ maximum recursion depth to 100 to extend the horn into a \n\ntight spiral.\n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
