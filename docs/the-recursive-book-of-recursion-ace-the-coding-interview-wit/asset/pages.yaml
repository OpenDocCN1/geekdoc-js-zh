  md: "**136**   Chapter 6\n\nThe reason the number of combinations increases, peaks\
    \ in the middle, \n\nand then decreases is that the *k*\\-combinations are mirrors\
    \ of each other. \n\nFor example, the 1-combinations are made from the elements\
    \ not selected \n\nfor the 3-combinations: \n\n• \n\nThe 1-combination A is the\
    \ mirror of the 3-combination BCD.\n\n• \n\nThe 1-combination B is the mirror\
    \ of the 3-combination ACD.\n\n• \n\nThe 1-combination C is the mirror of the\
    \ 3-combination ABD.\n\n• \n\nThe 1-combination D is the mirror of the 3-combination\
    \ ABC.\n\nWe’ll create a function called getCombos() that takes two arguments:\
    \ a \n\nchars string with the letters to get combinations from, and the size of\
    \ the \n\ncombinations k. The return value is an array of strings of combinations\
    \ \n\nfrom the string chars, each of length k.\n\nWe’ll use a head-tail technique\
    \ with the chars argument. For example, \n\nsay we call getCombos('ABC', 2) to\
    \ get all the 2-combinations from {A, B, C}. \n\nThe function will set A as the\
    \ head and BC as the tail. Figure 6-5 shows the \n\ntree for selecting 2-combinations\
    \ from {A, B, C}.\n\nB\n\nC\n\nC\n\nC\n\n0-combinations\n\n1-combinations\n\n\
    2-combinations\n\n3-combinations\n\nB\n\nA\n\nC\n\n''''\n\n*Figure 6-5: Tree showing\
    \ every possible 2-combination from the set {A, B, C}*\n\nLet’s ask our three\
    \ recursive algorithm questions:\n\n**What is the base case?   ** The first base\
    \ case is a k argument of 0, mean­\n\ning that a 0-combination is requested, which\
    \ is always an array of the \n\nblank string no matter what chars is. The second\
    \ case occurs if chars is \n\nthe blank string, which is an empty array since\
    \ no possible combina­\n\ntions can be made from a blank string.\n\n**What argument\
    \ is passed to the recursive function call?   ** For the first \n\nrecursive call,\
    \ the tail of chars and k – 1 are passed. For the second \n\nrecursive call, the\
    \ tail of chars and k are passed.\n\n**How does this argument become closer to\
    \ the base case?   ** Since the \n\nrecursive calls decrement k and remove the\
    \ heads from the chars argu­\n\nments, eventually the k argument decrements to\
    \ 0 or the chars argu­\n\nment becomes the blank string.\n\nThe Recursive Book\
    \ of Recursion (Early Access) © 2022 by Al Sweigart"
