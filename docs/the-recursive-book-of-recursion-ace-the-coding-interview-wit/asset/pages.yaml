  md: "Introduction   **xxiii**\n\nfile. This helps your “muscle memory” of the programs\
    \ and forces you to \n\nconsider each line as you type it.\n\nThe *.html* files\
    \ are technically not valid because they’re missing several \n\nnecessary HTML\
    \ tags, such as <html> and <body>, but your browser will still \n\nbe able to\
    \ display the output. These tags have been left out on purpose. The \n\nprograms\
    \ in this book are written for simplicity and readability, not to dem­\n\nonstrate\
    \ web development best practices.\n\n***Installing Python***\n\nWhile every computer\
    \ has a web browser that can view the *.html* files in \n\nthis book, you must\
    \ install Python separately if you wish to run the book’s \n\nPython code. You\
    \ can download Python for Microsoft Windows, Apple \n\nmacOS, and Ubuntu Linux\
    \ for free from *https://python.org/downloads*. Be \n\nsure to download a version\
    \ of Python 3 (such as 3.10) and not Python 2. \n\nPython 3 made a few backward-incompatible\
    \ changes to the language, and \n\nthe programs in this book may not run correctly,\
    \ if at all, on Python 2.\n\n***Running IDLE and the Python Code Examples***\n\
    \nYou can use the IDLE editor that comes with Python to write your Python \n\n\
    code or install a free editor, such as the Mu Editor from *https://codewith.mu*,\
    \ \n\nPyCharm Community Edition from *https://www.jetbrains.com/pycharm/download*,\
    \ \n\nor Microsoft Visual Studio Code from *https://code.visualstudio.com/Download*.\n\
    \nTo open IDLE on Windows, open the Start Menu in the lower-left corner \n\nof\
    \ your screen, enter **IDLE** in the search box, and select **IDLE (Python GUI)**.\n\
    \nOn macOS, open the Finder window and click **Applications**, **Python 3.9**,\
    \ \n\nand then the IDLE icon.\n\nOn Ubuntu, select **Applications**  **Accessories**\
    \ 4 **Terminal** and then \n\nenter idle3. You may also be able to click **Applications**\
    \ at the top of the \n\nscreen, select **Programming**, and then click **IDLE\
    \ 3**.\n\nIDLE has two types of windows. The interactive shell window has the\
    \ \\> \n\nprompt and is used for running Python instructions one at a time. This\
    \ is \n\nuseful when you want to experiment with bits of Python code. The file\
    \ edi­\n\ntor window is where you can enter full Python programs and save them\
    \ as \n\n*.py* files. This is how you’ll enter the source code for the Python\
    \ programs in \n\nthis book. To open a new file editor window, click **File**\
    \  **New File**. You can \n\nrun the programs by clicking **Run**  **Run Module**\
    \ or pressing F5.\n\n***Running the JavaScript Code Examples in the Browser***\n\
    \nYour computer’s web browser can run the JavaScript programs and display \n\n\
    their output, but to write JavaScript code, you’ll need a text editor. A simple\
    \ \n\nprogram like Notepad or TextMate will do, but you can also install text\
    \ edi­\n\ntors specifically for writing code, such as IDLE or Sublime Text from\
    \ *https://*\n\n*www.sublimetext.com*.\n\nAfter typing the code for your JavaScript\
    \ programs, save the files as \n\n*.html* files, not *.js* files. Open them in\
    \ a web browser to view the results. Any \n\nmodern web browser works for this\
    \ purpose.\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
