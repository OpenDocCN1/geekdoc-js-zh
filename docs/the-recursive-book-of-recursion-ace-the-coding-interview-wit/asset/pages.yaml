  md: "File Finder    **211**\n\n19\n\n\\> **st.tm\\_min**\n\n59\n\n\\> **st.tm\\\
    _sec**\n\n2\n\nNote that the tm\\_mday attribute is the day of the month, ranging\
    \ from 1 \n\nto 31. The tm\\_wday attribute is the day of the week, starting at\
    \ 0 for Monday, 1 \n\nfor Tuesday, and so on, up to 6 for Sunday.\n\nIf you need\
    \ a brief, human-readable string of the time\\_struct object, \n\npass it to the\
    \ time.asctime() function:\n\n*Python*\n\n\\> **import os**\n\n\\> **filename\
    \ = 'C:/Windows/system32/notepad.exe'**\n\n\\> **ctimestamp = os.path.getctime(filename)**\n\
    \n\\> **import time**\n\n\\> **st = time.localtime(ctimestamp)**\n\n\\> **time.asctime(st)**\n\
    \n'Wed Jul 7 19:59:02 2021'\n\nWhile the time.localtime() function returns a struct\\\
    _time object in the \n\nlocal time zone, the time.gmtime() function returns a\
    \ struct\\_time object in \n\nthe UTC or Greenwich Mean time zone. Enter the following\
    \ into the inter­\n\nactive shell:\n\n*Python*\n\n\\> **import os**\n\n\\> **filename\
    \ = 'C:/Windows/system32/notepad.exe'**\n\n\\> **ctimestamp = os.path.getctime(filename)**\n\
    \n\\> **import time**\n\n\\> **ctimestamp = os.path.getctime(filename)**\n\n\\\
    > **time.localtime(ctimestamp)**\n\ntime.struct\\_time(tm\\_year=2021, tm\\_mon=7,\
    \ tm\\_mday=7, tm\\_hour=19, \n\ntm\\_min=59, tm\\_sec=2, tm\\_wday=2, tm\\_yday=188,\
    \ tm\\_isdst=1)\n\n\\> **time.gmtime(ctimestamp)**\n\ntime.struct\\_time(tm\\\
    _year=2021, tm\\_mon=7, tm\\_mday=8, tm\\_hour=0, \n\ntm\\_min=59, tm\\_sec=2,\
    \ tm\\_wday=3, tm\\_yday=189, tm\\_isdst=0)\n\nThe interaction between these os.path\
    \ functions (which return Unix \n\nepoch timestamps) and time functions (which\
