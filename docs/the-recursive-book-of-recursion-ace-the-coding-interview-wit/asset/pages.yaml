  md: "**14**\n\n**DROS T E M A K E R**\n\nThe *Droste effect* is a recursive art\
    \ tech­\n\nnique named after a 1904 illustration on \n\na tin of Droste’s Cacao,\
    \ a Dutch brand of \n\ncocoa. Shown in Figure 14-1, the tin features \n\nan image\
    \ of a nurse holding a meal tray contain­\n\ning a tin of Droste cocoa, which\
    \ itself bears the \n\nillustration. \n\nIn this chapter we’ll create a Droste\
    \ Maker program that can gener­\n\nate similar recursive images from any photograph\
    \ or drawing you have, \n\nwhether it be a museum patron looking at an exhibit\
    \ of herself, a cat in \n\nfront of a computer monitor of a cat in front of a\
    \ computer monitor, or \n\nsomething else entirely.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_306_0.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_306_1.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_306_2.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_306_3.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_306_4.png)\n\
    \n**T H E R E C U R S I V E **\n\n**B O O K O F **\n\n**R E C U R S I O N**\n\n\
    **A C E**\n\n**T H E**\n\n**C O D I N G**\n\n**I N T E R V I E W**\n\n**W I T\
    \ H **\n\n**P Y T H O N**\n\n**A N D**\n\n**J A V A S C R I P T**\n\n**T H E R\
    \ E C U R S I V E **\n\n**B O O K O F **\n\n**R E C U R S I O N**\n\n**A C E**\n\
    \n**T H E**\n\n**C O D I N G**\n\n**I N T E R V I E W**\n\n**W I T H**\n\n**P\
    \ Y T H O N**\n\n**A N D**\n\n**J A V A S C R I P T**\n\n**THERECURSIVE**\n\n\
    **BOOKOF **\n\n**RECURSION**\n\n**ACETHECODINGINTERVIEWWITH**\n\n**PYTHONANDJAVASCRIPT**\n\
    \n![](img/4317e0d10a2a71da22fc74ce42e2668a_306_5.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_306_6.png)\n\
