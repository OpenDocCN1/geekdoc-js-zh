  md: "Backtracking and Tree Traversal Algorithms   **75**\n\nKeep in mind that tree\
    \ data structures that are especially deep will \n\ncause a stack overflow as\
    \ the algorithm traverses the deeper nodes. This \n\nhappens because each level\
    \ deeper into the tree requires yet another \n\nfunction call, and too many function\
    \ calls without returning cause stack \n\noverflows.\n\nTrees have three kinds\
    \ of tree traversal algorithms: preorder, postorder, \n\nand inorder. We’ll discuss\
    \ each of these in the next three sections.\n\n***Preorder Tree Traversal***\n\
    \n*Preorder tree traversal* algorithms access a node’s data before traversing\
    \ its \n\nchild nodes. Use a preorder traversal if your algorithm needs to access\
    \ the \n\ndata in parent nodes before the data in their child nodes. For example,\
    \ \n\npreorder traversals are used when you are creating a copy of the tree data\
    \ \n\nstructure, as you need to create the parent nodes before child nodes in\
    \ the \n\nduplicate tree.\n\nThe following *preorderTraversal.py* program has\
    \ a preorderTraverse() func­\n\ntion that traverses each child node first, before\
    \ accessing the node’s data to \n\nprint it to the screen:\n\n*Python*\n\nroot\
    \ = {'data': 'A', 'children': \\[{'data': 'B', 'children': \n\n\\[{'data': 'D',\
    \ 'children': \\[\\]}\\]}, {'data': 'C', 'children': \n\n\\[{'data': 'E', 'children':\
    \ \\[{'data': 'G', 'children': \\[\\]}, \n\n{'data': 'H', 'children': \\[\\]}\\\
    ]}, {'data': 'F', 'children': \\[\\]}\\]}\\]}\n\ndef preorderTraverse(node):\n\
    \n print(node\\['data'\\], end=' ') # Access this node's data.\n\n 1 if len(node\\\
    ['children'\\]) > 0:\n\n # RECURSIVE CASE\n\n for child in node\\['children'\\\
    ]:\n\n preorderTraverse(child) # Traverse child nodes.\n\n # BASE CASE\n\n 2 return\n\
    \npreorderTraverse(root)\n\nThe equivalent JavaScript program is in *preorderTraversal.html*:\n\
    \n*JavaScript*\n\n<script type=\"text/javascript\">\n\nroot = {\"data\": \"A\"\
    , \"children\": \\[{\"data\": \"B\", \"children\": \n\n\\[{\"data\": \"D\", \"\
    children\": \\[\\]}\\]}, {\"data\": \"C\", \"children\": \n\n\\[{\"data\": \"\
    E\", \"children\": \\[{\"data\": \"G\", \"children\": \\[\\]}, \n\n{\"data\":\
    \ \"H\", \"children\": \\[\\]}\\]}, {\"data\": \"F\", \"children\": \\[\\]}\\\
    ]}\\]};\n\nfunction preorderTraverse(node) {\n\n document.write(node\\[\"data\"\
    \\] + \" \"); // Access this node's data.\n\n 1 if (node\\[\"children\"\\].length\
    \ > 0) {\n\n // RECURSIVE CASE\n\n for (let i = 0; i < node\\[\"children\"\\].length;\
    \ i++) {\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
