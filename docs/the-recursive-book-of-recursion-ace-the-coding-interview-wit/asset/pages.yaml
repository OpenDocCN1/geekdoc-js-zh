  md: "**208**   Chapter 10\n\nThe walk() function has two parameters: folder is a\
    \ string of the base \n\nfolder to search (we can pass '.' to refer to the current\
    \ folder the Python \n\nprogram is run from), and matchFunc is a Python function\
    \ that is passed \n\na filename and returns True if the function says it is a\
    \ search match. \n\nOtherwise, the function returns False.\n\nThe next part of\
    \ the function examines the contents of folder:\n\n*Python*\n\n # Loop over every\
    \ file and subfolder in the folder:\n\n for name in os.listdir(folder):\n\n filepath\
    \ = os.path.join(folder, name)\n\n if os.path.isfile(filepath):\n\nThe for loop\
    \ calls os.listdir() to return a list of the contents of the \n\nfolder folder.\
    \ This list includes all files and subfolders. For each file, we cre­\n\nate the\
    \ full, absolute path by joining the folder with the name of the file or \n\n\
    folder. If the name refers to a file, the os.path.isfile() function call returns\
    \ \n\nTrue, and we’ll check to see if the file is a search match:\n\n*Python*\n\
    \n # Call the match function for each file:\n\n if matchFunc(filepath):\n\n matchedFiles.append(filepath)\n\
    \nWe call the match function, passing it the full absolute file path of the \n\
    \nfor loop’s current file. Note that matchFunc is the name of one of walk()’s\
    \ \n\nparameters. If hasEvenByteSize(), hasEveryVowel(), or another function is\
    \ \n\npassed as the argument for the matchFunc parameter, then that is the func­\n\
    \ntion walk() calls. If filepath contains a file that is a match according to\
    \ the \n\nmatching algorithm, it’s added to the matches list:\n\n*Python*\n\n\
    \ elif os.path.isdir(filepath):\n\n # Recursively call walk for each subfolder,\
    \ extending\n\n # the matchedFiles with their matches:\n\n matchedFiles.extend(walk(filepath,\
    \ matchFunc))\n\nOtherwise, if the for loop’s file is a subfolder, the os.path.isdir()\
    \ func­\n\ntion call returns True. We then pass the subfolder to a recursive function\
    \ \n\ncall. The recursive call returns a list of all matching files in the subfolder\
    \ \n\n(and its subfolders), which are then added to the matches list:\n\n return\
    \ matchedFiles\n\nAfter the for loop finishes, the matches list contains all of\
    \ the matching \n\nfiles in this folder (and all of its subfolders). This list\
    \ becomes the return \n\nvalue for the walk() function.\n\n**Calling the walk()\
    \ Function**\n\nNow that we’ve implemented the walk() function and some match\
    \ functions, \n\nwe can run our custom file search. We pass the '.' string, a\
    \ special directory \n\nThe Recursive Book of Recursion (Early Access) © 2022\
    \ by Al Sweigart"
