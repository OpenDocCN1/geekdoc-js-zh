  md: "Fractal Art Maker   **267**\n\nturtle.penup() to avoid drawing a line as it\
    \ moves to the starting position. \n\nTo find the starting position relative to\
    \ the middle of the square, the turtle \n\nmust first move half of the square’s\
    \ length (that is, size // 2) forward, to the \n\nfuture right edge of the square.\
    \ Next the turtle turns 90 degrees to face up \n\nand then moves size // 2 units\
    \ forward to the top-right corner. The turtle \n\nis now facing the wrong way,\
    \ so it turns around 180 degrees and places the \n\npen down so it can begin drawing.\n\
    \nNote that *top-right* and *up* are relative to the direction the turtle is origi­\n\
    \nnally facing. This code works just as well if the turtle began facing to the\
    \ \n\nright at 0 degrees or has a heading of 90, 42, or any other number of degrees.\
    \ \n\nWhen you create your own shape-drawing functions, stick to the relative\
    \ tur­\n\ntle movement functions like turtle.forward(), turtle.left(), and turtle.right()\
    \ \n\ninstead of absolute turtle movement functions like turtle.goto().\n\nNext,\
    \ the depth argument tells the function whether it should draw a \n\nwhite square\
    \ or a gray one:\n\n*Python*\n\n # Alternate between white and gray (with black\
    \ border):\n\n if depth % 2 == 0:\n\n turtle.pencolor('black')\n\n turtle.fillcolor('white')\n\
    \n else:\n\n turtle.pencolor('black')\n\n turtle.fillcolor('gray')\n\nIf depth\
    \ is even, the depth % 2 == 0 condition is True, and the square’s *fill *\n\n\
    *color* is white. Otherwise, the code sets the fill color to gray. Either way,\
    \ the \n\nborder of the square, determined by the *pen color*, is set to black.\
    \ To change \n\neither of these colors, use strings of common color names, like\
    \ red or yellow, \n\nor an HTML color code comprising a hash tag and six hexadecimal\
    \ digits, \n\nlike #24FF24 for lime green or #ad7100 for brown. \n\nThe website\
    \ *https://html-color.codes* has charts for many HTML color codes. \n\nThe fractals\
    \ in this black-and-white book lack color, but your computer can \n\nrender your\
    \ own fractals in a bright range of colors!\n\nWith the colors set, we can finally\
    \ draw the four lines of the actual \n\nsquare:\n\n*Python*\n\n # Draw a square:\n\
    \n turtle.begin\\_fill()\n\n for i in range(4): # Draw four lines.\n\n turtle.forward(size)\n\
    \n turtle.right(90)\n\n turtle.end\\_fill()\n\nTo tell the turtle module that\
    \ we intend to draw a filled-in shape and \n\nnot just the outline, we call the\
    \ turtle.begin\\_fill() function. Next is a for \n\nloop that draws a line of\
    \ length size and turns the turtle 90 degrees to \n\nthe right. The for loop repeats\
    \ this four times to create the square. When \n\nthe function finally calls turtle.end\\\
    _fill(), the filled-in square appears on \n\nthe screen. \n\nThe Recursive Book\
    \ of Recursion (Early Access) © 2022 by Al Sweigart"
