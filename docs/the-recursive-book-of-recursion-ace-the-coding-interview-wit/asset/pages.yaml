  md: "**46**   Chapter 3\n\nhow do the arguments passed to the recursive function\
    \ calls become closer \n\nto the base case? As you gain more experience, answering\
    \ these questions \n\nshould come more naturally.\n\n**Summing Numbers in an Array**\n\
    \nOur first example is simple: given a list (in Python) or an array (in \n\nJavaScript)\
    \ of integers, return the total sum of all the integers. For example, \n\na call\
    \ such as sum(\\[5, 2, 4, 8\\]) should return 19.\n\nThis is easy to solve with\
    \ a loop, but solving it with recursion requires \n\nmore thought. After reading\
    \ Chapter 2, you might also notice that this \n\nalgorithm doesn’t map well enough\
    \ to recursion’s capabilities to justify \n\nrecursion’s added complexity. Still,\
    \ summing numbers in an array (or some \n\nother calculation based on processing\
    \ data in a linear data structure) is a \n\ncommon enough recursion problem in\
    \ coding interviews that it deserves \n\nour attention. \n\nTo solve this problem,\
    \ let’s examine the *head-tail technique* for imple­\n\nmenting recursive functions.\
    \ This technique splits the recursive function’s \n\narray argument into two parts:\
    \ the *head* (the first element of the array) and \n\nthe *tail* (a new array\
    \ including everything after the first element). We define \n\nthe recursive sum()\
    \ function to find the sum of the array argument’s inte­\n\ngers by adding the\
    \ head to the sum of the tail array. To find out the sum of \n\nthe tail array,\
    \ we recursively pass it as the array argument to sum().\n\nBecause the tail array\
    \ is one element smaller than the original array \n\nargument, we’ll eventually\
    \ end up calling the recursive function and pass­\n\ning it an empty array. An\
    \ empty array argument is trivial to sum and doesn’t \n\nrequire more recursive\
    \ calls; it is merely 0. From these facts, our answers to \n\nthe three questions\
    \ are as follows:\n\n**What is the base case?   ** An empty array, which has the\
    \ sum of 0.\n\n**What argument is passed to the recursive function call?   **\
    \ The tail of \n\nthe original number array, which has one less number than the\
    \ original \n\narray argument.\n\n**How does this argument become closer to the\
    \ base case?   ** The \n\narray argument shrinks by one element for each recursive\
    \ call until it \n\nbecomes a zero-length, or empty, array.\n\nHere is *sumHeadTail.py*,\
    \ a Python program to sum a list of numbers:\n\n*Python*\n\ndef sum(numbers):\n\
    \n if len(numbers) == 0: # BASE CASE\n\n 1 return 0\n\n else: # RECURSIVE CASE\n\
    \n 2 head = numbers\\[0\\]\n\n 3 tail = numbers\\[1:\\]\n\n 4 return head + sum(tail)\n\
    \nnums = \\[1, 2, 3, 4, 5\\]\n\nprint('The sum of', nums, 'is', sum(nums))\n\n\
    nums = \\[5, 2, 4, 8\\]\n\nThe Recursive Book of Recursion (Early Access) © 2022\
    \ by Al Sweigart"
