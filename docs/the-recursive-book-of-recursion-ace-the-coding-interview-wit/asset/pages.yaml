    \n.......####...#######................\n\nIf you want to see every step of the\
    \ flood fill algorithm as it fills in the \n\nnew character, uncomment the printImage(image)\
    \ line 1 in the floodFill() \n\nfunction and run the program again.\n\nThe image\
    \ is represented by a two-dimensional array of string charac­\n\nters. We can\
    \ pass this image data structure, an x and y coordinate, and a new \n\ncharacter\
    \ to the floodFill() function. The function notes the character cur­\n\nrently\
    \ at the x and y coordinates and saves it to the oldChar variable 2.\n\nIf the\
    \ current characters at coordinates x and y in image are not the \n\nsame as oldChar,\
    \ this is our base case, and the function simply returns. \n\nOtherwise, the function\
    \ continues on to its four recursive cases: passing the \n\nx- and y-coordinates\
    \ of the bottom 3, top 4, right 5, and left 6 neighbors \n\nof the current coordinates.\
    \ After these four potential recursive calls are \n\nmade, the end of the function\
    \ is an implicit base case, made explicit in our \n\nprogram with a return statement 7.\n\
    \nThe flood fill algorithm doesn’t have to be recursive. For large images, \n\n\
    a recursive function could cause stack overflows. If we were to implement \n\n\
    flood fill with a loop and a stack instead, the stack would begin with the x-\
    \ \n\nand y-coordinates of the starting pixel. The code in the loop would pop\
    \ the \n\ncoordinates off the top of the stack, and if that coordinate’s pixel\
    \ matches \n\noldChar, it would push the coordinates of the four neighboring pixels.\
    \ When \n\nthe stack is empty because the base case is no longer pushing neighbors\
    \ to \n\nthe stack, the loop is finished.\n\nHowever, the flood fill algorithm\
    \ doesn’t necessarily have to use a \n\nstack. The pushing and popping of a first-in,\
    \ last-out stack is effective for \n\nbacktracking behavior, but the order that\
    \ the pixels are processed in the \n\nflood fill algorithm can be arbitrary. This\
    \ means we could equally effec­\n\ntively use a set data structure that removes\
    \ elements randomly. You can \n\nThe Recursive Book of Recursion (Early Access)\
