  md: "Classic Recursion Algorithms   **55**\n\nTo solve the puzzle, the player must\
    \ move the stack of disks from one \n\npole to another while following three rules:\n\
    \n• \n\nThe player can move only one disk at a time.\n\n• \n\nThe player can move\
    \ disks only to and from the top of a tower.\n\n• \n\nThe player can never place\
    \ a larger disk on top of a smaller disk.\n\nPython’s built-in turtledemo module\
    \ has a Tower of Hanoi demonstra­\n\ntion that you can see by running python -m\
    \ turtledemo on Windows or python3 \n\n\\-m turtledemo on macOS/Linux, and then\
    \ selecting **minimum\\_hanoi** from \n\nthe **Examples** menu. Tower of Hanoi\
    \ animations are readily found through \n\nan internet search as well.\n\nThe\
    \ recursive algorithm for solving the Tower of Hanoi puzzle is not \n\nintuitive.\
    \ Let’s start with the smallest case: a Tower of Hanoi with one disk. \n\nThe\
    \ solution is trivial: move the disk to another pole and you’re finished. \n\n\
    Solving for two disks is slightly more complicated: move the smaller disk \n\n\
    to one pole (we’ll call it the *temporary pole*) and the larger disk to the other\
    \ \n\npole (we’ll call it the *end pole*), and then finally move the smaller disk\
    \ from \n\nthe temporary pole to the end pole. Both disks are now on the end pole\
    \ in \n\nthe correct order. \n\nOnce you solve the three-disk tower, you’ll notice\
    \ that a pattern \n\nemerges. To solve a tower of *n* disks from the start pole\
    \ to the end pole, you \n\nmust do the following:\n\n 1. Solve the *n *– 1 disks\
    \ puzzle by moving those disks from the start pole to \n\nthe temporary pole.\n\
    \n 2. Move the *n*th disk from the start pole to the end pole.\n\n 3. Solve the\
    \ *n *– 1 disks puzzle by moving those disks from the temporary \n\npole to the\
    \ end pole.\n\nLike the Fibonacci algorithm, the recursive case for the Tower\
    \ of Hanoi \n\nalgorithm makes two recursive calls instead of just one. If we\
    \ draw a tree \n\ndiagram of the operations for solving a four-disk Tower of Hanoi,\
    \ it looks \n\nlike Figure 3-6. Solving the four-disk puzzle requires the same\
    \ steps as solv­\n\ning the three-disk puzzle, as well as moving the fourth disk\
    \ and performing \n\nthe steps of solving the three-disk puzzle again. Likewise,\
    \ solving the three-\n\ndisk puzzle requires the same steps as the two-disk puzzle\
    \ plus moving the \n\nthird disk, and so on. Solving the one-disk puzzle is the\
    \ trivial base case: it \n\ninvolves only moving the disk. \n\nThe tree-like structure\
    \ in Figure 3-5 hints that a recursive approach \n\nis ideal for solving the Tower\
    \ of Hanoi puzzle. In this tree, the execution \n\nmoves from top to bottom and\
    \ from left to right.\n\nWhile a three-disk or four-disk Tower of Hanoi is easy\
    \ for a human \n\nto solve, increasing numbers of disks require an exponentially\
    \ increasing \n\nnumber of operations to complete. For *n* disks, it takes a minimum\
    \ of 2*n *– 1 \n\nmoves to solve. This means a 31-disk tower requires over a billion\
    \ moves to \n\ncomplete!\n\nThe Recursive Book of Recursion (Early Access) © 2022\
    \ by Al Sweigart"
