    \ accepts two arguments: a board data structure \n\nand an UP, DOWN, LEFT, or\
    \ RIGHT direction to slide a tile on that board. This \n\ncode is fairly repetitive,\
    \ so the short variable names bx and by are used to \n\nrepresent the x- and y-coordinates\
    \ of the blank space.\n\nTo make a move, the board data structure swaps the value\
    \ of the moved \n\ntile with the 0 of the blank tile. The Python code for the\
    \ makeMove() function \n\nis as follows:\n\n*Python*\n\ndef makeMove(board, move):\n\
    \n \"\"\"Modify \\`board\\` in place to carry out the slide in \\`move\\`.\"\"\
    \"\n\n bx, by = findBlankSpace(board)\n\n blankIndex = by \\* SIZE + bx\n\n if\
    \ move == UP:\n\n tileIndex = (by + 1) \\* SIZE + bx\n\n elif move == LEFT:\n\n\
    \ tileIndex = by \\* SIZE + (bx + 1)\n\n elif move == DOWN:\n\n tileIndex = (by\
    \ - 1) \\* SIZE + bx\n\n elif move == RIGHT:\n\n tileIndex = by \\* SIZE + (bx\
    \ - 1)\n\n # Swap the tiles at blankIndex and tileIndex:\n\n board\\[blankIndex\\\
    ], board\\[tileIndex\\] = board\\[tileIndex\\], board\\[blankIndex\\]\n\nThe JavaScript\
    \ code for the makeMove() function is as follows:\n\nfunction makeMove(board,\
