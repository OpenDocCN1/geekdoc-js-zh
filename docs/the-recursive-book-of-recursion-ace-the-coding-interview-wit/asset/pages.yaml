    729\n\n1000\n\n2015993900449\n\nThis is a straightforward calculation that we\
    \ can easily write with a \n\nloop. The downside to using a loop is that the function\
    \ slows as the expo­\n\nnents get larger: calculating 3^(12) takes twice as long\
    \ as 3⁶, and 3^(600) takes one \n\nhundred times as long as 3⁶. In the next section,\
    \ we address this by thinking \n\nrecursively.\n\n***Creating a Recursive Exponents\
    \ Function***\n\nLet’s think of what a recursive solution for the exponentiation\
    \ of, say, 3⁶ \n\nwould be. Because of the associative property of multiplication,\
    \ 3 × 3 × \n\n3 × 3 × 3 × 3 is the same as (3 × 3 × 3) × (3 × 3 × 3), which is\
    \ the same as \n\n(3 × 3 × 3)². And since (3 × 3 × 3) is the same as 3³, we can\
    \ determine that 3⁶ \n\nis the same as (3³)². This is an example of what mathematics\
    \ calls the *power *\n\n*rule*: (*a*^(*m*))^(*n*) = *a*^(*mn*). Mathematics also\
    \ gives us the *product rule*: *a*^n × *a*^m = *a*^(*n*)^( + m), \n\nincluding\
    \ *a*^(*n*) × *a* = *a*^(*n*)^( + 1).\n\nWe can use these mathematical rules to\
    \ make an exponentByRecursion() \n\nfunction. If exponentByRecursion(3, 6) is\
    \ called, it’s the same as exponentByRe­\n\ncursion(3, 3) \\* exponentByRecursion(3,\
    \ 3). Of course, we don’t actually have \n\nto make both exponentByRecursion(3,\
    \ 3) calls: we could just save the return \n\nvalue to a variable and multiply\
    \ it by itself.\n\nThat works for even-numbered exponents, but what about odd-num­\n\
    \nbered exponents? If we had to calculate 3⁷, or 3 × 3 × 3 × 3 × 3 × 3 × 3, this\
    \ \n\nis the same as (3 × 3 × 3 × 3 × 3 × 3) × 3, or (3⁶) × 3. Then we can make\
    \ the \n\nsame recursive call to calculate 3⁶. \n\n**N O T E**\n\n*A simple programming\
    \ trick for determining whether an integer is odd or even uses *\n\n*the modulus\
    \ operator (**%**). Any even integer mod 2 results in 0, and any odd integer *\n\
    \n*mod 2 results in 1.*\n\nThose are the recursive cases, but what are the base\
    \ cases? Mathemati­\n\ncally speaking, any number to the zeroth power is defined\
    \ as 1, while any \n\nnumber to the first power is the number itself. So for any\
    \ function call \n\nexponentByRecursion(a, n), if n is 0 or 1, we can simply return\
    \ 1 or a, respec­\n\ntively, because a⁰ is always 1 and a¹ is always a.\n\nThe\
    \ Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
