  md: "**114**   Chapter 5\n\nexample, if x and y are 5678 and 1234, respectively,\
    \ then a is 56, b is 78, c is 12, \n\nand d is 34.\n\nx=5678\n\na=56\n\nb=78\n\
    \ny=1234\n\nc=12\n\nd=34\n\n*Figure 5-6: The integers to multiply, **x** and **y**,\
    \ *\n\n*are divided into halves **a**, **b**, **c**, and **d**.*\n\nHere are the\
    \ five steps of the Karatsuba algorithm:\n\n 1. Multiply a and c either from the\
    \ cached multiplication table or a recur­\n\nsive call to karatsuba().\n\n 2.\
    \ Multiply b and d either from the cached multiplication table or a recur­\n\n\
    sive call to karatsuba().\n\n 3. Multiply a + c and b + d either from the cached\
    \ multiplication table or a \n\nrecursive call to karatsuba().\n\n 4. Calculate\
    \ (step 3) – (step 2) – (step 1).\n\n 5. Pad the (step 1) and (step 4) results\
    \ with zeros; then add them to (step 2).\n\nThe result of step 5 is the product\
    \ of x and y. The specifics of how to \n\npad the step 1 and step 4 results with\
    \ zeros is explained later in this section.\n\nLet’s ask our three recursive algorithm\
    \ questions about the karatsuba() \n\nfunction:\n\n**What is the base case?   **\
    \ Multiplying single-digit numbers, which can \n\nbe done with a precomputed lookup\
    \ table.\n\n**What argument is passed to the recursive function call?   ** The\
    \ a, b, c, \n\nand d values derived from the x and y arguments.\n\n**How does\
    \ this argument become closer to the base case?   ** Since a, b, c, \n\nand d\
    \ are each half of the digits of x and y and themselves used for the \n\nnext\
    \ recursive call’s x and y arguments, the recursive call’s arguments \n\nbecome\
    \ closer and closer to the single-digit numbers the base case \n\nrequires.\n\n\
    Our Python implementation for Karatsuba multiplication is in the \n\n­*karatsubaMultiplication.py*\
    \ program:\n\nimport math\n\n\\# Create a cache of all single-digit multiplication\
    \ products:\n\nMULT\\_TABLE = {} 1\n\nfor i in range(10):\n\n for j in range(10):\n\
    \n MULT\\_TABLE\\[(i, j)\\] = i \\* j\n\ndef padZeros(numberString, numZeros,\
    \ insertSide):\n\n \"\"\"Return a string padded with zeros on the left or right\
    \ side.\"\"\"\n\n if insertSide == 'left':\n\nThe Recursive Book of Recursion\
