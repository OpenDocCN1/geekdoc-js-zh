  md: "**11**\n\n**M A Z E G E N E R ATOR **\n\nChapter 4 described a recursive algorithm\
    \ \n\nthat solves mazes, but another recursive \n\nalgorithm generates mazes.\
    \ In this chapter, \n\nwe’ll generate mazes in the same format as the \n\nmaze-solver\
    \ program in Chapter 4. So, whether you’re \n\na fan of solving mazes or creating\
    \ them, you’ll now \n\nhave the power to apply programming to the task.\n\nThe\
    \ algorithm works by visiting a starting space in the maze and then \n\nrecursively\
    \ visiting a neighboring space. The maze’s hallways are “carved \n\nout” of the\
    \ maze as the algorithm continues to visit neighbors. If the algo­\n\nrithm reaches\
    \ a dead end that has no neighboring spaces, it backtracks to \n\nearlier spaces\
    \ until it finds an unvisited neighbor and continues visiting \n\nfrom there.\
    \ By the time the algorithm backtracks to the starting space, the \n\nentire maze\
    \ has been generated.\n\nThe recursive backtracking algorithm we’ll use here produces\
    \ mazes \n\nthat tend to have long hallways (the maze spaces that connect branching\
    \ \n\nintersections) and are fairly simple to solve. However, this algorithm is\
    \ \n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_240_0.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_240_1.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_240_2.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_240_3.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_240_4.png)\n\
