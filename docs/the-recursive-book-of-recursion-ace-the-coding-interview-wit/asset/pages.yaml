  md: "**262**   Chapter 13\n\nturtle.tracer(5000, 0) # Increase the first argument\
    \ to speed up the drawing.\n\nturtle.hideturtle()\n\ndef drawFilledSquare(size,\
    \ depth):\n\n size = int(size)\n\n # Move to the top-right corner before drawing:\n\
    \n turtle.penup()\n\n turtle.forward(size // 2)\n\n turtle.left(90)\n\n turtle.forward(size\
    \ // 2)\n\n turtle.left(180)\n\n turtle.pendown()\n\n # Alternate between white\
    \ and gray (with black border):\n\n if depth % 2 == 0:\n\n turtle.pencolor('black')\n\
    \n turtle.fillcolor('white')\n\n else:\n\n turtle.pencolor('black')\n\n turtle.fillcolor('gray')\n\
    \n # Draw a square:\n\n turtle.begin\\_fill()\n\n for i in range(4): # Draw four\
    \ lines.\n\n turtle.forward(size)\n\n turtle.right(90)\n\n turtle.end\\_fill()\n\
    \ndef drawTriangleOutline(size, depth):\n\n size = int(size)\n\n # Move the turtle\
    \ to the top of the equilateral triangle:\n\n height = size \\* math.sqrt(3) /\
    \ 2\n\n turtle.penup()\n\n turtle.left(90) # Turn to face upwards.\n\n turtle.forward(height\
    \ \\* (2/3)) # Move to the top corner.\n\n turtle.right(150) # Turn to face the\
    \ bottom-right corner.\n\n turtle.pendown()\n\n # Draw the three sides of the\
    \ triangle:\n\n for i in range(3):\n\n turtle.forward(size)\n\n turtle.right(120)\n\
    \ndef drawFractal(shapeDrawFunction, size, specs, maxDepth=8, depth=0):\n\n if\
    \ depth > maxDepth or size < 1:\n\n return # BASE CASE\n\n # Save the position\
    \ and heading at the start of this function call:\n\n initialX = turtle.xcor()\n\
    \n initialY = turtle.ycor()\n\n initialHeading = turtle.heading()\n\nThe Recursive\
    \ Book of Recursion (Early Access) © 2022 by Al Sweigart"
