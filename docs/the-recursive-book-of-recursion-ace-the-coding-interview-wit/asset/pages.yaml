  md: "Drawing Fractals   **177**\n\nThe window in a turtle graphics system uses Cartesian\
    \ x- and y-coor­\n\ndinates. The number for the horizontal x-coordinate increases\
    \ going right \n\nand decreases going left, while the number for the vertical\
    \ y-coordinate \n\nincreases going up and decreases going down. These two coordinates\
    \ \n\ntogether can provide a unique address for any point in the window. By \n\
    \ndefault, the *origin* (the x, y coordinate point at 0, 0) is in the center of\
    \ the \n\nwindow. \n\nThe turtle also has a *heading*, or direction, that is a\
    \ number from 0 to \n\n359 (a circle is split into 360 degrees). In Python’s turtle\
    \ module, a heading \n\nof 0 faces east (toward the right edge of the screen)\
    \ and increases clockwise; \n\na heading of 90 faces north, a heading of 180 faces\
    \ west, and a heading of \n\n270 faces south. In the JavaScript jtg library, this\
    \ orientation is rotated so \n\nthat 0 degrees faces north and increases counterclockwise.\
    \ Figure 9-2 dem­\n\nonstrates the headings for the Python turtle module and the\
    \ JavaScript jtg \n\nlibrary.\n\n90\n\n180\n\n0\n\n225\n\n315\n\n135\n\n45\n\n\
    270\n\nPython turtle\n\nmodule headings\n\n0\n\n270\n\n90\n\n225\n\n135\n\n315\n\
    \n45\n\n180\n\nJavaScript jtg\n\nlibrary headings\n\n*Figure 9-2: The headings\
    \ in Python’s **turtle** module and *\n\n*the JavaScript **jtg** library*\n\n\
    In the JavaScript jtg library at *https://inventwithpython.com/jtg*, enter the\
    \ \n\nfollowing code into the text field at the bottom of the page:\n\n*JavaScript*\n\
    \nfor (let i = 0; i < 360; i++) { t.fd(i); t.lt(59) }\n\nThis draws the same spiral\
    \ in Figure 9-1 on the main area of the web \n\npage.\n\n**Basic Turtle Functions**\n\
    \nThe most commonly used functions in turtle graphics cause the turtle to \n\n\
    change heading and move forward or backward. The turtle.left() and \n\n­turtle.right()\
    \ functions rotate the turtle a certain number of degrees start­\n\ning from its\
    \ current heading, while the turtle.forward() and turtle.backward() \n\nfunctions\
    \ move the turtle based on its current position.\n\nTable 9-1 lists some of the\
    \ turtle’s functions. The first function (begin­\n\nning with turtle.) is for\
    \ Python, and the second (beginning with t.) is for \n\nJavaScript. The full Python\
    \ documentation is available at *https://docs.python *\n\n*.org/3/library/turtle.html*.\
    \ In the JavaScript jtg software, you can press F1 to \n\ndisplay the help screen.\n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
