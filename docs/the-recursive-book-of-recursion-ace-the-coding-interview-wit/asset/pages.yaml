  md: "**xxii**   Introduction\n\n**Part 2: Projects**\n\n**Chapter 10: File Finder \
    \  ** Covers a project that searches through the files \n\non your computer according\
    \ to custom search parameters you provide.\n\n**Chapter 11: Maze Generator   **\
    \ Covers a project that automatically gen­\n\nerates mazes of any size using the\
    \ recursive backtracker algorithm.\n\n**Chapter 12: Sliding-Tile Solver   ** Covers\
    \ a project that solves sliding-tile \n\npuzzles, also called 15-puzzles.\n\n\
