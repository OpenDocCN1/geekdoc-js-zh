  md: "File Finder    **205**\n\nprint('All files with even byte sizes:')\n\nprint(walk('.',\
    \ hasEvenByteSize))\n\nprint('All files with every vowel in their name:')\n\n\
    print(walk('.', hasEveryVowel))\n\nThe file-search program’s main function is\
    \ walk(), which “walks” across \n\nthe entire span of files in a base folder and\
    \ its subfolders. It calls one of \n\ntwo other functions that implement the custom\
    \ search criteria it’s looking \n\nfor. In the context of this program, we’ll\
    \ call these *match functions*. A match \n\nfunction call returns True if the\
    \ file matches the search criteria; otherwise, it \n\nreturns False. \n\nThe job\
    \ of the walk() function is to call the match function once for \n\neach file\
    \ in the folders it walks across. Let’s take a look at the code in \n\nmore detail.\n\
    \n**The Match Functions**\n\nIn Python, you can pass functions themselves as arguments\
    \ to a function \n\ncall. In the following example, a callTwice() function calls\
    \ its function argu­\n\nment twice, whether it’s sayHello() or sayGoodbye():\n\
    \n*Python*\n\n\\> **def callTwice(func):**\n\n... **func()**\n\n... **func()**\n\
    \n...\n\n\\> **def sayHello():**\n\n... **print('Hello!')**\n\n...\n\n\\> **def\
    \ sayGoodbye():**\n\n... **print('Goodbye!')**\n\n...\n\n\\> **callTwice(sayHello)**\n\
    \nHello!\n\nHello!\n\n\\> **callTwice(sayGoodbye)**\n\nGoodbye!\n\nGoodbye!\n\n\
    The callTwice() function calls whichever function was passed to it as \n\nthe func\
    \ parameter. Notice that we leave out the parentheses from the func­\n\ntion argument,\
    \ writing callTwice(sayHello) instead of callTwice(sayHello()). \n\nThis is because\
    \ we are passing the sayHello() function itself, and not calling \n\nsayHello()\
    \ and passing its return value.\n\nThe walk() function accepts a match function\
    \ argument for its search \n\ncriteria. This lets us customize the behavior of\
    \ the file search without modi­\n\nfying the code of the walk() function itself.\
    \ We’ll take a look at walk() later. \n\nFirst, let’s look at the two sample match\
    \ functions in the program. \n\nThe Recursive Book of Recursion (Early Access)\
    \ © 2022 by Al Sweigart"
