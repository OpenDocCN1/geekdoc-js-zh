  md: "**24**   Chapter 2\n\n // RECURSIVE CASE\n\n 1 return number \\* factorial(number\
    \ - 1);\n\n }\n\n}\n\ndocument.write(factorial(5));\n\n</script>\n\nWhen you run\
    \ this code to calculate 5! recursively, the output matches \n\nthe iterative\
    \ program’s output:\n\n120\n\nTo many programmers, this recursive code looks strange.\
    \ You know \n\nthat factorial(5) must compute 5 × 4 × 3 × 2 × 1, but it’s hard\
    \ to point to the \n\nline of code where this multiplication is taking place.\n\
    \nThe confusion arises because the recursive case has one line 1, half \n\nof\
    \ which is executed before the recursive call and half of which takes place \n\
    \nafter the recursive call returns. We aren’t used to the idea of only half of\
    \ a \n\nline of code executing at a time. \n\nThe first half is factorial(number\
    \ - 1). This involves calculating number – \n\n1 and making a recursive function,\
    \ causing a new frame object to be pushed \n\nto the call stack. All this happens\
    \ before the recursive call is made.\n\nThe next time the code runs with the old\
    \ frame object is after \n\nfactorial(number – 1) has returned. When factorial(5)\
    \ is called, \n\nfactorial(number – 1) will be factorial(4), which returns 24.\
    \ This is when the \n\nsecond half of the line runs. The return number \\* factorial(number\
    \ - 1) now \n\nlooks like return 5 \\* 24, which is why factorial(5) returns 120.\n\
    \nFigure 2-1 tracks the state of the call stack as frame objects are pushed \n\
    \n(which happens as recursive function calls are made) and frame objects are \n\
    \npopped (as recursive function calls return). Notice that the multiplication\
    \ \n\nhappens after the recursive calls are made, not before. And technically,\
    \ the \n\ncalculation performed by our factorial() function isn’t 5 × 4 × 3 ×\
    \ 2 × 1 and \n\n1 × 2 × 3 × 4 × 5.\n\nWhen the original function call to factorial()\
    \ returns, it returns the \n\ncalculated factorial.\n\n***Why the Recursive Factorial\
    \ Algorithm Is Terrible***\n\nThe recursive implementation for calculating factorials\
    \ has a critical weak­\n\nness. Calculating the factorial of 5 requires five recursive\
    \ function calls. \n\nThis means five frame objects are placed on the call stack\
    \ before the base \n\ncase is reached. This doesn’t scale. \n\nIf you want to\
    \ calculate the factorial of 1,001, the recursive factorial() \n\nfunction must\
    \ make 1,001 recursive function calls. However, your program \n\nis likely to\
    \ cause a stack overflow before it can finish, because making so \n\nmany function\
    \ calls without returning would exceed the maximum call \n\nstack size of the\
    \ interpreter. This is terrible; you would never want to use a \n\nrecursive factorial\
    \ function in real-world code. \n\nThe Recursive Book of Recursion (Early Access)\
    \ © 2022 by Al Sweigart"
