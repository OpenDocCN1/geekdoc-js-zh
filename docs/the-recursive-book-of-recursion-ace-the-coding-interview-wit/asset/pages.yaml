  md: "Classic Recursion Algorithms   **47**\n\nprint('The sum of', nums, 'is', sum(nums))\n\
    \nnums = \\[1, 10, 100, 1000\\]\n\nprint('The sum of', nums, 'is', sum(nums))\n\
    \nAnd here is the equivalent JavaScript program, *sumHeadTail.html*:\n\n*JavaScript*\n\
    \n<script type=\"text/javascript\">\n\nfunction sum(numbers) {\n\n if (numbers.length\
    \ === 0) { // BASE CASE\n\n 1 return 0;\n\n } else { // RECURSIVE CASE\n\n 2 let\
    \ head = numbers\\[0\\];\n\n 3 let tail = numbers.slice(1, numbers.length);\n\n\
    \ 4 return head + sum(tail);\n\n }\n\n}\n\nlet nums = \\[1, 2, 3, 4, 5\\];\n\n\
    document.write('The sum of ' + nums + ' is ' + sum(nums) + \"<br />\");\n\nnums\
    \ = \\[5, 2, 4, 8\\];\n\ndocument.write('The sum of ' + nums + ' is ' + sum(nums)\
    \ + \"<br />\");\n\nnums = \\[1, 10, 100, 1000\\];\n\ndocument.write('The sum\
    \ of ' + nums + ' is ' + sum(nums) + \"<br />\");\n\n</script>\n\nThe output of\
    \ these programs is shown here:\n\nThe sum of \\[1, 2, 3, 4, 5\\] is 15\n\nThe\
    \ sum of \\[5, 2, 4, 8\\] is 19\n\nThe sum of \\[1, 10, 100, 1000\\] is 1111\n\
    \nWhen called with an empty array argument, the base case of our func­\n\ntion\
    \ simply returns 0 1. In the recursive case, we form the head 2 and the \n\ntail 3\
    \ from the original numbers argument. Keep in mind that the data type \n\nof tail\
    \ is an array of numbers, just like the numbers argument. But the data \n\ntype\
    \ of head is just a single number value, and not an array with one num­\n\nber\
    \ value. The return value of the sum() function is also a single number \n\nvalue\
    \ and not an array of numbers; this is why we can add head and sum(tail) \n\n\
    together in the recursive case 4. \n\nEach recursive call passes a smaller and\
    \ smaller array to sum(), bringing \n\nit closer to the base case of an empty\
    \ array. For example, Figure 3-1 shows \n\nthe state of the call stack for sum(\\\
    [5, 2, 4, 8\\]).\n\nIn this figure, each card in the stack represents a function\
    \ call. At the \n\ntop of each card is the function name with the argument it\
    \ was passed \n\nwhen called. Beneath that are the local variables: the numbers\
    \ parameter, \n\nand the head and tail local variables created during the call.\
    \ At the bottom \n\nof the card is the head + sum(tail) expression that the function\
    \ call returns. \n\nWhen a new recursive function is made, a new card is pushed\
    \ to the stack. \n\nWhen the function call returns, the top card is popped from\
    \ the stack.\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
