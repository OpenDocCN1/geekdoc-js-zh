  md: "**8**\n\n**TA IL C A L L OP T IM I Z AT ION**\n\nIn the previous chapter, we\
    \ covered using \n\nmemoization to optimize recursive func­\n\ntions. This chapter\
    \ explores a technique \n\ncalled* tail call optimization*, which is a feature\
    \ \n\nprovided by a compiler or interpreter to avoid stack \n\noverflows. Tail\
    \ call optimization is also called *tail call *\n\n*elimination*, or *tail recursion\
    \ elimination*.\n\nThis chapter is meant to explain tail call optimization, not\
    \ to endorse \n\nit. I would go so far as to recommend *never* using tail call\
    \ optimization. As \n\nyou’ll see, rearranging your function’s code to use tail\
    \ call optimization \n\noften makes it far less understandable. You should consider\
    \ tail call opti­\n\nmization more of a hack or workaround to make recursion work\
    \ when you \n\nshouldn’t be using a recursive algorithm in the first place. Remember,\
    \ a \n\ncomplex recursive solution is not automatically an elegant solution; simple\
    \ \n\ncoding problems should be solved with simple non-recursive methods.\n\n\
    Many implementations of popular programming languages don’t even \n\noffer tail\
    \ call optimization as a feature. These include interpreters and \n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_188_0.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_188_1.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_188_2.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_188_3.png)![](img/4317e0d10a2a71da22fc74ce42e2668a_188_4.png)\n\
