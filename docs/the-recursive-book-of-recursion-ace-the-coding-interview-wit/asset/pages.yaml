  md: "Drawing Fractals   **197**\n\n**Summary**\n\nThe incredibly wide field of fractals\
    \ combines all the most interesting \n\nparts of programming and art, making this\
    \ chapter the most fun to write. \n\nMathematicians and computer scientists talk\
    \ about the beauty and elegance \n\nthat the advanced topics of their fields produce,\
    \ but recursive fractals are \n\nable to turn this conceptual beauty into visual\
    \ beauty that anyone can \n\nappreciate.\n\nThis chapter covered several fractals\
    \ and the programs that draw \n\nthem: the Sierpinski triangle, the Sierpinski\
    \ carpet, procedurally gener­\n\nated fractal trees, the Koch snowflake, and the\
    \ Hilbert curve. All of these \n\nwere drawn with Python’s turtle module and functions\
    \ that recursively call \n\nthemselves.\n\n**Further Reading**\n\nTo learn more\
    \ about drawing with Python’s turtle module, I’ve written a \n\nsimple tutorial\
    \ at *https://github.com/asweigart/simple-turtle-tutorial-for-python*. \n\nI also\
    \ have a personal collection of turtle programs at *https://github.com/*\n\n*asweigart/art-of-turtle-programming*.\n\
    \nThe question of Great Britain’s coastline’s length came from the \n\ntitle of\
    \ a 1967 paper by Mandelbrot. The idea is summarized nicely on \n\nWikipedia at\
    \ *https://en.wikipedia.org/wiki/Coastline\\_paradox*. Khan Academy \n\nhas more\
    \ on the geometry of the Koch snowflake at *https://www.khanacad­*\n\n*emy.org/math/geometry-home/geometry-volume-surface-area/koch-snowflake/v/*\n\
    \n*koch-snowflake-fractal*.\n\nThe 3Blue1Brown YouTube channel has excellent animations\
    \ of frac­\n\ntals, particularly the “Fractals Are Typically Not Self-Similar”\
    \ video at \n\n*https://youtu.be/gB9n2gHsHN4* and the “Fractal Charm: Space-Filling\
    \ Curves” \n\nvideo at *https://youtu.be/RU0wScIj36o*.\n\nOther space-filling\
    \ curves require recursion to draw, such as the Peano \n\ncurve, Gosper curve,\
    \ and dragon curve, and they’re worth researching on \n\nthe web.\n\n**Practice\
    \ Questions**\n\nTest your comprehension by answering the following questions:\n\
    \n 1. What are fractals?\n\n 2. What do the x- and y-coordinates represent in\
    \ a Cartesian coordinate \n\nsystem?\n\n 3. What are the origin coordinates in\
    \ a Cartesian coordinate system?\n\n 4. What is procedural generation?\n\n 5.\
    \ What is a seed value?\n\nThe Recursive Book of Recursion (Early Access) © 2022\
    \ by Al Sweigart"
  merge: -1
  pgno: 222
