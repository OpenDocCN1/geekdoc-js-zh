  md: "What is Recursion?   **7**\n\nfunction b() {\n\n document.write(\"b() was called.<br\
    \ />\");\n\n 2 c();\n\n document.write(\"b() is returning.<br />\");\n\n}\n\n\
    function c() {\n\n document.write(\"c() was called.<br />\");\n\n document.write(\"\
    c() is returning.<br />\");\n\n}\n\na();\n\n</script>\n\nWhen you run this code,\
    \ the output looks like this:\n\na() was called.\n\nb() was called.\n\nc() was\
    \ called.\n\nc() is returning.\n\nb() is returning.\n\na() is returning.\n\nThe\
    \ output shows the start of functions a(), b(), and c(). Then, when the \n\nfunctions\
    \ return, the output appears in reverse order: c(), b(), and then a(). \n\nNotice\
    \ the pattern to the text output: each time a function returns, it remem­\n\n\
    bers which line of code originally called it. When the c() function call ends,\
    \ \n\nthe program returns to the b() function and displays b() is returning..\
    \ Then \n\nthe b() function call ends, and the program returns to the a() function\
    \ and \n\ndisplays a() is returning.. Finally, the program returns to the original\
    \ a() \n\nfunction call at the end of the program. In other words, function calls\
    \ don’t \n\nsend the execution of the program on a one-way trip. \n\nBut how does\
    \ the program remember if it was a() 1 or b() 2 that called \n\nc()? This detail\
    \ is handled by the program implicitly with a call stack. To \n\nunderstand how\
    \ call stacks remember where the execution returns at the \n\nend of a function\
    \ call, we need to first understand what a stack is.\n\n**What Are Stacks?**\n\
    \nEarlier I mentioned the clichéd wisecrack, “To understand recursion, you \n\n\
    must first understand recursion.” But this is actually wrong: to really under­\n\
    \nstand recursion, you must first understand stacks. \n\nA *stack* is one of the\
    \ simplest data structures in computer science. It \n\nstores multiple values\
    \ like a list does—but unlike lists, it limits you to add­\n\ning to or removing\
    \ values from the “top” of the stack only. For lists, the \n\n“top” is the last\
    \ item, at the right end of the list. Adding values is called \n\n*pushing* values\
    \ onto the stack, while removing values is called *popping* val­\n\nues off the\
    \ stack.\n\nImagine that you’re engaged in a meandering conversation with some­\n\
    \none. You’re talking about your friend Alice, which then reminds you of a \n\n\
