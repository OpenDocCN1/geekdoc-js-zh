  md: "**168**   Chapter 8\n\n***Tail Recursive Reverse String***\n\nThe first example\
    \ is the program to reverse a string that we made in \n\nChapter 3. The Python\
    \ code for this tail recursive function is in *reverseString­*\n\n*TailCall.py*:\n\
    \n*Python*1 def rev(theString, accum=''):\n\n if len(theString) == 0:\n\n # BASE\
    \ CASE\n\n 2 return accum\n\n else:\n\n # RECURSIVE CASE\n\n head = theString\\\
    [0\\]\n\n tail = theString\\[1:\\]\n\n 3 return rev(tail, head + accum)\n\ntext\
    \ = 'abcdef'\n\nprint('The reverse of ' + text + ' is ' + rev(text))\n\nThe JavaScript\
    \ equivalent is in *reverseStringTailCall.html*:\n\n*JavaScript*\n\n<script type=\"\
    text/javascript\">\n\n1 function rev(theString, accum='') {\n\n if (theString.length\
    \ === 0) {\n\n // BASE CASE\n\n 2 return accum;\n\n } else {\n\n // RECURSIVE\
    \ CASE\n\n let head = theString\\[0\\];\n\n let tail = theString.substring(1,\
    \ theString.length);\n\n 3 return rev(tail, head + accum);\n\n }\n\n}\n\nlet text\
    \ = \"abcdef\";\n\ndocument.write(\"The reverse of \" + text + \" is \" + rev(text)\
    \ + \"<br />\");\n\n</script>\n\nThe conversion of the original recursive functions\
    \ in *reverseString.*\n\n*py* and *reverseString.html* involves adding an accumulator\
    \ parameter. The \n\naccumulator, named accum, is set to the blank string by default\
    \ if no argu­\n\nment is passed for it 1. We also change the base case from return\
    \ '' to \n\nreturn accum 2, and the recursive case from return rev(tail) + head\
    \ (which \n\nperforms a string concatenation after the recursive call returns)\
    \ to return \n\nrev(tail, head + accum) 3. You can think of the rev('abcdef')\
    \ function call \n\nas transforming into the following return, as shown in Figure 8-2.\n\
    \nBy effectively using the accumulator as a local variable shared across \n\n\
    function calls, we can make the rev() function tail recursive.\n\nThe Recursive\
    \ Book of Recursion (Early Access) © 2022 by Al Sweigart"
