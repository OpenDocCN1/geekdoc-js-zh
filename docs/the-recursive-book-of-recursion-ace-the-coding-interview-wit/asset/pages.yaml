  md: "Droste Maker   **291**\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_316_0.png)\n\
    \n*Figure 14-5: Resizing the image to the dimensions of the magenta area can result\
    \ in a *\n\n*different aspect ratio, causing it to look stretched or squished.*\n\
    \nTo calculate the correct resizing dimensions, the program needs to \n\ndetermine\
    \ the aspect ratio of both the base image and the magenta area:\n\n*Python*\n\n\
    \ # Get a resized version of the base image:\n\n magentaWidth = magentaRight -\
    \ magentaLeft + 1\n\n magentaHeight = magentaBottom - magentaTop + 1\n\n baseImageAspectRatio\
    \ = baseImageWidth / baseImageHeight\n\n magentaAspectRatio = magentaWidth / magentaHeight\n\
    \nFrom magentaRight and magentaLeft, we can calculate the width of the \n\nmagenta\
    \ area. The \\+ 1 accounts for a small, necessary adjustment: if the \n\nright\
    \ side of the magenta area was the x-coordinate of 11 and the left \n\nside was\
    \ 10, the width would be two pixels. This is correctly calculated by \n\n(­magentaRight\
    \ - magentaLeft + 1), not (magentaRight - magentaLeft).\n\nBecause the aspect\
    \ ratio is the width divided by the height, images with \n\nlarge aspect ratios\
    \ are taller than they are wide, and those with small aspect \n\nratios are wider\
    \ than they are tall. An aspect ratio of 1.0 describes a perfect \n\nsquare. The\
    \ next lines set the dimensions of the resized image after com­\n\nparing the\
    \ aspect ratios of the base image and magenta area:\n\n if baseImageAspectRatio\
    \ < magentaAspectRatio:\n\n # Make the resized width match the width of the magenta\
    \ area:\n\n widthRatio = magentaWidth / baseImageWidth\n\n resizedImage = baseImage.resize((magentaWidth,\
    \ \n\n int(baseImageHeight \\* widthRatio) + 1), Image.NEAREST)\n\nThe Recursive\
    \ Book of Recursion (Early Access) © 2022 by Al Sweigart"
