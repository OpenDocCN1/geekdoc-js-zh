  md: "**216**   Chapter 11\n\neasier to implement than many other maze-generation\
    \ algorithms, such as \n\nKruskal’s algorithm or Wilson’s algorithm, so it serves\
    \ as a good introduc­\n\ntion to the topic.\n\n**The Complete Maze-Generator Program**\n\
    \nLet’s begin by taking a look at the complete Python and JavaScript source \n\
    \ncode for the program, which uses the recursive backtracking algorithm for \n\
    \nmaze generation. The rest of this chapter explains each section of code \n\n\
    individually. \n\nCopy this Python code to a file named *mazeGenerator.py*:\n\n\
    *Python*\n\nimport random\n\nWIDTH = 39 # Width of the maze (must be odd).\n\n\
    HEIGHT = 19 # Height of the maze (must be odd).\n\nassert WIDTH % 2 == 1 and WIDTH\
    \ >= 3\n\nassert HEIGHT % 2 == 1 and HEIGHT >= 3\n\nSEED = 1\n\nrandom.seed(SEED)\n\
    \n\\# Use these characters for displaying the maze:\n\nEMPTY = ' '\n\nMARK = '@'\n\
    \nWALL = chr(9608) # Character 9608 is '^█'\n\nNORTH, SOUTH, EAST, WEST = 'n',\
    \ 's', 'e', 'w'\n\n\\# Create the filled-in maze data structure to start: \n\n\
    maze = {}\n\nfor x in range(WIDTH):\n\n for y in range(HEIGHT):\n\n maze\\[(x,\
    \ y)\\] = WALL # Every space is a wall at first.\n\n \n\ndef printMaze(maze, markX=None,\
    \ markY=None):\n\n \"\"\"Displays the maze data structure in the maze argument.\
    \ The\n\n markX and markY arguments are coordinates of the current\n\n '@' location\
    \ of the algorithm as it generates the maze.\"\"\"\n\n for y in range(HEIGHT):\n\
    \n for x in range(WIDTH):\n\n if markX == x and markY == y:\n\n # Display the\
    \ '@' mark here:\n\n print(MARK, end='')\n\n else:\n\n # Display the wall or empty\
    \ space:\n\n print(maze\\[(x, y)\\], end='')\n\n print() # Print a newline after\
    \ printing the row.\n\ndef visit(x, y):\n\n \"\"\"\"Carve out\" empty spaces in\
    \ the maze at x, y and then\n\n recursively move to neighboring unvisited spaces.\
    \ This\n\n function backtracks when the mark has reached a dead end.\"\"\"\n\n\
    The Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
