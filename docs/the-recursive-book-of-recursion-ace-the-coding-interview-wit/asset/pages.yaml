  md: "**4**   Chapter 1\n\nIt’s hard to understand something when you can’t see it\
    \ and don’t know \n\nit exists! In this chapter, we’ll pull back the curtain to\
    \ dispel the overblown \n\nnotion that recursion is hard, and you’ll be able to\
    \ appreciate the elegance \n\nunderneath.\n\n**The Definition of Recursion**\n\
    \nBefore we discuss recursion, let’s get the clichéd recursion jokes out of the\
    \ \n\nway, starting with this: “To understand recursion, you must first understand\
    \ \n\nrecursion.”\n\nDuring the months I’ve spent writing this book, I can assure\
    \ you that \n\nthis joke gets funnier the more you hear it. \n\nAnother joke is\
    \ that if you search Google for *recursion*, the results page \n\nasks if you\
    \ mean *recursion*. Following the link, as shown in Figure 1-1, takes \n\nyou\
    \ to . . . the search results for *recursion*.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_29_0.png)\n\
    \n*Figure 1-1: The Google search results for *recursion* link to the Google search\
    \ results *\n\n*for *recursion*.*\n\nFigure 1-2 shows a recursion joke from the\
    \ webcomic xkcd.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_29_1.png)\n\n*Figure 1-2:\
    \ I’m So Meta, Even *\n\n*This Acronym (I.S. M.E.T.A.)*\n\nMost jokes about the\
    \ 2010 science-fiction action movie *Inception* are \n\nrecursion jokes. The film\
    \ features characters having dreams within dreams \n\nwithin dreams.\n\nAnd finally,\
    \ what computer scientist could forget that monster from \n\nGreek mythology,\
    \ the recursive centaur? As you can see in Figure 1-3, it is \n\nhalf horse, half\
    \ recursive centaur.\n\nThe Recursive Book of Recursion (Early Access) © 2022\
    \ by Al Sweigart"
