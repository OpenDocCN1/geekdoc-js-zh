  md: "Droste Maker   **287**\n\n*Python*\n\n if stopAfter == 0:\n\n\\# BASE CASE\n\
    \nreturn baseImage\n\nThe stopAfter parameter is 10 by default if the function\
    \ call doesn’t \n\nprovide one. The recursive call to makeDroste() later in this\
    \ function passes \n\nstopAfter - 1 as the argument for this parameter so that\
    \ it decreases with \n\neach recursive call and approaches the base case of 0.\n\
    \nFor example, passing 0 for stopAfter results in the function immedi-\n\nately\
    \ returning a recursive image identical to the base image. Passing 1 for \n\n\
    stopAfter replaces the magenta area with a recursive image once, makes one \n\n\
    recursive call, reaches the base case, and immediately returns. Passing 2 for\
    \ \n\nstopAfter causes two recursive calls, and so on.\n\nThis parameter prevents\
    \ the function from recursing until it causes \n\na stack overflow in cases when\
    \ the magenta area is particularly large. It \n\nalso lets us pass a smaller argument\
    \ than 10 to limit the number of recur-\n\nsive images placed in the base image.\
    \ For example, the four images in \n\nFigure 14-2 were created by passing 0, 1,\
    \ 2, and 3 for the stopAfter parameter.\n\nNext, we check the color mode of the\
    \ base image. This can either be \n\nRGB for an image with red-green-blue pixels\
    \ or RGBA for images that have an \n\nalpha channel for its pixels. The *alpha\
    \ value* tells a pixel’s level of transpar-\n\nency. Here’s the code:\n\n*Python*\n\
    \n # The magenta color has max red/blue/alpha, zero green:\n\n if baseImage.mode\
    \ == 'RGBA':\n\nmagentaColor = (255, 0, 255, 255)\n\n elif baseImage.mode == 'RGB':\n\
    \nmagentaColor = (255, 0, 255)\n\nDroste Maker needs to know the color mode so\
    \ it can find magenta \n\npixels. The values for each channel range from 0 to\
    \ 255, and magenta pix-\n\nels have a maximum amount of red and blue and no green.\
    \ Further, if an \n\nalpha channel exists, it would be set to 255 for a completely\
    \ opaque color \n\nand 0 for a completely transparent one. The magentaColor variable\
    \ is set to \n\nthe correct tuple value for a magenta pixel depending on the image’s\
    \ color \n\nmode given in baseImage.mode.\n\n**Finding the Magenta Area**\n\n\
    Before the program can recursively insert the image into the magenta area, \n\n\
    it must find the boundaries of the magenta area in the image. This involves \n\
    \nfinding the leftmost, rightmost, topmost, and bottommost magenta pixels \n\n\
    in the image.\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
