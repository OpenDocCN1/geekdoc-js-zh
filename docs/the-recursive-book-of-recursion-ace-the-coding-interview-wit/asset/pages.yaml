  md: "What is Recursion?   **19**\n\n“Recursion (Think Like a Programmer)” at *https://youtu.be/oKndim5-G94*.\
    \ \n\nWikipedia’s article on recursion goes into great detail at *https://en.wikipedia\
    \ *\n\n*.org/wiki/Recursion*.\n\nYou can install the ShowCallStack module for\
    \ Python. This module \n\nadds a showcallstack() function that you can place anywhere\
    \ in your code \n\nto see the state of the call stack at that particular point\
    \ in your program. \n\nYou can download the module and find instructions for it\
    \ at *https://pypi.org/*\n\n*project/ShowCallStack*.\n\n**Practice Questions**\n\
    \nTest your comprehension by answering the following questions:\n\n 1. In general,\
    \ what is a recursive thing?\n\n 2. In programming, what is a recursive function?\n\
    \n 3. What four features do functions have?\n\n 4. What is a stack?\n\n 5. What\
    \ are the terms for adding and removing values to the top of a \n\nstack?\n\n\
    \ 6. Say you push the letter *J* to a stack, then push the letter *Q*, then pop\
    \ the \n\nstack, then push the letter *K*, then pop the stack again. What does\
    \ the \n\nstack look like?\n\n 7. What is pushed and popped onto the call stack?\n\
    \n 8. What causes a stack overflow to happen?\n\n 9. What is a base case?\n\n\
    \ 10. What is a recursive case?\n\n 11. How many base cases and recursive cases\
    \ do recursive functions have?\n\n 12. What happens if a recursive function has\
    \ zero base cases?\n\n 13. What happens if a recursive function has zero recursive\
    \ cases?\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
