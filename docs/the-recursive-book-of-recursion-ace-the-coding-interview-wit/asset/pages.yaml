  md: "Droste Maker   **289**\n\nThese edge variable values are replaced by integer\
    \ x and y coordinates \n\nin the code that comes next:\n\n*Python*\n\n for x in\
    \ range(baseImageWidth):\n\n for y in range(baseImageHeight):\n\n if baseImage.getpixel((x,\
    \ y)) == magentaColor:\n\n if magentaLeft is None or x < magentaLeft:\n\n magentaLeft\
    \ = x\n\n if magentaRight is None or x > magentaRight:\n\n magentaRight = x\n\n\
    \ if magentaTop is None or y < magentaTop:\n\n magentaTop = y\n\n if magentaBottom\
    \ is None or y > magentaBottom:\n\n magentaBottom = y\n\nThese nested for loops\
    \ iterate the x and y variables over every possible \n\nx, y coordinate in the\
    \ base image. We check whether the pixel at each \n\ncoordinate is the pure magenta\
    \ color stored in magentaColor, then update \n\nthe magentaLeft variable if the\
    \ coordinates of the magenta pixel are further \n\nleft than currently recorded\
    \ in magentaLeft, and so on for the other three \n\ndirections.\n\nBy the time\
    \ the nested for loops are finished, magentaLeft, magentaRight, \n\nmagentaTop,\
    \ and magentaBottom will describe the boundaries of the magenta \n\npixels in\
    \ the base image. If the image has no magenta pixels, these variables \n\nwill\
    \ remain set to their initial None value:\n\n*Python*\n\n if magentaLeft is None:\n\
    \n # BASE CASE - No magenta pixels are in the image.\n\n return baseImage\n\n\
    If magentaLeft (or really, any of the four variables) is still set to None after\
    \ \n\nthe nested for loops complete, no magenta pixels are in the image. This\
    \ is \n\na base case for our recursive algorithm because the magenta area becomes\
    \ \n\nsmaller and smaller with each recursive call to makeDroste(). At this point,\
    \ \n\nthe function returns the Pillow Image object in baseImage.\n\n**Resizing\
    \ the Base Image**\n\nWe need to resize the base image to cover the entire magenta\
    \ area and no \n\nmore. Figure 14-4 shows the complete resized image overlayed\
    \ transpar-\n\nently on the original base image. This resized image is cropped\
    \ so that only \n\nthe parts over magenta pixels are copied over to the final\
    \ image.\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
