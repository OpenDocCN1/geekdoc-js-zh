  md: "**164**   Chapter 8\n\ncompilers for Python, JavaScript, and Java. However,\
    \ tail call optimization is \n\na technique you should become familiar with in\
    \ case you come across it in \n\nthe code projects you work on.\n\n**How Tail\
    \ Recursion and Tail Call Optimization Work**\n\nTo make use of tail call optimization,\
    \ a function must use *tail recursion.* In \n\ntail recursion, the recursive function\
    \ call is the last action of a recursive \n\nfunction. In code, this looks like\
    \ a return statement returning the results of \n\na recursive call. \n\nTo see\
    \ this in action, recall the *factorialByRecursion.py* and *factorialByRe­*\n\n\
    *cursion.html* programs in Chapter 2. These programs calculated the factorial\
    \ \n\nof an integer; for instance, 5! is equivalent to 5 × 4 × 3 × 2 × 1, or 120.\
    \ These \n\ncalculations can be performed recursively because factorial(n) is\
    \ equivalent \n\nto n \\* factorial(n – 1), with the base case of n == 1 returning\
    \ 1. \n\nLet’s rewrite these programs to use tail recursion. The following *factori­*\n\
    \n*alTailCall.py* has a factorial() function that uses tail recursion:\n\n*Python*\n\
    \ndef factorial(number, accum=1):\n\n if number == 1:\n\n # BASE CASE\n\n return\
    \ accum\n\n else:\n\n # RECURSIVE CASE\n\n return factorial(number - 1, accum\
    \ \\* number)\n\nprint(factorial(5))\n\nThe *factorialTailCall.html* program has\
    \ the equivalent JavaScript code:\n\n*JavaScript*\n\n<script type=\"text/javascript\"\
    >\n\nfunction factorial(number, accum=1) {\n\n if (number === 1) {\n\n // BASE\
    \ CASE\n\n return accum;\n\n } else {\n\n // RECURSIVE CASE\n\n return factorial(number\
    \ - 1, accum \\* number);\n\n }\n\n}\n\ndocument.write(factorial(5));\n\n</script>\n\
    \nNotice that the factorial() function’s recursive case ends with a return \n\n\
    statement returning the results of a recursive call to factorial(). To allow the\
    \ \n\ninterpreter or compiler to implement tail call optimization, the last action\
    \ a \n\nrecursive function makes must be returning the results of the recursive\
    \ call. \n\nNo instructions can occur between making the recursive call and the\
    \ return \n\nstatement. The base case returns the accum parameter. This is the\
    \ accumula­\n\ntor, explained in the next section.\n\nThe Recursive Book of Recursion\
    \ (Early Access) © 2022 by Al Sweigart"
