  md: "Fractal Art Maker   **265**\n\n**Setting Up Constants and the Turtle Configuration**\n\
    \nThe first lines of the program cover basic setup steps for our turtle-based\
    \ \n\nprogram:\n\n*Python*\n\nimport turtle, math\n\nDRAW\\_FRACTAL = 1 # Set\
    \ to 1 through 11 and run the program.\n\nturtle.tracer(5000, 0) # Increase the\
    \ first argument to speed up the drawing.\n\nturtle.hideturtle()\n\nThe program\
    \ imports the turtle module for drawing. It also imports \n\nthe math module for\
    \ the math.sqrt() function, which the Sierpiński Triangle \n\nfractal will use,\
    \ and the math.cos() and math.sin() functions, for the \n\nSnowflake fractal.\
    \ \n\nThe DRAW\\_FRACTAL constant can be set to any integer from 1 to 9 to draw\
    \ \n\none of the nine built-in fractals the program produces. You can also set\
    \ it to \n\n10 or 11 to show the output of the square and triangle shape-drawing\
    \ func­\n\ntions, respectively.\n\nWe also call some turtle functions to prepare\
    \ for drawing. The turtle.\n\ntracer(5000, 0) call speeds up the drawing of the\
    \ fractal. The 5000 argu­\n\nment tells the turtle module to wait until 5,000\
    \ turtle drawing instructions \n\nhave been processed before rendering the drawing\
    \ on the screen, and the 0 \n\nargument tells it to pause for 0 milliseconds after\
    \ each drawing instruction. \n\nOtherwise, the turtle module would render the\
    \ image after each drawing \n\ninstruction, which significantly slows the program\
    \ if we want only the final \n\nimage. \n\nYou can change this call to turtle.tracer(1,\
    \ 10) if you want to slow the \n\ndrawing and watch the lines as they’re produced.\
    \ This can be useful when \n\nmaking your own fractals to debug any problems with\
    \ the drawing.\n\nThe turtle.hideturtle() call hides the triangle shape on the\
    \ screen that \n\nrepresents the turtle’s current position and heading. (*Heading*\
    \ is another \n\nterm for *direction*.) We call this function so the marker doesn’t\
    \ appear in the \n\nfinal image.\n\n**Working with the Shape-Drawing Functions**\n\
    \nThe drawFractal() function uses a shape-drawing function passed to it to \n\n\
    draw the individual parts of the fractal. This is usually a simple shape, such\
    \ \n\nas a square or triangle. The beautiful complexity of the fractals emerges\
    \ \n\nfrom drawFractal() recursively calling this function for each individual\
    \ com­\n\nponent of the whole fractal.\n\nThe shape-drawing functions for the\
    \ Fractal Art Maker have two \n\nparameters: size and depth. The size parameter\
    \ is the length of the sides \n\nof the square or triangle it draws. The shape-drawing\
    \ functions should \n\nalways use arguments to turtle.forward() that are based\
    \ on size so that the \n\nlengths will be proportionate to size at each level\
    \ of recursion. Avoid code \n\nlike turtle.forward(100) or turtle.forward(200);\
    \ instead, use code that is based \n\nThe Recursive Book of Recursion (Early Access)\
    \ © 2022 by Al Sweigart"
