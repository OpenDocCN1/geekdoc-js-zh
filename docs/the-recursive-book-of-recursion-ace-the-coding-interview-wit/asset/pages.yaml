  md: "**18**   Chapter 1\n\nThe fact that the code doesn’t stop immediately when\
    \ the base case is \n\nreached will be important to keep in mind for the factorial\
    \ calculation in \n\nthe next chapter. Remember, any code after the recursive\
    \ case will still have \n\nto run.\n\nAt this point, you might be thinking that\
    \ the recursive countDownAndUp() \n\nfunction is overengineered and difficult\
    \ to follow. Why not, instead, use \n\nan iterative solution to print numbers?\
    \ An *iterative* approach, which uses \n\nloops to repeat a task until it’s done,\
    \ is usually thought of as the opposite of \n\nrecursion. \n\nWhenever you find\
    \ yourself asking, “Wouldn’t using a loop be easier?” \n\nthe answer is almost\
    \ certainly “Yes,” and you should avoid the recursive solu­\n\ntion. Recursion\
    \ can be tricky for both beginner and experienced program­\n\nmers, and recursive\
    \ code isn’t automatically “better” or “more elegant” than \n\niterative code.\
    \ Readable, easy-to-understand code is more important than \n\nany supposed elegance\
    \ that recursion provides. However, on some occa­\n\nsions an algorithm cleanly\
    \ maps to a recursive approach. Algorithms that \n\ninvolve tree-like data structures\
    \ and require backtracking are especially \n\nsuited for recursion. These ideas\
    \ are further explored in Chapter 2. \n\n**Summary**\n\nRecursion often confuses\
    \ new programmers, but it is built on the simple \n\nidea that a function can\
    \ call itself. Every time a function call is made, a \n\nnew frame object with\
    \ information related to the call (such as local vari­\n\nables and a return address\
    \ for the execution to move to when the function \n\nreturns) is added to the\
    \ call stack. The call stack, being a stack data struc­\n\nture, can be altered\
    \ only by having data added to or removed from its “top.” \n\nThis is called *pushing\
    \ to* and *popping from* the stack, respectively.\n\nThe call stack is handled\
    \ by the program implicitly, so there is no call \n\nstack variable. Calling a\
    \ function pushes a frame object to the call stack, \n\nand returning from a function\
    \ pops a frame object from the call stack.\n\nRecursive functions have recursive\
    \ cases, those in which a recursive call \n\nis made, and base cases, those where\
    \ the function simply returns. If there \n\nis no base case or a bug prevents\
    \ a base case from being run, the execution \n\ncauses a stack overflow that crashes\
    \ the program.\n\nRecursion is a useful technique, but recursion doesn’t automatically\
    \ \n\nmake code “better” or more “elegant.” This idea is explored more in the\
    \ \n\nnext chapter.\n\n**Further Reading**\n\nYou can find other introductions\
    \ to recursion in my 2018 North Bay Python \n\nconference talk, “Recursion for\
    \ Beginners: A Beginner’s Guide to Recursion” \n\nat *https://youtu.be/AfBqVVKg4GE*.\
    \ The YouTube channel Computerphile also \n\nintroduces recursion in its video\
    \ “What on Earth is Recursion?” at *https://*\n\n*youtu.be/Mv9NEXX1VHc*. Finally,\
    \ V. Anton Spraul talks about recursion in \n\nhis book *Think Like a Programmer*\
    \ (2012, No Starch Press) and in his video \n\nThe Recursive Book of Recursion\
    \ (Early Access) © 2022 by Al Sweigart"
