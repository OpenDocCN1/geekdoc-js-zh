    \ + \"<br />\");\n\n3 cardStack.pop()\n\ndocument.write(cardStack + \"<br />\"\
    );\n\n</script>\n\nWhen you run this code, the output looks like this:\n\n5 of\
    \ diamonds\n\n5 of diamonds,3 of clubs\n\n5 of diamonds,3 of clubs,ace of hearts\n\
    \n5 of diamonds,3 of clubs\n\nThe stack starts off as empty 1. Three strings representing\
    \ cards are \n\npushed onto the stack 2. Then the stack is popped 3, which removes\
    \ the \n\nace of hearts and leaves the three of clubs at the top of the stack\
    \ again. The \n\nstate of the cardStack stack is tracked in Figure 1-6, going\
    \ from left to right.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_34_0.png)\n\n\
    Empty\n\n*Figure 1-6: The stack starts empty. Cards are then pushed onto and popped\
    \ off the stack.*\n\nYou can see only the topmost card in the card stack, or,\
    \ in our pro­\n\ngram’s stacks, the topmost value. In the simplest stack implementations,\
    \ \n\nyou can’t see how many cards (or values) are in the stack. You can see only\
    \ \n\nwhether the stack is empty or not. \n\nStacks are a *LIFO* data structure,\
    \ which stands for *last in, first out*, since \n\nthe last value pushed onto\
    \ the stack is the first value popped out of it. This \n\nbehavior is similar\
    \ to your web browser’s Back button. Your browser tab’s \n\nhistory functions\
    \ like a stack that contains all the pages you’ve visited in the \n\norder that\
    \ you visited them. The browser is always displaying the web page \n\nat the “top”\
    \ of the history’s “stack.” Clicking a link pushes a new web page \n\nonto the\
    \ history stack, while clicking the Back button pops the top web \n\npage off\
    \ and reveals the one “underneath.”\n\n**What Is the Call Stack?**\n\nPrograms\
    \ use stacks too. The program’s *call stack*, also simply called *the *\n\n*stack*,\
    \ is a stack of frame objects. *Frame objects*, also simply called *frames*, con­\n\
    \ntain information about a single function call, including which line of code\
    \ \n\ncalled the function, so the execution can move back there when the func­\n\
    \ntion returns. \n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al\
    \ Sweigart"
