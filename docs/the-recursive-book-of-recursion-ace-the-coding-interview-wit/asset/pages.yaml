    \ BASE CASE\n\n 2 return numbers\\[0\\];\n\n } else { // RECURSIVE CASE\n\n 3\
    \ let mid = Math.floor(numbers.length / 2);\n\n let leftHalfSum = sumDivConq(numbers.slice(0,\
    \ mid));\n\n let rightHalfSum = sumDivConq(numbers.slice(mid, numbers.length +\
    \ 1));\n\n 4 return leftHalfSum + rightHalfSum;\n\n }\n\n}\n\nlet nums = \\[1,\
    \ 2, 3, 4, 5\\];\n\ndocument.write('The sum of ' + nums + ' is ' + sumDivConq(nums)\
    \ + \"<br />\");\n\nnums = \\[5, 2, 4, 8\\];\n\ndocument.write('The sum of ' +\
    \ nums + ' is ' + sumDivConq(nums) + \"<br />\");\n\nnums = \\[1, 10, 100, 1000\\\
    ];\n\ndocument.write('The sum of ' + nums + ' is ' + sumDivConq(nums) + \"<br\
    \ />\");\n\n</script>\n\nThe sumDivConq() function first checks the numbers array\
    \ for having either \n\nzero or one number in it. These trivial base cases are\
    \ easy to sum since they \n\nrequire no addition: either return 0 1 or the lone\
    \ number in the array 2. \n\nEverything else is a recursive case; the middle index\
    \ of the array is calcu­\n\nlated 3 so that separate recursive calls with the\
    \ left half and right half of \n\nthe numbers array are made. The sum of these\
    \ two return values becomes \n\nthe return value for the current sumDivConq()\
    \ call 4.\n\nBecause of the associative nature of addition, there’s no reason\
    \ an array \n\nof numbers must be added sequentially by a single computer. Our\
    \ program \n\ncarries out all operations on the same computer, but for large arrays\
    \ or calcu­\n\nlations more complicated than addition, our program could send\
    \ the halves \n\nto other computers to complete. The problem can be divided into\
    \ similar \n\nsubproblems, which is a huge hint that a recursive approach can\
    \ be taken.\n\n**Karatsuba Multiplication**\n\nThe \\* operator makes multiplication\
    \ easy to do in high-level programming \n\nlanguages such as Python and JavaScript.\
