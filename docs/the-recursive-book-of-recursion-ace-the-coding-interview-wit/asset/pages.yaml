    \ === 0) { 1\n\n document.write(indent + \"Base case reached, returning \" + \\\
    [prefix\\] + \"<br />\");\n\n return \\[prefix\\];\n\n }\n\n // RECURSIVE CASE\n\
    \n // Create a new prefix by adding each character to the current prefix.\n\n\
