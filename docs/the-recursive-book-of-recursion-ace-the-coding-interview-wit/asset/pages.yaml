  md: "**96**   Chapter 5\n\n document.write(\"Searching: \\[\" + \n\n haystack.slice(left,\
    \ right + 1).join(\", \") + \"\\]<br />\");\n\n if (left > right) { // BASE CASE\n\
    \n return null; // The \\`needle\\` is not in \\`haystack\\`.\n\n }\n\n let mid\
    \ = Math.floor((left + right) / 2);\n\n if (needle == haystack\\[mid\\]) { //\
    \ BASE CASE\n\n return mid; // The \\`needle\\` has been found in \\`haystack\\\
    `\n\n } else if (needle < haystack\\[mid\\]) { // RECURSIVE CASE\n\n return binarySearch(needle,\
    \ haystack, left, mid - 1);\n\n } else if (needle > haystack\\[mid\\]) { // RECURSIVE\
    \ CASE\n\n return binarySearch(needle, haystack, mid + 1, right);\n\n }\n\n}\n\
    \ndocument.write(binarySearch(13, \\[1, 4, 8, 11, 13, 16, 19, 19\\]);\n\n</script>\n\
    \nWhen you run these programs, the list \\[1, 4, 8, 11, 13, 16, 19, 19\\] is \n\
    \nsearched for 13, and the output looks like this:\n\nSearching: \\[1, 4, 8, 11,\
    \ 13, 16, 19, 19\\]\n\nSearching: \\[13, 16, 19, 19\\]\n\nSearching: \\[13\\]\n\
    \n4\n\nThe target value 13 is indeed at index 4 in that list.\n\nThe code calculates\
    \ the middle index (stored in mid) of the range \n\ndefined by the left and right\
    \ indexes. At first, this range is the entire \n\nlength of the items list. If\
    \ the value at the mid index is the same as needle, \n\nthen mid is returned.\
    \ Otherwise, we need to figure out whether our tar­\n\nget value is in the left\
    \ half of the range (in which case, the new range to \n\nsearch is left to mid\
    \ - 1) or in the right half (in which case, the new range \n\nto search is mid\
    \ + 1 to end).\n\nWe already have a function that can search this new range: binarySe­\n\
    \narch() itself! A recursive call is made on the new range. If we ever get to\
    \ \n\nthe point where the right end of the search range comes before the left,\
    \ we \n\nknow that our search range has shrunk down to zero and our target value\
    \ \n\nisn’t to be found.\n\nNotice that the code performs no actions after the\
    \ recursive call \n\nreturns; it immediately returns the return value of the recursive\
    \ function \n\ncall. This feature means that we could implement tail call optimization\
    \ \n\nfor this recursive algorithm, a practice we explain in Chapter 8. But also,\
    \ \n\nit means that binary search can easily be implemented as an iterative algo­\n\
    \nrithm that doesn’t use recursive function calls. Chapter 8 has the source \n\
    \ncode for an iterative binary search for you to compare with the recursive \n\
    \nbinary search. \n\nThe Recursive Book of Recursion (Early Access) © 2022 by\
