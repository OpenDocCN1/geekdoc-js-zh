  md: "What is Recursion?   **15**\n\n } else {\n\n // RECURSIVE CASE\n\n 2 shortestWithBaseCase(false);\n\
    \n document.write(\"Returning from recursive case.<br />\");\n\n return;\n\n }\n\
    \n}\n\ndocument.write(\"Calling shortestWithBaseCase(false):<br />\");\n\n3 shortestWithBaseCase(false);\n\
    \ndocument.write(\"<br />\");\n\ndocument.write(\"Calling shortestWithBaseCase(true):<br\
    \ />\");\n\n4 shortestWithBaseCase(true);\n\n</script>\n\nWhen you run this code,\
    \ the output looks like this:\n\nCalling shortestWithBaseCase(False):\n\nshortestWithBaseCase(False)\
    \ called.\n\nReturning from base case.\n\nCalling shortestWithBaseCase(True):\n\
    \nshortestWithBaseCase(True) called.\n\nshortestWithBaseCase(False) called.\n\n\
    Returning from base case.\n\nReturning from recursive case.\n\nThis function doesn’t\
    \ do anything useful except provide a short exam­\n\nple of recursion (and it\
    \ could be made shorter by removing the text output, \n\nbut the text is useful\
    \ for our explanation). When shortestWithBaseCase(False) \n\nis called 3, the\
    \ base case is executed and the function merely returns 1. \n\nHowever, when shortestWithBaseCase(True)\
    \ is called 4, the recursive case is \n\nexecuted and shortestWithBaseCase(False)\
    \ is called 2.\n\nIt’s important to note that when shortestWithBaseCase(False)\
    \ is recursively \n\ncalled from 2 and then returns, the execution doesn’t immediately\
    \ move \n\nback to the original function call at 4. The rest of the code in the\
    \ recursive \n\ncase after the recursive call still runs, which is why Returning\
    \ from recursive \n\ncase. appears in the output. Returning from the base case\
    \ doesn’t immedi­\n\nately return from all the recursive calls that happened before\
    \ it. This will be \n\nimportant to keep in mind in the countDownAndUp() example\
    \ in the next section.\n\n**Code Before and After the Recursive Call**\n\nThe\
    \ code in a recursive case can be split into two parts: the code before the \n\
    \nrecursive call and the code after the recursive call. (If there are two recur­\n\
    \nsive calls in the recursive case, such as with the Fibonacci sequence example\
    \ \n\nin Chapter 2, there will be a before, a between, and an after. But let’s\
    \ keep it \n\nsimple for now.)\n\nThe important thing to know is that reaching\
    \ the base case doesn’t nec­\n\nessarily mean reaching the end of the recursive\
    \ algorithm. It only means \n\nthe base case won’t continue to make recursive\
    \ calls.\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
