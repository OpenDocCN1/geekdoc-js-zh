    \ \"<br />\");\n\n</script> \n\nNotice that this program doesn’t have a recursive\
    \ function; it doesn’t \n\nhave any functions at all! The program emulates recursive\
    \ function calls by \n\nusing a list as a stack data structure (stored in the\
    \ callStack variable 1) to \n\nmimic the call stack. A dictionary storing the\
    \ return address information \n\nand nthNumber local variable emulates a frame\
    \ object 2. The program emu­\n\nlates function calls by pushing these frame objects\
    \ onto the call stack 4, \n\nand it emulates returning from a function call by\
    \ popping frame objects off \n\nthe call stack 3 5.\n\nAny recursive function\
    \ can be written iteratively this way. Although this \n\ncode is incredibly difficult\
    \ to understand and you’d never write a real-world \n\nfactorial algorithm this\
    \ way, it does demonstrate that recursion has no \n\ninnate capability that iterative\
    \ code does not have.\n\n**Converting an Iterative Algorithm into a Recursive\
    \ Algorithm**\n\nLikewise, converting an iterative algorithm into a recursive\
    \ algorithm is \n\nalways possible. An iterative algorithm is simply code that\
    \ uses a loop. The \n\ncode that is repeatedly executed (the loop’s body) can\
    \ be placed in a recur­\n\nsive function’s body. And just as the code in the loop’s\
    \ body is executed \n\nrepeatedly, we need to repeatedly call the function to\
    \ execute its code. \n\nWe can do this by calling the function from the function\
    \ itself, creating a \n\nrecursive function.\n\nThe Python code in *hello.py*\
    \ demonstrates printing Hello, world! five \n\ntimes by using a loop and then\
    \ also using a recursive function:\n\n*Python*\n\nprint('Code in a loop:')\n\n\
    i = 0\n\nwhile i < 5:\n\n print(i, 'Hello, world!')\n\n i = i + 1\n\nprint('Code\
    \ in a function:')\n\ndef hello(i=0):\n\n print(i, 'Hello, world!')\n\n i = i\
    \ + 1\n\n if i < 5:\n\n hello(i) # RECURSIVE CASE\n\nThe Recursive Book of Recursion\
    \ (Early Access) © 2022 by Al Sweigart"
