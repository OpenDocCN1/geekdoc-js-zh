  md: "**228**   Chapter 11\n\n maze\\[\\[x + 1, y\\]\\] = EMPTY; // Connecting hallway.\n\
    \n }\n\n hasVisited.push(\\[nextX, nextY\\]); // Mark space as visited.\n\n visit(nextX,\
