  md: "**74**   Chapter 4\n\nEdges in a DAG are not undirected—that is, bidirectional.\
    \ (Trees in gen­\n\neral do not have this restriction and can have edges in both\
    \ directions, \n\nincluding from a child node back to its parent node.) The graph\
    \ is *acyclic* \n\nbecause there are no loops, or *cycles*, from child nodes to\
    \ their own ancestor \n\nnodes; the “branches” of the tree must keep growing in\
    \ the same direction. \n\nYou can think of lists, arrays, and strings as linear\
    \ trees; the root is the \n\nfirst element, and the nodes have only one child\
    \ node. This linear tree ter­\n\nminates at its one leaf node. These linear trees\
    \ are called *linked lists*, as each \n\nnode has only one “next” node until the\
    \ end of the list. Figure 4-3 shows a \n\nlinked list that stores the characters\
    \ in the word *HELLO*.\n\n“H”\n\n“E”\n\n“L”\n\n“L”\n\n“O”\n\n*Figure 4-3: A linked\
    \ list data structure storing **HELLO**. Linked lists *\n\n*can be considered\
    \ a kind of tree data structure.*\n\nWe’ll use the code for the tree in Figure 4-2\
    \ for this chapter’s examples. \n\nA tree traversal algorithm will visit each\
    \ of the nodes in a tree by following \n\nthe edges, starting from a root node.\n\
    \n***Traversing the Tree***\n\nWe can write code to access data in any node by\
    \ starting from the root \n\nnode in root. For example, after entering the tree\
    \ code into the Python or \n\nJavaScript interactive shell, run the following:\n\
    \n\\> **root\\['children'\\]\\[1\\]\\['data'\\]**\n\n'C'\n\n\\> **root\\['children'\\\
    ]\\[1\\]\\['children'\\]\\[0\\]\\['data'\\]**\n\n'E'\n\nOur tree traversal code\
    \ can be written as a recursive function because \n\ntree data structures have\
    \ a self-similar structure: a parent node has child \n\nnodes, and each child\
    \ node is the parent node of its own children. Tree tra­\n\nversal algorithms\
    \ ensure that your programs can access or modify the data \n\nin every node in\
    \ the tree no matter its shape or size.\n\nLet’s ask the three questions about\
    \ recursive algorithms for our tree \n\ntraversal code:\n\n**What is the base\
    \ case?    ** A leaf node, which has no more children and \n\nrequires no more\
    \ recursive calls, causing the algorithm to backtrack to \n\na previous parent\
    \ node.\n\n**What argument is passed to the recursive function call?    ** The\
    \ node \n\nto traverse to, whose child nodes will be the next nodes to traverse.\n\
    \n**How does this argument become closer to the base case?   ** There are \n\n\
    no cycles in a DAG, so following the descendent nodes will always even­\n\ntually\
    \ reach a leaf node.\n\nThe Recursive Book of Recursion (Early Access) © 2022\
    \ by Al Sweigart"
