  md: "**40**   Chapter 2\n\nthe tree is analogous to the first call to a recursive\
    \ function, the branching \n\npoints are analogous to recursive cases, and the\
    \ leaves are analogous to the \n\nbase cases where no more recursive calls are\
    \ made.\n\nA maze is also a good example of a problem that has a tree-like struc­\n\
    \nture and requires backtracking. In a maze, the branching points occur \n\nwherever\
    \ you must pick one of many paths to follow. If you reach a dead \n\nend, you’ve\
    \ encountered the base case. You must then backtrack to a previ­\n\nous branching\
    \ point to select a different path to follow. \n\nFigure 2-5 shows a maze’s path\
    \ visually morphed to look like a biologi­\n\ncal tree. Despite the visual difference\
    \ between the maze paths and the tree-\n\nshaped paths, their branching points\
    \ are related to each other in the same \n\nway. Mathematically, these graphs\
    \ are equivalent. \n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_65_0.png)\n\nEnd\n\
    \nStart\n\nEnd\n\nStart\n\n*Figure 2-5: A maze (left) along with its interior\
    \ paths (center) morphed to match a biologi­*\n\n*cal tree’s shape (right)*\n\n\
    Many programming problems have this tree-like structure at their core. \n\nFor\
    \ example, a filesystem has a tree-like structure; the subfolders look like \n\
