    \ in the *mergeSort.py* Python program \n\nsorts the values in the items list\
    \ into ascending order:\n\nimport math\n\ndef mergeSort(items):\n\n print('.....mergeSort()\
    \ called on:', items)\n\n # BASE CASE - Zero or one items are naturally sorted:\n\
    \n if len(items) == 0 or len(items) == 1:\n\n return items 1\n\n # RECURSIVE CASE\
    \ - Pass the left and right halves to mergeSort():\n\n # Round down if items doesn't\
    \ divide in half evenly:\n\n iMiddle = math.floor(len(items) / 2) 2\n\n print('................Split\
    \ into:', items\\[:iMiddle\\], 'and', items\\[iMiddle:\\])\n\n left = mergeSort(items\\\
    [:iMiddle\\]) 3\n\n right = mergeSort(items\\[iMiddle:\\])\n\n # BASE CASE - Returned\
    \ merged, sorted data:\n\n # At this point, left should be sorted and right should\
    \ be\n\n # sorted. We can merge them into a single sorted list.\n\n sortedResult\
    \ = \\[\\]\n\n iLeft = 0\n\n iRight = 0\n\n while (len(sortedResult) < len(items)):\n\
    \n # Append the smaller value to sortedResult.\n\n if left\\[iLeft\\] < right\\\
    [iRight\\]: 4\n\n sortedResult.append(left\\[iLeft\\])\n\n iLeft += 1\n\n else:\n\
    \n sortedResult.append(right\\[iRight\\])\n\n iRight += 1\n\n # If one of the\
    \ pointers has reached the end of its list,\n\n # put the rest of the other list\
    \ into sortedResult.\n\n if iLeft == len(left):\n\n sortedResult.extend(right\\\
    [iRight:\\])\n\n break\n\n elif iRight == len(right):\n\n sortedResult.extend(left\\\
    [iLeft:\\])\n\n break\n\n print('The two halves merged into:', sortedResult)\n\
    \n return sortedResult # Returns a sorted version of items.\n\nmyList = \\[2,\
    \ 9, 8, 5, 3, 4, 7, 6\\]\n\nmyList = mergeSort(myList)\n\nprint(myList)\n\nThe\
