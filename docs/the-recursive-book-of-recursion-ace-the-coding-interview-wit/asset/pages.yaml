  md: "**278**   Chapter 13\n\n***Snowflake***\n\nThe final fractal, *Snowflake*,\
    \ is composed of squares laid out in a pentagon \n\npattern. This is similar to\
    \ the Four Corners fractal, but it uses five evenly \n\nspaced recursive squares\
    \ instead of four:\n\n*Python*\n\nelif DRAW\\_FRACTAL == 9:\n\n # Snowflake:\n\
    \n drawFractal(drawFilledSquare, 200,\n\n \\[{'xChange': math.cos(0 \\* math.pi\
    \ / 180),\n\n 'yChange': math.sin(0 \\* math.pi / 180), 'sizeChange': 0.4},\n\n\
    \ {'xChange': math.cos(72 \\* math.pi / 180),\n\n 'yChange': math.sin(72 \\* math.pi\
    \ / 180), 'sizeChange': 0.4},\n\n {'xChange': math.cos(144 \\* math.pi / 180),\n\
    \n 'yChange': math.sin(144 \\* math.pi / 180), 'sizeChange': 0.4},\n\n {'xChange':\
    \ math.cos(216 \\* math.pi / 180),\n\n 'yChange': math.sin(216 \\* math.pi / 180),\
    \ 'sizeChange': 0.4},\n\n {'xChange': math.cos(288 \\* math.pi / 180),\n\n 'yChange':\
    \ math.sin(288 \\* math.pi / 180), 'sizeChange': 0.4}\\])\n\nThis fractal uses\
    \ the cosine and sine functions from trigonometry, imple­\n\nmented in Python’s\
    \ math.cos() and math.sin() functions, to determine how to \n\nshift the squares\
    \ along the x-axis and y-axis. A full circle has 360 degrees, so \n\nto evenly\
    \ space out the five recursive squares in this circle, we place them at \n\nintervals\
    \ of 0, 72, 144, 216, and 288 degrees. The math.cos() and math.sin() \n\nfunctions\
    \ expect the angle argument to be in radians instead of degrees, so \n\nwe must\
    \ multiply these numbers by math.pi / 180.\n\nThe end result is that each square\
    \ is surrounded by five other squares, \n\nwhich are surrounded by five other\
    \ squares, and so on, to form a crystal-like \n\nfractal that resembles a snowflake.\n\
    \n***Producing a Single Square or Triangle***\n\nFor completion, you can also\
    \ set DRAW\\_FRACTAL to 10 or 11 to view what a single \n\ncall to drawFilledSquare()\
    \ and drawTriangleOutline() produce in the turtle win­\n\ndow. These shapes are\
    \ drawn with a size of 600:\n\n*Python*\n\nelif DRAW\\_FRACTAL == 10:\n\n # The\
    \ filled square shape:\n\n turtle.tracer(1, 0)\n\n drawFilledSquare(400, 0)\n\n\
    elif DRAW\\_FRACTAL == 11:\n\n # The triangle outline shape:\n\n turtle.tracer(1,\
    \ 0)\n\n drawTriangleOutline(400, 0)\n\nturtle.exitonclick() # Click the window\
    \ to exit.\n\nAfter drawing the fractal or shape based on the value in DRAW\\\
    _FRACTAL, \n\nthe program calls turtle.exitonclick() so the turtle window stays\
    \ open until \n\nthe user clicks it. Then the program terminates.\n\nThe Recursive\
    \ Book of Recursion (Early Access) © 2022 by Al Sweigart"
