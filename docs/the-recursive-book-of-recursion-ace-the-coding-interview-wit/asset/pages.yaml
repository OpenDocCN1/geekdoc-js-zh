  md: "**254**   Chapter 12\n\n undoMove(board, move) # Reset to the original puzzle.\n\
    \n return True\n\nThe JavaScript code is as follows:\n\n*JavaScript*\n\n // RECURSIVE\
    \ CASE - Attempt each of the valid moves:\n\n for (let move of getValidMoves(board,\
    \ prevMove)) {\n\n // Make the move:\n\n makeMove(board, move);\n\n movesMade.push(move);\n\
    \n if (attemptMove(board, movesMade, movesRemaining - 1, move)) {\n\n // If the\
    \ puzzle is solved, return True:\n\n undoMove(board, move); // Reset to the original\
    \ puzzle.\n\n return true;\n\n }\n\nThe for loop sets the move variable to each\
    \ of the directions returned \n\nby getValidMoves(). For each move, we call makeMove()\
    \ to modify the board \n\ndata structure with the move and to add the move to\
    \ the list or array in \n\nmovesMade. \n\nNext, the code recursively calls attemptMove()\
    \ to explore the range of \n\nall possible future moves within the depth set by\
    \ movesRemaining. The board \n\nand movesMade variables are forwarded to this\
    \ recursive call. The code sets \n\nthe recursive call’s movesRemaining parameter\
    \ to movesRemaining - 1 so that it \n\ndecreases by one. It also sets the prevMode\
    \ parameter to move so that it doesn’t \n\nimmediately undo the move just made.\n\
    \nIf the recursive call returns True, a solution exists and is recorded in \n\n\
    the movesMade list or array. We call the undoMove() function so that board will\
    \ \n\ncontain the original puzzle after the execution returns to solve() and then\
    \ \n\nreturn True to indicate a solution has been found.\n\nThe Python code for\
    \ attemptMove() continues as follows:\n\n*Python*\n\n # Undo the move to set up\
    \ for the next move:\n\n undoMove(board, move)\n\n movesMade.pop() # Remove the\
    \ last move since it was undone.\n\n return False # BASE CASE - Unable to find\
    \ a solution.\n\nThe JavaScript code is as follows:\n\n*JavaScript*\n\n // Undo\
    \ the move to set up for the next move:\n\n undoMove(board, move);\n\n movesMade.pop();\
    \ // Remove the last move since it was undone.\n\n }\n\n return false; // BASE\
    \ CASE - Unable to find a solution.\n\n}\n\nIf attemptMove() returns False, no\
    \ solution is found. In that case, we call \n\nundoMove() and remove the latest\
    \ move from the movesMade list or array.\n\nThe Recursive Book of Recursion (Early\
    \ Access) © 2022 by Al Sweigart"
