  md: "**268**   Chapter 13\n\n***The drawTriangleOutline() Function***\n\nThe second\
    \ shape-drawing function draws the outline of an equilateral tri­\n\nangle whose\
    \ sides have a length of size. The function draws the triangle ori­\n\nented with\
    \ one corner at the top and two corners at the bottom. Figure 13-6 \n\nillustrates\
    \ the various dimensions of an equilateral triangle.\n\n60°\n\n60°\n\n60°\n\n\
    size\n\n2/3 \\* height\n\nheight = size \\* math.sqrt(3) / 2\n\n1/3 \\* height\n\
    \n*Figure 13-6: The measurements of an equilateral triangle with sides t *\n\n\
    *he length of **size*\n\nBefore we begin drawing, we must determine the triangle’s\
    \ height \n\nbased on the length of its sides. Geometry tells us that, for equilateral\
    \ trian­\n\ngles with sides of length *L*, the height *h* of the triangle is *L*\
    \ times the square \n\nroot of 3 divided by 2. In our function, *L* corresponds\
    \ to the size parameter, \n\nso our code sets the height variable as follows:\n\
    \nheight = size \\* math.sqrt(3) / 2\n\nGeometry also tells us that the center\
    \ of the triangle is one-third of \n\nthe height from the bottom side and two-thirds\
    \ of the height from the top \n\npoint. This gives us the information we need\
    \ to move the turtle to its start­\n\ning position:\n\n*Python*\n\ndef drawTriangleOutline(size,\
    \ depth):\n\n size = int(size)\n\n # Move the turtle to the top of the equilateral\
    \ triangle:\n\n height = size \\* math.sqrt(3) / 2\n\n turtle.penup()\n\n turtle.left(90)\
    \ # Turn to face upwards.\n\n turtle.forward(height \\* (2/3)) # Move to the top\
    \ corner.\n\n turtle.right(150) # Turn to face the bottom-right corner.\n\n turtle.pendown()\n\
    \nTo reach the top corner, we turn the turtle 90 degrees left to face up \n\n\
    (relative to the turtle’s original heading right at 0 degrees) and then move \n\
    \nforward a number of units equal to height \\* (2/3). The turtle is still fac­\n\
    \ning up, so to begin drawing the line on the right side, the turtle must turn\
    \ \n\n90 degrees right to face rightward, then an additional 60 degrees to face\
    \ \n\nthe bottom-right corner of the triangle. This is why we call turtle.right(150).\n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
