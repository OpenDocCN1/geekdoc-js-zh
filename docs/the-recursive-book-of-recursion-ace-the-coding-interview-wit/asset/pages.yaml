  md: "**166**   Chapter 8\n\nas a workaround for tail recursion’s inability to use\
    \ local variables after the \n\nfinal recursive call. Notice that in *factorialByRecursion.py*’s\
    \ factorial() func­\n\ntion, the recursive case was return number \\* factorial(number\
    \ - 1). The mul­\n\ntiplication happens after the factorial(number – 1) recursive\
    \ call. The accum \n\naccumulator takes the place of the number local variable.\n\
    \nAlso notice that the base case for factorial() no longer returns 1; rather,\
    \ \n\nit returns the accum accumulator. By the time factorial() is called with\
    \ num­\n\nber == 1 and the base case is reached, accum stores the final result\
    \ to return. \n\nAdjusting your code to use tail call optimization often involves\
    \ changing \n\nthe base case to return the accumulator’s value.\n\nYou can think\
    \ of the factorial(5) function call as transforming into the \n\nfollowing return,\
    \ as shown in Figure 8-1.\n\nfactorial(5)\n\nreturn factorial(5 – 1, 1 \\* 5)\n\
    \nreturn factorial(4 – 1, 5 \\* 4)\n\nreturn factorial(3 – 1, 20 \\* 3)\n\nreturn\
    \ factorial(2 – 1, 60 \\* 2)\n\nreturn 120\n\n*Figure 8-1: The process of transformations\
    \ *\n\n*that **factorial(5)** makes to the integer 120*\n\nRearranging your recursive\
    \ calls as the last action in the function and \n\nadding accumulators can make\
    \ your code even harder to understand than \n\ntypical recursive code. But that’s\
    \ not the only downside of tail recursion, as \n\nwe’ll see in the next section.\n\
    \n**Limitations of Tail Recursion**\n\nTail recursive functions require rearranging\
    \ their code to make them suit­\n\nable for the tail call optimization feature\
    \ of the compiler or interpreter. \n\nHowever, not all compilers and interpreters\
    \ offer tail call optimization as a \n\nfeature. Notably, CPython (the Python\
    \ interpreter downloaded from *https://*\n\n*python.org*) does not implement tail\
    \ call optimization. Even if you write your \n\nrecursive functions with the recursive\
    \ call as the last action, it will still cause \n\nstack overflows after enough\
    \ function calls are made.\n\nNot only that, but CPython will likely never have\
    \ tail call optimization \n\nas a feature. Guido van Rossum, the creator of the\
    \ Python programming \n\nlanguage, has explained that tail call optimization can\
    \ make programs \n\nharder to debug. tail call optimization removes frame objects\
    \ from the call \n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al\
    \ Sweigart"
