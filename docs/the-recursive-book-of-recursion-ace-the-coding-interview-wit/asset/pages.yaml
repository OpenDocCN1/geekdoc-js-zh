  md: "Permutations and Combinations   **127**\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_152_0.png)\n\
    \n*Figure 6-2: All six possible permutations of three wedding guests at a table*\n\
    \nOf course, to get every permutation of {B, C}, we’d recursively repeat \n\n\
    the process with B as the head and C as the tail. The permutation of a \n\nsingle\
    \ character is the character itself; this is our base case. By putting the \n\n\
    head B in every possible location in C, we get the BC and CB permutations \n\n\
    we used in the previous paragraph. Remember that, while order doesn’t \n\nmatter\
    \ with sets (as {B, C} is the same as {C, B}), it does matter with permuta­\n\n\
    tions (BC is not a duplicate of CB).\n\nOur recursive permutation function accepts\
    \ as an argument a string \n\nof characters and returns an array of strings of\
    \ every possible permutation \n\nof those characters. Let’s ask the three questions\
    \ about our recursive algo­\n\nrithms for this function:\n\n**What is the base\
    \ case?   ** An argument of a single character string or \n\nempty string, which\
    \ returns an array of just that string.\n\n**What argument is passed to the recursive\
    \ function call?   ** The string \n\nargument missing one character. A separate\
    \ recursive call is made for \n\neach character missing.\n\n**How does this argument\
    \ become closer to the base case?   ** The size of \n\nthe string shrinks and\
    \ eventually becomes a single-character string.\n\nThe recursive permutations\
    \ algorithm is implemented in *permutations.py*:\n\ndef getPerms(chars, indent=0):\n\
    \n print('.' \\* indent + 'Start of getPerms(\"' + chars + '\")')\n\n if len(chars)\
    \ == 1: 1\n\n # BASE CASE\n\n print('.' \\* indent + 'When chars = \"' + chars\
    \ + '\" base case returns', chars)\n\n return \\[chars\\]\n\nThe Recursive Book\
    \ of Recursion (Early Access) © 2022 by Al Sweigart"
