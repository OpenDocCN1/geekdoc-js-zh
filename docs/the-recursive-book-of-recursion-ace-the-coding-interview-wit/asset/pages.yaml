    `.\n\n let bx, by;\n\n \\[bx, by\\] = findBlankSpace(board);\n\n let blankIndex\
    \ = by \\* SIZE + bx;\n\n let tileIndex;\n\n if (move === UP) {\n\n tileIndex\
    \ = (by + 1) \\* SIZE + bx;\n\n } else if (move === LEFT) {\n\n tileIndex = by\
    \ \\* SIZE + (bx + 1);\n\n } else if (move === DOWN) {\n\n tileIndex = (by - 1)\
    \ \\* SIZE + bx;\n\n } else if (move === RIGHT) {\n\n tileIndex = by \\* SIZE\
    \ + (bx - 1);\n\n }\n\n // Swap the tiles at blankIndex and tileIndex:\n\n \\\
    [board\\[blankIndex\\], board\\[tileIndex\\]\\] = \\[board\\[tileIndex\\], board\\\
    [blankIndex\\]\\];\n\n}\n\nThe if statements determine the index of the tile to\
