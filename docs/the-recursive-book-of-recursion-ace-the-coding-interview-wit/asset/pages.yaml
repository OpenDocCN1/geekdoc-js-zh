    \ + \n\n \" part 2, get sets with head '\" + head + \"'<br />\");\n\n for (tailSet\
    \ of tailPowerSet) {\n\n document.write(debugMsg + \" New set \" + head + tailSet\
    \ + \"<br />\");\n\n powerSet.push(head + tailSet); 3\n\n }\n\n powerSet = powerSet.concat(tailPowerSet);\n\
    \n document.write(debugMsg + \" returning \" + powerSet + \"<br />\");\n\n return\
    \ powerSet; 4\n\n}\n\ndocument.write(\"<pre>The power set of ABC:<br />\")\n\n\
    document.write(getPowerSet(\"ABC\") + \"<br /></pre>\");\n\n</script>\n\nThe programs\
    \ output the following:\n\nThe power set of ABC:\n\nIn getPowerSet(\"ABC\"), start.\n\
    \nIn getPowerSet(\"ABC\") part 1, get sets without head 'A'\n\n.In getPowerSet(\"\
    BC\"), start.\n\n.In getPowerSet(\"BC\") part 1, get sets without head 'B'\n\n\
    ..In getPowerSet(\"C\"), start.\n\n..In getPowerSet(\"C\") part 1, get sets without\
    \ head 'C'\n\n...In getPowerSet(\"\"), start.\n\n...In getPowerSet(\"\") base\
    \ case returns \\[''\\]\n\n..In getPowerSet(\"C\") part 2, get sets with head\
    \ 'C'\n\n..In getPowerSet(\"C\") New set C\n\n..In getPowerSet(\"C\") returning\
    \ \\['C', ''\\]\n\n.In getPowerSet(\"BC\") part 2, get sets with head 'B'\n\n\
    .In getPowerSet(\"BC\") New set BC\n\n.In getPowerSet(\"BC\") New set B\n\n.In\
    \ getPowerSet(\"BC\") returning \\['BC', 'B', 'C', ''\\]\n\nIn getPowerSet(\"\
    ABC\") part 2, get sets with head 'A'\n\nIn getPowerSet(\"ABC\") New set ABC\n\
    \nIn getPowerSet(\"ABC\") New set AB\n\nIn getPowerSet(\"ABC\") New set AC\n\n\
    In getPowerSet(\"ABC\") New set A\n\nIn getPowerSet(\"ABC\") returning \\['ABC',\
    \ 'AB', 'AC', 'A', 'BC', 'B', 'C', ''\\]\n\n\\['ABC', 'AB', 'AC', 'A', 'BC', 'B',\
    \ 'C', ''\\]\n\nThe getPowerSet() function accepts a single argument: the string\
    \ chars, \n\nwhich contains the characters of the original set. The base case\
    \ occurs \n\nwhen chars is the blank string 1, representing an empty set. Recall\
    \ that the \n\npower set is the set of all subsets of the original set. Thus,\
    \ the power set of \n\nthe empty set is simply a set containing the empty set,\
    \ since the empty set is \n\nthe only subset of the empty set. This is why the\
    \ base case returns \\[''\\].\n\nThe Recursive Book of Recursion (Early Access)\
    \ © 2022 by Al Sweigart"
