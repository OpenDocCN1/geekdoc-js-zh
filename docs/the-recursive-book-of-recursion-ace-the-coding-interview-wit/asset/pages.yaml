  md: "**12**   Chapter 1\n\nAs you can see, programming languages can have separate\
    \ local vari­\n\nables with the same name (spam) because they are kept in separate\
    \ frame \n\nobjects. When a local variable is used in the source code, the variable\
    \ with \n\nthat name in the topmost frame object is used.\n\nEvery running program\
    \ has a call stack, and multithreaded programs \n\nhave one call stack for each\
    \ thread. But when you look at the source code \n\nfor a program, you can’t see\
    \ the call stack in the code. The call stack isn’t \n\nstored in a variable as\
    \ other data structures are; it’s automatically handled \n\nin the background.\
    \ \n\nThe fact that the call stack doesn’t exist in source code is the main rea­\n\
    \nson recursion is so confusing to beginners: recursion relies on something \n\
    \nthe programmer can’t even see! Revealing how stack data structures and \n\n\
    the call stack work removes much of mystery behind recursion. Functions \n\nand\
    \ stacks are both simple concepts, and we can use them together to \n\nunderstand\
    \ how recursion works.\n\n**What Are Recursive Functions and Stack Overflows?**\n\
    \nA *recursive function* is a function that calls itself. This *shortest.py* program\
    \ is \n\nthe shortest possible example of a recursive function:\n\n*Python*\n\n\
    def shortest():\n\n shortest()\n\nshortest()\n\nThe preceding program is equivalent\
    \ to this *shortest.html* program:\n\n*JavaScript*\n\n<script type=\"text/javascript\"\
    >\n\nfunction shortest() {\n\n shortest();\n\n}\n\nshortest();\n\n</script>\n\n\
    The shortest() function does nothing but call the shortest() function. \n\nWhen\
    \ this happens, it calls the shortest() function again, and that will call \n\n\
    shortest(), and so on seemingly forever. It is similar to the mythological idea\
    \ \n\nthat the crust of the Earth rests on the back of a giant space turtle, which\
    \ \n\nrests on the back of another turtle. Beneath that turtle: another turtle.\
    \ And \n\nso on, forever.\n\nBut this “turtles all the way down” theory doesn’t\
    \ do a good job of \n\nexplaining cosmology, nor recursive functions. Since the\
    \ call stack uses the \n\ncomputer’s finite memory, this program cannot continue\
    \ forever, the way \n\nan infinite loop does. The only thing this program does\
    \ is crash and display \n\nan error message.\n\n**N O T E**\n\n*To view the JavaScript\
    \ error, you must open the *browser developer tools*. On most *\n\n*browsers,\
    \ this is done by pressing ****F12**** and then selecting the Console tab.*\n\n\
    The Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
