  md: "Drawing Fractals   **185**\n\n # Move into position.\n\n turtle.penup()\n\n\
    \ turtle.goto(x + oneThirdWidth, y + oneThirdHeight)\n\n # Draw the inner rectangle.\n\
    \n if DRAW\\_SOLID:\n\n turtle.fillcolor('white')\n\n turtle.begin\\_fill()\n\n\
    \ turtle.pendown()\n\n turtle.goto(x + oneThirdWidth, y + twoThirdsHeight)\n\n\
    \ turtle.goto(x + twoThirdsWidth, y + twoThirdsHeight)\n\n turtle.goto(x + twoThirdsWidth,\
    \ y + oneThirdHeight)\n\n turtle.goto(x + oneThirdWidth, y + oneThirdHeight)\n\
    \n turtle.penup()\n\n if DRAW\\_SOLID:\n\n turtle.end\\_fill()\n\n # Draw the\
    \ inner rectangles across the top.\n\n drawInnerRectangle(x, y + twoThirdsHeight,\
    \ oneThirdWidth, oneThirdHeight)\n\n drawInnerRectangle(x + oneThirdWidth, y +\
    \ twoThirdsHeight, oneThirdWidth, \n\noneThirdHeight)\n\n drawInnerRectangle(x\
    \ + twoThirdsWidth, y + twoThirdsHeight, oneThirdWidth, \n\noneThirdHeight)\n\n\
    \ # Draw the inner rectangles across the middle.\n\n drawInnerRectangle(x, y +\
    \ oneThirdHeight, oneThirdWidth, \n\n oneThirdHeight)\n\n drawInnerRectangle(x\
    \ + twoThirdsWidth, y + oneThirdHeight, oneThirdWidth, \n\n oneThirdHeight)\n\n\
    \ # Draw the inner rectangles across the bottom.\n\n drawInnerRectangle(x, y,\
    \ oneThirdWidth, oneThirdHeight)\n\n drawInnerRectangle(x + oneThirdWidth, y,\
    \ oneThirdWidth, oneThirdHeight)\n\n drawInnerRectangle(x + twoThirdsWidth, y,\
    \ oneThirdWidth, \n\n oneThirdHeight)\n\ndrawCarpet(50, 50, 600, 600)\n\nturtle.exitonclick()\n\
    \nYou can also set the DRAW\\_SOLID constant to False and run the program. \n\n\
    This will skip the calls to turtle.begin\\_fill() and turtle.end\\_fill() so that\
    \ \n\nonly the outlines of the rectangles are drawn, as in Figure 9-9.\n\nTry\
    \ passing different arguments to drawCarpet(). The first two argu­\n\nments are\
    \ the x, y coordinates of the lower-left corner of the carpet, while \n\nthe latter\
    \ two arguments are the width and height. You can also change the \n\nMIN\\_SIZE\
    \ constant to a larger value to make the program reach the base case \n\nsooner\
    \ and reduce the number of rectangles drawn.\n\nThe Recursive Book of Recursion\
    \ (Early Access) © 2022 by Al Sweigart"
