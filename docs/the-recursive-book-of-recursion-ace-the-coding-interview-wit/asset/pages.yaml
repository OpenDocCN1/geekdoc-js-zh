  md: "Tail Call Optimization   **167**\n\nstack, which in turn removes the debugging\
    \ information that frame objects \n\ncan provide. He also points out that once\
    \ tail call optimization is imple­\n\nmented, Python programmers will begin to\
    \ write code that depends on the \n\nfeature, and their code won’t run on non-CPython\
    \ interpreters that don’t \n\nimplement tail call optimization. \n\nFinally, and\
    \ I concur, van Rossum disagrees with the idea that recursion \n\nis a fundamentally\
    \ important part of day-to-day programming. Computer \n\nscientists and mathematicians\
    \ tend to place recursion on a pedestal. But \n\ntail call optimization is simply\
    \ a workaround hack to make some recursive \n\nalgorithms actually workable rather\
    \ than simply crash with a stack overflow.\n\nWhile CPython doesn’t feature tail\
    \ call optimization, this doesn’t mean \n\nanother compiler or interpreter that\
    \ implements the Python language \n\ncouldn’t have tail call optimization. Unless\
    \ tail call optimization is explicitly \n\na part of a programming language specification,\
    \ tail call optimization is \n\nnot a feature of a programming language but rather\
    \ of individual compil­\n\ners or interpreters of a programming language.\n\n\
    The lack of tail call optimization is not unique to Python. The Java \n\ncompiler\
    \ since version 8 also doesn’t support tail call optimization. Tail \n\ncall optimization\
    \ is a part of the ECMAScript 6 version of JavaScript; how­\n\never, as of 2022,\
    \ only the Safari web browser’s implementation of JavaScript \n\nactually supports\
    \ it. One way to determine whether your programming \n\nlanguage’s compiler or\
    \ interpreter implements this feature is to write a tail \n\nrecursive factorial\
    \ function and try to calculate the factorial of 100,000. If \n\nthe program crashes,\
    \ tail call optimization is not implemented.\n\nPersonally, I take the stance\
    \ that the tail recursion technique should \n\nnever be used. As stated in Chapter 2,\
    \ any recursive algorithm can be \n\nimplemented with a loop and a stack. Tail\
    \ call optimization prevents stack \n\noverflows by effectively removing the use\
    \ of the call stack. Therefore, all tail \n\nrecursive algorithms can be implemented\
    \ with a loop alone. Since the code \n\nfor loops is much simpler than a recursive\
    \ function, a loop should be used \n\nwherever tail call optimization could be\
    \ employed.\n\nAdditionally, potential problems exist even if tail call optimization\
    \ is \n\nimplemented. Since tail recursion is possible only when the last action\
    \ of a \n\nfunction is returning the recursive call’s return value, it’s impossible\
    \ to do \n\ntail recursion for algorithms that require two or more recursive calls.\
    \ For \n\nexample, take the Fibonacci sequence algorithm calls fibonacci(n – 1)\
    \ and \n\nfibonacci(n – 2). While tail call optimization can be performed for\
    \ the lat­\n\nter recursive call, the first recursive call will cause a stack\
    \ overflow for large-\n\nenough arguments.\n\n**Tail Recursion Case Studies**\n\
    \nLet’s examine some of the recursive functions demonstrated earlier in this \n\
    \nbook to see if they are good candidates for tail recursion. Keep in mind \n\n\
    that because Python and JavaScript do not actually implement tail call opti­\n\
    \nmization, these tail recursive functions will still result in a stack overflow\
    \ \n\nerror. These case studies are for demonstration purposes only.\n\nThe Recursive\
    \ Book of Recursion (Early Access) © 2022 by Al Sweigart"
