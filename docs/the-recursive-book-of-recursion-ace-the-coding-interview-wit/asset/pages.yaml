  md: "**22**   Chapter 2\n\n**Calculating Factorials**\n\nMany computer science courses\
    \ use factorial calculation as a classic example \n\nof a recursive function.\
    \ The factorial of an integer (let’s call it *n*) is the prod­\n\nuct of all integers\
    \ from 1 to *n*. For example, the factorial of 4 is 4 × 3 × 2 × 1, \n\nor 24.\
    \ An exclamation mark is the math notation for factorials: 4! means *the *\n\n\
    *factorial of 4*. Table 2-1 shows the first few factorials.\n\nTable 2-1: Factorials\
    \ of the First Few Integers\n\nn!\n\nExpanded form\n\nProduct\n\n1!\n\n\\=\n\n\
    1\n\n\\=\n\n1\n\n2!\n\n\\=\n\n1 × 2\n\n\\=\n\n2\n\n3!\n\n\\=\n\n1 × 2 × 3\n\n\\\
    =\n\n6\n\n4!\n\n\\=\n\n1 × 2 × 3 × 4\n\n\\=\n\n24\n\n5!\n\n\\=\n\n1 × 2 × 3 ×\
    \ 4 × 5\n\n\\=\n\n120\n\n6!\n\n\\=\n\n1 × 2 × 3 × 4 × 5 × 6\n\n\\=\n\n720\n\n\
    7!\n\n\\=\n\n1 × 2 × 3 × 4 × 5 × 6 × 7\n\n\\=\n\n5,040\n\n8!\n\n\\=\n\n1 × 2 ×\
    \ 3 × 4 × 5 × 6 × 7× 8\n\n\\=\n\n40,320\n\nFactorials are used in all sorts of\
    \ calculations—for example, finding the \n\nnumber of permutations for something.\
    \ If you want to know the number \n\nof ways that exist to order four people—Alice,\
    \ Bob, Carol, and David—in \n\na line, the answer is the factorial of 4. Four\
    \ possible people can be first in \n\nline (4); then for each of those four options,\
    \ three remaining people can be \n\nsecond in line (4 × 3); then two people can\
    \ be third in line (4 × 3 × 2); and \n\nthe last person left will be fourth in\
    \ line (4 × 3 × 2 × 1). The number of ways \n\npeople can be ordered in line—that\
    \ is, the number of permutations—is the \n\nfactorial of the number of people.\n\
    \nLet’s examine an iterative and recursive approach to calculating \n\nfactorials.\n\
    \n***The Iterative Factorial Algorithm***\n\nCalculating factorials iteratively\
    \ is fairly straightforward: multiply the inte­\n\ngers 1 up to and including\
    \ *n* in a loop. *Iterative* algorithms always use a loop. \n\nA *factorialByIteration.py*\
    \ program looks like this:\n\n*Python*\n\ndef factorial(number):\n\n product =\
    \ 1\n\n for i in range(1, number + 1):\n\n product = product \\* i\n\n return\
    \ product\n\nprint(factorial(5))\n\nThe Recursive Book of Recursion (Early Access)\
    \ © 2022 by Al Sweigart"
