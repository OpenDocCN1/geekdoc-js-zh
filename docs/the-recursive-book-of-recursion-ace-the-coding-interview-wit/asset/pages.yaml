  md: "**182**   Chapter 9\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_207_0.png)\n\
    \n*Figure 9-5: A standard Sierpi**ń**ski triangle*\n\nSierpiński triangles don’t\
