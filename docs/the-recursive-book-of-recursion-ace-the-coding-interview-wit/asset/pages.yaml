  md: "**232**   Chapter 12\n\nIncidentally, mathematicians have proven that even\
    \ the hardest 15-puzzle \n\ncan be solved in 80 moves. \n\n**Solving 15-Puzzles\
    \ Recursively**\n\nThe algorithm that solves 15-puzzles is similar to the maze-solving\
    \ algo­\n\nrithm. Each state of the board (that is, one arrangement of tiles)\
    \ can be \n\nthought of as a maze intersection with four hallways to go down.\
    \ In the case \n\nof 15-puzzles, sliding a tile in one of the four directions\
    \ is like picking a \n\nhallway to follow to the next intersection.\n\nJust as\
    \ you can turn a maze into a DAG, you can convert a 15-puzzle \n\ninto a tree\
    \ graph, as in Figure 12-2. The board states are nodes with up to \n\nfour edges\
    \ (representing a direction to slide a tile) to other nodes (rep­\n\nresenting\
    \ the resulting state). The root node is the starting state of the \n\n15-puzzle.\
    \ The solved-state node is the one in which the tiles are ordered \n\ncorrectly.\
    \ The path from the root node to the solved state details the slides \n\nneeded\
    \ to solve the puzzle.\n\n15 2\n\n1 12\n\n8\n\n5\n\n6 11\n\n4\n\n9 10 7\n\n3 14\
    \ 13\n\n15 2\n\n1 12\n\n8\n\n5\n\n6 11\n\n4\n\n9 10 7\n\n3 14\n\n13\n\n15 2\n\n\
    1 12\n\n8\n\n5\n\n6 11\n\n4\n\n9\n\n7\n\n3 14 10 13\n\n15 2\n\n1 12\n\n8\n\n5\n\
    \n6 11\n\n4\n\n9 10\n\n3 14 13 7\n\n15 2\n\n1 12\n\n8\n\n5\n\n6\n\n4\n\n9 10 11\n\
    \n3 14 13 7\n\n15 2\n\n1 12\n\n8\n\n5\n\n6 11\n\n4\n\n9 10 7\n\n3\n\n14 13\n\n\
    15 2\n\n1 12\n\n8\n\n5\n\n6 11\n\n4\n\n9\n\n10\n\n3 14 13 7\n\n*Figure 12-2: The\
    \ task of solving a 15-puzzle can be represented as a graph *\n\n*with tile states\
    \ as nodes and slides as edges.*\n\nClever algorithms are available for solving\
    \ 15-puzzles, but we could also \n\njust recursively explore the entire tree graph\
    \ until we find a path from the \n\nroot node to the solution node. This puzzle’s\
    \ tree can be searched with a \n\ndepth-first search (DFS) algorithm. However,\
    \ unlike a well-connected maze, \n\nthe 15-puzzle’s tree graph is not a DAG. Rather,\
    \ the graph’s nodes are *undi­*\n\n*rected*, because you can traverse both directions\
    \ of an edge by undoing the \n\nprevious slide you made. \n\nThe Recursive Book\
    \ of Recursion (Early Access) © 2022 by Al Sweigart"
