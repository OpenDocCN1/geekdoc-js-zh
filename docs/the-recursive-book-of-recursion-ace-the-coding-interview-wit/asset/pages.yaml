    \nWhen you run this code, the output looks like this:\n\nspam is Ant\n\nspam is\
    \ Bobcat\n\nspam is Coyote\n\nspam is Bobcat\n\nspam is Ant\n\nWhen the program\
    \ calls function a() 7, a frame object is created and \n\nplaced on the top of\
    \ the call stack. This frame stores any arguments passed \n\nto a() (in this case,\
    \ there are none), along with the local variable spam 1 \n\nand the place where\
    \ the execution should go when the a() function returns.\n\nWhen a() is called,\
    \ it displays the contents of its local spam variable, \n\nwhich is Ant 2. When\
    \ the code in a() calls function b() 3, a new frame \n\nobject is created and\
    \ placed on the call stack above the frame object for \n\na(). The b() function\
    \ has its own local spam variable 4, and calls c() 5. A \n\nnew frame object for\
    \ the c() call is created and placed on the call stack, \n\nand it contains c()’s\
    \ local spam variable 6. As these functions return, the \n\nframe objects pop\
    \ off the call stack. The program execution knows where \n\nto return to, because\
    \ that return information is stored in the frame object. \n\nWhen the execution\
    \ has returned from all function calls, the call stack is \n\nempty.\n\nFigure 1-7\
    \ shows the state of the call stack as each function is called \n\nand returns.\
    \ Notice that all the local variables have the same name: spam. \n\nI did this\
    \ to highlight the fact that local variables are always separate vari­\n\nables\
    \ with distinct values, even if they have the same name as other local \n\nvariables.\n\
    \nEmpty\n\nc()\n\nspam =\n\n'Coyote′\n\nb()\n\nspam =\n\n'Bobcat′\n\na()\n\nspam\
    \ =\n\n'Ant′\n\nEmpty\n\na()\n\nspam =\n\n'Ant′\n\nb()\n\nspam =\n\n'Bobcat′\n\
    \n*Figure 1-7: The state of the call stack as the *localVariables* program runs*\n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
