  md: "**124**   Chapter 6\n\ncorrectly matched to closing parentheses). And finally,\
    \ we will calculate the \n\npower set of a set—that is, the set of all possible\
    \ subsets of a set.\n\nMany of the recursive functions in this chapter have an\
    \ argument \n\nnamed indent. This isn’t used by the actual recursive algorithms;\
    \ rather, it is \n\nused by their debugging output so that you can see which level\
    \ of recursion \n\nproduced the output. The indentation is increased by one space\
    \ for each \n\nrecursive call and rendered in the debugging output as periods\
    \ so that it’s \n\neasy to count the level of indentation.\n\n**The Terminology\
    \ of Set Theory**\n\nThis chapter doesn’t cover set theory as completely as a\
    \ math or computer \n\nscience textbook would. But it covers enough to justify\
    \ starting with an \n\nexplanation of the discipline’s basic terminology, as doing\
    \ so will make \n\nthe rest of this chapter easier to understand. A *set* is a\
    \ collection of unique \n\nobjects, called *elements*, or *members*. For example,\
    \ the letters *A*, *B*, and *C* form \n\na set of three letters. In mathematics\
    \ (and in Python code syntax), sets are \n\nwritten inside curly braces, with\
    \ the objects separated by commas: {A, B, C}. \n\nOrder doesn’t matter for a set;\
    \ the set {A, B, C} is the same set as {C, B, \n\nA}. Sets have distinct elements,\
    \ meaning there are no duplicates: {A, C, A, B} \n\nhas repeat *A*s and so is\
    \ not a set.\n\nA set is a *subset* of another set if it has only members of the\
    \ other set. \n\nFor example, {A, C} and {B, C} are both subsets of {A, B, C},\
    \ but {A, C, D} is \n\nnot a subset of it. Conversely, {A, B, C} is a *superset*\
    \ to {A, C} and also to {B, C} \n\nbecause it contains all of their elements.\
    \ The *empty set* {} is a set that contains \n\nno members at all. Empty sets\
    \ are considered subsets of every possible set.\n\nA subset can also include all\
    \ of the elements of the other set. For exam­\n\nple, {A, B, C} is a subset of\
    \ {A, B, C}. But a *proper subset*, or *strict subset*, is a \n\nsubset that does\
    \ not have all of the set’s elements. No set is a proper subset \n\nof itself:\
    \ so {A, B, C} is a subset but not a proper subset of {A, B, C}. All other \n\n\
    subsets are proper subsets. Figure 6-1 shows a graphical representation of \n\n\
    the set {A, B, C} and some of its subsets.\n\nB\n\nC\n\nA\n\n*Figure 6-1: The\
    \ set {A, B, C} within the *\n\n*dashed lines and some of its subsets *\n\n*{A,\
    \ B, C}, {A, C}, and {} within the *\n\n*solid lines. The circles represent sets,\
    \ *\n\n*and the letters represent elements.*\n\nA *permutation* of a set is a\
    \ specific ordering of all elements in the set. \n\nFor example, the set {A, B,\
    \ C} has six permutations: ABC, ACB, BAC, \n\nBCA, CAB, and CBA. We call these\
    \ permutations *without* *repetition*, or \n\nThe Recursive Book of Recursion\
    \ (Early Access) © 2022 by Al Sweigart"
