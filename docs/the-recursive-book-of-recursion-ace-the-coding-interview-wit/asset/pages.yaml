  md: "Maze Generator    **229**\n\nAfter setting up hasVisited to include the x,\
    \ y coordinates of 1, 1 (the \n\ntop-left corner of the maze), we call visit()\
    \ with these coordinates. This \n\nfunction call will result in all the recursive\
    \ function calls that generate the \n\nhallways of the maze. By the time this\
    \ function call returns, hasVisited will \n\ncontain every x, y coordinate of\
    \ the maze, and maze will contain the com­\n\npletely generated maze.\n\n**Summary**\n\
    \nAs you just learned, we can use recursion to not only solve mazes (by tra­\n\
    \nversing them as tree data structures) but also generate them using the \n\n\
    recursive backtracker algorithm. The algorithm “carves out” hallways in the \n\
    \nmaze, backtracking to earlier points when it encounters a dead end. Once \n\n\
    the algorithm is forced to backtrack to the starting point, the maze is com­\n\
    \npletely generated.\n\nWe can represent a well-connected maze with no loops as\
    \ a DAG—that \n\nis, a tree data structure. The recursive backtracker algorithm\
    \ makes use \n\nof the idea that recursive algorithms are well suited to problems\
    \ involving \n\ntree-like data structures and backtracking. \n\n**Further Reading**\n\
    \nWikipedia has an entry on maze generation in general, with a section on \n\n\
    the recursive backtracker algorithm, at *https://en.wikipedia.org/wiki/Maze *\n\
    \n*\\_generation\\_algorithm#Recursive\\_backtracker*. I’ve created a browser-based\
    \ ani­\n\nmation of the recursive backtracker algorithm that shows the “carving”\
    \ of \n\nhallways in action at *https://scratch.mit.edu/projects/17358777*.\n\n\
    If maze generation interests you, you should read *Mazes for Programmers: *\n\n\
    *Code Your Own Twisty Little Passages* by Jamis Buck (Pragmatic Bookshelf, 2015).\n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
