  md: "**36**   Chapter 2\n\nUsing all of this information, we can write code for\
    \ the exponentBy \n\nRecursion() function. Here is an *exponentByRecursion.py*\
    \ file with the \n\nPython code:\n\n*Python*\n\ndef exponentByRecursion(a, n):\n\
    \n if n == 1:\n\n # BASE CASE\n\n return a\n\n elif n % 2 == 0:\n\n # RECURSIVE\
    \ CASE (When n is even.)\n\n result = exponentByRecursion(a, n // 2)\n\n return\
    \ result \\* result\n\n elif n % 2 == 1:\n\n # RECURSIVE CASE (When n is odd.)\n\
    \n result = exponentByRecursion(a, n // 2)\n\n return result \\* result \\* a\n\
    \nprint(exponentByRecursion(3, 6))\n\nprint(exponentByRecursion(10, 3))\n\nprint(exponentByRecursion(17,\
    \ 10))\n\nAnd here is the equivalent JavaScript code in *exponentByRecursion.html*:\n\
