  md: "File Finder    **207**\n\nreturns the string notepad.exe. This string’s lower()\
    \ method call returns a \n\nlowercase form of the string so that we have to check\
    \ for only lowercase \n\nvowels in it. “Useful Python Standard Library Functions\
    \ for Working with \n\nFiles” on page xx explores some more functions for finding\
    \ out information \n\nabout files.\n\nWe use a return statement with a lengthy\
    \ expression that evaluates to \n\nTrue if name contains a, e, i, o, or u, indicating\
    \ the file matches the search cri­\n\nteria. Otherwise, the return statement returns\
    \ False.\n\n**The Recursive walk() Function**\n\nWhile the match functions check\
    \ whether a file matches the search criteria, \n\nthe walk() function finds all\
    \ of the files to check. The recursive walk() func­\n\ntion is passed the name\
    \ of a base folder to search along with a match func­\n\ntion to call for each\
    \ file in the folder. \n\nThe walk() function also recursively calls itself for\
    \ each subfolder in the \n\nbase folder it’s searching. These subfolders become\
    \ the base folder in the \n\nrecursive call. Let’s ask the three questions about\
    \ this recursive function:\n\n**What is the base case?   ** When the function\
    \ has finished processing \n\neach file and subfolder in its given base folder.\n\
    \n**What argument is passed to the recursive function call?   ** The base \n\n\
    folder to search and the match function to use for finding matched \n\nfiles.\
    \ For each subfolder in this folder, a recursive call is made with the \n\nsubfolder\
    \ as the new folder argument.\n\n**How does this argument become closer to the\
    \ base case?   ** Eventually, \n\nthe function either recursively calls itself\
    \ on all of the subfolders or \n\nencounters base folders that don’t have any\
    \ subfolders.\n\nFigure 10-1 shows an example filesystem along with the recursive\
    \ calls \n\nto walk(), which it makes with a base folder of C:\\\\.\n\nbacon\n\
    \nham\n\nwalk('C:\\\\\\\\', hasEvenByteSize)\n\nwalk('C:\\\\\\\\spam', hasEvenByteSize)\n\
    \nwalk('C:\\\\\\\\spam\\\\\\\\eggs', hasEvenByteSize)\n\nwalk('C:\\\\\\\\spam\\\
    \\\\\\eggs\\\\\\\\bacon', hasEvenByteSize)\n\nwalk('C:\\\\\\\\spam\\\\\\\\ham',\
    \ hasEvenByteSize)\n\nC:\\\\\n\nspam\n\neggs\n\n*Figure 10-1: An example filesystem\
    \ and the recursive **walk()** function calls over it*\n\nLet’s take a look at\
    \ the walk() function’s code:\n\ndef walk(folder, matchFunc):\n\n \"\"\"Calls\
    \ the match function with every file in the folder and its\n\n subfolders. Returns\
    \ a list of files that the match function\n\n returned True for.\"\"\"\n\n matchedFiles\
    \ = \\[\\] # This list holds all the matches.\n\n folder = os.path.abspath(folder)\
    \ # Use the folder's absolute path.\n\nThe Recursive Book of Recursion (Early\
    \ Access) © 2022 by Al Sweigart"
