  md: "**212**   Chapter 10\n\nFinally, the time.time() function returns the number\
    \ of seconds since \n\nthe Unix epoch to the current time.\n\n***Modifying Your\
    \ Files***\n\nAfter the walk() function returns a list of files matching your\
    \ search criteria, \n\nyou may want to rename, delete, or perform another operation\
    \ on them. \n\nThe shutil and os modules in the Python standard library have functions\
    \ \n\nto do this. Further, the send2trash third-party module can also send files\
    \ to \n\nyour operating system’s Recycle Bin rather than permanently delete them.\n\
    \nTo move a file, call the shutil.move() function with two arguments. The \n\n\
    first argument is the file to move, and the second is the folder to move it to.\
    \ \n\nFor example, you could call the following:\n\n*Python*\n\n\\> **import shutil**\n\
    \n\\> **shutil.move('spam.txt', 'someFolder')**\n\n'someFolder\\\\\\\\spam.txt'\n\
    \nThe shutil.move() function returns the string of the new file path of \n\nthe\
    \ file. You can also specify a filename to move and rename the file at the \n\n\
    same time:\n\n*Python*\n\n\\> **import shutil**\n\n\\> **shutil.move('spam.txt',\
    \ 'someFolder\\\\\\\\newName.txt')**\n\n'someFolder\\\\\\\\newName.txt'\n\nIf\
    \ the second argument lacks a folder, you can just specify a new name \n\nfor\
    \ the file to rename it in its current folder:\n\n*Python*\n\n\\> **import shutil**\n\
    \n\\> **shutil.move('spam.txt', 'newName.txt')**\n\n'newName.txt'\n\nNote that\
    \ the shutil.move() function both moves and renames files, simi­\n\nlar to the\
    \ way the Unix and macOS mv command both moves and renames \n\nfiles. There is\
    \ no separate shutil.rename() function.\n\nTo copy a file, call the shutil.copy()\
    \ function with two arguments. The \n\nfirst argument is the filename of the file\
    \ to copy, and the second argument \n\nis the new name of the copy. For example,\
    \ you could call the following:\n\n*Python*\n\n\\> **import shutil**\n\n\\> **shutil.copy('spam.txt',\
    \ 'spam-copy.txt')**\n\n'spam-copy.txt'\n\nThe shutil.copy() function returns\
    \ the name of the copy. To delete a \n\nfile, call the os.unlink() function and\
    \ pass it the name of the file to delete:\n\n*Python*\n\n\\> **import os**\n\n\
    \\> **os.unlink('spam.txt')**\n\n\\>\n\nThe Recursive Book of Recursion (Early\
    \ Access) © 2022 by Al Sweigart"
