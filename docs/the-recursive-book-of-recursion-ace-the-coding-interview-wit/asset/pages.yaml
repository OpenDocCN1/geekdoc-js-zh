  md: "Permutations and Combinations   **137**\n\nThe Python code for generating combinations\
    \ is in *combinations.py*:\n\n*Python*\n\ndef getCombos(chars, k, indent=0):\n\
    \n debugMsg = '.' \\* indent + \"In getCombos('\" + chars + \"', \" + str(k) +\
    \ \")\"\n\n print(debugMsg + ', start.')\n\n if k == 0:\n\n # BASE CASE\n\n print(debugMsg\
    \ + \" base case returns \\[''\\]\")\n\n # If k asks for 0-combinations, return\
    \ '' as the selection of\n\n # zero letters from chars.\n\n return \\[''\\]\n\n\
    \ elif chars == '':\n\n # BASE CASE\n\n print(debugMsg + ' base case returns \\\
    [\\]')\n\n return \\[\\] # A blank chars has no combinations, no matter what k\
    \ is.\n\n # RECURSIVE CASE\n\n combinations = \\[\\]\n\n 1 # First part, get the\
    \ combos that include the head:\n\n head = chars\\[:1\\]\n\n tail = chars\\[1:\\\
    ]\n\n print(debugMsg + \" part 1, get combos with head '\" + head + \"'\")\n\n\
    \ 2 tailCombos = getCombos(tail, k - 1, indent + 1)\n\n print('.' \\* indent +\
    \ \"Adding head '\" + head + \"' to tail combos:\")\n\n for tailCombo in tailCombos:\n\
    \n print('.' \\* indent + 'New combination', head + tailCombo)\n\n combinations.append(head\
    \ + tailCombo)\n\n 3 # Second part, get the combos that don't include the head:\n\
    \n print(debugMsg + \" part 2, get combos without head '\" + head + \"')\")\n\n\
    \ 4 combinations.extend(getCombos(tail, k, indent + 1))\n\n print(debugMsg + '\
    \ results are', combinations)\n\n return combinations\n\nprint('2-combinations\
    \ of \"ABC\":')\n\nprint('Results:', getCombos('ABC', 2))\n\nThe equivalent JavaScript\
