  md: "Permutations and Combinations   **135**\n\nC\n\nD\n\nD\n\nC\n\nD\n\nD\n\nD\n\
    \nD\n\n0-combinations\n\n1-combinations\n\n2-combinations\n\n3-combinations\n\n\
    4-combinations\n\nB\n\nC\n\nB\n\nD\n\nA\n\nC\n\nD\n\n''''\n\n*Figure 6-4: Tree\
    \ showing every possible *k*\\-combination (from 0 to 4) from the *\n\n*set {A,\
    \ B, C, D}*\n\nTo gather, for example, 3-combinations from this tree, start at\
    \ the root \n\nnode at the top and do a depth-first tree traversal to the 3-combinations\
    \ level, \n\nwhile memorizing each node’s letter on the way to the bottom. (Depth-first\
    \ \n\nsearches are discussed in Chapter 4.) Our first 3-combination would be going\
    \ \n\nfrom the root to A in the 1-combination level, then down to B in the 2-com­\n\
    \nbination level, then to C in the 3-combination level, where we stop with our\
    \ \n\ncomplete 3-combination: ABC. For the next combination, we traverse from\
    \ \n\nthe root to A to B to D, giving us the combination ABD. We continue doing\
    \ \n\nthis for ACD and BCD. Our tree has four nodes in the 3-combination level,\
    \ \n\nand four 3-combinations from {A, B, C, D}: ABC, ABD, ACD, and BCD.\n\nNotice\
    \ that we create the tree in Figure 6-4 by starting with a blank \n\nstring for\
    \ the root node. This is the 0-combination level, and it applies to \n\nall combinations\
    \ of zero selections from the set; it’s simply an empty string. \n\nThe child\
    \ nodes of the root are all elements from the set. In our case, that \n\nis all\
    \ four elements from {A, B, C, D}. While sets don’t have an order, we \n\nneed\
    \ to be consistent in using the ABCD order of the set while generating \n\nthis\
    \ tree. This is because every node’s children consist of the letters after \n\n\
    it in the ABCD string: All A nodes have children B, C, and D. All B nodes \n\n\
    have children C and D. All C nodes have one D child. And all D nodes have \n\n\
    no child nodes.\n\nWhile it’s not directly related to the recursive combination\
    \ function, \n\nalso notice the pattern in the number of *k*\\-combinations at\
    \ each level:\n\n• \n\nThe 0-combination and 4-combination levels both have one\
    \ combina­\n\ntion: the empty string and ABCD, respectively. \n\n• \n\nThe 1-combination\
    \ and 3-combination levels both have four combina­\n\ntions: A, B, C, D and ABC,\
    \ ABD, ACD, BCD, respectively. \n\n• \n\nThe 2-combination level in the middle\
    \ has the most combinations at \n\nsix: AB, AC, AD, BC, BD, and CD. \n\nThe Recursive\
    \ Book of Recursion (Early Access) © 2022 by Al Sweigart"
