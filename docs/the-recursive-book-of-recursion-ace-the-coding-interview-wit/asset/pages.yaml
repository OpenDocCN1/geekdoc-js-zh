  md: "**172**   Chapter 8\n\n // RECURSIVE CASE\n\n return isOddTailCall(number -\
    \ 1, !inversionAccum);\n\n }\n\n}\n\ndocument.write(isOdd(42) + \"<br />\");\n\
    \ndocument.write(isOdd(99) + \"<br />\");\n\n</script>\n\nIf this Python and JavaScript\
    \ code is run by an interpreter that supports \n\ntail call optimization, calling\
    \ isOddTailCall(100000) won’t result in a stack \n\noverflow. However, tail call\
    \ optimization is still much slower than simply \n\nusing the % modulus operator\
    \ to determine oddness or evenness.\n\nIf you think recursion, with or without\
    \ tail recursion, is an incred­\n\nibly inefficient way to determine whether a\
    \ positive integer is odd, you are \n\nabsolutely correct. Unlike iterative solutions,\
    \ recursion can fail from stack \n\noverflows. Adding tail call optimization to\
    \ prevent stack overflows doesn’t \n\nfix the efficiency flaws of using recursion\
    \ inappropriately. As a technique, \n\nrecursion is not automatically better or\
    \ more sophisticated than iterative \n\nsolutions. And tail recursion is never\
    \ a better approach than a loop or other \n\nsimple solution.\n\n**Summary**\n\
    \nTail call optimization is a feature of a programming language’s compiler \n\n\
    or interpreter that can be employed on recursive functions specifically writ­\n\
    \nten to be tail recursive. Tail recursive functions return the return value \n\
    \nof the recursive function call as the last action in the recursive case. This\
    \ \n\nallows the function to delete the frame object for the current frame object\
    \ \n\nand prevent the call stack from growing as new recursive function calls\
    \ are \n\nmade. If the call stack doesn’t grow, the recursive function can’t possibly\
    \ \n\ncause a stack overflow.\n\nTail recursion is a workaround that allows some\
    \ recursive algorithms \n\nto work with large arguments without crashing. However,\
    \ this approach \n\nrequires rearranging your code and possibly adding an accumulator\
    \ param­\n\neter. This could make your code harder to understand. You may likely\
    \ find \n\nthat sacrificing code readability is not worth using a recursive algorithm\
    \ \n\nover an iterative one.\n\n**Further Reading**\n\nStack Overflow (the website,\
    \ not the programming error) has a detailed \n\ndiscussion about the basics of\
    \ tail recursion at *https://stackoverflow.com/*\n\n*questions/33923/what-is-tail-recursion*.\n\
    \nvan Rossum wrote about his decision to not use tail recursion in two blog \n\
    \nposts at *https://neopythonic.blogspot.com.au/2009/04/tail-recursion-elimination.html*\
    \ \n\nand *https://neopythonic.blogspot.com.au/2009/04/final-words-on-tail-calls.html*.\n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
