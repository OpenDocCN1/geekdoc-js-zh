  md: "**152**   Chapter 7\n\n**Memoization**\n\n*Memoization* is the technique of\
    \ remembering the return values from a func­\n\ntion for the specific arguments\
    \ supplied to it. For example, if someone asked \n\nme to find the square root\
    \ of 720, which is the number that when multiplied \n\nby itself results in 720,\
    \ I’d have to sit down with pencil and paper for a few \n\nminutes (or call Math.sqrt(720)\
    \ in JavaScript or math.sqrt(720) in Python) \n\nto figure it out: 26.832815729997478.\
    \ If they asked me again a few seconds \n\nlater, I wouldn’t have to repeat my\
    \ calculation because I’d already have \n\nthe answer at hand. By caching previously\
    \ calculated results, memoization \n\nmakes a trade-off to save on execution time\
    \ by increasing memory usage.\n\nConfusing *memoization* with *memorization* is\
    \ a modern mistake made by \n\nmany. (Feel free to make a memo to remind yourself\
    \ of the difference.)\n\n***Top-Down Dynamic Programming***\n\nMemoization is\
    \ a common strategy in* dynamic programming*, a computer pro­\n\ngramming technique\
    \ that involves breaking a large problem into overlap­\n\nping subproblems. This\
    \ might sound a lot like the ordinary recursion we’ve \n\nalready seen. The key\
    \ difference is that dynamic programming uses recur­\n\nsion with repeated recursive\
    \ cases; these are the *overlapping *subproblems.\n\nFor example, let’s consider\
    \ the recursive Fibonacci algorithm from \n\nChapter 2. Making a recursive fibonacci(6)\
    \ function call will in turn call \n\nfibonacci(5) and fibonacci(4). Next, fibonacci(5)\
    \ will call fibonacci(4) and \n\nfibonacci(3). The subproblems of the Fibonacci\
    \ algorithm overlap, because \n\nthe fibonacci(4) call, and many others, are repeated.\
    \ This makes generating \n\nFibonacci numbers a dynamic programming problem.\n\
    \nAn inefficiency exists here: performing those same calculations multiple \n\n\
    times is unnecessary, because fibonacci(4) will always return the same thing,\
    \ \n\nthe integer 3. Instead, our program could just remember that if the argument\
    \ \n\nto our recursive function is 4, the function should immediately return 3.\n\
    \nFigure 7-1 shows a tree diagram of all the recursive calls, including \n\nthe\
    \ redundant function calls that memoization can optimize. Meanwhile, \n\nquicksort\
    \ and merge sort are recursive divide-and-conquer algorithms, but \n\ntheir subproblems\
    \ do not overlap; they are unique. Dynamic programming \n\ntechniques aren’t applied\
    \ to these sorting algorithms.\n\nfib(5)\n\nfib(4)\n\nfib(3)\n\nfib(6)\n\nfib(3)\n\
    \nfib(2)\n\nfib(2)\n\nfib(1)\n\n1\n\n1\n\n1\n\nfib(4)\n\nfib(3)\n\nfib(2)\n\n\
    fib(2)\n\nfib(1)\n\n1\n\n1\n\n1\n\n1\n\n1\n\nfib(2)\n\nfib(1)\n\n*Figure 7-1:\
    \ A tree diagram of the recursive function calls made starting *\n\n*with **fibonacci(6)**.\
    \ The redundant function calls are in gray.*\n\nThe Recursive Book of Recursion\
    \ (Early Access) © 2022 by Al Sweigart"
