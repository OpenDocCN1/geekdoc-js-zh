  md: "Classic Recursion Algorithms   **49**\n\n8\n\n4\n\n2\n\n5\n\n*Figure 3-2: A\
    \ **\\[5, 2, 4, 8\\]** array (right) is *\n\n*like a tree data structure (left)\
    \ with only *\n\n*one branch at each node.*\n\nThe key “tell” that our recursive\
    \ function is unnecessary is that it never \n\ndoes any backtracking over the\
    \ data it processes. It makes a single pass over \n\neach element in the array\
    \ from beginning to end, which is something a basic \n\nloop can accomplish. Additionally,\
    \ the Python recursive summation func­\n\ntion is about 100 times slower than\
    \ a straightforward iterative algorithm. \n\nEven if performance weren’t an issue,\
    \ the recursive sum() function would \n\ncause a stack overflow if passed a list\
    \ with tens of thousands of numbers \n\nto sum. Recursion is an advanced technique,\
    \ but it isn’t always the best \n\napproach.\n\nIn Chapter 5, we’ll examine a\
    \ recursive summation function that uses a \n\ndivide-and-conquer strategy, and\
    \ in Chapter 8 we’ll examine one that uses \n\ntail call optimization. These alternate\
    \ recursive approaches work around \n\nsome of the problems in the summation function\
    \ in this chapter.\n\n**Reversing a String**\n\nLike summing the numbers in an\
    \ array, reversing a string is another fre­\n\nquently cited recursive algorithm\
    \ even though the iterative solution is \n\nstraightforward. Because a string\
    \ is essentially an array of single charac­\n\nters, we’ll employ the head and\
    \ tail approach for our rev() function just \n\nas we did for the summation algorithm.\n\
    \nLet’s start with the smallest strings possible. A blank string and a single-\n\
    \ncharacter string are already the reverse of themselves. These naturally form\
    \ \n\nour base cases: if the string argument is a string such as '' or A, our\
    \ func­\n\ntion should simply return the string argument.\n\nFor larger strings,\
    \ let’s try splitting the string into a head (just the first \n\ncharacter) and\
    \ tail (all characters after the first). For a two-character string \n\nlike XY,\
    \ X is the head and Y is the tail. To reverse the string, we need to place \n\n\
    the head behind the tail: YX.\n\nDoes this algorithm hold for longer strings?\
    \ To reverse a string like \n\nCAT, we would break it into the head C and the\
    \ tail AT. But placing the head \n\nbehind the tail alone doesn’t reverse the\
    \ string; it gives us ATC. What we \n\nactually want to do is put the head behind\
    \ *the reverse of* the tail. In other \n\nThe Recursive Book of Recursion (Early\
    \ Access) © 2022 by Al Sweigart"
