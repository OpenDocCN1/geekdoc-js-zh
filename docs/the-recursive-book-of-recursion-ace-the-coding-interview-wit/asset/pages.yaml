  md: "**8**   Chapter 1\n\nstory about your coworker Bob, but for that story to make\
    \ sense, you first \n\nhave to explain something about your cousin Carol. You\
    \ finish your story \n\nabout Carol and go back to talking about Bob, and when\
    \ you finish your \n\nstory about Bob, you go back to talking about Alice. Then\
    \ you are reminded \n\nabout your brother David, so you tell a story about him.\
    \ Eventually, you get \n\naround to finishing your original story about Alice.\
    \ \n\nYour conversation follows a stack-like structure, as in Figure 1-5. The\
    \ \n\nconversation is stack-like because the current topic is always at the top\
    \ of \n\nthe stack.\n\nAlice\n\nAlice\n\nAlice\n\nAlice\n\nAlice\n\nAlice\n\n\
    Bob\n\nBob\n\nBob\n\nDavid\n\nCarol\n\nAlice\n\n*Figure 1-5: Your meandering conversation\
    \ stack*\n\nIn our conversation stack, the new topics are added to the top of\
    \ the \n\nstack and taken off as they are completed. The previous topics are “remem­\n\
    \nbered” underneath the current topic in the stack.\n\nWe can use Python lists\
    \ as stacks if, to amend the list’s contents, we \n\nlimit ourselves to the append()\
    \ and pop() methods to perform pushing and \n\npopping. JavaScript arrays can\
    \ also be used as stacks through their push() \n\nand pop() methods.\n\n**N O\
    \ T E**\n\n*Python uses the terms *list* and *item*, while JavaScript uses the\
    \ terms *array* and *ele­\n\nment*, but they are respectively identical for our\
    \ purposes. In this book, I use the terms *\n\nlist* and *item* for both languages.*\n\
    \nFor example, consider this *cardStack.py* program, which pushes and \n\npops\
    \ string values of playing cards to the end of a list named cardStack:\n\n*Python*\n\
    \ncardStack = 1 \\[\\]\n\n2 cardStack.append('5 of diamonds')\n\nprint(','.join(cardStack))\n\
    \ncardStack.append('3 of clubs')\n\nprint(','.join(cardStack))\n\ncardStack.append('ace\
    \ of hearts')\n\nprint(','.join(cardStack))\n\n3 cardStack.pop()\n\nprint(','.join(cardStack))\n\
    \nThe following *cardStack.html* program contains the equivalent code in \n\n\
    JavaScript:\n\n*JavaScript*\n\n<script type=\"text/javascript\">\n\nlet cardStack\
    \ = 1 \\[\\];\n\n2 cardStack.push(\"5 of diamonds\");\n\ndocument.write(cardStack\
    \ + \"<br />\");\n\ncardStack.push(\"3 of clubs\");\n\ndocument.write(cardStack\
    \ + \"<br />\");\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al\
    \ Sweigart"
