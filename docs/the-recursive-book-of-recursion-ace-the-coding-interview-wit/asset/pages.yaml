  md: "Classic Recursion Algorithms   **67**\n\n..SNIP..\n\n ackermann(0, 6)\n\n ackermann(0,\
    \ 7)\n\n ackermann(0, 8)\n\n9\n\nYou can also try ackermann(3, 3), but anything\
    \ with larger arguments \n\nwill probably take far too long to calculate. To speed\
    \ up the calculation, try \n\ncommenting out all print() and document.write()\
    \ calls except the ones that \n\nprint the final return value of ackermann().\n\
    \nRemember, even a recursive algorithm like the Ackermann function \n\ncan be\
    \ implemented as an iterative function. The iterative Ackermann algo­\n\nrithms\
    \ are implemented in *ackermannIterative.py* and *ackermannIterative.html* \n\n\
    in the downloadable resources at *https://nostarch.com/recursive-book-recursion*.\n\
    \n**Summary**\n\nThis chapter covered some classic recursive algorithms. For each,\
    \ we asked \n\nimportant questions you should always ask when designing your own\
    \ recur­\n\nsive functions: What is the base case? What arguments are passed to\
    \ the \n\nrecursive function call? How do these arguments become closer to the\
    \ base \n\ncase? If they don’t, your function will continue to recurse until it\
    \ causes a \n\nstack overflow.\n\nThe summation, string reversing, and palindrome\
    \ detection recursive \n\nfunctions could have easily been implemented with a\
    \ simple loop. The key \n\ngiveaway is that they all make a single pass through\
    \ the data given to them \n\nwith no backtracking. As explained in Chapter 2,\
    \ recursive algorithms are \n\nespecially suited to problems that involve a tree-like\
    \ structure and require \n\nbacktracking. \n\nThe tree-like structures for solving\
    \ the Tower of Hanoi puzzle suggest \n\nthat it involves backtracking, as the\
    \ program execution runs from top to \n\nbottom, left to right, in the tree. This\
    \ makes it a prime candidate for recur­\n\nsion, especially since the solution\
    \ requires two recursive calls of smaller \n\ntowers.\n\nThe flood fill algorithm\
    \ is directly applicable to graphics and drawing \n\nprograms, as well as other\
    \ algorithms to detect the shape of contiguous \n\nareas. If you’ve used the paint-bucket\
    \ tool in a graphics program, you’ve \n\nlikely used a version of the flood fill\
    \ algorithm.\n\n**Further Reading**\n\nWikipedia has more information on the Tower\
    \ of Hanoi problem at *https://*\n\n*en.wikipedia.org/wiki/Tower\\_of\\_Hanoi*,\
    \ and the Computerphile video “Recur­\n\nsion ‘Super Power’ (in Python)” covers\
    \ solving the Tower of Hanoi in Python \n\nat *https://youtu.be/8lhxIOAfDss*.\
    \ The 3Blue1Brown two-part video series, “Binary, \n\nHanoi, and Sierpiński” goes\
    \ into even more detail by exploring the relation­\n\nships among the Tower of\
    \ Hanoi, binary numbers, and the Sierpiński triangle \n\nfractal starting at *https://youtu.be/2SUvWfNJSsM*.\n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
