  md: "Fractal Art Maker   **263**\n\n # Call the draw function to draw the shape:\n\
    \n turtle.pendown()\n\n shapeDrawFunction(size, depth)\n\n turtle.penup()\n\n\
    \ # RECURSIVE CASE\n\n for spec in specs:\n\n # Each dictionary in specs has keys\
    \ 'sizeChange', 'xChange',\n\n # 'yChange', and 'angleChange'. The size, x, and\
    \ y changes\n\n # are multiplied by the size parameter. The x change and y\n\n\
    \ # change are added to the turtle's current position. The angle\n\n # change\
    \ is added to the turtle's current heading.\n\n sizeCh = spec.get('sizeChange',\
    \ 1.0)\n\n xCh = spec.get('xChange', 0.0)\n\n yCh = spec.get('yChange', 0.0)\n\
    \n angleCh = spec.get('angleChange', 0.0)\n\n # Reset the turtle to the shape's\
    \ starting point:\n\n turtle.goto(initialX, initialY)\n\n turtle.setheading(initialHeading\
    \ + angleCh)\n\n turtle.forward(size \\* xCh)\n\n turtle.left(90)\n\n turtle.forward(size\
    \ \\* yCh)\n\n turtle.right(90)\n\n # Make the recursive call:\n\n drawFractal(shapeDrawFunction,\
    \ size \\* sizeCh, specs, maxDepth, \n\n depth + 1)\n\nif DRAW\\_FRACTAL == 1:\n\
    \n # Four Corners:\n\n drawFractal(drawFilledSquare, 350,\n\n \\[{'sizeChange':\
    \ 0.5, 'xChange': -0.5, 'yChange': 0.5},\n\n {'sizeChange': 0.5, 'xChange': 0.5,\
    \ 'yChange': 0.5},\n\n {'sizeChange': 0.5, 'xChange': -0.5, 'yChange': -0.5},\n\
    \n {'sizeChange': 0.5, 'xChange': 0.5, 'yChange': -0.5}\\], 5)\n\nelif DRAW\\\
    _FRACTAL == 2:\n\n # Spiral Squares:\n\n drawFractal(drawFilledSquare, 600, \\\
    [{'sizeChange': 0.95,\n\n 'angleChange': 7}\\], 50)\n\nelif DRAW\\_FRACTAL ==\
    \ 3:\n\n # Double Spiral Squares:\n\n drawFractal(drawFilledSquare, 600,\n\n \\\
    [{'sizeChange': 0.8, 'yChange': 0.1, 'angleChange': -10},\n\n {'sizeChange': 0.8,\
    \ 'yChange': -0.1, 'angleChange': 10}\\])\n\nelif DRAW\\_FRACTAL == 4:\n\n # Triangle\
    \ Spiral:\n\n drawFractal(drawTriangleOutline, 20,\n\n \\[{'sizeChange': 1.05,\
    \ 'angleChange': 7}\\], 80)\n\nelif DRAW\\_FRACTAL == 5:\n\n # Conway's Game of\
    \ Life Glider:\n\n third = 1 / 3\n\n drawFractal(drawFilledSquare, 600,\n\n \\\
