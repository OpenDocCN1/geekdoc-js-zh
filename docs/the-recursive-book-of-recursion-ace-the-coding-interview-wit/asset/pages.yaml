  md: "Droste Maker   **293**\n\nimage and place it on the base image. After the two\
    \ nested for loops have \n\nfinished looping, the magenta pixels in the base image\
    \ will have been \n\nreplaced by pixels from the resized image. \n\nHowever, the\
    \ resized image itself could have magenta pixels, and if so, \n\nthese will now\
    \ become part of the base image, as in the top-right image \n\nof Figure 14-2.\
    \ We’ll need to pass the modified base image to a recursive \n\n­makeDroste()\
    \ call:\n\n*Python*\n\n # RECURSIVE CASE:\n\n return makeDroste(baseImage, stopAfter\
    \ - 1)\n\nThis line is the recursive call in our recursive algorithm, and it’s\
    \ the last \n\nline of code in the makeDroste() function. This recursion handles\
    \ the new \n\nmagenta area copied from the resized image. Note that the value\
    \ passed for \n\nthe stopAfter parameter is stopAfter - 1, ensuring that it comes\
    \ closer to the \n\nbase case of 0.\n\nFinally, the Droste Maker program begins\
    \ by passing museum.png to make­\n\nDroste() to get the Pillow Image object of\
    \ the recursive image. We save this \n\nas a new image file named *museum-recursive.png\
    \ *and display the recursive \n\nimage in a new window for the user to view:\n\
    \n*Python*\n\nrecursiveImage = makeDroste('museum.png')\n\nrecursiveImage.save('museum-recursive.png')\n\
    \nrecursiveImage.show()\n\nYou can change these filenames to whichever image on\
    \ your computer \n\nyou’d like to use with the program.\n\nDoes the makeDroste()\
    \ function need to be implemented with recursion? \n\nSimply put, no. Notice that\
    \ no tree-like structure is involved in the problem, \n\nand the algorithm does\
    \ no backtracking, which is a sign that recursion may \n\nbe an overengineered\
    \ approach to this code. \n\n**Summary**\n\nThis chapter’s project was a program\
    \ that produces recursive Droste effect \n\nimages, just like the illustration\
    \ on old tins of Droste’s Cacao. The program \n\nworks by using pure magenta pixels\
    \ with RGB values of 255, 0, 255 to mark \n\nthe parts of the image that should\
    \ be replaced by a smaller version. Since \n\nthis smaller version will also have\
    \ its own smaller magenta area, the replace­\n\nments will repeat until the magenta\
    \ area is gone to produce a recursive \n\nimage.\n\nThe base case for our recursive\
    \ algorithm occurs when no more \n\nmagenta pixels remain in the image to place\
    \ the smaller recursive image \n\nin, or when the stopAfter counter reaches 0.\
    \ Otherwise, the recursive case \n\npasses the image to the makeDroste() function\
    \ to continue to replace the \n\nmagenta area with even smaller recursive images.\n\
    \nYou can modify your own photos to add magenta pixels and then run \n\nthem through\
    \ the Droste Maker. The museum patron looking at an exhibit \n\nThe Recursive\
    \ Book of Recursion (Early Access) © 2022 by Al Sweigart"
