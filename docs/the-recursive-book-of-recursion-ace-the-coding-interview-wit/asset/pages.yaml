  md: "**178**   Chapter 9\n\nTable 9-1: Turtle Functions in Python’s turtle Module\
    \ and JavaScript’s jtg Library\n\nPython\n\nJavaScript\n\nDescription\n\ngoto(*\
    \ x*, *y*)\n\nxy(* x*, *y*)\n\nMoves the turtle to the x, y coordinates.\n\nsetheading(*\
    \ deg*)\n\nheading(* deg*)\n\nSets the turtle’s heading. In Python, 0 \n\ndegrees\
    \ is east (right). In JavaScript, 0 \n\ndegrees is north (up).\n\nforward(* steps*)\n\
    \nfd(* steps*)\n\nMoves the turtle a number of steps for­\n\nward in the heading\
    \ it is facing.\n\nbackward(* steps*)\n\nbk(* steps*)\n\nMoves the turtle a number\
    \ of steps in the \n\nopposite heading it is facing.\n\nleft(* deg*)\n\nlt(* deg*)\n\
    \nTurns the turtle’s heading to the left.\n\nright(* deg*)\n\nrt(* deg*)\n\nTurns\
    \ the turtle’s heading to the right.\n\npenup()\n\npu()\n\n“Raises the pen” so\
    \ the turtle stops draw­\n\ning as it moves.\n\npendown()\n\npd()\n\n“Lowers the\
    \ pen” so the turtle starts draw­\n\ning as it moves.\n\npensize(* size*)\n\n\
    thickness(* size*)\n\nChanges the thickness of the lines the \n\nturtle draws.\
    \ The default is 1.\n\npencolor(* color*)\n\ncolor(* color*)\n\nChanges the color\
    \ of the lines the turtle \n\ndraws. This can be a string of a common \n\ncolor\
    \ such as red or white. The default is \n\nblack.\n\nxcor()\n\nget.x()\n\nReturns\
    \ the turtle’s current x position.\n\nycor()\n\nget.y()\n\nReturns the turtle’s\
    \ current y position.\n\nheading()\n\nget.heading()\n\nReturns the turtle’s current\
    \ heading as \n\na floating-point number from 0 to 359. \n\nIn Python, 0 degrees\
    \ is east (right). In \n\nJavaScript, 0 degrees is north (up).\n\nreset()\n\n\
    reset()\n\nClears any drawn lines, and moves the \n\nturtle back to the original\
    \ position and \n\nheading.\n\nclear()\n\nclean()\n\nClears any drawn lines but\
    \ doesn’t move \n\nthe turtle.\n\nThe functions in Table 9-2 are available only\
    \ in the Python turtle \n\nmodule.\n\nTable 9-2: Python-Only Turtle Functions\n\
    \nPython\n\nDescription\n\nbegin\\_fill()\n\nBegins drawing a filled-in shape.\
    \ The lines drawn after \n\nthis call will specify the perimeter of the filled-in\
    \ shape.\n\nend\\_fill()\n\nDraws the filled-in shape that was started with the\
    \ call to \n\nturtle.begin\\_fill().\n\nfillcolor(* color*)\n\nSets the color\
    \ used for filled-in shapes.\n\nhideturtle()\n\nHides the triangle that represents\
