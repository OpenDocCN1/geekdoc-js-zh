  md: "**288**   Chapter 14\n\nWhile the magenta area itself doesn’t need to be a\
    \ perfect rectangle, \n\nthe program needs to know the rectangular boundaries\
    \ of the magenta in \n\norder to properly resize the image for insertion. For\
