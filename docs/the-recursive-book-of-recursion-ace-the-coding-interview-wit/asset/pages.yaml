  md: "What is Recursion?   **5**\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_30_0.png)\n\
    \n*Figure 1-3: The recursive centaur. Image by Joseph Parker.*\n\nBased on these\
    \ jokes, you might conclude that recursion is a sort of meta, \n\nself-referencing,\
    \ dream-within-a-dream, infinite mirror-into-mirror sort of \n\nthing. Let’s establish\
    \ a concrete definition: a *recursive* thing is something \n\nwhose definition\
    \ includes itself. That is, it has a self-referential definition. \n\nThe Sierpiński\
    \ triangle in Figure 1-4 is defined as an equilateral tri­\n\nangle with an upside-down\
    \ triangle in the middle that forms three new \n\nequilateral triangles, each\
    \ of which contains a Sierpiński triangle. The defi­\n\nnition of Sierpiński triangles\
    \ includes Sierpiński triangles.\n\n*Figure 1-4: Sierpi**ń**ski triangles are\
    \ fractals (recursive shapes) that include Sierpi**ń**ski *\n\n*triangles.*\n\n\
    In a programming context, a *recursive function* is a function that calls \n\n\
    itself. Before we explore recursive functions, let’s take a step back and under­\n\
    \nstand how regular functions work. Programmers tend to take function calls \n\
    \nfor granted, but even experienced programmers will find it worthwhile to \n\n\
    review functions in the next section.\n\n**What Are Functions?**\n\n*Functions*\
    \ can be described as mini-programs inside your program. They’re a \n\nfeature\
    \ of nearly every programming language. If you need to run identical \n\nThe Recursive\
    \ Book of Recursion (Early Access) © 2022 by Al Sweigart"
