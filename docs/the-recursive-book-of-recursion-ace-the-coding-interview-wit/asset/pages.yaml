  md: "Permutations and Combinations   **147**\n\nThe recursive case is split into\
    \ two parts. The first part is acquiring the \n\npower set of the tail of chars.\
    \ We’ll use the leap-of-faith principle and just \n\nassume the call to getPowerSet()\
    \ returns the power set of the tail correctly 2, \n\neven though at this point\
    \ we’d still be in the process of writing the code for \n\ngetPowerSet().\n\n\
    To form the complete power set of chars, the second part of the recur­\n\nsive\
    \ case forms new sets by adding the head to each of the tail power sets 3. \n\n\
    Together with the sets from the first part, this forms the power set of chars\
    \ \n\nto return at the end of the function 4.\n\n**Summary**\n\nPermutations and\
    \ combinations are two problem domains that many pro­\n\ngrammers don’t know how\
    \ to even begin to approach. While recursion is \n\noften an overly complicated\
    \ solution for common programming problems, \n\nit’s well suited for the complexity\
    \ of the tasks in this chapter.\n\nThe chapter began with a brief introduction\
    \ to set theory. This lays the \n\nbasis for the data structures that our recursive\
    \ algorithms operate on. A set is \n\na collection of distinct elements. A subset\
    \ consists of none, some, or all of the \n\nelements of a set. While sets have\
    \ no ordering for their elements, a permuta­\n\ntion is a specific ordering of\
    \ the elements in a set. And a combination, which \n\nhas no ordering, is a specific\
    \ selection of none, some, or all of the elements in \n\na set. A *k*\\-combination\
    \ of a set is a subset of *k* elements selected from the set.\n\nPermutations\
    \ and combinations can include an element once or repeat \n\nelements. We call\
    \ these permutations or combinations without repetition and \n\nwith repetition,\
    \ respectively. These are implemented by different algorithms.\n\nThis chapter\
    \ also tackled the balanced parentheses problem that is \n\ncommonly used in coding\
    \ interviews. Our algorithm builds the strings of \n\nbalanced parentheses by\
    \ starting with a blank string and adding opening \n\nand closing parentheses.\
    \ This approach involves backtracking to earlier \n\nstrings, making recursion\
    \ an ideal technique.\n\nFinally, this chapter featured a recursive function for\
    \ generating power \n\nsets—that is, sets of all possible *k*\\-combinations of\
    \ the elements of a set. The \n\nrecursive function we create to do this is much\
    \ more efficient than repeat­\n\nedly calling our combinations function for each\
    \ possible size of subset.\n\n**Further Reading**\n\nGenerating permutations and\
    \ combinations only scratches the surface of \n\nwhat you can do with permutations\
    \ and combinations, as well as the field \n\nof mathematical logic known as *set\
    \ theory*. The following Wikipedia articles \n\nprovide plenty of further details\
    \ on these topics, as do the Wikipedia arti­\n\ncles that each links to:\n\n•\
    \ \n\n*https://en.wikipedia.org/wiki/Set\\_theory*\n\n• \n\n*https://en.wikipedia.org/wiki/Combination*\n\
    \n• \n\n*https://en.wikipedia.org/wiki/Permutation*\n\nThe Recursive Book of Recursion\
    \ (Early Access) © 2022 by Al Sweigart"
