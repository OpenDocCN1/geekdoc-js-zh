    \ 1000\\]\n\nprint('The sum of', nums, 'is', sumDivConq(nums))\n\nThe *sumDivConq.html*\
    \ program contains the JavaScript equivalent:\n\n*JavaScript*\n\n<script type=\"\
    text/javascript\">\n\nfunction sumDivConq(numbers) {\n\n if (numbers.length ===\
