  pgno: 307
- img_proc: true
  md: "Droste Maker   **283**\n\n­pillow. This command makes Python use the pip installer\
    \ program to down­\n\nload the module from the official Python Package Index at\
    \ *https://pypi.org*.\n\nTo verify that the installation worked, open a Python\
    \ terminal and run \n\nfrom PIL import Image. (While the library’s name is Pillow,\
    \ the Python mod­\n\nule installed is named PIL, in capital letters.) If no error\
    \ appears, the library \n\nwas installed correctly.\n\nThe official documentation\
    \ for Pillow can be found at *https://pillow.*\n\n*readthedocs.io*. \n\n**Painting\
    \ Your Image**\n\nThe next step is to prepare an image by setting a portion of\
    \ it to the RGB \n\n(red, green, blue) color value 255, 0, 255. Computer graphics\
    \ often use \n\nmagenta to mark which pixels of an image should be rendered as\
    \ transpar­\n\nent. Our program will treat these magenta pixels like a green screen\
    \ in \n\nvideo production, replacing them with a resized version of the initial\
    \ image. \n\nOf course, this resized image will have its own smaller magenta area,\
    \ which \n\nthe program will replace with another resized image. The base case\
    \ occurs \n\nwhen the final image has no more magenta pixels, at which point the\
    \ algo­\n\nrithm is done.\n\nFigure 14-2 shows the progression of images created\
    \ as the resized image \n\nis recursively applied to the magenta pixels. In this\
    \ example, a model stands \n\nin front of an art museum exhibit that has been\
    \ replaced with magenta pix­\n\nels, turning the photograph itself into the exhibit.\
    \ You can download this \n\nbase image from *https://inventwithpython.com/museum.png*.\n\
    \nBe sure you use only the pure (255, 0, 255) magenta color for painting \n\n\
    the magenta area in your image. Some tools may have a fading effect that \n\n\
    produces a more natural look. For example, Photoshop’s Brush tool will \n\nproduce\
    \ faded magenta pixels on the outline of the painted area, so you \n\nwill need\
    \ to use the Pencil tool instead, which paints using only the precise \n\npure\
    \ magenta color you’ve selected. If your graphics program doesn’t allow \n\nyou\
    \ to specify the precise RGB color for drawing, you can copy and paste \n\nthe\
    \ colors from the PNG image at *https://inventwithpython.com/magenta.png*.\n\n\
    The magenta area in the image can be of any size or shape; it does not \n\nhave\
    \ to be an exact, contiguous rectangle. You can see that in Figure 14-2, \n\n\
    the museum visitor cuts into the magenta rectangle, placing them in front \n\n\
    of the recursive image.\n\nIf you make your own images with Droste Maker, you\
    \ should use the \n\nPNG image file format instead of JPEG. JPEG images use *lossy*\
    \ compression \n\ntechniques to keep the file size small that introduce slight\
    \ imperfections. \n\nThese are usually imperceptible to the human eye and don’t\
    \ affect overall \n\nimage quality. However, this lossy compression will replace\
    \ the pure (255, \n\n0, 255) magenta pixels with slightly different shades of\
    \ magenta. The *lossless* \n\nimage compression of PNG images ensures this won’t\
    \ happen.\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
