  md: "**144**   Chapter 6\n\nTo find every power set of a set, we could reuse our\
    \ existing getCom­\n\nbos() function, calling it repeatedly with each possible\
    \ *k* argument. This \n\napproach is taken by the *powerSetCombinations.py* and\
    \ *powerSetCombinations.*\n\n*html* programs in the downloadable resources file\
    \ from *https://nostarch.com/*\n\n*recursive-book-recursion*.\n\nHowever, we can\
    \ use a more efficient way to generate power sets. Let’s \n\nconsider the power\
    \ set of {A, B}, which is {{A, B}, {A}, {B}, {}}. Now say we add \n\none more\
    \ element, C, to the set and want to generate the power set of {A, \n\nB, C}.\
    \ We have the four sets in the power set of {A, B} we already generated; \n\n\
    in addition, we have these same four sets but with the element C added to \n\n\
    them: {{A, B, C}, {A, C}, {B, C}, {C}}. Table 6-3 shows the pattern of how add­\n\
    \ning more elements to a set adds more sets to its power set.\n\nTable 6-3: How\
    \ Power Sets Grow as New Elements (in Bold) Are Added to the Set\n\nSet with new\
    \ element\n\nNew sets to the power \n\nset\n\nComplete power set\n\n{}\n\n{}\n\
    \n{{}}\n\n{A}\n\n{A}\n\n{{}, {A}}\n\n{A, B}\n\n{B}, {A, B}\n\n{{}, {A}, {B}, {A,\
    \ B}}\n\n{A, B, C}\n\n{C}, {A, C}, {B, C}, {A, \n\nB, C}\n\n{{}, {A}, {B}, {C},\
    \ {A, B}, \n\n{A, C}, {B, C}, {A, B, C}}\n\n{A, B, C, D}\n\n{D}, {A, D}, {B, D},\
    \ {C, D}, \n\n{A, B, D}, {A, C, D}, {B, \n\nC, D}, {A, B, C, D}\n\n{{}, {A}, {B},\
    \ {C}, {D}. {A, \n\nB}, {A, C}, {A, D}, {B, C}, \n\n{B, D}, {C, D}, {A, B, C},\
    \ \n\n{A, B, D}, {A, C, D}, {B, \n\nC, D}, {A, B, C, D}}\n\nThe power sets of\
    \ larger sets are similar to the power sets of smaller \n\nsets, hinting that\
    \ we can create a recursive function to generate them. The \n\nbase case is an\
    \ empty set, and its power set is a set of just the empty set. \n\nWe can use\
    \ a head-tail technique for this recursive function. For each new \n\nelement\
    \ we add, we want to get the power set of the tail to add to our full \n\npower\
    \ set. We also add the head element to each set in the tail power set. \n\nTogether,\
    \ these form the full power set for the chars argument.\n\nLet’s ask the three\
    \ recursive algorithm questions about our power set \n\nalgorithm:\n\n**What is\
    \ the base case?   ** If chars is the blank string (the empty set), the \n\nfunction\
    \ returns an array with just a blank string, since the empty set is \n\nthe only\
    \ subset of the empty set.\n\n**What argument is passed to the recursive function\
    \ call?   ** The tail of \n\nchars is passed. For the second recursive call, the\
    \ tail of chars is passed.\n\n**How does this argument become closer to the base\
    \ case?   ** Since the \n\nrecursive calls remove the heads from the chars arguments,\
    \ eventually \n\nthe chars argument becomes the blank string.\n\nThe Recursive\
    \ Book of Recursion (Early Access) © 2022 by Al Sweigart"
