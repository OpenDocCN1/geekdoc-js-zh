  md: "Drawing Fractals   **193**\n\n turtle.forward(length / 3)\n\n # Draw the bump.\n\
    \n turtle.backward(length / 3)\n\n turtle.left(60)\n\n recursiveArgs.append({'position':turtle.position(),\n\
    \n 'heading':turtle.heading()})\n\n turtle.pencolor('black')\n\n turtle.forward(length\
    \ / 3)\n\n turtle.right(120)\n\n recursiveArgs.append({'position':turtle.position(),\n\
    \n 'heading':turtle.heading()})\n\n turtle.forward(length / 3)\n\n turtle.left(60)\n\
    \n recursiveArgs.append({'position':turtle.position(),\n\n 'heading':turtle.heading()})\n\
    \n for i in range(4):\n\n drawKochCurve(recursiveArgs\\[i\\]\\['position'\\],\n\
    \n recursiveArgs\\[i\\]\\['heading'\\],\n\n length / 3)\n\n return\n\ndef drawKochSnowflake(startPosition,\
    \ heading, length):\n\n # A Koch snowflake is three Koch curves in a triangle.\n\
    \n # Move to the starting position.\n\n turtle.penup()\n\n turtle.goto(startPosition)\n\
    \n turtle.setheading(heading)\n\n for i in range(3):\n\n # Record the starting\
    \ position and heading.\n\n curveStartingPosition = turtle.position()\n\n curveStartingHeading\
    \ = turtle.heading()\n\n drawKochCurve(curveStartingPosition,\n\n curveStartingHeading,\
    \ length)\n\n # Move back to the start position for this side.\n\n turtle.penup()\n\
    \n turtle.goto(curveStartingPosition)\n\n turtle.setheading(curveStartingHeading)\n\
    \n # Move to the start position of the next side.\n\n turtle.forward(length)\n\
    \n turtle.right(120)\n\ndrawKochSnowflake((100, 500), 0, 500)\n\nturtle.exitonclick()\n\
    \nThe Koch snowflake is also sometimes called the *Koch island*. Its coast­\n\n\
    line would be literally infinitely long. While the Koch snowflake fits into the\
    \ \n\nfinite area of a page of this book, the length of its perimeter is infinite,\
    \ prov­\n\ning that, while it seems counterintuitive, the finite can contain the\
    \ infinite!\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
