    \ you can also \n\nmake your own fractal art with the project in \n\nthis chapter.\
    \ The Fractal Art Maker program uses \n\nPython’s turtle module to turn simple\
    \ shapes into \n\ncomplex designs with minimal additional code. \n\nThe project\
    \ in this chapter comes with nine example fractals, although \n\nyou can also\
