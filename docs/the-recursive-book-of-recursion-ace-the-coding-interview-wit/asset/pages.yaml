  md: "**140**   Chapter 6\n\ntwo balanced parentheses pairs, but )(() and (() are\
    \ not balanced. These \n\nstrings are also called *Dyck words*, after mathematician\
    \ Walther von Dyck.\n\nA common coding interview question is to write a recursive\
    \ function \n\nthat, given the number of pairs of parentheses, produces all possible\
    \ com­\n\nbinations of balanced parentheses. For example, a getBalancedParens(3)\
    \ call \n\nshould return \\['((()))', '(()())', '(())()', '()(())', '()()()'\\\
    ]. Note that \n\ncalling getBalancedParens(* n*) returns strings that are 2*n*\
    \ characters in length, \n\nsince each string consists of *n* pairs of parentheses.\n\
    \nWe could try to solve this problem by finding all permutations of the \n\npairs\
    \ of parentheses characters, but that would result in both balanced and \n\nunbalanced\
    \ parentheses strings. Even if we filtered out the invalid strings \n\nlater,\
    \ 2*n*! permutations exist for *n* pairs of parentheses. That algorithm is \n\n\
    far too slow to be practical.\n\nInstead, we can implement a recursive function\
    \ to generate all strings \n\nof balanced parentheses. Our getBalancedParens()\
    \ function takes an integer \n\nof the number of pairs of parentheses and returns\
    \ a list of balanced paren­\n\ntheses strings. The function builds these strings\
    \ by adding either an open­\n\ning or closing parenthesis. For example, when getBalancedParens(3)\
    \ is called, \n\nthree opening parentheses and three closing parentheses are added\
    \ to the \n\nstring being built. An opening parenthesis can be added only if opening\
    \ \n\nparentheses remain to be used. A closing parenthesis can be added only if\
    \ \n\nmore opening parentheses have been added than closing parentheses so \n\n\
    far. \n\nWe’ll track the number of opening and closing parentheses remain­\n\n\
    ing to be used with function parameters named openRem and closeRem. The \n\nstring\
    \ currently being built is another function parameter named current. \n\nThe first\
    \ base case occurs when openRem and closeRem are both 0 and no more \n\nparentheses\
    \ remain to be added to the current string. The second base case \n\nhappens after\
    \ the two recursive cases have received the lists of balanced \n\nparentheses\
    \ strings after adding an opening and/or closing parenthesis (if \n\npossible).\n\
    \nLet’s ask the three recursive algorithm questions about the getBalanced­\n\n\
    Parens() function:\n\n**What is the base case?   ** When the number of opening\
    \ and clos­\n\ning parentheses remaining to be added to the string being built\
    \ has \n\nreached 0. A second base case always occurs after the recursive cases\
    \ \n\nhave finished.\n\n**What argument is passed to the recursive function call? \
    \  ** The total \n\nnumber of pairs of parentheses (pairs), the remaining number\
    \ of open­\n\ning and closing parentheses to add (openRem and closeRem), and the\
    \ string \n\ncurrently being built (current).\n\n**How does this argument become\
    \ closer to the base case?   ** As we add \n\nmore opening and closing parentheses\
    \ to current, we decrement the \n\nopenRem and closeRem arguments until they become\
    \ 0.\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
