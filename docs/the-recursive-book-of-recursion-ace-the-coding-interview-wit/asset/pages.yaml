  md: "**176**   Chapter 9\n\n**Turtle Graphics**\n\n*Turtle graphics* were a feature\
    \ of the Logo programming language designed \n\nto help kids learn coding concepts.\
    \ The feature has since been reproduced \n\nin many languages and platforms. Its\
    \ central idea is an object called a *turtle*. \n\nThe turtle acts as a programmable\
    \ pen that draws lines in a two-dimen­\n\nsional window. Imagine an actual turtle\
    \ holding a pen on the ground, \n\ndrawing a line behind it as it moves around.\
    \ The turtle can adjust the size \n\nand color of its pen, or “raise the pen”\
    \ to not draw as it moves. Turtle pro­\n\ngrams can produce intricate, geometric\
    \ drawings such as Figure 9-1.\n\nWhen you put these instructions inside loops\
    \ and functions, even small \n\nprograms can create impressive geometric drawings.\
    \ Consider the following \n\n*spiral.py* program:\n\n*Python*\n\nimport turtle\n\
    \nturtle.tracer(1, 0) # Makes the turtle draw faster.\n\nfor i in range(360):\n\
    \n turtle.forward(i)\n\n turtle.left(59)\n\nturtle.exitonclick() # Pause until\
    \ user clicks in the window.\n\nWhen you run this program, the turtle window opens.\
    \ The turtle (rep­\n\nresented by a triangle) will trace the spiral pattern in\
    \ Figure 9-1. While not \n\na fractal, it is a beautiful drawing.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_201_0.png)\n\
    \n*Figure 9-1: The spiral drawn by the program using Python’s **turtle** module*\n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
