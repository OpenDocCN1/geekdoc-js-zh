    </script>\n\nWhen you run this program, it produces a large amount of text that\
    \ will \n\nfill the terminal window or browser with each step of the maze’s construc­\n\
    \ntion. You’ll have to scroll back up to the top to view the entire output.\n\n\
    The maze data structure begins as a completely filled-in two-dimen­\n\nsional\
    \ space. The recursive backtracker algorithm is given a starting point \n\nin\
    \ this maze and then visits a previously unvisited neighboring space, “carv­\n\
    \ning out” any hallway space in the process. Then it recursively calls itself\
    \ on a \n\nneighboring space it hasn’t visited before. If all the neighboring\
    \ spaces have \n\nalready been visited, the algorithm is at a dead end and backtracks\
    \ to an \n\nearlier visited space to visit its unvisited neighbors. The program\
    \ ends when \n\nthe algorithm backtracks to its starting location.\n\nYou can\
    \ see this algorithm in action by running the maze-generator \n\nprogram. As the\
    \ maze is carved out, it displays the current x, y coordinates \n\nby using the\
    \ @ character. The process looks like Figure 11-1. Notice that \n\nthe fifth image\
