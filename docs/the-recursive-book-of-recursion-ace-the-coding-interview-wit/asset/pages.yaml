    \n.Adding head 'B' to tail combos:\n\n.New combination BC\n\n.In getCombos('BC',\
    \ 2) part 2, get combos without head 'B')\n\n..In getCombos('C', 2), start.\n\n\
    ..In getCombos('C', 2) part 1, get combos with head 'C'\n\n...In getCombos('',\
    \ 1), start.\n\n...In getCombos('', 1) base case returns \\[\\]\n\n..Adding head\
    \ 'C' to tail combos:\n\n..In getCombos('C', 2) part 2, get combos without head\
    \ 'C')\n\n...In getCombos('', 2), start.\n\n...In getCombos('', 2) base case returns\
    \ \\[\\]\n\n..In getCombos('C', 2) results are \\[\\]\n\n.In getCombos('BC', 2)\
    \ results are \\['BC'\\]\n\nIn getCombos('ABC', 2) results are \\['AB', 'AC',\
    \ 'BC'\\]\n\nResults: \\['AB', 'AC', 'BC'\\]\n\nEvery getCombos() function call\
    \ has two recursive calls for the two parts \n\nof the algorithm. The first part 1\
    \ is to get all the combinations that include \n\nthe head A. In the tree, this\
    \ generates all of the combinations *under *the A \n\nnode in the 1-combination\
    \ level.\n\nFor our getCombos('ABC', 2) example, we can do this by passing the\
    \ tail \n\nand k - 1 to the first recursive function call: getCombos('BC', 1) 2.\
    \ We add A \n\nto each combination that this recursive function call returns.\
    \ Let’s use the \n\nleap-of-faith principle and just assume our getCombos() correctly\
    \ returns a \n\nlist of *k*\\-combinations, \\['B', 'C'\\], even though we haven’t\
    \ finished writing it \n\nyet. We now have all the *k*\\-combinations that include\
    \ the head A in an array \n\nto hold our results: \\['AB', 'AC'\\].\n\nThe second\
    \ part 3 gets all the combinations that don’t include the \n\nhead A. In the tree,\
    \ this generates all of the combinations *to the right* of the \n\nA node in the\
    \ 1-combination level. We can do this by passing the tail and k \n\nto the second\
    \ recursive function call: getCombos('BC', 2). This returns \\['BC'\\], \n\nsince\
    \ BC is the only 2-combination of BC.\n\nThe results from getCombos('ABC', 2)’s\
    \ two recursive calls, \\['AB', 'AC'\\] \n\nand \\['BC'\\], are concatenated together\
    \ and returned: \\['AB', 'AC', 'BC'\\] 4. \n\nThe getCombos() function generates\
    \ combinations of larger sets the same way.\n\n**Get All Combinations of Balanced\
    \ Parentheses**\n\nA string has *balanced parentheses* if every opening parenthesis\
    \ is followed by \n\nexactly one closing parenthesis. For example, ()() and (())\
    \ are strings of \n\nThe Recursive Book of Recursion (Early Access) © 2022 by\
    \ Al Sweigart"
