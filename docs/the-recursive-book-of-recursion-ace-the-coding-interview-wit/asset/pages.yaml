  md: "**190**   Chapter 9\n\nIf you’d like to create a more natural, less self-similar\
    \ tree, replace the \n\nlines after the \\# Record the position of the branch's\
    \ end. comment with the \n\nfollowing lines. This generates new random angles\
    \ and branch lengths for \n\n*every* recursive call, which is closer to the way\
    \ trees grow in nature:\n\n*Python*\n\n # Record the position of the branch's\
    \ end.\n\n endPosition = turtle.position()\n\n leftDirection = direction + random.randint(10,\
    \ 30)\n\n leftBranchLength = branchLength - random.randint(8, 15)\n\n rightDirection\
    \ = direction - random.randint(10, 30)\n\n rightBranchLength = branchLength -\
    \ random.randint(8, 15)\n\nYou can experiment with different ranges for the random.randint()\
    \ call, or \n\ntry adding more recursive calls instead of just the two for the\
    \ two branches.\n\n**How Long Is the Coast of Great Britain?: **\n\n**The Koch\
    \ Curve and Snowflake**\n\nBefore I tell you about the Koch curve and snowflake,\
    \ consider this ques­\n\ntion: how long is the coast of Great Britain? Look at\
    \ Figure 9-13. The map \n\non the left has a rough measure, which puts the coast\
    \ at about 2,000 miles. \n\nBut the map on the right has a more precise measure,\
    \ which includes more \n\nnooks and crannies of the coast and comes to about 2,800\
    \ miles.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_215_0.png)\n\n*Figure 9-13:\
    \ The island of Great Britain, with a rough measure (left) and more precise *\n\
    \n*measure (right). Measuring the coast more precisely adds 800 miles to its length.*\n\
    \nThe Recursive Book of Recursion (Early Access) © 2022 by Al Sweigart"
  merge: -1
  pgno: 215
- img_proc: true
  md: "Drawing Fractals   **191**\n\nMandelbrot’s key insight about fractals such\
    \ as the coastline of Britain \n\nis that you can continue to look closer and\
    \ closer, and there will continue to \n\nbe “roughness” at every scale. So, as\
    \ your measurement gets finer and finer, \n\nthe length of the coastline will\
    \ get longer and longer. The “coast” will follow \n\nthe Thames upriver, deep\
    \ into the landmass along one bank and back out \n\nto the English Channel on\
    \ the other bank. Thus, the answer to our ques­\n\ntion of Great Britain’s coastline’s\
    \ length is, “It depends.” \n\nThe *Koch curve* fractal has a similar property\
    \ pertaining to the length \n\nof its coastline, or rather, perimeter. First introduced\
    \ in 1902 by Swedish \n\nmathematician Helge von Koch, the Koch curve is one of\
    \ the earliest frac­\n\ntals to be described mathematically. To construct it,\
    \ take a line of length *b* \n\nand divide it into three equal parts, each of\
    \ length *b* / 3. Replace the mid­\n\ndle section with a “bump” whose sides are\
    \ also of length *b* / 3. This bump \n\ncauses the Koch curve to be longer than\
    \ the original line, since we now \n\nhave four line segments of length *b* /\
    \ 3. (We’ll exclude the original middle \n\npart of the line segment.) This bump\
    \ creation can be repeated on the new \n\nfour line segments. Figure 9-14 shows\
    \ this construction.\n\n*b*/3\n\n*b*/3\n\n*b*/3\n\n*b*/3\n\n*b*/3\n\n*b*/3\n\n\
    *b*/3\n\n*Figure 9-14: After splitting the line segment into three equal parts\
    \ (left), *\n\n*add a bump to the middle part (right). We now have four segments\
    \ of *\n\n*length *b* / 3, to which bumps can be added again (bottom).*\n\nTo\
    \ create the *Koch snowflake*, we start with an equilateral triangle and \n\n\
    construct three Koch curves from its three sides, as in Figure 9-15.\n\n*Figure 9-15:\
    \ Creating three Koch curves on the three *\n\n*sides of an equilateral triangle\
    \ to form a Koch snowflake*\n\nEach time you create a new bump, you are increasing\
    \ the curve’s length \n\nfrom three *b* / 3 lengths to four *b* / 3 lengths, or\
    \ 4*b* / 3. If you continue to \n\ndo this with the three sides of an equilateral\
    \ triangle, you’ll create the Koch \n\nThe Recursive Book of Recursion (Early\
    \ Access) © 2022 by Al Sweigart"
  merge: -1
  pgno: 216
- img_proc: true
  md: "**192**   Chapter 9\n\nsnowflake, as in Figure 9-16. (The small dotted patterns\
    \ are artifacts, because \n\nslight rounding errors cause the turtle module to\
    \ be unable to completely \n\nerase the middle *b* / 3 segment.) You can continue\
    \ to create new bumps for­\n\never, though our program stops when they get smaller\
    \ than a few pixels.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_217_0.png)\n\n\
    *Figure 9-16: A Koch snowflake. Some of the interior lines remain *\n\n*because\
    \ of small rounding errors.*\n\nThe source code for *kochSnowflake.py* is as follows:\n\
    \n*Python*\n\nimport turtle\n\nturtle.tracer(10, 0) # Increase the first argument\
    \ to speed up the drawing.\n\nturtle.setworldcoordinates(0, 0, 700, 700)\n\nturtle.hideturtle()\n\
    \nturtle.pensize(2)\n\ndef drawKochCurve(startPosition, heading, length):\n\n\
    \ if length < 1:\n\n # BASE CASE\n\n return\n\n else:\n\n # RECURSIVE CASE\n\n\
    \ # Move to the start position.\n\n recursiveArgs = \\[\\]\n\n turtle.penup()\n\
    \n turtle.goto(startPosition)\n\n turtle.setheading(heading)\n\n recursiveArgs.append({'position':turtle.position(),\n\
    \n 'heading':turtle.heading()})\n\n # Erase the middle third.\n\n turtle.forward(length\
    \ / 3)\n\n turtle.pencolor('white')\n\n turtle.pendown()\n\nThe Recursive Book\
    \ of Recursion (Early Access) © 2022 by Al Sweigart"
  merge: -1
