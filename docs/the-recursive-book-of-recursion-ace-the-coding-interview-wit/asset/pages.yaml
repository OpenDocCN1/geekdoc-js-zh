    \n if len(theString) == 0 or len(theString) == 1:\n\n # BASE CASE\n\n return True\n\
    \n else:\n\n # RECURSIVE CASE\n\n 1 head = theString\\[0\\]\n\n 2 middle = theString\\\
    [1:-1\\]\n\n 3 last = theString\\[-1\\]\n\n 4 return head == last and isPalindrome(middle)\n\
    \ntext = 'racecar'\n\nprint(text + ' is a palindrome: ' + str(isPalindrome(text)))\n\
    \ntext = 'amanaplanacanalpanama'\n\nprint(text + ' is a palindrome: ' + str(isPalindrome(text)))\n\
