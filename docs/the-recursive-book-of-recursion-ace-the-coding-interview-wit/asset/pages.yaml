  md: "**50**   Chapter 3\n\nwords, AT would reverse to TA, and then adding the head\
    \ to the end of that \n\nwould produce the reversed string, TAC.\n\nHow can we\
    \ reverse the tail? Well, we can recursively call rev() and pass \n\nit the tail.\
    \ Forget about the implementation of our function for a moment \n\nand focus on\
    \ its input and output: rev() takes one string argument and \n\nreturns a string\
    \ with the argument’s characters reversed. \n\nThinking about how to implement\
    \ a recursive function like rev() can \n\nbe difficult because it involves a chicken-and-egg\
    \ problem. In order to write \n\nrev()’s recursive case, we need to call a function\
    \ that reverses a string—that \n\nis, rev(). As long as we have a solid understanding\
    \ of what our recursive \n\nfunction’s arguments and return value will be, we\
    \ can use the *leap-of-faith* \n\ntechnique to get around this chicken-and-egg\
    \ problem by writing our recur­\n\nsive case assuming the rev() function call\
    \ returns the correct value even \n\nthough we haven’t finished writing it yet.\n\
    \nTaking a leap of faith in recursion is not a magical technique that guar­\n\n\
    antees your code works bug free. It is merely a perspective to hold to break \n\
    \npast the mental programmer’s block you can have when thinking about how \n\n\
    to implement your recursive function. The leap of faith requires you to have \n\
    \na firm understanding of your recursive function’s arguments and return \n\n\
    value.\n\nNote that the leap-of-faith technique only helps you write the recursive\
    \ \n\ncase. You must pass the recursive call an argument that is closer to the\
    \ base \n\ncase. You can’t simply pass the same argument that the recursive function\
    \ \n\nreceived like this:\n\ndef rev(theString):\n\n return rev(theString) # This\
    \ won't magically work.\n\nTo continue our CAT example, when we pass the tail\
    \ AT to rev(), the \n\nhead is A and the tail is T in *that* function call. We\
    \ already know that the \n\nreverse of a single-character string like T is simply\
    \ T; that’s our base case. So \n\nthis second call to rev() will reverse AT to\
    \ TA, which is precisely what the pre­\n\nvious call to rev() needs. Figure 3-3\
    \ shows the state of the call stack during \n\nall the recursive calls to rev().\n\
    \nLet’s ask our three recursive algorithm questions about the rev() \n\nfunction:\n\
    \n**What is the base case?    ** A zero- or one-character string.\n\n**What argument\
    \ is passed to the recursive function call?    ** The tail \n\nof the original\
    \ string argument, which has one less character than the \n\noriginal string argument.\n\
    \n**How does this argument become closer to the base case?    ** The array \n\n\
    argument shrinks by two elements (the first and the last) for each \n\nrecursive\
    \ call until it becomes a one- or zero-length array.\n\nThe Recursive Book of\
    \ Recursion (Early Access) © 2022 by Al Sweigart"
