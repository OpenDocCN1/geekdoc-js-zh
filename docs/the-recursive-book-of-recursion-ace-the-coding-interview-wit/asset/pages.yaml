    \ image-manipulation module.\n\n**Hands On, Experimental Computer Science**\n\n\
    Reading about recursion won’t teach you how to implement it on its own. \n\nThis\
    \ book includes many recursive code examples in both the Python and \n\nJavaScript\
    \ programming languages for you to experiment with. If you’re \n\nnew to programming,\
    \ you can read *Automate the Boring Stuff with Python* \n\nor *Python Crash Course*\
    \ for an introduction to both programming and the \n\nPython programming language.\n\
    \nI recommend stepping through these programs with a debugger. A \n\n*debugger*\
    \ lets you execute programs one line at a time and inspect the state \n\nof the\
    \ program along the way, allowing you to pinpoint where bugs occur. \n\nChapter 11\
