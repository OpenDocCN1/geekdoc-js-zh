  md: "**160**   Chapter 7\n\nprint('Waiting two seconds...')\n\ntime.sleep(2)\n\n\
    print(getCurrentTime())\n\nprint()\n\nprint('Displaying a message twice:')\n\n\
    printMessage()\n\nprintMessage()\n\nWhen you run this program, the output looks\
    \ like this:\n\nGetting the current time twice:\n\n2022-07-30 16:25:52.136999\n\
    \nWaiting two seconds...\n\n2022-07-30 16:25:52.136999\n\nDisplaying a message\
    \ twice:\n\nHello, world!\n\nNotice that the second call to getCurrentTime() returns\
    \ the same result as \n\nthe first call despite being called two seconds later.\
    \ And of the two calls to \n\nprintMessage(), only the first call results in displaying\
    \ the Hello, world! mes­\n\nsage on the screen.\n\nThese bugs are subtle because\
    \ they don’t cause an obvious crash, \n\nbut rather cause the functions to behave\
    \ incorrectly. No matter how you \n\nmemoize your functions, be sure to thoroughly\
    \ test them.\n\n**Summary**\n\nMemoization (not memorization) is an optimization\
    \ technique that can \n\nspeed up recursive algorithms that have overlapping subproblems\
    \ by \n\nremembering the previous results of identical calculations. Memoization\
    \ \n\nis a common technique in the field of dynamic programming. By trading \n\
    \ncomputer memory usage for improved runtime, memoization makes some \n\notherwise\
    \ intractable recursive functions possible. \n\nHowever, memoization won’t prevent\
    \ stack overflow errors. Keep in \n\nmind that memoization is not a replacement\
    \ for using a simple iterative \n\nsolution. Code that uses recursion for the\
    \ sake of recursion is not automati­\n\ncally more elegant than non-recursive\
    \ code.\n\nMemoized functions must be pure—that is, they must be determinis­\n\
    \ntic (returning the same values given the same arguments each time) and \n\n\
    not have side effects (affecting anything about the computer or program \n\noutside\
    \ of the function). Pure functions are often used in functional pro­\n\ngramming,\
    \ which is a programming paradigm that makes heavy use of \n\nrecursion.\n\nMemoization\
    \ is implemented by creating a data structure called a \n\n*cache* for each function\
    \ to memoize. You can write this code yourself, but \n\nPython has a built-in\
    \ @functools.lru\\_cache() decorator that can automatically \n\nmemoize the function\
    \ it decorates.\n\nThe Recursive Book of Recursion (Early Access) © 2022 by Al\
    \ Sweigart"
