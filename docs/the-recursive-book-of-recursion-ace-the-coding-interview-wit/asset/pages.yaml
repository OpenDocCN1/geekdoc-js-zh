  md: "Drawing Fractals   **183**\n\nThe drawTriangle() function takes six arguments\
    \ corresponding to the \n\nx, y coordinates of the triangle’s three points. Try\
    \ experimenting with dif­\n\nferent values to adjust the shape of the Sierpiński\
    \ triangle. You can also \n\nchange the MIN\\_SIZE constant to a larger value\
    \ to make the program reach \n\nthe base case sooner and reduce the number of\
    \ triangles drawn.\n\n**The Sierpi****ń****ski Carpet**\n\nA fractal shape similar\
    \ to the Sierpiński triangle can be drawn using rectan­\n\ngles instead. This\
    \ pattern is known as the *Sierpi**ń**ski carpet*. Imagine splitting \n\na black\
    \ rectangle into a 3 × 3 grid, then “cutting out” the center rectangle. \n\nRepeat\
    \ this pattern in the surrounding eight rectangles of the grid. When \n\nthis\
    \ is done recursively, you end up with a pattern like Figure 9-7.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_208_0.png)\n\
    \n*Figure 9-7: The Sierpi**ń**ski carpet*\n\nThe Python program that draws the\
    \ carpet uses the turtle.begin\\_fill() \n\nand turtle.end\\_fill() functions\
    \ to create solid, filled-in shapes. The lines \n\nthat the turtle draws between\
    \ these calls are used to draw the shape, as in \n\nFigure 9-8.\n\n*Figure 9-8:\
    \ Calling **turtle.begin\\_fill()**, drawing a path, *\n\n*and calling **turtle.end\\\
    _fill()** creates a filled-in shape.*\n\nThe Recursive Book of Recursion (Early\
    \ Access) © 2022 by Al Sweigart"
