  md: "Fractal Art Maker   **261**\n\nThe nine calls to drawFractal() that produce\
    \ these nine new triangles \n\neach make three recursive calls to drawFractal(),\
    \ producing 27 new triangles \n\nat the next level of recursion. As this pattern\
    \ of recursion continues, even­\n\ntually the triangles become so small that drawFractal()\
    \ stops making new \n\nrecursive calls. This is one of the base cases for the\
    \ recursive drawFractal() \n\nfunction. The other occurs when the recursive depth\
    \ reaches a specified \n\nlevel. Either way, these recursive calls produce the\
    \ final Wave fractal in \n\nFigure 13-5.\n\n![](img/4317e0d10a2a71da22fc74ce42e2668a_286_0.png)\n\
    \n*Figure 13-5: The final Wave fractal after each triangle recursively generates\
    \ three *\n\n*more triangles*\n\nThe nine example fractals in Figure 13-1 that\
    \ come with the Fractal Art \n\nMaker are made with just two shape-drawing functions\
    \ and a few changes \n\nto the arguments to drawFractal(). Let’s take a look at\
    \ the Fractal Art \n\nMaker’s code to see how it accomplishes this.\n\n**The Complete\
    \ Fractal Art Maker Program**\n\nEnter the following code into a new file and\
    \ save it as *fractalArtMaker.py*. \n\nThis program relies on Python’s built-in\
    \ turtle module, so no JavaScript \n\ncode is used for this chapter’s project:\n\
    \n*Python*\n\nimport turtle, math\n\nDRAW\\_FRACTAL = 1 # Set to 1 through 11\
    \ and run the program.\n\nThe Recursive Book of Recursion (Early Access) © 2022\
    \ by Al Sweigart"
