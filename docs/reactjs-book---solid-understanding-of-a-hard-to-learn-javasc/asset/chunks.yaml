  raw: 'The render method mounts this component to the DOM. The reason this process
    is referred to as mounting is similar to virtual hard drives. If you''ve ever
    mounted a virtual CD-Rom or hard drive on your computer, you know how it works.
    The hard drive doesn''t physically exist. For the same reason, this is why this
    type of software is called virtual hard drive. Or virtual CD-Rom. And this is
    why virtual drives have features like "mount this drive."


    Likewise, this is the same principle behind virtual DOM in React. Until it is
    mounted, it cannot be operated upon. This is what makes React so much faster than
    regular DOM operations. And this is probably one of the top reasons for using
    React in the first place. React stores a fast in-memory representation of the
    DOM.


    But this virtual DOM is not even associated with the JavaScript''s DOM. It exists
    side by side, and renders into the actual DOM on the screen only when it becomes
    necessary. Usually, when the component representing an element is actually updated
    with new incoming data.


    Essentially, React is designed to update components on the screen only when they
    need to be. Another advantage of doing it this way is that it separates your application
    from the back end, while effectively executing functions that are responsible
    for updating the screen almost instantaneously as they occur.


    What you choose to use as a communication bridge between the back end and the
    front end is entirely up to you. React doesn''t care about it. Its purpose is
    strictly limited to updating the view as fast as possible.


    This mounting mechanism make React a versatile library. Because at its basic principle,
    React also doesn''t care whether the final result is rendered in the DOM or elsewhere.


    You can render React output into an XML document, treat it as custom object data,
    or return a JSON. It combines familiar programming principles and tries to be
    "everything for everyone." This is what makes React an incredibly powerful tool
    for programming User Interfaces as well as fiddling around with custom software
    implementations.


    Now, chances are that if you''re coming to React from traditional pre-2015 JavaScript
    background… unlike studying jQuery, learning React is a much more involved process.
    It pertains to learning software development principles rather than learning a
    set of method names and you''re ready to go!


    However, it does have a few methods that are becoming standardized among React
    programmers. We''ll explore them as we move forward. Simply knowing them, without
    understanding the fundamental philosophy behind React is just not enough.


    # Gem 7 - Node.js & NPM


    When I said that studying React involves learning much more than just React library,
    it was certainly true. At the very least, working with React requires that you
    install the Node library.


    A whole another book can be written just about Node alone, but with regard to
    React library, we need to install it for several reasons:


    1.  To provide a localhost environment for our React application. Installing Node
    gives you the ability to run your applications from [http://localhost](http://localhost)
    on your local machine.


    2.  Node automatically comes with Babel and JSX support (JSX is installed as a
    Babel plugin.)


    Installing Node and NPM is surprisingly easy on both Mac (via the terminal) and
    the PC. On the PC it''s as easy as downloading the Node installation file from
    their official website. Run the installation program and you''re all set. Just
    don''t forget to check the babel checkbox during installation, so it''s also included.


    On a Mac, you can download Node via command line. Pop open your Terminal application
    and type:


    | $ wget http://nodejs.org/dist/node-v0.4.4.tar.gz$ tar -xzf node-v0.4.4.tar.gz$
    cd node-v0.4.4$ ./configure$ sudo make install |


    That''s it! The configuration log will run and then you''re done.


    On Ubuntu, you might want to run this additional command to install essential
    components:


    | $ apt-get -y install build-essential |


    It looks like at this point node is installed and ready to be utilized for giving
    us a localhost http address where we can test our React code.


    However, the good news is that if you already have Apache server installed on
    your localhost machine, and it''s mapped to your development folder, using node
    for providing localhost environment is not necessary. You already have it set
    up.


    In this case, you can just start writing React programs right inside your existing
    Apache httpdoc folder, or whatever folder it is mapped to on your machine. Just
    create a new folder in that directory for example "my-react-app", and as usual
    your project will be available for access via browser under something like:


    http://localhost/my-react-app


    However, it is highly recommended that you do install Node. If for any reason,
    it''s because it comes with command line version of Babel and JSX plugins, which
    will be required for proper development environment set up.


    The installation is really straightforward on a Mac in terminal. But on PC it
    is just a bit more challenging, especially if you''ve never done this before.


    If you are still unsure on how to do any of this on a PC I recorded a 58-minute
    supplementary tutorial on YouTube, available for free at the following location:


    React JS Tutorial 1 - For Beginners | ReactJS JavaScript ES6 Node.js, NPM, Babel
    Transpiler, Webpack


    https://www.youtube.com/watch?v=tXaNvGcjEi0


    It''s worth going through regardless of where you are in the development process.
    But it''s a must-watch if you''re just starting out.


    Watching this tutorial should get you started with writing React applications
    on a PC via the localhost address. So in that video tutorial I walk you through
    the entire process, step by step. I don''t want to rewrite the details in this
    book to take any more space. You can watch it at 2x speed and get through it in
    just about 25 minutes.


    # Gem 8 - JSX Walkthrough


    If you''ve started studying React already, you should have heard a lot about JSX.
    You''ve also probably heard that it is not necessary to use it with React. And
    that much is true. But, it is recommended that you do. It just makes things so
    much easier, even though its syntax can appear a little scary at first to traditional
    JavaScript developers.


    JSX is known for being a language that lets you "write HTML inside JavaScript."
    This is true to some degree. The desired effect is that we can treat HTML tags
    as a JavaScript statement. However, JSX actually uses a form of XML which only
    resembles HTML, because it uses tag names that match those of standard HTML tags,
    such as DIV, UL, TABLE and so on. Remember that even HTML is just a distant brother
    of XML.


    Although HTML as a JavaScript statement might look a bit dinosauric at first,
    once you grasp the idea and get used to it, it really becomes second nature. It''s
    definitely something completely new and not usually done (and not even compile
    in most browsers today) but let''s take a look at what it actually looks like:


    | var scoreBoard = { Player1: 10, Player2: 25 };<div className = "class1" />;<SomeCounter
    count = { 3 + 5 } /><ScoreBoardUnit data-index = "2">    <h1>Score Leaderboard</h1>   
    <Scoreboard className = "results" scores = {scoreBoard} /></ScoreBoardUnit>; |


    This code naturally will not compile in your standard browser unless Babel''s
    JSX plugin is helping us transpile it back into ES5, the specification we can
    be sure all modern browsers do understand. In which case, it will compile into
    following React elements.


    | var scoreBoard = { Player1: 10, Player2: 25 };  React.createElement( ''div'',
    { className: ''class1'' }, null)  React.createElement( SomeCounter, { count: 3
    + 5 }, null)  React.createElement( ScoreBoardUnit, { ''data-index'': 2 },     
    React.createElement( ''h1'', {}, ''Score Leaderboard''),      React.createElement(
    Scoreboard, { className: ''result'', Scores: scoreBoard }, null)  ) // close React.createElement(
    ScoreBoardUnit... |'
