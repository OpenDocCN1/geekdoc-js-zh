- fmt: "\nAnd yes, `link1.href` will contain `#` by simply declaring it as JSX. Once\
    \ I realized that this is how it works JSX started to make a lot more sense and\
    \ I actually started to feel comfortable using it.\n\nIt's like a two-way road\
    \ between HTML and JavaScript where attributes automatically become properties.\n\
    \nAnd here is the more complex example, this time in JSX once again:\n\n```javascript\n\
    let nav = <MyNav> <a href = \"#\">Save</a> <a href = \"#\">Load</a> <a href =\
    \ \"#\">Delete</a> <a href = \"#\"> <span alerts = \"0\">No Alerts</span> </a></MyNav>;\n\
    ```\n\nWe have just recreated virtual DOM using JSX language using a single JavaScript\
    \ statement! You can pass the value of `nav` around as a statement into functions.\
    \ It's almost like another way of creating a mini DOM structure.\n\nNow you (hopefully)\
    \ see that this is the very structure of virtual DOM in React. It's like a secondary\
    \ DOM we're going to be working with, changing, modifying, editing, deleting and\
    \ adding children from, etc.\n\nWe will update the actual primary JavaScript DOM\
    \ object which is responsible for visible elements in our application… but only\
    \ when it actually needs updating. None of the virtual DOM operations we're performing\
    \ will be associated with spending time updating the original DOM. And this is\
    \ what improves performance of React applications.\n\nThe best thing, React does\
    \ this for us automatically. As a React programmer, you are not required to understand\
    \ how React does this internally. You just focus on design of your application.\n\
    \nNote, of course if you type JSX code directly into your JavaScript application,\
    \ it will not even compile. You must be running JSX processor. To do this you\
    \ would usually initialize it from command line, so it constantly runs in the\
    \ background.\n\nBabel has a JSX pugin. I also recommend learning how to make\
    \ babel watch your files. What this means is, you can set babel up so that it\
    \ auto-transpiles your `.js` files (and places them into \"build\" or \"production\"\
    \ directory) automatically, soon as the file changes. This this babel functionality\
    \ is called \"watch\". It first must be enabled. I explain how to do this on Windows\
    \ PC in my video tutorial:\n\nReact Tutorial on YouTube that helps you set up\
    \ your development environment, install Node.js, NPM, babel, JSX and help you\
    \ start watching your js files:\n\nhttps://www.youtube.com/watch?v=tXaNvGcjEi0\n\
    \nYou can get away with simply adding `babel.js` to your `SCRIPT` tag at the top\
    \ or bottom of your web page. JSX will transpile just fine. But this will significantly\
    \ slow down processing of your application. It should be used only for testing.\n\
    \nThe video, on the other hand is only 58 minutes long, and if you're serious\
    \ about setting up a professional web development environment I recommend breezing\
    \ through it on 2x speed option in YouTube player which should only take about\
    \ 25 minutes. It's like a mini introduction course.\n\nFinally, we're drawing\
    \ this discussion to an end by showing that you can also clone existing elements\
    \ using `cloneElement`.\n\n```javascript\nReact.cloneElement(element, props, children);\n\
    ```\n\nIt works in the exactly same way as `createElement`. Just pass an existing\
    \ element as `element` argument. Then, whatever `props` and `children` you pass\
    \ to corresponding parameters, will be merged into ones already available on the\
    \ original element. This is reminiscent of extending object functionality in traditional\
    \ Object-Oriented programming. Here, we're somewhat imitating OOP functionality.\n\
    \nCreated elements can now be actually rendered to the DOM. You cannot render\
    \ to virtual DOM. The `render` function is the magick that takes care of this\
    \ process within React library internals. This is when our element \"copy and\
    \ pasted\" from our virtual DOM into the actual DOM that will be visible on the\
    \ screen.\n\nReact provides `render` method on the main `ReactDOM` object as shown\
    \ below. In reactive programming `ReactDOM` is the second most important object\
    \ after React.\n\n```javascript\nReactDOM.render(reactElement, domContainerNode);\n\
    ```\n\nHere `domContainerNode` is the parent element on which `reactElement` will\
    \ be rendered, re-rendered or attached for the first time (mount.)\n\nYou can\
    \ use `render` multiple times, if you need to update properties of the component.\n\
    \nHere's what a real-life scenario might look like. In this example we're taking\
    \ a `ReactElement` and rendering it on a DOM node:\n\n```javascript\nReactDOM.render(React.createElement(\"\
    div\"), document.getElementById(\"container\"));\n```\n\nIf you have an element\
    \ already associated with a variable name, you can look it up using `ReactDOM.findDOMNode`:\n\
    \n```javascript\nReactDOM.findDOMNode(element);\n```\n\nThis statement returns\
    \ the DOM node associated with the given element. Note, that this will only work\
    \ only after element has been rendered to the DOM with the `render` method. Until\
    \ then, it is not findable in the DOM, even if it was already created.\n\n# Special\
    \ Props\n\nHere we will briefly talk about special prop names, of which there\
    \ are a few. These should be treated almost like reserved keywords in JavaScript,\
    \ except in React. They all have a special meaning.\n\n### Children\nThe prop\
    \ name `children` is automatically added to `this.props` by `React.createElement`.\n\
    \n### className\nThis prop corresponds to the HTML's `class` attribute. You must\
    \ use `className` in your components/elements instead of `name` to avoid clashing\
    \ with HTML's reserved keyword.\n\n### htmlFor\nSame as `className` only for the\
    \ \"for\" attribute. `htmlFor` should be used in your React element anywhere where\
    \ you need to use \"for\".\n\n### key\nThe `key` prop uniquely identifies a `ReactElement`.\
    \ It's used with arrays.\n\n### ref\nThe `ref` prop accepts a callback function\
    \ which will be called:\n1. With the component instance of DOM node on mount.\n\
    2. With null when the passed function changes.\n\n### style\nThe `style` prop\
    \ accepts an object of styles, instead of a string. In React, there is no mechanism\
    \ for specifying CSS styles as a text string. But this limitation can also be\
    \ looked at as an advantage, because CSS styles can now be represented programmatically,\
    \ where each property of the CSS-style object represent CSS property pairs.\n\n\
    # PropTypes\n\nReact has a special property called `PropTypes`. Typechecking is\
    \ its primary purpose. As your app becomes large in size, type checking can help\
    \ catch bugs.\n\nHere is an example. Let's say we already have a React component\
    \ created, and named `ReactComponent`. By default typechecking is enabled in development\
    \ mode. It is actually not turned on in production code.\n\n```javascript\nReactComponent.propTypes\
    \ = { name: React.PropTypes.string};\n```\n\nWhat `React.PropTypes` does is it\
    \ turns on validation for the type of the data stored in a property. By default\
    \ React has a number of data validators, and if a Numeric data type is passed\
    \ to a prop defined as String (as shown in example above) then you will see a\
    \ warning in JavaScript developer's console in Chrome or other browsers.\n\nThe\
    \ `propTypes` in React are defined as follows:\n\n| any | array | boolean | element\
    \ | func | number | object | string |\n\n# Class Component Options\n\nWe'll speak\
    \ about components a lot more throughout the rest of the book. They are the building\
    \ blocks of your react application. But remember that this is \"React on the Palm\
    \ of Your Hand\" section. Let's briefly overview the full scope of a React component,\
    \ its options and methods available by default in React library. Components are\
    \ defined by `createClass` method existing on the main `React` object:\n\n```javascript\n\
    var MyComponent = React.createClass({\n  displayName: 'MyComponent',\n  /* This\
    \ is the core of your React Class\n     options and lifecycle methods will be\
    \ written here */\n  render: function() {\n    // Once rendered, let's return\
    \ a newly created element\n    return React.createElement(/* … */);\n  }\n});\n\
    ```\n"
  raw: 'And yes, link1.href will contain "#" by simply declaring it as JSX. Once I
    realized that this is how it works JSX started to make a lot more sense and I
    actually started to feel comfortable using it.


    It''s like a two-way road between HTML and JavaScript where attributes automatically
    become properties.


    And here is the more complex example, this time in JSX once again:


    | let nav = <MyNav>    <a href = "#">Save</a>    <a href = "#">Load</a>    <a
    href = "#">Delete</a>    <a href = "#">        <span alerts = "0">No Alerts</span>   
    </a></MyNav>; |


    We have just recreated virtual DOM using JSX language using a single JavaScript
    statement! You can pass the value of nav around as a statement into functions.
    It''s almost like another way of creating a mini DOM structure.


    Now you (hopefully) see that this is the very structure of virtual DOM in React.
    It''s like a secondary DOM we''re going to be working with, changing, modifying,
    editing, deleting and adding children from, etc.


    We will update the actual primary JavaScript DOM object which is responsible for
    visible elements in our application… but only when it actually needs updating.
    None of the virtual DOM operations we''re performing will be associated with spending
    time updating the original DOM. And this is what improves performance of React
    applications.


    The best thing, React does this for us automatically. As a React programmer, you
    are not required to understand how React does this internally. You just focus
    on design of your application.


    Note, of course if you type JSX code directly into your JavaScript application,
    it will not even compile. You must be running JSX processor. To do this you would
    usually initialize it from command line, so it constantly runs in the background.


    Babel has a JSX pugin. I also recommend learning how to make babel watch your
    files. What this means is, you can set babel up so that it auto-transpiles your
    .js files (and places them into "build" or "production" directory) automatically,
    soon as the file changes. This babel functionality is called "watch". It first
    must be enabled. I explain how to do this on Windows PC in my video tutorial:


    React Tutorial on YouTube that helps you set up your development environment,
    install Node.js, NPM, babel, JSX and help you start watching your js files:


    [https://www.youtube.com/watch?v=tXaNvGcjEi0](https://www.youtube.com/watch?v=tXaNvGcjEi0)


    You can get away with simply adding babel.js to your SCRIPT tag at the top or
    bottom of your web page. JSX will transpile just fine. But this will significantly
    slow down processing of your application. It should be used only for testing.


    The video, on the other hand is only 58 minutes long, and if you''re serious about
    setting up a professional web development environment I recommend breezing through
    it on 2x speed option in YouTube player which should only take about 25 minutes.
    It''s like a mini introduction course.


    Finally, we''re drawing this discussion to an end by showing that you can also
    clone existing elements using cloneElement.


    | React.cloneElement(element, props, children); |


    It works in the exactly same way as createElement. Just pass an existing element
    as element argument. Then, whatever props and children you pass to corresponding
    parameters, will be merged into ones already available on the original element.
    This is reminiscent of extending object functionality in traditional Object-Oriented
    programming. Here, we''re somewhat imitating OOP functionality.


    Created elements can now be actually rendered to the DOM. You cannot render to
    virtual DOM. The render function is the magick that takes care of this process
    within React library internals. This is when our element "copy and pasted" from
    our virtual DOM into the actual DOM that will be visible on the screen.


    React provides render method on the main ReactDOM object as shown below. In reactive
    programming ReactDOM is the second most important object after React.


    | ReactDOM.render(reactElement, domContainerNode); |


    Here domContainerNode is the parent element on which reactElement will be rendered,
    re-rendered or attached for the first time (mount.)


    You can use render multiple times, if you need to update properties of the component.


    Here''s what a real-life scenario might look like. In this example we''re taking
    a ReactElement and rendering it on a DOM node:


    | ReactDOM.render(    React.createElement("div"),    document.getElementById("container"));
    |


    If you have an element already associated with a variable name, you can look it
    up using ReactDOM.findDOMNode:


    | ReactDOM.findDOMNode( element ); |


    This statement returns the DOM node associated with the given element. Note, that
    this will only work only after element has been rendered to the DOM with the render
    method. Until then, it is not findable in the DOM, even if it was already created.


    # Special Props


    Here we will briefly talk about special prop names, of which there are a few.
    These should be treated almost like reserved keywords in JavaScript, except in
    React. They all have a special meaning.


    Children


    The prop name children is automatically added to this.props by React.createElement


    className


    This prop corresponds to the HTML''s class attribute. You must use className in
    your components/elements instead of name to avoid clashing with HTML''s reserved
    keyword.


    htmlFor


    Same as className only for the "for" attribute. htmlFor should be used in your
    React element anywhere where you need to use "for" attribute.


    key


    The key prop uniquely identifies a ReactElement. It''s used with elements in arrays.


    ref


    The ref prop accepts a callback function which will be called:


    1.  With the component instance of DOM node on mount.


    2.  With null on unmount and when the passed in function changes.


    style


    The style prop accepts an object of styles, instead of a string. In React, there
    is no mechanism for specifying CSS styles as a text string. This is one of the
    limitations of using JSX.


    But this limitation can also be looked at as an advantage, because CSS styles
    can now be represented programmatically, where each property of the CSS-style
    object represent CSS property pairs.


    It might feel a little awkward at first but this style actually adapts much better
    to the overall scheme of React programming.


    # PropTypes


    React has a special property called PropTypes. Typechecking is its primary purpose.
    As your app becomes large in size, type checking can help catch various bugs.


    Here is an example. Let''s say we already have a React component created, and
    named ReactComponent. By default typechecking is enabled in development mode.
    It is actually not turned on in production code.


    | ReactComponent.propTypes = { name: React.PropTypes.string}; |


    What React.PropTypes does is it turns on validation for the type of the data stored
    in a property. By default React has a number of data validators, and if a Numeric
    data type is passed to a prop defined as String (as shown in example above) then
    you will see a warning in JavaScript developer''s console in Chrome or other browsers.


    The propTypes in React are defined as follows:


    | anyarrayboolelementfuncnodenumberobjectstring |


    # Class Component Options


    We''ll speak about components a lot more throughout the rest of the book. They
    are the building blocks of your react application. But remember that this is "React
    on the Palm of Your Hand" section! Let''s briefly overview the full scope of a
    React component, its options and methods available by default in React library.
    Components are defined by createClass method existing on the main React object:


    | var MyComponent = React.createClass({    displayName: ''MyComponent'',    /*
    This is the core of your React Class        options and lifecycle methods will
    be written here */ render:  function() {        // Once rendered, let''s return
    a newly created element return React.createElement( /* … */ );    }}); |


    This is the basic structure of a component class.


    Component Options'
