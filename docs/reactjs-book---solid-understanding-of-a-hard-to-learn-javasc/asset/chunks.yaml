    Place this code into the main .js file of your application and run it. It will
    result in basic drop down functionality. Typing partial animal names will filter
    them out from the main list. Ideally, you would load this list from a database
    or some other data storage mechanism.


    As you can see, depending on the type of an application you are designing (and
    in this case, the application is very simple) you may or may not use any of the
    mounting or updating methods just based on the nature of the elements your component
    represents.


    I hope this provides enough ammunition to start writing your own React application.


    Just as the case is with JSX, programming in React assumes knowing many different
    things. One of those things is the EcmaScript 6 specification. This is important
    because ideally, as part of learning how to make React applications you want to
    transition from old-style ES5 syntax to ES6, the standard that in about one to
    two years will be normally supported in all modern browsers such as Chrome, Firefox
    and Safari without having to transpile the code by using additional tools.


    The rest of the book will deal with going over some of the most important changes
    to JavaScript language that were applied in EcmaScript 6.


    EcmaScript 6 - Things You Need to Know


    When React was created, it started out when ES5 specification was in the spotlight.
    It was still new and fresh in 2015 and even throughout 2016\.


    However, by 2017 it started to progressively adapt to ES6 syntax. And this is
    why it''s important to talk about the significant changes that were applied to
    this new standard while studying React.'
