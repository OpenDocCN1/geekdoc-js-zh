    \n观看这个教程应该能帮助你开始通过 localhost 地址在 PC 上编写 React 应用。所以在那个视频教程中，我将一步步带你完成整个过程。我不想在书中重写这些细节以占用更多空间。你可以以\
    \ 2 倍速度观看，并在 25 分钟内过完。\n\n# 宝石 8 - JSX 详解\n\n如果你已经开始学习 React，你应该听过很多关于 JSX 的内容。你可能也听说过\
    \ React 并不使用它。这在很大程度上是正确的。但建议你这样做。它让事情变得简单得多，尽管它的语法对传统的 JavaScript 开发者来说初看起来可能很吓。\n\
    \nJSX 以让你可以在 JavaScript 中“编写 HTML”的语言而闻名。这在某种程度上是真实的。预期的效果是我们可以将 HTML 标签视为 JavaScript\
    \ 语句。然而，JSX 实际上使用的是类似于 HTML 的形式，因为它使用的标签名称与标准 HTML 标签匹配，例如 `DIV`、`UL`、`TABLE`\
    \ 等。记住 HTML 只是 XML 的远亲。\n\n虽然作为 JavaScript 语句的 HTML 看起来看起来看起来古，一旦你理解了这个想法并习惯了它，它就变成了本能。这绝对是全新的，且通常不会这样做（在目前大多数浏览器中甚至无法编译），但让我们看看它实际上是什么样的：\n\
    \n```jsx\nvar scoreBoard = { Player1: 10, Player2: 25 };\n<div className=\"class1\"\
    \ />\n<SomeCounter count={3 + 5} />\n<ScoreBoardUnit data-index=\"2\">\n  <h1>Score\
    \ Leaderboard</h1>\n  <Scoreboard className=\"results\" scores={scoreBoard} />\n\
    </ScoreBoardUnit>;\n```\n\n这段代码在你的标准浏览器中自然地无法编译，除非 Babel 的 JSX 插件帮助我们将其转换回 ES5，即我们可以确定所有现代浏览器都能理解的规范。在这种情况下，它将编译成以下\
    \ React 元素。\n\n```javascript\nvar scoreBoard = { Player1: 10, Player2: 25 };\n\
    React.createElement( 'div', { className: 'class1' }, null)\nReact.createElement(\
    \ SomeCounter, { count: 3 + 5 }, null)\nReact.createElement( ScoreBoardUnit, {\
    \ 'data-index': 2 },\n  React.createElement( 'h1', {}, 'Score Leaderboard'),\n\
    \  React.createElement( Scoreboard, { className: 'result', Scores: scoreBoard\
    \ }, null)\n) // 关闭 React.createElement( ScoreBoardUnit...\n```\n\n"
- fmt: '

    These JSX and React code examples can be used synonymously. As long as you have
    JSX transpiling your code in the background, it will work and you can interchange
    between the two. And while JSX is highly recommended for combining with `React`
    it is not necessary for using with or compiling `React` programs. Just use `createElement`
    syntax without JSX, if you must.


    However if you wish to get it done right, to get started with the transpiling
    process, I recommend watching the tutorial from Gem 7 to get familiar with the
    complexity of transpiling process via `Babel`.


    It takes a bit of patience to set up `Babel` and `JSX`, but it''s so worth it.
    Just go through the video tutorial and follow instructions on how to set it up
    on your own machine.


    Once your files are actively transpiled into `ES5`, you can begin using `JSX`
    in your own programs.


    As you can see from the example above, this is like writing HTML tags while treating
    them as JavaScript statements. Of course, this code takes place within some `.js`
    file itself. This isn''t HTML.


    Note how `DashboardUnity` is really just an XML tag. It contains children, just
    as you would expect from any other standard XML code. The reason it works is because
    it''s processed by `JSX` language processing mechanism. It''s a bit like learning
    a new language, but because it''s likely you already know HTML syntax, it''s not
    difficult to figure it out.


    The only primary difference is that curly brackets `{ }` can now also be used
    right within JSX statements under tag attribute names. The whole tag `Scoreboard`
    is treated as an object. And its attribute `scores` is just its property which
    contains the value specified earlier in code by a JavaScript object `scoreBoard`,
    which is an JSON JSON-literal object notation for creating objects.


    This might seem a bit awkward at first, but this gives you tremendous control
    over your application. It unifies `document.getElementById` (or `jQuery`s equivalent
    of `$("#id").attr("scores")`) which is the method you would otherwise have to
    use just to access a property, into a new format.


    This format allows not only writing attributes directly into your HTML elements
    (as `JSX`) and assign them to already-existing variables/objects, but also treat
    HTML as a JavaScript statement itself. This is great, because imagine that you
    can now return HTML code as a JavaScript statement from a function, and then pass
    it on to some other abstract method in your application. It''s like tossing HTML
    between functions and preparing it for output in one of the containers in your
    application.


    One more thing. You will notice that `JSX` uses `className` instead of just `"class"`
    as in traditional DOM object. The `JSX` docs explain it as "Since `JSX` is JavaScript,
    identifiers such as `class` and `for` are discouraged as attribute names." So
    this is why `class` has become `className`, and `for` has become `htmlFor`.


    To learn more about `JSX` you should check out the official `JSX` documentation.
    Again, another book could be written just about the subject, and we''re trying
    to get the basic out of the way so we can focus on `React` throughout the rest
    of this book.


    # Writing React.js Applications


    Welcome to the second part of `React Gems`. In this section we are leaving the
    gem format behind us because the first part of the book was designed to simply
    get familiar with the most common principles of `React` programming and modern
    software development.


    This theory will help us investigate the practical aspects of programming with
    `React` library. So let''s get going and start by writing our very first `React`
    component.


    # Lesson 1 - Writing your first React Component


    Below you are seeing a compact example of what the very first `React` component
    you might write would look like. It simply renders the generic Hello World message
    into a `DIV` element. And it fits on just one line of code.


    ```javascript

    React.createClass({render: function() { return (<div>Hello World.</div> ) });

    ```


    Here, we are using main `React` library object''s method `createClass`. This is
    how components are created. But what''s this code in blue? It looks like HTML,
    without double quotes surrounding it!


    Components are usually stored in variables.


    For example:


    ```javascript

    var HelloWorld = React.createClass( { .. } );

    ```


    Storing components in variable names can help us later on when we create parent-child
    associations between our elements. Which is just a way to programmatically create
    relationships between nested components.


    Some of this code will appear a bit peculiar especially if you''re coming from
    traditional JavaScript programmer background. It''s the `JSX` code highlighted
    in blue that seems like it doesn''t fit in.


    But remember that `React` programming is associated with using additional tools.
    `React` library by itself is supposed to be just one part of your entire application.
    No one writes React apps using `React` library by itself. It''s just one single
    stone in the wall.


    In `React` we can write HTML inside JavaScript. This is the reversal of the traditional
    "JavaScript inside HTML" idea we''ve gotten used to over the years, where we write
    JavaScript inside HTML''s attribute tags (like `onclick = "this.style.color=''red'';"`
    for example.


    But `React` gives us ability to do the opposite. We''ll find out why as we move
    forward. For now let''s expand on creating components and then I''ll provide a
    brief explanation how `JSX` helps us deal with blocks of HTML and treat them as
    return values.


    Having said that... let''s move onto the complete example of creating our first
    `React` component and rendering its content within a specific HTML element:


    ```javascript

    // Add required library code

    var React = react("react");

    var ReactDOM = require("react-dom");

    // Create our first react component "HelloWorld"

    var HelloWorld = React.createClass( {render: function() {

    return(<<div>Hello World.</div> )

    });

    // Draw "HelloWorld" component inside HTML element whose id is "app"

    ReactDOM.render(<HelloWorld />, document.getElementById("app"));

    ```


    Notice that our newly created component `HelloWorld` has its own render method.
    But the `ReactDOM` object which acts like primary rendering engine also has a
    render method of its own. The correlation between the two is that `ReactDOM.render`
    calls render method of the component it''s passed as the first argument. Which,
    in this case is our `HelloWorld` component.

    '
