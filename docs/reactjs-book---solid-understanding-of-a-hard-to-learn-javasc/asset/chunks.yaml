  trans: "\n\n`render` 方法将此组件挂载到 DOM 中。这个过程之所以被称为“挂载”（mounting），其原理与虚拟硬盘类似。如果你曾经在电脑上挂载过虚拟\
    \ CD-光驱或硬盘，你就知道它是如何工作的了。该硬盘在物理上并不存在。出于相同的原因，这就是为什么这类软件被称为虚拟硬盘，或者虚拟 CD-光驱。这也是为什么虚拟驱动器具有“挂载此驱动器”之类的功能的原因。\n\
    \n同样，React 中虚拟 DOM 背后的原理也是相同的。在它被挂载之前，无法对其进行操作。这使得 React 比普通的 DOM 操作快得多。这可能也是最初使用\
    \ React 的主要原因之一。React 在内存中存储了 DOM 的快速表示。\n\n但这个虚拟 DOM 甚至与 JavaScript 的 DOM 没有任何关联。它并排存在，只有在需要时才会渲染到屏幕上的实际\
    \ DOM 中。通常是当代表元素的组件使用新传入的数据进行实际更新时。\n\n本质上，React 的设计目标是仅在需要时才更新屏幕上的组件。这种方法的另一个优势是它可以将你的应用程序与后端分离，同时有效地执行负责更新屏幕的函数，且这些函数几乎是在发生时瞬间完成的。\n\
    \n你选择使用什么作为前后端之间的通信桥梁完全取决于你。React 并不关心这一点。它的目的严格限制于尽可能快地更新视图。\n\n这种挂载机制使得 React\
    \ 成为一个多功能的库。因为从基本原理上说，React 并不关心最终结果是渲染在 DOM 中还是其他地方。\n\n你可以将 React 的输出渲染为 XML\
    \ 文档，将其视为自定义对象数据，或返回 JSON。它结合了熟悉的编程原理，并尝试做到“全人的一切”。这使得 React 成为一个编写用户界面以及调整自定义软件实现时极其强大的工具。\n\
    \n现在，很有可能如果你是从传统的 2015 年之前的 JavaScript 背景转到 React 的……与学习 jQuery 不同，学习 React 是一个投入得多的过程。它涉及到学习软件开发原理，而不是学习一组方法名，然后你就可以出发了！\n\
    \n然而，它确实有一些方法在 React 程序员之间正变得标准化。我们将在接后的学习中探索它们。仅仅知道它们，而不理解 React 背后的基本哲学是不够的。\n\
    \n# 宝石 7 - Node.js & NPM\n\n当我说学习 React 涉及比学习 React 库多多的内容时，这确实是事实。至少，使用 React\
    \ 要求你安装 `Node` 库。\n\n单单 Node 就可以写另一整本书了，但对于 React 库，我们需要安装它有几个原因：\n\n1. 为我们的 React\
    \ 应用提供一个 localhost 环境。安装 Node 让你能够从本地机器上的 `http://localhost` 运行你的应用程序。\n2. Node\
    \ 自动带有 Babel 和 JSX 支持（JSX 是作为 Babel 插件安装的）。\n\n在 Mac（通过终端）和 PC 上安装 Node 和 `NPM`\
    \ 都异常地简单。在 PC 上，这和从其官方网站下载 Node 安装文件一样简单。运行安装程序就大搞定了。只需不要忘记在安装期间勾选 babel 复选框，这样它也会被包含进去。\n\
    \n在 Mac 上，你可以通过命令行下载 Node。打开你的终端应用程序并输入：\n\n```bash\n$ wget http://nodejs.org/dist/node-v0.4.4.tar.gz$\
