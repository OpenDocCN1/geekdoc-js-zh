  trans: "\n\n```javascript\nvar MyComponent = React.createClass( {\n  displayName:\
    \ 'MyComponent', // 这几乎就像组件的构造函数！\n  getInitialState: function() { … }, // 组件挂载事件\n\
    \  componentWillMount: function() { … },\n  componentDidMount: function() { …\
    \ },\n  componentWillUnmount: function() { … },\n  // 组件更新事件\n  componentWillReceiveProps:\
    \ function() { … },\n  componentWillUpdate: function() { … },\n  componentDidUpdate:\
    \ function() { … },\n  shouldComponentUpdate: function() { … }\n  // 将组件渲染到 DOM\n\
    \  render: function() { /* 返回某些内容 */ }\n});\n```\n\n这里有很多许多 `Will` 和 `Did` 方法。但它们到底是什么意思呢？\n\
    \n这些方法就像是我们组件的控制中心！\n\n下面我将为这些每一个方法在组件生命周期中负责的每一个事件提供简要描述。\n\n`getInitialState`\
    \ 的作用类似于组件的构造函数。它在组件渲染到屏幕之前被调用。\n\n`componentWillMount` 在 `render()` 方法执行之前仅会被调用一次。在组件的整个生命周期内它不会被再次调用。有时被用作组件构造方法的同词。\n\
    \n`componentDidMount` 在组件首次渲染之后立即被调用。\n\n`componentWillUnmount` 在组件即将销毁时被调用。这是清理内存和删除状态的地方。\n\
    \n`componentWillReceiveProps` 在 props 传递给组件时被调用。例如，如果你有一个 `Form` 组件和一个 `TextInput`\
    \ 组件，允许用户通过在其中输入文本来更改其值。想象一下 `TextInput` 有一个 `onchange` 事件，它向组件传递一些 props。一旦新文本被输入输入框中，该值就会作为\
    \ props 传递给主组件。这就是 `componentWillReceiveProps` 被触发的时刻。\n\n`componentWillUpdate`\
    \ 在组件上执行 `render` 方法正之前被调用。它给了我们一个机会，在下一次渲染更新之前处理任何状态更改。\n\n`componentDidUpdate`\
    \ 在 `render()` 方法完成对 DOM 更新之后立即被调用。\n\n`shouldComponentUpdate` 是一个默认方法，它总是返回 `true`。它允许我们控制组件元素是否应该在\
    \ DOM 中更新。情况并非总是如此。例如，如果组件中某个状态或属性的新结果与它之前设置的值相同，那么可能就不值得更新 DOM。如果即使在更新后数据也没有变化，为什么要将数据发送到视图呢？\n\
    \n这些方法对于理解虚拟 DOM 至关重要。当我们逐个剥离 React 编程的原理时，一切将开始变得合乎逻辑。\n\n目前只需知道一个 React 组件通常被挂载到一个渲染目标上。这就是为什么上面提到的某些默认方法使用“mount”（挂载）一词，而不是你预期的传统的\
    \ setter 或 getter 方法（如“set”或“get”）。挂载是使用 React 编程以及在 React 的 虚拟 DOM 生态系统中创建的组件所特有的概念。\n\
    \n我们已经从理论上讨论了组件。但在实践中，组件是什么呢？记住你的应用程序是由模块化的元素组成的。组件 literal 上可以是任何东西，从按钮、文本输入框、复选框到显示文本的状态区域。你将根据应用程序的目的确定你的组件的设计。\n\
    \n由于我们刚刚讨论了处理组件“挂载”的方法，那么在我们的下一个章节中探索它的含义是理所当然的！\n\n# 第 6 章 - 组件挂载 (Component\
    \ Mounting)\n\nReact 是一个重视编程原则的库。其中之一就是将组件视为元素。组件是一种以程序化（声明式）的方式来渲染你在应用程序中想要显示的内容。\n\
    \n但 React 实际上并不关心你选择在何处或如何渲染这些元素。无论是在 JavaScript DOM 还是其他地方。这听起来可能很惊讶，因为 React\
    \ 以主要作为一个前端库而闻名。\n\n这是因为 React 使用了被称为“渲染目标”（render targets）的东西。也就是说，你决定 React\
    \ 的 `render` 方法的结果将如何显示或传递到其他地方。\n\n换句话说，你可以说 React 在处理其组件内部存储的数据或状态的输出时是与无关的（agnostic）。\n\
    \n例如……你可以从组件中输出数据到文件写入函数。换句话说，React 的渲染目标不仅限于 UI 元素，尽管在本书的大部分内容以及一般的 React 风格编程中，这会是你将处理的大部分内容。\n\
    \n在上一个章节中，我们讨论了每个组件如何处理它自己的状态。状态可以是一个布尔标志，表示按钮是否被高亮显示。或者导航菜单选项是否被选中。\n\n现在，如果你一直在关注，这里就是一切开始联系起来的地方。一个\
    \ React 组件是其状态与其渲染方法之间的融合。我们在一个地方就获得了对 UI 元素最重要的两个函数的程序化控制。\n\n但“挂载”（mounting）到底是什么？在\
    \ React 中，出于性能考虑，我们使用了 DOM 的虚拟表示。\n\n通过简单创建一个组件，任何 DOM 元素都不会被触及。这是一个极好的消息，但这如何可能呢？这是因为使用原生\
    \ DOM 会增加我们应用程序的内存占用。然而，通过 React 的虚拟 DOM，元素只有在应用程序需要使用时才被创建。\n\n我将更详细地解释这一点。\n\
    \nReact 是一个同构框架（isomorphic framework）。它的功能可以映射到任意输出。而不是 JSX 风格的 HTML UI 元素。\n\n\
    `react` 库提供的虚拟 DOM 正是那样：虚拟的。在它实际上被应用程序需要之前，它在物理上并不存在于 JavaScript DOM 中。\n\n只需这样想：JavaScript\
    \ 的 DOM 是存储在内存中的 HTML 元素的物理树。它在页面加载到浏览器时被填充。\n\n通常，当一个页面加载到应用程序时，每个由 HTML 元素表示的\
    \ DOM 分支都会加载到根元素中，无论它将如何被使用，或者是否会显示在屏幕上。即使页脚在折线以下（below the fold），它也会加载到 DOM 中。\n\
    \n而 React 反而甚至不会触及那棵 DOM 树。正如在之前的章节中讨论过的，它从自己的虚拟 DOM 中添加或删除组件，而虚拟 DOM 是完全存储在内存中的。只有当组件在应用程序中被专门使用时，元素会在渲染目标的内存中变为物理表示。这就像是将虚拟\
    \ DOM 复制并粘贴到渲染目标，无论目标是什么。在 Web 应用程序的情况下，当然是 JavaScript DOM 树。\n\n我通过以下示例来演示：\n\
    \n```javascript\nvar component = React.createElement( ComponentDefinition );\n\
    ```\n\n此时 `component` 是 `ComponentDefinition` React 类型的实例，这是我为了这个示例而虚构的。在现实中，它对应于像\
    \ `LoginScreen`、`NavigationMenu` 或 `Button` 的组件。并且包含了我们在书中早期章节中已经看到的标准组件定义代码。\n\
    \n它仅仅是一个 React 类型。它在主要的 JavaScript 文档（DOM）对象中尚未物理存在。除了作为一个 React 节点之外，在任何其他地方都找不到它。\n\
    \n"
- fmt: "\nThe `render` method mounts this component to the DOM. The reason this process\
    \ is referred to as mounting is similar to virtual hard drives. If you've ever\
    \ mounted a virtual CD-Rom or hard drive on your computer, you know how it works.\
    \ The hard drive doesn't physically exist. For the same reason, this is why this\
    \ type of software is called virtual hard drive. Or virtual CD-Rom. And this is\
    \ why virtual drives have features like \"mount this drive.\"\n\nLikewise, this\
    \ is the same principle behind virtual DOM in React. Until it is mounted, it cannot\
    \ be operated upon. This is what makes React so much faster than regular DOM operations.\
    \ And this is probably one of the top reasons for using React in the first place.\
    \ React stores a fast in-memory representation of the DOM.\n\nBut this virtual\
    \ DOM is not even associated with the JavaScript's DOM. It exists side by side,\
    \ and renders into the actual DOM on the screen only when it becomes necessary.\
    \ Usually, when the component representing an element is actually updated with\
    \ new incoming data.\n\nEssentially, React is designed to update components on\
    \ the screen only when they need to be. Another advantage of doing it this way\
    \ is that it separates your application from the back end, while effectively executing\
    \ functions that are responsible for updating the screen almost instantaneously\
    \ as they occur.\n\nWhat you choose to use as a communication bridge between the\
    \ back end and the front end is entirely up to you. React doesn't care about it.\
    \ Its purpose is strictly limited to updating the view as fast as possible.\n\n\
    This mounting mechanism make React a versatile library. Because at its basic principle,\
    \ React also doesn't care whether the final result is rendered in the DOM or elsewhere.\n\
    \nYou can render React output into an XML document, treat it as custom object\
    \ data, or return a JSON. It combines familiar programming principles and tries\
    \ to be \"everything for everyone.\" This is what makes React an incredibly powerful\
    \ tool for programming User Interfaces as well as fiddling around with custom\
    \ software implementations.\n\nNow, chances are that if you're coming to React\
    \ from traditional pre-2015 JavaScript background… unlike studying jQuery, learning\
    \ React is a much more involved process. It pertains to learning software development\
    \ principles rather than learning a set of method names and you're ready to go!\n\
    \nHowever, it does have a few methods that are becoming standardized among React\
    \ programmers. We'll explore them as we move forward. Simply knowing them, without\
    \ understanding the fundamental philosophy behind React is just not enough.\n\n\
    # Gem 7 - Node.js & NPM\n\nWhen I said that studying React involves learning much\
    \ more than just React library, it was certainly true. At the very least, working\
    \ with React requires that you install the `Node` library.\n\nA whole another\
    \ book can be written just about Node alone, but with regard to React library,\
    \ we need to install it for several reasons:\n\n1. To provide a localhost environment\
    \ for our React application. Installing Node gives you the ability to run your\
    \ applications from `http://localhost` on your local machine.\n2. Node automatically\
    \ comes with Babel and JSX support (JSX is installed as a Babel plugin.)\n\nInstalling\
    \ Node and `NPM` is surprisingly easy on both Mac (via the terminal) and the PC.\
    \ On the PC it's as easy as downloading the Node installation file from their\
    \ official website. Run the installation program and you're all set. Just don't\
    \ forget to check the babel checkbox during installation, so it's also included.\n\
    \nOn a Mac, you can download Node via command line. Pop open your Terminal application\
    \ and type:\n\n```bash\n$ wget http://nodejs.org/dist/node-v0.4.4.tar.gz$ tar\
    \ -xzf node-v0.4.4.tar.gz$ cd node-v0.4.4$ ./configure$ sudo make install\n```\n\
    \nThat's it! The configuration log will run and then you're done.\n\nOn Ubuntu,\
    \ you might want to run this additional command to install essential components:\n\
    \n```bash\n$ apt-get -y install build-essential\n```\n\nIt looks like at this\
    \ point node is installed and ready to be utilized for giving us a localhost http\
    \ address where we can test our React code.\n\nHowever, the good news is that\
    \ if you already have Apache server installed on your localhost machine, and it's\
    \ mapped to your development folder, using node for providing localhost environment\
    \ is not necessary. You already have it set up.\n\nIn this case, you can just\
    \ start writing React programs right inside your existing Apache httpdoc folder,\
    \ or whatever folder it is mapped to on your machine. Just create a new folder\
    \ in that directory for example \"my-react-app\", and as usual your project will\
    \ be available for access via browser under something like:\n\n`http://localhost/my-react-app`\n\
    \nHowever, it is highly recommended that you do install Node. If for any reason,\
    \ it's because it comes with command line version of Babel and JSX plugins, which\
    \ will be required for proper development environment set up.\n\nThe installation\
    \ is really straightforward on a Mac in terminal. But on PC it is just a bit more\
    \ challenging, especially if you've never done this before.\n\nIf you are still\
    \ unsure on how to do any of this on a PC I recorded a 58-minute supplementary\
    \ tutorial on YouTube, available for free at the following location:\n\nReact\
    \ JS Tutorial 1 - For Beginners | ReactJS JavaScript ES6 Node.js, NPM, Babel Transpiler,\
