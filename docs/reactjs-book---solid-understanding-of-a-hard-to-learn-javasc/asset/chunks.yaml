    # React.js 教程书籍


    React 绝对是我在 JavaScript 库中学习过最困难的内容之一。部分原因是，因为它假设你已经掌握了许多与专业 Web 开发相关的知识。即：`Node.js`、`NPM`、精通
    `babel` 命令行工具、`EcmaScript`（ 5 版和 6 版）、`JSX` 以及可能的 `WebPack`。


    这本书还做了一个假设：你对 React 编程完全是新手。这对我这个作者来说构成了一个挑战，因为我有责任用一种仍然有意义的方式来讲解 React，而不会用大段看起来复杂且难以理解的代码块让你目不暇接。


    尽管如此，我对本书呈现形式的策略遵循一个简单的模式，即将解释与简单的代码示例混合。主要来说，这本书是一部旨在逐步深入理解 React 库的叙述性书籍。


    我现在直接明确，单凭这一这本书是不够成为一名 React 专家程序员的。任何关于 React 的出版物都无法做到这一点，因为为了入门并开始编写真正的 React
    应用程序，你需要理解的原则范围极其广泛。此外，`EcmaScript` 5、`6` 以及即将到来的 `7` 之间还存在语法差异。由于这个原因，React 可能成为你在
    JavaScript 领域过的最特殊的学习经历之一。


    但突破困难部分是值得的。我希望这本书在完成这一任务方面证明自己是实用的。


    作者与编辑：Greg Sidelnikov greg.sidelnikov@gmail.com


