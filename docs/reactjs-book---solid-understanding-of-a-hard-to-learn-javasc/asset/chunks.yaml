    own programs.


    As you can see from the example above, this is like writing HTML tags while treating
    them as JavaScript statements. Of course, this code takes place within some .js
    file itself. This isn''t HTML.


    Note how DashboardUnity is really just an XML tag. It contains children, just
    as you would expect from any other standard XML code. The reason it works is because
    it''s processed by JSX language processing mechanism. It''s a bit like learning
    a new language, but because it''s likely you already know HTML syntax, it''s not
    difficult to figure it out.


    The only primary difference is that curly brackets { } can now also be used right
    within JSX statements under tag attribute names. The whole tag Scoreboard is treated
    as an object. And its attribute scores is just its property which contains the
    value specified earlier in code by a JavaScript object scoreBoard, which is an
    JSON-literal object notation for creating objects.


    This might seem a bit awkward at first, but this gives you tremendous control
    over your application. It unifies document.getElementById (or jQuery''s equivalent
    of $("#id").attr("scores")) which is the method you would otherwise have to use
    just to access a property, into a new format.


    This format allows not only writing attributes directly into your HTML elements
    (as JSX) and assign them to already-existing variables/objects, but also treat
    HTML as a JavaScript statement itself. This is great, because imagine that you
    can now return HTML code as a JavaScript statement from a function, and then pass
    it on to some other abstract method in your application. It''s like tossing HTML
    between functions and preparing it for output in one of the containers in your
    application.


    One more thing. You will notice that JSX uses className instead of just "class"
    as in traditional DOM object. The JSX docs explain it as "Since JSX is JavaScript,
    identifiers such as class and for are discouraged as attribute names." So this
    is why class has become className, and for has become htmlFor.


    To learn more about JSX you should check out the official JSX documentation. Again,
    another book could be written just about the subject, and we''re trying to get
    the basic out of the way so we can focus on React throughout the rest of this
    book.


    Writing React.js Applications


    Welcome to the second part of React Gems. In this section we are leaving the gem
    format behind us because the first part of the book was designed to simply get
    familiar with the most common principles of React programming and modern software
    development.


    This theory will help us investigate the practical aspects of programming with
    React library. So let''s get going and start by writing our very first React component.


    # Lesson 1 - Writing your first React Component


    Below you are seeing a compact example of what the very first React component
    you might write would look like. It simply renders the generic Hello World message
    into a DIV element. And it fits on just one line of code.


    | React.createClass({render: function() {        return (            <div>Hello
    World.</div>        )    }}); |


    Here, we are using main React  library object''s method createClass. This is how
    components are created. But what''s this code in blue? It looks like HTML, without
    double quotes surrounding it!


    Components are usually stored in variables.


    For example:


    var HelloWorld = React.createClass( { .. } );


    Storing components in variable names can help us later on when we create parent-child
    associations between our elements. Which is just a way to programmatically create
    relationships between nested components.


    Some of this code will appear a bit peculiar especially if you''re coming from
    traditional JavaScript programmer background. It''s the JSX code highlighted in
    blue that seems like it doesn''t fit in.


    But remember that React programming is associated with using additional tools.
    React library by itself is supposed to be just one part of your entire application.
    No one writes React apps using React library by itself. It''s just one single
    stone in the wall.


    In React we can write HTML inside JavaScript. This is the reversal of the traditional
    "JavaScript inside HTML" idea we''ve gotten used to over the years, where we write
    JavaScript inside HTML''s attribute tags (like onclick = "this.style.color=''red'';")
    for example.


    But React gives us ability to do the opposite. We''ll find out why as we move
    forward. For now let''s expand on creating components and then I''ll provide a
    brief explanation how JSX helps us deal with blocks of HTML and treat them as
    return values.


    Having said that... let''s move onto the complete example of creating our first
    React component and rendering its content within a specific HTML element:


    | // Add required library codevar React = react("react");var ReactDOM = require("react-dom");//
    Create our first react component "HelloWorld"var HelloWorld = React.createClass(
    {render: function() {return (<div>Hello World.              </div>        )   
    }});// Draw "HelloWorld" component inside HTML element whose id is "app"ReactDOM.render(<HelloWorld
    />, document.getElementById("app")); |


    Notice that our newly created component HelloWorld has its own render method.
    But the ReactDOM object which acts like primary rendering engine also has a render
    method of its own. The correlation between the two is that ReactDOM.render calls
    render method of the component it''s passed as the first argument. Which, in this
    case is our HelloWorld component.


    Here, we first include the aforementioned React and ReactDOM libraries. You will
    be required to do that when starting a new reactive application from scratch.
    This is what initializes React.


    Next, once we have React included in our project, we will create a new instance
    of React class, using the React.createClass method. This isn''t the only way to
    initialize a React app but we''ll stick to this example in this chapter.


    Finally, we call ReactDOM''s own method .render. And <HelloWorld/> here is the
    variable name HelloWorld we assigned the dinosauric React code to. Basically,
    the React''s render method takes two arguments.


    You simply pass what you want to render as the first argument and where you want
    to render it as the second (in this case it''s the HTML element whose ID is "app".)
    So from now on Whatever we assigned to HelloWorld variable will be rendered in
    an element like [div id = "app"]


    And this is really the basic idea behind React programming. You build components
    and make them do things within specific HTML elements. Virtual DOM automatically
    takes care of fast rendering in the front view of your application.


    But there is one more thing...


    The HTML code highlighted in blue is the part that will be written into the component''s
    rendering area. Yes, we simply type HTML direct into JavaScript statement. Again,
    this functionality is enabled by installing the JSX plugin from your node.js via
    babel.


    The process of setting this up is a bit complicated. But this is shown in more
    detail in my YouTube tutorials and also later in this book.'
