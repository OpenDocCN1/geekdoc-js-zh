    \ to wait until the HTML elements have finished loading until starting JavaScript.\n\
    \nIn the same way, arrow functions can be used to achieve equivalent result.\n\
    \n```javascript\n(() => { ... })()\n```\n\nThis syntax is referred to as Immediately\
    \ Invoked Arrow Functions. The parentheses surrounding it make the function execute\
    \ at that place.\n\n## Backtick (`) Strings\n\nBacktick is just another name for\
    \ the quirky quote character, also known as grave accent.\n\nStatements like `${\
