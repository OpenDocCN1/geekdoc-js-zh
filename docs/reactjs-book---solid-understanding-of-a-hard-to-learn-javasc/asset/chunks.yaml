- fmt: "\nAll I did in this example was assign this object to the newly created that\
    \ variable within `main` `Sprite` object's scope. Before timer was defined. So\
    \ in reality we now have something like `this.that` within `Sprite`.\n\nI also\
    \ changed this to `this.that` within `setTimeout(function() { ... });`.\n\nLet's\
    \ run our code this time and see what happens now:\n\n5\n\nThe value of `this.that`\
    \ is `5`. This happened when we bound this object to variable called `that`.\n\
    \nI am sure you have used the trick I just described in the examples above before.\
    \ If not, well I'm glad you know about it now. Most programmers discover it by\
    \ instinct. Because it takes time to learn the difference in JavaScript scoping\
    \ rules between function objects and anonymous events within those functions.\n\
    \nAnd after all these explanations with a big smile on our face this finally brings\
    \ us to our big final question!\n\n## What are Arrow Functions in JavaScript?\n\
    \nAnd what is the difference between an arrow function and anonymous functions\
    \ in JavaScript?\n\nAn arrow function in JavaScript is an anonymous function with\
    \ shortened syntax. The only two differences vs standard anonymous function is\
    \ in syntax and how `this` object is treated within its scope. A small detail,\
    \ which slightly changes in how the two actually operate when it comes to binding\
    \ of `this` object.\n\nLet's compare a regular JavaScript anonymous function with\
    \ an arrow function equivalent. We already know what anonymous functions like\
    \ `function(){...}` in JavaScript look like. But arrow functions actually have\
    \ a distinct syntax.\n\nNotice that both do exactly the same thing, execute some\
    \ code. Except arrow functions automatically take care of the cumbersome `this`/`that`\
    \ juggling we have just experienced in the previous examples. Arrow functions\
    \ create their own local `this` object that doesn't change. So we never have to\
    \ rename or bind it to another variable such as `that`, like in previous example.\n\
    \nThis is the new syntax in EcmaScript 6 that defines new arrow function in JavaScript:\n\
    \n```javascript\n() => { };\n```\n\nA word of caution. Arrow functions in JavaScript\
    \ do not work with `new` operator. They are anonymous and are usually used for\
    \ events.\n\nBut there also exist syntactic variations:\n\n```javascript\n(a,\
    \ b) => { ... } // Multiple parameters\na => { ... }     // Single parameter\n\
    ```\n\nNote that `params` can include a set of multiple parameters separated by\
    \ comma. In which case you must always use parenthesis. For single parameter syntax,\
    \ you don't have to use parenthesis.\n\nIn a real world-scenario we can also assign\
    \ arrow functions to a variable name. In this case the anonymous arrow function\
    \ becomes named. The function returns the result from within its body's scope.\n\
    \n```javascript\nvar add = (a, b) => { return a + b; }\n```\n\nHaving said that...\n\
    \n```javascript\nadd(1, 2); // returns 3\n```\n\nBut there is another, scope-less\
    \ variation syntax for defining arrow functions:\n\n```javascript\nvar add = (a,\
    \ b) => a + b;\n```\n\nNotice that the return value here is represented by a regular\
    \ JavaScript statement.\n\nThis will produce exactly the same result. We removed\
    \ `return` statement. But the function will still return the value of `a + b`.\
    \ In this case `a + b` is a JavaScript statement, without a scope body. By default,\
    \ an arrow function specified without a scope returns the value of the statement\
    \ even if `return` keyword is not specified.\n\nAnd finally let's put it all together\
    \ and rewrite our original example of the `Sprite` object. Only now using an arrow\
    \ function. You can see that there is no necessity to create and set binding of\
    \ `this` to `that` variable anymore. Arrow functions take care of that for you,\
    \ for us!\n\n```javascript\n/* A significantly simplified Sprite object in JavaScript\
    \ */\nvar Sprite = function() {\n  this.angle = 5;\n  this.draw = function() {\n\
    \    alert(this.angle); // display sprite's angle\n  }\n  var timer = setTimeout(\
    \ () => {\n    // note the use of arrow function here\n    alert(this.angle);\
    \ // display \"5\" using \"this\", not \"that\".\n  });\n};\nvar ship = new Sprite();\
    \ // instantiate ship\n// ship.draw(); draw the ship with this.angle rotation\
    \ angle\n```\n\nWe simply switched standard anonymous `function(){...}` commonly\
    \ used as the event handler.\n\nAnd replaced it with arrow function `() => {...}`.\n\
    \nFrom that moment on `this` keyword within the new anonymous event function started\
    \ to correctly refer to `this` keyword from the original `Sprite` object. Without\
    \ us having to write any extra binding code.\n\nAnd so... I think this concludes\
    \ our discussion of arrow functions. I hope you enjoyed this tutorial. Please\
    \ share it with your friends, on Twitter or on your Facebook page.\n\nDeveloper\
    \ Post is a small website dedicated to simple explanations of subjects that otherwise\
    \ appear complex. And hopefully this helps someone out there write better JavaScript\
    \ code.\n\nIf you want to learn more about ES6 Harmony, head to [What's new in\
