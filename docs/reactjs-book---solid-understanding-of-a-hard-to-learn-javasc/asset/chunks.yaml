    on your production server) this will compile just fine.


    Now that we know that this will work only as long as you have babel transpiler
    (babel.min.js) included in your project. (In order words, don''t attempt writing
    this in Notepad in some folder on your "Desktop" your development environment
    must be properly set up in order for this to compile, or at the very least babel.js
    should be included in SCRIPT tag on your page.) It uses internal JSX processor
    to convert this inline HTML into JavaScript.


    ### Function Purity


    Before we go into React props, I just wanted to mention one thing. In React props
    are read-only. And this has a lot to do with a particular type of a function called
    pure function. In traditional software development a pure function is one which
    does not internally change its arguments which are passed to it.


    For example,


    | // pure function; does not modify argument valuesfunction sum(a, b) { return
    a + b; } |


    This  is considered to be a pure function, because its body does not modify any
    of the parameters that were passed as arguments. On the other hand an example
    of an impure function is shown below:


    | // impure function; modifies value of the passed argument "total"function sub(total,
    less) { return total -= less; } |'
